  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “வானத்தை[a] நோக்கி உன் கையை நீட்டு; அப்பொழுது எகிப்து நாடு முழுவதிலும்—மனிதர்கள்மேலும்[b], விலங்குகள்மேலும், எகிப்து நாட்டின் வயலின் எல்லாச் செடிகள்மேலும்—ஆலங்கட்டி மழை பொழியட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானுலகத்தை நோக்கி.” எபிரெயச் சொல் ‘வானம்’ அல்லது ‘வானுலகம்/வானங்கள்’ எனப் பொருள்படலாம்; இங்கு ஆலங்கட்டி வரும் கண்ணுக்குப் புலப்படும் வானத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மனிதர்கள்’ என்பது இங்கு விலங்குகளுக்கு மாறாக மனித இனத்தாரைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: உன் கையை நீட்டு
  rationale: கட்டளை வடிவத்தையும் ‘கை’ என்ற நேரடியான பொருளையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: עַל הַשָּׁמַיִם
  choice: வானத்தை நோக்கி
  rationale: திசையைக் குறிக்கும் עַל என்பதையும், ஆலங்கட்டி வரும் கண்ணுக்குப் புலப்படும் வானத்தைக் குறிக்கும் שָׁמַיִם என்பதையும் சூழலுக்கேற்றவாறு தருகிறது.
- source_word: וִיהִי בָרָד
  choice: ஆலங்கட்டி பெய்யட்டும்
  rationale: விருப்பம் அல்லது கட்டளை சார்ந்த விளைவைத் தெரிவிக்கும் வடிவத்தை இயல்பான தமிழில் தருகிறது; ‘ஆலங்கட்டி’ என்பது வானிலையியல் நிகழ்வைத் தெளிவாகக் குறிக்கிறது.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாடு முழுவதிலும்
  rationale: כָּל குறிக்கும் முழுமையான பரப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָאָדָם
  choice: மனிதர்கள்
  rationale: இங்கு ஒருமை வடிவம் மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது; விலங்குகளோடு உள்ள வேறுபாட்டையும் இந்தப் பன்மைத் தமிழ் இயல்பாகப் பாதுகாக்கிறது.
- source_word: הַבְּהֵמָה
  choice: விலங்குகள்
  rationale: இச்சொல் இங்கு மனிதர்களுக்கு மாறாகக் குறிப்பிடப்படும் மிருகங்களைக் குறிக்கிறது; ‘விலங்குகள்’ என்பது சொல்லின் பரப்பை தேவையின்றிக் கால்நடைகளாக மட்டும் சுருக்காது.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: வயல்வெளிகளில் வளரும் எல்லாச் செடிகள்
  rationale: עֵשֶׂב என்பதன் புல், மூலிகை, தாவரம் ஆகிய பரந்த பொருளை ‘செடிகள்’ வாசிக்க எளிதாகத் தருகிறது; הַשָּׂדֶה என்ற இடத்தொடர்பும் வெளிப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது; குறிப்பிட்ட சமய மரபின் தனித்த விருப்பத்தைத் திணிக்காது.
- issue: הָאָדָם என்பதன் பொதுமனிதப் பொருள்
  choice: மனிதர்கள்
  alternative: மனிதன்; மனிதகுலம்
  rationale: எபிரெயச் சொல் இலக்கணத்தில் ஒருமையாக இருந்தாலும் இங்கு எல்லா மனிதர்களையும் பொதுவாகக் குறிக்கிறது. தமிழ் வாசகர்களுக்கு அந்தக் கூட்டு அர்த்தத்தை ‘மனிதர்கள்’ தெளிவாகத் தெரிவிக்கிறது.
- issue: וִיהִי என்பதன் கட்டளை/விளைவு நுட்பம்
  choice: பெய்யட்டும்
  alternative: பெய்யும்படி; உண்டாகட்டும்
  rationale: இறைவன் விரும்பிக் கட்டளையிடும் விளைவைக் காட்டுகிறது; இதை வெறும் எதிர்கால நிகழ்வாகவோ காரணவிளைவு கூற்றாகவோ மட்டும் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. எபிரெய மூலத்தின் எகிப்து குறித்த மீளுரைப்பும், மனிதர்கள்–விலங்குகள்–வயல்வெளிச் செடிகள் என்ற விரிவான வரிசையும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
