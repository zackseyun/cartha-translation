  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: ta
  text: 'யாவே மறுநாளில் இந்தக் காரியத்தைச் செய்தார். எகிப்தின் கால்நடைகள் அனைத்தும் இறந்துபோயின; ஆனால் இஸ்ரவேலரின்[a] கால்நடைகளில் ஒன்றுகூட இறக்கவில்லை.


    [a] எபிரெய மொழியில், “இஸ்ரவேலின் மகன்கள்.” இது இஸ்ரவேல் மக்களைக் குறிக்கும் மரபுத்தொடர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “இஸ்ரவேலின் மகன்கள்.” இது இஸ்ரவேல் மக்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וַיַּעַשׂ ... אֶת־הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தைச் செய்தார்
  rationale: எபிரெய மொழியின் நேரடியான செய் + காரியம் என்ற அமைப்பையும், தமிழின் இயல்பான மரியாதை ஒருமையையும் காக்கிறது.
- source_word: מִמָּחֳרָת
  choice: மறுநாளில்
  rationale: குறிப்பிடப்பட்ட நாளுக்கு அடுத்த நாளைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: כֹּל מִקְנֵה מִצְרַיִם
  choice: எகிப்தின் கால்நடைகள் அனைத்தும்
  rationale: מִקְנֶה என்பது மாடுகளை மட்டும் அல்லாமல் வளர்ப்பு மந்தை விலங்குகளைப் பரந்த வகையில் குறிக்கிறது; ‘கால்நடைகள்’ அந்தப் பரப்பைத் தக்கவைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இனக்குழுவைக் குறிக்கும் மரபுத்தொடர். ‘மக்கள்’ நவீன தமிழில் அதன் கூட்டுப்பொருளைத் தெளிவாக அளிக்கிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא מֵת אֶחָד
  choice: ஒன்றுகூட இறக்கவில்லை
  rationale: எந்த ஒரு கால்நடையும் இறக்கவில்லை என்ற வலியுறுத்தப்பட்ட மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் பட்டமல்ல, தனிப்பட்ட இறைப்பெயரே உள்ளது. எனவே அதை ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்த்து, பெயருக்கும் பட்டத்திற்கும் உள்ள வேறுபாட்டைக் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுப்பெயர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இத்தொடர் ஆண் தனிநபர்களை மட்டும் சுட்டாமல் இஸ்ரவேல் சமூகத்தைக் கூட்டாகக் குறிக்கிறது. இயல்பான தமிழுக்காக கூட்டுப்பொருள் முதன்மை உரையில் தரப்பட்டு, வடிவியல் நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறந்துபோயின’ என்பது கால்நடைகளுக்குரிய இயல்பான பன்மை வினை; ‘ஒன்றுகூட’ என்பது மூலத்தின் வலியுறுத்தப்பட்ட மறுப்பைப் பாதுகாக்கிறது. அடிக்குறி தொடர்புடைய சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
