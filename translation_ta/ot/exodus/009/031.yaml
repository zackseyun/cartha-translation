translation_notes:
  register: நவீன பொதுத்தமிழில், வேளாண்மைச் சூழல் தெளிவாகத் தெரியுமாறு மொழிபெயர்க்கப்பட்டுள்ளது. ‘அடித்து வீழ்த்தப்பட்டன’ என்பது ஆலங்கட்டி மழையின் தாக்கத்தைச் சூழலுக்கேற்ப வெளிப்படுத்துகிறது; அரிதான வளர்ச்சிநிலைச் சொற்களின் பொருள் அடிக்குறிப்புகளில் மாற்று வாசகங்களுடன் பாதுகாக்கப்பட்டுள்ளது.
