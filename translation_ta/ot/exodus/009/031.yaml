  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הַ/פִּשְׁתָּ֥ה וְ/הַ/שְּׂעֹרָ֖ה נֻכָּ֑תָה כִּ֤י הַ/שְּׂעֹרָה֙ אָבִ֔יב וְ/הַ/פִּשְׁתָּ֖ה גִּבְעֹֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/031.yaml
  text: And the flax and the barley were struck down[b][a], because the barley was in the ear and the flax was in bud.
translation:
  language: ta
  text: ஆளியும் வாற்கோதுமையும் அடித்து வீழ்த்தப்பட்டன. ஏனெனில், வாற்கோதுமை கதிர்விட்டிருந்தது[a]; ஆளி அரும்புவிட்டிருந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாற்கோதுமை முதிர்ந்துகொண்டிருந்தது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆளி பூத்திருந்தது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: ஆளி
  rationale: இச்சொல் நாரிலிருந்து துணி தயாரிக்கப்படும் flax பயிரைக் குறிக்கிறது. தமிழில் அந்தத் தாவரத்தைக் குறிக்கும் நேரடியான பெயர் ‘ஆளி’; ‘சணல்’ என்பது வேறு நார்ப்பயிர்களையும் குறிக்கக்கூடும்.
- source_word: הַשְּׂעֹרָה
  choice: வாற்கோதுமை
  rationale: இது barley என்னும் தானியப் பயிரைக் குறிக்கும் வழக்கமான நவீனத் தமிழ்ச் சொல்.
- source_word: נֻכָּתָה
  choice: அடித்து வீழ்த்தப்பட்டன
  rationale: נכה என்பதன் செயல்பாட்டு வினை வடிவம் ஆலங்கட்டி மழை பயிர்களைத் தாக்கி வீழ்த்தியதைத் தெளிவாகவும் காட்சிப்பூர்வமாகவும் காட்டுகிறது. கூட்டு எழுவாய்க்கேற்ப தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பயிர்கள் தாக்கப்பட்டதற்கான காரணத்தை அறிமுகப்படுத்துவதால், நவீனத் தமிழில் தெளிவான காரண இணைப்புச் சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אָבִיב
  choice: கதிர்விட்டிருந்தது
  rationale: தானியத்தின் கதிர் உருவாகி, அது இன்னும் இளமையாக அல்லது முதிரத் தொடங்கியிருந்த வளர்ச்சிக் கட்டத்தை இச்சொல் குறிக்கிறது. ‘கதிர்விட்டிருந்தது’ அதன் வேளாண்மைக் காட்சியைப் பாதுகாக்கிறது.
- source_word: גִּבְעֹל
  choice: அரும்புவிட்டிருந்தது
  rationale: ஆளி வளர்ச்சியின் முன்னேறிய கட்டத்தை—அரும்பு, பூ அல்லது விதைக்காய் உருவாகும் நிலையைக்—குறிக்கும் அரிதான சொல் இது. ‘அரும்புவிட்டிருந்தது’ இயல்பான தமிழில் பொருளைத் தருகிறது; மூலச்சொல்லைவிட அளவுக்கு மீறிய துல்லியத்தைத் தவிர்க்கிறது.
