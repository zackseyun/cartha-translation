base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: ta
  text: பார்வோன் அனுப்பினான்[a]. இதோ, இஸ்ரவேலரின் கால்நடைகளில் ஒன்றுகூடச் சாகவில்லை. ஆனாலும் பார்வோனின் மனம் கடினமாயிற்று[b]; அவன் மக்களைப் போகவிடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “பார்வோன் அனுப்பினான்”; யாரை அனுப்பினான், எதற்காக அனுப்பினான் என்பவை வெளிப்படையாகக் கூறப்படவில்லை.
    reason: implicit_object
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “பார்வோனின் இதயம் கனத்தது”; இது அவன் பிடிவாதமாக இருந்ததைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆள் அனுப்பி விசாரித்தான்
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பினான்’; யாரை அல்லது எதற்காக அனுப்பினான் என்பது எபிரெயத்தில் சொல்லப்படவில்லை. சூழலில், இஸ்ரவேலரின் கால்நடைகளின் நிலையை உறுதிப்படுத்த பார்வோன் ஆள் அனுப்பியதாகத் தெரிகிறது. தமிழில் இயல்பாக அமைய ‘ஆள் அனுப்பி விசாரித்தான்’ என மொழிபெயர்க்கப்பட்டுள்ளது; சேர்க்கப்பட்ட விளக்கம் அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה கண்டறியப்பட்ட வியப்பூட்டும் உண்மையின் மீது கவனத்தை ஈர்க்கும் உரையாடல் துகள். ‘இதோ’ அதன் கதைநடை வலிமையைத் தக்கவைக்கிறது.
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: இஸ்ரவேலரின் கால்நடைகளில் ஒன்றுகூடச் சாகவில்லை
  rationale: עַד אֶחָד என்பது ‘ஒன்றுகூட இல்லை’ என்ற வலியுறுத்தலைக் கொண்டது. மִקְנֶה எல்லா வளர்ப்பு விலங்குகளையும் குறிக்கும் பரந்த சொல் என்பதால் ‘கால்நடைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: பார்வோனின் மனம் இறுகியது
  rationale: எபிரெயம் சொல்லுக்கு சொல் ‘பார்வோனின் இதயம் கனத்தது’ என்கிறது. தமிழில் அது துயரத்தைக் குறிக்கும் தவறான எண்ணத்தைத் தரக்கூடும். ‘மனம் இறுகியது’ என்பது அவனுடைய பிடிவாத நிலையை இயல்பாகக் காட்டுவதோடு, அதற்கான வெளிப்புறச் செய்பவரைச் சேர்ப்பதில்லை.
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: அவன் மக்களைப் போகவிடவில்லை
  rationale: இச்சூழலில் שׁלח என்பது மக்களை விடுவித்து அனுப்புவதைக் குறிக்கிறது. ‘போகவிடவில்லை’ என்பது இயல்பான நவீனத் தமிழ் நடை.
theological_decisions:
- issue: பார்வோனின் மனம் இறுகியதில் யாருடைய செயலாற்றல் குறிப்பிடப்படுகிறது?
  choice: பார்வோனின் மனம் இறுகியது
  alternative: பார்வோன் தன் மனத்தைக் கடினப்படுத்திக்கொண்டான் / பார்வோனின் மனம் கடினப்படுத்தப்பட்டது
  rationale: இவ்வசனத்தில் பார்வோனின் மனமே இலக்கண எழுவாய்; அதை இறுகச் செய்த வெளிப்புறச் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. ஆகவே பார்வோனே நேரடியாகச் செய்தான் என்றோ, வேறொருவரால் அது செய்யப்பட்டது என்றோ மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு இயல்பாகவும் மரியாதைமிக்க கதைநடையிலும் வடிவமைக்கப்பட்டது. ‘இதோ’ மூலத்தின் கதைநடை வலியுறுத்தலைத் தக்கவைக்கிறது. ‘இதயம் கனத்தது’ தமிழில் துயரம் எனத் தவறாகப் புரியக்கூடியதால், செய்பவரைச் சேர்க்காமல் ‘மனம் இறுகியது’ பயன்படுத்தப்பட்டது.
