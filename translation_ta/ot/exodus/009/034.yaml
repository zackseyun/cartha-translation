base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: ta
  text: ஆனால் மழையும் ஆலங்கட்டியும் இடிமுழக்கங்களும் நின்றுவிட்டதைப் பார்வோன் கண்டபோது, அவன் தொடர்ந்து பாவம் செய்தான்; அவனும் அவனுடைய பணியாளர்களும் தங்கள் இருதயங்களைக் கடினப்படுத்தினர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘காணுதல்’ என்பதைக் காத்து, சூழ்நிலையை உணர்ந்ததையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חָדַל
  choice: நின்றுவிட்டதை
  rationale: חדל என்பது ‘நிறுத்து/ஓய்ந்துபோ’ எனப் பொருள்படும்; மழை, ஆலங்கட்டி, இடிமுழக்கம் ஆகிய அனைத்தும் முடிந்த நிலையை இவ்வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: הַקֹּלֹת
  choice: இடிமுழக்கங்கள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘குரல்கள்/ஒலிகள்’; ஆனால் புயல் சூழலில் இது இடியின் முழக்கங்களைக் குறிக்கிறது. பன்மை வடிவமும் காக்கப்படுகிறது.
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: தொடர்ந்து பாவம் செய்து
  rationale: יסף + வினையெச்ச அமைப்பு மீண்டும் செய்வதையோ தொடர்வதையோ குறிக்கிறது; இங்கு பார்வோனின் பாவம் தொடர்ந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: தன் இருதயத்தைக் கடினப்படுத்தினான்
  rationale: כבד என்பதன் நேரடிக் கருத்து ‘கனமாக்கு’; இவ்விடத்தில் அது பிடிவாதமாகவும் உணர்வற்றதாகவும் ஆக்குவதைச் சுட்டும் நிலையான உருவகம். ‘கடினப்படுத்தினான்’ யாத்திராகமத்தின் கருப்பொருள் தொடர்பைக் காக்கிறது.
- source_word: הוּא וַעֲבָדָיו
  choice: அவனும் அவனுடைய பணியாளர்களும்
  rationale: עבדים என்பது அடிமைகள், பணியாளர்கள் அல்லது அரச அலுவலர்கள் எனப் பொருள்படலாம். அரசவைக் சூழலில் ‘பணியாளர்கள்’ போதுமான பரப்பைத் தக்கவைத்து, தேவையற்ற குறிப்பாக்கத்தைத் தவிர்க்கிறது.
- source_word: וַ
  choice: ஆனால்
  rationale: தொடக்க வாவ் கதையை முன்னெடுத்தாலும், முந்தைய வசனத்தில் பார்வோன் காட்டிய மனமாற்றத்துக்கும் இச்செயலுக்கும் உள்ள எதிர்மறை மாறுபாட்டை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: இருதயத்தைக் கடினப்படுத்திய செயலின் முகமை மற்றும் இறுதிச் சொற்றொடரின் வரம்பு
  choice: பார்வோன் தன் இருதயத்தைக் கடினப்படுத்தினான் என்று வசனம் நேரடியாகக் கூறுகிறது; ‘அவனும் அவனுடைய பணியாளர்களும்’ என்ற இறுதிச் சொற்றொடரும் அப்படியே இணைக்கப்படுகிறது.
  alternative: இறுதிச் சொற்றொடர் கடினப்படுத்தும் செயலை மட்டும் கூட்டாகக் குறிக்கலாம்; அல்லது பார்வோனையும் அவன் அரசவையையும் வலியுறுத்தும் இணைப்பாக மட்டும் இருக்கலாம்.
  rationale: எபிரெய உரை முதலில் ஒருமையில் பார்வோனின் இருதயத்தைக் குறிப்பிடுகிறது; பின்னர் அவனையும் அவன் பணியாளர்களையும் சேர்க்கிறது. தெய்வீக மற்றும் மனித முகமை குறித்த விரிவான கோட்பாட்டை இவ்வசனத்துக்குள் புகுத்தாமல் அதன் இலக்கணத் தளர்வும் இறையியல் இழுப்பும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு புரியக்கூடிய கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. ‘பார்வோன்’, ‘இருதயம்’ ஆகிய பரிச்சயமான வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; ‘இடிமுழக்கங்கள்’ மூலத்தின் பன்மையையும் புயல் சூழலையும் வெளிப்படுத்துகிறது.
