base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/032.yaml
  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: ta
  text: ஆனால் கோதுமையும் குஸ்ஸெமேத் தானியமும்[a] தாக்கப்படவில்லை; ஏனெனில் அவை தாமதமாக முதிர்பவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குஸ்ஸெமேத்” என்பது ஸ்பெல்ட் அல்லது எம்மர் போன்ற தானிய வகையைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: ஆனால் கோதுமையும்
  rationale: חִטָּה என்பது கோதுமையைக் குறிக்கிறது. முந்தைய வசனத்தில் அழிந்த பயிர்களுடன் உள்ள எதிர்மறை ஒப்பீட்டை இயல்பான தமிழில் காட்ட, முறையாக ‘மற்றும்’ எனப் பொருள்படும் וְ இங்கு ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְהַכֻּסֶּמֶת
  choice: குஸ்ஸெமேத் தானியமும்
  rationale: כֻּסֶּמֶת என்பது ஸ்பெல்ட் அல்லது எம்மர் போன்ற ஒரு தானிய வகையைக் குறிக்கலாம்; துல்லியமான தாவரவியல் அடையாளம் உறுதியற்றதால், எதுவென்று தீர்மானித்துவிடாமல் எபிரெயப் பெயரை ஒலிபெயர்த்து ‘தானியம்’ என்று தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: לֹא נֻכּוּ
  choice: அடிபடவில்லை
  rationale: נכה என்பதன் செயப்பாட்டு வடிவம் ஆலங்கட்டியால் தாக்கப்படுதல் அல்லது சேதமடைதலைக் குறிக்கிறது. ‘அடிபடவில்லை’ என்பது தாக்குதல் என்ற படிமத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: כִּי இங்கு அந்தப் பயிர்கள் ஏன் தப்பின என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אֲפִילֹת הֵנָּה
  choice: அவை தாமதமாக முற்றுபவை
  rationale: இந்தச் சொற்றொடர் பயிர்கள் வளர்ச்சியில் பிந்திய நிலையில் இருந்ததை, அதாவது தாமதமாக முதிர்வதை, வேளாண்மைச் சூழலில் குறிக்கிறது. ‘முற்றுபவை’ என்பது தானியம் முழு வளர்ச்சி அடைவதை இயல்பாக வெளிப்படுத்துகிறது.
