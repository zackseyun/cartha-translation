base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: ta
  text: ஆகவே இப்போது[a], ஆளனுப்பி, வயல்வெளியில் இருக்கும் உன் கால்நடைகளையும் உனக்குச் சொந்தமான எல்லாவற்றையும் பாதுகாப்பான இடத்துக்குக் கொண்டுவரச் செய். வயல்வெளியில் காணப்படும், வீட்டுக்குள் சேர்க்கப்படாத ஒவ்வொரு மனிதர் மீதும் விலங்கு மீதும் ஆலங்கட்டி மழை பெய்யும்; அவை அனைத்தும் உயிரிழக்கும்.[b]
  philosophy: optimal-equivalence
