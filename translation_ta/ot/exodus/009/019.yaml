  - marker: a
    text: “இப்போதே” என்றும் மொழிபெயர்க்கலாம்; எபிரெயக் கட்டளை உடனடியாகச் செயல்பட வேண்டிய அவசரத்தைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கே “மனிதர்” என்பதற்கான எபிரெயச் சொல், வயல்வெளியில் இருக்கும் மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
