theological_decisions:
- issue: אָדָם என்ற ஒருமைத் தொகுப்புச் சொல்லின் பொதுப்பொருள்
  choice: மனிதர் ஒவ்வொருவர்
  alternative: ஒவ்வோர் ஆணும்
  rationale: இச்சூழலில் אָדָם பாலினத்தைச் சுட்டாமல் வயல்வெளியில் இருக்கும் எந்த மனிதரையும் குறிக்கிறது. தமிழ் ‘மனிதர்’ அந்த உண்மையான பொதுப்பொருளைத் துல்லியமாகப் பேணுகிறது; ‘ஒவ்வொருவர்’ כָּל என்பதன் பகிர்வுத் தன்மையை வெளிப்படுத்துகிறது.
- issue: שְׁלַח הָעֵז என்ற அரிதான கட்டளைத் தொடரின் பொருள்
  choice: ஆளனுப்பி ... பாதுகாப்பான இடத்துக்குக் கொண்டுவா
  alternative: உடனே அனுப்பிவை
  rationale: சூழலில் பார்வோன் தன் பணியாளர்கள் வழியாக கால்நடைகளையும் வெளியிலுள்ள உடைமைகளையும் உள்ளே சேர்க்கும்படி கட்டளையிட வேண்டும். மொழிபெயர்ப்பு அவசரத்தையும் பாதுகாப்பாகச் சேர்த்தலையும் காட்டுகிறது; ஆனால் செய்முறையைத் தேவையின்றி விரிவாக நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வயல்வெளி’, ‘கால்நடைகள்’, ‘வீட்டுக்குள் சேர்க்கப்படாத’ ஆகிய சொற்கள் மூலத்தின் படிமங்களையும் மீளுரைகளையும் பேணுகின்றன; மனிதர் மற்றும் விலங்குகளுக்கான ஒருமை–பகிர்வுக் கட்டமைப்பு தமிழில் இயல்பாகத் தெளிவாக்கப்பட்டுள்ளது.
