base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: ta
  text: கொப்புளங்கள் காரணமாக மந்திரவாதிகள் மோசேயின் முன்னிலையில் நிற்க முடியவில்லை. ஏனெனில் கொப்புளங்கள் மந்திரவாதிகள்மேலும் எகிப்தியர்கள் அனைவர்மேலும் இருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பட, “எகிப்து முழுவதிலும்.” இங்கு எகிப்து நாடெங்கும் இருந்த மக்களைச் சூழல் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: மந்திரவாதிகள்
  rationale: யாத்திராகமத்தில் இச்சொல் பார்வோனின் சடங்கு மற்றும் மாயவித்தை நிபுணர்களைக் குறிக்கிறது. நவீனத் தமிழில் ‘மந்திரவாதிகள்’ என்பது இக்கதைச் சூழலில் தெளிவான, வழக்கமான இணைச்சொல்.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: மோசேயின் முன்னிலையில் நிற்க
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தையும், மோசேயின் முன் வந்து நிற்கவோ தங்களை முன்னிறுத்தவோ முடியாத நிலை என்ற சூழல்சார் பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: கொப்புளங்கள் காரணமாக
  rationale: מִפְּנֵי இங்கு காரணத்தைக் குறிக்கிறது. שְׁחִין என்பது அழற்சியுற்ற தோல் கொப்புளங்களைக் குறிக்கும் ஒருமைத் தொகுப்புப்பெயர்; தமிழில் பன்மை இயல்பானது.
- source_word: הַשְּׁחִין
  choice: கொப்புளங்கள்
  rationale: பலருடைய உடலில் ஏற்பட்ட தோல் வெடிப்புகளைச் சுட்டும் தொகுப்புப் பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; வசனம் முழுவதும் ஒரே சொல்லாட்சி பேணப்படுகிறது.
- source_word: בַּחֲרְטֻמִּם
  choice: மந்திரவாதிகளுக்கும்
  rationale: உடலில் ஏற்பட்ட பாதிப்பைத் தமிழில் ‘அவர்களுக்கும் கொப்புளங்கள் இருந்தன’ என்று இயல்பாகச் சொல்வது, எபிரெய முன்னிடைச்சொல்லின் சூழல்சார் பொருளைத் தருகிறது.
- source_word: וּבְכָל מִצְרַיִם
  choice: எகிப்தியர்கள் அனைவருக்கும்
  rationale: எபிரெயம் சொற்பட ‘எகிப்து முழுவதிலும்’ என்று இருந்தாலும், மந்திரவாதிகளுடன் அமைந்த இணைநிலையும் உடல் நோயின் சூழலும் மக்களைக் குறிக்கின்றன. அதைத் தமிழில் வெளிப்படையாகக் கூறி, சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
