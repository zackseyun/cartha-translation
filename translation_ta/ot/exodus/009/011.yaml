revisions:
- from: கொப்புளங்கள் காரணமாக மந்திரவாதிகளால் மோசேயின் முன்னிலையில் நிற்க முடியவில்லை. ஏனெனில் மந்திரவாதிகளுக்கும் எகிப்தியர்கள் அனைவருக்கும் கொப்புளங்கள் இருந்தன.[a]
  to: கொப்புளங்கள் காரணமாக மந்திரவாதிகள் மோசேயின் முன்னிலையில் நிற்க முடியவில்லை. ஏனெனில் கொப்புளங்கள் மந்திரவாதிகள்மேலும் எகிப்தியர்கள் அனைவர்மேலும் இருந்தன.[a]
  rationale: The revision preserves the source’s meaning and the audit trail while using a more direct Tamil subject construction and making the bodily force of the final parallel more explicit. The footnote continues to preserve the Hebrew’s literal geographic expression.
