  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: ta
  text: ஆனால் யாவேயின் வார்த்தையை மனதில் கொள்ளாதவன் தன் பணியாளர்களையும் தன் கால்நடைகளையும் வயலில் விட்டுவிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நெருக்கமாக: “யாவேயின் வார்த்தையின்மேல் தன் இருதயத்தை வைக்காதவன்”; அதாவது, அதை மனதில் ஏற்றுப் பொருட்படுத்தாதவன்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: ஆனால் ... அவன்
  rationale: முந்தைய வசனத்தில் எச்சரிக்கைக்குக் கீழ்ப்படிந்தவர்களோடு இக்குழுவை வேறுபடுத்தும் எதிர்மறைத் தொடர்ச்சியையும், எவரைக் குறித்தும் பொருந்தும் உறவுத்தொடரின் தன்மையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: மனதில் கொள்ளாதவன்
  rationale: சொல்லுக்கு நெருக்கமாக ‘தன் இருதயத்தை ... நோக்கி வைக்கவில்லை’ என்ற எபிரேய மரபுத்தொடர், இங்கு எச்சரிக்கையைப் பொருட்படுத்தாமல் தீவிரமாக எடுத்துக்கொள்ளாததைக் குறிக்கிறது. ‘மனதில் கொள்ளாதவன்’ என்பது உருவகத்தின் ஒரு பகுதியையும் நடைமுறைப் பொருளையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யெகோவாவின் வார்த்தை
  rationale: דָּבָר இச்சூழலில் அறிவிக்கப்பட்ட எச்சரிக்கை அல்லது சொல் என்பதைக் குறிக்கிறது; ‘வார்த்தை’ வழக்கமான வேதாகமச் சொல்லாட்சியையும் மூலத்தின் விரிவான பொருள் வாய்ப்பையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் தருகிறது.
- source_word: וַיַּעֲזֹב
  choice: விட்டுவைத்தான்
  rationale: பணியாளர்களையும் கால்நடைகளையும் வரவிருக்கும் ஆலங்கட்டிக்கு வெளிப்படையாக வயலில் இருக்கவிட்ட concrete செயலைத் தெளிவாகக் காட்டுகிறது; ‘கைவிட்டான்’ என்பதில் தோன்றக்கூடிய கூடுதல் உணர்ச்சிப் பொருளைத் தவிர்க்கிறது.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்கள்
  rationale: עֶבֶד அடிமை அல்லது பணியாளர் எனப் பொருள்படலாம். இங்கு அவர்களின் சட்டநிலை அல்ல, வயலில் விடப்பட்ட வீட்டார்/வேலையாட்கள் என்பதே மையம்; ‘பணியாளர்கள்’ சூழலுக்கு ஏற்ற, தற்போதைய மரியாதையான சொல்.
- source_word: מִקְנֵהוּ
  choice: தன் கால்நடைகள்
  rationale: வளர்ப்பு மந்தை விலங்குகளைப் பொதுவாகக் குறிக்கும் பெயர்ச்சொல்லுக்கு ‘கால்நடைகள்’ துல்லியமான நவீன தமிழ்ச் சமச்சீர்.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியிலேயே
  rationale: இடப்பொருளைத் தெளிவாகத் தருவதோடு, எச்சரிக்கப்பட்டும் அவை வெளியேதான் இருக்கவிடப்பட்டன என்ற சூழல்சார் வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் தனிப்பெயரான திருநான்கெழுத்து நேரடியாக உள்ளது. அதனைப் பட்டப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராகவே தருவது மூல வேறுபாட்டைக் காக்கிறது; தமிழ் வாசகர்களிடையே நிலைபெற்ற ஒலிப்பெயர்ப்பு ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடையைப் பயன்படுத்துகிறது. எபிரேய மரபுத்தொடரின் ‘இருதயம்’ உருவகம் அடிக்குறிப்பில் காக்கப்பட்டு, முதன்மை உரையில் இயல்பான ‘மனதில் கொள்ளாதவன்’ தரப்பட்டுள்ளது. ஒருமை வினைச்சொல் மூலத்தின் இலக்கண வடிவத்தைப் பின்பற்றுகிறது.
