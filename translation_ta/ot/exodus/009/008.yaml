base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: ta
  text: பின்பு யாவே மோசேயிடமும் ஆரோனிடமும், “நீங்கள் சூளையிலிருந்து இரு கைப்பிடிகள் நிறைய[a] புகைக்கரித் தூளை[b] எடுத்துக்கொள்ளுங்கள். மோசே அதை பார்வோன் காணும்படி வானத்தை நோக்கி[c] வீசட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கைகள் நிறைய”; சொல்லர்த்தமாக, “உங்கள் கைகளின் நிறைவு.”
    reason: lexical_alternative
  - marker: b
    text: “புகைக்கரித் தூள்” என்பதை “நுண்ணிய கரித்தூள்” அல்லது பொதுவாக “சாம்பல்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் எபிரெயச் சொல் சூளையின் புகைக்கரியை இன்னும் குறிப்பாகச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “வானத்தை நோக்கி மேலே.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: אמר என்ற வழக்கமான பேச்சு வினையை, மேற்கோளுக்குப் பின் வரும் இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: קְחוּ לָכֶם
  choice: எடுத்துக்கொள்ளுங்கள்
  rationale: பன்மை கட்டளையையும் לָכֶם தரும் தமக்கென எடுத்துக்கொள்ளும் நுணுக்கத்தையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: מְלֹא חָפְנֵיכֶם
  choice: உங்கள் கைகள் நிறைய
  rationale: கைகளில் கொள்ளும் அளவைத் தெளிவாகக் காட்டுவதோடு, மூலத்தின் பன்மையையும் இயன்றவரை காக்கிறது.
- source_word: פִּיחַ
  choice: புகைக்கரித் தூள்
  rationale: பொதுவான சாம்பலைவிட, சூளையில் படியும் நுண்ணிய கரியத் தூளைச் சுட்டும் சொல்லாகும்.
- source_word: כִּבְשָׁן
  choice: சூளை
  rationale: சுடுவதற்கோ உருக்குவதற்கோ பயன்படும் furnace அல்லது kiln என்பதைக் குறிப்பிட்ட வகையாக மிகைப்படுத்தாமல் கூறும் இயல்பான தமிழ்ச்சொல்.
- source_word: וּזְרָקוֹ מֹשֶׁה
  choice: மோசே அதை ... வீசட்டும்
  rationale: முதலில் இருவருக்கும் பன்மையில் கொடுக்கப்பட்ட கட்டளையிலிருந்து, செய்பவராக மோசே மட்டும் குறிப்பிடப்படும் ஒருமை மாற்றத்தைப் பாதுகாக்கிறது.
- source_word: הַשָּׁמַיְמָה
  choice: வானத்தை நோக்கி
  rationale: திசையைக் குறிக்கும் எபிரெய வடிவத்தின் மேல்நோக்கிய இயக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; இங்கு உடல் சார்ந்த செயல் என்பதால் அளவுக்கு மீறிய இறையியல் பொருள் சேர்க்கப்படவில்லை.
- source_word: לְעֵינֵי פַרְעֹה
  choice: பார்வோனின் கண்களுக்கு முன்பாக
  rationale: பார்வோன் தெளிவாகக் காணும்படி செயல் நடைபெறுவதைச் சொல்லும் மூலத்தின் உயிரோட்டமான சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, தெய்வீகப் பெயரையே பயன்படுத்துகிறது. ஆகவே அதை மறைக்காமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது; மாற்று உச்சரிப்பு மரபுகளில் ஒன்றை உறுதியான மூல உச்சரிப்பாக முன்வைக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் வேதவாக்கியத்துக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. மேற்கோள் தமிழின் இயல்பான சொல்வரிசைக்கு ஏற்ப முன்வைக்கப்பட்டு, பேச்சு வினை இறுதியில் வைக்கப்பட்டுள்ளது. இருவருக்கான பன்மைக் கட்டளையிலிருந்து மோசே மட்டும் செய்பவராக மாறும் மூல உரையின் இலக்கண மாற்றம் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
