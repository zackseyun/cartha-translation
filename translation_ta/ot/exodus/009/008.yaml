  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் அனைத்தும் உள்ளன: யாவே, மோசே மற்றும் ஆரோன், பன்மைக் கட்டளை, சூளையின் புகைக்கரி, பின்னர் மோசே மட்டும் வீசுதல், பார்வோனின் கண்முன் நிகழ்தல். ஆனால் מְלֹא חָפְנֵיכֶם என்பது இரு கைகளின் உள்ளங்கைகள் நிரம்பும் அளவைச் சுட்டுகிறது; “உங்கள் கைகள் நிறைய” என்பது தமிழில் சற்றே தளர்வாகவும் இயல்பற்றதாகவும் உள்ளது. “இரு கைப்பிடிகள் நிறைய” இதனைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.'
