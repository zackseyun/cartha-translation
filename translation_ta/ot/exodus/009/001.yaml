revisions:
- from: 'அப்போது ஆண்டவர் மோசேயிடம், “பார்வோனிடம் சென்று அவனிடம் சொல்: ‘எபிரெயரின் கடவுளாகிய ஆண்டவர் கூறுவது இதுவே: என் மக்கள் எனக்குப் பணி செய்யும்படி அவர்களைப் போகவிடு.’” என்றார்.'
  to: 'அப்போது ஆண்டவர் மோசேயிடம், “பார்வோனிடம் சென்று அவனிடம் பேசு: ‘எபிரெயரின் கடவுளாகிய ஆண்டவர் கூறுவது இதுவே: என் மக்கள் எனக்குச் சேவை செய்யும்படி அவர்களைப் போகவிடு.’” என்றார்.'
  rationale: 'The revision makes only safe, source-based refinements: it renders “speak to him” distinctly, improves Tamil object placement, and uses “சேவை செய்ய” for the broad semantic range of עבד. The divine-name convention, the Hebrew ethnonym, and the purpose clause remain intact. No footnote is required.'
