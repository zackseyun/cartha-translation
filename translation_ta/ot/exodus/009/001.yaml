id: EXO.9.1
reference: Exodus 9:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: ta
  text: 'அப்போது ஆண்டவர் மோசேயிடம், “பார்வோனிடம் சென்று அவனிடம் பேசு: ‘எபிரெயரின் கடவுளாகிய ஆண்டவர் கூறுவது இதுவே: என் மக்கள் எனக்குச் சேவை செய்யும்படி அவர்களைப் போகவிடு.’” என்றார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: பார்வோனிடம் சென்று
  rationale: எபிரெய மொழியில் சொற்பொருளாக ‘பார்வோனிடம் வா/உள்ளே போ’ என்றிருந்தாலும், அனுப்பும் கட்டளையின் இயல்பை நவீன தமிழில் இயல்பாகத் தெரிவிக்க ‘சென்று’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயருக்கு, தமிழ் வேதாகம நடையில் பரவலாக அறியப்படும் மரியாதைமிக்க ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: எபிரெயரின் கடவுள்
  rationale: இணைப்புநிலைக் கட்டமைப்பை நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: என் மக்கள் ... அவர்களைப் போகவிடு
  rationale: שׁלח என்பதன் இச்சூழலுக்குரிய விடுவித்து அனுப்புதல் என்ற பொருளை ‘போகவிடு’ தெளிவாகத் தருகிறது; தமிழ் இலக்கணத் தெளிவுக்காக ‘அவர்களை’ மீண்டும் குறிப்பிடப்பட்டது.
- source_word: וְיַעַבְדֻנִי
  choice: எனக்குப் பணி செய்யும்படி
  rationale: עבד என்பது பணி செய்தல், சேவித்தல், வழிபடுதல் ஆகிய பொருள் பரப்பைக் கொண்டது. ‘பணி செய்ய’ என்பது அந்த விரிவைத் திறந்துவைத்து, வழிபாடு என்ற ஒன்றிலேயே பொருளைக் குறுக்காமல் உள்ளது.
theological_decisions:
- issue: וְיַעַבְדֻנִי என்பதன் சேவை/வழிபாடு பொருள்
  choice: எனக்குப் பணி செய்யும்படி
  alternative: என்னை வழிபடும்படி
  rationale: மூல வினைச்சொல் அடிமைப் பணி, சேவை, வழிபாடு ஆகியவற்றை உள்ளடக்கக்கூடும். இங்கு எகிப்துக்கான கட்டாயப் பணியிலிருந்து ஆண்டவருக்கான பணிக்குச் செல்லும் இறையியல் எதிர்மறைத் தொடர்பையும், வழிபாட்டு நோக்கையும் ஒரே நேரத்தில் தாங்கக்கூடிய பரந்த மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: יהוה என்ற தெய்வீகப் பெயரின் வடிவம்
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: வாசிப்பில் இயல்பும் தமிழ் மரபில் பரிச்சயமும் காக்கப்பட்டன; ஒரு குறிப்பிட்ட உச்சரிப்பை மூல உரை தீர்மானிப்பதாகக் காட்டாமல் தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. நேரடி உரையின் அடுக்குகள் தெளிவாக வைக்கப்பட்டுள்ளன; தேவையற்ற விளக்கவுரை சேர்க்கப்படவில்லை.
