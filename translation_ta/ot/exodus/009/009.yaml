base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: ta
  text: அது எகிப்து நாடு முழுவதிலும் நுண்தூசியாகும்; எகிப்து நாடெங்கும் மனிதர்கள்மீதும்[a] விலங்குகள்மீதும் கொப்புளங்களுடன் வெடித்தெழும் புண்களாகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதகுலத்தின்மீதும்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் மனிதர்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; அது விலங்குகளுடன் எதிரிணையாக வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “கொப்புளங்களுடன் வெடித்தெழும் புண்கள்” என்ற படிமம் உள்ளது. தோல் நோயின் சூழலில், புண்கள் கொப்புளங்களுடன் தோன்றுவதைக் குறிக்கிறது.
    reason: lexical_metaphor
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: நுண்தூசியாகும்
  rationale: היה இங்கு நிலைமாற்றத்தைக் குறிக்கிறது; אָבָק என்பது காற்றில் பரவும் நுண்ணிய தூசி அல்லது பொடியைக் குறிக்கிறது.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடு முழுவதிலும்
  rationale: עַל என்ற முன்னிடைச்சொல்லும் முழு நிலப்பரப்பைக் குறிக்கும் சொற்றொடரும், தூசி எகிப்து எங்கும் பரவுவதை இயல்பான தமிழில் தெரிவிக்கின்றன.
- source_word: עַל הָאָדָם
  choice: மனிதர்கள்மீதும்
  rationale: אָדָם இங்கு தனி ஆணைக் குறிக்காமல், விலங்குகளுடன் வேறுபடுத்திக் காட்டப்படும் மனிதர்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: וְעַל הַבְּהֵמָה
  choice: விலங்குகள்மீதும்
  rationale: בְּהֵמָה இங்கு கூட்டுப்பொருளில் மனிதர்களுக்கு எதிரிணையாக வருகிறது; ‘கால்நடைகள்’ என்று குறுக்காமல் ‘விலங்குகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לִשְׁחִין
  choice: புண்களாகும்
  rationale: שְׁחִין என்பது தோலில் உண்டாகும் வெடிப்புப் புண்ணைக் குறிக்கிறது; தொடரும் சொற்களுடன் இயல்பாக இணைய தமிழில் பன்மை பயன்படுத்தப்பட்டது.
- source_word: פֹּרֵחַ
  choice: வெடித்தெழும்
  rationale: இதன் நேரடிப் படிமம் முளைத்தல் அல்லது மலர்தல்; தோல் நோயின் சூழலில் திடீரெனத் தோன்றி பரவுவதை ‘வெடித்தெழும்’ இயல்பாகக் காட்டுகிறது.
- source_word: אֲבַעְבֻּעֹת
  choice: கொப்புளங்கள்
  rationale: இந்தச் சொல் புண்களுடன் தோன்றும் வீங்கிய கொப்புளங்களைக் குறிக்கிறது; இது தெளிவான நவீனத் தமிழ் சொல்.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடெங்கும்
  rationale: மீண்டும் வரும் நிலப்பரப்புச் சொற்றொடர் வாதை எகிப்து முழுவதும் பரவுவதை வலியுறுத்துகிறது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுவான மனிதக் குறிப்பு
  choice: மனிதர்கள்
  alternative: மனிதகுலம்
  rationale: இங்கு ஆண் பாலினத்தவர் மட்டும் அல்லாமல் மனிதர்கள் அனைவரும் குறிக்கப்படுகிறார்கள். ‘மனிதர்கள்’ என்பது விலங்குகளுடனான எதிரிணையையும் இயல்பான தமிழில் காக்கிறது.
- issue: שְׁחִין פֹּרֵחַ אֲבַעְבֻּעֹת என்ற நோய்விளக்கத்தின் கூறுகள்
  choice: கொப்புளங்கள் வெடித்தெழும் புண்கள்
  alternative: கொப்புளப் புண்கள்
  rationale: சுருக்கமான மாற்று இயல்பாக இருந்தாலும், அது פֹּרֵחַ என்பதன் வெடித்தெழும் இயக்கத்தைக் காட்டாது. மூன்று எபிரெயக் கூறுகளும் மொழிபெயர்ப்பில் தனித்தனியாகப் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் வகையிலும் வேத உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. எபிரெய உரையின் இரு விளைவுக் கூறுகளையும் முழு எகிப்தை வலியுறுத்தும் மறுபடியும் வரும் சொற்றொடரையும் காத்துள்ளது.
