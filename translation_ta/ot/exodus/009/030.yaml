base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: ta
  text: ஆனால் நீயும் உன் பணியாளர்களும் இன்னும்[a] யாவே[b] தேவனுக்குப் பயப்படவில்லை என்பதை நான் அறிவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இன்னும் பயப்படவில்லை’ என்பதற்குப் பதிலாக, ‘தொடர்ந்தும் பயப்படவில்லை’ அல்லது ‘யாவே தேவனுக்குப் பயப்படுவதற்கு முன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சூழலில் ‘முன்’ என்ற கால முன்னுரிமையையோ ‘இன்னும் இல்லை’ என்ற பொருளையோ தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் YHWH என்ற தேவனுடைய தனிப்பெயர் உள்ளது; இங்கு அது ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַתָּה
  choice: ஆனால் நீயும்
  rationale: இணைப்புச்சொல்லும் தனிப்பட்ட சுட்டுப்பெயரும் முந்தைய கூற்றுடன் முரண்பாட்டையும் புதிய மையப்பொருளையும் காட்டுகின்றன; ‘ஆனால் நீயும்’ என்பது தமிழில் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַעֲבָדֶיךָ
  choice: உன் பணியாளர்களும்
  rationale: עֶבֶד என்பதற்கு பணியாளர், ஊழியர், அடிமை ஆகிய பொருள்கள் உண்டு. பார்வோனின் அரசவைச் சூழலில் ‘பணியாளர்கள்’ என்பது அவருடைய அதிகாரிகளையும் ஏவலர்களையும் உள்ளடக்கும் இயல்பான, அளவுக்கு மீறாத சொல்.
- source_word: יָדַעְתִּי
  choice: நான் அறிவேன்
  rationale: இங்குள்ள நிறைவுற்ற வினை வடிவம் மோசேயின் தற்போதைய உறுதியான அறிதலைக் குறிக்கிறது; தமிழ் நிகழ்காலம் இதைத் தெளிவாகத் தருகிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: மோசே அறிந்திருக்கும் கூற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால், தமிழில் பெயரெச்சத் தொடர்புடன் ‘என்பதை’ இயல்பாக அமைகிறது.
- source_word: טֶרֶם
  choice: இன்னும் … இல்லை
  rationale: தொடரும் நிறைவுறா வினையுடன் இச்சொல், அவர்கள் இதுவரை தேவனுக்குப் பயப்படவில்லை என்ற காலநிலையைத் தருகிறது. அதேவேளை ‘பயப்படுவதற்கு முன்’ என்ற சொற்பொருள் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: תִּירְאוּן
  choice: பயப்படவில்லை
  rationale: ירא என்பது அச்சம், பயபக்தி, மதிப்புடன் கூடிய அஞ்சுதல் ஆகியவற்றை உள்ளடக்கக்கூடும். ‘பயப்படுதல்’ அச்சத்துக்கும் பயபக்திக்கும் இடையிலான மூலமொழியின் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- source_word: מִפְּנֵי
  choice: யாவே தேவனுக்குப்
  rationale: சொற்பட ‘முகத்திற்கு முன்பாக/சந்நிதியில்’ என்ற இடைச்சொல், ירא உடன் சேரும்போது ஒருவருக்குப் பயப்படுதல் என்ற தமிழ் வேற்றுமை அமைப்பால் இயல்பாக வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: இங்கு தெய்வீகப் பெயருடன் இணைந்து நிற்கும் அடையாளப் பெயராக உள்ளது; ‘யாவே தேவன்’ என்பது முழு எபிரெயச் சொல்லாட்சியைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் YHWH என்ற தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ அந்தப் பெயரைப் பட்டப்பெயராக மாற்றாமல் காக்கிறது; ‘யெகோவா’ என்ற பிற்கால கலப்பு உச்சரிப்பையும் தவிர்க்கிறது.
- issue: தேவனைச் சார்ந்த ירא என்பதன் நுட்பம்
  choice: பயப்படுதல்
  alternative: பயபக்தி கொள்ளுதல்; அஞ்சுதல்
  rationale: பார்வோன் தேவனுடைய நியாயத்தீர்ப்பை எதிர்கொண்டும் உரிய முறையில் பதிலளிக்காததை வசனம் கூறுகிறது. ‘பயப்படுதல்’ வெறும் பீதியாகவோ வெறும் மரியாதையாகவோ பொருளைச் சுருக்காமல் இரு நுட்பங்களையும் திறந்துவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘பணியாளர்கள்’ அரசவைச் சூழலுக்கு ஏற்ற பரந்த சொல்லாகவும், ‘பயப்படுதல்’ மூலமொழியிலுள்ள அச்சம்–பயபக்தி இருமையைப் பாதுகாக்கும் சொல்லாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
