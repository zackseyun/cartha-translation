base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: ta
  text: யாவேயிடம் மன்றாடுங்கள். கடவுளின் இடிமுழக்கமும்[a] ஆலங்கட்டி மழையும் போதும். அப்போது நான் உங்களைப் போகவிடுவேன்; நீங்கள் இனிமேல் இங்கே தங்கியிருக்கமாட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, ‘கடவுளின் குரல்களும் ஆலங்கட்டியும்.’ இங்கே ‘குரல்கள்’ என்பது புயலின் இடிமுழக்கங்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: மன்றாடுங்கள்
  rationale: עתר என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவம் இச்சூழலில் ஒருவருக்காக ஊக்கமாக வேண்டிக்கொள்வதைக் குறிக்கிறது. ‘மன்றாடுங்கள்’ என்பது பார்வோனின் தீவிர வேண்டுகோளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: וְרַב מִהְיֹת
  choice: போதும்
  rationale: ‘இருப்பதற்கு மிகுதி’ என்ற எபிரெய மரபுத்தொடர் இங்கே நிகழ்ந்தது போதும், அது நிறுத்தப்பட வேண்டும் என்ற வேண்டுகோளைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: קֹלֹת אֱלֹהִים
  choice: கடவுளின் இடிமுழக்கம்
  rationale: קֹלֹת என்பதன் நேரடிப் பொருள் ‘குரல்கள்/ஒலிகள்’; ஆலங்கட்டி மழைப் புயலின் சூழலில் அது இடிமுழக்கத்தைக் குறிக்கிறது. உடைமைத் தொடர்பைத் தக்கவைத்து தெய்வீகத் தோற்றத்தையும் வெளிப்படுத்துகிறது.
- source_word: וּבָרָד
  choice: ஆலங்கட்டி மழை
  rationale: בָּרָד என்பதற்கான இயல்பான, பொதுவாகப் புரியும் தமிழ்ச் சொற்றொடர்.
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: அப்போது நான் உங்களைப் போகவிடுவேன்
  rationale: யாத்திராகமத்தின் இச்சூழலில் שלח என்பது மக்களை விடுவித்துப் போக அனுமதிப்பதைக் குறிக்கிறது; ‘அப்போது’ வேண்டுதல் நிறைவேறிய பின் வரும் விளைவை இயல்பாக இணைக்கிறது.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: நீங்கள் இனிமேல் இங்கே தங்கியிருக்கமாட்டீர்கள்
  rationale: ‘நிற்கும்படி இனி சேர்க்கமாட்டீர்கள்’ என்ற சொற்படியான அமைப்பு, தொடர்ந்து தங்காமல் இருப்பதைக் குறிக்கும் மரபுத்தொடர். சூழலால் தெளிவாகும் இடத்தை ‘இங்கே’ என வெளிப்படுத்துவது இயல்பான தமிழை அளிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: தெய்வீகப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது; ‘யாவே’ என்பது மூல எபிரெயப் பெயரின் நவீன அறிவார்ந்த ஒலிப்புக்கு அருகான தமிழாக்கம்.
- issue: קֹלֹת אֱלֹהִים என்பதன் பொருள்
  choice: கடவுளின் இடிமுழக்கம்
  alternative: கடவுளின் குரல்கள்; கடவுளின் முழக்கங்கள்
  rationale: ‘குரல்கள்’ என்ற நேரடிப் பொருளின் உருவகத்தை அடிக்குறிப்பில் பாதுகாத்தபடி, ஆலங்கட்டி மழைச் சூழலில் குறிப்பது இடியையே என முதன்மை உரையில் தெளிவுபடுத்துகிறது. ‘கடவுளின்’ என்பது மூலத்தின் இறையியல் தொடர்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பார்வோனின் அவசரமான வேண்டுகோளும் அதனைத் தொடர்ந்து வரும் வாக்குறுதியும் குறுகிய, நேரடியான வாக்கியங்களால் வெளிப்படுத்தப்பட்டுள்ளன.
