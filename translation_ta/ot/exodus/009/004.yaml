  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: ta
  text: ஆனால் யாவே இஸ்ரவேலின் கால்நடைகளுக்கும் எகிப்தின் கால்நடைகளுக்கும் இடையே வேறுபாடு காட்டுவார்; இஸ்ரவேல் மக்களுக்குச் சொந்தமானவற்றில் ஒன்றுகூடச் சாகாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִפְלָה
  choice: வேறுபாடு காட்டுவார்
  rationale: பִּלְא வேரின் ஹிஃபில் வடிவம் இங்கு இரு குழுக்களுக்கிடையே தெளிவான வேறுபாட்டை ஏற்படுத்துவதைக் குறிக்கிறது. ‘வேறுபாடு காட்டுவார்’ என்பது காரணவினை நுணுக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בֵּין ... וּבֵין
  choice: '...க்கும் ...க்கும் இடையே'
  rationale: இரு சாராரை ஒப்பிட்டு வேறுபடுத்தும் எபிரெய இணைப்பின் இயல்பான தமிழ் வடிவம்.
- source_word: מִקְנֵה
  choice: கால்நடைகள்
  rationale: இந்தச் சொல் மாடுகளை மட்டும் அல்லாமல் வளர்க்கப்படும் விலங்குகளைப் பொதுவாகக் குறிக்கிறது; ‘கால்நடைகள்’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: מִצְרָיִם
  choice: எகிப்து
  rationale: ‘எகிப்தின் கால்நடைகள்’ என்பது மூலத்தின் நாட்டுப்பெயர் சார்ந்த கட்டமைப்பை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וְלֹא יָמוּת מִכָּל ... דָּבָר
  choice: '...வற்றில் ஒன்றுகூடச் சாகாது'
  rationale: எதிர்மறை வினையுடன் வரும் מִכָּל மற்றும் ஒருமை דָּבָר ஆகியவற்றின் வலியுறுத்தலை ‘ஒன்றுகூட’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்குச் சொந்தமான
  rationale: לְ இங்கு உடைமையுறவைச் சுட்டுகிறது. בְּנֵי יִשְׂרָאֵל என்பது முழு தேசிய மக்களையும் குறிக்கும் நிலையான தொடர் என்பதால், ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற தேசியத் தொடரை வழங்குதல்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலர்
  rationale: சொல்லளவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ பாலினத்தைத் தேவையின்றிக் குறுக்காமல் அதன் தேசியப் பொருளைத் தெளிவாக வழங்குகிறது.
- issue: இறுதி வாக்கியப்பகுதியின் தொடர்பு
  choice: இணை விளைவு வாக்கியமாக அரைப்புள்ளியுடன் வழங்கப்பட்டது
  alternative: ‘அதனால்’ அல்லது ‘அவ்வாறு’ என்று விளைவை வெளிப்படையாக்குதல்
  rationale: எபிரெயில் வெறும் וְ இணைப்பு உள்ளது; விளைவு உறவு சூழலால் உணரப்பட்டாலும் இலக்கணத்தில் வெளிப்படையாகச் சொல்லப்படவில்லை. ஆகவே மூலத்தின் தெளிவின்மையைச் சற்றே பாதுகாக்கும் வகையில் இணைப்பு மிகைப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘கால்நடைகள்’, ‘வேறுபாடு காட்டுவார்’, ‘ஒன்றுகூடச் சாகாது’ ஆகியவை மூலத்தின் பரப்பு மற்றும் வலியுறுத்தலை இயல்பாகக் காக்கின்றன.
