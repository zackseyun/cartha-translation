base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: ta
  text: பார்வோனுடைய பணியாளர்களில் யாவேவின் வார்த்தைக்கு அஞ்சியவர், தம் பணியாளர்களையும் கால்நடைகளையும் வீடுகளுக்குள் விரைவாகச் செல்லச் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தப்பியோடச் செய்தார்”; அதாவது, அவர்களை விரைவாகப் புகலிடத்திற்குள் செல்லச் செய்தார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  choice: பயந்தவர்
  rationale: பெயர்ச்சொல் பொருளில் வரும் இப்பெயரெச்சம், பார்வோனின் பணியாளர்களில் யெகோவாவின் வார்த்தைக்குப் பயந்த ஒருவரையோ ஒவ்வொருவரையோ வகையாகக் குறிக்கிறது. தமிழில் ஒருமை பொதுப்பொருளுடைய ‘பயந்தவர்’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யெகோவாவின் வார்த்தை
  rationale: דָּבָר என்பதன் ‘வார்த்தை/செய்தி’ என்ற பரந்த பொருளையும் நிலையான வேதாகமச் சொல்லாட்சியையும் காக்கிறது; ‘எச்சரிக்கை’ என்பது சூழலில் சரியானாலும் மூலத்தைவிடக் குறுகிய விளக்கம்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் இறைபெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: பார்வோனுடைய பணியாளர்களில்
  rationale: מִן இங்கு ஒரு பெரிய குழுவிலிருந்து ஒருவரைக் குறிக்கும் பகுதிப்பொருளில் உள்ளது; ‘பணியாளர்களில்’ அதனைத் தெளிவாகக் காட்டுகிறது.
- source_word: הֵנִיס
  choice: விரைந்து கொண்டுவந்தார்
  rationale: נוּס என்பதன் ஹிஃபீல் வடிவம் ‘தப்பியோடச் செய்தல்/விரட்டிச் செல்லச் செய்தல்’ எனும் காரணப்பொருளைக் கொண்டது. ஆலங்கட்டிக்கு முன் மனிதர்களையும் விலங்குகளையும் புகலிடத்திற்குள் நகர்த்திய சூழலில், ‘விரைந்து கொண்டுவந்தார்’ அதன் அவசரத்தையும் இயக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: עֲבָדָיו
  choice: தம் பணியாளர்கள்
  rationale: இங்கு எகிப்திய அதிகாரியின் கீழுள்ள வீட்டுப் பணியாளர்களைக் குறிக்கும் சூழலில் ‘பணியாளர்கள்’ இயல்பானது; சமூக நிலையை தேவையின்றி மிகத் துல்லியமாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: מִקְנֵהוּ
  choice: தம் கால்நடைகள்
  rationale: מִקְנֶה பலவகை வளர்ப்பு விலங்குகளைக் குறிக்கும் பொதுச்சொல்; ‘கால்நடைகள்’ அந்தப் பரப்பைத் தக்கவைக்கிறது.
- source_word: אֶל הַבָּתִּים
  choice: வீடுகளுக்குள்
  rationale: இலக்கை நோக்கிய இயக்கத்தையும் எபிரெயப் பன்மையையும் காக்கிறது; இங்கு கட்டடங்களுக்குள் புகலிடம் தேடிச் செல்வது சூழலால் தெளிவாகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: ஆண்டவர்; யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைபெயர் நேரடியாக உள்ளது. அதை ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றாமல் பெயராகவே தரப்பட்டுள்ளது. நவீன தமிழில் பொதுவாக அறியப்பட்ட ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மூல உச்சரிப்பை மீளமைக்கும் மாற்று எழுத்துப்பெயர்ப்பு.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘தம்’ என்ற மரியாதை/தற்சுட்டுப் பெயரடை, எழுவாயான ‘பயந்தவர்’ என்பவரையே உடைமையாளராகத் தெளிவுபடுத்துகிறது. மூலத்தின் ஒருமை இலக்கண வடிவம் பொதுவகைப் பொருளுடன் பாதுகாக்கப்பட்டுள்ளது.
