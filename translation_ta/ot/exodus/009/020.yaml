revisions:
- from: பார்வோனுடைய பணியாளர்களில் யெகோவாவின் வார்த்தைக்குப் பயந்தவர், தம் பணியாளர்களையும் கால்நடைகளையும் வீடுகளுக்குள் விரைந்து கொண்டுவந்தார்.[a]
  to: பார்வோனுடைய பணியாளர்களில் யாவேவின் வார்த்தைக்கு அஞ்சியவர், தம் பணியாளர்களையும் கால்நடைகளையும் வீடுகளுக்குள் விரைவாகச் செல்லச் செய்தார்.[a]
  rationale: The revision aligns the divine name with the required Yahweh rendering and restores the causative sense of the Hebrew Hiphil. It otherwise preserves the draft’s accurate generic singular, partitive phrase, plural destination, and modern standard Tamil register.
