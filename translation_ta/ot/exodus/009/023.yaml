  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל הַ/שָּׁמַיִם֒ וַֽ/יהוָ֗ה נָתַ֤ן קֹלֹת֙ וּ/בָרָ֔ד וַ/תִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָ/ה וַ/יַּמְטֵ֧ר יְהוָ֛ה בָּרָ֖ד עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: ta
  text: மோசே தன் கோலை வானத்தை நோக்கி நீட்டினார்; யாவே இடிமுழக்கத்தையும் ஆலங்கட்டியையும் அனுப்பினார்; நெருப்பு தரையை நோக்கிச் சென்றது[a]. யாவே எகிப்து நாட்டின்மேல் ஆலங்கட்டி பொழியச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “நெருப்பு தரையை நோக்கி வந்தது.” இச்சூழலில் “நெருப்பு” என்பது மின்னலைக் குறிக்கலாம்.'
    reason: எபிரெய வினையின் இயக்கப் பொருளுக்கான இயல்பான மாற்றுவாசிப்பையும், ‘நெருப்பு’ என்பதன் சாத்தியமான சூழற்பொருளையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיֵּט
  choice: நீட்டினார்
  rationale: נטה என்பதன் இயல்பான பொருள் ‘நீட்டு’; கோலை உயர்த்தும் செயலை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: מַטֵּהוּ
  choice: தன் கோலை
  rationale: מַטֶּה என்பதற்கு இச்சூழலில் ‘கோல்’ இயல்பானதும் தெளிவானதும் ஆகும்; உடைமைப் பின்னொட்டை ‘தன்’ என வழங்குகிறது.
- source_word: עַל הַשָּׁמַיִם
  choice: வானத்தை நோக்கி
  rationale: சொல்லடியாக ‘வானத்தின்மேல்’ என்றாலும், கோலை மேல்நோக்கி நீட்டிய திசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தாகிய இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: இடிமுழக்கத்தையும் ஆலங்கட்டியையும் அனுப்பினார்
  rationale: נתן என்பதன் சொல்லடி ‘கொடுத்தார்’; இங்கு புயல் நிகழ்வுகளை ஏற்படுத்துதல் என்ற பொருளில் ‘அனுப்பினார்’ இயல்பானது. קֹלוֹת இச்சூழலில் இடிமுழக்கங்களைக் குறிக்கிறது.
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: நெருப்பு தரையை நோக்கிப் பாய்ந்தது
  rationale: எபிரெயம் ‘நெருப்பு தரையை நோக்கிச் சென்றது/நடந்தது’ என்ற உயிரோட்டமான படிமத்தைக் கொண்டது. ‘பாய்ந்தது’ அந்த இயக்கத்தை இயல்பான தமிழில் தக்கவைக்கிறது; ‘நெருப்பு’ என்பதை ‘மின்னல்’ என்று முதன்மை உரையிலேயே விளக்கி மாற்றவில்லை.
- source_word: וַיַּמְטֵר ... בָּרָד
  choice: ஆலங்கட்டியை மழையாகப் பொழியச் செய்தார்
  rationale: מטר என்பதன் ஹிஃபில் வடிவம் ‘மழையாகப் பொழியச் செய்தல்’ எனும் காரணவினைப் பொருளைக் கொண்டுள்ளது; ஆலங்கட்டி கருப்பொருளாக இருப்பதைத் தெளிவாக வைத்திருக்கிறது.
- source_word: אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டின்மேல்
  rationale: ‘எகிப்து நாடு’ என்று நிலப்பரப்பு சார்ந்த எபிரெயச் சொல்லாட்சியைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: אֵשׁ என்பதன் புயல் சூழலிலான குறிப்பு
  choice: நெருப்பு
  alternative: மின்னல்
  rationale: சூழலில் இது மின்னலைக் குறிக்க வாய்ப்பிருந்தாலும், மூலச்சொல் நேரடியாக ‘நெருப்பு’ என்பதால் அந்தப் படிமமும் தெளிவின்மையும் முதன்மை உரையில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடையின் வேகமும் காக்கப்பட்டுள்ளன. ‘ஆலங்கட்டி’, ‘இடிமுழக்கம்’ போன்ற வழக்கமான வானிலைச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் மீளுரைப்பை ‘இவ்வாறு’ மூலம் இயல்பான தொடர்பாக அமைத்துள்ளோம்.
