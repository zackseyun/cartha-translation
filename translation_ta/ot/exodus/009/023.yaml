  source_fidelity: ‘நெருப்பு தரையை நோக்கிப் பாய்ந்தது’ என்பது וַתִּהֲלַךְ (‘சென்றது/நடந்தது’) என்பதைக் காட்டிலும் வலிமையான, வேகத்தைக் குறிப்பிட்ட விளக்கமாக உள்ளது. மேலும் ‘இவ்வாறு’ மூலத்தில் இல்லாத தொடர்பைச் சேர்க்கிறது. இறுதி வாக்கியத்தில் ஆலங்கட்டி பொழியச் செய்தல் என்ற காரணவினைச் சாயலைத் தக்கவைத்து, ‘எகிப்து நாட்டின்மேல்’ என்ற இடக்குறிப்பையும் நேரடியாக இணைக்கலாம்.
