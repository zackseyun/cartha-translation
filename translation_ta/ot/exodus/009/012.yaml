base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: ta
  text: ஆனால், யாவே பார்வோனின் இதயத்தைக் கடினப்படுத்தினார்[a]; அவன் அவர்களுக்குச் செவிகொடுக்கவில்லை; யாவே மோசேயிடம் சொல்லியிருந்தபடியே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பார்வோனின் இதயத்தை உறுதியாக்கினார்” அல்லது “பார்வோனின் இதயத்தை வலுப்படுத்தினார்.” எபிரெய வினை இன்னும் சொற்படியாக “வலுவாக்கினார்/உறுதியாக்கினார்” என்று பொருள்படும்; இச்சூழலில் அது பார்வோனின் பிடிவாதமான எதிர்ப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: கடினப்படுத்தினார்
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘வலுப்படுத்துதல்/உறுதியாக்குதல்.’ ஆனால் பார்வோனின் இதயத்தைப் பற்றிய யாத்திராகமத் தொடர் பயன்பாட்டில், பிடிவாதமான எதிர்ப்பை இயல்பான தமிழில் ‘கடினப்படுத்தினார்’ என்பது தெளிவாக வெளிப்படுத்துகிறது. மூலத்தின் நேரடியான இறைச் செயற்பாடும் காக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் தனிப்பெயரான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற வடிவில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: לֵב פַּרְעֹה
  choice: பார்வோனின் இதயம்
  rationale: எபிரெயக் கட்டமைப்பு இயல்பான தமிழில் உடைமைத் தொடராக வழங்கப்படுகிறது. ‘இதயம்’ என்பது இங்கு மனவுறுதி மற்றும் உள்ளார்ந்த நிலைப்பாட்டின் மையத்தைக் குறித்தாலும், விளக்கப் பொருள் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: שָׁמַע אֲלֵהֶם
  choice: அவர்கள் சொன்னதைக் கேட்கவில்லை
  rationale: שׁמע + אֶל என்பது ‘ஒருவர் கூறுவதைக் கேட்பது/செவிகொடுப்பது’ என்று பொருள்படும். வெறும் ஒலியைக் கேட்கவில்லை என்ற தவறான புரிதலைத் தவிர்த்து, இயல்பான தமிழில் உறவுசார் பொருள் தரப்படுகிறது; ‘கீழ்ப்படியவில்லை’ என்று மிகையாகக் குறிப்பாக்கப்படவில்லை.
- source_word: אֲלֵהֶם
  choice: அவர்கள்
  rationale: சூழலில் இது மோசேயையும் ஆரோனையும் குறிக்கிறது. ஆயினும் மூலம் பெயர்களை மீண்டும் கூறாமல் பன்மைப் பிரதிப்பெயரைப் பயன்படுத்துவதால், தமிழிலும் அது காக்கப்படுகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: யெகோவா மோசேயிடம் சொல்லியிருந்தபடியே
  rationale: כַּאֲשֶׁר என்பதன் ஒப்பீட்டு/நிறைவேற்றப் பொருள் ‘சொல்லியிருந்தபடியே’ என்பதால் இயல்பாக வெளிப்படுகிறது; முந்தைய இறைவாக்கு இப்போது நிறைவேறியது என்பதும் காலவடிவத்தில் தெளிவாகிறது.
theological_decisions:
- issue: பார்வோனின் இதயம் கடினமானதில் இறைவனின் செயற்பாடு
  choice: யெகோவா பார்வோனின் இதயத்தைக் கடினப்படுத்தினார்
  alternative: யெகோவா பார்வோனின் இதயத்தை உறுதியாக்கினார் / வலுப்படுத்தினார்
  rationale: எபிரெய உரை יהוה-வை வினையின் எழுவாயாகவும் பார்வோனின் இதயத்தை நேரடிச் செயப்படுபொருளாகவும் வைக்கிறது. ஆகவே இறைவனின் நேரடிச் செயற்பாட்டை அனுமதி அளித்ததாகவோ மறைமுகமாகச் செய்ததாகவோ மென்மைப்படுத்தவில்லை. அதே நேரத்தில் חזק என்பதன் சொற்பொருள் சார்ந்த மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆனால்’ என்பது முந்தைய நிகழ்வுடன் உள்ள எதிர்மறைத் தொடர்ச்சியைக் காட்டுகிறது. மூலத்தின் பன்மைப் பிரதிப்பெயரும் இறைச் செயற்பாட்டின் இறையியல் பதற்றமும் விளக்கிப் போக்கப்படாமல் காக்கப்பட்டுள்ளன.
