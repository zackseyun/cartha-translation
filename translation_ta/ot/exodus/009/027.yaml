base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: ta
  text: அப்போது பார்வோன் ஆளனுப்பி மோசேயையும் ஆரோனையும் அழைத்துவரச் செய்தான். அவன் அவர்களிடம், “இந்த முறை நான் பாவம் செய்துவிட்டேன். யாவே நீதியுள்ளவர்[a]; நானும் என் மக்களும் தீயவர்கள்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே சரியானவர்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நானும் என் மக்களும் குற்றவாளிகள்; தவறுடையவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְ
  choice: ஆளனுப்பி ... அழைத்துவரச் செய்தான்
  rationale: இரண்டு எபிரெய வினைகளின் தொடர்ச்சியையும் தக்கவைத்து, பார்வோன் ஆள் அனுப்பி மோசேயையும் ஆரோனையும் தன்னிடம் வரவழைத்தான் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חָטָאתִי הַפָּעַם
  choice: இந்த முறை நான் பாவம் செய்துவிட்டேன்
  rationale: பார்வோன் இச்சந்தர்ப்பத்தில் தன் தவற்றை ஒப்புக்கொள்வதைத் தற்போதைய விளைவுடன் கூடிய இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் உள்ள இறைவனின் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הַצַּדִּיק
  choice: நீதியுள்ளவர்
  rationale: இந்தச் சூழலில் கடவுள் நீதியானவர் என்றும் அவர் தரப்பே சரியானது என்றும் கூறும் சொல்லின் அறநெறி-நீதித்துறை சார்ந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: וַאֲנִי וְעַמִּי הָרְשָׁעִים
  choice: நானும் என் மக்களும் குற்றவாளிகள்
  rationale: பார்வோன் தன்னையும் தன் மக்களையும் சேர்த்துக் கூறும் மூல வரிசையையும், அவர்கள் தவறிழைத்துத் தண்டனைக்குரியவர்கள் என்ற ஒப்புதலையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் இறைவனின் தனிப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: הַצַּדִּיק என்பதன் கருத்து
  choice: நீதியுள்ளவர்
  alternative: சரியானவர்
  rationale: இது இச்சூழலில் ‘யாவே தரப்பே சரி’ என்ற ஒப்புதலையும் கொண்டுள்ளது; அதேவேளையில், ‘நீதியுள்ளவர்’ என்பது சொல்லின் விரிவான அறநெறி மற்றும் நீதிசார் பொருளைச் சுருக்காமல் காக்கிறது.
- issue: הָרְשָׁעִים என்பதன் குற்றவுணர்வு
  choice: குற்றவாளிகள்
  alternative: தீயவர்கள்
  rationale: உடனடி நீதிசார் முரண்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது; மூலச் சொல்லின் வலுவான அறநெறிப் பொருள் மாற்று வாசிப்பாகக் குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. ‘அழைத்துவரச் செய்தான்’ என்பது அரண்மனைச் சூழலில் ‘summoned’ என்ற கருத்தை இயல்பாகத் தருகிறது; இறைப்பெயர் ‘யாவே’ என நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளது.
