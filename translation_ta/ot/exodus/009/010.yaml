base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: ta
  text: அவர்கள் சூளையிலிருந்து புகைக்கரியை[a] எடுத்துக்கொண்டு பார்வோனுக்கு முன்பாக நின்றார்கள். மோசே அதை வானத்தை நோக்கி எறிந்தான். அது மனிதர்கள்மேலும் விலங்குகள்மேலும்[b] கொப்புளங்கள் வெடித்தெழும் புண்களாயிற்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சூளையின் சாம்பல்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் குறிப்பாகச் சூளை அல்லது உலையிலிருந்து வரும் நுண்ணிய கருந்தூளைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் ‘மனிதன்மேலும் விலங்கின்மேலும்’ என்று ஒருமைத் தொகுப்புப்பொருளில் உள்ளது; மனிதர்களும் விலங்குகளும் பாதிக்கப்பட்டதை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיחַ
  choice: புகைக்கரி
  rationale: இச்சொல் பொதுவான சாம்பலைவிட, சூளை அல்லது உலையிலிருந்து கிடைக்கும் நுண்ணிய கருந்தூளைச் சுட்டுகிறது; ‘புகைக்கரி’ அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַכִּבְשָׁן
  choice: சூளை
  rationale: இது சூளை அல்லது உலையைக் குறிக்கலாம். புகைக்கரி எடுக்கப்படும் தொழில்சார் வெப்ப அடுப்பை ‘சூளை’ தெளிவாகக் குறிக்கிறது.
- source_word: לִפְנֵי פַרְעֹה
  choice: பார்வோனுக்கு முன்பாக
  rationale: எபிரெய வழக்கு பார்வோனின் முன்னிலையில் நின்றதைக் குறிக்கிறது; இத்தமிழாக்கம் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה
  choice: மோசே அதை ... எறிந்தான்
  rationale: ஒருமைச் சுட்டுப்பெயர் புகைக்கரியைத் திரள்பொருளாகக் குறிக்கிறது; செயல் முறையை மிகையாக விளக்காமல் எளிய வினையைப் பாதுகாக்கிறது.
- source_word: הַשָּׁמָיְמָה
  choice: வானத்தை நோக்கி
  rationale: திசையைக் காட்டும் வடிவம் மேல்நோக்கிய இயக்கத்தைக் குறிக்கிறது; தேவையற்ற இறையியல் பொருளைச் சேர்க்காமல் உடனடியான காட்சியைத் தருகிறது.
- source_word: שְׁחִין
  choice: புண்கள்
  rationale: இது வீக்கமுற்ற தோல் புண்களையோ கொப்புளப் புண்களையோ குறிக்கிறது. அடுத்த சொல்லுடன் சேர்ந்து ‘கொப்புளங்கள் எழும் புண்கள்’ எனத் தெளிவாகிறது.
- source_word: אֲבַעְבֻּעֹת
  choice: கொப்புளங்கள்
  rationale: புண்களோடு தோன்றும் நீர்க்கொப்புளங்கள் அல்லது சீழ்க்கொப்புளங்களை இச்சொல் குறிக்கிறது; குறிப்பிட்ட மருத்துவத் தன்மையை ஊகிக்காமல் ‘கொப்புளங்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: פֹּרֵחַ
  choice: எழும்
  rationale: புண் அல்லது கொப்புளம் தோன்றி வெடித்தெழும் செயற்பாட்டை இப்பெயரெச்சம் காட்டுகிறது; ‘எழும்’ என்பது இயல்பான, மிகைப்படுத்தாத தமிழ்.
- source_word: בָּאָדָם
  choice: மனிதர்கள்மேல்
  rationale: இங்கு אָדָם தனிப்பட்ட ஆணை அல்ல, விலங்குகளுக்கு எதிராக மனித இனத்தைத் தொகுப்பாகக் குறிக்கிறது.
- source_word: וּבַבְּהֵמָה
  choice: விலங்குகள்மேல்
  rationale: בְּהֵמָה இங்கு தொகுப்பொருளில் மனிதர்களுக்கு எதிராக விலங்குகளைக் குறிக்கிறது; ‘கால்நடைகள்’ எனச் சுருக்காமல் பரந்த பொருளை வைத்திருக்கிறது.
theological_decisions:
- issue: אָדָם என்ற தொகுப்பொருள் ஒருமையை மனிதர்–விலங்கு எதிரிணையில் மொழிபெயர்த்தல்
  choice: மனிதர்கள்
  alternative: மனிதன் / மனிதகுலம்
  rationale: இச்சூழலில் சொல் ஆண்களை மட்டும் குறிக்காமல் எல்லா மனிதர்களையும் தொகுப்பாகக் குறிக்கிறது. நவீன தமிழில் ‘மனிதர்கள்’ தெளிவாகவும் இயல்பாகவும் இருந்து, மனிதர்–விலங்கு எதிரிணையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. குறுகிய எபிரெய வாக்கியத் தொடர் தமிழில் தெளிவாக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; காரண–விளைவு அல்லது மருத்துவ விவரங்கள் கூடுதலாகச் சேர்க்கப்படவில்லை.
