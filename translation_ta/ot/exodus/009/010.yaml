  verdict: revise
  source_fidelity: The draft accurately represents the sequence of actions, the kiln soot, Pharaoh's presence, Moses' upward throwing, and the outbreak on humans and animals. The phrase for the skin condition is broadly faithful, but its current wording is less precise and less idiomatic than it can be for the actively erupting blisters indicated by אֲבַעְבֻּעֹת פֹּרֵחַ.
