- from: ஆகவே பார்வோனின் மனம் இறுகியது[c]. அவன் இஸ்ரவேல் மக்களை[a] போகவிடவில்லை. யாவே மோசேயின் மூலம்[b] சொல்லியிருந்தபடியே இது நடந்தது.
  to: பார்வோனின் மனம் கடினமானது[c]; யாவே மோசேயின் மூலம்[b] சொல்லியிருந்தபடியே, அவன் இஸ்ரவேல் மக்களை[a] போகவிடவில்லை.
  rationale: The revision removes the added “இது நடந்தது,” avoids making the opening conjunction an explicit causal inference, and attaches “யாவே மோசேயின் மூலம் சொல்லியிருந்தபடியே” directly to Pharaoh’s refusal. “கடினமானது” gives clear, natural contextual Tamil while its footnote preserves the lexical sense of becoming strong or firm and retains the verse’s ambiguity concerning agency.
