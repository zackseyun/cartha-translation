base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: ta
  text: பார்வோனின் மனம் கடினமானது[c]; யாவே மோசேயின் மூலம்[b] சொல்லியிருந்தபடியே, அவன் இஸ்ரவேல் மக்களை[a] போகவிடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்’; மரபாக, ‘இஸ்ரவேலின் பிள்ளைகள்.’ இங்கு இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘மோசேயின் கையால்’; இது ‘மோசேயின் மூலம்’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பார்வோனின் மனம் உறுதியடைந்தது.’ எபிரெய வினை ‘வலுவானது/உறுதியானது’ என்றும் பொருள்படும்; இங்கு அது பிடிவாதமாகக் கடினமானதைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: இறுகியது
  rationale: חזק என்பதன் அடிப்படை உணர்வான வலுப்படுதல் அல்லது உறுதியாகுதல் என்பதையும், இச்சூழலில் பார்வோனின் பிடிவாதம் கடினமாவதையும் இது தெரிவிக்கிறது. யார் அதைச் செய்தார் என்பதை வசனம் வெளிப்படையாகக் கூறாததால், நேரடியான வெளிப்புறக் காரணத்தைச் சேர்க்காத வினைவடிவம் பயன்படுத்தப்பட்டது.
- source_word: לֵב פַּרְעֹה
  choice: பார்வோனின் மனம்
  rationale: எபிரெய மொழியின் ‘இதயம்’ இங்கு உள்ளார்ந்த விருப்பம், மனப்போக்கு, தீர்மானம் ஆகியவற்றைக் குறிக்கிறது. நவீன தமிழில் ‘மனம்’ இயல்பாக அந்தப் பொருளைத் தருகிறது.
- source_word: שִׁלַּח
  choice: போகவிடவில்லை
  rationale: யாத்திராகமச் சூழலில் இவ்வினை இஸ்ரவேலர் புறப்படுவதற்கு பார்வோன் அனுமதி அளிப்பதைக் குறிக்கிறது; ‘போகவிடு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் கூட்டுப்பெயராக வருகிறது. ‘இஸ்ரவேல் மக்கள்’ பாலினத் தவறுணர்வைத் தவிர்த்து கருத்தைத் தெளிவாகத் தருகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר
  choice: சொல்லியிருந்தபடியே
  rationale: முன்னரே கூறப்பட்ட யாவேயின் வார்த்தைக்கும் இப்போது நிகழ்ந்ததற்கும் உள்ள துல்லியமான ஒத்திசைவை ‘படியே’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலம்
  rationale: சொல்லுக்குச் சொல் ‘மோசேயின் கையால்’ எனும் எபிரெய மரபுத்தொடர் கருவி அல்லது இடைமுக முகமையைச் சுட்டுகிறது. ‘மூலம்’ அதன் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பார்வோனின் மனம் இறுகியதில் உள்ள செயற்பாடு
  choice: பார்வோனின் மனம் இறுகியது
  alternative: யாவே பார்வோனின் மனத்தைக் கடினப்படுத்தினார் / பார்வோன் தன் மனத்தைக் கடினப்படுத்திக்கொண்டான்
  rationale: இந்த வசனத்திலுள்ள எபிரெய வினை பார்வோனின் மனம் உறுதியடைந்தது அல்லது கடினமானது என்பதைக் கூறுகிறது; யாவே நேரடியாகச் செய்தார் என்றோ பார்வோன் தானே செய்துகொண்டான் என்றோ இக்கூற்று வெளிப்படையாகக் குறிப்பிடவில்லை. எனவே கதையிலுள்ள செயற்பாடு குறித்த இறையியல் பதற்றம் தீர்த்துவைக்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மனம் இறுகியது’ என்பது இயல்பான தமிழையும் மூலத்தின் காரணகர்த்தா குறித்த தெளிவின்மையையும் காக்கிறது. மூன்று அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின்பு முதன்மை உரையில் இடம்பெற்றுள்ளன.
