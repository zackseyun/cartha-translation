  source_fidelity: 'முக்கியக் கருத்துகள் மூலத்திற்கு உண்மையாக உள்ளன: வலுவான எதிர்மறை இணைப்பு, பார்வோன் தொடர்ந்து நிற்க/உயிரோடு இருக்கச் செய்யப்பட்ட நிலை, இரு நோக்கக் கூறுகள், மற்றும் உலகளாவிய அறிவிப்பு ஆகியவை பேணப்பட்டுள்ளன. ஆனால் இறுதியில் சேர்க்கப்பட்டுள்ள “இப்படிச் செய்தேன்” எபிரெய மூலத்தில் தனியாக இல்லை; அது ஏற்கெனவே உள்ள “நான் உன்னை நிலைத்திருக்கச் செய்தேன்” என்ற பிரதான வினையை தேவையின்றி மீண்டும் கூறி, நோக்கக் கூறுகளின் நேரடியான இணைப்பை மங்கச் செய்கிறது.'
  naturalness: “நிலைத்திருக்கச் செய்தேன்,” “என் வல்லமையை உனக்குக் காட்டவும்,” “பூமியெங்கும் அறிவிக்கப்படவும்” ஆகியவை நவீன தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் உள்ளன. இறுதி மீளுரையை நீக்கினால் வாக்கியம் இன்னும் நேர்த்தியாகவும் மூலத்தின் அமைப்புக்கு நெருக்கமாகவும் இருக்கும்.
  terminology: “வல்லமை,” “பெயர்,” “பூமியெங்கும்,” மற்றும் “அறிவிக்கப்படவும்” ஆகிய தேர்வுகள் பொருத்தமானவை. அடிக்குறிப்பில் “உயிரோடு வைத்தார்” என மூன்றாம் நபர் மரியாதை வடிவம் வருவது பேச்சாளரான கடவுளின் முதல் நபர் மேற்கோளுடன் சற்றே ஒத்திசைவற்றதாக உள்ளது; நடுநிலையான “உயிரோடு வைத்தது” என்று மாற்றப்பட்டுள்ளது.
