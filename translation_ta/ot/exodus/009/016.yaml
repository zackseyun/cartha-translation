source:
  edition: WLC
  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: ta
  text: 'ஆனால், இந்த நோக்கத்திற்காகவே நான் உன்னை நிலைத்திருக்கச் செய்தேன்[a]: என் வல்லமையை உனக்குக் காட்டவும், என் பெயர் பூமியெங்கும் அறிவிக்கப்படவும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உன்னை எழுப்பினேன்.” எபிரெயச் சொல் பார்வோனை நிற்கச் செய்தல் அல்லது தொடர்ந்து நிலைத்திருக்கச் செய்தல் என்ற பொருளில் புரிந்துகொள்ளப்படலாம். இச்சூழலில், அவனை உடனே அழிக்காமல் உயிரோடு வைத்தது என்பதே பெரும்பாலும் கருத்தாகும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: ஆனால்
  rationale: முந்தைய வசனத்தோடு உள்ள வலுவான முரண்பாட்டை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּעֲבוּר זֹאת
  choice: இந்த நோக்கத்திற்காகவே
  rationale: வெறும் காரணத்தை அல்ல, தொடர்ந்து வரும் இரு நோக்கக் கூறுகளுக்கான இறை நோக்கத்தைத் தெளிவாகக் காட்டுகிறது; ‘வே’ வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: הֶעֱמַדְתִּיךָ
  choice: நான் உன்னை நிலைத்திருக்கச் செய்தேன்
  rationale: עמד என்பதன் ஹிஃபில் வடிவிலுள்ள ‘நிற்கச் செய்தல்/தொடர்ந்து நிலைக்கச் செய்தல்’ என்ற உருவகத்தைப் பேணுகிறது. உடனே அழிக்காமல் பார்வோன் தொடர்ந்து உயிரோடு இருக்கச் செய்யப்பட்ட சூழலுக்கும் இது பொருந்துகிறது; அவனை அரச பதவிக்கு உயர்த்தினார் என்று தேவையின்றி முடிவுசெய்வதைத் தவிர்க்கிறது.
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: என் வல்லமையை உனக்குக் காட்டவும்
  rationale: நோக்கத்தை இயல்பான தமிழ் வினையெச்சக் கட்டமைப்பில் தருகிறது; ‘உனக்கு’ என்ற செயப்படுபொருளையும் வெளிப்படையாகப் பேணுகிறது.
- source_word: כֹּחִי
  choice: என் வல்லமை
  rationale: வாதைகளின் சூழலில் வெளிப்படும் இறை ஆற்றலைக் குறிக்க ‘வல்லமை’ dignified மற்றும் பொதுவாகப் புரியக்கூடிய தமிழ் சொல்லாகும்.
- source_word: וּלְמַעַן
  choice: …அறிவிக்கப்படவும்
  rationale: முந்தைய நோக்கக் கூறுடன் ஒருங்கிணைந்த இரண்டாவது நோக்கத்தை ‘-வும்’ என்ற இணை வடிவில் தெளிவாகக் காட்டுகிறது.
- source_word: סַפֵּר
  choice: அறிவிக்கப்பட
  rationale: பியேல் வடிவின் ‘விவரித்தல்/அறிவித்தல்’ பொருளையும், எவர் அறிவிப்பார் என்பதைத் திறந்தவாறே வைக்கும் எபிரெயக் கட்டமைப்பையும் தமிழ் செயப்பாட்டு வடிவில் பேணுகிறது.
- source_word: שְׁמִי
  choice: என் பெயர்
  rationale: இறைவனின் புகழையும் வெளிப்படுத்தப்பட்ட அடையாளத்தையும் உள்ளடக்கக்கூடிய மூல மொழியின் நேரடி உருவகத்தைப் பேணுகிறது.
- source_word: בְּכָל הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: உலகளாவிய பரப்பை இயல்பான தமிழில் தெரிவிக்கிறது; குறிப்பிட்ட ஒரு நாட்டுக்குள் மட்டும் என்ற பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: הֶעֱמַדְתִּיךָ என்பது பார்வோனைப் பற்றி குறிக்கும் பொருள்
  choice: பார்வோன் உடனே அழிக்கப்படாமல் தொடர்ந்து உயிரோடு நிலைக்கும்படி கடவுள் செய்தார்.
  alternative: இந்த நோக்கத்திற்காக கடவுள் பார்வோனை எழுப்பினார் அல்லது அரச பதவிக்கு உயர்த்தினார்.
  rationale: முந்தைய வசனத்தில் பார்வோன் ஏற்கெனவே அழிக்கப்பட்டிருக்க முடியும் என்ற கருத்துடன் இது முரண்படுத்தப்படுகிறது. ஆகவே ‘தொடர்ந்து நிலைத்திருக்கச் செய்தல்’ என்பது சூழலுக்கு ஏற்ற முதன்மைப் பொருள். அதேவேளை, எபிரெயச் சொல்லின் விரிவான சாத்தியத்தை அடிக்குறிப்பு திறந்தவாறே வைக்கிறது.
- issue: சַפֵּר என்பதன் மறைமுக எழுவாய்
  choice: ‘என் பெயர் … அறிவிக்கப்படவும்’ என்று செயப்பாட்டு வடிவில் தரப்பட்டது.
  alternative: ‘மக்கள் என் பெயரை … அறிவிக்கவும்’ என்று எழுவாயை வெளிப்படையாகச் சேர்த்தல்.
  rationale: மூலத்தில் அறிவிப்பவர் குறிப்பிடப்படவில்லை. செயப்பாட்டு வடிவு அந்தத் திறந்த தன்மையைப் பேணி, உலகளாவிய அறிவிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க தொனியிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நிலைத்திருக்கச் செய்தேன்’ என்பது மூலத்தின் நிற்றல் உருவகத்தையும் சூழலிலுள்ள உயிர் காக்கப்பட்ட நிலையும் ஒருங்கே பேணுகிறது. இறுதி ‘இப்படிச் செய்தேன்’ தமிழ் வாக்கியத்தில் இரு நோக்கக் கூறுகளையும் முதன்மை வினையுடன் தெளிவாக இணைக்கிறது.
