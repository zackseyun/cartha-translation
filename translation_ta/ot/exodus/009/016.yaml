- from: 'ஆனால், இந்த நோக்கத்திற்காகவே நான் உன்னை நிலைத்திருக்கச் செய்தேன்[a]: என் வல்லமையை உனக்குக் காட்டவும், என் பெயர் பூமியெங்கும் அறிவிக்கப்படவும் இப்படிச் செய்தேன்.'
  to: 'ஆனால், இந்த நோக்கத்திற்காகவே நான் உன்னை நிலைத்திருக்கச் செய்தேன்[a]: என் வல்லமையை உனக்குக் காட்டவும், என் பெயர் பூமியெங்கும் அறிவிக்கப்படவும்.'
  rationale: இறுதி “இப்படிச் செய்தேன்” என்ற மூலத்தில் இல்லாத மீளுரையை நீக்கியுள்ளோம். இதனால் பிரதான வினையும் அதைத் தொடர்ந்து வரும் இரு நோக்கக் கூறுகளும் எபிரெய வாக்கிய அமைப்பின்படி நேரடியாக இணைகின்றன. அடிக்குறிப்பில் உள்ள விளக்கத்தின் நபர்-கண்ணோட்டமும் நடுநிலையாக்கப்பட்டுள்ளது; மாற்று வாசிப்பின் திறந்த தன்மை தொடர்ந்து பேணப்படுகிறது.
