  source_fidelity: The Tamil accurately preserves the solemn introductory particle (הִנְנִי), the first-person causative divine action ('நான் பெய்யச் செய்வேன்'), the approximate temporal phrase ('நாளை ஏறக்குறைய இதே நேரத்தில்'), the exceptionally severe hail, and the comparison from Egypt's founding until the present. The explicit divine agency is retained without interpretive softening.
