  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הִנְ/נִ֤י מַמְטִיר֙ כָּ/עֵ֣ת מָחָ֔ר בָּרָ֖ד כָּבֵ֣ד מְאֹ֑ד אֲשֶׁ֨ר לֹא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/מִצְרַ֔יִם לְ/מִן הַ/יּ֥וֹם הִוָּסְדָ֖/ה וְ/עַד עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: ta
  text: “இதோ, நாளை ஏறக்குறைய இதே நேரத்தில்[a], எகிப்து நிறுவப்பட்ட நாள் முதல்[b] இன்றுவரை அங்கே ஒருபோதும் பெய்திராத அளவுக்கு மிகக் கடுமையான ஆலங்கட்டி மழையை நான் பெய்யச் செய்வேன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாளை இதே நேரத்தில்.”
    reason: כָּעֵת என்ற சொற்றொடரில் தோராயமான நேரமா அல்லது அதே நேரமா என்ற மொழிபெயர்ப்பு நுட்பத்தைப் பாதுகாக்கிறது.
  - marker: b
    text: அல்லது, “எகிப்து நிலைநாட்டப்பட்ட நாள் முதல்.”
    reason: הִוָּסְדָה என்பதற்கு ‘நிறுவப்பட்டது’ என்றும் ‘நிலைநாட்டப்பட்டது’ என்றும் பொருத்தமாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: הִנְנִי
  choice: இதோ
  rationale: வரவிருக்கும் தெய்வச் செயலை வலியுறுத்தி அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் சுட்டிக்காட்டும் தன்மையையும் அறிவிப்பின் கம்பீரத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מַמְטִיר
  choice: நான் பெய்யச் செய்வேன்
  rationale: முதல் நபர் எழுவாயுடன் வரும் ஹிஃபில் வினை, ஆலங்கட்டி மழை பெய்வதற்குக் கடவுளே நேரடியாகக் காரணர் என்பதைத் தெரிவிக்கிறது.
- source_word: כָּעֵת מָחָר
  choice: நாளை ஏறக்குறைய இதே நேரத்தில்
  rationale: כְּ முன்னொட்டின் தோராயமான ஒப்பீட்டு நுட்பத்தை வெளிப்படுத்துகிறது; துல்லியமான அதே நேரம் என்ற மாற்று வாசிப்பும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בָּרָד כָּבֵד מְאֹד
  choice: மிகக் கடுமையான ஆலங்கட்டி மழை
  rationale: כָּבֵד என்பதன் அடிப்படைப் பொருள் ‘கனமானது’ என்றாலும், வானிலை நிகழ்வின் தீவிரத்தை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்க ‘மிகக் கடுமையான’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: ஒருபோதும் பெய்திராத அளவுக்கு
  rationale: வரவிருக்கும் ஆலங்கட்டி மழைக்கு முந்தைய வரலாற்றில் ஒப்பேதும் இல்லை என்ற ஒப்பீட்டுப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה וְעַד עָתָּה
  choice: எகிப்து நிறுவப்பட்ட நாள் முதல் இன்றுவரை
  rationale: நிஃபால் வடிவின் செயப்பாட்டு பொருளையும், எகிப்து நிறுவப்பட்ட காலத்திலிருந்து நிகழ்காலம் வரையிலான முழுக் கால எல்லையையும் காக்கிறது.
theological_decisions:
- issue: வாதையின் தெய்வீகக் காரணத்தன்மை
  choice: ‘நான் பெய்யச் செய்வேன்’ என்று கடவுளின் நேரடிச் செயலைத் தெளிவாகக் கூறுதல்
  alternative: ‘ஆலங்கட்டி மழை பெய்யும்’ என்ற ஆளற்ற கூற்று
  rationale: மூலத்தில் முதல் நபர் எழுவாயுடன் உள்ள causative வினை, வரவிருக்கும் வாதையை இறைவனின் நேரடிச் செயலாகக் குறிப்பிடுகிறது; அதை மென்மைப்படுத்தாமல் மொழிபெயர்க்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘ஆலங்கட்டி மழை’ என்பது இயல்பான வானிலைச் சொல்; ‘மிகக் கடுமையான’ என்பது சொற்சொல் ரீதியான ‘மிகவும் கனமான’ என்பதன் சூழல்சார் இயல்பான இணை.
