revisions:
- from: இதோ, வயல்வெளியில் இருக்கிற உன் கால்நடைகளான குதிரைகள், கழுதைகள், ஒட்டகங்கள், மாட்டுமந்தைகள், ஆட்டுமந்தைகள் ஆகியவற்றின்மேல் யாவேயின் கை வரும்; மிகக் கொடிய கொள்ளைநோய்[a] உண்டாகும்.
  to: இதோ, வயல்வெளியில் உள்ள உன் கால்நடைகளின் மேல்—குதிரைகள், கழுதைகள், ஒட்டகங்கள், மாட்டுமந்தைகள், ஆட்டுமந்தைகள் ஆகியவற்றின் மேல்—யாவேயின் கை வரவிருக்கிறது; அது மிகக் கடுமையான கொள்ளைநோயாக[a] இருக்கும்.
  rationale: The revision retains the Hebrew imagery and full livestock list, expresses the imminent force of הוֹיָה with “வரவிருக்கிறது,” and connects the severe pestilence directly to Yahweh's hand without overexplaining the metaphor. The footnote now provides a genuine Tamil lexical alternative and correctly describes the source term.
