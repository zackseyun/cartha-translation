base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: ta
  text: இதோ, வயல்வெளியில் உள்ள உன் கால்நடைகளின் மேல்—குதிரைகள், கழுதைகள், ஒட்டகங்கள், மாட்டுமந்தைகள், ஆட்டுமந்தைகள் ஆகியவற்றின் மேல்—யாவேயின் கை வரவிருக்கிறது; அது மிகக் கடுமையான கொள்ளைநோயாக[a] இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெருந்தொற்று”; எபிரெயச் சொல் கால்நடைகளைத் தாக்கும் உயிர்க்கொல்லி தொற்றுநோயைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: வரவிருக்கும் தீர்ப்பை அவசரமும் கவன ஈர்ப்பும் கொண்ட முறையில் அறிமுகப்படுத்தும் எபிரெயச் சுட்டிடைச்சொல்லின் இயல்பைத் தக்கவைக்கிறது.
- source_word: יַד יְהוָה
  choice: யாவேயின் கை
  rationale: தெய்வீக வல்லமையையும் நியாயத்தீர்ப்பையும் குறிக்கும் எபிரெய உருவகத்தை விளக்கமாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பெயராகவே வழங்குகிறது.
- source_word: הוֹיָה
  choice: வரும்
  rationale: சூழலில் எதிர்வரும், தவிர்க்க முடியாத செயலைக் குறிக்கிறது; தமிழ் தீர்க்கதரிசன அறிவிப்பில் இயல்பாக ஒலிக்கிறது.
- source_word: בְּמִקְנְךָ אֲשֶׁר בַּשָּׂדֶה
  choice: வயல்வெளியில் இருக்கிற உன் கால்நடைகளான
  rationale: מִקְנֶה என்பதன் விரிவான கால்நடைப் பொருளையும், பாதிக்கப்படும் கால்நடைகள் வயல்வெளியில் உள்ளவை என்ற வரம்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: குதிரைகள், கழுதைகள், ஒட்டகங்கள், மாட்டுமந்தைகள், ஆட்டுமந்தைகள்
  rationale: விலங்குகளின் பட்டியலைத் தக்கவைத்து, בָּקָר மற்றும் צֹאן ஆகிய கூட்டுப்பெயர்களை முறையே மாட்டுமந்தைகள், ஆட்டுமந்தைகள் என இயல்பாக வழங்குகிறது; צֹאן ஆடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடும்.
- source_word: דֶּבֶר כָּבֵד מְאֹד
  choice: மிகக் கொடிய கொள்ளைநோய்
  rationale: கால்நடைகளைத் தாக்கும் கடுமையான உயிர்க்கொல்லி தொற்றை நவீன தமிழில் சுருக்கமாகவும் வலிமையாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் உள்ள தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல் தக்கவைக்கிறது.
- issue: יַד יְהוָה என்ற உருவகம்
  choice: யாவேயின் கை
  alternative: யாவேயின் தண்டனை
  rationale: மூலத்தின் உருவகத்தையும் அதன் தெய்வீக வல்லமை/தீர்ப்பு சார்ந்த பலபொருள் செறிவையும் பாதுகாக்கிறது; ஒரே விளக்கமாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெய வாக்கியத்தின் தீர்ப்பறிவிப்பு வலிமை, தெய்வீகக் கை உருவகம், கால்நடை வகைகளின் பட்டியல் ஆகியவை தக்கவைக்கப்பட்டுள்ளன.
