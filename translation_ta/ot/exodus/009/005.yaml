id: EXO.9.5
reference: Exodus 9:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם יְהוָ֖ה מוֹעֵ֣ד לֵ/אמֹ֑ר מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה הַ/דָּבָ֥ר הַ/זֶּ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: ta
  text: யாவே ஒரு நேரத்தை நிர்ணயித்து[a], “நாளை யாவே இந்தக் காரியத்தை நாட்டில் செய்வார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு நியமிக்கப்பட்ட நேரத்தை” அல்லது “ஒரு குறிப்பிட்ட நேரத்தை.”
    reason: מוֹעֵד என்பதன் நியமிக்கப்பட்ட அல்லது உறுதிசெய்யப்பட்ட நேரம் என்ற நுண்பொருளைக் காட்டும் சொற்பொருள் மாற்றுகள்.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: நிர்ணயித்து
  rationale: שׂוּם இங்கு ஒரு நேரத்தை ஏற்படுத்துதல் அல்லது உறுதியாகக் குறித்தல் என்ற பொருளில் வருகிறது. ‘நிர்ணயித்து’ என்பது அந்தச் செயலை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: מוֹעֵד
  choice: ஒரு நேரம்
  rationale: מוֹעֵד இங்கு நியமிக்கப்பட்ட அல்லது குறிப்பிட்ட நேரத்தைக் குறிக்கிறது. அடுத்து வரும் ‘நாளை’ என்பதால், ‘ஒரு நேரம்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது; அதன் நியமிக்கப்பட்ட தன்மையை ‘நிர்ணயித்து’ வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: என்றார்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வழக்கை, தமிழில் இயல்பான மேற்கோள் முடிவான ‘என்றார்’ மூலம் வழங்குகிறது.
- source_word: מָחָר
  choice: நாளை
  rationale: குறிப்பிட்ட நிறைவேற்ற நேரத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יַעֲשֶׂה
  choice: செய்வார்
  rationale: עשה என்பதன் எளிய, பரந்த பொருளான ‘செய்’ என்பதைப் பாதுகாக்கிறது; சூழலில் குறிப்பிடப்படும் தண்டனைச் செயலைக் கூடுதலாக விளக்காமல் விடுகிறது.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தக் காரியம்
  rationale: דָּבָר என்பதற்கு ‘சொல்’, ‘காரியம்’, ‘விஷயம்’ போன்ற பொருள்கள் உண்டு. இங்கு முன் அறிவிக்கப்பட்ட நிகழ்வைக் குறிக்க ‘இந்தக் காரியம்’ இயல்பாகவும் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: சூழலில் எகிப்து நாடு புரிந்துகொள்ளப்படுகிறது. மூலத்தில் இல்லாத ‘எகிப்து’ என்பதைச் சேர்க்காமல் אֶרֶץ என்பதைக் ‘நாடு’ என்று வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதைப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. நேரடிக் கூற்று தமிழின் இயல்பான சொல்லமைப்புக்கேற்ப ‘என்றார்’ என்று முடிக்கப்படுகிறது; மூலத்தின் எளிமையும் இறைப் பெயரின் தனிப்பெயர் தன்மையும் பாதுகாக்கப்படுகின்றன.
