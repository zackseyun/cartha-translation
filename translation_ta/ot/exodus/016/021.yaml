base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/021.yaml
  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: ta
  text: அவர்கள் அதை காலைதோறும், ஒவ்வொருவரும் தாம் உண்ணும் அளவுக்கு, சேகரித்தார்கள்.[a] சூரியன் சூடேறியபோது அது உருகிப்போனது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஒவ்வொருவனும் தன் உண்ணுதலின் வாய்க்கேற்ப”; அதாவது, ஒவ்வொருவரும் தாம் உண்ணக்கூடிய அளவுக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְקְטוּ
  choice: சேகரித்தார்கள்
  rationale: לקט என்பது உணவுப் பொருளைச் சேகரிப்பதைக் குறிக்கிறது; ‘சேகரித்தார்கள்’ என்பது செயலை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: אֹתוֹ
  choice: அதை
  rationale: முந்தைய சூழலில் கூறப்பட்ட மன்னாவைச் சுட்டும் நேரடி பொருள் சுட்டுப்பெயரை, பெயரை இவ்வசனத்தில் சேர்க்காமல் அப்படியே வைத்திருக்கிறது.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: காலைதோறும்
  rationale: எபிரெயச் சொல்லடுக்கின் தொடர்ச்சியான, பகிர்வுப் பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ כְּפִי אָכְלוֹ
  choice: ஒவ்வொருவரும் தாம் உண்ணும் அளவுக்கு
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் வருகிறது. ‘தாம் உண்ணும் அளவுக்கு’ என்பது ‘தன் உண்ணுதலின் வாய்க்கேற்ப’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: சூரியன் சூடேறியபோது
  rationale: சூரியன் வெப்பமடைந்ததைச் சொல்லும் வினைத் தொடரையும், கதைநிகழ்வில் அதன் காலப்பொருளையும் பாதுகாக்கிறது.
- source_word: וְנָמָס
  choice: அது உருகிப்போனது
  rationale: מסס என்பதன் இச்சூழலுக்குரிய நேரடிப் பொருள் ‘உருகுதல்’; ‘உருகிப்போனது’ விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
