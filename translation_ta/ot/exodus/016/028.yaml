  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: ta
  text: 'அப்போது யாவே மோசேயிடம் கூறினார்: “என் கட்டளைகளையும் என் சட்டங்களையும்[a] கடைப்பிடிக்க நீங்கள் இன்னும் எவ்வளவு காலம் மறுத்துக்கொண்டிருப்பீர்கள்?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் அறிவுறுத்தல்களையும்.” எபிரெய மொழியிலுள்ள தோரோத் (தோரா என்பதன் பன்மை) என்ற சொல் சட்டங்களை மட்டுமல்ல, அதிகாரபூர்வமான அறிவுறுத்தல்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ்-தொடர்ச்சி கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘அப்போது’ என்பது அதன் தொடர்ச்சிப் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பட்ட திருப்பெயரான நான்கெழுத்துப் பெயரைத் தலைப்பால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עַד אָנָה
  choice: இன்னும் எவ்வளவு காலம்
  rationale: தொடர்ந்து நீடிக்கும் கீழ்ப்படியாமையைக் கண்டிக்கும் வினாவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵאַנְתֶּם
  choice: மறுப்பீர்கள்
  rationale: இவ்வினைச்சொல் மறுத்தல் அல்லது மனமில்லாமல் இருத்தல் என்பதைக் குறிக்கிறது; சொல்லாட்சியின் வினாவடிவம் தொடரும் பிடிவாதத்தை வெளிப்படுத்துகிறது.
- source_word: לִשְׁמֹר
  choice: கடைப்பிடிக்க
  rationale: கட்டளைகள் தொடர்பில் שׁמר என்பது அவற்றைக் காத்து நடப்பதை, அதாவது கடைப்பிடிப்பதை, குறிக்கிறது.
- source_word: מִצְוֺתַי
  choice: என் கட்டளைகள்
  rationale: இச்சொல் அதிகாரபூர்வமான தெய்வீக ஆணைகளைக் குறிக்கிறது; ‘கட்டளைகள்’ அதன் உடன்படிக்கை மற்றும் சட்டப் பாங்கைப் பேணுகிறது.
- source_word: וְתוֹרֹתָי
  choice: என் சட்டங்கள்
  rationale: ‘என் கட்டளைகள்’ என்பதுடன் இணையாகவும் இச்சூழலின் நெறிப்படுத்தும் வலிமையுடனும் இருப்பதால் ‘சட்டங்கள்’ முதன்மை உரையில் பொருத்தமானது; ‘அறிவுறுத்தல்கள்’ என்ற விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: எபிரெய உரை தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது; அதை ‘ஆண்டவர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வடிவத்தையும் உடன்படிக்கைப் பாங்கையும் பேணுகிறது.
- issue: முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் வரும் תּוֹרָה என்பதன் பன்மையை மொழிபெயர்த்தல்
  choice: சட்டங்கள்
  alternative: அறிவுறுத்தல்கள்
  rationale: கண்டிப்பின் சட்டரீதியான வலிமையை முதன்மை உரையில் ‘சட்டங்கள்’ பேணுகிறது. அதேவேளையில், תּוֹרָה அதிகாரபூர்வமான அறிவுறுத்தலையும் குறிக்கக்கூடும் என்பதால் அந்தப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. பன்மையான இரண்டாம் நபரை ‘நீங்கள்’ என்று வழங்கி, மோசே வழியாக இஸ்ரவேல் மக்களுக்குச் சொல்லப்படும் கண்டிப்பைத் தெளிவாக வைத்திருக்கிறது. அடிக்குறிப்பு குறி அது விளக்கும் ‘சட்டங்கள்’ என்பதற்குப் பின்னர் இடப்பட்டுள்ளது.
