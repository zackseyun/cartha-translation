source:
  edition: WLC
  text: רְא֗וּ כִּֽי יְהוָה֮ נָתַ֣ן לָ/כֶ֣ם הַ/שַּׁבָּת֒ עַל כֵּ֠ן ה֣וּא נֹתֵ֥ן לָ/כֶ֛ם בַּ/יּ֥וֹם הַ/שִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ אִ֣ישׁ תַּחְתָּ֗י/ו אַל יֵ֥צֵא אִ֛ישׁ מִ/מְּקֹמ֖/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִֽי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: ta
  text: பாருங்கள், யாவே உங்களுக்கு ஓய்வுநாளைக் கொடுத்திருக்கிறார்; அதனால்தான் ஆறாம் நாளில் இரண்டு நாட்களுக்கான அப்பத்தை அவர் உங்களுக்குக் கொடுக்கிறார். ஒவ்வொருவரும்[a] அவரவர் இடத்திலேயே இருக்கட்டும்; ஏழாம் நாளில் ஒருவரும் தம் இடத்தைவிட்டு வெளியே செல்ல வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இவ்விரு கட்டளைகளிலும் ‘ஆண்’ என்று சொற்பொருள்படும் אִישׁ என்ற ஆண்பால் சொல் வருகிறது; இங்கு அது சமூகத்திலுள்ள ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் பகிர்நிலையில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאוּ
  choice: பாருங்கள்
  rationale: பன்மை கட்டளை வடிவத்தின் நேரடியான அழைப்பைத் தக்கவைக்கிறது; தொடர்ந்து வரும் விளக்கத்தின் மூலம் ‘உணர்ந்துகொள்ளுங்கள்’ என்ற உட்பொருளும் வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: உங்களுக்கு ஓய்வுநாளைக் கொடுத்திருக்கிறார்
  rationale: முடிவுற்ற கொடை அல்லது அருளைச் சுட்டும் வினை வடிவத்தையும், இஸ்ரயேலருக்காக அளிக்கப்பட்ட ஓய்வுநாளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל כֵּן
  choice: அதனால்தான்
  rationale: முந்தைய கூற்றின் விளைவாக அடுத்த ஏற்பாடு வருகிறது என்ற காரண-விளைவு தொடர்பை இயல்பாகக் காட்டுகிறது.
- source_word: נֹתֵן
  choice: கொடுக்கிறார்
  rationale: நிகழ்கால அல்லது வழக்கமான ஏற்பாட்டைச் சுட்டும் எபிரெயப் பங்கேற்பு வினையின் பொருளைத் தக்கவைக்கிறது.
- source_word: לֶחֶם יוֹמָיִם
  choice: இரண்டு நாட்களுக்கான அப்பம்
  rationale: ‘இரண்டு நாட்களுக்குரிய அப்பம்’ என்ற சொற்பொருளை உணவு என்று பொதுமைப்படுத்தாமல் தெளிவாக வழங்குகிறது.
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: ஒவ்வொருவரும் அவரவர் இடத்திலேயே இருக்கட்டும்
  rationale: ישב என்பதை இங்கு ‘உட்காருங்கள்’ என்று சொற்சொல்லாக அல்லாமல் ‘இருங்கள்’ என்றும், תַּחְתָּיו என்பதைச் சூழலுக்கேற்ற ‘அவரவர் இடத்தில்’ என்றும் வழங்குகிறது.
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: ஒருவரும் தம் இடத்தைவிட்டு வெளியே செல்ல வேண்டாம்
  rationale: எதிர்மறை கட்டளையின் வலிமையையும், ‘இடம்’ மற்றும் ‘வெளியே செல்லுதல்’ என்ற மூலச்சொற்களையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: கூடுதல் விளக்கம் சேர்க்காமல் மூலத்தின் காலக் குறிப்பை நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைபெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: אִישׁ என்பதன் பகிர்நிலைப் பயன்பாடு
  choice: ஒவ்வொருவரும் / ஒருவரும்
  alternative: ஒவ்வொரு ஆணும் / எந்த ஆணும்
  rationale: இங்கு ஆண்பால் ஒருமைச் சொல் சமூகத்தின் ஒவ்வொரு உறுப்பினரையும் பகிர்நிலையில் குறிக்கிறது. தமிழில் ‘ஒவ்வொருவரும் / ஒருவரும்’ என்பது அதன் உள்ளடக்க வரம்பை இயல்பாகக் காட்டுகிறது; மூலத்தின் ஆண்பால் வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ஓய்வுநாள் ஒரு கொடையாக வழங்கப்படுதல்
  choice: ஓய்வுநாளைக் கொடுத்திருக்கிறார்
  alternative: ஓய்வுநாளை உங்களுக்காக நியமித்திருக்கிறார்
  rationale: נתן என்பதன் அடிப்படை ‘கொடு’ பொருளைத் தக்கவைத்து, ஓய்வுநாள் மக்களுக்கு அளிக்கப்பட்டது என்ற உரையின் இறையியல் அழுத்தத்தை விளக்கித் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஓய்வுநாள்’ என்ற நிலையான வேதாகமச் சொல் பயன்படுத்தப்பட்டுள்ளது; கட்டளையின் நேரடித்தன்மையும் காரண-விளைவு அமைப்பும் தக்கவைக்கப்பட்டுள்ளன.
