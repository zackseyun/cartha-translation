  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: ta
  text: 'அவர் அவர்களிடம், “யாவே சொன்னது இதுதான்: நாளைச் சிறப்பான ஓய்வு; யாவேக்குப் பரிசுத்தமான ஓய்வுநாள்.[a] நீங்கள் சுட வேண்டியதைச் சுடுங்கள்; வேகவைக்க வேண்டியதை வேகவையுங்கள்.[b] மீதமுள்ள அனைத்தையும் உங்களுக்காக ஒதுக்கி வைத்து, காலைய்வரை பாதுகாத்திருங்கள்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கு உரிய பரிசுத்த ஓய்வுநாள்.”
    reason: שַׁבָּתוֹן שַׁבַּת קֹדֶשׁ לַיהוָה என்ற இணைப்புச்சொல் இல்லாத தொடரை, ‘சிறப்பான ஓய்வு’ மற்றும் ‘யாவேக்குப் பரிசுத்தமான ஓய்வுநாள்’ என்ற விளக்க இணைநிலையாகவோ, ஒரே பெயர்ச்சொல் தொடராகவோ வாசிக்கலாம்.
  - marker: b
    text: 'எபிரெயத்தில் வலியுறுத்துவதற்காக வினைகள் மீண்டும் வருகின்றன: “சுட வேண்டியதைச் சுடுங்கள்; வேகவைக்க வேண்டியதை வேகவையுங்கள்.”'
    reason: மூலத்தின் வினை மறுபயன்பாடு தயாரிப்பு கட்டளையின் வலியுறுத்தலையும் இணை அமைப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: எபிரெயக் கதைநடையின் இயல்பான பேச்சு அறிமுகத்தைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: யாவே சொன்னது இதுதான்
  rationale: הוּא אֲשֶׁר என்பதன் சுட்டும் வலியுறுத்தலையும், நிறைவுற்ற தெய்வீக உரையின் தற்போதைய பொருத்தத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் எபிரெய வடிவமான YHWH-ஐ ‘கர்த்தர்’ போன்ற பதிலீட்டால் மறைக்காமல், தமிழில் ஒலிபெயர்க்கிறது.
- source_word: שַׁבָּתוֹן שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: முழுமையான ஓய்வுநாள்—யாவேக்குப் பரிசுத்தமான ஓய்வுநாள்
  rationale: שַׁבָּתוֹן குறிக்கும் சிறப்பான அல்லது முழுமையான ஓய்வையும், அதை விளக்கும் שַׁבַּת קֹדֶשׁ לַיהוָה என்ற தொடரையும் இணைநிலையில் காக்கிறது.
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: நீங்கள் சுட வேண்டியதைச் சுடுங்கள்
  rationale: ஒரே வினையின் எபிரெய மறுபயன்பாட்டை இயல்பான தமிழில் தக்கவைத்து, தயாரிப்பை இப்போதே முடிக்க வேண்டிய கட்டளையை உணர்த்துகிறது.
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: வேகவைக்க வேண்டியதை வேகவையுங்கள்
  rationale: בשל என்பதன் ‘வேகவைத்தல்/சமைத்தல்’ பொருளில் இச்சூழலுக்கேற்ற பரந்த சமையல் சொல்லைத் தேர்ந்தெடுத்து, மூலத்தின் வினை மறுபயன்பாட்டைப் பாதுகாக்கிறது.
- source_word: וְאֵת כָּל הָעֹדֵף
  choice: மீதமுள்ள அனைத்தையும்
  rationale: தயாரித்த பின் எஞ்சியிருக்கும் முழுப் பகுதியையும் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: הַנִּיחוּ לָכֶם לְמִשְׁמֶרֶת עַד הַבֹּקֶר
  choice: உங்களுக்காகக் காலைய்வரை பத்திரமாக வைத்திருங்கள்
  rationale: ஒதுக்கி வைத்தல், தங்களுக்காக வைத்தல், பாதுகாத்தல், காலைய்வரையிலான காலவரம்பு ஆகிய கூறுகளைச் செறிவான தமிழில் கொண்டுவருகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் திருநாமம் நேரடியாக உள்ளது. ‘யாவே’ என்பது YHWH-இன் பொதுவாக ஏற்கப்படும் உச்சரிப்பைத் தமிழ் ஒலியில் பிரதிபலிக்கிறது; பட்டப்பெயரால் அதை மாற்றுவதில்லை.
- issue: שַׁבָּתוֹן மற்றும் שַׁבַּת קֹדֶשׁ ஆகியவற்றின் உறவு
  choice: விளக்க இணைநிலையாக, ‘முழுமையான ஓய்வுநாள்—யாவேக்குப் பரிசுத்தமான ஓய்வுநாள்’
  alternative: ‘முழுமையான ஓய்வு; யாவேக்குப் பரிசுத்தமான ஓய்வுநாள்’ என இரண்டு பெயர்ச்சொல் தொடர்களாக வாசித்தல்
  rationale: எபிரெயத்தில் இணைப்புச்சொல் இல்லாததால் விளக்க அல்லது இணைநிலை உறவு உள்ளது; கோடு அந்த உறவை வெளிப்படுத்துகிறது, ஆனால் அதைத் தனி கோட்பாட்டுச் சொல்லாக்கமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஓய்வுநாள்’ என்பது ‘சப்தோன்/சபத்’ என்ற ஒலிபெயர்ப்பைவிட உடனடியாகப் புரியும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; ‘பரிசுத்தமான’ என்பது வழிபாட்டு அர்ப்பணிப்பின் தன்மையைத் தக்கவைக்கிறது. கட்டளைகளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
