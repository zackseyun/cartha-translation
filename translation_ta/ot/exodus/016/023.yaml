  to: 'அவர் அவர்களிடம், “யாவே சொன்னது இதுதான்: நாளைச் சிறப்பான ஓய்வு; யாவேக்குப் பரிசுத்தமான ஓய்வுநாள்.[a] நீங்கள் சுட வேண்டியதைச் சுடுங்கள்; வேகவைக்க வேண்டியதை வேகவையுங்கள்.[b] மீதமுள்ள அனைத்தையும் உங்களுக்காக ஒதுக்கி வைத்து, காலைய்வரை பாதுகாத்திருங்கள்” என்றார்.'
