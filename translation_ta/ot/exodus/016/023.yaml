review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the divine name யாவே, the temporal emphasis on ‘tomorrow,’ the paired food-preparation instructions, and the command to retain the remainder until morning. However, ‘முழுமையான ஓய்வுநாள்’ makes שַׁבָּתוֹן more absolute than necessary and also prematurely merges it with the following explicit ‘holy Sabbath’ phrase. The Hebrew is better represented by a distinct but appositional expression, ‘சிறப்பான ஓய்வு; யாவேக்குப் பரிசுத்தமான ஓய்வுநாள்.’
  naturalness: The prose is generally clear and modern. ‘ஒதுக்கி வைத்து, காலைய்வரை பாதுகாத்திருங்கள்’ is more idiomatic and more explicitly conveys both setting aside and keeping than ‘உங்களுக்காகக் காலைய்வரை பத்திரமாக வைத்திருங்கள்.’
  terminology: ‘யாவே’ appropriately represents יהוה. ‘பரிசுத்தமான’ suitably renders קדשׁ. ‘சிறப்பான ஓய்வு’ conveys the marked cultic rest of שַׁבָּתוֹן without imposing the stronger interpretation ‘complete rest.’ ‘வேகவையுங்கள்’ is retained as a contextually suitable rendering of the boiling/cooking verb.
  issues:
  - severity: medium
    issue: ‘முழுமையான ஓய்வுநாள்’ over-specifies שַׁבָּתוֹן and conflates it with the following Sabbath expression.
    rationale: שַׁבָּתוֹן denotes a special/solemn cessation or rest; ‘complete’ is possible in some contexts but is not required here. The next words explicitly identify the day as ‘a holy Sabbath to Yahweh,’ so the first term should remain distinguishable.
  - severity: low
    issue: ‘பத்திரமாக வைத்திருங்கள்’ does not as clearly express the two source elements of setting aside and keeping.
    rationale: הַנִּיחוּ ... לְמִשְׁמֶרֶת calls for intentional reservation for preservation. ‘ஒதுக்கி வைத்து, ... பாதுகாத்திருங்கள்’ preserves both elements naturally.
  revised_text: 'அவர் அவர்களிடம், “யாவே சொன்னது இதுதான்: நாளைச் சிறப்பான ஓய்வு; யாவேக்குப் பரிசுத்தமான ஓய்வுநாள்.[a] நீங்கள் சுட வேண்டியதைச் சுடுங்கள்; வேகவைக்க வேண்டியதை வேகவையுங்கள்.[b] மீதமுள்ள அனைத்தையும் உங்களுக்காக ஒதுக்கி வைத்து, காலைய்வரை பாதுகாத்திருங்கள்” என்றார்.'
