source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: ta
  text: 'மோசே சொன்னார்: “யாவே மாலையில் நீங்கள் உண்பதற்கு இறைச்சியையும், காலையில் நீங்கள் நிறைவடையும் அளவுக்கு அப்பத்தையும் கொடுக்கும்போது, நீங்கள் அவருக்கு எதிராக முறுமுறுக்கும் உங்கள் முறுமுறுப்புகளை[a] யாவே கேட்பதால், நாங்கள் எம்மாத்திரம்? உங்கள் முறுமுறுப்புகள் எங்களுக்கு எதிரானவை அல்ல; யாவேக்கு எதிரானவை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “நீங்கள் முறுமுறுக்கும் உங்கள் முறுமுறுப்புகள்” என்று பெயர்ச்சொல்லும் அதனுடன் தொடர்புடைய வினைச்சொல்லும் இணைந்து வருகின்றன. இது குற்றச்சாட்டை வலுப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתֵת
  choice: கொடுப்பார்
  rationale: ב prefixed to the infinitive construct introduces the circumstance of Yahweh’s giving. In Tamil, a finite predictive verb is clearer and more natural here, while the following sentence expresses the associated reason.
- source_word: יְהוָה
  choice: யாவே
  rationale: The divine name is transliterated rather than replaced with a title, preserving the personal covenant name in the Hebrew text.
- source_word: בָּשָׂר
  choice: இறைச்சி
  rationale: In this food context, ‘இறைச்சி’ naturally conveys edible meat rather than the more literal ‘சதை’.
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: The concrete ordinary sense ‘bread’ is retained rather than generalized as food.
- source_word: לִשְׂבֹּעַ
  choice: நீங்கள் நிறைவடையும் அளவுக்கு
  rationale: The expression conveys eating to satiety; this wording is clear, natural, and preserves the sense of sufficiency.
- source_word: בִּשְׁמֹעַ
  choice: ஏனெனில் ... கேட்டிருக்கிறார்
  rationale: 'The infinitival construction is understood causally in context: Yahweh’s provision responds to the people’s grumbling.'
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: நீங்கள் ... முறுமுறுத்தும் உங்கள் முறுமுறுப்புகளை
  rationale: Using the cognate Tamil noun and verb preserves the emphatic repetition in the Hebrew, despite its marked style.
- source_word: וְנַחְנוּ מָה
  choice: நாங்கள் எம்மாத்திரம்?
  rationale: This idiomatic Tamil question retains the Hebrew emphasis on Moses and Aaron’s insignificance as targets of the complaint.
- source_word: לֹא עָלֵינוּ ... כִּי עַל יְהוָה
  choice: எங்களுக்கு எதிரானவை அல்ல; யாவேக்கு எதிரானவை
  rationale: The contrast is made explicit in natural Tamil without changing the direction of the accusation.
theological_decisions:
- issue: Rendering the divine name יְהוָה
  choice: யாவே
  alternative: யெகோவா / கர்த்தர்
  rationale: The Hebrew directly uses the Tetragrammaton. Transliteration preserves the personal divine name and avoids replacing it with a title.
- issue: Direction of Israel’s grumbling
  choice: அவருக்கு எதிராக / யாவேக்கு எதிரானவை
  alternative: அவரைப் பற்றிய முறுமுறுப்புகள்
  rationale: The preposition עַל with the complaint terminology here indicates hostile direction. The translation therefore retains the charge that the grumbling is against Yahweh.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘எம்மாத்திரம்?’ என்பது கேள்வியின் வலிமையையும் மோசே, ஆரோனின் முக்கியமின்மையையும் இயல்பாக வெளிப்படுத்துகிறது. எபிரெயச் சொல் மீளுருவாக்கம் அடிக்குறிப்புடன் திட்டமிட்டே பாதுகாக்கப்பட்டுள்ளது.
