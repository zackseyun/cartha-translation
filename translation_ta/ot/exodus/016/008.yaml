revisions:
- from: 'மோசே சொன்னார்: “யாவே மாலையில் நீங்கள் உண்பதற்கு இறைச்சியையும், காலையில் நீங்கள் நிறைவடையும் அளவுக்கு அப்பத்தையும் கொடுப்பார். ஏனெனில், நீங்கள் அவருக்கு எதிராக முறுமுறுத்தும் உங்கள் முறுமுறுப்புகளை[a] யாவே கேட்டிருக்கிறார். நாங்கள் எம்மாத்திரம்? உங்கள் முறுமுறுப்புகள் எங்களுக்கு எதிரானவை அல்ல; யாவேக்கு எதிரானவை.”'
  to: 'மோசே சொன்னார்: “யாவே மாலையில் நீங்கள் உண்பதற்கு இறைச்சியையும், காலையில் நீங்கள் நிறைவடையும் அளவுக்கு அப்பத்தையும் கொடுக்கும்போது, நீங்கள் அவருக்கு எதிராக முறுமுறுக்கும் உங்கள் முறுமுறுப்புகளை[a] யாவே கேட்பதால், நாங்கள் எம்மாத்திரம்? உங்கள் முறுமுறுப்புகள் எங்களுக்கு எதிரானவை அல்ல; யாவேக்கு எதிரானவை.”'
  rationale: The revision preserves the Hebrew’s temporal-causal linkage and avoids adding a completed aspect to Yahweh’s hearing. It retains the deliberate noun–cognate-verb repetition, supported by the footnote, while making the Tamil clause structure more coherent.
