  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל אָֽכְל֤וּ אֶת הַ/מָּן֙ אַרְבָּעִ֣ים שָׁנָ֔ה עַד בֹּאָ֖/ם אֶל אֶ֣רֶץ נוֹשָׁ֑בֶת אֶת הַ/מָּן֙ אָֽכְל֔וּ עַד בֹּאָ֕/ם אֶל קְצֵ֖ה אֶ֥רֶץ כְּנָֽעַן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் மக்கள் குடியிருக்கும் நாட்டிற்கு வந்து சேரும்வரை நாற்பது ஆண்டுகள் மன்னாவை உண்டார்கள்; கானான் நாட்டின் எல்லைக்கு வந்து சேரும்வரை அவர்கள் மன்னாவை உண்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மொழியில் நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என்று இருந்தாலும், இது முழு இஸ்ரவேல் மக்களையும் குறிக்கும் வழக்கமான இனக்குழுப் பெயர். நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் உள்ளடக்கமாகவும் பொருளைத் தருகிறது.
- source_word: אָכְלוּ אֶת הַמָּן
  choice: மன்னாவைச் சாப்பிட்டார்கள்
  rationale: Qal perfect வடிவம் கடந்தகாலச் சுருக்கக் கூற்றைக் குறிக்கிறது. மָן என்பதற்கான நிலைபெற்ற தமிழ் வடிவமாக ‘மன்னா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: காலநீட்சியைக் குறிக்கும் எளிய, இயல்பான தமிழ் வடிவம்.
- source_word: עַד בֹּאָם
  choice: வந்து சேரும்வரை
  rationale: בוא என்பதன் அடிப்படைப் பொருளான ‘வருதல்’ காக்கப்படுகிறது; ‘நுழைதல்’ என்று சூழலிலிருந்து கூடுதல் பொருள் சேர்க்கப்படவில்லை. இலக்கை அடைவதைத் தமிழில் இயல்பாகக் காட்ட ‘வந்து சேரும்வரை’ என வழங்கப்பட்டுள்ளது.
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: குடியிருப்புள்ள ஒரு நாட்டிற்கு
  rationale: נוֹשָׁבֶת என்பது மனிதர்கள் குடியேறி வாழும் நிலத்தைக் குறிக்கிறது; வனாந்தரத்துடன் உள்ள வேறுபாட்டை ‘குடியிருப்புள்ள’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֶל קְצֵה אֶרֶץ כְּנָעַן
  choice: கானான் நாட்டின் எல்லைக்கு
  rationale: קְצֵה என்பதற்கு முடிவு, ஓரம், எல்லை ஆகிய பொருள்கள் உண்டு. புவியியல் சூழலில் ‘எல்லை’ இயல்பானதும் தெளிவானதும் ஆகும்.
