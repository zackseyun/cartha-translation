  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் இரு இணையான காலவரம்புக் கூற்றுகளும் மீளுரையுடன் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற விளக்கமோ சமயப்பிரிவு சார்ந்த சொற்பயன்பாடோ சேர்க்கப்படவில்லை.
