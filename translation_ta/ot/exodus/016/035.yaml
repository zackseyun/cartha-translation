revisions:
- from: இஸ்ரவேல் மக்கள் குடியிருப்புள்ள ஒரு நாட்டிற்கு வந்து சேரும்வரை நாற்பது ஆண்டுகள் மன்னாவைச் சாப்பிட்டார்கள்; கானான் நாட்டின் எல்லைக்கு வந்து சேரும்வரை அவர்கள் மன்னாவைச் சாப்பிட்டார்கள்.
  to: இஸ்ரவேல் மக்கள் மக்கள் குடியிருக்கும் நாட்டிற்கு வந்து சேரும்வரை நாற்பது ஆண்டுகள் மன்னாவை உண்டார்கள்; கானான் நாட்டின் எல்லைக்கு வந்து சேரும்வரை அவர்கள் மன்னாவை உண்டார்கள்.
  rationale: 'The revision makes only safe stylistic improvements: it renders ‘inhabited land’ more idiomatically and uses a more fitting formal Tamil verb for eating. The Hebrew repetition and both temporal boundaries remain explicit; no interpretive or doctrinal content has been added.'
