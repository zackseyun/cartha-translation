- source_word: שֵׁשֶׁת יָמִים
  choice: ஆறு நாட்கள்
  rationale: எபிரெயக் கட்டமைப்பு சொற்படியாக ‘நாட்களில் ஆறு’ என இருந்தாலும், தமிழில் கால அளவை இயல்பாகவும் துல்லியமாகவும் ‘ஆறு நாட்கள்’ என்று வழங்குகிறது.
- source_word: תִּלְקְטֻהוּ
  choice: நீங்கள் அதைச் சேகரிக்க வேண்டும்
  rationale: לקט என்பது சிதறிக் கிடப்பதைப் பொறுக்கிச் சேகரிப்பதைக் குறிக்கிறது; இரண்டாம் நபர் பன்மையும் ஆண்பால் ஒருமை பொருள் பின்னொட்டும் இங்கு உள்ளன. சூழலின் அறிவுறுத்தல் வலிமையை ‘வேண்டும்’ வெளிப்படுத்துகிறது; ‘அதை’ மன்னாவைக் குறித்தாலும் மூலத்தின் பதிற்பெயர் வடிவத்தைப் பேணுகிறது.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ஆனால் ஏழாம் நாள்
  rationale: וְ இணைப்புச்சொல் அடிப்படையில் ‘மற்றும்/அப்போது’ என வரலாம்; இங்கு முந்திய ஆறு நாட்களுக்கும் ஏழாம் நாளுக்கும் உள்ள வேறுபாட்டை இயல்பான தமிழில் ‘ஆனால்’ தெளிவாக்குகிறது.
- source_word: שַׁבָּת
  choice: ஓய்வுநாள்
  rationale: שַׁבָּת என்பது ஓய்வை நிறுத்துதலைக் குறிக்கும் பெயர்ச்சொல். நவீன பொதுத் தமிழில் ‘ஓய்வுநாள்’ தெளிவாகவும் மதிப்புடனும் உள்ளது; தனிப்பெயராக்கி உரையில் இல்லாத குறிப்புத்தன்மையைச் சேர்க்கவில்லை.
- source_word: לֹא יִהְיֶה בּוֹ
  choice: அன்று அது இருக்காது
  rationale: சொற்படியாக ‘அதில்/அந்நாளில் அது இருக்காது.’ בּוֹ என்பதன் நாள்சார்ந்த பொருளை ‘அன்று’ இயல்பாக வெளிப்படுத்துகிறது; ‘அது’ எதைச் சுட்டுகிறது என்பதை உடலுரையில் ‘மன்னா’ என வெளிப்படையாக நிரப்பாமல் மூலத்தின் மறைசுட்டை காக்கிறது.
theological_decisions:
- issue: சீனாய் உடன்படிக்கைக்கு முந்திய சூழலில் שַׁבָּת என்பதன் மொழிபெயர்ப்பு
  choice: ஓய்வுநாள்
  alternative: ஓய்வுநாளாகிய சபத் நாள் / அந்த ஓய்வுநாள்
  rationale: שַׁבָּת இங்கு உருபின்றி ‘ஏழாம் நாள்’ என்பதற்கு விளக்கப் பெயராக வருகிறது. ‘ஓய்வுநாள்’ அதன் அடிப்படைப் பொருளையும் பெயர்ச்சொல் செயலையும் காக்கிறது; பின்னாளைய வழிபாட்டு அல்லது சமயப் பயன்பாட்டை தேவையின்றி முன்கொண்டு வருவதில்லை.
- issue: לֹא יִהְיֶה בּוֹ என்பதில் வெளிப்படையாகக் கூறப்படாத எழுவாய்
  choice: அன்று அது இருக்காது
  alternative: அன்று மன்னா இருக்காது
  rationale: சூழலில் ‘அது’ மன்னாவைக் குறிக்கிறது. ஆயினும் எபிரெயத்தில் மன்னா மீண்டும் பெயரிடப்படவில்லை; ஆகவே உடலுரையில் பதிற்பெயரைப் பேணி, அதன் குறிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்பான நடையில் வழங்கப்பட்டது. ‘நீங்கள்’ பன்மை முகவரியைத் தெளிவாகக் காக்கிறது. அரைப்புள்ளிகள் மூலவாக்கியத்தின் மூன்று கூறுகளையும் நெருக்கமாக இணைக்கின்றன; ‘அன்று அது இருக்காது’ என்பது இயல்பான தமிழுடன் மூலத்தின் மறைசுட்டையும் காக்கிறது.
