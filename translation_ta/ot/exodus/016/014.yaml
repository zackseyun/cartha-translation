base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: ta
  text: பனிப்படலம் மேலெழுந்தபின்[a], இதோ, வனாந்தரத்தின் மேற்பரப்பில் செதில்போன்ற நுண்ணிய ஒன்று, தரையின்மேல் இருக்கும் உறைபனியைப்போல நுண்ணியதாக இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பனிப்படலம் விலகியபின்’; எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘மேலே எழுந்தபின்.’
    reason: lexical_alternative
  - marker: b
    text: ‘செதில்போன்ற’ என்று மொழிபெயர்க்கப்பட்ட அரிதான எபிரெயச் சொல்லின் துல்லியமான நுண்பொருள் உறுதியற்றது; அது அந்தப் பொருளின் அமைப்பையோ தோற்றத்தையோ விவரிக்கலாம்.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: וַתַּעַל
  choice: மேலெழுந்தபோது
  rationale: עלה என்பதன் நேரடிப் பொருளான ‘மேலே எழுதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; ‘ஆவியானபோது’ என்று விளக்கி மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: שִׁכְבַת הַטָּל
  choice: பனிப் படலம்
  rationale: שִׁכְבָה குறிக்கும் அடுக்கு அல்லது படலம் என்ற கருத்தை இயல்பான தமிழில் தருகிறது; இங்கு טַל என்பது காலைப் பனி.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் கண்ணில் படுவதைச் சுட்டிக்காட்டும் எபிரெய உரையாடல் துகளின் உயிரோட்டத்தைத் தக்கவைக்கிறது.
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: வனாந்தரத்தின் மேற்பரப்பில்
  rationale: פְּנֵי என்பதன் ‘முகம்/மேற்பரப்பு’ என்ற இடவியல் கருத்தைத் தெளிவாகக் காட்டுகிறது; מִדְבָּר என்பதற்கு யாத்திராகமச் சூழலில் ‘வனாந்தரம்’ பொருத்தமானது.
- source_word: דַּק
  choice: நுண்ணிய
  rationale: இருமுறை வரும் சொல்லின் மெலிவு அல்லது நுண்மை சார்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: מְחֻסְפָּס
  choice: செதில்போன்ற ஒன்று
  rationale: மிக அரிதான இந்தச் சொல்லின் துல்லிய நுண்பொருள் உறுதியற்றது; அதன் தோற்றம் அல்லது அமைப்பு செதில்/துகள் போன்றதாக இருந்திருக்கலாம். பெயர்ச்சொல் மறைந்திருப்பதால் தமிழில் ‘ஒன்று’ சேர்க்கப்பட்டது.
- source_word: דַּק כַּכְּפֹר
  choice: உறைபனியைப் போல நுண்ணிய
  rationale: כְּפֹר குறிக்கும் frost/hoarfrost ஒப்பீட்டையும் மீண்டும் வரும் דַּק என்பதையும் பாதுகாக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: தரையின்மேல்
  rationale: உடனடி இயற்பரப்பைக் குறிக்கும் சூழலில் אֶרֶץ என்பதற்கு ‘தரை’ இயல்பான தேர்வு.
