  source_fidelity: முதன்மை மொழிபெயர்ப்பு எபிரெய மூலத்தின் காலக் குறிப்பு, எதிர்காலக் காணுதல், யாவேயின் மகிமை, முறுமுறுப்பு யாவேக்கு எதிரானது என்ற பொருள், மற்றும் இறுதியிலுள்ள சொல்லாட்சிக் கேள்வி ஆகியவற்றை நன்றாகக் காக்கிறது. בְּשָׁמְעוֹ-வின் காரணப் பொருளும் உரையில் சாத்தியமானது; காலப் பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
