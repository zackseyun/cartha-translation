  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: ta
  text: காலையில் நீங்கள் யாவேயின் மகிமையைக் காண்பீர்கள்[a]; ஏனெனில், யாவேக்கு எதிரான உங்கள் முறுமுறுப்புகளை அவர் கேட்டிருக்கிறார். எங்களுக்கு எதிராக நீங்கள் முறுமுறுப்பதற்கு நாங்கள் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கு எதிரான உங்கள் முறுமுறுப்புகளை அவர் கேட்கும்போது.” எபிரெய மொழி அமைப்பை காரணப் பொருளிலும் காலப் பொருளிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֹקֶר
  choice: காலையில்
  rationale: பெயர்ச்சொல் இங்கு காலத்தைக் குறிக்கும் வினையடையாகச் செயல்படுகிறது. தமிழில் இயல்பான காலக் குறிப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: וּרְאִיתֶם
  choice: நீங்கள் காண்பீர்கள்
  rationale: இச்சூழலில் இவ்வடிவம் எதிர்கால முன்னறிவிப்பைக் குறிக்கிறது.
- source_word: כְּבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: כָּבוֹד என்பது யாவேயின் வெளிப்படும் மாட்சிமையையும் பிரசன்னத்தையும் குறிக்கிறது; ‘மகிமை’ அதன் இறையியல் ஒலிப்பைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர் ஒரு பட்டத்தால் மாற்றப்படாமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּשָׁמְעוֹ
  choice: ஏனெனில் ... அவர் கேட்டிருக்கிறார்
  rationale: בְּ + infinitive construct அமைப்பு காலப் பொருளையோ காரணப் பொருளையோ தரலாம். பிரதான உரையில் சூழலுக்குப் பொருந்தும் காரணப் பொருள் தேர்ந்தெடுக்கப்பட்டு, காலப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: תְּלֻנֹּתֵיכֶם / תלונו
  choice: உங்கள் முறுமுறுப்புகள் / நீங்கள் முறுமுறுப்பது
  rationale: பெயர்ச்சொல்லுக்கும் வினைச்சொல்லுக்கும் இடையிலான சொல் தொடர்பைத் தக்கவைத்து, அதிருப்தியுடன் தொடர்ந்து குறைகூறும் எதிர்மறைத் தொனியை ‘முறுமுறுப்பு’ வெளிப்படுத்துகிறது.
- source_word: עַל יְהוָה / עָלֵינוּ
  choice: யாவேக்கு எதிரான / எங்களுக்கு எதிராக
  rationale: עַל இங்கு வெறும் பொருளைக் குறிக்காமல், குறைசொல்லுதல் யாருக்கு எதிராகச் செலுத்தப்படுகிறது என்பதைக் காட்டுகிறது.
- source_word: וְנַחְנוּ מָה כִּי
  choice: நாங்கள் யார், ... முறுமுறுப்பதற்கு?
  rationale: மோசேயும் ஆரோனும் தங்களின் முக்கியமின்மையை வலியுறுத்தும் சொல்லாட்சிக் கேள்வி. சொற்சொல்லான ‘நாங்கள் என்ன?’ என்பதற்குப் பதிலாக இயல்பான தமிழில் அதே பொருள் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּשָׁמְעוֹ என்பதன் காரண அல்லது காலப் பொருள்
  choice: ஏனெனில் ... அவர் கேட்டிருக்கிறார்
  alternative: அவர் கேட்கும்போது
  rationale: யாவேயின் மகிமை வெளிப்படுவதற்கான காரணமாக மக்களின் முறுமுறுப்பைக் கேட்டது எடுத்துரைக்கப்படுவது உடனடிச் சூழலுக்கு ஏற்றது. இருப்பினும் எபிரெய அமைப்பின் உண்மையான காலப் பொருள் சாத்தியம் அடிக்குறிப்பில் தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழின் இயல்பான, கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘முறுமுறுப்பு’ என்ற சொல் பெயர் மற்றும் வினை வடிவங்களின் தொடர்பையும் எதிர்மறைத் தொனியையும் தக்கவைக்கிறது. அடிக்குறி பிரதான உரையில் [a] எனச் சேர்க்கப்பட்டுள்ளது.
