revisions:
- from: அப்போது யெகோவா மோசேயிடம், “இதோ, நான் உங்களுக்காக வானத்திலிருந்து அப்பத்தைப் பொழியப்போகிறேன்.[a] மக்கள் வெளியே சென்று, அன்றன்றுக்குத் தேவையான அளவை அன்றன்றே சேகரிக்கட்டும்.[b] அவர்கள் என் அறிவுறுத்தலின்படி நடப்பார்களா, மாட்டார்களா என்று அவர்களைச் சோதிப்பதற்காகவே இப்படிச் செய்கிறேன்.[c]” என்றார்.
  to: அப்போது யெகோவா மோசேயிடம், “இதோ, நான் உங்களுக்காக வானத்திலிருந்து அப்பத்தைப் பொழியப்போகிறேன்.[a] மக்கள் வெளியே சென்று, ஒவ்வொரு நாளுக்கும் உரிய அளவை அந்தந்த நாளில் சேகரிப்பார்கள்.[b] அவர்கள் என் அறிவுறுத்தலின்படி நடப்பார்களா இல்லையா என்று நான் அவர்களைச் சோதிப்பதற்காகவே இவ்வாறு செய்வேன்.[c]” என்றார்.
  rationale: திருத்தம் எதிர்கால அறிவிப்பு மற்றும் கட்டளை/அனுமதி இடையிலான வேறுபாட்டைக் காக்கிறது; லְמַעַן அடுத்துள்ள நோக்கத்தை தமிழில் வெளிப்படையாகவும் மூலத்திற்கு நெருக்கமாகவும் இணைக்கிறது. ‘இவ்வாறு செய்வேன்’ என்பது வானத்திலிருந்து அப்பம் பொழிவதையும் தினசரி சேகரிப்பு ஏற்பாட்டையும் குறிக்கும் தமிழ்ச் சுட்டு; புதிய இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை. எல்லா அடிக்குறிப்பு அடையாளங்களும் தத்தம் உரைப்பகுதிகளோடு நிலைநிறுத்தப்பட்டுள்ளன.
