  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: ta
  text: அப்போது யெகோவா மோசேயிடம், “இதோ, நான் உங்களுக்காக வானத்திலிருந்து அப்பத்தைப் பொழியப்போகிறேன்.[a] மக்கள் வெளியே சென்று, ஒவ்வொரு நாளுக்கும் உரிய அளவை அந்தந்த நாளில் சேகரிப்பார்கள்.[b] அவர்கள் என் அறிவுறுத்தலின்படி நடப்பார்களா இல்லையா என்று நான் அவர்களைச் சோதிப்பதற்காகவே இவ்வாறு செய்வேன்.[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் உங்களுக்காக வானத்திலிருந்து அப்பத்தைப் பொழிகிறேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினையெச்சம் உடனடியாக நிகழவிருக்கும் செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒரு நாளின் காரியத்தை அதன் நாளில்”; அதாவது, ஒவ்வொரு நாளுக்கும் தேவையான அளவை அந்தந்த நாளிலேயே சேகரிப்பது.
    reason: lexical_alternative
  - marker: c
    text: “என் சட்டத்தின்படி நடப்பார்களா” என்றும் மொழிபெயர்க்கலாம். תּוֹרָה என்ற எபிரெயச் சொல் ‘அறிவுறுத்தல்,’ ‘போதனை,’ அல்லது ‘சட்டம்’ எனப் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: உடன்படிக்கையின் தனிப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் நிலைபெற்றுள்ள ‘யெகோவா’ என்ற வடிவில் தருகிறது.
- source_word: הִנְנִי מַמְטִיר
  choice: இதோ, நான் ... பொழியப்போகிறேன்
  rationale: הִנְנִי அறிவிப்பின் கவன ஈர்ப்பையும், பங்கேற்பெயரின் உடனடி எதிர்கால வலிமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לֶחֶם מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து அப்பம்
  rationale: לֶחֶם என்பதன் தெளிவான ‘அப்பம்’ என்ற பொருளை ‘உணவு’ என்று பொதுமைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: அன்றன்றுக்குத் தேவையான அளவை அன்றன்றே
  rationale: ‘ஒரு நாளின் காரியம் அதன் நாளில்’ என்ற எபிரெய மொழிமரபின் தினசரித் தேவை மற்றும் அதே நாளில் சேகரித்தல் ஆகிய இரு கூறுகளையும் தெளிவாக்குகிறது.
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: அவர்களைச் சோதிப்பதற்காக
  rationale: மூலத்தில் ஒருமை பின்னொட்டு இருந்தாலும், அது ஒருமைக் கூட்டுப்பெயரான ‘மக்கள்’ என்பதைக் குறிப்பதால் தமிழில் இயல்பாகப் பன்மையில் தரப்படுகிறது.
- source_word: הֲיֵלֵךְ בְּתוֹרָתִי
  choice: என் அறிவுறுத்தலின்படி நடப்பார்களா
  rationale: הלך என்பதன் நடத்தை உருவகத்தை ‘நடப்பார்கள்’ எனக் காத்து, תורה என்பதற்கு சினாய் உடன்படிக்கைக்கு முந்தைய இச்சூழலில் இயல்பான ‘அறிவுறுத்தல்’ என்பதைத் தேர்கிறது.
theological_decisions:
- issue: சினாய் உடன்படிக்கைக்கு முந்தைய சூழலில் תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: என் அறிவுறுத்தலின்படி
  alternative: என் சட்டத்தின்படி
  rationale: תּוֹרָה என்பது அடிப்படையில் அறிவுறுத்தல் அல்லது போதனை என்பதைக் குறிக்கும்; இங்கு மன்னாவைச் சேகரிப்பது குறித்த இறை ஆணையே உடனடிச் சூழல். ‘சட்டம்’ என்பதும் சாத்தியமானது, ஆனால் பிற்காலச் சட்டத் தொகுப்பை அளவுக்கு மீறி முன்கொணரக்கூடும்.
- issue: சோதனையின் நோக்கத்தை வெளிப்படுத்துதல்
  choice: அவர்கள் ... நடப்பார்களா, மாட்டார்களா என்று அவர்களைச் சோதிப்பதற்காக
  alternative: அவர்கள் ... நடப்பார்களோ இல்லையோ என்பதை நான் அறிந்துகொள்வதற்காக
  rationale: נסה என்பதற்கு ‘சோதித்தல்’ என்றே தரப்பட்டு, கடவுளுக்கு முன் அறிவு இல்லை என்ற விளக்கத்தைச் சேர்க்கவில்லை; வசனம் கூறும் நோக்கத்தையும் அதன் இறையியல் பதற்றத்தையும் அப்படியே விடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் வகையிலும் வேதாகம உரைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இதோ’ அறிவிப்பின் வலிமையைத் தக்கவைக்கிறது; ‘அன்றன்று’ என்ற நடை மூலத்தின் பகிர்ந்தளிக்கும் தினசரி கருத்தை இயல்பாகக் கொண்டுவருகிறது. எல்லா அடிக்குறிப்பு அடையாளங்களும் உரையில் தொடர்புடைய இடங்களில் இடப்பட்டுள்ளன.
