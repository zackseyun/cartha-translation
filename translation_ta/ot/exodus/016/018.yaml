  text: וַ/יָּמֹ֣דּוּ בָ/עֹ֔מֶר וְ/לֹ֤א הֶעְדִּיף֙ הַ/מַּרְבֶּ֔ה וְ/הַ/מַּמְעִ֖יט לֹ֣א הֶחְסִ֑יר אִ֥ישׁ לְ/פִֽי אָכְל֖/וֹ לָקָֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: ta
  text: அவர்கள் அதை ஓமர் அளவால் அளந்தபோது, அதிகமாகச் சேகரித்தவருக்கு எதுவும் மிஞ்சவில்லை; குறைவாகச் சேகரித்தவருக்கும் பற்றாக்குறை ஏற்படவில்லை.[a] ஒவ்வொருவரும் தாம் உண்ணும் அளவின்படி சேகரித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிகம் வைத்திருந்தவருக்கு மிகுதி இல்லை; குறைவாக வைத்திருந்தவருக்கு எதுவும் குறையவில்லை.”
    reason: எபிரெய பங்கேற்பெயர்களை ‘சேகரித்தவர்’ என்று சூழல்படுத்தாமல், இருப்பு அல்லது உடைமையை மையப்படுத்தியும் மொழிபெயர்க்கலாம்; மேலும் இணையான இரு வினைகளையும் ‘மிகுதி இல்லை / குறையவில்லை’ என்று நெருக்கமாகத் தரலாம்.
lexical_decisions:
- source_word: וַיָּמֹדּוּ
  choice: அவர்கள் அதை ... அளந்தபோது
  rationale: வாவ்-தொடர்வினை கதையை முன்னெடுத்தாலும், அடுத்துவரும் விளைவை அறிமுகப்படுத்தும் காலச் சூழலாக இங்கு இயல்பாக அமைகிறது. தமிழில் ‘அளந்தபோது’ அந்த உறவைத் தெளிவாகத் தருகிறது; ‘அதை’ என்பது சூழலில் உள்ள மன்னாவைக் குறிக்கிறது.
- source_word: בָעֹמֶר
  choice: ஓமர் அளவால்
  rationale: עֹמֶר என்பது உலர் பொருட்களுக்கான பண்டைய அளவை. நவீன அலகாக மாற்றாமல் மூலத்தின் குறிப்பிட்ட அளவைப் பாதுகாக்கிறது; ‘அளவால்’ என்பது அதை அளவீட்டுத் தரமாகப் பயன்படுத்தியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הֶעְדִּיף
  choice: எதுவும் மிஞ்சவில்லை
  rationale: இந்த வினை மிகுதி அல்லது உபரியாக இருப்பதைக் குறிக்கிறது. அளந்தபின் அதிகமாகச் சேகரித்தவரிடம் உபரி இருக்கவில்லை என்ற சூழல்சார்ந்த பொருளை இச்சொற்றொடர் இயல்பாகத் தருகிறது.
- source_word: הַמַּרְבֶּה
  choice: அதிகமாகச் சேகரித்தவர்
  rationale: வடிவில் இது ‘அதிகப்படுத்துகிறவர்’ என்ற பங்கேற்பெயர். மன்னாவைச் சேகரிக்கும் உடனடிச் சூழல், விடுபட்ட செயலை ‘சேகரித்தவர்’ என்று வெளிப்படுத்துவதை ஆதரிக்கிறது.
- source_word: הֶחְסִיר
  choice: பற்றாக்குறை ஏற்படவில்லை
  rationale: இந்த வினை குறைபடுதல் அல்லது போதாமையைச் சுட்டுகிறது. அதிகம் சேகரித்தவரின் ‘மிஞ்சவில்லை’ என்பதற்கு இணையான எதிர்சமநிலையை இது தெளிவாகக் காட்டுகிறது.
- source_word: הַמַּמְעִיט
  choice: குறைவாகச் சேகரித்தவர்
  rationale: இது வடிவில் ‘குறைக்கிறவர்’ என்ற பங்கேற்பெயர்; மன்னா சேகரிப்பு என்ற சூழலில் குறைவாகச் சேகரித்த நபரைக் குறிக்கிறது.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: ஆண்பால் ஒருமை வடிவம் இங்கு குழுவிலுள்ள ஒவ்வொரு நபரையும் பகிர்ந்தளிக்கும் முறையில் குறிக்கிறது. ‘ஒவ்வொருவரும்’ அந்தப் பகிர்ந்தளிக்கும் வலிமையைப் பேணுவதோடு, ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தையும் தவிர்க்கிறது.
- source_word: לְפִי אָכְלוֹ
  choice: தாம் உண்ணும் அளவின்படி
  rationale: சொல்லுக்குச் சொல் ‘அவரது உண்ணுதலின் வாய்க்கேற்ப’ என்ற எபிரெய மொழிமரபு, உண்பதற்குத் தேவையான அளவைக் குறிக்கிறது. ‘தாம் உண்ணும் அளவின்படி’ என்பது இயல்பான, மரியாதையான தமிழில் அந்தப் பொருளைத் தருகிறது.
- source_word: לָקָטוּ
  choice: சேகரித்திருந்தார்கள்
  rationale: மன்னா நிகழ்வில் பயன்படுத்தப்படும் வழக்கமான ‘சேகரித்தல்’ வினையை நேரடியாகப் பேணுகிறது. முன் கூறிய அளவீட்டுக்கு முன்பே சேகரிப்பு நடந்திருந்ததைத் தமிழின் இறந்தகால நிறைவு வடிவம் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: אִישׁ ... אָכְלוֹ என்பவற்றின் ஆண்பால் ஒருமை பகிர்ந்தளிக்கும் அமைப்பு
  choice: ‘ஒவ்வொருவரும் தாம் உண்ணும் அளவின்படி’ என்று பாலினம் சுட்டாத பகிர்ந்தளிக்கும் தமிழில் மொழிபெயர்த்தல்
  alternative: ‘ஒவ்வொரு ஆணும் அவன் உண்ணும் அளவின்படி’
  rationale: எபிரெய ஆண்பால் ஒருமை இங்கு ஆண்களை மட்டும் தனிப்படுத்தாமல், ஒவ்வொரு நபரையும் பகிர்ந்தளிக்கும் விதத்தில் குறிக்கிறது. தமிழின் ‘தாம்’ ஒருமைச் சுட்டின் உறவை இயல்பாகப் பேணி, மூலத்தில் இல்லாத ஆண்-மட்டும் என்ற பொருளைச் சேர்க்காது.
- issue: הַמַּרְבֶּה / הַמַּמְעִיט பங்கேற்பெயர்களில் மறைந்துள்ள செயல்
  choice: உடனடிச் சூழலின் அடிப்படையில் ‘அதிகமாக/குறைவாகச் சேகரித்தவர்’
  alternative: ‘அதிகம்/குறைவு வைத்திருந்தவர்’
  rationale: மூல வடிவங்கள் செயலை வெளிப்படையாக மறுபடியும் சொல்லாததால் சிறு மொழியியல் திறப்பு உள்ளது. இருப்பினும் முந்தைய வசனங்களும் இறுதியிலுள்ள לָקָטוּ (‘சேகரித்தார்கள்’) என்பதும் சேகரித்தலையே முதன்மைப் பொருளாக உறுதிப்படுத்துகின்றன; மாற்று வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘ஓமர்’ என்ற பண்டைய அளவு மாற்றப்படாமல் பேணப்பட்டுள்ளது. இணை அமைப்பையும் மிகுதி–பற்றாக்குறை எதிர்மறையையும் தெளிவாகக் காட்ட அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
