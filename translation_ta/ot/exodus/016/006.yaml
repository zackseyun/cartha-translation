  source_fidelity: மூல எபிரேயத்தின் தொடர்ச்சியைக் குறிக்கும் வாவ்-தொடர்வினை ‘பின்பு’ எனவும், மோசே–ஆரோன் இணை எழுவாய், கேட்போர் அனைவரும், மாலை நேரம், எதிர்கால அறிதல், யாவே என்ற தனிப்பெயர், எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவருதல் ஆகிய அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. எபிரேயத்தின் ஒருமை வினை, இணை எழுவாயுடன் தமிழில் பன்மையாக அமைவது இயல்பான இலக்கண மாற்றம்; பொருள் மாற்றமில்லை.
  naturalness: ‘பின்பு மோசேயும் ஆரோனும் … என்றார்கள்’ மற்றும் ‘அறிந்துகொள்வீர்கள்’ நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளன. ‘இஸ்ரவேலின் மக்கள் அனைவரிடமும்’ என்பது புரியத்தக்க இயல்பான கூட்டுக்குறிப்பு. மேற்கோள் அமைப்பும் நிறுத்தக்குறிகளும் சரியானவை.
  terminology: ‘யாவே’ மூலத்தின் தனிப்பெயர் יהוה-வை பட்டமாக மாற்றாமல் காக்கிறது. ‘எகிப்து நாடு’ אֶרֶץ-ஐ வெளிப்படுத்துகிறது. ‘மக்கள்’ என்பது இச்சூழலில் בְּנֵי יִשְׂרָאֵל என்ற நிலையான சமூகக் குறியீட்டுக்கு ஏற்ற நவீன தமிழ் வடிவம்; சொற்சொல் ‘மகன்கள்’ அடிக்குறிப்பில் சரியாகக் குறிக்கப்பட்டுள்ளது.
