source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽ/ידַעְתֶּ֕ם כִּ֧י יְהוָ֛ה הוֹצִ֥יא אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: ta
  text: பின்பு மோசேயும் ஆரோனும் இஸ்ரவேலின் மக்கள் அனைவரிடமும்[a], “மாலையில், யாவே உங்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தார் என்பதை அறிந்துகொள்வீர்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “இஸ்ரவேலின் மகன்கள் அனைவரிடமும்.” இது இங்கு இஸ்ரவேல் மக்களைக் குறிக்கிறது. “இஸ்ரவேலர் அனைவரிடமும்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்கள்
  rationale: வாவ்-தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. எபிரேயில் வினை ஒருமையாக இருந்தாலும் மோசே, ஆரோன் ஆகிய இணை எழுவாயுடன் தமிழில் இயல்பாகப் பன்மை வினை பயன்படுத்தப்படுகிறது.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: மோசேயும் ஆரோனும்
  rationale: தனிப்பெயர்களின் தமிழில் நிலைபெற்ற வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; இணை எழுவாயை இயல்பாகக் காட்ட ‘-உம் ... -உம்’ அமைப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள் அனைவரிடமும்[a]
  rationale: בְּנֵי என்பதன் சொற்பொருள் ‘மகன்கள்’; ஆனால் இங்கு அது இஸ்ரவேல் சமூகத்தாரைக் குறிக்கும் நிலையான கூட்டுப்பெயர். நவீன தமிழில் பாலினத்தால் தேவையின்றிக் கட்டுப்படுத்தாத ‘மக்கள்’ இயல்பாகவும் உள்ளடக்கமாகவும் பொருளைக் கொடுக்கிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֶרֶב
  choice: மாலையில்
  rationale: இந்தப் பெயர்ச்சொல் காலத்தைக் குறிக்கும் வினையடையாகச் செயல்படுகிறது. ‘மாலையில்’ என்பது இயல்பான நவீனத் தமிழ்; ‘இன்று மாலை’ என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: וִידַעְתֶּם
  choice: அறிந்துகொள்வீர்கள்
  rationale: சூழலில் வரவிருக்கும் அனுபவத்தின் மூலம் உறுதியாக அறிதல் குறிக்கப்படுகிறது. ‘அறிந்துகொள்வீர்கள்’ எதிர்காலத்தையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: כִּי இங்கு அவர்கள் அறியப்போகும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘என்பதை’ அந்த உறவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர். பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் வாசிக்கத்தக்க ‘யாவே’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: הוֹצִיא אֶתְכֶם
  choice: உங்களை ... வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே கொண்டுவருதல்’ எனப் பொருள்படும். இறைவனுக்குரிய மரியாதை ஒருமை வினை தமிழில் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: אֶרֶץ என்பதை விடாமல் ‘நாடு’ என்று வெளிப்படையாக மொழிபெயர்க்கிறது; பிரிவைக் குறிக்கும் מִן ‘-இலிருந்து’ எனத் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. ஒரு பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது; ‘யெகோவா’ என்பது பிற்கால கலப்பு உச்சரிப்பை பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேயச் சொற்றொடரின் வடிவம் பொருள் மங்காமல் இருக்கும் இடங்களில் காக்கப்பட்டுள்ளது; தமிழில் இயல்பற்ற பாலினக் கட்டுப்பாடு அடிக்குறிப்பின் மூலம் வெளிப்படுத்தப்பட்டுள்ளது.
