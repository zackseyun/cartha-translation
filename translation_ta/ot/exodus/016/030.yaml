  text: So the people rested on the seventh day[a].
translation:
  language: ta
  text: எனவே மக்கள் ஏழாம் நாளில் ஓய்ந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நிறுத்தினார்கள்.’ இந்த வினைச்சொல் ‘ஓய்வுநாள்’ என்பதுடன் தொடர்புடைய வேர்ச்சொல்லிலிருந்து வந்தது; எனவே ‘ஓய்வுநாளைக் கடைப்பிடித்தார்கள்’ என்பது விளக்க விரிவாக்கமாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: ஓய்ந்திருந்தார்கள்
  rationale: שׁבת என்பதன் கல் வினைவடிவம் அடிப்படையில் ‘செயலை நிறுத்துதல்/ஓய்தல்’ என்று பொருள்படும். இங்கு ஏழாம் நாளைப் பற்றிய சூழலில் ‘ஓய்ந்திருந்தார்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘ஓய்வுநாளைக் கடைப்பிடித்தார்கள்’ என்று மொழிபெயர்ப்பது மூலத்தில் உள்ளதைவிட விளக்கத்தைச் சேர்க்கும்.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עָם இங்கு இஸ்ரவேலரை ஒரு கூட்டமாகக் குறிக்கிறது; நவீன தமிழில் ‘மக்கள்’ இயல்பான இணைச்சொல்.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: குறிப்பிட்ட நாளைக் குறிக்கும் בּ முன்னொட்டுக்கு தமிழில் ‘-இல்’ இயல்பானது; வரிசை எண்ணான הַשְּׁבִיעִי ‘ஏழாம்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: וַ
  choice: எனவே
  rationale: வாவ் தொடர்கதை நகர்வைக் குறித்தாலும், முந்தைய கட்டளைக்கு மக்கள் அளித்த விளைவான பதிலை இங்கு ‘எனவே’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வினைச்சொல்லிலேயே ஓய்வுநாள் கடைப்பிடிப்பை வெளிப்படையாகச் சொல்வதா
  choice: ‘ஓய்ந்திருந்தார்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஓய்வுநாளைக் கடைப்பிடித்தார்கள்’ அல்லது ‘வேலையை நிறுத்தினார்கள்’
  rationale: எபிரெய வினை மக்கள் ஓய்ந்ததை அல்லது செயலை நிறுத்தியதைச் சொல்கிறது. ‘ஏழாம் நாள்’ என்பதும் சுற்றியுள்ள சூழலும் ஓய்வுநாள் தொடர்பைத் தெளிவாக்குகின்றன; ஆகவே வழிபாட்டு அல்லது கோட்பாட்டு விரிவாக்கத்தை வினைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஓய்ந்திருந்தார்கள்’ என்பது சூழ்நிலையின் தொடர்நிலையை இயல்பாகக் காட்டுகிறது; அடிக்குறிப்பு மூலவினையின் ‘நிறுத்துதல்’ என்ற பொருள் வாய்ப்பையும் பாதுகாக்கிறது.
