base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: ta
  text: மோசே கட்டளையிட்டபடியே அவர்கள் அதை காலைவரை வைத்திருந்தார்கள். அது நாற்றமெடுக்கவில்லை; அதில் ஒரு புழுகூட[a] இருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஈப்புழு.’ எபிரெயச் சொல் அழுகலில் தோன்றும் புழு வகைகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: அவர்கள் அதை ... வைத்திருந்தார்கள்
  rationale: இரவு முழுவதும் மன்னாவை அப்படியே வைத்திருப்பதைச் சூழல் குறிக்கிறது. நவீனத் தமிழில் ‘வைத்திருந்தார்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עַד הַבֹּקֶר
  choice: காலைவரை
  rationale: எபிரெயத் தொடரின் நேரடிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: மோசே கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר என்பதன் ஒப்புமைத் தன்மையையும் கட்டளைக்குக் கீழ்ப்படிந்த செயலையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: הִבְאִישׁ
  choice: நாற்றமெடுக்கவில்லை
  rationale: கெட்டுப்போய் நாற்றமெடுப்பதைக் குறிக்கும் வினையின் நேரடியான, பொதுவாகப் புரியும் தமிழாக்கம்.
- source_word: רִמָּה
  choice: புழு
  rationale: இச்சொல் புழு அல்லது ஈப்புழு போன்ற அழுகலுடன் தொடர்புடைய உயிரினத்தைக் குறிக்கலாம். மூலத்தின் பொதுவான பொருளைப் பாதுகாக்க ‘புழு’ முதன்மை உரையில் வைக்கப்படுகிறது.
- source_word: לֹא הָיְתָה בּוֹ
  choice: அதில் ஒரு புழுகூட இருக்கவில்லை
  rationale: மூலத்தில் உள்ள ஒருமை வடிவத்தையும் புழு எதுவுமே காணப்படவில்லை என்ற வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
