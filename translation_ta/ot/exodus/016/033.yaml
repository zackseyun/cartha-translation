source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְ/תֶן שָׁ֥מָּ/ה מְלֹֽא הָ/עֹ֖מֶר מָ֑ן וְ/הַנַּ֤ח אֹת/וֹ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: ta
  text: மோசே ஆரோனிடம், “ஒரு ஜாடியை எடுத்து, அதில் முழு ஓமர் அளவு மன்னாவைப் போட்டு, அதை யாவேவின் முன்பாக உங்கள் தலைமுறைகள்தோறும் பாதுகாத்து வைப்பதற்காக வை” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஜாடி” என்பதற்குப் பதிலாக “பாத்திரம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: ஜாடி
  rationale: உணவை வைத்திருக்கப் பயன்படும் பாத்திரத்தைக் குறிக்கிறது. ‘ஜாடி’ என்பது நவீன தமிழில் இயல்பானது; சமையல் பாத்திரம் என்ற தேவையற்ற பொருளையும் ஏற்படுத்தாது.
- source_word: מְלֹא הָעֹמֶר
  choice: ஓமர் அளவு நிறைய
  rationale: מְלֹא என்பதிலுள்ள முழு அளவு என்ற கருத்தையும், עֹמֶר என்ற பண்டைய உலர் அளவையின் பெயரையும் தக்கவைக்கிறது.
- source_word: מָן
  choice: மன்னா
  rationale: சூழலில் பெயரிடப்பட்ட உணவுப்பொருளுக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: וְתֶן שָׁמָּה
  choice: அதில் ... போட்டு
  rationale: சொல்லாட்சியில் ‘அங்கே வை’ என்றாலும், அதன் குறிப்பு முன்பு சொல்லப்பட்ட ஜாடிக்குள் என்பதால் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘அதில் ... போட்டு’ என வழங்கப்பட்டது.
- source_word: וְהַנַּח אֹתוֹ
  choice: அதை ... வை
  rationale: பொருளை ஓர் இடத்தில் வைத்து நிலைநிறுத்துவதைக் குறிக்கும் கட்டளையை இயல்பான தமிழில் தருகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: ‘முன்பாக/சந்நிதியில்’ என்ற மூலப் பொருளைச் சுருக்கமாகத் தக்கவைத்து, தெய்வீகப் பெயரைத் தலைப்பால் மாற்றாமல் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரின் தமிழுக்கேற்ற ஒலிபெயர்ப்பு.
- source_word: לְמִשְׁמֶרֶת
  choice: பாதுகாத்து வைப்பதற்காக
  rationale: காவல், பாதுகாப்பு, தொடர்ந்து பேணிவைத்தல் ஆகிய சூழல் சார்ந்த நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: உங்கள் தலைமுறைகள்தோறும்
  rationale: அடுத்தடுத்து வரும் தலைமுறைகள் முழுவதிலும் தொடரும் காலநீட்சியை வெளிப்படுத்துகிறது.
- source_word: קַח ... אַחַת
  choice: ஒரு ஜாடியை எடுத்து
  rationale: ஒரே ஒரு பாத்திரத்தை எடுக்கும்படியான கட்டளையை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயரைப் பதிலாக இடாமல் அதன் தமிழுக்கேற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: ‘யாவேக்கு முன்பாக’ என்பதன் இட/சந்நிதி சார்ந்த பொருள்
  choice: மூலத்தின் திறந்த சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: யாவேயின் சந்நிதியில்
  rationale: இந்த வசனம் துல்லியமான புனித இடத்தை இங்கே குறிப்பிடாததால், ‘முன்பாக’ என்ற சொல்லாட்சி அந்தத் தெளிவின்மையைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதான ஆனால் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டது. பண்டைய அளவையான ‘ஓமர்’ ஒலிபெயர்ப்பாகத் தக்கவைக்கப்பட்டது; மூலத்தில் இல்லாத விளக்கங்கள் உரைக்குள் சேர்க்கப்படவில்லை.
