revisions:
- from: மோசே ஆரோனிடம், “ஒரு ஜாடியை எடுத்து, அதில் ஓமர் அளவு நிறைய மன்னாவைப் போட்டு, உங்கள் தலைமுறைகள்தோறும் பாதுகாத்து வைப்பதற்காக அதை யாவேக்கு முன்பாக வை” என்றார்.[a]
  to: மோசே ஆரோனிடம், “ஒரு ஜாடியை எடுத்து, அதில் முழு ஓமர் அளவு மன்னாவைப் போட்டு, அதை யாவேவின் முன்பாக உங்கள் தலைமுறைகள்தோறும் பாதுகாத்து வைப்பதற்காக வை” என்றார்.[a]
  rationale: The revision clarifies that the manna quantity is a full omer, as expressed by מְלֹא הָעֹמֶר, and adjusts the ‘before Yahweh’ phrase to idiomatic modern standard Tamil. No doctrinal or location-specific interpretation has been introduced, and the footnote anchor is retained.
