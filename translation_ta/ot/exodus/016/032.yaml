base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: ta
  text: 'மோசே சொன்னார்: “யாவே கட்டளையிட்டது இதுதான்: உங்களுடைய தலைமுறைகளுக்காகப் பாதுகாத்து வைக்க, இதில் ஒரு ஓமர் நிறைய[a] எடுத்து வையுங்கள்; நான் உங்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தபோது, பாலைநிலத்தில் உங்களுக்கு உண்ணக் கொடுத்த அப்பத்தை அவர்கள் காணும்படியாக.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரு ஓமர் நிறைய” என்பது ஒரு முழு ஓமர் அளவைக் குறிக்கிறது. ஓமர் என்பது பண்டைய அளவுப்பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: மோசே சொன்னார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்டும் எளிய இறந்தகால வடிவம்.
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה יְהוָה
  choice: யெகோவா கட்டளையிட்டது இதுதான்
  rationale: דָּבָר இங்கு குறிப்பிட்ட கட்டளையைக் குறிக்கிறது; தமிழில் ‘கட்டளையிட்டது இதுதான்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது. יהוה தனிப்பட்ட இறைப்பெயராக ‘யெகோவா’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: இதில் ஓர் ஓமர் நிறைய
  rationale: மன்னாவைக் குறிக்கும் மִמֶּנּוּ என்பதையும், நிறைந்த ஓமர் அளவு என்ற מְלֹא הָעֹמֶר என்பதையும் அளவுப் பெயரை மாற்றாமல் வெளிப்படுத்துகிறது.
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும் பாதுகாத்து வைப்பதற்காக
  rationale: எதிர்காலத் தலைமுறைகளுக்காகக் காவலில் வைத்துப் பாதுகாப்பது என்ற கருத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְמַעַן יִרְאוּ
  choice: அவர்கள் காணும்படி
  rationale: நோக்கத்தைக் குறிக்கும் உட்பிரிவு; ‘அவர்கள்’ என்பது முன் குறிப்பிடப்பட்ட வருங்காலத் தலைமுறைகளைக் குறிக்கிறது.
- source_word: הַלֶּחֶם אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: உங்களுக்கு உண்ணக் கொடுத்த உணவை
  rationale: לֶחֶם என்பதற்கு ‘அப்பம்’ அல்லது விரிவாக ‘உணவு’ என்ற பொருள் உண்டு. இங்கு மன்னாவைக் குறிக்கும் சூழலில் ‘உணவு’ இயல்பாக உள்ளது; Hiphil வினையின் ‘உண்ணச் செய்தேன்/ஊட்டினேன்’ என்ற பொருளும் காக்கப்படுகிறது.
- source_word: בַּמִּדְבָּר
  choice: பாலைநிலத்தில்
  rationale: மக்கள் குடியிராத வறண்ட வெளி என்ற מִדְבָּר சொல்லின் பரப்பை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: நான் உங்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தபோது
  rationale: בְּ + infinitive construct தரும் காலச் சூழலை ‘போது’ என்று இயல்பாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: எபிரெய மூலத்தில் வரும் நான்கு எழுத்து இறைப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது. தமிழில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது; மூல உயிரொலிப்பு முற்றிலும் உறுதியானதல்ல.
- issue: הַלֶּחֶם என்பதன் பொருள்
  choice: உணவு
  alternative: அப்பம்
  rationale: சொல் நேரடியாக ‘அப்பம்’ என்றும் பொதுவாக ‘உணவு’ என்றும் வரலாம். இங்கு மன்னாவை எதிர்காலத் தலைமுறைகள் காணும்படி வைப்பதே கருத்தாதலால், அது சாதாரண சுட்ட அப்பம் எனத் தவறாகப் புரியாதபடி ‘உணவு’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பான, மதிப்புமிக்க உரைநடை. தொன்மையான ‘ஓமர்’ அளவு மாற்றப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
