source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: ta
  text: '“இஸ்ரவேல் மக்களின் முறுமுறுப்புகளை நான் கேட்டேன். அவர்களிடம் நீ சொல்: ‘மாலை மங்கும் நேரத்தில் நீங்கள் இறைச்சி உண்பீர்கள்; காலையில் அப்பம் உண்டு நிறைவடைவீர்கள். அப்போது நான் உங்கள் கடவுளாகிய யாவே என்பதை அறிந்துகொள்வீர்கள்.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: நான் கேட்டேன்
  rationale: எபிரெய நிறைவேற்ற வினை உடனடி நிகழ்காலப் பொருத்தத்தைக் கொண்ட கடந்த செயலைக் குறிக்கிறது; தமிழில் இயல்பான எளிய இறந்தகாலம் இதைத் தெளிவாகத் தருகிறது.
- source_word: תְּלוּנֹּת
  choice: முறுமுறுப்புகள்
  rationale: வனாந்தரச் சூழலில் திரும்பத் திரும்ப வெளிப்படும் அதிருப்தியான குறைகூறலைக் குறிக்கிறது; ‘புகார்கள்’ என்பதைக் காட்டிலும் மூலத்தின் தொனியைப் பேணுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெய மரபுத்தொடர் சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு சமூகத்தையும் குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் இயல்பாகவும் பொருள்துல்லியமாகவும் உள்ளது.
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: அவர்களிடம் நீ சொல்
  rationale: எபிரெய பேச்சு அறிமுகக் கட்டமைப்பை தமிழில் தேவையற்ற இரட்டிப்பின்றி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּין הָעַרְבַּיִם
  choice: மாலை மங்கும் நேரத்தில்
  rationale: சொற்படியாக ‘இரு மாலைகளுக்கு இடையில்’ எனும் கால மரபுத்தொடர்; அந்தி அல்லது மாலை மங்கும் காலப்பகுதியை இயல்பான தமிழில் தருகிறது.
- source_word: תֹּאכְלוּ בָשָׂר
  choice: நீங்கள் இறைச்சி உண்பீர்கள்
  rationale: உணவுச் சூழலில் בָשָׂר என்பதற்கு ‘இறைச்சி’ இயல்பானது; வினை இங்கு வரவிருக்கும் உறுதியான நிகழ்வைக் குறிக்கிறது.
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: அப்பம் உண்டு நிறைவடைவீர்கள்
  rationale: வயிறார உண்டு திருப்தியடைவதைச் சுட்டும் வினையின் பொருளையும் அப்பம் என்ற தெளிவான உருவகத்தையும் பேணுகிறது.
- source_word: וִידַעְתֶּם
  choice: அப்போது ... அறிந்துகொள்வீர்கள்
  rationale: முந்தைய அருள்செயல்களின் விளைவாக ஏற்படும் உணர்தலைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: வடிவத்தில் பன்மைத் தோற்றம் இருந்தாலும் இங்கு இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் உடன்படிக்கைச் சொற்றொடராக ஒருமையில் மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் சமூகக் குறிப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இந்தச் சூழலில் சொற்றொடர் இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது. சொற்படியான ஆண்பால் வடிவம் தமிழில் ஆண்களை மட்டும் குறிப்பதாகத் தவறாகப் புரியக்கூடும்; ஆகவே இயல்பான சமூகப் பெயர் தேர்ந்தெடுக்கப்பட்டது.
- issue: வசன முடிவின் அறிதல் வாக்கியம்
  choice: அப்போது நானே உங்கள் கடவுளாகிய யாவே என்பதை அறிந்துகொள்வீர்கள்
  alternative: நான் யாவே, உங்கள் கடவுள் என்பதை அறிந்துகொள்வீர்கள்
  rationale: அப்பமும் இறைச்சியும் வழங்கப்படுவதன் விளைவாக யாவேயின் அடையாளத்தையும் உறவையும் மக்கள் உணர்வார்கள் என்ற வலியுறுத்தலை ‘நானே’ இயல்பாகப் பேணுகிறது; கூடுதல் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுமக்கள் எளிதில் புரிந்துகொள்ளும், ஆனால் வழிபாட்டு வாசிப்புக்கும் ஏற்ற கண்ணியமான நடை. மூலத்தின் மீளும் குறைகூறல் தொனி ‘முறுமுறுப்புகள்’ என்றும், மாலை மரபுத்தொடரின் காலப் பொருள் ‘மாலை மங்கும் நேரத்தில்’ என்றும் இயல்பாக்கப்பட்டுள்ளது.
