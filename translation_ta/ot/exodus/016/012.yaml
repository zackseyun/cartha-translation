  terminology: ‘முறுமுறுப்புகள்,’ ‘இறைச்சி,’ ‘அப்பம்,’ and ‘யாவே’ are appropriate. ‘இஸ்ரவேல் மக்கள்’ naturally denotes the whole covenant community in Tamil. Removing ‘நானே’ also makes the covenant identification more direct.
