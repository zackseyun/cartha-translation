base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/019.yaml
  text: And Moses said to them[a], “Let no one leave any of it until morning.”
translation:
  language: ta
  text: மோசே அவர்களிடம், “ஒருவரும்[a] அதில் எதையும் காலை வரை மீதியாக வைக்க வேண்டாம்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மனிதன்’ (אִישׁ) என்ற சொல் இங்கு ஒவ்வொருவரையும் குறிக்கும் பகிர்வுப் பொருளில் பயன்படுத்தப்பட்டுள்ளது; இந்தத் தடை அனைவருக்கும் பொருந்தும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: தொடர்ச்சியான எபிரெயக் கதைநடையில் நிகழ்வை முன்னெடுக்கும் வாவ்-தொடர்ச்சியைத் தமிழில் தனியாக ‘மேலும்’ என்று மொழிபெயர்க்காமல், இயல்பான உரையாடல் அமைப்பால் வெளிப்படுத்துகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகம மரபில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: אֲלֵהֶם
  choice: அவர்களிடம்
  rationale: மூலத்தின் ‘அவர்களிடம்’ என்ற நேரடியான குறிப்பைத் தக்கவைக்கிறது; ‘மக்களிடம்’ என்று விளக்கமாக விரிவாக்கவில்லை.
- source_word: אִישׁ
  choice: ஒருவரும்
  rationale: இங்கு אִישׁ பகிர்நிலைப் பொருளில் ஒவ்வொரு தனிநபரையும் குறிக்கிறது. எதிர்மறைத் தடையுடன் ‘ஒருவரும்’ என்பது இயல்பாகவும் அனைவருக்கும் பொருந்தும் விதமாகவும் உள்ளது.
- source_word: אַל
  choice: வேண்டாம்
  rationale: אַל குறிக்கும் தடையை நவீனத் தமிழின் இயல்பான எதிர்மறை ஏவல் வடிவில் தருகிறது.
- source_word: יוֹתֵר
  choice: மீதியாக வைக்க
  rationale: மன்னாவிலிருந்து ஒரு பகுதியை மறுநாளுக்காக எஞ்சவிடுதல் அல்லது வைத்திருத்தல் என்பதே இச்சூழலின் பொருள்.
- source_word: מִמֶּנּוּ
  choice: அதில் எதையும்
  rationale: ஆண்பால் ஒருமை/கூட்டுப்பொருள் பின்னொட்டு முன்பு கூறப்பட்ட மன்னாவைக் குறிக்கிறது; தடையின் பரப்பைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘அதில் எதையும்’ என வழங்கப்பட்டுள்ளது.
- source_word: עַד בֹּקֶר
  choice: காலைவரை
  rationale: குறிப்பிட்ட கால எல்லையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
