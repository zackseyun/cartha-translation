translation:
  language: ta
  text: மாலையில் காடைகள் வந்து முகாம் முழுவதையும் மூடிக்கொண்டன; காலையில் முகாமைச் சுற்றிலும் பனித்துளிப் படலம் படிந்திருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: மாலையில்
  rationale: எபிரெயக் கதைநடையில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இத்தொடரை, தேவையற்ற சொற்சொல் வடிவைத் தவிர்த்து இயல்பான தமிழில் காலக் குறிப்பாக வழங்குகிறது.
- source_word: וַתַּעַל הַשְּׂלָו
  choice: காடைகள் வந்து
  rationale: שְׂלָו என்பது காடையைக் குறிக்கிறது; எபிரெயில் ஒருமை வடிவம் கூட்டுப்பொருளில் வருவதால் தமிழில் இயல்பாகப் பன்மை பயன்படுத்தப்பட்டுள்ளது. עלה இச்சூழலில் அவை முகாமை வந்தடைந்ததைக் குறிக்கிறது.
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: முகாம் முழுவதையும் மூடிக்கொண்டன
  rationale: כסה என்பதன் ‘மூடு’ என்ற தெளிவான படிமத்தைப் பாதுகாத்து, காடைகள் முகாம் முழுவதும் பரவியிருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּבַבֹּקֶר
  choice: காலையில்
  rationale: அடுத்த காலக் கட்டத்தை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: பனித்துளிப் படலம் படிந்திருந்தது
  rationale: שִׁכְבַת என்பது ஒரு படலம் அல்லது பரவிய அடுக்கைக் குறிக்கிறது. ‘பனித்துளிப் படலம்’ மூலத்தின் concrete sense-ஐத் தக்கவைக்கிறது; ‘படிந்திருந்தது’ தமிழில் அதன் நிலையை இயல்பாகச் சொல்கிறது.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: முகாமைச் சுற்றிலும்
  rationale: முகாமைச் சூழ்ந்திருந்த இடநிலையைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
