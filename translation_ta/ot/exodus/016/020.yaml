  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: ta
  text: ஆனால் அவர்கள் மோசே சொன்னதைக் கேட்கவில்லை[a]. சில ஆண்கள் அதில் கொஞ்சத்தைக் காலை வரை மீதம் வைத்தார்கள்; அதில் புழுக்கள் தோன்றி, அது நாற்றமெடுத்தது[b]. மோசே அவர்கள்மேல் கோபமடைந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மோசேக்குச் செவிகொடுக்கவில்லை.’ எபிரெயச் சொற்றொடர், கீழ்ப்படிய மறுக்கும் விதத்தில் ஒருவர் சொல்வதைக் கேளாமலிருப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘அதில் புழுக்கள் எழுந்தன.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: மோசேயின் பேச்சைக் கேட்கவில்லை
  rationale: שׁמע אֶל என்பது ஒருவருக்குச் செவிகொடுத்தல் அல்லது அவர் சொன்னதைக் கேட்டுப் பின்பற்றுதல் என்ற பொருளைக் கொண்டது. சூழலில் கீழ்ப்படியாமை உட்பொருளாக இருந்தாலும், அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல் எபிரெயச் சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: וַיּוֹתִרוּ
  choice: மீதியாக வைத்தார்கள்
  rationale: Hiphil வடிவிலுள்ள יתר, எஞ்சவைத்தல் அல்லது மீதியாக விடுதல் என்பதைக் குறிக்கிறது. இங்கு மன்னாவில் ஒரு பகுதியை மறுநாள்வரை வைத்திருந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲנָשִׁים
  choice: சில ஆண்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையாக உள்ளது; சூழலில் குறிப்பிடப்படாத ஒரு பகுதியினரைக் குறிப்பதால் ‘சில ஆண்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִמֶּנּוּ
  choice: அதில் கொஞ்சத்தை
  rationale: இது முந்தைய வசனங்களில் கூறப்பட்ட மன்னாவைக் குறிக்கிறது. ‘அதில் கொஞ்சத்தை’ என்பது பகுதியளவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַד בֹּקֶר
  choice: காலைவரை
  rationale: நேர எல்லையைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: அதில் புழுக்கள் தோன்றி
  rationale: சொல்லுக்கு நெருக்கமாக ‘புழுக்கள் எழுந்தன’ என்ற அமைப்பு இருந்தாலும், இச்சூழலில் அவை உருவாகித் தோன்றின என்ற பொருளை இயல்பான தமிழில் தருகிறது; நேரடியான உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּבְאַשׁ
  choice: அது நாற்றமெடுத்தது
  rationale: துர்நாற்றம் வீசத் தொடங்கியது அல்லது கெட்ட நாற்றமடைந்தது என்ற வினைப் பொருளைத் தெளிவாகவும் உயிரோட்டமாகவும் தெரிவிக்கிறது.
- source_word: וַיִּקְצֹף עֲלֵהֶם
  choice: மோசே அவர்கள்மேல் கோபமடைந்தார்
  rationale: קצף கோபங்கொள்ளுதலைக் குறிக்கிறது; עַל உடனான அமைப்பு தமிழில் ‘அவர்கள்மேல் கோபமடைந்தார்’ என்று இயல்பாக அமைகிறது, தீவிரத்தை மிகைப்படுத்துவதில்லை.
