  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்களின் முழுச் சபையும் வனாந்தரத்தில் மோசேக்கும் ஆரோனுக்கும் எதிராக முறுமுறுத்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலர்கள்’; பாரம்பரியமாக, ‘இஸ்ரவேலின் பிள்ளைகள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: முறுமுறுத்தது
  rationale: இந்த வினைச்சொல் தலைவர்களுக்கு எதிராகக் கூட்டு அதிருப்தியுடன் குறைகூறுவதைக் குறிக்கிறது. ‘முறுமுறுத்தது’ என்பது அதன் எதிர்மறையான, தொடர்ச்சியான புகார் உணர்வை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כָּל עֲדַת
  choice: சபை முழுவதும்
  rationale: כָּל என்பது கூட்டத்தின் முழுமையை வலியுறுத்துகிறது; עֵדָה என்பது இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபை முழுவதும்’ இரண்டையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மூலத்தின் ஆண்பால் பன்மை வடிவத்தைத் தக்கவைக்கும் முறையான மொழிபெயர்ப்பு. தமிழில் உரிமைத் தொடர்புடன் ‘இஸ்ரவேலின் மகன்களுடைய சபை’ என்று அமைக்கப்பட்டுள்ளது.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: மோசேக்கும் ஆரோனுக்கும் எதிராக
  rationale: புகார் சூழலில் עַל என்பது புகாரின் இலக்கான நபர்களுக்கு எதிரான நிலைப்பாட்டைக் குறிக்கிறது. இணைச்சொல் தமிழில் இருவருடனும் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் குடியிருப்பற்ற வறண்ட வனப்பகுதியையும் குறிக்கலாம். ‘வனாந்தரம்’ யாத்திராகமச் சூழலில் துல்லியமும் வேதாகம நடையின் கண்ணியமும் கொண்டது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுப்பெயரை மொழிபெயர்த்தல்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தில் உள்ள ஆண்பால் ‘மகன்கள்’ வடிவம் பிரதான உரையில் தக்கவைக்கப்படுகிறது; அது உடன்படிக்கை மக்களை ஒரு சமூகமாகக் குறித்தாலும், அதன் இலக்கண வடிவத்தைப் பாலினநடுநிலையாக்கவில்லை. இயல்பான இனப்பெயரும் பாரம்பரிய வடிவமும் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘முறுமுறுத்தது’ பொதுவாகப் புரியும் சொல்; ‘சபை’ கூட்டுச் சமூகத்தையும் ‘வனாந்தரம்’ குடியிருப்பற்ற வறண்ட நிலப்பகுதியையும் குறிக்கின்றன. மூலத்தின் சொல் வரிசையை அப்படியே பின்பற்றாமல், தமிழ் இயல்புக்கேற்ப இடக்குறிப்பு முன்னிலைப்படுத்தப்பட்டுள்ளது.
