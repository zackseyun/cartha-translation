translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘இஸ்ரவேல் குடும்பத்தார்’ என்ற சொற்றொடர் எபிரெயக் கூட்டுப்பெயரைத் தக்கவைக்கிறது. அரிய உணவுச்சொல்லான צַפִּיחִת-ஐ மிகத் துல்லியமாக நிர்ணயிக்காமல், மூலத்தின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
