  yaml_path: translation/ot/exodus/016/031.yaml
  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: ta
  text: இஸ்ரவேலர் அதற்கு மன்னா[a] என்று பெயரிட்டனர். அது வெண்ணிறக் கொத்தமல்லி விதையைப் போல இருந்தது[b]; அதன் சுவை தேன் கலந்த மெல்லிய அப்பத்தைப் போல இருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘மன்’; தமிழில் மரபாக ‘மன்னா’ என்று வழங்கப்படுகிறது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வெண்ணிறமான கொத்தமல்லி விதையைப் போல.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தேன் கலந்த மெல்லிய கேக்கைப் போல.” இங்குள்ள எபிரெய உணவுப்பொருளின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ בֵית יִשְׂרָאֵל
  choice: இஸ்ரவேல் குடும்பத்தார் ... பெயரிட்டார்கள்
  rationale: בֵית יִשְׂרָאֵל என்பதன் ‘இஸ்ரவேல் வீடு/குடும்பம்’ என்ற கூட்டுப்பொருளை இயல்பான நவீனத் தமிழில் ‘இஸ்ரவேல் குடும்பத்தார்’ எனக் காக்கிறது; קרא இங்கு பெயரிடுதலைக் குறிக்கிறது.
- source_word: אֶת שְׁמוֹ מָן
  choice: அதற்கு மன்னா என்று பெயரிட்டார்கள்
  rationale: ‘அதன் பெயரை மன் என்று அழைத்தார்கள்’ என்ற எபிரெய அமைப்பை இயல்பான தமிழில் தருகிறது. ‘மன்னா’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் அறியப்பட்ட மரபுவழிப் பெயர்.
- source_word: כְּזֶרַע גַּד לָבָן
  choice: வெண்ணிறக் கொத்தமல்லி விதையைப் போல
  rationale: זֶרַע ‘விதை’, גַּד பொதுவாக ‘கொத்தமல்லி’, לָבָן ‘வெள்ளை/வெண்ணிறம்’. பெயரடை எதனுடன் தொடர்புடையது என்ற சிறிய அமைப்பியல் தெளிவின்மையை அடிக்குறிப்பில் சுட்டுகிறது.
- source_word: וְטַעְמוֹ
  choice: அதன் சுவை
  rationale: טַעַם உணவின் சுவை அல்லது ருசியைக் குறிக்கிறது; ‘சுவை’ பொதுவான, இயல்பான தமிழ்.
- source_word: כְּצַפִּיחִת בִּדְבָשׁ
  choice: தேன் கலந்த மெல்லிய அடையைப் போல
  rationale: צַפִּיחִת என்பது மெல்லிய சுட்ட உணவையோ அடையையோ குறிக்கும் அரிய சொல்; בִּדְבָשׁ தேனோடு தொடர்புடைய கலவை/செய்முறையைச் சுட்டுகிறது. ‘மெல்லிய அடை’ தமிழில் உணவுப் பொருள் ஒப்புமையை இயல்பாக வெளிப்படுத்துகிறது.
