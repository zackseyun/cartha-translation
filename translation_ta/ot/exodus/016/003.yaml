  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள்[a] அவர்களிடம், “எகிப்து நாட்டில் நாங்கள் இறைச்சிப் பானைகளின் அருகே அமர்ந்து, வயிறார அப்பம் உண்டபோது, யாவேயின் கையால்[b] இறந்திருந்தால் எவ்வளவோ நன்றாயிருந்திருக்கும்! ஏனெனில், இந்தக் கூட்டம் முழுவதையும் பட்டினியால் கொல்வதற்காக நீங்கள் எங்களை இந்தப் பாலைநிலத்திற்குக் கொண்டுவந்திருக்கிறீர்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லாட்சிப்படி, ‘இஸ்ரவேலின் மகன்கள்’; இங்கு முழு இஸ்ரவேல் மக்களையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவே’ என்பது எபிரெய יהוה (YHWH) என்ற இறைப்பெயரின் ஒலிபெயர்ப்பு; மரபுவழியாக ‘கர்த்தர்’ என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் சொல்லாட்சிப்படியான பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், அது இங்கு இஸ்ரவேல் சமூகத்தாரைக் குறிக்கும் மரபுவழிப் பொதுப்பெயர். நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கத் துல்லியத்துடனும் ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்க்கப்பட்டது; நேரடிச் சொல்லாட்சி அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: இறந்துபோயிருந்தால் எவ்வளவோ நன்றாயிருந்திருக்கும்
  rationale: מִי יִתֵּן என்பது சொற்படி கேள்வியல்ல; நிறைவேறாத தீவிர விருப்பத்தை வெளிப்படுத்தும் எபிரெய மரபுத்தொடர். கடந்தகால எதிர்நிலை ஏக்கத்தை இயல்பான தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: בְיַד יְהוָה
  choice: யாவேயின் கையால்
  rationale: ‘கையால்’ என்ற மூல உருவகத்தைத் தக்கவைத்து, செயல் யாவேயால் நிகழ்ந்திருக்கும் என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: நாங்கள் இறைச்சிப் பானைகளின் அருகே அமர்ந்து
  rationale: இறைச்சி சமைக்கப்பட்ட பானைகளைக் குறிக்கும் தெளிவான, காட்சியமைப்பைத் தக்கவைக்கும் நவீனத் தமிழ். எபிரெய ஒருமை இங்கு வகை/கூட்டுப் பொருளில் வருவதால் தமிழில் பன்மை இயல்பானது.
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: வயிறார அப்பம் உண்டபோது
  rationale: לָשֹׂבַע என்பதன் நிறைவாக உண்ணுதல் அல்லது திருப்தியடையும் வரை உண்ணுதல் என்ற பொருளை ‘வயிறார’ சுருக்கமாகவும் இயல்பாகவும் தருகிறது; לֶחֶם என்பதற்கு ‘அப்பம்’ தக்கவைக்கப்படுகிறது.
- source_word: הַמִּדְבָּר הַזֶּה
  choice: இந்தப் பாலைநிலம்
  rationale: מִדְבָּר என்பது குடியிருப்பும் உணவு வளமும் குறைந்த வனாந்தரப் பகுதியைக் குறிக்கிறது. ‘பாலைநிலம்’ நவீனத் தமிழில் இயல்பான புவியியல் சொல்லாகும்; மணற்பாலைவனம் என்ற அளவுக்கு பொருளைக் குறுக்காது.
- source_word: לְהָמִית
  choice: கொல்வதற்காக
  rationale: காரணவினை வடிவின் நோக்கம்/விளைவு சார்ந்த நேரடியான குற்றச்சாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: இந்தக் கூட்டம் முழுவதையும்
  rationale: קָהָל என்பதன் கூடியுள்ள மக்கள் சமூகம் என்ற பொதுப் பொருளைத் தருகிறது; பிற்கால மதநிறுவனச் சொல்லுணர்வைத் தேவையின்றி இறக்குமதி செய்யாது.
- source_word: בָּרָעָב
  choice: பட்டினியால்
  rationale: உணவின்மையால் ஏற்படும் உயிரிழப்பைக் குறிக்கும் சூழலில் ‘பட்டினி’ என்பது ‘பசி’யைவிட வலுவானதும் துல்லியமானதும் ஆகும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயரால் மாற்றாமல், தனிப்பட்ட உடன்படிக்கைப் பெயரைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சமூகப் பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு ஆண்பால் பன்மை வடிவம் முழு இஸ்ரவேல் சமூகத்தையும் பிரதிநிதித்துவமாகக் குறிக்கிறது. தமிழில் ‘மக்கள்’ அந்தச் சமூகப் பொருளை இயல்பாகத் தருகிறது; மூலத்தின் குடும்பவழிச் சொல்லாட்சி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘யாவேயின் கையால்’ என்பதில் இறைச் செயற்பாடு
  choice: மூல உருவகத்தைத் தக்கவைத்தல்
  alternative: யாவேயால்
  rationale: பேசுவோரின் குற்றம்சாட்டும் விருப்பத்தில் உள்ள இறையியல் பதற்றத்தை மென்மைப்படுத்தாமல், ‘கை’ என்ற மூல உருவகத்தோடு அப்படியே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. மக்களின் மிகைப்படுத்தப்பட்ட நினைவும் மோசே, ஆரோன் மீது அவர்கள் சுமத்தும் கடுமையான குற்றச்சாட்டும் திருத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளன. ‘வயிறார’, ‘பட்டினி’ போன்ற இயல்பான சொற்கள் பேச்சின் உணர்ச்சி வலிமையைத் தருகின்றன; அதேவேளை ‘யாவேயின் கையால்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டுள்ளது.
