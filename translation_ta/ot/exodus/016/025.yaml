  yaml_path: translation/ot/exodus/016/025.yaml
  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: ta
  text: மோசே, “இதை இன்றே சாப்பிடுங்கள்; ஏனெனில் இன்று ஆண்டவருக்குரிய ஓய்வுநாள். இன்று இதை வயல்வெளியில் காணமாட்டீர்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: இதை சாப்பிடுங்கள்
  rationale: பன்மை கட்டளையையும், முன்பு குறிப்பிடப்பட்ட மன்னாவைக் குறிக்கும் ஆண்பால் ஒருமை பின்னொட்டையும் இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: שַׁבָּת
  choice: ஓய்வுநாள்
  rationale: எபிரெயச் சொல்லின் ஓய்வு சார்ந்த பொருளை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: לַיהוָה
  choice: ஆண்டவருக்குரிய
  rationale: לְ முன்னொட்டின் அர்ப்பணிப்பு/உறவு பொருளைப் பாதுகாத்து, திருப்பெயருக்கான மரியாதைமிக்க வழக்கமான தமிழ் வடிவத்தைப் பயன்படுத்துகிறது.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: மன்னாவைச் சேகரிக்க மக்கள் வெளியே செல்லும் திறந்த நிலப்பரப்பை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: தெய்வீக திருப்பெயர் יהוה-ஐ மொழிபெயர்த்தல்
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதை உணர்ந்தபடியே, பொதுவான தமிழ் வேதாகம வாசிப்பில் மரியாதையுடனும் இயல்பாகவும் புரியும் வடிவம் தேர்ந்தெடுக்கப்பட்டது; குறிப்பிட்ட சமயப்பிரிவு சார்ந்த தனித்துவம் சேர்க்கப்படவில்லை.
- issue: לַיהוָה என்பதன் உறவு
  choice: ஆண்டவருக்குரிய ஓய்வுநாள்
  alternative: ஆண்டவருக்கு ஓய்வுநாள்
  rationale: இந்நாள் ஆண்டவருக்கென ஒதுக்கப்பட்ட நாள் என்ற உறவைத் தமிழில் தெளிவாகக் காட்டுகிறது; ஆண்டவர் ஓய்வெடுக்கிறார் என்ற தவறான வாசிப்பைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான நேரடி உரை. மூலத்தின் ‘இன்று’ என்ற மும்முறை வலியுறுத்தல் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது.
