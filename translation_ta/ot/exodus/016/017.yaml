  rationale: எபிரெய மொழியின் குடும்பவழி அடையாளத்தை ஓரளவு தக்கவைத்தபடியே, இங்கு முழுச் சமூகத்தையும் குறிக்கும் பொருளை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது; ‘இஸ்ரயேலின் மகன்கள்’ என்பது இச்சூழலில் ஆண்களை மட்டும் குறிப்பதுபோல் தவறாகப் புரியக்கூடும்.
- source_word: וַיִּלְקְטוּ
  choice: சேகரித்தார்கள்
  rationale: உணவுப் பொருளை எடுத்துச் சேர்த்தல் என்ற לקט வினையின் சூழற்பொருளை தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַמַּרְבֶּה וְהַמַּמְעִיט
  choice: சிலர் அதிகமாகவும் சிலர் குறைவாகவும் சேகரித்தார்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இரு எபிரெயப் பங்கேற்பு வடிவங்களின் பகிர்வுசார் எதிர்மறையை இயல்பான தமிழில் காட்டுகிறது; மூலத்தின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
