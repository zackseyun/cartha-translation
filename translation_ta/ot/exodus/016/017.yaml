  rationale: முந்தைய வசனத்தில் கொடுக்கப்பட்ட கட்டளையின்படி அவர்கள் நடந்துகொண்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
