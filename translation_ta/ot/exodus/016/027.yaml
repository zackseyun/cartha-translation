  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: ta
  text: 'ஏழாம் நாளில் இவ்வாறு நடந்தது: மக்களில் சிலர்[a] சேகரிப்பதற்காக வெளியே சென்றார்கள்; ஆனால் அவர்களுக்கு எதுவும் கிடைக்கவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மக்களிலிருந்து”; அதாவது, மக்களில் ஒரு பகுதியினர் மட்டுமே வெளியே சென்றார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இவ்வாறு நடந்தது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைநடை வடிவத்தை, இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: மூலத்தில் உள்ள காலக் குறிப்பை, ‘வாரத்தின்’ போன்ற விளக்கச் சொற்களைச் சேர்க்காமல் நேரடியாகத் தருகிறது.
- source_word: יָצְאוּ
  choice: வெளியே சென்றார்கள்
  rationale: முகாமிலிருந்தோ தங்கியிருந்த இடத்திலிருந்தோ புறப்பட்டுச் சென்றதைக் குறிக்கும் இயல்பான தமிழ் சொல்லாட்சி.
- source_word: מִן הָעָם
  choice: மக்களில் சிலர்
  rationale: மִן என்ற முன்னிடைச்சொல்லின் பகுதிப்பொருளைத் தெளிவாக வெளிப்படுத்தி, மக்கள் அனைவரும் அல்லாமல் அவர்களில் ஒரு பகுதியினர் சென்றார்கள் என்பதைக் காட்டுகிறது.
- source_word: לִלְקֹט
  choice: சேகரிப்பதற்காக
  rationale: לקט என்பதன் ‘சேகரித்தல்’ என்ற பொருளைத் தருகிறது; முந்தைய சூழலில் பொருள் மன்னா என்பது தெளிவாக இருப்பதால் அதை இங்கு சேர்க்கவில்லை.
- source_word: וְלֹא מָצָאוּ
  choice: ஆனால் அவர்களுக்கு எதுவும் கிடைக்கவில்லை
  rationale: ‘அவர்கள் காணவில்லை’ என்ற சொற்பொருளை, தேடிச் சென்ற நோக்கம் நிறைவேறாத எதிர்மறைத் திருப்பத்துடன் இயல்பான தமிழில் தெரிவிக்கிறது.
