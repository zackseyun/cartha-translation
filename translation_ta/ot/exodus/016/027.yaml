  naturalness: நவீன பொதுத்தமிழில் நடை தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘ஏழாம் நாளில் இவ்வாறு நடந்தது:’ என்பது கதைநடைக்கு ஏற்ற அறிமுகமாகும்; அதனைத் தொடர்ந்து வரும் வாக்கியமும் இயல்பாக உள்ளது.
