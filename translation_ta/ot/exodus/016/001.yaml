translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் ஏலிம், சீன், சீனாய் என்று ஒலிபெயர்க்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியத்தின் பயண வரிசையும் காலக் குறிப்பும் காக்கப்பட்டுள்ளன.
