revisions:
- from: அவர்கள் ஏலிமிலிருந்து புறப்பட்டார்கள். இஸ்ரவேல் மக்கள்[a] அனைவரின் சபையும், ஏலிமுக்கும் சீனாய்க்கும் இடையில் உள்ள சீன்[b] வனாந்தரத்திற்கு, அவர்கள் எகிப்து நாட்டிலிருந்து புறப்பட்ட பின்பு இரண்டாம் மாதத்தின் பதினைந்தாம் நாளில் வந்து சேர்ந்தது.
  to: அவர்கள் ஏலிமிலிருந்து புறப்பட்டார்கள்; இஸ்ரவேல் மக்களின் முழுச் சபையும், ஏலிமுக்கும் சீனாய்க்கும் இடையில் உள்ள சீன்[b] வனாந்தரத்திற்கு, அவர்கள் எகிப்து நாட்டிலிருந்து புறப்பட்ட பிறகு இரண்டாம் மாதத்தின் பதினைந்தாம் நாளில் வந்து சேர்ந்தது.
  rationale: The collective expression has been revised for idiomatic Tamil and closer correspondence to “the whole congregation of the sons of Israel.” The footnote marker a is retained on “இஸ்ரவேல் மக்கள்,” where the underlying Hebrew national designation is represented; the marker b remains on the place name. No theological or interpretive change has been made.
