base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: ta
  text: அவர்கள் ஏலிமிலிருந்து புறப்பட்டார்கள்; இஸ்ரவேல் மக்களின் முழுச் சபையும், ஏலிமுக்கும் சீனாய்க்கும் இடையில் உள்ள சீன்[b] வனாந்தரத்திற்கு, அவர்கள் எகிப்து நாட்டிலிருந்து புறப்பட்ட பிறகு இரண்டாம் மாதத்தின் பதினைந்தாம் நாளில் வந்து சேர்ந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: இங்குள்ள ‘சீன்’ என்பது ‘சீன் வனாந்தரம்’ என்ற இடப்பெயர்; இது பாவத்தைக் குறிக்கும் சொல் அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டார்கள்
  rationale: வனாந்தரப் பயணச் சூழலில் נסע என்பது முகாமைக் கலைத்துப் பயணத்தைத் தொடர்வதைக் குறிக்கிறது. ‘புறப்பட்டார்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מֵאֵילִם
  choice: ஏலிமிலிருந்து
  rationale: אֵילִם ஓர் இடப்பெயர்; அது தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיָּבֹאוּ
  choice: வந்து சேர்ந்தது
  rationale: בוא என்பது வருதல் அல்லது சென்றடைதலைக் குறிக்கும் பொதுவான இயக்க வினை. இங்கு பயணத்தின் இலக்கை அடைந்ததை இயல்பாகத் தெரிவிக்க ‘வந்து சேர்ந்தது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவரின் சபையும்
  rationale: כָּל עֲדַת என்பதிலுள்ள முழுமையையும் சபை என்ற கூட்டு அமைப்பையும் வெளிப்படுத்துகிறது. בְּנֵי יִשְׂרָאֵל என்பதன் சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டு, தேசியக் குழுவைக் குறிக்கும் பொருள் முதன்மை உரையில் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: אֶל מִדְבַּר סִין
  choice: சீன் வனாந்தரத்திற்கு
  rationale: מִדְבָּר என்பது குடியிருப்புகள் குறைந்த வறண்ட வனாந்தரப் பகுதியைக் குறிக்கிறது. סִין இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: ஏலிமுக்கும் சீனாய்க்கும் இடையில் உள்ள
  rationale: வனாந்தரத்தின் இருப்பிடத்தைத் தெரிவிக்கும் எபிரெய உறவுநிலைத் தொடரை நேராகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதத்தின் பதினைந்தாம் நாளில்
  rationale: எபிரெய நாட்காட்டித் தொடரின் பொருளைத் தெளிவான தமிழ் தேதி நடையில் வழங்குகிறது.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: அவர்கள் எகிப்து நாட்டிலிருந்து புறப்பட்ட பின்பு
  rationale: לְ உடன் வரும் infinitive construct, காலக்கணக்கின் தொடக்க நிகழ்வாக எகிப்திலிருந்து புறப்பட்டதைச் சுட்டுகிறது. ‘பின்பு’ அந்தக் காலத் தொடர்பைத் தெளிவாக்குகிறது.
