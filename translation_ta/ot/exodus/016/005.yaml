  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: ta
  text: ஆறாம் நாளில், அவர்கள் கொண்டுவருவதை ஆயத்தப்படுத்தும்போது, அது அவர்கள் நாள்தோறும் சேகரிப்பதைவிட இரண்டு மடங்காக இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது அவர்கள் ஒவ்வொரு நாளும் சேகரிப்பதைவிட இரட்டைப் பங்காக இருக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: இருக்கும்
  rationale: அறிவுறுத்தல் சூழலில் வரும் எதிர்கால நிலை அல்லது விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெய வாக்கியத் தொடக்கத்தைச் சொற்சொல்லாகப் பின்பற்றவில்லை.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: ஆறாம் நாளில்
  rationale: எபிரெயத்தில் உள்ள நேரக் குறிப்பை நேரடியாகத் தருகிறது; வெளிப்படையாக இல்லாத ‘வாரத்தின்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: וְהֵכִינוּ
  choice: ஆயத்தப்படுத்தும்போது
  rationale: ஆறாம் நாளில் அவர்கள் செய்யும் செயலை நேரச் சூழலாகக் காட்டுகிறது; ‘ஆயத்தப்படுத்து’ என்பது பொருளைத் தயாராக வைப்பதைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ்.
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: அவர்கள் கொண்டுவருவதை
  rationale: சேகரிக்கப்பட்ட பொருளை அவர்கள் உள்ளே கொண்டுவருவதைக் குறிக்கும் சார்புத் தொடரைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וְהָיָה מִשְׁנֶה
  choice: அது ... இரண்டு மடங்காக இருக்கும்
  rationale: מִשְׁנֶה குறிக்கும் இருமடங்கு அளவைத் தெளிவாகத் தருகிறது; ‘பங்கு’ என்ற விளக்கச் சொல்லை முதன்மை உரையில் தேவையின்றிச் சேர்க்கவில்லை.
- source_word: עַל אֲשֶׁר
  choice: சேகரிப்பதைவிட
  rationale: இங்கு עַל அளவு அல்லது ஒப்பீட்டு உறவைச் சுட்டுகிறது. தமிழின் ‘-விட’ அமைப்பு இருமடங்கு ஒப்பீட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִלְקְטוּ
  choice: சேகரிப்பதை
  rationale: மன்னாவைப் பொறுக்கிச் சேர்க்கும் செயலைச் சூழலுக்கு ஏற்ற பொதுவான தமிழில் தருகிறது.
- source_word: יוֹם יוֹם
  choice: நாள்தோறும்
  rationale: எபிரெயச் சொல் இரட்டிப்பு தரும் பகிர்வு மற்றும் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் பாதுகாக்கிறது.
