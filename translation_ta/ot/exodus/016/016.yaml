  source_fidelity: மூலத்தின் மன்னாவிலிருந்து சேகரித்தல், உணவு அளவுக்கேற்ப பகிர்வு, ஒருவருக்கு ஓர் ஓமர், கூடாரத்தில் உள்ளவர்களுக்காக எடுத்துக்கொள்ளல் ஆகிய கூறுகள் வரைவு மொழிபெயர்ப்பில் உள்ளன. ஆனால் זֶה הַדָּבָר אֲשֶׁר צִוָּה என்ற கட்டளை-அறிவிப்பு அமைப்புக்கு ‘யாவே கட்டளையிட்டது இதுதான்’ என்பது தமிழில் முழுமையற்றதாக ஒலிக்கிறது; ‘காரியம்’ சேர்த்தல் மூலத்தின் דָּבָר-ஐத் துல்லியமாகக் காட்டுகிறது. ‘உங்கள் ஆட்கள்’ என்பதற்குப் பதில் பால்வகை வரம்பில்லாத ‘உங்களுடையவர்களின்’ என்பது נַפְשֹׁתֵיכֶם என்ற எண்ணப்படும் நபர்களைக் சிறப்பாகக் குறிக்கிறது.
  naturalness: திருத்தப்பட்ட உரை நவீன நிலையான தமிழில் இயல்பான கட்டளைநடையைக் காக்கிறது. ‘தன் உணவின் அளவுக்கேற்ப’ என்பது ‘தான் உண்பதற்குத் தேவையான அளவுக்கு’ என்பதைவிட மூலத்தின் அளவுசார் சொல்லாட்சிக்கு நெருக்கமாக உள்ளது; கூடுதல் தேவைக் கருத்தைச் சேர்க்கவில்லை.
