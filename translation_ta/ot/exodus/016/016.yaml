  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: ta
  text: 'யாவே கட்டளையிட்ட காரியம் இதுதான்: “ஒவ்வொருவனும் தன் உணவின் அளவுக்கேற்ப அதிலிருந்து சேகரிக்க வேண்டும்; உங்களுடையவர்களின் எண்ணிக்கைக்கு ஏற்ப, ஒருவருக்கு[a] ஓர் ஓமர் வீதம். ஒவ்வொருவனும் தன் கூடாரத்தில் இருப்பவர்களுக்காக எடுத்துக்கொள்ள வேண்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தலைக்கு ஓர் ஓமர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה
  choice: கட்டளையிட்டது இதுதான்
  rationale: דָּבָר என்பதற்கு ‘சொல்’, ‘காரியம்’, ‘விஷயம்’ ஆகிய பொருள்கள் இருக்கலாம். இங்கு அது அறிவிக்கப்படும் கட்டளையைச் சுட்டுவதால், இயல்பான தமிழில் ‘கட்டளையிட்டது இதுதான்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: அதிலிருந்து சேகரிக்க வேண்டும்
  rationale: לקט என்பது உணவுப் பொருள்களைப் பொறுக்கிச் சேகரிப்பதைக் குறிக்கிறது; מִמֶּנּוּ முந்தைய சூழலில் கூறப்பட்ட மன்னாவைக் குறிக்கிறது.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: ஒவ்வொருவனும் தான் உண்பதற்குத் தேவையான அளவுக்கு
  rationale: ஆண்பால் ஒருமையான אִישׁ இங்கு பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொருவனும்’ என வழங்கப்பட்டது. ‘அவன் உண்ணுவதற்கு ஏற்ப’ என்ற எபிரெய மொழிநடையின் அளவு/தேவை சார்ந்த பொருளைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֹמֶר
  choice: ஓர் ஓமர்
  rationale: இது குறிப்பிட்ட ஓர் பண்டைய உலர் அளவை குறிக்கிறது; உறுதியற்ற நவீன அளவாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: לַגֻּלְגֹּלֶת
  choice: ஒருவருக்கு
  rationale: சொல்லுக்குச் சொல் ‘தலைக்கு’ என்றாலும், எண்ணிக்கையைக் குறிக்கும் இச்சூழலில் ‘ஒருவருக்கு’ என்பது இயல்பான தமிழ். நேரடி சொல்லாக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: உங்கள் ஆட்களின் எண்ணிக்கைக்கு ஏற்ப
  rationale: נֶפֶשׁ இங்கு உடலற்ற ‘ஆத்துமா’ என்பதல்ல, எண்ணப்படும் நபர்களைக் குறிக்கிறது. ‘உங்கள் ஆட்கள்’ கூடாரங்களில் உள்ள சமூக உறுப்பினர்களைக் குறிக்கும் இயல்பான சொல்லாக்கம்.
- source_word: אִישׁ לַאֲשֶׁר בְּאָהֳלוֹ תִּקָּחוּ
  choice: ஒவ்வொருவனும் தன் கூடாரத்தில் இருப்பவர்களுக்காக எடுத்துக்கொள்ள வேண்டும்
  rationale: கூடாரம் என்ற மூலப்படிமத்தைத் தக்கவைத்து, பன்மை சமூகத்துக்குக் கொடுக்கப்பட்ட கட்டளையின் பகிர்ந்தளிக்கும் ஒருமைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைநாமமான יהוה-ஐ மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைத் தக்கவைக்கிறது.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: ஆட்கள்
  alternative: ஆத்துமாக்கள்
  rationale: இங்கு இந்தச் சொல் எண்ணப்படும் மனிதர்களைக் குறிக்கிறது; ‘ஆத்துமாக்கள்’ என்பது இச்சூழலில் இல்லாத உடல்–ஆத்துமா வேறுபாட்டை வாசகத்தில் புகுத்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஓமர்’ என்ற பண்டைய அளவுப்பெயரும் ‘கூடாரம்’ என்ற மூலப்படிமமும் தக்கவைக்கப்பட்டுள்ளன; அலகின் நவீன மதிப்பு இவ்வசனத்திலேயே ஊகித்து சேர்க்கப்படவில்லை.
