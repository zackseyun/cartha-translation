source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: ta
  text: ஆரோன் இஸ்ரவேல் மக்களின் முழுச் சபையாரிடமும் பேசிக்கொண்டிருந்தபோது, அவர்கள் பாலைநிலத்தை நோக்கித் திரும்பினார்கள். இதோ, யாவேயின் மகிமை மேகத்தில் தோன்றியது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: பேசிக்கொண்டிருந்தபோது
  rationale: וַיְהִי என்பது எபிரெயக் கதைநடையின் தொடர்ச்சியை அறிமுகப்படுத்துகிறது; தமிழில் தனியாக ‘நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது இயல்பைக் குறைக்கும். כְּ + infinitive construct காட்டும் ஒரேநேரச் செயலை ‘பேசிக்கொண்டிருந்தபோது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் முழுச் சபையார்
  rationale: עֵדָה என்பது கூடிய சமூகத்தைக் குறிக்கிறது; ‘சபையார்’ அதைக் கண்ணியமான, பொதுவாகப் புரியும் தமிழில் தருகிறது. בְּנֵי יִשְׂרָאֵל என்பதற்கு இயல்பான தமிழாக ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்படுகிறது; இது ஆண்களை மட்டும் குறிக்காத சமூகப் பெயராக இச்சூழலில் செயல்படுகிறது.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: அவர்கள் பாலைநிலத்தை நோக்கித் திரும்பினார்கள்
  rationale: פנה + אֶל திசையை நோக்கித் திரும்புதலைக் குறிக்கிறது. ‘நோக்கித் திரும்பினார்கள்’ அந்த இயக்கத்தை மிகைப்படுத்தாமல் தெளிவாகக் காட்டுகிறது; מִדְבָּר என்பதற்கு ‘பாலைநிலம்’ இயற்கையான நிலப்பரப்பைக் குறிக்கும்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: தொடர்வதைக் திடீரெனக் கவனிக்கச் செய்யும் הִנֵּה என்பதன் சுட்டும் மற்றும் வியப்பூட்டும் வலிமையை ‘இதோ’ காக்கிறது.
- source_word: כְּבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: כָּבוֹד இங்கு வெளிப்படும் தெய்வீக மாட்சியை அல்லது மகிமையைக் குறிக்கிறது. தமிழில் உடைமைத் தொடர்பு இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரெயத் தனிப்பெயரான நான்கு எழுத்துப் பெயரை வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: נִרְאָה
  choice: தோன்றியது
  rationale: ראה வினையின் Niphal வடிவம் இங்கு ‘காணப்பட்டது’ என்பதைக் காட்டிலும் இயல்பாக ‘தோன்றியது’ என்று பொருள்படுகிறது; வெளிப்பாட்டின் நிகழ்வையும் காக்கிறது.
- source_word: בֶּעָנָן
  choice: மேகத்தில்
  rationale: முன்னொட்டிலுள்ள குறிப்புச் சுட்டு, கதையில் அறியப்பட்ட குறிப்பிட்ட மேகத்தைக் காட்டுகிறது; தமிழில் ‘மேகத்தில்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது அந்த வேறுபாட்டைக் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் சமூகக் குறிப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: சொல்லடிப்படையில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு சமூகத்திற்கான நிலையான இனக்குழுப் பெயராக உள்ளது. ‘இஸ்ரவேல் மக்கள்’ பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; ஆண்களுக்கு மட்டும் எனத் தவறாகச் சுருக்காது.
- issue: மேகத்தில் வெளிப்பட்ட மகிமையின் தன்மை
  choice: யாவேயின் மகிமை மேகத்தில் தோன்றியது
  alternative: யாவே மகிமையுடன் மேகத்தில் தோன்றினார்
  rationale: எழுவாய் כְּבוֹד יְהוָה, ‘யாவேயின் மகிமை’ என்பதே. அதை யாவே நேரடியாகத் தோன்றினார் என்று மாற்றாமல், மூலத்தின் இறையியல் நுணுக்கத்தையும் வெளிப்பாட்டின் மறைபொருளையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கதைநடையின் எபிரெயத் தொடக்கச் சூத்திரம் தமிழில் தேவையற்ற கனத்தை ஏற்படுத்தாதபடி காலவாக்கியத்துடன் இயல்பாக இணைக்கப்பட்டுள்ளது. ‘இதோ’ மட்டும் மூலத்தின் திடீர் கவன ஈர்ப்பைத் தக்கவைக்க வைக்கப்பட்டுள்ளது.
