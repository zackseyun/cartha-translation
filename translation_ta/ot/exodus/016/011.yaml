- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தனிப்பெயரான יהוה-ஐப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; பாரம்பரிய மாற்றீடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
