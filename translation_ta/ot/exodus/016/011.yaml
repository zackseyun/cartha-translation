lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசியதாவது
  rationale: וַיְדַבֵּר புதிய கதைநிகழ்வை அறிமுகப்படுத்துகிறது. அதைத் தொடர்ந்து வரும் לֵאמֹר உடன் சேர்த்து, அடுத்த வசனத்தின் நேரடிக் கூற்றை இயல்பாக அறிமுகப்படுத்தும் தமிழ்ச் சொல்லாக்கமாகத் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் பொதுவான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: -யதாவது
  rationale: அடுத்ததாக வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயப் பேச்சுச் சூத்திரத்தின் செயல்பாட்டை இயல்பான தமிழில் காக்கிறது.
