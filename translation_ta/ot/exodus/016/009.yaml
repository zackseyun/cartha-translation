source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל כָּל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִ/פְנֵ֣י יְהוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: ta
  text: பின்பு மோசே ஆரோனிடம், “இஸ்ரவேல் மக்களின்[a] முழுச் சபையாரிடமும், ‘யாவேயின் முன்னிலையில் நெருங்கி வாருங்கள்[b]; ஏனெனில் அவர் உங்கள் முறுமுறுப்புகளைக் கேட்டிருக்கிறார்’ என்று சொல்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொற்பட, “இஸ்ரவேலின் மகன்கள்.” இங்கு இது இஸ்ரவேல் மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “யாவேயின் முன்பாக அணுகுங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. ‘பின்பு’ என்பது நிகழ்வுகளின் வரிசையை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: אֱמֹר
  choice: என்று சொல்
  rationale: ஆரோனுக்குக் கொடுக்கப்படும் கட்டளையையும் அதைத் தொடர்ந்து வரும் நேரடிக் கூற்றையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் முழுச் சபையார்
  rationale: עֵדָה என்பதின் ஒன்றுகூடிய சமூகப் பொருளை ‘சபையார்’ காக்கிறது; בְּנֵי יִשְׂרָאֵל என்பதைக் சொற்குச் சொல் மொழிபெயர்ப்பதைவிட ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கியதாகவும் உள்ளது.
- source_word: קִרְבוּ
  choice: நெருங்கி வாருங்கள்
  rationale: இறைமுன்னிலைக்கு அணுகுமாறு கூறும் பன்மை கட்டளையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ‘அணுகுங்கள்’ என்பதும் சாத்தியம்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: לִפְנֵי என்பதின் ‘முன்/முன்னிலையில்’ என்ற இடத்தையும் சன்னிதிப் பொருளையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பான ‘Yahweh’-க்கு நெருங்கிய தமிழெழுத்துப் பெயர்ப்பாக வழங்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மக்கள் நெருங்கி வரவேண்டிய காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: שָׁמַע
  choice: கேட்டிருக்கிறார்
  rationale: முடிவுற்ற செயல் தற்போதைய சூழ்நிலைக்கு தொடர்புடையது என்பதைக் காட்டும் எபிரேய வினையின் இங்குள்ள நுணுக்கத்தைத் தமிழ் நிறைவுவினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: உங்கள் முறுமுறுப்புகள்
  rationale: வெறும் குறைகளைவிட, வனாந்தரச் சூழலில் தொடர்ந்து அதிருப்தியுடன் குறைகூறும் எதிர்மறைத் தொனியையும் இந்தச் சொல் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டப்பெயராக மாற்றாமல் காக்கிறது; ‘யெகோவா’ என்பது பிற்கால கலப்பு உச்சரிப்பை பிரதிபலிக்கிறது.
- issue: לִפְנֵי יהוה என்பதிலுள்ள இடம் மற்றும் இறைமுன்னிலை
  choice: யாவேயின் முன்னிலையில்
  alternative: யாவேயின் முன்பாக
  rationale: மக்கள் உடலளவில் அணுகுவதையும் இறைமுன்னிலைக்கு வருவதையும் இரண்டையும் திறந்தவாறு வைத்திருக்கிறது; வழிபாட்டு அல்லது சடங்கு சார்ந்த ஒரு குறிப்பிட்ட விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கண்ணியமும் கொண்ட நேரடி நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘முழுச் சபையார்’ ஒன்றுகூடிய சமூகத்தைச் சுட்டுகிறது; ‘முறுமுறுப்புகள்’ குறைகூறுதலின் எதிர்மறைத் தொனியை காக்கிறது. ஆங்கில ஆலோசனை உரையிலிருந்த இடம்மாறிய அடிக்குறிப்பு குறிகள் மூல எபிரேயத்துக்கு ஏற்ப சரியான சொற்றொடர்களுடன் இணைக்கப்பட்டுள்ளன.
