base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் அதைக் கண்டபோது, ஒருவருக்கொருவர்[a], “இது என்ன?”[b] என்று கேட்டார்கள். ஏனெனில், அது என்னவென்று அவர்களுக்குத் தெரியவில்லை. மோசே அவர்களிடம், “நீங்கள் உண்பதற்காக யாவே உங்களுக்குக் கொடுத்த அப்பம் இதுதான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘ஒருவன் தன் சகோதரனிடம்.’ இது ‘ஒருவருக்கொருவர்’ என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘இது என்ன?’ என்பதற்குப் பின்னுள்ள எபிரெயச் சொற்றொடர் பாரம்பரியமாக ‘மன்னா’ என்ற பெயருடன் தொடர்புபடுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் சமூகத்தாரைக் குறிக்கும் நிலையான இனக்குழுப் பெயர். ‘இஸ்ரவேல் மக்கள்’ என்பது நவீன தமிழில் இயல்பாகவும் சூழலுக்குத் துல்லியமாகவும் உள்ளது.
- source_word: אִישׁ אֶל־אָחִיו
  choice: ஒருவருக்கொருவர்
  rationale: சொல்லுக்குச் சொல் ‘ஒருவன் தன் சகோதரனிடம்’ என வரும் பரஸ்பரப் பேச்சைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מָן הוּא
  choice: இது என்ன?
  rationale: அடுத்து வரும் ‘அது என்னவென்று அவர்களுக்குத் தெரியவில்லை’ என்ற விளக்கம் இதை ஒரு கேள்வியாகப் புரிந்துகொள்ள ஆதரிக்கிறது. இவ்விடத்திலேயே ‘மன்னா’ என்ற பெயரைப் பயன்படுத்தாமல் கதைசார் சொல்விளையாட்டையும் பாதுகாக்கிறது.
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: அது என்னவென்று அவர்களுக்குத் தெரியவில்லை
  rationale: அறியாமையை விளக்கும் எபிரெய வாக்கியத்தைத் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: הוּא הַלֶּחֶם
  choice: அப்பம் இதுதான்
  rationale: காணப்பட்ட பொருளை யாவே கொடுத்த அப்பமாக அடையாளப்படுத்தும் வலியுறுத்தலை இயல்பான தமிழ் சொல்வரிசையில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְאָכְלָה
  choice: உண்பதற்காக
  rationale: கொடுக்கப்பட்ட அப்பத்தின் நோக்கத்தைச் சுருக்கமாகவும் கண்ணியமான நவீன தமிழிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக வருகிறது. ஆகவே பட்டப்பெயரைப் பதிலிடாமல், பரவலாக ஏற்கப்படும் ஒலிப்புக்கு ஏற்ப ‘யாவே’ என வழங்கப்பட்டுள்ளது.
- issue: מָן என்பதை இவ்வசனத்திலேயே ‘மன்னா’ என்ற பெயராகக் கொள்வதா
  choice: கேள்வியாக ‘இது என்ன?’ என்று மொழிபெயர்த்தல்
  alternative: முக்கிய உரையில் ‘மன்னா’ என்று பெயர்ச்சொல்லாக வழங்குதல்
  rationale: அவர்கள் அது என்னவென்று அறியவில்லை என்று அடுத்த உட்பிரிவு வெளிப்படையாக விளக்குவதால், கேள்விப் பொருள் சூழலுக்கு ஏற்றது. பின்னர் உருவாகும் ‘மன்னா’ என்ற பெயருடனான தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடர்கள் இயல்பான தமிழில் தரப்பட்டுள்ளன; முக்கியமான சொல் வடிவங்களும் ‘மன்னா’ பெயருடனான தொடர்பும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
