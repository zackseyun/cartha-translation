- issue: הָעֵדֻת என்பதன் குறிப்பிட்ட பொருள்
  choice: சாட்சியம்
  alternative: உடன்படிக்கைச் சாட்சியம் / சாட்சிப் பலகைகள்
  rationale: இது கூடார வழிபாட்டுச் சூழலில் உடன்படிக்கைப் பலகைகளையோ அவற்றுடன் தொடர்புடையதையோ குறிக்கலாம்; வசனமே குறிப்பை மேலும் வரையறுக்காததால் முதன்மை உரை அந்தப் பொருள் நெகிழ்வைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, சாதாரண வாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘சாட்சியம்’ என்ற வழிபாட்டுக்கூடாரத் தொழில்நுட்பச் சொல் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் சாத்தியமான குறிப்பிட்ட பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
