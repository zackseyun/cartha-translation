  yaml_path: translation/ot/exodus/016/034.yaml
  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
translation:
  language: ta
  text: யாவே மோசேக்குக் கட்டளையிட்டபடியே, ஆரோன் அதைப் பாதுகாத்து வைப்பதற்காகச் சாட்சியத்தின் முன்[a] வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உடன்படிக்கைச் சாட்சியத்தின் முன்.’ ‘சாட்சியம்’ என்பதற்கான எபிரெயச் சொல், வழிபாட்டுக்கூடாரம் சார்ந்த ஒரு சிறப்புச் சொல்; அது குறிப்பாக உடன்படிக்கைப் பலகைகளையோ அவற்றுடன் தொடர்புடையதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: முந்தைய கட்டளைக்கு முழுமையாக இணங்க ஆரோன் செயல்பட்டார் என்ற ஒப்புமைத் தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: இறைவனின் அதிகாரப்பூர்வமான ஆணையைத் தெளிவாகக் காட்டும் வழக்கமான தமிழ் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்துத் தருகிறது.
- source_word: אֶל מֹשֶׁה
  choice: மோசேக்கு
  rationale: எபிரெய மொழியின் மறைமுகச் செயப்படுபொருளை இயல்பான தமிழ் வேற்றுமை உருபுடன் தருகிறது.
- source_word: וַיַּנִּיחֵהוּ
  choice: அதை … வைத்தார்
  rationale: முன்னர் குறிப்பிடப்பட்ட பாத்திரத்தை நியமிக்கப்பட்ட இடத்தில் ஆரோன் வைத்த செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தனிப்பெயரின் வழக்கமான தமிழ் வடிவம்.
- source_word: לִפְנֵי
  choice: முன்
  rationale: வழிபாட்டுக்கூடாரச் சூழலில் உள்ள இடத்தொடர்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: הָעֵדֻת
  choice: சாட்சியம்
  rationale: உடன்படிக்கைப் பலகைகளையோ அவற்றோடு தொடர்புடைய பரிசுத்தப் பொருளையோ குறிக்கக்கூடிய தொழில்நுட்பச் சொல்லின் நெகிழ்வைத் தீர்மானித்துவிடாமல் பாதுகாக்கிறது.
- source_word: לְמִשְׁמָרֶת
  choice: பாதுகாத்து வைப்பதற்காக
  rationale: அதைப் பத்திரமாக வைத்துப் பாதுகாக்கும் நோக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘நினைவுச்சின்னம்’ என்ற கருத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
