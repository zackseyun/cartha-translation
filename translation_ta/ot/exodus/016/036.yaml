base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/036.yaml
  text: An omer is a tenth of an ephah[a].
translation:
  language: ta
  text: ஓர் ஓமர் என்பது ஓர் எப்பாவின் பத்தில் ஒரு பங்கு[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஓமரும் எப்பாவும் உலர் பொருட்களை அளக்கப் பயன்படுத்தப்பட்ட பண்டைய எபிரேய அளவைகள்; ஓர் ஓமர் என்பது ஓர் எப்பாவின் பத்தில் ஒரு பங்கு என்று இந்த வசனம் வரையறுக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֹמֶר
  choice: ஓர் ஓமர்
  rationale: עֹמֶר என்பது உலர் பொருட்களை அளக்கும் பண்டைய எபிரேய அளவை. துல்லியமற்ற நவீன அளவாக மாற்றாமல், ஒலிபெயர்த்துப் பாதுகாக்கப்பட்டுள்ளது. வரையறை வாக்கியம் என்பதால் எபிரேய மொழியின் சுட்டுருபைத் தமிழில் இயல்பாகத் தனி அளவு அலகைக் குறிக்கும் ‘ஓர்’ என வழங்குவது பொருத்தமானது.
- source_word: עֲשִׂרִית
  choice: பத்தில் ஒரு பங்கு
  rationale: இச்சொல் பத்திலொரு பகுதியைக் குறிக்கிறது. ‘பத்தில் ஒரு பங்கு’ என்பது அளவுகளுக்கிடையிலான விகிதத்தை இயல்பான நவீன தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: הָאֵיפָה
  choice: ஓர் எப்பாவில்
  rationale: אֵיפָה என்பதும் பண்டைய எபிரேய உலர் அளவை; ஆகவே ஒலிபெயர்க்கப்பட்டுள்ளது. ‘எப்பாவில் பத்தில் ஒரு பங்கு’ என்ற அமைப்பு பகுதி–முழுமை உறவைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הוּא
  choice: என்பது
  rationale: பெயர்ச்சொல் வாக்கியத்தில் இச்சுட்டுப்பெயர் இணைப்புச் செயல்பாடு வகிக்கிறது. தமிழில் வரையறையைக் காட்டும் ‘என்பது’ அதன் பணியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְ
  choice: ''
  rationale: இணைப்பிடைச்சொல் இங்கு விளக்கக் குறிப்பை அறிமுகப்படுத்துகிறது. தனித்த தமிழ்வசனத்தில் ‘மேலும்’ அல்லது ‘இப்போது’ எனச் சேர்ப்பது தேவையற்ற பொருள் நிழலை உருவாக்கும் என்பதால் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான வரையறை வாக்கியம். பண்டைய அளவைகளின் பெயர்கள் ஒலிபெயர்க்கப்பட்டு, அவற்றின் தொடர்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
