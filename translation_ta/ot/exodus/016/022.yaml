source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שִּׁשִּׁ֗י לָֽקְט֥וּ לֶ֨חֶם֙ מִשְׁנֶ֔ה שְׁנֵ֥י הָ/עֹ֖מֶר לָ/אֶחָ֑ד וַ/יָּבֹ֨אוּ֙ כָּל נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה וַ/יַּגִּ֖ידוּ לְ/מֹשֶֽׁה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: ta
  text: ஆறாம் நாளில் அவர்கள் இருமடங்கு அப்பத்தைச் சேகரித்தார்கள்; ஒவ்வொருவருக்கும் தலா இரண்டு ஓமர்[a]. சபையின் தலைவர்கள் அனைவரும் மோசேயிடம் வந்து அதைத் தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஓமர் என்பது பண்டைய இஸ்ரவேலில் பயன்படுத்தப்பட்ட உலர் பொருட்களுக்கான ஓர் அளவை அலகு.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשִּׁשִּׁי
  choice: ஆறாம் நாளில்
  rationale: וַיְהִי என்பது எபிரெயக் கதைநடையின் நிகழ்வுத் தொடரை அறிமுகப்படுத்துகிறது; தமிழில் தனியே ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது இயல்பற்றதாக இருப்பதால் காலச் சொற்றொடருடன் நேரடியாகத் தொடங்கப்பட்டது.
- source_word: לָקְטוּ לֶחֶם מִשְׁנֶה
  choice: இரு மடங்கு அப்பத்தைச் சேகரித்தார்கள்
  rationale: לֶחֶם என்பதன் ‘அப்பம்’ என்ற சொல்லைத் தக்கவைத்து, מִשְׁנֶה குறிக்கும் இரட்டிப்பு அளவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁנֵי הָעֹמֶר לָאֶחָד
  choice: ஒவ்வொருவருக்கும் இரண்டு ஓமர் கிடைத்தது
  rationale: לָאֶחָד இங்கு பகிர்ந்தளிக்கும் பொருளில் ‘ஒவ்வொருவருக்கும்’ என வருகிறது. முந்தைய சேகரித்தல் வினையோடு தமிழில் இயல்பாக இணைய ‘கிடைத்தது’ சேர்க்கப்பட்டுள்ளது; அளவு மாற்றப்படவில்லை.
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: சபையின் தலைவர்கள் அனைவரும்
  rationale: נְשִׂיאִים என்பது சமூகத்தின் அங்கீகரிக்கப்பட்ட தலைவர்களையும், עֵדָה இஸ்ரவேல் சமூகக் கூட்டத்தையும் குறிக்கிறது; ‘சபை’ சுருக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் இணை.
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: மோசேயிடம் வந்து அதைத் தெரிவித்தார்கள்
  rationale: வந்து பின்னர் மோசேயுக்குத் தெரிவித்தனர் என்ற இரு வினைகளின் வரிசையைத் தக்கவைக்கிறது; மறைபொருளான செய்தியை ‘அதை’ என்பதால் இயல்பாகக் குறிக்கிறது.
