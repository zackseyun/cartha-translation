revisions:
- from: ஆறாம் நாளில் அவர்கள் இரு மடங்கு அப்பத்தைச் சேகரித்தார்கள்; ஒவ்வொருவருக்கும் இரண்டு ஓமர்[a] கிடைத்தது. சபையின் தலைவர்கள் அனைவரும் மோசேயிடம் வந்து அதைத் தெரிவித்தார்கள்.
  to: ஆறாம் நாளில் அவர்கள் இருமடங்கு அப்பத்தைச் சேகரித்தார்கள்; ஒவ்வொருவருக்கும் தலா இரண்டு ஓமர்[a]. சபையின் தலைவர்கள் அனைவரும் மோசேயிடம் வந்து அதைத் தெரிவித்தார்கள்.
  rationale: 'The revision removes the added notion of receiving and retains the Hebrew’s construction: they gathered a double amount of bread, namely two omers for each person. The brief verbless quantitative clause is idiomatic in Tamil after the preceding action and preserves the source’s appositional specification.'
