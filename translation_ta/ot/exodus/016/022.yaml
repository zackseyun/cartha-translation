translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை. மூலத்தின் ‘அப்பம்’ மற்றும் ‘ஓமர்’ ஆகிய சொற்கள் தக்கவைக்கப்பட்டுள்ளன; பழமையான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
