  text: וַ/יְהִ֕י בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה הוֹצִ֨יא יְהוָ֜ה אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: ta
  text: அந்த நாளிலேயே யாவே இஸ்ரவேலின் மக்களை[a] எகிப்து நாட்டிலிருந்து அவரவர் பிரிவுகளோடு[b] வெளியே கொண்டுவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கும் குடும்பவழிக் கூட்டுச் சொற்றொடர். “இஸ்ரவேலர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவர்களுடைய அணிகளின்படி,” “அவர்களுடைய படைப்பிரிவுகளின்படி,” அல்லது “அவர்களுடைய கூட்டங்களோடு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அவர்கள் ஒழுங்கமைந்த பிரிவுகளாகப் புறப்பட்டதை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: அந்த நாளிலேயே
  rationale: וַיְהִי இங்கு நிகழ்வைத் தொடரும் உரையாடல் அமைப்பாகச் செயல்படுகிறது; தனியே மொழிபெயர்த்தால் தமிழில் தேவையற்ற கனத்த நடை ஏற்படும். בְּעֶצֶם ... הַזֶּה என்பதன் துல்லிய வலியுறுத்தலை ‘அந்த நாளிலேயே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הוֹצִיא
  choice: வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளுடையது. ‘வெளியே கொண்டுவந்தார்’ என்பது அந்தப் பொருளையும் வெளியேற்ற இயக்கத்தையும் தெளிவாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுருவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இனக்குழுவையும் குறிக்கும் குடும்பவழிக் கூட்டுப்பெயர். ‘மக்கள்’ நவீன தமிழில் இயல்பாக அந்தக் கூட்டுப் பொருளைத் தருகிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: אֶרֶץ என்பதைக் ‘நாடு’ என்று வெளிப்படையாகக் காத்து, מִן குறிக்கும் வெளியேறும் தொடக்க இடத்தை இயல்பான தமிழில் தருகிறது.
- source_word: עַל צִבְאֹתָם
  choice: அவர்களுடைய அணிகளின்படி
  rationale: צְבָאוֹת இங்கு போரிடும் படைகள் என்று கட்டாயமாகக் குறிக்காமல், ஒழுங்குபடுத்தப்பட்ட பெருங்குழுக்கள் அல்லது அணிகளைக் குறிக்கலாம். ‘அணிகளின்படி’ அந்த அமைப்பு நுணுக்கத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுக் குடும்பப்பெயர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலர்
  rationale: இந்தச் சூழலில் சொற்றொடர் வெளியேறிய மொத்த இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. பிரதான உரை இயல்பான தமிழில் கூட்டுப் பொருளைத் தருகிறது; மூலத்தின் ஆண்பால் குடும்ப உருவகம் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
- issue: צִבְאֹתָם என்பதன் இராணுவ நுணுக்கம்
  choice: அணிகளின்படி
  alternative: படைகளின்படி; கூட்டங்களின்படி
  rationale: இங்கு ஆயுதப் போர் அலகுகள் என்பதைக் காட்டிலும் ஒழுங்கமைந்த பிரிவுகள் முக்கியமாக இருக்கலாம். ஆகவே இராணுவப் பொருளை மிகைப்படுத்தாத சொல்லைத் தேர்ந்தெடுத்து மாற்றுப் பொருள்களை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வலியுறுத்தல் ‘அந்த நாளிலேயே’ என்பதில் காக்கப்படுகிறது. அடிக்குறி [a] அது விளக்கும் ‘இஸ்ரவேலின் மக்கள்’ என்பதற்குப் பின்னும், [b] ‘அணிகளின்படி’ என்பதற்குப் பின்னும் பொருத்தப்பட்டுள்ளது.
