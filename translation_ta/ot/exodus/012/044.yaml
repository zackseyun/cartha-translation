- from: ஆனால், ஒருவனுக்குச் சொந்தமான, வெள்ளி கொடுத்து வாங்கப்பட்ட ஒவ்வொரு அடிமையையும்[a] நீ விருத்தசேதனம் செய்த பின்பு[b], அவன் அதைப் புசிக்கலாம்.
  to: ஆனால், வெள்ளி கொடுத்து வாங்கப்பட்ட ஒருவனுக்குச் சொந்தமான ஒவ்வொரு அடிமையையும் நீ விருத்தசேதனம் செய்த பின்பு[a], ஒவ்வொரு அடிமையும் அதில் புசிக்கலாம்.[b]
  rationale: The original wording has been minimally recast because its accusative-marked noun cannot also function naturally as the subject of “புசிக்கலாம்.” The revision places the circumcised slave in an explicit nominative main clause. “அதில்” retains the partitive/participatory sense of בּוֹ. Footnote anchors have been repositioned so marker a accompanies the slave/purchase expression and marker b accompanies participation in the Passover meal.
