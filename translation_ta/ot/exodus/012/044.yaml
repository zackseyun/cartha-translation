base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: ta
  text: ஆனால், வெள்ளி கொடுத்து வாங்கப்பட்ட ஒருவனுக்குச் சொந்தமான ஒவ்வொரு அடிமையையும் நீ விருத்தசேதனம் செய்த பின்பு[a], ஒவ்வொரு அடிமையும் அதில் புசிக்கலாம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவனுடைய ஒவ்வொரு அடிமை; பணம் கொடுத்து வாங்கப்பட்டவன்.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, விருத்தசேதனம் செய்யப்பட்ட பின்பே அவன் பஸ்கா உணவில் பங்கேற்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל
  choice: ஆனால், ... ஒவ்வொரு
  rationale: முந்தைய வசனத்தில் அந்நியனுக்கு விதிக்கப்பட்ட தடையுடன் இந்த விதியை இணைத்துக் காட்ட וְ என்பதை ‘ஆனால்’ என்றும், כָּל என்பதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொரு’ என்றும் வழங்குகிறது.
- source_word: עֶבֶד
  choice: அடிமை
  rationale: பணம் கொடுத்து வாங்கப்பட்டவர் என்று இச்சட்டச் சூழல் வெளிப்படையாகக் கூறுவதால், பிணைக்கப்பட்ட உடைமை நிலையை மென்மைப்படுத்தாமல் ‘அடிமை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אִישׁ
  choice: ஒருவனுக்குச் சொந்தமான
  rationale: எபிரெயச் சொல்லின் ஆண்பால் ஒருமையையும், இங்கு அது எஜமானைக் குறிப்பதையும் காக்கிறது; அதேவேளையில் தமிழில் இயல்பான உடைமைத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: מִקְנַת כָּסֶף
  choice: வெள்ளி கொடுத்து வாங்கப்பட்ட
  rationale: இந்தச் சொற்றொடர் பணம் கொடுத்து வாங்கப்பட்ட ஒருவரைக் குறிக்கிறது. ‘வெள்ளி’ என்பது மூலத்தின் நேரடியான உருவகத்தைத் தக்கவைக்கிறது; சூழலில் அது கொள்முதல் மதிப்பாகப் புரிகிறது.
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: நீ விருத்தசேதனம் செய்த பின்பு
  rationale: இரண்டாம் நபர் ஒருமை நேரடி உரையையும், பஸ்கா உணவில் பங்கேற்பதற்கு முன் நிறைவேற்ற வேண்டிய நிபந்தனையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָז
  choice: பின்பு
  rationale: விருத்தசேதனத்திற்குப் பிறகே அடுத்த செயல் அனுமதிக்கப்படுகிறது என்ற தொடர்ச்சியைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: יֹאכַל בּוֹ
  choice: அவன் அதைப் புசிக்கலாம்
  rationale: இங்கு வினை எதிர்கால நிகழ்வை மட்டும் அல்லாமல் அனுமதியையும் குறிக்கிறது. ‘அதை’ என்பது சூழலில் பஸ்கா உணவைக் குறிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டச் சூழலில் עֶבֶד என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாள்
  rationale: பணம் கொடுத்து வாங்கப்பட்ட நிலை வசனத்திலேயே மையமாக இருப்பதால், அடிமைத்தனத்தின் சமூக உண்மையை மறைக்காத சொல் தேர்ந்தெடுக்கப்பட்டது.
- issue: אִישׁ என்பதிலுள்ள பாலினக் குறிப்பு
  choice: ஒருவன்
  alternative: ஒருவர்
  rationale: மூலத்தின் ஆண்பால் ஒருமை சட்டப் பொருளைத் தக்கவைக்கிறது; அதை பாலினப் பொதுமைப்படுத்தலாக மாற்றவில்லை.
- issue: பஸ்காவில் பங்கேற்க விருத்தசேதனம் முன்நிபந்தனையா என்பது
  choice: விருத்தசேதனம் செய்த பின்பு அவன் புசிக்கலாம்
  alternative: விருத்தசேதனம் செய்து, அவன் புசிப்பான்
  rationale: וּמַלְתָּה ... אָז என்ற வரிசை, விருத்தசேதனம் பங்கேற்புக்கு முன் நிறைவேற்றப்பட வேண்டிய நிபந்தனை என்பதைச் சுட்டுகிறது; அனுமதிப் பொருளும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதியின் கண்ணியமான தொனியுடன் மொழிபெயர்க்கப்பட்டது. ‘அடிமை’ சமூக நிலையை மறைக்காமல் கூறுகிறது; ‘புசிக்கலாம்’ வேதாகமச் சூழலுக்கேற்ற கண்ணியமானதாயும் பொதுவாகப் புரியக்கூடியதாயும் உள்ளது. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
