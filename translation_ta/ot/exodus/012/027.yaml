  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: ta
  text: நீங்கள், ‘இது யாவேக்குச் செலுத்தப்படும் பஸ்காப் பலி. அவர் எகிப்தைத் தாக்கியபோது, எகிப்திலிருந்த இஸ்ரயேல் மக்களின் வீடுகளைக் கடந்து சென்றார்[a]; நமது வீடுகளை விடுவித்தார்’ என்று சொல்ல வேண்டும். அப்போது மக்கள் தலைவணங்கி, வழிபட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடந்து சென்றார்” என்பதற்கான எபிரெய வினைச்சொல்லும் “பஸ்கா” என்ற பெயரும் ஒரே சொல்வேரைச் சேர்ந்தவை; இவ்வினை இச்சூழலில் காப்பாற்றுதல் அல்லது தப்பவிடுதல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: பஸ்காப் பலி
  rationale: பஸ்காவுடன் தொடர்புடைய பலி என்ற எபிரெயக் கூட்டுச்சொல்லின் வழிபாட்டுப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்குச் செலுத்தப்படும்
  rationale: ל முன்னொட்டின் அர்ப்பணிப்பு அல்லது உரிமை சார்ந்த பொருளை பலியிடும் சூழலில் இயல்பான தமிழில் வெளிப்படுத்துகிறது; יהוה என்பது யாவே என ஒலிபெயர்க்கப்படுகிறது.
- source_word: פָּסַח
  choice: கடந்துசென்று
  rationale: פֶּסַח என்ற பெயர்ச்சொல்லுடனான சொற்பிறப்புத் தொடர்பை ஓரளவு காக்கிறது; காப்பாற்றுதல் அல்லது தப்பவிடுதல் என்ற சூழற்பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்களின் வீடுகள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரயேலின் மகன்கள்’ என்றாலும், இங்கு சமூகமெங்கும் குறிக்கப்படுவதால் நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் ‘இஸ்ரயேல் மக்கள்’ என வழங்கப்படுகிறது.
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: எகிப்தியரைத் தாக்கியபோது
  rationale: ב + infinitive construct தரும் காலப்பொருளை ‘தாக்கியபோது’ எனக் காக்கிறது; ‘எகிப்து’ இங்கு அதன் மக்களைக் குறிக்கும் ஆகுபெயராக இருப்பதால் தமிழில் ‘எகிப்தியர்’ எனத் தெளிவாக்கப்படுகிறது.
- source_word: הִצִּיל
  choice: விடுவித்தார்
  rationale: נצל வினையின் மீட்டல்/தப்புவித்தல் பொருளைத் துல்லியமாகக் காட்டுகிறது; ‘வீடுகள்’ என்பது குடும்பங்களைக் குறிக்கும் மூலத்தின் ஆகுபெயரை அப்படியே காக்கிறது.
- source_word: וַיִּקֹּד ... וַיִּשְׁתַּחֲווּ
  choice: தலைகுனிந்து பணிந்துகொண்டார்கள்
  rationale: முதல் வினையின் குனிதலையும் இரண்டாம் வினையின் ஆழ்ந்த வணக்கத்தையும் ஒரே இயல்பான தமிழ் தொடரில், இரு செயல்களின் வேறுபாடு மறையாமல் வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருவதால், பொதுப் பட்டப்பெயரால் மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் வழங்கப்படுகிறது.
- issue: פָּסַח என்பதின் பலபொருள்
  choice: கடந்துசென்றார் என்ற அடிப்படை உருவகத்தைப் பேணுதல்
  alternative: காப்பாற்றினார் / தப்பவிட்டார்
  rationale: பஸ்கா என்ற பெயருடனான ஒலியியல்-சொற்பிறப்புத் தொடர்பை முழுமையாகத் தமிழில் மீட்டெடுக்க இயலாதபோதும், மூலத்தின் இயக்க உருவகத்தை முதன்மை உரையில் காத்து, பாதுகாப்புப் பொருளை அடிக்குறிப்பில் தருகிறது.
- issue: וַיִּשְׁתַּחֲווּ என்பதின் வணக்கப் பொருள்
  choice: பணிந்துகொண்டார்கள்
  alternative: வழிபட்டார்கள் / தரையில் விழுந்து வணங்கினார்கள்
  rationale: வினையில் உடல்சார் பணிதலும் வழிபாட்டு மரியாதையும் இரண்டும் உள்ளன; ‘பணிந்துகொண்டார்கள்’ இவ்விரு பரிமாணங்களையும் தேவையின்றி குறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பஸ்கா’ என்ற நிலைபெற்ற வேதாகமச் சொல் காக்கப்பட்டுள்ளது. மூலத்தில் ‘நீங்கள்’ என்பதும் ‘நமது’ என்பதும் உள்ள நபர்மாற்றம் அப்படியே பேணப்பட்டுள்ளது.
