source:
  edition: WLC
  text: אַל תֹּאכְל֤וּ מִמֶּ֨/נּוּ֙ נָ֔א וּ/בָשֵׁ֥ל מְבֻשָּׁ֖ל בַּ/מָּ֑יִם כִּ֣י אִם צְלִי אֵ֔שׁ רֹאשׁ֥/וֹ עַל כְּרָעָ֖י/ו וְ/עַל קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: ta
  text: அதில் எதையும் பச்சையாகவோ தண்ணீரில் வேகவைத்தோ சாப்பிடாதீர்கள். அதன் தலை, கால்கள், உள்ளுறுப்புகளுடன்[a] நெருப்பில் சுட்டதை மட்டுமே சாப்பிடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “அதன் தலை அதன் கால்களுடனும் அதன் உள்ளுறுப்புகளுடனும்.”
    reason: எபிரெயத்தின் தலை, கால்கள், உள்ளுறுப்புகள் என வரும் பட்டியல் அமைப்பை மேலும் நேரடியாகக் காட்டுகிறது.
lexical_decisions:
- source_word: נָא
  choice: பச்சையாக
  rationale: இந்தச் சமையல் சூழலில், நெருப்பில் சுடப்படாமலும் தண்ணீரில் வேகவைக்கப்படாமலும் உள்ள இறைச்சியைக் குறிக்கிறது. ‘பச்சையாக’ என்பது இயல்பான, தெளிவான நவீனத் தமிழ் சொல்; ‘அரைவேக்காடாக’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: தண்ணீரில் வேகவைத்தோ
  rationale: בשל என்பதன் வலியுறுத்தப்பட்ட வடிவத்துடன் ‘தண்ணீரில்’ என்ற சொற்றொடர் இணைவதால், பொதுவான சமைத்தலை அல்ல, தண்ணீரில் வேகவைக்கும் முறையையே குறிப்பாகத் தடை செய்கிறது.
- source_word: כִּי אִם
  choice: மட்டுமே
  rationale: முன்னர் தடைசெய்யப்பட்ட முறைகளுக்கு மாறாக, நெருப்பில் சுடுதல் மட்டுமே அனுமதிக்கப்படுகிறது என்ற வலுவான விதிவிலக்கையும் தனித்தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צְלִי אֵשׁ
  choice: நெருப்பில் சுட்டதாக
  rationale: நெருப்பைப் பயன்படுத்திச் சுட்டல் என்ற எபிரெயச் சமையல் முறையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: அதன் தலை, கால்கள், உள்ளுறுப்புகள் ஆகியவற்றுடன்
  rationale: விலங்கின் இந்தப் பகுதிகளும் சேர்த்தே முழுமையாகச் சுடப்பட வேண்டும் என்பதைக் காட்டுகிறது. ‘உள்ளுறுப்புகள்’ என்பது கண்ணியமான, பொதுவாகப் புரியக்கூடிய நவீனத் தமிழ்; עַל என்பதன் பட்டியல் சார்ந்த இணைப்புப் பொருளை ‘ஆகியவற்றுடன்’ எடுத்துரைக்கிறது.
- source_word: מִמֶּנּוּ
  choice: அதில் எதையும்
  rationale: எபிரெயத்தின் பகுதிப்பொருளைத் தக்கவைத்தபடி, தமிழில் இயல்பாக ‘அதில் எதையும் ... சாப்பிடாதீர்கள்’ என்று வழங்குகிறது.
