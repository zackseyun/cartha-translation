source:
  edition: WLC
  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: ta
  text: அவர்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவருவதற்காக, அது யாவேக்காகக் காவல் காக்கப்பட்ட இரவாக[a] இருந்தது. இதே இரவு யாவேக்காக, இஸ்ரவேல் மக்கள் அனைவருக்கும் தலைமுறைதோறும் காவல் காக்கப்பட்ட இரவாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விழிப்புடன் காக்கப்பட்ட இரவு’ அல்லது ‘கடைப்பிடிப்புக்குரிய இரவு’ என்றும் பொருள்படலாம். שִׁמֻּרִים என்ற எபிரெயச் சொல் விழிப்புடன் காத்தல் அல்லது காத்துக்கொள்ளுதல் என்ற பொருளைக் கொண்டது; நினைவாகக் கடைப்பிடிப்பதையும் இங்கு சுட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: விழிப்பிரவு
  rationale: לֵיל என்பது அடுத்த பெயர்ச்சொல்லுடன் இணைந்த நிலையில் ‘...இன் இரவு’ என்ற பொருளைத் தருகிறது. שִׁמֻּרִים என்பது שׁמר (‘காத்தல்/கவனித்தல்’) என்ற வேரிலிருந்து வந்து, விழித்துக் காத்திருத்தலையும் நினைவாகக் கடைப்பிடித்தலையும் ஒருங்கே சுட்டக்கூடும். ‘விழிப்பிரவு’ இந்த இரு நுணுக்கங்களையும் முற்றிலும் ஒன்றாகச் சுருக்கிவிடாமல் தக்கவைக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு உரிய
  rationale: לְ முன்னொட்டு இங்கு தொடர்பு, அர்ப்பணிப்பு அல்லது உரிமையைச் சுட்டுகிறது. ‘யாவேக்கு உரிய’ என்பது இரவு அவரோடு சிறப்பாகத் தொடர்புடையது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பெயராகவே ஒலிபெயர்த்து வழங்குகிறது.
- source_word: לְהוֹצִיאָם
  choice: அவர்களை ... வெளியே கொண்டுவருவதற்காக
  rationale: לְ உடன் வரும் வினையெச்சக் கட்டமைப்பு நோக்கம் அல்லது விளைவைச் சுட்டுகிறது. ‘வெளியே கொண்டுவருவதற்காக’ இந்த இலக்கண உறவை வெளிப்படையாகவும் குறைந்த விளக்கத்துடனும் தருகிறது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: மூலத்தில் வெளிப்படையாக உள்ள אֶרֶץ (‘நாடு’) என்பதைக் கைவிடாமல் இயல்பான தமிழில் தருகிறது.
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: இதே இரவு
  rationale: சுட்டுப்பெயரும் சுட்டுச்சொல்லும் சேர்ந்து தரும் வலியுறுத்தப்பட்ட அடையாளத்தை ‘இதே’ வெளிப்படுத்துகிறது.
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவருக்கும்
  rationale: בְּנֵי יִשְׂרָאֵל என்பதன் உடன்படிக்கைச் சமூகக் குறிப்பை இயல்பான நவீன தமிழில் தருகிறது; ‘பிள்ளைகள்’ என்ற சொற்படி வடிவம் இங்கு செயற்கையாக ஒலிக்கலாம்.
- source_word: לְדֹרֹתָם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்து வரும் எல்லாத் தலைமுறைகளிலும் தொடர்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, நான்கு எழுத்துகளாலான இறைப் பெயரே உள்ளது. அதை ‘யாவே’ என்று வழங்குவது பெயருக்கும் பட்டத்திற்கும் உள்ள வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: שִׁמֻּרִים என்பதிலுள்ள காவல் மற்றும் நினைவுக் கடைப்பிடிப்பு நுணுக்கங்கள்
  choice: விழிப்பிரவு
  alternative: காவல் இரவு; கடைப்பிடிப்பு இரவு
  rationale: இதை வெறும் உடல் விழிப்பாகவோ வெறும் சடங்குக் கடைப்பிடிப்பாகவோ மட்டும் தீர்மானிக்காமல், இரு சாத்தியங்களுக்குமிடையிலான மூலத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: ‘விழிப்பிரவு’ என்பது சுருக்கமான, கண்ணியமான நவீனச் சொல்; அரிதாகத் தோன்றக்கூடிய அதன் இரட்டை நுணுக்கம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. வாக்கிய அமைப்பு மூலத்தின் இரு இணையான பகுதிகளையும் மீள்வரும் சொல்லையும் பாதுகாக்கிறது.
