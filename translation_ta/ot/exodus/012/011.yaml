source:
  edition: WLC
  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: ta
  text: 'நீங்கள் அதைச் சாப்பிட வேண்டிய முறை இதுதான்: இடுப்பில் கச்சை கட்டிக்கொண்டு[a], கால்களில் செருப்புகளை அணிந்துகொண்டு, கையில் கோலைப் பிடித்துக்கொண்டு சாப்பிடுங்கள். அதை அவசரமாகச் சாப்பிடுங்கள்; அது யாவேக்குரிய பஸ்கா[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “உங்கள் இடுப்புகள் கட்டப்பட்ட நிலையில்.” உடனே புறப்படுவதற்கு ஆடையை இடுப்பில் கச்சையால் இறுக்கிக் கட்டி ஆயத்தமாக இருப்பதை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “யாவேக்கான பஸ்கா” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָכָה תֹּאכְלוּ אֹתוֹ
  choice: நீங்கள் அதைச் சாப்பிட வேண்டிய முறை இதுதான்
  rationale: உணவை எவ்வாறு உண்ண வேண்டும் என்பதை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடரின் அறிவுறுத்தல் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: இடுப்பில் கச்சை கட்டிக்கொண்டு
  rationale: உடனே புறப்படுவதற்கோ செயல்படுவதற்கோ ஆயத்தமாக இருப்பதைக் குறிக்கும் உடல் சார்ந்த உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: கால்களில் செருப்புகளை அணிந்துகொண்டு
  rationale: பண்டைய சூழலின் காலணியைக் குறிக்கும் சொல்லை, சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: கையில் கோலைப் பிடித்துக்கொண்டு
  rationale: பயணத்துக்கு ஆயத்தமான நிலையைக் காட்டும் מַקֵּל என்பதன் நேரடியான பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּחִפָּזוֹן
  choice: அவசரமாக
  rationale: உடனடியாகப் புறப்பட வேண்டிய வேகத்தையும் அவசரத்தையும் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: פֶּסַח
  choice: பஸ்கா
  rationale: இங்கு சடங்கு அல்லது பலியுணவைக் குறிக்கும் பெயரைத் தமிழ்க் கிறிஸ்தவ வழக்கில் பரவலாக அறியப்பட்ட வடிவில் தருகிறது; அதன் பரந்த சடங்குசார் குறிப்பைச் சுருக்கவில்லை.
- source_word: הוּא לַיהוָה
  choice: அது யாவேக்குரிய பஸ்கா
  rationale: לַיהוָה என்பதில் உள்ள யாவேக்குச் சொந்தமானது அல்லது அவருக்கென நியமிக்கப்பட்டது என்ற உறவைத் திறந்த நிலையில் வைத்திருக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் தேவனுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயரான நான்கெழுத்து இறைப்பெயர் இருப்பதால், பட்டத்தைப் பதிலிடாமல் அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: לַיהוָה காட்டும் உறவு
  choice: யாவேக்குரிய பஸ்கா
  alternative: யாவேக்கான பஸ்கா
  rationale: லாமேத் முன்னொட்டு சொந்தம், தொடர்பு, அர்ப்பணிப்பு அல்லது நோக்கம் ஆகிய நுணுக்கங்களைத் தாங்கக்கூடும். முதன்மை உரை இயல்பான தமிழில் உறவைத் தெரிவிக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: מָתְנֵיכֶם חֲגֻרִים என்ற மரபுத்தொடர்
  choice: இடுப்பில் கச்சை கட்டிக்கொண்டு
  alternative: உங்கள் அரைகளைக் கட்டிக்கொண்டு
  rationale: புறப்படத் தயாராக இருப்பதன் காட்சியைப் பாதுகாத்தபடியே, இன்றைய வாசகர்களுக்குப் புரியாத அல்லது தவறாகப் புரியக்கூடிய சொற்களைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; அறிவுறுத்தலின் கட்டளைத் தொனி, பயணத்திற்கான உடல் சார்ந்த ஆயத்தம், அவசரம் ஆகியவை தெளிவாக வைக்கப்பட்டுள்ளன. மிகப் பழமையான சொற்களைத் தவிர்த்து, உரையின் கண்ணியமும் சடங்குசார் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
