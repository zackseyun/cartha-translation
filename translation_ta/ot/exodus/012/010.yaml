id: EXO.12.10
reference: Exodus 12:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לֹא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר וְ/הַ/נֹּתָ֥ר מִמֶּ֛/נּוּ עַד בֹּ֖קֶר בָּ/אֵ֥שׁ תִּשְׂרֹֽפוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: ta
  text: அதில் எதையும் காலை வரை மீதியாக வைக்காதீர்கள்; அதில் காலை வரை மீதியாக இருப்பதை நெருப்பில் எரித்துவிடுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: மீதியாக வைக்காதீர்கள்
  rationale: יתר என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றை எஞ்சியிருக்கும்படி வைப்பதைக் குறிக்கிறது. எதிர்மறைக் கட்டளையின் வலிமையையும் இயல்பான நவீனத் தமிழையும் இந்தச் சொற்றொடர் காக்கிறது.
- source_word: מִמֶּנּוּ
  choice: அதில் எதையும்
  rationale: מן உடன் வரும் பின்னொட்டு சூழலில் ‘அதிலிருந்து/அதில்’ என்ற உறவைத் தருகிறது; எதிர்மறைக் கட்டளையில் எந்தப் பகுதியும் விதிவிலக்கல்ல என்பதை ‘எதையும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַד בֹּקֶר
  choice: காலைவரை
  rationale: இந்தச் சொற்றொடர் கால எல்லையைக் குறிக்கிறது; ‘காலைவரை’ அதைச் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: הַנֹּתָר
  choice: மீதியாக இருப்பதை
  rationale: יתר என்பதன் நிஃபால் வினையெச்சம் எஞ்சியிருப்பதைக் குறிக்கிறது. ‘மீதியாக இருப்பதை’ என்பது அந்த எஞ்சிய பகுதியை இயல்பான தமிழில் குறிப்பிடுகிறது.
- source_word: בָּאֵשׁ
  choice: நெருப்பில்
  rationale: ב முன்னிடைச்சொல் இங்கு எரிக்கும் ஊடகத்தை அல்லது தளத்தைச் சுட்டுகிறது; தமிழில் ‘நெருப்பில் எரித்தல்’ இயல்பானதும் பொருளுக்குத் துல்லியமானதும் ஆகும்.
- source_word: תִּשְׂרֹפוּ
  choice: எரித்துவிடுங்கள்
  rationale: சட்டவழி அறிவுறுத்தலில் இந்த முற்றுப்பெறாத வினை கட்டளை வலிமை கொண்டது. ‘எரித்துவிடுங்கள்’ செயல் முழுமையாக நிறைவேற்றப்பட வேண்டும் என்பதைக் காட்டும் இயல்பான மரியாதைப் பன்மைக் கட்டளை.
theological_decisions:
- issue: பஸ்கா இறைச்சியில் மீதியானதைப் பற்றிய கட்டளையின் தன்மை
  choice: நேரடியான தடை, அதைத் தொடர்ந்து கட்டாயமான அழிப்பு அறிவுறுத்தல்
  alternative: சட்ட வலிமையற்ற நடைமுறை அறிவுறுத்தல்
  rationale: வசனம் முதலில் காலைப் பொழுதுவரை எதையும் மீதியாக வைக்கக் கூடாது என்று தடை செய்கிறது; பின்னர் மீதியானதை எரிக்க வேண்டும் என்று கட்டளையிடுகிறது. வசனத்தில் இல்லாத அடையாள அல்லது கோட்பாட்டுப் பொருளைச் சேர்க்காமல் இரு கட்டளைகளும் நேரடியாகப் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். எபிரெய உரையின் இரு இணை கட்டளைகளும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன. தேவையற்ற அடிக்குறிப்பு சேர்க்கப்படவில்லை; ஆங்கில அடிக்குறிப்பில் தரப்பட்ட மாற்றுச் சொல் தமிழில் முதன்மை உரையின் ‘மீதியாக’ என்பதிலேயே வெளிப்படுகிறது.
