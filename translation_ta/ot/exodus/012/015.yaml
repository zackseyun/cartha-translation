revisions:
- from: ஏழு நாட்கள் நீங்கள் புளிப்பில்லாத அப்பம் சாப்பிட வேண்டும். ஆனால் முதலாம் நாளிலேயே உங்கள் வீடுகளிலிருந்து புளிப்பூட்டும் மாவை அகற்றிவிட வேண்டும்[a]. ஏனெனில், முதலாம் நாள் தொடங்கி ஏழாம் நாள் வரை புளித்தது எதையாவது சாப்பிடுகிறவர் எவராயினும், அந்த நபர் இஸ்ரவேலிலிருந்து அறுத்தகற்றப்படுவார்[b].
  to: ஏழு நாட்கள் நீங்கள் புளிப்பில்லாத அப்பம் உண்ண வேண்டும். ஆனால் முதலாம் நாளில் உங்கள் வீடுகளிலிருந்து புளிப்பூட்டும் மாவை அகற்ற வேண்டும்[a]. ஏனெனில், புளிப்பூட்டப்பட்ட எதையாவது உண்ணுகிற எவரும், அந்த நபர் இஸ்ரவேலிலிருந்து அறுத்து அகற்றப்படுவார்[b], முதலாம் நாளிலிருந்து ஏழாம் நாள் வரை.
  rationale: சிறு நடையியல் மற்றும் சொற்றொடர்-ஒழுங்குத் திருத்தங்கள் செய்யப்பட்டுள்ளன. இவை மூலத்தில் இல்லாத வலியுறுத்தலைத் தவிர்க்கின்றன; புளிப்பூட்டும் முகவர் மற்றும் புளிப்பூட்டப்பட்ட பொருள் என்ற சொல் வேறுபாட்டைத் தெளிவுபடுத்துகின்றன; மேலும் ‘cut off’ என்ற சட்ட உருவகத்தையும் அதன் விளக்கப்படாத தண்டனை முறையையும் பாதுகாக்கின்றன.
