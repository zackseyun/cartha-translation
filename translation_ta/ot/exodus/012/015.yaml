  verdict: revise
  source_fidelity: மூலத்தின் கட்டளை அமைப்பும், புளிப்பூட்டும் பொருள் (שְׂאֹר) மற்றும் புளிப்பூட்டப்பட்ட உணவு (חָמֵץ) ஆகியவற்றின் வேறுபாடும் பெரும்பாலும் நன்கு காக்கப்பட்டுள்ளன. ஆனால் ‘முதலாம் நாளிலேயே’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத ‘உடனே/அன்றே’ என்ற வலியுறுத்தலைச் சேர்க்கிறது. மேலும் இறுதிக் காலத் தொடரை தண்டனைச் சட்டகத்துடன் நெருக்கமாக வைத்திருப்பது மூலச் சொற்றொடர் வரிசையையும் அதன் தொடர்பையும் சிறப்பாகக் காக்கும்.
  naturalness: ‘சாப்பிட’ என்பது புரிந்துகொள்ளத்தக்கது; ஆயினும் இவ்வகை கண்ணியமான வேதாகமக் கட்டளைநடையில் ‘உண்ண’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது. ‘அறுத்தகற்றப்படுவார்’ இணைச்சொல் சற்றே இயல்பற்றது; ‘அறுத்து அகற்றப்படுவார்’ என்பது சட்டச் சொல்லாட்சியின் உருவக வலிமையைத் தக்கவைத்துக்கொண்டு தெளிவாக உள்ளது.
  terminology: ‘புளிப்பில்லாத அப்பம்,’ ‘புளிப்பூட்டும் மாவு,’ மற்றும் ‘புளிப்பூட்டப்பட்ட எதையாவது’ ஆகியவை பொருத்தமான வேறுபாட்டைச் செய்கின்றன. כרת சட்டச் சொல்லாட்சியின் துல்லியமான தண்டனை முறை தீர்மானிக்கப்படாமல், உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்படுகிறது.
