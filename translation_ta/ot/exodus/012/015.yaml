base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: ta
  text: ஏழு நாட்கள் நீங்கள் புளிப்பில்லாத அப்பம் உண்ண வேண்டும். ஆனால் முதலாம் நாளில் உங்கள் வீடுகளிலிருந்து புளிப்பூட்டும் மாவை அகற்ற வேண்டும்[a]. ஏனெனில், புளிப்பூட்டப்பட்ட எதையாவது உண்ணுகிற எவரும், அந்த நபர் இஸ்ரவேலிலிருந்து அறுத்து அகற்றப்படுவார்[b], முதலாம் நாளிலிருந்து ஏழாம் நாள் வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இதன் நேரடிப் பொருள், ‘புளிப்பூட்டும் மாவை ஒழியச் செய்ய வேண்டும்’ என்பதாகும்; ‘அகற்ற வேண்டும்’ அல்லது ‘அழித்துவிட வேண்டும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அறுத்து அகற்றப்படுவார்’ என்பது எபிரெய சட்டச் சொல்லாட்சி. இது சமூகத்திலிருந்து விலக்கப்படுதல், மரணம், அல்லது இறைத் தீர்ப்பு ஆகியவற்றில் எதைக் குறிக்கிறது என்பதை இவ்வசனம் துல்லியமாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: புளிப்பில்லாத அப்பம்
  rationale: புளிப்பூட்டப்படாமல் செய்யப்பட்ட அப்பத்தைச் சுட்டுகிறது; பஸ்கா வழிபாட்டுச் சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אַךְ
  choice: ஆனால்
  rationale: பொதுவான ஏழுநாள் கட்டளையிலிருந்து முதலாம் நாளுக்கான குறிப்பிட்ட கட்டளைக்குச் செல்லும் வலியுறுத்தப்பட்ட மாற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: תַּשְׁבִּיתוּ
  choice: அகற்றிவிட வேண்டும்
  rationale: שׁבת என்பதன் ஹிஃபில் வடிவம் இங்கு ‘இல்லாமல் செய்யுங்கள்/ஒழியச் செய்யுங்கள்’ என்ற நடைமுறைப் பொருளைக் கொண்டது; வீடுகளிலிருந்து அதை அகற்றுவதே கட்டளையின் நோக்கம்.
- source_word: שְּׂאֹר
  choice: புளிப்பூட்டும் மாவு
  rationale: இது வெறும் நவீன உலர் ஈஸ்டை மட்டும் அல்லாமல், மாவைப் புளிக்கச் செய்யும் புளித்த மாவுக் கலவையையும் குறிக்கலாம்; எனவே இச்சொல் மூலத்தின் பரப்பை நன்றாகக் காக்கிறது.
- source_word: חָמֵץ
  choice: புளித்தது எதையாவது
  rationale: அப்பத்தை மட்டும் அல்லாமல் புளிப்பூட்டப்பட்ட எதையும் குறிக்கக்கூடிய பரந்த சொல்லாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְנִכְרְתָה
  choice: அறுத்தகற்றப்படுவார்
  rationale: כרת என்பதன் சட்ட/உடன்படிக்கைச் சொல்லாட்சியான ‘cut off’ என்பதின் வலிமையைக் காக்கிறது; தண்டனையின் துல்லியமான முறை என்ன என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: அந்த நபர்
  rationale: சட்டச் சூத்திரத்தில் נֶפֶשׁ தனிநபரைக் குறிக்கிறது; ‘ஆத்துமா’ என்று மொழிபெயர்த்து தேவையற்ற மானுடவியல் பொருளைச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து
  rationale: உடன்படிக்கைச் சமூகத்துடனான உறவிலிருந்து அகற்றப்படுதலைச் சுருக்கமாகக் காட்டுகிறது; ‘இஸ்ரவேல்’ என்பது இங்கு மக்களைக் குறிக்கிறது.
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: முதலாம் நாள் தொடங்கி ஏழாம் நாள் வரை
  rationale: தடை நடைமுறையில் இருக்கும் முழுக் காலப்பகுதியையும் தெளிவாகக் காட்டுகிறது; இயல்பான தமிழுக்காக இத்தொடர் புளித்ததைச் சாப்பிடும் செயலுக்கு முன் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: וְנִכְרְתָה என்ற தண்டனைச் சொல்லாட்சியின் பொருள்
  choice: ‘அறுத்தகற்றப்படுவார்’ என்ற முறையான சட்டச் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘சமூகத்திலிருந்து விலக்கப்படுவார்’, ‘கொல்லப்படுவார்’, அல்லது ‘இறைத் தீர்ப்பால் அகற்றப்படுவார்’
  rationale: இந்த எபிரெயச் சொல்லாட்சி உடன்படிக்கை மற்றும் நீதித்தீர்ப்பின் தீவிரத்தைக் கொண்டிருந்தாலும், அது சமூக விலக்கலா, மரணமா, இறைத் தீர்ப்பா என்பதை இவ்வசனம் குறிப்பிடவில்லை. ஆகவே அந்தத் தெளிவின்மையும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘புளிப்பூட்டும் மாவு’ மற்றும் ‘புளித்தது எதையாவது’ என்பவற்றின் வேறுபாடு காக்கப்பட்டுள்ளது. மூலத்தில் உள்ள சட்ட-இறையியல் தெளிவின்மையைத் தீர்த்துவிடாமல் ‘அறுத்தகற்றப்படுவார்’ என்பதுடன் விளக்கக் குறிப்பு வழங்கப்பட்டுள்ளது.
