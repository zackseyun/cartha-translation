  text: וַ/יִּשָּׂ֥א הָ/עָ֛ם אֶת בְּצֵק֖/וֹ טֶ֣רֶם יֶחְמָ֑ץ מִשְׁאֲרֹתָ֛/ם צְרֻרֹ֥ת בְּ/שִׂמְלֹתָ֖/ם עַל שִׁכְמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/034.yaml
  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: ta
  text: மக்கள் தங்கள் பிசைந்த மாவு புளிப்பதற்கு முன்பே அதை எடுத்துச் சென்றார்கள். மாவு பிசையும் பாத்திரங்களை[a] தங்கள் மேலாடைகளில் மூட்டையாகக் கட்டித் தோள்களில் சுமந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மாவு பிசையும் தொட்டிகளை.’ எபிரெயச் சொல் மாவைத் தயாரிக்கப் பயன்படுத்தப்பட்ட கொள்கலன்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: எடுத்துச் சென்றார்கள்
  rationale: புறப்பட்டுச் செல்லும் சூழலில் பொருளைத் தூக்கிச் சுமந்து கொண்டுபோவதை இந்த வினை குறிக்கிறது. தமிழில் ‘எடுத்துச் சென்றார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இங்கு இஸ்ரவேல் மக்களை ஒரு கூட்டமாகக் குறிக்கிறது; ‘மக்கள்’ என்பது நவீன தமிழில் நேரடியான இயல்பான சொல்.
- source_word: בְּצֵקוֹ
  choice: தங்கள் பிசைந்த மாவு
  rationale: எபிரெயச் சுட்டுப்பின்னொட்டு இலக்கணப்படி ஒருமையாக இருந்தாலும், கூட்டுப்பொருளுடைய ‘மக்கள்’ என்பதற்கு ஏற்ப தமிழில் பன்மை உடைமை வடிவம் இயல்பாகிறது. ‘பிசைந்த மாவு’ என்பது பயணத்திற்கு முன் தயாரிக்கப்பட்ட dough என்ற பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: טֶרֶם יֶחְמָץ
  choice: புளிப்பதற்கு முன்பே
  rationale: மாவு இன்னும் புளிக்காத நிலையைக் குறுகிய, இயல்பான தமிழில் தெரிவிக்கிறது. ‘முன்பே’ என்பது அவசரமாகப் புறப்பட்ட சூழலையும் மூலத்தின் טֶרֶם என்ற காலநிலையையும் காக்கிறது.
- source_word: מִשְׁאֲרֹתָם
  choice: மாவு பிசையும் பாத்திரங்கள்
  rationale: மாவைத் தயாரிக்க அல்லது பிசையப் பயன்படுத்திய கொள்கலன்களைச் சொல் குறிக்கிறது. அவற்றின் துல்லியமான வடிவம் உறுதியில்லை என்பதால் பொதுவான ‘பாத்திரங்கள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, ‘தொட்டிகள்’ அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
- source_word: צְרֻרֹת
  choice: மூட்டையாகக் கட்டி
  rationale: பயணத்திற்காகப் பொருட்களைச் சுற்றிக் கட்டி உறுதிப்படுத்திய காட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּשִׂמְלֹתָם
  choice: தங்கள் மேலாடைகளில்
  rationale: שִׂמְלָה என்பது பொதுவாக உடலின் மேல் அணியும் வெளிப்புற ஆடையைக் குறிக்கிறது. ‘மேலாடைகள்’ என்பது ‘ஆடைகள்’ என்பதைக் காட்டிலும் குறிப்பானதும் ‘மேலங்கிகள்’ என்பதைக் காட்டிலும் பரந்ததும் ஆகும்.
- source_word: עַל שִׁכְמָם
  choice: தோள்களில் சுமந்தார்கள்
  rationale: கட்டப்பட்ட பாத்திரங்கள் மக்களின் தோள்கள்மேல் எடுத்துச் செல்லப்பட்டதைத் தெளிவாகக் கூறுகிறது; கூட்டுப்பொருளுக்கு ஏற்ப தமிழில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
