translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய கூட்டொருமை தமிழில் இயல்பான பன்மையாக மாற்றப்பட்டுள்ளது. இரண்டு வாக்கியங்களாக அமைத்தது மூலத்தில் அடுக்கப்பட்டுள்ள செயற்பாடுகளைத் தெளிவாக வாசிக்க உதவுகிறது; பொருள் வரிசை காக்கப்பட்டுள்ளது.
