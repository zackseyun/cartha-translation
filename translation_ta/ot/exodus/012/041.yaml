base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: ta
  text: நானூற்று முப்பது ஆண்டுகள் முடிந்தபோது, அந்த நாளிலேயே யாவேயின் அணிகள் அனைத்தும்[a] எகிப்து நாட்டிலிருந்து புறப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் படைகள் அனைத்தும்.” எபிரெயச் சொல் ஒழுங்குபடுத்தப்பட்ட அணிகளையோ படைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: முடிந்தபோது
  rationale: ஒரு காலப்பகுதி நிறைவடைந்த தருணத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: நானூற்று முப்பது ஆண்டுகள்
  rationale: எபிரெய எண்ணின் பொருள் மொத்தம் 430 ஆண்டுகள்; தமிழின் இயல்பான எண் வரிசையில் தரப்பட்டுள்ளது.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: அந்த நாளிலேயே
  rationale: குறிப்பிட்ட அதே நாளில் நிகழ்ந்தது என்ற எபிரெய மரபுத்தொடரின் அழுத்தத்தையும் கதைசொல்லும் நோக்குநிலையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: יָצְאוּ
  choice: புறப்பட்டன
  rationale: எகிப்திலிருந்து வெளியேறியதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כָּל צִבְאוֹת
  choice: அணிகள் அனைத்தும்
  rationale: צָבָא என்பதன் ஒழுங்குபடுத்தப்பட்ட குழுக்கள் அல்லது படைகள் என்ற பொருள் அகலத்தைப் பாதுகாத்து, இங்கு இஸ்ரவேலரைப் போரிடும் படையாக மட்டும் வரையறுப்பதைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய வேதப்பெயரான יהוה என்பதைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: אֶרֶץ என்ற ‘நாடு’ கூறை வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒலிபெயர்த்து வழங்குகிறது.
- issue: צִבְאוֹת יְהוָה என்பதன் நுட்பம்
  choice: யாவேயின் அணிகள்
  alternative: யாவேயின் படைகள்
  rationale: ஒழுங்குபடுத்தப்பட்ட மக்கள் அணிகள் என்ற பொருளையும் படை சார்ந்த நிழற்பொருளையும் திறந்தவாறு வைத்திருந்து, அவர்கள் இவ்வசனத்தில் போர்ப்படையாகச் செயல்பட்டனர் என்று மிகைப்படுத்தாது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. தொடக்க וַיְהִי தனி ‘அப்போது நிகழ்ந்தது’ என்ற சொற்றொடராகக் கட்டாயப்படுத்தப்படாமல், ‘முடிந்தபோது’ என்ற காலவாக்கியத்தில் இயல்பாக உட்பொதிக்கப்பட்டுள்ளது; இரண்டாம் וַיְהִי-யின் வலியுறுத்தல் ‘அந்த நாளிலேயே’ என்பதில் தக்கவைக்கப்பட்டுள்ளது.
