source:
  edition: WLC
  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: ta
  text: ஏனெனில், இந்த இரவில் நான் எகிப்து நாட்டினூடே செல்வேன்[a]. எகிப்து நாட்டிலுள்ள ஒவ்வொரு தலைப்பேற்றையும்—மனிதர் முதல் கால்நடைகள் வரை[b]—அடிப்பேன்; எகிப்தின் எல்லா தெய்வங்களுக்கும் எதிராகத் தீர்ப்புகளை நிறைவேற்றுவேன். நானே யாவே[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் நாட்டினூடே செல்வேன்.’ இங்குள்ள வினைச்சொல் எகிப்து நாட்டினூடே செல்வதைக் குறிக்கிறது; அழிவிலிருந்து ஒருவரை விட்டுவிடும் பொருளில் ‘கடந்துபோவது’ அல்ல.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘மனிதரிலிருந்து கால்நடை வரை.’
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் YHWH (יהוה); மரபாக ‘கர்த்தர்’ என்றும், மாற்றாக ‘யெகோவா’ என்றும் வழங்கப்படுகிறது. அதன் பண்டைய உச்சரிப்பு உறுதியாகத் தெரியவில்லை; இங்கு ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: நான் ... கடந்து செல்வேன்
  rationale: עבר என்பதுடன் בְאֶרֶץ வருவதால், நாட்டினூடே செல்வதைக் குறிக்கிறது; வீடுகளை அழிவிலிருந்து ‘கடந்துபோய் விட்டுவிடுதல்’ என்ற பஸ்கா கருத்தை இங்கே கலக்கவில்லை.
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டை / எகிப்து நாட்டிலுள்ள
  rationale: ‘நாடு’ என்ற புவியியல் கூறைத் தக்கவைத்து, செயல் நடைபெறும் பரப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: இந்த இரவில்
  rationale: சுட்டுப்பெயரின் வலியுறுத்தலைக் காத்து, இயல்பான நவீனத் தமிழில் காலத்தைக் குறிப்பிடுகிறது.
- source_word: וְהִכֵּיתִי
  choice: அடிப்பேன்
  rationale: נכה என்பதன் நேரடியான தாக்குதல் பொருளைக் காக்கிறது; சூழலில் மரணம் விளைவதை உணர்த்தினாலும், ‘கொன்றுபோடுவேன்’ என்று உரையைவிட வெளிப்படையாக விளக்கவில்லை.
- source_word: כָּל בְּכוֹר
  choice: முதற்பேறான அனைத்தையும்
  rationale: ஒருமைத் தொகுப்புச் சொல்லின் பரப்பைத் தக்கவைக்கிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘ஆண்’ என்பதைச் சேர்க்கவில்லை; மனிதரையும் கால்நடைகளையும் உள்ளடக்குவதால் உயிரற்ற பொருளைக் குறிக்காதவாறு தொடர்ச்சிச் சொற்றொடர் தெளிவுபடுத்துகிறது.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: மனிதர் தொடங்கி கால்நடைகள் வரை
  rationale: மனித உயிர்களிலிருந்து வீட்டுவளர்ப்பு விலங்குகள் வரையிலான முழு வீச்சைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: எகிப்தின் எல்லா தெய்வங்களுக்கும் எதிராக
  rationale: செயல் எகிப்தின் தெய்வங்களை நோக்கிய பகைமையான நீதிச் செயலாக இருப்பதைத் தெளிவாகக் காட்டுகிறது; ‘சிலைகள்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: தீர்ப்புகளை நிறைவேற்றுவேன்
  rationale: நீதித்துறை சார்ந்த שְׁפָטִים என்பதன் வலிமையைத் தக்கவைத்து, நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: אֲנִי יְהוָה
  choice: நானே யாவே
  rationale: உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, אֲנִי என்பதன் வலியுறுத்தலை ‘நானே’ என்று வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וְעָבַרְתִּי என்பது அழிவிலிருந்து விட்டுவிடுவதைக் குறிக்கிறதா, நாட்டினூடே செல்வதைக் குறிக்கிறதா?
  choice: எகிப்து நாட்டைக் கடந்து செல்வேன்
  alternative: எகிப்தைத் தாண்டிச் செல்வேன் / விட்டுவிட்டுச் செல்வேன்
  rationale: இங்கு בְאֶרֶץ உடன் வரும் עבר, நாட்டினூடே நகர்வதைக் குறிக்கிறது. இஸ்ரவேலரின் வீடுகள் காக்கப்படுவது குறித்த பின்னைய, வேறுபட்ட சொற்பயன்பாட்டை இவ்வாக்கியத்தில் முன்கூட்டியே புகுத்தவில்லை.
- issue: אֱלֹהֵי מִצְרַיִם என்பவற்றின் நிலை
  choice: எகிப்தின் எல்லா தெய்வங்கள்
  alternative: எகிப்தின் எல்லா சிலைகள் / ஆட்சியாளர்கள்
  rationale: மூலமொழி நேரடியாக ‘எகிப்தின் தெய்வங்கள்’ என்கிறது. அவை சிலைகள் அல்லது மனித ஆட்சியாளர்கள் மட்டுமே என்று விளக்கி, உரையின் இறையியல் பதற்றத்தை நீக்கவில்லை.
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: நான்கு எபிரெய மெய்யெழுத்துகளைக் கொண்ட தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்படும் ‘யாவே’ என்ற ஒலிப்பை முதன்மை உரையில் பயன்படுத்துகிறது; உச்சரிப்பின் வரலாற்றுச் சிக்கலை அடிக்குறிப்பு சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘அடிப்பேன்’ என்பது மூலத்தின் செயலை நேரடியாக வைத்திருக்கிறது; சூழல் உணர்த்தும் மரணத்தை மொழிபெயர்ப்பிலேயே கூடுதலாகச் சேர்க்கவில்லை. ‘தெய்வங்கள்’ என்ற சொல்லைத் தக்கவைத்து, அவற்றை ‘சிலைகள்’ என மறுவிளக்கம் செய்யவில்லை.
