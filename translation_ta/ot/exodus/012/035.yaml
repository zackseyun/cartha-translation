base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் மோசேயின் வார்த்தையின்படி செய்தார்கள்; அவர்கள் எகிப்தியர்களிடம் வெள்ளிப் பொருட்களையும் தங்கப் பொருட்களையும் ஆடைகளையும் கேட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேண்டிக் கேட்டார்கள்.” இங்குள்ள எபிரெய வினைச்சொல் பொதுவாக “கேட்டார்கள்” அல்லது “வேண்டிக் கேட்டார்கள்” என்று பொருள்படும்; அது தானாகவே “கடன் வாங்கினார்கள்” என்று பொருள்படுவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது ஒட்டுமொத்த இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் இருக்க ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עָשׂוּ
  choice: செய்தார்கள்
  rationale: כִּדְבַר என்பதுடன் சேர்ந்து ‘சொல்லின்படி செய்தார்கள்’ என்ற எளிய வினைப்பொருளைத் தருகிறது; கூடுதல் விளக்கம் புகுத்தப்படவில்லை.
- source_word: כִּדְבַר מֹשֶׁה
  choice: மோசேயின் வார்த்தையின்படி
  rationale: דָּבָר என்பதிலுள்ள ‘வார்த்தை/காரியம்/அறிவுறுத்தல்’ என்ற பொருள் பரப்பை முற்றிலும் ‘கட்டளை’ என்று குறுக்காமல், மூலத்தின் பெயர்ச்சொல் வடிவைப் பாதுகாக்கிறது.
- source_word: וַיִּשְׁאֲלוּ
  choice: கேட்டார்கள்
  rationale: שאל என்பதன் அடிப்படைப் பொருள் ‘கேள், வேண்டிக் கேள்’ என்பதாகும். ‘கடன் வாங்கினார்கள்’ அல்லது ‘கொள்ளையிட்டார்கள்’ என்ற கருத்துகளை இந்த வினைச்சொல்லுக்குள் புகுத்தாமல் இருக்கிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்தியர்களிடம்
  rationale: வடிவ ரீதியாக ‘எகிப்திலிருந்து’ என்றாலும், சூழலில் பொருட்கள் கேட்கப்பட்டவர்கள் எகிப்திய மக்கள். தமிழில் நபர்களிடமிருந்து ஒன்றைக் கேட்பதை இயல்பாகச் சொல்ல ‘எகிப்தியர்களிடம்’ பயன்படுத்தப்பட்டது.
- source_word: כְּלֵי כֶסֶף
  choice: வெள்ளிப் பொருட்கள்
  rationale: כְּלִי என்பது பாத்திரங்கள், கருவிகள், பொருட்கள் ஆகியவற்றைக் குறிக்கக்கூடிய பரந்த சொல்; ‘பொருட்கள்’ தேவையற்ற குறுக்கீட்டைத் தவிர்க்கிறது.
- source_word: וּכְלֵי זָהָב
  choice: தங்கப் பொருட்கள்
  rationale: כְּלִי என்பதன் பரந்த பொருளைப் பாதுகாத்து, முந்தைய சொற்றொடருடன் ஒரே மாதிரியான நடையைப் பேணுகிறது.
- source_word: וּשְׂמָלֹת
  choice: ஆடைகள்
  rationale: שִׂמְלָה பொதுவாக உடைகள் அல்லது ஆடைகளைக் குறிக்கிறது; ‘ஆடைகள்’ நவீனத் தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
theological_decisions:
- issue: விடுதலைப் பயணத்தின் கொள்ளைப் பொருள் சூழலில் וַיִּשְׁאֲלוּ என்பதற்கு அளிக்கப்படும் பொருள்
  choice: கேட்டார்கள்
  alternative: கடன் வாங்கினார்கள்; வேண்டிக் கேட்டார்கள்; கொள்ளையிட்டார்கள்
  rationale: இந்த வினைச்சொல் தானாகவே கடன் வாங்குதல் அல்லது கொள்ளையிடுதல் என்பதைக் கூறவில்லை. சுற்றியுள்ள கதை நிகழ்வின் முடிவை இந்தச் சொல்லுக்குள் முன்கூட்டியே புகுத்தாமல், அதன் அடிப்படைப் பொருள் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொல்லுக்குச் சொல் வடிவத்திற்குப் பதிலாக, அதன் கூட்டுப்பொருளை இயல்பாக வெளிப்படுத்த ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டது. அடிக்குறிப்பு குறி அது விளக்கும் ‘கேட்டார்கள்’ என்பதற்குப் பின் வைக்கப்பட்டது.
