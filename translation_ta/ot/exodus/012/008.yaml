  text: They shall eat the meat that night[a], roasted over the fire[b]; with unleavened bread and bitter herbs they shall eat it.
translation:
  language: ta
  text: இந்த இரவில்[a] அவர்கள் இறைச்சியை நெருப்பில் வாட்டி[b], புளிப்பில்லாத அப்பத்துடனும் கசப்பான கீரைகளுடனும் அதைச் சாப்பிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்று மொழிபெயர்ப்பு: “அந்த இரவில்.” எபிரெயத்தில் சொல்லுக்கு சொல் “இந்த இரவில்”; இங்கு பஸ்கா உணவுக்காகக் குறிப்பிட்ட இரவு குறிக்கப்படுகிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “நெருப்பில் வாட்டப்பட்டது” அல்லது “நெருப்பால் வாட்டப்பட்டது.” வேறு முறையில் சமைக்காமல் நெருப்பில் வாட்ட வேண்டும் என்பது வலியுறுத்தப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: சாப்பிட வேண்டும்
  rationale: சடங்கு குறித்த கட்டளைச் சூழலில் இந்த வினை எதிர்காலச் செயலை மட்டும் அல்லாமல் கடமையையும் தெரிவிக்கிறது; நவீன தமிழில் ‘வேண்டும்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַבָּשָׂר
  choice: அந்த இறைச்சியை
  rationale: உணவுச் சூழலில் בָּשָׂר என்பதற்கு ‘இறைச்சி’ என்பது இயல்பான நவீனத் தமிழ் இணை; சுட்டுப்பொருளைக் காட்ட ‘அந்த’ சேர்க்கப்பட்டுள்ளது.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: அந்த இரவில்
  rationale: குறிப்பிட்ட பஸ்கா இரவைச் சுட்டும் காலத்தொடராக தமிழில் இயல்பாக உள்ளது; எபிரெயில் உள்ள சுட்டுத்தன்மையைத் தக்கவைக்கிறது.
- source_word: צְלִי אֵשׁ
  choice: நெருப்பில் சுட்டு
  rationale: நெருப்பைப் பயன்படுத்திச் சுடும் சமையல் முறையைத் தெளிவாகக் காட்டுகிறது; அடுத்த வசனத்தில் வரும் வேகவைத்தலிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: וּמַצּוֹת
  choice: புளிப்பில்லாத அப்பத்துடனும்
  rationale: מַצּוֹת என்பது புளிக்கவைக்கப்படாத அப்பத்தைக் குறிக்கிறது; உடனுண்ணப்படுவதைத் தமிழில் ‘உடனும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל מְרֹרִים
  choice: கசப்பான கீரைகளுடனும்
  rationale: இங்கு עַל உடன் உண்பதைக் குறிக்கிறது; מְרֹרִים பஸ்கா உணவில் உண்ணப்படும் கசப்பான தாவர உணவுகளைச் சுட்டுவதால் ‘கசப்பான கீரைகள்’ சூழலுக்கு ஏற்றது.
- source_word: יֹאכְלֻהוּ
  choice: சாப்பிட வேண்டும்
  rationale: இறுதியில் மீண்டும் வரும் வினை முழு உணவு முறையையும் கட்டளையாக நிறைவு செய்கிறது. தமிழில் ஒரே வாக்கியத்தின் இறுதியில் வினையை வைப்பது இயல்பாக இருப்பதால் அதன் கட்டளை வலிமை காக்கப்படுகிறது.
