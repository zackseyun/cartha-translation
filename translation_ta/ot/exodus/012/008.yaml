translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயக் கட்டளையின் வலிமை ‘சாப்பிட வேண்டும்’ என்பதால் வெளிப்படுத்தப்பட்டுள்ளது; தமிழ் வாக்கிய அமைப்புக்கேற்ப இறுதி வினையின் மறுபதிப்பு தனியாகச் செய்யப்படவில்லை.
