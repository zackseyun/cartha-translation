source:
  edition: WLC
  text: וַ/יָּ֨קָם פַּרְעֹ֜ה לַ֗יְלָה ה֤וּא וְ/כָל עֲבָדָי/ו֙ וְ/כָל מִצְרַ֔יִם וַ/תְּהִ֛י צְעָקָ֥ה גְדֹלָ֖ה בְּ/מִצְרָ֑יִם כִּֽי אֵ֣ין בַּ֔יִת אֲשֶׁ֥ר אֵֽין שָׁ֖ם מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: ta
  text: அந்த இரவில் பார்வோனும், அவனுடைய பணியாளர்கள் அனைவரும், எகிப்தியர் அனைவரும்[b] எழுந்தார்கள். எகிப்தில் பெரும் கூக்குரல் உண்டாயிற்று; ஏனெனில், இறந்த ஒருவர் இல்லாத வீடு ஒன்றுகூட இருக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லாக: “இறந்த ஒருவர் இல்லாத வீடு ஒன்றும் இருக்கவில்லை.”'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “எகிப்து முழுவதும்” என்று இடப்பெயர் எகிப்து மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்தார்கள்
  rationale: קום என்ற வினையின் எளிய இறந்தகாலத் தொடர் செயலை இயல்பான தமிழில் தருகிறது. எபிரெயத்தில் ஒருமை வினை முதன்மையான பார்வோனோடு பொருந்தினாலும், தொடரில் வரும் அனைவரையும் உள்ளடக்கத் தமிழில் பன்மை இயல்பானது.
- source_word: לַיְלָה הוּא
  choice: இரவில்
  rationale: இரவு நேரத்தைத் தெளிவாகவும் எபிரெயச் சொல்லமைப்புக்கு நெருக்கமாகவும் குறிக்கிறது; ‘அந்த இரவில்’ என்பதும் சாத்தியம்.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: அரசவைக் சூழலில் Pharaoh-வுக்குச் சேவை புரிபவர்களைக் குறிக்கிறது; அடிமை நிலையை தேவையின்றி முன்னிறுத்தாமல் עֶבֶד என்பதன் சூழல்சார் பொருளைத் தருகிறது.
- source_word: וְכָל מִצְרַיִם
  choice: எகிப்தியர் அனைவரும்
  rationale: எபிரெயம் இடப்பெயரை மக்களுக்கான ஆகுபெயராகப் பயன்படுத்துகிறது. நவீன தமிழில் மக்களையே வெளிப்படையாகக் கூறுவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: צְעָקָה גְדֹלָה
  choice: பெரும் கதறல்
  rationale: צְעָקָה குறிக்கும் துயரமிகு கூக்குரலை ‘கதறல்’ இயல்பாக வெளிப்படுத்துகிறது; גְדֹלָה என்பதன் தீவிரத்தை ‘பெரும்’ காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பெரும் கதறலுக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: சாவு நேராத வீடு ஒன்றுகூட இருக்கவில்லை
  rationale: இருமுறை வரும் אֵין உருவாக்கும் வலியுறுத்தலை இயல்பான தமிழில் ‘ஒன்றுகூட ... இல்லை’ எனக் காக்கிறது. בַּיִת என்பதற்காக ‘வீடு’ தக்கவைக்கப்படுகிறது; מֵת குறிக்கும் மரணம் நிகழ்ந்த நிலை ‘சாவு நேராத’ என இயல்பாக வெளிப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பெரும் கதறல்’ துயரத்தின் தீவிரத்தைப் பாதுகாக்கிறது. ஆங்கில ஆலோசனை உரையிலுள்ள அடிக்குறிப்பு குறிகள் உள்ளடக்கத்துடன் பொருந்தும்படி பிரதான உரையில் சேர்க்கப்பட்டுள்ளன.
