revisions:
- from: அது இந்த மாதத்தின் பதினான்காம் நாள்வரை உங்களுடைய பாதுகாப்பில் இருக்கட்டும். பின்னர் இஸ்ரவேல் சபையாகிய ஒட்டுமொத்தக் கூட்டத்தாரும் மாலைப்பொழுதுகளுக்கு இடையில்[a] அதை அறுக்க வேண்டும்.
  to: அதை இந்த மாதத்தின் பதினான்காம் நாள்வரை உங்களிடம் வைத்திருக்க வேண்டும். பின்னர் இஸ்ரவேல் சபையின் முழுக் கூட்டமும் இரு மாலைகளுக்கு இடையில்[a] அதை அறுக்க வேண்டும்.
