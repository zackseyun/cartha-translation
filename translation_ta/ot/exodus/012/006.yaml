base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: ta
  text: அதை இந்த மாதத்தின் பதினான்காம் நாள்வரை உங்களிடம் வைத்திருக்க வேண்டும். பின்னர் இஸ்ரவேல் சபையின் முழுக் கூட்டமும் இரு மாலைகளுக்கு இடையில்[a] அதை அறுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இரு மாலைகளுக்கு இடையில்.” இந்த மரபுத்தொடர் பொதுவாகச் சூரியன் மறையும் நேரத்தை ஒட்டிய அந்திப்பொழுதைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: அது உங்களுடைய பாதுகாப்பில் இருக்கட்டும்
  rationale: לְמִשְׁמֶרֶת என்பது காவல் அல்லது பாதுகாப்பில் வைத்திருப்பதைக் குறிக்கிறது. கட்டளைத் தொடரில் வரும் וְהָיָה-வின் செயல்பாட்டையும் இயல்பான நவீனத் தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: இந்த மாதத்தின் பதினான்காம் நாள்வரை
  rationale: எபிரெய தேதிக் குறிப்பைத் தெளிவான, இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: அதை அறுக்க வேண்டும்
  rationale: שׁחט என்பது விலங்கை அறுப்பதைச் சிறப்பாகக் குறிக்கிறது; பொதுவான ‘கொல்லுதல்’ என்பதைவிட ‘அறுத்தல்’ மூலச்சொல்லின் பொருளுக்கு நெருக்கமானது.
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: இஸ்ரவேல் சபையாகிய ஒட்டுமொத்தக் கூட்டத்தாரும்
  rationale: קהל மற்றும் עדה ஆகிய இரு கூட்டுப்பெயர்களின் அடுக்கையும், இஸ்ரவேல் முழுவதின் கூட்டு பங்கேற்பையும் அளவுக்கு மீறிய சொற்சுமையின்றிப் பாதுகாக்கிறது.
- source_word: בֵּין הָעַרְבָּיִם
  choice: மாலைப்பொழுதுகளுக்கு இடையில்
  rationale: விவாதத்துக்குரிய எபிரெய மரபுத்தொடரைத் தெளிவாக்கி ஒரே நேரப்பொருளாக முடிவுசெய்யாமல், அதன் நேரடி உருவகத்தை முதன்மை உரையில் பாதுகாக்கிறது.
theological_decisions:
- issue: அறுக்கும் கட்டளையின் கூட்டு எழுவாய்
  choice: இஸ்ரவேல் சபையாகிய ஒட்டுமொத்தக் கூட்டத்தாரும் அதை அறுக்க வேண்டும்
  alternative: ஒவ்வொரு குடும்பமும் தன் ஆட்டுக்குட்டியை அறுக்க வேண்டும்
  rationale: எபிரெய உரை இஸ்ரவேல் முழுவதையும் ஒரு கூட்டு எழுவாயாகக் குறிப்பிடுகிறது. நடைமுறையில் குடும்பங்கள் செயல்பட்டிருக்கலாம் என்ற சுற்றுச்சூழலை மொழிபெயர்ப்புக்குள் சேர்த்து, மூலத்தின் கூட்டு வலியுறுத்தலைத் தீர்த்துவிடவில்லை.
- issue: בֵּין הָעַרְבָּיִם என்பதன் நேரக் குறிப்பு
  choice: மாலைப்பொழுதுகளுக்கு இடையில்
  alternative: அந்திப்பொழுதில்
  rationale: இந்த எபிரெயச் சொற்றொடரின் துல்லியமான நேர வரம்பு விவாதத்துக்குரியது. ஆகவே இயல்பாக்கப்பட்ட ஒரே விளக்கத்தைத் தேர்ந்தெடுக்காமல், மூலத்தின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சபையாகிய ஒட்டுமொத்தக் கூட்டத்தார்’ என்பது மூலத்திலுள்ள இரட்டை கூட்டுச் சொல்லின் வலியுறுத்தலைப் பாதுகாக்கிறது; ‘மாலைப்பொழுதுகளுக்கு இடையில்’ என்பது நேரக் குறிப்பிலுள்ள உண்மையான தெளிவின்மையை நிலைநிறுத்துகிறது.
