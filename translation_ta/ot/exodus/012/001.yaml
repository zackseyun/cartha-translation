  yaml_path: translation/ot/exodus/012/001.yaml
  text: The LORD said to Moses and to Aaron in the land of Egypt, saying,
translation:
  language: ta
  text: 'எகிப்து நாட்டில் மோசேயிடமும் ஆரோனிடமும் யெகோவா கூறினார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: கூறியது
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; தனியாக ‘அப்போது’ போன்ற காலச் சொல்லைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்பதால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: இருவரிடமும் உரை நேரடியாகச் சொல்லப்பட்டது என்பதைத் தமிழில் இயல்பாகவும், இரண்டாவது אֶל-ன் மீளுரைப்பையும் இணை அமைப்பால் உணர்த்தும் வகையிலும் தருகிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டில்
  rationale: நிகழ்வு நடைபெற்ற இடத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது:'
  rationale: எபிரெய மொழியின் மேற்கோள் அறிமுக வடிவத்தை தமிழில் சொற்படியாக ‘சொல்லி’ என்று மீண்டும் கூறாமல், அடுத்த உரையை அறிமுகப்படுத்தும் முக்காற்புள்ளியால் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேவனுடைய நான்கெழுத்துத் தனிப்பெயர் יהוה
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூல மொழியில் பொதுப்பட்டம் அல்ல, தனிப்பெயர் இருப்பதால் அந்த வேறுபாட்டைப் பாதுகாக்கிறது; குறிப்பிட்ட சமயப் பிரிவின் தனித்துவக் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகருக்கு எளிதான கதைநடை. வசனம் அடுத்துவரும் நேரடி உரைக்கு அறிமுகமாக இருப்பதால் இறுதியில் முக்காற்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
