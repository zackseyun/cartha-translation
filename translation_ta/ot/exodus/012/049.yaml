  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: ta
  text: உள்நாட்டவருக்கும் உங்களிடையே குடியிருக்கும் அந்நியருக்கும் ஒரே சட்டம் இருக்க வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உள்நாட்டவருக்கும் உங்களிடையே வசிக்கும் பிறநாட்டவருக்கும் ஒரே போதனை இருக்க வேண்டும்.”
    reason: תּוֹרָה என்பதற்கு ‘போதனை’ என்ற சொற்பொருள் மாற்றையும், גֵּר என்பதற்கு சமூகத்தின் நடுவில் வசிக்கும் ‘பிறநாட்டவர்’ என்ற மாற்றையும் தருகிறது.
lexical_decisions:
- source_word: תּוֹרָה
  choice: சட்டம்
  rationale: பஸ்கா அனுசரிப்பைப் பற்றிய இந்தச் சட்டச் சூழலில், இச்சொல் பொதுவான போதனையைவிடக் கட்டுப்படுத்தும் விதிமுறையைக் குறிக்கிறது.
- source_word: אַחַת
  choice: ஒரே
  rationale: இரு தரப்பினருக்கும் பொதுவான ஒற்றைச் சட்டத் தரநிலையை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה
  choice: இருக்க வேண்டும்
  rationale: எபிரெய வினையின் சட்டப்பூர்வமான கட்டளையுணர்வைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: אֶזְרָח
  choice: உள்நாட்டவர்
  rationale: பிற்கால அரசியல் குடியுரிமைக் கருத்தை இறக்குமதி செய்யாமல், சமூகத்தின் பூர்வீக உறுப்பினரைக் குறிக்கிறது.
- source_word: גֵּר
  choice: அந்நியர்
  rationale: இஸ்ரவேல் சமூகத்தின் நடுவில் வசிக்கும் பிறநாட்டவரைக் குறிக்கிறது; தொடர்ந்து வரும் ‘குடியிருக்கும்’ என்ற சொல் அவரது குடியிருப்பு நிலையைத் தெளிவாக்குகிறது.
- source_word: הַגָּר
  choice: குடியிருக்கும்
  rationale: גֵּר என்பவர் தற்காலிகமாக வருபவர் மட்டுமல்ல, சமூகத்தின் நடுவில் வசிப்பவர் என்பதைக் காட்டுகிறது.
- source_word: בְּתוֹכְכֶם
  choice: உங்களிடையே
  rationale: சமூகத்தின் மத்தியில் வாழ்வதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
