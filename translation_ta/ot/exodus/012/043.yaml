    issue: The divine name יהוה is rendered “யெகோவா.”
    rationale: The source-side translation decision specifically preserves the Tetragrammaton as “Yahweh,” rather than using “Jehovah.” Tamil “யாவே” is the corresponding transliteration and maintains that decision.
