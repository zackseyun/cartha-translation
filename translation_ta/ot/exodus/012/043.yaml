language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן זֹ֖את חֻקַּ֣ת הַ/פָּ֑סַח כָּל בֶּן נֵכָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: ta
  text: 'யாவே மோசேயிடமும் ஆரோனிடமும் கூறினார்: “பஸ்காவுக்கான நியமம் இதுதான்: எந்த அந்நியரும்[a] அதிலிருந்து சாப்பிடக் கூடாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அந்நியத்தின் மகன்.” இது ஓர் அந்நியரைக், அதாவது உடன்படிக்கைச் சமூகத்துக்கு வெளியிலுள்ள ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: וַיֹּאמֶר
  choice: கூறினார்
  rationale: எளிய கதைநடை வினையான אמר-ஐ இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: חֻקַּת
  choice: நியமம்
  rationale: நிலையாக விதிக்கப்பட்ட சட்ட ஒழுங்கைக் குறிக்கும் எபிரெயச் சொல்லின் சட்டத் தொனியை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: הַפָּסַח
  choice: பஸ்கா
  rationale: இந்தச் சூழலில் பலியையும் அதனுடன் தொடர்புடைய உணவையும் உள்ளடக்கக்கூடிய விழாப்பெயரின் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: בֶּן נֵכָר
  choice: அந்நியன்
  rationale: சொல்லுக்குச் சொல் ‘அந்நியத்தின் மகன்’ என்ற எபிரெய மரபுத்தொடர், சமூகத்துக்கு வெளியிலுள்ள அந்நிய நபரைக் குறிக்கிறது; ‘அந்நியன்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: לֹא יֹאכַל בּוֹ
  choice: அதிலிருந்து சாப்பிடக் கூடாது
  rationale: சட்டத் தடையைத் தெளிவாகக் காட்டுவதோடு, אכל உடன் வரும் בּוֹ என்பதின் ‘அதிலிருந்து/அதில் பங்குபெற்று’ என்ற கருத்தையும் காக்கிறது.
theological_decisions:
- issue: பஸ்கா உணவில் பங்குபெறத் தடுக்கப்படுபவரின் அடையாளம்
  choice: அந்நியன்
  alternative: விருத்தசேதனம் செய்யப்படாத அந்நியன்; உடன்படிக்கைச் சமூகத்துக்கு வெளியிலுள்ளவர்
  rationale: இந்த வசனத்தின் எபிரெய வாசகம் בֶּן נֵכָר என்று மட்டுமே கூறுகிறது. அடுத்தடுத்த வசனங்கள் உடன்படிக்கை எல்லைகளை மேலும் விளக்கினாலும், அவற்றை இவ்வசனத்தின் முதன்மை உரைக்குள் சேர்க்காமல் அதன் இயல்பான பரப்பை காக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான கதைநடையும் முறையான சட்டத் தொனியும் பயன்படுத்தப்பட்டுள்ளன. ‘பஸ்கா’, ‘நியமம்’ ஆகியவை சபைச் சூழலுக்கு மட்டும் கட்டுப்படாத வகையில் புரிந்துகொள்ளத்தக்க சொற்களாக உள்ளன; அடிக்குறி குறியீடு தடை வாக்கியத்தின் முடிவில் இடப்பட்டுள்ளது.
