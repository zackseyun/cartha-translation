base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: ta
  text: இந்த நாள் உங்களுக்கு ஒரு நினைவுநாளாக இருக்கும். அதை நீங்கள் யாவேக்குப் பண்டிகையாகக் கொண்டாட வேண்டும்; தலைமுறைதோறும் அதை நிலையான நியமமாகக் கொண்டாட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்றென்றைக்குமான நியமமாக” அல்லது “தொடர்ந்து நிலைக்கும் நியமமாக.” חֻקַּת עוֹלָם என்ற எபிரெயத் தொடர் நீடித்து நடைமுறையில் இருக்கும் ஒரு நியமத்தைப் பல இடங்களில் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: இருக்கும்
  rationale: சட்டவழிகாட்டல் சூழலில் எதிர்காலப் பொருளைத் தரும் எபிரெய வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இந்த நாள்
  rationale: எபிரெயச் சுட்டுத்தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்; மூலத்தில் இல்லாத கூடுதல் அழுத்தத்தைச் சேர்க்கவில்லை.
- source_word: לָכֶם
  choice: உங்களுக்கு
  rationale: இந்த நாள் இஸ்ரவேலருக்குரிய நினைவுநாளாக அமையும் உறவையும் பயனையும் தெளிவாகக் காட்டுகிறது.
- source_word: לְזִכָּרוֹן
  choice: ஒரு நினைவுநாளாக
  rationale: זִכָּרוֹן என்பதன் நினைவுகூரச் செய்யும் வழிபாட்டு நோக்கத்தை சாதாரண வாசகருக்குத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְחַגֹּתֶם ... חַג
  choice: பண்டிகையாகக் கொண்டாட வேண்டும்
  rationale: חגג என்ற வினைச்சொல்லையும் חַג என்ற பெயர்ச்சொல்லையும் இயல்பான தமிழில் தொடர்புடைய கருத்துகளாக வைத்திருக்கிறது; கட்டளையின் வலிமையையும் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்குப்
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது; לְ முன்னொட்டின் நோக்குநிலையை நான்காம் வேற்றுமை உருபால் காட்டுகிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகள் முழுவதிலும் தொடரும் கடைப்பிடிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: חֻקַּת עוֹלָם
  choice: நிலையான நியமமாக
  rationale: חֻקָּה என்பதன் சட்டப்பூர்வமான விதிமுறைப் பொருளையும் עוֹלָם என்பதன் நீடித்த, தொடரும் வலிமையையும் காக்கிறது; முடிவற்ற காலம் என்ற தத்துவக் கருத்தை தேவையின்றி திணிக்கவில்லை.
- source_word: תְּחָגֻּהוּ
  choice: அதைக் ... கொண்டாட வேண்டும்
  rationale: முன்னர் வந்த חגג வினையின் மறுபயன்பாட்டைக் காத்து, கடைப்பிடிக்க வேண்டிய கட்டளையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பொதுவான பட்டப்பெயராக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பால் தருவது மூலத்தின் தனித்தன்மையைக் காக்கிறது.
- issue: חֻקַּת עוֹלָם என்பதன் கால வலிமை
  choice: நிலையான நியமம்
  alternative: என்றென்றைக்குமான நியமம்; தொடர்ந்து நிலைக்கும் நியமம்
  rationale: இந்தச் சட்ட மொழி தலைமுறைதோறும் நீடிக்கும் கடைப்பிடிப்பைக் குறிக்கிறது. ‘நிலையான’ என்பது அதன் வலிமையைக் காக்கிறது; அதேவேளையில் עוֹלָם என்பதன் காலவரம்பைப் பற்றிய உண்மையான மொழியியல் நெகிழ்வை அழிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு மற்றும் சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனத்தின் இரு கட்டளைகளும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
