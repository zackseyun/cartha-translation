  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] அனைவரும் யாவே[b] மோசேக்கும் ஆரோனுக்கும் கட்டளையிட்டபடியே செய்தார்கள்; அப்படியே செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்” அல்லது “இஸ்ரவேலின் பிள்ளைகள்.” எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் YHWH; மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: செய்தார்கள்
  rationale: עשה என்பது ‘செய்/உருவாக்கு’ என்று பொருள்படும்; இங்கு கட்டளைக்குக் கீழ்ப்படிந்து நடந்ததைக் குறிப்பதால் ‘செய்தார்கள்’ இயல்பானது. வசன முடிவிலுள்ள அதே வினைச்சொல்லின் மீளுரைப்பையும் இது காக்கிறது.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள் அனைவரும்
  rationale: כָּל முழுக் குழுவையும் குறிக்கிறது; בְּנֵי יִשְׂרָאֵל என்பதன் குடும்பவழி வடிவமான ‘இஸ்ரவேலின் மகன்கள்’ முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: כַּאֲשֶׁר இங்கு கட்டளையோடு முழுமையான ஒத்திசைவைச் சுட்டுகிறது. தமிழில் ‘-படியே’ என்பது ஒப்புமையையும் வலியுறுத்தலையும் இயல்பாகத் தருகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: முன்னரே கொடுக்கப்பட்ட கட்டளையைச் சுட்டும் நிறைவுற்ற செயல். தமிழில் தொடர்பெயர் வடிவம் காலவரிசையைச் சூழலிலேயே தெளிவாகக் காட்டுகிறது; தேவையற்ற ‘முன்பே’ சேர்க்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், பரவலான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: மோசேக்கும் ஆரோனுக்கும்
  rationale: எபிரெய நேர்செயப்படுபொருள் குறிகள் மோசேயும் ஆரோனும் கட்டளை பெற்றவர்கள் என்பதைக் காட்டுகின்றன. ‘மூலம்’ என்று மொழிபெயர்த்து நடுவர் கருத்தைச் சேர்க்காமல், தமிழின் இயல்பான ‘-க்கு’ வேற்றுமை பயன்படுத்தப்படுகிறது.
- source_word: כֵּן עָשׂוּ
  choice: அப்படியே செய்தார்கள்
  rationale: கட்டளைக்கும் செயலுக்கும் இருந்த துல்லிய ஒற்றுமையை כֵּן மீண்டும் வலியுறுத்துகிறது. ‘அப்படியே’ அந்த வலியுறுத்தலையும் עשה வினையின் மீளுரைப்பையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் தனிப்பெயரான நான்கு மெய்யெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற இன-குடும்பச் சொல்லாக்கம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: எபிரெயம் இலக்கண ரீதியாக ஆண்பால் பன்மையையும் குடும்பவழி அடையாளத்தையும் கொண்டுள்ளது. அதனால் முதன்மை உரையில் முறையான வடிவம் காக்கப்பட்டு, இயல்பான கூட்டுப்பெயர் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் தொடக்க மற்றும் முடிவு வினைச்சொல் மீளுரை தமிழிலும் பாதுகாக்கப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற முறையான சொற்றொடரால் மூலத்தின் குடும்பவழி வடிவம் காக்கப்பட்டாலும், வழக்கமான தமிழ் மாற்றுகள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளன.
