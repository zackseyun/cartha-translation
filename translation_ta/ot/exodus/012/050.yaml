  source_fidelity: 'மூல எபிரெயத்தின் வாக்கிய அமைப்பும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: ‘இஸ்ரவேலின் மகன்கள் அனைவரும்,’ யாவே மோசேக்கும் ஆரோனுக்கும் கட்டளையிட்டபடி செயல்பட்டனர்; இறுதியிலுள்ள כֵּן עָשׂוּ என்பதன் வலியுறுத்தும் மீளுரையும் ‘அப்படியே செய்தார்கள்’ எனத் தக்கவைக்கப்பட்டுள்ளது. மோசேயும் ஆரோனும் கட்டளை பெற்றவர்களாகவே மொழிபெயர்க்கப்பட்டுள்ளனர்; ‘மூலம்’ என்று தேவையற்ற நடுவர் பொருள் சேர்க்கப்படவில்லை.'
