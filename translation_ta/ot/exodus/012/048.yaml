base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: ta
  text: உன்னோடு குடியிருக்கும் அந்நியன்[a] யாவேக்காக[b] பஸ்காவைக் கடைப்பிடிக்க வேண்டுமானால்[c], அவனுக்குச் சேர்ந்த ஒவ்வோர் ஆணும் விருத்தசேதனம் செய்யப்பட வேண்டும். அதன்பின், அதை அனுசரிப்பதற்காக அவன் நெருங்கி வரலாம்; அப்போது அவன் நாட்டில் பிறந்தவனைப் போல இருப்பான். ஆனால் விருத்தசேதனம் செய்யப்படாத எவரும் அதிலிருந்து உண்ணக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குடியிருக்கும் அந்நியன்’ (גֵּר) என்பது இஸ்ரவேலரிடையே வாழும் பூர்வகுடியல்லாத ஒருவரைக் குறிக்கிறது; வெறும் வழிப்போக்கன் அல்ல.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவே’ என்பது எபிரெய மொழியிலுள்ள יהוה (YHWH) என்ற இறைப்பெயரின் ஒலிபெயர்ப்பு.
    reason: alternative_reading
  - marker: c
    text: சொல்லர்த்தமாக, ‘பஸ்காவைச் செய்ய வேண்டுமானால்’; இங்கு அது பஸ்கா அனுசரிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: குடியிருக்கும் அந்நியன்
  rationale: இச்சொல் வழிப்போக்கனை அல்ல, இஸ்ரவேலரிடையே வாழும் பூர்வகுடியல்லாத ஒருவரைக் குறிக்கிறது. ‘குடியிருக்கும் அந்நியன்’ அதன் சமூகச் சட்டப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: יָגוּר אִתְּךָ
  choice: உன்னோடு குடியிருக்கும்
  rationale: גור என்பது அந்நியராக ஒரு சமூகத்தினரிடையே தங்கி வாழ்வதைக் குறிக்கிறது; தமிழில் நீடித்த குடியிருப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְעָשָׂה פֶסַח
  choice: பஸ்காவைக் கடைப்பிடிக்க வேண்டுமானால்
  rationale: சொல்லர்த்தமாக ‘பஸ்காவைச் செய்தல்’ என்றாலும், சடங்கு அனுசரிப்பைத் தமிழில் ‘கடைப்பிடித்தல்’ என்பது இயல்பாகக் குறிக்கிறது. நிபந்தனைச் சூழலில் அடுத்து வரும் முன்தேவைக்கு முந்திய எதிர்நோக்கிய செயலை ‘வேண்டுமானால்’ வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: உரையில் உள்ள יהוה என்ற இறைப்பெயரைப் பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, ל முன்னிடைச்சொல்லை ‘-க்கு’ என வழங்குகிறது.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: அவனைச் சேர்ந்த ஆண்கள் அனைவருக்கும் விருத்தசேதனம் செய்யப்பட வேண்டும்
  rationale: அவனுடைய குடும்பம் அல்லது குழுவைச் சேர்ந்த ஒவ்வோர் ஆணுக்கும் விதிக்கப்படும் கட்டாயத் தேவையைப் passive வடிவில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְאָז יִקְרַב לַעֲשֹׂתוֹ
  choice: அதன்பின் அவன் அதை அனுசரிக்க நெருங்கி வரலாம்
  rationale: קרב என்பதன் நெருங்கிவருதல் என்ற மொழிப்படத்தையும், முன்தேவை நிறைவேறியபின் கிடைக்கும் பங்கேற்புத் தகுதியையும் ‘வரலாம்’ பாதுகாக்கிறது.
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: நாட்டில் பிறந்தவனைப் போல
  rationale: אֶזְרָח என்பது நாட்டின் பூர்வகுடி அல்லது அங்கே பிறந்த உறுப்பினரைக் குறிக்கிறது; சட்டச் சமூக ஒப்பீட்டைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: עָרֵל
  choice: விருத்தசேதனம் செய்யப்படாத எவனும்
  rationale: எபிரெய ஆண்பால் ஒருமை வடிவையும் சூழலிலுள்ள பொதுவான தடையையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא יֹאכַל בּוֹ
  choice: அதிலிருந்து உண்ணக் கூடாது
  rationale: בּוֹ என்பதன் பங்கெடுத்து உண்ணும் பொருளையும், மறுப்புடன் வரும் தடை அல்லது தகுதியின்மையையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: குடியிருக்கும் அந்நியனின் பஸ்கா பங்கேற்புத் தகுதி
  choice: அவனைச் சேர்ந்த ஆண்கள் அனைவருக்கும் விருத்தசேதனம் செய்யப்பட்டபின் அவன் பங்கேற்கலாம்; அப்போது நாட்டில் பிறந்தவனைப் போலக் கருதப்படுகிறான்
  alternative: இதை முழுமையான இனவிலக்காகவோ எல்லா உடன்படிக்கை அடையாளங்களையும் நீக்குவதாகவோ விரிவுபடுத்துதல்
  rationale: உரை நிபந்தனைக்குட்பட்ட உட்சேர்ப்பையும் நிலவிய உடன்படிக்கை எல்லையையும் ஒன்றாக வைத்திருக்கிறது; பிற்கால இறையியல் முடிவுகளை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: יִקְרַב என்பதில் அனுமதியும் அணுகுதலும்
  choice: நெருங்கி வரலாம்
  alternative: வெறுமனே வருவான்
  rationale: சொல்லின் அணுகுதல் என்ற நேர்பொருளையும், விருத்தசேதனத்திற்குப் பின் கிடைக்கும் அனுமதியையும் ஒருங்கே பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான நேரடி நடையைப் பயன்படுத்துகிறது. ‘பஸ்கா’, ‘விருத்தசேதனம்’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன; அரிதான பழந்தமிழ் வடிவங்களும் சமயப்பிரிவு சார்ந்த விளக்கங்களும் தவிர்க்கப்பட்டுள்ளன.
