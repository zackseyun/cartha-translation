  source_fidelity: 'வரைவின் மையப் பொருள் எபிரெய மூலத்துடன் ஒத்துள்ளது: ஒரே வீட்டில் உண்ணுதல், இறைச்சியை வீட்டுக்கு வெளியே எடுத்துச் செல்லத் தடை, பலியின் எந்த எலும்பையும் முறிக்கத் தடை ஆகியவை காக்கப்பட்டுள்ளன. இறுதிப் பதிலிடுபெயரான בוֹ-வின் திறந்த சுட்டுப்பொருளும் ‘அதன்’ என்பதில் பொருத்தமாகத் தங்குகிறது.'
  naturalness: ‘அதன் எலும்பு எதையும்’ என்பது நவீனத் தமிழில் இயல்பற்ற அமைப்பு; ‘அதன் எந்த எலும்பையும்’ என்பது தெளிவான, இயல்பான மறுப்புக் கட்டளை வடிவம். ‘வீட்டிலிருந்து வெளியே’ என்பதற்கு ‘வீட்டுக்கு வெளியே’ என மாற்றுவது இலக்கைச் சுட்டும் தமிழில் அதிகச் சீரானது.
  terminology: ‘வீடு,’ ‘இறைச்சி,’ ‘எலும்பு’ ஆகிய சொற்கள் பொருத்தமானவை. அடிக்குறிப்பு בַּיִת என்பதன் வீடு/வீட்டார் என்ற சொற்பொருள் இருமையைச் சரியாகக் காக்கிறது; ‘வீட்டார்’ என்பது இச்சூழலில் ‘குடும்பத்தினர்’ என்பதைவிட மூலத்தின் பரப்பை நன்றாகத் தக்கவைக்கிறது.
