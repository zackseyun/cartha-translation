source:
  edition: WLC
  text: בְּ/בַ֤יִת אֶחָד֙ יֵאָכֵ֔ל לֹא תוֹצִ֧יא מִן הַ/בַּ֛יִת מִן הַ/בָּשָׂ֖ר ח֑וּצָ/ה וְ/עֶ֖צֶם לֹ֥א תִשְׁבְּרוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: ta
  text: ஒரே வீட்டில் அது உண்ணப்பட வேண்டும்; அந்த இறைச்சியில் எதையும் வீட்டுக்கு வெளியே எடுத்துச் செல்லக் கூடாது[a]; அதன் எந்த எலும்பையும் முறிக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே வீட்டாரிடையே.” எபிரெயச் சொல் கட்டிடமாகிய வீட்டையோ அங்கே கூடியிருக்கும் வீட்டாரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: ஒரே வீட்டில்
  rationale: בַּיִת என்பது ‘வீடு’ அல்லது ‘வீட்டார்’ என இரு பொருள்களையும் தரக்கூடும். தொடர்ந்து இறைச்சியை வீட்டுக்கு வெளியே எடுத்துச் செல்லக் கூடாது என்று கூறப்படுவதால், இங்கு இடத்தைக் குறிக்கும் ‘வீடு’ முதன்மையான பொருளாகத் தெரிகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יֵאָכֵל
  choice: உண்ணப்பட வேண்டும்
  rationale: Niphal வடிவத்தின் செயப்பாட்டு அமைப்பையும், பஸ்கா பலியைப் பற்றிய கட்டளையின் வலிமையையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: לֹא תוֹצִיא ... חוּצָה
  choice: வெளியே எடுத்துச் செல்லக் கூடாது
  rationale: Hiphil வடிவம் ‘வெளியே போகச் செய்/வெளியே கொண்டுபோ’ என்பதைக் குறிக்கிறது; חוּצָה இலக்காகிய வெளியிடத்தைத் தெளிவுபடுத்துகிறது.
- source_word: מִן הַבָּשָׂר
  choice: அந்த இறைச்சியில் எதையும்
  rationale: உணவுச் சூழலில் בָּשָׂר என்பதற்கு ‘இறைச்சி’ இயல்பான இணை. பகுதியைக் குறிக்கும் מִן, அதில் எந்தப் பகுதியையும் வெளியே கொண்டுபோகக் கூடாது என்ற பொருளைத் தருகிறது.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: அதன் எலும்பு எதையும் முறிக்கக் கூடாது
  rationale: ஒருமையான עֶצֶם இங்கு பகிர்வுப் பொருளில், எந்த எலும்பையும் குறிக்கிறது. בוֹ முந்தைய சூழலில் உள்ள பஸ்கா பலியையே சுட்டுவதால் ‘அதன்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறுதி בוֹ என்ற பதிலிடுபெயரின் சுட்டுப்பொருள்
  choice: பஸ்கா பலி முழுவதையும் சுட்டும் ‘அதன்’
  alternative: குறிப்பாக ‘ஆட்டுக்குட்டியின்’
  rationale: எபிரெயப் பதிலிடுபெயர் ஆண்பால் ஒருமையாக இருந்து உரையாடலில் உள்ள பஸ்கா பலியைச் சுட்டுகிறது. வசனத்தில் இல்லாத குறிப்பிட்ட பெயர்ச்சொல்லைச் சேர்க்காமல் ‘அதன்’ என்பது சுட்டுப்பொருளைத் திறந்தவாறே காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. செயப்பாட்டு வடிவமும் தடை விதிக்கும் வலிமையும் காக்கப்பட்டுள்ளன; ‘வீடு/வீட்டார்’ என்ற உண்மையான சொற்பொருள் இருமை அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
