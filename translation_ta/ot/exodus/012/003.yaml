translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பம்’ மூலத்தின் சமூக அமைப்பைக் காக்கிறது; ‘ஆட்டுக்குட்டி’ என்பதிலுள்ள உண்மையான இனத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
