base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: ta
  text: '“இஸ்ரவேல் சபையினர் அனைவரிடமும் பேசிச் சொல்லுங்கள்: ‘இந்த மாதத்தின் பத்தாம் நாளில் ஒவ்வொருவரும் தமது தந்தைவழிக் குடும்பத்தின்படி ஓர் ஆட்டுக்குட்டியை[a] எடுத்துக்கொள்ள வேண்டும்; ஒவ்வொரு குடும்பத்திற்கும் ஓர் ஆட்டுக்குட்டி.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் செம்மறியாட்டுக் குட்டியையோ வெள்ளாட்டுக் குட்டியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ אֶל ... לֵאמֹר
  choice: … அனைவரிடமும் பேசிச் சொல்லுங்கள்
  rationale: பன்மை கட்டளையையும், தொடர்ந்து வரும் மேற்கோள் அறிமுகத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: இஸ்ரவேல் சபையார் அனைவரும்
  rationale: עֵדָה என்பது உடன்படிக்கைச் சமூகமாகத் திரண்ட மக்களைக் குறிக்கிறது; ‘சபையார்’ அதன் கூட்டுத்தன்மையையும் கண்ணியமான நடையையும் காக்கிறது.
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: இந்த மாதத்தின் பத்தாம் நாளில்
  rationale: எபிரெயில் உள்ள ‘இந்த மாதத்தின் பத்தாம் தேதியில்’ என்ற காலக் குறிப்பைத் தமிழில் தெளிவாக வழங்க ‘நாளில்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְיִקְחוּ לָהֶם אִישׁ
  choice: ஒவ்வொருவரும் … எடுத்துக்கொள்ள வேண்டும்
  rationale: சட்ட அறிவுறுத்தலுக்குரிய கட்டளை வலிமையையும் אִישׁ என்பதன் பகிர்ந்தளிக்கும் பொருளையும் இயல்பாகக் காட்டுகிறது.
- source_word: שֶׂה
  choice: ஆட்டுக்குட்டி
  rationale: இச்சொல் செம்மறியாடு அல்லது வெள்ளாட்டின் இளம் குட்டியைக் குறிக்கலாம். தமிழ் ‘ஆட்டுக்குட்டி’ மூலச்சொல்லின் இந்த விரிவை ஓரளவு காக்கிறது; துல்லியமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְבֵית אָבֹת
  choice: தமது தந்தைவழிக் குடும்பத்துக்கு ஏற்ப
  rationale: இந்தச் சொற்றொடர் தந்தைவழி அமைந்த குடும்ப அல்லது குல அலகைக் குறிக்கிறது; பொதுவான ‘குடும்பம்’ என்பதைவிட இத்தேர்வு அதன் சமூக அமைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: שֶׂה לַבָּיִת
  choice: ஒவ்வொரு வீட்டுக்கும் ஓர் ஆட்டுக்குட்டி
  rationale: בַּיִת இங்கு கட்டிடத்தை மட்டும் அல்லாமல் ஒரே வீட்டைச் சேர்ந்த குடும்பத்தாரைக் குறிக்கிறது. தமிழில் ‘வீட்டுக்கும்’ என்பது அந்தக் குடும்ப அலகை இயல்பாக உணர்த்துகிறது.
