  text: וַ/יֵּלְכ֥וּ וַ/יַּֽעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் மகன்கள்[a] போய் அவ்வாறே செய்தார்கள்; யாவே மோசேக்கும் ஆரோனுக்கும் கட்டளையிட்டபடியே, அவர்கள் அப்படியே செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான வழக்கில், “இஸ்ரவேலர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: போய்
  rationale: הלך என்ற வினையின் தொடர்கதை வடிவம் அடுத்த நிகழ்வை முன்னெடுக்கிறது. கட்டளைகளை நிறைவேற்றச் சென்றதைச் சூழல் உணர்த்தினாலும், மூல வினையை விரிவுபடுத்தாமல் ‘போய்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּעֲשׂוּ
  choice: அவ்வாறே செய்தார்கள்
  rationale: עשה இங்கு முன்பு கொடுக்கப்பட்ட பஸ்கா கட்டளைகளைக் குறிப்பதால், திரும்பச் சுட்டும் பொருளையும் கீழ்ப்படிதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான குடும்ப உறவுச் சொல்லையும் ஆண்பால் பன்மையையும் முதன்மை உரையில் காக்கிறது; இயல்பான இனப்பெயரான ‘இஸ்ரவேலர்கள்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כַּאֲשֶׁר
  choice: கட்டளையிட்டபடியே
  rationale: கட்டளைக்கும் செயலுக்கும் உள்ள துல்லிய ஒத்திசைவை ‘-படியே’ தெளிவாகக் காட்டுகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: கட்டளை இஸ்ரவேலரின் செயலுக்கு முன்பு வழங்கப்பட்டது என்பது தமிழ் வாக்கிய வரிசையிலேயே தெளிவாகிறது; தனியான இறந்தகால முன்னிலை வடிவம் தேவையில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், நான்கெழுத்துத் தெய்வீகப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: மோசேக்கும் ஆரோனுக்கும்
  rationale: אֶת மோசேயையும் ஆரோனையும் கட்டளை பெற்றவர்களாகக் குறிக்கிறது. தமிழ் வழக்கில் ‘கட்டளையிடு’ என்பதுடன் கொடைவேற்றுமை இயல்பானது; ‘மூலம்’ என்று சேர்த்து மூலத் தொடரமைப்பை மாற்றவில்லை.
- source_word: כֵּן עָשׂוּ
  choice: அவர்கள் செய்தார்கள்
  rationale: முன்னுள்ள ‘கட்டளையிட்டபடியே’ என்பதுடன் சேர்ந்து, முடிவிலுள்ள மீளுரையைத் தக்கவைத்து அவர்களின் முழுமையான கீழ்ப்படிதலை வலியுறுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா
  rationale: இவ்வசனம் நான்கெழுத்துத் தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் தனிப்பட்ட உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்
  rationale: மூலத்தின் ஆண்பால் குடும்ப உறவுச் சொல்லை முதன்மை உரையில் காக்கிறது; இது இங்கு இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் இயல்பான மாற்று வடிவம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை மதிப்புறுதியான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் தொடர்ச்சியான ‘போய்—செய்தார்கள்’ அமைப்பும், இறுதியில் கீழ்ப்படிதலை மீண்டும் வலியுறுத்தும் அமைப்பும் இயன்றவரை காக்கப்பட்டுள்ளன.
