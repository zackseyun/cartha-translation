  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: ta
  text: குடியிருக்கும் அந்நியனோ கூலித் தொழிலாளியோ அதிலிருந்து உண்ணக்கூடாது.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குடியிருக்கும் அந்நியன்’ என்பதற்கு ‘தற்காலிகக் குடியிருப்பாளர்’ அல்லது ‘சுற்றித்திரிபவர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, பஸ்கா உணவிலிருந்து; இன்னும் குறுகிய பொருளில், பஸ்கா பலிமிருகத்திலிருந்து.
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: அங்கே குடியிருக்கும் அந்நியன்
  rationale: இச்சொல் இஸ்ரவேலரிடையே வசித்தாலும் உடன்படிக்கைச் சமூகத்தில் முழுமையாக இணைக்கப்படாத பிறநாட்டவரைக் குறிக்கிறது. ‘அங்கே குடியிருக்கும் அந்நியன்’ என்பது குடியிருப்பையும் வெளிப்புறத்தவர் என்ற நிலையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׂכִיר
  choice: கூலித் தொழிலாளி
  rationale: கூலிக்காக வேலை செய்பவரைக் குறிக்கிறது; இது தெளிவான, இன்றைய தமிழ்ச் சொற்பயன்பாடு.
- source_word: לֹא יֹאכַל
  choice: சாப்பிடக் கூடாது
  rationale: மறுப்புடன் வரும் imperfect இச்சட்டச் சூழலில் தடையைக் குறிக்கிறது. ‘சாப்பிடக் கூடாது’ என்பது தமிழில் அதன் கட்டளையியல் வலிமையை இயல்பாகத் தருகிறது.
- source_word: בּוֹ
  choice: அதிலிருந்து
  rationale: אכל என்பதுடன் வரும் ב இங்கு பங்கெடுத்து உண்பதைக் குறிக்கும் பகுதியியல் பொருளுடையது. ‘அதிலிருந்து’ என்பது பஸ்கா உணவு அல்லது பலியிடப்பட்ட மிருகத்திலிருந்து உண்பதைச் சுருக்கமாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘அது’ என்பதன் பஸ்காச் சூழலிலான குறிப்பு
  choice: உடனடிச் சூழலில் நிறுவப்பட்ட பஸ்கா உணவு அல்லது பஸ்கா மிருகத்தைக் குறிக்கும் மறைமுகச் சுட்டாகவே வைத்தல்
  alternative: பஸ்கா ஆட்டுக்குட்டியை மட்டும் வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: எபிரெய உரை சுட்டுப்பெயரை மட்டும் பயன்படுத்துகிறது. பிரதான உரையில் அந்தச் சுருக்கத்தையும் பரப்பையும் காத்து, அடிக்குறிப்பில் அதன் சூழல்சார் குறிப்பை விளக்குவது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. சட்டத் தடையின் வலிமைக்காக ‘கூடாது’ தேர்ந்தெடுக்கப்பட்டுள்ளது; மூலத்தின் சுருக்கமான சுட்டுப்பெயர் அடிக்குறிப்புடன் காக்கப்பட்டுள்ளது.
