source:
  edition: WLC
  text: וּ/בַ/יּ֤וֹם הָ/רִאשׁוֹן֙ מִקְרָא קֹ֔דֶשׁ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלָאכָה֙ לֹא יֵעָשֶׂ֣ה בָ/הֶ֔ם אַ֚ךְ אֲשֶׁ֣ר יֵאָכֵ֣ל לְ/כָל נֶ֔פֶשׁ ה֥וּא לְ/בַדּ֖/וֹ יֵעָשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: ta
  text: முதல் நாளில் உங்களுக்குப் பரிசுத்தக் கூட்டம்[a] இருக்க வேண்டும்; ஏழாம் நாளிலும் பரிசுத்தக் கூட்டம் இருக்க வேண்டும். அந்த நாட்களில் எந்த வேலையும் செய்யப்படக் கூடாது. ஆனால் ஒவ்வொருவரும் உண்பதற்குத் தேவையானதை மட்டும் உங்களுக்காக ஆயத்தம் செய்யலாம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பரிசுத்தமான கூட்டம்’ என்றும், பாரம்பரியமாக ‘பரிசுத்தச் சபைக்கூட்டம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லடக்கில், “ஒவ்வொரு நபரும் உண்பது எதுவோ, அது மட்டும் உங்களுக்காகச் செய்யப்படலாம்.” இங்கு எபிரெயச் சொல் נֶפֶשׁ, நவீன பொருளில் ‘ஆத்துமா’ என்பதைச் சிறப்பாகக் குறிக்காமல், ஒரு நபரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: பரிசுத்தக் கூடுகை
  rationale: இந்த எபிரெயச் சொற்றொடர் அழைத்துக் கூட்டப்பட்ட, பரிசுத்தமாக ஒதுக்கப்பட்ட ஒன்றுகூடலைக் குறிக்கிறது. ‘பரிசுத்தக் கூடுகை’ என்பது நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: יִהְיֶה לָכֶם
  choice: உங்களுக்கு ... இருக்க வேண்டும்
  rationale: היה என்பதன் இருப்பைக் குறிக்கும் பொருளையும் לָכֶם என்பதன் ‘உங்களுக்கு’ என்ற தொடர்பையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: அந்த நாட்களில் எந்த வேலையும் செய்யப்படக் கூடாது
  rationale: כָּל உடன் வரும் மறுப்பு ‘எந்த வேலையும் இல்லை’ என்ற முழுமையான தடையைத் தருகிறது; எபிரெயச் செயலப்பாட்டு வடிவமும் தமிழில் காக்கப்படுகிறது. בָהֶם முன்னர் கூறிய இரு நாட்களைக் குறிக்கிறது.
- source_word: אַךְ
  choice: ஆனால் ... மட்டும்
  rationale: இங்கு אַךְ பொதுத் தடைக்குள் ஒரே விதிவிலக்கை அறிமுகப்படுத்துகிறது; தமிழில் ‘ஆனால் ... மட்டும்’ அந்த வரம்பைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: ஒவ்வொருவரும் உண்பதற்குத் தேவையானதை
  rationale: נֶפֶשׁ இச்சட்டச் சூழலில் ‘ஆத்துமா’ என்ற நவீன கருத்தைக் காட்டாமல் ஒவ்வொரு நபரையும் குறிக்கிறது. உணவுக்குத் தேவையான ஆயத்தமே விதிவிலக்கு என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הוּא לְבַדּוֹ
  choice: அதை மட்டும்
  rationale: சுட்டுப்பெயரும் לְבַדּוֹவும் சேர்ந்து விதிவிலக்கின் தனிப்பட்ட, வரையறுக்கப்பட்ட தன்மையை வலியுறுத்துகின்றன.
- source_word: יֵעָשֶׂה לָכֶם
  choice: உங்களுக்காக ஆயத்தம் செய்யலாம்
  rationale: சொல்லடக்கில் ‘உங்களுக்காகச் செய்யப்படலாம்’ என்றாலும், சூழல் உணவு ஆயத்தத்தைக் குறிக்கிறது. ‘ஆயத்தம் செய்யலாம்’ அனுமதிக்கப்பட்ட செயலை இயல்பாகத் தெரிவிக்கிறது; לָכֶם என்பதற்கு ‘உங்களுக்காக’ தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: வேலைத் தடையின் வரம்பு
  choice: ‘எந்த வேலையும்’ என்ற பொதுவான மொழியைத் தக்கவைத்து, உணவுக்கான ஒரே விதிவிலக்கை மட்டும் கூறுதல்
  alternative: ‘தொழில் சார்ந்த வேலை’ அல்லது குறிப்பிட்ட சில வேலைகள் என்று வரையறுத்தல்
  rationale: מְלָאכָה இங்கு விரிவான சட்டச் சொல்லாக உள்ளது; மூலத்தில் இல்லாத சமய அல்லது பிரிவுசார் வரையறையைச் சேர்க்காமல் அதன் பதற்றத்தையும் பரப்பையும் தக்கவைக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் கண்ணியமான சட்டநடை. ‘பரிசுத்தம்’, ‘கூடுகை’, ‘ஆயத்தம்’ போன்ற பரவலாக அறியப்படும் வேதாகமத் தமிழ்ச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; பழமையான வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன.
