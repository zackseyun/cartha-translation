translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதும் கண்ணியமானதுமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் காரணத் தொடர் பாதுகாக்கப்பட்டுள்ளது; நீண்ட எபிரெய வாக்கியத்தை தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரித்துள்ளோம்.
