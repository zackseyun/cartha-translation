id: EXO.12.39
reference: Exodus 12:39
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: ta
  text: அவர்கள் எகிப்திலிருந்து கொண்டுவந்த மாவைப் புளிப்பில்லாத அப்பங்களாகச் சுட்டார்கள்; அது புளித்திருக்கவில்லை. ஏனெனில் அவர்கள் எகிப்திலிருந்து துரத்தப்பட்டதால் தாமதிக்க முடியவில்லை; மேலும், தங்களுக்காகப் பயண உணவுப் பொருட்களையும் ஆயத்தம் செய்திருக்கவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: அவர்கள் ... சுட்டார்கள்
  rationale: கதைநடையின் தொடர்ச்சியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; தனி வசனமாக இருப்பதால் தொடக்க இணைப்புச்சொல் தேவையில்லை.
- source_word: הַבָּצֵק
  choice: மாவு
  rationale: בצק என்பது பிசைந்த மாவைக் குறிக்கிறது; சூழலில் ‘மாவு’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עֻגֹת מַצּוֹת
  choice: புளிப்பில்லாத அப்பங்கள்
  rationale: עֻגֹת என்பது அப்பம் அல்லது வட்ட வடிவிலான அப்பத்துண்டுகளையும், מַצּוֹת என்பது புளிப்பில்லாத தன்மையையும் குறிக்கிறது. தமிழில் ‘அப்பங்கள்’ உணவுவகையைத் தெளிவுபடுத்துகிறது.
- source_word: כִּי לֹא חָמֵץ
  choice: அந்த மாவு புளித்திருக்கவில்லை
  rationale: חָמֵץ இங்கு மாவு புளித்த நிலையை அடையாததை வினைச்சொல் வடிவில் கூறுகிறது; ‘புளித்திருக்கவில்லை’ அந்த நிறைவுறாத நிலையைப் பாதுகாக்கிறது.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: அவர்கள் எகிப்திலிருந்து துரத்தப்பட்டதால்
  rationale: גֹרְשׁוּ வலுக்கட்டாயமாக வெளியேற்றப்பட்டதை உணர்த்தும் செயப்பாட்டு வடிவம்; ‘துரத்தப்பட்டதால்’ அதைப் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: தாமதிக்க முடியவில்லை
  rationale: התמהמה என்பது தாமதித்தல் அல்லது காலந்தாழ்த்துதலைக் குறிக்கிறது; இச்சூழலில் நேரமின்மையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: צֵדָה
  choice: பயண உணவு
  rationale: צֵדָה பயணத்திற்காக எடுத்துச் செல்லும் உணவு அல்லது தேவையான பொருள்களைக் குறிக்கிறது; இச்சூழலில் ‘பயண உணவு’ சாதாரண வாசகருக்கு உடனடியாகப் புரிகிறது.
- source_word: לָהֶם
  choice: தங்களுக்கான
  rationale: பயண உணவு அவர்களுடைய சொந்தத் தேவைக்காக ஆயத்தப்படுத்தப்பட வேண்டியிருந்ததைத் தெளிவுபடுத்துகிறது.
