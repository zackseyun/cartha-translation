revisions:
- from: அவர்கள் எகிப்திலிருந்து கொண்டுவந்த மாவைப் புளிப்பில்லாத அப்பங்களாகச் சுட்டார்கள். அந்த மாவு புளித்திருக்கவில்லை; ஏனெனில், அவர்கள் எகிப்திலிருந்து துரத்தப்பட்டதால் தாமதிக்க முடியவில்லை. தங்களுக்கான பயண உணவையும் அவர்கள் ஆயத்தம் செய்திருக்கவில்லை.
