  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: ta
  text: பின்பு மோசே இஸ்ரவேலின் மூப்பர்கள் அனைவரையும் அழைத்து, அவர்களிடம், “உங்கள் குடும்பங்களுக்கு ஏற்றபடி மந்தை விலங்குகளைப் பிரித்து எடுத்துக்கொள்ளுங்கள்[b][c]; பஸ்கா விலங்கை அறுங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, ‘பஸ்கா’; இங்கு அது பஸ்காப் பலியையோ பலியிடப்படும் விலங்கையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பிரித்து’ என்பதற்கான எபிரெய வினை சொற்படியாக ‘இழுத்து’ அல்லது ‘மந்தையிலிருந்து பிரித்து’ என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘மந்தை விலங்குகள்’ என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் செம்மறியாடுகள், வெள்ளாடுகள் ஆகிய சிறு மந்தைக் கால்நடைகளை உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: இச்சூழலில் மூப்பர்களை அறிவுறுத்துவதற்காக வரவழைப்பதைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள்
  rationale: மக்களின் அங்கீகரிக்கப்பட்ட தலைவர்கள் அல்லது பிரதிநிதிகளைக் குறிக்கும் வழக்கமான, தெளிவான மொழிபெயர்ப்பு.
- source_word: מִשְׁכוּ
  choice: தேர்ந்தெடுத்து
  rationale: அடிப்படைப் பொருள் ‘இழுங்கள்’ என்றாலும், இங்கு மந்தையிலிருந்து பலிக்கான விலங்கைப் பிரித்தெடுப்பதே சூழல்சார் பொருள். நேரடியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּקְחוּ
  choice: எடுத்துக்கொள்ளுங்கள்
  rationale: לקח என்பதன் நேரடியான பொருளைத் தருகிறது; முந்தைய கட்டளையுடன் இணைந்த இரண்டாவது செயலைத் தனியே காக்கிறது.
- source_word: לָכֶם
  choice: உங்கள் ...க்காக
  rationale: தங்களுக்கென எடுத்துக்கொள்ளும் பயனுறு/தன்னிலை நுணுக்கத்தை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צֹאן
  choice: மந்தையிலிருந்து கால்நடைகளை
  rationale: צֹאן என்பது செம்மறியாடுகள் அல்லது வெள்ளாடுகள் உள்ளிட்ட சிறு மந்தைக் கால்நடைகளைச் சுட்டலாம்; ‘ஆட்டுக்குட்டிகள்’ என்று குறுக்காமல் அதன் பரப்பை காக்கிறது.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: உங்கள் குடும்பங்களுக்காக
  rationale: குடும்பம் அல்லது குலக் குழுவின் அடிப்படையில் விலங்கை எடுப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְשַׁחֲטוּ
  choice: வெட்டுங்கள்
  rationale: பலிக்கான விலங்கைக் கொன்று அறுப்பதைக் குறிக்கும் வினை; ‘கொல்லுங்கள்’ என்பதைக் காட்டிலும் சடங்குச் சூழலைத் துல்லியமாக உணர்த்துகிறது.
- source_word: הַפָּסַח
  choice: பஸ்காப் பலியை
  rationale: எபிரெயத்தில் சொற்படியாக ‘பஸ்கா’; இங்கு ஆகுபெயராகப் பலியிடப்படும் விலங்கைக் குறிக்கிறது. ‘பலியாடு’ எனக் குறுக்காமல், செம்மறியாடு அல்லது வெள்ளாடு என்ற சூழல்சார் பரப்பைக் காக்கிறது.
theological_decisions:
- issue: הַפָּסַח என்பதன் குறிப்பு
  choice: பஸ்காப் பலி
  alternative: பஸ்கா; பஸ்கா ஆட்டுக்குட்டி
  rationale: இங்கு ‘பஸ்கா’ என்பது பலியிடப்படும் விலங்கைக் குறிக்கும் ஆகுபெயர். யாத்திராகமம் 12:5 செம்மறியாடு அல்லது வெள்ளாட்டை அனுமதிப்பதால், ‘ஆட்டுக்குட்டி’ என்று தேவையின்றிக் குறுக்காமல் பலிசார் பொருளை வெளிப்படுத்துகிறது.
- issue: צֹאן என்பதன் விலங்கு வகை
  choice: மந்தைக் கால்நடைகள்
  alternative: செம்மறியாடுகள்; ஆட்டுக்குட்டிகள்
  rationale: எபிரெயச் சொல் சிறு மந்தைக் கால்நடைகளைப் பொதுவாகக் குறிக்கக்கூடும்; குறிப்பாக இச்சூழலில் செம்மறியாடும் வெள்ளாடும் சாத்தியம். ஆகவே உண்மையான சொற்பொருள் பரப்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெயத்தின் இரு கட்டளைகளான מִשְׁכוּ וּקְחוּ தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன. ‘பஸ்காப் பலி’ என்பது பாரம்பரியமாக அறியப்பட்ட ‘பஸ்கா’ சொல்லை வைத்துக்கொண்டு, மூலத்தில் உள்ள ஆகுபெயர்சார் குறிப்பைத் தெளிவாக்குகிறது.
