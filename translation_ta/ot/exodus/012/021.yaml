  naturalness: ‘உங்கள் குடும்பங்களுக்கு ஏற்றபடி மந்தை விலங்குகளைப் பிரித்து எடுத்துக்கொள்ளுங்கள்’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும், கட்டளையின் நடை மற்றும் பொருளுக்கு ஏற்றதாகவும் உள்ளது. ‘பஸ்கா விலங்கை அறுங்கள்’ என்பது ‘பஸ்காப் பலியை வெட்டுங்கள்’ என்பதைவிட இயல்பாகவும் குறிப்புப் பொருளில் துல்லியமாகவும் உள்ளது.
