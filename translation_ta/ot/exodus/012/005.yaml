source:
  edition: WLC
  text: שֶׂ֥ה תָמִ֛ים זָכָ֥ר בֶּן שָׁנָ֖ה יִהְיֶ֣ה לָ/כֶ֑ם מִן הַ/כְּבָשִׂ֥ים וּ/מִן הָ/עִזִּ֖ים תִּקָּֽחוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/005.yaml
  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: ta
  text: உங்களுக்கான ஆட்டுக்குட்டி[a] குறைபாடற்றதாகவும், ஓராண்டு வயதுடைய ஆணாகவும் இருக்க வேண்டும்; அதைச் செம்மறியாடுகளிலிருந்தோ வெள்ளாடுகளிலிருந்தோ எடுத்துக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியிலுள்ள שֶׂה என்ற சொல் மந்தையிலுள்ள இளம் விலங்கைப் பொதுவாகக் குறிக்கலாம்; அது செம்மறியாட்டுக் குட்டியாகவோ வெள்ளாட்டுக் குட்டியாகவோ இருக்கலாம். அடுத்த சொற்றொடர் இந்த இரு வாய்ப்புகளையும் வெளிப்படையாகக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: ஆட்டுக்குட்டி
  rationale: இச்சொல் செம்மறியாட்டுக் குட்டியையோ வெள்ளாட்டுக் குட்டியையோ குறிக்கக்கூடிய பொதுப்பெயர். தமிழில் இயல்பாக வாசிக்க ‘ஆட்டுக்குட்டி’ பயன்படுத்தப்பட்டு, அதன் விரிவான பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: תָמִים
  choice: குறைபாடற்ற
  rationale: பலிக்குரிய விலங்கின் உடற்குறை அல்லது பழுது இல்லாத தன்மையைத் துல்லியமாகக் காட்டுகிறது; பொதுவான ‘பூரணமான’ என்பதைவிட இச்சூழலுக்கு ஏற்றது.
- source_word: זָכָר
  choice: ஆண்
  rationale: விலங்கின் பாலினத்தைக் குறிக்கும் நேரடியான, இயல்பான தமிழ்ச் சொல்.
- source_word: בֶּן שָׁנָה
  choice: ஓராண்டு வயதுடைய
  rationale: ‘ஒரு ஆண்டின் மகன்’ என்ற எபிரெய மரபுத்தொடரை தமிழில் வயதைக் குறிக்கும் இயல்பான வடிவில் தருகிறது.
- source_word: יִהְיֶה לָכֶם
  choice: உங்களுக்கான … இருக்க வேண்டும்
  rationale: לָכֶם என்பதிலுள்ள ‘உங்களுக்காக/உங்களுக்குரிய’ என்ற உறவையும், கட்டளையாக விதிக்கப்படும் தகுதிகளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: செம்மறியாடுகளிலிருந்தோ வெள்ளாடுகளிலிருந்தோ
  rationale: தேர்ந்தெடுக்கப்படும் விலங்கு இவ்விரு வகைகளில் ஏதாவது ஒன்றிலிருந்து வரலாம் என்பதால், தமிழின் பிரிநிலை இணைப்பான ‘-இலிருந்தோ … -இலிருந்தோ’ பயன்படுத்தப்படுகிறது.
- source_word: תִּקָּחוּ
  choice: எடுத்துக்கொள்ளுங்கள்
  rationale: இரண்டாம் நபர் பன்மைக் கட்டளையின் வலிமையைத் தெளிவாகக் காக்கிறது; வெறும் அனுமதியை உணர்த்தும் ‘எடுத்துக்கொள்ளலாம்’ தவிர்க்கப்படுகிறது.
