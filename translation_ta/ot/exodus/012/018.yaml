  text: בָּ/רִאשֹׁ֡ן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֤וֹם לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב תֹּאכְל֖וּ מַצֹּ֑ת עַ֠ד י֣וֹם הָ/אֶחָ֧ד וְ/עֶשְׂרִ֛ים לַ/חֹ֖דֶשׁ בָּ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: ta
  text: முதலாம் மாதத்தின் பதினான்காம் நாள் மாலையில் தொடங்கி, அந்த மாதத்தின் இருபத்தொன்றாம் நாள் மாலைவரை புளிப்பில்லாத அப்பங்களைச் சாப்பிட வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: முதலாம் மாதத்தின்
  rationale: எபிரெயக் காலக் குறிப்பில் பின்னர் வரும் לַחֹדֶשׁ என்பதுடன் இணைந்து இது ‘முதலாம் மாதம்’ என்பதைக் குறிக்கிறது; தமிழில் இயல்பான தேதிக் கட்டமைப்புக்காக ‘முதலாம் மாதத்தின்’ என வழங்கப்பட்டது.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: பதினான்காம் நாள்
  rationale: எண்ணிக்கைச் சொல்லால் வரிசைநாளைக் குறிக்கும் எபிரெயத் தேதிமுறையை இயல்பான தமிழில் வரிசை எண்ணாக வழங்குகிறது.
- source_word: לַחֹדֶשׁ
  choice: அந்த மாதத்தின்
  rationale: தேதிச் சூழலில் חֹדֶשׁ என்பது ‘அமாவாசை’ என்பதைக் காட்டிலும் ‘மாதம்’ என்ற பொருளையே தருகிறது.
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: மாலையில் தொடங்கி / மாலைவரை
  rationale: இரண்டு இடங்களிலும் עֶרֶב கால எல்லையைக் குறிக்கிறது. தமிழில் தொடக்கத்தையும் முடிவையும் தெளிவாகவும் இயல்பாகவும் காட்ட இவ்வாறு அமைக்கப்பட்டது; ‘அந்தி’ என்று மிகத் துல்லியப்படுத்தப்படவில்லை.
- source_word: תֹּאכְלוּ
  choice: சாப்பிட வேண்டும்
  rationale: சட்ட/உடன்படிக்கைச் சூழலில் உள்ள கட்டளை வலிமையை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: מַצֹּת
  choice: புளிப்பில்லாத அப்பங்கள்
  rationale: புளிக்கவைக்கும் பொருள் சேர்க்காமல் செய்யப்பட்ட உணவைக் குறிக்கும் சொல். மூலத்தில் பன்மை இருப்பதால் ‘அப்பங்கள்’ என வழங்கப்பட்டது.
- source_word: עַד
  choice: வரை
  rationale: கடைசி கால எல்லையை நேரடியாகக் குறிக்கிறது.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: இருபத்தொன்றாம் நாள்
  rationale: எபிரெய எண்ணியல் தேதிக் கூறை இயல்பான தமிழ் வரிசை எண்ணாக வழங்குகிறது.
