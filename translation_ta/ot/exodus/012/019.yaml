review_pass:
  verdict: revise
  source_fidelity: The draft accurately distinguishes the leavening agent (שְׂאֹר) from leavened food (מַחְמֶצֶת), retains the seven-day prohibition, and does not overdefine the covenant-sanction idiom. The resident-foreigner/native contrast is also retained. A small revision improves the generic-person wording and the placement and idiomatic expression of the sanction.
  naturalness: The current masculine-generic sequence “எவனும்—அவன் ... இருந்தாலும்” is less natural and can sound unnecessarily male-specific in modern standard Tamil. “அறுத்துப்போடப்படுவான்” is understandable but somewhat physically concrete and awkward for this covenant idiom. A more idiomatic generic formulation is preferable.
  terminology: “புளிப்பூட்டும் பொருள்” suitably represents the leavening agent without restricting it to commercial yeast. “புளிப்பூட்டப்பட்ட எதையாவது” properly reflects the broader leavened item. “வெளிநாட்டுக் குடியிருப்பாளர்” naturally conveys גֵּר as a resident foreigner. “இஸ்ரவேல் சமூகம்” is a suitable non-denominational rendering of עֵדָה.
  issues:
  - severity: medium
    issue: Generic masculine wording
    rationale: “சாப்பிடுகிற எவனும்—அவன்” may imply a male-only referent in contemporary Tamil, whereas כָּל אֹכֵל is generic. Use a gender-inclusive generic participial construction.
  - severity: low
    issue: Covenant-sanction idiom is phrased awkwardly
    rationale: “அறுத்துப்போடப்படுவான்” can evoke literal physical cutting and is less idiomatic in modern Tamil. “துண்டிக்கப்படுவார்” retains the metaphorical ‘cut off’ language without defining the sanction as death or expulsion.
  - severity: low
    issue: Resident-foreigner terminology can be smoother
    rationale: “அந்நியக் குடியிருப்பாளன்” is understandable, but “வெளிநாட்டுக் குடியிருப்பாளர்” is more natural modern standard Tamil and retains the social category of גֵּר.
