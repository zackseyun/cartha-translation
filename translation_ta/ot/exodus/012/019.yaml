base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: ta
  text: ஏழு நாட்களுக்கு உங்கள் வீடுகளில் புளிப்பூட்டும் பொருள் எதுவும் காணப்படக் கூடாது. ஏனெனில், புளிப்பூட்டப்பட்ட எதையாவது உண்பவர், வெளிநாட்டுக் குடியிருப்பாளராக இருந்தாலும் நாட்டில் பிறந்தவராக இருந்தாலும், இஸ்ரவேல் சமூகத்திலிருந்து துண்டிக்கப்படுவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “துண்டிக்கப்படுவார்” என்பது மரணம், சமூகத்திலிருந்து விலக்கப்படுதல், அல்லது இறைவனின் நியாயத்தீர்ப்பு ஆகியவற்றில் எதைக் குறிக்கிறது என்பதை எபிரேய மரபுத்தொடர் இங்கே துல்லியமாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களுக்கு
  rationale: கால நீடிப்பைக் குறிக்கும் எபிரேயத் தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׂאֹר
  choice: புளிப்பூட்டும் பொருள்
  rationale: இது புளித்த உணவை அல்ல, மாவைப் புளிக்கச் செய்யும் காரணியைச் சுட்டுகிறது; குறிப்பிட்ட நவீன வகையான ‘ஈஸ்ட்’ என்று குறுக்காமல் பொருளைத் தக்கவைக்கிறது.
- source_word: לֹא יִמָּצֵא
  choice: காணப்படக் கூடாது
  rationale: நிபால் வடிவத்தின் தடை மற்றும் இல்லாமை நிலை இரண்டையும் தெளிவான தமிழில் தருகிறது.
- source_word: בְּבָתֵּיכֶם
  choice: உங்கள் வீடுகளில்
  rationale: எபிரேயப் பன்மையையும் குடியிருப்புகள் என்ற நேரடிப் பொருளையும் தக்கவைக்கிறது.
- source_word: כָּל אֹכֵל מַחְמֶצֶת
  choice: புளிப்பூட்டப்பட்ட எதையாவது சாப்பிடுகிற எவனும்
  rationale: מַחְמֶצֶת என்பது அப்பத்தை மட்டும் அல்லாமல் புளிப்பூட்டப்பட்ட எதையும் குறிக்கக்கூடும்; כָּל உடைய பொதுவான, அனைவரையும் உள்ளடக்கும் வலிமையும் தக்கவைக்கப்படுகிறது.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: அந்த நபர் ... அறுத்துப்போடப்படுவான்
  rationale: נֶפֶשׁ இங்கு முழு நபரைக் குறிக்கிறது. ‘அறுத்துப்போடப்படுவான்’ என்பது தண்டனையின் துல்லியமான முறையை நிர்ணயிக்காமல் எபிரேய உடன்படிக்கைத் தண்டனை மரபுத்தொடரைப் பாதுகாக்கிறது.
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் சமூகத்திலிருந்து
  rationale: עֵדָה என்பதன் ஒன்றுகூடிய உடன்படிக்கைச் சமூகம் என்ற பரந்த கருத்தை, திருச்சபை சார்ந்த தனிப்பட்ட பொருள் ஏற்றாமல் இயல்பான தமிழில் தருகிறது.
- source_word: בַּגֵּר
  choice: அந்நியக் குடியிருப்பாளன்
  rationale: இஸ்ரவேலரிடையே வசிக்கும் பிறநாட்டைச் சேர்ந்த நபரைச் சுட்டுகிறது; தற்காலிகப் பயணி என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: நாட்டில் பிறந்தவன்
  rationale: גֵּר என்பதற்கு எதிரான, நாட்டின் பூர்வீக உறுப்பினர் என்ற சமூக வேறுபாட்டை நவீன அரசியல் குடியுரிமைக் கருத்துகளைச் சேர்க்காமல் காட்டுகிறது.
theological_decisions:
- issue: ‘அறுத்துப்போடப்படுதல்’ என்ற உடன்படிக்கைத் தண்டனையின் பொருள்
  choice: ‘சமூகத்திலிருந்து அறுத்துப்போடப்படுவான்’ என்ற மரபுத்தொடரைத் தக்கவைத்தல்
  alternative: ‘கொல்லப்படுவான்’ அல்லது ‘சமூகத்திலிருந்து விலக்கப்படுவான்’
  rationale: எபிரேயச் சொற்றொடர் மரணம், சமூக விலக்கம் அல்லது தெய்வீக நியாயத்தீர்ப்பு ஆகியவற்றில் எதைக் குறிப்பாகக் குறிக்கிறது என்பது இவ்வசனத்தில் வெளிப்படையாகத் தீர்மானிக்கப்படவில்லை. ஆகவே அந்தத் தத்துவ மற்றும் சட்டப் பதற்றம் தீர்க்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டவாக்கியத்துக்குரிய கண்ணியமான தொனி. நீண்ட எபிரேய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. வேற்றுமை இணைப்பை இயல்பாக்க, ‘அந்நியக் குடியிருப்பாளனாக இருந்தாலும் நாட்டில் பிறந்தவனாக இருந்தாலும்’ என்ற இணை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
