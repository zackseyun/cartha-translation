source:
  edition: WLC
  text: וַ/תֶּחֱזַ֤ק מִצְרַ֨יִם֙ עַל הָ/עָ֔ם לְ/מַהֵ֖ר לְ/שַׁלְּחָ֣/ם מִן הָ/אָ֑רֶץ כִּ֥י אָמְר֖וּ כֻּלָּ֥/נוּ מֵתִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: ta
  text: எகிப்தியர்கள், மக்களை அந்த நாட்டிலிருந்து விரைவாக அனுப்பிவிட வேண்டும் என்று அவர்களைக் கடுமையாக வற்புறுத்தினார்கள். ஏனெனில், “நாம் எல்லாரும் செத்துப்போகிறோம்”[a] என்று அவர்கள் சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் எல்லாரும் இறந்தவர்களே.” எபிரெயத்தில் உள்ள சொல், ஏற்கெனவே இறந்துவிட்டதாகக் கூறும் தீவிரமான சொல்லாட்சியாகவும், எல்லாரும் விரைவில் இறந்துவிடுவோம் என்ற அச்சமாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּחֱזַק ... עַל־הָעָם
  choice: மக்களை ... மிகவும் நெருக்கினார்கள்
  rationale: חזק என்பதுடன் עַל வருவது மக்கள்மீது வலுவான அழுத்தம் கொடுத்ததைக் குறிக்கிறது. ‘மிகவும் நெருக்கினார்கள்’ என்பது உடல் வலிமையை அல்ல, அவசரமான வற்புறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִצְרַיִם
  choice: எகிப்தியர்கள்
  rationale: இடப்பெயரான ‘எகிப்து’ இங்கு மக்களை ஒருங்கிணைந்த குழுவாகக் குறிக்கிறது; தமிழில் நபர்களைக் குறிக்கும் ‘எகிப்தியர்கள்’ தெளிவாக உள்ளது.
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: விரைவாக அனுப்பிவிடும்படி
  rationale: அடுத்தடுத்து வரும் இரண்டு எபிரெய வினையெச்சங்கள் அனுப்புவதில் இருந்த அவசரத்தை வெளிப்படுத்துகின்றன. தமிழ் வாக்கிய அமைப்பில் ‘விரைவாக ... அனுப்பிவிடும்படி’ அந்த நோக்கத்தையும் அவசரத்தையும் இயல்பாக இணைக்கிறது.
- source_word: מִן־הָאָרֶץ
  choice: அந்த நாட்டிலிருந்து
  rationale: மூலத்தில் ‘நாட்டிலிருந்து’ என்றே உள்ளது; சூழலில் அது எகிப்தைக் குறிக்கிறது. ‘அந்த’ என்பது தமிழில் ஏற்கெனவே அறியப்பட்ட நாட்டை இயல்பாகச் சுட்டுகிறது.
- source_word: כֻּלָּנוּ מֵתִים
  choice: நாம் எல்லாரும் இறந்தவர்கள்தான்
  rationale: מֵתִים என்பது ‘இறந்தவர்கள்’ அல்லது சூழலுக்கேற்ப ‘இறந்துகொண்டிருக்கிறவர்கள்/சாகப்போகிறவர்கள்’ என்ற நிழற்பொருளைக் கொள்ளக்கூடிய வடிவம். முதன்மை உரை அதன் தீவிரமான மூல மொழி வடிவத்தைத் தக்கவைக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: எகிப்தியர்களின் கூற்று ஏற்கெனவே இறந்த நிலையையா அல்லது உடனடி மரண அச்சத்தையா குறிக்கிறது?
  choice: “நாம் எல்லாரும் இறந்தவர்கள்தான்” என்று மூலத்தின் தீவிரமான சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: “நாம் எல்லாரும் இறந்துகொண்டிருக்கிறோம்” அல்லது “நாம் எல்லாரும் சாகப்போகிறோம்”
  rationale: சூழல் உடனடி மரண அச்சத்தைக் காட்டினாலும், எபிரெய מֵתִים வடிவத்தை ஒரே காலநிலை விளக்கமாகச் சுருக்காமல் அதன் மொழிப்பதற்றத்தை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் மரியாதைமிக்க கதைநடைத் தொனியிலும் வடிவமைக்கப்பட்டது. ‘மிகவும் நெருக்கினார்கள்’ என்பது வலுவான வற்புறுத்தலைத் தெரிவிக்கிறது; ‘அனுப்பிவிடும்படி’ என்பது வெளியேற்றும் திசையையும் நிறைவேற்றும் அவசரத்தையும் சுமக்கிறது.
