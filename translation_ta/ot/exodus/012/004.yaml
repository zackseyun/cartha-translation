review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys an undersized household joining with the nearest neighbor, reckoning by the number of persons, and taking each person's consumption into account. However, ‘குடும்பத் தலைவன்’ introduces a household-head role that is not expressed by הוּא in this verse. The Hebrew simply says ‘he,’ referring back to the household representative in context; Tamil can preserve this without adding an office or status.
  naturalness: The revision uses idiomatic modern standard Tamil while retaining the verse’s sequential instruction. ‘நபர்களின் எண்ணிக்கைக்கு ஏற்ப’ avoids the potentially male-specific ‘ஆட்களின் எண்ணிக்கை’ where נְפָשֹׁת means persons.
  terminology: ‘ஆட்டுக்குட்டி’ is acceptable in the Passover context provided that the broader sense of שֶׂה (a sheep or goat from the small livestock) remains footnoted. The final reckoning clause is rendered without over-specifying the object of the calculation.
  issues:
  - severity: medium
    issue: 'Unsupported addition: ‘குடும்பத் தலைவன்’'
    rationale: The Hebrew has ‘he and his neighbor nearest to his house’; it does not identify him as the household head. Adding that role narrows the source unnecessarily.
  - severity: low
    issue: ‘ஆட்களின் எண்ணிக்கை’ may sound male-specific
    rationale: נְפָשֹׁת denotes persons in this context. ‘நபர்களின் எண்ணிக்கை’ is more accurate and natural in modern Tamil.
  - severity: low
    issue: The final clause overstates the explicit object by repeating ‘ஆட்களின் எண்ணிக்கை’
    rationale: The preceding phrase supplies the number of persons; תָּכֹסּוּ עַל־הַשֶּׂה directs reckoning in relation to the animal. A less repetitive rendering better reflects the Hebrew construction.
  revised_text: ஒரு ஆட்டுக்குட்டியை உண்ணுவதற்கு அந்தக் குடும்பத்தில் போதிய நபர்கள் இல்லாவிட்டால், அவனும் அவன் வீட்டுக்கு அருகிலுள்ள அண்டை வீட்டுக்காரனும் நபர்களின் எண்ணிக்கைக்கு ஏற்ப ஒன்றை எடுத்துக்கொள்ள வேண்டும். ஒவ்வொருவரும் உண்ணும் அளவுக்கு ஏற்ப அந்த ஆட்டுக்குட்டிக்காக நீங்கள் கணக்கிட வேண்டும்.[a][b]
