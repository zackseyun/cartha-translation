base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: ta
  text: ஒரு ஆட்டுக்குட்டியை உண்ணுவதற்கு அந்தக் குடும்பத்தில் போதிய நபர்கள் இல்லாவிட்டால், அவனும் அவன் வீட்டுக்கு அருகிலுள்ள அண்டை வீட்டுக்காரனும் நபர்களின் எண்ணிக்கைக்கு ஏற்ப ஒன்றை எடுத்துக்கொள்ள வேண்டும். ஒவ்வொருவரும் உண்ணும் அளவுக்கு ஏற்ப அந்த ஆட்டுக்குட்டிக்காக நீங்கள் கணக்கிட வேண்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆட்டுக்குட்டி’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், செம்மறியாடு அல்லது வெள்ளாடு ஆகிய சிறுகால்நடைகளில் ஒன்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒவ்வொருவரும் எவ்வளவு உண்ண முடியும் என்பதற்கு ஏற்ப, அந்த ஆட்டுக்குட்டிக்காக நீங்கள் கணக்கிட வேண்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: ஒரு குடும்பத்திலுள்ளவர்கள் ஓர் ஆட்டுக்குட்டியை உண்பதற்குப் போதுமானவர்களாக இல்லாவிட்டால்
  rationale: הַבַּיִת இங்கு கட்டிடத்தை அல்ல, பஸ்கா உணவில் பங்கேற்கும் குடும்பத்தைக் குறிக்கிறது. יִמְעַט ... מִהְיֹת என்பது அந்த விலங்கு முழுவதையும் உண்ணக் குடும்ப உறுப்பினர்களின் எண்ணிக்கை போதாமையைக் குறிக்கிறது; தமிழில் பொருள் இயல்பாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: שֶׂה
  choice: ஆட்டுக்குட்டி
  rationale: שֶׂה என்பது செம்மறியாடு அல்லது வெள்ளாடு ஆகிய சிறுகால்நடைகளில் ஓர் உயிரைக் குறிக்கக்கூடும். பஸ்கா சூழலில் இயல்பான தமிழுக்காக ‘ஆட்டுக்குட்டி’ பயன்படுத்தப்பட்டு, மூலச்சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: அந்தக் குடும்பத் தலைவனும் அவன் வீட்டுக்கு அருகிலிருக்கும் அண்டை வீட்டுக்காரனும் ... ஒன்றை எடுத்துக்கொள்ள வேண்டும்
  rationale: הוּא என்பதன் ஆண்பால் ஒருமை வடிவம் முந்தைய வசனத்தில் குடும்பத்திற்காக விலங்கை எடுக்கும் பொறுப்பாளரைத் தொடர்கிறது; தமிழில் தெளிவுக்காக ‘குடும்பத் தலைவன்’ என வெளிப்படுத்தப்பட்டுள்ளது. ‘ஒன்றை’ என்பது சூழலில் மறைந்துள்ள வினைப்பொருளைச் சுட்டுகிறது.
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: ஆட்களின் எண்ணிக்கைக்கு ஏற்ப
  rationale: מִכְסָה கணக்கிடப்பட்ட எண்ணிக்கையையும் נְפָשֹׁת இங்கு உயிரற்ற ‘ஆத்துமாக்களை’ அல்ல, நபர்களையும் குறிக்கின்றன. ஆகவே நவீன தமிழில் தெளிவான ‘ஆட்களின் எண்ணிக்கை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: ஒவ்வொருவரும் உண்ணும் அளவின்படி
  rationale: אִישׁ இங்கு பகிர்முறைப் பொருளில் ஒவ்வொருவரையும் குறிக்கிறது; לְפִי אָכְלוֹ அவரவர் உண்ணும் அளவு அல்லது உணவுத் தேவையைக் குறிக்கிறது. பாலினத்தைத் தேவையின்றிக் குறுக்காமல் தமிழில் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: அந்த ஆட்டுக்குட்டிக்கான ஆட்களின் எண்ணிக்கையை நீங்கள் கணக்கிட வேண்டும்
  rationale: அரிதான வினை இச்சூழலில் விலங்கைப் பகிர்ந்து உண்பவர்களை அவரவர் உண்ணும் அளவுக்கேற்ப கணக்கிடுதல் அல்லது நிர்ணயித்தல் என்ற பொருளைக் கொண்டுள்ளது. ‘கணக்கிட வேண்டும்’ அதன் கணக்கீட்டுப் பொருளைப் பாதுகாக்கிறது.
