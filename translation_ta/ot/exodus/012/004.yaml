revisions:
- from: ஒரு குடும்பத்திலுள்ளவர்கள் ஓர் ஆட்டுக்குட்டியை[a] உண்பதற்குப் போதுமானவர்களாக இல்லாவிட்டால், அந்தக் குடும்பத் தலைவனும் அவன் வீட்டுக்கு அருகிலிருக்கும் அண்டை வீட்டுக்காரனும் ஆட்களின் எண்ணிக்கைக்கு ஏற்ப ஒன்றை எடுத்துக்கொள்ள வேண்டும். ஒவ்வொருவரும் உண்ணும் அளவின்படி, அந்த ஆட்டுக்குட்டிக்கான ஆட்களின் எண்ணிக்கையை நீங்கள் கணக்கிட வேண்டும்.[b]
  to: ஒரு ஆட்டுக்குட்டியை உண்ணுவதற்கு அந்தக் குடும்பத்தில் போதிய நபர்கள் இல்லாவிட்டால், அவனும் அவன் வீட்டுக்கு அருகிலுள்ள அண்டை வீட்டுக்காரனும் நபர்களின் எண்ணிக்கைக்கு ஏற்ப ஒன்றை எடுத்துக்கொள்ள வேண்டும். ஒவ்வொருவரும் உண்ணும் அளவுக்கு ஏற்ப அந்த ஆட்டுக்குட்டிக்காக நீங்கள் கணக்கிட வேண்டும்.[a][b]
  rationale: The revision removes the unsupported designation ‘குடும்பத் தலைவன்,’ renders ‘persons’ inclusively and accurately, and preserves the Hebrew’s concise final instruction to reckon in relation to the animal. The lexical breadth of שֶׂה and the alternative construal of the consumption clause are retained in anchored footnotes.
