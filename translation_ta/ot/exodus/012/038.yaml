translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘பல இனத்தார்’ என்பது குழுவின் பல்வகைத் தன்மையைச் சுட்டுகிறது; அவர்களின் துல்லியமான இன அல்லது மத அடையாளத்தை உரை கூறுவதாக எடுத்துக்கொள்ளவில்லை. கால்நடைகளைப் பற்றிய இறுதிப் பகுதி தமிழில் முழுமையான வாக்கியமாக இயல்புபடுத்தப்பட்டுள்ளது.
