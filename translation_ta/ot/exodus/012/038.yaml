base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/038.yaml
  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: ta
  text: கலப்பான ஒரு பெருங்கூட்டமும் அவர்களோடு புறப்பட்டுச் சென்றது[a]; ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும் அடங்கிய மிக ஏராளமான கால்நடைகளும் சென்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பலவகைப்பட்ட ஒரு பெருங்கூட்டம்’ அல்லது ‘கலவையான ஒரு கூட்டம்.’ எபிரெயச் சொற்றொடர் இஸ்ரவேலரோடு சென்ற, பல்வேறு பின்னணிகளைச் சேர்ந்த ஒரு குழுவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: -உம்
  rationale: முந்தைய நிகழ்வுடன் கூடுதல் தகவலை இணைக்கும் எபிரெயச் சொல்லின் சேர்க்கைப் பொருளைத் தமிழில் இயல்பான ‘-உம்’ விகுதி வெளிப்படுத்துகிறது.
- source_word: עֵרֶב רַב
  choice: பல இனத்தாரைக் கொண்ட பெருங்கூட்டம்
  rationale: வெவ்வேறு பின்னணிகளைச் சேர்ந்த கணிசமான ஒரு குழுவைக் குறிக்கும் சொற்றொடரின் கலப்புத் தன்மையையும் רַב என்பதன் பெருமளவையும் இது இயல்பாகக் காட்டுகிறது; குறிப்பிட்ட இன அடையாளத்தைத் தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: עָלָה
  choice: புறப்பட்டுச் சென்றது
  rationale: யாத்திரைப் பயணத்தில் நகர்ந்து செல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தமிழில் இயல்பாகத் தருகிறது. ‘மேலே சென்றது’ என்பது இச்சூழலில் தேவையற்ற இடவியல் எண்ணத்தை உருவாக்கலாம்.
- source_word: אִתָּם
  choice: அவர்களோடு
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட இஸ்ரவேலரோடு சென்றதைக் குறிக்கும் உடனிகழ்ச்சிப் பொருளை நேரடியாகத் தருகிறது.
- source_word: וְ/צֹאן וּ/בָקָר
  choice: ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும்
  rationale: צֹאן எனும் சிறுகால்நடை மந்தைகளையும் בָקָר எனும் மாடுகளின் மந்தைகளையும் வேறுபடுத்திக் காட்டுகிறது; தமிழில் இயல்பாக இருக்க ‘மந்தைகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִקְנֶה
  choice: கால்நடைகள்
  rationale: வளர்ப்பு விலங்குகளை மொத்தமாகக் குறிக்கும் விரிவான கூட்டுப்பெயருக்கு நவீனத் தமிழில் இயல்பான இணைச்சொல்.
- source_word: כָּבֵד מְאֹד
  choice: மிக ஏராளமான
  rationale: சொல்லளவில் ‘மிகவும் கனமான’ என்றாலும் கால்நடைகளோடு சேர்ந்து வரும்போது மிகுந்த எண்ணிக்கை அல்லது பெருமளவைக் குறிக்கிறது; அந்த மரபுப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
