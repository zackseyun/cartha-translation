base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/024.yaml
  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: ta
  text: நீங்கள் இந்தக் காரியத்தைக்[a] கடைப்பிடிக்க வேண்டும்; இது உனக்கும் உன் மகன்களுக்கும்[b] என்றென்றும் ஒரு நியமம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்த விஷயத்தை’ அல்லது ‘இந்த வார்த்தையை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஒரு காரியம், விஷயம் அல்லது சொல்லப்பட்ட வார்த்தையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உனக்கும் உன் பிள்ளைகளுக்கும்’ அல்லது ‘உனக்கும் உன் சந்ததியினருக்கும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘உன் மகன்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: கடைப்பிடிக்க வேண்டும்
  rationale: שׁמר என்பதற்கு காத்தல், பேணுதல், கடைப்பிடித்தல் ஆகிய பொருள்கள் உண்டு. சட்ட மற்றும் உடன்படிக்கைச் சூழலில், தொடர்ந்த கீழ்ப்படிதலை இயல்பாக வெளிப்படுத்துவதால் ‘கடைப்பிடிக்க வேண்டும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தக் காரியத்தை
  rationale: דָּבָר என்பது சொல், காரியம், விஷயம் எனப் பரந்த பொருளுடையது. இங்கு முன்பு கூறப்பட்ட பஸ்கா அனுசரிப்பைச் சுட்டுவதால், அதன் பொருளை ஒரு பேச்சுச் சொல்லாகவோ தனிக் கட்டளையாகவோ குறுக்காமல் ‘இந்தக் காரியம்’ என வழங்கப்பட்டது.
- source_word: לְחָק
  choice: ஒரு நியமமாக
  rationale: חֹק என்பது நிர்ணயிக்கப்பட்ட விதி அல்லது சட்ட நியமத்தைக் குறிக்கிறது. ‘நியமம்’ அதன் சட்டபூர்வமான, தொடர்ச்சியான தன்மையைத் தக்கவைக்கிறது.
- source_word: לְךָ וּלְבָנֶיךָ
  choice: உனக்கும் உன் மகன்களுக்கும்
  rationale: எபிரெய உரை ஒருமையில் ‘உனக்கு’ என்றும் நேரடியாக ‘உன் மகன்களுக்கு’ என்றும் கூறுகிறது. ஆகவே பாலினத்தையும் எண்ணையும் பொதுமைப்படுத்தாமல் மூல வடிவம் தக்கவைக்கப்பட்டது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: עַד עוֹלָם நீடித்த அல்லது நிரந்தர காலத்தைக் குறிக்கிறது. ‘என்றென்றும்’ அதன் வலுவான தொடர்ச்சிப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘உன் மகன்கள்’ என்ற உடன்படிக்கை வாரிசுரிமைச் சொல்லின் பரப்பு
  choice: மூல உரையின்படி ‘உன் மகன்களுக்கும்’ என்பதை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘உன் பிள்ளைகளுக்கும்’ அல்லது ‘உன் சந்ததியினருக்கும்’
  rationale: எபிரெயம் வெளிப்படையாக ‘உன் மகன்கள்’ என்கிறது. இது குடும்பத்தின் அடுத்த தலைமுறையைப் பிரதிநிதித்துவமாகக் குறிக்கக்கூடும்; எனினும் அந்த விளக்க விரிவாக்கத்தை மொழிபெயர்ப்பிலேயே புகுத்தாமல், மாற்று வாய்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. தொடக்க வினைச்சொல்லில் உள்ள பன்மை (‘நீங்கள்’) மற்றும் பின்னர் வரும் ஒருமை (‘உனக்கும்’) ஆகிய எபிரெய உரையின் எண்ணியல் மாற்றம் விளக்கமாகச் சமப்படுத்தப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
