base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/007.yaml
  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: ta
  text: அவர்கள் இரத்தத்திலிருந்து சிறிதை எடுத்து, அதை அவர்கள் சாப்பிடும் வீடுகளின் இரண்டு கதவு நிலைக்கால்களிலும் மேல் சட்டங்களிலும் வைக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை அவர்கள் சாப்பிடவிருக்கும் வீடுகளின்.” இந்த அறிவுறுத்தல் சூழலில் எபிரேய நிறைவுறாத வினை வடிவத்திற்கு எதிர்கால நுணுக்கமும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: அவர்கள் ... எடுத்து
  rationale: அறிவுறுத்தல் தொடரில் இந்த வினை கட்டளை சார்ந்த பொருளைக் கொண்டுள்ளது; அடுத்துள்ள ‘வைக்க வேண்டும்’ என்பதோடு இணைந்து தமிழில் இயல்பாக அந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: מִן הַדָּם
  choice: இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; இரத்தம் முழுவதையும் அல்ல, அதிலிருந்து ஒரு பகுதியை எடுப்பதைத் தெளிவாக்குகிறது.
- source_word: וְנָתְנוּ
  choice: வைக்க வேண்டும்
  rationale: נתן என்பதன் விரிவான ‘வை/இடு’ பொருளைத் தக்கவைத்து, இரத்தத்தை எவ்வாறு பூசினர் என்ற கூடுதல் முறையை உரையில் சேர்க்காமல் விடுகிறது.
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: இரண்டு கதவு நிலைக்கால்களிலும்
  rationale: מְזוּזוֹת என்பது வாசலின் இருபுறமுள்ள செங்குத்தான சட்டத் தூண்களைக் குறிக்கிறது; ‘கதவு நிலைக்கால்கள்’ என்பது துல்லியமும் புரிதலும் கொண்ட தமிழ்ச் சொற்றொடர்.
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: மேல் சட்டத்திலும்
  rationale: מַשְׁקוֹף வாசலின் மேலுள்ள கிடைமட்டப் பகுதியைக் குறிக்கிறது; ‘மேல் சட்டம்’ சாதாரண வாசகருக்கும் புரியும் இயல்பான கட்டடச் சொல்.
- source_word: עַל הַבָּתִּים
  choice: வீடுகளின்
  rationale: எபிரேயத்தில் עַל இருந்தாலும், இங்கு குறிக்கப்படும் நிலைக்கால்களும் மேல் சட்டமும் எந்த வீடுகளுக்குரியவை என்பதைத் தமிழ் உடைமைத் தொடர்பால் இயல்பாகச் சொல்கிறது.
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: அதைச் சாப்பிடும் வீடுகளின்
  rationale: தொடர்புச் சொற்றொடர் வீடுகளை விளக்குகிறது. நடைமுறை அறிவுறுத்தலில் யֹאכְלוּ என்பதன் நிறைவுறாத வினை வடிவத்தை இயல்பான நிகழ்காலப் பொதுநடையாக மொழிபெயர்க்கிறது; எதிர்கால நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
