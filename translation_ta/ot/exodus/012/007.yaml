translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, தெளிவான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘பூச வேண்டும்’ என்பது சூழலுக்கு இயல்பாக இருந்தாலும் செய்முறையைச் சற்றுக் கூடுதலாக விளக்குவதால், மூலத்தின் பொதுவான נתן வினையைப் பிரதிபலிக்க ‘வைக்க வேண்டும்’ தேர்ந்தெடுக்கப்பட்டது.
