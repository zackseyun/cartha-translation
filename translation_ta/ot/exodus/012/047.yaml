review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the comprehensive corporate subject, the obligation, and the unspecified pronoun referring to the Passover observance. However, the Hebrew has a singular collective expression, ‘all/whole congregation of Israel’; Tamil ‘சபையார் அனைவரும்’ recasts it as a plural group of persons and is less exact.
  naturalness: ‘இஸ்ரவேலின் சபையார் அனைவரும்’ is understandable but somewhat awkward in modern standard Tamil. ‘இஸ்ரவேலின் முழுச் சபையும்’ is idiomatic, preserves the collective construction, and avoids the slightly church-member-like nuance of ‘சபையார்’.
  terminology: ‘சபை’ is appropriate for עֲדַת in this communal/cultic setting. ‘செய்ய வேண்டும்’ appropriately retains the broad force of עשה; the footnote may offer ‘கடைப்பிடிக்க வேண்டும்’ as a contextual alternative without imposing it on the main text.
  issues:
  - severity: low
    issue: The main text uses the plural-person expression ‘சபையார் அனைவரும்’.
    rationale: This is a naturalizing shift from the Hebrew singular collective ‘כָּל עֲדַת יִשְׂרָאֵל’ and is less smooth than a collective Tamil construction. A revision can preserve both totality and corporate scope more closely.
