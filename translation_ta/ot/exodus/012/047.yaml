  text: כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יַעֲשׂ֥וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/047.yaml
  text: All the congregation of Israel shall do it[a].
translation:
  language: ta
  text: இஸ்ரவேலின் முழுச் சபையும் அதைச் செய்ய வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் முழுச் சபையும் அதைக் கடைப்பிடிக்க வேண்டும்.”
    reason: עשה என்பதற்கு இச்சூழலில் ‘கடைப்பிடி’ என்றும் மொழிபெயர்க்கலாம்; ‘அதைச் செய்’ என்பது மூலத்தின் பொதுவான வினைப் பொருளைத் தக்கவைக்கிறது.
lexical_decisions:
- source_word: כָּל
  choice: அனைவரும்
  rationale: முழுமையைக் குறிக்கும் எபிரெய அளவுச்சொல்லை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘சபையார்’ என்னும் கூட்டுப் பொருளுடன் இணைந்து முழுச் சமூகத்தையும் குறிக்கிறது.
- source_word: עֲדַת
  choice: சபையார்
  rationale: இஸ்ரவேலின் ஒன்றுகூடிய உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது. ‘சபையார்’ வழிபாட்டுச் சூழலையும் சமூகத்தின் கூட்டுத் தன்மையையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தமிழ் வேதாகம வழக்கில் நிலைபெற்றுள்ள பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יַעֲשׂוּ
  choice: செய்ய வேண்டும்
  rationale: עשה என்பதன் பரந்த ‘செய்/நிறைவேற்று’ என்ற பொருளைத் தக்கவைத்து, கட்டளையின் வலிமையை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது; சூழலில் இது பஸ்காவைக் கடைப்பிடிப்பதைக் குறிக்கிறது.
- source_word: אֹתוֹ
  choice: அதை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட பஸ்கா அனுசரிப்பைச் சுட்டும் ஆண்பால் ஒருமைச் சுட்டுப்பெயரை, அதன் குறிப்பை அளவுக்கு மீறி விளக்காமல் தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: பஸ்கா கட்டளையின் கூட்டுச் செய்பவர்
  choice: ‘இஸ்ரவேலின் சபையார் அனைவரும்’ என்று முழு உடன்படிக்கைச் சமூகத்தையும் ஒரு கூட்டாகக் குறிப்பிடுதல்
  alternative: ஒவ்வொரு இஸ்ரவேலரும் தனித்தனியாக அதைச் செய்ய வேண்டும்
  rationale: எபிரெய மொழியிலுள்ள கூட்டுப்பெயரும் தேசிய அடையாளமும் சமூகத்தை முழுமையாக ஒரு கூட்டாகக் குறிக்கின்றன; உரை கூறுவதைவிடக் கடுமையான தனிநபர் சார்ந்த பொருளை மொழிபெயர்ப்பில் புகுத்தவில்லை.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். ‘சபையார்’ கூட்டுச் சமூகப் பொருளைத் தருகிறது; ‘செய்ய வேண்டும்’ மூலத்தின் பொதுவான வினைப் பொருளையும் கட்டளையின் வலிமையையும் காக்கிறது. அடிக்குறிப்பு மாற்றுச் சொற்பொருளையும் பஸ்கா அனுசரிப்பு சார்ந்த சூழல்பொருளையும் காட்டுகிறது.
