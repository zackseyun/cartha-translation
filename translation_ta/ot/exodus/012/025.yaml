source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יִתֵּ֧ן יְהוָ֛ה לָ/כֶ֖ם כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר וּ/שְׁמַרְתֶּ֖ם אֶת הָ/עֲבֹדָ֥ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: ta
  text: யாவே உங்களுக்குக் கொடுக்கவிருக்கும் நாட்டிற்குள் நீங்கள் வந்து சேரும்போது, அவர் வாக்களித்தபடியே[a], இந்த வழிபாட்டு முறையைக்[b] கடைப்பிடிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் சொன்னபடியே.” எபிரெயத்தில் நேரடியாக “அவர் பேசியபடியே” என்று உள்ளது; இச்சூழலில் அது முன்பு அளிக்கப்பட்ட வாக்குறுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இந்த வழிபாட்டை,” “இந்தச் சடங்கை.” இங்குள்ள எபிரெயச் சொல் பஸ்காவுக்குரிய சடங்கு வழிபாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் ஒரு சூழலை அறிமுகப்படுத்தும் எபிரெய வழக்கை இயல்பான தமிழில் காலத்தைக் குறிக்கும் துணைவாக்கியமாக வழங்குகிறது.
- source_word: תָבֹאוּ אֶל־הָאָרֶץ
  choice: நாட்டிற்குள் நீங்கள் வந்து சேரும்போது
  rationale: בוא என்பதன் ‘வருதல்/நுழைதல்’ என்ற பொருளையும், הָאָרֶץ என்பதன் உடன்படிக்கைச் சூழலிலான ‘நாடு’ என்ற பொருளையும் இயல்பாகக் காட்டுகிறது.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: யாவே உங்களுக்குக் கொடுக்கவிருக்கும்
  rationale: יִתֵּן இச்சூழலில் எதிர்காலச் செயலைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: அவர் வாக்களித்தபடியே
  rationale: דִּבֵּר என்பதன் நேரடிப் பொருள் ‘பேசினார்/சொன்னார்’; இங்கு முன்பு கூறப்பட்ட நாட்டைக் கொடுக்கும் வாக்கைச் சுட்டுவதால் ‘வாக்களித்தபடியே’ சூழலுக்கேற்ற தெளிவைத் தருகிறது. நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּשְׁמַרְתֶּם
  choice: கடைப்பிடிக்க வேண்டும்
  rationale: சடங்கு சார்ந்த ஒன்றுடன் שׁמר வரும்போது அதைக் கவனமாக அனுசரித்தல் என்ற கடமையுணர்வு உள்ளது; தமிழில் ‘கடைப்பிடிக்க வேண்டும்’ அதைப் பொதுவாகப் புரியக்கூடிய முறையில் தெரிவிக்கிறது.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: இந்த வழிபாட்டு முறை
  rationale: עֲבֹדָה பொதுவாக ‘பணி/சேவை’ எனப் பொருள்பட்டாலும், இங்குப் பஸ்கா தொடர்பான கட்டளையிடப்பட்ட சடங்கு வழிபாட்டைக் குறிக்கிறது; ‘வழிபாட்டு முறை’ அந்தச் சூழலைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதனை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், நவீன தமிழில் மூல உச்சரிப்புக்கு நெருக்கமான ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- issue: כַּאֲשֶׁר דִּבֵּר என்பதை வாக்குறுதியாகப் பொருள்படுத்துதல்
  choice: அவர் வாக்களித்தபடியே
  alternative: அவர் சொன்னபடியே
  rationale: நிலத்தைக் கொடுப்பதாக யாவே முன்பு கூறிய வார்த்தையைச் சூழல் சுட்டுகிறது. இருப்பினும் எபிரெய வினைச்சொல் தனியே ‘வாக்களித்தார்’ என்று குறிப்பாகச் சொல்லாததால், நேரடி மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு எளிதில் புரியும் அதேவேளையில் மதிப்புமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நாட்டிற்குள் வந்து சேருதல்,’ ‘வழிபாட்டு முறை,’ ‘கடைப்பிடிக்க வேண்டும்’ ஆகியவை மூலத்தின் கால, சடங்கு, கடமை நுணுக்கங்களை இயல்பாக வெளிப்படுத்துகின்றன.
