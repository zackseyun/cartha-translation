  text: புளிப்பூட்டப்பட்ட எதையும் நீங்கள் சாப்பிடக் கூடாது[a]; நீங்கள் குடியிருக்கும் எல்லா இடங்களிலும்[b] புளிப்பில்லாத அப்பங்களை சாப்பிட வேண்டும்.
  philosophy: optimal-equivalence
