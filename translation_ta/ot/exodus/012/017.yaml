base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: ta
  text: புளிப்பில்லா அப்பப் பண்டிகையை[a] நீங்கள் கடைப்பிடிக்க வேண்டும்; ஏனெனில் இந்த நாளில்தான் உங்கள் படையணிகளை[b] எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தேன். இந்த நாளைத் தலைமுறைதோறும் நிலையான நியமமாக[c] நீங்கள் கடைப்பிடிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “புளிப்பில்லாத அப்பங்கள்/பொருட்கள்.” இது அப்பத்தையோ, ஆகுபெயராக அதனுடன் தொடர்புடைய பண்டிகைக் கடைப்பிடிப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் மக்கள் திரள்களை,” “உங்கள் பிரிவுகளை,” அல்லது “உங்கள் அணிகளை.” எபிரெயச் சொல், எகிப்திலிருந்து புறப்படும் இஸ்ரவேலை ஒழுங்கமைந்த அணிகளாகச் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “என்றென்றைக்கும் உரிய நியமமாக” அல்லது “நித்திய நியமமாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: நீங்கள் கடைப்பிடிக்க வேண்டும்
  rationale: சடங்கு மற்றும் உடன்படிக்கைச் சூழலில் שׁמר என்பதன் ‘கடைப்பிடி/பேணி அனுசரி’ என்ற பொருளை இயல்பாகத் தருகிறது; வசனத்தின் இரு இடங்களிலும் வரும் மீள்வடிவத்தையும் காக்கிறது.
- source_word: הַמַּצּוֹת
  choice: புளிப்பில்லா அப்பத்தை
  rationale: எபிரெயச் சொல் சொற்படியாக ‘புளிப்பில்லாத அப்பங்கள்/பொருட்கள்’ என்று பொருள்பட்டு, அப்பத்தையோ அதனுடன் தொடர்புடைய பண்டிகைக் கடைப்பிடிப்பையோ குறிக்கலாம். மூலத்தில் இல்லாத ‘பண்டிகை’ என்பதை முதன்மை உரையில் சேர்க்காமல் உண்மையான இருபொருள் வாய்ப்பைத் தக்கவைக்கிறது.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: இந்த நாளில்தான்
  rationale: עֶצֶם தரும் துல்லியமான நாளுக்கான வலியுறுத்தலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הוֹצֵאתִי
  choice: வெளியே கொண்டுவந்தேன்
  rationale: יצא வினையின் ஹிஃபில் வடிவத்திலுள்ள ‘வெளியே வரச்செய்/கொண்டுவா’ என்ற காரணவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: צִבְאוֹתֵיכֶם
  choice: உங்கள் படையணிகளை
  rationale: צָבָא குறிக்கும் ஒழுங்கமைந்த அணிகள் அல்லது படைப்பிரிவுகள் என்ற நுண்ணுணர்வைக் காக்கிறது; இங்கு இஸ்ரவேல் மக்கள் ஒழுங்கமைந்த குழுக்களாகப் புறப்படுவதைச் சித்தரிக்கிறது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: מִן குறிக்கும் புறப்படும் இடத்தை இயல்பான தமிழில் தருகிறது; ‘வெளியே கொண்டுவந்தேன்’ என்பதுடன் வெளியேற்ற இயக்கமும் தெளிவாகிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்த தலைமுறைகள் முழுவதும் தொடர்ந்து கடைப்பிடிப்பதைக் குறிக்கும் உடன்படிக்கைச் சொற்றொடருக்கு இயல்பான தமிழ் இணை.
- source_word: חֻקַּת עוֹלָם
  choice: நிலையான நியமமாக
  rationale: חֻקָּה என்பதின் கட்டளையிடப்பட்ட நியமம் என்ற பொருளையும் עוֹלָם என்பதின் நீடித்த தொடர்ச்சியையும், சூழலை மீறிய தத்துவ முடிவைத் திணிக்காமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הַמַּצּוֹת என்பது உணவையே குறிக்கிறதா அல்லது பண்டிகையை வெளிப்படையாகக் குறிக்கிறதா
  choice: முதன்மை உரையில் ‘புளிப்பில்லா அப்பத்தை’ என்று மொழிபெயர்த்து, பண்டிகைப் பொருளை அடிக்குறிப்பில் குறிப்பிடுதல்.
  alternative: ‘புளிப்பில்லா அப்பப் பண்டிகையை’
  rationale: மூல எபிரெயத்தில் ‘பண்டிகை’ என்ற சொல் இல்லை; ஆனால் சூழலில் அப்பம் ஆகுபெயராகப் பண்டிகைக் கடைப்பிடிப்பைக் குறிக்கக்கூடும். ஆகவே மூலத்தின் இருபொருள் வாய்ப்பு பாதுகாக்கப்படுகிறது.
- issue: חֻקַּת עוֹלָם என்பதன் காலநீட்சியை எவ்வாறு தெரிவிப்பது
  choice: ‘நிலையான நியமமாக’
  alternative: ‘என்றென்றைக்கும் உரிய நியமமாக’
  rationale: இது தலைமுறைகளுக்குத் தொடரும் உடன்படிக்கை நியமத்தைத் தெரிவிக்கிறது; עוֹלָם என்ற சொல்லுக்கு சூழலுக்கு அப்பாற்பட்ட முழுமையான காலமின்மை பற்றிய கூற்றைத் திணிக்காமல் அதன் நீடித்த வலிமையைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடைப்பிடிக்க வேண்டும்’ என்ற மீள்வடிவு எபிரெய உரையின் அமைப்பைக் காக்கிறது. அடிக்குறி குறியீடுகள் தொடர்புடைய சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
