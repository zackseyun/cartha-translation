  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: ta
  text: இஸ்ரவேலின் மக்கள்[a] எகிப்தில் குடியிருந்த காலம் நானூற்று முப்பது ஆண்டுகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சில பழமையான சாட்சிகளில், “இஸ்ரவேலின் மக்களும் அவர்களுடைய தந்தையரும் எகிப்திலும் கானானிலும் குடியிருந்த காலம் நானூற்று முப்பது ஆண்டுகள்” என்று வாசகம் உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: குடியிருந்த காலம்
  rationale: இச்சூழலில் இச்சொல் குடியிருத்தலின் நிலையை மட்டுமல்லாமல் அதன் கால அளவையும் குறிக்கிறது. தமிழில் “குடியிருந்த காலம்” என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் “இஸ்ரவேலின் மகன்கள்” என்றாலும், இங்கு முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கிறது. “இஸ்ரவேலின் மக்கள்” என்பது நவீன தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கிய சமூகப் பெயராகவும் உள்ளது.
- source_word: אֲשֶׁר יָשְׁבוּ
  choice: குடியிருந்த
  rationale: יָשְׁבוּ என்பதன் இங்குள்ள பொருள் ஓர் இடத்தில் தங்கி வாழ்ந்தது. தொடர்புச் சொல்லைத் தனியே மொழிபெயர்க்காமல் பெயரெச்சத் தொடராக அமைப்பது தமிழில் இயல்பானது.
- source_word: בְּמִצְרָיִם
  choice: எகிப்தில்
  rationale: இடத்தைக் குறிக்கும் בְּ முன்னிடைச்சொல்லையும் எகிப்து என்ற இடப்பெயரையும் நேரடியாகத் தருகிறது.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: நானூற்று முப்பது ஆண்டுகள்
  rationale: எபிரெய வரிசையில் முப்பது முதலில் வந்தாலும், தமிழின் இயல்பான எண் வரிசைப்படி “நானூற்று முப்பது” என்று வழங்கப்படுகிறது; கால அளவு மாறாமல் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: 430 ஆண்டுகள் எகிப்தில் மட்டும் குடியிருந்த காலமா, அல்லது கானானையும் உள்ளடக்கிய முற்பிதாக்களின் பரந்த குடியிருப்புக் காலமா?
  choice: கொடுக்கப்பட்ட மசோரெட்டிக் எபிரெய உரையைப் பின்பற்றி, முதன்மை உரையில் எகிப்தில் குடியிருந்த காலம் 430 ஆண்டுகள் என்று தரப்பட்டுள்ளது.
  alternative: சமாரிய ஐந்நூலும் செப்துவஜிந்தாவின் சில உரைமரபுகளும் எகிப்தையும் கானானையும் உள்ளடக்கும் விரிவான வாசகத்தைக் கொண்டுள்ளன.
  rationale: அடிப்படை ஆதாரமாக வழங்கப்பட்ட WLC உரையில் “எகிப்தில்” என்று மட்டுமே உள்ளது. காலக்கணிப்பைப் பாதிக்கும் பழமையான மாற்று வாசகத்தை முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் பாதுகாப்பது உரைத் தெளிவையும் உண்மையான பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. “இஸ்ரவேல் புத்திரர்” என்ற பழைய நடை தவிர்க்கப்பட்டு, சமூகத்தைக் குறிக்கும் இயல்பான “இஸ்ரவேலின் மக்கள்” பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் பொருளைத் தெளிவாக்கினாலும் அதன் காலவரலாற்றுத் தெளிவின்மையை விளக்கவுரை மூலம் தீர்க்க முயலவில்லை.
