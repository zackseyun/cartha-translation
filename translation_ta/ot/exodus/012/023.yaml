base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: ta
  text: யாவே எகிப்தைத் தாக்குவதற்காக எகிப்தின் வழியாகக் கடந்துசெல்வார். வாசலின் மேற்சட்டத்திலும் இரண்டு நிலைக்கால்களிலும் உள்ள இரத்தத்தை அவர் காணும்போது, யாவே அந்த வாசலைக் கடந்துசெல்வார்[a]; அழிப்பவன் உங்கள் வீடுகளுக்குள் நுழைந்து தாக்க அவர் அனுமதிக்கமாட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விட்டுவிடுவார்” அல்லது “பாதுகாப்பார்.” இங்கு வரும் எபிரெய வினை பஸ்காவுடன் தொடர்புடைய மையச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: “அழிப்பவன்” யார் என்பதை எபிரெய உரை குறிப்பாகச் சொல்லவில்லை; சிலர் இதை நியாயத்தீர்ப்பை நிறைவேற்றும் ஒரு தூதனாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: וְעָבַר
  choice: அந்த நாட்டின் வழியாகக் கடந்துசெல்வார்
  rationale: עבר இங்கு எகிப்தினூடாகச் சென்று தாக்கும் இயக்கத்தைக் குறிக்கிறது; பின்னர் வரும் פסח உடன் வேறுபாட்டைப் பேணுகிறது.
- source_word: לִנְגֹּף
  choice: தாக்குவதற்காக / தாக்க
  rationale: נגף குறிக்கும் கொடிய நியாயத்தீர்ப்பின் தீவிரத்தை, பழமையான நடையின்றித் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַמַּשְׁקוֹף
  choice: வாசலின் மேற்சட்டம்
  rationale: வாசல் சட்டத்தின் மேல் கிடைமட்டப் பகுதியைச் சாதாரண வாசகருக்கும் புரியும் துல்லியமான தமிழில் குறிக்கிறது.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: இரண்டு நிலைக்கால்கள்
  rationale: வாசலின் இரு செங்குத்துச் சட்டப் பகுதிகளைக் குறிக்கும் இயல்பான கட்டடவியல் சொல்.
- source_word: וּפָסַח
  choice: கடந்துசெல்வார்
  rationale: פסח என்பதன் அடிப்படை இயக்க உருவகத்தையும் பஸ்கா நிகழ்வுடனான சொல் தொடர்பையும் பேணுகிறது; ‘விட்டுவிடுவார்’ அல்லது ‘பாதுகாப்பார்’ என்பது விளைவை அதிகமாக விளக்கிவிடும்.
- source_word: עַל הַפֶּתַח
  choice: அந்த வாசலை
  rationale: פתח இங்கு வீட்டின் நுழைவிடத்தைக் குறிக்கிறது; தமிழில் இயல்பாக அமைய ‘வாசல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְלֹא יִתֵּן
  choice: அனுமதிக்கமாட்டார்
  rationale: נתן + வினையெச்சத்தின் அனுமதித்தல் என்ற சொல்லிடை மரபை இயல்பான தமிழில் தருகிறது.
- source_word: הַמַּשְׁחִית
  choice: அழிப்பவன்
  rationale: அழிவை நிகழ்த்தும் முகவரைக் குறிக்கிறது; எபிரெயத்தில் இல்லாத ‘தூதன்’ என்ற அடையாளத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: யெகோவாவுக்கும் ‘அழிப்பவன்’ என்பவனுக்கும் உள்ள உறவு
  choice: 'இருவரையும் தனித்தனியாகக் குறிப்பிடுதல்: யெகோவா செயல்படுகிறார்; அழிப்பவன் நுழையாதபடி அவரே தடுக்கிறார்.'
  alternative: ‘அழிப்பவன்’ என்பது யெகோவாவையே குறிக்கும் எனக் கொள்ளுதல், அல்லது ‘அழிக்கும் தூதன்’ என்று குறிப்பாக்குதல்.
  rationale: எபிரெய உரை יְהוָה மற்றும் הַמַּשְׁחִית ஆகியவற்றை இலக்கண ரீதியாக வேறுபடுத்துகிறது; அழிப்பவனின் அடையாளத்தை உரை விளக்காததால் மொழிபெயர்ப்பும் அதைத் தீர்மானிக்கவில்லை.
- issue: פסח என்ற வினையின் பொருள்
  choice: முதன்மை உரையில் ‘கடந்துசெல்வார்’ என்று மொழிபெயர்த்து, காத்தல்/விட்டுவிடுதல் என்ற பொருள் நிழலை அடிக்குறிப்பில் காட்டுதல்.
  alternative: ‘விட்டுவிடுவார்’ அல்லது ‘பாதுகாப்பார்’.
  rationale: இச்சொல் பஸ்கா நிகழ்வின் மையச் சொல்லாகும். அதன் உருவகத்தைக் காத்து, பாதுகாப்பின் விளைவை அடுத்த கூற்றே வெளிப்படுத்த அனுமதிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் உரையின் தீவிரமும் கொண்ட, பொதுவாசகருக்குப் புரியும் நடை. கட்டடப் பகுதிகளுக்கு ‘மேற்சட்டம்’, ‘நிலைக்கால்கள்’ பயன்படுத்தப்பட்டுள்ளன. இறைப்பெயர் பட்டமாக மாற்றப்படாமல் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது; அழிப்பவனின் அடையாளம் திட்டமிட்டு வரையறுக்கப்படவில்லை.
