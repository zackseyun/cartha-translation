base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: ta
  text: நீங்கள் ஈசோப்புச் செடியின் ஒரு கொத்தை எடுத்து, பாத்திரத்தில்[a] இருக்கும் இரத்தத்தில் தோயுங்கள். பின்பு, அதிலுள்ள இரத்தத்தில் சிறிதை வாசலின் மேற்சட்டத்திலும் இரு நிலைக்கால்களிலும் படும்படி செய்யுங்கள். உங்களில் ஒருவர்கூடக் காலைவரை தன் வீட்டின் வாசலைவிட்டு வெளியே போகக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாசற்படி.” இங்குள்ள எபிரெயச் சொல் இரத்தம் வைக்கப்பட்ட பாத்திரத்தையோ வாசற்படியையோ குறிக்கலாம். இரத்தம் அதில் இருப்பதாகவும் ஈசோப்புக் கொத்து அதிலுள்ள இரத்தத்தில் தோய்க்கப்படுவதாகவும் வசனம் கூறுவதால், முதன்மை உரையில் “பாத்திரம்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: ஈசோப்புச் செடியின் ஒரு கொத்து
  rationale: אֲגֻדָּה என்பது கட்டப்பட்ட அல்லது ஒன்றுசேர்ந்த கொத்தைக் குறிக்கிறது. தாவரத்தின் துல்லியமான இன அடையாளம் உறுதியில்லாததால், வழக்கமான ‘ஈசோப்பு’ என்ற பெயர் தக்கவைக்கப்பட்டு, இது ஒரு செடி என்பதும் தெளிவாக்கப்படுகிறது.
- source_word: וּטְבַלְתֶּם בַּדָּם
  choice: இரத்தத்தில் தோயுங்கள்
  rationale: טבל என்பது ஒரு பொருளைத் திரவத்தில் அமிழ்த்தி நனைப்பதைக் குறிக்கிறது. ‘தோயுங்கள்’ என்பது சடங்குச் செயலை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הַסַּף
  choice: பாத்திரம்
  rationale: இரத்தம் அதற்குள் இருப்பதாகவும் ஈசோப்புக் கொத்து அதிலுள்ள இரத்தத்தில் தோய்க்கப்படுவதாகவும் உடனடி சூழல் கூறுவதால், இரத்தத்தை வைத்திருக்கும் கலன் என்ற பொருளில் ‘பாத்திரம்’ தேர்ந்தெடுக்கப்பட்டது. ‘வாசற்படி’ என்ற சாத்தியமான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהִגַּעְתֶּם ... מִן הַדָּם
  choice: இரத்தத்தில் சிறிதை ... படும்படி செய்யுங்கள்
  rationale: נגע என்பதன் ஹிபீல் வடிவம் இங்கு இரத்தத்தை வாசலின் பகுதிகளோடு தொடர்புறச் செய்வதைக் குறிக்கிறது; מִן பகுதியளவைக் காட்டுகிறது. ‘படும்படி செய்யுங்கள்’ என்பது ‘பூசுங்கள்’ அல்லது ‘அடியுங்கள்’ போன்ற கூடுதல் செயற்பாங்கைச் சேர்க்காமல் கருத்தை இயல்பாகத் தருகிறது.
- source_word: הַמַּשְׁקוֹף
  choice: வாசலின் மேற்சட்டம்
  rationale: வாசல் திறப்பின் மேலுள்ள கிடைமட்டக் கட்டமைப்பைக் குறிக்கும் தெளிவான, பொதுமக்களுக்கு புரியும் தமிழ்ச் சொற்றொடர்.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: அதன் இரண்டு நிலைக்கால்கள்
  rationale: מְזוּזוֹת வாசலின் இருபுறமுள்ள செங்குத்தான நிலைகளைச் சுட்டுகிறது. ‘நிலைக்கால்கள்’ என்பது கட்டடப் பகுதியைத் துல்லியமாகக் காட்டுகிறது; ‘அதன்’ என்பது வாசலைத் தெளிவாகச் சார்த்துகிறது.
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: உங்களில் ஒருவர்கூட ... வெளியே போகக்கூடாது
  rationale: பன்மைத் தடைக்குப் பின் வரும் אִישׁ பகிர்வுநிலைப் பொருளில் ஒவ்வொருவரையும் தனித்தனியாக உள்ளடக்குகிறது. இந்தத் தமிழாக்கம் ‘யாரும் வெளியே போகக்கூடாது’ என்ற வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: தன் வீட்டின் வாசலைவிட்டு
  rationale: פֶּתַח என்பது திறப்பு அல்லது நுழைவாயிலைக் குறிக்கிறது. ‘தன்’ என்பது எபிரெயத்தின் ஒருமை பகிர்வுநிலையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עַד בֹּקֶר
  choice: காலைவரை
  rationale: நேர எல்லையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கும் தமிழாக்கம்.
theological_decisions:
- issue: אִישׁ ... בֵּיתוֹ என்ற பாலின வடிவமுள்ள பகிர்வுநிலைச் சொற்றொடர்
  choice: உங்களில் ஒருவர்கூடக் ... தன் வீட்டின் வாசலைவிட்டு
  alternative: உங்களில் எந்த ஆணும் அவனுடைய வீட்டின் வாசலைவிட்டு
  rationale: எபிரெயத்தில் ஆண்பால் ஒருமை வடிவம் இருந்தாலும், இங்கு கட்டளை ஒவ்வொருவருக்கும் பகிர்வுநிலையில் பொருந்துகிறது; ஆண்களுக்கு மட்டும் விதிக்கப்பட்டதாகக் குறுகச் செய்யக்கூடாது. தமிழின் ‘ஒருவர்கூட’ மற்றும் ‘தன்’ ஆகியவை ஒருமை பகிர்வுநிலையைப் பாதுகாத்து தேவையற்ற பாலினக் கட்டுப்பாட்டைத் தவிர்க்கின்றன.
- issue: הַסַּף என்பதன் பொருள்
  choice: பாத்திரம்
  alternative: வாசற்படி
  rationale: அதில் இரத்தம் இருப்பதும் ஈசோப்புக் கொத்து அதிலுள்ள இரத்தத்தில் தோய்க்கப்படுவதும் கலன் என்ற பொருளை வலுவாக ஆதரிக்கின்றன. ஆயினும் ‘வாசற்படி’ என்பது உண்மையான சொற்பொருள் வாய்ப்பாக இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கட்டளை நடையைக் கடைப்பிடிக்கிறது. கட்டடவியல் சொல் வாசகர்களுக்குப் புரியுமாறு ‘வாசலின் மேற்சட்டம்’ என விரித்துரைக்கப்பட்டுள்ளது. ‘படும்படி செய்யுங்கள்’ என்பது மூலத்தின் தொடச்செய்தல் என்ற செயலைத் தக்கவைத்து, இரத்தத்தைப் பூசுதல் அல்லது அடித்தல் என்ற கூடுதல் முறையை உரைக்குள் புகுத்தாமல் விடுகிறது.
