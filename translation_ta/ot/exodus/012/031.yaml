base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: ta
  text: அவன் இரவில் மோசேயையும் ஆரோனையும் அழைத்து, “எழுந்திருங்கள்; நீங்களும் இஸ்ரவேல் மக்களும்[a] என் மக்களின் நடுவிலிருந்து வெளியேறுங்கள். நீங்கள் சொன்னபடியே போய் யாவேவுக்குச் சேவை செய்யுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: ‘இஸ்ரவேலின் மகன்கள்.’ இது இங்கே இஸ்ரவேல் மக்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: இச்சூழலில் פרעה மோசேயையும் ஆரோனையும் அவசரமாக வரவழைத்ததைக் குறிக்கிறது. தமிழில் இயல்பாகவும் நேரடியாகவும் “அழைத்து” என வழங்கப்பட்டுள்ளது.
- source_word: לַיְלָה
  choice: இரவில்
  rationale: இது நிகழ்ந்த காலத்தைச் சுட்டும் வினையடைப் பயன்பாடு. எபிரெய உரையின் சுருக்கத்தையும் நேரக் குறிப்பையும் “இரவில்” இயல்பாகப் பாதுகாக்கிறது.
- source_word: קוּמוּ צְּאוּ
  choice: எழுந்திருங்கள்; ... வெளியேறுங்கள்
  rationale: இரண்டு பன்மை கட்டளைகளின் அவசரத்தையும் தொடர்ச்சியையும் தனித்தனியாகப் பாதுகாக்கிறது; יצא என்பதிலுள்ள வெளியே செல்லும் இடவுணர்வை “வெளியேறுங்கள்” வெளிப்படுத்துகிறது.
- source_word: מִתּוֹךְ עַמִּי
  choice: என் மக்களின் நடுவிலிருந்து
  rationale: מִתּוֹךְ என்பதன் ‘நடுவிலிருந்து’ என்ற இடவுணர்வை முறையாகப் பாதுகாக்கிறது.
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: நீங்களும் இஸ்ரவேல் மக்களும்
  rationale: மீண்டும் வரும் גַּם...גַּם தரும் இரு தரப்பினரையும் உள்ளடக்கும் வலியுறுத்தலை “...உம் ...உம்” அமைப்பு காக்கிறது. בְּנֵי יִשְׂרָאֵל என்ற எபிரெய மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் “இஸ்ரவேல் மக்கள்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: עִבְדוּ
  choice: பணிசெய்யுங்கள்
  rationale: עבד என்பது கடவுளுக்குச் செய்யும் பணி, சேவை, வழிபாடு ஆகிய பரப்பைக் கொண்டது. “வழிபடுங்கள்” என்று மட்டும் குறுக்காமல், அதன் விரிவான பொருளை “பணிசெய்யுங்கள்” பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீனத் தமிழில் அதன் ஒலிபெயர்ப்பான “யாவே” என வழங்குகிறது.
- source_word: כְּדַבֶּרְכֶם
  choice: நீங்கள் சொன்னபடியே
  rationale: மோசேயும் ஆரோனும் முன்பு கூறிய கோரிக்கைக்கு இணங்க அனுமதி தரப்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரை தெய்வீகப் பெயரையே நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரான “ஆண்டவர்” என்பதைப் பதிலிடாமல் ஒலிபெயர்க்கப்பட்டுள்ளது. “யாவே” என்பது மூலப் பெயரின் ஏற்றுக்கொள்ளப்பட்ட ஒலியமைப்பை நெருக்கமாகக் காட்டுகிறது.
- issue: עבד என்பதின் வழிபாடு–பணி பொருள் பரப்பு
  choice: பணிசெய்யுங்கள்
  alternative: வழிபடுங்கள்
  rationale: இச்சொல் வழிபாட்டை உள்ளடக்கினாலும் அதற்கு மட்டும் வரையறுக்கப்படவில்லை. உடன்படிக்கை சார்ந்த சேவை மற்றும் சமயப் பணி ஆகிய இரு நிழற்பொருள்களையும் திறந்தவையாக வைத்திருக்க “பணிசெய்யுங்கள்” தேர்ந்தெடுக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் உரையின் கட்டளைத் தீவிரம் குறையாத வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. “என் மக்களின் நடுவிலிருந்து” என்ற சற்றே முறையான அமைப்பு மூலத்தின் இடவுணர்வைக் காக்கிறது; தெய்வீகப் பெயர் “யாவே” என ஒலிபெயர்க்கப்பட்டுள்ளது.
