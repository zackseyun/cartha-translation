base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: ta
  text: இஸ்ரவேலர் ராமேசேசிலிருந்து சுக்கோத்துக்குப் புறப்பட்டார்கள்[a][b]; கால்நடையாகச் சென்ற ஆண்கள் ஏறக்குறைய ஆறு இலட்சம் பேர், குழந்தைகளைத் தவிர[d][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது; இங்கு அது ‘இஸ்ரவேலர்’ என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘பயணம் செய்தார்கள்.’ இந்த எபிரெய வினைச்சொல் முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘கால்நடையாகச் சென்ற ஆண்கள் ஏறக்குறைய ஆறு இலட்சம் பேர்’ என்ற எண்ணிக்கையில் குழந்தைகள் சேர்க்கப்படவில்லை.
    reason: cultural_note
  - marker: d
    text: அல்லது ‘சிறு பிள்ளைகளைத் தவிர.’ எபிரெயச் சொல்லான טף, குழந்தைகளையோ சிறிய சார்ந்திருப்போரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: புறப்பட்டார்கள்
  rationale: נסע என்பது முகாமைக் கலைத்துப் பயணத்தைத் தொடங்குவதைக் குறிக்கக்கூடும். இங்கு ‘புறப்பட்டார்கள்’ என்பது அந்த இயக்கத்தை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘இஸ்ரவேலின் மகன்கள்.’ ஆனால் இங்கு அது இனக்குழுவைக் குறிக்கும் வழக்குச் சொற்றொடர் என்பதால், ஆண்களை மட்டும் குறிக்காமல் இயல்பாக ‘இஸ்ரவேலின் மக்கள்’ என மொழிபெயர்க்கப்பட்டது; நேரடி வடிவம் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: מֵרַעְמְסֵס
  choice: ராமெசேசிலிருந்து
  rationale: מן முன்னொட்டு புறப்படும் இடத்தைக் குறிக்கிறது; רַעְמְסֵס என்ற இடப்பெயர் தமிழில் ‘ராமெசேஸ்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: סֻכֹּתָה
  choice: சுக்கோத்துக்கு
  rationale: இடப்பெயருடன் இணைந்த திசைசுட்டும் ה, அந்த இடத்தை நோக்கிய இயக்கத்தைக் காட்டுவதால் ‘சுக்கோத்துக்கு’ என்று தரப்பட்டது.
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: ஏறக்குறைய ஆறு இலட்சம்
  rationale: எண்ணுக்கு முன் வரும் כְּ தோராயத்தைக் குறிக்கிறது. தமிழில் தெளிவாகவும் இயல்பாகவும் ‘ஏறக்குறைய’ என்றும், 600,000 என்பதற்கு ‘ஆறு இலட்சம்’ என்றும் தரப்பட்டது.
- source_word: רַגְלִי
  choice: கால்நடையாகச் சென்ற
  rationale: רגל சார்ந்த இச்சொல் இங்கு நடந்தே பயணித்தவர்களைக் குறிக்கிறது. எண்ணப்படும் ஆண்களுடன் இதன் தொடர்பைத் தெளிவுபடுத்த இவ்வாறு தரப்பட்டது.
- source_word: הַגְּבָרִים
  choice: ஆண்கள்
  rationale: גברים இங்கு பாலினத்தால் ஆண்களைக் குறிப்பாகச் சுட்டுகிறது; ஆகவே பொதுவான ‘மக்கள்’ என்பதற்குப் பதிலாக ‘ஆண்கள்’ எனத் துல்லியமாகத் தரப்பட்டது.
- source_word: לְבַד מִטָּף
  choice: குழந்தைகளைத் தவிர
  rationale: טף சிறு பிள்ளைகள் அல்லது சிறிய சார்ந்திருப்போரைக் குறிக்கலாம். சூழலில் இயல்பான ‘குழந்தைகள்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டு, சொல்லின் விரிவு அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
