revisions:
- from: இஸ்ரவேலின் மக்கள்[a] ராமெசேசிலிருந்து சுக்கோத்துக்குப் புறப்பட்டார்கள்[b]. குழந்தைகளைத் தவிர[d], கால்நடையாகச் சென்ற ஆண்கள் ஏறக்குறைய ஆறு இலட்சம் பேர்[c].
  to: இஸ்ரவேலர் ராமேசேசிலிருந்து சுக்கோத்துக்குப் புறப்பட்டார்கள்[a][b]; கால்நடையாகச் சென்ற ஆண்கள் ஏறக்குறைய ஆறு இலட்சம் பேர், குழந்தைகளைத் தவிர[d][c].
  rationale: 'The revision uses the idiomatic collective name ‘இஸ்ரவேலர்,’ regularizes the Tamil form of Rameses, and keeps the count and its qualifying exclusion together in a single sentence. It preserves all source-level distinctions: approximate quantity, male referent, travel on foot, and children not included in the stated number. Footnote content and anchors are retained, with footnote a adjusted to match the revised main-text wording.'
