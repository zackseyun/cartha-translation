translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய வாக்கியத்தின் தகவல் வரிசை தமிழில் இயல்பாக அமைய இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. எண்ணிக்கையின் தோராயத் தன்மையும், ஆண்களையும் குழந்தைகளையும் வேறுபடுத்தும் மூலத்தின் கூறும் பாதுகாக்கப்பட்டுள்ளன.
