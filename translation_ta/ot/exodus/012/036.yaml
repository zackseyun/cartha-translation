source:
  edition: WLC
  text: וַֽ/יהוָ֞ה נָתַ֨ן אֶת חֵ֥ן הָ/עָ֛ם בְּ/עֵינֵ֥י מִצְרַ֖יִם וַ/יַּשְׁאִל֑וּ/ם וַֽ/יְנַצְּל֖וּ אֶת מִצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: ta
  text: யெகோவா அந்த மக்கள்மேல் எகிப்தியர்கள் தயவு காட்டும்படி செய்தார்; அதனால், அவர்கள் கேட்டதை எகிப்தியர்கள் அவர்களுக்குக் கொடுத்தார்கள்[a]. இவ்வாறு அவர்கள் எகிப்தைக் கொள்ளையிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பாரம்பரியமாக, “எகிப்தியர்கள் அவர்களுக்குக் கடனாகக் கொடுத்தார்கள்.” இங்குள்ள எபிரெய வினைச்சொல், கடனாகக் கொடுத்தல் என்றும் கேட்டதை வழங்குதல் என்றும் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான יהוה என்பதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், பெயராகவே நவீன தமிழில் ஒலிபெயர்க்கிறது.
- source_word: נָתַן אֶת־חֵן
  choice: தயவு கிடைக்கச் செய்தார்
  rationale: சொல்லளவில் ‘தயவைக் கொடுத்தார்’ என்றிருந்தாலும், தமிழில் இயல்பாகவும் காரணவினை நுணுக்கத்துடனும் favorable disposition என்ற பொருளைத் தருகிறது.
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: எகிப்தியர்களின் பார்வையில்
  rationale: ‘எகிப்தின் கண்களில்’ என்ற எபிரெய மரபுத்தொடரின் மதிப்பீடு/மனப்பாங்கு சார்ந்த பொருளைத் தெளிவான தமிழில் தருகிறது; מִצְרַיִם இங்கு மக்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: וַיַּשְׁאִלוּם
  choice: அவர்கள் கேட்டவற்றை எகிப்தியர்கள் அவர்களுக்குக் கொடுத்தார்கள்
  rationale: שאל என்பதன் ஹிஃபில் வடிவம் இங்கு கோரிக்கையை ஏற்று வழங்குதல் அல்லது கடனாகக் கொடுத்தல் எனப் புரிந்துகொள்ளப்படலாம். சூழலுக்கு ஏற்ற வழங்குதல் என்ற பொருள் முதன்மை உரையில் இயல்பாகத் தரப்பட்டு, மற்ற வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיְנַצְּלוּ אֶת־מִצְרָיִם
  choice: அவர்கள் எகிப்தைக் கொள்ளையிட்டார்கள்
  rationale: נצל என்பதன் பியேல் வடிவிலுள்ள உரித்தெடுத்தல்/சூறையாடுதல் என்ற வலிமையையும், எகிப்து என்ற கூட்டு இலக்கையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: וַיַּשְׁאִלוּם என்பது கேட்டதை வழங்கியதா அல்லது கடனாகக் கொடுத்ததா
  choice: அவர்கள் கேட்டவற்றை எகிப்தியர்கள் அவர்களுக்குக் கொடுத்தார்கள்
  alternative: எகிப்தியர்கள் அவர்களுக்குக் கடனாகக் கொடுத்தார்கள்
  rationale: கதையின் சூழல் இஸ்ரவேலரின் கோரிக்கைகளுக்கு எகிப்தியர்கள் சாதகமாக இணங்கியதையும் அதன் விளைவாக எகிப்து கொள்ளையிடப்பட்டதையும் வலியுறுத்துகிறது. சாதாரணமாகத் திருப்பிச் செலுத்த வேண்டிய வணிகக் கடன் என்ற கருத்தை முதன்மை உரை தேவையின்றி ஏற்படுத்தாமல், சொற்பொருளில் சாத்தியமான பாரம்பரிய வாசிப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. முதல் வாக்கியத்தில் உள்ள இரு ‘அவர்கள்’ குழுக்களின் குழப்பத்தைத் தவிர்க்க ‘எகிப்தியர்கள்’ மீண்டும் வெளிப்படையாகக் கூறப்பட்டுள்ளது. இறுதி வாக்கியத்தின் ‘கொள்ளையிட்டார்கள்’ மூலத்தின் தீவிரத்தையும் கதையின் இறையியல் பதற்றத்தையும் மென்மையாக்காமல் காக்கிறது.
