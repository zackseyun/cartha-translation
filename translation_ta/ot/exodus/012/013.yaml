base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: ta
  text: அந்த இரத்தம் நீங்கள் இருக்கும் வீடுகளின்மேல் உங்களுக்கான ஓர் அடையாளமாக இருக்கும். நான் அந்த இரத்தத்தைக் காணும்போது, உங்களைக் கடந்து செல்வேன்[a]. நான் எகிப்து நாட்டைத் தாக்கும்போது, அழிவை உண்டாக்கும்[b] எந்த வாதையும் உங்களிடையே இருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களைத் தப்புவிப்பேன்”; அல்லது, “உங்களைப் பாதுகாப்பேன்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல்லை பெயர்ச்சொல் பொருளில் “அழிப்பவன்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: அந்த இரத்தம் உங்களுக்கான ஓர் அடையாளமாக இருக்கும்
  rationale: எதிர்கால வாக்குறுதி உணர்வையும், இரத்தம் இஸ்ரவேலருக்காக அடையாளமாகச் செயல்படுவதையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: நீங்கள் இருக்கும் வீடுகளின்மேல்
  rationale: இரத்தம் பூசப்பட்ட இடத்தையும், அந்த வீடுகளில் இஸ்ரவேலர் இருப்பதையும் நேரடியாகக் காக்கிறது.
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: நான் அந்த இரத்தத்தைக் காணும்போது
  rationale: எபிரெய இணைப்புச் சொல் இங்கு நிகழ்வுகளின் காலத் தொடர்பைக் காட்டுவதால், தமிழில் இயல்பான காலவாக்கியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: உங்களைக் கடந்து செல்வேன்
  rationale: פסח என்பதன் அடிப்படைப் படிமத்தையும் பஸ்கா நிகழ்வுடனான சொல் தொடர்பையும் காக்கிறது; ‘காப்பாற்றுவேன்’ என்ற விளைவை மட்டும் முதன்மைப்படுத்தவில்லை.
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: வாதை எதுவும் உங்களிடையே இருக்காது
  rationale: נֶגֶף என்பதற்கு சூழலுக்கேற்ற ‘வாதை’ என்பதும், בָכֶם என்பதற்கு ‘உங்களிடையே’ என்பதும் தேர்ந்தெடுக்கப்பட்டன.
- source_word: לְמַשְׁחִית
  choice: அழிப்பதற்கான
  rationale: இவ்வடிவத்தை நோக்கம் அல்லது விளைவைக் குறிக்கும் வினைச்சொல் சார்ந்த தொடராக வழங்குகிறது; தனிப்பட்ட ‘அழிப்பவன்’ ஒருவரை முதன்மை உரையில் கட்டாயமாக்கவில்லை.
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: நான் எகிப்து நாட்டைத் தாக்கும்போது
  rationale: காலத்தைக் குறிக்கும் infinitive construct-ஐ தெளிவான நவீன தமிழில் வழங்கி, தேவனே தாக்கும் செயலைச் செய்கிறார் என்பதைத் தக்கவைக்கிறது.
theological_decisions:
- issue: וּפָסַחְתִּי עֲלֵכֶם என்பதன் துல்லியமான நுட்பப் பொருள்
  choice: உங்களைக் கடந்து செல்வேன்
  alternative: உங்களைத் தப்புவிப்பேன்; உங்களைப் பாதுகாப்பேன்
  rationale: முதன்மை வாசகம் பஸ்காவுடனான சொல்லியல் மற்றும் நிகழ்வியல் தொடர்பைக் காக்கிறது; காத்தல் அல்லது தப்புவித்தல் என்ற சாத்தியமான நுட்பங்களை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: לְמַשְׁחִית என்பது அழிவின் நோக்கத்தையா தனிப்பட்ட அழிப்பவனையா குறிக்கிறது
  choice: அழிப்பதற்கான
  alternative: அழிப்பவனுக்கான / அழிப்பவன் வரும்படியான
  rationale: எபிரெய வடிவம் நோக்கம் அல்லது விளைவாகவும், பெயர்ச்சொல் தன்மையுடன் ‘அழிப்பவன்’ என்றும் புரிந்துகொள்ளப்படலாம். முதன்மை வாசகம் தனிப்பட்ட முகவரைத் தேவையின்றி சேர்க்காமல், மாற்று வாசிப்பை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதவாக்கியத்திற்குரிய செறிவும் காக்கப்பட்டுள்ளன. ‘வாதை’ என்பது இச்சூழலில் பரவலாகப் புரியக்கூடிய வேதாகமச் சொல்; அரிதான அல்லது சமயப்பிரிவு சார்ந்த கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளன.
