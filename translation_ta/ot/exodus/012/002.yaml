  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: ta
  text: “இந்த மாதம்[a] உங்களுக்கு மாதங்களின் தொடக்கமாக இருக்கும்; ஆண்டின் மாதங்களில் இது உங்களுக்கு முதலாவது மாதமாக இருக்கும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தப் புதுநிலவு’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் புதுநிலவுடன் தொடர்புடையது. இங்கே அது நாட்காட்டி மாதத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: இந்த மாதம்
  rationale: சட்டரீதியான நாட்காட்டிச் சூழலில் חֹדֶשׁ இயல்பாக ‘மாதம்’ என்பதைக் குறிக்கிறது; அது அமாவாசைச் சுழற்சியோடு தொடர்புடைய சொல்லாகவும் இருப்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָכֶם
  choice: உங்களுக்கு
  rationale: இந்த நாட்காட்டி நிர்ணயம் இஸ்ரவேலரைச் சார்ந்தது என்பதை உறவு/குறிப்பு பொருளுடைய முன்னொட்டு காட்டுகிறது; ‘உங்களுக்கு’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: רֹאשׁ חֳדָשִׁים
  choice: மாதங்களின் தொடக்கம்
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; காலவரிசையில் அது ‘தொடக்கம்’ அல்லது ‘முதல்’ என்ற மரபுத்தொடர்ப் பொருளைக் கொண்டுள்ளது.
- source_word: רִאשׁוֹן הוּא
  choice: இது முதலாவது மாதமாக இருக்கும்
  rationale: רִאשׁוֹן வரிசையில் முதன்மையைத் தெளிவாகக் குறிக்கிறது. தமிழில் பொருள் முழுமையடைய ‘மாதம்’ மீண்டும் கூறப்படுகிறது; הוּא-வின் இணைப்புப் பணி ‘இது ... இருக்கும்’ என வெளிப்படுத்தப்படுகிறது.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: ஆண்டின் மாதங்களில்
  rationale: இந்த மாதம் ஆண்டை அமைக்கும் மாதங்களுக்குள் முதலாவது என்பதைக் கூறும் எபிரெயச் சொற்றொடரின் பரப்புப் பொருளை இது தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சட்டம் நிறுவும் சூழலில் வினைச்சொல் இல்லாத எபிரெய வாக்கியத்தின் வலிமை
  choice: ‘இருக்கும்’ என்ற எதிர்கால/நிறுவல் வலிமையுடன் மொழிபெயர்த்தல்
  alternative: ‘ஆகும்’ அல்லது ‘இருக்கிறது’ என்ற எளிய நிகழ்கால விளக்கம்
  rationale: எபிரெயத்தில் வெளிப்படையான வினைச்சொல் இல்லாவிட்டாலும், சுற்றியுள்ள உரை கடவுள் இஸ்ரவேலின் நாட்காட்டியை நிறுவும் கட்டளையாக உள்ளது. ‘இருக்கும்’ என்பது வெறும் விளக்கமாக மட்டுமல்லாமல் நிறுவும் வலிமையையும் இயல்பான தமிழில் உணர்த்துகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, எளிதில் புரியும் கண்ணியமான நடை. மூலத்தின் மீளுரையையும் ‘உங்களுக்கு’ என்ற இருமுறை வலியுறுத்தலையும் பாதுகாத்துள்ளது.
