revisions:
- from: 'நள்ளிரவில், யாவே எகிப்து நாட்டிலிருந்த முதற்பேறான அனைவரையும் வீழ்த்தினார்: அரியணையில் அமர்ந்திருந்த பார்வோனின் முதற்பேறானவன் தொடங்கி, சிறைக்குழியில் இருந்த சிறைப்பட்டவரின் முதற்பேறானவன்[a] வரை; கால்நடைகளின் முதற்பேறான அனைத்தையும் வீழ்த்தினார்.'
  to: நள்ளிரவில், யாவே எகிப்து நாட்டிலிருந்த எல்லா முதற்பேறானோரையும்—அரியணையில் அமர்ந்திருந்த பார்வோனின் முதற்பேறானவன் முதல் சிறைக்குழியில் இருந்த சிறைப்பட்டவனின் முதற்பேறானவன்[a] வரை—கால்நடைகளின் எல்லா முதற்பேறுகளையும் வீழ்த்தினார்.
  rationale: திருத்தம் பொருளை மாற்றாமல், மூலத்தின் ஒரே வினை அமைப்பைத் தமிழில் காக்கிறது; மேலும் ‘எல்லா முதற்பேறானோர்’ என்ற இயல்பான சொல்லாட்சியைப் பயன்படுத்துகிறது. வரம்பைக் குறிக்கும் ‘முதல் ... வரை’ அமைப்பும் அடிக்குறிப்பு நங்கூரமும் பாதுகாக்கப்பட்டுள்ளன.
