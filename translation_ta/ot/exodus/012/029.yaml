  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: ta
  text: நள்ளிரவில், யாவே எகிப்து நாட்டிலிருந்த எல்லா முதற்பேறானோரையும்—அரியணையில் அமர்ந்திருந்த பார்வோனின் முதற்பேறானவன் முதல் சிறைக்குழியில் இருந்த சிறைப்பட்டவனின் முதற்பேறானவன்[a] வரை—கால்நடைகளின் எல்லா முதற்பேறுகளையும் வீழ்த்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறைக்குழியில் இருந்த கைதியின் முதற்பேறானவன்.”
    reason: שְׁבִי என்பது முதன்மையாகச் சிறைபிடிக்கப்பட்டவனைக் குறிக்கிறது; சிறைக்குழி என்ற சூழலில் ‘கைதி’ என்பது பொருத்தமான மாற்று வாசிப்பாகும்.
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: நள்ளிரவில்
  rationale: கதைத் தொடரைக் குறிக்கும் וַיְהִי என்பதற்குத் தமிழில் தனியான பழமையான தொடர் தேவையில்லை; காலக் குறிப்பு இயல்பாக நிகழ்வைத் தொடங்குகிறது. בַּחֲצִי הַלַּיְלָה என்பதன் இயல்பான நவீனத் தமிழ் இணை ‘நள்ளிரவில்’.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர்; அதன் ஒலிபெயர்ப்பு நவீனத் தமிழில் ‘யாவே’ என வழங்கப்படுகிறது.
- source_word: הִכָּה
  choice: வீழ்த்தினார்
  rationale: נכה என்பது ‘அடித்தல்/தாக்குதல்’ என்னும் உருவகத்தைத் தக்கவைக்கிறது; இச்சூழலில் அதன் விளைவு மரணம். ‘வீழ்த்தினார்’ என்பது அந்தத் தாக்குதலையும் உயிரிழப்பையும் அளவுக்கு மீறி விளக்காமல் தெரிவிக்கிறது.
- source_word: כָל בְּכוֹר
  choice: முதற்பேறான அனைவரையும்
  rationale: בכור என்பது முதலில் பிறந்தவர் அல்லது முதலில் பிறந்த குட்டியைக் குறிக்கிறது. மனிதர்களைப் பற்றிய முதல் கூற்றில் ‘முதற்பேறான அனைவரையும்’ என்பது பகிர்வுப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்த
  rationale: ‘எகிப்து நாட்டில்’ என்ற இடப்பொருளைத் தக்கவைத்தபடி, தாக்கப்பட்டவர்களை விவரிக்கும் தமிழ்ச் சொற்றொடராக அமைக்கப்பட்டுள்ளது.
- source_word: מִבְּכֹר פַּרְעֹה ... עַד בְּכוֹר הַשְּׁבִי
  choice: பார்வோனின் முதற்பேறானவன் தொடங்கி ... சிறைப்பட்டவரின் முதற்பேறானவன் வரை
  rationale: מִן ... עַד என்ற எல்லை அமைப்பை ‘தொடங்கி ... வரை’ எனத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: அரியணையில் அமர்ந்திருந்த
  rationale: பங்கேற்புவினை பார்வோனின் அரச நிலையை விவரிக்கிறது. கடந்தகாலக் கதையோட்டத்தில் ‘அமர்ந்திருந்த’ இயல்பானது.
- source_word: בְּכוֹר הַשְּׁבִי
  choice: சிறைப்பட்டவரின் முதற்பேறானவன்
  rationale: שְּׁבִי என்பது பிடிக்கப்பட்டவர் அல்லது சிறைப்பட்டவரைக் குறிக்கும்; ‘சிறைப்பட்டவர்’ அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: בְּבֵית הַבּוֹר
  choice: சிறைக்குழியில்
  rationale: בּוֹר என்பதன் ‘குழி’ என்ற concrete imagery-யையும், בֵית என்ற சிறைவைக்கும் இடச் சூழலையும் ‘சிறைக்குழி’ சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: கால்நடைகளின் முதற்பேறான அனைத்தையும்
  rationale: בְּהֵמָה இங்கு மாடுகளை மட்டும் அல்லாமல் வளர்ப்பு விலங்குகளைப் பொதுவாகக் குறிக்கிறது; ‘கால்நடைகள்’ அதற்கான இயல்பான தமிழ்ச் சொல்.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய உரை தனிப்பட்ட உடன்படிக்கைப் பெயரையே நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: הִכָּה என்பதில் மரண விளைவை வெளிப்படுத்துதல்
  choice: வீழ்த்தினார்
  alternative: கொன்றார்
  rationale: சூழல் மரணத்தைத் தெளிவுபடுத்தினாலும், மூல வினை ‘அடித்தார்/தாக்கினார்’ என்ற உருவகத்தைக் கொண்டுள்ளது. ‘வீழ்த்தினார்’ அந்த உருவகத்தையும் மரண விளைவையும் ஒன்றாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அரியணை’, ‘சிறைக்குழி’, ‘கால்நடைகள்’ ஆகிய சொற்கள் மூலத்தின் அரசியல், உடல் சார்ந்த, சமூகப் படிமங்களைத் தக்கவைக்கின்றன. மனித முதற்பேறுகளுக்குப் பாலினத்தைக் காட்டும் ஒருமை வடிவம் வரம்புக் கட்டமைப்பில் பயன்படுத்தப்பட்டாலும், தொடக்கத்தின் ‘அனைவரையும்’ முழுமையான பகிர்வுப் பொருளைக் காட்டுகிறது.
