review_pass:
  verdict: revise
  source_fidelity: The temporal construction and plural address are retained, and “மகன்கள்” accurately reflects the masculine plural. However, “வழிபாட்டுப் பணி” unnecessarily narrows and doubles the sense of עֲבֹדָה (‘service’); the Hebrew does not explicitly use a word for worship. Rendering אמר as “கேட்கும்போது” is understandable because the utterance is a question, but “சொல்லும்போது” more closely preserves the source verb without impairing Tamil comprehension.
  naturalness: The quoted question is deliberately terse, as in Hebrew, but “வழிபாட்டுப் பணி” is somewhat cumbersome in modern Tamil. “இந்தச் சேவை உங்களுக்கு என்ன?” is more idiomatic while retaining the source’s open, compressed formulation. The verse properly remains a dependent temporal clause leading into the response in the following verse.
  terminology: “சேவை” preserves the breadth of עֲבֹדָה in this Passover context without forcing either ‘worship’ or ‘ritual.’ The footnote may give “என்ன பொருள்?” as a natural explanatory alternative, but that wording should not replace the deliberately open main text.
  issues:
  - severity: medium
    issue: “வழிபாட்டுப் பணி” over-specifies and is stylistically redundant for הָעֲבֹדָה.
    rationale: The Hebrew term can refer to service or prescribed observance. Although the context is religious, the source does not explicitly say ‘worship,’ and the paired Tamil expression is less direct than necessary.
  - severity: low
    issue: “கேட்கும்போது” shifts the source verb ‘say’ to ‘ask.’
    rationale: The content is interrogative, so the draft is intelligible, but “சொல்லும்போது” retains אמר more closely and still reads naturally in Tamil.
  revised_text: உங்கள் மகன்கள் உங்களிடம், “இந்தச் சேவை உங்களுக்கு என்ன?” என்று சொல்லும்போது[a],
