    reason: எபிரெயச் சொற்றொடரின் சுருக்கமான, சொல் நெருக்கமான அமைப்புக்கான இயல்பான தமிழ் மாற்றை வழங்குகிறது.
  revision_rationale: The revision replaces the over-specified “வழிபாட்டுப் பணி” with the broader, source-faithful “சேவை” and restores ‘say’ with “சொல்லும்போது.” It retains the Hebrew question’s ambiguity in the main text while offering an explicitly marked natural-language alternative in the footnote.
