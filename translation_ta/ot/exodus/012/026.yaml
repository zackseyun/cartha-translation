source:
  edition: WLC
  text: וְ/הָיָ֕ה כִּֽי יֹאמְר֥וּ אֲלֵי/כֶ֖ם בְּנֵי/כֶ֑ם מָ֛ה הָ/עֲבֹדָ֥ה הַ/זֹּ֖את לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/026.yaml
  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: ta
  text: உங்கள் மகன்கள் உங்களிடம், “இந்தச் சேவை உங்களுக்கு என்ன?” என்று சொல்லும்போது[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான தமிழில், “இந்தச் சேவை உங்களுக்கு என்ன பொருள்?”
    reason: எபிரெயச் சொற்றொடரின் சுருக்கமான, சொல் நெருக்கமான அமைப்புக்கான இயல்பான தமிழ் மாற்றை வழங்குகிறது.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் ஒரு சூழலை அறிமுகப்படுத்தும் எபிரெய வழக்கை இயல்பான தமிழில் காலவினை வடிவில் தருகிறது.
- source_word: יֹאמְרוּ
  choice: கேட்கும்போது
  rationale: சொல்லர்த்தம் ‘சொல்வார்கள்’ என்றாலும், தொடர்ந்து வருவது நேரடியான கேள்வி என்பதால் தமிழில் ‘கேட்பார்கள்’ என்பது இயல்பானது; கூறுதலின் உள்ளடக்கம் மாற்றப்படவில்லை.
- source_word: בְּנֵיכֶם
  choice: உங்கள் மகன்கள்
  rationale: ஆண்பால் பன்மையான எபிரெயச் சொல்லைத் துல்லியமாகப் பிரதிபலிக்கிறது; பொதுவான ‘பிள்ளைகள்’ என்று விரிவாக்கவில்லை.
- source_word: הָעֲבֹדָה
  choice: வழிபாட்டுப் பணி
  rationale: இச்சொல்லின் ‘பணி/சேவை’ என்ற அடிப்படைப் பொருளையும் பஸ்கா அனுசரிப்பின் வழிபாட்டுச் சூழலையும் ஒன்றாகத் தக்கவைக்கிறது; ‘சடங்கு’ என்று அளவுக்கு மீறிக் குறுக்கவில்லை.
- source_word: הַזֹּאת
  choice: இந்த
  rationale: அருகுச் சுட்டுப் பெயரடையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לָכֶם
  choice: உங்களுக்கு
  rationale: இரண்டாம் நபர் பன்மை உருபையும், அந்த வழிபாட்டுப் பணிக்கும் சமூகத்திற்கும் உள்ள தொடர்பைக் கேட்கும் எபிரெயச் சொல்லமைப்பையும் காக்கிறது.
- source_word: מָה
  choice: என்ன
  rationale: ‘என்ன?’ என்ற திறந்த கேள்வியை அப்படியே வைத்திருக்கிறது; ‘என்ன பொருள்?’ அல்லது ‘எதற்காக?’ என்று ஒரு குறிப்பிட்ட விளக்கத்தைத் திணிக்கவில்லை.
theological_decisions:
- issue: கேள்வி வழிபாட்டின் பொருளையா, நோக்கத்தையா, அல்லது சமூகத்துடனான தொடர்பையா கேட்கிறது என்பது
  choice: “இந்த வழிபாட்டுப் பணி உங்களுக்கு என்ன?” என்ற திறந்த அமைப்பு
  alternative: “இந்த வழிபாட்டுப் பணி உங்களுக்கு என்ன பொருள்?”
  rationale: எபிரெய மூலத்தில் உள்ள சுருக்கத்தையும் பொருள் சார்ந்த தெளிவின்மையையும் காக்கிறது; கேள்வியை வெறும் தனிப்பட்ட உணர்வு அல்லது ஒரு குறிப்பிட்ட நோக்கம் பற்றியதாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் சுருக்கமான கேள்வியும் அதன் பொருள் சார்ந்த திறந்த தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
