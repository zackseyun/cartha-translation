  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: ta
  text: நீங்கள் சொன்னபடியே, உங்கள் ஆட்டு மந்தைகளையும் மாட்டு மந்தைகளையும் எடுத்துக்கொண்டு புறப்பட்டுப் போங்கள். என்னையும் ஆசீர்வதியுங்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைக்கூட ஆசீர்வதியுங்கள்.” இஸ்ரவேலர் புறப்படும் வேளையில் தானும் ஆசீர்வாதத்தை நாடுவதைப் பார்வோனின் சொற்கள் வலியுறுத்தியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: உங்கள் ஆட்டு மந்தைகளையும் மாட்டு மந்தைகளையும்
  rationale: இரண்டு גַּם சொற்களும் இருவகை கால்நடைகளையும் இணைத்து வலியுறுத்துகின்றன. צֹאן என்பது பொதுவாக ஆடுகளை உள்ளடக்கிய சிறு கால்நடை மந்தையையும், בָּקָר என்பது மாடுகளைக் கொண்ட பெரிய கால்நடை மந்தையையும் குறிக்கிறது; தமிழில் இணையான ‘-ஐயும் ... -ஐயும்’ அமைப்பு இயல்பாக இந்த இணைப்பைப் பேணுகிறது.
- source_word: קְחוּ
  choice: எடுத்துக்கொண்டு
  rationale: இது பன்மை கட்டளை வடிவம். இச்சூழலில் கால்நடைகளைத் தங்களுடன் அழைத்துச் செல்வதற்கான அனுமதியைக் குறிக்க ‘எடுத்துக்கொண்டு’ என்பது இயல்பான தமிழ் நடை.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: நீங்கள் சொன்னபடியே
  rationale: மோசேயும் ஆரோனும் முன்பு கேட்டதற்கு பார்வோன் இணங்குவதை இந்தத் தொடர் காட்டுகிறது; ‘சொன்னபடியே’ என்பது ஒப்புமை மற்றும் துல்லியமான இணக்கத்தைப் பேணுகிறது.
- source_word: וָלֵכוּ
  choice: புறப்பட்டுப் போங்கள்
  rationale: הלך இங்கு எகிப்தைவிட்டுப் புறப்படும்படி சொல்லும் கட்டளையாக உள்ளது. ‘போங்கள்’ என்பதுடன் ‘புறப்பட்டு’ சேர்ப்பது சூழலிலுள்ள வெளியேறுதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבֵרַכְתֶּם
  choice: ஆசீர்வதியுங்கள்
  rationale: ברך என்பதன் நேரடியான பொருள் ‘ஆசீர்வதி’. ஆசீர்வாதம் எவ்வாறு வழங்கப்பட வேண்டும் என்பதை வசனம் விளக்காததால், அதற்கு மேலான விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- source_word: גַּם אֹתִי
  choice: என்னையும்
  rationale: பார்வோன் தன்னையும் ஆசீர்வாதம் பெறுபவராகச் சேர்க்கிறான். ‘என்னையும்’ என்பது இயல்பான தமிழ்; גַּם என்பதிலுள்ள ‘என்னைக்கூட’ என்ற சாத்தியமான வலியுறுத்தல் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பார்வோன் கேட்ட ஆசீர்வாதத்தின் தன்மை
  choice: இதை ஆசீர்வாதத்திற்கான நேரடியான வேண்டுகோளாக மொழிபெயர்த்து, அதன் துல்லியமான தன்மையை விளக்காமல் விடுதல்
  alternative: இஸ்ரவேலின் தேவனிடமிருந்து மோசே மற்றும் ஆரோன் வழியாகப் பரிந்துரைக்கப்படும் ஆசீர்வாதம், அல்லது வழியனுப்பும் நல்வாழ்த்து என்று குறிப்பாக விளக்குதல்
  rationale: ברך என்பது ‘ஆசீர்வதி’ என்று தெளிவாக இருந்தாலும், பார்வோன் தெய்வீக அருளை வேண்டுகிறானா அல்லது வழியனுப்பும் நல்வாழ்த்தைக் கேட்கிறானா என்பதை இவ்வசனம் கூறவில்லை. எளிய சொற்றொடர் அந்தத் தெளிவின்மையையும் இறையியல் பதற்றத்தையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஆட்டு மந்தைகள்’ மற்றும் ‘மாட்டு மந்தைகள்’ என்ற சொற்கள் மூலமொழியிலுள்ள சிறு மற்றும் பெரிய கால்நடை வகைகளின் வேறுபாட்டைப் பேணுகின்றன; வாக்கியப் பிரிப்பு கட்டளையையும் இறுதி வேண்டுகோளையும் தெளிவாக்குகிறது.
