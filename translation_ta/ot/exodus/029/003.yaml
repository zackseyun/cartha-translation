base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: ta
  text: அவற்றை ஒரே கூடைக்குள் வைத்து,[a] அவற்றைக் கூடையோடு காளையையும் இரண்டு செம்மறியாட்டுக் கடாக்களையும் அருகில் கொண்டுவர வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரே கூடையில்.’ எபிரெய முன்னிடைச்சொல்லின் நேரடிப் பொருள் ‘மேல்’; ஆனால் பொருட்களைக் கொள்கலனில் வைக்கும் இச்சூழலில், அவற்றைக் கூடைக்குள் வைப்பதே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: ‘அருகில் கொண்டுவர’ என்பது பலிச்சடங்கில் பயன்படுத்தப்படும் எபிரெய வினைச்சொல். இதை ‘சமர்ப்பிக்க’ அல்லது ‘படைக்க’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ אוֹתָם
  choice: அவற்றை ... வைத்து
  rationale: נתן என்பதன் ‘வை/இடு’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘அவை’ முந்தைய வசனத்தில் கூறப்பட்ட அப்ப வகைகளைக் குறிக்கிறது.
- source_word: עַל סַל אֶחָד
  choice: ஒரே கூடையில்
  rationale: עַל என்பதன் நேரடிப் பொருள் ‘மேல்’ என்றாலும், பொருட்களைக் கொள்கலனில் வைக்கும் இச்சூழலில் ‘கூடையில்’ என்பதே இயல்பான பொருள்; אֶחָד ஒரே கூடையைக் குறிக்கிறது.
- source_word: וְהִקְרַבְתָּ
  choice: அருகில் கொண்டுவர வேண்டும்
  rationale: பலிச்சடங்கில் பயன்படும் הקריב என்பதன் அடிப்படை உருவகமான ‘அருகில் கொண்டுவருதல்’ என்பதைப் பாதுகாக்கிறது; ‘படைக்க வேண்டும்’ என்று சடங்கின் அடுத்த கட்டத்தை முன்கூட்டியே குறிப்பதில்லை.
- source_word: בַּסָּל
  choice: கூடையில் உள்ள
  rationale: அப்ப வகைகள் கூடைக்குள் இருக்கும்போதே கொண்டுவரப்படுகின்றன என்பதை בְּ தெளிவாக்குகிறது.
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: காளையையும் இரண்டு செம்மறியாட்டுக் கடாக்களையும்
  rationale: மீண்டும் வரும் நேர் செயப்படுபொருள் குறிகள், கூடையிலுள்ள பொருட்களோடு காளையும் இரண்டு கடாக்களும் கொண்டுவரப்பட வேண்டும் என்பதைக் காட்டுகின்றன.
- source_word: הַפָּר
  choice: காளை
  rationale: פַּר என்பதற்கான நேரடியான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: שְׁנֵי הָאֵילִם
  choice: இரண்டு செம்மறியாட்டுக் கடாக்கள்
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; ‘கடா’ மட்டும் பிற விலங்குகளையும் குறிக்கக்கூடும் என்பதால் வகை தெளிவுபடுத்தப்பட்டது.
theological_decisions:
- issue: הקריב என்ற பலிச்சடங்கு வினையின் மொழிபெயர்ப்பு
  choice: அருகில் கொண்டுவர வேண்டும்
  alternative: படைக்க வேண்டும் / சமர்ப்பிக்க வேண்டும்
  rationale: இவ்வசனத்தில் அப்பங்களும் விலங்குகளும் சடங்கிற்காக அருகில் கொண்டுவரப்படுகின்றன. ‘படைக்க’ என்பது பலியிடும் செயல் ஏற்கெனவே நடைபெறுவதாகத் தோன்றச் செய்யலாம்; மூலச்சொல்லின் பரந்த சடங்குப் பொருளையும் நிகழ்வின் கட்டத்தையும் ‘அருகில் கொண்டுவர’ பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சடங்கு வழிமுறைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. முந்தைய வசனத்திலுள்ள அப்ப வகைகளைச் சுட்ட ‘அவற்றை’ பயன்படுத்தப்பட்டது. வசன இறுதியில் உள்ள குறிப்புக்குறி [b], ‘அருகில் கொண்டுவர’ என்ற சொற்றொடருக்கான மாற்று மொழிபெயர்ப்பை விளக்குகிறது.
