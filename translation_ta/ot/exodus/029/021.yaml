base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: ta
  text: பின்பு, பலிபீடத்தின்மேல் இருக்கும் இரத்தத்தில் கொஞ்சத்தையும் அபிஷேக எண்ணெயில் கொஞ்சத்தையும் எடுத்து, அவற்றை ஆரோன்மேலும் அவனுடைய ஆடைகள்மேலும், அவனோடு அவனுடைய மகன்கள்மேலும் அவர்களுடைய ஆடைகள்மேலும் தெளிப்பாய். அப்போது அவனும் அவனுடைய ஆடைகளும், அவனோடு அவனுடைய மகன்களும் அவர்களுடைய ஆடைகளும் பரிசுத்தமாக இருப்பார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிரதிஷ்டை செய்யப்பட்டவையாகும்.” எபிரேய மொழியில் சொல்லுக்கு சொல் “பரிசுத்தமாக இருப்பார்கள்”; இது இந்தச் சடங்கின் விளைவாக ஏற்படும் பரிசுத்த நிலையை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחְתָּ
  choice: எடுத்து
  rationale: இணைப்புடன் வரும் Qal perfect இங்கு சடங்கு வழிமுறையின் தொடர்ச்சியான கட்டளையை உணர்த்துகிறது; தமிழில் ‘எடுத்து ... தெளிப்பாய்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல் இருக்கும் இரத்தத்தில் கொஞ்சத்தை
  rationale: מִן ஒரு பகுதியை எடுத்துக்கொள்வதைக் குறிக்கிறது; ‘கொஞ்சத்தை’ என்பது அந்தப் பகுதி சார்ந்த பொருளை வெளிப்படுத்துகிறது, அத்துடன் தொடர்புச் சொற்றொடரும் தக்கவைக்கப்படுகிறது.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெய்
  rationale: அபிஷேகம் செய்வதற்குப் பயன்படும் எண்ணெயைக் குறிக்கும் நிலையான சமயச் சொற்றொடர்; நவீனத் தமிழிலும் பரவலாகப் புரியக்கூடியது.
- source_word: הִזֵּיתָ
  choice: தெளிப்பாய்
  rationale: Hiphil வடிவமான נזה வழிபாட்டுச் சூழலில் திரவத்தைத் தெளிப்பதைக் குறிக்கிறது. இரண்டு பொருட்கள் குறிப்பிடப்படுவதால், தமிழில் ‘அவற்றை’ என்ற பன்மைச் சுட்டுப்பெயர் தெளிவை அளிக்கிறது.
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: அவனுடைய ஆடைகள் / அவர்களுடைய ஆடைகள்
  rationale: בגד என்பதன் பொதுவான பொருள் ‘ஆடை’; பிற்கால மதப் பதவியாடை சார்ந்த சிறப்புப் பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: בָּנָיו
  choice: அவனுடைய மக்கள்
  rationale: இங்கு אהרן என்பவரின் ஆண் பிள்ளைகளைக் குறிப்பதால், நவீனத் தமிழில் இயல்பான ‘மக்கள்’ என்ற குடும்ப உறவுச் சொல் பயன்படுத்தப்படுகிறது; சூழல் அவர்கள் மகன்கள் என்பதைத் தெளிவாக்குகிறது.
- source_word: אִתּוֹ
  choice: அவனோடு இருக்கும்
  rationale: ஆரோனுடன் சேர்ந்திருப்பதை நேரடியாக வெளிப்படுத்துகிறது; எபிரேயத்தின் மீளுரைப்பையும் பொருள்மாறாமல் காக்கிறது.
- source_word: וְקָדַשׁ
  choice: பரிசுத்தமாக இருப்பார்கள்
  rationale: சடங்கின் விளைவாக உருவாகும் קדשׁ சார்ந்த பரிசுத்த நிலையைத் தக்கவைக்கிறது; ‘பிரதிஷ்டை செய்யப்படுவார்கள்’ என்று செயல்முறையை மட்டும் முன்னிறுத்தவில்லை.
- source_word: הוּא
  choice: அவன்
  rationale: முன்னர் பெயரிடப்பட்ட ஆரோனைச் சுட்டும் எபிரேயப் பிரதிப்பெயரைத் தமிழிலும் இயல்பாகத் தொடர்கிறது.
theological_decisions:
- issue: சடங்கின் விளைவான பரிசுத்த நிலையை மொழிபெயர்த்தல்
  choice: பரிசுத்தமாக இருப்பார்கள்
  alternative: அர்ப்பணிக்கப்பட்டவர்களாக இருப்பார்கள் / பிரதிஷ்டை செய்யப்படுவார்கள்
  rationale: קדשׁ என்ற மூலச்சொல் சடங்குக்குப் பிந்தைய பரிசுத்த நிலையைச் சொல்கிறது. ‘பரிசுத்தம்’ என்பது மூலத்தின் இறையியல் வகைப்பாட்டை நேரடியாகக் காக்கிறது; ஒரு குறிப்பிட்ட திருச்சபை மரபின் தொழில்நுட்பச் சொல்லை இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுமக்களுக்கு விளங்கும், கண்ணியமான வழிபாட்டுச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரேயத்தின் தொடர்ச்சியான சடங்கு வழிமுறையும் பட்டியல் அமைப்பும் இயல்பான தமிழ் வாக்கிய ஓட்டத்துடன் பாதுகாக்கப்பட்டுள்ளன.
