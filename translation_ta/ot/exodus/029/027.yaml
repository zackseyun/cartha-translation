base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: ta
  text: “அசைவாட்டுக் காணிக்கையின் மார்புப்பகுதியையும், உயர்த்திப் படைக்கும் காணிக்கையின்[a] தொடைப்பகுதியையும் நீ புனிதமாக ஒதுக்கிவைக்க வேண்டும். அசைவாட்டப்பட்ட அந்த மார்புப்பகுதியும் உயர்த்தப்பட்ட அந்த தொடைப்பகுதியும், குருத்துவ நியமனத்திற்கான ஆட்டுக்கடாவிலிருந்து[b]—ஆரோனுக்குரியதிலிருந்தும் அவன் மகன்களுக்குரியதிலிருந்தும்—எடுக்கப்பட்டவை.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உயர்த்தப்பட்ட காணிக்கையின்”; மரபாக, “தூக்கிப் படைக்கும் காணிக்கையின்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “நிரப்புதல்களின் ஆட்டுக்கடா.” இது ஆசாரியர்களைக் குருத்துவப் பணியில் அமர்த்தும் சடங்கில் பயன்படுத்தப்பட்ட ஆட்டுக்கடாவைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: புனிதமாக ஒதுக்கிவைக்க வேண்டும்
  rationale: பியேல் வடிவம் ஒன்றைப் புனிதமானதாகத் தனியே ஒதுக்குவதைக் குறிக்கிறது. இச்சொற்றொடர் பலிச் சடங்கின் வலிமையையும் நவீனத் தமிழின் தெளிவையும் காக்கிறது.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: அசைவாட்டுக் காணிக்கையின் மார்புப்பகுதி
  rationale: மிருகத்தின் குறிப்பிட்ட மார்புப் பகுதியையும் அதை ஆண்டவர்முன் அசைவாட்டும் சடங்கையும் தெளிவாகக் காட்டுகிறது.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: உயர்த்திப் படைக்கும் காணிக்கையின் தொடைப்பகுதி
  rationale: שׁוֹק என்பது மேல் பின்னங்காலான தொடைப்பகுதியைக் குறிக்கிறது; תְּרוּמָה என்பதிலுள்ள உயர்த்துதல் மற்றும் ஒதுக்கிப்படைத்தல் ஆகிய இரு கருத்துகளையும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: הוּנַף
  choice: அசைவாட்டப்பட்டது
  rationale: תְּנוּפָה என்ற பெயர்ச்சொல்லுக்கும் נוף என்ற வினைக்கும் இடையிலான மூலமொழித் தொடர்பைத் தக்கவைக்கிறது.
- source_word: הוּרָם
  choice: உயர்த்தப்பட்டது
  rationale: תְּרוּמָה உடன் தொடர்புடைய சடங்கு நடவடிக்கையை வெளிப்படையாகக் காட்டுகிறது.
- source_word: אֵיל הַמִּלֻּאִים
  choice: குருத்துவ நியமனத்திற்கான ஆட்டுக்கடா
  rationale: சொல்லுக்குச் சொல் வடிவமான ‘நிரப்புதல்களின் ஆட்டுக்கடா’ என்பதற்குப் பதிலாக, ஆசாரியர்களைப் பணியில் அமர்த்தும் சடங்கு என்ற எபிரேய மரபுத்தொடரின் பொருளை இயல்பாகத் தருகிறது.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: ஆரோனுக்குரியதிலிருந்தும் அவன் மகன்களுக்குரியதிலிருந்தும்
  rationale: ஆரோனோடும் அவன் மகன்களோடும் தொடர்புடைய பங்குகளை வேறுபடுத்தும் மூலமொழி அமைப்பைப் பாதுகாக்கிறது; அந்தப் பங்குகளின் சரியான பகிர்வை மொழிபெயர்ப்பு மேலதிகமாக நிர்ணயிக்கவில்லை.
theological_decisions:
- issue: பலிச் சடங்குக்குரிய தொழில்நுட்பச் சொற்களை மொழிபெயர்த்தல்
  choice: ‘அசைவாட்டுக் காணிக்கை,’ ‘உயர்த்திப் படைக்கும் காணிக்கை,’ ‘அசைவாட்டப்பட்டது,’ ‘உயர்த்தப்பட்டது’ என்ற கண்கூடான சடங்கு மொழியைத் தக்கவைத்தல்
  alternative: ‘சமர்ப்பணக் காணிக்கை’ அல்லது ‘சிறப்புப் பங்கு’ போன்ற பொதுவான விளக்கச் சொற்களைப் பயன்படுத்துதல்
  rationale: எபிரேய உரை பெயர்ச்சொற்களையும் அவற்றுக்குரிய சடங்கு வினைகளையும் திட்டமிட்டு இணைக்கிறது. அந்த இணைப்பைப் பாதுகாப்பது ஆசாரியச் சட்டத்தின் நடைமுறைத் தன்மையைத் தெளிவாகக் காட்டி, பிற்கால இறையியல் விளக்கங்களை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட-சடங்கு நடை பயன்படுத்தப்பட்டுள்ளது. ‘புனிதமாக ஒதுக்கிவைக்க’ என்பது வழிபாட்டுச் சூழலைக் காக்கிறது; அடிக்குறிப்புகள் மூலமொழியின் மாற்று மற்றும் சொல்லுக்குச் சொல் வடிவங்களை வெளிப்படுத்துகின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
