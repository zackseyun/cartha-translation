    issue: The two ritual passive verbs are applied collectively to both portions.
    rationale: הוּנַף and הוּרָם are singular and most naturally correspond respectively to the breast and thigh. A revision should state that the breast was waved and the thigh was raised, rather than saying collectively that "they were waved and raised."
