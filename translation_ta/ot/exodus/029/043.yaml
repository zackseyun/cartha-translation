  text: וְ/נֹעַדְתִּ֥י שָׁ֖מָּ/ה לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נִקְדַּ֖שׁ בִּ/כְבֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: ta
  text: அங்கே நான் இஸ்ரவேலின் மக்களைச் சந்திப்பேன்[a]; அது என் மகிமையால் பரிசுத்தமாக்கப்படும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, ‘இஸ்ரவேலின் மகன்களை’; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான உடன்படிக்கைச் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘அது’ என்பதற்கான எழுவாய் எபிரெயத்தில் வெளிப்படையாகக் கூறப்படவில்லை. சூழலில் உள்ள பரிசுத்த இடத்தைப் பொதுவாகவோ, குறிப்பாகச் சந்திப்புக் கூடாரத்தையோ பலிபீடத்தையோ இது குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: நான் சந்திப்பேன்
  rationale: יעד என்பதன் நிஃபால் வடிவம் இங்கு தேவனால் நியமிக்கப்பட்ட சந்திப்பைக் குறிக்கிறது; கூடாரச் சூழலில் இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: שָׁמָּה
  choice: அங்கே
  rationale: முன்னர் கூறப்பட்ட பரிசுத்த இடத்தைச் சுட்டும் இடவினையடை; தமிழில் தெளிவான இயல்பான வடிவம்.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களைச்
  rationale: எபிரெயச் சொல்லமைப்பை ஓரளவு வெளிப்படையாகப் பேணுகிறது; அதேவேளையில் உடன்படிக்கை மக்களாகிய இஸ்ரவேலரை உள்ளடக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: וְנִקְדַּשׁ
  choice: அது ... பரிசுத்தமாக்கப்படும்
  rationale: קדש என்பதன் நிஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளைப் பேணுகிறது. எழுவாய் வெளிப்படையாக இல்லாததால், குறிப்பிட்ட பொருளைத் தீர்மானிக்காமல் ‘அது’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: בִּכְבֹדִי
  choice: என் மகிமையால்
  rationale: בְּ இங்கு கருவிப் பொருளைக் கொண்டதாகப் புரிந்துகொள்ளப்படுகிறது; தேவனுடைய மகிமையே பரிசுத்தமாக்கும் காரணம் அல்லது செயலாற்றும் வழி என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: ‘பரிசுத்தமாக்கப்படும்’ என்பதன் மறைந்துள்ள எழுவாய்
  choice: ‘அது’ என்று பொதுவாகக் கொடுத்து, சூழலில் உள்ள பரிசுத்த இடத்தைக் குறிக்க விடப்பட்டுள்ளது.
  alternative: சந்திப்புக் கூடாரம்; பலிபீடம்; அல்லது ஆரோன் என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: எபிரெய வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் இருந்தாலும், இவ்வசனத்தில் எழுவாய் வெளிப்படையாக இல்லை. சந்திப்புக் கூடாரம் அல்லது பலிபீடம் என்று குறிப்பிட்டுவிடாமல் மூலத்தின் உண்மையான தெளிவின்மையைப் பேணுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலர்
  rationale: இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான உடன்படிக்கை இனப்பெயர். ‘மக்கள்’ என்பது முழுச் சமூகத்தையும் இயல்பாகக் குறிக்கிறது; அடிக்குறிப்பு சொற்படியான வடிவத்தையும் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தமாக்கப்படும்’ என்பது மூலத்தின் செயப்பாட்டு வடிவத்தையும் வழிபாட்டுச் சூழலையும் பேணுகிறது; மறைந்துள்ள எழுவாயின் தெளிவின்மை தீர்க்கப்படவில்லை.
