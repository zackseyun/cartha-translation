  to: அவர்களுக்கு, அதாவது ஆரோனுக்கும் அவன் மகன்களுக்கும், இடைக்கச்சைகளைக் கட்டி, அவர்களுக்குத் தலைப்பாகைகளையும் அணிவிப்பாய். ஆசாரியத்துவம் அவர்களுக்கு நிரந்தர நியமமாக இருக்கும். இவ்வாறு ஆரோனையும் அவன் மகன்களையும் ஆசாரியப் பணிக்கு நியமிப்பாய்.[a]
  rationale: The revision clarifies the legal-predicative force of לְחֻקַּת עוֹלָם, uses a more natural Tamil expression for priestly installation, and makes the literal footnote conform more closely to the Hebrew wording. No disputed theological interpretation is introduced.
