  text: וְ/חָגַרְתָּ֩ אֹתָ֨/ם אַבְנֵ֜ט אַהֲרֹ֣ן וּ/בָנָ֗י/ו וְ/חָבַשְׁתָּ֤ לָ/הֶם֙ מִגְבָּעֹ֔ת וְ/הָיְתָ֥ה לָ/הֶ֛ם כְּהֻנָּ֖ה לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מִלֵּאתָ֥ יַֽד אַהֲרֹ֖ן וְ/יַד בָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: ta
  text: அவர்களுக்கு, அதாவது ஆரோனுக்கும் அவன் மகன்களுக்கும், இடைக்கச்சைகளைக் கட்டி, அவர்களுக்குத் தலைப்பாகைகளையும் அணிவிப்பாய். ஆசாரியத்துவம் அவர்களுக்கு நிரந்தர நியமமாக இருக்கும். இவ்வாறு ஆரோனையும் அவன் மகன்களையும் ஆசாரியப் பணிக்கு நியமிப்பாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “ஆரோனின் கையையும் அவன் மகன்களின் கையையும் நிரப்புவாய்.” இது அவர்களை ஆசாரியப் பணிக்கு நிறுவுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: இடைக்கச்சைகளைக் கட்டி
  rationale: חגר என்பது இடுப்பைச் சுற்றிக் கட்டுவதையும், אַבְנֵט ஆசாரிய உடையின் இடைக்கச்சையையும் குறிக்கிறது. இத்தமிழாக்கம் ஆடை அணிவிக்கும் செயலை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: אַהֲרֹן וּבָנָיו
  choice: ஆரோனுக்கும் அவன் மகன்களுக்கும்
  rationale: இந்த இடைச்செருகல் முன்வரும் ‘அவர்களுக்கு’ என்பது யாரைக் குறிக்கிறது என்பதைத் தெளிவுபடுத்துகிறது; எபிரெய உரையின் appositional அமைப்பும் பாதுகாக்கப்படுகிறது.
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: அவர்களுக்குத் தலைப்பாகைகளையும் அணிவிப்பாய்
  rationale: חבש தலையில் கட்டுதல் அல்லது அணிவித்தலைக் குறிக்கிறது; מִגְבָּעוֹת இங்கு பொதுவான தொப்பிகள் அல்ல, ஆசாரியருக்குரிய தனித்த தலை ஆடைகள். ‘தலைப்பாகைகள்’ இந்த வேறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: ஆசாரியத்துவம் அவர்களுக்கு உரியதாக இருக்கும்
  rationale: לָהֶם உடையமை அல்லது ஒதுக்கீட்டைக் குறிக்கிறது. ‘உரியதாக இருக்கும்’ என்பது ஆசாரியப் பதவி அவர்களுக்கு அளிக்கப்படுவதைத் தெளிவாகக் கூறுகிறது.
- source_word: לְחֻקַּת עוֹלָם
  choice: நிரந்தரமான நியமத்தின்படி
  rationale: חֻקָּה நிலைநிறுத்தப்பட்ட நியமத்தையும் עוֹלָם நீடித்த, நிரந்தரத் தன்மையையும் குறிக்கிறது. உடனுள்ள உடன்படிக்கைச் சட்டச் சூழலை மீறி தத்துவார்த்த முடிவைத் திணிக்காமல் அதன் வலிமையை இச்சொற்றொடர் காக்கிறது.
- source_word: וּמִלֵּאתָ יַד
  choice: ஆசாரியப் பணியில் அமர்த்துவாய்
  rationale: சொல்லுக்குச் சொல் ‘கையை நிரப்புதல்’ என்றாலும், இது ஒருவரை ஆசாரியப் பதவியில் நிறுவுவதற்கான தொழில்நுட்ப மரபுத்தொடர். ‘ஆசாரியப் பணியில் அமர்த்துதல்’ அதன் சூழல்சார் பொருளைத் தெளிவாகத் தருகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: לְחֻקַּת עוֹלָם என்ற வழிபாட்டுச் சட்டத்தின் காலநீட்சி
  choice: நிரந்தரமான நியமத்தின்படி
  alternative: என்றென்றைக்குமான கட்டளையாக
  rationale: இந்தச் சொற்றொடர் இஸ்ரவேலின் உடன்படிக்கை ஒழுங்குக்குள் ஆசாரியத்துவத்தின் நீடித்த நிலையைச் சுட்டுகிறது. ‘நிரந்தரமான’ என்பது அதன் தொடரும் வலிமையைப் பாதுகாத்தாலும், உடனுள்ள சட்டச் சூழலுக்கு அப்பால் முழுமையான காலமின்மையைத் திணிப்பதில்லை.
- issue: וּמִלֵּאתָ יַד என்ற ஆசாரிய நிறுவல் மரபுத்தொடர்
  choice: ஆசாரியப் பணியில் அமர்த்துவாய்
  alternative: ஆரோனின் கையையும் அவன் மகன்களின் கைகளையும் நிரப்புவாய்
  rationale: எபிரெய மரபுத்தொடர் ஆசாரியப் பதவியில் அர்ப்பணித்து நிறுவுவதைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்கச் செயல்பாட்டு மொழிபெயர்ப்பு முதன்மை உரையில் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வழிபாட்டு-சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இடைக்கச்சை’, ‘தலைப்பாகை’, ‘ஆசாரியத்துவம்’, ‘நியமம்’ ஆகிய சொற்கள் துல்லியத்தையும் வாசிப்புத் தெளிவையும் சமநிலைப்படுத்துகின்றன.
