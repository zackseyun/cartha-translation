revisions:
- from: ஏழு நாட்களுக்கு நீ பலிபீடத்திற்காகப் பாவநிவிர்த்தி செய்து, அதைப் பரிசுத்தப்படுத்த வேண்டும். அப்போது பலிபீடம் மகா பரிசுத்தமானதாக இருக்கும். பலிபீடத்தைத் தொடுவது எதுவும் பரிசுத்தமாகும்.[a]
  to: ஏழு நாட்கள் நீ பலிபீடத்திற்காகப் பாவநிவிர்த்தி செய்து, அதைப் பரிசுத்தப்படுத்த வேண்டும். பலிபீடம் மிகப் பரிசுத்தமானதாகும். பலிபீடத்தைத் தொடுவது எதுவும் பரிசுத்தமாகும்.[a]
