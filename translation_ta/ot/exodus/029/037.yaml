  text: שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל הַ/מִּזְבֵּ֔חַ וְ/קִדַּשְׁתָּ֖ אֹת֑/וֹ וְ/הָיָ֤ה הַ/מִּזְבֵּ֨חַ֙ קֹ֣דֶשׁ קָֽדָשִׁ֔ים כָּל הַ/נֹּגֵ֥עַ בַּ/מִּזְבֵּ֖חַ יִקְדָּֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: ta
  text: ஏழு நாட்கள் நீ பலிபீடத்திற்காகப் பாவநிவிர்த்தி செய்து, அதைப் பரிசுத்தப்படுத்த வேண்டும். பலிபீடம் மிகப் பரிசுத்தமானதாகும். பலிபீடத்தைத் தொடுவது எதுவும் பரிசுத்தமாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலிபீடத்தைத் தொடுகிற ஒவ்வொருவரும் பரிசுத்தராக இருக்க வேண்டும்.” தொடுவதால் பரிசுத்தம் உண்டாகிறது என்றும், பரிசுத்தமான நபர் அல்லது பொருள் மட்டுமே அதைத் தொட வேண்டும் என்றும் எபிரேயத் தொடரைப் புரிந்துகொள்ள முடியும்.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר
  choice: பாவநிவிர்த்தி செய்து
  rationale: ஆசாரியச் சடங்கின் சூழலில் כפר என்பது பாவநிவிர்த்தி அல்லது சடங்குமுறைத் தூய்மைப்படுத்தலைக் குறிக்கிறது. வழிமுறையை அளவுக்கு மீறி விளக்காமல், தமிழில் நிலைபெற்றுள்ள ‘பாவநிவிர்த்தி’ என்ற சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்திற்காக
  rationale: כפר என்பதுடன் வரும் עַל, இங்கு பாவநிவிர்த்திச் சடங்கு எந்தப் பொருளுக்காகச் செய்யப்படுகிறது என்பதைக் குறிக்கிறது; எனவே ‘பலிபீடத்தின்மேல்’ என்பதைவிட ‘பலிபீடத்திற்காக’ பொருத்தமானது.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: அதைப் பரிசுத்தப்படுத்த வேண்டும்
  rationale: பலிபீடத்தைத் தூய பயன்பாட்டுக்காக மட்டுமல்ல, கடவுளுக்குரிய பரிசுத்தப் பொருளாக ஆக்கி ஒதுக்குவதை இத்தொடர் குறிக்கிறது. ‘பரிசுத்தப்படுத்து’ வழிபாட்டுச் சூழலின் கருத்தைத் துல்லியமாகத் தருகிறது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானது
  rationale: எபிரேய அடுக்குத்தொடர் மிக உயர்ந்த பரிசுத்த நிலையைக் குறிக்கிறது. ‘மகா பரிசுத்தமானது’ என்பது ‘பரிசுத்தங்களின் பரிசுத்தம்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட இயல்பாக அந்த உச்சநிலையை வெளிப்படுத்துகிறது.
- source_word: כָּל הַנֹּגֵעַ
  choice: தொடுவது எதுவும்
  rationale: כָּל உடன் வரும் பெயரெச்ச வடிவம் மனிதர்களை மட்டும் அல்லாமல் தொடும் எந்த நபரையோ பொருளையோ குறிக்கக்கூடும். ‘எதுவும்’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: יִקְדָּשׁ
  choice: பரிசுத்தமாகும்
  rationale: இவ்வினை வடிவம் தொடுதலின் விளைவாகப் பரிசுத்த நிலையை அடைவதைக் குறிக்கலாம். ‘பரிசுத்தமாகும்’ அந்த விளைவு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பலிபீடத்தைத் தொடுவதால் பரிசுத்தம் பரவுகிறதா என்பதன் பொருள்
  choice: பலிபீடத்தைத் தொடுவது எதுவும் பரிசுத்தமாகும்.
  alternative: பலிபீடத்தைத் தொடுகிற ஒவ்வொருவரும் பரிசுத்தராக இருக்க வேண்டும்; அல்லது பரிசுத்தமானவை மட்டுமே அதைத் தொட வேண்டும்.
  rationale: יִקְדָּשׁ என்பதன் நேரடியான விளைவு சார்ந்த வாசிப்பு, தொடுபவர் அல்லது தொடும் பொருள் பரிசுத்தமாகிறது என்பதாகும். ஆயினும், சடங்கு சார்ந்த எச்சரிக்கை அல்லது தகுதிக் கட்டுப்பாடு என்ற வாசிப்பும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘பலிபீடம்,’ ‘பாவநிவிர்த்தி,’ ‘பரிசுத்தம்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் துல்லியத்திற்காக வைக்கப்பட்டுள்ளன; எபிரேயத்தின் கட்டளைப் பொருள் தமிழில் ‘வேண்டும்’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
