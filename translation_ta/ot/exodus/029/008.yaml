  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: ta
  text: அவனுடைய மகன்களை அருகில் கொண்டுவந்து[a], அவர்களுக்கு அங்கிகளை அணிவிப்பாயாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய மகன்களை முன்னிறுத்தி.” எபிரெய வினை, ஒருவரைச் சடங்குமுறையில் முன் கொண்டுவந்து நிறுத்துவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: மேலும் / அடுத்து என்ற தொடர்ச்சி தமிழ்ச் சொற்றொடரால் வெளிப்படுத்தப்பட்டது
  rationale: இணைப்புச் சொலும் நேரடி பொருள் குறியும் அடுத்த கட்டளையை முந்தையதுடன் இணைக்கின்றன; இயல்பான தமிழில் தனியே ‘மற்றும்’ சேர்க்காமல் வினையெச்சத் தொடரால் அந்த இணைப்பு தரப்படுகிறது.
- source_word: בָּנָיו
  choice: அவனுடைய மகன்களை
  rationale: בֵּן இங்கு ஆரோனின் ஆண் பிள்ளைகளைக் குறிப்பாகக் குறிக்கிறது; பாலினம் சார்ந்த குறிப்பை ‘மகன்கள்’ காக்கிறது.
- source_word: תַּקְרִיב
  choice: அருகில் வரச்செய்து
  rationale: קרב என்பதன் ஹிஃபீல் வடிவம் ‘அருகில் கொண்டுவருதல்’ அல்லது சடங்கிற்காக ‘முன்னிறுத்துதல்’ என்ற பொருளைக் கொள்ளும். ‘அருகில் வரச்செய்’ என்பது மூலத்தின் இயக்கத்தையும் சடங்கு நுணுக்கத்தையும் காக்கிறது.
- source_word: וְהִלְבַּשְׁתָּם
  choice: அவர்களுக்கு ... அணிவிப்பாயாக
  rationale: வினை பிறருக்குத் துணியை அணிவித்தல் என்று பொருள்படும்; தமிழ் கட்டளை நடையில் ‘அணிவிப்பாயாக’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: כֻּתֳּנֹת
  choice: உள்ளாடைகளை
  rationale: כֻּתֹּנֶת என்பது உடலோடு அணியும் நீண்ட அடிப்படை ஆடையைக் குறிக்கிறது. ‘அங்கி’ என்பது வெளிப்புற மேலாடை எனத் தவறாகப் புரியக்கூடும்; இச்சூழலில் ‘உள்ளாடை’ அதன் ஆடை அடுக்கையும் பணியையும் தெளிவாகக் காட்டுகிறது.
