revisions:
- from: பின்பு, அந்த ஆட்டுக்கடாவிலிருந்து கொழுப்பையும், கொழுத்த வாலையும், குடல்களை மூடியிருக்கும் கொழுப்பையும், கல்லீரலின் மடலையும், இரண்டு சிறுநீரகங்களையும், அவற்றின்மேல் இருக்கும் கொழுப்பையும், வலது தொடையையும் எடுத்துக்கொள். ஏனெனில், அது அருட்பணியில் அமர்த்துவதற்கான ஆட்டுக்கடா.[a]
  to: பின்பு, அந்த ஆட்டுக்கடாவிலிருந்து கொழுப்பையும், கொழுப்புள்ள வாலையும், உள்ளுறுப்புகளை மூடியிருக்கும் கொழுப்பையும், கல்லீரலின் மடலையும், இரண்டு சிறுநீரகங்களையும், அவற்றின்மேல் இருக்கும் கொழுப்பையும், வலது தொடையையும் எடுத்துக்கொள். ஏனெனில், அது நியமனச் சடங்குக்கான ஆட்டுக்கடா.[a]
