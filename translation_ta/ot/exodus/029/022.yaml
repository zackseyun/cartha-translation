base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: ta
  text: பின்பு, அந்த ஆட்டுக்கடாவிலிருந்து கொழுப்பையும், கொழுப்புள்ள வாலையும், உள்ளுறுப்புகளை மூடியிருக்கும் கொழுப்பையும், கல்லீரலின் மடலையும், இரண்டு சிறுநீரகங்களையும், அவற்றின்மேல் இருக்கும் கொழுப்பையும், வலது தொடையையும் எடுத்துக்கொள். ஏனெனில், அது நியமனச் சடங்குக்கான ஆட்டுக்கடா.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “திருநிலைப்படுத்துதலுக்கான ஆட்டுக்கடா” அல்லது “பணியில் நிறுவுவதற்கான ஆட்டுக்கடா.” எபிரெயச் சொற்றொடர் ஆசாரியர்களை அவர்களது பணியில் நியமிக்கும் சடங்கில் பயன்படுத்தப்பட்ட ஆட்டுக்கடாவைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: பின்பு ... எடுத்துக்கொள்
  rationale: அறிவுறுத்தல்களின் தொடரில் வரும் வாவ் இணைப்பையும் இரண்டாம் நபர் கட்டளையின் இயல்பையும் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֵלֶב
  choice: கொழுப்பு
  rationale: பலிக்குரிய மிருகத்தின் குறிப்பிட்ட கொழுப்புப் பகுதிகளைக் குறிக்கும் நேரடியான, தெளிவான சொல்.
- source_word: אַלְיָה
  choice: கொழுத்த வால்
  rationale: செம்மறியாட்டின் கொழுப்பு நிறைந்த வாலைப் பொதுவான ‘வால்’ என்பதைக் காட்டிலும் துல்லியமாகக் குறிக்கிறது.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: குடல்களை மூடியிருக்கும்
  rationale: உள்ளுறுப்புகளை மூடும் கொழுப்பைக் குறிக்கும் சொற்றொடரை சாதாரண வாசகருக்குப் புரியும் உடற்கூற்றுச் சொல்லால் தருகிறது.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: கல்லீரலின் மடல்
  rationale: துல்லியமான உடற்கூறு அடையாளம் விவாதத்திற்குரியது; ‘மடல்’ மரபான பொருளை அளவுக்கு மீறித் தீர்மானிக்காமல் புரியத்தக்க வகையில் தருகிறது.
- source_word: כְּלָיֹת
  choice: சிறுநீரகங்கள்
  rationale: மூலச்சொல்லின் நேரடியான உடற்கூற்றுப் பொருள்.
- source_word: שׁוֹק הַיָּמִין
  choice: வலது தொடை
  rationale: பலிக்காக வெட்டப்பட்ட கால்/தொடைப் பகுதியைக் குறிக்கும் שׁוֹק என்பதற்கு இச்சூழலில் துல்லியமான தமிழ்.
- source_word: אֵיל מִלֻּאִים
  choice: அருட்பணியில் அமர்த்துவதற்கான ஆட்டுக்கடா
  rationale: ஆசாரியர்களை அவர்களது புனிதப் பணியில் அதிகாரபூர்வமாக அமர்த்தும் சடங்கைக் குறிக்கிறது; பின்னாளைய குறிப்பிட்ட திருச்சபை அமைப்புச் சொற்களைத் திணிக்காமல் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֵיל מִלֻּאִים என்பதிலுள்ள ஆசாரியப் பணி அமர்த்தல் சார்ந்த சொற்பயன்பாடு
  choice: அருட்பணியில் அமர்த்துவதற்கான ஆட்டுக்கடா
  alternative: திருநிலைப்படுத்துதலுக்கான ஆட்டுக்கடா; பணியில் நிறுவுவதற்கான ஆட்டுக்கடா
  rationale: எபிரெயச் சொற்றொடர் ஆரோனையும் அவன் மகன்களையும் ஆசாரியப் பணியில் அமர்த்தும் சடங்கைக் குறிக்கிறது. தேர்ந்தெடுக்கப்பட்ட வாசகம் அந்தச் சடங்கின் நோக்கத்தைத் தெளிவாக்குகிறது; ஆனால் ஒரே பிற்காலச் சமய மரபின் தொழில்நுட்பச் சொல்லாக அதைக் கட்டுப்படுத்தவில்லை. மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. இரண்டாம் நபர் ஒருமை கட்டளை வடிவம் பேணப்பட்டது; உடற்கூற்றுச் சொற்கள் தேவையற்ற தொழில்நுட்பத்தன்மையின்றித் தெளிவாக வழங்கப்பட்டன.
