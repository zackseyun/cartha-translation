  text: וְ/כִכַּ֨ר לֶ֜חֶם אַחַ֗ת וַֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד מִ/סַּל֙ הַ/מַּצּ֔וֹת אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: ta
  text: மேலும், யாவே[a] முன்னிலையில் உள்ள புளிப்பில்லா அப்பங்களின் கூடையிலிருந்து ஓர் அப்பத்தையும், எண்ணெய் கலந்த ஓர் அப்பத்தையும், மெல்லிய ஓர் அடையையும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் יהוה (YHWH); மரபுவழியாக “கர்த்தர்” என்றும் வழங்கப்படுகிறது.
    reason: இறைப் பெயரின் மூல வடிவத்தையும் பரவலான மாற்று வழங்கலையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: ஓர் அப்பம்
  rationale: כִּכָּר என்பது வட்ட வடிவிலான முழு அப்பத்தைக் குறிக்கலாம். தமிழில் இயல்பாகவும் அடுத்த உணவுப் பொருளிலிருந்து வேறுபடும் வகையிலும் ‘ஓர் அப்பம்’ என வழங்கப்பட்டது; மூலத்தில் தெளிவாகக் கூறப்படாத வடிவத்தை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: אַחַת / אֶחָד
  choice: ஓர்
  rationale: சடங்குக்குரிய பட்டியலில் ஒவ்வொரு பொருளும் ஒன்று என்பதைக் குறிப்பிடும் மூலத்தின் துல்லியம் காக்கப்பட்டது.
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: எண்ணெய் சேர்ந்த ஓர் அப்பம்
  rationale: חַלָּה ஓர் அப்பம் அல்லது அடை வகையைச் சுட்டுகிறது; שֶׁמֶן எண்ணெயைக் குறிக்கிறது. எண்ணெய் எவ்வாறு பயன்படுத்தப்பட்டது என்பதை மூலத்தைவிடத் திட்டவட்டமாக்காமல் ‘எண்ணெய் சேர்ந்த’ என மொழிபெயர்க்கப்பட்டது.
- source_word: רָקִיק
  choice: மெல்லிய ஓர் அடை
  rationale: רָקִיק மெல்லிய அப்பம் அல்லது அடையைக் குறிக்கிறது. அதன் மெல்லிய தன்மையையும் உணவு வடிவத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִסַּל הַמַּצּוֹת
  choice: புளிப்பில்லா அப்பங்களின் கூடையிலிருந்து
  rationale: מִן மூலத்தையோ இடத்தையோ குறிக்கிறது; סַל ‘கூடை’; מַצּוֹת புளிப்பூட்டப்படாத அப்பங்களைக் குறிக்கிறது. இங்கு பல தனிப்பொருட்கள் பட்டியலிடப்படுவதால் பன்மை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில் உள்ள
  rationale: לִפְנֵי என்பதன் இடவியல் மற்றும் வழிபாட்டுச் சூழலிலான ‘முன்னிலையில்’ என்ற பொருள் பாதுகாக்கப்பட்டது; ‘வைக்கப்பட்டுள்ள’ போன்ற மூலத்தில் வெளிப்படையாக இல்லாத வினை சேர்க்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எபிரெய மெய்யெழுத்துகளுக்கு ஏற்ற பரவலான ஒலிபெயர்ப்பு; ஒரு பட்டத்தால் மாற்றப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, தேவனுடைய தனிப்பெயரைக் கொண்டுள்ளது. ஆகவே பெயரின் தன்மை காக்க ‘யாவே’ பயன்படுத்தப்பட்டது; மாற்று மரபு அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
- issue: לִפְנֵי என்பதன் வழிபாட்டுச் சூழல்
  choice: முன்னிலையில் உள்ள
  alternative: முன் வைக்கப்பட்டுள்ள
  rationale: ‘முன்னிலையில்’ என்பது இடவியல் பொருளையும் தேவசந்நிதி சார்ந்த நுட்பத்தையும் காக்கிறது; பொருட்கள் திட்டவட்டமாக ‘வைக்கப்பட்டன’ என்று மூலத்தைவிட அதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்குப் பட்டியலின் துல்லியத்தைப் பாதுகாக்க ஒவ்வொரு பொருளுக்கும் ‘ஓர்’ மீண்டும் பயன்படுத்தப்பட்டது. வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சியான பெயர்த்தொடராக இருப்பதால், மூலத்தில் இல்லாத கட்டளை வினை சேர்க்கப்படவில்லை; தொடர்ச்சியை உணர்த்த இறுதியில் நீண்ட கோடு இடப்பட்டது.
