id: EXO.29.35
reference: Exodus 29:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ לְ/אַהֲרֹ֤ן וּ/לְ/בָנָי/ו֙ כָּ֔כָה כְּ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֹתָ֑/כָה שִׁבְעַ֥ת יָמִ֖ים תְּמַלֵּ֥א יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: ta
  text: நான் உனக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் ஆரோனுக்கும் அவன் மகன்களுக்கும் இவ்வாறே செய். ஏழு நாட்கள் அவர்களை ஆசாரியப் பணியில் நிறுவு.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “அவர்களுடைய கையை நிரப்பு.” இது ஒருவரை ஆசாரியப் பணிக்காக அர்ப்பணித்து, அந்தப் பணியில் நிறுவுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்
  rationale: இணைப்புச் சொல்லுடன் வரும் Qal perfect, இந்தச் சடங்கு அறிவுறுத்தல் தொடரில் கட்டளைப் பொருளைத் தருகிறது; தமிழில் நேரடி ஏவல் வினை இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: ஆரோனுக்கும் அவன் மகன்களுக்கும்
  rationale: மீண்டும் வரும் ל, செய்யப்படும் செயல் ஆரோனையும் அவன் மகன்களையும் சார்ந்தது என்பதைக் குறிக்கிறது; ‘-க்கும்’ இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּכָה
  choice: இவ்வாறே
  rationale: முன்னர் விதிக்கப்பட்ட சடங்கு முறையைச் சுட்டும் சொல்லாக இருப்பதால், ‘இவ்வாறே’ அதன் சுட்டும் தன்மையையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: நான் உனக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும்
  rationale: כְּכֹל என்பது முந்தைய கட்டளைகள் அனைத்திற்கும் முழுமையாக இணங்கச் செய்வதை உணர்த்துகிறது; இந்தத் தமிழ் வடிவம் அந்த முழுமையைக் காக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: இது காலநீட்சியைக் குறிக்கும் accusative; தமிழ் மொழியில் ‘ஏழு நாட்கள்’ என்பதே கால அளவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: תְּמַלֵּא יָדָם
  choice: அவர்களை ஆசாரியப் பணியில் நிறுவு
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய கையை நிரப்பு’ என்றாலும், ஆசாரியச் சூழலில் இது ஒருவரை ஆசாரியப் பணிக்காக அதிகாரபூர்வமாக அர்ப்பணித்து நிறுவுவதைக் குறிக்கும் மரபுத்தொடர். ‘ஆசாரியப் பணியில் நிறுவு’ என்பது பிற்காலச் சமயப் பிரிவுகளுக்குரிய தனிப்பட்ட சொற்பயன்பாட்டைச் சேர்க்காமல் அதன் பதவி-நிறுவும் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: מלא יד என்ற ஆசாரிய மரபுத்தொடரை மொழிபெயர்த்தல்
  choice: அவர்களை ஆசாரியப் பணியில் நிறுவு
  alternative: அவர்களுடைய கையை நிரப்பு
  rationale: நேரடி வடிவம் தமிழில் பொருள் தெளிவற்றதாக இருக்கும். இச்சடங்குச் சூழலில் அந்த மரபுத்தொடர் ஆரோனையும் அவன் மகன்களையும் ஆசாரிய ஊழியத்திற்கு அர்ப்பணித்து, அந்தப் பணியில் அமர்த்துவதைக் குறிக்கிறது. மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தின் சொல் வரிசை இயல்பான தமிழுக்கேற்ப அமைக்கப்பட்டாலும், ‘எல்லாவற்றின்படியும்’ என்பதன் மூலம் மூலத்தின் முழுமை வலியுறுத்தப்படுகிறது. ‘திருநிலைப்படுத்து’ போன்ற பிற்காலச் சமயப் பிரிவு சார்ந்ததாகப் புரிந்துகொள்ளப்படக்கூடிய சொல்லைத் தவிர்த்து, ‘ஆசாரியப் பணியில் நிறுவு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
