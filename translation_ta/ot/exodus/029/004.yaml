source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תַּקְרִ֔יב אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/רָחַצְתָּ֥ אֹתָ֖/ם בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: ta
  text: ஆரோனையும் அவன் மகன்களையும் சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு அழைத்துக்கொண்டு வா[a]; அவர்களைத் தண்ணீரால் கழுவு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரோனையும் அவன் மகன்களையும் முன்நிறுத்து.” எபிரெய வினைச்சொல், சடங்கு நடவடிக்கைக்காக ஒருவரை முறையாக முன்நிறுத்துதல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: அருகில் வரச் செய்து
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் ‘அருகில் கொண்டுவருதல்’ அல்லது சடங்கிற்காக ‘முன்நிறுத்துதல்’ எனப் பொருள்படும். இச்சூழலில் சடங்குசார் அணுகுதலின் நுணுக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: אֶל
  choice: -த்துக்கு
  rationale: ஒரு இலக்கை நோக்கிய நகர்வைச் சுட்டுகிறது; தமிழில் நுழைவிடத்துக்கு என்பது இயல்பான வடிவம்.
- source_word: פֶּתַח
  choice: நுழைவிடம்
  rationale: திறப்பு அல்லது நுழைவாயிலைக் குறிக்கிறது; கதவுப் பலகை இருந்ததாகத் தேவையின்றி உணர்த்தாமல் கூடாரச் சூழலுக்கு ஏற்றதாக உள்ளது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் தம் மக்களைச் சந்திப்பதற்கென நியமிக்கப்பட்ட கூடாரத்தைக் குறிக்கும் பெயரைத் தெளிவாகவும் சுருக்கமாகவும் வழங்குகிறது.
- source_word: וְרָחַצְתָּ
  choice: கழுவு
  rationale: רחץ என்பது கழுவுதல் அல்லது குளிப்பாட்டுதல். தொடர்ச்சியான சடங்கு அறிவுறுத்தலில் தமிழ் ஏவல் வடிவம் கட்டளையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בַּמָּיִם
  choice: தண்ணீரால்
  rationale: בְּ இங்கு கழுவுவதற்கான கருவி அல்லது வழிமுறையைக் குறிக்கிறது; ‘தண்ணீரால்’ என்பது இயல்பான நவீன தமிழ்.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: בָּנָיו
  choice: அவன் மகன்கள்
  rationale: ஆண் சந்ததியினரைக் குறிப்பாகச் சுட்டுகிறது; ஆசாரிய நியமனச் சூழலில் இந்தத் துல்லியம் முக்கியம்.
theological_decisions:
- issue: ஆசாரிய நியமனச் சூழலில் קרב என்பதன் சடங்குசார் நுணுக்கம்
  choice: ஆரோனையும் அவன் மகன்களையும் ... அருகில் வரச் செய்து
  alternative: ஆரோனையும் அவன் மகன்களையும் ... முன்நிறுத்தி
  rationale: ‘அருகில் வரச் செய்து’ என்பது பரிசுத்த இடத்தை அணுகும் இயக்கத்தையும் சடங்குசார் நுணுக்கத்தையும் காக்கிறது. ‘முன்நிறுத்தி’ என்பதும் சாத்தியம்; ஆனால் அது மூலத்தில் உள்ள அணுகுதல் என்ற கருத்தைச் சற்றே விளக்கவுரையாக மாற்றக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் நபர் ஒருமை கட்டளை மூலமொழியின் மோசேயை நோக்கிய அறிவுறுத்தலைக் காக்கிறது.
