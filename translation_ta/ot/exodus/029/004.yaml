- from: ஆரோனையும் அவன் மகன்களையும் சந்திப்புக் கூடாரத்தின் நுழைவிடத்துக்கு அருகில் வரச் செய்து[a], அவர்களைத் தண்ணீரால் கழுவு.
  to: ஆரோனையும் அவன் மகன்களையும் சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கு அழைத்துக்கொண்டு வா[a]; அவர்களைத் தண்ணீரால் கழுவு.
  rationale: The revision replaces the awkward and potentially less precise “near the entrance” construction with a direct idiomatic command to bring Aaron and his sons to the entrance. It retains the source’s procedural sequence, the singular command addressed to Moses, and the lexical alternative concerning the formal ritual sense of the verb.
