  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם אֲשֶׁ֨ר הוֹצֵ֧אתִי אֹתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/שָׁכְנִ֣/י בְ/תוֹכָ֑/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: ta
  text: அவர்களிடையே[a] நான் குடியிருப்பதற்காக, அவர்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்த அவர்களுடைய கடவுளாகிய யாவே நானே என்பதை அவர்கள் அறிந்துகொள்வார்கள். நானே அவர்களுடைய கடவுளாகிய யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அவர்கள் நடுவில்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: அவர்கள் அறிந்துகொள்வார்கள்
  rationale: இணைப்புடன் வரும் வினை வடிவம் இச்சூழலில் எதிர்கால விளைவைச் சுட்டுகிறது. நவீனத் தமிழில் இயல்பாகவும் உறுதிமிக்கதாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: אֱלֹהֵיהֶם
  choice: அவர்களுடைய கடவுள்
  rationale: வடிவத்தில் பன்மைத் தோற்றம் இருந்தாலும், யாவே என்ற இறைப்பெயருடனும் உடன்படிக்கைச் சூழலிலும் இது ஒருமைப் பொருளையே தருகிறது.
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: அவர்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்த
  rationale: எகிப்திலிருந்து விடுவித்த செயலைத் தெளிவாகவும் மூலத்தின் உறவுநிலை அமைப்புக்கு நெருக்கமாகவும் தருகிறது.
- source_word: לְשָׁכְנִי
  choice: நான் குடியிருப்பதற்காக
  rationale: לְ இணைந்த வினையெச்சம் இங்கு நோக்கத்தைக் குறிக்கிறது; வெளியே கொண்டுவந்ததன் நோக்கம் தேவன் அவர்களிடையே குடியிருப்பதே என்பதைத் தெளிவாக்குகிறது.
- source_word: בְתוֹכָם
  choice: அவர்களிடையே
  rationale: ‘அவர்களின் நடுவில்’ என்ற எபிரெயச் சொல்லாட்சியின் பொருளை இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: நானே அவர்களுடைய கடவுளாகிய யாவே
  rationale: אֲנִי என்பதன் வலியுறுத்தலையும் உடன்படிக்கைச் சூத்திரத்தையும் ‘நானே’ என்ற வடிவால் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, நான்கெழுத்து இறைப்பெயரே உள்ளது. ஆகவே தனிப்பட்ட பெயரை மறைக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: எகிப்திலிருந்து வெளியே கொண்டுவந்ததன் நோக்கம்
  choice: நான் குடியிருப்பதற்காக
  alternative: நான் குடியிருக்க
  rationale: לְשָׁכְנִי என்பதிலுள்ள நோக்கப் பொருளை வெளிப்படையாகத் தருகிறது; இது மூல இலக்கணத்தின் அடிப்படையிலான தேர்வு.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நானே’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘அவர்களிடையே’ இயல்பான தமிழுக்காகத் தேர்ந்தெடுக்கப்பட்டு, நேரடி சொல்லாட்சி அடிக்குறிப்பில் தரப்பட்டுள்ளது.
