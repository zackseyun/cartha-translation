base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: ta
  text: பாவநிவர்த்திக்காக ஒவ்வொரு நாளும் ஒரு காளையைப் பாவநிவாரணப் பலியாகச் செலுத்த வேண்டும்[a]. பலிபீடத்திற்காக நீ பாவநிவர்த்தி செய்யும்போது, அதைத் தூய்மைப்படுத்த வேண்டும்; அதைப் புனிதப்படுத்துவதற்காக அதற்கு அபிஷேகம் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு காளையைத் தூய்மைப்படுத்தும் பலியாக.’ எபிரெயச் சொல் חַטָּאת என்பது ‘பாவம்’ என்பதையும், பலிச் சடங்குச் சூழலில் பாவம் அல்லது தீட்டிலிருந்து தூய்மைப்படுத்தப் பயன்படும் பலியையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: ஒரு காளை
  rationale: இந்தச் சொல் பொதுவாக ஆண் மாட்டைக் குறிக்கிறது; அதன் வயது இங்கு தெளிவாகக் குறிப்பிடப்படாததால், ‘இளங்காளை’ என்று குறுக்காமல் ‘காளை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: பலிச் சடங்குச் சூழலில் இச்சொல் வெறும் ‘பாவம்’ என்பதைக் காட்டிலும், பாவம் அல்லது தீட்டிலிருந்து தூய்மைப்படுத்துவதற்கான பலியைக் குறிக்கிறது. தமிழில் புரிந்துகொள்ளத்தக்க வழக்குச் சொல்லாக ‘பாவநிவாரணப் பலி’ பயன்படுத்தப்பட்டு, மாற்று நுட்பம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לַיּוֹם
  choice: ஒவ்வொரு நாளும்
  rationale: தொடர்ந்து ஏழு நாட்கள் செய்யப்படும் சடங்கின் சூழலில் இச்சொற்றொடர் பகிர்மானப் பொருளில் தினந்தோறும் நிகழும் செயலைக் குறிக்கிறது.
- source_word: עַל הַכִּפֻּרִים
  choice: பாவநிவர்த்திக்காக
  rationale: எபிரெய மூலத்தின் பன்மை வடிவம் இங்கு பாவநிவர்த்தி அல்லது தூய்மைப்படுத்தும் சடங்குகளைக் குறிக்கிறது; இயல்பான தமிழுக்காக ஒருமைக் கருத்துச் சொல்லாக வழங்கப்பட்டது.
- source_word: וְחִטֵּאתָ
  choice: அதைத் தூய்மைப்படுத்த வேண்டும்
  rationale: חטא வினையின் பியேல் வடிவம் பரிசுத்தப் பொருட்களைச் சடங்குமுறையில் தூய்மைப்படுத்துவதைக் குறிக்கிறது. பலிபீடம் பாவம் செய்தது என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘தூய்மைப்படுத்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: கூடார வழிபாட்டில் பலி செலுத்தப்படும் பீடத்திற்கான தெளிவான, நிலைபெற்ற தமிழ் சொல்.
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: பலிபீடத்திற்காக நீ பாவநிவர்த்தி செய்யும்போது
  rationale: בְּ உடன் வரும் வினையெச்ச அமைப்பு காலத்தையோ கருவியையோ குறிக்கலாம். இங்கு சடங்கு நிகழும் நேரத்தைக் காட்டும் ‘செய்யும்போது’ இயல்பாக உள்ளது; עָלָיו என்பதன் சுட்டுப்பொருள் பலிபீடம் எனப் புரியும்படி வெளிப்படுத்தப்பட்டது.
- source_word: וּמָשַׁחְתָּ
  choice: அபிஷேகம் செய்து
  rationale: משׁח என்பது அர்ப்பணிப்புக்காக எண்ணெய் பூசும் சடங்குச் செயலைக் குறிக்கும் நிலைபெற்ற சொல்; ‘அபிஷேகம் செய்’ அதன் வழிபாட்டுச் சிறப்பைப் பாதுகாக்கிறது.
- source_word: לְקַדְּשׁוֹ
  choice: புனிதப்படுத்த வேண்டும்
  rationale: பலிபீடத்தைப் புனிதப் பயன்பாட்டிற்காகத் தனியே ஒதுக்குவதே இங்கு கருத்து. ‘புனிதப்படுத்து’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: பிற்காலக் கோட்பாட்டுக் கருத்துகளைச் சேர்க்காமல் பலி, தூய்மைப்படுத்துதல், பாவநிவர்த்தி ஆகிய சடங்கு மொழியை வழங்குதல்
  choice: ‘பாவநிவாரணப் பலி,’ ‘தூய்மைப்படுத்து,’ ‘பாவநிவர்த்தி செய்’ ஆகியவற்றை ஆசரிப்புக்கூடாரச் சடங்கின் பொருளில் பயன்படுத்துதல்
  alternative: חַטָּאת என்பதற்கு நேரடியாக ‘தூய்மைப்படுத்தும் பலி’ என்றும், וְחִטֵּאתָ என்பதற்கு ‘பாவத்தை அகற்று’ என்றும் வழங்கலாம்.
  rationale: இந்த வசனம் பலிபீடத்தைப் பலிச் சடங்குகளால் தூய்மைப்படுத்தி அர்ப்பணிப்பதைப் பற்றியது. எனவே பலிபீடத்திற்கு ஒழுக்கப்பாவம் மன்னிக்கப்படுவது போன்ற கருத்தை ஏற்படுத்தாமல், எபிரெயச் சடங்கு வகைப்பாடுகளும் அவற்றுக்கிடையிலான இறையியல் இழுப்பும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பலிபீடம்,’ ‘பாவநிவாரணப் பலி,’ ‘அபிஷேகம்’ போன்ற நிலைபெற்ற வழிபாட்டுச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; அதேவேளையில் வாக்கிய அமைப்பு இயல்பாக வைக்கப்பட்டுள்ளது.
