  text: וְ/שַׂמְתָּ֥ הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וְ/נָתַתָּ֛ אֶת נֵ֥זֶר הַ/קֹּ֖דֶשׁ עַל הַ/מִּצְנָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/006.yaml
  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
translation:
  language: ta
  text: அவனுடைய தலையில் தலைப்பாகையை வைத்து, தலைப்பாகையின்மேல் புனித மகுடத்தை வைக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: வைத்து
  rationale: שׂים என்பதன் ‘வை, அமை’ என்ற பொருளைச் சடங்கு நடைமுறைக்கு இயல்பான தமிழில் தருகிறது; தொடர்ச்சியான கட்டளையின் முதல் செயலைக் குறிக்க வினையெச்சம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַמִּצְנֶפֶת
  choice: தலைப்பாகை
  rationale: מִצְנֶפֶת என்பது ஆசாரியர் தலையில் சுற்றி அணியும் தலைக்கவசம்; நவீனத் தமிழில் ‘தலைப்பாகை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַל רֹאשׁוֹ
  choice: அவன் தலையில்
  rationale: உரையின் நேரடியான இடப்பொருளை இயல்பான தமிழ்ச் சொற்றொடரில் காக்கிறது.
- source_word: וְנָתַתָּ
  choice: பொருத்த வேண்டும்
  rationale: נתן இங்கு ஒரு பொருளை மற்றொன்றின்மேல் வைப்பதைக் குறிக்கிறது. மகுடம் தலைப்பாகையின்மேல் நிலைநிறுத்தப்படுவதால் ‘பொருத்த’ என்பது சூழலுக்கு இயல்பானது; ‘வேண்டும்’ இரண்டாம் நபருக்கான நடைமுறைக் கட்டளையை வெளிப்படுத்துகிறது.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: புனித மகுடம்
  rationale: נֵזֶר அர்ப்பணிப்பையோ பதவியையோ குறிக்கும் கிரீடம் போன்ற தலை அணிகலன்; ‘மகுடம்’ அதன் அலங்கார மற்றும் கண்ணியத் தன்மையைத் தருகிறது. הַקֹּדֶשׁ இங்கு ‘புனித’ எனப் பெயரடையாக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל הַמִּצְנָפֶת
  choice: அந்தத் தலைப்பாகையின்மேல்
  rationale: עַל என்பதன் இடப்பொருளைத் தக்கவைக்கிறது; ‘அந்த’ என்பது முன்பு குறிப்பிடப்பட்ட அதே தலைப்பாகை என்பதைத் தமிழில் தெளிவுபடுத்துகிறது.
