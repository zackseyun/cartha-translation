base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: ta
  text: அவனுக்குப் பின் அவன் மகன்களில் ஆசாரியராகப் பொறுப்பேற்பவர்[b], பரிசுத்த இடத்தில்[c] திருப்பணி செய்வதற்காகச் சந்திப்புக் கூடாரத்திற்குள் நுழையும்போது, ஏழு நாட்கள் அவற்றை அணிய வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவற்றை அணிந்திருக்க வேண்டும்.’ எபிரெய வினைச்சொல் சூழலின்படி உடையை அணிவதையோ அணிந்திருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அவனுக்குக் கீழ் அவன் மகன்களில் இருக்கும் ஆசாரியர்’; இங்கு அவனுக்குப் பின் ஆசாரியப் பொறுப்பேற்பவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘திருத்தலத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: கால நீட்சியைக் குறிக்கும் எபிரெயப் பயன்பாட்டை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: יִלְבָּשָׁם
  choice: அவற்றை அணிய வேண்டும்
  rationale: לָבַשׁ என்பது சூழலின்படி ‘அணிதல்’ அல்லது ‘அணிந்திருத்தல்’ எனப் பொருள்படலாம். முந்தைய வசனங்களில் கூறப்பட்ட ஆசாரிய உடைகளைக் குறிக்கும் பன்மைச் சுட்டுப்பெயரை ‘அவற்றை’ பாதுகாக்கிறது.
- source_word: הַכֹּהֵן תַּחְתָּיו
  choice: அவனுக்குப் பின் ... ஆசாரியராகப் பொறுப்பேற்பவர்
  rationale: சொல்லுக்குச் சொல் ‘அவனுக்குக் கீழ்/அவனுடைய இடத்தில் இருக்கும் ஆசாரியன்’ என்றாலும், இச்சூழலில் ஆசாரியப் பொறுப்பில் வரும் வாரிசைக் குறிக்கிறது; தமிழ் வாசகருக்கு இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִבָּנָיו
  choice: அவன் மகன்களில்
  rationale: வாரிசாகும் ஆசாரியர் அவனுடைய மகன்களில் ஒருவர் என்பதைக் காட்டும் பகுதி சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר יָבֹא
  choice: நுழையும்போது
  rationale: வடிவில் தொடர்புச் சொற்றொடராக இருந்தாலும், ஆசாரியர் கூடாரத்திற்குள் வரும் நிகழ்வுக்கும் அங்கு செய்யும் பணிக்கும் உள்ள காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இறைவன் தம் மக்களைச் சந்திக்கும் திருக்கூடாரத்திற்கான நிலையான, பொருள் தெளிவான தமிழாக்கம்.
- source_word: לְשָׁרֵת
  choice: திருப்பணி செய்வதற்காக
  rationale: இது பொதுவான சேவையல்ல, வழிபாட்டிடத்தில் நடைபெறும் முறையான ஆசாரியப் பணி என்பதைத் தெரிவிக்கிறது.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: கூடாரத்தின் புனிதமான வழிபாட்டுப் பகுதியைக் குறிக்கும் இடவியல் பொருளைத் தக்கவைக்கிறது; ‘பரிசுத்த ஸ்தலத்தில்’ என்பதைவிட நவீன வாசகருக்கு இயல்பானது.
theological_decisions:
- issue: ஆசாரியப் பொறுப்பின் வாரிசுரிமை
  choice: அவனுக்குப் பின் அவன் மகன்களில் ஆசாரியராகப் பொறுப்பேற்பவர்
  alternative: அவனுடைய இடத்தில் இருக்கும் அவன் மகன்களில் ஒருவனான ஆசாரியர்
  rationale: எபிரெயச் சொற்றொடர் வெறும் இடமாற்றத்தைக் காட்டாமல், ஆரோனிய குடும்பத்திற்குள் ஆசாரியப் பொறுப்பு தொடர்வதைக் காட்டுகிறது. பிற்காலக் கோட்பாடுகளைச் சேர்க்காமல் அந்த வாரிசுத் தொடர்பை வெளிப்படுத்துகிறது.
- issue: בַּקֹּדֶשׁ குறிக்கும் வழிபாட்டு இடம்
  choice: பரிசுத்த இடத்தில்
  alternative: பரிசுத்த ஸ்தலத்தில் / பரிசுத்த அறையில்
  rationale: எபிரெயச் சொல் புனிதப் பகுதியைக் குறிக்கிறது; அது இங்கு குறிப்பாக உள் அறையை மட்டுமே குறிக்கிறதா அல்லது பரந்த திருத்தலத்தைக் குறிக்கிறதா என்பதில் உள்ள அளவான தெளிவின்மையை ‘பரிசுத்த இடம்’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியர்,’ ‘திருப்பணி,’ ‘சந்திப்புக் கூடாரம்’ ஆகிய சொற்கள் வழிபாட்டுச் சூழலைத் தெளிவாக வைத்திருக்கின்றன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
