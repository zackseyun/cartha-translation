source:
  edition: WLC
  text: וְ/זֶ֨ה הַ/דָּבָ֜ר אֲשֶֽׁר תַּעֲשֶׂ֥ה לָ/הֶ֛ם לְ/קַדֵּ֥שׁ אֹתָ֖/ם לְ/כַהֵ֣ן לִ֑/י לְ֠קַח פַּ֣ר אֶחָ֧ד בֶּן בָּקָ֛ר וְ/אֵילִ֥ם שְׁנַ֖יִם תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: ta
  text: 'அவர்களை எனக்காக ஆசாரியர்களாகப் பணியாற்றும்படி பரிசுத்தப்படுத்த நீ அவர்களுக்குச் செய்ய வேண்டியது இதுவே: மாட்டுமந்தையிலிருந்து குறையற்ற ஒரு காளையையும்[a], குறையற்ற இரண்டு செம்மறியாட்டுக் கடாக்களையும் எடுத்துக்கொள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு இளம் காளை.” எபிரெயச் சொற்றொடர் சொற்சொல்லாக, “ஒரு காளை, மாட்டினத்தின் மகன்” என்று உள்ளது; இது மாட்டுமந்தையைச் சேர்ந்த ஒரு காளையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எந்தக் குறைபாடும் இல்லாத.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: செய்ய வேண்டியது
  rationale: சடங்கு குறித்த அறிவுறுத்தலை அறிமுகப்படுத்தும் சூழலில், דָּבָר என்பதன் ‘காரியம்/விஷயம்’ என்ற பொருளை இயல்பான நவீன தமிழில் செய்முறை சார்ந்ததாக வெளிப்படுத்துகிறது.
- source_word: תַּעֲשֶׂה
  choice: நீ ... செய்ய வேண்டியது
  rationale: இங்குள்ள imperfect வடிவத்தின் அறிவுறுத்தல் வலிமையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְקַדֵּשׁ
  choice: அர்ப்பணிக்க
  rationale: ஆசாரியப் பணிக்காகப் புனிதமாகப் பிரித்து நியமிக்கும் கருத்தைத் தமிழில் புரியத்தக்க வழிபாட்டுச் சொல்லாட்சியுடன் தெரிவிக்கிறது; வெறும் காணிக்கையாகக் கொடுப்பது என்ற பொருள் வராதபடி சூழல் இதை வரையறுக்கிறது.
- source_word: לְכַהֵן לִי
  choice: எனக்காக ஆசாரியர்களாகப் பணியாற்றும்படி
  rationale: כהן வினைச்சொல் குறிக்கும் ஆசாரியப் பொறுப்பைச் செயல்படுத்துவதைத் தெளிவாக்கி, לִי என்பதையும் ‘எனக்காக’ எனப் பாதுகாக்கிறது.
- source_word: לְקַח
  choice: எடுத்துக்கொள்
  rationale: தேவையான பலி விலங்குகளைத் தேர்ந்தெடுத்து எடுத்துக்கொள்ளும் நேரடியான கட்டளையை இயல்பான தமிழில் தருகிறது.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: மந்தையிலிருந்து ஒரு காளை
  rationale: எபிரெய மரபுத்தொடரான ‘ஒரு காளை, மாட்டு மந்தையின் மகன்’ என்பதைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், அது மாட்டு மந்தையைச் சேர்ந்த விலங்கு என்பதை வெளிப்படுத்துகிறது; இளமைக் கருத்து சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֵילִם שְׁנַיִם
  choice: இரண்டு செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵיל என்பதன் ஆண் செம்மறியாடு என்ற துல்லியமான பொருளையும் வெளிப்படையான எண்ணிக்கையையும் காக்கிறது.
- source_word: תְּמִימִם
  choice: குறையற்ற
  rationale: பலிக்குரிய விலங்குகள் உடற்குறை அல்லது பழுதின்றி இருக்க வேண்டும் என்ற சடங்கு சார்ந்த பொருளை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: ஆசாரியப் பணி குறித்த மொழியாக்கம்
  choice: எனக்காக ஆசாரியர்களாகப் பணியாற்றும்படி
  alternative: எனக்கு ஆசாரிய ஊழியம் செய்யும்படி
  rationale: மூலமொழியிலுள்ள ஆசாரியப் பதவிச் செயல்பாட்டைத் தெளிவாகக் காக்கிறது; பின்னாளைய திருச்சபைச் சொற்பயன்பாடுகளையோ தனிப்பட்ட சமயக்கோட்பாடுகளையோ இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியர்’ என்பது சூழலுக்கேற்ற நிலைபெற்ற சொல்; ‘செம்மறியாட்டுக் கடா’ என்பது ஆண் விலங்கைக் குறிப்பாக வேறுபடுத்துகிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
