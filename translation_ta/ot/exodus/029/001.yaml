  naturalness: ‘பரிசுத்தப்படுத்த’ என்பது நவீனத் தரத் தமிழில் இந்தச் சடங்கு-நியமனச் சூழலுக்கு இயல்பானதும் தெளிவானதும் ஆகும். ‘மாட்டுமந்தையிலிருந்து’ என்பது தனித்து வரும் ‘மந்தையிலிருந்து’ என்பதைவிட பசுக்கூட்டத்தைக் குறிப்பாகத் தெரிவிக்கிறது. ‘குறையற்ற’ என்பதை இரு விலங்குக் குழுக்களுக்கும் முன்பாக வைப்பது தமிழில் அதன் நோக்கத்தைத் தெளிவுபடுத்துகிறது.
