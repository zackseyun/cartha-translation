  text: சந்திப்புக் கூடாரத்தின் வாசலில், யாவேக்கு முன்பாக அந்தக் காளையை அறுப்பாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH”; மரபாக “கர்த்தர்” என மொழிபெயர்க்கப்படுகிறது. “யெகோவா” என்பதும் மற்றொரு வடிவம்.'
    reason: இறைத்தனிப்பெயரின் எபிரெய வடிவத்தையும் வழக்கிலுள்ள மாற்று வழங்கல்களையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: பலியிடுவதற்காக அறுப்பாய்
  rationale: இது சடங்குமுறை அறிவுறுத்தல்களின் தொடரில் வரும் கட்டளைப் பொருளுடைய வினை. பலிச் சூழலில் வெறுமனே ‘கொல்வாய்’ என்பதைவிட ‘பலியிடுவதற்காக அறுப்பாய்’ என்பது பொருளை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: הַפָּר
  choice: அந்தக் காளை
  rationale: פַּר என்பது பலிச் சூழலில் காளையைக் குறிக்கிறது; முந்தைய சூழலில் அறிமுகமான குறிப்பிட்ட காளை என்பதால் சுட்டுப்பொருள் இயல்பாக வெளிப்படுத்தப்படுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/சந்நிதியில்’ என்ற இடத்தையும் இறைமுன்னிலையையும் காக்கிறது; יְהוָה தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: פֶּתַח
  choice: நுழைவாயிலில்
  rationale: கூடாரத்திற்குள் நுழையும் இடத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: மக்களுடன் இறைவன் சந்திக்கும் நியமிக்கப்பட்ட திருக்கூடாரத்தைக் குறிக்கும் பெயரைத் தெளிவாகவும் மரியாதையான நடையிலும் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கு எழுத்துகளாலான இறைத்தனிப்பெயரே உள்ளது. அதைப் பட்டப்பெயராக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பிற்கு நெருக்கமாக ‘யாவே’ என்று வழங்கி, மாற்று மரபுகளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய மரியாதையான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கிய வரிசையை இயந்திரமாகப் பின்பற்றாமல், இடக்குறிப்பை முதலில் வைத்து தமிழ் இயல்பை பேணுகிறது.
