base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ta
  text: அந்த ஆட்டுக்கடா முழுவதையும் நீ பலிபீடத்தின்மேல் எரித்துப் புகையாக்க வேண்டும். அது யாவேக்குச் செலுத்தப்படும் தகனபலி; அவருக்கு உகந்த நறுமணம்[a]; யாவேக்குச் செலுத்தப்படும் நெருப்புப் பலி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாந்தப்படுத்தும் நறுமணம்.” இந்த எபிரெயச் சொற்றொடர் யாவேக்கு ஏற்றுக்கொள்ளத்தக்க பலியைக் குறிக்கும் நிலையான பலிசார் வாய்பாடு.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உணவுப் படையல்.” எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியற்றது; அது நெருப்பின் மூலம் செலுத்தப்படும் பலியையோ, தேவனுக்கான உணவுப் படையலாகக் கருதப்படும் பலியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: நீ எரித்துப் புகையாக்க வேண்டும்
  rationale: קטר என்பதன் ஹிஃபில் வடிவம் பலிச் சூழலில் பலிபீடத்தின் மேல் பலியை எரித்துப் புகையாக எழச்செய்வதைக் குறிக்கிறது. ‘எரித்துப் புகையாக்க’ என்பது செயலும் பலிசார் நுணுக்கமும் இரண்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: כָּל הָאַיִל
  choice: அந்த ஆட்டுக்கடா முழுவதையும்
  rationale: אַיִל என்பது குறிப்பாக ஆட்டுக்கடாவைக் குறிக்கிறது; כָּל என்பது அதன் ஒரு பகுதியை மட்டும் அல்லாமல் முழுவதையும் பலியிட வேண்டும் என்பதை வலியுறுத்துகிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: திசையைக் காட்டும் இறுதி எழுத்து பலிபீடத்தை நோக்கிய இயக்கத்தைக் குறித்தாலும், எரிப்பு அங்கே நடைபெறுவதால் தமிழில் ‘பலிபீடத்தின்மேல்’ என்பது இயல்பும் சூழலுக்குத் துல்லியமும் உடையது.
- source_word: עֹלָה
  choice: தகனபலி
  rationale: முழுவதும் எரித்து அர்ப்பணிக்கப்படும் பலிக்கான வழக்கமான, சுருக்கமான தமிழ்ச் சொல் இது.
- source_word: לַיהוָה
  choice: யாவேக்குச் செலுத்தப்படும்
  rationale: לְ முன்னொட்டு அர்ப்பணிப்பின் இலக்கையும் உறவையும் காட்டுகிறது. ‘செலுத்தப்படும்’ என்பது பலி யாவேக்கு அர்ப்பணிக்கப்படுவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: רֵיחַ נִיחוֹחַ
  choice: அவருக்கு உகந்த நறுமணம்
  rationale: இது பலி ஏற்றுக்கொள்ளத்தக்கது என்பதைக் குறிக்கும் நிலையான பலிசார் சொற்றொடர். ‘உகந்த’ என்பது தேவனைத் தணிப்பதாகத் தேவையின்றி விளக்காமல் ஏற்றுக்கொள்ளப்படுதலைத் தெரிவிக்கிறது.
- source_word: אִשֶּׁה
  choice: நெருப்புப் பலி
  rationale: சொல்லின் துல்லியமான சொற்பிறப்பும் பொருளும் உறுதியாகத் தீர்மானிக்கப்படாத நிலையில், நெருப்பின் மூலம் செலுத்தப்படும் பலி என்ற பாரம்பரியப் பொருளை இது வெளிப்படையாகக் காக்கிறது; ‘உணவுப் படையல்’ என்பது மாற்று விளக்கமாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הוּא
  choice: அது
  rationale: இந்தச் சுட்டுப்பெயர் ஆட்டுக்கடாவை அல்லது அதனால் ஆன பலியை அடையாளப்படுத்தும் பயனிலையில் வருகிறது; தமிழில் ‘அது’ இயல்பான இணை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: எபிரெய மூலத்தில் உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்கப்படும் உச்சரிப்பைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்ப்பது பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: רֵיחַ נִיחוֹחַ என்பதில் தேவனைப் பற்றிய உருவக மொழி
  choice: அவருக்கு உகந்த நறுமணம்
  alternative: சாந்தப்படுத்தும் நறுமணம்
  rationale: மூலத்தின் பலிசார் உருவகத்தைப் பாதுகாத்தபடியே, பலி தேவனால் ஏற்றுக்கொள்ளப்படுவதையே மையமாகக் காட்டுகிறது; தேவனுடைய கோபத்தை பலி இயந்திரத்தனமாகத் தணிக்கிறது என்ற கூடுதல் கருத்தைத் திணிக்கவில்லை.
- issue: אִשֶּׁה என்பதன் பொருள்
  choice: நெருப்புப் பலி
  alternative: உணவுப் படையல்
  rationale: இச்சொல்லின் சொற்பிறப்பும் சரியான வகைப்பாடும் விவாதத்திற்குரியவை. முதன்மை உரையில் நெருப்போடு தொடர்புடைய பாரம்பரியப் பொருள் வைக்கப்பட்டு, உணவுப் படையல் என்ற முக்கிய மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. சட்டவிதிக்குரிய இரண்டாம் நபர் ஆண்பால் ஒருமை ‘நீ ... வேண்டும்’ என்று நேரடியாகத் தரப்பட்டுள்ளது. பலிசார் சொற்களுக்கு சுருக்கமான, பொதுவாகப் புரியக்கூடிய வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் உண்மையான சொற்பொருள் ஐயங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
