  yaml_path: translation/ot/exodus/029/015.yaml
  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: ta
  text: பின்பு, அந்த ஒரு செம்மறியாட்டுக் கடாவை[a] நீ எடுக்க வேண்டும்; ஆரோனும் அவன் மகன்களும் தங்கள் கைகளை அந்தக் கடாவின் தலையின்மேல் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அந்த ஒரு கடா.” பிரதிஷ்டைச் சடங்கில் பயன்படுத்தப்படும் மற்றொரு கடாவிலிருந்து இந்தக் கடாவை வேறுபடுத்திக் காட்டுகிறது; சில மொழிபெயர்ப்புகள் இதை “முதல் கடா” என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: பின்பு
  rationale: தொடர்ச்சியாக நடைபெறும் அர்ப்பணிப்பு நடைமுறையின் அடுத்த கட்டத்தை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: הָ/אַיִל
  choice: செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; பலிச் சடங்கின் சூழலில் இச்சொல் துல்லியமாக உள்ளது.
- source_word: הָ/אֶחָד
  choice: அந்த ஒரு
  rationale: எபிரெயச் சொற்றொடரின் தனித்துக் காட்டும் பொருளைப் பேணி, இதை வரிசை எண்ணாகிய ‘முதல்’ என்று தீர்மானிக்காமல் விடுகிறது.
- source_word: תִּקָּח
  choice: நீ கொண்டுவர வேண்டும்
  rationale: மோசேயிடம் ஒருமையில் வழங்கப்படும் சடங்கு அறிவுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது; சூழலில் விலங்கைச் சடங்கிற்காக எடுத்துக் கொண்டுவருவதே நோக்கம்.
- source_word: וְ/סָמְכוּ
  choice: வைக்க வேண்டும்
  rationale: סמך என்பதன் பலிச் சடங்கு சார்ந்த கைகளை வைக்கும் செயலைத் தெளிவாகச் சொல்கிறது; அழுத்துதல் அல்லது சாய்தல் என்ற கூடுதல் நுணுக்கத்தைத் திணிக்கவில்லை.
- source_word: אַהֲרֹן וּ/בָנָיו
  choice: ஆரோனும் அவன் மகன்களும்
  rationale: ஆசாரியப் பிரதிஷ்டை பெறும் ஆரோனின் ஆண் சந்ததியரைச் சூழலுக்கேற்பத் துல்லியமாகக் குறிக்கிறது.
- source_word: אֶת יְדֵיהֶם
  choice: தங்கள் கைகளை
  rationale: எபிரெய மூலத்தின் பன்மையைப் பேணி, வாக்கியத்தின் எழுவாயோடு இயல்பாகப் பொருந்துகிறது.
- source_word: עַל רֹאשׁ
  choice: தலையின்மேல்
  rationale: கைகள் வைக்கப்படும் இடத்தை நேரடியாகவும் தெளிவாகவும் குறிப்பிடுகிறது.
- source_word: הָ/אָיִל
  choice: அந்தக் கடா
  rationale: முன்பு குறிப்பிடப்பட்ட அதே விலங்கைச் சுட்டி, தமிழில் தேவையற்ற முழுப் பெயர்ச்சொல் மீளுரைப்பைத் தவிர்க்கிறது.
theological_decisions:
- issue: பலிச் சடங்கில் கைகளை வைக்கும் செயலுக்கான சொற்பயன்பாடு
  choice: தங்கள் கைகளை அந்தக் கடாவின் தலையின்மேல் வைக்க வேண்டும்
  alternative: தங்கள் கைகளை அந்தக் கடாவின் தலையின்மேல் ஊன்ற வேண்டும்
  rationale: மூல வினைச்சொல் சாய்தல் அல்லது ஊன்றுதல் என்ற நுணுக்கத்தையும் கொண்டிருக்கலாம். எனினும் இவ்வசனம் கூறும் சடங்குச் செயலை ‘வைக்க வேண்டும்’ என்பது தெளிவாக எடுத்துரைக்கிறது; அதன் இறையியல் பொருளை வசனத்திற்கு அப்பால் விளக்கித் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சடங்கு அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘அந்த ஒரு’ என்ற சற்றே குறியிடப்பட்ட அமைப்பு மூலத்தின் உண்மையான தெளிவின்மையைப் பேணுவதற்காக வைக்கப்பட்டுள்ளது.
