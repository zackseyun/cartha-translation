  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: ta
  text: குருத்துவப் பணியில் நிறுவும் சடங்குக்கான ஆட்டுக்கடாவை[a] நீ எடுத்துக்கொண்டு, அதன் இறைச்சியைப் புனிதமான ஓர் இடத்தில்[b] வேகவைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அர்ப்பணிப்புச் சடங்குக்கான ஆட்டுக்கடா.” எபிரெயச் சொல் ஆசாரியர்களைக் குருத்துவப் பணியில் நிறுவும் சடங்கைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பரிசுத்த ஸ்தலத்தில்.” எனினும், எபிரெயம் சொற்படியாக “புனிதமான ஓர் இடத்தில்” என்று கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: ஆட்டுக்கடா
  rationale: பலிக்குரிய விலங்கைக் குறிக்கும் இச்சொல்லின் வழக்கமான பொருள் ஆண் செம்மறியாடு; நவீனத் தமிழில் ‘ஆட்டுக்கடா’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַמִּלֻּאִים
  choice: குருத்துவப் பணியில் அமர்த்துவதற்கான
  rationale: இது கைகளை ‘நிரப்புதல்’ என்ற சொற்படியான கருத்திலிருந்து வந்த தொழில்நுட்பச் சொல்; இச்சூழலில் ஆசாரியர்களைப் பணியில் நிறுவும் சடங்கைக் குறிக்கிறது. தமிழில் தெளிவாகப் புரியும்படி அதன் சடங்குச் செயல்பாடு வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: תִּקָּח
  choice: நீ எடுத்துக்கொண்டு
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை வினை வடிவின் கட்டளைத் தன்மையையும், அடுத்த செயலை நோக்கிய தொடர்ச்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: וּבִשַּׁלְתָּ
  choice: வேகவைக்க வேண்டும்
  rationale: בשׁל இச்சூழலில் நீரில் வேகவைத்தலைக் குறிக்கிறது. ‘சமைக்க வேண்டும்’ என்பதைவிட ‘வேகவைக்க வேண்டும்’ துல்லியமானது.
- source_word: בְּשָׂרוֹ
  choice: அதன் இறைச்சியை
  rationale: பலிக்குரிய விலங்கின் உண்ணத்தக்க உடற்பகுதியை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது; ‘அதன்’ என்பது எபிரெய மூன்றாம் நபர் ஒருமை உடைமைப் பின்னொட்டை வெளிப்படுத்துகிறது.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: புனிதமான ஓர் இடத்தில்
  rationale: பெயர்ச்சொல்லுக்கும் பெயரடைக்கும் எபிரெயத்தில் சுட்டு உருபு இல்லாததால், குறிப்பிட்ட ‘புனித இடம்’ என்ற கூடாரப் பகுதியைத் தீர்மானிக்காமல் பொதுவான புனித இடத்தைக் குறிக்கும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: הַמִּלֻּאִים என்ற ஆசாரிய நிறுவுதல் சார்ந்த தொழில்நுட்பச் சொல்
  choice: குருத்துவப் பணியில் அமர்த்துவதற்கான
  alternative: அர்ப்பணிப்புச் சடங்கிற்கான
  rationale: இரு மொழிபெயர்ப்புகளும் சாத்தியமானவை. தேர்ந்தெடுக்கப்பட்ட வாசகம் ஆசாரியர்கள் ஒரு பணியில் நிறுவப்படுவதைத் தெளிவாகக் காட்டுகிறது; அதேவேளை அவர்களைப் புனிதப்படுத்தும் அம்சத்தை மாற்று வாசகமாக அடிக்குறிப்பில் காக்கிறது.
- issue: בְּמָקוֹם קָדֹשׁ என்பது பொதுவான புனித இடமா, ‘புனித இடம்’ எனப்படும் கூடாரப் பகுதியா
  choice: புனிதமான ஓர் இடத்தில்
  alternative: ‘புனித இடம்’ எனப்படும் பகுதியில்
  rationale: எபிரெயச் சொற்றொடரில் சுட்டு உருபு இல்லாததால், அது கூடாரத்தின் குறிப்பிட்ட அறையைத்தான் குறிக்கிறது என்று உரையில் தீர்மானிக்கப்படவில்லை. மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பிரதிஷ்டை’, ‘அபிஷேகம்’ போன்ற மரபுசார் அல்லது சமயப் பிரிவுகளோடு வலுவாக இணையும் சொற்கள் தவிர்க்கப்பட்டு, ஆசாரிய நிறுவுதல் தெளிவாக விளக்கப்பட்டுள்ளது.
