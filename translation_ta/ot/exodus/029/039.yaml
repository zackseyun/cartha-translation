  text: אֶת הַ/כֶּ֥בֶשׂ הָ/אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/039.yaml
  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: ta
  text: அந்த ஒரு செம்மறியாட்டுக்குட்டியை நீ காலையில் பலியிட வேண்டும்; இரண்டாவது செம்மறியாட்டுக்குட்டியை மாலைவேளைகளுக்கு இடையில்[a] பலியிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாலைவேளைகளுக்கு இடையில்’ என்பது எபிரெய மொழியின் ஒரு மரபுத்தொடர். இது பெரும்பாலும் ‘அந்தி நேரத்தில்’ அல்லது பிற்பகுதியின் இறுதிக்கும் சூரிய மறைவுக்கும் இடைப்பட்ட நேரத்தில் என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: ஆட்டுக்குட்டி
  rationale: பலியைப் பற்றிய இச்சூழலில், இச்சொல் பலியிட ஏற்ற இளம் செம்மறியாட்டைக் குறிக்கிறது; நவீன தமிழில் ‘ஆட்டுக்குட்டி’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָאֶחָד
  choice: ஒரு
  rationale: எபிரெய உரையின் ‘அந்த ஒன்று’ என்ற பொருளைத் தமிழில் இயல்பான இணைப்பாக ‘ஒரு’ என வழங்குகிறது; தொடர்ந்து வரும் ‘இரண்டாவது’ வரிசையைத் தெளிவுபடுத்துகிறது.
- source_word: תַּעֲשֶׂה
  choice: நீ பலியிட வேண்டும்
  rationale: சொல்லளவில் ‘செய்வாய்’ என்றாலும், பலி சார்ந்த கட்டளையில் பலியைச் செலுத்துவதை இவ்வினை குறிக்கிறது; ‘பலியிட வேண்டும்’ அந்தச் செயலைத் தெளிவாகச் சொல்கிறது.
- source_word: בַבֹּקֶר
  choice: காலையில்
  rationale: குறிக்கப்பட்ட நேரத்தை நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: הַשֵּׁנִי
  choice: இரண்டாவது
  rationale: இரண்டு தினசரிப் பலிகளில் அடுத்ததைக் குறிக்கும் வரிசை எண்ணை நேரடியாகப் பாதுகாக்கிறது.
- source_word: בֵּין הָעַרְבָּיִם
  choice: இரு மாலைகளுக்கும் இடையில்
  rationale: எபிரெய மரபுத்தொடரின் சொல்லமைப்பையும் அதிலுள்ள விளக்கவியல் தெளிவின்மையையும் முதன்மை உரையில் பாதுகாக்கிறது; இயல்பான காலப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
