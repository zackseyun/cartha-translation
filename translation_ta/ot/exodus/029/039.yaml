revisions:
- from: ஒரு ஆட்டுக்குட்டியைக் காலையில் நீ பலியிட வேண்டும்; இரண்டாவது ஆட்டுக்குட்டியை இரு மாலைகளுக்கும் இடையில்[a] நீ பலியிட வேண்டும்.
  to: அந்த ஒரு செம்மறியாட்டுக்குட்டியை நீ காலையில் பலியிட வேண்டும்; இரண்டாவது செம்மறியாட்டுக்குட்டியை மாலைவேளைகளுக்கு இடையில்[a] பலியிட வேண்டும்.
  rationale: The revision preserves the Hebrew’s definite pairing (‘the one’/‘the second’), specifies the lamb as a young sheep, and retains the disputed temporal idiom in the text with a restrained explanatory footnote. It does not select a doctrinal or historically contested interpretation of the time expression.
