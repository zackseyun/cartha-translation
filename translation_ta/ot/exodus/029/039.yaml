translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. விவாதத்திற்குரிய எபிரெய காலக்குறிப்பு முதன்மை உரையில் நேரடியாகப் பாதுகாக்கப்பட்டு, அதன் வழக்கமான பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
