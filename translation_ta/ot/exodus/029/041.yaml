source:
  edition: WLC
  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכָּ/הּ֙ תַּֽעֲשֶׂה לָּ֔/הּ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: ta
  text: இரண்டாவது செம்மறியாட்டுக்குட்டியை மாலை மங்கும் வேளையில்[a] பலியிட வேண்டும். காலையில் செய்தது போலவே, அதற்குரிய தானியக் காணிக்கையையும் பானக் காணிக்கையையும் அதற்காகச் செலுத்த வேண்டும்; யாவேக்கு இனிய நறுமணமளிக்கும் உணவுப் பலியாகச் செலுத்த வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இரு மாலைகளுக்கு இடையில்”; இது பிற்பகுதியின் இறுதி அல்லது மாலை மங்கும் நேரத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நெருப்பில் செலுத்தப்படும் பலி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: இரண்டாவது செம்மறியாட்டுக்குட்டி
  rationale: כֶּבֶשׂ என்பது பலிக்குரிய இளம் செம்மறியாட்டைக் குறிக்கிறது; முந்தைய வசனத்தில் கூறப்பட்ட முதல் தினசரிப் பலியைத் தொடர்ந்து வருவதால் הַשֵּׁנִי என்பதை ‘இரண்டாவது’ என மொழிபெயர்த்துள்ளது.
- source_word: תַּעֲשֶׂה
  choice: பலியிட வேண்டும் / செலுத்த வேண்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், பலி சார்ந்த இச்சூழலில் ஆட்டுக்குட்டிக்கு ‘பலியிடு’ என்றும் உடன் வரும் காணிக்கைகளுக்கு ‘செலுத்து’ என்றும் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: בֵּין הָעַרְבָּיִם
  choice: மாலை மங்கும் வேளையில்
  rationale: சொல்லுக்கு சொல் ‘இரு மாலைகளுக்கு இடையில்’ எனும் எபிரெய மரபுத்தொடர் பிற்பகுதியின் இறுதி அல்லது அந்தி நேரத்தைக் குறிக்கிறது. தெளிவான நவீன தமிழுக்காக ‘மாலை மங்கும் வேளையில்’ என வழங்கி, நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: காலையில் செய்தது போலவே, அதற்குரிய தானியக் காணிக்கை
  rationale: பலிச்சட்டச் சூழலில் מִנְחָה என்பது மிருகப் பலியுடன் செலுத்தப்படும் தானியக் காணிக்கையைக் குறிக்கிறது. காலை பலியுடன் ஒப்பிடும் பொருளை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: וּכְנִסְכָּהּ
  choice: அதற்குரிய பானக் காணிக்கை
  rationale: נֶסֶךְ என்பது ஊற்றிச் செலுத்தப்படும் திரவக் காணிக்கை. ‘பானக் காணிக்கை’ என்பது அதன் தன்மையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: இனிய நறுமணமளிக்கும்
  rationale: இது பலி கடவுளுக்கு ஏற்புடையதாக இருப்பதை நறுமண உருவகத்தின் வழியாகக் கூறும் நிலையான பலிச் சொற்றொடர்; உருவகத்தை நீக்காமல் இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: אִשֶּׁה
  choice: உணவுப் பலி
  rationale: இச்சொல் யாவேக்கு அர்ப்பணிக்கப்படும் பலி வகையைக் குறிக்கிறது; ‘உணவுப் பலி’ என்பது அதன் சடங்குசார் வகைப்பாட்டை வெளிப்படுத்துகிறது. ‘நெருப்பில் செலுத்தப்படும் பலி’ என்ற பாரம்பரிய மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் கடவுளின் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது; அதனைப் பொதுப்பட்டமான பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்த்துள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல எபிரெய உரை தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துவதால், அதைத் தனிப்பெயராகவே ஒலிபெயர்ப்பது உரையின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: רֵיחַ נִיחֹחַ என்ற பலிச் சூத்திரத்தின் பொருள்
  choice: இனிய நறுமணமளிக்கும்
  alternative: ஏற்றுக்கொள்ளத்தக்க
  rationale: ‘ஏற்றுக்கொள்ளத்தக்க’ என்பது உட்கருத்தை விளக்கினாலும், மூலத்தில் உள்ள நறுமண உருவகத்தை வெளிப்படையாக வைத்திருப்பது கவித்துவத்தையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
- issue: אִשֶּׁה என்ற பலிச் சொல்லின் பொருள்
  choice: உணவுப் பலி
  alternative: நெருப்பில் செலுத்தப்படும் பலி
  rationale: சொல்லின் துல்லியமான உருவாக்கமும் பலிச் சார்ந்த நுட்பமும் விவாதத்துக்குரியவை. முதன்மை உரையில் பலி வகையைக் குறிக்கும் ‘உணவுப் பலி’ தரப்பட்டு, நெருப்புடன் தொடர்புடைய பாரம்பரியப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு உரைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தானியக் காணிக்கை’, ‘பானக் காணிக்கை’, ‘உணவுப் பலி’ ஆகியவை பலிச் சொற்களின் வேறுபாட்டைக் காக்கின்றன; அரிதான எபிரெய மரபுத்தொடர்களுக்கான விளக்கங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
