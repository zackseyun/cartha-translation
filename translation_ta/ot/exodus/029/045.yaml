  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: ta
  text: நான் இஸ்ரவேலின் மக்களிடையே குடியிருப்பேன்[a][b]; அவர்களுடைய கடவுளாக இருப்பேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலின் மக்கள் மத்தியில்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்’; மரபாக, ‘இஸ்ரவேலின் பிள்ளைகள்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவர்களுக்குக் கடவுளாக இருப்பேன்.’
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: நான் ... குடியிருப்பேன்
  rationale: שׁכן என்பது ஓரிடத்தில் தங்கி வாழ்வதைக் குறிக்கிறது. ‘குடியிருப்பேன்’ என்பது இறைவனின் நிலையான உடனிருப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மூலத்தில் நேரடியாக இல்லாத ‘திருக்கூடாரமிடுவேன்’ என்ற விளக்கத்தைப் புகுத்துவதில்லை.
- source_word: בְּתוֹךְ
  choice: இடையே
  rationale: மக்கள் குழுவுடன் வரும் בְּתוֹךְ, வெறும் நடுப்புள்ளியைக் காட்டாமல் அந்தச் சமூகத்தின் மத்தியில் இருக்கும் உடனிருப்பைக் குறிக்கிறது. தமிழில் ‘இடையே’ இதை இயல்பாகத் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்.’ ஆனால் இங்கு அது இஸ்ரவேல் சமூகத்தைக் குறிக்கும் மரபுச் சொற்றொடர்; நவீன தமிழில் ‘இஸ்ரவேலின் மக்கள்’ இயல்பாகவும் உள்ளடக்கத் துல்லியத்துடனும் உள்ளது. நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהָיִיתִי
  choice: இருப்பேன்
  rationale: היה இங்கு நிலைமாற்றத்தைக் காட்டும் ‘ஆவேன்’ என்பதைக் காட்டிலும் உடன்படிக்கை உறவைச் சுட்டும் ‘இருப்பேன்’ என்ற பொருளில் வருகிறது.
- source_word: לָהֶם
  choice: அவர்களுடைய
  rationale: எபிரெயத்தில் சொல்லுக்குச் சொல் ‘அவர்களுக்கு’ என்றாலும், உடன்படிக்கை வாய்பாட்டின் உறவுசார் வலிமையைத் தமிழில் ‘அவர்களுடைய கடவுள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵאלֹהִים
  choice: கடவுள்
  rationale: முதலாம் நபரில் பேசும் இறைவனும் இஸ்ரவேலுடனான உடன்படிக்கைச் சூழலும் இருப்பதால் אֱלֹהִים இங்கு குறிப்பிட்ட ஒரே கடவுளைக் குறிக்கிறது; ‘ஒரு கடவுள்’ அல்ல.
theological_decisions:
- issue: உடன்படிக்கை வாய்பாட்டின் மொழிபெயர்ப்பு
  choice: அவர்களுடைய கடவுளாக இருப்பேன்
  alternative: அவர்களுக்குக் கடவுளாக இருப்பேன்
  rationale: முதல் வடிவம் எபிரெய உடன்படிக்கை வாய்பாட்டின் உறவுசார் பொருளை இயல்பான தமிழில் தருகிறது. மேலும் நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: பாலினம் குறிக்கப்பட்ட மக்கள்-குழுச் சொற்றொடர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: בְּנֵי יִשְׂרָאֵל என்பதன் சொற்பொருள் ஆண்பால் பன்மையாக இருந்தாலும், இச்சூழலில் அது முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் எபிரெய இனவழிச் சொற்றொடர். நவீன தமிழில் தவறான ஆண்-மட்டும் பொருள் தோன்றாமல் இருக்கச் சமூகப் பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருப்பேன்’ இறைவனின் தொடர்ந்த உடனிருப்பைத் தருகிறது. மூலத்தின் உறவுசார் உடன்படிக்கை மொழி பாதுகாக்கப்பட்டதுடன், சொற்படியான மாற்றுகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
