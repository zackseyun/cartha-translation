base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/007.yaml
  text: Then you shall take the anointing oil and pour it on his head and anoint him.
translation:
  language: ta
  text: பின்பு அபிஷேக எண்ணெயை எடுத்து, அதை அவனுடைய தலையின்மேல் ஊற்றி, அவனை அபிஷேகம் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: பின்பு ... எடுத்து
  rationale: இணைப்புடன் வந்துள்ள வினைச்சொல் சடங்கு வழிமுறையின் அடுத்த படியைக் குறிக்கிறது. ‘பின்பு’ தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது; ‘எடுத்து’ அடுத்த கட்டளை வினைகளுடன் இணைந்து தமிழில் சரளமாக அமைகிறது.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெயை
  rationale: இது குறிப்பிட்ட அர்ப்பணிப்புச் சடங்குக்குரிய எண்ணெயைக் குறிக்கும் சொற்றொடர். ‘அபிஷேக எண்ணெய்’ நவீனத் தமிழில் சுருக்கமாகவும் சடங்குச் சிறப்பைப் பாதுகாக்கும் வகையிலும் உள்ளது.
- source_word: וְיָצַקְתָּ
  choice: ஊற்றி
  rationale: יצק என்பதன் நேரடிப் பொருள் ‘ஊற்று’. இணைவினையெச்ச வடிவம் தமிழ் வழிமுறைத் தொடரில் இயல்பாக இருந்து, செயலைத் தனித்ததாகவும் காக்கிறது.
- source_word: עַל רֹאשׁוֹ
  choice: அவனுடைய தலையின்மேல்
  rationale: எண்ணெய் ஊற்றப்படும் இடத்தை மூலத்தின் படி நேரடியாகக் குறிக்கிறது. ‘தலையின்மேல்’ இச்சூழலில் இயல்பான, தெளிவான தமிழ்.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: அவனை அபிஷேகம் செய்ய வேண்டும்
  rationale: משׁח குறிக்கும் சடங்கு மற்றும் அர்ப்பணிப்புப் பொருளை ‘அபிஷேகம் செய்’ துல்லியமாகப் பாதுகாக்கிறது. ‘வேண்டும்’ முழு வாக்கியத்திற்கும் கட்டளைத் தொனியை அளிக்கிறது.
theological_decisions:
- issue: எண்ணெயை ஊற்றுதல் மற்றும் அபிஷேகம் செய்தல் ஆகியவற்றின் சடங்கு வரிசை
  choice: ‘அதை அவனுடைய தலையின்மேல் ஊற்றி, அவனை அபிஷேகம் செய்ய வேண்டும்’ என்று இரு செயல்களையும் தனித்தனியாகக் கூறுதல்
  alternative: ‘அவனுடைய தலையில் எண்ணெயை ஊற்றி அவனை அபிஷேகம் செய்ய வேண்டும்’ என்பதை ஒரே விளக்கச் செயலாகப் புரியுமாறு சுருக்குதல்
  rationale: எபிரெய மூலத்தில் ‘ஊற்று’, ‘அபிஷேகம் செய்’ என்ற இரு இணைக்கப்பட்ட வினைகள் உள்ளன. அவற்றைத் தனித்தனியாக வைத்திருப்பது உடல் சார்ந்த செயலும் அர்ப்பணிப்புச் சடங்கும் இரண்டும் வெளிப்பட உதவுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கு வழிமுறைக்கேற்ற கண்ணியமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘அபிஷேகம்’ என்ற பரவலாக அறியப்பட்ட சடங்குச் சொல், மூலத்தின் தனிப்பொருளை விளக்கவுரையால் மாற்றாமல் பாதுகாக்கிறது.
