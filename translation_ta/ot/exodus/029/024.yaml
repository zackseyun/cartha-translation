  text: וְ/שַׂמְתָּ֣ הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: ta
  text: அனைத்தையும் ஆரோனின் உள்ளங்கைகளிலும் அவனுடைய மகன்களின் உள்ளங்கைகளிலும்[a] வைப்பாய். அவற்றை யாவே முன்னிலையில் அசைவாட்டுக் காணிக்கையாக அசைப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘ஆரோனின் உள்ளங்கைகளிலும் அவனுடைய மகன்களின் உள்ளங்கைகளிலும்’ என்று உள்ளது. சில மொழிபெயர்ப்புகள் இதைப் பொதுவாக ‘கைகளில்’ என வழங்குகின்றன; ஆனால் இங்குள்ள எபிரெயச் சொல் குறிப்பாக ‘உள்ளங்கைகள்’ என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: வைப்பாய்
  rationale: அறிவுறுத்தல் தொடரில் வரும் இந்த வினைவடிவம் கட்டளையைக் குறிக்கிறது; ‘வைப்பாய்’ என்பது அதன் எதிர்காலத் தோற்றத்தையும் கட்டளை வலிமையையும் இயல்பாகப் பேணுகிறது.
- source_word: הַכֹּל
  choice: அவை அனைத்தையும்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பல பலிப்பகுதிகளை இது தொகுத்துச் சுட்டுகிறது; பன்மைச் சூழலையும் முழுமையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל כַּפֵּי
  choice: உள்ளங்கைகளிலும்
  rationale: כַּף என்பது பொதுவாகக் ‘கை’ என்பதைக் காட்டிலும் குறிப்பாக உள்ளங்கையைக் குறிக்கிறது; சடங்கில் பொருட்களை உள்ளங்கைகள்மேல் வைக்கும் தெளிவான காட்சியை இது பேணுகிறது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்பட்ட பெயர்வடிவம்.
- source_word: בָנָיו
  choice: அவனுடைய மகன்கள்
  rationale: ஆசாரிய நியமனத்தில் பங்கேற்கும் ஆரோனின் ஆண் சந்ததியினரையே சூழல் குறிக்கிறது.
- source_word: וְהֵנַפְתָּ
  choice: அசைவாட்டுவாய்
  rationale: נוף என்பதன் ஹிஃபீல் வடிவம் பலிச் சடங்கில் காணிக்கையை அசைத்துக் காட்டும் அல்லது சமர்ப்பிக்கும் செயலைக் குறிக்கிறது; பெயர்ச்சொல்லுடனான மூலமொழியின் சொல்விளையாட்டையும் இது பேணுகிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: எபிரெயப் பன்மைச் சுட்டுப்பெயர் முன்னர் கூறப்பட்ட பல காணிக்கைப் பகுதிகளைக் குறிக்கிறது.
- source_word: תְּנוּפָה
  choice: அசைவாட்டுக் காணிக்கையாக
  rationale: சடங்கில் அசைத்து யாவேக்கு முன் சமர்ப்பிக்கப்படும் குறிப்பிட்ட காணிக்கை வகையைத் தெளிவாகக் குறிக்கும் தொழில்நுட்பச் சொற்றொடர்.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்/சந்நிதியில்’ என்ற உறவையும், יהוה என்ற உடன்படிக்கைப் பெயரையும் நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் இறைவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது; அதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது உரையின் தனிப்பெயர்த் தன்மையைப் பேணுகிறது.
- issue: சடங்கு வினையான נוף மற்றும் பெயர்ச்சொல் תְּנוּפָה இடையிலான தொடர்பு
  choice: ‘அசைவாட்டுக் காணிக்கையாக அசைவாட்டுவாய்’ என்று ஒரே வேர்ச்சொல் தொடர்பைப் பேணுதல்
  alternative: ‘அசைவாட்டுக் காணிக்கையாகச் செலுத்துவாய்’
  rationale: மூலத்தில் வினையும் பெயர்ச்சொல்லும் ஒரே வேரிலிருந்து வருவதால் உருவாகும் வலியுறுத்தலைத் தமிழ் வாசகத்திலும் காணச்செய்கிறது; சடங்கின் துல்லியமான இயக்கத்தையும் மறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்தியுள்ளது. சடங்கு சார்ந்த ‘அசைவாட்டுக் காணிக்கை’ என்ற சொல்லைத் துல்லியத்திற்காக வைத்துக் கொண்டு, மூலத்தின் வினை–பெயர்ச்சொல் மீளுருவாக்கத்தையும் பேணியுள்ளது.
