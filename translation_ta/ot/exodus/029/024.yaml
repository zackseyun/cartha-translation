  to: அனைத்தையும் ஆரோனின் உள்ளங்கைகளிலும் அவனுடைய மகன்களின் உள்ளங்கைகளிலும்[a] வைப்பாய். அவற்றை யாவே முன்னிலையில் அசைவாட்டுக் காணிக்கையாக அசைப்பாய்.
