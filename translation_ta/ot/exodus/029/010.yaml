  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/פָּ֔ר לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/סָמַ֨ךְ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הַ/פָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: ta
  text: காளையைச் சந்திப்புக் கூடாரத்தின் முன் கொண்டுவா[a]. ஆரோனும் அவன் மகன்களும் தங்கள் கைகளைக் காளையின் தலையின்மேல் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காளையைச் சந்திப்புக் கூடாரத்தின் முன் நிறுத்து” அல்லது “அருகே கொண்டுவா.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: கொண்டுவா
  rationale: קרב என்பதன் ஹிஃபில் வடிவம் பலிச் சடங்குச் சூழலில் ‘அருகே கொண்டுவருதல்’ அல்லது ‘முன்நிறுத்துதல்’ எனப் பொருள்படும். இங்கு ‘சந்திப்புக் கூடாரத்தின் முன்’ என்பது திசையையும் சடங்குச் சூழலையும் தெளிவாக்குவதால், இயல்பான நவீனத் தமிழில் ‘கொண்டுவா’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַפָּר
  choice: காளை
  rationale: פַּר என்பது பலிக்காகக் கொண்டுவரப்படும் ஆண் மாட்டைக் குறிக்கிறது; வயதை மூலவசனம் இங்கு வெளிப்படையாகக் குறிப்பிடாததால் ‘காளை’ போதுமான துல்லியமுடையது.
- source_word: לִפְנֵי
  choice: முன்
  rationale: இச்சொல் ஒரு இடத்துக்கு முன்னால் அல்லது அதன் சந்நிதியில் இருப்பதைக் குறிக்கிறது. இங்கு ‘முன்’ என்பது இடநிலையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: אֹהֶל מוֹעֵד என்பது தேவனும் மக்களும் சந்திக்கும் பரிசுத்தக் கூடாரத்திற்கான நிலையான பெயர். ‘சந்திப்புக் கூடாரம்’ அதன் சொற்பொருளையும் வழிபாட்டுச் சூழலையும் தெளிவாகத் தருகிறது.
- source_word: וְסָמַךְ
  choice: வைக்க வேண்டும்
  rationale: סמך என்பது பலியிடப்படும் விலங்கின் தலையின்மேல் கைகளை வைக்கும் சடங்குச் செயலைக் குறிக்கிறது. அதன் அடையாளப் பொருளை விளக்கிச் சேர்க்காமல், காணக்கூடிய செயல் மட்டும் மொழிபெயர்க்கப்பட்டது.
- source_word: יְדֵיהֶם
  choice: தங்கள் கைகளை
  rationale: எபிரெய மூலத்தில் ‘கைகள்’ பன்மையில் உள்ளது. ஆரோனும் அவன் மகன்களும் செய்யும் கூட்டுச் செயலைத் தமிழில் இயல்பாகக் காட்ட ‘தங்கள் கைகளை’ பயன்படுத்தப்பட்டது.
- source_word: עַל רֹאשׁ הַפָּר
  choice: காளையின் தலையின்மேல்
  rationale: மூலவசனத்திலுள்ள தெளிவான உடல் இயக்கத்தையும் அதன் இலக்கையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אַהֲרֹן וּבָנָיו
  choice: ஆரோனும் அவன் மகன்களும்
  rationale: בָּנָיו இச்சூழலில் ஆசாரியப் பணிக்காக அர்ப்பணிக்கப்படும் ஆரோனின் ஆண் சந்ததியினரைக் குறிக்கிறது; எனவே ‘மகன்கள்’ சூழலுக்குத் துல்லியமானது.
theological_decisions:
- issue: பலியிடப்படும் விலங்கின்மேல் கைகளை வைக்கும் சடங்கு
  choice: தங்கள் கைகளைக் காளையின் தலையின்மேல் வைக்க வேண்டும்
  alternative: தங்கள் கைகளைக் காளையின் தலையின்மேல் அழுத்தி வைக்க வேண்டும்
  rationale: செயல் தெளிவாகக் கூறப்பட்டாலும் அதன் இறையியல் அடையாளத்தை இவ்வசனம் விளக்கவில்லை. ஆகவே குற்றம் மாற்றப்படுதல் போன்ற பிற்கால விளக்கங்களைச் சேர்க்காமல் சடங்குச் செயல் மட்டும் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான கட்டளை நடையில் மொழிபெயர்க்கப்பட்டது. இரண்டாம் நபர் ஒருமைக் கட்டளை ‘கொண்டுவா’ என்றும், அடுத்த செயல் மூன்றாம் நபர் கடமை வடிவில் ‘வைக்க வேண்டும்’ என்றும் மூலத்தின் நபர் மாற்றம் பாதுகாக்கப்பட்டது. ‘சந்திப்புக் கூடாரம்’ என்பது אֹהֶל מוֹעֵד என்பதற்கான தெளிவான, பொருள்சார்ந்த பெயராகப் பயன்படுத்தப்பட்டது.
