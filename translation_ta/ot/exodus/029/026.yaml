  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: ta
  text: பின்பு, ஆரோனுக்கான குருத்துவ நியமன ஆட்டுக்கடாவின் மார்புப் பகுதியை நீ எடுத்து, அதை யாவேக்கு முன்பாக அசைவாட்டுக் காணிக்கையாக அசைக்க வேண்டும்; அது உனக்குரிய பங்காக இருக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזֶה
  choice: மார்புப் பகுதி
  rationale: பலிச் சடங்கின் சூழலில் חָזֶה என்பது விலங்கின் மார்பிலிருந்து பிரித்தெடுக்கப்படும் குறிப்பிட்ட பங்கைக் குறிக்கிறது; ‘மார்புப் பகுதி’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֵיל הַמִּלֻּאִים
  choice: குருத்துவ நியமனச் செம்மறியாட்டுக் கடா
  rationale: இந்தச் சொற்றொடர் ஆரோனை குருத்துவப் பணியில் அமர்த்தும் சடங்கில் பயன்படுத்தப்படும் கடாவைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘குருத்துவ நியமனம்’ பதவியில் அமர்த்தும் கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது; மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: ஆரோனுக்கான
  rationale: לְ என்ற முன்னொட்டின் தொடர்புப் பொருளைப் பேணி, இந்தக் கடா ஆரோனுக்கான சடங்குடன் தொடர்புடையது என்பதைச் சுருக்கமாகக் காட்டுகிறது; உரிமையை மட்டும் வலியுறுத்தவில்லை.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: அதை அசைவாட்டுக் காணிக்கையாக அசைத்துச் செலுத்த வேண்டும்
  rationale: נוּף என்ற வினைச்சொல்லையும் அதனுடன் தொடர்புடைய תְּנוּפָה என்ற சடங்குச் சொல்லையும் தமிழில் புரிந்துகொள்ளக்கூடிய வகையில் வெளிப்படுத்தி, அசைக்கும் சடங்குச் செயலும் காணிக்கையும் இரண்டையும் பேணுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் வழிபாட்டுச் சூழலிலான ‘முன்னிலையில்’ என்ற பொருளையும், יהוה என்ற இறைப் பெயரையும் நேரடியாகப் பேணுகிறது.
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: அது உனக்குரிய பங்காக இருக்கும்
  rationale: מָנָה என்பது ஒதுக்கப்பட்ட பங்கு அல்லது உரிய பங்கைக் குறிக்கிறது; தமிழ் வாசகருக்கு இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் ஒரு பொதுப் பட்டமல்ல, உடன்படிக்கையின் தனிப்பட்ட இறைப் பெயரான יהוה நேரடியாக உள்ளது. ஆகவே அதை ‘யாவே’ என ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பேணுகிறது.
- issue: הַמִּלֻּאִים என்ற குருத்துவச் சடங்குக் கலைச்சொல்
  choice: குருத்துவ நியமனம்
  alternative: அர்ப்பணிப்புச் சடங்கு
  rationale: இங்கு ஆரோன் குருத்துவப் பொறுப்பில் அமர்த்தப்படுவது மையமாக இருப்பதால் ‘குருத்துவ நியமனம்’ தேர்ந்தெடுக்கப்பட்டது. அதே சொல் புனிதப் பணிக்காக அர்ப்பணித்தல் என்ற பரிமாணத்தையும் கொண்டிருப்பதால் அந்த மாற்று அடிக்குறிப்பில் பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சடங்கின் மரியாதைமிக்க நடையைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அசைவாட்டுக் காணிக்கை’ மற்றும் ‘குருத்துவ நியமனம்’ ஆகியவை சூழலிலேயே பொருள் விளங்கும் தொழில்நுட்பச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன; கட்டளையின் ஒருமை இரண்டாம் நபர் வடிவம் ‘நீ ... வேண்டும்’ எனத் தெளிவாகப் பேணப்பட்டுள்ளது.
