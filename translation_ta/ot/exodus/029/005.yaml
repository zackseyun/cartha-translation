base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: ta
  text: பின்பு நீ அந்த ஆடைகளை எடுத்து, ஆரோனுக்கு உள்ளங்கியையும், ஏபோத்தின் மேலங்கியையும், ஏபோத்தையும், மார்பணியையும்[b] அணிவிக்க வேண்டும்; ஏபோத்தின் நெய்யப்பட்ட இடைக்கச்சையால் ஏபோத்தை அவன்மேல் கட்ட வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனை அதனால் இடைக்கட்ட வேண்டும்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினைச்சொல் அரிதானது; ஏபோத்தை ஆரோன்மேல் கட்டுவது அல்லது உறுதியாகப் பொருத்துவது என்பதை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: மரபுவழியாக இது “மார்புப்பதக்கம்” அல்லது “மார்புக்கவசம்” என அழைக்கப்படுகிறது. எபிரெயச் சொல் இன்னும் பொதுவாக மார்பில் அணியும் ஒரு பகுதியைக் குறிக்கிறது; ஆகவே இங்கு “மார்பணி” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ אֶת הַבְּגָדִים
  choice: பின்பு நீ அந்த ஆடைகளை எடுத்து
  rationale: அறிவுறுத்தல்களின் தொடரில் வரும் வாவ் இணைப்பை இயல்பான தமிழில் “பின்பு” எனக் காட்டுகிறது; בְּגָדִים என்பதற்கு பொதுவான “ஆடைகள்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהִלְבַּשְׁתָּ אֶת אַהֲרֹן
  choice: ஆரோனுக்கு … அணிவிக்க வேண்டும்
  rationale: לבש என்பதன் ஹிஃபில் வடிவிலுள்ள பிறவினைப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַכֻּתֹּנֶת
  choice: உள்ளங்கி
  rationale: உடலுக்கு நெருக்கமாக அணியப்படும் அடிப்படை நீண்ட ஆடையைக் குறிக்கும்; “அங்கி” என்ற பொதுச் சொல்லைவிட ஆடைகளின் அடுக்கைத் தெளிவுபடுத்துகிறது.
- source_word: מְעִיל הָאֵפֹד
  choice: ஏபோத்தின் மேலங்கி
  rationale: ஏபோத்துடன் தொடர்புடைய מְעִיל ஆடையை, எபிரெயக் கட்டமைப்புக்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் வழங்குகிறது.
- source_word: הָאֵפֹד
  choice: ஏபோத்
  rationale: துல்லியமான தமிழ் இணைச்சொல் இல்லாத தனிப்பட்ட ஆசாரிய ஆடைக்கான தொழில்நுட்பப் பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַחֹשֶׁן
  choice: மார்பணி
  rationale: மார்பில் அணியப்படும் அலங்காரப் பகுதியைக் குறிக்கிறது; போர்க்கவசம் என்ற தவறான எண்ணத்தைத் தரக்கூடிய சொல்லைத் தவிர்க்கிறது.
- source_word: וְאָפַדְתָּ לוֹ
  choice: அதை அவன்மேல் இறுக்கிப் பொருத்த வேண்டும்
  rationale: அரிதாக வரும் אפד வினைச்சொல் ஏபோத்தை அணிவித்து உறுதியாகப் பொருத்துவதைக் குறிக்கிறது. தமிழின் இயல்புக்காக மறைந்துள்ள செயப்படுபொருள் “அதை” என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: ஏபோத்தின் நெய்யப்பட்ட இடைக்கச்சையால்
  rationale: חֵשֶׁב இச்சூழலில் ஏபோத்தோடு இணைந்த நெய்யப்பட்ட இடைக்கச்சை அல்லது பட்டையைக் குறிக்கிறது.
theological_decisions:
- issue: ஆசாரிய ஆடையின் தொழில்நுட்பப் பெயர் אֵפֹד
  choice: ஏபோத் என ஒலிபெயர்த்தல்
  alternative: விளக்கப் பொருளை ஊகித்து மொழிபெயர்த்தல்
  rationale: அந்த ஆடையின் துல்லிய வடிவமும் செயல்பாடும் ஒரு சாதாரண தமிழ் ஆடைப்பெயரால் முழுமையாகக் கூறப்பட முடியாததால், மூலத்தின் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியாகப் புரியும் ஆனால் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ஆசாரிய ஆடைகளுக்கான தொழில்நுட்பச் சொற்களில் தேவையற்ற பிற்கால சமயப் பதங்கள் தவிர்க்கப்பட்டுள்ளன; “ஏபோத்” மட்டும் துல்லிய இணைச்சொல் இல்லாததால் ஒலிபெயர்க்கப்பட்டுள்ளது. அடிக்குறி [a] அது விளக்கும் அரிதான வினைச்சொல்லுக்குப் பின்னரும், [b] “மார்பணி”க்குப் பின்னரும் வைக்கப்பட்டுள்ளன.
