- from: நீ அந்த ஆட்டுக்கடாவைக் கொன்று, அதன் இரத்தத்தை எடுத்து, பலிபீடத்தின் மீது சுற்றிலும் தெளிக்க வேண்டும்.
  to: நீ அந்த ஆட்டுக்கடாவை அறுத்து, அதன் இரத்தத்தை எடுத்து, பலிபீடத்தின் எல்லாப் பக்கங்களிலும் தெளிக்க வேண்டும்.
