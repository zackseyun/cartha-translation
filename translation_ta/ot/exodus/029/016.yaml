lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: கொன்று
  rationale: சடங்குமுறைப்படி விலங்கைக் கொல்வதைக் குறிக்கும்; இயல்பான நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: הָאָיִל
  choice: ஆட்டுக்கடா
  rationale: ஆண் செம்மறியாட்டைக் குறிக்கும் எபிரெயச் சொல்லின் துல்லியமான, பொதுமக்களுக்கு விளங்கும் தமிழ் இணை.
- source_word: וְזָרַקְתָּ
  choice: தெளிக்க வேண்டும்
  rationale: பலிபீடத்தின் மீது இரத்தத்தை வீசி இடும் சடங்குச் செயலை தமிழில் இயல்பாகக் குறிக்கிறது; வெறுமனே ஊற்றுதல் என்ற பொருளைத் தவிர்க்கிறது.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: பலிபீடத்தின் மீது சுற்றிலும்
  rationale: இரத்தம் பலிபீடத்தைச் சுற்றியுள்ள பகுதிகளில் இடப்பட வேண்டும் என்ற மூலத்தின் இடவியல் கருத்தைப் பாதுகாக்கிறது.
