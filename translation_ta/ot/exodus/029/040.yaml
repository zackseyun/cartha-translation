  text: וְ/עִשָּׂרֹ֨ן סֹ֜לֶת בָּל֨וּל בְּ/שֶׁ֤מֶן כָּתִית֙ רֶ֣בַע הַ/הִ֔ין וְ/נֵ֕סֶךְ רְבִעִ֥ית הַ/הִ֖ין יָ֑יִן לַ/כֶּ֖בֶשׂ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/040.yaml
  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: ta
  text: அந்த ஒரு ஆட்டுக்குட்டிக்காக[c], கால் ஹின் அளவு இடித்துப் பெற்ற எண்ணெயோடு[b] கலந்த நுண்ணிய மாவில் பத்தில் ஒரு பங்கையும்[a], கால் ஹின் அளவு திராட்சரசத்தைப் பானப் படையலாகவும் படைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது இன்னும் வெளிப்படையாக, ‘ஓர் எப்பாவில் பத்தில் ஒரு பங்கு நுண்ணிய மாவு’ எனப் பொருள்படும். எபிரெயத்தில் ‘பத்தில் ஒரு பங்கு’ என்பது பலிகளுக்கான நிலையான அளவாகப் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இடித்துப் பெற்ற எண்ணெய்’ என்பது இடிக்கப்பட்ட அல்லது நசுக்கப்பட்ட ஒலிவப் பழங்களிலிருந்து பெறப்பட்ட எண்ணெயைக் குறிக்கிறது; இதை ‘பிழிந்த எண்ணெய்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அந்த ஒரு ஆட்டுக்குட்டிக்காக’ என்பதை ‘ஒரு ஆட்டுக்குட்டிக்காக’ என்றும் மொழிபெயர்க்கலாம். சூழலில், நாள்தோறும் செலுத்தப்படும் இரு ஆட்டுக்குட்டிகளில் முதலாவதை இது குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעִשָּׂרֹן
  choice: பத்தில் ஒரு பங்கு
  rationale: עִשָּׂרוֹן என்பது பலிச் சூழலில் ஓர் எப்பாவின் பத்தில் ஒரு பங்கு என்ற நிலையான அளவைக் குறிக்கிறது. எபிரெய மூலத்தில் பெரிய அலகு மீண்டும் சொல்லப்படாததால், அதை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் விளக்குவது மூல வடிவை காக்கிறது.
- source_word: סֹלֶת
  choice: நைசான மாவு
  rationale: பலிப் படையலுக்குப் பயன்படுத்தப்பட்ட நன்றாக அரைக்கப்பட்ட மாவைக் குறிக்கிறது; ‘நைசான மாவு’ தமிழில் தெளிவாகவும் மரியாதைமிக்க நடையிலும் உள்ளது.
- source_word: בָּלוּל בְּשֶׁמֶן
  choice: எண்ணெயில் ... கலந்து
  rationale: ב உடன் வரும் בלול, மாவு எண்ணெயோடு கலக்கப்படுவதைத் தெரிவிக்கிறது. தமிழ் வாக்கிய அமைப்பில் ‘எண்ணெயில் ... கலந்து’ என்பது இயல்பான இணைவு.
- source_word: כָּתִית
  choice: இடித்துப் பெற்ற
  rationale: ஒலிவப் பழங்களை இடித்து அல்லது நசுக்கிப் பெறப்பட்ட எண்ணெயைக் குறிக்கிறது. எண்ணெயையே ‘இடித்தது’ என்று சொல்லாமல் தயாரிப்பு முறையைத் தெளிவுபடுத்துகிறது.
- source_word: רֶבַע הַהִין / רְבִעִית הַהִין
  choice: கால் ஹின்
  rationale: இரு இடங்களிலும் ஒரு ஹின் அளவின் நான்கில் ஒரு பங்கு குறிக்கப்படுகிறது. பழங்கால அலகை மாற்றிக் கணக்கிடாமல் ஒரேவிதமாகப் பெயர்த்துள்ளது.
- source_word: וְנֵסֶךְ
  choice: பானப் படையல்
  rationale: ஊற்றிப் படைக்கப்படும் திராட்சரசப் படையலைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘பானப் படையல்’ என்பது ‘லிபேஷன்’ போன்ற கடினமான சொல்லைவிட நவீன வாசகருக்குத் தெளிவு.
- source_word: יָיִן
  choice: திராட்சரசம்
  rationale: இங்கு பலியோடு படைக்கப்படும் மதுவைக் குறிக்கிறது; ‘திராட்சரசம்’ என்பது பொருளைத் தெளிவாக அடையாளப்படுத்தும் வழக்கமான தமிழ் சொல்.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: அந்த ஓர் ஆட்டுக்குட்டிக்காக
  rationale: குறிப்புச் சுட்டும் உருபும் ‘ஒன்று’ என்ற எண்ணும் சேர்ந்து, சுற்றியுள்ள வசனங்களில் குறிப்பிடப்பட்ட இரு ஆட்டுக்குட்டிகளில் ஒன்றைச் சுட்டுகின்றன. ‘முதலாம் ஆட்டுக்குட்டி’ என்று விளக்கமாகத் தீர்மானிக்காமல் எபிரெய வடிவின் சுட்டுதலைக் காக்கிறது.
theological_decisions:
- issue: הָאֶחָד என்பது ‘ஓர் ஆட்டுக்குட்டி’யா அல்லது ‘முதலாம் ஆட்டுக்குட்டி’யா
  choice: அந்த ஓர் ஆட்டுக்குட்டி
  alternative: முதலாம் ஆட்டுக்குட்டி
  rationale: சூழலில் காலையில் செலுத்தப்படும் முதலாவது ஆட்டுக்குட்டி நோக்கமாக இருக்கலாம்; ஆனால் எண்ணை வரிசை எண்ணாக மாற்றுவது விளக்கவுரை ஆகும். ஆகவே மூலத்தின் உண்மையான தெளிவின்மை முதன்மை உரையில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பலி வழிபாட்டுக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வசனம் வினையில்லாத பட்டியலாக இருப்பினும், தமிழில் முழுமையானதும் இயல்பானதுமான வாக்கியத்திற்காகச் சுற்றியுள்ள கட்டளையிலிருந்து ‘படைக்க வேண்டும்’ சேர்க்கப்பட்டுள்ளது. ‘ஹின்’ என்ற பழங்கால அளவு மாற்றமின்றி வைக்கப்பட்டு, ‘பானப் படையல்’ வாசகருக்கு எளிதாகப் புரியும் தொழில்நுட்பச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
