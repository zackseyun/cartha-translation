  text: וְ/הָיָה֩ לְ/אַהֲרֹ֨ן וּ/לְ/בָנָ֜י/ו לְ/חָק עוֹלָ֗ם מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֥י תְרוּמָ֖ה ה֑וּא וּ/תְרוּמָ֞ה יִהְיֶ֨ה מֵ/אֵ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִ/זִּבְחֵ֣י שַׁלְמֵי/הֶ֔ם תְּרוּמָתָ֖/ם לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: ta
  text: அது ஆரோனுக்கும் அவன் மகன்களுக்கும் இஸ்ரவேலரிடமிருந்து நிரந்தரமாக விதிக்கப்பட்ட பங்காக இருக்கும். ஏனெனில், அது ஒரு காணிக்கை. அது இஸ்ரவேலரிடமிருந்து, அவர்களுடைய சமாதானப் பலிகளிலிருந்து, ஆண்டவருக்கான அவர்களுடைய காணிக்கையாக இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சமாதானப் பலிகள்” என்பதை “உறவுப் பலிகள்” அல்லது “நல்வாழ்வுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் முழுமை, நல்வாழ்வு, அமைதி ஆகிய கருத்துகளுடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... לְאַהֲרֹן וּלְבָנָיו
  choice: அது ஆரோனுக்கும் அவன் மகன்களுக்கும் ... உரிமையாக இருக்கும்
  rationale: எபிரெய வினைச்சொல் சொற்பொருளில் ‘அது இருக்கும்’ என்றாலும், இங்கு לְ உடன் சேர்ந்து ஆரோனுக்கும் அவன் மகன்களுக்கும் ஒதுக்கப்பட்ட உரிமைப் பங்கைச் சுட்டுகிறது.
- source_word: לְחָק עוֹלָם
  choice: நிரந்தர உரிமை
  rationale: חָק என்பது இச்சூழலில் விதிக்கப்பட்ட சட்டம் மட்டுமல்ல, ஆசாரியர்களுக்குரிய நிர்ணயிக்கப்பட்ட பங்கையும் குறிக்கலாம்; עוֹלָם அதன் தொடர்ந்த நிலையை உணர்த்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலர்
  rationale: ‘இஸ்ரவேலின் மகன்கள்’ என்பதற்கான இயல்பான, பொதுவாகப் புரியும் நவீனத் தமிழ் வடிவம்.
- source_word: תְרוּמָה / תְּרוּמָתָם
  choice: அர்ப்பணிக்கப்பட்ட பங்கு / அவர்கள் அர்ப்பணிக்கும் பங்கு
  rationale: תְרוּמָה என்பது ஆண்டவருக்கெனப் பிரித்தெடுத்து வழங்கப்படும் பங்கைக் குறிக்கிறது. ‘பங்கு’ என்ற சொல் இவ்வசனத்தில் ஆசாரியருக்குக் கிடைக்கும் பகுதியையும், கடவுளுக்குச் செலுத்தப்படும் அர்ப்பணிப்பையும் இயல்பாக இணைக்கிறது; எபிரெய மூலத்தின் மீள்வருகையும் தமிழில் காக்கப்படுகிறது.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: அவர்களுடைய சமாதானப் பலிகளிலிருந்து
  rationale: זִבְחֵי என்ற பலி சார்ந்த கருத்தையும் שְׁלָמִים என்பதன் மரபான ‘சமாதானப் பலிகள்’ என்ற பெயரையும் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: לַיהוָה
  choice: ஆண்டவருக்கு
  rationale: தெய்வீகப் பெயர் יהוה மரியாதை மரபுக்கு ஏற்ப ‘ஆண்டவர்’ என்று வழங்கப்படுகிறது; לְ இங்கு அர்ப்பணிப்பு யாருக்குச் செலுத்தப்படுகிறது என்பதைச் சுட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / யாவே
  rationale: யூத வாசிப்பு மரபையும் பரவலான தமிழ் வேதாகம நடையையும் பின்பற்றி, பெயரை ஊக ஒலிபெயர்ப்பாக வழங்காமல் மரியாதைப் பட்டமாக வழங்குகிறது.
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானப் பலிகள்
  alternative: உறவுப் பலிகள் / நல்வாழ்வுப் பலிகள்
  rationale: மரபாக அறியப்பட்ட வழிபாட்டுச் சொல்லை முதன்மை உரையில் வைத்தபடியே, அதன் பரந்த பொருள்—முழுமை, நல்வாழ்வு, மீட்டுறவு—அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு-சட்ட நடையைப் பயன்படுத்துகிறது. ‘அர்ப்பணிக்கப்பட்ட பங்கு’ என்பது தொழில்நுட்பமான பழைய சொற்களைத் தவிர்த்து, மூலத்தின் வழிபாட்டு மற்றும் உரிமை சார்ந்த இரு அம்சங்களையும் வெளிப்படுத்துகிறது.
