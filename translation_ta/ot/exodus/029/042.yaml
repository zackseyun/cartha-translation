base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: ta
  text: இது உங்கள் தலைமுறைகள்தோறும் சந்திப்புக் கூடாரத்தின் நுழைவாயிலில், யாவேயின் முன்னிலையில், வழக்கமான தகனபலியாக இருக்கும்[a]. அங்கே நான் உங்களைச் சந்தித்து, உன்னிடம் பேசுவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தொடர்ச்சியான தகனபலி’ அல்லது ‘நிலையாகச் செலுத்தப்படும் தகனபலி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘உங்களைச் சந்தித்து’ என்பது பன்மையிலும், ‘உன்னிடம் பேசுவேன்’ என்பது ஒருமையிலும் உள்ளது. இது பரந்த மக்களையும் குறிப்பாக மோசேயையும் வேறுபடுத்துவதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: வழக்கமான தகனபலி
  rationale: עֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் ‘தகனபலி’; תָּמִיד இங்கு இடைவிடாத செயலைவிட நிர்ணயிக்கப்பட்ட தொடர்ச்சியான வழக்கத்தைச் சுட்டுகிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: உங்கள் தலைமுறைகள்தோறும்
  rationale: அடுத்தடுத்து வரும் தலைமுறைகள் முழுவதிலும் இந்தக் கட்டளை தொடர்வதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில்
  rationale: פֶּתַח என்பதன் இடவியல் பொருளை ‘நுழைவாயில்’ என்றும், தேவன் சந்திக்கும் இடமான אֹהֶל מוֹעֵד என்பதைக் ‘சந்திப்புக் கூடாரம்’ என்றும் தெளிவாக வழங்குகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ஆராதனைச் சூழலிலான ‘முன்னிலையில்’ என்ற பொருளையும், יהוה என்ற இறைப்பெயரையும் தக்கவைக்கிறது.
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: அங்கே நான் உங்களைச் சந்தித்து
  rationale: יעד என்பதன் நிஃபால் வடிவம் ஏற்பாட்டின்படி சந்திப்பதைக் குறிக்கிறது; לָכֶם பன்மை என்பதால் ‘உங்களை’ என வழங்கப்பட்டுள்ளது.
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: உன்னோடு பேசுவேன்
  rationale: אֵלֶיךָ ஒருமை ஆண்பால் வடிவமாக இருப்பதால், மோசேயைக் குறிக்கும் ‘உன்னோடு’ என எண்ணிக்கை மாற்றம் பாதுகாக்கப்பட்டுள்ளது; ‘அங்கே’ முந்தைய தொடரில் இயல்பாக இடம்பெறுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப்பெயரே உள்ளது; எனவே அதன் பரவலான தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: பன்மையிலிருந்து ஒருமைக்கு மாறும் முன்னிலைப் பெயர்கள்
  choice: ‘உங்களைச் சந்தித்து’ என்ற பன்மையையும் ‘உன்னோடு பேசுவேன்’ என்ற ஒருமையையும் தக்கவைத்தல்
  alternative: இரண்டையும் பன்மையாகவோ ஒருமையாகவோ ஒரேமாதிரி ஆக்குதல்
  rationale: לָכֶם பன்மை; אֵלֶיךָ ஒருமை. இந்த மாற்றம் பரந்த சமூகத்தையும் குறிப்பாக மோசேயையும் வேறுபடுத்தக்கூடும்; மூலத்தின் திறந்த பதற்றத்தைச் சீராக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பலியிடும் சூழலுக்குரிய ‘தகனபலி’, ‘சந்திப்புக் கூடாரம்’ போன்ற நிலையான சொற்கள் பயன்படுத்தப்பட்டுள்ளன; எபிரெயத்தின் முன்னிலைப் பெயர் எண்ணிக்கை மாற்றம் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது.
