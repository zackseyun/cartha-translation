translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கு அறிவுறுத்தலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. ஒருமை முன்னிலை ‘நீ’ வெளிப்படையாக வைக்கப்பட்டு, கட்டளைத் தொடரின் வலிமை ‘வேண்டும்’ வடிவால் தெரிவிக்கப்பட்டுள்ளது. அடிக்குறி குறிக்கும் சொல் முதன்மை உரையில் சரியான கல்லீரல் பகுதியைத் தொடர்ந்து வைக்கப்பட்டுள்ளது.
