source:
  edition: WLC
  text: וְ/לָֽקַחְתָּ֗ אֶֽת כָּל הַ/חֵלֶב֮ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּרֶב֒ וְ/אֵ֗ת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֖לֶב אֲשֶׁ֣ר עֲלֵי/הֶ֑ן וְ/הִקְטַרְתָּ֖ הַ/מִּזְבֵּֽחָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: ta
  text: பின்னர், உட்பாகங்களை மூடியிருக்கும் கொழுப்பு முழுவதையும், கல்லீரலின்மேல் உள்ள பகுதியையும்[a], இரண்டு சிறுநீரகங்களையும், அவற்றின்மேல் உள்ள கொழுப்பையும் நீ எடுத்து, பலிபீடத்தின்மேல் எரிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கல்லீரலின் மடல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் கல்லீரலுடன் இணைந்த ஒரு குறிப்பிட்ட பகுதியைக் குறிக்கிறது; ஆனால் அது எந்த உடற்கூற்றுப் பகுதி என்பது துல்லியமாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: நீ எடுத்து
  rationale: இணைப்புடன் வரும் நிறைவுவினை இங்கு தொடர்ச்சியான சடங்கு அறிவுறுத்தலாகச் செயல்படுகிறது; அடுத்த வினையுடன் இணைத்து இயல்பான தமிழில் கட்டளையின் வலிமை காக்கப்படுகிறது.
- source_word: כָּל הַחֵלֶב
  choice: கொழுப்பு முழுவதையும்
  rationale: பலியிடப்படும் விலங்கின் கொழுப்புப் பகுதிகளைக் குறிக்கும்; நவீன வாசகருக்கு தெளிவான பொதுவழக்குச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: உட்பாகங்களை மூடியிருக்கும்
  rationale: קֶרֶב இச்சூழலில் விலங்கின் உள் உறுப்புகள் அல்லது உட்குழிப் பகுதிகளைக் குறிக்கிறது; ‘உட்பாகங்கள்’ இயல்பாகவும் போதுமான அளவு பரந்த பொருளுடனும் உள்ளது.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: கல்லீரலின்மேல் உள்ள பகுதி
  rationale: கல்லீரலுடன் இணைந்த ஒரு குறிப்பிட்ட உடற்கூற்றுப் பகுதியைக் குறித்தாலும் அதன் துல்லியமான நவீன உடற்கூற்றியல் அடையாளம் உறுதியில்லை. ஆகவே ‘மடல்’ என்று மிகத் துல்லியமாக முடிவுசெய்யாமல், עַל என்பதையும் பிரதிபலிக்கும் பொதுவான சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: இரண்டு சிறுநீரகங்களையும்
  rationale: நேரடியான உடற்கூற்றியல் குறிப்பு; தமிழின் வழக்கமான பெயர் பயன்படுத்தப்பட்டது.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: அவற்றின்மேல் உள்ள கொழுப்பையும்
  rationale: சிறுநீரகங்களோடு தொடர்புடைய கொழுப்பைக் குறிக்கும் எபிரெய நேரடிச் சொல்லமைப்பு தமிழிலும் காக்கப்படுகிறது.
- source_word: וְהִקְטַרְתָּ
  choice: எரிக்க வேண்டும்
  rationale: קטר என்பதன் ஹிஃபில் வடிவம் பலிபீடத்தில் பலியாக எரிப்பதைக் குறிக்கிறது; பலிபீடம் என்ற சூழல் அந்தச் சடங்குப் பொருளைத் தெளிவாக்குவதால் எளிய நவீன வினை தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: திசைச்சுட்டும் இறுதி எழுத்து பலிபீடத்தின் மேல் வைப்பதைக் குறிக்கிறது; தமிழ் வேற்றுமை வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
