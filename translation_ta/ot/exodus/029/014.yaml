base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: ta
  text: ஆனால் காளையின் சதையையும், அதன் தோலையும், அதன் சாணத்தையும் முகாமுக்கு வெளியே நெருப்பால் எரிக்க வேண்டும். அது பாவநிவாரணப் பலி[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுத்திகரிப்புப் பலி.’ எபிரெய חַטָּאת என்பது ‘பாவம்’ என்பதையோ, பாவம் தொடர்பாகச் செலுத்தப்படும் பலியையோ குறிக்கலாம். இத்தகைய பலிச்சடங்கு சூழல்களில் பலர் இதை ‘பாவநிவாரணப் பலி’ என்று மொழிபெயர்க்கின்றனர்; சடங்கின் தூய்மைப்படுத்தும் பணியை வலியுறுத்த சிலர் ‘சுத்திகரிப்புப் பலி’ என்கின்றனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: காளையின் சதை
  rationale: பலிச்சடங்கின் உடல்சார்ந்த பொருளை நேரடியாகக் காட்ட ‘சதை’ இயல்பானதும் துல்லியமானதும் ஆகும்; ‘இறைச்சி’ சமையல் சார்ந்த நுண்பொருளைத் தரக்கூடும்.
- source_word: עֹרוֹ
  choice: அதன் தோல்
  rationale: விலங்கின் வெளிப்புறத் தோலைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: פִּרְשׁוֹ
  choice: அதன் சாணம்
  rationale: எபிரெயச் சொல் கழிவு அல்லது மலத்தையே குறிக்கிறது; குடல் உறுப்புகள் என்ற தவறான பொருள் வராமல் ‘சாணம்’ பயன்படுத்தப்பட்டது.
- source_word: תִּשְׂרֹף
  choice: எரிக்க வேண்டும்
  rationale: இரண்டாம் நபர் ஒருமை ஆண்பால் வடிவத்தின் கட்டளை வலிமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּאֵשׁ
  choice: நெருப்பால்
  rationale: בְּ இங்கு கருவிப்பொருளில் வருகிறது; எரிப்பதற்கான சாதனம் நெருப்பு என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: முகாமுக்கு வெளியே
  rationale: வனாந்தர முகாமின் எல்லைக்கு அப்பாலுள்ள இடத்தை நவீனத் தமிழில் தெளிவாகச் சொல்கிறது.
- source_word: חַטָּאת
  choice: பாவநிவாரணப் பலி
  rationale: பலிச்சடங்கு சூழலில் இது வெறும் ‘பாவம்’ அல்ல, பாவம் தொடர்பாகச் செலுத்தப்படும் பலியைக் குறிக்கிறது. தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட ‘பாவநிவாரணப் பலி’ முதன்மை உரையில் வாசகருக்கு தெளிவாக உள்ளது; சுத்திகரிப்புச் செயல்பாட்டை வலியுறுத்தும் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הוּא
  choice: அது
  rationale: காளை அல்லது அதற்குரிய பலிச்சடங்கைச் சுட்டி, ‘அது ... பலி’ என்ற அடையாளப்படுத்தும் வாக்கியத்தை இயல்பாக அமைக்கிறது.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: …யையும், …யையும், …யையும்
  rationale: எபிரெய மூலத்தின் மீளும் இணைப்பையும் பட்டியல் அமைப்பையும் தமிழில் இயல்பாகப் பேணுகிறது.
theological_decisions:
- issue: பலிச்சட்டங்களில் חַטָּאת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரணப் பலி
  alternative: சுத்திகரிப்புப் பலி; பாவப்பலி; பாவம்
  rationale: உடனடி பலிச்சடங்கு சூழல், இச்சொல் ஒரு பலியைக் குறிப்பதைத் தெளிவாக்குகிறது. ‘பாவநிவாரணப் பலி’ அறியப்பட்ட தமிழ்ச் சொல்லாகவும் பாவத்துடனான தொடர்பைப் பேணுவதாகவும் உள்ளது. சடங்கின் தூய்மைப்படுத்தும் பணியை முன்னிறுத்தும் ‘சுத்திகரிப்புப் பலி’ என்ற மாற்று, பொருள் சார்ந்த உண்மையான நுணுக்கமாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியக்கூடிய கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டது. எபிரெயப் பட்டியலின் மீளும் இணைப்பு பேணப்பட்டது; ‘சாணம்’ என்ற நேரடிச் சொல் மென்மைப்படுத்தப்படவில்லை.
