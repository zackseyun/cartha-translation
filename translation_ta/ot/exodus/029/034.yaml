base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: ta
  text: ஆசாரியப் பதவி நிறுவும் பலியின்[a] இறைச்சியிலோ அப்பத்திலோ ஏதாவது காலைவரை மீந்திருந்தால், மீந்ததை நீ நெருப்பில் எரித்துவிட வேண்டும். அது பரிசுத்தமானது; ஆகவே அதை உண்ணக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிரதிஷ்டைப்படுத்தும் பலி.” எபிரெயச் சொல் ஆசாரியர்கள் பதவியில் நிறுவப்படும் சடங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר
  choice: மீந்திருந்தால்
  rationale: יתר என்பதன் நிஃபால் வடிவம் ஒன்று மீதியாக இருப்பதைக் குறிக்கிறது. நிபந்தனை அமைப்பையும் செயல்படுபொருள் குறிப்பிடப்படாத நிலையையும் ‘மீந்திருந்தால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּשַׂר
  choice: இறைச்சி
  rationale: பலியிடப்பட்ட விலங்கின் உடலைக் குறிக்கும் concrete பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: הַמִּלֻּאִים
  choice: குருக்களைப் பணியில் அமர்த்தும் பலி
  rationale: இந்த ஆசாரச் சூழலில் מִלֻּאִים என்பது குருக்கள் தங்கள் பணியில் நிறுவப்படும் சடங்கைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘பலி’ என்பது சூழலிலிருந்து சேர்க்கப்பட்டுள்ளது.
- source_word: לֶּחֶם
  choice: அப்பம்
  rationale: வழிபாட்டு மற்றும் பலிச் சூழலுக்கு ஏற்ற, பரவலாகப் புரிந்துகொள்ளப்படும் நேரடி மொழிபெயர்ப்பு.
- source_word: עַד הַבֹּקֶר
  choice: காலைவரை
  rationale: עַד குறிக்கும் கால எல்லையைச் சுருக்கமாகவும் துல்லியமாகவும் காக்கிறது.
- source_word: וְשָׂרַפְתָּ
  choice: நீ நெருப்பில் எரித்துவிட வேண்டும்
  rationale: நிபந்தனையின் விளைவாக வரும் கட்டளையை இயல்பான தமிழ் சட்டநடையில் வெளிப்படுத்துகிறது; இரண்டாம் நபர் ஒருமையும் காக்கப்படுகிறது.
- source_word: הַנּוֹתָר
  choice: மீந்ததை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பங்கேற்பு வடிவத்தின் பொருளைச் சுருக்கமாகத் தருவதோடு, முன்னுள்ள יתר வேர்ச்சொல்லுடனான தொடர்பையும் காக்கிறது.
- source_word: בָּאֵשׁ
  choice: நெருப்பில்
  rationale: எரித்தல் நிகழும் ஊடகத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: לֹא יֵאָכֵל
  choice: அதை உண்ணக்கூடாது
  rationale: செயப்பாட்டு வடிவத்தில் உள்ள தடையை நவீனத் தமிழில் தெளிவான சட்டக் கட்டளையாகத் தருகிறது.
- source_word: קֹדֶשׁ
  choice: பரிசுத்தமானது
  rationale: வழிபாட்டுக்கெனப் பிரித்துவைக்கப்பட்ட நிலையைத் தெரிவிக்கும் வழக்கமான வேதாகமத் தமிழ்ச் சொல்; இங்கு பெயர்ப் பயனிலையின் வலிமையைக் காக்கிறது.
theological_decisions:
- issue: குருத்துவ நிறுவல் சடங்கைக் குறிக்கும் הַמִּלֻּאִים என்பதன் மொழிபெயர்ப்பு
  choice: குருக்களைப் பணியில் அமர்த்தும் பலி
  alternative: அர்ப்பணிப்புப் பலி
  rationale: இச்சொல் பொதுவான அர்ப்பணிப்பை மட்டுமல்லாமல், யாத்திராகமம் 29-இல் குருக்கள் பணியில் நிறுவப்படும் குறிப்பிட்ட சடங்கைச் சுட்டுகிறது. எனவே பிரதான உரை அதன் சூழல்சார் பொருளை வெளிப்படையாகக் கூறுகிறது; சுருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மதிப்புள்ள சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீ’ என்பது எபிரெய மூலத்தின் இரண்டாம் நபர் ஒருமையைப் பாதுகாக்கிறது. காரண உறவு ‘ஆகவே’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
