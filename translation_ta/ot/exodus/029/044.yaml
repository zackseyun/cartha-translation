id: EXO.29.44
reference: Exodus 29:44
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֛י אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/אֶת אַהֲרֹ֧ן וְ/אֶת בָּנָ֛י/ו אֲקַדֵּ֖שׁ לְ/כַהֵ֥ן לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: ta
  text: சந்திப்புக் கூடாரத்தையும் பலிபீடத்தையும் நான் புனிதப்படுத்துவேன்[a]; ஆரோனையும் அவன் மகன்களையும் எனக்கு ஆசாரியப் பணி செய்யும்படி புனிதப்படுத்துவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புனிதப்படுத்துவேன்’ என்பதற்கு, இரண்டு இடங்களிலும் ‘புனிதப் பணிக்கென ஒதுக்கிவைப்பேன்’ அல்லது ‘பரிசுத்தப்படுத்துவேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘எனக்காக ஆசாரியராகப் பணிசெய்யும்படி.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: புனிதப்படுத்துவேன்
  rationale: קדשׁ என்பதன் பியேல் வடிவம், ஒருவரையோ ஒன்றையோ புனிதமான பயன்பாட்டுக்காக ஒதுக்கி வைப்பதைக் குறிக்கிறது. இரண்டு இடங்களிலும் ஒரே வினைச்சொல்லைப் பயன்படுத்தி எபிரெய உரையின் மீளுரைப்பைப் பேணுகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: கடவுள் தம் மக்களைச் சந்திப்பதற்கென நியமிக்கப்பட்ட கூடாரத்தைக் குறிக்கும் மரபானதும் தெளிவானதுமான மொழிபெயர்ப்பு.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: பலிகள் செலுத்தப்படும் பீடத்தைக் குறிக்கும் தெளிவான வழிபாட்டுச் சொல்.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழில் பரவலாக அறியப்பட்ட பெயரெழுத்தாக்கம்.
- source_word: בָּנָיו
  choice: அவன் மகன்கள்
  rationale: எபிரெயச் சொல் குறிப்பாக மகன்களைக் குறிக்கிறது; ஆகவே அதை பொதுவாக ‘பிள்ளைகள்’ என்று மாற்றவில்லை.
- source_word: לְכַהֵן לִי
  choice: எனக்கு ஆசாரியப் பணி செய்யும்படி
  rationale: כהן என்ற வினை ஆசாரியராகப் பணிபுரிவதைக் குறிக்கிறது; לִי கடவுளுக்காக அல்லது கடவுளுக்குச் செய்யப்படும் பணியைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: வழிபாட்டுச் சூழலில் வரும் பரிசுத்த மொழிநடை
  choice: புனிதப்படுத்துவேன்
  alternative: புனிதப் பணிக்கென ஒதுக்கிவைப்பேன் / பரிசுத்தப்படுத்துவேன்
  rationale: இவ்வசனம் வழிபாட்டிடத்தையும் ஆசாரியர்களையும் கடவுளுக்கெனப் புனிதமாக ஒதுக்குவதைப் பற்றியது. தேர்ந்த சொல் அந்தச் சடங்கு சார்ந்த பொருளைத் தெளிவாகக் காட்டுகிறது; அதேவேளை மூலத்தில் இருமுறை வரும் வினைச்சொல்லையும் ஒரேவிதமாக வழங்குகிறது.
- issue: ஆசாரியப் பணிக்கான பாலினக் குறிப்பு
  choice: அவன் மகன்கள்
  alternative: அவன் பிள்ளைகள்
  rationale: மூல எபிரெயம் ஆண்பாலைக் குறிப்பாகச் சொல்கிறது; சூழலும் ஆரோனின் மகன்களுடைய ஆசாரியப் பணியையே குறிக்கிறது.
translation_notes:
  register: நவீனத் தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு மொழிநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் மீண்டும் வரும் קדשׁ ஒரே தமிழ்ச் சொல்லால் இரு இடங்களிலும் வழங்கப்பட்டுள்ளது; ‘ஆசாரியப் பணி செய்யும்படி’ என்பது பெயர்ச்சொல் சார்ந்த கனமான நடையைத் தவிர்த்து, மூலத்தின் வினைச்சொல் தன்மையை இயல்பாகப் பேணுகிறது.
