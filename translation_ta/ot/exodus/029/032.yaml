  terminology: ‘ஆரோன்,’ ‘ஆட்டுக்கடா,’ ‘அப்பம்,’ and ‘சந்திப்புக் கூடாரம்’ are appropriate and consistent terms. ‘மகன்கள்’ properly preserves the source’s male priestly reference. The footnote marker is correctly anchored to ‘சதை’ and accurately explains the lexical alternative without altering the main text.
