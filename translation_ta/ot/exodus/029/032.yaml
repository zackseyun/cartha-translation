  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אָכַ֨ל אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת בְּשַׂ֣ר הָ/אַ֔יִל וְ/אֶת הַ/לֶּ֖חֶם אֲשֶׁ֣ר בַּ/סָּ֑ל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: ta
  text: ஆரோனும் அவன் மகன்களும் ஆட்டுக்கடாவின் சதையையும் கூடையில் இருக்கும் அப்பத்தையும் சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் சாப்பிட வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆட்டுக்கடாவின் இறைச்சியை.’ எபிரெயச் சொல் சொல்லுக்குச் சொல் ‘சதை’ என்று பொருள்படும்; பலியிடுதல் தொடர்பான சூழல்களில் அது உணவாக உண்ணப்படும் இறைச்சியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָכַל
  choice: சாப்பிட வேண்டும்
  rationale: சடங்கு அறிவுறுத்தலின் சூழலில் இவ்வினைவடிவம் கடந்தகால நிகழ்வைக் குறிக்காமல், செய்ய வேண்டிய செயலைக் குறிக்கிறது. நவீன தமிழில் அதன் விதிப்பொருளை இயல்பாகத் தெரிவிக்க ‘சாப்பிட வேண்டும்’ பயன்படுத்தப்பட்டது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
- source_word: וּ/בָנָי/ו
  choice: அவனுடைய மகன்களும்
  rationale: இந்த ஆசாரிய நியமனச் சூழலில் בנים என்பது ஆரோனின் ஆண் பிள்ளைகளையே குறிப்பதால் ‘மகன்கள்’ எனத் துல்லியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: בְּשַׂר
  choice: சதை
  rationale: בשר என்பதன் அடிப்படைப் பொருள் ‘சதை.’ பலியுணவுச் சூழலில் ‘இறைச்சி’ என்றும் பொருள்படலாம்; மூலச்சொல்லின் நேரடித்தன்மையை முதன்மை உரை காக்கிறது.
- source_word: הָ/אַיִל
  choice: ஆட்டுக்கடா
  rationale: אַיִל என்பது பலியாக்கப்படும் ஆண் செம்மறியாட்டைக் குறிக்கிறது; தமிழில் இயல்பான குறிப்பிட்ட பெயராக ‘ஆட்டுக்கடா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַ/לֶּחֶם
  choice: அப்பம்
  rationale: לֶחֶם என்பதன் வழக்கமான பொருள் ‘அப்பம்’; முந்தைய சடங்குச் சூழலில் கூடையில் வைக்கப்பட்ட அப்ப வகைகளை இது தொகுப்பாகக் குறிக்கிறது.
- source_word: אֲשֶׁר בַּ/סָּל
  choice: கூடையில் இருக்கும்
  rationale: இந்த உறவுத்தொடர் அப்பம் சடங்குக்குரிய கூடையில் இருப்பதை அடையாளப்படுத்துகிறது.
- source_word: פֶּתַח
  choice: நுழைவாயிலில்
  rationale: פֶּתַח என்பது நுழைவிடம் அல்லது வாயிலைச் சுட்டுகிறது. இங்கு உண்பது நடைபெறும் இடத்தைக் குறிக்கும் வகையில் ‘நுழைவாயிலில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் தமது மக்களைச் சந்திப்பதற்குரிய பரிசுத்த கூடாரத்தைச் சுட்டும் இச்சொற்றொடருக்கு தெளிவான, நிலையான தமிழாக்கம்.
theological_decisions:
- issue: ஆசாரியச் சூழலில் பாலினத்தைக் குறிப்பாகத் தெரிவிக்கும் மொழி
  choice: அவன் மகன்களும்
  alternative: அவன் பிள்ளைகளும்
  rationale: இவ்வசனம் ஆரோனின் குடும்பம் முழுவதையும் பொதுவாகக் குறிக்காமல், நியமிக்கப்படும் ஆண் ஆசாரியர்களைக் குறிக்கிறது; எனவே மூலத்தின் குறிப்பிட்ட பொருள் காக்கப்பட்டது.
- issue: சடங்கு அறிவுறுத்தலின் வினைவலிமை
  choice: சாப்பிட வேண்டும்
  alternative: சாப்பிடுவார்கள்
  rationale: எபிரெய வடிவம் இங்கு வெறும் எதிர்கால முன்னறிவிப்பாகவோ கடந்தகாலக் கதையாகவோ இல்லாமல் விதிக்கப்பட்ட செயலைக் குறிக்கிறது. ‘வேண்டும்’ என்பது தமிழில் அந்த அறிவுறுத்தல் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. ‘சதை’ மூலச்சொல்லின் நேரடிப் பொருளைக் காக்கிறது; வாசகருக்குப் பரிச்சயமான ‘இறைச்சி’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. வாக்கிய அமைப்பு, உண்பதற்குரிய இடம் சந்திப்புக் கூடாரத்தின் நுழைவாயில் என்பதைக் தெளிவாகக் காட்டுகிறது.
