  terminology: ‘புளிப்பில்லாத,’ ‘அப்பம்,’ ‘அடை,’ and ‘மெல்லிய அடை’ preserve the relevant culinary distinctions well. ‘எண்ணெய் பூசப்பட்ட’ fittingly renders the culinary sense of מְשֻׁחִים without imposing a ritual-anointing meaning. ‘நுண்ணிய கோதுமை மாவு’ clearly conveys סֹלֶת חִטִּים.
