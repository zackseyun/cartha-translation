- source_word: רְקִיקֵי מַצּוֹת
  choice: புளிப்பில்லாத மெல்லிய அடைகள்
  rationale: רָקִיק என்பது மெல்லிய அடை அல்லது தகடு போன்ற அப்பத்தைக் குறிக்கிறது. ‘மெல்லிய அடைகள்’ என்பது தடிமனான חַלּוֹת என்பவற்றுடனான வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: எண்ணெய் பூசப்பட்ட
  rationale: משׁח பொதுவாக ‘அபிஷேகம் செய்’ என்று பொருள்பட்டாலும், இங்கு உணவு தயாரிப்பில் எண்ணெயைப் பூசுவதைக் குறிக்கிறது. வழக்கமான தமிழில் சூழலுக்கு இயல்பாக ‘பூசப்பட்ட’ எனத் தரப்பட்டுள்ளது; அதன் சொல்லியல் தொடர்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: סֹלֶת חִטִּים
  choice: கோதுமையின் நைசான மாவு
  rationale: סֹלֶת என்பது நன்றாக அரைக்கப்பட்ட உயர்தர மாவையும் חִטִּים கோதுமையையும் குறிக்கின்றன. ‘நைசான மாவு’ என்பது சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழ்.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: செய்ய வேண்டும்
  rationale: சடங்குச் சட்டத்தின் கட்டளை வலிமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மְשֻׁחִים என்ற சொல்லின் சடங்குசார் ‘அபிஷேகம்’ தொடர்பும் உணவுத் தயாரிப்பு அர்த்தமும்
  choice: முதன்மை உரையில் ‘எண்ணெய் பூசப்பட்ட’
  alternative: ‘எண்ணெயால் அபிஷேகம் செய்யப்பட்ட’
  rationale: சொல்லின் வழக்கமான அர்த்தம் ‘அபிஷேகம் செய்யப்பட்ட’ என்பதாக இருந்தாலும், இச்சூழலில் அது மெல்லிய அடைகளின் தயாரிப்பு முறையை விவரிக்கிறது. தேவையற்ற இறையியல் நுண்பொருளை உணவுப் பொருளின் மீது சுமத்தாமல், சொல்லியல் தொடர்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவழிக் கட்டளைக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அப்பம்’, ‘அடை’, ‘மெல்லிய அடை’ என்ற சொற்கள் மூன்று வகைகளுக்கிடையிலான வேறுபாட்டை எளிதில் உணர்த்துகின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
