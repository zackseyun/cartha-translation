translation:
  language: ta
  text: புளிப்பில்லாத அப்பத்தையும், எண்ணெய் கலந்த புளிப்பில்லாத அடைகளையும்[a], எண்ணெய் பூசப்பட்ட புளிப்பில்லாத மெல்லிய அடைகளையும்[b] அவற்றை நுண்ணிய கோதுமை மாவால் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடைகள்’ என்பதற்கு ‘அப்பங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஓர் அப்ப வடிவிலான உணவுப் பொருளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘எண்ணெய் பூசப்பட்ட’ என்பதற்கான எபிரெய வினைச்சொல் பொதுவாக ‘அபிஷேகம் செய்யப்பட்ட’ என்ற பொருளில் பயன்படுத்தப்படுகிறது; இங்கு அது மெல்லிய அடைகளின் தயாரிப்பு முறையை விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
