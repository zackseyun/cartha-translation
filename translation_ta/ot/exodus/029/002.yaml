- source_word: חַלֹּת מַצֹּת
  choice: புளிப்பில்லாத அடைகள்
  rationale: חַלָּה என்பது அப்பம் அல்லது வட்டமான அடை போன்ற உணவுப் பொருளைக் குறிக்கலாம். பொதுவான ‘அப்பம்’ என்பதிலிருந்தும் பின்னர் வரும் மெல்லிய வகையிலிருந்தும் வேறுபடுத்த ‘அடைகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
