base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: ta
  text: காளையின் இரத்தத்தில் சிறிதை எடுத்து, உன் விரலால் பலிபீடத்தின் கொம்புகள்மேல் பூச வேண்டும்; இரத்தம் முழுவதையும் பலிபீடத்தின் அடிப்பகுதியில் ஊற்றிவிட வேண்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பலிபீடத்தின் ‘கொம்புகள்’ என்பது அதன் மூலைகளில் மேல்நோக்கி நீண்டிருந்த கொம்புபோன்ற பகுதிகள்.
    reason: cultural_note
  - marker: b
    text: ‘அடிப்பகுதியில்’ என்பதை ‘அடிப்பகுதியை நோக்கி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ מִדַּם הַפָּר
  choice: காளையின் இரத்தத்தில் சிறிதை எடுத்து
  rationale: 'מִן இங்கு பகுதியைக் குறிக்கிறது: இரத்தத்தின் ஒரு பகுதி கொம்புகளில் பூசுவதற்காக எடுக்கப்படுகிறது. தொடர்ச்சியான சடங்கு அறிவுறுத்தலை இயல்பான தமிழில் கட்டளைப் பொருளுடன் தருகிறது.'
- source_word: וְנָתַתָּה
  choice: பூச வேண்டும்
  rationale: נתן அடிப்படையில் ‘வை/கொடு’ என்றாலும், இரத்தத்தை விரலால் பலிபீடக் கொம்புகள்மேல் இடும் இச்சூழலில் ‘பூசு’ என்பது செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் கொம்புகள்மேல்
  rationale: கொம்புபோன்ற பீட நீட்சிகளைக் குறிக்கும் קַרְנוֹת என்ற உறுதியான சடங்கியல் சொல்லை பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: בְּאֶצְבָּעֶךָ
  choice: உன் விரலால்
  rationale: בְּ இங்கு கருவிப் பொருளுடையது; செயல் எவ்வாறு செய்யப்பட வேண்டும் என்பதை நேரடியாகக் காட்டுகிறது.
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: மீதமுள்ள இரத்தம் முழுவதையும் ... ஊற்ற வேண்டும்
  rationale: முன்னர் இரத்தத்தில் சிறிது எடுக்கப்பட்டதால், כָּל הַדָּם என்பது நடைமுறையில் எஞ்சியுள்ள இரத்தம் முழுவதையும் குறிக்கிறது. ‘ஊற்று’ என்பது שׁפך என்பதன் நோக்கமுள்ள சடங்குச் செயலை இயல்பாகத் தருகிறது.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அடிப்பகுதியில்
  rationale: יְסוֹד என்பதற்கு இங்கு பலிபீடத்தின் கீழ்ப்பகுதி/அடிப்பகுதி என்ற பொருள்; אֶל குறிக்கும் இலக்கைத் தமிழில் இடவியல் இயல்புடன் தருகிறது.
theological_decisions:
- issue: பலிபீடத்தின் சடங்கியல் அமைப்புச் சொற்களின் துல்லியம்
  choice: ‘கொம்புகள்’ மற்றும் ‘அடிப்பகுதி’ என்ற உறுதியான சொற்களைத் தக்கவைத்தல்
  alternative: ‘மூலைகள்’ மற்றும் ‘அடியில்’ என்று பொதுமைப்படுத்துதல்
  rationale: வசனம் அபிஷேகச் சடங்கின் குறிப்பிட்ட நடைமுறையை விவரிக்கிறது. பலிபீடத்தின் உடற்கூறுகளைத் தக்கவைப்பது பின்னாளைய கோட்பாட்டு விளக்கங்களைச் சேர்க்காமல் உரையின் சடங்கியல் மற்றும் இறையியல் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையானதும் சாதாரண வாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. எபிரெயச் சடங்கியல் வரிசையும் பலிபீடத்தின் குறிப்பிட்ட உடற்கூறுகளும் பாதுகாக்கப்பட்டுள்ளன.
