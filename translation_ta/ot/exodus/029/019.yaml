translation:
  language: ta
  text: பின்பு நீ இரண்டாம் செம்மறியாட்டுக் கடாவை எடுக்க வேண்டும். ஆரோனும் அவன் மகன்களும் அந்தக் கடாவின் தலையின்மேல் தங்கள் கைகளை வைக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: பின்பு நீ ... கொண்டுவர வேண்டும்
  rationale: அறிவுறுத்தல்களின் தொடரில் வரும் இணைப்புடன் கூடிய வினைச்சொல் அடுத்த கட்டளையைக் குறிக்கிறது. தமிழ் நடைமுறைக்கு இயல்பாக ‘பின்பு’ தொடர்ச்சியையும், ‘வேண்டும்’ கட்டளைத் தன்மையையும் வெளிப்படுத்துகின்றன. பலியிட வேண்டிய விலங்கைச் சடங்கு நடைபெறும் இடத்திற்குக் கொண்டுவருவது சூழலுக்கு ஏற்ற இயல்பான பொருள்.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: இரண்டாம் செம்மறியாட்டுக் கடா
  rationale: אַיִל என்பது ஆண் செம்மறியாட்டைக் குறிக்கிறது; הַשֵּׁנִי என்பது ‘வேறொரு’ என்பதைக் காட்டிலும் வரிசை எண்ணான ‘இரண்டாம்’ என்பதைத் தெளிவாகக் குறிக்கிறது.
- source_word: וְסָמַךְ
  choice: வைக்க வேண்டும்
  rationale: பலிச்சடங்குச் சூழலில் סמך என்பது விலங்கின்மேல் கைகளை வைக்கும் செயலைக் குறிக்கிறது. ‘வைக்க’ என்பது தமிழில் தெளிவான, இயல்பான சொல்; மூலத்தில் கூறப்படாத அடையாளப் பொருளைச் சேர்ப்பதில்லை.
- source_word: אַהֲרֹן וּבָנָיו
  choice: ஆரோனும் அவன் மகன்களும்
  rationale: בָּנִים இங்கு ஆசாரியப் பணிக்காக அர்ப்பணிக்கப்படும் ஆரோனின் ஆண் பிள்ளைகளைக் குறிக்கிறது; ஆகவே ‘மகன்கள்’ சூழலுக்குத் துல்லியமானது.
- source_word: אֶת יְדֵיהֶם
  choice: தங்கள் கைகளை
  rationale: எபிரெய மூலத்தில் ‘கைகள்’ பன்மையில் உள்ளது. பலர் தங்களுடைய கைகளை வைப்பதைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘தங்கள் கைகளை’ பயன்படுத்தப்பட்டது.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: அந்தக் கடாவின் தலையின்மேல்
  rationale: ஒரே கடாவின் ஒருமைத் தலையின்மேல் கைகள் வைக்கப்படுவதை நேரடியாகப் பிரதிபலிக்கிறது. முன்பே குறிப்பிடப்பட்ட கடாவைச் சுட்ட ‘அந்தக்’ இயல்பான தமிழ் தொடுப்பை அளிக்கிறது.
theological_decisions:
- issue: கைகளை வைக்கும் சடங்கிற்கு மூலவசனம் கூறாத இறையியல் விளக்கத்தைச் சேர்க்காமல் மொழிபெயர்த்தல்
  choice: அந்தக் கடாவின் தலையின்மேல் தங்கள் கைகளை வைக்க வேண்டும்
  alternative: அந்தக் கடாவின் தலையின்மேல் தங்கள் கைகளை அழுத்தி வைக்க வேண்டும்
  rationale: வசனம் சடங்குச் செயலை மட்டும் விவரிக்கிறது; அதன் அடையாளப் பொருளை விளக்கவில்லை. எனவே குற்றம் மாற்றப்படுதல், ஒன்றிப்படுதல், அல்லது அர்ப்பணிப்பு போன்ற விளக்கங்களைச் சேர்க்காமல் செயல் மட்டும் மொழிபெயர்க்கப்பட்டது. סמך என்பதில் சாய்தல் அல்லது அழுத்துதல் என்ற நிழற்பொருள் இருக்கக்கூடும்; ஆனால் அது இங்கு எவ்வளவு வலிமையாக நோக்கப்பட்டுள்ளது என்பது தெளிவில்லாததால் ‘வைக்க’ என இயல்பாகக் கொடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டது. ‘செம்மறியாட்டுக் கடா’ பாலினத்தையும் விலங்கு வகையையும் துல்லியமாகத் தெரிவிக்கிறது. தேவையற்ற சடங்கு அல்லது கோட்பாட்டு விளக்கங்கள் சேர்க்கப்படவில்லை.
