base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: ta
  text: பாவநிவிர்த்தி செய்யப் பயன்படுத்தப்பட்ட அந்தப் பொருட்களை அவர்கள் உண்ண வேண்டும்; அவை அவர்களை ஆசாரியப் பணியில் நியமிக்கவும் பரிசுத்தப்படுத்தவும் பயன்படுகின்றன. ஆனால், ஆசாரியர் அல்லாதவர் அவற்றை உண்ணக்கூடாது; ஏனெனில் அவை பரிசுத்தமானவை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: அவற்றை அவர்கள் சாப்பிட வேண்டும்
  rationale: சடங்குமுறை அறிவுறுத்தலாக வரும் எபிரெய வினையின் கட்டளைத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; சுட்டுப்பெயர் முந்தைய வசனத்தில் கூறப்பட்ட பலிப் பொருட்களைக் குறிக்கிறது.
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: எவற்றின் மூலம் பாவநிவிர்த்தி செய்யப்பட்டது
  rationale: בָּהֶם என்பது அந்தப் பொருட்களைப் பாவநிவிர்த்திக்கான கருவி அல்லது வழிமுறையாகக் காட்டுகிறது. எபிரெயச் செயலப்பாட்டு வடிவத்தின் குறிப்பிடப்படாத செய்பவரையும், வெளிப்படையாகச் சொல்லப்படாத பயனாளியையும் தமிழிலும் தீர்மானிக்காமல் வைக்கிறது.
- source_word: לְמַלֵּא אֶת יָדָם
  choice: அவர்களைப் பணியில் அமர்த்துவதற்கு
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அவர்களுடைய கையை நிரப்புதல்’; இச்சூழலில் இது ஆசாரியப் பணியில் முறைப்படி நிறுவுவதைக் குறிக்கும் தொழில்நுட்ப மரபுத்தொடர். பிரதான உரை அதன் செயல்பாட்டு பொருளைத் தருகிறது.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: அவர்களைப் பரிசுத்தப்படுத்துவதற்கு
  rationale: קדשׁ இங்கு இறைப்பணிக்காகப் பிரித்துவைக்கும் சடங்குச் செயலைக் குறிக்கிறது; ‘பரிசுத்தப்படுத்துதல்’ வேதாகமச் செறிவையும் தமிழின் வழக்கமான சமயப் பதிவையும் காக்கிறது.
- source_word: וְזָר
  choice: ஆனால், அந்தப் பணிக்கு உரியவரல்லாதவர்
  rationale: זָר இங்கு இன அடிப்படையிலான அந்நியரை அல்ல, இந்த ஆசாரியச் சடங்கில் பங்கேற்க அதிகாரம் அல்லது தகுதி இல்லாதவரைக் குறிக்கிறது.
- source_word: לֹא יֹאכַל
  choice: சாப்பிடக் கூடாது
  rationale: நேரடியான சட்டத் தடையை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது; தமிழில் தேவைப்படும் பொருளாக ‘அவற்றை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: כִּי קֹדֶשׁ הֵם
  choice: ஏனெனில் அவை பரிசுத்தமானவை
  rationale: தடைக்கான காரணத்தைத் தரும் כִּי என்பதையும், பலிப் பொருட்களின் இறைவனுக்குரிய பரிசுத்த நிலையையும் நேராக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பலிச் சூழலில் כפר என்பதன் பொருள்
  choice: பாவநிவிர்த்தி செய்யப்பட்டது
  alternative: பாவப்பரிகாரம் செய்யப்பட்டது
  rationale: ‘பாவநிவிர்த்தி’ என்பது பலிச் சடங்கின் இறையியல் நிறையைத் தக்கவைத்துக்கொண்டு பொதுவாசகருக்கும் புரியக்கூடிய சொல். எபிரெயத்தில் இவ்விடத்தில் யாருக்காகப் பாவநிவிர்த்தி செய்யப்பட்டது என்பது வெளிப்படையாகக் குறிப்பிடப்படாததால், பிரதான உரை அதைச் சேர்க்கவில்லை.
- issue: מִלֵּא יָד என்ற ஆசாரிய மரபுத்தொடர்
  choice: பணியில் அமர்த்துதல்
  alternative: கையை நிரப்புதல்
  rationale: இது சொற்பொருளில் கையை நிரப்புவதை அல்ல, ஆசாரியப் பணியில் நிறுவுவதைச் சுட்டுகிறது. ‘பணியில் அமர்த்துதல்’ பிற்காலச் சமயப் பிரிவுகளுக்குரிய பதவியமைப்பை இறக்குமதி செய்யாமல் சடங்கின் பொருளைத் தெரிவிக்கிறது.
- issue: זָר என்பவரின் அடையாளம்
  choice: அந்தப் பணிக்கு உரியவரல்லாதவர்
  alternative: அந்நியர்
  rationale: இந்தச் சட்டச் சூழலில் விலக்கு இனத்தையோ நாட்டையோ அடிப்படையாகக் கொண்டது என்று பொருள்படாமல், அங்கீகரிக்கப்பட்ட ஆசாரிய வட்டத்துக்கு வெளியே இருப்பதைக் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified சட்ட-சடங்கு நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாப்பிட வேண்டும்/கூடாது’ என்பவை பொதுவாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளன; ‘பாவநிவிர்த்தி,’ ‘பரிசுத்தப்படுத்துதல்’ ஆகியவை உரையின் சமயச் செறிவைத் தக்கவைக்கின்றன. எபிரெயத்தில் வெளிப்படையாக இல்லாத பாவநிவிர்த்தியின் பயனாளி பிரதான உரையில் சேர்க்கப்படவில்லை.
