base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/017.yaml
  text: Then cut the ram into its pieces[a], wash its entrails and its legs[b], and put them on its pieces and on its head.
translation:
  language: ta
  text: பின்பு அந்தச் செம்மறியாட்டுக்கடாவைத் துண்டுகளாக வெட்டு. அதன் உள்ளுறுப்புகளையும்[a] கால்களையும் கழுவி, அவற்றை அதன் துண்டுகளின் மீதும் அதன் தலையின் மீதும் வை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அதன் உட்பகுதியையும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் விலங்கின் உள்ளே இருப்பவற்றைப் பொதுவாகக் குறிக்கலாம்; இந்தப் பலிச் சூழலில் ‘உள்ளுறுப்புகள்’ என்பது பொருத்தமான குறிப்பான பொருள்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘அவற்றை அதன் துண்டுகளின் மீதும் அதன் தலையின் மீதும் வை.’ பலிக்காகக் கழுவப்பட்ட பகுதிகளை வெட்டப்பட்ட துண்டுகளுடனும் தலையுடனும் சேர்த்து அடுக்கிவைப்பதே கருத்தாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: அந்த ஆட்டுக்கடா
  rationale: பலிக்கான சூழலில் אַיִל என்பது முதிர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் ‘ஆட்டுக்கடா’ என வழங்கப்பட்டது.
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: துண்டுகளாக வெட்டு
  rationale: பலி செலுத்துவதற்காக விலங்கை அதன் தனித்தனி பகுதிகளாக வெட்டும் செயலை எளிய நடைமுறை மொழியில் வெளிப்படுத்துகிறது.
- source_word: קִרְבּוֹ
  choice: அதன் உள்ளுறுப்புகள்
  rationale: קֶרֶב பொதுவாக உட்பகுதியைக் குறிக்கலாம்; இப்பலிச் சூழலில் கழுவப்படும் உள் உறுப்புகள் என்ற குறிப்பான பொருள் பொருந்துகிறது. சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כְרָעָיו
  choice: கால்களின் கீழ்ப்பகுதிகள்
  rationale: இந்தச் சொல் விலங்கின் கால்களை, குறிப்பாக அவற்றின் கீழ்ப்பகுதிகளைச் சுட்டுகிறது; ‘கால்கள்’ என்பதைவிட இது உடற்கூற்றுப் பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: וְנָתַתָּ עַל
  choice: அவற்றை ... மேல் வை
  rationale: עַל என்பதன் இயல்பான இடவியல் பொருளான ‘மேல்’ பாதுகாக்கப்பட்டது; பலிக்கான பகுதிகளை ஒன்றாக அடுக்கிவைப்பது என்ற சூழல்சார் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: רֹאשׁוֹ
  choice: அதன் தலை
  rationale: எபிரெயச் சொல்லின் நேரடியான, இயல்பான உடற்கூற்றுப் பொருள்.
- source_word: וְ
  choice: பின்பு / -உம் / -இ
  rationale: தொடர்ச்சியான சடங்கு நடைமுறையைத் தமிழில் இயல்பாகக் காட்ட முதல் இணைப்பு ‘பின்பு’ என்றும், அடுத்தவை தமிழ் வாக்கிய இணைப்புகளாலும் வழங்கப்பட்டன.
