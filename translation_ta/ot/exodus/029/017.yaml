revisions:
- from: பின்பு அந்த ஆட்டுக்கடாவைத் துண்டுகளாக வெட்டு. அதன் உள்ளுறுப்புகளையும்[a] கால்களின் கீழ்ப்பகுதிகளையும் கழுவி, அவற்றை அதன் துண்டுகளின்மேலும் அதன் தலையின்மேலும் வை.[b]
  to: பின்பு அந்தச் செம்மறியாட்டுக்கடாவைத் துண்டுகளாக வெட்டு. அதன் உள்ளுறுப்புகளையும்[a] கால்களையும் கழுவி, அவற்றை அதன் துண்டுகளின் மீதும் அதன் தலையின் மீதும் வை.[b]
  rationale: The revision corrects the animal identification from a potentially goat-specific term to ‘ram,’ avoids over-translating ‘legs’ as lower legs, and makes minor idiomatic and grammatical improvements. It retains the Hebrew sequence and the spatial wording ‘on/upon,’ while preserving the contextual arrangement possibility only in the footnote.
