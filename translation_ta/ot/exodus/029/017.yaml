translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய இணைப்புத் தொடரை வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரித்துள்ளோம்; சடங்கு நடவடிக்கைகளின் வரிசை மாற்றப்படவில்லை.
