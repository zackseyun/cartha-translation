revisions:
- from: பின்பு, அவற்றை அவர்களுடைய கைகளிலிருந்து எடுத்து, பலிபீடத்திலுள்ள தகனபலியின்மீது வைத்து எரித்துப் புகையெழச் செய்வாய். அது யாவேயின் முன்னிலையில் அவருக்கு உகந்த நறுமணமாக இருக்கும். அது யாவேக்குச் செலுத்தப்படும் நெருப்புக் காணிக்கை[a].
  to: பின்பு, அவற்றை அவர்களுடைய கைகளிலிருந்து எடுத்து, பலிபீடத்தில் தகனபலியின் மேல் வைத்து, யாவேயின் முன்னிலையில் உகந்த நறுமணமாக எரித்துப் புகையெழச் செய்வாய். அது யாவேக்கான நெருப்புக் காணிக்கை[a].
