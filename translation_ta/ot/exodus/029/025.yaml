source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ אֹתָ/ם֙ מִ/יָּדָ֔/ם וְ/הִקְטַרְתָּ֥ הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה לְ/רֵ֤יחַ נִיח֨וֹחַ֙ לִ/פְנֵ֣י יְהוָ֔ה אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: ta
  text: பின்பு, அவற்றை அவர்களுடைய கைகளிலிருந்து எடுத்து, பலிபீடத்தில் தகனபலியின் மேல் வைத்து, யாவேயின் முன்னிலையில் உகந்த நறுமணமாக எரித்துப் புகையெழச் செய்வாய். அது யாவேக்கான நெருப்புக் காணிக்கை[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்காக நெருப்பினால் செலுத்தப்படும் காணிக்கை.”
    reason: אִשֶּׁה என்ற எபிரெய பலிச்சொல்லை ‘நெருப்புக் காணிக்கை’ என்றும், செய்முறையை வெளிப்படுத்தி ‘நெருப்பினால் செலுத்தப்படும் காணிக்கை’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: பின்பு ... எடுத்து
  rationale: இணைப்புடன் வரும் Qal வினைமுற்று, இந்தச் சடங்கு வழிமுறைகளின் தொடரில் அடுத்த கட்டளையைக் குறிக்கிறது; ‘பின்பு’ செயல்வரிசையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹתָם מִיָּדָם
  choice: அவற்றை அவர்களுடைய கைகளிலிருந்து
  rationale: முந்தைய வசனத்தில் ஆசாரியர்களின் கைகளில் வைக்கப்பட்ட பொருள்களையே பன்மைச் சுட்டுப்பெயர் குறிக்கிறது; கைமாற்றும் சடங்கு நடவடிக்கை நேரடியாகப் பாதுகாக்கப்படுகிறது.
- source_word: וְהִקְטַרְתָּ
  choice: எரித்துப் புகையெழச் செய்வாய்
  rationale: கட்டளைக் தொடரில் வரும் Hiphil வடிவம், பலியினை வெறுமனே எரிப்பதைவிட பலிபீடத்தில் புகையாக எழச் செய்வதைக் குறிக்கிறது; இரு கூறுகளும் சடங்கின் பொருளைத் தெளிவாக்குகின்றன.
- source_word: הַמִּזְבֵּחָה עַל הָעֹלָה
  choice: பலிபீடத்திலுள்ள தகனபலியின்மீது வைத்து
  rationale: திசையைக் குறிக்கும் வடிவமும் עַל என்பதும், பலிபீடத்தில் ஏற்கெனவே உள்ள தகனபலியின் மேல் இப்பொருள்கள் வைக்கப்படுவதைச் சுட்டுகின்றன.
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: அவருக்கு உகந்த நறுமணமாக
  rationale: இது பலி ஏற்றுக்கொள்ளப்படுவதையும் மகிழ்வளிப்பதையும் குறிக்கும் நிலையான ஆசாரிய மொழிநடை; வெறும் இனிய வாசனை என்ற உடல் உணர்வுக்கு மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் இடம் மற்றும் உறவு சார்ந்த ‘முன்னிலையில்’ என்ற பொருளைப் பாதுகாக்கிறது; יהוה உடன்படிக்கைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: אִשֶּׁה
  choice: நெருப்புக் காணிக்கை
  rationale: ஆசாரிய பலிமொழியில் நெருப்போடு தொடர்புடைய யாவேக்கான காணிக்கையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது; சொல்லின் துல்லியமான உருவாக்கம் விவாதத்திற்குரியது என்பதால் மாற்று விரிவாக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הוּא לַיהוָה
  choice: அது யாவேக்குச் செலுத்தப்படும்
  rationale: வெளிப்படையான சுட்டுப்பெயரையும், காணிக்கை யாவேக்கு உரியது அல்லது அவரை நோக்கிச் செலுத்தப்பட்டது என்பதைக் குறிக்கும் לְ முன்னொட்டையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: אִשֶּׁה என்ற பலிச்சொல்லின் பொருள்
  choice: நெருப்புக் காணிக்கை
  alternative: நெருப்பில் செலுத்தப்படும் காணிக்கை
  rationale: நெருப்பின் வழியாகப் படைக்கப்படும் பலி என்ற பாரம்பரியப் பொருளைத் தக்கவைக்கிறது; ‘உணவுக் காணிக்கை’ எனக் குறிப்பிட்டு மூலத்தில் வெளிப்படையாக இல்லாத ஒரே விளக்கத்தைத் தீர்மானமாக்கவில்லை.
- issue: רֵיחַ נִיחוֹחַ என்ற பலி உருவகம்
  choice: அவருக்கு உகந்த நறுமணம்
  alternative: இதமளிக்கும் நறுமணம்
  rationale: வாசனை உருவகத்தையும் பலி யாவேக்கு ஏற்புடையது என்ற உறவுப் பொருளையும் ஒன்றாகத் தக்கவைக்கிறது; இதை வெறும் உடல் உணர்வாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான சடங்கு வழிமுறை நடையைப் பயன்படுத்துகிறது. ‘தகனபலி’, ‘பலிபீடம்’, ‘காணிக்கை’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; மிகப் பழமையான வினைமுற்றுகளும் சமயப் பிரிவு சார்ந்த தனிச்சொற்களும் தவிர்க்கப்பட்டுள்ளன.
