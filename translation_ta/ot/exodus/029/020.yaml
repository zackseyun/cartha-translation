translation_notes:
  register: நவீன நிலையான தமிழில், சடங்கு வழிமுறைக்குரிய கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நீண்ட ஒருங்கிணைப்பை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம். “மீதமுள்ள” என்பது மூலத்தில் வெளிப்படையாக இல்லை என்பதால், இரத்தத்தின் முன் எடுத்த சிறு பகுதியுடன் அடுத்த செயலை இயல்பாக இணைக்க உதவும் சூழல்சார் தெளிவாக்கமாகப் பயன்படுத்தப்பட்டுள்ளது.
