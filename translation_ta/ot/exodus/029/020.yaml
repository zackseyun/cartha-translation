  text: וְ/שָׁחַטְתָּ֣ אֶת הָ/אַ֗יִל וְ/לָקַחְתָּ֤ מִ/דָּמ/וֹ֙ וְ/נָֽתַתָּ֡ה עַל תְּנוּךְ֩ אֹ֨זֶן אַהֲרֹ֜ן וְ/עַל תְּנ֨וּךְ אֹ֤זֶן בָּנָי/ו֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָדָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְלָ֖/ם הַ/יְמָנִ֑ית וְ/זָרַקְתָּ֧ אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: ta
  text: பின்பு அந்த ஆட்டுக்கடாவை அறுத்து, அதன் இரத்தத்தில் சிறிதை எடுத்து, ஆரோனுடைய வலது காதின் மடலிலும்[a], அவனுடைய மகன்களின் வலது காதுகளின் மடல்களிலும், அவர்களுடைய வலது கைகளின் கட்டைவிரல்களிலும், அவர்களுடைய வலது கால்களின் பெருவிரல்களிலும் பூச வேண்டும். இரத்தத்தைப் பலிபீடத்தின் எல்லாப் பக்கங்களிலும் வீச வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரோனுடைய வலது காதின் நுனியிலும் ... அவனுடைய மகன்களின் வலது காதுகளின் நுனிகளிலும்.” எபிரெயச் சொல் காதின் வெளிப்புற முனைப்பகுதியைப் பொதுவாகக் குறிக்கக்கூடும்; இச்சடங்குச் சூழலில் “மடல்” என்பதே பெரும்பாலும் பொருத்தமானது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இரத்தத்தைப் பலிபீடத்தின் எல்லாப் பக்கங்களிலும் வீசி இரத்தத்தைச் செலுத்த வேண்டும்.” எபிரெய வினைச்சொல் மெதுவாகத் தெளிப்பதைவிட, இரத்தத்தை வலுவாகச் சடங்குமுறையில் செலுத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: அறு
  rationale: பலியிடும் விலங்கைக் கொல்லும் செயலைத் துல்லியமாகக் குறிக்கும் இயல்பான தமிழ் வினை; பொதுவான “கொல்” என்பதைவிடச் சடங்குச் சூழலுக்கு ஏற்றது.
- source_word: אַיִל
  choice: ஆட்டுக்கடா
  rationale: பலிக்காகக் குறிப்பிடப்பட்டுள்ள வளர்ந்த ஆண் செம்மறியாட்டைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: מִדָּמוֹ
  choice: அதன் இரத்தத்தில் சிறிதை
  rationale: מִן இங்கு இரத்தத்தின் ஒரு பகுதியை எடுப்பதைக் குறிக்கிறது; தமிழில் பகுதியளவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְּנוּךְ אֹזֶן
  choice: காதின் மடல்
  rationale: ஆசாரியச் சடங்குச் சூழலில் காதின் வெளிப்புற முனைப்பகுதியைக் குறிக்கிறது. “மடல்” பிரதான உரையில் இயல்பாகவும் குறிப்பாகவும் உள்ளது; “நுனி” அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַיְמָנִית
  choice: வலது
  rationale: காது, கை, கால் ஆகியவற்றின் வலப்பக்க உறுப்பை இயல்பான தமிழில் அடைமொழியாகக் குறிக்கிறது.
- source_word: בֹּהֶן יָד
  choice: கையின் கட்டைவிரல்
  rationale: கையில் בֹּהֶן என்பது கட்டைவிரலைத் துல்லியமாகக் குறிக்கிறது.
- source_word: בֹּהֶן רֶגֶל
  choice: காலின் பெருவிரல்
  rationale: காலில் בֹּהֶן என்பது பெரிய விரலைக் குறிக்கிறது; “பெருவிரல்” நவீனத் தமிழில் தெளிவான உடற்கூற்றுச் சொல்.
- source_word: זָרַק
  choice: வீசு
  rationale: பலிபீடத்தின் மீது இரத்தத்தை வலுவாகச் செலுத்தும் சடங்குச் செயலைக் காட்டுகிறது; மென்மையான “தெளி” என்ற பொருளுக்கு மட்டும் சுருக்கவில்லை.
- source_word: סָבִיב
  choice: எல்லாப் பக்கங்களிலும்
  rationale: பலிபீடத்தைச் சுற்றியுள்ள பக்கங்கள் முழுவதிலும் இரத்தம் செலுத்தப்படுவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְ
  choice: பின்பு / மற்றும் வாக்கியத் தொடர்ச்சி
  rationale: தொடர்ச்சியான சடங்கு நடவடிக்கைகளை நவீனத் தமிழில் தெளிவாக முன்னெடுக்கிறது; தேவையற்ற பல “மற்றும்” இணைப்புகள் தவிர்க்கப்பட்டுள்ளன.
