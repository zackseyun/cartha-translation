base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: ta
  text: ஆரோனுக்குரிய பரிசுத்த ஆடைகள், அவருக்குப் பிறகு அவருடைய மகன்களுக்குரியவையாக இருக்கும்; அவர்கள் அவற்றை அணிந்து அபிஷேகம் பெறவும் ஆசாரியப் பணியில் நிறுவப்படவும் அவை இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களுடைய கைகளை நிரப்புதல்” என்பது ஒருவரை ஆசாரியப் பணியில் முறைப்படி நிறுவுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: பரிசுத்த ஆடைகள்
  rationale: בגד என்பது ஆடை; הַקֹּדֶשׁ இங்கு ஆசாரியப் பயன்பாட்டிற்காகத் தனியே ஒதுக்கப்பட்ட பரிசுத்தத் தன்மையைக் குறிக்கிறது. ‘பரிசுத்த ஆடைகள்’ என்பது இயல்பானதும் மூலத்தின் சமயச் சிறப்பைத் தக்கவைப்பதுமான தமிழ்.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: ஆரோனுக்குரிய
  rationale: לְ இங்கு உடைமை அல்லது ஒதுக்கீட்டைக் குறிக்கிறது. ‘ஆரோனுக்குரிய’ என்பது இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: அவருக்குப் பிறகு அவருடைய மகன்களுக்குரியவையாக இருக்கும்
  rationale: இந்தச் சொற்றொடர் ஆரோனுக்குப் பிந்தைய ஆசாரிய வாரிசுரிமையைக் குறிக்கிறது. ‘அவருக்குப் பிறகு’ காலத்தையும் தொடர்ச்சியையும் வெளிப்படுத்துகிறது; ‘மகன்களுக்குரியவையாக’ לְ உடைய உடைமை/ஒதுக்கீட்டு வலிமையைப் பேணுகிறது.
- source_word: לְמָשְׁחָה בָהֶם
  choice: அந்த ஆடைகளை அணிந்தபடி அவர்கள் அபிஷேகம் செய்யப்படுவதற்கு
  rationale: בָהֶם என்பது ஆடைகளை அபிஷேகத்தின் கருவியாக அல்ல, அவற்றை அணிந்திருக்கும் சூழ்நிலையாகக் காட்டுகிறது. ‘அணிந்தபடி’ இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: அவர்களுடைய கை நிரப்பப்படுவதற்கு
  rationale: מלא יד என்ற எபிரெயச் சடங்கு மரபுத்தொடரின் உருவகத்தை முதன்மை உரையில் தக்கவைக்கிறது. தமிழில் இது தனியே தெளிவாக இல்லாததால், ஆசாரியப் பணியில் நிறுவுதல் என்ற பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: מלא יד என்ற ஆசாரிய நியமன மரபுத்தொடரை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘அவர்களுடைய கை நிரப்பப்படுதல்’ என்ற மூல உருவகத்தைத் தக்கவைத்தல்
  alternative: அவர்களை ஆசாரியப் பணியில் நிறுவுதல் / அவர்களைத் திருநிலைப்படுத்துதல்
  rationale: இது ஆசாரியப் பதவியில் நிறுவுவதைக் குறிக்கும் தொழில்நுட்பமான வழிபாட்டுச் சொற்றொடர். நேரடியாக ‘நியமித்தல்’ என்று மட்டும் மொழிபெயர்த்தால் மூல உருவகம் மறையும்; ‘திருநிலைப்படுத்துதல்’ என்று மொழிபெயர்த்தால் அருகிலுள்ள அபிஷேகக் கருத்துடன் கலந்துவிடலாம். ஆகவே உருவகம் உரையிலும், அதன் செயல்பாட்டு பொருள் அடிக்குறிப்பிலும் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அபிஷேகம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது. மூலத்தின் ஆசாரியச் சடங்கு உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
