revisions:
- from: ஆரோனுக்குரிய பரிசுத்த ஆடைகள், அவருக்குப் பிறகு அவருடைய மகன்களுக்குரியவையாக இருக்கும். அந்த ஆடைகளை அணிந்தபடி அவர்கள் அபிஷேகம் செய்யப்படுவதற்கும், அவர்களுடைய கை நிரப்பப்படுவதற்கும்[a] அவை பயன்படும்.
  to: ஆரோனுக்குரிய பரிசுத்த ஆடைகள், அவருக்குப் பிறகு அவருடைய மகன்களுக்குரியவையாக இருக்கும்; அவர்கள் அவற்றை அணிந்து அபிஷேகம் பெறவும் ஆசாரியப் பணியில் நிறுவப்படவும் அவை இருக்கும்.[a]
  rationale: 'The revision replaces the opaque literal calque of the Hebrew priestly-installation idiom with natural Tamil (‘ஆசாரியப் பணியில் நிறுவப்பட’). The note retains the Hebrew imagery, ‘filling their hands,’ for transparency. ‘அவற்றை அணிந்து’ preserves the contextual force of בָהֶם: the sons are anointed and installed while wearing the holy garments.'
