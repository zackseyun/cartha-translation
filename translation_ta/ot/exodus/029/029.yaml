review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the holy garments, Aaron's succession through his sons, and the sense that anointing and priestly installation occur while the garments are worn. However, ‘அவர்களுடைய கை நிரப்பப்படுவதற்கும்’ is an unnaturally passive Tamil calque of the Hebrew idiom מלא את־יד.
  naturalness: ‘அவர்களுடைய கை நிரப்பப்படுவதற்கும்’ is not idiomatic modern standard Tamil and is likely opaque even with the note. Rendering the idiom functionally in the text, while preserving its literal form in the footnote, is clearer and remains faithful.
  terminology: ‘பரிசுத்த ஆடைகள்’ and ‘அபிஷேகம்’ are appropriate established biblical Tamil terms. ‘ஆசாரியப் பணியில் நிறுவப்பட’ accurately conveys priestly installation without importing a later ecclesiastical sense.
  issues:
  - severity: medium
    issue: 'The Hebrew ordination idiom is translated as a passive literalism: ‘அவர்களுடைய கை நிரப்பப்படுவதற்கும்.’'
    rationale: 'Although the footnote explains it, this construction is not natural Tamil and obscures the clause’s actual function: installation into priestly service. A functional rendering in the main text with a literal explanatory note best serves both clarity and auditability.'
  revised_text: ஆரோனுக்குரிய பரிசுத்த ஆடைகள், அவருக்குப் பிறகு அவருடைய மகன்களுக்குரியவையாக இருக்கும்; அவர்கள் அவற்றை அணிந்து அபிஷேகம் பெறவும் ஆசாரியப் பணியில் நிறுவப்படவும் அவை இருக்கும்.[a]
