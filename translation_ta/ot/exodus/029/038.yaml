base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/038.yaml
  text: 'This is what you shall offer on the altar: two one-year-old lambs each day continually[a][b][c].'
translation:
  language: ta
  text: 'பலிபீடத்தின்மேல் நீ செலுத்த வேண்டியது இதுவே: ஒரு வயதான செம்மறியாட்டுக் குட்டிகள் இரண்டை நாள்தோறும் நிரந்தரமாகப் பலியிடு[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலிபீடத்தின்மேல் நீ செய்ய வேண்டியது.” எபிரெய வினைச்சொல் பொதுவாக “செய்/உண்டாக்கு” என்று பொருள்படும்; இங்கே அது பலி செலுத்தும் செயலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஒரு வயதின் மகன்களான செம்மறியாட்டுக் குட்டிகள்”; அதாவது, ஒரு வயதான குட்டிகள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஒவ்வொரு நாளும், தொடர்ந்து.” இச்சொற்றொடர் நாள்தோறும் ஒழுங்காகத் தொடரும் பலியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה אֲשֶׁר
  choice: செலுத்த வேண்டியது இதுவே
  rationale: அடுத்த கட்டளையை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; וְ என்பதைக் கட்டாயமாகத் தனியே மொழிபெயர்க்காமல் உரையோட்டத்தில் உள்ளடக்குகிறது.
- source_word: תַּעֲשֶׂה
  choice: செலுத்த வேண்டும்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்/உண்டாக்கு’ என்றாலும், பலிபீடமும் பலிக்குரிய ஆட்டுக்குட்டிகளும் இடம்பெறும் இச்சூழலில் ‘செலுத்து’ என்பது பலியிடும் செயலை இயல்பாகக் குறிக்கிறது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல்
  rationale: எபிரெய முன்னிடைச்சொல்லையும் பலியிடும் இடத்தையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: כְּבָשִׂים
  choice: செம்மறியாட்டுக் குட்டிகள்
  rationale: இச்சொல் இளம் செம்மறியாடுகளைக் குறிக்கிறது; தமிழில் ‘ஆட்டுக்குட்டிகள்’ மட்டும் தெளிவற்றதாக இருக்கக்கூடும் என்பதால் இனத்தை வெளிப்படுத்துகிறது.
- source_word: בְּנֵי שָׁנָה
  choice: ஓராண்டான
  rationale: ‘ஒரு ஆண்டின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் வயதுக் குறிப்பு.
- source_word: שְׁנַיִם
  choice: இரண்டு
  rationale: எண்ணிக்கையை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: לַיּוֹם
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் நிகழும் பகிர்வுப் பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: תָּמִיד
  choice: தொடர்ந்து
  rationale: ஒரே நாளுக்குள் இடைவிடாத செயலை மட்டும் அல்லாமல், ஒழுங்காக நாள்தோறும் தொடரும் பலியை இச்சூழலில் குறிக்கிறது.
