review_pass:
  verdict: revise
  source_fidelity: 'The core sense is accurately conveyed: the altar, two lambs of one year, the daily frequency, and the ongoing regularity are all present. However, the Tamil construction shifts the syntax and slightly weakens the direct force of the instruction by rendering both the introductory clause and the main imperative with obligation forms (''வேண்டியது'' / ''வேண்டும்''). A direct future/imperatival instruction better reflects תַּעֲשֶׂה.'
  naturalness: The draft is generally understandable in modern standard Tamil, but 'ஓராண்டான செம்மறியாட்டுக் குட்டிகள்' is less idiomatic than 'ஒரு வயதான செம்மறியாட்டுக் குட்டிகள்' or 'ஒரு வயதுடைய...'. Also, placing 'தொடர்ந்து' immediately before a repeated 'செலுத்த வேண்டும்' can sound like uninterrupted action rather than the regular continual daily rite intended by תמיד.
  terminology: ‘பலிபீடம்’ and ‘செம்மறியாட்டுக் குட்டிகள்’ are appropriate. ‘பலியிடு’ is slightly more direct and natural for the cultic act here than repeating ‘செலுத்து’; it also avoids any possible financial-administrative association of ‘செலுத்து.’
  issues:
  - severity: medium
    issue: The verse uses two obligation expressions and repeats the offering verb.
    rationale: ‘பலிபீடத்தின்மேல் நீ செலுத்த வேண்டியது இதுவே ... செலுத்த வேண்டும்’ is grammatically possible, but it is stylistically heavy and less directly reflects the Hebrew command, ‘this is what you shall do/offer ...’ A single direct instruction is clearer.
  - severity: low
    issue: ‘ஓராண்டான’ is awkward as an age descriptor in this context.
    rationale: ‘ஒரு வயதான’ is standard modern Tamil wording for animals one year old and preserves the Hebrew age specification.
  - severity: medium
    issue: ‘தொடர்ந்து’ may suggest uninterrupted action rather than an ongoing daily regular offering.
    rationale: In this cultic context תמיד qualifies the recurring daily practice. ‘நிரந்தரமாக’ naturally communicates established, continuing observance without implying that the act occurs without pause.
  revised_text: 'பலிபீடத்தின்மேல் நீ செலுத்த வேண்டியது இதுவே: ஒரு வயதான செம்மறியாட்டுக் குட்டிகள் இரண்டை நாள்தோறும் நிரந்தரமாகப் பலியிடு[a][b][c].'
