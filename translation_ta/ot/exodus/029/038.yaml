- from: 'பலிபீடத்தின்மேல் நீ செலுத்த வேண்டியது இதுவே: நாள்தோறும் ஓராண்டான செம்மறியாட்டுக் குட்டிகள் இரண்டைத் தொடர்ந்து செலுத்த வேண்டும்[a][b][c].'
  to: 'பலிபீடத்தின்மேல் நீ செலுத்த வேண்டியது இதுவே: ஒரு வயதான செம்மறியாட்டுக் குட்டிகள் இரண்டை நாள்தோறும் நிரந்தரமாகப் பலியிடு[a][b][c].'
