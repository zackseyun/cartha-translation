source:
  edition: WLC
  text: וַ/יַּהֲפֹ֨ךְ יְהוָ֤ה רֽוּחַ יָם֙ חָזָ֣ק מְאֹ֔ד וַ/יִּשָּׂא֙ אֶת הָ֣/אַרְבֶּ֔ה וַ/יִּתְקָעֵ֖/הוּ יָ֣מָּ/ה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּ/כֹ֖ל גְּב֥וּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: ta
  text: யாவே காற்றின் திசையை மாற்றி, மிகவும் வலிமையான கடல் காற்றை வீசச் செய்தார்[a]. அது வெட்டுக்கிளிகளைத் தூக்கிக்கொண்டு போய், நாணல் கடலுக்குள்[b] தள்ளியது. எகிப்தின் எல்லா பகுதிகளிலும் ஒரு வெட்டுக்கிளிகூட எஞ்சியிருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “கடல் காற்று”; இச்சூழலில் இது கடலிலிருந்து வரும் மேற்குக் காற்றைக் குறிக்கலாம்.
    reason: மூலத்தின் சொற்படியான படிமத்தைத் தக்கவைத்துக்கொண்டு, சூழல்சார் திசை விளக்கத்தை மாற்று வாய்ப்பாகக் குறிப்பிடுகிறது.
  - marker: b
    text: மரபுவழியாக “செங்கடல்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: பரிச்சயமான மரபுவழிப் பெயரை வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: காற்றைத் திருப்பி...வீசச் செய்தார்
  rationale: הפך என்பது ‘திருப்பு/மாற்று’ எனப் பொருள்படும். காற்றின் திசை மாறியதை இயல்பான தமிழில் தெளிவுபடுத்த இவ்வாறு வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய வேதப்பிரதியில் உள்ள இறைநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: רוּחַ יָם
  choice: மேற்குக் காற்று
  rationale: சொல்லுக்கு சொல் ‘கடல் காற்று’; எகிப்தின் நிலவியல் சூழலில் கடலிலிருந்து வரும் மேற்குக் காற்றைக் குறிக்கிறது. மூலப்படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חָזָק מְאֹד
  choice: மிக வலிமையான
  rationale: எபிரெய தீவிரப்படுத்தலை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: வெட்டுக்கிளிகளைத் தூக்கிக்கொண்டு போய்
  rationale: காற்று கூட்டத்தைத் தூக்கிச் சென்ற செயலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַיִּתְקָעֵהוּ
  choice: தள்ளியது
  rationale: תקע இங்கு காற்று வெட்டுக்கிளிக் கூட்டத்தைக் கடலுக்குள் வலுக்கட்டாயமாகச் செலுத்தியதைக் குறிக்கிறது; ஒருமை பின்னொட்டு கூட்டொருமையாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: יָמָּה סּוּף
  choice: நாணல் கடலில்
  rationale: יָם־סוּף என்பதன் மூலமொழிசார் பெயரைப் பாதுகாக்கிறது; மரபான ‘செங்கடல்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: ஒரு வெட்டுக்கிளிகூட எஞ்சியிருக்கவில்லை
  rationale: ‘ஒன்றுகூட இல்லை’ என்ற முழுமையான அழிவின் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: எகிப்தின் எல்லைப்பகுதி முழுவதிலும்
  rationale: גְּבוּל இங்கு எகிப்தின் எல்லைக்குள் அடங்கிய முழுப் பரப்பையும் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: ஆண்டவர் / யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் இருப்பதால் அதை பொதுவான பட்டப்பெயராக மாற்றவில்லை. தமிழ் வாசகர்களிடையே நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: יָם סוּף என்ற இடப்பெயரை மொழிபெயர்த்தல்
  choice: நாணல் கடல்
  alternative: செங்கடல்
  rationale: மரபுவழி அடையாளத்தை விட எபிரெயப் பெயரின் சொற்பொருளுக்கு முன்னுரிமை தரப்படுகிறது; பரிச்சயமான மரபுவழி பெயர் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதவசனத்திற்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘வெட்டுக்கிளிகூட’ என்ற வடிவம் எபிரெயத்தின் வலியுறுத்தலை இயல்பாகக் காக்கிறது.
