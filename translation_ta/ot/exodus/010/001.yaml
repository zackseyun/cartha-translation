source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: ta
  text: 'பின்பு யாவே மோசேயிடம் கூறினார்: “பார்வோனிடம் போ; ஏனெனில், என் இந்த அடையாளங்களை அவனுடைய நடுவில் வைப்பதற்காக, நான் அவனுடைய இதயத்தையும் அவன் ஊழியர்களின் இதயத்தையும் கடினப்படுத்தியிருக்கிறேன்[a].”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லடிப்படையாக, “அவனுடைய இதயத்தையும் அவன் ஊழியர்களின் இதயத்தையும் கனமாக்கியிருக்கிறேன்.” இம்மரபுத்தொடர் அவர்களுடைய இதயங்களை கடினமானவையாக அல்லது பதிலளிக்காதவையாக ஆக்கியதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் ஒருமையாக, “அவனுடைய நடுவில்.” இது பார்வோனையே குறிப்பாகக் குறிக்கலாம்; அல்லது பார்வோனையும் அவன் ஊழியர்களையும், அதாவது அரசவையையும், உள்ளடக்கிய வட்டாரத்தைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமாகிய நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதால், இயல்பான தமிழ் கதைநடையில் ‘பின்பு’ பயன்படுத்தப்பட்டது.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: பார்வோனிடம் போ
  rationale: בוא என்பது சூழலுக்கேற்ப ‘வா/போ’ என அமையும்; மோசே பார்வோனை அணுகும்படி கட்டளையிடப்படும் இச்சூழலில் ‘போ’ இயல்பானது.
- source_word: הִכְבַּדְתִּי
  choice: கடினப்படுத்தியிருக்கிறேன்
  rationale: சொல்லடிப்படையில் ‘கனமாக்கினேன்’ என்றாலும், இதயத்தைப் பற்றிய இந்த எபிரெய மரபுத்தொடர் ஒருவரைப் பதிலளிக்காதபடி கடினமாக்குவதைக் குறிக்கிறது; நேரடியான இறைச் செயற்பாட்டை மொழிபெயர்ப்பு தணிக்கவில்லை.
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: அவனுடைய இதயத்தையும் அவனுடைய ஊழியர்களின் இதயத்தையும்
  rationale: לֵב என்பது சிந்தனை, மனவுறுதி, உள்ளார்ந்த பதிலுணர்வு ஆகியவற்றின் மையத்தைக் குறிக்கலாம்; மூலத்தின் உருவகத்தையும் வேதாகம மொழிநடையையும் ‘இதயம்’ காக்கிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய ஊழியர்கள்
  rationale: பார்வோனின் அரசவையைச் சேர்ந்த பணியாளர்கள் அல்லது அதிகாரிகளை இச்சொல் குறிக்கலாம்; ‘ஊழியர்கள்’ அந்த வரம்பைத் தேவையின்றிக் குறுக்காமல் காக்கிறது.
- source_word: לְמַעַן שִׁתִי
  choice: வைப்பதற்காக
  rationale: לְמַעַן நோக்கத்தையும் שׁית ‘வைத்தல்/நிறுத்துதல்’ என்பதையும் குறிக்கின்றன; தமிழ் வாக்கியத்தில் நோக்க உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֹתֹתַי אֵלֶּה
  choice: என்னுடைய இந்த அடையாளங்களை
  rationale: உடைமைப் பின்னொட்டையும் சுட்டுப்பெயரையும் இயல்பான தமிழ்ச் சொல்வரிசையில் இரண்டையும் காக்கிறது.
- source_word: בְּקִרְבּוֹ
  choice: அவன் நடுவில்
  rationale: மசோரா உரையின் வடிவம் ஒருமையாக இருப்பதால் முதன்மை உரையில் அதைப் பாதுகாக்கிறது; பார்வோனையும் அவன் அரசவையையும் உள்ளடக்கிய பரப்பைக் குறிக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பார்வோனின் இதயத்தை இறைவன் கடினப்படுத்துதல்
  choice: நான் ... கடினப்படுத்தியிருக்கிறேன்
  alternative: நான் ... கனமாக்கியிருக்கிறேன்
  rationale: மூலம் செயலை யாவேவுக்கே நேரடியாகக் கூறுகிறது. இறை இறையாண்மைக்கும் மனிதப் பொறுப்புக்கும் இடையிலான பதற்றத்தை விளக்கித் தீர்க்காமலும் மென்மைப்படுத்தாமலும் உரை அப்படியே காக்கிறது.
- issue: בְּקִרְבּוֹ என்பதன் ஒருமைச் சுட்டு
  choice: அவன் நடுவில்
  alternative: அவர்கள் நடுவில்
  rationale: எபிரெய வடிவம் இலக்கண ரீதியாக ஒருமை; எனினும் முன் வரும் பார்வோனும் அவன் ஊழியர்களும் சேர்ந்த அரசவையைக் கருத்தில் கொண்ட பன்மை உணர்வு சாத்தியம். முதன்மை உரை ஒருமையைப் பாதுகாத்து, விரிந்த பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டது. ‘யாவே’, ‘இதயம்’, ‘அடையாளங்கள்’ ஆகிய சொற்கள் மூலத்தின் தனிப்பெயர், உருவகம், கருத்து ஆகியவற்றைக் காக்கின்றன. மூலத்தில் உள்ள ஒருமைச் சுட்டு முதன்மை உரையில் பாதுகாக்கப்பட்டு அதன் சூழல்சார் பன்மைச் சாத்தியம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
