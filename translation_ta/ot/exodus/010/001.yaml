revisions:
- from: பின்பு யாவே மோசேயிடம், “நீ பார்வோனிடம் போ. ஏனெனில், நான் அவனுடைய இதயத்தையும் அவனுடைய ஊழியர்களின் இதயத்தையும் கடினப்படுத்தியிருக்கிறேன்[a]. என்னுடைய இந்த அடையாளங்களை அவன் நடுவில்[b] வைப்பதற்காக இப்படிச் செய்தேன்” என்றார்.
  to: 'பின்பு யாவே மோசேயிடம் கூறினார்: “பார்வோனிடம் போ; ஏனெனில், என் இந்த அடையாளங்களை அவனுடைய நடுவில் வைப்பதற்காக, நான் அவனுடைய இதயத்தையும் அவன் ஊழியர்களின் இதயத்தையும் கடினப்படுத்தியிருக்கிறேன்[a].”[b]'
  rationale: மூலத்தில் இல்லாத “இப்படிச் செய்தேன்” அகற்றப்பட்டுள்ளது. நோக்கத்தைக் குறிக்கும் לְמַעַן தொடரை “வைப்பதற்காக” என நேரடியாக இணைத்துள்ளோம். בְּקִרְבּוֹ-வின் ஒருமை முதன்மை உரையில் “அவனுடைய நடுவில்” எனக் காக்கப்படுகிறது; அதன் பரந்த சூழல்சார் சாத்தியம் அடிக்குறிப்பில் மட்டும் வழங்கப்படுகிறது. அடிக்குறிப்பு குறியீடு [b] விவாதத்திற்குரிய அந்த ஒருமைத் தொடரின் பின்னர் வைக்கப்பட்டுள்ளது.
