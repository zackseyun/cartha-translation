  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה נְטֵ֨ה יָדְ/ךָ֜ עַל אֶ֤רֶץ מִצְרַ֨יִם֙ בָּֽ/אַרְבֶּ֔ה וְ/יַ֖עַל עַל אֶ֣רֶץ מִצְרָ֑יִם וְ/יֹאכַל֙ אֶת כָּל עֵ֣שֶׂב הָ/אָ֔רֶץ אֵ֛ת כָּל אֲשֶׁ֥ר הִשְׁאִ֖יר הַ/בָּרָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “வெட்டுக்கிளிகளைக் குறித்து[a] உன் கையை எகிப்து நாட்டின்மேல் நீட்டு; அவை எகிப்து நாட்டின்மேல் வரவும், ஆலங்கட்டி மழை விட்டுவைத்த நாட்டிலுள்ள எல்லாச் செடிகளையும் தின்னவும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘வெட்டுக்கிளியைக் குறித்து/வெட்டுக்கிளிக்காக’ என உள்ளது. இங்குள்ள முன்னிடைச்சொல்லின் பொருள் கடினமானது; ‘வெட்டுக்கிளிக்கு எதிராக’ அல்லது ‘வெட்டுக்கிளியின்மேல்’ என்றும் இன்னும் சொற்சார்பாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: נְטֵה יָדְךָ
  choice: உன் கையை நீட்டு
  rationale: கட்டளை வடிவத்தையும் கை நீட்டும் செயலையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டின்மேல்
  rationale: עַל என்பதன் இடஞ்சார்ந்த பொருளையும் אֶרֶץ என்பதன் ‘நாடு’ என்ற பொருளையும் காக்கிறது; வசனத்தில் மீண்டும் வரும் சொற்றொடரும் ஒரேபோல் மொழிபெயர்க்கப்படுகிறது.
- source_word: בָּאַרְבֶּה
  choice: வெட்டுக்கிளிகளைக் குறித்து
  rationale: இங்குள்ள ב முன்னிடைச்சொல்லின் பொருள் தெளிவற்றது. கைநீட்டும் செயல் வெட்டுக்கிளிப் பேரிடரை நோக்கியது என்பதை அதிகமாக விளக்கிவிடாமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַרְבֶּה
  choice: வெட்டுக்கிளிகள்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் கூட்டுப் பொருளில் வெட்டுக்கிளித் திரளைக் குறிக்கிறது; தமிழில் பன்மை இச்சூழலின் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְיַעַל
  choice: படர்ந்து வந்து
  rationale: עלה என்பதன் மேலேறி வருதல் அல்லது நிலப்பரப்பின்மேல் வருதல் என்ற இயக்கத்தை, வெட்டுக்கிளிகள் நாட்டை மூடும் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְיֹאכַל
  choice: தின்றுவிடட்டும்
  rationale: அடுத்தடுத்து வரும் கட்டளை நோக்கமுள்ள வினைத் தொடரைத் தமிழில் இயல்பாகக் காட்டி, אכל என்பதன் நேரடியான உண்ணுதல்/தின்னுதல் பொருளைக் காக்கிறது.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: நாட்டின் செடிகள் அனைத்தையும்
  rationale: עֵשֶׂב இங்கு புல் மட்டும் அல்லாமல் நிலத்தின் தாவர வளர்ச்சியை விரிவாகக் குறிக்கலாம்; ‘செடிகள் அனைத்தையும்’ என்பது சாதாரண வாசகருக்குத் தெளிவானது.
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: ஆலங்கட்டி மழை விட்டுவைத்த
  rationale: הִשְׁאִיר என்பதன் ‘மீதியாக விட்டுவைத்தது’ என்ற பொருளைத் தக்கவைத்து, முந்தைய பேரிடருடன் உள்ள தொடர்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது; குறிப்பிட்ட சமயப் பிரிவின் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மீளுரை காக்கப்பட்டுள்ளது; கடினமான בָּאַרְבֶּה என்பதன் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
