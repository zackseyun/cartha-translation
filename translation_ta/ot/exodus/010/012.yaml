revisions:
- from: அப்போது யாவே மோசேயிடம், “வெட்டுக்கிளிகளைக் குறித்து[a] எகிப்து நாட்டின்மேல் உன் கையை நீட்டு; அவை[b] எகிப்து நாட்டின்மேல் படர்ந்து வந்து, ஆலங்கட்டி மழை விட்டுவைத்த நாட்டின் செடிகள் அனைத்தையும் தின்றுவிடட்டும்” என்றார்.
  to: அப்போது யாவே மோசேயிடம், “வெட்டுக்கிளிகளைக் குறித்து[a] உன் கையை எகிப்து நாட்டின்மேல் நீட்டு; அவை எகிப்து நாட்டின்மேல் வரவும், ஆலங்கட்டி மழை விட்டுவைத்த நாட்டிலுள்ள எல்லாச் செடிகளையும் தின்னவும்” என்றார்.
  rationale: The revision resolves the ambiguous final modifier, removes the added nuance in “படர்ந்து,” and makes the purpose relation of the command explicit in idiomatic Tamil. Footnote b is retained as a complete footnote even though the revised flowing Tamil does not require an in-text marker for it; it documents the collective-singular source feature reflected in the plural Tamil rendering.
