  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה בִּ/נְעָרֵ֥י/נוּ וּ/בִ/זְקֵנֵ֖י/נוּ נֵלֵ֑ךְ בְּ/בָנֵ֨י/נוּ וּ/בִ/בְנוֹתֵ֜/נוּ בְּ/צֹאנֵ֤/נוּ וּ/בִ/בְקָרֵ֨/נוּ֙ נֵלֵ֔ךְ כִּ֥י חַג יְהוָ֖ה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: ta
  text: 'மோசே சொன்னார்: “எங்கள் இளையவர்களோடும் முதியவர்களோடும் நாங்கள் போவோம்; எங்கள் மகன்களோடும் மகள்களோடும், எங்கள் ஆடுமாடுகளோடும் நாங்கள் போவோம். ஏனெனில், நாங்கள் யெகோவாவுக்குப் பண்டிகை கொண்டாட வேண்டும்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: எங்கள் இளைஞர்களோடும் முதியவர்களோடும்
  rationale: இளம் வயதினரையும் முதியோரையும் உள்ளடக்கும் மெரிஸத்தை இயல்பான நவீனத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: எங்கள் ஆடுமாடுகளோடும்
  rationale: צֹאן என்பது சிறுகால்நடை மந்தையையும் בָּקָר என்பது மாடுகளையும் குறிக்கிறது; ‘ஆடுமாடுகள்’ என்ற பொதுவழக்குச் சேர்க்கை இரு கால்நடைப் பிரிவுகளையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: חַג
  choice: பண்டிகை கொண்டாட
  rationale: இச்சூழலில் பெயர்ச்சொல்லான ‘பண்டிகை’ யெகோவாவுக்காக நடத்தப்படும் சமய விழாவைக் குறிக்கிறது; தமிழ் வாக்கியத்தில் ‘கொண்டாட வேண்டும்’ என்பது இயல்பான வினைத்தொடர்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரின் வேறுபாட்டைப் பாதுகாக்கும் தமிழில் நிலைபெற்ற வடிவம்; பொதுப்பட்டமான ‘கர்த்தர்’ என்பதுடன் கலக்கவில்லை.
theological_decisions:
- issue: כִּי חַג יְהוָה לָנוּ என்பதிலுள்ள கடமை/தேவையின் வெளிப்பாடு
  choice: ஏனெனில், நாங்கள் யெகோவாவுக்குப் பண்டிகை கொண்டாட வேண்டும்
  alternative: ஏனெனில், எங்களுக்கு யெகோவாவின் பண்டிகை உண்டு
  rationale: எபிரெய உரை சொற்படியாக ‘யெகோவாவுக்கான பண்டிகை எங்களுக்கு உள்ளது’ என இருந்தாலும், பார்வோனிடம் மோசே கூறும் காரணத்தைத் தமிழில் தெளிவாக வெளிப்படுத்த ‘கொண்டாட வேண்டும்’ என மொழிபெயர்க்கப்பட்டது; புதிய சமயக் கடமையைச் சேர்க்காமல் சூழலிலுள்ள நோக்கத்தைத் தருகிறது.
translation_notes:
  register: மரியாதைமிக்க, நவீன நிலையான தமிழ். எபிரெய வாக்கியத்தின் இருமுறை வரும் ‘நாங்கள் போவோம்’ என்பதையும், இளையோர்–முதியோர் மற்றும் மகன்கள்–மகள்கள் என்ற முழுமையைக் காட்டும் இணைகளையும் பாதுகாக்கிறது.
