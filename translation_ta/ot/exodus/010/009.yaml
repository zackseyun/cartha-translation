review_pass:
  verdict: revise
  source_fidelity: The draft preserves the repeated ‘we will go,’ the inclusive pairings, and the flocks/herds. ‘பண்டிகை கொண்டாட வேண்டும்’ appropriately communicates the contextual force of כִּי חַג יְהוָה לָנוּ, though the Hebrew is more literally ‘for we have a festival of YHWH.’
  naturalness: The sentence is fluent modern standard Tamil. However, ‘இளைஞர்கள்’ commonly suggests adolescents or young men and can narrow the broad Hebrew נְעָרִים (‘young people/children’ in this inclusive setting). ‘இளையவர்கள்’ is more suitably inclusive alongside ‘முதியவர்கள்.’
  terminology: ‘ஆடுமாடுகள்’ accurately and naturally represents flocks and herds. ‘யெகோவா’ is an established Tamil form for the divine name and consistently distinguishes it from a title. ‘பண்டிகை’ is appropriate for חַג.
  issues:
  - severity: low
    issue: ‘இளைஞர்களோடும்’ may be overly narrow for נְעָרֵינוּ.
    rationale: In modern Tamil, ‘இளைஞர்கள்’ often denotes youths/young men rather than the full category of young people or children intended by the Hebrew merism. ‘இளையவர்களோடும்’ retains the inclusive contrast with the old without adding an age-specific restriction.
  revised_text: 'மோசே சொன்னார்: “எங்கள் இளையவர்களோடும் முதியவர்களோடும் நாங்கள் போவோம்; எங்கள் மகன்களோடும் மகள்களோடும், எங்கள் ஆடுமாடுகளோடும் நாங்கள் போவோம். ஏனெனில், நாங்கள் யெகோவாவுக்குப் பண்டிகை கொண்டாட வேண்டும்.”'
