  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: ta
  text: மேலும், எகிப்தில் நான் எவ்வாறு கடுமையாகச் செயல்பட்டேன் என்பதையும்[a], அவர்களிடையே நான் வைத்த என் அடையாளங்களையும், நீ உன் மகனும் உன் பேரனும் கேட்கும்படி எடுத்துச் சொல்லவும், நானே யாவே என்பதை நீங்கள் அறிந்துகொள்ளவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்தைக் கேலிக்குரியதாக்கிய விதத்தையும்.” எபிரெய வினை, எகிப்தைக் கடுமையாகத் தண்டித்ததோடு அதை இழிவுபடுத்தியதையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: மேலும், … என்பதற்காகவும்
  rationale: முந்தைய வசனத்துடன் உள்ள இணைப்பையும் நோக்கப் பொருளையும் காக்கிறது; தமிழில் நோக்கத் தொடரை இயல்பாக அமைக்கிறது.
- source_word: תְּסַפֵּר
  choice: எடுத்துச் சொல்லுவதற்காக
  rationale: பிற்காலத் தலைமுறையினருக்கு நிகழ்வுகளை விவரித்துச் சொல்வது என்ற பியேல் வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּאָזְנֵי
  choice: கேட்கும்படி
  rationale: ‘காதுகளில்’ என்ற எபிரெய மொழிமரபின் செயல்பாட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִנְךָ וּבֶן בִנְךָ
  choice: உன் மகனும் உன் பேரனும்
  rationale: ‘உன் மகனும் உன் மகனின் மகனும்’ என்ற தலைமுறைத் தொடரைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: הִתְעַלַּלְתִּי
  choice: நான் எகிப்தைக் கடுமையாக நடத்திய விதம்
  rationale: வாதைகள் வழியாக எகிப்துக்கு நேர்ந்த கடுமையான, இழிவுபடுத்தும் தண்டனைச் செயலைக் காட்டுகிறது; கேலி செய்தல் என்ற சாத்தியத்தை அடிக்குறிப்பில் காக்கிறது.
- source_word: אֹתֹתַי
  choice: என் அடையாளங்கள்
  rationale: אות என்பதன் நேரடியான பொருளைக் காக்கிறது; மூலத்தில் இல்லாத ‘அற்புத’ என்ற விளக்கச் சொல்லைச் சேர்க்கவில்லை.
- source_word: שַׂמְתִּי בָם
  choice: எகிப்தியரிடையே நான் வைத்த
  rationale: ‘வைத்தேன்’ என்ற எபிரெய வினையின் உருவகத்தைப் பேணுகிறது; பன்மை பின்னொட்டு எகிப்தியரைக் குறிப்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וִידַעְתֶּם
  choice: நீங்கள் அறிந்துகொள்வதற்காக
  rationale: தொடக்க நோக்குத் தொடருடன் இணைந்த நோக்கப் பொருளை முதன்மைப்படுத்துகிறது; எதிர்கால விளைவு என்ற வாசிப்பை அடிக்குறிப்பில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரெய தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: எகிப்தின்மீது நிகழ்த்தப்பட்ட הִתְעַלַּלְתִּי என்ற இறைச்செயலின் பொருள்
  choice: எகிப்தைக் கடுமையாக நடத்தினேன்
  alternative: எகிப்தைக் கேலிக்குரியதாக்கினேன்
  rationale: சொல் கடுமையான தண்டனையையும் இழிவுபடுத்துதலையும் தாங்கக்கூடும். முதன்மை உரை வாதைகளின் நீதித்தீர்ப்புச் செறிவை வெளிப்படுத்துகிறது; இழிவுபடுத்தும் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: וִידַעְתֶּם என்பதன் நோக்கம் அல்லது விளைவு
  choice: நீங்கள் அறிந்துகொள்வதற்காக
  alternative: நீங்கள் அறிந்துகொள்வீர்கள்
  rationale: לְמַעַן தொடங்கும் நோக்கத் தொடரோடு இணைப்பது தொடரமைப்புக்கு ஏற்றது; விளைவு அல்லது எதிர்காலக் கூற்று என்ற சாத்தியமும் உண்மையானதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உன் மகனும் உன் பேரனும் கேட்கும்படி’ என்பது எபிரெய மொழிமரபைச் சொற்சொல்லாக அல்லாமல் அதன் பொருளோடு வழங்குகிறது. மூலத்தில் ஒருமை ‘நீ/உன்’ என்பதிலிருந்து பன்மை ‘நீங்கள்’ என்பதற்கு ஏற்படும் மாற்றம் திட்டமிட்டு காக்கப்பட்டுள்ளது. வசனம் முந்தைய உரையுடன் இணையும் நோக்கத் தொடராக இருப்பதால், தமிழில் முழுமையான வாக்கிய ஓட்டத்திற்காக ‘இவ்வாறு செய்தேன்’ என்பது சூழலிலிருந்து வெளிப்படையாக நிரப்பப்பட்டுள்ளது.
