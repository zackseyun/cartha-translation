  text: וַ/יְכַ֞ס אֶת עֵ֣ין כָּל הָ/אָרֶץ֮ וַ/תֶּחְשַׁ֣ךְ הָ/אָרֶץ֒ וַ/יֹּ֜אכַל אֶת כָּל עֵ֣שֶׂב הָ/אָ֗רֶץ וְ/אֵת֙ כָּל פְּרִ֣י הָ/עֵ֔ץ אֲשֶׁ֥ר הוֹתִ֖יר הַ/בָּרָ֑ד וְ/לֹא נוֹתַ֨ר כָּל יֶ֧רֶק בָּ/עֵ֛ץ וּ/בְ/עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: ta
  text: அது தேசம் முழுவதின் மேற்பரப்பை[a] மூடியது; தேசம் இருண்டுபோனது. கல்மழை விட்டுவைத்திருந்த தேசத்திலுள்ள எல்லாச் செடிகளையும் மரங்களின் எல்லாப் பழங்களையும் அது தின்றது. எகிப்து தேசம் முழுவதிலும் மரங்களிலோ வயல்வெளிச் செடிகளிலோ பசுமையான எதுவும் மீந்திருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘தேசம் முழுவதின் கண்’; இது கண்ணுக்குத் தெரியும் நிலப்பரப்பை அல்லது தேசத்தின் மேற்பரப்பைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: அது ... மூடியதால்
  rationale: வினைச்சொல்லின் ஒருமையைப் பேணி, முந்தைய சூழலில் உள்ள வெட்டுக்கிளிக் கூட்டத்தைத் தொகுதி ஒருமையாகக் குறிக்கிறது; தொடரும் இருளை விளைவாக இயல்பாக இணைக்கிறது.
- source_word: עֵין כָּל הָאָרֶץ
  choice: தேசம் முழுவதன் முகப்பு
  rationale: எபிரெய மொழியின் நேரடியான ‘தேசம் முழுவதன் கண்’ என்ற உருவக மரபுத்தொடர் காணப்படும் நிலப்பரப்பு அல்லது முகப்பைக் குறிக்கிறது. தமிழில் உருவகத்தை ஓரளவு பேணும் இயல்பான வடிவம்.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: தேசம் இருண்டுபோனது
  rationale: இருள் அடைந்த நிலையைக் குறிக்கும் வினையை நேரடியாகவும் இயல்பாகவும் தருகிறது; காரணத்தை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: וַיֹּאכַל
  choice: அது தின்றது
  rationale: வெட்டுக்கிளிக் கூட்டத்தைக் குறிக்கும் எபிரெய ஒருமை வினையைத் தொடர்ந்து பேணுகிறது; அடிப்படை உண்ணுதல் பொருளை வலுப்படுத்தாமல் வழங்குகிறது.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: தேசத்தின் செடிகள் அனைத்தையும்
  rationale: עֵשֶׂב என்பது புல்லை மட்டும் அல்லாமல் தாவர வகைகளை விரிவாகக் குறிக்கலாம்; ‘செடிகள்’ நவீனத் தமிழில் தெளிவான விரிவுப் பொருள் தருகிறது.
- source_word: כָּל פְּרִי הָעֵץ
  choice: மரங்களின் பழங்கள் அனைத்தையும்
  rationale: ஒருமை வடிவிலுள்ள עֵץ இங்கு தொகுதிப் பொருளில் வருவதால், தமிழில் இயல்பான பன்மை பயன்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: கல்மழை விட்டுவைத்திருந்த
  rationale: முந்தைய வாதைக்குப் பின் எஞ்சியிருந்தவற்றைக் குறிக்கும் முன்னிறந்த கால உறவைப் பேணுகிறது.
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: பசுமையான எதுவும் மீந்திருக்கவில்லை
  rationale: முழுமையான மறுப்பையும், எஞ்சிய நிலை இல்லாமையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: மரங்களிலோ வயல்வெளிச் செடிகளிலோ
  rationale: இரு இடவுருபுத் தொடர்களையும் இணைத்துப் பேணி, மரங்களிலும் வயல் தாவரங்களிலும் ஒன்றும் எஞ்சவில்லை என்ற விரிவைத் தெளிவாக்குகிறது.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: எகிப்து தேசம் முழுவதிலும்
  rationale: முழு எகிப்திய நிலப்பரப்பையும் குறிக்கும் பிரதேசச் சொல்லாட்சியைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
