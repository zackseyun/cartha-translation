base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: ta
  text: இப்போது, தயவுசெய்து இந்த ஒருமுறை மட்டும் என் பாவத்தை மன்னித்து[a], உங்கள் கடவுளாகிய யாவேவிடம் மன்றாடுங்கள்; அவர் இந்த மரணத்தை மட்டும்[b] என்னைவிட்டு அகற்றட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, ‘என் பாவத்தைத் தூக்கிச் செல்லுங்கள்’ அல்லது ‘என் பாவத்தைப் பொறுத்தருளுங்கள்.’ எபிரெய மரபுத்தொடரில் ‘தூக்கு/சும’ என்ற வினை ‘பாவம்’ என்பதைச் செயப்படுபொருளாகக் கொள்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘இந்த மரணம்.’ பார்வோன் அப்போது ஏற்பட்டிருந்த உயிர்க்கொல்லி வாதையையும் அதன் விளைவுகளையும் குறிப்பிட்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: இணைப்புச் சொல்லையும் காலக் குறிப்பையும் இயல்பான தமிழில் வெளிப்படுத்தி, பார்வோனின் அவசர வேண்டுகோளுக்கான தொடர்ச்சியைச் சுட்டுகிறது.
- source_word: שָׂא נָא חַטָּאתִי
  choice: என் பாவத்தை மன்னித்து
  rationale: ‘பாவத்தைத் தூக்குதல்/சுமத்தல்’ என்ற எபிரெய மரபுத்தொடர் இங்கு மன்னிப்பதைக் குறிக்கிறது; נָא-வின் பணிவான வேண்டுகோள் வாக்கிய அமைப்பில் வெளிப்படுகிறது.
- source_word: אַךְ הַפַּעַם
  choice: இந்த ஒருமுறை மட்டும்
  rationale: பார்வோன் இம்முறை மட்டும் மன்னிப்புக் கோருகிறான் என்ற வரம்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְהַעְתִּירוּ
  choice: மன்றாடுங்கள்
  rationale: இறைவனிடம் தீவிரமாக வேண்டுதல் அல்லது பரிந்து வேண்டுதல் என்ற பொருளை நவீன, கண்ணியமான தமிழில் தருகிறது; எபிரெயப் பன்மை கட்டளையும் தமிழில் காக்கப்படுகிறது.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேவிடம்
  rationale: יהוה என்ற தனிப்பெயரை ‘யாவே’ என ஒலிபெயர்த்து, ‘உங்கள் கடவுள்’ என்ற பார்வோனின் தன்னை விலக்கிக் கூறும் மொழியையும் காக்கிறது.
- source_word: וְיָסֵר מֵעָלַי
  choice: அவர் … என்னைவிட்டு அகற்றட்டும்
  rationale: பரிந்துரைக்கும் வேண்டுதலைத் தொடர்ந்து வரும் நோக்கம் அல்லது விருப்பத்தைக் காட்டும் எபிரெய வடிவத்தை இயல்பான தமிழ் வேண்டுதல் வினையாக அளிக்கிறது.
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: இந்த மரணத்தை மட்டும்
  rationale: ‘இந்த மரணம்’ என்ற மூலத்தின் திடமான உருவகத்தை விளக்கமாக ‘கொள்ளைநோய்’ என்று மாற்றாமல் காத்து, רַק என்பதன் வரையறுக்கும் வலிமையையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது.
- issue: ‘இந்த மரணம்’ என்பதன் பொருள்
  choice: மூலத்தின் தெளிவின்மையைப் பாதுகாத்து ‘இந்த மரணம்’ என மொழிபெயர்த்தல்
  alternative: இந்தக் கொடிய வாதை
  rationale: சூழலில் இது வெட்டுக்கிளி வாதையையும் அதன் உயிர்க்கொல்லி விளைவுகளையும் குறிக்கக்கூடும்; ஆனால் மூலமே ‘மரணம்’ என்று சொல்வதால் குறிப்பிட்ட விளக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான வேண்டுகோள் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மன்றாடுங்கள்’ என்பது மோசே, ஆரோன் ஆகிய இருவரையும் நோக்கிய பன்மையை இயல்பாகக் காக்கிறது; ‘உங்கள் கடவுள்’ என்ற தூரப்படுத்தும் சொற்றொடரும் மாற்றப்படவில்லை.
