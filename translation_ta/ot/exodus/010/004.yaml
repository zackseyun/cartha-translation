  terminology: “வெட்டுக்கிளிகளை” is the standard term for locusts, and the plural is appropriate for the Hebrew collective singular. “உன் எல்லைக்குள்” is a faithful and natural rendering of the territorial/border expression. The footnote anchors and explanations are correctly matched in the Tamil draft.
