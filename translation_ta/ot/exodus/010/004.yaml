translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் எச்சரிக்கையின் கண்ணியமான, தீவிரமான தொனியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் காரணத் தொடர்பு, நிபந்தனை, இரண்டாம் நபர் ஒருமை வலியுறுத்தல், மற்றும் உடனடித்தன்மை பாதுகாக்கப்பட்டுள்ளன.
