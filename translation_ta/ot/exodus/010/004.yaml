  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֛י אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֣חַ אֶת עַמִּ֑/י הִנְ/נִ֨י מֵבִ֥יא מָחָ֛ר אַרְבֶּ֖ה בִּ/גְבֻלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/004.yaml
  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: ta
  text: ஏனெனில், என் மக்களைப் போகவிட நீ மறுத்தால், இதோ, நாளை உன் எல்லைக்குள்[b] வெட்டுக்கிளிகளை[a] கொண்டுவருவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெட்டுக்கிளி” என்பதற்கான எபிரெயச் சொல் வடிவத்தில் ஒருமையாக இருந்தாலும், இங்கு கூட்டுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் ஆட்சிப்பகுதிக்குள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ஏனெனில், … மறுத்தால்
  rationale: כִּי என்பதன் காரண/தொடர்ச்சி நுணுக்கத்தையும் אִם என்பதன் நிபந்தனைப் பொருளையும் காத்து, முந்தைய எச்சரிக்கையின் காரணத்தை இயல்பான தமிழில் தொடர்கிறது.
- source_word: מָאֵן
  choice: மறுத்தால்
  rationale: இது இயலாமையையோ தயக்கத்தையோ அல்ல, மனப்பூர்வமான மறுப்பைக் குறிக்கிறது.
- source_word: לְשַׁלֵּחַ
  choice: போகவிட
  rationale: யாத்திராகமச் சூழலில் மக்களை விடுவித்து அனுப்புவதைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: עַמִּי
  choice: என் மக்களை
  rationale: உடைமை வலியுறுத்தலையும் உடன்படிக்கை சார்ந்த உறவையும் எளிமையாகக் காக்கிறது.
- source_word: הִנְנִי
  choice: இதோ
  rationale: வரவிருக்கும் தெய்வீகச் செயலின் உடனடித்தன்மையையும் தீவிரமான எச்சரிக்கைத் தொனியையும் வெளிப்படுத்துகிறது.
- source_word: מֵבִיא
  choice: கொண்டுவருவேன்
  rationale: הִנְנִי உடன் வரும் எபிரெயப் பங்கேற்பு வடிவம் உடனடியாக நிகழவிருக்கும் எதிர்காலச் செயலைக் குறிக்கிறது; ‘நாளை’ என்பதும் காலத்தைத் தெளிவாக்குகிறது.
- source_word: מָחָר
  choice: நாளை
  rationale: வாதையின் காலத்தை நேரடியாகக் குறிக்கும் காலவினையடை.
- source_word: אַרְבֶּה
  choice: வெட்டுக்கிளிகளை
  rationale: எபிரெயத்தில் ஒருமை வடிவில் இருந்தாலும் கூட்டுப்பொருளில் பயன்படுவதால், தமிழில் இயல்பான பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בִּגְבֻלֶךָ
  choice: உன் எல்லைக்குள்
  rationale: גְּבוּל என்பதன் எல்லை/ஆட்சிப்பகுதி பொருளையும், ‘கொண்டுவருதல்’ குறிக்கும் உள்ள்நோக்கிய இயக்கத்தையும் காக்கிறது.
