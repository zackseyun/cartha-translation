base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “உன் கையை வானத்தை நோக்கி நீட்டு; எகிப்து நாட்டின்மேல் இருள் உண்டாகட்டும்; இருளையே தொட்டுணர முடியும்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதித் தொடரிலுள்ள எபிரெய வினை அரிதானது. இதை “இருள் உணரப்படலாம்” என்றும், “ஒருவர் இருளைத் தொட்டுணரலாம்” என்றும் மொழிபெயர்க்கலாம். இருள் தொட்டுணரத்தக்க அளவு அடர்த்தியாக இருந்ததை இத்தொடர் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைத் திருப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נְטֵה יָדְךָ
  choice: உன் கையை ... நீட்டு
  rationale: மோசேயிடம் கூறப்படும் ஒருமை ஆண்பால் கட்டளையையும் உடல் அசைவையும் நேரடியாகக் காக்கிறது.
- source_word: עַל הַשָּׁמַיִם
  choice: வானத்தை நோக்கி
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘வானங்களின்மேல்’ என இருந்தாலும், இச்சைகாட்டும் சூழலில் மேல்நோக்கிய திசையைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: וִיהִי חֹשֶׁךְ
  choice: இருள் உண்டாகட்டும்
  rationale: இருள் தோன்ற வேண்டும் என்ற எபிரெய விருப்பவினை/கட்டளை நுணுக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டின்மேல்
  rationale: אֶרֶץ என்பதிலுள்ள ‘நாடு/நிலம்’ என்ற புவியியல் குறிப்பை விடாமல் காக்கிறது.
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: அந்த இருளைத் தொட்டுணரவும் முடியட்டும்
  rationale: נדירமான משׁש வினையின் ‘தொட்டு உணர்’ என்ற பொருளையும், இருளின் உணரத்தக்க அடர்த்தியையும் காக்கிறது; அதேவேளை செய்பவரைக் குறிப்பிடாத மூலத்தின் அமைப்பையும் தமிழில் இயல்பாக பிரதிபலிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒலிபெயர்ப்பாகவே காக்கிறது.
- issue: இறுதி அரிய வினையின் பொருள்
  choice: இருளைத் தொட்டுணரவும் முடியட்டும்
  alternative: இருள் உணரப்படட்டும்
  rationale: இருளை உடலால் உணரத்தக்கதாகச் சித்தரிக்கும் வழக்கமான புரிதலை முதன்மை உரையில் தருகிறது; ஆனால் அரிய வினையின் இலக்கண மற்றும் சொற்பொருள் தெளிவின்மையை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும், அதேவேளை வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான விருப்பவினை அமைப்பைக் காக்க ‘உண்டாகட்டும் ... முடியட்டும்’ என இணையாக அமைக்கப்பட்டுள்ளது.
