  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְמַהֵ֣ר פַּרְעֹ֔ה לִ/קְרֹ֖א לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֑ן וַ/יֹּ֗אמֶר חָטָ֛אתִי לַ/יהוָ֥ה אֱלֹֽהֵי/כֶ֖ם וְ/לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: ta
  text: அப்போது பார்வோன் மோசேயையும் ஆரோனையும் அழைக்க அவசரப்பட்டான். அவன், “உங்கள் கடவுளாகிய யாவேக்கு எதிராகவும் உங்களுக்கு எதிராகவும் நான் பாவம் செய்தேன்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: அவசரமாக
  rationale: מהר என்பதன் விரைவாகச் செயல்படும் பொருளையும் சூழலிலுள்ள அவசரத்தையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִקְרֹא לְמֹשֶׁה וּלְאַהֲרֹן
  choice: மோசேயையும் ஆரோனையும் அழைப்பித்து
  rationale: இங்கு קרא ל என்பது அவர்களைத் தன் முன்னிலைக்கு வரவழைப்பதைக் குறிக்கிறது; ‘அழைப்பித்து’ என்பது பார்வோன் ஆட்களை அனுப்பி அழைத்துவரச் செய்திருக்கக்கூடிய அரசவைக் சூழலையும் இயல்பாகத் தருகிறது.
- source_word: חָטָאתִי
  choice: நான் பாவம் செய்துவிட்டேன்
  rationale: חטא என்பதன் அறநெறி மற்றும் இறையியல் வலிமையை ‘பாவம் செய்தேன்’ காக்கிறது; நிறைவுற்ற ஒப்புதலின் சூழலுக்கு ‘செய்துவிட்டேன்’ இயல்பான தமிழாகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு எதிராக
  rationale: חטא உடன் வரும் ל புண்படுத்தப்பட்ட தரப்பைக் குறிக்கிறது; தமிழில் ‘எதிராகப் பாவம் செய்தல்’ அந்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் பன்மை உடைமைப் பின்னொட்டைத் துல்லியமாகக் காக்கிறது; பார்வோன் யாவேவை இன்னும் ‘எங்கள் கடவுள்’ என்று அழைக்கவில்லை.
- source_word: וְלָכֶם
  choice: உங்களுக்கு எதிராகவும்
  rationale: பன்மையான ‘உங்களுக்கு’ மோசே, ஆரோன் இருவரையும் குறிக்கிறது; முன் வரும் חטא வினையின் ஆளுகையை இயல்பான தமிழில் தொடர்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரேய உரையில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ என்று தருவது மூலத்தின் தனிப்பெயரைப் பாதுகாக்கிறது.
- issue: பார்வோனின் பாவ ஒப்புதலில் ל என்பதன் உறவு
  choice: யாவேக்கு எதிராகவும் உங்களுக்கு எதிராகவும்
  alternative: யாவேக்கும் உங்களுக்கும் பாவம் செய்தேன்
  rationale: தமிழில் ‘எதிராக’ என்பது பாவம் யாருக்கு விரோதமாகச் செய்யப்பட்டது என்பதைத் தெளிவாகக் காட்டுகிறது; அதேவேளை பார்வோனின் ஒப்புதலின் வலிமையைக் குறைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. எபிரேய தொடர் நிகழ்வை இயல்பாகக் காட்ட ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது; நேரடி உரையின் சுருக்கமும் தீவிரமும் காக்கப்பட்டுள்ளன.
