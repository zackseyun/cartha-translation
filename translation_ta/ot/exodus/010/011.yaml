  - severity: medium
    issue: “ஆண்கள் ... பணிவிடை செய்யுங்கள்” is grammatically and stylistically awkward.
    rationale: The phrase identifies “the men” in the third person but follows it with a second-person plural honorific imperative. Tamil naturally expresses Pharaoh’s limited permission as “ஆண்கள் ... செய்யட்டும்.”
  - severity: low
