base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: ta
  text: “அப்படியல்ல[a]! ஆண்கள்[b] இப்போதே போய் யாவேக்கு சேவை செய்யட்டும்; ஏனெனில் நீங்கள் நாடுவது அதைத்தான்.” பின்னர் பார்வோன் அவர்களைத் தன் முன்னிலையிலிருந்து துரத்தியடித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இல்லை!”—பார்வோனின் திடீர் மறுப்பை இன்னும் சுருக்கமாகத் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஆண்கள்”; எல்லா மக்களையும் அல்ல, வயதுவந்த ஆண்களையே குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: அப்படியல்ல
  rationale: முந்தைய கோரிக்கையைப் பார்வோன் திடீரென மறுப்பதன் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘இல்லை’ என்பதைக் காட்டிலும் எபிரெயச் சொற்றொடரின் வடிவத்தையும் காக்கிறது.
- source_word: לְכוּ נָא
  choice: இப்போதே போய்
  rationale: נָא இங்கு மரியாதையான வேண்டுகோளைவிட அவசரத்தையும் தள்ளிவிடும் தொனியையும் குறிக்கிறது; ‘இப்போதே’ அதைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַגְּבָרִים
  choice: ஆண்கள்
  rationale: இந்தச் சொல் எல்லா மக்களையும் அல்ல, ஆண்பாலினரைத் தனிப்படக் குறிக்கிறது. பார்வோன் அனுமதியை வரையறுக்கும் கதைத்தளப் பதற்றம் இதனால் காக்கப்படுகிறது.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: யெகோவாவுக்குப் பணிவிடை செய்யுங்கள்
  rationale: עבד என்பதில் சேவை மற்றும் வழிபாடு ஆகிய இரு பொருள் நிழல்களும் உள்ளன. ‘பணிவிடை செய்யுங்கள்’ என்பது அதை வெறும் சடங்கு வழிபாடாகக் குறுக்காமல் இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்திலுள்ள உடன்படிக்கைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் நிலைபெற்ற ‘யெகோவா’ என்ற வடிவில் தருகிறது.
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: ஏனெனில் நீங்கள் நாடுவது அதைத்தான்
  rationale: பெண்பால் சுட்டுப்பெயரின் வெளிப்படையாகச் சொல்லப்படாத முன்னிலையை அதிகமாக விளக்காமல், அவர்கள் நாடிய காரியத்தைக் குறிக்கும் இயல்பான தமிழைத் தருகிறது.
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: பிறகு அவன் அவர்களை ... துரத்தியடித்தான்
  rationale: வினையின் வலிமையான வெளியேற்றும் தன்மையை ‘துரத்தியடித்தான்’ காட்டுகிறது. சூழலில் ஒருமை எழுவாய் பார்வோனைக் குறித்தாலும், எபிரெயத்தில் பெயர் மீண்டும் வெளிப்படையாக வராததால் ‘அவன்’ என வைக்கப்பட்டுள்ளது.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: பார்வோனின் முன்னிலையிலிருந்து
  rationale: அரசவையில் பார்வோனுக்கு முன்பாக இருந்த இடத்திலிருந்து அகற்றப்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்து இறைப்பெயரே உள்ளது. ஆகவே உடன்படிக்கைப் பெயரின் தனித்தன்மை தமிழிலும் காக்கப்படுகிறது.
- issue: பார்வோனின் அனுமதியில் உள்ள பாலின வரையறை
  choice: ஆண்கள்
  alternative: மக்கள்
  rationale: הַגְּבָרִים ஆண்களைக் குறிப்பாகச் சுட்டுகிறது. அதை ‘மக்கள்’ என்று பொதுமைப்படுத்துவது பார்வோனின் பகுதியளவான சலுகையையும் கதையின் பதற்றத்தையும் மறைத்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. பார்வோனின் திடீர் மறுப்பு, ஆண்களுக்கு மட்டும் அளிக்கப்படும் வரையறுக்கப்பட்ட அனுமதி, மற்றும் வலுக்கட்டாய வெளியேற்றம் ஆகியவை தெளிவாகக் காக்கப்பட்டுள்ளன.
