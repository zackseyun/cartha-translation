revisions:
- from: வெட்டுக்கிளிகள் எகிப்து நாடு முழுவதன்மேலும் ஏறிவந்து, எகிப்தின் எல்லாப் பகுதிகளிலும் தங்கின. அவை மிகவும் கடுமையாக இருந்தன[a]. அவற்றைப் போன்ற வெட்டுக்கிளிகள் அதற்கு முன்பு இருந்ததில்லை; அதற்குப் பிறகும் இருக்கப்போவதில்லை.
  to: வெட்டுக்கிளிகள் எகிப்து நாடு முழுவதின்மேலும் ஏறிவந்து, எகிப்தின் எல்லாப் பகுதிகளிலும் வந்து படிந்தன. அந்த வெட்டுக்கிளிக் கூட்டம் மிகவும் கடுமையானதாக இருந்தது[a]. அதற்கு முன்பு அப்படிப்பட்ட வெட்டுக்கிளிகள் இருந்ததில்லை; அதற்குப் பிறகும் இருக்காது.
  rationale: The revision retains the Hebrew movement imagery (“ஏறிவந்து”), the nationwide distribution, and the absolute before-and-after comparison. It expresses the singular collective locust noun and the idiomatic force of כָּבֵד מְאֹד naturally in Tamil as a very severe locust swarm, while the footnote preserves the literal ‘very heavy’ wording.
