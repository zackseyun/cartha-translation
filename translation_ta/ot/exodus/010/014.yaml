  text: וַ/יַּ֣עַל הָֽ/אַרְבֶּ֗ה עַ֚ל כָּל אֶ֣רֶץ מִצְרַ֔יִם וַ/יָּ֕נַח בְּ/כֹ֖ל גְּב֣וּל מִצְרָ֑יִם כָּבֵ֣ד מְאֹ֔ד לְ֠/פָנָי/ו לֹא הָ֨יָה כֵ֤ן אַרְבֶּה֙ כָּמֹ֔/הוּ וְ/אַחֲרָ֖י/ו לֹ֥א יִֽהְיֶה כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: ta
  text: வெட்டுக்கிளிகள் எகிப்து நாடு முழுவதின்மேலும் ஏறிவந்து, எகிப்தின் எல்லாப் பகுதிகளிலும் வந்து படிந்தன. அந்த வெட்டுக்கிளிக் கூட்டம் மிகவும் கடுமையானதாக இருந்தது[a]. அதற்கு முன்பு அப்படிப்பட்ட வெட்டுக்கிளிகள் இருந்ததில்லை; அதற்குப் பிறகும் இருக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேர்ச்சொல்லாக, ‘மிகவும் கனமானது.’ இச்சொற்றொடர் வெட்டுக்கிளிக் கூட்டத்தின் விதிவிலக்கான மிகுதியையும் கடுமையையும் விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறிவந்து
  rationale: עלה என்பதன் ‘மேலே ஏறு/வரு’ என்ற படிமத்தைத் தக்கவைத்து, வெட்டுக்கிளிகள் நாட்டின்மேல் பரவிய சூழலில் இயல்பான தமிழை வழங்குகிறது.
- source_word: הָאַרְבֶּה
  choice: வெட்டுக்கிளிகள்
  rationale: எபிரெயத்தில் ஒருமை வடிவம் கூட்டுப்பொருளில் வருகிறது; தமிழில் படையெடுக்கும் மொத்தக் கூட்டத்தை இயல்பாகக் குறிக்கப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாடு முழுவதன்மேலும்
  rationale: עַל என்பதன் ‘மேல்’ என்ற இடவியல் பொருளையும், כָּל אֶרֶץ என்பதன் முழுமையையும் காக்கிறது.
- source_word: וַיָּנַח
  choice: தங்கின
  rationale: נוח இங்கு வெட்டுக்கிளிகள் வந்து நாட்டெங்கும் படிந்து நிலைகொண்டதைக் குறிக்கிறது; ‘தங்கின’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: எகிப்தின் எல்லாப் பகுதிகளிலும்
  rationale: גְּבוּל என்பது இங்கு வெறும் எல்லைக்கோட்டை அல்ல, நாட்டின் ஆட்சிப்பரப்பு முழுவதையும் குறிக்கிறது; பகிர்வுப் பொருளை ‘எல்லாப் பகுதிகளிலும்’ வெளிப்படுத்துகிறது.
- source_word: כָּבֵד מְאֹד
  choice: மிகவும் கடுமையாக
  rationale: כָּבֵד என்பதன் நேர்ப்பொருள் ‘கனமானது’; இச்சூழலில் வெட்டுக்கிளித் தாக்குதலின் மிகுதியையும் தீவிரத்தையும் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: לְפָנָיו ... וְאַחֲרָיו
  choice: அதற்கு முன்பு ... அதற்குப் பிறகும்
  rationale: பின்னொட்டுகள் வெட்டுக்கிளிப் படையெடுப்பை ஒட்டுமொத்த நிகழ்வாகச் சுட்டலாம்; கால ஒப்பீட்டை தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: முந்தையதும் பிந்தையதும் இல்லாத ஒப்பற்ற வெட்டுக்கிளித் தாக்குதல்
  choice: அவற்றைப் போன்ற வெட்டுக்கிளிகள் அதற்கு முன்பு இருந்ததில்லை; அதற்குப் பிறகும் இருக்கப்போவதில்லை
  alternative: இப்படிப்பட்ட வெட்டுக்கிளிகள் இதற்கு முன்பும் இல்லை, இனியும் இருக்காது
  rationale: மூலத்தின் முன்/பின் அமைப்பையும் வலுவான ஒப்பீட்டையும் காக்கிறது; பிற வேதாகமப் பகுதிகளோடு செயற்கையாக ஒத்திசைத்து அதன் பொருளை மட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எல்லாப் பகுதிகளிலும்’ என்பது நாட்டின் எல்லைக்கோட்டை மட்டும் அல்லாமல் அதன் முழு ஆட்சிப்பரப்பையும் குறிக்கிறது. மூலத்தில் இல்லாத ‘கூட்டம்’ என்ற பெயர்ச்சொல் முதன்மை உரையில் சேர்க்கப்படவில்லை; כָּבֵד מְאֹד என்பதின் உருவக நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
