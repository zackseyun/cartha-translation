base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: ta
  text: 'மோசேயும் ஆரோனும் பார்வோனிடம் சென்று, அவனிடம், “எபிரெயர்களின் கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: ‘எனக்கு முன்பாக உன்னைத் தாழ்த்திக்கொள்ள[a] இன்னும் எவ்வளவு காலம் மறுப்பாய்? என் மக்களைப் போகவிடு; அவர்கள் எனக்குப் பணிசெய்யட்டும்[b].’” என்றார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குக் கீழ்ப்படிய” அல்லது “எனக்கு முன்பாகத் தாழ்த்தப்பட.” எபிரெய வினைச்சொல், தேவனுக்கு முன்பாக ஒருவர் தாழ்த்தப்படுவதையோ தம்மைத் தாழ்த்திக்கொள்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் என்னை வழிபடட்டும்.” எபிரெய வினைச்சொல் பணிசெய்வதையும் வழிபாட்டுக்குரிய சேவை செய்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: சென்று
  rationale: בוא உடன் אֶל என்பது ஒருவரிடம் செல்வதை அல்லது அவரது முன்னிலையில் நுழைவதைச் சுட்டுகிறது; தமிழில் அரண்மனைச் சந்திப்பின் சூழலை இயல்பாகத் தெரிவிக்க ‘பார்வோனிடம் சென்று’ பொருத்தமானது.
- source_word: כֹּה אָמַר
  choice: இவ்வாறு கூறுகிறார்
  rationale: இது இறைத்தூதர் அறிவிப்புச் சூத்திரம்; நிகழ்கால வலிமையையும் நேரடி இறைச்செய்தியின் தன்மையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரின் தமிழ் ஒலிபெயர்ப்பு; அதற்குப் பதிலாக ஒரு பட்டப்பெயர் இடப்படவில்லை.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: எபிரெயர்களின் கடவுள்
  rationale: எகிப்தியச் சூழலில் யாவேயை எபிரெயர் மக்களோடு தொடர்புபடுத்தும் இயல்பான இன அடையாளத் தொடர்.
- source_word: עַד מָתַי מֵאַנְתָּ
  choice: இன்னும் எவ்வளவு காலம் மறுப்பாய்?
  rationale: தொடர்ந்து வந்த மறுப்பைக் கண்டிக்கும் காலவினா; எபிரெய நிறைவுவினையின் நீடித்த நிகழ்நிலைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֵעָנֹת
  choice: உன்னைத் தாழ்த்திக்கொள்ள
  rationale: Niphal வடிவம் தாழ்த்தப்படுதல் அல்லது தன்னைத் தாழ்த்திக்கொள்ளுதல் என்ற இரு நெருக்கமான நிழற்பொருள்களைக் கொண்டது; சூழலில் பார்வோன் தேவனுக்கு முன் தன்னைத் தாழ்த்துவதே முதன்மைப் பொருள்.
- source_word: מִפָּנַי
  choice: எனக்கு முன்பாக
  rationale: சொற்படி ‘என் முகத்திற்கு முன்பாக’ என்ற தொடர், இங்கு தேவனுடைய முன்னிலையில் அல்லது அவருக்கு முன்பாக என்பதைக் குறிக்கிறது.
- source_word: שַׁלַּח עַמִּי
  choice: என் மக்களைப் போகவிடு
  rationale: யாத்திராகமத்தில் மீண்டும் வரும் விடுதலைக் கோரிக்கையைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וְיַעַבְדֻנִי
  choice: அவர்கள் எனக்குப் பணிசெய்யட்டும்
  rationale: עבד என்பதன் பரந்த ‘பணிசெய்’ பொருளைக் காக்கிறது; இச்சூழலில் வழிபாட்டுச் சேவையும் அதில் அடங்கும்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா அல்லது கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது; ‘யாவே’ என்பது பட்டப்பெயரால் மாற்றாமல் அதை ஒலிபெயர்க்கிறது.
- issue: לֵעָנֹת என்பதன் குரல் மற்றும் பொருள்
  choice: உன்னைத் தாழ்த்திக்கொள்ள
  alternative: எனக்குக் கீழ்ப்படிய அல்லது தாழ்த்தப்பட
  rationale: தன்னைத்தானே தாழ்த்தும் பொருள் இச்சூழலில் வலுவாக இருந்தாலும், எபிரெய வடிவத்தில் தாழ்த்தப்படுதல் என்ற நிழற்பொருளும் இருப்பதால் அதை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- issue: וְיַעַבְדֻנִי என்ற யாத்திராகமக் கோரிக்கை
  choice: எனக்குப் பணிசெய்யட்டும்
  alternative: என்னை வழிபடட்டும்
  rationale: இங்கு சேவை வழிபாட்டை உள்ளடக்குகிறது; ஆனால் ‘பணிசெய்’ என்பது எபிரெயச் சொல்லின் பரந்த பொருளையும் இறைமக்கள் யாருக்குச் சேவை செய்வார்கள் என்ற பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. இறைத்தூதர் அறிவிப்புச் சூத்திரம் முறையானதாக வைக்கப்பட்டுள்ளது; பார்வோனுக்கான ஒருமை நேரடி அழைப்பு மூலத்தின் கூர்மையைப் பாதுகாக்கிறது. உட்புற ஒற்றை மேற்கோள் யாவேயின் செய்தியை மோசே-ஆரோனின் அறிமுகவாக்கிலிருந்து தெளிவாகப் பிரிக்கிறது.
