source:
  edition: WLC
  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: ta
  text: எங்கள் கால்நடைகளுங்கூட எங்களோடு வரும்; ஒரு குளம்புகூட பின்னால் விடப்படாது. ஏனெனில், அவற்றிலிருந்துதான் எங்கள் இறைவனாகிய யாவேக்குப் பணிசெய்ய[a] நாங்கள் எடுத்துக்கொள்ள வேண்டும். அங்கே போய்ச் சேரும்வரை, எதைக் கொண்டு யாவேக்குப் பணிசெய்ய வேண்டும் என்பது எங்களுக்குத் தெரியாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பணிசெய்ய” என்பதை “வழிபட” என்றும் மொழிபெயர்க்கலாம். இங்கு இருமுறை வரும் எபிரேய வினை, ‘பணிசெய்’ அல்லது சூழலுக்கேற்ப ‘வழிபடு’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: எங்கள் கால்நடைகள்
  rationale: מִקְנֶה என்பது வளர்ப்பு விலங்குகளைத் தொகுப்பாகக் குறிக்கிறது. ‘கால்நடைகள்’ என்பது குறிப்பிட்ட ஓர் இனமாகச் சுருக்காமல் அதன் பரந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יֵלֵךְ עִמָּנוּ
  choice: எங்களோடு வரும்
  rationale: உடன்செல்லும் எதிர்கால இயக்கத்தை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: ஒரு குளம்புகூட பின்னால் விடப்படாது
  rationale: פַּרְסָה என்பதன் நேர்ப்பொருளான ‘குளம்பு’ பாதுகாக்கப்படுகிறது; மறுப்புடன் வரும் ஒருமை வலியுறுத்தலை ‘ஒரு...கூட’ வெளிப்படுத்துகிறது. சூழலில் மறைந்துள்ள பிரிவை ‘பின்னால்’ தெளிவாக்குகிறது.
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: ஏனெனில், அவற்றிலிருந்துதான் ... நாங்கள் எடுத்துக்கொள்ள வேண்டும்
  rationale: எபிரேயத்தில் எடுத்துக்கொள்ளப்படும் பொருள் வெளிப்படையாகச் சொல்லப்படவில்லை. தமிழிலும் அதைச் சேர்க்காமல், கால்நடைகளிலிருந்து தேவையானவற்றைத் தேர்ந்தெடுக்கும் சூழ்நிலைப் பொருள் நிலைநிறுத்தப்படுகிறது.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: எங்கள் இறைவனாகிய யாவேக்குப் பணிசெய்ய
  rationale: עבד என்பதன் ‘பணிசெய்/சேவைசெய்’ என்ற பரந்த பொருளையும் வசனத்தில் அதன் மறுமொழிவையும் காக்கிறது; வழிபாடு இச்சூழலில் உட்பொருளாக இருந்தாலும் சொல்லை அதற்குள் மட்டும் சுருக்கவில்லை.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע
  choice: எங்களுக்குத் தெரியாது
  rationale: பயண இலக்கை அடைவதற்கு முன் நிலவும் தற்போதைய அறியாமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: எதைக் கொண்டு யாவேக்குப் பணிசெய்ய வேண்டும்
  rationale: מַה என்பதை இச்சூழலில் கருவிப்பொருளாகக் கொண்டு, எந்த விலங்குகள் அல்லது காணிக்கைகள் தேவைப்படும் என்பது இன்னும் தெரியாது என்ற கருத்தை ‘எதைக் கொண்டு’ பாதுகாக்கிறது.
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: அங்கே போய்ச் சேரும்வரை
  rationale: בוא மற்றும் שָׁמָּה இணைந்து இலக்கை அடைவதைக் குறிப்பதால், ‘போய்ச் சேரும்வரை’ தெளிவான இயல்பான தமிழ்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
theological_decisions:
- issue: பலிசார்ந்த வழிபாட்டுச் சூழலில் עבד என்பதன் மொழிபெயர்ப்பு
  choice: பணிசெய்ய
  alternative: வழிபட
  rationale: இவ்வசனத்தில் பலிசார்ந்த வழிபாடு நேரடிச் சூழலாக இருந்தாலும், ‘பணிசெய்ய’ என்பது எபிரேய வினையின் பரந்த உடன்படிக்கைச் சார்ந்த பொருளையும் அதன் இருமுறைப் பயன்பாட்டையும் காக்கிறது. ‘வழிபட’ என்பது சாத்தியமான சூழ்நிலை மொழிபெயர்ப்பாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கால்நடைகளுங்கூட’, ‘ஒரு குளம்புகூட’ ஆகிய வடிவங்கள் எபிரேய வலியுறுத்தலை இயல்பாகக் காக்கின்றன; மூலத்தில் விடப்பட்டுள்ள எடுத்துக்கொள்ளப்படும் பொருள் தமிழிலும் நிரப்பப்படவில்லை.
