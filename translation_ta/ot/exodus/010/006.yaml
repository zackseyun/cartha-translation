base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: ta
  text: அவை உன் வீடுகளையும், உன் பணியாளர்கள் அனைவரின் வீடுகளையும், எகிப்து முழுவதிலுமுள்ள வீடுகளையும் நிரப்பும். உன் முன்னோர்களும் உன் முன்னோர்களின் முன்னோர்களும் பூமியில் இருந்த நாள்முதல் இந்நாள்வரை இப்படிப்பட்ட ஒன்றைக் கண்டதில்லை.” பின்பு மோசே திரும்பி, பார்வோனிடமிருந்து வெளியேறினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: அவை ... நிரப்பும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட வெட்டுக்கிளிகளே மறைமுக எழுவாய். இணைப்புடன் வந்த நிறைவுவினை, தொடரும் தீர்க்க அறிவிப்பில் எதிர்காலப் பொருளைக் கொண்டுள்ளது.
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: உன் வீடுகளையும், உன் பணியாளர்கள் அனைவரின் வீடுகளையும், எகிப்தியர் அனைவரின் வீடுகளையும்
  rationale: எபிரெய மூலத்திலுள்ள பன்மையையும், பார்வோனிடமிருந்து அவனுடைய பணியாளர்களுக்கும் எகிப்து முழுவதற்கும் விரியும் படிநிலையையும் காக்கிறது.
- source_word: עֲבָדֶיךָ
  choice: உன் பணியாளர்கள்
  rationale: அரசவைக் சூழலில் இச்சொல் பார்வோனின் ஊழியர்கள் அல்லது அதிகாரிகளைக் குறிக்கலாம். ‘பணியாளர்கள்’ சமூக நிலையை அளவுக்கு மீறிக் குறிப்பாக்காமல் மூலத்திற்கு நெருக்கமாக உள்ளது.
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: இப்படிப்பட்ட ஒன்றைக் கண்டதில்லை
  rationale: உறவுப்பெயரெச்சத் தொடர் முன் விவரிக்கப்பட்ட முன்னெப்போதும் இல்லாத வாதையைக் குறிக்கிறது; தமிழில் இயல்பாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: உன் மூதாதையர்களும் அவர்களுடைய மூதாதையர்களும்
  rationale: பல தலைமுறைகளை உள்ளடக்கும் எபிரெயத் தலைமுறைத் தொடரைத் தமிழில் இயல்பாகவும் அளவுக்கு குறுக்காமல்வும் வழங்குகிறது.
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: நிலத்தில் வாழத் தொடங்கிய நாள்முதல்
  rationale: அவர்கள் நிலத்தில் இருந்ததன் அல்லது வாழ்ந்ததன் தொடக்கத்தைக் குறிக்கும் காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאֲדָמָה
  choice: நிலம்
  rationale: இங்கு ‘நிலம்’, ‘பூமி’, ‘தரை’ ஆகிய பொருள்கள் சாத்தியம்; தலைமுறைகள் வாழ்ந்த இடத்தைக் குறிக்கும் சூழலில் ‘நிலம்’ இயல்பானது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: எபிரெய கால மரபுத்தொடரைச் சுருக்கமாகவும் கண்ணியமாகவும் வழங்குகிறது.
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: பின்பு மோசே திரும்பி, பார்வோனிடமிருந்து வெளியே சென்றார்
  rationale: தொடர்ச்சியான இரண்டு செயல்களையும் காக்கிறது. தமிழில் எழுவாய் தெளிவிற்காகச் சூழலிலிருந்து ‘மோசே’ சேர்க்கப்பட்டுள்ளது.
