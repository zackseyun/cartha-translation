id: EXO.10.25
reference: Exodus 10:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה גַּם אַתָּ֛ה תִּתֵּ֥ן בְּ/יָדֵ֖/נוּ זְבָחִ֣ים וְ/עֹל֑וֹת וְ/עָשִׂ֖ינוּ לַ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: ta
  text: ஆனால் மோசே, “நீங்களும் பலிகளையும் தகனபலிகளையும் எங்கள் கையில் கொடுக்க வேண்டும்; அவற்றை நாங்கள் எங்கள் இறைவனாகிய யாவேக்கு[a] செலுத்துவோம்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் இறைவனின் தனிப்பெயர் יהוה (YHWH) இடம்பெறுகிறது; அது இங்கே ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: divine_name
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் மோசே … என்றார்
  rationale: வாவ் தொடர்ச்சியாகக் கதையை முன்னெடுத்தாலும், முந்தைய வசனத்தில் பார்வோன் விதித்த கட்டுப்பாட்டுக்கு மோசே எதிராகப் பதிலளிப்பதால் சூழலின் முரண்பாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גַּם אַתָּה
  choice: நீங்களும்
  rationale: גַּם என்பதன் சேர்க்கை மற்றும் வலியுறுத்தல் பொருளையும், தனித்த சுட்டுப்பெயரான אַתָּה பார்வோனையே குறிப்பாக வலியுறுத்துவதையும் இந்தச் சொல் அமைப்பு இயல்பான தமிழில் தருகிறது.
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: எங்கள் கையில் கொடுக்க வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு’ என்பதையும் בְּיָדֵנוּ-இன் ‘எங்கள் கையில்’ என்ற தெளிவான உருவகத்தையும் காக்கிறது; சூழலில் மோசேயின் உறுதியான கோரிக்கையை ‘வேண்டும்’ வெளிப்படுத்துகிறது.
- source_word: זְבָחִים
  choice: பலிகள்
  rationale: அறுத்துப் படைக்கப்படும் பலிகள் உட்பட பொதுவான பலிப்படையல்களைக் குறிக்கும் சொல்லுக்கு தெளிவான, வழக்கிலுள்ள தமிழ் இணை.
- source_word: וְעֹלֹת
  choice: தகனபலிகள்
  rationale: முழுவதுமாக எரித்துப் படைக்கப்படும் עֹלָה வகைப் பலியைக் குறிக்கும் நிலைபெற்ற தமிழ் வேதாகமச் சொல்.
- source_word: וְעָשִׂינוּ
  choice: அவற்றை நாங்கள் … செலுத்துவோம்
  rationale: עשה என்பதன் நேரடிப் பொருள் ‘செய்வோம்’ என்றாலும், பலிச் சூழலில் பலியை நிறைவேற்றுதல் அல்லது செலுத்துதல் என்பதே கருத்து. ‘அவற்றை’ என்பது தமிழில் பொருளைத் தெளிவாக்கும் சூழல்சார் நிரப்பு.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: எங்கள் இறைவனாகிய யாவேக்கு
  rationale: לְ பலியின் பெறுநரைச் சுட்டுகிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது; אֱלֹהֵינוּ ‘எங்கள் இறைவன்’ என நேரடியாக வழங்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய உரையில் உள்ள நான்கெழுத்துத் தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல் பெயராகவே ஒலிபெயர்ப்பது மூல உரையின் வேறுபாட்டைக் காக்கிறது.
- issue: וְעָשִׂינוּ-இன் பலிசார் பொருள்
  choice: செலுத்துவோம்
  alternative: செய்வோம்
  rationale: ‘செய்வோம்’ என்பது வடிவரீதியாக நெருக்கமானது; ஆனால் இங்கு זְבָחִים மற்றும் עֹלֹת உடன் வரும் போது பலிகளைச் செலுத்துதல் என்ற சூழல்சார் பொருளை ‘செலுத்துவோம்’ தெளிவாகவும் சமயப் பிரிவுசார் விளக்கம் இன்றியும் தருகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடியதாயும், அரசனிடம் பேசும் சூழலுக்கேற்ற மரியாதையுடனும் ‘நீங்கள்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘எங்கள் கையில்’ என்ற மூல உருவகம் காக்கப்பட்டு, பலிசார் சொற்களில் கண்ணியமான வழக்கு பின்பற்றப்பட்டுள்ளது.
