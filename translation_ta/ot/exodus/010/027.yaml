source:
  edition: WLC
  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א אָבָ֖ה לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: ta
  text: ஆனால் யாவே பார்வோனின் இதயத்தைக் கடினப்படுத்தினார்[a]; அவன் அவர்களைப் போகவிட விரும்பவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பார்வோனின் இதயத்தை உறுதியாக்கினார்/வலுப்படுத்தினார்.’ எபிரெய வினைச்சொல் ‘வலுப்படுத்துதல்’ அல்லது ‘உறுதியாக்குதல்’ என்று பொருள்படலாம்; இச்சூழலில் ‘இதயம்’ என்பதுடன் வரும்போது ‘கடினப்படுத்துதல்’ என்ற உணர்வைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களைப் போகவிட மறுத்தான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: கடினப்படுத்தினார்
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘வலுப்படுத்துதல்’ அல்லது ‘உறுதியாக்குதல்.’ ஆனால் ‘இதயம்’ என்பதுடன் வரும் யாத்திராகமத்தின் தொடர்ச்சியான இந்தச் சூழலில், ஒருவரின் மனவுறுதியை இறுகச் செய்வது என்ற பொருளில் ‘கடினப்படுத்தினார்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயராகிய நான்கு மெய்யெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: לֵב
  choice: இதயம்
  rationale: எபிரெய மொழிப்பயன்பாட்டில் இது உள்ளார்ந்த எண்ணம், மனப்பாங்கு, சித்தம் ஆகியவற்றையும் உள்ளடக்குகிறது. ‘இதயம்’ என்ற மொழிபெயர்ப்பு வேதாகம உருவகத்தைப் பாதுகாக்கிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
- source_word: לֹא אָבָה
  choice: விரும்பவில்லை
  rationale: אָבָה என்பது விருப்பம் அல்லது சம்மதத்தைக் குறிக்கிறது. ‘விரும்பவில்லை’ என்பது அவனுடைய சித்தத்தையும் பொறுப்பையும் நேரடியாக வெளிப்படுத்துகிறது; ‘மறுத்துவிட்டான்’ என்பது சூழலுக்குப் பொருந்தினாலும் சற்றுக் கூடுதல் விளக்கமுடையது.
- source_word: לְשַׁלְּחָם
  choice: அவர்களைப் போகவிட
  rationale: இந்த யாத்திராகமச் சூழலில் שׁלח என்பது இஸ்ரவேலர்கள் புறப்பட்டுச் செல்ல அனுமதிப்பதைக் குறிக்கிறது. ‘போகவிட’ என்பது இயல்பான நவீனத் தமிழ்.
theological_decisions:
- issue: தேவன் இதயத்தைக் கடினப்படுத்துதலும் பார்வோனின் சொந்த விருப்பமும்
  choice: ‘யாவே பார்வோனின் இதயத்தைக் கடினப்படுத்தினார்; அவன் ... விரும்பவில்லை’ என்று இரு கூற்றுகளையும் நேரடியாக மொழிபெயர்த்தல்.
  alternative: ‘யாவே பார்வோனின் இதயத்தை உறுதியாக்கியதால், அவன் அவர்களை அனுப்ப மறுத்தான்.’
  rationale: எபிரெய உரை இதயத்தைக் கடினப்படுத்திய செயலை யாவேக்கு உரியதாகக் கூறி, அதன்பின் பார்வோனின் விருப்பமின்மையையும் தனியாகக் குறிப்பிடுகிறது. காரணவிளைவுச் சொல்லைச் சேர்க்காமல் மொழிபெயர்ப்பது தெய்வச் செயலுக்கும் மனிதச் சித்தத்துக்கும் இடையிலான உரையின் பதற்றத்தை அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இதயம்’ என்ற எபிரெய உருவகமும், யாவேயின் செயலும் பார்வோனின் விருப்பமின்மையும் தனித்தனி கூற்றுகளாக இருப்பதும் பாதுகாக்கப்பட்டுள்ளன.
