  text: וְ/כִסָּה֙ אֶת עֵ֣ין הָ/אָ֔רֶץ וְ/לֹ֥א יוּכַ֖ל לִ/רְאֹ֣ת אֶת הָ/אָ֑רֶץ וְ/אָכַ֣ל אֶת יֶ֣תֶר הַ/פְּלֵטָ֗ה הַ/נִּשְׁאֶ֤רֶת לָ/כֶם֙ מִן הַ/בָּרָ֔ד וְ/אָכַל֙ אֶת כָּל הָ/עֵ֔ץ הַ/צֹּמֵ֥חַ לָ/כֶ֖ם מִן הַ/שָּׂדֶֽה־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: ta
  text: அது நிலத்தின் மேற்பரப்பை[a] மூடிவிடும்; அதனால் நிலத்தைக் காண முடியாது. ஆலங்கட்டி மழையிலிருந்து தப்பி உங்களுக்கு எஞ்சியிருப்பவற்றையும்[b], வயலில் உங்களுக்காக வளர்கிற ஒவ்வொரு மரத்தையும் அது தின்றுவிடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “நிலத்தின் கண்”; இது கண்ணுக்குத் தெரியும் நிலப்பரப்பைக் குறிக்கும் எபிரெய மொழிவழக்கு.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆலங்கட்டி மழையிலிருந்து தப்பி, உங்களுக்கு மீதியாக இருக்கும் எஞ்சியவற்றையும்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: அது ... மூடிவிடும்
  rationale: כסה என்பதன் அடிப்படைப் பொருள் ‘மூடு, மறை’ என்பதாகும். வரவிருக்கும் வெட்டுக்கிளிப் படையை முன்னறிவிக்கும் சூழலுக்கேற்ப எதிர்கால வினை பயன்படுத்தப்பட்டுள்ளது; ஒருமை வடிவம் கூட்டுத்தொகையான வெட்டுக்கிளிப் படையைக் குறிக்கிறது.
- source_word: עֵין הָאָרֶץ
  choice: நிலத்தின் மேற்பரப்பை
  rationale: சொல்லுக்குச் சொல் ‘நிலத்தின் கண்’ என்ற எபிரெய மொழிவழக்கு, கண்ணுக்குத் தெரியும் நிலப்பரப்பைக் குறிக்கிறது. இயல்பான தமிழில் அதன் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת־הָאָרֶץ
  choice: அதனால் நிலத்தைக் காண முடியாது
  rationale: எபிரெயத்தில் உள்ள பொதுநிலை ஒருமைச் சொல்லாட்சியைத் தமிழின் இயல்பான ஆளற்ற வாக்கிய அமைப்பு வெளிப்படுத்துகிறது.
- source_word: וְאָכַל
  choice: அது தின்றுவிடும்
  rationale: אכל என்பது சாதாரணமாக ‘சாப்பிடு/தின்’ என்று பொருள்படும். வெட்டுக்கிளிகள் பயிரை உண்ணும் சூழலில் ‘தின்றுவிடும்’ இயல்பாகவும் அழிவின் முழுமையையும் உணர்த்துவதாகவும் உள்ளது; ‘அது’ என்ற ஒருமை கூட்டுத்தொகைச் சுட்டைத் தக்கவைக்கிறது.
- source_word: יֶתֶר הַפְּלֵטָה הַנִּשְׁאֶרֶת לָכֶם מִן־הַבָּרָד
  choice: ஆலங்கட்டி மழைக்குத் தப்பி உங்களுக்கு மீதியாக இருப்பதையும்
  rationale: அழிவிலிருந்து தப்பி எஞ்சியுள்ள பயிர்களை இச்சொற்றொடர் குறிக்கிறது. தமிழில் தேவையற்ற ‘தப்பியவர்கள்’ போன்ற உயிருள்ளோரைக் குறிக்கும் சொல்லைத் தவிர்த்து, வேளாண் விளைபொருளுக்குப் பொருந்தும் இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: כָּל־הָעֵץ הַצֹּמֵחַ לָכֶם מִן־הַשָּׂדֶה
  choice: வயலில் உங்களுக்காக வளர்கிற ஒவ்வொரு மரத்தையும்
  rationale: כל உடன் வரும் עץ என்பதன் பகிர்வுப் பொருளை ‘ஒவ்வொரு மரம்’ வெளிப்படுத்துகிறது. צמח என்பதற்கு ‘வளர்கிற’ என்றும், מן־השדה என்பதற்கு இயல்பான சூழல்பொருளில் ‘வயலில்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது; לָכֶם என்பதிலுள்ள பயன்/உடைமை நுணுக்கம் ‘உங்களுக்காக’ என்று தக்கவைக்கப்பட்டுள்ளது.
