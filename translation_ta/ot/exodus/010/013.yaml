  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יהוָ֗ה נִהַ֤ג ר֥וּחַ קָדִים֙ בָּ/אָ֔רֶץ כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה הַ/בֹּ֣קֶר הָיָ֔ה וְ/ר֨וּחַ֙ הַ/קָּדִ֔ים נָשָׂ֖א אֶת הָ/אַרְבֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: ta
  text: அப்போது மோசே தன் கோலை எகிப்து நாட்டின் மேல் நீட்டினார்; யாவே அந்த நாள் முழுவதும் அந்த இரவு முழுவதும் நாட்டின் மேல் கிழக்குக் காற்றை[a] வீசச் செய்தார். காலை வந்தபோது, கிழக்குக் காற்று வெட்டுக்கிளிகளைக் கொண்டுவந்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கிழக்கிலிருந்து வீசிய காற்றை.’
    reason: רוּחַ קָדִים என்பது வழக்கமாக ‘கிழக்குக் காற்று’ என்று மொழிபெயர்க்கப்படுகிறது; கிழக்கிலிருந்து வீசும் காற்று என்ற திசை விளக்கமும் சாத்தியமானது.
lexical_decisions:
- source_word: וַיֵּט
  choice: நீட்டினார்
  rationale: נטה என்பதன் அடிப்படைப் பொருள் ‘நீட்டு’ அல்லது ‘விரித்து நீட்டு’; கோலைக் குறிக்கும் இச்சூழலில் ‘நீட்டினார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מַטֵּהוּ
  choice: தன் கோலை
  rationale: מַטֶּה என்பது கோல் அல்லது தடி எனப் பொருள்படும். மோசே பயன்படுத்தும் அதிகாரக் கோலைக் குறிக்க நவீனத் தமிழில் ‘கோல்’ தெளிவான சொல்.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டின்மேல்
  rationale: கோலை நீட்டும் சைகையுடன் עַל என்பது ‘மேல்’ என்ற உறவை இயல்பாகக் குறிக்கிறது; אֶרֶץ மִצְרַיִם என்பது ‘எகிப்து நாடு’.
- source_word: נִהַג
  choice: வீசச் செய்தார்
  rationale: נהג என்பதற்கு ஓட்டுதல், நடத்துதல் என்ற செயற்படுத்தும் கருத்து உண்டு. காற்றுடன் தமிழில் ‘வீசச் செய்தார்’ என்பது யாவேயின் செயலூக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רוּחַ קָדִים
  choice: கிழக்குக் காற்றை
  rationale: இந்தச் சொற்றொடர் கிழக்கிலிருந்து வரும் காற்றைக் குறிக்கிறது. ‘கிழக்குக் காற்று’ சுருக்கமான இயல்பான தமிழ்; திசை சார்ந்த மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டின்மேல்
  rationale: காற்றின் இயக்கத்தை முன்னிட்டு ‘நாட்டின்மேல்’ என்பது எகிப்து முழுவதையும் கடந்து வீசிய காட்சியைத் தெளிவாகத் தருகிறது.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: அந்த நாள் முழுவதும் இரவு முழுவதும்
  rationale: எபிரெயத்தில் இரு காலப்பகுதிகளுடனும் வரும் כָּל என்ற முழுமைக் குறிப்பைத் தக்கவைத்தபடி இயல்பான தமிழில் கால நீடிப்பை வெளிப்படுத்துகிறது.
- source_word: הַבֹּקֶר הָיָה
  choice: காலையில்
  rationale: சொல்லுக்குச் சொல் ‘காலை ஆனது’ என்றாலும், நிகழ்வின் கால மாற்றத்தை நவீனத் தமிழில் ‘காலையில்’ தெளிவாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: வெட்டுக்கிளிகளைக் கொண்டுவந்திருந்தது
  rationale: נשא என்பது சுமத்தல், எடுத்துச் செல்லல் அல்லது கொண்டுவருதல் எனப் பொருள்படும். இரவு முழுவதும் வீசிய காற்றின் விளைவு காலையில் வெளிப்பட்டதை ‘கொண்டுவந்திருந்தது’ என்ற நிறைவுற்ற வடிவம் காட்டுகிறது.
- source_word: הָאַרְבֶּה
  choice: வெட்டுக்கிளிகளை
  rationale: ஒருமை வடிவிலுள்ள אַרְבֶּה இங்கு கூட்டுப் பொருளில் வெட்டுக்கிளிப் படையைச் சுட்டுகிறது; தமிழில் பன்மை இயல்பானது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை உடன்படிக்கையின் தனிப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அப்போது’ கதைத் தொடர்ச்சியைச் சுட்டுகிறது; ‘வீசச் செய்தார்’ இயல்பான தமிழ் வழக்கில் இறைச் செயலூக்கத்தை வெளிப்படுத்துகிறது. காலையில் ஏற்கெனவே நிறைவேறிய விளைவைக் காட்ட ‘கொண்டுவந்திருந்தது’ பயன்படுத்தப்பட்டுள்ளது.
