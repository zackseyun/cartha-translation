  source_fidelity: 'மூலத்தின் முக்கியக் கூறுகள் நன்றாகக் காக்கப்பட்டுள்ளன: மோசே கோலை நீட்டுதல், யாவே கிழக்குக் காற்றைச் செயல்படுத்துதல், நாள்-இரவு முழுதுமான கால அளவு, காலையில் வெட்டுக்கிளிகள் வருதல் ஆகியவை துல்லியமாக உள்ளன. இருப்பினும், காலக் குறிப்பில் இரண்டாவது ‘முழுவதும்’ உடன் ‘அந்த இரவு’ என்பதையும் சேர்ப்பது எபிரெயத்தின் குறிப்பிட்ட இரவைக் தெளிவாகப் பிரதிபலிக்கும்.'
  naturalness: ‘நாட்டின் மேல்’ என்பதைப் பிரித்து எழுதுவதும், ‘அந்த நாள் முழுவதும் அந்த இரவு முழுவதும்’ என இணைப்பதும் நவீனத் தரத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்கும். ‘காலையில்’ என்பதற்குப் பதில் ‘காலை வந்தபோது’ என்பது הַבֹּקֶר הָיָה என்ற காலமாற்றத்தைச் சிறப்பாக வெளிப்படுத்துகிறது.
  terminology: ‘யாவே’, ‘கோல்’, ‘கிழக்குக் காற்று’, ‘வெட்டுக்கிளிகள்’ ஆகியவை பொருத்தமானவை. அடிக்குறிப்பில் மாற்று வாசகத்தை ‘கிழக்கிலிருந்து வீசிய காற்று’ என இயல்பாக அமைக்கலாம்; இது காற்றின் தோற்றத் திசையைத் தெளிவுபடுத்துகிறது.
