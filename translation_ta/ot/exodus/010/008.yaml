base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: ta
  text: அப்போது மோசேயும் ஆரோனும் பார்வோனிடம் திரும்ப அழைத்துவரப்பட்டார்கள். அவன் அவர்களிடம், “நீங்கள் போய், உங்கள் கடவுளாகிய யாவேவுக்குப் பணி செய்யுங்கள். போகிறவர்கள் யார் யார்?[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் சொல்லுக்குச் சொல்: “யார், யார் போகிறவர்கள்?” இது யார் யார் போவார்கள் என்பதைத் துல்லியமாகக் குறிப்பிடக் கேட்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: திரும்ப அழைத்துவரப்பட்டார்கள்
  rationale: שׁוב என்பதன் ஹொஃபால் வடிவம், மோசேயும் ஆரோனும் வேறொருவரால் மீண்டும் பார்வோனிடம் கொண்டுவரப்பட்டார்கள் என்ற காரணப்பாட்டு-செயப்பாட்டு பொருளைக் காட்டுகிறது.
- source_word: אֶל־פַּרְעֹה
  choice: பார்வோனிடம்
  rationale: אֶל இங்கு பார்வோனை நோக்கிய இயக்கத்தைக் குறிக்கிறது; நவீன தமிழில் ‘பார்வோனிடம்’ இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: לְכוּ עִבְדוּ
  choice: நீங்கள் போய் … பணிசெய்யுங்கள்
  rationale: இரண்டு பன்மை ஏவல் வினைகளின் தொடரை இயல்பான தமிழில் தருகிறது. עבד என்பதன் ‘சேவை செய்தல்’ என்ற விரிவான பொருளைப் பேணி, அதை வழிபாட்டுக்கு மட்டும் குறுக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மை உடைமைப் பின்னொட்டைத் தெளிவாகக் காட்டி, ‘யாவே’ என்பவரே அவர்களுடைய கடவுள் என்ற இணைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: מִי וָמִי הַהֹלְכִים
  choice: போகிறவர்கள் யார் யார்?
  rationale: מִי וָמִי என்ற இரட்டிப்பையும், הַהֹלְכִים என்ற பெயர்ச்சொல் தன்மையுடைய வினையெச்சத்தின் ‘போகிறவர்கள்’ என்ற பொருளையும் பேணுகிறது. ‘யார் யார்?’ என்பது தமிழிலும் குறிப்பிட்ட அனைவரின் அடையாளத்தை விசாரிக்கும் இயல்பான வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, உரையின் தனிப்பெயர் தன்மையைப் பேணுகிறது.
translation_notes:
  register: நடை நவீன நிலையான தமிழிலும், எளிதில் புரியும் கண்ணியமான உரைநடையிலும் உள்ளது. ‘பணிசெய்யுங்கள்’ என்பது இறைவனுக்குச் செய்யும் சேவையைச் சுட்டினாலும், பொருளை சடங்கு வழிபாட்டுக்கு மட்டும் குறுக்காது. ‘யார் யார்?’ என்ற இயல்பான தமிழ் இரட்டிப்பு மூலத்தின் வலியுறுத்தலையும் அதன் திறந்த கேள்வித் தன்மையையும் பேணுகிறது.
