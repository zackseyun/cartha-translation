  text: וַ/יֵּצֵ֖א מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/018.yaml
  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: ta
  text: மோசே பார்வோனிடமிருந்து வெளியேறி, யாவேவிடம் மன்றாடினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவேவிடம் உருக்கமாக வேண்டிக்கொண்டார்’ அல்லது ‘யாவேவிடம் தீவிரமாக விண்ணப்பித்தார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ஆழ்ந்த மன்றாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்று
  rationale: יצא என்பதன் Qal தொடர்வினை வடிவம் வெளியே செல்லுதல் அல்லது ஒருவரிடமிருந்து புறப்படுதல் என்பதைக் குறிக்கிறது; இங்கு தொடரும் கதைநிகழ்வையும் உடல்சார்ந்த நகர்வையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעִם
  choice: இடமிருந்து
  rationale: מֵעִם என்பது ஒருவருடன் இருந்த நிலையிலிருந்து விலகுவதைச் சுட்டுகிறது; ‘பார்வோனிடமிருந்து’ என்பது அவரது முன்னிலையைவிட்டு மோசே புறப்பட்ட பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: וַיֶּעְתַּר
  choice: மன்றாடினார்
  rationale: עתר இங்கு தேவனை நோக்கிய ஆழ்ந்த, earnest வேண்டுதலைக் குறிக்கிறது. ‘மன்றாடினார்’ அவசரமும் தீவிரமும் கொண்ட விண்ணப்பத்தை நவீன, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל
  choice: இடம்
  rationale: אֶל வேண்டுதல் செலுத்தப்படும் திசையையும் பெறுநரையும் குறிக்கிறது; ‘யாவேவிடம்’ என்பது தமிழில் இயல்பான இணைப்பு.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-வை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பொதுவான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் நான்கெழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனைப் பட்டமாக மாற்றாமல் தனிப்பெயராக வைத்திருப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: עתר என்பதில் உள்ள வேண்டுதலின் தீவிரம்
  choice: மன்றாடினார்
  alternative: வேண்டிக்கொண்டார்; உருக்கமாக ஜெபித்தார்
  rationale: இவ்வினைச்சொல் சாதாரண வேண்டுதலைவிட ஆழ்ந்த விண்ணப்பத்தை உணர்த்தலாம். ‘மன்றாடினார்’ அந்தத் தீவிரத்தைக் காக்கிறது; அதனை குறிப்பிட்ட ஜெபமுறை அல்லது கோட்பாட்டுடன் கட்டுப்படுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதுமான நடை. ‘அதனால்’ முந்தைய வசனத்தின் வேண்டுகோளுக்கான மோசேயின் பதிலை இணைக்கிறது; ‘புறப்பட்டுச் சென்று’ கதைநகர்வைத் தெளிவாக்குகிறது.
