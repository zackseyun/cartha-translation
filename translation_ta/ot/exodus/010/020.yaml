  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: ta
  text: ஆனால் யாவே பார்வோனின் இதயத்தைக் கடினப்படுத்தினார்[a]; அவன் இஸ்ரவேல் மக்களை[b] போகவிடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பார்வோனின் இதயத்தை உறுதியாக்கினார்’ அல்லது ‘பார்வோனின் இதயத்தை வலுப்படுத்தினார்.’ எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வலுவாக/உறுதியாக ஆக்குதல்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, ‘இஸ்ரவேலின் மகன்களை’; மரபுவழியாக, ‘இஸ்ரவேலின் பிள்ளைகளை.’ இங்கு இச்சொற்றொடர் இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: கடினமாக்கினார்
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘வலுவாக்குதல்/உறுதியாக்குதல்.’ ஆனால் பார்வோனின் உள்ளார்ந்த எதிர்ப்பு உறுதிப்படுவதைச் சுட்டும் யாத்திராகமத்தின் தொடர்ச்சியான சூழலில் ‘இதயத்தைக் கடினமாக்கினார்’ என்பது இயல்பாகவும் பொருள்தெளிவுடனும் அமைகிறது. அடிப்படைச் சொல்லர்த்தம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் அதன் உச்சரிப்பை அணுகும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לֵב
  choice: இதயம்
  rationale: לֵב என்பது உணர்ச்சி மட்டுமல்லாமல் மனவுறுதி, விருப்பம், உள்ளார்ந்த நிலை ஆகியவற்றையும் உள்ளடக்கும் எபிரெய உருவகம். ‘இதயம்’ அந்த உருவகத்தைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: פַּרְעֹה
  choice: பார்வோனின்
  rationale: எகிப்திய அரசனுக்கான பட்டப்பெயரின் வழக்கமான தமிழ் வடிவம்; உடைமைத் தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: שִׁלַּח
  choice: போகவிடவில்லை
  rationale: שלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்புதல்.’ இஸ்ரவேல் மக்களின் விடுதலைச் சூழலில் ‘போகவிடவில்லை’ என்பது செயப்பொருளையும் பார்வோனின் மறுப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு நெருக்கமான வடிவம் ‘இஸ்ரவேலின் மகன்கள்.’ இங்கு முழு இனக்கூட்டத்தையும் குறிக்கும் வழக்குச் சொற்றொடராக இருப்பதால், நவீன தமிழில் பாலினத் தவறுணர்வு ஏற்படாத ‘இஸ்ரவேல் மக்கள்’ தேர்ந்தெடுக்கப்படுகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: பார்வோனின் இதயம் கடினமாவதில் தேவனுடைய செயல்
  choice: யாவே பார்வோனின் இதயத்தைக் கடினமாக்கினார்
  alternative: யாவே பார்வோனின் இதயத்தை உறுதியாக்கினார்
  rationale: எபிரெய வாக்கியம் இந்தச் செயலை யாவேவுக்கே நேரடியாகக் கூறுகிறது. அதை மென்மைப்படுத்தாமலும், மனிதப் பொறுப்பு அல்லது முன்நியமனம் குறித்த மேலதிக கோட்பாட்டு விளக்கத்தை வசனத்துக்குள் சேர்க்காமலும், மூலத்தின் இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: இரு வாக்கியங்களுக்கிடையேயான தொடர்பு
  choice: அதனால் அவன் ... போகவிடவில்லை
  alternative: அவன் ... போகவிடவில்லை
  rationale: וְלֹא என்பதிலுள்ள இணைப்பு, இந்தச் சூழலில் முந்தைய செயலின் விளைவாக பார்வோன் விட மறுத்ததை இயல்பான தமிழில் காட்டுகிறது. அதேவேளை பார்வோனே செயல்படும் எழுவாய் என்பதும் தெளிவாக வைக்கப்படுகிறது.
translation_notes:
  register: நடை நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் செந்தமிழ் சார்ந்த உரைநடை. ‘இதயம்’ என்ற வேதாகம உருவகமும் யாவே என்ற தனிப்பெயரும் பாதுகாக்கப்பட்டுள்ளன; ‘இஸ்ரவேல் மக்கள்’ என்பது தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது.
