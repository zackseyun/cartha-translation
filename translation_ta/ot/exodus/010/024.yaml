  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה אֶל מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת יְהוָ֔ה רַ֛ק צֹאנְ/כֶ֥ם וּ/בְקַרְ/כֶ֖ם יֻצָּ֑ג גַּֽם טַפְּ/כֶ֖ם יֵלֵ֥ךְ עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: ta
  text: அப்போது பார்வோன் மோசேயை அழைத்து, “நீங்கள் போய் யாவேவுக்குப் பணிசெய்யுங்கள். உங்கள் ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும் மட்டும் பின்னால் விடப்படட்டும்[a]. உங்கள் குழந்தைகள்கூட[b] உங்களோடு செல்லலாம்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “பின்னால் இருக்கட்டும்.”'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு வகையில்: “உங்கள் சிறுபிள்ளைகள்கூட.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: இந்தக் கதைச்சூழலில் קרא என்பது ஒருவரை அழைப்பதைக் குறிக்கிறது. ‘அழைத்து’ என்பது அதிகாரப்பூர்வமாக வரவழைத்தான் என்ற கூடுதல் நுணுக்கத்தைத் திணிக்காமல் இயல்பான தமிழில் பொருளைத் தருகிறது.
- source_word: לְכוּ
  choice: நீங்கள் போய்
  rationale: பன்மை ஏவல் வடிவத்தைத் தமிழில் தெளிவாகக் காட்டுகிறது; அதைத் தொடர்ந்து வரும் பணிசெய்தலோடு ‘போய்’ இயல்பாக இணைகிறது.
- source_word: עִבְדוּ אֶת־יְהוָה
  choice: யாவேவுக்குப் பணிசெய்யுங்கள்
  rationale: עבד என்பது இங்கு கடவுளுக்குச் செய்யும் பணி மற்றும் வழிபாடு ஆகிய இரண்டின் பரப்பையும் கொண்டிருக்கலாம். ‘பணிசெய்யுங்கள்’ என்பது நேரடியான சொல்லிணையைப் பாதுகாத்து, பார்வோனுக்குப் பணிசெய்வதற்கு மாறாக யாவேவுக்குப் பணிசெய்வது என்ற யாத்திராகமத்தின் தொடர்கருத்தையும் தக்கவைக்கிறது.
- source_word: רַק
  choice: மட்டும்
  rationale: பார்வோன் வழங்கும் அனுமதிக்கான கட்டுப்பாட்டை இயல்பான தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: உங்கள் ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும்
  rationale: צֹאן சிறு கால்நடைகளையும், குறிப்பாக ஆடுகளையும் வெள்ளாடுகளையும்; בקר பெரிய கால்நடைகளையும், குறிப்பாக மாடுகளையும் குறிக்கும் கூட்டுப்பெயர்கள். இந்தத் தமிழ் இணை அவற்றின் வேறுபாட்டை எளிதில் புரியுமாறு காட்டுகிறது.
- source_word: יֻצָּג
  choice: இங்கேயே விடப்படட்டும்
  rationale: יצג என்பதன் ஹோபால் வடிவம் அவை அங்கேயே வைக்கப்படுதல் அல்லது விட்டுச்செல்லப்படுதல் என்ற செயப்பாட்டு பொருளைக் கொண்டுள்ளது. ‘விடப்படட்டும்’ அந்தச் செயப்பாட்டு நுணுக்கத்தைப் பாதுகாக்கிறது; ‘இங்கேயே’ சூழலில் உள்ள இடப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גַּם
  choice: கூட
  rationale: பெரியவர்களுடன் குழந்தைகளையும் செல்ல அனுமதிக்கும் வலியுறுத்தப்பட்ட சேர்க்கையை ‘கூட’ இயல்பாகக் காட்டுகிறது.
- source_word: טַפְּכֶם
  choice: உங்கள் குழந்தைகள்
  rationale: טַף வீட்டாரின் சிறு பிள்ளைகள் அல்லது சார்ந்திருப்போரைக் குறிக்கலாம். பொதுவான நவீன தமிழில் ‘குழந்தைகள்’ தெளிவானது; ‘சிறுபிள்ளைகள்’ என்ற நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יֵלֵךְ עִמָּכֶם
  choice: உங்களோடு போகலாம்
  rationale: பார்வோனின் அனுமதியாக அமைந்துள்ள சூழலைத் தமிழின் இயல்பான அனுமதி வடிவில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் ‘Yahweh’ உச்சரிப்பை நவீன தமிழில் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- issue: עבד என்பதில் பணி மற்றும் வழிபாடு ஆகிய பொருள்கள்
  choice: பணிசெய்யுங்கள்
  alternative: வழிபடுங்கள்
  rationale: இரு பொருள்களும் சூழலுக்குப் பொருந்துகின்றன. ‘பணிசெய்யுங்கள்’ மூல வினையின் பரந்த பொருளையும், இஸ்ரவேல் பார்வோனுக்குப் பதிலாக யாவேவுக்குப் பணிசெய்வது என்ற கதையின் பதற்றத்தையும் பாதுகாக்கிறது; வழிபாட்டுப் பொருளை மறுப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. பார்வோனின் கட்டுப்பாடும் தளர்வும் தெளிவாக இருக்கும்படி நேரடி பேச்சு இயல்பாக அமைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரிய சொற்றொடர்களுக்குப் பின்பு முதன்மை உரையில் இடம்பெற்றுள்ளன.
