source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה כֵּ֣ן דִּבַּ֑רְתָּ לֹא אֹסִ֥ף ע֖וֹד רְא֥וֹת פָּנֶֽי/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/029.yaml
  text: And Moses said[a], “As you have spoken[b], I will not again see your face.”
translation:
  language: ta
  text: மோசே, “நீர் சொன்னது சரியே[a]; இனி ஒருபோதும் நான் உமது முகத்தைப் பார்க்கமாட்டேன்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் சொன்னபடியே”; “நீர் சொன்னபடியே ஆகட்டும்.”
    reason: alternative_reading
  - marker: b
    text: எபிரேய மொழியில் சொல்லுக்குச் சொல், “உமது முகத்தைப் பார்ப்பதை இனி மீண்டும் சேர்க்கமாட்டேன்”; அதாவது, “உமது முகத்தை இனி ஒருபோதும் பார்க்கமாட்டேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: அதற்கு மோசே ... என்றார்
  rationale: வாவ் தொடர்கதை வடிவம் இங்கு பார்வோனின் முந்தைய கூற்றுக்கு மோசே அளிக்கும் நேரடியான பதிலை அறிமுகப்படுத்துகிறது; ‘அதற்கு’ என்பது தமிழ் உரையோட்டத்தில் அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כֵּן דִּבַּרְתָּ
  choice: நீர் சொன்னபடியே ஆகட்டும்
  rationale: כֵּן என்பது இங்கு முந்தைய கூற்றை ஏற்றுக்கொள்ளும் பொருளில் வருகிறது. இந்தத் தமிழ் வடிவம் ‘நீர் சொன்னபடியே’ என்பதையும் ‘அவ்வாறே ஆகட்டும்’ என்ற ஒப்புதலையும் இயல்பாக இணைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא אֹסִף עוֹד
  choice: இனி ஒருபோதும் ... மாட்டேன்
  rationale: எதிர்மறையுடன் வரும் יסף மற்றும் עוֹד ஆகியவற்றின் சேர்க்கை, அந்தச் செயல் மீண்டும் நிகழாது என்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர். ‘இனி ஒருபோதும்’ என்பது அதன் உறுதியான எதிர்காலப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: רְאוֹת פָּנֶיךָ
  choice: உமது முகத்தைப் பார்க்க
  rationale: ‘உமது முகத்தைப் பார்க்க’ என்பது எபிரேயச் சொல்லாட்சியின் concrete வடிவத்தைப் பாதுகாக்கிறது; சூழலில் இது நேரில் சந்திப்பதையும் குறிக்கலாம்.
theological_decisions:
- issue: மோசே பின்னர் பார்வோனை எந்த விதத்திலும் சந்திக்கவே மாட்டார் என்று வசனம் கூறுகிறதா, அல்லது அவன் முகத்தை மீண்டும் பார்க்கமாட்டார் என்ற நேரடி அறிவிப்பை மட்டுமே கூறுகிறதா?
  choice: ‘உமது முகத்தைப் பார்க்கமாட்டேன்’ என்ற மூல உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘உம்மை இனி நேரில் சந்திக்கமாட்டேன்’
  rationale: மூலத்தில் ‘முகத்தைப் பார்க்க’ என்ற சொற்றொடரே உள்ளது. அடுத்தடுத்த நிகழ்வுகளுடன் இதை எவ்வாறு ஒத்திசைப்பது என்பதை மொழிபெயர்ப்பில் முன்கூட்டியே தீர்மானிக்காமல், மூலத்தின் பதற்றத்தையும் சொல்லாட்சியையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசரிடம் பேசும் சூழலுக்கேற்ற மரியாதை ஒருமை (‘நீர்’, ‘உமது’) பயன்படுத்தப்பட்டுள்ளது. மொழிநடை கண்ணியமானதும் சாதாரண வாசகர்களுக்குத் தெளிவானதுமாக வைக்கப்பட்டுள்ளது.
