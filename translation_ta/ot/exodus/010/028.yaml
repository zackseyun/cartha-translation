language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ פַרְעֹ֖ה לֵ֣ךְ מֵ/עָלָ֑/י הִשָּׁ֣מֶר לְ/ךָ֗ אֶל תֹּ֨סֶף֙ רְא֣וֹת פָּנַ֔/י כִּ֗י בְּ/י֛וֹם רְאֹתְ/ךָ֥ פָנַ֖/י תָּמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: ta
  text: அப்போது பார்வோன் அவனிடம், “என்னைவிட்டு அகன்று போ! எச்சரிக்கையாக இரு; இனி என் முகத்தைப் பார்க்காதே[a]. ஏனெனில், நீ என் முகத்தைப் பார்க்கும் நாளில்[b] சாவாய்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “என் முகத்தைப் பார்ப்பதை இனியும் சேர்க்காதே.” இதன் இயல்பான பொருள், “இனி என் முகத்தைப் பார்க்காதே” அல்லது “மறுபடியும் என் முகத்தைப் பார்க்காதே.”
    reason: lexical_alternative
  - marker: b
    text: “என் முகம்” என்பதை “என் முன்னிலை” என்றும் புரிந்துகொள்ளலாம்; ஆனால் வலியுறுத்துவதற்காக எபிரெய உரை “முகம்” என்ற சொல்லை மீண்டும் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: அப்போது பார்வோன் அவனிடம் ... என்றான்
  rationale: வாவ் தொடர்கதை வரிசையை முன்னெடுப்பதால் ‘அப்போது’ இயல்பான தமிழில் அதை வெளிப்படுத்துகிறது; לוֹ என்பதிலுள்ள ஆண்பால் ஒருமைச் சுட்டுப்பெயர் ‘அவனிடம்’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: לֵךְ מֵעָלַי
  choice: என்னைவிட்டு அகன்று போ
  rationale: கட்டளையின் கடுமையான விரட்டும் தொனியை இயல்பான நவீனத் தமிழில் தருகிறது; ‘என் முன்னிலையிலிருந்து போ’ என்பதைக் காட்டிலும் மூலத்தின் நேரடித் தன்மையைப் பேணுகிறது.
- source_word: הִשָּׁמֶר לְךָ
  choice: எச்சரிக்கையாக இரு
  rationale: நிபால் கட்டளையும் தன்நலத் தாதுவும் சேர்ந்து தரும் நேரடியான எச்சரிக்கை மற்றும் அச்சுறுத்தல் தொனியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: இனி என் முகத்தைப் பார்க்காதே
  rationale: ‘பார்ப்பதைச் சேர்க்காதே/தொடராதே’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான தமிழ்ப் பொருள் ‘இனி ... பார்க்காதே’; ‘முகம்’ என்ற உருவகம் தொடர்ச்சியாக வைக்கப்படுகிறது.
- source_word: בְּיוֹם רְאֹתְךָ פָנַי
  choice: நீ என் முகத்தைப் பார்க்கும் நாளில்
  rationale: בְּיוֹם என்பதன் ‘நாளில்’ என்ற காலவெளிப்பாட்டையும், மீண்டும் வரும் ‘என் முகம்’ என்ற சொற்றொடரின் வலியுறுத்தலையும் பாதுகாக்கிறது.
- source_word: תָּמוּת
  choice: சாவாய்
  rationale: பார்வோனின் நேரடியான மரண அச்சுறுத்தலைச் சுருக்கமாகவும் வலிமையாகவும் நவீனத் தமிழில் தருகிறது; மூலத்தில் இல்லாத கூடுதல் வலியுறுத்தல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: פָּנַי என்பதைக் ‘முகம்’ அல்லது ‘முன்னிலை’ என மொழிபெயர்ப்பது
  choice: என் முகம்
  alternative: என் முன்னிலை
  rationale: இங்கு ‘முகம்’ என்பது முன்னிலையைக் குறிக்கக்கூடும்; ஆயினும் ஒரே வசனத்தில் அது இருமுறை வருவதால், எபிரெய உருவகத்தையும் சொல்லாட்சி வலியுறுத்தலையும் முதன்மை உரையில் பாதுகாப்பது பொருத்தமானது. மாற்றுப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் அரசனின் கடுமையான அச்சுறுத்தலுக்கு ஏற்ற கண்ணியமும் நேரடித் தன்மையும் கொண்ட நடை பயன்படுத்தப்பட்டது. ‘இனி ... பார்க்காதே’ என்பது எபிரெய மரபுத்தொடரை இயல்பாகத் தருகிறது; ‘முகம்’ என்ற மூல உருவகம் இரு இடங்களிலும் பாதுகாக்கப்பட்டது.
