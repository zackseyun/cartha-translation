  rationale: יָד என்பதன் வழக்கமான பொருள் ‘கை’; எழுவாயாகிய மோசேயையே சுட்டுவதால் தமிழில் ‘தன் கையை’ என்பது இயல்பானது.
- source_word: עַל הַשָּׁמָיִם
  choice: வானத்தை நோக்கி
  rationale: கையை நீட்டும் இச்சூழலில் עַל திசையைக் குறிக்கிறது. שָׁמַיִם என்பதிலுள்ள ‘வானம்/பரலோகம்’ என்ற பொருள் நெகிழ்வை ‘வானம்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: וַיְהִי
  choice: நிலவியது
  rationale: இருள் ஏற்பட்டுத் தொடர்ந்து இருந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: அடர்ந்த இருள்
  rationale: ‘இருள்’ என்பதோடு கடுமையான இருள் அல்லது காரிருளைக் குறிக்கும் இரண்டாவது சொல் இணைந்து தீவிரத்தை வலியுறுத்துகிறது; ‘அடர்ந்த இருள்’ அந்த வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாடு முழுவதிலும்
  rationale: முழு எகிப்து தேசத்திலும் இருள் இருந்தது என்பதைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாட்களுக்கு
  rationale: கால நீட்சியை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
