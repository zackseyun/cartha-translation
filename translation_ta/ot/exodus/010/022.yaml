  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: ta
  text: அப்போது மோசே தன் கையை வானத்தை நோக்கி[b] நீட்டினார். எகிப்து நாடு முழுவதிலும் மூன்று நாட்களுக்கு அடர்ந்த இருள்[a] நிலவியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காரிருள்” அல்லது “ஆழ்ந்த இருள்.” எபிரெயச் சொற்றொடர் ‘இருள்’ என்பதோடு கடுமையான இருளைக் குறிக்கும் இன்னொரு சொல்லையும் இணைத்து அதன் தீவிரத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பரலோகத்தை நோக்கி.” எபிரெயச் சொல் சூழலுக்கு ஏற்ப ‘வானம்’ அல்லது ‘பரலோகம்/வானங்கள்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
