  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: ta
  text: அவர்கள் ஒருவரை ஒருவர் காணவில்லை[a]; மூன்று நாட்களுக்கு யாரும் தங்கள் இடத்திலிருந்து எழுந்திருக்கவில்லை. ஆனால் இஸ்ரவேல் மக்களுக்கோ[b] அவர்களுடைய குடியிருப்புகளில் வெளிச்சம் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “ஒருவன் தன் சகோதரனைக் காணவில்லை.” இங்கு இச்சொற்றொடர் பரஸ்பரப் பொருளில், “ஒருவரை ஒருவர் காணவில்லை” என்று பொருள்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்சொல்லாக, “இஸ்ரவேலின் மகன்கள்.” இது இங்கு இஸ்ரவேல் மக்களனைவரையும் குறிக்கும் சமூகப் பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת אָחִיו
  choice: ஒருவரை ஒருவர் அவர்கள் காணவில்லை
  rationale: אִישׁ אֶת־אָחִיו என்பது சொற்சொல்லாக ‘ஒருவன் தன் சகோதரனை’ என்றிருந்தாலும், இங்கு பரஸ்பரப் பொருளில் வருகிறது. ‘ஒருவரை ஒருவர்’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தருகிறது; ‘காண முடியவில்லை’ என்று திறனை வெளிப்படையாகச் சேர்க்காமல், எபிரெய வாக்கியத்தின் நேரடியான ‘காணவில்லை’ என்பதைக் காக்கிறது.
- source_word: וְלֹא קָמוּ אִישׁ מִתַּחְתָּיו
  choice: யாரும் தங்கள் இடத்திலிருந்து எழுந்திருக்கவில்லை
  rationale: אִישׁ இங்கு பகிர்ந்தளிக்கும் பொதுப்பொருளில் இருப்பதால் ‘யாரும்’ என மொழிபெயர்க்கப்பட்டது. מִתַּחְתָּיו என்பதன் சொற்சொல் வடிவம் ‘தனக்குக் கீழிருந்து’; சூழலில் அது ஒருவர் இருந்த இடத்தைக் குறிக்கும் மரபுத்தொடர். ‘தங்கள்’ என்பது தமிழில் இயல்பான பொதுமை ஒருமைச் சுட்டல்.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாட்களுக்கு
  rationale: காலநீட்சியைத் தெளிவாகவும் இயல்பாகவும் காட்டும் தமிழ் வடிவம்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொற்சொல்லாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது வயதையோ ஆண்களை மட்டும் குறிக்கவோ அல்லாமல் உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் இன-சமூகப் பெயர். ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் உள்ளடக்கமானதும் தெளிவானதும் ஆகும்.
- source_word: הָיָה אוֹר
  choice: வெளிச்சம் இருந்தது
  rationale: எபிரெய இருப்புவாக்கியத்தை நேரடியாகப் பிரதிபலிக்கிறது; இருளுக்கு எதிரான வெளிச்சத்தின் இருப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּמֹשְׁבֹתָם
  choice: அவர்களுடைய குடியிருப்புகளில்
  rationale: מוֹשָׁב என்பது வாழும் இடம் அல்லது குடியிருப்பைக் குறிக்கலாம். பன்மை வடிவத்தையும் இந்தச் சூழலின் இடவியல் எதிர்மறையையும் ‘குடியிருப்புகளில்’ நன்கு காக்கிறது.
