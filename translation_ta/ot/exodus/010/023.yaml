translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் இரண்டு கூறுகளில் எபிரெயத்தின் பொதுமை மற்றும் பரஸ்பரத் தன்மை இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளன. ‘எழுந்திருக்கவில்லை’ என்பது இங்கு ‘தங்கள் இடத்தைவிட்டு எழவில்லை’ என்ற பொருளில் வருகிறது; உறக்கத்திலிருந்து விழித்தெழவில்லை என்ற பொருளைத் தவிர்க்க ‘தங்கள் இடத்திலிருந்து’ சேர்ந்து நிற்கிறது.
