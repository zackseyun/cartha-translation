  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: ta
  text: அப்போது பார்வோனின் அரண்மனைப் பணியாளர்கள் அவனிடம், “இந்த மனிதன் இன்னும் எவ்வளவு காலம் நமக்குக் கண்ணியாக இருப்பான்?[a] அந்த ஆண்களை[b] அனுப்பிவிடுங்கள்; அவர்கள் தங்கள் கடவுளாகிய யாவேவைச் சேவிக்கட்டும்.[c] எகிப்து பாழாகிவிட்டது என்பதை நீங்கள் இன்னும் அறியவில்லையா?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த மனிதன்” என்பதற்கு “இவன்” அல்லது வெறுமனே “இது” என்றும் மொழிபெயர்க்கலாம்; சூழலில் இது மோசேயைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் குறிப்பாக “அந்த ஆண்கள்”; சில மொழிபெயர்ப்புகள் இதை “அந்த மக்கள்” என்று பொதுமைப்படுத்துகின்றன.
    reason: lexical_alternative
  - marker: c
    text: “சேவிக்கட்டும்” என்பதற்கு “வழிபடட்டும்” என்றும் மொழிபெயர்க்கலாம்; கடவுளை நோக்கிய எபிரெய வினை சேவை மற்றும் வழிபாடு ஆகிய இரண்டையும் உள்ளடக்கலாம். “யாவே” என்பது YHWH என்ற தெய்வீகப் பெயரின் ஒலிபெயர்ப்பு; மரபாக இது “கர்த்தர்” என்று வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: பார்வோனின் அரண்மனைச் சேவகர்கள் அல்லது அலுவலர்களைக் குறிக்கிறது. ‘பணியாளர்கள்’ என்பது அடிப்படைப் பொருளைக் காத்து, நவீனத் தமிழில் இயல்பாக உள்ளது.
- source_word: עַד מָתַי
  choice: இன்னும் எவ்வளவு காலம்
  rationale: கண்டனத் தொனியுடைய கால வினாவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: זֶה
  choice: இவன்
  rationale: சூழலில் மோசேயைக் குறிக்கும் சுட்டுப்பெயர். ஆண்பால் ஒருமைச் சுட்டை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: לְמוֹקֵשׁ
  choice: கண்ணியாக
  rationale: מוֹקֵשׁ என்பதன் பொறி அல்லது கண்ணி என்ற உருவகத்தைத் தக்கவைக்கிறது.
- source_word: שַׁלַּח
  choice: அனுப்பிவிடும்
  rationale: ஆட்களை விடுவித்து அனுப்புமாறு கூறும் கட்டளையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: הָאֲנָשִׁים
  choice: அந்த ஆண்களை
  rationale: மூலச்சொல் குறிப்பாக ஆண்பால் பன்மை; ‘மக்களை’ என்று பொதுமைப்படுத்தாமல் அதைப் பேணுகிறது.
- source_word: וְיַעַבְדוּ
  choice: பணிந்துசேவிக்கட்டும்
  rationale: கடவுளை நோக்கிய עבד என்பதில் சேவை மற்றும் வழிபாடு ஆகிய இரு கருத்துகளும் அடங்கலாம்; இணைச்சொல் அந்தப் பொருள் அகலத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הֲטֶרֶם תֵּדַע
  choice: உமக்கு இன்னும் தெரியவில்லையா
  rationale: பார்வோனை நோக்கிய கண்டனக் கேள்வியை மரியாதைப் பன்மையுடன் இயல்பான தமிழில் தருகிறது.
- source_word: אָבְדָה
  choice: பாழாகிவிட்டது
  rationale: தொற்றுநோய்களால் எகிப்து ஏற்கெனவே பேரழிவுற்ற நிலையைக் குறிக்கிறது; முற்றிலும் இல்லாமற்போனது என்று மிகைப்படுத்தாது.
- source_word: מִצְרָיִם
  choice: எகிப்து
  rationale: நாடு அல்லது தேசம் முழுவதையும் குறிக்கும் வழக்கமான தமிழ்ப் பெயர்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது; பட்டத்தைப் பதிலீடு செய்யாமல் பெயரை ஒலிபெயர்ப்பது மூல வடிவைத் தெளிவாகக் காக்கிறது.
- issue: הָאֲנָשִׁים என்ற பாலினக் குறிப்புள்ள பெயர்ச்சொல்
  choice: அந்த ஆண்களை
  alternative: அந்த மக்களை
  rationale: எபிரெயச் சொல் குறிப்பாக ஆண்களைக் குறிக்கிறது; சூழலை விரிவுபடுத்தி பாலினப் பொருளை மறைக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: கடவுளை நோக்கிய עבד வினையின் பொருள் அகலம்
  choice: பணிந்துசேவிக்கட்டும்
  alternative: வழிபடட்டும்
  rationale: இவ்வினை கடவுளைச் சேவித்தல் மற்றும் வழிபடுதல் இரண்டையும் உள்ளடக்கக்கூடும். ஒரே பொருளாகச் சுருக்காமல் அந்த இறையியல் பதற்றத்தை இணைச்சொல் மூலம் பேணுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, கண்ணியமுள்ள உரைநடை பயன்படுத்தப்பட்டுள்ளது. பார்வோனை நேரடியாக உரையாடுவதால் ‘உமக்கு’ என்ற மரியாதை வடிவம் இடப்பட்டுள்ளது. ‘பணிந்துசேவிக்கட்டும்’ என்பது இன்றைய வாசகருக்குப் புரியும் வகையில் சேவை–வழிபாடு என்ற பொருள் அகலத்தைப் பேணுகிறது.
