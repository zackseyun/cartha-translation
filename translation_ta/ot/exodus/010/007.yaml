revisions:
- from: அப்போது பார்வோனின் பணியாளர்கள் அவனிடம், “இவன் இன்னும் எவ்வளவு காலம் நமக்குக் கண்ணியாக இருப்பான்?[a] அந்த ஆண்களை அனுப்பிவிடும்; அவர்கள் தங்கள் கடவுளாகிய யாவேவைப் பணிந்துசேவிக்கட்டும்.[b][c] எகிப்து பாழாகிவிட்டது என்பது உமக்கு இன்னும் தெரியவில்லையா?” என்றார்கள்.
  to: அப்போது பார்வோனின் அரண்மனைப் பணியாளர்கள் அவனிடம், “இந்த மனிதன் இன்னும் எவ்வளவு காலம் நமக்குக் கண்ணியாக இருப்பான்?[a] அந்த ஆண்களை[b] அனுப்பிவிடுங்கள்; அவர்கள் தங்கள் கடவுளாகிய யாவேவைச் சேவிக்கட்டும்.[c] எகிப்து பாழாகிவிட்டது என்பதை நீங்கள் இன்னும் அறியவில்லையா?” என்றார்கள்.
  rationale: வாக்கியத்தின் பொருளை மாற்றாமல், மூலத்தில் வெளிப்படையாக இல்லாத “பணிந்து” என்பதை நீக்கி, அரசவை உரையாடலுக்கேற்ற மரியாதை வடிவத்தை ஒத்திசைத்துள்ளேன். “இந்த மனிதன்” என்பது זֶה என்ற சுட்டுச்சொல்லின் மோசே-குறிப்பை வாசகருக்குத் தெளிவாக்குகிறது; அதன் மாற்றுவடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு அடையாளங்களும் அவை குறிக்கும் சொற்களுக்குப் பின் அமைக்கப்பட்டுள்ளன.
