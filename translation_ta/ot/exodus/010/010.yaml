source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם יְהִ֨י כֵ֤ן יְהוָה֙ עִמָּ/כֶ֔ם כַּ/אֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: ta
  text: அவன் அவர்களிடம், “நான் உங்களையும் உங்கள் சிறு பிள்ளைகளையும் போக விடுவேன் என்றால், யாவே நிச்சயமாக உங்களோடு இருப்பாராக![a] எச்சரிக்கையாக இருங்கள்[b]; ஏனெனில் தீமை உங்கள் முன் இருக்கிறது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களையும் உங்கள் சிறு பிள்ளைகளையும் போக விடும்போது யாவே உங்களோடு இருப்பாராக”; இது ஏளனமாகச் சொல்லப்பட்டிருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: 'எபிரெயத் தொடர் தெளிவற்றது: “பேராபத்து உங்களுக்கு முன்னால் இருக்கிறது” என்றோ, “உங்கள் மனதில் தீய நோக்கம் இருக்கிறது” என்றோ இதைப் புரிந்துகொள்ளலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: யெகோவா நிச்சயமாக உங்களோடு இருப்பாராக
  rationale: இது வாழ்த்துபோன்ற விருப்ப வினை வடிவத்தைத் தக்கவைக்கிறது; பார்வோனின் சூழலில் ஒலிக்கும் ஏளனத்தையும் வெளிப்படையாகச் சேர்க்காமல் உணர விடுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரைத் தமிழில் வழக்கமான நேரடி ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: כַּאֲשֶׁר
  choice: அனுப்பிவிட்டால்
  rationale: இச்சூழலில் உள்ள நிபந்தனை மற்றும் ஏளனத் தொனியை இயல்பான தமிழில் காட்ட ‘-ஆல்’ வடிவம் பயன்படுத்தப்பட்டது; ‘ஒருவேளை’ போன்ற கூடுதல் சொல்லால் வலுப்படுத்தப்படவில்லை.
- source_word: אֲשַׁלַּח אֶתְכֶם וְאֶת טַפְּכֶם
  choice: நான் உங்களையும் உங்கள் சிறு பிள்ளைகளையும் அனுப்பிவிட்டால்
  rationale: שׁלח என்பதன் ‘அனுப்பு/போக விடு’ பொருளையும், טַף என்பதன் சிறு குழந்தைகள் என்ற நுணுக்கத்தையும் காக்கிறது.
- source_word: רְאוּ
  choice: பார்த்துக்கொள்ளுங்கள்
  rationale: வெறும் காணுதல் என்பதைவிட இங்குள்ள எச்சரிக்கைத் தொனியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: ஏனெனில் தீமை உங்கள் முகங்களுக்கு முன்பாக இருக்கிறது
  rationale: רָעָה என்பதன் தீமை/தீங்கு/பேராபத்து என்ற பொருள் விரிவையும், ‘உங்கள் முகங்களுக்கு முன்பாக’ என்ற எபிரெயத் தெளிவின்மையையும் பிரதான உரையில் முடிவு செய்துவிடாமல் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: பார்வோனின் இறுதி எச்சரிக்கையிலுள்ள தெளிவின்மை
  choice: தீமை உங்கள் முகங்களுக்கு முன்பாக இருக்கிறது
  alternative: பேராபத்து உங்களுக்கு முன்னால் இருக்கிறது / உங்கள் மனதில் தீய நோக்கம் இருக்கிறது
  rationale: இத்தொடர் வரவிருக்கும் தீங்கையோ அவர்கள் கொண்டுள்ள தீய நோக்கத்தையோ குறிக்கக்கூடும்; பிரதான உரை இரண்டில் ஒன்றைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், உரையாடலுக்கேற்றதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. பார்வோனின் ஏளனமும் அச்சுறுத்தலும் விளக்கமாகச் சேர்க்கப்படாமல் சூழல் வழியாகக் கேட்கும்படி வைக்கப்பட்டுள்ளன; மூல எபிரெயத்தின் இறுதி சொற்றொடரிலுள்ள நோக்கமுள்ள தெளிவின்மை அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
