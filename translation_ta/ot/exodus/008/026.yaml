revisions:
- from: எனவே மோசே பார்வோனைவிட்டு வெளியே சென்று, யாவேயிடம் மன்றாடினார்[a].
  to: மோசே பார்வோனிடமிருந்து வெளியேறி, யாவேயிடம் மன்றாடினார்[a].
  rationale: The causal connector has been removed to preserve the Hebrew's simple narrative sequence. “பார்வோனிடமிருந்து வெளியேறி” clearly expresses departure from Pharaoh's presence and avoids any implication beyond the source. The existing rendering of earnest entreaty and the divine name is retained; only the footnote's opening wording is lightly standardized.
