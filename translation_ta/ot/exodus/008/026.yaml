source:
  edition: WLC
  text: וַ/יֵּצֵ֥א מֹשֶׁ֖ה מֵ/עִ֣ם פַּרְעֹ֑ה וַ/יֶּעְתַּ֖ר אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/026.yaml
  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: ta
  text: மோசே பார்வோனிடமிருந்து வெளியேறி, யாவேயிடம் மன்றாடினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவேயிடம் உருக்கமாக வேண்டிக்கொண்டார்.’ எபிரெய வினைச்சொல் தீவிரமான வேண்டுதலை அல்லது மன்றாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: வெளியே சென்று
  rationale: יצא என்பதன் Qal wayyiqtol வடிவம் உடல்ரீதியாக வெளியேறுவதையும் கதைத் தொடர்ச்சியையும் குறிக்கிறது; ‘வெளியே சென்று’ என்பது இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעִם פַּרְעֹה
  choice: பார்வோனைவிட்டு
  rationale: מֵעִם என்பது ஒருவரின் உடனிருப்பிலிருந்து அல்லது முன்னிலையிலிருந்து பிரிந்து செல்வதைக் குறிக்கிறது. தமிழில் ‘பார்வோனைவிட்டு’ என்பது இந்தப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיֶּעְתַּר
  choice: மன்றாடினார்
  rationale: עתר என்பது பொதுவாக வேண்டுதல் செய்வதை மட்டுமல்லாமல் தீவிரமான விண்ணப்பத்தையும் மன்றாட்டையும் குறிக்கிறது; ‘மன்றாடினார்’ அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: אֶל יְהוָה
  choice: யாவேயிடம்
  rationale: אֶל என்பது வேண்டுதல் செலுத்தப்பட்டவரைச் சுட்டுகிறது; தமிழில் ‘-யிடம்’ இயல்பான இடைச்சொல் அமைப்பு. יהוה என்ற தெய்வீகப் பெயர் பட்டமாக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல எபிரெய உரையில் நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என வழங்குவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: மோசேயின் வேண்டுதலின் தீவிரம்
  choice: மன்றாடினார்
  alternative: ஜெபித்தார் / உருக்கமாக வேண்டிக்கொண்டார்
  rationale: עתר என்ற வினைச்சொல்லில் உள்ள தீவிர விண்ணப்பத்தின் நுணுக்கத்தை ‘மன்றாடினார்’ சுருக்கமாகத் தக்கவைக்கிறது; அது வேண்டுதலின் சரியான வடிவம் அல்லது விளைவு குறித்து உரையில் இல்லாத கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான அதேவேளையில் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘எனவே’ முந்தைய நிகழ்வின் விளைவாக வரும் וַ-ஐ வெளிப்படுத்துகிறது; ‘பார்வோனைவிட்டு வெளியே சென்று’ என்பது எபிரெயச் சொற்றொடரின் பிரிவு மற்றும் வெளியேற்றம் ஆகிய இரு கூறுகளையும் இயல்பாகப் பாதுகாக்கிறது.
