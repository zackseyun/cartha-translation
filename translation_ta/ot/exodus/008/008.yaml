base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: ta
  text: மோசேயும் ஆரோனும் பார்வோனிடமிருந்து வெளியேறினர். பார்வோன்மேல் அவர் வரச்செய்திருந்த தவளைகளைக்[a] குறித்து மோசே யாவேயை நோக்கிக் கூக்குரலிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பார்வோன்மேல் அவர் வைத்திருந்த தவளைகள்’ அல்லது ‘பார்வோனுக்கு எதிராக அவர் வைத்திருந்த தவளைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை சொல்லுக்குச் சொல் ‘வைத்தார்’ அல்லது ‘நிறுத்தினார்’ என்று பொருள்படும்; வாதையின் சூழலில் ‘வரச்செய்திருந்த’ என்பது அதன் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: வெளியே சென்றார்கள்
  rationale: יצא என்பது பார்வோனின் முன்னிலையிலிருந்து அகன்று வெளியே செல்வதைக் குறிக்கிறது. எபிரெயில் வினை ஒருமையில் இருந்தாலும், மோசே மற்றும் ஆரோன் என்ற கூட்டு எழுவாய்க்குத் தமிழில் இயல்பாகப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: מֵעִם פַּרְעֹה
  choice: பார்வோனிடமிருந்து
  rationale: முன்னொட்டு மֵעִם இங்கு பார்வோனின் உடனிருப்பிலிருந்து அல்லது முன்னிலையிலிருந்து அகன்றதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּצְעַק ... אֶל
  choice: நோக்கிக் கூக்குரலிட்டார்
  rationale: צעק என்பது தீவிரமாகக் கூப்பிடுதல் அல்லது உதவி வேண்டிக் கதறுதல் என்ற வலிமையைக் கொண்டது. வெறும் ‘ஜெபித்தார்’ என்பதைக் காட்டிலும் ‘கூக்குரலிட்டார்’ அந்தத் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைபெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நேரடி ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עַל דְּבַר הַצְפַרְדְּעִים
  choice: தவளைகளைக் குறித்து
  rationale: עַל דְּבַר என்ற சொற்றொடர் இங்கு ‘குறித்து/தொடர்பாக’ என்ற பொருளில் வருகிறது; தமிழில் சுருக்கமாகவும் தெளிவாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: பார்வோன்மேல் அவர் வரச்செய்திருந்த
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை/நிறுத்து’ என்பதாக இருந்தாலும், வாதைச் சூழலில் தவளைகள் பார்வோன்மேல் கொண்டுவரப்பட்டதைத் தமிழில் இயல்பாக ‘வரச்செய்திருந்த’ எனக் கூறுகிறது. ‘அவர்’ என்பதன் சுட்டு மூலத்தைப் போலவே வெளிப்படையாக அடையாளப்படுத்தப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட இறைபெயரையே பயன்படுத்துவதால், பட்டப்பெயரான ‘கர்த்தர்’ என்பதை இடாமல் ஒலிபெயர்ப்பு வழங்கப்பட்டது. ‘யாவே’ என்பது எபிரெய மெய்யெழுத்துப் பெயரின் பொதுவான அறிவியல் மறுகட்டமைப்புக்கு அண்மையான தமிழ் வடிவம்.
- issue: אֲשֶׁר שָׂם என்பதிலுள்ள மறைமுக எழுவாய்
  choice: ‘அவர்’ என்று தெளிவுபடுத்தாமல் வைத்தல்
  alternative: ‘யாவே வரச்செய்திருந்த’ என்று வெளிப்படையாக்குதல்
  rationale: எபிரெய வினையின் எழுவாய் சூழலில் யாவே என்று புரிந்துகொள்ளப்படலாம்; ஆனால் பெயர் மீண்டும் சொல்லப்படவில்லை. மூலத்தின் இலக்கணச் சுருக்கத்தையும் சிறிய சுட்டுத் தெளிவின்மையையும் தமிழிலும் பாதுகாக்க ‘அவர்’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கதைநடைத் தெளிவும் காக்கப்பட்டுள்ளன. ‘கூக்குரலிட்டார்’ என்பது צעק என்பதன் தீவிரத்தைத் தக்கவைக்கிறது; இறைபெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. அடிக்குறி குறிக்கும் இடம் அதன் சொற்தொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
