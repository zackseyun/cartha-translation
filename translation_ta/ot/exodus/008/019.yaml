  source_fidelity: ‘என் மக்களுக்கும் உன் மக்களுக்கும் இடையே நான் வேறுபாட்டை ஏற்படுத்துவேன்’ accurately conveys וְשַׂמְתִּי ... פְדֻת בֵּין עַמִּי וּבֵין עַמֶּךָ. ‘வேறுபாடு’ appropriately represents the contextual sense of פְדֻת while the footnote preserves the possible redemption/deliverance sense. ‘நாளை இந்த அடையாளம் நிகழும்’ faithfully communicates the future temporal clause and the announced sign.
