    text: ‘மீட்பை’ அல்லது ‘விடுதலையை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் இறைவனுடைய மீட்புச் செயலைக் குறிக்கக்கூடும்; இங்கே அது இஸ்ரவேலரையும் எகிப்தியரையும் அவர் வேறுபடுத்துவதில் வெளிப்படுகிறது.
