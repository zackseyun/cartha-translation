lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: நான் ஏற்படுத்துவேன்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை/அமை’ என்பதாக இருந்தாலும், פְדֻת என்ற கருத்துப்பெயருடனும் ‘இடையே’ என்ற அமைப்புடனும் வருவதால், நவீனத் தமிழில் ‘வேறுபாட்டை ஏற்படுத்துவேன்’ என்பது இயல்பாகவும் காரணச் செயலைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: פְדֻת
  choice: வேறுபாடு
  rationale: இச்சொல் ‘மீட்பு’ அல்லது ‘விடுதலை’ என்ற பொருளையும் தாங்கக்கூடும். ஆனால் ‘என் மக்களுக்கும் உன் மக்களுக்கும் இடையே’ என்ற உடனடிச் சூழலில், இறைவன் இரு மக்களையும் வேறுபடுத்தி நடத்துவதை இது குறிக்கிறது. மூலத்தின் மீட்புச் சாயல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֵּין ... וּבֵין
  choice: …க்கும் …க்கும் இடையே
  rationale: இரு தரப்புகளுக்கிடையிலான பிரிவை அல்லது வேறுபாட்டைக் குறிக்கும் இணை முன்னிடைச்சொல் அமைப்புக்கான இயல்பான தமிழ் வடிவம்.
- source_word: עַמִּי
  choice: என் மக்கள்
  rationale: இறைவனுக்குரிய மக்களாகிய இஸ்ரவேலரைச் சுட்டும் நேரடியான உடைமைத் தொடர்.
- source_word: עַמֶּךָ
  choice: உன் மக்கள்
  rationale: பார்வோனுக்குரிய மக்களாகிய எகிப்தியரைச் சுட்டும் நேரடியான உடைமைத் தொடர்.
- source_word: לְמָחָר
  choice: நாளை
  rationale: எதிர்வரும் நாளைக் குறிக்கும் காலச் சொல்; எபிரெய உரையின் முன்னிலைப்படுத்தலைத் தமிழிலும் காக்கிறது.
- source_word: יִהְיֶה
  choice: நிகழும்
  rationale: ‘இந்த அடையாளம்’ என்பதுடன் வரும் போது, சொற்சொல்லான ‘இருக்கும்’ என்பதைவிட ‘நிகழும்’ என்பது அறிவிக்கப்பட்ட அடையாளச் சம்பவம் நடைபெறுவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הָאֹת הַזֶּה
  choice: இந்த அடையாளம்
  rationale: யாத்திராகமத்தின் வாதைச் சூழலில் אוֹת என்பது இறைவனால் கொடுக்கப்படும் உறுதிப்படுத்தும் அடையாளத்தைக் குறிக்கிறது.
theological_decisions:
- issue: פְדֻת என்பதை ‘மீட்பு’ என்ற இறையியல் சாயலுடன் மொழிபெயர்ப்பதா, அல்லது சூழலுக்கேற்ற வேறுபடுத்துதலாக மொழிபெயர்ப்பதா
  choice: முதன்மை உரையில் ‘வேறுபாடு’
  alternative: ‘மீட்பு’ அல்லது ‘விடுதலை’
  rationale: ‘என் மக்களுக்கும் உன் மக்களுக்கும் இடையே’ என்ற தொடரமைப்பு, இங்கு இஸ்ரவேலருக்கும் எகிப்தியருக்கும் இறைவன் காட்டும் வேறுபட்ட நடத்தையை முன்னிறுத்துகிறது. அதேவேளை, அந்த வேறுபாடு இறைவனுடைய மீட்புச் செயலால் உண்டாகிறது என்ற சொல்லின் சாயலை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேறுபாட்டை ஏற்படுத்துவேன்’ என்பது மூல வினையின் செயற்பாட்டுத் தன்மையையும் தமிழ் இயல்பையும் இணைக்கிறது; ‘நிகழும்’ என்பது அடையாளம் சம்பவமாக நடைபெறுவதைத் தெளிவாக்குகிறது.
