  terminology: ‘மக்கள்,’ ‘வேறுபாடு,’ and ‘அடையாளம்’ are consistent and comprehensible choices. The footnote’s ‘மீட்பு’ and ‘விடுதலை’ appropriately preserve the lexical and theological resonance without forcing that narrower meaning into the main text.
