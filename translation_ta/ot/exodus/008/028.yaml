  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: ta
  text: ஆனால் பார்வோன் இந்த முறையும் தன் இதயத்தைக் கடினப்படுத்தி[a], மக்களைப் போகவிடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்கு சொல், “தன் இதயத்தைக் கனமாக்கினான்.” இச்சொற்றொடர் பார்வோன் பிடிவாதமாகவும் இணங்காதவனாகவும் ஆனதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: கடினப்படுத்தி
  rationale: כבד என்பதன் அடிப்படைப் பொருள் ‘கனமாக்குதல்.’ ஆனால் ‘இதயம்’ என்பதோடு வரும் இச்சொற்றொடர் பிடிவாதமாகவும் உணர்வற்றும் எதிர்ப்பதைக் குறிக்கிறது. ‘கடினப்படுத்தி’ என்பது அந்த உருவகத்தையும் பார்வோனின் செயற்பாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לִבּוֹ
  choice: தன் இதயத்தை
  rationale: எபிரெய மொழியில் ‘இதயம்’ சித்தம், மனப்பாங்கு, தீர்மானம் ஆகியவற்றின் மையத்தைக் குறிக்கிறது. எழுவாய் பார்வோன் என்பதால் தமிழ் இயல்புக்கு ஏற்ப ‘தன்’ பயன்படுத்தப்பட்டது.
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: இந்த முறையும்
  rationale: גַּם சேர்க்கைப் பொருளையும் בַּפַּעַם הַזֹּאת தற்போதைய நிகழ்வையும் குறிக்கின்றன. ‘இந்த முறையும்’ என்பது மீண்டும் நடந்ததைக் குறுகிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְלֹא שִׁלַּח
  choice: போகவிடவில்லை
  rationale: யாத்திராகமச் சூழலில் שׁלח என்பது மக்களை விடுவித்து செல்ல அனுமதிப்பதைக் குறிக்கிறது. ‘போகவிடவில்லை’ என்பது அனுமதிக்காமையையும் விடுதலை மறுக்கப்பட்டதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்களை
  rationale: இது இஸ்ரவேல் மக்களைக் குறிக்கும் ஒருமை வடிவிலான கூட்டுப்பெயர்; தமிழில் ‘மக்கள்’ பொருத்தமான இயல்பான இணை.
- source_word: וַ
  choice: ஆனால்
  rationale: வாவ் தொடர் கதையை முன்னெடுத்தாலும், முந்தைய நிவாரணத்துக்கு எதிரான பார்வோனின் பதிலை இங்கு ‘ஆனால்’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: பார்வோனின் இதயம் கடினமானதில் செயற்பாட்டாளர் யார்
  choice: பார்வோன் தானே தன் இதயத்தைக் கடினப்படுத்தினான்
  alternative: பார்வோனின் இதயம் கடினமானது
  rationale: எபிரெய வினையின் வெளிப்படையான எழுவாய் பார்வோன்; ஆகவே அவனது செயற்பாடும் பொறுப்பும் காக்கப்படுகின்றன. வேறு வசனங்களில் கடவுள் பார்வோனின் இதயத்தைக் கடினப்படுத்துவதாக வரும் கதையியல் இறுக்கத்தை இவ்வசனம் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் மொழிபெயர்க்கப்பட்டது. ‘இதயம்’ என்ற எபிரெய உருவகம் காக்கப்பட்டுள்ளது; அடிக்குறிப்பில் அதன் சொல்லடிப் பொருளும் சொற்றொடரின் கருத்தும் தரப்பட்டுள்ளன.
