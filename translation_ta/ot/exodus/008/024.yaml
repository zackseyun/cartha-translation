  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: ta
  text: அப்போது பார்வோன், “நீங்கள் வனாந்தரத்தில் உங்கள் கடவுளாகிய யாவேக்குப் பலியிடும்படி நான் உங்களைப் போகவிடுவேன். ஆனால் மிகத் தொலைவுக்குப் போகாதீர்கள். எனக்காக மன்றாடுங்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; தமிழில் ‘அப்போது’ இயல்பான கதைத் தொடர்ச்சியைத் தருகிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரச பட்டத்திற்கான தமிழில் நிலைபெற்ற வடிவம்.
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: நான் உங்களைப் போகவிடுவேன்
  rationale: இந்தப் பேச்சுவார்த்தைச் சூழலில் שׁלח என்பது புறப்பட்டுச் செல்ல அனுமதிப்பதைக் குறிக்கிறது. வெளிப்படையான אָנֹכִי-ஐ ‘நான்’ தக்கவைக்கிறது; ‘நானே’ என மிகைப்படுத்தவில்லை.
- source_word: וּזְבַחְתֶּם
  choice: பலியிடும்படி
  rationale: முன்னுள்ள ‘போகவிடுவேன்’ என்பதன் நோக்கத்தை இணைந்த வினை வடிவம் இங்கு தெரிவிக்கிறது; தமிழ் நோக்கவினை அமைப்பு இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய
  rationale: இஸ்ரவேலருடைய கடவுள் என்ற உடைமைத் தொடர்பையும், அடுத்துள்ள தெய்வீகப் பெயருடனான இயல்பான தமிழ் இணைப்பையும் தருகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: மனிதக் குடியிருப்பும் பயிரிடுதலும் குறைந்த வெளிநிலத்தைச் சுட்டும் מִדְבָּר என்பதற்கு, வெறும் மணற்பாலைவனம் எனக் குறுக்காமல் பொருந்தும் வழக்கமான தமிழ் சொல்.
- source_word: רַק
  choice: ஆனால்
  rationale: பார்வோன் விதிக்கும் கட்டுப்பாட்டை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: மிகத் தொலைவுக்குப் போகாதீர்கள்
  rationale: רחק என்பதன் வினையெச்ச முழுவடிவமும் வினைமுற்றும் சேர்ந்த அமைப்பு தடையை வலியுறுத்துகிறது; ‘மிகத் தொலைவுக்கு’ அந்த வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: எனக்காக மன்றாடுங்கள்
  rationale: Hiphil வடிவிலுள்ள עתר தீவிர வேண்டுதலைக் குறிக்கிறது; பன்மை கட்டளையையும் பார்வோனுக்காக வேண்டுதல் செய்வதையும் இவ்வடிவம் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கெழுத்துத் தெய்வீகப் பெயரை நேரடியாகக் கொண்டுள்ளது. அதை பொதுப் பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது உரையின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘வனாந்தரம்’ வேதாகம வாசகர்களுக்கு அறிமுகமானதுடன், מִדְבָּר என்பதைக் ‘பாலைவனம்’ என்று அளவுக்கு மீறிக் குறுக்குவதையும் தவிர்க்கிறது.
