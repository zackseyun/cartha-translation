source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הַשְׁכֵּ֤ם בַּ/בֹּ֨קֶר֙ וְ/הִתְיַצֵּב֙ לִ/פְנֵ֣י פַרְעֹ֔ה הִנֵּ֖ה יוֹצֵ֣א הַ/מָּ֑יְמָ/ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: ta
  text: 'பின்பு ஆண்டவர் மோசேயிடம், “அதிகாலையில் எழுந்து, பார்வோனுக்கு முன்பாகப் போய் நில். இதோ, அவன் நீர்நிலைக்குச் செல்கிறான். நீ அவனிடம், ‘ஆண்டவர் கூறுவது இதுவே: என் மக்கள் எனக்குச் சேவை செய்யும்படி அவர்களைப் போகவிடு’ என்று சொல்” என்றார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயரைத் தமிழ் வேதாகம நடையில் மரியாதையுடனும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: அதிகாலையில் எழுந்து
  rationale: எபிரேய மொழியின் ‘காலையில் சீக்கிரம் எழு’ என்ற கட்டளையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: பார்வோனுக்கு முன்பாகப் போய் நில்
  rationale: ‘அவன் முன்னிலையில் நிலைகொள்’ என்ற வலிமையான கட்டளையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் மூலமொழிச் சொல்லின் உரையாடல் செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: יוֹצֵא הַמַּיְמָה
  choice: அவன் தண்ணீருக்குப் புறப்பட்டு வருவான்
  rationale: நீர்நிலையை நோக்கிச் செல்லும் இயக்கத்தைக் காட்டுகிறது; எந்த குறிப்பிட்ட நீர்நிலை என்பதைக் மூலத்தை மீறி நிர்ணயிக்கவில்லை.
- source_word: שַׁלַּח עַמִּי
  choice: என் மக்கள் என்னை வழிபடும்படி அவர்களைப் போகவிடு
  rationale: விடுதலைக்கான கட்டளையையும் அதன் நோக்கத்தையும் நேரடியாகக் கூறுகிறது.
- source_word: וְיַעַבְדֻנִי
  choice: என்னை வழிபடும்படி
  rationale: עבד இங்கு ஆண்டவருக்குச் செய்யும் சமயச் சேவையைக் குறிக்கிறது; தமிழில் ‘வழிபடு’ சூழலுக்கேற்ற தெளிவான தேர்வு.
theological_decisions:
- issue: தெய்வீகப் பெயர் יהוה-இன் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தமிழில் பரவலாக அறியப்படும் மரியாதைமிக்க பிரதிநிதிப்பைப் பயன்படுத்துகிறது; தனிப்பட்ட உச்சரிப்பை உறுதிப்படுத்தவில்லை.
- issue: עבד என்பதன் பொருள்
  choice: வழிபடு
  alternative: பணிசெய்
  rationale: இச்சூழலில் இஸ்ரவேலர் ஆண்டவருக்குச் செய்ய வேண்டிய சமயச் சேவையே நோக்கம்; இருப்பினும் சொல்லின் சேவை சார்ந்த பரந்த பொருள் முற்றிலும் மறுக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை. நேரடி உரையின் கட்டளைத் தன்மையும் ‘இதோ’ என்ற கவன ஈர்ப்பும் பாதுகாக்கப்பட்டுள்ளன.
