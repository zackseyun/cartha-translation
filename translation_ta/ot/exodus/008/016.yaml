revisions:
- from: 'பின்பு ஆண்டவர் மோசேயிடம், “அதிகாலையில் எழுந்து, பார்வோனுக்கு முன்பாகப் போய் நில். இதோ, அவன் தண்ணீருக்குப் புறப்பட்டு வருவான். நீ அவனிடம், ‘ஆண்டவர் கூறுவது இதுவே: என் மக்கள் என்னை வழிபடும்படி அவர்களைப் போகவிடு’ என்று சொல்” என்றார்.'
