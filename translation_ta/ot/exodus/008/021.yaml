lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: இச்சூழலில் קרא என்பது ஒருவரை வரவழைப்பதைக் குறிக்கிறது. ‘அழைத்து’ என்பது இயல்பான நவீனத் தமிழ்; அதிகாரபூர்வமாக ‘வரவழைத்தான்’ என்று மூலத்தைவிட வலுப்படுத்துவதையும் தவிர்க்கிறது.
- source_word: פַרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசரைக் குறிக்கும் பட்டத்திற்கான வழக்கமான தமிழ் வடிவம்.
- source_word: אֶל־מֹשֶׁה וּלְאַהֲרֹן
  choice: மோசேயையும் ஆரோனையும்
  rationale: அழைக்கப்பட்ட இருவரையும் தமிழில் இயல்பான நேர்ச்செயப்படுபொருள் அமைப்பில் காட்டுகிறது.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: நேர்க்கூற்றுக்குப் பின் வரும் இயல்பான தமிழ் கதையாடல் வடிவம்; பேசுபவர் பார்வோன் என்பதும் தெளிவாக உள்ளது.
- source_word: לְכוּ
  choice: நீங்கள் போய்
  rationale: பன்மை ஏவல் வடிவத்தைத் தெளிவாகக் காட்டுகிறது; அடுத்த ஏவலுடன் தமிழில் இயல்பாக இணைகிறது.
- source_word: זִבְחוּ
  choice: பலிசெலுத்துங்கள்
  rationale: זבח குறிக்கும் வழிபாட்டுப் பலியிடுதலை நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: לֵאלֹהֵיכֶם
  choice: உங்கள் கடவுளுக்கு
  rationale: பலியின் பெறுநர் அல்லது நோக்கைச் சுட்டும் לְ முன்னொட்டை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டிற்குள்ளேயே
  rationale: ‘நாட்டில்’ என்ற மூலப் பொருளைப் பேணுவதோடு, வனாந்தரத்திற்குச் செல்லாமல் எகிப்தின் எல்லைக்குள் பலியிட வேண்டும் என்ற சூழல்சார் வரம்பை ‘உள்ளேயே’ இயல்பாக வெளிப்படுத்துகிறது; ‘எகிப்து’ என்பதை முதன்மை உரையில் நேரடியாகச் சேர்க்கவில்லை.
