  text: וַ/יַּֽעֲשׂוּ כֵ֥ן הַֽ/חֲרְטֻמִּ֖ים בְּ/לָטֵי/הֶ֑ם וַ/יַּעֲל֥וּ אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: ta
  text: மந்திரவாதிகளும் தங்கள் இரகசியக் கலைகளால்[a] அவ்வாறே செய்து, தவளைகளை எகிப்து தேசத்தின்மேல் மேலே வரச் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் மந்திர உச்சாடனங்களால்”; அல்லது, “தங்கள் மறைமந்திரக் கலைகளால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: அவ்வாறே செய்து
  rationale: עשה + כֵן என்ற மரபுத்தொடர், முன்பு நிகழ்ந்த செயலுக்கு ஒப்பாக அதே விதத்தில் செய்ததைக் குறிக்கிறது; “அவ்வாறே செய்து” என்பது அந்த ஒப்பீட்டு வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: הַחֲרְטֻמִּים
  choice: மந்திரவாதிகள்
  rationale: யாத்திராகமச் சூழலில் பார்வோனின் அரசவையில் மறைமந்திர வழிகளில் அடையாளங்களைப் பின்பற்றியவர்களைக் குறிக்கிறது; “மந்திரவாதிகள்” என்பது தெளிவான, வழக்கமான தமிழ் இணைச்சொல்.
- source_word: בְּלָטֵיהֶם
  choice: தங்கள் இரகசிய மாயக்கலைகளால்
  rationale: மறைவான அல்லது இரகசியமான மந்திரச் செயல்முறைகளையும், அவை செயல் நிகழ்ந்த கருவியாக இருந்ததையும் இந்த மொழிபெயர்ப்பு வெளிப்படுத்துகிறது; துல்லியமான முறை என்ன என்பதை அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: וַיַּעֲלוּ
  choice: மேலே வரச் செய்தார்கள்
  rationale: 'עלה என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை நேரடியாகக் காக்கிறது: தவளைகள் மேலே வரும்படி அவர்கள் செய்தார்கள்.'
- source_word: אֶת הַצְפַרְדְּעִים
  choice: தவளைகளை
  rationale: திட்டமான பன்மை நேர்செயப்படுபொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடெங்கும்
  rationale: עַל இங்கு எகிப்து நாட்டின் மேல் அல்லது அதன் பரப்பெங்கும் தவளைகள் வந்ததைச் சுட்டுகிறது; “நாடெங்கும்” என்பது பரவலை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: மந்திரவாதிகளின் செயலின் தன்மை
  choice: மந்திரவாதிகளும் தவளைகளை மேலே வரச் செய்ததாக உரை கூறும் விதத்திலேயே நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: அவர்களுடைய செயலை வெறும் தோற்றப்போலி அல்லது தந்திரம் என்று சந்தேகத்துடன் மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை அவர்களுடைய செயலை எந்தத் தகுதிப்படுத்தலும் இன்றி அறிவிக்கிறது. அது உண்மையில் எவ்வாறு நிகழ்ந்தது என்பதற்கான இயற்கைவாத அல்லது சமயவாத விளக்கத்தை மொழிபெயர்ப்பு சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. காரணவினை மற்றும் மூலத்தின் திட்டமிட்ட தெளிவின்மை காக்கப்பட்டுள்ளன.
