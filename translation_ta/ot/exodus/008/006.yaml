source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר לְ/מָחָ֑ר וַ/יֹּ֨אמֶר֙ כִּ/דְבָ֣רְ/ךָ֔ לְמַ֣עַן תֵּדַ֔ע כִּי אֵ֖ין כַּ/יהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: ta
  text: அவன், “நாளைக்கு” என்றான். மோசே, “நீ சொன்னபடியே செய்வேன்; நம் கடவுளாகிய யாவேவைப் போல யாரும் இல்லை என்பதை நீ அறியும்படியாக” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவன் … என்றான் / மோசே … என்றார்
  rationale: இரண்டு தொடர்ச்சியான உரையாடல் வினைகளையும் தமிழில் இயல்பாக வேறுபடுத்திக் காட்டுகிறது. சூழலில் முதல் பேச்சாளர் பார்வோன்; இரண்டாம் பேச்சாளர் மோசே என்பதால், இரண்டாவது இடத்தில் பெயர் தெளிவுக்காக வழங்கப்பட்டுள்ளது.
- source_word: לְמָחָר
  choice: நாளைக்கு
  rationale: பார்வோன் கூறும் நேரடியான காலப் பதிலாக, நவீனத் தமிழில் இயல்பான வடிவம்.
- source_word: כִּדְבָרְךָ
  choice: நீ சொன்னபடியே ஆகட்டும்
  rationale: ‘உன் வார்த்தையின்படி’ என்ற எபிரெயச் சொற்றொடரின் பொருளை இயல்பான தமிழில் தருவதோடு, மோசே பார்வோன் குறிப்பிட்ட நேரத்தை ஏற்றுக்கொள்வதையும் வெளிப்படுத்துகிறது.
- source_word: לְמַעַן תֵּדַע
  choice: நீ அறிந்துகொள்வதற்காக
  rationale: לְמַעַן குறிக்கும் நோக்கத்தையும், இரண்டாம் நபர் ஒருமையில் பார்வோனை நோக்கிச் சொல்லப்படுவதையும் காக்கிறது.
- source_word: אֵין כַּיהוָה
  choice: யாவேக்கு நிகரானவர் யாரும் இல்லை
  rationale: எவரும் யாவேக்கு ஒப்பில்லை என்ற ஒப்பீட்டு மறுப்பைத் தெளிவான, dignified தமிழில் தெரிவிக்கிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய
  rationale: இச்சூழலில் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் பன்மை வடிவமுள்ள பெயர்ச்சொல்லை ஒருமைப் பொருளில் இயல்பாக மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், அதன் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ என்று தருகிறது; குறிப்பில் எபிரெய எழுத்துவடிவம் விளக்கப்படுகிறது.
- issue: ‘யாவேக்கு நிகரானவர் யாரும் இல்லை’ என்ற கூற்று
  choice: ஒப்பற்ற தன்மையை அப்படியே வைத்தல்
  alternative: ‘யாவே ஒருவரே கடவுள்’ என்று விளக்கமாக விரித்தல்
  rationale: மூலம் நேரடியாகக் கூறுவது ஒப்பீட்டு மறுப்பு. அதைக் கடந்து வேறு இறையியல் முடிவை உரைக்குள் சேர்க்காமல் அதன் வலிமையையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உன் வார்த்தையின்படி’ என்ற சொற்சொற் வடிவத்துக்குப் பதிலாக ‘நீ சொன்னபடியே’ என இயல்பாக்கப்பட்டாலும், நோக்கவாக்கியமும் ஒப்பீட்டு மறுப்பும் முறையாகப் பாதுகாக்கப்பட்டுள்ளன.
