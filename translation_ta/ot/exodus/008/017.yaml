source:
  edition: WLC
  text: כִּ֣י אִם אֵינְ/ךָ֮ מְשַׁלֵּ֣חַ אֶת עַמִּ/י֒ הִנְ/נִי֩ מַשְׁלִ֨יחַ בְּ/ךָ֜ וּ/בַ/עֲבָדֶ֧י/ךָ וּֽ/בְ/עַמְּ/ךָ֛ וּ/בְ/בָתֶּ֖י/ךָ אֶת הֶ/עָרֹ֑ב וּ/מָ֨לְא֜וּ בָּתֵּ֤י מִצְרַ֨יִם֙ אֶת הֶ֣/עָרֹ֔ב וְ/גַ֥ם הָ/אֲדָמָ֖ה אֲשֶׁר הֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: ta
  text: ஏனெனில், நீ என் மக்களைப் போகவிடாவிட்டால், இதோ, நான் உன்மேலும் உன் பணியாளர்கள்மேலும் உன் மக்கள்மேலும் உன் வீடுகளுக்குள்ளும் பூச்சித் திரளை[a] அனுப்புவேன். எகிப்தின் வீடுகளும், அவர்கள் இருக்கும் நிலமும்கூட[b], அந்தப் பூச்சித் திரளால் நிறைந்துபோகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஈக்கூட்டத்தை.’ எபிரெயச் சொல் עָרֹב ஒரு திரளைக் குறிக்கலாம்; மரபாக இது ஈக்களின் கூட்டம் என்று புரிந்துகொள்ளப்படுகிறது. ஆனால் எந்த உயிரினம் என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள் இருக்கும் தரையும்கூட.’ எபிரெயச் சொல் אֲדָמָה ‘நிலம்’ அல்லது ‘தரை’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ஏனெனில், ... விடாவிட்டால்
  rationale: முந்தைய உரையுடன் காரணத் தொடர்பைத் தக்கவைத்தபடி நிபந்தனை எச்சரிக்கையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: நீ என் மக்களைப் போகவிடாவிட்டால்
  rationale: யாத்திராகமச் சூழலில் שׁלח என்பது வெறுமனே அனுப்புவதைக் காட்டிலும் விடுதலை செய்து செல்ல அனுமதிப்பதைக் குறிக்கிறது.
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: இதோ, நான் ... அனுப்புவேன்
  rationale: הִנְנִי என்பதன் கவன ஈர்ப்பையும் solemn announcement force-ஐயும் ‘இதோ’ தக்கவைக்கிறது; எபிரெயப் பங்கேற்புவினையின் உடனடி, உறுதியான எதிர்காலச் செயலைத் தமிழில் ‘அனுப்புவேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֶעָרֹב
  choice: பூச்சித் திரள்
  rationale: இந்தச் சொல்லால் குறிக்கப்படும் உயிரினம் உறுதியாகத் தெரியாததால் ‘ஈக்கள்’ என்று முதன்மை உரையில் குறிப்பாக்காமல், கூட்டமாக வரும் பூச்சிகள் என்ற பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: בְּךָ וּבַעֲבָדֶיךָ וּבְעַמְּךָ
  choice: உன்மேலும் உன் பணியாளர்கள்மேலும் உன் மக்கள்மேலும்
  rationale: மீண்டும் மீண்டும் வரும் ב முன்னிடைச்சொல்லையும் எச்சரிக்கையின் படிப்படியான தீவிரத்தையும் தமிழில் ‘மேலும்’ என்ற தொடரால் காக்கிறது.
- source_word: וּבְבָתֶּיךָ
  choice: உன் வீடுகளுக்குள்ளும்
  rationale: அனுப்பப்படும் திரள் வீடுகளின் உள்ளே புகுவதையும் அடுத்த வாக்கியத்தில் அவை நிரம்புவதையும் இயல்பாக இணைக்கிறது.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם אֶת הֶעָרֹב
  choice: எகிப்தின் வீடுகள் ... அந்தப் பூச்சித் திரளால் நிறைந்துபோகும்
  rationale: எபிரெயச் சொற்றொடரின் விளைவையும் ‘எகிப்தின் வீடுகள்’ என்ற அமைப்பையும் தெளிவான தமிழில் தருகிறது.
- source_word: וְגַם הָאֲדָמָה אֲשֶׁר הֵם עָלֶיהָ
  choice: அவர்கள் இருக்கும் நிலமும்கூட
  rationale: אֲדָמָה என்பதன் ‘நிலம்/தரை’ பொருள் நெகிழ்வை ‘நிலம்’ காக்கிறது; אֲשֶׁר הֵם עָלֶיהָ என்பதை விளக்கச் சேர்க்கையின்றி நேரடியாக வெளிப்படுத்துகிறது.
