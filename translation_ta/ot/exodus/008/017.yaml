  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் dignified எச்சரிக்கைத் தொனி காக்கப்பட்டுள்ளது. ‘இதோ’ அறிவிப்பின் வலிமையைத் தக்கவைக்கிறது; தொடர்ச்சியான ‘மேலும்’ எபிரெய உரையின் உரைநடைச் சேர்க்கையை பிரதிபலிக்கிறது.
