translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான நிகழ்வோட்டம் இரண்டு குறும் தமிழ் வாக்கியங்களாக இயல்பாக்கப்பட்டுள்ளது; கூட்டொருமையின் உண்மையான வடிவியல் தன்மை அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
