base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/002.yaml
  text: So Aaron stretched out his hand over the waters of Egypt[a], and the frogs came up and covered the land of Egypt.
translation:
  language: ta
  text: அப்போது ஆரோன் எகிப்தின் நீர்நிலைகளுக்கு மேல் தன் கையை நீட்டினான்; தவளைகள்[a] மேலே வந்து எகிப்து நாட்டை மூடின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் ‘தவளை’ என்பது ஒருமை வடிவில் உள்ளது; ஆனால் இங்கு அது தவளைகளை ஒட்டுமொத்தமாகக் குறிக்கும் கூட்டொருமையாகப் பயன்படுத்தப்பட்டிருக்கலாம். எனவே ‘தவளைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: நீட்டினான்
  rationale: נטה என்பது இச்சூழலில் கையை அதிகாரபூர்வமான அடையாளச் செயலாக நீட்டுவதைக் குறிக்கிறது; நவீன தமிழில் ‘நீட்டினான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יָדוֹ
  choice: தன் கையை
  rationale: எபிரெய உரை குறிப்பாக ‘அவனுடைய கை’ என்று கூறுகிறது. தமிழில் எழுவாயான ஆரோனையே சுட்ட ‘தன் கையை’ என்பது இயல்பான வடிவம்.
- source_word: עַל
  choice: மேல்
  rationale: கையை நீர்நிலைகளின் மேலாக நீட்டிய இடவுறவை ‘மேல்’ தெளிவாகக் காட்டுகிறது.
- source_word: מֵימֵי מִצְרָיִם
  choice: எகிப்தின் நீர்நிலைகள்
  rationale: எபிரெய பன்மை வடிவம் எகிப்திலுள்ள நீராதாரங்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. ‘நீர்நிலைகள்’ என்பது தமிழில் இயல்பாக இந்தக் கூட்டுப் பொருளை வெளிப்படுத்துகிறது.
- source_word: וַתַּעַל
  choice: மேலே வந்து
  rationale: עלה இங்கு தவளைகள் நீரிலிருந்து நிலத்தின் மேல் வெளிவந்த இயக்கத்தைக் குறிக்கிறது; ‘மேலே வந்து’ அதைப் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: הַצְּפַרְדֵּעַ
  choice: தவளைகள்
  rationale: எபிரெயில் பெயர்ச்சொல் ஒருமையில் இருந்தாலும் இங்கு அது கூட்டுப் பொருளில் பயன்படுகிறது. இயல்பான தமிழில் பன்மையான ‘தவளைகள்’ பொருத்தமானது; வடிவியல் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַתְּכַס
  choice: மூடிக்கொண்டன
  rationale: כסה என்பதன் அடிப்படைப் பொருள் ‘மூடுதல்’. தவளைகள் நாடெங்கும் பரவிய விளைவை ‘மூடிக்கொண்டன’ இயல்பாகவும் மிகையின்றியும் காட்டுகிறது.
- source_word: אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடு
  rationale: אֶרֶץ இங்கு எகிப்தின் நிலப்பரப்பு அல்லது நாட்டைக் குறிக்கிறது; ‘எகிப்து நாடு’ சாதாரண நவீன தமிழில் தெளிவாக உள்ளது.
