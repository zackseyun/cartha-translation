  rationale: ‘அப்பொழுது’ என்பதற்குப் பதிலாக ‘அப்போது’ பயன்படுத்தப்பட்டு, இரண்டு நிகழ்வுகளின் எபிரெய இணைவு அரைப்புள்ளியால் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது. முக்கியமாக, ‘மூடிக்கொண்டன’ என்பது ‘மூடின’ என மாற்றப்பட்டுள்ளது; இது வினைச்சொல்லின் எளிய செயற்பொருளை மிகையில்லாமல் பிரதிபலிக்கிறது. அடிக்குறிப்பு மாற்றமின்றி தேவையான வடிவியல் தகவலைக் காக்கிறது.
