revisions:
- from: அப்பொழுது ஆரோன் எகிப்தின் நீர்நிலைகளுக்கு மேல் தன் கையை நீட்டினான். தவளைகள்[a] மேலே வந்து எகிப்து நாட்டை மூடிக்கொண்டன.
