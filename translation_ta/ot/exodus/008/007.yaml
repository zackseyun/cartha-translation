source:
  edition: WLC
  text: וְ/סָר֣וּ הַֽ/צְפַרְדְּעִ֗ים מִמְּ/ךָ֙ וּ/מִ/בָּ֣תֶּ֔י/ךָ וּ/מֵ/עֲבָדֶ֖י/ךָ וּ/מֵ/עַמֶּ֑/ךָ רַ֥ק בַּ/יְאֹ֖ר תִּשָּׁאַֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: ta
  text: தவளைகள் உன்னிடமிருந்தும், உன் வீடுகளிலிருந்தும், உன் பணியாளர்களிடமிருந்தும், உன் மக்களிடமிருந்தும் அகன்றுபோகும்; நைல் நதியில்[a] மட்டுமே அவை எஞ்சியிருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நதியில்.” எபிரெயச் சொல்லான יְאֹר என்பதற்கு “நதி” என்று பொருள் இருக்கலாம்; ஆனால் யாத்திராகமத்தில் அது பொதுவாக நைல் நதியையே குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: அகன்றுபோகும்
  rationale: סוּר என்பதன் ‘விலகுதல், அகன்றுபோதல்’ என்ற பொருளை, தவளைகள் அந்த இடங்களிலிருந்து நீங்கும் இச்சூழலில் இயல்பான நவீனத் தமிழில் தருகிறது; அவை நேரடியாக அழிக்கப்படுகின்றன என்று மிகைப்படுத்தவில்லை.
- source_word: הַצְפַרְדְּעִים
  choice: தவளைகள்
  rationale: வரையறுக்கப்பட்ட பன்மைப் பெயர்ச்சொல்லின் நேரான, இயல்பான மொழிபெயர்ப்பு.
- source_word: מִמְּךָ
  choice: உன்னிடமிருந்தும்
  rationale: מן முன்னொட்டும் இரண்டாம் நபர் ஆண்பால் ஒருமை விகுதியும் தரும் ‘உன்னிடமிருந்து’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: וּמִבָּתֶּיךָ
  choice: உன் வீடுகளிலிருந்தும்
  rationale: எபிரெயச் சொல்லிலுள்ள பன்மையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וּמֵעֲבָדֶיךָ
  choice: உன் பணியாளர்களிடமிருந்தும்
  rationale: עֶבֶד என்பதற்கு பணியாளர், அடிமை, அதிகாரி ஆகிய பொருட்கள் இருக்கலாம். இங்கு பார்வோனின் கீழுள்ளவர்களைப் பொதுவாகக் குறிக்க, கட்டாய அடிமை நிலையையோ அதிகாரப் பதவியையோ தேவையின்றி குறிப்பாக்காமல் ‘பணியாளர்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: וּמֵעַמֶּךָ
  choice: உன் மக்களிடமிருந்தும்
  rationale: பார்வோனுக்குட்பட்ட மக்களைக் குறிக்கும் עַם என்பதன் பரந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: רַק
  choice: மட்டுமே
  rationale: பின்வரும் விதிவிலக்கை அல்லது வரம்பைத் தெளிவாகக் குறிக்கிறது.
- source_word: בַּיְאֹר
  choice: நைல் நதியில்
  rationale: יְאֹר என்பது பொதுவாக ‘நதி’ எனப் பொருள்படக்கூடும்; ஆனால் யாத்திராகமத்தின் இச்சூழலில் குறிப்பாக நைல் நதியைக் குறிக்கிறது.
- source_word: תִּשָּׁאַרְנָה
  choice: அவை எஞ்சியிருக்கும்
  rationale: שׁאר என்பதன் நிபால் வடிவம் தரும் ‘எஞ்சியிருத்தல்/மீதியாயிருத்தல்’ என்ற பொருளை வெளிப்படுத்துகிறது.
