  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽ/עִמָּ/ךְ֙ וְ/הַעְתַּרְתִּ֣י אֶל יְהוָ֔ה וְ/סָ֣ר הֶ/עָרֹ֗ב מִ/פַּרְעֹ֛ה מֵ/עֲבָדָ֥י/ו וּ/מֵ/עַמּ֖/וֹ מָחָ֑ר רַ֗ק אַל יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְ/בִלְתִּי֙ שַׁלַּ֣ח אֶת הָ/עָ֔ם לִ/זְבֹּ֖חַ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: ta
  text: மோசே, “இதோ, நான் உம்மிடமிருந்து புறப்பட்டுச் சென்று, யாவேயிடம் மன்றாடுவேன். நாளை அந்தத் திரள்[a] பார்வோனிடமிருந்தும், அவனுடைய பணியாளர்களிடமிருந்தும், அவனுடைய மக்களிடமிருந்தும் விலகிப்போகும். ஆனால், யாவேக்குப் பலியிட மக்களைப் போகவிடாமல் பார்வோன் இனியும் வஞ்சிக்கக் கூடாது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான עָרֹב என்பது குறிப்பாக ஈக்களின் திரளையோ, வேறு கூட்டமாகச் செல்லும் பூச்சிகளையோ குறிக்கலாம்; அது சரியாக எதைக் குறிக்கிறது என்பது உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: மோசேயின் கூற்றுக்குக் கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் உடனடித் தன்மையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יוֹצֵא מֵעִמָּךְ
  choice: உம்மிடமிருந்து புறப்பட்டுச் சென்று
  rationale: יצא என்பதன் இயக்கப் பொருளையும் מֵעִמָּךְ என்பதன் ‘உம்மிடமிருந்து’ என்ற பொருளையும் தெளிவாகப் பேணுகிறது.
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: யாவேயிடம் மன்றாடுவேன்
  rationale: עתר இங்கு பொதுவான வேண்டுதலைவிட தீவிரமான பரிந்துபேசுதலைக் குறிக்கிறது; ‘மன்றாடுவேன்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான יהוה-ஐ ‘ஆண்டவர்’ போன்ற பட்டப்பெயராக மாற்றாமல், Yahweh என்பதற்குரிய தமிழொலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְסָר
  choice: விலகிப்போகும்
  rationale: திரள் தானாக அங்கிருந்து நீங்கும் என்ற வினையெச்சமற்ற இயக்கப் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: הֶעָרֹב
  choice: அந்தத் திரள்
  rationale: குறிப்பிட்ட உயிரினம் எது என்பது உறுதியற்றதால் ‘ஈக்கள்’ என்று மிகையாகத் தீர்மானிக்காமல், கூட்டமாக வரும் தொல்லையின் பொருளைப் பேணுகிறது.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: பார்வோனிடமிருந்தும், அவனுடைய பணியாளர்களிடமிருந்தும், அவனுடைய மக்களிடமிருந்தும்
  rationale: மூன்று தரப்புகளுக்கும் முன் எபிரெயத்தில் மீண்டும் வரும் முன்னிடைச்சொல்லின் வலியுறுத்தலையும் முழு பரப்பையும் தமிழின் ‘-இடமிருந்தும்’ தொடரால் காக்கிறது.
- source_word: מָחָר
  choice: நாளை
  rationale: எளிய காலக் குறிப்பின் நேரடியான தமிழ் வடிவம்.
- source_word: רַק
  choice: ஆனால்
  rationale: அடுத்து வரும் கட்டுப்பாடு மற்றும் எச்சரிக்கைக்கான மாறுபாட்டை இயல்பான தமிழில் குறிக்கிறது.
- source_word: אַל יֹסֵף ... הָתֵל
  choice: பார்வோன் இனியும் வஞ்சிக்கக் கூடாது
  rationale: יסף என்பதன் ‘இனியும்/மீண்டும் தொடருதல்’ என்ற கூறையும் התל என்பதன் ஏமாற்றும், இகழ்ச்சியான நடத்தைப் பொருளையும் சுருக்கமாகப் பேணுகிறது.
- source_word: לְבִלְתִּי שַׁלַּח
  choice: மக்களைப் போகவிடாமல்
  rationale: பார்வோனின் வஞ்சகம் எதில் அடங்குகிறது என்பதை—மக்களை விட மறுப்பதை—எபிரெய வாக்கிய உறவுக்கு ஏற்றபடி காட்டுகிறது.
- source_word: לִזְבֹּחַ
  choice: பலியிட
  rationale: זבח குறிக்கும் பலிசெலுத்தும் வழிபாட்டின் குறிப்பிட்ட பொருளை ‘வழிபட’ என்று பொதுமைப்படுத்தாமல் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் திருநாமம் நேரடியாக இருப்பதால் அதை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது; ‘யெகோவா’ என்பதற்குப் பதில் Yahweh-க்கு நெருக்கமான ‘யாவே’ தேர்ந்தெடுக்கப்பட்டது.
- issue: עָרֹב என்பதன் உயிரியல் அடையாளம்
  choice: அந்தத் திரள்
  alternative: ஈக்களின் திரள் / கலப்புத் திரள்
  rationale: அது ஈக்களையோ வேறு கூட்டமாகச் செல்லும் பூச்சிகளையோ உயிரினங்களையோ குறிக்கலாம்; மூலத்தின் உறுதியின்மையை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பேணுகிறது.
- issue: התל என்பதன் வஞ்சகம்–பரிகாசம் சார்ந்த நிழற்பொருள்
  choice: வஞ்சிக்க
  alternative: பரிகசிக்க / ஏமாற்றி விளையாட
  rationale: இச்சூழலில் மக்களை அனுப்புவதாகக் கூறியும் அனுப்பாத பார்வோனின் மோசடியே முன்னிலையில் உள்ளது. ‘வஞ்சிக்க’ அந்தப் பொருளைத் தருகிறது; அதிலுள்ள இகழ்ச்சித் தொனி முழுமையாகத் தீர்மானிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டது. பார்வோனிடம் பேசும் மரியாதைப் பன்மைக்காக ‘உம்மிடமிருந்து’ வந்தாலும், எபிரெய மூன்றாம் நபர் எச்சரிக்கையைப் பேண ‘பார்வோன்’ என்ற பெயர் தொடர்கிறது. அடிக்குறிப்பு குறியீடு அதன் பொருளான ‘திரள்’ என்பதற்குப் பின் வைக்கப்பட்டது.
