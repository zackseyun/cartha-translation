  yaml_path: translation/ot/exodus/008/010.yaml
  text: And they piled them up in heap after heap[a], and the land stank.
translation:
  language: ta
  text: அவர்கள் அவற்றைக் குவியல் குவியலாகக் குவித்தார்கள்[a]; நிலம் நாறியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குவியல்களாக’ அல்லது ‘குவியல்மேல் குவியலாக’; வலியுறுத்துவதற்காக எபிரெயத்தில் பெயர்ச்சொல் இருமுறை வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: குவித்தார்கள்
  rationale: צבר என்பது பொருட்களைச் சேர்த்துக் குவிப்பதைக் குறிக்கிறது. தவளைகளைப் பல குவியல்களாகக் குவித்த செயலை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: உடனடி முன்னிலையிலுள்ள தவளைகளைக் குறிக்கும் நேரடி வேற்றுமைச் சுட்டுப்பெயர். உயிரினங்களான தவளைகளை இங்கு கூட்டமாகச் சுட்டுவதற்கு ‘அவற்றை’ இயல்பானது.
- source_word: חֳמָרִם חֳמָרִם
  choice: குவியல் குவியலாக
  rationale: எபிரெயத்தில் பெயர்ச்சொல் இருமுறை வருவது பல குவியல்களையும் வலியுறுத்தலையும் காட்டுகிறது. ‘குவியல் குவியலாக’ அந்த மீளுரைப்பையும் பகிர்ந்தளிக்கும் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַתִּבְאַשׁ
  choice: நாறியது
  rationale: באש கடுமையான துர்நாற்றம் வீசுவதைக் குறிக்கிறது. ‘நாறியது’ என்பது மூலத்தின் நேரடியான, வலுவான உணர்வைச் சுருக்கமாகத் தருகிறது.
- source_word: הָאָרֶץ
  choice: தேசம்
  rationale: இங்கு אֶרֶץ கொள்ளைநோயால் பாதிக்கப்பட்ட நாடு அல்லது நிலப்பரப்பைக் குறிக்கிறது; முழு பூமியைக் குறிக்கவில்லை. யாத்திராகமச் சூழலில் ‘தேசம்’ இந்தப் பொருளைத் தெளிவாகத் தருகிறது.
