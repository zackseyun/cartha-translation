  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை. எபிரெய மூலத்தின் மீளுரைப்பை ‘குவியல் குவியலாக’ என்று காத்து, துர்நாற்றத்தின் வலிமையை ‘நாறியது’ என்று நேரடியாக வெளிப்படுத்துகிறது.
