  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: ta
  text: ஆனால் மோசே, “அப்படிச் செய்வது முறையல்ல. ஏனெனில், எகிப்தியர்களுக்கு அருவருப்பானதை நம் கடவுளாகிய யாவேக்குப் பலியிடுவோம்.[a] எகிப்தியர்களுக்கு அருவருப்பானதை அவர்கள் கண்முன்னே நாம் பலியிட்டால், அவர்கள் நம்மேல் கல்லெறிய மாட்டார்களா?” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “எகிப்தின் அருவருப்பு.” இத்தொடர், எகிப்தியர்கள் அருவருப்பாகக் கருதியதைக் குறிப்பதாக இருக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: முறையல்ல
  rationale: இச்சூழலில் ஏற்றது, தகுந்தது, சரியானது என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לַעֲשׂוֹת כֵּן
  choice: அப்படிச் செய்வது
  rationale: ‘இவ்வாறு செய்வது’ என்ற எபிரேய மரபுத்தொடரை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: எகிப்தியர்களுக்கு அருவருப்பானது
  rationale: இணைப்புத் தொடரிலுள்ள உண்மையான பொருள் இருமையை அடிக்குறிப்பில் வைத்துக்கொண்டு, சூழலுக்கு மிகவும் பொருந்தும் நோக்குநிலைப் பொருளை முதன்மை உரையில் தருகிறது.
- source_word: נִזְבַּח
  choice: பலியிடுவோம் / நாம் பலியிட்டால்
  rationale: முதல் இடத்தில் பார்வோனின் முன்மொழிவின்கீழ் நிகழவிருக்கும் செயலைக் குறிக்கிறது; இரண்டாம் இடத்தில் வெளிப்படையான நிபந்தனைச் சூழலுக்கு ஏற்றவாறு தரப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து பாதுகாக்கிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய
  rationale: முதல் நபர் பன்மை உடைமையையும், யாவே யார் என்பதை விளக்கும் இணைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הֵן
  choice: …பலியிட்டால்
  rationale: இங்கு வியப்பிடைச்சொல்லாக அல்லாமல் உயிரோட்டமான நிபந்தனையை அறிமுகப்படுத்துவதால், தமிழ் நிபந்தனை விகுதி பொருத்தமாக உள்ளது.
- source_word: לְעֵינֵיהֶם
  choice: அவர்கள் கண்முன்னே
  rationale: ‘அவர்களுடைய கண்களுக்கு முன்பாக’ என்ற காட்சித் தெளிவை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: יִסְקְלֻנוּ
  choice: நம்மைக் கல்லெறிந்து கொல்ல
  rationale: סקל குறிக்கும் கல்லெறிதலைத் தெளிவாகத் தருவதோடு, இங்கு எதிர்பார்க்கப்படும் உயிர்க்கொல்லும் வன்முறையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நான்கெழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது; ‘யாவே’ என்பது அந்தத் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பெயராகவே பாதுகாக்கிறது.
- issue: תּוֹעֲבַת מִצְרַיִם என்பதன் பொருள்
  choice: எகிப்தியர்களுக்கு அருவருப்பானது
  alternative: எகிப்தின் அருவருப்பு
  rationale: எகிப்தியர்கள் காணும்போது வன்முறையாக எதிர்வினையாற்றுவார்கள் என்பதே வாதத்தின் தர்க்கம். ஆகவே அவர்கள் அருவருப்பாகக் கருதுவது என்ற பொருள் சூழலுக்கு ஏற்றது; இலக்கண ரீதியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘முறையல்ல’, ‘கண்முன்னே’ போன்ற இயல்பான சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் வினாவியல் அழுத்தமும் பொருள் இருமையும் பாதுகாக்கப்பட்டுள்ளன.
