base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: ta
  text: அவர்கள் அப்படியே செய்தார்கள். ஆரோன் தன் கையைக் கோலோடு நீட்டி, நிலத்தின் புழுதியை அடித்தார். அப்போது பேன்கள்[a] மனிதர்கள் மீதும் கால்நடைகள் மீதும் வந்தன. எகிப்து நாடு முழுவதிலும் நிலத்தின் புழுதியெல்லாம் பேன்களாக மாறியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பேன்கள்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல்லின் துல்லியமான பூச்சியினம் உறுதியாகத் தெரியவில்லை; அது சிறுகொசுக்கள் போன்ற சிறிய பறக்கும் பூச்சிகளையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: அவர்கள் அப்படியே செய்தார்கள்
  rationale: முந்தைய கட்டளைக்குக் கீழ்ப்படிந்து அதன்படியே செய்ததைச் சுட்டும் எபிரெயக் கதைநடைச் சொற்றொடரை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיֵּט אַהֲרֹן אֶת יָדוֹ בְמַטֵּהוּ
  choice: ஆரோன் தன் கையைக் கோலுடன் நீட்டி
  rationale: கையையும் கோலையும் இணைக்கும் எபிரெயச் சொல்லமைப்பை மிகையாக விளக்காமல், உடனிருப்பு அல்லது கருவிப் பொருள் இரண்டுக்கும் இடமளிக்கிறது.
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  choice: நிலத்தின் புழுதியை அடித்தார்
  rationale: נכה என்பதன் தாக்கும் செயலை ‘அடித்தார்’ தெளிவாகத் தருகிறது; עֲפַר என்பதன் நுண்ணிய, உலர்ந்த மண் என்ற காட்சியை ‘புழுதி’ காக்கிறது.
- source_word: הַכִּנָּם / כִנִּים
  choice: பேன்கள்
  rationale: இச்சொல்லின் துல்லியமான உயிரியல் அடையாளம் உறுதியற்றது. தமிழில் அறியப்பட்ட மரபான பெயராக ‘பேன்கள்’ பயன்படுத்தப்பட்டு, வேறு சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: மனிதர்கள்மேலும் கால்நடைகள்மேலும்
  rationale: אָדָם இங்கு மனிதர்களைக் கூட்டாகக் குறிக்கிறது; בְּהֵמָה இச்சூழலில் வளர்ப்பு விலங்குகளைச் சுட்டுவதால் ‘கால்நடைகள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: כָּל עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: நிலத்தின் புழுதியெல்லாம் பேன்களாக மாறியது
  rationale: כָּל என்பதன் முழுமையையும் היה என்பதன் விளைவுநிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடு முழுவதிலும்
  rationale: எகிப்தின் எல்லாப் பகுதிகளிலும் நிகழ்ந்தது என்ற பரவலான பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: אָדָם என்ற கூட்டுப்பெயரின் மொழிபெயர்ப்பு
  choice: மனிதர்கள்
  alternative: மனிதகுலம் / மனிதன்
  rationale: இங்கு ஆண்களை மட்டும் அல்லாமல் மனிதர்களை ஒட்டுமொத்தமாக விலங்குகளுடன் ஒப்பிட்டுக் குறிப்பிடுகிறது. ‘மனிதர்கள்’ தமிழில் அந்தக் கூட்டுப்பொருளைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நிலத்தின் புழுதி’ என்ற மீளுருவாக்கம் மூலத்தின் காட்சியையும் சொல்லமைப்பையும் காக்கிறது; பூச்சியினத்தின் உறுதியின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
