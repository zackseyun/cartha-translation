  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֗ן וַ/יֹּ֨אמֶר֙ הַעְתִּ֣ירוּ אֶל יְהוָ֔ה וְ/יָסֵר֙ הַֽ/צְפַרְדְּעִ֔ים מִמֶּ֖/נִּי וּ/מֵֽ/עַמִּ֑/י וַ/אֲשַׁלְּחָה֙ אֶת הָ/עָ֔ם וְ/יִזְבְּח֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: ta
  text: அப்போது பார்வோன் மோசேயையும் ஆரோனையும் அழைத்து, “யெகோவாவிடம் மன்றாடுங்கள்[a]; அவர் என்னிடமிருந்தும் என் மக்களிடமிருந்தும் தவளைகளை அகற்றட்டும். நான் மக்களைப் போகவிடுவேன்; அவர்கள் யெகோவாவுக்குப் பலியிடும்படி[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மன்றாடுங்கள்” என்பதற்கான எபிரெய வினை, சாதாரண ஜெபத்தை மட்டுமல்லாமல், தீவிரமாக வேண்டுதல் அல்லது பரிந்துபேசுதல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவர்கள் யெகோவாவுக்குப் பலியிடட்டும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் எளிய இணைப்பாகவும் வாசிக்கப்படலாம்; இங்கு மக்களைப் போகவிடுவதன் நோக்கத்தையும் அது குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... לְמֹשֶׁה וּלְאַהֲרֹן
  choice: மோசேயையும் ஆரோனையும் அழைத்து
  rationale: קרא உடன் לְ வருவது ஒருவரை வரவழைப்பதை அல்லது அழைப்பதை குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் ‘அழைத்து’ என வழங்கப்பட்டுள்ளது.
- source_word: הַעְתִּירוּ
  choice: மன்றாடுங்கள்
  rationale: עתר என்பதன் ஹிஃபில் வடிவம் சாதாரணமாக ஜெபிப்பதைவிட வற்புறுத்திக் கெஞ்சுதல் அல்லது பரிந்துபேசுதல் என்ற வலிமையான நுண்பொருளைக் கொண்டது; ‘மன்றாடுங்கள்’ அதை இயல்பாகக் காக்கிறது.
- source_word: אֶל יְהוָה / לַיהוָה
  choice: யெகோவாவிடம் / யெகோவாவுக்கு
  rationale: יהוה என்ற தனிப்பட்ட இறைப்பெயர் பெயராகவே ஒலிபெயர்க்கப்பட்டுள்ளது; வேற்றுமை உருபுகள் வினைகளுக்கு ஏற்றவாறு அமைக்கப்பட்டுள்ளன.
- source_word: וְיָסֵר
  choice: அவர் ... அகற்றட்டும்
  rationale: סור என்பதன் ஹிஃபில் வடிவம் ‘அகற்று’ என்று பொருள்படும். மன்றாட்டின் வேண்டுகோள் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தமிழ் வியங்கோள் வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִמֶּנִּי וּמֵעַמִּי
  choice: என்னிடமிருந்தும் என் மக்களிடமிருந்தும்
  rationale: இருமுறை வரும் מִן முன்னிடைச்சொல்லின் வலியுறுத்தல் இரு ‘-இடமிருந்தும்’ வடிவங்களால் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַאֲשַׁלְּחָה אֶת־הָעָם
  choice: நான் அந்த மக்களைப் போகவிடுவேன்
  rationale: கோஹோர்ட்டேட்டிவ் வடிவம் பார்வோனின் உறுதி அல்லது அறிவிக்கப்பட்ட நோக்கத்தைச் சுட்டுகிறது; யாத்திராகமத்தில் திரும்பத் திரும்ப வரும் ‘மக்களைப் போகவிடு’ என்ற கருத்தும் காக்கப்படுகிறது.
- source_word: וְיִזְבְּחוּ
  choice: அவர்கள் ... பலியிடட்டும்
  rationale: זבח என்பது பலியிடுதலைக் குறிக்கிறது. இணைப்பின் துல்லியமான உறவு எபிரெயத்தில் ஓரளவு திறந்திருக்குவதால், முதன்மை உரையில் எளிய இணைப்பை அணுகும் வியங்கோள் வடிவம் பயன்படுத்தப்பட்டுள்ளது; நோக்கப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்படும் பெயர்வடிவமான ‘யெகோவா’ பயன்படுத்தப்படுகிறது; ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் தனிப்பட்ட பெயர் மாற்றப்படவில்லை.
- issue: பார்வோனின் இறுதிக் கூற்றின் தொடர்பு
  choice: 'எளிய இணைப்பு/அனுமதி: ‘அவர்கள் ... பலியிடட்டும்’'
  alternative: 'நோக்கம்: ‘அவர்கள் ... பலியிடும்படி’'
  rationale: וְיִזְבְּחוּ என்பது முன் வரும் வாக்குறுதியின் நோக்கமாகப் புரிந்துகொள்ளப்படலாம்; அதேவேளை வாவ் இணைப்புடன் வரும் வினையாக எளிய ஒருங்கிணைப்பையும் அனுமதிக்கிறது. முதன்மை உரை அந்தத் திறந்த தன்மையை ஓரளவு காக்கிறது; நோக்க வாசிப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மன்றாடுங்கள்’ மூல வினையின் தீவிரத்தைக் காக்கிறது; ‘போகவிடுவேன்’ யாத்திராகமக் கதைநடையின் மீளும் சொல்லாட்சியை இயல்பாகப் பிரதிபலிக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
