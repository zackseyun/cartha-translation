source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: ta
  text: அப்போது மந்திரவாதிகள் பார்வோனிடம், “இது கடவுளின் விரல்[a]” என்றார்கள். ஆனால் பார்வோனின் இதயம் இறுகிப்போனது[b]. யாவே[c] கூறியிருந்தபடியே, அவன் அவர்களுக்குச் செவிகொடுக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடவுளின் விரல்” என்பது கடவுளுடைய வல்லமை நேரடியாகச் செயல்படுவதைக் குறிக்கும் உருவகம்.
    reason: cultural_note
  - marker: b
    text: “பார்வோனின் இதயம் வலுவடைந்தது” என்றும் மொழிபெயர்க்கலாம். இந்தக் கூற்றில் அதை இறுகச் செய்தவர் யார் என்று எபிரெய உரை வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் YHWH; மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: மந்திரவாதிகள்
  rationale: எகிப்திய அரசவையுடன் தொடர்புடைய சடங்கு மற்றும் மந்திரக் கலை நிபுணர்களைக் குறிக்கிறது. அவர்களுடைய பங்கை அளவுக்கு மீறி விளக்காமல், நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: இது கடவுளின் விரல்
  rationale: வினைச்சொல் இல்லாத எபிரெயச் சொற்றொடரை இயல்பான தமிழில் தருவதோடு, நேரடியாகச் செயல்படும் தெய்வீக வல்லமையைக் குறிக்கும் உருவகத்தையும் அப்படியே காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் ஒருமைப்பட்ட தெய்வீகக் குறிப்பே மிகவும் இயல்பானது. தமிழில் பொதுவாகப் புரியும் ‘கடவுள்’ என்பது அந்தப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: பார்வோனின் இதயம் இறுகிப்போனது
  rationale: חזק இங்கு இதயம் உறுதியடைந்து பிடிவாதமாக மாறிய நிலையைச் சுட்டுகிறது. இந்தத் தமிழ் வடிவம் கடினமாதலின் செய்பவர் யார் என்பதை உரை சொல்லாதபோது சேர்த்துவிடாமல், விளைவு நிலையை இயல்பாகத் தருகிறது.
- source_word: שָׁמַע אֲלֵהֶם
  choice: அவர்களுக்குச் செவிகொடுக்கவில்லை
  rationale: ‘கேட்டல்’ என்பதைக் காட்டிலும் ‘செவிகொடுத்தல்’ இங்கு கவனித்து ஏற்றுக்கொள்ளுதல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: யாவே கூறியிருந்தபடியே
  rationale: முன்னதாகக் கூறப்பட்ட தெய்வீக அறிவிப்பைச் சுட்டும் சூத்திரத்தைத் தமிழ் கதைநடையின் காலத் தொடர்புக்கு ஏற்றவாறு தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, எபிரெயத் தனிப்பெயரான YHWH. ‘யாவே’ என்பது அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயரை மாற்றாக இடாமல் தனிப்பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: பார்வோனின் இதயம் கடினமானதில் செய்பவர் யார்?
  choice: பார்வோனின் இதயம் இறுகிப்போனது
  alternative: பார்வோன் தன் இதயத்தை இறுகச் செய்தான் / கடவுள் பார்வோனின் இதயத்தை இறுகச் செய்தார்
  rationale: இக்கூற்றில் கடினமாதலின் செய்பவர் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. ஆகவே கடவுளையோ பார்வோனையோ வெளிப்படையான செய்பவராகச் சேர்க்காமல் மூலத்தின் இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதயம் இறுகிப்போனது’ என்பது இயல்பான தமிழ் வழக்கைத் தக்கவைத்தபடியே செய்பவரைப் பற்றிய மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்களுக்குப் பின்பே இடப்பட்டுள்ளன.
