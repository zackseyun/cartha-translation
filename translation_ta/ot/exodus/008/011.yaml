  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּ֤י הָֽיְתָה֙ הָֽ/רְוָחָ֔ה וְ/הַכְבֵּד֙ אֶת לִבּ֔/וֹ וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: ta
  text: ஆனால், நிவாரணம் ஏற்பட்டிருப்பதைப் பார்வோன் கண்டபோது, அவன் தன் இதயத்தைக் கடினப்படுத்தி, அவர்களுக்குச் செவிகொடுக்கவில்லை; யாவே கூறியிருந்தபடியே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘காணுதல்’ என்பதைக் காத்து, சூழ்நிலையில் ஏற்பட்ட மாற்றத்தைப் பார்வோன் உணர்ந்தான் என்ற இயல்பான தமிழ்ப் பொருளையும் தருகிறது.
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: விடுதலை கிடைத்ததை
  rationale: הָרְוָחָה என்பது நெருக்கடி தணிந்து கிடைக்கும் விடுதலை, இளைப்பாறுதல் அல்லது அவகாசத்தைக் குறிக்கிறது; வாதையிலிருந்து கிடைத்த தற்காலிக நிவாரணத்தை இங்கு ‘விடுதலை’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְהַכְבֵּד אֶת־לִבּוֹ
  choice: தன் இதயத்தைக் கடினப்படுத்திக்கொண்டு
  rationale: כבד என்பதன் சொற்பொருள் ‘கனமாக்குதல்’; இதயத்துடன் வரும் இந்த யாத்திராகம உருவகம் பிடிவாதமாக்குதலைக் குறிக்கிறது. செயப்படுபொருள் சார்ந்த மங்கலை உருவாக்காமல், இங்கு பார்வோனே செய்பவன் என்பதைத் தமிழ் தெளிவாகக் காக்கிறது.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: அவர்களுக்குச் செவிகொடுக்கவில்லை
  rationale: שׁמע אֶל என்பது ‘செவிகொடுத்தல்/கவனித்துக் கேட்டல்’ எனப் பொருள்படும். ‘கீழ்ப்படியவில்லை’ என்று மிகையாகக் குறிப்பாக்காமல், மோசேக்கும் ஆரோனுக்கும் செவிசாய்க்க மறுத்ததை இயல்பாகச் சொல்கிறது.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: யெகோவா கூறியிருந்தபடியே
  rationale: முன்னர் உரைக்கப்பட்ட இறைவாக்கின்படியே நிகழ்ந்தது என்பதை ‘கூறியிருந்தபடியே’ காட்டுகிறது; יהוה தனிப்பெயராக ‘யெகோவா’ என்று ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: பார்வோனின் இதயம் கடினமானதற்கான செயற்பாடு
  choice: இந்த வசனத்தில் பார்வோன் தன் இதயத்தைத் தானே கடினப்படுத்தினான்.
  alternative: அவனுடைய இதயம் தானாகக் கடினமானது அல்லது இவ்வசனத்திலேயே கடவுள் அதை நேரடியாகக் கடினப்படுத்தினார்.
  rationale: எபிரெய வாக்கியத்தில் பார்வோனே எழுவாயாக இருந்து, כבד என்பதன் காரணவினை வடிவம் பயன்படுத்தப்பட்டுள்ளது. ஆகவே இவ்வசனத்தின் மனிதச் செயற்பாட்டைத் தெளிவாகக் காத்து, வேறு வசனங்களில் காணப்படும் இறைச் செயற்பாட்டை இதற்குள் திணிக்காமல் வேதத்தின் இறையியல் இழுவை நிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘இதயம் கடினப்படுத்துதல்’ என்ற யாத்திராகமத்தின் தொடர்ச்சியான உருவகம் காக்கப்பட்டுள்ளது. இவ்வசனத்தில் தனி அடிக்குறிப்பு அவசியமில்லை; הָרְוָחָה என்பதன் சூழல்சார் பொருள் ‘விடுதலை’ என்று முதன்மை உரையிலேயே இயல்பாக வழங்கப்பட்டுள்ளது.
