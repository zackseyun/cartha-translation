  text: וַ/יַּעֲשׂוּ כֵ֨ן הַ/חַרְטֻמִּ֧ים בְּ/לָטֵי/הֶ֛ם לְ/הוֹצִ֥יא אֶת הַ/כִּנִּ֖ים וְ/לֹ֣א יָכֹ֑לוּ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: ta
  text: மந்திரவாதிகளும் தங்கள் இரகசியக் கலைகளால் பேன்களை[a] உண்டாக்க அதேபோல் செய்தார்கள்; ஆனால் அவர்களால் அவற்றை உண்டாக்க முடியவில்லை. பேன்கள் மனிதர்கள் மீதும் விலங்குகள் மீதும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறு கொசுக்கள்.” இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெயச் சொல் எந்தப் பூச்சியைக் குறிக்கிறது என்பது உறுதியல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: மந்திரவாதிகள்
  rationale: பார்வோனின் அரண்மனையில் சடங்கு மற்றும் மந்திரச் செயல்களில் ஈடுபட்ட நிபுணர்களைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் மிகையாக விளக்காமலும் உள்ளது.
- source_word: בְּלָטֵיהֶם
  choice: தங்கள் இரகசியக் கலைகளால்
  rationale: மறைவான அல்லது மந்திரத்தன்மையுள்ள நடைமுறைகளைக் குறிக்கும் மூலச்சொல்லின் பொருளைப் பேணுகிறது.
- source_word: לְהוֹצִיא
  choice: உண்டாக்க
  rationale: சொல்லடியாக ‘வெளியே கொண்டுவர’ என்றாலும், இச்சூழலில் பூச்சிகளை உருவாகச் செய்யும் முயற்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: பேன்கள்
  rationale: குறிப்பிட்ட பூச்சியினம் உறுதியற்றது. தமிழில் பரவலாக அறியப்பட்ட பொருத்தமான பெயராக ‘பேன்கள்’ தேர்ந்தெடுக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא יָכֹלוּ
  choice: ஆனால் அவர்களால் முடியவில்லை
  rationale: அவர்களுடைய இயலாமையை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בָּאָדָם
  choice: மனிதர்கள்மேல்
  rationale: ஆדָם இங்கு தனி ஆணை அல்ல, மனிதர்களைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் பன்மை வடிவம் அந்தப் பொதுப்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וּבַבְּהֵמָה
  choice: விலங்குகள்மேல்
  rationale: בְּהֵמָה இங்கு விலங்குகளைத் தொகுப்பாகக் குறிக்கிறது; ‘விலங்குகள்’ என்பது கால்நடைகள் என்று தேவையின்றிக் குறுக்காமல் இயல்பான இணைப்பை வழங்குகிறது.
theological_decisions:
- issue: אָדָם என்பதன் தொகுப்புப் பொருள்
  choice: மனிதர்கள்
  alternative: மனிதன்
  rationale: எபிரெய ஒருமை வடிவம் தொகுப்பாக மனிதகுலத்தைக் குறிக்கிறது. தமிழ் ஒருமையான ‘மனிதன்’ ஆண் தனிநபர் எனத் தவறாகப் புரியக்கூடும்; ‘மனிதர்கள்’ மூலத்தின் உள்ளடக்கப் பொருளைத் துல்லியமாகத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மனிதர்–விலங்கு இணை அமைப்பு பேணப்பட்டுள்ளது; பூச்சியின் அடையாளம் குறித்த உறுதியின்மை அடிக்குறிப்பில் வெளிப்படையாகத் தரப்பட்டுள்ளது.
