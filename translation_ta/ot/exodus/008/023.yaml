base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: ta
  text: “நாங்கள் மூன்று நாள் பயணத் தொலைவு வனாந்தரத்துக்குள் சென்று, எங்கள் கடவுளாகிய யாவே எங்களுக்குச் சொல்வதன்படியே அவருக்குப் பலியிடுவோம்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாள் பயணத் தொலைவு
  rationale: דֶּרֶךְ என்பதுடன் கால அளவு சேரும்போது, அந்தக் காலம் எடுத்துக்கொள்ளும் பயணத்தையோ தொலைவையோ குறிக்கிறது. இந்தத் தமிழாக்கம் அதை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: נֵלֵךְ
  choice: நாங்கள் ... சென்று
  rationale: முதல் நபர் பன்மை வினை இச்சூழலில் எதிர்கால நோக்கைத் தருகிறது; தொடரும் וְזָבַחְנוּ உடன் இயல்பான தமிழ் வாக்கியமாக இணைக்கப்பட்டுள்ளது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்துக்குள்
  rationale: מִדְבָּר என்பது மணற்பாலையை மட்டும் அல்லாமல் மக்கள் குடியிராத திறந்த நிலப்பகுதியையும் குறிக்கலாம். இயக்கத்தைக் காட்டும் נֵלֵךְ காரணமாக ‘வனாந்தரத்துக்குள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְזָבַחְנוּ
  choice: பலியிடுவோம்
  rationale: זבח என்பது பலியாக அறுத்துப் படைப்பதைக் குறிக்கும் வழிபாட்டுச் சொல். ‘பலியிடுவோம்’ அதன் செயலும் வழிபாட்டுப் பொருளும் தெளிவாகத் தருகிறது.
- source_word: לַיהוָה
  choice: யாவே ... அவருக்குப்
  rationale: יהוה என்ற தனிப்பட்ட இறைப் பெயர் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. தமிழில் இயல்பாக இருக்க, பலியின் பெறுநர் ‘அவருக்குப்’ எனத் தொடரில் வெளிப்படுத்தப்படுகிறார்.
- source_word: אֱלֹהֵינוּ
  choice: எங்கள் கடவுளாகிய
  rationale: முதல் நபர் பன்மை உடைமைப் பின்னொட்டின் பொருளை நேரடியாகக் காத்து, யாவே யார் என்பதை அடையாளப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר
  choice: சொல்வதன்படியே
  rationale: இங்கு כַּאֲשֶׁר ஒப்புமையைவிட, இறை அறிவுறுத்தலுக்கு இணங்கச் செய்வதைக் குறிக்கிறது; ‘படியே’ அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יֹאמַר אֵלֵינוּ
  choice: எங்களுக்குச் சொல்வது
  rationale: எபிரெய இறந்தகாலமல்லா வினைவடிவம் நிகழ் அல்லது எதிர்நோக்கிய அறிவுறுத்தலைக் குறிக்கக்கூடும். காலத்தைக் கட்டாயமாகத் தீர்மானிக்காத ‘சொல்வது’ என்ற வடிவம் அந்தத் திறந்த தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, உடன்படிக்கையின் தனிப்பட்ட இறைப் பெயரே உள்ளது. ஆகவே பெயரை மறைக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: יֹאמַר என்பதன் காலப் பொருள்
  choice: சொல்வதன்படியே
  alternative: சொல்லப்போவதன்படியே
  rationale: எபிரெய வடிவம் இச்சூழலில் எதிர்காலப் பொருளைக் கொள்ளலாம்; ஆனால் பொதுவான அல்லது எதிர்பார்க்கப்படும் அறிவுறுத்தலையும் குறிக்க முடியும். முதன்மை உரை காலத்தை மிகையாக நிர்ணயிக்காமல், மாற்றை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’, ‘பலியிடுவோம்’ ஆகியவை வேதாகமச் சூழலுக்குரிய பொருளைத் தக்கவைத்தாலும் சாதாரண வாசகருக்குப் புரியக்கூடியவை. வாக்கிய வரிசை தமிழின் இயல்புக்கேற்ப அமைக்கப்பட்டு, எபிரெய மூலத்தின் முக்கிய கூறுகள் அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
