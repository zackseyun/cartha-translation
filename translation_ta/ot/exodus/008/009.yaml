translation:
  language: ta
  text: மோசே சொன்னபடியே ஆண்டவர் செய்தார். வீடுகளிலும் முற்றங்களிலும் வயல்களிலும் இருந்த தவளைகள் செத்துப்போயின.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயருக்கான மரியாதைமிக்க, தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் பிரதிநிதிப்பு.
- source_word: כִּדְבַר מֹשֶׁה
  choice: மோசே சொன்னபடியே
  rationale: எபிரேய மொழியின் ‘மோசேயின் வார்த்தையின்படி’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיָּמֻתוּ הַצְפַרְדְּעִים
  choice: தவளைகள் செத்துப்போயின
  rationale: விலங்குகள் இறந்ததைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: מִן הַבָּתִּים מִן הַחֲצֵרֹת וּמִן הַשָּׂדֹת
  choice: வீடுகளிலும் முற்றங்களிலும் வயல்களிலும் இருந்த
  rationale: מִן என்பதன் இடம்சார்ந்த பொருளை தமிழில் இயல்பாக வெளிப்படுத்துகிறது; தவளைகள் அந்த இடங்களிலிருந்து நீங்கின என்பதற்குப் பதிலாக அங்கிருந்தவை இறந்தன என்ற எபிரேய வாக்கிய உறவைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற உடன்படிக்கைப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / யாவே
  rationale: தமிழ் வேதாகம நடையில் அறிமுகமான மரியாதைப் பிரதிநிதிப்பை பயன்படுத்துகிறது; குறிப்பிட்ட உச்சரிப்பைத் தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது.
