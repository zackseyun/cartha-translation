base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: ta
  text: யாவே மோசேயின் வார்த்தையின்படி செய்தார்; பார்வோனிடமிருந்தும், அவனுடைய பணியாளர்களிடமிருந்தும், அவனுடைய மக்களிடமிருந்தும் அந்தப் பூச்சிக்கூட்டத்தை[a] அகற்றினார். ஒன்றுகூட எஞ்சவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஈக்கூட்டங்களை.’ எபிரெயச் சொல் עָרֹב கூட்டமாக வரும் பூச்சிகளால் ஏற்பட்ட வாதையைக் குறிக்கிறது; ஆனால் அந்தச் சொல்லே அவற்றின் துல்லியமான இனத்தைக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பட்டமாக மாற்றாமல், தமிழில் அதன் தனிப்பெயர் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עשה என்பதன் பொதுவான ‘செய்’ என்ற பொருளையும், ‘மோசேயின் வார்த்தையின்படி’ என்னும் தொடருடனான இயல்பான தமிழ்நடையையும் காக்கிறது.
- source_word: כִּדְבַר מֹשֶׁה
  choice: மோசேயின் வார்த்தையின்படியே
  rationale: דבר என்பதன் ‘வார்த்தை/சொல்’ பொருளைப் பேணுகிறது; -ஏ என்பது யாவே மோசே சொன்னதற்கு இணங்கச் செய்தார் என்ற வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיָּסַר
  choice: அகற்றினார்
  rationale: Hiphil வடிவிலுள்ள סור இங்கு ‘அகற்று’ என்று பொருள்பட்டு, கொள்ளைநோயின் கூட்டத்தை நீக்கிய செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: הֶעָרֹב
  choice: அந்தப் பூச்சிக்கூட்டத்தை
  rationale: עָרֹב குறிப்பிடும் துல்லியமான உயிரின வகை உறுதியல்ல; கொள்ளைநோயின் சூழலில் கூட்டமாக வந்த பூச்சிகளைச் சுட்டும் இயல்பான தமிழ் சொற்றொடர் இது, ஆனால் ‘ஈக்கள்’ என்று அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: பார்வோனிடமிருந்தும், அவனுடைய பணியாளர்களிடமிருந்தும், அவனுடைய மக்களிடமிருந்தும்
  rationale: மூன்று உறுப்புகளிலும் மீண்டும் வரும் מִן முன்னிடைச்சொல்லின் பிரித்துக் காட்டும் வலியுறுத்தலை ‘-இடமிருந்தும்’ என ஒவ்வொன்றிலும் பேணுகிறது.
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: ஒன்றுகூட எஞ்சவில்லை
  rationale: אֶחָד என்பதன் ஒருமை வலியுறுத்தலை ‘ஒன்றுகூட’ என்றும், שׁאר என்பதைக் ‘எஞ்சவில்லை’ என்றும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பட்டமல்லாமல் திருப்பெயரே நேரடியாக இருப்பதால், அதை ‘கர்த்தர்’ என்று மாற்றாமல் தமிழில் ஒலிபெயர்த்துப் பாதுகாக்கிறது.
- issue: עָרֹב என்பதன் துல்லிய அடையாளம்
  choice: பூச்சிக்கூட்டம்
  alternative: ஈக்கூட்டம்; கலப்புக் கூட்டம்
  rationale: எபிரெயச் சொல் கொள்ளைநோயாக வந்த திரளைக் குறிக்கிறது; ஆனால் அதன் துல்லியமான இனத்தைச் சொல்லவில்லை. எனவே உரையில் பொதுவான வடிவமும் அடிக்குறிப்பில் மாற்று விளக்கமும் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் தொடர் செயல்களையும், மூன்று முறை வரும் ‘இருந்தும்’ என்ற வலியுறுத்தலையும், இறுதியிலுள்ள ‘ஒன்றுகூட’ என்ற முழுமையான நீக்கத்தையும் பேணுகிறது.
