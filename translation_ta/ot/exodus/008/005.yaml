base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: ta
  text: 'மோசே பார்வோனிடம், “என்மேல் பெருமைகொள்ளுங்கள்[a]: உங்களிடமிருந்தும் உங்கள் வீடுகளிலிருந்தும் தவளைகள் ஒழிந்துபோகும்படி, உங்களுக்காகவும் உங்கள் பணியாளர்களுக்காகவும் உங்கள் மக்களுக்காகவும் நான் எப்போது மன்றாட வேண்டும்? நைல் நதியில் மட்டும் அவை எஞ்சியிருக்கும்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சூழல்பொருளாக, “நேரத்தை நீங்களே எனக்காகக் குறிப்பிடுங்கள்.” எபிரெய மொழிவழக்கு கடினமானது; மோசே எப்போது மன்றாட வேண்டும் என்பதைப் பார்வோனே தேர்ந்தெடுக்கும்படி அவர் அழைக்கிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: இந்தப் பெருமையை என்மேல் எடுத்துக்கொள்ளுங்கள்
  rationale: இந்த அரியதும் கடினமுமான எபிரெய மொழிவழக்கு, பார்வோன் நேரத்தைத் தேர்ந்தெடுக்கும் சிறப்பை எடுத்துக்கொள்ளுமாறு மோசே அழைப்பதைச் சூழலில் குறிக்கிறது. முதன்மை உரை அதன் ‘பெருமை/மேன்மை கொள்ளுதல்’ என்ற உருவகத்தை இயன்றவரை காக்கிறது; தெளிவான சூழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמָתַי
  choice: எப்போது
  rationale: மோசே செய்யவிருக்கும் மன்றாட்டிற்கான நேரத்தைப் பார்வோன் தேர்ந்தெடுக்கும்படி கேட்கும் இயல்பான தமிழ் வினாவடிவம்.
- source_word: אַעְתִּיר
  choice: நான் மன்றாட வேண்டும்
  rationale: עתר என்பதன் Hiphil வடிவம் கடவுளிடம் தீவிரமாக வேண்டுதல் செய்வதைக் குறிக்கிறது. ‘மன்றாட’ என்பது சமயத் தொழில்நுட்பச் சொல்லாகச் சுருக்காமல், வேண்டுதலின் தீவிரத்தை வெளிப்படுத்துகிறது.
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: உங்களுக்காகவும் உங்கள் பணியாளர்களுக்காகவும் உங்கள் மக்களுக்காகவும்
  rationale: மூன்று தரப்புகளுக்கும் மீண்டும் வரும் எபிரெய முன்னிடைச்சொல்லின் பரப்பையும் வலியுறுத்தலையும் ‘-க்காகவும்’ என்ற மீளுருவாக்கம் காக்கிறது.
- source_word: לְהַכְרִית
  choice: ஒழிந்துபோகும்படி
  rationale: כרת என்பதன் அடிப்படை உருவகம் ‘வெட்டியகற்றுதல்’ என்றாலும், இங்கு தவளைகள் மனிதர்களிடமிருந்தும் வீடுகளிலிருந்தும் நீக்கப்படுவதை நோக்கமாகக் குறிக்கிறது. ‘ஒழிந்துபோகும்படி’ என்பது இயல்பான தமிழில் முழுமையான அகற்றலைத் தெரிவிக்கிறது.
- source_word: הַצֲפַרְדְּעִים
  choice: தவளைகள்
  rationale: வாதைக்குரிய உயிரினத்திற்கான நேரடியான தமிழ் இணை.
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: உங்களிடமிருந்தும் உங்கள் வீடுகளிலிருந்தும்
  rationale: பார்வோனைத் தனிப்பட்ட முறையிலும் அவரது வீடுகளைத் தனியாகவும் குறிப்பிடும் எபிரெய அமைப்பையும் இரு முன்னிடைத் தொடர்புகளையும் காக்கிறது.
- source_word: רַק
  choice: மட்டும்
  rationale: தவளைகள் எஞ்சும் ஒரே இடத்தை விதிவிலக்காக வரையறுக்கிறது.
- source_word: בַּיְאֹר
  choice: நைல் நதியில்
  rationale: யְאֹר என்பது யாத்திராகமத்தின் எகிப்தியச் சூழலில் குறிப்பாக நைல் நதியைக் குறிக்கிறது.
- source_word: תִּשָּׁאַרְנָה
  choice: அவை எஞ்சியிருக்கும்
  rationale: שׁאר என்பதன் Nifal வடிவத்திலுள்ள ‘எஞ்சியிருத்தல்/விடப்பட்டிருத்தல்’ என்ற பொருளை இயல்பாகத் தருகிறது.
