revisions:
- from: ஆனால் அந்த நாளில், என் மக்கள் குடியிருக்கிற கோசேன் நாட்டை நான் தனியே பிரித்து வைப்பேன். அங்கே பூச்சிக்கூட்டம்[a] இருக்காது. இதனால், நாட்டின் நடுவில்[b] யாவே நானே என்பதை நீ அறிந்துகொள்வாய்.
  to: ஆனால், அந்த நாளில் என் மக்கள் குடியிருக்கும் கோசேன் நிலப்பகுதியை, அங்கே பூச்சித் திரள்[a] இல்லாதபடி, நான் வேறுபடுத்துவேன். நாட்டின் நடுவில் நான், யாவே, இருக்கிறேன் என்பதை நீ அறியும்படியாக இதைச் செய்வேன்[b].
  rationale: The revision retains the draft’s lexical caution and its rendering of the divine name, while restoring the explicit purposive relation in the final clause. It also replaces a potentially physical sense of separation with the contextual sense of distinction and makes the final Hebrew locative assertion natural and complete in modern standard Tamil. The footnote anchors remain attached to the relevant expressions.
