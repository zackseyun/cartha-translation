base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: ta
  text: ஆனால், அந்த நாளில் என் மக்கள் குடியிருக்கும் கோசேன் நிலப்பகுதியை, அங்கே பூச்சித் திரள்[a] இல்லாதபடி, நான் வேறுபடுத்துவேன். நாட்டின் நடுவில் நான், யாவே, இருக்கிறேன் என்பதை நீ அறியும்படியாக இதைச் செய்வேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லின் துல்லியமான உயிரினக் குறிப்பு உறுதியில்லை. இதை ‘ஈக்களின் கூட்டம்,’ ‘பலவகைப் பூச்சிகளின் திரள்’ அல்லது பொதுவாக ‘திரள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பூமியின் நடுவில்.’ இச்சூழலில் இது பெரும்பாலும் எகிப்து நாட்டைக் குறிக்கிறது; ஆனால் எபிரெயச் சொல் விரிவாகப் ‘பூமி’ என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: தனியே பிரித்து வைப்பேன்
  rationale: פלא என்பதன் ஹிஃபில் வடிவம் இங்கு வேறுபடுத்துதல் அல்லது தனியாக நடத்துதல் என்பதைக் குறிக்கிறது. பாதுகாப்பின் விளைவை அளவுக்கு மீறி விளக்காமல், இயல்பான தமிழில் இந்தச் சொற்றொடர் வேறுபடுத்தி வைப்பதைத் தெரிவிக்கிறது.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: கோசேன் நாடு
  rationale: אֶרֶץ என்பது நாடு, நிலப்பகுதி, பிரதேசம் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு குறிப்பிட்ட புவியியல் பகுதியைக் குறிக்கும் இயல்பான தமிழ் வழக்கு ‘கோசேன் நாடு’.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: என் மக்கள் குடியிருக்கிற
  rationale: எழுத்துப்படி ‘அதன்மேல் நிற்கிற’ என்றிருந்தாலும், நிலப்பகுதியைப் பற்றிய இந்தச் சூழலில் עמד על அங்கே தங்கி வாழ்வதைக் குறிக்கிறது.
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: அங்கே ... இருக்காது
  rationale: இந்த இறைவினை அமைப்பு நோக்கம் அல்லது விளைவைச் சுட்டுகிறது. தமிழில் தெளிவான எதிர்மறை வாக்கியமாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: עָרֹב
  choice: பூச்சிக்கூட்டம்
  rationale: எந்த உயிரினம் என்பது உறுதியாகத் தெரியாததால் ‘ஈக்கள்’ என்று குறுக்காமல், தொல்லை தரும் பூச்சிகளின் திரள் என்ற பொதுப் பொருளை இயல்பான தமிழில் தருகிறது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: לְמַעַן תֵּדַע
  choice: இதனால் ... நீ அறிந்துகொள்வாய்
  rationale: לְמַעַן வெளிப்படுத்தும் நோக்கத்தைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது. வினைச்சொல்லின் இரண்டாம் நபர் ஆண்பால் ஒருமை, பார்வோனை நோக்கிய ‘நீ’ என்பதால் காக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயர். அதன் ‘Yahweh’ உச்சரிப்பை நவீன தமிழில் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: நாட்டின் நடுவில்
  rationale: בְּקֶרֶב என்பது ‘நடுவில்’ என்றும் הָאָרֶץ என்பது இச்சூழலில் நாடு அல்லது நிலம் என்றும் பொருள்படும். எகிப்து நாட்டைக் குறிக்கும் சூழல்சார் வாசிப்பு முதன்மைப்படுத்தப்பட்டாலும், விரிவான ‘பூமி’ வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரை தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல், அதன் ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பைத் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּקֶרֶב הָאָרֶץ என்பதன் பரப்பு
  choice: நாட்டின் நடுவில்
  alternative: பூமியின் நடுவில்
  rationale: உடனடிச் சூழல் எகிப்து நாட்டில் யாவேயின் செயல்பாட்டைக் குறிக்கிறது. ஆயினும் הָאָרֶץ என்பதற்கு ‘பூமி’ என்ற விரிவான பொருளும் சாத்தியம் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. நீளமான எபிரெய வாக்கியம் தமிழில் மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; நோக்கம், எதிர்மறை விளைவு, இறையறிவு ஆகிய தொடர்புகள் காக்கப்பட்டுள்ளன. ‘பூச்சிக்கூட்டம்’ என்பது குறிப்பிட்ட இனத்தை நிர்ணயிக்காமல் இயல்பாகப் புரியும் சொல்.
