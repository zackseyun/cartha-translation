  text: וַ/יַּ֤עַשׂ יְהוָה֙ כֵּ֔ן וַ/יָּבֹא֙ עָרֹ֣ב כָּבֵ֔ד בֵּ֥יתָ/ה פַרְעֹ֖ה וּ/בֵ֣ית עֲבָדָ֑י/ו וּ/בְ/כָל אֶ֧רֶץ מִצְרַ֛יִם תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ מִ/פְּנֵ֥י הֶ/עָרֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: ta
  text: யாவே அவ்வாறே செய்தார். மிகப் பெரும் திரள்[a] பார்வோனின் வீட்டுக்குள்ளும், அவருடைய பணியாளர்களின் வீடுகளுக்குள்ளும் வந்தது. எகிப்து நாடெங்கும் அந்தத் திரளினால் நிலம் பாழாயிற்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மிகுந்த திரள்.’ எந்த உயிரினங்களின் திரள் என்பதை எபிரெயச் சொல் துல்லியமாகக் குறிப்பிடவில்லை; மரபாக இது ஈக்களின் திரள் எனப் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தைப் பதிலிடாமல், எபிரெய தனிப்பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: அவ்வாறே செய்தார்
  rationale: முன்னறிவித்தபடியே யாவே செயல்பட்டார் என்ற பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיָּבֹא
  choice: வந்தது
  rationale: எளிய கதைநடை வினையைப் பிரதிபலிக்கிறது; தொடர்ந்து வரும் சொற்றொடர்கள் திரள் எங்கு வந்தது என்பதைத் தெளிவுபடுத்துகின்றன.
- source_word: עָרֹב
  choice: திரள்
  rationale: எந்த உயிரினங்களின் திரள் என்பது எபிரெயச் சொல்லில் உறுதியாக இல்லாததால், முதன்மை உரையில் ‘ஈக்கள்’ அல்லது ‘பூச்சிகள்’ என்று குறுக்காமல் அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: כָּבֵד
  choice: மிகப் பெரும்
  rationale: இங்கு ‘கனமான’ என்பது தமிழில் இயல்பாக இல்லாததால், அளவு அல்லது தீவிரத்தை உணர்த்தும் இயல்பான சமமான சொற்றொடர் பயன்படுத்தப்படுகிறது.
- source_word: בֵּיתָה פַרְעֹה
  choice: பார்வோனின் வீட்டுக்குள்
  rationale: திசையைக் காட்டும் எபிரெய வடிவை ‘வீட்டுக்குள்’ எனக் காக்கிறது; மூலத்தில் ‘அரண்மனை’ என்று இல்லாததால் ‘வீடு’ என்பதே பயன்படுத்தப்படுகிறது.
- source_word: וּבֵית עֲבָדָיו
  choice: அவருடைய பணியாளர்களின் வீடுகளுக்குள்
  rationale: பன்மையில் உள்ள பணியாளர்களுடன் ஒருமை ‘வீடு’ பகிர்ந்தளிப்பு பொருளில் வருவதை இயல்பான தமிழ்ப் பன்மையாகத் தருகிறது; ‘அதிகாரிகள்’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: எகிப்து நாடெங்கும்
  rationale: எகிப்தின் முழுப் பரப்பையும் குறிக்கும் மூலமொழியின் விரிவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: நிலம் பாழாயிற்று
  rationale: நிலம் கடுமையாகச் சேதமடைந்ததைத் தெரிவிக்கிறது; முற்றிலும் அழிந்துவிட்டது என்று மிகைப்படுத்துவதில்லை.
- source_word: מִפְּנֵי הֶעָרֹב
  choice: அந்தத் திரளினால்
  rationale: இங்குள்ள காரணப் பொருளைத் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்துகளாலான தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரைப் பதிலிடாமல் உடன்படிக்கையின் தனிப்பெயரை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘திரள்’ என்பதன் மூலம் மூலச்சொல்லின் உயிரின அடையாளத் தெளிவின்மை காக்கப்பட்டு, விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
