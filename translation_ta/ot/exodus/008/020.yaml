  source_fidelity: மூல எபிரெயத்தின் வினைவரிசை, இடவியல் விரிவு, மற்றும் காரண உறவு துல்லியமாகக் காக்கப்பட்டுள்ளன. עָרֹב என்பதன் உயிரின-அடையாளத் தெளிவின்மை முதன்மை உரையில் ‘திரள்’ எனப் பாதுகாக்கப்பட்டுள்ளது. כָּבֵד-இன் தீவிரம் ‘மிகப் பெரும்’ என இயல்பாகத் தெரிவிக்கப்படுகிறது; ‘நிலம் பாழாயிற்று’ என்பது תִּשָּׁחֵת הָאָרֶץ என்பதற்கு பொருத்தமானது.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘பார்வோனின் வீட்டுக்குள்ளும், அவருடைய பணியாளர்களின் வீடுகளுக்குள்ளும்’ என்பது மூலத்தின் பகிர்ந்தளிப்பு பொருளையும் ‘உள்ளே’ என்ற திசையையும் இயல்பாக வெளிப்படுத்துகிறது.
