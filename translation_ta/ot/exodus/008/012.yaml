  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹר֙ אֶֽל אַהֲרֹ֔ן נְטֵ֣ה אֶֽת מַטְּ/ךָ֔ וְ/הַ֖ךְ אֶת עֲפַ֣ר הָ/אָ֑רֶץ וְ/הָיָ֥ה לְ/כִנִּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: ta
  text: 'அப்போது யாவே மோசேயிடம், “ஆரோனிடம் சொல்: ‘உன் கோலை நீட்டி, நிலத்தின் புழுதியை அடி; அது எகிப்து நாடு முழுவதிலும் சிறு பூச்சிகளாக[a] மாறும்’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேன்களாக.” இந்த எபிரெயச் சொல் கடிக்கும் அல்லது தொந்தரவு தரும் மிகச் சிறிய பூச்சிகளைக் குறிக்கிறது; துல்லியமான பூச்சியினம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் உள்ள இறைத் திருப்பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ்-தொடர்நிலை கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதால், நவீன தமிழ் கதைநடையில் ‘அப்போது’ இயல்பாக உள்ளது.
- source_word: אֱמֹר
  choice: சொல்
  rationale: மோசே ஆரோனிடம் நேரடியாகக் கூற வேண்டும் என்பதைக் காட்டும் கட்டளை வடிவத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: נְטֵה
  choice: நீட்டி
  rationale: கோலை முன்னே அல்லது வெளியே நீட்டும் செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: מַטְּךָ
  choice: உன் கோலை
  rationale: מַטֶּה என்பதற்கான தெளிவான, வழக்கிலுள்ள தமிழ் இணைச்சொல் ‘கோல்’ ஆகும்.
- source_word: וְהַךְ
  choice: அடி
  rationale: נכה வினையின் கட்டளைப் பொருளான ‘strike’ என்பதை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: עֲפַר הָאָרֶץ
  choice: நிலத்தின் புழுதியை
  rationale: עָפָר என்பதன் நுண்ணிய உலர் மண் அல்லது புழுதி என்ற பொருளையும், הָאָרֶץ என்பதன் தரை/நிலம் என்ற சூழற்பொருளையும் காக்கிறது.
- source_word: וְהָיָה
  choice: அது ... மாறும்
  rationale: சொல்லுக்கு சொல் ‘அது ... ஆகும்’ என்றாலும், இங்கு புழுதி பூச்சிகளாகும் விளைவை இயல்பான தமிழில் ‘மாறும்’ தெளிவுபடுத்துகிறது.
- source_word: לְכִנִּם
  choice: சிறு பூச்சிகளாக
  rationale: כִּנִּים குறிக்கும் துல்லியமான பூச்சியினம் உறுதியில்லை; பேன் அல்லது கொசுவினச் சிறுபூச்சி என்று அளவுக்கு மீறித் தீர்மானிக்காமல் அதன் பொதுவான தன்மையை வழங்குகிறது.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடு முழுவதிலும்
  rationale: பூச்சிகள் எகிப்தின் எல்லாப் பகுதிகளிலும் பரவும் முழுமையான அளவை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் இறைத் திருப்பெயர் நேரடியாக இருப்பதால், அதை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான கதைநடையிலும் வடிவமைக்கப்பட்டது. மூலத்தில் உள்ள பூச்சியினக் குழப்பம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
