review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the narrative sequence, Yahweh’s name, the command to Moses, the three distinct categories of waters, the causative command concerning the frogs, and their emergence over Egypt. However, “உன் கோலைப் பிடித்தவாறு” adds the specific manner of holding the staff, whereas בְּמַטֶּךָ is more directly instrumental (“with/by means of your staff”).
  naturalness: The Tamil is generally clear and modern. Recasting the staff phrase as “உன் கோலைக் கொண்டு” is both idiomatic and closer to the source. The resulting imperative sequence is natural and dignified.
  terminology: “யாவே,” “மோசே,” “ஆரோன்,” “நதிகள்,” “கால்வாய்கள்,” “குளங்கள்,” and “தவளைகள்” are appropriate modern-standard Tamil choices. The footnote appropriately preserves the Nile-waterways lexical alternative.
  issues:
  - severity: medium
    issue: “உன் கோலைப் பிடித்தவாறு” specifies holding the staff.
    rationale: The Hebrew בְּמַטֶּךָ expresses accompaniment/instrumentality (“with your staff”), but does not explicitly state that Aaron is holding it in a particular manner. “உன் கோலைக் கொண்டு” preserves the instrumental sense without adding this detail.
  revised_text: 'அப்போது யாவே மோசேயிடம், “ஆரோனிடம் சொல்: ‘உன் கோலைக் கொண்டு உன் கையை நதிகளின்மேலும், கால்வாய்களின்மேலும்[a], குளங்களின்மேலும் நீட்டி, எகிப்து நாட்டின்மேல் தவளைகளை ஏறிவரச் செய்’” என்றார்.'
