reference: Exodus 8:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹ֣ר אֶֽל אַהֲרֹ֗ן נְטֵ֤ה אֶת יָדְ/ךָ֙ בְּ/מַטֶּ֔/ךָ עַל הַ֨/נְּהָרֹ֔ת עַל הַ/יְאֹרִ֖ים וְ/עַל הָ/אֲגַמִּ֑ים וְ/הַ֥עַל אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: ta
  text: 'அப்போது யாவே மோசேயிடம், “ஆரோனிடம் சொல்: ‘உன் கோலைக் கொண்டு உன் கையை நதிகளின்மேலும், கால்வாய்களின்மேலும்[a], குளங்களின்மேலும் நீட்டி, எகிப்து நாட்டின்மேல் தவளைகளை ஏறிவரச் செய்’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கால்வாய்கள்” என்பதற்கு “நைல் நதியின் நீர்வழிகள்” என்றும் மொழிபெயர்க்கலாம்; இந்த எபிரெயச் சொல் எகிப்தியச் சூழலில் பெரும்பாலும் நைல் சார்ந்த நீர்வழிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: தொடர்கதை முன்னேற்றத்தை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: אֱמֹר
  choice: சொல்
  rationale: மோசேக்கு அளிக்கப்படும் நேரடியான கட்டளையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: נְטֵה אֶת יָדְךָ בְּמַטֶּךָ
  choice: உன் கோலைப் பிடித்தவாறு உன் கையை ... நீட்டி
  rationale: கோலுடன் கையை நீட்டும் செயலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘கை’ மற்றும் ‘கோல்’ ஆகிய இரண்டையும் தக்கவைக்கிறது.
- source_word: הַנְּהָרֹת
  choice: நதிகள்
  rationale: பொதுவான ஆறுகள் அல்லது நதிகளைக் குறிக்கும் சொல்லாகவும், அடுத்துவரும் இரண்டு நீர்நிலைகளிலிருந்து வேறுபட்டதாகவும் உள்ளது.
- source_word: הַיְאֹרִים
  choice: கால்வாய்கள்
  rationale: எகிப்தியச் சூழலில் நைல் சார்ந்த நீர்வழிகளைக் குறிக்கும் பன்மைச் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: הָאֲגַמִּים
  choice: குளங்கள்
  rationale: தேங்கிய நீர்நிலைகளைக் குறிக்கிறது; நதிகள் மற்றும் கால்வாய்களிலிருந்து உள்ள மூவகை வேறுபாட்டைக் காக்கிறது.
- source_word: וְהַעַל
  choice: ஏறிவரச் செய்
  rationale: עלה என்பதன் ஹிஃபில் காரணவினைப் பொருளையும், நீரிலிருந்து தவளைகள் மேலே வருவதையும் தெளிவாகக் காட்டுகிறது.
- source_word: הַצְפַרְדְּעִים
  choice: தவளைகள்
  rationale: மூலச் சொல்லின் நேரடியான, பொதுவான தமிழ் இணை.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டின்மேல்
  rationale: மூலத்தில் திரும்பத் திரும்ப வரும் עַל என்ற முன்னிடைச்சொல்லின் ‘மேல்’ என்ற இடப்பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை ஒரு பொதுப்பட்டத்தை அல்ல, தேவனுடைய தனிப்பட்ட பெயரையே பயன்படுத்துகிறது. ஆகவே அந்தப் பெயரை ஒலிபெயர்ப்பாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதவாக்கியத்திற்குரிய கண்ணியமும் கொண்ட நடை. நேரடி உரையின் கட்டளைத் தன்மை காக்கப்பட்டுள்ளது; நீர்நிலைகளின் மூவகைப் பட்டியலும் காரணவினை வடிவமும் தெளிவாகத் தரப்பட்டுள்ளன.
