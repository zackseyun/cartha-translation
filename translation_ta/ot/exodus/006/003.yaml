source:
  edition: WLC
  text: וָ/אֵרָ֗א אֶל אַבְרָהָ֛ם אֶל יִצְחָ֥ק וְ/אֶֽל יַעֲקֹ֖ב בְּ/אֵ֣ל שַׁדָּ֑י וּ/שְׁמִ֣/י יְהוָ֔ה לֹ֥א נוֹדַ֖עְתִּי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: ta
  text: நான் ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும் சர்வவல்லமையுள்ள கடவுளாக[a] காட்சியளித்தேன். ஆனால் யாவே என்னும் என் பெயரால் நான் அவர்களுக்கு அறியப்படவில்லை.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயம்: எல் ஷத்தாய்; மரபாக, “சர்வவல்லமையுள்ள கடவுள்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “யாவே என்னும் என் பெயரால் நான் என்னை அவர்களுக்கு அறியச் செய்யவில்லை.” இறைப்பெயரே அவர்களுக்குத் தெரியவில்லை என்பதைவிட, அதன் உடன்படிக்கை சார்ந்த முழுப் பொருளை அவர்கள் இன்னும் அறியவில்லை என்பதையும் எபிரேயம் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: தோன்றினேன்
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு முற்பிதாக்களுக்குக் கடவுள் காட்சியளித்ததைக் குறிக்கும்; ‘என்னை வெளிப்படுத்தினேன்’ என்பதைவிட ‘தோன்றினேன்’ எபிரேய வடிவை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: אֶל ... אֶל ... וְאֶל
  choice: ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும்
  rationale: மீண்டும் வரும் אֶל என்ற முன்னிடைச்சொல்லின் வலியுறுத்தலை இயல்பான தமிழ் இணைப்புருபான ‘-க்கும்’ என்பதை ஒவ்வொரு பெயருடனும் பயன்படுத்திப் பாதுகாக்கிறது.
- source_word: בְּאֵל שַׁדָּי
  choice: சர்வவல்லமையுள்ள கடவுளாக
  rationale: בְּ இங்கு ‘ஆக/என்ற நிலையில்’ என்ற பெயர்சார் பொருளில் வருகிறது. אֵל שַׁדָּי என்பதற்கான மரபான பொருள் மொழிபெயர்ப்பை முதன்மை உரையில் தருகிறது; மூலப்பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּשְׁמִי יְהוָה
  choice: ஆனால் யாவே என்ற என் பெயரால்
  rationale: וּ இங்கு முந்தைய பெயருடன் உள்ள எதிர்மறை ஒப்புமையைச் சுட்டுவதால் ‘ஆனால்’ இயல்பானது. ‘என் பெயரால்’ என்பது எபிரேய கட்டமைப்பையும் அதன் பொருள் தெளிவின்மையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் தனிப்பெயர் தன்மையைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: நான் அவர்களுக்கு அறியப்படவில்லை
  rationale: ידע என்பதன் நிஃபால் வடிவை முறையாகப் பிரதிபலித்து, ‘என்னை அவர்களுக்கு அறியச் செய்யவில்லை’ என்ற தற்சுட்டுப் பொருளையும் முழுமையாகத் தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: முற்பிதாக்கள் யாவே என்ற பெயரை அறிந்திருந்தார்களா என்பதுடன் இவ்வசனத்தின் தொடர்பு
  choice: ‘நான் அவர்களுக்கு அறியப்படவில்லை’ என்ற முறையான, பொருள் தெளிவின்மையைப் பாதுகாக்கும் வாசகம்
  alternative: ‘யாவே என்ற என் பெயரால் நான் என்னை அவர்களுக்கு அறியச் செய்யவில்லை’
  rationale: எபிரேயம் பெயரே முற்றிலும் தெரியாதிருந்ததைக் குறிக்கலாம்; அல்லது அந்தப் பெயரின் உடன்படிக்கை சார்ந்த முழுப் பொருளும் அனுபவமும் இன்னும் வெளிப்படவில்லை என்பதைக் குறிக்கலாம். ஆதியாகமத்தில் இப்பெயர் முற்பிதாக்களின் சூழலில் வருவதால், ஒரு விளக்கத்தை முதன்மை உரைக்குள் கட்டாயப்படுத்தாமல் மாற்று வாசிப்பை அடிக்குறிப்பில் தருவது பொருத்தமானது.
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்க்கும் முறை
  choice: யாவே
  alternative: கர்த்தர்
  rationale: இங்கு வசனத்தின் கருத்தே கடவுளுடைய தனிப்பெயரை மையப்படுத்துவதால், பட்டப்பெயரால் பதிலிடாமல் தனிப்பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பானதும் கண்ணியமானதுமான நடை. ‘சர்வவல்லமையுள்ள’ என்பது பரவலாகப் புரியக்கூடிய மரபுச் சமயச் சொல்; ‘அறியப்படவில்லை’ என்ற வடிவம் மூலத்தின் இறையியல் பதற்றத்தையும் இலக்கணத் தெளிவின்மையையும் பாதுகாக்கிறது. அனைத்து அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
