  verdict: revise
  source_fidelity: The draft accurately represents the narrative sequence, Yahweh's address to Moses, the future force of 'you will see,' Pharaoh's releasing and expelling of the people, and the repeated ambiguous idiom בְּיָד חֲזָקָה. A small revision replaces the periphrastic 'செய்யப்போகிறேன்' with the direct future 'செய்வேன்,' which more closely reflects אֶעֱשֶׂה without adding an explicit imminence nuance.
