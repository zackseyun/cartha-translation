base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “நான் பார்வோனுக்கு என்ன செய்வேன் என்பதை இப்போது நீ காண்பாய். ஏனெனில், வலிமையான கரத்தால்[a] அவன் அவர்களைப் போகவிடுவான்; வலிமையான கரத்தால் அவர்களைத் தன் நாட்டிலிருந்து துரத்திவிடுவான்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிர்ப்பந்தத்தினால் அவன் அவர்களைப் போகவிடுவான்; நிர்ப்பந்தத்தினால் அவர்களைத் துரத்திவிடுவான்.” இருமுறை வரும் “வலிமையான கரத்தால்” என்ற சொற்றொடர், இறுதியில் கடவுளுடைய வல்லமையால் உண்டாகும் கடும் நிர்ப்பந்தத்தின் கீழ் பார்வோன் செயல்படுவான் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுப்பதால், இயல்பான தமிழ் கதைநடையில் காலவரிசை காட்டப்பட்டுள்ளது.
- source_word: עַתָּה תִרְאֶה
  choice: இப்போது நீ காண்பாய்
  rationale: உடனடியாக வெளிப்படவிருக்கும் இறைச்செயலைக் குறிக்கும் கால வலியுறுத்தலையும் எதிர்காலப் பொருளையும் காக்கிறது.
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: நான் பார்வோனுக்கு என்ன செய்யப்போகிறேன் என்பதை
  rationale: ל என்ற முன்னிடைச்சொல்லை வெளிப்படையாக ‘எதிராக’ என விளக்காமல், தொடர்பின் அகலமான பொருளைத் தக்கவைக்கிறது.
- source_word: בְיָד חֲזָקָה
  choice: வலிமைமிக்க கரத்தினால்
  rationale: எபிரெய உருவகத்தை இரு இடங்களிலும் ஒரேபோலக் காத்து, அது பார்வோனின் வலிமையையா அல்லது அவனை நிர்ப்பந்திக்கும் இறைவல்லமையையா குறிக்கிறது என்பதை முதன்மை உரையில் முடிவுசெய்யாமல் விடுகிறது.
- source_word: יְשַׁלְּחֵם
  choice: அவன் அவர்களைப் போகவிடுவான்
  rationale: யாத்திராகமச் சூழலில் இஸ்ரவேலரை விடுவிப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் நடை.
- source_word: יְגָרְשֵׁם
  choice: அவர்களை ... துரத்திவிடுவான்
  rationale: வெறுமனே அனுப்புவதைக் காட்டிலும் வலுக்கட்டாயமாக வெளியேற்றும் வினையின் தீவிரத்தை வெளிப்படுத்துகிறது.
- source_word: מֵאַרְצוֹ
  choice: தன் நாட்டிலிருந்து
  rationale: மூன்றாம் நபர் எழுவாயான பார்வோனையே உடைமையாளராகத் தெளிவாகச் சுட்டி, எகிப்து நாட்டைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: இறைப்பெயரைப் பட்டப்பெயராக மாற்றாமல் காக்கிறது; குறிப்பிட்ட சமயமரபின் மாற்றீட்டைத் திணிப்பதையும் தவிர்க்கிறது.
- issue: ‘வலிமைமிக்க கரம்’ யாருடைய வல்லமையைக் குறிக்கிறது என்பது
  choice: உருவகத்தை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: நிர்ப்பந்தத்தினால் அவன் அவர்களைப் போகவிடுவான்
  rationale: இலக்கணப்படி இச்சொற்றொடர் பார்வோனின் செயல்களோடு இணைந்தாலும், சூழலில் அவனைச் செயல்படச் செய்யும் இறைவல்லமையைக் குறிக்கலாம். இந்த இறையியல் மற்றும் பொருளியல் அழுத்தத்தை உரை தீர்மானித்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வலிமைமிக்க கரம்’ என்ற எபிரெய மறுபதிப்பு வாக்கியத்தின் வலியுறுத்தலையும் இணை அமைப்பையும் காக்க இருமுறையும் விடப்பட்டுள்ளது.
