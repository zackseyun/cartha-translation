  - severity: low
    issue: ‘வலிமைமிக்க கரத்தினால்’ is less natural than the simpler idiomatic form.
    rationale: ‘வலிமையான கரத்தால்’ is fluent modern Tamil and preserves the repeated source idiom without resolving its ambiguity.
