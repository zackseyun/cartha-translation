  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: ta
  text: மோசே இவ்வாறு இஸ்ரவேலின் மக்களிடம் சொன்னார். ஆனால் மனச்சோர்வினால்[b] மற்றும் கடுமையான அடிமை உழைப்பினால்[a] அவர்கள் மோசேக்குச் செவிகொடுக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கடின உழைப்பு’ என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் இது அடிமைகள்மீது கட்டாயப்படுத்தப்பட்ட உழைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்பட, ‘ஆவியின் குறுக்கத்தால்’ என்று உள்ளது; இது உள்ள நெருக்கம், ஊக்கமிழப்பு அல்லது பொறுமையின்மையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: சொன்னார்
  rationale: דבר என்பதன் வழக்கமான பொருள் ‘பேசுதல்’. இங்கு முந்தைய இறைச்செய்தியை எடுத்துரைப்பதால், இயல்பான நவீன தமிழில் ‘சொன்னார்’ பொருத்தமானது.
- source_word: כֵּן
  choice: இதையே
  rationale: כֵּן முந்தைய வசனங்களில் கொடுக்கப்பட்ட செய்தியைச் சுட்டுகிறது. ‘இதையே’ அந்தப் பின்னோக்கிய சுட்டுதலையும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொற்பட ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் இவ்வழக்கை நவீன தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் ‘இஸ்ரவேலின் மக்கள்’ என வழங்குகிறது.
- source_word: שָׁמְעוּ אֶל
  choice: செவிகொடுக்கவில்லை
  rationale: שמע אל என்பது வெறுமனே ஒலி கேட்பதை அல்ல, ஒருவரின் சொல்லைக் கேட்டு ஏற்றுக்கொள்வதை அல்லது கவனிப்பதைக் குறிக்கிறது. ‘செவிகொடுக்கவில்லை’ அந்தப் பொருளைச் செறிவாகக் காக்கிறது.
- source_word: מִקֹּצֶר רוּחַ
  choice: மனச்சோர்வினால்
  rationale: சொற்பட ‘ஆவியின் குறுக்கத்தால்’ எனும் இச்சொற்றொடர் உள்ளார்ந்த நெருக்கடி, நொறுங்கிய மனநிலை அல்லது ஊக்கமிழப்பைக் குறிக்கலாம். ‘மனச்சோர்வு’ சூழலில் இயல்பானது; சொற்படிமமும் பொருள் வீச்சும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: கடினமான அடிமை வேலையினால்
  rationale: עֲבֹדָה என்பது வேலை அல்லது சேவை எனவும், இச்சூழலில் கட்டாய அடிமை உழைப்பு எனவும் பொருள்படும். ‘அடிமை வேலை’ எகிப்திய ஒடுக்குமுறையை வெளிப்படுத்துவதோடு ‘வேலை’ என்ற அடிப்படைப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: עֲבֹדָה קָשָׁה என்பதில் எகிப்திய ஒடுக்குமுறையின் தன்மை
  choice: கடினமான அடிமை வேலை
  alternative: கடின உழைப்பு
  rationale: பெயர்ச்சொல் பொதுவாக வேலை அல்லது சேவையைக் குறிக்கலாம்; ஆனால் யாத்திராகமச் சூழலில் இது கட்டாய உழைப்பாகிய அடிமைத்தனத்தின் கீழ் நடைபெறுகிறது. இரு அம்சங்களையும் ஒருசேர வெளிப்படுத்த இத்தேர்வு செய்யப்பட்டது.
- issue: מִקֹּצֶר רוּחַ என்பதன் உள்ளார்ந்த நிலை
  choice: மனச்சோர்வு
  alternative: ஆவியின் குறுக்கம்; பொறுமையின்மை
  rationale: இச்சொற்றொடர் உடல் மூச்சுத்திணறலை மட்டுமல்லாமல் ஒடுக்குமுறையால் ஏற்பட்ட உள்ள நெருக்கத்தையும் ஊக்கமிழப்பையும் குறிக்கிறது. குறிப்பிட்ட உளவியல் அல்லது இறையியல் விளக்கத்தைத் திணிக்காமல் சூழலுக்கேற்ற பரந்த சொல்லாக ‘மனச்சோர்வு’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்படியான வடிவத்திற்குப் பதிலாக சமூகமெங்கும் குறிக்கப்படும் பொருளைத் தெளிவாக்க ‘இஸ்ரவேலின் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது. காரணச் சொற்றொடர்கள் தமிழின் இயல்பான வாக்கிய ஓட்டத்திற்காக முதன்மை வாக்கியத்திற்கு முன் வைக்கப்பட்டுள்ளன.
