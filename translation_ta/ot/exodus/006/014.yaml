  text: אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבֹתָ֑/ם בְּנֵ֨י רְאוּבֵ֜ן בְּכֹ֣ר יִשְׂרָאֵ֗ל חֲנ֤וֹךְ וּ/פַלּוּא֙ חֶצְר֣וֹן וְ/כַרְמִ֔י אֵ֖לֶּה מִשְׁפְּחֹ֥ת רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: ta
  text: 'அவர்களுடைய தந்தைவழிக் குடும்பங்களின் தலைவர்கள் இவர்களே: இஸ்ரவேலின் முதற்பேறான ரூபனின் மகன்கள் ஏனோக்கு, பல்லூ, எஸ்ரோன், கர்மி ஆகியோர். ரூபனின் குலங்கள் இவையே.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ரூபனின் குடும்பங்கள்.”
    reason: மிஷ்பகோத் (מִשְׁפְּחֹת) என்பது சூழலுக்கு ஏற்ப குலங்கள் அல்லது குடும்பங்கள் என மொழிபெயர்க்கப்படலாம்; “குலங்கள்” பழங்குடி வம்சச் சூழலில் மிகத் துல்லியமானது.
lexical_decisions:
- source_word: רָאשֵׁי בֵית אֲבֹתָם
  choice: அவர்களுடைய தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: எபிரெய மொழியின் தந்தைவழி விரிந்த குடும்ப அமைப்பைக் குறிக்கும் மரபுத்தொடரை, சொற்சொல்லான ‘தந்தையரின் வீடுகள்’ என்பதற்குப் பதிலாக இயல்பாகவும் பொருள் தெளிவாகவும் வழங்குகிறது; רָאשֵׁי என்பதன் தலைமைப் பொருளையும் காக்கிறது.
- source_word: בְּנֵי רְאוּבֵן
  choice: ரூபனின் மகன்கள்
  rationale: இங்கு உடனடியாக ரூபனின் பெயரிடப்பட்ட மகன்கள் பட்டியலிடப்படுவதால், விரிவான ‘வழித்தோன்றல்கள்’ என்பதைவிட நேரடியான ‘மகன்கள்’ பொருத்தமானது.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முதற்பேறான
  rationale: ரூபனை அடையாளப்படுத்தும் உடன்பெயர் அமைப்பையும் ‘முதற்பேறு’ என்ற வம்சவரிசைச் சிறப்பையும் காக்கிறது.
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: ஏனோக்கு, பல்லூ, எஸ்ரோன், கர்மீ
  rationale: தமிழ் வேதாகமப் பெயர் மரபுடன் ஒத்த, வாசிக்க எளிய பெயரெழுத்தாக்கங்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: பழங்குடி வம்ச அமைப்பிற்குள் உள்ள உறவுமுறைப் பிரிவுகளை இச்சொல் குறிக்கிறது; நவீன தமிழின் பொதுவான ‘குடும்பங்கள்’ என்பதைவிட ‘குலங்கள்’ இச்சூழலில் துல்லியமானது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வம்சவரிசைத் தொனி காக்கப்பட்டாலும், ‘தந்தையர் வீடுகள்’ போன்ற இயல்பற்ற சொற்சொல் மொழிபெயர்ப்பு தவிர்க்கப்பட்டுள்ளது. இரண்டாம் வாக்கியத்தில் பெயர்ப்பட்டியலை இயல்பாக இணைக்க ‘ஆகியோர்’ சேர்க்கப்பட்டுள்ளது.
