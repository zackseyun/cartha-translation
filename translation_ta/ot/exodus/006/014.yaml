revisions:
- from: 'அவர்களுடைய தந்தைவழிக் குடும்பங்களின் தலைவர்கள் இவர்களே: இஸ்ரவேலின் முதற்பேறான ரூபனின் மகன்கள் ஏனோக்கு, பல்லூ, எஸ்ரோன், கர்மீ ஆகியோர். இவையே ரூபனின் குலங்கள்.'
  to: 'அவர்களுடைய தந்தைவழிக் குடும்பங்களின் தலைவர்கள் இவர்களே: இஸ்ரவேலின் முதற்பேறான ரூபனின் மகன்கள் ஏனோக்கு, பல்லூ, எஸ்ரோன், கர்மி ஆகியோர். ரூபனின் குலங்கள் இவையே.[a]'
  rationale: கர்மி என்ற பெயரின் எழுத்தாக்கம் எபிரெய மூலத்துக்கு ஏற்ப திருத்தப்பட்டுள்ளது. இறுதிக் கிளவுஸின் சொல்வரிசை இயல்பான நவீனத் தமிழுக்காக மாற்றப்பட்டுள்ளது; பொருள் மாற்றப்படவில்லை. மூலச்சொல்லின் செல்லத்தக்க மாற்றுப்பொருளைத் தெளிவுபடுத்த ஒரு குறிப்பு சேர்க்கப்பட்டுள்ளது.
