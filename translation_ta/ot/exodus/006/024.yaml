  source_fidelity: மூல எபிரெய வாக்கியத்தின் பெயர்ப்பட்டியல், கோராகின் மகன்கள், மற்றும் கோராகியரின் உறவுக் குழுக்கள் என்ற பொருள் சரியாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் אֵלֶּה מִשְׁפְּחֹת ('இவை ... குலங்கள்/குடும்பக் குழுக்கள்') என்பது பட்டியலிடப்பட்ட நபர்களை நேரடியாக ‘குலங்கள்’ என அடையாளப்படுத்துகிறது; ‘இவர்களே’ மனிதர்களைச் சுட்டுவதால் தமிழில் பொருள் சிறிது தளர்கிறது.
  naturalness: ‘கோராகின் மகன்கள்’ மற்றும் பெயர்ப்பட்டியல் இயல்பான நவீனத் தரத் தமிழ். ‘இவர்களே கோராகியரின் குலங்கள்’ என்பதற்குப் பதில், வம்சவரிசைப் பட்டியல் நடைமுறைக்கு ஏற்ற ‘இவர்களிடமிருந்து வந்தவை கோராகியரின் குலங்கள்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
  terminology: ‘குலங்கள்’ என்பது מִשְׁפְּחֹת என்பதற்கான பொருத்தமான தேர்வு. ‘கோராகியர்’ הַקָּרְחִי என்ற குழுப் பெயரைத் துல்லியமாகத் தருகிறது. பெயர்கள் ஏற்கத்தக்கவை; ‘எல்க்கானா’ என்ற ஒலிபெயர்ப்பும் பாதுகாக்கப்பட்டுள்ளது.
