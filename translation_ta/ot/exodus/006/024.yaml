  yaml_path: translation/ot/exodus/006/024.yaml
  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: ta
  text: 'கோராகின் மகன்கள்: அசீர், எல்க்கானா, அபியாசாப். இவர்களிடமிருந்து வந்தவை கோராகியரின் குலங்கள்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கோராகியரின் குடும்பக் குழுக்கள்.” எபிரெயச் சொல் ஒரு கோத்திரத்திற்குள் உள்ள விரிந்த உறவுமுறைக் குழுக்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי קֹרַח
  choice: கோராகின் மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்ற நேரடியான பொருளுடைய இணைப்புநிலைப் பன்மை. இங்கு உடனடியாக மூன்று நபர்கள் பட்டியலிடப்படுவதால் ‘சந்ததியினர்’ என்பதைவிட ‘மகன்கள்’ பொருத்தமானது. தொடக்க וְ தமிழில் தனியாக ‘மேலும்’ என்று தரப்படாமல், வம்சப்பட்டியலின் புதிய வரியாக இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: אַסִּיר
  choice: அசீர்
  rationale: வம்சப்பட்டியல் சூழலில் இது பொதுப்பெயர் அல்ல, நபரின் பெயர்; தமிழில் இயல்பான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶלְקָנָה
  choice: எல்க்கானா
  rationale: எபிரெய தனிப்பெயரின் மெய்யொலியைத் தெளிவாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲבִיאָסָף
  choice: அபியாசாப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைப் பின்பற்றும், தமிழில் வாசிக்க ஏற்ற ஒலிபெயர்ப்பு.
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: முன்னர் குறிப்பிடப்பட்ட நபர்களைச் சுட்டும் அடையாள வாக்கியமாக இருப்பதால், மனிதர்களுக்குரிய ‘இவர்கள்’ என்பதுடன் வலியுறுத்தும் ‘ஏ’ சேர்க்கப்பட்டுள்ளது.
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: பழங்குடி அல்லது வம்ச அமைப்புக்குள் உள்ள விரிந்த உறவுமுறைக் குழுக்களை இச்சொல் குறிக்கிறது; நவீன தமிழில் ‘குடும்பங்கள்’ என்பதைவிட ‘குலங்கள்’ இந்த வம்சப்பட்டியல் சூழலைத் துல்லியமாகக் காட்டுகிறது.
- source_word: הַקָּרְחִי
  choice: கோராகியரின்
  rationale: கோராகின் வழியைச் சேர்ந்தவர்களைக் குறிக்கும் இனவழிப் பெயர்; ‘கோராகியர்’ என்பது குழுவைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
