base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: ta
  text: எகிப்தின் அரசனாகிய பார்வோனிடம் போய், அவன் இஸ்ரவேல் மக்களை[a]த் தன் நாட்டிலிருந்து அனுப்பிவிடுமாறு பேசு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக “இஸ்ரவேலின் மகன்கள்”; “இஸ்ரவேலர்” அல்லது “இஸ்ரவேலின் பிள்ளைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: போய்
  rationale: בוא என்பதன் கட்டளை வடிவம் சூழலுக்கேற்ப மோசே பார்வோனிடம் செல்ல வேண்டும் என்பதைக் குறிக்கிறது. தமிழில் இங்கு “போய்” என்பது இயல்பானது; “வா” என்பது பேச்சாளரின் இருப்பிடத்தை நோக்கி வருவதாகத் தவறாகப் புரியக்கூடும்.
- source_word: דַבֵּר אֶל
  choice: பேசு
  rationale: பார்வோனை நோக்கிப் பேசும்படி கொடுக்கப்படும் நேரடிக் கட்டளையை எளிமையாகவும் மூலத்தின் அமைப்புக்கு நெருக்கமாகவும் தருகிறது.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: எகிப்தின் அரசனாகிய பார்வோன்
  rationale: பெயருடன் இணைந்த அரசப் பதவியைத் தெளிவாகவும் இயல்பான தமிழ் சொல்லமைப்பிலும் வழங்குகிறது.
- source_word: וִישַׁלַּח
  choice: அனுப்பிவிடட்டும்
  rationale: கட்டளையைத் தொடர்ந்து வரும் இவ்வினைச்சொல், பார்வோன் இஸ்ரவேலரை விடுவித்து வெளியே அனுப்ப வேண்டும் என்ற நோக்கத்தையோ கோரிக்கையையோ குறிக்கிறது. “அனுப்பிவிடட்டும்” அந்தக் கட்டளைசார் வலிமையைப் பாதுகாக்கிறது; வெறும் எதிர்கால முன்னறிவிப்பாக மாற்றுவதில்லை.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களை
  rationale: மூலத்தில் சொற்பட “இஸ்ரவேலின் மகன்கள்” என்ற குடும்பவழி அடையாளம் உள்ளது. ஆனால் இச்சூழலில் முழு இஸ்ரவேல் மக்களையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவமாக “இஸ்ரவேல் மக்கள்” தேர்ந்தெடுக்கப்பட்டுள்ளது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֵאַרְצוֹ
  choice: தன் நாட்டிலிருந்து
  rationale: אֶרֶץ இங்கு பார்வோனின் ஆட்சிக்குட்பட்ட எகிப்து நாட்டைக் குறிக்கிறது. எழுவாய் பார்வோன் என்பதால் “தன்” என்பது தமிழில் தெளிவும் இயல்பும் தருகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இது இனக்குழு முழுவதையும் குறிக்கும் நிலையான எபிரெய குடும்பவழிச் சொற்றொடர். தமிழில் “மகன்கள்” என்பது ஆண்களை மட்டும் குறிக்கும் என இயல்பாகப் புரியக்கூடும்; ஆகவே சூழலின் உள்ளடக்கத்தைத் துல்லியமாகத் தரும் “மக்கள்” முதன்மை உரையில் வைக்கப்பட்டு, மூலத்தின் சொற்படிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. அரைப்புள்ளி, பார்வோனிடம் பேசும் கட்டளையையும் அவன் மக்களை அனுப்ப வேண்டும் என்ற அதன் உள்ளடக்கம் அல்லது நோக்கத்தையும் இணைக்கிறது.
