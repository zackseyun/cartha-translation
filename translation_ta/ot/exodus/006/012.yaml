base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: ta
  text: ஆனால் மோசே யாவேவின் முன்னிலையில், “இதோ, இஸ்ரவேல் மக்கள் எனக்குச் செவிகொடுக்கவில்லை; அப்படியிருக்க, நான் விருத்தசேதனமில்லாத உதடுகளையுடையவன்[a] என்பதால், பார்வோன் எனக்குச் எப்படிச் செவிகொடுப்பான்?” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விருத்தசேதனமில்லாத உதடுகளையுடையவன்” என்பது தடைப்பட்ட அல்லது போதாமையான பேச்சை உணர்த்தும் எபிரெய உருவகம்; யாத்திராகமம் 4:10-ஐ ஒப்பிடுக.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ஆனால் மோசே ... சொன்னார்
  rationale: தொடர்கதை வாவ் நிகழ்வை முன்னெடுத்தாலும், முந்தைய இறைக் கட்டளைக்கு எதிராக மோசே முன்வைக்கும் மறுப்பைச் சூழலில் காட்ட ‘ஆனால்’ பொருத்தமானது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்/சந்நிதியில்’ என்ற இட-உறவு சார்ந்த பொருளை இயல்பான தமிழில் காக்கிறது; இதை வெறுமனே ‘யெகோவாவிடம்’ எனச் சுருக்கவில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் வழக்கமான ஒலிபெயர்ப்பால் தருகிறது.
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் இடைச்சொல்லின் வலிமையை கண்ணியமான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்பது தமிழில் இங்கு இயல்பற்றதாய் இருப்பதால், உடன்படிக்கை மக்களை மொத்தமாகக் குறிக்கும் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: לֹא שָׁמְעוּ אֵלַי / יִשְׁמָעֵנִי
  choice: எனக்குச் செவிகொடுக்கவில்லை / எனக்குச் செவிகொடுப்பான்
  rationale: שׁמע என்பதில் உள்ள கேட்பதும் ஏற்றுக்கொள்வதும் ஆகிய இரு நிழற்பொருள்களையும் ‘செவிகொடு’ காக்கிறது; இரு இடங்களிலும் ஒரே சொல்லாக்கம் பயன்படுத்தப்படுகிறது.
- source_word: וְאֵיךְ
  choice: அப்படியிருக்க, ... எப்படி
  rationale: முந்தைய கூற்றிலிருந்து மோசே எடுக்கும் தர்க்கரீதியான முடிவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: עֲרַל שְׂפָתָיִם
  choice: உதடுகளில் விருத்தசேதனம் இல்லாதவன்
  rationale: பேச்சுத் தடை அல்லது பேச்சுத் தகுதியின்மையைச் சுட்டும் எபிரெய உருவகத்தை விளக்கவுரையாகக் கரைத்துவிடாமல் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயர் உள்ளது; ஆகவே அதனைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: עֲרַל שְׂפָתָיִם என்ற உருவகம்
  choice: உதடுகளில் விருத்தசேதனம் இல்லாதவன்
  alternative: பேசத் திறமையற்றவன்
  rationale: மோசே தமது பேச்சைப் பற்றிச் சொல்வதன் துல்லியமான இயல்பு மூலத்தில் முழுமையாகத் தீர்மானிக்கப்படவில்லை. ஆகவே நவீன நோயறிதலாகவோ வெறும் திறமையின்மையாகவோ மாற்றாமல் இலக்கிய மற்றும் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத்தமிழில் கண்ணியமான நடை. ‘இதோ’, ‘செவிகொடு’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்ற உயர்நடையைத் தருகின்றன; ஆனால் வழக்கொழிந்த சொற்றொடர்கள் தவிர்க்கப்பட்டுள்ளன. அடிக்குறி குறியீடு உருவகத்துக்குரிய சொல்லின் பின்னர் அல்லாமல் முழு மேற்கோளின் முடிவில் வைக்கப்பட்டுள்ளது; அது முழு சொற்றொடரையும் விளக்குகிறது.
