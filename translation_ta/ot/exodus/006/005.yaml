  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: ta
  text: மேலும், எகிப்தியர்கள் அடிமைகளாக்கி வைத்திருக்கும் இஸ்ரவேல் மக்களின்[a] அங்கலாய்ப்பை நானும் கேட்டேன்; என் உடன்படிக்கையை நினைவுகூர்ந்தேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்’; இங்கு அது இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘நினைவுகூர்ந்தேன்’ என்பது தேவன் மறந்திருந்தார் என்று பொருளல்ல; தமது உடன்படிக்கைக்கேற்ப செயல்பட அவர் திரும்புவதைக் குறிக்கும் உடன்படிக்கை மொழி.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: மேலும்… நானும்
  rationale: இணைப்பையும் கூட்டுவலியுறுத்தலையும் காட்டும் וְגַם என்பதையும், வெளிப்படையாக வரும் வலியுறுத்தப்பட்ட אֲנִי என்பதையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: שָׁמַעְתִּי
  choice: கேட்டேன்
  rationale: முற்றுப்பெற்ற எபிரெய வினையை இயல்பான தமிழ் இறந்தகாலத்தில் தருகிறது; தொடரும் உரைச்சூழல் அதன் தற்போதைய விளைவைத் தெளிவாக்குகிறது.
- source_word: נַאֲקַת
  choice: பெருமூச்சை
  rationale: ஒடுக்குமுறையால் எழும் ஆழ்ந்த வேதனையின் முனகல் அல்லது நெடுமூச்சைக் குறிக்கும் சொல்லை dignified, பொதுவாகப் புரியும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு ஆண்களை மட்டும் அல்லாமல் உடன்படிக்கை மக்களை மொத்தமாகக் குறிக்கிறது; ‘இஸ்ரவேல் மக்கள்’ அந்தக் கூட்டுப்பொருளை இயல்பாகத் தருகிறது.
- source_word: מִצְרַיִם מַעֲבִדִים אֹתָם
  choice: எகிப்தியர்கள் அடிமைகளாக வேலை செய்ய வைக்கிற
  rationale: מַעֲבִדִים என்ற causative வடிவத்தின் கட்டாயப் பணியையும் அடிமைத்தனச் சூழலையும் தெளிவாகக் காட்டுகிறது; பன்மை வினையெச்சத்துக்கேற்ப ‘எகிப்து’ என்பதைக் செயற்படும் ‘எகிப்தியர்கள்’ என வழங்குகிறது.
- source_word: וָאֶזְכֹּר
  choice: நினைவுகூர்ந்தேன்
  rationale: தேவன் மறந்த தகவலை மீண்டும் நினைத்தார் என்று விளக்கிப் பரப்பாமல், மூலத்தின் உடன்படிக்கைச் சொல்வழக்கான ‘நினைவுகூர்தல்’ என்பதைத் தக்கவைக்கிறது.
- source_word: בְּרִיתִי
  choice: என் உடன்படிக்கையை
  rationale: בְּרִית என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணைச்சொல்; முதலாம் நபர் உரிமைப்பெயரையும் தக்கவைக்கிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதின் கூட்டுப்பொருள்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய ஆண்பால் பன்மைச் சொற்றொடர் இங்கு உடன்படிக்கைச் சமூகத்தை முழுமையாகக் குறிக்கிறது. தமிழ் வாசகர் அதை ஆண்களுக்கு மட்டும் உரியதாகத் தவறாகப் புரிந்துகொள்ளாதபடி கூட்டுப்பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: தேவன் உடன்படிக்கையை ‘நினைவுகூருதல்’
  choice: என் உடன்படிக்கையை நினைவுகூர்ந்தேன்
  alternative: என் உடன்படிக்கையின்படி செயல்படத் திரும்பினேன்
  rationale: மூலத்தின் இறையியல் நிறைந்த நினைவுகூர்தல் மொழியை விளக்கவுரையாக மாற்றாமல் தக்கவைக்கிறது. இது மறந்துவிட்டுப் பின்னர் ஞாபகம் வந்தது என்பதைக் கட்டாயப்படுத்தாது; செயல்பட முனையும் உடன்படிக்கை நோக்கை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அடிமைகளாக வேலை செய்ய வைக்கிற’ என்பது கட்டாய உழைப்பை எளிதில் புரியும்படி சொல்கிறது; ‘நினைவுகூர்ந்தேன்’ என்பது மூலத்தின் இறையியல் பதற்றத்தைப் பராபிரேஸ் செய்யாமல் பாதுகாக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் உரிய சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
