  to: 'ஆகையால், இஸ்ரவேல் மக்களிடம்[a] சொல்: ‘நானே யாவே[b]. எகிப்தின் சுமைகளின் கீழிருந்து உங்களை வெளியே கொண்டுவருவேன்; அவர்களுக்கு அடிமைவேலை செய்வதிலிருந்து உங்களை விடுவிப்பேன்[c]. நீட்டப்பட்ட கரத்தினாலும் மாபெரும் தீர்ப்புகளினாலும்[d] உங்களை மீட்பேன்.’'
  rationale: 'திருத்தம் இரண்டு இடங்களில் மட்டுமே செய்யப்பட்டுள்ளது: ‘தீர்ப்புச் செயல்கள்’ என்பதற்குப் பதிலாக மூலத்திற்கு நெருக்கமான ‘தீர்ப்புகள்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத ‘என்’ நீக்கப்பட்டுள்ளது. ‘இஸ்ரவேல் மக்கள்’ என்ற நடை நவீனத் தமிழில் இயல்பாக இருக்க, எபிரெயத்தின் ‘மகன்கள்’ அடிக்குறிப்பில் தெளிவாகச் சுட்டப்பட்டுள்ளது.'
