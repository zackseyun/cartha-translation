  source_fidelity: மூலத்தின் விடுதலைச் செயல்களின் வரிசை, ‘யாவே’ என்ற இறைபெயர், அடிமை உழைப்பு, மீட்பு ஆகியவை நன்றாக வெளிப்படுத்தப்பட்டுள்ளன. ஆனால் בִּשְׁפָטִים גְּדֹלִים என்பதற்கு முதன்மை உரையில் ‘மாபெரும் தீர்ப்புச் செயல்கள்’ என்பது விளக்கத்தைச் சேர்க்கிறது; ‘மாபெரும் தீர்ப்புகள்’ என்பது மூலத்தின் திறந்த பொருளைச் சிறப்பாகக் காக்கும். மேலும் ‘என் கரம்’ என்ற உடைமைச் சுட்டு எபிரெய மூலத்தில் வெளிப்படையாக இல்லை; தமிழில் அது இயல்பானதாயினும், தேவையற்ற சேர்க்கையைத் தவிர்க்கலாம்.
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘இஸ்ரவேலின் பிள்ளைகளிடம்’ என்பது புரிந்துகொள்ளத்தக்கது; ‘இஸ்ரவேல் மக்களிடம்’ என்பது பொதுவாசகர்களுக்கு அதிக இயல்பானது. அடிக்குறிப்பு மூலத்தின் ‘மகன்கள்’ என்ற சொல்லைத் தக்கவைக்கிறது.
  terminology: ‘யாவே,’ ‘அடிமைவேலை,’ ‘மீட்பேன்,’ ‘நீட்டப்பட்ட கரம்’ ஆகியவை பொருத்தமானவை. ‘தீர்ப்புகள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, அவை செயல்களையும் குறிக்கலாம் என்பது அடிக்குறிப்பில் தரப்பட வேண்டும்.
