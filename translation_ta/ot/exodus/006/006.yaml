  revised_text: 'ஆகையால், இஸ்ரவேல் மக்களிடம்[a] சொல்: ‘நானே யாவே[b]. எகிப்தின் சுமைகளின் கீழிருந்து உங்களை வெளியே கொண்டுவருவேன்; அவர்களுக்கு அடிமைவேலை செய்வதிலிருந்து உங்களை விடுவிப்பேன்[c]. நீட்டப்பட்ட கரத்தினாலும் மாபெரும் தீர்ப்புகளினாலும்[d] உங்களை மீட்பேன்.’'
