  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: ta
  text: 'ஆகையால், இஸ்ரவேல் மக்களிடம்[a] சொல்: ‘நானே யாவே[b]. எகிப்தின் சுமைகளின் கீழிருந்து உங்களை வெளியே கொண்டுவருவேன்; அவர்களுக்கு அடிமைவேலை செய்வதிலிருந்து உங்களை விடுவிப்பேன்[c]. நீட்டப்பட்ட கரத்தினாலும் மாபெரும் தீர்ப்புகளினாலும்[d] உங்களை மீட்பேன்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “இஸ்ரவேலின் மகன்களிடம்”; இதை “இஸ்ரவேலரிடம்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் יהוה (YHWH) என்ற இறைபெயர்; அதன் வழக்கமான மறுகட்டமைக்கப்பட்ட உச்சரிப்பு “யாவே.” சில மொழிபெயர்ப்புகள் இதை “ஆண்டவர்” என்று வழங்குகின்றன.
    reason: alternative_reading
  - marker: c
    text: “அவர்களுடைய அடிமைத்தனத்திலிருந்து” அல்லது “அவர்களுக்குச் செய்யும் பணியிலிருந்து” என்றும் மொழிபெயர்க்கலாம்; இச்சூழலில் கட்டாய அடிமை உழைப்பு குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: d
    text: 'சொல்லுக்குச் சொல்: “மாபெரும் தீர்ப்புகளினால்”; இது எகிப்துக்கு எதிராக நிறைவேற்றப்படும் நீதித்தீர்ப்புச் செயல்களைக் குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: முந்தைய இறைஉரையிலிருந்து வரும் காரணவிளைவு தொடர்பை இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் பிள்ளைகளிடம்
  rationale: எபிரெய குடும்பவழக்கைத் தக்கவைத்தபடியே, உடன்படிக்கை மக்களனைவரையும் குறிக்கும் இயல்பான தமிழை வழங்குகிறது.
- source_word: אֲנִי יְהוָה
  choice: நானே யாவே
  rationale: இறைவனின் தனிப்பெயரை ஒலிபெயர்த்து, வலியுறுத்தும் אֲנִי என்பதைக் ‘நானே’ என்று வெளிப்படுத்துகிறது.
- source_word: וְהוֹצֵאתִי
  choice: உங்களை வெளியே கொண்டுவருவேன்
  rationale: יצא என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும் விடுதலைப் பயணத்தின் படிமத்தையும் காக்கிறது.
- source_word: מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: எகிப்தியர் சுமத்திய பாரங்களின் கீழிருந்து
  rationale: ‘கீழிருந்து’ என்ற மூலப் படிமத்தைத் தக்கவைத்து, ‘எகிப்து’ என்பது இங்கு ஒடுக்குகிற எகிப்தியரைச் சுட்டுவதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וְהִצַּלְתִּי
  choice: உங்களை விடுவிப்பேன்
  rationale: ஆதிக்கத்திலிருந்து மீட்டு விடுவிக்கும் செயலை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מֵעֲבֹדָתָם
  choice: அவர்களுக்கு அடிமைவேலை செய்வதிலிருந்து
  rationale: עֲבֹדָה என்பதன் ‘வேலை/பணி’ சார்ந்த பொருளையும் இச்சூழலின் கட்டாய அடிமைத்தனத்தையும் ஒருங்கே வெளிப்படுத்துகிறது; பின்னொட்டு எகிப்தியரைக் குறிப்பதும் தெளிவாகிறது.
- source_word: וְגָאַלְתִּי
  choice: உங்களை மீட்டுக்கொள்வேன்
  rationale: உறவினரின் கடமையாக ஒருவரை மீட்கும் גאל சொல்லின் சட்ட, உறவு, இறையியல் நுண்ணுணர்வுகளைத் தமிழில் ஏற்ற அளவு தக்கவைக்கிறது.
- source_word: בִּזְרֹעַ נְטוּיָה
  choice: நீட்டப்பட்ட என் கரத்தினால்
  rationale: இறைவனின் வல்லமையான தலையீட்டைக் குறிக்கும் மனித உருவகத்தைப் பாதுகாக்கிறது; உடைமை தமிழில் தெளிவாக இருக்க ‘என்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: மாபெரும் தீர்ப்புச் செயல்களினால்
  rationale: שְׁפָטִים என்பது வெறும் தீர்ப்புரைகள் மட்டுமல்லாமல் எகிப்துக்கு எதிராக நிறைவேற்றப்படும் நீதித்தீர்ப்புச் செயல்களையும் குறிக்கக்கூடியதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; உச்சரிப்பின் மறுகட்டமைப்பில் உள்ள வரம்பு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: לִבְנֵי יִשְׂרָאֵל என்பதன் பாலினமும் குடும்பப் படிமமும்
  choice: இஸ்ரவேலின் பிள்ளைகள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலர்
  rationale: சொல்லின் குடும்பப் படிமத்தைத் தக்கவைத்தும், இங்கு அழைக்கப்படுவது உடன்படிக்கைச் சமூகமெங்கும் என்பதைத் தவறாக ஆண்களுக்கு மட்டும் வரையறுக்காமலும் உள்ளது.
- issue: עֲבֹדָה என்பதன் சமூக நிலை
  choice: அடிமைவேலை
  alternative: பணி / அடிமைத்தனம்
  rationale: நடுநிலையான பணியை அல்ல, எகிப்தியரின் கட்டாய உழைப்பையும் ஆதிக்கத்தையும் இச்சூழல் குறிக்கிறது; அதேவேளை சொல்லின் ‘வேலை/சேவை’ கூறும் முற்றிலும் மறைக்கப்படவில்லை.
- issue: שְׁפָטִים என்பதன் இயல்பு
  choice: தீர்ப்புச் செயல்கள்
  alternative: தீர்ப்புகள் / தண்டனைகள்
  rationale: எகிப்தின்மேல் நடைமுறையில் நிகழும் இறைநீதித் தீர்ப்புகளைக் குறிக்கிறது; ‘தண்டனைகள்’ என்று மட்டும் கூறி அதன் நீதித்துறை நுண்ணுணர்வைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நான்கு எதிர்கால இறைச்செயல்கள் வரிசையாகவும், ‘கீழிருந்து,’ ‘நீட்டப்பட்ட கரம்,’ ‘மீட்டுக்கொள்ளுதல்’ ஆகிய முக்கிய படிமங்கள் இயன்றவரை பாதுகாக்கப்பட்டும் உள்ளன.
