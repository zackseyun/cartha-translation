base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: ta
  text: பின்பு யாவே மோசேயிடமும் ஆரோனிடமும் பேசினார். இஸ்ரவேல் மக்களை[b] எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவரும்படி, இஸ்ரவேல் மக்களையும் எகிப்தின் அரசனான பார்வோனையும் குறித்து அவர்களுக்குக் கட்டளையிட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் மக்களுக்கும் எகிப்தின் அரசனான பார்வோனுக்கும்.” எபிரெய மொழியில் உள்ள முன்னிடைச்சொல் கட்டளையைப் பெறுபவர்களைக் குறிக்கவும் முடியும். ஆனால் இச்சூழலில், மோசேக்கும் ஆரோனுக்கும் கொடுக்கப்பட்ட கட்டளை இஸ்ரவேல் மக்களையும் பார்வோனையும் குறித்தது என்பதே பொருத்தமாகத் தெரிகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; “இஸ்ரவேல் மக்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசினார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘பின்பு’ என்பது அதன் தொடர்ச்சியைக் இயல்பான தமிழில் காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் நிலைபெற்றுள்ள ஒலிபெயர்ப்பு வடிவத்தில் தருகிறது.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: மோசேயிடமும் ஆரோனிடமும்
  rationale: דבר என்பதுடன் வரும் אֶל பேச்சின் நேரடி பெறுநர்களைக் குறிக்கிறது.
- source_word: וַיְצַוֵּם
  choice: அவர்களுக்குக் கட்டளையிட்டார்
  rationale: צוה என்பதன் அதிகாரபூர்வமான கட்டளையிடும் வலிமையைப் பேணுகிறது; பன்மை பின்னொட்டு மோசேயையும் ஆரோனையும் குறிக்கிறது.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: இஸ்ரவேலின் மக்களையும் எகிப்தின் அரசனாகிய பார்வோனையும் குறித்து
  rationale: இங்கு אֶל சொற்றொடர்கள் மோசேக்கும் ஆரோனுக்கும் கொடுக்கப்பட்ட கட்டளையின் தொடர்புப் பொருளைச் சுட்டுவதாக எடுத்துக்கொள்ளப்பட்டுள்ளன; நேரடிப் பெறுநர்கள் என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְהוֹצִיא
  choice: வெளியே கொண்டுவருவதற்காக
  rationale: יצא என்பதன் ஹிஃபில் காரணவினைப் பொருளான ‘வெளியே வரச் செய்தல்’ என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: இது இஸ்ரவேல் மக்களினத்தைக் குறிக்கும் எபிரெயக் கூட்டுப்பெயர்; சொற்சொல்லான ‘இஸ்ரவேலின் மகன்கள்’ என்பதைக் காட்டிலும் இன்றைய தமிழில் இயல்பாகவும் உள்ளடக்கப் பொருளுக்கு உண்மையாகவும் உள்ளது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: אֶרֶץ என்பதன் நிலம்/நாடு என்ற புவியியல் குறிப்பைத் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற தேசியக் கூட்டுப்பெயர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு சொற்றொடர் ஆண்களை மட்டும் அல்ல, இஸ்ரவேல் மக்களினத்தையே குறிக்கிறது; ‘மக்கள்’ என்பது பிரதிநிதித்துவக் கூட்டுப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- issue: צוה உடன் வரும் אֶל சொற்றொடர்களின் பங்கு
  choice: கட்டளை இஸ்ரவேலரையும் பார்வோனையும் குறித்தது
  alternative: கட்டளை இஸ்ரவேலருக்கும் பார்வோனுக்கும் நேரடியாக வழங்கப்பட்டது
  rationale: מֹשֶׁה மற்றும் אַהֲרֹן ஆகியோரைச் சுட்டும் வினைப் பின்னொட்டு அவர்களே கட்டளையைப் பெற்றவர்கள் என்பதைத் தெளிவாக்குகிறது; இருந்தாலும் אֶל என்பதன் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகம நடையுடன், தேவையற்ற பழஞ்சொற்கள் தவிர்க்கப்பட்டுள்ளன. ‘பார்வோன்’ மற்றும் ‘யெகோவா’ என்ற நிலைபெற்ற தமிழ் வேதாகமப் பெயர்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
