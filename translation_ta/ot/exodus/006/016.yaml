  text: 'These are the names of Levi’s sons according to their generations: Gershon, Kohath, and Merari. And the years of Levi’s life were one hundred thirty-seven years.'
translation:
  language: ta
  text: 'லேவியின் மகன்களின் பெயர்கள், அவரவர் வம்சங்களின்படி, இவையே: கெர்சோன், கோகாத், மெராரி. லேவியின் வாழ்நாள் நூற்று முப்பத்தேழு ஆண்டுகள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְתֹלְדֹתָם
  choice: அவர்களுடைய தலைமுறைகளின்படி
  rationale: வம்சப் பதிவின் ஒழுங்கைச் சுட்டும் எபிரெயச் சொல்லை நெருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: גֵּרְשׁוֹן וּקְהָת וּמְרָרִי
  choice: கெர்சோன், கோகாத், மெராரி
  rationale: எபிரெயப் பெயர்களின் ஒலிப்பை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: וּשְׁנֵי חַיֵּי לֵוִי
  choice: லேவி வாழ்ந்த ஆண்டுகள்
  rationale: சொல்லுக்குச் சொல் அமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: நூற்று முப்பத்தேழு
  rationale: எபிரெய எண்ணான 137-ஐ வழக்கமான தமிழ் எண் அமைப்பில் துல்லியமாக வழங்குகிறது.
