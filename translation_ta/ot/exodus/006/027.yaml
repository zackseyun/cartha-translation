base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: ta
  text: இவர்களே இஸ்ரவேலின் மகன்களை[b] எகிப்திலிருந்து வெளியே கொண்டுவருவதற்காக எகிப்தின் அரசனாகிய பார்வோனிடம் பேசியவர்கள்[a]—இவர்கள்தாம் மோசேயும் ஆரோனும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, ‘பார்வோனிடம் பேசிக்கொண்டிருந்தவர்கள்.’ எபிரெயத்தில் அவர்களைத் தொடர்ந்து அந்தச் செயலால் அடையாளப்படுத்தும் பெயரெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘இஸ்ரவேலின் மகன்கள்’ என்பது எபிரெயச் சொற்றொடரின் நேரடியான வடிவம்; இங்கு அது இஸ்ரவேலின் வழிவந்த மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם
  choice: இவர்களே
  rationale: முன்பு பெயரிடப்பட்ட மோசேயையும் ஆரோனையும் வலியுறுத்தி அடையாளப்படுத்தும் தனிப்பெயர்ச்சொல்லின் சுட்டும், மீண்டும் எடுத்துரைக்கும் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַמְדַבְּרִים
  choice: பேசியவர்கள்
  rationale: எபிரெயப் பெயரெச்சம் மோசேயையும் ஆரோனையும் பார்வோனிடம் பேசும் அவர்களுடைய செயலால் அடையாளப்படுத்துகிறது. தமிழில் ‘பேசியவர்கள்’ இயல்பாக உள்ளது; பெயரெச்சத்தின் தொடர்நிலைத் தன்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: אֶל
  choice: இடம்
  rationale: ‘பேசு’ என்ற வினையுடன் இது பேச்சு யாரை நோக்கியது என்பதைக் குறிக்கிறது; ‘பார்வோனிடம்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசனாகிய பார்வோன்
  rationale: பார்வோனின் அரசப் பட்டத்தையும் பெயரையும் தெளிவான தமிழ் இணைப்புடன் தருகிறது.
- source_word: לְהוֹצִיא
  choice: வெளியே கொண்டுவருவதற்காக
  rationale: יצא என்பதன் ஹிஃபீல் வடிவிலுள்ள காரணவினைப் பொருளையும் இங்கு வரும் நோக்கத்தையும் காக்கிறது; ‘வழிநடத்தி’ போன்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் உருவத்தையும் ஆண்பால் பன்மையையும் நெருக்கமாகக் காக்கிறது; இது இச்சூழலில் இஸ்ரவேலின் வழிவந்த மக்களைக் குறிக்கும் என்பது அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: מִמִּצְרָיִם
  choice: எகிப்திலிருந்து
  rationale: வெளியே கொண்டுவருதல் என்ற வினையுடன் பிரிவிடத்தை இயல்பாகவும் துல்லியமாகவும் குறிக்கிறது.
- source_word: הוּא
  choice: இவர்கள்தாம்
  rationale: கூட்டுப் பெயர்களுக்கு முன் ஒருமைச் சுட்டுப்பெயர் வரும் எபிரெய அமைப்பை தமிழில் செயற்கையாகப் பிரதிபலிக்காமல், அதன் வலியுறுத்திய அடையாளப்படுத்தலை ‘இவர்கள்தாம்’ எனத் தருகிறது.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: மோசேயும் ஆரோனும்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; ‘-உம் ... -உம்’ இணைப்பு இருவரையும் இயல்பாக இணைக்கிறது.
