translation_notes:
  register: நவீனத் தரத் தமிழில், வம்சப்பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. பெயர்கள் மூல எபிரெய உச்சரிப்பை முன்னிறுத்தி ஒலிபெயர்க்கப்பட்டுள்ளன; வசனத்தில் விளக்கக் குறிப்புகள் தேவையில்லை.
