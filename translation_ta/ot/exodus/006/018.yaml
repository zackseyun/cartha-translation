  yaml_path: translation/ot/exodus/006/018.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: ta
  text: 'கோகாத்தின் மகன்கள்: அம்ராம், யித்சகார், எப்ரோன், உசியேல். கோகாத் வாழ்ந்த ஆண்டுகள் நூற்று முப்பத்து மூன்று ஆண்டுகள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְהָת
  choice: கோகாத்தின் மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்கள்’ என்ற பொருளுடைய சார்பு பன்மை வடிவம். இங்கு உடனடியாகப் பெயரிடப்படும் கோகாத்தின் மகன்களையே குறிக்கிறது. தொடக்க வாவ், முந்தைய வம்சப்பட்டியலின் தொடர்ச்சியைக் காட்டினாலும், தமிழில் இயல்பான பட்டியல் நடைக்காகத் தனியான ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: அம்ராம், இத்சார், எப்ரோன், உசியேல்
  rationale: நான்கு இயற்பெயர்களும் எபிரெய ஒலிப்புக்கு அண்மையாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; தொடர் வாவ்கள் தமிழின் இயல்பான காற்புள்ளிப் பட்டியலாக வழங்கப்பட்டுள்ளன.
- source_word: וּשְׁנֵי חַיֵּי קְהָת
  choice: கோகாத் வாழ்ந்த ஆண்டுகள்
  rationale: ‘கோகாத்தின் வாழ்வின் ஆண்டுகள்’ என்ற மூலமொழி அமைப்பின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; ‘ஆயுட்காலம்’ என்பதைவிட மூலத்தின் ‘ஆண்டுகள்’ என்ற சொல்லாட்சியையும் காக்கிறது.
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: நூற்று முப்பத்து மூன்று
  rationale: எபிரெயில் ‘மூன்றும் முப்பதும் நூறும் ஆண்டு’ என்ற வரிசையிலுள்ள கூட்டு எண்ணைத் தமிழின் இயல்பான எண் வரிசையில் வழங்குகிறது. ‘ஆண்டுகள்’ ஏற்கெனவே வாக்கியத்தில் இருப்பதால் மீண்டும் கூறப்படவில்லை.
