  text: இவர்களே ஆரோனும் மோசேயும்.[a] இவர்களிடம் யாவே, “இஸ்ரவேல் மக்களை[b] எகிப்து நாட்டிலிருந்து அவர்களுடைய அணிகளின்படி[c] வெளியே கொண்டுவாருங்கள்” என்று சொன்னார்.
