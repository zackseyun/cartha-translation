base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: ta
  text: அம்ராம் தன் அத்தையாகிய யோகெபேத்தை[a] தனக்கு மனைவியாக ஏற்றுக்கொண்டான். அவள் அவனுக்கு ஆரோனையும் மோசேயையும் பெற்றெடுத்தாள். அம்ராம் வாழ்ந்த ஆண்டுகள் 137 ஆண்டுகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் குறிப்பாக, இங்குள்ள உறவுமுறைச் சொல்லைக் குறுகிய பொருளில் எடுத்தால், “தன் தந்தையின் சகோதரியாகிய யோகெபேத்தை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ஏற்றுக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டான்’; திருமணச் சூழலில் ‘மனைவியாக ஏற்றுக்கொண்டான்’ என்பது எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: דֹּדָתוֹ
  choice: தன் அத்தை
  rationale: இப்பெண்பால் உறவுமுறைச் சொல் ‘அத்தை’ எனப் பொதுவாகக் குறிக்கப்படுகிறது. ‘தந்தையின் சகோதரி’ என்பது சாத்தியமான குறுகிய பொருள் என்றாலும், இவ்வசனத்தில் மட்டும் உறவின் அந்தத் துல்லியம் வெளிப்படையாகக் கூறப்படவில்லை.
- source_word: לְאִשָּׁה
  choice: தனக்கு மனைவியாக
  rationale: இந்த முன்னிடைச்சொல் தொடர் திருமண உறவைக் குறிக்கிறது; தேர்ந்த தமிழ் சொற்றொடர் அதனைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַתֵּלֶד לוֹ
  choice: அவள் அவனுக்கு ... பெற்றெடுத்தாள்
  rationale: Qal வடிவிலுள்ள ילד, மறைமுகச் செயப்படுபொருளுடன், ‘அவனுக்குப் பெற்றெடுத்தாள்’ எனப் பொருள்படும்; தமிழ் வாக்கிய அமைப்புக்காகப் பெயர்கள் இடையில் வைக்கப்பட்டுள்ளன.
- source_word: שְׁנֵי חַיֵּי
  choice: வாழ்ந்த ஆண்டுகள்
  rationale: ஆயுளைக் குறிப்பிடும் வழக்கமான எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: '137'
  rationale: எபிரெய எண்ணின் கூறுகளை நவீன எண் வடிவில் துல்லியமாக அளிக்கிறது.
- source_word: עַמְרָם / יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה
  choice: அம்ராம் / யோகெபேத் / ஆரோன் / மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: பிற்காலத் தோரா சட்டத்தில் தடைசெய்யப்பட்ட நெருங்கிய உறவுத் திருமணத்தை விவரிக்கும் உறவுமுறைச் சொல்லின் மொழிபெயர்ப்பு
  choice: தன் அத்தை
  alternative: தன் தந்தையின் சகோதரி
  rationale: வசனம் ஒழுக்கத் தீர்ப்பின்றி ஒரு வம்சவரலாற்றுச் செய்தியைச் சொல்கிறது. ‘அத்தை’ என்பது உறவைத் தெளிவாகக் கூறுவதோடு, இவ்வசனம் வெளிப்படையாக அளிக்காத கூடுதல் துல்லியத்தை முதன்மை உரையில் திணிக்காமல் இறையியல் பதற்றத்தை அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வம்சவரலாற்றுக்கேற்ற கண்ணியமான, எளிதில் புரியும் நடை. எபிரெய திருமண மரபுத்தொடர் சொல்லுக்குச் சொல் கடினமாக்கப்படாமல் இயல்பாக வழங்கப்பட்டுள்ளது; உறவுமுறைச் சொல்லின் உண்மையான பொருள் வரம்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
