  text: It happened on the day when Yahweh spoke to Moses in the land of Egypt—[a][b]
translation:
  language: ta
  text: எகிப்து நாட்டில் யாவே மோசேயிடம் பேசிய நாளில், இது நிகழ்ந்தது—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேலும், இது நிகழ்ந்தது’ / ‘இது நடந்தது.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: இது நிகழ்ந்தது
  rationale: היה என்ற வினையின் தொடர்கதை வடிவம் ஒரு நிகழ்வையோ கதைத் திருப்பத்தையோ அறிமுகப்படுத்துகிறது. ‘இது நிகழ்ந்தது’ என்பது தேவையற்ற ‘இப்போது’ என்ற காலச்சொல்லைச் சேர்க்காமல், இயல்பான நவீன தமிழில் அதன் பொருளைக் கொடுக்கிறது.
- source_word: בְּיוֹם
  choice: நாளில்
  rationale: ‘அந்த நாளில்/நாளில்’ என்ற நேரடிப் பொருளைத் தக்கவைக்கிறது; தொடர்ந்து வரும் தொடர்பெயர் வாக்கியம் நிகழ்ந்த நேரத்தை விளக்குகிறது.
- source_word: דִּבֶּר
  choice: பேசிய
  rationale: דבר என்பதன் வழக்கமான பொருள் ‘பேசு’; אֶל מֹשֶׁה என்பதுடன் இணைந்து தமிழில் இயல்பாக ‘மோசேயிடம் பேசிய’ என வருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலான தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֶל
  choice: இடம்
  rationale: דבר உடன் வரும் אֶל, பேச்சு யாரை நோக்கியது என்பதைக் குறிக்கிறது; தமிழ் வேற்றுமை வடிவில் ‘மோசேயிடம்’ என்பது இயல்பானது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: மூலத்தில் உள்ள אֶרֶץ (‘நாடு/நிலம்’) என்பதையும் வெளிப்படையாகத் தக்கவைத்து, தமிழில் இயல்பான சொற்றொடராக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை YHWH என்ற தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்பது அதைப் பட்டப்பெயராக மாற்றாமல் தக்கவைக்கிறது; ‘ஆண்டவர்’ என்பது மரபான மாற்றீடாக இருந்தாலும் இங்கு மூலத்தின் பெயர்-தன்மையை மறைக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. வசனத்தின் முடிவில் உள்ள நீண்ட கோடு, அடுத்த வசனத்துக்குத் தொடரும் எபிரெய உரையின் நிறைவுபெறாத கதை அமைப்பைத் தக்கவைக்கிறது.
