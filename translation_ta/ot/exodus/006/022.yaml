lexical_decisions:
- source_word: וּ/בְנֵי
  choice: ஊசியேலின் மகன்கள்
  rationale: בְנֵי என்பது வம்சப்பட்டியல் சூழலில் ‘மகன்கள்’ என்று பொருள்படும் ஆண்பால் பன்மை வடிவம். தொடக்க ו முந்தைய பட்டியலுடன் தொடர்ச்சியைக் காட்டுகிறது; தமிழில் தனியாக ‘மேலும்’ என்று சேர்ப்பதைவிட வாக்கிய வரிசையே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֻזִּיאֵל
  choice: ஊசியேல்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் இயல்பாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: מִישָׁאֵל
  choice: மீஷாயேல்
  rationale: பெயரின் எபிரெய மெய் மற்றும் உயிரொலிகளை இயன்றவரை தெளிவாகக் காட்டும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: וְ/אֶלְצָפָן
  choice: எல்சாபான்
  rationale: אֶלְצָפָן என்ற பெயரின் எபிரெய வடிவத்தை நெருக்கமாகப் பின்பற்றும் ஒலிபெயர்ப்பு. பட்டியலில் உள்ள ו-இன் இணைப்புப் பணி தமிழின் காற்புள்ளி வரிசையால் இயல்பாக வெளிப்படுகிறது.
- source_word: וְ/סִתְרִי
  choice: சித்திரி
  rationale: סִתְרִי என்ற பெயரின் ஒலியைத் தமிழில் வாசிக்க ஏற்றவாறு தரும் ஒலிபெயர்ப்பு. இணைப்பு ו பட்டியல் அமைப்பில் காற்புள்ளியால் வெளிப்படுத்தப்பட்டுள்ளது.
