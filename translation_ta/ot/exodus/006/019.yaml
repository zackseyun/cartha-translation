  text: וּ/בְנֵ֥י מְרָרִ֖י מַחְלִ֣י וּ/מוּשִׁ֑י אֵ֛לֶּה מִשְׁפְּחֹ֥ת הַ/לֵּוִ֖י לְ/תֹלְדֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/019.yaml
  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: ta
  text: 'மெராரியின் மகன்கள்: மக்லியும் மூஷியும். இவர்களே, அவரவர் தலைமுறை வரிசைகளின்படியான லேவியின் குலங்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேவியனின் குலங்கள்.” எபிரெயில் “லேவியன்” என்பது ஒருமை வடிவில் உள்ளது; இங்கு அது லேவிய வம்சத்தைத் தொகுதியாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: மெராரியின் மகன்கள்
  rationale: வம்சப் பட்டியல் சூழலில் בְּנֵי என்பதற்கு இயல்பான பொருள் ‘மகன்கள்’; முன்னுள்ள இணைப்புச்சொல் தமிழில் பட்டியல் தொடர்ச்சியால் வெளிப்படுவதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: மக்லியும் மூசியும்
  rationale: இரு தனிப்பெயர்களும் எபிரெய உச்சரிப்பை அணுகும் வகையில் எழுத்துப்பெயர்க்கப்பட்டு, இணைப்புச்சொல் தமிழ் பட்டியல் நடையில் ‘-உம் … -உம்’ எனத் தரப்பட்டுள்ளது.
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: முன்னர் குறிப்பிடப்பட்ட நபர்களிலிருந்து வந்த குலங்களைச் சுட்டி அடையாளப்படுத்தும் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: מִשְׁפְּחֹת
  choice: குலங்கள்
  rationale: கோத்திரத்திற்குள் உள்ள உறவுவழிப் பிரிவுகளை வம்சப் பட்டியல் சூழலில் ‘குலங்கள்’ தெளிவாகக் குறிக்கிறது.
- source_word: הַ/לֵּוִי
  choice: லேவியின்
  rationale: எபிரெய ஒருமை வடிவம் இங்கு லேவியின் வம்சவரிசையைத் தொகுதியாகக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது; தமிழில் ‘லேவியின்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது. மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְ/תֹלְדֹתָם
  choice: அவர்களுடைய தலைமுறை வரிசைகளின்படி
  rationale: תּוֹלְדוֹת என்பதன் தலைமுறைகள் அல்லது வம்சத் தொடர்கள் என்ற கருத்தையும், மூன்றாம் நபர் பன்மை உடைமைப் பின்னொட்டையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הַלֵּוִי என்ற ஒருமை வடிவம் தனிநபரையா அல்லது தொகுதியாக லேவிய வம்சத்தையா குறிக்கிறது
  choice: லேவியின்
  alternative: லேவியரின்
  rationale: சூழல் லேவியின் வம்சக் குலங்களைப் பற்றியது; ஆனால் எபிரெய ஒருமையின் தொகுதிப் பயன்பாடு குறித்த உண்மையான மொழியியல் மாற்றுவாய்ப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையான, மரியாதைமிக்க வம்சப் பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் மூல எபிரெய வடிவத்துக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன; ‘குலங்கள்’ மற்றும் ‘தலைமுறை வரிசைகள்’ உறவுவழி அமைப்பைத் தெளிவாகக் காட்டுகின்றன.
