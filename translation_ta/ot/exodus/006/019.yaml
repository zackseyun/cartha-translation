revisions:
- from: மெராரியின் மகன்கள் மக்லியும் மூசியும். இவர்களே அவர்களுடைய தலைமுறை வரிசைகளின்படி லேவியின் குலங்கள்.[a]
  to: 'மெராரியின் மகன்கள்: மக்லியும் மூஷியும். இவர்களே, அவரவர் தலைமுறை வரிசைகளின்படியான லேவியின் குலங்கள்.[a]'
