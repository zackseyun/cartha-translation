  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: ta
  text: ஆரோன் அம்மினதாபின் மகளும் நகசோனின் சகோதரியுமான எலிசேபாளைத் தனக்கு மனைவியாக ஏற்றுக்கொண்டான். அவள் அவனுக்கு நாதாப், அபிகூ, எலெயாசார், இத்தாமார் ஆகியோரைப் பெற்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ஏற்றுக்கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டான்’; திருமணச் சூழலில் வரும் לְאִשָּׁה என்பதுடன் இணைந்து ஒருவரை மனைவியாக ஏற்றுக்கொள்வதைக் குறிக்கிறது. தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருக்க இவ்வாறு தரப்பட்டது.
- source_word: אֱלִישֶׁבַע
  choice: எலிசேபாள்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் தெளிவாகக் காட்டும் மரபான பெயர்ப்பு.
- source_word: בַּת עַמִּינָדָב
  choice: அம்மினதாபின் மகள்
  rationale: Construct தொடர்பை இயல்பான தமிழ் உடைமைத் தொடரால் நேரடியாகக் காட்டுகிறது.
- source_word: אֲחוֹת נַחְשׁוֹן
  choice: நகசோனின் சகோதரி
  rationale: உரையில் குறிப்பிடப்படும் உடன்பிறப்பு உறவைப் பாலினத்துடன் துல்லியமாகக் காட்டுகிறது.
- source_word: לּוֹ לְאִשָּׁה
  choice: தனக்கு மனைவியாக
  rationale: எபிரெய திருமணத் தொடரின் நோக்கத்தையும் உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתֵּלֶד לוֹ
  choice: அவள் அவனுக்கு … பெற்றாள்
  rationale: ילד வினையும் மறைமுகப் பொருளான לוֹ-வும் தரும் ‘அவனுக்குப் பிள்ளைகளைப் பெற்றாள்’ என்ற பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: נָדָב
  choice: நாதாப்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: אֲבִיהוּא
  choice: அபிகூ
  rationale: எபிரெயப் பெயரின் மெய் மற்றும் உயிர் ஒலிகளைத் தமிழில் நெருக்கமாகக் காட்டுகிறது.
- source_word: אֶלְעָזָר
  choice: எலெயாசார்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் வாசிக்க ஏற்றவாறு எழுத்துப்பெயர்க்கிறது.
- source_word: אִיתָמָר
  choice: இத்தாமார்
  rationale: எபிரெயப் பெயரின் ஒலிவடிவத்தைத் தமிழில் நெருக்கமாகக் காட்டுகிறது.
