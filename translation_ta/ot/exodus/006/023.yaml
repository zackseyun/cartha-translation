  source_fidelity: 'எபிரெய மூலத்தின் அனைத்துக் கூறுகளும் துல்லியமாகத் தரப்பட்டுள்ளன: ஆரோன் எலிசேபாளை மனைவியாக ஏற்றுக்கொண்டது, அவள் அம்மினதாபின் மகளும் நகசோனின் சகோதரியும் என்பது, மேலும் அவள் பெற்ற நான்கு மகன்களின் பெயர்கள் ஆகியவை முழுமையாக உள்ளன. ‘ஏற்றுக்கொண்டான்’ என்பது திருமணச் சூழலில் וַיִּקַּח ... לְאִשָּׁה என்பதற்கு பொருத்தமான இயல்பான தமிழ் வெளிப்பாடு.'
