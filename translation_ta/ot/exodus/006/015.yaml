translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பட்டியலில் ஒவ்வொரு பெயருக்கும் முன் வரும் וְ என்பதைத் தமிழில் மீண்டும் மீண்டும் ‘மற்றும்’ என்று வழங்காமல், இயல்பான பட்டியல் நடையில் காற்புள்ளிகளால் காட்டப்பட்டுள்ளது.
