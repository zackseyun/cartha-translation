source:
  edition: WLC
  text: וּ/בְנֵ֣י שִׁמְע֗וֹן יְמוּאֵ֨ל וְ/יָמִ֤ין וְ/אֹ֨הַד֙ וְ/יָכִ֣ין וְ/צֹ֔חַר וְ/שָׁא֖וּל בֶּן הַֽ/כְּנַעֲנִ֑ית אֵ֖לֶּה מִשְׁפְּחֹ֥ת שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/015.yaml
  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
translation:
  language: ta
  text: 'சிமியோனின் மகன்கள்: யெமுவேல், யாமீன், ஓஹாத், யாக்கீன், சோஹார், கானானியப் பெண்ணின் மகனான ஷாவூல்[a]. இவர்களே சிமியோனின் குலங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயப் பெயர் שָׁאוּל (ஷாவூல்). மரபுவழித் தமிழ் வேதாகமங்களில் இது “சவுல்” என்றும் வழங்கப்படுகிறது.
    reason: மூல எபிரெய ஒலிவடிவத்தையும் பரவலாக அறியப்படும் மரபுவழித் தமிழ் வடிவத்தையும் தெளிவாகக் குறிப்பிடுகிறது.
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: சிமியோனின் மகன்கள்
  rationale: בְנֵי என்பது ‘மகன்கள்’ என்ற பொருளுடைய இணைநிலைப் பன்மை வடிவம். தொடரும் வம்சப்பட்டியலைத் தமிழில் இயல்பாக வழங்க வாவ் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: יְמוּאֵל
  choice: யெமுவேல்
  rationale: எபிரெய ஒலிவடிவத்தை நவீனத் தமிழ் எழுத்துகளில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: וְיָמִין
  choice: யாமின்
  rationale: יָמִין என்ற எபிரெயப் பெயரின் ஒலியைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது; பட்டியலில் மீண்டும் வரும் வாவ் தமிழில் காற்புள்ளிகளால் இயல்பாக வெளிப்படுகிறது.
- source_word: וְאֹהַד
  choice: ஓகாத்
  rationale: אֹהַד என்ற பெயரின் மெய் மற்றும் உயிரொலிகளைத் தமிழில் இயன்றவரை நெருக்கமாகக் காட்டுகிறது.
- source_word: וְיָכִין
  choice: யாகின்
  rationale: יָכִין என்ற எபிரெயப் பெயரை அதன் தொடக்க ய் ஒலியுடன் நேரடியாகப் பெயர்த்தெழுதுகிறது.
- source_word: וְצֹחַר
  choice: சோகார்
  rationale: צֹחַר என்ற பெயரின் ஒலிவடிவத்தைத் தமிழில் வாசிக்கத்தக்க விதத்தில் நெருக்கமாக வழங்குகிறது.
- source_word: וְשָׁאוּל
  choice: சவுல்
  rationale: שָׁאוּל (Šāʾūl) என்ற எபிரெயப் பெயரின் ஒலியைப் பிரதிபலிக்கும், தமிழில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: கானானியப் பெண்ணின் மகனான
  rationale: הַכְּנַעֲנִית பெண்பால் ஒருமை வடிவம் என்பதால் ‘கானானியப் பெண்’ என்று பாலினத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֵלֶּה מִשְׁפְּחֹת שִׁמְעוֹן
  choice: இவர்களே சிமியோனின் குலங்கள்
  rationale: மனிதர்களைக் குறிக்கும் אֵלֶּה என்பதற்கு ‘இவர்கள்’ இயல்பானது; மִשְׁפְּחֹת என்பது கோத்திரத்துக்குள் உள்ள உறவினக் குழுக்களைக் குறிப்பதால் ‘குலங்கள்’ பொருத்தமானது.
