source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה לִ/פְנֵ֣י יְהוָ֑ה הֵ֤ן אֲנִי֙ עֲרַ֣ל שְׂפָתַ֔יִם וְ/אֵ֕יךְ יִשְׁמַ֥ע אֵלַ֖/י פַּרְעֹֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: ta
  text: ஆனால் மோசே ஆண்டவரின் முன்னிலையில், “இதோ, நான் விருத்தசேதனம் செய்யப்படாத உதடுகளைக் கொண்டவன்; அப்படியிருக்க, பார்வோன் எனக்கு எப்படிச் செவிகொடுப்பான்?” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: ஆண்டவரின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்’ என்ற அர்த்தத்தையும், יהוה என்ற உடன்படிக்கைப் பெயருக்கான மரியாதைமிக்க வழக்கமான பிரதிநிதித்துவமாக ‘ஆண்டவர்’ என்பதையும் காக்கிறது.
- source_word: הֵן
  choice: இதோ
  rationale: பேசுபவர் தன் நிலையை வலியுறுத்திக் கவனத்திற்குக் கொண்டுவரும் எபிரெய இடைச்சொல்லின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲרַל שְׂפָתַיִם
  choice: விருத்தசேதனம் செய்யப்படாத உதடுகளைக் கொண்டவன்
  rationale: மூலத்தின் திட்டமிட்ட உடல்சார் உருவகத்தையும் அதன் விளக்கத் திறந்தநிலையையும் மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: יִשְׁמַע אֵלַי
  choice: எனக்குச் செவிகொடுப்பான்
  rationale: שמע + אל என்பது வெறுமனே ஒலியைக் கேட்பதைவிட கவனித்துக் கேட்டு ஏற்றுக்கொள்வதைக் குறிக்கக்கூடும்; தமிழ் வழக்கில் ‘செவிகொடு’ இதைச் சுருக்கமாகத் தருகிறது.
- source_word: פַרְעֹה
  choice: பார்வோன்
  rationale: தமிழ் வேதாகம மொழிநடையில் பரவலாக அறியப்படும் அரசப் பட்டப்பெயர்.
theological_decisions:
- issue: ‘விருத்தசேதனம் செய்யப்படாத உதடுகள்’ என்ற உருவகத்தின் பொருள்
  choice: உருவகத்தை நேரடியாகக் காத்தல்
  alternative: ‘பேச்சுத்திறன் இல்லாதவன்’ அல்லது ‘திக்கித் திக்கிப் பேசுகிறவன்’ என்று விளக்குதல்
  rationale: எபிரெய வாசகம் மோசேயின் பேச்சுக் குறையைத் துல்லியமாக வரையறுக்கவில்லை. விளக்க மொழிபெயர்ப்பு உரையில் இல்லாத மருத்துவ அல்லது திறன் சார்ந்த முடிவைத் திணிக்கும்.
- issue: יהוה என்ற இறைப்பெயரின் பிரதிநிதித்துவம்
  choice: ஆண்டவர்
  alternative: யெகோவா / யாவே
  rationale: நவீனத் தமிழில் மரியாதையுடனும் பொதுவாகவும் புரியக்கூடிய பிரதிநிதித்துவம்; குறிப்பிட்ட உச்சரிப்பை உரையில் தீர்மானமாகத் திணிக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘விருத்தசேதனம் செய்யப்படாத உதடுகள்’ இயல்புக்கு அப்பாற்பட்டதாகத் தோன்றினாலும், மூல எபிரெயத்தின் முக்கிய உருவகத்தையும் அதன் தெளிவின்மையையும் நோக்கத்துடன் காக்கிறது.
