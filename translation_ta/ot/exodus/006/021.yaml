lexical_decisions:
- source_word: וּ/בְנֵי
  choice: மகன்கள்
  rationale: בְּנֵי என்பது ‘மகன்கள்’ என்பதன் இணைப்புநிலைப் பன்மை. இங்கு உடனடியாக மூன்று ஆண்களின் பெயர்கள் தரப்படுவதால் ‘வழித்தோன்றல்கள்’ என்பதைவிட ‘மகன்கள்’ துல்லியமானது. எபிரெய முன்னொட்டு ו பட்டியலின் தொடர்ச்சியைச் சுட்டினாலும், இயல்பான தமிழ் வம்சப்பட்டியல் நடையில் தனியாக ‘மேலும்’ சேர்க்கத் தேவையில்லை.
- source_word: יִצְהָר
  choice: இஸ்கார்
  rationale: தனிப்பட்ட பெயர்; எபிரெய ஒலிப்பைத் தமிழ் எழுத்தில் இயன்றவரை நெருக்கமாகப் பெயர்க்கப்பட்டது.
- source_word: קֹרַח
  choice: கோராகு
  rationale: தனிப்பட்ட பெயர்; இறுதி எபிரெய ח ஒலியைத் தமிழில் அணுகும் வகையில் ‘கு’ பயன்படுத்தப்பட்டது.
- source_word: וָ/נֶפֶג
  choice: நேபெகு
  rationale: தனிப்பட்ட பெயர்; பட்டியலில் இணைப்பைத் தமிழ் நிறுத்தற்குறியும் இறுதி ‘சிக்ரி’க்கு முன் வரும் காற்புள்ளியும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: וְ/זִכְרִי
  choice: சிக்ரி
  rationale: தனிப்பட்ட பெயர்; எபிரெய זִכְרִי என்பதன் ஒலிக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
