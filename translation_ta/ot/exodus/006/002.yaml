  text: கடவுள் மோசேயிடம் பேசினார்; அவரிடம், “நான் யாவே”[a] என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: YHWH (יהוה); இதன் பண்டைய உச்சரிப்பு உறுதியாகத் தெரியவில்லை. பொதுவாக “யாவே” என்றும், மரபாக “யெகோவா” என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: தெய்வீகப் பெயரின் எபிரெய வடிவத்தையும் உச்சரிப்பு சார்ந்த உண்மையான தெளிவின்மையையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசி
  rationale: דבר என்ற வினை தெய்வீக உரையை அறிமுகப்படுத்தும் வழக்கமான எபிரெயக் கதைநடை வடிவம்; ‘பேசி’ என்பது இயல்பான தமிழ் இணை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும் இங்கு ஒருமை வினைச் சூழலில் இஸ்ரவேலின் கடவுளைக் குறிக்கிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கியது என்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: அவரிடம் … என்றார்
  rationale: אמר மற்றும் אֵלָיו ஆகியவற்றைத் தெளிவாகப் பிரதிபலித்து, எபிரெயத்தில் உள்ள இரு பேச்சு வினைகளின் வேறுபாட்டைப் பேணுகிறது.
- source_word: אֲנִי
  choice: நானே
  rationale: வினையில்லா எபிரெய அடையாள வாக்கியத்தில் אֲנִי வலியுறுத்தலுடன் வருகிறது; தமிழின் ‘நானே’ அந்தத் தன்னடையாள வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது; உச்சரிப்பின் வரலாற்றுத் தெளிவின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதனைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பேணுகிறது; அதன் சரியான பண்டைய உச்சரிப்பு முழுமையாக உறுதிப்படுத்தப்படாததால் அதையும் அடிக்குறிப்பு வெளிப்படுத்துகிறது.
