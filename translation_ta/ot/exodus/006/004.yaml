base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: ta
  text: மேலும், அவர்களோடு என் உடன்படிக்கையை நிலைநாட்டினேன்—அவர்கள் அந்நியர்களாகத் தங்கியிருந்த நாடாகிய கானான் நாட்டை[a] அவர்களுக்குக் கொடுப்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “அவர்கள் அந்நியர்களாகத் தங்கியிருந்த நிலம்; அதில் அவர்கள் அந்நியர்களாகத் தங்கியிருந்தார்கள்.”'
    reason: מָגוּר/גור என்ற ஒரே சொல்வேரின் பெயர்ச்சொல்–வினைச்சொல் மறுபடிவத்தையும் மூலத்தின் முழு அமைப்பையும் காட்டும் சொல்லியல் மாற்று.
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய இறை வெளிப்பாட்டுடன் இக்கூற்றை இணைக்கும் சேர்க்கைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲקִמֹתִי אֶת־בְּרִיתִי
  choice: என் உடன்படிக்கையை நிலைநாட்டினேன்
  rationale: קום என்பதுடன் בְּרִית வரும் உடன்படிக்கை மரபுத்தொடரின் உறுதியையும் solemn force-ஐயும், தேவையற்ற கோட்பாட்டு விளக்கம் இன்றிப் பாதுகாக்கிறது.
- source_word: אִתָּם
  choice: அவர்களோடு
  rationale: சூழலில் முற்பிதாக்களைக் குறிக்கும் உறவுநிலை முன்னொட்டையும் பன்மைச் சுட்டையும் நேரடியாகக் காட்டுகிறது.
- source_word: לָתֵת לָהֶם
  choice: அவர்களுக்குக் கொடுப்பதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் எபிரெய முடிவிலி வடிவத்தையும் மறைமுகச் செயப்படுபொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: אֶרֶץ כְּנָעַן
  choice: கானான் நாடு
  rationale: אֶרֶץ என்ற ‘நாடு/நிலம்’ என்னும் பெயரையும் கானான் என்னும் இடப்பெயரையும் தக்கவைக்கிறது.
- source_word: אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ
  choice: அவர்கள் அந்நியர்களாகத் தங்கியிருந்த நாடு
  rationale: מָגוּר மற்றும் גור ஆகியவற்றில் உள்ள, சொந்த நாட்டினராக அல்லாமல் அந்நியக் குடியிருப்பாளர்களாக வாழ்ந்த நிலையை வாசிக்க எளிய தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் மறுபடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: קום + ברית என்ற உடன்படிக்கை மரபுத்தொடர்
  choice: என் உடன்படிக்கையை நிலைநாட்டினேன்
  alternative: என் உடன்படிக்கையை உறுதிப்படுத்தினேன்
  rationale: இது தேவன் முற்பிதாக்களோடு கொண்ட கட்டுப்படுத்தும் உடன்படிக்கை அர்ப்பணிப்பைக் குறிக்கிறது. ‘நிலைநாட்டினேன்’ என்பது உடன்படிக்கையின் மாண்பையும் வலிமையையும் காக்கிறது; உடன்படிக்கை முன்பே செய்யப்பட்டதா என்பதைத் தேவையின்றித் தீர்மானிக்கும் ‘உறுதிப்படுத்தினேன்’ என்ற வாசிப்பைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அந்நியர்களாகத் தங்கியிருந்த’ என்பது தற்காலிக வசிப்பையும் அந்நியர் என்ற சமூக நிலையையும் இணைத்துக் காட்டுகிறது. முதன்மை வாக்கியம் இயல்பாக இருக்க மூலத்தின் சொல்வேர்ச் சார்ந்த மறுபடிவம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
