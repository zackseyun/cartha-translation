  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: ta
  text: ஆரோனின் மகன் எலெயாசார், பூத்தியேலின் மகள்களில் ஒருத்தியைத் தனக்கு மனைவியாக எடுத்துக்கொண்டான்[a]. அவள் அவனுக்குப் பினெகாசைப் பெற்றெடுத்தாள். இவர்களே லேவியரின் தந்தைவழிக் குடும்பங்களின் தலைவர்கள்; அவர்கள் அவரவர் குலங்களின்படி இருந்தனர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “பூத்தியேலின் மகள்களிலிருந்து.” பூத்தியேலின் குடும்பத்தைச் சேர்ந்த ஒரு மகளை மணந்ததை இந்த எபிரேயத் தொடர் குறிக்கலாம்; எந்த மகள் என்பதை அது குறிப்பிடவில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “தந்தையரின் தலைவர்கள்.” இது லேவியரின் குலங்களுக்குள் இருந்த தந்தைவழிக் குடும்ப அலகுகளின் தலைவர்களைக் குறிக்கும் குடிவழிச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: தனக்கு மனைவியாக எடுத்துக்கொண்டான்
  rationale: எபிரேயத் திருமண மரபுத்தொடரின் வடிவையும் பொருளையும் காக்கிறது; வெறுமனே ‘திருமணம் செய்தான்’ என்று சுருக்கவில்லை.
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: பூத்தியேலின் மகள்களில் ஒருத்தியை
  rationale: מִן என்னும் முன்னிடைச்சொல் ஒரு குடும்பக் குழுவிலிருந்து தேர்ந்தெடுத்ததைக் குறிக்கிறது. இயல்பான தமிழுக்காக ஒருமை வெளிப்படுத்தப்பட்டுள்ளது; எபிரேயச் சொல்லமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: அவள் அவனுக்குப் பினெகாசைப் பெற்றாள்
  rationale: பெண்பால் ஒருமை வினையின் எழுவாயாக மனைவியைக் காட்டுவதோடு, לוֹ என்பதையும் ‘அவனுக்கு’ என்று வெளிப்படையாகக் காக்கிறது.
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: முன்னர் பட்டியலிடப்பட்ட நபர்களை முடிவாகச் சுட்டிக்காட்டும் உயிருள்ள மனிதர்களுக்குரிய இயல்பான தமிழ்ச் சுட்டுப்பெயர்.
- source_word: רָאשֵׁי אֲבוֹת
  choice: மூதாதையர் குடும்பங்களின் தலைவர்கள்
  rationale: இது உயிரியல் தந்தையரை மட்டும் அல்லாமல், வம்சவழிக் குடும்ப அலகுகளுக்குத் தலைமை வகித்தவர்களைக் குறிக்கும் சமூக-குடிவழிச் சொற்றொடர்.
- source_word: הַלְוִיִּם
  choice: லேவியர்
  rationale: லேவியின் வழிவந்த கோத்திர மக்களைக் குறிக்கும் நிலையான தமிழ் வடிவம்.
- source_word: לְמִשְׁפְּחֹתָם
  choice: தங்கள் குலங்களின்படி
  rationale: வம்சவரலாற்றுச் சூழலில் מִשְׁפָּחָה என்பது விரிவான குலப் பிரிவைக் குறிக்கிறது; ‘குலங்களின்படி’ அந்த அமைப்பைத் தெளிவாகத் தருகிறது.
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: எலெயாசார் / ஆரோன் / பூத்தியேல் / பினெகாஸ்
  rationale: தனிப்பெயர்கள் மொழிபெயர்க்கப்படாமல், தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன.
