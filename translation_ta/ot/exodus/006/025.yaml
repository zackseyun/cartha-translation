  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத் திருமண மரபுத்தொடரும் குடும்ப அமைப்புச் சொல்லும் இயன்றவரை உரையில் காக்கப்பட்டு, தேவையான விளக்கங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
