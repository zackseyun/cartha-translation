source:
  edition: WLC
  text: וְ/הֵבֵאתִ֤י אֶתְ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֣ת אֹתָ֔/הּ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב וְ/נָתַתִּ֨י אֹתָ֥/הּ לָ/כֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: ta
  text: ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும் கொடுப்பதாக நான் என் கையை உயர்த்தி உறுதியளித்த[a] அந்த நாட்டிற்குள் உங்களைக் கொண்டுவருவேன். அதை உங்களுக்கு உரிமைச் சொத்தாகக் கொடுப்பேன். நானே யாவே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லர்த்தமாக, “கொடுப்பதற்காக நான் என் கையை உயர்த்தினேன்.” கையை உயர்த்துவது ஆணையிட்டு வாக்களிப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: கொண்டுவருவேன்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு ‘உள்ளே கொண்டுவருதல்’ என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது; தமிழில் ‘அந்த நாட்டிற்குள் உங்களைக் கொண்டுவருவேன்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: உடன்படிக்கை வாக்குறுதியின் சூழலில் אֶרֶץ என்பது பூமி முழுவதையும் அல்ல, முற்பிதாக்களுக்கு வாக்களிக்கப்பட்ட குறிப்பிட்ட நாட்டைக் குறிக்கிறது.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: நான் என் கையை உயர்த்தி ஆணையிட்ட
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக ‘என் கையை உயர்த்தினேன்’ என்று கூறி, ஆணையிட்டு வாக்களிப்பதைக் குறிக்கிறது. தமிழில் உருவகத்தையும் அதன் பொருளையும் சேர்த்துக் கூறுவது தெளிவையும் மூலத்தின் காட்சியையும் காக்கிறது.
- source_word: לָתֵת אֹתָהּ
  choice: கொடுப்பதாக
  rationale: נתן என்பதன் நேரடியான பொருள் ‘கொடுத்தல்’; இங்கு நோக்கத்தையும் வாக்குறுதியையும் இயல்பான தமிழ் தொடரில் வெளிப்படுத்துகிறது.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும்
  rationale: ஒவ்வொரு பெயருக்கும் முன் வரும் לְ என்ற முன்னிடைச்சொல்லின் பகிர்ந்தளிக்கும் பொருளைத் தமிழின் ‘-க்கும்’ உருபு இயல்பாகக் காட்டுகிறது.
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: அதை உங்களுக்குக் கொடுப்பேன்
  rationale: வாக்குறுதியின் நேரடியான எதிர்காலத் தன்மையை எளிய தமிழில் காக்கிறது.
- source_word: מוֹרָשָׁה
  choice: உரிமைச் சொத்து
  rationale: מוֹרָשָׁה என்பது நிலையான உரிமையோடு பெற்றுக்கொள்ளப்படும் உடைமையைக் குறிக்கிறது. ‘உரிமைச் சொத்து’ என்பது வெறும் தற்காலிக உடைமையைவிட இந்த நுண்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲנִי יְהוָה
  choice: நானே யாவே
  rationale: יְהוָה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது; ‘நானே’ என்பது எபிரெயின் solemn self-identification-ஐ இயல்பான தமிழில் வலியுறுத்துகிறது.
theological_decisions:
- issue: נָשָׂאתִי אֶת יָדִי என்ற ஆணை மொழியை மொழிபெயர்த்தல்
  choice: நான் என் கையை உயர்த்தி ஆணையிட்ட
  alternative: நான் ஆணையிட்டு வாக்களித்த
  rationale: இந்தச் சொற்றொடர் ஆணையிடும் செயலைக் குறித்தாலும், கையை உயர்த்தும் மூல உருவகம் உடன்படிக்கைச் சூழலில் குறிப்பிடத்தக்கது. முதன்மை உரை உருவகத்தையும் பொருளையும் காக்கிறது; அடிக்குறிப்பு அதன் சொல்லர்த்தத்தை விளக்குகிறது.
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை பொதுப்பட்டத்தைக் காட்டாமல் இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது; ஆகவே அதை ஒலிபெயர்ப்பது அந்த வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நாடு,’ ‘உரிமைச் சொத்து’ போன்ற சொற்கள் இயல்பானவையாகவும் உடன்படிக்கைச் சூழலைத் துல்லியமாகக் காட்டுவனவாகவும் உள்ளன; இறைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
