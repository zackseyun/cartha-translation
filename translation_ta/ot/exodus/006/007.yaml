  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: ta
  text: நான் உங்களை எனக்குரிய மக்களாக எடுத்துக்கொள்வேன்; நான் உங்களுக்குக் கடவுளாக இருப்பேன். எகிப்தின் சுமைகளுக்குக் கீழிருந்து[b] உங்களை வெளியே கொண்டுவருகிறவர்[a] நானே—உங்கள் கடவுளாகிய யாவே—என்பதை நீங்கள் அறிந்துகொள்வீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெளியே கொண்டுவந்தவர்.” எபிரேயத்தில் இங்கு பெயரெச்ச வினை வடிவம் உள்ளது; அது தொடர்ச்சியான அல்லது தன்மைசார் செயலை வலியுறுத்தலாம்; அல்லது யாவேயை வரையறுக்கும் நிறைவேறிய செயலாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எகிப்தின் கட்டாய உழைப்பிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  choice: நான் உங்களை எனக்கென்று ஒரு மக்களாக ஏற்றுக்கொள்வேன்
  rationale: לָקַחְתִּי என்பதன் எடுத்துக்கொள்ளுதல்/ஏற்றுக்கொள்ளுதல் என்ற பொருளையும், לִי לְעָם காட்டும் உடைமை மற்றும் உடன்படிக்கை உறவையும் இயல்பான நவீன தமிழில் இணைக்கிறது.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: நான் உங்களுக்குக் கடவுளாக இருப்பேன்
  rationale: எபிரேய உடன்படிக்கைச் சூத்திரத்தின் உறவுசார் பொருளை நேரடியாகக் காக்கிறது; பின்னாளைய கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- source_word: וִידַעְתֶּם
  choice: நீங்கள் அறிந்துகொள்வீர்கள்
  rationale: வருங்கால அறிதலையும் அனுபவத்தின் மூலம் உணர்ந்துகொள்வதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַמּוֹצִיא
  choice: வெளியே கொண்டுவருகிறவர்
  rationale: எபிரேய வினையெச்ச வடிவத்தின் தொடரும் அல்லது யாவேயை விடுவிப்பவராக வரையறுக்கும் தன்மையைத் தக்கவைக்கிறது; சூழலில் நிறைவேறிய செயலைக் குறிக்கும் வாசிப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  choice: எகிப்தின் சுமைகளுக்குக் கீழிருந்து
  rationale: מִתַּחַת என்பதன் ‘கீழிருந்து’ என்ற உருவகத்தையும், סִבְלֹת என்பதன் சுமைகள்/ஒடுக்குமுறை உழைப்பு என்ற பொருள் அகலத்தையும் காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூத்திரம்
  choice: எனக்கென்று ஒரு மக்களாக… உங்களுக்குக் கடவுளாக
  alternative: என் மக்களாக… உங்கள் கடவுளாக
  rationale: இரட்டை לְ அமைப்பில் உள்ள சொந்தம், நோக்கம், உறவு ஆகியவற்றை வெளிப்படையாக வைத்திருக்கிறது; குறிப்பிட்ட இறையியல் முறைமையைச் சேர்ப்பதில்லை.
- issue: தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் יהוה என்ற தனிப்பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: הַמּוֹצִיא வினையெச்சத்தின் கால நுணுக்கம்
  choice: வெளியே கொண்டுவருகிறவர்
  alternative: வெளியே கொண்டுவந்தவர்
  rationale: மூலத்தின் வினையெச்சத் தன்மையை முதன்மை உரையில் காக்கிறது; வாக்குறுதி நிறைவேறும் நிலையிலிருந்து கடந்த செயலாகப் புரிந்துகொள்ளும் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள்’, ‘கடவுள்’, ‘சுமைகள்’ போன்ற வழக்குச் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் உருவகமும் உடன்படிக்கை உறவும் தெளிவாகக் காக்கப்பட்டுள்ளன.
