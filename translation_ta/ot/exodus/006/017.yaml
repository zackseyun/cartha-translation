  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் குடும்பங்களின்படி.’ எபிரெயச் சொல் ஒரு கோத்திரத்திற்குள் உள்ள விரிந்த குடும்பக் குழுக்களையோ குலங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: இது בֵּן என்பதன் பன்மை இணைப்புவடிவம்; உடனடியாக வரும் வம்சப்பட்டியலில் நேரடியான மகன்களைக் குறிக்கிறது.
- source_word: גֵרְשׁוֹן
  choice: கெர்சோன்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: לִבְנִי
  choice: லிப்னி
  rationale: தனிப்பெயர் என்பதால் பொருள் மொழிபெயர்ப்பு செய்யாமல் எழுத்துப்பெயர்க்கப்பட்டது.
- source_word: וְשִׁמְעִי
  choice: சிமேயி
  rationale: இணைப்புச்சொல்லுடன் வரும் இரண்டாவது தனிப்பெயர்; தமிழ் பட்டியல் அமைப்பில் ‘லிப்னியும் சிமேயியும்’ என்று இயல்பாக வழங்கப்பட்டது.
- source_word: לְמִשְׁפְּחֹתָם
  choice: அவரவர் குலங்களின்படி
  rationale: מִשְׁפָּחָה என்பது இத்தகைய கோத்திர வம்சப்பட்டியல் சூழலில் தனிக்குடும்பத்தைவிட விரிந்த குலப்பிரிவைக் குறிக்கலாம். பன்மை உடைமைப்பொருளை ‘அவரவர்’ தெளிவாக வெளிப்படுத்துகிறது.
