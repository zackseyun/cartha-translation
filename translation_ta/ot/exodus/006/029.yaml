base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: ta
  text: 'அப்போது யாவே மோசேயிடம் கூறினார்: “நான் யாவே. நான் உன்னிடம் சொல்கிற[a] அனைத்தையும் எகிப்தின் அரசனான பார்வோனிடம் சொல்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உன்னிடம் சொல்லிக்கொண்டிருக்கிற அனைத்தையும் எகிப்தின் அரசனான பார்வோனிடம் சொல்.”
    reason: דֹּבֵר என்ற எபிரெயப் பங்கெச்சம் தொடர்ச்சியாக நடைபெறும் பேச்சையும் குறிக்கலாம்.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: அப்போது ... பேசி
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்கிறது; ‘அப்போது’ இயல்பான தமிழ் நிகழ்வுத் தொடரைத் தருகிறது, ‘பேசி’ דבר என்பதன் பொருளைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לֵאמֹר
  choice: … என்றார்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவத்தை இயல்பான தமிழ் மேற்கோள் முடிவாக மாற்றுகிறது.
- source_word: אֲנִי יְהוָה
  choice: நான் யாவே
  rationale: வினைச்சொல் இல்லாத எபிரெய அடையாளக் கூற்றைச் சுருக்கமாகவும் வலியுறுத்தலுடனும் காக்கிறது.
- source_word: דַּבֵּר
  choice: சொல்
  rationale: கட்டளை வடிவத்தை நேரடியாகத் தருகிறது; இலக்கு நபரிடம் செய்தியை முழுமையாக எடுத்துரைக்கும் சூழலில் இயல்பான நவீனத் தமிழ்.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசனாகிய பார்வோனிடம்
  rationale: எபிரெய மொழியின் இணைப்புப் பெயரமைப்பை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֵת כָּל אֲשֶׁר
  choice: அனைத்தையும்
  rationale: கூறப்பட வேண்டிய செய்தியின் முழுமையைச் சுருக்கமாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: நான் உன்னிடம் சொல்கிற
  rationale: பங்கெச்ச வடிவத்தின் நிகழ்கால அல்லது தொடர்நிலை நுணுக்கத்தைத் திறந்தவாறு வைத்திருந்து, தமிழில் இயல்பான தொடர்பெயரெச்சமாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் அடையாளக் கூற்றைத் தெளிவாகக் காக்கிறது.
- issue: אֲנִי דֹּבֵר என்பதன் காலநிலை
  choice: நான் ... சொல்கிற
  alternative: நான் ... சொல்லிக்கொண்டிருக்கிற
  rationale: எபிரெயப் பங்கெச்சம் நிகழ்நிலை அல்லது தொடர்நிலையை உணர்த்தலாம். முதன்மை உரையில் இயல்பான நிகழ்காலத்தைப் பயன்படுத்தி, தொடர்நிலை வாய்ப்பை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வேதாகமத்திற்குரிய கண்ணியமும் கொண்ட, பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. மூலத்தில் மீளும் דבר வேர்ச்சொல்லை ‘பேசி/சொல்கிற/சொல்’ என்ற தொடர்புடைய பேச்சுச் சொற்களால் இயன்றவரை காக்கிறது.
