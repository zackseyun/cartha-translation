  yaml_path: translation/ot/exodus/006/010.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: பின்பு யாவே மோசேயிடம் கூறினார்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’; ‘யெகோவா’ என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசினார்
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; דּבר என்பதன் ‘பேசு’ என்ற பொருளையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: பேச்சு மோசேயை நோக்கிச் செலுத்தப்படுவதை இயல்பான தமிழில் குறிக்கிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரெயத் தனிப்பெயரின் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: அடுத்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘பேசிச் சொன்னார்’ என்பது மூலத்தின் דּבר ... לאמר அமைப்பைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. ஆகவே பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாகப் பெயரின் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது; மாற்று மரபுவழி ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, எளிதில் புரியும் தமிழ். எபிரெயக் கதைத் தொடரின் முன்னேற்றமும் ‘பேசி… சொல்லுதல்’ என்ற சூத்திர அமைப்பும் இயல்பாகக் காக்கப்பட்டுள்ளன.
