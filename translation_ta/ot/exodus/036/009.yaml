  text: אֹ֜רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁמֹנֶ֤ה וְ/עֶשְׂרִים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּֽ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְ/כָל הַ/יְרִיעֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/009.yaml
  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: ta
  text: ஒவ்வொரு திரைச்சீலையின் நீளம் இருபத்தெட்டு முழம்[a]; ஒவ்வொரு திரைச்சீலையின் அகலம் நான்கு முழம். எல்லாத் திரைச்சீலைகளுக்கும் ஒரே அளவு இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு முழம் என்பது முழங்கையிலிருந்து நடுவிரல் நுனிவரையிலான நீளத்தை அடிப்படையாகக் கொண்ட பண்டைய அளவலகு.
    reason: measurement_clarification
lexical_decisions:
- source_word: אֹרֶךְ
  choice: நீளம்
  rationale: ஒரு பொருளின் பரிமாணத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: יְרִיעָה
  choice: திரைச்சீலை
  rationale: திருவாசஸ்தலச் சூழலில் துணியால் செய்யப்பட்ட பெரிய மூடுதிரை அல்லது விரிப்பைக் குறிக்கிறது; ‘திரைச்சீலை’ சூழலுக்கு ஏற்ற தெளிவான சொல்.
- source_word: הָאַחַת / הָאֶחָת
  choice: ஒவ்வொரு
  rationale: சொல்லுக்கு நேராக ‘அந்த ஒன்று’ என்றாலும், ஒவ்வொரு திரைச்சீலைக்கும் தனித்தனியாக ஒரே பரிமாணங்கள் பொருந்துவதை விநியோகப் பொருளில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: இருபத்தெட்டு
  rationale: எண்ணின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אַמָּה
  choice: முழம்
  rationale: பண்டைய எபிரெய அளவலகுக்கான நிலைபெற்ற தமிழ் வேதாகமச் சொல்; நவீன அலகாக ஊகித்து மாற்றாமல் மூல அளவைக் காக்கிறது.
- source_word: רֹחַב
  choice: அகலம்
  rationale: நீளத்துக்கு இணையான மற்றொரு பரிமாணத்தைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: אַרְבַּע
  choice: நான்கு
  rationale: எண்ணின் நேரடி தமிழ் மொழிபெயர்ப்பு.
- source_word: מִדָּה אַחַת
  choice: ஒரே அளவு
  rationale: ‘ஒரு அளவு’ என்ற மூலச் சொற்றொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, அனைத்துத் திரைச்சீலைகளும் ஒரே பரிமாணத்தைக் கொண்டிருந்ததைத் தெரிவிக்கிறது.
- source_word: לְכָל הַיְרִיעֹת
  choice: எல்லாத் திரைச்சீலைகளுக்கும்
  rationale: ஒரே அளவு அனைத்துத் திரைச்சீலைகளுக்கும் பொருந்தியதை, எபிரெய முன்னிடைச்சொல்லையும் சேர்த்து இயல்பாகக் காட்டுகிறது.
