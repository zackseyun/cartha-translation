  text: And for the rear of the tabernacle[a], westward, he made six frames.
translation:
  language: ta
  text: திருவாசஸ்தலத்தின் மேற்குத் திசையாகிய பின்புறத்திற்காக, அவன் ஆறு சட்டகங்களைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: பின்புறத்திற்காக
  rationale: இந்தச் சொல் தொலைவான அல்லது பின்புறப் பகுதியைக் குறிக்கிறது. இக்கட்டுமானச் சூழலில் இயல்பான ஒருமைப் பொருளைத் தரும் ‘பின்புறத்திற்காக’ என்பது பொருத்தமானது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: מִשְׁכָּן என்பது ‘வாசஸ்தலம்’ என்ற அடிப்படைப் பொருளுடன், யாத்திராகமத்தில் தேவனுடைய பரிசுத்தக் கூடார அமைப்பைக் குறிக்கும் நிலையான சொல்; ‘திருவாசஸ்தலம்’ அதன் வழிபாட்டுச் சூழலையும் அமைப்பின் தன்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: יָמָּה
  choice: மேற்குப் பக்கத்தில்
  rationale: எபிரெயச் சொல்லின் நேரடிப் படிமம் ‘கடலை நோக்கி’ என்பதாக இருந்தாலும், இங்கு அது வழக்கமாக மேற்குத் திசையைக் குறிக்கிறது. கட்டுமான விவரிப்பில் ‘மேற்குப் பக்கத்தில்’ என்பது இயல்பான தமிழ்.
- source_word: עָשָׂה
  choice: அவன் செய்தான்
  rationale: பொதுவான ‘செய்/உருவாக்கு’ என்ற வினையை நேரடியாகவும், கட்டுமான விவரிப்பின் மீளுரைப் பாணிக்கு ஏற்றவாறும் மொழிபெயர்க்கிறது.
- source_word: שִׁשָּׁה
  choice: ஆறு
  rationale: எண்ணிக்கையை நேரடியாகக் குறிக்கிறது.
- source_word: קְרָשִׁים
  choice: சட்டங்கள்
  rationale: இவை திருவாசஸ்தலத்தின் செங்குத்தான கட்டமைப்பு உறுப்புகள். ‘சட்டங்கள்’ என்பது வெறும் தட்டையான பலகைகள் என்ற எண்ணத்தைத் தவிர்த்து, அவற்றின் கட்டமைப்புப் பணியை வெளிப்படுத்துகிறது.
