translation_notes:
  register: நவீனத் தரத் தமிழில், கட்டுமான விவரத்தின் மீளுரையைப் பேணும் கண்ணியமான மற்றும் எளிதில் புரியும் நடை. எபிரெய உரையில் செய்பவர் வெளிப்படையாகப் பெயரிடப்படாததால் ‘செய்தான்’ என்ற வினை வடிவம் மட்டும் வைக்கப்பட்டது. ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறியீடுகள் சற்றுத் தள்ளிப்போனதாகத் தோன்றுவதால், மூல எபிரெயச் சொற்றொடர்களுக்கேற்ற இடங்களில் [a], [b] வைக்கப்பட்டன.
