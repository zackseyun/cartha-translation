  text: חֲמִשִּׁ֣ים לֻלָאֹ֗ת עָשָׂה֮ בַּ/יְרִיעָ֣ה הָ/אֶחָת֒ וַ/חֲמִשִּׁ֣ים לֻלָאֹ֗ת עָשָׂה֙ בִּ/קְצֵ֣ה הַ/יְרִיעָ֔ה אֲשֶׁ֖ר בַּ/מַּחְבֶּ֣רֶת הַ/שֵּׁנִ֑ית מַקְבִּילֹת֙ הַ/לֻּ֣לָאֹ֔ת אַחַ֖ת אֶל אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/012.yaml
  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: ta
  text: ஒரு திரைச்சீலையில் ஐம்பது வளையங்களைச் செய்தான்; இரண்டாவது இணைப்புத் தொகுதியில்[a] இருந்த திரைச்சீலையின் ஓரத்தில் ஐம்பது வளையங்களைச் செய்தான். அந்த வளையங்கள் ஒன்றுக்கொன்று நேராக அமைந்திருந்தன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரண்டாவது இணைப்பில்.’ ‘இணைப்புத் தொகுதி’ என்பது ஒன்றாக இணைக்கப்பட்ட திரைச்சீலைகளின் பிரிவைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘வளையங்கள் ஒன்றை நோக்கி ஒன்று பொருந்தியிருந்தன.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: வளையங்கள்
  rationale: திரைச்சீலைகளை ஒன்றோடொன்று இணைப்பதற்காகத் துணியில் செய்யப்பட்ட வளையங்களைக் குறிக்கிறது. வேறு இடங்களில் வரும் உலோகக் கொக்கிகளோடு குழப்பாமல், இயல்பாகவும் துல்லியமாகவும் ‘வளையங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְרִיעָה
  choice: திரைச்சீலை
  rationale: திருவாசஸ்தல அமைப்பில் பயன்படுத்தப்பட்ட பெரிய துணித்திரையைக் குறிக்கிறது; நவீன தமிழில் ‘திரைச்சீலை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בִּקְצֵה
  choice: ஓரத்தில்
  rationale: இங்கு வளையங்கள் இணைப்புக்காகத் திரையின் விளிம்பில் அமைக்கப்பட்டதால், ‘ஓரத்தில்’ என்பது சூழலுக்கு ஏற்ற இயல்பான மொழிபெயர்ப்பு.
- source_word: מַחְבֶּרֶת
  choice: இணைப்புத் தொகுதி
  rationale: ஒன்றாக இணைக்கப்பட்ட திரைச்சீலைகளால் உருவான பிரிவைக் குறிக்கிறது. ‘இணைப்பு’ என்ற செயற்பொருளையும் ‘தொகுதி’ என்ற விளைவையும் இச்சொற்றொடர் காக்கிறது.
- source_word: הַשֵּׁנִית
  choice: இரண்டாவது
  rationale: இது வரிசை எண்ணைக் குறிக்கும் பெயரடை; மூலத்தின் நேரடிப் பொருள் காக்கப்பட்டது.
- source_word: מַקְבִּילֹת
  choice: நேராக அமைந்திருந்தன
  rationale: எதிரெதிரே பொருந்தி இணைக்க ஏதுவாக வளையங்கள் சீரமைந்திருந்ததைத் தெளிவாகக் கூறுகிறது.
- source_word: אַחַת אֶל אֶחָת
  choice: ஒன்றுக்கொன்று
  rationale: ஒவ்வொரு வளையமும் மறுபுறத்திலுள்ள மற்றொரு வளையத்தோடு நேராகப் பொருந்திய பரஸ்பர அமைப்பைக் குறிக்கும் இயல்பான தமிழ் நடை.
- source_word: עָשָׂה
  choice: செய்தான்
  rationale: பொதுவான செயற்பாட்டைச் சுட்டும் எபிரெய வினைக்கு எளிய, நேரடியான தமிழ் இணை.
