base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: ta
  text: இருபது சட்டங்களின் கீழ் நாற்பது வெள்ளி அடித்தளங்களை அவர் செய்தார்; ஒரு சட்டத்தின் இரண்டு பொருத்து முனைகளுக்குக் கீழ் இரண்டு அடித்தளங்களையும், மற்ற சட்டத்தின் இரண்டு பொருத்து முனைகளுக்குக் கீழ் இரண்டு அடித்தளங்களையும் செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי
  choice: அடித்தளங்கள்
  rationale: கூடாரச் சட்டங்களின் பொருத்து முனைகளைத் தாங்கும் வெள்ளித் தாங்குதளங்களைக் குறிக்கும் சொல்; நவீன தமிழில் இயல்பாகவும் கட்டுமானச் சூழலில் தெளிவாகவும் உள்ளது.
- source_word: הַקְּרָשִׁים
  choice: சட்டங்கள்
  rationale: திருக்கூடாரத்தின் செங்குத்தான கட்டமைப்பு உறுப்புகளைக் குறிக்கிறது; அவை வெறும் பலகைகளா அல்லது தடித்த சட்டங்களா என்ற வடிவத் துல்லியத்தை மிகைப்படுத்தாமல், கட்டமைப்புப் பணியை வெளிப்படுத்துகிறது.
- source_word: יְדֹתָיו
  choice: பொருத்து முனைகள்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘கைகள்’; இங்கு அடித்தளங்களுக்குள் செருகப்படும் சட்டத்தின் இரண்டு நீட்சிகள் அல்லது முனைகளைக் குறிக்கும் தொழில்நுட்பப் பயன்பாடு.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: ஒரு சட்டம் ... அடுத்த சட்டம்
  rationale: இரண்டாவது பயன்பாடு எண்ணியல் ரீதியில் அதே ‘ஒன்று’ என்றாலும், தொடர்ச்சியான பகிர்வை இயல்பான தமிழில் ‘அடுத்த’ என்று வெளிப்படுத்துவது ஒவ்வொரு சட்டத்திற்கும் இரண்டு அடித்தளங்கள் என்பதைக் காட்டுகிறது.
