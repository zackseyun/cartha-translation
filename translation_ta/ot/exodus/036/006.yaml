base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: ta
  text: 'அப்போது மோசே கட்டளையிட்டார்; முகாமெங்கும் அறிவிக்கச் செய்தார்கள்[a]: “ஆணோ பெண்ணோ பரிசுத்த இடத்துக்கான காணிக்கைக்காக[b] இனி எந்த வேலையும் செய்ய வேண்டாம்.” இவ்வாறு மக்கள் மேலும் கொண்டுவருவதிலிருந்து தடுக்கப்பட்டார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “முகாமில் ஒரு குரலைக் கடந்து செல்லச் செய்தார்கள்”; அதாவது முகாமெங்கும் அறிவிக்கச் செய்தார்கள்.
    reason: lexical_alternative
  - marker: b
    text: “பரிசுத்த இடத்துக்கான காணிக்கை” என்பதை “பரிசுத்த காணிக்கை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டார்
  rationale: צוה என்பது அதிகாரத்தோடு கட்டளையிடுவதைக் குறிக்கிறது; மோசேயின் உத்தரவின் வலிமையை இந்தச் சொல் இயல்பாகக் காக்கிறது.
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: ஓர் அறிவிப்பைச் சுற்றிவரச் செய்தார்கள்
  rationale: எபிரெய மொழிப்படிமத்தில் ‘ஒரு குரலைக் கடந்து செல்லச் செய்தார்கள்’ என்ற காரணவினைத் தன்மை உள்ளது. முகாமெங்கும் பொதுவான அறிவிப்பு பரவச் செய்யப்பட்டதை இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: בַּמַּחֲנֶה
  choice: முகாம் முழுவதும்
  rationale: முன்னுள்ள அறிவிப்பு பரவச் செய்யப்பட்டது என்ற மொழிப்படிமத்துடன் இணைந்து, முகாமின் மக்களிடையே அது பரவியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אִישׁ וְאִשָּׁה
  choice: ஆணோ பெண்ணோ
  rationale: மூலத்தில் ஆண், பெண் இருவரும் வெளிப்படையாகக் குறிப்பிடப்படுகின்றனர்; தடை வாக்கியத்துக்கு ஏற்ற தமிழ்நடை இது.
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: இனி எந்த வேலையும் செய்ய வேண்டாம்
  rationale: מְלָאכָה என்பது வேலை அல்லது கைவினைப் பணியைக் குறிக்கலாம். இங்கு காணிக்கைக்காகப் பொருட்களை உருவாக்கும் பணியையும் உள்ளடக்கும் வகையில் அகன்ற பொருளைத் தக்கவைக்கிறது.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்துக்கான காணிக்கைக்காக
  rationale: תְּרוּמָה என்பது அர்ப்பணிக்கப்பட்ட காணிக்கை அல்லது பங்களிப்பு; הַקֹּדֶשׁ இச்சூழலில் பரிசுத்த இடத்தைக் குறிக்கிறது. இந்தத் தேர்வு கூடாரப் பரிசுத்த இடத்துக்காக அளிக்கப்பட்ட காணிக்கையைத் தெளிவுபடுத்துகிறது.
- source_word: וַיִּכָּלֵא
  choice: தடுக்கப்பட்டார்கள்
  rationale: כלא என்பதன் நிபால் வடிவம் தடுக்கப்படுதல் அல்லது நிறுத்தப்படுதலைக் குறிக்கிறது. மக்கள் கொடுக்க விரும்பவில்லை என்ற கருத்தைப் புகுத்தாமல் அதன் செயப்பாட்டு நிலையைப் பாதுகாக்கிறது.
- source_word: מֵהָבִיא
  choice: மேலும் கொண்டுவருவதிலிருந்து
  rationale: מן உடன் வரும் வினையெச்சம் அந்தச் செயல் தடுக்கப்பட்டதைச் சுட்டுகிறது; முந்தைய வசனங்களின் சூழலில் தேவைக்கு அதிகமாகிவிட்டதால் இனி காணிக்கைகள் கொண்டுவரப்படவில்லை என்பதைக் ‘மேலும்’ தெளிவாக்குகிறது.
