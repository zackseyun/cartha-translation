base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: ta
  text: அவர்கள் மோசேயின் முன்னிலையிலிருந்து[a], பரிசுத்த இடத்தின் சேவைப் பணியை நிறைவேற்றுவதற்காக இஸ்ரவேல் மக்கள் கொண்டுவந்த காணிக்கைகள் அனைத்தையும் எடுத்துக்கொண்டார்கள். இஸ்ரவேல் மக்களோ அவரிடம் காலைதோறும்[b] விருப்பக் காணிக்கைகளைத் தொடர்ந்து கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மோசேயிடமிருந்து.’ சொல்லுக்குச் சொல், ‘மோசேயின் முன்னிலையிலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘காலை காலையாக.’ அதாவது, ‘ஒவ்வொரு காலையிலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: எடுத்துக்கொண்டார்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்தல்’ என்பதைக் காக்கிறது; இச்சூழலில் கைவினைஞர்கள் மோசேயின் பொறுப்பிலிருந்த பொருட்களைப் பெற்றுக்கொண்டதையும் இயல்பாக உணர்த்துகிறது.
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: மோசேயின் முன்னிலையிலிருந்து
  rationale: ‘மோசேயின் முன்பிருந்து/முன்னிலையிலிருந்து’ என்ற எபிரெய உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது; பொருட்கள் அவரது உடனடிப் பொறுப்பிலிருந்து மாற்றப்பட்டன என்பதையும் காட்டுகிறது.
- source_word: הַתְּרוּמָה
  choice: காணிக்கைகள்
  rationale: பரிசுத்த பயன்பாட்டுக்காக ஒதுக்கப்பட்ட நன்கொடைகளை இங்கு குறிக்கிறது. எபிரெயச் சொல் ஒருமை வடிவில் கூட்டுப்பொருள் தருவதால், பலவகைப் பொருட்கள் கொண்டுவரப்பட்ட சூழலில் தமிழ் பன்மை இயல்பாக உள்ளது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் மரபான கூட்டுப் பெயர்; ‘இஸ்ரவேல் மக்கள்’ நவீன தமிழில் துல்லியமும் இயல்பும் உடையது.
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்திற்கான பணியை
  rationale: מְלָאכָה மற்றும் עֲבֹדָה ஆகிய தொடர்புடைய பெயர்ச்சொற்களின் அடுக்கைச் சுருக்காமல் கருத்தளவில் தக்கவைத்து, הַקֹּדֶשׁ என்பதை இச்சூழலில் பரிசுத்த இடம்/திருக்கூடாரம் எனப் புரியவைக்கிறது.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: செய்வதற்காக
  rationale: עשה என்பதன் விரிந்த ‘செய்/உருவாக்கு’ பொருளில் இங்கு குறிப்பிடப்பட்ட பணியை நிறைவேற்றுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְהֵם הֵבִיאוּ
  choice: இஸ்ரவேல் மக்களோ … தொடர்ந்து கொண்டுவந்தார்கள்
  rationale: தனித்துச் சேர்க்கப்பட்ட הֵם என்ற சுட்டுப்பெயரின் வலியுறுத்தலையும், பொருட்கள் எடுத்துச் செல்லப்பட்டுக்கொண்டிருந்தபோதும் மக்கள் அளித்துக்கொண்டே இருந்த தொடர்ச்சியையும் ‘மக்களோ’ மற்றும் ‘தொடர்ந்து’ வெளிப்படுத்துகின்றன.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: சுட்டுப்பெயரின் இயல்பான முன்னோடி மோசே; எபிரெய உரையின் சுட்டுப்பெயர் இணைப்பைத் தமிழிலும் காக்கிறது.
- source_word: נְדָבָה
  choice: விருப்பக் காணிக்கைகளை
  rationale: தன்னார்வமாக அளிக்கப்பட்ட கொடையைத் தெளிவாகக் குறிக்கிறது; தொடர்ச்சியான பல அளிப்புகளைக் கருத்தில் கொண்டு தமிழ் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: காலைதோறும்
  rationale: மீண்டும் மீண்டும் நிகழ்வதைக் குறிக்கும் எபிரெய இரட்டிப்பைச் சுருக்கமான, இயல்பான நவீன தமிழில் தருகிறது.
