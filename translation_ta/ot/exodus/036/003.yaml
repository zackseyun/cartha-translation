  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் வலியுறுத்தல் ‘இஸ்ரவேல் மக்களோ’ என்பதாலும், தொடர்ந்து கொடுத்த செயல் ‘தொடர்ந்து கொண்டுவந்தார்கள்’ என்பதாலும் வெளிப்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த இடம்’ என்பது இச்சூழலில் திருக்கூடாரப் பரிசுத்த வளாகத்தைக் குறிக்கிறது.
