  text: The length of each frame was ten cubits[a], and the width of each frame was a cubit and a half.
translation:
  language: ta
  text: ஒவ்வொரு கட்டமைப்புச் சட்டமும் பத்து முழம் நீளமும் ஒன்றரை முழம் அகலமும் கொண்டிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலகை” அல்லது “மரப்பலகை.” எபிரெயச் சொல் קֶרֶשׁ திருக்கூடாரத்தின் கட்டமைப்புப் பகுதிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת
  choice: பத்து முழம்
  rationale: எபிரெயச் சொற்றொடர் அளவை நேரடியாகக் குறிப்பிடுகிறது. பண்டைய அளவான ‘முழம்’ என்பதையே வைத்திருப்பது மூலத்துக்கு உண்மையாகவும் தமிழில் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
- source_word: אֹרֶךְ
  choice: நீளம்
  rationale: இந்தப் பெயர்ச்சொல் பொருளின் நீள அளவைக் குறிக்கிறது; ‘சட்டத்தின் நீளம்’ என்பது இயல்பான தமிழ் அமைப்பு.
- source_word: הַקָּרֶשׁ
  choice: சட்டம்
  rationale: திருக்கூடாரத்தின் நிமிர்ந்த கட்டமைப்புப் பகுதிகளை இச்சொல் குறிக்கிறது. ‘சட்டம்’ கட்டுமானப் பங்கை வெளிப்படுத்துகிறது; ‘பலகை’ என்பதும் சாத்தியமான மாற்று.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: ஒன்றரை முழம்
  rationale: ‘ஒரு முழமும் அரை முழமும்’ என்ற எபிரெய மரபுத்தொடரின் அளவை நவீன தமிழில் இயல்பாக ‘ஒன்றரை முழம்’ என வழங்குகிறது.
- source_word: רֹחַב
  choice: அகலம்
  rationale: பொருளின் குறுக்குப் பரிமாணத்தைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ்ச் சொல்.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: ஒவ்வொரு சட்டம்
  rationale: சொல்லுக்குச் சொல் ‘அந்த ஒரு சட்டம்’ என்றாலும், இங்கு ஒவ்வொரு தனிப்பட்ட கட்டமைப்புப் பகுதியின் அளவையும் பகிர்மான முறையில் குறிக்கிறது.
