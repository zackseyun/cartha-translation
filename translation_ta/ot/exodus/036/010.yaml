  text: He joined five of the curtains to one another[a], and the other five curtains he joined to one another.
translation:
  language: ta
  text: அவன் ஐந்து திரைச்சீலைகளை ஒன்றோடொன்று இணைத்தான்; மற்ற[a] ஐந்து திரைச்சீலைகளையும் ஒன்றோடொன்று இணைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் இரண்டாம் கூறு நேரடியாக, “மேலும் ஐந்து திரைச்சீலைகளை” என்று உள்ளது; இது இரண்டாவது ஐந்து திரைச்சீலைகளின் தொகுதி என்பதைத் தெளிவுபடுத்த “மற்ற” என்பது தமிழில் சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: இணைத்தான்
  rationale: חבר என்பது இணைத்தல் அல்லது ஒன்றுசேர்த்தல் என்று பொருள்படும். கூடார அமைப்பின் சூழலில் இணைத்தான் என்பது இயல்பானதும், இணைத்த முறையைத் தேவையின்றி குறிப்பாக்காததும் ஆகும்.
- source_word: יְרִיעֹת
  choice: திரைச்சீலைகள்
  rationale: கூடாரத்தின் சூழலில் இச்சொல் பெரிய துணித் திரைகளைக் குறிக்கிறது. திரைச்சீலைகள் என்பது தெளிவான, வழக்கமான தமிழ் சொல்.
- source_word: חֲמֵשׁ
  choice: ஐந்து
  rationale: எண்ணைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: אַחַת אֶל אֶחָת
  choice: ஒன்றோடொன்று
  rationale: ஒவ்வொரு தொகுதியிலும் திரைச்சீலைகள் பரஸ்பரம் இணைக்கப்பட்டதை இந்த எபிரெயச் சொற்றொடர் குறிக்கிறது; ஒன்றோடொன்று என்பது இயல்பான தமிழ் வடிவம்.
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: மற்ற ஐந்து திரைச்சீலைகளையும்
  rationale: எபிரெயில் நேரடியாக ‘மேலும் ஐந்து திரைச்சீலைகளை’ என்று உள்ளது. இணை அமைப்பு இரண்டாவது ஐந்து திரைச்சீலைகளின் தொகுதியைக் குறிப்பதால், தமிழில் பொருள் தெளிவாக இருக்க ‘மற்ற’ சேர்க்கப்பட்டுள்ளது; ‘-ஐயும்’ இணைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
