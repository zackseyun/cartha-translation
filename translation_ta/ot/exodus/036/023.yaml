source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֶשְׂרִ֣ים קְרָשִׁ֔ים לִ/פְאַ֖ת נֶ֥גֶב תֵּימָֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/023.yaml
  text: 'He made the frames for the tabernacle: twenty frames for the south side[a], toward the south.'
translation:
  language: ta
  text: 'அவர் திருக்கூடாரத்திற்கான பலகைகளைச் செய்தார்: தெற்குப் பக்கத்திற்காக, தெற்கு நோக்கி, இருபது பலகைகள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இருபது சட்டங்களை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மூலத்தில் தெற்கைக் குறிக்கும் சொற்கள் இரட்டையாக (‘தெற்குப் பக்கத்திற்காக, தெற்கு நோக்கி’) வருகின்றன; இது வலியுறுத்தலாகவோ திசையைத் துல்லியமாகக் குறிப்பிடுவதற்காகவோ இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் செய்தார்
  rationale: עשה என்பதன் Qal wayyiqtol வடிவம் கடந்தகாலத் தொடர் நிகழ்வைக் குறிக்கிறது; சூழலிலிருந்து வரும் ஒருமை எழுவாயைத் தமிழில் வெளிப்படையாகக் கூறுவது இயல்பானது.
- source_word: הַקְּרָשִׁים
  choice: சட்டங்களை
  rationale: கூடாரக் கட்டுமானத்தில் קֶרֶשׁ என்பது நிமிர்ந்து நிற்கும் கட்டமைப்பு உறுப்புகளைக் குறிக்கிறது. ‘சட்டங்கள்’ அதன் கட்டமைப்புப் பணியை நவீனத் தமிழில் தெரிவிக்கிறது; ‘பலகைகள்’ என்பதும் சாத்தியமான மாற்று.
- source_word: לַמִּשְׁכָּן
  choice: திருவுறைவிடத்திற்கான
  rationale: מִשְׁכָּן என்பது யாத்திராகமத்தில் இறைவனுடைய பரிசுத்த உறைவிடக் கட்டமைப்பைக் குறிக்கும் நிலையான சொல். ‘திருவுறைவிடம்’ அதன் உறைதல் சார்ந்த பொருளையும் புனிதச் சூழலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: இருபது சட்டங்களை
  rationale: எண்ணும் பெயர்ச்சொல்லும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன; ‘சட்டங்கள்’ மீண்டும் வருவது எபிரெய உரையின் பட்டியல் நடையையும் மீளுரையையும் தக்கவைக்கிறது.
- source_word: לִפְאַת
  choice: பக்கத்தில்
  rationale: פֵּאָה இக்கட்டுமானச் சூழலில் ஒரு பக்கத்தை அல்லது ஓரப்பகுதியைக் குறிக்கிறது; தமிழில் ‘பக்கம்’ தெளிவான கட்டடவியல் சொல்லாகும்.
- source_word: נֶגֶב
  choice: தெற்கு
  rationale: இங்கு נֶגֶב ‘நெகேவ்’ என்ற நிலப்பெயராக அல்லாமல் திசையைக் குறிக்கிறது.
- source_word: תֵּימָנָה
  choice: தெற்கு நோக்கி
  rationale: திசைநோக்குப் பொருளை வெளிப்படுத்தி, נֶגֶב உடன் வரும் இரட்டைக் தெற்குக் குறிப்பை முற்றிலும் நீக்காமல் தக்கவைக்கிறது.
