  text: He made the middle bar to pass through the midst of the boards from end to end[a][b].
translation:
  language: ta
  text: அவர் நடுத் தண்டை பலகைகளின் நடுவாக ஒரு முனையிலிருந்து மறுமுனைவரை கடந்து செல்லும்படி செய்தார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மையத் தண்டை ... ஒரு முனையிலிருந்து மறுமுனைவரை.”
    reason: lexical_alternative
  - marker: b
    text: “கடந்து செல்லும்படி” என மொழிபெயர்க்கப்பட்டுள்ள எபிரேய வினைச்சொல், இக்கட்டுமானச் சூழலில் “ஓடிச் செல்லும்படி” அல்லது “நீளும்படி” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் ... செய்தார்
  rationale: עשה என்பதன் Qal wayyiqtol வடிவம் தொடர்கதை நிகழ்வில் ‘அவர் செய்தார்’ என இயல்பாகப் பொருள்படுகிறது; வாவ் இணைப்பைத் தமிழில் தனியே மொழிபெயர்க்காமல் விடுவது நடையை இயல்பாக்குகிறது.
- source_word: הַבְּרִיחַ
  choice: தண்டை
  rationale: திருக்கூடாரச் சட்டங்களை இணைத்து நிலைநிறுத்தும் நீளமான bar-ஐ இங்கு குறிக்கிறது; ‘தண்டு’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַתִּיכֹן
  choice: நடுத்
  rationale: நடுவிலுள்ள அல்லது மையமான பொருளைக் குறிக்கும் பெயரடை; ‘நடுத் தண்டு’ கட்டுமான அமைவிடத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: לִבְרֹחַ
  choice: நீளும்படி
  rationale: ברח என்பதன் infinitive இக்கட்டுமானச் சூழலில் தண்டு சட்டங்களினூடே கடந்து/நீண்டு செல்வதைக் குறிக்கிறது. அசைவைக் காட்டிலும் முழு நீளப் பரவலைத் தமிழில் இயல்பாக உணர்த்த ‘நீளும்படி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּתוֹךְ
  choice: நடுவே
  rationale: உள்ளே அல்லது நடுப்பகுதியினூடே என்ற இடவியல் கருத்தைத் தருகிறது; தண்டு சட்டங்களின் உள்நடுப்பகுதியில் செல்வதை ‘நடுவே’ இயல்பாகக் குறிக்கிறது.
- source_word: הַקְּרָשִׁים
  choice: சட்டங்கள்
  rationale: திருக்கூடாரத்தின் செங்குத்தான கட்டுமான உறுப்புகளைக் குறிக்கும் קֶרֶשׁ என்பதற்கு ‘சட்டங்கள்’ என்பது வெறும் பலகைகள் என்பதைக் காட்டிலும் அவற்றின் கட்டமைப்புப் பணியை நன்றாக வெளிப்படுத்துகிறது.
- source_word: מִן־הַקָּצֶה אֶל־הַקָּצֶה
  choice: ஒரு முனையிலிருந்து மறுமுனைவரை
  rationale: முழு நீளத்தையும் கடப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடரைத் தெளிவான நவீனத் தமிழில் வழங்குகிறது.
