  text: 'There were eight frames[a], with their silver bases, sixteen bases: two bases under one frame[b], and two bases under each frame.'
translation:
  language: ta
  text: பலகைகள்[a] எட்டு இருந்தன; அவற்றின் வெள்ளி அடிப்பீடங்கள்[b] பதினாறு இருந்தன. ஒவ்வொரு பலகையின் கீழும் இரண்டிரண்டு அடிப்பீடங்கள் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சட்டங்கள்”; எபிரெயச் சொல் திருவாசஸ்தலத்தின் செங்குத்தான கட்டமைப்பு உறுப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சாக்கெட்டுகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: இருந்தன
  rationale: கட்டுமானப் பொருட்களின் எண்ணிக்கையை விவரிக்கும் சூழலில், היה என்பதன் இருப்பைக் குறிக்கும் பொருளை இயல்பான தமிழில் தருகிறது; தொடக்க இணைப்புச்சொல் தமிழ் நடைக்கு ஏற்ப தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: קְרָשִׁים / הַקֶּרֶשׁ
  choice: சட்டங்கள் / சட்டம்
  rationale: திருவாசஸ்தலத்தின் செங்குத்தான கட்டமைப்பு உறுப்புகளைக் குறிக்கும் சொல்லாக ‘சட்டம்’ செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது; ‘பலகை’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: அடிப்பீடங்கள்
  rationale: ஒவ்வொரு சட்டத்தையும் தாங்கிய உலோக அடிப்பகுதி அல்லது பொருத்துவாயைக் குறிக்கிறது. ‘அடிப்பீடங்கள்’ நவீன தமிழில் தெளிவான கட்டுமானச் சொல்லாகும்; ‘பொருத்துத் தாங்கிகள்’ என்ற தொழில்நுட்ப மாற்றும் சாத்தியம்.
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: அடிப்பீடங்கள் செய்யப்பட்ட பொருளை நேரடியாகக் குறிக்கிறது.
- source_word: שִׁשָּׁה עָשָׂר
  choice: பதினாறு
  rationale: எண்ணிக்கையை வழக்கமான தமிழில் நேரடியாகத் தருகிறது.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים תַּחַת הַקֶּרֶשׁ הָאֶחָד
  choice: ஒவ்வொரு சட்டத்தின் கீழும் இரண்டிரண்டு அடிப்பீடங்கள்
  rationale: எபிரெய மொழியின் ‘இரண்டு அடிப்பீடங்கள், இரண்டு அடிப்பீடங்கள்’ என்ற பகிர்வைக் காட்டும் மறுமொழியை, அதன் distributive பொருள் தெளிவாகத் தோன்றும் இயல்பான தமிழில் ‘இரண்டிரண்டு’ எனத் தருகிறது.
- source_word: תַּחַת
  choice: கீழும்
  rationale: கட்டுமான அமைப்பில் உள்ள இடத்தொடர்பை இயல்பாகக் குறிக்கிறது.
