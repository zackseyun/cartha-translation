  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: ta
  text: அவன் ஐம்பது தங்கக் கொக்கிகளைச் செய்து, அந்தக் கொக்கிகளால் திரைச்சீலைகளை ஒன்றோடொன்று இணைத்தான். இவ்வாறு திருக்கூடாரம் ஒன்றாயிற்று.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருக்கூடாரம் ஒன்றாயிருந்தது.” எபிரெய வாக்கியத்தை இவ்வாறு நேரடியாகவும் மொழிபெயர்க்கலாம்; “ஒன்றாயிற்று” என்பது திரைச்சீலைகளை இணைத்ததன் விளைவை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்து
  rationale: עשה என்பதன் இயல்பான பொருள் ‘செய்/உருவாக்கு’; பொருட்களை உருவாக்கும் இச்சூழலில் ‘செய்து’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: ஐம்பது தங்கக் கொக்கிகள்
  rationale: קֶרֶס என்பது திரைச்சீலைகளை இணைக்கும் பொருள். அதன் வடிவத்தை அளவுக்கு மீறி வரையறுக்காமல், இணைப்புப் பயன்பாட்டையும் மரபான தமிழ்ப் பயன்பாட்டையும் ‘கொக்கிகள்’ வெளிப்படுத்துகிறது.
- source_word: וַיְחַבֵּר
  choice: இணைத்தான்
  rationale: חבר என்பதன் அடிப்படைப் பொருளான இணைத்தல்/சேர்த்தலை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: אֶת הַיְרִעֹת
  choice: திரைச்சீலைகளை
  rationale: יְרִיעוֹת என்பது திருக்கூடாரத்தை அமைத்த துணித் திரைகளைக் குறிக்கிறது; ‘திரைச்சீலைகள்’ சாதாரண வாசகருக்குத் தெளிவான சொல்.
- source_word: אַחַת אֶל אַחַת
  choice: ஒன்றோடொன்று
  rationale: பெண்பால் ஒருமைச் சொற்களின் மறுபயன்பாடு திரைச்சீலைகளின் பரஸ்பர இணைப்பைக் குறிக்கிறது; ‘ஒன்றோடொன்று’ இதை இயல்பாகத் தருகிறது.
- source_word: בַּקְּרָסִים
  choice: அந்தக் கொக்கிகளால்
  rationale: בְּ இங்கு கருவிப்பொருளைக் குறிக்கிறது; ‘-ஆல்’ இணைப்பு எந்தக் கருவியால் செய்யப்பட்டது என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: இவ்வாறு திருக்கூடாரம் ஒரே அமைப்பாயிற்று
  rationale: இணைத்த செயலின் விளைவாக மִשְׁכָּן ஒன்றுபட்ட முழு அமைப்பானதைத் தமிழில் தெளிவாகக் காட்டுகிறது; அதே நேரத்தில் எபிரெயத்தின் நேரடியான ‘ஒன்றாயிருந்தது’ என்ற சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: யாத்திராகமச் சூழலில் மִשְׁכָּן குறிக்கும் பரிசுத்த வாசஸ்தலக் கூடாரத்திற்கான தெளிவான, மரியாதைமிக்க, வழக்கிலுள்ள தமிழ்ச் சொல்.
