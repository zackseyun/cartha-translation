  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: ta
  text: அவை கீழ்ப்பகுதியில் ஒன்றோடொன்று பொருந்தியவையாக இருந்தன; அவற்றின் உச்சியில், ஒரே வளையத்தோடு அவை ஒன்றாக முழுமையாக இணைக்கப்பட்டிருந்தன.[a][b] இரு மூலைகளுக்குமான அவ்விரண்டிற்கும் அவர் இவ்வாறே செய்தார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இரட்டையாக.’ எபிரெயச் சொல், இரு பகுதிகளும் அமைப்பில் ஒன்றுக்கொன்று ஒத்துப் பொருந்தியிருந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘முழுமையானவையாக.’ இந்தச் சொல் அவை முற்றாக இணைக்கப்பட்ட அல்லது நிறைவுபெற்ற நிலையில் இருந்ததைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘இரு மூலைச் சட்டங்களுக்குமான.’ எபிரெயில் சொல்லுக்குச் சொல் ‘இரு மூலைகளுக்குமான’ என்று உள்ளது; சூழலில் அது மூலைகளிலுள்ள சட்டங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: ஒன்றுக்கொன்று இணையாக
  rationale: இச்சொல் இரு சட்டங்களும் ஒன்றுக்கொன்று பொருந்திய இணையாக அமைந்திருந்ததைச் சுட்டுகிறது. ‘இணையாக’ என்பது கட்டுமானச் சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִלְּמַטָּה
  choice: கீழ்ப்பகுதியில்
  rationale: இணையான அமைப்பு கீழே இருந்த இடத்தை இது குறிக்கிறது; நவீன தமிழில் கட்டுமான விவரிப்புக்கு ‘கீழ்ப்பகுதியில்’ தெளிவானது.
- source_word: יַחְדָּו
  choice: ஒன்றாக
  rationale: எபிரெயச் சொல்லின் நேரடியான கூட்டுறவுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: תַמִּים
  choice: முழுமையாக
  rationale: மேற்பகுதி வரையிலான முழுமை அல்லது முழுமையாக இணைந்த நிலை என்ற பொருளைத் தக்கவைக்கிறது; முன்னுள்ள ‘இணையாக’ என்பதோடு கலந்துவிடாமல் வேறுபாட்டையும் காக்கிறது.
- source_word: אֶל רֹאשׁוֹ
  choice: அதன் உச்சிவரை
  rationale: கீழிருந்து மேல் முனை வரையிலான கட்டுமான நீட்சியை ‘வரை’ என்பதன் மூலம் பாதுகாக்கிறது.
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: ஒரே வளையம்
  rationale: எபிரெயில் உள்ள குறிப்பிட்ட எண்ணைத் தக்கவைக்கிறது; அதை விளக்கமின்றி ‘முதல் வளையம்’ என்று மாற்றுவதில்லை.
- source_word: כֵּן עָשָׂה
  choice: அவர் இவ்வாறே செய்தார்
  rationale: கட்டுமான முறையைச் சுருக்கிக் கூறும் எபிரெய வாக்கியத்தை dignified modern Tamil-ல் இயல்பாக வழங்குகிறது.
- source_word: לִשְׁנֵיהֶם
  choice: அவ்விரண்டையும்
  rationale: குறிப்பிடப்பட்ட இரு அமைப்புகளையும் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: இரு மூலைகளுக்காகவும்
  rationale: ‘இரு மூலைகள்’ என்ற மூலச்சொல்லைத் தக்கவைத்து, ‘மூலைச் சட்டங்கள்’ என்ற சூழல்சார் விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல் விடுகிறது.
