- from: அவை கீழ்ப்பகுதியில் ஒன்றுக்கொன்று இணையாகவும்[a], ஒரே வளையம் இருக்கும் அதன் உச்சிவரை ஒன்றாக முழுமையாகவும்[b] இருந்தன. இரு மூலைகளுக்காகவும்[c] அவ்விரண்டையும் அவர் இவ்வாறே செய்தார்.
  to: அவை கீழ்ப்பகுதியில் ஒன்றோடொன்று பொருந்தியவையாக இருந்தன; அவற்றின் உச்சியில், ஒரே வளையத்தோடு அவை ஒன்றாக முழுமையாக இணைக்கப்பட்டிருந்தன.[a][b] இரு மூலைகளுக்குமான அவ்விரண்டிற்கும் அவர் இவ்வாறே செய்தார்.[c]
  rationale: உச்சி, ஒரே வளையம், மற்றும் இரு மூலைகளுக்குரிய இரு பகுதிகள் ஆகிய கட்டுமானக் குறிப்புகளைத் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் மாற்றியுள்ளேன். תַמִּים-இன் சரியான தொழில்நுட்ப நுணுக்கம் விவாதத்திற்குரியது என்பதால், முதன்மை உரையில் இயல்பான கட்டுமானப் பொருளை வழங்கி, மாற்று வாசிப்பை அடிக்குறிப்பில் பாதுகாத்துள்ளேன்.
