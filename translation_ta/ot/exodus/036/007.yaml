  text: And the material was sufficient for all the work to do it[a], and there was more than enough.
translation:
  language: ta
  text: 'எல்லாப் பணிகளையும் செய்வதற்குப் பொருள்கள் போதுமானவையாக இருந்தன; அவை தேவைக்கு அதிகமாகவும் இருந்தன.[a]


    [a] அல்லது, “பொருள்கள் மீதியாகவும் இருந்தன.” எபிரெய வினைச்சொல், வேலைக்குத் தேவையானது போக எஞ்சியிருந்ததையும் வலியுறுத்தலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொருள்கள் மீதியாகவும் இருந்தன.” எபிரெய வினைச்சொல், வேலைக்குத் தேவையானது போக எஞ்சியிருந்ததையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: அந்தப் பொருள்கள்
  rationale: מְלָאכָה வழக்கமாக ‘வேலை’ எனப் பொருள்படும். ஆனால் இங்கு மக்கள் கொண்டுவந்தவை வேலைக்குப் போதுமானதாகவும் மீதியாகவும் இருந்தன என்பதே சூழல்; எனவே கூட்டுப்பொருளில் ‘அந்தப் பொருள்கள்’ என்பது இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: הָיְתָה
  choice: இருந்தன
  rationale: இறந்தகால நிலையைச் சுட்டும் היה வினையின் இயல்பான தமிழ் வடிவம்; ‘பொருள்கள்’ என்ற கூட்டுப்பன்மைக்கு ஏற்ப பன்மையில் அமைக்கப்பட்டுள்ளது.
- source_word: דַיָּם
  choice: போதுமானவையாக
  rationale: דַּי தேவையான அளவு அல்லது நிறைவைச் சுட்டுகிறது; இங்கு கட்டுமானப் பணிக்குத் தேவையான பொருள்களின் அளவு போதியதாக இருந்ததைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: לְכָל הַמְּלָאכָה
  choice: எல்லா வேலைகளையும்
  rationale: இங்கு מְלָאכָה செய்யப்பட வேண்டிய முழுப் பணியைக் குறிக்கிறது. தமிழில் பணியின் எல்லா பகுதிகளையும் உள்ளடக்கும் வகையில் பன்மை இயல்பாக உள்ளது.
- source_word: לַעֲשׂוֹת אֹתָהּ
  choice: செய்வதற்கு
  rationale: עשה என்பதன் செயற்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெயத்தில் உள்ள பெண்பால் ஒருமைச் சுட்டுப்பெயரின் குறிப்பு தமிழில் முன்னுள்ள ‘வேலை’ என்ற கருத்தோடு இயல்பாக இணைக்கப்படுகிறது.
- source_word: וְהוֹתֵר
  choice: தேவைக்கு அதிகமாகவும் இருந்தன
  rationale: יתר என்பதன் ஹிஃபில் வடிவம் மிகுதியையோ எஞ்சியிருப்பதையோ குறிக்கலாம். முதன்மை உரை தேவைக்கு மேல் இருந்ததைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது; ‘மீதியாக இருந்தன’ என்ற நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
