  text: For the second side of the tabernacle[a], on the north side, he made twenty boards.
translation:
  language: ta
  text: திருவாசஸ்தலத்தின் இரண்டாவது பக்கமாகிய வடக்குப் பக்கத்திற்காக, அவன் இருபது பலகைகளைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: பக்கத்திற்காக
  rationale: צֶלַע இங்கு உடலுறுப்பான ‘விலா எலும்பு’ என்பதைக் குறிக்காமல், திருவுறைவிடக் கட்டமைப்பின் ஒரு பக்கத்தைக் குறிக்கிறது. முன்னொட்டுகளின் இணைந்த பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘பக்கத்திற்காக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַמִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: מִשְׁכָּן என்பதன் அடிப்படைப் பொருள் ‘உறைவிடம்’; இச்சூழலில் அது வனாந்தரப் பரிசுத்த இடத்தைக் குறிக்கிறது. ‘திருவுறைவிடம்’ என்பது அதன் புனிதத் தன்மையையும் மூலச்சொல்லின் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַשֵּׁנִית
  choice: இரண்டாவது
  rationale: இது முன்பு கூறப்பட்ட பக்கத்துக்கு இணையான அடுத்த பக்கத்தைக் குறிப்பதால், ‘மற்ற’ என்பதைவிட ‘இரண்டாவது’ என்பது மூலத்தின் வரிசைப் பொருளைத் துல்லியமாகக் காக்கிறது.
- source_word: לִפְאַת צָפוֹן
  choice: அதாவது வடக்குப் பக்கத்திற்காக
  rationale: פֵאָה என்பது பக்கம் அல்லது திசைப்பகுதியைக் குறிக்கிறது; צָפוֹן உடன் சேர்ந்து வடக்கு நோக்கிய பக்கத்தை அடையாளப்படுத்துகிறது. முதல் ‘பக்கம்’ என்பதைக் கூடுதல் விளக்கமாகத் தமிழில் இயல்பாக இணைக்க ‘அதாவது’ சேர்க்கப்பட்டது.
- source_word: עָשָׂה
  choice: அவன் ... செய்தான்
  rationale: עשה என்பது பொதுவாக ‘செய்/உருவாக்கு’ என்று பொருள்படும். கட்டுமான அறிக்கையில் எளிமையும் மூலத்தின் பரந்த பொருளும் காக்க ‘செய்தான்’ பயன்படுத்தப்பட்டது.
- source_word: עֶשְׂרִים
  choice: இருபது
  rationale: எபிரெய எண்ணின் நேரடியான தமிழ் இணை.
- source_word: קְרָשִׁים
  choice: பலகைகள்
  rationale: இச்சொல் திருவுறைவிடத்தின் மரக் கட்டமைப்புக் கூறுகளைக் குறிக்கிறது. அவற்றின் துல்லியமான வடிவம் உறுதியில்லாதபோதிலும், ‘பலகைகள்’ என்பது எளிதில் புரியும் வழக்கமான மொழிபெயர்ப்பு; ‘சட்டகங்கள்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
