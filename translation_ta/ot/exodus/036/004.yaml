revisions:
- from: அப்போது பரிசுத்த இடத்தின் எல்லா வேலைகளையும் செய்துகொண்டிருந்த திறமைமிக்கவர்கள் அனைவரும், தாங்கள் செய்துகொண்டிருந்த தத்தம் வேலையை விட்டுவிட்டு வந்தார்கள்.
  to: அப்போது பரிசுத்த இடத்துக்கான எல்லாப் பணிகளையும் செய்துகொண்டிருந்த திறமைமிக்கவர்கள் அனைவரும், தத்தம் வேலைகளிலிருந்து வந்தார்கள்.
  rationale: The revision preserves the ongoing participial activity and the distributive “each from his work,” while rendering movement away from the work without implying that the workers abandoned it. It also uses natural modern Tamil for sanctuary construction tasks.
