  yaml_path: translation/ot/exodus/036/004.yaml
  text: Then all the skilled men who were doing all the work of the sanctuary came[a], each from the work that he was doing,
translation:
  language: ta
  text: அப்போது பரிசுத்த இடத்துக்கான எல்லாப் பணிகளையும் செய்துகொண்டிருந்த திறமைமிக்கவர்கள் அனைவரும், தத்தம் வேலைகளிலிருந்து வந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא என்பதன் தொடர்நிகழ்வு வடிவம் கதையில் அடுத்த நிகழ்வைக் குறிக்கிறது; எளிய இறந்தகாலமான ‘வந்தார்கள்’ இயல்பான தமிழ் நடை.
- source_word: כָּל הַחֲכָמִים
  choice: திறமைமிக்கவர்கள் அனைவரும்
  rationale: இங்கு חכמים என்பது அறிவாளிகளை மட்டுமல்லாமல், திருக்கூடாரப் பணிக்கான செயல் திறன் பெற்றவர்களைக் குறிக்கிறது. ஆண்பால் வடிவத்தைத் தமிழில் தேவையின்றி வலியுறுத்தாமல் தொழில்திறன் சார்ந்த பொருள் தரப்படுகிறது.
- source_word: הָעֹשִׂים
  choice: செய்துகொண்டிருந்த
  rationale: எபிரெயப் பங்கேற்புவினை தொடர்ந்து நடந்துகொண்டிருந்த செயலைக் காட்டுவதால், தமிழில் தொடர்நிலையை இவ்வாறு வெளிப்படுத்துவது இயல்பு.
- source_word: אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் எல்லா வேலைகளையும்
  rationale: מְלֶאכֶת என்பது இங்கு கட்டுமானம் மற்றும் கைவினைப் பணியைக் குறிக்கிறது; הַקֹּדֶשׁ சூழலில் பரிசுத்த இடம் அல்லது திருத்தலம் என்ற இடப்பொருளைக் கொண்டது. ‘பரிசுத்த இடம்’ மூலத்தின் இடப்பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: אִישׁ אִישׁ
  choice: தத்தம்
  rationale: சொல் இரட்டிப்பு ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் பகிர்வுப் பொருளுடையது. ‘தத்தம்’ அந்தப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מִמְּלַאכְתּוֹ
  choice: வேலையை விட்டுவிட்டு
  rationale: מן என்ற முன்னொட்டு அவர்கள் செய்த பணியிலிருந்து விலகி வந்த இயக்கத்தைக் குறிக்கிறது. ‘விட்டுவிட்டு’ என்பது பணியை நிரந்தரமாகக் கைவிட்டனர் என்பதல்ல; அப்பணியிடத்திலிருந்து வந்து சேர்ந்தனர் என்ற சூழல்சார் பொருள்.
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: தாங்கள் செய்துகொண்டிருந்த
  rationale: மூலத்தில் பன்மைச் சுட்டுப்பெயர் இருந்தாலும், אִישׁ אִישׁ பகிர்வுப் பொருளை உருவாக்குகிறது. தமிழ் ‘தத்தம் ... தாங்கள்’ அமைப்பு ஒவ்வொருவரின் தனிப்பட்ட வேலையையும் குழுவின் பன்மையையும் ஒன்றாகக் காக்கிறது.
