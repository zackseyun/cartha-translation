- from: திருக்கூடாரத்தின் ஒரு பக்கத்திலுள்ள சட்டங்களுக்காக[a] சீத்திம் மரத்தால் ஐந்து குறுக்குச் சட்டங்களைச் செய்தான்.
  to: திருக்கூடாரத்தின் ஒரு பக்கத்திற்கான செங்குத்துச் சட்டங்களுக்காக[a] அகேசியா மரத்தால் ஐந்து குறுக்குக் கம்பிகளைச் செய்தான்.
  rationale: 'This revision keeps the Hebrew syntax and referents intact: five horizontal bars of acacia wood were made for the upright structural pieces on one side of the tabernacle. It uses transparent modern Tamil terminology and retains the ‘boards’ alternative in the footnote.'
