  yaml_path: translation/ot/exodus/036/031.yaml
  text: He made five bars of acacia wood for the frames of one side of the tabernacle[a].
translation:
  language: ta
  text: திருக்கூடாரத்தின் ஒரு பக்கத்திற்கான செங்குத்துச் சட்டங்களுக்காக[a] அகேசியா மரத்தால் ஐந்து குறுக்குக் கம்பிகளைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பலகைகளுக்காக’. இச்சொல் திருக்கூடாரத்தின் செங்குத்தான கட்டமைப்புப் பகுதிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரில் அடுத்த செயலைக் குறிக்கும் வையிக்தோல் வடிவம்; தமிழில் இயல்பான தொடர்ச்சிக்காக இணைப்புச்சொல் சேர்க்கப்படவில்லை.
- source_word: בְּרִיחֵי
  choice: குறுக்குச் சட்டங்கள்
  rationale: திருக்கூடாரத்தின் செங்குத்துச் சட்டங்களை ஒன்றாகப் பிணைக்கும் கிடைமட்ட மரத்துண்டுகளைக் குறிக்கிறது; வெறும் ‘தாழ்ப்பாள்கள்’ என்பது இச்சூழலில் தவறாகப் புரியக்கூடும்.
- source_word: עֲצֵי שִׁטִּים
  choice: சீத்திம் மரத்தால்
  rationale: அகேசியா வகை மரத்தைக் குறிக்கும் பாரம்பரியமாக அறியப்பட்ட தமிழ் பெயரைப் பயன்படுத்தி, அது பொருளாக அமைந்ததையும் வேற்றுமை உருபு தெளிவாக்குகிறது.
- source_word: חֲמִשָּׁה
  choice: ஐந்து
  rationale: ‘குறுக்குச் சட்டங்கள்’ என்பதைக் கணக்கிடும் நேரடியான எண்ணுப்பெயர்.
- source_word: לְקַרְשֵׁי
  choice: சட்டங்களுக்காக
  rationale: கூடாரத்தின் செங்குத்தான கட்டமைப்புப் பகுதிகளைக் குறிக்கிறது; ‘பலகைகள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: צֶלַע
  choice: பக்கம்
  rationale: கட்டடச் சூழலில் கட்டமைப்பின் ஒரு பக்கத்தைக் குறிக்கிறது; உடலுறுப்பான ‘விலா’ என்று பொருளல்ல.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: யாத்திராகமத்தில் இஸ்ரவேலரின் புனிதக் கூடாரத்திற்கான தெளிவான, நிலைபெற்ற தமிழ் சொல்.
- source_word: הָאֶחָת
  choice: ஒரு
  rationale: பெண்பால் ஒருமையில் ‘பக்கம்’ என்பதுடன் இயைந்து, எதிரெதிரான பக்கங்களில் ஒன்றைக் குறிக்கிறது; வரிசையில் ‘முதல்’ என்று அவசியம் பொருள்படாது.
