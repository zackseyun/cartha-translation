translation:
  language: ta
  text: அவர் திருவாசஸ்தலத்திற்காக நிமிர்ந்து நிற்கும் அக்காசியா மரப் பலகைகளைச் செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் ... செய்து ... அமைத்தார்
  rationale: வய்யிக்தோல் வடிவம் கதையின் அடுத்த செயலை எளிய இறந்தகாலத்தில் முன்னெடுக்கிறது. தமிழில் பலகைகளை உருவாக்கி அவற்றை நிறுத்திய ஒருங்கிணைந்த செயலை இயல்பாகச் சொல்கிறது.
- source_word: הַקְּרָשִׁים
  choice: பலகைகளை
  rationale: திருவாசஸ்தலத்தின் கட்டமைப்பில் பயன்படுத்தப்பட்ட உறுதியான மரப் பகுதிகளைச் சுட்டுகிறது; நவீனத் தமிழில் ‘பலகைகள்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: לַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்திற்கான
  rationale: מִשְׁכָּן என்பது தேவன் தங்கும் பரிசுத்தக் கட்டமைப்பைக் குறிக்கிறது. ‘திருவாசஸ்தலம்’ அதன் குடியிருப்பு மற்றும் வழிபாட்டுச் சூழலைச் சுருக்கமாகத் தருகிறது.
- source_word: עֲצֵי שִׁטִּים
  choice: சீத்திம் மரத்தால்
  rationale: שִׁטָּה குறிக்கும் மரத்திற்கான பரவலாக அறியப்பட்ட வேதாகமத் தமிழ்ப் பெயரைப் பேணுகிறது; தாவரவியல் அடையாளம் குறித்த அளவுக்கு மீறிய உறுதியைத் தவிர்க்கிறது.
- source_word: עֹמְדִים
  choice: நிமிர்ந்து நிற்கும்படி
  rationale: பலகைகளின் செங்குத்தான நிலையைப் பங்கேற்புப் பெயரெச்சம் விவரிக்கிறது; வெறுமனே ‘நின்ற’ என்பதைக் காட்டிலும் கட்டடவியல் பொருளைத் தெளிவாக்குகிறது.
