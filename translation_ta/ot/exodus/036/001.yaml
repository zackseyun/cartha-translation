base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: ta
  text: பெசலெயேலும் ஒகொலியாபும்[a], ஒவ்வொரு திறமைமிக்க மனிதனும்[b]—பரிசுத்த இடத்தின் சேவைக்கான எல்லாப் பணிகளையும்[c] செய்யத் தெரிந்திருக்கும்படி யாவே அவர்களுக்குள் ஞானத்தையும் புரிந்துணர்வையும் அளித்தவர்கள்—யாவே கட்டளையிட்ட அனைத்தின்படியும் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெசலெயேல்’, ‘ஒகொலியாப்’ ஆகியவை எபிரெயத் தனிப்பெயர்களின் ஒலிபெயர்ப்புகள்.
    reason: பெயர்களின் வடிவத்தைத் தெளிவுபடுத்துதல்
  - marker: b
    text: எபிரெயில் சொல்லுக்கு சொல், “இதயத்தில் ஞானமுள்ள ஒவ்வொரு மனிதனும்.” இச்சூழலில் இது திறமையுள்ள ஒவ்வொரு தொழிலாளரையும் பொதுவாகக் குறிக்கலாம். மேலும், எபிரெயில் “அவர்களுக்குள்” என்பது பன்மையில் உள்ளது; அது பெசலெயேல், ஒகொலியாப், மற்றும் ஒவ்வொரு திறமைமிக்க மனிதன் ஆகியோரை கூட்டாகக் குறிக்கிறது.
    reason: மரபுத்தொடர் மற்றும் பன்மை இலக்கணத்தைப் பாதுகாத்தல்
  - marker: c
    text: அல்லது, “பரிசுத்த இடத்தின் சேவையின் எல்லாப் பணிகளையும்.”
    reason: எபிரெய இணைப்புத் தொடரின் மாற்று வாசிப்பைத் தெரிவித்தல்
lexical_decisions:
- source_word: וְעָשָׂה
  choice: செய்ய வேண்டும்
  rationale: இணைப்புடன் வந்துள்ள நிறைவுவினை இச்சூழலில் முந்தைய அறிவுறுத்தலைத் தொடரும் கடமை அல்லது எதிர்கால விளைவைக் குறிக்கிறது; இயல்பான நவீன தமிழில் இதை ‘செய்ய வேண்டும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: பெசலெயேலும் ஒகொலியாபும்
  rationale: எபிரெய தனிப்பெயர்களைத் தமிழில் ஒலிபெயர்த்த வடிவம்.
- source_word: וְכֹל אִישׁ חֲכַם־לֵב
  choice: திறமைவாய்ந்த ஒவ்வொருவரும்
  rationale: சொல்லுக்கு சொல் ‘இதயத்தில் ஞானமுள்ள ஒவ்வொரு மனிதனும்’; கைவினைப் பணிச் சூழலில் இந்த எபிரெய மரபுத்தொடர் நடைமுறைத் திறமையைச் சுட்டுகிறது. ‘ஒவ்வொருவரும்’ என்பது அִישׁ என்பதன் பொதுப்படையான பயன்பாட்டை இயல்பாகக் கொண்டுவருகிறது; நேரடி மரபுத்தொடர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: யாவே ஞானத்தையும் புரிந்துணர்வையும் அருளிய
  rationale: எபிரெயில் ‘அவர்களுக்குள் வைத்தார்’ என்ற கூட்டுப் பன்மை கருத்து உள்ளது. தமிழில் தொடர்பெயரெச்ச அமைப்பு அந்தக் குழுவை இயல்பாகத் தழுவுகிறது; ‘அருளிய’ என்பது தெய்வீகமாக அளித்ததைக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: உடன்படிக்கையின் தெய்வீகப் பெயரான יהוה என்பதை தலைப்புப் பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: חָכְמָה וּתְבוּנָה
  choice: ஞானத்தையும் புரிந்துணர்வையும்
  rationale: ‘ஞானம்’ கைவினைத் திறனையும் உள்ளடக்கும் விரிவான சொல்லாகவும், ‘புரிந்துணர்வு’ நடைமுறை அறிவாற்றலைக் குறிக்கும் இணைச்சொல்லாகவும் அமைகின்றன.
- source_word: לָדַעַת לַעֲשֹׂת
  choice: எப்படிச் செய்ய வேண்டும் என்பதை அறிந்துகொள்ளும்படி
  rationale: இரு வினையெச்சங்களும் செய்முறை அறிவையும் நோக்கத்தையும் குறிக்கின்றன; இந்தத் தமிழ் வடிவம் ‘செய்யத் தெரிந்திருத்தல்’ என்ற செயல்திறன் கருத்தைத் தெளிவாக்குகிறது.
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் பணிக்குரிய எல்லா வேலைகளையும்
  rationale: מְלֶאכֶת மற்றும் עֲבֹדַת ஆகிய இரு பணி சார்ந்த சொற்களையும் ‘வேலைகள்’ மற்றும் ‘பணி’ என வேறுபடுத்தி, הַקֹּדֶשׁ என்பதை இச்சூழலில் பரிசுத்த இடம் எனக் காட்டுகிறது.
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: யாவே கட்டளையிட்ட அனைத்தின்படியும்
  rationale: לְ இங்கு ஒத்திசைவு அல்லது நியமத்தின்படி செய்தலைக் குறிக்கிறது; ‘அனைத்தின்படியும்’ அந்தப் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து பாதுகாக்கிறது.
- issue: אִישׁ חֲכַם־לֵב என்பதில் பாலினமும் மரபுத்தொடரும்
  choice: திறமைவாய்ந்த ஒவ்வொருவரும்
  alternative: இதயத்தில் ஞானமுள்ள ஒவ்வொரு மனிதனும்
  rationale: אִישׁ இலக்கண வடிவில் ஆண்பால் ஒருமை என்றாலும், כֹל உடன் இங்கு தொழிலாளர்களை வகையாகச் சுட்டும் பொதுப்படையான பயன்பாடு சாத்தியம். கைவினைச் சூழலில் חֲכַם־לֵב என்பது திறமையைக் குறிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: הַקֹּדֶשׁ என்பதன் குறிப்பு
  choice: பரிசுத்த இடம்
  alternative: பரிசுத்தம் / பரிசுத்தப் பணி
  rationale: கூடாரக் கட்டுமானச் சூழல் இதை அர்ப்பணிக்கப்பட்ட வழிபாட்டு இடமாகப் புரிந்துகொள்ள வலியுறுத்துகிறது; ஆனால் முழுச் சொற்றொடரின் கட்டமைப்பு மாற்று வாசிப்பை அனுமதிப்பதால் அது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. கைவினைச் சூழலுக்கேற்ற ‘திறமைவாய்ந்த’ என்ற சொல் தேர்ந்தெடுக்கப்பட்டாலும், எபிரெயின் ‘இதயத்தில் ஞானமுள்ள’ என்ற உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. வசனத்தின் கட்டளை/கடமைத் தொனி ‘செய்ய வேண்டும்’ என்பதால் வெளிப்படுகிறது.
