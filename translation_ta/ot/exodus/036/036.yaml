base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/036.yaml
  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: ta
  text: அதற்கென[a] அவர் அகாசியா மரத்தால் நான்கு தூண்களைச் செய்து, அவற்றுக்குத் தங்கத் தகடு போர்த்தினார். அவற்றின் கொக்கிகள் தங்கத்தால் செய்யப்பட்டிருந்தன. அவற்றுக்காக நான்கு வெள்ளி அடித்தளங்களை[b] வார்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அது’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட திரையைக் குறிக்கிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘வெள்ளிச் சாக்கெட்டுகளை.’ தூண்கள் பொருத்தி நிறுத்தப்பட்ட துளையுள்ள உலோக ஆதாரப் பகுதிகள் இவை.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי
  choice: தூண்கள்
  rationale: நிமிர்ந்து நிற்கும் கட்டமைப்பு ஆதாரங்களைக் குறிக்கிறது; திருவாசஸ்தலக் கட்டுமானச் சூழலில் ‘தூண்கள்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: שִׁטִּים
  choice: அகாசியா மரம்
  rationale: திருவாசஸ்தலப் பொருட்களில் பயன்படுத்தப்பட்ட மரவகையைக் குறிக்கிறது. ஒலிபெயர்ப்பைவிட நவீன வாசகருக்குப் புரியும் பொதுவான தாவரவியல் பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיְצַפֵּם
  choice: அவற்றுக்குத் தங்கத் தகடு போர்த்தினார்
  rationale: உலோகத்தால் ஒரு பொருளின் வெளிப்பரப்பை மூடுவதைக் குறிக்கும் வினை; ‘தகடு போர்த்தினார்’ என்பது செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וָוֵיהֶם
  choice: அவற்றின் கொக்கிகள்
  rationale: இந்தக் கட்டுமானச் சூழலில் தூண்களில் பொருத்தப்பட்ட இணைப்புக் கொக்கிகளைக் குறிப்பதாக இயல்பாகப் புரிகிறது.
- source_word: אַדְנֵי
  choice: அடித்தளங்கள்
  rationale: தூண்கள் நிலைநிறுத்தப்பட்ட உலோக ஆதாரப் பகுதிகளைக் குறிக்கிறது; ‘துளையுள்ள பீடங்கள்’ என்ற கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: כָסֶף
  choice: வெள்ளி
  rationale: அடித்தளங்கள் செய்யப்பட்ட உலோகத்தைக் குறிக்கும் நேரடியான பொருள்.
- source_word: לָהּ
  choice: அதற்காக
  rationale: எபிரெய உரையின் பெண்பால் ஒருமைச் சுட்டுப்பெயரைப் பிரதிபலிக்கிறது; முந்தைய வசனத்திலுள்ள திரையையே இது சுட்டுகிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: וַיִּצֹק
  choice: வார்த்தார்
  rationale: உருகிய உலோகத்தை அச்சில் ஊற்றி வடிவமைக்கும் செயலை இச்சூழலில் துல்லியமாகக் குறிக்கிறது.
