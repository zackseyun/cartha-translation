  register: நவீன தரமான தமிழில், கூடாரக் கட்டுமான விவரத்தை சாதாரண வாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் dignified மற்றும் தெளிவான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் இணை வாக்கிய அமைப்பும் ‘இணைப்பு’ என்ற சொல்லின் இடம்/அமைப்பு சார்ந்த நெகிழ்வும் பாதுகாக்கப்பட்டுள்ளன.
