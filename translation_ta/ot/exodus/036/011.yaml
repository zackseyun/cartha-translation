base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: ta
  text: முதல் இணைக்கப்பட்ட தொகுதியின் கடைமுனையில் உள்ள முதல் திரைச்சீலையின் ஓரத்தில் நீல நூலால் கண்ணிகளைச் செய்தான்[a]. அதுபோலவே, இரண்டாம் இணைக்கப்பட்ட தொகுதியிலுள்ள வெளிப்புறத் திரைச்சீலையின் ஓரத்திலும் அவற்றைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இணைப்பில்” / “இணையும் இடத்தில்.” எபிரெயச் சொல் திரைச்சீலைகள் ஒன்றோடொன்று இணைக்கப்பட்ட இடத்தையோ அமைப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: வளையங்கள்
  rationale: திரைச்சீலைகளை ஒன்றோடொன்று இணைப்பதற்காகத் துணியால் செய்யப்பட்ட கண்ணிகளை இச்சொல் குறிக்கிறது; ‘வளையங்கள்’ என்பது நவீன தமிழில் இயல்பான, நேரடியான சொல்.
- source_word: תְּכֵלֶת
  choice: நீல நூல்
  rationale: இங்கு வெறும் நிறத்தை அல்ல, வளையங்கள் செய்யப்பட்ட நீலச் சாயமிட்ட நூல் அல்லது துணிப் பொருளைக் குறிக்கிறது.
- source_word: שְׂפַת
  choice: ஓரம்
  rationale: திரைச்சீலையின் விளிம்பைச் சுட்டுவதால் ‘ஓரம்’ என்பது இயல்பான தமிழ் வழக்கு.
- source_word: הַיְרִיעָה
  choice: திரைச்சீலை
  rationale: திருவாசஸ்தல மூடுதலின் தனித்தனி துணிப் பகுதிகளில் ஒன்றை இச்சொல் குறிக்கிறது.
- source_word: הָאֶחָת
  choice: முதல்
  rationale: சொல்லளவில் ‘ஒன்று’ என்றாலும், பின்னர் வரும் ‘இரண்டாம்’ என்பதுடன் அமைந்த எதிரிணை காரணமாக இங்கு வரிசை எண்ணாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: מִקָּצָה
  choice: முனையில்
  rationale: இணைப்பு செய்யப்படும் தொகுதியின் கடைப்பகுதி அல்லது முனையைச் சுட்டும் இடவியல் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: בַּמַּחְבָּרֶת
  choice: இணைக்கப்பட்ட தொகுதியில்
  rationale: திரைச்சீலைகள் இணைக்கப்பட்ட அமைப்பையோ இணையும் இடத்தையோ குறிக்கிறது; முதன்மை உரையில் இயல்பான தமிழுக்காக ‘இணைக்கப்பட்ட தொகுதி’ என வழங்கப்பட்டுள்ளது, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כֵּן עָשָׂה
  choice: அதுபோலவே ... அவற்றைச் செய்தான்
  rationale: மறுபுறத்திலும் அதே செயல் செய்யப்பட்டதைக் காட்டும் இணையான வாக்கிய அமைப்பைத் தெளிவாகத் தருகிறது.
- source_word: הַקִּיצוֹנָה
  choice: கடைசித்
  rationale: தொகுதியின் வெளிப்புற முனையில் அமைந்த திரைச்சீலையைச் சுட்டுகிறது; தமிழில் ‘கடைசித் திரைச்சீலை’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַשֵּׁנִית
  choice: இரண்டாம்
  rationale: முதல் இணைக்கப்பட்ட தொகுதிக்கு மாறாக இரண்டாவது தொகுதியை வெளிப்படையாக அடையாளப்படுத்துகிறது.
