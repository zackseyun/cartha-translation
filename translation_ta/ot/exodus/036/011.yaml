revisions:
- from: இணைக்கப்பட்ட முதல் தொகுதியின் முனையிலிருந்த முதல் திரைச்சீலையின் ஓரத்தில் நீல நூலால் வளையங்களைச் செய்தான்[a]. அதுபோலவே, இணைக்கப்பட்ட இரண்டாம் தொகுதியின் முனையிலிருந்த கடைசித் திரைச்சீலையின் ஓரத்திலும் அவற்றைச் செய்தான்.
  to: முதல் இணைக்கப்பட்ட தொகுதியின் கடைமுனையில் உள்ள முதல் திரைச்சீலையின் ஓரத்தில் நீல நூலால் கண்ணிகளைச் செய்தான்[a]. அதுபோலவே, இரண்டாம் இணைக்கப்பட்ட தொகுதியிலுள்ள வெளிப்புறத் திரைச்சீலையின் ஓரத்திலும் அவற்றைச் செய்தான்.
  rationale: The revision replaces an ambiguous material-object term with the more precise Tamil term for fabric loops, smooths the first clause’s word order, and renders the final curtain spatially as ‘outermost.’ It retains the supplied first/second contrast and preserves the lexical alternative for ‘joining’ in the footnote.
