translation_notes:
  register: நவீனத் தரத் தமிழில், கட்டுமான விவரத்தை சாதாரண வாசகர் எளிதில் புரிந்துகொள்ளும் வகையில் வழங்கப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் ‘செய்தான்’ என்ற வினை தமிழில் வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. இறுதி கூறின் பெயர்ச்சொல் வாக்கியத்தை இயல்பாக்க ‘செய்யப்பட்டிருந்தன’ சேர்க்கப்பட்டுள்ளது; ‘அடிப்பீடங்களோ’ என்பது எபிரெய வாக்கியத்தின் இறுதி எதிர்நிலை/மாற்றுக் கவனத்தை மென்மையாகப் பிரதிபலிக்கிறது.
