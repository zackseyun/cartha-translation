  text: and its five pillars with their hooks[a]; and he overlaid their tops and their bands with gold[b], and their five bases were bronze.
translation:
  language: ta
  text: அதற்கான ஐந்து தூண்களையும் அவற்றின் கொக்கிகளையும் செய்தான். அவற்றின் உச்சிகளையும் அவற்றின் பட்டைகளையும்[a] தங்கத்தால் பொதிந்தான். அவற்றின் ஐந்து அடிப்பீடங்கள்[b] வெண்கலத்தால் ஆனவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பட்டைகள்’ என்பதற்கான எபிரெயச் சொல் தூண்களைச் சுற்றிய அலங்காரப் பட்டைகளையோ அவற்றை இணைக்கும் கூறுகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘சாக்கெட்டுகள்’; எபிரெயச் சொல் தூண்கள் நிலைநிறுத்தப்படும் அடிப்பகுதிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: அதற்கான ஐந்து தூண்கள்
  rationale: עַמּוּד என்பது செங்குத்தான தாங்கும் தூணைக் குறிக்கிறது. ஒருமை உடைமைப் பின்னொட்டு முந்தைய வசனத்திலுள்ள திரைக்கதவைக் சுட்டுவதால், இயல்பான தமிழில் ‘அதற்கான’ என வழங்கப்பட்டது.
- source_word: וָוֵיהֶם
  choice: அவற்றின் கொக்கிகள்
  rationale: திருக்கூடாரக் கட்டுமானச் சூழலில் וָו என்பது திரையைத் தொங்கவிடத் தூண்களில் பொருத்தப்பட்ட கொக்கிகளைக் குறிக்கிறது.
- source_word: וְצִפָּה
  choice: பொதிந்தான்
  rationale: צפה என்ற வினை ஓர் உலோகத் தகட்டால் மேற்பரப்பை மூடுவதைக் குறிக்கிறது; ‘தங்கத்தால் பொதிந்தான்’ என்பது கைவினைச் செயலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: רָאשֵׁיהֶם
  choice: அவற்றின் உச்சிகள்
  rationale: சொல்லுக்குச் சொல் ‘அவற்றின் தலைகள்’; தூண்களின் சூழலில் அவற்றின் மேற்பகுதிகளைக் குறிக்கும் ‘உச்சிகள்’ இயல்பானது.
- source_word: חֲשֻׁקֵיהֶם
  choice: அவற்றின் பட்டைகள்
  rationale: இச்சொல் தூண்களுடன் தொடர்புடைய சுற்றுப்பட்டைகள் அல்லது இணைப்புக் கூறுகளைக் குறிக்கலாம். அவற்றின் துல்லிய வடிவத்தை நிர்ணயிக்காமல் ‘பட்டைகள்’ என்று மொழிபெயர்க்கப்பட்டது; மாற்று விளக்கம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: אַדְנֵיהֶם
  choice: அவற்றின் ஐந்து அடிப்பீடங்கள்
  rationale: אֶדֶן என்பது தூணைத் தாங்கும் அடிப்பகுதி அல்லது அது பொருந்தும் துளையுள்ள அடித்தாங்கியைக் குறிக்கிறது. வாசகருக்குத் தெளிவான ‘அடிப்பீடங்கள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, ‘பொருத்துத் தாங்கிகள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: பண்டைய உலோகத்தின் துல்லியக் கலவை உறுதியல்ல என்றாலும், திருக்கூடார உலோகப் பணிச் சூழலில் נְחֹשֶׁת என்பதற்கான வழக்கமான, புரிந்துகொள்ளக்கூடிய தமிழ் மொழிபெயர்ப்பு ‘வெண்கலம்’ ஆகும்.
