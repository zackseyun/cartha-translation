base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/037.yaml
  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: ta
  text: அவன் கூடாரத்தின் நுழைவாயிலுக்காக நீல, ஊதா, கருஞ்சிவப்பு நிற நூல்களாலும், முறுக்கப்பட்ட மெல்லிய சணல் நூலாலும் ஒரு திரைச்சீலையை[a] செய்தான்; அது சித்திரத் தையல் வேலைப்பாடாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நுழைவுத் திரை.’ இதற்கான எபிரெயச் சொல் நுழைவாயிலில் தொங்கவிடப்படும் திரை அல்லது மறைப்பைக் குறிக்கிறது; உட்புறப் பிரிப்பான ‘மறைப்புத் திரை’க்கான எபிரெயச் சொல்லிலிருந்து இது வேறுபட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் செய்தான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த செயலை முன்னெடுக்கிறது; தமிழில் இயல்பான தொடர்ச்சிக்காக எளிய இறந்தகால வினை பயன்படுத்தப்பட்டது.
- source_word: מָסָךְ
  choice: திரைச்சீலை
  rationale: நுழைவிடத்தில் தொங்கவிடப்படும் மறைப்பைக் குறிக்கிறது. இது உட்புறப் பிரிப்புக்கான פָּרֹכֶת என்பதிலிருந்து வேறுபட்டது; ‘திரைச்சீலை’ நவீனத் தமிழில் இப்பொருளை இயல்பாகத் தருகிறது.
- source_word: לְפֶתַח הָאֹהֶל
  choice: கூடாரத்தின் நுழைவாயிலுக்காக
  rationale: פֶּתַח என்பது திறப்பு அல்லது நுழைவாயில்; אֹהֶל என்பதன் பொதுப்பொருளான ‘கூடாரம்’ விரிவாக்கமின்றித் தக்கவைக்கப்பட்டது.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: நீலம், ஊதா, கருஞ்சிவப்பு நிற நூல்கள்
  rationale: இவை சாயமிடப்பட்ட நெசவுப் பொருட்களைக் குறிக்கின்றன. சூழலுக்கேற்றவாறு ‘நூல்கள்’ வெளிப்படையாகச் சேர்க்கப்பட்டு, ஒவ்வொரு நிறமும் தெளிவாகக் கொடுக்கப்பட்டது.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: முறுக்கப்பட்ட மெல்லிய நார்ப்பட்டு
  rationale: שֵׁשׁ உயர்தர மெல்லிய லினன் துணிநாரையும், מָשְׁזָר முறுக்கப்பட்ட தன்மையையும் குறிக்கிறது. தமிழ்ச் சூழலில் புரியத்தக்க பாரம்பரியப் பதமாக ‘நார்ப்பட்டு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: சித்திரத் தையல்காரனின் வேலைப்பாடு
  rationale: பல நிற நூல்களால் அலங்கார வடிவங்களை உருவாக்கும் திறமையான தையல் வேலையை இச்சொற்றொடர் குறிக்கிறது; கைவினைஞரைக் குறிப்பதும் மூலத்தின் அமைப்பைப் பேணுகிறது.
