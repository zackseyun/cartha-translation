  register: நவீன பொதுத்தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. தொழில்நுட்ப நெசவுச் சொற்கள் சாதாரண வாசகருக்கும் புரியுமாறு தரப்பட்டுள்ளன; மூலத்தில் இல்லாத ‘திருக்கூடாரம்’ போன்ற விரிவாக்கம் தவிர்க்கப்பட்டது.
