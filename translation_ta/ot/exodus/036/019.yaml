source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ מִכְסֶה֙ לָ/אֹ֔הֶל עֹרֹ֥ת אֵלִ֖ים מְאָדָּמִ֑ים וּ/מִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִ/לְ/מָֽעְלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/019.yaml
  text: He made a covering for the tent of ram skins dyed red[a], and a covering of fine leather above.
translation:
  language: ta
  text: அவன் கூடாரத்திற்குச் சிவப்புச் சாயமிடப்பட்ட ஆட்டுக்கடா தோல்களால் ஒரு மூடுபடலத்தைச் செய்தான்; அதன்மேல் தகாஸ் தோல்களால்[a] இன்னொரு மூடுபடலத்தையும் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தகாஸ் தோல்கள்” என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் תְּחָשִׁים என்பதன் பொருள் உறுதியில்லை. இது “கடற்பசுத் தோல்கள்,” “கடற்பன்றி தோல்கள்,” “டுகாங் தோல்கள்,” அல்லது மரபுவழியாக “பேட்ஜர் தோல்கள்” எனவும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பதன் wayyiqtol வடிவம் தொடர்ச்சியான கடந்தகாலச் செயலைக் குறிக்கிறது; தமிழில் இயல்பான இறந்தகால வினை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מִכְסֶה לָאֹהֶל
  choice: கூடாரத்திற்காக ... ஒரு மூடுதிரை
  rationale: מִכְסֶה என்பது மூடும் படலத்தையும் אֹהֶל என்பது நேரடியாகக் கூடாரத்தையும் குறிக்கின்றன. 'மூடுதிரை' பொருளையும் சூழலையும் இயல்பாக எடுத்துரைக்கிறது.
- source_word: עֹרֹת אֵלִים מְאָדָּמִים
  choice: சிவப்புச் சாயமிட்ட ஆட்டுக்கடாக்களின் தோல்கள்
  rationale: אֵלִים என்பது ஆண் செம்மறியாடுகளையும், מְאָדָּמִים என்பது சிவப்பாக்கப்பட்ட அல்லது சிவப்புச் சாயமிடப்பட்ட நிலையையும் குறிக்கிறது.
- source_word: וּמִכְסֵה
  choice: ஒரு மூடுதிரையையும்
  rationale: எபிரெய உரை இரண்டாவது மூடுதலுக்கும் அதே பெயரைத் திரும்பப் பயன்படுத்துகிறது; 'இரண்டாவது' என விளக்கமாகச் சேர்க்கப்படவில்லை.
- source_word: עֹרֹת תְּחָשִׁים
  choice: தரமான தோல்கள்
  rationale: תְּחָשִׁים எந்த விலங்கைக் குறிக்கிறது என்பது உறுதியில்லை. ஊகமான விலங்கு அடையாளத்தை முதன்மை உரையில் நிர்ணயிக்காமல், பதனிடப்பட்ட சிறப்புத் தோல் என்ற பொதுவான பொருள் தரப்பட்டது; ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִלְמָעְלָה
  choice: அதற்கு மேலாக
  rationale: இது மேலிருக்கும் வெளிப்புற அடுக்கின் இடத்தைக் குறிக்கிறது; 'அதற்கு மேலாக' இரு மூடுதிரைகளுக்கிடையிலான தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
