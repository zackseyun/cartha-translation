base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: ta
  text: அவன் நீலநூல், ஊதாநூல், செந்நிற நூல்[b], மெல்லிய முறுக்கப்பட்ட லினன் நூல் ஆகியவற்றால் திரைச்சீலையை[a] செய்தான்; கேருபீன்கள் இடம்பெறுமாறு, கலைநயமுள்ள வடிவ வேலைப்பாடாக[c] அதைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மறைப்புத் திரை.’
    reason: lexical_alternative
  - marker: b
    text: ‘செந்நிறம்’ என்பதற்கான எபிரெயச் சொற்றொடர், சொல்லுக்குச் சொல் முறையில் செந்நிறச் சாயமிட்ட பொருள் அல்லது நூலைக் குறிக்கிறது; ‘கருஞ்சிவப்பு நூல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘திறமையான கைவினைஞரின் வேலைப்பாடாக’ அல்லது ‘வடிவமைத்து நெய்யப்பட்ட வேலைப்பாடாக.’ கலைநயமுள்ள வடிவ வேலைப்பாட்டை எபிரெயச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: திரைச்சீலை
  rationale: இது திருவாசஸ்தலத்தின் உட்பகுதியைப் பிரித்த திரையைக் குறிக்கிறது. ‘திரைச்சீலை’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது; பாரம்பரிய மாற்றான ‘மறைப்புத் திரை’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תְּכֵלֶת
  choice: நீலநூல்
  rationale: திருவாசஸ்தலத் துணிகளில் பயன்படுத்தப்பட்ட நீலச் சாயமிட்ட பொருள் அல்லது நூலைக் குறிக்கிறது. இங்கு துணிநெய்தல் சூழலைத் தெளிவாக்க ‘நூல்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אַרְגָּמָן
  choice: ஊதாநூல்
  rationale: மதிப்புமிக்க ஊதாச் சாயமிட்ட நூல் அல்லது பொருளைக் குறிக்கும் வழக்கமான, தெளிவான மொழிபெயர்ப்பு.
- source_word: תוֹלַעַת שָׁנִי
  choice: செந்நிற நூல்
  rationale: செந்நிறச் சாயமிட்ட பொருள் அல்லது நூலைக் குறிக்கும் எபிரெயச் சொற்றொடர். ‘செந்நிற நூல்’ நெய்தல் சூழலில் இயல்பாக உள்ளது; ‘கருஞ்சிவப்பு நூல்’ சாத்தியமான மாற்றாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: முறுக்கப்பட்ட மெல்லிய சணல்நூல்
  rationale: שֵׁשׁ மெல்லிய சணல்நூலையும் מָשְׁזָר முறுக்கப்பட்ட தன்மையையும் குறிக்கின்றன; இரு கூறுகளும் தமிழில் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளன.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: திறமையான வடிவமைப்பாளரின் வேலைப்பாடு
  rationale: இச்சொற்றொடர் வெறும் கைவேலையை அல்லாமல் திட்டமிட்ட கலைநயமுள்ள வடிவ வேலைப்பாட்டைக் குறிக்கிறது. நெசவாளர் அல்லது கைவினைஞர் என்ற மாற்றுகளைக் காட்டிலும் ‘வடிவமைப்பாளர்’ அந்தக் கருத்தை அணுகத்தக்க தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּרֻבִים
  choice: கேருபீன்கள்
  rationale: இந்த விண்ணுலக உயிரினங்களுக்கான தமிழ்க் கிறிஸ்தவ இலக்கியத்தில் நிலைபெற்ற வேதாகமப் பெயர்; அலங்காரக் குழந்தைத் தூதர்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: கேருபீன்கள் இடம்பெறுமாறு அதைச் செய்தான்
  rationale: கேருபீன்கள் திரைச்சீலையின் வடிவத்தில் இணைக்கப்பட்டிருந்ததை இது இயல்பான தமிழில் தெரிவிக்கிறது; அவை எவ்வாறு உருவாக்கப்பட்டன என்பதைத் தேவையின்றி குறிப்பாக்கவில்லை.
