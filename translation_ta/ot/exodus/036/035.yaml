translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் அதேவேளையில் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் மீளுரையை தமிழில் இயல்பாகத் தக்கவைக்க ‘செய்தான்’ இருமுறை வருகிறது. கேருபீன்கள் எந்த நுட்பத்தில் துணியில் அமைக்கப்பட்டன என்பது மூலத்தில் முற்றிலும் குறிப்பாக இல்லாததால், ‘எம்பிராய்டரி செய்தான்’ எனத் தீர்மானிக்காமல் உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
