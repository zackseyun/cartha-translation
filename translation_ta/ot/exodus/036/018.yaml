  yaml_path: translation/ot/exodus/036/018.yaml
  text: He made fifty bronze clasps to join the tent[a], so that it would be one.
translation:
  language: ta
  text: கூடாரம் ஒன்றாயிருக்கும்படி அதை இணைக்க, அவர் ஐம்பது வெண்கலக் கொக்கிகளைச் செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் செய்தார்
  rationale: עשה என்பதன் wayyiqtol வடிவம் கதைநடையை முன்னெடுக்கும் எளிய இறந்தகாலச் செயலைக் குறிக்கிறது; நவீன தமிழில் தொடக்க இணைப்புச்சொல் இல்லாமலேயே இயல்பாக உள்ளது.
- source_word: קַרְסֵי
  choice: இணைப்புகள்
  rationale: திரைத் தொகுதிகளை ஒன்றோடொன்று பிணைக்கும் உலோகப் பொருட்களை இது குறிக்கிறது. ‘இணைப்புகள்’ என்பது அவற்றின் செயலையும் நவீன வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கல
  rationale: திருக்கூடாரப் பொருட்களின் சூழலில் נְחֹשֶׁת வழக்கமாக வெண்கலத்தைக் குறிக்கிறது; ‘செம்பு’ என்பதும் சாத்தியமான சொற்பொருள் என்றாலும், இங்கு வெண்கலம் பொருத்தமான மரபான தேர்வு.
- source_word: חֲמִשִּׁים
  choice: ஐம்பது
  rationale: இணைப்புகளின் எண்ணிக்கையைக் குறிக்கும் நேரடியான எண்ணுப்பெயர்.
- source_word: לְחַבֵּר
  choice: இணைவதற்காக
  rationale: இந்த infinitive நோக்கத்தை வெளிப்படுத்துகிறது. தமிழில் கூடாரம் இணைப்புகளால் ஒரே அமைப்பாக இணைக்கப்படுவதை இயல்பாகச் சொல்கிறது.
- source_word: אֶת הָאֹהֶל
  choice: கூடாரம்
  rationale: אֹהֶל என்பதன் நேரடிப் பொருள் ‘கூடாரம்’; சூழலில் இது திருக்கூடார அமைப்பைக் குறித்தாலும், மூலச்சொல்லைத் தக்கவைக்கிறது.
- source_word: לִהְיוֹת אֶחָד
  choice: ஒன்றாக
  rationale: இணைக்கப்பட்ட அமைப்பு ஒரே முழுமையாக இருப்பதைக் குறிக்கிறது. தமிழில் நோக்கக் கூறுடன் சேர்த்து ‘ஒன்றாக இணைவதற்காக’ என்று இயல்பாக வழங்கப்பட்டுள்ளது.
