revisions:
- from: கூடாரம்[a] ஒன்றாக இணைவதற்காக, அவர் ஐம்பது வெண்கல இணைப்புகளைச் செய்தார்.
  to: கூடாரம் ஒன்றாயிருக்கும்படி அதை இணைக்க, அவர் ஐம்பது வெண்கலக் கொக்கிகளைச் செய்தார்.
  rationale: “கொக்கிகள்” gives a concrete modern-Tamil rendering of the bronze clasps, and “கூடாரம் ஒன்றாயிருக்கும்படி அதை இணைக்க” preserves the Hebrew’s purpose of joining the tent and its resulting unity. The supplied contextual footnote is retained unchanged.
