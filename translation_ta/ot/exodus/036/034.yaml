  source_fidelity: எபிரெய மூலத்தின் மூன்று ‘பொன்’ குறிப்புகளும், சட்டங்கள்/கட்டமைப்பு உறுப்புகள், அவற்றின் வளையங்கள், தாழ்ப்பாள்களுக்கான ‘வீடுகள்’ என்ற செயல்பாட்டுப் பொருள், மற்றும் தாழ்ப்பாள்களுக்கு இடப்பட்ட பொன் மேலுறை ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘தாழ்ப்பாள்கள்’ இச்சூழலில் கட்டமைப்பை இணைக்கும் குறுக்குக் கம்பிகளைக் குறிக்கும் நிலையான வழக்காக ஏற்கத்தக்கது.
  naturalness: நடை நவீன தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘பொன்னால் பொதிந்தார்’ என்பது மூல வினையின் மேலுறை இடுதல் என்ற பொருளை இயல்பாகத் தருகிறது.
  terminology: ‘சட்டங்கள்’ என்பது திருக்கூடாரத்தின் கட்டமைப்பு உறுப்புகளுக்கு ஏற்றது; மாற்றாக ‘பலகைகள்’ இருக்கலாம் என்பதை அடிக்குறிப்பு முறையாகக் குறிப்பிடுகிறது. ‘பிடிப்பிடங்கள்’ בָּתִּים என்பதன் இவ்விடத்து செயல்பாட்டு பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
