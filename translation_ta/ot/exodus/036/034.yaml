  text: וְֽ/אֶת הַ/קְּרָשִׁ֞ים צִפָּ֣ה זָהָ֗ב וְ/אֶת טַבְּעֹתָ/ם֙ עָשָׂ֣ה זָהָ֔ב בָּתִּ֖ים לַ/בְּרִיחִ֑ם וַ/יְצַ֥ף אֶת הַ/בְּרִיחִ֖ם זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/034.yaml
  text: He overlaid the frames with gold[a], and made their rings of gold as holders for the bars[b], and overlaid the bars with gold.
translation:
  language: ta
  text: அவர் சட்டங்களைப் பொன்னால் பொதிந்தார்[a]. அவற்றின் வளையங்களைத் தாழ்ப்பாள்களுக்கான பிடிப்பிடங்களாகப் பொன்னால் செய்தார்[b]. தாழ்ப்பாள்களையும் பொன்னால் பொதிந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சட்டங்கள்’ என்பதற்குப் பதிலாக ‘பலகைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் திருக்கூடாரத்தின் மரத்தாலான கட்டமைப்பு உறுப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘தாழ்ப்பாள்களுக்கான வீடுகள்’; அதாவது, தாழ்ப்பாள்களை ஏற்றுத் தாங்கும் பிடிப்பிடங்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: சட்டங்களை
  rationale: திருக்கூடாரத்தின் நிமிர்ந்த கட்டமைப்பு உறுப்புகளைக் குறிக்கும் சொல்லாக ‘சட்டங்கள்’ இயல்பாகவும் செயல்பாட்டை உணர்த்துவதாகவும் உள்ளது; ‘பலகைகள்’ என்பதும் சாத்தியம்.
- source_word: צִפָּה / וַיְצַף
  choice: பொதிந்தார்
  rationale: ஒரு பொருளின் மேற்பரப்பை மற்றொரு பொருளால் மூடுதல் அல்லது மேலடுக்கு இடுதல் என்ற பொருளை இச்சூழலில் துல்லியமாகத் தருகிறது; இரண்டு இடங்களிலும் ஒரே வினைச்சொல் பயன்படுத்தப்பட்டுள்ளது.
- source_word: זָהָב
  choice: பொன்
  rationale: நேரடியான பொருட்பெயர்; எபிரெய மூலத்தில் உள்ள மூன்று குறிப்புகளும் தமிழில் தக்கவைக்கப்பட்டுள்ளன.
- source_word: טַבְּעֹתָם
  choice: அவற்றின் வளையங்களை
  rationale: பன்மைச் சொல் மற்றும் மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָשָׂה
  choice: செய்தார்
  rationale: பொதுவான ‘செய்/உருவாக்கு’ பொருளுக்கு இங்கு இயல்பான தமிழ் இணை.
- source_word: בָּתִּים
  choice: பிடிப்பிடங்களாக
  rationale: சொல்லுக்கு நேரடியாக ‘வீடுகள்’ என்று பொருள் இருந்தாலும், இங்கு தாழ்ப்பாள்களை ஏற்றுத் தாங்கும் இடங்கள் என்ற செயல்பாட்டு பொருளைத் தருகிறது.
- source_word: לַבְּרִיחִם
  choice: தாழ்ப்பாள்களுக்கான
  rationale: சட்டங்களை இணைத்துப் பிடிக்கும் குறுக்குக் கம்பிகளைக் குறிக்கிறது; திருக்கூடாரக் கட்டுமானச் சூழலில் ‘தாழ்ப்பாள்கள்’ மரபும் பொருத்தமும் கொண்ட சொல்.
