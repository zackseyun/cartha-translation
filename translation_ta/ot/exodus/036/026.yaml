  text: 'and their forty silver bases: two bases under the one frame[a], and two bases under the one frame.'
translation:
  language: ta
  text: 'அவற்றின் நாற்பது வெள்ளி அடிப்பீடங்கள்: ஒரு பலகையின் கீழ் இரண்டு அடிப்பீடங்கள், ஒரு பலகையின் கீழ் இரண்டு அடிப்பீடங்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு சட்டகத்தின் கீழ் இரண்டு அடிப்பீடங்கள், ஒரு சட்டகத்தின் கீழ் இரண்டு அடிப்பீடங்கள்.’ எபிரெய உரை இரண்டு கூறுகளிலும் ‘ஒரு பலகை/சட்டகம்’ என்பதையே மீண்டும் கூறுகிறது; ‘மற்றொரு பலகை’ என்று கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: நாற்பது
  rationale: இணைப்புச் சொல் முந்தைய கட்டுமானப் பட்டியலைத் தொடர்கிறது; தமிழில் வாக்கிய அமைப்புக்கேற்ப எண்ணிக்கை இயல்பான இடத்தில் வைக்கப்பட்டுள்ளது.
- source_word: אַדְנֵי/הֶם
  choice: அவற்றுக்கான அடித்தளங்கள்
  rationale: கூடாரச் சட்டங்களைத் தாங்கும் ஆதாரப் பகுதிகளை אֲדָנִים குறிக்கிறது; நவீன தமிழில் ‘அடித்தளங்கள்’ தெளிவாகவும் கட்டுமானச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: כָּסֶף
  choice: வெள்ளி
  rationale: அடித்தளங்கள் செய்யப்பட்ட பொருளை இச்சொல் குறிப்பிடுகிறது; ‘வெள்ளி அடித்தளங்கள்’ என்பது இயல்பான தமிழ் தொடர்.
- source_word: שְׁנֵי אֲדָנִים
  choice: இரண்டு அடித்தளங்கள்
  rationale: முன்பு தேர்ந்தெடுக்கப்பட்ட சொல்லுடன் ஒருமைப்பாட்டைக் காத்து, எண்ணிக்கையும் பெயர்ச்சொல்லும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: תַּחַת
  choice: கீழ்
  rationale: ஒவ்வொரு சட்டத்துக்கும் அடியில் அமைந்திருந்த இடத்தை இயல்பாகக் குறிக்கிறது.
- source_word: הַ/קֶּרֶשׁ
  choice: சட்டம்
  rationale: கூடாரத்தின் செங்குத்தான கட்டமைப்பு உறுப்பை קֶרֶשׁ குறிக்கிறது; ‘சட்டம்’ அதன் கட்டுமானப் பண்பை ‘பலகை’ என்பதைக் காட்டிலும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָ/אֶחָד
  choice: ஒரு
  rationale: எபிரெய உரை இரு கூறுகளிலும் ‘அந்த ஒன்று’ என்ற வடிவத்தை மீண்டும் பயன்படுத்துகிறது. தமிழில் அதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒரு சட்டம்’ எனக் கொடுத்து, இரு கூறுகளிலும் மீளுருவாக்கம் பாதுகாக்கப்பட்டுள்ளது.
