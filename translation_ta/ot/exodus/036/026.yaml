  register: நவீன தரத் தமிழில், கட்டுமானப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் திட்டமிட்ட மறுபடிப்பு பிரதான உரையில் பாதுகாக்கப்பட்டுள்ளது.
