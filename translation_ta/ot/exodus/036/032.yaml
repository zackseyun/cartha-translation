  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: ta
  text: மேலும், திருக்கூடாரத்தின் இரண்டாவது பக்கத்தின் பலகைகளுக்கு ஐந்து இணைப்புக் கம்பிகளும்[a], திருக்கூடாரத்தின் மேற்கேயுள்ள கடைக்கோடிப் பின்பகுதிப் பலகைகளுக்கு ஐந்து இணைப்புக் கம்பிகளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இணைப்புக் கம்பிகள்’ என்பதை ‘குறுக்குக் கம்பிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: குறுக்குச் சட்டங்கள்
  rationale: கூடாரத்தின் பலகைகளை ஒன்றாகப் பிணைக்கும் கிடைமட்ட மரச்சட்டங்களைக் குறிக்கிறது. ‘குறுக்குச் சட்டங்கள்’ என்பது அவற்றின் கட்டுமானப் பணியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: קַרְשֵׁי
  choice: பலகைகள்
  rationale: திருவாசக் கூடாரத்தின் கட்டமைப்பில் பயன்படுத்தப்பட்ட மர அலகுகளைக் குறிக்கிறது. ‘பலகைகள்’ என்பது பொருளை மிகைப்படுத்தாமல் பொதுவாகப் புரியவைக்கிறது.
- source_word: צֶלַע הַמִּשְׁכָּן הַשֵּׁנִית
  choice: திருவாசக் கூடாரத்தின் இரண்டாவது பக்கம்
  rationale: הַשֵּׁנִית என்பதன் நேரடியான வரிசைப் பொருளான ‘இரண்டாவது’ என்பதையும், צֶלַע என்பதன் ‘பக்கம்’ என்ற பொருளையும் காக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசக் கூடாரம்
  rationale: மக்களிடையே தேவன் வாசம்பண்ணுவதற்குரிய பரிசுத்தக் கூடாரத்தைச் சுட்டுகிறது. சொற்பிறப்பின் ‘வாசம்’ என்ற கருத்தையும் கட்டமைப்பின் ‘கூடாரம்’ என்ற இயல்பையும் இணைக்கிறது.
- source_word: לַיַּרְכָתַיִם
  choice: கடைக்கோடிப் பின்பகுதி
  rationale: வெறும் ‘பின்பக்கம்’ என்பதைக் காட்டிலும், சொல்லில் உள்ள தொலைவான அல்லது கடைசி எல்லைப் பகுதி என்ற இடவியல் வலிமையைப் பாதுகாக்கிறது.
- source_word: יָמָּה
  choice: மேற்கே
  rationale: இச்சூழலில் கடலை நோக்கிய திசை என்பது மேற்குத் திசையைக் குறிக்கிறது; ‘மேற்கே’ என்பது சுருக்கமான இயல்பான மொழிபெயர்ப்பு.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: மேலும் ... ஐந்து ... ஐந்து
  rationale: எபிரெயப் பட்டியல் நடையின் தொடர்ச்சியையும் இரு பகுதிகளுக்குமான சமச்சீர் எண்ணிக்கையையும் காக்கிறது.
