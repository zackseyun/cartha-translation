  text: וַ/יֹּאמְרוּ֙ אֶל מֹשֶׁ֣ה לֵּ/אמֹ֔ר מַרְבִּ֥ים הָ/עָ֖ם לְ/הָבִ֑יא מִ/דֵּ֤י הָֽ/עֲבֹדָה֙ לַ/מְּלָאכָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: ta
  text: அவர்கள் மோசேயிடம், “யாவே செய்யும்படி கட்டளையிட்ட பணிக்குத் தேவையானதைவிட மக்கள் அதிகமாகக் கொண்டுவருகிறார்கள்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் பணிக்காக அளவுக்கு அதிகமாகக் கொண்டுவருகிறார்கள்.” எபிரெயச் சொற்றொடர், அவர்கள் கொண்டுவரும் பொருட்கள் தேவையான அளவை மீறுகின்றன என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: அவர்கள் மோசேயிடம் … என்றார்கள்
  rationale: எபிரெயக் கதைநடையில் நேர்கூற்றை அறிமுகப்படுத்தும் வழக்கமான தொடரை, தேவையற்ற ‘சொல்லி’ என்ற இரட்டிப்பைத் தவிர்த்து இயல்பான தமிழில் வழங்குகிறது.
- source_word: מַרְבִּים … לְהָבִיא מִדֵּי
  choice: தேவையானதைவிட … மிக அதிகமாகக் கொண்டுவருகிறார்கள்
  rationale: மக்கள் தொடர்ந்து கொண்டுவருவதையும், அவர்கள் கொண்டுவருவது போதுமான அளவைத் தாண்டியிருப்பதையும் ஒருங்கிணைத்துக் காட்டுகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: பணிக்குத் தேவையானதை
  rationale: இரு எபிரெயச் சொற்களும் இங்கு திருவாசஸ்தல அமைப்புப் பணியையும் அதற்கான தேவையையும் குறிக்கின்றன; சொல்லுக்குச் சொல் மீளுரைப்பதைவிட பொருளைத் தெளிவாகத் தருகிறது.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשֹׂת אֹתָהּ
  choice: யாவே செய்யும்படி கட்டளையிட்ட பணி
  rationale: கட்டளையிடப்பட்ட வேலையைச் சுட்டும் சார்பு வாக்கியத்தை இயல்பான தமிழில் வழங்கி, தெய்வீகப் பெயரையும் பெயராகவே தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல், வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தருவது மூலத்தின் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘பணி’ மற்றும் ‘கொண்டுவருகிறார்கள்’ என்பவை திருவாசஸ்தலப் பணியின் சூழலையும் தொடர்ந்து நடைபெறும் கொடையளிப்பையும் இயல்பாக வெளிப்படுத்துகின்றன.
