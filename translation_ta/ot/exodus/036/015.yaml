  text: ஒவ்வொரு திரைச்சீலையின் நீளம் முப்பது முழமும், ஒவ்வொரு திரைச்சீலையின் அகலம் நான்கு முழமும் இருந்தது; பதினொரு திரைச்சீலைகளும் ஒரே அளவுடையவையாக இருந்தன.
