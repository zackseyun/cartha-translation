lexical_decisions:
- source_word: יְרִיעָה
  choice: திரைச்சீலை
  rationale: திருவுறைவிடத்தை மூடும் துணிப்பகுதியைக் குறிக்கும் சொல்லாக, சூழலுக்கு ஏற்ற இயல்பான நவீனத் தமிழ்.
- source_word: אַמָּה
  choice: முழம்
  rationale: பண்டைய நீள அலகான cubit-க்கு வழக்கில் நிலைபெற்ற தமிழ் வேதாகமச் சொல்.
- source_word: מִדָּה אַחַת
  choice: ஒரே அளவுடையவையாக
  rationale: எபிரெய உரையின் ‘ஒரு அளவு’ என்ற கருத்தை இயல்பான தமிழில் தெரிவித்து, பதினொரு திரைச்சீலைகளும் ஒரே பரிமாணத்தில் செய்யப்பட்டன என்பதைப் பாதுகாக்கிறது.
