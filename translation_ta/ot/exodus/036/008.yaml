revisions:
- from: வேலையில் ஈடுபட்டவர்களில் கைத்திறன் பெற்ற அனைவரும்[a], முறுக்கப்பட்ட மெல்லிய சணல்நூல், நீலநிற நூல், ஊதாநிற நூல், கருஞ்சிவப்பு நிற நூல் ஆகியவற்றால் ஆன பத்துத் திரைச்சீலைகளைக் கொண்டு திருவாசஸ்தலத்தை அமைத்தார்கள்; திறமையான வடிவமைப்பாளரின் வேலைப்பாடாக, அந்தத் திரைச்சீலைகளைக் கேருபீன்கள் கொண்டவையாக அவன் செய்தான்[b].
  to: வேலை செய்பவர்களுள் கைத்திறன் மிக்க அனைவரும்[a] திருவாசஸ்தலத்திற்கான பத்துத் திரைச்சீலைகளை மெல்லிய முறுக்கப்பட்ட ஆளிநூலாலும், நீல, ஊதா, செந்நிற நூல்களாலும் செய்தார்கள்; கேருபீன்கள் இடம்பெற்ற நுட்பமான வடிவமைப்பு வேலைப்பாடாக அவற்றைச் செய்தான்[b].
  rationale: துணிநார் வகையில் ஏற்படக்கூடிய தவறான பொருளைத் தவிர்க்க ‘சணல்நூல்’ ‘ஆளிநூல்’ என மாற்றப்பட்டது. கேருபீன்களும் நுட்பமான வடிவமைப்பும் திரைச்சீலைகளின் வேலைப்பாட்டைக் குறிக்கின்றன என்பதைத் தெளிவாக்க வாக்கிய அமைப்பு மாற்றப்பட்டது. மூலத்தின் பன்மைத் தொடக்கம் மற்றும் இறுதி ஒருமை வினை வேறுபாடு மாற்றப்படவில்லை; அடிக்குறிப்பும் அந்தத் தமிழ்ச் சொல்லமைப்புக்கு ஏற்ப புதுப்பிக்கப்பட்டது.
