  naturalness: திருத்தப்பட்ட வாக்கியம் நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. ‘திருவாசஸ்தலத்திற்கான’ என்பது מִשְׁכָּן மற்றும் அதன் பத்து திரைச்சீலைகள் இடையிலான கட்டமைப்புத் தொடர்பைத் தெளிவாக்குகிறது. வெளிப்படையான முன்னிலை இல்லாமல் இறுதியில் ‘செய்தான்’ என வருவது மூலத்தின் எண்ணிக்கை மாறுபாட்டைத் தேவையற்ற அறியப்படாத நபரைக் குறிக்காமல் தக்கவைக்கிறது.
