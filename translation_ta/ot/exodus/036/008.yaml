base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: ta
  text: வேலை செய்பவர்களுள் கைத்திறன் மிக்க அனைவரும்[a] திருவாசஸ்தலத்திற்கான பத்துத் திரைச்சீலைகளை மெல்லிய முறுக்கப்பட்ட ஆளிநூலாலும், நீல, ஊதா, செந்நிற நூல்களாலும் செய்தார்கள்; கேருபீன்கள் இடம்பெற்ற நுட்பமான வடிவமைப்பு வேலைப்பாடாக அவற்றைச் செய்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், ‘இதயத்தில் ஞானமுள்ளவர்கள்’; இது கைத்திறன் மிக்க கைவினைஞர்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: வசனம் பன்மை எழுவாயுடனும் பன்மை வினையுடனும் தொடங்கினாலும், எபிரெய உரையின் இறுதி வினை ‘செய்தான்’ என்று ஒருமையில் உள்ளது; சில மொழிபெயர்ப்புகள் இதை ‘செய்தார்கள்’ என்று சீராக்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: கைத்திறன் பெற்ற
  rationale: சொல்லுக்குச் சொல் ‘இதயத்தில் ஞானமுள்ள’ என்றாலும், இச்சூழலில் கைவினைத் திறமையுள்ளவரைக் குறிக்கும் எபிரெய மரபுத்தொடர். நவீனத் தமிழில் அதன் தொழில்சார் பொருளை இயல்பாகத் தருகிறது.
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: வேலையில் ஈடுபட்டவர்களில்
  rationale: முன்னிடைச்சொல்லும் வினையெச்ச வடிவமும், வேலை செய்துகொண்டிருந்த குழுவினருள் இவர்கள் அடங்கியிருந்ததைச் சுட்டுகின்றன.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: யாத்திராகமத்தில் இறைவன் தங்கியிருப்பதைக் குறிக்கும் பரிசுத்தக் கூடார அமைப்புக்கான மரபான, சூழலுக்கேற்ற தமிழ்ச் சொல்.
- source_word: יְרִיעֹת
  choice: திரைச்சீலைகள்
  rationale: திருவாசஸ்தலத்தின் அமைப்பில் பயன்படுத்தப்பட்ட பெரிய துணிப் பகுதிகளைக் குறிக்கிறது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: முறுக்கப்பட்ட மெல்லிய சணல்நூல்
  rationale: உயர்தரமான மெல்லிய சணல் இழைகள் முறுக்கப்பட்ட நூலாக இருந்த துணிநூல் விவரத்தைத் தெளிவாகக் காக்கிறது.
- source_word: תְכֵלֶת
  choice: நீலநிற நூல்
  rationale: மதிப்புமிக்க நீலச் சாயம் ஏற்றப்பட்ட துணிநூலைக் குறிக்கிறது; இங்கு நெசவுப் பொருள் என்பதைத் தமிழில் வெளிப்படையாகச் சொல்கிறது.
- source_word: אַרְגָּמָן
  choice: ஊதாநிற நூல்
  rationale: திருவாசஸ்தலத் துணிகளில் பயன்படுத்தப்பட்ட ஊதா நிறச் சாயமிட்ட நூலுக்கான இயல்பான மொழிபெயர்ப்பு.
- source_word: תוֹלַעַת שָׁנִי
  choice: கருஞ்சிவப்பு நிற நூல்
  rationale: செம்மஞ்சள் அல்லது ஆழ்ந்த சிவப்புச் சாயம் ஏற்றப்பட்ட துணிநூலைக் குறிக்கிறது; ‘கருஞ்சிவப்பு’ இங்கு வேறுபட்ட சடங்குசார் நிறத்தை இயல்பாகக் காட்டுகிறது.
- source_word: כְּרֻבִים
  choice: கேருபீன்கள்
  rationale: பரிசுத்த இடத்துடன் தொடர்புடைய வானுலக உயிரினங்களுக்கான தமிழில் நிலைபெற்ற வேதாகமப் பெயர்.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: திறமையான வடிவமைப்பாளரின் வேலைப்பாடாக
  rationale: திட்டமிட்ட, நுணுக்கமான கலைநெசவு அல்லது வடிவமைப்புப் பணியைச் சுட்டுகிறது; வெறும் தையல் என்ற அளவுக்குச் சுருக்கவில்லை.
- source_word: עָשָׂה אֹתָם
  choice: அந்தத் திரைச்சீலைகளைக் ... அவன் செய்தான்
  rationale: வசனத்தின் தொடக்கத்தில் பன்மை வினை இருந்தாலும், முடிவில் உள்ள எபிரெய வினை ஒருமையில் இருப்பதைத் தமிழிலும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: חֲכַם לֵב என்பதன் பாலினம் மற்றும் பொதுப்பொருள்
  choice: கைத்திறன் பெற்ற அனைவரும்
  alternative: கைத்திறன் பெற்ற ஆண்கள் அனைவரும்
  rationale: எபிரெயச் சொற்றொடர் இலக்கண ரீதியில் ஆண்பால் வடிவில் இருந்தாலும், כָל மற்றும் பன்மை வினையுடன் முழு கைவினைஞர் குழுவையும் பொதுவாகச் சுட்டுகிறது. தமிழில் தேவையின்றி ஆண்களை மட்டும் குறிப்பதாக மாற்றாமல், சூழலின் கூட்டுப்பொருளைக் காக்கிறது.
- issue: வசன முடிவிலுள்ள ஒருமை வினை
  choice: அவன் செய்தான்
  alternative: அவர்கள் செய்தார்கள்
  rationale: மசோரெட்டிக் உரை தொடக்கத்தில் பன்மை வினையையும் முடிவில் ஒருமை வினையையும் கொண்டுள்ளது. அந்த இலக்கணத் திடுமாற்றத்தைச் சீராக்காமல் காத்து, வாசகருக்கு அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வேதாகமச் சூழலுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘திருவாசஸ்தலம்’, ‘கேருபீன்கள்’ ஆகிய நிலைபெற்ற சொற்கள் பயன்படுத்தப்பட்டுள்ளன; துணிநூல் விவரங்கள் பொதுவாசகருக்குத் தெளிவாக விரித்துரைக்கப்பட்டுள்ளன. மூல உரையின் பன்மை–ஒருமை மாறுபாடு திட்டமிட்டு நிலைநிறுத்தப்பட்டுள்ளது.
