  yaml_path: translation/ot/exodus/036/014.yaml
  text: He made curtains of goats’ hair for a tent over the tabernacle[a]; he made eleven curtains.
translation:
  language: ta
  text: திருவாசஸ்தலத்தின் மேல் கூடாரமாக இருக்கும்படி வெள்ளாட்டு மயிரால் திரைச்சீலைகளைச் செய்தான்[a]; அவன் பதினொரு திரைச்சீலைகளைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருள் எதனால் ஆனது என்பதை வெளிப்படையாகச் சொல்லாமல், ‘வெள்ளாடுகளால் ஆன திரைச்சீலைகள்’ என மொழிபெயர்க்கலாம்; திருவாசஸ்தலத் துணிகளின் சூழல் ‘வெள்ளாட்டு மயிர்’ என்பதையே ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: செய்தான்
  rationale: עשה என்பதன் இயல்பான பொருள் ‘செய்/உருவாக்கு’. எபிரெய மூலத்தில் வினைச்சொல் மீண்டும் வருவதால், அந்த வலியுறுத்தலைத் தமிழிலும் இருமுறை தக்கவைத்துள்ளது.
- source_word: יְרִיעֹת
  choice: திரைச்சீலைகள்
  rationale: திருவாசஸ்தல அமைப்பில் இச்சொல் பெரிய துணித் திரைகளைக் குறிக்கிறது; நவீனத் தமிழில் ‘திரைச்சீலைகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עִזִּים
  choice: வெள்ளாட்டு மயிரால்
  rationale: சொல்லளவில் ‘வெள்ளாடுகள்’ என்று இருந்தாலும், இச்சூழலில் நெய்யப்பட்ட வெள்ளாட்டு மயிரே பொருளாகக் கருதப்படுகிறது. தோல் என்று மொழிபெயர்ப்பதற்கான ஆதாரம் இல்லை.
- source_word: לְאֹהֶל
  choice: கூடாரமாக அமைவதற்காக
  rationale: לְ இங்கு நோக்கம் அல்லது பயன்பாட்டைக் காட்டுகிறது. திரைச்சீலைகள் தனியான கூடாரத்திற்காக அல்லாமல், திருவாசஸ்தலத்தின் மேலுள்ள கூடார அடுக்காகச் செய்யப்பட்டன என்பதை இத்தொடர் இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל
  choice: மேல்
  rationale: திருவாசஸ்தலத்தை மூடும் மேலடுக்கின் இருப்பிடத்தை இயல்பான தமிழில் குறிக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: யாத்திராகமத்தில் இது எடுத்துச் செல்லக்கூடிய பரிசுத்த உறைவிடக் கட்டமைப்பைக் குறிக்கும் தொழில்நுட்பச் சொல். ‘திருவாசஸ்தலம்’ என்பது கூடார மூடுதலிலிருந்து இதை வேறுபடுத்தி, வழக்கமான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: பதினொரு
  rationale: கூட்டு எண் நேரடியாகப் ‘பதினொரு’ என்று பொருள்படுகிறது.
- source_word: אֹתָם
  choice: திரைச்சீலைகளை
  rationale: பொருள் சுட்டுப்பெயர் முன் குறிப்பிடப்பட்ட திரைச்சீலைகளையே குறிக்கிறது; தமிழில் பெயர்ச்சொல்லை மீண்டும் கூறுவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
