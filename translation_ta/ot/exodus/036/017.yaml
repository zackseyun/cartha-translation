translation:
  language: ta
  text: இணைக்கப்பட்ட முதல் தொகுதியின் கடைசித் திரைச்சீலையின் ஓரத்தில் ஐம்பது வளையங்களைச் செய்தான்[a]; இணைக்கப்பட்ட இரண்டாம் தொகுதியைச் சேர்ந்த திரைச்சீலையின் ஓரத்திலும் ஐம்பது வளையங்களைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இணைப்பில்” அல்லது “முதலாவது இணைக்கப்பட்ட பகுதியில்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், ஒன்றாக இணைக்கப்பட்ட திரைச்சீலைகளின் தொகுதியை அல்லது அவற்றின் இணைப்பைக் குறிக்கிறது.
    reason: מַחְבָּרֶת என்பதன் ‘இணைப்பு’ மற்றும் ‘இணைக்கப்பட்ட தொகுதி’ ஆகிய சொற்பொருள் வாய்ப்புகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: לֻלָאֹת
  choice: வளையங்கள்
  rationale: திரைச்சீலைகளை ஒன்றோடொன்று இணைக்கப் பயன்படும் துணி வளையங்களைக் குறிக்கிறது. இவ்வசனத்தில் நிறம் குறிப்பிடப்படாததால் அது சேர்க்கப்படவில்லை.
- source_word: שְׂפַת
  choice: ஓரம்
  rationale: துணி அல்லது திரைச்சீலையின் விளிம்பைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: יְרִיעָה
  choice: திரைச்சீலை
  rationale: திருப்பணிக் கூடாரத்தின் பெரிய துணிப் பகுதிகளைக் குறிக்கும் சூழலுக்கேற்ற தெளிவான சொல்.
- source_word: הַקִּיצֹנָה
  choice: கடைசியாக இருந்த
  rationale: தொகுதியின் கடை அல்லது வெளிப்புற நிலையில் இருந்த திரைச்சீலை என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּמַּחְבָּרֶת
  choice: முதல் இணைப்புத் தொகுதியில்
  rationale: ஒன்றாக இணைக்கப்பட்ட திரைச்சீலைகளின் தொகுதி அல்லது இணைப்பைக் குறிக்கிறது. அடுத்த சொற்றொடரில் ‘இரண்டாம்’ என வருவதால் முதல் தொகுதி என்ற உறவு உரையில் தெளிவாக்கப்படுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: இரண்டாம் இணைப்புத் தொகுதியின் திரைச்சீலை
  rationale: இரண்டாவது இணைக்கப்பட்ட எதிர்த் தொகுதியைச் சேர்ந்த திரைச்சீலை என்ற சூழல் பொருளைப் பாதுகாக்கிறது; தேவையற்ற வகையில் ‘அதனுடன் இணைக்கப்பட்டது’ என்று உறவை விரிவுபடுத்தவில்லை.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: செய்தான் ... செய்தான்
  rationale: எபிரெய மூலத்தின் வினைச்சொல் மீளுரைப்பைத் தமிழிலும் பாதுகாக்கிறது.
