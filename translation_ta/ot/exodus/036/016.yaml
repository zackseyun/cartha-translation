  yaml_path: translation/ot/exodus/036/016.yaml
  text: And he joined five curtains by themselves[a], and six curtains by themselves.
translation:
  language: ta
  text: அவர் ஐந்து திரைச்சீலைகளை ஒரு தனித் தொகுதியாக[a] இணைத்தார்; ஆறு திரைச்சீலைகளை மற்றொரு தனித் தொகுதியாக இணைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தனியாக’ அல்லது ‘வேறாக’; ஐந்து திரைச்சீலைகள் ஒரு தொகுதியாகவும், ஆறு திரைச்சீலைகள் வேறொரு தொகுதியாகவும் இணைக்கப்பட்டன என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: ஒன்றாக இணைத்தார்
  rationale: חָבַר என்பது இணைத்தல் அல்லது ஒன்றுசேர்த்தல் என்று பொருள்படும். கூடாரத் தயாரிப்பு சூழலில் இணைக்கும் முறையைத் தேவையின்றி குறிப்பாக்காமல், திரைச்சீலைகள் ஒவ்வொரு தொகுதியாக இணைக்கப்பட்டதை இது இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַיְרִיעֹת
  choice: திரைச்சீலைகள்
  rationale: கூடார அமைப்புச் சூழலில் יְרִיעָה என்பது பெரிய துணித் திரைகளைக் குறிக்கிறது. நவீனத் தமிழில் ‘திரைச்சீலைகள்’ தெளிவானதும் சூழலுக்கேற்றதுமாகும்.
- source_word: לְבָד
  choice: தனியாக
  rationale: לְבָד தனித்திருத்தல் அல்லது தனித் தொகுதியாக இருப்பதைக் குறிக்கிறது. ஐந்தும் ஒரு தொகுதியாகவும் ஆறும் வேறொரு தொகுதியாகவும் இணைக்கப்பட்டன என்ற பொருளை இது பாதுகாக்கிறது.
- source_word: חֲמֵשׁ
  choice: ஐந்து
  rationale: நேரடியான எண்ணுப் பெயர்.
- source_word: שֵׁשׁ
  choice: ஆறு
  rationale: நேரடியான எண்ணுப் பெயர்.
- source_word: אֶת ... וְאֶת
  choice: இரண்டு இணைநிலை செயப்படுபொருள் தொடர்களாக வடிவமைத்தல்
  rationale: மீண்டும் வரும் நேரடிச் செயப்படுபொருள் குறியீடுகள், ஐந்து திரைச்சீலைகளையும் ஆறு திரைச்சீலைகளையும் தனித்தனி இணைநிலைத் தொகுதிகளாக அமைக்கின்றன. தமிழில் இரு தொடர்களிலும் ‘திரைச்சீலைகளை’ என்று வெளிப்படையாகக் கூறுவது இதைப் பாதுகாக்கிறது.
