  text: And he made two boards for the corners of the tabernacle at the rear[a].
translation:
  language: ta
  text: திருவாசஸ்தலத்தின் பின்புற மூலைகளுக்காக மேலும் இரண்டு பலகைகளைச் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திருவாசஸ்தலத்தின் மூலைப் பகுதிகளுக்காக, பின்புறத்தின் இரு ஓரங்களில்.’ எபிரெயச் சொற்கள் கட்டமைப்பின் பின்புற ஓரங்கள் அல்லது மூலைகளைக் குறிக்கின்றன; அவை மூலை அமைந்த இடத்தையோ, அங்கு சிறப்பாக இணைக்கப்பட்ட மூலைப் பலகைகளையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: இரண்டு ... -யும்
  rationale: இணைப்புச் சொல்லும் ‘இரண்டு’ என்ற எண்ணிக்கையும் கட்டுமானப் பட்டியலின் தொடர்ச்சியைக் காட்டுகின்றன; தமிழில் ‘-யும்’ இயல்பாக அந்தத் தொடர்பைப் பேணுகிறது.
- source_word: קְרָשִׁים
  choice: பலகைகள்
  rationale: திருவாசஸ்தலக் கட்டுமானச் சூழலில் இச்சொல் கட்டமைப்புக்குரிய மரப் பலகைகளைக் குறிக்கிறது.
- source_word: עָשָׂה
  choice: செய்தார்
  rationale: עשה என்பதன் நேரான, இயல்பான பொருள் ‘செய்தார்’; கட்டுமான விவரிப்புக்கும் இது பொருந்துகிறது.
- source_word: לִ/מְקֻצְעֹת
  choice: மூலைகளுக்காக
  rationale: இச்சொல் மூலை இடங்களையோ அவற்றில் இணைக்கப்பட்ட சிறப்புப் பலகைகளையோ குறிக்கலாம்; முதன்மை உரை இடத்தைக் குறிக்கும் இயல்பான வாசிப்பைத் தருகிறது.
- source_word: הַ/מִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: மִשְׁכָּן என்பதன் ‘வாசஸ்தலம்’ என்ற அடிப்படைப் பொருளையும், யாத்திராகமத்தில் உள்ள புனிதக் கூடாரத்தையும் தமிழில் மரியாதையுடன் குறிக்கும் நிலையான சொல்.
- source_word: בַּ/יַּרְכָתָיִם
  choice: பின்புற
  rationale: இருமை வடிவம் கட்டமைப்பின் பின்புற இரு ஓரங்கள் அல்லது பக்கங்களைக் குறிக்கிறது; அருகிலுள்ள ‘மூலைகள்’ என்பதுடன் சேர்த்து ‘பின்புற மூலைகள்’ என இயல்பாக வழங்கப்படுகிறது.
