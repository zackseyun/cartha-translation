translation_notes:
  register: நவீனத் தரத்தமிழில், கட்டுமானச் சூழல் சாதாரண வாசகருக்குப் புரியுமாறு வழங்கப்பட்டது. ‘பொருத்து நீட்சிகள்’ என்பது தொழில்நுட்பச் சொல்லை மட்டும் பயன்படுத்தாமல் செயல்பாட்டைத் தெளிவாக்குகிறது. எபிரெய வாக்கியத்தின் சுருக்கமான தொடக்கம் தமிழில் இயல்பாக அமைய ‘இருந்தன’ சேர்க்கப்பட்டது; பின்னர் வரும் செயற்பாட்டு வாக்கியம் தனியே வைக்கப்பட்டது.
