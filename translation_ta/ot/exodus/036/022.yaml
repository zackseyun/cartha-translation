  text: שְׁתֵּ֣י יָדֹ֗ת לַ/קֶּ֨רֶשׁ֙ הָֽ/אֶחָ֔ד מְשֻׁלָּבֹ֔ת אַחַ֖ת אֶל אֶחָ֑ת כֵּ֣ן עָשָׂ֔ה לְ/כֹ֖ל קַרְשֵׁ֥י הַ/מִּשְׁכָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/022.yaml
  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
translation:
  language: ta
  text: ஒவ்வொரு பலகைக்கும் இரண்டு பொருத்து முனைகள்[a] இருந்தன; அவை ஒன்றுக்கொன்று பொருந்தியவையாக இருந்தன[b]. திருவாசஸ்தலத்தின் எல்லாப் பலகைகளையும் அவன் இவ்வாறே செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, ‘கைகள்’; இங்கே பலகையிலிருந்து நீண்டு, அதை அடிப்பகுதியில் பொருத்துவதற்கான இணைப்பு முனைகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒன்று மற்றொன்றுக்கு எதிராக’; இரு பொருத்து முனைகளின் ஒத்த சீரமைப்பை இது வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: இரண்டு பொருத்து நீட்சிகள்
  rationale: יָדֹת என்பதன் நேர்ப்பொருள் ‘கைகள்’; இக்கட்டுமானச் சூழலில் பலகையிலிருந்து நீண்டு, இணைப்பதற்குப் பயன்படும் பகுதிகளைக் குறிக்கிறது. தமிழில் எளிதில் புரியும்படி ‘பொருத்து நீட்சிகள்’ என வழங்கப்பட்டது.
- source_word: קֶרֶשׁ
  choice: பலகை
  rationale: திருவாசஸ்தலத்தின் மரக் கட்டமைப்பில் பயன்படுத்தப்பட்ட தனித்தனி உறுப்பைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: מְשֻׁלָּבֹת
  choice: பொருந்துமாறு அமைந்திருந்தன
  rationale: இரு நீட்சிகளும் ஒன்றுக்கொன்று ஒத்த அமைப்பில் இணைவதற்கேற்றவாறு இருந்ததைக் காட்டுகிறது; ‘பின்னிப் பிணைந்தன’ என மிகைப்படுத்தாமல் கட்டுமானப் பொருளைத் தருகிறது.
- source_word: אַחַת אֶל אֶחָת
  choice: ஒன்றுக்கொன்று
  rationale: இரு நீட்சிகளுக்கிடையிலான பரஸ்பரப் பொருத்தத்தைக் காக்கிறது; அவை நேரெதிராக இருந்தனவா என்ற இடவமைப்பை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: כֵּן עָשָׂה
  choice: அவன் இவ்வாறே செய்தான்
  rationale: செயலின் முறையையும், எல்லாப் பலகைகளுக்கும் அதே முறையைப் பின்பற்றியதையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: தேவன் தம் மக்களிடையே வாசம்பண்ணும் புனிதக் கூடாரக் கட்டமைப்பைக் குறிக்கும், கண்ணியமானதும் தமிழில் நிலைபெற்றதுமான சொல்.
