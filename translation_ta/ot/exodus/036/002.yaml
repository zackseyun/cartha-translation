base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: ta
  text: அப்போது மோசே பெசலெயேலையும் அகோலியாபையும், யாவே யாருடைய உள்ளத்தில் ஞானத்தை அருளியிருந்தாரோ அத்தகைய உள்ளத்தில் ஞானமுள்ள ஒவ்வொருவரையும், அந்த வேலையைச் செய்ய முன்வருமாறு உள்ளம் தூண்டிய ஒவ்வொருவரையும் அழைத்தார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், ‘உள்ளத்தில் ஞானமுள்ளவர்.’ இது ஞானமும், இச்சூழலில் குறிப்பாகக் கைவினைத் திறமையும் பெற்றவரைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: ‘உள்ளம் தூண்டிய’ என்பதை ‘உள்ளம் முன்வரச் செய்த’ அல்லது சொல்லுக்குச் சொல்லாக ‘உள்ளம் உயர்த்திய’ என்றும் மொழிபெயர்க்கலாம். இம்மரபுத்தொடர் உள்ளார்ந்த விருப்பத்தையோ முனைப்பையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: அழைத்தார்
  rationale: இச்சூழலில் קרא + אֶל என்பது குறிப்பிட்ட பணிக்காக ஒருவரை அழைப்பதைக் குறிக்கிறது; ‘அழைத்தார்’ என்பது இயல்பான, கண்ணியமான தமிழ்.
- source_word: בְּצַלְאֵל / אָהֳלִיאָב
  choice: பெசலெயேல் / அகோலியாப்
  rationale: எபிரேயத் தனிப்பெயர்களின் ஒலிப்பைத் தமிழில் அறியப்பட்ட வடிவங்களுக்கு நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: உள்ளத்தில் ஞானமுள்ள ஒவ்வொருவரையும்
  rationale: ‘ஞானமுள்ள இதயம்’ என்ற எபிரேய மரபுத்தொடரின் உள்ளம் சார்ந்த உருவகத்தைத் தக்கவைக்கிறது; இச்சூழலில் அது கைவினைத் திறனையும் நடைமுறை ஞானத்தையும் உள்ளடக்குகிறது.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: யாவே யாருடைய உள்ளத்தில் ஞானத்தை வைத்திருந்தாரோ
  rationale: ஞானம் யாவேயால் அருளப்பட்டது என்ற கருத்தையும், ‘உள்ளத்தில் வைத்தார்’ என்ற மூலமொழி உருவகத்தையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, எபிரேய நான்கெழுத்துத் தெய்வீகப் பெயர்; அதனைத் தமிழில் ஒலிப்பெயர்த்து வழங்குகிறது.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: உள்ளம் தூண்டிய ஒவ்வொருவரையும்
  rationale: נשׂא + לב என்ற மரபுத்தொடர் உள்ளார்ந்த விருப்பம், முனைப்பு அல்லது தூண்டுதலைக் குறிக்கிறது; ‘உள்ளம் தூண்டிய’ என்பது அந்த உருவகத்தையும் பொருளையும் இயல்பாகத் தருகிறது.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה לַעֲשֹׂת אֹתָהּ
  choice: அந்த வேலையைச் செய்வதற்காக அதை அணுகிவரும்படி
  rationale: קרב என்பதன் ‘அணுகுதல்/அருகில் வருதல்’ என்ற இயக்கத்தையும், பணியைச் செய்ய வருவதுதான் நோக்கம் என்பதையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தெய்வீகப் பெயரையே நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிப்பெயர்த்துள்ளது.
- issue: ‘உள்ளத்தில் ஞானமுள்ளவர்’ என்பதன் பொருள்
  choice: மூலமொழியின் இதய/உள்ள உருவகத்தைத் தக்கவைத்தல்
  alternative: திறமைமிக்கவர்
  rationale: இச்சூழலில் கைவினைத் திறன் முக்கியமானதாயினும், சொற்றொடர் திறமையை மட்டும் அல்லாமல் கடவுள் அருளிய ஞானத்தையும் குறிக்கிறது; எனவே பொருளை ஒரு தொழில்நுட்பத் திறனாக மட்டும் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு விளங்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரேய வாக்கியத்தின் இணை அமைப்பை எண்ணக்கோடுகளால் தெளிவுபடுத்தி, ‘உள்ளம்’ என்ற மீளுருவகத்தையும் தெய்வீக ஞானத்துக்கும் மனித முனைப்புக்கும் இடையிலான பதற்றத்தையும் தக்கவைத்துள்ளது.
