- from: நீ என் மக்களுக்கு, உன்னோடு இருக்கும் ஏழைக்கு, பணம் கடனாகக் கொடுத்தால்,[a] அவனிடம் கடனைத் தண்டிக் கேட்பவனைப்போல் நடந்துகொள்ளாதே; அவன்மேல் வட்டி சுமத்தாதே.[b]
  to: நீ என் மக்களில் உன்னோடு இருக்கும் ஏழைக்குப் பணம் கடனாகக் கொடுத்தால்,[a] அவனிடம் கடனை அழுத்திக் கேட்பவனைப்போல் நடந்துகொள்ளாதே; அவன்மேல் வட்டி சுமத்தாதீர்கள்.[b]
  rationale: திருத்தம் மூல எபிரெயத்தின் இறுதி பன்மை முகவரியை “சுமத்தாதீர்கள்” எனக் காக்கிறது. ஏழை ‘என் மக்கள்’ குழுவினுள் இருப்பதைத் தமிழில் தெளிவாக்கி, கடன் அழுத்தி வசூலிக்கும் நுணுக்கத்தை இயல்பான சொற்றொடரால் வெளிப்படுத்துகிறது. நிபந்தனைத் தன்மை, பணம் என்ற பொருளாதாரப் பொருள், மற்றும் வட்டிக்கான தடை ஆகியவை மாற்றப்படவில்லை.
