source:
  edition: WLC
  text: אִם כֶּ֣סֶף תַּלְוֶ֣ה אֶת עַמִּ֗/י אֶת הֶֽ/עָנִי֙ עִמָּ֔/ךְ לֹא תִהְיֶ֥ה ל֖/וֹ כְּ/נֹשֶׁ֑ה לֹֽא תְשִׂימ֥וּ/ן עָלָ֖י/ו נֶֽשֶׁךְ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: ta
  text: நீ என் மக்களில் உன்னோடு இருக்கும் ஏழைக்குப் பணம் கடனாகக் கொடுத்தால்,[a] அவனிடம் கடனை அழுத்திக் கேட்பவனைப்போல் நடந்துகொள்ளாதே; அவன்மேல் வட்டி சுமத்தாதீர்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ என் மக்களில் உன்னோடு இருக்கும் ஏழைக்குப் பணம் கடனாகக் கொடுக்கும்போது.” எபிரெயச் சட்ட வழக்கில் நிபந்தனை வடிவம் இவ்வாறு பயன்படுத்தப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “வட்டி” என்பதற்கான எபிரெயச் சொல், கடனோடு சேர்த்து வசூலிக்கப்படும் தொகையைக் குறிக்கிறது; இங்கு அளவுக்கு மீறிய வட்டி மட்டுமே என்று பொருள் சுருக்கப்படவில்லை.
    reason: lexical_clarification
lexical_decisions:
- source_word: אִם
  choice: கொடுத்தால்
  rationale: எபிரெயச் சட்ட வழக்கில் இது ‘என்றால்/கொடுத்தால்’ என்ற நிபந்தனை வடிவம்; சில சூழல்களில் ‘கொடுக்கும்போது’ என்ற பொருளும் கொள்ளலாம். முதன்மை உரையில் மூல வடிவம் காக்கப்பட்டது.
- source_word: כֶּסֶף
  choice: பணம்
  rationale: சொல்லடியாக ‘வெள்ளி’ என்றாலும், இச்சட்ட மற்றும் பொருளாதாரச் சூழலில் பணத்தைக் குறிக்கிறது.
- source_word: תַּלְוֶה
  choice: கடனாகக் கொடுத்தால்
  rationale: லוה என்பதன் ஹிஃபில் வடிவம் இங்கு கடனாகக் கொடுப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு வழங்கப்பட்டது.
- source_word: עַמִּי
  choice: என் மக்களுக்கு
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டை நேரடியாகக் காக்கிறது; ‘இஸ்ரவேல்’ என்பதை வசனத்தில் சேர்க்கவில்லை.
- source_word: הֶעָנִי
  choice: ஏழைக்கு
  rationale: மூலத்தில் ஒருமை ஆண்பால் வடிவம் இருந்தாலும், தமிழில் ‘ஏழை’ என்பது பாலைக் கட்டாயமாகக் குறிப்பிடாமல் தனிநபரைக் குறிக்கும் இயல்பான பெயர்ச்சொல்.
- source_word: עִמָּךְ
  choice: உன்னோடு இருக்கும்
  rationale: சொல்லடியாக ‘உன்னுடன்’; சமூகத்துக்குள் அருகில் வாழும் ஏழையைக் குறிக்கும் உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּנֹשֶׁה
  choice: கடனைத் தண்டிக் கேட்பவனைப்போல்
  rationale: נשה என்ற பங்கேற்பு வடிவம் வெறும் கடன் கொடுத்தவரை மட்டுமல்ல, கடனை அழுத்தமாக வசூலிப்பவரையும் குறிக்கக்கூடும்; அந்த நுணுக்கம் காக்கப்பட்டது.
- source_word: תְשִׂימוּן ... נֶשֶׁךְ
  choice: வட்டி சுமத்தாதே
  rationale: ‘அவன்மேல் வட்டியை வைக்காதீர்கள்’ என்ற எபிரெய வழக்கை இயல்பான தமிழில் தருகிறது; נֶשֶׁךְ இங்கு கடனுக்கான வட்டி.
theological_decisions:
- issue: சட்டவழக்கில் אִם என்பதன் வலிமை
  choice: கொடுத்தால்
  alternative: கொடுக்கும்போது
  rationale: நிபந்தனை வடிவத்தை முதன்மை உரையில் காக்கிறது; வழக்குச் சட்டத்தில் ‘எப்போது’ என்ற பயன்பாட்டு வாய்ப்பை அடிக்குறிப்பு குறிப்பிடுகிறது.
- issue: כְּנֹשֶׁה என்பதன் பொருள்
  choice: கடனைத் தண்டிக் கேட்பவனைப்போல்
  alternative: கடன் கொடுத்தவனைப்போல்
  rationale: தடை சாதாரணக் கடன் உறவையே மறுப்பதில்லை; ஏழைக் கடனாளியை நெருக்கி வசூலிக்கும் நடத்தையைத் தடைசெய்வதாகச் சொல்லின் வலிமையை வெளிப்படுத்துகிறது.
- issue: הֶעָנִי என்பதன் பாலினக் குறிப்பு
  choice: ஏழைக்கு
  alternative: ஏழை ஆணுக்கு
  rationale: எபிரெய இலக்கண வடிவம் ஆண்பால் ஒருமை. ஆனால் நவீன தமிழில் ‘ஏழை’ தனிநபரைக் குறிக்கும் இயல்பான சொல்; ‘ஆண்’ என்று வெளிப்படையாகச் சேர்ப்பது மூலத்தில் உள்ளதைவிட பாலினத்தை வலியுறுத்தும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளையின் கண்ணியமான ஒருமை நடையில் மொழிபெயர்க்கப்பட்டது. ‘வெள்ளி’ என்பதற்குப் பதில் சூழலுக்கேற்ற ‘பணம்’ பயன்படுத்தப்பட்டது. வசனத்தில் முகவரி ஒருமை என்பதால் ‘நீ/உன்னோடு/நடந்துகொள்ளாதே’ என்ற ஒருமை தொடர்ச்சி காக்கப்பட்டது; இரண்டாம் கட்டளையில் எபிரெய வினை பன்மையாக இருந்தாலும், தமிழில் இயல்பான ஒருமை முகவரி தொடரப்பட்டது.
