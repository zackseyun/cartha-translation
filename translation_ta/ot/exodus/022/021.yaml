  text: כָּל אַלְמָנָ֥ה וְ/יָת֖וֹם לֹ֥א תְעַנּֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/021.yaml
  text: You shall not afflict any widow or orphan[a][b].
translation:
  language: ta
  text: விதவையையோ தந்தையற்ற பிள்ளையையோ[a] துன்புறுத்தாதீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அனாதையையோ.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒடுக்காதீர்கள்’ அல்லது ‘கொடுமைப்படுத்தாதீர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: …யையோ …யையோ
  rationale: ஒருமை பெயர்ச்சொற்களுடன் வரும் தடை வாக்கியத்தில் כָּל ஒவ்வொருவரையும் உள்ளடக்கும் பொருளுடையது. தமிழில் எதிர்மறைக் கட்டளையோடு இணைந்த ‘…யையோ …யையோ’ அமைப்பு, எந்த விதவையும் எந்தத் தந்தையற்ற பிள்ளையும் விதிவிலக்கல்ல என்ற விரிவை இயல்பாகத் தருகிறது.
- source_word: אַלְמָנָה
  choice: விதவை
  rationale: எபிரெயச் சொல்லின் வழக்கமான, நேரடியான பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: יָתוֹם
  choice: தந்தையற்ற பிள்ளை
  rationale: பண்டைய எபிரெயச் சட்டச் சூழலில் இச்சொல் குறிப்பாகத் தந்தையை இழந்த பிள்ளையைக் குறிக்கக்கூடும். ‘அனாதை’ என்பதைவிட இந்தத் தேர்வு மூலமொழியின் குறிப்பான நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: לֹא
  choice: …ஆதீர்கள்
  rationale: இரண்டாம் நபர் பன்மைக்குரிய தடை கட்டளையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְעַנּוּן
  choice: துன்புறுத்தாதீர்கள்
  rationale: Piel வடிவிலுள்ள ענה இங்கு ஒருவருக்குத் துன்பம் விளைவிப்பதையும் கடுமையாக நடத்துவதையும் குறிக்கிறது. ‘துன்புறுத்து’ என்பது பொருளை பொருளாதார ஒடுக்குதலாக மட்டும் குறுக்காமல் அதன் விரிவையும் தீவிரத்தையும் காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நேரடியான சட்டக் கட்டளையாக வடிவமைக்கப்பட்டது. இரண்டாம் நபர் பன்மை மரியாதை/கட்டளை வடிவம் காக்கப்பட்டுள்ளது; ‘தந்தையற்ற பிள்ளை’ மூலமொழியின் சமூக-சட்ட நுணுக்கத்தைத் தெளிவுபடுத்துகிறது.
