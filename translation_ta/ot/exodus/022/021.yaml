  source_fidelity: மூல எபிரெய வாக்கியத்தின் முழுமையான தடை, விதவை மற்றும் தந்தையற்ற பிள்ளை என்ற இரு பாதுகாப்பற்ற குழுக்கள், மேலும் Piel வினையின் துன்பம் விளைவித்தல்/கடுமையாக நடத்துதல் என்ற பரந்த பொருள் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘…யையோ …யையோ’ அமைப்பு כָּל-இன் விதிவிலக்கற்ற, பகிர்ந்தளிக்கும் வலிமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
  naturalness: ‘விதவையையோ தந்தையற்ற பிள்ளையையோ துன்புறுத்தாதீர்கள்’ என்பது நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான சட்டக் கட்டளை நடையாக உள்ளது. பன்மைத் தடை வடிவமும் சூழலுக்கு ஏற்றது.
  terminology: ‘விதவை’ நேரடியானதும் நிலையானதுமான சொல். ‘தந்தையற்ற பிள்ளை’ யָתוֹם என்பதன் சட்டச் சூழலிலான நுணுக்கத்தைச் சரியாகத் தருகிறது; மாற்றாக ‘அனாதை’ என்ற அடிக்குறிப்பு பயன்படத்தக்கது. ‘துன்புறுத்தாதீர்கள்’ ענה (Piel) என்பதன் பரந்த தீங்கிழைத்தல் பொருளைக் காக்கிறது; மாற்றுச் சொற்களுக்கான அடிக்குறிப்புகளும் பொருத்தமானவை.
