lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: சூனியம் செய்கிற பெண்
  rationale: எபிரெயச் சொல் பெண்பால் ஒருமையில் இருந்து, மந்திரம் அல்லது சூனியம் செய்கிற ஒரு பெண்ணைக் குறிப்பாகக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் பாலினக் குறிப்பைத் தக்கவைக்க இந்தச் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: לֹא
  choice: …விடாதே
  rationale: எதிர்மறைத் தடை, தொடரும் வினையுடன் இணைந்து தமிழில் இயல்பான தடை வடிவமாக வழங்கப்பட்டது.
- source_word: תְחַיֶּה
  choice: உயிரோடு இருக்கவிடாதே
  rationale: חיה என்பதன் பியேல் வடிவம் இங்கு ‘உயிருடன் வைத்திரு’ அல்லது ‘வாழவிடு’ என்ற காரண/விளைவு பொருளைக் கொண்டது. மூலத்தின் நேரடியான சட்டத் தடை வலிமையை இது காக்கிறது; ‘கொன்றுவிடு’ என்று மூலத்தில் இல்லாத செயன்முறையை வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: குற்றம் செய்பவரின் பாலினக் குறிப்பு
  choice: பெண்பால் ஒருமையைத் தக்கவைத்து, ‘சூனியம் செய்கிற பெண்’ என்று மொழிபெயர்த்தல்.
  alternative: ‘சூனியக்காரர்’ அல்லது ‘சூனியம் செய்பவர்’ என்று பாலினப் பொதுமைப்படுத்தல்.
  rationale: מְכַשֵּׁפָה என்பது வெளிப்படையாகப் பெண்பால் ஒருமை. ஆகவே மூலத்திலுள்ள குறிக்கப்பட்ட பாலினத்தை நடுநிலைப்படுத்தாமல் மொழிபெயர்ப்பு தக்கவைக்கிறது.
- issue: சட்டத் தடையின் வலிமை
  choice: ‘உயிரோடு இருக்கவிடாதே’ என்று மூலத்தின் வடிவத்தைப் பாதுகாத்தல்.
  alternative: ‘கொல்லப்பட வேண்டும்’ அல்லது ‘கொன்றுவிடு’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: சூழலில் மரணத் தண்டனை குறிக்கப்பட்டாலும், எபிரெய வாசகம் நேரடியாக ‘உயிருடன் வைத்திருக்காதே/வாழவிடாதே’ என்றே கூறுகிறது. தண்டனையின் செயன்முறையைச் சேர்க்காமல் அந்த இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான சட்டத் தடை நடையில் மொழிபெயர்க்கப்பட்டது. ‘சூனியம் செய்கிற பெண்’ என்பது தெளிவான இயல்புத் தமிழாக இருந்து, மூலத்தின் பெண்பால் ஒருமையையும் காக்கிறது; ‘உயிரோடு இருக்கவிடாதே’ என்பது இரண்டாம் நபர் ஒருமைத் தடை வடிவத்தைத் தக்கவைக்கிறது.
