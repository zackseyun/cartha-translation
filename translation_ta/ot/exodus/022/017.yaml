translation:
  language: ta
  text: சூனியம் செய்கிற பெண்ணை உயிரோடு இருக்கவிடாதே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சூனியக்காரியை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பெயர்ச்சொல் பெண்பால் ஒருமையில் இருந்து, சூனியம் செய்கிற ஒரு பெண்ணைக் குறிப்பாகக் குறிக்கிறது.
