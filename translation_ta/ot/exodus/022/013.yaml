base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: ta
  text: ஒருவன் தன் அயலானிடமிருந்து ஒன்றை இரவலாகப் பெற்று, அது சேதமடைந்தாலோ[a] அல்லது இறந்தாலோ, அதன் உரிமையாளர் அதனுடன் இல்லாவிட்டால், அவன் கண்டிப்பாக முழு இழப்பீடு செலுத்த வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “உடைந்தாலோ.” இரவலாகப் பெறப்பட்ட பொருளுக்கு நேரும் சேதத்தையோ, இரவலாகப் பெறப்பட்ட விலங்குக்கு நேரும் காயத்தையோ இந்த எபிரெயச் சொல் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “செலுத்தியே தீர வேண்டும்”; அதாவது, அவன் முழு இழப்பீடு செலுத்த வேண்டும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ஒருவன் … வாங்கி
  rationale: சட்டத் தொகுப்பில் அடுத்த நிபந்தனை வழக்கை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான நிபந்தனை வாக்கிய அமைப்பில் இதன் இணைப்புப் பொருள் வெளிப்படுகிறது.
- source_word: יִשְׁאַל
  choice: இரவலாக வாங்கி
  rationale: இச்சட்டச் சூழலில் இது கேட்பதை அல்ல, பிறரிடமிருந்து ஒரு பொருளையோ விலங்கையோ கடனாகப் பயன்படுத்தப் பெறுவதைக் குறிக்கிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெயத்தின் ஆண்பால் ஒருமைச் சட்ட வடிவத்தைச் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: מֵעִם רֵעֵהוּ
  choice: தன் அயலானிடமிருந்து
  rationale: רֵעַ என்பதன் நண்பன், தோழன், அயலான் ஆகிய பொருள்களில் உடன்படிக்கைச் சட்டச் சூழலுக்கு ‘அயலான்’ பொருத்தமானது.
- source_word: וְנִשְׁבַּר
  choice: சேதமடைந்தாலோ
  rationale: சொல்லுக்கு நேரடியாக ‘உடைந்தால்’ என்று பொருள்; ஆனால் இரவல் வாங்கப்பட்டது பொருளாகவோ விலங்காகவோ இருக்கக்கூடும் என்பதால் இரண்டையும் உள்ளடக்கும் ‘சேதமடைந்தால்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אוֹ מֵת
  choice: செத்துப்போனாலோ
  rationale: உயிருள்ள இரவல் விலங்கு இறப்பதை இயல்பான தமிழில் குறிக்கிறது; முந்தைய வினையுடன் மாற்று நிபந்தனையாக இணைகிறது.
- source_word: בְּעָלָיו
  choice: அதன் உரிமையாளர்
  rationale: வடிவில் பன்மைத் தோற்றமிருந்தாலும் இங்கு ஒருமை உரிமையாளரைக் குறிக்கும் எபிரெய மரபுச் சொல்லாக்கம்.
- source_word: אֵין עִמּוֹ
  choice: அதனுடன் இல்லாதபோது
  rationale: சுட்டுப்பெயர் இரவல் வாங்கப்பட்ட பொருள் அல்லது விலங்கைக் குறிக்கிறது; உரிமையாளர் அப்போது உடனிருந்தாரா என்பதே பொறுப்பை நிர்ணயிக்கிறது.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: கண்டிப்பாக முழு இழப்பீடு செலுத்த வேண்டும்
  rationale: முற்றுவினையுடன் வரும் infinitive absolute கடமையை வலியுறுத்துகிறது; ‘கண்டிப்பாக’ அந்த வலியுறுத்தலையும் ‘முழு இழப்பீடு’ சட்டரீதியான ஈட்டையும் வெளிப்படுத்துகிறது.
