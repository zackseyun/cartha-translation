translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை. பொருள் அல்லது விலங்கு என்ற இரு சாத்தியங்களையும் ‘ஒன்றை’ மற்றும் ‘சேதமடைந்தால்’ தக்கவைக்கின்றன; ‘செத்துப்போனால்’ உயிருள்ள விலங்கைக் குறிக்கும் மாற்று நிலையை இயல்பாக வெளிப்படுத்துகிறது.
