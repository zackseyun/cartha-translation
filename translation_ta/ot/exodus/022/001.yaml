  text: אִם בַּ/מַּחְתֶּ֛רֶת יִמָּצֵ֥א הַ/גַּנָּ֖ב וְ/הֻכָּ֣ה וָ/מֵ֑ת אֵ֥ין ל֖/וֹ דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: ta
  text: திருடன் உடைத்துப் புகும்போது[a] கண்டுபிடிக்கப்பட்டு, அடிக்கப்பட்டு இறந்தால், அவனை அடித்தவருக்கு இரத்தப்பழி இல்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல் முறையில், “திருடன் உடைத்துப் புகுதலின்போது கண்டுபிடிக்கப்பட்டால்.” எபிரெயச் சொல் பொதுவாகச் சுவரைத் தோண்டி அல்லது உடைத்து உள்ளே புகுவதையும், மறைவாக நுழைவதையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, திருடனை அடித்தவருக்கு இந்தச் சூழலில் சட்டரீதியான இரத்தப்பழி ஏற்படாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: உடைத்துப் புகும்போது
  rationale: இந்தப் பெயர்ச்சொல் சுவரைத் தோண்டியோ உடைத்தோ, அல்லது மறைவாகவோ உள்ளே புகும் செயலைக் குறிக்கிறது. தமிழில் சட்டச் சூழலை இயல்பாகத் தெரிவிக்க வினைச்சொல் வடிவில் மொழிபெயர்க்கப்பட்டது; ‘சுரங்கத்தில்’ என்பது தேவையற்ற அளவு குறிப்பானது.
- source_word: יִמָּצֵא
  choice: கண்டுபிடிக்கப்பட்டு
  rationale: நிஃபால் வடிவின் செயப்பாட்டு பொருளைத் தக்கவைத்து, நிபந்தனைச் சட்டத்தின் தொடரில் இயல்பாக அமைக்கிறது.
- source_word: הַגַּנָּב
  choice: திருடன்
  rationale: இது ‘திருடன்’ என்பதற்கான பொதுவான எபிரெயச் சொல். சூழல் உடைத்துப் புகுவதைக் குறிப்பிட்டாலும், இதனைத் தொழில்நுட்பமான வேறு சொல்லால் குறுக்க வேண்டியதில்லை.
- source_word: וְהֻכָּה
  choice: அடிக்கப்பட்டதால்
  rationale: נכה என்பதன் செயப்பாட்டு வடிவைத் தக்கவைக்கிறது. ‘அடித்துக் கொல்லப்பட்டால்’ என்று மொழிபெயர்ப்பது கொல்லும் நோக்கத்தை மூலத்தில் இல்லாமல் சேர்த்துவிடும்.
- source_word: וָמֵת
  choice: இறந்துபோனால்
  rationale: அடிக்கப்பட்டதன் விளைவாக மரணம் நேர்வதை நிபந்தனைத் தொடரில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵין לוֹ דָּמִים
  choice: அவனை அடித்தவருக்கு இரத்தப்பழி இல்லை
  rationale: דָּמִים இங்கு உடலிலுள்ள இரத்தத்தை அல்ல, இரத்தஞ்சிந்தியதற்கான சட்டப் பொறுப்பை அல்லது பழியைச் சுட்டுகிறது. ‘கொலைக்குற்றம் இல்லை’ என்பது நவீன குற்றவியல் வகைப்பாட்டை அளவுக்கு மீறி உட்புகுத்தும்; ‘இரத்தப்பழி இல்லை’ மூலத்தின் உடன்படிக்கைச் சட்டப் பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: உடைத்துப் புகும் திருடன் கொல்லப்படும் சூழலில் வழங்கப்படும் சட்டத் தீர்ப்பு
  choice: இந்தச் சூழலில் திருடனை அடித்தவர்மீது இரத்தப்பழி இல்லை என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர் கொலைக்குற்றவாளி அல்ல’ என்று நவீன குற்றவியல் மொழியில் கூறுதல்.
  rationale: எபிரெய உரை எல்லா வகையான கொல்லுதலுக்கும் பொதுவான ஒழுக்க அங்கீகாரம் வழங்காமல், இந்தக் குறிப்பிட்ட சூழலில் இரத்தப்பழி சுமத்தப்படாது என்ற சட்டத் தீர்ப்பையே கூறுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சட்ட உரைக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘இரத்தப்பழி’ என்ற வேதாகமச் சட்டச் சொல் விளக்கக் குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது; கொல்லும் நோக்கம் அல்லது நவீன குற்றவியல் வகைப்பாடு உரையில் சேர்க்கப்படவில்லை.
