base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/003.yaml
  text: If the stolen item is actually found alive in his possession—whether ox[a], donkey, or sheep—he shall repay double.
translation:
  language: ta
  text: திருடப்பட்ட எருதோ, கழுதையோ, ஆடோ உயிருடன் அவனிடம் உண்மையிலேயே கண்டுபிடிக்கப்பட்டால்[a], அவன் இருமடங்கு ஈடு செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “திருடப்பட்ட பொருள் அவன் கையில் நிச்சயமாகக் கண்டுபிடிக்கப்படுமானால்.” எபிரெயத்தில் வினையை வலியுறுத்தும் ஒரு அமைப்பு உள்ளது; “அவன் கையில்” என்பது அவனுடைய உடைமையில் அல்லது கட்டுப்பாட்டில் இருப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: -ஆல் / என்றால்
  rationale: எபிரெய வழக்குச் சட்டத்தின் நிபந்தனையைத் தமிழில் இயல்பாகக் காட்ட, வாக்கிய முடிவிலுள்ள நிபந்தனை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הִמָּצֵא תִמָּצֵא
  choice: உண்மையிலேயே கண்டுபிடிக்கப்பட்டால்
  rationale: முழுவினையெச்சமும் முற்றுவினையும் சேர்ந்த எபிரெய வலியுறுத்தலை, நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: בְיָדוֹ
  choice: அவனிடம்
  rationale: சொல்லர்த்தம் ‘அவனுடைய கையில்’ என்றாலும், இச்சட்டச் சூழலில் உடைமை அல்லது கட்டுப்பாட்டில் இருப்பதைக் குறிக்கும் இயல்பான தமிழ் வழக்கு ‘அவனிடம்’ ஆகும்.
- source_word: הַגְּנֵבָה
  choice: திருடப்பட்ட
  rationale: இது திருடும் செயலை அல்ல, திருடப்பட்ட பொருளைக் குறிக்கிறது; தொடர்ந்து விலங்குகள் பட்டியலிடப்படுவதால் தமிழில் பெயரெச்சமாக இயல்பாக இணைக்கப்பட்டது.
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: மாடோ, கழுதையோ, ஆடோ
  rationale: குறிப்பிடப்பட்ட கால்நடை வகைகளில் எதுவாக இருந்தாலும் என்ற பகிர்நிலைச் சட்டப் பொருளை ‘-ஓ’ அமைப்பு தெளிவாகக் காட்டுகிறது.
- source_word: חַיִּים
  choice: உயிருடன்
  rationale: திருடப்பட்ட விலங்கு கொல்லப்படாமல் உயிரோடு மீட்கப்பட்ட நிலையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: இருமடங்கு ஈடு செலுத்த வேண்டும்
  rationale: இரட்டிப்பான இழப்பீட்டைச் செலுத்த வேண்டும் என்ற சட்டக் கடமையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
