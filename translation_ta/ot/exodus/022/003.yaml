review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the conditional legal case, possession idiom, living status, and double restitution. However, its construction ‘உயிருடன் இருப்பது உண்மையிலேயே கண்டுபிடிக்கப்பட்டால்’ is syntactically strained and places the Hebrew emphasis less clearly than a direct passive finding construction.
  naturalness: A small recasting produces fluent modern standard Tamil while retaining a formal legal register.
  terminology: ‘எருது’ is more precise than the broad ‘மாடு’ for ‘ox.’ ‘ஆடு’ appropriately retains the broader small-livestock sense of שֶׂה rather than forcing a disputed sheep/goat distinction. ‘இருமடங்கு ஈடு செலுத்த வேண்டும்’ is suitable legal terminology.
  issues:
  - severity: medium
    issue: Awkward conditional syntax and emphasis placement
    rationale: ‘திருடப்பட்ட மாடோ... உயிருடன் இருப்பது உண்மையிலேயே கண்டுபிடிக்கப்பட்டால்’ is understandable but cumbersome. Recasting it as ‘...உயிருடன் அவனிடம் கண்டுபிடிக்கப்பட்டால்’ directly expresses the Hebrew legal condition and allows ‘உண்மையிலேயே’ to modify the finding.
  - severity: low
    issue: ‘மாடு’ is less specific than ‘ox’
    rationale: ‘மாடு’ can denote cattle generally, whereas ‘எருது’ is the conventional Tamil equivalent for an ox in this livestock list.
  revised_text: திருடப்பட்ட எருதோ, கழுதையோ, ஆடோ உயிருடன் அவனிடம் உண்மையிலேயே கண்டுபிடிக்கப்பட்டால்[a], அவன் இருமடங்கு ஈடு செலுத்த வேண்டும்.
