  text: אִם עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑/וֹ כִּ֣י אִם צָעֹ֤ק יִצְעַק֙ אֵלַ֔/י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: ta
  text: நீ அவனை உண்மையிலேயே துன்புறுத்தினால்[a], அவன் என்னிடம் உண்மையிலேயே கூக்குரலிட்டால்[b], அவனுடைய கூக்குரலை நான் நிச்சயமாகக் கேட்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “அவனை,” “அவனுடைய” என்ற ஆண்பால் ஒருமைச் சுட்டுப்பெயர்கள் உள்ளன. முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கைம்பெண் அல்லது தந்தையற்ற பிள்ளை ஆகியோரில் எந்த ஒரு தனிநபரையும் அவை இங்கே பொதுப்படையாகக் குறிக்கின்றன.
    reason: cultural_note
  - marker: b
    text: “துன்புறுத்து,” “கூக்குரலிடு,” “கேள்” ஆகிய எபிரெய வினைகள் ஒவ்வொன்றிலும் வலியுறுத்தும் எபிரெய வினையெச்ச வடிவம் ஒரு முற்றுவினையுடன் இணைந்துள்ளது; அதனால் “உண்மையிலேயே துன்புறுத்து,” “உண்மையிலேயே கூக்குரலிடு,” “நிச்சயமாகக் கேள்” என்ற வலிமை வெளிப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: என்றால் / -னால்
  rationale: இது நிபந்தனையை அறிமுகப்படுத்துகிறது; தமிழில் வினையுடன் இணையும் “-னால்” இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: עַנֵּה תְעַנֶּה
  choice: உண்மையிலேயே துன்புறுத்தினால்
  rationale: வினையெச்சப் பெயருருவும் முற்றுவினையும் மீண்டும் சேரும் எபிரெய அமைப்பு செயலை வலியுறுத்துகிறது. “உண்மையிலேயே” அந்த வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; “துன்புறுத்து” ענה என்பதன் பொருளைச் சூழலுக்கேற்ற தெளிவுடன் தருகிறது.
- source_word: אֹתוֹ
  choice: அவனை
  rationale: எபிரெயப் பின்னொட்டு ஆண்பால் ஒருமையில் உள்ளது. முந்தைய வசனத்தில் சொல்லப்பட்ட கைம்பெண் அல்லது தந்தையற்ற பிள்ளை ஆகியோரில் எந்த ஒரு தனிநபரையும் இது பொதுப்படையாகச் சுட்டுகிறது.
- source_word: כִּי אִם
  choice: அவன் ... என்றால்
  rationale: இங்கே இது எதிர்மறை மாறுபாட்டைக் காட்டாமல் அடுத்த நிபந்தனை நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் தனி இணைப்புச்சொல் இல்லாமலேயே தொடர்ச்சியான நிபந்தனை இயல்பாகத் தெளிவாகிறது.
- source_word: צָעֹק יִצְעַק
  choice: உண்மையிலேயே கதறினால்
  rationale: மீளுருவாக்கப்பட்ட எபிரெய வினை அமைப்பு கதறிக் கூப்பிடுதலை வலியுறுத்துகிறது. “கதறு” என்பது துயரத்திலிருந்து உதவி கோரி எழுப்பும் குரலை இயல்பாகக் குறிக்கிறது.
- source_word: אֵלַי
  choice: என்னை நோக்கி
  rationale: கதறல் தேவனை நோக்கி எழுப்பப்படுவதை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: நான் நிச்சயமாகக் கேட்பேன்
  rationale: எபிரெய வினை அமைப்பின் வலியுறுத்தலும் தேவனுடைய பதிலின் உறுதியும் “நிச்சயமாக” என்பதால் தெளிவாக வெளிப்படுகின்றன.
- source_word: צַעֲקָתוֹ
  choice: அவனுடைய கதறலை
  rationale: ஆண்பால் ஒருமைப் பின்னொட்டைப் பாதுகாக்கிறது; அதே வசனத்தில் வரும் צעק வேர்ச்சொல்லுடன் பொருள் தொடர்பையும் “கதறு / கதறல்” காக்கிறது.
theological_decisions:
- issue: துன்புறுத்தப்பட்ட நபரைக் குறிக்கும் ஆண்பால் ஒருமைச் சுட்டுப்பெயர்
  choice: அவனை / அவனுடைய
  alternative: அவர்களை / அவர்களுடைய
  rationale: மூல எபிரெயப் பின்னொட்டுகள் ஆண்பால் ஒருமையில் உள்ளன. முந்தைய வசனத்தில் கூறப்பட்ட எந்தக் கைம்பெண்ணையோ தந்தையற்ற பிள்ளையையோ தனித்தனியாக உள்ளடக்கும் பொதுப்படையான ஒருமையாக இது செயல்படுகிறது; எனவே மூல இலக்கண வடிவம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified சட்ட-எச்சரிக்கை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “உண்மையிலேயே” மற்றும் “நிச்சயமாக” என்பவை மூலத்தின் மும்மடங்கு வலியுறுத்தலைக் காக்கின்றன; ஒருமைச் சுட்டுப்பெயர்கள் மூல இலக்கணத்தையும் அதன் பொதுப்படையான பயன்பாட்டையும் பாதுகாக்கின்றன.
