base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: ta
  text: உன் மாட்டுக்கும் உன் ஆட்டு மந்தைக்கும் அவ்வாறே செய்.[b] அது ஏழு நாட்கள் தன் தாயோடு இருக்க வேண்டும்.[a] எட்டாம் நாளில் அதை எனக்குக் கொடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது தன் தாயோடு இருக்கும்.” எபிரெயில் சொற்சொல்லாக இவ்வாறே உள்ளது; சூழலில் இது ஏழு நாட்கள் தாயோடு தொடர்ந்து இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்தக் கட்டளை முந்தைய வசனத்தில் கூறப்பட்ட முதற்பேறானவற்றைக் கொடுப்பது பற்றிய கட்டளையைத் தொடர்கிறது; இவ்வசனத்தின் எபிரெய உரையில் “முதற்பேறு” என்ற சொல் மீண்டும் இடம்பெறவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן
  choice: அவ்வாறே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட கட்டளையுடன் இக்கட்டளையை இணைக்கும் ஒப்பீட்டுப் பொருளை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: תַּעֲשֶׂה
  choice: செய்
  rationale: சட்டக் கட்டளைக்குரிய நேரடியான வலிமையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְשֹׁרְךָ
  choice: உன் மாட்டுக்கும்
  rationale: שׁוֹר என்பது இங்கு பெரிய பண்ணைக் கால்நடையைக் குறிக்கும் பொதுவான சொல்; பாலினத்தைத் தேவையின்றிக் குறுக்காமல் ‘மாடு’ அதன் சட்டச் சூழலுக்கு ஏற்றது.
- source_word: לְצֹאנְךָ
  choice: உன் ஆட்டு மந்தைக்கும்
  rationale: צֹאן என்பது செம்மறியாடுகளும் வெள்ளாடுகளும் அடங்கக்கூடிய சிறுகால்நடைகளின் கூட்டுப்பெயர்; ‘ஆட்டு மந்தை’ இயல்பான தமிழில் அதன் கூட்டுப் பொருளைக் காக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: காலநீட்சியைக் குறிக்கும் எபிரெய அமைப்பை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יִהְיֶה עִם אִמּוֹ
  choice: அது தன் தாயோடு இருக்க வேண்டும்
  rationale: எபிரெயின் நேரடியான ‘தன் தாயோடு இருக்கும்’ என்ற வடிவத்தைப் பாதுகாக்கிறது; சூழலில் தொடர்ந்து தாயுடன் வைக்கப்படுவது இயல்பாகப் புரிகிறது.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: வழக்கமான காலக் குறிப்பைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: תִּתְּנוֹ לִי
  choice: அதை எனக்குக் கொடு
  rationale: נתן என்பதன் நேரடியான ‘கொடு’ என்ற பொருளையும், கால்நடையைக் குறிக்கும் ஒருமைச் சுட்டையும் பாதுகாக்கிறது.
theological_decisions:
- issue: கட்டளை முதற்பேறான கால்நடைகளைச் சுட்டுகிறதா என்பது
  choice: முந்தைய வசனத்தின் முதற்பேறு காணிக்கை பற்றிய கட்டளையின் தொடர்ச்சியாக வாசிக்க இடமளித்து, இவ்வசனத்தில் இல்லாத ‘முதற்பேறு’ என்ற சொல்லை மூல உரைக்குள் சேர்க்கவில்லை.
  alternative: தெளிவுக்காக ‘முதற்பேறான மாட்டுக்கும் ஆட்டு மந்தைக்கும்’ என்று விரிவாக மொழிபெயர்த்தல்.
  rationale: எபிரெய மூலத்தில் இவ்வசனத்தில் ‘முதற்பேறு’ மீண்டும் சொல்லப்படவில்லை; அது முந்தைய சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது. ஆகவே அடிக்குறிப்பு சூழல் தொடர்பை விளக்குகிறது, முதன்மை உரை மூலத்தின் சுருக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்குரிய நேரடியான ஒருமை ஏவல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாடு’ மற்றும் ‘ஆட்டு மந்தை’ ஆகியவை சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான கால்நடைச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன; தேவையற்ற பலியியல் விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
