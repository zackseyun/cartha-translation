translation_notes:
  register: நவீனத் தரத் தமிழில் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவன்’ என்பது சட்ட வழக்கில் குறிப்பிடப்பட்ட பாதுகாவலரைத் தொடர்கிறது. ‘காட்டு மிருகம்’ என்பது தாக்கிக் கிழிக்கும் விலங்கை இயல்பாகக் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
