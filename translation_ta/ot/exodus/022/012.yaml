  text: אִם טָרֹ֥ף יִטָּרֵ֖ף יְבִאֵ֣/הוּ עֵ֑ד הַ/טְּרֵפָ֖ה לֹ֥א יְשַׁלֵּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/012.yaml
  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: ta
  text: ஆனால் அது காட்டு விலங்கால் கிழிக்கப்பட்டிருந்தால்[a], அவன் அதைச் சான்றாகக் கொண்டுவர வேண்டும்; கிழிக்கப்பட்டதற்கு அவன் இழப்பீடு செலுத்த வேண்டியதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது உண்மையாகவே கிழிக்கப்பட்டிருந்தால், கிழிக்கப்பட்டதையே அவன் சான்றாகக் கொண்டுவர வேண்டும்; கிழிக்கப்பட்டதற்கு அவன் இழப்பீடு செலுத்த வேண்டியதில்லை.”
    reason: טָרֹף יִטָּרֵף என்ற எபிரெய வினை அமைப்பு வலியுறுத்தலைக் கொண்டது. ‘காட்டு விலங்கால்’ என்பது சூழலிலிருந்து இயல்பாகப் புரிந்துகொள்ளப்படும் பொருள்; மூலச் சொற்களில் அது வெளிப்படையாக இல்லை.
lexical_decisions:
- source_word: אִם
  choice: ஆனால் … இருந்தால்
  rationale: முந்தைய சட்டச் சூழலிலிருந்து வேறுபடும் நிபந்தனையை இயல்பான தமிழ் சட்டநடையில் அறிமுகப்படுத்துகிறது.
- source_word: טָרֹף יִטָּרֵף
  choice: காட்டு மிருகத்தால் கிழித்துக் கொல்லப்பட்டிருந்தால்
  rationale: எபிரெய வினை இச்சூழலில் ஒரு விலங்கு வேறொரு மிருகத்தால் தாக்கப்பட்டுக் கிழிக்கப்பட்டதைக் குறிக்கிறது. இறந்த விலங்கின் எச்சங்களைச் சான்றாகக் கொண்டுவரும் சட்டச் சூழலைத் தமிழில் தெளிவாகச் சொல்கிறது; மூலத்தின் வலியுறுத்தும் இரட்டை வடிவத்தைத் தனியே செயற்கையாக மொழிபெயர்க்காமல் பொருளில் தக்கவைக்கிறது.
- source_word: יְבִאֵהוּ
  choice: அவன் அதைக் கொண்டுவர வேண்டும்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கே ‘கொண்டுவருதல்/முன்வைத்தல்’ என்று பொருள்படுகிறது; ஆண்பால் ஒருமை பின்னொட்டு கிழிக்கப்பட்ட விலங்கு அல்லது அதன் எச்சங்களைக் குறிக்கிறது.
- source_word: עֵד
  choice: சான்றாக
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘சாட்சி’ என்றாலும், இங்கு கொண்டுவரப்படும் விலங்கின் எச்சங்கள் தடயச் சான்றாகச் செயல்படுவதால் ‘சான்றாக’ என்பது இயல்பான நீதிசார் தமிழ்.
- source_word: הַטְּרֵפָה
  choice: கிழித்துக் கொல்லப்பட்டதற்காக
  rationale: ‘கிழிக்கப்பட்டது’ அல்லது ‘இரையானது’ என்ற மூலத்தின் சுருக்கமான குறிப்பைத் தக்கவைத்து, பணம் செலுத்த வேண்டிய பொருளைச் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: לֹא יְשַׁלֵּם
  choice: இழப்பீடு செலுத்த வேண்டியதில்லை
  rationale: பியேல் வடிவிலுள்ள שלם உடன்படிக்கைச் சட்டங்களில் இழப்பை ஈடுசெய்வதைக் குறிக்கிறது; பொதுவான ‘செலுத்துதல்’ என்பதைவிட ‘இழப்பீடு செலுத்துதல்’ சட்டப் பொருளைத் தெளிவாக அளிக்கிறது.
