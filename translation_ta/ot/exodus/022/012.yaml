  to: ஆனால் அது காட்டு விலங்கால் கிழிக்கப்பட்டிருந்தால்[a], அவன் அதைச் சான்றாகக் கொண்டுவர வேண்டும்; கிழிக்கப்பட்டதற்கு அவன் இழப்பீடு செலுத்த வேண்டியதில்லை.
