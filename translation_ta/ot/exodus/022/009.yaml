translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் புரிந்துகொள்ளக்கூடிய மரியாதையான சட்ட நடையில் வடிவமைக்கப்பட்டது. வசனம் அடுத்த சட்டத் தீர்ப்புடன் தொடர்வதால் இறுதியில் முற்றுப்புள்ளிக்குப் பதிலாக காற்புள்ளி வைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் பட்டியல் அமைப்பும் சாட்சியின்மை குறித்த இறுதி நிபந்தனையும் காக்கப்பட்டுள்ளன.
