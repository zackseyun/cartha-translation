- source_word: שֶׂה
  choice: செம்மறியாடு
  rationale: மந்தையிலுள்ள ஒரு சிறிய கால்நடையைக் குறிக்கும் இச்சொல்லுக்கு சூழலில் இயல்பான குறிப்பிட்ட மொழிபெயர்ப்பு; வெள்ளாட்டையும் குறிக்கக்கூடிய பரந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
