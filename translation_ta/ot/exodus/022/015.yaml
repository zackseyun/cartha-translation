revisions:
- from: திருமண நிச்சயம் செய்யப்படாத ஒரு கன்னிப்பெண்ணை ஒருவன் மயக்கி, அவளோடு உடலுறவு கொண்டால், அவளைத் தன் மனைவியாக்கிக்கொள்ள அவன் மணமகள் விலையை நிச்சயமாகச் செலுத்த வேண்டும்.[a]
  to: திருமணத்திற்கு நிச்சயிக்கப்படாத ஒரு கன்னிப்பெண்ணை ஒருவன் கவர்ந்து, அவளோடு உடலுறவு கொண்டால், அவளைத் தன் மனைவியாக்கிக்கொள்ள அவன் மணமகள் விலையை[a] நிச்சயமாகச் செலுத்த வேண்டும்.
  rationale: The revision retains the legal and lexical force of the Hebrew while replacing a potentially misleading modern Tamil term for seduction, slightly improving the wording for formal betrothal, and placing the existing explanatory note at its proper lexical anchor.
