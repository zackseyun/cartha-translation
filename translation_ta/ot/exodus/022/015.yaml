base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: ta
  text: திருமணத்திற்கு நிச்சயிக்கப்படாத ஒரு கன்னிப்பெண்ணை ஒருவன் கவர்ந்து, அவளோடு உடலுறவு கொண்டால், அவளைத் தன் மனைவியாக்கிக்கொள்ள அவன் மணமகள் விலையை[a] நிச்சயமாகச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மணமகள் விலை” என்பது மணமகன் அல்லது அவன் குடும்பம் திருமணத்தையொட்டி செலுத்தும் தொகையைக் குறிக்கிறது; இது மணப்பெண் தரப்பிலிருந்து வழங்கப்படும் “வரதட்சணை” அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַתֶּה
  choice: மயக்கி
  rationale: பியேல் வடிவிலுள்ள இந்த வினை, இப்பாலியல் சூழலில் வற்புறுத்தலை வெளிப்படையாகக் குறிக்காமல் ஆசைகாட்டி இணங்கச் செய்வதைக் குறிக்கிறது. ‘மயக்கி’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெயச் சொல் ஒருமை ஆண்பாலில் இருந்து, இங்கு ஒரு ஆணைக் குறிக்கிறது.
- source_word: בְּתוּלָה
  choice: ஒரு கன்னிப்பெண்
  rationale: இந்தச் சட்ட மற்றும் திருமணச் சூழலில் இச்சொல் பாலுறவு கொள்ளாத பெண்ணைக் குறிக்கிறது; ‘கன்னிப்பெண்’ அந்த நிலையைக் குறிப்பாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: திருமண நிச்சயம் செய்யப்படாத
  rationale: இது திருமணத்துக்காக முறைப்படி நிச்சயிக்கப்படாத பெண்ணைக் குறிக்கிறது. ‘திருமண நிச்சயம்’ என்பது நவீனத் தமிழில் தெளிவாகவும் பண்பாட்டுச் சட்டநிலையைப் போதுமான அளவு துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: וְשָׁכַב עִמָּהּ
  choice: அவளோடு உடலுறவு கொண்டால்
  rationale: ‘அவளோடு படுத்தல்’ என்பது பாலுறவுக்கான எபிரெய மரபுத்தொடர். தமிழில் தவறாகப் புரியாதவாறு dignified-ஆக அதன் நோக்குப் பொருள் நேரடியாகத் தரப்பட்டுள்ளது.
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: மணமகள் விலையை நிச்சயமாகச் செலுத்த வேண்டும்
  rationale: முடிவிலி முழுவடிவமும் முற்றாவினையும் சேர்ந்த அமைப்பு கடமையை வலியுறுத்துகிறது. מֹהַר என்பது மணமகன் அல்லது அவன் குடும்பம் திருமணத்துடன் தொடர்பாகச் செலுத்தும் தொகை; ஆகவே ‘வரதட்சணை’ என்பதற்குப் பதில் ‘மணமகள் விலை’ துல்லியமானது.
- source_word: לּוֹ לְאִשָּׁה
  choice: அவளைத் தன் மனைவியாக்கிக்கொள்ள
  rationale: செலுத்தப்படும் மணமகள் விலையின் சட்டப்பூர்வ திருமண நோக்கை இச்சொற்றொடர் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: פתה விவரிக்கும் பாலியல் நிகழ்வின் தன்மை
  choice: வன்புணர்ச்சி என்று மொழிபெயர்க்காமல், மயக்கி இணங்கச் செய்தல்
  alternative: வற்புறுத்திப் பாலியல் வன்முறை செய்தல்
  rationale: פתה என்பதன் வழக்கமான பியேல் பொருள் ஆசைகாட்டுதல் அல்லது இணங்கச் செய்தல். இவ்வசனம் கூறாத பலவந்தத்தை மொழிபெயர்ப்பில் சேர்க்காமல், வேறு சட்டங்களில் கையாளப்படும் வலுக்கட்டாய பாலியல் தாக்குதலிலிருந்து உள்ள வேறுபாட்டைப் பாதுகாக்கிறது; அதேவேளை பெண்ணின் சம்மதத்தைப் பற்றிய நவீன சட்டக் கருத்துகளை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர் தமிழில் குழப்பமின்றி நேரடியாகத் தரப்பட்டுள்ளது. சட்டச் சூழலின் துல்லியத்திற்காக ‘திருமண நிச்சயம்’ மற்றும் ‘மணமகள் விலை’ பயன்படுத்தப்பட்டுள்ளன.
