base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: ta
  text: ஒருவன் ஒரு வயலையோ திராட்சைத்தோட்டத்தையோ மேயவிட்டு[a], தன் கால்நடையை விடுவித்து அது வேறொருவருடைய வயலில் மேய்ந்தால்[b], அவன் தன் வயலின் மிகச் சிறந்ததையும் தன் திராட்சைத்தோட்டத்தின் மிகச் சிறந்ததையும் கொண்டு இழப்பீடு கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவன் ஒரு வயலையோ திராட்சைத்தோட்டத்தையோ எரித்தால்.” எபிரெய வினைச்சொல் בער சில சூழல்களில் எரித்தலைக் குறிக்கலாம். ஆனால் உடனே கால்நடையை விடுவிப்பது குறிப்பிடப்படுவதால், இங்கு கால்நடை மேய்ந்து தின்னுவதைக் குறிக்கும் பொருளே வலுவாக ஆதரிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் எழுத்துப்படி, “வேறொரு வயலில்.” இந்தச் சட்டச் சூழலில் அது வேறொருவருக்குரிய வயல் என்பதால், “வேறொருவருடைய” என்று தெளிவுபடுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஒருவன் ... மேய்ந்தால்
  rationale: நிபந்தனைக்குரிய வழக்கை அறிமுகப்படுத்தும் சட்டநடையைத் தமிழில் இயல்பான ‘-ஆல்’ வடிவில் தருகிறது.
- source_word: יַבְעֶר
  choice: மேயவிட்டு
  rationale: ஹிஃபில் வினையின் காரணவினைப் பொருளைப் பேணுகிறது; அடுத்து கால்நடையை அவிழ்த்துவிடுவது கூறப்படுவதால், இங்கு எரித்தலைவிட கால்நடையால் மேயச்செய்வதே சூழலுக்குப் பொருந்துகிறது.
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: ஒரு வயலையோ திராட்சைத்தோட்டத்தையோ
  rationale: வேளாண்மைச் சொற்களையும் எபிரெய ஒருமை வழக்கு வடிவத்தையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: தன் கால்நடையை அவிழ்த்துவிடுவதால்
  rationale: שׁלח என்பதன் விடுவித்தல் பொருளையும், בְּעִיר என்பதன் மேயும் வளர்ப்பு விலங்கு என்ற பொதுப்பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: בְּעִירֹה
  choice: தன் கால்நடை
  rationale: ஒருமைச் சொல் பொதுவகையில் பயன்படுகிறது; நவீனத் தமிழில் ‘கால்நடை’ இச்சட்டச் சூழலுக்கு தெளிவான சொல்.
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: அது வேறொருவருடைய வயலில் மேய்ந்தால்
  rationale: மீண்டும் வரும் בער என்பதைக் கால்நடை மேய்ந்து சேதப்படுத்துதல் எனத் தொடர்ந்து மொழிபெயர்க்கிறது; אַחֵר என்பதில் சட்டச் சூழல் உணர்த்தும் பிறருக்குரிய உடைமையை வெளிப்படையாக்குகிறது.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: தன் வயலின் சிறந்த விளைச்சலிலிருந்தும் தன் திராட்சைத்தோட்டத்தின் சிறந்த விளைச்சலிலிருந்தும்
  rationale: מֵיטַב என்பதன் மிகச்சிறந்த பகுதி அல்லது விளைபொருள் என்ற கருத்தையும், இழப்பீடு குற்றம் செய்தவனின் சொத்திலிருந்து வர வேண்டும் என்பதையும் தெளிவாக்குகிறது.
- source_word: יְשַׁלֵּם
  choice: இழப்பீடு கொடுக்க வேண்டும்
  rationale: பியேல் வடிவிலுள்ள שׁלם இங்கு குறிக்கும் சட்டரீதியான ஈடுசெய்தலை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
