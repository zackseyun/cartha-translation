translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘மேயவிட்டு’ காரணவினையைப் பேணுகிறது; ‘இழப்பீடு கொடுக்க வேண்டும்’ என்பது ஈடுசெய்யும் சட்டக் கடமையை இயல்பாக வெளிப்படுத்துகிறது. மூலத்தின் சொற்பொருள் மாற்றுகளும் தெளிவாக்கப்பட்ட உடைமைப் பொருளும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
