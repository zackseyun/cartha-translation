  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: ta
  text: அந்நியரை[a] அநியாயமாக நடத்தாதீர்கள்; அவரை ஒடுக்காதீர்கள். ஏனெனில், எகிப்து நாட்டில் நீங்களும் அந்நியர்களாக இருந்தீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தங்கியிருக்கும் புறநாட்டவர்’ அல்லது ‘வெளிநாட்டுக் குடியிருப்பாளர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியிலுள்ள גֵר என்ற சொல், இஸ்ரவேலரிடையே வாழும் பூர்வகுடியல்லாத ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: அந்நியராகக் குடியிருப்பவர் / அந்நியர்கள்
  rationale: இந்த எபிரெயச் சொல் வெறுமனே வழிப்போக்கரைக் குறிக்காமல், இஸ்ரவேலரிடையே வாழும் பூர்வகுடியல்லாத ஒருவரைக் குறிக்கிறது. முதல் இடத்தில் ‘அந்நியராகக் குடியிருப்பவர்’ என்பது அந்த வாழ்விடச் சூழலைத் தெளிவாக்குகிறது; பின்னர் ‘அந்நியர்கள்’ என்பது அதே சொல்லின் மீளுரைப்பை இயல்பாகப் பேணுகிறது.
- source_word: תוֹנֶה
  choice: தவறாக நடத்தாதீர்கள்
  rationale: இச்சொல் அநியாயமான அல்லது கேடான நடத்தையைப் பரந்த பொருளில் குறிக்கிறது. பொருளாதாரச் சுரண்டலாக மட்டும் சுருக்காமல் அதன் பொதுவான வலிமையை இத்தேர்வு காக்கிறது.
- source_word: תִלְחָצֶנּוּ
  choice: அவரை ஒடுக்காதீர்கள்
  rationale: לחץ இங்கு கடுமையான அழுத்தத்தையும் ஒடுக்குதலையும் குறிக்கிறது. எபிரெய மூலத்தின் ஒருமைச் சுட்டை ‘அவரை’ இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் சட்டவிளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: הֱיִיתֶם
  choice: நீங்களும் ... இருந்தீர்கள்
  rationale: எகிப்தில் இஸ்ரவேலரின் கடந்தகால நிலையை நேரடியாகக் கூறுகிறது. ‘நீங்களும்’ என்பது கட்டளைக்குட்பட்டவர்களுக்கும் அந்நியருக்கும் இடையிலான அனுபவ ஒற்றுமையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டில்
  rationale: மூலத்தில் உள்ள ‘நாடு/தேசம்’ என்ற கூறைப் பேணியபடியே இயல்பான தமிழை வழங்குகிறது.
theological_decisions:
- issue: ஒருமை ஆண்பால் வடிவத்தின் பொதுப்பயன்பாடு
  choice: ‘அந்நியராகக் குடியிருப்பவரை ... அவரை’ என்ற ஒருமை வடிவத்தைப் பயன்படுத்துதல்
  alternative: பொதுப்பொருளுக்காக ‘அந்நியர்களை ... அவர்களை’ எனப் பன்மையாக்குதல் அல்லது ‘அந்நியனை ... அவனை’ என வெளிப்படையான ஆண்பால் வடிவம் பயன்படுத்துதல்
  rationale: எபிரெய சட்டநடை ஒருமை ஆண்பால் இலக்கண வடிவத்தைப் பொதுப்பொருளில் பயன்படுத்துகிறது. தமிழ் ‘அவர்’ வடிவம் எண்ணிக்கையின் ஒருமையைப் பேணுகிறது; அதேவேளை மூலத்தில் அவசியமாகக் கூறப்படாத உயிரியல் பாலைக் கடுமையாக முன்னிறுத்தாமல், மரியாதையான நவீன நடையை வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்கேற்ற நேரடியானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தவறாக நடத்துதல்’ மற்றும் ‘ஒடுக்குதல்’ என்ற இரு தனித்த செயல்களும் மூலத்தைப் போலவே தனித்தனியாக வைக்கப்பட்டுள்ளன; காரணத்தை அறிமுகப்படுத்தும் இரண்டாம் வாக்கியமும் தெளிவாகப் பிரிக்கப்பட்டுள்ளது.
