source:
  edition: WLC
  text: אֱלֹהִ֖ים לֹ֣א תְקַלֵּ֑ל וְ/נָשִׂ֥יא בְ/עַמְּ/ךָ֖ לֹ֥א תָאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: ta
  text: கடவுளை[a] இழிவாகப் பேசாதே; உன் மக்களிடையே உள்ள ஒரு தலைவனைச் சபிக்காதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிபதிகளை.” אֱלֹהִים என்ற எபிரெயச் சொல் சில சூழல்களில் மனித அதிகாரிகளைக் குறிக்கலாம்; ஆனால் இங்குள்ள இணை அமைப்புக்கு “கடவுள்” என்பதே சிறப்பாகப் பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு வரும் இணை அமைப்பில் அடுத்ததாக மனிதத் தலைவன் குறிப்பிடப்படுவதால், אֱלֹהִים என்பது கடவுளைக் குறிப்பதாக எடுத்துக்கொள்வது பொருத்தமானது. எனினும், இதை மனித நீதிபதிகளைக் குறிப்பதாகப் புரிந்துகொள்ளும் பழமையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תְקַלֵּל
  choice: இழிவாகப் பேசாதே
  rationale: קלל என்பதன் பியேல் வடிவம் சபித்தல் மட்டுமன்றி இகழ்தல், அவமதித்தல் என்ற பொருளையும் தருகிறது. இரண்டாம் அரையடியில் வரும் ארר என்பதிலிருந்து வேறுபாட்டைக் காக்க, இயல்பான தமிழில் ‘இழிவாகப் பேசாதே’ என வழங்கப்பட்டுள்ளது.
- source_word: נָשִׂיא
  choice: ஒரு தலைவன்
  rationale: נָשִׂיא என்பது மக்களிடையே உயர்ந்த அதிகாரம் வகிக்கும் தலைவர் அல்லது ஆளுநரைக் குறிக்கிறது. ‘தலைவன்’ என்பது குறிப்பிட்ட அரச பதவியைத் தேவையின்றி முன்வைக்காமல் மூலத்தின் விரிவான பொருளைக் காக்கிறது.
- source_word: בְעַמְּךָ
  choice: உன் மக்களிடையே உள்ள
  rationale: בְּ முன்னொட்டு இங்கு சமூகத்தின் நடுவில் அல்லது அதற்குள் அதிகாரம் வகிப்பதைக் காட்டுகிறது; ‘உன் மக்களிடையே உள்ள’ என்பது இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תָאֹר
  choice: சபிக்காதே
  rationale: ארר என்பது நேரடியாகச் சபிப்பதைக் குறிக்கும் வழக்கமான எபிரெயச் சொல். ‘சபிக்காதே’ அதன் பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் குறிப்பு
  choice: கடவுள்
  alternative: நீதிபதிகள்
  rationale: சட்டப் பின்னணியும், ‘உன் மக்களிடையே உள்ள ஒரு தலைவன்’ என்ற இணையான அடுத்த தடையும், முதற்சொல் கடவுளைக் குறிப்பதாகப் புரிந்துகொள்ள ஆதரிக்கின்றன. ஆயினும் אֱלֹהִים சில இடங்களில் மனித நீதித்துறை அதிகாரிகளைக் குறிக்கக்கூடும் என்பதால், அந்த உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதே நேரத்தில் சட்டக் கட்டளைக்குரிய கண்ணியமும் சுருக்கமும் நிலைக்கும்படி மொழிபெயர்க்கப்பட்டுள்ளது. இரு எபிரெய வினைச்சொற்களுக்கிடையிலான வேறுபாட்டைக் காக்க ‘இழிவாகப் பேசாதே’ மற்றும் ‘சபிக்காதே’ எனத் தனித்தனியாக வழங்கப்பட்டுள்ளது.
