  yaml_path: translation/ot/exodus/022/023.yaml
  text: then my anger will burn[a], and I will kill you with the sword[b], and your wives will become widows and your sons fatherless.
translation:
  language: ta
  text: அப்போது என் கோபம் பற்றியெரியும்; நான் உங்களை வாளால் கொல்வேன். உங்கள் மனைவிகள் விதவைகளாகிவிடுவார்கள்; உங்கள் மகன்கள் தந்தையற்றவர்களாகிவிடுவார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: என் கோபம் பற்றியெரியும்
  rationale: חרה אף என்பது கோபம் தீவிரமாக எழுவதைச் சுட்டும் எபிரேய மரபுத்தொடர். உடலுறுப்பைக் குறிக்கும் சொல்லை நேரடியாக மொழிபெயர்க்காமல், தீப்பற்றும் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: நான் உங்களை ... கொல்வேன்
  rationale: הרג என்பதன் நேரடியான, நவீனத் தமிழுக்கு ஏற்ற பொருள் ‘கொல்’; இரண்டாம் நபர் ஆண்பால் பன்மை விகுதி தமிழில் இயல்பாக ‘உங்களை’ என்று வருகிறது.
- source_word: בֶּחָרֶב
  choice: வாளால்
  rationale: ב இங்கு கருவி அல்லது வழிமுறையைக் குறிக்கிறது; ‘வாளால்’ என்பது சுருக்கமானதும் இயல்பானதும் ஆகும்.
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: உங்கள் மனைவிகள் விதவைகளாவார்கள்
  rationale: היה இங்கு தீர்ப்பின் விளைவாக ஏற்படும் புதிய நிலையைச் சுட்டுவதால் ‘ஆவார்கள்’ என மொழிபெயர்க்கப்பட்டது; குடும்பச் சூழலில் נשים என்பது ‘மனைவிகள்’ எனப் பொருள்படும்.
- source_word: וּבְנֵיכֶם יְתֹמִים
  choice: உங்கள் மகன்கள் தந்தையற்றவர்களாவார்கள்
  rationale: בנים என்பதன் ஆண்பால் குறிப்பை ‘மகன்கள்’ எனத் தக்கவைக்கிறது. יתום இச்சூழலில் தந்தையை இழந்த சமூக நிலையைக் குறிப்பாகச் சுட்டுவதால், பொதுவான ‘அனாதைகள்’ என்பதற்குப் பதில் ‘தந்தையற்றவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: தெய்வீகக் கோபத்தை மனித உடலுறுப்பு சார்ந்த உருவகத்தில் கூறுதல்
  choice: என் கோபம் பற்றியெரியும்
  alternative: என் மூக்கு எரியும் / என் கடுங்கோபம் மூளும்
  rationale: மூலத்தின் மனிதப் பண்பேற்ற மரபுத்தொடரைச் சொற்சொல்லாக மாற்றினால் தமிழில் பொருள் மறையும். ‘கோபம் பற்றியெரியும்’ என்பது அர்த்தத்தையும் தீ உருவகத்தையும் காக்கிறது.
- issue: பிள்ளைகளைக் குறிக்கும் பாலினத் தனித்தன்மை
  choice: உங்கள் மகன்கள்
  alternative: உங்கள் பிள்ளைகள்
  rationale: மூலத்தில் בנים என்ற ஆண்பால் சொல் இருப்பதால், சூழல் அதை பொதுப்படுத்த வேண்டிய கட்டாயம் தராத நிலையில் ‘மகன்கள்’ எனத் துல்லியமாக வைக்கப்பட்டது.
- issue: יְתֹמִים குறிக்கும் இழப்பு நிலை
  choice: தந்தையற்றவர்களாவார்கள்
  alternative: அனாதைகளாவார்கள்
  rationale: ஆண்கள் கொல்லப்படுவதன் நேரடி விளைவை வசனம் கூறுவதால், தாய் தந்தை இருவரையும் இழந்ததாகப் புரிந்துகொள்ளக்கூடிய ‘அனாதைகள்’ என்பதைவிட ‘தந்தையற்றவர்கள்’ மூலத்தின் சமூக மற்றும் குடும்பச் சூழலைத் துல்லியமாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை. எபிரேய வாக்கியத்தின் காரணவிளைவு வரிசை காக்கப்பட்டுள்ளது; தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
