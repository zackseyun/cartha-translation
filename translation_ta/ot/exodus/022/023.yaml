  source_fidelity: 'The draft accurately renders the Hebrew sequence and content: divine anger flaring, death by the sword, wives becoming widows, and sons becoming fatherless. It appropriately retains the masculine plural reference as “மகன்கள்” and conveys יְתֹמִים as fatherless rather than broadening it to “orphans.”'
