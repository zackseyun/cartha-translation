  terminology: “கோபம் பற்றியெரியும்,” “வாளால்,” “மனைவிகள்,” “விதவைகள்,” “மகன்கள்,” and “தந்தையற்றவர்கள்” are accurate and consistent with the source and an optimal-equivalence register.
  issues:
