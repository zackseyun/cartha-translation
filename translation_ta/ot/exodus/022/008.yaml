revisions:
- from: மீறுதல் சம்பந்தமான ஒவ்வொரு வழக்கிலும்—அது மாடாக இருந்தாலும், கழுதையாக இருந்தாலும், ஆடாக[a] இருந்தாலும், உடையாக இருந்தாலும், காணாமற்போன வேறு எந்தப் பொருளாக இருந்தாலும்—அதைப் பற்றி ஒருவர், ‘இதுதான் அது’ என்று சொன்னால், இரு தரப்பினரின் வழக்கும் கடவுளின் முன்னிலையில்[b] கொண்டுவரப்பட வேண்டும். கடவுள் யாரைக் குற்றவாளி என்று தீர்ப்பளிக்கிறாரோ, அவர் தன் அயலாருக்கு இரட்டிப்பாகச் செலுத்த வேண்டும்.
