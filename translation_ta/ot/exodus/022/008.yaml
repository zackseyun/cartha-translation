base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: ta
  text: மீறுதல் சம்பந்தமான ஒவ்வொரு வழக்கிலும்—அது எருதாக இருந்தாலும், கழுதையாக இருந்தாலும், ஆடாக[a] இருந்தாலும், உடையாக இருந்தாலும், காணாமற்போன வேறு எந்தப் பொருளாக இருந்தாலும்—அதைப் பற்றி ஒருவர், ‘இதுதான் அந்தப் பொருள்’ என்று சொன்னால், இரு தரப்பினரின் வழக்கும் கடவுளின் முன் வர வேண்டும்[b]. கடவுள் யாரைக் குற்றவாளி என்று தீர்ப்பளிக்கிறாரோ, அந்த நபர் தன் அயலாருக்கு இரட்டிப்பாகச் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல் சிறு கால்நடையைக் குறிக்கும்; அது செம்மறியாடாகவோ வெள்ளாடாகவோ இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நீதிபதிகளின் முன்னிலையில்” அல்லது “நீதிமன்றத்தின் முன்” என்றும் மொழிபெயர்க்கலாம். எபிரேய אֱלֹהִים என்பது நேரடியாகக் கடவுளைக் குறிக்கலாம்; சட்டச் சூழலில் தெய்வீக அதிகாரத்தின்கீழ் செயல்படும் மனித நீதிபதிகளையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: மீறுதல் சம்பந்தமான ... வழக்கு
  rationale: דָּבָר என்பது இங்கு சட்ட வழக்கைக் குறிக்கிறது; פֶּשַׁע தவறு அல்லது மீறுதலைக் குறிக்கிறது. குற்றத்தின் தன்மையைத் தேவையின்றி மிகத் துல்லியமாக்காமல் சட்டச் சூழலை இது வெளிப்படுத்துகிறது.
- source_word: שׁוֹר
  choice: மாடு
  rationale: சொத்து தொடர்பான பட்டியலில் வரும் கால்நடையை இயல்பான நவீன தமிழில் ‘மாடு’ எனத் தருவது தெளிவாக உள்ளது; ‘எருது’ என்று பாலினம் அல்லது பயன்பாட்டை மிகக் குறுக்காக வரையறுக்கவில்லை.
- source_word: חֲמוֹר
  choice: கழுதை
  rationale: எபிரெயச் சொல்லின் நேரான, பொதுவாகப் புரியும் தமிழ் இணைச்சொல்.
- source_word: שֶׂה
  choice: ஆடு
  rationale: שֶׂה என்பது செம்மறியாட்டையோ வெள்ளாட்டையோ குறிக்கக்கூடிய சிறு கால்நடைப் பெயர். தமிழ் ‘ஆடு’ பொதுவாக இயல்பாக இருந்தாலும், மூலத்தின் விரிவை அடிக்குறிப்பு காக்கிறது.
- source_word: שַׂלְמָה
  choice: உடை
  rationale: ஒரு குறிப்பிட்ட மேலங்கியை மட்டும் குறிக்காமல் பொதுவான ஆடைப்பொருளைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: אֲבֵדָה
  choice: காணாமற்போன வேறு எந்தப் பொருள்
  rationale: இழந்த அல்லது தொலைந்த சொத்தை விரிவாகக் குறிக்கும் பெயர்ச்சொல்லை வாசிக்க எளிதான தமிழில் தருகிறது.
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: அதைப் பற்றி ஒருவர், ‘இதுதான் அது’ என்று சொன்னால்
  rationale: சர்ச்சைக்குரிய பொருளை அடையாளம் காட்டும் கூற்றாக இருக்கக்கூடிய மூலத்தின் சுட்டுப்பொருளை விளக்கிச் சேர்க்காமல் காக்கிறது.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: கடவுள்
  rationale: சொல்லின் நேரான பொருள் ‘கடவுள்’; சட்டச் சூழலில் ‘நீதிபதிகள்’ அல்லது ‘நீதிமன்றம்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: இரு தரப்பினரின் வழக்கும் ... கொண்டுவரப்பட வேண்டும்
  rationale: இருவருடைய சட்ட விவகாரம் முன்வைக்கப்படுவதை இயல்பான தமிழ் சட்ட நடையில் தெரிவிக்கிறது.
- source_word: יַרְשִׁיעֻן
  choice: குற்றவாளி என்று தீர்ப்பளிக்கிறார்
  rationale: ரשע என்பதன் ஹிப்இல் வடிவம் நீதிமுறை ரீதியாக ஒருவரைக் குற்றவாளி என அறிவிப்பதைக் குறிக்கிறது.
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: இரட்டிப்பாகச் செலுத்த வேண்டும்
  rationale: இருமடங்கு ஈடு செலுத்துதல் என்ற எபிரெய மரபுத்தொடரின் பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: לְרֵעֵהוּ
  choice: தன் அயலாருக்கு
  rationale: רֵעַ என்பதன் வழக்கமான பொருள் அயலார் அல்லது சகமனிதர்; இச்சட்டச் சூழலில் அது மறுதரப்பினரைக் குறிக்கிறது.
theological_decisions:
- issue: சட்டச் சூழலில் אֱלֹהִים என்பதன் பொருள்
  choice: கடவுள்
  alternative: நீதிபதிகள் / நீதிமன்றம்
  rationale: எபிரெய வடிவம் நேரடியாக ‘கடவுள்’ என்று பொருள்படும்; எனினும் உடன்படிக்கைச் சட்டங்களில் கடவுளின் அதிகாரத்தின்கீழ் செயல்படும் மனித நீதிபதிகளையும் குறிக்கலாம். இந்த உண்மையான தெளிவின்மையைத் தீர்த்துவிடாமல், முதன்மை உரையில் ‘கடவுள்’ என்றும் அடிக்குறிப்பில் சட்ட அமைப்பு சார்ந்த மாற்றுப் பொருளையும் தருகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதுதான் அது’ என்ற சுருக்கமான சுட்டுக்கூற்று மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது; אֱלֹהִים பற்றிய சட்ட/இறையியல் இருபொருள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
