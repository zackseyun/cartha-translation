base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: ta
  text: நீங்கள் எனக்குப் பரிசுத்தமான மனிதர்களாக இருக்க வேண்டும்.[a] வயல்வெளியில் கிழிக்கப்பட்ட இறைச்சியைச் சாப்பிடக் கூடாது;[b] அதை நாய்க்கு எறிந்துவிடுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படியாக, “பரிசுத்தத்தின் மனிதர்கள்.” இது உடன்படிக்கைச் சமூகத்தைப் பிரதிநிதித்துவமாகக் குறிக்கலாம்; மூலத்தில் மனிதர்களைக் குறிக்கும் ஆண்பால் பன்மை வடிவம் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, மிருகங்களால் வயல்வெளியில் கிழிக்கப்பட்ட இறைச்சி எனப் பொருள்படலாம். எபிரெயம் “இறைச்சி ... கிழிக்கப்பட்டது” என்று மட்டுமே கூறுகிறது; கிழித்தது எது என்பது வெளிப்படையாகச் சொல்லப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: பரிசுத்தமான மனிதர்கள்
  rationale: எபிரெயக் கட்டமைப்பு சொற்படியாக ‘பரிசுத்தத்தின் மனிதர்கள்’ என்று பொருள்படும். ‘பரிசுத்தமான மனிதர்கள்’ என்பது மனிதர்களைக் குறிக்கும் மூலச்சொல்லைத் தக்கவைத்தபடியே நவீனத் தமிழில் இயல்பாக உள்ளது; ‘பரிசுத்தமான மக்கள்’ என்பதும் பொருள்சார் மாற்றாக இருக்கலாம்.
- source_word: תִּהְיוּן לִי
  choice: நீங்கள் எனக்குப் ... இருக்க வேண்டும்
  rationale: לִי என்பதன் ‘எனக்கு/எனக்கென’ என்ற உறவுசார் வலிமையையும், சட்டச் சூழலில் வினை வெளிப்படுத்தும் கடமையையும் இந்த வடிவம் காக்கிறது.
- source_word: בָשָׂר
  choice: இறைச்சி
  rationale: ‘சதை’ என்பது சொற்படியான மாற்றாக இருந்தாலும், உணவாக உண்ணப்படும் விலங்கின் உடலைக் குறிக்கும் இச்சூழலில் ‘இறைச்சி’ தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: בַּשָּׂדֶה
  choice: வயல்வெளியில்
  rationale: שָׂדֶה குறிக்கும் திறந்த வெளி அல்லது வயல்வெளி என்ற இடப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: טְרֵפָה
  choice: கிழிக்கப்பட்ட
  rationale: இந்தச் சொல், குறிப்பாக விலங்கால் கிழிக்கப்பட்ட இரையைக் குறிக்கலாம். எனினும் கிழித்தது எது என்பதை எபிரெயச் சொற்றொடர் வெளிப்படையாகக் கூறாததால், முதன்மை உரையில் செய்பவர் சேர்க்கப்படவில்லை.
- source_word: לֹא תֹאכֵלוּ
  choice: சாப்பிடக் கூடாது
  rationale: சட்டப்பூர்வமான தடையை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לַכֶּלֶב
  choice: நாய்க்கு
  rationale: மூலத்தில் உள்ள ஒருமை வடிவத்தைத் தக்கவைக்கிறது; இங்கு அது பொதுவகையில் நாயைக் குறிக்கிறது.
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: அதை ... எறிந்துவிடுங்கள்
  rationale: ‘அதை எறியுங்கள்’ என்ற கட்டளையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘விடு’ துணைவினை அகற்றிப் போடுதலின் நிறைவைக் காட்டுகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் பரிசுத்த நிலை
  choice: ‘நீங்கள் எனக்குப் பரிசுத்தமான மனிதர்களாக இருக்க வேண்டும்’ என்று மொழிபெயர்த்து, கடவுளுடனான உறவையும் பரிசுத்த வாழ்வுக்கான கடமையையும் இணைத்துக் காட்டுதல்
  alternative: ‘நீங்கள் எனக்குப் பரிசுத்தமான மக்களாக இருக்க வேண்டும்’
  rationale: קֹדֶשׁ என்பதன் நேரடியான இறையியல் வலிமையை ‘பரிசுத்தமான’ காக்கிறது. ‘மனிதர்கள்’ என்பது மூலத்தில் உள்ள אַנְשֵׁי என்ற மனிதரைக் குறிக்கும் பெயர்ச்சொல்லை வெளிப்படுத்துகிறது; இருப்பினும் அது உடன்படிக்கைச் சமூகத்தைப் பிரதிநிதித்துவமாகக் குறிக்கிறதா என்ற சாத்தியத்தை அடிக்குறிப்பு திறந்துவைக்கிறது.
- issue: கிழிக்கப்பட்ட இறைச்சியின் காரணிப்பவர்
  choice: முதன்மை உரையில் கிழித்த விலங்கைச் சேர்க்காமல் விடுதல்
  alternative: ‘காட்டு மிருகத்தால் கிழிக்கப்பட்ட இறைச்சி’
  rationale: טְרֵפָה என்பது மிருகத்தால் கிழிக்கப்பட்ட இரையை வழக்கமாகக் குறித்தாலும், இவ்வசனத்தின் சொற்றொடரில் காரணிப்பவர் தனியாகச் சொல்லப்படவில்லை. ஆகவே ஊகத்தை உரைக்குள் சேர்க்காமல், அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டநடையின் கண்ணியத்தையும் தெளிவையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பரிசுத்தமான’ என்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டாலும், மற்ற சொற்றொடர்கள் வழக்கமான நவீன நடையில் அமைக்கப்பட்டுள்ளன. மூலத்தின் தொடக்க וְ இணைப்புகள் தமிழில் கட்டாயமில்லாததால் தனியே மொழிபெயர்க்கப்படவில்லை.
