revisions:
- from: அந்த இருவருக்கும் இடையே யாவேயின் ஆணை இருக்க வேண்டும்[a]. தன் அயலானின் உடைமையில் தான் கை வைக்கவில்லை[b] என்று அவன் ஆணையிட வேண்டும். அதன் உரிமையாளர் அந்த ஆணையை ஏற்றுக்கொள்ள வேண்டும்[c]; அவன் இழப்பீடு செலுத்த வேண்டியதில்லை.
  to: தான் தன் அயலானின் உடைமையில் கை வைக்கவில்லை[b] என்று, அந்த இருவருக்கும் இடையே யாவேயின் சத்தியப்பிரமாணம் இருக்க வேண்டும்[a]. உரிமையாளர் அதை ஏற்றுக்கொள்ள வேண்டும்[c]; அந்த உடைமையை வைத்திருந்தவன் இழப்பீடு செலுத்த வேண்டியதில்லை.
  rationale: The revision renders the oath as a single Hebrew legal formula rather than adding a second command to swear. It uses “சத்தியப்பிரமாணம்” to avoid the ordinary Tamil sense of “ஆணை” (‘command’). Most importantly, it identifies the final implied subject as the holder of the entrusted property, so that the owner’s acceptance and the holder’s exemption from restitution remain distinct, as required by the source and context.
