base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: ta
  text: தான் தன் அயலானின் உடைமையில் கை வைக்கவில்லை[b] என்று, அந்த இருவருக்கும் இடையே யாவேயின் சத்தியப்பிரமாணம் இருக்க வேண்டும்[a]. உரிமையாளர் அதை ஏற்றுக்கொள்ள வேண்டும்[c]; அந்த உடைமையை வைத்திருந்தவன் இழப்பீடு செலுத்த வேண்டியதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “யாவேயின் சத்தியப்பிரமாணம்.” இது யாவேயைச் சாட்சியாக அழைத்துச் செய்யப்படும் முறையான சத்தியப்பிரமாணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அயலானின் உடைமையில் கை வைப்பது” என்பது பிறருக்குச் சொந்தமானதை எடுத்துக்கொள்வதை அல்லது முறைகேடாகக் கையாள்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: அதாவது, உரிமையாளர் அந்தச் சத்தியப்பிரமாணத்தைப் போதுமான சான்றாக ஏற்றுக்கொள்ள வேண்டும். இதை “உரிமையாளர் அதைப் பெற்றுக்கொள்ள வேண்டும்” என்றும் நேரடியாக மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: யாவேயின் ஆணை
  rationale: எபிரெயக் கட்டமைப்பை நெருக்கமாகப் பாதுகாத்து, தேவனுடைய தனிப்பெயரைத் தலைப்பால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கிறது. சட்டச் சூழலில் ‘ஆணை’ என்பது முறையான சத்தியப்பிரமாணத்தைக் குறிக்கிறது.
- source_word: בֵּין שְׁנֵיהֶם
  choice: அந்த இருவருக்கும் இடையே
  rationale: சட்டத் தகராறில் உள்ள இரு தரப்புகளையும் எபிரெயம் வெளிப்படையாகக் குறிப்பிடுவதால், ‘இருவருக்கும்’ என்பது அந்த இருதரப்பு அமைப்பைப் பாதுகாக்கிறது.
- source_word: אִם לֹא
  choice: … இல்லை என்று
  rationale: இங்கு இது சாதாரண நிபந்தனையைக் காட்டாமல், ஆணையின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘என்று’ அமைப்பு இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: שָׁלַח יָדוֹ
  choice: கை வைக்கவில்லை
  rationale: பிறருடைய பொருளைத் தவறாக எடுத்துக்கொள்வது அல்லது கையாள்வது என்ற பொருளுடைய எபிரெய மரபுத்தொடரின் உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: தன் அயலானின் உடைமையில்
  rationale: இந்தச் சட்டச் சூழலில் מְלָאכָה பொதுவான ‘வேலை’ என்பதைக் காட்டிலும் ஒப்படைக்கப்பட்ட உடைமை அல்லது பொருளைக் குறிக்கிறது.
- source_word: וְלָקַח בְּעָלָיו
  choice: அதன் உரிமையாளர் அந்த ஆணையை ஏற்றுக்கொள்ள வேண்டும்
  rationale: வினைச்சொல்லின் நேரடியான ‘பெற்றுக்கொள்’ என்ற பொருளுக்குப் பதிலாக, உரிமையாளர் ஆணையைப் போதுமானதாக ஏற்றுக்கொள்ளும் சட்டப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; மறைந்துள்ள செயப்படுபொருள் சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יְשַׁלֵּם
  choice: இழப்பீடு செலுத்த வேண்டியதில்லை
  rationale: Piel வடிவம் இந்த உடன்படிக்கைச் சட்டச் சூழலில் வெறும் பணம் செலுத்துவதை அல்ல, ஏற்பட்ட இழப்பை ஈடுசெய்வதைக் குறிக்கிறது.
theological_decisions:
- issue: שְׁבֻעַת יְהוָה என்பதிலுள்ள தொடர்பின் தன்மை
  choice: மூலத்தின் ‘யாவேயின் ஆணை’ என்ற சுருக்கமான தொடர்பை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘யாவேமுன் செய்யப்படும் ஆணை’ அல்லது ‘யாவேயின் பெயரில் செய்யப்படும் ஆணை’
  rationale: மாற்று வடிவங்கள் சட்டச் செயலின் பொருளை விளக்கினாலும், எபிரெயக் கட்டமைப்பில் வெளிப்படையாக இல்லாத ‘முன்’ அல்லது ‘பெயரில்’ என்பதை உரைக்குள் சேர்த்து அதன் சுருக்கத்தையும் சாத்தியமான நுண்ணிய தெளிவின்மையையும் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ என்ற ஒலிபெயர்ப்பு தேவனுடைய தனிப்பெயரைப் பாதுகாக்கிறது. எபிரெய மரபுத்தொடர் முதன்மை உரையில் வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
