  text: אִם מָאֵ֧ן יְמָאֵ֛ן אָבִ֖י/הָ לְ/תִתָּ֣/הּ ל֑/וֹ כֶּ֣סֶף יִשְׁקֹ֔ל כְּ/מֹ֖הַר הַ/בְּתוּלֹֽת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/016.yaml
  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: ta
  text: அவளுடைய தந்தை அவளை அவனுக்குக் கொடுக்க[b] முற்றிலும் மறுத்தால், கன்னிப் பெண்களுக்குரிய மணப்பணத்துக்கு இணையான வெள்ளியை அவன் எடைபோட்டுக் கொடுக்க வேண்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘வெள்ளியை எடைபோட வேண்டும்.’ நாணயங்களைப் பயன்படுத்தாமல், உலோகத்தை எடையிட்டு பணம் செலுத்திய வழக்கை இது பிரதிபலிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அவளை அவனுக்குத் திருமணம் செய்துகொடுக்க.’ ‘அவளை அவனுக்குக் கொடுக்க’ என்ற எபிரேய மரபுத்தொடர், திருமணத்திற்கு தந்தை சம்மதிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: மறுத்தால்
  rationale: எபிரேய நிபந்தனைத் துகள் אִם, தமிழில் இயல்பான ‘-ஆல்’ நிபந்தனை விகுதியால் வெளிப்படுத்தப்படுகிறது.
- source_word: מָאֵן יְמָאֵן
  choice: முற்றிலும் மறுத்தால்
  rationale: வினையெச்ச மூலவடிவமும் முற்றுவினையும் இணையும் எபிரேய அமைப்பு மறுப்பை வலியுறுத்துகிறது; ‘முற்றிலும்’ அந்த அழுத்தத்தை இயல்பான தமிழில் தருகிறது.
- source_word: אָבִיהָ
  choice: அவளுடைய தந்தை
  rationale: மூன்றாம் நபர் பெண்பால் ஒருமை உடைமைப் பின்னொட்டைத் தெளிவாக வெளிப்படுத்தும் நேரடி மொழிபெயர்ப்பு.
- source_word: לְתִתָּהּ לוֹ
  choice: அவளை அவனுக்குக் கொடுக்க
  rationale: எபிரேயச் சொற்றொடரின் நேரடி வடிவத்தைப் பேணுகிறது; இச்சட்டத் திருமணச் சூழலில் இது திருமணத்திற்குக் கொடுப்பதைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: இது பணமாகப் பயன்படும் வெள்ளியைக் குறித்தாலும், மூலத்தின் திடப்பொருள் சார்ந்த சொல்லைத் தக்கவைக்கிறது.
- source_word: יִשְׁקֹל
  choice: எடைபோட்டுக் கொடுக்க வேண்டும்
  rationale: நாணயமாக அல்லாமல் எடையிடப்பட்ட உலோகமாகச் செலுத்திய முறையைப் பிரதிபலிக்கும் ‘எடைபோடு’ என்ற அடிப்படைப் பொருளையும், சட்டப்பூர்வ செலுத்துதலையும் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: כְּמֹהַר
  choice: மணப்பணத்துக்கு இணையான
  rationale: מֹהַר என்பது மணமகளின் குடும்பத்தாருக்குச் செலுத்தப்பட்ட திருமணப் பணத்தைக் குறிக்கிறது; ‘மணப்பணம்’ நவீன வாசகருக்குத் தெளிவான, சுருக்கமான இணைச்சொல்.
- source_word: הַבְּתוּלֹת
  choice: கன்னிப் பெண்களுக்குரிய
  rationale: குறிப்பிட்ட ஒருவரை அல்லாமல், கன்னிப் பெண்களுக்கான வழக்கமான தொகையைப் பொதுவாகக் குறிக்கும் பன்மை வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
