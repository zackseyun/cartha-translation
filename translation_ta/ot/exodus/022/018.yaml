  yaml_path: translation/ot/exodus/022/018.yaml
  text: Whoever lies with an animal shall surely be put to death[a].
translation:
  language: ta
  text: விலங்குடன் உடலுறவு கொள்கிற எவரும் நிச்சயமாகக் கொல்லப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொற்சொல்லாக, “நிச்சயமாகச் சாக வேண்டும்.” எபிரேயச் சட்டவாய்பாடு நீதித்துறைத் தண்டனையாக மரணம் உறுதி என்பதை வெளிப்படையாகத் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל שֹׁכֵב
  choice: உடலுறவு கொள்கிற எவனும்
  rationale: כָּל என்பதுடன் வரும் வினையெச்சம் பொதுவான நிபந்தனைத் தொடரை உருவாக்குகிறது. שׁכב עם இங்கு பாலுறவைக் குறிக்கும் மரபுச் சொற்றொடர்; தமிழில் மூலத்தின் பொருளைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்க ‘உடலுறவு கொள்கிற’ இயல்பானது.
- source_word: עִם
  choice: உடன்
  rationale: செயலையும் அதன் பொருளையும் இணைக்கும் நேரடியான முன்னிடைச்சொல்.
- source_word: בְּהֵמָה
  choice: மிருகம்
  rationale: இந்தச் சூழலில் בְּהֵמָה மனிதரல்லாத விலங்கைக் குறிக்கிறது. ‘மிருகம்’ என்பது சட்டவாக்கியத்தின் கடுமைக்கும் பொருளுக்கும் ஏற்ற, தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்சப் பெயருடன் வரும் செயப்பாட்டு வினை வடிவம் மரணத்தின் உறுதியை வலியுறுத்துவதோடு சட்டரீதியான மரண தண்டனையையும் குறிக்கிறது. இந்த மொழிபெயர்ப்பு வலியுறுத்தலையும் செயப்பாட்டு/நீதித்துறைப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: சட்டரீதியான மரணத் தண்டனை வாய்பாட்டை மொழிபெயர்த்தல்
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  alternative: நிச்சயமாகச் சாக வேண்டும்
  rationale: எபிரெய மரபுவாய்பாடு உறுதியான மரணத்தைச் சொன்னாலும், יוּמָת என்ற செயப்பாட்டு வடிவம் தண்டனை நிறைவேற்றப்படுவதைச் சுட்டுகிறது. தேர்ந்த மொழிபெயர்ப்பு அந்த நீதித்துறைப் பொருளை வெளிப்படுத்துகிறது; அடிக்குறிப்பு மிக நேரடியான மாற்றைத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமான சட்டவாக்கிய நடையும் கண்ணியமான நேரடித் தன்மையும் பயன்படுத்தப்பட்டுள்ளன. பாலியல் செயலைத் தெளிவாகக் குறிப்பிடும் போதும் தேவையற்ற மருத்துவ அல்லது கொச்சையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
