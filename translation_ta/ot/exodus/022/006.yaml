base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/006.yaml
  text: If a man gives his neighbor money or goods to keep[a], and it is stolen from the man's house, if the thief is found[c][b], he shall pay double.
translation:
  language: ta
  text: ஒருவன் தன் அயலானிடம் பணத்தையோ[a] பொருட்களையோ[b] பாதுகாத்து வைக்கக் கொடுத்து, அவை அந்த மனிதனின் வீட்டிலிருந்து திருடப்பட்டால், திருடன் கண்டுபிடிக்கப்பட்டால், அவன் இரட்டிப்பாகத் திருப்பிச் செலுத்த வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘வெள்ளி’; இங்கே பணம் என்ற பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘பொருட்கள்’ என்பதற்கு ‘உபயோகப் பொருட்கள்’ அல்லது ‘உடைமைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லடிப்படையில், ‘அவன் இருமடங்கு திருப்பிச் செலுத்த வேண்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஒருவன் … கொடுத்து … திருடப்பட்டால்
  rationale: நிபந்தனை வடிவிலான வழக்குச் சட்டத்தை இயல்பான தமிழ் ‘-ஆல்’ அமைப்பில் தருகிறது.
- source_word: יִתֵּן אִישׁ
  choice: ஒருவன் … கொடுத்து
  rationale: எபிரெய மூலத்தின் ஒருமை ஆண்பால் சட்ட மொழிநடையைத் தமிழில் பொதுவான பிரதிநிதிச் சொல்லான ‘ஒருவன்’ மூலம் காக்கிறது.
- source_word: אֶל רֵעֵהוּ
  choice: தன் அயலானிடம்
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் ரֵעַ சமூகத்தில் உடனிருக்கும் மற்றொருவரைக் குறிக்கும்; ‘அயலான்’ இயல்பான, பரந்த பொருளுடைய தேர்வு.
- source_word: כֶּסֶף
  choice: பணம்
  rationale: சொல்லடிப்படையில் ‘வெள்ளி’ என்றாலும், இச்சட்டப் பொருளாதாரச் சூழலில் பரிமாற்ற மதிப்பாகிய பணத்தைக் குறிக்கிறது.
- source_word: אוֹ כֵלִים
  choice: பொருட்களையோ
  rationale: כֵלִים பலவகை உடைமைகள் அல்லது உபயோகப் பொருட்களைக் குறிக்கும் பரந்த சொல்; ‘பொருட்கள்’ அதன் பரப்பைக் குறுக்காமல் இயல்பாகத் தருகிறது.
- source_word: לִשְׁמֹר
  choice: பாதுகாத்து வைக்க
  rationale: ஒப்படைப்பதன் நோக்கம் வெறுமனே வைத்திருப்பது அல்ல, பாதுகாப்பாக வைத்திருப்பது என்பதைக் காட்டுகிறது.
- source_word: וְגֻנַּב
  choice: அவை … திருடப்பட்டால்
  rationale: ஒப்படைக்கப்பட்ட பணம் அல்லது பொருட்களை மொத்தமாகச் சுட்டும் எபிரெய செயலப்பாட்டு வடிவத்தைத் தமிழில் தெளிவாகப் பன்மையில் தருகிறது.
- source_word: מִבֵּית הָאִישׁ
  choice: அந்த மனிதனின் வீட்டிலிருந்து
  rationale: இது பொருட்களைப் பாதுகாக்கப் பெற்ற மனிதனின் வீட்டைக் குறிக்கிறது; ‘அந்த மனிதன்’ முன்னர் குறிப்பிடப்பட்டவரைத் தெளிவாகச் சுட்டுகிறது.
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: திருடன் கண்டுபிடிக்கப்பட்டால்
  rationale: ‘பிடிக்கப்பட்டால்’ என்று விளக்கமாக்காமல், מצא என்பதன் செயலப்பாட்டு வடிவமான ‘கண்டுபிடிக்கப்படுதல்’ என்பதைப் பாதுகாக்கிறது.
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: அவன் இரட்டிப்பாகத் திருப்பிச் செலுத்த வேண்டும்
  rationale: திருடன் இருமடங்கு ஈடு செலுத்த வேண்டும் என்ற சட்டப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
