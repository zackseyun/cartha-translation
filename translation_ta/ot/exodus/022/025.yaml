  text: If you take your neighbor’s cloak as a pledge[b][a], you shall return it to him before the sun sets.
translation:
  language: ta
  text: உன் அயலானின் மேலாடையை[a] அடமானமாக எடுத்தால், சூரியன் மறைவதற்குள்[b] அதை அவனிடம் திருப்பிக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேலாடை’ என்பதற்கு ‘ஆடை’ அல்லது ‘வெளிப்புற ஆடை’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் இரவில் பாதுகாப்புக்குப் பயன்படக்கூடிய வெளிப்புறப் போர்வை போன்ற ஆடையைச் சிறப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, ‘சூரியன் வரும்வரை’; இச்சூழலில் அது சூரிய மறைவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: வாங்கினால்
  rationale: நிபந்தனை சார்ந்த வழக்குச் சட்டத்தை இயல்பான தமிழில் காட்ட வினையுடன் ‘-னால்’ அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: חָבֹל תַּחְבֹּל
  choice: அடமானமாக வாங்கினால்
  rationale: வினைமுற்றுக்கு முன் வரும் அதே வேர்ச் சொல்லின் infinitive absolute அடமானம் வாங்கும் சட்டச் செயலை வலியுறுத்துகிறது. அதன் இரட்டிப்பைச் சொல்லுக்குச் சொல் தமிழில் தருவது இயல்பாக இருக்காது; ‘அடமானமாக வாங்கு’ சட்டப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שַׂלְמַת
  choice: மேலாடையை
  rationale: இச்சொல் பொதுவான எந்த ஆடையையும் அல்லாமல், இரவில் போர்வையாகவும் பாதுகாப்பாகவும் பயன்படக்கூடிய வெளிப்புற ஆடையைக் குறிக்கிறது. ‘மேலாடை’ நவீன தமிழில் தெளிவாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: רֵעֶךָ
  choice: உன் அயலானின்
  rationale: உடன்படிக்கைச் சமூகச் சட்டத்தில் ஒருவரோடு தொடர்புடைய சக மனிதனைக் குறிக்கும் சொல்லாக ‘அயலான்’ பொருத்தமானது; வசனத்தின் தனிப்பட்ட அறநெறிச் சார்பையும் காக்கிறது.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: சூரியன் மறைவதற்குள்
  rationale: நேரடியாக ‘சூரியன் வரும்வரை’ என்ற அமைப்பு சூழலில் சூரிய மறைவைக் குறிக்கும் எபிரேய மொழிவழக்கு. கடமையின் கால எல்லையை இயல்பான தமிழில் ‘மறைவதற்குள்’ தெரிவிக்கிறது.
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: அதை அவனிடம் திருப்பிக் கொடுக்க வேண்டும்
  rationale: שׁוב என்பதன் Hiphil வடிவம் ஒன்றை அதன் உரியவரிடம் மீண்டும் சேர்த்தல் அல்லது திருப்பிக் கொடுத்தலைக் குறிக்கிறது. ‘வேண்டும்’ சட்டக் கட்டளையின் வலிமையை நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
