  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: ta
  text: அதன் உரிமையாளர் அதனோடு இருந்தால், அவன் ஈடு செலுத்த வேண்டியதில்லை. அது வாடகைப் பொருளாக இருந்தால், அதன் வாடகையோடு வந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் ஒரு கூலியாளாக இருந்தால், அது அவனுடைய கூலியோடு வந்தது.” எபிரெயச் சொற்றொடர் சுருக்கமானது. அது வாடகைக்கு எடுக்கப்பட்ட விலங்கு அல்லது பொருளைக் குறிக்கிறதா, கூலியாளைக் குறிக்கிறதா என்பது தெளிவாக இல்லை. கடன் பெற்ற உடைமைக்கான பொறுப்பைப் பற்றிய இச்சூழலைக் கருத்தில் கொண்டு, முதன்மை உரை அதை வாடகைப் பொருளாகப் புரிந்துகொள்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: அதன் உரிமையாளர்
  rationale: בעל என்பது இச்சட்டச் சூழலில் உடைமையாளரைக் குறிக்கிறது; பின்னொட்டு முந்தைய வசனத்தில் கூறப்பட்ட விலங்கு அல்லது பொருளையே சுட்டுகிறது.
- source_word: עִמּוֹ
  choice: அதனோடு இருந்தால்
  rationale: עִם என்பதன் பொருள் ‘உடன்’. இங்கு பின்னொட்டின் முன்னிலைச் சொல் கடனாகப் பெறப்பட்ட விலங்கு அல்லது பொருள் என்பதால், தமிழில் அஃறிணைச் சுட்டு பயன்படுத்தப்பட்டது.
- source_word: לֹא יְשַׁלֵּם
  choice: ஈடு செலுத்த வேண்டியதில்லை
  rationale: சட்டப் பயன்பாட்டில் שלם என்பதன் பியேல் வடிவம் ஏற்பட்ட இழப்புக்கு ஈடு அல்லது நஷ்டஈடு செலுத்துவதைக் குறிக்கிறது; ‘பணம் செலுத்துதல்’ என்பதைக் காட்டிலும் ‘ஈடு செலுத்துதல்’ துல்லியமானது.
- source_word: שָׂכִיר
  choice: வாடகைக்கு எடுக்கப்பட்டதாக
  rationale: இந்தச் சொல் பொதுவாகக் கூலியாளைக் குறிக்கக்கூடும். ஆனால் கடனாக அல்லது வாடகைக்கு பெறப்பட்ட உடைமைக்கான பொறுப்பைப் பற்றிய உடனடிச் சூழலில், வாடகைக்கு எடுக்கப்பட்ட விலங்கு அல்லது பொருளைக் குறிக்கும் சுருக்கமான பயன்பாடாக முதன்மை உரை எடுத்துக்கொள்கிறது.
- source_word: בָּא בִּשְׂכָרוֹ
  choice: அதன் வாடகைக்காகவே அது வந்தது
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாகவும் பொருள் இடைவெளியுடனும் உள்ளது. தமிழிலும் அதன் உருவகமான ‘வந்தது’ என்பதைத் தக்கவைத்து, வாடகை ஒப்பந்தமே இழப்பு அபாயத்தையும் உள்ளடக்குகிறது என்ற கருத்தை விளக்கவுரையாகச் சேர்க்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: שָׂכִיר மற்றும் அதனைத் தொடரும் ஆண்பால் வடிவங்களின் முன்னிலை
  choice: வாடகைக்கு எடுக்கப்பட்ட விலங்கு அல்லது பொருளைக் குறிக்கும் வாசிப்பு
  alternative: கூலியாளைக் குறிக்கும் வாசிப்பு
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் கடன் பெற்ற உடைமைக்கான பொறுப்பு என்ற சட்டச் சூழல் பொருள்-வாசிப்பை ஆதரிக்கிறது. எனினும், எபிரெயில் ஆண்பால் வடிவமும் שָׂכִיר என்பதன் வழக்கமான மனிதர் சார்ந்த பொருளும் மாற்று வாசிப்புக்கு இடமளிப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் எளிமையான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டது. எபிரெயின் சுருக்கத்தையும் இருபொருள் வாய்ப்பையும் தேவையற்ற விளக்கத்தால் தீர்த்துவிடாமல், முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாத்துள்ளோம்.
