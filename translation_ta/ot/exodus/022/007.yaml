base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: ta
  text: திருடன் கண்டுபிடிக்கப்படாவிட்டால், வீட்டின் உரிமையாளர் தன் அயலானின் உடைமையில் கை வைத்தாரா இல்லையா என்பதைப் பற்றி கடவுளின் முன்னிலையில்[a] ஆஜராக வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிபதிகளின் முன்னிலையில்.” எபிரெய உரையில் “கடவுளிடம்” என்று உள்ளது; ஆனால் சில சட்டச் சூழல்களில் இச்சொல் தெய்வீக அதிகாரத்தில் செயல்படும் நீதிபதிகளைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: திருடன் கண்டுபிடிக்கப்படாவிட்டால்
  rationale: מצא என்பதன் நிஃபால் வடிவம் இங்கு செயப்பாட்டு பொருளில் ‘கண்டுபிடிக்கப்படுதல்’ என வருகிறது. திருடன் அடையாளம் காணப்பட்டாரா அல்லது பிடிக்கப்பட்டாரா என்பதை அளவுக்கு மீறித் தீர்மானிக்காமல் இந்தச் சொல் விடுகிறது.
- source_word: וְנִקְרַב
  choice: வர வேண்டும்
  rationale: קרב என்பதன் நிஃபால் வடிவம் ‘நெருங்கி வருதல்’ அல்லது ‘அருகில் கொண்டுவரப்படுதல்’ என்ற இரு நுணுக்கங்களையும் தரலாம். சட்டச் சூழலில் இயல்பான தமிழுக்காக ‘வர வேண்டும்’ என மொழிபெயர்க்கப்பட்டுள்ளது; யார் அழைத்து வருகிறார் என்பது குறிப்பிடப்படவில்லை.
- source_word: בַּעַל הַבַּיִת
  choice: வீட்டின் உரிமையாளர்
  rationale: வீட்டின் உடைமை அல்லது பொறுப்பு உடையவரைக் குறிக்கும் தெளிவான, நவீன சட்டநடைச் சொற்றொடர்.
- source_word: אֶל הָאֱלֹהִים
  choice: கடவுளிடம்[a]
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘கடவுளிடம்’. சில சட்டச் சூழல்களில் אֱלֹהִים தெய்வீக அதிகாரத்தில் செயல்படும் நீதிபதிகளைக் குறிக்கக்கூடும்; அந்த வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: கை வைத்தாரா இல்லையா
  rationale: பிறருடையதைத் தவறாக எடுத்துக்கொள்ளுதல் அல்லது பயன்படுத்துதல் என்ற பொருளுடைய எபிரெய உருவகத்தை இது காக்கிறது. ‘திருடினாரா’ என்பது பொருளைத் தேவையின்றிக் குறுக்கிவிடும்.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: தன் அயலானின் உடைமையின்மேல்
  rationale: מְלָאכָה பொதுவாக வேலை அல்லது தொழிலைக் குறித்தாலும், ஒப்படைக்கப்பட்ட பணம் அல்லது பொருட்களைப் பற்றிய இச்சட்டச் சூழலில் அயலானுக்குச் சொந்தமான உடைமையைச் சுட்டுகிறது.
theological_decisions:
- issue: இந்தச் சட்டச் சூழலில் אֱלֹהִים என்பதன் பொருள்
  choice: கடவுளிடம்
  alternative: நீதிபதிகளிடம்
  rationale: எபிரெய உரை நேரடியாக ‘கடவுளிடம்’ என்கிறது. உடன்படிக்கைச் சட்டத்தின் சில இடங்களில் இச்சொல் நீதிபதிகளைக் குறிக்கலாம் என்பதால், அந்த விளக்கத்தை முதன்மை உரைக்குள் புகுத்தாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்டச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கை வைத்தல்’ என்ற மூலமொழி உருவகம் காக்கப்பட்டுள்ளது; אֱלֹהִים என்பதிலுள்ள உண்மையான பொருள் இருமை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
