translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைந்த சட்ட மொழிநடை. ‘திருடப்பட்டே போனால்’ என்பது எபிரெய வலியுறுத்தலைக் காக்கிறது; அடிக்குறிப்பு அதன் சொல்லமைப்பையும் காவல் பொறுப்பு சார்ந்த நுணுக்கத்தையும் விளக்குகிறது.
