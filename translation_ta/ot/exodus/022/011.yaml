source:
  edition: WLC
  text: וְ/אִם גָּנֹ֥ב יִגָּנֵ֖ב מֵ/עִמּ֑/וֹ יְשַׁלֵּ֖ם לִ/בְעָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/011.yaml
  text: But if it is stolen from him[a], he shall make restitution to its owner.
translation:
  language: ta
  text: ஆனால் அது அவனிடமிருந்து திருடப்பட்டால்[a], அதன் உரிமையாளருக்கு அவன் இழப்பீடு செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “திருடப்படுதல், அது அவனிடமிருந்து திருடப்பட்டால்” என்று வலியுறுத்தும் வினை அமைப்பு உள்ளது. இதன் பொருள், “அது உண்மையிலேயே அவனிடமிருந்து திருடப்பட்டால்” அல்லது “அவன் பொறுப்பில் வைத்திருந்தபோது அது திருடப்பட்டால்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் … போனால்
  rationale: வழக்குச் சட்டத்தின் முந்தைய நிலைக்கு மாறான நிபந்தனையை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: גָּנֹב יִגָּנֵב
  choice: திருடப்பட்டே போனால்
  rationale: வினைமுற்றுடன் வரும் எபிரெய இறுதியிலா வினைவடிவம் வினைக் கருத்தை வலியுறுத்துகிறது. ‘-ஏ’ என்பதன் மூலம் அந்த வலியுறுத்தலை இயல்பான தமிழில் காட்டுகிறது; முந்தைய சூழலிலிருந்து புரியும் பொருள் ‘அது’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: מֵעִמּוֹ
  choice: அவனிடமிருந்து
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அவனுடன் இருந்த இடத்திலிருந்து’; இச்சட்டச் சூழலில் அவனுடைய பொறுப்பில் இருந்தபோது திருடப்படுவதைக் குறிக்கிறது. முதன்மை உரையில் மூலத்தின் சுருக்கத்தைக் காக்கிறது.
- source_word: יְשַׁלֵּם
  choice: இழப்பீடு செலுத்த வேண்டும்
  rationale: שלם என்பதன் பியேல் வடிவம் சட்டச் சூழலில் இழப்பை ஈடுசெய்வதையோ நஷ்டஈடு கொடுப்பதையோ குறிக்கிறது. ‘இழப்பீடு செலுத்த வேண்டும்’ அதன் சட்டப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לִבְעָלָיו
  choice: அதன் உரிமையாளருக்கு
  rationale: בעל இங்கு ஒப்படைக்கப்பட்ட பொருள் அல்லது விலங்கின் உரிமையாளரைக் குறிக்கிறது. ‘அதன்’ என்பது சூழலில் மறைந்திருக்கும் தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
