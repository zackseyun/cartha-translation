  terminology: Key legal terms are consistently and suitably rendered. ‘இரத்தப்பழி’ properly expresses bloodguilt; ‘இழப்பீடு’ reflects restitution; and the passive ‘விற்கப்பட வேண்டும்’ preserves the source’s legal passive without adding doctrinal interpretation.
