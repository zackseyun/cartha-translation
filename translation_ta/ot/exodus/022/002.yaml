reference: Exodus 22:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אִם זָרְחָ֥ה הַ/שֶּׁ֛מֶשׁ עָלָ֖י/ו דָּמִ֣ים ל֑/וֹ שַׁלֵּ֣ם יְשַׁלֵּ֔ם אִם אֵ֣ין ל֔/וֹ וְ/נִמְכַּ֖ר בִּ/גְנֵבָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: ta
  text: ஆனால் அவன்மேல் சூரியன் உதித்திருந்தால்[a], அவனுக்கு இரத்தப்பழி உண்டு[b]. அவன் கட்டாயம் இழப்பீடு செலுத்த வேண்டும். அவனிடம் எதுவும் இல்லையென்றால்[c], அவன் தனது திருட்டுக்காக விற்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருள் விளக்கமாக, “சூரியன் உதித்த பிறகு இது நடந்தால்” அல்லது “இது பகலில் செய்யப்பட்டால்.” எபிரெயத்தில் சொற்சொல்லாக, “சூரியன் அவன்மேல் உதித்திருந்தால்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, இந்தச் சூழலில் திருடனைக் கொன்றவர் இரத்தப்பழிக்கு ஆளாவார்.
    reason: alternative_reading
  - marker: c
    text: திருடன் இழப்பீடு செலுத்த வசதியற்றிருந்தால், திருட்டினால் ஏற்பட்ட கடனை ஈடுசெய்வதற்காக அவன் விற்கப்படுவதை இது குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: ஆனால் ... என்றால்
  rationale: முந்தைய வசனத்தின் இரவுநேரச் சூழலுக்கு மாறான நிபந்தனையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெயச் சொல் தனியாக நிபந்தனையையே குறிக்கிறது.
- source_word: זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: அவன்மேல் சூரியன் உதித்திருந்தால்
  rationale: ‘சூரியன் அவன்மேல் உதித்தது’ என்ற எபிரெய மொழியின் தெளிவான காட்சியைப் பாதுகாக்கிறது; சட்டரீதியான ‘பகலில்’ என்ற பொருளை உரைக்குறிப்பில் தருகிறது.
- source_word: דָּמִים לוֹ
  choice: அவனுக்கு இரத்தப்பழி உண்டு
  rationale: சட்டச் சூழலில் דָּמִים குறிக்கும் இரத்தப்பழி அல்லது உயிரிழப்புக்கான பொறுப்பைச் சுருக்கமாகவும் மூலத்தின் பிரதிப்பெயர் தெளிவின்மையை ஓரளவு பாதுகாக்கும் விதமாகவும் தருகிறது.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: கட்டாயம் இழப்பீடு செலுத்த வேண்டும்
  rationale: வினையெச்ச முற்றுருவும் வினைமுற்றும் சேர்ந்த வலியுறுத்தலை ‘கட்டாயம்’ என வெளிப்படுத்துகிறது; திருட்டுச் சட்டச் சூழலில் வெறும் பணம் செலுத்துதல் அல்ல, இழப்பீடு செய்தலே பொருத்தமானது.
- source_word: אִם אֵין לוֹ
  choice: அவனிடம் எதுவும் இல்லையென்றால்
  rationale: இழப்பீடு செலுத்துவதற்கான உடைமையோ வசதியோ இல்லாத நிலையை இயல்பான தமிழில் தருகிறது.
- source_word: וְנִמְכַּר
  choice: விற்கப்பட வேண்டும்
  rationale: சட்டரீதியான செயலற்ற வினை வடிவை நேரடியாகப் பாதுகாக்கிறது; கடனை ஈடுசெய்ய அடிமைப் பணிக்காக விற்கப்படுதலைக் குறிக்கிறது.
- source_word: בִּגְנֵבָתוֹ
  choice: தனது திருட்டுக்காக
  rationale: விற்பனைக்கான சட்டக் காரணம் அவன் செய்த திருட்டு என்பதைச் சுருக்கமாகக் காட்டுகிறது; ‘திருடிய பொருளுக்காக’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: சூரியன் உதித்தபின் திருடனைக் கொல்வதால் வரும் இரத்தப்பழி
  choice: பகல்நேரச் சூழலில் கொலை நிகழ்ந்தால் இரத்தப்பழி உண்டு என்ற வேறுபாட்டை உரை கூறுகிறது; இரத்தப்பழி யார்மேல் வருகிறது என்பதை உரைக்குறிப்பு கொலையாளியுடன் தொடர்புபடுத்துகிறது.
  alternative: இது சூரிய உதய நேரத்தை மட்டும் குறிக்காமல், அச்சுறுத்தல் தெளிவாக அறியக்கூடிய சூழலைப் பொதுவாகக் குறிக்கலாம்.
  rationale: முதன்மை உரை ‘சூரியன் அவன்மேல் உதித்திருந்தால்’ என்ற concrete மொழியையும் ‘அவனுக்கு’ என்ற பிரதிப்பெயரின் வடிவத்தையும் பாதுகாக்கிறது. அதேவேளை, சூழலில் திருடனைக் கொன்றவரே இரத்தப்பழி ஏற்கிறார் என்ற சட்டப் பொருளை உரைக்குறிப்பு விளக்குகிறது; உரை கூறாத விரிவான நெறிக் கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான மற்றும் சுருக்கமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இரத்தப்பழி’, ‘இழப்பீடு’, ‘விற்கப்பட வேண்டும்’ ஆகியவை மூலத்தின் சட்டத் தீவிரத்தைப் பாதுகாக்கின்றன. பிரதிப்பெயர் சார்ந்த பதற்றம் முதன்மை உரையில் முற்றிலும் விளக்கித் தீர்க்கப்படாமல், தேவையான சூழல் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
