source:
  edition: WLC
  text: מְלֵאָתְ/ךָ֥ וְ/דִמְעֲ/ךָ֖ לֹ֣א תְאַחֵ֑ר בְּכ֥וֹר בָּנֶ֖י/ךָ תִּתֶּן לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: ta
  text: உன் நிறைந்த விளைபொருளையும் பிழிவிலிருந்து கிடைக்கும் சாற்றையும் அளிப்பதைத் தாமதிக்காதே[a]. உன் மகன்களில் முதற்பேறானவனை எனக்குக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் முழு விளைபொருளையும் உன் சாற்றையும்/திராட்சரசத்தையும்.” எபிரெயச் சொற்கள் அறுவடை செய்யப்பட்ட விளைபொருளையும் பிழிந்தெடுக்கப்பட்ட திரவ விளைபொருளையும் குறிக்கலாம். இவை குறிப்பாகத் தானியத்தையும் திராட்சரசத்தையும் குறிக்கின்றனவா, அல்லது திட மற்றும் திரவ விளைச்சலைப் பொதுவாகக் குறிக்கின்றனவா என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: உன் நிறைவிளைச்சல்
  rationale: இச்சொல் அடிப்படையில் ‘நிறைவு’ அல்லது ‘நிறைந்த பலன்’ என்பதைக் குறிக்கிறது. இந்தச் சட்டச் சூழலில் அது அறுவடையிலிருந்து கிடைக்கும் விளைச்சலைக் குறிப்பதால், வேளாண்மை சார்ந்த பொருளையும் எபிரெயச் சொல்லின் ‘நிறைவு’ நிழற்பொருளையும் இணைத்துப் பாதுகாக்க ‘நிறைவிளைச்சல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְדִמְעֲךָ
  choice: உன் பிழிவுச் சாறு
  rationale: இப்பெயர்ச்சொல் வேறு சூழலில் ‘கண்ணீர்’ எனப் பொருள்படலாம்; ஆனால் இங்கு பிழிவிலிருந்து கிடைக்கும் திரவ விளைபொருளைக் குறிக்கிறது. அது திராட்சரசமா எண்ணெயா என்பதைத் தேவையின்றிக் குறுக்காமல், பிழிந்தெடுக்கப்படும் திரவம் என்ற உருவகத்தை ‘பிழிவுச் சாறு’ வெளிப்படுத்துகிறது.
- source_word: לֹא תְאַחֵר
  choice: செலுத்தத் தாமதிக்காதே
  rationale: אחר என்பதன் பியேல் வடிவம் தாமதித்தல் அல்லது பிற்போடுதல் என்று பொருள்படும். தமிழில் பொருளை இயல்பாக வெளிப்படுத்த ‘செலுத்த’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது; அது தேவனுக்குரிய விளைபொருளை உரிய நேரத்தில் அளிப்பதைக் குறிக்கிறது.
- source_word: בְּכוֹר
  choice: முதற்பேறானவன்
  rationale: בכור முதல் பிறந்த சந்ததியைக் குறிக்கிறது. தொடர்ந்து வரும் ‘மகன்கள்’ என்பதால் ஆண்பால் குறிப்பு தமிழிலும் துல்லியமாகப் பாதுகாக்கப்பட்டது.
- source_word: בָּנֶיךָ
  choice: உன் மகன்களில்
  rationale: எபிரெயச் சொல் பொதுவாகப் ‘பிள்ளைகள்’ என்று அல்லாமல் குறிப்பாக ‘மகன்கள்’ என்று உள்ளது; ஆகவே பாலினக் குறிப்பை மாற்றாமல் மொழிபெயர்க்கப்பட்டது.
- source_word: תִּתֶּן לִּי
  choice: எனக்குக் கொடுக்க வேண்டும்
  rationale: இது நேரடியான சட்டக் கட்டளை. ‘கொடுக்க வேண்டும்’ என்பது நவீன தமிழில் அதன் கட்டாய வலிமையை இயல்பாகத் தெரிவிக்கிறது; ‘எனக்கு’ என்பது பெறுபவர்மீதான மூலமொழியின் வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: מְלֵאָה / דִמְעָה என்ற வேளாண்மைச் சொல் இணையின் பொருள்
  choice: திட விளைபொருளையும் பிழிந்தெடுக்கப்படும் திரவ விளைபொருளையும் உரிய நேரத்தில் செலுத்தும்படி கட்டளையிடுகிறது.
  alternative: இவை குறிப்பாகத் தானியத்தையும் திராட்சரசத்தையும் குறிக்கலாம்; அல்லது வகைப்படுத்தாமல் முதற்பலன்களைப் பொதுவாகக் குறிக்கலாம்.
  rationale: எபிரெயச் சொல் இணை அறுவடை விளைச்சலையும் அதிலிருந்து பிழிந்தெடுக்கப்படும் திரவ விளைபொருளையும் சுட்டுகிறது. இரண்டாவது சொல் திராட்சரசத்தை மட்டும் குறிக்கிறது என்று முடிவுசெய்யாமல், மூலத்தின் பரந்த பொருளும் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
- issue: בָּנֶיךָ என்பதன் பாலினக் குறிப்பு
  choice: மகன்கள்
  alternative: பிள்ளைகள்
  rationale: மூலமொழி ஆண்பால் சொல்லையே பயன்படுத்துகிறது. எந்தக் கோட்பாட்டு முடிவையும் சேர்க்காமல் அந்தக் குறிப்பைத் துல்லியமாகப் பேண ‘மகன்கள்’ என வழங்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டக் கட்டளைக்குரிய நேரடியானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிறைவிளைச்சல்’ மற்றும் ‘பிழிவுச் சாறு’ ஆகியவை மூலமொழியின் வேளாண்மை உருவகத்தையும் அதன் துல்லிய எல்லைகளையும் காக்கின்றன. முதல் கட்டளையில் தமிழின் இயல்புக்காக ‘செலுத்த’ சேர்க்கப்பட்டுள்ளது; இது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும் சூழலில் உள்ள அளித்தல்/செலுத்துதல் கருத்தை மட்டும் தெளிவாக்குகிறது.
