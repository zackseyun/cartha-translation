- from: உன் நிறைவிளைச்சலையும் உன் பிழிவுச் சாற்றையும் செலுத்தத் தாமதிக்காதே[a]. உன் மகன்களில் முதற்பேறானவனை எனக்குக் கொடுக்க வேண்டும்.
