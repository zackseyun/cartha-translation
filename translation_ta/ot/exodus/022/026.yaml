base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: ta
  text: ஏனெனில், அது அவன் போர்த்திக்கொள்ளும் ஒரே ஆடை; அவனுடைய உடலுக்கான மேலாடை அதுதான். அவன் எதைப் போர்த்திக்கொண்டு படுப்பான்? அவன் என்னை நோக்கிக் கூக்குரலிட்டால், நான் கேட்பேன்; ஏனெனில், நான் இரக்கமுள்ளவன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அருளுள்ளவன்’ அல்லது ‘கருணையுள்ளவன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்திய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துவதால், காரணவிளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: כְּסוּתוֹ לְבַדָּהּ
  choice: அது மட்டுமே அவனுடைய போர்வை
  rationale: כְּסוּת என்பதன் மூடுபொருள்/போர்வை என்ற கருத்தையும், לְבַדָּהּ காட்டும் ஒரே ஒன்று என்ற வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: அவனுடைய உடலை மூடும் ஆடை அதுதான்
  rationale: שִׂמְלָה என்பது உடையாகவும் இரவில் போர்த்தும் மேலாடையாகவும் இருக்கலாம்; לְעֹרוֹ என்பதன் நேரடியான ‘அவனுடைய தோலுக்கு’ என்பதைத் தமிழில் இயல்பாக ‘உடலை மூடும்’ என்று வெளிப்படுத்துகிறது.
- source_word: בַּמֶּה יִשְׁכָּב
  choice: வேறு எதைப் போர்த்திக்கொண்டு அவன் படுப்பான்?
  rationale: இது தூங்கும்போது மீதமிருக்கும் மூடுபொருள் எது என்ற சொல்லாட்சிக் கேள்வி. ‘வேறு’ என்பது சூழலில் உள்ள பற்றாக்குறையைத் தெளிவாக்குகிறது; ‘போர்த்திக்கொண்டு’ கருவிப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהָיָה כִּי יִצְעַק אֵלַי
  choice: அவன் என்னை நோக்கிக் கூக்குரலிட்டால்
  rationale: எதிர்கால நிபந்தனையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; צעק என்பதிலுள்ள துயரத்தோடும் உதவிக்காகவும் எழுப்பப்படும் வலுவான அழைப்பை ‘கூக்குரலிட்டால்’ காக்கிறது.
- source_word: וְשָׁמַעְתִּי
  choice: நான் கேட்பேன்
  rationale: שׁמע என்பதன் நேரடிப் பொருளைக் காக்கிறது; சூழலில் கடவுள் அந்த முறையீட்டைக் கேட்டு கவனிப்பார் என்ற உட்கருத்தும் தொடர்கிறது.
- source_word: חַנּוּן
  choice: இரக்கமுள்ளவர்
  rationale: பலவீனரின் கூக்குரலுக்கு அருளோடும் பரிவோடும் செவிசாய்க்கும் இறைத்தன்மையை நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: חַנּוּן என்ற இறைத் தன்மையின் மொழிபெயர்ப்பு
  choice: இரக்கமுள்ளவர்
  alternative: அருளுள்ளவர்; கருணையுள்ளவர்
  rationale: இச்சட்டச் சூழலில் ஏழையின் துயரக் கூக்குரலுக்குப் பதிலளிக்கும் கடவுளின் பரிவை ‘இரக்கமுள்ளவர்’ நேரடியாக வெளிப்படுத்துகிறது. ‘அருளுள்ளவர்’, ‘கருணையுள்ளவர்’ என்பவையும் செல்லத்தக்க பொருள் நிழல்கள்; அவற்றை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். எபிரெயச் சொல்லாட்சிக் கேள்வியின் வலிமை காக்கப்பட்டாலும், ‘தோலுக்கான ஆடை’ போன்ற தமிழில் இயல்பற்ற நேரடி வடிவம் தவிர்க்கப்பட்டுள்ளது. இறைவனின் முதலாம் நபர் உரையில் மரியாதை ஒருமைத் தன்மையைத் தெரிவிக்க ‘இரக்கமுள்ளவர்’ பயன்படுத்தப்பட்டுள்ளது.
