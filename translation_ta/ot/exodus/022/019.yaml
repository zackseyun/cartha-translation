source:
  edition: WLC
  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: ta
  text: யாவேக்கு மட்டும் பலியிடுவதைத் தவிர, வேறு எந்தத் தெய்வத்திற்கும் பலியிடுகிறவன் முற்றழிவுக்கு ஒதுக்கப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தடையின் கீழ் வைக்கப்பட வேண்டும்” அல்லது “முற்றிலும் அழிக்கப்பட வேண்டும்.” எபிரெய வினைச்சொல், மீளப்பெற முடியாதபடி அழிவுக்கு ஒதுக்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: பலியிடுகிறவன்
  rationale: Qal வினையெச்சம் இங்கு ஒருவரைக் குறிக்கும் பெயர்ச்சொல் போல் வருகிறது. பலியிடுதல் என்ற சொல், அறுத்துப் பலி செலுத்தும் வழிபாட்டுச் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לָאֱלֹהִים
  choice: வேறு எந்தத் தெய்வத்திற்காவது
  rationale: אֱלֹהִים வடிவத்தில் பன்மையாக இருந்தாலும், இச்சூழலில் யாவே அல்லாத எந்தத் தெய்வத்தையும் பொதுவாகக் குறிக்கிறது. ‘வேறு எந்தத் தெய்வத்திற்காவது’ என்பது அந்தப் பகிர்வுப் பொருளையும் யாவேயுடனான எதிர்மறை வேறுபாட்டையும் தெளிவாக்குகிறது.
- source_word: יָחֳרָם
  choice: முற்றழிவுக்கென ஒதுக்கப்பட வேண்டும்
  rationale: חרם என்பதன் Hophil வடிவம், ஒருவரை மீளப்பெற முடியாதபடி தடையின்கீழ் வைத்து அழிவுக்கு ஒப்புவிப்பதைக் குறிக்கிறது. இத்தேர்வு வெறும் கொலைத்தண்டனை என்ற அளவில் சுருக்காமல், ஒதுக்கிவைத்தல் மற்றும் அழித்தல் ஆகிய இரு நுணுக்கங்களையும் காக்கிறது.
- source_word: בִּלְתִּי
  choice: அன்றி
  rationale: இங்கு இச்சொல் விதிவிலக்கை அறிமுகப்படுத்துகிறது. ‘அன்றி’ என்பது சுருக்கமான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்கப்படுகிறது; முன்னொட்டின் ‘க்கு’ பொருளும் காக்கப்படுகிறது.
- source_word: לְבַדּוֹ
  choice: மட்டுமே
  rationale: பலியை யாவேக்கு மட்டுமே செலுத்த வேண்டும் என்ற தனிப்பட்ட உரிமையையும் விலக்கற்ற தன்மையையும் இது இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: விக்கிரகத் தெய்வத்திற்குப் பலியிடுவதற்கான தண்டனையில் חרם என்பதன் பொருள்
  choice: முற்றழிவுக்கென ஒதுக்கப்பட வேண்டும்
  alternative: முற்றிலும் அழிக்கப்பட வேண்டும்; தடையின்கீழ் வைக்கப்பட வேண்டும்
  rationale: எபிரெயச் சொல் வெறும் அழிப்பை மட்டுமல்லாமல், மீட்க முடியாத வகையில் தடைக்குள் வைத்து அழிவுக்கு ஒப்புவிக்கும் சட்ட-வழிபாட்டு கருத்தையும் தாங்குகிறது. முதன்மை மொழிபெயர்ப்பு அந்த இறையியல் மற்றும் சட்ட அழுத்தத்தைத் தக்கவைக்கிறது.
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக இடம்பெறுவதால், அதன் தனிப்பெயர் தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதியின் கடுமையையும் சுருக்கத்தையும் காக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. חרם என்பதன் வழிபாட்டு-சட்ட நுணுக்கம் அரிதான சமயக் கலைச்சொல்லால் மறைக்கப்படாமல், முதன்மை உரையிலும் அடிக்குறிப்பிலும் விளக்கப்பட்டுள்ளது.
