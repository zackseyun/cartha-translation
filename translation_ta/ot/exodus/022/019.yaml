revisions:
- from: யாவேக்கு மட்டுமே அன்றி, வேறு எந்தத் தெய்வத்திற்காவது பலியிடுகிறவன் முற்றழிவுக்கென ஒதுக்கப்பட வேண்டும்.[a]
  to: யாவேக்கு மட்டும் பலியிடுவதைத் தவிர, வேறு எந்தத் தெய்வத்திற்கும் பலியிடுகிறவன் முற்றழிவுக்கு ஒதுக்கப்பட வேண்டும்.[a]
  rationale: The revision clarifies the syntactic scope of the exception while retaining the source’s exclusive reference to Yahweh alone. It keeps the חרם penalty’s consecratory-punitive sense in the main text and preserves the principal lexical alternatives in the footnote.
  reviewer_model: gpt-5.6-terra
