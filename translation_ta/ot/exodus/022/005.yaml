revisions:
- from: நெருப்பு புறப்பட்டு முட்செடிகளைப் பற்றிக்கொண்டு,[a] குவித்து வைக்கப்பட்ட தானியமோ, அறுவடைக்கு நிற்கும் பயிரோ, வயலோ எரிந்து அழிந்தால், நெருப்பை மூட்டியவன் இழப்பை முழுமையாக ஈடுசெய்ய வேண்டும்.[b]
  to: ஒரு நெருப்பு மூண்டெழுந்து முட்செடிகளில் பற்றிக்கொண்டு,[a] குவிக்கப்பட்ட தானியக் குவியலோ, நின்றுகொண்டிருக்கும் தானியப்பயிரோ, வயலோ எரிந்து அழிந்தால், நெருப்பை மூட்டியவன் முழுமையாக இழப்பீடு செய்ய வேண்டும்.[b]
