base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: ta
  text: ஒரு நெருப்பு மூண்டெழுந்து முட்செடிகளில் பற்றிக்கொண்டு,[a] குவிக்கப்பட்ட தானியக் குவியலோ, நின்றுகொண்டிருக்கும் தானியப்பயிரோ, வயலோ எரிந்து அழிந்தால், நெருப்பை மூட்டியவன் முழுமையாக இழப்பீடு செய்ய வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முட்செடிகளை அடைந்து”; சொல்லுக்குச் சொல், “முட்செடிகளைக் கண்டு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இழப்பீடு கொடுத்தே தீர வேண்டும்.” எபிரேய மொழியில் முடிவிலா வினை வடிவமும் அதன் பின் வரும் வினையும் சேர்ந்து இந்தக் கடமையை வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: …என்றால்
  rationale: வழக்குச் சட்டத்தின் நிபந்தனையை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: תֵצֵא אֵשׁ
  choice: நெருப்பு புறப்பட்டு
  rationale: நெருப்பு அணைவதை அல்ல, மூட்டப்பட்ட இடத்திலிருந்து கட்டுப்பாடின்றிப் பரவத் தொடங்குவதைச் சுட்டுகிறது; எபிரேய உருவகத்தையும் தக்கவைக்கிறது.
- source_word: וּמָצְאָה קֹצִים
  choice: முட்செடிகளைப் பற்றிக்கொண்டு
  rationale: சொல்லுக்குச் சொல் ‘முட்களை அடைந்து’ என்றாலும், இங்கு நெருப்பு முட்செடிகளை எட்டிப் பற்றும் பொருளை இயல்பாகத் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: קֹצִים
  choice: முட்செடிகள்
  rationale: உலர்ந்த முட்கள் அல்லது முட்புதர்களைக் குறிக்கக்கூடிய சொல்லின் காட்சி மற்றும் தீ பரவும் சூழலைத் தெளிவாகக் காக்கிறது.
- source_word: וְנֶאֱכַל
  choice: எரிந்து அழிந்தால்
  rationale: அக்கினியால் ‘உண்ணப்படுதல்/முற்றிலும் அழிக்கப்படுதல்’ என்ற நிபால் வினையின் சூழல்சார்ந்த பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: גָּדִישׁ
  choice: குவித்து வைக்கப்பட்ட தானியம்
  rationale: அறுவடை செய்து குவிக்கப்பட்ட தானியக் குவியலை, நிற்கும் பயிரிலிருந்து தெளிவாக வேறுபடுத்துகிறது.
- source_word: הַקָּמָה
  choice: அறுவடைக்கு நிற்கும் பயிர்
  rationale: இன்னும் வயலில் நின்று அறுவடை செய்யப்படாத தானியப் பயிரைக் குறிக்கிறது.
- source_word: הַשָּׂדֶה
  choice: வயல்
  rationale: எளிய, நேரடியான நவீனத் தமிழ் இணைச்சொல்.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: இழப்பை முழுமையாக ஈடுசெய்ய வேண்டும்
  rationale: முற்றுவினையெச்சத்துடன் வரும் வினை வடிவம் கடமையை வலியுறுத்துகிறது; சட்டரீதியான இழப்பீட்டுப் பொருளையும் தமிழில் தெளிவாக்குகிறது.
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: நெருப்பை மூட்டியவன்
  rationale: தீக்குப் பொறுப்பான நபரை இயல்பாகவும் சுருக்கமாகவும் அடையாளப்படுத்துகிறது.
