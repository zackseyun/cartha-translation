translation_notes:
  register: நவீன நிலையான தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. அறுவடை செய்யப்பட்ட தானியம், நிற்கும் பயிர், வயல் ஆகிய மூன்று சேதப் பொருட்களும் தனித்தனியாக வைக்கப்பட்டுள்ளன; எபிரேய வலியுறுத்தல் ‘முழுமையாக … வேண்டும்’ என்றும் அடிக்குறிப்பிலும் பிரதிபலிக்கப்பட்டுள்ளது.
