  text: וָ/אֹמַ֤ר לָ/הֶם֙ לְ/מִ֣י זָהָ֔ב הִתְפָּרָ֖קוּ וַ/יִּתְּנוּ לִ֑/י וָ/אַשְׁלִכֵ֣/הוּ בָ/אֵ֔שׁ וַ/יֵּצֵ֖א הָ/עֵ֥גֶל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: ta
  text: நான் அவர்களிடம், ‘யாரிடம் தங்கம் இருக்கிறதோ, அதைக் கழற்றிக்கொள்ளுங்கள்’ என்றேன். அவர்கள் அதை என்னிடம் கொடுத்தார்கள்; நான் அதை நெருப்பில் எறிந்தேன்; இந்தக் கன்றுக்குட்டி வெளியே வந்தது.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: நான் ... என்றேன்
  rationale: வய்யிக்தோல் வடிவம் ஆரோனின் எடுத்துரைக்கப்பட்ட பேச்சை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான கதைத் தொடரை இது அளிக்கிறது.
- source_word: לְמִי זָהָב
  choice: யாரிடம் தங்கம் இருக்கிறதோ
  rationale: ‘யாருக்குத் தங்கம்?’ என்ற எபிரெய நேரடி அமைப்பு உடைமையைக் குறிக்கிறது; தமிழில் நிபந்தனைப் பொதுப்பொருளை இயல்பாக வெளிப்படுத்த இந்த வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הִתְפָּרָקוּ
  choice: அதை கழற்றுங்கள்
  rationale: פרק என்பதன் ஹித்பயேல் வடிவம் இச்சூழலில் ஒருவர் அணிந்துள்ள தங்க அணிகலன்களைத் தாமே அகற்றுவதைக் குறிக்கிறது. முந்தைய ‘தங்கம்’ என்பதிலிருந்து ‘அதை’ வருவிக்கப்படுகிறது.
- source_word: וַיִּתְּנוּ לִי
  choice: அவர்கள் அதை என்னிடம் கொடுத்தார்கள்
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் முந்தைய தங்கத்தைக் குறிக்கிறது; தெளிவான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டது.
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: நான் அதை நெருப்பில் எறிந்தேன்
  rationale: שלך என்பது எறிதல் அல்லது வீசுதலைக் குறிக்கிறது; בָאֵשׁ தமிழில் இயல்பாக ‘நெருப்பில்’ என வழங்கப்படுகிறது.
- source_word: וַיֵּצֵא הָעֵגֶל הַזֶּה
  choice: இந்தக் கன்றுக்குட்டி வெளியே வந்தது
  rationale: ஆரோனின் தவிர்க்கும் தன்மையுள்ள விளக்கத்தை எந்தக் கூடுதல் விளக்கவுரையும் இன்றி நேரடியாகப் பாதுகாக்கிறது. עֵגֶל இங்கு கன்று அல்லது இளம் காளையைக் குறிக்கும்; நிலைபெற்ற சூழல் சொல்லாக ‘கன்றுக்குட்டி’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: சிலையின் தோற்றத்தைப் பற்றிய ஆரோனின் தவிர்க்கும் விளக்கம்
  choice: ‘இந்தக் கன்றுக்குட்டி வெளியே வந்தது’ என்று எந்த விளக்கக் குறிப்பையும் சேர்க்காமல் நேரடியாக மொழிபெயர்த்தல்
  alternative: ஆரோன் பொய்யாகவோ கேலியாகவோ கூறியதாக முதன்மை உரையிலேயே வெளிப்படையாக விளக்குதல்
  rationale: வசனம் ஆரோனின் சொற்களையே தருகிறது. அதன் நகைமுரணையும் இறையியல் பதற்றத்தையும் வாசகச் சூழல் வெளிப்படுத்தும்படி விட்டு, மொழிபெயர்ப்பு தனியாகத் தீர்ப்பளிக்கக்கூடாது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘கன்றுக்குட்டி’ என்பது சிலையை இழிவுபடுத்தும் சேர்க்கையாக அல்லாமல் עֵגֶל என்பதற்கான இயல்பான சூழல் மொழிபெயர்ப்பாகப் பயன்படுத்தப்பட்டது.
