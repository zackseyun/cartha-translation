  text: וַ/יִּגֹּ֥ף יְהוָ֖ה אֶת הָ/עָ֑ם עַ֚ל אֲשֶׁ֣ר עָשׂ֣וּ אֶת הָ/עֵ֔גֶל אֲשֶׁ֥ר עָשָׂ֖ה אַהֲרֹֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/035.yaml
  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: ta
  text: ஆரோன் செய்த அந்தக் கன்றுக்குட்டியை அவர்கள் செய்ததினால், யாவே மக்களைத் தாக்கினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரோன் செய்த அந்தக் கன்றுக்குட்டியை அவர்கள் செய்ததினால், யாவே மக்களைக் கொள்ளைநோயால் தாக்கினார்.” எபிரெய வினைச்சொல்லுக்கு பொதுவாக “தாக்கினார்” என்றும், கொள்ளைநோயால் தாக்கினார் என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: கொள்ளைநோயால் தாக்கினார்
  rationale: נָגַף என்பது தாக்குதல் அல்லது துன்புறுத்துதலைக் குறிக்கும்; தெய்வீகத் தீர்ப்பின் சூழலில் கொள்ளைநோயால் வாதிப்பதையும் குறிக்கலாம். இத்தேர்வு உயிரிழப்பை வெளிப்படையாகச் சேர்க்காமல், வினையின் சூழல்சார்ந்த வலிமையை இயல்பான தமிழில் தருகிறது; பொதுவான ‘தாக்கினார்’ என்ற வாய்ப்பை அடிக்குறிப்பு காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இங்கு இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: עַל אֲשֶׁר
  choice: செய்ததற்காக
  rationale: முன்னிடைச்சொல் மற்றும் தொடர்புக் கூறின் காரணப் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עָשׂוּ אֶת הָעֵגֶל
  choice: கன்றுக்குட்டி தொடர்பாக மக்கள் செய்தது
  rationale: சொல்லுக்குச் சொல் அமைப்பு ‘அவர்கள் கன்றுக்குட்டியைச் செய்தார்கள்’ என வரலாம்; ஆனால் அடுத்த கூறு அதை ஆரோன் செய்ததாகச் சொல்கிறது. மூலத்தின் பொறுப்புச்சுமத்தலைக் காத்து, செயல் என்ன என்பதை அளவுக்கு மீறி விளக்காமல் இந்தத் தொடர்புசார் வடிவம் தரப்படுகிறது.
- source_word: הָעֵגֶל
  choice: கன்றுக்குட்டி
  rationale: பெயர்ச்சொல்லின் நேரடியான பொருள் ‘கன்றுக்குட்டி.’ இந்த வசனத்தில் இல்லாத ‘பொன்’ என்ற சொல்லை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: ஆரோன் செய்த
  rationale: அந்தக் கன்றுக்குட்டியை அடையாளப்படுத்தும் தொடர்புக் கூறைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: וַיִּגֹּף என்பதில் தெய்வீகத் தீர்ப்பின் இயல்பு
  choice: யாவே மக்களைக் கொள்ளைநோயால் தாக்கினார்
  alternative: யாவே மக்களைத் தாக்கினார்
  rationale: வினைச்சொல் தாக்குதல் அல்லது வாதிப்பதைத் தெரிவிக்கிறது; தீர்ப்புச் சூழலில் கொள்ளைநோய் சார்ந்த துன்புறுத்தல் அதன் பொருள் வரம்புக்குள் உள்ளது. இருப்பினும் மூலத்தில் தனியாக ‘கொள்ளைநோய்’ என்ற பெயர்ச்சொல் இல்லை என்பதால் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: மக்களும் ஆரோனும் கன்றுக்குட்டிக்குப் பொறுப்பான விதம்
  choice: கன்றுக்குட்டி தொடர்பாக மக்கள் செய்தது; அதை ஆரோன் செய்தான்
  alternative: மக்கள் கன்றுக்குட்டியைச் செய்தார்கள்; அதை ஆரோன் செய்தான்
  rationale: எபிரெய வாக்கியம் மக்களுக்கு பன்மை வினையையும் ஆரோனுக்கு ஒருமை வினையையும் பயன்படுத்தி இருதரப்பினரின் பொறுப்பையும் பதற்றத்துடன் இணைக்கிறது. தமிழில் முரண்பாடுபோல் தோன்றும் சொல்லுக்குச் சொல் வடிவத்தைவிட, மக்களின் செயலைத் துல்லியமின்றித் தீர்மானிக்காமல் ‘தொடர்பாக’ எனக் கூறுவது அந்தப் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘யாவே’ தனிப்பெயராக வைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தில் மக்களின் செயலும் ஆரோனின் செயலும் அருகருகே நிற்பதால் உருவாகும் பொறுப்புசார் பதற்றம் அளவுக்கு மீறி விளக்கப்படவில்லை.
