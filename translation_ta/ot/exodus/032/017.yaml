  yaml_path: translation/ot/exodus/032/017.yaml
  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: ta
  text: மக்கள் ஆரவாரம் எழுப்பியபோது[a] அவர்களுடைய சத்தத்தை யோசுவா கேட்டு, மோசேயிடம், “முகாமில் போர்ச் சத்தம் கேட்கிறது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் எழுப்பிய ஆரவாரத்தில்” / “மக்கள் கூச்சலிட்டபோது.” எபிரெயச் சொற்றொடர் மக்கள் எழுப்பிய உரத்த கூச்சலையோ ஆரவாரத்தையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேட்டு
  rationale: שׁמע என்பதன் Qal wayyiqtol வடிவம் இங்கு கதையின் தொடரில் செவியால் உணர்ந்ததைச் சுட்டுகிறது; தமிழில் தொடர்வினையெச்சமான ‘கேட்டு’ இயல்பாக அமைகிறது.
- source_word: יְהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: קוֹל
  choice: சத்தம்
  rationale: இங்கு தெளிவான பேச்சைக் காட்டிலும் மக்கள் எழுப்பிய கேட்கக்கூடிய ஒலியைக் குறிக்கிறது. இரண்டு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது எபிரெயச் சொல்லின் மீளுருவைத் தக்கவைக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இஸ்ரவேல் மக்களை ஒரு கூட்டாகக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: בְּרֵעֹה
  choice: ஆரவாரம் எழுப்பியபோது
  rationale: רוּעַ/רֵעַ சார்ந்த இவ்வடிவம் உரத்த கூச்சல் அல்லது ஆரவாரத்தை எழுப்புவதைச் சுட்டுகிறது. ஒருமை பின்னொட்டு கூட்டுப்பெயரான עָם உடன் இலக்கண ஒத்திசைவில் உள்ளது; தமிழில் பன்மைக் கருத்து இயல்பாக வெளிப்படுகிறது.
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: மோசேயிடம் … என்றார்
  rationale: வழக்கமான கதைநடைப் பேச்சுச் சூத்திரத்தை இயல்பான மரியாதைமிக்க தமிழில் வழங்குகிறது.
- source_word: קוֹל מִלְחָמָה
  choice: போர்ச் சத்தம்
  rationale: ‘போரின் சத்தம்’ என்ற மூலக் கட்டமைப்பின் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; מִלְחָמָה என்பதற்கு ‘போர்’ நேரடியான இணை.
- source_word: בַּמַּחֲנֶה
  choice: முகாமில்
  rationale: இஸ்ரவேலரின் பாளயத்தை அல்லது முகாமைச் சுட்டும் நேரடியான, தற்போதைய தமிழ் வடிவம்.
