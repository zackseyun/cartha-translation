  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: ta
  text: லேவியின் மகன்கள் மோசே சொன்னபடியே செய்தார்கள். அன்று மக்களில் ஏறக்குறைய மூவாயிரம் ஆண்கள் வீழ்ந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வீழ்ந்தார்கள்” என்பது இறந்தார்கள் அல்லது கொல்லப்பட்டார்கள் என்பதைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர்; “கொல்லப்பட்டார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: செய்தார்கள்
  rationale: עשה என்ற பொதுவான வினையின் நேரடியான கதைநடைப் பொருளைத் தருகிறது; மோசே சொன்னதை அவர்கள் நிறைவேற்றியதைச் சூழல் தெளிவுபடுத்துகிறது.
- source_word: בְנֵי לֵוִי
  choice: லேவியின் மகன்கள்
  rationale: எபிரெய மொழியின் குடும்பவழிப் பெயரிடலை நேரடியாகப் பேணுகிறது; ‘லேவியர்கள்’ என்பதும் சாத்தியம், ஆனால் இத்தேர்வு மூலத்தின் வடிவத்தைத் தெளிவாகக் காக்கிறது.
- source_word: כִּדְבַר מֹשֶׁה
  choice: மோசே சொன்னபடியே
  rationale: מֹשֶׁה என்பதற்கு இயல்பான தமிழ் வடிவமாக ‘மோசே’ பயன்படுத்தப்படுகிறது. דָּבָר இங்கு சொல் அல்லது கட்டளையைக் குறிக்கலாம்; ‘சொன்னபடியே’ என்பது ‘கட்டளை’ என வெளிப்படையாகச் சேர்க்காமல், பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיִּפֹּל
  choice: வீழ்ந்தார்கள்
  rationale: இறந்தார்கள் அல்லது கொல்லப்பட்டார்கள் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத் தன்மையைப் பேணுகிறது; காரணத்தை மூலத்தைவிட வெளிப்படையாகச் சொல்லவில்லை.
- source_word: מִן הָעָם
  choice: மக்களில்
  rationale: மக்கள் கூட்டத்திலிருந்து ஒரு பகுதியினர் என்பதைக் காட்டும் מִן என்பதன் பகுதிப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: குறிப்பிட்ட அந்த நாளைக் குறிக்கும் சொற்றொடருக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: ஏறக்குறைய மூவாயிரம் ஆண்கள்
  rationale: எண்ணுக்கு முன் வரும் כְּ என்பதன் தோராயப் பொருளை ‘ஏறக்குறைய’ தெரிவிக்கிறது; אִישׁ என்பதற்கேற்ப பாலினக் குறிப்பை ‘ஆண்கள்’ எனப் பேணுகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்புச் சூழலில் உயிரிழப்பைக் கூறும் விதம்
  choice: ஏறக்குறைய மூவாயிரம் ஆண்கள் வீழ்ந்தார்கள்
  alternative: ஏறக்குறைய மூவாயிரம் ஆண்கள் கொல்லப்பட்டார்கள் / இறந்தார்கள்
  rationale: எபிரெயம் வெளிப்படையாக ‘கொல்லப்பட்டார்கள்’ என்று சொல்லாமல் ‘வீழ்ந்தார்கள்’ என்ற மரபுத்தொடரைப் பயன்படுத்துகிறது. தேர்ந்த மொழிபெயர்ப்பு அதன் கனத்தையும் உண்மையான சொற்பொருள் இடைவெளியையும் பேணுகிறது; அடிக்குறிப்பு மரபுத்தொடரின் பொருளை விளக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மோசே சொன்னபடியே’ என்பது சொற்சொற் கட்டமைப்பைத் திணிக்காமல் மூலப் பொருளைத் தருகிறது; ‘வீழ்ந்தார்கள்’ என்ற உயர்நடைச் சொல் மூலத்தின் மரபுத்தொடரையும் அதன் தீவிரத்தையும் பேணுகிறது.
