base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: ta
  text: அவர்கள் செய்திருந்த கன்றுக்குட்டியை அவர் எடுத்து, அதை நெருப்பில் எரித்து, பொடியாகும்வரை அரைத்தார். பின்னர் அதைத் தண்ணீரின் மேற்பரப்பில் தூவி, இஸ்ரவேலின் மக்களைக்[a] குடிக்கச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் மகன்கள்”; இது இங்கு இஸ்ரவேல் மக்களனைவரையும் குறிக்கும் வழக்கமான கூட்டுப்பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵגֶל
  choice: கன்றுக்குட்டி
  rationale: עֵגֶל என்பது இளம் மாட்டைக் குறிக்கிறது; இச்சூழலில் பொற்கன்றுச் சிலையைக் குறிக்கும் பரிச்சயமான, தெளிவான சொல் ‘கன்றுக்குட்டி’.
- source_word: אֲשֶׁר עָשׂוּ
  choice: அவர்கள் செய்திருந்த
  rationale: மக்கள் முன்பே உருவாக்கிய கன்றுக்குட்டியை உறவுப்பெயர் வாக்கியம் அடையாளப்படுத்துகிறது; ‘செய்திருந்த’ என்பது நிகழ்வுகளின் காலவரிசையை இயல்பாகக் காட்டுகிறது.
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: அதை நெருப்பில் எரித்து
  rationale: בָּאֵשׁ என்பதன் உறுதியான இடப்பொருளையும் செயலைவும் இயல்பான நவீனத் தமிழில் ‘நெருப்பில்’ எனத் தருகிறது.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: பொடியாகும்வரை அரைத்தார்
  rationale: טחן என்பது அரைத்தலைக் குறிக்கிறது; דק என்பது மிக நுண்ணியதாக ஆக்கப்பட்ட நிலையைச் சொல்கிறது. தமிழில் ‘பொடியாகும்வரை’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וַיִּזֶר
  choice: தூவி
  rationale: அரைக்கப்பட்ட பொருளைத் தண்ணீரின் மேல் பரப்பிய செயலை ‘தூவி’ தெளிவாகக் காட்டுகிறது.
- source_word: עַל פְּנֵי הַמַּיִם
  choice: தண்ணீரின் மேற்பரப்பில்
  rationale: פְּנֵי என்பதன் ‘முகம்/மேற்பரப்பு’ என்ற உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களைக் குடிக்கச் செய்தார்
  rationale: שׁקה என்பதன் ஹிப்இல் வடிவிலுள்ள காரணவினைப் பொருளை ‘குடிக்கச் செய்தார்’ பாதுகாக்கிறது. בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கைச் சமூகப் பெயரைத் தமிழில் இயல்பாக ‘இஸ்ரவேலின் மக்கள்’ என வழங்குகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடி வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது உடன்படிக்கை மக்களனைவரையும் குறிக்கும் நிலையான கூட்டுப்பெயர். நவீனத் தமிழில் ‘இஸ்ரவேலின் மக்கள்’ அந்தக் கூட்டுப்பொருளைத் தெளிவாகக் கொடுக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் dignified narrative register பயன்படுத்தப்பட்டுள்ளது. ஒரே நீண்ட தொடர்வாக்கியத்தை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், எபிரெய மூலத்தின் செயல்வரிசை மாற்றப்படவில்லை.
