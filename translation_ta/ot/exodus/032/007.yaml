source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֑ה לֶךְ רֵ֕ד כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הֶעֱלֵ֖יתָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: ta
  text: பின்பு யாவே மோசேயிடம், “போய் கீழே இறங்கு; ஏனெனில் எகிப்து நாட்டிலிருந்து நீ மேலே அழைத்து வந்த உன் மக்கள் தங்களைச் சீர்கெடுத்துக்கொண்டார்கள்[a]” என்று கூறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீர்கேடாக நடந்துகொண்டார்கள்.” எபிரெய வினைச்சொல், தங்களையே சீர்கெடுத்துக்கொண்டார்கள் என்ற விளைவைக் காட்டுவதற்குப் பதிலாகச் சீர்கெட்ட நடத்தையை வலியுறுத்துமாறும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் ‘பின்பு’ இயல்பான தொடர்ச்சியைக் காட்டுகிறது. நேரடி உரையை அறிமுகப்படுத்த ‘என்றார்’ பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לֶךְ רֵד
  choice: நீ கீழே போ
  rationale: எபிரெய உரையில் לֶךְ என்பது துணைச் செயல் இயக்கத்தையும் רֵד என்பது பிரதான கட்டளையான ‘இறங்கு’ என்பதையும் சேர்த்து ஒரே இயல்பான கட்டளையாக அமைகின்றன; தமிழில் இரண்டையும் சொற்சொல்லாக இரட்டிப்பது இயல்பற்றது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னுள்ள கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: שִׁחֵת
  choice: தங்களைச் சீர்கெடுத்துக்கொண்டார்கள்
  rationale: பியேல் வடிவம் இச்சூழலில் மக்களின் குற்றத்திற்குரிய, அழிவை உண்டாக்கும் சீர்கேட்டை உணர்த்துகிறது. தமிழின் தற்சுட்டு அமைப்பு அவர்கள் தங்களையே சீர்கெடுத்த விளைவைத் தெளிவாக்குகிறது.
- source_word: עַמְּךָ
  choice: உன் மக்கள்
  rationale: இரண்டாம் நபர் உரிமைப்பெயரைப் பாதுகாக்கிறது; இஸ்ரவேலை மோசேயோடு தொடர்புபடுத்திப் பேசும் வசனத்தின் கூர்மையான சொல்லாட்சியையும் தக்கவைக்கிறது.
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: நீ மேலே அழைத்துவந்த
  rationale: העלה என்பதன் ஏற்றிச் செல்லும் பொருளையும், வெளியேற்ற நிகழ்வில் மோசே செய்பவராகச் சொல்லப்படும் உரையின் நோக்கமுள்ள பதற்றத்தையும் பாதுகாக்கிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: ‘எகிப்து தேசத்திலிருந்து’ என்ற மூலத்தின் முழுக் கருத்தை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, அதன் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
- issue: שִׁחֵת என்பதன் தற்சுட்டுப் பொருள்
  choice: தங்களைச் சீர்கெடுத்துக்கொண்டார்கள்
  alternative: சீர்கேடாக நடந்துகொண்டார்கள்
  rationale: இச்சூழலில் செயலின் ஒழுக்கச் சீர்கேட்டையும் அதன் அழிவூட்டும் விளைவையும் தெரிவிக்கிறது; அதேவேளை நடத்தை மீது வலியுறுத்தும் மாற்று மொழிபெயர்ப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘உன் மக்கள்’ என்ற தெய்வீக உரையின் பதற்றம்
  choice: உன் மக்கள்
  alternative: மக்கள் / என் மக்கள்
  rationale: עַמְּךָ என்பதை அப்படியே பாதுகாப்பது பொற்கன்றுச் சம்பவத்தால் ஏற்பட்ட உறவுப் பிளவை உணர்த்தும் உரையின் பதற்றத்தைத் தீர்த்துவிடாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘யாவே’ தனிப்பெயராகப் பாதுகாக்கப்பட்டுள்ளது; ‘உன் மக்கள்’ மற்றும் ‘நீ மேலே அழைத்துவந்த’ ஆகியவை மூல உரையின் திட்டமிட்ட இறையியல் பதற்றத்தை மென்மையாக்காமல் வழங்குகின்றன.
