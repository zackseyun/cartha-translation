source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה מִ֚י אֲשֶׁ֣ר חָֽטָא לִ֔/י אֶמְחֶ֖/נּוּ מִ/סִּפְרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: ta
  text: யெகோவா மோசேயிடம், “எனக்கு எதிராகப் பாவம் செய்தவன் எவனாயினும், அவனை என் புத்தகத்திலிருந்து துடைத்துவிடுவேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனை என் புத்தகத்திலிருந்து அழித்துவிடுவேன்.” ‘என் புத்தகம்’ என்பது கடவுளுடைய பராமரிப்பின் கீழ் இருப்பவர்களின் பதிவைக் குறிக்கலாம்; சிலர் இதை இன்னும் குறிப்பாக ‘வாழ்வின் புத்தகம்’ எனப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: வாவ் தொடர்வினை கதையின் தொடர்ச்சியை முன்னெடுக்கிறது; தமிழில் தனியாக ‘அப்பொழுது’ அல்லது ‘மேலும்’ சேர்க்காமல், இயல்பான வாக்கியத் தொடரால் அது வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இது பதவிப்பெயரால் மாற்றப்படாமல், தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட வடிவில் இறைத் திருப்பெயரைத் தருகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: אֶל என்பதன் திசை/பெறுநர் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִי אֲשֶׁר
  choice: எவனோ
  rationale: குறிப்பிடப்படாத ஒருவரைக் குறிக்கும் தொடர்புக் கட்டமைப்பின் பொதுமைப்படுத்தும் வலிமையைப் பேணுகிறது.
- source_word: חָטָא לִי
  choice: எனக்கு எதிராகப் பாவம் செய்தவன்
  rationale: חטא உடன் வரும் לִי, பாவம் கடவுளுக்கு எதிராகச் செய்யப்பட்டதைச் சுட்டுகிறது; நிறைவுற்ற செயலை ‘செய்தவன்’ வெளிப்படுத்துகிறது.
- source_word: אֶמְחֶנּוּ
  choice: அவனை ... அழித்துவிடுவேன்
  rationale: מחה என்பது எழுதப்பட்ட பதிவிலிருந்து துடைத்தல் அல்லது அழித்தல் என்ற உருவகத்தைத் தருகிறது; ஆண்பால் ஒருமை பின்னொட்டு ‘அவனை’ எனப் பேணப்பட்டுள்ளது.
- source_word: מִסִּפְרִי
  choice: என் புத்தகத்திலிருந்து
  rationale: סֵפֶר என்பதைக் ‘புத்தகம்’ என நேரடியாகத் தருகிறது; מן முன்னொட்டு நீக்கத்தின் மூலத்தை ‘-இலிருந்து’ எனக் குறிக்கிறது.
theological_decisions:
- issue: ‘என் புத்தகம்’ என்பதன் இயல்பு
  choice: ‘என் புத்தகம்’ என்ற உருவகத்தை விளக்கிக் குறிப்பாக்காமல் அப்படியே வைத்தல்
  alternative: ‘வாழ்வின் புத்தகம்’, ‘உயிருள்ளோரின் பதிவு’ அல்லது ‘உடன்படிக்கைப் பதிவு’
  rationale: எபிரெய உரை ‘என் புத்தகம்’ என்று மட்டுமே கூறுகிறது. அது யாரைக் குறிக்கும் எந்த வகைப் பதிவு என்பதை மொழிபெயர்ப்பே தீர்மானிக்காமல், மூலத்தின் இறையியல் திறந்தநிலையைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘எவனோ ... அவனை’ என்ற அமைப்பு எபிரெய மூலத்தின் ஆண்பால் ஒருமை வடிவையும் பொதுமைப்படுத்தும் பொருளையும் பேணுகிறது. அடிக்குறி குறியீடு தொடர்புடைய வாக்கியத்தின் முடிவில் இடம்பெற்றுள்ளது.
