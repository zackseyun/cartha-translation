base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: ta
  text: யாவே மோசேயிடம், “இந்த மக்களை நான் பார்த்திருக்கிறேன். இதோ, இவர்கள் கழுத்தை வளைக்காத மக்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதப்பெயரான יהוה என்பதை ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தமிழின் வழக்கமான மேற்கோள் அமைப்புக்கேற்ப வாக்கிய முடிவில் வைக்கப்பட்டுள்ளது.
- source_word: רָאִיתִי
  choice: நான் பார்த்திருக்கிறேன்
  rationale: முடிவுற்ற பார்வையிடுதலின் தற்போதைய விளைவைத் தொடர்ந்து வரும் மதிப்பீட்டுடன் இணைக்கிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களை
  rationale: עָם என்பதன் கூட்டுப் பொருளையும் הַזֶּה என்பதன் சுட்டும், ஓரளவு விலக்கி நிறுத்தும் தொனியையும் காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து அடுத்து வரும் மதிப்பீட்டை வலியுறுத்தும் எபிரெயச் சொற்பயன்பாட்டை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: קְשֵׁה עֹרֶף
  choice: கழுத்தை வளைக்காத
  rationale: பிடிவாதத்தையும் கீழ்ப்படிய மறுப்பதையும் குறிக்கும் எபிரெய உருவகத்தை, வெறும் ‘பிடிவாதமான’ என்று தட்டையாக்காமல், தமிழில் புரியக்கூடிய உருவகமாகக் காக்கிறது.
- source_word: הוּא
  choice: இவர்கள் ... மக்கள்
  rationale: எபிரெயில் ஒருமைக் கூட்டுப்பெயரைச் சுட்டும் பிரதிப்பெயர் தமிழில் இயல்பாகப் பன்மை மனிதக் குறிப்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் பெயராகவே காக்கிறது; ‘யெகோவா’ என்பதைக் காட்டிலும் எபிரெயப் பெயரின் ஏற்றுக்கொள்ளப்பட்ட மறுவடிவ உச்சரிப்புக்கு நெருக்கமானது.
- issue: קְשֵׁה עֹרֶף என்ற உருவகத்தின் பொருள்
  choice: கழுத்தை வளைக்காத மக்கள்
  alternative: பிடிவாதமான மக்கள்
  rationale: மக்களின் பிடிவாதம் மட்டுமல்ல, வழிநடத்தப்படவோ கீழ்ப்படியவோ மறுக்கும் எதிர்ப்பையும் உணர்த்தும் மூல உருவகத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளையில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் மூலத்தின் கவன ஈர்ப்பு வலிமையைத் தக்கவைக்கிறது; ‘கழுத்தை வளைக்காத’ என்பது எபிரெய உருவகத்தையும் அதன் இயல்பான தமிழ்ப் பொருளையும் சமநிலைப்படுத்துகிறது.
