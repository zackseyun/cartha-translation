base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: ta
  text: ஆனால் இப்போது[a], நீர் அவர்களுடைய பாவத்தை மன்னித்தால்—மன்னிக்காவிட்டால், தயவுசெய்து நீர் எழுதிய உமது புத்தகத்திலிருந்து என்னைத் துடைத்து நீக்கிவிடுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுடைய பாவத்தைச் சுமந்து அகற்றினால்’ அல்லது ‘பொறுத்தருளினால்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேய மரபுத்தொடர் சொல்லுக்குச் சொல் ‘பாவத்தைத் தூக்குதல்/சுமத்தல்’ என்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உமது புத்தகம்’ என்பது உயிரோடிருப்பவர்களைப் பற்றிய இறைப் பதிவையோ, விரிவான பொருளில் ஜீவ புத்தகத்தையோ குறிக்கலாம்; எபிரேய உரை இதை மேலும் விளக்கவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆனால் இப்போது
  rationale: முந்தைய பரிந்துரையைத் தொடர்ந்து மோசேயின் அவசர வேண்டுதலில் ஏற்படும் எதிர்மறைத் திருப்பத்தைச் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
- source_word: תִּשָּׂא חַטָּאתָם
  choice: அவர்களுடைய பாவத்தை மன்னித்தால்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல்/சுமத்தல்’; ‘பாவம்’ என்பதோடு வரும் எபிரேய மரபுத்தொடர் பாவத்தை அகற்றுதல் அல்லது மன்னித்தலைக் குறிக்கிறது. இயல்பான தமிழில் ‘மன்னித்தால்’ தெளிவாக உள்ளது.
- source_word: וְאִם אַיִן
  choice: மன்னிக்காவிட்டால்
  rationale: எபிரேயத்தில் இது விடுபட்ட கூறுடைய எதிர்மறை நிபந்தனை. தமிழில் முன் வினையை மீண்டும் சேர்ப்பது பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: מְחֵנִי נָא
  choice: என்னை அழித்துவிடும்
  rationale: מחה என்பது எழுத்தையோ பெயரையோ துடைத்து நீக்குவதைக் குறிக்கிறது. புத்தக உருவகத்துடன் ‘அழித்துவிடும்’ பொருந்துகிறது; நָא-வின் மன்றாட்டுத் தொனி மரியாதைமிக்க வேண்டுகோள் வினைமுற்றில் வெளிப்படுகிறது.
- source_word: מִסִּפְרְךָ
  choice: உமது புத்தகத்திலிருந்து
  rationale: סֵפֶר என்பது புத்தகம், சுருள் அல்லது எழுத்துப் பதிவு எனப் பொருள்படலாம். ‘புத்தகம்’ மூலத்தின் தெளிவின்மையைத் தீர்மானிக்காமல் காக்கிறது.
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: நீர் எழுதிய
  rationale: அந்தப் புத்தகத்தை இறைவனே எழுதியதாகக் குறிப்பிடும் உறவுப்பெயர் தொடரைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘உமது புத்தகம்’ என்பதன் இயல்பு
  choice: உமது புத்தகம்
  alternative: உமது சுருள் / உமது பதிவு / ஜீவ புத்தகம்
  rationale: எபிரேய உரை அந்தப் புத்தகம் எதைக் குறிக்கிறது என்று மேலும் வரையறுக்கவில்லை. ‘ஜீவ புத்தகம்’ எனத் தெளிவுபடுத்துவது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும்; ஆகவே இறையியல் பதற்றமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
- issue: முதல் நிபந்தனை வாக்கியத்தின் முற்றுப்பெறாத தன்மை
  choice: மன்னித்தால்—
  alternative: மன்னித்தருளும்
  rationale: மூல எபிரேயத்தில் ‘நீர் அவர்களுடைய பாவத்தை மன்னித்தால்...’ என்ற நிபந்தனைக்கான விளைவு சொல்லப்படாமல் விடப்பட்டுள்ளது. கோடு அந்த உணர்ச்சிமிக்க இடைநிறுத்தத்தைப் பாதுகாக்கிறது; மறைந்துள்ள வேண்டுகோளைச் சேர்த்து வாக்கியத்தைத் தீர்மானமாக முடிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்’, ‘உமது’ இடம்பெறுகின்றன. மூலத்தின் முற்றுப்பெறாத முதல் நிபந்தனை நீண்ட கோட்டால் காக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறிகள் பிரதான உரையில் இரண்டும் இடம்பெற்றுள்ளன.
