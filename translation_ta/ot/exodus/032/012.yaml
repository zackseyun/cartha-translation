- from: எகிப்தியர்கள், ‘தீய நோக்கத்தோடுதான் அவர் அவர்களை வெளியே கொண்டுவந்தார்—மலைகளில் அவர்களைக் கொன்று, பூமியின் மேற்பரப்பிலிருந்து அவர்களை முற்றிலும் அழித்துப்போடுவதற்காக’ என்று ஏன் சொல்ல வேண்டும்?[a] உமது கொழுந்துவிட்டு எரியும் கோபத்தை விட்டுத் திரும்பும்; உமது மக்களுக்கு நேரவிருக்கும் அழிவைக் குறித்து மனமிரங்கும்.[b]
  to: எகிப்தியர்கள், ‘தீய நோக்கத்துடன்தான் அவர் அவர்களை வெளியே கொண்டுவந்தார்—மலைகளில் அவர்களைக் கொன்று, பூமியின் மேற்பரப்பிலிருந்து அவர்களை முற்றிலும் அழித்துப்போடுவதற்காக’ என்று ஏன் சொல்ல வேண்டும்?[a] உமது எரியும் கோபத்தை விட்டுத் திரும்புங்கள்; உமது மக்களுக்கு நேரவிருக்கும் தீங்கைப் பற்றி மனம் மாறுங்கள்.[b]
  rationale: 'திருத்தம் இரண்டு இடங்களில் மட்டுமே செய்யப்பட்டுள்ளது: இயல்பற்ற கட்டளை வடிவம் நவீன மரியாதைப் பன்மை வடிவமாகச் சரிசெய்யப்பட்டுள்ளது; மேலும் ‘மனமிரங்கும்’ என்பதற்குப் பதிலாக ‘மனம் மாறுங்கள்’ பயன்படுத்தப்பட்டதால், נחם வினையின் இச்சூழலிலான ‘தீங்கிலிருந்து விலகுதல்/நடவடிக்கையை மாற்றுதல்’ என்ற பொருள் பாதுகாக்கப்படுகிறது. பிற கூறுகள் மூலத்தின் பொருளுக்கும் தமிழின் நடைமுறைக்கும் ஏற்றவையாக உள்ளன.'
