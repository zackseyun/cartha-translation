base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: ta
  text: எகிப்தியர்கள், ‘தீய நோக்கத்துடன்தான் அவர் அவர்களை வெளியே கொண்டுவந்தார்—மலைகளில் அவர்களைக் கொன்று, பூமியின் மேற்பரப்பிலிருந்து அவர்களை முற்றிலும் அழித்துப்போடுவதற்காக’ என்று ஏன் சொல்ல வேண்டும்?[a] உமது எரியும் கோபத்தை விட்டுத் திரும்புங்கள்; உமது மக்களுக்கு நேரவிருக்கும் தீங்கைப் பற்றி மனம் மாறுங்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீய நோக்கத்துடன்” என்பதற்கு மாற்றாக, “தீங்கு செய்வதற்காக” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர், கடவுளின் நோக்கத்தைப் பற்றி எகிப்தியர்கள் சுமத்தக்கூடிய குற்றச்சாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “மனம் மாறுங்கள்” என்பதற்கு மாற்றாக, “இந்தத் தீங்கை விலக்குங்கள்” அல்லது “உமது மக்களுக்கு வரவிருக்கும் பேரழிவைப் பற்றிய உங்கள் முடிவை மாற்றுங்கள்” என்றும் மொழிபெயர்க்கலாம். மோசேயின் வேண்டுகோளில் எபிரெயம் கடவுளைப் பற்றி மனித உறவுசார் மொழியைப் பயன்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: எகிப்தியர்கள் ... என்று ஏன் சொல்ல வேண்டும்?
  rationale: லָמָּה உடன் வரும் imperfect வினைச்சொல் மோசேயின் வாதமுறையிலான கேள்வியை வெளிப்படுத்துகிறது; நவீனத் தமிழில் இயல்பாக இவ்வாறு அமைகிறது.
- source_word: בְּרָעָה
  choice: தீய நோக்கத்தோடுதான்
  rationale: எகிப்தியர்கள் கடவுள்மீது சுமத்தக்கூடிய தீங்கான உள்நோக்கத்தைக் குறிக்கிறது; ‘தான்’ குற்றச்சாட்டின் வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: הוֹצִיאָם
  choice: அவர் அவர்களை வெளியே கொண்டுவந்தார்
  rationale: யாத்திராகமச் சூழலில் Hiphil வடிவத்தின் காரணவினைப் பொருளை நேரடியாகத் தருகிறது.
- source_word: לַהֲרֹג אֹתָם בֶּהָרִים
  choice: மலைகளில் அவர்களைக் கொன்று
  rationale: நோக்கத்தைக் குறிக்கும் infinitive-ஐ அடுத்த இணையான நோக்கக் கூறுடன் இயல்பான தமிழில் இணைக்கிறது.
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: பூமியின் மேற்பரப்பிலிருந்து அவர்களை முற்றிலும் அழித்துப்போடுவதற்காக
  rationale: כּלה Piel-இன் முழுமையான அழிவு உணர்வையும் ‘பூமியின் மேற்பரப்பிலிருந்து’ என்ற எபிரெய மொழிவழக்கையும் பாதுகாக்கிறது.
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: உமது கொழுந்துவிட்டு எரியும் கோபத்தை விட்டுத் திரும்பும்
  rationale: கோபத்தின் எரியும் வெப்பத்தைச் சித்தரிக்கும் எபிரெய உருவகத்தையும் கட்டளை வேண்டுகோளையும் காக்கிறது.
- source_word: וְהִנָּחֵם עַל הָרָעָה לְעַמֶּךָ
  choice: உமது மக்களுக்கு நேரவிருக்கும் அழிவைக் குறித்து மனமிரங்கும்
  rationale: נחם Niphal-இன் இச்சூழலிலான மனமிரங்கி நடவடிக்கையிலிருந்து பின்வாங்கும் வேண்டுகோளைத் தருகிறது; רעה இங்கு ஒழுக்கத் தீமையல்ல, மக்கள்மேல் வரவிருக்கும் அழிவைக் குறிக்கிறது.
theological_decisions:
- issue: וְהִנָּחֵם என்பதில் கடவுளைப் பற்றிய மனித உணர்வு சார்ந்த மொழி
  choice: மனமிரங்கும்
  alternative: மனதை மாற்றிக்கொள்ளும் / வருந்தும் / அழிவைக் கைவிடும்
  rationale: மோசேயின் வேண்டுகோளின் உண்மையான உறவுசார் வலிமையைப் பாதுகாக்கிறது; கடவுள் ஒழுக்கத் தவறு செய்ததாகக் குறிக்காமலும், உரையின் இறையியல் அழுத்தத்தை நீக்காமலும் உள்ளது.
- issue: கடவுளின் எச்சரிக்கப்பட்ட நடவடிக்கையைக் குறிக்கும் הָרָעָה
  choice: அழிவு
  alternative: தீங்கு / பேரழிவு / தீமை
  rationale: முன்னுள்ள בְּרָעָה-வின் ‘தீய நோக்கம்’ என்பதிலிருந்து வேறுபடுத்தி, இங்கு மக்களுக்கு வரவிருக்கும் தண்டனைசார் அழிவைக் காட்டுகிறது; கடவுளுக்கு ஒழுக்கத் தீமையைச் சுமத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வேண்டுகோள் நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பன்மை வினைமுற்றுகளும் ‘உமது’ என்ற மரியாதை வடிவமும் வைக்கப்பட்டுள்ளன. மூலத்தின் வாதமுறைக் கேள்வி, அழிவு உருவகம், கடவுள் மனமிரங்க வேண்டும் என்ற இறையியல் அழுத்தம் ஆகியவை மென்மைப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
