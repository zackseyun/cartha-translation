  source_fidelity: முதல் வேண்டுகோள் மூலத்தின் வாதமுறைக் கேள்வியையும், எகிப்தியர்கள் கடவுள்மீது சுமத்தக்கூடிய ‘தீய நோக்க’க் குற்றச்சாட்டையும் பெரும்பாலும் துல்லியமாகத் தருகிறது. ஆனால் ‘மனமிரங்கும்’ என்பது נחם (Niphal) இன் இச்சூழல் பொருளான ‘மனம் மாறுதல்/தீர்மானித்த தீங்கிலிருந்து விலகுதல்’ என்பதற்குப் பதிலாக இரக்க உணர்வை முதன்மைப்படுத்துகிறது. எனவே இறுதிக் கட்டளை திருத்தப்பட வேண்டும்.
  naturalness: ‘உமது கொழுந்துவிட்டு எரியும் கோபத்தை விட்டுத் திரும்பும்’ என்பது நவீன நிலையான தமிழில் இயல்பற்றது; குறிப்பாக ‘திரும்பும்’ இங்கு தெளிவான மரியாதைப் பன்மைக் கட்டளையாக அமையவில்லை. ‘உமது எரியும் கோபத்தை விட்டுத் திரும்புங்கள்’ இயல்பாகவும் மூல உருவகத்திற்கு நெருக்கமாகவும் உள்ளது. ‘மனம் மாறுங்கள்’ நவீனத் தமிழில் தெளிவானது.
  terminology: ‘தீய நோக்கத்துடன்’ முதலாவது רָעָה-வுக்கு ஏற்றது. இறுதியில் ‘தீங்கு’ என்பது கடவுளின் எச்சரிக்கப்பட்ட தண்டனைச் செயலுக்கான הָרָעָה-வை, ஒழுக்கத் தீமை என்று தவறாகக் குறிக்காமல் நன்றாக வேறுபடுத்துகிறது. ‘மனம் மாறுங்கள்’ மனித உறவுசார் மொழியின் அழுத்தத்தைப் பாதுகாக்கிறது; எந்தக் குறிப்பிட்ட இறையியல் விளக்கத்தையும் திணிப்பதில்லை.
  issues:
