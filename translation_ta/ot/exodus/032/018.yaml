  text: וַ/יֹּ֗אמֶר אֵ֥ין קוֹל֙ עֲנ֣וֹת גְּבוּרָ֔ה וְ/אֵ֥ין ק֖וֹל עֲנ֣וֹת חֲלוּשָׁ֑ה ק֣וֹל עַנּ֔וֹת אָנֹכִ֖י שֹׁמֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
translation:
  language: ta
  text: அதற்கு அவர், “இது வெற்றிக் கூச்சலின் சத்தமல்ல; தோல்விக் கூச்சலின் சத்தமுமல்ல; பாடலின் சத்தத்தையே நான் கேட்கிறேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூச்சலின் சத்தத்தையே நான் கேட்கிறேன்.” ענה என்பதிலிருந்து வந்த எபிரெய வடிவங்கள் பதிலளிக்கும் குரலொலியையோ கூச்சலையோ குறிக்கலாம்; எனவே இறுதிக் கூறையும் பொதுவாக இவ்வாறு மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹת / עַנּוֹת
  choice: முழக்கம் / கதறல் / பாடல்
  rationale: இச்சூழலில் ענה என்பதிலிருந்து வந்த வடிவங்கள் மனிதர்களின் எதிரொலிக்கும் குரலொலியைக் குறிக்கின்றன. முதல் இரு கூறுகளில் வெற்றி, தோல்வி என்பவற்றோடு இணைவதால் முறையே போர்முழக்கமும் தோற்றோரின் கதறலும் இயல்பானவை; இறுதிக் கூறில் கன்றுக்குட்டியைச் சுற்றிய களியாட்டச் சூழலுக்கேற்ப ‘பாடல்’ பொருந்துகிறது. எபிரெயச் சொல்லின் பொதுவான ‘கூச்சல்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: גְּבוּרָה
  choice: வெற்றி
  rationale: அடிப்படைப் பொருள் ‘வலிமை/வீரம்’ என்றாலும், எதிர்மறையாக அமைந்த போர்ச் சூழல் இணைப்பில் வெற்றியைக் கொண்டாடும் முழக்கத்தைக் குறிக்கிறது.
- source_word: חֲלוּשָׁה
  choice: தோல்வியுற்றோர்
  rationale: இச்சொல் ‘பலவீனம்’ என்பதோடு தொடர்புடையது; גְּבוּרָה என்பதற்கு எதிராக இங்கு போரில் முறியடிக்கப்பட்டவர்களின் நிலையைச் சுட்டுகிறது. தமிழில் ‘தோல்வியுற்றோரின் கதறல்’ இயல்பாக அந்தப் பொருளை வெளிப்படுத்துகிறது.
- source_word: קוֹל
  choice: சத்தம்
  rationale: மூன்று இடங்களிலும் பேச்சை மட்டும் குறிக்காமல் கேட்கப்படும் ஒலியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֵין
  choice: அல்ல
  rationale: மீண்டும் வரும் ‘இது ... சத்தம் அல்ல’ என்ற மறுப்புக் கட்டமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: நான் கேட்கிறேன்
  rationale: தனிப்பெயருடன் வரும் நிகழ்காலப் பங்கேற்பு, அச்சமயம் நிகழும் செவிப்புல உணர்வைத் தெரிவிக்கிறது.
- source_word: וַיֹּאמֶר
  choice: அதற்கு அவர் ... என்றார்
  rationale: வழக்கமான எபிரெயக் கதைத் தொடரை, முந்தைய பேச்சுக்கான பதிலாக இயல்பான தமிழ் நடையில் வெளிப்படுத்துகிறது.
