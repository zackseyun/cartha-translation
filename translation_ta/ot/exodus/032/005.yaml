base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: ta
  text: ஆரோன் அதைக் கண்டபோது, அதற்கு முன்பாக[a] ஒரு பலிபீடத்தைக் கட்டினான். பின்னர் ஆரோன், “நாளை யாவேக்கு ஒரு பண்டிகை” என்று அறிவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆரோனுக்கு முன்பாக.” எபிரேயப் பிரதிப்பெயர் இலக்கணரீதியாக ஆரோனைக் குறிக்கக்கூடும்; ஆயினும் சூழல் அது கன்றுக்குட்டியைக் குறிப்பதையே அதிகமாக ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: ஆரோன் அதைக் கண்டபோது
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘கண்டான்’. எபிரேயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள், முந்தைய வசனத்தில் செய்யப்பட்ட கன்றுக்குட்டியைச் சூழலிலிருந்து குறிக்கிறது; தொடக்க வாவ் தொடர் இங்கு இயல்பான காலத் தொடர்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: ஒரு பலிபீடத்தைக் கட்டினான்
  rationale: בנה + מזבח என்பதற்கான நேரடியான, தமிழில் இயல்பான வழிபாட்டுச் சொற்றொடர்.
- source_word: לְפָנָיו
  choice: அதற்கு முன்பாக
  rationale: ஆண்பால் ஒருமை பின்னொட்டு இலக்கணரீதியாக ஆரோனையோ கன்றுக்குட்டியையோ குறிக்கலாம்; கதைச்சூழல் புதிதாகச் செய்யப்பட்ட கன்றுக்குட்டியையே அதிகமாகச் சுட்டுகிறது. ‘அதற்கு’ என்பது உருவத்துக்கு ஆள்தன்மையைச் சேர்க்காமல் இதை வெளிப்படுத்துகிறது.
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  choice: என்று அறிவித்தான்
  rationale: קרא இங்கு பொதுவான அறிவிப்பைக் குறிக்கிறது; அதைத் தொடர்ந்து வரும் ‘சொன்னான்’ என்ற வினையின் உள்ளடக்கம் தமிழில் மேற்கோளுடன் ஒரே இயல்பான வாக்கியமாகச் சுருக்கப்படுகிறது.
- source_word: חַג
  choice: ஒரு பண்டிகை
  rationale: חג என்பது வழிபாட்டுத் தொடர்புடைய விழா அல்லது பண்டிகையைக் குறிக்கிறது. ‘பண்டிகை’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; ‘யாத்திரைப் பண்டிகை’ என்பது இச்சூழலில் தேவைக்கு மீறிய குறிப்பாகும்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்கப்படுகிறது.
- source_word: מָחָר
  choice: நாளை
  rationale: எபிரேய பெயர்ச்சொல் வாக்கியத்தின் சுருக்கத்தைப் பேணுகிறது; தமிழில் ‘நாளை யாவேக்கு ஒரு பண்டிகை’ என்பது அறிவிப்பாக இயல்பாகப் புரிகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் உடன்படிக்கைப் பெயராகத் தெளிவாகப் பேணுகிறது.
- issue: לְפָנָיו என்பதிலுள்ள பிரதிப்பெயரின் குறிப்பு
  choice: பலிபீடம் கன்றுக்குட்டி/உருவத்துக்கு முன்பாகக் கட்டப்பட்டது
  alternative: பலிபீடம் ஆரோனுக்கு முன்பாகக் கட்டப்பட்டது
  rationale: பின்னொட்டு இலக்கணரீதியாக இரண்டையும் அனுமதித்தாலும், உடனடி கதைச்சூழலில் புதிதாக உருவாக்கப்பட்ட கன்றுக்குட்டியே மிகவும் பொருத்தமான குறிப்பு. மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேயத்தின் சுருக்கமான அறிவிப்பு வடிவம் பேணப்பட்டு, பிரதிப்பெயரின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
