  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: ta
  text: மறுநாள் மோசே மக்களிடம், “நீங்கள் ஒரு பெரிய பாவம் செய்திருக்கிறீர்கள்[a]. இப்போது நான் யாவேயிடம் ஏறிப் போவேன்; ஒருவேளை உங்கள் பாவத்திற்காக நான் பாவநிவிர்த்தி செய்யலாம்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒரு பெரிய பாவம் செய்திருக்கிறீர்கள்” என்பதற்கான எபிரெயச் சொற்றொடரில், “பாவம் செய்தீர்கள்—ஒரு பெரிய பாவம்” என்று ஒரே வேரைச் சேர்ந்த சொற்கள் மீண்டும் வருகின்றன; இது குற்றத்தின் கடுமையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: மறுநாள்
  rationale: எபிரெயக் கதைத் தொடரில் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் இயல்பான காலக்குறிப்பு. ‘அது நிகழ்ந்தது’ என்பதைச் சொற்சொல்லாகச் சேர்க்காமல், அதன் உரையாடல் செயல்பாட்டை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: மோசே மக்களிடம் ... என்றார்
  rationale: אמר ... אל என்பதன் வழக்கமான உரையாற்றும் பொருளைத் தமிழின் இயல்பான நேரடி உரை அமைப்பில் தருகிறது.
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: நீங்கள் மிகப் பெரிய பாவம் செய்துவிட்டீர்கள்
  rationale: வெளிப்படையாக உள்ள பன்மை முன்னிலையை ‘நீங்கள்’ என்று தக்கவைத்து, பாவத்தின் கடுமையை ‘மிகப் பெரிய பாவம்’ என வெளிப்படுத்துகிறது. ‘செய்துவிட்டீர்கள்’ முடிந்த செயலின் தற்போதைய விளைவை உணர்த்துகிறது.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: குற்றச்சாட்டிலிருந்து மோசேயின் அடுத்த நடவடிக்கைக்கான மாற்றத்தைத் தெளிவாகக் குறிக்கிறது; தமிழில் தேவையற்ற இணைப்புச் சொல்லைச் சேர்க்காமல் இயல்பாக உள்ளது.
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: நான் யாவேயிடம் ஏறிப் போவேன்
  rationale: עלה என்பதன் மேலே செல்வதையும், மலையில் தேவனுடைய முன்னிலைக்குச் செல்லும் சூழலையும் ‘ஏறிப் போவேன்’ இயல்பாகப் பாதுகாக்கிறது. יהוה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: אוּלַי
  choice: ஒருவேளை
  rationale: மோசேயின் முயற்சியின் முடிவு உறுதியானது அல்ல என்பதையும், நம்பிக்கையுடன் கூடிய சாத்தியத்தையும் வெளிப்படுத்துகிறது.
- source_word: אֲכַפְּרָה בְּעַד חַטַּאתְכֶם
  choice: உங்கள் பாவத்திற்காகப் பாவநிவிர்த்தி செய்ய முடியலாம்
  rationale: כפר என்பதன் வழிபாட்டு மற்றும் பரிந்துபேசும் சூழலுக்குரிய பொருளை ‘பாவநிவிர்த்தி செய்ய’ எனத் தருகிறது. בעד என்பதன் சார்பான/நன்மைக்கான உறவை ‘உங்கள் பாவத்திற்காக’ எனச் சுருக்கமாக வெளிப்படுத்துகிறது; ‘முடியலாம்’ என்பது אוּלַי உடன் சேர்ந்துள்ள நிச்சயமின்மையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- issue: மோசே பாவநிவிர்த்தி செய்யும் கூற்றின் வலிமை
  choice: ஒருவேளை ... பாவநிவிர்த்தி செய்ய முடியலாம்
  alternative: உங்கள் பாவத்திற்குப் பாவநிவிர்த்தி செய்வேன்
  rationale: மூலத்தின் אוּלַי வெளிப்படுத்தும் நம்பிக்கையோடு கூடிய நிச்சயமின்மையைப் பாதுகாக்கிறது; மோசேயின் முயற்சி வெற்றி பெறும் என்று வசனம் தராத உறுதியைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. ‘பாவநிவிர்த்தி’ என்ற நிலைபெற்ற இறையியல் சொல் சூழலின் வழிபாட்டு அர்த்தத்தைப் பாதுகாக்கிறது; அதே நேரத்தில் வசனத்தின் நிச்சயமின்மை தீர்க்கப்படாமல் விடப்பட்டுள்ளது.
