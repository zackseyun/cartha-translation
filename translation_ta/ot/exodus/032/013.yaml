base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: ta
  text: 'உமது ஊழியர்களான ஆபிரகாம்[a], ஈசாக்கு, இஸ்ரவேல் ஆகியோரை நினைவுகூரும். நீர் உம்மையே ஆணையாகக் கொண்டு அவர்களுக்குச் சத்தியம் செய்து, அவர்களிடம் இவ்வாறு சொன்னீர்: ‘நான் உங்கள் சந்ததியை வானத்தின் நட்சத்திரங்களைப்போல் பெருகச் செய்வேன்; நான் கூறிய இந்த நிலம் முழுவதையும் உங்கள் சந்ததிக்குக் கொடுப்பேன்; அவர்கள் அதை என்றென்றும் உரிமையாகப் பெறுவார்கள்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெய மூலபாடத்தில் “இஸ்ரவேல்” என்றே உள்ளது; இது பின்னர் இஸ்ரவேல் என்று பெயரிடப்பட்ட முற்பிதாவாகிய யாக்கோபைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
