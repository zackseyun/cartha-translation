  choice: நினைவுகூரும்
  rationale: கடவுளை நோக்கி மோசே கூறும் ஒருமை ஆண்பால் கட்டளை. தமிழில் மரியாதையும் உடன்படிக்கை வேண்டுதலின் தொனியும் நிலைக்க இலக்கியமான, இயல்பான வேண்டுகோள் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: ஆபிரகாம், ஈசாக்கு, இஸ்ரவேல்
  rationale: மூலபாடம் ‘யாக்கோபு’ என்பதற்குப் பதிலாக ‘இஸ்ரவேல்’ என்று கூறுவதால் அந்தப் பெயர் முதன்மைப் பாடத்தில் அப்படியே வைக்கப்பட்டது.
- source_word: עֲבָדֶיךָ
  choice: உமது ஊழியர்கள்
  rationale: עבד அடிமையையும் ஊழியரையும் குறிக்கலாம்; இங்கு முற்பிதாக்கள் கடவுளுடைய உடன்படிக்கை ஊழியர்கள் என்பதே சூழலுக்குப் பொருத்தமான கருத்து.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: நீர் உம்மையே ஆணையாகக் கொண்டு அவர்களுக்குச் சத்தியம் செய்து
  rationale: கடவுள் தம்மையே தமது சத்தியத்தின் உத்தரவாதமாக வைத்ததை בָּךְ தெளிவாகக் காட்டுகிறது; அதை விரிவான கோட்பாட்டு விளக்கமின்றி தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: நான் உங்கள் சந்ததியை ... பெருகச் செய்வேன்
  rationale: זרע என்பது கூட்டுப் பொருளுடைய ஒருமைச் சொல். ‘சந்ததி’ அந்தக் கூட்டுப் பொருளை இயல்பான தமிழில் காக்கிறது; רבה என்பதன் காரணவினைப் பொருள் ‘பெருகச் செய்வேன்’ என வழங்கப்பட்டது.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: வானத்தின் நட்சத்திரங்களைப்போல்
  rationale: ஒப்புமையையும் உயர்ந்த உடன்படிக்கை மொழிநடையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְכָל הָאָרֶץ הַזֹּאת אֲשֶׁר אָמַרְתִּי
  choice: நான் கூறிய இந்த நாடு முழுவதையும்
  rationale: ‘நான் கூறிய’ என்ற தொடர்புச் சொல்லையும் அடுத்து வரும் ‘கொடுப்பேன்’ என்ற தனி வினையையும் ஒன்றாகக் கலக்காமல், எபிரெய வாக்கிய அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: וְנָחֲלוּ לְעֹלָם
  choice: அவர்கள் அதை என்றென்றும் உரிமையாகப் பெறுவார்கள்
  rationale: נחל என்பது உரிமையாக அல்லது சுதந்தரமாகப் பெறுதலைக் குறிக்கிறது. தமிழில் தேவைப்படும் ‘அதை’ என்பது முன் குறிப்பிடப்பட்ட நாட்டைச் சுட்டும்; לְעֹלָם என்பதன் நீடித்த பொருள் ‘என்றென்றும்’ எனக் காக்கப்பட்டது.
theological_decisions:
- issue: முற்பிதாவின் பெயராக ‘இஸ்ரவேல்’ என்பதா, ‘யாக்கோபு’ என்பதா
  choice: முதன்மைப் பாடத்தில் ‘இஸ்ரவேல்’
  alternative: யாக்கோபு
  rationale: எபிரெய மூலபாடம் வெளிப்படையாக ‘இஸ்ரவேல்’ என்று கூறுகிறது. ‘யாக்கோபு’ என்று மாற்றுவது மொழிபெயர்ப்பை விட விளக்கமாகிவிடும்; பெயர்மாற்றத்துடன் தொடர்புடைய உடன்படிக்கை ஒலியையும் மங்கச் செய்யும்.
- issue: בָּךְ என்ற சத்தியச் சூத்திரத்தின் பொருள்
  choice: உம்மையே ஆணையாகக் கொண்டு
  alternative: உமது சொந்தப் பெயரில் சத்தியம் செய்து
  rationale: கடவுள் தம்மையே சத்தியத்தின் உத்தரவாதமாக வைத்தார் என்ற மூலத்தின் தற்சுட்டுப் பொருளை தெளிவாகவும் கோட்பாட்டு விரிவாக்கமின்றியும் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. கடவுளை நோக்கிய மரியாதை வடிவங்களாக ‘நீர்/உமது/உம்மையே’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் தனித்துள்ள ‘நான் கூறிய’ மற்றும் ‘கொடுப்பேன்’ ஆகிய கூறுகள் ஒன்றாகக் கலக்கப்படவில்லை.
