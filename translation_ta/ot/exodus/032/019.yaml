base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: ta
  text: மோசே முகாமை நெருங்கி, அந்தக் கன்றையும் நடனங்களையும்[a] கண்டபோது, அவருடைய கோபம் எரிந்தது. அவர் தம் கையிலிருந்த பலகைகளை வீசியெறிந்து, மலையடிவாரத்தில் அவற்றை உடைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நடனமாடுவதையும்.” எபிரெயச் சொல் பன்மை வடிவில் உள்ளது; அதனை “நடனங்கள்” என்றும், செயலைக் குறிக்கும் வகையில் “நடனமாடுவதையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: கண்டபோது
  rationale: எபிரெயக் கதைத் தொடரின் நிகழ்வறிமுகத்தையும் காலத் தொடர்பையும் தமிழில் இயல்பான ‘...போது’ அமைப்பால் வெளிப்படுத்துகிறது; தனியே ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பது தமிழில் செயற்கையாக இருக்கும்.
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: முகாமை நெருங்கி
  rationale: קָרַב என்பதன் ‘அருகில் வருதல்/நெருங்குதல்’ என்ற இடவியல் பொருளை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: அந்தக் கன்றையும் ... கண்டபோது
  rationale: רָאָה என்பதற்கு ‘கண்டார்’ என்பது நேரான இணை; குறிப்பிட்ட, முன்சூழலில் அறியப்பட்ட கன்றுச் சிலையைச் சுட்டுவதற்கு ‘அந்தக் கன்று’ இயல்பானது.
- source_word: וּמְחֹלֹת
  choice: நடனங்களையும்
  rationale: மூலத்தில் உள்ள பன்மை வடிவை முறையாகக் காக்கிறது. ‘களியாட்டம்’ போன்ற சொல் வழிபாட்டு மீறல் அல்லது ஒழுக்கக்கேடு பற்றிய கூடுதல் விளக்கத்தைச் சேர்த்துவிடும்.
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: மோசேயின் கோபம் கொழுந்துவிட்டு எரிந்தது
  rationale: கோபம் ‘எரிதல்’ என்ற எபிரெய மொழிப்படிமத்தைத் தக்கவைத்து, அதன் தீவிரத்தை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ
  choice: அவர் தம் கைகளிலிருந்த ... வீசியெறிந்து
  rationale: שׁלך என்பதன் வலிமையான எறிதல் பொருளைத் தருகிறது. மூலத்தில் ‘கை’ ஒருமையாக இருந்தாலும் இரண்டு பலகைகளை ஏந்திய சூழலில் தமிழில் ‘கைகளிலிருந்து’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַלֻּחֹת
  choice: பலகைகளை
  rationale: לוּחֹת என்பதற்கான தெளிவான பொதுத் தமிழ். இவ்வசனத்தில் இல்லாத ‘கல்’ என்ற விவரத்தைச் சேர்க்கவில்லை.
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: அவற்றை உடைத்துச் சிதறடித்தார்
  rationale: שׁבר என்பதன் உடைத்தல்/நொறுக்குதல் வலிமையைத் தெளிவாகத் தருகிறது; வெறும் ‘உடைத்தார்’ என்பதைவிட நிகழ்வின் தீவிரத்தை காக்கிறது.
- source_word: תַּחַת הָהָר
  choice: மலையடிவாரத்தில்
  rationale: நிலவியல் சூழலில் ‘மலையின் கீழ்/அடியில்’ என்பதற்கான இயல்பான தமிழ்ச் சமமான சொல்; காட்சியைத் தவறாக உணர்த்தும் நேரடி ‘மலையின் கீழே’ என்பதைத் தவிர்க்கிறது.
