  verdict: revise
  source_fidelity: 'திருத்தம் தேவை: வரைவு பெரும்பாலும் மூலத்திற்கு உண்மையாக உள்ளது. ஆனால் לֻחֹת כְּתֻבִים என்பது ‘எழுதப்பட்ட பலகைகள்’ என்ற பலகைகளைக் குறிக்கும் பெயரடைத் தொடராகும்; ‘அந்தப் பலகைகளின் இரு பக்கங்களிலும் எழுதப்பட்டிருந்தது’ என்பதில் எழுதப்பட்ட பொருள் இலக்கண ரீதியாகத் தெளிவில்லாமல் விடப்படுகிறது. திருத்தப்பட்ட வடிவம் பலகைகளே எழுதப்பட்டவை என்பதையும், இறுதியில் வரும் வலியுறுத்தும் மறுகூற்றையும் காக்கிறது.'
  naturalness: ‘சாட்சியின் இரண்டு பலகைகள் அவருடைய கையில் இருந்தன’ என்பது புரியக்கூடியது; இருப்பினும் ‘தன் கையில் ... வைத்துக்கொண்டு’ என்பது மோசே அவற்றை ஏந்தியிருந்தார் என்ற மூலத் தொடர்பை நவீனத் தமிழில் இயல்பாகத் தருகிறது. ‘இரு பக்கங்களிலும் எழுதப்பட்ட பலகைகள்’ தெளிவானதும் இயல்பானதும் ஆகும்.
