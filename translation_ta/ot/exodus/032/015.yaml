base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: ta
  text: பின்னர் மோசே திரும்பி, தன் கையில் சாட்சியின் இரண்டு பலகைகளை வைத்துக்கொண்டு மலையிலிருந்து இறங்கினார். அவை இரு பக்கங்களிலும் எழுதப்பட்ட பலகைகளாக இருந்தன; இந்தப் பக்கத்திலும் அந்தப் பக்கத்திலும்[a] அவை எழுதப்பட்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு பக்கத்திலும் மறுபக்கத்திலும்.’
    reason: מִזֶּה וּמִזֶּה என்ற பகிர்வுத் தொடர் தமிழில் இவ்வாறும் இயல்பாக மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: וַיִּפֶן
  choice: திரும்பி
  rationale: פנה இங்கு மோசே திசைமாறி மலையிலிருந்து இறங்கத் தொடங்கியதைக் குறிக்கிறது. ‘திரும்பி’ என்பது எபிரேய வினையின் அளவைக் கடக்காமல் இயல்பாகத் தருகிறது.
- source_word: וַיֵּרֶד
  choice: இறங்கினார்
  rationale: ירד என்பதன் அடிப்படைப் பொருள் ‘கீழே செல்/இறங்கு.’ கதைசொல்லியின் நோக்குநிலையைத் தேவையின்றி மாற்றாமல் தமிழில் இயல்பாக உள்ளது.
- source_word: הָהָר
  choice: மலை
  rationale: הַר என்பதற்கு ‘மலை’ அல்லது ‘குன்று’ என்று பொருள் வரலாம்; சீனாய் சூழலில் ‘மலை’ என்பதே பொருத்தமானது.
- source_word: שְׁנֵי לֻחֹת
  choice: இரண்டு பலகைகள்
  rationale: לֻחֹת என்பது எழுதுவதற்குரிய பலகைகளைக் குறிக்கிறது. இவ்வசனத்தில் ‘கல்’ வெளிப்படையாக இல்லாததால் அதைச் சேர்க்கவில்லை.
- source_word: הָעֵדֻת
  choice: சாட்சி
  rationale: עֵדוּת என்பதன் ‘சாட்சி’ என்ற அடிப்படை மற்றும் உடன்படிக்கை சார்ந்த ஒலிப்பைத் தக்கவைக்கிறது; அதை விளக்கமாக ‘உடன்படிக்கை ஆவணம்’ என்று குறுக்கவில்லை.
- source_word: בְּיָדוֹ
  choice: அவருடைய கையில்
  rationale: எபிரேய மூலத்தில் ஒருமை உள்ளது. அதையே தமிழிலும் இயல்பாகத் தக்கவைத்துள்ளது.
- source_word: לֻחֹת כְּתֻבִים
  choice: பலகைகளில் எழுதப்பட்டிருந்தது
  rationale: כתב என்ற சொல்லின் எளிய ‘எழுது’ என்னும் பொருளைத் தருகிறது; கல்லில் பொறித்தல் என்ற தகவலை இவ்விடத்தில் தேவையின்றி இறக்குமதி செய்யவில்லை.
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: அந்தப் பலகைகளின் இரு பக்கங்களிலும்
  rationale: எழுத்து பலகைகளின் இரண்டு பக்கங்களிலும் இருந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִזֶּה וּמִזֶּה
  choice: இந்தப் பக்கத்திலும் அந்தப் பக்கத்திலும்
  rationale: ஒவ்வொரு பக்கத்தையும் தனித்தனியாக வலியுறுத்தும் எபிரேய இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: הֵם כְּתֻבִים
  choice: அவை எழுதப்பட்டிருந்தன
  rationale: இரு பக்கங்களிலும் எழுத்து இருந்தது என்பதை எபிரேயம் மீண்டும் கூறி வலியுறுத்துகிறது; அந்த மறுபடியும் கூறுதலைச் சீராக்கி நீக்காமல் தக்கவைத்துள்ளது.
theological_decisions:
- issue: ‘சாட்சியின் பலகைகள்’ என்பதில் עֵדוּת என்ற சொல்லை மொழிபெயர்த்தல்
  choice: சாட்சி
  alternative: உடன்படிக்கை; சான்று
  rationale: ‘சாட்சி’ என்பது மூலச்சொல்லின் வழக்கமான உடன்படிக்கைச் சார்ந்த சொல்லாட்சியையும் அதன் இறையியல் ஒலிப்பையும் பாதுகாக்கிறது; வசனம் கூறுவதைவிடக் கூடுதலாக விளக்குவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மீளுரையும், ‘கையில்’ என்ற ஒருமையும், ‘சாட்சி’ என்ற உடன்படிக்கைச் சொல்லாட்சியும் தக்கவைக்கப்பட்டுள்ளன.
