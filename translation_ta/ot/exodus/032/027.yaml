base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: ta
  text: 'அவர் அவர்களிடம், “இஸ்ரவேலின் கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: நீங்கள் ஒவ்வொருவரும் தம் வாளைத் தொடையில் கட்டிக்கொள்ளுங்கள். பாளயத்தில் வாசலிலிருந்து வாசலுக்குச் சென்று திரும்பிச் செல்லுங்கள். நீங்கள் ஒவ்வொருவரும் தம் சகோதரனையும், தம் தோழனையும், தமக்கு நெருங்கியவனையும்[a] கொல்லுங்கள்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் “அவனுக்கு நெருங்கியவன்”; இதை “அவனுடைய உறவினன்” அல்லது “அவனுடைய நெருங்கிய உறவினன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: அவர் அவர்களிடம் ... என்றார்
  rationale: எபிரேயக் கதைநடையின் தொடர்ச்சியையும் நேரடி உரையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தெய்வீக அதிகாரத்தை அறிவிக்கும் தூதுரைச் சூத்திரத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரேய இணைப்புத் தொடரை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: ஒவ்வொருவனும் தன் வாளைத் தொடையில் கட்டிக்கொள்ளட்டும்
  rationale: ஆண்களைக் குறிக்கும் பகிர்வுநிலை אִישׁ என்பதையும், போருக்கு ஆயத்தமாக வாளை அணியும் சொற்றொடரின் நடைமுறைப் பொருளையும் காக்கிறது; ‘தொடை’ என்ற உடற்பகுதியும் விடப்படவில்லை.
- source_word: עִבְרוּ וָשׁוּבוּ
  choice: சென்று திரும்புங்கள்
  rationale: இரண்டு கட்டளைகளையும் தனித்தனியாகக் காத்து, அங்குமிங்கும் நகரும் பொருளைச் சூழல் உணர்த்துமாறு செய்கிறது.
- source_word: מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: பாளயத்தில் வாசலிலிருந்து வாசலுக்கு
  rationale: இடவெளியையும் ஒரு வாசலிலிருந்து மற்றொரு வாசலுக்குச் செல்லும் பகிர்வுநிலையையும் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: וְהִרְגוּ
  choice: கொல்லுங்கள்
  rationale: வினையின் நேரடியான, கடுமையான பொருளை மென்மைப்படுத்தாமல் வழங்குகிறது.
- source_word: אִישׁ אֶת אָחִיו
  choice: ஒவ்வொருவனும் தன் சகோதரனை
  rationale: மீண்டும் வரும் אִישׁ என்பதன் தனிநபர் வலியுறுத்தலையும் אָחִיו என்பதன் நேரடி உறவுமுறையையும் காக்கிறது.
- source_word: רֵעֵהוּ
  choice: தன் தோழனை
  rationale: நண்பன், துணைவன், உடனிருப்பவன் ஆகிய பொருள் வரம்பை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: קְרֹבוֹ
  choice: தனக்கு நெருங்கியவனை
  rationale: ‘அருகானவன்’ என்ற அடிப்படைப் பொருளைத் தக்கவைத்து, உறவினர் அல்லது நெருங்கிய தொடர்புடையவர் என்ற இரு சாத்தியங்களையும் தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றுக்கு நெருக்கமானது.
- issue: மீண்டும் வரும் אִישׁ என்பதைக் கையாளுதல்
  choice: ஒவ்வொருவனும்
  alternative: ஒவ்வொருவரும்
  rationale: சூழலில் கட்டளை லேவிய ஆண்களிடம் கூறப்படுவதாலும் எபிரேயம் ஆண்பால் ஒருமையைப் பகிர்வுநிலையில் மீண்டும் பயன்படுத்துவதாலும் பாலினக் குறிப்பைத் தக்கவைக்கிறது.
- issue: קְרֹבוֹ என்பவரின் உறவை நிர்ணயித்தல்
  choice: தனக்கு நெருங்கியவன்
  alternative: நெருங்கிய உறவினன்
  rationale: இச்சொல் நெருங்கிய உறவினரையோ அருகாமைத் தொடர்புடையவரையோ குறிக்கலாம்; பிரதான உரை அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. வன்முறைக் கட்டளையின் அதிர்ச்சியையும் சகோதரன்—தோழன்—நெருங்கியவன் என்ற உறவுத் தொடரையும் மென்மைப்படுத்தாமல் காக்கிறது.
