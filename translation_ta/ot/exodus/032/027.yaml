- from: 'அவர் அவர்களிடம், “இஸ்ரவேலின் கடவுளாகிய யாவே கூறுவது இதுவே: ஒவ்வொருவனும் தன் வாளைத் தொடையில் கட்டிக்கொள்ளட்டும். பாளயத்தில் வாசலிலிருந்து வாசலுக்குச் சென்று திரும்புங்கள். ஒவ்வொருவனும் தன் சகோதரனையும், தன் தோழனையும், தனக்கு நெருங்கியவனையும்[a] கொல்லுங்கள்” என்றார்.'
  to: 'அவர் அவர்களிடம், “இஸ்ரவேலின் கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: நீங்கள் ஒவ்வொருவரும் தம் வாளைத் தொடையில் கட்டிக்கொள்ளுங்கள். பாளயத்தில் வாசலிலிருந்து வாசலுக்குச் சென்று திரும்பிச் செல்லுங்கள். நீங்கள் ஒவ்வொருவரும் தம் சகோதரனையும், தம் தோழனையும், தமக்கு நெருங்கியவனையும்[a] கொல்லுங்கள்” என்றார்.'
  rationale: The revision resolves the singular/plural grammatical inconsistency by retaining the plural address ('நீங்கள்') while distributing each commanded act ('ஒவ்வொருவரும்'), corresponding to the Hebrew plural imperatives and repeated distributive אישׁ. It also renders the divine speech formula naturally and clarifies the two movement imperatives. No theological interpretation or narrowing of the ambiguous final relationship term has been introduced.
