base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: ta
  text: அவர்கள் மறுநாள் அதிகாலையில் எழுந்து, தகனபலிகளைச் செலுத்தி, சமாதானப் பலிகளைச் சமர்ப்பித்தார்கள். பின்பு மக்கள் உட்கார்ந்து உண்டு குடித்தார்கள்; பிறகு களியாட்டத்தில் ஈடுபட எழுந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விளையாட எழுந்தார்கள்.” எபிரெய வினைச்சொல் “விளையாடு,” “கொண்டாடு,” அல்லது “களியாட்டத்தில் ஈடுபடு” என்று பொருள்படலாம்; இங்கு சூழல் குற்றமற்ற விளையாட்டைவிட ஒழுங்கற்ற கொண்டாட்டத்தைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  choice: மறுநாள் அவர்கள் அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் அதிகாலையில் எழுவதைக் குறிக்கிறது; מִמָּחֳרָת முந்தைய நிகழ்வுகளுக்கு அடுத்த நாளைக் குறிக்கிறது.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: தகனபலிகளைச் செலுத்தி
  rationale: பலியிடும் சூழலில் עלה உடன் עֹלָה வருவது முழுவதும் எரிக்கப்படும் பலிகளைச் செலுத்துவதைக் குறிக்கிறது; ‘தகனபலி’ இந்தப் பலிவகையைத் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: சமாதானப் பலிகளைக் கொண்டுவந்தார்கள்
  rationale: נגשׁ இங்கு பலியை அணுகக் கொண்டுவருதல் அல்லது சமர்ப்பித்தல் என்ற பொருளில் வருகிறது; שְׁלָמִים என்பதற்கு நிறுவப்பட்ட பலிவகைப் பெயராக ‘சமாதானப் பலிகள்’ பயன்படுத்தப்படுகிறது.
- source_word: וַיֵּשֶׁב הָעָם לֶאֱכֹל וְשָׁתוֹ
  choice: மக்கள் உட்கார்ந்து உண்டு குடித்தார்கள்
  rationale: எபிரெய உரையின் தொடர்ச்சியான செயற்பாட்டை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: களியாட்டத்தில் ஈடுபட எழுந்தார்கள்
  rationale: צחק என்பது விளையாடுதல், கொண்டாடுதல் அல்லது கட்டுப்பாடற்ற களியாட்டத்தில் ஈடுபடுதல் எனப் பொருள்படலாம். கன்றுக்குட்டி வழிபாடு மற்றும் பலிவிருந்தின் சூழலில் எதிர்மறை நுண்பொருளை ‘களியாட்டம்’ காட்டுகிறது; பாலியல் தவறைத் தேவையின்றி வெளிப்படையாகச் சேர்ப்பதில்லை.
theological_decisions:
- issue: பொற்கன்றுக்குட்டி நிகழ்வில் לְצַחֵק என்பதன் நுண்பொருள்
  choice: களியாட்டத்தில் ஈடுபட
  alternative: விளையாட; கொண்டாட
  rationale: சொல் தன்னளவில் பல பொருள்களைக் கொண்டது. விக்கிரக வழிபாடு, பலிவிருந்து, பின்னர் வரும் கடுமையான கண்டனம் ஆகிய சூழல் ஒழுங்கற்ற கொண்டாட்டத்தைக் காட்டுகிறது; ஆனால் இந்த வசனம் மட்டும் பாலியல் நடத்தையைத் தெளிவாகக் கூறாததால் அதை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பலியியல் சொற்களுக்கு நிலையான ‘தகனபலி,’ ‘சமாதானப் பலி’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டன. צחק என்பதிலுள்ள உண்மையான பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
