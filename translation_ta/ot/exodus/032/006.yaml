    rationale: Hebrew וַיַּגִּשׁוּ means to bring near/present in this sacrificial setting. ‘சமர்ப்பித்தார்கள்’ is natural modern Tamil and more clearly identifies the action as a ritual presentation, while preserving the source sense.
