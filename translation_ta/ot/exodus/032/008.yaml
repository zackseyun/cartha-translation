base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: ta
  text: நான் அவர்களுக்குக் கட்டளையிட்ட வழியிலிருந்து அவர்கள் மிக விரைவாக விலகிவிட்டார்கள். அவர்கள் தங்களுக்காக ஒரு கன்றுக்குட்டியின் வார்ப்புச் சிலையைச் செய்து, அதற்கு முன் பணிந்து, அதற்குப் பலியிட்டு, ‘இஸ்ரயேலே, எகிப்து நாட்டிலிருந்து உன்னை மேலே கொண்டுவந்த உன் தெய்வங்கள் இவையே[a]’ என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரயேலே, உன் தெய்வம் இதுவே.” எபிரெய மூலத்தில், “உன் தெய்வங்கள் இவையே” என்று பன்மையில் உள்ளது; ஆனால் இச்சூழலில் குறிப்பிடப்படுவது ஒரே கன்றுக்குட்டிதான்.
    reason: alternative_reading
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: மிக விரைவாக விலகிவிட்டார்கள்
  rationale: கட்டளையிடப்பட்ட வழியிலிருந்து சீக்கிரமாகப் பிறழ்ந்ததைக் குறிக்கும் வினையையும் வினையடையையும் இயல்பான நவீன தமிழில் இணைத்துப் பாதுகாக்கிறது.
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: நான் அவர்களுக்குக் கட்டளையிட்ட வழியிலிருந்து
  rationale: ‘வழி’ என்ற ஒழுக்க மற்றும் உடன்படிக்கை உருவகத்தைத் தக்கவைத்து, எபிரெயத் தொடரைத் தெளிவான தமிழில் வழங்குகிறது.
- source_word: עָשׂוּ לָהֶם
  choice: அவர்கள் தங்களுக்காக ... செய்து
  rationale: לָהֶם என்பதிலுள்ள தன்நோக்குப் பொருளை ‘தங்களுக்காக’ என்று வெளிப்படுத்துகிறது.
- source_word: עֵגֶל מַסֵּכָה
  choice: ஒரு கன்றுக்குட்டியின் வார்ப்புச் சிலை
  rationale: עֵגֶל என்பதைக் ‘கன்றுக்குட்டி’ என்றும், மַסֵּכָה குறிக்கும் உலோக வார்ப்புச் சிலை என்ற உற்பத்திப் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: அதை வணங்கி
  rationale: உடலைத் தாழ்த்திப் பணியும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; பொதுவான ‘வழிபட்டார்கள்’ என்ற சொல்லால் அடுத்த பலியிடும் செயலுடன் இதை ஒன்றாக்கவில்லை.
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: அதற்குப் பலியிட்டு
  rationale: வழிபாட்டுச் சூழலிலுள்ள பலியிடும் செயலைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: உன் தெய்வங்கள் இவையே
  rationale: ஒற்றைக் கன்றுக்குட்டி குறிப்பிடப்பட்டாலும், எபிரெயத்தில் வெளிப்படையாக உள்ள பன்மை வடிவத்தை முதன்மை உரையில் பாதுகாக்கிறது.
- source_word: הֶעֱלוּךָ מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து உன்னை மேலே கொண்டுவந்த
  rationale: עלה வினையின் ‘மேலே கொண்டுவருதல்’ என்ற அடிப்படைப் படிமத்தையும் யாத்திராகமச் சொற்றொடரின் எதிரொலியையும் பாதுகாக்கிறது.
theological_decisions:
- issue: கன்றுக்குட்டியைப் பற்றிய அறிவிப்பில் אֱלֹהֶיךָ என்பதன் எண்
  choice: ‘உன் தெய்வங்கள் இவையே’ என்ற பன்மையை முதன்மை உரையில் வைத்தல்
  alternative: ‘உன் தெய்வம் இதுவே’ என்ற சூழல்சார் ஒருமை
  rationale: אֵלֶּה மற்றும் אֱלֹהֶיךָ இலக்கணரீதியாகப் பன்மையில் உள்ளன. ஒரே கன்றுக்குட்டி குறிக்கப்படுவதால் உருவாகும் பதற்றத்தைத் தீர்த்துவிடாமல், ஒருமையை அடிக்குறிப்பில் தருவது மூலச்சான்றுக்கு நெருக்கமானது.
- issue: וַיִּשְׁתַּחֲווּ என்ற வழிபாட்டுச் செயல்
  choice: ‘அதை வணங்கி’ என்று உடல் தாழ்த்தும் செயலைக் காட்டுதல்
  alternative: ‘அதை வழிபட்டு’
  rationale: எபிரெய வினை உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கிறது. இதைத் தனியே வைத்தால் வணங்குதல், பலியிடுதல், அறிவித்தல் என்ற செயல்களின் வரிசை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான நடை. ‘இஸ்ரயேலே’ என்ற நேரடி அழைப்பும், ‘வழி’ மற்றும் ‘மேலே கொண்டுவந்த’ என்ற மூலப் படிமங்களும் தக்கவைக்கப்பட்டுள்ளன.
