base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/022.yaml
  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: ta
  text: ஆரோன், “என் ஆண்டவரே, உமது கோபம் கொழுந்துவிட்டு எரிய வேண்டாம். மக்கள் தீமைக்கே நாட்டமுள்ளவர்கள்[a] என்பதை நீரே அறிவீர்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தீமை செய்யச் சாய்கிறவர்கள்,” அல்லது “தீய வழியிலேயே செல்ல முனைகிறவர்கள்.” எபிரெய மரபுத்தொடர், மக்கள் தீமையால் அடையாளப்படுத்தப்படுகிறவர்களாகச் சித்தரிக்கப்படுகிறார்கள் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אַהֲרֹן
  choice: ஆரோன் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; வாவ்-தொடர்ச்சிக்கு தனியாக ‘மேலும்’ சேர்ப்பது தமிழில் செயற்கையாக இருக்கும்.
- source_word: אַל יִחַר אַף
  choice: உமது கோபம் கொழுந்துவிட்டு எரிய வேண்டாம்
  rationale: கோபம் எரிவதாகக் கூறும் எபிரெய உருவகத்தைத் தக்கவைத்து, தமிழில் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவரே
  rationale: இது மோசேயை நோக்கிய மரியாதையான மனித அழைப்பு; தெய்வப் பெயராக அல்லாமல், கீழ்ப்படிவும் மரியாதையும் கொண்ட அழைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַתָּה יָדַעְתָּ
  choice: நீரே அறிவீர்
  rationale: வினைச்சொல்லுக்கு மேலாக வரும் தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலை ‘நீரே’ என்பதால் இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: הָעָם
  choice: இந்த மக்கள்
  rationale: குறிப்பிட்ட மக்களைச் சுட்டும் எபிரெய உருபைத் தமிழில் சூழலுக்கேற்ற ‘இந்த’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: כִּי בְרָע הוּא
  choice: தீமைக்கே நாட்டமுள்ளவர்கள்
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் இயல்பற்றதாகும் எபிரெய மரபுத்தொடரை, மக்களைத் தீமை வகைப்படுத்துகிறது என்ற கூட்டு ஒருமைப் பொருளுடன் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: אֲדֹנִי என்பது மனிதரை நோக்கிய அழைப்பா, தெய்வப் பட்டமா?
  choice: என் ஆண்டவரே
  alternative: என் எஜமானே; ஐயா
  rationale: இங்கு ஆரோன் மோசேயை அழைக்கிறான். எனவே இது கடவுளைக் குறிக்கும் சிறப்புப் பட்டமாகப் புரிந்துகொள்ளப்படக் கூடாது; அதேவேளை எபிரெயச் சொல்லின் மரியாதைத் தன்மையையும் குறைக்காமல் வைத்திருக்க வேண்டும்.
- issue: בְרָע הוּא மக்களின் தீய செயலை மட்டும் குறிக்கிறதா, அவர்களின் தீய நாட்டத்தை வருணிக்கிறதா?
  choice: தீமைக்கே நாட்டமுள்ளவர்கள்
  alternative: தீமை செய்யச் சாய்கிறவர்கள்; தீய இயல்புடையவர்கள்
  rationale: மரபுத்தொடர் மக்களைத் தீமையால் வகைப்படுத்துகிறது; ஆனால் அவர்களின் இயல்பு மாறவே முடியாது என்ற கடுமையான கோட்பாட்டுத் தீர்ப்பை உரையில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. மோசேயை நோக்கிய மரியாதையை ‘நீர்/உமது’ என்பவை காட்டுகின்றன. ‘கொழுந்துவிட்டு எரிய’ என்பது மூலத்தின் கோபம்-எரிதல் உருவகத்தைத் தக்கவைக்கிறது.
