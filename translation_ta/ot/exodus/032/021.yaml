revisions:
- from: மோசே ஆரோனிடம், “இந்த மக்கள் உனக்கு என்ன செய்தார்கள், நீ அவர்கள்மேல் பெரும் பாவத்தைக் கொண்டுவரும் அளவுக்கு?” என்று கேட்டார்.
  to: மோசே ஆரோனிடம், “இந்த மக்கள் உனக்கு என்ன செய்தார்கள், நீ அவர்கள்மேல் பெரும் பாவத்தைக் கொண்டுவந்தாயே?” என்று கேட்டார்.
  rationale: 'The revision changes only the Tamil verbal form and question construction, replacing the prospective/resultative “கொண்டுவரும் அளவுக்கு” with the completed, rhetorically accusatory “கொண்டுவந்தாயே?” This more closely reflects the Hebrew while remaining natural in modern standard Tamil. No footnote is needed: Tamil’s plural “அவர்கள்மேல்” is the normal semantic rendering of the Hebrew collective singular pronoun.'
  reviewer_model: gpt-5.6-terra
