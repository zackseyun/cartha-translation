source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן מֶֽה עָשָׂ֥ה לְ/ךָ֖ הָ/עָ֣ם הַ/זֶּ֑ה כִּֽי הֵבֵ֥אתָ עָלָ֖י/ו חֲטָאָ֥ה גְדֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/021.yaml
  text: Moses said to Aaron[a], “What did this people do to you, that you have brought a great sin upon them?”
translation:
  language: ta
  text: மோசே ஆரோனிடம், “இந்த மக்கள் உனக்கு என்ன செய்தார்கள், நீ அவர்கள்மேல் பெரும் பாவத்தைக் கொண்டுவந்தாயே?” என்று கேட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்று கேட்டார்
  rationale: இது நேரடி உரையை அறிமுகப்படுத்தும் வழக்கமான தொடர் வினை வடிவம். உரை கேள்வியாக இருப்பதால், நவீன தமிழில் இயல்பாக ‘என்று கேட்டார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: இந்த மக்கள் உனக்கு என்ன செய்தார்கள்
  rationale: מֶה என்பதன் கேள்விப் பொருளையும், לְךָ என்பதன் ‘உனக்கு’ என்ற உறவையும், הַזֶּה என்பதன் சுட்டுப் பொருளையும் நேரடியாகப் பாதுகாக்கிறது. ‘இந்த மக்கள்’ என்பது மோசேயின் சற்றே விலகிய கண்டனத் தொனியையும் தக்கவைக்கிறது.
- source_word: כִּי
  choice: …அளவுக்கு
  rationale: இங்கு כִּי, மக்கள் ஆரோனுக்கு என்ன செய்தார்கள் என்ற கேள்வியையும், அவர் அவர்கள்மேல் பெரும் பாவத்தைக் கொண்டுவந்ததையும் விளைவு சார்ந்த முறையில் இணைக்கிறது. ‘…அளவுக்கு’ என்பது அந்த உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֵבֵאתָ עָלָיו
  choice: நீ அவர்கள்மேல் … கொண்டுவரும்
  rationale: בוא என்பதன் ஹிஃபீல் வடிவம் ‘கொண்டுவருதல்’ என்று பொருள்படும். עָלָיו இலக்கண வடிவில் ஒருமையாக இருந்தாலும், ஒருமைக் கூட்டுப்பெயரான ‘மக்கள்’ என்பதையே குறிக்கிறது; தமிழில் பொருள் சார்ந்து ‘அவர்கள்மேல்’ என்பது இயல்பானது.
- source_word: חֲטָאָה גְדֹלָה
  choice: பெரும் பாவம்
  rationale: חֲטָאָה என்பது ‘பாவம்/குற்றம்’ என்றும் גְדֹלָה என்பது ‘பெரிய/பெரும்’ என்றும் பொருள்படும். ‘பெரும் பாவம்’ மூலத்தின் ஒழுக்கக் கடுமையைச் சுருக்காமலும் மிகைப்படுத்தாமலும் தருகிறது.
theological_decisions:
- issue: ஆரோனின் பொறுப்பு
  choice: ஆரோன் மக்கள்மேல் பெரும் பாவத்தைக் கொண்டுவந்ததாக நேரடியாக மொழிபெயர்த்தல்
  alternative: ஆரோன் மக்களைப் பெரும் பாவம் செய்ய வழிநடத்தினார்
  rationale: மூல எபிரெய உரை ஆரோனின் செயலுக்குப் பொறுப்பை நேரடியாகச் சுமத்துகிறது; ஆனால் அவர் எவ்வாறு அந்தப் பாவத்தைக் கொண்டுவந்தார் என்பதை விரிவாக விளக்கவில்லை. ஆகவே குற்றச்சாட்டை மெலிதாக்காமலும் விளக்கத்தைச் சேர்க்காமலும் மூல உருவகம் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதே நேரத்தில் கண்ணியமான நடையில் அமைக்கப்பட்டது. மோசேயின் கடுமையான கேள்வித் தொனி ‘…அளவுக்கு?’ என்ற இயல்பான தமிழ் அமைப்பால் பாதுகாக்கப்படுகிறது.
