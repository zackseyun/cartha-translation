review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Moses’ question, the demonstrative force of “this people,” Aaron’s responsibility, and the collective sense of the singular Hebrew pronoun. However, “கொண்டுவரும் அளவுக்கு” uses a non-completed verbal form (“to the extent of bringing”), whereas the Hebrew perfect directly charges Aaron with having brought the sin upon the people.
  naturalness: The current sentence is understandable, but the revised rhetorical-question form is more idiomatic and forceful in modern standard Tamil. “கொண்டுவந்தாயே?” naturally communicates the rebuking question without adding interpretation.
  terminology: “மோசே,” “ஆரோன்,” “மக்கள்,” “பெரும் பாவம்,” and “அவர்கள்மேல்” are suitable. “பெரும் பாவம்” preserves the gravity of חֲטָאָה גְדֹלָה without expanding it to a specific theological explanation.
  issues:
  - severity: medium
    issue: The verb phrase “கொண்டுவரும் அளவுக்கு” does not represent the completed action of הֵבֵאתָ.
    rationale: הֵבֵאתָ is a perfect-form verb, and in this rebuke it refers to Aaron’s action as already done. “கொண்டுவந்தாயே?” restores that completed accusation and retains the rhetorical force.
  revised_text: மோசே ஆரோனிடம், “இந்த மக்கள் உனக்கு என்ன செய்தார்கள், நீ அவர்கள்மேல் பெரும் பாவத்தைக் கொண்டுவந்தாயே?” என்று கேட்டார்.
  revised_footnotes: []
  revision_rationale: 'The revision changes only the Tamil verbal form and question construction, replacing the prospective/resultative “கொண்டுவரும் அளவுக்கு” with the completed, rhetorically accusatory “கொண்டுவந்தாயே?” This more closely reflects the Hebrew while remaining natural in modern standard Tamil. No footnote is needed: Tamil’s plural “அவர்கள்மேல்” is the normal semantic rendering of the Hebrew collective singular pronoun.'
