base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: ta
  text: பின்பு மோசே யாவேவிடம் திரும்பிச் சென்று, “ஐயோ, இந்த மக்கள் பெரும் பாவம் செய்திருக்கிறார்கள்; தங்களுக்காகத் தங்கத்தால் ஆன தெய்வங்களை[a]ச் செய்திருக்கிறார்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்களுக்காகத் தங்கத்தால் ஆன ஒரு தெய்வத்தைச் செய்திருக்கிறார்கள்.’ எபிரெயத்தில் ‘தங்கத்தால் ஆன தெய்வங்கள்’ என்று பன்மையில் உள்ளது; ஆனால் விரிந்த நிகழ்ச்சிச் சூழல் ஒரே பொற்கன்றைக் குறிப்பதால், சிலர் இதை ஒருமையாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பிச் சென்று
  rationale: שׁוב என்பது மோசே மக்களிடமிருந்து யாவேவிடம் மீண்டும் சென்றதைக் குறிக்கிறது. ‘திரும்பிச் சென்று’ என்பது இயக்கத்தையும் மீளுதலையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶל יְהוָה
  choice: யாவேவிடம்
  rationale: אֶל திசை அல்லது அணுகுதலைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָנָּא
  choice: வேண்டுகிறேன்!
  rationale: இந்த இடைச்சொல் பணிவான மன்றாட்டை வெளிப்படுத்துகிறது. தனித்து நிற்கும் ‘வேண்டுகிறேன்!’ மோசேயின் விண்ணப்பத் தொனியை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: חָטָא
  choice: பாவம் செய்திருக்கிறார்கள்
  rationale: நிறைவேறிய செயலின் தற்போதைய விளைவைத் தமிழின் நிறைவுநிலை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்கள்
  rationale: עָם ஒருமை வடிவிலுள்ள கூட்டுப்பெயர்; தமிழில் ‘இந்த மக்கள்’ என்பது அந்தக் கூட்டுப் பொருளை இயல்பாகத் தருகிறது.
- source_word: חֲטָאָה גְדֹלָה
  choice: பெரும் பாவம்
  rationale: வினையுடனான ஒரே வேர் சார்ந்த பெயர்ச்சொல் கட்டமைப்பு குற்றத்தின் தீவிரத்தை வலியுறுத்துகிறது; ‘பெரும் பாவம்’ அந்த வலிமையைச் சுருக்கமாகக் காக்கிறது.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: தங்களுக்காக ... செய்திருக்கிறார்கள்
  rationale: לָהֶם மக்களே தங்களுக்காக உருவாக்கியதைச் சுட்டுகிறது; ‘தங்களுக்காக’ அந்தத் தற்சுட்டுப் பொருளைக் காக்கிறது.
- source_word: אֱלֹהֵי זָהָב
  choice: தங்கத்தால் ஆன தெய்வங்களை
  rationale: எபிரெய வடிவம் இலக்கண ரீதியில் பன்மையாக உள்ளது. ‘தங்கத்தால் ஆன’ என்பது பொருளைத் தெளிவுபடுத்தி, ‘தெய்வங்களை’ என்பது மூலத்தின் பன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக ‘யாவே’ என்று ஒலிபெயர்ப்பது தனிப்பெயரைத் தக்கவைக்கிறது.
- issue: אֱלֹהֵי זָהָב என்பதன் எண்
  choice: தங்கத்தால் ஆன தெய்வங்கள்
  alternative: தங்கத்தால் ஆன ஒரு தெய்வம்
  rationale: சுற்றியுள்ள நிகழ்ச்சி ஒரே பொற்கன்றை மையப்படுத்தினாலும், இவ்வசனத்தின் எபிரெயச் சொற்றொடர் பன்மையாக உள்ளது. ஆகவே முதன்மை உரையில் பன்மை காக்கப்பட்டு, சூழல்சார்ந்த ஒருமை வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மோசேயின் மன்றாட்டுத் தொனி ‘வேண்டுகிறேன்!’ என்பதால் காக்கப்படுகிறது; மூலத்தின் பன்மை இறையியல் ஒத்திசைவுக்காக ஒருமையாக்கப்படவில்லை.
