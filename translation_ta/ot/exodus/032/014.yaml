  text: וַ/יִּנָּ֖חֶם יְהוָ֑ה עַל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר לַ/עֲשׂ֥וֹת לְ/עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/014.yaml
  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: ta
  text: யாவே தமது மக்களுக்குச் செய்யப்போவதாகச் சொல்லியிருந்த தீங்கைச் செய்வதிலிருந்து பின்வாங்கினார்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது மக்கள்மேல் கொண்டுவருவதாகச் சொல்லியிருந்த பேரழிவைக் குறித்து மனம் மாறினார்” அல்லது “வருந்தினார்.”
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் “தீமை/பேரழிவு.” இங்கு அது கடவுளின் ஒழுக்கத் தீமையை அல்ல, அவர் எச்சரித்திருந்த பேரழிவை அல்லது தீங்கை குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: பின்வாங்கினார்
  rationale: நחם என்பதன் நிஃபால் வடிவம், முன்பு அறிவிக்கப்பட்ட செயலை மேற்கொள்ளாமல் அதிலிருந்து திரும்புவதைக் குறிக்கிறது. ‘பின்வாங்கினார்’ என்பது நிகழ்வின் உண்மையான திருப்பத்தை இயல்பான தமிழில் தெரிவிக்கிறது; அதேவேளையில் கடவுள் தவறாக எண்ணினார் என்று தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் பரவலாக அறியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: עַל הָרָעָה
  choice: தீங்கைச் செய்வதிலிருந்து
  rationale: இந்தச் சூழலில் רָעָה என்பது ஒழுக்கத் தீமையை அல்ல, அறிவிக்கப்பட்ட அழிவையோ தீங்கையோ குறிக்கிறது. נחם על என்ற முழுச் சொற்றொடரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்த விலகுதலைக் குறிக்கும் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת
  choice: செய்வதாகச் சொல்லியிருந்த
  rationale: முன்பு அறிவிக்கப்பட்ட செயலைக் குறிக்கும் எபிரெய உறவுநிலைத் தொடரைத் தெளிவாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: לְעַמּוֹ
  choice: தமது மக்களுக்கு
  rationale: அச்சுறுத்தப்பட்ட செயலால் பாதிக்கப்பட இருந்தவர்கள் யாவேயின் சொந்த மக்கள் என்பதைத் தெளிவாகக் காட்டுகிறது; மரியாதை ஒருமைக்கேற்ப ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: נחם என்ற சொல்லால் கடவுளைப் பற்றி மனித உணர்வு அல்லது மனமாற்ற மொழியில் கூறுதல்
  choice: முதன்மை உரையில் ‘பின்வாங்கினார்’ என்று மொழிபெயர்த்து, அறிவித்த செயல் நடைபெறாத உண்மையான திருப்பத்தைப் பேணுதல்.
  alternative: ‘மனம் மாறினார்’ அல்லது ‘வருந்தினார்’.
  rationale: இந்த வசனம் மோசேயின் வேண்டுதலுக்குப் பின் அறிவிக்கப்பட்ட நியாயத்தீர்ப்பு நிறைவேற்றப்படாததை விவரிக்கிறது. ‘பின்வாங்கினார்’ என்பது அந்தக் கதைநிகழ்வைப் பேணுகிறது; கடவுளின் மாறாத தன்மை அல்லது மனமாற்றம் குறித்த இறையியல் பதிலை மொழிபெயர்ப்பிலேயே திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ தனிப்பெயராக வைக்கப்பட்டுள்ளது. இரு அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
