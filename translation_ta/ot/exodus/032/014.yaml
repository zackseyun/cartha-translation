revisions:
- from: யாவே, தமது மக்களுக்குச் செய்வதாகச் சொல்லியிருந்த தீங்கைச் செய்வதிலிருந்து பின்வாங்கினார்[a][b].
  to: யாவே தமது மக்களுக்குச் செய்யப்போவதாகச் சொல்லியிருந்த தீங்கைச் செய்வதிலிருந்து பின்வாங்கினார்[a][b].
  rationale: The revision retains the draft’s sound choice of “பின்வாங்கினார்” for the Niphal of נחם, preserving the narrative withdrawal from the announced judgment without imposing a doctrinal resolution. It improves the Tamil expression of the prior, threatened future action and refines the lexical footnote while retaining both required anchors and their scope.
