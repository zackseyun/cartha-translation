base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: ta
  text: மக்கள் கட்டுப்பாடின்றி இருந்ததை மோசே கண்டார்; ஏனெனில் ஆரோன் அவர்களைக் கட்டுப்பாடின்றிப் போக விட்டிருந்தான்[a]; அதன் விளைவாக, அவர்கள் அவர்களுக்கு எதிராக எழுந்தவர்களிடையே இகழ்ச்சிக்குரியவர்களானார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கட்டவிழ்ந்து போகும்படி விட்டிருந்தான்.” மக்களின் நிலையையும் ஆரோனின் செயலையும் குறிப்பிட எபிரெயத்தில் ஒரே வேர்ச்சொல் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய எதிரிகளிடையே கேலிக்கும் இகழ்ச்சிக்கும் உரியவர்களாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: மோசே கண்டார்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுக்கிறது; அடுத்த செயலைத் தூண்டும் மோசேயின் கவனிப்பை இயல்பான தமிழில் கூறுகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இங்கு முகாமில் கூடியிருந்த இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது.
- source_word: כִּי פָרֻעַ הוּא
  choice: மக்கள் கட்டுப்பாடின்றி இருப்பதை
  rationale: פרע என்ற வேர்ச்சொல் கட்டவிழ்ந்த, கட்டுப்பாடு நீங்கிய நிலையைச் சுட்டுகிறது. நெறிப்பிறழ்வின் ஒரு குறிப்பிட்ட வடிவத்தைத் தேவையின்றி சேர்க்காமல் சமூகக் குழப்பத்தைத் தெரிவிக்கிறது.
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: ஏனெனில் ஆரோன் அவர்களைக் கட்டுப்பாடின்றி விட்டிருந்தான்
  rationale: முன்னைய சொல்லின் அதே פרע வேரை இங்கும் ‘கட்டுப்பாடின்றி’ என்று மீளக் கூறி எபிரெயச் சொல் மீளுருவைத் தக்கவைக்கிறது; ஆரோனின் பொறுப்பையும் காரணத் தொடர்பையும் காட்டுகிறது.
- source_word: לְשִׁמְצָה
  choice: கேலிக்குரியவர்களானார்கள்
  rationale: שִׁמְצָה குறிக்கும் இகழ்ச்சி, ஏளனம் அல்லது பழிப்புக்கு ஆளாகும் கருத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּקָמֵיהֶם
  choice: அவர்களுக்கு எதிராக எழுகிறவர்களிடையே
  rationale: קום வேரின் வினையெச்சக் கருத்தான ‘எதிராக எழுகிறவர்கள்’ என்பதை நெருக்கமாகப் பேணுகிறது; பின்னொட்டு இஸ்ரவேல் மக்களைக் குறிக்கிறது.
theological_decisions:
- issue: פרע என்பதன் சமூக/ஒழுக்க நுட்பம்
  choice: கட்டுப்பாடின்றி
  alternative: கட்டவிழ்ந்து / தளர்த்தப்பட்டு / நிர்வாணமாக
  rationale: இச்சூழலில் ஒழுங்கும் கட்டுப்பாடும் இழந்த நிலையே முதன்மை. ‘நிர்வாணமாக’ என்பது சாத்தியமான சொற்பிறப்புச் சார்ந்த நிழலை மிகக் குறிப்பிட்ட பொருளாக மாற்றிவிடும்; வசனம் அதைத் தெளிவாகக் கட்டாயப்படுத்தவில்லை.
- issue: לְשִׁמְצָה-வின் விளைவு உறவு
  choice: அவர்கள் கேலிக்குரியவர்களானார்கள்
  alternative: கேலிக்காக / இகழ்ச்சிக்கு
  rationale: எபிரெய முன்னிடைச்சொல்லின் நோக்கம் அல்லது விளைவைக் குறிக்கும் திறந்த தன்மையைப் பேணியபடி, மக்களின் கட்டுப்பாடற்ற நிலை எதிரிகளிடையே இகழ்ச்சிக்குக் காரணமானது என்பதை இயல்பாகத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில், எபிரெய மூலத்தின் காரணத் தொடர், פרע வேரின் மீளுரு, மற்றும் לְשִׁמְצָה-வின் இகழ்ச்சி நுட்பம் பேணப்பட்டுள்ளன. வசனம் அடுத்த பகுதிக்கு தொடர்வதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
