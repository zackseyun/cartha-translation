source:
  edition: WLC
  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: ta
  text: ஆனால் மோசே தன் கடவுளாகிய யாவேயிடம் மன்றாடி[a], “யாவே, நீர் மிகுந்த வல்லமையாலும் வலிமையான கரத்தாலும்[b] எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்த உமது மக்களுக்கு எதிராக உமது கோபம் ஏன் பற்றி எரிய வேண்டும்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘தன் கடவுளாகிய யாவேயின் முகத்தை நாடி’; அவருடைய தயவை நாடி ஊக்கமாக மன்றாடுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வல்லமையுள்ள கரத்தாலும்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל ... אֶת־פְּנֵי
  choice: யாவேயிடம் மன்றாடி
  rationale: இந்த எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘முகத்தை நாடுதல்’ என்றாலும், ஒருவரின் தயவை நாடி ஊக்கமாக வேண்டிக்கொள்வதைக் குறிக்கும் மரபுத்தொடர். ‘மன்றாடி’ என்பது அதன் அவசரமான வேண்டுதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பான ‘Yahweh’-க்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: יֶחֱרֶה אַפְּךָ
  choice: உமது கோபம் ... பற்றி எரிய வேண்டும்
  rationale: எபிரெய மொழியில் கோபம் எரிவதாக வரும் உருவகத்தைத் தக்கவைத்தும், ‘மூக்கு எரிதல்’ என்ற சொல்லுக்குச் சொல் வடிவைத் தவிர்த்தும் தெளிவான தமிழை அளிக்கிறது.
- source_word: בְּעַמֶּךָ
  choice: உமது மக்களுக்கு எதிராக
  rationale: கோபத்தைக் குறிக்கும் வினையுடன் בְּ என்பது இங்கு எதிரான திசையை உணர்த்துகிறது; ‘உமது மக்கள்’ என்ற உடன்படிக்கை சார்ந்த அழைப்பையும் அப்படியே தக்கவைக்கிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: ‘எகிப்து தேசத்திலிருந்து’ என்பதன் பொருளை நவீன, இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּכֹחַ גָּדוֹל
  choice: மிகுந்த வல்லமையால்
  rationale: கடவுளுடைய செயலாற்றும் பெரும் வல்லமையையும் கருவிப்பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: וּבְיָד חֲזָקָה
  choice: வலிமைமிக்க கரத்தால்
  rationale: விடுதலைச் சம்பவத்துடன் தொடர்புடைய ‘வலிமையான கை’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, மரியாதையான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: கடவுளுடைய கோபத்திற்கான மனித உருவகம்
  choice: உமது கோபம் ... பற்றி எரிய வேண்டும்
  alternative: நீர் ஏன் கோபங்கொள்ள வேண்டும்
  rationale: மூலத்தின் வெப்பம்/எரிதல் உருவகத்தையும் அதன் தீவிரத்தையும் தக்கவைக்கிறது; அதேவேளையில் சொல்லுக்குச் சொல் ‘உமது மூக்கு எரிதல்’ என்று கூறி தவறான புரிதலை உண்டாக்குவதில்லை.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், Yahweh என்ற வடிவிற்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- issue: மோசேயின் கேள்வியின் வேண்டுகோள் தன்மை
  choice: ஏன் ... வேண்டும்?
  alternative: ஏன் ... எரிகிறது?
  rationale: இது தகவல் கேட்கும் சாதாரண வினா மட்டுமல்ல; வரவிருக்கும் தீர்ப்பைத் தவிர்க்கும்படி மோசே மன்றாடும் சொல்லாட்சியாகும். ‘வேண்டும்’ அந்த வேண்டுகோள் சார்ந்த வினாவை வெளிப்படுத்துகிறது; ஆனால் கடவுளின் பதிலை முன்கூட்டியே தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. கடவுளைச் சுட்டும் இடங்களில் ‘நீர்/உமது’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் வாக்கிய ஓட்டமும் கோபம் எரிதல் மற்றும் வலிமைமிக்க கரம் ஆகிய உருவகங்களும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன.
