id: EXO.32.34
reference: Exodus 32:34
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: ta
  text: ஆனால் இப்போது நீ போ; நான் உன்னிடம் கூறிய இடத்துக்கு மக்களை வழிநடத்து. இதோ, என் தூதர் உனக்கு முன்பாகச் செல்வார். ஆனால் நான் கணக்குக் கேட்கும் நாளில், அவர்களுடைய பாவத்திற்காக அவர்களிடம் கணக்குக் கேட்பேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆனால் இப்போது
  rationale: முந்தைய உரையுடன் உள்ள எதிர்மறைத் தொடர்பையும் காலச் சுட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נְחֵה
  choice: வழிநடத்து
  rationale: மக்களை ஓர் இலக்கை நோக்கி நடத்திச் செல்லும் கட்டளையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מַלְאָכִי
  choice: என் தூதர்
  rationale: מַלְאָךְ என்பதன் அடிப்படைப் பொருள் ‘தூதர்’; இங்கு அந்த அடையாளத்தை மேலதிகமாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: פָּקַדְתִּי / וּפָקַדְתִּי
  choice: கணக்குக் கேட்கும் / கணக்குக் கேட்பேன்
  rationale: פקד இங்கு பொறுப்புக்குட்படுத்தி விசாரித்தல் அல்லது தண்டித்தல் என்ற பரப்பைக் கொண்டது; ஒரே எபிரெய வேரின் மீளுரையைத் தமிழிலும் பேணுகிறது.
theological_decisions:
- issue: ‘என் தூதர்’ என்பவரின் அடையாளம்
  choice: என் தூதர்
  alternative: என் தேவதூதர்
  rationale: மூல உரை இவ்வசனத்தில் தூதரின் இயல்பு அல்லது அடையாளத்தைத் தெளிவுபடுத்தவில்லை; ஆகவே அதனைச் சுருக்கமாகவும் திறந்ததாகவும் வைத்திருக்கிறது.
- issue: פקד என்ற வினையின் நீதித்தீர்ப்புப் பொருள்
  choice: கணக்குக் கேட்பேன்
  alternative: தண்டிப்பேன்
  rationale: குற்றத்திற்குப் பொறுப்பேற்கச் செய்வது என்ற பொருளை வெளிப்படுத்துகிறது; தண்டனை உட்பொருளாக இருந்தாலும் அதன் சரியான வடிவத்தை உரைக்கு அப்பால் நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட நேரடி நடை. ‘இதோ’ என்பது הִנֵּה-வின் கவன ஈர்ப்பை இயல்பாகப் பேணுகிறது; மூலத்தின் மீளுரையும் பாதுகாக்கப்பட்டுள்ளது.
