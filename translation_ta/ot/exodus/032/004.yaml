  to: அவன் அவர்களுடைய கைகளிலிருந்து அதை பெற்று, செதுக்கும் கருவியால் அதை வடிவமைத்து[a], வார்க்கப்பட்ட கன்றுக்குட்டி உருவமாக ஆக்கினான். அப்போது அவர்கள், “இஸ்ரவேலே, எகிப்து நாட்டிலிருந்து உன்னை மேலே கொண்டுவந்த உன் தெய்வங்கள் இவையே!” என்று சொன்னார்கள்.[b][c]
  rationale: 'The revision makes one necessary lexical correction: ‘பெற்று’ faithfully conveys receiving/taking the objects without the purchase implication of ‘வாங்கி.’ It also smooths the final result clause in modern standard Tamil while preserving Aaron’s direct agency, the order of the two Hebrew actions, the cast-image sense, and the source’s plural acclamation. All supplied footnote anchors remain present and their notes retain the stated ambiguity and textual variant.'
