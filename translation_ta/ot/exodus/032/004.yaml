base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: ta
  text: அவன் அவர்களுடைய கைகளிலிருந்து அதை பெற்று, செதுக்கும் கருவியால் அதை வடிவமைத்து[a], வார்க்கப்பட்ட கன்றுக்குட்டி உருவமாக ஆக்கினான். அப்போது அவர்கள், “இஸ்ரவேலே, எகிப்து நாட்டிலிருந்து உன்னை மேலே கொண்டுவந்த உன் தெய்வங்கள் இவையே!” என்று சொன்னார்கள்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செதுக்குகோலால்,’ ‘எழுத்தாணியால்,’ அல்லது ‘உளியால்’ என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெயச் சொல்லின் துல்லியமான பொருள் விவாதத்திற்குரியது.
    reason: lexical_alternative
  - marker: b
    text: சில உரை மரபுகளில் “அவன் சொன்னான்” என்று ஒருமையில் வாசிக்கப்படுகிறது.
    reason: textual_variant
  - marker: c
    text: எபிரெயத்தில், “உன் தெய்வங்கள் இவையே” என்று பன்மையில் உள்ளது. ஒரே கன்று உருவம் குறிப்பிடப்படுவதால், மரபாக இது பெரும்பாலும் “உன் தெய்வம் இதுவே” என்று ஒருமையில் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: அவன் அவர்களுடைய கைகளிலிருந்து அதை வாங்கி
  rationale: לקח என்பது ‘எடு/பெறு’ எனப் பொருள்படும்; முந்தைய வசனத்திலுள்ள பொன் பொருட்களைச் சூழலிலிருந்து ‘அதை’ என வெளிப்படுத்துகிறது. பன்மை உடைமைச் சுட்டை ‘அவர்களுடைய கைகளிலிருந்து’ எனப் பேணுகிறது.
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: செதுக்கும் கருவியால் அதை வடிவமைத்து
  rationale: יצר கைவினை முறையில் வடிவமைப்பதைக் குறிக்கிறது. חֶרֶט எந்தத் துல்லியமான கருவி என்பது விவாதத்திற்குரியது; ஆகவே இயல்பான பொதுப்பெயர் பயன்படுத்தப்பட்டு மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וַיַּעֲשֵׂהוּ עֵגֶל מַסֵּכָה
  choice: வார்ப்பால் செய்யப்பட்ட ஒரு கன்றுக்குட்டியாக அதை உருவாக்கினான்
  rationale: עֵגֶל என்பது கன்றுக்குட்டி; מַסֵּכָה உலோகத்தை உருக்கி வார்க்கப்பட்ட உருவத்தைக் குறிக்கிறது. ‘வார்ப்பால் செய்யப்பட்ட’ என்பது தயாரிப்பு முறையைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וַיֹּאמְרוּ
  choice: அவர்கள் ... சொன்னார்கள்
  rationale: WLC மசோரா உரையின் வினைச்சொல் பன்மையில் உள்ளது; சில மரபுகளின் ஒருமை வாசகம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: אֵלֶּה אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: இஸ்ரவேலே, ... உன் தெய்வங்கள் இவையே
  rationale: אֵלֶּה மற்றும் אֱלֹהֶיךָ இரண்டும் இலக்கணரீதியாகப் பன்மை. ஒரே கன்று உருவம் இருந்தபோதிலும் மூல உரையின் பன்மையையும் அதிலுள்ள பதற்றத்தையும் மொழிபெயர்ப்பு பேணுகிறது.
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து உன்னை மேலே கொண்டுவந்த
  rationale: עלה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘மேலே கொண்டுவருதல்’ என்ற எபிரெய சொற்றொடரைப் பேணுகிறது; ‘எகிப்து நாட்டிலிருந்து’ என்பது முழு மூலச் சொற்றொடரை பிரதிபலிக்கிறது.
theological_decisions:
- issue: விக்கிரகத்தைச் சுட்டும் கூற்றில் பன்மையா ஒருமையா
  choice: “உன் தெய்வங்கள் இவையே” எனப் பன்மையில் மொழிபெயர்த்தல்
  alternative: “உன் தெய்வம் இதுவே”
  rationale: மசோரா உரையில் சுட்டுப்பெயரும் ‘தெய்வங்கள்’ என்பதும் பன்மை வடிவில் உள்ளன. ஒரே கன்று உருவத்துடன் ஏற்படும் பதற்றத்தை அமைதியாகச் சீராக்காமல் மூலத்தின் பன்மையைப் பேணுகிறது.
- issue: உருவத்தைச் செய்ததில் ஆரோனின் நேரடி பங்கு
  choice: ‘வடிவமைத்து ... உருவாக்கினான்’ என்று நேரடி செயற்பாட்டைப் பேணுதல்
  alternative: அவன் பொன்னைப் பெற்றான் அல்லது வேலையை மேற்பார்வையிட்டான் என்று செயற்பாட்டை மென்மைப்படுத்துதல்
  rationale: இரு எபிரெய வினைகளும் ஒருமை எழுவாய்க்கே செயலை நேரடியாக வழங்குகின்றன; ஆரோனின் பங்கை மொழிபெயர்ப்பு குறைக்கக்கூடாது.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்கு புரியத்தக்கதாயும் வேதாகமக் கதையுரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. எபிரெய உரையின் தொடர் வினை அமைப்பும் பன்மைத் தெய்வக் கூற்றும் பேணப்பட்டுள்ளன; חֶרֶט குறித்த உறுதியின்மை அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
