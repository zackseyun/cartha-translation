  yaml_path: translation/ot/exodus/032/003.yaml
  text: So all the people took off the gold rings that were in their ears and brought them to Aaron[a][b].
translation:
  language: ta
  text: மக்கள் அனைவரும் தங்கள் காதுகளில் இருந்த தங்க வளையங்களைக்[b] கழற்றி[a], அவற்றை ஆரோனிடம் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பிய்த்து அகற்றினார்கள்” அல்லது “வலிந்து கழற்றினார்கள்” என்றும் மொழிபெயர்க்கலாம். இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெய வினை வலிமையாக அகற்றுவதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “தங்கக் காதணிகள்” என்றும் மொழிபெயர்க்கலாம். “வளையங்கள்” என்பதற்கான எபிரெயச் சொல் இச்சூழலில் காதில் அணியும் அணிகலன்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: கழற்றி
  rationale: התפעל வடிவம் மக்கள் தாங்களே அணிகலன்களை அகற்றியதைக் குறிக்கிறது. ‘கழற்றி’ என்பது இச்சூழலில் இயல்பான நவீனத் தமிழ்; வலிந்து அகற்றுதல் என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: திரண்டிருந்த சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கும் இயல்பான, நேரடியான தமிழாக்கம்.
- source_word: נִזְמֵי הַזָּהָב
  choice: தங்க வளையங்கள்
  rationale: נֶזֶם என்பது காதிலோ மூக்கிலோ அணியும் வளைய அணிகலனைக் குறிக்கலாம். அடுத்துள்ள ‘காதுகளில்’ என்ற தொடர் இங்கு அதன் இடத்தைத் தெளிவுபடுத்துவதால், ‘தங்க வளையங்கள்’ மூலச்சொல்லின் பொருள் பரப்பைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: தங்கள் காதுகளில் இருந்த
  rationale: வளையங்கள் இருந்த இடத்தைச் சுட்டும் எபிரெய உறவுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: அவற்றை ஆரோனிடம் கொண்டுவந்தார்கள்
  rationale: ‘கொண்டுவருதல்’ என்பது வினையின் நேரடியான பொருள். தமிழில் தெளிவுக்காக, முன் குறிப்பிடப்பட்ட வளையங்களைச் சுட்டும் ‘அவற்றை’ சேர்க்கப்பட்டுள்ளது.
