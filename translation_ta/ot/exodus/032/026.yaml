base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: ta
  text: அப்போது மோசே முகாமின் நுழைவாயிலில் நின்று, “யாவேயின் பக்கம் இருப்பவர் யார்? என்னிடம் வாருங்கள்[a]” என்றார். லேவியின் மகன்கள் அனைவரும்[b] அவரிடம் கூடிவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “யாவேயின் பக்கம் யார்? என்னிடம்!” இங்கு உள்ள மறைமுக அழைப்பைத் தெளிவாக்க “வாருங்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: 'இதை “லேவியர் அனைவரும்” என்றும் மொழிபெயர்க்கலாம். சொல்லுக்குச் சொல்: “லேவியின் மகன்கள் அனைவரும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: நின்று
  rationale: עמד என்பதன் இயல்பான கதைநடைப் பொருள் ‘நின்றார்’ என்பதாகும்; அதில் இல்லாத முறையான அல்லது படைசார் நுணுக்கத்தைச் சேர்க்காமல் தமிழில் இயல்பாகத் தருகிறது.
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: முகாமின் நுழைவாயிலில்
  rationale: שַׁעַר என்பது வாயில் அல்லது நுழைவாயிலைக் குறிக்கிறது. முகாமின் எல்லையிலுள்ள நுழையும் இடத்தை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் காட்ட ‘நுழைவாயிலில்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִי לַיהוָה
  choice: யாவேயின் பக்கம் இருப்பவர் யார்?
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘யாவேக்காக/யாவேயிடம் யார்?’ என உள்ளது. இச்சூழலில் ל என்பது யாவேக்கு ஆதரவாகவும் விசுவாசமாகவும் நிற்கும் சார்பைச் சுட்டுகிறது; ‘யாவேயின் பக்கம்’ அந்த விசுவாசச் சார்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என்று தருகிறது.
- source_word: אֵלַי
  choice: என்னிடம் வாருங்கள்
  rationale: எபிரெயத்தில் சொல்லுக்குச் சொல் ‘என்னிடம்!’ என்று வினைச்சொல் விடுபட்டுள்ளது. சூழலில் உள்ள அழைப்பைத் தமிழில் முழுமையாகவும் இயல்பாகவும் தெரிவிக்க ‘வாருங்கள்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וַיֵּאָסְפוּ
  choice: கூடிவந்தார்கள்
  rationale: Niphal வடிவம் ஒன்றுகூடுதல் அல்லது திரண்டுவருதலைக் குறிக்கிறது. அடுத்துள்ள אֵלָיו காட்டும் மோசேயை நோக்கிய இயக்கத்தையும் தமிழில் இயல்பாக வெளிப்படுத்த ‘கூடிவந்தார்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: אֶל என்பது ஒருவரை நோக்கிய இயக்கத்தை நேரடியாகக் குறிக்கிறது; ‘அவரிடம்’ அந்தப் பொருளை கூடுதல் விளக்கமின்றி பாதுகாக்கிறது.
- source_word: כָּל בְּנֵי לֵוִי
  choice: லேவியின் மகன்கள் அனைவரும்
  rationale: மூலத்தின் ‘லேவியின் மகன்கள்’ என்ற உறவு மற்றும் கோத்திர அடையாளச் சொல்லாட்சியைப் பாதுகாக்கிறது; சுருக்கமான ‘லேவியர் அனைவரும்’ என்பதைக் காட்டிலும் வடிவத்துக்கு நெருக்கமானது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: இங்கு மூல உரை தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் தனிப்பட்ட பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: מִי לַיהוָה என்பதில் குறிக்கப்படும் சார்பு
  choice: யாவேயின் பக்கம் இருப்பவர் யார்?
  alternative: யாவேக்குரியவர் யார்?
  rationale: சூழல் மோசேயின் அழைப்புக்கு வெளிப்படையாகப் பதிலளிக்க வேண்டிய விசுவாசச் சார்பை வலியுறுத்துகிறது. ‘யாவேக்குரியவர்’ என்பது உடைமை அல்லது சொந்தம் என்ற பொருளை முன்னிறுத்தக்கூடும்; ‘யாவேயின் பக்கம்’ என்பது எந்தக் குறிப்பிட்ட இறையியல் விளக்கத்தையும் திணிக்காமல் சூழலின் ஆதரவு/விசுவாசப் பொருளைத் தருகிறது.
- issue: בְּנֵי לֵוִי என்ற பாலினம் குறிக்கப்பட்ட கோத்திரச் சொற்றொடர்
  choice: லேவியின் மகன்கள் அனைவரும்
  alternative: லேவியர் அனைவரும்
  rationale: மூலத்தில் உள்ள ‘மகன்கள்’ என்ற ஆண்பால் உறவுச் சொல்லையும் கோத்திர வழிவந்தோர் என்ற வடிவத்தையும் முதன்மை உரையில் பாதுகாக்கிறது; வழக்கமான கோத்திரப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவேயின் பக்கம்’ என்பது பொதுவாசகருக்கு உடனடியாகப் புரியும் விசுவாசச் சார்பைத் தருகிறது. மூலத்தின் சுருக்கமான ‘என்னிடம்!’ என்ற அழைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டு, முதன்மை உரையில் இயல்பான தமிழ் வாக்கியமாக விரிவாக்கப்பட்டுள்ளது.
