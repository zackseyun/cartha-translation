  source_fidelity: மொழிபெயர்ப்பு எபிரேயத்தின் மரபுத்தொடரான מִלְאוּ יֶדְכֶם என்பதன் அர்ப்பணிப்பு/புனிதப் பணிக்கான நிறுவுதல் சார்ந்த பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது; சொல்லடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. אִישׁ בִּבְנוֹ וּבְאָחִיו என்ற வினையில்லா, சுருக்கமான கூறு ‘எதிராக நின்றான்’ எனச் சூழலுக்கேற்ப நிரப்பப்பட்டுள்ளது; ‘கொன்றான்’ என்று மூலத்தைவிடக் குறிப்பாக்கவில்லை. இறுதியிலுள்ள infinitive அமைப்பில் ஆசீர்வாதம் அளிப்பவர் வெளிப்படையாகக் கூறப்படாததைச் செயப்பாட்டு வடிவமும் அடிக்குறிப்பும் முறையாகக் காக்கின்றன.
  naturalness: ‘மோசே கூறினார்’ மற்றும் மேற்கோள் நடை நவீன தரநிலைத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளன. ‘ஆண்டவருக்கென உங்களை அர்ப்பணித்துக்கொள்ளுங்கள்’ என்பது கட்டளைத் தொனியையும் நோக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது. ‘இதனால்’ என்பது முன்கூறிய செயலுக்கும் ஆசீர்வாதத்திற்குமான தொடர்பை வாசகருக்குத் தெளிவுபடுத்துகிறது; மூலப் பொருளை மாற்றுவதில்லை.
  terminology: ‘ஆண்டவர்,’ ‘அர்ப்பணித்துக்கொள்ளுங்கள்,’ ‘ஆசீர்வாதம்’ ஆகிய தேர்வுகள் பொதுவழக்கிலுள்ள வேதாகமத் தமிழுக்கும் இலக்குப் பதிவுக்கும் பொருந்துகின்றன. அடிக்குறிப்பு a, ‘கைகளை நிரப்புங்கள்’ என்ற உருவகத்தையும் புனித நிறுவுதல் சார்ந்த அதன் பொருள்வளத்தையும் சரியாகச் சுட்டுகிறது. அடிக்குறிப்பு b, கொடுப்பவர் வெளிப்படையாகக் குறிப்பிடப்படாத இலக்கண அம்சத்தைத் துல்லியமாகப் பதிவு செய்கிறது.
