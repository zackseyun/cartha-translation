base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: ta
  text: 'மோசே கூறினார்: “இன்று ஆண்டவருக்கென உங்களை அர்ப்பணித்துக்கொள்ளுங்கள்[a]. ஏனெனில், உங்களில் ஒவ்வொருவனும் தன் மகனுக்கும் தன் சகோதரனுக்கும் எதிராக நின்றான்; இதனால் இன்று உங்கள்மேல் ஆசீர்வாதம் வழங்கப்படும்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “இன்று ஆண்டவருக்காக உங்கள் கைகளை நிரப்புங்கள்.” இது அர்ப்பணித்தல் அல்லது ஒரு புனிதப் பணியில் நிறுவுதல் குறித்த எபிரேய மரபுத்தொடர்.'
    reason: மூலத்தின் உருவகச் சொல்லாட்சியையும் அதன் சாத்தியமான நிறுவுதல் சார்ந்த பொருளையும் வாசகருக்குப் பாதுகாக்கிறது.
  - marker: b
    text: “ஆசீர்வாதம் வழங்கப்படும்” என்பதற்கான எபிரேயச் சொற்றொடர் கொடுப்பவர் யார் என்பதை வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: இறைவனை வெளிப்படையான எழுவாயாகச் சேர்க்காமல் மூலத்திலுள்ள இலக்கணத் தெளிவின்மையைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: உங்களை அர்ப்பணித்துக்கொள்ளுங்கள்
  rationale: சொல்லுக்குச் சொல் ‘உங்கள் கையை நிரப்புங்கள்’ என்ற எபிரேய மரபுத்தொடர், ஒருவரை ஒரு புனிதப் பணிக்கென அர்ப்பணித்தல் அல்லது நிறுவுதல் என்னும் பொருளைத் தருகிறது. நவீன தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் ‘அர்ப்பணித்துக்கொள்ளுங்கள்’ என வழங்கப்பட்டது; அதன் சொல்லடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: לַיהוָה
  choice: ஆண்டவருக்கென
  rationale: יהוה என்ற தேவநாமத்தைத் தமிழில் வழக்கமான சிறப்புப் பெயராக்கமான ‘ஆண்டவர்’ என்று வழங்கி, -க்கென என்பதால் அர்ப்பணிப்பின் நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: ஒவ்வொருவனும் தன் மகனுக்கும் தன் சகோதரனுக்கும் எதிராக நின்றான்
  rationale: எபிரேயத்தில் வினைச்சொல் விடுபட்டுள்ள சுருக்கமான அமைப்பு. முந்தைய வசனங்களின் சூழலில், குடும்ப உறவுகளைவிட ஆண்டவருக்குக் கீழ்ப்படிதலை முன்னிறுத்தி அவர்களுக்கு எதிராகச் செயல்பட்டதை ‘எதிராக நின்றான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלָתֵת עֲלֵיכֶם הַיּוֹם בְּרָכָה
  choice: இதனால் இன்று உங்கள்மேல் ஆசீர்வாதம் வழங்கப்படும்
  rationale: ‘உங்கள்மேல் ஆசீர்வாதம் கொடுக்க’ என்ற நோக்கம்/விளைவைச் சுட்டும் அமைப்பை இயல்பான தமிழில் வழங்குகிறது. கொடுப்பவர் மூலத்தில் வெளிப்படையாகக் குறிப்பிடப்படாததால் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: ‘கையை நிரப்புதல்’ என்ற அர்ப்பணிப்பு மரபுத்தொடரின் பொருள்
  choice: உங்களை அர்ப்பணித்துக்கொள்ளுங்கள்
  alternative: உங்களை குருக்களாக நியமித்துக்கொள்ளுங்கள்
  rationale: இந்த இடத்தில் லேவியரின் பிற்காலக் குருத்துவப் பதவியை வெளிப்படையாகச் சேர்ப்பது மூலத்தின் பரந்த மரபுத்தொடரை அளவுக்கு மீறிக் குறிப்பாக்கும். ‘அர்ப்பணித்துக்கொள்ளுங்கள்’ அதன் புனித நிறுவுதல் சார்ந்த பொருளைத் தக்கவைக்கிறது.
- issue: ஆசீர்வாதத்தை வழங்குபவர் யார்
  choice: வழங்கப்படும் என்ற செயப்பாட்டு வடிவம்
  alternative: அவர் உங்களுக்கு ஆசீர்வாதம் அளிப்பார்
  rationale: எபிரேய infinitive அமைப்பில் செய்பவர் வெளிப்படையாக இல்லை. இறைவனே வழங்குபவர் என்பது சூழலால் உணரப்படலாம்; ஆனால் மொழிபெயர்ப்பில் அதைத் திட்டவட்டமாகச் சேர்க்காமல் மூலத்தின் இலக்கணத் திறந்தநிலையைப் பாதுகாக்கிறது.
- issue: மகனுக்கும் சகோதரனுக்கும் எதிராக இருந்த செயல்
  choice: எதிராக நின்றான்
  alternative: கொன்றான்
  rationale: முந்தைய சூழலில் கொலை நிகழ்ந்திருந்தாலும், இவ்வசனத்தில் ‘கொன்றான்’ என்ற வினைச்சொல் இல்லை. ஆகவே சூழலை உணர்த்தியும் மூலத்தைவிடக் குறிப்பாக்காமலும் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடை. ‘ஆண்டவர்’, ‘அர்ப்பணித்துக்கொள்ளுங்கள்’, ‘ஆசீர்வாதம்’ ஆகியவை பொதுவாகப் புரியும் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன. எபிரேயத்தின் சுருக்கமான மற்றும் ஓரளவு தெளிவற்ற அமைப்புகள் தேவையற்ற சமயக் கோட்பாட்டு விளக்கமின்றிப் பாதுகாக்கப்பட்டுள்ளன.
