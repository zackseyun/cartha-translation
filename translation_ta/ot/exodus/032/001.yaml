  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: ta
  text: மோசே மலையிலிருந்து இறங்கி வரத் தாமதமாவதைக் மக்கள் கண்டபோது, மக்கள் ஆரோனைச் சுற்றிக் கூடிவந்து அவரிடம், “எழுந்து, எங்களுக்காக எங்களுக்கு முன்பாகச் செல்லும் தெய்வங்களை[a] செய்துகொடு. எகிப்து நாட்டிலிருந்து எங்களை மேலே கொண்டுவந்த இந்த மோசே என்னும் மனிதனுக்கு என்ன ஆனதென்று எங்களுக்குத் தெரியாது” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுக்காக எங்களுக்கு முன்பாகச் செல்லும் ஒரு தெய்வத்தை.” பின்னர் வரும் நிகழ்ச்சி ஒரே கன்றுக்குட்டிச் சிலையை மையப்படுத்துவதால், சிலர் இங்குள்ள אֱלֹהִים என்ற சொல்லை ஒருமைப் பொருளில் புரிந்துகொள்கிறார்கள். ஆனால் எபிரெய மொழியில் இச்சொல்லும் அதைத் தொடரும் வினையும் பன்மையில் உள்ளன.
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: வெகுநேரம் ஆவதை
  rationale: மோசே இறங்கி வருவதற்கு எதிர்பார்த்ததைவிட நீண்ட நேரம் ஆகிறது என்ற மக்களின் பார்வையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָרֶדֶת מִן הָהָר
  choice: மலையிலிருந்து இறங்கி வர
  rationale: மலையின் மேலிருந்து கீழே வரும் திசையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: ஆரோனைச் சுற்றிக் கூடிவந்து
  rationale: ஆரோனை மையமாகக் கொண்டு மக்கள் கூட்டமாகத் திரண்டதையும் அவர்மீது செலுத்திய அழுத்தத்தையும் உணர்த்துகிறது; வெளிப்படையாக ‘எதிராக’ என்று மிகைப்படுத்தவில்லை.
- source_word: קוּם
  choice: எழுந்து
  rationale: எபிரெய கட்டளையின் திடீர்மையையும் வற்புறுத்தலையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: עֲשֵׂה לָנוּ
  choice: எங்களுக்காகச் செய்துகொடு
  rationale: ஆரோன் அவர்களுக்காக ஒன்றை உருவாக்க வேண்டும் என்ற பயனாளிப் பொருளை வெளிப்படையாகக் காக்கிறது.
- source_word: אֱלֹהִים
  choice: தெய்வங்களை
  rationale: பெயர்ச்சொல் பன்மை வடிவில் இருப்பதோடு, அதைத் தொடரும் יֵלְכוּ என்ற வினையும் பன்மையில் இருப்பதால் முதன்மை உரையில் பன்மை தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: எங்களுக்கு முன்பாகச் செல்லும்
  rationale: அவை மக்களுக்கு வழிகாட்டி முன்னே செல்ல வேண்டும் என்ற கோரிக்கையை, பன்மைத் தொடர்பைச் சூழல் மூலம் காக்கும் இயல்பான தமிழில் தருகிறது.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: அந்த மனிதனான இந்த மோசே
  rationale: ‘இந்த மோசே’ என்பதிலுள்ள அலட்சியமான சுட்டுதலையும் ‘அந்த மனிதன்’ என்ற பின்னிணைப்பையும் தமிழில் புரியத்தக்க வகையில் காக்கிறது.
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து எங்களை மேலே கொண்டுவந்த
  rationale: עלה என்பதன் causative கருத்தான ‘மேலே கொண்டுவருதல்’ என்பதையும் ‘எகிப்து நாடு’ என்ற முழுச் சொற்றொடரையும் பாதுகாக்கிறது.
- source_word: מֶה הָיָה לוֹ
  choice: என்ன ஆனதென்று
  rationale: மோசேயின் நிலை அல்லது முடிவு என்னவாயிற்று என்று கேட்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் இணை இது.
theological_decisions:
- issue: אֱלֹהִים என்பதை இங்கு ஒருமையிலா பன்மையிலா மொழிபெயர்ப்பது
  choice: 'பன்மை: ‘தெய்வங்களை’'
  alternative: 'ஒருமை: ‘ஒரு தெய்வத்தை’'
  rationale: உடனடி எபிரெய இலக்கணத்தில் אֱלֹהִים பன்மை வடிவிலும், அதனுடன் தொடர்புடைய יֵלְכוּ வினை பன்மையிலும் உள்ளது. பின்னர் ஒரே கன்றுக்குட்டிச் சிலை மையமாக வருவதால் ஒருமையாகப் புரிந்துகொள்ளும் வாய்ப்பு உண்மையானது; அது அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மக்களின் அவசரமும் மோசேயைப் பற்றிய அலட்சியத் தொனியும் காக்கப்பட்டுள்ளன. எபிரெய பன்மை இலக்கணம் முதன்மை உரையில் வைக்கப்பட்டு, கன்றுக்குட்டிச் சிலை காரணமாக எழும் ஒருமை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
