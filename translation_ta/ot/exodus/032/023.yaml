  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: ta
  text: அவர்கள் என்னிடம், “எங்களுக்காக எங்களுக்கு முன்பாகச் செல்லும் தெய்வங்களைச் செய்துகொடு[a]. ஏனெனில், எங்களை எகிப்து நாட்டிலிருந்து மேலே கொண்டுவந்த இந்த மோசே, அந்த மனிதனுக்கு என்ன ஆனதென்று எங்களுக்குத் தெரியவில்லை” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுக்காக எங்களுக்கு முன்பாகச் செல்லும் ஒரு தெய்வத்தைச் செய்துகொடு.” எபிரெய மூலத்தில் பெயர்ச்சொல்லும் அதனுடன் வரும் வினைச்சொல்லும் பன்மையில் உள்ளன; ஆனால் சுற்றியுள்ள பகுதியில் ஒரு கன்றுக்குட்டி உருவம் குறிப்பிடப்படுவதால், சிலர் இதை ஒருமையாக மொழிபெயர்க்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: அவர்கள் என்னிடம் ... என்றார்கள்
  rationale: தொடர்கதை நகர்வையும் ‘என்னிடம்’ என்ற மறைமுகப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עֲשֵׂה לָנוּ
  choice: எங்களுக்காகச் செய்துகொடு
  rationale: கட்டளைத் தொனியையும் לָנוּ என்பதன் பயனாளிப் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: தெய்வங்களை
  rationale: אֱלֹהִים தனித்தோ பன்மையோ ஆக அமையக்கூடியது; ஆனால் இங்கு அதனுடன் வரும் יֵלְכוּ என்ற வினைச்சொல் பன்மையில் இருப்பதால் பன்மை மொழிபெயர்ப்பு முதன்மைப்படுத்தப்படுகிறது.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: எங்களுக்கு முன்பாகச் செல்லும்
  rationale: மக்களுக்கு முன்னே சென்று வழிநடத்தும் கருத்தைத் தமிழ் வழக்கில் இயல்பாகத் தருகிறது; பன்மை எண்ணிக்கை ‘தெய்வங்களை’ என்பதில் வெளிப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மக்களின் கோரிக்கைக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இடைச்சொல்லை நேரடியாகக் காக்கிறது.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: அந்த மோசே என்ற மனிதன்
  rationale: மோசேயைப் பற்றிய சற்றே விலகிய, இகழ்வுச் சாயல் இருக்கக்கூடிய குறிப்பிடுதலை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து எங்களை மேலே அழைத்துவந்த
  rationale: Hiphil வடிவத்தின் ‘மேலே கொண்டுவருதல்’ என்ற யாத்திராகமச் சொல்லாட்சியையும் מֵאֶרֶץ என்பதையும் வெளிப்படையாகக் காக்கிறது.
- source_word: לֹא יָדַעְנוּ מֶה הָיָה לוֹ
  choice: அவனுக்கு என்ன நேர்ந்ததோ எங்களுக்குத் தெரியவில்லை
  rationale: அவருடைய நிலை அல்லது முடிவு என்னவாயிற்று என்று அறியாமையைத் தெரிவிக்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: ஆரோனின் அறிக்கையில் אֱלֹהִים என்பதை ஒருமையிலா பன்மையிலா மொழிபெயர்ப்பது
  choice: 'பன்மை: ‘தெய்வங்களை’'
  alternative: 'ஒருமை: ‘ஒரு தெய்வத்தை’'
  rationale: சார்பு வாக்கியத்திலுள்ள יֵלְכוּ (‘அவர்கள் செல்வார்கள்’) பன்மை வடிவம் என்பதால் இவ்வசனத்தில் பன்மை வாசிப்பே இலக்கண ரீதியில் வலுவானது. சுற்றியுள்ள கன்றுக்குட்டி உருவத்தோடு செயற்கையாக ஒத்திசைக்காமல் மூலத்தின் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான உரைநடை. ‘மேலே அழைத்துவந்த’ என்பது எபிரெய யாத்திராகமச் சொல்லாட்சியைப் பாதுகாக்கிறது; ‘தெய்வங்கள்’ என்ற பன்மை மூல இலக்கணத்தின் உண்மையான பதற்றத்தைத் தீர்த்துவிடாமல் நிறுத்துகிறது.
