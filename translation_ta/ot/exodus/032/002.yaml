base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/002.yaml
  text: And Aaron said to them[a], “Take off the rings of gold that are in the ears of your wives, your sons, and your daughters, and bring them to me.”
translation:
  language: ta
  text: அப்போது ஆரோன் அவர்களிடம், “உங்கள் மனைவிகள், மகன்கள், மகள்கள் ஆகியோரின் காதுகளில் இருக்கும் தங்க வளையங்களைக் கழற்றி[a] என்னிடம் கொண்டுவாருங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்க வளையங்களைப் பிய்த்து எடுங்கள்.” இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெய வினை, ஆபரணங்களை வலுக்கட்டாயமாகப் பிடுங்கி அல்லது பிய்த்து அகற்றுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்துச் செல்கிறது; நவீன தமிழில் இயல்பான கதைத் தொடரை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: אֲלֵהֶם
  choice: அவர்களிடம்
  rationale: எபிரெய உரையிலுள்ள பன்மைச் சுட்டுப்பெயரை விளக்கப் பெயர்ச்சொல்லாக மாற்றாமல் நேரடியாகப் பேணுகிறது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: פָּרְקוּ
  choice: கழற்றி
  rationale: உடலில் அணிந்திருக்கும் ஆபரணத்தை அகற்றும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; வினையின் வலுவான ‘பிய்த்து/பிடுங்கி அகற்றுதல்’ என்ற சாத்தியம் அடிக்குறிப்பில் பேணப்படுகிறது.
- source_word: נִזְמֵי הַזָּהָב
  choice: தங்க வளையங்கள்
  rationale: נֶזֶם என்பது மூக்கு அல்லது காதில் அணியும் வளையத்தைக் குறிக்கலாம்; அடுத்த சொற்றொடர் காதுகளைத் தெளிவாகக் குறிப்பிடுவதால் ‘வளையங்கள்’ என்பது பொருத்தமானது.
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: காதுகளில் இருக்கும்
  rationale: வளையங்களின் இருப்பிடத்தைக் குறிப்பிடும் எபிரெய உறவுத்தொடரைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: נְשֵׁיכֶם
  choice: உங்கள் மனைவிகள்
  rationale: இக்குடும்பப் பட்டியலில் נָשִׁים என்பதன் உறவுசார் பொருள் ‘மனைவிகள்’ என்பதே மிகச் சாத்தியமானது.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם
  choice: மகன்கள், மகள்கள்
  rationale: எபிரெய உரை மகன்களையும் மகள்களையும் தனித்தனியாகக் குறிப்பிடுவதைப் பேணுகிறது.
- source_word: וְהָבִיאוּ אֵלָי
  choice: என்னிடம் கொண்டுவாருங்கள்
  rationale: கட்டளை வினையையும் ‘என்னிடம்’ என்ற இலக்கையும் நவீன மரியாதைப் பன்மை வடிவில் இயல்பாகத் தருகிறது; கொண்டுவரப்படுவது முன்பே தெளிவாக இருப்பதால் தனிச் சுட்டுப்பெயர் தேவையில்லை.
