  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: ta
  text: இப்போது, என்னை விட்டுவிடு[a]; அவர்கள்மேல் என் கோபம் பற்றி எரியட்டும்; நான் அவர்களை அழித்துவிடட்டும்[b]. உன்னையோ ஒரு பெரிய தேசமாக ஆக்குவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைத் தனியாக விடு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் கோபம் அவர்கள்மேல் கொதிக்கட்டும்; நான் அவர்களை அழித்தொழிக்கட்டும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּיחָה לִּי
  choice: என்னைத் தனியாக விடு
  rationale: இந்த இடத்தில் வினைச்சொல், ஒருவரைத் தடுக்காமல் விட்டுவிடுதல் அல்லது அவரைச் செயல்பட விடுதல் என்ற பொருளைக் கொண்டது. நவீன தமிழில் இயல்பாகவும் கட்டளையின் வலிமையுடனும் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְיִחַר אַפִּי
  choice: அப்போது என் கோபம் … பற்றி எரிந்து
  rationale: எபிரெயச் சொற்றொடர் கோபம் எரிவதாகிய உருவகத்தைப் பயன்படுத்துகிறது. அதைத் தணிக்காமல் காக்கும் வகையில் ‘பற்றி எரிந்து’ என வழங்கப்பட்டது; தொடக்க இணைப்பு சூழலில் விளைவு அல்லது நோக்கத்தைக் குறிக்கிறது.
- source_word: בָהֶם
  choice: அவர்களுக்கு எதிராக
  rationale: கோபம் யாரை நோக்கியது என்பதை எபிரெய முன்னிடைச்சொல் இச்சூழலில் குறிக்கிறது; தமிழில் ‘எதிராக’ என்பது இயல்பான இணைவு.
- source_word: וַאֲכַלֵּם
  choice: நான் அவர்களை முற்றிலும் அழித்துவிடுவேன்
  rationale: Piel வடிவிலுள்ள כלה இங்கு முழுமையாக முடிவுக்குக் கொண்டுவருதல், அழித்தொழித்தல் என்ற பொருளைக் கொண்டது. ‘முற்றிலும்’ என்பது செயல்வினையின் முழுமையை வெளிப்படுத்துகிறது.
- source_word: וְאֶעֱשֶׂה אוֹתְךָ לְגוֹי גָּדוֹל
  choice: உன்னையோ ஒரு பெரிய தேசமாக ஆக்குவேன்
  rationale: ‘ஒருவரை ஒன்றாக ஆக்குதல்’ என்ற எபிரெய அமைப்பை இயல்பான தமிழில் நேரடியாகத் தருகிறது. ‘தேசம்’ என்பது גוי என்பதற்கான தெளிவான இணை; ‘பெரிய’ என்பது மூலத்தின் உடன்படிக்கைசார் எதிரொலியை மேலதிக விளக்கமின்றிக் காக்கிறது.
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: பேச்சை உடனடியான கட்டளைக்குக் கொண்டு செல்லும் சொற்பயன்பாடு; ‘இப்போது’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: கடவுளுடைய கோபத்தை மனித உணர்வின் உருவகத்தில் கூறுதல்
  choice: ‘என் கோபம் … பற்றி எரிந்து’ என்ற உருவகம் அப்படியே காக்கப்பட்டது.
  alternative: ‘நான் அவர்கள்மேல் கோபப்படுவேன்’ என்று உருவகமின்றி பொதுவாகக் கூறுதல்.
  rationale: மூல எபிரெயம் கோபம் எரிவதாகத் தெளிவாகவும் தீவிரமாகவும் கூறுகிறது. அதை மென்மையாக்காமல் வைத்திருப்பது தெய்வீக பரிசுத்தத்திற்கும் நியாயத்தீர்ப்பிற்கும் இடையிலான உரையின் வலிமையையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: ‘என்னைத் தனியாக விடு’ என்ற கட்டளைக்கும் மோசேயின் பரிந்துபேசுதலுக்கும் உள்ள தொடர்பு
  choice: இது உண்மையான நேரடிக் கட்டளையாக மொழிபெயர்க்கப்பட்டது; அது மறைமுகமாகப் பரிந்துபேச அழைக்கிறதா என்பது விளக்கப்படவில்லை.
  alternative: மோசே பரிந்துபேச வேண்டும் என்பதற்கான மறைமுக அழைப்பாக மொழிபெயர்ப்பிலேயே விளக்குதல்.
  rationale: வசனம் நேரடிக் கட்டளையையும் வரவிருக்கும் நியாயத்தீர்ப்பையும் வாக்குறுதியையும் மட்டுமே முன்வைக்கிறது. பரிந்துபேசுவதற்கான அழைப்பு என்ற முடிவு விளக்கவுரைக்குரியது; அதை மொழிபெயர்ப்பில் சேர்க்கக் கூடாது.
- issue: வினை வடிவங்களின் நோக்கம் அல்லது விளைவு சார்ந்த நுணுக்கம்
  choice: கட்டளைக்குப் பின் வரும் செயல்களை ‘அப்போது’ என விளைவுசார் தொடர்புடன் வழங்குதல்.
  alternative: ‘எரியட்டும்’, ‘அழிக்கட்டும்’ போன்ற வேண்டுதல் அல்லது அனுமதி வடிவங்களைப் பயன்படுத்துதல்.
  rationale: எபிரெய இணைப்பு இங்கு நோக்கம் அல்லது விளைவு ஆகிய இரண்டிற்கும் இடமளிக்கிறது. தமிழில் ‘அப்போது’ என்பது சூழலின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது; அதேவேளை இது வெறும் உணர்ச்சி வேண்டுதலாக மாறுவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நடை எளிமையானதாயினும் கண்ணியமானது. ‘பற்றி எரிந்து’ என்ற உருவகம் மூலத்தின் தீவிரத்தைத் தக்கவைக்கிறது; ‘உன்னையோ’ என்பது அழிக்கப்படவிருக்கும் மக்களுக்கும் மோசேக்கு அளிக்கப்படும் வாக்குறுதிக்கும் இடையிலான மாறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
