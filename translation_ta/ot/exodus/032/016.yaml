  text: וְ/הַ֨/לֻּחֹ֔ת מַעֲשֵׂ֥ה אֱלֹהִ֖ים הֵ֑מָּה וְ/הַ/מִּכְתָּ֗ב מִכְתַּ֤ב אֱלֹהִים֙ ה֔וּא חָר֖וּת עַל הַ/לֻּחֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: ta
  text: அந்தப் பலகைகள் கடவுளின் வேலைப்பாடே; எழுத்தோ கடவுளின் எழுத்தே; அது அந்தப் பலகைகளில் பொறிக்கப்பட்டிருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: அந்தப் பலகைகள்
  rationale: லֻחֹת என்பது எழுதுவதற்கான பலகைகளைக் குறிக்கிறது. இவ்வசனத்தில் ‘கல்’ என்பது வெளிப்படையாக இல்லை; முந்தைய சூழலிலிருந்து அது தெரிகிறது என்பதால் இங்கே சேர்க்கப்படவில்லை. எபிரெய definite article சூழலில் ஏற்கெனவே அறியப்பட்ட பலகைகளைச் சுட்டுவதால் ‘அந்த’ பயன்படுத்தப்பட்டது.
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: கடவுளின் கைவேலை
  rationale: இந்தச் சேர்க்கை கடவுளால் செய்யப்பட்ட வேலை அல்லது அவருடைய வேலைப்பாட்டைக் குறிக்கிறது. ‘கைவேலை’ என்பது பெயர்ச்சொல் அமைப்பையும் நேரடி தெய்வீகச் செயலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הֵמָּה
  choice: —
  rationale: தனி சுட்டுப்பெயர் எபிரெயத்தில் வலியுறுத்துகிறது. தமிழில் ‘அந்தப் பலகைகள் கடவுளின் கைவேலை’ என்ற பயனிலை அமைப்பே அந்த அடையாளப்படுத்தும் வலியுறுத்தலை இயல்பாகத் தருகிறது; தனியாக ‘அவையே’ சேர்ப்பது தேவையற்ற மிகை.
- source_word: הַמִּכְתָּב
  choice: அவற்றிலிருந்த எழுத்து
  rationale: מִכְתָּב என்பது எழுத்து அல்லது எழுதப்பட்டதைச் சுட்டுகிறது. பலகைகளுடன் உள்ள தொடர்பை தமிழில் தெளிவாக்க ‘அவற்றிலிருந்த’ பயன்படுத்தப்பட்டது.
- source_word: מִכְתַּב אֱלֹהִים
  choice: கடவுளின் எழுத்து
  rationale: மூலத்தின் ‘எழுத்து ... எழுத்து’ என்ற சொல்லடுக்கு வலியுறுத்தலைக் காப்பதற்காக அதே பெயர்ச்சொல் மீண்டும் பயன்படுத்தப்பட்டது.
- source_word: חָרוּת
  choice: பொறிக்கப்பட்டிருந்தது
  rationale: חָרוּת என்பது மேற்பரப்பில் வெட்டி அல்லது செதுக்கிப் பதிக்கப்பட்டதைக் குறிக்கிறது. கற்பலகைகளிலுள்ள எழுத்துக்கு ‘பொறிக்கப்பட்டது’ துல்லியமான, இயல்பான தமிழ்.
- source_word: עַל הַלֻּחֹת
  choice: அந்தப் பலகைகளில்
  rationale: இங்கு עַל இடத்தைக் குறிக்கிறது. தமிழில் எழுத்து ஒரு பலகையின் மேற்பரப்பில் இருப்பதை ‘பலகைகளில்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְ
  choice: ; / மேலும் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை
  rationale: இணைப்புச் சொற்களின் தொடர்பு தமிழில் அரைப்புள்ளி மற்றும் வாக்கிய அமைப்பால் இயல்பாக வெளிப்படுகிறது. மூலத்தில் தனியான காலச்சுட்டுச் சொல் இல்லாததால் ‘இப்போது’ சேர்க்கப்படவில்லை.
theological_decisions:
- issue: பலகைகளும் எழுத்தும் யாருடைய செயல் என்பது
  choice: பலகைகள் ‘கடவுளின் கைவேலை’ என்றும் எழுத்து ‘கடவுளின் எழுத்து’ என்றும் பெயர்ச்சொல் வடிவில் நேரடியாக அடையாளப்படுத்தப்பட்டுள்ளன.
  alternative: ‘கடவுள் பலகைகளைச் செய்தார்; கடவுள் எழுத்தை எழுதினார்’ என்று வினைச்சொல் வடிவில் மொழிபெயர்க்கலாம்.
  rationale: எபிரெயம் வினைச்சொல் வாக்கியங்களுக்குப் பதிலாக ‘கடவுளின் வேலை’ மற்றும் ‘கடவுளின் எழுத்து’ என்ற பெயர்ச்சொல் தொடர்களைப் பயன்படுத்துகிறது. அதே அமைப்பை வைத்திருப்பது, செயல் முறையை மேலதிகமாக விளக்காமல் இரண்டையும் கடவுளுக்கே வலியுறுத்திக் கூறுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. மூலத்தின் பெயர்ச்சொல் அமைப்பும் ‘எழுத்து’ என்ற சொல்லின் மறுபயன்பாடும் காக்கப்பட்டுள்ளன; சூழலில் மட்டும் தெரியும் ‘கல்’ உரையில் சேர்க்கப்படவில்லை.
