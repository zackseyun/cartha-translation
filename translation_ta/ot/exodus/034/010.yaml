source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “இதோ, நான் ஓர் உடன்படிக்கை செய்கிறேன். உன் மக்கள் அனைவரின் முன்பாகவும், பூமியெங்கிலும் எல்லாத் தேசங்களிலும் இதுவரை உருவாக்கப்படாத அதிசயங்களைச் செய்வேன். நீ வாழும் மக்கள் அனைவரும் யெகோவாவின் செயலைக் காண்பார்கள்; ஏனெனில் நான் உன்னோடு செய்வது பிரமிக்கத்தக்கது.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் வலிமையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: כֹּרֵת בְּרִית
  choice: ஓர் உடன்படிக்கை செய்கிறேன்
  rationale: சொல்லுக்குச் சொல் ‘உடன்படிக்கையை வெட்டுகிறேன்’ என்பது தமிழில் இயல்பற்றது; அதன் நிலையான பொருளான உடன்படிக்கையை ஏற்படுத்துதல் என்பதைக் கொடுக்கிறது.
- source_word: נִפְלָאֹת
  choice: அதிசயங்கள்
  rationale: மனித ஆற்றலை மீறிய வியப்பூட்டும் செயல்களைச் சுட்டும் வழக்கமான, தெளிவான தமிழ்.
- source_word: לֹא נִבְרְאוּ
  choice: இதுவரை நிகழாத
  rationale: எபிரெயத்தில் சொற்பட ‘படைக்கப்படாத’ என்று இருந்தாலும், அதிசயங்களைப் பற்றிய சூழலில் முன்பு தோன்றாத அல்லது நிகழாத செயல்கள் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מַעֲשֵׂה יְהוָה
  choice: யெகோவாவின் செயல்
  rationale: தெய்வீகப் பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் தருகிறது; ஒருமை ‘செயல்’ என்பதையும் காக்கிறது.
- source_word: נוֹרָא
  choice: பிரமிக்கத்தக்கது
  rationale: அச்சம், வியப்பு, மாட்சிமை ஆகிய நுண்ணுணர்வுகளை ஒருங்கே தாங்கும் சொல்லை, வெறும் ‘பயங்கரமானது’ எனச் சுருக்காமல் வழங்குகிறது.
theological_decisions:
- issue: אֲנִי עֹשֶׂה עִמָּךְ என்பதில் ‘உன்னோடு’ அல்லது ‘உனக்காக’
  choice: நான் உன்னோடு செய்யப்போவது
  alternative: நான் உனக்காகச் செய்யப்போவது
  rationale: עִם என்பதன் நேரடியான உறவுப்பொருளைத் தக்கவைத்து, மோசேயும் உடன்படிக்கை மக்களும் இதில் சம்பந்தப்பட்டிருப்பதை மறைக்கவில்லை.
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப்பெயர் அல்ல, தனிப்பட்ட தெய்வீகப் பெயர் உள்ளது; அதனைத் தமிழில் அறியப்பட்ட பெயர்வடிவில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதவாக்கியத்திற்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘இதோ’ மற்றும் ‘உன்னோடு’ போன்ற மூலத்தின் முக்கிய வலியுறுத்தல்கள் காக்கப்பட்டுள்ளன.
