base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: ta
  text: ஆறு நாட்கள் நீ வேலை செய்வாய்; ஆனால் ஏழாம் நாளில் நீ வேலையை நிறுத்துவாய்[a]. உழும் காலத்திலும் அறுவடைக் காலத்திலும் நீ வேலையை நிறுத்துவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஓய்வெடுப்பாய்.’ எபிரெய வினைச்சொல் அடிப்படையில் நிறுத்துதல் அல்லது ஓய்தல் என்பதைக் குறிக்கும்; விரிவான பொருளில் ஓய்வெடுத்தல் என்றும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ஆறு நாட்கள்
  rationale: எபிரெயக் கட்டமைப்பின் சுருக்கத்தையும் கால அளவையும் நேரடியாகக் காட்டுகிறது.
- source_word: תַּעֲבֹד
  choice: நீ வேலைசெய்வாய்
  rationale: இங்குள்ள Qal imperfect உடன்படிக்கைச் சட்டத்தின் கட்டளை வலிமையைக் கொண்டுள்ளது; தமிழில் எதிர்கால வடிவம் இத்தகைய விதிப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ஆனால் ஏழாம் நாளில்
  rationale: ו இணைப்புச்சொல் இங்கு ஆறு வேலைநாட்களுக்கும் ஏழாம் நாளுக்கும் இடையிலான முரண்பாட்டைக் குறிக்கிறது.
- source_word: תִּשְׁבֹּת
  choice: வேலை செய்வதை நிறுத்துவாய்
  rationale: שׁבת என்பதன் அடிப்படைப் பொருள் நிறுத்துதல் அல்லது ஓய்தல். சூழலில் நிறுத்தப்படுவது வேலை என்பதால், இயல்பான தமிழில் அதனை வெளிப்படையாகக் கூறுகிறது.
- source_word: בֶּחָרִישׁ
  choice: உழவுக் காலத்திலும்
  rationale: חרישׁ உழுதல் மட்டுமல்லாமல் உழவுப் பருவத்தையும் குறிக்கலாம்; காலச்சூழலைத் தெளிவாகத் தருகிறது.
- source_word: וּבַקָּצִיר
  choice: அறுவடைக் காலத்திலும்
  rationale: קציר அறுவடை அல்லது அறுவடைக் காலத்தைக் குறிக்கிறது; முந்தைய வேளாண் காலப்பதத்துடன் இணையான தமிழாக்கம்.
- source_word: תִּשְׁבֹּת (second occurrence)
  choice: வேலை செய்வதை நிறுத்துவாய்
  rationale: எபிரெய மூலத்தின் வலியுறுத்தும் மறுபடியுரையைப் பாதுகாத்து, பரபரப்பான வேளாண் காலங்களிலும் கட்டளை பொருந்துவதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ஓய்வுநாளுடன் தொடர்புடைய שׁבת வினைச்சொல்லின் மொழிபெயர்ப்பு
  choice: இரு இடங்களிலும் ‘வேலை செய்வதை நிறுத்துவாய்’
  alternative: ‘ஓய்வெடுப்பாய்’
  rationale: வசனம் ஏழாம் நாளில் உழைப்பை நிறுத்துவதை, குறிப்பாக முக்கியமான வேளாண் பருவங்களிலும், வலியுறுத்துகிறது. ‘நிறுத்து’ என்பது שׁבת என்பதன் அடிப்படைச் சொல்லுணர்வைப் பாதுகாக்கிறது; ‘ஓய்வெடு’ என மொழிபெயர்த்து அனுபவம் சார்ந்த குறுகிய பொருளை மட்டும் திணிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ஒருமை ஆண்பால் முகவரியின் தமிழில் இயல்பான பொதுப்பயன்பாட்டாக ‘நீ’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் மறுபடியுரையும் வேளாண் பருவங்களின் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
