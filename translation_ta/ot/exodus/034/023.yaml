source:
  edition: WLC
  text: שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה יֵרָאֶה֙ כָּל זְכ֣וּרְ/ךָ֔ אֶת פְּנֵ֛י הָֽ/אָדֹ֥ן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: ta
  text: ஆண்டில் மூன்று முறை, உன்னிடமுள்ள ஆண்கள் அனைவரும் இஸ்ரவேலின் கடவுளான ஆண்டவர் யாவே[b] முன்பாக[a] ஆஜராக வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொல்லுக்கு சொல், “முகத்திற்கு முன்பாக.” இந்த மரபுத்தொடர் “முன்பாக” அல்லது “முன்னிலையில்” என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: 'மூல எபிரேயத்தில் இரண்டு வேறுபட்ட சொற்கள் உள்ளன: “ஆண்டவர்” (ஹா-ஆதோன்) என்ற பட்டப்பெயரும் “யாவே” (YHWH) என்ற தெய்வீகப் பெயரும்.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: ஆண்டில் மூன்று முறை
  rationale: ஆண்டுச் சுழற்சிக்குள் மூன்று தடவை என்ற எபிரேயச் சொற்றொடரின் பொருளை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: יֵרָאֶה
  choice: ஆஜராக வேண்டும்
  rationale: இது கடவுளின் முன்னிலையில் திருவிழா வழிபாட்டுக்காக வருவதைக் குறிக்கும் வழக்கமான நிபால் வடிவம். ‘காணப்பட வேண்டும்’ என்ற செயப்பாட்டு வடிவம் தமிழில் தவறான எண்ணத்தைத் தரக்கூடும்; ‘ஆஜராக வேண்டும்’ கடமையையும் முன்னிலையில் வருதலையும் தெளிவாகக் காட்டுகிறது.
- source_word: כָּל זְכוּרְךָ
  choice: உன்னிடமுள்ள ஆண்கள் அனைவரும்
  rationale: எபிரேய மொழியில் கூறப்பட்டுள்ள ஆண்பாலாருக்கான குறிப்பை பாலினப் பொதுமைப்படுத்தலின்றி காக்கிறது; ஒருமை இரண்டாம் நபர் உடைமைத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶת פְּנֵי
  choice: முன்பாக
  rationale: சொல்லுக்கு சொல் ‘முகத்திற்கு முன்பாக’ என்ற எபிரேய மரபுத்தொடர் ஒருவரின் முன்னிலை அல்லது சந்நிதியைக் குறிக்கிறது. ‘முன்பாக’ தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הָאָדֹן
  choice: ஆண்டவர்
  rationale: இங்கு இது கடவுளைக் குறிக்கும் பட்டப்பெயர். தொடர்ந்து வரும் தனிப்பெயரான யாவே என்பதிலிருந்து வேறுபாட்டைக் காத்து, தமிழில் வழக்கமான மரியாதைமிக்க இணையாக ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: யாவேவை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்தும் எபிரேய இணைப்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: הָאָדֹן மற்றும் יְהוָה இணைந்துள்ள இடத்தில் தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: ஆண்டவர் யாவே
  alternative: ஆண்டவராகிய கர்த்தர் / ஆண்டவராகிய கடவுள்
  rationale: மூலத்தில் பட்டப்பெயரும் தெய்வீகத் தனிப்பெயரும் அடுத்தடுத்து வருகின்றன. இரண்டையும் ஒன்றாக்காமல் ‘ஆண்டவர் யாவே’ என்று தருவது அந்த வேறுபாட்டைக் காக்கிறது.
- issue: திருவிழாவில் ஆஜராகும் கடமையின் பாலினக் குறிப்பு
  choice: உன்னிடமுள்ள ஆண்கள் அனைவரும்
  alternative: உன்னிடமுள்ள அனைவரும்
  rationale: זְכוּרְךָ ஆண்களைத் திட்டவட்டமாகக் குறிக்கிறது. ஆகவே மூலத்தின் வரலாற்று-உடன்படிக்கைச் சூழலிலுள்ள பாலினக் குறிப்பைப் பொதுமைப்படுத்தாமல் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆஜராக வேண்டும்’ என்பது வழிபாட்டுத் திருவிழாவில் கடமையாக முன்னிலையில் வருதல் என்ற பொருளைச் சுருக்கமாகத் தருகிறது. தெய்வீகப் பெயரும் பட்டப்பெயரும் வேறுபடுத்தப்பட்டுள்ளன; மூலத்தில் உள்ள ஆண்பாலார் குறிப்பு அப்படியே காக்கப்பட்டுள்ளது.
