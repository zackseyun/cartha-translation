base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/016.yaml
  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: ta
  text: மேலும், நீ அவனுடைய மகள்களில் சிலரை உன் மகன்களுக்காக எடுத்துக்கொள்வாய்[b]; அவனுடைய மகள்கள் தங்கள் தெய்வங்களைப் பின்பற்றி வேசித்தனம் புரிந்து, உன் மகன்களையும் தங்கள் தெய்வங்களைப் பின்பற்றி வேசித்தனத்தில் ஈடுபடச் செய்வார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விலைமகளைப்போல் நடப்பார்கள்.’ பிற தெய்வங்களைப் பின்பற்றுவதை எபிரெய உரை பாலியல் துரோக மொழியை உருவகமாகப் பயன்படுத்திக் கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, திருமண உறவின் மூலம் அந்த மகள்கள் உன் மகன்களைத் தங்கள் தெய்வங்களைப் பின்பற்றச் செய்வார்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: மேலும், நீ ... எடுத்துக்கொள்வாய்
  rationale: இணைப்புடன் வந்துள்ள Qal perfect வடிவம் இந்த எச்சரிக்கைத் தொடரில் எதிர்கால விளைவைக் குறிக்கிறது. திருமண ஏற்பாட்டைச் சூழல் உணர்த்தினாலும், மூலச்சொல்லின் நேரடிப் பொருளான ‘எடுத்துக்கொள்’ என்பதே வைக்கப்பட்டுள்ளது.
- source_word: מִבְּנֹתָיו
  choice: அவனுடைய மகள்களில் சிலரை
  rationale: מִן என்ற முன்னிடைச்சொல்லின் பகுதியெடுக்கும் பொருளை இயல்பான தமிழில் ‘மகள்களில் சிலரை’ என்று வெளிப்படுத்துகிறது.
- source_word: לְבָנֶיךָ
  choice: உன் மகன்களுக்காக
  rationale: திருமண ஏற்பாட்டின் சூழலில் לְ இலக்கு அல்லது பயனாளியைக் குறிக்கிறது; ‘மகன்களுக்காக’ என்பது அந்த உறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְזָנוּ
  choice: வேசித்தனம் செய்வார்கள்
  rationale: זנה இங்கு பிற தெய்வங்களை நாடுவதைப் பாலியல் துரோகத்தின் உருவகத்தால் கூறுகிறது. உருவகத்தின் கடுமையை மழுங்கடிக்காமல் நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: אַחֲרֵי אֱלֹהֵיהֶן
  choice: தங்கள் தெய்வங்களைப் பின்பற்றி
  rationale: ‘தெய்வங்களுக்குப் பின்னால் செல்லுதல்’ என்ற எபிரெய வழக்கை இயல்பான தமிழில் ‘பின்பற்றி’ என வழங்கி, பிற தெய்வங்களை நாடும் இயக்கத்தைப் பாதுகாக்கிறது.
- source_word: וְהִזְנוּ
  choice: வேசித்தனம் செய்யவைப்பார்கள்
  rationale: 'Hiphil வடிவத்தின் காரணவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது: அந்த மகள்கள் மகன்களையும் அதே வழியில் செல்லச் செய்வார்கள்.'
- source_word: אֶת בָּנֶיךָ
  choice: உன் மகன்களையும்
  rationale: நேரடி செயப்படுபொருளையும், முந்தைய மகள்களுடன் தொடர்புடைய தொடர்ச்சியையும் ‘-ஐயும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵיהֶן
  choice: தங்கள் தெய்வங்கள்
  rationale: பெண்பால் பன்மை உடைமைப் பின்னொட்டின் பொருளைத் தமிழின் தற்சுட்டு உடைமை வடிவமான ‘தங்கள்’ மூலம் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: விக்கிரக வழிபாட்டுச் சூழலில் זנה என்பதன் மொழிபெயர்ப்பு
  choice: ‘வேசித்தனம் செய்வார்கள்’ என்ற பாலியல் துரோக உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘விக்கிரக வழிபாடு செய்வார்கள்’ அல்லது ‘உண்மையற்றவர்களாவார்கள்’
  rationale: எபிரெய உரை வழிபாட்டு மற்றும் உடன்படிக்கைத் துரோகத்தைத் திட்டமிட்டே பாலியல் துரோக மொழியில் சித்தரிக்கிறது. அதை பொதுவான ‘விக்கிரக வழிபாடு’ என்று மாற்றுவது உரையின் தீவிரத்தையும் உருவகத்தையும் இழக்கச் செய்யும்.
- issue: בנותיו / בניך ஆகிய சொற்களின் பாலினத் துல்லியம்
  choice: ‘மகள்கள்’ மற்றும் ‘மகன்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘பிள்ளைகள்’ அல்லது ‘சந்ததியினர்’
  rationale: திருமணத் தொடர்புடைய இச்சூழலில் மூல உரை மகள்களையும் மகன்களையும் குறிப்பாகச் சொல்கிறது; ஆகவே பாலினப் பொதுமைப்படுத்தல் தவிர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் கடுமையான உருவகம் மழுங்கடிக்கப்படவில்லை; அதேவேளை அதன் உருவகப் பயன்பாடு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. வசனம் முந்தைய எச்சரிக்கையின் தொடராக இருப்பதால் ‘மேலும்’ எனத் தொடங்குகிறது.
