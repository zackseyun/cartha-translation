  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: ta
  text: அந்த நாட்டில் குடியிருப்பவர்களோடு நீ உடன்படிக்கை செய்துகொள்வாயோ; அவர்கள் தங்கள் தெய்வங்களைப் பின்பற்றி வேசித்தனம்பண்ணி[a], தங்கள் தெய்வங்களுக்குப் பலியிடுவார்கள்; அவர்களில் ஒருவன் உன்னை அழைப்பான்[b], நீ அவனுடைய பலியிலிருந்து உண்பாய்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், தங்கள் தெய்வங்களைப் பின்பற்றுவதற்காகப் பாலியல் துரோகத்தின் உருவகம் பயன்படுத்தப்பட்டுள்ளது; சொல்லுக்கு சொல், ‘தங்கள் தெய்வங்களுக்குப் பின்னால் வேசித்தனம்பண்ணுவார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: ‘அவன் உன்னை அழைப்பான்.’ இங்குள்ள ஒருமை, ‘அவர்களில் ஒருவன் உன்னை அழைப்பான்’ என்ற பகிர்ந்தளிக்கும் பொருளைக் கொண்டிருக்கலாம்.'
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், ‘அவனுடைய பலியிலிருந்து உண்பாய்’; அதாவது, அவன் செலுத்திய பலியோடு தொடர்புடைய உணவை உண்பாய்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: செய்துகொள்ளாதபடி பார்த்துக்கொள்
  rationale: פֶּן எச்சரிக்கையுடன் தவிர்க்க வேண்டிய சாத்தியமான விளைவை அறிமுகப்படுத்துகிறது. முந்தைய வசனத்தின் எச்சரிக்கைத் தொடரை இயல்பான நவீனத் தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: תִּכְרֹת בְּרִית
  choice: உடன்படிக்கை செய்துகொள்
  rationale: எபிரெய மொழிமரபின் சொற்பொருள் ‘உடன்படிக்கையை வெட்டு’ என்பதாக இருந்தாலும், ‘உடன்படிக்கை செய்துகொள்’ என்பது அதன் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: அந்த நாட்டில் குடியிருப்பவர்கள்
  rationale: ஒருமை வடிவிலுள்ள கூட்டுப்பெயர், நாட்டில் வாழும் மக்களை மொத்தமாகக் குறிக்கிறது.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: தங்கள் தெய்வங்களைப் பின்பற்றி வேசித்தனம் செய்து
  rationale: זנה விக்கிரக வழிபாட்டை பாலியல் துரோகத்தின் உருவகத்தால் சித்தரிக்கிறது. ‘வேசித்தனம் செய்து’ அந்தக் கடுமையான உருவகத்தை மழுங்கடிக்காமல் காக்கிறது.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: தங்கள் தெய்வங்களுக்குப் பலியிடுவார்கள்
  rationale: வினைச்சொல் வழிபாட்டுக்குரிய பலிசெலுத்துதலை நேரடியாகக் குறிக்கிறது.
- source_word: וְקָרָא לְךָ
  choice: அவர்களில் ஒருவன் உன்னை அழைப்பான்
  rationale: முன்னுள்ள பன்மை எழுவாய்க்குப் பின் வரும் ஒருமை வினை, அந்த மக்களில் யாராவது ஒருவர் என்ற பகிர்ந்தளிக்கும் பொருளைக் கொண்டிருக்கலாம்; தமிழில் அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: நீயும் அவனுடைய பலியிலிருந்து உண்பாய்
  rationale: பலியோடு தொடர்புடைய உணவில் பங்கேற்பதைச் சொல்கிறது; ‘பலியிலிருந்து’ என்பது ‘பலிவிருந்து’ என்று விளக்கிவிடாமல் மூலத்தின் வடிவத்தையும் பொருள் அகலத்தையும் காக்கிறது.
