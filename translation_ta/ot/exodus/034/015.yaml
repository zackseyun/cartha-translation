- issue: பன்மை எழுவாய்க்குப் பின் வரும் ‘அவன் அழைப்பான்’ என்ற ஒருமை
  choice: ‘அவர்களில் ஒருவன் உன்னை அழைப்பான்’ என்று பகிர்ந்தளிக்கும் பொருளில் மொழிபெயர்த்தல்
  alternative: ‘அவன் உன்னை அழைப்பான்’ அல்லது ‘அவர்கள் உன்னை அழைப்பார்கள்’
  rationale: ஒருமையைப் பன்மையாக்காமல், அந்தக் குழுவைச் சேர்ந்த தனிநபர் ஒருவன் அழைக்கும் சூழலைத் தமிழில் இயல்பாகத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘வேசித்தனம்’ கடுமையான சொல்லாக இருந்தாலும், மூலத்தின் உடன்படிக்கைத் துரோக உருவகத்தைத் திட்டமிட்டு காக்கிறது. முதல் வாக்கியம் முந்தைய வசனத்திலிருந்து தொடரும் פֶּן எச்சரிக்கையைத் தனிவசனமாகவும் புரியுமாறு இயல்பாக்குகிறது.
