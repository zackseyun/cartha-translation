base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: ta
  text: ஆயிரங்களுக்கு மாறாத அன்பைக் காத்துவருகிறவர்[a]; அக்கிரமத்தையும் மீறுதலையும் பாவத்தையும் மன்னிக்கிறவர்; ஆனாலும் தண்டிக்காமல் ஒருபோதும் விடமாட்டார்[b]; தந்தையரின் அக்கிரமத்திற்காகப் பிள்ளைகளையும் பிள்ளைகளின் பிள்ளைகளையும், மூன்றாம் தலைமுறையினரையும் நான்காம் தலைமுறையினரையும் கணக்குக்குக் கேட்கிறவர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆயிரம் தலைமுறைகளுக்கு.’ எபிரெயில் ‘ஆயிரங்களுக்கு’ என்று மட்டுமே உள்ளது; இது மூன்றாம், நான்காம் தலைமுறையினர்மேல் வரும் தீர்ப்புடன் கடவுளின் நீடித்த அன்பை ஒப்பிடுவதாக இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘குற்றமுள்ளவரைக் குற்றமற்றவர் என்று நிச்சயமாகத் தீர்க்கமாட்டார்.’ எபிரெய அமைப்பு மறுப்பை மிகவும் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் ‘தந்தையர்’ என்ற ஆண்பால் சொல் உள்ளது; தலைமுறை வழியாக வரும் சந்ததியைக் குறித்தாலும், மூலத்தின் வடிவை இங்கே தக்கவைத்துள்ளோம்.
    reason: cultural_note
lexical_decisions:
- source_word: נֹצֵר
  choice: காத்துவருகிறவர்
  rationale: Qal வினையெச்சத்தின் தொடர்ச்சியான காத்தல் அல்லது பேணுதல் என்ற செயற்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: அன்பும் நிலையான உண்மைப்பற்றும் இணைந்த உடன்படிக்கைச் சொல்லின் செறிவை, பொதுவாசகர்களுக்குப் புரியும் நவீன தமிழில் தருகிறது.
- source_word: לָאֲלָפִים
  choice: ஆயிரங்களுக்கு
  rationale: எபிரெய உரையில் இருப்பது போலவே ‘ஆயிரங்கள்’ என்பதை மட்டும் வைத்திருந்து, நபர்களா தலைமுறைகளா என்பதை முதன்மை உரையில் தீர்மானிக்கவில்லை.
- source_word: נֹשֵׂא
  choice: மன்னிக்கிறவர்
  rationale: அடிப்படையில் ‘சுமத்தல்/சுமந்து செல்லுதல்’ என்றாலும், பாவச்சொற்களுடன் வரும் இச்சூழலில் மன்னித்தல் என்பதே இயல்பான பொருள்.
- source_word: עָוֺן
  choice: அக்கிரமம்
  rationale: தவறான செயலும் அதனுடன் தொடர்புடைய குற்றப்பொறுப்பும் சேர்ந்த ஒழுக்கவியல் கனத்தைத் தக்கவைக்கிறது.
- source_word: פֶשַׁע
  choice: மீறுதல்
  rationale: எல்லை அல்லது உறவை மீறுதல், கலகத்தன்மை ஆகியவற்றைக் குறிக்கக்கூடிய சொல்லை மிகையாக விளக்காமல் தருகிறது.
- source_word: חַטָּאָה
  choice: பாவம்
  rationale: மூன்று பாவச்சொற்களின் தொடரை நேரடியாகவும் வழக்கமான இறையியல் மொழியிலும் நிறைவு செய்கிறது.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: ஆனாலும் தண்டிக்காமல் ஒருபோதும் விடமாட்டார்
  rationale: வினைமுற்றை வலுப்படுத்தும் எபிரெய அமைப்பை ‘ஒருபோதும்’ என வெளிப்படுத்தி, மூலத்தில் இல்லாத ‘குற்றவாளி’ என்ற வெளிப்படையான செயப்படுபொருளைச் சேர்க்காமல் நீதித்துறைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: פֹּקֵד
  choice: விசாரிக்கிறவர்
  rationale: פקד என்பதன் பரந்த பொருளை முழுமையாக ‘தண்டித்தல்’ என்று சுருக்காமல், அக்கிரமத்தைக் கணக்கில் கொண்டு அதற்கேற்ப செயல்படுதல் என்ற தீர்ப்புச் சூழலைத் தக்கவைக்கிறது.
- source_word: עֲוֺן אָבוֹת
  choice: தந்தையரின் அக்கிரமம்
  rationale: மூலத்தின் ஆண்பால் பன்மையான ‘தந்தையர்’ என்பதையும் முன்னர் வந்த עָוֺן என்பதற்கான ஒரே தமிழ்ச் சொல்லையும் தக்கவைக்கிறது.
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: பிள்ளைகள்மேலும் பிள்ளைகளின் பிள்ளைகள்மேலும்
  rationale: எபிரெயச் சொற்றொடரின் தலைமுறை இறக்கத்தை இயல்பாகக் காட்டுகிறது; சூழலில் சந்ததியினரைப் பொதுவாகக் குறிக்க ‘பிள்ளைகள்’ ஏற்றது.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: மூன்றாம் தலைமுறைவரையும் நான்காம் தலைமுறைவரையும்
  rationale: எபிரெயில் மறைமுகமாக உள்ள ‘தலைமுறை’ என்பதைத் தெளிவுக்காகச் சேர்த்து, இரு வரம்புகளையும் தனித்தனியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: மன்னிப்புக்கும் நீதிக்கும் இடையிலான וְנַקֵּה לֹא יְנַקֶּה என்ற பதற்றம்
  choice: முழுமையான மன்னிப்பு மொழியையும், தண்டிக்காமல் ஒருபோதும் விடமாட்டார் என்ற வலியுறுத்தலையும் ஒன்றாகத் தக்கவைத்தல்.
  alternative: ‘குற்றவாளியை நிச்சயமாகக் குற்றமற்றவன் என்று தீர்க்கமாட்டார்’ என்று நீதிமன்ற மொழியில் மொழிபெயர்த்தல்.
  rationale: வசனம் இரக்கத்தையும் நீதியையும் அருகருகே நிறுத்துகிறது; ஒன்றைக் கொண்டு மற்றொன்றைத் தணிக்காமல் இரண்டையும் தக்கவைக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளும் சேர்க்கப்படவில்லை.
- issue: לָאֲלָפִים என்பதில் ‘தலைமுறைகள்’ என்பதைச் சேர்ப்பதா
  choice: முதன்மை உரையில் ‘ஆயிரங்களுக்கு’ என்று மட்டும் வைத்தல்.
  alternative: ‘ஆயிரம் தலைமுறைகளுக்கு’ அல்லது ‘ஆயிரக்கணக்கான தலைமுறைகளுக்கு’ என்று தருதல்.
  rationale: இந்த வசனத்தின் எபிரெய உரையில் ‘தலைமுறைகள்’ என்ற சொல் இவ்விடத்தில் இல்லை. இணை வசனத்தின் மொழியை இங்கே இறக்குமதி செய்யாமல், சாத்தியமான தலைமுறைப் பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: முன்னோரின் அக்கிரமம் சந்ததியினர்மேல் விசாரிக்கப்படுதல்
  choice: ‘விசாரிக்கிறவர்’ என்ற திறந்த தீர்ப்புச் சொல்லை வைத்து உரையின் தலைமுறைப் பதற்றத்தைத் தக்கவைத்தல்.
  alternative: ‘அக்கிரமத்தின் விளைவுகளை வரச்செய்கிறவர்’ அல்லது ‘தண்டிக்கிறவர்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: פקד என்பதைக் குறிப்பாக தண்டனை அல்லது இயந்திரமயமான பரம்பரைக் குற்றச்சுமத்தல் என்று முடிவுசெய்யாமல், மூலத்தின் பரந்த தீர்ப்புப் பொருளை வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் அறிக்கைத்தன்மையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாறாத அன்பு,’ ‘அக்கிரமம்,’ ‘மீறுதல்,’ ‘பாவம்’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் நிலையிலும் மூலத்தின் இறையியல் கனத்தைத் தக்கவைக்கின்றன. தொடர்ச்சியான எபிரெய வினையெச்சங்கள் தமிழில் ‘...கிறவர்’ அமைப்பால் ஒருமைப்படுத்தப்பட்டுள்ளன.
