    text: அல்லது, ‘தம்மைத் தரையில் தாழ்த்தினார்’; எபிரெய வினை வழிபாட்டில் ஒருவர் தம்மைத் தாழ்த்துவதையோ தரையில் விழுந்து பணிவதையோ குறிக்கலாம்.
