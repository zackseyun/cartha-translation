  text: Moses quickly bowed down to the ground and worshiped[a][b].
translation:
  language: ta
  text: மோசே விரைவாகத் தரையை நோக்கிக் குனிந்து வணங்கினார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
