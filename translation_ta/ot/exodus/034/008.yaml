revisions:
- from: மோசே உடனே தரைமட்டும் குனிந்து வணங்கினார்.[a][b]
  to: மோசே விரைவாகத் தரையை நோக்கிக் குனிந்து வணங்கினார்.[a][b]
  rationale: The revision makes the haste explicit, replaces an awkward phrase with idiomatic Tamil for bowing earthward, and retains the distinct worshipful act. The footnote preserves the physical-prostration alternative without imposing a culturally specific ritual posture.
  reviewer_model: gpt-5.6-terra
