lexical_decisions:
- source_word: וַיְמַהֵר
  choice: உடனே
  rationale: מהר விரைந்து செயல்படுவதைச் சுட்டுகிறது. இச்சூழலில் மோசேயின் தாமதமற்ற பதிலை இயல்பான தமிழில் ‘உடனே’ வெளிப்படுத்துகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: וַיִּקֹּד
  choice: தரைமட்டும் குனிந்து
  rationale: קדד உடலைத் தாழ்த்திக் குனிவதைக் குறிக்கிறது; אַרְצָה என்பதன் கீழ்நோக்கிய திசையையும் சேர்த்து, உடல்சார்ந்த செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: אַרְצָה
  choice: தரைமட்டும்
  rationale: திசையைக் குறிக்கும் இவ்வடிவம் தரையை நோக்கிய இயக்கத்தையோ உடல் தாழ்த்தப்படுதலையோ தெரிவிக்கிறது.
- source_word: וַיִּשְׁתָּחוּ
  choice: வணங்கினார்
  rationale: שחה என்பதன் இவ்வடிவம் மரியாதையுடன் பணிதல் அல்லது வழிபாட்டில் சாஷ்டாங்கமாக விழுதல் ஆகிய பொருள்களைக் கொள்ளலாம். முன் வினை ஏற்கெனவே உடல் குனிதலைச் சொல்வதால், ‘வணங்கினார்’ வழிபாட்டுச் சார்ந்த பொருளையும் உண்மையான சொற்பொருள் நெகிழ்வையும் காக்கிறது.
theological_decisions:
- issue: இறுதி வினையை முற்றிலும் உடல் செயல் என மொழிபெயர்ப்பதா, வழிபாட்டுச் செயல் என மொழிபெயர்ப்பதா
  choice: வணங்கினார்
  alternative: சாஷ்டாங்கமாக விழுந்தார்
  rationale: கர்த்தருடைய தம்மை வெளிப்படுத்துதலுக்கு மோசே காட்டிய பயபக்தியான பதிலே சூழல். எபிரெய வினை உடல் பணிவையும் வழிபாட்டையும் குறிக்கக்கூடும்; ‘வணங்கினார்’ வழிபாட்டுப் பொருளைத் தருவதோடு, ஒரு குறிப்பிட்ட வழிபாட்டு முறையை தேவையின்றித் திணிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, சுருக்கமான, கண்ணியமான நடை. தொடர்ச்சியான இரண்டு எபிரெய வினைகளையும் ஒரே செயலாகக் கரைக்காமல், முதலில் உடல் குனிதலையும் பின்னர் வணக்கத்தையும் தனித்தனியாக வைத்துள்ளது.
