base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “ஆண்டவரே, இப்போது உமது பார்வையில் எனக்குத் தயவு கிடைத்திருக்குமானால், தயவுசெய்து நீர் எங்கள் நடுவில் வருவீராக[a]. நாங்கள் பிடிவாதமுள்ள மக்கள் என்றாலும், எங்கள் அக்கிரமத்தையும் எங்கள் பாவத்தையும் மன்னித்து, எங்களை உமது சுதந்தரமாக ஏற்றுக்கொள்வீராக[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்குச் சொல், “எங்கள் நடுவில் செல்வாராக.” “எங்களிடையே வருவீராக” அல்லது “எங்களுடன் வருவீராக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எங்களை உமக்குரிய உரிமைப் பங்காக எடுத்துக்கொள்வீராக” அல்லது “எங்களை உமது உடைமையாக ஏற்றுக்கொள்வீராக” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן
  choice: தயவு
  rationale: ‘ஒருவரின் பார்வையில் தயவு கிடைத்தல்’ என்பது தமிழில் இயல்பாகப் புரியும் சொற்றொடர்; இங்கு உறவுசார் ஏற்றுக்கொள்ளுதலை வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֶיךָ
  choice: உமது பார்வையில்
  rationale: எபிரேய மொழியின் ‘உமது கண்களில்’ என்ற உருவகத்தைத் தமிழில் இயல்பான மரியாதை நடையில் எடுத்துரைக்கிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர் / ஆண்டவரே
  rationale: இது இங்கு יהוה என்ற திருப்பெயர் அல்ல, அழைப்பாகவும் பட்டமாகவும் வரும் ‘ஆண்டவர்’; முதல் இடத்தில் நேரடி அழைப்புக்கேற்ற ‘ஆண்டவரே’ பயன்படுத்தப்பட்டது.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: ஆண்டவர் எங்கள் நடுவில் வருவாராக
  rationale: הלך அடிப்படையில் ‘செல்/நட’ என்று இருந்தாலும், தேவன் மக்களோடு உடனிருப்பதற்கான வேண்டுதலில் தமிழின் ‘எங்கள் நடுவில் வருவாராக’ இயல்பாக உள்ளது; ‘நடுவில்’ என்பது בקרב என்பதன் இடவுருவைத் தக்கவைக்கிறது.
- source_word: קְשֵׁה עֹרֶף
  choice: பிடிவாதமுள்ள
  rationale: சொல்லுக்குச் சொல் ‘கழுத்தை இறுக்கிக்கொண்ட’ என்ற உருவகத்தைவிட, அதன் பொருளான அடங்காத பிடிவாதத்தை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַם
  choice: மக்கள்
  rationale: இஸ்ரவேலை அரசியல் தேசமாக மட்டும் அல்லாமல் ஓர் உடன்படிக்கை மக்களாகக் குறிக்கிறது.
- source_word: עָוֹן
  choice: அக்கிரமம்
  rationale: மீறலின் தீவிரமான ஒழுக்கப் பாரத்தைத் தக்கவைத்து, அடுத்து வரும் ‘பாவம்’ என்பதிலிருந்து ஓரளவு வேறுபடுத்துகிறது.
- source_word: חַטָּאת
  choice: பாவம்
  rationale: இச்சொல்லின் பொதுவான, நேரடியான தமிழ் இணை; עָוֹן உடன் வரும் இணைப்பையும் தக்கவைக்கிறது.
- source_word: וּנְחַלְתָּנוּ
  choice: எங்களை உமது உரிமைச் சொத்தாக ஏற்றுக்கொள்ளும்
  rationale: நிலப்பரப்பு சார்ந்த ‘சுதந்தரம்’ என்று தவறாகப் புரியாமல், தேவன் இம்மக்களைத் தமக்குரிய பங்காகவும் சொத்தாகவும் ஏற்றுக்கொள்ளும் உடன்படிக்கைப் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲדֹנָי என்பது יהוה-க்கு உரைக்கப்படும் ஜெபத்தில் எவ்வாறு மொழிபெயர்க்கப்பட வேண்டும்
  choice: ஆண்டவரே / ஆண்டவர்
  alternative: என் ஆண்டவரே; கர்த்தராகிய தேவன்
  rationale: மூலத்தில் திருப்பெயர் יהוה அல்லாமல் אֲדֹנָי என்ற ஆண்டகைப்பட்டமே உள்ளது. ஆகவே மூலத்தில் இல்லாத ‘தேவன்’ என்பதைச் சேர்க்காமல், நேரடி அழைப்பையும் பட்டத்தையும் தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- issue: כִּי என்பதன் சூழல்சார் உறவு
  choice: என்றாலும்
  alternative: ஏனெனில்
  rationale: சூழலில் மக்களின் பிடிவாதம் ஆண்டவர் உடனிருக்க வேண்டிய காரணமாக அல்ல, அவர் உடனிருந்து மன்னிக்க வேண்டிய நிலையைக் காட்டும் ஒப்புக்கொள்ளலாக உள்ளது. எனவே concessive பொருள் தேர்ந்தெடுக்கப்பட்டது; காரணப்பொருள் இலக்கணரீதியாகச் சாத்தியமுள்ளதால் பதற்றம் குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: וּנְחַלְתָּנוּ என்பதன் உடன்படிக்கைப் பொருள்
  choice: எங்களை உமது உரிமைச் சொத்தாக ஏற்றுக்கொள்ளும்
  alternative: எங்களை உமது சுதந்தரமாக்கிக்கொள்ளும்; எங்களை உமது பங்காக எடுத்துக்கொள்ளும்
  rationale: மக்கள் தேவனுக்குரிய உரிமைப் பங்காக ஏற்கப்படுவதை வெளிப்படுத்துகிறது; குறிப்பிட்ட சட்ட அல்லது சமய விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் ஜெபத்துக்குரிய கண்ணியமும் தக்கவைக்கப்பட்டுள்ளன. ‘உமது’, ‘வருவாராக’, ‘ஏற்றுக்கொள்ளும்’ ஆகிய வடிவங்கள் உயர்வான ஆனால் பொதுவாசகருக்குப் புரியும் நடையை வழங்குகின்றன. எபிரேய உருவகம் தமிழில் கடினமாகத் தோன்றும் இடத்தில் ‘பிடிவாதமுள்ள’ என்ற இயல்பான பொருள் மொழிபெயர்ப்பு பயன்படுத்தப்பட்டது; முக்கிய மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டன.
