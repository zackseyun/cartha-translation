base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/025.yaml
  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: ta
  text: “புளித்த மாவுடன்[a] என் பலியின் இரத்தத்தைச் சிந்தாதே. பஸ்கா பண்டிகையின் பலி காலைவரை எஞ்சியிருக்கக் கூடாது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புளித்த மாவு இருக்கையில்.” எபிரெயச் சொற்றொடர் புளித்த மாவுடன் அல்லது அது இருக்கையில் என்பதைக் குறிக்கலாம்; துல்லியமான சடங்குமுறை குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁחַט
  choice: இரத்தத்தைச் சிந்தும்படி அறுக்காதே
  rationale: שׁחט என்பது பலிக்குரிய விலங்கைச் சடங்குமுறையில் அறுப்பதைக் குறிக்கிறது. எபிரெயத்தில் ‘இரத்தத்தை அறுத்தல்’ என்ற சுருக்கமான அமைப்பு இருப்பதால், தமிழில் இயல்பாகப் புரிய ‘இரத்தத்தைச் சிந்தும்படி அறு’ என மொழிபெயர்க்கப்பட்டது; ‘பலி செலுத்து’ என்று பொதுமைப்படுத்தப்படவில்லை.
- source_word: עַל חָמֵץ
  choice: புளித்த மாவுள்ள எதனுடனும்
  rationale: இங்கு עַל என்பது ‘உடன்’, ‘அருகில்/இருக்கையில்’ என்ற சடங்குசார் தொடர்பைக் குறிக்கலாம். தடை புளித்த மாவு அல்லது புளிப்பூட்டப்பட்ட உணவு உடனிருப்பதைச் சார்ந்தது என்பதை இயல்பான தமிழில் தெரிவிக்கிறது; துல்லியமான சடங்கு நடைமுறையைத் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: דַּם זִבְחִי
  choice: என் பலியின் இரத்தம்
  rationale: ‘இரத்தம்’ என்ற பலியிடுதல் சார்ந்த உருவகத்தையும், זִבְחִי என்பதிலுள்ள முதலாம் நபர் ஒருமை உடைமை விகுதியையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יָלִין לַבֹּקֶר
  choice: காலைவரை எஞ்சியிருக்கக் கூடாது
  rationale: לין என்பது இரவு முழுவதும் தங்கி அல்லது மீதியாக இருப்பதைக் குறிக்கிறது. ‘காலைவரை’ என்பதே காலவரம்பைத் தெளிவுபடுத்துவதால் தேவையற்ற இரட்டிப்பின்றி இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: זֶבַח חַג הַפָּסַח
  choice: பஸ்கா பண்டிகையின் பலி
  rationale: எபிரெயச் சொற்றொடரில் உள்ள ‘பலி’, ‘பண்டிகை’, ‘பஸ்கா’ ஆகிய மூன்று கூறுகளையும் தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: הַפָּסַח
  choice: பஸ்கா
  rationale: פֶּסַח என்பதற்குத் தமிழில் பரவலாக அறியப்பட்ட வேதாகமப் பெயர் ‘பஸ்கா’. பொருள் விளக்கமாக ஒரு புதிய விழாப்பெயரை உருவாக்காமல், மூலத்தின் குறிப்பிட்ட விழாவை அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: உடன்படிக்கைப் பண்டிகைக்குரிய சொல்லை பிற்காலக் கோட்பாட்டு தொடர்புகளைச் சேர்க்காமல் வழங்குதல்
  choice: பஸ்கா
  alternative: கடந்துசெல்லும் பண்டிகை
  rationale: இந்த வசனம் மோசேயின் உடன்படிக்கைச் சூழலில் இஸ்ரவேலின் வழிபாட்டு ஒழுங்கைப் பற்றியது. ‘பஸ்கா’ அந்த வரலாற்றுப் பண்டிகையைத் தெளிவாகக் குறிக்கிறது; பிற்கால விளக்கத்தை வசனத்துக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை முன்னிலைக்கான நேரடி கட்டளை நடையில் மொழிபெயர்க்கப்பட்டது. வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான மொழிநடை காக்கப்பட்டாலும், அரிதான சமயத் தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
