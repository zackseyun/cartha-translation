- from: “புளித்த மாவுள்ள எதனுடனும்[a] என் பலியின் இரத்தத்தைச் சிந்தும்படி அறுக்காதே. பஸ்கா பண்டிகையின் பலி காலைவரை எஞ்சியிருக்கக் கூடாது.”
  to: “புளித்த மாவுடன்[a] என் பலியின் இரத்தத்தைச் சிந்தாதே. பஸ்கா பண்டிகையின் பலி காலைவரை எஞ்சியிருக்கக் கூடாது.”
