  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: ta
  text: கருப்பையைத் திறக்கும் ஒவ்வொரு முதற்பேறும் எனக்குரியது[a]. உன் கால்நடைகளில் மாடோ ஆடோ பிறக்கும் ஒவ்வொரு ஆண் முதற்பேறும் எனக்குரியது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “கருப்பையைத் திறப்பது அனைத்தும் எனக்குரியது.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொற்றொடர் கால்நடைகளிலுள்ள ஆண் முதற்பேறுகளைக் குறிப்பிடுகிறது. “ஆடு” என்பதற்கான எபிரெயச் சொல் செம்மறியாட்டையோ வெள்ளாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: ஒவ்வொரு / அனைத்தும்
  rationale: முதல் ஒருமைத் தொடரில் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொரு’ என்றும், கால்நடைகளைச் சுட்டும் கூட்டுப் பொருளை இயல்பான தமிழில் ‘அனைத்தும்’ என்றும் வழங்குகிறது; இரண்டிலும் முழுமையான பரப்பு காக்கப்படுகிறது.
- source_word: פֶּטֶר רֶחֶם
  choice: கருப்பையில் பிறக்கும் ஒவ்வொரு முதற்பேறு
  rationale: எபிரெய மொழிவழக்கு சொல்லுக்கு சொல் ‘கருப்பையைத் திறப்பது’ என்பதாகும்; அதன் பொருளான முதல் பிறப்பைத் தெளிவான நவீனத் தமிழில் வழங்குகிறது. சொற்சார்ந்த உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִי
  choice: எனக்குரியது
  rationale: இறைவனுடைய உடைமை அல்லது உரிமைக் கோரிக்கையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; அர்ப்பணிப்பு அல்லது பலி குறித்த மேலதிக கருத்தைச் சேர்க்கவில்லை.
- source_word: מִקְנְךָ
  choice: உன் கால்நடைகளில்
  rationale: ஒருவருக்குச் சொந்தமான மந்தை மற்றும் மாட்டு வகை விலங்குகளை உள்ளடக்கும் கூட்டுப்பெயரை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: תִּזָּכָר
  choice: ஆண் முதற்பேறு
  rationale: இந்தச் சட்டச் சூழலில் ஆண் பாலினத்தைச் சுட்டும் எபிரெய வடிவத்தின் பொருளைத் தெளிவுபடுத்துகிறது; தவறாகப் புரியக்கூடிய சொல்லுக்கு சொல் வடிவத்தைத் தவிர்க்கிறது.
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: மாடாக இருந்தாலும் செம்மறியாடாக இருந்தாலும்
  rationale: குறிப்பிடப்பட்ட கால்நடை வகைகளை இயல்பான தமிழில் மாற்றுத் தொகுப்பாக வெளிப்படுத்துகிறது; ‘שֶׂה’ என்பதற்கு இங்கு மந்தை விலங்கைக் குறிக்கும் பொதுப் பொருள் இருக்கக்கூடியபோதும், சூழலுக்கும் ஆலோசனை உரைக்கும் ஏற்ற ‘செம்மறியாடு’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: முதற்பேறுகள்மீதான ஆண்டவரின் உரிமை
  choice: ‘எனக்குரியது’ என்று நேரடியான உடைமை அல்லது உரிமைக் கூற்றாக மொழிபெயர்க்கப்பட்டது.
  alternative: அதை வெளிப்படையாக ‘எனக்கென்று அர்ப்பணிக்கப்பட்டது’ அல்லது ‘பலியிடப்பட வேண்டியது’ என்று விரிவுபடுத்துதல்.
  rationale: எபிரெய உரை לִי (‘எனக்கு/என்னுடையது’) என்று மட்டுமே கூறுகிறது. ஆகவே அர்ப்பணிப்பு அல்லது பலி பற்றிய பின்னைய விளக்கத்தை இவ்வசனத்துக்குள் சேர்க்காமல், சட்ட-உடன்படிக்கை சார்ந்த உரிமைக் கூற்று பாதுகாக்கப்படுகிறது.
- issue: תִּזָּכָר வடிவத்தின் சட்டச் சூழலிலான பொருள்
  choice: கால்நடைகளில் ஆண் முதற்பேறுகளே இங்கு குறிப்பிடப்படுகின்றன என்று தெளிவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆணாக இருக்கும்’ என்று மிகவும் சொற்சார்ந்து வழங்குதல் அல்லது பாலினக் குறிப்பைத் தெளிவுபடுத்தாமல் விடுதல்.
  rationale: இவ்வடிவம் கால்நடைகளின் ஆண் முதற்பேற்றைக் குறிக்கும் என தொடரமைப்பும் அடுத்துவரும் மாடு/செம்மறியாடு குறிப்பும் காட்டுகின்றன. மொழிபெயர்ப்பு அந்தப் பொருளை மட்டும் வெளிப்படுத்துகிறது; பலிக்குத் தகுதி போன்ற மேலதிக முடிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘எனக்குரியது’ என்ற ஒருமை வடிவம் முதல் வாக்கியத்தில் ‘ஒவ்வொரு முதற்பேறும்’ என்பதோடும், இரண்டாம் வாக்கியத்தின் இறுதியில் கூட்டுத் தொகையை ஒரே உரிமைப் பிரிவாகக் காட்டும் இயல்பான தமிழ் பயன்பாட்டோடும் பொருந்துகிறது. மூலத்தில் இரண்டாம் கூறில் வெளிப்படையாக மீண்டும் வராத לִי என்னும் உரிமைக் கூற்று தமிழில் தெளிவுக்காக மீள வழங்கப்பட்டுள்ளது.
