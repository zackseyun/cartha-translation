  source_fidelity: திருத்தம் தேவை. ‘மலைக்கு’ என்பது இவ்வசனத்தின் முதல் வாக்கியத்தில் எபிரேய மூலத்தில் வெளிப்படையாக இல்லை; அதைச் சேர்ப்பது சூழலால் ஊகிக்கப்படுவதாகும். மேலும் אֶל־מוּל என்பதற்கு ‘எதிரே’ என்பதைக் காட்டிலும் ‘முன்பாக’ இடவியல் பொருளை நெருக்கமாகக் காக்கிறது.
  naturalness: நடை பொதுவாக நவீனத் தரத்தமிழில் இயல்பாக உள்ளது. ‘ஏறிச் செல்லக்கூடாது’, ‘முன்பாக மேயக்கூடாது’ ஆகியவை இன்னும் நேரடியானவையும் இயல்பானவையும் ஆகும்.
