  to: ஒருவரும் உன்னுடன் ஏறிச் செல்லக்கூடாது; மேலும், மலையில் எங்குமே யாரும் காணப்படக்கூடாது[a]. ஆட்டு மந்தையும் மாட்டு மந்தையும் அந்த மலையின் முன்பாக மேயக்கூடாது.
  rationale: மூலத்தில் இல்லாத ‘மலைக்கு’ நீக்கப்பட்டுள்ளது. ஏறுதலின் திசைப் பொருளை ‘ஏறிச் செல்ல’ காக்கிறது. கால்நடைகள் மேயும் இடத்தைக் குறிக்கும் אֶל־מוּலுக்கு ‘அந்த மலையின் முன்பாக’ எனத் துல்லியமாக வழங்கப்பட்டுள்ளது. காணப்படுதல்/தோன்றுதல் என்ற நிஃபால் வினைத் தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
