base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/003.yaml
  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: ta
  text: ஒருவரும் உன்னுடன் ஏறிச் செல்லக்கூடாது; மேலும், மலையில் எங்குமே யாரும் காணப்படக்கூடாது[a]. ஆட்டு மந்தையும் மாட்டு மந்தையும் அந்த மலையின் முன்பாக மேயக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாரும் தோன்றக்கூடாது.” எபிரேய வினையின் இந்த வடிவம் “காணப்படுதல்” அல்லது “தோன்றுதல்” என்ற இரு பொருள்களையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: ஒருவரும் / யாரும்
  rationale: இங்கு ஆண்பால் ஒருமை வடிவம் இருந்தாலும், தடை எந்த மனிதருக்கும் பொதுவாகப் பொருந்துகிறது. நவீனத் தமிழில் ‘ஒருவரும்’ மற்றும் ‘யாரும்’ அந்தப் பொதுப்பொருளை இயல்பாகத் தருகின்றன.
- source_word: יַעֲלֶה עִמָּךְ
  choice: உன்னுடன் மலைக்கு ஏறிவரக் கூடாது
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தை ‘ஏறிவர’ காக்கிறது; சூழலில் மலையே இலக்கு என்பதையும் தமிழில் தெளிவாக்குகிறது.
- source_word: וְגַם
  choice: மேலும்
  rationale: முந்தைய தடையுடன் அடுத்த தடையை இணைத்து வலுப்படுத்தும் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אַל יֵרָא
  choice: காணப்படக் கூடாது
  rationale: ראה என்பதன் நிஃபால் வடிவத்திலுள்ள ‘காணப்படுதல்’ என்ற செயல்பாட்டு பொருளை நேரடியாகக் காக்கிறது; ‘தோன்றுதல்’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּכָל הָהָר
  choice: மலையில் எங்குமே
  rationale: மலைப்பகுதி முழுவதிலும் எந்த இடத்திலும் என்பதைக் தமிழில் இயல்பான பகிர்வுப் பொருளுடன் வெளிப்படுத்துகிறது.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும்
  rationale: சிறிய கால்நடை மந்தைகளுக்கும் பெரிய கால்நடை மந்தைகளுக்கும் இடையிலான மூலமொழி வேறுபாட்டைக் காக்கிறது.
- source_word: אַל יִרְעוּ
  choice: மேயக் கூடாது
  rationale: விலங்குகளை எழுவாயாகக் கொண்ட רעה என்பதன் ‘மேய்தல்’ பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: אֶל מוּל
  choice: எதிரே
  rationale: ஒரு பொருளுக்கு முன்பாக அல்லது அதனை எதிர்நோக்கிய இடத்தில் என்ற இடவியல் பொருளைச் சுருக்கமாகக் காக்கிறது.
- source_word: הָהָר הַהוּא
  choice: அந்த மலை
  rationale: எபிரேயச் சுட்டுப்பெயரடையின் குறிப்பிட்ட, சற்றுத் தொலைவான சுட்டுதலை நேரடியாகத் தருகிறது.
