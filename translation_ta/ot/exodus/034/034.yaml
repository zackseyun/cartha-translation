revisions:
- from: ஆனால் மோசே யாவேயின் முன்னிலையில் அவரோடு பேசுவதற்காக உள்ளே செல்லும்போதெல்லாம், தாம் வெளியே வரும்வரை முகத்திரையை அகற்றிவைப்பார். பின்பு அவர் வெளியே வந்து, தமக்குக் கட்டளையிடப்பட்டதை இஸ்ரவேலின் மக்களிடம்[a] சொல்வார்.
