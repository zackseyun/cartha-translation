base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: ta
  text: ஆனால் மோசே யாவேயின் முன்னிலையில் அவரோடு பேசுவதற்காக உள்ளே செல்லும்போதெல்லாம், வெளியே வரும்வரை முகத்திரையை அகற்றுவார். பின்பு அவர் வெளியே வந்து, தமக்குக் கட்டளையிடப்பட்டதை இஸ்ரவேலின் மகன்களிடம் சொல்வார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְבֹא
  choice: ஆனால் ... உள்ளே செல்லும்போதெல்லாம்
  rationale: בְּ + வினையெச்சப் பெயர் இங்கு மீண்டும் மீண்டும் நிகழும் சூழலைக் குறிக்கிறது; எனவே ‘செல்லும்போதெல்லாம்’ என மொழிபெயர்க்கப்பட்டது. וּ முந்தைய வசனத்துடனான மிதமான எதிர்மறைத் தொடர்பைச் சுட்டுவதால் ‘ஆனால்’ பயன்படுத்தப்பட்டது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன்பாக/முன்னிலையில்’ என்று பொருள்படும். தமிழில் இயல்பாகவும் தேவனுடைய நேரடி சந்நிதியைக் காட்டவும் ‘முன்னிலையில்’ தேர்ந்தெடுக்கப்பட்டது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: לְדַבֵּר אִתּוֹ
  choice: அவரோடு பேசுவதற்காக
  rationale: לְדַבֵּר நோக்கத்தைக் குறிக்கிறது; אִתּוֹ உரையாடல் சார்ந்த ‘அவரோடு’ என்ற பொருளைத் தருகிறது.
- source_word: יָסִיר אֶת־הַמַּסְוֶה
  choice: முகத்திரையை அகற்றிவைப்பார்
  rationale: இச்சூழலில் imperfect வழக்கமாக நடந்த செயலைக் குறிக்கிறது. מַסְוֶה மோசே அணிந்திருந்த முகத்தை மூடும் திரை என்பதால் இயல்பான தமிழில் ‘முகத்திரை’ எனப்பட்டது; ‘அகற்றிவைப்பார்’ என்பது அந்த இடைவெளி முழுவதும் அது அகற்றப்பட்டிருந்ததை உணர்த்துகிறது.
- source_word: עַד־צֵאתוֹ
  choice: தாம் வெளியே வரும்வரை
  rationale: עַד உடன் வரும் infinitive construct, மோசே வெளியேறும் நேரம்வரை நீடிக்கும் கால எல்லையைக் குறிக்கிறது.
- source_word: וְיָצָא וְדִבֶּר
  choice: பின்பு அவர் வெளியே வந்து ... சொல்வார்
  rationale: வசனத்தின் வழக்கமான நிகழ்வுகளின் தொடரைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘பின்பு ... வந்து ... சொல்வார்’ எனப்பட்டது.
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களிடம்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் நிலையான எபிரேயச் சொற்றொடர். நவீன தமிழில் தவறான பாலினச் சுருக்கம் ஏற்படாமல் ‘இஸ்ரவேலின் மக்கள்’ பயன்படுத்தப்பட்டு, சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: தமக்குக் கட்டளையிடப்பட்டதை
  rationale: Pual passive வடிவம் மோசே பெற்ற கட்டளையின் உள்ளடக்கத்தைக் குறிக்கிறது; கட்டளையிட்டவர் இலக்கணத்தில் வெளிப்படையாகக் கூறப்படாததால் தமிழிலும் செய்பவர் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் பாலின வடிவம்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரேயத்தின் சொற்சார்ந்த ஆண்பால் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; ஆனால் இச்சூழலில் அது ஆண்களை மட்டும் அல்ல, இஸ்ரவேல் சமூகத்தையே குறிக்கும் வழக்குச் சொற்றொடராக இருப்பதால் முதன்மை உரையில் உள்ளடங்கிய பொருள் தெளிவாக்கப்பட்டது.
- issue: கட்டளையிட்டவர் யார் என்பது
  choice: செய்பவரைக் குறிப்பிடாத passive வடிவம்
  alternative: யாவே தமக்குக் கட்டளையிட்டதை
  rationale: சூழலில் யாவே கட்டளையிட்டவர் என்பது தெளிவாக இருந்தாலும், אֲשֶׁר יְצֻוֶּה என்ற மூல வடிவம் செய்பவரை வெளிப்படையாகக் குறிப்பிடவில்லை. அந்த வடிவத் திறப்பை தமிழிலும் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மோசேயைக் குறிக்க மரியாதைப் பன்மை ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளது. தொடர் வழக்கச் செயலை ‘செல்லும்போதெல்லாம் ... அகற்றிவைப்பார் ... சொல்வார்’ என்ற அமைப்பு வெளிப்படுத்துகிறது.
