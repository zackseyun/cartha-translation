  text: וַ/יַּ֨רְא אַהֲרֹ֜ן וְ/כָל בְּנֵ֤י יִשְׂרָאֵל֙ אֶת מֹשֶׁ֔ה וְ/הִנֵּ֥ה קָרַ֖ן ע֣וֹר פָּנָ֑י/ו וַ/יִּֽירְא֖וּ מִ/גֶּ֥שֶׁת אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: ta
  text: ஆரோனும் இஸ்ரவேலின் மகன்கள் அனைவரும் மோசேயைக் கண்டார்கள்; இதோ, அவருடைய முகத்தின் தோல் ஒளிர்ந்தது[a]. அவர்கள் அவரை நெருங்க அஞ்சினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒளிக்கதிர்களை வீசியது.” இங்குள்ள எபிரெய வினை அரிதானது; “கதிர்களை வெளிவிட்டது” என்றும் பொருள்படலாம். வரலாற்றில் இது “கொம்புடையது” என்றும் மொழிபெயர்க்கப்பட்டுள்ளது; ஆனால் இச்சூழல் ஒளிப்பிரகாசத்தையே ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: ראה என்ற வினை இக்கதைச் சூழலில் ‘கண்டார்கள்’ என்ற இயல்பான பொருளைத் தருகிறது; அடுத்த நிகழ்வுடன் தமிழில் சரளமாக இணைக்க வினையெச்சத் தொடர் பயன்படுத்தப்பட்டது.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள் அனைவரும்
  rationale: בְּנֵי יִשְׂרָאֵל என்பதிலுள்ள குடும்பவழிப் பெயரிடலையும் இலக்கண ஆண்பாலையும் பாதுகாக்கும் நேரடியான தமிழ் வடிவம்.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரெனக் கவனத்தை ஈர்த்து, காணப்பட்ட நிலையின் வியப்பைச் சுட்டும் הִנֵּה என்பதன் உரையாடல் வலிமையைத் தக்கவைக்கிறது.
- source_word: קָרַן
  choice: ஒளிக்கதிர்களை வீசியது
  rationale: அரிதான קרן வினை இச்சூழலில் ஒளிர்தல் அல்லது கதிர்களை வெளிவிடுதல் எனப் பொருள்படுகிறது. இந்த வடிவம் மூலச்சொல்லின் இயக்கமுள்ள படிமத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עוֹר פָּנָיו
  choice: அவருடைய முகத்தின் தோல்
  rationale: எபிரெயம் வெறுமனே ‘முகம்’ என்று அல்லாமல் ‘அவருடைய முகத்தின் தோல்’ என்று வெளிப்படையாகக் கூறுவதால், அந்தக் குறிப்பான உடல்சார் சொல்லாக்கம் பாதுகாக்கப்பட்டது.
- source_word: וַיִּירְאוּ
  choice: அவர்கள் பயந்தார்கள்
  rationale: மக்களின் உணர்ச்சிப்பூர்வமான எதிர்வினையை நவீனத் தமிழில் இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: அவரை நெருங்கிச் செல்ல
  rationale: מן உடன் வரும் வினையெச்ச அமைப்பு அணுகுவதிலிருந்து பின்வாங்கியதை உணர்த்துகிறது; ‘நெருங்கிச் செல்லப் பயந்தார்கள்’ என்பது தமிழில் அந்தத் தயக்கத்தை இயல்பாகக் கூறுகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் குடும்பவழி அடையாளத்தையும் இலக்கண ஆண்பாலையும் பொதுப்பெயராக மாற்றாமல் பாதுகாக்கிறது; இங்கு குறிப்பிடப்படுவது சமூகத்தின் ஆண் பிரதிநிதிகளா அல்லது இஸ்ரவேல் மக்கள் அனைவருமா என்ற பரந்த பயன்பாட்டை விளக்கத்தின் மூலம் தீர்மானிக்கவில்லை.
- issue: மோசேயின் முகத்தைப் பற்றிய קָרַן என்பதன் பொருள்
  choice: ஒளிக்கதிர்களை வீசியது
  alternative: ஒளிர்ந்தது / கொம்புடையதாயிற்று
  rationale: சூழல் காணக்கூடிய பிரகாசத்தையும் அதனால் ஏற்பட்ட பயத்தையும் விவரிக்கிறது; ஆகவே ஒளிக்கதிர் சார்ந்த பொருள் முதன்மை உரையில் ஏற்கப்பட்டது. ‘கொம்புடையது’ என்பது சொல்லின் வரலாற்றுச் சிறப்புள்ள மாற்றுப் புரிதலாக அடிக்குறிப்பில் குறிப்பிடப்படுகிறது; அது முதன்மை உரையில் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ‘முகத்தின் தோல்’ என்ற குறிப்பான சொல்லாக்கமும் ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல்லும் பாதுகாக்கப்பட்டுள்ளன; அரிதான வினையின் உண்மையான சொற்பொருள் நிச்சயமின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
