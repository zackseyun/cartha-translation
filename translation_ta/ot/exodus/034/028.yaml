  text: וַֽ/יְהִי שָׁ֣ם עִם יְהוָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔ל וּ/מַ֖יִם לֹ֣א שָׁתָ֑ה וַ/יִּכְתֹּ֣ב עַל הַ/לֻּחֹ֗ת אֵ֚ת דִּבְרֵ֣י הַ/בְּרִ֔ית עֲשֶׂ֖רֶת הַ/דְּבָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: ta
  text: அவர் அங்கே யாவேயுடன் நாற்பது நாட்களும் நாற்பது இரவுகளும் இருந்தார். அவர் அப்பம் உண்ணவில்லை; தண்ணீர் குடிக்கவில்லை. உடன்படிக்கையின் வார்த்தைகளான பத்து வார்த்தைகளை[b] பலகைகளின் மேல் எழுதினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே எழுதினார்.” பலகைகளில் எழுதியது யாவே என்று யாத்திராகமம் 34:1; உபாகமம் 10:4 கூறுகின்றன.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், “பத்து வார்த்தைகள்”; மரபாக, “பத்துக் கட்டளைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை அதன் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் வழங்குகிறது; மாற்றுப் பெயரையோ பட்டப்பெயரையோ மூலப் பெயருக்குப் பதிலாக இடவில்லை.
- source_word: וַיְהִי שָׁם עִם
  choice: அவர் அங்கே … உடன் … இருந்தார்
  rationale: மோசே யாவேயின் முன்னிலையில் அங்கே இருந்தார் என்ற இடநிலைப் பொருளை, ‘தங்கினார்’ போன்ற கூடுதல் நுண்பொருள் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: நாற்பது பகலும் நாற்பது இரவும்
  rationale: கால அளவைக் குறிக்கும் எபிரெய இணை அமைப்பைத் துல்லியமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: לֶחֶם לֹא אָכַל
  choice: அவர் அப்பம் சாப்பிடவும் இல்லை
  rationale: மூலத்தில் உள்ள ‘அப்பம்’ என்ற குறிப்பிட்ட பெயர்ச்சொல்லை ‘உணவு’ என்று பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: וּמַיִם לֹא שָׁתָה
  choice: தண்ணீர் குடிக்கவும் இல்லை
  rationale: முந்தைய மறுப்பு வாக்கியத்தோடு உள்ள இணை அமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּכְתֹּב
  choice: எழுதினார்
  rationale: எபிரெய வினையின் எளிய பொருளை வழங்குகிறது. தமிழில் எழுவாயை மீண்டும் வெளிப்படையாகச் சொல்லாமல் விடுவது இயல்பானது; இதனால் உடனடி தொடரில் மோசே எழுவாயாகத் தோன்றினாலும், விரிந்த சூழலில் யாவே எழுதியதாக வாசிக்கக்கூடிய உண்மையான தெளிவின்மையும் காக்கப்படுகிறது.
- source_word: עַל הַלֻּחֹת
  choice: பலகைகளின்மேல்
  rationale: கற்பலகைகளைக் குறிக்கும் சூழலுக்கு ஏற்ற நிலைபெற்ற தமிழ்ச் சொல்லையும், ‘மேல்’ என்ற தொடர்பையும் நேரடியாக வழங்குகிறது.
- source_word: דִּבְרֵי הַבְּרִית
  choice: உடன்படிக்கையின் வார்த்தைகள்
  rationale: எபிரெயச் சார்பு அமைப்பையும் உடன்படிக்கை சார்ந்த முக்கியத்துவத்தையும் காக்கிறது.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: பத்து வார்த்தைகள்
  rationale: எபிரெயத் தொடரின் நேரடிப் பொருளை முன்னிறுத்துகிறது; மரபான ‘பத்துக் கட்டளைகள்’ என்ற விளக்க மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இறுதி ‘எழுதினார்’ என்பதன் எழுவாய்
  choice: மூலத்தைப் போல இறுதி வினைக்கு எழுவாயை மீண்டும் வெளிப்படையாகக் குறிப்பிடாமல் ‘எழுதினார்’ என்று வழங்குதல்
  alternative: ‘யாவே எழுதினார்’ என்று வெளிப்படையாக வழங்குதல்
  rationale: உடனடி வாக்கியத் தொடரில் மோசே இயல்பான எழுவாயாகத் தோன்றுகிறார். ஆனால் யாத்திராகமம் 34:1 மற்றும் உபாகமம் 10:4 பலகைகளில் எழுதியதை யாவேக்கு உரியதாகக் கூறுகின்றன. எழுவாயைத் தமிழில் இயல்பாக மறைமுகமாக வைத்திருப்பது இந்த உரைநிலை மற்றும் விரிந்த சூழல் இடையிலான பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
- issue: עֲשֶׂרֶת הַדְּבָרִים என்பதன் மொழிபெயர்ப்பு
  choice: பத்து வார்த்தைகள்
  alternative: பத்துக் கட்டளைகள்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘பத்து வார்த்தைகள்’ என்று பொருள்படுகிறது. பரவலாக அறியப்படும் மரபு வழக்கான ‘பத்துக் கட்டளைகள்’ வாசகருக்காக அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாப்பிடவும் இல்லை, குடிக்கவும் இல்லை’ என்ற இணை அமைப்பு இயல்பான பேச்சுவழக்குத் தெளிவையும் உரையின் கண்ணியத்தையும் இணைக்கிறது. இறுதி வாக்கியத்தில் எழுவாய் விடுபடுவது தமிழில் இயல்பானது; அது மூலத்தின் தெளிவின்மையையும் பாதுகாக்கிறது.
