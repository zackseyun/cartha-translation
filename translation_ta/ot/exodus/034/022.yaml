- from: கோதுமை அறுவடையின் முதற்பலன்களோடு வாரங்களின் பண்டிகையை நீ கொண்டாட வேண்டும்; ஆண்டின் திருப்பத்தில்[a] சேகரிப்புப் பண்டிகையையும் கொண்டாட வேண்டும்.
  to: கோதுமை அறுவடையின் முதற்பலன்களுக்கான வாரங்களின் பண்டிகையை நீ கொண்டாட வேண்டும்; ஆண்டு திரும்பும் காலத்தில்[a] விளைச்சல் சேகரிப்புப் பண்டிகையையும் கொண்டாட வேண்டும்.
