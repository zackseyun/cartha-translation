source:
  edition: WLC
  text: וְ/חַ֤ג שָׁבֻעֹת֙ תַּעֲשֶׂ֣ה לְ/ךָ֔ בִּכּוּרֵ֖י קְצִ֣יר חִטִּ֑ים וְ/חַג֙ הָֽ/אָסִ֔יף תְּקוּפַ֖ת הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: ta
  text: கோதுமை அறுவடையின் முதற்பலன்களுக்கான வாரங்களின் பண்டிகையை நீ கொண்டாட வேண்டும்; ஆண்டு திரும்பும் காலத்தில்[a] விளைச்சல் சேகரிப்புப் பண்டிகையையும் கொண்டாட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆண்டின் முடிவில்.’ எபிரேயச் சொற்றொடர் ஆண்டின் திருப்பத்தையோ அதன் சுழற்சியையோ நேரடியாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: பண்டிகை
  rationale: யாத்திரை சார்ந்த சமய விழாவைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றவாறும் ‘பண்டிகை’ உள்ளது.
- source_word: שָׁבֻעֹת
  choice: வாரங்கள்
  rationale: எபிரேயப் பெயரின் நேரடிப் பொருளான ‘வாரங்கள்’ என்பதைக் காக்கிறது; பிற்காலப் பெயரை உரைக்குள் கொண்டுவரவில்லை.
- source_word: תַּעֲשֶׂה לְךָ
  choice: நீ கொண்டாட வேண்டும்
  rationale: சொல்லுக்குச் சொல் ‘உனக்காகச் செய்ய வேண்டும்’ என்றாலும், பண்டிகைச் சூழலில் இது அதைக் கடைப்பிடித்துக் கொண்டாடுவதைக் குறிக்கிறது. தமிழில் ‘கொண்டாட வேண்டும்’ இயல்பாக அந்தக் கடமையை வெளிப்படுத்துகிறது.
- source_word: בִּכּוּרֵי
  choice: முதற்பலன்கள்
  rationale: அறுவடையில் முதலில் கிடைத்து அர்ப்பணிக்கப்படும் விளைச்சலைக் குறிக்கும் துல்லியமான வழிபாட்டுச் சொல்.
- source_word: קְצִיר חִטִּים
  choice: கோதுமை அறுவடை
  rationale: எபிரேய இணைப்பின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הָאָסִיף
  choice: சேகரிப்பு
  rationale: விளைபொருள்களைச் சேர்த்துக்கொள்ளும் பருவத்துடன் தொடர்புடைய பண்டிகையை நேரடியாகக் குறிக்கிறது.
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: ஆண்டின் திருப்பத்தில்
  rationale: ஆண்டின் சுழற்சி அல்லது பருவத் திருப்பம் என்ற எபிரேய உருவகத்தைப் பாதுகாக்கிறது; இதைத் துல்லியமாக ஒரு நாட்காட்டி ஆண்டின் கடைசி நாள் என்று நிர்ணயிக்கவில்லை.
