translation_notes:
  register: ஒருமை இரண்டாம் நபர் கட்டளையைக் ‘நீ ... வேண்டும்’ எனத் தெளிவாக வைத்துள்ளோம். மொழிநடை நவீனமும் மரியாதைக்குரியதுமாக உள்ளது. எபிரேய விழாப் பெயர்கள் வெளிப்படையான தமிழ்ப் பெயர்களாக மொழிபெயர்க்கப்பட்டுள்ளன; பிற்கால மரபுப் பெயர்கள் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறி பொருந்தும் சொற்றொடரான ‘ஆண்டின் திருப்பத்தில்’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
