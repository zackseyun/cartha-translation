    reason: lexical_alternative
  revision_rationale: The revised wording makes the wheat-harvest firstfruits phrase dependent on and descriptive of the Feast of Weeks rather than an accompaniment to it. It also uses an idiomatic Tamil temporal expression that preserves the Hebrew phrase’s cyclical/seasonal ambiguity. The footnote remains anchored immediately after the temporal phrase and retains the stated lexical alternative.
