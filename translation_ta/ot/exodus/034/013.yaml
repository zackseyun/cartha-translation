  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: ta
  text: மாறாக[a], அவர்களுடைய பலிபீடங்களை இடித்துப்போடுங்கள்; அவர்களுடைய வழிபாட்டுத் தூண்களை நொறுக்குங்கள்; அவர்களுடைய அசேரா கம்பங்களை வெட்டி வீழ்த்துங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில், அவர்களுடைய பலிபீடங்களை இடித்துப்போடுங்கள்…” எபிரெய இணைப்புச்சொல்லை “ஏனெனில்” என்றும் மொழிபெயர்க்கலாம்; இங்கு முந்தைய தடைக்கு மாறாகச் செய்ய வேண்டிய செயலை அது இயல்பாக அறிமுகப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “அசேரா கம்பங்கள்” என்பது அசேரா என்னும் பெண் தெய்வத்துடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது. எபிரெயச் சொல்லை “அசேராக்கள்” என்றும் பெயர்க்கலாம்; அவற்றின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: மாறாக
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட உடன்படிக்கை செய்யக்கூடாது என்ற தடைக்கு எதிர்மறையான தொடர்ச்சியாக, இஸ்ரவேலர் அதற்குப் பதிலாகச் செய்ய வேண்டியதை இச்சொல் அறிமுகப்படுத்துகிறது. எபிரெயத்தில் ‘ஏனெனில்’ என்றும் பொருள்படலாம்; அந்த வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: מִזְבְּחֹתָם
  choice: அவர்களுடைய பலிபீடங்களை
  rationale: מִזְבֵּחַ என்பதன் வழிபாட்டுச் சூழலுக்குரிய இயல்பான தமிழ் இணைச்சொல்; பன்மையும் மூன்றாம் நபர் பன்மை உடைமைப் பின்னொட்டும் காக்கப்படுகின்றன.
- source_word: תִּתֹּצוּן
  choice: இடித்துப்போடுங்கள்
  rationale: נתץ என்பது கட்டப்பட்ட அமைப்புகளைத் தகர்த்து கீழே போடுவதைக் குறிக்கிறது; பலிபீடங்களுடன் ‘இடித்துப்போடுங்கள்’ இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: מַצֵּבֹתָם
  choice: அவர்களுடைய வழிபாட்டுத் தூண்களை
  rationale: מַצֵּבָה என்பது நிறுத்திவைக்கப்பட்ட வழிபாட்டுக் கல் அல்லது தூணைக் குறிக்கிறது. வெறும் ‘தூண்கள்’ என்பதால் கட்டிடத் தூண்கள் எனத் தவறாகப் புரிந்துகொள்ள வாய்ப்புள்ளதால், சூழலைத் தெளிவாக்க ‘வழிபாட்டுத் தூண்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: תְּשַׁבֵּרוּן
  choice: நொறுக்குங்கள்
  rationale: שׁבר என்பதன் பியேல் வடிவம் வலிமையான உடைத்தலைக் காட்டுகிறது; ‘நொறுக்குங்கள்’ அந்த வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֵׁרָיו
  choice: அவர்களுடைய அசேரா கம்பங்களை
  rationale: இந்தப் பன்மை வடிவம் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது. ‘அசேரா கம்பங்கள்’ என்பது பெயருடனான தொடர்பை வைத்துக்கொண்டு, அழிக்கப்பட வேண்டிய பொருட்கள் என்பதையும் வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: תִּכְרֹתוּן
  choice: வெட்டி வீழ்த்துங்கள்
  rationale: כרת என்பதற்கு வெட்டுதல் அல்லது வெட்டி அகற்றுதல் என்பது அடிப்படைப் பொருள். மரத்தாலானதாகக் கருதப்படும் அசேரா வழிபாட்டுப் பொருட்களுடன் ‘வெட்டி வீழ்த்துங்கள்’ இயல்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: אֲשֵׁרָיו என்பதன் சுட்டுப்பொருள்
  choice: அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்கள்—‘அசேரா கம்பங்கள்’
  alternative: ‘அசேராக்கள்’ என வடிவத்தை நெருக்கமாகப் பெயர்த்தல், அல்லது அசேராவின் சிலைகள்/வழிபாட்டுச் சின்னங்கள் எனப் பொதுவாகக் கூறுதல்
  rationale: இவ்வசனம் அழிக்கப்பட வேண்டிய பலிபீடங்கள், வழிபாட்டுத் தூண்கள், அசேரா பொருட்கள் ஆகியவற்றைப் பட்டியலிடுகிறது. ‘வெட்டி வீழ்த்துங்கள்’ என்ற வினை மரத்தாலான வழிபாட்டுப் பொருட்களை வலுவாகச் சுட்டுகிறது; இருப்பினும் அவற்றின் துல்லியமான வடிவம் உறுதியல்ல என்பதால் அடிக்குறிப்பில் அதைக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையான பன்மைக் கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. செயல்களின் வலிமையான தொடரை வெளிப்படுத்த ‘இடித்துப்போடுங்கள்—நொறுக்குங்கள்—வெட்டி வீழ்த்துங்கள்’ என இயல்பான, தெளிவான வினைகள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
