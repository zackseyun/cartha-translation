  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் தொடர்ச்சியான வினைநடையை இயல்பான தமிழ் வாக்கிய அமைப்பில் வழங்கியுள்ளோம்; עֵדָה மற்றும் נָשִׂיא ஆகியவற்றின் சொல்லியல் மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
