  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: ta
  text: 'ஆனால் மோசே அவர்களை அழைத்தார். ஆரோனும் சபையின் தலைவர்கள் அனைவரும்[a] அவரிடம் திரும்பி வந்தார்கள்; மோசே அவர்களிடம் பேசினார்.


    [a] வேறு வகையில், “சபையின் முதன்மையானவர்கள்” அல்லது “சமுதாயத்தின் தலைவர்கள்” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு வகையில், “சபையின் முதன்மையானவர்கள்” அல்லது “சமுதாயத்தின் தலைவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: அவர்களை அழைத்தார்
  rationale: קרא என்பதுடன் אֶל சேர்ந்து, மோசே அவர்களைத் தம்மிடம் வரும்படி அழைத்ததைச் சுட்டுகிறது. “அழைத்தார்” என்பது இயல்பான நவீனத் தமிழ்; “வரவழைத்தார்” என்பது அதிகாரபூர்வமான கட்டளை என்ற பொருளை அளவுக்கு மீறி வலியுறுத்தக்கூடும்.
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: அவரிடம் திரும்பி வந்தார்கள்
  rationale: שׁוב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதையும், அவர்கள் மோசேயிடம் மீண்டும் நெருங்கி வந்த சூழலையும் இந்தச் சொற்றொடர் தெளிவாகக் காக்கிறது.
- source_word: הַנְּשִׂאִים
  choice: தலைவர்கள்
  rationale: נָשִׂיא இங்கு கோத்திர அல்லது சமூகத் தலைமையை வகிப்பவர்களைக் குறிக்கிறது. “தலைவர்கள்” என்பது இன்றைய வாசகர்களுக்குத் தெளிவானது; “இளவரசர்கள்” என்பது இச்சூழலில் தவறான அரச மரபுப் பொருளைக் கொடுக்கலாம்.
- source_word: בָּעֵדָה
  choice: சபையின்
  rationale: עֵדָה கூடியிருக்கும் உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது. “சபை” அதன் ஒன்றுகூடிய மக்கள்குழு என்ற நுணுக்கத்தைக் காக்கிறது; “சமுதாயம்” என்பதும் சாத்தியமான மாற்று.
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: דבר என்பதற்கான நேரடியான, இயல்பான, கண்ணியமான தமிழாக்கம் “பேசினார்.”
- source_word: וַ
  choice: ஆனால்
  rationale: தொடக்க வாவ் நிகழ்ச்சித் தொடரை இணைக்கிறது; முந்தைய வசனத்தில் மக்கள் அணுக அஞ்சியதற்கு மாறாக மோசே அவர்களை அழைத்தார் என்ற மென்மையான எதிர்மறைத் தொடர்பை “ஆனால்” வெளிப்படுத்துகிறது.
