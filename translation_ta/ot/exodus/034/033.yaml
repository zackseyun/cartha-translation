    text: அல்லது, ‘அவர்களோடு பேசுவதை நிறுத்தியபோது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל מִדַּבֵּר
  choice: பேசி முடித்தபோது
  rationale: כלה என்பதன் தொடர்வினை வடிவமும் מן முன்னொட்டுடன் வரும் דבר வினையெச்சமும் சேர்ந்து, பேசும் செயல் நிறைவடைந்ததைத் தெரிவிக்கின்றன. இயல்பான நவீனத் தமிழில் ‘பேசி முடித்தபோது’ இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: אִתָּם
  choice: அவர்களோடு
  rationale: את என்ற முன்னிடைச்சொல் இங்கு நேரடியாக ‘அவர்களோடு’ என்று பொருள்படும்; சூழலில் அவர்களிடம் உரையாற்றுதல் இருந்தாலும், எபிரேயச் சொல்லின் உடனிருப்பு/உரையாடல் நிழற்பொருளை இது காக்கிறது.
- source_word: וַיִּתֵּן עַל־פָּנָיו
  choice: தன் முகத்தின்மேல் ... போட்டுக்கொண்டார்
  rationale: נתן + על என்பது ஒன்றை ஒன்றின்மேல் வைப்பதைக் குறிக்கிறது. திரையைத் தன் முகத்தில் அணிந்த செயலைத் தமிழில் இயல்பாகக் கூற ‘போட்டுக்கொண்டார்’ பயன்படுத்தப்பட்டுள்ளது; ‘தன்’ என்பது செய்பவரும் உடைமையாளரும் மோசே என்பதைக் காட்டுகிறது.
- source_word: מַסְוֶה
  choice: திரை
  rationale: இச்சூழலில் முகத்தை மறைக்கும் மூடியைக் குறிக்கிறது. ‘திரை’ என்பது புரிந்துகொள்ள எளிய, கண்ணியமான தமிழ்ச் சொல்; முகத்தை மூடும் பொருள் சூழலாலும் ‘முகத்தின்மேல்’ என்பதாலும் தெளிவாகிறது.
