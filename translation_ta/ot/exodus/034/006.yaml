source:
  edition: WLC
  text: וַ/יַּעֲבֹ֨ר יְהוָ֥ה עַל פָּנָי/ו֮ וַ/יִּקְרָא֒ יְהוָ֣ה יְהוָ֔ה אֵ֥ל רַח֖וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת׀־׀־׀
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: ta
  text: 'அப்போது யாவே அவருக்கு முன்பாகக் கடந்துசென்று அறிவித்தார்: “யாவே, யாவே, இரக்கமும் அருளும் உள்ள கடவுள்; கோபப்படுவதில் மெதுவானவர்; மாறாத அன்பும் நம்பகத்தன்மையும்[a] நிறைந்தவர்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாறாத அன்பும் உண்மையும் நிறைந்தவர்.”
    reason: אֱמֶת இச்சூழலில் கடவுளின் நம்பகத்தன்மை அல்லது விசுவாசத்தன்மையைக் குறிக்கலாம்; அதன் அடிப்படைப் பொருளான ‘உண்மை’ என்பதும் சாத்தியமான மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பட்ட பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் இயல்பாக ஒலிபெயர்க்கிறது; எபிரெய மூலத்திலுள்ள இருமுறைக் கூறுதலும் அப்படியே பாதுகாக்கப்படுகிறது.
- source_word: וַיַּעֲבֹר ... עַל־פָּנָיו
  choice: அவருக்கு முன்பாகக் கடந்துசென்று
  rationale: இச்சூழலில் עבר என்பது ஒருவருக்கு முன்பாக அல்லது அவரைக் கடந்து நகர்வதைக் குறிக்கிறது; עַל־פָּנָיו என்பதன் இடவியல் உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּקְרָא
  choice: இவ்வாறு அறிவித்தார்
  rationale: இங்கு வினைச்சொல் இறைவனின் பெயரையும் பண்புகளையும் உரத்த, சிறப்பான முறையில் அறிவிப்பதைக் குறிக்கிறது; வெறுமனே ‘அழைத்தார்’ என்பதைக் காட்டிலும் சூழலுக்குப் பொருத்தமானது.
- source_word: אֵל
  choice: கடவுள்
  rationale: மீண்டும் கூறப்பட்ட யாவே என்ற பெயருக்குப் பின், பண்புகளின் பட்டியலை அறிமுகப்படுத்தும் இணைப்பெயராக வருகிறது. தமிழில் ‘கடவுள்’ என்பது தெளிவான, பொதுவாகப் புரியக்கூடிய வடிவம்.
- source_word: רַחוּם וְחַנּוּן
  choice: இரக்கமும் அருளும் உள்ள
  rationale: רַחוּם ஆழ்ந்த இரக்கத்தையும் חַנּוּן அருள் அல்லது தயவு வழங்கும் குணத்தையும் குறிக்கின்றன; இரண்டிற்குமுள்ள வேறுபாட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: אֶרֶךְ אַפַּיִם
  choice: கோபப்படத் தாமதிப்பவர்
  rationale: சொல்லளவில் ‘நீண்ட நாசியுள்ளவர்’ என்ற எபிரெய மரபுத்தொடர், எளிதில் கோபமடையாத தன்மையைக் குறிக்கிறது. தமிழில் அதன் கருத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: רַב
  choice: நிறைந்தவர்
  rationale: அடுத்து வரும் அருவப் பண்புகள் மிகுதியாக இருப்பதை רַב குறிக்கிறது; ‘நிறைந்தவர்’ என்பது தமிழில் இயல்பான பண்புவிளக்கம்.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: חֶסֶד அன்பு, தயவு, உறுதியான பற்றுறுதி ஆகிய கருத்துகளை உள்ளடக்குகிறது. ‘மாறாத அன்பு’ அதன் நீடித்த, நம்பிக்கைக்குரிய இயல்பை எளிய நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱמֶת
  choice: உண்மைத்தன்மை
  rationale: חֶסֶד உடன் இணையும் இச்சூழலில், இச்சொல் நம்பத்தகுந்த உறுதிப்பாட்டை அல்லது விசுவாசத்தன்மையைக் குறிக்கிறது. ‘உண்மைத்தன்மை’ அந்தப் பொருளைத் தருவதோடு, ‘உண்மை’ என்ற அடிப்படைச் சொல்லுடனான தொடர்பையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயர் இருமுறை வருதல்
  choice: யாவே, யாவே
  alternative: ஆண்டவர் கடவுள்
  rationale: எபிரெய உரை உடன்படிக்கைப் பெயரை வலியுறுத்துவதற்காக இருமுறை கூறுகிறது. அதனைச் சீராக்காமலும், அடுத்துள்ள אֵל என்பதைக் பெயர்தொடருக்குள் முன்கூட்டியே இழுக்காமலும் அப்படியே பாதுகாக்கிறது.
- issue: חֶסֶד וֶאֱמֶת என்ற இணைப்பில் אֱמֶת என்பதன் பொருள்
  choice: உண்மைத்தன்மை
  alternative: உண்மை
  rationale: இணைச்சொல் அமைப்பில் இது கடவுளின் நம்பத்தகுந்த, உறுதியான குணத்தைக் குறிக்கக்கூடும்; அதனால் முதன்மை உரையில் ‘உண்மைத்தன்மை’ பயன்படுத்தப்படுகிறது. அதேவேளை ‘உண்மை’ என்ற நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் திருவிவிலிய உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. எபிரெய மூலத்தின் அரைப்புள்ளி போன்ற பண்புப் பட்டியல் ஓட்டம் தமிழில் இயல்பாக அமைய நிறுத்தக்குறிகள் பயன்படுத்தப்பட்டன; தெளிவிற்காக ‘இவ்வாறு’ சேர்க்கப்பட்டது.
