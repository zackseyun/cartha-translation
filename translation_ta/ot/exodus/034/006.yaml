  source_fidelity: யாவே என்ற பெயரின் இரட்டிப்பு, அவருக்கு முன்பாகக் கடந்து செல்லுதல், அறிவித்தல், இரக்கமும் அருளும், கோபத்திற்கு மெதுவாயிருத்தல், மிகுதியான அன்பு ஆகியவை எபிரெய மூலத்துக்கு உண்மையாக உள்ளன. ஆனால் אֱמֶת இங்கு கடவுளின் நம்பத்தகுந்த/உறுதியான பண்பைக் குறிக்கும் வாய்ப்பை முதன்மை உரையில் ‘உண்மைத்தன்மை’ என்பதைக் காட்டிலும் ‘நம்பகத்தன்மை’ தெளிவாகக் காட்டுகிறது.
