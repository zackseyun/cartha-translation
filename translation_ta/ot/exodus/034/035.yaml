  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் மோசேயின் முகத்தைப் பார்த்தார்கள்; மோசேயின் முகத்தோல் ஒளிவீசியதை அவர்கள் கண்டார்கள்.[a] அவரோடு பேசுவதற்காக உள்ளே செல்லும்வரை, மோசே தன் முகத்தின்மேல் திரையை மீண்டும் போட்டுக்கொள்வார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒளிவீசியது” என்பதற்கான எபிரெய வினை, ஒளிக்கதிர்களை வெளிப்படுத்தியது என்றும் பொருள்படலாம். “கொம்புடையதாயிருந்தது” என்ற பழைய மொழிபெயர்ப்பு இச்சொல்லைப் பற்றிய தவறான புரிதலைப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அவரோடு” என்பது முந்தைய வசனத்தின் சூழலின்படி ஆண்டவரைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: பார்த்தார்கள் ... கண்டார்கள்
  rationale: வழக்கமாக நிகழ்ந்த செயலைச் சூழல் உணர்த்தினாலும், வழியிக்தோல் தொடரின் இறந்தகாலக் கதையோட்டத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; இரண்டாவது ‘கண்டார்கள்’ என்பது כִּי அறிமுகப்படுத்தும் அவர்கள் உணர்ந்த உள்ளடக்கத்தைத் தெளிவாக்குகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘இஸ்ரவேலின் மகன்கள்.’ ஆனால் நவீனத் தமிழில் முழு சமூகத்தையும் இயல்பாகவும் உள்ளடக்கமாகவும் குறிக்க ‘இஸ்ரவேல் மக்கள்’ தெளிவான தேர்வு.
- source_word: פְּנֵי מֹשֶׁה
  choice: மோசேயின் முகம்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக மொழிபெயர்க்கிறது.
- source_word: כִּי
  choice: …ஒளிவீசியதை
  rationale: இங்கு כִּי, அவர்கள் பார்த்தறிந்தவற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் பெயரெச்ச-வேற்றுமை அமைப்பு இயல்பாக அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: קָרַן
  choice: ஒளிவீசியது
  rationale: வினைச்சொல் ஒளிக்கதிர்களை வெளிப்படுத்துதல் அல்லது பிரகாசித்தலைக் குறிக்கிறது. ‘கொம்புடையது’ என்ற பழைய தவறான புரிதலைத் தவிர்த்து, உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: மோசேயின் முகத்தோல்
  rationale: עוֹר என்பதன் குறிப்பான ‘தோல்’ என்ற பொருளை விடாமல், தமிழில் சுருக்கமாகவும் புரியத்தக்கவாறும் தருகிறது.
- source_word: וְהֵשִׁיב
  choice: மீண்டும் போட்டுக்கொள்வார்
  rationale: ஹிஃபில் வடிவத்தின் ‘திரும்ப வைப்பது’ என்ற பொருளையும், சூழலில் மீண்டும் மீண்டும் நிகழ்ந்த வழக்கமான செயலையும் வெளிப்படுத்துகிறது.
- source_word: הַמַּסְוֶה
  choice: திரை
  rationale: முகத்தை மூடும் பொருளைக் குறிக்கும் மரியாதையான, பொதுவாகப் புரியும் தமிழ்ச்சொல்; ‘முகமூடி’ நவீன மருத்துவ அல்லது வேடப் பொருளுணர்வை ஏற்படுத்தலாம்.
- source_word: עַל־פָּנָיו
  choice: தன் முகத்தின்மேல்
  rationale: திரை முகத்தை மூடிய நிலையைத் தெளிவாகக் காட்டுகிறது; பிரதிபெயரின் உறவைத் தமிழில் இயல்பாக்க ‘தன்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַד בֹּאוֹ
  choice: உள்ளே செல்லும்வரை
  rationale: செயலின் காலவரம்பையும், ஆண்டவரின் முன்னிலைக்குள் மோசே சென்ற இயக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: לְדַבֵּר אִתּוֹ
  choice: அவரோடு பேசுவதற்காக
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமைப் பிரதிப்பெயரைப் பாதுகாக்கிறது; உடனடியான சூழலில் அது ஆண்டவரைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: ‘அவரோடு’ என்பதன் சுட்டுப்பொருள்
  choice: முதன்மை உரையில் பிரதிப்பெயரான ‘அவரோடு’ என்பதே வைக்கப்பட்டது; அது ஆண்டவரைக் குறிக்கிறது என்று அடிக்குறிப்பில் விளக்கப்பட்டது.
  alternative: முதன்மை உரையிலேயே ‘ஆண்டவரோடு’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: மூல எபிரெயம் இறைப் பெயருக்குப் பதிலாக பிரதிப்பெயரைப் பயன்படுத்துகிறது. அதை உரையில் பாதுகாப்பது மூலத்தின் வடிவத்தையும் சிறிய அளவிலான சுட்டுப்பொருள் சார்பையும் காக்கிறது; உடனடிச் சூழல் referent-ஐத் தெளிவாக்குகிறது.
- issue: கָרַן என்ற வினையின் பொருள்
  choice: ஒளிவீசியது
  alternative: கொம்புடையதாயிருந்தது
  rationale: இச்சூழலில் வினை ஒளிக்கதிர்கள் வெளிப்படுவதைச் சொல்கிறது. ‘கொம்புடையது’ என்பது தொடர்புடைய பெயர்ச்சொல்லை அடிப்படையாகக் கொண்ட பழைய தவறான புரிதல்; இங்கு பொருத்தமற்றது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘இஸ்ரவேல் மக்கள்’ இயல்பான சமூகக் குறிப்பாகவும், ‘முகத்தோல்’ மூலத்தின் உடற்கூறு துல்லியத்தைப் பாதுகாக்கவும் தேர்ந்தெடுக்கப்பட்டன. முதல் வினை இறந்தகாலக் கதையோட்டத்திலும், திரையை மீண்டும் போடும் செயல் வழக்கமான தொடர்ச்சிச் செயலாகவும் வேறுபடுத்தப்பட்டுள்ளது.
