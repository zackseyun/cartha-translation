base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: ta
  text: பின்பு யாவே மோசேயிடம், “இந்த வார்த்தைகளை உனக்காக எழுதிக்கொள். ஏனெனில், இந்த வார்த்தைகளின்படியே நான் உன்னோடும் இஸ்ரவேலோடும் ஓர் உடன்படிக்கை செய்திருக்கிறேன்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “ஓர் உடன்படிக்கையை வெட்டியிருக்கிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியையும் நேரடி உரையின் இயல்பான தமிழ் அமைப்பையும் வெளிப்படுத்துகிறது.
- source_word: כְּתָב לְךָ
  choice: உனக்காக எழுதிக்கொள்
  rationale: கட்டளையின் நேரடித்தன்மையையும் לְךָ குறிக்கும் மோசேயின் தனிப்பட்ட ஈடுபாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள்
  rationale: எழுதப்பட வேண்டிய உடன்படிக்கைச் சொற்களைக் குறிக்கிறது; வசனத்தில் வரும் மீளுரைப்பையும் ஒரே சொல்லால் காக்கிறது.
- source_word: כִּי עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: ஏனெனில், இந்த வார்த்தைகளின்படியே
  rationale: כִּי என்பதன் காரணத் தொடர்பையும் עַל־פִּי என்பதன் ‘அடிப்படையில்/இணங்க’ என்ற பொருளையும் சுருக்கமான இயல்பான தமிழில் தருகிறது.
- source_word: כָּרַתִּי ... בְּרִית
  choice: ஓர் உடன்படிக்கை செய்திருக்கிறேன்
  rationale: சொல்லுக்கு சொல் ‘உடன்படிக்கையை வெட்டினேன்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை நவீன வாசகர்களுக்குப் புரியும் தமிழில் தருகிறது; நிறைவேறிய செயலின் தற்போதைய பொருத்தத்தையும் உணர்த்துகிறது.
- source_word: אִתְּךָ ... וְאֶת־יִשְׂרָאֵל
  choice: உன்னோடும் இஸ்ரவேலோடும்
  rationale: மோசேயையும் இஸ்ரவேலையும் உடன்படிக்கையுடன் தொடர்புடையவர்களாக இணையாகக் காட்டும் மூல அமைப்பைக் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: தனிப்பட்ட இறைபெயரைப் பட்டமாக மாற்றாமல் பாதுகாக்கிறது; குறிப்பிட்ட சமயமரபின் மாற்றீட்டைத் திணிக்கவில்லை.
- issue: כָּרַתִּי ... בְּרִית என்ற உடன்படிக்கை மரபுத்தொடர்
  choice: உடன்படிக்கை செய்திருக்கிறேன்
  alternative: உடன்படிக்கையை வெட்டியிருக்கிறேன்
  rationale: மூலத்தின் பொருளைத் தெளிவாகத் தருகிறது; நேரடி வடிவம் தமிழில் தவறாகப் புரிந்துகொள்ளப்படக்கூடும் என்பதால் அதன் சொல்லுருவை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; மரியாதையும் வேதாகமக் கண்ணியமும் கொண்ட எளிய நடை. ‘வார்த்தைகள்’ என்ற சொல்லின் மீளுரை மூலத்தைப் பின்பற்றுகிறது; ‘உனக்காக எழுதிக்கொள்’ என்பது לְךָ-வின் நுணுக்கத்தை இயல்பாகக் காக்கிறது.
