source:
  edition: WLC
  text: וֶ/הְיֵ֥ה נָכ֖וֹן לַ/בֹּ֑קֶר וְ/עָלִ֤יתָ בַ/בֹּ֨קֶר֙ אֶל הַ֣ר סִינַ֔י וְ/נִצַּבְתָּ֥ לִ֛/י שָׁ֖ם עַל רֹ֥אשׁ הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: ta
  text: காலைக்குள் ஆயத்தமாக இரு; காலையில் சீனாய் மலைக்கு ஏறிவந்து[a], அங்கே மலையின் உச்சியில் என் முன்னிலையில் நில்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீனாய் மலைக்கு ஏறிப்போய்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அங்கே மலையின் உச்சியில் என்னிடம் ஆஜராகு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן
  choice: ஆயத்தமாக இரு
  rationale: கட்டளை வடிவத்தையும் נָכוֹן என்பதன் ‘தயார்/ஆயத்தம்’ என்ற பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לַבֹּקֶר
  choice: காலைக்குள்
  rationale: அடுத்த நாள் காலைக்கு முன்னதாக ஆயத்தம் நிறைவடைந்திருக்க வேண்டும் என்ற காலக் குறிப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְעָלִיתָ בַבֹּקֶר
  choice: காலையில் ... ஏறிவந்து
  rationale: בַבֹּקֶר என்பதைக் ‘காலையில்’ என்றும், עלה என்பதன் மேல்நோக்கிய இயக்கத்தையும் பேச்சாளரான இறைவனை நோக்கிய திசையையும் ‘ஏறிவந்து’ என்றும் வெளிப்படுத்துகிறது.
- source_word: אֶל הַר סִינַי
  choice: சீனாய் மலைக்கு
  rationale: இடப்பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்புடன் தருகிறது.
- source_word: וְנִצַּבְתָּ לִי
  choice: என் முன்னிலையில் நில்
  rationale: נצב என்பதன் ‘நில்/நிலைகொள்’ என்ற அடிப்படைப் பொருளையும் לִי உடன் வரும் இறைமுன் ஆஜராகும் சூழலையும் இயல்பாகக் காக்கிறது.
- source_word: שָׁם עַל רֹאשׁ הָהָר
  choice: அங்கே மலையின் உச்சியில்
  rationale: இடத்தைக் குறிக்கும் שָׁם என்பதையும், நிலவியல் பயன்பாட்டில் ‘உச்சி’ எனப் பொருள்படும் רֹאשׁ என்பதையும் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: עלה என்ற வினையின் பேச்சாளர் சார்ந்த திசை
  choice: ஏறிவந்து
  alternative: ஏறிப்போய்
  rationale: எபிரெய வினை இரு திசைநிலைகளையும் அனுமதிக்கிறது. மலையில் தம்மைச் சந்திக்கும்படி கடவுள் கட்டளையிடும் சூழலில் ‘ஏறிவந்து’ என்பது பேச்சாளரை நோக்கிய இயக்கத்தை இயல்பாக உணர்த்துகிறது; கூடுதல் கோட்பாட்டுப் பொருள் எதையும் சேர்ப்பதில்லை.
- issue: וְנִצַּבְתָּ לִי என்பதன் உறவுப்பொருள்
  choice: என் முன்னிலையில் நில்
  alternative: என்னிடம் ஆஜராகு
  rationale: ‘ஆஜராகு’ என்பது முறையான சந்திப்பின் கருத்தைத் தெளிவுபடுத்தினாலும், மூலத்தின் ‘நில்’ என்ற உடல் நிலையைக் குறிக்கும் படிமத்தை ‘என் முன்னிலையில் நில்’ சிறப்பாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க கட்டளை நடையிலும் வடிவமைக்கப்பட்டது. לַבֹּקֶר / בַבֹּקֶר ஆகிய வேறுபட்ட காலக் குறிப்புகள் ‘காலைக்குள்’ / ‘காலையில்’ எனத் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன. முதன்மை உரையில் உள்ள [a], [b] குறிகள் தொடர்புடைய அனைத்து அடிக்குறிப்புகளுடனும் பொருந்துகின்றன.
