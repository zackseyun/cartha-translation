  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: ta
  text: 'உன் நிலத்தின் முதற்கனிகளில் முதற்பகுதியை உன் கடவுளாகிய யாவேயின் இல்லத்துக்குக் கொண்டுவர வேண்டும்.[a]


    வெள்ளாட்டுக் குட்டியை அதன் தாயின் பாலில் வேகவைக்கக் கூடாது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் நிலத்தின் முதற்கனிகளில் சிறந்த பகுதியை.”
    reason: ரֵאשִׁית என்பது இச்சொற்றொடரில் ‘முதல் பகுதி’ என்பதோடு ‘சிறந்த பகுதி’ என்ற நுண்பொருளையும் தரக்கூடும்.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: முதற்கனிகளில் முதற்பகுதியை
  rationale: ரֵאשִׁית என்பதன் வரிசை/தொடக்கக் கருத்தையும், בִּכּוּרֵי என்பதன் காணிக்கைக்குரிய முதல் விளைச்சல் என்ற பொருளையும் இயல்பான தமிழில் காக்கிறது; ‘சிறந்த பகுதி’ என்ற சாத்தியமான நுண்பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: אַדְמָתְךָ
  choice: உன் நிலத்தின்
  rationale: பயிர் விளையும் மண் அல்லது பயிரிடப்பட்ட நிலத்தைக் குறிக்கும் சூழலில் ‘நிலம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: תָּבִיא
  choice: கொண்டுவர வேண்டும்
  rationale: சட்டக் கட்டளையாகச் செயல்படும் ஹிபில் முற்றாத வினையின் வலிமையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேயின் இல்லத்துக்கு
  rationale: בֵּית என்பதன் நேரடியான ‘இல்லம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; ‘ஆலயம்’ என்று மொழிபெயர்த்து பின்னைய வரலாற்றுச் சிறப்பைத் தேவையின்றி புகுத்தவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பு; அதை ஒரு பட்டப்பெயராக மாற்றாமல் உடன்படிக்கையின் தெய்வீகப் பெயராகக் காக்கிறது.
- source_word: לֹא תְבַשֵּׁל
  choice: வேகவைக்கக் கூடாது
  rationale: בשל குறிக்கும் சமைத்தல்/வேகவைத்தல் என்ற செயலைத் தெளிவாகக் கூறி, தடைச் சட்டத்தின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: גְּדִי
  choice: வெள்ளாட்டுக் குட்டியை
  rationale: இளம் ஆட்டைக் குறிக்கும் சொல்லைத் தெளிவாக வழங்குகிறது; தமிழில் ‘ஆட்டுக்குட்டி’ என்பதில் செம்மறியாடு குறித்த குழப்பம் ஏற்படாமல் ‘வெள்ளாடு’ எனத் துல்லியப்படுத்துகிறது.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: அதன் தாயின் பாலில்
  rationale: எபிரெய உறவையும் முன்னிடைச்சொல் படிமத்தையும் இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்துத் தெய்வீகத் தனிப்பெயரே உள்ளது; ஆகவே தனிப்பெயரை ஒலிபெயர்ப்பாகக் காக்கிறது.
- issue: רֵאשִׁית בִּכּוּרֵי என்பதில் வரிசையா தரமா
  choice: முதற்கனிகளில் முதற்பகுதியை
  alternative: முதற்கனிகளில் சிறந்த பகுதியை
  rationale: மூலச்சொல்லின் முதன்மைத் தொடக்க/முதல் என்ற பொருளை உரையில் முன்னிறுத்தி, தரத்தைக் குறிக்கக்கூடிய நுண்பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் சட்டக் கட்டளையின் வலிமையும் காக்கப்பட்டுள்ளன. பழமையான வினைமுற்றுகளைத் தவிர்த்து ‘வேண்டும்/கூடாது’ வடிவம் பயன்படுத்தப்பட்டுள்ளது; வேளாண் மற்றும் வழிபாட்டுச் சூழல் தெளிவாக வைக்கப்பட்டுள்ளது.
