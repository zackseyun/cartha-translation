  text: שְׁמָ֨ר לְ/ךָ֔ אֵ֛ת אֲשֶׁ֥ר אָנֹכִ֖י מְצַוְּ/ךָ֣ הַ/יּ֑וֹם הִנְ/נִ֧י גֹרֵ֣שׁ מִ/פָּנֶ֗י/ךָ אֶת הָ/אֱמֹרִי֙ וְ/הַֽ/כְּנַעֲנִ֔י וְ/הַ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: ta
  text: நான் இன்று உனக்குக் கட்டளையிடுவதைக் கவனமாகக் கடைப்பிடி.[a] இதோ, உன் முன்னிலையிலிருந்து எமோரியரையும் கானானியரையும் ஏத்தியரையும் பெரிசியரையும் ஏவியரையும் எபூசியரையும் நான் துரத்திவிடுகிறேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் இன்று உனக்குக் கட்டளையிடுவதைக் காத்துக்கொள்” அல்லது “அதைக் குறித்து எச்சரிக்கையாக இரு.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “உன் முகத்திற்கு முன்பாக இருந்து”; இது உன் முன்னிலையிலிருந்து அவர்களை அகற்றுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: கவனமாகக் கடைப்பிடி
  rationale: שׁמר என்ற கட்டளைச் சொல் காத்தல், கவனித்தல், கடைப்பிடித்தல் ஆகிய நுணுக்கங்களைக் கொண்டது. உடன்படிக்கைச் சூழலில் ‘கடமையாகக் கடைப்பிடி’ என்பதே இயல்பான பொருள்; ‘கவனமாக’ என்பது לְךָ உடன் வரும் சுயக் கவன நுணுக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: நான் இன்று உனக்குக் கட்டளையிடுவதை
  rationale: எபிரெய உறவுநிலைத் தொடரின் பொருளையும், מְצַוְּךָ என்பதன் நிகழ்காலச் செயற்பாட்டு வலிமையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הִנְנִי
  choice: இதோ
  rationale: வரவிருக்கும் உறுதியான இறைச் செயலுக்கு கவனம் ஈர்க்கும் எபிரெயச் சொல்லின் வலியுறுத்தலை நவீன, கண்ணியமான தமிழில் தருகிறது.
- source_word: גֹרֵשׁ
  choice: நான் துரத்திவிடுகிறேன்
  rationale: גרש என்பதன் ‘வெளியே துரத்துதல்/அகற்றுதல்’ என்ற பொருளையும், participle தரும் நிகழும் அல்லது அண்மையில் உறுதியாக நிகழவுள்ள செயல் உணர்வையும் காக்கிறது.
- source_word: מִפָּנֶיךָ
  choice: உனக்கு முன்பாக இருந்து
  rationale: ‘உன் முகத்திற்கு முன்பாக இருந்து’ என்ற மூல மொழி உருவகத்தைத் தமிழில் புரியத்தக்க வகையில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: הָאֱמֹרִי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: எமோரியர், கானானியர், ஏத்தியர், பெரிசியர், ஏவியர், எபூசியர்
  rationale: எபிரெயில் ஒருமை வடிவில் வரும் இனப்பெயர்கள் கூட்டுப்பொருள் கொண்டதால், தமிழின் இயல்புக்கு ஏற்ப மக்கள் குழுக்களைக் குறிக்கும் பன்மை மரியாதை வடிவில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் שׁמר கட்டளையின் நுணுக்கம்
  choice: கட்டளையிடப்படுவதை கவனமாகக் கடைப்பிடிக்கும்படி மொழிபெயர்த்தல்
  alternative: நான் இன்று உனக்குக் கட்டளையிடுவதைக் காத்துக்கொள்
  rationale: இங்கு வெறும் எச்சரிக்கை மட்டுமல்ல, கொடுக்கப்படும் உடன்படிக்கைக் கட்டளைகளைக் கவனித்து நடப்பதற்கான அழைப்பும் உள்ளது. ‘கடமைப்பட்டதைச் செய்’ போன்ற விரிவாக்கத்தைச் சேர்க்காமல் இந்த நுணுக்கம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ இறைச் செயலின் வலியுறுத்தலைக் காக்கிறது; இனப்பெயர்கள் தமிழில் வழக்கமான வேதாகம வடிவங்களில் தரப்பட்டுள்ளன.
