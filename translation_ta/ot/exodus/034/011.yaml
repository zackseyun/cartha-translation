- from: நான் இன்று உனக்குக் கட்டளையிடுவதைக் கவனமாகக் கடைப்பிடி.[a] இதோ, உனக்கு முன்பாக இருந்து எமோரியரையும் கானானியரையும் ஏத்தியரையும் பெரிசியரையும் ஏவியரையும் எபூசியரையும் நான் துரத்திவிடுகிறேன்.[b]
  to: நான் இன்று உனக்குக் கட்டளையிடுவதைக் கவனமாகக் கடைப்பிடி.[a] இதோ, உன் முன்னிலையிலிருந்து எமோரியரையும் கானானியரையும் ஏத்தியரையும் பெரிசியரையும் ஏவியரையும் எபூசியரையும் நான் துரத்திவிடுகிறேன்.[b]
