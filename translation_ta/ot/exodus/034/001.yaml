  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “முதல் பலகைகளைப் போல இரண்டு கற்பலகைகளை உனக்காக வெட்டிக்கொள்[a]. நீ உடைத்த முதல் பலகைகளில் இருந்த வார்த்தைகளை நான் இந்தப் பலகைகளில் எழுதுவேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செதுக்கிக்கொள்” அல்லது “பிளந்தெடுத்துக்கொள்.”
    reason: פְּסָל என்ற எபிரெய வினை கல்லை வெட்டி அல்லது செதுக்கி வடிவமைத்தலைக் குறிக்கலாம்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: உரையாடலை அறிமுகப்படுத்தும் வழக்கமான எபிரெயக் கதைவினைக்கு இயல்பான தமிழ் வடிவம்; ‘மோசேயிடம்’ என்பதுடன் சேர்ந்து பேசிய செயலைத் தெளிவாக்குகிறது.
- source_word: פְּסָל
  choice: வெட்டியெடு
  rationale: கல்லிலிருந்து பலகைகளை வெட்டி வடிவமைக்கும் கட்டளையை நேரடியாகவும் இன்றைய தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לְךָ
  choice: உனக்காக
  rationale: மோசே தமக்கெனப் பலகைகளை ஆயத்தப்படுத்த வேண்டும் என்ற எபிரெயத் தற்குறிப்பு வடிவத்தை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: இரண்டு கற்பலகைகள்
  rationale: எண்ணிக்கை, பொருள், பொருள்வகை ஆகிய மூன்றையும் சுருக்கமான இயல்பான தமிழில் தருகிறது.
- source_word: כָּרִאשֹׁנִים
  choice: முதல் பலகைகளைப் போன்ற
  rationale: முன்பு இருந்த பலகைகளுடனான ஒப்புமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְכָתַבְתִּי
  choice: நான் ... எழுதுவேன்
  rationale: முதலாம் நபர் வாக்குறுதியையும் எதிர்காலச் செயலையும் நேரடியாகப் பேணுகிறது.
- source_word: עַל הַלֻּחֹת
  choice: இப்பலகைகளில்
  rationale: எழுத்துகள் பலகைகளின் மேற்பரப்பில் பொறிக்கப்படுவதை இயல்பான தமிழ் வழக்கில் தெரிவிக்கிறது; அருகிலுள்ள புதிய பலகைகளையே குறிக்க ‘இப்-’ பயன்படுத்தப்படுகிறது.
- source_word: הַדְּבָרִים
  choice: வார்த்தைகள்
  rationale: எபிரெயச் சொல்லின் அடிப்படைப் பொருளைப் பேணுகிறது; சூழலின் அடிப்படையில் ‘கட்டளைகள்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: நீ உடைத்த
  rationale: மோசேயின் செயலை வெளிப்படையாகக் குறிப்பிடும் சார்புத் தொடரை எளிய தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துகிறது. ஆகவே அதை ‘கர்த்தர்’ எனப் பதிலிடாமல், பரவலாக ஏற்கப்படும் உச்சரிப்பின் தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது; ‘யெகோவா’ என்பது பிற்கால கலப்பு உச்சரிப்பைச் சார்ந்தது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மதிப்புமிக்க தொனியுடனும் அமைக்கப்பட்டது. ‘முதல் பலகைகள்’ என்ற மீளுரைத்தல் மூல உரையின் தொடர்பைத் தெளிவாகப் பேணுகிறது. இறைத் திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
