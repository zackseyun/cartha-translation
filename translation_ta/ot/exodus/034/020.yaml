base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: ta
  text: கழுதையின் முதற்பிறந்த குட்டியை ஒரு செம்மறியாட்டுக் குட்டியைக் கொடுத்து மீட்க வேண்டும்.[a] அதை மீட்காவிட்டால், அதன் கழுத்தை முறிக்க வேண்டும். உன் மகன்களின் ஒவ்வொரு முதற்பிறந்தவனையும் மீட்க வேண்டும். என் முன்னிலையில்[b] யாரும் வெறுங்கையுடன்[c] வரக்கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு செம்மறியாட்டையோ வெள்ளாட்டையையோ கொடுத்து’; எபிரெயச் சொல் שֶׂה என்பது மந்தையிலுள்ள செம்மறியாடு அல்லது வெள்ளாடு எதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லாட்சியாக, ‘என் முகத்துக்கு முன்.’ இது கடவுளின் முன்னிலையில் வருவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, பரிசோ காணிக்கையோ இல்லாமல் வரக்கூடாது.
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: கழுதையின் முதற்பேறு
  rationale: פֶטֶר என்பது கருப்பையை முதலில் திறக்கும் குட்டியைக் குறிக்கிறது; இச்சட்டச் சூழலில் ‘முதற்பேறு’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: תִּפְדֶּה
  choice: மீட்க வேண்டும்
  rationale: פדה இங்கு மாற்றுப் பலி அல்லது உரிய விலையின் மூலம் விடுவிப்பதைக் குறிக்கிறது; ‘மீட்க’ என்பது சட்ட மற்றும் உடன்படிக்கைச் சார்ந்த பொருளைத் தக்கவைக்கிறது.
- source_word: בְשֶׂה
  choice: ஒரு செம்மறியாட்டுக் குட்டியைக் கொடுத்து
  rationale: שֶׂה மந்தையிலுள்ள செம்மறியாடு அல்லது வெள்ளாட்டைக் குறிக்கலாம். முதன்மை உரையில் பலியிடும் சூழலுக்கு இயல்பான ‘செம்மறியாட்டுக் குட்டி’ பயன்படுத்தப்பட்டு, விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַעֲרַפְתּוֹ
  choice: அதன் கழுத்தை முறிக்க வேண்டும்
  rationale: ערף என்பது இங்கு குறிப்பாகக் கழுத்தை முறித்துக் கொல்வதைக் குறிக்கிறது; தமிழில் இச்சொற்றொடர் நேரடியாகவும் துல்லியமாகவும் உள்ளது.
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: உன் மகன்களில் ஒவ்வொரு முதற்பேறானவனையும்
  rationale: எபிரெய உரை ஆண்பிள்ளைகளையே வெளிப்படையாகக் குறிப்பிடுகிறது; ஆகவே ‘மகன்கள்’ என்ற பாலினத் துல்லியம் காக்கப்படுகிறது.
- source_word: יֵרָאוּ פָנַי
  choice: என் முன்னிலையில் … வரக்கூடாது
  rationale: சொல்லாட்சியாக ‘என் முகத்துக்கு முன் காணப்படுதல்’ என்றாலும், இது வழிபாட்டிற்காகக் கடவுளின் முன்னிலையில் வருவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: רֵיקָם
  choice: வெறுங்கையுடன்
  rationale: இவ்வழிபாட்டுச் சூழலில் காணிக்கை அல்லது பரிசு இல்லாமல் வருவதைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்.
theological_decisions:
- issue: இறுதிக் கூற்றிலுள்ள இறைவனின் முதலாம் நபர் குறிப்பு
  choice: என் முன்னிலையில்
  alternative: என் முகத்துக்கு முன்
  rationale: ‘என் முகம்’ என்பது இறைவனின் சந்நிதியில் தோன்றுவதைச் சுட்டும் எபிரெய மரபுத்தொடர். ‘என் முன்னிலையில்’ நேரடியான இறைபேச்சையும் இயல்பான தமிழையும் காக்கிறது.
- issue: בָּנֶיךָ என்பதிலுள்ள பாலினக் குறிப்பு
  choice: உன் மகன்களில்
  alternative: உன் பிள்ளைகளில்
  rationale: மூல உரை பொதுவாகப் பிள்ளைகளை அல்ல, மகன்களைத் தெளிவாகக் குறிப்பிடுவதால் ஆண்பால் குறிப்பு மாற்றப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் சட்டக் கட்டளையின் வலிமையும் காக்கப்பட்டுள்ளன. ஒருமை இரண்டாம் நபருக்கான கட்டளைகள் ‘வேண்டும்/கூடாது’ வடிவில் இயல்பாக வழங்கப்பட்டுள்ளன; தேவையற்ற சமயக்குழு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
