base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: ta
  text: ஏனெனில், நான் உன் முன்பாக இருந்த தேசங்களை அகற்றி, உன் எல்லையை விரிவுபடுத்துவேன்; நீ உன் தேவனாகிய யாவே முன் தோன்றுவதற்காக[a] ஆண்டில் மூன்று முறை[b] ஏறிச் செல்லும்போது, உன் நாட்டை எந்த ஒருவனும்[c] ஆசைப்பட மாட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லெழுத்தாக, ‘உன் தேவனாகிய யாவேயின் முகத்தைக் காண்பதற்காக.’ வழிபாட்டுக்காக அவர் முன்னிலையில் வருவதை இம்மரபுத்தொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வருடத்தில் மூன்று முறை.’
    reason: lexical_alternative
  - marker: c
    text: ‘எந்த ஒருவனும்’ என்பது எபிரெயில் ஆண்பால் ஒருமைச் சொல்; இங்கு அது பிரதிநிதித்துவப் பொருளில் பயன்பட்டு, இஸ்ரவேலின் ஆண்கள் யாத்திரைப் பண்டிகைகளுக்குச் சென்றிருக்கையில் நாட்டை ஆசைப்படும் எவரையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய யாத்திரைப் பண்டிகைக் கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אוֹרִישׁ
  choice: துரத்திவிடுவேன்
  rationale: ஹிஃபில் வடிவம் இங்கு தேசத்தாரை நிலத்திலிருந்து அகற்றுவதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: גּוֹיִם
  choice: பிற தேசத்தார்
  rationale: இச்சூழலில் இஸ்ரவேலுக்கு முன் நிலத்தில் வாழும் அயல் இன-அரசியல் மக்களைக் குறிக்கிறது; வெறும் நிலப்பரப்புகளான ‘தேசங்கள்’ என்று தவறாகப் புரியாதபடி மக்களைச் சுட்டும் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מִפָּנֶיךָ
  choice: உன் முன்னிலையிலிருந்து
  rationale: ‘உன் முகத்திற்கு முன்பிருந்து’ என்ற எபிரெய மரபுத்தொடரின் இடவியல் கருத்தைப் பாதுகாக்கிறது.
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: உன் எல்லையை விரிவாக்குவேன்
  rationale: எல்லை அல்லது ஆட்சிப்பரப்பை அகலமாக்கும் வாக்குறுதியைத் தெளிவாகத் தருகிறது.
- source_word: לֹא יַחְמֹד
  choice: ஆசைகொள்ள மாட்டான்
  rationale: חמד என்பது தனக்குரியதல்லாததை விரும்பும் பேராசையைச் சுட்டுகிறது; ‘ஆசைகொள்’ பத்துக் கட்டளைகளுடனான சொல்லியல் தொடர்பையும் தமிழில் இயன்றவரைத் தக்கவைக்கிறது.
- source_word: אִישׁ
  choice: ஒருவனும்
  rationale: எபிரெயில் ஆண்பால் ஒருமையாக உள்ள சொல்லைத் தக்கவைத்து, எதிர்மறை வாக்கியத்தில் பிரதிநிதித்துவப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַרְצְךָ
  choice: உன் நாடு
  rationale: இங்கு இஸ்ரவேலுக்குரிய நிலப்பரப்பை முழுமையாகக் குறிக்கிறது; ‘நிலம்’ என்பதைவிட உடைமைக்குட்பட்ட தேசப்பரப்பு என்னும் பொருள் தெளிவாகிறது.
- source_word: בַּעֲלֹתְךָ
  choice: நீ ஏறிச் செல்லும்போது
  rationale: வழிபாட்டு இடத்திற்குச் செல்லும் யாத்திரையைச் சுட்டும் עלה என்பதன் ‘மேலே செல்’ என்ற படிமத்தைப் பாதுகாக்கிறது.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: முன் தோன்றுவதற்காக
  rationale: சொல்லெழுத்தாக ‘முகத்தைக் காண’ என்றாலும், அரசர் அல்லது இறைவன் முன்னிலையில் வழிபாட்டுக்காக வருதல் என்னும் மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், மூலத்தில் உள்ள இஸ்ரவேலின் தேவனுடைய தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: ஆண்டுக்கு மூன்று முறை
  rationale: குறிப்பிட்ட ஆண்டு தோறும் நிகழும் மூன்று யாத்திரைகளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: אִישׁ என்ற ஆண்பால் ஒருமையின் பிரதிநிதித்துவப் பயன்பாடு
  choice: ஒருவனும்
  alternative: எவரும்
  rationale: மூலத்தின் இலக்கண ஆண்பாலைத் தக்கவைக்கிறது; அதேவேளையில் சூழலில், ஆண்கள் பண்டிகைக்குச் சென்றிருக்கையில் நாட்டை அபகரிக்க வரக்கூடிய எந்த மனிதனையும் பொதுவாகக் குறிக்கிறது.
- issue: לֵרָאוֹת אֶת־פְּנֵי என்ற வழிபாட்டு மரபுத்தொடர்
  choice: யாவே முன் தோன்றுவதற்காக
  alternative: யாவேயின் முகத்தைக் காண்பதற்காக
  rationale: சொல்லெழுத்துப் படிமத்தை அடிக்குறிப்பில் பாதுகாத்து, முதன்மை உரையில் வழிபாட்டுக்காக தேவனுடைய முன்னிலைக்கு வருதல் என்னும் சூழற்பொருளைத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘யாவே’ என்பது இறைப் பெயரின் ஒலிபெயர்ப்பு. ‘ஏறிச் செல்லுதல்’ யாத்திரைச் சூழலின் மூலப் படிமத்தைத் தக்கவைக்கிறது; அரிதான சமயக் குழுமச் சொற்கள் தவிர்க்கப்பட்டன.
