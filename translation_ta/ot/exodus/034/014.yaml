source:
  edition: WLC
  text: כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְ/אֵ֣ל אַחֵ֑ר כִּ֤י יְהוָה֙ קַנָּ֣א שְׁמ֔/וֹ אֵ֥ל קַנָּ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: ta
  text: ஏனெனில், நீ வேறொரு தெய்வத்தின் முன் பணிந்து வணங்கக் கூடாது[a]. ஏனெனில், யாவே—“பொறாமையுள்ளவர்” என்பது அவருடைய பெயர்[b]—பொறாமையுள்ள கடவுள் ஆவார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வேறொரு தெய்வத்தை வழிபடக் கூடாது.” எபிரெய வினை சொற்படியாகப் பணிந்து குனிவதைக் குறிக்கிறது; அது பெரும்பாலும் வழிபாட்டுச் செயலாக அமைகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெய மொழியில் சொற்படியாக: “யாவே—பொறாமையுள்ளவர் என்பது அவருடைய பெயர்—அவர் பொறாமையுள்ள கடவுள்.”'
    reason: lexical_alternative
  - marker: c
    text: இங்கு “பொறாமை” என்பது பாவமான அழுக்காறைக் குறிக்கவில்லை; தமது மக்களின் வழிபாடு தமக்கு மட்டுமே உரியது என்ற யாவேயின் உடன்படிக்கை உரிமையையும், போட்டியான வழிபாட்டை அவர் ஏற்காததையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: பணிந்து வணங்கக் கூடாது
  rationale: இந்த எபிரெய வினை நேரடியாகக் குனிந்து அல்லது தரையில் விழுந்து பணிவதைக் குறிக்கிறது; இச்சூழலில் அது வழிபாட்டுச் செயலாக இருப்பதால், ‘பணிந்து வணங்க’ என்பது உடல் செயலும் வழிபாட்டு நோக்கமும் இரண்டையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לְאֵל אַחֵר
  choice: வேறொரு தெய்வத்தின் முன்
  rationale: אֵל என்பது ‘தெய்வம்/கடவுள்’ என்றும் אַחֵר என்பது ‘வேறொரு’ என்றும் பொருள்படும். பணிந்து வணங்குதல் என்ற வினையுடன் தமிழில் ‘முன்’ இயல்பாக அமைகிறது; ‘அந்நிய தெய்வம்’ என்று மொழிபெயர்ப்பது மூலத்தில் இல்லாத வெளிநாட்டுத் தன்மையை வலியுறுத்தக்கூடும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பொதுவாக அறியத்தக்க ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: קַנָּא
  choice: பொறாமையுள்ளவர் / பொறாமையுள்ள
  rationale: இச்சொல் போட்டியான வழிபாட்டை ஏற்காத யாவேயின் தனிப்பட்ட உடன்படிக்கை உரிமையைக் குறிக்கிறது. பெயராக வரும் இடத்தில் ‘பொறாமையுள்ளவர்’ என்றும் பண்பாக வரும் இடத்தில் ‘பொறாமையுள்ள’ என்றும் வழங்குவது மூலத்தின் சொல் மீளுரைப்பைத் தக்கவைக்கிறது.
- source_word: שְׁמוֹ
  choice: என்பது அவரது பெயர்
  rationale: ‘பொறாமையுள்ளவர்’ என்பது யாவேயின் பெயர் அல்லது அடையாளப் பெயராகக் கூறப்படுவதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֵל קַנָּא הוּא
  choice: பொறாமையுள்ள கடவுள்
  rationale: முன்பு கூறப்பட்ட பெயரை விளக்கும் மூலத்தின் பயனிலை அமைப்பையும் அதன் வலியுறுத்தலையும் சுருக்கமான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட தனிப்பட்ட தெய்வீகப் பெயரையே பயன்படுத்துகிறது; ஆகவே அதனை ஒலிபெயர்த்து வழங்குகிறது.
- issue: קַנָּא என்பதைத் தெய்வீகப் பெயராகவும் பண்பாகவும் வழங்குதல்
  choice: பொறாமையுள்ளவர் / பொறாமையுள்ள
  alternative: வைராக்கியமுள்ளவர் / தீவிர பற்றுள்ளவர்
  rationale: ஒரே எபிரெயச் சொல் பெயராகவும் பண்பாகவும் மீண்டும் வருவதைக் காக்கிறது. எதிர் தெய்வ வழிபாட்டை ஏற்காத உடன்படிக்கை சார்ந்த தனியுரிமை கோரிக்கையே இங்கு கருத்து; அதை மென்மையாக்கி வேறு பண்பாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டரீதியான தடையை ‘கூடாது’ எனவும், வழிபாட்டின் உடல் செயலை ‘பணிந்து வணங்க’ எனவும் வழங்கப்பட்டுள்ளது. நடை கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமானது; ‘யாவே’ என்ற தனிப்பெயரும் மூலத்தின் வலுவான ‘பொறாமை’ உருவகமும் விளக்கக் குறிப்புகளுடன் தக்கவைக்கப்பட்டுள்ளன.
