  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: ta
  text: யாவே மேகத்தில் இறங்கி, அங்கே மோசேயுடன் நின்று, யாவேயின் பெயரை அறிவித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் பெயரைக் கூவி அழைத்தார்”; அல்லது, “யாவேயின் பெயரால் அறிவித்தார்.” எபிரெயச் சொற்றொடரில் “பெயர்” என்பதற்கு முன் “இல்/ஆல்” என்ற பொருள் தரும் ஒரு முன்னொட்டு உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: וַיֵּרֶד
  choice: இறங்கி
  rationale: ירד என்பதன் கீழ்நோக்கிய இயக்கத்தை இயல்பான நவீன தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: בֶּעָנָן
  choice: மேகத்தில்
  rationale: ב முன்னொட்டின் இடப்பொருளையும், தேவப்பிரசன்னத்துடன் தொடர்புடைய மேகத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַיִּתְיַצֵּב
  choice: நின்று
  rationale: יצב என்பதன் ஹித்பயேல் வடிவம் ‘தன் இடத்தில் நிற்றல்/நிலைபெறுதல்’ என்ற கருத்தைக் கொண்டது; இச்சூழலில் ‘நின்று’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: עִמּוֹ
  choice: மோசேயுடன்
  rationale: சொல்லுக்கு நேராக ‘அவனுடன்’ என்று பொருள்; தமிழில் பிரதிப்பெயர் குழப்பத்தைத் தவிர்க்க, சூழலில் தெளிவான அதன் குறிப்பு நபரான மோசே பெயரால் குறிப்பிடப்பட்டுள்ளார்.
- source_word: שָׁם
  choice: அங்கே
  rationale: செயல் நிகழ்ந்த இடத்தைச் சுட்டும் எபிரெய வினையடையின் காட்சியமைப்பைத் தக்கவைக்கிறது.
- source_word: וַיִּקְרָא
  choice: அறிவித்தார்
  rationale: קרא பொதுவாக ‘அழைத்தல்’ என்றும் பொருள்படும்; ஆனால் அடுத்த வசனத்தில் வரும் அறிவிப்பைக் கருத்தில் கொண்டால், இங்கு வெளிப்படையாகப் பிரகடனம் செய்தல் என்ற பொருளை ‘அறிவித்தார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְשֵׁם יְהוָה
  choice: யாவேயின் பெயரை
  rationale: ‘பெயரில்/பெயரால்’ எனும் முன்னிடைச்சொல் அமைப்பு மூலத்தில் இருந்தாலும், ‘அறிவித்தார்’ என்பதுடன் தமிழில் இயல்பாக ‘யாவேயின் பெயரை அறிவித்தார்’ என அமைகிறது; மூல அமைப்பின் பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா அல்லது ‘ஆண்டவர்’
  rationale: மூலவசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தனிப்பட்ட பெயராக ஒலிபெயர்க்கிறது.
- issue: וַיִּקְרָא என்பதன் எழுவாயும் பொருளும்
  choice: யாவே எழுவாய்; ‘அறிவித்தார்’
  alternative: மோசே எழுவாய்; ‘அழைத்தார்’
  rationale: தொடர்ச்சியான எபிரெய வினை அமைப்பில் யாவே இயல்பாகவே எழுவாயாகத் தொடர்கிறார்; அடுத்த வசனத்தில் அறிவிப்பின் உள்ளடக்கம் வருவதும் ‘அறிவித்தார்’ என்ற பொருளுக்கு ஆதரவாக உள்ளது. ஆயினும் בְשֵׁם அமைப்பின் உண்மையான சொற்பொருள் சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் சுருக்கமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைக் குறிக்கும் வினைக்கு மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; பிரதிப்பெயர் குழப்பத்தைத் தவிர்க்க עִמּוֹ என்பதன் சூழல் குறிப்பு ‘மோசேயுடன்’ என வெளிப்படுத்தப்பட்டுள்ளது.
