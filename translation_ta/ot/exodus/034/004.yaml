base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: ta
  text: மோசே முதல் கற்பலகைகளைப் போன்ற இரண்டு கற்பலகைகளை வெட்டி உருவாக்கினார்[a]. அவர் அதிகாலையில் எழுந்து, யாவே தமக்குக் கட்டளையிட்டபடியே சீனாய் மலைக்கு ஏறிச் சென்றார். அவர் அந்த இரண்டு கற்பலகைகளையும் தமது கையில் எடுத்துக்கொண்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செதுக்கினார்’ அல்லது ‘வெட்டினார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் ‘தமது கையில்’ என்று ஒருமையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: வெட்டி உருவாக்கினார்
  rationale: פסל என்பது இச்சூழலில் கல்லை வெட்டிச் சரியான வடிவமுள்ள பலகைகளாக உருவாக்குவதைக் குறிக்கிறது. ‘வெட்டி உருவாக்கினார்’ என்பது கல்வெட்டு பொறித்தார் என்ற தவறான எண்ணத்தைத் தவிர்த்து செயலைத் தெளிவாகச் சொல்கிறது.
- source_word: לֻחֹת אֲבָנִים
  choice: கற்பலகைகள்
  rationale: உடன்படிக்கையின் கல்லாலான பலகைகளை இயல்பாகவும் சுருக்கமாகவும் குறிக்கும் நவீனத் தமிழ்ச் சொல்.
- source_word: כָּרִאשֹׁנִים
  choice: முந்தினவற்றைப் போன்ற
  rationale: முன்னிருந்த முதல் பலகைகளோடு ஒற்றுமை இருப்பதை ஒப்புமை வடிவில் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: அதிகாலையில் எழுந்து
  rationale: எபிரேய மரபுத்தொடரின் ‘காலையில் சீக்கிரம் எழுதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: சீனாய் மலையில் ஏறினார்
  rationale: עלה என்பதிலுள்ள மேல்நோக்கிய இயக்கத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரேய இறைப்பெயரான நான்கு எழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: யாவே தமக்குக் கட்டளையிட்டபடியே
  rationale: முன்பு கொடுக்கப்பட்ட கட்டளைக்கு மோசே சரியாக இணங்கிச் செய்தார் என்ற correspondence-ஐ ‘படியே’ பாதுகாக்கிறது.
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: தமது கையில் எடுத்துக்கொண்டார்
  rationale: எபிரேய மூலத்தின் ஒருமையான ‘அவருடைய கையில்’ என்பதைக் காக்கிறது; தமிழிலும் இது இயல்பான பொதுப்பயன்பாடாக இருக்க முடியும்.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: அந்த இரண்டு கற்பலகைகளையும்
  rationale: முன்னரே குறிப்பிடப்பட்ட அதே மாற்றுப் பலகைகளே மீண்டும் சுட்டப்படுகின்றன என்பதை ‘அந்த’ தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடியதாயினும் கண்ணியமான வேதாகமக் கதைநடை. தொடர்ச்சியான எபிரேய வாக்கியங்களை வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரித்துள்ளது; பொருள் உறவுகள் பாதுகாக்கப்பட்டுள்ளன.
