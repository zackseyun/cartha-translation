  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: ta
  text: “புளிப்பில்லாத அப்பப் பண்டிகையை[a] அனுசரி. நான் உனக்குக் கட்டளையிட்டபடி, ஆபிப் மாதத்திற்குரிய குறிக்கப்பட்ட காலத்தில்[b] ஏழு நாட்கள் புளிப்பில்லாத அப்பத்தைச் சாப்பிடு; ஏனெனில் ஆபிப் மாதத்தில்தான் நீ எகிப்திலிருந்து வெளியேறினாய்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புளிப்பில்லாத அப்பத் திருவிழா’ என்றும் மொழிபெயர்க்கலாம். எபிரெய חַג என்பது குறிப்பாக ஒரு புனிதப் பண்டிகை அல்லது விழாவைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஆபிப்’ என்பது எகிப்திலிருந்து வெளியேறலுடன் தொடர்புடைய இளவேனிற்கால மாதத்தின் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: புளிப்பில்லாத அப்பப் பண்டிகை
  rationale: חַג என்பது இங்கு இறைவனால் குறிக்கப்பட்ட புனிதப் பண்டிகையைக் குறிக்கிறது; מַצּוֹת என்பது புளிக்கவைக்கப்படாத அப்பத்தைக் குறிக்கிறது. தலைப்புத் தன்மையும் சாதாரண வாசகருக்கான தெளிவும் இவ்வாறு காக்கப்படுகின்றன.
- source_word: תִּשְׁמֹר
  choice: அனுசரி
  rationale: שׁמר என்பதன் அடிப்படைப் பொருள் ‘காத்தல்’ என்றாலும், கட்டளையிடப்பட்ட பண்டிகையை முறையாகக் கடைப்பிடித்தல் என்பதே இச்சூழலின் பொருள். ‘அனுசரி’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: ஏழு நாட்கள் புளிப்பில்லாத அப்பத்தைச் சாப்பிடு
  rationale: கால அளவையும் கட்டளையின் நேரடித் தன்மையையும் காக்கிறது. எபிரெயப் பன்மையான מַצּוֹת தமிழில் இயல்பான தொகுப்பொருள் ஒருமையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: நான் உனக்குக் கட்டளையிட்டபடி
  rationale: தொடர்புச் சொல்லை சொற்சொல்லாக மாற்றாமல், பண்டிகையை அனுசரிக்கும் முறை மற்றும் நேரம் முன் கட்டளையிடப்பட்டவை என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְמוֹעֵד
  choice: குறிக்கப்பட்ட காலத்தில்
  rationale: מוֹעֵד என்பது நிர்ணயிக்கப்பட்ட அல்லது நியமிக்கப்பட்ட நேரத்தைக் குறிக்கிறது; இங்கு புனித அனுசரிப்புக்குரிய குறிப்பிட்ட காலம் பொருளாகிறது.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: ஆபிப் மாதத்தில்
  rationale: אָבִיב என்பதை மாதத்திற்கான பழமையான பெயர் அல்லது பருவ அடையாளம் என்ற இரு சாத்தியங்களையும் கருத்தில் கொண்டு, முதன்மை உரையில் பரிச்சயமான வேதாகம ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இந்த இணைப்புச் சொல் கட்டளைக்கான வரலாற்றுக் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: நீ எகிப்திலிருந்து வெளியேறினாய்
  rationale: יצא என்பதன் வெளியே செல்லுதல் என்ற பொருளையும், எகிப்திலிருந்து விடுபட்ட வரலாற்று நிகழ்வையும் மேலதிக விளக்கம் சேர்க்காமல் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைப் பண்டிகைக்கான பெயரிடல்
  choice: ‘புளிப்பில்லாத அப்பப் பண்டிகை’ என்ற அதிகாரபூர்வத் தலைப்புத் தன்மையுள்ள வடிவம்
  alternative: ‘புளிப்பில்லாத அப்பத் திருவிழா’
  rationale: இது இறைவன் கட்டளையிட்ட புனித அனுசரிப்பு என்பதைத் தெரிவிக்கிறது; அதேவேளை பிற்கால சமய மரபுகளின் தனிப்பட்ட சொற்களைத் திணிக்கவில்லை.
- issue: இரண்டாம் நபர் ஆண்பால் ஒருமை
  choice: ‘உனக்கு’, ‘நீ’ என்ற ஒருமையைத் தக்கவைத்தல்
  alternative: ‘உங்களுக்கு’, ‘நீங்கள்’ என்று பன்மையாக்குதல் அல்லது ‘இஸ்ரவேல்’ என்று வெளிப்படுத்துதல்
  rationale: எபிரெய உரை இஸ்ரவேலைக் கூட்டாக நோக்கி ஒருமையில் பேசுகிறது. தமிழிலும் அந்த மூலவடிவத்தைத் தக்கவைத்து, உரையில் இல்லாத பெயரையோ பன்மையையோ சேர்க்காமல் விடப்பட்டுள்ளது.
- issue: வெளியேற்ற நிகழ்வின் காரணப்பங்கு
  choice: ‘ஏனெனில்’ மூலம் பண்டிகைக் கட்டளையையும் எகிப்திலிருந்து வெளியேறியதையும் நேரடியாக இணைத்தல்
  alternative: இதனை வெறும் காலக் குறிப்பாக மட்டும் மொழிபெயர்த்தல்
  rationale: כִּי இங்கு காரண விளக்கத்தைத் தருகிறது; இதைத் தக்கவைத்தல் வசனத்தின் மீட்பு-நினைவு சார்ந்த அழுத்தத்தைப் பாதுகாக்கிறது, ஆனால் கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் நேரடியான கட்டளை நடையும் கண்ணியமான வேதாகம நடையும் இணைக்கப்பட்டுள்ளன. பாரம்பரியமாக அறியப்படும் ‘ஆபிப்’ மற்றும் ‘அப்பம்’ ஆகிய சொற்கள் வைக்கப்பட்டுள்ளன; அரிதான சொல்லுக்கு அடிக்குறிப்பு தரப்பட்டுள்ளது. மூலத்தின் ஒருமை முகவரியும் காரணத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
