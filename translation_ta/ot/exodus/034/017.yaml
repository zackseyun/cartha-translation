  text: உனக்காக வார்க்கப்பட்ட உலோகத் தெய்வங்களைச் செய்யாதே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உருக்கி வார்க்கப்பட்ட தெய்வங்களை’ அல்லது ‘வார்ப்பு உலோகத் தெய்வங்களை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: தெய்வங்களை
  rationale: விக்கிரகங்களைத் தடைசெய்யும் இச்சூழலில் אֱלֹהִים என்பதன் பன்மைக் கட்டுநிலை வடிவம் குறிப்பிட்ட வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; எனவே இயல்பான தமிழில் ‘தெய்வங்களை’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: מַסֵּכָה
  choice: வார்க்கப்பட்ட உலோக
  rationale: உருக்கிய உலோகத்தை வார்த்து உருவாக்கிய பொருள் அல்லது சிலை என்ற செய்முறை மற்றும் பொருள் சார்ந்த நுணுக்கத்தை இது வெளிப்படுத்துகிறது. எபிரேயத்தில் தனியே இல்லாத ‘சிலை’ என்ற சொல்லை முதன்மை உரையில் சேர்க்காமல், אֱלֹהֵי உடன் இணைத்து ‘வார்க்கப்பட்ட உலோகத் தெய்வங்கள்’ என வழங்கப்பட்டது.
- source_word: לֹא תַעֲשֶׂה
  choice: செய்துகொள்ளாதே
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை வினைவடிவம் சட்டத் தடையாக இருப்பதால், நவீன தமிழில் நேரடியான ஒருமைத் தடை கட்டளையாக வழங்கப்பட்டது.
- source_word: לָּךְ
  choice: உனக்காக
  rationale: தனக்கென அல்லது தன்நலன் கருதி உருவாக்குவதைக் குறிக்கும் முன்னிடைச்சொல் மற்றும் ஒருமைச் சுட்டுப்பெயர் பின்னொட்டின் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தடைசெய்யப்படும் பொருளின் இயல்பு
  choice: வார்க்கப்பட்ட உலோகத் தெய்வங்களை உருவாக்குவதை வசனம் தடைசெய்கிறது.
  alternative: உருக்கி வார்த்த சிலைகளை உனக்காகச் செய்யாதே.
  rationale: எபிரேயச் சொற்றொடர் ‘தெய்வங்கள்’ என்பதையும் உருக்கி வார்க்கப்பட்ட பொருள் அல்லது உருவம் என்பதையும் இணைக்கிறது. ‘வார்க்கப்பட்ட உலோகத் தெய்வங்கள்’ என்ற மொழிபெயர்ப்பு இரண்டையும் தக்கவைத்து, இதற்கு அப்பாற்பட்ட எந்த இறையியல் முடிவையும் உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமைத் தடை கட்டளையின் நேரடித் தன்மையையும் சட்ட உரையின் கண்ணியத்தையும் காக்கும் நடை. ‘வார்க்கப்பட்ட உலோக’ என்பது உலோகத்தை உருக்கி அச்சில் வார்க்கும் செய்முறையைத் தெளிவாகக் காட்டுகிறது; ‘சிலை’ என்பதை முதன்மை உரையில் விளக்கமாகச் சேர்க்கவில்லை.
