  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּכְרֹ֤ת בְּרִית֙ לְ/יוֹשֵׁ֣ב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתָּ֖ה בָּ֣א עָלֶ֑י/הָ פֶּן יִהְיֶ֥ה לְ/מוֹקֵ֖שׁ בְּ/קִרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: ta
  text: நீ நுழையப்போகும் நாட்டில் வாழும் மக்களோடு உடன்படிக்கை செய்யாதபடி உன்னைக் காத்துக்கொள்[a]; இல்லையெனில், அது உன் நடுவில் ஒரு கண்ணியாகிவிடும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கவனமாயிரு” அல்லது “எச்சரிக்கையாயிரு.”
    reason: lexical_alternative
  - marker: b
    text: “கண்ணி” என்பதற்கு “பொறி” என்றும் மொழிபெயர்க்கலாம். எபிரேயத்தில் இறுதி வினையின் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; அருகிலுள்ள “உடன்படிக்கை” என்பதே கண்ணியாகும் என்று இங்கு புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: lexical_and_ambiguity_note
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: உன்னைக் குறித்து எச்சரிக்கையாயிரு
  rationale: நிபால் கட்டளை வடிவமும் לְךָ தரும் தற்சுட்டு எச்சரிக்கை நுணுக்கமும் காக்கப்படுகின்றன; இச்சொற்றொடர் உயரியதாயிருந்தும் நவீனத் தமிழில் புரியக்கூடியது.
- source_word: פֶּן ... פֶּן
  choice: செய்யாதபடி ... இல்லையெனில்
  rationale: முதல் פֶּן முன்னெச்சரிக்கையின் நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; இரண்டாவது அதன் அபாயகரமான விளைவைத் தெளிவாக்குகிறது. எபிரேயத்தில் மீண்டும் வரும் எச்சரிக்கை அமைப்பு பொருளளவில் காக்கப்படுகிறது.
- source_word: תִּכְרֹת בְּרִית
  choice: உடன்படிக்கை செய்
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் ‘உடன்படிக்கையை வெட்டு’ என்று வரும்; ஆனால் இது ‘உடன்படிக்கை செய்’ என்று பொருள்படும் எபிரேய மரபுத்தொடர். இயல்பான தமிழ் தெரிவு செய்யப்பட்டது.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: நாட்டில் குடியிருப்பவர்கள்
  rationale: ஒருமை வினையெச்சம் இங்கு கூட்டுப் பொருளில் வருகிறது; தமிழ் பன்மை அந்த மக்களைக் கூட்டாகத் தெளிவாகக் குறிக்கிறது.
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: நீ நுழையப்போகிற நாடு
  rationale: בוא + על குறிக்கும் அந்த நாட்டை நோக்கிய இயக்கம், சூழலில் அந்நாட்டுக்குள் நுழைவதாக இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: יִהְיֶה לְמוֹקֵשׁ
  choice: ஒரு கண்ணியாகிவிடும்
  rationale: יִהְיֶה இங்கு நிலைமாற்றத்தைச் சுட்டுவதால் ‘ஆகிவிடும்’ பொருத்தமானது; מוֹקֵשׁ என்பதன் பொறி அல்லது சிக்கவைக்கும் அபாயம் என்ற உருவகம் ‘கண்ணி’ என்பதில் காக்கப்படுகிறது.
- source_word: בְּקִרְבֶּךָ
  choice: உங்களிடையே
  rationale: எபிரேய ஒருமை ‘நீ’ இஸ்ரவேல் சமூகத்தை மொத்தமாக நோக்குகிறது; இறுதி சொற்றொடரில் சமூகத்தின் நடுவில் ஏற்படும் அபாயத்தை இயல்பான தமிழில் ‘உங்களிடையே’ எனத் தருகிறது.
theological_decisions:
- issue: இறுதி ஒருமை வினையின் குறிப்பு
  choice: செய்யப்படும் உடன்படிக்கையே கண்ணியாகிவிடும்
  alternative: நாட்டின் குடியிருப்பவர்களே கண்ணியாவார்கள்; அல்லது முழுச் சூழ்நிலையே கண்ணியாகும்
  rationale: அருகிலுள்ள பொருத்தமான முன்னிலைச் சொல் ‘உடன்படிக்கை’; ஒருமை வினையும் இதனுடன் இயல்பாகப் பொருந்துகிறது. ஆயினும் எபிரேய வாக்கியத்தில் எழுவாய் வெளிப்படையாக மீண்டும் சொல்லப்படாததால் மாற்றுப் புரிதலுக்குச் சிறு இடம் உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கட்டளையின் தீவிரத்தையும் உடன்படிக்கை–கண்ணி உருவகத்தையும் காக்கும் கண்ணியமான நடை. ஒருமையில் நேரடியாக உரைக்கப்படும் இஸ்ரவேலுக்கான எச்சரிக்கையையும் அதன் சமூகப் பரப்பையும் தமிழில் இயன்றவரை இயல்பாக வெளிப்படுத்துகிறது.
