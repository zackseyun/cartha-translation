  text: וַ/יְהִ֗י בְּ/רֶ֤דֶת מֹשֶׁה֙ מֵ/הַ֣ר סִינַ֔י וּ/שְׁנֵ֨י לֻחֹ֤ת הָֽ/עֵדֻת֙ בְּ/יַד מֹשֶׁ֔ה בְּ/רִדְתּ֖/וֹ מִן הָ/הָ֑ר וּ/מֹשֶׁ֣ה לֹֽא יָדַ֗ע כִּ֥י קָרַ֛ן ע֥וֹר פָּנָ֖י/ו בְּ/דַבְּר֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: ta
  text: மோசே சீனாய் மலையிலிருந்து இறங்கி வந்தபோது, சாட்சிப் பலகைகள் இரண்டும் மோசேயின் கையில் இருந்தன; மலையிலிருந்து இறங்கி வந்த மோசே, அவருடன்[a] பேசியதால்[b] தன் முகத்தோல் ஒளிவீசியதை[c] அறியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, கர்த்தருடன்.
    reason: alternative_reading
  - marker: b
    text: ‘அவருடன் பேசியபோது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘ஒளிக்கதிர்களை வீசியது’ அல்லது ‘பிரகாசித்தது’ என்றும் மொழிபெயர்க்கலாம். ‘கொம்புடையதாக இருந்தது’ என்பது வரலாற்றில் காணப்படும் மாற்று மொழிபெயர்ப்பு; ஆனால் அது இச்சூழலுக்கு அவ்வளவாகப் பொருந்தாது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: வெளிப்படையான தனிச் சொல்லாக மொழிபெயர்க்காமல், நிகழ்வின் தொடக்க வாக்கிய அமைப்பில் எடுத்துரைக்கப்பட்டது
  rationale: இது எபிரெயக் கதைநடையின் வழக்கமான நிகழ்வுத் தொடர் குறியீடு. தமிழில் ‘அது நடந்ததாவது’ என நேரடியாகச் சேர்ப்பது இயல்பற்றதாக இருக்கும்; காலத் துணைவாக்கியத்தால் அதன் கதைநடைப் பணி வெளிப்படுகிறது.
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: இறங்கி வந்தபோது ... மலையிலிருந்து இறங்கி வந்த
  rationale: இரு காலவினையெச்ச அமைப்புகளும் மோசே மலையிலிருந்து இறங்கிய சூழலைக் குறிக்கின்றன. மூலத்தின் மீளுரைப்பை முற்றிலும் நீக்காமல், இயல்பான தமிழில் தக்கவைக்கப்பட்டது.
- source_word: מֵהַר סִינַי
  choice: சீனாய் மலையிலிருந்து
  rationale: இடப்பெயரையும் மலையிலிருந்து கீழிறங்கும் இயக்கத்தையும் இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: சாட்சியின் இரண்டு பலகைகள்
  rationale: לֻחֹת என்பது எழுதுவதற்கான பலகைகளையும், עֵדוּת இவ்வுடன்படிக்கைச் சூழலில் ‘சாட்சி’ என்பதையும் குறிக்கிறது. மூலத்தில் இல்லாத ‘கல்’ என்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: בְּיַד מֹשֶׁה
  choice: அவன் கையில்
  rationale: எபிரெயத்தின் ஒருமை ‘கையில்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; தமிழில் பெயரை மீண்டும் கூறுவதைவிட ‘அவன்’ இயல்பாக உள்ளது.
- source_word: לֹא יָדַע
  choice: தெரியவில்லை
  rationale: மோசே தன் முகத்தில் ஏற்பட்ட மாற்றத்தை உணராதிருந்ததை எளிய, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: קָרַן
  choice: ஒளிவீசியது
  rationale: இச்சூழலில் வினைச்சொல் ஒளிக்கதிர்களை வெளிப்படுத்துதல் அல்லது பிரகாசித்தலைக் குறிக்கிறது. ‘ஒளிவீசியது’ தெளிவாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: עוֹר פָּנָיו
  choice: தன் முகத்தோல்
  rationale: மூலம் வெறுமனே ‘முகம்’ என்று அல்லாமல் ‘அவனுடைய முகத்தின் தோல்’ என்று கூறுவதால், அந்தக் குறிப்பிட்ட உடல் உருவகம் தக்கவைக்கப்பட்டது.
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: அவருடன் பேசியதால்
  rationale: בְּ + வினைபெயர் அமைப்பு இங்கு காரணமாகவும் காலமாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரையில் காரணப் பொருள் தேர்ந்தெடுக்கப்பட்டு, காலப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: אִתּוֹ
  choice: அவருடன்
  rationale: மூலம் பெயரை வெளிப்படையாகச் சொல்லாமல் சுட்டுப்பெயரைப் பயன்படுத்துகிறது. தமிழிலும் சுட்டுப்பெயர் தக்கவைக்கப்பட்டு, அதன் சூழல்சார் குறிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: மோசேயின் முகத்தைப் பற்றிய קָרַן என்பதன் பொருள்
  choice: ஒளிவீசியது
  alternative: கொம்புகள் முளைத்திருந்தது / கொம்புடையதாக இருந்தது
  rationale: அடுத்த வசனங்களின் ஒளிமகிமைச் சூழலும் மக்களின் எதிர்வினையும் ஒளிவீசுதலை ஆதரிக்கின்றன. ‘கொம்புடையது’ என்பது வரலாற்றில் காணப்படும் மாற்று மொழிபெயர்ப்பு; இச்சூழலுக்கு அது குறைவாகப் பொருந்துகிறது.
- issue: אִתּוֹ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘அவருடன்’ என்ற சுட்டுப்பெயரைத் தக்கவைத்தல்
  alternative: ‘கர்த்தருடன்’ அல்லது ‘கடவுளுடன்’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: முந்தைய சூழலின்படி குறிக்கப்படுபவர் கர்த்தர் என்பது தெளிவு; இருப்பினும் எபிரெய உரை சுட்டுப்பெயரையே பயன்படுத்துவதால் முதன்மை உரையும் அதைப் பாதுகாக்கிறது.
- issue: בְּדַבְּרוֹ என்பதன் காரண அல்லது கால உறவு
  choice: ‘பேசியதால்’ என்ற காரணப் பொருள்
  alternative: ‘பேசியபோது’ என்ற காலப் பொருள்
  rationale: மோசேயின் முகம் ஒளிவீசியதற்கும் இறைச்சந்திப்பிற்கும் இடையிலான தொடர்பை காரணப் பொருள் இயல்பாகக் காட்டுகிறது; ஆயினும் எபிரெய இலக்கணம் காலப் பொருளையும் அனுமதிப்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. ‘முகத்தோல்’ போன்ற மூலத்தின் குறிப்பான சொல்லாட்சி தக்கவைக்கப்பட்டுள்ளது; மீளுரைத்த கால அமைப்பு தமிழின் வாசிப்போட்டத்துக்கேற்றவாறு சற்றே மறுசீரமைக்கப்பட்டுள்ளது. ‘அவர்’ என்பது இறைவனைக் குறிக்கும் மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளது.
