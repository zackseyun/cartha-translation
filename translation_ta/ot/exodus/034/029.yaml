- from: மோசே சீனாய் மலையிலிருந்து இறங்கி வந்தபோது, சாட்சியின் இரண்டு பலகைகளும் அவன் கையில் இருந்தன. அவருடன்[a] பேசியதால்[b] தன் முகத்தோல் ஒளிவீசியது[c], மலையிலிருந்து இறங்கி வந்த மோசேக்குத் தெரியவில்லை.
  to: மோசே சீனாய் மலையிலிருந்து இறங்கி வந்தபோது, சாட்சிப் பலகைகள் இரண்டும் மோசேயின் கையில் இருந்தன; மலையிலிருந்து இறங்கி வந்த மோசே, அவருடன்[a] பேசியதால்[b] தன் முகத்தோல் ஒளிவீசியதை[c] அறியவில்லை.
  rationale: மூலத்தின் காலச்சூழல் மற்றும் இறக்குதல் பற்றிய மீளுரைப்பை ஒரே வாக்கியத்தில் தெளிவாக இணைத்தேன். மோசே அறியாதது அவரது முகத்தோல் ஒளிவீசியதே என்பதை ‘ஒளிவீசியதை அறியவில்லை’ என்ற தமிழின் இயல்பான அமைப்பில் வெளிப்படுத்தினேன். காரணப் பொருளும் காலப் பொருளும் இடையிலான மூலத்தின் சாத்தியமான இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; அִתּוֹ என்பதன் சுட்டுப்பெயரும் முதன்மை உரையில் தக்கவைக்கப்பட்டுள்ளது.
