  source_fidelity: 'முக்கிய சொற்களும் பொருளும் பெரும்பாலும் சரியாக உள்ளன: மோசேயின் இறக்கம், சாட்சிப் பலகைகள், முகத்தோல் ஒளிவீசுதல், மற்றும் அִתּוֹ என்பதன் கர்த்தரைக் குறிக்கும் சூழல்சார் சுட்டுதல் ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் வரைவில் பலகைகள் பற்றிய தகவல் தனி வாக்கியமாகப் பிரிக்கப்பட்டிருப்பதால், மூலத்தில் உள்ள ஒரே நிகழ்வுக் கட்டமைப்பும் ‘மோசே ... இறங்கியபோது’ என்ற தொடர்பும் தளர்கின்றன. திருத்தம் அவற்றை ஒரே வாக்கியத்தில் மீட்டமைக்கிறது.'
  naturalness: ‘மோசேக்குத் தெரியவில்லை’ என்பதை வாக்கியத்தின் இறுதியில் வைப்பது இயல்பானது. இருப்பினும், ‘அவருடன் பேசியதால் தன் முகத்தோல் ஒளிவீசியது’ என்ற பகுதியின் செய்பவரும் ‘தன்’ என்பதன் முன்னிலையும் இறுதியில் மட்டுமே வரும் அமைப்பு வாசிப்பில் சிறிது தடுமாற்றம் தருகிறது. ‘மோசே ... தன் முகத்தோல் ஒளிவீசியதை அறியவில்லை’ என்ற மறுசீரமைப்பு நவீன பொதுத்தமிழில் தெளிவாகவும் மூலத்தின் வலியுறுத்தலுக்கு நெருக்கமாகவும் உள்ளது.
  terminology: ‘சாட்சிப் பலகைகள்’ என்பது שְׁנֵי לֻחֹת הָעֵדֻת என்பதற்கு இயல்பான, சுருக்கமான தமிழ்ச் சேர்மம்; ‘கல்’ என மூலத்தில் வெளிப்படையாக இல்லாத சொல்லைச் சேர்ப்பதில்லை. ‘முகத்தோல்’ עוֹר פָּנָיו என்பதன் குறிப்பைத் தக்கவைக்கிறது. ‘ஒளிவீசியது’ קָרַן என்பதற்கு சூழலோடு பொருந்தும் மொழிபெயர்ப்பு. ‘கர்த்தர்’ என்பது அடிக்குறிப்பில் மட்டுமே, சுட்டுப்பெயரின் குறிப்பு விளக்கமாக உள்ளது.
