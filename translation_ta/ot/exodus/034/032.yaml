  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: ta
  text: அதற்குப் பிறகு இஸ்ரவேலின் மகன்கள் அனைவரும் அருகே வந்தார்கள்[a]. சீனாய் மலையில் யாவே மோசேயுடன் பேசிய அனைத்தையும் மோசே அவர்களுக்குக் கட்டளையிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘இஸ்ரவேலின் மகன்கள்’; இது இஸ்ரவேல் மக்களைக் குறிக்கும் தேசியச் சொல்லாட்சி. இதை ‘இஸ்ரவேலர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: அதற்குப் பிறகு
  rationale: முந்தைய நிகழ்வைத் தொடர்ந்து நடந்ததை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: נִגְּשׁוּ
  choice: அருகே வந்தார்கள்
  rationale: נגשׁ என்பதன் நிபால் வடிவம் குறிக்கும் நேரடியான அணுகுதலைப் பாதுகாக்கிறது.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள் அனைவரும்
  rationale: தேசியக் குழுவைக் குறிக்கும் எபிரெய ஆண்பால் பன்மைத் தொடரை முறையாகப் பாதுகாக்கிறது; தமிழில் புரிந்துகொள்ளக்கூடியதாகவும் உள்ளது.
- source_word: וַיְצַוֵּם
  choice: மோசே அவர்களுக்குக் கட்டளையிட்டார்
  rationale: צוה என்பதன் கட்டளையிடும் வலிமையைப் பாதுகாக்கிறது. எபிரெயத்தில் மறைமுகமாக உள்ள எழுவாயைத் தமிழின் தெளிவுக்காக ‘மோசே’ என்று வெளிப்படுத்துகிறது.
- source_word: אֵת כָּל אֲשֶׁר
  choice: அனைத்தையும்
  rationale: தொடர்ந்து வரும் செய்தியின் முழு உள்ளடக்கத்தையும் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: யெகோவா தன்னுடன் பேசிய
  rationale: אִתּוֹ என்பதிலுள்ள ‘அவனுடன்’ என்ற உரையாடல் நுணுக்கத்தைப் பாதுகாக்கிறது; தமிழில் எழுவாய் குழப்பத்தைத் தவிர்க்க ‘தன்னுடன்’ பயன்படுத்தப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் தருகிறது.
- source_word: בְּהַר סִינָי
  choice: சீனாய் மலையில்
  rationale: இடத்தைக் குறிப்பாகவும் இயல்பான தமிழ் வழக்கிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது. ‘யாவே’ என்பது சாத்தியமான ஒலிபெயர்ப்பு; ‘யெகோவா’ தமிழ்வாசகர்களிடையே அதிகம் அறியப்பட்ட வடிவம்.
- issue: בְּנֵי יִשְׂרָאֵל என்ற தேசியச் சொல்லாட்சி
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தைப் பாதுகாக்கிறது; அதேவேளையில் இது இஸ்ரவேல் மக்களைக் குறிக்கும் மரபான தேசியச் சொல்லாட்சி என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சொற்றொடர் அமைப்பை இயன்றவரைத் தக்கவைத்தபோதும், எழுவாய் தெளிவுக்காக ‘மோசே’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
