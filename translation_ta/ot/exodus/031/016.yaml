    rationale: Markers a, b, and c respectively explain “இஸ்ரவேலின் மகன்கள்,” the idiom concerning observing the Sabbath, and “everlasting covenant.” They must be attached to those corresponding expressions, not all placed at the verse end.
  - severity: low
    issue: The possessive force of לְדֹרֹתָם is not explicit.
    rationale: “தலைமுறை தலைமுறையாக” conveys continuity, but “தங்கள் தலைமுறைகள் தோறும்” also preserves the Hebrew third-person plural possessive suffix.
