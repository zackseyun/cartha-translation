  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள்[a] ஓய்வுநாளைக் கடைப்பிடித்து, தங்கள் தலைமுறைகள் தோறும் ஓய்வுநாளை அனுசரிக்க வேண்டும்[b]; இது என்றென்றும் நிலைக்கும் உடன்படிக்கையாகும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலர்’ அல்லது ‘இஸ்ரவேலின் பிள்ளைகள்.’ எபிரெயத்தில் நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘ஓய்வுநாளைச் செய்ய’; அதாவது, அதைக் கடைப்பிடிக்க அல்லது அனுசரிக்க.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நித்திய உடன்படிக்கை’ அல்லது ‘நிரந்தர உடன்படிக்கை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: கடைப்பிடித்து ... அனுசரிக்க வேண்டும்
  rationale: שׁמר என்பதன் ‘காத்தல், கடைப்பிடித்தல்’ என்ற உடன்படிக்கைச் சூழலிலான வலிமையை ‘வேண்டும்’ தக்கவைக்கிறது; தொடக்க வாவ் இயல்பான தமிழ் வாக்கிய இணைப்பாக வெளிப்படுகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான குடும்ப உறவு மற்றும் ஆண்பால் பன்மை வடிவத்தைப் பாதுகாக்கிறது; இங்கு இது உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: הַשַּׁבָּת
  choice: ஓய்வுநாள்
  rationale: שַׁבָּת குறிக்கும் நிறுவப்பட்ட ஓய்வுநாளுக்கான தெளிவான, வழக்கமான நவீனத் தமிழ்ச் சொல்.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: ஓய்வுநாளை அனுசரிக்க
  rationale: சொல்லுக்குச் சொல் ‘ஓய்வுநாளைச் செய்ய’ என்பது தமிழில் இயல்பற்றது; ‘அனுசரிக்க’ என்பது அந்த எபிரெய மரபுத்தொடரின் பொருளைத் துல்லியமாகக் கொடுக்கிறது.
- source_word: לְדֹרֹתָם
  choice: தலைமுறை தலைமுறையாக
  rationale: அடுத்தடுத்த தலைமுறைகளில் தொடர்வதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: בְּרִית עוֹלָם
  choice: என்றென்றும் நிலைக்கும் உடன்படிக்கை
  rationale: בְּרִית என்பதன் ‘உடன்படிக்கை’ பொருளையும் עוֹלָם என்பதன் நீடித்த கால வலிமையையும் தக்கவைக்கிறது; கால அளவைப் பற்றிய மேலதிக கோட்பாட்டு முடிவைத் திணிக்கவில்லை.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்ற உடன்படிக்கை மக்களின் பெயரீடு
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை குடும்பச் சொல்லைத் தக்கவைக்கிறது; அதேவேளையில் அது மக்களைக் கூட்டாகக் குறிக்கும் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: בְּרִית עוֹלָם என்பதன் காலநீட்சி
  choice: என்றென்றும் நிலைக்கும் உடன்படிக்கை
  alternative: நித்திய உடன்படிக்கை / நிரந்தர உடன்படிக்கை
  rationale: உடன்படிக்கையின் நீடித்த தன்மையை வெளிப்படுத்துகிறது; வசனம் தானாகத் தீர்மானிக்காத பின்னைய இறையியல் கேள்விகளை மொழிபெயர்ப்பில் தீர்க்கவில்லை.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். எபிரெய வாக்கியத்தின் கட்டளையுடனான உடன்படிக்கைத் தொனியும், ‘செய்தல்’ என்ற மரபுத்தொடரின் உண்மைப் பொருளும் இயல்பான தமிழில் சமநிலைப்படுத்தப்பட்டுள்ளன.
