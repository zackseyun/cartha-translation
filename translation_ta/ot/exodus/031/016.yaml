revisions:
- from: ஆகவே இஸ்ரவேலின் மகன்கள் ஓய்வுநாளைக் கடைப்பிடித்து, தலைமுறை தலைமுறையாக ஓய்வுநாளை அனுசரிக்க வேண்டும்; அது என்றென்றும் நிலைக்கும் உடன்படிக்கை.[a][b][c]
  to: இஸ்ரவேலின் மகன்கள்[a] ஓய்வுநாளைக் கடைப்பிடித்து, தங்கள் தலைமுறைகள் தோறும் ஓய்வுநாளை அனுசரிக்க வேண்டும்[b]; இது என்றென்றும் நிலைக்கும் உடன்படிக்கையாகும்[c].
