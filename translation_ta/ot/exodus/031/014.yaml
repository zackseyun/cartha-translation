base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: ta
  text: நீங்கள் ஓய்வுநாளைக் கடைப்பிடிக்க வேண்டும்; ஏனெனில் அது உங்களுக்குப் புனிதமானது. அதன் புனிதத்தைக் குலைக்கிற எவரும் நிச்சயமாகக் கொல்லப்பட வேண்டும். ஏனெனில் அதில் வேலை செய்கிற எவரும் தம் மக்களின் நடுவிலிருந்து அறுத்து நீக்கப்படுவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறுத்து நீக்கப்படுவார்” என்பது எபிரெயச் சட்ட மரபுத்தொடர். இங்கு தண்டனை எந்த முறையில் நிறைவேற்றப்படும் என்பது குறிப்பிடப்படவில்லை.
    reason: மூல மரபுத்தொடரின் தெளிவின்மையைப் பேணுதல்
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: நீங்கள் ... கடைப்பிடிக்க வேண்டும்
  rationale: שׁמר இங்கு ஓய்வுநாளைக் கவனமாக அனுசரிப்பதைக் குறிக்கிறது. ‘கடைப்பிடிக்க வேண்டும்’ என்பது சட்டக் கட்டளையின் வலிமையையும் நவீன தமிழின் இயல்பையும் காக்கிறது.
- source_word: הַשַּׁבָּת
  choice: ஓய்வுநாள்
  rationale: שַׁבָּת குறிக்கும் தனிப்பட்ட புனித நாளுக்கான தெளிவான, வழக்கிலுள்ள தமிழ் சொல்.
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: அது உங்களுக்குப் புனிதமானது
  rationale: קֹדֶשׁ என்பதன் புனிதம் அல்லது புனிதமாகப் பிரித்துவைக்கப்பட்ட தன்மையையும் לָכֶם என்பதன் ‘உங்களுக்கு’ என்ற உறவையும் நேரடியாகப் பேணுகிறது.
- source_word: מְחַלְלֶיהָ
  choice: அதன் புனிதத்தைக் குலைக்கிற எவரும்
  rationale: חלל என்ற வினை இங்கு புனிதமானதைப் பொதுவானதாக நடத்தி அதன் புனிதத்தைக் கெடுப்பதைக் குறிக்கிறது. ‘புனிதத்தைக் குலைக்கிற’ என்பது சாதாரண வாசகருக்குத் தெளிவாகவும் மூலத்தின் சட்டப் பொதுமையைப் பேணுவதாகவும் உள்ளது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: முற்றுவினையுடன் வரும் வினையெச்சத்தின் வலியுறுத்தலை ‘நிச்சயமாக’ காட்டுகிறது; causative passive வடிவத்தை ‘கொல்லப்பட வேண்டும்’ எனக் காக்கிறது.
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: அதில் வேலை செய்கிற எவரும்
  rationale: מְלָאכָה இங்கு செய்யப்படும் வேலை அல்லது தொழிற்செயலைக் குறிக்கிறது. ‘எவரும்’ என்பது כָּל உடைய பொதுவான சட்டப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: וְנִכְרְתָה
  choice: அறுத்து நீக்கப்படுவார்
  rationale: כרת என்ற சட்ட/உடன்படிக்கை மரபுத்தொடரின் ‘cut off’ உருவகத்தை முற்றிலும் பொதுவான ‘அகற்றப்படுவார்’ என்று தட்டையாக்காமல் காக்கிறது.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: எவரும் ... [அவர்]
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து தனியான ‘ஆத்துமா’ பற்றிய கூற்றல்ல; குற்றத்துக்குப் பொறுப்பான நபரைக் குறிக்கிறது. தமிழில் தொடர்புப்பெயர் அமைப்பால் ‘நபர்’ என்பதைத் தனியே சேர்க்காமல் இயல்பாகத் தெரிவிக்க முடிகிறது.
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: தம் மக்களின் நடுவிலிருந்து
  rationale: சமூகத்தின் மத்தியிலிருந்து நீக்கப்படுதல் என்ற இடவுறவைப் பேணுகிறது. ‘தம்’ பாலினத்தைத் தேவையின்றிக் குறிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ என்ற தண்டனை மரபுத்தொடரின் பொருள்
  choice: ‘தம் மக்களின் நடுவிலிருந்து அறுத்து நீக்கப்படுவார்’ என்ற உருவகத்தைப் பேணுதல்
  alternative: ‘சமுதாயத்திலிருந்து வெளியேற்றப்படுவார்’ அல்லது ‘இறைவனின் தீர்ப்பால் அழிக்கப்படுவார்’
  rationale: இந்த வசனம் இத்தண்டனை மனிதர்களால் நிறைவேற்றப்படும் வெளியேற்றமா, மரணமா, அல்லது இறைத் தீர்ப்பா என்பதைத் துல்லியமாக விளக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அதன் முறையைத் தீர்மானிக்காமல் மூலத்தின் சட்ட மற்றும் இறையியல் பதற்றத்தைப் பேணுகிறது.
- issue: சட்டச் சூழலில் נֶפֶשׁ என்பதன் மொழிபெயர்ப்பு
  choice: குற்றம் செய்த நபரைக் குறிக்கும் வகையில் தொடர்புப்பெயர் அமைப்பைப் பயன்படுத்துதல்
  alternative: ‘ஆத்துமா’
  rationale: இங்கு נֶפֶשׁ முழு நபரையே குறிக்கிறது; மனிதனின் பொருளற்ற தனிப்பகுதியைப் பற்றிய பிற்காலக் கோட்பாட்டை உரைக்குள் கொண்டுவரக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சட்டக் கட்டளைக்கு ஏற்ற கண்ணியமான, நேரடியான நடை. ‘ஓய்வுநாள்’, ‘புனிதமானது’ போன்ற பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. பாலினத்தைத் தேவையின்றிக் குறிப்பிடாமல் ‘எவரும்/தம்’ அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
