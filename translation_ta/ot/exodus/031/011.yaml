base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/011.yaml
  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: ta
  text: அபிஷேகத் தைலத்தையும், பரிசுத்த இடத்திற்கான நறுமணத் தூபத்தையும் அவர்கள், நான் உனக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும், செய்ய வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்த இடத்திற்கான நறுமணப் பொருட்களால் செய்யப்பட்ட தூபம்.”
    reason: கְטֹרֶת הַסַּמִּים என்பதன் சொற்சார்ந்த பொருளான நறுமணப் பொருட்களால் ஆன தூபம் என்ற மாற்றுவாசிப்பைத் தருகிறது.
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேகத் தைலம்
  rationale: அபிஷேகம் செய்வதற்குப் பயன்படுத்தப்படும் எண்ணெயைக் குறிக்கும் இணைப்புத் தொடரை, வழிபாட்டுச் சூழலுக்கேற்ற இயல்பான தமிழ் சொல்லாக்கத்தில் தருகிறது.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: நறுமணத் தூபம்
  rationale: நறுமணப் பொருட்களால் செய்யப்பட்ட தூபம் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לַקֹּדֶשׁ
  choice: பரிசுத்த இடத்திற்காக
  rationale: לְ என்பதன் நோக்கம் அல்லது பயன்பாட்டையும், קֹדֶשׁ என்பதன் பரிசுத்த இடம் என்ற சூழல்சார் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: நான் உனக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும்
  rationale: כְּכֹל என்பதன் முழுமையான விரிவையும் மோசேயை நோக்கிய ஒருமை முன்னிலையையும் தக்கவைக்கிறது.
- source_word: יַעֲשׂוּ
  choice: அவர்கள் இவற்றைச் செய்ய வேண்டும்
  rationale: முன்னர் குறிப்பிடப்பட்ட கைவினைஞர்களைக் குறிக்கும் பன்மை எழுவாயையும், பட்டியலிடப்பட்ட பொருட்களைக் குறிக்கும் செயப்படுபொருளையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: לַקֹּדֶשׁ என்பது இடத்தையா பரிசுத்தப் பயன்பாட்டையா குறிக்கிறது
  choice: பரிசுத்த இடத்திற்காக
  alternative: பரிசுத்தப் பயன்பாட்டிற்காக
  rationale: கூடார வழிபாட்டுச் சூழலில் இடத்தைக் குறிக்கும் வாசிப்பு இயல்பானது; அதேவேளை ‘-க்காக’ என்பது பயன்பாட்டு நோக்கத்தின் நிழற்பொருளையும் திறந்துவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. வசனம் முந்தைய பட்டியலின் தொடர்ச்சி என்றாலும், தமிழில் தனியாக வாசிக்க இயலுமாறு வினை இரு பொருட்களுடனும் இணைக்கப்பட்டுள்ளது.
