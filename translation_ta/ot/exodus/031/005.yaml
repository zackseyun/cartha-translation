lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת אֶבֶן
  choice: கற்களை வெட்டுவதிலும்
  rationale: חֲרֹשֶׁת என்பது திறமையான கைவினை அல்லது வேலைப்பாட்டைக் குறிக்கிறது. אֶבֶן உடன் வருவதால், கல்லில் செய்யப்படும் பணியை இயல்பாகக் காட்ட ‘கற்களை வெட்டுதல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶבֶן
  choice: கற்கள்
  rationale: இது பொதுவாக ‘கல்’ என்பதைக் குறிக்கும் சொல். கூடாரப் பணியின் சூழலில் விலையுயர்ந்த கற்களையும் உள்ளடக்கலாம்; ஆனால் எபிரெய உரை அதைக் குறிப்பாகச் சொல்லாததால் பொதுப் பொருள் தக்கவைக்கப்பட்டது.
- source_word: לְמַלֹּאת
  choice: பதிப்பதற்காக
  rationale: இக்கைவினைச் சூழலில், கற்களை ஓர் அமைப்பில் பதிப்பதற்காக ஆயத்தப்படுத்துவதைக் குறிக்கிறது. ‘நிரப்புவதற்காக’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட ‘பதிப்பதற்காக’ என்பது தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: וּבַחֲרֹשֶׁת עֵץ
  choice: மரத்தைச் செதுக்குவதிலும்
  rationale: அதே חֲרֹשֶׁת என்ற சொல் עֵץ என்பதுடன் வருவதால், மரத்தில் செய்யப்படும் திறமையான வேலையைத் தெளிவுபடுத்த ‘செதுக்குதல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לַעֲשׂוֹת בְּכָל מְלָאכָה
  choice: எல்லா வகையான கைத்தொழில்களையும் செய்வதிலும்
  rationale: מְלָאכָה என்பது வேலை அல்லது திறமைமிக்க தொழிலைச் சுட்டும். இங்கு கைவினைப் பணிகளே சூழல் என்பதால் ‘கைத்தொழில்கள்’ இயல்பானது; כָל என்பதன் விரிவை ‘எல்லா வகையான’ தக்கவைக்கிறது.
