  rationale: இங்கு குறிப்பிட்ட உலோகங்களைக் கொண்டு கைவினைப் பணியை நிறைவேற்றுதல் பொருள்; பொதுவான ‘செய்ய’ என்பதைவிட ‘வேலை செய்ய’ சூழலைத் தெளிவுபடுத்துகிறது.
- source_word: בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת
  choice: தங்கம், வெள்ளி, வெண்கலம் ஆகியவற்றைக் கொண்டு
  rationale: ב என்ற முன்னிடைச்சொல் இங்கு பயன்படுத்தப்படும் பொருட்களைக் குறிக்கிறது; தமிழில் ‘ஆகியவற்றைக் கொண்டு’ என்பது இயல்பான கருவிப்பொருள் உறவை வெளிப்படுத்துகிறது. נְחֹשֶׁת என்பதற்கு இச்சூழலில் ‘வெண்கலம்’ தேர்ந்தெடுக்கப்பட்டது.
