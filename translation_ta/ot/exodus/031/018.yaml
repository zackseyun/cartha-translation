  source_fidelity: 'வரைவின் பொருள் எபிரெய மூலத்துக்கு பெரும்பாலும் உண்மையாக உள்ளது: கடவுள் மோசேயுடன் பேசி முடித்ததும், சாட்சியைச் சார்ந்த இரு கற்பலகைகளை அளித்தார்; அவை கடவுளின் விரலால் எழுதப்பட்டவை. ஆனால் தொடக்கத்தில் மோசே இன்னும் பெயரிட்டு அறிமுகப்படுத்தப்படாத நிலையில் ‘அவருடன்’ என்பது தெளிவற்றதாகிறது. எபிரெயத்தின் பதிலிப்பெயர் சூழலில் மோசேயைக் குறித்தாலும், தமிழில் அந்தச் சூழல் தெளிவாக வெளிப்படவில்லை.'
  naturalness: ‘சாட்சியின் இரண்டு பலகைகள்’ என்பது புரியக்கூடியதே; ஆயினும் நவீன தமிழில் ‘இரண்டு சாட்சிப் பலகைகள்’ இயல்பான கூட்டுச்சொல் நடை. மூலத்தின் பின்னிணைப்பு அமைப்பையும் காக்க ‘கடவுளின் விரலால் எழுதப்பட்ட கற்பலகைகளான’ என்ற தொடர் பயன்படுத்தப்பட்டுள்ளது.
