  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: ta
  text: கடவுள் சீனாய் மலையில் மோசேயுடன் பேசி முடித்தபோது, அவர் மோசேக்கு இரண்டு சாட்சிப் பலகைகளை, அதாவது கடவுளின் விரலால் எழுதப்பட்ட கற்பலகைகளை, கொடுத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: அவர் ... கொடுத்தார்
  rationale: נתן என்பதன் தொடர்கதை வடிவம்; இயல்பான தமிழ் நடையில் இறந்தகால வினையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: பேசி முடித்தபோது
  rationale: כלה என்பதன் infinitive construct உடன் כ வருவது செயல் நிறைவடைந்த காலத்தை, ‘முடித்தபோது/முடித்த பின்’ என்ற பொருளில் குறிக்கிறது.
- source_word: אִתּוֹ
  choice: அவருடன்
  rationale: சூழலில் இந்தப் பதிலிப்பெயர் மோசேயைக் குறிக்கிறது; கடவுள் மோசேயுடன் பேசி முடித்தார்.
- source_word: בְּהַר סִינַי
  choice: சீனாய் மலையில்
  rationale: மலையின் மேல் அல்லது மலையிலுள்ள இடத்தை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: சாட்சியின் இரண்டு பலகைகள்
  rationale: עֵדוּת என்பதன் சாட்சி/உறுதிப்படுத்தும் ஆவணம் என்ற உடன்படிக்கைச் சார்ந்த பொருளை அதிக விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: לֻחֹת אֶבֶן
  choice: கற்பலகைகள்
  rationale: பலகைகள் செய்யப்பட்ட பொருள் கல் என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כְּתֻבִים
  choice: எழுதப்பட்ட
  rationale: כתב என்பதன் passive participle-ஐ நேரடியாகப் பிரதிபலிக்கிறது; ‘பொறிக்கப்பட்ட’ என்று கூடுதல் பொருள் சேர்க்கவில்லை.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: கடவுளின் விரலால்
  rationale: கருவியைக் குறிக்கும் ב-ஐ ‘-ஆல்’ என வழங்கி, கடவுளுடைய நேரடி செயலை வலியுறுத்தும் உருவகமிக்க மனிதவுருவ மொழியைப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளை ஒருமைப் பொருளில் குறிக்கிறது; நவீன பொதுத் தமிழில் ‘கடவுள்’ இயல்பான தேர்வு.
theological_decisions:
- issue: தெய்வீக எழுத்துச் செயலை மனிதவுருவ மொழியில் கூறுதல்
  choice: கடவுளின் விரலால்
  alternative: கடவுளால் நேரடியாக / கடவுளின் வல்லமையால்
  rationale: எபிரெய உரையின் தெளிவான உருவகத்தையும், பலகைகளில் எழுதப்பட்டது கடவுளின் நேரடிச் செயல் என்ற வலியுறுத்தலையும் விளக்கி நீக்காமல் அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் கொண்ட நடை. ‘சாட்சியின் பலகைகள்’ என்ற உடன்படிக்கைச் சொல்லாட்சி திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது. எபிரெயத்தில் ‘அவர்’ என்பதன் குறிப்பு சூழலால் கடவுளைக் குறிக்கிறது; பெயரைச் சேர்த்து மறைமுகத்தை நீக்காமல் பதிலிப்பெயர் வைக்கப்பட்டுள்ளது.
