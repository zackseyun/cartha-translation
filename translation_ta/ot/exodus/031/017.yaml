revisions:
- from: அது எனக்கும் இஸ்ரவேலின் மக்களுக்கும் இடையே என்றென்றும் நிலைக்கும் ஓர் அடையாளம்; ஏனெனில் ஆறு நாட்களில் யாவே வானங்களையும் பூமியையும் உண்டாக்கினார்; ஏழாம் நாளிலோ அவர் ஓய்ந்து, புத்துணர்வு பெற்றார்.[a]
  to: அது எனக்கும் இஸ்ரவேல் மக்களுக்கும் இடையே என்றென்றும் நிலைக்கும் ஓர் அடையாளம்; ஏனெனில் ஆறு நாட்களில் யாவே வானங்களையும் பூமியையும் உண்டாக்கினார்; ஏழாம் நாளில் அவர் செயலை நிறுத்தி, புத்துணர்வு பெற்றார்.[a]
  rationale: The revision removes an unsupported contrast, renders שָׁבַת by its central sense of ceasing, and corrects the footnote so that the anthropomorphic force of וַיִּנָּפַשׁ is retained without adding the notion of restoration from death. No doctrinal inference is introduced.
