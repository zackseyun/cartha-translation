base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: ta
  text: அது எனக்கும் இஸ்ரவேல் மக்களுக்கும் இடையே என்றென்றும் நிலைக்கும் ஓர் அடையாளம்; ஏனெனில் ஆறு நாட்களில் யாவே வானங்களையும் பூமியையும் உண்டாக்கினார்; ஏழாம் நாளில் அவர் செயலை நிறுத்தி, புத்துணர்வு பெற்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “செயலை நிறுத்தி” என்பதற்கு “ஓய்வெடுத்து” என்றும் மொழிபெயர்க்கலாம். “புத்துணர்வு பெற்றார்” என்பதற்கான எபிரெயச் சொல், இன்னும் நேரடியாக, “மூச்சுவிட்டார்” அல்லது “மூச்சுப் பெற்றார்” என்ற உயிர்ப்புள்ள மனிதவுருவக மொழியை உடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: எனக்கும் ... இடையே
  rationale: இரு தரப்புகளுக்கிடையேயான உறவைச் சுட்டும் எபிரெய இணை முன்னிடைச்சொற்களை இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் 'இஸ்ரவேலின் மகன்கள்' எனலாம்; ஆனால் இங்கு அது இஸ்ரவேல் சமூகத்தாரைக் குறிக்கும் மரபுச்சொல் என்பதால், நவீனத் தமிழில் இயல்பும் பொருள் துல்லியமும் உள்ள 'இஸ்ரவேலின் மக்கள்' தேர்ந்தெடுக்கப்பட்டது.
- source_word: אוֹת
  choice: அடையாளம்
  rationale: உடன்படிக்கை உறவை வெளிப்படுத்தும் நிலையான குறியீடு என்ற பொருளைத் தரும் வழக்கமான தமிழ் சொல்.
- source_word: לְעֹלָם
  choice: என்றென்றும் நிலைக்கும்
  rationale: நீடித்த காலத்தைச் சுட்டும் எபிரெயச் சொல்லைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஓய்வுநாள் அடையாளமாக இருப்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: שֵׁשֶׁת יָמִים
  choice: ஆறு நாட்களில்
  rationale: படைப்புச் செயலின் காலச்சட்டத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָשָׂה
  choice: உண்டாக்கினார்
  rationale: வானங்களையும் பூமியையும் பொருள்களாகக் கொண்ட சூழலில் படைப்புச் செயலைத் துல்லியமாகக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரைப் பெயராகவே தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: வானங்களையும் பூமியையும்
  rationale: எபிரெயப் பன்மை வடிவத்தையும் முழுப் படைப்புலகைக் குறிக்கும் இணைப்பையும் பாதுகாக்கிறது.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளிலோ
  rationale: தொடர்ச்சியையும் முந்தைய ஆறு நாட்களுடனான இயல்பான வேறுபாட்டையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁבַת
  choice: ஓய்ந்து
  rationale: தமிழில் ஓய்வுநாள் சூழலுக்கு இயல்பான சொல்; அடிப்படைப் பொருளான 'செயலை நிறுத்தினார்' என்பதும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּנָּפַשׁ
  choice: புத்துணர்வு பெற்றார்
  rationale: எபிரெயின் உயிர்ப்புள்ள மனிதவுருவக மொழியை அழிக்காமல், நவீனத் தமிழில் புரியத்தக்கவாறு தருகிறது.
theological_decisions:
- issue: கடவுளைப் பற்றிய மனிதவுருவக ஓய்வுநாள் மொழி
  choice: அவர் ஓய்ந்து, புத்துணர்வு பெற்றார்
  alternative: அவர் தமது வேலையை நிறுத்தி, மூச்சுவிட்டார்
  rationale: மூல எபிரெயில் உள்ள மனிதனைப் போன்ற உயிர்ப்புள்ள சொல்லாட்சியைச் சுருக்கி மறைக்காமல் பாதுகாக்கிறது; அதே சமயம் கடவுள் களைப்படைந்தார் என்று விளக்கமாகச் சேர்ப்பதில்லை.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் சமூகக் குறிப்பு
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயின் குடும்பவழிச் சொல்லாட்சி முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கிறது. தமிழில் 'மகன்கள்' என்பது ஆண்களை மட்டும் குறிப்பதாக எளிதில் புரியக்கூடும் என்பதால், இங்கு குறிக்கப்படும் சமூகப் பொருள் வெளிப்படையாகத் தரப்பட்டது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: யெகோவா
  rationale: எபிரெயத் தெய்வீகப் பெயரை நவீன ஆய்வில் பரவலாக ஏற்கப்படும் உச்சரிப்புக்கு ஏற்ப தமிழில் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் மனிதவுருவகத் தீவிரம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
