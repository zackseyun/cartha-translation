translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியலின் தொடர்ச்சியைப் பாதுகாக்கும் மரியாதைமிக்க நடை. வசனம் முந்தைய பட்டியலைத் தொடருவதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘ஆசாரியன்,’ ‘பரிசுத்தம்,’ ‘திருக்கூடாரம்’ ஆகியவை பரவலாகப் புரிந்துகொள்ளப்படும் வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டுள்ளன.
