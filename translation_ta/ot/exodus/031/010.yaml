  text: וְ/אֵ֖ת בִּגְדֵ֣י הַ/שְּׂרָ֑ד וְ/אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/010.yaml
  text: and the finely woven garments[a], and the holy garments for Aaron the priest, and the garments of his sons for serving as priests,
translation:
  language: ta
  text: நுட்பமாக நெய்யப்பட்ட ஆடைகளையும்[a], ஆசாரியனாகிய ஆரோனுக்குரிய பரிசுத்த ஆடைகளையும், ஆசாரியர்களாகப் பணியாற்றுவதற்காக அவன் மகன்களுக்குரிய ஆடைகளையும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருப்பணிக்கான ஆடைகள்,” “பணி ஆடைகள்,” அல்லது “நெய்யப்பட்ட ஆடைகள்.” בִּגְדֵי הַשְּׂרָד என்ற எபிரெயச் சொற்றொடரின் பொருள் தெளிவாக இல்லை; அது ஆடைகள் செய்யப்பட்ட விதத்தையோ, திருக்கூடாரப் பணியில் அவற்றின் பயன்பாட்டையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: நுட்பமாக நெய்யப்பட்ட ஆடைகள்
  rationale: בִּגְדֵי என்பது ‘ஆடைகள்’ என்று பொருள்படும். அரிதான שְׂרָד என்ற சொல் இங்கு ஆடைகளின் சிறப்பான நெய்வினையையோ, திருப்பணிக்கான அவற்றின் பயன்பாட்டையோ குறிக்கலாம். முதன்மை உரையில் இயல்பான சாத்தியத்தைத் தேர்ந்தெடுத்து, நிச்சயமின்மையை அடிக்குறிப்பில் காக்கிறது.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: பரிசுத்த ஆடைகள்
  rationale: ‘பரிசுத்தத்திற்குரிய ஆடைகள்’ என்ற எபிரெயக் கட்டமைப்பை நவீனத் தமிழில் நேரடியாகவும் மரியாதைமிக்க வகையிலும் வழங்குகிறது.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனாகிய ஆரோனுக்குரிய
  rationale: לְ இங்கு ஒதுக்கீடு அல்லது உரிய தன்மையைக் குறிக்கிறது; הַכֹּהֵן என்பது ஆரோனைக் குறிப்பாக விளக்கும் பட்டம்.
- source_word: בִּגְדֵי בָנָיו
  choice: அவன் மகன்களுக்குரிய ஆடைகள்
  rationale: மூன்றாம் நபர் ஒருமை உரிமை விகுதி ஆரோனைச் சுட்டுகிறது; தமிழ் வாக்கியத்தில் உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְכַהֵן
  choice: ஆசாரியர்களாகப் பணியாற்றுவதற்காக
  rationale: כהן என்ற வினை ஆசாரிய அலுவலைச் செய்வதைக் குறிக்கிறது. பன்மையான ‘மகன்கள்’ என்பதுடன் இயல்பாகப் பொருந்துமாறு தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: וְאֵת / וְאֶת
  choice: -ஐயும் / -களையும்
  rationale: אֵת நேரடியாக மொழிபெயர்க்கப்படாத வேற்றுமைக் குறி; וְ இணைப்பைத் தமிழின் ‘-உம்’ பட்டியல் அமைப்பு வெளிப்படுத்துகிறது.
