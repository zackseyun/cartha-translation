  naturalness: திருத்தப்பட்ட வாக்கியம் நவீனத் தரத் தமிழில் இயல்பானது. ஒரே ‘-ஆலும்’ தொடரால் எபிரேயத்தின் இணை அமைப்பும், ‘நிரப்பியிருக்கிறேன்’ என்பதன் நிறைவுற்ற-தற்போதைய விளைவும் தெளிவாகத் தங்குகின்றன.
  terminology: ‘கடவுளின் ஆவி,’ ‘ஞானம்,’ ‘புரிந்துகொள்ளும் திறன்,’ ‘அறிவு,’ ‘எல்லாவகைக் கைவினைத் திறன்’ ஆகியவை சூழலுக்கும் சொல்லாட்சிக்கும் ஏற்றவை. அடிக்குறிப்பு, எபிரேய இணைப்புத் தொடரில் உள்ள பரந்த பொருள் வாய்ப்பை பாதுகாக்கும்படி சுருக்கமாகத் திருத்தப்பட்டுள்ளது.
