base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: ta
  text: நான் அவனை கடவுளின் ஆவியாலும், ஞானத்தினாலும், புரிந்துகொள்ளும் திறனினாலும், அறிவினாலும், எல்லாவகைக் கைவினைத் திறனினாலும் நிரப்பியிருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “கடவுளின் ஆவி” என்பதை “தெய்வீக ஆவி” என்றும் புரிந்துகொள்ளலாம். ஆனால் இச்சூழலில், கடவுள் தாமே ஆற்றலளிக்கும் ஆவியையே இது குறிப்பதாகத் தெரிகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: நிரப்பியிருக்கிறேன்
  rationale: מלא என்பதன் அடிப்படைப் பொருள் ‘நிரப்பு’. இங்கு நிறைவேற்றப்பட்ட செயல் தற்போதும் விளைவுடையதாக இருப்பதைத் தமிழின் ‘நிரப்பியிருக்கிறேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹתוֹ
  choice: அவனை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பெசலெயேலைச் சுட்டும் நேரடிச் செயப்படுபொருள் ஆண்பால் ஒருமைச் சுட்டுப்பெயர்.
- source_word: רוּחַ אֱלֹהִים
  choice: கடவுளின் ஆவி
  rationale: எபிரேய இணைப்புத் தொடர் பொதுவாக ‘கடவுளின் ஆவி’ என்றும், சூழலைப் பொறுத்து ‘தெய்வீக ஆவி’ என்றும் புரிந்துகொள்ளப்படலாம். பரிசுத்தக் கூடாரப் பணிக்காகக் கடவுள் நேரடியாக ஆற்றலளிக்கும் இச்சூழலில் ‘கடவுளின் ஆவி’ பொருத்தமானது.
- source_word: בְּחָכְמָה
  choice: ஞானத்தினாலும்
  rationale: בְ இங்கு நிரப்புதலோடு வழங்கப்படும் திறனை அல்லது பண்பைச் சுட்டுகிறது; ‘ஞானத்தினாலும்’ தொடரின் கருவி/வழங்கப்பட்ட ஆற்றல் நுணுக்கத்தைக் காக்கிறது.
- source_word: וּבִתְבוּנָה
  choice: புரிந்துகொள்ளும் திறனினாலும்
  rationale: תבונה என்பது புரிதல், பகுத்துணர்வு, நுண்ணறிவு ஆகியவற்றைக் குறிக்கிறது. இக்கைவினைச் சூழலில் ‘புரிந்துகொள்ளும் திறன்’ சாதாரண வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וּבְדַעַת
  choice: அறிவினாலும்
  rationale: דעת என்பதற்கான நேரடியான, இயல்பான தமிழ் இணை ‘அறிவு’; ஞானம்–புரிதல்–அறிவு என்ற தொடரையும் காக்கிறது.
- source_word: וּבְכָל מְלָאכָה
  choice: எல்லாவகைக் கைவினைத் திறனினாலும்
  rationale: מלאכה என்பது வேலை அல்லது தொழிலைப் பொதுவாகக் குறிக்கலாம்; உடனடியான சூழலில் கலைநயம் மிக்க கூடாரக் கட்டுமானப் பணிகள் பேசப்படுவதால் ‘கைவினைத் திறன்’ பொருளைத் துல்லியமாக்குகிறது. כל உடன் வரும் ஒருமைச் சொல்லை ‘எல்லாவகை’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: רוּחַ אֱלֹהִים என்பதை கடவுளுக்குரிய ஆவியாகவா அல்லது பொதுவான தெய்வீக ஆற்றலாகவா மொழிபெயர்ப்பது
  choice: கடவுளின் ஆவி
  alternative: தெய்வீக ஆவி; கடவுளிடமிருந்து வரும் ஆவி
  rationale: பெசலெயேல் பரிசுத்தக் கூடாரப் பணியைச் செய்யும்படி கடவுள் நேரடியாக ஆற்றலளிப்பதே உடனடிச் சூழல். ஆகவே ‘கடவுளின் ஆவி’ முதன்மை வாசிப்பாக ஏற்கப்படுகிறது; அதேவேளை எபிரேயத் தொடரின் பரந்த வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. பிற்காலக் கோட்பாட்டு நுணுக்கம் வசனத்துக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய புரிதலும் இணைந்த நடை. எபிரேய மூலத்தின் இணை அமைப்பைக் காக்க ‘-ஆலும்’ தொடர் பயன்படுத்தப்பட்டது. ‘ஆவி’ என்பதில் தமிழில் பெரிய/சிறிய எழுத்து வேறுபாடு இல்லாததால், மாற்று வாசிப்பு அடிக்குறிப்பில் விளக்கப்பட்டது.
