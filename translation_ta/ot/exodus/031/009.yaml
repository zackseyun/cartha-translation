  text: and the altar of burnt offering[a], with all its utensils, and the basin with its stand,
translation:
  language: ta
  text: தகனபலிப் பீடத்தையும் அதன் எல்லா உபகரணங்களையும், தொட்டியையும் அதன் தாங்கியையும்[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதன் அடித்தளத்தையும்.’
    reason: כֵּן என்ற சொல்லின் இவ்வடிவம் பாத்திரத்தைத் தாங்கும் ‘தாங்கி’ அல்லது அதன் ‘அடித்தளம்’ எனப் பொருள்படலாம்.
lexical_decisions:
- source_word: מִזְבַּח
  choice: பலிபீடம்
  rationale: பலிகளைச் செலுத்தும் பீடத்தைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: முழுவதும் எரித்துச் செலுத்தப்படும் עֹלָה பலியை வழிபாட்டுச் சூழலில் துல்லியமாகக் குறிக்கும் நிலைபெற்ற சொல்; சொல்லின் வேர்ப்பொருளை மட்டும் முன்னிறுத்தும் ‘ஏறிச்செல்லும் பலி’ இயல்பான தமிழல்ல.
- source_word: כָּל
  choice: எல்லா
  rationale: பன்மையிலுள்ள உபகரணங்கள் அனைத்தையும் உள்ளடக்கும் முழுமையைக் காட்டுகிறது.
- source_word: כֵּלָיו
  choice: அதன் உபகரணங்கள்
  rationale: பலிபீடத்துடன் பயன்படுத்தப்பட்ட பலவகைப் பொருட்களையும் கருவிகளையும் உள்ளடக்கும் இயல்பான பொதுப்பெயர்.
- source_word: הַכִּיּוֹר
  choice: தொட்டி
  rationale: திருக்கூடார முற்றத்தில் கழுவுவதற்குப் பயன்படுத்தப்பட்ட பாத்திரத்தை எளிய நவீன தமிழில் குறிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத பயன்பாட்டை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: כַּנּוֹ
  choice: அதன் தாங்கி
  rationale: தொட்டியைத் தாங்கும் தனிப்பட்ட அமைப்பைக் குறிக்கிறது; ‘அடித்தளம்’ என்பதும் சாத்தியம்.
- source_word: וְאֶת
  choice: -த்தையும்
  rationale: எபிரெயப் பட்டியலில் ஒவ்வொரு நேர்செயப்படுபொருளையும் இணைக்கும் வாவ் மற்றும் אֵת ஆகியவற்றைத் தமிழில் இணைப்பும்மை மற்றும் வேற்றுமை உருபால் இயல்பாக வெளிப்படுத்துகிறது.
