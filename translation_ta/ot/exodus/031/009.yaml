translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. இது தொடரும் பட்டியலின் ஒரு பகுதியாக இருப்பதால், மூலத்தின் இணைப்பையும் நேர்செயப்படுபொருள் அமைப்பையும் ‘-த்தையும்’ எனப் பேணுகிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘தாங்கி’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
