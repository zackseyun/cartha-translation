lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசி
  rationale: வாவ் தொடரமைப்பு நிகழ்வை முன்னோக்கி நகர்த்துகிறது; דבר என்பது வெறுமனே ‘சொல்’ என்பதைக் காட்டிலும் ஒருவரிடம் பேசுவதைக் குறிக்கிறது. அடுத்த வசனத்தில் வரும் உரையுடன் இயல்பாக இணைய, வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட பெயர் வடிவில் ஒலிபெயர்க்கிறது; மூல எபிரெய வடிவத்தின் உச்சரிப்பு உறுதியாகத் தெரியாதது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: אֶל
  choice: மோசேயிடம்
  rationale: இங்கு பேசுதலின் நோக்குநபரைச் சுட்டுகிறது; ‘மோசேயிடம்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் நிலைபெற்றுள்ள வேதாகமப் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: பேசி,
  rationale: இந்த எபிரெயச் சொல் தொடர்ந்து வரும் நேரடி உரையை அறிமுகப்படுத்துகிறது. தமிழில் ‘பேசி’ என அடுத்த வசனத்துடன் இணைப்பது இயல்பானது; ‘இவ்வாறு சொன்னார்’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: இறைப் பெயர் יְהוָה-வை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பெயரான நான்கு எழுத்து இறைப் பெயரே உள்ளது. அதை ‘கர்த்தர்’ என்ற மாற்றுப் பட்டமாக்காமல் பெயராகக் காட்டுகிறது; அதன் பழங்கால உச்சரிப்பு உறுதியற்றதால் மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான நடை. இது அடுத்த வசனத்தில் தொடங்கும் நேரடி உரைக்கான அறிமுகம் என்பதால், தமிழில் இயல்பான தொடர்வாக்கியமாக அமைக்கப்பட்டுள்ளது.
