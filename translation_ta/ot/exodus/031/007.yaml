  source_fidelity: 'மூல எபிரெயப் பட்டியலின் ஒவ்வொரு கூறும் தக்கவைக்கப்பட்டுள்ளது: ‘சந்திப்புக் கூடாரம்’ אֹהֶל מוֹעֵד-ஐ, ‘சாட்சிக்கான பெட்டி’ הָאָרֹן לָעֵדֻת-இன் தொடர்பு/நோக்க நுணுக்கத்தை, ‘பாவநிவாரண மூடி’ הַכַּפֹּרֶת-ஐ, ‘அதன்மேல் இருக்கும்’ அப்பெட்டியையே சுட்டும் אֲשֶׁר עָלָיו-ஐ, ‘எல்லாப் பொருட்கள்’ כָּל כְּלֵי הָאֹהֶל-இன் பரந்த பொருளைச் சரியாகத் தருகின்றன. தொடரும் பட்டியலாக இருப்பதையும் இறுதியிலுள்ள நீண்ட கோடு நன்றாகக் குறிக்கிறது.'
  naturalness: உரை நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் உள்ளது. இணைப்புப் பட்டியலில் வரும் ‘-யையும்’ வடிவங்கள் எபிரெயத்தின் தொடர்ச்சியான நேர்முகப் பொருள் அமைப்புக்கு ஏற்றவை. ‘சாட்சிக்கான பெட்டி’ என்பது ‘சாட்சிப் பெட்டி’யைவிடச் சற்றே விரிவானது; ஆயினும் இச்சூழலில் இயல்பற்றதோ பொருள்மாற்றம் உண்டாக்குவதோ அல்ல.
  terminology: ‘சந்திப்புக் கூடாரம்’ மற்றும் ‘பாவநிவாரண மூடி’ தெளிவான, சூழலுக்கேற்ற தேர்வுகள். ‘கிருபாசனம்’ என்ற பாரம்பரிய மாற்று அடிக்குறிப்பில் கொடுக்கப்பட்டுள்ளது; அது முதன்மை உரையின் தெளிவான மூடி என்ற குறிப்பு இழக்காமல் வாசகர்களுக்கு உதவுகிறது. ‘சாட்சிப் பெட்டி’ மாற்றும் உரிய அடிக்குறிப்பில் உள்ளது. அடிக்குறிப்பு அடையாளங்கள் தாம் விளக்கும் சொற்களுக்குப் பின்னரே இடப்பட்டுள்ளன.
