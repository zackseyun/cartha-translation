base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/007.yaml
  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: ta
  text: சந்திப்புக் கூடாரத்தையும், சாட்சிக்கான பெட்டியையும்[a], அதன்மேல் இருக்கும் பாவநிவாரண மூடியையும்[b], கூடாரத்தின் எல்லாப் பொருட்களையும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாட்சிப் பெட்டி.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கிருபாசனம்.” எபிரெயச் சொல் பெட்டியின் மேல் வைக்கப்பட்ட மூடியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் இஸ்ரவேலரைச் சந்திக்கும் பரிசுத்த கூடாரத்தைக் குறிக்கும் எபிரெயக் கூட்டுச்சொல்லை நெருக்கமாகவும் இயல்பான நவீனத் தமிழிலும் வழங்குகிறது.
- source_word: הָאָרֹן לָעֵדֻת
  choice: சாட்சிக்கான பெட்டி
  rationale: לְ என்னும் முன்னிடைச்சொல் காட்டும் நோக்கம் அல்லது தொடர்பைத் தக்கவைக்கிறது; மூலத்தில் இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லைச் சேர்ப்பதில்லை.
- source_word: הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: பெட்டியின் மேல் வைக்கப்பட்ட பொன் மூடியைக் குறிக்கும் சொல்லின் பொருளையும் அதனுடன் இணைந்த பாவநிவாரணச் செயல்பாட்டையும் தெளிவாகக் காட்டுகிறது; தெளிவற்ற அல்லது பழமையான சமயக் கலைச்சொல்லை முதன்மை உரையில் தவிர்க்கிறது.
- source_word: אֲשֶׁר עָלָיו
  choice: அதன்மேல் இருக்கும்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு முன் குறிப்பிடப்பட்ட பெட்டியைக் குறிக்கிறது; עַל என்பதன் இடவியல் உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: கூடாரத்தின் எல்லாப் பொருட்கள்
  rationale: כְּלִים என்பது இச்சூழலில் பாத்திரங்கள் மட்டும் அல்லாமல் கூடாரத்தின் பல்வேறு பயன்பாட்டுப் பொருட்களையும் குறிக்கும் பரந்த சொல்; ‘பொருட்கள்’ அந்தப் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பரிசுத்த இடச் சூழலில் כַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: கிருபாசனம்
  rationale: இந்தச் சொல் பெட்டியின் மூடியை நேரடியாகக் குறிக்கிறது; பலியுடனும் பாவநிவாரணத்துடனும் உள்ள தொடர்பையும் கொண்டுள்ளது. ‘பாவநிவாரண மூடி’ பொருளை வெளிப்படையாக அளிக்கிறது; பாரம்பரிய மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: הָאָרֹן לָעֵדֻת என்பதில் לְ காட்டும் உறவு
  choice: சாட்சிக்கான பெட்டி
  alternative: சாட்சிப் பெட்டி
  rationale: நோக்கம் மற்றும் உடைமைத் தொடர்பு இரண்டும் சாத்தியமானதால், முதன்மை உரை לְ-இன் நோக்க நுணுக்கத்தைத் தக்கவைக்கிறது; சுருக்கமான தொடர்புப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இது தொடரும் பட்டியலின் ஒரு பகுதி என்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது; ஒவ்வொரு பொருளோடும் வரும் எபிரெய குற்றுவினை உருபைத் தமிழின் ‘-ஐ/–யையும்’ தொடர் பிரதிபலிக்கிறது.
