translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நேரடி எபிரெய வாக்கிய வரிசையை விடத் தமிழ் இயல்புக்கேற்ப கோத்திர மற்றும் வம்ச அடையாளங்கள் பெயருக்கு முன் அமைக்கப்பட்டுள்ளன.
