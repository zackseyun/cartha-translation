  text: רְאֵ֖ה קָרָ֣אתִֽי בְ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/002.yaml
  text: See[a], I have called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.
translation:
  language: ta
  text: “இதோ, யூதா கோத்திரத்தைச் சேர்ந்த, ஊரின் மகனான ஊரியின் மகன் பெசலெயேலை நான் பெயரால் அழைத்தேன்.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதோ, பெசலெயேலை நான் பெயர் சொல்லி அழைத்தேன்.” ‘பெயரால் அழைத்தல்’ என்ற எபிரெய மரபுத்தொடர், ஒருவரைத் தனிப்பட்ட முறையில் குறிப்பிட்டு அழைப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் உரையாடல் சார்ந்த கட்டளையாக இங்கு வருகிறது; நவீனத் தமிழில் ‘இதோ’ அதன் நேரடியான வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קָרָאתִי
  choice: நான் ... அழைத்திருக்கிறேன்
  rationale: קרא என்பதன் முதன்மையான ‘அழை’ என்ற பொருளைத் தக்கவைத்து, நியமித்தல் என்ற விளக்கத்தை வினைக்குள் சேர்க்காமல் விடுகிறது.
- source_word: בְשֵׁם
  choice: பெயரிட்டு
  rationale: குறிப்பிட்ட ஒருவரைத் தனிப்பட்ட முறையில் பெயரால் அழைத்தல் அல்லது தேர்ந்தெடுத்தல் என்ற எபிரெய மரபுத்தொடரின் நுட்பத்தைச் சுருக்கமாகக் காக்கிறது.
- source_word: בְּצַלְאֵל
  choice: பெசலெயேல்
  rationale: தமிழ் வேதாகமப் பெயர்வழக்குக்கு ஏற்ப தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: ஊரியின் மகனும் ஊரின் பேரனுமான
  rationale: தொடர்ச்சியான வம்ச அடையாளத்தைத் தமிழில் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது; இரண்டாவது בן உறவை ‘பேரன்’ என வெளிப்படுத்துவது பொருளை மாற்றாமல் குழப்பத்தைத் தவிர்க்கிறது.
- source_word: לְמַטֵּה יְהוּדָה
  choice: யூதா கோத்திரத்தைச் சேர்ந்த
  rationale: לְ குறிக்கும் இனக்குழு சார்பையும் מַטֶּה என்பதன் ‘கோத்திரம்’ என்ற சூழல்சார் பொருளையும் இயல்பான தமிழில் தருகிறது.
