  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: ta
  text: இதோ[a], நானே அவனுடன் தாண் கோத்திரத்தைச் சேர்ந்த அகிசாமாக்கின் மகன் அகோலியாபை நியமித்தேன்; மேலும், இதயத்தில் ஞானமுள்ள ஒவ்வொருவருடைய உள்ளத்திலும் ஞானத்தை வைத்தேன்; அவர்கள் நான் உனக்குக் கட்டளையிட்ட அனைத்தையும் செய்வதற்காக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதோ” என்பது கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் மொழிபெயர்ப்பு; “நானே” என்பது வலியுறுத்தலான முதலாம் நபர் சுட்டுப்பெயரை வெளிப்படுத்துகிறது.
    reason: cultural_note
  - marker: b
    text: “அவர்கள் செய்வதற்காக” என்பதற்கு, இன்னும் முறையாக, “அவர்கள் நான் உனக்குக் கட்டளையிட்ட அனைத்தையும் செய்வார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: இதோ, நானே
  rationale: தனி முதலாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலையும் הִנֵּה என்பதன் கவனத்தை ஈர்க்கும் ஆற்றலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: נָתַתִּי אִתּוֹ
  choice: அவனுடன் ... நியமித்திருக்கிறேன்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்றாலும், இங்கு பெசலெயேலுடன் ஒருவரைப் பணிக்கு அமர்த்தும் சூழலில் ‘நியமித்திருக்கிறேன்’ இயல்பானது; אִתּוֹ என்பதையும் வெளிப்படையாகக் காக்கிறது.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: அகிசாமாக்கின் மகன் அகோலியாப்
  rationale: தனிப்பெயர்களை எபிரெய ஒலிப்பிற்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்த்து, வம்ச உறவை இயல்பான தமிழ் வரிசையில் தருகிறது.
- source_word: לְמַטֵּה דָן
  choice: தாண் கோத்திரத்தைச் சேர்ந்த
  rationale: מַטֶּה இங்கு கோத்திரச் சேர்ந்திருப்பைக் குறிக்கிறது; இந்தத் தமிழ் சொற்றொடர் அதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: ஞானமுள்ள இதயம் கொண்ட ஒவ்வொருவரின் இதயத்திலும்
  rationale: לֵב என்ற சொல்லின் இரட்டிப்பையும் எபிரெய மனிதவியல் உருவகத்தையும் இயன்றவரை காக்கிறது; כָּל என்பதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொருவரின்’ தெரிவிக்கிறது.
- source_word: נָתַתִּי חָכְמָה
  choice: ஞானத்தை வைத்திருக்கிறேன்
  rationale: கைவினைத் திறனையும் உள்ளடக்கும் חָכְמָה என்பதற்கு ‘ஞானம்’ என்று கொடுத்து, அதை உள்ளத்தில் வைப்பதான மூல உருவகத்தையும் காக்கிறது.
- source_word: וְעָשׂוּ
  choice: அவர்கள் செய்வதற்காக
  rationale: இறைவன் ஞானம் அளித்ததற்கும் அதன்படி அவர்கள் வேலை செய்வதற்கும் இடையிலுள்ள நோக்கம் அல்லது விளைவு உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: நான் உனக்குக் கட்டளையிட்ட அனைத்தையும்
  rationale: மோசேயை நோக்கிய ஒருமை ‘உனக்கு’ என்பதையும் முழுமையைக் குறிக்கும் כָּל என்பதையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: חֲכַם־לֵב மற்றும் חָכְמָה ஆகியவற்றை கைவினைப் பணிச் சூழலில் மொழிபெயர்த்தல்
  choice: ஞானமுள்ள இதயம் / ஞானம்
  alternative: திறமைமிக்கவர் / திறமை
  rationale: கூடாரப் பணிக்கான கைவினைத் திறமை சூழலில் அடங்கினாலும், ‘இதயம்’ மற்றும் ‘ஞானம்’ என்பவற்றைக் காப்பது நடைமுறைத் திறனும் இறைவனால் அளிக்கப்படும் ஞானமே என்ற எபிரெய கருத்தைச் சுருக்காமல் வெளிப்படுத்துகிறது.
- issue: ஞானம் அளித்ததைத் தொடர்ந்து வரும் וְעָשׂוּ என்பதன் தொடர்பு
  choice: அவர்கள் செய்வதற்காக
  alternative: அவர்கள் செய்வார்கள்
  rationale: இந்த இணைப்பை நோக்கப் பொருளாகப் புரிந்துகொள்வது, ஞானம் அளித்தல் பணியைச் செய்வதற்கான இறை ஏற்பாடு என்பதைத் தெரிவிக்கிறது; எளிய எதிர்கால வாசிப்பும் இலக்கண ரீதியாகச் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வேதாகமத்துக்குரிய உயர்வும் காக்கப்பட்டுள்ளன. ‘இதோ, நானே’ என்பது மூலத்தின் வலியுறுத்தலை இயல்பாகத் தருகிறது. ‘ஞானமுள்ள இதயம்’ சற்று உயர்ந்த நடை என்றாலும், எபிரெய மொழிவடிவத்தையும் அதன் இறையியல் ஆழத்தையும் பாதுகாக்கத் திட்டமிட்டு வைக்கப்பட்டுள்ளது.
