- source_word: אוֹת
  choice: ஓர் அடையாளம்
  rationale: ஓய்வுநாளின் உடன்படிக்கைச் செயல்பாட்டைத் தெளிவாகக் குறிக்கும் வழக்கமான பொருத்தமான சொல்.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும்
  rationale: அடுத்தடுத்து வரும் தலைமுறைகள் அனைத்திலும் தொடரும் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לָדַעַת
  choice: அறிந்துகொள்வதற்காக
  rationale: לְ உடன் வரும் வினையெச்சத்தின் நோக்கப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מְקַדִּשְׁכֶם
  choice: உங்களைப் புனிதப்படுத்துகிறவர்
  rationale: பீயேல் வினையெச்சத்தின் காரணவினைப் பொருளையும் தொடர்ச்சியான செயற்பாட்டையும் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் நேரடியாக வரும் நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: ஓய்வுநாள் கடைப்பிடிப்பின் வலியுறுத்தல் அல்லது கட்டுப்பாடு
  choice: கண்டிப்பாகக் கடைப்பிடிக்க வேண்டும்
  alternative: ஆனால்/மட்டும் என் ஓய்வுநாள்களைக் கடைப்பிடிக்க வேண்டும்
  rationale: אַךְ வலியுறுத்தலையும் கட்டுப்பாட்டையும் குறிக்கக்கூடும். முதன்மை உரை வலியுறுத்தலைத் தேர்ந்தெடுக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டுப்பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இது இஸ்ரவேலின் உடன்படிக்கைச் சமூகத்தைக் கூட்டாகக் குறிக்கிறது. இயல்பற்ற சொல்லுக்கு சொல் வடிவம் பாலின வரம்பைத் தவறாக உணர்த்தக்கூடும் என்பதால், சொற்பிறப்பியல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: מְקַדִּשְׁכֶם என்பதன் பொருள்
  choice: உங்களைப் புனிதப்படுத்துகிறவர்
  alternative: உங்களைப் பரிசுத்தமாக்குகிறவர்
  rationale: இரண்டும் தேவன் மக்களைத் தனக்கெனப் பிரித்து புனிதமாக்கும் செயலைக் குறிக்கின்றன; நவீன பொதுத் தமிழுக்காக ‘புனிதப்படுத்துகிறவர்’ தேர்ந்தெடுக்கப்படுகிறது.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தின் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டமாக மாற்றாமல் பிரதிபலிக்க ‘யாவே’ பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் தெளிவான, கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை ‘நீயோ’ என்பதிலிருந்து மக்களைக் குறிக்கும் பன்மை ‘நீங்கள்’ என்பதற்கான மூலமொழி மாற்றம் தக்கவைக்கப்பட்டுள்ளது. ‘ஓய்வுநாள்கள்’ என்ற பன்மையும், ‘யாவே’ என்ற தெய்வீகப் பெயரும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
