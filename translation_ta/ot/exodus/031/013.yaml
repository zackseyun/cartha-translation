  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: ta
  text: 'நீயோ இஸ்ரவேல் மக்களிடம்[b] பேசிச் சொல்: “நீங்கள் என் ஓய்வுநாள்களைக் கண்டிப்பாக[a] கடைப்பிடிக்க வேண்டும்; ஏனெனில், தலைமுறைதோறும் அது எனக்கும் உங்களுக்கும் இடையே ஓர் அடையாளமாக இருக்கிறது; உங்களைப் புனிதப்படுத்துகிற[c] யாவே நானே என்பதை நீங்கள் அறிந்துகொள்வதற்காக.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கண்டிப்பாக” என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல், “ஆனால்,” “எப்படியாயினும்,” அல்லது “மட்டும்” என்ற கட்டுப்படுத்தும் பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களுக்கான வழக்கமான உடன்படிக்கைப் பெயர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “உங்களைப் பரிசுத்தமாக்குகிற.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: முன்னிலைப்படுத்தப்பட்ட ஒருமைச் சுட்டுப்பெயரின் வலியுறுத்தலையும் முந்தைய அறிவுறுத்தல்களிலிருந்து வரும் உரைமாற்றத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு உடன்படிக்கைச் சமூகத்தைக் கூட்டாகக் குறிப்பதால் ‘இஸ்ரவேல் மக்கள்’ என்பது உள்ளடக்கத்தை மாற்றாமல் தெளிவான நவீன தமிழை வழங்குகிறது.
- source_word: אַךְ
  choice: கண்டிப்பாக
  rationale: சுற்றியுள்ள திருக்கூடாரப் பணிகளுக்கிடையிலும் ஓய்வுநாளைக் கடைப்பிடிக்க வேண்டிய வலியுறுத்தலை வெளிப்படுத்துகிறது; எபிரெயச் சொல்லின் கட்டுப்படுத்தும் அல்லது மாறுபாட்டுக் கருத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: שַׁבְּתֹתַי
  choice: என் ஓய்வுநாள்கள்
  rationale: மூலத்திலுள்ள பன்மையைத் தக்கவைத்து, Sabbath என்ற உடன்படிக்கை அனுசரிப்பை அர்த்தமுள்ள இயல்பான தமிழில் தருகிறது.
- source_word: תִּשְׁמֹרוּ
  choice: கடைப்பிடிக்க வேண்டும்
