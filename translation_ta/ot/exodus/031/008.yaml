lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: மேசை
  rationale: שֻׁלְחָן என்பதன் நேரான பொருள் ‘மேசை’. இது எந்த மேசை என்பதை வாசஸ்தலச் சூழல் தெளிவுபடுத்துவதால், மூலத்தில் இல்லாத விரிவான பெயரை வசனத்தில் சேர்க்கவில்லை.
- source_word: כֵּלָיו / כָּל כֵּלֶיהָ
  choice: அதன் உபகரணங்கள் / அதன் எல்லா உபகரணங்கள்
  rationale: כְּלִי என்பது பாத்திரம், கருவி, பயன்பாட்டுப் பொருள் ஆகியவற்றை உள்ளடக்கும் பரந்த சொல். மேசைக்கும் விளக்குத்தண்டுக்கும் தொடர்புடைய பலவகைப் பொருட்களையும் இயல்பாகக் குறிக்க ‘உபகரணங்கள்’ தேர்ந்தெடுக்கப்பட்டது; כָּל என்பதன் முழுமை ‘எல்லா’ எனப் பாதுகாக்கப்பட்டது.
- source_word: הַמְּנֹרָה
  choice: விளக்குத்தண்டு
  rationale: מְנוֹרָה என்பது பரிசுத்த இடத்தில் விளக்குகளைத் தாங்கும் தண்டைக் குறிக்கிறது. பொதுப்பெயரை ஒலிபெயர்ப்பதைவிட பொருளைத் தெளிவாக மொழிபெயர்க்கும் வகையில் ‘விளக்குத்தண்டு’ பயன்படுத்தப்பட்டது.
- source_word: הַטְּהֹרָה
  choice: தூய
  rationale: טָהוֹר என்பதற்கு ‘தூய’ அல்லது ‘சுத்தமான’ என்று பொருள். வழிபாட்டுச் சூழலில் பொருத்தமானதும், பொருளின் தூய பொன் அமைப்பையும் எதிரொலிக்கக்கூடியதுமான ‘தூய’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: தூபப் பலிபீடம்
  rationale: இந்த இணைப்புச் சொற்றொடர் தூபம் செலுத்தப்படும் பலிபீடத்தைக் குறிக்கிறது. ‘தூபப் பலிபீடம்’ நவீனத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְאֶת
  choice: -ஐயும் / -த்தையும்
  rationale: אֵת என்னும் நேரடிச் செயப்படுபொருள் குறியீட்டுக்குத் தனிச் சொல் தரப்படவில்லை; וְ என்னும் இணைப்பும் பட்டியல் அமைப்பும் தமிழ் வேற்றுமை மற்றும் இணைப்பு விகுதிகளான ‘-ஐயும்’, ‘-த்தையும்’ மூலம் வெளிப்படுத்தப்பட்டன.
theological_decisions:
- issue: ‘தூய’ என்பதன் துல்லியமான நுண்பொருள்
  choice: வசனத்தில் ‘தூய’ என்று மட்டும் வைத்து இரட்டைப் பொருள் சாத்தியத்தைப் பாதுகாத்தல்
  alternative: ‘தூய பொன்னால் செய்யப்பட்ட’ அல்லது ‘சடங்குப்படி தூய’ என்று வெளிப்படையாக விரித்துரைத்தல்
  rationale: எபிரெயச் சொல் தூய்மை/சுத்தத்தைக் குறிக்கிறது; தொடர்புடைய வாசஸ்தல விவரிப்புகளில் தூய பொன்னையும் நினைவூட்டலாம். ஆனால் இவ்வசனம் அந்த இரண்டில் ஒன்றை மட்டும் வெளிப்படையாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியலின் தொடர்ச்சியைப் பாதுகாக்க இணைப்பு விகுதிகள் மீண்டும் பயன்படுத்தப்பட்டுள்ளன. வசனம் அடுத்தடுத்த பொருட்களின் பட்டியலுக்குள் அமைந்துள்ளதால் இறுதியில் நிறைவு முற்றுப்புள்ளி இடாமல் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘உபகரணங்கள்’ என்பது கோயில் வழக்குச் சொற்களில் மட்டுப்படாமல் சாதாரண வாசகருக்கும் புரியும் பரந்த சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
