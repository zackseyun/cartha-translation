  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: ta
  text: ஆறு நாட்கள் வேலை செய்யலாம்; ஆனால் ஏழாம் நாளோ முழுமையான ஓய்வுக்கான ஓய்வுநாள்; அது யாவேக்கு பரிசுத்தமானது.[a] ஓய்வுநாளில் வேலை செய்கிற எவரும் நிச்சயமாகக் கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓய்வுநாள், முழுமையான ஓய்வு.” எபிரெயச் சொற்றொடர் வேலை நிறுத்தி ஓய்வதைக் தீவிரமாக வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: வேலை செய்யலாம்
  rationale: நிஃபால் வினைவடிவின் அனுமதி அல்லது ஒழுங்குமுறை சார்ந்த பொருளை இயல்பான நவீன தமிழில் தருகிறது; இது வெறும் எதிர்காலக் கூற்றாக மாற்றப்படவில்லை.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ஆனால் ஏழாம் நாள்
  rationale: ו என்பதன் அடிப்படை இணைப்புப் பொருளை, ஆறு வேலைநாட்களுக்கும் ஏழாம் நாளுக்கும் இடையிலுள்ள தெளிவான முரண்பாட்டுக்கு ஏற்றவாறு ‘ஆனால்’ எனத் தருகிறது.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: முழுமையான ஓய்வின் ஓய்வுநாள்
  rationale: שַׁבָּתוֹן தரும் தீவிரப்படுத்தப்பட்ட நிறுத்தம் அல்லது ஓய்வு என்ற கருத்தையும், שַׁבַּת என்ற பெயரையும் தக்கவைக்கிறது.
- source_word: קֹדֶשׁ לַיהוָה
  choice: யாவேக்கு அர்ப்பணிக்கப்பட்ட பரிசுத்தமான
  rationale: קֹדֶשׁ குறிப்பிடும் பரிசுத்த நிலையையும் לַ குறிக்கும் யாவேக்கான அர்ப்பணிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-வை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: வேலை செய்கிற எவனும்
  rationale: כָּל உடனான வினையெச்சக் கட்டமைப்பின் பொதுவான, விதிசார் பரப்பைத் தக்கவைக்கிறது.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: ஓய்வுநாளில்
  rationale: ‘ஓய்வுநாள்’ என்பதே יום השבת-இன் நாள் சார்ந்த பொருளை இயல்பாக உள்ளடக்குவதால் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: முற்றுப்பெயரெச்சம் மற்றும் ஹொஃபால் வினைவடிவம் தரும் வலியுறுத்தலையும் செயப்பாட்டு மரணத் தண்டனையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
