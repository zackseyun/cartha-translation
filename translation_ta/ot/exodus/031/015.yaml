  alternative: ஓய்வுநாள், சிறப்பான ஓய்வு; முற்றிலும் ஓய்ந்திருக்கும் நாள்
  rationale: பிற்காலக் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமல், எபிரெயச் சொற்றொடரின் தீவிரமான நிறுத்தம் அல்லது ஓய்வு என்ற கருத்தைத் தக்கவைக்கிறது.
