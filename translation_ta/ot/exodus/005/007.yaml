translation:
  language: ta
  text: “செங்கற்கள் செய்வதற்காக மக்களுக்கு இனி வைக்கோல் கொடுக்காதீர்கள்; முன்பு போல. அவர்களே போய்த் தங்களுக்காக வைக்கோலைச் சேகரித்துக்கொள்ளட்டும்.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹאסִפוּן לָתֵת
  choice: இனி கொடுக்காதீர்கள்
  rationale: எதிர்மறையுடன் வரும் יסף வினையின் ஹிப்ஈல் வடிவம், முன்பு தொடர்ந்து செய்யப்பட்ட செயலை நிறுத்தும்படி கூறுகிறது. ‘இனி ... கொடுக்காதீர்கள்’ என்பது அந்தத் தொடர்ச்சி நிறுத்தப்படுவதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: תֶּבֶן
  choice: வைக்கோல்
  rationale: களிமண்ணோடு கலந்து செங்கல் செய்யப் பயன்படுத்தப்பட்ட தாவரத் தண்டுப் பொருளுக்கான வழக்கமான, புரிந்துகொள்ள எளிய தமிழ்ச் சொல்; வசனத்தின் இரு இடங்களிலும் ஒரே சொல்லாகப் பேணப்பட்டுள்ளது.
- source_word: לָעָם
  choice: மக்களுக்கு
  rationale: עַם என்பதன் நேரடிப் பொருள் ‘மக்கள்’. சூழலில் இஸ்ரவேலரான தொழிலாளர்கள் குறிக்கப்பட்டாலும், மூலத்தின் பொதுவான சொல்லை தேவையின்றிக் குறுக்காமல் வைத்திருக்கிறது.
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: செங்கற்கள் செய்வதற்காக
  rationale: வினையெச்சமும் அதன் செயப்படுபொருளும் நோக்கத்தைத் தெரிவிக்கின்றன. இந்தத் தமிழாக்கம் அந்த நோக்க உறவைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: முன்பு செய்ததுபோல்
  rationale: சொல்லளவில் முந்தைய நாட்களைக் குறிப்பிடும் இத்தொடர், இங்கு பழைய வழக்கத்தைக் குறிக்கும் கால மரபுத்தொடர். ‘முன்பு செய்ததுபோல்’ என்பது தற்போதைய சூழலோடு அதன் ஒப்பீட்டைத் தெளிவாக்குகிறது; சொல்லளவிலான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הֵם יֵלְכוּ
  choice: அவர்களே போய் ... கொள்ளட்டும்
  rationale: தனிப்பட்ட சுட்டுப்பெயருடன் வரும் நிறைவுறா வினை இச்சூழலில் கட்டளைசார் அனுமதி அல்லது உத்தரவு வலிமை பெறுகிறது. ‘அவர்களே’ என்பது வைக்கோலை வழங்குவோருக்கு மாறாக மக்கள் தாங்களே செல்ல வேண்டும் என்ற வலியுறுத்தலைக் காட்டுகிறது.
- source_word: וְקֹשְׁשׁוּ
  choice: சேகரித்துக்கொள்ளட்டும்
  rationale: קשש என்பது சிதறிக் கிடப்பவற்றைப் பொறுக்கிச் சேர்ப்பதை அல்லது சேகரிப்பதைக் குறிக்கிறது. ‘சேகரித்துக்கொள்ளட்டும்’ என்பது செயலும் அது அவர்களுக்காகவே செய்யப்படுவதும் இயல்பாக வெளிப்படச் செய்கிறது.
- source_word: לָהֶם
  choice: தங்களுக்குத் தேவையான
  rationale: இத்திசைவேற்றுமைச் சுட்டுப்பெயர் வைக்கோலை அவர்கள் தங்களுக்காகப் பெற வேண்டும் என்பதைக் குறிக்கிறது. தமிழில் ‘தங்களுக்குத் தேவையான ... சேகரித்துக்கொள்ளட்டும்’ என்பது அந்தத் தன்னலன்/தமக்கான பயன் பொருளை தெளிவாகத் தருகிறது.
