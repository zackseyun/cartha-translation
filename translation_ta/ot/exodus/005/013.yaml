  register: நவீன பொதுத்தமிழில், கண்ணியமானதும் வாய்விட்டு வாசிக்க இயல்பானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. கட்டாய உழைப்பின் கடுமை ‘தொடர்ந்து நெருக்கி’ என்பதில் வெளிப்படுகிறது; எபிரெய மரபுத்தொடரின் சிறு தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
