base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/013.yaml
  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: ta
  text: கட்டாய வேலைவாங்குவோர் அவர்களைத் தொடர்ந்து நெருக்கி, “வைக்கோல் இருந்தபோது போலவே, உங்கள் வேலைகளை—ஒவ்வொரு நாளின் பணியை அந்தந்த நாளிலேயே[a]—முடித்துவிடுங்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மரபுத்தொடரைச் சொற்சொல்லாக மொழிபெயர்த்தால், “ஒரு நாளின் காரியத்தை அதன் நாளில்” என வரும். இது ஒவ்வொரு நாளுக்கும் நிர்ணயிக்கப்பட்ட பணி அளவை அந்த நாளிலேயே முடிப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: வேலையை வாங்குகிறவர்கள்
  rationale: கட்டாய உழைப்பையும் நிர்ணயிக்கப்பட்ட வேலை அளவையும் இஸ்ரவேலரிடமிருந்து வாங்கிய அதிகாரிகளைச் சூழலுக்கேற்றவாறு குறிக்கிறது; பொதுவான ‘மேற்பார்வையாளர்கள்’ என்பதைவிட எபிரெயச் சொல்லின் வற்புறுத்தும் தன்மையை வெளிப்படுத்துகிறது.
- source_word: אָצִים
  choice: தொடர்ந்து நெருக்கி
  rationale: நிகழ்ந்துகொண்டிருந்த வலுக்கட்டாய அழுத்தத்தைப் பங்கேற்புவினை வடிவம் காட்டுவதால், அதன் நீடித்த தன்மையையும் கடுமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: כַּלּוּ
  choice: முடித்துவிடுங்கள்
  rationale: ஒப்படைக்கப்பட்ட வேலையை முழுமையாக முடிக்கும்படி இடப்பட்ட நேரடியான கட்டளையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מַעֲשֵׂיכֶם
  choice: வேலையை
  rationale: உடனடிச் சூழலில் செங்கல் செய்யும் கட்டாயப் பணியைக் குறித்தாலும், எபிரெயச் சொல்லின் பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: ஒவ்வொரு நாளுக்கும் உரிய வேலையை அந்தந்த நாளிலேயே
  rationale: ‘ஒரு நாளின் காரியம் அதன் நாளில்’ என்ற எபிரெய மரபுத்தொடரின் வடிவத்தையும், நாள்தோறும் முடிக்க வேண்டிய நிர்ணயிக்கப்பட்ட பணியையும் இயல்பான தமிழில் தெரிவிக்கிறது; ‘ஒதுக்கீடு’ என்ற விளக்கத்தை பிரதான உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: כַּאֲשֶׁר
  choice: செய்ததுபோல
  rationale: முந்தைய சூழ்நிலையோடு ஒப்பிடப்படுவதைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: בִּהְיוֹת הַתֶּבֶן
  choice: வைக்கோல் இருந்தபோது
  rationale: வைக்கோல் கிடைத்த முந்தைய நிலையைச் சுருக்கமாகவும் உண்மையாகவும் தருகிறது; அது வழங்கப்பட்டது என்பதைச் சூழல் உணர்த்தினாலும் இங்கு வெளிப்படையாகச் சேர்க்கவில்லை.
