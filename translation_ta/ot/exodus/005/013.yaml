revisions:
- from: வேலையை வாங்குகிறவர்கள் அவர்களைத் தொடர்ந்து நெருக்கி, “வைக்கோல் இருந்தபோது செய்ததுபோல, ஒவ்வொரு நாளுக்கும் உரிய வேலையை அந்தந்த நாளிலேயே முடித்துவிடுங்கள்[a]” என்றார்கள்.
  to: கட்டாய வேலைவாங்குவோர் அவர்களைத் தொடர்ந்து நெருக்கி, “வைக்கோல் இருந்தபோது போலவே, உங்கள் வேலைகளை—ஒவ்வொரு நாளின் பணியை அந்தந்த நாளிலேயே[a]—முடித்துவிடுங்கள்” என்றார்கள்.
  rationale: The revision replaces an ambiguous designation of the coercive labor officials with a clear contextually faithful Tamil term. It retains the Hebrew daily-duty idiom in a readable form, while the footnote preserves the literal wording and appropriately marks the quota interpretation as contextual rather than mandatory in the main text.
