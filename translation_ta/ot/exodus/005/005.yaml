  yaml_path: translation/ot/exodus/005/005.yaml
  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: ta
  text: பார்வோன், “இதோ, இப்போது நாட்டின் மக்கள் ஏராளமாக இருக்கிறார்கள்; நீங்களோ அவர்களை அவர்களின் சுமை வேலைகளிலிருந்து ஓயச் செய்கிறீர்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை அவர்களின் வேலைகளிலிருந்து நிறுத்தச் செய்கிறீர்கள்” அல்லது “அவர்களை அவர்களின் சுமைகளிலிருந்து ஓய்வெடுக்கச் செய்கிறீர்கள்.” எபிரெய வினைச்சொல் பிறவினைப் பொருளில், ‘ஓயச் செய்தல்/நிறுத்தச் செய்தல்’ என்று அர்த்தம் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: பார்வோன் வலியுறுத்திக் கவனத்தை ஈர்ப்பதை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רַבִּים
  choice: ஏராளமாயிருக்கிறார்கள்
  rationale: மக்களின் எண்ணிக்கை மிகுந்திருப்பதைக் குறிக்கும் எபிரெய முன்நிலைப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: עַם הָאָרֶץ
  choice: நாட்டின் மக்கள்
  rationale: சூழலில் இஸ்ரவேலரைக் குறித்தாலும், எபிரெயச் சொற்றொடரின் வெளிப்படையான ‘நாட்டின் மக்கள்’ என்ற வடிவத்தை விளக்கமாகச் சுருக்காமல் பாதுகாக்கிறது.
- source_word: עַתָּה
  choice: இப்போது
  rationale: தற்போதைய நிலையைச் சுட்டும் கால வினையடையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְהִשְׁבַּתֶּם
  choice: ஓயச் செய்கிறீர்கள்
  rationale: שׁבת என்பதன் causative வடிவமான ‘நிறுத்தச் செய்தல்/ஓயச் செய்தல்’ என்ற பொருளைப் பாதுகாக்கிறது; பன்மை முன்னிலையையும் நிகழ்காலப் புகாரின் தொனியையும் வெளிப்படுத்துகிறது.
- source_word: מִסִּבְלֹתָם
  choice: தங்கள் சுமை வேலைகளிலிருந்து
  rationale: இச்சூழலில் סִבְלֹת என்பது உடல் சுமைகளை மட்டும் அல்லாமல் இஸ்ரவேலர்மேல் சுமத்தப்பட்ட கடுமையான உழைப்பையும் குறிக்கிறது; ‘சுமை வேலைகள்’ இரு கருத்துகளையும் சுருக்கமாக இணைக்கிறது.
