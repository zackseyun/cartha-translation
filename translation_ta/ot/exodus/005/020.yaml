revisions:
- from: அவர்கள் பார்வோனிடமிருந்து வெளியே வந்தபோது, தங்களைச் சந்திப்பதற்காக நின்றுகொண்டிருந்த மோசேயையும் ஆரோனையும் சந்தித்தார்கள்.[a]
  to: அவர்கள் பார்வோனிடமிருந்து வெளியே வந்தபோது, அவர்களைச் சந்திக்க நின்றுகொண்டிருந்த மோசேயையும் ஆரோனையும் சந்தித்தார்கள்.[a]
  rationale: The revision changes only the pronoun governing the purpose phrase, so that Moses and Aaron are standing to meet ‘them’—the persons exiting from Pharaoh—as in the Hebrew. The lexical-alternative footnote is retained, with slightly smoother wording.
