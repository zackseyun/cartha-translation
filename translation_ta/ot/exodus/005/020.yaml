  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘சந்தித்தல்’ என்ற சொல் மீளுருவாக்கம் தமிழிலும் காக்கப்பட்டுள்ளது; இதனால் செயலும் மோசே–ஆரோனின் காத்திருக்கும் நோக்கமும் தனித்தனியாகத் தெளிவாகின்றன.
