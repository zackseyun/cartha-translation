base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/020.yaml
  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: ta
  text: அவர்கள் பார்வோனிடமிருந்து வெளியே வந்தபோது, அவர்களைச் சந்திக்க நின்றுகொண்டிருந்த மோசேயையும் ஆரோனையும் சந்தித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதிர்ப்பட்டார்கள்”; சில சூழல்களில் இந்த வினைச்சொல் “மோதினார்கள்” என்ற தொனியையும் தரக்கூடும். இங்கே மூலச் சொல் பகைமைத் தொனியைக் கட்டாயப்படுத்தாததால், முதன்மைப் பாடத்தில் பொதுவான “சந்தித்தார்கள்” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: சந்தித்தார்கள்
  rationale: פגע என்ற வினைச்சொல் ‘சந்தித்தல்’ அல்லது ‘எதிர்ப்படுதல்’ என்று பொருள்படலாம்; சில சூழல்களில் மோதலின் தொனியையும் கொண்டிருக்கலாம். அடுத்த வசனத்தில் கடுமையான பேச்சு வந்தாலும், இங்கே அந்தத் தொனியை வினைச்சொல் கட்டாயப்படுத்தவில்லை. ஆகவே விரிந்த, நடுநிலையான பொருளை ‘சந்தித்தார்கள்’ காக்கிறது.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: மோசேயையும் ஆரோனையும்
  rationale: எபிரெய நேரடி வேற்றுமை உருபுகள் தமிழில் ‘-ஐ’ உருபாலும் இணைப்பைக் காட்டும் ‘-உம்’ விகுதியாலும் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: נִצָּבִים
  choice: நின்றுகொண்டிருந்த
  rationale: נצב என்பதன் வினையெச்ச வடிவம் தொடர்ந்து நின்றிருந்த நிலையைக் காட்டுகிறது. ‘நின்றுகொண்டிருந்த’ என்பது அந்த நீடித்த காட்சியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לִקְרָאתָם
  choice: தங்களைச் சந்திப்பதற்காக
  rationale: לקראת என்பது ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்லுதல் அல்லது அவரைச் சந்திக்கக் காத்திருத்தல் என்ற பொருளைத் தருகிறது. இங்கே ‘சந்திப்பதற்காக’ என்பது பகைமைத் தொனியைத் தேவையின்றி சேர்க்காமல் நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: בְּצֵאתָם
  choice: அவர்கள் ... வெளியே வந்தபோது
  rationale: בְּ முன்னொட்டுடன் வரும் வினையெச்சத் தொடர் காலச் சூழலைக் குறிக்கிறது; ‘வெளியே வந்தபோது’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מֵאֵת פַּרְעֹה
  choice: பார்வோனிடமிருந்து
  rationale: מֵאֵת என்பது ஒருவரிடமிருந்து அல்லது அவரது முன்னிலையிலிருந்து விலகி வருவதைக் குறிக்கலாம். ‘பார்வோனிடமிருந்து’ என்பது சுருக்கமாகவும் தமிழில் இயல்பாகவும் உள்ளது.
