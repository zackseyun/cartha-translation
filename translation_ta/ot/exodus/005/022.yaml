base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: ta
  text: பின்பு மோசே யெகோவாவிடம் திரும்பி வந்து, “ஆண்டவரே, ஏன் இந்த மக்களுக்குத் தீங்கு வரச் செய்தீர்? பின் ஏன் என்னை அனுப்பினீர்?” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொற்சார்ந்து: “ஏன் இது—என்னை அனுப்பினீர்?” இது வலியுறுத்திக் கேட்கும் மரபுத்தொடர்; “பின் ஏன் என்னை அனுப்பினீர்?” என்பது அதன் பொருள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பிச் சென்று
  rationale: שׁוב என்பதன் இயல்பான பொருள் ‘திரும்புதல்’. பார்வோனிடம் ஏற்பட்ட விளைவுக்குப் பிறகு மோசே கடவுளிடம் மீண்டும் முறையிடச் சென்றதை இச்சொற்றொடர் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶל יְהוָה
  choice: யெகோவாவிடம்
  rationale: אֶל என்பது இங்கு ‘இடம்/அவரிடம்’ என்று பொருள்படும். יהוה என்ற உடன்படிக்கைப் பெயர் பொதுவாக அறியப்படும் தமிழ் வடிவமான ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: தெய்வத்தை நேரடியாகவும் மரியாதையுடனும் அழைக்கும் எபிரெய வடிவத்தை இயல்பான தமிழ் விளிவடிவம் வெளிப்படுத்துகிறது.
- source_word: לָמָה
  choice: ஏன்
  rationale: இரு இடங்களிலும் காரணம் கேட்கும் நேரடியான வினாச்சொல்.
- source_word: הֲרֵעֹתָה
  choice: தீங்கு நேரச் செய்தீர்
  rationale: רעע என்பதன் ஹிஃபில் வடிவம் தீமை அல்லது தீங்கை விளைவித்தல் என்ற causative பொருளைத் தருகிறது. இச்சூழலில் ஒழுக்கத் தீமை செய்ததாகத் தீர்மானிக்காமல், மக்களுக்குத் தீங்கான நிலை ஏற்படச் செய்ததாக மோசே குற்றம்சாட்டும் பதற்றத்தை இது காக்கிறது.
- source_word: לָעָם הַזֶּה
  choice: இந்த மக்களுக்கு
  rationale: עָם என்பது இஸ்ரவேலரை ஒரு கூட்டு மக்களாகக் குறிக்கிறது; ‘மக்கள்’ என்பது தற்போதைய தமிழில் இயல்பான தெரிவு.
- source_word: לָמָּה זֶּה
  choice: பின் ஏன்
  rationale: ‘ஏன்—இது’ எனச் சொற்பொருள்படும் வலியுறுத்தல் கொண்ட எபிரெய மரபுத்தொடரை இயல்பான தமிழில் காரணத் தொடர்பை வலியுறுத்தும் ‘பின் ஏன்’ என வழங்குகிறது; அதன் சொற்சார்ந்த அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁלַחְתָּנִי
  choice: என்னை அனுப்பினீர்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை வினையும் முதலாம் நபர் ஒருமை பின்னொட்டும் நேரடியாக இவ்வாறு மொழிபெயர்கின்றன; மரியாதைப் பன்மை தெய்வத்தை நோக்கிய தமிழுக்கு ஏற்றது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது. ‘யெகோவா’ என்பது தமிழில் பரவலாக அறியப்படும் வடிவம்; மூல உச்சரிப்பை மீட்டமைக்கும் ‘யாவே’ என்பதும் சாத்தியம்.
- issue: הֲרֵעֹתָה என்பதில் கடவுளும் தீங்கும் பற்றிய பதற்றம்
  choice: தீங்கு நேரச் செய்தீர்
  alternative: தீமை செய்தீர் / நிலைமையை மோசமாக்கினீர்
  rationale: மோசேயின் கூர்மையான முறையீட்டை மழுங்கடிக்காமல், இது கடவுள் ஒழுக்கத் தீமை செய்தார் என மொழிபெயர்ப்பே முன்தீர்மானிப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். மோசேயின் துணிச்சலான முறையீடும் மூலத்தின் causative பொருளும் காக்கப்பட்டுள்ளன; மிகப் பழமையான நடை தவிர்க்கப்பட்டுள்ளது.
