base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: ta
  text: அவர்கள் நேற்றும் அதற்கு முந்தின நாளும்[a] செய்துவந்த செங்கற்களின் நிர்ணயிக்கப்பட்ட அளவையே அவர்கள்மேல் சுமத்துங்கள்; அதில் எதையும் குறைக்காதீர்கள். ஏனெனில், அவர்கள் சோம்பேறிகள். அதனால்தான், ‘நாம் போய் நம் கடவுளுக்குப் பலி செலுத்துவோம்’ என்று கூக்குரலிடுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தச் சொற்றொடரை, “முன்பு” அல்லது “முன்புபோல” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: நிர்ணயிக்கப்பட்ட அளவு
  rationale: இச்சூழலில் தொழிலாளர்கள் கட்டாயமாக உற்பத்தி செய்ய வேண்டிய குறிப்பிட்ட எண்ணிக்கை அல்லது அளவை இது குறிக்கிறது; ‘நிர்ணயிக்கப்பட்ட அளவு’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַלְּבֵנִים
  choice: செங்கற்கள்
  rationale: செங்கல் தயாரிக்கும் பணியைச் சுட்டும் நேரடியான பொருள்.
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: நேற்றும் அதற்கு முந்தின நாளும்
  rationale: எபிரெயச் சொற்றொடரின் காலக் குறிப்பை நெருக்கமாகப் பாதுகாக்கிறது; அது பொதுவாக ‘முன்பு’ அல்லது ‘முன்புபோல’ என்ற வழக்குப் பொருளிலும் வரலாம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: அவர்கள்மேல் சுமத்துங்கள்
  rationale: உற்பத்தி இலக்கைத் தொழிலாளர்கள் மீது கட்டாயக் கடமையாக விதிக்கும் நிர்வாக வலிமையை ‘சுமத்துங்கள்’ வெளிப்படுத்துகிறது.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: அதில் எதையும் குறைக்காதீர்கள்
  rationale: நிர்ணயிக்கப்பட்ட அளவிலிருந்து எந்தப் பகுதியையும் குறைக்கக் கூடாது என்ற கட்டளையைத் தெளிவாகக் கூறுகிறது.
- source_word: נִרְפִּים
  choice: சோம்பேறிகள்
  rationale: பார்வோன் இஸ்ரவேலர்மீது சுமத்தும் குற்றச்சாட்டை நேரடியாக வெளிப்படுத்துகிறது; இது உரையாசிரியரின் மதிப்பீடாக அல்லாமல் பேசுபவரின் குற்றச்சாட்டாகச் சூழலில் தெளிவாக உள்ளது.
- source_word: צֹעֲקִים
  choice: கூக்குரலிடுகிறார்கள்
  rationale: வலிமையாகக் குரல் எழுப்புதல் அல்லது முறையிடுதல் என்ற தொடர்வினைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: நாம் போய் … பலி செலுத்துவோம்
  rationale: முதல் நபர் பன்மை விருப்பவினைகளின் வேண்டுகோள் அல்லது தீர்மானத் தொனியை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: לֵאלֹהֵינוּ
  choice: நம் கடவுளுக்கு
  rationale: பலியின் பெறுநரைச் சுட்டும் எளிய முன்னிடைத் தொடரின் நேரடியான மொழிபெயர்ப்பு.
