  source_fidelity: 'மூல எபிரெயத்தின் கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: செங்கற்களின் உற்பத்தி ஒதுக்கீடு, அதை அவர்கள்மீது சுமத்துதல், எந்தக் குறைப்பும் செய்யக்கூடாத கட்டளை, பார்வோனின் ‘சோம்பேறிகள்’ என்ற குற்றச்சாட்டு, மற்றும் போய்ப் பலியிட வேண்டுமென்ற அவர்களது கூக்குரல் ஆகியவை அனைத்தும் தெளிவாக உள்ளன. תְּמוֹל שִׁלְשֹׁם என்பதன் நேரடியான காலக் குறிப்பு உரையிலும், அதன் பரந்த வழக்குப் பொருள் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.'
