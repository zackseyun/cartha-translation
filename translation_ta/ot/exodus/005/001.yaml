source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: ta
  text: 'பின்னர் மோசேயும் ஆரோனும் பார்வோனிடம் சென்று, “இஸ்ரவேலின் கடவுளாகிய யாவே[a] இவ்வாறு கூறுகிறார்: என் மக்களைப் போகவிடு; அவர்கள் வனாந்தரத்தில் எனக்கெனப் பண்டிகை கொண்டாடட்டும்[b]” என்றார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: YHWH; இது கடவுளின் தனிப்பெயர். தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.'
    reason: divine_name
  - marker: b
    text: ‘எனக்காக ஒரு விழாவைக் கொண்டாடட்டும்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேய வினைச்சொல் ஒரு சமயப் பண்டிகையை அனுசரிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: பின்னர்
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத் தொடர்ச்சியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இடைப்பட்ட காலத்தின் நீளத்தைத் தேவையின்றி வரையறுப்பதில்லை.
- source_word: בָּאוּ
  choice: பார்வோனிடம் சென்று
  rationale: இங்கு மோசேயும் ஆரோனும் பார்வோனின் முன்னிலைக்குச் செல்வதைக் சூழல் உணர்த்துகிறது. தமிழில் ‘பார்வோனிடம் சென்று’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיֹּאמְרוּ אֶל־פַּרְעֹה
  choice: பார்வோனிடம் ... என்றார்கள்
  rationale: எபிரேயக் கதைநடையின் வழக்கமான பேச்சு அறிமுகத்தை இயல்பான தமிழ்ச் சொற்றொடராக வழங்குகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: அதிகாரப்பூர்வமான தூதர் அறிவிப்புச் சூத்திரத்தின் வலிமையைப் பாதுகாக்கிறது; அதேவேளை நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரேய மெய்யெழுத்துப் பெயரான YHWH. அதன் தனிப்பெயர் தன்மையைப் பாதுகாக்கத் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: எபிரேய இணைப்புத் தொடரைத் தெளிவாகவும் இயல்பாகவும் வழங்கி, யாவேயை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்துகிறது.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: என் மக்களைப் போகவிடு
  rationale: பார்வோன் இஸ்ரவேலரை விடுவிக்க வேண்டும் என்ற கட்டளையின் நேரடியான வலிமையைப் பாதுகாக்கும் இயல்பான தமிழ்.
- source_word: וְיָחֹגּוּ לִי
  choice: அவர்கள் ... எனக்காகப் பண்டிகை கொண்டாடட்டும்
  rationale: חגג என்பது பொதுவான வழிபாட்டை மட்டும் அல்லாமல் ஒரு சமயப் பண்டிகையைக் கொண்டாடுவதைக் குறிக்கிறது. ‘பண்டிகை கொண்டாடு’ அந்தச் சிறப்பு பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மணற்பாலைவனத்தை மட்டும் குறிக்காமல் குடியிருப்புகள் குறைந்த காட்டுப்புற வறண்ட நிலத்தையும் குறிக்கலாம். ‘வனாந்தரம்’ அந்தப் பரந்த பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் பொதுப் பட்டப்பெயர் அல்லாமல் YHWH என்ற தனிப்பெயர் நேரடியாக வருகிறது. எனவே பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, அதன் உடன்படிக்கைப் பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: וְיָחֹגּוּ לִי என்பதன் நோக்கமும் வழிபாட்டு நுணுக்கமும்
  choice: அவர்கள் ... எனக்காகப் பண்டிகை கொண்டாடட்டும்
  alternative: அவர்கள் எனக்கு வழிபாடு செய்யட்டும்
  rationale: மூல வினைச்சொல் குறிப்பாகப் பண்டிகை அனுசரிப்பதைக் குறிக்கிறது. அதை பொதுவான ‘வழிபாடு’ என்று விரிவாக்குவது மூலத்தின் விழா சார்ந்த நுணுக்கத்தை இழக்கச் செய்யும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கூறுவது இதுவே’ அதிகாரப்பூர்வ அறிவிப்பின் தொனியைக் காக்கிறது. ‘வனாந்தரம்’ என்ற சொல் சற்றே வேதாகமப் பதிவை நினைவூட்டினாலும், ‘பாலைவனம்’ என்பதைக் காட்டிலும் மூலச் சொல்லின் பரந்த நிலவியல் பொருளைத் துல்லியமாகப் பாதுகாக்கிறது. அடிக்குறிப்பு [a] தொடர்புடைய இறைப்பெயருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
