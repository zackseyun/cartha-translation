translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பார்வோனை நோக்கிய மரியாதை ஒருமை (‘உமது’, ‘செய்கிறீர்’) பேச்சாளர்களின் தாழ்மையான முறையீட்டு நிலையைக் காட்டுகிறது; צעק என்பதின் தீவிரம் ‘கூக்குரலிட்டு’ என்பதில் தக்கவைக்கப்பட்டுள்ளது.
