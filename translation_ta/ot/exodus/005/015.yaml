source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּצְעֲק֥וּ אֶל פַּרְעֹ֖ה לֵ/אמֹ֑ר לָ֧/מָּה תַעֲשֶׂ֦ה כֹ֖ה לַ/עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் மக்களின்[a] அதிகாரிகள் பார்வோனிடம் வந்து கூக்குரலிட்டு, “உமது பணியாளர்களுக்கு[b] ஏன் இப்படி செய்கிறீர்?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “இஸ்ரவேலின் மகன்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “உமது அடிமைகளுக்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: அப்போது ... வந்து
  rationale: வழக்குரையின் தொடர்ச்சியை wayyiqtol முன்னெடுக்கிறது; ‘அப்போது’ நிகழ்வின் தொடரை இயல்பான தமிழில் காட்டுகிறது.
- source_word: שֹׁטְרֵי
  choice: அதிகாரிகள்
  rationale: எகிப்திய ஆட்சிக்குக் கீழ் இஸ்ரவேலரின் வேலைகளை நிர்வகித்த கீழ்நிலைப் பொறுப்பாளர்களைக் குறிக்கிறது. ‘அதிகாரிகள்’ அவர்களின் அதிகாரப்பூர்வப் பங்கைத் தக்கவைக்கிறது; ‘மேற்பார்வையாளர்கள்’ என்பது சாத்தியமானாலும் சற்றுக் குறுகிய பொருளுடையது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இனக்குழுவைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது; நேரடி குடும்பச் சொல்லாக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּצְעֲקוּ
  choice: கூக்குரலிட்டு
  rationale: இவ்வினைச்சொல் சாதாரணமாகப் பேசுவதைவிட, நெருக்கடியான உரத்த முறையீட்டைக் குறிக்கிறது.
- source_word: אֶל־פַּרְעֹה
  choice: பார்வோனிடம்
  rationale: முறையீடு பார்வோனை நோக்கிச் செலுத்தப்பட்டதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: என்றார்கள்
  rationale: எபிரெயச் சொற்பொழிவு அறிமுகத்தை மேற்கோளுக்குப் பின் வரும் இயல்பான தமிழ் அமைப்பில் வழங்குகிறது.
- source_word: לָמָּה תַעֲשֶׂה כֹה
  choice: ஏன் இப்படி செய்கிறீர்?
  rationale: ‘ஏன் இவ்வாறு செய்கிறீர்?’ என்பதன் நேரடியான பொருளை, மரியாதை ஒருமையுடன் இயல்பான தற்போதைய தமிழில் தருகிறது.
- source_word: לַעֲבָדֶיךָ
  choice: உமது பணியாளர்களுக்கு
  rationale: עבד என்பது ‘பணியாளர்’ அல்லது ‘அடிமை’ எனப் பொருள்படலாம். பார்வோனிடம் தங்களைத் தாழ்த்திப் பேசும் அரசவை முறையீட்டுக்கு ‘பணியாளர்கள்’ பொருந்துகிறது; வலுவான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
