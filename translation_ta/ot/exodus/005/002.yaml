  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: ta
  text: பார்வோன், “யாவே[a] யார், அவருடைய குரலுக்குக் கீழ்ப்படிந்து இஸ்ரவேலை நான் போகவிட வேண்டும்? யாவேவை நான் அறியேன்; மேலும், இஸ்ரவேலை நான் போகவிடமாட்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: ‘YHWH’ என்ற தெய்வீகப் பெயர்; மரபாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது. ‘யாவே’ மற்றும் ‘யெகோவா’ மாற்று வடிவங்கள்.'
    reason: தெய்வீகப் பெயரின் எபிரேய மூலவடிவத்தையும் மரபான மற்றும் மாற்று தமிழ் வழங்கல்களையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரேய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
- source_word: מִי
  choice: யார்?
  rationale: அடையாளத்தை வினவும் சொல்லாகவும் பார்வோனின் இகழ்ச்சியான சவாலின் தொனியைத் தக்கவைக்கும் இயல்பான தமிழாகவும் உள்ளது.
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: நான் அவருடைய குரலுக்குக் கீழ்ப்படிந்து ... வேண்டுமா?
  rationale: שׁמע בְּקוֹל என்பதன் ‘குரலைக் கேட்டு கீழ்ப்படிதல்’ என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வினாவின் எதிர்ப்புத் தொனியையும் காக்கிறது.
- source_word: לְשַׁלַּח
  choice: போகவிட
  rationale: யாத்திராகமச் சூழலில் இஸ்ரவேலரை விடுவித்து அனுப்புவதைக் குறிக்கும் இயல்பான தமிழ் தொடர்.
- source_word: יָדַעְתִּי
  choice: நான் அறியேன்
  rationale: பார்வோனின் தற்போதைய அறியாமை அல்லது அங்கீகரிக்க மறுக்கும் நிலை ஆகிய இரு சாத்தியங்களையும் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: וְגַם
  choice: '...வும்'
  rationale: முந்தைய கூற்றுடன் வலியுறுத்திச் சேர்க்கும் பொருளைச் சுருக்கமான, இயல்பான தமிழில் அளிக்கிறது.
- source_word: אֲשַׁלֵּחַ
  choice: நான் போகவிடமாட்டேன்
  rationale: பார்வோனின் உறுதியான மறுப்பை எதிர்கால/நோக்கத் தொனியுடன் வெளிப்படுத்துகிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: அரச பட்டத்திற்கான நிலைபெற்ற நவீனத் தமிழ் வடிவம்.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மக்கள்/தேசப் பெயருக்கான பரவலாக அறியப்பட்ட தமிழ் வேதாகம வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பெயரை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் காக்கிறது. தமிழ் வாசகர்களிடையே நிலைபெற்ற ‘யெகோவா’ வடிவம் முதன்மை உரையில் பயன்படுத்தப்படுகிறது; உச்சரிப்பு மறுகட்டமைப்பான ‘யாவே’ அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: יָדַעְתִּי என்பதில் அறிவா அல்லது அங்கீகாரமா
  choice: அறியேன்
  alternative: அங்கீகரிக்க மாட்டேன்
  rationale: எபிரேய வினைச்சொல் அறிதலையும் உறவு சார்ந்த அங்கீகாரத்தையும் உணர்த்தக்கூடும். ‘அறியேன்’ இந்தப் பொருள் விரிவைச் சுருக்காமல் வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் உரை அமைக்கப்பட்டுள்ளது. பார்வோனின் சவாலும் உறுதியான மறுப்பும் நேரடிப் பேச்சில் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன.
