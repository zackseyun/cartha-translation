source:
  edition: WLC
  text: וַ/יֹּ֛אמֶר נִרְפִּ֥ים אַתֶּ֖ם נִרְפִּ֑ים עַל כֵּן֙ אַתֶּ֣ם אֹֽמְרִ֔ים נֵלְכָ֖ה נִזְבְּחָ֥ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: ta
  text: ஆனால் அவன், “நீங்கள் சோம்பேறிகள், சோம்பேறிகள்![a] அதனால்தான் ‘நாங்கள் போய் யாவேக்குப் பலி செலுத்துவோம்’ என்று நீங்கள் சொல்கிறீர்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “சோம்பேறிகள், சோம்பேறிகள்” என்று வலியுறுத்துவதற்காகச் சொல் மீண்டும் வருகிறது; “மிகவும் சோம்பேறிகள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் அவன் … என்றான்
  rationale: தொடர்கதை வினையாகிய ‘அவன் சொன்னான்’ என்பதைச் சூழலிலுள்ள எதிர்மறைப் பதிலின் தன்மையுடன் இயல்பான தமிழில் காட்டுகிறது.
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: நீங்கள் சோம்பேறிகள், சோம்பேறிகள்!
  rationale: பார்வோனின் கடுமையான குற்றச்சாட்டையும், வலியுறுத்துவதற்காக எபிரெயத்தில் உள்ள சொல் மீளுரைப்பையும் அப்படியே காக்கிறது.
- source_word: עַל כֵּן
  choice: அதனால்தான்
  rationale: அவர்களுடைய வேண்டுகோளுக்கு அவர்களது சோம்பேறித்தனமே காரணம் என்று பார்வோன் கூறும் காரணத் தொடர்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֹמְרִים
  choice: சொல்கிறீர்கள்
  rationale: பன்மை முன்னிலையினரை நேரடியாகக் குறிக்கும் நிகழ்காலப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: நாங்கள் போய் … பலி செலுத்துவோம்
  rationale: இணைந்துள்ள இரண்டு தன்மைப் பன்மை விருப்பவினைகளின் முன்மொழிவு அல்லது உறுதியான விருப்பத்தை இயல்பான தமிழ் மேற்கோளாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்குப்
  rationale: ל முன்னொட்டின் பெறுநர்/நோக்குப் பொருளை நான்காம் வேற்றுமையில் காட்டி, יהוה என்ற உடன்படிக்கைப் பெயரை ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் இறைப்பெயர் நேரடியாக இருப்பதால் அதை பொதுப்பட்டமாக மாற்றாமல், பரவலாகப் புரிந்துகொள்ளத்தக்க தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- issue: נֵלְכָה נִזְבְּחָה என்பவற்றின் விருப்பவினைத் தன்மை
  choice: நாங்கள் போய் … பலி செலுத்துவோம்
  alternative: நாங்கள் போய்ப் பலி செலுத்தட்டும்
  rationale: இவை முதல் நபர் பன்மை cohortative வடிவங்கள். தமிழில் மேற்கோளுக்குள் ‘செலுத்துவோம்’ என்பது முன்மொழியப்பட்ட செயலை இயல்பாகக் காட்டுகிறது; கட்டளையாகவோ அனுமதி வேண்டுதலாகவோ மிகையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பார்வோனின் குற்றச்சாட்டின் கூர்மையையும் எபிரெயச் சொல் மீளுரைப்பையும் காக்கும் வகையில் வாக்கிய ஓசை அமைக்கப்பட்டுள்ளது.
