  text: תִּכְבַּ֧ד הָ/עֲבֹדָ֛ה עַל הָ/אֲנָשִׁ֖ים וְ/יַעֲשׂוּ בָ֑/הּ וְ/אַל יִשְׁע֖וּ בְּ/דִבְרֵי שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/009.yaml
  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
translation:
  language: ta
  text: வேலை அந்த ஆண்கள்மீது பாரமாக இருக்கட்டும்; அவர்கள் அதில் உழைக்கட்டும், பொய்யான வார்த்தைகளுக்குச் செவிசாய்க்காதிருக்கட்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கவனம் செலுத்தாதிருக்கட்டும்” அல்லது “பொருட்படுத்தாதிருக்கட்டும்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் கவனம் செலுத்துதல், பொருட்படுத்துதல் அல்லது செவிசாய்த்தல் ஆகிய பொருட்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  choice: பாரமாக இருக்கட்டும்
  rationale: כבד என்பதன் Qal வடிவம், ‘வேலை’ என்பதையே எழுவாயாகக் கொண்டு ‘பாரமாக இருக்கட்டும்’ என்று நேரடியாகக் கூறுகிறது. சூழலில் வேலைச்சுமையைக் கடுமையாக்கும் பார்வை இயல்பாக வெளிப்படுகிறது.
- source_word: הָעֲבֹדָה
  choice: வேலை
  rationale: செங்கல் செய்யும் கட்டாய உழைப்பை இங்கு குறிக்கிறது; நவீன தமிழில் ‘வேலை’ நேரடியாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַל הָאֲנָשִׁים
  choice: அந்த ஆண்கள்மீது
  rationale: עַל சுமை அவர்கள்மீது இருப்பதைக் காட்டுகிறது; הָאֲנָשִׁים குறிப்பாக ஆண்களைக் குறிக்கும் என்பதால் பொதுமைப்படுத்தாமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְיַעֲשׂוּ בָהּ
  choice: அவர்கள் அதில் உழைக்கட்டும்
  rationale: בָהּ என்பது ‘வேலை’யைக் குறிக்கிறது. עשה இச்சூழலில் அந்த வேலையைச் செய்வது அல்லது அதில் உழைப்பது என்ற பொருளைத் தருகிறது.
- source_word: וְאַל יִשְׁעוּ
  choice: செவிசாய்க்காதிருக்கட்டும்
  rationale: שעה என்பது கவனம் செலுத்துதல், பொருட்படுத்துதல், செவிசாய்த்தல் ஆகிய பொருட்களைத் தரலாம். ‘செவிசாய்க்காதிருக்கட்டும்’ என்பது இங்குள்ள தடைநோக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பொருள் வரம்பை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: பொய்யான வார்த்தைகளுக்கு
  rationale: דִּבְרֵי இங்கு சொல்லப்பட்ட வார்த்தைகளையும் שָׁקֶר பொய்மையையும் குறிக்கின்றன. பார்வோன் மோசே மற்றும் ஆரோனின் செய்தியை இவ்வாறு நிராகரிப்பதை மொழிபெயர்ப்பு நேரடியாகப் பாதுகாக்கிறது.
