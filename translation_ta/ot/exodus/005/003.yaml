  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: ta
  text: அவர்கள், “எபிரெயரின் கடவுள் எங்களைச் சந்தித்திருக்கிறார்[a]. தயவுசெய்து, நாங்கள் வனாந்தரத்திற்குள் மூன்று நாள் பயணம் செல்ல அனுமதியுங்கள்; அங்கே எங்கள் கடவுளாகிய யாவேக்குப் பலி செலுத்த வேண்டும். இல்லையென்றால், அவர் கொள்ளைநோயாலோ வாளாலோ எங்களைத் தாக்கக்கூடும்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களை அழைத்திருக்கிறார்.” எபிரேயச் சொற்றொடர் கடவுள் அவர்களைச் சந்தித்ததையோ அழைத்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: எபிரெயரின் கடவுள்
  rationale: மூலத்தின் இன-சமூகப் பெயரான ‘எபிரெயர்’ என்பதைக் காத்து, தொடரின் உடைமை உறவை இயல்பான தமிழில் தருகிறது.
- source_word: נִקְרָא עָלֵינוּ
  choice: எங்களைச் சந்தித்திருக்கிறார்
  rationale: קרא என்பதன் நிஃபால் வடிவமும் עַל என்பதும் இங்கு தெய்வீகச் சந்திப்பைக் குறிக்கலாம். ‘அழைத்திருக்கிறார்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נֵלֲכָה נָּא
  choice: சென்று … அனுமதிக்க வேண்டுகிறோம்
  rationale: கோஹோர்டேட்டிவின் வேண்டுகோள் தன்மையையும் נָא தரும் பணிவையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாள் பயணம்
  rationale: பயண நேரம் அல்லது தூரத்தைக் குறிக்கும் எபிரெய மொழிவழக்கைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: மணற்பாலை மட்டும் அல்லாமல் மக்கள் குடியிராத மேய்ச்சல் நிலம் உள்ளிட்ட பரந்த பொருளைக் கொண்ட מִדְבָּר என்பதற்கு ஏற்ற வேதாகமத் தமிழ்ச் சொல்.
- source_word: וְנִזְבְּחָה
  choice: பலி செலுத்த
  rationale: முந்தைய வேண்டுகோளின் நோக்கத்தைத் தமிழில் இயல்பாகக் காட்டுகிறது; தொடர்ச்சியான கோஹோர்டேட்டிவின் நோக்கப் பொருள் காக்கப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: நான்கு எழுத்துகளைக் கொண்ட தெய்வீகப் பெயரைப் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: פֶּן יִפְגָּעֵנוּ
  choice: இல்லையென்றால் அவர் … எங்களைத் தாக்கக்கூடும்
  rationale: פֶּן தரும் எச்சரிக்கை/தவிர்ப்பு நுணுக்கத்தையும், פגע இங்கு குறிக்கும் பகைமையான தண்டனைத் தாக்குதலையும் தெளிவான தமிழில் தருகிறது.
- source_word: בַּדֶּבֶר אֹו בֶחָרֶב
  choice: கொள்ளைநோயாலோ வாளாலோ
  rationale: தொற்றுப் பேரழிவையும் போர்வழி மரணத்தையும் குறிக்கும் இணையான தண்டனைச் சாதனங்களைத் தமிழில் சமச்சீராகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட ‘யாவே’ என்ற ஒலிபெயர்ப்பால் தருகிறது.
- issue: நோய் அல்லது வாளால் தாக்குபவர் யார்?
  choice: ‘அவர்’ என்பது யாவேவைக் குறிக்கிறது
  alternative: எழுவாயை மறைமுகமாக விடுதல்
  rationale: எபிரெய வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளது; அண்மையில் குறிப்பிடப்பட்ட யாவேவே இயல்பான எழுவாய். வசனத்தின் கடுமையான தெய்வீகத் தண்டனைச் சாத்தியம் மென்மையாக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’, ‘பலி செலுத்துதல்’, ‘கொள்ளைநோய்’ ஆகியவை வேதாகமச் சூழலைக் காக்கும் போதும் பொதுவாசகர்களுக்குப் புரியும் சொற்களாக உள்ளன. வேண்டுகோள் தமிழில் இயல்பாக அமைய வாக்கிய அமைப்பு மாற்றப்பட்டாலும், மூலத்தின் பொருள் மற்றும் எச்சரிக்கைத் தீவிரம் காக்கப்பட்டுள்ளன.
