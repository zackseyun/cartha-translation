translation_notes:
  register: நவீனத் தரத் தமிழில், அதிகாரியின் கடுமையான கட்டளைத் தொனியைச் சுருக்கமாகவும் கண்ணியமாகவும் காக்கிறது. ‘நீங்களே’ தொடக்க வலியுறுத்தலைப் பாதுகாக்கிறது; ‘ஏனெனில்’ எபிரெய இணைப்புச் சொல்லின் முதன்மையான காரணப்பொருளைக் காக்கிறது, மாற்றுச் சாயல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
