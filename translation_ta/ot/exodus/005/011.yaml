base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/011.yaml
  text: You yourselves[a], go and get straw for yourselves wherever you can find it[b], for nothing of your work will be reduced.
translation:
  language: ta
  text: நீங்களே போய், எங்கே கிடைக்கிறதோ அங்கிருந்து உங்களுக்காக வைக்கோலை எடுத்துக்கொள்ளுங்கள்[a]; ஏனெனில் உங்கள் வேலை சிறிதும் குறைக்கப்படாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சொல்லுக்கு நெருக்கமாக: “நீங்கள் கண்டுபிடிக்கும் இடத்திலிருந்து.”'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு நெருக்கமாக: “உங்கள் வேலையிலிருந்து ஒரு காரியமும் குறைக்கப்படுவதில்லை.” “ஏனெனில்” என்பதற்கான எபிரெயச் சொல், சூழலைப் பொறுத்து “ஆனால்” என்ற முரண்பாட்டுச் சாயலுடனும் புரிந்துகொள்ளப்படலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתֶּם
  choice: நீங்களே
  rationale: தொடர்ந்து வரும் பன்மைக் கட்டளைகளுக்கு முன் தனிப்பட்ட சுட்டுப்பெயர் வலியுறுத்தலுக்காக உள்ளது; ‘நீங்களே’ அந்த வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: לְכוּ
  choice: போய்
  rationale: הלך என்பதன் பன்மை கட்டளை வடிவம். அடுத்த கட்டளையுடன் இயல்பாக இணைக்கத் தமிழில் வினையெச்சமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: קְחוּ לָכֶם
  choice: உங்களுக்காக … எடுத்துக்கொள்ளுங்கள்
  rationale: קְחוּ என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்ளுங்கள்’ என்பதையும், לָכֶם தரும் ‘உங்களுக்காக/உங்களுக்கென’ என்ற பொருளையும் காக்கிறது.
- source_word: תֶּבֶן
  choice: வைக்கோல்
  rationale: செங்கல் தயாரிக்கும் இச்சூழலில் תֶּבֶן என்பது செங்கலுடன் கலப்பதற்குப் பயன்படுத்தப்பட்ட வைக்கோலைக் குறிக்கிறது.
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: எங்கே கிடைக்கிறதோ அங்கிருந்து
  rationale: எந்த இடத்தில் வைக்கோல் கிடைத்தாலும் அங்கிருந்து பெற்றுக்கொள்ள வேண்டும் என்ற திறந்த இடப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இங்கு כִּי, வைக்கோலை அவர்களே தேடிக்கொள்ள வேண்டும் என்ற கட்டளைக்குக் காரணமாக, அவர்களுடைய வேலை குறைக்கப்படாது என்பதை அறிமுகப்படுத்துகிறது.
- source_word: אֵין נִגְרָע
  choice: சிறிதும் குறைக்கப்படாது
  rationale: குறைப்பு எதுவும் செய்யப்படாது என்ற எதிர்மறை செயப்பாட்டு கருத்தைத் தெளிவான நவீன தமிழில் தருகிறது; கட்டளைச் சூழலுக்கு எதிர்கால வடிவம் பொருந்துகிறது.
- source_word: מֵעֲבֹדַתְכֶם דָּבָר
  choice: உங்கள் வேலை சிறிதும்
  rationale: עֲבֹדָה இங்கு விதிக்கப்பட்ட உழைப்பு அல்லது வேலையைக் குறிக்கிறது; דָּבָר எதிர்மறை அமைப்பில் ‘எதுவும் இல்லை/சிறிதும் இல்லை’ என்ற பொருளைத் தருகிறது.
