base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: ta
  text: பார்வோனின் வேலைக்கண்காணிப்பாளர்கள் இஸ்ரவேல் மக்கள்மேல் நியமித்திருந்த இஸ்ரவேல் மக்களின் பணித்தலைவர்கள் அடிக்கப்பட்டார்கள். “முன்புபோல[a] நேற்றும் இன்றும், செங்கல் செய்வதற்கான உங்கள் நிர்ணயிக்கப்பட்ட அளவை ஏன் நிறைவேற்றவில்லை?” என்று அவர்கள் கேட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “நேற்றும் அதற்கு முந்தின நாளும் போல”; இது “முன்புபோல” அல்லது “வழக்கம்போல” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: அடிக்கப்பட்டார்கள்
  rationale: נכה என்பதன் பன்மைச் செயலப்பாட்டு வடிவத்தைப் பேணி, தண்டனையின் குறிப்பிட்ட முறையை ஊகிக்காமல் உடல் ரீதியான அடியைக் குறிக்கிறது.
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் பணித்தலைவர்கள்
  rationale: கட்டாய உழைப்புச் சூழலில் இவர்கள் இஸ்ரவேலரிடையே தொழிலாளர்களைக் கண்காணித்த கீழ்நிலைப் பொறுப்பாளர்கள்; பொதுவான ‘அதிகாரிகள்’ என்பதைவிட ‘பணித்தலைவர்கள்’ கதைச் சூழலுக்குப் பொருந்துகிறது.
- source_word: נֹגְשֵׂי פַרְעֹה
  choice: பார்வோனின் வேலை வாங்கும் அதிகாரிகள்
  rationale: נֹגְשִׂים கட்டாய வேலையைச் செய்ய வற்புறுத்தும் எகிப்திய அதிகாரிகளைக் குறிக்கிறது; இயல்பான தமிழில் அவர்களின் பணியையும் அதிகார நிலையையும் வெளிப்படுத்துகிறது.
- source_word: חָקְכֶם
  choice: உங்கள் நிர்ணய அளவு
  rationale: חֹק இங்கு முன்குறிக்கப்பட்ட உற்பத்தி அளவைக் குறிக்கிறது; ‘நிர்ணய அளவு’ என்பது அளவுக் கட்டுப்பாட்டைத் தெளிவாகக் கூறுகிறது.
- source_word: לִלְבֹּן
  choice: நீங்கள் செய்யவேண்டிய செங்கல்கள்
  rationale: לבן என்ற வினையின் எச்ச வடிவம் செங்கல் செய்வதைக் குறிக்கிறது; தமிழில் நிர்ணய அளவுடன் இயல்பாக இணைய வினைசார் பொருளை இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: முன்புபோல
  rationale: சொல்லுக்குச் சொல் முந்தைய நாட்களைக் குறிப்பிடும் இந்த எபிரெய மரபுத்தொடர் ‘முன்பு செய்ததுபோல’ என்ற பொருளைக் கொண்டது; சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: நேற்றும் இன்றும்
  rationale: גַּם...גַּם என்னும் இணை வலியுறுத்தலை இயல்பான தமிழில் ‘-உம்...-உம்’ அமைப்பு பேணுகிறது.
theological_decisions:
- issue: לֵאמֹר என்பதுடன் வரும் கண்டனக் கூற்றின் பேசுபவர்
  choice: ‘என்று கேட்கப்பட்டது’ எனச் செயலப்பாட்டு அமைப்பில் தரப்பட்டது
  alternative: ‘என்று அவர்கள் கேட்டார்கள்’ என்று வேலை வாங்கும் அதிகாரிகளை வெளிப்படையான எழுவாயாக்குதல்
  rationale: எபிரெயம் பணித்தலைவர்கள் அடிக்கப்பட்டார்கள் என்று செயலப்பாட்டில் கூறிவிட்டு לֵאמֹר மூலம் கண்டனத்தை அறிமுகப்படுத்துகிறது. சூழலில் வேலை வாங்கும் அதிகாரிகளே பேசுபவர்கள் என்பது தெளிவாயினும், மூலத்தில் இல்லாத வெளிப்படையான எழுவாயைச் சேர்க்காமல் அதன் அமைப்பையும் சிறிய இலக்கணத் திறப்பையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பணித்தலைவர்கள்’ மற்றும் ‘வேலை வாங்கும் அதிகாரிகள்’ என்ற வேறுபாடு இஸ்ரவேலரான கீழ்நிலை மேற்பார்வையாளர்களையும் பார்வோனின் கட்டாய உழைப்பு அதிகாரிகளையும் தெளிவாகப் பிரிக்கிறது.
