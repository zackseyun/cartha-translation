base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/019.yaml
  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேல் மக்களின்[a] அதிகாரிகள் தாங்கள் இக்கட்டில் இருப்பதைக் கண்டுகொண்டார்கள்; ஏனெனில், “ஒவ்வொரு நாளுக்கும் நிர்ணயிக்கப்பட்ட செங்கற்களின் எண்ணிக்கையை நீங்கள் குறைக்கக் கூடாது”[b] என்று அவர்களிடம் சொல்லப்பட்டபோது அவ்வாறு இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “இஸ்ரவேலின் மகன்கள்.” இது இங்கு இஸ்ரவேல் மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மரபுத்தொடர் சொற்சொல்லாக, “ஒரு நாளின் காரியம் அதன் நாளில்”; அதாவது, ஒவ்வொரு நாளுக்கும் நிர்ணயிக்கப்பட்ட செங்கற்களின் எண்ணிக்கை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: கண்டுகொண்டார்கள்
  rationale: ראה என்பதன் அடிப்படைப் பொருளான ‘காணுதல்’ என்பதையும், இச்சூழலில் உள்ள ‘நிலைமையை உணர்தல்’ என்ற நுட்பத்தையும் இயல்பான தமிழில் ஒருங்கே தருகிறது.
- source_word: שֹׁטְרֵי
  choice: அதிகாரிகள்
  rationale: எகிப்திய ஆட்சிக்குக் கீழ் இஸ்ரவேலரிடையே பொறுப்பு வகித்த கீழ்நிலை நிர்வாகிகளைக் குறிக்கும் பரந்த சொல்லாக இது அமைகிறது; ‘மேற்பார்வையாளர்கள்’ என்பதும் சூழலுக்கேற்ற மாற்று.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் மக்களினப் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֹתָם בְּרָע
  choice: தாங்கள் இக்கட்டில் இருப்பதை
  rationale: பதிலிப்பெயர் அதிகாரிகளையே திரும்பச் சுட்டுகிறது. רָע இங்கு ஒழுக்கத் தீமையை அல்ல, கேடான அல்லது நெருக்கடியான நிலையைச் சுட்டுவதால் ‘இக்கட்டு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֵאמֹר
  choice: என்று சொல்லப்பட்டிருந்தது
  rationale: அவர்களுடைய இக்கட்டான நிலையை வெளிப்படுத்திய கட்டளையின் உள்ளடக்கத்தைத் தமிழில் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: לֹא תִגְרְעוּ
  choice: நீங்கள் குறைக்கக் கூடாது
  rationale: גרע என்பதன் ‘குறைத்தல், கழித்தல்’ என்ற பொருளையும் கட்டளையின் வலிமையையும் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: מִלִּבְנֵיכֶם
  choice: செங்கற்களின் அளவை
  rationale: לְבֵנִים என்பது ‘செங்கற்கள்.’ அடுத்துவரும் தினசரி நிர்ணய அளவைக் கருத்தில் கொண்டு, தமிழில் இயல்பாக ‘செங்கற்களின் அளவு’ என அமைக்கப்பட்டுள்ளது.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: நாள்தோறும் அந்தந்த நாளுக்குரிய
  rationale: ஒவ்வொரு நாளுக்கும் நிர்ணயிக்கப்பட்ட உற்பத்தி அளவைக் குறிக்கும் எபிரெய மரபுத்தொடரின் நாள்சார் மீளுரையை முடிந்தவரைத் தக்கவைக்கிறது.
