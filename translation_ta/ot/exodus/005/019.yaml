translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மதிப்புமிக்க நடையிலும் அமைக்கப்பட்டது. ‘கண்டுகொண்டார்கள்’ என்பது மூலத்தின் ‘கண்டார்கள்’ என்ற உருவகத்தைத் தக்கவைத்தபடி சூழலிலுள்ள உணர்தல் நுட்பத்தையும் வெளிப்படுத்துகிறது. காரணத் தொடர்பை இயல்பாக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
