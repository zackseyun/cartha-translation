lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: பார்வோனின் முடிவான கட்டளையை அறிமுகப்படுத்தும் இடைமாற்றத்தையும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְכוּ
  choice: போய்
  rationale: הלך என்பதன் கட்டளை வடிவம்; அடுத்த கட்டளையான ‘வேலை செய்யுங்கள்’ என்பதுடன் தமிழில் இயல்பாக இணைகிறது.
- source_word: עִבְדוּ
  choice: வேலை செய்யுங்கள்
  rationale: இச்சூழலில் வழிபாட்டுச் சேவையை அல்ல, கட்டாய உழைப்பையே குறிக்கிறது.
- source_word: וְתֶבֶן
  choice: ஆனால் வைக்கோல்
  rationale: வேலை தொடர வேண்டும் என்ற கட்டளைக்கும் வைக்கோல் வழங்கப்படாமைக்கும் இடையிலுள்ள முரண்பாட்டை ‘ஆனால்’ தெளிவாக்குகிறது.
- source_word: יִנָּתֵן לָכֶם
  choice: உங்களுக்குக் கொடுக்கப்படாது
  rationale: נתן என்பதன் எதிர்மறைச் செயப்பாட்டு வடிவத்தை நெருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: תֹכֶן
  choice: நிர்ணயிக்கப்பட்ட அளவு
  rationale: தொழிலாளர்களிடமிருந்து கோரப்பட்ட அளந்து நிர்ணயிக்கப்பட்ட உற்பத்தி அளவைக் குறிக்கிறது; எண் மட்டுமே என்று தேவையின்றிக் குறுக்காமல் மூலச்சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: לְבֵנִים
  choice: செங்கற்களை
  rationale: תֹכֶן உடன் இணைந்து கோரப்பட்ட பொருள் செங்கற்கள் என்பதைத் தெளிவாக்குகிறது.
- source_word: תִּתֵּנּוּ
  choice: நீங்கள் கொடுத்தாக வேண்டும்
  rationale: சொற்பொருளான ‘கொடுப்பீர்கள்’ என்பதையும் இச்சூழலிலுள்ள கட்டாயக் கடமையையும் இயல்பான தமிழில் ஒருங்கே வெளிப்படுத்துகிறது.
