    text: அல்லது, “செங்கற்களுக்கான கோட்டா.” எபிரெயச் சொல் תֹכֶן தொழிலாளர்கள் நிறைவேற்ற வேண்டிய நிலையான, அளந்து நிர்ணயிக்கப்பட்ட அளவைக் குறிக்கிறது.
