  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: ta
  text: ஆகவே, இப்போது போய் வேலை செய்யுங்கள்; ஆனால் வைக்கோல் உங்களுக்குக் கொடுக்கப்படாது. நிர்ணயிக்கப்பட்ட அளவு செங்கற்களை[a] நீங்கள் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
