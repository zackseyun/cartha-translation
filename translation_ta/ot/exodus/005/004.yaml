translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. பார்வோனின் குற்றச்சாட்டுத் தொனியும், ‘சுமை வேலை’ என்பதில் உள்ள ஒடுக்குமுறை நிழலும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
