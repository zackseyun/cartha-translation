  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ֚/מָּה מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן תַּפְרִ֥יעוּ אֶת הָ/עָ֖ם מִ/מַּֽעֲשָׂ֑י/ו לְכ֖וּ לְ/סִבְלֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: ta
  text: ஆனால் எகிப்தின் அரசன் அவர்களிடம், “மோசேயே, ஆரோனே, நீங்கள் ஏன் மக்களை அவர்களுடைய வேலைகளிலிருந்து விலகச் செய்கிறீர்கள்?[a] உங்கள் சுமை வேலைகளுக்குச் செல்லுங்கள்.[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் தங்கள் வேலைகளைச் செய்யவிடாமல் ஏன் தடுக்கிறீர்கள்?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உங்கள் கட்டாய வேலைக்குச் செல்லுங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... என்றான்
  rationale: வாவ்-தொடரமைப்பு கதையை முன்னெடுத்துச் செல்கிறது; முந்தைய வசனத்தில் மோசேயும் ஆரோனும் விடுத்த வேண்டுகோளுக்கு எதிரான அரசனின் பதிலைச் சூழல் காட்டுவதால், ‘ஆனால்’ என்பது இயல்பான இணைப்பாகிறது.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசன்
  rationale: எபிரேய இணைப்புத் தொடரை இயல்பான நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: לָמָּה
  choice: ஏன்
  rationale: நேரடியான வினாவை எளிமையாகவும் இயல்பாகவும் காக்கிறது.
- source_word: תַּפְרִיעוּ
  choice: விலகச் செய்கிறீர்கள்
  rationale: פרע என்பதன் ஹிஃபில் வடிவம் இங்கு வேலையை நிறுத்தச் செய்தல் அல்லது அதிலிருந்து அகலச் செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டது; நேர்மறையான விடுதலையை இது குறிக்கவில்லை.
- source_word: הָעָם
  choice: மக்களை
  rationale: சூழலில் அவர்கள் தொழிலாளர்களாக இருந்தாலும், மூலத்தில் உள்ள விரிவான ‘மக்கள்’ என்ற குறிப்பே காக்கப்படுகிறது.
- source_word: מִמַּעֲשָׂיו
  choice: அவர்களுடைய வேலைகளிலிருந்து
  rationale: எபிரேயத்தில் ஒருமை உரிமை விகுதி கூட்டுப் பெயரான ‘மக்கள்’ என்பதோடு வருகிறது; தமிழில் பன்மையாக வழங்குவது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְכוּ
  choice: போங்கள்
  rationale: பன்மை ஏவலை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: לְסִבְלֹתֵיכֶם
  choice: உங்கள் சுமை வேலைகளுக்கு
  rationale: סבלות என்பது சுமைகளையும் சுமத்தப்பட்ட கடின உழைப்பையும் குறிக்கலாம்; ‘சுமை வேலைகள்’ அதன் உருவகத்தையும் ஒடுக்குமுறைத் தொனியையும் காக்கிறது.
