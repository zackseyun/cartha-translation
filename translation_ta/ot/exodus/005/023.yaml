base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: ta
  text: ஏனெனில், நான் உமது பெயரில் பேசுவதற்காகப் பார்வோனிடம் வந்தது முதல், அவன் இந்த மக்களுக்குத் தீங்கு செய்திருக்கிறான்; நீரோ உமது மக்களை விடுவிக்கவே இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விடுவிக்கவே இல்லை” என்பதில், எபிரெய மொழி ஒரே வினையை வலுப்படுத்தும் வகையில் இணைத்து, “விடுவிக்க நீர் விடுவிக்கவில்லை” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאָז
  choice: ஏனெனில், ... வந்தது முதல்
  rationale: מֵאָז என்பதன் காலப்பொருளான ‘அந்த நேரம் முதல்/வந்தது முதல்’ என்பதையும், וְ சூழலில் மோசேயின் முறையீட்டிற்கான விளக்கத் தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: நான் ... பார்வோனிடம் வந்தது
  rationale: בוא வினையின் முதலாம் நபர் நிறைவுவடிவையும் אֶל குறிக்கும் திசை/அணுகுதலையும் நேரடியாகக் காட்டுகிறது.
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: உமது பெயரில் பேசுவதற்காக
  rationale: לְדַבֵּר நோக்கத்தைக் குறிக்கிறது; בִּשְׁמֶךָ என்பதன் ‘உமது பெயரில்’ என்ற உருவகத்தையும் அதிலுள்ள பிரதிநிதித்துவம் மற்றும் அதிகார நுணுக்கத்தையும் காக்கிறது.
- source_word: הֵרַע לָעָם הַזֶּה
  choice: அவன் இந்த மக்களுக்குத் தீங்கு செய்திருக்கிறான்
  rationale: רעע என்பதன் ஹிஃபில் வடிவம் ‘தீங்கு செய்தல்/நிலைமையை மோசமாக்குதல்’ எனப் பொருள்படலாம். இச்சூழலில் ‘தீங்கு செய்திருக்கிறான்’ என்பது இயல்பாகவும் ஒழுக்கத் தீமை மற்றும் நடைமுறை கேடு ஆகிய இரு நுணுக்கங்களுக்கும் இடமளிப்பதாகவும் உள்ளது.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: நீரோ ... விடுவிக்கவே இல்லை
  rationale: வினையெச்ச முழுவடிவத்துடன் வரும் முடிவுற்ற வினை எதிர்மறையை வலுப்படுத்துகிறது. தமிழ் ‘-வே இல்லை’ அந்த அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת־עַמֶּךָ
  choice: உமது மக்களை
  rationale: நேரடி செயப்படுபொருளான ‘உமது மக்கள்’ என்பதை மரியாதை ஒருமை வடிவில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: மோசேயின் முறையீட்டிலுள்ள வலுப்படுத்தப்பட்ட எதிர்மறை
  choice: நீரோ உமது மக்களை விடுவிக்கவே இல்லை
  alternative: நீர் உமது மக்களை நிச்சயமாக விடுவிக்கவில்லை
  rationale: எபிரெய வினையெச்ச முழுவடிவு + முடிவுற்ற வினை அமைப்பு மறுப்பை வலுப்படுத்துகிறது. ‘விடுவிக்கவே இல்லை’ என்பது மோசேயின் துணிவான முறையீட்டின் தீவிரத்தைச் சீராகக் காக்கிறது; தேவன் இனி ஒருபோதும் விடுவிக்கமாட்டார் என்ற பொருளைச் சேர்ப்பதில்லை.
- issue: בִּשְׁמֶךָ என்பதை உருவக வடிவிலேயே காத்தல்
  choice: உமது பெயரில்
  alternative: உமது சார்பாக / உமது அதிகாரத்துடன்
  rationale: ‘உமது பெயரில்’ என்பது நவீன தமிழில் புரியக்கூடியது; தேவனுடைய பிரதிநிதியாகவும் அதிகாரத்தின் கீழும் பேசுதல் என்ற இறையியல் நிறையை விளக்கவுரையாகச் சுருக்காமல் பாதுகாக்கிறது.
- issue: הֵרַע என்பதிலுள்ள பொருள் விரிவு
  choice: தீங்கு செய்திருக்கிறான்
  alternative: இந்த மக்களின் நிலைமையை மோசமாக்கியிருக்கிறான் / இந்த மக்களுக்குத் தீமை செய்திருக்கிறான்
  rationale: வினை ஒழுக்கத் தீமையையும் விளைந்த கேடையும் குறிக்கக்கூடும். ‘தீங்கு’ இரண்டையும் இயல்பாகத் தாங்கி, பார்வோனின் செயலையே இலக்கண எழுவாயாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. தேவனை நோக்கிய உரையில் ‘உமது/நீர்’ என்ற மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் குற்றச்சாட்டு வலிமையும் ‘உமது பெயரில்’ என்ற இறையியல் நிறையுள்ள உருவகமும் காக்கப்பட்டுள்ளன.
