base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: ta
  text: 'அப்போது மக்களை வேலை வாங்குபவர்களும், மக்களுடைய அதிகாரிகளும்[a] புறப்பட்டு மக்களிடம் சென்று, “பார்வோன் இவ்வாறு கூறுகிறார்: ‘நான் உங்களுக்கு வைக்கோல் தரமாட்டேன்’” என்று அறிவித்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களுடைய வேலைத் தலைவர்களும்.” எபிரெயச் சொல் மக்களிடையே இருந்த கீழ்நிலைப் பொறுப்பாளர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: வேலை வாங்கிய மேற்பார்வையாளர்கள்
  rationale: கட்டாய உழைப்பையும் உற்பத்தி அளவையும் அமல்படுத்தியவர்களைச் சூழலுக்கேற்ற வகையில் குறிக்கிறது; வெறும் ‘மேற்பார்வையாளர்கள்’ என்பதைவிட அடக்குமுறை சார்ந்த பணியைத் தெளிவாக்குகிறது.
- source_word: שֹׁטְרָיו
  choice: மக்களுடைய அதிகாரிகள்
  rationale: மக்களிடையே இருந்த கீழ்நிலை நிர்வாகப் பொறுப்பாளர்களைக் குறிக்கும் எபிரெயச் சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது; சூழலில் ‘வேலைத் தலைவர்கள்’ என்பதும் சாத்தியம்.
- source_word: וַיֵּצְאוּ
  choice: புறப்பட்டுச் சென்று
  rationale: பார்வோனின் முன்னிலையிலிருந்து மக்களிடம் சென்ற கதை நகர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: கூட்டுப் பெயரின் நேரான மொழிபெயர்ப்பு; இச்சூழலில் இஸ்ரயேல் தொழிலாளர்கள் குறிக்கப்படுகின்றனர்.
- source_word: לֵאמֹר
  choice: என்று அறிவித்தார்கள்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவத்தை, அதிகாரப்பூர்வ அறிவிப்புக்கு ஏற்ற இயல்பான தமிழில் வழங்குகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுதான்
  rationale: தூதர் அறிவிப்புக்குரிய வழக்குச் சூத்திரத்தை இயல்பான நவீன தமிழில் பாதுகாக்கிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: אֵינֶנִּי נֹתֵן
  choice: நான் ... தரமாட்டேன்
  rationale: நிகழ்காலத்தில் தெரிவிக்கப்படும் உறுதியான மறுப்பை இயல்பான தமிழில் காட்டுகிறது; எதிர்காலத்தை மட்டும் குறிக்கும் கூற்றாகக் கட்டுப்படுத்தவில்லை.
- source_word: תֶּבֶן
  choice: வைக்கோல்
  rationale: செங்கல் தயாரிப்பில் பயன்படுத்தப்பட்ட பொருளுக்கான வழக்கமான, தெளிவான தமிழ்ச் சொல்.
