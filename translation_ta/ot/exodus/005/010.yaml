  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அதிகாரப்பூர்வ அறிவிப்பின் தொனி காக்கப்பட்டதுடன், שֹׁטְרָיו என்பதன் நிர்வாகப் பொருளும் சூழல்சார்ந்த ‘வேலைத் தலைவர்கள்’ என்ற மாற்றுப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
