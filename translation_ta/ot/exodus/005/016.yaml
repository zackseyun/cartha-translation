base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: ta
  text: “உமது அடியார்களுக்கு வைக்கோல் கொடுக்கப்படுவதில்லை; ஆனாலும், ‘செங்கற்களைச் செய்யுங்கள்!’ என்று எங்களிடம் சொல்கிறார்கள். இதோ, உமது அடியார்கள் அடிக்கப்படுகிறார்கள்; ஆனால் குற்றம் உமது சொந்த மக்களிடமே உள்ளது.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மேலும் சொல்லுக்குச் சொல், “உமது மக்கள் பாவம் செய்திருக்கிறார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் சுருக்கமாக உள்ளது; சூழலில், பார்வோனின் ஆட்களிடமே குற்றம் இருப்பதாக இது பெரும்பாலும் பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: வைக்கோல்
  rationale: களிமண் செங்கற்கள் செய்வதற்குப் பயன்படுத்தப்பட்ட பொருளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: אֵין נִתָּן
  choice: கொடுக்கப்படுவதில்லை
  rationale: வைக்கோல் தொடர்ந்து வழங்கப்படாத நிலையை எபிரெய எதிர்மறைச் சொல்லமைப்பும் செயப்பாட்டு வினை வடிவமும் தெரிவிக்கின்றன.
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: உமது அடியார்களுக்கு / உமது அடியார்கள்
  rationale: பார்வோனிடம் முறையிடும் மேற்பார்வையாளர்களின் பணிவான அரசவைப் பேச்சையும் அவர்களுடைய கீழ்ப்பட்ட நிலையையும் ‘அடியார்கள்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: לְבֵנִים
  choice: செங்கற்களை
  rationale: எண்ணிக் கணக்கிடப்பட்ட உற்பத்திப் பொருளைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: ‘செங்கற்களைச் செய்யுங்கள்!’ என்று எங்களிடம் சொல்கிறார்கள்
  rationale: மூலத்திலுள்ள நேரடிக் கட்டளையைப் பாதுகாக்கிறது; முன் வந்த ‘செங்கற்கள்’ என்பதைத் தமிழில் கட்டளைக்குள் வெளிப்படையாகக் கூறுவது இயல்பாக உள்ளது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: நடக்கும் அநீதியைப் பார்வோனின் கவனத்திற்குக் கொண்டுவரும் வலியுறுத்தலைச் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: מֻכִּים
  choice: அடிக்கப்படுகிறார்கள்
  rationale: தொடர்ந்து நிகழும் துன்புறுத்தலைச் செயப்பாட்டு வடிவில் நேரடியாகக் காட்டுகிறது.
- source_word: וְחָטָאת עַמֶּךָ
  choice: ஆனால் குற்றம் உமது சொந்த மக்களிடமே உள்ளது
  rationale: சுருக்கமானதும் இலக்கண ரீதியாகக் கடினமானதுமான எபிரெய தொடரைச் சூழலின் குற்றச்சாட்டு வலிமையுடன் இயல்பான தமிழில் தருகிறது; ‘சொந்த’ என்பது இஸ்ரவேலருக்கு மாறாகப் பார்வோனின் ஆட்களையே சுட்டும் முரண்பாட்டை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וְחָטָאת עַמֶּךָ என்ற இறுதித் தொடரின் பொருள்
  choice: குற்றம் உமது சொந்த மக்களிடமே உள்ளது
  alternative: உமது மக்கள் பாவம் செய்திருக்கிறார்கள்
  rationale: மூலத் தொடர் சுருக்கமாகவும் பலவாறு புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது. சூழலில் எகிப்திய அதிகாரிகளின் அநீதியே குற்றச்சாட்டின் மையம் என்பதால் இயல்பான பொருள் முதன்மை உரையில் தரப்படுகிறது; மேலும் சொற்சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பார்வோனிடம் செய்யப்படும் பணிவான ஆனால் துணிவான முறையீட்டுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ மற்றும் ‘அடியார்கள்’ அரசவைச் சூழலின் மரியாதையையும் சமூகக் கீழ்ப்படிதலையும் காக்கின்றன.
