  text: וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם יֵ֧רֶא יְהוָ֛ה עֲלֵי/כֶ֖ם וְ/יִשְׁפֹּ֑ט אֲשֶׁ֧ר הִבְאַשְׁתֶּ֣ם אֶת רֵיחֵ֗/נוּ בְּ/עֵינֵ֤י פַרְעֹה֙ וּ/בְ/עֵינֵ֣י עֲבָדָ֔י/ו לָֽ/תֶת חֶ֥רֶב בְּ/יָדָ֖/ם לְ/הָרְגֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: ta
  text: அவர்கள் அவர்களிடம், “யாவே உங்களைப் பார்த்து நியாயந்தீர்ப்பாராக! ஏனெனில், பார்வோனுக்கும் அவனுடைய பணியாளர்களுக்கும் எங்களை அருவருப்பானவர்களாக்கி[a], எங்களைக் கொல்வதற்கு அவர்களுடைய கையில் வாளைக் கொடுத்துவிட்டீர்கள்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “எங்கள் மணத்தை நாறச்செய்தீர்கள்”; அதாவது, “எங்களை அருவருப்பானவர்களாகத் தோன்றச் செய்தீர்கள்.”
    reason: மூலத்திலுள்ள நாற்ற உருவகத்தையும் அதன் பொருளையும் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: அவர்கள் அவர்களிடம் ... என்றார்கள்
  rationale: எபிரெய உரையில் பெயர்கள் மீண்டும் குறிப்பிடப்படாமல் பன்மைப் பிரதிப்பெயர்கள் மட்டுமே உள்ளதால், மோசே மற்றும் ஆரோன் என்ற பெயர்களைச் சேர்க்காமல் மூலத்தின் வடிவம் காக்கப்படுகிறது.
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם וְיִשְׁפֹּט
  choice: யாவே உங்களைப் பார்த்து நியாயந்தீர்ப்பாராக
  rationale: இரண்டு வினைகளும் இங்கு வேண்டுதல் வடிவிலான சாபமொழியாக அமைந்துள்ளன. ‘பார்த்து’ என்பது தெய்வீகக் கவனிப்பையும், ‘நியாயந்தீர்ப்பாராக’ என்பது அவர்களுக்கு எதிரான தீர்ப்புக்கான முறையீட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய தனிப்பெயரான YHWH-ஐத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: הִבְאַשְׁתֶּם אֶת רֵיחֵנוּ
  choice: எங்களை அருவருப்பானவர்களாக்கி[a]
  rationale: சொல்லுக்கு சொல் ‘எங்கள் மணத்தை நாறச்செய்தீர்கள்’ என்ற உருவகத்தின் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; மூலத்தின் தெளிவான நாற்ற உருவகம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: பார்வோனுக்கும் அவனுடைய பணியாளர்களுக்கும்
  rationale: சொல்லர்த்தமான ‘கண்களில்’ என்பது மதிப்பீடு அல்லது பார்வையில் என்ற எபிரெய மரபுத்தொடர். தமிழில் சம்பந்தப் பொருளை இயல்பாக வெளிப்படுத்த நான்காம் வேற்றுமை பயன்படுத்தப்படுகிறது.
- source_word: לָתֵת חֶרֶב בְּיָדָם לְהָרְגֵנוּ
  choice: எங்களைக் கொல்வதற்கு அவர்களுடைய கையில் வாளைக் கொடுத்துவிட்டீர்கள்
  rationale: ஒருமை ‘வாள்’ காக்கப்படுகிறது; இது கொலை செய்வதற்கான வழியையோ வாய்ப்பையோ அவர்களுக்கு அளித்துவிட்டதாகிய விளைவைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: இவ்வசனம் பட்டப்பெயரை அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே அதனைத் தலைப்புப் பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: וְיִשְׁפֹּט என்பதன் தீர்ப்புப் பொருள்
  choice: நியாயந்தீர்ப்பாராக
  alternative: எங்களுக்கு நீதி வழங்குவாராக
  rationale: பேசுகிறவர்கள் யாவேயின் தீர்ப்பை மோசே மற்றும் ஆரோனுக்கு எதிராக வேண்டுகின்றனர்; ஆனால் எபிரெய வினை யாரை விடுவிப்பது அல்லது குற்றவாளியாக்குவது என்பதைத் தனியே விரிவுபடுத்தவில்லை. எனவே அந்தத் திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. சாபமொழியின் தீவிரமும், குற்றச்சாட்டின் விளைவு சார்ந்த அமைப்பும் காக்கப்பட்டுள்ளன.
