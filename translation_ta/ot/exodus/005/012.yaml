  text: So the people were scattered throughout all the land of Egypt to gather stubble for straw[a].
translation:
  language: ta
  text: அதனால், மக்கள் வைக்கோலுக்குப் பதிலாகப் பயன்படுத்த அறுவடைக்குப் பின் எஞ்சிய தண்டுகளைச் சேகரிப்பதற்காக எகிப்து நாடெங்கும் சிதறிப் போனார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வைக்கோலுக்காக அறுவடைக்குப் பின் எஞ்சிய தண்டுகளைச் சேகரிக்க.’ קַשׁ, תֶּבֶן ஆகிய சொற்கள் குறிக்கும் பொருட்களைத் துல்லியமாக வேறுபடுத்துவது உறுதியல்ல; முதன்மை உரை, சேகரிக்கப்பட்ட தண்டுகளுக்கும் வழக்கமாக வழங்கப்பட்ட வைக்கோலுக்கும் இடையிலான சாத்தியமான வேறுபாட்டைப் பேணுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: சிதறிச் சென்றார்கள்
  rationale: פוץ என்ற வினை மக்கள் பரந்த பகுதிக்குப் பரவிச் சென்றதைக் குறிக்கிறது. சூழலில் கட்டாயப்படுத்தப்பட்ட நிலை இருந்தாலும், எபிரெய வினைவடிவத்தை இயல்பான தமிழ் நடையில் வெளிப்படுத்த ‘சிதறிச் சென்றார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עם என்பது இங்கு பார்வோனின் கட்டளைக்குக் கீழிருந்த இஸ்ரயேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; மூலத்தில் இல்லாத கூடுதல் விளக்கத்தைச் சேர்க்காமல் ‘மக்கள்’ என்று தரப்பட்டது.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாடெங்கும்
  rationale: בְּכָל என்பதன் முழுப் பரப்பைக் குறிக்கும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் ‘நாடெங்கும்’ வெளிப்படுத்துகிறது.
- source_word: לְקֹשֵׁשׁ
  choice: சேகரிப்பதற்காக
  rationale: קשש என்பது சிதறிக் கிடக்கும் சிறு பொருட்களைப் பொறுக்கிச் சேர்ப்பதைக் குறிக்கிறது; இங்கு ‘சேகரிப்பது’ தெளிவான பொதுநடைச் சொல்.
- source_word: קַשׁ
  choice: தாளடி
  rationale: קשׁ என்பது அறுவடைக்குப் பின் எஞ்சிய உலர்ந்த பயிர்த்தண்டுகளையோ துரும்பையோ குறிக்கலாம். அடுத்துவரும் תבן என்பதிலிருந்து வேறுபாட்டைப் பேண ‘தாளடி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לַתֶּבֶן
  choice: வைக்கோலுக்குப் பதிலாக
  rationale: 'לְ என்ற முன்னொட்டு இங்கு பயன்பாடு அல்லது பதிலீட்டைக் குறிக்கிறது: சேகரிக்கப்பட்ட தாளடி செங்கல் செய்வதற்கான வழக்கமான வைக்கோலுக்குப் பதிலாகப் பயன்பட வேண்டும். சூழலில் உள்ள அந்த உறவைத் தமிழில் தெளிவாக்குகிறது.'
