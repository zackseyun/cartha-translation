lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டுச் சொன்னது
  rationale: צוה என்பதன் அதிகாரப்பூர்வமான கட்டளைப் பொருளையும், அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சுடன் לֵאמֹר ஏற்படுத்தும் இணைப்பையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற அரசப் பட்டப்பெயர்.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்றே
  rationale: ‘அந்த நாளில்’ என்ற நேரடிப் பொருளுடன், சூழலில் உள்ள உடனடித் தன்மையையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הַנֹּגְשִׂים בָּעָם
  choice: மக்களைக் கடுமையாக வேலை வாங்கியவர்கள்
  rationale: נגשׂ என்பது உழைப்பை வற்புறுத்தி வாங்கும் அதிகாரிகளைக் குறிக்கிறது; בָּעָם அவர்களுக்கும் மக்களுக்கும் உள்ள தொடர்பைக் காட்டுகிறது. தமிழில் பங்கு தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: שֹׁטְרָיו
  choice: அவர்களுடைய மேற்பார்வையாளர்கள்
  rationale: எபிரெய பிரதிப்பெயர் இலக்கணப்படி பார்வோனைச் சுட்டினாலும், இவர்கள் தொழிலாளர் அமைப்பில் அவருக்குக் கீழிருந்த துணை அதிகாரிகள். ‘மேற்பார்வையாளர்கள்’ அவர்களின் நிர்வாகப் பங்கை இயல்பாகக் காட்டுகிறது; ‘அதிகாரிகள்’ என்றும் மொழிபெயர்க்கலாம்.
- source_word: לֵאמֹר
  choice: 'சொன்னது:'
  rationale: அடுத்த வசனத்தில் தொடரும் நேரடிப் பேச்சை அறிமுகப்படுத்தும் வழக்கமான எபிரெய சூத்திரத்தைத் தமிழில் இயல்பாக இணைக்கிறது.
