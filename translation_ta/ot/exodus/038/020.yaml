  text: וְֽ/כָל הַ/יְתֵדֹ֞ת לַ/מִּשְׁכָּ֧ן וְ/לֶ/חָצֵ֛ר סָבִ֖יב נְחֹֽשֶׁת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/020.yaml
  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: ta
  text: திருவாசஸ்தலத்திற்கும் அதைச் சுற்றியிருந்த முற்றத்திற்குமான எல்லா முளைகளும் வெண்கலத்தால் செய்யப்பட்டிருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செம்பால்.” எபிரெயச் சொல் נְחֹשֶׁת சூழலைப் பொறுத்து செம்பையோ வெண்கலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: எல்லா
  rationale: பன்மையில் வரும் முளைகளைத் தொகுப்பாகக் குறிப்பதால், ‘எல்லா’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது; தொடக்க இணைப்பு தமிழில் தனியே மொழிபெயர்க்கப்படாமல் வாக்கிய ஓட்டத்தில் வெளிப்படுகிறது.
- source_word: הַיְתֵדֹת
  choice: முளைகள்
  rationale: கூடாரத்தையும் முற்றத்தின் திரைகளையும் நிலத்தில் உறுதிப்படுத்தப் பயன்படும் stakes/pegs என்பதைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: לַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்திற்கு
  rationale: מִשְׁכָּן என்பதன் அடிப்படைப் பொருள் ‘வாசஸ்தலம்’; யாத்திராகமத்தின் பரிசுத்தக் கூடாரத்தைக் குறிக்கும் நிலையான, புரிந்துகொள்ளக்கூடிய தமிழ்ப் பெயராக ‘திருவாசஸ்தலம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְלֶחָצֵר סָבִיב
  choice: அதைச் சுற்றியிருந்த முற்றத்திற்கு
  rationale: סָבִיב என்பதன் இடவியல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அதை’ என்பது முற்றம் திருவாசஸ்தலத்தைச் சுற்றியிருந்ததைத் தெளிவாக்குகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: திருவாசஸ்தலப் பொருட்களின் சூழலில் வழக்கமாகக் கொள்ளப்படும் bronze என்ற பொருளைத் தருகிறது; ‘செம்பு’ என்ற சாத்தியத்தைக் குறிப்பில் பாதுகாக்கிறது.
