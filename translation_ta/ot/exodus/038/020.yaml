translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் காக்கப்பட்டுள்ளன. எபிரெய மொழியின் சுருக்கமான பெயர்ச்சொல் வாக்கியம் தமிழில் இயல்பாக அமைய ‘செய்யப்பட்டிருந்தன’ சேர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
