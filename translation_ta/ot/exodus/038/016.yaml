  text: All the hangings of the courtyard all around were of finely twisted linen[a].
translation:
  language: ta
  text: முற்றத்தைச் சுற்றியிருந்த எல்லாத் திரைகளும் நன்றாக முறுக்கப்பட்ட மெல்லிய நார்த்துணியால் செய்யப்பட்டிருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்றத்தைச் சுற்றியிருந்த எல்லாத் துணித் திரைகளும் நன்றாக முறுக்கப்பட்ட மெல்லிய நார்த்துணியால் செய்யப்பட்டிருந்தன.”
    reason: קַלְעֵי என்பதற்கு ‘திரைகள்’ அல்லது ‘துணித் திரைகள்’ என மொழிபெயர்க்கலாம்; שֵׁשׁ מָשְׁזָר என்பது நன்றாக முறுக்கப்பட்ட மெல்லிய நார்த்துணியைக் குறிக்கிறது.
lexical_decisions:
- source_word: כָּל
  choice: அனைத்தும்
  rationale: முற்றத்தின் எல்லாத் திரைச்சீலைகளையும் ஒட்டுமொத்தமாகக் குறிக்கும் தொகுதிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: קַלְעֵי
  choice: திரைச்சீலைகள்
  rationale: ஆசரிப்புக் கூடார முற்றத்தைச் சுற்றி எல்லையாக அமைந்த துணித் திரைகளைக் குறிக்கிறது; நவீன தமிழில் தெளிவாகப் புரியும் சொல்.
- source_word: הֶחָצֵר
  choice: முற்றத்தை
  rationale: ஆசரிப்புக் கூடாரத்தைச் சுற்றியிருந்த அடைக்கப்பட்ட வெளிப்புறப் பகுதியைக் குறிக்கிறது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: முற்றத்தின் எல்லாப் பக்கங்களிலும் திரைகள் இருந்தன என்ற சுற்றுப்புறப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: שֵׁשׁ
  choice: மெல்லிய நாரிழைத் துணி
  rationale: இச்சூழலில் உயர்தரமான மெல்லிய நாரால் நெய்யப்பட்ட துணியைக் குறிக்கிறது; மூலச்சொல் எந்தத் தாவர நாரைச் சுட்டுகிறது என்பது குறித்து நிலவும் lexical uncertainty-ஐ ‘சணல்’ எனக் குறுக்காமல் காக்கிறது.
- source_word: מָשְׁזָר
  choice: நன்றாக முறுக்கப்பட்ட
  rationale: நூலிழைகள் முறுக்கி அல்லது திரித்து ஆயத்தம் செய்யப்பட்ட கைவினைத் தன்மையை வெளிப்படுத்துகிறது.
