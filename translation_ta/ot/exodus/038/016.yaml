translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு அமைப்பின் கண்ணியமான தொனியைப் பேணியும் மொழிபெயர்க்கப்பட்டது. ‘திரைச்சீலைகள்’ என்பது கட்டிடத்தின் உள்ளக அலங்காரத் திரை என்ற எண்ணத்தைத் தரக்கூடும் என்பதால், அடைப்புத் திரைகள் என்பதைக் காலடிக்குறிப்பு மாற்று வெளிப்படுத்துகிறது.
