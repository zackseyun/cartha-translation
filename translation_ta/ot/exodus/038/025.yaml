revisions:
- from: சபையில் எண்ணப்பட்டவர்களிடமிருந்து வந்த வெள்ளி நூறு தாலந்தும் ஆயிரத்து எழுநூற்று எழுபத்தைந்து சேக்கலும் இருந்தது; அது பரிசுத்த இடத்துச் சேக்கல் என்ற எடை அளவின்படி கணக்கிடப்பட்டது.[a]
  to: சபையில் எண்ணப்பட்டவர்களின் வெள்ளி நூறு தாலந்தும், ஆயிரத்து எழுநூற்று எழுபத்தைந்து சேக்கலும், பரிசுத்த ஸ்தலத்தின் சேக்கல் அளவின்படி இருந்தது.[a]
  rationale: The revision removes interpretive additions, retains the source’s accounting construction, and directly attaches the sanctuary-shekel standard to the stated amount. The ancient weight units are retained as conventional Tamil transliterations.
