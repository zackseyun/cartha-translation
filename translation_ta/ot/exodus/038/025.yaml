translation_notes:
  register: நவீன தரத் தமிழில், கணக்குப் பதிவுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பழங்கால எடை அலகுகளான ‘தாலந்து’, ‘சேக்கல்’ ஒலிபெயர்ப்பாக வைக்கப்பட்டுள்ளன; ‘பரிசுத்த இடத்துச் சேக்கல்’ என்பது ஒரு குறிப்பிட்ட எடைத் தரம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
