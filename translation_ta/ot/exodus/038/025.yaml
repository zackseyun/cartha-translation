base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/025.yaml
  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: ta
  text: சபையில் எண்ணப்பட்டவர்களின் வெள்ளி நூறு தாலந்தும், ஆயிரத்து எழுநூற்று எழுபத்தைந்து சேக்கலும், பரிசுத்த ஸ்தலத்தின் சேக்கல் அளவின்படி இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, பரிசுத்த ஸ்தலத்தில் பயன்படுத்தப்பட்ட நிர்ணயிக்கப்பட்ட எடைத் தரத்தின்படி.
    reason: cultural_note
lexical_decisions:
- source_word: כֶסֶף
  choice: வெள்ளி
  rationale: கணக்கு விவரிக்கப்படும் இச்சூழலில் பணம் என்ற பொதுப் பொருளைவிட சேகரிக்கப்பட்ட உலோகத்தையே குறிக்கிறது.
- source_word: פְּקוּדֵי
  choice: எண்ணப்பட்டவர்கள்
  rationale: மக்கள்தொகைக் கணக்கில் பதிவு செய்து எண்ணப்பட்டவர்களைக் குறிக்கும் நிர்வாகப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעֵדָה
  choice: சபை
  rationale: உடன்படிக்கை மக்களின் கூடிய சமூகத்தைக் குறிக்கும் சொல்லுக்கு, கண்ணியமும் வாசிப்புத் தெளிவும் கொண்ட தமிழ் இணை.
- source_word: מְאַת כִּכָּר
  choice: நூறு தாலந்து
  rationale: ככר என்னும் பண்டைய பெரிய எடை அலகை மரபான வேதாகமத் தமிழ்ச் சொல்லான ‘தாலந்து’ மூலம் நேரடியாகக் காட்டுகிறது.
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: ஆயிரத்து எழுநூற்று எழுபத்தைந்து சேக்கல்
  rationale: எபிரெயச் சேர்க்கை எண்ணின் மொத்தமான 1,775-ஐ தெளிவான நவீன தமிழில் அளிக்கிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்துச் சேக்கல் என்ற எடை அளவின்படி
  rationale: இது பயன்படுத்தப்பட்ட எடைத் தரத்தைச் சுட்டுகிறது என்பதைத் தெளிவுபடுத்தி, ‘பரிசுத்த இடம்’ என்ற மூலப்பொருளையும் காக்கிறது.
