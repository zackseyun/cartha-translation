base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: ta
  text: அவனுடன் தாண் கோத்திரத்தைச் சேர்ந்த அகிசாமாக்கின் மகன் ஒகொலியாபும்[a] இருந்தான். அவன் கைவினைஞனாகவும், வடிவமைப்பாளனாகவும், நீலநூல், ஊதாநூல், கருஞ்சிவப்பு நூல்[c], மெல்லிய ஆளிநூல் ஆகியவற்றில் பூவேலை செய்பவனாகவும் இருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தப் பெயர் சில தமிழ் மொழிபெயர்ப்புகளில் ‘அகோலியாப்’ என்றும் ஒலிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘கருஞ்சிவப்பு நூல்’ என்பது கருஞ்சிவப்புச் சாயமிட்ட துணிப் பொருளைக் குறிக்கும் எபிரெயச் சொல்லாட்சியின் மொழிபெயர்ப்பு; ‘கருஞ்சிவப்பு’ என்றும் மட்டும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: அவனுடன் ... இருந்தான்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட பெசலெயேலுடன் ஒகொலியாப் இருந்ததை, எபிரெய மொழியின் வினையற்ற தொடரை இயல்பான தமிழில் வினை சேர்த்து தெரிவிக்கிறது.
- source_word: אָהֳלִיאָב
  choice: ஒகொலியாப்
  rationale: எபிரெயப் பெயரின் தொடக்க ‘ஒ’ ஒலியைத் தக்கவைக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: அகிசாமாக்கின் மகன்
  rationale: எபிரெயத் தந்தைவழி அடையாளத் தொடரை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: לְמַטֵּה דָן
  choice: தாண் கோத்திரத்தைச் சேர்ந்த
  rationale: தாண் குலத்துடனான தொடர்பை நவீன, தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: חָרָשׁ
  choice: கைவினைஞன்
  rationale: இச்சொல் பொதுவாகத் திறமையான கைவினைத் தொழிலாளியைக் குறிக்கலாம்; ‘செதுக்குபவன்’ என்று மட்டும் குறுக்காமல் மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
- source_word: וְחֹשֵׁב
  choice: வடிவமைப்பாளன்
  rationale: கலைநயமுள்ள வடிவங்களையும் வேலைப்பாடுகளையும் திட்டமிடுகிறவரைக் குறிக்கும் சூழல்சார் பொருளைத் தருகிறது.
- source_word: וְרֹקֵם
  choice: பூவேலை செய்பவன்
  rationale: பல நிற நூல்களால் துணியில் செய்யப்படும் அலங்காரத் தையல் வேலையை இயல்பான தமிழில் குறிக்கிறது.
- source_word: בַּתְּכֵלֶת וּבָאַרְגָּמָן
  choice: நீலநூல், ஊதாநூல்
  rationale: கூடாரத் துணிவேலைச் சூழலில் நிறத்தையும் பயன்படுத்தப்பட்ட நூல் பொருளையும் தெளிவாக்குகிறது.
- source_word: וּבְתוֹלַעַת הַשָּׁנִי
  choice: கருஞ்சிவப்பு நூல்
  rationale: செந்நிறச் சாயமிட்ட துணிநார் அல்லது நூலைக் குறிக்கும் எபிரெயச் சொல்லாட்சியைத் துணிவேலைச் சூழலுக்கு ஏற்றவாறு தருகிறது.
- source_word: וּבַשֵּׁשׁ
  choice: மெல்லிய ஆளிநூல்
  rationale: ஆசரிப்புக்கூடாரச் சூழலில் שֵׁשׁ குறிக்கும் உயர்தர மெல்லிய linen நூலை, பருத்தி என்று தவறாக அடையாளப்படுத்தாமல் மொழிபெயர்க்கிறது.
