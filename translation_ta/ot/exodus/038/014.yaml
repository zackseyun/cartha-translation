  yaml_path: translation/ot/exodus/038/014.yaml
  text: Fifteen cubits of hangings were for one side; their pillars were three[a], and their bases were three.
translation:
  language: ta
  text: ஒரு பக்கத்திற்கான திரைச்சீலைகள் பதினைந்து முழம் இருந்தன; அவற்றின் தூண்கள் மூன்று, அவற்றின் அடிப்பாகங்கள்[a] மூன்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவற்றின் செருகுதளங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: קְלָעִים
  choice: திரைச்சீலைகள்
  rationale: திருமுற்றத்தைச் சுற்றி அமைக்கப்பட்ட துணித் திரைகளைக் குறிக்கும் சூழல்சார் பொருளை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: பதினைந்து முழம்
  rationale: எபிரெய உரையில் உள்ள அளவுச் சொற்றொடரை, இல்லாத ‘நீளம்’ போன்ற சொல்லைச் சேர்க்காமல் நேரடியாக வழங்குகிறது.
- source_word: אֶל הַכָּתֵף
  choice: ஒரு பக்கத்திற்கான
  rationale: כָּתֵף என்பதன் அடிப்படைப் பொருள் ‘தோள்’; இக்கட்டிடச் சூழலில் அது வாசல் பகுதியின் ஒரு பக்கத்தை அல்லது பக்கவாட்டைக் குறிக்கிறது.
- source_word: עַמּוּדֵיהֶם
  choice: அவற்றின் தூண்கள்
  rationale: திரைச்சீலைகளைத் தாங்கிய கட்டமைப்பு உறுப்புகளைத் தெளிவாகக் குறிக்கிறது; பன்மை விகுதி முன் குறிப்பிடப்பட்ட திரைச்சீலைகளோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: אַדְנֵיהֶם
  choice: அவற்றின் அடித்தளங்கள்
  rationale: தூண்கள் நிலைநிறுத்தப்பட்ட உலோக அடிப்பகுதிகளைப் பொதுவாசகர் புரிந்துகொள்ளும் வகையில் குறிக்கிறது; தொழில்நுட்பமான ‘செருகுதளங்கள்’ என்பது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
