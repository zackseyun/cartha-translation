revisions:
- from: ஒரு பக்கத்திற்கான திரைச்சீலைகள் பதினைந்து முழம் இருந்தன; அவற்றின் தூண்கள் மூன்று, அவற்றின் அடித்தளங்கள்[a] மூன்று.
  to: ஒரு பக்கத்திற்கான திரைச்சீலைகள் பதினைந்து முழம் இருந்தன; அவற்றின் தூண்கள் மூன்று, அவற்றின் அடிப்பாகங்கள்[a] மூன்று.
