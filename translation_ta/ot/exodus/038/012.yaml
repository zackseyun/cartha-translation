base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/012.yaml
  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: ta
  text: மேற்குப் பக்கத்தில் ஐம்பது முழம் நீளமான திரைச்சீலைகள் இருந்தன; அவற்றுக்குப் பத்துத் தூண்களும் பத்து அடித்தளங்களும் இருந்தன. தூண்களின் கொக்கிகளும் அவற்றின் பட்டைகளும்[a] வெள்ளியால் செய்யப்பட்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் இணைப்புக் கம்பிகள்.” தூண்களுக்கான இந்தப் பொருத்து வகையைக் குறிக்கும் எபிரேயச் சொல் தொழில்நுட்பமானது; அது பட்டைகள், கம்பிகள் அல்லது அலங்கார இணைப்புத் துண்டுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: மேற்குப் பக்கத்தில்
  rationale: יָם என்பதன் நேர்ப்பொருள் ‘கடல்’ என்றாலும், இச்சூழலில் அது வழக்காக மேற்குத் திசையைக் குறிக்கிறது; פאה என்பது பக்கம் அல்லது ஓரம்.
- source_word: קְלָעִים
  choice: திரைச்சீலைகள்
  rationale: திருமுற்றத்தைச் சுற்றி எல்லை அமைத்த துணித் திரைகளைக் குறிக்கிறது; நவீன தமிழில் தெளிவான, இயல்பான சொல்.
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: ஐம்பது முழம் நீளமான
  rationale: אַמָּה என்பது ‘முழம்’ என்னும் அளவை குறிக்கிறது; எது அளக்கப்படுகிறது என்பதைத் தமிழில் தெளிவுபடுத்த ‘நீளமான’ சேர்க்கப்பட்டுள்ளது.
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: அவற்றுக்குப் பத்துத் தூண்கள்
  rationale: עַמּוּדִים கட்டமைப்பைத் தாங்கும் தூண்களைக் குறிக்கிறது; எபிரேய பட்டியல் அமைப்பை இயல்பான தமிழில் கூறுகிறது.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: பத்துத் தளங்கள்
  rationale: אֶדֶן இங்கு தூண்களைத் தாங்கும் அடித்தளம் அல்லது பொருத்துக் குழியுள்ள பீடத்தைக் குறிக்கலாம்; ‘தளங்கள்’ பொதுவாகப் புரியக்கூடிய வடிவம்.
- source_word: וָוֵי הָעַמֻּדִים
  choice: தூண்களின் கொக்கிகள்
  rationale: וָוִים தூண்களில் பொருத்தப்பட்ட கொக்கிகளைக் குறிக்கிறது.
- source_word: וַחֲשֻׁקֵיהֶם
  choice: அவற்றின் பட்டைகள்
  rationale: இது தூண்களுடன் தொடர்புடைய ஒரு தொழில்நுட்பப் பொருத்தைக் குறிக்கும்; அதன் துல்லிய வடிவம் உறுதியில்லை என்பதால் பொதுவான ‘பட்டைகள்’ பயன்படுத்தப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כָּסֶף
  choice: வெள்ளியால் செய்யப்பட்டிருந்தன
  rationale: இறுதி பெயர்ச்சொல் கொக்கிகளும் பட்டைகளும் செய்யப்பட்ட பொருளை முன்னிலையாகக் குறிப்பிடுகிறது; தமிழில் முழுமையான வாக்கியமாக இயல்பாக வழங்கப்பட்டுள்ளது.
