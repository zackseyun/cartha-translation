- from: அந்த ஆயிரத்து எழுநூற்று எழுபத்தைந்து சேக்கல் வெள்ளியைக் கொண்டு, தூண்களுக்கான கொக்கிகளைச் செய்தான்; அவற்றின் உச்சிகளுக்கு வெள்ளித் தகடு பதித்து, அவற்றுக்கான இணைப்புப் பட்டைகளையும் செய்தான்[a].
  to: அந்த ஆயிரத்து எழுநூற்று எழுபத்தைந்தைக் கொண்டு, தூண்களுக்குக் கொக்கிகளைச் செய்தான்; அவற்றின் உச்சிகளைத் தகட்டால் மூடி, அவற்றுக்கு இணைப்புப் பட்டைகளையும் செய்தான்[a].
  rationale: The revision removes material and unit details that are supplied only by the wider context, while retaining the anaphoric “அந்த” to show the continuation from the preceding verse. It also renders “overlaid their tops” more directly and keeps the lexical uncertainty of the final verb in the footnote.
