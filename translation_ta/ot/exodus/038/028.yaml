translation_notes:
  register: நவீனத் தரத் தமிழில், கட்டுமானப் பட்டியலுக்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘உச்சிகள்’ என்பது சொல்லுக்கு நெருக்கமானதாயும் பொதுவாசகருக்குப் புரியத்தக்கதாயும் உள்ளது; தொழில்நுட்பமான ‘தூண் முகடுகள்’ தவிர்க்கப்பட்டுள்ளது.
