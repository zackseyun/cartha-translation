base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/028.yaml
  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: ta
  text: அந்த ஆயிரத்து எழுநூற்று எழுபத்தைந்தைக் கொண்டு, தூண்களுக்குக் கொக்கிகளைச் செய்தான்; அவற்றின் உச்சிகளைத் தகட்டால் மூடி, அவற்றுக்கு இணைப்புப் பட்டைகளையும் செய்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றை இணைப்புப் பட்டைகளால் இணைத்தான்.” இங்குள்ள எபிரெய வினை, தூண்களுக்கு இணைப்புப் பட்டைகள் அல்லது வளையப் பட்டைகள் பொருத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: அந்த ஆயிரத்து எழுநூற்று எழுபத்தைந்து சேக்கல் வெள்ளியைக் கொண்டு
  rationale: முந்தைய வசனத்தில் கணக்கிடப்பட்ட வெள்ளியின் மீதித் தொகையே இங்கு தொடர்கிறது. தமிழில் தொகையும் அளவையும் தெளிவுபடுத்த ‘சேக்கல் வெள்ளி’ சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; ‘அந்த’ என்பது முந்தைய வசனத்துடன் உள்ள தொடர்ச்சியைக் காட்டுகிறது.
- source_word: עָשָׂה
  choice: செய்தான்
  rationale: கட்டுமானப் பட்டியல் நடையில் இயல்பான, நேரடியான இறந்தகால வினை.
- source_word: וָוִים
  choice: கொக்கிகள்
  rationale: ஆசரிப்புக்கூடத் தூண்களில் பொருத்தப்பட்ட உலோகக் கொக்கிகளைக் குறிக்கும் கட்டுமானச் சொல்.
- source_word: לָעַמּוּדִים
  choice: தூண்களுக்கான
  rationale: עַמּוּדִים என்பதன் கட்டுமானப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וְצִפָּה רָאשֵׁיהֶם
  choice: அவற்றின் உச்சிகளுக்கு வெள்ளித் தகடு பதித்து
  rationale: צפה என்பதன் உலோகத் தகட்டால் மூடும் பொருளை ‘தகடு பதித்து’ தெளிவாகக் காட்டுகிறது. இவ்வசனத்தின் கணக்கியல் சூழலில் உலோகம் வெள்ளி என்பது தெளிவு.
- source_word: וְחִשַּׁק אֹתָם
  choice: அவற்றுக்கான இணைப்புப் பட்டைகளையும் செய்தான்
  rationale: חִשַּׁק என்பதன் இச்சூழலிலுள்ள அரிய கட்டுமானப் பொருளை, தூண்களைச் சார்ந்த பட்டைகள் அல்லது இணைப்புப் பகுதிகள் என வாசிக்கத்தக்க தமிழில் தருகிறது; வினையின் துல்லியமான செயற்பாடு பற்றிய ambiguity அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
