    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் ... செய்து
  rationale: עשה என்பதன் Qal wayyiqtol வடிவம் தொடர்ச்சியான கதைநடையில் ‘அவர் செய்தார்’ எனப் பொருள்படும். அடுத்த செயலை இணைக்கும் இயல்பான தமிழ் வாக்கிய அமைப்புக்காக ‘செய்து’ என வழங்கப்பட்டுள்ளது.
- source_word: הַבַּדִּים
  choice: சுமக்கும் தண்டுகளை
  rationale: திருக்கூடாரப் பொருட்களின் சூழலில் בַּדִּים என்பது அவற்றைச் சுமப்பதற்குப் பயன்படும் தண்டுகளைக் குறிக்கிறது. வெறும் ‘தண்டுகள்’ என்பதைவிட அவற்றின் பயன்பாட்டை இது தெளிவாக்குகிறது.
- source_word: עֲצֵי שִׁטִּים
  choice: அகாசியா மரத்தால்
  rationale: இக்கட்டமைப்புச் சொற்றொடர் அகாசியா மரப்பொருளைக் குறிக்கிறது. நவீனத் தமிழில் புரியக்கூடிய மரப்பெயராக ‘அகாசியா’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיְצַף
  choice: தகடு போர்த்தினார்
  rationale: கைவினைச் சூழலில் צפה என்பது ஓர் பொருளின் மேற்பரப்பை உலோகத்தால் மூடுதல் அல்லது தகடு பதித்தல் என்பதைக் குறிக்கிறது. இயல்பான தமிழில் செயலைத் துல்லியமாகக் காட்ட ‘தகடு போர்த்தினார்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֹתָם
  choice: அவற்றுக்கு
  rationale: இந்தப் பன்மைச் சுட்டுப்பெயர் முன் குறிப்பிடப்பட்ட சுமக்கும் தண்டுகளைக் குறிக்கிறது; தமிழ் வினை அமைப்பிற்கு ஏற்ப ‘அவற்றுக்கு’ என வழங்கப்பட்டுள்ளது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: נְחֹשֶׁת என்பது சூழலின்படி வெண்கலம் அல்லது செம்பு எனப் பொருள்படலாம். திருக்கூடாரப் பொருட்களின் இச்சூழலில் வழக்கமான முதன்மைத் தேர்வாக ‘வெண்கலம்’ வைக்கப்பட்டு, உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
