translation:
  language: ta
  text: முற்றத்தைச் சுற்றியிருந்த அடிப்பீடங்கள்[a], முற்றத்தின் வாசலின் அடிப்பீடங்கள், திருவுறைவிடத்தின் எல்லாக் குத்துமுளைகளும்[b], முற்றத்தைச் சுற்றியிருந்த எல்லாக் குத்துமுளைகளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிப்பீடங்கள்’ என்பதற்கு மாற்றாக ‘பொருத்துத் தளங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘குத்துமுளைகள்’ என்பதற்கு மாற்றாக ‘ஆப்புகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  choice: அடிப்பீடங்கள்
  rationale: சட்டங்களையோ தூண்களையோ தாங்கிய உலோக அடித்தளப் பகுதிகளைச் சுட்டுகிறது. ‘அடிப்பீடங்கள்’ என்பது கட்டுமானப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: חָצֵר
  choice: முற்றம்
  rationale: திருவுறைவிடத்தைச் சூழ்ந்திருந்த வேலியடைக்கப்பட்ட வெளிப்பகுதியை நவீன தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: סָבִיב
  choice: சுற்றிலும் இருந்த
  rationale: முற்றத்தின் எல்லாப் பக்கங்களையும் உள்ளடக்கும் சுற்றளவுப் பொருளைப் பாதுகாக்கிறது.
- source_word: שַׁעַר
  choice: வாசல்
  rationale: முற்றத்திற்குள் செல்லும் நுழைவுத் திறப்பை நேரடியாகவும் வழக்கமான தமிழிலும் குறிக்கிறது.
- source_word: יִתְדֹת
  choice: முளைகள்
  rationale: திருவுறைவிடத்தையும் முற்றத்தையும் நிலத்தில் உறுதிப்படுத்தப் பயன்படுத்திய ஆப்பு போன்ற பொருட்களைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: מִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: தேவன் தங்கும் பரிசுத்த இடம் என்ற சொல்லின் அடிப்படைப் பொருளையும், யாத்திராகமத்தில் அது குறிக்கும் எடுத்துச் செல்லத்தக்க பரிசுத்த அமைப்பின் தனித்துவத்தையும் காக்கிறது.
- source_word: כָּל
  choice: எல்லா
  rationale: பன்மையில் உள்ள முளைகள் அனைத்தும் அடங்கும் முழுமைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְאֵת / וְאֶת
  choice: பட்டியலின் இணைப்பு
  rationale: எபிரெய மொழியில் மீண்டும் வரும் இணைப்புடனான நேரடி வேற்றுமைக் குறி பட்டியலைத் தொடர்கிறது; தமிழில் காற்புள்ளிகளும் இறுதியில் வரும் ‘-உம்’ இணைப்புகளும் இதை இயல்பாக வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: מִשְׁכָּן என்ற பரிசுத்தக் கட்டமைப்பின் பெயர்
  choice: திருவுறைவிடம்
  alternative: திருக்கூடாரம்
  rationale: ‘திருவுறைவிடம்’ என்பது ‘உறைவிடம்’ என்ற மூலச்சொல்லின் பொருளை வெளிப்படுத்துகிறது; அதேவேளையில் ‘திரு-’ என்ற முன்னொட்டு அதன் பரிசுத்தப் பயன்பாட்டைக் காட்டுகிறது. ‘திருக்கூடாரம்’ இயல்பான மாற்றாக இருந்தாலும், அது மூலத்தில் வேறொரு சொல்லால் குறிக்கப்படும் ‘கூடாரம்’ என்ற கருத்துடன் வேறுபாட்டை மங்கச் செய்யலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் வடிவிலுள்ள மூலவாக்கியத்தின் சுருக்கத்தையும் ஒத்திசைவையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அடிப்பீடங்கள்’, ‘முற்றம்’, ‘வாசல்’ ஆகியவை சாதாரண வாசகருக்குப் புரியும் கட்டுமானச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன; அரிதான மாற்றுச் சொற்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
