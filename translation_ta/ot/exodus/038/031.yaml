- from: சுற்றிலும் இருந்த முற்றத்தின் அடிப்பீடங்கள்[a], முற்றத்தின் வாசலுக்கான அடிப்பீடங்கள், திருவுறைவிடத்தின் எல்லா முளைகளும்[b], சுற்றிலும் இருந்த முற்றத்தின் எல்லா முளைகளும்.
