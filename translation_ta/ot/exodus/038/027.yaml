base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: ta
  text: வெள்ளியின் நூறு தாலந்துகள், பரிசுத்தக் கூடாரத்திற்கான அடிப்பீடங்களையும்[a] திரைக்கான அடிப்பீடங்களையும்[b] வார்ப்பதற்குப் பயன்படுத்தப்பட்டன; நூறு தாலந்துகளுக்கு நூறு அடிப்பீடங்கள்—ஒவ்வோர் அடிப்பீடத்துக்கும் ஒரு தாலந்து.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அடிப்பீடங்கள்” என்பதற்குப் பதிலாக “பொருத்து அடிப்பாகங்கள்” என்றும் மொழிபெயர்க்கலாம்; இவை கூடாரத்தின் பலகைகளையும் திரைத்தூண்களையும் தாங்கிய உலோகப் பகுதிகள்.
    reason: lexical_alternative
  - marker: b
    text: “திரை” என்பது பரிசுத்த இடத்தையும் மகா பரிசுத்த இடத்தையும் பிரித்த உள் திரையைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: பயன்படுத்தப்பட்டது
  rationale: இந்தக் கணக்கு விவரத்தில் வெள்ளி எதற்காக ஒதுக்கிப் பயன்படுத்தப்பட்டது என்பதைக் குறிக்கிறது; தமிழில் இயல்பாகப் பொருளை வெளிப்படுத்தும் செயப்பாட்டு வடிவம்.
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: நூறு தாலந்து வெள்ளி
  rationale: அளவையும் பொருளையும் துல்லியமாகக் காக்கிறது; 'தாலந்து' என்பது பண்டைய எடை அலகின் ஒலிபெயர்ப்பு.
- source_word: לָצֶקֶת
  choice: வார்ப்பதற்கு
  rationale: உலோகத்தை உருக்கி அச்சில் வார்க்கும் தொழில்சார் பொருளைத் தெளிவாகக் குறிக்கிறது.
- source_word: אַדְנֵי
  choice: அடித்தளங்கள்
  rationale: கூடாரப் பலகைகளும் திரைத்தூண்களும் நிலைநிற்கப் பயன்பட்ட உலோக ஆதாரப் பகுதிகளை நவீன வாசகருக்குத் தெளிவாகக் குறிக்கிறது.
- source_word: הַקֹּדֶשׁ
  choice: பரிசுத்த கூடாரம்
  rationale: இங்கு திரையிலிருந்து வேறுபடுத்திக் கூறப்படும் முழுப் பரிசுத்தக் கூடார அமைப்பைக் குறிக்கிறது; 'பரிசுத்த இடம்' என்று மொழிபெயர்த்தால் ஓர் உட்பகுதியை மட்டும் குறிக்கும் அபாயம் உண்டு.
- source_word: הַפָּרֹכֶת
  choice: திரை
  rationale: ஆசரிப்புக் கூடாரத்தின் பரிசுத்த இடத்தையும் மகா பரிசுத்த இடத்தையும் பிரித்த உள் திரையைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: לִמְאַת הַכִּכָּר
  choice: நூறு தாலந்துக்கு
  rationale: நூறு அடித்தளங்களுக்கும் நூறு தாலந்துக்கும் உள்ள எண்ணிக்கை மற்றும் பகிர்வு ஒத்திசைவைப் பாதுகாக்கிறது.
- source_word: כִּכָּר לָאָדֶן
  choice: ஒவ்வோர் அடித்தளத்துக்கும் ஒரு தாலந்து
  rationale: ஒன்றுக்கு ஒன்று என்ற பகிர்வு விகிதத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: הַקֹּדֶשׁ என்பதன் எல்லை
  choice: பரிசுத்த கூடாரம்
  alternative: பரிசுத்த இடம்
  rationale: சூழலில் இது திரையின் அடித்தளங்களுக்கு எதிரெதிராகக் கூறப்படும் கூடார அமைப்பின் அடித்தளங்களைக் குறிக்கிறது; குறிப்பிட்ட உள் அறை என்று தேவையின்றிச் சுருக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கணக்கு விவரத்தின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை. பண்டைய எடை அலகான 'தாலந்து' அப்படியே வைக்கப்பட்டுள்ளது; தொழில்சார் 'வார்த்தல்' மற்றும் தெளிவான 'அடித்தளம்' பயன்படுத்தப்பட்டுள்ளன.
