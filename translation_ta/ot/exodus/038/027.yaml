- from: 'நூறு தாலந்து வெள்ளி, பரிசுத்த கூடாரத்தின் அடித்தளங்களையும் திரையின் அடித்தளங்களையும் வார்ப்பதற்குப் பயன்படுத்தப்பட்டது: நூறு தாலந்துக்கு நூறு அடித்தளங்கள்—ஒவ்வோர் அடித்தளத்துக்கும் ஒரு தாலந்து.[a][b]'
