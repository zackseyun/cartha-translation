  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: ta
  text: முற்றத்தின் வாசலின் மற்றப் பக்கத்துக்கு, இந்தப் பக்கத்திலும் அந்தப் பக்கத்திலும், பதினைந்து முழம் திரைச்சீலைகள் இருந்தன; அவற்றின் தூண்கள் மூன்று, அவற்றின் அடித்தளங்கள் மூன்று.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַכָּתֵף ... הַשֵּׁנִית
  choice: மற்றொரு பக்கப் பகுதிக்கான
  rationale: כָּתֵף என்பதன் அடிப்படைப் பொருள் ‘தோள்’; இக்கட்டுமானச் சூழலில் அது வாசலை ஒட்டிய பக்கப் பகுதியைக் குறிக்கிறது. ‘மற்றொரு’ என்பது הַשֵּׁנִית என்பதன் இடவியல் உறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִזֶּה וּמִזֶּה
  choice: இந்தப் பக்கத்திலும் அந்தப் பக்கத்திலும்
  rationale: வாசலின் இருபுறங்களிலும் உள்ள பகுதிகளைப் பகிர்ந்துரைக்கும் எபிரெய இடவியல் தொடரை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: முற்றத்தின் வாசலுக்கு
  rationale: லாமேத் முன்னிடைச்சொல் வாசலோடு பக்கப் பகுதிகளுக்குள்ள தொடர்பைக் காட்டுகிறது; தமிழ் வாக்கியத்தில் ‘வாசலுக்கு ... பக்கப் பகுதி’ என இயல்பாக இணைகிறது.
- source_word: קְלָעִים
  choice: திரைச்சீலைகள்
  rationale: திருவாசஸ்தல முற்றத்தின் எல்லையை அமைத்த தொங்கவிடப்பட்ட துணித் திரைகளைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவான கட்டுமானச் சொல்.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: பதினைந்து முழம்
  rationale: பண்டைய அளவலகான אַמָּה-வை மாற்றிக் கணக்கிடாமல் தமிழில் வழக்கமான ‘முழம்’ எனத் தருகிறது.
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: அவற்றின் தூண்கள் மூன்று
  rationale: எபிரெய மூலத்தின் வினையற்ற, பட்டியல் போன்ற அமைப்பையும் עַמּוּד என்பதன் கட்டுமானப் பொருளையும் காக்கிறது.
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: அவற்றின் அடித்தளங்கள் மூன்று
  rationale: אֶדֶן என்பது தூணைத் தாங்கும் அடிப்பாகம் அல்லது பொருத்துக்குழியுள்ள தாங்குதளத்தைக் குறிக்கலாம்; ‘அடித்தளங்கள்’ பொதுவாசகருக்கு எளிதில் புரியும் சொல்.
