  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: ta
  text: முற்றத்தின் வாசலுக்கான திரை[a], நீலநிற, ஊதாநிற, கருஞ்சிவப்பு நூலாலும் நுண்ணிய முறுக்கப்பட்ட சணல் நூலாலும் சித்திரத் தையல் கலைஞரின் வேலைப்பாடாகச் செய்யப்பட்டது. அது இருபது முழம் நீளமும் ஐந்து முழம் உயரமும்[b] இருந்தது; முற்றத்தின் தொங்குதிரைகளுக்கு இணையாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்றத்தின் நுழைவாயிலுக்கான திரை.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அகலத்தில் ஐந்து முழம் உயரம்” என்ற சிக்கலான அளவுக்கூறு உள்ளது. இது முற்றத்தின் தொங்குதிரைகளின் உயரத்துக்கு இந்தத் திரை ஒத்திருந்ததைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: முற்றத்தின் வாசலுக்கான திரை
  rationale: மָסַךְ என்பது இச்சூழலில் நுழைவிடத்தை மறைக்கும் துணித்திரையைக் குறிக்கிறது; שַׁעַר என்பதன் இடவியல் பொருளை ‘வாசல்’ தெளிவாகக் காட்டுகிறது.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: சித்திரத் தையல் கலைஞரின் வேலைப்பாடு
  rationale: வண்ண நூல்களால் வடிவங்கள் உருவாக்கும் திறமையான துணிநூல் கைவினையைச் சுட்டும் கலைஞர் சார்ந்த எபிரெயக் கட்டமைப்பைப் பாதுகாக்கிறது.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: நீலநிற, ஊதாநிற, கருஞ்சிவப்பு நூல்கள்
  rationale: மூன்று சாயநிறப் பொருட்களின் பட்டியலை இயல்பான தமிழில் தருகிறது; துணிநூல் சூழலால் ‘நூல்கள்’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: நன்றாக முறுக்கப்பட்ட மெல்லிய நாரிழை
  rationale: שֵׁשׁ குறிக்கும் உயர்தர மெல்லிய நார்த்துணிப் பொருளையும் מָשְׁזָר குறிக்கும் முறுக்கப்பட்ட தன்மையையும் தெரிவிக்கிறது; மூலச்சொல் நார் வகையைத் தெளிவாக வரையறுக்காததால் ‘சணல்’ என்று குறுக்கப்படவில்லை.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: இருபது முழம் நீளம்
  rationale: பழங்கால அளவான אַמָּה என்பதற்கு தமிழில் வழக்கமான வேதாகம அளவுச்சொல் ‘முழம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: קוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת
  choice: ஐந்து முழம் உயரம்
  rationale: எபிரெய அளவுக் கட்டமைப்பின் இயல்பான பொருளைத் தமிழில் தெளிவாகக் கொடுக்கிறது; בְרֹחַב தொடர்பான இலக்கணச் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: அதன் அகலம் முற்றத்தின் தொங்குதிரைகளுக்கு ஒத்திருந்தது
  rationale: לְעֻמַּת குறிக்கும் ஒப்புமையையும் קַלְעִים குறிக்கும் சுற்றுப்புறத் தொங்குதிரைகளையும் வெளிப்படுத்துகிறது.
