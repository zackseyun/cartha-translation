source:
  edition: WLC
  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: ta
  text: மேலும், யூதா கோத்திரத்தைச் சேர்ந்த ஊரின் மகனான ஊரியின் மகன் பெசலெயேல், யாவே[a] மோசேக்குக் கட்டளையிட்ட அனைத்தையும் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH”; பாரம்பரியமாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: இறைப் பெயரின் மூல வடிவத்தையும் பாரம்பரிய மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: பெசலெயேல்
  rationale: וּ என்ற இணைப்புச் சொல் இங்கு முந்தைய விவரிப்புடன் தொடர்ச்சியை ஏற்படுத்துகிறது; ஆனால் தனி வசனமாக இயல்பான தமிழில் தேவையற்ற ‘மேலும்’ என்பதைச் சேர்க்காமல் பெயரால் தொடங்கப்பட்டுள்ளது. தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: கூரின் மகனான ஊரியின் மகன்
  rationale: בֶּן ... בֶּן என்ற உடனடி வம்சவரிசையை ‘மகன்’ எனத் துல்லியமாகக் காத்து, எபிரெய வரிசையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: யூதா கோத்திரத்தைச் சேர்ந்த
  rationale: מַטֶּה இச்சூழலில் ‘கோத்திரம்’ என்பதைக் குறிக்கிறது; לְ குறிக்கும் சார்பு அல்லது உறுப்புரிமை இயல்பான தமிழில் ‘சேர்ந்த’ என வழங்கப்பட்டுள்ளது.
- source_word: עָשָׂה
  choice: செய்தான்
  rationale: עָשָׂה என்பது ‘செய்/உருவாக்கு’ என்ற பரந்த பொருளுடைய வினை. கூடாரப் பணிகள் முழுவதையும் உள்ளடக்கும் இச்சூழலில் ‘செய்தான்’ இயல்பாகவும் விரிவான பொருளுடனும் உள்ளது.
- source_word: אֵת כָּל אֲשֶׁר
  choice: அனைத்தையும்
  rationale: கட்டளையிடப்பட்டவற்றின் முழுமையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: எபிரெய நிறைவுற்ற வினையைத் தமிழில் பெயரெச்சத் தொடராக வழங்குவது, கட்டளை முதலில் கொடுக்கப்பட்டதையும் அதன் பின்னர் வேலை செய்யப்பட்டதையும் இயல்பாக உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶת מֹשֶׁה
  choice: மோசேக்குக்
  rationale: אֶת தனியே மொழிபெயர்க்கப்படவில்லை. צִוָּה உடன் வரும் மோசேயைத் தமிழில் கட்டளை பெற்ற நபராக வேற்றுமை உருபுடன் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் தனிப்பட்ட இறைப் பெயரான יהוה நேரடியாக உள்ளது. அதனைப் பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; பாரம்பரிய மாற்றுவழி அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்பும் இணையும் நடை பயன்படுத்தப்பட்டுள்ளது. வம்சவரிசை மற்றும் கோத்திரச் சார்பு தெளிவாக அமைக்கப்பட்டுள்ளன; இறைப் பெயருக்கான அடிக்குறி உரிய சொல்லுக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
