translation_notes:
  register: நவீன நிலையான தமிழில், கட்டமைப்புப் பட்டியலுக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. இறுதியில் வரும் ‘வெள்ளி’ கொக்கிகள், மேல்பூச்சு, பட்டைகள் ஆகிய மூன்றுக்கும் பொருந்துவதைத் தெளிவாக்க ‘வெள்ளியால் செய்யப்பட்டவை’ என வாக்கியம் அமைக்கப்பட்டுள்ளது; இதனால் எபிரெயின் பொருள் பாதுகாக்கப்பட்டும் தமிழில் செயற்கையான மீளுரைத்தல் தவிர்க்கப்பட்டும் உள்ளது.
