base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/019.yaml
  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
translation:
  language: ta
  text: அவற்றின் தூண்கள் நான்கு; அவற்றின் வெண்கல அடித்தாங்கிகளும்[a] நான்கு. அவற்றின் கொக்கிகளும், அவற்றின் உச்சிகளின் மேல்பூச்சும்[b], அவற்றின் பட்டைகளும்[c] வெள்ளியால் செய்யப்பட்டவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடிப்பீடங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் தூண்களின் அடியில் அவற்றைத் தாங்கிய உலோக உறுப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவற்றின் உச்சிகளின் உலோகத் தகட்டுப் பூச்சு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயில் சொல்லுக்குச் சொல், ‘அவற்றின் தலைகள்/உச்சிகளின் மேல்பூச்சு.’
    reason: lexical_alternative
  - marker: c
    text: இவற்றின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை; தூண்களோடு இணைந்திருந்த வெள்ளி உறுப்புகளைக் குறிக்க ‘பட்டைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: அவற்றின் தூண்கள்
  rationale: עַמּוּד என்பது இக்கூடாரக் கட்டமைப்புச் சூழலில் தூண் அல்லது நிலைக்கால் எனப் பொருள்படும்; தொடர்ச்சியான கட்டடச் சொல்லாட்சிக்கு ‘தூண்கள்’ இயல்பானது.
- source_word: אַדְנֵיהֶם
  choice: அவற்றின் அடித்தாங்கிகள்
  rationale: אֶדֶן என்பது தூண்களின் அடிப்பகுதியில் அவற்றைத் தாங்கும் உலோக உறுப்புகளைக் குறிக்கிறது. ‘அடித்தாங்கிகள்’ அதன் பணியைத் தெளிவாகக் காட்டுகிறது; ‘அடிப்பீடங்கள்’ மாற்றாகும்.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: கூடாரப் பொருட்களின் பட்டியலில் נְחֹשֶׁת மரபாகவும் பொருத்தமாகவும் வெண்கலம் என வழங்கப்படுகிறது; இச்சொல் பரந்த பொருளில் செம்பையும் குறிக்கக்கூடும்.
- source_word: וָוֵיהֶם
  choice: அவற்றின் கொக்கிகள்
  rationale: וָו என்பது திரை முதலியவற்றை இணைக்கப் பயன்படும் கொக்கி போன்ற பொருத்தியைச் சுட்டுகிறது; இச்சூழலில் ‘கொக்கிகள்’ தெளிவான நவீனத் தமிழ்.
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: இங்கு பொருளைக் குறிக்கும் כֶּסֶף நேரடியாக வெள்ளி எனப் பொருள்படுகிறது.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: அவற்றின் உச்சிகளின் மேல்பூச்சு
  rationale: צִפּוּי என்பது மேலே போர்த்தப்பட்ட உலோகப் பூச்சையும் רָאשֵׁיהֶם என்பது தூண்களின் தலைகள் அல்லது உச்சிகளையும் குறிக்கிறது. எபிரெய பெயர்ச்சொல் தொடரைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: חֲשֻׁקֵיהֶם
  choice: அவற்றின் பட்டைகள்
  rationale: இந்தக் கட்டமைப்புச் சொல்லின் துல்லியமான வடிவம் உறுதியற்றது. உருவத்தை மிகையாக வரையறுக்காமல், வெள்ளியால் செய்யப்பட்ட சுற்றுப்பட்டை அல்லது இணைப்பு உறுப்பைக் குறிக்க ‘பட்டைகள்’ பயன்படுத்தப்பட்டுள்ளது.
