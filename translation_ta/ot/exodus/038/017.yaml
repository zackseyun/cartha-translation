  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: ta
  text: தூண்களுக்கான அடித்தளங்கள் வெண்கலத்தால் செய்யப்பட்டிருந்தன[a]; தூண்களின் கொக்கிகளும் அவற்றின் பட்டைகளும்[b] வெள்ளியால் செய்யப்பட்டிருந்தன; தூண்களின் மேற்பகுதிகளின் பூச்சும் வெள்ளியால் செய்யப்பட்டிருந்தது. முற்றத்தின் தூண்கள் அனைத்திலும் வெள்ளிப் பட்டைகள் பொருத்தப்பட்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடித்தளங்கள்’ என்பதற்கு ‘அடிப்பீடங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பட்டைகள்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் தூண்களோடு தொடர்புடைய வெள்ளிப் பொருத்துகளைக் குறிக்கிறது; அதன் துல்லியமான கட்டட அமைப்பு உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: அடித்தளங்கள்
  rationale: கூடார அமைப்பில் தூண்களைத் தாங்கும் அடிப்பகுதிகளை இது குறிக்கிறது. நவீனத் தமிழில் தெளிவாக இருப்பதால் இச்சொல் தேர்ந்தெடுக்கப்பட்டது; ‘அடிப்பீடங்கள்’ என்பதும் சாத்தியம்.
- source_word: עַמֻּדִים
  choice: தூண்கள்
  rationale: கட்டமைப்பைத் தாங்கும் செங்குத்தான உறுப்புகளைக் குறிக்கும் இயல்பான, பொதுவாகப் புரியும் கட்டடக்கலைச் சொல்.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: திருக்கூடாரக் கட்டுமானச் சூழலில் இவ்வுலோகத்திற்கான வழக்கமானதும் பொருத்தமானதுமான தமிழ் மொழிபெயர்ப்பு; ‘செம்பு’ என்பது சொல்லியல் ரீதியாகச் சாத்தியம்.
- source_word: וָוֵי
  choice: கொக்கிகள்
  rationale: தூண்களோடு இணைக்கப்பட்டிருந்த பிடிப்பு உறுப்புகளை இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: חֲשׁוּקֵיהֶם
  choice: அவற்றின் பட்டைகள்
  rationale: தூண்களோடு தொடர்புடைய வெள்ளிப் பொருத்துகளைச் சுட்டுகிறது. அவற்றின் துல்லியமான வடிவம் உறுதியில்லை என்பதால் மிகக் குறிப்பிட்ட கட்டடக்கலைச் சொல்லைத் தவிர்த்து ‘பட்டைகள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: צִפּוּי
  choice: மேல்பூச்சு
  rationale: ஒரு பொருளின் மேற்பரப்பை உலோகத்தால் மூடும் அடுக்கைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: רָאשֵׁיהֶם
  choice: அவற்றின் உச்சிகள்
  rationale: சொற்பொருளில் ‘அவற்றின் தலைகள்’; இங்கு தூண்களின் மேற்பகுதிகளைக் குறிக்கிறது. ‘உச்சிகள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מְחֻשָּׁקִים
  choice: பட்டைகள் பொருத்தப்பட்டிருந்தன
  rationale: חֲשׁוּקֵיהֶם என்பதோடு உள்ள சொல்லியல் தொடர்பைப் பேணுகிறது; பொருத்துகளின் துல்லிய வடிவத்தை உறுதியாக நிர்ணயிக்காமல் செயப்பாட்டு நிலையைத் தெரிவிக்கிறது.
- source_word: חָצֵר
  choice: முற்றம்
  rationale: திருக்கூடாரத்தைச் சுற்றியிருந்த வரையறுக்கப்பட்ட வெளிப்பகுதியை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
