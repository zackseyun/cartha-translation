source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בָּ֗/הּ אֶת אַדְנֵי֙ פֶּ֚תַח אֹ֣הֶל מוֹעֵ֔ד וְ/אֵת֙ מִזְבַּ֣ח הַ/נְּחֹ֔שֶׁת וְ/אֶת מִכְבַּ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁר ל֑/וֹ וְ/אֵ֖ת כָּל כְּלֵ֥י הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: ta
  text: அதைக் கொண்டு அவர் சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கான அடித்தளங்களை[a], வெண்கலப் பலிபீடத்தை, அதற்குரிய வெண்கல வலைத்தட்டியை[b], பலிபீடத்தின் எல்லாக் கருவிகளையும் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சந்திப்புக் கூடாரத்தின் நுழைவாயிலுக்கான பொருத்துத் தாங்கிகளை”.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதற்குரிய வெண்கலச் சல்லடையை” அல்லது “அதற்குரிய வெண்கல வலைப்பின்னலை”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עשה என்பதன் இயல்பான கதைநடைப் பொருளை எளிமையாகவும் முறையாகவும் தருகிறது.
- source_word: בָּהּ
  choice: அதைக் கொண்டு
  rationale: முந்தைய வசனத்தில் கணக்கிடப்பட்ட வெண்கலத்தைக் குறிக்கும் கருவிப்பொருள் சார்ந்த பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אַדְנֵי
  choice: அடித்தளங்கள்
  rationale: கூடார அமைப்பைத் தாங்கிய உலோக அடிப்பாகங்களைக் குறிக்கிறது; பொதுவாசகருக்கு புரியும் சொல். தொழில்நுட்பமாக ‘பொருத்துத் தாங்கிகள்’ என்றும் கொள்ளலாம்.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயில்
  rationale: פתח என்பதன் நுழைவு அல்லது திறப்பு என்ற பொருளையும், אֹהֶל מוֹעֵד என்ற நிலையான பெயரையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: வெண்கலப் பலிபீடம்
  rationale: נְחֹשֶׁת என்பதற்கு இச்சூழலில் வழக்கமான ‘வெண்கலம்’ என்பதையும், מזבח என்பதற்கு ‘பலிபீடம்’ என்பதையும் பயன்படுத்துகிறது.
- source_word: מִכְבַּר
  choice: வலைத்தட்டி
  rationale: பலிபீடத்துடன் தொடர்புடைய வலைப்பின்னல் வடிவ உலோகத் தட்டைக் குறிக்கும் வகையில் பொருளும் உருவமும் புரியும்படி தருகிறது.
- source_word: אֲשֶׁר לוֹ
  choice: அதற்குரிய
  rationale: அந்த வலைத்தட்டிக்கும் பலிபீடத்துக்கும் உள்ள உடைமை அல்லது தொடர்பைச் சுருக்கமாகத் தருகிறது; அதன் துல்லியமான இடத்தை தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் எல்லாக் கருவிகள்
  rationale: כלים என்ற பரந்த சொல்லை, பலிபீடப் பணியில் பயன்படுத்திய உபகரணங்கள் என்ற பொருளில் இயல்பான தமிழில் தருகிறது.
