  yaml_path: translation/ot/exodus/038/007.yaml
  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: ta
  text: அதை அவற்றால் சுமப்பதற்காக, பலிபீடத்தின் பக்கங்களில் உள்ள வளையங்களுக்குள் தண்டுகளைச் செலுத்தினார்[a]. அதை பலகைகளால் உள்ளே காலியானதாகச் செய்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தண்டுகளை வளையங்களுக்குள் கொண்டுவந்தார்.” எபிரெய வினைச்சொல்லை நேரடியாக “கொண்டுவந்தார்” என மொழிபெயர்க்கலாம்; இச்சூழலில் தண்டுகளை வளையங்களுக்குள் செருகி வைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “உள்ளே காலியானது, பலகைகள்.” பலகைகளால் ஆன, உள்ளே காலியாக இருக்கும் கட்டமைப்பாகப் பலிபீடம் செய்யப்பட்டதையே இத்தொடர் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: செலுத்தினார்
  rationale: בוא என்பதன் ஹிஃபீல் வடிவம் இங்கு தண்டுகளை வளையங்களுக்குள் நிலைப்படுத்துவதைச் சுட்டுகிறது. ‘செலுத்தினார்’ என்பது இயக்கத்தையும் பொருத்துதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַבַּדִּים
  choice: தண்டுகளை
  rationale: திருக்கூடப் பொருட்களைச் சுமப்பதற்குப் பயன்பட்ட நீளமான தண்டுகளை בַּדִּים குறிக்கிறது; நவீன தமிழில் ‘தண்டுகள்’ தெளிவான சொல்.
- source_word: בַּטַּבָּעֹת
  choice: வளையங்களுக்குள்
  rationale: இடத்தைக் குறிக்கும் בְּ, வினைச்சொல்லுடன் சேர்ந்து வளையங்களின் உள்ளே செலுத்தப்படுவதை இங்கு குறிக்கிறது.
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் பக்கங்களில் இருந்த
  rationale: צְלָעוֹת என்பது பக்கங்களை அல்லது பக்கப் பகுதிகளைக் குறிக்கிறது. வளையங்கள் அவற்றில் அமைந்திருந்ததைத் தமிழ் தொடரமைப்பில் தெளிவுபடுத்துகிறது.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: அவற்றால் அதைச் சுமப்பதற்காக
  rationale: இது நோக்கத்தைக் குறிக்கும் வினையெச்சத் தொடர்; בָּהֶם தண்டுகளைச் சாதனமாகக் காட்டுவதால் ‘அவற்றால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נְבוּב
  choice: உள்ளீடற்றதாக
  rationale: נְבוּב என்பது உட்பகுதி திடமாக நிரப்பப்படாமல் காலியாக இருப்பதைக் குறிக்கிறது. ‘உள்ளீடற்ற’ என்பது கட்டமைப்பின் தன்மையைத் துல்லியமாகச் சொல்கிறது.
- source_word: לֻחֹת
  choice: பலகைகளால்
  rationale: לֻחֹת என்பது பலகைகள் எனப் பொருள் தருகிறது; எபிரெயச் சொற்றொடர் சுருக்கமானதாக இருப்பதால், அவற்றைக் கொண்டு உள்ளீடற்ற கட்டமைப்பு செய்யப்பட்டதாகத் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: עָשָׂה אֹתוֹ
  choice: அதை ... செய்தார்
  rationale: எபிரெய வாக்கியத்தின் செயப்படுபொருளையும் ‘செய்தார்’ என்ற நேரடியான வினையையும் காக்கிறது.
