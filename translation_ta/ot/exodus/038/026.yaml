base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: ta
  text: தலைக்கு ஒரு பெக்கா[a][b]—அதாவது, பரிசுத்த ஸ்தலச் சேக்கலின் அளவின்படி அரைச் சேக்கல்—இருபது வயதுமுதல் அதற்கு மேற்பட்ட வயதுடைய, கணக்கெடுக்கப்பட்டோரின் பட்டியலில் சேர்ந்த ஒவ்வொருவருக்கும். அவர்கள் 6,03,550 பேர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு பெக்கா என்பது பரிசுத்த ஸ்தலத்தில் பயன்படுத்தப்பட்ட எடைத் தரத்தின்படி அரைச் சேக்கலுக்குச் சமம்.
    reason: cultural_note
  - marker: b
    text: எபிரெய மொழியில் சொல்லர்த்தமாக ‘மண்டையோட்டுக்கு’ என்று உள்ளது; எண்ணப்பட்ட ஒவ்வொரு தனிநபரையும் குறிக்கும் மரபுத்தொடர் இது.
    reason: lexical_alternative
  - marker: c
    text: ‘கணக்கெடுக்கப்பட்டோரில் கடந்து சேர்ந்த ஒவ்வொருவருக்கும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் கணக்கெடுப்பில் பதிவு செய்யப்படுவதற்காகக் கடந்துசேரும் காட்சியைப் பயன்படுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: பெக்கா
  rationale: குறிப்பிட்ட ஓர் எடை அலகைக் குறிக்கும் தொழில்நுட்பச் சொல். அடுத்த சொற்றொடரே அதன் மதிப்பு அரைச் சேக்கல் என்று விளக்குவதால் ஒலிபெயர்ப்பு ஏற்றது.
- source_word: לַגֻּלְגֹּלֶת
  choice: தலைக்கு
  rationale: எபிரெய மொழியில் சொல்லர்த்தமாக ‘மண்டையோட்டுக்கு’ என்றாலும், தனித்தனி நபர்களைக் கணக்கிடும் மரபுத்தொடராகும். ‘தலைக்கு’ என்பது அதன் உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: அரைச் சேக்கல்
  rationale: பெக்காவின் மதிப்பை நேரடியாகக் குறிப்பிடும் அளவுச் சொற்றொடர்.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்துச் சேக்கல் அளவின்படி
  rationale: வழிபாட்டிடத்தில் அங்கீகரிக்கப்பட்ட சேக்கல் எடைத் தரத்தைக் குறிக்கிறது; ‘அளவின்படி’ என்பது அளவீட்டு பொருளைத் தெளிவாக்குகிறது.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: எண்ணப்பட்டவர்களிடையே கடந்து சென்ற ஒவ்வொருவருக்கும்
  rationale: கணக்கெடுப்பில் பதிவு செய்யப்படுவதற்காகக் கடந்துசெல்லும் மூலமொழியின் காட்சியையும் அதன் கணக்கெடுப்புச் சூழலையும் காக்கிறது.
- source_word: הַפְּקֻדִים
  choice: எண்ணப்பட்டவர்கள்
  rationale: கணக்கெடுப்பில் எண்ணப்பட்ட அல்லது பதிவு செய்யப்பட்ட நபர்களைக் குறிக்கும் செயப்பாட்டு வடிவத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்டவருமான
  rationale: கணக்கெடுப்புக்கான வயது வரம்பை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: மொத்தம் 6,03,550 பேர்
  rationale: எபிரெய உரையிலுள்ள மொத்த எண்ணிக்கையைத் தமிழில் வழக்கமான இந்திய இலக்கப் பிரிப்புடன் தெளிவாக அளிக்கிறது.
