translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பெக்கா’, ‘சேக்கல்’ போன்ற பண்பாட்டு அளவுச் சொற்கள் ஒலிபெயர்க்கப்பட்டு உடனடியான விளக்கமும் அடிக்குறிப்புகளும் வழங்கப்பட்டுள்ளன; கணக்கெடுப்பைக் குறிக்கும் மூலமொழியின் ‘கடந்து சென்ற’ உருவகம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது.
