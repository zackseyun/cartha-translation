  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: ta
  text: பரிசுத்த இடத்திற்கான எல்லாப் பணிகளிலும் பயன்படுத்தப்பட்ட தங்கம் முழுவதும்—அசைவாட்டுக் காணிக்கையின் தங்கம்[a]—பரிசுத்த சேக்கலின் அளவின்படி இருபத்தொன்பது தாலந்துகளும் எழுநூற்று முப்பது சேக்கல்களும்[b] ஆக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அசைவாட்டுக் காணிக்கை” என்பது கர்த்தரின் முன்னிலையில் சடங்குமுறையில் அசைத்துப் படைக்கப்படும் காணிக்கையைக் குறிக்கும் எபிரெய வழிபாட்டுச் சொல்.
    reason: cultural_note
  - marker: b
    text: “தாலந்து,” “சேக்கல்” என்பவை பண்டைய எடை அலகுகள். “பரிசுத்த சேக்கல்” என்பது இங்கு பயன்படுத்தப்பட்ட நிர்ணய எடைத் தரத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: பணிகளுக்காகவும் பயன்படுத்தப்பட்ட
  rationale: עשה என்பதன் செயல்பாட்டு வினையெச்சம் இங்கு கட்டுமானப் பணியில் தங்கம் பயன்படுத்தப்பட்டதைக் குறிக்கிறது; தங்கமே ‘செய்யப்பட்டது’ என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘பயன்படுத்தப்பட்ட’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் எல்லாப் பணிகளுக்காகவும்
  rationale: מְלָאכָה என்பது இச்சூழலில் திறமையுடன் செய்யப்பட்ட மொத்தக் கட்டுமானப் பணியையும், הַקֹּדֶשׁ என்பது பரிசுத்த இடத்தையும் குறிக்கிறது.
- source_word: זְהַב הַתְּנוּפָה
  choice: அசைவாட்டுக் காணிக்கையாகச் செலுத்தப்பட்ட தங்கம்
  rationale: תְּנוּפָה என்பது கர்த்தரின் முன்னிலையில் சடங்குமுறையில் அசைத்துப் படைக்கப்பட்ட காணிக்கைக்கான வழிபாட்டுச் சொல். தமிழில் பொருள் தெளிவாக இருக்கச் செயப்பாட்டு வடிவில் தரப்பட்டது.
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: இருபத்தொன்பது தாலந்தும் எழுநூற்று முப்பது சேக்கலும்
  rationale: எபிரெய எண்ணிக்கையை இயல்பான நவீனத் தமிழ் வரிசையில் தருகிறது; பண்டைய எடை அலகுகளின் தன்மையைப் பாதுகாக்க அவற்றின் பெயர்கள் ஒலிபெயர்க்கப்பட்டன.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்துச் சேக்கல் என்னும் எடை அளவின்படி
  rationale: இந்தச் சொற்றொடர் கணக்கிடப் பயன்படுத்தப்பட்ட அதிகாரப்பூர்வ எடைத் தரத்தைக் குறிக்கிறது. ‘எடை அளவின்படி’ என்பது அதன் செயல்பாட்டைத் தெளிவாக்குகிறது.
