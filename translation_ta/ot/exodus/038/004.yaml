  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
translation:
  language: ta
  text: அவர் பலிபீடத்திற்காக வெண்கலத்தால் செய்யப்பட்ட வலைப்பின்னல் வேலைப்பாடுடைய ஒரு வலைத் தகட்டை[a] செய்தார்; அது அதன் புடைப்புப் பட்டைக்குக் கீழே[b], கீழிருந்து அதன் நடுப்பகுதி வரை[c] இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெண்கலத்தால் செய்யப்பட்ட வலைவேலைப்பாடுள்ள ஒரு கிராதி.’
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘புடைப்புப் பட்டை’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் ‘விளிம்பு,’ ‘சுற்றுப்பட்டை,’ அல்லது ‘சுற்று அமைப்பு’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அடிப்புறத்திலிருந்து அதன் பாதி உயரம் வரை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் செய்தார்
  rationale: עשה என்பதன் தொடர்கதை வடிவம் அடுத்த செயலைக் குறிக்கிறது. நவீன தமிழில் தொடக்க இணைப்புச்சொல் இல்லாமல் ‘அவர் செய்தார்’ என்பது இயல்பாக உள்ளது.
- source_word: לַמִּזְבֵּחַ
  choice: பலிபீடத்திற்காக
  rationale: ל இங்கு அந்தப் பொருள் எதற்காகச் செய்யப்பட்டது என்பதைக் குறிக்கிறது; இருப்பிடத்தை அல்ல.
- source_word: מִכְבָּר
  choice: ஒரு சல்லடை
  rationale: இச்சொல் துளைகளோ வலைவடிவமோ கொண்ட உலோகத் தட்டமைப்பைக் குறிக்கிறது. ‘சல்லடை’ சாதாரண வாசகருக்கு புரியக்கூடிய கட்டமைப்புச் சொல்; மாற்று வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: வலைப்பின்னலான
  rationale: சொற்றொடர் நேரடியாக ‘வலையின் வேலைப்பாடு’ என்ற பொருளுடையது. ‘வலைப்பின்னலான’ என்பது அதன் வலைபோன்ற அமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கல
  rationale: திருக்கூடப் பொருட்களின் சூழலில் נְחֹשֶׁת என்பதற்கு ‘வெண்கலம்’ பொருத்தமான மரபும் சூழல்சார் சாத்தியமும் உடைய மொழிபெயர்ப்பு.
- source_word: תַּחַת
  choice: கீழே
  rationale: நேரடியான இடவுறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: כַּרְכֻּבּוֹ
  choice: அதன் புடைப்புப் பட்டை
  rationale: பலிபீடத்திலிருந்து புடைத்தோ சுற்றியோ அமைந்த கட்டமைப்புப் பகுதியைக் குறிக்கிறது. ‘புடைப்புப் பட்டை’ அதன் வடிவத்தைத் தெளிவாகக் காட்டுகிறது; சொல்லின் துல்லிய வடிவம் உறுதியற்றதால் மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: מִלְּמַטָּה עַד חֶצְיוֹ
  choice: அடிப்புறத்திலிருந்து அதன் பாதி உயரம் வரை
  rationale: מִן தொடக்கப் புள்ளியையும் עַד எல்லையையும் குறிக்கின்றன. பலிபீடத்தின் அடிப்புறத்திலிருந்து நடு உயரம் வரையிலான அளவை இவ்வடிவம் இயல்பாகத் தெரிவிக்கிறது.
