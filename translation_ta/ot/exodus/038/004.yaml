translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் துண்டித்த இடவமைப்பை தமிழில் தெளிவாக்க இரண்டாவது கூற்று சேர்க்கப்பட்டுள்ளது; இது சல்லடையின் இருப்பிடத்தை மட்டுமே வெளிப்படுத்துகிறது. அரிதான கட்டமைப்புச் சொற்களின் உறுதியின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
