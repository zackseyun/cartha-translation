base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: ta
  text: வடக்குப் பக்கம் நூறு முழம் நீளமுடையது; அதற்கான தூண்கள் இருபதும், அவற்றின் வெண்கல அடித்தளங்கள் இருபதும் இருந்தன. தூண்களின் கொக்கிகளும் பட்டைகளும்[a] வெள்ளியால் செய்யப்பட்டிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவற்றின் வெள்ளிப் பொருத்துகள்.’ எபிரெயச் சொல் தூண்களோடு தொடர்புடைய வெள்ளிக் கட்டிடப் பகுதிகளைக் குறிக்கிறது; அவற்றின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: வடக்குப் பக்கம்
  rationale: פאה என்பது பக்கம் அல்லது ஓரம் என்பதைக் குறிக்கிறது; צפון உடன் இது முற்றத்தின் வடக்குப் பக்கத்தைக் குறிக்கிறது.
- source_word: מֵאָה בָאַמָּה
  choice: நூறு முழம் நீளமாயிருந்தது
  rationale: இந்தச் சொற்றொடர் அளவிடப்பட்ட நீளத்தைத் தருகிறது. தமிழில் முழுமையான, இயல்பான வாக்கியமாக இருக்க ‘நீளமாயிருந்தது’ சேர்க்கப்பட்டுள்ளது.
- source_word: עַמּוּדֵיהֶם
  choice: அதன் இருபது தூண்கள்
  rationale: עַמּוּדִים இங்கு கட்டமைப்பைத் தாங்கும் தூண்களைக் குறிக்கிறது. எபிரெயச் சொற்றொடரின் உடைமை உறவு தமிழில் இயல்பாக ஒருமைச் சுட்டால் தரப்பட்டுள்ளது.
- source_word: אַדְנֵיהֶם
  choice: அவற்றின் இருபது வெண்கல அடித்தளங்கள்
  rationale: אדן என்பது தூண்களைத் தாங்கும் அடிப்பகுதி அல்லது குழிவடிவத் தாங்கியைச் சுட்டுகிறது; சாதாரண வாசகருக்குத் தெளிவாக ‘அடித்தளங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: கூடாரப் பொருட்களின் சூழலில் נְחֹשֶׁת என்பதற்கான வழக்கமான, பொருத்தமான உலோகப் பெயர் ‘வெண்கலம்’; அது செம்பையும் அதன் கலவைகளையும் குறிக்கக்கூடிய வரலாற்றுச் சாத்தியத்தை மறுப்பதில்லை.
- source_word: וָוֵי הָעַמּוּדִים
  choice: தூண்களின் கொக்கிகள்
  rationale: וָוִים இங்கு தூண்களில் பொருத்தப்பட்ட கொக்கிகளைக் குறிக்கிறது; கூடாரத்தை நிலத்தில் பதிக்கும் முளைகள் அல்ல.
- source_word: חֲשֻׁקֵיהֶם
  choice: அவற்றின் பட்டைகள்
  rationale: தூண்களுடன் தொடர்புடைய வெள்ளிப் பொருத்துகளைக் குறிக்கும் சொல் இது. அவற்றின் துல்லியமான வடிவம் உறுதியில்லாததால் பொதுவான ‘பட்டைகள்’ பயன்படுத்தப்பட்டு, மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כָּסֶף
  choice: வெள்ளி
  rationale: கொக்கிகளும் பட்டைகளும் செய்யப்பட்ட பொருளைக் குறிக்கும் நேரடியான உலோகப் பெயர்.
