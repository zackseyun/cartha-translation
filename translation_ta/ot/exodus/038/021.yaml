base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: ta
  text: திருக்கூடாரத்தின்—சாட்சியின் திருக்கூடாரத்தின்—கணக்குப் பதிவுகள்[a] இவையே. அவை மோசேயின் கட்டளைப்படி, ஆசாரியனான ஆரோனின் மகன் இத்தாமாரின் மேற்பார்வையில்[c] லேவியர்களின் சேவையின் மூலம் பதிவுசெய்யப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கணக்குப் பதிவுகள்’ என்பதற்கு ‘பொருட்பட்டியல்’ அல்லது ‘கணக்கு விவரங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் அதிகாரப்பூர்வமான கணக்கெடுப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லளவில், ‘இத்தாமாரின் கையில்’; இது அவர் மூலமாக அல்லது அவரது மேற்பார்வையில் பணி நடந்ததைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: கணக்கு விவரங்கள்
  rationale: இச்சொல் இங்கு திருக்கூடாரப் பொருட்களைக் குறித்த அதிகாரப்பூர்வமான கணக்கெடுப்பு அல்லது கணக்குப் பதிவைக் குறிக்கிறது. ‘கணக்கு விவரங்கள்’ என்பது நிர்வாகச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: யாத்திராகமத்தில் இச்சொல் புனித வாசஸ்தல அமைப்பைக் குறிக்கிறது. ‘திருக்கூடாரம்’ என்பது இச்சூழலில் தெளிவாகவும் தமிழில் நிலைபெற்றதாகவும் உள்ளது.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: சாட்சியின் திருக்கூடாரம்
  rationale: எபிரெயச் சொற்றொடரின் ‘சாட்சி’ என்ற சொல்லை உடன்படிக்கைப் பலகைகள் என முதன்மை உரையிலேயே விளக்கிவிடாமல் அப்படியே வைத்திருக்கிறது; அதன் சாத்தியமான குறிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: פֻּקַּד
  choice: கணக்கிடப்பட்டன
  rationale: פְקוּדֵי என்ற பெயர்ச்சொல்லில் உள்ள அதிகாரப்பூர்வக் கணக்கெடுப்பு கருத்தை இவ்வினைச்சொல் மீண்டும் எடுத்துரைக்கிறது.
- source_word: עַל פִּי מֹשֶׁה
  choice: மோசேயின் கட்டளைப்படி
  rationale: சொல்லளவில் ‘மோசேயின் வாயின்படி’ என்றாலும், இது ஒருவருடைய சொல் அல்லது கட்டளையின்படி என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: லேவியர்கள் செய்த பணி
  rationale: עֲבֹדָה என்பது இங்கு லேவியர்களுக்கு ஒப்படைக்கப்பட்ட சேவை அல்லது வேலையைக் குறிக்கிறது. ‘பணி’ வழிபாட்டு மற்றும் நிர்வாகச் செயல்பாடுகள் இரண்டுக்கும் இடமளிக்கிறது.
- source_word: בְּיַד אִיתָמָר
  choice: இத்தாமாரின் மேற்பார்வையில்
  rationale: ‘இத்தாமாரின் கையால்’ என்ற சொல்லளவிலான மரபுத்தொடர் இச்சூழலில் அவரது பொறுப்பு அல்லது மேற்பார்வையைக் குறிக்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியன்
  rationale: ஆரோனுடைய அதிகாரப்பூர்வமான வழிபாட்டுப் பணிப் பட்டத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: הָעֵדֻת (‘சாட்சி’) எதைக் குறிக்கிறது
  choice: முதன்மை உரையில் ‘சாட்சி’ என்ற சொல்லின் தெளிவின்மையைப் பாதுகாத்தல்
  alternative: ‘உடன்படிக்கைப் பலகைகள்’ அல்லது ‘உடன்படிக்கைச் சாட்சி’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: இச்சொல் பெரும்பாலும் பேழைக்குள் வைக்கப்பட்ட உடன்படிக்கைச் சாட்சியை, குறிப்பாக கற்பலகைகளை, குறித்தாலும், மூலவசனம் இங்கு அதை விரிவாகச் சொல்லவில்லை. எனவே விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய மூலத்தில் திருக்கூடாரம் இருமுறை வருவது ‘அதாவது’ என்ற இணைப்பின் மூலம் பாதுகாக்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியத்தின் நிர்வாகத் தகவல் தமிழில் தெளிவாக வாசிக்க அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளது.
