base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: ta
  text: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் பணியாற்றிய[a] பெண்களின் கண்ணாடிகளிலிருந்து[b] அவர் வெண்கலத் தொட்டியையும் அதன் வெண்கலத் தாங்கியையும் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சந்திப்புக் கூடாரத்தின் நுழைவாயிலில் கூடிவந்த பெண்கள்.” எபிரெயச் சொற்றொடர் ஒழுங்காகக் கூடுவதையும் பணியாற்றுவதையும் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “மெருகூட்டப்பட்ட உலோகக் கண்ணாடிகளிலிருந்து.” பண்டைக்காலக் கண்ணாடிகள் பொதுவாகக் கண்ணாடித் தகட்டால் அல்ல, மெருகூட்டப்பட்ட வெண்கலத்தால் செய்யப்பட்டன.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: தொட்டி
  rationale: திருக்கூடாரப் பணியில் கழுவுவதற்குப் பயன்படுத்தப்பட்ட பெரிய பாத்திரத்தைக் குறிக்கிறது. ‘தொட்டி’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כַּן
  choice: தாங்கி
  rationale: தொட்டியைத் தாங்கும் ஆதாரம் அல்லது பீடத்தைக் குறிக்கிறது. ‘தாங்கி’ அதன் செயலையும் பொருளுடனான தொடர்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: இச்சொல் செம்பையோ செம்புக் கலவையான வெண்கலத்தையோ குறிக்கக்கூடும்; திருக்கூடாரப் பொருட்களின் சூழலில் ‘வெண்கலம்’ என்பது பொருத்தமான மரபுவழி மொழிபெயர்ப்பு.
- source_word: בְּמַרְאֹת
  choice: கண்ணாடிகளைக் கொண்டு
  rationale: இங்குள்ள முன்னொட்டு மூலப்பொருள் அல்லது கருவிப் பொருளைக் குறிக்கிறது; பெண்களின் உலோகக் கண்ணாடிகளைப் பயன்படுத்தி தொட்டியும் தாங்கியும் செய்யப்பட்டன என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: பணியாற்றிய பெண்கள்
  rationale: צבא வேர்ச்சொல்லின் திரும்பக்கூறப்பட்ட வடிவம் ஒழுங்காகக் கூடுவதையும் நோக்கமுள்ள பணியையும் சுட்டலாம். ‘பணியாற்றிய’ என்பது ஆசாரியப் பதவி அல்லது குறிப்பிட்ட சடங்குப் பொறுப்பைச் சேர்க்காமல் சூழலுக்கேற்ற செயல்பாட்டைக் காட்டுகிறது.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் நுழைவாயிலில்
  rationale: இடத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரைத் தெளிவான, நவீன தமிழில் வழங்குகிறது.
- source_word: וַיַּעַשׂ
  choice: அவர் ... செய்தார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சிவடிவத்தைத் தமிழில் இயல்பான இறந்தகால வினையாக வழங்குகிறது; முந்தைய சூழலில் அறியப்படும் ஆண் ஒருமைப் பொருளை ‘அவர்’ குறிக்கிறது.
theological_decisions:
- issue: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ என்பதன் மூலம் பெண்களின் பங்கு எவ்வாறு விவரிக்கப்படுகிறது?
  choice: நுழைவாயிலில் பணியாற்றிய பெண்கள்
  alternative: நுழைவாயிலில் கூடிவந்த பெண்கள்
  rationale: צבא என்பது பணிக்காக அணிதிரள்வதையோ ஒழுங்காகக் கூடுவதையோ குறிக்கலாம். வசனம் அவர்களுக்கு ஆசாரியப் பதவியையோ குறிப்பிட்ட சடங்குப் பணியையோ வெளிப்படையாக வழங்கவில்லை; ஆகவே ‘பணியாற்றிய’ என்பது நோக்கமுள்ள செயல்பாட்டைப் பாதுகாத்தபடியே உரை கூறாத கோட்பாட்டு விவரத்தைச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணியாற்றிய’ என்பது பெண்களின் செயலைக் குறிக்கிறது; ஆனால் உரை குறிப்பிடாத ஆசாரிய அல்லது சடங்குப் பதவியை அதன்மேல் சுமத்தவில்லை. இரு அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்களுக்குப் பின்பே முதன்மை உரையில் இடப்பட்டுள்ளன.
