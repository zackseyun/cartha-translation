  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
translation:
  language: ta
  text: மேலும், அசைவாட்டுக் காணிக்கையின் வெண்கலம்[a][b] எழுபது தாலந்தும் 2,400 சேக்கலும் ஆகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செம்பு’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் נְחֹשֶׁת சூழலைப் பொறுத்துச் செம்பையையோ வெண்கலத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அசைவாட்டுக் காணிக்கை’ என்பது கர்த்தரின் முன்னிலையில் சடங்குமுறையில் அசைத்து அர்ப்பணிக்கப்படும் காணிக்கையைக் குறிக்கும் தொழில்நுட்பச் சொல்; சிலர் இதை பொதுவாக ‘அர்ப்பணக் காணிக்கை’ அல்லது ‘முன்வைக்கப்பட்ட காணிக்கை’ என்றும் மொழிபெயர்க்கின்றனர்.
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: இச்சொல் சூழலைப் பொறுத்துச் செம்பையோ வெண்கலத்தையோ குறிக்கலாம். திருவாசஸ்தலப் பொருட்களுக்குப் பயன்படுத்தப்பட்ட உலோகத்தின் பட்டியல் என்ற இச்சூழலில் ‘வெண்கலம்’ இயல்பான தேர்வு; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַתְּנוּפָה
  choice: அசைவாட்டுப் படையலாகச் செலுத்தப்பட்ட
  rationale: கர்த்தருடைய முன்னிலையில் சடங்குமுறையில் அசைத்துப் படைக்கப்பட்ட காணிக்கையைச் சுட்டும் தொழில்நுட்பச் சொல்லின் செயற்பாட்டு அர்த்தத்தை இது தெளிவாகக் காட்டுகிறது; இங்கு அந்தப் படையலாக வழங்கப்பட்ட உலோகத்தைச் சொல்கிறது.
- source_word: שִׁבְעִים כִּכָּר
  choice: எழுபது தாலந்து
  rationale: כִּכָּר என்பது பெரிய பழங்கால எடை அலகு. நவீன எடையாக ஊகித்து மாற்றாமல் மரபான அலகுப் பெயர் தக்கவைக்கப்படுகிறது.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: 2,400 சேக்கல்
  rationale: שֶׁקֶל என்பது எடை அலகு; அதனை ‘சேக்கல்’ எனத் தக்கவைத்து, வாசிப்பின் எளிமைக்காக எண்ணிக்கை இலக்கங்களில் தரப்படுகிறது.
- source_word: וְ
  choice: மேலும் தனியே மொழிபெயர்க்காமல் வாக்கியத் தொடரில் இணைத்தல்
  rationale: எபிரெய முன்னொட்டு முந்தைய கணக்கோடு இவ்வசனத்தை இணைக்கிறது. தமிழில் தனி ‘மேலும்’ சேர்ப்பதைவிட பட்டியல் தொடராக அமைந்த வாக்கியம் இயல்பாக உள்ளது.
