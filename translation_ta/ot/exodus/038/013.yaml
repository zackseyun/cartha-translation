  source_fidelity: 'மூல எபிரெயத்தின் וְלִפְאַת கֵדְמָה மִזְרָחָה என்ற இணையான அளவீட்டு-விவரிப்பு பாதுகாக்கப்பட்டுள்ளது: கிழக்குப் பக்கம், அதனைத் தொடர்ந்து சூரிய உதய/கிழக்குத் திசை குறிப்பு, பின்னர் ஐம்பது முழம். ஆனால் வரைவில் உள்ள “சூரியன் உதிக்கும் திசையில்” என்பது இருப்பிடத்தைக் குறிக்கிறது; מִזְרָחָה இங்குக் கொண்டிருக்கும் திசைநோக்கி/கிழக்குநோக்கி நுணுக்கத்தை “சூரிய உதயத் திசையை நோக்கி” சிறப்பாகக் காட்டும்.'
