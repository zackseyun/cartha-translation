  text: And for the east side[a], eastward, fifty cubits.
translation:
  language: ta
  text: மேலும், கிழக்குப் பக்கத்திற்கு[a]—சூரிய உதயத் திசையை நோக்கி—ஐம்பது முழம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, ‘கிழக்கு நோக்கிப் பக்கத்திற்கு, சூரிய உதயத் திசையை நோக்கி’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: மேலும், ... பக்கத்திற்கு
  rationale: פֵּאָה என்பது ‘பக்கம், ஓரம், எல்லை’ எனப் பொருள்படும். திருக்கூடார முற்றத்தின் அளவுகளை விவரிக்கும் இச்சூழலில் ‘பக்கம்’ இயல்பானது; முன்னொட்டுகளின் இணைப்பையும் தொடர்பையும் ‘மேலும், ... பக்கத்திற்கு’ வெளிப்படுத்துகிறது.
- source_word: קֵדְמָה
  choice: கிழக்கு
  rationale: இச்சொல் ‘கிழக்கு’ அல்லது ‘முன்புறம்/கிழக்கு நோக்கி’ என்பதைக் குறிக்கலாம். தொடர்ந்து வரும் மִזְרָחָה திசையைத் தெளிவுபடுத்துவதால், இங்கு ‘கிழக்கு’ பொருத்தமானது.
- source_word: מִזְרָחָה
  choice: சூரியன் உதிக்கும் திசையில்
  rationale: מִזְרָח என்பது சூரிய உதயத்தின் இடத்தையும் அதனால் கிழக்கையும் குறிக்கிறது. முன்பே ‘கிழக்கு’ வந்திருப்பதால், எபிரெயத்தின் இரட்டைத் திசைக் குறிப்பைப் பாதுகாக்க ‘சூரியன் உதிக்கும் திசையில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲמִשִּׁים
  choice: ஐம்பது
  rationale: நேரடியான எண்ணிக்கைச் சொல்.
- source_word: אַמָּה
  choice: முழம்
  rationale: אַמָּה என்பது பழங்கால நீள அளவான ‘முழம்’; தமிழ் வேதாகம நடையிலும் பொதுவாக அறியப்படும் அளவுப்பெயர்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், அளவீட்டுப் பட்டியலுக்குரிய சுருக்கமான வாக்கிய அமைப்பு காக்கப்பட்டுள்ளது. ‘சூரியன் உதிக்கும் திசையில்’ என்பது மூல எபிரெயத்தின் இணையான திசைக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது; அடிக்குறி அதன் சொற்சொல் அமைப்பைக் காட்டுகிறது.
