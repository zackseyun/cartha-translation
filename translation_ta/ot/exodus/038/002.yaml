  terminology: ‘கொம்புகள்,’ ‘வெண்கலம்,’ and ‘மூடினான்’ are suitable modern-standard Tamil renderings for the cultic architectural protrusions, bronze, and metal overlaying respectively. The wording concerning the horns being ‘ஒரே துண்டாக’ appropriately conveys the construction implication without introducing doctrinal interpretation.
