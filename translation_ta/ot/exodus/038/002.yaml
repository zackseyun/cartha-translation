  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: ta
  text: அதன் நான்கு மூலைகளில் கொம்புகளைச் செய்தான். அந்தக் கொம்புகள் அதனோடு ஒரே துண்டாக இருந்தன[a]. அதை வெண்கலத்தால் மூடினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், சொல்லுக்குச் சொல், “அதிலிருந்து அதன் கொம்புகள் இருந்தன”; அவை தனியாகச் செய்யப்பட்டுப் பின்னர் இணைக்கப்படாமல், பலிபீடத்தோடு ஒருங்கிணைந்தவையாக இருந்தன என்பதை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் செம்பையையோ வெண்கலத்தையோ குறிக்கலாம்; திருக்கூடாரத்தைப் பற்றிய இத்தகைய இடங்களில் “வெண்கலம்” என்பது மரபான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பதன் தொடர்கதை வடிவத்தை இயல்பான நவீனத் தமிழில் நேரடியாகக் கூறுகிறது; எழுவாய் முந்தைய சூழலிலிருந்து புரிந்துகொள்ளப்படுகிறது.
- source_word: קַרְנֹתָיו
  choice: அதற்குக் கொம்புகள் / அந்தக் கொம்புகள்
  rationale: קֶרֶן என்பதன் அடிப்படை உருவகமான ‘கொம்பு’ என்பதையும், பலிபீடத்தின் மூலைகளிலுள்ள கொம்பு போன்ற நீட்சிகளைக் குறிக்கும் வழிபாட்டுச் சூழலையும் காக்கிறது.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: அதன் நான்கு மூலைகளிலும்
  rationale: על இங்குக் கொம்புகள் மூலைகளில் அமைந்த இடத்தைக் குறிக்கிறது. ‘மூலைகளிலும்’ என்பது நான்கு மூலை ஒவ்வொன்றிலும் இருந்தன என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: அந்தக் கொம்புகள் அதனோடு ஒரே துண்டாக இருந்தன
  rationale: சொல்லுக்குச் சொல் ‘அதிலிருந்து அதன் கொம்புகள் இருந்தன.’ கட்டுமானச் சூழலில் அவை தனியாகச் செய்து இணைக்கப்படாமல் பலிபீடத்தோடு ஒருங்கிணைந்தவையாக இருந்தன என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיְצַף אֹתוֹ
  choice: அதை ... மூடினான்
  rationale: צפה என்பது ஓர் அமைப்பின் மேற்பரப்பை உலோகத்தால் போர்த்துதல் அல்லது தகடிடுதல். ‘மூடினான்’ என்பது இங்கு தெளிவான, பொதுமக்கள் புரிந்துகொள்ளும் தமிழ்.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: נְחֹשֶׁת என்பது செம்பையோ வெண்கலத்தையோ குறிக்கலாம். திருக்கூடாரப் பொருட்களின் சூழலில் ‘வெண்கலம்’ என்பது மரபானதும் பொருத்தமானதும்; மூலச்சொல்லின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
