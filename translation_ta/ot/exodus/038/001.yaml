  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אָרְכּ֜/וֹ וְ/חָֽמֵשׁ אַמּ֤וֹת רָחְבּ/וֹ֙ רָב֔וּעַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: ta
  text: 'அவன் எரிபலிக்கான பலிபீடத்தை அகாசியா மரத்தால் செய்தான். அது ஐந்து முழம் நீளமும் ஐந்து முழம் அகலமும் கொண்ட சதுரமாக[a] இருந்தது; அதன் உயரம் மூன்று முழம்.


    [a] அல்லது, “நான்கு பக்கங்களும் சமமாக.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான்கு பக்கங்களும் சமமாக.”
    reason: רָבוּעַ என்பதற்கான சொற்படியான மாற்றைத் தருகிறது; பிரதான உரையின் “சதுரமாக” என்ற பொருளை விரித்துரைக்கிறது.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் செய்தான்
  rationale: தொடர்கதை அமைப்பிலுள்ள வாவ்-தொடர்ச்சியுடன் கூடிய வினை, கடந்தகாலச் செயலைக் குறிக்கிறது. முந்தைய சூழலில் குறிப்பிடப்பட்ட செய்பவரைத் தமிழில் இயல்பாகத் தொடர “அவன் செய்தான்” என மொழிபெயர்க்கப்பட்டது.
- source_word: מִזְבַּח הָעֹלָה
  choice: எரிபலிக்கான பலிபீடம்
  rationale: இந்தக் கட்டமைப்புத் தொடர், முழுவதும் எரிக்கப்படும் பலியோடு தொடர்புடைய பலிபீடத்தைக் குறிக்கிறது. “எரிபலிக்கான பலிபீடம்” என்பது மூலத்தின் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עֲצֵי שִׁטִּים
  choice: அகாசியா மரம்
  rationale: שִׁטִּים என்பது அகாசியா வகை மரத்தைக் குறிக்கிறது. பாரம்பரிய ஒலிபெயர்ப்பைவிட “அகாசியா மரம்” தாவரவகையை நவீன வாசகருக்குத் தெளிவாகக் காட்டுகிறது.
- source_word: חָמֵשׁ אַמּוֹת
  choice: ஐந்து முழம்
  rationale: אַמָּה என்ற பண்டைய நீள அலகை, தமிழில் வழக்கமான வேதாகம அளவுச்சொல்லான “முழம்” என்று தக்கவைத்துள்ளது; நவீன அலகாக மாற்றி ஊகமான துல்லியத்தைச் சேர்க்கவில்லை.
- source_word: אָרְכּוֹ / רָחְבּוֹ
  choice: நீளமும் … அகலமும்
  rationale: பலிபீடத்தின் இரு பரிமாணங்களைக் குறிக்கும் உடைமைப் பின்னொட்டுகள், தமிழின் இயல்பான அளவீட்டு வாக்கிய அமைப்பில் தெரிவிக்கப்பட்டுள்ளன.
- source_word: רָבוּעַ
  choice: சதுரமாக
  rationale: இந்தப் பெயரடை சம நீளமும் அகலமும் கொண்ட சதுர வடிவத்தைக் குறிக்கிறது. “சதுரமாக” என்பது சுருக்கமான, நவீனத் தமிழ் இணைச்சொல்; சொற்படியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: קֹמָתוֹ
  choice: அதன் உயரம்
  rationale: கட்டுமானச் சூழலில் קוֹמָה என்பது உயரத்தைக் குறிக்கிறது. “அதன் உயரம்” என்பது தெளிவான இயல்பான தமிழ் வடிவம்.
