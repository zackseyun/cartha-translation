translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டுப் பொருளுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. மூலத்தின் அளவுகள் “முழம்” என்றே தக்கவைக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் அடிக்குறி மரச்சொல்லுக்குப் பின் தவறாகத் தோன்றினாலும், அதன் உள்ளடக்கம் רָבוּעַ என்பதற்கான மாற்றாக இருப்பதால் தமிழில் “சதுரமாக” என்பதற்குப் பின் சரியாக இணைக்கப்பட்டது.
