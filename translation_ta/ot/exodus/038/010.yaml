  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேய வாக்கியத்தின் பட்டியலிடும் அமைப்பு பாதுகாக்கப்பட்டுள்ளது; தெளிவுக்காக பொருளைக் குறிக்கும் இடங்களில் ‘செய்யப்பட்டவை’ சேர்க்கப்பட்டுள்ளது.
