base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/010.yaml
  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
translation:
  language: ta
  text: அவற்றின் தூண்கள் இருபது; அவற்றின் இருபது அடித்தளங்கள் வெண்கலத்தால் செய்யப்பட்டவை. தூண்களின் கொக்கிகளும் அவற்றின் இணைப்புப் பட்டைகளும்[a] வெள்ளியால் செய்யப்பட்டவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் வளையங்களும்.” இங்கு வரும் எபிரேயச் சொல் தூண்களோடு பொருத்தப்பட்ட பட்டைகள், வளையங்கள் அல்லது இணைப்புக் கூறுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: அவற்றின் தூண்கள்
  rationale: עַמּוּדִים என்பது கட்டமைப்பைத் தாங்கும் தூண்கள் அல்லது கம்பங்களைக் குறிக்கிறது. பின்னணியில் கூறப்பட்ட திரைச்சீலைகளைச் சார்ந்த பன்மைச் சுட்டைத் தமிழில் இயல்பாக ‘அவற்றின்’ என்று வழங்குகிறது.
- source_word: עֶשְׂרִים
  choice: இருபது
  rationale: இரண்டு இடங்களிலும் வரும் எளிய எண்ணுப்பெயர்.
- source_word: אַדְנֵיהֶם
  choice: அவற்றின் ... அடித்தளங்கள்
  rationale: ஆசரிப்புக்கூடச் சூழலில் אֶדֶן என்பது தூண் அல்லது சட்டத்துக்கான அடிப்பகுதி/பொருத்துக் குழியுள்ள தாங்குதளத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘அடித்தளங்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: இந்த எபிரேயச் சொல் செம்பையோ வெண்கலத்தையோ குறிக்கலாம்; ஆசரிப்புக்கூடப் பொருட்களின் சூழலிலும் மரபான பயன்பாட்டிலும் ‘வெண்கலம்’ பொருத்தமானது.
- source_word: וָוֵי הָעַמֻּדִים
  choice: தூண்களின் கொக்கிகள்
  rationale: וָוִים என்பது திரைச்சீலைகளைத் தூண்களோடு பொருத்தப் பயன்பட்ட கொக்கிகள் அல்லது இணைப்புச் சாதனங்களைக் குறிக்கிறது.
- source_word: חֲשֻׁקֵיהֶם
  choice: அவற்றின் இணைப்புப் பட்டைகள்
  rationale: இச்சொல் தூண்களோடு தொடர்புடைய பட்டைகள் அல்லது இணைப்புக் கூறுகளைக் குறிக்கலாம். ‘இணைப்புப் பட்டைகள்’ என்பது அவற்றின் சாத்தியமான பணியைத் தெரிவிக்கிறது; சொல்லின் துல்லிய வடிவம் உறுதியற்றது என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: כָּסֶף
  choice: வெள்ளி
  rationale: பொருளைக் குறிக்கும் நேரடியான சொல்.
