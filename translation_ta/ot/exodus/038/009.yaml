  text: וַ/יַּ֖עַשׂ אֶת הֶ/חָצֵ֑ר לִ/פְאַ֣ת נֶ֣גֶב תֵּימָ֗נָ/ה קַלְעֵ֤י הֶֽ/חָצֵר֙ שֵׁ֣שׁ מָשְׁזָ֔ר מֵאָ֖ה בָּ/אַמָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/009.yaml
  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: ta
  text: அவன் முற்றத்தை அமைத்தான். தெற்குப் பக்கத்தில், தெற்கு நோக்கி, முற்றத்தின் தொங்குதிரைகள்[a] நேர்த்தியாக முறுக்கப்பட்ட லினன் துணியால் செய்யப்பட்டிருந்தன; அவற்றின் நீளம் நூறு முழம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முற்றத்தின் திரைகள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் அமைத்தான்
  rationale: עָשָׂה என்பதன் தொடர்நிகழ்வு வடிவம் அடுத்த செயலை எளிமையாக விவரிக்கிறது. முற்றத்தைப் பற்றிய சூழலில் ‘அமைத்தான்’ என்பது இயல்பான தமிழாகவும் ‘செய்தான்’ என்பதன் பொருளைத் துல்லியமாகவும் தருகிறது.
- source_word: הֶחָצֵר
  choice: முற்றம்
  rationale: இங்கு חָצֵר என்பது திருவாசஸ்தலத்தைச் சுற்றியுள்ள வெளிப்புறப் பகுதியைக் குறிக்கிறது; நவீனத் தமிழில் ‘முற்றம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לִפְאַת
  choice: பக்கத்தில்
  rationale: இச்சொல் ஓர் ஓரம் அல்லது பக்கத்தைக் குறிக்கிறது. திசைச்சொற்களுடன் ‘பக்கத்தில்’ என்பது தமிழில் இயல்பான இடவியல் சொல்லாக்கம்.
- source_word: נֶגֶב תֵּימָנָה
  choice: தெற்குப் பக்கத்தில், தெற்கு நோக்கி
  rationale: எபிரெயத்தில் உள்ள தெற்கைக் குறிக்கும் இரு கூறுகளையும் ஒன்றாகச் சுருக்காமல், அதன் முழுமையையும் ஓரளவு மீளுரைப்பையும் பாதுகாக்கிறது.
- source_word: קַלְעֵי הֶחָצֵר
  choice: முற்றத்தின் தொங்குதிரைகள்
  rationale: திருவாசஸ்தலச் சூழலில் קְלָעִים என்பது முற்றத்தின் எல்லையை உருவாக்கிய தொங்கவிடப்பட்ட துணிகளைக் குறிக்கிறது. ‘தொங்குதிரைகள்’ அவற்றின் வடிவத்தையும் பணியையும் தெளிவாக்குகிறது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: முறுக்கப்பட்ட மெல்லிய சணல் நூல்
  rationale: שֵׁשׁ மெல்லிய லினன் துணிக்கான சணல் நாரையும், מָשְׁזָר முறுக்கப்பட்ட நூலமைப்பையும் குறிக்கிறது. இச்சொல்லாக்கம் பொருளையும் தயாரிப்பு முறையையும் பாதுகாக்கிறது.
- source_word: מֵאָה בָּאַמָּה
  choice: நீளம் நூறு முழம்
  rationale: எபிரெயச் சொற்றொடர் அளவைத் தருகிறது; தமிழில் அளவின் பரிமாணத்தை இயல்பாக வெளிப்படுத்த ‘நீளம்’ சேர்க்கப்பட்டுள்ளது. ‘முழம்’ என்பது אַמָּה என்பதற்கான மரபான அளவுப்பெயர்.
