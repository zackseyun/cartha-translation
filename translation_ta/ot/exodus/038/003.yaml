  text: וַ/יַּ֜עַשׂ אֶֽת כָּל כְּלֵ֣י הַ/מִּזְבֵּ֗חַ אֶת הַ/סִּירֹ֤ת וְ/אֶת הַ/יָּעִים֙ וְ/אֶת הַ/מִּזְרָקֹ֔ת אֶת הַ/מִּזְלָגֹ֖ת וְ/אֶת הַ/מַּחְתֹּ֑ת כָּל כֵּלָ֖י/ו עָשָׂ֥ה נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: ta
  text: அவர் பலிபீடத்தின் எல்லாக் கருவிகளையும்—பானைகள்[b], மண்வாரிகள், கிண்ணங்கள், முள்கரண்டிகள், நெருப்புத் தட்டுகள் ஆகியவற்றையும்—செய்தார். அதன் கருவிகள் அனைத்தையும் வெண்கலத்தால்[a] செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செம்பால்.’
    reason: lexical_alternative
  - marker: b
    text: ‘பானைகள்’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், சாம்பலை அகற்றப் பயன்படுத்திய பாத்திரங்களைச் சிறப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: பலிபீடத்திற்குரிய எல்லாக் கருவிகள்
  rationale: כְּלִי என்பது பாத்திரங்கள், கருவிகள், உபகரணங்கள் ஆகியவற்றைக் குறிக்கும் பரந்த சொல். இங்கு பட்டியலிடப்பட்டுள்ள பலவகைப் பொருட்களையும் இயல்பாக உள்ளடக்குவதால் ‘கருவிகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַמִּזְבֵּחַ
  choice: பலிபீடம்
  rationale: வழிபாட்டுச் சூழலில் מִזְבֵּחַ என்பதற்கான தெளிவான, நிலைபெற்ற நவீனத் தமிழ் சொல்.
- source_word: הַסִּירֹת
  choice: பானைகள்
  rationale: סִירוֹת என்பதன் அடிப்படைப் பொருள் பானைகள். இவை சாம்பலை அகற்றப் பயன்படுத்தப்பட்டிருக்கலாம்; ஆனால் மூலவசனம் அதை வெளிப்படையாகக் கூறாததால் அந்தக் குறிப்பை உரையில் சேர்க்காமல் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: הַיָּעִים
  choice: மண்வாரிகள்
  rationale: יַע என்பது வாருவதற்கோ அள்ளுவதற்கோ பயன்படும் கருவி. பலிபீடப் பணிச் சூழலில் ‘மண்வாரிகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַמִּזְרָקֹת
  choice: கிண்ணங்கள்
  rationale: מִזְרָקֹת என்பது திரவங்களை, குறிப்பாகச் சடங்கில் பயன்படுத்தப்பட்ட திரவங்களை, ஏந்தும் பாத்திரங்களைக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத செயற்பாட்டைச் சேர்க்காமல் ‘கிண்ணங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַמִּזְלָגֹת
  choice: முள்கரண்டிகள்
  rationale: מִזְלָגֹת என்பது முள் போன்ற முனைகளுடைய கருவிகளைக் குறிக்கிறது. ‘முள்கரண்டிகள்’ அதன் வடிவத்தையும் பயன்பாட்டையும் பொதுவாசகருக்குத் தெளிவாகக் காட்டுகிறது; ‘இறைச்சிக் கொக்கிகள்’ போன்ற கூடுதல் குறிப்பைத் தவிர்க்கிறது.
- source_word: הַמַּחְתֹּת
  choice: நெருப்புத் தட்டுகள்
  rationale: מַחְתָּה என்பது நெருப்பையோ எரியும் தணல்களையோ எடுத்துச் செல்லும் தட்டு அல்லது பாத்திரம். ‘நெருப்புத் தட்டுகள்’ அதன் பயன்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: כָּל כֵּלָיו
  choice: அதன் கருவிகள் அனைத்தும்
  rationale: ஒருமை ஆண்பால் பின்னொட்டு பலிபீடத்தைக் குறிக்கிறது. முதல் தொடரில் வந்த ‘கருவிகள்’ என்பதையே மீண்டும் பயன்படுத்துவது எபிரெய அமைப்பையும் சொல் ஒருமைப்பாட்டையும் காக்கிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: நְחֹשֶׁת என்பது செம்பையோ செம்புக் கலப்பு உலோகத்தையோ குறிக்கலாம். திருக்கூடாரப் பொருட்களின் சூழலில் வழக்கமானதும் வரலாற்று ரீதியாகப் பொருத்தமானதுமான ‘வெண்கலம்’ முதன்மைத் தேர்வாக வைக்கப்பட்டு, ‘செம்பு’ அடிக்குறிப்பில் தரப்பட்டது.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: செய்தார் ... செய்தார்
  rationale: 'எபிரெய உரையில் עשה இருமுறை வருகிறது: முதலில் செயலை அறிமுகப்படுத்தவும் பின்னர் பொருட்கள் அனைத்தும் எந்த உலோகத்தால் செய்யப்பட்டன என்பதைத் தொகுத்துக் கூறவும். இந்த மீளுரைப்பைத் தமிழிலும் காக்கப்பட்டது.'
