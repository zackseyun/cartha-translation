translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர் புரிந்துகொள்ளும் வகையிலும் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் பட்டியல் அமைப்பும் ‘செய்தார்’ என்ற வினையின் மீளுரைப்பும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
