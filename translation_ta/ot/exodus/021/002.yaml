  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew servant[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: ta
  text: நீ ஒரு எபிரேய அடிமையை[a] வாங்கினால், அவன் ஆறு ஆண்டுகள் பணியாற்ற வேண்டும்; ஆனால் ஏழாம் ஆண்டில் அவன் எந்தப் பணமும் செலுத்தாமல் சுதந்திரமாக வெளியேற வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீ ஒரு எபிரேய அடிமையை வாங்கும்போது.’ எபிரேய நிபந்தனைத் துகள் இத்தகைய வழக்குச் சட்டத்தை ‘வாங்கினால்’ அல்லது ‘வாங்கும்போது’ என அறிமுகப்படுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘அவன் எதுவுமின்றிச் சுதந்திரத்திற்குப் புறப்பட்டுச் செல்ல வேண்டும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: வாங்கினால்
  rationale: நிபந்தனை அடிப்படையிலான வழக்குச் சட்டத்தை இயல்பான தமிழில் அறிமுகப்படுத்த ‘-னால்’ வடிவம் பயன்படுத்தப்பட்டது; ‘வாங்கும்போது’ என்பதும் சாத்தியம்.
- source_word: תִקְנֶה
  choice: விலைக்கு வாங்கு
  rationale: קנה என்பதன் வணிகச் சூழலைத் தெளிவாகக் காட்டுகிறது; ‘பெற்றுக்கொள்’ என்பதைவிடத் துல்லியமானது.
- source_word: עֶבֶד עִבְרִי
  choice: எபிரெய அடிமை
  rationale: விலைக்கு வாங்கப்பட்ட கட்டுப்பட்ட நிலையை ‘அடிமை’ வெளிப்படையாகக் காட்டுகிறது; עִבְרִי என்பதற்கு ‘எபிரெய’ நேரான இனப்பெயர்.
- source_word: שֵׁשׁ שָׁנִים יַעֲבֹד
  choice: அவன் ஆறு ஆண்டுகள் வேலை செய்ய வேண்டும்
  rationale: עבד என்ற வினையின் வேலை/சேவை பொருளை இயல்பான சட்டத் தமிழில் தருகிறது; அடிமை நிலை ஏற்கெனவே பெயர்ச்சொல்லில் தெளிவாக உள்ளது.
- source_word: וּבַשְּׁבִעִת
  choice: ஆனால் ஏழாம் ஆண்டில்
  rationale: ஆறு ஆண்டுகால வேலைக்கும் ஏழாம் ஆண்டின் விடுதலைக்கும் இடையிலான மாறுபாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது; தமிழில் தெளிவுக்காக ‘ஆண்டு’ மீண்டும் கூறப்பட்டது.
- source_word: יֵצֵא לַחָפְשִׁי
  choice: விடுதலையாகப் போக வேண்டும்
  rationale: ‘வெளியே போதல்’ என்ற எபிரெய மொழிவழக்கையும் சுதந்திர நிலைக்குச் செல்லுதலையும் தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: חִנָּם
  choice: எந்தப் பணமும் செலுத்தாமல்
  rationale: விடுதலை பெற மீட்புத்தொகையோ வேறு கட்டணமோ செலுத்த வேண்டியதில்லை என்பதைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: சட்டபூர்வ அடிமை நிலை குறிக்கும் עֶבֶד என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாள்
  rationale: இவ்வசனம் விலைக்கு வாங்கப்பட்டு ஒரு குறிப்பிட்ட காலம் கட்டுப்பட்ட நிலையில் வேலை செய்யும் நபரைப் பற்றியது. ‘பணியாள்’ என்பது அந்த நிலையின் கடுமையை மறைக்கக்கூடும்; ஆகவே மூலத்தின் சமூக-சட்ட உண்மையை ‘அடிமை’ வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டது. ‘அடிமை’ என்ற சொல் மென்மையாக்கப்படாமல் மூலத்தின் கட்டுப்பட்ட சமூக நிலையைப் பாதுகாக்கிறது. வசனத்தின் ஆண்பால் ஒருமை வடிவம் காக்கப்பட்டுள்ளது.
