review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys purchase of a Hebrew slave, six years of service, and release in the seventh year without payment. However, “விடுதலையாகப் போக வேண்டும்” is less precise than the Hebrew release idiom, and footnote a inaccurately broadens עֶבֶד to an ordinary worker rather than giving the relevant conditional alternative.
  naturalness: The proposed revision uses clear, modern standard Tamil with a restrained legal register. “சுதந்திரமாக வெளியேற வேண்டும்” naturally expresses the mandated release while retaining the source’s ‘go out’ imagery.
  terminology: “எபிரேய அடிமை” preserves both the specific ethnonym and the bonded legal status. “பணியாற்ற வேண்டும்” is appropriate for יַעֲבֹד once the status has been stated as “அடிமை.”
  issues:
  - severity: medium
    issue: Footnote a gives a misleading lexical explanation of עֶבֶד.
    rationale: In this purchased bonded-labor legal context, the footnote’s statement that the word may generally mean an ordinary worker risks softening the source term. The English audit trail instead identifies the conditional particle’s ‘if/when’ alternative.
  - severity: low
    issue: “விடுதலையாகப் போக வேண்டும்” is somewhat imprecise and stylistically awkward.
    rationale: יֵצֵא לַחָפְשִׁי literally combines going out with release to freedom. “சுதந்திரமாக வெளியேற வேண்டும்” more directly preserves both elements.
