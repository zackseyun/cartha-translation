  edition: WLC
  text: אִם אֲדֹנָי/ו֙ יִתֶּן ל֣/וֹ אִשָּׁ֔ה וְ/יָלְדָה ל֥/וֹ בָנִ֖ים א֣וֹ בָנ֑וֹת הָ/אִשָּׁ֣ה וִ/ילָדֶ֗י/הָ תִּהְיֶה֙ לַֽ/אדֹנֶ֔י/הָ וְ/ה֖וּא יֵצֵ֥א בְ/גַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: ta
  text: அவனுடைய எஜமான் அவனுக்கு ஒரு மனைவியைக் கொடுத்து, அவள் அவனுக்கு மகன்களையோ மகள்களையோ பெற்றால், அந்த மனைவியும் அவளுடைய பிள்ளைகளும் அவளுடைய எஜமானுக்குச் சொந்தமாக இருப்பார்கள்; அவனோ தனியாக வெளியேறுவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, அவனுடைய பணிக்காலத்தில் எஜமான் கொடுத்த மனைவியையும் அவளுடைய பிள்ளைகளையும் அழைத்துச் செல்லாமல், அவன் மட்டும் வெளியேறுவான்.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: பெற்றால்
  rationale: எபிரெயச் சட்டத்தின் நிபந்தனை அமைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்த, வாக்கியத்தின் வினையோடு ‘-ஆல்’ நிபந்தனை விகுதி இணைக்கப்பட்டது.
- source_word: אֲדֹנָיו
  choice: அவனுடைய எஜமான்
  rationale: அடிமைத்தனம் சார்ந்த இந்தச் சட்டச் சூழலில் அதிகார உறவைத் தெளிவாகக் காட்டுகிறது; தெய்வீகப் பட்டமாகப் புரிந்துகொள்ளப்படக்கூடிய ‘ஆண்டவர்’ தவிர்க்கப்பட்டது.
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: அவனுக்கு ஒரு மனைவியைக் கொடுத்து
  rationale: אִשָּׁה என்பதற்கு ‘பெண்’ என்றும் பொருள் உண்டு; ஆனால் இங்கு பிள்ளைப்பேறும் சட்டபூர்வ குடும்ப உறவும் குறிப்பிடப்படுவதால் ‘மனைவி’ பொருத்தமானது.
- source_word: וְיָלְדָה לוֹ
  choice: அவள் அவனுக்கு ... பெற்றால்
  rationale: கணவனுக்குப் பிள்ளைகளைப் பெற்றெடுப்பதைக் குறிக்கும் எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: בָנִים אוֹ בָנוֹת
  choice: மகன்களையோ மகள்களையோ
  rationale: மூலத்தில் ஆண், பெண் பிள்ளைகள் தனித்தனியாகச் சொல்லப்பட்டிருப்பதைப் பொதுவான ‘பிள்ளைகள்’ என்று சுருக்காமல் பாதுகாக்கிறது.
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: அந்த மனைவியும் அவளுடைய பிள்ளைகளும்
  rationale: முன்னர் வந்த மனைவியையே குறிக்க ‘அந்த’ பயன்படுத்தப்பட்டு, உறவு தெளிவாக வைக்கப்பட்டது.
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: அவளுடைய எஜமானுக்குச் சொந்தமாக இருப்பார்கள்
  rationale: இந்த அமைப்பு சட்டரீதியான உடைமை அல்லது உரிமை நிலையை வெளிப்படுத்துகிறது; அதை மென்மைப்படுத்தாமல் தெளிவாக மொழிபெயர்க்கிறது.
- source_word: וְהוּא יֵצֵא
  choice: அவனோ ... வெளியேறுவான்
  rationale: சட்டத்தில் கூறப்படும் விளைவை எதிர்கால வினையால் காட்டி, יצא என்பதன் அடிப்படை ‘வெளியேறு’ கருத்தைப் பாதுகாக்கிறது.
- source_word: בְגַפּוֹ
  choice: தனியாக
  rationale: மனைவியும் பிள்ளைகளும் உடன் வராமல் அவன் மட்டும் செல்வதைச் சுட்டும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: அடிமைத்தனச் சட்டச் சூழலிலுள்ள அதிகாரம் மற்றும் உடைமை மொழி
  choice: ‘எஜமான்’ என்றும் ‘சொந்தமாக இருப்பார்கள்’ என்றும் நேரடியாக வழங்கப்பட்டது.
  alternative: ‘தலைவர்’, ‘வேலை கொடுத்தவர்’ அல்லது ‘அவரிடமே இருப்பார்கள்’ போன்ற மென்மையான சொற்களைப் பயன்படுத்துதல்.
  rationale: மூல உரை விவரிக்கும் அதிகார மற்றும் உடைமை உறவை மொழிபெயர்ப்பு மறைக்கவோ மென்மைப்படுத்தவோ கூடாது; அதேவேளை உரைக்கு வெளியான ஒழுக்கவியல் அல்லது சமய விளக்கமும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டது. ‘எஜமான்’ என்பது இச்சூழலின் அதிகார உறவைத் தெளிவாகக் காட்டுகிறது. ‘அவனோ’ என்ற மாறுபாட்டுச் சுட்டு, மனைவியும் பிள்ளைகளும் எஜமானுக்குச் சொந்தமாக இருப்பதற்கும் ஆண் அடிமை தனியாக வெளியேறுவதற்கும் இடையிலான எதிர்மறை ஒப்புமையை இயல்பாக வெளிப்படுத்துகிறது.
