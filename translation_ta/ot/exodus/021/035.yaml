base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: ta
  text: ஒருவனுடைய காளை அவனுடைய அயலானுடைய காளையை முட்டி[a], அது இறந்தால், உயிருடன் இருக்கும் காளையை அவர்கள் விற்று, அதிலிருந்து கிடைக்கும் பணத்தைப் பகிர்ந்து கொள்ள வேண்டும்[b]; இறந்த காளையையும் அவர்கள் பகிர்ந்து கொள்ள வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொம்பால் குத்தி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் மாடு வலுவாகத் தாக்குவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘அதன் வெள்ளி/பணத்தைப் பங்கிடுங்கள்’; அதாவது, உயிருடன் இருக்கும் காளையை விற்றுக் கிடைக்கும் பணத்தைப் பகிர்ந்து கொள்ளுங்கள்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், ‘இறந்ததையும்’; இங்கே இறந்த காளையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ஒருவனுடைய ... செத்துப்போனால்
  rationale: எபிரெயச் சட்டத்தில் ஒரு நிபந்தனை வழக்கை அறிமுகப்படுத்தும் தொடரை, இயல்பான தமிழ் நிபந்தனை வாக்கியமாக மொழிபெயர்க்கிறது. தொடக்க வாவைத் தனியாக ‘மேலும்’ என்று இடுவது தமிழில் தேவையற்றதாக இருக்கும்.
- source_word: יִגֹּף
  choice: முட்டி
  rationale: மாடு கொம்பினாலோ தலையினாலோ வலுவாகத் தாக்குவதைக் குறிக்கும் இயல்பான தமிழ்ச் சொல். ‘கொம்பால் குத்தி’ என்பது சாத்தியமானாலும், எபிரெய வினைச்சொல்லைவிடக் குறிப்பானது.
- source_word: שׁוֹר אִישׁ
  choice: ஒருவனுடைய மாடு
  rationale: தனிநபரின் உடைமையைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שׁוֹר רֵעֵהוּ
  choice: அவனுடைய அயலானின் மாடு
  rationale: רֵעַ என்பதன் ‘அயலான்/சக மனிதன்’ என்ற உறவுப் பொருளைத் தக்கவைக்கிறது.
- source_word: וָמֵת
  choice: அது செத்துப்போனால்
  rationale: தாக்குதலின் விளைவாக மாடு இறப்பதை நிபந்தனைச் சட்ட நடையில் தெளிவாகக் காட்டுகிறது; விலங்கைக் குறிக்க ‘செத்துப்போனால்’ இயல்பான தமிழ்.
- source_word: וּמָכְרוּ
  choice: அவர்கள் விற்று
  rationale: நிபந்தனை நிறைவேறியபின் பின்பற்ற வேண்டிய சட்ட நடைமுறையின் முதல் செயலைக் காட்டுகிறது.
- source_word: הַשּׁוֹר הַחַי
  choice: உயிரோடிருக்கும் மாடு
  rationale: இறந்த மாட்டிற்கு எதிராக உயிருடன் மீந்த மாட்டைத் தெளிவாகக் குறிக்கும் இயல்பான நடை.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: அதற்குக் கிடைக்கும் பணத்தைப் பங்கிட்டுக்கொள்ள வேண்டும்
  rationale: சொல்லுக்கு சொல் ‘அதன் வெள்ளி/பணம்’ என்பது உயிருள்ள மாட்டை விற்றுக் கிடைக்கும் தொகையைக் குறிக்கிறது; தமிழில் பொருளைத் தெளிவாக்கும் குறைந்தபட்ச விரிவாக்கம்.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: செத்த மாட்டையும் அவர்கள் பங்கிட்டுக்கொள்ள வேண்டும்
  rationale: எபிரெயத்தின் ‘செத்ததையும்’ என்பது முந்தைய மாட்டையே குறிக்கிறது. தமிழில் குழப்பமின்றி இருக்க ‘மாடு’ மீண்டும் சேர்க்கப்பட்டுள்ளது; அதன் எச்ச மதிப்பை உரிமையாளர்கள் பகிர்வதே சட்டக் கருத்து.
