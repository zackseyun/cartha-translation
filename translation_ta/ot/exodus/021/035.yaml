  terminology: The revised wording consistently renders the two שׁוֹר occurrences as காளை. The explicit wording for the sale money appropriately explains כַּסְפּוֹ without forcing a meaning beyond the context. Footnotes preserve the lexical alternatives and the literal expression ‘the dead one.’
