translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சட்ட உரைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வேண்டும்’ என்பது எபிரெய சட்ட விளைவின் கட்டுப்பாட்டுத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் தொடர்புடைய இடங்களில் அமைக்கப்பட்டுள்ளன.
