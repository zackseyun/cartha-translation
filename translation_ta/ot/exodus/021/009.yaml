source:
  edition: WLC
  text: וְ/אִם לִ/בְנ֖/וֹ יִֽיעָדֶ֑/נָּה כְּ/מִשְׁפַּ֥ט הַ/בָּנ֖וֹת יַעֲשֶׂה לָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/009.yaml
  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: ta
  text: ஆனால், அவளைத் தன் மகனுக்கென நியமித்தால், மகள்களுக்குரிய உரிமைகளின்படி அவளை நடத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகள்களுக்கான வழக்கத்தின்படி அவளை நடத்த வேண்டும்.” எபிரேயச் சொற்றொடர் நிறுவப்பட்ட சட்ட நடைமுறையையோ வழக்கமான முறையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் … என்றால்
  rationale: தொடர்ந்து வரும் சட்ட நிபந்தனையை அறிமுகப்படுத்துவதோடு, முந்தைய நிகழ்விலிருந்து உள்ள வேறுபாட்டையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: לִבְנוֹ
  choice: தன் மகனுக்கென
  rationale: לְ இங்கு திருமண உறவுக்காக ஒருவரை ஒதுக்கி நியமிப்பதைக் குறிக்கிறது; ‘மகனுக்கு’ என்பதைக் காட்டிலும் ‘மகனுக்கென’ அந்த நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יִיעָדֶנָּה
  choice: அவளை … நியமித்தால்
  rationale: יעד என்பதன் சட்டபூர்வமான ஒதுக்கீடு அல்லது நியமிப்பு என்ற பொருளைப் பாதுகாக்கிறது; ‘மணம் முடிக்க நிச்சயித்தால்’ என்று சூழலை அளவுக்கு மீறித் தெளிவுபடுத்தாமல் விடுகிறது.
- source_word: כְּמִשְׁפַּט הַבָּנוֹת
  choice: மகள்களுக்குரிய உரிமைமுறைப்படி
  rationale: מִשְׁפָּט என்பதில் சட்டப்படி உரிய நிலை, உரிமை, நடைமுறை ஆகிய நுணுக்கங்கள் உள்ளன. ‘உரிமைமுறை’ அவற்றைச் சுருக்கமாக இணைத்துக் காட்டுகிறது; ‘மகள்கள்’ என்பது எபிரேயச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: יַעֲשֶׂה לָּהּ
  choice: அவளை நடத்த வேண்டும்
  rationale: ஒருவரிடம் கடைப்பிடிக்க வேண்டிய விதத்தைத் தமிழில் இயல்பாகவும் சட்ட உரையின் கட்டாயத் தன்மையுடனும் தெரிவிக்கிறது.
theological_decisions:
- issue: மகனுக்கென நியமிக்கப்பட்ட பெண்ணுக்குச் செய்ய வேண்டிய கடமையின் இயல்பு
  choice: மகள்களுக்குரிய சட்ட உரிமைமுறைக்கு ஏற்ப அவளை நடத்த வேண்டும்
  alternative: மகள்களைப் பற்றிய வழக்கத்தின்படி, குறிப்பாகத் திருமண ஏற்பாட்டு வழக்கத்தின்படி, அவளை நடத்த வேண்டும்
  rationale: כמשפט הבנות என்பது சட்ட உரிமையையும் நிறுவப்பட்ட வழக்கத்தையும் குறிக்கக்கூடும். முதன்மை மொழிபெயர்ப்பு அதன் சட்டப் பாதுகாப்பு வலிமையை வெளிப்படுத்துகிறது; அடிக்குறிப்பு வழக்குமுறை என்ற உண்மையான மாற்றுப் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified சட்ட நடையில் மொழிபெயர்க்கப்பட்டது. ‘நியமித்தால்’ என்பது திருமணச் சூழலை உணர்த்தினாலும் ‘நிச்சயித்தால்’ என்று பொருளைச் சுருக்கவில்லை. ‘உரிமைமுறை’ என்ற சொல் சட்ட உரிமை மற்றும் நிர்ணயிக்கப்பட்ட நடைமுறை ஆகிய இரண்டையும் தாங்குகிறது.
