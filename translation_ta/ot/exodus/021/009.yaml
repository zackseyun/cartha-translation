revisions:
- from: ஆனால் அவளைத் தன் மகனுக்கென நியமித்தால், மகள்களுக்குரிய உரிமைமுறைப்படி அவளை நடத்த வேண்டும்.[a]
  to: ஆனால், அவளைத் தன் மகனுக்கென நியமித்தால், மகள்களுக்குரிய உரிமைகளின்படி அவளை நடத்த வேண்டும்.[a]
  rationale: The revision replaces an awkward compound with an idiomatic Tamil expression for the daughters’ legally due rights. It retains the source’s formal designation language and the broad obligation expressed by ‘do for her/treat her.’ The footnote continues to preserve the legitimate legal-practice/custom alternative without imposing a narrower interpretation.
