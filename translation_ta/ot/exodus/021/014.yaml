  source_fidelity: முதன்மை உரை மூலத்தின் நோக்கமுள்ள கொலை, வஞ்சக முறை, பலிபீடத்திலிருந்து அகற்றல் ஆகியவற்றை பெரும்பாலும் நன்றாகக் காக்கிறது. ஆனால் “பலிபீடத்தருகே இருந்தாலும்” என்பது மெய்யெழுத்தில் உள்ள “என் பலிபீடத்திலிருந்து/அருகிலிருந்து அவனை எடு” என்ற நேரடியான கட்டளையை நிபந்தனைச் சலுகையாக மாற்றுகிறது. “அங்கிருந்து கொண்டுபோக வேண்டும்” என்பதற்குப் பதில் “என் பலிபீடத்திலிருந்தே அவனை எடுத்துக்கொண்டு போ” எனக் கட்டளை வடிவில் தருவது நெருக்கமானது.
  naturalness: “ஆனால், ஒருவன் … செயல்பட்டால்” என்ற சட்டநடை இயல்பானது. இருப்பினும் “துணிந்து, தந்திரமாகச் செயல்பட்டால்” என்பதில் இரண்டு வினைமுறைகள் ஓரளவு இணைந்து, יָזִד என்பதன் திட்டமிட்ட/துணிகரமான முன்னெடுப்பு மற்றும் בְעָרְמָה என்பதன் வஞ்சக முறை தெளிவாகப் பிரிவதில்லை. “திட்டமிட்டு … வஞ்சகமாகக் கொல்ல முயன்றால்” நவீன தமிழில் துல்லியமும் ஓட்டமும் உடையது.
  terminology: “அயலான்,” “பலிபீடம்,” “சாவதற்காக” ஆகியவை ஏற்றவை. “வஞ்சகமாக” என்பது בְעָרְמָה-க்கு “தந்திரமாக” என்பதைக் காட்டிலும் தெளிவான ஒழுக்க/செய்முறை நுணுக்கத்தைத் தருகிறது. அடிக்குறிப்பு a-யில் “ஆணவத்துடன்” மட்டும் יָזִד-ன் ‘presumptuously’ என்ற கூறை முழுமையாகக் காட்டாது; “துணிகரமாக/தன்னிச்சையாக” சேர்த்தல் நல்லது.
