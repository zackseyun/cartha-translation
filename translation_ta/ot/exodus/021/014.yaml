source:
  edition: WLC
  text: וְ/כִֽי יָזִ֥ד אִ֛ישׁ עַל רֵעֵ֖/הוּ לְ/הָרְג֣/וֹ בְ/עָרְמָ֑ה מֵ/עִ֣ם מִזְבְּחִ֔/י תִּקָּחֶ֖/נּוּ לָ/מֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: ta
  text: ஆனால், ஒருவன் தன் அயலானைக் கொல்லத் திட்டமிட்டு, வஞ்சகமாகச் செயல்பட்டால்[a][b], அவனை என் பலிபீடத்திலிருந்தே சாவதற்காக எடுத்துக்கொண்டு போ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் அயலானுக்கு எதிராகத் துணிகரமாக அல்லது தன்னிச்சையாகச் செயல்பட்டால்.” எபிரெய வினை வேண்டுமென்றே செய்யப்படும் துணிகரமான செயலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சூழ்ச்சியோடு” அல்லது “தந்திரமாக.”
    reason: lexical_alternative
  - marker: c
    text: அதாவது, அவன் பலிபீடத்தை அடைக்கலமாக நாடியிருந்தாலும், அவனை அங்கிருந்து அகற்றி மரணதண்டனைக்கு ஒப்படைக்க வேண்டும்.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: ஆனால், ... செயல்பட்டால்
  rationale: முந்தைய சட்டத்துடன் மாறுபடும் நிபந்தனையை இயல்பான தமிழ் சட்டநடையில் வெளிப்படுத்துகிறது.
- source_word: יָזִד
  choice: துணிந்து ... செயல்பட்டால்
  rationale: இந்த வினை தற்செயலல்லாத, வேண்டுமென்றே செய்யப்படும் துணிகரமான செயலைக் குறிக்கிறது; சூழலில் உள்ள முன்திட்டமிடுதலை அடுத்த சொற்றொடருடன் சேர்ந்து வெளிப்படுத்துகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெய ஒருமை ஆண்பால் வடிவை இயல்பான பொதுப்பொருள் கொண்ட தமிழ் சட்டநடையில் காக்கிறது.
- source_word: עַל רֵעֵהוּ
  choice: தன் அயலானுக்கு எதிராக
  rationale: சமூகத்தில் மற்றொருவரை நோக்கிய பகைமையான செயலைத் துல்லியமாகக் காட்டுகிறது.
- source_word: לְהָרְגוֹ
  choice: அவனைக் கொல்ல வேண்டுமென்று
  rationale: הרג என்பதன் நேரடிப் பொருளான ‘கொல்ல’ என்பதை வைத்துக்கொண்டு, குற்றத்தின் சட்ட வகைப்பாட்டை வினைக்குள்ளேயே முன்கூட்டியே சேர்க்கவில்லை.
- source_word: בְעָרְמָה
  choice: தந்திரமாக
  rationale: சூழ்ச்சியும் வஞ்சக நோக்கமும் கொண்ட செய்முறையை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מֵעִם מִזְבְּחִי
  choice: என் பலிபீடத்தருகே இருந்தாலும் ... அங்கிருந்து
  rationale: מֵעִם என்பதன் ‘அருகிலிருந்து’ என்ற இடப்பொருளைக் காத்து, பலிபீடத்தை அடைக்கலமாக நாடியிருந்தாலும் பாதுகாப்பில்லை என்ற சூழல் சார்ந்த வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: תִּקָּחֶנּוּ
  choice: அவனை ... கொண்டுபோக வேண்டும்
  rationale: இரண்டாம் நபர் ஒருமை சட்டக் கட்டளையின் வலிமையை தமிழில் கடமைவடிவில் தருகிறது.
- source_word: לָמוּת
  choice: சாவதற்காக
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் எபிரெய இறந்தொழில் வடிவுக்கு நெருக்கமாக உள்ளது; ‘மரணதண்டனை நிறைவேற்ற’ என்பது விளக்கவுரையாக அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: வேண்டுமென்றே கொன்றவனுக்கு பலிபீடம் அடைக்கலம் அளிக்குமா?
  choice: திட்டமிட்டும் வஞ்சகமாகவும் கொல்ல முயன்ற குற்றவாளியைப் பலிபீடத்தருகிலிருந்தும் அகற்ற வேண்டும் என்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: பலிபீடம் குற்றஞ்சாட்டப்பட்டவனை விசாரணைக்காக அகற்றும் இடமாக மட்டுமே குறிப்பிடப்படுகிறது; அடைக்கல உரிமை நேரடியாகப் பேசப்படவில்லை.
  rationale: ‘என் பலிபீடத்தருகிலிருந்து’ என்ற சொற்றொடர் புனித இடம் வேண்டுமென்றே செய்த கொலைக்குப் பாதுகாப்பளிக்காது என்பதை வலுவாக உணர்த்துகிறது; ஆனால் அந்தப் பின்னணியை முதன்மை உரையில் மிகையாக விரிவாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியானவும் கண்ணியமானவும் உள்ள சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘பலிபீடம்’, ‘அயலான்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; அரிதான பழைய நடை தவிர்க்கப்பட்டுள்ளது. மூலத்தின் திட்டமிட்ட செயல், வஞ்சக முறை, பலிபீடத்திலிருந்து அகற்றுதல் ஆகிய வேறுபட்ட கூறுகள் ஒன்றோடொன்று கலக்காமல் பாதுகாக்கப்பட்டுள்ளன.
