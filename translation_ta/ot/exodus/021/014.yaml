revisions:
- from: ஆனால், ஒருவன் தன் அயலானைக் கொல்ல வேண்டுமென்று அவனுக்கு எதிராகத் துணிந்து, தந்திரமாகச் செயல்பட்டால்[a][b], அவன் என் பலிபீடத்தருகே இருந்தாலும், சாவதற்காக அவனை அங்கிருந்து கொண்டுபோக வேண்டும்.[c]
  to: ஆனால், ஒருவன் தன் அயலானைக் கொல்லத் திட்டமிட்டு, வஞ்சகமாகச் செயல்பட்டால்[a][b], அவனை என் பலிபீடத்திலிருந்தே சாவதற்காக எடுத்துக்கொண்டு போ.[c]
  rationale: 'திருத்தம் மெய்யெழுத்தின் தொடரமைப்பை நெருக்கமாக்குகிறது: திட்டமிட்ட முன்னெடுப்பு (יָזִד), வஞ்சகமான செய்முறை (בְעָרְמָה), மற்றும் பலிபீடத்திலிருந்து அகற்றும் நேரடிக் கட்டளை (מֵעִם מִזְבְּחִי תִּקָּחֶנּוּ) தனித்தனியாகத் தெளிவாகின்றன. “என்றே” என்பது English audit trail-இன் “even” வலியுறுத்தலைத் தமிழில் இயல்பாகக் காட்டுகிறது; அடிக்குறிப்பு அந்த வரலாற்றுச் சூழலை விளக்கமாக மட்டுமே வைக்கிறது.'
