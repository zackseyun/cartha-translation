    rationale: “துணிந்து, தந்திரமாகச் செயல்பட்டால்” என்பது இரண்டு சொற்களையும் ஒரே ‘செயல்படுதல்’ அமைப்புக்குள் இணைக்கிறது. கொலைநோக்கின் திட்டமிடலும் வஞ்சகமான முறையும் வெளிப்படையாகத் தரப்பட வேண்டும்.
