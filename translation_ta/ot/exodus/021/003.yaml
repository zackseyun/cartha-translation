translation_notes:
  register: நவீன பொதுத்தமிழில் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘வெளியேற வேண்டும்’ என்பது விடுதலையாகிச் செல்வதைக் குறிக்கும் சூழல்சார் சட்டப் பொருளைத் தருகிறது. மூலத்தின் இரு நிபந்தனைப் பகுதிகளும் இணை அமைப்புடன் காக்கப்பட்டுள்ளன; பாலினம் மற்றும் திருமண உறவு வெளிப்படையாக விடப்பட்டுள்ளன.
