  yaml_path: translation/ot/exodus/021/003.yaml
  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
translation:
  language: ta
  text: அவன் தனியாக[a] வந்தால், தனியாகவே வெளியேறுவான்; அவன் திருமணமானவனாக இருந்தால்[b], அவனுடைய மனைவியும் அவனோடு வெளியேறுவாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘அவனுடைய கப்-உடன்’ என்று உள்ளது. இது ஒரு சொல் வழக்கு; இங்கு அவன் துணையின்றி, தனியே வந்தான் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், ‘ஒரு மனைவியின் கணவனாக இருந்தால்’; அதாவது, ‘அவன் திருமணமானவனாக இருந்தால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: தனியாக
  rationale: இந்த எபிரெயச் சொற்றொடர் இச்சட்டச் சூழலில், துணையோ குடும்பத்தாரோ உடன் இல்லாமல் தனியே வந்த நிலையைச் சுட்டுகிறது. இயல்பான நவீனத் தமிழில் ‘தனியாக’ என்பது அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יָבֹא
  choice: வந்திருந்தால்
  rationale: அடிமைப் பணிநிலைக்குள் வந்ததைச் சுட்டும் நிபந்தனை வாக்கியமாக இருப்பதால், தமிழில் ‘வந்திருந்தால்’ என்பது சூழலையும் கால உறவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יֵצֵא
  choice: வெளியேற வேண்டும்
  rationale: இங்கு பணிநிலையிலிருந்து விடுபட்டுச் செல்வதே பொருள். ‘வெளியேற வேண்டும்’ என்பது சட்ட மொழியின் கட்டாயத் தன்மையையும், ‘வருதல்—வெளியேறுதல்’ என்ற மூலத்தின் இணைப்பையும் காக்கிறது.
- source_word: בַּעַל אִשָּׁה
  choice: மனைவியுள்ளவனாக
  rationale: சொல்லுக்கு சொல் வடிவில் ‘ஒரு மனைவியின் கணவன்’ என்று கூறுவது தமிழில் செயற்கையாக இருக்கும். ‘மனைவியுள்ளவனாக’ என்பது ஆண் குறித்த மூலத்தின் உறவுசார் மொழியைத் தக்கவைத்து, திருமணமானவன் என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: அவனுடைய மனைவியும் அவனோடு வெளியேற வேண்டும்
  rationale: பெண்பால் வினைச்சொல் ‘அவனுடைய மனைவி’ என்பதோடு பொருந்துகிறது. ‘அவனோடு வெளியேற வேண்டும்’ என்பது அவள் அவனுடன் செல்லும் சட்ட விளைவைத் தெளிவுபடுத்துகிறது; ‘உம்’ இணைவு உடன்செல்லும் கருத்தை இயல்பாக வலியுறுத்துகிறது.
