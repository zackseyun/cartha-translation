  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: ta
  text: ஆனால், அவன் ஓரிரு நாட்கள் உயிரோடிருந்தால், அவனுக்காகப் பழிவாங்கப்படாது[a]; ஏனெனில், அவன் எஜமானுடைய பணம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எஜமான் தண்டிக்கப்பட மாட்டான்.” எபிரெயச் சொல் இன்னும் குறிப்பாகப் பழிவாங்குதல் அல்லது சட்டரீதியான பதிலடி நிறைவேற்றப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “அவன் எஜமானுடைய பணம்.” அடிமை எஜமானுக்கு இருந்த பொருளாதார மதிப்பை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய சட்டத் தீர்ப்புக்கு ஒரு விதிவிலக்கையோ வரையறையையோ அறிமுகப்படுத்தும் எதிர்மறை இணைப்பாக இயல்பாக அமைகிறது.
- source_word: יוֹם א֥וֹ יוֹמַיִם
  choice: ஓரிரு நாட்கள்
  rationale: ‘ஒரு நாள் அல்லது இரண்டு நாட்கள்’ என்ற குறுகிய கால அளவை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יַעֲמֹד
  choice: உயிரோடிருந்தால்
  rationale: நேரடியாக ‘நின்றால்’ என்று பொருள்பட்டாலும், இச்சட்டச் சூழலில் அடிபட்டவர் தொடர்ந்து உயிருடன் இருப்பதையே குறிக்கிறது; முழுமையாகக் குணமடைந்தார் என்று பொருள் சேர்க்கவில்லை.
- source_word: לֹא יֻקַּם
  choice: அவனுக்காகப் பழிவாங்கப்படாது
  rationale: נקם என்ற வேர்ச்சொல்லின் நீதிசார் பழிவாங்கல் அல்லது சட்டரீதியான பதிலடி என்ற பொருளைப் பாதுகாக்கிறது. எஜமானே பொதுவாகத் ‘தண்டிக்கப்பட மாட்டான்’ என்று விரிவுபடுத்தாமல், எபிரெயச் செயலப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சட்டத் தீர்ப்புக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: כַסְפּוֹ
  choice: எஜமானுடைய பணம்
  rationale: כֶּסֶף என்பதன் நேரடிப் பொருளான ‘பணம்/வெள்ளி’ என்பதைத் தக்கவைக்கிறது. தமிழில் உடைமைச் சுட்டின் தொடர்பு குழப்பமடையாதபடி, முந்தைய வசனத்தில் உள்ள எஜமானை வெளிப்படையாகக் குறிப்பிடுகிறது.
- source_word: הוּא
  choice: அவன்
  rationale: அடிபட்ட அடிமையைக் குறிக்கும் எபிரெய ஆண்பால் ஒருமைச் சுட்டுப்பெயரைப் பாதுகாக்கிறது.
theological_decisions:
- issue: அடிமைத்தனச் சட்டத்தில் தரப்படும் பொருளாதாரக் காரணம்
  choice: ‘அவன் எஜமானுடைய பணம்’ என்ற கடுமையான பொருளாதார மொழியைத் தக்கவைத்தல்
  alternative: ‘அவன் எஜமானின் சொத்து’ அல்லது ‘இழப்பு எஜமானுக்கே’
  rationale: மூல எபிரெயம் காரணத்தை அப்பட்டமான பொருளாதாரச் சொற்களில் கூறுகிறது. அதன் நெறிசார் கடுமையை மென்மையாக்காமலும், ‘சொத்து’ போன்ற விரிவான விளக்கச் சொல்லால் மாற்றாமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: לֹא יֻקַּם என்பதன் சட்டப் பொருள்
  choice: ‘அவனுக்காகப் பழிவாங்கப்படாது’
  alternative: ‘எஜமான் தண்டிக்கப்பட மாட்டான்’
  rationale: மூலத்தின் பழிவாங்கல்/சட்டரீதியான பதிலடி என்ற குறிப்பான பொருளையும் செயலப்பாட்டு அமைப்பையும் தக்கவைக்கிறது; பொதுவான தண்டனை என்று மட்டும் சுருக்கவில்லை.
- issue: சுட்டுப்பெயர்களின் தொடர்பு
  choice: பாதிக்கப்பட்டவனை ‘அவன்’ என்றும் உடைமையாளரை ‘எஜமான்’ என்றும் குறிப்பிடுதல்
  alternative: இருவருக்கும் சுட்டுப்பெயர்களை மட்டும் பயன்படுத்துதல்
  rationale: எபிரெய ஆண்பால் ஒருமையைப் பாதுகாத்தபடியே, தமிழில் ‘அவனுடைய’ என்பது யாரைக் குறிக்கிறது என்ற தேவையற்ற குழப்பத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிரோடிருந்தால்’ என்பது இயல்பான பேச்சு நெருக்கத்தைக் கொண்டிருந்தாலும் வெளியீட்டு நடைக்கு ஏற்றது. மூலத்தின் கடுமையான பொருளாதாரக் காரணம் மென்மையாக்கப்படவில்லை.
