  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: ta
  text: அவள் தன் எஜமானனுக்குப் பிரியமற்றவளாக இருந்தால், அவளைத் தனக்கென நியமிக்காத அவன்[a], அவளை மீட்டுக்கொள்ள அனுமதிக்க வேண்டும். அந்நிய மக்களுக்கு அவளை விற்க அவனுக்கு உரிமை இல்லை; ஏனெனில் அவளுக்குத் துரோகம் செய்துவிட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவளைத் தனக்கென நியமித்தவன்”; அதாவது, அவளைத் தனக்கெனத் திருமண நிச்சயம் செய்தவன். இந்த எபிரெய உட்பிரிவு உரைசார்ந்தும் பொருள்விளக்கத்திலும் சிக்கலானது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “அவன் அவளிடம் வஞ்சகமாக நடந்துகொண்டதால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: பார்வையில் விருப்பமற்றவளாக
  rationale: இந்த எபிரெய மரபுத்தொடர் முழுமையான ஒழுக்கத் தீமையைக் குறிக்காமல், ஒருவருக்கு விருப்பமற்ற அல்லது ஏற்றுக்கொள்ள முடியாத நிலையைச் சுட்டுகிறது. ‘பார்வையில்’ என்பது மூலமொழியின் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: אֲדֹנֶיהָ
  choice: அவளுடைய எஜமானன்
  rationale: இச்சட்டச் சூழலில் இச்சொல் சிறுமியை வாங்கிய ஆண் அதிகாரமுடையவரைக் குறிக்கிறது. ‘எஜமானன்’ சமூகச் சட்ட உறவைத் தெரிவிக்கிறது; தெய்வீகப் பட்டப்பெயரையும் தேவையற்ற உரிமை விளக்கத்தையும் புகுத்துவதில்லை.
- source_word: יְעָדָהּ
  choice: அவளைத் தனக்கென நியமிக்காத
  rationale: இவ்வினைச்சொல் இச்சூழலில் திருமண உறவுக்காக ஒதுக்குதல் அல்லது நியமித்தலைக் குறிக்கலாம். ‘நியமிக்காத’ என்பது முதன்மை வாசிப்பின் எதிர்மறையையும் சொல்லின் பரந்த பொருளையும் காக்கிறது; திருமண நிச்சயத்தைக் கட்டாயமாக்கவில்லை.
- source_word: וְהֶפְדָּהּ
  choice: அவள் மீட்கப்படுவதற்கு அனுமதிக்க வேண்டும்
  rationale: பדה என்பதன் ஹிஃபில் வடிவம் இங்கு மீட்பை அனுமதித்தல் அல்லது நிகழச் செய்தல் எனப் புரிந்துகொள்ளப்படுகிறது. மீட்புத் தொகையை எஜமானனே செலுத்துகிறான் என்று கூறாமல் சட்டரீதியான விளைவைத் தெளிவாக்குகிறது.
- source_word: לְעַם נָכְרִי
  choice: அந்நிய மக்களிடம்
  rationale: மூலச்சொற்றொடர் தனி நபரைவிட ஓர் அந்நிய மக்கள் குழுவைக் கூட்டாகக் குறிக்கிறது. இத்தேர்வு அந்த சமூக வேறுபாட்டைக் காத்து இயல்பான தமிழை வழங்குகிறது.
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: அவளை விற்க அவனுக்கு உரிமை இல்லை
  rationale: משל உடனான இக்கட்டமைப்பு அதிகாரம் அல்லது சட்டரீதியான உரிமையைக் குறிக்கிறது. ‘உரிமை இல்லை’ அதன் நீதித்துறை வலிமையைத் தெளிவாகச் சொல்கிறது.
- source_word: בְּבִגְדוֹ בָהּ
  choice: அவன் அவளிடம் வஞ்சகமாக நடந்துகொண்டான்
  rationale: בגד நம்பிக்கையைக் குலைக்கும் வஞ்சக அல்லது துரோகச் செயலைக் குறிக்கிறது. ‘வஞ்சகமாக நடந்துகொண்டான்’ என்பது நவீன தமிழில் தெளிவாகவும் சட்ட-ஒழுக்கக் குற்றச்சாட்டுக்கு ஏற்றதாகவும் உள்ளது.
theological_decisions:
- issue: יְעָדָהּ இடம்பெறும் உட்பிரிவின் கெதீவ்/கெரே சார்ந்த வாசிப்பு மற்றும் பொருள் தெளிவின்மை
  choice: அவளைத் தனக்கென நியமிக்காத அவன்
  alternative: அவளைத் தனக்கென நியமித்தவன் / தனக்கென திருமண நிச்சயம் செய்தவன்
  rationale: மசோரெட்டிக் மரபில் இவ்விடம் உரைசார் சிக்கலைக் கொண்டுள்ளது; வாசக மரபுகளும் பழங்கால மொழிபெயர்ப்புகளும் எதிர்மறை அல்லது உறுதிவாக்க வாசிப்பிலும், பொதுவான ‘நியமித்தல்’ அல்லது குறிப்பான ‘திருமண நிச்சயம் செய்தல்’ என்ற பொருளிலும் வேறுபடுகின்றன. கொடுக்கப்பட்ட மூல உரையில் உள்ள לא என்பதற்கேற்ப முதன்மை உரை எதிர்மறை வாசிப்பைப் பின்பற்றுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘எஜமானன்,’ ‘மீட்கப்படுதல்,’ ‘உரிமை’ போன்ற சொற்கள் பண்டைய சமூகச் சட்டச் சூழலை மறைக்காமல் சாதாரண வாசகருக்கும் புரியும்படி தேர்ந்தெடுக்கப்பட்டுள்ளன; மூல உரையின் உண்மையான வாசிப்பு ஐயம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
