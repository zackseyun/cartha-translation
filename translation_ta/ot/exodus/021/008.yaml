revisions:
- from: அவள் தன் எஜமானனின் பார்வையில் விருப்பமற்றவளாக இருந்தால், அவளைத் தனக்கென நியமிக்காத அவன்[a], அவள் மீட்கப்படுவதற்கு அனுமதிக்க வேண்டும். அந்நிய மக்களிடம் அவளை விற்க அவனுக்கு உரிமை இல்லை; ஏனெனில் அவன் அவளிடம் வஞ்சகமாக நடந்துகொண்டான்[b].
