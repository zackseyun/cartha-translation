  text: Whoever strikes a man so that he dies shall surely be put to death[a].
translation:
  language: ta
  text: ஒரு மனிதனை அடித்து, அவன் இறந்தால், அடித்தவன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான வடிவில்: “ஒரு மனிதனை அடிக்கிறவன்—அவன் இறந்தால்—நிச்சயமாகக் கொல்லப்பட வேண்டும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: அடித்து
  rationale: 'נכה என்பதன் பங்கேற்புவினை வடிவம் சட்ட வழக்கை அறிமுகப்படுத்துகிறது: ‘அடிக்கிறவன்.’ ‘அடித்து’ என்பது விளைவை வினையிலேயே மிகைப்படுத்தாமல், செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.'
- source_word: אִישׁ
  choice: ஒருவனை
  rationale: אִישׁ பொதுவாக ‘ஒரு மனிதன்/ஆண்’ என்பதைக் குறிக்கிறது. இங்கு வேற்றுமை உருபுடன் வரும் ‘ஒருவனை’ சட்டச் சூழலில் பாதிக்கப்பட்ட தனிநபரை இயல்பாகக் குறிக்கிறது; பாலினத்தை முற்றிலும் நீக்கும் ‘ஒருவரை’ என்பதைத் தவிர்க்கிறது.
- source_word: וָמֵת
  choice: அவன் இறந்துபோகும்படி
  rationale: וְ இணைப்பும் מות வினையின் நிறைவுற்ற வடிவமும் அடித்ததன் விளைவைச் சுட்டுகின்றன. ‘அவன் இறந்துபோகும்படி’ என்பது அந்த விளைவு உறவை இயல்பாக வெளிப்படுத்துகிறது; எபிரெயத்தின் நேரடியான ‘அவன் இறந்துவிட்டால்’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: முற்றுவினையெச்சமும் செயல்பாட்டு வினை வடிவமும் சேர்ந்த அமைப்பு தண்டனையின் உறுதியை வலியுறுத்துகிறது. ‘நிச்சயமாகக் கொல்லப்பட வேண்டும்’ என்பது அந்த வலியுறுத்தலையும் சட்டரீதியான செயப்பாட்டு வடிவத்தையும் காக்கிறது; ‘மரணதண்டனை நிறைவேற்றப்பட வேண்டும்’ என்று விளக்கமாக்கவில்லை.
