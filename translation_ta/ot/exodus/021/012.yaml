revisions:
- from: ஒருவனை அடித்து, அவன் இறந்துபோகும்படி செய்கிறவன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.[a]
  to: ஒரு மனிதனை அடித்து, அவன் இறந்தால், அடித்தவன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.[a]
  rationale: The revision preserves the Hebrew's compact case-law sequence—striking a man, followed by his death—and its emphatic passive death penalty. It removes the added causative nuance while retaining natural modern Tamil and clear legal reference.
