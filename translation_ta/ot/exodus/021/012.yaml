translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதிக்குரிய கண்ணியமும் உறுதியும் காக்கப்பட்டுள்ளன. மூலத்தின் சுருக்கமான நிபந்தனை–தண்டனை அமைப்பு இயல்பான தமிழுக்காக ஓரளவு மறுவடிவமைக்கப்பட்டு, சொற்சொல்லான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
