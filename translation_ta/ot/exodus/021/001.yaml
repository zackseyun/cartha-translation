  text: וְ/אֵ֨לֶּה֙ הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר תָּשִׂ֖ים לִ/פְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/001.yaml
  text: These are the judgments that you shall set before them:[a]
translation:
  language: ta
  text: நீ அவர்களுக்கு முன்பாக வைக்க வேண்டிய சட்ட விதிகள் இவையே:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீதித்தீர்ப்புகள்,’ ‘நியமங்கள்’ அல்லது ‘வழக்குச் சட்டங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சட்டரீதியான தீர்ப்புகளையோ குறிப்பிட்ட வழக்குகளுக்குரிய சட்டங்களையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவையே
  rationale: வாவ் முந்தைய பகுதியுடன் தொடர்ச்சியை ஏற்படுத்துகிறது; தமிழில் தனியாக ‘இப்போது’ அல்லது ‘மேலும்’ என்று சேர்க்காமல், ‘இவையே’ என்பது அந்தத் தொடர்ச்சியையும் புதிய சட்டப்பகுதியின் அறிமுகத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמִּשְׁפָּטִים
  choice: சட்ட விதிகள்
  rationale: מִשְׁפָּטִים என்பது நீதித்தீர்ப்புகள், நியமங்கள் அல்லது குறிப்பிட்ட வழக்குகளுக்குரிய சட்டங்கள் எனப் பொருள்படலாம். தொடர்ந்து வரும் உடன்படிக்கைச் சட்டங்களின் சூழலில் ‘சட்ட விதிகள்’ என்பது சாதாரண வாசகருக்குத் தெளிவாகவும் இயல்பாகவும் இருந்து, சொல்லின் சட்டவியல் தன்மையைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר תָּשִׂים
  choice: நீ ... வைக்க வேண்டிய
  rationale: שׂים என்பதன் அடிப்படைப் பொருளான ‘வை’ என்பதையும், மோசேக்கு வழங்கப்பட்ட கட்டளையின் வலிமையையும் ‘வைக்க வேண்டிய’ இயல்பான தமிழில் தருகிறது.
- source_word: לִפְנֵיהֶם
  choice: அவர்கள்முன்
  rationale: ‘அவர்களுக்கு முன்பாக/அவர்கள் முன்னிலையில்’ என்ற எபிரெய மரபுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; இங்கு மக்களிடம் விதிகளை முன்வைப்பதே கருத்து.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டச் சூழலில் מִשְׁפָּטִים என்பதன் மொழிபெயர்ப்பு
  choice: சட்ட விதிகள்
  alternative: நீதித்தீர்ப்புகள்; நியமங்கள்; வழக்குச் சட்டங்கள்
  rationale: இது கோட்பாட்டுச் சர்ச்சையை விடச் சொற்பொருள் மற்றும் சட்ட இலக்கிய வகை சார்ந்த முடிவு. ‘சட்ட விதிகள்’ என்பது நீதிசார் சட்டத் தன்மையைத் தக்கவைத்தபடி நவீனத் தமிழில் தெளிவாக உள்ளது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான சட்ட அறிமுக நடையில் அமைக்கப்பட்டது. எபிரெயத்தில் வெளிப்படையான காலக் குறிப்பு இல்லாததால் ‘இப்போது’ சேர்க்கப்படவில்லை; வாக்கிய முடிவிலுள்ள முக்காற்புள்ளி தொடர்ந்து வரும் சட்டங்களை அறிமுகப்படுத்துகிறது.
