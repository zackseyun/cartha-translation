  source_fidelity: முதன்மை உரை கடத்தல், விற்பனை, மற்றும் கடத்தப்பட்ட நபர் குற்றவாளியின் வசத்தில் காணப்படுதல் ஆகிய சட்டநிலைகளைப் பிரதிபலிக்கிறது. ஆனால் வரைவு உரையின் இரண்டாம் கூறு இலக்கணரீதியாகக் குழப்பமாக இருந்து, காணப்படுவது குற்றவாளியா அல்லது கடத்தப்பட்ட நபரா என்பதைத் தெளிவாகச் சொல்லவில்லை. திருத்தத்தில், காணப்படுபவர் கடத்தப்பட்ட மனிதனே என்றும் மரணதண்டனை பெறுபவன் கடத்தியவனே என்றும் வெளிப்படுத்தப்பட்டுள்ளது.
  naturalness: ‘அவனைத் தன் கட்டுப்பாட்டில் வைத்திருப்பது கண்டுபிடிக்கப்படுகிறவன்’ என்பது இயல்பற்ற அமைப்பும் தவறான இலக்கணத் தொடர்பும் உடையது. நிபந்தனை அமைப்பான ‘கடத்தப்பட்ட மனிதன் அவனுடைய வசத்தில் காணப்பட்டால்’ நவீன சட்டநடையில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
