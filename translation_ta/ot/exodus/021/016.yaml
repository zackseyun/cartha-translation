base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: ta
  text: ஒரு மனிதனைக் கடத்தி அவனை விற்கிறவன், அல்லது கடத்தப்பட்ட மனிதன் அவனுடைய வசத்தில் காணப்பட்டால், அந்தக் கடத்தியவன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘ஒரு மனிதனைத் திருடுகிறவன்.’ இச்சூழலில் இது ஒருவரைக் கடத்துதல், அதாவது மனிதரைத் திருடுதல், என்பதைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அவன் அவனுடைய கையில் காணப்பட்டால்.’ ‘கையில்’ என்பது உடைமை அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர்; எனவே ‘அவனுடைய வசத்தில்’ என மொழிபெயர்க்கப்பட்டுள்ளது. இணைப்பை ‘மேலும்’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: גֹנֵב
  choice: கடத்தி
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘திருடுதல்’. ஆனால் இங்கு அதன் பொருள் மனிதனைக் கவர்ந்து சென்று விற்பது அல்லது தன் கட்டுப்பாட்டில் வைத்திருப்பது என்பதால், நவீன தமிழில் குற்றத்தின் தன்மையைத் தெளிவாகக் காட்ட ‘கடத்தி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אִישׁ
  choice: ஒரு மனிதனை
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையாக இருந்தாலும், இச்சட்டச் சூழலில் மனித நபரைக் குறிக்கிறது. ‘ஒரு மனிதனை’ என்பது மூலவடிவத்துக்கு நெருக்கமாகவும் இயல்பான தமிழாகவும் உள்ளது.
- source_word: וּמְכָרוֹ
  choice: அவனை விற்றுவிடுகிறவன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு கடத்தப்பட்ட மனிதனையே குறிக்கிறது. ‘விற்றுவிடுகிறவன்’ என்பது விற்பனை நிகழ்ந்து முடிந்ததையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְנִמְצָא בְיָדוֹ
  choice: அவனைத் தன் கட்டுப்பாட்டில் வைத்திருப்பது கண்டுபிடிக்கப்படுகிறவன்
  rationale: ‘அவனுடைய கையில்’ என்பது உடைமை அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் சொற்பொருளாக ‘கையில்’ என்பது தெளிவின்மையை உண்டாக்கலாம்; ஆகவே அதன் சூழல்சார் பொருளான ‘கட்டுப்பாட்டில்’ முதன்மை உரையில் தரப்பட்டது.
- source_word: מֹות יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: முற்றுவினையுடன் வரும் வினையெச்சப் பெயரின் அமைப்பு தண்டனையின் உறுதியை வலியுறுத்துகிறது. சட்டத் தீர்ப்பின் செயப்பாட்டு பொருளையும் வலியுறுத்தலையும் இச்சொற்றொடர் காக்கிறது.
theological_decisions:
- issue: சட்டக் குற்றத்தின் வரம்பு
  choice: கடத்தப்பட்ட மனிதன் ஏற்கெனவே விற்கப்பட்டிருந்தாலும் அல்லது இன்னும் கடத்தியவனின் கட்டுப்பாட்டில் இருந்தாலும் மரணதண்டனை விதிக்கப்படுகிறது.
  alternative: இரண்டாவது கூறை ‘அவன் அவனுடைய கையில் காணப்பட்டால்’ என்ற கூடுதல் சூழ்நிலையாக வாசிக்கலாம்; தனியான மாற்று நிலையாக அல்ல.
  rationale: இணைப்புச் சொல் பொதுவாக ‘மற்றும்’ எனப் பொருள்படக்கூடியது. ஆயினும் இச்சட்ட அமைப்பில் விற்றுவிட்ட நிலை அல்லது இன்னும் கட்டுப்பாட்டில் வைத்திருக்கும் நிலை ஆகிய இரண்டையும் மாற்று வழக்குகளாகப் புரிந்துகொள்வது பொருத்தமானது. இந்த விளக்கம் அடிக்குறிப்பில் மாற்று வாசிப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘நிச்சயமாகக் கொல்லப்பட வேண்டும்’ என்பது தண்டனையின் உறுதியைக் காட்டுகிறது. மூலத்தின் ‘கையில்’ என்ற மரபுத்தொடர் தமிழில் தவறாகப் புரியாமல் இருக்க முதன்மை உரையில் ‘கட்டுப்பாட்டில்’ எனத் தெளிவாக்கப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
