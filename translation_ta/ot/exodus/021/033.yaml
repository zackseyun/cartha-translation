  text: וְ/כִֽי יִפְתַּ֨ח אִ֜ישׁ בּ֗וֹר א֠וֹ כִּֽי יִכְרֶ֥ה אִ֛ישׁ בֹּ֖ר וְ/לֹ֣א יְכַסֶּ֑/נּוּ וְ/נָֽפַל שָׁ֥מָּ/ה שּׁ֖וֹר א֥וֹ חֲמֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/033.yaml
  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: ta
  text: ஒருவன் ஒரு குழியைத் திறந்துவைத்தாலோ[a], அல்லது ஒரு குழியைத் தோண்டி அதை மூடாமல் விட்டாலோ, அதில் எருதோ கழுதையோ விழுந்தால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முதல் கூறை, ‘ஒரு குழியை வெளிப்படுத்தினாலோ’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘திறத்தல்’; இது புதிய குழியைத் தோண்டுவதற்குப் பதிலாக ஏற்கெனவே உள்ள குழியைத் திறப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஒருவன்’ என்பது எபிரெயச் சட்டங்களில் பொதுவான வழக்கை எடுத்துரைக்கப் பயன்படுத்தப்படும் ஆண்பால் ஒருமைச் சட்டச் சூத்திரமான אִישׁ என்பதைக் காட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: ஒருவன் ... திறந்துவைத்தாலோ
  rationale: இது முந்தைய சட்டங்களுடன் தொடர்புடைய நிபந்தனை வழக்கை அறிமுகப்படுத்துகிறது. தமிழில் மாற்றுச் சூழல்களைக் காட்டும் ‘-ஆலோ’ அமைப்பு இயல்பாக உள்ளது.
- source_word: יִפְתַּח
  choice: திறந்துவைத்தால்
  rationale: எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘திறத்தல்’. அடுத்த கூறிலுள்ள புதிதாகத் தோண்டுவதிலிருந்து வேறுபட்டு, ஏற்கெனவே இருந்த குழியைத் திறந்த நிலையில் வைப்பதைக் குறிக்கலாம்.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெய சட்ட வழக்கின் ஆண்பால் ஒருமை வடிவத்தைப் பேணுகிறது; இங்கு அது பொதுவான சட்டச் சூத்திரமாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בּוֹר
  choice: ஒரு குழி
  rationale: கால்நடைக்கு ஆபத்தை உண்டாக்கும் தோண்டப்பட்ட இடத்தைக் குறிக்கப் பரந்தும் இயல்பாகவும் பொருந்தும் சொல். குறிப்பாக நீர்த்தொட்டி என்று வரையறுப்பதைத் தவிர்க்கிறது.
- source_word: א֠וֹ כִּי
  choice: அல்லது ... தோண்டி ... விட்டுவிட்டாலோ
  rationale: முதல் சட்டச் சூழலுக்கு இணையான மாற்றுச் சூழலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: יִכְרֶה
  choice: தோண்டி
  rationale: ஒரு குழியைப் புதிதாகத் தோண்டும் செயலைத் தெளிவாகக் குறித்து, அதைத் திறப்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: அதை மூடாமல் விட்டுவிட்டால்
  rationale: உடல்ரீதியாக மூடாதிருப்பதையும், அதன் விளைவுக்கான பொறுப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְ/נָפַל
  choice: விழுந்தால்
  rationale: எபிரெய சட்ட நிபந்தனைத் தொடரைத் தமிழில் இயல்பான நிபந்தனை வடிவில் தொடர்கிறது.
- source_word: שָׁמָּה
  choice: அதில்
  rationale: திசை சார்ந்த ‘அங்கே/அதற்குள்’ என்ற பொருளைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: שּׁוֹר
  choice: ஒரு மாடு
  rationale: சட்டச் சூழலில் பொதுவான bovine கால்நடையைக் குறிக்கும் שׁוֹר என்பதற்கு நவீனத் தமிழில் வாசகர்களுக்கு எளிதாகப் புரியும் சொல்; ‘எருது’ எனப் பாலினத்தைத் தேவையின்றிக் குறுக்காமல் உள்ளது.
- source_word: א֥וֹ חֲמוֹר
  choice: கழுதையோ
  rationale: பொதுவான வீட்டுப் பொதி விலங்கைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
