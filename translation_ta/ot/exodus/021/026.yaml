base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: ta
  text: ஒருவன் தன் ஆண் அடிமையின் கண்ணையோ தன் பெண் அடிமையின் கண்ணையோ[b] அடித்துப் பாழாக்கினால்[a], அந்தக் கண்ணுக்கு ஈடாக[c] அந்த அடிமையை விடுதலையாக அனுப்பிவிட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதைக் குருடாக்கினால்.’ எபிரெய வினைச்சொல் கண்ணைப் பாழாக்குவதையோ அழிப்பதையோ குறிக்கலாம்; இங்கு நிரந்தரமான சேதம் உட்பொருளாக உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், ‘அவனுடைய ஆண் அடிமை ... அவனுடைய பெண் அடிமை.’ எஜமான் ஏற்படுத்திய நிரந்தர உடல் சேதத்திற்கான ஈடாக இந்தச் சட்டம் அடிமைக்கு விடுதலை அளிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, சுருக்கமாக, ‘அந்தக் கண்ணுக்காக.’ இந்தச் சொற்றொடர் கண்ணுக்கு ஏற்பட்ட சேதத்திற்கான ஈடாக விடுதலை செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ஒருவன் ... விட்டால்
  rationale: இது ஒரு நிபந்தனைச் சட்டத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘ஒருவன் ... விட்டால்’ என்பது இணைப்பையும் நிபந்தனையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יַכֶּה
  choice: அடித்து
  rationale: נכה என்பதன் நேரடியான பொருள் ‘அடி/தாக்கு.’ ஒருமுறை அல்லது பலமுறை என்பதைக் குறிப்பிடாமல் ‘அடித்து’ மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் உள்ளது; சட்டத்தின் தனிநபர் கர்த்தாவை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: தன் ஆண் அடிமை / தன் பெண் அடிமை
  rationale: இச்சட்டச் சூழலில் சொந்தக்காரரின் அதிகாரத்திற்குட்பட்ட பிணைப்புநிலையும் விடுதலையும் தெளிவாக இருப்பதால் ‘வேலைக்காரர்’ என்பதற்குப் பதிலாக ‘அடிமை’ பயன்படுத்தப்படுகிறது; இரு பாலினங்களின் வேறுபாடும் காக்கப்படுகிறது.
- source_word: וְשִׁחֲתָהּ
  choice: அதைச் சிதைத்துவிட்டால்
  rationale: שחת இங்கு கண்ணை நிரந்தரமாகப் பாழாக்குவதைக் குறிக்கிறது. ‘சிதைத்துவிட்டால்’ முழுக் குருடாக்குதலுக்கு மட்டும் பொருளைச் சுருக்காமல் கடுமையான நிரந்தர சேதத்தைக் காட்டுகிறது.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: அந்த அடிமையை அவன் விடுதலை செய்ய வேண்டும்
  rationale: சட்டச் சூழலில் இது அடிமைநிலையிலிருந்து விடுவிப்பதைக் குறிக்கிறது. தமிழில் ‘விடுதலை செய்ய வேண்டும்’ சட்டத்தின் கட்டாயத் தன்மையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: תַּחַת עֵינוֹ
  choice: அந்தக் கண்ணுக்குப் பதிலீடாக
  rationale: תחת சட்டப் பயன்பாட்டில் ‘பதிலாக/ஈடாக’ என்னும் பொருளைக் கொண்டது. இங்கு கண்ணுக்கு ஏற்பட்ட சேதத்திற்கான ஈடாக விடுதலை வழங்கப்படுவதை ‘பதிலீடாக’ தெளிவாக்குகிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் வழக்குச் சட்டத்தில் அடிமைநிலையைக் குறிக்கும் சொற்கள்
  choice: ஆண் அடிமை / பெண் அடிமை
  alternative: வேலைக்காரன் / வேலைக்காரி
  rationale: உரிமை, உடல் சேதம், அதற்கான விடுதலை ஆகியவை இச்சட்டத்தில் முக்கியமானவை. ஆகவே சமூக உண்மையை மென்மையாக்காமல் ‘அடிமை’ என மொழிபெயர்க்கப்படுகிறது.
- issue: சட்டத்தின் ஆண்பால் கர்த்தா
  choice: ஒருவன்
  alternative: ஒருவர்
  rationale: மூலத்தில் אִישׁ ஆண்பால் ஒருமையாக உள்ளது. சூழல் தெளிவாகப் பொதுப்பாலைக் கோராததால் அந்த வடிவம் தக்கவைக்கப்படுகிறது.
- issue: விடுதலை செய்யப்படுபவரைக் குறிக்கும் ஆண்பால் எபிரெயப் பின்னொட்டு
  choice: அந்த அடிமையை
  alternative: அவனை
  rationale: எபிரெய மொழியில் ஆண்பால் பின்னொட்டு இருந்தாலும் சட்டம் ஆண் அடிமைக்கும் பெண் அடிமைக்கும் பொருந்துகிறது. ‘அந்த அடிமையை’ என்பது இருவரையும் உள்ளடக்கி, மூலத்தின் சட்ட நோக்கத்தைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் சட்டநடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அடிமை’ சமூக நிலையைத் துல்லியமாகக் காட்டுகிறது; ‘விடுதலை செய்ய வேண்டும்’ சட்டக் கட்டாயத்தைத் தெளிவுபடுத்துகிறது. பாலினத்தால் பொருள் குழப்பமடையாமல் ‘அந்த அடிமையை’ பயன்படுத்தப்பட்டுள்ளது.
