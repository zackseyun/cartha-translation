  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: ta
  text: ஒருவன் தன் ஆண் அடிமையையோ பெண் அடிமையையோ கோலால் அடித்து, அந்த அடிமை அவன் கையின் கீழ் இறந்துபோனால், அந்த அடிமைக்காகப் பழிவாங்கப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடித்தவன் கட்டாயம் தண்டிக்கப்பட வேண்டும்.” எபிரெயத்தில் சொல்லுக்கு நெருக்கமாக, “அந்த அடிமைக்காகக் கட்டாயம் பழிவாங்கப்பட வேண்டும்” என்று உள்ளது; இது வலியுறுத்தும் சட்டச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִֽי
  choice: ஒருவன் ... அடித்து ... இறந்துபோனால்
  rationale: வாவ் இணைப்புடன் வரும் நிபந்தனைச் சட்ட அமைப்பைத் தமிழில் இயல்பான ‘-னால்’ நிபந்தனை வடிவில் கொடுக்கிறது; தனியாக ‘மேலும்’ சேர்ப்பது தமிழில் தேவையற்றதாகும்.
- source_word: יַכֶּה
  choice: அடித்து
  rationale: נכה என்பது பொதுவாக அடிப்பதையோ தாக்குவதையோ குறிக்கிறது; கருவியாகக் கோல் குறிப்பிடப்படுவதால் ‘அடித்து’ இச்சூழலில் இயல்பும் துல்லியமும் உடையது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெயச் சட்ட நடையில் உள்ள ஆண்பால் ஒருமையை நவீனத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: தன் ஆண் அடிமையையோ பெண் அடிமையையையோ
  rationale: இச்சட்டச் சூழலில் சொற்கள் வெறும் பணியாளர்களை அல்ல, அடிமை நிலையிலுள்ள ஆணையும் பெண்ணையும் குறிக்கின்றன; இருபாலரையும் வெளிப்படையாக இணைக்கும் மூலத்தின் இணைநிலையைப் பாதுகாக்கிறது.
- source_word: בַּשֵּׁבֶט
  choice: கோலால்
  rationale: שבט இங்கு அடிக்கப் பயன்படுத்தப்படும் கோலைக் குறிக்கிறது; ‘கோல்’ தெளிவான, நடப்புத் தமிழ் சொல்.
- source_word: וּמֵת
  choice: இறந்துபோனால்
  rationale: அடித்ததன் தொடர்ச்சியில் மரணம் நிகழ்வதைத் தமிழின் நிபந்தனைச் சட்ட வாக்கிய அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது; காரண நோக்கத்தை அளவுக்கு மீறிக் குறிப்பிடவில்லை.
- source_word: תַּחַת יָדוֹ
  choice: அவன் கையின்கீழ்
  rationale: ‘அவனுடைய கைக்குக் கீழ்’ என்ற மூல உருவகத்தையும், அடித்தவனின் உடனடி செயலால் அல்லது கட்டுப்பாட்டில் மரணம் நிகழும் சட்ட நுணுக்கத்தையும் காக்கிறது.
- source_word: נָקֹם יִנָּקֵם
  choice: அந்த அடிமைக்காகப் பழிவாங்கப்பட வேண்டும்
  rationale: வினையெச்சப்பெயர் + வினை வடிவத்தின் வலியுறுத்தலை ‘வேண்டும்’ மூலம் சட்டக் கட்டாயமாகக் காட்டுகிறது. செயப்படுபொருளின் தெளிவின்மையைத் தவிர்க்க இறந்த அடிமைக்காக நீதி/பழிவாங்கல் நிகழ வேண்டும் எனத் தமிழ் அமைக்கப்பட்டுள்ளது; தண்டனையின் சரியான வடிவம் குறிப்பிடப்படவில்லை.
theological_decisions:
- issue: נָקֹם יִנָּקֵם என்பதிலுள்ள சட்ட விளைவின் இயல்பு
  choice: அந்த அடிமைக்காகப் பழிவாங்கப்பட வேண்டும்
  alternative: அடித்தவன் கட்டாயம் தண்டிக்கப்பட வேண்டும்
  rationale: எபிரெயம் பழிவாங்கும் நடவடிக்கை உறுதியாக நடைபெற வேண்டும் என்று வலியுறுத்துகிறது; ஆனால் இவ்வசனத்திலேயே தண்டனையின் குறிப்பிட்ட வடிவத்தைச் சொல்லவில்லை. ஆகவே பொதுவான ‘தண்டிக்கப்பட வேண்டும்’ என்பதை விட மூலச் சொல்லின் சட்டத் தீவிரத்தை முதன்மை உரை காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன, தரமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தமிழ். அடிமை நிலையை மறைக்கும் ‘வேலைக்காரன்/வேலைக்காரி’ போன்ற சொற்கள் தவிர்க்கப்பட்டன. எபிரெயச் சட்டச் சூத்திரத்தின் தீவிரமும், தண்டனையின் துல்லிய வடிவம் குறித்த தெளிவின்மையும் பாதுகாக்கப்பட்டன.
