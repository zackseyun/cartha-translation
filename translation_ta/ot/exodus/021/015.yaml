  source_fidelity: மூல எபிரெயத்தின் மַכֵּה (‘அடிக்கிறவன்’) மற்றும் மוֹת יוּמָת என்ற வலியுறுத்தப்பட்ட சட்டத் தண்டனைச் சூத்திரம் துல்லியமாகக் காக்கப்பட்டுள்ளன. ‘தன் தந்தையையோ தாயையையோ’ என்பது எபிரெயத்தின் முறையான ‘மற்றும்’ இணைப்பைச் சட்டச் சூழலுக்குரிய பகிர்நிலைப் பொருளில் இயல்பாகத் தருகிறது; இரு பெற்றோரையும் ஒருசேர அடித்தால்தான் தண்டனை என்ற தவறான பொருளைத் தவிர்க்கிறது.
