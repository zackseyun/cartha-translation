  text: וּ/מַכֵּ֥ה אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/015.yaml
  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: ta
  text: தன் தந்தையையோ தாயையையோ அடிக்கிறவன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “தன் தந்தையையும் தன் தாயையும்” என்று உள்ளது; ஆனால் தந்தை அல்லது தாய் ஆகிய இருவரில் யாரை அடித்தாலும் இச்சட்டம் பொருந்தும் என்பதைத் தெளிவாக்கத் தமிழில் “தந்தையையோ தாயையையோ” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: அடிக்கிறவன்
  rationale: נכה என்பதன் பங்கேற்பு வடிவம் உடல்ரீதியாக அடிப்பவனைக் குறிக்கிறது. ‘அடிக்கிறவன்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இருந்து, ‘தாக்குகிறவன்’ அல்லது ‘அடித்துத் துன்புறுத்துகிறவன்’ என்பவற்றைப் போல செயலின் தீவிரத்தை மிகைப்படுத்தாது.
- source_word: אָבִיו
  choice: தன் தந்தையை
  rationale: எபிரெய உரை பொதுவாக ‘பெற்றோர்’ என்று சொல்லாமல், ஒருமை ஆண்பாலில் தந்தையைத் தனியே குறிப்பிடுகிறது; ‘தன்’ என்பது செய்பவனுடனான உறவைத் தமிழில் தெளிவாக்குகிறது.
- source_word: אִמּוֹ
  choice: தாயை
  rationale: எபிரெய உரை தாயையும் வெளிப்படையாகத் தனியே குறிப்பிடுவதால், இரண்டு பெற்றோரையும் பொதுச் சொல்லாகச் சுருக்காமல் இணை அமைப்பு காக்கப்படுகிறது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: வினையெச்சப் பெயர்ச்சொல் மற்றும் வரையறுக்கப்பட்ட வினை இணையும் இவ்வமைப்பு மரணத் தண்டனையை வலியுறுத்தும் சட்டச் சூத்திரம். ‘நிச்சயமாக’ அதன் வலியுறுத்தலையும், ‘கொல்லப்பட வேண்டும்’ நீதித்துறை சார்ந்த செயப்பாட்டு வடிவத்தையும் காக்கிறது.
- source_word: וּ / וְ
  choice: -யையோ … -யையோ
  rationale: எபிரெய இணைப்புச் சொல் வடிவத்தில் ‘மற்றும்’ என்றாலும், இச்சட்டச் சூழலில் தந்தை அல்லது தாய் ஆகிய இருவரில் யாரை அடித்தாலும் தண்டனை பொருந்தும். தமிழின் ‘-யையோ … -யையோ’ அமைப்பு இந்தப் பகிர்நிலைப் பொருளைத் தவறான இருவரையும் சேர்த்து அடித்தல் என்ற வாசிப்பின்றி இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சட்டத் தண்டனைச் சூத்திரத்தை மொழிபெயர்த்தல்
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  alternative: சாக வேண்டும்
  rationale: இவ்வசனம் மரணம் என்னும் விளைவை மட்டும் கூறாமல், சட்டப்படி நிறைவேற்றப்படும் மரணத் தண்டனையை விதிக்கிறது. செயப்பாட்டு வடிவம் அந்த நீதித்துறைச் செயல்பாட்டைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடிக்கிறவன்’ சாதாரண வாசகருக்கு எளிதில் புரியும்; ‘நிச்சயமாகக் கொல்லப்பட வேண்டும்’ மூலத்தின் வலியுறுத்தலையும் சட்டரீதியான செயப்பாட்டு வடிவத்தையும் காக்கிறது.
