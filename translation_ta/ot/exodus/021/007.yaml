source:
  edition: WLC
  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: ta
  text: ஒருவன் தன் மகளை அடிமைப் பெண்ணாக[a] விற்றால், ஆண் அடிமைகள் வெளியேறுவதுபோல் அவள் வெளியேற மாட்டாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பணிப்பெண்ணாக.’ எபிரெயச் சொல் கட்டுப்பட்ட சேவையில் உள்ள பெண்ணைக் குறிக்கிறது; இங்கு அவளுடைய சட்ட நிலையைத் தெளிவாக்க ‘அடிமைப் பெண்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ஆண் அடிமைகள் விடுதலை செய்யப்படும் அதே விதிமுறைகளின்படி அவளுடைய சேவை முடிவதில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: ஒருவன் ... விற்றால்
  rationale: இந்த இணைப்பும் நிபந்தனைச் சொல்லும் சட்டத்தின் அடுத்த நிபந்தனை நிகழ்வை அறிமுகப்படுத்துகின்றன. தமிழில் ‘விற்றால்’ என்பதே இயல்பாக அந்த நிபந்தனைத் தொடர்பை வெளிப்படுத்துகிறது; வசனத்தின் தொடக்கத்தில் தனியே ‘மேலும்’ சேர்ப்பது தேவையில்லை.
- source_word: יִמְכֹּר
  choice: விற்றால்
  rationale: வினைச்சொல்லின் ‘விற்பது’ என்ற நேரடியான பொருளையும் நிபந்தனைச் சட்ட நடையையும் தெளிவாகக் காட்டுகிறது.
- source_word: אִישׁ
  choice: ஒருவன்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் இருப்பதையும், இச்சட்டச் சூழலில் தன் மகளை விற்கும் ஆண் குடும்பத் தலைவனைக் குறிப்பதையும் காக்கிறது.
- source_word: בִּתּוֹ
  choice: தன் மகளை
  rationale: மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பொருளைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: לְאָמָה
  choice: அடிமைப் பெண்ணாக
  rationale: אָמָה என்பது கட்டுப்பட்ட சேவை நிலையில் உள்ள பெண்ணைக் குறிக்கிறது. ‘பணிப்பெண்’ என்பதைவிட ‘அடிமைப் பெண்’ விற்பனை சார்ந்த சட்ட நிலையைக் குறைவாக மென்மைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: לֹא תֵצֵא
  choice: அவள் ... வெளியேற மாட்டாள்
  rationale: ‘வெளியேறுதல்’ என்ற எபிரெயச் சட்ட வழக்கைத் தக்கவைத்தும், ஆண் அடிமைகளின் விடுதலை முறையோடு வரும் ஒப்பீட்டைத் தெளிவாக இணைத்தும் மொழிபெயர்க்கிறது. இது அவளுக்கான தனிப்பட்ட தடையாக மட்டும் ஒலிக்காமல் சட்ட விளைவாக அமைகிறது.
- source_word: כְּצֵאת
  choice: வெளியேறுவதுபோல்
  rationale: ஒப்பீட்டு அமைப்பையும் மூலத்தில் இருமுறை வரும் ‘வெளியேறு’ என்ற வினை இணைப்பையும் காக்கிறது.
- source_word: הָעֲבָדִים
  choice: ஆண் அடிமைகள்
  rationale: முந்தைய சட்டத்தில் வரும் ஆண் அடிமைகளுக்கும் இவ்வசனத்தின் அடிமைப் பெண்ணுக்கும் இடையிலான பாலின அடிப்படையிலான சட்ட வேறுபாட்டைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் அடிமைத்தனச் சொற்களை மொழிபெயர்த்தல்
  choice: ‘அடிமைப் பெண்’, ‘ஆண் அடிமைகள்’ என்று வழங்குதல்
  alternative: ‘பணிப்பெண்’, ‘வேலையாட்கள்’ என்று வழங்குதல்
  rationale: இந்த வசனத்தில் விற்பனையும் விடுதலையும் மையமாக இருப்பதால், கட்டுப்பட்ட சட்ட நிலையைக் மென்மைப்படுத்தாமல் காட்டுவது அவசியம். அதேவேளை, மொழிபெயர்ப்பு அந்த அமைப்பை ஆதரிப்பதாகவோ கண்டிப்பதாகவோ கூடுதல் மதிப்பீட்டைச் சேர்க்கவில்லை.
- issue: לֹא תֵצֵא என்பதன் சட்ட வலிமை
  choice: ‘வெளியேற மாட்டாள்’ என்ற சட்ட விளைவு
  alternative: ‘வெளியேறக் கூடாது’ என்ற நேரடித் தடை
  rationale: சூழலில் இது பெண்ணுக்குக் கொடுக்கப்படும் கட்டளை அல்ல; ஆண் அடிமைகளுக்குரிய அதே விடுதலை விதி அவளுக்கு அப்படியே பொருந்தாது என்பதைக் கூறும் சட்ட ஏற்பாடு. எனவே எதிர்கால மறுப்பு வடிவம் மூலத்தின் பதற்றத்தையும் தொடரும் வசனங்களுக்கான திறந்த நிலையையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட உரைக்குரிய சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘வெளியேறுதல்’ என்ற மீளுரைத்தல் மூல எபிரெயத்தின் சட்டச் சொல்லாட்சியையும் ஒப்பீட்டு அமைப்பையும் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் விடுதலை சார்ந்த பொருளை விளக்குகிறது.
