base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: ta
  text: மாடு ஓர் ஆண் அடிமையையோ பெண் அடிமையையோ[a] கொம்பால் குத்தினால், மாட்டின் உரிமையாளர் அந்த அடிமையின் எஜமானுக்கு முப்பது சேக்கல் வெள்ளியைக் கொடுக்க வேண்டும்; அந்த மாடு கல்லெறிந்து கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும் ஒரு அடிமையை” என்றும் மொழிபெயர்க்கலாம். எபிரெயம் ஆண் அடிமைக்கு (עֶבֶד) மற்றும் பெண் அடிமைக்கு (אָמָה) தனித்தனி சொற்களைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: ஆண் அடிமை
  rationale: இந்தச் சட்டச் சூழலில் அடிமைப்பட்ட சமூக-சட்ட நிலை முக்கியமானது. אָמָה என்பதுடன் இணையாக வருவதால் பாலின வேறுபாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: אָמָה
  choice: பெண் அடிமை
  rationale: עֶבֶד என்பதற்கு இணையாகப் பெண் அடிமையைக் குறிக்கிறது; நவீனத் தமிழில் சட்ட-சமூக நிலையையும் பாலினத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יִגַּח
  choice: கொம்பால் குத்தினால்
  rationale: נגח என்ற வினை, மாடு தனது கொம்புகளால் குத்துவதைக் குறிப்பாகக் குறிக்கிறது; தமிழில் செயலைத் துல்லியமாகவும் இயல்பாகவும் சொல்கிறது.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: முப்பது சேக்கல் வெள்ளி
  rationale: வெள்ளியின் அளவு சேக்கல் என்னும் எடை அலகால் கணக்கிடப்பட்டதைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יִתֵּן
  choice: கொடுக்க வேண்டும்
  rationale: இச்சூழலில் எபிரெய முற்றுப்பெறா வினை சட்டப்படியான கடமையை வெளிப்படுத்துகிறது; நவீனத் தமிழ்ச் சட்ட நடைக்கு இது இயல்பானது.
- source_word: לַאדֹנָיו
  choice: அந்த அடிமையின் எஜமானுக்கு
  rationale: ஆண்பால் ஒருமை பின்னொட்டு மிக இயல்பாக முன் குறிப்பிடப்பட்ட அடிமையையே சுட்டுகிறது. தமிழில் சுட்டுப்பெயர் ஏற்படுத்தக்கூடிய குழப்பத்தைத் தவிர்த்து உடைமை உறவைத் தெளிவாக்குகிறது.
- source_word: יִסָּקֵל
  choice: கல்லெறிந்து கொல்லப்பட வேண்டும்
  rationale: סקל என்பதன் செயப்பாட்டு வடிவம் கல்லெறிதல் மூலம் நிறைவேற்றப்படும் மரணத் தண்டனையைக் குறிக்கிறது; தமிழில் விளைவைத் தெளிவாகச் சொல்கிறது.
theological_decisions:
- issue: கொடுப்பவர் யார் என்பது இவ்வசனத்தில் வெளிப்படையாகப் பெயரிடப்படவில்லை
  choice: மாட்டின் உரிமையாளர்
  alternative: அவன்
  rationale: முந்தைய சட்டச் சூழலில் கொடுப்பவர் மாட்டின் உரிமையாளர் என்பது தெளிவாகிறது. தமிழில் தனித்து வாசிக்கும்போதும் பொருள் விளங்க, மறைந்துள்ள எழுவாய் வெளிப்படுத்தப்பட்டுள்ளது.
- issue: לַאדֹנָיו என்பதிலுள்ள பின்னொட்டு யாரைக் குறிக்கிறது
  choice: அந்த அடிமையின் எஜமானுக்கு
  alternative: அவனுடைய எஜமானுக்கு
  rationale: அருகிலுள்ள ஆண் அல்லது பெண் அடிமையையே பின்னொட்டு இயல்பாகச் சுட்டுகிறது; மாட்டின் உரிமையாளரை அல்ல. பாலினத்தைத் தனியாக நிர்ணயிக்காமல் தமிழில் உறவு தெளிவாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, மரியாதையான, பொதுமக்கள் புரிந்துகொள்ளும் சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘அடிமை’ என்பது மூலத்தின் சமூக-சட்ட உண்மையை மென்மைப்படுத்தாமல் வெளிப்படுத்துகிறது; ‘எஜமான்’ இங்கு மனித உரிமையாளரைக் குறிக்கும் சமூகச் சொல், தெய்வீகப் பட்டம் அல்ல.
