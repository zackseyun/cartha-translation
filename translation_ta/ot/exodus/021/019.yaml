  source_fidelity: 'மூல எபிரெய நிபந்தனைச் சட்டவிதி துல்லியமாகப் பிரதிபலிக்கப்படுகிறது: காயமடைந்தவர் எழுந்து ஊன்றுகோல் ஆதரவுடன் வெளியே நடமாடுவது, அடித்தவனின் தண்டனைப் பொறுப்பு நீங்குவது, ஆனால் இழந்த வேலைக்காலத்திற்கான ஈடும் முழுக் குணமடைவதற்கான பொறுப்பும் தொடர்வது அனைத்தும் காக்கப்பட்டுள்ளன. וְרַפֹּא יְרַפֵּא என்பதன் வலியுறுத்தலும் ஏற்பாடு/பொறுப்பு சார்ந்த பொருளும் சரியாகத் தரப்பட்டுள்ளன.'
  naturalness: நடை நவீனத் தரத் தமிழில் இயல்பாகவும் சட்டவிதிக்கேற்ற முறையாகவும் உள்ளது. ‘தன் ஊன்றுகோலின் உதவியுடன்’ என்பது சொல்லுக்குச் சொல் வடிவத்தைவிட விளக்கமானதாக இருந்தாலும், மூலத்தின் ஆதரவைச் சார்ந்த நடப்புப் பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
  terminology: ‘தண்டனைப் பொறுப்பிலிருந்து விடுவிக்கப்படுவான்’ என்பது நקה சொல்லின் சட்டப்பூர்வ விடுதலைப் பொருளை, அடுத்துவரும் இழப்பீட்டுக் கடமை தொடரும் நிலையில், பொருத்தமாக வரையறுக்கிறது. ‘இழப்பீடு’ மற்றும் ‘முழுமையாகக் குணமடையச் செய்ய வேண்டும்’ ஆகியவை இச்சூழலுக்கு ஏற்றவை. பெயர்கள் அல்லது இறையியல் சொற்கள் தொடர்பான சிக்கல் இல்லை.
