translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் நிபந்தனை அமைப்பும், அடித்தவனின் தண்டனைப் பொறுப்பு நீங்கினாலும் இழப்பீடும் குணப்படுத்தும் பொறுப்பும் தொடரும் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
