  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: ta
  text: அவன் எழுந்து, தன் ஊன்றுகோலின் உதவியுடன்[a] வெளியே நடமாடினால், அவனை அடித்தவன் தண்டனைப் பொறுப்பிலிருந்து விடுவிக்கப்படுவான். ஆனால் அவன் வேலை செய்ய முடியாமல் இருந்த காலத்திற்கான இழப்பீட்டை[b] கொடுத்து, அவன் முழுமையாகக் குணமடையச் செய்ய வேண்டும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் ஊன்றுகோலில் சாய்ந்தபடி.’ எபிரெய மொழியில் சொல்லுக்கு சொல் ‘தன் ஊன்றுகோலின்மேல்’ என்று உள்ளது; ஓரளவு குணமடைந்ததற்குச் சான்றாக, ஆதரவுடன் நடப்பதை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வேலை செய்ய முடியாமல் இருந்த காலம்’ என்பது, காயமடைந்தவர் இயலாமையால் தமது வழக்கமான வேலையைச் செய்ய முடியாதிருந்த காலத்திற்கான இழப்பீட்டைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: ‘முழுமையாகக் குணமடையச் செய்ய வேண்டும்’ என்பதற்கான எபிரெயச் சொற்றொடர் சொல்லுக்கு சொல் ‘குணப்படுத்தி குணப்படுத்த வேண்டும்’ என்று வலியுறுத்துகிறது. தேவையான மருத்துவச் செலவை ஏற்று, அவர் குணமடைவதை உறுதிசெய்ய வேண்டும் என்பது இதன் பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם
  choice: எழுந்து
  rationale: காயத்திற்குப் பிறகு படுக்கையிலிருந்து எழும் அளவுக்கு உடல்நலம் தேறுவதைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: வெளியே நடமாடினால்
  rationale: Hitpael வடிவம் ஒரே அடி எடுத்து வைப்பதைவிடத் தொடர்ந்து நடமாடுவதைக் குறிக்கிறது; בַּחוּץ பொதுவெளியில் அசைய முடிவதைக் காட்டுகிறது.
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: தன் ஊன்றுகோலின் உதவியுடன்
  rationale: எபிரெயச் சொற்றொடரின் ஆதரவைச் சார்ந்து நடக்கும் பொருளைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: וְנִקָּה הַמַּכֶּה
  choice: அவனை அடித்தவன் தண்டனைப் பொறுப்பிலிருந்து விடுவிக்கப்படுவான்
  rationale: נקה என்பதன் சட்டச் சூழலிலுள்ள விடுதலைப் பொருளைக் காட்டுகிறது; இருப்பினும் அடுத்துள்ள இழப்பீட்டுக் கடமை தொடர்வதால் எல்லாப் பொறுப்பிலிருந்தும் விடுதலை என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: שִׁבְתּוֹ יִתֵּן
  choice: அவன் வேலை செய்ய முடியாமல் இருந்த காலத்திற்கான இழப்பீட்டைக் கொடுத்து
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘இருத்தல்/ஓய்ந்திருத்தல்’; இக்காயச்சட்டச் சூழலில் இயலாமையால் ஏற்பட்ட வேலைநேர இழப்புக்கான ஈட்டைச் சுட்டுகிறது.
- source_word: וְרַפֹּא יְרַפֵּא
  choice: அவன் முழுமையாகக் குணமடையச் செய்ய வேண்டும்
  rationale: வினையெச்ச முழுவடிவமும் வினையும் சேர்ந்த வலியுறுத்தலை ‘முழுமையாக’ என்பதால் வெளிப்படுத்துகிறது; அடித்தவனே மருத்துவர் எனக் கூறாமல், குணப்படுத்துவதற்கான ஏற்பாட்டுப் பொறுப்பைக் காட்டுகிறது.
