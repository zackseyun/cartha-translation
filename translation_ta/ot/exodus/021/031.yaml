  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: ta
  text: அது ஒரு மகனையோ ஒரு மகளையோ முட்டினால், இந்தத் தீர்ப்பின்படியே[b] அவனுக்குச் செய்யப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, காளை ஒரு மகனையோ மகளையையோ முட்டினால், முந்தைய வசனங்களில் கூறப்பட்ட சட்டவிதிப்பின்படியே அதன் உரிமையாளர்மீது நடவடிக்கை எடுக்கப்படும்.
    reason: cross_reference
  - marker: b
    text: அல்லது, “இந்த விதியின்படி” அல்லது “இந்தச் சட்டத்தின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: முட்டினால்
  rationale: אוֹ பொதுவாக ‘அல்லது’ என்று பொருள்பட்டாலும், இங்கு முந்தைய சட்டத்தின் மாற்றுச் சூழலை அறிமுகப்படுத்துகிறது. நவீன தமிழ்ச் சட்ட நடையில் நிபந்தனை வடிவான ‘முட்டினால்’ இயல்பாக அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: בֵן
  choice: ஒரு மகன்
  rationale: எபிரெயச் சொல்லின் நேரடியான ‘மகன்’ என்ற பொருளையும், அதனுடன் இணையாக வரும் ‘மகள்’ என்ற பாலினக் குறிப்பையும் காக்கிறது.
- source_word: יִגָּח
  choice: அது ... முட்டினால்
  rationale: נגח என்பது கொம்பால் முட்டுவதைக் குறிக்கிறது. முந்தைய வசனத்திலுள்ள காளையே மறைமுக எழுவாய் என்பதால் தமிழில் ‘அது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַת
  choice: ஒரு மகள்
  rationale: எபிரெயச் சொல்லின் நேரடியான ‘மகள்’ என்ற பொருளையும் ‘மகன்’ என்பதுடனான சட்டரீதியான இணைத்தன்மையையும் காக்கிறது.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: இந்தத் தீர்ப்பின்படியே
  rationale: מִשְׁפָּט இங்கு முன் வசனத்தில் கூறப்பட்ட சட்டத் தீர்ப்பு அல்லது விதிக்கப்பட்ட முடிவைக் குறிக்கிறது. ‘தீர்ப்பு’ மூலத்திற்கு நெருக்கமாகவும் தமிழில் தெளிவாகவும் உள்ளது.
- source_word: יֵעָשֶׂה
  choice: செய்யப்பட வேண்டும்
  rationale: எபிரெய நிபால் வினையின் செயப்பாட்டு வடிவைத் தக்கவைத்து, முன்பு கூறப்பட்ட தண்டனை நிறைவேற்றப்பட வேண்டும் என்ற சட்ட நடையை வெளிப்படுத்துகிறது.
- source_word: לּוֹ
  choice: அவனுக்கு
  rationale: சூழலில் இது காளையின் உரிமையாளரைக் குறிக்கிறது. ஆயினும் மூலத்தில் பெயர் மீண்டும் சொல்லப்படாததால் ‘அவனுக்கு’ என்று அதன் மறைமுகக் குறிப்பைத் தக்கவைக்கிறது.
