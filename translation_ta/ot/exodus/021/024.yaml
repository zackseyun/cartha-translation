  text: eye for eye[a], tooth for tooth, hand for hand, foot for foot.
translation:
  language: ta
  text: கண்ணுக்குக் கண்[a], பல்லுக்குப் பல், கைக்குக் கை, காலுக்குக் கால்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண்ணுக்குப் பதிலாகக் கண், பல்லுக்குப் பதிலாகப் பல், கைக்குப் பதிலாகக் கை, காலுக்குப் பதிலாகக் கால்.”
    reason: תַּחַת என்பதன் ‘பதிலாக / இடத்தில்’ என்ற சொற்பொருள் மாற்றை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: עַיִן
  choice: கண்
  rationale: இந்த எபிரெயச் சொல் உடலுறுப்பான கண்ணையே குறிக்கிறது. சட்டச் சூத்திரத்தின் சுருக்கமான இணை அமைப்பைத் தமிழிலும் ‘கண்’ இயல்பாகப் பேணுகிறது.
- source_word: תַּחַת
  choice: -க்கு
  rationale: இங்கு இச்சொல் இடஞ்சார்ந்த ‘கீழ்’ என்ற பொருளில் அல்லாமல், ஒன்றுக்கு ஈடான மாற்றீடு அல்லது பதிலீட்டைக் குறிக்கிறது. ‘கண்ணுக்குக் கண்’ என்ற தமிழ்ச் சட்டச் சூத்திரத்தில் வேற்றுமை உருபு இதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: שֵׁן
  choice: பல்
  rationale: இச்சொல் உடலுறுப்பான பல்லைக் குறிக்கிறது; இணையான சட்ட மொழிநடையை இது நேரடியாகப் பேணுகிறது.
- source_word: יָד
  choice: கை
  rationale: பொதுவான பொருள் உடலுறுப்பான கை. மூலத்தின் ஒத்திசைவான வரிசையையும் சுருக்கத்தையும் ‘கை’ பேணுகிறது.
- source_word: רֶגֶל
  choice: கால்
  rationale: רֶגֶל சில இடங்களில் பாதம் அல்லது கீழ்க்காலைச் சுட்டலாம். நவீனத் தமிழில் ‘கால்’ முழுக் கீழ் உறுப்பையும் இயல்பாகக் குறிக்கக்கூடியதுடன், இச்சட்டச் சூத்திரத்திலும் பொருத்தமாக உள்ளது.
theological_decisions:
- issue: சட்டச் சூத்திரத்தின் இயல்பு
  choice: ‘கண்ணுக்குக் கண் … காலுக்குக் கால்’ என்ற விகிதத்திற்கேற்ற பதிலீட்டைக் கூறும் சுருக்கமான வடிவம்
  alternative: ‘காயத்திற்கேற்ற தண்டனை வழங்கப்பட வேண்டும்’ போன்ற விளக்க உரை
  rationale: எபிரெய உரையில் תַּחַת என்பதுடன் இணைக்கப்பட்ட உடலுறுப்புப் பெயர்கள் மட்டுமே உள்ளன. இது நடைமுறைத் தண்டனையா, இழப்பீட்டின் அளவுக்கோலா என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், மூலத்தின் சுருக்கத்தையும் இறையியல் பதற்றத்தையும் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சட்டச் சூத்திர நடையைப் பயன்படுத்துகிறது. எபிரெய மூலத்தின் நான்கு இணைச் சொற்றொடர்களும் சுருக்கமும் பேணப்பட்டுள்ளன; [a] குறிப்பு முதன்மை உரையில் இடம்பெற்றுள்ளது.
