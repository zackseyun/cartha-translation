  terminology: “எஜமான்,” “இறைவன்,” “கதவு நிலைக்கால்,” and “குத்தூசி” are appropriate choices. The footnote correctly preserves the viable legal-context alternative “நீதிபதிகளிடம்” for הָאֱלֹהִים, without forcing that interpretation into the main text.
