source:
  edition: WLC
  text: וְ/הִגִּישׁ֤/וֹ אֲדֹנָי/ו֙ אֶל הָ֣/אֱלֹהִ֔ים וְ/הִגִּישׁ/וֹ֙ אֶל הַ/דֶּ֔לֶת א֖וֹ אֶל הַ/מְּזוּזָ֑ה וְ/רָצַ֨ע אֲדֹנָ֤י/ו אֶת אָזְנ/וֹ֙ בַּ/מַּרְצֵ֔עַ וַ/עֲבָד֖/וֹ לְ/עֹלָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: ta
  text: அப்போது அவனுடைய எஜமான் அவனை இறைவனிடம்[a] அழைத்து வர வேண்டும். பின்பு அவனை கதவிடமோ கதவு நிலைக்காலிடமோ அழைத்து வந்து, அவனுடைய எஜமான் அவன் காதைக் குத்தூசியால் துளைக்க வேண்டும். அவன் வாழ்நாள் முழுவதும் அவருக்குப் பணிசெய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிபதிகளிடம்.” எபிரெய மொழியிலுள்ள אֱלֹהִים என்ற சொல் சில சட்டச் சூழல்களில் மனித நீதிபதிகளையோ நீதிமன்ற அதிகாரிகளையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הִגִּישׁוֹ
  choice: அவனை ... அழைத்து வர வேண்டும்
  rationale: நגשׁ என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஓர் அதிகாரத்தின் முன்பாக அல்லது குறிப்பிட்ட இடத்திற்கு அழைத்து வருவதைக் குறிக்கிறது; தமிழில் இது இயல்பாகவும் சட்ட நடைமுறைக்கேற்றவாறும் உள்ளது.
- source_word: אֲדֹנָיו
  choice: அவனுடைய எஜமான்
  rationale: இங்கு கடன்பட்ட அடிமை முறையிலுள்ள சமூக-சட்ட உறவைக் குறிக்கிறது; ‘எஜமான்’ என்பது தெய்வீகப் பொருளைச் சேர்க்காமல் அந்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָאֱלֹהִים
  choice: இறைவனிடம்
  rationale: இந்தச் சொல் அடிப்படையாக இறைவனைக் குறிக்கிறது; இச்சட்டச் சூழலில் மனித நீதிபதிகள் அல்லது நீதிமன்ற அதிகாரம் என்ற பொருளும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַדֶּלֶת
  choice: கதவு
  rationale: வீட்டின் கதவைக் குறிக்கும் எளிய, நேரடியான கட்டடவியல் சொல்.
- source_word: הַמְּזוּזָה
  choice: கதவு நிலைக்கால்
  rationale: מזוזה என்பதற்கான துல்லியமான கட்டடவியல் பொருள்; நவீன தமிழில் புரிந்துகொள்ளக்கூடியது.
- source_word: רָצַע
  choice: துளைக்க வேண்டும்
  rationale: காதைக் கூரிய கருவியால் குத்தித் துளைக்கும் சடங்குச் செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: בַּמַּרְצֵעַ
  choice: குத்தூசியால்
  rationale: மரצע என்பது துளையிடப் பயன்படும் கூர்முனைக் கருவி; ‘குத்தூசி’ துல்லியமும் வாசிப்புத் தெளிவும் உடைய தமிழ் இணை.
- source_word: וַעֲבָדוֹ
  choice: அவருக்குப் பணிசெய்ய வேண்டும்
  rationale: עבד என்பதன் வினைப் பொருளான சேவை அல்லது பணிசெய்தலை நேரடியாகக் காட்டுகிறது; நிலையைப் புதிதாக ‘அடிமை’ என மறுபெயரிடவில்லை.
- source_word: לְעֹלָם
  choice: வாழ்நாள் முழுவதும்
  rationale: இந்த மனிதச் சட்டச் சூழலில் முடிவில்லாத நித்தியத்தை அல்ல, வாழ்நாள் வரை நீடிக்கும் சேவையைச் சுட்டுகிறது; தமிழில் சட்டத்தின் நடைமுறைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சட்டச் சூழலில் הָאֱלֹהִים என்பதன் பொருள்
  choice: இறைவன்
  alternative: நீதிபதிகள் / நீதிமன்ற அதிகாரிகள்
  rationale: எபிரெயச் சொல் மிக நேரடியாக ‘இறைவன்’ என்று பொருள்படும்; உடன்படிக்கை சார்ந்த சட்டச் சடங்கில் இறைவனின் முன்னிலையில் நிறுத்தப்படுவதையும் இயல்பாகக் குறிக்கலாம். அதேவேளையில் மனித நீதிபதிகள் அல்லது நீதிமன்றத்தைக் குறிக்கும் ஆகுபெயர்ப் பொருளும் நெடுங்காலமாக ஏற்கப்பட்ட சாத்தியம் என்பதால் அதை அடிக்குறிப்பில் வெளிப்படையாக வைத்துள்ளோம்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவன்’ என்ற முதன்மை வாசகத்துடன் சாத்தியமான நீதித்துறைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. לְעֹלָם என்பது இச்சூழலில் மனிதனின் வாழ்நாள் வரையிலான நிரந்தரப் பணியைச் சுட்டுவதால் ‘வாழ்நாள் முழுவதும்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
