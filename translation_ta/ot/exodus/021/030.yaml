  yaml_path: translation/ot/exodus/021/030.yaml
  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: ta
  text: அவன்மேல் ஒரு மீட்புத் தொகை விதிக்கப்பட்டால்[a], அவன் தன் உயிருக்கான மீட்பு விலையை, அவன்மேல் விதிக்கப்படும் அனைத்திற்கும் ஏற்ப, கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “அவன்மேல் மீட்புப் பணம் விதிக்கப்பட்டால், அவன் தன் உயிருக்கான மீட்பு விலையை அவன்மேல் விதிக்கப்படும் அனைத்திற்கும் ஏற்ப செலுத்த வேண்டும்.” எபிரெய மொழியில் தொடர்புடைய, ஆனால் வேறுபட்ட இரண்டு சொற்கள் பயன்படுத்தப்பட்டுள்ளன: כֹּפֶר (‘மீட்புத் தொகை/மீட்புப் பணம்’) மற்றும் פִּדְיֹן (‘மீட்பு விலை’).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: விதிக்கப்பட்டால்
  rationale: முந்தைய சட்டவிதியின் தொடர்ச்சியாக ஒரு நிபந்தனை நிலையை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான ‘-ஆல்’ நிபந்தனை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: כֹּפֶר
  choice: மீட்புத்தொகை
  rationale: தண்டனையைத் தவிர்க்க அல்லது விடுதலை பெற செலுத்தப்படும் தொகையைச் சுட்டுகிறது; வழிபாட்டுச் சார்ந்த பாவநிவாரணப் பொருளைச் சேர்க்காமல் சட்டரீதியான மீட்புப் பணத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: יוּשַׁת עָלָיו
  choice: அவன்மேல் ... விதிக்கப்பட்டால்
  rationale: שׁית என்பதன் செயப்பாட்டு வடிவமும் עַל என்பதும் ஒருவர்மேல் சட்டப்பூர்வக் கடமை விதிக்கப்படுவதைத் தெரிவிக்கின்றன.
- source_word: וְנָתַן
  choice: கொடுக்க வேண்டும்
  rationale: நிபந்தனை நிறைவேறியபின் ஏற்படும் சட்டப்பூர்வக் கடமையை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: தன் உயிரை மீட்பதற்கான விலை
  rationale: פִּדְיֹן என்பதை மீட்பு அல்லது விடுதலைக்கான விலையாகவும், נֶפֶשׁ என்பதை இச்சட்டச் சூழலில் உயிராகவும் தருகிறது; כֹּפֶר என்பதிலிருந்து உள்ள தொடர்புடைய ஆனால் வேறுபட்ட சொல்லாட்சியையும் ஓரளவு காக்கிறது.
- source_word: נַפְשׁוֹ
  choice: தன் உயிரை
  rationale: இங்கு נֶפֶשׁ என்பது உடலற்ற ‘ஆத்துமா’ என்பதை அல்ல, மரணத் தண்டனையிலிருந்து காக்கப்படும் அந்த நபரின் உயிரையே குறிக்கிறது.
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: தன்மேல் விதிக்கப்பட்ட முழுத் தொகையையும்
  rationale: விதிக்கப்பட்ட மதிப்பீட்டுக்கு முழுமையாக இணங்கச் செலுத்த வேண்டும் என்ற כֹּל-இன் விரிவான வலியுறுத்தலை இயல்பான சட்டத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மரணத் தண்டனைக்குரிய பொறுப்பின் சூழலில் இந்தப் பணத்தின் இயல்பு
  choice: சட்டரீதியான ‘மீட்புத்தொகை’ என்றும் ‘உயிரை மீட்பதற்கான விலை’ என்றும் மொழிபெயர்க்கப்பட்டது.
  alternative: இரண்டையும் வெறுமனே ‘அபராதம்’ என்று தருவது, அல்லது வழிபாட்டுச் சார்ந்த ‘பாவநிவாரணம்’ என்ற வலுவான பொருளைச் சேர்ப்பது.
  rationale: இல்லையெனில் பொருந்தக்கூடிய மரணத் தண்டனையிலிருந்து அந்த நபரின் உயிரை விடுவிக்கும் சட்டப்படி விதிக்கப்பட்ட தொகையை வசனம் குறிக்கிறது. மொழிபெயர்ப்பு எபிரெயச் சட்ட-மீட்புச் சொல்லாட்சியைப் பாதுகாத்து, குற்றமின்மை அல்லது வழிபாட்டுச் சார்ந்த பாவநிவாரணம் போன்ற கருத்துகளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்ட நடையைப் பயன்படுத்துகிறது. ‘அவன்மேல்’ மற்றும் ‘தன்மேல்’ என்ற வடிவங்கள் மூலத்தின் மீளுரையைத் தக்கவைக்கின்றன; ‘முழுத் தொகை’ என்பது כֹּל-இன் முழுமையைத் தெளிவுபடுத்துகிறது.
