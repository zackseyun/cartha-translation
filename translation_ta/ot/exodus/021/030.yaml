  naturalness: நடை நவீனத் தரத் தமிழிலும் சட்டச் சூழலுக்குப் பொருத்தமாகவும் உள்ளது. “தன் உயிரை மீட்பதற்கான விலை” இயல்பானதே; “தன் உயிருக்கான மீட்பு விலை” என்பது சுருக்கமாகவும் פִּדְיֹן-இன் பெயர்ச்சொல் தன்மையைத் தெளிவாகவும் தருகிறது.
