  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: ta
  text: ஆனால் அந்த எருது நேற்றும் அதற்கு முந்தின நாளும்[b] முட்டும் வழக்கமுடையதாயிருந்து[a], அதன் உரிமையாளருக்கு எச்சரிக்கை கொடுக்கப்பட்டிருந்தும் அவர் அதைக் கட்டுப்படுத்தி வைக்காமல், அது ஓர் ஆணையையோ பெண்ணையையோ கொன்றால், அந்த எருது கல்லெறிந்து கொல்லப்பட வேண்டும்; அதன் உரிமையாளரும் கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முட்டும் எருதாக இருந்து.” எபிரெயப் பெயரெச்சம், மீண்டும் மீண்டும் முட்டுவது தெரிந்த பழக்கமாக இருந்த விலங்கைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “நேற்றிலிருந்தும் அதற்கு முந்தின நாளிலிருந்தும்.” இது முன்னரே நிலைபெற்றிருந்த நடத்தையைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹר
  choice: மாடு
  rationale: இந்தச் சட்டச் சூழலில் ஒரு வளர்ப்பு மாட்டினத்தைப் பொதுவாகக் குறிக்கிறது; பாலினத்தைத் தேவையின்றி வலியுறுத்தும் சொல்லைவிட, நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ள ‘மாடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: נַגָּח
  choice: முட்டுகிற வழக்கமுடையதாக
  rationale: ஒருமுறை நிகழ்ந்த செயலை அல்லாமல், தொடர்ந்து காணப்பட்ட ஆபத்தான பழக்கத்தை எபிரெயப் பெயரெச்சம் குறிக்கிறது.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: நேற்றும் அதற்கு முந்தின நாளும்
  rationale: முந்தைய காலத்திலிருந்தே நிலைபெற்ற பழக்கத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தையும் சட்டநடையையும் காக்கிறது.
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: அதன் உரிமையாளருக்கு எச்சரிக்கை கொடுக்கப்பட்டிருந்தும்
  rationale: மாட்டின் ஆபத்தான பழக்கத்தைப் பற்றி உரிமையாளருக்கு முன்பே முறையாக அறிவிக்கப்பட்டிருந்தது என்ற சட்டப் பொருளை வெளிப்படுத்துகிறது.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: அவர் அதைக் கட்டுப்படுத்தி வைக்காமல்
  rationale: காத்தல் அல்லது கண்காணித்தல் என்ற வினை, இச்சூழலில் ஆபத்தான விலங்கை அடக்கி அல்லது அடைத்து வைக்க வேண்டிய பொறுப்பைக் குறிக்கிறது.
- source_word: וְהֵמִית
  choice: அது ... கொன்றுவிட்டால்
  rationale: மாட்டினால் ஏற்பட்ட மரணத்தை நேரடியாகவும் இயல்பான தமிழ் நிபந்தனை நடையிலும் தெரிவிக்கிறது.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: ஓர் ஆணையோ பெண்ணையோ
  rationale: மூலத்தில் ஆண், பெண் இருவரும் தனித்தனியாகக் குறிப்பிடப்படுவதைக் காக்கிறது.
- source_word: יִסָּקֵל
  choice: கல்லெறிந்து கொல்லப்பட வேண்டும்
  rationale: கல்லெறிதலே விதிக்கப்பட்ட மரணத் தண்டனை என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: அதன் உரிமையாளரும் கொல்லப்பட வேண்டும்
  rationale: இது இயல்பான மரணத்தைக் குறிக்காமல் விதிக்கப்பட்ட மரணத் தண்டனையைக் குறிக்கும் சட்டச் செயப்பாட்டு வடிவம்.
theological_decisions:
- issue: உரிமையாளருக்கான தண்டனையின் சட்ட வலிமை
  choice: அதன் உரிமையாளரும் கொல்லப்பட வேண்டும்
  alternative: அதன் உரிமையாளரும் இறப்பார்
  rationale: יוּמָת என்பது சாதாரணமாக இறப்பதை அல்ல, சட்டப்படி மரணத்திற்குட்படுத்தப்படுவதைச் சுட்டுகிறது; ஆனால் மூலத்தில் கூறப்படாத நிறைவேற்ற முறையை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: பலியானவரின் பாலினக் குறிப்பு
  choice: ஓர் ஆணையோ பெண்ணையோ
  alternative: ஒருவரை
  rationale: மூல உரை இரு பாலினத்தவரையும் வெளிப்படையாகக் குறிப்பிடுவதால் அந்த வேறுபாடு பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட உரைக்கேற்ற கண்ணியமானதும் நேரடியானதுமான நடை பயன்படுத்தப்பட்டது. நீண்ட எபிரெய நிபந்தனை வாக்கியத்தின் தொடர்பு காக்கப்பட்டாலும், தமிழ் வாசிப்புக்கு ஏற்ற சொல் வரிசை அமைக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களுக்கு உடனடியாக இணைக்கப்பட்டுள்ளன.
