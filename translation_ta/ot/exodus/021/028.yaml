source:
  edition: WLC
  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: ta
  text: ஒரு மாடு ஓர் ஆணையோ பெண்ணையோ முட்டி, அவர் இறந்துவிட்டால், அந்த மாடு கல்லால் அடித்துக் கொல்லப்பட வேண்டும்; அதன் இறைச்சியை உண்ணக் கூடாது. ஆனால் மாட்டின் உரிமையாளர் பொறுப்பிலிருந்து விடுபட்டவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குற்றமற்றவர்’ அல்லது ‘தண்டனைப் பொறுப்பு இல்லாதவர்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் נָקִי, இந்த வழக்கில் அவர் குற்றம் அல்லது தண்டனைப் பொறுப்பிலிருந்து விடுபட்டிருப்பதைக் குறிக்கும் சட்டச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: ஒரு ... என்றால்
  rationale: நிபந்தனை சார்ந்த சட்ட விதியை இயல்பான நவீனத் தமிழில் அறிமுகப்படுத்துகிறது; எபிரேய இணைப்பைத் தனியாக ‘மேலும்’ என்று மொழிபெயர்ப்பது தமிழில் தேவையற்றதாக இருக்கும்.
- source_word: יִגַּח
  choice: முட்டி
  rationale: கொம்பால் முட்டுவதைக் குறிக்கும் வினை; தமிழில் மாடு தொடர்பாக இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שׁוֹר
  choice: மாடு
  rationale: சட்டச் சூழலில் வரும் கால்நடையைப் பொதுவாகக் குறிக்கிறது; ‘எருது’ என்று மொழிபெயர்த்தால் ஆண்பாலைத் தேவையின்றிக் குறிப்பிட்டுவிடும்.
- source_word: אֶת־אִישׁ אוֹ אֶת־אִשָּׁה
  choice: ஓர் ஆணையோ பெண்ணையோ
  rationale: மூலத்தில் ஆண், பெண் இருவரும் வெளிப்படையாகக் குறிப்பிடப்படுவதைக் காக்கிறது.
- source_word: וָמֵת
  choice: அவர் இறந்துவிட்டால்
  rationale: முட்டப்பட்ட மனிதர் இறப்பதைக் குறிப்பிடுகிறது; மரியாதை ஒருமையான ‘அவர்’ ஆண் அல்லது பெண் இருவருக்கும் பொருந்துகிறது.
- source_word: סָקוֹל יִסָּקֵל
  choice: கல்லெறிந்து கொல்லவேண்டும்
  rationale: முடிவிலி வினையும் வரையறுக்கப்பட்ட வினையும் சேர்ந்த எபிரேய வலியுறுத்தலைத் தமிழின் கட்டாயக் கட்டளையில் தெளிவாக வெளிப்படுத்துகிறது; கல்லெறிதல் மரணத்தில் முடிய வேண்டும் என்பதும் சூழலால் தெளிவாகிறது.
- source_word: וְלֹא יֵאָכֵל אֶת־בְּשָׂרוֹ
  choice: அதன் இறைச்சியை உண்ணக் கூடாது
  rationale: எபிரேயச் செயலப்பாட்டு வடிவின் தடைப்பொருளை இயல்பான தமிழ் சட்ட நடையில் தருகிறது.
- source_word: וּבַעַל הַשּׁוֹר
  choice: ஆனால் மாட்டின் உரிமையாளர்
  rationale: בעל என்பது இங்கு சட்டபூர்வ உரிமையாளரைக் குறிக்கிறது; முன் கூறிய மாட்டுக்கான தண்டனையுடன் உரிமையாளரின் நிலையை வேறுபடுத்த ‘ஆனால்’ இயல்பாக உள்ளது.
- source_word: נָקִי
  choice: பொறுப்பிலிருந்து விடுபட்டவர்
  rationale: இந்தச் சட்ட வழக்கில் உரிமையாளருக்கு தண்டனை அல்லது சட்டப் பொறுப்பு இல்லை என்ற பரந்த பொருளைத் தருகிறது; இதை வெறும் ஒழுக்கக் குற்றமின்மையாகக் குறுக்கவில்லை.
theological_decisions:
- issue: இறுதி உட்கூற்றில் மாட்டின் உரிமையாளருடைய சட்ட நிலை
  choice: இந்த வழக்கில் உரிமையாளர் பொறுப்பிலிருந்து விடுபட்டவர்.
  alternative: உரிமையாளர் குற்றமற்றவர்; அல்லது தண்டனைக்கு உட்படாதவர்.
  rationale: அடுத்த வசனங்களில் அலட்சியம் பற்றிய விதிவிலக்கு வருவதற்கு முன், இவ்வசனம் அடிப்படை வழக்கில் மாட்டுக்குத் தண்டனை விதித்து உரிமையாளரை விடுவிக்கிறது. נָקִי என்பதன் பரந்த சட்டப் பொருளை ஒழுக்க, குடியியல் அல்லது மரணதண்டனைப் பொறுப்பு என்று தேவையின்றி வரையறுக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான சட்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்பது ஆண் அல்லது பெண் என இருவரையும் குறிக்கும் மரியாதை ஒருமை. ‘கல்லெறிந்து கொல்லவேண்டும்’ என்பது மூலத்தின் வலியுறுத்தப்பட்ட கட்டாயத்தை இயல்பாக வெளிப்படுத்துகிறது.
