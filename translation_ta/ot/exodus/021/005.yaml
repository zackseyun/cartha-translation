  text: But if the servant plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
translation:
  language: ta
  text: ஆனால் அந்த அடிமை, “என் எஜமானையும் என் மனைவியையும் என் பிள்ளைகளையும்[b] நான் நேசிக்கிறேன்; நான் சுதந்திரனாக வெளியேற மாட்டேன்” என்று உறுதியாகக் கூறினால்[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திட்டவட்டமாகக் கூறினால்” / “நிச்சயமாகக் கூறினால்”; எபிரெயத்தில் ஒரே வினைச்சொல் சிறப்பு வலியுறுத்தலுக்காக இருமுறை பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் மகன்களையும்”; எபிரெயச் சொல் ஆண்பால் பன்மையில் உள்ளது. ஆனால் இந்தக் குடும்பச் சூழலில் அது பிள்ளைகளைப் பொதுவாகவும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் ... சொன்னால்
  rationale: முந்தைய சட்டநிலைக்கு மாறான நிபந்தனையை அறிமுகப்படுத்துவதால், சூழலிலுள்ள எதிர்மறைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָמֹר יֹאמַר
  choice: உறுதியாகச் சொன்னால்
  rationale: வினையெச்சப் பெயருடன் வினைச்சொல் மீண்டும் வருவது கூற்றின் வலியுறுத்தலையும் திட்டவட்டத்தையும் குறிக்கிறது; ‘உறுதியாக’ என்பது அதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָעֶבֶד
  choice: அந்த அடிமை
  rationale: இங்கு ஒருவரின் கட்டுப்பட்ட பணிநிலையும் அவர் விடுதலை பெறுவதும் சட்டத்தின் மையமாக இருப்பதால், ‘அடிமை’ அந்த நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: אָהַבְתִּי
  choice: நான் நேசிக்கிறேன்
  rationale: எபிரெய நிறைவுவினை இங்கு பேசுபவரின் தற்போது நிலைத்திருக்கும் அன்பையும் பற்றுறுதியையும் வெளிப்படுத்துகிறது; தமிழ் நிகழ்காலம் இயல்பாக உள்ளது.
- source_word: אֲדֹנִי
  choice: என் எஜமான்
  rationale: வீட்டுச் சட்டச் சூழலில் அடிமைமீது அதிகாரம் கொண்டவரைக் குறிக்க, ‘எஜமான்’ இயல்பாகவும் உறவுநிலையைத் தெளிவாகவும் காட்டுகிறது.
- source_word: אִשְׁתִּי
  choice: என் மனைவி
  rationale: மூலத்தின் நேரடியான உடைமைத் தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: בָּנָי
  choice: என் பிள்ளைகள்
  rationale: வடிவியல் அடிப்படையில் ‘என் மகன்கள்’ என்றாலும், குடும்பச் சூழலில் இது பிள்ளைகளைப் பொதுவாகக் குறிக்கக்கூடும்; அந்த உண்மையான சாத்தியத்தை அடிக்குறிப்புடன் தருகிறது.
- source_word: לֹא אֵצֵא
  choice: நான் ... வெளியே போகமாட்டேன்
  rationale: பணிநிலையிலிருந்து வெளியேறுவதைக் குறிக்கும் எபிரெய மொழிநடையை தமிழில் புரியத்தக்க வகையில் பாதுகாக்கிறது.
- source_word: חָפְשִׁי
  choice: விடுதலையாக
  rationale: அவன் வெளியே செல்லும்போது இருக்கும் சுதந்திர நிலையை இது குறிக்கிறது; சட்டச் சூழலில் ‘விடுதலையாக’ தெளிவாக உள்ளது.
theological_decisions:
- issue: இஸ்ரவேலரின் அடிமைப்பணி சட்டத்தில் עבד என்பதன் மொழிபெயர்ப்பு
  choice: அடிமை
  alternative: வேலைக்காரன் / பணியாள்
  rationale: இந்த வசனம் கட்டுப்பட்ட பணிநிலையிலிருந்து விடுதலை பெறுவதையும் அந்த விடுதலையைத் துறப்பதையும் பற்றியது. எனவே பிணைக்கப்பட்ட நிலை மையமானது; அதை மென்மையாக்காமல் ‘அடிமை’ என்று மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்டப்பகுதிக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அடிமை’ என்பது வரலாற்றுச் சட்டநிலையை மறைக்காமல் கூறுகிறது; நேரடிப் பேச்சு இயல்பாகவும் வலியுறுத்தல் அடிக்குறிப்புடன் வெளிப்படையாகவும் உள்ளது.
