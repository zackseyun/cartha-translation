    text: எபிரெய மொழியில், “படுக்கையில் விழுந்தால்” என்று நேரடியாக உள்ளது; அதாவது, காயத்தால் படுக்கையில் கிடக்க வேண்டிய நிலை ஏற்பட்டால்.
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s accurate legal and interpersonal sense while avoiding an unnecessarily strong explanation of the Hebrew idiom. The footnote now explains ‘falls to bed’ as being laid up by injury, without asserting complete immobility.
