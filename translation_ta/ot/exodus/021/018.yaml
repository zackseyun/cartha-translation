translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட நிகழ்வுக்குரிய கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தில் ஆண்பால் பன்மை இருப்பதால் ‘ஆண்கள்’ எனக் காக்கப்பட்டது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘படுக்கையிலேயே கிடக்க நேரிட்டால்’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டது.
