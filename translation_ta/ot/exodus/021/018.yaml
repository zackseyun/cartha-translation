  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: ta
  text: ஆண்கள் தகராறு செய்துகொள்ளும்போது, ஒருவன் மற்றவனைக் கல்லாலோ கைமுட்டியாலோ அடித்து, அடிபட்டவன் சாகாமல் படுக்கையில் கிடக்க நேரிட்டால்[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “படுக்கையில் விழுந்தால்” என்று நேரடியாக உள்ளது; அதாவது, காயத்தால் படுக்கையில் கிடக்க வேண்டிய நிலை ஏற்பட்டால்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: செய்துகொள்ளும்போது
  rationale: இது ஒரு நிபந்தனைச் சட்ட நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் தொடரும் நிபந்தனை வாக்கியத்துடன் இயல்பாக அமைய ‘செய்துகொள்ளும்போது’ பயன்படுத்தப்பட்டது.
- source_word: יְרִיבֻן אֲנָשִׁים
  choice: ஆண்கள் தகராறு செய்துகொள்ளும்போது
  rationale: ריב என்பது வாக்குவாதம் அல்லது தகராறைக் குறிக்கிறது; அடுத்து வன்முறை நிகழ்ந்தாலும், இதையே முழுமையான சண்டை என மிகைப்படுத்தாமல் ‘தகராறு’ என மொழிபெயர்க்கப்பட்டது. אֲנָשִׁים என்பதன் ஆண்பால் பன்மையும் காக்கப்பட்டது.
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: ஒருவன் மற்றவனை அடித்து
  rationale: ஒரு தரப்பினர் மற்றவரை அடிப்பதை இயல்பான தமிழில் தெளிவாகக் கூறுகிறது. இச்சட்டச் சூழலில் רֵעַ என்பது மற்ற நபரைக் குறிக்கிறது.
- source_word: בְּאֶבֶן אוֹ בְאֶגְרֹף
  choice: கல்லாலோ கைமுட்டியாலோ
  rationale: கருவியைக் குறிக்கும் בְּ என்பதற்கு ‘-ஆல்’ பயன்படுத்தப்பட்டது. אֶגְרֹף என்பதன் நேரடிப் பொருளான ‘fist’ என்பதற்கு பொதுவாகப் புரியும் ‘கைமுட்டி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְלֹא יָמוּת
  choice: அடிபட்டவன் சாகாமல்
  rationale: எபிரெய உரையில் உள்ள பிரதிப்பெயரின் குறிப்பை தமிழில் குழப்பமின்றி உணர்த்த ‘அடிபட்டவன்’ என வெளிப்படையாகக் கூறப்பட்டது.
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: படுக்கையிலேயே கிடக்க நேரிட்டால்
  rationale: நேரடியாக ‘படுக்கையில் விழுதல்’ என்றாலும், காயத்தால் படுக்கையை விட்டு எழ முடியாத நிலையே இங்கு குறிக்கப்படுகிறது. அந்தப் பொருளை இயல்பான நவீன தமிழில் அளிக்கிறது.
