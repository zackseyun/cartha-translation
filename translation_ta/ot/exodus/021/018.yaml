- from: ஆண்கள் தகராறு செய்துகொள்ளும்போது, ஒருவன் மற்றவனைக் கல்லாலோ கைமுட்டியாலோ அடித்து, அடிபட்டவன் சாகாமல் படுக்கையிலேயே கிடக்க நேரிட்டால்[a],
