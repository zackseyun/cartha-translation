base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: ta
  text: ஆண்கள் ஒருவரோடு ஒருவர் சண்டையிடும்போது, அவர்கள் கர்ப்பிணியான ஒரு பெண்ணைத் தாக்கி, அதனால் அவளுடைய பிள்ளைகள் வெளியே வந்தால்[a], கேடு எதுவும் ஏற்படாவிட்டால்[b], அவன் நிச்சயமாக அபராதம் செலுத்த வேண்டும்; அந்தப் பெண்ணின் கணவன் அவன்மேல் விதிப்பதற்கேற்பவும், நீதிபதிகளின் தீர்ப்பின்படியும்[c] அவன் செலுத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, ‘அவளுடைய பிள்ளைகள் வெளியே வருகிறார்கள்.’ இது காலத்துக்கு முந்திய பிரசவத்தைக் குறிக்கலாம்; சில மொழிபெயர்ப்புகள் இதை ‘அவள் குறைப்பிரசவம் அடையும்படி’ என்று தருகின்றன; சிலர் இதைக் கருச்சிதைவு என்று புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தீங்கு.’ ‘கேடு’ என்பது தாய்க்கு ஏற்பட்டதா, பிள்ளைக்கு ஏற்பட்டதா, அல்லது இருவரில் எவருக்காவது ஏற்பட்டதா என்பதை இந்த வசனம் மட்டும் வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘நீதிமன்றத் தீர்ப்பின்படி’ / ‘நீதிமன்றத்தின் முன்னிலையில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: '...போது'
  rationale: எபிரெய வழக்குச் சட்டத்தில் ஒரு நிகழ்வை முன்வைக்கும் அமைப்பு; நவீன தமிழில் ‘...போது’ இயல்பாக உள்ளது.
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: ஆண்கள் ஒருவரோடு ஒருவர் சண்டையிடும்போது
  rationale: אֲנָשִׁים என்பதன் ஆண்பால் பன்மையையும், נצה என்பதன் உடல் மோதல் சார்ந்த பொருளையும் காக்கிறது.
- source_word: וְנָגְפוּ
  choice: தாக்கி
  rationale: உடல்மீது அடிபடச் செய்வதைக் குறிக்கிறது; காயத்தின் அளவை முன்கூட்டியே தீர்மானிக்கவில்லை.
- source_word: אִשָּׁה הָרָה
  choice: கர்ப்பிணியான ஒரு பெண்
  rationale: தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: அவளுடைய பிள்ளைகள் வெளியே வந்துவிட்டாலும்
  rationale: ‘அவளுடைய பிள்ளைகள் வெளியே வருதல்’ என்ற எபிரெயச் சொல்லமைப்பை நெருக்கமாகக் காத்து, குறைப்பிரசவமா கருச்சிதைவா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: אָסוֹן
  choice: கேடு
  rationale: கடுமையான தீங்கு, காயம் அல்லது உயிரிழப்பு ஆகிய சாத்தியங்களைச் சுருக்காமல் பொதுவாகக் குறிக்கிறது.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: அபராதமாகச் செலுத்த வேண்டும்
  rationale: வினையெச்ச முழுமை அமைப்பின் வலியுறுத்தலை சட்டரீதியான கட்டாயமாக வெளிப்படுத்துகிறது; பின்வரும் பணம் செலுத்தும் சூழலோடு பொருந்துகிறது.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  choice: அந்தப் பெண்ணின் கணவன் அவன்மேல் விதிக்கும் தொகை
  rationale: தண்டத் தொகையை கணவன் விதிக்கும்/கோருகின்ற சட்டச் சூழலை இயல்பான தமிழில் தருகிறது.
- source_word: וְנָתַן בִּפְלִלִים
  choice: நீதிபதிகளின் தீர்ப்பின்படி அவன் அதைச் செலுத்த வேண்டும்
  rationale: பணம் செலுத்துதலையும் நீதித்துறை மதிப்பீட்டையும் வெளிப்படுத்துகிறது; சொல்லின் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: கர்ப்பிணிப் பெண்ணையும் அவளுடைய பிள்ளைகளையும் பற்றிய சேதச் சட்டத்தின் பொருள்
  choice: ‘அவளுடைய பிள்ளைகள் வெளியே வந்துவிட்டாலும்’ என்றும் ‘கேடு’ என்றும் மொழிபெயர்த்து, கருச்சிதைவா குறைப்பிரசவமா என்பதையும் கேடு யாருக்கு ஏற்பட்டது என்பதையும் மூலவசனம் குறிப்பிடுவதைவிடத் தெளிவுபடுத்தாமல் விடுதல்.
  alternative: ‘அவளுக்குக் கருச்சிதைவு ஏற்பட்டால்’ என்று மொழிபெயர்த்தல்; அல்லது கேடு தாய்க்கு மட்டுமே / தாய்க்கோ பிள்ளைக்கோ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: எபிரெய மூலத்தின் தெளிவின்மையையும் அதன் இறையியல் மற்றும் ஒழுக்கவியல் பதற்றத்தையும் காக்கிறது; ஒரு கோட்பாட்டு முடிவை மொழிபெயர்ப்புக்குள் புகுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவசனத்திற்கேற்ற கண்ணியமான ஆனால் பொதுமக்களுக்கு எளிதில் புரியும் நடை. ‘பிள்ளைகள் வெளியே வருதல்’ என்ற சற்றே அசாதாரணமான சொல்லமைப்பு மூலத்தின் உண்மையான தெளிவின்மையைத் திட்டமிட்டு காக்கிறது; அடிக்குறிப்பு குறியீடுகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
