id: EXO.21.23
reference: Exodus 21:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִם אָס֖וֹן יִהְיֶ֑ה וְ/נָתַתָּ֥ה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/023.yaml
  text: But if there is harm[a], then you shall give life for life.
translation:
  language: ta
  text: ஆனால் தீங்கு நேரிட்டால்[a], உயிருக்குப் பதிலாக உயிரைக் கொடுக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடுமையான காயம்’ அல்லது ‘உயிரிழப்பு’. எபிரெயச் சொல் கடுமையான தீங்கு அல்லது பேரிடரைக் குறிக்கலாம்; இச்சூழலில் அது பொதுவான தீங்கைக் குறிக்கிறதா அல்லது குறிப்பாக மரணத்தைக் குறிக்கிறதா என்பதில் விளக்கங்கள் வேறுபடுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: ஆனால் … நேரிட்டால்
  rationale: முந்தைய வசனத்தின் நிலைக்கு மாறான நிபந்தனையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָסוֹן
  choice: கேடு
  rationale: இந்தச் சூழலில் கடுமையான தீங்கு அல்லது மரணம் எனக் குறுகலாக முடிவுசெய்யாமல், எபிரெயச் சொல்லின் பரந்த பொருளையும் தெளிவின்மையையும் காக்கிறது.
- source_word: יִהְיֶה
  choice: நேரிட்டால்
  rationale: ‘ஏற்பட்டால்’ என்ற இருப்பு/நிகழ்வு பொருளைச் சட்டச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וְנָתַתָּה
  choice: கொடுக்க வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு’ என்பதைப் பேணுகிறது; ‘இழப்பீடு செலுத்து’ என்று பணத் தண்டனையாக மட்டும் குறுக்கவில்லை.
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: இந்தச் சட்டச் சூத்திரத்தில் ‘ஆத்துமா’ என்பதல்ல, உயிர் என்பதே பொருத்தமான பொருள்.
- source_word: תַּחַת
  choice: -க்கு
  rationale: பதிலீடு அல்லது சமமான ஈடு என்ற உறவை ‘உயிருக்கு உயிர்’ என்னும் சுருக்கமான தமிழ் அமைப்பில் தெரிவிக்கிறது.
- source_word: נָפֶשׁ
  choice: உயிர்
  rationale: எபிரெயச் சொல் மீண்டும் வருவதையும் சட்டச் சொற்றொடரின் சமச்சீரையும் பேணுகிறது.
theological_decisions:
- issue: אָסוֹן குறிக்கும் கேட்டின் தன்மை மற்றும் யாருக்கு அது நேரிடுகிறது என்பது
  choice: ‘கேடு’ என்று பரந்த பொருளில் மொழிபெயர்த்து, அது பொதுவான தீங்கா, கடுமையான காயமா, மரணமா என்பதையும், யாருக்கு நேரிடுகிறது என்பதையும் முதன்மை உரையில் குறிப்பிட்டு முடிவுசெய்யவில்லை.
  alternative: ‘கடுமையான காயம்’ அல்லது ‘மரணம்’ என்று மொழிபெயர்த்தல்.
  rationale: இந்த வசனம் אָסוֹן என்பதன் தீவிரத்தையோ அதன் குறிப்பிட்ட நபரையோ வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே விவாதத்திற்குரிய விளக்கத்தை மொழிபெயர்ப்பில் திணிக்காமல் மூலத்தின் தெளிவின்மையும் இறையியல் பதற்றமும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத் தமிழில் சுருக்கமான, கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘உயிருக்கு உயிர்’ என்ற சமச்சீர் அமைப்பு மூலத்தின் வலிமையையும் நினைவில் நிற்கும் தன்மையையும் காக்கிறது.
