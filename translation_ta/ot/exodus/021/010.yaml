id: EXO.21.10
reference: Exodus 21:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אִם אַחֶ֖רֶת יִֽקַּֽח ל֑/וֹ שְׁאֵרָ֛/הּ כְּסוּתָ֥/הּ וְ/עֹנָתָ֖/הּ לֹ֥א יִגְרָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/010.yaml
  text: If he takes another wife for himself[a], he shall not diminish her food, her clothing, or her marital rights.
translation:
  language: ta
  text: அவன் தனக்காக வேறொரு மனைவியை எடுத்துக்கொண்டால், இவளுக்குரிய உணவையும் உடையையும் தாம்பத்திய உறவுக்கான உரிமையையும்[a] அவன் குறைக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாம்பத்திய உரிமை” என்றும் மொழிபெயர்க்கலாம். அரிதான எபிரெயச் சொல்லான இது, கணவன் நிறைவேற்ற வேண்டிய திருமண நெருக்கம் சார்ந்த கடமையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: எடுத்துக்கொண்டால்
  rationale: வழக்குச் சட்டத்தின் நிபந்தனை அமைப்பைத் தமிழில் இயல்பான ‘-ஆல்’ வடிவில் காக்கிறது.
- source_word: אַחֶרֶת
  choice: வேறொரு மனைவியை
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘வேறொருத்தி’; திருமணக் கடமைகள் குறித்த இந்தச் சட்டச் சூழலில் ‘மனைவி’ என்பதை வெளிப்படுத்துவது பொருளைத் தெளிவாக்குகிறது.
- source_word: יִקַּח לוֹ
  choice: தனக்காக ... எடுத்துக்கொண்டால்
  rationale: לקח என்பதன் ‘எடுத்துக்கொள்’ என்ற வடிவத்தையும் לוֹ என்பதன் ‘தனக்காக’ என்ற கூறையும் காக்கிறது; இச்சூழலில் மனைவியாக எடுத்துக்கொள்வதைக் குறிக்கிறது.
- source_word: שְׁאֵרָהּ
  choice: இவளுக்குரிய உணவு
  rationale: சிக்கலான இச்சொல் இங்குள்ள மூன்று திருமணக் கடமைகளின் பட்டியலில் வாழ்வாதார உணவைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது. ‘உணவு’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: כְּסוּתָהּ
  choice: இவளுக்குரிய உடை
  rationale: ‘மூடுதல்/உடை’ என்ற பொருள்களில், சட்டச் சூழலுக்கு ‘உடை’ இயல்பாகப் பொருந்துகிறது.
- source_word: וְעֹנָתָהּ
  choice: தாம்பத்திய உறவுக்கான உரிமை
  rationale: அரிதான இச்சொல் கணவன் வழங்க வேண்டிய திருமண நெருக்கத்தைக் குறிக்கிறது. ‘தாம்பத்திய உறவுக்கான உரிமை’ என்பது தெளிவையும் கண்ணியத்தையும் காத்து, அதனை வெறும் பொதுவான திருமணச் சலுகையாக மங்கச் செய்யாது.
- source_word: לֹא יִגְרָע
  choice: குறைக்கக் கூடாது
  rationale: குறைத்தல் அல்லது தாழ்த்துதல் என்ற வினைப்பொருளைத் தமிழின் இயல்பான சட்டநடைத் தடைவடிவில் தருகிறது; பட்டியலிலுள்ள மூன்று கடமைகளுக்கும் பொருந்துகிறது.
theological_decisions:
- issue: וְעֹנָתָהּ என்ற அரிதான சொல்லின் பொருள்
  choice: தாம்பத்திய உறவுக்கான உரிமை
  alternative: திருமண உரிமை; உடலுறவு; அவளுக்குரிய காலம்
  rationale: சொல்லின் துல்லியமான சொற்பிறப்பும் நுண்பொருளும் விவாதத்திற்குரியவையாக இருந்தாலும், சூழல் திருமண நெருக்கம் சார்ந்த கணவனின் கடமையைச் சுட்டுகிறது. உரை அந்த உரிமையை வெளிப்படுத்துகிறது; அடிக்குறிப்பு மூலச்சொல்லின் அரிதான தன்மையையும் மாற்று மொழிபெயர்ப்பையும் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘இவளுக்குரிய’ என்பது முதல் மனைவியைக் தெளிவாகச் சுட்டுகிறது; ‘தாம்பத்திய உறவு’ என்பது மிகுந்த மறைபொருளோ அளவுக்கு மீறிய மருத்துவத் தொனியோ இல்லாமல் கருத்தைத் தெரிவிக்கிறது.
