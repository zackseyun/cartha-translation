  edition: WLC
  text: וַ/אֲשֶׁר֙ לֹ֣א צָדָ֔ה וְ/הָ/אֱלֹהִ֖ים אִנָּ֣ה לְ/יָד֑/וֹ וְ/שַׂמְתִּ֤י לְ/ךָ֙ מָק֔וֹם אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: ta
  text: ஆனால், அவன் பதுங்கியிருந்து கொல்லத் திட்டமிடாமல், அது அவன் கையால் நிகழும்படி கடவுள் செய்திருந்தால்[a], அவன் அங்கே தஞ்சம் அடைய ஓடிச் செல்லும்படி நான் உனக்கு ஓர் இடத்தை நியமிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மேலும் நேரடியான மொழிபெயர்ப்பு: “கடவுள் அதை அவன் கைக்கு நேரிடச் செய்திருந்தால்.” முன்திட்டமிட்ட நோக்கமின்றி, அந்த மனிதனின் செயலின் வழியாக இது நிகழ்ந்ததை எபிரெயச் சொற்றொடர் குறிப்பிடுகிறது.'
    reason: எபிரெய மொழிவழக்கின் நேரடியான வடிவத்தையும், தெய்வீகச் செயல்பாடு மற்றும் மனிதச் செயற்பாடு ஆகிய இரண்டையும் அது ஒருங்கே வெளிப்படுத்துவதையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: ஆனால், ... செய்திருந்தால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட திட்டமிட்ட கொலைக்கு மாறான நிபந்தனைச் சூழலை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
- source_word: לֹא צָדָה
  choice: பதுங்கியிருந்து கொல்லத் திட்டமிடாமல்
  rationale: צדה என்ற வினை இச்சட்டச் சூழலில் வேட்டையாடுவதை அல்ல, பதுங்கியிருந்து முன்திட்டமிட்டுக் கொல்வதைக் குறிக்கிறது. தமிழ் வாசகருக்கு அந்தச் சட்ட வேறுபாட்டைத் தெளிவாக்குகிறது.
- source_word: וְהָאֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு אֱלֹהִים என்பது நீதிபதிகளைவிட, முன்திட்டமிடப்படாத நிகழ்வில் தெய்வீகச் செயல்பாட்டைக் குறிப்பிடுவது சூழலுக்கு ஏற்றது.
- source_word: אִנָּה לְיָדוֹ
  choice: அது அவன் கையால் நிகழும்படி ... செய்திருந்தால்
  rationale: எபிரெயச் சொற்றொடரில் உள்ள தெய்வீகக் காரணத்தையும் மனிதன் கருவியாகச் செயல்பட்டதையும் இயல்பான தமிழில் காக்கிறது; திட்டமிட்ட நோக்கத்தை அதில் சேர்ப்பதில்லை.
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: நான் உனக்கு ஓர் இடத்தை நியமிப்பேன்
  rationale: அங்கீகரிக்கப்பட்ட அடைக்கல இடத்தை ஏற்படுத்துவதைச் சட்டநடைக்கு ஏற்ற, புரியத்தக்க தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: அவன் தப்பியோடுவதற்கு
  rationale: יָנוּס என்பதன் அடைக்கலம் தேடி ஓடும் பொருளையும், அந்த இடம் வழங்கப்படும் நோக்கத்தையும் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: தற்செயலான கொலையில் கடவுளின் செயல்பாடு
  choice: அது அவன் கையால் நிகழும்படி கடவுள் செய்திருந்தால்
  alternative: கடவுள் அதை அவன் கைக்கு நேரிடச் செய்திருந்தால்
  rationale: கொலை முன்திட்டமிடப்படாதது என்றாலும் அது கடவுளின் ஆளுகைக்கு வெளியே நிகழவில்லை என்ற மூல உரையின் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது. அதேவேளையில், மனிதன் கொலை செய்ய வேண்டும் என்ற ஒழுக்க நோக்கத்தை கடவுளுக்கு உரித்தாக்குவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், சட்ட உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “பதுங்கியிருந்து கொல்லத் திட்டமிடாமல்” என்பது முன்திட்டமின்மையைத் தெளிவாக்குகிறது; “அவன் கையால் நிகழும்படி” என்பது மூலத்தின் மனிதச் செயற்பாடு–தெய்வீக ஆளுகை என்ற இருமையைப் பாதுகாக்கிறது.
