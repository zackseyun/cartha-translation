translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதியின் சுருக்கத்தையும் கண்ணியத்தையும் காக்கும் நடை. ‘அறுத்துவிட்டாலோ ... விற்றுவிட்டாலோ’ என்பது நிபந்தனைச் சட்ட அமைப்பை இயல்பாக வெளிப்படுத்துகிறது; தொழில்நுட்பச் சட்ட மொழி அளவுக்கு மீறாமல் தவிர்க்கப்பட்டுள்ளது.
