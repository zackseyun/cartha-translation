base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: ta
  text: ஒருவன் ஒரு மாட்டையோ செம்மறியாட்டையோ[a] திருடி, அதை அறுத்துவிட்டாலோ விற்றுவிட்டாலோ, அந்த மாட்டுக்குப் பதிலாக ஐந்து மாடுகளையும் அந்தச் செம்மறியாட்டுக்குப் பதிலாக நான்கு செம்மறியாடுகளையும் ஈடாகக் கொடுக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் செம்மறியாடு அல்லது வெள்ளாடு உட்பட ஒரு சிறு கால்நடையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இழப்பீடு செலுத்த வேண்டும்.” எபிரெய வினைச்சொல் சட்டரீதியான ஈடுசெய்தலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִגְנֹב אִישׁ
  choice: ஒருவன் ... திருடி
  rationale: நிபந்தனை வழக்கைத் தொடங்கும் எபிரெய சட்ட அமைப்பைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; ஆண்பால் ஒருமை வடிவமும் காக்கப்படுகிறது.
- source_word: שׁוֹר
  choice: மாடு
  rationale: சட்டப் பின்னணியில் வரும் பெரிய கால்நடையைச் சுட்டும் பொதுவான, இன்றைய தமிழருக்கு இயல்பான சொல்; விலங்கின் பாலினத்தைத் தேவையின்றிக் குறுக்கவில்லை.
- source_word: שֶׂה
  choice: செம்மறியாடு
  rationale: இச்சொல் செம்மறியாடு அல்லது வெள்ளாடு உள்ளிட்ட சிறு கால்நடையைக் குறிக்கக்கூடும்; இங்கு பின்னர் வரும் צֹאן உடன் வாசக ஒத்திசைவுக்காக செம்மறியாடு தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּטְבָחוֹ
  choice: அதை அறுத்துவிட்டாலோ
  rationale: טבח என்பது பொதுவாகக் கொல்வதைவிட, கால்நடையை அறுப்பதைத் துல்லியமாகக் குறிக்கிறது.
- source_word: אוֹ מְכָרוֹ
  choice: விற்றுவிட்டாலோ
  rationale: மாற்றான நிபந்தனையைத் தமிழின் ‘-ஆலோ ... -ஆலோ’ அமைப்பில் இயல்பாகக் காட்டுகிறது.
- source_word: חֲמִשָּׁה בָקָר
  choice: ஐந்து மாடுகள்
  rationale: בקר என்பது மாட்டினத்தைக் குறிக்கும் தொகுப்புப்பெயர்; எண்ணிக்கையுடன் தமிழில் ‘மாடுகள்’ என்பது தெளிவும் இயல்பும் உடையது.
- source_word: יְשַׁלֵּם
  choice: ஈடாகக் கொடுக்க வேண்டும்
  rationale: சட்டச் சூழலில் שלם குறிக்கும் இழப்பீடு அல்லது பதிலீட்டின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: மாற்றீடு அல்லது பதிலீடு என்ற எபிரெயப் பொருளை நேரடியாகக் காக்கிறது.
- source_word: וְאַרְבַּע צֹאן
  choice: நான்கு செம்மறியாடுகள்
  rationale: צֹאן பரந்த வகையில் சிறு கால்நடைகளைக் குறித்தாலும், இவ்வசனத்தில் தேர்ந்தெடுக்கப்பட்ட ‘செம்மறியாடு’ என்பதுடன் தெளிவான ஒத்திசைவை அளிக்கிறது.
