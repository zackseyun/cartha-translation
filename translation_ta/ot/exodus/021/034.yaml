translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட விதியின் கட்டாயத் தன்மையை ‘வேண்டும்’ மூலம் வெளிப்படுத்தி, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தேவையற்ற சொல்லடியான ‘வெள்ளி’ என்பதற்குப் பதில் சூழலுக்கேற்ற ‘பணம்’ பயன்படுத்தப்பட்டுள்ளது.
