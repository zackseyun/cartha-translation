- from: குழியின் உரிமையாளர் இழப்பீடு கொடுக்க வேண்டும்; விலங்கின் உரிமையாளருக்கு பணம் செலுத்த வேண்டும்; செத்த விலங்கு அவருக்குரியதாகும்.
  to: குழியின் உரிமையாளர் இழப்பீடு வழங்க வேண்டும்; அவர் விலங்கின் உரிமையாளருக்குப் பணம் செலுத்த வேண்டும்; இறந்த விலங்கு குழியின் உரிமையாளருக்கே உரியதாகும்.
