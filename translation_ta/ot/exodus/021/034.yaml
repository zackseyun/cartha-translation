source:
  edition: WLC
  text: בַּ֤עַל הַ/בּוֹר֙ יְשַׁלֵּ֔ם כֶּ֖סֶף יָשִׁ֣יב לִ/בְעָלָ֑י/ו וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: ta
  text: குழியின் உரிமையாளர் இழப்பீடு வழங்க வேண்டும்; அவர் விலங்கின் உரிமையாளருக்குப் பணம் செலுத்த வேண்டும்; இறந்த விலங்கு குழியின் உரிமையாளருக்கே உரியதாகும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: குழியின் உரிமையாளர்
  rationale: இந்தச் சட்டச் சூழலில் בַּעַל என்பது குழிக்குப் பொறுப்பான அல்லது அதை உடைமையாகக் கொண்டவரைக் குறிக்கிறது; הַבּוֹר என்பது கால்நடை விழக்கூடிய தோண்டப்பட்ட குழி.
- source_word: יְשַׁלֵּם
  choice: இழப்பீடு கொடுக்க வேண்டும்
  rationale: שׁלם என்பதன் பியேல் வடிவம் சட்டச் சூழலில் இழப்பை ஈடுசெய்வதைக் குறிக்கிறது. இத்தமிழாக்கம் வெறும் பணம் செலுத்துதல் என்பதைவிட அதன் சட்டப்பூர்வமான ஈட்டுத்தன்மையைத் தெளிவுபடுத்துகிறது.
- source_word: כֶּסֶף
  choice: பணம்
  rationale: சொல்லடியாக ‘வெள்ளி’ என்றாலும், இங்கு அது பணமாக வழங்கப்படும் ஈட்டுத்தொகையைக் குறிக்கிறது.
- source_word: יָשִׁיב לִבְעָלָיו
  choice: விலங்கின் உரிமையாளருக்கு பணம் செலுத்த வேண்டும்
  rationale: יָשִׁיב என்பதன் அடிப்படைப் பொருள் ‘திருப்பிக் கொடுப்பான்’; இங்கு இழந்த மதிப்பை உரிமையாளருக்கு ஈடுசெய்வதைக் குறிக்கிறது. பின்னொட்டின் குறிப்பு தெளிவாக இருக்க ‘விலங்கின்’ என்பது வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְהַמֵּת
  choice: செத்த விலங்கு
  rationale: எபிரெயச் சொற்றொடர் சொல்லடியாக ‘செத்தது’ என்று இருந்தாலும், முந்தைய வசனச் சூழலில் அது செத்த கால்நடையைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘விலங்கு’ சேர்க்கப்பட்டுள்ளது.
- source_word: יִהְיֶה לוֹ
  choice: அவருக்குரியதாகும்
  rationale: இது செத்த விலங்கின் உடைமை குழியின் உரிமையாளருக்குச் செல்லும் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
