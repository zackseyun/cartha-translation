  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: ta
  text: அல்லது, அந்த எருது முன்பே முட்டும் பழக்கமுடையது என்று அறியப்பட்டிருந்தும், அதன் உரிமையாளர் அதைக் கட்டுப்படுத்தி வைக்காமல் இருந்தால், அவர் எருதுக்கு எருதாகக் கட்டாயம் ஈடுசெய்ய வேண்டும்; செத்த எருது அவருக்குச் சொந்தமாகும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֣וֹ
  choice: அல்லது
  rationale: முந்தைய வசனத்திலுள்ள வழக்குக்கு மாற்றான சட்டநிலையை அறிமுகப்படுத்தும் பிரிநிலை இடைச்சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: נוֹדַע כִּי
  choice: …என்று அறியப்பட்டிருந்தும்
  rationale: செயப்பாட்டு/நிலைத்தன்மைப் பொருளை இயல்பான தமிழில் தருகிறது; உரிமையாளர் அதனை அறிந்திருந்தார் என்று மூலத்தில் இல்லாத குறிப்பைச் சேர்க்கவில்லை.
- source_word: שׁוֹר נַגָּח
  choice: முட்டும் பழக்கமுள்ள மாடு
  rationale: נגח இங்கு ஒருமுறை நிகழ்ந்த செயலை அல்ல, தொடர்ந்து காணப்பட்ட ஆபத்தான இயல்பைக் குறிக்கிறது. שור என்பதற்கு சட்டச் சூழலில் இயல்பான பொதுச் சொல்லாக ‘மாடு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: நேற்று முந்தாநாள் முதலே
  rationale: எபிரெய மொழிவழக்கின் காலப் படிமத்தைத் தக்கவைத்தபடியே, முன்பிருந்தே இந்தப் பழக்கம் காணப்பட்டது என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: அதைக் கட்டுப்படுத்தி வைக்கவில்லை
  rationale: שמר என்பதன் அடிப்படை காவல்/பாதுகாப்புப் பொருளை, தீங்கு செய்யாதபடி ஆபத்தான மாட்டை அடக்கி வைத்திருக்க வேண்டிய இச்சூழலுக்கு ஏற்றவாறு தருகிறது.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: கட்டாயம் ஈடுசெய்ய வேண்டும்
  rationale: வினைமுற்றுக்கு முன் வரும் வினையெச்சப் பெயரின் வலியுறுத்தலை ‘கட்டாயம்’ மூலம் வெளிப்படுத்தி, சட்டரீதியான இழப்பீட்டுப் பொருளைத் தெளிவாக்குகிறது.
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: மாட்டுக்கு மாடாக
  rationale: பதிலீடு மற்றும் சமமான ஈடு என்ற சட்டச் சூத்திரத்தைச் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: செத்த மாடு அவருக்குச் சொந்தமாகும்
  rationale: ‘செத்தது’ என்ற மூலத்தின் பெயரடைப் பயன்பாட்டைச் சூழலுக்கேற்ப ‘செத்த மாடு’ என்று தெளிவாக்கி, לו என்பதன் உடைமைப் பொருளைப் பாதுகாக்கிறது.
