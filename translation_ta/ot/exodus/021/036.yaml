translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டவிதிக்குரிய கண்ணியமும் வலியுறுத்தலும் காக்கப்பட்டுள்ளன. ‘முட்டும் பழக்கமுள்ள’, ‘கட்டுப்படுத்தி வைக்கவில்லை’, ‘ஈடுசெய்ய வேண்டும்’ ஆகிய சொற்றொடர்கள் சாதாரண வாசகர்களுக்குத் தெளிவாக இருக்குமாறு தேர்ந்தெடுக்கப்பட்டன; மூலத்தில் இல்லாத உரிமையாளரின் தனிப்பட்ட அறிவை உரையில் சேர்க்காமல் செயப்பாட்டு அமைப்பு பாதுகாக்கப்பட்டது.
