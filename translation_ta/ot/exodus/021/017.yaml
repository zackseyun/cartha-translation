  text: וּ/מְקַלֵּ֥ל אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: ta
  text: தன் தந்தையையோ தாயையையோ சபிப்பவன் நிச்சயமாகக் கொல்லப்பட வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “தன் தந்தையையும் தாயையும்” என்று உள்ளது; ஆனால் இந்தச் சட்ட அமைப்பில் தந்தை அல்லது தாய் ஆகியோரில் எவரையாவது சபிப்பதைக் குறிக்கும் பகிர்நிலைப் பொருள் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: சபிக்கிறவன்
  rationale: பியெல் வினையெச்சம் சட்டவழக்கில் ஒரு பொதுவான குற்றவாளி வகையைக் குறிக்கப் பெயர்ச்சொல்லாகச் செயல்படுகிறது. இங்கு קלל என்பது வெறுமனே இகழ்வதைவிட ஒருவருக்கு எதிராகச் சாபம் கூறுவதைத் தெளிவாகக் குறிக்கிறது.
- source_word: אָבִיו
  choice: தன் தகப்பனை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமைப்பின்னொட்டை, சட்டத்தின் பொதுவான ஒருமை எழுவாயுடன் இயல்பாக இணைக்கிறது. நவீனத் தமிழில் உறவுப்பெயருடன் ‘தன்’ பயன்படுத்துவது இயல்பானது.
- source_word: וְאִמּוֹ
  choice: தாயையோ
  rationale: וְ என்பது வடிவத்தில் ‘மற்றும்’ என்றாலும், இந்தச் சட்டச் சூழலில் தகப்பன் அல்லது தாய் ஆகிய இருவரில் எவரையாவது தனித்தனியாகச் சபிப்பதும் குற்றம் என்பதே பகிர்நிலைப் பொருள். தமிழின் ‘-ஓ ... -ஓ’ அமைப்பு அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: முற்றுப்பெறா வினைமுற்றும் செயப்பாட்டு வரையறை வினையும் சேர்ந்த இவ்வமைப்பு வலியுறுத்தப்பட்ட மரண தண்டனையை விதிக்கிறது. ‘கொல்லப்பட வேண்டும்’ என்பது இயல்பான மரணத்தை அல்ல, நீதிமுறைப்படி நிறைவேற்றப்படும் தண்டனையைச் சுட்டுகிறது; ‘நிச்சயமாக’ வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: பெற்றோர் இணைப்பின் சட்டப் பொருள்
  choice: தகப்பனையோ தாயையோ என்று பகிர்நிலையில் மொழிபெயர்த்தல்
  alternative: தகப்பனையும் தாயையும்
  rationale: எபிரெய இணைப்புச் சொல் நேரடியாக ‘மற்றும்’ என்றாலும், சட்டத்தின் நோக்கம் இரு பெற்றோரையும் ஒரே சமயத்தில் சபித்தால் மட்டுமே தண்டனை என்று வரையறுப்பதல்ல. ஒவ்வொரு பெற்றோரும் தனித்தனியாகப் பாதுகாக்கப்படுகிறார் என்ற பொருளைத் தமிழின் ‘-ஓ ... -ஓ’ அமைப்பு தெளிவாகக் காட்டுகிறது.
- issue: மரண தண்டனைச் சூத்திரத்தின் பொருள்
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  alternative: நிச்சயமாகச் சாவான்
  rationale: יוּמָת என்பது செயப்பாட்டு வடிவில் விதிக்கப்படும் தண்டனையைச் சுட்டுகிறது; வெறும் மரண நிகழ்வை அல்ல. எனவே நீதிமுறைத் தண்டனையின் வலிமையும் எபிரெய வலியுறுத்தலும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்களுக்கு புரியும் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘தகப்பன்’ வேதாகமச் சட்டச் சூழலுக்கேற்ற மரியாதையான சொல்; ‘சபிக்கிறவன்’ மூலத்தின் குறிப்பான குற்றச்செயலைக் காக்கிறது. வசனத்தில் உள்ள [a] குறிப்பு அடிக்குறிப்புடன் பொருந்துகிறது.
