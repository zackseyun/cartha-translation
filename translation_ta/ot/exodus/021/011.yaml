  text: And if he does not do these three things for her[a], then she shall go out free, without payment of money.
translation:
  language: ta
  text: அவன் இந்த மூன்றையும் அவளுக்குச் செய்யாவிட்டால்[a], அவள் விடுதலையாக வெளியேறுவாள்; அதற்காகப் பணம் எதுவும் செலுத்த வேண்டியதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் இந்த மூன்றையும் அவளுக்கு வழங்காவிட்டால்.” எபிரெயத்தில் சொற்சொல்லாக, “இந்த மூன்றையும் அவளுக்குச் செய்யாவிட்டால்” என்று உள்ளது. இது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட உணவு, உடை, மணவுறவுக்குரிய உரிமை ஆகியவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: அவன் ... செய்யாவிட்டால்
  rationale: முந்தைய சட்ட விதியின் தொடர்ச்சியான நிபந்தனையை இயல்பான தமிழ் நிபந்தனை வாக்கிய அமைப்பில் தருகிறது.
- source_word: שְׁלָשׁ אֵלֶּה
  choice: இந்த மூன்றையும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட உணவு, உடை, மணவுறவுக்குரிய உரிமை ஆகிய மூன்று கடமைகளைச் சுட்டுகிறது; இல்லாத பெயர்ச்சொல்லைச் சேர்க்காமல் எபிரெய வடிவை நெருக்கமாகப் பேணுகிறது.
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: அவளுக்குச் செய்யாவிட்டால்
  rationale: עשה என்பதன் பரந்த ‘செய்’ பொருளைப் பேணி, அந்த மூன்று கடமைகளையும் அவளுக்காக நிறைவேற்றாததைக் குறிக்கிறது.
- source_word: וְיָצְאָה
  choice: போகலாம்
  rationale: அடிமை நிலையிலிருந்து வெளியேறுவதைச் சூழல் காட்டுகிறது; அடுத்துள்ள ‘விடுதலையாகி’ என்பதுடன் சேர்ந்து இயல்பான தமிழாக அமைகிறது.
- source_word: חִנָּם
  choice: விடுதலையாகி
  rationale: இச்சட்டச் சூழலில் கட்டுப்பட்ட நிலையிலிருந்து இலவசமாக விடுவிக்கப்படுவதைத் தெளிவாகக் குறிக்கிறது.
- source_word: אֵין כָּסֶף
  choice: பணம் செலுத்தாமலேயே
  rationale: அவள் விடுதலை பெறுவதற்காக எந்தப் பணமும் கொடுக்க வேண்டியதில்லை என்ற சட்டப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
