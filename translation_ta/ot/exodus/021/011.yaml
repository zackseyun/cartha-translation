  source_fidelity: மூல எபிரெயத்தின் நிபந்தனை, முந்தைய வசனத்தைச் சுட்டும் “இந்த மூன்று,” அவளுக்காக அவற்றைச் செய்யாதிருத்தல், பணமின்றிய விடுதலை ஆகியவை சரியாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் “போகலாம்” அனுமதி/சாத்தியத் தொனியைத் தருகிறது; வினைச்சொல் சட்டரீதியான விளைவாகிய “விடுதலையாக வெளியேறுவாள்” என இருக்க வேண்டும். மேலும் “விடுதலையாகிப் போகலாம்” என்பதில் “விடுதலை” ஏற்கெனவே חנם-ஐ வெளிப்படுத்துவதால், “பணம் செலுத்தாமல்” என்பதையும் விடுதலையின் நிபந்தனையுடன் தெளிவாக இணைப்பது சிறந்தது.
