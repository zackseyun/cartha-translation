source:
  edition: WLC
  text: וְ/אִם שֵׁ֥ן עַבְדּ֛/וֹ אֽוֹ שֵׁ֥ן אֲמָת֖/וֹ יַפִּ֑יל לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת שִׁנּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: ta
  text: அவன் தன் ஆண் அடிமையின் பல்லையோ பெண் அடிமையின் பல்லையோ அடித்து விழச் செய்தால், அந்தப் பல்லுக்கு ஈடாக அந்த அடிமையை விடுதலை செய்து அனுப்ப வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய சட்டச் சூத்திரத்தில் இங்கு ஆண்பால் ஒருமைச் சுட்டுப்பெயர் பின்னொட்டு உள்ளது; ஆனால் இந்தச் சட்டம் ஆண் அடிமை அல்லது பெண் அடிமை ஆகிய இருவரில் பாதிக்கப்படுபவருக்கும் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: …செய்தால்
  rationale: முந்தைய சட்ட வழக்கின் தொடர்ச்சியாக வரும் நிபந்தனையைத் தமிழில் இயல்பான நிபந்தனை வாக்கிய அமைப்பில் தருகிறது.
- source_word: שֵׁן
  choice: பல்
  rationale: எபிரெய மூலத்திலுள்ள ஒருமை உடற்கூறுச் சொல்லை நேரடியாகப் பாதுகாக்கிறது.
- source_word: עַבְדּוֹ
  choice: தன் ஆண் அடிமை
  rationale: இந்த உடன்படிக்கைச் சட்டச் சூழலில் சட்டரீதியாகக் கட்டுண்ட நிலையைக் ‘அடிமை’ தெளிவாகக் காட்டுகிறது; அடுத்த பெண்பால் சொல்லுடனான வேறுபாட்டைக் காக்க ‘ஆண்’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲמָתוֹ
  choice: தன் பெண் அடிமை
  rationale: עבד என்பதன் பெண்பால் இணைச்சொல்லாகிய இதன் பாலின வேறுபாட்டையும் அடிமை நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: יַפִּיל
  choice: அடித்து விழச்செய்தால்
  rationale: נפל என்பதன் ஹிஃபில் வடிவம் பல்லை விழச் செய்தல் என்று பொருள்படும்; காயம் விளைவிக்கும் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: அவரை விடுதலை செய்து அனுப்ப வேண்டும்
  rationale: சட்டரீதியான கட்டாயத்தையும் அடிமை நிலையிலிருந்து விடுவித்து அனுப்புவதையும் இயல்பான, மரியாதையான நவீன தமிழில் தருகிறது.
- source_word: תַּחַת שִׁנּוֹ
  choice: அந்தப் பல்லுக்கு ஈடாக
  rationale: תחת இங்கு காயத்திற்கான ஈடு அல்லது பதிலீட்டைக் குறிக்கிறது; ‘அந்தப் பல்’ பாதிக்கப்பட்ட அடிமையின் பல்லைக் குறிக்கும் வகையில் பாலினச் சிக்கலைத் தவிர்க்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சட்டத்தில் அடிமைத்தனச் சொற்களை மொழிபெயர்த்தல்
  choice: ஆண் அடிமை / பெண் அடிமை
  alternative: வேலைக்காரன் / வேலைக்காரி
  rationale: இவ்வசனம் சட்டரீதியாகக் கட்டுண்டவருக்கான காய ஈட்டையும் விடுதலையையும் பற்றியது. எனவே சமூக-சட்ட உண்மையை மறைக்காத ‘அடிமை’ என்பது ‘வேலைக்காரர்’ என்பதைக் காட்டிலும் துல்லியமானது.
- issue: יְשַׁלְּחֶנּוּ என்ற ஆண்பால் ஒருமை பின்னொட்டின் பயன்பாடு
  choice: பாலினப் பொதுமையை உணர்த்தும் ‘அவரை’
  alternative: ‘அவனை’ என்று எபிரெய இலக்கண வடிவை நேரடியாகப் பின்பற்றுதல்
  rationale: நிபந்தனையில் ஆண், பெண் அடிமைகள் இருவரும் வெளிப்படையாகக் குறிப்பிடப்படுகின்றனர்; சட்ட முடிவிலுள்ள எபிரெய ஆண்பால் ஒருமை பின்னொட்டு பொதுவான சட்டச் சூத்திரமாக அமைகிறது. தமிழில் ‘அவரை’ இருவரில் பாதிக்கப்பட்ட எவருக்கும் பொருந்துவதை இயல்பாகக் காட்டுகிறது; மூல இலக்கண வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டத் தொனியையும் கண்ணியத்தையும் காக்கும் தெளிவான நடை. அடிமைத்தனத்தின் சமூக உண்மையை மென்மைப்படுத்தாமல், பாலினப் பயன்பாட்டின் மூலமொழித் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
