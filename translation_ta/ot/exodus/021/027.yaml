revisions:
- from: அவன் தன் ஆண் அடிமையின் பல்லையோ பெண் அடிமையின் பல்லையோ அடித்து விழச்செய்தால், அந்தப் பல்லுக்கு ஈடாக அவரை விடுதலை செய்து அனுப்ப வேண்டும்.[a]
  to: அவன் தன் ஆண் அடிமையின் பல்லையோ பெண் அடிமையின் பல்லையோ அடித்து விழச் செய்தால், அந்தப் பல்லுக்கு ஈடாக அந்த அடிமையை விடுதலை செய்து அனுப்ப வேண்டும்.[a]
  rationale: The revision replaces the potentially honorific or plural-sounding அவரை with அந்த அடிமையை. This makes the legal result explicitly applicable to whichever of the two named slaves has been injured, while preserving the source-language masculine-singular detail in the footnote. The remaining wording is retained because it is faithful, natural, and appropriately legal in register.
