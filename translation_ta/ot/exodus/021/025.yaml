translation:
  language: ta
  text: தீக்காயத்துக்குத் தீக்காயம், காயத்துக்குக் காயம், அடிக்காயத்துக்கு அடிக்காயம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அடிவரிக்கு அடிவரி.” எபிரெயச் சொல் அடியால் ஏற்படும் வரி அல்லது தடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּוִיָּה
  choice: தீக்காயம்
  rationale: எரிதலால் ஏற்பட்ட காயத்தையோ அதன் தடத்தையோ குறிக்கும் பெயர்ச்சொல். ‘தீக்காயம்’ நவீனத் தமிழில் தெளிவாகவும் சட்டவாக்கியத்தின் சுருக்கமான ஓசைக்கு ஏற்றவாறும் உள்ளது.
- source_word: תַּחַת
  choice: -க்கு / -க்கு ஈடாக
  rationale: இந்தச் சட்டச் சூழலில் இச்சொல் ஈடு அல்லது ஒத்த பதிலீட்டைக் குறிக்கிறது. தமிழில் ‘தீக்காயத்துக்குத் தீக்காயம்’ என்ற இணைப்பு, ‘ஈடாக’ என்பதை வெளிப்படையாகச் சேர்க்காமலேயே அந்த உறவை இயல்பாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: פֶּצַע
  choice: காயம்
  rationale: உடலில் ஏற்பட்ட காயத்தைப் பொதுவாகக் குறிக்கும் சொல். ‘காயம்’ மூலத்தின் பரந்த பொருளையும் மூன்று கூறுகளைக் கொண்ட இணை அமைப்பையும் காக்கிறது; ‘வெட்டுக்காயம்’ என்பது பொருளைத் தேவையின்றிக் குறுக்கும்.
- source_word: חַבּוּרָה
  choice: அடித்தழும்பு
  rationale: அடியால் உண்டாகும் தழும்பு, கன்று அல்லது தடத்தைக் குறிக்கிறது. ‘அடித்தழும்பு’ காயத்தின் காரணத்தையும் காணக்கூடிய தடத்தையும் தெளிவாகக் காட்டுகிறது; ‘தழும்பு’ மட்டும் பழைய காயத்தின் நிரந்தர வடுவாகவும் புரிந்துகொள்ளப்படலாம்.
theological_decisions: []
