  terminology: ‘உபகரணங்கள்’ כְּלִי என்பதன் பரந்த பொருள்வீச்சைச் சரியாகக் கையாள்கிறது; இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்துவது நல்ல ஒருமைப்பாடு. ‘தூபபீடம்’ என்பது ‘தூபத்தின் பலிபீடம்/தூபப் பலிபீடம்’ என்ற கட்டமைப்பின் இயல்பான தமிழ் வடிவமாகும்.
