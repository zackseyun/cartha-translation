translation:
  language: ta
  text: மேசையையும் அதன் எல்லா உபகரணங்களையும், விளக்குத்தண்டையும் அதன் உபகரணங்களையும், தூபபீடத்தையும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: மேசை
  rationale: இங்கு எபிரெயச் சொல் எளிமையாக ‘மேசை’ என்றே உள்ளது; திருச்சமுக அப்ப மேசை என்பது சூழலால் தெளிவாகிறது என்பதால் மூலத்தில் இல்லாத விரிவாக்கம் சேர்க்கப்படவில்லை.
- source_word: כָּל כֵּלָיו
  choice: அதன் எல்லா உபகரணங்கள்
  rationale: כְּלִי என்பது பாத்திரங்கள், கருவிகள், பயன்பாட்டுப் பொருட்கள் ஆகியவற்றை உள்ளடக்கும் பரந்த சொல். இங்கு மேசையோடு தொடர்புடைய அனைத்தையும் இயல்பாகக் குறிக்க ‘உபகரணங்கள்’ பொருந்துகிறது.
- source_word: הַמְּנֹרָה
  choice: விளக்குத்தண்டு
  rationale: ஒளிவிளக்குகளைத் தாங்கும் பரிசுத்தக் கூடாரப் பொருளின் வடிவத்தையும் செயலையும் தமிழில் தெளிவாகக் காட்டும் பொதுப்பெயர்; ஒலிபெயர்ப்பு தவிர்க்கப்பட்டுள்ளது.
- source_word: כֵּלֶיהָ
  choice: அதன் உபகரணங்கள்
  rationale: பெண்பால் ஒருமை பின்னொட்டு விளக்குத்தண்டைக் குறிக்கிறது. முன்னர் வந்த כְּלִי என்பதோடு ஒருமைப்பாட்டைத் தக்கவைக்க அதே சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: தூபபீடம்
  rationale: தூபம் செலுத்துவதற்குரிய பலிபீடத்தைத் தமிழில் சுருக்கமாகவும் வழக்கமாகவும் குறிக்கிறது; ‘தூபத்தின் பலிபீடம்’ என்ற எபிரெயக் கட்டமைப்பின் பொருளை இயல்பாக வழங்குகிறது.
