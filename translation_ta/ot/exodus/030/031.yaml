  yaml_path: translation/ot/exodus/030/031.yaml
  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: ta
  text: 'நீ இஸ்ரவேல் மக்களிடம் இவ்வாறு சொல்: ‘உங்கள் தலைமுறைகள் முழுவதும் இது எனக்குப் பரிசுத்த அபிஷேக எண்ணெயாக இருக்கும்.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரேய மொழியில் சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’; இங்கு முழு உடன்படிக்கைச் சமூகத்தையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: பரிசுத்த அபிஷேக எண்ணெய்
  rationale: ‘பரிசுத்தத்திற்குரிய அபிஷேக எண்ணெய்’ என்ற எபிரேய தொடர், வழிபாட்டுச் சூழலையும் அபிஷேகப் பயன்பாட்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לִי
  choice: எனக்குரிய
  rationale: ‘எனக்கு’ என்ற நேரடி பொருளை இயல்பான தமிழில் உரிமை மற்றும் தேவனுக்கென ஒதுக்கப்பட்ட நிலை ஆகிய இரண்டையும் வெளிப்படுத்தும் வகையில் தருகிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: தலைமுறைதோறும்
  rationale: ‘உங்கள் தலைமுறைகளுக்கு’ என்பதன் தொடர்ச்சியான தலைமுறைப் பயன்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: לִי என்பதன் உறவு
  choice: எனக்குரிய
  alternative: எனக்கு
  rationale: எண்ணெய் தேவனுக்கெனப் பரிசுத்தமாக ஒதுக்கப்பட்டிருப்பதைத் தெளிவாக்குகிறது; ஆயினும் மூலத்தின் எளிய தத்துவ உறவைத் தாண்டி எந்தச் சமயக் கோட்பாட்டையும் சேர்ப்பதில்லை.
translation_notes:
  register: மோசேயை நோக்கிய ஒருமை கட்டளையை ‘நீ ... சொல்ல வேண்டியது’ எனக் காத்து, மேற்கோளை நவீன, dignified, எளிதில் புரியும் தமிழில் வழங்குகிறது.
