- from: 'நீ இஸ்ரவேல் மக்களிடம் சொல்ல வேண்டியது: ‘இது தலைமுறைதோறும் எனக்குரிய பரிசுத்த அபிஷேக எண்ணெயாக இருக்கும்.’'
  to: 'நீ இஸ்ரவேல் மக்களிடம் இவ்வாறு சொல்: ‘உங்கள் தலைமுறைகள் முழுவதும் இது எனக்குப் பரிசுத்த அபிஷேக எண்ணெயாக இருக்கும்.’'
  rationale: The revision preserves the singular command to Moses, the inclusive communal sense of “sons of Israel,” and the holy anointing-oil terminology. It renders לִי directly as «எனக்குப்» and makes the possessive force of לְדֹרֹתֵיכֶם explicit, without introducing doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
