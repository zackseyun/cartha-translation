base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: ta
  text: ஆரோன் அந்தி வேளையில்[a] விளக்குகளை ஏற்றும்போது, யாவேக்கு முன்பாக உங்கள் தலைமுறைகள்தோறும் வழக்கமான தூபத்தை[b] அவன் எரிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இரு மாலைகளுக்கு இடையில்”; இது மாலை அல்லது அந்தி நேரத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தொடர்ச்சியான தூபம்.” இச்சொல் நியமிக்கப்பட்ட முறையில் தொடர்ந்து செலுத்தப்படுவதையோ நீடித்து நிலைப்பதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: விளக்குகளை ஏற்றும்போது
  rationale: בְּ + infinitive construct காலத்தைக் குறிக்கும் துணைவாக்கியத்தை உருவாக்குகிறது. עלה என்பதன் Hiphil வடிவம் விளக்குகளுடன் வரும்போது சுடரை எழச் செய்தல், அதாவது விளக்குகளை ஏற்றுதல் அல்லது எரியும்படி ஒழுங்குபடுத்துதல் எனப் பொருள்படும்; நவீன தமிழில் ‘ஏற்றும்போது’ இயல்பாக உள்ளது.
- source_word: הַנֵּרֹת
  choice: விளக்குகளை
  rationale: நֵרֹת ஆசரிப்புக்கூடாரச் சூழலில் எண்ணெய் விளக்குகளைக் குறிக்கும் வழக்கமான சொல்.
- source_word: בֵּין הָעֲרְבַּיִם
  choice: அந்தி வேளையில்
  rationale: சொல்லர்த்தமாக ‘இரு மாலைகளுக்கு இடையில்’ என்ற எபிரெய மரபுத்தொடர்; மாலை/அந்தி நேரத்தைக் குறிக்கிறது. தெளிவான நவீன தமிழுக்காக ‘அந்தி வேளையில்’ என வழங்கப்பட்டு, சொல்லர்த்தம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יַקְטִירֶנָּה
  choice: அதன்மேல் தூபம் எரிக்க வேண்டும்
  rationale: קטר என்பதன் Hiphil வடிவம் தூபத்தைப் புகையெழும்ப எரித்துச் செலுத்துவதைக் குறிக்கிறது. பெண்பால் ஒருமை பின்னொட்டு קְטֹרֶת-ஐச் சுட்டுகிறது. முந்தைய வசனச் சூழலில் பலிபீடம் இருப்பதால் ‘அதன்மேல்’ என்பது இயல்பான தமிழில் உறவை வெளிப்படுத்துகிறது.
- source_word: קְטֹרֶת
  choice: தூபம்
  rationale: இச்சொல் நறுமணத் தூபத்தைக் குறிக்கிறது; செலுத்தப்படும் காணிக்கை என்ற கருத்தை வினைச்சொல் மற்றும் வழிபாட்டுச் சூழல் தருகின்றன.
- source_word: תָּמִיד
  choice: வழக்கமான
  rationale: இங்கு ஒவ்வொரு கணமும் இடைவிடாமல் நிகழ்வதைவிட, நியமிக்கப்பட்ட முறையில் தொடர்ந்து மீண்டும் செலுத்தப்படுவதைச் சுட்டுகிறது. ‘தொடர்ச்சியான’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי வழிபாட்டிடத்தில் இறைவனின் முன்னிலையில் இருப்பதைக் குறிக்கிறது; தனிப்பெயரான יהוה ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்கப்படுகிறது.
- source_word: לְדֹרֹתֵיכֶם
  choice: உங்கள் தலைமுறைகள்தோறும்
  rationale: இஸ்ரவேலின் அடுத்தடுத்த தலைமுறைகள் முழுவதும் நீடிக்கும் நியமத்தைச் சுட்டும் இயல்பான தமிழ் மரபுத்தொடர்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. ஒரு பட்டப்பெயரை மாற்றாக இடாமல், உடன்படிக்கையின் தனிப்பெயரைத் தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகக் காக்கிறது.
- issue: תָּמִיד என்பது இடைவிடாததா அல்லது முறைப்படி தொடர்வதா
  choice: வழக்கமான
  alternative: தொடர்ச்சியான / நிரந்தரமான
  rationale: இந்தச் சடங்கு காலை மற்றும் அந்தி வேளைகளில் நிகழ்வதால், இங்கு நியமிக்கப்பட்ட தொடர் ஒழுங்கே முதன்மை. இருப்பினும் நீடித்த தொடர்ச்சி என்ற பொருள்சாயலை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் காலத் துணைவாக்கியமும் சடங்கின் தொடர்ச்சியும் காக்கப்பட்டுள்ளன; நீண்ட முதல் வாக்கியத்தைத் தவிர்க்க இரண்டு வாக்கியங்களாக இயல்புபடுத்தப்பட்டுள்ளது.
