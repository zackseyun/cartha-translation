review_pass:
  verdict: revise
  source_fidelity: The draft rightly conveys Aaron, the lamps, the twilight setting, incense, Yahweh, and the enduring generational scope. However, “அதன்மேல்” (‘upon it’) is not expressed in this verse and introduces an ambiguous referent; it could be read as referring to the lamps. The Hebrew directly says that Aaron is to burn/offer the incense, characterized as regular/continual.
  naturalness: The two-sentence rendering is understandable, but the second sentence turns the imperative ritual action into a descriptive copular statement. A single sentence more naturally retains the Hebrew clause and obligation in modern standard Tamil.
  terminology: “யாவே,” “விளக்குகள்,” and “தூபம்” are appropriate. “வழக்கமான” faithfully communicates the recurring prescribed sense of תָּמִיד; the footnote appropriately preserves the continual/perpetual nuance.
  issues:
  - severity: medium
    issue: 'Unsupported and ambiguous addition: “அதன்மேல்”'
    rationale: יַקְטִירֶנָּה means ‘he shall burn it/offer it in smoke,’ with the suffix referring to incense. This verse itself does not state ‘upon it’; adding that phrase both exceeds the verse and leaves its Tamil antecedent unclear.
  - severity: medium
    issue: Shift from commanded action to descriptive statement
    rationale: “அது ... தூபமாக இருக்கும்” recasts ‘he shall burn/offer regular incense’ as ‘it will be regular incense.’ Retaining the imperative obligation better reflects the Hebrew syntax and ritual prescription.
  revised_text: ஆரோன் அந்தி வேளையில்[a] விளக்குகளை ஏற்றும்போது, யாவேக்கு முன்பாக உங்கள் தலைமுறைகள்தோறும் வழக்கமான தூபத்தை[b] அவன் எரிக்க வேண்டும்.
