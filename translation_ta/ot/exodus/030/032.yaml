source:
  edition: WLC
  text: עַל בְּשַׂ֤ר אָדָם֙ לֹ֣א יִיסָ֔ךְ וּ/בְ/מַ֨תְכֻּנְתּ֔/וֹ לֹ֥א תַעֲשׂ֖וּ כָּמֹ֑/הוּ קֹ֣דֶשׁ ה֔וּא קֹ֖דֶשׁ יִהְיֶ֥ה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: ta
  text: மனிதச் சதையின்மேல் அதை ஊற்றக் கூடாது[a]. அதன் கலவை முறையின்படி, அதைப் போன்ற எதையும் நீங்கள் செய்யக் கூடாது. அது பரிசுத்தமானது; அது உங்களுக்குப் பரிசுத்தமானதாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, ‘மனிதச் சதையின்மேல்.’ இங்குள்ள எபிரெயச் சொல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִיסָךְ
  choice: ஊற்றக் கூடாது
  rationale: נסך என்பதன் இச்சூழலிலான அடிப்படைப் பொருள் எண்ணெயை ஊற்றுதல் அல்லது பூசுவதற்காகச் செலுத்துதல். சடங்கின் விளைவைக் குறிக்கும் ‘அபிஷேகம் செய்ய’ என்பதை விட, எபிரெய வினையின் நேரடியான செயலை ‘ஊற்ற’ காக்கிறது.
- source_word: עַל בְּשַׂר אָדָם
  choice: மனித உடலில்
  rationale: בשר என்பது சொற்படியாக ‘சதை’ என்றாலும், எண்ணெயைப் பயன்படுத்தும் இச்சூழலில் இயல்பான நவீனத் தமிழில் ‘உடல்’ தெளிவாக உள்ளது; אדם இங்கு மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: அதன் கலவை முறையின்படி
  rationale: מַתְכֻּנֶת அளவிடப்பட்ட சேர்க்கை, விகிதம் அல்லது கலவை முறையைக் குறிக்கிறது. ‘கலவை முறையின்படி’ என்பது அந்தப் பரிசுத்த எண்ணெயின் சேர்மானத்தை மீண்டும் உருவாக்கும் தடையைத் தெளிவுபடுத்துகிறது.
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: அதைப் போன்ற எதையும் நீங்கள் செய்யக் கூடாது
  rationale: כָּמֹהוּ என்பதன் ஒப்பீட்டுப் பொருளை இயல்பாகக் காத்து, இதேபோன்ற வேறொரு கலவையை உருவாக்குவதற்கான தடையை வெளிப்படுத்துகிறது.
- source_word: קֹדֶשׁ הוּא
  choice: அது பரிசுத்தமானது
  rationale: קֹדֶשׁ என்பதற்கான மைய வேதாகமச் சொல்லாக ‘பரிசுத்தம்’ பயன்படுத்தப்பட்டு, தனியே கடவுளுக்கென ஒதுக்கப்பட்ட தன்மையைத் தக்கவைக்கிறது.
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: அது உங்களுக்குப் பரிசுத்தமானதாக இருக்க வேண்டும்
  rationale: יִהְיֶה வடிவத்தின் கட்டளை/எதிர்கால வலிமையையும், לָכֶם குறிக்கும் இஸ்ரவேலருடனான தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுமனிதக் குறிப்பு
  choice: மனித
  alternative: மனிதனின்
  rationale: אָדָם இங்கு ஓர் ஆணை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. ஆகவே பாலின வரம்பைத் தேவையின்றி உருவாக்காமல் ‘மனித’ என மொழிபெயர்க்கப்பட்டது.
- issue: קֹדֶשׁ என்ற சொல்லின் இருமுறை பயன்பாடு
  choice: இரு வாக்கியங்களிலும் ‘பரிசுத்தமானது/பரிசுத்தமானதாக’ எனத் தக்கவைத்தல்
  alternative: இரண்டாவது இடத்தில் ‘தனியே ஒதுக்கப்பட்டதாக’ என விளக்குதல்
  rationale: மூலத்தின் மறுபடியும் கூறும் வலிமையையும் அதன் இறையியல் பதற்றத்தையும் விளக்கவுரையாகக் கரைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘சதை’ என்ற நேரடி சொல்லின் கடினத்தன்மையை முதன்மை உரையில் ‘உடல்’ என இயல்பாக்கி, சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
