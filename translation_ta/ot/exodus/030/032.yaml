- from: அதை மனித உடலில் ஊற்றக் கூடாது[a]. அதன் கலவை முறையின்படி அதைப் போன்ற எதையும் நீங்கள் செய்யக் கூடாது. அது பரிசுத்தமானது; அது உங்களுக்குப் பரிசுத்தமானதாக இருக்க வேண்டும்.
  to: மனிதச் சதையின்மேல் அதை ஊற்றக் கூடாது[a]. அதன் கலவை முறையின்படி, அதைப் போன்ற எதையும் நீங்கள் செய்யக் கூடாது. அது பரிசுத்தமானது; அது உங்களுக்குப் பரிசுத்தமானதாக இருக்க வேண்டும்.
  rationale: The sole substantive revision replaces ‘மனித உடலில்’ with ‘மனிதச் சதையின்மேல்’ to reflect the Hebrew’s lexical and spatial specificity. The footnote is retained to identify the generic-human force of אָדָם. A comma clarifies the Tamil syntax of the formula/composition clause; no interpretive or theological expansion has been introduced.
