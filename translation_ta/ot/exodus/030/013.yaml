source:
  edition: WLC
  text: זֶ֣ה יִתְּנ֗וּ כָּל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֤ים גֵּרָה֙ הַ/שֶּׁ֔קֶל מַחֲצִ֣ית הַ/שֶּׁ֔קֶל תְּרוּמָ֖ה לַֽ/יהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: ta
  text: 'மக்கள்தொகைக் கணக்கில் பதிவுசெய்யப்படுகிற ஒவ்வொருவரும்[a] கொடுக்க வேண்டியது இதுதான்: பரிசுத்த ஸ்தலச் சேக்கல் அளவின்படி அரைச் சேக்கல்—ஒரு சேக்கல் இருபது கேரா[b]—யாவேக்கு காணிக்கையாக அரைச் சேக்கல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “எண்ணப்பட்டவர்களுக்குள் கடந்து செல்லும் ஒவ்வொருவரும்”; இது மக்கள்தொகைக் கணக்கில் அதிகாரப்பூர்வமாகப் பதிவாகுபவரைக் குறிக்கும் மரபுத்தொடர்.
    reason: மக்கள்தொகைக் கணக்கு மரபுத்தொடரின் சொற்சொல் வடிவத்தையும் அதன் செயல்பாட்டுப் பொருளையும் காக்கிறது.
  - marker: b
    text: “கேரா” என்பது பழங்கால எடை அலகு; இருபது கேரா ஒரு சேக்கல்.
    reason: அறிமுகமில்லாத அளவுச் சொல்லை விளக்கி, வசனத்திலுள்ள அலகுகளின் உறவைத் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: கொடுக்க வேண்டியது இதுதான்
  rationale: சட்ட அறிவுறுத்தலின் சுட்டும் தன்மையையும் கட்டாயப் பொருளையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: எண்ணப்பட்டவர்களின் பட்டியலில் சேரும் ஒவ்வொருவரும்
  rationale: சொல்லுக்கு சொல் வடிவில் உள்ள ‘எண்ணப்பட்டவர்களைக் கடந்து செல்கிறவர்’ என்ற எபிரெய census மரபுத்தொடரின் பொருளைத் தெளிவாகத் தருகிறது; பட்டியலில் அதிகாரபூர்வமாகச் சேருவதைச் சுட்டுகிறது.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: அரைச் சேக்கல்
  rationale: குறிப்பிட்ட எடை/நாணய அளவைச் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் அளவின்படி
  rationale: בְּ என்பதன் அளவுத்தரப் பொருளையும், הַקֹּדֶשׁ குறிக்கும் திருவிடச் சார்ந்த அதிகாரபூர்வ அளவையும் தெளிவாக்குகிறது.
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: ஒரு சேக்கல் இருபது கேரா
  rationale: அளவின் விளக்கக் கூற்றை எளிய தமிழில் தருகிறது; ‘கேரா’ என்ற பழங்கால அலகைப் பெயரெழுத்தாக்கமாக வைத்திருக்கிறது.
- source_word: תְּרוּמָה לַיהוָה
  choice: யாவேக்கு காணிக்கையாக
  rationale: תְּרוּמָה என்பதன் கடவுளுக்கெனப் பிரித்தளிக்கப்படும் பங்களிப்பு/காணிக்கைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருநாமத்தின் வழக்கமான தமிழ் பெயரெழுத்தாக்கத்தில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருநாமம் நேரடியாக இருப்பதால் அதை பட்டமாக மாற்றாமல் பெயரெழுத்தாக்கம் செய்யப்பட்டுள்ளது.
- issue: תְּרוּמָה என்பதன் வழிபாட்டுச் சார்ந்த நுணுக்கம்
  choice: காணிக்கை
  alternative: பங்களிப்பு / உயர்த்திப் படைக்கும் காணிக்கை
  rationale: இங்கு கடவுளுக்கென அளிக்கப்படும் தொகையைக் குறிக்கிறது; ‘காணிக்கை’ வழிபாட்டுச் சார்பைக் காக்கிறது, அதேவேளை மூலத்தில் இல்லாத குறிப்பிட்ட சடங்கு முறையைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. census மரபுத்தொடர் சொற்சொல்லாகத் தெளிவில்லாமல் போகாதபடி அதன் செயல்பாட்டு பொருள் தரப்பட்டுள்ளது; பழங்கால அளவுப் பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
