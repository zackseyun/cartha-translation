  text: וְ/נָתַתָּ֤ה אֹת/וֹ֙ לִ/פְנֵ֣י הַ/פָּרֹ֔כֶת אֲשֶׁ֖ר עַל אֲרֹ֣ן הָ/עֵדֻ֑ת לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת אֲשֶׁר֙ עַל הָ֣/עֵדֻ֔ת אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: ta
  text: சாட்சிப்பேழைக்கு முன்னால் இருக்கும் திரைக்கு முன்பாகவும், சாட்சியின் மேல் இருக்கும் பாவநிவாரண மூடிக்கு முன்பாகவும் அதை வைக்க வேண்டும்; அங்கே நான் உன்னைச் சந்திப்பேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: அதை வைக்க வேண்டும்
  rationale: נתן என்பது பரந்த பொருளுடைய வினைச்சொல்; வழிபாட்டுக்குரிய பொருளின் இடத்தை நிர்ணயிக்கும் இச்சூழலில் ‘வைக்க வேண்டும்’ என்பது இயல்பாகவும் கட்டளையின் வலிமையைத் தெளிவாகவும் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்னால் / முன்பாக
  rationale: இரு இடங்களிலும் இடஞ்சார்ந்த ‘முன்’ என்ற பொருள் காக்கப்படுகிறது; தமிழின் இயல்புக்காக இணைந்த சொற்றொடரில் ‘முன்னால்’, பிரதான அமைவிடத்தில் ‘முன்பாக’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַפָּרֹכֶת
  choice: திரை
  rationale: இது பரிசுத்த இடங்களைப் பிரிக்கும் உட்புறத் திரையைக் குறிக்கிறது. ‘திரை’ என்பது நவீன தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: אֲרֹן הָעֵדֻת
  choice: சாட்சிப்பேழை
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘சாட்சியின் பேழை’ என்பதைக் குறிக்கிறது; ‘உடன்படிக்கைப் பெட்டி’ என மரபுவழியாக மாற்றாமல், மூலத்தின் עדות என்ற சொல்லை ‘சாட்சி’ எனக் காக்கிறது.
- source_word: הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: பேழையின் மேலுள்ள பொன் மூடியையும் அதன் பாவநிவாரணச் செயல்பாட்டையும் இச்சொல் குறிக்கிறது. ‘பாவநிவாரண மூடி’ என்பது பொருளின் வடிவத்தையும் வழிபாட்டுச் சிறப்பையும் புரிந்துகொள்ளத்தக்க தமிழில் தெரிவிக்கிறது.
- source_word: הָעֵדֻת
  choice: சாட்சி
  rationale: மூலத்தில் עדות என்பதே இருப்பதால், இதை ‘உடன்படிக்கை’ என்று ஒத்திசைக்காமல் இவ்வசனம் முழுவதும் ‘சாட்சி’ எனத் தொடர்ந்து மொழிபெயர்க்கப்படுகிறது.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: அங்கே நான் உன்னைச் சந்திப்பேன்
  rationale: יעד என்பதன் நிபால் வடிவம் இச்சூழலில் குறிக்கப்பட்ட சந்திப்பைக் குறிக்கிறது. ‘அங்கே’ என்பதை வெளிப்படையாக வைத்திருப்பது שָׁמָּה என்ற இடச்சுட்டையும் காக்கிறது.
theological_decisions:
- issue: הַכַּפֹּרֶת என்ற வழிபாட்டுச் சொல்லின் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: கிருபாசனம்
  rationale: இச்சொல் பேழையின் மூடியைக் குறித்தாலும் பாவநிவாரணத் தொடர்பையும் கொண்டுள்ளது. ‘பாவநிவாரண மூடி’ என்பது பொருளின் உடற்கூறையும் வழிபாட்டுப் பொருளையும் ஒருசேர தெரிவிக்கிறது; மரபுச் சொல்லான ‘கிருபாசனம்’ அடிக்குறிப்பில் தரப்படுகிறது.
- issue: עֵדוּת என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: சாட்சி
  alternative: உடன்படிக்கை
  rationale: இவ்வசனத்தில் எபிரெய மூலச்சொல் ‘சாட்சி’ என்பதே; ‘உடன்படிக்கை’ என்பது தொடர்புடைய மரபு மொழியாக இருந்தாலும் இங்கே வேறு எபிரெயச் சொல்லை இறக்குமதி செய்யும். ஆகவே மூலத்தின் சொல்வேறுபாடு காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. நீண்ட எபிரெய இடவமைப்பை தெளிவாக்க அரைப்புள்ளியும் நீண்ட கோடும் பயன்படுத்தப்பட்டுள்ளன; ‘சாட்சி’ என்ற மூலச்சொல் இரு இடங்களிலும் காக்கப்பட்டுள்ளது.
