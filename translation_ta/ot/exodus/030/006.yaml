- from: சாட்சிப்பேழைக்கு முன்னால் இருக்கும் திரைக்கு முன்பாக அதை வைக்க வேண்டும்; சாட்சியின் மேல் இருக்கும் பாவநிவாரண மூடிக்கு[a] முன்பாக—அங்கே நான் உன்னைச் சந்திப்பேன்.
