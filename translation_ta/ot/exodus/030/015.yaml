- from: செல்வந்தன் அரைச் சேக்கலைவிட அதிகமாகவும், ஏழை அதைவிடக் குறைவாகவும் கொடுக்கக்கூடாது. உங்கள் உயிர்களுக்காக[a] பரிகாரம் செய்யும்படி யாவேக்கான காணிக்கையைக் கொடுக்கும்போது, அரைச் சேக்கலையே கொடுக்க வேண்டும்.
