base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: ta
  text: செல்வந்தன் அரைச் சேக்கலைவிட அதிகமாகக் கொடுக்கக்கூடாது; ஏழை அரைச் சேக்கலைவிடக் குறைவாகக் கொடுக்கக்கூடாது; உங்கள் உயிர்களுக்காக[a] பரிகாரம் செய்ய, யாவேக்கான காணிக்கையைக் கொடுக்கும்போது இப்படியே செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் ஆத்துமாக்களுக்காக.” எபிரெய மொழியின் நெபெஷ் என்ற சொல் உயிர், நபர், தன்னையே, அல்லது ஆத்துமா என்று பொருள்படலாம். இந்தக் கணக்கெடுப்புக் கட்டணச் சூழலில், எண்ணப்பட்ட மக்களின் உயிர்கள் அல்லது நபர்கள் என்பதே பெரும்பாலும் கருத்தாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: செல்வந்தன்
  rationale: கட்டுரையுடன் வரும் பெயரடை ஒரு வகுப்பைச் சேர்ந்தவரை பிரதிநிதித்துவ ஒருமையில் குறிக்கிறது; ‘செல்வந்தன்’ என்பது பொருளாதார எதிர்மறையை இயல்பாகக் காட்டுகிறது.
- source_word: יַרְבֶּה
  choice: அதிகமாகக் கொடுக்கக்கூடாது
  rationale: நிர்ணயிக்கப்பட்ட தொகையை அதிகரிக்கக் கூடாது என்பதே சூழல்சார் பொருள்; தமிழில் கொடுக்கும் செயலை வெளிப்படையாகச் சொல்வது தெளிவானது.
- source_word: הַדַּל
  choice: ஏழை
  rationale: இங்கு குறைந்த பொருளாதார வசதியுள்ளவரைக் குறிக்கிறது; ‘செல்வந்தன்’ என்பதற்கான இயல்பான எதிர்ச்சொல்.
- source_word: יַמְעִיט
  choice: குறைவாகக் கொடுக்கக்கூடாது
  rationale: நிர்ணயிக்கப்பட்ட தொகையிலிருந்து குறைக்கக் கூடாது என்ற பொருளை, இணையான சட்டநடையில் தருகிறது.
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: அரைச் சேக்கலைவிட
  rationale: எதிர்மறை ஒப்பீட்டில் מן என்பதன் பொருள் தமிழில் ‘-விட’ என இயல்பாக வெளிப்படுகிறது.
- source_word: תְּרוּמַת יְהוָה
  choice: யாவேக்கான காணிக்கை
  rationale: תְּרוּמָה என்பது புனித நோக்கத்திற்காக ஒதுக்கப்படும் பங்களிப்பு அல்லது காணிக்கை; கணக்கெடுப்புக் கட்டணத்தின் சூழலில் ‘காணிக்கை’ இயல்பான, புரியக்கூடிய சொல்லாகும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: לְכַפֵּר
  choice: பரிகாரம் செய்யும்படி
  rationale: כפר என்பதன் சடங்கியல் மற்றும் இறையியல் பரப்பைத் தக்கவைத்து, ஒரு குறிப்பிட்ட பாவநிவாரணக் கோட்பாட்டைத் திணிக்காமல் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: உங்கள் உயிர்களுக்காக
  rationale: கணக்கெடுப்பு மற்றும் மீட்புத்தொகைச் சூழலில் נֶפֶשׁ என்பது உடலற்ற ஆத்துமாவை மட்டும் அல்லாமல் எண்ணப்பட்ட மக்களின் உயிர்கள் அல்லது நபர்களைக் குறிக்கிறது.
- source_word: לָתֵת
  choice: கொடுக்கும்போது
  rationale: முடிவிலி வினை, காணிக்கையைச் செலுத்தும் சூழ்நிலையைச் சுட்டுகிறது; தமிழில் காலவினையெச்ச வடிவம் இயல்பானது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரைப் பட்டப்பெயரால் மாற்றாமல் வெளிப்படுத்துகிறது; அதேவேளை தமிழ் வாசகர்களுக்குப் படிக்கத்தக்க ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: உங்கள் உயிர்களுக்காக
  alternative: உங்கள் ஆத்துமாக்களுக்காக / உங்களுக்காக
  rationale: இந்தக் கணக்கெடுப்பு-மீட்புத்தொகைச் சூழலில் எண்ணப்பட்ட நபர்களின் உயிரையே முதன்மையாகக் குறிக்கிறது; மனித இயல்பைப் பற்றிய பிற்காலப் பிரிவை வசனத்தில் திணிப்பதைத் தவிர்க்கிறது.
- issue: כפר என்பதன் இறையியல் மொழியாக்கம்
  choice: பரிகாரம் செய்யும்படி
  alternative: பாவநிவிர்த்தி செய்யும்படி
  rationale: மூலச் சொல்லின் சடங்கியல் வலிமையைப் பாதுகாத்தபடியே, ‘பாவம்’ என்ற சொல்லை மூலத்தில் இல்லாத இடத்தில் வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டநடையின் சமச்சீரைத் தக்கவைத்து மொழிபெயர்க்கப்பட்டுள்ளது. ‘செல்வந்தன்—ஏழை’, ‘அதிகமாக—குறைவாக’ என்ற இணைகள் மூலத்தின் சமநிலையைப் பாதுகாக்கின்றன. இரண்டாவது வாக்கியத்தில் ‘அரைச் சேக்கலையே’ என்று மீண்டும் கூறுவது தமிழில் கட்டளையின் நிர்ணயத் தொகையைத் தெளிவுபடுத்துகிறது.
