  register: நவீன நிலையான தமிழில், சட்ட அறிவுறுத்தலுக்குரிய கண்ணியமான நடையைப் பேணுகிறது. ‘அபிஷேகத் தைலம்’ என்ற பரவலாகப் புரியக்கூடிய வேதாகமச் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது; அரிதான தொழிற்சொல் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
