base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/025.yaml
  text: And you shall make it a holy anointing oil[a], a perfume blended by the work of a perfumer; it shall be a holy anointing oil.
translation:
  language: ta
  text: அதைப் பரிசுத்த அபிஷேகத் தைலமாகச் செய்ய வேண்டும்; நறுமணப் பொருள் தயாரிப்பவரின் கைவினையால் கலக்கப்பட்ட நறுமணக் கலவையாக அது இருக்கும்; அது பரிசுத்த அபிஷேகத் தைலமாக இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், இது திறமையான நறுமணப் பொருள் தயாரிப்பவரின் கைவினையால் செய்யப்பட்ட நறுமணக் கலவை என்றும் வழங்கப்பட்டுள்ளது; ‘கலவைத் தைலம்’ அல்லது ‘நறுமணக் கலவை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்ய வேண்டும்
  rationale: தொடர்ச்சியைக் குறிக்கும் וְ உடன் வரும் Qal perfect, இச்சட்ட அறிவுறுத்தல் சூழலில் கட்டளையின் வலிமையைக் கொண்டுள்ளது; நவீனத் தமிழில் ‘செய்ய வேண்டும்’ இயல்பாக அதைக் காட்டுகிறது.
- source_word: אֹתוֹ
  choice: அதை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பொருட்கள் அல்லது எண்ணெய்க் கலவையைச் சுட்டும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: பரிசுத்த அபிஷேகத் தைலம்
  rationale: ‘பரிசுத்தத்திற்குரிய அபிஷேக எண்ணெய்’ என்ற construct தொடரின் அர்த்தத்தைத் திருச்சபைத் தனிப்பட்ட கோட்பாட்டைச் சேர்க்காமல், தமிழில் நிலைபெற்றும் தெளிவாகவும் வழங்குகிறது.
- source_word: רֹקַח מִרְקַחַת
  choice: திறம்படக் கலக்கப்பட்ட நறுமணக் கலவை
  rationale: ஒரே வேர் சார்ந்த இச்சொற்கள் நறுமணப் பொருட்களைத் தொழில்திறனுடன் சேர்த்துக் கலப்பதை வலியுறுத்துகின்றன; தமிழில் மூலத்தின் மீளொலியை முழுமையாகப் பிரதிபலிக்க இயலாததால் பொருள் வெளிப்படையாக வழங்கப்படுகிறது.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: நறுமணப் பொருள் தயாரிப்பவரின் கைவேலை
  rationale: சொல்லர்த்தத்தில் திறமையான கலவையாளர் அல்லது நறுமணத் தயாரிப்பாளரின் வேலை; ‘கைவேலை’ என்பது தொழில்நுட்ப நிபுணத்துவத்தை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: יִהְיֶה
  choice: இருக்கும்
  rationale: தயாரிக்கப்பட்ட எண்ணெயின் விளைவுநிலையைச் சுட்டும் היה என்பதன் imperfect வடிவத்தை அறிவுறுத்தல் சூழலுக்கேற்றவாறு வழங்குகிறது.
