revisions:
- from: அதைப் பரிசுத்த அபிஷேகத் தைலமாகச் செய்ய வேண்டும்; அது நறுமணப் பொருள் தயாரிப்பவரின் கைவேலையாகிய திறம்படக் கலக்கப்பட்ட நறுமணக் கலவையாக இருக்க வேண்டும்.[a] அது பரிசுத்த அபிஷேகத் தைலமாக இருக்கும்.
  to: அதைப் பரிசுத்த அபிஷேகத் தைலமாகச் செய்ய வேண்டும்; நறுமணப் பொருள் தயாரிப்பவரின் கைவினையால் கலக்கப்பட்ட நறுமணக் கலவையாக அது இருக்கும்; அது பரிசுத்த அபிஷேகத் தைலமாக இருக்கும்.[a]
  rationale: The revision makes the aromatic-compound expression a description of the oil rather than a separate command, improves Tamil flow, and keeps the repetition of ‘பரிசுத்த அபிஷேகத் தைலம்’ that reflects the Hebrew.
