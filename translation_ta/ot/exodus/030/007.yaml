  text: וְ/הִקְטִ֥יר עָלָ֛י/ו אַהֲרֹ֖ן קְטֹ֣רֶת סַמִּ֑ים בַּ/בֹּ֣קֶר בַּ/בֹּ֗קֶר בְּ/הֵיטִיב֛/וֹ אֶת הַ/נֵּרֹ֖ת יַקְטִירֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/007.yaml
  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: ta
  text: ஆரோன் அதன்மேல் நறுமணத் தூபத்தை ஒவ்வொரு காலையிலும்[a] எரிக்க வேண்டும்; அவர் விளக்குகளைப் பராமரிக்கும்போது[b] அதை எரிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “காலையில் காலையில்.” இந்த மறுபதிப்பு, நாள்தோறும் தவறாமல் செய்யப்படுவதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “விளக்குகளைச் செம்மைப்படுத்தும்போது.” விளக்குகளை ஒழுங்குபடுத்தி, பயன்பாட்டுக்குத் தயாராக்குவதையும் எபிரெய வினைச்சொல் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: எரிக்க வேண்டும்
  rationale: கטר என்பதன் ஹிஃபில் வடிவம் வழிபாட்டுச் சூழலில் தூபத்தைப் புகையாக எழும்பும்படி எரிப்பதைக் குறிக்கிறது. தமிழில் ‘எரிக்க வேண்டும்’ என்பது இயல்பாகவும் கட்டளையின் வலிமையைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: முந்தைய சூழலில் கூறப்பட்ட தூபப் பலிபீடத்தையே இது சுட்டுகிறது; இடத்தைக் குறிக்கும் பொருளை ‘அதன்மேல்’ நேராகக் காக்கிறது.
- source_word: קְטֹרֶת סַמִּים
  choice: நறுமணத் தூபம்
  rationale: קְטֹרֶת என்பது தூபத்தையும், סַמִּים அதன் நறுமணமிக்க வாசனைப் பொருள்களால் ஆன தன்மையையும் குறிக்கிறது. ‘நறுமணத் தூபம்’ இயல்பான தமிழில் இரண்டின் கருத்தையும் தருகிறது.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: ஒவ்வொரு காலையிலும்
  rationale: ‘காலையில் காலையில்’ என்ற எபிரெய மறுபதிப்பு, நாள்தோறும் தொடர்ந்து நடைபெறும் வழக்கத்தை விநியோகப் பொருளில் வலியுறுத்துகிறது. ‘ஒவ்வொரு காலையிலும்’ அந்தப் பொருளைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: בְּהֵיטִיבוֹ
  choice: அவர் … பராமரிக்கும்போது
  rationale: இச்சூழலில் יטב என்பதன் ஹிஃபில் வடிவம் விளக்குகளைச் செம்மைப்படுத்துதல், திரிகளைத் திருத்துதல், பயன்பாட்டுக்குத் தயாராக்குதல் ஆகிய பராமரிப்புச் செயல்களைக் குறிக்கலாம். ‘பராமரிக்கும்போது’ தேவையின்றி ஒரு குறிப்பிட்ட துணைச்செயலை மட்டும் முன்வைக்காமல் பரந்த கருத்தைக் காக்கிறது.
- source_word: הַנֵּרֹת
  choice: விளக்குகளை
  rationale: திருவிடத்தின் விளக்குகள் முந்தைய சூழலில் அடையாளம் காணப்பட்டுள்ளதால், ‘விளக்குகள்’ என்பதே போதுமானதும் இயல்பானதும் ஆகும்.
- source_word: יַקְטִירֶנָּה
  choice: அதை எரிக்க வேண்டும்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன்பு சொல்லப்பட்ட தூபத்தைச் சுட்டுகிறது. ‘அதை’ என்பது அந்தச் சுட்டுதலை மீளுரையின்றிக் காக்கிறது.
