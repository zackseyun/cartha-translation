translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. எபிரெய வாக்கியத்தின் இரு பகுதிகளும் அரைப்புள்ளியால் இணைக்கப்பட்டு, தூபம் எரிப்பதும் விளக்குகளைப் பராமரிப்பதும் ஒரே காலைப் பணியுடன் தொடர்புடையவை என்பது காக்கப்பட்டது.
