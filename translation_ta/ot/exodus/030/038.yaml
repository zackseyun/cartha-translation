  text: אִ֛ישׁ אֲשֶׁר יַעֲשֶׂ֥ה כָמ֖וֹ/הָ לְ/הָרִ֣יחַ בָּ֑/הּ וְ/נִכְרַ֖ת מֵ/עַמָּֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/038.yaml
  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: ta
  text: அதைப் போன்றதை அதன் மணத்தை முகர்வதற்காகச் செய்கிற எவனும் தன் மக்களிடமிருந்து அறுத்துப்போடப்படுவான்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் மணத்தை அனுபவிப்பதற்காக” / “அதை முகர்வதற்காக.” தனிப்பட்ட முறையில் முகர்ந்து மகிழும் நோக்கத்திற்காக இப்படிப்பட்ட தூபத்தைச் செய்வதை எபிரெயச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “தன் மக்களிடமிருந்து அறுத்துப்போடப்படுவான்” என்பது வழக்கமான சட்டச் சூத்திரம். சூழலைப் பொறுத்து இது மரணம், சமூகத்திலிருந்து வெளியேற்றம், அல்லது இறைவனால் அகற்றப்படுதல் ஆகியவற்றில் ஒன்றைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: எவனும்
  rationale: சட்ட விதியில் אִישׁ பொதுவாக எந்த நபரையும் குறிக்கிறது. நிபந்தனைத் தன்மையுள்ள உறவுத்தொடரைத் தமிழில் இயல்பாகவும் சுருக்கமாகவும் இது தெரிவிக்கிறது.
- source_word: יַעֲשֶׂה
  choice: செய்கிற
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்/உருவாக்கு.’ இங்கு தூபக்கலவையைத் தயாரிப்பதைக் குறித்தாலும், மூலத்தின் பொதுவான சொல்லாட்சியை ‘செய்கிற’ காக்கிறது.
- source_word: כָמֹהָ
  choice: அதைப் போன்றதை
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட பரிசுத்தத் தூபத்தை ஒத்த ஒரு கலவையைச் சுட்டுகிறது; அது முற்றிலும் அதே கலவையா அல்லது ஒத்த ஒன்றா என்பதைத் தேவையின்றி முடிவுசெய்யவில்லை.
- source_word: לְהָרִיחַ בָּהּ
  choice: அதன் நறுமணத்தை நுகர்வதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் எபிரெய infinitive-ஐத் தெளிவாகக் காட்டுகிறது. ריח என்பதில் வாசனையை முகர்தல் அல்லது அதை அனுபவித்தல் என்ற நுணுக்கம் இருக்கலாம்; ‘நறுமணத்தை நுகர்வது’ தமிழில் இயல்பாக இரண்டையும் அணுகுகிறது.
- source_word: וְנִכְרַת
  choice: அறுத்துப்போடப்படுவான்
  rationale: כרת என்ற சட்ட/உடன்படிக்கைச் சூத்திரத்தின் உருவக வலிமையைத் தக்கவைக்கிறது; தண்டனையின் செயல்முறையை மரணம், வெளியேற்றம் அல்லது தெய்வீக அகற்றம் என்று குறிப்பாக நிர்ணயிக்கவில்லை.
- source_word: מֵעַמָּיו
  choice: தன் மக்களிடமிருந்து
  rationale: עם என்பது இங்கு அந்த நபரின் மக்கள் அல்லது உடன்படிக்கைச் சமூகத்தைக் குறிக்கிறது. ‘தன் மக்களிடமிருந்து’ மூலத்தின் உறவையும் சமூகப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: ‘தன் மக்களிடமிருந்து அறுத்துப்போடப்படுவான்’ என்ற தண்டனைச் சூத்திரத்தின் பொருள்
  choice: மூலத்தின் சட்டச் சூத்திரத்தை வரையறுக்காமல் தக்கவைத்தல்
  alternative: ‘கொல்லப்படுவான்,’ ‘சமூகத்திலிருந்து விலக்கப்படுவான்,’ அல்லது ‘இறைவனால் அகற்றப்படுவான்’ என்று குறிப்பாக்குதல்
  rationale: எபிரெயச் சூத்திரம் கடுமையான அகற்றத்தைக் குறித்தாலும், அதன் நடைமுறை எல்லா சூழல்களிலும் ஒரேவிதமாகத் தெளிவில்லை. ஆகவே உண்மையான சட்ட மற்றும் இறையியல் தெளிவின்மை முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. ‘அறுத்துப்போடப்படுவான்’ சற்று உருவகமிக்கதாக இருந்தாலும், மூலச் சட்டச் சூத்திரத்தின் வலிமையையும் தீர்மானிக்கப்படாத பொருளையும் காக்கிறது.
