translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதுமான கைவினை அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் தொடர்ச்சியான கட்டளைத் தன்மை பேணப்பட்டுள்ளது.
