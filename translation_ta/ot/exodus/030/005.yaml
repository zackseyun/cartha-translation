revisions:
- from: சுமக்கும் கம்புகளை அகாசியா மரத்தால் செய்து, அவற்றுக்குத் தங்கத் தகடு பதிக்க வேண்டும்.
  to: சுமப்பதற்கான கம்புகளை அகாசியா மரத்தால் செய்து, அவற்றின்மேல் தங்கம் பதிக்க வேண்டும்.
  rationale: The revision retains the instructional force, the carrying function implicit in the tabernacle poles, and the acacia-wood material. It corrects the object construction and removes the unnecessary narrowing of ‘gold’ to ‘gold sheet.’
