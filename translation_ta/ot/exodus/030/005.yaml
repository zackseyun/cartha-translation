base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/005.yaml
  text: And you shall make the poles of acacia wood and overlay them with gold.
translation:
  language: ta
  text: சுமப்பதற்கான கம்புகளை அகாசியா மரத்தால் செய்து, அவற்றின்மேல் தங்கம் பதிக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்து ... வேண்டும்
  rationale: அறிவுறுத்தல்களின் தொடரில் வரும் இணைப்புடன் கூடிய வினை வடிவத்தின் கட்டளைத் தன்மையை, இயல்பான நவீனத் தமிழில் ‘வேண்டும்’ என்ற அமைப்பு வெளிப்படுத்துகிறது.
- source_word: הַבַּדִּים
  choice: சுமக்கும் கம்புகளை
  rationale: திருப்பொருட்களைத் தூக்கிச் செல்வதற்குப் பயன்படும் கம்புகளைக் குறிக்கிறது; வெறும் ‘கம்புகள்’ என்பதைவிட அவற்றின் பணியைத் தெளிவுபடுத்துகிறது.
- source_word: עֲצֵי שִׁטִּים
  choice: அகாசியா மரத்தால்
  rationale: குறிப்பிட்ட மரவகையை நவீனத் தமிழில் அடையாளம் காணக்கூடிய பெயரால் வழங்குகிறது; ‘சித்தீம்’ போன்ற ஒலிபெயர்ப்பு பொருளை மறைக்கும்.
- source_word: וְצִפִּיתָ
  choice: தங்கத் தகடு பதிக்க
  rationale: இந்தக் கைவினைச் சூழலில் צפה என்பது ஒரு பொருளின் மேற்பரப்பை உலோகத்தால் மூடுதல் அல்லது தகடு பதித்தலைக் குறிக்கிறது; ‘பூசு’ என்பது தங்கப் பூச்சு என்ற தவறான எண்ணத்தைத் தரக்கூடும்.
- source_word: אֹתָם
  choice: அவற்றுக்கு
  rationale: முன்னர் கூறப்பட்ட பன்மையான கம்புகளையே சுட்டுகிறது; தமிழின் இயல்பான வேற்றுமை அமைப்பில் வழங்கப்பட்டுள்ளது.
- source_word: זָהָב
  choice: தங்கத் தகடு
  rationale: எபிரெயத்தில் ‘தங்கம்’ என்று மட்டுமே இருந்தாலும், צפה வினையின் கைவினைப் பொருளை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்த ‘தகடு’ சேர்க்கப்பட்டுள்ளது.
