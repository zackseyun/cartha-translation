revisions:
- from: அதன் அலங்கார விளிம்புக்குக் கீழே அதற்காக இரண்டு தங்க வளையங்களைச் செய்ய வேண்டும்.[a] அதன் இரு பக்கப்பலகைகளிலும், அதாவது அதன் இரு பக்கங்களிலும், அவற்றைச் செய்ய வேண்டும்.[b] அதைச் சுமப்பதற்கான தண்டுகளைச் செருகும் பிடிப்பிடங்களாக அந்த வளையங்கள் இருக்க வேண்டும்.[c]
  to: அதன் அலங்கார விளிம்புக்குக் கீழே அதற்கு இரண்டு தங்க வளையங்களைச் செய்ய வேண்டும்.[a] அதன் இரு பக்க அமைப்புகளில் அவற்றைச் செய்ய வேண்டும்; அதன் இரு பக்கங்களிலும் அவற்றைச் செய்ய வேண்டும்.[b] அவை தண்டுகளுக்கான இடங்களாக இருக்க வேண்டும்; அவற்றால் அதைச் சுமக்க வேண்டும்.[c]
  rationale: 'The revision preserves the Hebrew’s repeated placement language without harmonizing its two terms in the main text, improves the opening Tamil idiom, and uses a less mechanically specific expression for the rings’ role as receptacles for the carrying poles. It also makes the final instrumental sense explicit: the altar is carried by means of the poles.'
