  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: ta
  text: அதன் அலங்கார விளிம்புக்குக் கீழே அதற்கு இரண்டு தங்க வளையங்களைச் செய்ய வேண்டும்.[a] அதன் இரு பக்க அமைப்புகளில் அவற்றைச் செய்ய வேண்டும்; அதன் இரு பக்கங்களிலும் அவற்றைச் செய்ய வேண்டும்.[b] அவை தண்டுகளுக்கான இடங்களாக இருக்க வேண்டும்; அவற்றால் அதைச் சுமக்க வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அலங்கார விளிம்பு” என்பதற்கு “அலங்கார ஓரம்” அல்லது “சுற்றுவிளிம்பு” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பலிபீடத்தைச் சுற்றியிருந்த வேலைப்பாடுடைய விளிம்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அதன் இரு பக்க அமைப்புகளில் ... அதன் இரு பக்கங்களில்” என்று சற்றே திரும்பச் சொல்லப்படுகிறது; வளையங்கள் இரு பக்கங்களிலும் அமைக்கப்பட வேண்டும் என்பதை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: c
    text: சொற்சொல்லாக, “தண்டுகளுக்கான வீடுகளாக”; அதாவது சுமக்கும் தண்டுகளை ஏற்றுக்கொள்ளும் இடங்களாக அல்லது பிடிப்பிடங்களாக.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: தங்க வளையங்கள்
  rationale: வளையங்களையும் அவை செய்யப்பட்ட பொருளான தங்கத்தையும் இயல்பான நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: அதன் அலங்கார விளிம்புக்குக் கீழே
  rationale: זֵר என்பது பலிபீடத்தைச் சுற்றியிருந்த வேலைப்பாடுடைய அலங்கார ஓரத்தைக் குறிக்கிறது; ‘அலங்கார விளிம்பு’ அதன் வடிவத்தையும் பண்பையும் தெளிவுபடுத்துகிறது.
- source_word: צַלְעֹתָיו
  choice: அதன் இரு பக்கப்பலகைகளிலும்
  rationale: கட்டுமானச் சூழலில் צֵלָע என்பது ஒரு பொருளின் கட்டமைப்பான பக்கத்தை அல்லது பக்கப்பலகையைக் குறிக்கலாம்; ‘பக்கப்பலகைகள்’ இங்கு பொருத்தமான தெளிவை அளிக்கிறது.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: அதன் இரு பக்கங்களிலும்
  rationale: இரண்டு பக்கங்களிலும் வளையங்கள் அமைய வேண்டும் என்பதை எபிரெய உரையின் மறுவலியுறுத்தலுடன் காக்கிறது.
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: தண்டுகளைச் செருகும் பிடிப்பிடங்களாக அந்த வளையங்கள் இருக்க வேண்டும்
  rationale: ‘தண்டுகளுக்கான வீடுகள்’ என்ற சொற்சொல் அமைப்பு இங்கு தண்டுகளை ஏற்கும் செருகிடங்கள் அல்லது பிடிப்பிடங்களைக் குறிக்கும்; தமிழில் செயல்பாட்டைத் தெளிவாகச் சொல்கிறது.
- source_word: בַדִּים
  choice: தண்டுகள்
  rationale: ஆசரிப்புக்கூடப் பொருட்களை எடுத்துச் செல்லப் பயன்படும் நீண்ட சுமக்கும் தண்டுகளைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: அதைச் சுமப்பதற்கான
  rationale: தண்டுகளின் நோக்கத்தையும் அவற்றின் மூலமாகப் பலிபீடம் சுமக்கப்படுவதையும் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: செய்ய வேண்டும் ... செய்ய வேண்டும்
  rationale: அறிவுறுத்தலின் கட்டளைத் தொனியையும் மூலத்தில் உள்ள வினைச்சொல் மீளுரைப்பையும் நவீனத் தமிழில் காக்கிறது.
