translation:
  language: ta
  text: நீ ஆரோனுக்கும் அவன் மகன்களுக்கும் அபிஷேகம் செய்ய வேண்டும்; அவர்கள் எனக்கு ஆசாரியர்களாகப் பணியாற்றும்படி அவர்களைப் புனிதப்படுத்தவும் வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: அபிஷேகம் செய்து
  rationale: משׁח என்பது புனித எண்ணெயைப் பூசி ஒருவரைத் திருப்பணிக்காக நியமிக்கும் சடங்கைக் குறிக்கிறது. தமிழில் வழக்கமான வேதாகமச் சொல்லான ‘அபிஷேகம்’ அந்தச் சடங்கு மற்றும் இறையியல் பொருளைத் தக்கவைக்கிறது.
- source_word: וְקִדַּשְׁתָּ
  choice: புனிதப்படுத்த வேண்டும்
  rationale: קדשׁ என்பதன் தீவிர வினைவடிவம் ஒருவரைப் புனிதமான பணிக்காகத் தனியே பிரித்து வைப்பதைக் குறிக்கிறது. ‘புனிதப்படுத்த’ என்பது இங்கு இயல்பாகவும் சடங்கு சார்ந்த வலிமையைத் தக்கவைத்தும் உள்ளது; ‘வேண்டும்’ கட்டளையின் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְכַהֵן
  choice: ஆசாரியர்களாகப் பணியாற்றும்படி
  rationale: כהן என்ற வினை ஆசாரியப் பொறுப்பில் செயல்படுவதைக் குறிக்கிறது. ‘ஆசாரியர்களாகப் பணியாற்ற’ என்பது பதவியையும் செயலையும் நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: முதலாம் நபர் பின்னொட்டுடன் வரும் לְ, சேவை யாவேக்கு உரியதாகவும் அவரை நோக்கியதாகவும் இருப்பதைக் குறிக்கிறது. ‘எனக்கு’ என்பது அதன் நேரடியான தமிழ் இணை.
- source_word: בָּנָיו
  choice: அவன் மகன்கள்
  rationale: எபிரெயச் சொல் குறிப்பாக ‘மகன்கள்’ என்று கூறுகிறது; ஆசாரிய மரபின் சூழலிலும் ஆண் சந்ததியினரே இங்கு குறிக்கப்படுகின்றனர்.
- source_word: וְאֶת ... וְאֶת
  choice: ஆரோனையும் அவன் மகன்களையும்
  rationale: மீண்டும் வரும் நேரடிச் செயப்படுபொருள் அடையாளம் ஆரோனையும் அவன் மகன்களையும் தனித்தனியாகக் குறிக்கிறது. தமிழ் ‘-ஐயும் ... -ஐயும்’ அமைப்பு இதை இயல்பாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: קדשׁ மற்றும் כהן ஆகியவற்றின் ஆசாரிய நியமனச் சூழல்
  choice: ‘புனிதப்படுத்த’ மற்றும் ‘ஆசாரியர்களாகப் பணியாற்ற’
  alternative: ‘அர்ப்பணிக்க’ மற்றும் ‘ஆசாரிய ஊழியம் செய்ய’
  rationale: வசனம் ஆரோனையும் அவன் மகன்களையும் புனிதமான ஆசாரியப் பணிக்காகத் தனியே பிரித்து நியமிப்பதைப் பற்றியது. தேர்ந்த சொற்கள் பிற்காலத் திருச்சபைப் பதவிக் கருத்துகளைச் சேர்க்காமல், மூலத்தின் சடங்கு சார்ந்த பொருளைத் தெளிவாகக் காக்கின்றன.
- issue: בָּנָיו என்பதன் பாலினக் குறிப்பு
  choice: ‘அவன் மகன்கள்’
  alternative: ‘அவன் பிள்ளைகள்’
  rationale: மூலச்சொல் ஆண்பாலைக் குறிப்பாகச் சுட்டுகிறது; சூழலும் ஆரோனின் ஆண் ஆசாரிய வழித்தோன்றல்களைக் குறிக்கிறது. ஆகவே பாலின வேறுபாட்டை பொதுமைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘அபிஷேகம்’ மற்றும் ‘ஆசாரியர்’ ஆகிய நிலைபெற்ற சமயச் சொற்கள் சடங்கு சார்ந்த துல்லியத்திற்காக வைக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு கட்டளையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
