revisions:
- from: எண்ணப்பட்டவர்களிடம் கடந்து செல்கிற இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய ஒவ்வொருவனும்[a] யாவேக்கு உரிய காணிக்கையைக் கொடுக்க வேண்டும்.
  to: எண்ணப்பட்டவர்களுள் சேரக் கடந்து செல்லும், இருபது வயது முதல் அதற்கு மேற்பட்ட ஒவ்வொருவரும் யாவேக்கான காணிக்கையைக் கொடுக்க வேண்டும்.[a]
