  text: כֹּ֗ל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה יִתֵּ֖ן תְּרוּמַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: ta
  text: எண்ணப்பட்டவர்களுள் சேரக் கடந்து செல்லும், இருபது வயது முதல் அதற்கு மேற்பட்ட ஒவ்வொருவரும் யாவேக்கான காணிக்கையைக் கொடுக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எண்ணப்பட்டவர்களுக்குள் கடந்து செல்லும் ஒவ்வொருவரும்.” எபிரெய வழக்கு, கணக்கெடுப்பு நடைமுறையில் ஒருவர் எண்ணப்பட்டவர்களோடு சேர்வதற்காக ‘கடந்து செல்வதை’ நேரடியாகச் சொல்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעֹבֵר
  choice: கடந்து செல்கிற ... ஒவ்வொருவனும்
  rationale: כֹּל என்பது பின்வரும் வினையெச்சத் தொடருடன் சேர்ந்து ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கிறது; ஆண்பால் ஒருமை வடிவமும் மக்கள் கணக்கெடுப்பின் சூழலும் தமிழில் ‘ஒவ்வொருவனும்’ எனத் தரப்பட்டுள்ளன. עבר என்பதன் இயக்கப் படிமத்தை ‘கடந்து செல்கிற’ தக்கவைக்கிறது.
- source_word: עַל הַפְּקֻדִים
  choice: எண்ணப்பட்டவர்களிடம்
  rationale: פְּקֻדִים இங்கு கணக்கெடுப்பில் எண்ணப்பட்ட அல்லது பதிவுசெய்யப்பட்டவர்களைக் குறிக்கிறது. עבר ... עַל என்ற சற்றே தெளிவற்ற எபிரெய வழக்கை முற்றிலும் ‘எண்ணப்படுகிறவன்’ என்று சுருக்காமல், இயக்கமும் கணக்கெடுப்பு தொடர்பும் நிலைக்குமாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்ட வயதும் உடைய
  rationale: வயது வரம்பைக் குறிக்கும் எபிரெய சட்டச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: יִתֵּן
  choice: கொடுக்க வேண்டும்
  rationale: இங்குள்ள imperfect வடிவம் சட்டக் கட்டளையின் வலிமையைக் கொண்டது; ‘வேண்டும்’ நவீனத் தமிழில் அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְּרוּמַת
  choice: உரிய காணிக்கை
  rationale: תְּרוּמָה என்பது யாவேக்கென ஒதுக்கப்படும் பங்களிப்பு அல்லது காணிக்கையைக் குறிக்கிறது. இந்த வசூல் சூழலில் ‘காணிக்கை’ மதச்சார்ந்த ஒதுக்குதலைப் பாதுகாக்கிறது; ‘உரிய’ construct உறவைத் தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பெயரைப் பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: மக்கள் கணக்கெடுப்பு வழக்கின் வெளிப்படைத்தன்மை
  choice: எண்ணப்பட்டவர்களிடம் கடந்து செல்கிற
  alternative: எண்ணப்பட்டவர்களில் ஒருவன்
  rationale: எபிரெய உரையில் உள்ள ‘கடந்து செல்’ என்ற நடைமுறைப் படிமத்தையும், עַל உடனான தொடர்பில் காணப்படும் உண்மையான தெளிவின்மையையும் தக்கவைக்கிறது; மாற்று வாசிப்பு பொருளை அதிகமாகத் தீர்மானித்துவிடும்.
translation_notes:
  register: நவீன, மரியாதைமிக்க சட்டநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய கணக்கெடுப்பு வழக்கின் இயக்கப் படிமம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, அதன் மாற்று புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
