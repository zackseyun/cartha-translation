translation:
  language: ta
  text: தகனபலிப் பீடத்தையும் அதன் எல்லா உபகரணங்களையும், தொட்டியையும் அதன் தாங்கியையும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: தகனபலிப் பீடம்
  rationale: מִזְבַּח என்பது ‘பலிபீடம்’; הָעֹלָה என்பது முழுவதும் எரிக்கப்படும் தகனபலியைக் குறிக்கிறது. ‘தகனபலிப் பீடம்’ என்பது சுருக்கமாகவும் இயல்பாகவும் பலியின் தன்மையைப் பாதுகாக்கிறது.
- source_word: כָּל כֵּלָיו
  choice: அதன் எல்லா உபகரணங்கள்
  rationale: כְּלִי இச்சூழலில் பாத்திரங்கள், கருவிகள் உள்ளிட்ட பலிபீடப் பயன்பாட்டுப் பொருட்களை உள்ளடக்குகிறது. ‘உபகரணங்கள்’ இந்த விரிவை நவீன தமிழில் இயல்பாகக் காட்டுகிறது; உடைமை விகுதி பலிபீடத்தையே சுட்டுகிறது.
- source_word: הַכִּיֹּר
  choice: தொட்டி
  rationale: כִּיּוֹר ஆசரிப்புக்கான கழுவும் நீர்த்தொட்டியைக் குறிக்கிறது. ‘தொட்டி’ என்பது பழமையான தொழில்நுட்பச் சொல்லைத் தவிர்த்து பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כַּנּוֹ
  choice: அதன் தாங்கி
  rationale: כֵּן இங்கு தொட்டியைத் தாங்கும் அமைப்பு அல்லது அடிப்பீடத்தைக் குறிக்கிறது. ‘தாங்கி’ அதன் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது; ‘அடித்தளம்’ என்பதும் சாத்தியம்.
- source_word: וְאֶת
  choice: -ஐயும் / -ஐ
  rationale: மீண்டும் வரும் וְאֶת பட்டியலின் நேரடி செயப்படுபொருட்களை இணைக்கிறது. தமிழில் தனி நேரடி செயப்படுபொருள் குறிப்பான் இல்லாததால், வேற்றுமை உருபுடன் இணைப்புத் துகள் ‘உம்’ பயன்படுத்தப்பட்டு, இறுதி உறுப்பில் இயல்பான பட்டியல் அமைப்பு தரப்படுகிறது.
