  text: וְ/כִפֶּ֤ר אַהֲרֹן֙ עַל קַרְנֹתָ֔י/ו אַחַ֖ת בַּ/שָּׁנָ֑ה מִ/דַּ֞ם חַטַּ֣את הַ/כִּפֻּרִ֗ים אַחַ֤ת בַּ/שָּׁנָה֙ יְכַפֵּ֤ר עָלָי/ו֙ לְ/דֹרֹ֣תֵי/כֶ֔ם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: ta
  text: ஆரோன் அதன் கொம்புகளின்மேல் ஆண்டுக்கு ஒருமுறை பாவநிவிர்த்தி செய்ய வேண்டும். பாவநிவிர்த்திக்கான பாவப்பலியின் இரத்தத்தால்[a] அவன் ஆண்டுக்கு ஒருமுறை அதன்மேல் பாவநிவிர்த்தி செய்ய வேண்டும்; உங்கள் தலைமுறைகள்தோறும் அவ்வாறே செய்ய வேண்டும். அது யெகோவாவுக்கு மகா பரிசுத்தமானது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவநிவிர்த்திகளுக்குரிய பாவப்பலியின் இரத்தத்தால்.” எபிரெயச் சொற்றொடர் எழுத்துப்படி, “பாவநிவிர்த்திகளின் பாவப்பலியின் இரத்தத்திலிருந்து” என உள்ளது.
    reason: மூல எபிரெயப் பன்மை வடிவத்தையும் מִן முன்னிடைச்சொல்லின் சொற்படியான அமைப்பையும் வெளிப்படுத்தும் சொல் மாற்று.
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: பாவநிவிர்த்தி செய்ய வேண்டும்
  rationale: ஆசாரியச் சடங்குச் சூழலில் כפר என்பது பாவநிவிர்த்திச் சடங்கை நிறைவேற்றுவதைக் குறிக்கிறது; தமிழில் நிலைபெற்றதும் புரிந்துகொள்ளத்தக்கதுமான இணைச்சொல் இது.
- source_word: קַרְנֹתָיו
  choice: அதன் கொம்புகளின்மேல்
  rationale: ஆண்பால் இலக்கணப் பின்னொட்டு முந்தைய சூழலிலுள்ள தூபபீடத்தைக் குறிக்கிறது; உயிரற்ற பீடத்துக்கு இயல்பான தமிழ் ஒருமைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டது.
- source_word: אַחַת בַּשָּׁנָה
  choice: ஆண்டுக்கு ஒருமுறை
  rationale: சடங்கின் நிகழ்வெண்ணைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: מִדַּם
  choice: இரத்தத்தால்
  rationale: מִן எழுத்துப்படி ‘இரத்தத்திலிருந்து’ என்றாலும், இங்கு சடங்கின் கருவி அல்லது வழிமுறையைக் குறிப்பதால் ‘இரத்தத்தால்’ என்பது இயல்பானது.
- source_word: חַטַּאת
  choice: பாவப்பலி
  rationale: பலியியல் சூழலில் இச்சொல் கருத்தியல் பாவத்தை அல்ல, பாவத்துக்காகச் செலுத்தப்படும் பலியைக் குறிக்கிறது.
- source_word: הַכִּפֻּרִים
  choice: பாவநிவிர்த்திக்கான
  rationale: எபிரெயப் பன்மை வடிவம் சடங்குசார் பாவநிவிர்த்தியைச் சுட்டுகிறது; தமிழில் சொற்படியான ‘பாவநிவிர்த்திகளின்’ என்பது இயல்பற்றதால் பொருளைத் தெளிவாக்கும் வடிவம் தேர்ந்தெடுக்கப்பட்டது, அடிப்படை அமைப்பு அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
- source_word: לְדֹרֹתֵיכֶם
  choice: இது தலைமுறைதோறும் கடைப்பிடிக்கப்பட வேண்டும்
  rationale: கட்டளையின் தொடர்ச்சியான அமல்பாட்டை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது; எபிரெயத்தின் ‘உங்கள் தலைமுறைகளுக்கு’ என்ற சொற்படி அமைப்பை இயல்பாக்குகிறது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானது
  rationale: எபிரெய உயர்நிலைச் சொல்லமைப்பைத் தமிழில் தெளிவான உச்சநிலைப் பரிசுத்த வகைப்பாடாகக் காட்டுகிறது; உள் பரிசுத்த இடத்துடன் குழப்பம் ஏற்படுவதைத் தவிர்க்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைத் தமிழில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கமாக வெளிப்படையாகக் கொடுக்கிறது; לְ அர்ப்பணிப்பு அல்லது உறவைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்பதன் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் இருப்பதை மறைக்காமல், தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும் ‘யெகோவா’ என்று வழங்கப்பட்டது; ‘யாவே’ என்பது மூல உச்சரிப்புக்கு நெருக்கமான மாற்று.
- issue: כפר என்பதன் சடங்குசார் பொருள்
  choice: பாவநிவிர்த்தி செய்ய
  alternative: தூய்மைப்படுத்த / பரிகாரம் செய்ய
  rationale: சடங்கு பீடத்தைச் சார்ந்திருந்தாலும், சொல்லில் உள்ள பாவநிவிர்த்தி மற்றும் தூய்மைப்படுத்தல் பொருட்களுக்கிடையேயான இறையியல் அழுத்தத்தை ஒருதலைப்பட்சமாகத் தீர்க்காமல் மரபாகத் தெளிவான சொல்லை வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். பலியியல் சொற்களில் மரபாகப் புரிந்துகொள்ளப்படும் ‘பாவநிவிர்த்தி’, ‘பாவப்பலி’, ‘மகா பரிசுத்தம்’ ஆகியவை பயன்படுத்தப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியத்தின் உறவுகளைத் தெளிவாக்க அரைப்புள்ளி இடப்பட்டு, தலைமுறைப் பயன்பாடு இயல்பான வாக்கியமாக்கப்பட்டது.
