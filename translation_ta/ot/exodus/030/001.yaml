  yaml_path: translation/ot/exodus/030/001.yaml
  text: And you shall make an altar for burning incense[a]; you shall make it of acacia wood.
translation:
  language: ta
  text: “தூபம் எரிப்பதற்காக ஓர் பலிபீடத்தைச் செய்வாயாக[a]; அதை அகேசியா மரத்தால் செய்வாயாக.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதைச் சுருக்கமாக, “தூபப் பலிபீடம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடரின் நேரடியான பொருள், “தூபம் எரிப்பதற்கான பலிபீடம்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்வாயாக
  rationale: இணைப்புடன் வந்த Qal perfect 2ms, தொடர்ச்சியான கட்டளைகளின் சூழலில் உத்தரவாகச் செயல்படுகிறது. தமிழில் ‘செய்வாயாக’ என்பது கண்ணியமான கட்டளை நடையை இயல்பாகத் தருகிறது.
- source_word: מִזְבֵּחַ
  choice: ஓர் பலிபீடத்தை
  rationale: பலியிடுதல் அல்லது அர்ப்பணித்தலுக்குரிய பீடத்தைக் குறிக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்; இங்கு புதிதாக அறிமுகமாகும் பொருளுக்கு ‘ஓர்’ பொருத்தமானது.
- source_word: מִקְטַר קְטֹרֶת
  choice: தூபம் எரிப்பதற்காக
  rationale: எபிரெயக் கட்டமைப்பு தூபம் எரிக்கும் செயலை அல்லது நோக்கத்தைச் சுட்டுகிறது. இத்தேர்வு அதை ஒரு சுருக்கமான பொருட்பெயராக மாற்றாமல், பலிபீடத்தின் செயல்பாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עֲצֵי שִׁטִּים
  choice: சீத்திம் மரத்தால்
  rationale: இது அகேசியா வகை மரத்தைக் குறிக்கிறது. ‘சீத்திம் மரம்’ என்பது இச்சூழலில் பரவலாக அறியப்பட்ட தமிழ் வேதாகமப் பெயர்; பொருளைக் குறிக்கும் கருவிவேற்றுமை தமிழில் இயல்பாக உள்ளது.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: அதைச் ... செய்வாயாக
  rationale: இரண்டாம் ஆண்பால் ஒருமை வினையும் நேரடி பொருள் சுட்டுப்பெயரும் முந்தைய கட்டளையை மீண்டும் எடுத்துரைக்கின்றன. தமிழிலும் இதை மீளக் கூறுவது மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது.
