base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: ta
  text: அவர்கள் சந்திப்புக் கூடாரத்திற்குள் நுழையும்போதும், அல்லது பணிவிடை செய்யவும் யாவேக்கு நெருப்புப் பலியைப் புகையாக எழும்பச் செய்யவும் பலிபீடத்தை நெருங்கும்போதும், சாகாதபடி தண்ணீரால் கழுவிக்கொள்ள வேண்டும்[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தண்ணீரால் கழுவிக்கொள்ள வேண்டும்; அப்போது அவர்கள் சாகமாட்டார்கள்.”
    reason: וְלֹא יָמֻתוּ என்பதை நோக்கக் கூற்றாகவும், முறையாக இணைக்கப்பட்ட விளைவுக் கூற்றாகவும் புரிந்துகொள்ளலாம்.
  - marker: b
    text: “நெருப்புப் பலி” என்பதற்கு அல்லது, “உணவுப் பலி.”
    reason: אִשֶּׁה என்பதற்கு நெருப்பில் செலுத்தப்படும் பலி என்ற வடிவக் கருத்தும், இறைவனுக்குச் செலுத்தப்படும் உணவுப் பலி என்ற செயல்பாட்டுக் கருத்தும் முன்வைக்கப்படுகின்றன.
lexical_decisions:
- source_word: בְּבֹאָם
  choice: அவர்கள் ... நுழையும்போது
  rationale: בְּ + வினையெச்சப் பெயர் மற்றும் பன்மை உரிமை விகுதி காலச் சூழலைக் குறிக்கின்றன; கூடாரத்திற்குள் செல்லும் இயக்கத்தை ‘நுழையும்போது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இறைவன் இஸ்ரவேலரைச் சந்திக்கும் பரிசுத்தக் கூடாரத்தைக் குறிக்கும் நிலையான, தெளிவான தமிழ் சொற்றொடர்.
- source_word: יִרְחֲצוּ מַיִם
  choice: தண்ணீரால் கழுவிக்கொள்ள வேண்டும்
  rationale: רחץ உடன் מים வருவதால் தண்ணீரைப் பயன்படுத்திய சடங்குத் தூய்மைப்படுத்தல் குறிக்கப்படுகிறது; தமிழில் தன்மைப் பொருளை ‘கழுவிக்கொள்ள’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא יָמֻתוּ
  choice: சாகாதபடி
  rationale: எபிரெயத்தில் முறையாக இணைக்கப்பட்ட கூற்றாக இருந்தாலும், சூழலில் கழுவுதலின் நோக்கம் அல்லது விளைவைக் குறிக்கிறது; எச்சரிக்கையின் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: אוֹ
  choice: அல்லது
  rationale: கழுவுதல் தேவைப்படும் இரண்டாவது சூழலை அறிமுகப்படுத்தும் எளிய பிரிநிலை இணைப்புச் சொல்.
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: பலிபீடத்தை நெருங்கும்போதும்
  rationale: נגשׁ என்பது வழிபாட்டுச் சூழலில் அணுகுதல் அல்லது நெருங்குதலைக் குறிக்கிறது; ‘-உம்’ முதல் சூழலுடன் இரண்டாவதையும் இணைக்கிறது.
- source_word: לְשָׁרֵת
  choice: பணிவிடை செய்ய
  rationale: ஆசாரியர்களின் முறையான பரிசுத்தப் பணியைப் பொதுவான ‘சேவை’ என்பதைக் காட்டிலும் தெளிவாகக் குறிக்கிறது.
- source_word: לְהַקְטִיר
  choice: எரித்துப் புகையாக எழும்பச் செய்ய
  rationale: קטר என்பதன் ஹிபீல் வடிவம் பலியைப் பலிபீடத்தில் புகையாக எழும்பச் செய்வதைக் குறிக்கிறது; வெறும் ‘எரிக்க’ என்பதைவிட மூலத்தின் பலிசார் செயலைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: אִשֶּׁה
  choice: நெருப்புப் பலி
  rationale: நெருப்பின் வழியாகச் செலுத்தப்படும் பலிக்கான வழிபாட்டுச் சொல்லாக இது புரிந்துகொள்ளப்படுகிறது; ‘உணவுப் பலி’ என்ற செயல்பாட்டு விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல் விடுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பொதுப்பட்டத்தால் மாற்றாமல் பெயராக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது; ‘யாவே’ அந்த உடன்படிக்கைப் பெயரைப் பெயராகவே தக்கவைக்கிறது.
- issue: וְלֹא יָמֻתוּ என்ற மரணத் தண்டனைக்குரிய கூற்று
  choice: சாகாதபடி
  alternative: அவர்கள் சாகமாட்டார்கள்
  rationale: கழுவுதலுடன் இணைந்த உண்மையான மரண எச்சரிக்கையைத் தக்கவைத்தபடி, தமிழில் நோக்கம் அல்லது தடுப்பு விளைவாக இயல்பாகக் கூறுகிறது; முறையான இணைப்புக் கூற்றும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אִשֶּׁה என்ற பலிசார் சொல்லின் பொருள்
  choice: நெருப்புப் பலி
  alternative: உணவுப் பலி
  rationale: சொல் நெருப்பில் செலுத்தப்படும் பலியைக் குறிக்கலாம்; அதை இறைவனுக்கான ‘உணவு’ என்ற செயல்பாட்டு விளக்கமாக மட்டும் தீர்மானிக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. இரண்டாவது சூழலில் ‘கழுவிக்கொள்ள வேண்டும்’ என்பது தமிழ்த் தெளிவுக்காக மீண்டும் வெளிப்படையாகக் கூறப்பட்டுள்ளது.
