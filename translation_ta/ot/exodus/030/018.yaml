  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டுச் சூழலுக்குரிய கண்ணியத்துடனும் மொழியாக்கம் செய்யப்பட்டது. மூலத்தின் இரண்டாம் நபர் ஒருமைக் கட்டளை நடை காக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் இடம்பெற்றுள்ளன.
