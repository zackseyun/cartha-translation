  text: וְ/עָשִׂ֜יתָ כִּיּ֥וֹר נְחֹ֛שֶׁת וְ/כַנּ֥/וֹ נְחֹ֖שֶׁת לְ/רָחְצָ֑ה וְ/נָתַתָּ֣ אֹת֗/וֹ בֵּֽין אֹ֤הֶל מוֹעֵד֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ וְ/נָתַתָּ֥ שָׁ֖מָּ/ה מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: ta
  text: “கழுவுவதற்காக, நீ வெண்கலத்தால்[c] ஒரு கழுவும் தொட்டியையும்[a], அதன் வெண்கலத் தாங்கியையும்[b] செய்ய வேண்டும். அதைச் சந்திப்புக் கூடாரத்துக்கும் பலிபீடத்துக்கும் இடையில் வைத்து, அங்கே தண்ணீரை வைக்க வேண்டும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கழுவும் தொட்டி’ என்பதற்கு ‘கழுவும் கலம்’ என்றும் மொழிபெயர்க்கலாம்; இது கூடார வழிபாட்டில் பயன்படுத்தப்பட்ட பெரிய நீர்க்கலம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தாங்கி’ என்பதற்கு ‘அடித்தளம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘வெண்கலம்’ என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல், சூழலைப் பொறுத்து ‘செம்பு’ அல்லது செம்புக் கலவையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: கழுவும் தொட்டி
  rationale: திருவாசஸ்தலப் பணியில் கழுவுவதற்கான பெரிய நீர்க்கலத்தை குறிக்கிறது. ‘கழுவும் தொட்டி’ என்பது அதன் பயன்பாட்டை இயல்பான நவீன தமிழில் தெளிவுபடுத்துகிறது; வெறும் ‘தொட்டி’ என்பதைக் காட்டிலும் சூழலுக்கு ஏற்றது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: இச்சொல் செம்பையோ செம்புக் கலவையையோ குறிக்கலாம். திருவாசஸ்தலப் பொருட்களின் சூழலில் நிலைபெற்ற, பொருத்தமான தமிழ்ச் சொலாக ‘வெண்கலம்’ தேர்ந்தெடுக்கப்பட்டது; மாற்று வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כַּן
  choice: தாங்கி
  rationale: தொட்டியைத் தாங்கும் அமைப்பைக் குறிக்கிறது. ‘தாங்கி’ அதன் செயல்பாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘அடித்தளம்’ என்பதும் சாத்தியம்.
- source_word: לְרָחְצָה
  choice: கழுவுவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் எபிரெய infinitive வடிவத்தை நேரடியாகக் காக்கிறது. யார் அல்லது எதை கழுவுவது என்பதை இவ்வசனம் வெளிப்படையாகக் கூறாததால், கூடுதல் பொருள் சேர்க்கப்படவில்லை.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் தமது மக்களைச் சந்திக்கும் கூடாரத்தைக் குறிக்கும் பெயராக, மூலத்தின் பொருளையும் வழக்கமான வேதாகமத் தமிழின் கண்ணியத்தையும் காக்கிறது.
- source_word: מִזְבֵּחַ
  choice: பலிபீடம்
  rationale: இச்சூழலில் பலி செலுத்தும் பீடத்தைக் குறிக்கும் தெளிவான, நிலைபெற்ற தமிழாக்கம்.
- source_word: שָׁמָּה
  choice: அதில்
  rationale: மூலத்தில் சொற்பட ‘அங்கே’ என்று இருந்தாலும், இங்கே தண்ணீர் தொட்டிக்குள் ஊற்றப்பட வேண்டும் என்பதே சூழலின் இயல்பான குறிப்பு. தமிழில் ‘அதில்’ என்பது சுட்டுப்பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் இயல்பான நவீன தமிழ்ச் சொல்.
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: செய்ய வேண்டும் ... வைத்து ... ஊற்ற வேண்டும்
  rationale: வழிபாட்டு ஏற்பாடுகளைப் பற்றிய கட்டளைத் தொடரின் வலிமையை ‘வேண்டும்’ வடிவம் காக்கிறது; தமிழில் தேவையற்ற மீளுரையைத் தவிர்த்து வாக்கியம் இயல்பாக அமைக்கப்பட்டது.
