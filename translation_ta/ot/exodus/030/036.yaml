base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: ta
  text: 'அதில் சிறிதை மிக நுண்ணிய பொடியாக அரைத்து, அதிலிருந்து சிறிதைச் சாட்சியின் முன், நான் உன்னைச் சந்திக்கும் சந்திப்புக் கூடாரத்தில் வை. அது உங்களுக்கு மிகப் பரிசுத்தமானது.[a]


    [a] சொல்லுக்குச் சொல்லாக, “பரிசுத்தங்களின் பரிசுத்தம்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல்லாக, “பரிசுத்தங்களின் பரிசுத்தம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַקְתָּ מִמֶּנָּה הָדֵק
  choice: அதில் சிறிதை எடுத்து மிகவும் நுண்ணிய பொடியாக அரைத்து
  rationale: שׁחק என்பது இச்சூழலில் தூபக் கலவையைப் பொடியாக்குவதைக் குறிக்கிறது; מִמֶּנָּה பகுதியைக் குறிக்கும்; הָדֵק மிக நுண்ணிய தன்மையை வலியுறுத்துகிறது. இயல்பான தமிழுக்காக ‘எடுத்து’ மற்றும் ‘பொடியாக’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளன.
- source_word: וְנָתַתָּה מִמֶּנָּה
  choice: அதில் சிறிதை வைக்க வேண்டும்
  rationale: נתן இங்கு சடங்குசார் இடத்தில் வைப்பதைக் குறிக்கிறது; இரண்டாவது מִמֶּנָּהவும் முழுவதிலிருந்து ஒரு பகுதியைக் குறிக்கிறது.
- source_word: לִפְנֵי הָעֵדֻת
  choice: சாட்சியின் முன்
  rationale: எபிரெய உரை பெட்டியையோ பலகைகளையோ வெளிப்படையாகக் குறிப்பிடாமல் ‘சாட்சி’ என்று மட்டுமே கூறுவதால், அந்த வழிபாட்டுச் சொல்லின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தில்
  rationale: தேவனும் அவருடைய மக்களும் சந்திக்கும் இடம் என்ற பெயரின் பொருளைத் தக்கவைக்கும், தெளிவான நவீனத் தமிழ் வடிவம்.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: நான் உன்னைச் சந்திக்கும்
  rationale: יעד என்பதன் நிஃபால் வடிவம் இங்கு நியமிக்கப்பட்ட சந்திப்பைக் குறிக்கிறது; தமிழில் இயல்பாகவும் நேரடியாகவும் தரப்பட்டுள்ளது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானதாக
  rationale: எபிரெயச் சேர்க்கை உயர்நிலைப் பரிசுத்தத்தை உணர்த்துகிறது. ‘மகா பரிசுத்தம்’ நவீனத் தமிழில் பொருளைத் தெளிவாகத் தருகிறது; சொல்லுக்குச் சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תִּהְיֶה לָכֶם
  choice: அது உங்களுக்கு ... இருக்கும்
  rationale: மூலத்தின் பன்மை ‘உங்களுக்கு’ என்பதில் பாதுகாக்கப்படுகிறது; இது உடைமையைவிட அவர்களுக்கான பரிசுத்த நிலையைச் சுட்டுகிறது.
theological_decisions:
- issue: ‘சாட்சி’ என்பதன் குறிப்புப்பொருள்
  choice: ‘சாட்சியின் முன்’ என்று மூலத்தின் வழிபாட்டுச் சொல்லை அப்படியே தக்கவைத்தல்
  alternative: ‘சாட்சிப் பெட்டியின் முன்’ அல்லது ‘உடன்படிக்கைப் பலகைகளின் முன்’
  rationale: வசனம் பெட்டியையோ பலகைகளையோ நேரடியாகப் பெயரிடவில்லை. ஒரு குறிப்பிட்ட விளக்கத்தை உரைக்குள் புகுத்தாமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: பரிசுத்தத்தின் உயர்நிலை வடிவம்
  choice: முதன்மை உரையில் ‘மகா பரிசுத்தமானதாக’
  alternative: ‘பரிசுத்தங்களின் பரிசுத்தம்’
  rationale: முதன்மை வடிவம் இயல்பான தமிழில் உயர்நிலையைத் தெரிவிக்கிறது; எபிரெய மொழியின் சொல்லுக்குச் சொல்லான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கட்டளையின் ஒருமை ‘உன்னை’ என்பதிலும், இறுதி உரையின் பன்மை ‘உங்களுக்கு’ என்பதிலும் மூலத்தின் எண்ணிக்கை வேறுபாடு பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் ‘மகா பரிசுத்தம்’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
