base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: ta
  text: அதன் மேற்பகுதியிலும், சுற்றிலுமுள்ள அதன் பக்கங்களிலும், அதன் கொம்புகளிலும் தூய தங்கத்தைப் பதிப்பாயாக. அதற்குச் சுற்றிலும் தங்க விளிம்பொன்றைச் செய்வாயாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: மூடுவாயாக
  rationale: צפה என்பது ஓர் பொருளின் மேற்பரப்பில் உலோகத்தைப் பதித்து மூடுவதைக் குறிக்கிறது. ‘தங்கத்தால் மூடு’ என்பது இங்கு இயல்பாகவும் தெளிவாகவும் அந்தச் செயலை வெளிப்படுத்துகிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: உயர்ந்த தூய்மையுள்ள தங்கத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் இணை.
- source_word: גַּגּוֹ
  choice: அதன் மேற்பகுதி
  rationale: גג பொதுவாக ‘கூரை’ எனப் பொருள்பட்டாலும், இங்கு சிறிய பலிபீடத்தின் மேலுள்ள பரப்பைக் குறிப்பதால் ‘மேற்பகுதி’ பொருத்தமானது.
- source_word: קִירֹתָיו
  choice: அதன் பக்கங்கள்
  rationale: சொல்லுக்கு நேரான பொருள் ‘சுவர்கள்’; ஆனால் சிறிய பலிபீடத்தின் செங்குத்தான வெளிப்பரப்புகளை நவீனத் தமிழில் ‘பக்கங்கள்’ என்பது இயல்பாகக் குறிக்கிறது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: முழுவதுமாகச் சூழ்ந்திருப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; வசனத்தில் வரும் இரு இடங்களிலும் மீளுருவாக்கம் காக்கப்பட்டுள்ளது.
- source_word: קַרְנֹתָיו
  choice: அதன் கொம்புகள்
  rationale: பலிபீடத்தின் மூலைகளில் நீண்டிருந்த வழிபாட்டுச் சிறப்புடைய பகுதிகளைக் குறிக்கும் மூல உருவகம் அப்படியே காக்கப்படுகிறது.
- source_word: וְעָשִׂיתָ לוֹ
  choice: அதற்கு … செய்வாயாக
  rationale: לּוֹ குறிக்கும் தொடர்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זֵר זָהָב
  choice: தங்க விளிம்பு
  rationale: זֵר என்பது பரிசுத்தக் கூடாரப் பொருளைச் சுற்றிய ஓரம், பட்டை அல்லது கிரீடம் போன்ற அலங்கார விளிம்பைக் குறிக்கலாம். ‘விளிம்பு’ உடல் வடிவைத் தெளிவாகக் காட்டி, தேவையற்ற அரசாட்சிப் பொருளைத் திணிக்காது.
theological_decisions:
- issue: வழிபாட்டுப் பொருட்களின் தொழில்நுட்பச் சொற்களை மொழிபெயர்த்தல்
  choice: קַרְנֹתָיו என்பதை ‘கொம்புகள்’ என்றும் זֵר என்பதை ‘விளிம்பு’ என்றும் வழங்குதல்
  alternative: זֵר என்பதை ‘கிரீடம்’ என வழங்குதல்
  rationale: இந்த வசனம் பலிபீடத்தின் கட்டமைப்பை விவரிக்கிறது; அரசாட்சியைப் பற்றிய இறையியல் கூற்றை முன்வைக்கவில்லை. ‘கொம்புகள்’ மூலத்தின் முக்கிய வழிபாட்டுச் சொல்லைத் தக்கவைக்கிறது; ‘விளிம்பு’ பொருளின் உடல் அமைப்பைத் தெளிவாகக் காட்டுகிறது. ‘கிரீடம்’ என்ற சாத்தியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கட்டளை நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. சிறிய பலிபீடத்தைக் கருத்தில் கொண்டு ‘சுவர்கள்’ என்பதற்குப் பதில் இயல்பான ‘பக்கங்கள்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் ‘சுற்றிலும்’ என்ற இரட்டிப்பு காக்கப்பட்டுள்ளது.
