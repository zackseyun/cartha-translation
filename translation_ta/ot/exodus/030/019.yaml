  yaml_path: translation/ot/exodus/030/019.yaml
  text: Aaron and his sons shall wash their hands and their feet from it[a].
translation:
  language: ta
  text: ஆரோனும் அவன் மகன்களும் அதிலிருந்து[a] தங்கள் கைகளையும் கால்களையும் கழுவ வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, “அதிலிருந்து எடுக்கப்பட்ட தண்ணீரால்.” சுற்றியுள்ள வசனங்களில் குறிப்பிடப்படும் தொட்டியையே “அது” குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: கழுவ வேண்டும்
  rationale: அறிவுறுத்தல் சூழலில் இணைப்புடன் வரும் Qal perfect கட்டளைசார் கடமையைக் குறிக்கிறது; நவீனத் தமிழில் ‘கழுவ வேண்டும்’ இயல்பாகவும் தெளிவாகவும் அந்த வலிமையைத் தருகிறது.
- source_word: אַהֲרֹן
  choice: ஆரோன்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: וּבָנָיו
  choice: அவனுடைய மகன்களும்
  rationale: இங்கு בנים ஆசாரியப் பணியில் ஈடுபடும் ஆரோனின் ஆண் சந்ததியினரைக் குறிக்கிறது; ஆகவே பாலினக் குறிப்பைத் துல்லியமாக வைத்திருக்க ‘மகன்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִמֶּנּוּ
  choice: அதிலிருந்து
  rationale: מן என்ற முன்னிடைச்சொல்லும் ஒருமை ஆண்பால் பதிலிடு பின்னொட்டும் சேர்ந்து ‘அதிலிருந்து’ என்று பொருள்படுகின்றன; சூழலில் இது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தொட்டியைக் குறிக்கிறது. ‘அதிலுள்ள தண்ணீரால்’ என்பது பொருளை வெளிப்படுத்தினாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘தண்ணீர்’ என்பதைக் கூட்டுவதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶת יְדֵיהֶם
  choice: தங்கள் கைகளை
  rationale: நேரடி செயப்படுபொருளாக, அவர்கள் கழுவ வேண்டிய உடல் உறுப்பைத் தெளிவாகக் குறிக்கிறது; ஒரே எழுவாயைத் திரும்பச் சுட்டுவதால் தமிழில் ‘தங்கள்’ இயல்பானது.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: கால்களையும்
  rationale: இரண்டாவது நேரடி செயப்படுபொருளை முதலாவதுடன் இணைக்கிறது; רגלים என்பதன் நேரடியான பொருள் ‘கால்கள்’.
theological_decisions:
- issue: ஆசாரியர்களைப் பற்றிய பாலினக் குறிப்பு
  choice: அவனுடைய மகன்கள்
  alternative: அவனுடைய பிள்ளைகள்
  rationale: இவ்வசனம் ஆரோனையும் ஆசாரியப் பணியில் சேவை செய்யும் அவனுடைய ஆண் வழியினரையும் குறிக்கிறது. ஆகவே எபிரெய உரையின் பாலினக் குறிப்பை பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, எளிதில் புரியும் தமிழ். சட்ட/வழிபாட்டு அறிவுறுத்தலின் வலிமையை ‘வேண்டும்’ காக்கிறது. மூலத்தின் ‘அதிலிருந்து’ என்ற சுருக்கமான அமைப்பும் அதன் சிறிய தெளிவின்மையும் முதன்மை உரையில் பாதுகாக்கப்பட்டு, சூழலால் விளங்கும் விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
