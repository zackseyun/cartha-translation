  yaml_path: translation/ot/exodus/030/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH” (יהוה); மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: இறைப் பெயரின் எபிரெய வடிவத்தையும் மரபான மாற்று மொழிபெயர்ப்பையும் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசிச் சொன்னார்
  rationale: דבר என்பதன் வழக்கமான ‘பேசினார்’ என்ற பொருளையும், தொடர்ந்து வரும் לֵאמֹר அறிமுகப்படுத்தும் உரையையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு மெய்யெழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
- source_word: אֶל
  choice: -இடம்
  rationale: பேச்சு நோக்கிச் செல்லும் நபரைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லுக்கு இயல்பான தமிழ் வேற்றுமை வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: இப்பெயரின் நிலைபெற்ற தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: மேற்கோள் உரையை அறிமுகப்படுத்தும் எபிரெய வாய்பாட்டை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; அடுத்த வசனத்தில் வரும் நேரடி உரைக்குத் தயார்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயரே உள்ளது. ‘கர்த்தர்’ என்னும் பட்டத்தால் அதை மாற்றாமல் பெயராகவே தரப்படுகிறது; தமிழ்ச் சூழலில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது. உச்சரிப்பு குறித்த அறிஞர் மறுவடிவமான ‘யாவே’ அடிக்குறிப்பில் சுட்டப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான வேதாகம நடையில், அடுத்த வசனத்தின் நேரடி உரையை அறிமுகப்படுத்தும் வகையில் இருபுள்ளி பயன்படுத்தப்பட்டுள்ளது.
