reference: Exodus 30:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ אֹתָ/הּ֙ קְטֹ֔רֶת רֹ֖קַח מַעֲשֵׂ֣ה רוֹקֵ֑חַ מְמֻלָּ֖ח טָה֥וֹר קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: ta
  text: அதை நறுமணக் கலவை செய்பவரின் கைவினைப்படி தயாரிக்கப்பட்ட தூபமாக[a] செய்வாய்; அது உப்பிடப்பட்டதாக[b], தூயதாக, பரிசுத்தமானதாக[c] இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கூட்டுக் கலவையான நறுமணப் பொருள்” அல்லது “நறுமணக் கலவை.” எபிரெயச் சொல் கவனமாகக் கலந்து தயாரிக்கப்பட்ட மணமுள்ள பொருளை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “உப்பு கலந்து” அல்லது “உப்பால் பதப்படுத்தப்பட்டதாக.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது “புனிதமானதாக.” எபிரெய மூலம் இவ்வசனத்தில் “பரிசுத்தமானது” என்றே கூறுகிறது; “மகா பரிசுத்தமானது” என்று கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்வாய்
  rationale: அறிவுறுத்தல் சூழலில் இணைப்புடன் வரும் எபிரெய வினை கட்டளையின் வலிமையைக் கொண்டுள்ளது. “செய்வாய்” சட்டரீதியான அறிவுறுத்தல் தொனியை இயல்பான தமிழில் காக்கிறது.
- source_word: אֹתָהּ
  choice: அதை
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பொருள்களின் கலவையைச் சுட்டும் நேரடி செயப்படுபொருள் சுட்டுப்பெயர்.
- source_word: קְטֹרֶת
  choice: தூபம்
  rationale: எரிப்பதற்காகத் தயாரிக்கப்படும் பரிசுத்த நறுமணக் கலவையை இச்சொல் குறிக்கிறது; “தூபம்” தமிழில் நிலைபெற்ற, துல்லியமான சொல்.
- source_word: רֹקַח
  choice: தயாரிக்கப்பட்ட நறுமணக் கலவை
  rationale: மணம் தரும் பொருள்களைத் திறமையாகக் கலந்து தயாரித்த கலவை என்ற கருத்தை வெளிப்படுத்துகிறது. தமிழில் செயப்பாட்டு வடிவம் அடுத்த சொற்றொடருடன் இயல்பாக இணைகிறது.
- source_word: מַעֲשֵׂה רוֹקֵחַ
  choice: நறுமணக் கலவை செய்பவரின் கைவினைப்படி
  rationale: சொல்லர்த்தமாக “கலவை செய்பவரின் வேலை.” திறமையான கைவினை என்ற கருத்தையும் தயாரிப்பவரின் பங்கையும் காக்கிறது.
- source_word: מְמֻלָּח
  choice: உப்பிடப்பட்டதாக
  rationale: உப்பு தொடர்பான வேர்ச்சொல்லின் செயப்பாட்டு எச்சம் என்பதால், உறுதியான சொல்லர்த்தமான “உப்பிடப்பட்ட” என்பதைக் காக்கிறது; “உப்பு கலந்து” என்பதும் சாத்தியம்.
- source_word: טָהוֹר
  choice: தூயதாக
  rationale: வழிபாட்டுக்கும் பொருளின் தரத்துக்கும் உரிய தூய்மையை “தூய” தெளிவாக உணர்த்துகிறது.
- source_word: קֹדֶשׁ
  choice: பரிசுத்தமானதாக
  rationale: கடவுளுக்கென்று பிரித்து வைக்கப்பட்ட நிலையை நேரடியாகக் குறிக்கிறது. இவ்வசனத்தில் “மகா பரிசுத்தம்” என்ற உயர்நிலை வடிவம் இல்லை.
theological_decisions:
- issue: தூபத்தின் வழிபாட்டு நிலை
  choice: பரிசுத்தமானது
  alternative: புனிதமானது; மகா பரிசுத்தமானது
  rationale: எபிரெய மூலத்தில் இங்கு “பரிசுத்தம்” என்ற சாதாரண வடிவமே உள்ளது; “மகா பரிசுத்தம்” என்று மொழிபெயர்ப்பது இவ்வசனம் வெளிப்படையாகக் கூறுவதைவிட வலிமையான வழிபாட்டு வகைப்பாட்டைச் சேர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெயப் பெயரடுக்கை தமிழில் இயல்பாக்குவதற்காக அரைப்புள்ளிக்குப் பின் பண்புகள் தனி வாக்கியக்கூறாக அமைக்கப்பட்டுள்ளன; மூலத்தின் கட்டளைத் தொனியும் வரிசையும் கருத்தளவில் காக்கப்பட்டுள்ளன.
