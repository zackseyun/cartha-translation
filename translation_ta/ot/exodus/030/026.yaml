  text: וּ/מָשַׁחְתָּ֥ ב֖/וֹ אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֖ת אֲר֥וֹן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/026.yaml
  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: ta
  text: அதைக் கொண்டு சந்திப்புக் கூடாரத்தையும் சாட்சிப் பேழையையும்[a] அபிஷேகம் செய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, “உடன்படிக்கைப் பேழை” என்றும் வழங்கப்படுகிறது; ஆனால் இங்குள்ள எபிரெயச் சொல் நேரடியாக “சாட்சி” என்று கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: அபிஷேகம் செய்
  rationale: Qal வினைமுற்று 2ஆம் நபர் ஆண்பால் ஒருமை வடிவம், தொடர்ச்சியான அறிவுறுத்தல் சூழலில் கட்டளையாகச் செயல்படுகிறது. משׁח என்பதன் வழிபாட்டுச் சூழலுக்குரிய துல்லியமான, பரவலாக அறியப்பட்ட தமிழ் சொற்றொடர் இது.
- source_word: בּוֹ
  choice: அதைக் கொண்டு
  rationale: ב முன்னொட்டுடன் கூடிய 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டு, முந்தைய சூழலில் உள்ள அபிஷேக எண்ணெயைக் குறிக்கிறது. ‘அதைக் கொண்டு’ என்பது கருவிப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: אֹהֶל என்பதன் கூடாரப் பொருளையும் מוֹעֵד என்பதன் சந்திப்பு/குறிக்கப்பட்ட கூடுகை சார்ந்த பொருளையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲרוֹן
  choice: பேழை
  rationale: திருக்கூடாரச் சூழலில் உள்ள புனிதப் பெட்டியைக் குறிக்கும் மரபறிந்த, கண்ணியமான தமிழ் இணைச்சொல்.
- source_word: הָעֵדֻת
  choice: சாட்சி
  rationale: எபிரெயச் சொல் இங்கு ‘உடன்படிக்கை’ என்று அல்ல, நேரடியாக ‘சாட்சி/சான்று’ என்று உள்ளது. இணைப்பெயரில் ‘சாட்சிப் பேழை’ என வழங்குவது மூலச் சொல்லைத் தக்கவைக்கிறது.
theological_decisions:
- issue: אֲרוֹן הָעֵדֻת என்பதன் மொழிபெயர்ப்பு
  choice: சாட்சிப் பேழை
  alternative: உடன்படிக்கைப் பேழை
  rationale: இந்த வசனத்தின் எபிரெய உரை ‘உடன்படிக்கை’ என்பதற்கான בְּרִית என்ற சொல்லைப் பயன்படுத்தாமல் הָעֵדֻת, ‘சாட்சி’ என்பதையே பயன்படுத்துகிறது. பரிச்சயமான மாற்றுப் பெயரை முதன்மை உரைக்குள் கொண்டுவராமல், மூலத்தின் சொல் வேறுபாடு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், நேரடியான ஒருமை கட்டளை நடையும் வழிபாட்டுச் சூழலுக்குரிய கண்ணியமான சொற்களும் பயன்படுத்தப்பட்டுள்ளன. ‘அதனால்’ எனும் காரணப்பொருள் குழப்பத்தைத் தவிர்க்க ‘அதைக் கொண்டு’ தேர்ந்தெடுக்கப்பட்டது.
