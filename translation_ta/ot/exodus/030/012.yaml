source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: ta
  text: “நீ இஸ்ரவேல் மகன்களை எண்ணிப் பதிவுசெய்யும்போது[a], அவர்களைக் கணக்கெடுக்கும்போது ஒவ்வொரு ஆணும் தன் உயிருக்கான மீட்புத்தொகையை யாவேக்கு கொடுக்க வேண்டும்[b]; அப்போது அவர்களைக் கணக்கெடுக்கும்போது அவர்களிடையே கொள்ளைநோய் உண்டாகாது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “இஸ்ரவேல் மகன்களின் தலையை உயர்த்தும்போது”; இது மக்களைக் கணக்கெடுப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “தன் உயிருக்கான மீட்புத்தொகை” என்பதை “தனக்கான மீட்புத்தொகை” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரேயச் சொல் உயிரையோ முழு நபரையோ குறிக்கலாம்; ‘ஆத்துமா’ என்பதை மட்டும் குறிக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: கணக்கெடுக்கும்போது
  rationale: இந்தச் சட்ட அறிவுறுத்தலில் எதிர்பார்க்கப்படும் ஒரு சந்தர்ப்பத்தை அறிமுகப்படுத்துவதால், நிபந்தனைக்குரிய ‘என்றால்’ என்பதைவிட காலச்சூழலைக் குறிக்கும் ‘போது’ இயல்பாகப் பொருந்துகிறது.
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: கணக்கெடுக்கும்போது
  rationale: சொல்லர்த்தமாக ‘தலையை உயர்த்துதல்’ என்றாலும், இங்கு மக்கள்தொகைக் கணக்கெடுப்பு அல்லது பதிவுக்கான எண்ணிக்கையிடுதலைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மகன்கள்
  rationale: மூலத்தின் குடும்பவழி ஆண்பால் வடிவத்தைப் பாதுகாக்கிறது; தமிழில் புரியக்கூடிய வேதாகமச் சொல்வழக்காகவும் உள்ளது.
- source_word: לִפְקֻדֵיהֶם
  choice: கணக்கிடப்பட்டவர்கள்
  rationale: פקד வேரின் பதிவுசெய்தல் மற்றும் கணக்கில் சேர்த்தல் ஆகிய நிர்வாகப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְנָתְנוּ אִישׁ
  choice: ஒவ்வொரு ஆணும் ... கொடுக்க வேண்டும்
  rationale: אִישׁ என்பதன் பகிர்நிலை ஒருமையையும் ஆண்பால் வடிவத்தையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: כֹּפֶר
  choice: மீட்புத்தொகை
  rationale: தீர்ப்பைத் தவிர்ப்பதற்காக உயிருக்கு ஈடாகச் செலுத்தப்படும் தொகையை இச்சூழலில் தெளிவாகக் குறிக்கிறது.
- source_word: נַפְשׁוֹ
  choice: தன் உயிருக்கு ஈடாக
  rationale: נפש இங்கு பொருளற்ற ஆவிக்குரிய ‘ஆத்துமா’ என்ற பிற்காலக் கருத்தைக் காட்டாமல், ஒருவரின் உயிரையோ அவரையே குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரான יהוה என்பதைப் பெயராகவே ஒலிபெயர்க்கிறது; ל முன்னொட்டின் பெறுநர் பொருளை ‘-க்கு’ காட்டுகிறது.
- source_word: בִּפְקֹד אֹתָם
  choice: நீ அவர்களைக் கணக்கெடுக்கும்போது
  rationale: எண்ணுதல் நிகழும் காலச்சூழலைக் காட்டுவதோடு, மூலத்திலுள்ள கணக்கெடுப்பு சொல்லின் மறுபயன்பாட்டையும் பாதுகாக்கிறது.
- source_word: נֶגֶף
  choice: கொள்ளைநோய்
  rationale: தெய்வீகத் தீர்ப்பாக நேரும் கொடிய நோய் அல்லது பெருந்தொற்றை இச்சூழலில் குறிக்கும் இயல்பான தமிழ் சொல்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- issue: נַפְשׁוֹ என்பதன் பொருள்
  choice: தன் உயிருக்கு ஈடாக
  alternative: தனக்காக; தன் ஆத்துமாவுக்காக
  rationale: கணக்கெடுப்பின்போது செலுத்தப்படும் ஈட்டுத்தொகைச் சூழலில் இச்சொல் உயிரையோ முழு நபரையோ குறிக்கிறது; உடலிலிருந்து பிரிந்த ஆத்துமா என்ற கருத்தை வசனத்தில் சேர்ப்பதைத் தவிர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל மற்றும் אִישׁ ஆகிய ஆண்பால் வடிவங்கள்
  choice: இஸ்ரவேல் மகன்கள் ... ஒவ்வொரு ஆணும்
  alternative: இஸ்ரவேலர் ... ஒவ்வொருவரும்
  rationale: கணக்கிடப்பட்ட குழுவைக் குறிக்கும் மூலத்தின் ஆண்பால் சொல்லமைப்பை மறைக்காமல் பாதுகாக்கிறது.
- issue: கொள்ளைநோய் தவிர்க்கப்படுவதற்கும் மீட்புத்தொகைக்கும் உள்ள தொடர்பு
  choice: உண்டாகாதபடி இப்படிச் செய்ய வேண்டும்
  alternative: அவர்களிடையே கொள்ளைநோய் உண்டாகாது
  rationale: எபிரேய இணைப்புச் சொல் நோக்கம் அல்லது விளைவு இரண்டையும் தாங்கக்கூடும். இயல்பான தமிழுக்காக நோக்கத் தொடர்பை வெளிப்படுத்தினாலும், செயலுக்கும் கொள்ளைநோய் தவிர்க்கப்படுவதற்கும் உள்ள உரைத் தொடர்பை மட்டும் கூறுகிறது; அதன் செயல்முறையை மேலதிகமாக விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மீட்புத்தொகை’, ‘கணக்கெடுக்குதல்’, ‘கொள்ளைநோய்’ ஆகியவை மூலத்தின் நிர்வாக மற்றும் தீர்ப்பு சார்ந்த நுணுக்கங்களைப் பாதுகாக்கின்றன. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
