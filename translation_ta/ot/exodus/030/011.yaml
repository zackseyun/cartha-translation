  yaml_path: translation/ot/exodus/030/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'யாவே[a] மோசேயிடம் கூறினார்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில்: “YHWH” (יהוה). இந்த இறைப்பெயர் மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது; “யெகோவா” என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: கூறியது
  rationale: דבר என்ற வினை தெய்வீக உரையை அறிமுகப்படுத்துகிறது. அடுத்துவரும் לֵאמֹר உடன் சேர்ந்து தமிழில் இயல்பாகவும் சுருக்கமாகவும் உரையின் தொடக்கத்தைக் குறிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டமாக மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை நவீனத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: לֵאמֹר
  choice: 'கூறியது: என்ற கட்டமைப்பில் வெளிப்படுத்தப்பட்டது'
  rationale: தொடர்ந்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெய வழக்குச் சூத்திரத்தை தமிழில் இரட்டிப்பின்றி இயல்பாக வெளிப்படுத்துகிறது; முக்காற்புள்ளி அடுத்துவரும் உரையைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது. எபிரெய உயிரெழுத்தாக்கத்தின் நிச்சயமின்மையையும் தமிழில் நிலைபெற்ற பயன்பாட்டையும் கருத்தில் கொண்டு மாற்று வடிவங்கள் அடிக்குறிப்பில் தெரிவிக்கப்படுகின்றன.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். எபிரெய உரைச்சூத்திரத்தைச் சொற்சொல்லாக இரட்டிக்காமல், அடுத்த வசனத்தின் நேரடி உரையை இயல்பாக அறிமுகப்படுத்தும் வகையில் அமைக்கப்பட்டது.
