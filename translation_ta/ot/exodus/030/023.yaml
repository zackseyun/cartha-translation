  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: ta
  text: 'நீயோ, மிகச் சிறந்த நறுமணப் பொருட்களை எடுத்துக்கொள்: தானாக வழியும் வெள்ளைப்போளம் ஐந்நூறு சேக்கல்[b], அதில் பாதியளவான நறுமண இலவங்கப்பட்டை—இருநூற்று ஐம்பது சேக்கல்—மற்றும் நறுமண நாணல் இருநூற்று ஐம்பது சேக்கல்[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “தானாக வழியும் வெள்ளைப்போளம்” என்பதற்கு “தூய வெள்ளைப்போளம்” என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொற்றொடர் இயற்கையாகத் தானே வழியும் வெள்ளைப்போளத்தைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: பாரம்பரியமாக இது “கலாமஸ்” என மொழிபெயர்க்கப்படுகிறது. எபிரெயச் சொல் பொதுவாக நறுமணமுள்ள தண்டு அல்லது நாணலைக் குறிக்கிறது; குறிப்பிட்ட தாவரவியல் அடையாளம் உறுதியானதல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: மிகச் சிறந்த நறுமணப் பொருட்கள்
  rationale: בְּשָׂמִים என்பது நறுமணப் பொருட்களைக் குறிக்கிறது; רֹאשׁ இங்கு முதன்மையான அல்லது மிகச் சிறந்த என்ற தரத்தைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: מָר דְּרוֹר
  choice: தானாக வழியும் வெள்ளைப்போளம்
  rationale: מָר என்பது வெள்ளைப்போளம்; דְּרוֹר அதன் இயற்கையான, தடையின்றி வழியும் நிலையைக் குறிக்கக்கூடும். 'தானாக வழியும்' என்பது இப்பொருளை வெளிப்படையாகத் தருகிறது; 'தூய' என்பது சாத்தியமான மாற்றுப் பொருள்.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: ஐந்நூறு சேக்கல்
  rationale: எபிரெய உரையில் இங்கு எண் மட்டுமே இருந்தாலும், செய்முறையின் உடனடிச் சூழல்—குறிப்பாக வசனம் 24—அளவிடும் அலகு சேக்கல் என்பதை உணர்த்துகிறது. தெளிவுக்காக அலகு சேர்க்கப்பட்டுள்ளது.
- source_word: קִנְּמָן בֶּשֶׂם
  choice: நறுமண இலவங்கப்பட்டை
  rationale: קִנְּמָן என்பது இலவங்கப்பட்டை; בֶּשֶׂם அதன் நறுமணத் தன்மையைச் சுட்டுகிறது. இச்சொல்லாக்கம் நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מַחֲצִיתוֹ
  choice: அதில் பாதியளவான
  rationale: பின்னொட்டு முன் கூறப்பட்ட ஐந்நூறு என்ற அளவைக் குறிக்கிறது. 'அதில் பாதியளவான' என்பது தொடர்பையும் ஒப்பீட்டளவையும் தெளிவாக்குகிறது.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: இருநூற்று ஐம்பது
  rationale: ஐந்நூற்றின் பாதியை எபிரெய உரை எண்ணாக மீண்டும் வெளிப்படையாகக் கூறுகிறது; அதே விளக்க அமைப்பு தமிழிலும் வைக்கப்பட்டுள்ளது.
- source_word: קְנֵה בֹשֶׂם
  choice: நறுமணக் கோரை
  rationale: קָנֶה என்பது தண்டு அல்லது நாணல் வகைத் தாவரம்; בֹשֶׂם நறுமணத்தைச் சுட்டுகிறது. பாரம்பரியமாக இது நறுமணக் கோரை அல்லது calamus என அடையாளப்படுத்தப்பட்டாலும், தாவரவியல் அடையாளம் முழுமையாக உறுதியானதல்ல.
