translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. பட்டியல் அமைப்பும், ஐந்நூற்றின் பாதி என்ற விளக்கமும் பாதுகாக்கப்பட்டுள்ளன. மூலத்தில் மறைமுகமாக உள்ள 'சேக்கல்' சூழல் தெளிவுக்காகச் சேர்க்கப்பட்டு அடிக்குறிப்பால் குறிக்கப்பட்டுள்ளது.
