source:
  edition: WLC
  text: לֹא תַעֲל֥וּ עָלָ֛י/ו קְטֹ֥רֶת זָרָ֖ה וְ/עֹלָ֣ה וּ/מִנְחָ֑ה וְ/נֵ֕סֶךְ לֹ֥א תִסְּכ֖וּ עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: ta
  text: அதன்மேல் அனுமதிக்கப்படாத தூபத்தை[a] அர்ப்பணிக்க வேண்டாம்; தகனபலியையோ தானியபலியையோ அதன்மேல் செலுத்த வேண்டாம்; பானபலியையும் அதன்மேல் ஊற்ற வேண்டாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேறான தூபம்’ அல்லது ‘அந்நிய தூபம்’ என்றும் மொழிபெயர்க்கலாம். இந்த ஆசாரச் சூழலில், எபிரெயப் பெயரடை அனுமதிக்கப்பட்ட அல்லது விதிக்கப்பட்ட முறைக்கு அப்பாற்பட்டதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלוּ
  choice: அர்ப்பணிக்க
  rationale: עלה என்பதன் ஹிஃபீல் வடிவம் சொற்படியாக ‘மேலே எழச்செய்தல்’ என்றாலும், பலிசார் சூழலில் பலிபீடத்தின் மேல் செலுத்தி அர்ப்பணிப்பதைக் குறிக்கிறது. நவீன தமிழில் ‘அர்ப்பணிக்க’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: முந்தைய சூழலில் கூறப்பட்ட தூபபீடத்தைக் குறிக்கிறது; எபிரெய மூலத்தின் இடத் தொடர்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: קְטֹרֶת
  choice: தூபம்
  rationale: இந்தப் பெயர்ச்சொல் எரிக்கப்படும் நறுமணத் தூபத்தைக் குறிக்கிறது. அர்ப்பணிக்கும் செயல் வினைச்சொல்லிலேயே வெளிப்படுவதால் ‘தூபம்’ போதுமானது.
- source_word: זָרָה
  choice: அனுமதிக்கப்படாத
  rationale: ஆசாரச் சூழலில் זָרָה என்பது விதிக்கப்பட்ட அல்லது அனுமதிக்கப்பட்ட முறைக்கு அப்பாற்பட்டதைச் சுட்டலாம். ‘அந்நியமான’ என்பது இன அல்லது நாட்டுச் சார்ந்த பொருளைத் தவறாகத் தூண்டக்கூடும்; ‘அனுமதிக்கப்படாத’ என்பது சட்ட-ஆசார வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: וְעֹלָה
  choice: தகனபலியையோ
  rationale: עֹלָה என்பது முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான வழக்கமான ஆசாரச் சொல். எதிர்மறைப் பட்டியலில் இணைப்பை இயல்பான தமிழில் ‘-யையோ’ என வழங்குகிறது.
- source_word: וּמִנְחָה
  choice: தானியபலியையோ
  rationale: ஆசாரச் சட்டச் சூழலில் מִנְחָה பொதுவாக தானியத்தால் செய்யப்படும் காணிக்கையைக் குறிக்கிறது; பொதுவான ‘காணிக்கை’ என்பதைவிட ‘தானியபலி’ இங்கு துல்லியமானது.
- source_word: וְנֵסֶךְ
  choice: பானபலி
  rationale: נֵסֶךְ என்பது ஊற்றப்படும் திரவக் காணிக்கையைக் குறிக்கிறது. ‘பானபலி’ சுருக்கமாகவும் வழிபாட்டுச் சூழலில் புரியக்கூடியதாகவும் உள்ளது.
- source_word: תִסְּכוּ
  choice: ஊற்ற
  rationale: נסך இங்கு பானபலியை ஊற்றிச் செலுத்தும் சடங்குச் செயலைக் குறிக்கிறது; ‘ஊற்ற’ என்பது நேரடியான, இயல்பான தமிழ்.
theological_decisions:
- issue: தூபத்தை விவரிக்கும் זָרָה என்பதன் ஆசாரப் பொருள்
  choice: அனுமதிக்கப்படாத தூபம்
  alternative: அந்நிய தூபம் / வேறான தூபம்
  rationale: இந்த வசனம் தூபபீடத்தில் எது செலுத்தப்படக்கூடாது என்பதை ஒழுங்குபடுத்துகிறது. ‘அனுமதிக்கப்படாத’ என்பது கடவுள் விதித்த வழிபாட்டு முறைக்கு அப்பாற்பட்டது என்ற பொருளைப் பாதுகாக்கிறது; அதேவேளை இதை இனரீதியான ‘வெளிநாட்டு’ பொருளாகக் குறுக்குவதில்லை. மூலச்சொல்லின் பிற சாத்தியங்களை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் வகையில் எழுதப்பட்டுள்ளது. ‘தூபம்’, ‘தகனபலி’, ‘தானியபலி’, ‘பானபலி’ ஆகியவை ஆசார வேறுபாடுகளைத் துல்லியமாக வைத்திருக்கின்றன. எபிரெய வசனத்தின் இரண்டு தடை வினைகளையும் பிரதிபலிக்க ‘அர்ப்பணிக்க வேண்டாம்’ மற்றும் ‘ஊற்ற வேண்டாம்’ என அமைக்கப்பட்டுள்ளது.
