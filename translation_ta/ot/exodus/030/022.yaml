lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு … பேசினார்
  rationale: வாவ் தொடர்கதை நகர்வைக் குறிக்கிறது; דּבר என்பதற்கு தெய்வீக உரை அறிமுகங்களில் இயல்பான ‘பேசினார்’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர்; ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֶל־מֹשֶׁה
  choice: மோசேயிடம்
  rationale: பேச்சு நோக்கிச் செல்கிற நபரைச் சுட்டும் אֶל என்பதற்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: பின்வரும் உரையை அறிமுகப்படுத்தும் எபிரெயச் சொற்றொடர். ‘பேசிச் சொன்னார்’ என்பது மூலத்தின் இரு வினை அமைப்பையும் தமிழில் இயல்பாகப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பெயர் நேரடியாக உள்ளது. எனவே பாரம்பரியப் பட்டப் பதிலீட்டுக்குப் பதிலாகப் பெயரின் ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பைத் தமிழில் தருகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, எளிதில் புரியும் தமிழ். அடுத்த வசனத்தில் வரும் நேரடி உரைக்குத் தயாராக்கும் வகையில் முடிவில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
