  text: וַ/יֹּאמֶר֩ יְהוָ֨ה אֶל מֹשֶׁ֜ה קַח לְ/ךָ֣ סַמִּ֗ים נָטָ֤ף וּ/שְׁחֵ֨לֶת֙ וְ/חֶלְבְּנָ֔ה סַמִּ֖ים וּ/לְבֹנָ֣ה זַכָּ֑ה בַּ֥ד בְּ/בַ֖ד יִהְיֶֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: ta
  text: 'பின்பு யாவே மோசேயிடம், “நீ நறுமணப் பொருட்களை எடுத்துக்கொள்: ஸ்டாக்டே[a], ஒனிக்கா[a], கல்பானம் ஆகிய நறுமணப் பொருட்களையும் தூய சாம்பிராணியையும்; அனைத்தும் சம அளவில் இருக்கட்டும்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஸ்டாக்டே’, ‘ஒனிக்கா’ என்பவை துல்லியமாக எந்தப் பொருட்களைக் குறிக்கின்றன என்பது உறுதியில்லை. எபிரெயச் சொற்கள் தூபம் தயாரிக்கப் பயன்படுத்தப்பட்ட குறிப்பிட்ட நறுமண மூலப்பொருட்களைக் குறிக்கலாம்; இங்கே அவற்றின் மரபான பெயர்கள் தரப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினை உரையாடலைக் கதையின் அடுத்த நிகழ்வாக முன்னெடுப்பதால், நவீன தமிழில் இயல்பான தொடர்ச்சியை வெளிப்படுத்துகிறது.
- source_word: קַח לְךָ
  choice: நீ ... எடுத்துக்கொள்
  rationale: கட்டளையுடன் வரும் לְךָ-வின் தனிப்பட்ட/தன்முக நுணுக்கத்தை ‘எடுத்துக்கொள்’ என்ற இயல்பான தமிழ் வடிவம் தக்கவைக்கிறது.
- source_word: סַמִּים
  choice: நறுமணப் பொருட்கள்
  rationale: தூபக் கலவைக்கான பல்வேறு மணமுள்ள மூலப்பொருட்களைக் குறிக்கும் பரந்த சொல்லாக இருப்பதால், ‘மசாலாப் பொருட்கள்’ என்பதைவிடச் சூழலுக்குப் பொருத்தமானது.
- source_word: נָטָף
  choice: ஸ்டாக்டே
  rationale: குறிப்பிட்ட பொருளின் அடையாளம் உறுதியற்றது; மொழிபெயர்ப்பு மரபில் அறியப்பட்ட பெயரை ஒலிபெயர்த்து, அதன் உறுதியின்மையை அடிக்குறிப்பில் தெரிவிக்கிறது.
- source_word: שְׁחֵלֶת
  choice: ஒனிக்கா
  rationale: இதன் துல்லியமான இயற்கைப் பொருள் உறுதியாக அடையாளம் காணப்படாததால், மரபான பெயர் ஒலிபெயர்க்கப்பட்டு விளக்கக் குறிப்பு சேர்க்கப்படுகிறது.
- source_word: חֶלְבְּנָה
  choice: கல்பானம்
  rationale: பொதுவாக மணமுள்ள பிசினான galbanum என அடையாளம் காணப்படும் பொருளுக்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு.
- source_word: לְבֹנָה זַכָּה
  choice: தூய சாம்பிராணி
  rationale: לְבֹנָה-வைத் தமிழில் பரவலாக அறியப்படும் ‘சாம்பிராணி’ என்றும், זַכָּה-வின் தூய்மை நுணுக்கத்தை ‘தூய’ என்றும் தருகிறது.
- source_word: בַּד בְּבַד
  choice: ஒவ்வொன்றும் சம அளவில்
  rationale: ஒவ்வொரு மூலப்பொருளும் சம விகிதத்தில் இருக்க வேண்டும் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: יִהְיֶה
  choice: இருக்க வேண்டும்
  rationale: கூறப்பட்ட கலவை முறைக்கான கட்டளையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ஒருமை வினை பட்டியலிடப்பட்ட பொருட்களைத் தொகுப்பாகக் காணலாம்.
