translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. அளவுச் சொல்லாக ‘முழம்’ தக்கவைக்கப்பட்டுள்ளது. மூலத்தில் இல்லாத விளக்கங்கள் முதன்மை உரைக்குள் சேர்க்கப்படாமல், מִמֶּנּוּ என்பதன் சொல்லர்த்தமும் கைவினைச் சூழல் பொருளும் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
