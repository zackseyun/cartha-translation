base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: ta
  text: அதன் நீளம் ஒரு முழமும், அதன் அகலம் ஒரு முழமும் இருக்க வேண்டும்; அது சதுரமாக இருக்க வேண்டும். அதன் உயரம் இரண்டு முழம் இருக்க வேண்டும். அதன் கொம்புகள் அதனோடு ஒரே துண்டாக இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லர்த்தமாக, ‘அதிலிருந்து’; அதாவது, கொம்புகள் தனியாகச் செய்து இணைக்கப்படாமல், பீடத்தோடு ஒரே துண்டாக அமைக்கப்பட வேண்டும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמָּה
  choice: ஒரு முழம்
  rationale: பண்டைய நீள அலகான ‘முழம்’ தமிழில் வழக்கமான வேதாகம மற்றும் அளவியல் சொல்; நவீன அலகாக மாற்றி தவறான துல்லியத்தை உருவாக்காமல் மூல அளவைப் பாதுகாக்கிறது.
- source_word: אָרְכּוֹ
  choice: அதன் நீளம்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு சூழலில் தூபப்பீடத்தைக் குறிக்கிறது; தமிழில் இயல்பான பரிமாணச் சொற்றொடர்.
- source_word: רָחְבּוֹ
  choice: அதன் அகலம்
  rationale: கட்டமைப்பின் பரிமாணத்தைக் குறிக்க நவீன தமிழில் தெளிவான சொல்.
- source_word: רָבוּעַ
  choice: சதுரமாக
  rationale: நான்கு சம பக்கங்களுடைய வடிவத்தை நவீன தமிழில் நேரடியாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: יִהְיֶה
  choice: இருக்க வேண்டும்
  rationale: இங்கு imperfect வடிவம் கூடார அமைப்புக்கான கட்டளையையோ வடிவமைப்பு விதிப்பையையோ தெரிவிக்கிறது; ‘இருக்க வேண்டும்’ இயல்பான தமிழ் அறிவுறுத்தல் நடை.
- source_word: אַמָּתַיִם
  choice: இரண்டு முழம்
  rationale: எபிரெய இருமை வடிவம் இரண்டு முழங்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: קֹמָתוֹ
  choice: அதன் உயரம்
  rationale: கட்டட/பொருள் அமைப்புச் சூழலில் ‘உயரம்’ பொருத்தமான நவீன தமிழ் இணைச்சொல்.
- source_word: מִמֶּנּוּ
  choice: அதனோடு ஒரே பகுதியாக
  rationale: சொல்லர்த்தம் ‘அதிலிருந்து’; கைவினைச் சூழலில் கொம்புகள் தனியாக இணைக்கப்படாமல் பீடத்துடனேயே ஒருங்கிணைந்து உருவாக்கப்படுவதை இந்த இயல்பான தமிழ் வெளிப்படுத்துகிறது.
- source_word: קַרְנֹתָיו
  choice: அதன் கொம்புகள்
  rationale: பலிபீடத்தின் மூலைகளிலுள்ள கொம்பு போன்ற நீட்சிகளுக்கான மரபான வழிபாட்டுச் சொல்லைத் தக்கவைத்து, பிற வேதாகம இடங்களுடனான சொல்லியல் தொடர்பைப் பாதுகாக்கிறது.
