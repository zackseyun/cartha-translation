translation:
  language: ta
  text: மேலும், காசியா பட்டை ஐந்நூறு சேக்கல், பரிசுத்த ஸ்தலத்தின் சேக்கல் அளவின்படி; ஆலிவ் எண்ணெய் ஒரு ஹின்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஹின் என்பது பழங்காலத் திரவ அளவு; அது ஏறத்தாழ 3.5 முதல் 4 லிட்டர் (சுமார் 1 கேலன்) இருந்ததாகப் பலர் மதிப்பிடுகின்றனர்.
    reason: cultural_note
lexical_decisions:
- source_word: קִדָּה
  choice: காசியா பட்டை
  rationale: இச்சொல் நறுமணப் பொருளாகப் பயன்படுத்தப்பட்ட காசியா மரப்பட்டையைக் குறிக்கிறது. தாவரத்தின் பெயருடன் ‘பட்டை’ என்பதையும் சேர்ப்பது நவீனத் தமிழ் வாசகருக்குப் பொருளைத் தெளிவாக்குகிறது.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: ஐந்நூறு
  rationale: அளவைக் குறிக்கும் எண் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தின் சேக்கல் எடையின்படி
  rationale: இந்தச் சொற்றொடர் எடையை நிர்ணயிக்கும் அதிகாரப்பூர்வ திருத்தல அளவுகோலைக் குறிக்கிறது. ‘எடையின்படி’ என்பது சேக்கல் இங்கு எடை அலகு என்பதைத் தெளிவாக்குகிறது.
- source_word: שֶׁמֶן זַיִת
  choice: ஒலிவ எண்ணெய்
  rationale: எபிரெயக் கட்டமைப்பின் இயல்பான தமிழ்ப் பொருள் இதுவே.
- source_word: הִין
  choice: ஒரு ஹின்
  rationale: இது பழங்காலத் திரவ அளவின் குறிப்பிட்ட பெயர் என்பதால், தோராயமான நவீன அளவாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ
  choice: மேலும்
  rationale: இவ்வசனம் முந்தைய வசனத்தின் பொருட்பட்டியலைத் தொடர்வதை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொருட்பட்டியலின் சுருக்கமான அமைப்பு காக்கப்பட்டுள்ளது. மூலத்தில் தனி வினைச்சொல் இல்லாததால் புதிய வினைச்சொல் சேர்க்கப்படவில்லை. ஆங்கில ஆலோசனை உரையில் அடிக்குறி குறியீடு ‘cassia’ என்பதற்குப் பின் இருந்தாலும், அடிக்குறிப்பு ‘hin’ அளவை விளக்குவதால் தமிழில் அது ‘ஹின்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
