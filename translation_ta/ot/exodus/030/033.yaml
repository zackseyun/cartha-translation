    issue: “அதிகாரமில்லாத ஒருவர்” can suggest a person lacking power or authority rather than a person not authorized for this sacred use.
    rationale: “அனுமதிக்கப்படாத ஒருவர்” more naturally communicates the contextual restriction while the footnote retains lexical alternatives.
