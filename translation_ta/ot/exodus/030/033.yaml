  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: ta
  text: எவராவது அதைப் போன்ற கலவையைத் தயாரித்தாலோ, அதிலிருந்து சிறிதளவை அனுமதிக்கப்படாத ஒருவர்மேல் பூசினாலோ[a], அவர் தம் மக்களிடமிருந்து அகற்றப்படுவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அனுமதிக்கப்படாத ஒருவர்’ என்பதற்கான எபிரெயச் சொல் ‘அந்நியர்,’ ‘வெளியார்,’ அல்லது இச்சூழலில் ‘பரிசுத்தப் பயன்பாட்டுக்கு அனுமதிக்கப்படாதவர்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தம் மக்களிடமிருந்து அகற்றப்படுவார்’ என்பது உடன்படிக்கைச் சட்டத்தில் வரும் ஒரு தண்டனைச் சொற்றொடர்; அந்தத் தண்டனை எவ்வாறு நிறைவேற்றப்படும் என்பதை இவ்வசனம் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: …கிறவரோ
  rationale: எபிரெயச் சொற்றொடர் சொல்லளவில் ‘அப்படிச் செய்கிற மனிதன்’ என்றாலும், இச்சட்டத்தில் அது பொதுவாக எவரையும் குறிக்கிறது. தமிழில் பாலினத்தை முன்னிறுத்தாமல் சட்டத்தின் பொதுப்பொருளை இயல்பாகத் தெரிவிக்க வினையெச்சப் பெயராக்கம் பயன்படுத்தப்பட்டது.
- source_word: יִרְקַח
  choice: கலந்து தயாரிக்கிற
  rationale: רקח என்பது நறுமணப் பொருள் அல்லது தைலத்தைத் தேவையான கூறுகளால் கலந்தமைப்பதைக் குறிக்கும் தொழில்நுட்ப வினை. சாதாரண ‘கலக்கிற’ என்பதைவிட ‘கலந்து தயாரிக்கிற’ என்பது இச்சூழலுக்கு தெளிவானது.
- source_word: כָּמֹהוּ
  choice: அதைப் போன்ற ஒன்றை
  rationale: இது முன்பு விவரிக்கப்பட்ட பரிசுத்த அபிஷேகத் தைலத்தைச் சுட்டி, அதைப் போன்ற கலவையைத் தயாரிப்பதைத் தடைசெய்கிறது; ‘அதே ஒன்றை’ என்று மிகத் துல்லியமான ஒற்றுமையை உரையில் சேர்க்காமல் ஒப்புமையைப் பாதுகாக்கிறது.
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: அதிலிருந்து எதையாவது … மேல் பூசுகிறவரோ
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்/கொடுத்தல்’; தைலத்தை ஒருவர்மேல் வைக்கும் இச்சூழலில் ‘பூசுதல்’ இயல்பாகவும் தெளிவாகவும் உள்ளது. מִמֶּנּוּ குறிக்கும் பகுதியளவு ‘அதிலிருந்து எதையாவது’ என்று வெளிப்படுத்தப்பட்டது.
- source_word: עַל זָר
  choice: அதைப் பெற அதிகாரமில்லாத ஒருவர்மேல்
  rationale: ஆசாரியப் பரிசுத்தச் சூழலில் זָר என்பது இனத்தால் அந்நியரை மட்டும் அல்லாமல், பரிசுத்தப் பயன்பாட்டில் பங்கேற்க அனுமதி அல்லது அதிகாரம் இல்லாதவரைக் குறிக்கலாம். சூழல்சார்ந்த இந்தப் பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்சார்ந்த மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டன.
- source_word: וְנִכְרַת
  choice: அறுப்புண்டுபோவார்
  rationale: இது உடன்படிக்கைச் சட்டத்தில் காணப்படும் கடுமையான நீக்கத்தைக் குறிக்கும் நிலையான சொற்றொடர். தண்டனை எந்த முறையில் நிறைவேற்றப்படும் என்பதை உரை கூறாததால், ‘கொல்லப்படுவார்’ அல்லது வெறும் ‘விலக்கப்படுவார்’ என்று தீர்மானிக்காமல் உருவகத்தின் வலிமை தக்கவைக்கப்பட்டது.
- source_word: מֵעַמָּיו
  choice: தம் மக்களிடமிருந்து
  rationale: இந்தச் சொற்றொடர் ஒருவருடைய உடன்படிக்கை மக்களிடமிருந்து அவர் அகற்றப்படுவதைக் குறிக்கிறது. ‘தம் மக்களிடமிருந்து’ என்பது நேரடியும் இயல்பானதுமான தமிழாக்கம்.
theological_decisions:
- issue: ஆசாரியப் பரிசுத்தச் சட்டத்தில் זָר என்பதன் பொருள்
  choice: அதைப் பெற அதிகாரமில்லாத ஒருவர்
  alternative: அந்நியர் / வெளியார் / ஆசாரியரல்லாதவர்
  rationale: இச்சூழலின் எல்லை இன அடையாளத்தைப் பற்றியது அல்ல; பரிசுத்த அபிஷேகத் தைலத்தைப் பெறுவதற்கான அனுமதியைப் பற்றியது. இருப்பினும் எபிரெயச் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: וְנִכְרַת מֵעַמָּיו என்ற தண்டனைச் சூத்திரத்தின் வலிமை
  choice: தம் மக்களிடமிருந்து அறுப்புண்டுபோவார்
  alternative: தம் மக்களிடமிருந்து விலக்கப்படுவார் / கொல்லப்படுவார்
  rationale: மூல உரை கடுமையான உடன்படிக்கைத் தண்டனையைச் சொல்கிறது; ஆனால் அது சமூக விலக்கா, மரணமா, அல்லது இறைத் தண்டனையா என்பதை இவ்வசனத்தில் குறிப்பாகத் தீர்மானிக்கவில்லை. ஆகவே அந்தத் தெளிவின்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சட்டத்துக்குரிய கண்ணியமும் எச்சரிக்கையின் கடுமையும் காக்கப்பட்டுள்ளன. ‘அறுப்புண்டுபோவார்’ என்ற வேதாகமச் சட்ட உருவகம் சற்றே உயர்ந்த நடையை உடையதாயினும் பொதுவாசகர்களுக்குப் புரியக்கூடியது. பாலினத்தை தேவையின்றி முன்னிறுத்தாமல் பொதுப்பொருள் தரப்பட்டுள்ளது; இரு அடிக்குறி குறியீடுகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
