base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: ta
  text: நீ தயாரிக்கும் அந்தத் தூபத்தை, அதன் கலவை விகிதத்தின்படி[a] உங்களுக்காகத் தயாரிக்கக் கூடாது[b]. அது யாவேக்கென்று உனக்குப் பரிசுத்தமானதாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் செய்முறையின்படி” அல்லது “அதன் அளவு விகிதத்தின்படி.”
    reason: lexical_alternative
  - marker: b
    text: அதாவது, இந்தப் பரிசுத்தத் தூபக் கலவையைச் சாதாரண தனிப்பட்ட பயன்பாட்டுக்காக மீண்டும் தயாரிக்கக் கூடாது.
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: அந்தத் தூபத்தை
  rationale: உடனடி சூழலில் விவரிக்கப்பட்ட குறிப்பிட்ட பரிசுத்தத் தூபக் கலவையைக் குறிக்கிறது; ‘தூபம்’ இயல்பான, நேரடியான தமிழ் இணைச்சொல்.
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: நீ தயாரிக்கும்
  rationale: இரண்டாம் நபர் ஒருமை வினையைப் பேணுகிறது; கலவையைச் செய்வதற்கு ‘தயாரிக்கும்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: அதே கலவை விகிதத்தின்படி
  rationale: குறிப்பிட்ட சேர்க்கை முறை அல்லது அளவு விகிதத்தைக் குறிக்கும் சொல்லின் பொருளைப் பிடிக்கிறது; ‘அதே’ என்பது அதன் முன் கூறப்பட்ட கலவையைக் குறிக்கும் உரிமைப்பின்னொட்டின் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: உங்களுக்காகத் தயாரிக்கக் கூடாது
  rationale: எபிரெயத்தில் வினை பன்மையிலும், ‘உங்களுக்காக’ என்ற சொற்றொடரும் இருப்பதைப் பேணி, தனிப்பட்ட பயன்பாட்டுக்காக இதைத் தயாரிப்பதற்கான தடையைத் தெளிவாகக் கூறுகிறது.
- source_word: קֹדֶשׁ
  choice: பரிசுத்தமானதாக
  rationale: அர்ப்பணிக்கப்பட்ட புனித நிலையைச் சுட்டும் வழக்கமான, இறையியல் நிறைவுள்ள தமிழ் சொல்; ‘மகா பரிசுத்தம்’ என்று மிகைப்படுத்தப்படவில்லை.
- source_word: תִּהְיֶה לְךָ
  choice: உனக்குப் ... இருக்க வேண்டும்
  rationale: மீண்டும் வரும் ஒருமை முகவரியையும், பெறுநர் அதை எவ்வாறு கருத வேண்டும் என்ற உறவுச் சார்ந்த பொருளையும் பேணுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கென்று
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ஒலிபெயர்த்துப் பேணுகிறது; ל முன்னொட்டின் அர்ப்பணிப்பு அல்லது உரிமை சார்ந்த பொருளை ‘-க்கென்று’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: தூபத்தின் பரிசுத்த நிலை
  choice: யாவேக்கென்று உனக்குப் பரிசுத்தமானதாக
  alternative: யாவேக்கு மட்டுமே சொந்தமானது
  rationale: கֹדֶשׁ என்பதன் பரிசுத்த நிலையை நேரடியாகப் பேணுகிறது; ‘மட்டுமே சொந்தமானது’ என்பது சூழலுக்கு ஏற்ற விளக்கம் என்றாலும், இவ்வசனத்தின் சொற்களைவிடக் கூடுதல் தீர்மானத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், கட்டளையின் கண்ணியத்தையும் மூலத்தின் நேரடியான அமைப்பையும் பேணிய நடை. எபிரெயத்தில் ‘நீ தயாரிக்கும்’ மற்றும் ‘உனக்கு’ ஒருமையாகவும், ‘உங்களுக்காகத் தயாரிக்கக் கூடாது’ பன்மையாகவும் இருப்பதால் அந்த முகவரி மாற்றம் தமிழிலும் வேண்டுமென்றே பேணப்பட்டது.
