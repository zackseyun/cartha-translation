  text: וְ/קִדַּשְׁתָּ֣ אֹתָ֔/ם וְ/הָי֖וּ קֹ֣דֶשׁ קָֽדָשִׁ֑ים כָּל הַ/נֹּגֵ֥עַ בָּ/הֶ֖ם יִקְדָּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: ta
  text: அவற்றைப் பரிசுத்தப்படுத்து; அவை மிகப் பரிசுத்தமானவையாக இருக்கும். அவற்றைத் தொடுகிற எதுவும் பரிசுத்தமாகும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் சொல்லுக்குச் சொல்லாக, “பரிசுத்தமாயிருக்கும்” அல்லது “பரிசுத்தப்படுத்தப்படும்.” தொடுவதன் மூலம் பரிசுத்த நிலையை அடைவதையும் எபிரெயச் சொல் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: பரிசுத்தப்படுத்து
  rationale: קדשׁ என்பதன் பிஏல் வடிவம் இச்சடங்குச் சூழலில் ஒன்றைப் பரிசுத்தமாக்குதல் அல்லது பரிசுத்த பயன்பாட்டுக்காக ஒதுக்கிவைத்தல் என்பதைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் மூலத்தின் செயப்படுத்தும் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: முந்தைய சூழலில் கூறப்பட்ட திருக்கூடாரப் பொருட்களையும் அதனுடன் தொடர்புடைய பொருட்களையும் குறிக்கும் நேரடி செயப்படுபொருள் பன்மைப் பெயர்ப்பதிலி.
- source_word: וְהָיוּ
  choice: அவை ... இருக்கும்
  rationale: பரிசுத்தப்படுத்தும் செயலின் விளைவாக அமையும் நிலையைச் சுட்டும் எளிய இணைப்புக் கூற்று; கட்டளைத் தொடரில் எதிர்காலத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: மகா பரிசுத்தமானவையாக
  rationale: எபிரெய மொழியின் மிகைநிலை அமைப்பு மிக உயர்ந்த அளவிலான பரிசுத்தத்தைக் குறிக்கிறது. இடப்பெயராகத் தவறாகப் புரியக்கூடிய சொல்லாட்சியைத் தவிர்த்து, இங்கு வரும் பயனிலைப் பொருளை இது இயல்பாகத் தருகிறது.
- source_word: כָּל הַנֹּגֵעַ
  choice: தொடுவது எதுவும்
  rationale: பங்கேற்புவினையுடன் வரும் இத்தொடர் பொதுவான, குறிப்பிட்ட நபருக்கு மட்டும் வரையறுக்கப்படாத பொருளைக் கொண்டது. மனிதரையோ பொருளையோ முன்கூட்டியே கட்டுப்படுத்தாமல் பரந்த வரம்பைப் பேணுகிறது.
- source_word: בָּהֶם
  choice: அவற்றை
  rationale: இப்போது பரிசுத்தப்படுத்தப்பட்டதாகக் கூறப்பட்ட பொருட்களையே மீண்டும் குறிக்கிறது.
- source_word: יִקְדָּשׁ
  choice: பரிசுத்தமாகும்
  rationale: קדשׁ என்பதன் கால் நிறைவுறாத வடிவம் இங்கு தொடர்பினால் பரிசுத்த நிலையை அடைதல் எனும் மாற்றநிலைப் பொருளைக் கொண்டிருக்கலாம். அதேவேளை, 'பரிசுத்தமாக இருக்கும்' அல்லது 'பரிசுத்தப்படுத்தப்படும்' என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: தொடுவதால் ஏற்படும் பரிசுத்தத்தின் தன்மை
  choice: இந்தப் பரிசுத்தப் பொருட்களைத் தொடுவது பரிசுத்தமாகும் என்று மட்டும் கூறி, அது நன்மையான அர்ப்பணிப்பா, ஆபத்தான பரிசுத்த வட்டத்திற்குள் வருதலா, அல்லது குறிப்பிட்ட கட்டுப்பாடுகளுக்கு உட்படுதலா என்பதைத் தீர்மானிக்காமல் விடுதல்.
  alternative: தொடுவது நேர்மறையான பொருளில் அர்ப்பணிக்கப்பட்டுப் பரிசுத்தமாகிறது; அல்லது பரிசுத்தத்தின் ஆபத்துக்கும் கட்டுப்பாடுகளுக்கும் உட்படுகிறது.
  rationale: எபிரெய உரை יִקְדָּשׁ என்று மட்டும் கூறுகிறது. விரிவான சடங்கியல் கருத்துகளை இறக்குமதி செய்யாமல், மூலத்தில் உள்ள இறையியல் இழுபறியை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பரிசுத்தப்படுத்து’, ‘மகா பரிசுத்தம்’ ஆகியவை பொதுவாகப் புரியும் சடங்கியல் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தில் உள்ள பொதுவான ‘தொடுவது எதுவும்’ என்ற வரம்பும் நோக்கத்துடன் பாதுகாக்கப்பட்டுள்ளது.
