  terminology: ‘நிலையான நியமம்’ is a sound rendering of חָק עוֹלָם in this legal context. ‘சந்ததி’ suitably renders the collective sense of זַרְעוֹ. The lexical-alternative note responsibly records stronger duration alternatives without imposing a doctrinal interpretation.
