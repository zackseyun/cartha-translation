base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: ta
  text: 'அவர்கள் சாகாதபடி தங்கள் கைகளையும் கால்களையும் கழுவ வேண்டும். இது அவர்களுக்கு நிலையான நியமமாக இருக்கும்[a]—அவனுக்கும்[b] அவனுடைய சந்ததிக்கும், தலைமுறைதோறும்.


    [a] “என்றென்றைக்குமான நியமம்” அல்லது “தொடர்ந்து நிலைக்கும் நியமம்” என்றும் மொழிபெயர்க்கலாம். חָק עוֹלָם என்ற எபிரெயச் சொற்றொடர், நீடித்து நிலைக்கும் ஒரு கட்டளையைக் குறிக்கும் வழக்கமான சட்டச் சூத்திரம்.


    [b] “அவன்” என்பது முந்தைய வசனத்தின் உடனடிச் சூழலில் ஆரோனைக் குறிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என்றென்றைக்குமான நியமம்” அல்லது “தொடர்ந்து நிலைக்கும் நியமம்” என்றும் மொழிபெயர்க்கலாம். חָק עוֹלָם என்ற எபிரெயச் சொற்றொடர், நீடித்து நிலைக்கும் ஒரு கட்டளையைக் குறிக்கும் வழக்கமான சட்டச் சூத்திரம்.
    reason: lexical_alternative
  - marker: b
    text: “அவன்” என்பது முந்தைய வசனத்தின் உடனடிச் சூழலில் ஆரோனைக் குறிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: கழுவ வேண்டும்
  rationale: சட்டம் மற்றும் வழிபாட்டு அறிவுறுத்தல் சூழலில் கட்டளை வலிமை கொண்ட வடிவம்; இயல்பான நவீனத் தமிழில் கடமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: தங்கள் கைகளையும் கால்களையும்
  rationale: இரு உடற்பகுதிகளையும் குறிப்பிட்டபடியே மொழிபெயர்த்து, சடங்கின் துல்லியத்தைப் பேணுகிறது.
- source_word: וְלֹא יָמֻתוּ
  choice: அவர்கள் சாகாதபடி
  rationale: கழுவுதல் உயிரிழப்பைத் தவிர்ப்பதற்கான நிபந்தனை அல்லது நோக்கம் என்பதை இயல்பாகக் காட்டுகிறது; வெறும் முன்னறிவிப்பாக மாற்றவில்லை.
- source_word: חָק עוֹלָם
  choice: நிலையான நியமம்
  rationale: நீடித்து நடைமுறையில் இருக்க வேண்டிய சட்டக் கட்டளையைத் தெரிவிக்கிறது; עוֹלָם என்பதன் கால அளவைச் சூழலுக்கு அப்பாற்பட்ட தத்துவக் கூற்றாக மிகைப்படுத்தவில்லை. மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மைச் சுட்டுப்பெயரை நேரடியாகப் பேணுகிறது.
- source_word: לּוֹ
  choice: அவனுக்கும்
  rationale: எபிரெய மூலத்தின் ஒருமைச் சுட்டுப்பெயரை வெளிப்படையாகப் பேணுகிறது; அதன் குறிப்பு ஆரோன் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וּלְזַרְעוֹ
  choice: அவனுடைய சந்ததிக்கும்
  rationale: זֶרַע என்பதன் கூட்டொருமைப் பொருளான வழித்தோன்றல் அல்லது பரம்பரையை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְדֹרֹתָם
  choice: தலைமுறைதோறும்
  rationale: தொடர்ந்து வரும் தலைமுறைகள் அனைத்திலும் நியமம் நீடிப்பதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חָק עוֹלָם குறிக்கும் வழிபாட்டு நியமத்தின் காலநீட்சி
  choice: நிலையான நியமம்
  alternative: என்றென்றைக்குமான நியமம்; தொடர்ந்து நிலைக்கும் நியமம்
  rationale: இச்சட்டச் சூத்திரம் இஸ்ரவேலின் வழிபாட்டு அமைப்பில் நீடித்த கட்டுப்பாட்டைக் குறிக்கிறது. “நிலையான” என்பது அதன் வலிமையைப் பேணுகிறது; அதேவேளையில் உடன்படிக்கைச் சூழலைத் தாண்டி முடிவற்ற காலம் குறித்த தனிக் கோட்பாட்டைத் திணிப்பதில்லை.
- issue: לּוֹ என்ற ஒருமைச் சுட்டுப்பெயரின் குறிப்பு
  choice: மூலத்திலுள்ள “அவனுக்கு” என்ற சுட்டுப்பெயரைப் பேணி, ஆரோன் என்பதை அடிக்குறிப்பில் விளக்குதல்
  alternative: முதன்மை உரையிலேயே “ஆரோனுக்கும்” என்று விரித்துரைத்தல்
  rationale: மூல உரையின் ஒருமைச் சுட்டுப்பெயரையும், அதற்கு முன் வரும் பன்மை “அவர்களுக்கு” என்பதுடனான இலக்கணத் தளர்வையும் மறைக்காமல் பேணுகிறது; உடனடிச் சூழல் காட்டும் குறிப்பை அடிக்குறிப்பு தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட சட்ட/வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. “அவர்களுக்கு—அவனுக்கும்” என்ற எண் மாறுபாடு மூலத்தில் இருப்பதால் அதைச் சீராக்காமல் பேணியுள்ளோம்; வாசகருக்கு உதவ அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
