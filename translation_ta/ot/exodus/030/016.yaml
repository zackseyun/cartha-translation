source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: ta
  text: இஸ்ரவேல் மக்களிடமிருந்து பாவநிவாரணப் பணத்தைப் பெற்று, அதைச் சந்திப்புக் கூடாரத்தின் சேவைக்காகக் கொடு. அது யாவேயின் முன்னிலையில் இஸ்ரவேல் மக்களுக்கு ஒரு நினைவாக இருக்கும்; உங்கள் உயிர்களுக்காகப் பாவநிவாரணம் செய்வதற்காக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “உங்கள் உயிர்கள்” என்று உள்ளது. இச்சூழலில் இது உடலிலிருந்து பிரிந்த ஆன்மாக்களைக் குறிக்காமல், உங்கள் வாழ்வுகள் அல்லது உங்களையே குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: பாவநிவாரணப் பணம்
  rationale: כֶּסֶף என்பது வெள்ளி அல்லது பணம்; இச்சூழலில் முந்தைய வசனங்களில் விதிக்கப்பட்ட கணக்கெடுப்புக் காணிக்கையைக் குறிக்கிறது. הַכִּפֻּרִים என்பது பாவநிவாரணத்தைச் சுட்டுவதால், இச்சொற்றொடர் இயல்பாகவும் வழிபாட்டுச் சார்ந்த பொருளைத் தக்கவைத்தும் மொழிபெயர்க்கப்படுகிறது.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களிடமிருந்து
  rationale: בְּנֵי יִשְׂרָאֵל என்பதன் சொற்பொருள் ‘இஸ்ரவேலின் மகன்கள்’; இங்கு அது உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிப்பதால், நவீனத் தமிழில் இயல்பான ‘இஸ்ரவேலின் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தின் பணிக்காக
  rationale: עַל இங்கு ஒதுக்கீடு அல்லது நோக்கத்தைக் காட்டுகிறது; עֲבֹדָה என்பது கூடாரத்துடன் தொடர்புடைய பணி அல்லது சேவை. ‘பணிக்காக’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: ஒரு நினைவுச்சின்னமாக இருந்து
  rationale: זִכָּרוֹן என்பது நினைவூட்டும் அடையாளம் அல்லது நினைவுச்சின்னம். வழிபாட்டுச் சூழலையும் தேவனுக்கு முன்பான நிலையான நினைவூட்டலையும் இச்சொல் தக்கவைக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது ‘முன்பாக/சந்நிதியில்’ என்று பொருள்; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: לְכַפֵּר
  choice: பாவநிவாரணம் செய்யும்
  rationale: כפר என்ற பியேல் வினை ஆசாரிய வழிபாட்டுச் சூழலில் பாவநிவாரணத்தை ஏற்படுத்துதல் எனப் பொருள்படுகிறது. தமிழில் பரவலாகப் புரியக்கூடிய வழிபாட்டுச் சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: உங்கள் உயிர்களுக்காக
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து பிரிந்த ‘ஆன்மா’ என்ற பிற்கால இருமைப் பொருளை அல்ல, நபர்களின் உயிர்கள் அல்லது அவர்களையே குறிக்கிறது. ‘உயிர்களுக்காக’ என்பது மூலத்தின் உருவகத்தையும் சூழலையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளாலான தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; பொதுப்பட்டத்தால் மாற்றாமல் ‘யாவே’ என வழங்குவது அந்தப் பெயரைத் தெளிவாகக் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கை மக்கள் பெயர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் இலக்கண ரீதியாக ஆண்பால் பன்மை என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கிறது. ‘மக்கள்’ என்பது பாலினத்தைப் பற்றிய தேவையற்ற தவறான புரிதலைத் தவிர்த்து கூட்டுப்பொருளை இயல்பாகத் தெரிவிக்கிறது.
- issue: பாவநிவாரணப் பணத்தின் செயல்பாடு
  choice: உங்கள் உயிர்களுக்காகப் பாவநிவாரணம் செய்யும்
  alternative: உங்களை மீட்கும் விலையாக இருக்கும்
  rationale: לְכַפֵּר என்ற மூல வினையின் வழிபாட்டுச் சார்ந்த ‘பாவநிவாரணம் செய்தல்’ என்ற பொருள் நேரடியாகக் காக்கப்படுகிறது; அது எவ்வாறு செயல்படுகிறது என்பதை மேலதிக கோட்பாட்டால் விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடை. எபிரெய வாக்கியத்தின் கட்டளை, நோக்கம், நினைவுச்சின்னம், பாவநிவாரணம் ஆகிய தொடர்புகள் தெளிவாகக் காக்கப்பட்டுள்ளன.
