  yaml_path: translation/ot/exodus/035/011.yaml
  text: the tabernacle[a], its tent, and its covering; its clasps, its boards, its bars, its pillars, and its bases[b];
translation:
  language: ta
  text: திருவுறைவிடம், அதன் கூடாரம், அதன் மூடுபடலம், அதன் இணைப்புக் கவ்விகள், அதன் பலகைகள்[a], அதன் இணைப்புத் தண்டுகள், அதன் தூண்கள், அதன் அடிப்பீடங்கள்[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பலகைகள்’ என்பதற்குப் பதிலாக ‘சட்டகங்கள்’ என்றும் மொழிபெயர்க்கலாம்; קְרָשָׁיו என்ற சொல் திடமான மரப்பலகைகளைக் குறிக்காமல், சட்டக வடிவக் கட்டுமானத்தைக் குறிப்பதாகவும் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அடிப்பீடங்கள்’ என்பதற்குப் பதிலாக ‘செருகுதாங்கிகள்’ என்றும் மொழிபெயர்க்கலாம்; אֲדָנָיו என்பது கட்டுமான உறுப்புகள் செருகி நிறுத்தப்பட்ட தாங்கிகளை வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: இஸ்ரவேலரின் நடுவில் யெகோவா உறையும் பரிசுத்த அமைப்பை מִשְׁכָּן குறிக்கிறது. ‘திருவுறைவிடம்’ என்பது ‘உறைவிடம்’ என்ற அடிப்படைப் பொருளையும் அதன் பரிசுத்தத் தன்மையையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָהֳלוֹ
  choice: அதன் கூடாரம்
  rationale: אָהֶל என்பதன் நேரடிப் பொருள் ‘கூடாரம்.’ ஒருமை ஆண்பால் பின்னொட்டு இங்கு திருவுறைவிட அமைப்பைக் குறிக்கும் உடைமைப் பொருளில் தமிழில் ‘அதன்’ என்று இயல்பாக வருகிறது.
- source_word: מִכְסֵהוּ
  choice: அதன் மூடுறை
  rationale: מִכְסֶה என்பது மூடும் பாதுகாப்புப் படலத்தைக் குறிக்கிறது. பொருள் அல்லது சரியான வடிவத்தை உரை குறிப்பிடாததால் ‘மூடுறை’ அந்தத் தெளிவின்மையைப் பேணுகிறது.
- source_word: קְרָסָיו
  choice: அதன் இணைப்புக் கொக்கிகள்
  rationale: קֶרֶס திரைச்சீலைகளையோ மூடுறைகளையோ ஒன்றுசேர்க்கும் பொருட்களைக் குறிக்கிறது. ‘இணைப்புக் கொக்கிகள்’ அதன் சாத்தியமான வடிவத்தையும் பணியையும் தெளிவாகத் தருகிறது.
- source_word: קְרָשָׁיו
  choice: அதன் பலகைகள்
  rationale: קֶרֶשׁ பொதுவாகக் கூடார அமைப்பின் பலகை அல்லது மரச்சட்டத்தைக் குறிக்கிறது. முதன்மை உரையில் ‘பலகைகள்’ நேரடியான தேர்வு; ‘சட்டங்கள்’ என்பது உண்மையான கட்டுமான மாற்றுப் புரிதலாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: בְּרִיחָיו
  choice: அதன் இணைப்புச் சட்டங்கள்
  rationale: בְּרִיחַ பலகைகளை ஒன்றாக நிலைநிறுத்தும் நீளமான சட்டங்களைக் குறிக்கிறது. ‘இணைப்புச் சட்டங்கள்’ என்பது பூட்டுக்கான தாழ்ப்பாள் என்ற தவறான எண்ணத்தைத் தவிர்த்து, கட்டுமானப் பணியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: עַמֻּדָיו
  choice: அதன் தூண்கள்
  rationale: עַמּוּד என்பது செங்குத்தாக நிற்கும் தாங்கும் உறுப்பைக் குறிக்கிறது; ‘தூண்கள்’ தெளிவான, கண்ணியமான கட்டடவியல் சொல்.
- source_word: אֲדָנָיו
  choice: அதன் அடிப்பீடங்கள்
  rationale: אֶדֶן என்பது தூண் அல்லது பலகை பொருத்தப்பட்ட அடிப்பகுதி அல்லது தாங்கியைச் சுட்டுகிறது. ‘அடிப்பீடங்கள்’ பொதுவாசகர்களுக்குத் தெளிவாக அதன் கட்டுமானப் பணியைத் தருகிறது; ‘பொருத்துத் தாங்கிகள்’ என்ற நுட்பமான சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
