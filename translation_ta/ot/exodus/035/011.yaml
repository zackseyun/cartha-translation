translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பட்டியல் அமைப்பு சுருக்கமாகப் பேணப்பட்டாலும், ஒவ்வொரு உறுப்பின் தொடர்பைத் தெளிவாக்க ‘அதன்’ மீண்டும் பயன்படுத்தப்பட்டுள்ளது. தொழில்நுட்பச் சொற்கள் மிகையாகாமல், கட்டுமானப் பணி புரியுமாறு சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
