translation_notes:
  register: நவீன நிலையான தமிழில், கூடாரப் பொருட்களின் பட்டியல் தன்மையைப் பேணும் சுருக்கமான, கண்ணியமான நடை. ஒவ்வொரு பொருளுக்கும் ‘-ஐயும்’ இணைப்பைப் பயன்படுத்தி எபிரெயப் பட்டியலின் தொடர்ச்சியை இயல்பான தமிழில் வைத்துள்ளது. உறுதியற்ற תְּחָשִׁים என்பதற்கு ஒரு விலங்கைத் திட்டவட்டமாக நிர்ணயிக்காமல் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
