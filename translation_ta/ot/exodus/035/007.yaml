source:
  edition: WLC
  text: וְ/עֹרֹ֨ת אֵילִ֧ם מְאָדָּמִ֛ים וְ/עֹרֹ֥ת תְּחָשִׁ֖ים וַ/עֲצֵ֥י שִׂטִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/007.yaml
  text: and rams’ skins dyed red[a], and hides of sea cows, and acacia wood.
translation:
  language: ta
  text: சிவப்புச் சாயமிட்ட செம்மறியாட்டுக் கடாக்களின் தோல்களையும், தகாஷ் தோல்களையும்[a], அகாசியா மரத்தையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தகாஷ்” (תְּחָשִׁים) என்ற எபிரெயச் சொல் எதைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை. இது “நயமான தோல்,” “வெள்ளாட்டுத் தோல்,” “கடற்பன்றி தோல்,” “டுகோங் தோல்,” அல்லது “கடற்பசுத் தோல்” என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת
  choice: தோல்கள்
  rationale: עוֹר என்பதன் பன்மை வடிவம் பொருளாகப் பயன்படுத்தப்படும் விலங்குத் தோல்களைக் குறிக்கிறது; தமிழில் ‘தோல்கள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֵילִם
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: אֵילִם ஆண் செம்மறியாடுகளைக் குறிக்கிறது. ‘கடாக்கள்’ என்பதை மட்டும் விட இந்தச் சொற்றொடர் நவீன வாசகருக்கு விலங்கைத் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: מְאָדָּמִים
  choice: சிவப்புச் சாயமிட்ட
  rationale: இந்தச் செயப்படுபொருள்/விளைவுநிலை வடிவம் தோல்கள் சிவப்பாக்கப்பட்டிருந்ததைக் குறிக்கிறது; பொருள் தயாரிப்பு சூழலில் ‘சாயமிட்ட’ என்பது இயல்பான தமிழ்.
- source_word: עֹרֹת תְּחָשִׁים
  choice: தகாஷ் தோல்கள்
  rationale: תְּחַשׁ குறிக்கும் விலங்கு அல்லது தோல் வகை உறுதியாகத் தெரியவில்லை. ஒரு குறிப்பிட்ட விலங்கை ஊகித்துச் சேர்க்காமல், ஒலிபெயர்ப்பு மூலம் மூலத்தின் நிச்சயமின்மையைப் பாதுகாத்து, மாற்று விளக்கங்களை அடிக்குறிப்பில் தருகிறது.
- source_word: עֲצֵי שִׂטִּים
  choice: அகாசியா மரம்
  rationale: இந்தச் சொற்றொடர் அகாசியா வகை மரத்திலிருந்து கிடைக்கும் மரப்பொருளைக் குறிக்கிறது; ‘அகாசியா மரம்’ என்பது நவீன தமிழில் தெளிவான தாவரவியல் பெயர்.
