  source_fidelity: திருத்தம் தேவை. வரைவு מִלֵּא אֹתָם என்பதைக் ஒரே வசனத்தில் இருமுறை “நிரப்பினார்” எனக் கூறுவதால் வாக்கிய அமைப்பும் மூலத்தின் ஒருமுறை வரும் முதன்மை வினையும் பாதிக்கப்படுகின்றன. மேலும் שֵׁשׁ என்பது மெல்லிய லினன்/சணல் நார்த் துணியைக் குறிக்கும்; “நார்ப்பட்டு” என்பது பட்டு என்னும் வேறுபட்ட இழையைச் சுட்டுவதால் தவறானது.
