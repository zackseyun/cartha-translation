base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: ta
  text: அவர் அவர்களை உள்ளத்தின் ஞானத்தால்[a] நிரப்பினார்; செதுக்குக் கலைஞர்[b], வடிவமைப்பாளர், நீல, ஊதா, கருஞ்சிவப்பு நூல்களாலும் மெல்லிய சணல் நூலாலும் சித்திரத் தையல் செய்பவர், நெசவாளர் ஆகியோரின் எல்லாவகை வேலைகளையும் செய்யவும், எல்லா வகை வேலைகளையும் செய்பவர்களாகவும் கலைவடிவங்களைத் திட்டமிடுபவர்களாகவும்[c] இருக்கும்படி அவர்களை நிரப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “உள்ளத்தின் ஞானம்.” இது உள்ளார்ந்த திறமை, பகுத்தறிவு, கைவினை நுணுக்கம் ஆகியவற்றைக் குறிக்கும் எபிரெய மொழிவழக்கு.'
    reason: cultural_note
  - marker: b
    text: அல்லது, “கைவினைஞர்.” எபிரெயச் சொல் பொதுவாகத் திறமையான கைவினைஞரைக் குறிக்கலாம்; இச்சூழலில் செதுக்குதல் போன்ற ஒரு குறிப்பிட்ட திருக்கூடாரக் கைவினை கருதப்பட்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ஒரே வேரைச் சேர்ந்த சொற்கள் மீண்டும் வருகின்றன; “திட்டங்களைத் திட்டமிடுபவர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא אֹתָם
  choice: அவர் அவர்களை ... நிரப்பினார்
  rationale: பியேல் வினையின் ‘நிரப்புதல்’ என்ற அடிப்படை உருவகத்தைத் தக்கவைத்து, எபிரெய நிறைவினையை இச்சூழலில் இயல்பான தமிழ் இறந்தகாலமாக மொழிபெயர்க்கிறது.
- source_word: חָכְמַת לֵב
  choice: உள்ளத்தின் ஞானம்
  rationale: திறமை, பகுத்தறிவு, கைவினை நுணுக்கம் ஆகியவற்றை உள்ளடக்கும் எபிரெய மொழிவழக்கை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: כָּל מְלֶאכֶת
  choice: எல்லாவகைத் தொழில்கள்
  rationale: מלאכה குறிக்கும் திறன்மிக்க பணியையும் כל என்பதன் முழுமையான விரிவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חָרָשׁ
  choice: செதுக்குக் கலைஞர்
  rationale: திருக்கூடாரக் கைவினைச் சூழலில் குறிப்பிட்ட வகைத் திறமையான கலைஞரைச் சுட்டுகிறது; சொல்லின் பரந்த பொருளை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: חֹשֵׁב
  choice: வடிவமைப்பாளர்
  rationale: கலைநயமுள்ள வடிவங்களைத் திட்டமிடும் கைவினைச் செயல்பாட்டை நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: רֹקֵם
  choice: சித்திரத் தையல் செய்பவர்
  rationale: நிறநூல்களால் அலங்கார வடிவங்களைத் தைக்கும் தொழிலை சாதாரண வாசகருக்குத் தெளிவுபடுத்துகிறது.
- source_word: תְּכֵלֶת / אַרְגָּמָן / תּוֹלַעַת הַשָּׁנִי
  choice: நீலநூல் / ஊதாநூல் / கருஞ்சிவப்புநூல்
  rationale: வண்ணங்களோடு இங்கு உட்கிடையாக உள்ள நூல் அல்லது நூற்பொருள் சார்ந்த பொருளையும் வெளிப்படுத்துகிறது.
- source_word: שֵׁשׁ
  choice: மெல்லிய நார்ப்பட்டு
  rationale: திருக்கூடாரச் சூழலில் உயர்தர மெல்லிய லினன் துணி அல்லது நூற்பொருளைக் குறிக்கும் சொல்லுக்கு தமிழில் புரிந்துகொள்ளத்தக்க இணைச்சொல்.
- source_word: אֹרֵג
  choice: நெசவாளர்
  rationale: நெசவுத் தொழில் செய்பவரைக் குறிக்கும் எபிரெய வினையெச்சப் பெயரின் நேரடியான தமிழ் வடிவம்.
- source_word: חֹשְׁבֵי מַחֲשָׁבֹת
  choice: வடிவங்களை வடிவமைப்பவர்கள்
  rationale: ஒரே வேரிலிருந்து வந்த சொற்களை எபிரெயம் மீண்டும் பயன்படுத்தும் வலியுறுத்தலை இயல்பான தமிழ் மறுமொழியால் தக்கவைக்கிறது.
theological_decisions:
- issue: மறைமுக எழுவாயான ‘அவர்’ யாரைக் குறிக்கிறது
  choice: முதன்மை உரையில் ‘அவர்’ என்றே தக்கவைத்தல்
  alternative: ‘கடவுள்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: உடனடி சூழலில் எழுவாய் கடவுளைக் குறித்தாலும், இவ்வசனத்தின் எபிரெய உரையில் பெயர் மீண்டும் வராததால் மொழிபெயர்ப்பில் அதைச் சேர்க்காமல் மூலத்தின் தொடர்ச்சியைப் பேணுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கைவினைத் தொழில்களின் பட்டியல் தெளிவாக இருக்க தொழில்பெயர்கள் ஒரே இலக்கண வடிவில் அமைக்கப்பட்டுள்ளன; இறுதிப் பகுதியில் எபிரெயச் சொல் மீட்சி இயன்றவரை பாதுகாக்கப்பட்டுள்ளது.
