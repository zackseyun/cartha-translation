translation_notes:
  register: நவீன நிலையான தமிழில், திருவாசஸ்தலப் பட்டியலின் சுருக்கமான தொடரமைப்பைப் பாதுகாக்கும் கண்ணியமான நடை. மூல வசனம் தொடரும் பட்டியலின் ஒரு பகுதியாக இருப்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. ‘திரைச்சீலைகள்’ மற்றும் ‘மறைப்புத் திரை’ என்ற வேறுபாடு קְלָעִים மற்றும் מָסָךְ ஆகிய சொற்களின் வேறுபாட்டைக் காட்டுகிறது.
