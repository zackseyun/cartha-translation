source:
  edition: WLC
  text: אֵ֚ת קַלְעֵ֣י הֶ/חָצֵ֔ר אֶת עַמֻּדָ֖י/ו וְ/אֶת אֲדָנֶ֑י/הָ וְ/אֵ֕ת מָסַ֖ךְ שַׁ֥עַר הֶ/חָצֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/017.yaml
  text: the hangings of the court[a], its pillars and its bases[c][b], and the screen for the gate of the court—
translation:
  language: ta
  text: முற்றத்தின் திரைச்சீலைகள்[a], அதன் தூண்களும் அவற்றின் அடித்தளங்களும்[b], முற்றத்தின் நுழைவாயிலுக்கான மறைப்புத் திரையும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முற்றத்தின் தொங்குதிரைகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றின் பொருத்துக் குழிகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: திரைச்சீலைகள்
  rationale: திருவாசஸ்தல முற்றத்தைச் சுற்றி அமைக்கப்பட்ட துணிப் படலங்களைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருப்பதோடு, நுழைவாயிலின் சிறப்பான மறைப்புத் திரையிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: חָצֵר
  choice: முற்றம்
  rationale: திருவாசஸ்தலத்தைச் சுற்றியுள்ள அடைக்கப்பட்ட வெளிப்பகுதியைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழ் சொல்.
- source_word: עַמֻּדָיו
  choice: அதன் தூண்கள்
  rationale: முற்றத்தின் சுற்றுத் திரைச்சீலைகளைத் தாங்கிய செங்குத்தான அமைப்புகளைக் குறிக்கிறது; ‘தூண்கள்’ என்பது கட்டட மற்றும் திருவாசஸ்தலச் சூழலுக்கு ஏற்றது.
- source_word: אֲדָנֶיהָ
  choice: அவற்றின் அடித்தளங்கள்
  rationale: தூண்களைத் தாங்கும் கீழ்ப்புற ஆதாரங்களைக் குறிக்கிறது. எபிரேயப் பெண்பால் ஒருமை உருபு முற்றத்தைக் குறித்தாலும், தமிழில் பொருளைத் தெளிவாக்க ‘அவற்றின்’ என்பது தூண்களுடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: מָסַךְ
  choice: மறைப்புத் திரை
  rationale: நுழைவிடத்தை மூடும் அல்லது மறைக்கும் துணித் திரையைக் குறிக்கிறது; சுற்றுப்புறத் ‘திரைச்சீலைகள்’ என்பதிலிருந்து சொற்பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: שַׁעַר
  choice: நுழைவாயில்
  rationale: முற்றத்துக்குள் செல்லும் திறப்பைக் குறிக்கிறது. இங்கு துணியால் ஆன திரை பயன்படுத்தப்படுவதால், தமிழில் ‘வாசல்’ என்பதைவிட ‘நுழைவாயில்’ தெளிவாக உள்ளது.
