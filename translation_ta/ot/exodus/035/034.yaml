translation_notes:
  register: நவீனத் தரத் தமிழில், எபிரெய ‘உள்ளம்’ உருவகத்தைப் பாதுகாத்தபடி வாசிக்க இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்தின் பொருளான பெசலெயேலைச் சுட்டும் ஒருமைச் சுட்டுப்பெயரின் தொடர்பும், பின்னர் இருவருக்கும் திறன் அளிக்கப்பட்டது என்ற அமைப்பும் தக்கவைக்கப்பட்டுள்ளன.
