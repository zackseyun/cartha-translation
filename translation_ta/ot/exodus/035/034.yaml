  text: וּ/לְ/הוֹרֹ֖ת נָתַ֣ן בְּ/לִבּ֑/וֹ ה֕וּא וְ/אָֽהֳלִיאָ֥ב בֶּן אֲחִיסָמָ֖ךְ לְ/מַטֵּה דָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
translation:
  language: ta
  text: கற்பிக்கும் திறனையும் அவர் அவர்களுடைய உள்ளங்களில் வைத்தார்[a]—அதாவது, அவனிலும் தாண் கோத்திரத்தைச் சேர்ந்த அகிசாமாக்கின் மகன் ஒகொலியாபிலும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அறிவுறுத்தும் திறனையும்.’ இங்கு வரும் எபிரெய வினை, திறன் தேவைப்படும் பணிகளில் வழிகாட்டுதல் உட்பட, பரந்த பொருளில் கற்பித்தல் அல்லது அறிவுறுத்துதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: கற்பிப்பதற்கான திறன்
  rationale: ירה என்பதன் ஹிஃபில் வினையெச்சம் ‘கற்பிக்க’ அல்லது ‘அறிவுறுத்த’ என்று பொருள்படும். נתן בלבו என்ற சொற்றொடருடன் இயல்பான தமிழில் இறைவன் அளித்த உள்ளார்ந்த ஆற்றலை வெளிப்படுத்த ‘கற்பிப்பதற்கான திறன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נָתַן בְּלִבּוֹ
  choice: அவனுடைய உள்ளத்தில் வைத்தார்
  rationale: இது உள்ளார்ந்த ஆற்றல் அல்லது மனப்பாங்கை அருளியதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘உள்ளத்தில் வைத்தார்’ என்பது அதன் உருவகத்தையும் பொருளையும் தக்கவைக்கிறது.
- source_word: הוּא
  choice: அவனுக்கும்
  rationale: இங்கு வெளிப்படையாக வரும் சுட்டுப்பெயர் பெசலெயேலை வலியுறுத்தி, அவனையும் ஒகொலியாபையும் இணைக்கிறது. தமிழில் இணைப்பு அமைப்பின் மூலம் இந்த வலியுறுத்தல் இயல்பாகக் காட்டப்பட்டுள்ளது.
- source_word: וְאָהֳלִיאָב
  choice: ஒகொலியாபுக்கும்
  rationale: தனிப்பெயர் நவீனத் தமிழில் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: அகிசாமாக்கின் மகன்
  rationale: மகன் என்ற நேரடியான உறவுக் குறிப்பைத் தமிழின் இயல்பான உடைமைத் தொடரில் வழங்குகிறது.
- source_word: לְמַטֵּה דָן
  choice: தாண் கோத்திரத்தைச் சேர்ந்த
  rationale: לְ இங்கு கோத்திரச் சார்பைக் குறிக்கிறது; ‘கோத்திரத்தைச் சேர்ந்த’ என்பது துல்லியமும் இயல்பும் உடைய தமிழாக்கம்.
