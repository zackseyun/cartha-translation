revisions:
- from: உங்களிடமிருந்து யாவேவுக்காக ஒரு காணிக்கையைச் சேகரியுங்கள். மனம் விரும்புகிற ஒவ்வொருவரும் யாவேவின் காணிக்கையாகத் தங்கம், வெள்ளி, வெண்கலம் ஆகியவற்றைக் கொண்டுவரட்டும்.[a]
  to: உங்களிடமிருந்து யாவேவுக்காக ஒரு காணிக்கையை எடுத்துக்கொள்ளுங்கள். தாராள மனமுள்ள ஒவ்வொருவரும்[a] அதை, யாவேவுக்கான காணிக்கையாகத் தங்கம், வெள்ளி, வெண்கலம் ஆகியவற்றைக் கொண்டுவருவார்.
  rationale: The revised wording preserves the Hebrew command, the voluntary inner disposition, the resumed designation “Yahweh’s contribution,” and the imperfect force of the bringing action in natural modern standard Tamil.
