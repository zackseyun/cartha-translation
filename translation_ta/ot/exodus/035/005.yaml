source:
  edition: WLC
  text: קְח֨וּ מֵֽ/אִתְּ/כֶ֤ם תְּרוּמָה֙ לַֽ/יהוָ֔ה כֹּ֚ל נְדִ֣יב לִבּ֔/וֹ יְבִיאֶ֕/הָ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: ta
  text: உங்களிடமிருந்து யாவேவுக்காக ஒரு காணிக்கையை எடுத்துக்கொள்ளுங்கள். தாராள மனமுள்ள ஒவ்வொருவரும்[a] அதை, யாவேவுக்கான காணிக்கையாகத் தங்கம், வெள்ளி, வெண்கலம் ஆகியவற்றைக் கொண்டுவருவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “தாராளமான இதயமுள்ள ஒவ்வொருவரும்”; இது உள்ளார்ந்த தன்னார்வ மனப்பான்மையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ מֵאִתְּכֶם
  choice: உங்களிடமிருந்து ... சேகரியுங்கள்
  rationale: பன்மை ஏவல் வடிவமும் சமூகத்திலிருந்தே காணிக்கை பெறப்பட வேண்டும் என்ற மூலக் கருத்தும் இயல்பான தமிழில் வெளிப்படுகின்றன. பொருட்களைக் காணிக்கையாகப் பெறும் சூழலில் ‘சேகரியுங்கள்’ என்பது ‘எடுத்துக்கொள்ளுங்கள்’ என்பதைவிடத் தெளிவானது.
- source_word: תְּרוּמָה
  choice: காணிக்கை
  rationale: பரிசுத்தப் பயன்பாட்டுக்காக ஒதுக்கப்படும் பங்களிப்பை இச்சூழலில் இயல்பாகக் குறிக்கிறது; தொழில்நுட்பமான சடங்குச் சொல்லைத் தவிர்க்கிறது.
- source_word: לַיהוָה / יְהוָה
  choice: யாவேவுக்காக / யாவேவின்
  rationale: எபிரேய மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பெயராகவே தருகிறது; לְ அர்ப்பணிப்பின் நோக்கத்தைக் குறிக்கிறது.
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: மனம் விரும்புகிற ஒவ்வொருவரும்
  rationale: கொடுப்பது உள்ளார்ந்த சுயவிருப்பத்தால் நிகழ்வதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘இதயம்’ என்ற சொல் நேரடியாக இல்லாவிட்டாலும் எபிரேய மொழிமரபின் பொருள் காக்கப்படுகிறது.
- source_word: יְבִיאֶהָ
  choice: கொண்டுவரட்டும்
  rationale: தன்னார்வச் சூழலைக் குலைக்காமல் எதிர்பார்க்கப்படும் செயலைக் கட்டளைநயமுள்ள தமிழில் வெளிப்படுத்துகிறது.
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: தங்கம், வெள்ளி, வெண்கலம்
  rationale: திருக்கூடாரப் பொருட்களின் பட்டியலில் נְחֹשֶׁת என்பதற்கு ‘வெண்கலம்’ என்பது வழக்கமானதும் பண்டைய கலப்பு உலோகப் பயன்பாட்டுக்கு ஏற்றதுமான மொழிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் இறைவனின் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: காணிக்கையின் தன்னார்வ இயல்பு
  choice: மனம் விரும்புகிற ஒவ்வொருவரும்
  alternative: ஒவ்வொருவரும் கொண்டுவர வேண்டும்
  rationale: כֹּל נְדִיב לִבּוֹ என்பது உள்ளார்ந்த விருப்பத்தைக் குறிப்பதால், அனைவர்மீதும் கட்டாயம் விதிப்பதாக மொழிபெயர்க்காமல் மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ். எபிரேய வாக்கியத்தின் மறுபெயரிடும் அமைப்பு தமிழில் இயல்பாக ஓடும் வகையில் ஒருங்கிணைக்கப்பட்டுள்ளது; தன்னார்வம் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
