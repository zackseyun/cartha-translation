  text: לֹא תְבַעֲר֣וּ אֵ֔שׁ בְּ/כֹ֖ל מֹשְׁבֹֽתֵי/כֶ֑ם בְּ/י֖וֹם הַ/שַּׁבָּֽת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/003.yaml
  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: ta
  text: ஓய்வுநாளில் உங்கள் குடியிருப்புகள் எதிலும் நெருப்பு மூட்ட வேண்டாம்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: மூட்ட வேண்டாம்
  rationale: בער என்பதன் பியேல் வடிவம் இங்கு நெருப்பைப் பற்றவைத்தல் அல்லது மூட்டுதல் என்று பொருள்படுகிறது. தமிழில் எதிர்மறைக் கட்டளையாக ‘நெருப்பு மூட்ட வேண்டாம்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: ஒருமைச் சொல் நெருப்பைக் குறிக்கிறது. தமிழில் ‘நெருப்பு மூட்டு’ என்ற இயல்பான சொல்லிணைப்பில் தனியான வரையறையற்ற சுட்டுச்சொல் தேவையில்லை.
- source_word: בְּכֹל
  choice: எதிலும்
  rationale: כֹל இங்கு பகிர்ந்தளிக்கும் பொருளில், ஒவ்வொரு குடியிருப்பையும் விதிவிலக்கின்றி உள்ளடக்குகிறது. ‘உங்கள் குடியிருப்புகள் எதிலும்’ என்பது அந்தப் பரப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֹשְׁבֹתֵיכֶם
  choice: உங்கள் குடியிருப்புகள்
  rationale: מוֹשָׁב என்பது வசிப்பிடம் அல்லது குடியிருப்பைக் குறிக்கலாம். ‘குடியிருப்புகள்’ என்பது ‘வீடுகள்’ என்பதைவிட பரந்த பொருளைத் தக்கவைத்து, ‘குடியேற்றங்கள்’ என்று மிகப் பொதுவெளி சார்ந்த பொருளுக்கு நகராமல் இருக்கிறது.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: ஓய்வுநாளில்
  rationale: இது நேரத்தைக் குறிக்கும் நேரடியான சொற்றொடர். தமிழில் ‘ஓய்வுநாளில்’ என்பதே ‘ஓய்வுநாளாகிய நாளில்’ என்ற தேவையற்ற மீளுரையைத் தவிர்த்து, மூலத்தின் காலக் குறிப்பைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ஓய்வுநாளில் நெருப்பு குறித்த தடையின் வரம்பு
  choice: நெருப்பு மூட்டுவதை நேரடியாகத் தடைசெய்யும் கட்டளையாக மொழிபெயர்த்தல்
  alternative: எல்லா வகையான நெருப்புப் பயன்பாடு, நெருப்பைப் பேணுதல், அல்லது வெப்பம் தொடர்பான எல்லா வேலைகளையும் உள்ளடக்கும் வகையில் விரிவுபடுத்துதல்
  rationale: எபிரெய உரை ஓய்வுநாளில் இஸ்ரவேலரின் குடியிருப்புகளில் நெருப்பு மூட்டுவதையே குறிப்பாகத் தடைசெய்கிறது. பிற்கால விளக்க மரபுகளிலுள்ள விரிவான பயன்பாடுகளை மொழிபெயர்ப்புக்குள் சேர்க்காமல், வசனம் கூறும் கட்டளையை மட்டும் தெளிவாகத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருப்புகள்’ மூலச்சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது; ‘மூட்ட வேண்டாம்’ இயல்பான தமிழ் எதிர்மறைக் கட்டளையாக உள்ளது.
