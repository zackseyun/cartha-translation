  terminology: “ஓய்வுநாள்,” “குடியிருப்புகள்,” and “நெருப்பு மூட்ட” are suitable and consistent choices. “மூட்ட வேண்டாம்” precisely expresses the act of kindling rather than a broader prohibition on fire.
