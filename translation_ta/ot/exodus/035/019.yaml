  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: ta
  text: நேர்த்தியாக நெய்யப்பட்ட ஆடைகள்[a], பரிசுத்த இடத்தில்[b] பணியாற்றுவதற்கானவை; ஆசாரியனாகிய ஆரோனுக்கான பரிசுத்த ஆடைகள்; ஆசாரியர்களாகப் பணியாற்றுவதற்கான அவனுடைய மகன்களின் ஆடைகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பணிக்குரிய ஆடைகள்’; இங்குள்ள எபிரெயச் சொல் சிறப்பாக நெய்யப்பட்ட ஆடைகளையோ, பணிக்குப் பயன்படுத்தப்படும் ஆடைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பரிசுத்தமான இடத்தில்’ அல்லது ‘பரிசுத்த வளாகத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: ஆடைகள்
  rationale: ஆடை வகைகளைக் குறிக்கும் அடிப்படைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; பிற்கால சமயப் பதவியாடைச் சொல்லாட்சியைத் திணிக்கவில்லை.
- source_word: הַשְּׂרָד
  choice: நுணுக்கமாக நெய்யப்பட்ட
  rationale: கூடாரச் சூழலில் சிறப்பாகச் செய்யப்பட்ட நெசவுப் பொருளைக் குறிக்கலாம். எனினும் ‘பணிக்குரிய’ என்ற பொருளும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְשָׁרֵת
  choice: பணியாற்றுவதற்கான
  rationale: பரிசுத்த இடம் சார்ந்த ஊழியத்தைத் தெரிவிக்கிறது; அதேவேளையில் குறிப்பிட்ட பிற்கால சமயச் சொல்லைத் திணிக்காமல் தெளிவாக உள்ளது.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: இங்கு அருவமான பரிசுத்தத் தன்மையைவிட, கூடாரத்தின் புனிதமான இடம் அல்லது வளாகமே குறிக்கப்படுகிறது. ‘திருத்தலம்’ என்பதையும் விட எபிரெயச் சொல்லின் இடவியல் தெளிவை இது காக்கிறது.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: பரிசுத்த ஆடைகள்
  rationale: ‘பரிசுத்தத்திற்குரிய ஆடைகள்’ என்ற எபிரெயக் கட்டமைப்பின் இயல்பான, நேரடியான தமிழ் வடிவம்.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: ஆசாரியனாகிய ஆரோனுக்கான
  rationale: ஆரோனுடைய பணிநிலையை இயல்பான தமிழில் அடையாளப்படுத்துகிறது.
- source_word: בִּגְדֵי בָנָיו
  choice: அவனுடைய மகன்களின் ஆடைகள்
  rationale: எபிரெய உரையின் உடைமை உறவைத் தெளிவாகவும் நேரடியாகவும் காக்கிறது.
- source_word: לְכַהֵן
  choice: ஆசாரியர்களாகப் பணியாற்றுவதற்கான
  rationale: כהן என்பதன் வினை வலிமையைப் பாதுகாத்து, ஆசாரியப் பொறுப்பில் செயல்படுவதைக் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: בִּגְדֵי הַשְּׂרָד மற்றும் בִּגְדֵי הַקֹּדֶשׁ ஆகியவற்றுக்கிடையிலான உறவு
  choice: முதல் தொடரை பரிசுத்த இடப் பணிக்கான சிறப்பாக நெய்யப்பட்ட ஆடைகளாகவும், அடுத்து ஆரோனுக்கும் அவன் மகன்களுக்கும் உரிய பரிசுத்த ஆடைகளைத் தனித்தனியாகவும் மொழிபெயர்த்தல்.
  alternative: முதல் தொடரைத் தொடர்ந்து வரும் ஆசாரிய ஆடைகளுக்கான இன்னொரு விளக்கமாக, அதாவது இரண்டையும் ஒரே தொகுப்பைக் குறிப்பதாகப் புரிந்துகொள்ளுதல்.
  rationale: மீண்டும் வரும் אֶת என்னும் நேரடி செயப்படுபொருள் குறியீடு பட்டியலில் தனி உருப்படிகளை ஆதரிக்கிறது. இருப்பினும் அவை விளக்கநிலைத் தொடர்புடையவையாக இருக்கக்கூடிய வாய்ப்பை மறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘ஆசாரியர்’ என்பது இச்சூழலின் நிறுவப்பட்ட பணிப்பெயராக வைக்கப்பட்டுள்ளது; ‘பணியாற்றுதல்’ மூலத்தின் சேவை சார்ந்த வினைப்பொருளைக் காக்கிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளன.
