  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: ta
  text: வெள்ளி அல்லது வெண்கலக் காணிக்கையைச் செலுத்திய ஒவ்வொருவரும், யாவேக்குரிய காணிக்கையாக அதை கொண்டுவந்தார்கள்[a]. சேவைப் பணியின் எல்லா வேலைகளுக்கும் பயன்படுவதற்காக, தம்மிடம் அகேசியா மரம் இருந்த அனைவரும் அதை கொண்டுவந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெள்ளி மற்றும் வெண்கலக் காணிக்கை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய இணைப்புச்சொல் இரு முறையிலும் எடுத்துரைக்கப்படலாம்; இங்கு ஒவ்வொருவரும் தம்மிடமிருந்த உலோக வகையைக் கொண்டுவந்தனர் என்பதே கருத்து.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘யாரிடம் அகேசியா மரம் காணப்பட்டதோ அவர்கள்’ என்று உள்ளது; அதாவது, அகேசியா மரம் தம்மிடம் கிடைக்கப்பெற்றவர்கள் அல்லது வைத்திருந்தவர்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: காணிக்கையைச் செலுத்திய ஒவ்வொருவரும்
  rationale: רוּם என்ற வினையின் பங்கேற்பு வடிவம் תְּרוּמָה என்பதுடன் சேர்ந்து, காணிக்கையை எடுத்துச் சமர்ப்பிப்பதைக் குறிக்கும் மரபுத்தொடராக உள்ளது. நவீன தமிழில் ‘செலுத்திய’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: வெள்ளி அல்லது வெண்கலக் காணிக்கை
  rationale: תְּרוּמָה என்பது புனிதப் பயன்பாட்டுக்காகப் பிரித்தளிக்கப்படும் காணிக்கை. נְחֹשֶׁת இச்சூழலில் வழக்கமாக ‘வெண்கலம்’ என மொழிபெயர்க்கப்படுகிறது. ஒவ்வொருவரும் தம்மிடமிருந்த உலோக வகையை அளித்தனர் என்ற பகிர்நிலைப் பொருளை ‘அல்லது’ இயல்பாகத் தருகிறது; எபிரெய இணைப்பை ‘மற்றும்’ என்றும் கொள்ளலாம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: அதை யாவேக்குரிய காணிக்கையாகக் கொண்டுவந்தார்கள்
  rationale: תְּרוּמַת יְהוָה என்பது யாவேக்குச் சொந்தமான அல்லது அவருக்கென்று ஒதுக்கப்பட்ட காணிக்கையைக் குறிக்கிறது. தமிழில் உரிமை/ஒதுக்கீட்டுப் பொருளை ‘யாவேக்குரிய’ தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் நேரடியாக இடம்பெறும் நான்கெழுத்துத் திருப்பெயரை, பட்டப்பெயரால் மாற்றாமல் தமிழில் பொதுவாக அறியப்படும் ‘யாவே’ என்ற ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: தம்மிடம் இருந்த அனைவரும்
  rationale: சொல்லுக்குச் சொல் ‘யாரிடம் காணப்பட்டதோ’ என்ற எபிரெய மரபுத்தொடர், உடைமை அல்லது கிடைப்பைக் குறிக்கிறது. ‘தம்மிடம் இருந்த’ என்பது அதன் பொருளை இயல்பான நவீன தமிழில் தருகிறது; நேரடி அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עֲצֵי שִׁטִּים
  choice: சீத்திம் மரம்
  rationale: שִׁטָּה எனும் மரத்தின் துல்லியமான தாவரவியல் அடையாளம் முழுமையாக உறுதியில்லை; அது பொதுவாக acacia என அடையாளப்படுத்தப்படுகிறது. மூலச் சொல்லின் தனித்தன்மையையும் அடையாளத்தின் சிறிய நிச்சயமின்மையையும் காக்க ‘சீத்திம் மரம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: வழிபாட்டுப் பணியின் எந்த வேலைக்காவது பயன்படும்
  rationale: מְלָאכָה வேலை/கைவினையையும் עֲבֹדָה பணி/சேவையையும் குறிக்கின்றன. இங்கு பரிசுத்தக் கூடாரப் பணி சூழலாக இருந்தாலும், வசனம் ‘கூடாரம்’ என்று வெளிப்படையாகச் சொல்லாததால் அதைச் சேர்க்கவில்லை. ‘எந்த வேலைக்காவது’ என்பது לְכָל என்பதன் பகிர்நிலைப் பொருளைத் தருகிறது.
- source_word: הֵבִיאוּ
  choice: அதைக் கொண்டுவந்தார்கள்
  rationale: மரம் தமிழில் ஒருமைத் திரள்பொருளாக வருவதால், பின்னோக்குச் சுட்டாக ‘அதை’ சேர்ப்பது வாக்கியத்தை இயல்பாகவும் முழுமையாகவும் ஆக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: இவ்வசனம் பட்டப்பெயரை அல்ல, உடன்படிக்கையின் திருப்பெயரான יהוה என்பதை நேரடியாகக் கொண்டுள்ளது. அதன் தனிப்பெயர் இயல்பைத் தக்கவைக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: תְּרוּמַת יְהוָה என்பதில் உள்ள உறவு
  choice: யாவேக்குரிய காணிக்கை
  alternative: யாவேக்குச் செலுத்தும் காணிக்கை
  rationale: எபிரெய கட்டமைப்பு இயல்பாக ‘யாவேயின் காணிக்கை’ என்ற உரிமை அல்லது அவருக்கென ஒதுக்கப்பட்ட நிலையைச் சுட்டுகிறது. ‘யாவேக்குரிய’ என்பது அந்தத் திறந்த உறவைப் பாதுகாக்கிறது; பெறுநர் பொருளுக்கு மட்டும் அதைச் சுருக்கவில்லை.
