  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goats’ hair,
translation:
  language: ta
  text: நீல நூலும், ஊதா நூலும், செந்நிற நூலும், மெல்லிய சணல் துணியும், வெள்ளாட்டு முடியும்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְכֵלֶת
  choice: நீலநூல்
  rationale: நீலம் அல்லது நீல-ஊதா நிறத்தில் சாயமிடப்பட்ட நெசவுப் பொருளைக் குறிக்கிறது. கூடாரப் பொருட்களின் பட்டியலில் நூல் என வெளிப்படுத்துவது தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: אַרְגָּמָן
  choice: ஊதாநூல்
  rationale: ஊதா நிறச் சாயமிடப்பட்ட நெசவுப் பொருளைக் குறிக்கிறது; இணையான பட்டியல் கூறுகளுடன் ‘நூல்’ என மொழிபெயர்ப்பது தெளிவளிக்கிறது.
- source_word: תוֹלַעַת שָׁנִי
  choice: செந்நிற நூல்
  rationale: பூச்சியிலிருந்து பெறப்பட்ட சாயத்தால் செந்நிறமாக்கப்பட்ட பொருளைக் குறிக்கும் மரபுத்தொடர். அதன் சொற்பிறப்பை விட நெசவுச் சூழலில் குறிக்கப்படும் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: שֵׁשׁ
  choice: மெல்லிய நார்ப்பட்டு
  rationale: திருக்கூடாரச் சூழலில் உயர்தரமான மெல்லிய சணல் நாரால் நெய்யப்பட்ட துணி அல்லது நூலைக் குறிக்கிறது. ‘நார்ப்பட்டு’ என்பது தமிழில் பட்டு இழையைச் சுட்டாமல் நுண்ணிய தாவரநார் நெசவுப் பொருளைக் குறிக்கும் மரபான வேதாகமச் சொல்; ‘மெல்லிய’ என்பது தர வேறுபாட்டைக் காக்கிறது.
- source_word: עִזִּים
  choice: வெள்ளாட்டு முடி
  rationale: சொல்லளவில் ‘வெள்ளாடுகள்’ என்றாலும், இப்பொருட்பட்டியலில் கூடார மூடுதுணிகளை நெய்யப் பயன்படுத்திய வெள்ளாட்டு முடியையே குறிக்கிறது. உயிருள்ள விலங்குகள் என்று தவறாகப் புரியாதபடி உட்கிடையான பொருளை வெளிப்படுத்துகிறது.
- source_word: וְ
  choice: -உம் / மற்றும் எனும் இணைப்புப் பொருள்
  rationale: ஒவ்வொரு பட்டியல் உறுப்பையும் இணைக்கும் எபிரெய இணைப்பை, தமிழில் இயல்பான தொடர்ச்சிப் பட்டியல் அமைப்பான ‘-உம்’ விகுதியால் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், திருக்கூடார நெசவுப் பொருட்களின் பட்டியலாகத் தெளிவாக வாசிக்கப்படும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான וְ இணைப்புகள் ‘-உம்’ மூலம் பிரதிபலிக்கப்பட்டுள்ளன; வசனம் அடுத்த பட்டியல் கூறை நோக்கித் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
