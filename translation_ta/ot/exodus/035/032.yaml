  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘திட்டங்களைத் திட்டமிட’ அல்லது ‘வடிவமைப்புகளை வடிவமைக்க’ என்பதுபோல், ஒரே வேரிலிருந்து வந்த வினைச்சொல்லும் பெயர்ச்சொல்லும் பயன்படுத்தப்பட்டுள்ளன; இது திறமையான வடிவமைப்புக் கருத்தாக்கத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வெண்கலம்’ என்பதற்கு ‘செம்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/חְשֹׁב מַחַשָׁבֹת
  choice: கலைநயமிக்க வடிவமைப்புகளைத் திட்டமிடவும்
  rationale: חשׁב என்ற வினையும் அதே வேரிலிருந்து வந்த மַחֲשָׁבוֹת என்ற பெயர்ச்சொல்லும் இணைந்து திறமையான கலைத் திட்டமிடுதலை வலியுறுத்துகின்றன. தமிழில் இயல்பாக இருக்க ‘திட்டமிட’ என்பதுடன் சூழலுக்கேற்ற ‘கலைநயமிக்க வடிவமைப்புகள்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் வேர்ச்சொல் மீளுரையை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: לַ/עֲשֹׂת
  choice: வேலை செய்யவும்
  rationale: עשה பொதுவாக ‘செய்/உருவாக்கு’ என்று பொருள்பட்டாலும், இங்கு உலோகக் கைவினைச் சூழலில் பொருட்களைக் கொண்டு திறமையாக வேலை செய்வதைக் குறிக்கிறது.
- source_word: בַּ/זָּהָב
  choice: பொன்னிலும்
  rationale: ב முன்னொட்டு கைவினை நடைபெறும் மூலப்பொருளைக் குறிக்கிறது; பட்டியலில் ‘பொன்னிலும்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וּ/בַ/כֶּסֶף
  choice: வெள்ளியிலும்
  rationale: இணையான பொருட்களின் பட்டியலைத் தமிழில் இயல்பாகத் தொடர்கிறது.
- source_word: וּ/בַ/נְּחֹשֶׁת
  choice: வெண்கலத்திலும்
  rationale: משכן கைவினைச் சூழலில் נְחֹשֶׁת வழக்கமாக ‘வெண்கலம்’ என மொழிபெயர்க்கப்படுகிறது; ‘செம்பு’ என்பதும் சொற்பொருள் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
