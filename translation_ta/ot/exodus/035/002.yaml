base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: ta
  text: ஆறு நாட்கள் வேலை செய்யலாம். ஆனால் ஏழாம் நாள் உங்களுக்குப் புனிதமான ஓய்வுநாளாக, யாவேக்கான[b] முழுமையான ஓய்வாக[a] இருக்கும். அந்த நாளில் வேலை செய்கிற எவரும் மரணத் தண்டனைக்கு உட்படுத்தப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “முற்றிலும் ஓய்வெடுக்கும் ஓய்வுநாள்.” “ஓய்வுநாள், ஓய்வு” என்ற எபிரெயச் சொற்றொடர் வேலையிலிருந்து முழுமையாக ஓய்வதை வலியுறுத்துகிறது.'
    reason: lexical_alternative
  - marker: b
    text: “யாவேக்கான” என்பதை “யாவேக்கு” அல்லது “யாவேக்கு உரிய” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: வேலை செய்யலாம்
  rationale: எபிரெய வினைச்சொல் செயப்பாட்டு வடிவில் இருந்தாலும், சட்ட அறிவுறுத்தலின் அனுமதி அல்லது ஒழுங்குமுறைத் தொனியை இயல்பான நவீனத் தமிழில் இது தெளிவாகத் தருகிறது; ‘வேலை செய்யப்படும்’ என்பது தமிழில் இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: קֹדֶשׁ
  choice: புனிதமான நாள்
  rationale: இது ஏழாம் நாளின் அர்ப்பணிக்கப்பட்ட, புனித நிலையைச் சுட்டுகிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘நாள்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: முழு ஓய்வின் ஓய்வுநாள்
  rationale: ஒரே வேர் சார்ந்த எபிரெயச் சொற்களின் வலியுறுத்தலை ஓரளவு காத்து, வேலை முற்றிலும் நிறுத்தப்படும் ஓய்வைத் தெரிவிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கான
  rationale: ל முன்னிடைச்சொல் அர்ப்பணிப்பு, நோக்கு அல்லது உரிமை சார்ந்த பொருளைக் கொள்ளலாம். ‘யாவேக்கான’ என்பது இந்தத் தொடர்பைத் தீர்மானமாகச் சுருக்காமல் இயல்பாகக் காட்டுகிறது.
- source_word: כָּל הָעֹשֶׂה בּוֹ מְלָאכָה
  choice: அதில் வேலை செய்கிற எவரும்
  rationale: பொதுவான சட்ட நிபந்தனையின் அனைவரையும் உள்ளடக்கும் வலிமையையும், ஓய்வுநாளைக் குறிக்கும் בּוֹ என்பதையும் இயல்பான தமிழில் தருகிறது.
- source_word: יוּמָת
  choice: கொல்லப்பட வேண்டும்
  rationale: ஹோஃபால் வடிவின் காரணச் செயப்பாட்டுப் பொருளான ‘மரணத்திற்குள்ளாக்கப்படுதல்’ என்பதை நேரடியான சட்ட மொழியில் தருகிறது. தனியான வலியுறுத்தும் infinitive absolute இல்லாததால் ‘நிச்சயமாக’ சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை நான்கெழுத்து உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- issue: לַיהוָה என்பதன் உறவு
  choice: யாவேக்கான
  alternative: யாவேக்கு / யாவேக்கு உரிய
  rationale: ஓய்வுநாள் யாவேக்கு அர்ப்பணிக்கப்பட்டது, அவரை நோக்கியது, அல்லது அவருக்கு உரியது என்ற பொருட்சாத்தியங்களை எபிரெய ל கொண்டுள்ளது. ‘யாவேக்கான’ இந்தப் பொருள் வரம்பைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில், சட்ட அறிவுறுத்தலுக்கேற்ற கண்ணியமான மற்றும் நேரடியான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஓய்வுநாள்’ என்பது Sabbath-ஐ இயல்பாகக் குறிக்கிறது; ‘முழு ஓய்வின் ஓய்வுநாள்’ மூலத்தின் வலியுறுத்தலைத் தக்கவைக்கிறது. மரணத் தண்டனைச் சொற்றொடர் மூலத்தின் செயப்பாட்டு சட்ட வடிவில் வைக்கப்பட்டுள்ளது.
