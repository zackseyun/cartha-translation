base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: ta
  text: ஆணோ பெண்ணோ, எவருடைய உள்ளம் அவர்களைக் கொண்டுவரத் தூண்டியதோ, அவர்களெல்லாரும் யாவே மோசேயின் மூலம் செய்யக் கட்டளையிட்ட எல்லாப் பணிக்காகக் கொண்டுவந்தார்கள். இஸ்ரவேல் மக்கள் யாவேக்குத் தன்னார்வக் காணிக்கையைக் கொண்டுவந்தார்கள்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உள்ளம் அவர்களைக் கொண்டுவரத் தூண்டியதோ” என்பதை “உள்ளம் அவர்களை மனமுவந்து கொடுக்கச் செய்ததோ” என்றும் மொழிபெயர்க்கலாம். எபிரெய மரபுத்தொடர் உள்ளார்ந்த விருப்பத்தையும் தூண்டுதலையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “மோசேயின் மூலம்” என்பது சொல்லுக்குச் சொல் “மோசேயின் கையால்”; இது மோசே வழியாகக் கட்டளை வழங்கப்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: “இஸ்ரவேல் மக்கள்” என்பது சொல்லுக்குச் சொல் “இஸ்ரவேலின் பிள்ளைகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: ஆண்களிலும் பெண்களிலும் ... அனைவரும்
  rationale: எபிரெயச் சொற்றொடர் ஆண்களையும் பெண்களையும் வெளிப்படையாகக் குறிப்பதோடு, כָּל என்பதன் பகிர்ந்தளிக்கும் பொருளையும் கொண்டுள்ளது. இத்தமிழாக்கம் இருபாலரின் பங்கேற்பை இயல்பான நவீன தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: נָדַב לִבָּם אֹתָם
  choice: எவருடைய உள்ளம் அவர்களை முன்வந்து கொடுக்கத் தூண்டியதோ
  rationale: נדב மற்றும் ‘உள்ளம்’ இணையும் மரபுத்தொடர் உள்ளார்ந்த விருப்பத்தையும் தன்னார்வத் தூண்டுதலையும் குறிக்கிறது. ‘தூண்டியது’ கட்டாயத்தை அல்ல, மனமுவந்த உந்துதலை இங்கு வெளிப்படுத்துகிறது.
- source_word: לְהָבִיא
  choice: தேவையானவற்றைக் கொண்டுவந்தார்கள்
  rationale: வினையின் நேர்ப்பொருள் ‘கொண்டுவருதல்.’ பொருள் சூழலில் மறைந்திருப்பதால், கூடாரப் பணிக்குத் தேவையான பங்களிப்புகள் என்பதைக் குறிக்க ‘தேவையானவற்றை’ இயல்பான தமிழுக்காக அளவாக நிரப்புகிறது.
- source_word: לְכָל הַמְּלָאכָה
  choice: எல்லா வேலைகளுக்கும்
  rationale: מְלָאכָה இங்கு திருவாசஸ்தலத்தையும் அதன் பொருட்களையும் உருவாக்கும் மொத்தப் பணியைக் குறிக்கிறது; ‘வேலைகள்’ அதன் பரந்த சூழற்பொருளைத் தருகிறது.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலம் யெகோவா செய்யும்படி கட்டளையிட்ட
  rationale: בְּיַד מֹשֶׁה என்பதன் சொற்பொருள் ‘மோசேயின் கையால்’; இங்கு அது இடைமுகம் அல்லது முகவர் வழியாக என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘மோசேயின் மூலம்’ அதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் நிலைபெற்ற தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் ... கொண்டுவந்தார்கள்
  rationale: בְנֵי יִשְׂרָאֵל என்பது மக்களினப் பெயராகப் பயன்படுகிறது. ‘இஸ்ரவேல் மக்கள்’ என்பது ‘இஸ்ரவேலின் பிள்ளைகள்’ என்ற சொற்படி வடிவைவிட நவீன தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது.
- source_word: נְדָבָה
  choice: தன்னார்வக் காணிக்கை
  rationale: נְדָבָה கட்டாயமின்றி மனமுவந்து அளிக்கப்படும் காணிக்கையைக் குறிக்கிறது. ‘தன்னார்வக் காணிக்கை’ அந்த வேறுபாட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரையில் தனிப்பட்ட திருநாமம் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என்ற திருநாம வடிவில் தரப்பட்டுள்ளது; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான நடை. முதல் நீண்ட எபிரெய வாக்கியத்தின் கருப்பொருள் தமிழில் தெளிவாக அமைய இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. உள்ளார்ந்த தன்னார்வமும் திருநாமத்தின் தனிப்பெயர் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
