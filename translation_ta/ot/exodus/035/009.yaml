revisions:
- from: கோமேதகக் கற்களையும்[a], ஏபோதிலும் மார்ப்பதக்கத்திலும் பதிப்பதற்கான கற்களையும் கொண்டுவர வேண்டும்.
  to: சோகாம் கற்களையும்[a], ஏபோத்திற்கும் மார்ப்பதக்கத்திற்கும் பதிப்பதற்கான கற்களையும் கொண்டுவர வேண்டும்.
  rationale: The revision replaces the misleadingly specific gemstone name with a transliteration and retains the lexical uncertainty in a focused footnote. It also corrects the Tamil case construction for the ephod, so that both the ephod and breastpiece are clearly the items for which the setting stones are intended. The list-continuation sense is retained through ‘கொண்டுவர வேண்டும்,’ as supplied by the immediate context.
