    reason: lexical_alternative
  revision_rationale: The revision replaces the misleadingly specific gemstone name with a transliteration and retains the lexical uncertainty in a focused footnote. It also corrects the Tamil case construction for the ephod, so that both the ephod and breastpiece are clearly the items for which the setting stones are intended. The list-continuation sense is retained through ‘கொண்டுவர வேண்டும்,’ as supplied by the immediate context.
