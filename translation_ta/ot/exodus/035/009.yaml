translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு நுட்பச்சொற்களைப் பாதுகாத்தபடியே சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனம் முந்தைய கட்டளையின் பட்டியலைத் தொடர்வதால், தமிழில் முழுமையான வாக்கியமாக இயல்பாக அமைய ‘கொண்டுவர வேண்டும்’ சேர்க்கப்பட்டது.
