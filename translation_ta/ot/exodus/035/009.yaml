  text: onyx stones[a], and stones for setting, for the ephod and for the breastpiece.
translation:
  language: ta
  text: சோகாம் கற்களையும்[a], ஏபோத்திற்கும் மார்ப்பதக்கத்திற்கும் பதிப்பதற்கான கற்களையும் கொண்டுவர வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய שֹׁהַם (ஷோஹம்) எந்த வகைக் கல்லைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை. இது மரபாக ‘ஒனிக்ஸ்’ என மொழிபெயர்க்கப்படுகிறது; ‘பெரில்’ அல்லது ‘ஷோஹம் கல்’ என்பதும் சாத்தியமான மொழிபெயர்ப்புகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: கோமேதகக் கற்கள்
  rationale: שֹׁהַם என்பது துல்லியமாக அடையாளம் காண முடியாத ஒரு விலையுயர்ந்த கல்லின் பெயர். தமிழ் வேதாகம மரபில் அறியப்பட்ட ‘கோமேதகம்’ என்பதை முதன்மை மொழிபெயர்ப்பாக வைத்து, நிச்சயமின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: אַבְנֵי מִלֻּאִים
  choice: பதிப்பதற்கான கற்கள்
  rationale: מִלֻּאִים இங்கு ஆசாரிய உடைகளில் பொருத்தப்படும் அல்லது பதிக்கப்படும் கற்களைக் குறிக்கிறது. ‘பதிப்பதற்கான கற்கள்’ என்பது அதன் செயல்பாட்டை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: לָאֵפֹד
  choice: ஏபோதில்
  rationale: אֵפֹד என்பது ஆசாரியருக்குரிய தனிப்பட்ட ஆடையின் தொழில்நுட்பப் பெயர். அதன் வழக்கமான ஒலிபெயர்ப்பான ‘ஏபோத்’ பாதுகாக்கப்பட்டு, இடப்பொருளைக் காட்ட ‘ஏபோதில்’ என வழங்கப்படுகிறது.
- source_word: וְלַחֹשֶׁן
  choice: மார்ப்பதக்கத்தில்
  rationale: חֹשֶׁן என்பது கற்கள் பதிக்கப்பட்ட ஆசாரியரின் மார்புப் பகுதி அணிகலனைக் குறிக்கிறது; போர்க் கவசம் என்ற தவறான எண்ணத்தைத் தவிர்த்து, ‘மார்ப்பதக்கம்’ அதன் சடங்கு மற்றும் அணிகலன் தன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
