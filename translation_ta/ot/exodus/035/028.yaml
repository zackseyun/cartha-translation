revisions:
- from: நறுமணப் பொருளையும், விளக்கிற்கான எண்ணெயையும்[a], அபிஷேக எண்ணெய்க்கும் நறுமணப் பொருள்களால் செய்யப்படும் தூபத்திற்கும் தேவையானவற்றையும்[b] கொண்டுவந்தார்கள்.
  to: நறுமணச் சரக்கையும், ஒளிக்கான எண்ணெயையும், அபிஷேக எண்ணெய்க்கும் நறுமணப் பொருள்களின் தூபத்திற்கும் தேவையானவற்றையும் கொண்டுவந்தார்கள்.
