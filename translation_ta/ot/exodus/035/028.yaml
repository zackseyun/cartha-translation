translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. இந்த வசனம் முந்தைய வசனத்தின் வினையான ‘கொண்டுவந்தார்கள்’ என்பதைக் சார்ந்திருப்பதால், தனியாக வாசிக்கத் தெளிவாக அந்த வினை முடிவில் வெளிப்படையாகச் சேர்க்கப்பட்டது. ‘தேவையானவற்றை’ என்பது לְ முன்னொட்டுகள் இங்கு பொருட்களின் நோக்கத்தைச் சுட்டுவதை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
