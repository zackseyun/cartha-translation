  yaml_path: translation/ot/exodus/035/028.yaml
  text: the balsam and the oil for the light[a], and for the anointing oil and for the incense of spices[b],
translation:
  language: ta
  text: நறுமணச் சரக்கையும், ஒளிக்கான எண்ணெயையும், அபிஷேக எண்ணெய்க்கும் நறுமணப் பொருள்களின் தூபத்திற்கும் தேவையானவற்றையும் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: நறுமணப் பொருள்
  rationale: בֹּשֶׂם என்பது மணமுள்ள பொருள், நறுமணச் சரக்கு அல்லது தைலம் போன்ற பொருளைக் குறிக்கலாம். குறிப்பிட்ட தாவரப் பிசின் என்று எபிரெய உரை வரையறுக்காததால், சூழலுக்கு இயல்பான பொதுப்பெயர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַשָּׁמֶן
  choice: எண்ணெய்
  rationale: שֶׁמֶן என்பதன் பொதுவான பொருள் எண்ணெய். இங்கு எபிரெய உரை ஒலிவ எண்ணெய் என்று குறிப்பாகச் சொல்லாததால் அதைக் கூடுதலாகச் சேர்க்கவில்லை.
- source_word: לְמָאוֹר
  choice: விளக்கிற்கான
  rationale: מָאוֹר ஒளி அல்லது ஒளி தருவது என்பதைக் குறிக்கலாம். திருக்கூடாரப் பொருட்களின் சூழலில் எண்ணெயின் விளக்குப் பயன்பாட்டை இயல்பான தமிழில் இது தெரிவிக்கிறது; எபிரெயில் இல்லாத ஒருமை விளக்கைத் திட்டவட்டமாக்கவில்லை.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெய்
  rationale: புனிதப் பணிக்காகப் பூசப்படும் எண்ணெயைக் குறிக்கும் நிலையான சொற்றொடர். ‘அபிஷேகம்’ என்பது நவீன தமிழ் வேதாகம நடையில் புரிந்துகொள்ளப்படும் வழக்குச் சொல்.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: நறுமணப் பொருள்களால் செய்யப்படும் தூபம்
  rationale: קְטֹרֶת என்பது தூபம்; סַמִּים என்பது நறுமணப் பொருட்கள். தமிழில் இரு கூறுகளையும் தெளிவாகவும் இயல்பாகவும் வைத்திருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: …ஐயும், …ஐயும், …க்கும் …க்கும்
  rationale: தொடர்ச்சியான பட்டியல் அமைப்பையும் இணைப்புகளையும் தமிழின் இயல்பான ‘உம்’ மற்றும் ‘க்கும்’ வடிவங்களால் தக்கவைத்துள்ளது.
