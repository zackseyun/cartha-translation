  text: וְ/אֶת מְנֹרַ֧ת הַ/מָּא֛וֹר וְ/אֶת כֵּלֶ֖י/הָ וְ/אֶת נֵרֹתֶ֑י/הָ וְ/אֵ֖ת שֶׁ֥מֶן הַ/מָּאֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/014.yaml
  text: and the lampstand for the light[a], and its utensils, and its lamps, and the oil for the light,
translation:
  language: ta
  text: வெளிச்சத்திற்கான விளக்குத்தண்டையும்[a], அதன் கருவிகளையும், அதன் விளக்குகளையும், வெளிச்சத்திற்கான எண்ணெயையும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சொல்லுக்கு நெருக்கமாக, ‘வெளிச்சத்தின் விளக்குத்தண்டு’ என்றும் ‘வெளிச்சத்தின் எண்ணெய்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: வெளிச்சத்திற்கான விளக்குத்தண்டு
  rationale: מְנוֹרָה என்பது திருவாசஸ்தலத்தின் விளக்குத்தண்டைக் குறிக்கிறது. הַמָּאוֹר உடனான இணைப்பை இயல்பான நவீன தமிழில் நோக்குறவாக வெளிப்படுத்த ‘வெளிச்சத்திற்கான’ என மொழிபெயர்க்கப்பட்டது; சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כֵּלֶיהָ
  choice: அதன் கருவிகள்
  rationale: כְּלִי என்பது பாத்திரங்கள், கருவிகள், உபகரணங்கள் போன்றவற்றைக் குறிக்கும் பரந்த சொல். இச்சூழலில் தேவையற்ற குறிப்பாக்கம் இல்லாமல் ‘கருவிகள்’ இயல்பாகவும் பரந்த பொருளுடனும் உள்ளது.
- source_word: נֵרֹתֶיהָ
  choice: அதன் விளக்குகள்
  rationale: נֵר என்பது பொதுவாக விளக்கு அல்லது விளக்குச் சுடரைக் குறிக்கும். இங்கு விளக்குத்தண்டுடன் இணைந்த தனித்தனி விளக்குகள் குறிக்கப்படுவதால் ‘விளக்குகள்’ தெளிவான தேர்வு.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: வெளிச்சத்திற்கான எண்ணெய்
  rationale: எபிரெய உரையின் ‘வெளிச்சம்/ஒளியூட்டுதல் சார்ந்த எண்ணெய்’ என்ற அமைப்பையும் மָאוֹר என்ற சொல்லின் மீளுரைப்பையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: …ஐயும் …ஐயும் …ஐயும் …ஐயும்
  rationale: இணைப்புச் சொல்லுடன் மீண்டும் வரும் நேரடிச் செயப்படுபொருள் குறியீடுகள் பட்டியல் அமைப்பையும் ஓசையையும் உருவாக்குகின்றன. தமிழின் ‘-உம்’ இணைப்பால் அது காக்கப்படுகிறது.
