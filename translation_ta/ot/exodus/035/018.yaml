lexical_decisions:
- source_word: יִתְדֹת
  choice: முளைகள்
  rationale: கட்டமைப்பையும் திரைகளையும் நிலத்தில் உறுதிப்படுத்தப் பயன்படும் கூர்முனைக் குச்சிகளைக் குறிக்கிறது. ‘முளைகள்’ என்பது சுருக்கமாகவும் கூடார அமைப்புச் சூழலில் இயல்பாகவும் உள்ளது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: யாத்திராகமத்தில் தேவனுடைய பரிசுத்த உறைவிடக் கட்டமைப்பைக் குறிக்கும் நிலையான சொல். ‘வாசஸ்தலம்’ என்ற அடிப்படைப் பொருளையும் அதன் வழிபாட்டுச் சிறப்பையும் ‘திருவாசஸ்தலம்’ தக்கவைக்கிறது.
- source_word: הֶחָצֵר
  choice: முற்றம்
  rationale: திருவாசஸ்தலத்தைச் சுற்றியுள்ள வேலியிடப்பட்ட வெளிப்பகுதியைக் குறிக்கிறது; ‘முற்றம்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מֵיתְרֵיהֶם
  choice: அவற்றின் கயிறுகள்
  rationale: முளைகளுடனும் கட்டமைப்புடனும் தொடர்புடைய கட்டுக் கயிறுகளைக் குறிக்கிறது. ‘கயிறுகள்’ சாதாரண வாசகருக்கு உடனடியாகப் புரியும் இயல்பான சொல்.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: … முளைகளையும், … முளைகளையும், … கயிறுகளையும்
  rationale: மூலத்தின் தொடர்ச்சியான பொருட்பட்டியல் அமைப்பைத் தமிழின் ‘-ஐயும்’ இணைப்பால் பிரதிபலிக்கிறது.
