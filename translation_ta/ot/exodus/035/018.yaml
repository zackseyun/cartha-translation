  register: நவீன நிலையான தமிழில், பட்டியல் வடிவத்தைப் பாதுகாத்து, வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. வசனம் தொடரும் பட்டியலின் ஒரு பகுதியாக இருப்பதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது.
