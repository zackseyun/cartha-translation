lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: தலைவர்கள்
  rationale: נְשִׂיאִים என்பது இச்சூழலில் சமூகத்தின் தலைவர்களைக் குறிக்கிறது; ‘தலைவர்கள்’ என்பது அரச மரபைக் குறிக்காமல் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: הֵבִיאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: בוא என்பதன் ஹிபீல் வடிவம் இங்கு காணிக்கைக்கான பொருட்களைக் கொண்டுவருதலைக் குறிக்கிறது; நவீன தமிழில் இது இயல்பான வடிவம்.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: கோமேதகக் கற்கள்
  rationale: שֹׁהַם என்பதற்கான மரபுவழித் தமிழ் வேதாகமச் சொல் ‘கோமேதகம்’; எனினும் கனிமத்தின் துல்லிய அடையாளம் உறுதியற்றதால் அடிக்குறிப்பில் அது தெரிவிக்கப்பட்டுள்ளது.
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: பதிப்பதற்கான கற்கள்
  rationale: מִלֻּאִים என்பது நகைவேலைச் சூழலில் சட்டத்தில் பதிக்கப்படும் கற்களைக் குறிக்கிறது; ‘பதிப்பதற்கான கற்கள்’ அவற்றின் பயன்பாட்டைத் தெளிவாகக் கூறுகிறது.
- source_word: לָאֵפֹד
  choice: ஏபோதுக்கு உரிய
  rationale: אֵפֹד என்பது துல்லியமான தமிழ் இணைச்சொல் இல்லாத ஆசாரிய உடையின் பெயர்; நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְלַחֹשֶׁן
  choice: மார்பணிக்கு உரிய
  rationale: חֹשֶׁן என்பது கவசமல்ல, மார்பில் அணியும் ஆசாரிய அணிகலன்; ‘மார்பணி’ அதன் இயல்பைச் சுருக்கமாகவும் தவறான போர்க்கவசக் கருத்தின்றியும் தெரிவிக்கிறது.
