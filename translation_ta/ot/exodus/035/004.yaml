base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: ta
  text: பின்பு மோசே இஸ்ரவேல் மகன்களின்[a] முழுச் சபையிடமும்[b], “யாவே கட்டளையிட்டது இதுதான்:[c]” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர்”; மரபுவழியாக, “இஸ்ரவேலின் பிள்ளைகள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “முழுக் கூட்டத்திடமும்.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் “இந்தக் காரியம்/வார்த்தை”; இயல்பான தமிழில், “யாவே கட்டளையிட்டது இதுதான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... சொன்னார்
  rationale: வாவ் தொடர் வடிவம் நிகழ்ச்சியை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘பின்பு’ அதன் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲדַת
  choice: முழுச் சபை
  rationale: இது இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபை’ அதன் கூட்டுத்தன்மையையும் அமைந்த சமூகத்தையும் காக்கிறது; כָּל என்பதன் பரப்பை ‘முழு’ வெளிப்படுத்துகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மகன்கள்
  rationale: எபிரெய மூலத்தின் ஆண்பால் பன்மை வடிவைத் தெளிவாகக் காக்கிறது; சூழலில் இது இஸ்ரவேல் சமூகத்தின் மரபுவழிப் பெயராகவும் செயல்படுகிறது.
- source_word: זֶה הַדָּבָר
  choice: வார்த்தை இதுதான்
  rationale: דָּבָר என்பதற்கு ‘வார்த்தை’, ‘காரியம்’, ‘செய்தி’ ஆகிய பொருள்கள் உண்டு. இங்கு தொடர்ந்து அறிவிக்கப்படும் இறைக் கட்டளையை அறிமுகப்படுத்துவதால் ‘வார்த்தை’ மூலத்தின் சொல்வடிவத்தையும் அறிவிப்புத் தன்மையையும் காக்கிறது.
- source_word: צִוָּה
  choice: கட்டளையிட்ட
  rationale: முடிவுற்ற கட்டளையிடும் செயலைத் தமிழில் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לֵאמֹר
  choice: என்று சொன்னார் / தொடர்ந்து வரும் மேற்கோளை அறிமுகப்படுத்தும் இரட்டைப்புள்ளி
  rationale: முதல் לֵאמֹר தமிழின் ‘என்று சொன்னார்’ அமைப்பில் வெளிப்படுகிறது; இறுதி לֵאמֹר அடுத்த வசனத்தில் வரும் கட்டளையின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான மேற்கோள் மற்றும் இரட்டைப்புள்ளி அமைப்பால் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட திருப்பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கையின் பெயர் என்ற தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினக் குறியீடுள்ள மரபுப்பெயர்
  choice: இஸ்ரவேல் மகன்கள்
  alternative: இஸ்ரவேலர்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தை மறைக்காமல் காக்கிறது. அதேவேளை அடிக்குறிப்பு அதன் பரந்த சமூகப் பயன்பாட்டை வாசகர் அறிய உதவுகிறது.
- issue: דָּבָר என்பதின் பொருள் பரப்பு
  choice: வார்த்தை
  alternative: காரியம்; சொல்லப்பட்டது; செய்தி
  rationale: இறைக் கட்டளை அறிவிக்கப்படும் சூத்திரத்தில் ‘வார்த்தை’ பொருத்தமானது; இருப்பினும் ‘காரியம்’ என்ற பொருளும் உண்மையான சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் மரியாதையும் கொண்ட உரைநடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடங்கும் நேரடி கட்டளையை அறிமுகப்படுத்துவதால் இறுதியில் இரட்டைப்புள்ளி வைக்கப்பட்டுள்ளது. ‘முழுச் சபையிடமும்’ என்பது கூட்டாகச் சேர்ந்த இஸ்ரவேல் சமூகத்தைச் சுட்டுகிறது.
