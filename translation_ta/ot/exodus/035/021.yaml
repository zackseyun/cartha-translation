  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: ta
  text: தன் உள்ளம் தன்னைத் தூண்டிய ஒவ்வொருவரும், தன் ஆவி தன்னை மனமுவந்து கொடுக்கத் தூண்டிய ஒவ்வொருவரும் வந்து, சந்திப்புக் கூடாரப் பணிக்காகவும், அதனுடைய எல்லாச் சேவைப் பணிகளுக்காகவும், பரிசுத்த ஆடைகளுக்காகவும் யாவேக்கான காணிக்கையை[a] கொண்டுவந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவேயின் காணிக்கையை.’ எபிரெயத்தில் உள்ள சொற்றொடர் யாவேக்கு அர்ப்பணிக்கப்படும் காணிக்கையைக் குறிக்கிறது; உடைமை வடிவிலும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא என்பதன் நேரடியான பொருள் ‘வருதல்.’ சூழலில் ‘முன்வந்தார்கள்’ என்பதும் சாத்தியம்; ஆனால் அது விருப்பத்துடன் வந்தனர் என்ற கருத்தை வினையிலேயே கூடுதலாகச் சேர்க்கும்.
- source_word: כָּל אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: சொல்லுக்கு சொல் ‘ஒவ்வொரு மனிதனும்’; இங்கு தனித்தனி நன்கொடையாளர்களை பொதுவாகக் குறிப்பதால் பாலினத்தை முன்னிறுத்தாத இயல்பான தமிழாக்கம்.
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: தங்கள் உள்ளம் தூண்டிய
  rationale: சொல்லுக்கு சொல் ‘அவனுடைய இருதயம் அவனை உயர்த்தியது.’ உள்ளார்ந்த உந்துதலைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: தங்கள் ஆவி தங்களை மனமுவந்து கொடுக்கச் செய்த அனைவரும்
  rationale: נדב தன்னார்வத்தையும் மனமுவந்த தன்மையையும் குறிக்கிறது; רוּחַ என்பதற்கான ‘ஆவி’யையும், உள்ளார்ந்த முனைப்பையும் வெளிப்படையாகக் காக்கிறது.
- source_word: הֵבִיאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: காணிக்கைப் பொருட்களை நேரடியாகக் கொண்டுவந்த செயலை இயல்பாகக் குறிக்கிறது.
- source_word: תְּרוּמַת יְהוָה
  choice: யாவேயின் காணிக்கை
  rationale: תְּרוּמָה என்பது பிரித்தளிக்கப்படும் காணிக்கை அல்லது பங்களிப்பு. யாவே என்ற பெயருடனான எபிரெய உருபுத் தொடர்பின் உடைமை/அர்ப்பணிப்பு நுணுக்கத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה-வை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தை அமைக்கும் பணிக்காக
  rationale: מְלָאכָה இங்கு கூடாரத்தோடு தொடர்புடைய தயாரிப்பு அல்லது அமைப்புப் பணியைக் குறிக்கிறது; ‘அமைக்கும்’ என்பது தமிழில் உறவைத் தெளிவாக்குகிறது.
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: அதன் எல்லாப் பணிகளுக்காகவும்
  rationale: עֲבֹדָה என்பது பணி, சேவை, வழிபாட்டுச் செயல்பாடு ஆகியவற்றைக் குறிக்கலாம். ‘பணிகள்’ என்பது இந்த விரிவை தேவையின்றி குறுக்காமல் இயல்பாக உள்ளது.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: பரிசுத்த ஆடைகளுக்காகவும்
  rationale: ஆசாரியப் பயன்பாட்டுக்கெனப் பரிசுத்தமாக்கப்பட்ட ஆடைகளைக் குறிக்கும் தெளிவான, வழக்கிலுள்ள மொழிபெயர்ப்பு.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது; ‘யாவே’ அதை ஒரு பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: תְּרוּמַת יְהוָה என்ற இணைப்பின் உறவு
  choice: யாவேயின் காணிக்கை
  alternative: யாவேக்கான காணிக்கை
  rationale: எபிரெய இணைப்பு காணிக்கை யாவேக்கு உரியது அல்லது அவருக்காக அர்ப்பணிக்கப்பட்டது என்ற இரு நெருங்கிய நுணுக்கங்களையும் தாங்கலாம்; முதன்மை உரை சுருக்கமான மூல அமைப்பைத் தக்கவைக்கிறது, அடிக்குறிப்பு மாற்று வெளிப்பாட்டைக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பழமையான ‘ஆசரிப்புக் கூடாரம்’ என்பதற்குப் பதிலாக ‘சந்திப்புக் கூடாரம்’ என்றும், தெளிவுக்காக ‘அமைக்கும் பணி’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தில் உள்ள ‘உள்ளம்/ஆவி’ இணை வேறுபாடு சமப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
