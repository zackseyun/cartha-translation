revisions:
- from: அவர் அவனை இறைவனின் ஆவியால்[a] நிரப்பி, ஞானத்தையும் புரிந்துணர்வையும் அறிவையும் எல்லா வகையான கைவினைத் திறனையும்[b] அளித்தார்.
  to: அவர் அவனை இறைவனின் ஆவியாலும்[a], ஞானத்தாலும், புரிந்துணர்வாலும், அறிவாலும், எல்லாவகையான கைவினைத் திறனாலும்[b] நிரப்பினார்.
  rationale: 'The revision restores the source''s one-verb construction: God filled Bezalel with the Spirit and with each named capacity. It retains the draft''s sound lexical choices and modern, respectful register, while tightening footnote a so its alternatives reflect the Hebrew expression rather than adding an interpretive relation.'
