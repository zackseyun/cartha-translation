source:
  edition: WLC
  text: וַ/יְמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה בִּ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: ta
  text: அவர் அவனை இறைவனின் ஆவியாலும்[a], ஞானத்தாலும், புரிந்துணர்வாலும், அறிவாலும், எல்லாவகையான கைவினைத் திறனாலும்[b] நிரப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைவனுடைய ஆவியால்,” அல்லது “தெய்வீக ஆவியால்.” எபிரெயச் சொற்றொடரைப் பொதுவான பொருளிலும் புரிந்துகொள்ள முடியும்; ஆனால் இங்கு அது இறைவனுடைய ஆற்றலளிக்கும் ஆவியைக் குறிப்பதாகத் தெரிகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “எல்லாவிதமான வேலைத்திறனாலும்,” அல்லது “ஒவ்வொரு கைவினையிலும் திறனாலும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֹתוֹ
  choice: அவர் அவனை ... நிரப்பி ... அளித்தார்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் எழுவாய் இறைவன்; பியேல் இறந்தகாலக் கதை வினை ‘நிரப்பினார்’ என்ற பொருளுடையது. தமிழில் இயல்பாகப் பட்டியலை அமைக்க ‘நிரப்பி ... அளித்தார்’ என வடிவமைக்கப்பட்டது.
- source_word: רוּחַ אֱלֹהִים
  choice: இறைவனின் ஆவி
  rationale: கூடாரப் பணிக்காக இறைவன் ஆற்றலளிக்கும் சூழலில், இச்சொற்றொடர் இறைவனுடைய ஆவியைக் குறிப்பதாக இயல்பாகப் புரிகிறது; எபிரெயச் சொற்றொடரின் பொதுவான வாசிப்புகளுக்கான இடம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְּחָכְמָה
  choice: ஞானம்
  rationale: חָכְמָה என்பது இங்கு இறைவன் அருளும் அறிவார்ந்த, திறன்மிக்க ஆற்றலைக் குறிக்கிறது; ‘ஞானம்’ அதன் பரந்த பொருளைக் காக்கிறது.
- source_word: בִּתְבוּנָה
  choice: புரிந்துணர்வு
  rationale: תְּבוּנָה என்பது புரிதல் அல்லது நுண்ணறிவைக் குறிக்கும்; ‘புரிந்துணர்வு’ என்பது ஞானம், அறிவு ஆகியவற்றிலிருந்து அதன் தனித்த நுட்பத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּבְדַעַת
  choice: அறிவு
  rationale: דַּעַת என்பதன் அடிப்படைப் பொருள் ‘அறிவு’; கைவினைச் சூழல் இருந்தாலும் அதை வெறும் தொழில்நுட்பத் திறனாகக் குறுக்கவில்லை.
- source_word: וּבְכָל מְלָאכָה
  choice: எல்லா வகையான கைவினைத் திறன்
  rationale: מְלָאכָה என்பது வேலை, தொழில் அல்லது கைவினைப் பணியைக் குறிக்கலாம். உடனடிச் சூழலான திருக்கூடாரக் கலைப்பணிக்கு ‘கைவினைத் திறன்’ இயல்பாகப் பொருந்துகிறது; כָּל என்பதை ‘எல்லா வகையான’ எனத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: רוּחַ אֱלֹהִים என்பதை இறைவனுடைய ஆவியாகவா, பொதுவான தெய்வீக ஆவியாகவா மொழிபெயர்ப்பது
  choice: இறைவனின் ஆவி
  alternative: இறைவனிடமிருந்து வந்த ஆவி; தெய்வீக ஆவி
  rationale: பரிசுத்தப் பணிக்காகப் பெசலெயேலுக்கு இறைவன் ஆற்றலளிக்கும் உடனடிச் சூழல், இறைவனுடைய ஆவியையே முதன்மையாகச் சுட்டுகிறது. இருப்பினும் எபிரெயச் சொற்றொடரின் இலக்கணப் பரப்பை அடிக்குறிப்பு வெளிப்படையாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘புரிந்துணர்வு’ அறிவுசார் சொற்களின் மும்மையிலுள்ள வேறுபாட்டைக் காக்கிறது; ‘கைவினைத் திறன்’ உடனடிச் சூழலின் சிறப்புப் பணியைத் தெளிவாக்குகிறது. இறைவனைக் குறிக்கும் சுட்டுப்பெயருக்கு தமிழில் இயல்பான மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
