  text: וּ/בַ/חֲרֹ֥שֶׁת אֶ֛בֶן לְ/מַלֹּ֖את וּ/בַ/חֲרֹ֣שֶׁת עֵ֑ץ לַ/עֲשׂ֖וֹת בְּ/כָל מְלֶ֥אכֶת מַחֲשָֽׁבֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/033.yaml
  text: in the cutting of stones for setting[a], and in the carving of wood, to do every kind of skillful work.
translation:
  language: ta
  text: பதிப்பதற்காகக் கற்களை வெட்டுவதிலும், மரத்தைச் செதுக்குவதிலும், நுணுக்கமாக வடிவமைக்கப்பட்ட[a] எல்லா வகை வேலைகளையும் செய்வதிலும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திட்டமிட்டு வடிவமைக்கப்பட்ட” அல்லது “கலைநயமிக்க.” எபிரெயச் சொல் திட்டம், வடிவமைப்பு, திறமை ஆகியவற்றுடன் செய்யப்படும் வேலையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶת
  choice: வெட்டுவதிலும் / செதுக்குவதிலும்
  rationale: ஒரே எபிரெயச் சொல் திறமையான கைவினை வேலையைக் குறிக்கிறது. பொருளுக்கேற்ற இயல்பான தமிழுக்காகக் கல்லுடன் ‘வெட்டுதல்’ என்றும் மரத்துடன் ‘செதுக்குதல்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: אֶבֶן
  choice: கற்களை
  rationale: எபிரெயத்தில் ஒருமையாக இருந்தாலும், இங்கு அது கல்லை ஒரு மூலப்பொருள் வகையாகப் பொதுவாகக் குறிக்கிறது; கைவினைச் சூழலில் பன்மை இயல்பானது.
- source_word: לְמַלֹּאת
  choice: பதிப்பதற்காக
  rationale: திருக்கூடாரக் கைவினைச் சூழலில், கற்களை ஓர் அமைப்பில் பொருத்திப் பதிப்பதைக் குறிக்கிறது; ‘நிரப்புதல்’ என்ற பொதுப் பொருள் இங்கு பொருந்தாது.
- source_word: עֵץ
  choice: மரத்தை
  rationale: இங்கு உயிருள்ள மரத்தை அல்ல, வேலைப்பாட்டுக்கான மரப்பொருளைக் குறிக்கிறது.
- source_word: לַעֲשׂוֹת
  choice: செய்வதிலும்
  rationale: עשה என்ற வினையின் பரந்த பொருளையும் தொடர்ந்து வரும் ‘வேலை’ என்ற சொல்லுடனான இயல்பான தமிழையும் காக்கிறது.
- source_word: בְּכָל מְלֶאכֶת
  choice: எல்லா வகை வேலைகளையும்
  rationale: அனைத்து கைவினைப் பணிவகைகளையும் பகிர்ந்தளிக்கும் பொருளில் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பான நவீனத் தமிழ்.
- source_word: מַחֲשָׁבֶת
  choice: திறனுடன் வடிவமைக்கப்பட்ட
  rationale: திட்டமிடப்பட்ட, வடிவமைக்கப்பட்ட, கலைத்திறனுடன் செய்யப்பட்ட வேலை என்ற பொருள் வரம்பை இது காக்கிறது; ‘திறமையான’ என்று மட்டும் சொல்வதைவிட மூலத்தின் வடிவமைப்புக் கருத்தையும் வெளிப்படுத்துகிறது.
