translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. இந்த வசனம் முந்தைய வசனங்களில் தொடங்கிய வாக்கியத்தின் தொடர்ச்சி என்பதால், சூழலுடன் இணைய ‘திறமை அளித்தார்’ சேர்க்கப்பட்டுள்ளது; பட்டியலின் இணைநிலையை ‘…வதிலும்’ வடிவங்கள் காக்கின்றன.
