base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/010.yaml
  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
translation:
  language: ta
  text: உங்களில் கைதேர்ந்த ஒவ்வொருவரும் வந்து, யாவே கட்டளையிட்ட அனைத்தையும் செய்யட்டும்:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “இதயத்தில் ஞானமுள்ளவர்”; இங்கு இது கைவினையில் திறமையும் தேர்ச்சியும் உள்ளவரைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “உங்களில் கைதேர்ந்த அனைவரும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் இச்சொற்றொடர் இலக்கணப்படி ஆண்பால் ஒருமையில் இருந்தாலும், ஒவ்வொருவரையும் தனித்தனியாகக் குறிக்கும் வலிமை கொண்டது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כָל
  choice: ஒவ்வொருவரும்
  rationale: כָל என்பதற்குப் பின் ஒருமைச் சொல் வருவதால் பகிர்ந்தளிக்கும் பொருள் உள்ளது; தமிழில் ‘ஒவ்வொருவரும்’ அதை இயல்பாக வெளிப்படுத்துகிறது. தொடக்க וְ, தமிழ் வாக்கிய ஓட்டத்தில் தனியாக மொழிபெயர்க்கப்பட வேண்டியதில்லை.
- source_word: חֲכַם לֵב
  choice: கைதேர்ந்த
  rationale: சொல்லுக்குச் சொல் ‘இதயத்தில் ஞானமுள்ள’ என்றாலும், கூடாரப் பணியின் சூழலில் இது நடைமுறைத் திறமையையும் கைவினைத் தேர்ச்சியையும் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: בָּכֶם
  choice: உங்களில்
  rationale: בְּ உடன் இரண்டாம் நபர் பன்மை விகுதி, சமூகத்தின் மத்தியில் உள்ளவர்களைக் குறிக்கிறது; ‘உங்களில்’ என்பது சுருக்கமான இயல்பான தமிழ்.
- source_word: יָבֹאוּ
  choice: வந்து
  rationale: மூன்றாம் நபர் பன்மை imperfect இங்கு அழைப்பு அல்லது அறிவுறுத்தல் வலிமை உடையது; அடுத்த வினையுடன் இணைத்து ‘வந்து ... செய்யட்டும்’ எனத் தரப்பட்டுள்ளது.
- source_word: וְיַעֲשׂוּ
  choice: செய்யட்டும்
  rationale: עָשָׂה என்பது ‘செய்/உருவாக்கு’ எனப் பரந்த பொருள் தருகிறது. தொடர்ந்து பட்டியலிடப்படும் கூடாரமும் அதன் பொருட்களும் அனைத்தையும் உள்ளடக்க ‘செய்யட்டும்’ பொருத்தமானது.
- source_word: אֵת כָּל אֲשֶׁר
  choice: அனைத்தையும்
  rationale: கட்டளையிடப்பட்டவற்றின் முழுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִוָּה יְהוָה
  choice: யெகோவா கட்டளையிட்ட
  rationale: எபிரெய perfect, செய்ய வேண்டிய பணிக்கு முன்னரே கொடுக்கப்பட்ட கட்டளையைக் குறிக்கிறது. יְהוָה என்பது மறைக்கப்படாமல் தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் தருவது மூல வேறுபாட்டைக் காக்கிறது.
- issue: חֲכַם לֵב என்பதிலுள்ள இலக்கணப் பால் மற்றும் பகிர்ந்தளிக்கும் வலிமை
  choice: கைதேர்ந்த ஒவ்வொருவரும்
  alternative: கைதேர்ந்த ஒவ்வொரு ஆணும்
  rationale: எபிரெயச் சொற்றொடர் ஆண்பால் ஒருமையில் இருந்தாலும் כָל உடன் பகிர்ந்தளிக்கும் பொதுவான குறிப்பு அமைகிறது; சூழல் தகுதியுள்ள கைவினைஞர்களைக் குறிக்கிறது. தமிழில் ‘ஒவ்வொருவரும்’ பாலைக் கூடுதலாகத் தீர்மானிக்காமல் இந்த வலிமையை இயல்பாகக் காக்கிறது; இலக்கண வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கைதேர்ந்த’ என்பது கைவினைச் சூழலைத் தெளிவாகச் சுட்டுகிறது; ‘செய்யட்டும்’ கட்டளையுடனான அழைப்பு வலிமையை இயல்பாகத் தருகிறது. இரு அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
