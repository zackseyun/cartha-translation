translation_notes:
  register: நவீன தரத் தமிழில், திருக்கூடாரப் பொருட்களின் பட்டியல் அமைப்பையும் வசனத்தின் தொடரும் தன்மையையும் இறுதிக் கோடு மூலம் காக்கும் கண்ணியமான நடை. ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் பொருந்தாத இடங்களில் இருந்ததால், அவை எபிரெயச் சொற்களுக்குரிய சரியான இடங்களுக்கு மாற்றப்பட்டுள்ளன.
