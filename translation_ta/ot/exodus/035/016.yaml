base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/016.yaml
  text: the altar of burnt offering[a], and the bronze grating that belongs to it, its poles, and all its utensils[b], the basin and its stand—
translation:
  language: ta
  text: தகனபலிக்கான பலிபீடம், அதற்குரிய வெண்கல வலைப்பின்னல்[a], பலிபீடத்தின் தண்டுகள், அதன் எல்லா உபகரணங்களும், கழுவும் தொட்டியும் அதன் தாங்கியும்[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெண்கல வலைச்சட்டம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதன் அடித்தளம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: தகனபலிக்கான பலிபீடம்
  rationale: முழுவதும் எரித்துச் செலுத்தப்படும் பலியுடன் தொடர்புடைய குறிப்பிட்ட பலிபீடத்தைக் குறிக்கும் இணைப்புத் தொடர். ‘தகனபலிக்கான பலிபீடம்’ என்பது அதன் பலியிடும் பயன்பாட்டைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: வெண்கலச் சல்லடை
  rationale: מִכְבָּר என்பது பலிபீடத்தோடு இணைந்த வலைப்பின்னல் போன்ற உலோக அமைப்பைக் குறிக்கிறது. ‘சல்லடை’ அதன் துளையமைந்த வடிவத்தை நவீன தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לוֹ
  choice: அதற்குரிய
  rationale: இத்தொடர் பலிபீடத்துடனான உடைமை அல்லது தொடர்பைக் குறிக்கிறது; அதன் துல்லியமான இருப்பிடத்தை எபிரெயம் குறிப்பிடாததால் ‘அதற்குரிய’ என்று பொதுவாகவே வைக்கப்படுகிறது.
- source_word: בַּדָּיו
  choice: அதன் தண்டுகள்
  rationale: கூடாரப் பொருட்களைச் சுமந்து செல்வதற்குப் பயன்படும் நீண்ட தண்டுகள் இவை. சூழலில் சுமக்கும் பயன்பாடு தெளிவாக இருப்பதால் ‘தண்டுகள்’ போதுமானதும் இயல்பானதும் ஆகும்.
- source_word: כָּל כֵּלָיו
  choice: அதன் எல்லா உபகரணங்கள்
  rationale: כֵּלִים என்பது பலிபீடத்துடன் தொடர்புடைய பலவகைப் பொருட்களையும் கருவிகளையும் உள்ளடக்கும் பொதுச்சொல். ‘உபகரணங்கள்’ அந்தப் பரந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַכִּיֹּר
  choice: கழுவும் தொட்டி
  rationale: இது திருக்கூடார முற்றத்தில் கழுவுவதற்குப் பயன்படுத்தப்பட்ட தொட்டி. ‘கழுவும் தொட்டி’ பொருளின் பயன்பாட்டை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: כַּנּוֹ
  choice: அதன் தாங்கி
  rationale: தொட்டியைத் தாங்கும் ஆதார அமைப்பைக் குறிக்கிறது. ‘தாங்கி’ என்பது நவீன தமிழில் தெளிவான பெயர்; ‘அடித்தளம்’ என்பதும் சாத்தியம்.
