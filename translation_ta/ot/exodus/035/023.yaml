  source_fidelity: திருத்தம் தேவை. אִישׁ என்பது இவ்வசனத்தில் பகிர்முறையாக வரும் ஆண்பால் ஒருமை; உடனடி சூழலில் ஆண்களும் பெண்களும் தனித்தனியாகக் குறிப்பிடப்படுவதால், ‘ஒவ்வொருவரும்’ என்பதற்குப் பதில் ‘ஒவ்வொரு ஆணும்’ மூலத்தின் குறிப்பைச் சிறப்பாகக் காக்கிறது. תוֹלַעַת שָׁנִי குறிப்பாகச் சிவப்பு/கருஞ்சிவப்பு சாயமிட்ட நூற்பொருளைக் குறிக்கும்; ‘கருஞ்சிவப்பு நூல்’ தெளிவானது. שֵׁשׁ என்பது சணல் அல்ல, மெல்லிய லினன்/ஆளிநார் துணி.
  naturalness: திருத்தப்பட்ட வாக்கிய அமைப்பு நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. ‘ஆட்டுக்கடா தோல்கள்’ என்பது ‘செம்மறியாட்டுக் கடாத்தோல்கள்’ என்பதைக் காட்டிலும் எளிதாக வாசிக்கப்படுகிறது; இருப்பினும் செம்மறியாட்டைக் குறிப்பதால் மூலப் பொருள் தெளிவாகவே உள்ளது.
  terminology: ‘தகாஷ்’ ஒலிபெயர்ப்பு மற்றும் அதன் ஐயத்தைச் சொல்லும் அடிக்குறிப்பு பொருத்தமானவை. நீலம், ஊதா, கருஞ்சிவப்பு நூல்; மெல்லிய லினன்; வெள்ளாட்டு முடி; சிவப்புச் சாயமிட்ட ஆட்டுக்கடா தோல்கள் ஆகியவை பொருட்பட்டியலின் சொற்களையும் பதிவையும் காக்கின்றன.
