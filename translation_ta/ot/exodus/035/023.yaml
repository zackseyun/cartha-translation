translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் இயல்பும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. பொருட்பட்டியலின் ஒத்திசைவுக்காக வண்ணமிட்ட நெசவுப் பொருட்கள் ‘நூல்’ என ஒரே சீரில் தரப்பட்டுள்ளன. உறுதியற்ற תחש சொல்லின் ஐயம் மொழிபெயர்ப்பிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
