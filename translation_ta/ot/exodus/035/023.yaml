  text: וְ/כָל אִ֞ישׁ אֲשֶׁר נִמְצָ֣א אִתּ֗/וֹ תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ וְ/עִזִּ֑ים וְ/עֹרֹ֨ת אֵילִ֧ם מְאָדָּמִ֛ים וְ/עֹרֹ֥ת תְּחָשִׁ֖ים הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: ta
  text: நீலநிற நூல், ஊதாநிற நூல், கருஞ்சிவப்பு நூல், மெல்லிய லினன் துணி, வெள்ளாட்டு முடி, சிவப்புச் சாயமிட்ட செம்மறியாட்டுக் கடா தோல்கள், தகாஷ் தோல்கள்[a] ஆகியவை தன்னிடம் இருந்த ஒவ்வொரு ஆணும் அவற்றைக் கொண்டுவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தகாஷ்” என்பது எந்த விலங்கையோ எந்த வகைத் தோலையோ குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை. “நயமான தோல்,” “கடற்பன்றித் தோல்,” அல்லது “கடற்பசுத் தோல்” என்பன முன்மொழியப்பட்ட மொழிபெயர்ப்புகளில் சில.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: אִישׁ என்பது இலக்கணத்தில் ஆண்பால் ஒருமையாக இருந்தாலும், כָל உடன் பகிர்முறைப் பொருளில் ‘ஒவ்வொருவரும்’ என வரலாம். சுற்றுப்பகுதியில் ஆண்களும் பெண்களும் காணிக்கை கொண்டுவருவதால், தமிழில் இயல்பான இந்தச் சொல் பாலினத்தைத் தேவையின்றி வரையறுக்காமல் மூலத்தின் பகிர்முறைப் பொருளைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר נִמְצָא אִתּוֹ
  choice: ஆகியவை தன்னிடம் இருந்த
  rationale: מצא என்பதன் நிஃபால் வடிவம் சொற்பட ‘அவனிடத்தில் காணப்பட்ட’ எனப் பொருள்படும். நவீன தமிழில் ‘தன்னிடம் இருந்த’ என்பது உடைமையை இயல்பாகச் சொல்லி, அந்த உறவைத் தெளிவாக வைத்திருக்கிறது.
- source_word: תְּכֵלֶת
  choice: நீலநிற நூல்
  rationale: திருவிடக் கூடாரப் பொருட்களின் பட்டியலில் இது நீலச் சாயமிட்ட நெசவுப் பொருளைக் குறிக்கிறது; ‘நூல்’ என்பது இச்சூழலுக்கேற்ற தெளிவாக்கம்.
- source_word: אַרְגָּמָן
  choice: ஊதாநிற நூல்
  rationale: இது ஊதா நிறச் சாயமிட்ட நெசவுப் பொருளைக் குறிக்கிறது. அருகிலுள்ள வண்ண நூல்களுடன் ஒரே சீரில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תוֹלַעַת שָׁנִי
  choice: செந்நிற நூல்
  rationale: இந்தச் சொற்றொடர் கருஞ்சிவப்பு அல்லது செந்நிறச் சாயமிட்ட நூற்பொருளைக் குறிக்கிறது; ‘செந்நிற நூல்’ எளிமையாகவும் பட்டியலோடு இசைவாகவும் உள்ளது.
- source_word: שֵׁשׁ
  choice: மெல்லிய சணல்நூல்
  rationale: ஆசாரிய மற்றும் திருவிடக் கூடாரச் சூழல்களில் இது உயர்தர மெல்லிய சணல் நாரால் ஆன நெசவுப் பொருளைக் குறிக்கிறது.
- source_word: עִזִּים
  choice: வெள்ளாட்டு முடி
  rationale: சொற்பட ‘வெள்ளாடுகள்’ என்றாலும், இப்பொருட்பட்டியலில் கூடாரத் திரைகளை நெய்யப் பயன்பட்ட வெள்ளாட்டு முடியையே குறிக்கிறது; உயிருள்ள ஆடுகள் எனத் தவறாகப் புரிவதை இத்தேர்வு தவிர்க்கிறது.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: சிவப்புச் சாயமிட்ட செம்மறியாட்டுக் கடாத்தோல்கள்
  rationale: אֵילִם என்பது ஆண் செம்மறியாடுகளைக் குறிக்கிறது; מְאָדָּמִים அவற்றின் தோல்கள் சிவப்பாகச் சாயமிடப்பட்டிருந்ததைக் காட்டுகிறது.
- source_word: עֹרֹת תְּחָשִׁים
  choice: தகாஷ் தோல்கள்
  rationale: תְּחָשׁ குறிக்கும் விலங்கு அல்லது தோல் வகை உறுதியாக அறியப்படவில்லை. ஊகமான அடையாளத்தைத் தேர்ந்தெடுக்காமல் எபிரெயச் சொல்லை ஒலிபெயர்த்து, ஐயத்தை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
- source_word: הֵבִיאוּ
  choice: அவற்றைக் கொண்டுவந்தனர்
  rationale: பன்மை வினைச்சொல் பொருட்களை வைத்திருந்தவர்களின் செயலைச் சுருக்குகிறது. தமிழில் மறைந்துள்ள செயப்படுபொருளை ‘அவற்றை’ என்று வெளிப்படுத்துவது இயல்பும் தெளிவும் தருகிறது.
