  text: Then all the congregation of the sons of Israel went out from before Moses[a][b].
translation:
  language: ta
  text: பின்பு இஸ்ரவேல் மக்களின்[b] சபையினர்[a] அனைவரும் மோசேயின் முன்னிலையிலிருந்து புறப்பட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கூட்டத்தார்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்படியாக, ‘இஸ்ரவேலின் மகன்கள்’; இங்கு இஸ்ரவேல் மக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: பின்பு ... புறப்பட்டுச் சென்றார்கள்
  rationale: וַיֵּצְאוּ என்பது நிகழ்ச்சித் தொடரை முன்னெடுக்கும் wayyiqtol வடிவம். ‘பின்பு’ அதன் தொடர்ச்சியையும், ‘புறப்பட்டுச் சென்றார்கள்’ יצא என்பதன் இயல்பான இயக்கப் பொருளையும் நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: அனைவரும்
  rationale: כָּל இங்கு சபையாரின் முழுமையைக் குறிக்கிறது; நபர்களைக் குறிக்கும் தமிழ்ச் சூழலில் ‘அனைவரும்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עֲדַת
  choice: சபையார்
  rationale: עֵדָה இஸ்ரவேலின் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபையார்’ அதன் கூட்டு மற்றும் மனிதக் குழு சார்ந்த பொருளைப் பேணுகிறது; ‘கூட்டத்தார்’ என்பதும் சாத்தியம்.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என இருந்தாலும், இங்கு யாக்கோபின் வழிவந்த முழு இஸ்ரவேல் மக்களையும் குறிக்கிறது. பாலினம் சாராத அந்தக் கூட்டு அர்த்தத்தை இயல்பான தமிழில் ‘இஸ்ரவேல் மக்கள்’ தெரிவிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִלִּפְנֵי
  choice: முன்னிலையிலிருந்து
  rationale: இந்த எபிரெய இடைச்சொல் சொற்படியாக ஒருவரின் ‘முன்புறத்திலிருந்து’ என்றும் வழக்கில் அவரது முன்னிலையிலிருந்து என்றும் பொருள்படும். ‘முன்னிலையிலிருந்து’ மூலத்தின் இடவியல் நயத்தையும் இயல்பான தமிழையும் பேணுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: מֹשֶׁה என்ற பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
