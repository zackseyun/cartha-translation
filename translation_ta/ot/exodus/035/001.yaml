reference: Exodus 35:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: ta
  text: மோசே இஸ்ரவேல் மக்களின் முழுச் சபையையும் ஒன்றுகூட்டி, அவர்களிடம், “செய்யும்படி யாவே கட்டளையிட்ட காரியங்கள் இவையே[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காரியங்கள்” என்பதற்கு “வார்த்தைகள்” அல்லது “விஷயங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: ஒன்றுகூட்டி
  rationale: קהל என்பதன் ஹிஃபில் வடிவம் மக்களை ஓர் அமைந்த சபையாகக் கூடச்செய்வதைக் குறிக்கிறது; ‘ஒன்றுகூட்டி’ என்பது இயல்பான நவீனத் தமிழில் அந்தச் செயப்படுத்தும் பொருளைத் தருகிறது.
- source_word: כָּל עֲדַת
  choice: முழுச் சபையையும்
  rationale: עֵדָה இங்கு இஸ்ரவேலின் ஒட்டுமொத்தக் கூடிய சமூகத்தைக் குறிக்கிறது; כָּל என்பதன் முழுமையும் ‘முழு’ என்பதால் தெளிவாகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இச்சூழலில் அந்த உடன்படிக்கைச் சொற்றொடர் ஆண்களை மட்டும் அல்லாமல் முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கிறது. தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: காரியங்கள் இவையே
  rationale: דְּבָרִים என்பது ‘வார்த்தைகள்’, ‘காரியங்கள்’, ‘விஷயங்கள்’ எனப் பொருள்படலாம். தொடர்ந்து செய்யப்பட வேண்டிய கட்டளைகள் வருவதால் ‘காரியங்கள்’ நடைமுறைப் பொருளை நன்றாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צִוָּה יְהוָה
  choice: யாவே கட்டளையிட்ட
  rationale: எபிரெய நிறைவுவினை முன்பே கொடுக்கப்பட்டு தற்போதும் அதிகாரமுள்ள கட்டளையைச் சுட்டுகிறது. தமிழில் ‘கட்டளையிட்ட’ இயல்பாக உள்ளது; יהוה என்பது பட்டமாக மாற்றப்படாமல் ‘யாவே’ எனப் பெயரெழுத்தாக்கப்படுகிறது.
- source_word: לַעֲשֹׂת אֹתָם
  choice: செய்யும்படி
  rationale: செயல்களை நிறைவேற்ற வேண்டும் என்ற நோக்கம்/கடமையை இவ்வினையெச்ச அமைப்பு குறிக்கிறது. ‘செய்யும்படி’ தமிழில் சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், நவீனத் தமிழில் ஏற்ற பெயரெழுத்தாக்கமான ‘யாவே’ என்று தருவது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் பாலினமும் சமூகக் குறிப்பும்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் இலக்கண ரீதியாக ஆண்பால் பன்மை என்றாலும், ‘முழுச் சபை’ என்ற உடனடிச் சூழல் இது முழு உடன்படிக்கைச் சமூகத்தைக் குறிப்பதைத் தெளிவாக்குகிறது. தமிழில் சொல்லுக்கு சொல் வடிவம் ஆண்களுக்கு மட்டும் என்று தவறாகப் புரியக்கூடும்; ஆகவே குறிக்கப்படும் மக்கள்தொகையைத் துல்லியமாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சபை’ இங்கு வழிபாட்டுக் கட்டடத்தை அல்ல, ஒன்றுகூடிய இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. வசனத்தின் ஒரே உண்மையான சொற்பொருள் மாறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
