source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: ta
  text: பின்பு மோசே இஸ்ரவேலின் மகன்களிடம்[a], “பாருங்கள், யூதா கோத்திரத்தைச் சேர்ந்த ஊரின் மகனான ஊரியின் மகன் பெசலெயேலை யாவே பெயர் சொல்லி அழைத்திருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “இஸ்ரவேலர்கள்” அல்லது “இஸ்ரவேலின் மக்கள்.” எபிரெயத்தில் நேரடியாக “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர் வடிவம் நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; நவீன தமிழில் இயல்பான கதைத் தொடரை இது தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொல்லின் ஆண்பால் பன்மை உறவுமுறை வடிவத்தை முதன்மை உரையில் காக்கிறது; அது இங்கு இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் என்பதைக் குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: רְאוּ
  choice: பாருங்கள்
  rationale: தொடர்ந்து சொல்லப்படுவதற்குக் கவனத்தை ஈர்க்கும் பன்மை ஏவல் வடிவம்; கண்ணியமான நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: קָרָא ... בְּשֵׁם
  choice: பெயர் சொல்லி அழைத்திருக்கிறார்
  rationale: ஒருவரைத் தனிப்பட்ட விதத்தில் பெயரிட்டு அழைத்தல் அல்லது நியமித்தல் என்ற எபிரெய மரபுத்தொடரின் வலிமையைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: ஊரின் மகனாகிய ஊரியின் மகன் பெசலெயேல்
  rationale: எபிரெய வம்சத் தொடரைத் தமிழின் இயல்பான உறவுமுறை அமைப்பில் வழங்கி, பெசலெயேல் ஊரியின் மகன் என்றும் ஊரி ஊரின் மகன் என்றும் தெளிவாக்குகிறது.
- source_word: לְמַטֵּה יְהוּדָה
  choice: யூதா கோத்திரத்தைச் சேர்ந்த
  rationale: பெசலெயேலின் கோத்திரச் சார்பைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
theological_decisions:
- issue: இறைப்பெயர் יְהוָה-வை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யாவே’ என்பது YHWH என்பதற்கான ஏற்ற தமிழாக்கம்.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினக் குறியுடைய கூட்டுப்பெயர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்; இஸ்ரவேலின் மக்கள்
  rationale: மூலத்தின் ஆண்பால் உறவுமுறைச் சொல்லை முதன்மை உரையில் வைத்திருக்கிறது; அதேவேளை அது இனக்குழுவை ஒட்டுமொத்தமாகக் குறிக்கக்கூடிய பரந்த பொருளை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: קָרָא ... בְּשֵׁם என்பதன் அழைப்பு/நியமிப்பு நுணுக்கம்
  choice: பெயர் சொல்லி அழைத்திருக்கிறார்
  alternative: பெயரிட்டு நியமித்திருக்கிறார்
  rationale: இச்சொற்றொடரில் தனிப்பட்ட தேர்வும் பணிக்கான அழைப்பும் உள்ளன; ‘நியமித்தார்’ என்று மட்டும் கூறி பொருளைச் சுருக்காமல் மூலத்தின் திட்டமிட்ட இருபொருள் நுணுக்கத்தை வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கோத்திரம்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல்லை வைத்திருக்கிறது; வம்சத் தொடரில் ஒரேபோல் ஒலிக்கும் ‘ஊரி/ஊர்’ பெயர்களால் குழப்பம் ஏற்படாதவாறு தமிழ் சொல் வரிசை அமைக்கப்பட்டுள்ளது.
