  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֶת הָ/אָרֹ֥ן וְ/אֶת בַּדָּ֖י/ו אֶת הַ/כַּפֹּ֑רֶת וְ/אֵ֖ת פָּרֹ֥כֶת הַ/מָּסָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/012.yaml
  text: the ark and its poles[a], the mercy seat, and the veil of the screen,
translation:
  language: ta
  text: பெட்டியையும் அதன் சுமக்கும் தண்டுகளையும், கிருபாசனத்தையும்[a], மறைப்புத் திரையையும்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவநிவாரண மூடி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֹן
  choice: பெட்டி
  rationale: கூடாரச் சூழலில் இது புனித உடன்படிக்கைப் பெட்டியைக் குறிக்கிறது. இவ்வசனத்தில் எபிரேயச் சொல் தனியாக ‘பெட்டி’ என்றே இருப்பதால், சூழலில் இல்லாத விளக்கச் சொல்லை முதன்மை உரையில் சேர்க்காமல் இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டது.
- source_word: בַּדָּיו
  choice: அதன் சுமக்கும் தண்டுகள்
  rationale: புனிதப் பொருளைத் தூக்கிச் செல்வதற்கான தண்டுகள் என்பதைக் நவீன வாசகருக்குத் தெளிவாகக் காட்டுகிறது.
- source_word: הַכַּפֹּרֶת
  choice: கிருபாசனம்
  rationale: பெட்டியின் பொன் மூடியையும் அதனுடன் தொடர்புடைய வழிபாட்டு முக்கியத்துவத்தையும் குறிக்கும் தமிழ்க் கிறிஸ்தவ மரபில் அறியப்பட்ட சொல். ‘பாவநிவாரண மூடி’ என்ற சாத்தியமான விளக்க மொழிபெயர்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: மறைப்புத் திரை
  rationale: உட்பகுதியைப் பிரித்து மறைக்கும் திரையைச் சுட்டுகிறது. எபிரேயத் தொடரிலுள்ள ‘திரை’ மற்றும் ‘மறைப்பு’ ஆகிய இரு கருத்துகளையும் சுருக்கமான இயல்பான தமிழில் காக்கிறது.
- source_word: אֶת / וְאֶת
  choice: –ஐ / –ஐயும்
  rationale: எபிரேய நேரடிச் செயப்படுபொருள் குறிகள் தமிழில் வேற்றுமை உருபுகளாலும் இணைப்பாலும் பிரதிபலிக்கப்படுகின்றன.
theological_decisions:
- issue: கூடார வழிபாட்டுச் சூழலில் הַכַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: கிருபாசனம்
  alternative: பாவநிவாரண மூடி
  rationale: இச்சொல் பெட்டியின் மூடியைக் குறைப்பதோடு பாவநிவாரண வழிபாட்டுத் தொடர்பையும் கொண்டுள்ளது. ‘கிருபாசனம்’ மரபில் அறியப்பட்ட வழிபாட்டுச் சொல்லாக இருப்பதால் முதன்மை உரையில் வைக்கப்பட்டது; மூடி என்ற பொருளையும் பாவநிவாரணத் தொடர்பையும் வெளிப்படுத்தும் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியல் வடிவத்தையும் வசனத் துணுக்கின் தொடர்ச்சியையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘சுமக்கும்’ என்பது தண்டுகளின் பயன்பாட்டைத் தெளிவுபடுத்துகிறது; ‘மறைப்புத் திரை’ என்பது செயற்கையான சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்து மூலத்தின் இரு கூறுகளையும் காக்கிறது.
