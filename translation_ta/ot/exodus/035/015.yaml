translation:
  language: ta
  text: தூபபீடத்தையும் அதன் தண்டுகளையும், அபிஷேக எண்ணெயையும், நறுமணத் தூபத்தையும், கூடாரத்தின் நுழைவாயிலுக்கான திரையையும்;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: தூபபீடம்
  rationale: தூபத்துடன் தொடர்புடைய பலிபீடத்தைக் குறிக்கும் எபிரெயக் கூட்டுச்சொல்லை, வழிபாட்டுச் சூழலைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: בַּדָּיו
  choice: அதன் தண்டுகள்
  rationale: பரிசுத்தப் பொருளைச் சுமப்பதற்குப் பயன்படுத்தப்பட்ட நீண்ட தண்டுகளைக் குறிக்கிறது; சூழலில் பொருள் தெளிவாக இருப்பதால் ‘சுமக்கும்’ என விரிவாக்கவில்லை.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெய்
  rationale: சடங்குமுறைப்படி பூசுவதற்குப் பயன்படுத்தப்பட்ட எண்ணெயைக் குறிக்கும் நிலையான, புரிந்துகொள்ளத்தக்க தமிழ் சொற்றொடர்.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: நறுமணத் தூபம்
  rationale: மணமுள்ள வாசனைப் பொருட்களால் செய்யப்பட்ட தூபம் என்பதைக் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מָסַךְ הַפֶּתַח
  choice: நுழைவாயிலுக்கான திரை
  rationale: நுழைவிடத்தில் தொங்கவிடப்பட்ட மறைப்புத் திரையைக் குறிக்கிறது; ‘திரை’ என்பது இயல்பான தமிழாகவும் கூடாரத்தின் பிற கூறுகளிலிருந்து இதை வேறுபடுத்தப் போதுமானதாகவும் உள்ளது.
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: திருவாசஸ்தலத்தின் நுழைவாயிலுக்கான
  rationale: לְ முன்னொட்டு இங்கு திரை எந்த நுழைவாயிலுக்குரியது அல்லது எதற்குப் பயன்படுகிறது என்பதைச் சுட்டுகிறது; தமிழ் வடிவம் அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: இஸ்ரவேலரிடையே கடவுள் வாசம்செய்வதற்குரிய எடுத்துச் செல்லக்கூடிய பரிசுத்தக் கூடார அமைப்பைக் குறிக்கிறது; ‘வாசஸ்தலம்’ என்ற மூலக் கருத்தையும் வழிபாட்டுச் சிறப்பையும் இணைக்கிறது.
