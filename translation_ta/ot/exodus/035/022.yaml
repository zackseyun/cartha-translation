  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: ta
  text: ஆண்கள் பெண்களோடு வந்தார்கள்[a]. மனமுவந்த அனைவரும் புரூச்சுகள், காதணிகள், மோதிரங்கள், பிற அணிகலன்கள் என எல்லா வகையான பொன் நகைகளையும் கொண்டுவந்தார்கள்[b]. பொன் அசைவாட்டுக் காணிக்கையை யாவேக்கு அர்ப்பணித்த ஒவ்வொரு ஆணும் அவ்வாறு செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் “பெண்கள்மேல் ஆண்கள்” என அமைகிறது. இங்கு ஆண்கள் பெண்களோடு சேர்ந்து வந்தார்கள் அல்லது பெண்களுடன் கூடுதலாக வந்தார்கள் என்பது பெரும்பாலும் கருதப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: இங்குள்ள சில நகைப்பெயர்களின் துல்லியமான பொருள் உறுதியற்றது. “புரூச்சுகள்” என்பது அலங்காரப் பிடிப்புகள் அல்லது வளையங்களாகவும் இருக்கலாம்; “காதணிகள்” என்பது மூக்குவளையங்களாகவும் இருக்கலாம். “பிற அணிகலன்கள்” என்பது ஒரு குறிப்பிட்ட வகைப் பதக்கம் அல்லது கைவளையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: வாவ் தொடர்நிகழ்வை முன்னெடுக்கிறது; தமிழில் சொல் வரிசையும் முந்தைய சூழலும் தொடர்ச்சியை இயல்பாக உணர்த்துவதால் தனியாக ‘அப்போது’ சேர்க்கப்படவில்லை.
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: ஆண்கள் பெண்களோடு
  rationale: עַל இங்கு சொல்லுக்குச் சொல் இடப்பொருளில் அல்லாமல், பெண்களுடன் சேர்ந்து அல்லது அவர்களுடன் கூடுதலாக ஆண்களும் வந்தார்கள் என்ற இடியோமச் சார்பில் புரிந்துகொள்ளப்படுகிறது; தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: כֹּל נְדִיב לֵב
  choice: மனம் விரும்பிய அனைவரும்
  rationale: தன்னார்வமும் உள்ளார்ந்த மனமுவப்பும் குறிக்கும் எபிரெயச் சொல்லாட்சியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הֵבִיאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: காணிக்கைப் பொருட்களை எடுத்துக்கொண்டு வருதல் என்ற எளிய பொருளை நேரடியாகத் தருகிறது.
- source_word: חָח
  choice: அணிப்பூட்டுகள்
  rationale: இச்சொல்லின் துல்லியமான நகைவகை உறுதியற்றது; ஆடை அல்லது நகையைப் பூட்டும் clasp/brooch போன்ற பொருளை ‘அணிப்பூட்டு’ பொதுவாகக் குறிக்கிறது.
- source_word: נֶזֶם
  choice: காதணிகள்
  rationale: காது அல்லது மூக்கில் அணியும் வளையத்தைச் சொல்லக்கூடும்; பட்டியலில் இயல்பான இயல்புநிலைத் தேர்வாக ‘காதணிகள்’ பயன்படுத்தப்பட்டு மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: טַבַּעַת
  choice: மோதிரங்கள்
  rationale: அடையாள முத்திரை மோதிரம் எனத் துல்லியப்படுத்த ஆதாரம் போதாததால் பொதுவான ‘மோதிரங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כוּמָז
  choice: பிற அணிகலன்கள்
  rationale: அரிதான இச்சொல்லின் சரியான பொருள் உறுதியற்றது; பதக்கம் அல்லது கைவளை போன்ற முன்மொழிவுகளுக்கு இடமளிக்கும் பரந்த மொழிபெயர்ப்பு.
- source_word: כָּל כְּלִי זָהָב
  choice: எல்லா வகையான பொன் நகைகளையும்
  rationale: כְּלִי என்பது பரந்த ‘பொருள்/உருப்படி’ என்றாலும், உடனடியான சூழல் தனிநபர் அணிகலன்களின் பட்டியல் என்பதால் ‘பொன் நகைகள்’ இயல்பாகப் பொருந்துகிறது.
- source_word: וְכָל אִישׁ
  choice: ஒவ்வொரு ஆணும்
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமை אִישׁ துல்லியமாகப் பாதுகாக்கப்படுகிறது.
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: பொன்னை அசைவாட்டும் காணிக்கையாகச் செலுத்திய
  rationale: הֵנִיף என்பதன் சடங்குசார் உயர்த்தி/அசைவாட்டிப் படைத்தல் என்ற நுணுக்கத்தையும் תְּנוּפָה என்ற தொழில்நுட்பக் காணிக்கைச் சொல்லையும் காக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவமான ‘யெகோவா’ என வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: நான்கு எழுத்து இறைப்பெயரை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் பெயராகவே தருகிறது. தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; பண்டைய உச்சரிப்பை மீட்டமைக்கும் ‘யாவே’ என்பதும் சாத்தியம்.
- issue: וְכָל אִישׁ என்பதிலுள்ள பாலினக் குறிப்பு
  choice: ஒவ்வொரு ஆணும்
  alternative: ஒவ்வொருவரும்
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் பெயர்ச்சொல்லை நடுநிலைப்படுத்தாமல் பாதுகாக்கிறது; வசனத்தின் முதல் பகுதியில் பெண்களின் பங்கேற்பும் தெளிவாக உள்ளது.
- issue: תְּנוּפָה என்ற சடங்குசார் சொல்
  choice: அசைவாட்டும் காணிக்கை
  alternative: படைக்கும் காணிக்கை
  rationale: இது பொதுவான காணிக்கை மட்டுமல்லாமல் உயர்த்தி அல்லது அசைவாட்டி அர்ப்பணிக்கும் சடங்கைக் குறிக்கலாம்; அந்தச் சடங்குசார் பதற்றத்தை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘மனம் விரும்பிய’ என்பது உள்ளார்ந்த தன்னார்வத்தை இயல்பாகக் காட்டுகிறது. நகைப்பெயர்களில் தவறான துல்லியத்தைத் தவிர்த்து அடிக்குறிப்புகள் மூலம் மூலத்தின் ஐயப்பாடு பாதுகாக்கப்பட்டுள்ளது.
