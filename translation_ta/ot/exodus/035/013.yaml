  text: மேசையையும், அதன் சுமப்புத் தண்டுகளையும், அதற்குரிய எல்லாப் பயன்பாட்டுப் பொருட்களையும், சந்நிதி அப்பத்தையும்,[a]
  philosophy: optimal-equivalence
