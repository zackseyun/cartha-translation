lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: மேசை
  rationale: எபிரெயச் சொல் வழிபாட்டுக்குரிய மேசையைப் பொதுவாகக் குறிக்கிறது. அதன் குறிப்பிட்ட பயன்பாடு தொடரிலுள்ள ‘திருமுன்னிலை அப்பம்’ என்பதால் தெளிவாகிறது; ஆகவே இங்கே கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: בַּדָּיו
  choice: அதன் தண்டுகள்
  rationale: திருக்கூடாரச் சூழலில் בַּד என்பது பரிசுத்தப் பொருட்களைச் சுமப்பதற்குப் பயன்படுத்திய நீண்ட தண்டுகளைக் குறிக்கிறது. ‘தண்டுகள்’ என்பது இயல்பான, தெளிவான நவீனத் தமிழ்.
- source_word: כָּל כֵּלָיו
  choice: அதன் எல்லாப் பாத்திரங்கள்
  rationale: כְּלִי என்பது பாத்திரங்கள், கருவிகள், பயன்பாட்டுப் பொருட்கள் ஆகியவற்றைக் குறிக்கும் பரந்த சொல். மேசைச் சூழலில் ‘பாத்திரங்கள்’ இயல்பாகவும் போதுமான பரப்புடனும் உள்ளது.
- source_word: לֶחֶם הַפָּנִים
  choice: திருமுன்னிலை அப்பம்
  rationale: இச்சொற்றொடர் நேரடியாக ‘முகத்தின்/முன்னிலையின் அப்பம்’ எனப் பொருள்படும். ‘திருமுன்னிலை அப்பம்’ வழிபாட்டுச் சூழலையும் தேவனுடைய முன்னிலையையும் சுருக்கமாகப் பாதுகாக்கிறது.
