  rationale: கூடாரத்தின் விளக்குக்கு ஒளி தர எண்ணெய் பயன்படுவதைக் குறிக்கும் நோக்கப்பொருள். நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்கச் செயற்பாட்டு வடிவம் பயன்படுத்தப்பட்டது.
