- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: அபிஷேக எண்ணெய்
  rationale: வழிபாட்டுச் சூழலில் அர்ப்பணிப்புக்காகப் பூசப்படும் நியமிக்கப்பட்ட எண்ணெயைக் குறிக்கும் நிலையான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொற்றொடர்.
- source_word: קְטֹרֶת
  choice: தூபம்
  rationale: திருக்கூடாரச் சூழலில் எரிக்கப்படும் மணப்பொருளைக் குறிக்கும் வழக்கமான மற்றும் துல்லியமான தமிழ் இணைச்சொல்.
- source_word: הַסַּמִּים
  choice: நறுமண
  rationale: ‘நறுமணப் பொருள்களாலான’ என்ற எபிரெய உறவைக் கருத்தில் கொண்டு, இயல்பான தமிழில் தூபத்தின் மணத்தன்மையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
