translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் நடை. ‘உள்ளத்தில் ஞானமுள்ள’ எனும் எபிரெய உருவகம் காக்கப்பட்டுள்ளது. ‘நூல் நூற்றாள்’ என்பது தமிழில் நூற்புச் செயலை இயல்பாகக் குறிக்கிறது; பகிர்ந்தளிக்கும் ஒருமையிலிருந்து கூட்டுப் பன்மைக்கு மாறும் எபிரெய இலக்கண அமைப்பும் பாதுகாக்கப்பட்டுள்ளது.
