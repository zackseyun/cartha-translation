base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/025.yaml
  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: ta
  text: உள்ளத்தில் ஞானமுள்ள ஒவ்வொரு பெண்ணும் தன் கைகளால் நூல் நூற்றாள்[a]. அவர்கள் நூற்றவற்றை—நீலநிற நூலையும், ஊதாநிற நூலையும், செந்நிற நூலையும், மெல்லிய லினன் நூலையும்[b]—கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உள்ளத்தில் ஞானமுள்ள” என்பது உள்ளார்ந்த ஞானத்திலிருந்து வெளிப்படும் நடைமுறைத் திறனைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீலநிறப் பொருளையும், ஊதாநிறப் பொருளையும், செந்நிறப் பொருளையும், மெல்லிய லினனையும்”; “அவர்கள் நூற்றவற்றை” என்பதற்குப் பிறகு எபிரெயத்தில் பொருட்கள் பட்டியலிடப்படுகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: உள்ளத்தில் ஞானமுள்ள
  rationale: எபிரெயச் சொற்றொடரின் ‘இதயம்/உள்ளம்’ என்ற உருவகத்தையும், அதில் அடங்கிய உள்ளார்ந்த ஞானம் மற்றும் நடைமுறைத் திறன் ஆகிய இரு நுணுக்கங்களையும் காக்கிறது.
- source_word: בְּיָדֶיהָ
  choice: தன் கைகளால்
  rationale: கருவிப் பொருளை இயல்பான தமிழில் தெரிவித்து, கைவேலையை வலியுறுத்துகிறது.
- source_word: טָוּוּ
  choice: நூல் நூற்றாள்
  rationale: நாரை நூலாக்கும் செயலைத் துல்லியமாகக் குறிக்கிறது; பகிர்ந்தளிக்கும் ஒருமை எழுவாயோடு ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּבִיאוּ
  choice: அவர்கள் ... கொண்டுவந்தார்கள்
  rationale: எபிரெயில் ஒருமை எழுவாயிலிருந்து பெண்களை ஒட்டுமொத்தமாகக் குறிக்கும் பன்மை வினைக்கு ஏற்படும் மாற்றத்தைத் தெளிவாகக் காக்கிறது.
- source_word: מַטְוֶה
  choice: அவர்கள் நூற்றவற்றை
  rationale: நூற்கப்பட்ட பொருள் அல்லது நூல் என்ற பெயர்ச்சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது; தொடர்ந்து வரும் பட்டியலையும் அறிமுகப்படுத்துகிறது.
- source_word: תְּכֵלֶת
  choice: நீலநிற நூல்
  rationale: திருக்கூடாரத் துணிவகைச் சூழலில் மதிப்புமிக்க நீலச் சாயமிட்ட நூற்பொருளைக் குறிக்கிறது.
- source_word: אַרְגָּמָן
  choice: ஊதாநிற நூல்
  rationale: திருக்கூடாரத் துணிகளில் பயன்படுத்தப்பட்ட ஊதா நிறமிட்ட நூற்பொருளைத் தெளிவாகக் குறிக்கிறது.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: செந்நிற நூல்
  rationale: சொல்லுக்கு சொல் மொழிபெயர்த்தால் வரும் புழு சார்ந்த சாயக் குறிப்பை விட, இச்சூழலில் நோக்கப்படும் செந்நிறச் சாயமிட்ட நூற்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שֵׁשׁ
  choice: மெல்லிய நார்ப்பட்டு
  rationale: திருக்கூடாரச் சூழலில் வரும் உயர்தர மெல்லிய லினன் துணிநாரைக் குறிக்கிறது; பொதுவான பருத்தி அல்லது பட்டு எனத் தவறாகப் புரிந்துகொள்ளப்படாதபடி பாரம்பரிய தமிழ்ச் சொல்லை பயன்படுத்துகிறது.
