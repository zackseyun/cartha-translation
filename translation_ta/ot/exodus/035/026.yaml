  text: And all the women whose hearts moved them with skill spun the goats' hair[a].
translation:
  language: ta
  text: தங்கள் உள்ளம் அவர்களைத் தூண்டிய பெண்கள் அனைவரும் திறமையுடன் வெள்ளாட்டு உரோமத்தை நூற்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “வெள்ளாடுகளை”; இங்கு நூற்பதற்குப் பயன்படுத்தப்பட்ட வெள்ளாட்டு உரோமத்தைக் குறிக்கும் சொல் விடுபட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: பெண்கள் அனைவரும்
  rationale: כָּל என்பதுடன் பன்மை பெயர்ச்சொல் வருவதால், முழுக் குழுவையும் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: தங்கள் உள்ளம் ... செய்யத் தூண்டிய
  rationale: ‘உள்ளம் அவர்களை உயர்த்தியது’ என்ற எபிரெய மரபுத்தொடர், உள்ளார்ந்த விருப்பமும் முனைப்பும் அவர்களைச் செயல்படத் தூண்டியதைக் குறிக்கிறது; தமிழில் பொருள் தெளிவாகவும் இயல்பாகவும் வெளிப்பட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּחָכְמָה
  choice: திறமையுடன்
  rationale: கூடாரப் பணிக்கான கைவினைச் சூழலில் חָכְמָה என்பது கோட்பாட்டு ஞானத்தைவிட நடைமுறைத் திறமையைக் குறிக்கிறது.
- source_word: טָווּ
  choice: நூற்றார்கள்
  rationale: நாரை நூலாக்கும் செயலைக் குறிக்கும் வினை; தமிழில் ‘நூற்றல்’ என்பது இதற்குரிய துல்லியமான கைவினைச் சொல்.
- source_word: אֶת הָעִזִּים
  choice: வெள்ளாட்டு உரோமத்தை
  rationale: எழுத்துப்படி ‘வெள்ளாடுகளை’ என்றாலும், நூற்புச் சூழலில் நூலாக்கப் பயன்படுத்திய வெள்ளாட்டு உரோமம் விடுபட்ட சொல்லாக உள்ளடங்கியுள்ளது; உயிருள்ள ஆடுகளை நூற்றதாகத் தவறாகப் புரியாமல் இருக்க மறைந்துள்ள பொருள் வெளிப்படுத்தப்பட்டது.
