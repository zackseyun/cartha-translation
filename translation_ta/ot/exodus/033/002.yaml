  text: וְ/שָׁלַחְתִּ֥י לְ/פָנֶ֖י/ךָ מַלְאָ֑ךְ וְ/גֵֽרַשְׁתִּ֗י אֶת הַֽ/כְּנַעֲנִי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: ta
  text: உனக்கு முன்னே ஒரு தூதரை[a] அனுப்புவேன்; கானானியர், எமோரியர், ஏத்தியர், பெரிசியர், ஏவியர், எபூசியர் ஆகியோரைத் துரத்திவிடுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒரு செய்தியாளரை’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் விண்ணுலகத் தூதரையோ மனிதத் தூதரையோ குறிக்கக்கூடும்; இங்குள்ள சூழல் விண்ணுலகத் தூதரைச் சுட்டுவதாகத் தோன்றுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: அனுப்புவேன்
  rationale: இறைவன் அளிக்கும் வாக்குறுதியின் சூழலில், இணைப்புடன் வந்துள்ள நிறைவுவினை எதிர்காலப் பொருளைத் தருகிறது. நவீன தமிழில் இயல்பாகவும் உறுதிமொழியின் வலிமையுடனும் உள்ளது.
- source_word: לְפָנֶיךָ
  choice: உனக்கு முன்னே
  rationale: ‘உன் முகத்திற்கு முன்பாக’ என்ற எபிரேய மரபுத்தொடர், ஒருவருக்கு முன்னால் அல்லது வழிநடத்திச் செல்வதைக் குறிக்கிறது. ‘உனக்கு முன்னே’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: מַלְאָךְ
  choice: ஒரு தூதரை
  rationale: எபிரேயச் சொல் விண்ணுலகத் தூதரையோ மனிதச் செய்தியாளரையோ குறிக்கலாம். ‘தூதர்’ அந்த அடிப்படைப் பொருளையும் இச்சூழலில் உள்ள விண்ணுலகத் தூதர் என்ற சாத்தியத்தையும் தேவையின்றி முடிவுசெய்யாமல் காக்கிறது.
- source_word: וְגֵרַשְׁתִּי
  choice: துரத்திவிடுவேன்
  rationale: குடியிருப்பவர்களை ஓர் இடத்திலிருந்து வெளியேற்றுதல் அல்லது விரட்டுதல் என்பதே வினையின் பொருள். ‘துரத்திவிடுவேன்’ நவீன தமிழில் தெளிவாக அந்த வலிமையை வெளிப்படுத்துகிறது.
- source_word: הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: கானானியர், எமோரியர், ஏத்தியர், பெரிசியர், ஏவியர், எபூசியர் ஆகியோரை
  rationale: எபிரேயத்தில் ஒவ்வொரு இனப்பெயரும் இலக்கண ஒருமையில் இருந்தாலும் கூட்டாக ஓர் இனத்தைக் குறிக்கிறது. தமிழில் ‘-யர்’ வடிவம் ஒவ்வொரு மக்கள் குழுவையும் இயல்பாகவும் மரியாதையான பொதுப்பெயராகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: מַלְאָךְ என்பவரின் அடையாளம்
  choice: குறிப்பிடப்படாத வகையில் ‘ஒரு தூதர்’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஒரு தேவதூதர்’ அல்லது ‘அந்தத் தூதர்’
  rationale: இவ்வசனம் அந்தத் தூதர் கர்த்தருடைய தூதரா, படைக்கப்பட்ட விண்ணுலகத் தூதரா, அல்லது வேறொரு செய்தியாளரா என்பதைத் தனியாகத் தெளிவுபடுத்தவில்லை. ஆகவே வசனம் கூறாத இறையியல் அடையாளத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. இனப்பெயர்கள் தமிழில் வழக்கமான கூட்டுப் பன்மை வடிவில் வழங்கப்பட்டுள்ளன; மூலத்தின் பட்டியல் அமைப்பு காக்கப்பட்டுள்ளது.
