base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: ta
  text: யாவே மோசேயிடம், “நீ சொன்ன இந்தக் காரியத்தையும்[a] நான் செய்வேன். ஏனெனில், என் பார்வையில் நீ தயவைப் பெற்றிருக்கிறாய்[b]; நான் உன்னைப் பெயரால் அறிந்திருக்கிறேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த விஷயத்தையும்” அல்லது “இந்த வார்த்தையையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் பார்வையில் நீ தயவைப் பெற்றிருக்கிறாய்” என்பது ஒருவர் சாதகமான பார்வையைப் பெற்றிருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பில் தருகிறது.
- source_word: גַּם
  choice: -யும்
  rationale: முந்தைய வேண்டுகோளுடன் இதையும் சேர்த்துச் செய்வதாகக் கூறும் சேர்க்கைப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தக் காரியம்
  rationale: דָּבָר என்பதற்கு சொல், விஷயம், காரியம் ஆகிய பொருள்கள் உண்டு; இங்கு மோசே கூறிய வேண்டுகோளைச் சார்ந்த செயலைக் குறிக்க ‘காரியம்’ இயல்பாகவும் போதிய அளவு விரிவாகவும் உள்ளது.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: நீ சொன்ன
  rationale: மோசே பேசியதைக் குறிக்கும் எபிரெய வினையை நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: אֶעֱשֶׂה
  choice: நான் செய்வேன்
  rationale: עשה என்ற பொதுவான செயல்வினையின் எளிய எதிர்கால வாக்குறுதியைப் பாதுகாக்கிறது.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: நீ என் கண்களில் தயவு பெற்றிருக்கிறாய்
  rationale: தயவான பார்வையைப் பெற்றிருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தையும் பொருளையும் பாதுகாக்கிறது.
- source_word: וָאֵדָעֲךָ
  choice: உன்னை அறிந்திருக்கிறேன்
  rationale: இங்கு ידע தனிப்பட்ட அறிதலையும் அங்கீகாரத்தையும் குறிக்கிறது; தமிழ் நிறைநிலை வடிவம் அதன் தொடரும் உறவுசார் வலிமையை வெளிப்படுத்துகிறது.
- source_word: בְּשֵׁם
  choice: பெயரால்
  rationale: ஒருவரைக் குறிப்பாகவும் தனிப்பட்ட முறையிலும் அறிதல் என்ற நுணுக்கத்தைச் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தேவனுடைய தனிப்பெயர் நேரடியாக உள்ளது. எனவே அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பில் தருவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ‘பெயரால் அறிதல்’ என்பதன் உறவுசார் நுணுக்கம்
  choice: உன்னைப் பெயரால் அறிந்திருக்கிறேன்
  alternative: உன்னைத் தனிப்பட்ட முறையில் அறிந்திருக்கிறேன்
  rationale: மூலத்தின் நேரடியான உருவகத்தைப் பாதுகாத்து, தனிப்பட்ட அறிதல் அல்லது அங்கீகாரம் என்ற பொருளை வாசகர் உணர இடமளிக்கிறது; அதன் இறையியல் விளைவுகளை மேலும் குறிப்பிட்டு முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் உள்ள நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் ‘என் கண்களில் தயவு’ மற்றும் ‘பெயரால் அறிதல்’ ஆகிய உருவகங்கள் விளக்கமாக மாற்றப்படாமல் உரையில் பாதுகாக்கப்பட்டுள்ளன.
