revisions:
- from: பாலும் தேனும் வழிந்தோடும் நாட்டுக்கு. ஏனெனில் நான் உன் நடுவில்[a] ஏறிச் செல்லமாட்டேன். நீ கழுத்தை வளைக்காத மக்கள் என்பதால், வழியிலேயே நான் உன்னை முற்றிலும் அழித்துவிடக்கூடும்[b].
  to: பாலும் தேனும் வழிந்தோடும் நாட்டுக்கு. நீ பிடிவாதக்கார மக்களாய் இருப்பதால், ஒருவேளை வழியில் உன்னை அழித்துவிட நேரிடாதபடி, நான் உன் நடுவில்[a] ஏறிச் செல்லமாட்டேன்[b].
  rationale: The revision corrects the Tamil grammar of the collective-singular address, renders the stiff-necked idiom naturally as obstinacy, and preserves פֶּן as a feared consequence without making the divine action uncertain. It avoids the added intensifier “முற்றிலும்.” Footnote anchors are placed immediately after the expressions to which their alternatives apply.
