base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: ta
  text: பாலும் தேனும் வழிந்தோடும் நாட்டுக்கு. நீ பிடிவாதக்கார மக்களாய் இருப்பதால், ஒருவேளை வழியில் உன்னை அழித்துவிட நேரிடாதபடி, நான் உன் நடுவில்[a] ஏறிச் செல்லமாட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் மத்தியில்” அல்லது “உன்னோடு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன்னை ஒழித்துவிட நேரிடாதபடி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: நாட்டுக்கு
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் இலக்கைக் குறிக்கும் சொற்றொடராக இருப்பதால், தமிழில் இயல்பாக ‘நாட்டுக்கு’ என்று வழங்கப்பட்டது; சூழலில் அது ஏற்கெனவே அறியப்பட்ட வாக்குத்தத்த நாடு.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: பாலும் தேனும் வழிந்தோடும்
  rationale: நாட்டின் செழிப்பைக் குறிக்கும் எபிரேய உருவகத்தை இயல்பான, பரவலாகப் புரியும் தமிழில் தக்கவைக்கிறது.
- source_word: כִּי לֹא אֶעֱלֶה
  choice: ஏனெனில் நான் ... ஏறிச் செல்லமாட்டேன்
  rationale: முந்தைய சூழலில் தேவதூதனை அனுப்புவதற்கான விளக்கமாக כִּי-யின் காரணத் தொடர்பை ‘ஏனெனில்’ காட்டுகிறது; עלה-வின் ஏறிச் செல்லும் பயண நுணுக்கமும் தக்கவைக்கப்படுகிறது.
- source_word: בְּקִרְבְּךָ
  choice: உன் நடுவில்
  rationale: இஸ்ரவேலை ஒருமை வடிவில் கூட்டாகச் சுட்டுகிறது; தேவன் மக்களுடைய மத்தியில் இருப்பதன் இடவியல் மற்றும் உடன்படிக்கை சார்ந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: கழுத்தை வளைக்காத மக்கள்
  rationale: பிடிவாதமான எதிர்ப்பைக் குறிக்கும் ‘கடினமான கழுத்து’ என்ற எபிரேய உருவகத்தை, நவீன வாசகருக்குப் புரியக்கூடிய தமிழில் உருவகமாகவே தக்கவைக்கிறது.
- source_word: פֶּן
  choice: அழித்துவிடக்கூடும்
  rationale: פֶּן எச்சரிக்கப்படும் அல்லது அஞ்சப்படும் விளைவை அறிமுகப்படுத்துகிறது. தமிழில் சாத்தியமான அபாயமாகத் தெரிவிக்க ‘கூடும்’ பயன்படுத்தப்பட்டது.
- source_word: אֲכֶלְךָ
  choice: உன்னை முற்றிலும் அழித்துவிடக்கூடும்
  rationale: כלה என்பதன் பியேல் வடிவம் முடிவுக்குக் கொண்டுவருதல் அல்லது முழுமையாக அழித்தல் என்ற கடுமையை உடையது; ‘முற்றிலும் அழித்துவிடுதல்’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בַּדָּרֶךְ
  choice: வழியிலேயே
  rationale: பயணத்தின் போதே தீர்ப்பு நிகழும் அபாயத்தை இயல்பான தமிழில் வலியுறுத்துகிறது.
theological_decisions:
- issue: தேவ பிரசன்னத்தைப் பற்றிய கூற்று
  choice: நான் உன் நடுவில் ஏறிச் செல்லமாட்டேன்
  alternative: நான் உங்களோடு ஏறிச் செல்லமாட்டேன்
  rationale: தேவன் வெறுமனே துணையாக வராததைவிட, கலகக்கார மக்களின் மத்தியில் அவருடைய பரிசுத்த பிரசன்னம் இருப்பதால் உண்டாகும் ஆபத்தையே ‘உன் நடுவில்’ தெளிவாகத் தக்கவைக்கிறது.
- issue: אֲכֶלְךָ-வில் வெளிப்படும் தெய்வீகத் தீர்ப்பின் கடுமை
  choice: உன்னை முற்றிலும் அழித்துவிடக்கூடும்
  alternative: உன்னை ஒழித்துவிடக்கூடும்
  rationale: மக்களை முடிவுக்குக் கொண்டுவரும் அபாயத்தை மென்மைப்படுத்தாமல் கூறுகிறது; அதேவேளை, தீர்ப்பு நிகழும் குறிப்பிட்ட முறையை உரையில் இல்லாதபடி சேர்ப்பதில்லை.
- issue: கூட்டுப் பொருளுடைய ஒருமை முன்னிலை
  choice: உன் / நீ / உன்னை
  alternative: உங்கள் / நீங்கள் / உங்களை
  rationale: எபிரேய உரையின் ஒருமை வடிவங்கள் இஸ்ரவேலை ஒரே கூட்டாக நோக்குகின்றன. தமிழிலும் அந்த உரைநடைத் தீவிரத்தைப் பாதுகாக்க ஒருமை தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘கழுத்தை வளைக்காத’ என்பது மூல உருவகத்தைத் தக்கவைத்தபடியே சாதாரண வாசகருக்குப் புரியும் வடிவம். வசனம் முந்தைய வாக்கியத்திலிருந்து தொடரும் துண்டாகத் தொடங்குவதால், தொடக்கத்திலுள்ள ‘நாட்டுக்கு’ என்ற இணைப்பு அப்படியே பாதுகாக்கப்பட்டது.
