base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: ta
  text: பின்னர் மோசே யாவேவிடம்[a], “இதோ, ‘இந்த மக்களை மேலே கொண்டுபோ’ என்று நீர் என்னிடம் சொல்கிறீர். ஆனால், என்னுடன் யாரை அனுப்புவீர் என்பதை நீர் எனக்குத் தெரியப்படுத்தவில்லை. இருந்தும், ‘உன்னைப் பெயரால் அறிந்திருக்கிறேன்[b]; என் பார்வையில் நீ தயவைப் பெற்றிருக்கிறாய்[c]’ என்று நீர் கூறியிருக்கிறீர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவே’ என்பது எபிரெயத்தில் יהוה (YHWH) என எழுதப்படும் இறைவனின் தனிப்பட்ட பெயரின் ஒலிபெயர்ப்பு.
    reason: cultural_note
  - marker: b
    text: ‘பெயரால் அறிந்திருக்கிறேன்’ என்பது தனிப்பட்ட அறிதலையும் அங்கீகாரத்தையும் உணர்த்தும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: c
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘என் கண்களில் தயவு பெற்றிருக்கிறாய்’; ‘அருள் பெற்றிருக்கிறாய்’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருமுறையெழுத்துகளான יהוה என்பவற்றை ஒரு பட்டத்தால் மாற்றாமல், இறைப் பெயரின் பொதுவாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: רְאֵה
  choice: இதோ
  rationale: மோசேயின் வேண்டுகோளை நேரடியாக அறிமுகப்படுத்தும் உரையாடல் இடைச்சொல்லாக இங்கு வருகிறது; நவீனத் தமிழில் இயல்பான அதே வலிமையை ‘இதோ’ தருகிறது.
- source_word: הַעַל
  choice: மேலே அழைத்துச் செல்
  rationale: עלה என்பதன் ஹிஃபில் வடிவிலுள்ள ‘மேலே செல்லச் செய்/கொண்டுபோ’ என்ற திசை சார்ந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களை
  rationale: ‘இந்த மக்கள்’ என்ற சுட்டும், ஓரளவு விலகிய தொனியும் காக்கப்படுகின்றன; தமிழ் வாக்கிய அமைப்புக்கேற்ப வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: הוֹדַעְתַּנִי
  choice: எனக்குத் தெரியப்படுத்தவில்லை
  rationale: ידע என்பதன் காரணவினை வடிவான ‘அறியச் செய்’ என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: என்னுடன் யாரை அனுப்புவீர் என்பதை
  rationale: אֲשֶׁר இலக்கணரீதியாகப் பொதுவான தொடர்புச்சொல் என்றாலும், சூழலில் மோசேயுடன் அனுப்பப்படும் ஒரு நபரையே இயல்பாகக் குறிக்கிறது; עִם என்பதன் உடனிருப்பு பொருள் ‘என்னுடன்’ எனக் காக்கப்படுகிறது.
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: உன்னைப் பெயரால் அறிந்திருக்கிறேன்
  rationale: தனிப்பட்ட அறிதலையும் அங்கீகாரத்தையும் உணர்த்தும் எபிரெய மரபுத்தொடரை விளக்கவுரையாக விரிவாக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: என் பார்வையில் நீ தயவு பெற்றிருக்கிறாய்
  rationale: ‘என் கண்களில்’ என்ற மூலப்படிமத்தை தமிழில் புரியத்தக்க ‘என் பார்வையில்’ என வழங்கி, חֵן என்பதற்கு இச்சூழலில் இயல்பான ‘தயவு’ என்பதைப் பயன்படுத்துகிறது.
- source_word: וְאַתָּה ... לֹא ... וְאַתָּה אָמַרְתָּ
  choice: ஆனால் ... இருந்தும்
  rationale: மீண்டும் வரும் வலியுறுத்தப்பட்ட சுட்டுப்பெயர்களால் உருவாகும் எதிர்மறை முரணைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல வசனம் தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: ‘உன்னைப் பெயரால் அறிந்திருக்கிறேன்’ என்பதன் பொருள்
  choice: உறவுசார்ந்த மரபுத்தொடரை அப்படியே தக்கவைத்தல்
  alternative: உன்னைத் தனிப்பட்ட முறையில் அறிந்திருக்கிறேன்; உன்னைத் தேர்ந்தெடுத்திருக்கிறேன்
  rationale: இத்தொடர் தனிப்பட்ட அறிதலையும் தயவையும் உணர்த்தினாலும், ‘தேர்ந்தெடுத்தல்’ என்பதை வசனம் வெளிப்படையாகச் சொல்லவில்லை; ஆகவே கூடுதல் கோட்பாட்டுப் பொருள் புகுத்தப்படவில்லை.
- issue: חֵן என்பதன் பொருள்
  choice: தயவு
  alternative: அருள்
  rationale: ‘அருள்’ என்பதும் சாத்தியமானது; ஆனால் இச்சூழலில் ஒருவரின் பார்வையில் ஏற்றுக்கொள்ளப்படுதல் என்ற உறவுசார் பொருளை ‘தயவு’ தெளிவாகத் தருகிறது, குறிப்பிட்ட கோட்பாட்டுச் சொல்லாக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமையான ‘நீர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. மொழிநடை கண்ணியமானதாகவும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதாகவும் உள்ளது; அதேவேளை ‘மேலே’, ‘பெயரால்’, ‘என் பார்வையில்’ போன்ற மூலத்தின் முக்கியப் படிமங்களும் நுணுக்கங்களும் தக்கவைக்கப்பட்டுள்ளன.
