base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: ta
  text: மோசே அந்தக் கூடாரத்தை[a] எடுத்துப் பாளயத்திற்கு வெளியே, பாளயத்திலிருந்து வெகுதொலைவில், தனக்காக அமைப்பது வழக்கம்[b]. அதற்கு அவர் “சந்திப்புக் கூடாரம்” என்று பெயரிடுவார். யாவேயை நாடுகிற ஒவ்வொருவரும் பாளயத்திற்கு வெளியே இருந்த அந்தச் சந்திப்புக் கூடாரத்திற்குச் செல்வது வழக்கம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “அந்தக் கூடாரம்.” அது “மோசேயின் கூடாரம்” என்று உரை வெளிப்படையாகக் கூறவில்லை; அது மோசேயின் சொந்தக் கூடாரமாகவோ, இந்த நோக்கத்திற்காக அவர் பயன்படுத்திய தனிக் கூடாரமாகவோ இருந்திருக்கலாம் என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எடுத்துக்கொண்டு ... அமைப்பார்” மற்றும் “செல்வார்கள்.” இங்குள்ள எபிரெய வினைவடிவங்கள் வழக்கமாகத் திரும்பத் திரும்ப நடந்த செயலைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: எடுத்துப் ... அமைப்பது வழக்கம்
  rationale: கதைச் சூழலில் இந்த yiqtol வடிவம் ஒருமுறை நடந்த செயலைவிட வழக்கமாகத் திரும்பத் திரும்ப நடந்த செயலைக் குறிக்கிறது.
- source_word: הָאֹהֶל
  choice: கூடாரத்தை
  rationale: எபிரெயத்தில் திட்டவட்டச் சுட்டு உள்ளது; ஆனால் அது மோசேயின் சொந்தக் கூடாரம் என்று வெளிப்படையாகக் கூறப்படவில்லை. தமிழில் சூழலால் குறிப்பிட்ட கூடாரம் என்பது இயல்பாக வெளிப்படுகிறது.
- source_word: וְנָטָה לוֹ
  choice: தனக்காக அமைப்பது
  rationale: கூடாரத்தைப் பற்றியபோது נטה என்பது அதை அமைத்தல் அல்லது விரித்தல் எனப் பொருள்படும்; לוֹ என்பதன் பயன்நிலையை ‘தனக்காக’ என்று தக்கவைக்கிறது.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: பாளயத்திற்கு வெளியே
  rationale: கூடாரம் இஸ்ரவேலரின் பாளய எல்லைக்கு வெளியே அமைக்கப்பட்ட இடத்தை நேரடியாகக் குறிக்கிறது.
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: பாளயத்திலிருந்து வெகுதொலைவில்
  rationale: முன்னரே கூறப்பட்ட ‘வெளியே’ என்பதைக் கூர்மைப்படுத்தி, பாளயத்திலிருந்து குறிப்பிடத்தக்க பிரிவை வலியுறுத்துகிறது.
- source_word: וְקָרָא לוֹ אֹהֶל מוֹעֵד
  choice: அதற்கு அவர் ‘சந்திப்புக் கூடாரம்’ என்று பெயரிட்டார்
  rationale: קרא לוֹ இங்கு பெயரிடுதலைக் குறிக்கிறது; אֹהֶל מוֹעֵד என்பதற்கு இயல்பான, பொருள் தெளிவான தமிழாக்கம் ‘சந்திப்புக் கூடாரம்’.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: யாவேயை நாடுகிற ஒவ்வொருவரும்
  rationale: בקש என்பது தேடுதல் மட்டுமன்றி இறைவனின் வழிகாட்டுதலை நாடுதலையும் உள்ளடக்கக்கூடும்; ‘நாடுகிற’ என்பது இரு நுணுக்கங்களையும் திறந்துவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: יֵצֵא
  choice: செல்வார்கள்
  rationale: இரண்டாவது yiqtol வடிவமும் வழக்கமாக நிகழ்ந்த செயலைக் குறிக்கிறது; தமிழில் பன்மை மரியாதை அல்ல, ‘ஒவ்வொருவரும்’ என்பதோடு இயல்பாக ஒத்திசையும் பொது வழக்குச் செயல் வடிவமாக வருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரைப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: ‘யாவேயை நாடுதல்’ என்பதன் பொருள்
  choice: பக்தியுடன் தேடுதல் மற்றும் வழிகாட்டுதலை விசாரித்தல் ஆகிய இரண்டையும் திறந்துவைக்கும் ‘நாடுகிற’
  alternative: தேடுகிற; விசாரிக்கிற
  rationale: מְבַקֵּשׁ என்ற சொல் இச்சூழலில் ஆன்மீகத் தேடலையும் இறைவனிடம் விசாரித்தலையும் குறிக்கக்கூடும்; ஒரே பொருளுக்குள் அதைச் சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘பாளயம்’, ‘சந்திப்புக் கூடாரம்’ போன்ற சொற்கள் வேதாகமச் சூழலின் தன்மையைத் தக்கவைத்தபடியே தெளிவாக உள்ளன. மூலத்தில் இல்லாத தொடக்கக் காலச் சொல் எதுவும் சேர்க்கப்படவில்லை.
