  text: וַ/יִּשְׁמַ֣ע הָ/עָ֗ם אֶת הַ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה וַ/יִּתְאַבָּ֑לוּ וְ/לֹא שָׁ֛תוּ אִ֥ישׁ עֶדְי֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: ta
  text: மக்கள் இந்தத் துயரமான செய்தியைக்[a] கேட்டபோது, துக்கம் அனுசரித்தார்கள்; ஒருவரும் தன் அணிகலன்களை[b] அணிந்துகொள்ளவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சார்ந்து, “இந்தத் தீய சொல்” அல்லது “இந்தத் துயரமான காரியம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “நகைகளை” அல்லது “அலங்காரப் பொருட்களை.” எபிரெயச் சொல் பலவகையான அலங்காரப் பொருட்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: மக்கள் ... கேட்டபோது
  rationale: שׁמע இங்கு அறிவிப்பைக் கேள்விப்படுவதைக் குறிக்கிறது. הָעָם ஒருமை வடிவ வினையுடன் வரும் கூட்டுப்பெயராக இருந்தாலும், தமிழில் இயல்பாகப் பன்மை உணர்வில் மொழிபெயர்க்கப்படுகிறது.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: இந்தத் துயரமான செய்தி
  rationale: דָּבָר என்பதன் அடிப்படைப் பொருள் ‘சொல்/காரியம்’; இங்கு அது முன்பு அறிவிக்கப்பட்ட செய்தியைக் குறிக்கிறது. רָע என்பதன் இச்சூழலிலுள்ள துயரமளிக்கும் தன்மையை ‘துயரமான’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; சொற்சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּתְאַבָּלוּ
  choice: துக்கம் அனுசரித்தார்கள்
  rationale: אבל என்பதன் ஹித்பாயேல் வடிவம் வெறும் மனவருத்தத்தை மட்டுமல்லாமல் துக்கநிலைக்குள் சென்று அதை வெளிப்படுத்துவதையும் குறிக்கலாம். அணிகலன்களை அணியாமை பற்றிய அடுத்த கூற்றுடன் ‘துக்கம் அனுசரித்தார்கள்’ இயல்பாகப் பொருந்துகிறது.
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: ஒருவரும் ... அணிந்துகொள்ளவில்லை
  rationale: אִישׁ இங்கு ஒவ்வொருவரையும் தனித்தனியாகக் குறிப்பிடும் பகிர்வுப் பயன்பாட்டில் உள்ளது. பாலினத்தைத் தேவையின்றி முன்னிறுத்தாமல், அந்தப் பகிர்வு வலிமையை ‘ஒருவரும்’ இயல்பாகக் காக்கிறது.
- source_word: עֶדְיוֹ עָלָיו
  choice: தன் அணிகலன்களை அணிந்துகொள்ளவில்லை
  rationale: עֲדִי நகைகளுக்கு மட்டும் கட்டுப்படாமல் அலங்காரப் பொருட்களை விரிவாகக் குறிக்கிறது. עָלָיו உடல்மேல் இடுவதைக் குறிக்கும் என்பதால், தமிழில் ‘அணிந்துகொள்ளவில்லை’ என்பது இயல்பான வினைத்தொடர்.
