translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு உடனடியாகப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘துக்கம் அனுசரித்தார்கள்’ என்பது உணர்ச்சியையும் வெளிப்படையான துக்கச் செயலையும் இணைக்கிறது; அரைப்புள்ளி இரு விளைவுகளின் தொடர்பைத் தெளிவாக்குகிறது.
