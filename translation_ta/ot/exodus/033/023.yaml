base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: ta
  text: பிறகு நான் என் கையை விலக்குவேன்; நீ என் முதுகைக் காண்பாய்[a]. ஆனால் என் முகம் காணப்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குப் பின்னால் இருப்பதை” / “என் பின்பகுதியை.” எபிரெயச் சொல் முதுகையோ பின்புற அம்சத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: பிறகு நான் ... விலக்குவேன்
  rationale: סור என்பதன் காரணவினை வடிவம் ‘விலக்கு/அகற்று’ என்று பொருள்படும். முன் வசனத்தின் நிகழ்வுத் தொடர்ச்சியையும் எதிர்காலச் செயற்பாட்டையும் ‘பிறகு’ மற்றும் ‘விலக்குவேன்’ இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: כַּפִּי
  choice: என் கை
  rationale: כַּף என்பது ‘உள்ளங்கை’ அல்லது ‘கை’ எனப் பொருள்படலாம். முந்தைய வசனத்தில் உள்ள மூடி பாதுகாக்கும் உருவகத்திற்கு நவீனத் தமிழில் ‘கை’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְרָאִיתָ
  choice: நீ ... காண்பாய்
  rationale: எதிர்காலச் சூழலில் தொடர்வரிசையாக வரும் இந்த வினை, அதன் விளைவான எதிர்கால நிகழ்வைச் சுட்டுகிறது.
- source_word: אֲחֹרָי
  choice: என் முதுகு
  rationale: இந்தச் சொல் பின்பக்கம் அல்லது பின்பகுதியைக் குறிக்கலாம். ‘என் முதுகு’ என்பது மூலத்தின் உடல்சார் உருவகத்தைத் தணிக்காமல் தெளிவாகத் தருகிறது; பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּפָנַי
  choice: ஆனால் என் முகம்
  rationale: וְ பொதுவாக ‘மற்றும்’ என்றாலும், இங்கு காணக்கூடியதற்கும் காணப்படாததற்கும் இடையிலான மாறுபாட்டால் ‘ஆனால்’ என்பது பொருத்தமானது. פָּנִים என்பதன் நேரடிப் பொருள் ‘முகம்.’
- source_word: לֹא יֵרָאוּ
  choice: காணப்படாது
  rationale: ראה என்பதன் நிஃபால் வடிவம் செயப்பாட்டு பொருளில் ‘காணப்படுதல்’ என வருகிறது. ஆகவே ‘நீ காணமாட்டாய்’ என்று செயப்படுவினையாக்காமல், எபிரெய இலக்கணத்தை ‘காணப்படாது’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுளைப் பற்றிய மனித உடல்சார் மொழி
  choice: ‘கை,’ ‘முதுகு,’ ‘முகம்’ ஆகிய நேரடியான உருவகங்களை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: உடல்சார் கருத்தைத் தவிர்க்க ‘பிரசன்னம்,’ ‘பின்னொளி’ போன்ற அருவமான சொற்களைப் பயன்படுத்துதல்
  rationale: எபிரெய உரையே இந்த மனித உடல்சார் உருவகங்களைப் பயன்படுத்துகிறது. அவற்றை மென்மைப்படுத்துவது அல்லது விளக்கமாக மாற்றுவது உரையில் நிலவும் இறை வெளிப்பாட்டின் பதற்றத்தைத் தேவையின்றித் தீர்த்துவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் இறைவாக்குக்குரிய கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘காணப்படாது’ என்ற செயப்பாட்டு வடிவம் மூலமொழியின் இலக்கணத்தையும் அதன் இறுக்கமான நிறைவையும் காக்கிறது.
