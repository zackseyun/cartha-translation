source:
  edition: WLC
  text: וּ/בַ/מֶּ֣ה יִוָּדַ֣ע אֵפ֗וֹא כִּֽי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲנִ֣י וְ/עַמֶּ֔/ךָ הֲ/ל֖וֹא בְּ/לֶכְתְּ/ךָ֣ עִמָּ֑/נוּ וְ/נִפְלֵ֨ינוּ֙ אֲנִ֣י וְ/עַמְּ/ךָ֔ מִ/כָּ֨ל הָ/עָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: ta
  text: அப்படியானால், நானும் உமது மக்களும் உமது பார்வையில் தயவு பெற்றிருக்கிறோம் என்பது எதனால் தெரியவரும்? நீர் எங்களோடு வருவதால்தானே? அப்போதுதானே நானும் உமது மக்களும் பூமியிலுள்ள எல்லா மக்களினங்களிலிருந்தும் தனித்துச் சிறப்பிக்கப்படுவோம்[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தனியாகப் பிரித்துக் காட்டப்படுவோம்” அல்லது “வேறுபடுத்தப்படுவோம்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், மற்றவர்களிலிருந்து வேறுபட்டவர்களாக அல்லது சிறப்புடையவர்களாகக் குறிக்கப்படுவதைக் கூறலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה
  choice: அப்படியானால்... எதனால்
  rationale: இணைப்பையும், எந்த வழியால் இது அறியப்படும் என்ற வினாவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִוָּדַע אֵפוֹא
  choice: தெரியவரும்
  rationale: ידע என்பதன் நிஃபால் வடிவிலுள்ள செயல்பாட்டு வாய்ப்பாட்டைப் பேணி, אֵפוֹא தரும் முடிவுரைத் தொனியை ‘அப்படியானால்’ என்பதோடு இணைக்கிறது.
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உமது பார்வையில் தயவு கிடைத்திருக்கிறது என்பது
  rationale: ‘கண்களில் தயவு கண்டேன்’ என்ற எபிரெய மொழிமரபின் உறவுசார் பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: אֲנִי וְעַמֶּךָ
  choice: எனக்கும் உமது மக்களுக்கும் / நானும் உமது மக்களும்
  rationale: மோசேயையும் மக்களையும் உரை வெளிப்படையாக இணைப்பதை இரு இடங்களிலும் தக்கவைக்கிறது.
- source_word: הֲלוֹא בְּלֶכְתְּךָ עִמָּנוּ
  choice: நீர் எங்களோடு வருவதால்தானே?
  rationale: ஒப்புதலை எதிர்பார்க்கும் வினாவையும், கடவுள் உடன் செல்வதே அடையாளம் காட்டும் வழி என்பதையும் காக்கிறது.
- source_word: וְנִפְלֵינוּ
  choice: தனித்துச் சிறப்பிக்கப்படுவோம்
  rationale: פלא என்பதன் நிஃபால் வடிவம் இங்கு மற்றவர்களிலிருந்து வேறுபட்டவர்களாகவும் குறிப்பிடத்தக்கவர்களாகவும் ஆக்கப்படுவதை உணர்த்துகிறது; இரு நுண்ணுணர்வுகளையும் இந்தச் சொற்றொடர் தக்கவைக்கிறது.
- source_word: מִכָּל הָעָם
  choice: மற்ற எல்லா மக்களினங்களிலிருந்தும்
  rationale: ஒருமை வடிவிலுள்ள עָם இங்கு தொகுப்புப் பொருளில் பல மக்களினங்களைக் குறிக்கிறது; ஒப்பிடப்படும் பிற மக்களை ‘மற்ற’ என்பது தமிழில் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: பூமியின் மேற்பரப்பிலுள்ள
  rationale: உலகில் வாழும் எல்லா மக்களையும் குறிக்கும் எபிரெய வழக்கைச் சுருக்கமாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் தனித்துவத்தின் அடிப்படை
  choice: கடவுள் தமது மக்களோடு வருவதே அவர்களை மற்ற மக்களினங்களிலிருந்து தனித்துச் சிறப்பிப்பதாக உரை கூறுகிறது.
  alternative: சட்டம், நிலம் அல்லது இன அடையாளமே அவர்களின் முதன்மையான தனித்துவ அடிப்படை என்று மொழிபெயர்ப்பில் விளக்குவது.
  rationale: வசனம் தனித்துவத்தை நேரடியாகக் கடவுளின் உடனிருப்போடு இணைக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மோசே கடவுளிடம் பேசுவதற்கேற்ற மரியாதை ஒருமையான ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. தொடர்ச்சியான இரு வினாக்கள் மூலத்தின் வாதமுறைத் தொனியையும் எதிர்பார்க்கப்படும் ஒப்புதலையும் தக்கவைக்கின்றன.
