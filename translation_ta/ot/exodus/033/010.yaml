base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: ta
  text: மக்கள் அனைவரும் மேகத்தூண் கூடாரத்தின் நுழைவிடத்தில் நிற்பதைக் கண்டபோது, அனைவரும் எழுந்தார்கள்; அவரவர் தங்கள் கூடாரத்தின் நுழைவிடத்தில் பணிந்து வழிபட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குனிந்து வணங்கினார்கள்” அல்லது “தாழ்ந்து வணங்கினார்கள்.” எபிரெய வினை மரியாதையுடன் உடலைத் தாழ்த்தும் செயலைக் குறிக்கிறது; அது பல இடங்களில் வழிபாட்டுச் செயலாக அமைகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה כָל הָעָם
  choice: மக்கள் அனைவரும் ... கண்டபோது
  rationale: வாவ் தொடரமைப்பு அடுத்த செயல்களுடன் காலத் தொடர்பை உருவாக்குவதால், இயல்பான தமிழ் நடையில் ‘கண்டபோது’ என வழங்கப்பட்டது; ‘இஸ்ரவேல் மக்கள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: עַמּוּד הֶעָנָן
  choice: மேகத்தூண்
  rationale: மேகத்தால் தோன்றிய தூண் என்ற தெளிவான காட்சிப் படிமத்தைச் சுருக்கமாகவும் வழக்காகவும் தக்கவைக்கிறது.
- source_word: עֹמֵד
  choice: நிற்பதை
  rationale: பங்கேற்பு வினைச்சொல் தூணின் நிலையை விவரிக்கிறது; உயிரற்ற பொருளுக்கும் தமிழில் இயல்பாகப் பயன்படுத்தக்கூடிய நேரடி இணை இது.
- source_word: פֶּתַח הָאֹהֶל
  choice: கூடாரத்தின் நுழைவிடத்தில்
  rationale: פתח என்பது திறப்பு அல்லது நுழைவிடத்தைக் குறிக்கிறது. சூழலில் இது சந்திப்புக் கூடாரமானாலும், இவ்வசனத்தில் இல்லாத விரிவாக்கத்தைச் சேர்க்காமல் ‘கூடாரம்’ தக்கவைக்கப்பட்டது.
- source_word: וְקָם
  choice: எழுந்து நின்று
  rationale: காலூன்றி நிற்பதற்காக எழுவதைக் குறிப்பதால், நவீன தமிழில் பொருள் தெளிவாகத் தெரிவிக்கும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְהִשְׁתַּחֲווּ
  choice: பணிந்து வழிபட்டார்கள்
  rationale: எபிரெய வினை உடலைத் தாழ்த்தும் செய்கையையும் தேவனுக்குரிய வணக்கத்தையும் ஒருங்கே சுட்டுகிறது; தமிழ் முதன்மை உரையில் இரு பரிமாணங்களையும் தக்கவைக்க இச்சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: אִישׁ פֶּתַח אָהֳלוֹ
  choice: அவரவர் தங்கள் கூடாரத்தின் நுழைவிடத்தில்
  rationale: பகிர்ந்தளிக்கும் ஒருமையை இயல்பான தமிழில் ‘அவரவர்’ தக்கவைக்கிறது. ‘தங்கள்’ என்பது ஒவ்வொருவருடைய சொந்தக் கூடாரத்தைக் குறிக்கும் மரியாதை/இயைபுடைய பிரதிப்பெயர்.
theological_decisions:
- issue: கர்த்தருடைய வெளிப்பட்ட பிரசன்னத்தின் அடையாளத்துக்கு மக்கள் அளித்த மறுமொழி
  choice: பணிந்து வழிபட்டார்கள்
  alternative: குனிந்து வணங்கினார்கள் / சாஷ்டாங்கமாக விழுந்தார்கள்
  rationale: וְהִשְׁתַּחֲווּ உடல் தாழ்த்துதலை அடிப்படையாகக் கொண்டாலும், இச்சூழலில் அது தெய்வீகப் பிரசன்னத்திற்கான வணக்கமாகச் செயல்படுகிறது. ‘பணிந்து வழிபட்டார்கள்’ என்பது உடல் செய்கையையும் இறையியல் வலிமையையும் ஒன்றை மற்றொன்றால் மறைக்காமல் வெளிப்படுத்துகிறது; மாற்றுச் சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான விவிலிய நடையைப் பேணுகிறது. ‘அவரவர்’ மூலம் மூலத்தின் பகிர்ந்தளிக்கும் அமைப்பு இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு தொடர்புடைய வினைத்தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
