  source_fidelity: திருத்தம் தேவை. மூலத்தின் אִישׁ (‘ஒரு மனிதன்’) என்பதை வரைவு பாலற்ற ‘ஒருவர்’ எனத் தளர்த்துகிறது. மேலும், இந்தக் கடந்தகாலக் கதைச் சூழலில் வழக்கமாக நிகழ்ந்த செயலைத் தமிழின் எதிர்கால வடிவங்கள் சற்றே எதிர்கால நிகழ்வாகக் கேட்கச் செய்யலாம்; ‘பேசிவந்தார் / திரும்பிவந்தார் / இருந்தான்’ வடிவங்கள் மீள்நிகழ்வையும் கதைப் பின்னணியையும் இயல்பாகக் காக்கின்றன.
  naturalness: ‘முகமுகமாக’ நவீனத் தமிழில் புரியக்கூடியது. வெளிப்படையான ‘மோசேயின் உதவியாளன்’ என்ற உடைமைத் தொடர்பும், ‘கூடாரத்தின் உள்ளிருந்து வெளியேறாமல்’ என்ற வடிவமும் தெளிவாகவும் இயல்பாகவும் உள்ளன.
