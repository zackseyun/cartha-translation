  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: ta
  text: யாவே மோசேயோடு முகமுகமாகப் பேசிவந்தார்; ஒரு மனிதன் தன் நண்பனோடு பேசுவதுபோலப் பேசினார்.[a] அதன் பின் மோசே பாளயத்திற்குத் திரும்பிவந்தார். ஆனால் மோசேயின் உதவியாளனான, நூனின் மகன் யோசுவா என்ற இளைஞன், கூடாரத்தின் உள்ளிருந்து வெளியேறாமல் இருந்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நேரடியாக” / “தனிப்பட்ட முறையில்.” “முகமுகமாக” என்ற எபிரெய மொழிமரபு வழக்கத்திற்கு மாறான நேரடியான சந்திப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, சந்திப்புக் கூடாரம்.
    reason: cross_reference
lexical_decisions:
- source_word: וְדִבֶּר
  choice: பேசுவார்
  rationale: கூடாரத்தில் வழக்கமாக நிகழ்ந்த செயலைச் சூழல் குறிக்கிறது. தமிழின் எதிர்கால வடிவம் இங்கு வழக்கமாகத் தொடர்ந்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: פָּנִים אֶל־פָּנִים
  choice: முகமுகமாக
  rationale: எபிரெய மொழிமரபைத் தக்கவைத்து, மிகவும் நேரடியான தனிப்பட்ட உரையாடலைக் குறிக்கிறது; கடவுளை நேரடியாகக் கண்டார் என்று உரை கூறுகிறதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל־רֵעֵהוּ
  choice: ஒருவர் தன் நண்பனோடு பேசுவதுபோல
  rationale: ஒப்புமையின் இயல்பையும் உறவின் நெருக்கத்தையும் நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: וְשָׁב
  choice: பின்னர் மோசே ... திரும்புவார்
  rationale: முந்தைய வினையைப் போலவே வழக்கமாக நடந்த செயலைக் குறிக்கிறது. தெளிவுக்காக எபிரெயில் மறைந்துள்ள எழுவாய் ‘மோசே’ என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וּמְשָׁרְתוֹ
  choice: அவருடைய உதவியாளன்
  rationale: யோசுவாவின் துணைசெய்யும் பணியைத் தெரிவிக்கிறது; வீட்டடிமை என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: יְהוֹשֻׁעַ בִּן־נוּן
  choice: நூனின் மகன் யோசுவா
  rationale: தமிழில் இயல்பான தந்தைவழி அடையாளச் சொல்லமைப்பைப் பயன்படுத்துகிறது.
- source_word: נַעַר
  choice: இளைஞன்
  rationale: வயதில் இளைய ஆணை இயல்பாகக் குறிக்கிறது; ஏற்கெனவே கூறப்பட்ட உதவியாளர் என்ற பணிப்பொருளை மீண்டும் சேர்க்கவில்லை.
- source_word: לֹא יָמִישׁ
  choice: விலகாமல் இருப்பான்
  rationale: அங்கிருந்து அகலாமலும் இடத்தை விட்டுச் செல்லாமலும் இருந்த வழக்கமான செயலை வெளிப்படுத்துகிறது.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: கூடாரத்தின் உள்ளிருந்து
  rationale: ‘கூடாரத்தின் நடுவிலிருந்து’ என்ற சொல்லுக்குச் சொல் வடிவத்தைவிட இயல்பான தமிழில் எபிரெயின் ‘உள்ளிருந்து’ என்ற இடப்பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: யாவே மோசேயோடு ‘முகமுகமாக’ பேசியதாகக் கூறும் மனித உருவக மொழி
  choice: ‘முகமுகமாக’ என்ற மொழிமரபை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘நேரடியாக’ அல்லது ‘தனிப்பட்ட முறையில்’ என்று பொருள்வழியாக மொழிபெயர்த்தல்
  rationale: இந்தச் சொற்றொடர் இறை–மனிதத் தொடர்பின் நேரடித்தன்மையையும் நெருக்கத்தையும் வலியுறுத்துகிறது. கடவுளைக் காண்பது பற்றிய பிற வசனங்களோடு தோன்றும் பதற்றத்தை மொழிபெயர்ப்பில் மறைத்தோ தீர்த்தோ விடாமல், மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் வடிவமைக்கப்பட்டது. தொடர்ச்சியாக நடந்த வழக்கமான செயல்களை ‘பேசுவார்’, ‘திரும்புவார்’, ‘இருப்பான்’ என்ற வடிவங்கள் வெளிப்படுத்துகின்றன. ஆங்கில ஆலோசனை உரையில் [b] குறி ‘இளைஞன்’ என்பதற்குப் பின் இருந்தாலும், அதன் குறிப்புரை கூடாரத்தையே விளக்குவதால் தமிழில் ‘கூடாரம்’ என்பதற்குப் பின் பொருத்தப்பட்டுள்ளது.
