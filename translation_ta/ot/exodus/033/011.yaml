revisions:
- from: ஒருவர் தன் நண்பனோடு பேசுவதுபோல, யாவே மோசேயோடு முகமுகமாகப் பேசுவார்.[a] பின்னர் மோசே பாளயத்திற்குத் திரும்புவார். ஆனால் அவருடைய உதவியாளனான நூனின் மகன் யோசுவா என்ற இளைஞன், கூடாரத்தின்[b] உள்ளிருந்து விலகாமல் இருப்பான்.
  to: யாவே மோசேயோடு முகமுகமாகப் பேசிவந்தார்; ஒரு மனிதன் தன் நண்பனோடு பேசுவதுபோலப் பேசினார்.[a] அதன் பின் மோசே பாளயத்திற்குத் திரும்பிவந்தார். ஆனால் மோசேயின் உதவியாளனான, நூனின் மகன் யோசுவா என்ற இளைஞன், கூடாரத்தின் உள்ளிருந்து வெளியேறாமல் இருந்தான்.[b]
  rationale: மூல எபிரெயத்தின் ஆண்பால் ஒப்புமையான אִישׁ-ஐ ‘ஒரு மனிதன்’ என மீட்டமைத்துள்ளேன். மீண்டும் மீண்டும் நடந்த செயலைக் குறிக்கும் சூழலை நவீனத் தமிழில் கடந்தகாலத் தொடர்வடிவங்கள் மூலம் வெளிப்படுத்தியுள்ளேன்; இது எதிர்காலக் காலப்பொருளைத் தவிர்க்கிறது. ‘முகமுகமாக’ என்ற மூல மொழிமரபு தக்கவைக்கப்பட்டுள்ளது; அதனால் அதன் இறையியல் பதற்றம் தீர்க்கப்படவோ விளக்கமாக மாற்றப்படவோ இல்லை. [b] குறி அது விளக்கும் ‘கூடாரம்’ சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
