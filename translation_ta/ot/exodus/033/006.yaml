  text: וַ/יִּֽתְנַצְּל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת עֶדְיָ֖/ם מֵ/הַ֥ר חוֹרֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/006.yaml
  text: So the sons of Israel stripped themselves of their ornaments from Mount Horeb onward[a].
translation:
  language: ta
  text: ஆகவே, இஸ்ரவேல் மக்கள் ஓரேபு மலையிலிருந்து தொடங்கி தங்கள் அணிகலன்களைக் கழற்றிவிட்டார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் மக்கள் ஓரேபு மலையில் தங்கள் அணிகலன்களைக் கழற்றிவிட்டார்கள்.” எபிரெயச் சொற்றொடர் நிகழ்ந்த இடத்தையோ, அவர்கள் அணிகலன்களை அணிவதை நிறுத்திய தொடக்கப் புள்ளியையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: கழற்றிவிட்டார்கள்
  rationale: இங்குள்ள התפעל வடிவம் ஒருவர் தம்மிடமிருந்து அணிகலன்களை அகற்றுவதைக் குறிக்கிறது. தமிழில் ‘கழற்றிவிட்டார்கள்’ என்பது அந்தத் தன்னிலைச் செயலும் திட்டவட்டமான அகற்றுதலும் இயல்பாக வெளிப்படச் செய்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என இருந்தாலும், இச்சூழலில் அது இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ என்பது பொருளைத் துல்லியமாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עֶדְיָם
  choice: தங்கள் அணிகலன்களை
  rationale: עֲדִי என்பது அணியும் அலங்காரப் பொருட்களைப் பொதுவாகக் குறிக்கிறது. ‘அணிகலன்கள்’ என்பது பொருளின் வகையையோ உலோகத்தையோ தேவையின்றிக் குறுக்காமல் அந்தப் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: מֵהַר חוֹרֵב
  choice: ஓரேபு மலையிலிருந்து
  rationale: מִן என்ற முன்னிடைச்சொல்லின் அடிப்படை ‘இருந்து’ என்ற பொருளைப் பாதுகாக்கிறது; இது ஓரேபு மலையைத் தொடக்கப் புள்ளியாகக் குறிக்கலாம். இடத்தைக் குறிக்கும் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொற்படி வடிவத்திற்குப் பதிலாக பொதுவாசகர்களுக்கு இயல்பான ‘இஸ்ரவேல் மக்கள்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் இடம்/தொடக்கப் புள்ளி இருபொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
