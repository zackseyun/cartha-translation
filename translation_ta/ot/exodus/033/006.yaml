revisions:
- from: ஆகவே, இஸ்ரவேல் மக்கள் ஓரேபு மலையிலிருந்து தங்கள் அணிகலன்களைக் கழற்றிவிட்டார்கள்[a].
  to: ஆகவே, இஸ்ரவேல் மக்கள் ஓரேபு மலையிலிருந்து தொடங்கி தங்கள் அணிகலன்களைக் கழற்றிவிட்டார்கள்[a].
  rationale: The revision adds “தொடங்கி” to convey the main reading, ‘from Mount Horeb onward,’ rather than an unqualified spatial ‘from Mount Horeb.’ The alternate location interpretation is retained in the anchored footnote, preserving the source ambiguity.
