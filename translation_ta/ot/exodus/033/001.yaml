  source_fidelity: மூலத்தின் முக்கியப் பொருள்கள்—யாவே என்ற பெயர், எகிப்திலிருந்து மோசே வெளியே கொண்டுவந்த மக்கள், மூதாதையருக்குச் செய்யப்பட்ட சத்தியம், மற்றும் ‘சந்ததி’—பாதுகாக்கப்பட்டுள்ளன. ஆனால் எபிரெயத்தில் மோசேயை நோக்கிய கட்டளை ஒருமையில் உள்ளது; வரைவில் உள்ள பன்மைக் கட்டளை (‘செல்லுங்கள்’) அந்த முகவரியை மாற்றுகிறது.
  naturalness: நடை பொதுவாக நவீனத் தமிழுக்கு இயல்பானது. ஆயினும் ‘நீயும் ... மக்களும் ... செல்லுங்கள்’ என்பது பொருளில் புரிந்தாலும், ஒருமை முகவரியையும் கூட்டு எழுவாயையும் ஒரே நேரத்தில் கையாள்வதால் சற்றே அமைவின்மையாக உள்ளது. ‘மக்களோடு ... செல்’ என்பது இயல்பாகவும் கட்டளையின் ஒருமையையும் தெளிவாகவும் தக்கவைக்கிறது.
