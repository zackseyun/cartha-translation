source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: ta
  text: பின்பு யாவே[a] மோசேயிடம், “நீ எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்த மக்களோடு இங்கிருந்து புறப்பட்டு மேலே செல். ‘உன் சந்ததிக்கு[b] அதைத் தருவேன்’ என்று ஆபிரகாமுக்கும் ஈசாக்குக்கும் யாக்கோபுக்கும் நான் சத்தியம் செய்த நாட்டிற்குச் செல்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘உன் விதைக்கு.’ எபிரெயச் சொல் ஒருமை வடிவிலுள்ள கூட்டுப்பெயராக இருந்து சந்ததியையோ வழித்தோன்றல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... கூறினார்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுக்கிறது; நேரடிப் பேச்சை அறிமுகப்படுத்தும் דִּבֵּר என்பதற்கு இச்சூழலில் இயல்பான தமிழ் ‘கூறினார்’.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பட்ட பெயரைக் குறிக்கும் நான்கு எபிரெய மெய்யெழுத்துகள்; ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: இங்கிருந்து புறப்பட்டு மேலே செல்லுங்கள்
  rationale: இரண்டு கட்டளைகளிலும் இடத்தைவிட்டுப் புறப்படுதலும் மேல்நோக்கிச் செல்லுதலும் அடங்கியுள்ளன; இரு கூறுகளும் தமிழில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: நீ வெளியே கொண்டுவந்த
  rationale: ஹிஃபில் வடிவம் ‘மேலே கொண்டுவருதல்/வெளியே அழைத்துவருதல்’ எனப் பொருள்படும்; எகிப்திலிருந்து வெளியேற்றிய நிகழ்வைத் தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: נִשְׁבַּעְתִּי
  choice: நான் சத்தியம் செய்து கூறிய
  rationale: வாக்குறுதியின் உறுதிமொழித் தன்மையை ‘சத்தியம் செய்து’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְזַרְעֲךָ
  choice: உன் சந்ததிக்கு
  rationale: זֶרַע என்பது வடிவில் ஒருமையாக இருந்தாலும் கூட்டுப் பொருளில் பின்வரும் வழித்தோன்றல்களைக் குறிக்கலாம்; ‘சந்ததி’ அந்தத் திறந்த கூட்டுப் பொருளை இயல்பாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்ல, உடன்படிக்கைக்குரிய தனிப்பட்ட இறைப் பெயரே உள்ளது; ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து, மரபுவழிப் பட்டத்தை அடிக்குறிப்பில் தருகிறது.
- issue: மோசே மக்களை வெளியே கொண்டுவந்தார் என்ற உரையின் நேரடி கூறு
  choice: ‘நீ வெளியே கொண்டுவந்த மக்கள்’ என அப்படியே வைத்தல்
  alternative: ‘நான் வெளியே கொண்டுவந்த மக்கள்’ என இறையியல் அடிப்படையில் ஒத்திசைத்தல்
  rationale: இவ்வசனத்தின் பதற்றமிக்க நேரடி சொற்றொடர் மோசேயையே எழுவாயாகக் கொண்டுள்ளது; வேறு வசனங்களுடன் ஒத்திசைக்காமல் மூலத்தின் சொற்பொருள் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகிய ஒவ்வொருவருக்கும் முன் வரும் எபிரெய முன்னிடைச்சொல்லின் முறையான ஓசை தமிழிலும் ‘-க்கும்’ எனத் திரும்ப வருகிறது. கூட்டு எழுவாயால் தமிழில் பன்மைக் கட்டளை இயல்பாகப் பயன்படுத்தப்பட்டாலும், கட்டளை முதன்மையாக மோசேயிடம் உரைக்கப்படுவது சூழலில் தெளிவாக உள்ளது.
