source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/עֲבֹ֣ר כְּבֹדִ֔/י וְ/שַׂמְתִּ֖י/ךָ בְּ/נִקְרַ֣ת הַ/צּ֑וּר וְ/שַׂכֹּתִ֥י כַפִּ֛/י עָלֶ֖י/ךָ עַד עָבְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: ta
  text: என் மகிமை கடந்துசெல்லும்போது, நான் உன்னைப் பாறையின் ஒரு பிளவில் வைப்பேன்; நான் கடந்துசெல்லும்வரை என் கையால் உன்னை மூடுவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: கடந்துசெல்லும்போது
  rationale: היה உடன் வரும் ב + வினைப்பெயர் அமைப்பு, அடுத்து நிகழ்வதற்கான காலச் சூழலைக் குறிக்கிறது. தமிழில் தனி வாக்கியமாக்காமல் ‘கடந்துசெல்லும்போது’ என்று மொழிபெயர்ப்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: כְּבֹדִי
  choice: என் மகிமை
  rationale: இறைவன் தம்மை வெளிப்படுத்தும் இந்தத் தோற்றச் சூழலில் כבוד என்பது வெறும் கௌரவத்தை அல்ல, வெளிப்படும் தெய்வீக மகிமையைக் குறிக்கிறது.
- source_word: וְשַׂמְתִּיךָ
  choice: நான் உன்னை ... வைத்து
  rationale: שׂים என்பதன் நேரடியான ‘வை/இடம் செய்’ என்ற பொருளை நவீன தமிழில் இயல்பாகக் காக்கிறது.
- source_word: בְּנִקְרַת הַצּוּר
  choice: பாறையின் ஒரு பிளவில்
  rationale: נִקְרָה என்பது பாறையிலுள்ள பிளவு அல்லது இடுக்கைக் குறிக்கிறது. ‘பாறையின் ஒரு பிளவில்’ என்பது இயல்பான தமிழாக இருந்து, குறிப்பிட்ட பாறையையும் அதிலுள்ள ஓர் இடத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְשַׂכֹּתִי
  choice: மூடுவேன்
  rationale: סכך என்பதில் மூடுதல், மறைத்துக் காத்தல் ஆகிய நுண்பொருள்கள் உள்ளன. ‘என் கையால்’ என்ற உருவகத்துடன் ‘மூடுவேன்’ நேரடியாகவும் இயல்பாகவும் பொருந்துகிறது.
- source_word: כַפִּי
  choice: என் கையால்
  rationale: כף குறிப்பாக உள்ளங்கையைக் குறிக்கக்கூடியதாயினும், இங்குள்ள இறைவனை மனித உருவில் சித்தரிக்கும் மொழிநடைக்கு ‘என் கை’ என்பதே இயல்பான தமிழ். கருவிப் பொருளை ‘-ஆல்’ தெளிவாக்குகிறது.
- source_word: עַד עָבְרִי
  choice: நான் கடந்துசெல்லும்வரை
  rationale: עַד உடன் வரும் முதல் நபர் வினைப்பெயர், மூடிவைத்திருக்கும் செயலின் இறுதி எல்லையைக் குறிக்கிறது. தமிழ் ‘-வரை’ அமைப்பு இதை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைவனை மனித உருவில் சித்தரிக்கும் ‘என் கை’ என்ற மொழி
  choice: ‘என் கையால்’ என்ற மூலத்தின் நேரடியான உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘என் பாதுகாப்பால்’ அல்லது ‘என் வல்லமையால்’
  rationale: எபிரெய உரை உடல் சார்ந்த உருவகத்தை நேரடியாகப் பயன்படுத்துகிறது. அதை கருத்தியல் விளக்கமாக மாற்றாமல் வைத்திருப்பது காட்சியின் வலிமையையும் உரையிலுள்ள இறையியல் பதற்றத்தையும் காக்கிறது; இதனால் இறைவனுக்குச் சரீரம் உண்டு என்ற கூடுதல் கோட்பாட்டு முடிவும் திணிக்கப்படுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மகிமை,’ ‘பாறை,’ ‘கை’ ஆகிய மூலப்படிமங்கள் விளக்கவுரையாக மாற்றப்படாமல் தக்கவைக்கப்பட்டுள்ளன; [a] குறியீடு முதன்மை உரையிலேயே இடம்பெற்றுள்ளது.
