base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/015.yaml
  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: ta
  text: அப்போது அவர் அவரிடம், “உமது பிரசன்னம்[a] எங்களோடு வராவிட்டால், எங்களை இங்கிருந்து புறப்படச் செய்யாதீர்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடியாக, “உமது முகம்.” எபிரெயத்தில் “முகம்” என்பது ஒருவரது தனிப்பட்ட பிரசன்னத்தைக் குறிக்க அடிக்கடி பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது அவர் ... என்றார்
  rationale: வாவ்-தொடர்நிலை கதையை முன்னெடுத்துச் செல்கிறது; நவீனத் தமிழில் ‘அப்போது’ அதன் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵלָיו
  choice: அவரிடம்
  rationale: முன்னர் குறிப்பிடப்பட்டவரை நோக்கிச் சொல்லப்பட்ட பேச்சை இயல்பான தமிழில் குறிக்கிறது.
- source_word: אִם אֵין ... הֹלְכִים
  choice: '... வராவிட்டால்'
  rationale: எதிர்மறை நிபந்தனையையும் உடன்செல்லும் செயற்பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: פָּנֶיךָ
  choice: உமது பிரசன்னம்
  rationale: சொல்லடியாக ‘உமது முகம்’ என்றாலும், இச்சூழலில் தேவன் தனிப்பட்ட முறையில் உடனிருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். சொல்லடியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תַּעֲלֵנוּ
  choice: எங்களை ... புறப்படச் செய்யாதீர்
  rationale: ஹிஃபில் வடிவின் ‘மேலே செல்லச் செய்/கொண்டுபோ’ என்ற காரணவினைப் பொருளை, இவ்விடத்திலிருந்து பயணத்தைத் தொடங்கச் செய்வது என்ற சூழலில் இயல்பாகத் தருகிறது.
- source_word: מִזֶּה
  choice: இங்கிருந்து
  rationale: தற்போதைய இடத்தைக் குறிக்கும் முன்னொட்டு சேர்ந்த சுட்டுச்சொல்லின் இயல்பான தமிழ் இணை.
theological_decisions:
- issue: தேவனைச் சுட்டும் פָּנֶיךָ என்பதன் மொழிபெயர்ப்பு
  choice: உமது பிரசன்னம்
  alternative: உமது முகம்
  rationale: எபிரெயத்தில் ‘முகம்’ என்ற உருவகம் இருந்தாலும், இங்கு மோசே தேவன் இஸ்ரவேலரோடு தனிப்பட்ட முறையில் உடன்செல்வதைப் பற்றிப் பேசுகிறார். ‘பிரசன்னம்’ சூழற்பொருளைத் தெளிவாகத் தருகிறது; அடிப்படை உருவகம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. தேவனை நோக்கிய உரையாதலால் ‘உமது’, ‘செய்யாதீர்’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; அரிய அல்லது தேவையற்ற பழஞ்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
