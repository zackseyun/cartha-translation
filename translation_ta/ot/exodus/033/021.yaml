  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: ta
  text: ஆண்டவர், “இதோ, என் அருகில் ஓர் இடம் இருக்கிறது; நீ அந்தப் பாறையின்மேல் நின்றுகொள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: இறைநாமத்தைத் தமிழில் வழக்கமாகக் குறிக்கும் மரியாதைமிக்க பதிப்பு மரபைத் தொடர்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரேயச் சொல்லின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: מָקוֹם אִתִּי
  choice: என் அருகில் ஓர் இடம்
  rationale: אִתִּי என்பதன் ‘என்னுடன்/என் பக்கத்தில்’ என்ற இடம்சார் பொருளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; இடம் ஆண்டவருக்குச் சொந்தமானது என்று கூடுதலாகக் கூறவில்லை.
- source_word: וְנִצַּבְתָּ
  choice: நின்றுகொள்
  rationale: இணைக்கப்பட்ட நிறைவேற்ற வடிவம் இங்கு சூழலால் கட்டளையாகச் செயல்படுவதைக் காட்டுகிறது.
- source_word: עַל הַצּוּר
  choice: அந்தப் பாறையின்மேல்
  rationale: குறிப்பிட்ட பாறையையும் עַל என்பதன் மேற்பரப்புச் சார்ந்த பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: מָקוֹם אִתִּי என்ற சொற்றொடரில் கடவுளுக்கும் இடத்திற்கும் உள்ள உறவு
  choice: என் அருகில் ஓர் இடம்
  alternative: என்னுடன் ஓர் இடம் / என்னிடத்தில் ஓர் இடம்
  rationale: இடம்சார் கருத்தைத் தெளிவாக்கினாலும், கடவுளின் இயல்பு அல்லது எங்குமிருப்பு பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை வசனத்திற்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரை. மேற்கோளுக்குள் நேரடியான கட்டளைப் பாங்கு பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற விளக்க விரிவாக்கம் தவிர்க்கப்பட்டுள்ளது.
