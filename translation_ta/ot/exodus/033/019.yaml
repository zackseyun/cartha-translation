  terminology: ‘யாவே’ என்பது பெயரைப் பட்டத்தால் மாற்றாமல் தரும் பொருத்தமான ஒலிபெயர்ப்பு. ‘அருள்புரி’ மற்றும் ‘இரக்கம் காட்டு’ ஆகியவை חנן மற்றும் רחם ஆகிய வேறுபட்ட வினைச்சொற்களைத் தெளிவாக வேறுபடுத்துகின்றன. அடிக்குறிப்பில் ‘மனமிரங்கு’ என்பது רחם-க்கு ஏற்ற செல்லத்தக்க மாற்றாகும்.
