  source_fidelity: எபிரேய மூலத்தின் வலியுறுத்தப்பட்ட அֲנִי-யை ‘நானே’ என்றும், ஹிஃபில் אַעֲבִיר-இன் காரணவினை நுணுக்கத்தை ‘கடந்துபோகச் செய்வேன்’ என்றும் துல்லியமாகக் காக்கிறது. ‘என் நன்மை முழுவதையும்’, இருமுறை வரும் ‘உன் முன்னே’, யாவே என்ற பெயரின் அறிவிப்பு, அருள் மற்றும் இரக்கத்தின் இணையான மீளுருவாக்கங்கள் அனைத்தும் மூலத்துக்கு உண்மையாக உள்ளன. எபிரேய உரையில் உள்ள இறையியல் வலியுறுத்தலைத் தாண்டி எந்தக் கோட்பாட்டுத் தீர்மானமும் புகுத்தப்படவில்லை.
