  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: ta
  text: 'அவர் கூறினார்: “நானே என் நன்மை முழுவதையும் உன் முன்னே கடந்துபோகச் செய்வேன்; உன் முன்னே ‘யாவே’ என்னும் பெயரை அறிவிப்பேன். யாருக்கு அருள்புரிவேனோ அவருக்கு அருள்புரிவேன்; யார்மீது இரக்கம் காட்டுவேனோ அவர்மீது இரக்கம் காட்டுவேன்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யார்மீது மனமிரங்குவேனோ அவர்மீது மனமிரங்குவேன்.”
    reason: רחם என்பதற்கான செல்லத்தக்க ‘மனமிரங்கு/பரிவுகொள்’ என்ற சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: אֲנִי
  choice: நானே
  rationale: வினைச்சொல்லிலேயே எழுவாய் அடங்கியிருந்தும் தனிப்பட்ட சுட்டுப்பெயர் வெளிப்படையாக வந்திருப்பதால் உள்ள வலியுறுத்தலை, தனியுரிமையை மிகைப்படுத்தாமல் ‘நானே’ எனக் காட்டுகிறது.
- source_word: אַעֲבִיר
  choice: கடந்துபோகச் செய்வேன்
  rationale: עבר என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைப் பாதுகாத்து, இயல்பான தமிழில் தருகிறது.
- source_word: כָּל טוּבִי
  choice: என் நன்மை முழுவதையும்
  rationale: இறைவனின் தன்னை வெளிப்படுத்துதலும் இரக்கமும் இடம்பெறும் சூழலில் טוּב குறிக்கும் நற்குணத்தையும் நன்மை செய்வதையும் தக்கவைக்கிறது; அதை அழகு அல்லது கொடை என்று மட்டும் குறுக்கவில்லை.
- source_word: עַל־פָּנֶיךָ
  choice: உன் முன்னே
  rationale: முகத்திற்கு முன்பாக என்ற எபிரேய இடவியல் சொல்லாட்சியை மரக்கட்டையான நேரடி மொழிபெயர்ப்பின்றி இயல்பாகத் தருகிறது.
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: ‘யாவே’ என்னும் பெயரை அறிவிப்பேன்
  rationale: இச்சூழலில் קרא בשם என்பது பெயரை அழைத்துப் பிரார்த்திப்பதைவிட இறைப் பெயரையும் அதனோடு தொடர்புடைய தன்மையையும் பிரகடனப்படுத்துவதைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: לְפָנֶיךָ
  choice: உன் முன்னே
  rationale: மோசேயின் முன்னிலையில் நிகழும் அறிவிப்பை இடவியல் தெளிவுடன் காட்டி, வசனத்திலுள்ள மீளுருவாக்கத்தையும் இயன்றவரை காக்கிறது.
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: யாருக்கு அருள்புரிவேனோ அவருக்கு அருள்புரிவேன்
  rationale: ஒரே எபிரேய வேர்ச்சொல்லின் வலியுறுத்தும் மீளுருவாக்கத்தை ஒரே தமிழ் வினையால் பாதுகாக்கிறது.
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: யார்மீது இரக்கம் காட்டுவேனோ அவர்மீது இரக்கம் காட்டுவேன்
  rationale: רחם குறிக்கும் இரக்கம் அல்லது பரிவை இயல்பான தமிழில் தருவதோடு, மூலத்தின் வலியுறுத்தும் மீளுருவாக்கத்தையும் காக்கிறது.
theological_decisions:
- issue: அருளையும் இரக்கத்தையும் குறித்த இறைவனின் தற்சார்பான முதல் நபர் அறிவிப்பு
  choice: ‘அருள்புரிவேனோ... அருள்புரிவேன்; இரக்கம் காட்டுவேனோ... இரக்கம் காட்டுவேன்’ என்ற மீளுருவாக்கம் அப்படியே தக்கவைக்கப்பட்டது.
  alternative: இதை இறை அன்பைப் பற்றிய பொதுவான கொள்கையாகச் சுருக்கிப் பரிந்துரைப்பது, அல்லது பிற்கால நிர்ணயவாதக் கோட்பாட்டின் சொற்களை இதில் புகுத்துவது.
  rationale: எபிரேய உரை அருளையும் இரக்கத்தையும் வழங்குவதில் இறைவனின் சுதந்திரத்தை வலியுறுத்துகிறது. பிற்கால இறையியல் விவாதங்களைத் தீர்மானிக்காமல், உரையிலுள்ள பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் இறை அறிவிப்புக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. காரணவினை, முதல் நபர் வலியுறுத்தல், இணையான இரு மீளுருவாக்கங்கள் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
