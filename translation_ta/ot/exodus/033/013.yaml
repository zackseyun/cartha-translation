base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: ta
  text: ஆகவே, இப்போது உமது பார்வையில் எனக்குத் தயவு கிடைத்திருக்குமானால், தயவுசெய்து உமது வழிகளை[a] எனக்குத் தெரிவியும்; அப்பொழுது நான் உம்மை அறிந்துகொண்டு, உமது பார்வையில் தயவு பெறுவேன். மேலும், இந்தத் தேசம் உமது மக்களே[c] என்பதை கவனத்தில் கொள்ளும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘உமது வழிகள்’ என்பது பன்மையில் உள்ளது. அது கடவுள் செயல்படும் அல்லது நடத்தும் முறைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘பாரும்.’ இங்கே அதன் பொருள் ‘கவனத்தில் கொள்ளும்’ அல்லது ‘கருத்தில் கொள்ளும்’ என்பதாகும்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயம் ‘தேசம்’ என்றும் ‘உமது மக்கள்’ என்றும் இரு வேறு சொற்களைப் பயன்படுத்துகிறது; மொழிபெயர்ப்பு இரண்டையும் பாதுகாக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: முந்தைய உரையிலிருந்து வரும் முடிவையும் தற்போதைய வேண்டுகோளுக்கான மாற்றத்தையும் சேர்த்துக் காட்டுகிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: வேண்டுதலின் பணிவான தொனியை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உமது பார்வையில் எனக்குத் தயவு கிடைத்திருக்குமானால்
  rationale: ‘உமது கண்களில்’ என்ற எபிரெயச் சொற்றொடரின் பொருளை இயல்பான தமிழில் தருகிறது; இங்கே חֵן என்பது உறவுசார் ஏற்றுக்கொள்ளுதலையும் தயவையும் குறிக்கிறது.
- source_word: הוֹדִעֵנִי
  choice: எனக்கு அறிவியும்
  rationale: ידע என்பதன் ஹிப்ஈல் வடிவிலுள்ள ‘அறியச் செய்/அறிவி’ என்ற காரணவினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: דְּרָכֶךָ
  choice: உமது வழியை
  rationale: WLC மெய்யெழுத்து-உயிர்க்குறி வடிவம் ஒருமையைக் காட்டுவதால் ‘வழியை’ என்று மொழிபெயர்க்கப்பட்டது; இது கடவுள் எவ்வாறு நடத்திச் செல்வார் அல்லது செயல்படுவார் என்பதையும் குறிக்கலாம்.
- source_word: וְאֵדָעֲךָ
  choice: அதனால் நான் உம்மை அறிந்துகொண்டு
  rationale: தகவலை மட்டும் அறிதல் அல்லாமல், மோசே கடவுளை உறவுசார்ந்து அறிதலையும் வெளிப்படுத்துகிறது; வேண்டுகோளின் நோக்கம்/விளைவு தொடர்பும் காக்கப்படுகிறது.
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: உமது பார்வையில் தயவு பெறுவேன்
  rationale: לְמַעַן குறிக்கும் நோக்கத்தைத் தொடர்ச்சியான தமிழ்ச் சொல்லாக்கத்தில் தருகிறது; ‘தயவு பெறுதல்’ என்ற திரும்பக்கூறலையும் பாதுகாக்கிறது.
- source_word: וּרְאֵה
  choice: கவனத்தில் கொள்ளும்
  rationale: ראה என்ற ‘பார்’ வினை இங்கு உடல்சார் பார்வையைவிட ‘கவனி/கருத்தில்கொள்’ என்ற வேண்டுகோள் பொருளில் வந்துள்ளது.
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: இந்தத் தேசம் உமது மக்கள்
  rationale: גּוֹי என்பதற்கு ‘தேசம்’, עַם என்பதற்கு ‘மக்கள்’ என்று வேறுபடுத்தி, தேசிய மற்றும் உடன்படிக்கைச் சார்ந்த சொற்பயன்பாடுகள் இரண்டையும் காக்கிறது.
theological_decisions:
- issue: முடிவுக் கூற்றிலுள்ள உடன்படிக்கைச் சார்ந்த நுட்பம்
  choice: இந்தத் தேசம் உமது மக்கள்
  alternative: இந்த மக்கள் உமது மக்கள்
  rationale: எபிரெயத்தில் גּוֹי (‘தேசம்’) மற்றும் עַם (‘மக்கள்’) ஆகிய இரண்டு வேறு சொற்களும் உள்ளன. அவற்றை ஒரே தமிழ்ச் சொல்லாகச் சுருக்காமல் இரண்டையும் பாதுகாப்பது மோசேயின் வேண்டுகோளிலுள்ள தேசிய மற்றும் உடன்படிக்கைச் சார்ந்த அழுத்தத்தை வெளிப்படுத்துகிறது.
- issue: דְּרָכֶךָ என்பதன் எண்ணிக்கை
  choice: உமது வழியை (ஒருமை)
  alternative: உமது வழிகளை (பன்மை)
  rationale: கொடுக்கப்பட்ட WLC வடிவத்தில் பன்மைச் சுட்டும் யோத் இல்லை; உயிர்க்குறியிடப்பட்ட דְּרָכֶךָ வடிவம் ஒருமை ‘உமது வழி’ என்பதையே ஆதரிக்கிறது. ஆலோசனை ஆங்கிலத்தின் பன்மையை மூலத்துக்கு மேலாக முன்னுரிமைப்படுத்தவில்லை.
translation_notes:
  register: மோசேயின் பணிவான வேண்டுகோளை வெளிப்படுத்த மரியாதை ஒருமையான ‘உமது/உம்மை’ வடிவங்களும் ‘அறிவியும்/கொள்ளும்’ என்ற உயர்வான ஏவல் வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. நடை நவீன வாசகர்களுக்குப் புரியுமாறும், அதேவேளை வேத உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது.
