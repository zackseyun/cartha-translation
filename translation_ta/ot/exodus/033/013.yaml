    rationale: 'The Hebrew spelling includes י and the form is plural: “your ways,” not “your way.” Both the translation and footnote a contradict the supplied WLC text.'
  - severity: low
    issue: The explanatory wording of footnote b can be normalized.
    rationale: “கருத்தில் கொள்ளும்” is the standard spaced form and clearly explains the idiomatic force of the imperative.
