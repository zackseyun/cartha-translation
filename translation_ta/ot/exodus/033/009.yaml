  text: וְ/הָיָ֗ה כְּ/בֹ֤א מֹשֶׁה֙ הָ/אֹ֔הֱלָ/ה יֵרֵד֙ עַמּ֣וּד הֶֽ/עָנָ֔ן וְ/עָמַ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/דִבֶּ֖ר עִם מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: ta
  text: மோசே கூடாரத்துக்குள் செல்லும்போதெல்லாம், மேகத்தூண் இறங்கி, கூடாரத்தின் வாசலில் நிற்கும்; அவர்[a] மோசேயுடன் பேசுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் வெளிப்படையாக, “ஆண்டவர் மோசேயுடன் பேசுவார்.” இந்தத் தொடரில் எபிரேயத்தில் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; ஆனால் சூழல் அது ஆண்டவர் என்பதைச் சுட்டுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: செல்லும்போதெல்லாம்
  rationale: வழக்கமாகத் திரும்பத் திரும்ப நிகழ்ந்த செயலைக் குறிக்கும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: கூடாரத்துக்குள் / கூடாரத்தின்
  rationale: இங்கு எபிரெயம் ‘கூடாரம்’ என்று மட்டுமே கூறுகிறது; ‘சந்திப்புக் கூடாரம்’ என்ற விரிவான பெயரைச் சேர்க்கவில்லை. திசையைக் குறிக்கும் வடிவம் ‘கூடாரத்துக்குள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יֵרֵד
  choice: இறங்கி வந்து
  rationale: முந்தைய காலத்தில் வழக்கமாக நிகழ்ந்த செயலைத் தமிழ் வினைமுற்றுத் தொடரில் இயல்பாகக் காட்டுகிறது; ‘வந்து’ என்பது கீழிறங்கி அந்த இடத்தை அடைவதையும் உணர்த்துகிறது.
- source_word: עַמּוּד הֶעָנָן
  choice: மேகத்தூண்
  rationale: எபிரெயக் கூட்டுச்சொல்லின் தெளிவான உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: וְעָמַד
  choice: நிற்கும்
  rationale: ‘இறங்கி வந்து’ என்பதோடு இணைந்து, திரும்பத் திரும்ப நிகழும் தொடர்ச்சியான செயலைக் குறிக்கிறது.
- source_word: פֶּתַח הָאֹהֶל
  choice: கூடாரத்தின் வாசலில்
  rationale: கூடாரத்தின் நுழைவிடம் அல்லது திறப்பைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: וְדִבֶּר
  choice: அவர் பேசுவார்
  rationale: எபிரெயத்தில் வெளிப்படையான எழுவாய் இல்லாமல் ஆண்பால் ஒருமை வினை உள்ளது. ‘அவர்’ என்பது சூழல் சுட்டும் தெய்வீகப் பேச்சாளரை உணர்த்தினாலும், மூலத்தில் இல்லாத பெயரை முதன்மை உரையில் சேர்க்காமல் விடுகிறது.
- source_word: עִם מֹשֶׁה
  choice: மோசேயுடன்
  rationale: עִם என்பதன் அடிப்படைப் பொருளான ‘உடன்’ என்பதைப் பாதுகாத்து, உரையாடலின் உறவுசார் நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘மோசேயுடன் பேசுவார்’ என்ற பகுதியில் மறைந்துள்ள எழுவாய்
  choice: சூழல் சுட்டும் நபரை ‘அவர்’ என்று குறிப்பிட்டு, தெய்வீகப் பெயரை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல் வைத்தல்
  alternative: ‘ஆண்டவர் மோசேயுடன் பேசுவார்’ என்று எழுவாயை வெளிப்படையாகக் கூறுதல்; குறைந்த சாத்தியமுள்ள வகையில் மேகத்தூணையே எழுவாயாகக் கொள்ளுதல்
  rationale: சூழலில் பேசுபவர் ஆண்டவர் என்பது தெளிவாக இருந்தாலும், இந்த எபிரெய வாக்கியப் பகுதியில் எழுவாய் பெயரிட்டு கூறப்படவில்லை. ஆகவே மூலத்தின் மறைமுகத்தன்மையைப் பாதுகாத்து, விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சந்திப்புக் கூடாரம்’ போன்ற சூழலால் அறியப்படும் விரிவாக்கம் சேர்க்கப்படவில்லை; மூலத்தின் எழுவாய் மறைமுகத்தன்மை ‘அவர்’ மற்றும் அடிக்குறிப்பு மூலம் பாதுகாக்கப்பட்டுள்ளது.
