  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֤ר אֶל בְּנֵֽי יִשְׂרָאֵל֙ אַתֶּ֣ם עַם קְשֵׁה עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְ/קִרְבְּ/ךָ֖ וְ/כִלִּיתִ֑י/ךָ וְ/עַתָּ֗ה הוֹרֵ֤ד עֶדְיְ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/אֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: ta
  text: 'யாவே மோசேயிடம், “இஸ்ரவேல் மக்களிடம்[a] சொல்: ‘நீங்கள் கழுத்தை வளைத்துக் கொடுக்காத மக்கள். ஒரு கணம்கூட உங்கள் நடுவில் நான் ஏறிச் சென்றால்[b], உங்களை அடியோடு அழித்துவிடுவேன்[c]. ஆகவே இப்போது, நீங்கள் அணிந்திருக்கும் அணிகலன்களைக் கழற்றிவிடுங்கள்[d]; உங்களுக்கு என்ன செய்வேன் என்பதை நான் அறிவேன்[e].’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “இஸ்ரவேலின் மகன்கள்”; அதாவது இஸ்ரவேலர் அனைவரும்.'
    reason: lexical_alternative
  - marker: b
    text: 'வேறு வகையில்: “உங்கள் நடுவில் நான் ஒரு கணம் ஏறிச் சென்றால்.” எபிரெய உரை இஸ்ரவேலை ஒரு கூட்டமைப்பாக ஒருமையில் குறிப்பிடுகிறது.'
    reason: lexical_alternative
  - marker: c
    text: 'அல்லது: “உங்களை முற்றிலும் முடிவுக்குக் கொண்டுவந்துவிடுவேன்.”'
    reason: lexical_alternative
  - marker: d
    text: 'அல்லது: “உங்கள் நகைகளைக் கழற்றிவிடுங்கள்”; “உங்கள் அலங்காரங்களை நீக்கிவிடுங்கள்.”'
    reason: lexical_alternative
  - marker: e
    text: 'சொல்லுக்கு நெருக்கமாக: “உனக்கு என்ன செய்வேன் என்பதை நான் அறிவேன்.” ‘அறிவேன்’ என்ற மனிதப்பண்பு சார்ந்த இறைச் சொல்லாட்சியை வெறும் ‘தீர்மானிப்பேன்’ என்று மாற்றாமல் உரை தக்கவைக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கும் கூட்டுப்பெயரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: கழுத்தை வளைக்காத மக்கள்
  rationale: பிடிவாதத்தையும் கீழ்ப்படியாமையையும் குறிக்கும் எபிரெய உருவகத்தை முற்றிலும் தட்டையாக்காமல், தமிழில் புரியத்தக்க வகையில் காக்கிறது.
- source_word: רֶגַע אֶחָד
  choice: ஒரே ஒரு கணம்
  rationale: செயலின் மிகக் குறுகிய காலத்தையும் உடனடியான அபாயத்தையும் வெளிப்படுத்துகிறது.
- source_word: אֶעֱלֶה בְקִרְבְּךָ
  choice: உங்கள் நடுவில் நான் ... ஏறிச் சென்றால்கூட
  rationale: אעלה என்பதிலுள்ள ‘ஏறிச் செல்’ என்ற இயக்கத்தையும் בקרבך என்பதிலுள்ள உடனிருப்பையும் முடிந்தவரை காக்கிறது; நிபந்தனைத் தொனியை ‘-ஆல்கூட’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְכִלִּיתִיךָ
  choice: உங்களை அடியோடு அழித்துவிடுவேன்
  rationale: כלה இங்கு முழுமையாக முடிவுக்குக் கொண்டுவரும் நியாயத்தீர்ப்பைக் குறிக்கிறது; ‘அடியோடு’ அதன் முழுமைத் தன்மையைத் தெரிவிக்கிறது.
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: நீங்கள் அணிந்திருக்கும் அணிகலன்களைக் கழற்றிவிடுங்கள்
  rationale: עדי என்பதன் பரந்த ‘அலங்கார அணிகலன்’ பொருளைத் தக்கவைத்து, ‘உன்மேலிருந்து இறக்கு’ என்ற எபிரெய சொல்லாட்சியை இயல்பான தமிழாக்கமாக வழங்குகிறது.
- source_word: וְאֵדְעָה מָה אֶעֱשֶׂה לָּךְ
  choice: உங்களை என்ன செய்ய வேண்டும் என்பதை அப்போது நான் அறிவேன்
  rationale: ‘அறிவேன்’ என்ற மூல வினையைப் பாதுகாத்து, அதை வெறும் ‘தீர்மானிப்பேன்’ என்று விளக்கிவிடாமல் விடுகிறது; לָךְ என்பதையும் தண்டனைக்கு மட்டும் குறுக்காமல் ‘உங்களை என்ன செய்ய’ எனத் திறந்த நிலையில் வைக்கிறது.
theological_decisions:
- issue: இறைவன் ‘அறிவேன்’ என்று கூறும் மனிதப்பண்பு சார்ந்த மொழி
  choice: ‘நான் அறிவேன்’ என்பதை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘நான் தீர்மானிப்பேன்’ அல்லது ‘நான் முடிவு செய்வேன்’
  rationale: மூலத்தில் ידע, ‘அறிதல்’, என்ற வினை உள்ளது. இறை அனைத்தறிவைப் பற்றிய பதற்றத்தை மொழிபெயர்ப்பிலேயே தீர்த்துவிடாமல், மூலத்தின் உறவுசார் மற்றும் மனிதப்பண்பு சார்ந்த சொல்லாட்சியைப் பாதுகாக்கிறது.
- issue: இஸ்ரவேலை நோக்கிய கூட்டொருமை விகுதிகள்
  choice: தமிழில் இயல்பாகப் பன்மை மரியாதையற்ற கூட்டுமுகவரியைப் பயன்படுத்துதல்
  alternative: ஒவ்வொரு எபிரெய ஒருமை விகுதியையும் தமிழில் ‘நீ/உன்’ எனத் தருதல்
  rationale: எபிரெய உரை முழு இஸ்ரவேலையும் ஒரே கூட்டமைப்பாக ஒருமையில் நோக்குகிறது. தமிழில் ‘நீங்கள்/உங்கள்’ என்பவை கூட்டுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகின்றன.
- issue: இறைவனின் உடனிருப்பு நியாயத்தீர்ப்புக்கான அபாயமாக இருப்பது
  choice: ‘உங்கள் நடுவில் ... ஏறிச் சென்றால்கூட, உங்களை ... அழித்துவிடுவேன்’ என்ற பதற்றத்தை அப்படியே வைத்தல்
  alternative: இறைவன் கோபத்தில் அவர்களை விட்டு விலகுவதாக மட்டும் மென்மைப்படுத்துதல்
  rationale: பரிசுத்தமான இறை உடனிருப்பும் கிளர்ச்சியுள்ள மக்கள்மீதான நியாயத்தீர்ப்பும் ஒன்றாக நிற்கும் மூலத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதாகப் புரியும், ஆனால் வேதாகம உரைக்குரிய கண்ணியமுள்ள நடை பயன்படுத்தப்பட்டுள்ளது. ‘கழுத்தை வளைக்காத’ என்ற உருவகம் வாசகருக்குப் புரியும் வகையில் வைக்கப்பட்டு, ‘பிடிவாதமான’ என்று முழுமையாகப் பொருளுரைக்கப்படவில்லை. ‘யாவே’ என்பது பட்டப்பெயருக்குப் பதிலாகத் தெய்வீகப் பெயரின் ஒலிபெயர்ப்பு.
