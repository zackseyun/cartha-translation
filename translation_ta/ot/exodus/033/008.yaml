translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. வழக்கமாகத் திரும்ப நிகழ்ந்த செயலை ‘போதெல்லாம்’ மற்றும் எதிர்கால வழக்குநிலை வினைமுற்றுகள் வெளிப்படுத்துகின்றன; கூடாரத்தைக் குறித்த மூலத்தின் சுருக்கமும் பாலின வடிவமும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
