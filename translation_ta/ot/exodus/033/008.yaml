source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/צֵ֤את מֹשֶׁה֙ אֶל הָ/אֹ֔הֶל יָק֨וּמוּ֙ כָּל הָ/עָ֔ם וְ/נִ֨צְּב֔וּ אִ֖ישׁ פֶּ֣תַח אָהֳל֑/וֹ וְ/הִבִּ֨יטוּ֙ אַחֲרֵ֣י מֹשֶׁ֔ה עַד בֹּא֖/וֹ הָ/אֹֽהֱלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: ta
  text: மோசே கூடாரத்திற்குப்[a] புறப்பட்டுச் செல்லும்போதெல்லாம், மக்கள் அனைவரும் எழுந்து, ஒவ்வொரு ஆணும்[b] தன் கூடாரத்தின் நுழைவாயிலில் நின்றுகொள்வான்; மோசே கூடாரத்திற்குள் செல்லும்வரை, அவர் போவதையே அவர்கள் பார்த்துக்கொண்டிருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் கூடாரத்திற்கு.” எபிரெயத்தில் இங்கு “கூடாரம்” என்றே உள்ளது; சுற்றியுள்ள வசனங்களின்படி இது சந்திப்புக் கூடாரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “ஒவ்வொரு மனிதனும்”; இங்குள்ள ஆண்பால் ஒருமைச் சொல் மக்களிலுள்ள ஆண்கள் ஒவ்வொருவரையும் பகிர்ந்தளிக்கும் விதத்தில் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: செல்லும்போதெல்லாம்
  rationale: היה என்பதுடன் தொடரும் இக்கதை அமைப்பு வழக்கமாகத் திரும்பத் திரும்ப நிகழ்ந்த சூழலைக் குறிக்கிறது; ‘போதெல்லாம்’ அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּצֵאת מֹשֶׁה
  choice: மோசே ... புறப்பட்டுச் செல்லும்போது
  rationale: יצא வெளியே புறப்படுதலைக் குறிக்கிறது; כְּ உடன் வரும் வினையெச்ச அமைப்பு ‘போது’ என்ற காலச் சூழலைத் தருகிறது.
- source_word: הָאֹהֶל
  choice: கூடாரம்
  rationale: எபிரெயச் சொல் இவ்வசனத்தில் வெறுமனே ‘கூடாரம்’ என்றே உள்ளது; சுற்றியுள்ள வசனங்கள் அது சந்திப்புக் கூடாரம் என்பதைத் தெளிவுபடுத்துகின்றன.
- source_word: יָקוּמוּ וְנִצְּבוּ
  choice: எழுந்து ... நின்றுகொள்வான்
  rationale: இரு வினைகளும் தொடர்ச்சியான, வழக்கமான செயல்களைச் சுட்டுகின்றன. பகிர்ந்தளிக்கும் ஒருமைத் தொடருடன் பொருந்தும்படி இரண்டாவது வினை தமிழில் ஒருமையில் தரப்பட்டுள்ளது.
- source_word: אִישׁ
  choice: ஒவ்வொரு ஆணும்
  rationale: אִישׁ இங்கு மக்களிடையே பகிர்ந்தளிக்கும் ஒருமையாக இருந்தாலும், அதன் ஆண்பால் வடிவை மறைக்காமல் ‘ஒவ்வொரு ஆணும்’ என்று தரப்பட்டுள்ளது.
- source_word: פֶּתַח אָהֳלוֹ
  choice: தன் கூடாரத்தின் நுழைவாயிலில்
  rationale: פֶּתַח என்பது கூடாரத்தின் திறப்பு அல்லது நுழைவிடம்; ‘நுழைவாயில்’ தெளிவான நவீனத் தமிழ்.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: அவர் போவதையே அவர்கள் பார்த்துக்கொண்டிருப்பார்கள்
  rationale: אַחֲרֵי உடன் வரும் הביט, விலகிச் செல்லும் மோசேயை மக்கள் பார்வையால் தொடர்ந்து நோக்கியதைச் சுட்டுகிறது; தமிழ் சொற்றொடர் உடலால் பின்தொடர்ந்ததாகப் பொருள்படாமல் இதை வெளிப்படுத்துகிறது.
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: கூடாரத்திற்குள் செல்லும்வரை
  rationale: திசையைக் குறிக்கும் הָ இறுதியுடன் בוא வருவதால் கூடாரத்தின் உள்ளே சென்றடைவது குறிக்கப்படுகிறது.
