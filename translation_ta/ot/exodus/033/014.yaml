source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר פָּנַ֥/י יֵלֵ֖כוּ וַ/הֲנִחֹ֥תִי לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “என் பிரசன்னம்[a] செல்லும்; நான் உனக்கு இளைப்பாறுதல் அளிப்பேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “என் முகம் செல்லும்.” இச்சொற்றொடர் இங்கு ஆண்டவரின் தனிப்பட்ட பிரசன்னத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: அவர் சொன்னார்
  rationale: אמר என்பதன் வழக்கமான wayyiqtol கதைநடை வடிவம்; தமிழில் நேரடி உரையை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: פָּנַי
  choice: என் பிரசன்னம்
  rationale: சொல்லுக்கு சொல் ‘என் முகம்’ என்றாலும், இங்கு ஆண்டவர் தாமே உடனிருப்பதைக் குறிக்கும் மரபுத்தொடர். ‘பிரசன்னம்’ அதன் தனிப்பட்ட, உடனிருக்கும் பொருளைக் கண்ணியமான தமிழில் தருகிறது; மூல உருவகம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יֵלֵכוּ
  choice: உன்னோடு வரும்
  rationale: அடிப்படையில் ‘செல்லும்’ எனப் பொருள்; சூழலில் மோசேயுடன் ஆண்டவர் உடன்செல்வதாக அளிக்கும் வாக்குறுதியைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘உன்னோடு வரும்’ என்று தரப்பட்டுள்ளது.
- source_word: וַהֲנִחֹתִי
  choice: நான் உனக்கு இளைப்பாறுதல் அளிப்பேன்
  rationale: נוח என்பதன் Hiphil வடிவம் ‘ஓய்வடையச் செய்தல்/இளைப்பாறுதல் அளித்தல்’ என்று பொருள்படும். காரணவினைப் பொருளையும் வாக்குறுதியின் தொனியையும் இவ்வடிவம் காக்கிறது.
- source_word: לָךְ
  choice: உனக்கு
  rationale: இரண்டாம் நபர் ஒருமை ஆண்பால் பின்னொட்டு; மோசேயை ஒருமையில் நோக்கிப் பேசுவதைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: פָּנַי என்ற மனித உருவகச் சொல்லின் மொழிபெயர்ப்பு
  choice: என் பிரசன்னம்
  alternative: என் முகம் / நானே
  rationale: ‘முகம்’ என்ற எபிரெய உருவகம் ஆண்டவரின் தனிப்பட்ட உடனிருப்பைக் குறிக்கிறது. முதன்மை உரையில் பொருளை இயல்பாகத் தரும் ‘பிரசன்னம்’ பயன்படுத்தப்பட்டு, உருவகத்தின் உண்மையான சொல்வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יֵלֵכוּ என்பதுடன் உடன்செல்லும் கருத்தை வெளிப்படுத்துதல்
  choice: உன்னோடு வரும்
  alternative: செல்லும்
  rationale: எபிரெய வினை தனியே ‘செல்லும்’ என்று இருந்தாலும், உரையாடல் சூழல் ஆண்டவர் மோசேயுடன் வருவதைச் சுட்டுகிறது. தமிழ் வாக்கியத்தில் தேவைப்படும் தொடர்பை வெளிப்படுத்த இது இயல்பான சமவிகித மொழிபெயர்ப்பு; புதிய இறையியல் கருத்தைச் சேர்ப்பதல்ல.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை. மோசேயை நோக்கிய ஒருமை ‘உன்/உனக்கு’ காக்கப்பட்டுள்ளது. ‘பிரசன்னம்’ வேதாகமச் சூழலில் பரவலாகப் புரியக்கூடிய சொல்லாக இருந்தாலும், அதன் எபிரெய உருவகம் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
