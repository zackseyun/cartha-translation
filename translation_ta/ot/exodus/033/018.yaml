source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר הַרְאֵ֥/נִי נָ֖א אֶת כְּבֹדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/018.yaml
  text: Then he said[a], “Please show me your glory.”
translation:
  language: ta
  text: அப்போது அவர், “தயவுசெய்து உமது மகிமையை[a] எனக்குக் காட்டுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உமது மாட்சிமையை எனக்குக் காண்பியுங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் சொல்லுக்குச் சொல் “எனக்குக் காணச் செய்யுங்கள்” எனப் பொருள்படும்; “மகிமை” என்பது வெளிப்படும் மாட்சிமை அல்லது மாண்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: அப்போது அவர் … என்றார்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது. அதனால் இயல்பான நவீனத் தமிழில் அதன் தொடர்ச்சி வலிமையை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: הַרְאֵנִי
  choice: எனக்குக் காட்டுங்கள்
  rationale: ראה என்பதன் ஹிஃபில் கட்டளை வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும் நேரடியாக ‘என்னைக் காணச் செய்யும்’ எனப் பொருள்படும். நவீனத் தமிழில் ‘எனக்குக் காட்டுங்கள்’ அதன் காரணவினைப் பொருளையும் நேரடியான வேண்டுகோளையும் இயல்பாகத் தருகிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: இந்தத் துகள் பணிவான வேண்டுகோளைச் சுட்டுகிறது; ‘தயவுசெய்து’ அதன் செயல்பாட்டைத் தெளிவான சமகாலத் தமிழில் தருகிறது.
- source_word: אֶת
  choice: '[நேரடி செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: אֶת குறிப்பிட்ட நேரடி செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் அதற்கெனத் தனிச் சொல் தேவையில்லை.
- source_word: כְּבֹדֶךָ
  choice: உமது மகிமையை
  rationale: כָּבוֹד என்பது மகிமை, மாண்பு, வெளிப்படும் மாட்சிமை ஆகிய பொருட்களைக் கொள்ளலாம். இங்கு அதன் பரந்த இறையியல் பொருளைச் சுருக்காமல் ‘உமது மகிமை’ பாதுகாக்கிறது.
theological_decisions:
- issue: மோசே கேட்ட ‘உமது மகிமை’ என்பதன் பொருள்
  choice: உமது மகிமை
  alternative: உமது மாட்சிமை; உமது பிரசன்னத்தின் முழுமை
  rationale: மோசே காண விரும்பியது கண்ணுக்குப் புலப்படும் பேரொளியா, தெய்வீக மாட்சிமையா, அல்லது கடவுளுடைய பிரசன்னத்தின் வெளிப்பாடா என்பதை எபிரெயச் சொல் தனியாக வரையறுக்கவில்லை. ஆகவே அந்தப் பொருள் விரிவையும் இறையியல் அழுத்தத்தையும் தீர்த்துவிடாமல் ‘மகிமை’ என வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதையை ‘உமது’, ‘காட்டுங்கள்’ ஆகிய வடிவங்கள் வெளிப்படுத்துகின்றன; ‘காட்டியருளும்’ போன்ற விளக்கப் பொருள் சேர்க்கக்கூடிய சமய வழக்குச் சொல் தவிர்க்கப்பட்டுள்ளது.
