  text: וַ/יֹּ֕אמֶר לֹ֥א תוּכַ֖ל לִ/רְאֹ֣ת אֶת פָּנָ֑/י כִּ֛י לֹֽא יִרְאַ֥/נִי הָ/אָדָ֖ם וָ/חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: ta
  text: ஆனால் அவர், “நீ என் முகத்தை[a] காண முடியாது; ஏனெனில் எந்த மனிதனும்[b] என்னைக் கண்டு உயிரோடு இருக்க முடியாது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பிரசன்னத்தை.” எபிரெய மொழியில் சொல்லுக்குச் சொல், “என் முகத்தை.”
    reason: lexical_alternative
  - marker: b
    text: “எந்த மனிதனும்” என்பது எல்லா மனிதர்களையும், அதாவது மனிதகுலம் முழுவதையும், பொதுவாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் அவர் … என்றார்
  rationale: வாவ் தொடர்கதையை முன்னெடுத்தாலும், முந்தைய வசனத்தில் மோசே விடுத்த வேண்டுகோளுக்கு இங்கு எதிர்மறையான பதில் வருவதால், சூழலுக்கேற்ற முரண்பாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא תוּכַל
  choice: நீ … காண முடியாது
  rationale: יכל இங்கு அனுமதியைக் குறிக்காமல் இயலாமையைக் குறிக்கிறது; ‘முடியாது’ அந்தப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לִרְאֹת
  choice: காண
  rationale: ראה இங்கு பார்வையால் காண்பதைக் குறிக்கிறது; dignified modern Tamilக்கு ‘காண’ பொருத்தமானது.
- source_word: אֶת־פָּנַי
  choice: என் முகத்தை
  rationale: פָּנִים என்பதன் நேரடிப் பொருள் ‘முகம்.’ இதை ‘பிரசன்னம்’ என்று விளக்கமாக மாற்றாமல், எபிரெய மொழியின் உருவகமிக்க நேரடிச் சொல்லை முதன்மை உரையில் தக்கவைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא יִרְאַנִי
  choice: என்னைக் கண்டு … இருக்க முடியாது
  rationale: இது மனிதகுலத்துக்குப் பொதுவான கோட்பாட்டையும் அதன் விளைவையும் கூறுகிறது; தமிழில் ‘கண்டு … இருக்க முடியாது’ என்பது அந்தத் தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָאָדָם
  choice: எந்த மனிதனும்
  rationale: ஒருமை வடிவிலுள்ள הָאָדָם இங்கு மனிதகுலம் முழுவதையும் பொதுவாகக் குறிக்கிறது. ‘எந்த மனிதனும்’ பாலின வரம்பின்றி அதன் பொதுப்பொருளைத் தெளிவாக்குகிறது.
- source_word: וָחָי
  choice: உயிரோடு இருக்க
  rationale: கடவுளைக் கண்ட பின்பும் தொடர்ந்து உயிர்வாழ்வதைக் குறிக்கும் விளைவை இச்சொற்றொடர் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: ‘என் முகம்’ என்ற கடவுளைப் பற்றிய மனித உருவ மொழி
  choice: முதன்மை உரையில் ‘என் முகத்தை’ என்று தக்கவைத்தல்
  alternative: என் பிரசன்னத்தை
  rationale: எபிரெய மூலத்தில் உள்ள திட்டமான மனித உருவ மொழியை விளக்கக் கருத்தாக மாற்றாமல் பாதுகாக்கிறது; ‘பிரசன்னம்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: הָאָדָם என்பதன் பொதுவான மனிதகுலப் பொருள்
  choice: ‘எந்த மனிதனும்’ என்று மொழிபெயர்த்தல்
  alternative: மனிதன்; மனிதகுலம்
  rationale: எபிரெயச் சொல் இலக்கணத்தில் ஒருமையாக இருந்தாலும் இங்கு எல்லா மனிதர்களுக்கும் பொருந்தும் பொதுக் கூற்றாக உள்ளது. தமிழ் வாசகர் இதை ஆண்களுக்கு மட்டும் உரியதாகத் தவறாகப் புரிந்துகொள்ளாதபடி பொதுப்பொருள் வெளிப்படையாகக் கொடுக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘முகம்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டு, மனிதகுலத்தைக் குறிக்கும் பொதுப்பொருள் தெளிவாக வெளிப்படுத்தப்பட்டுள்ளது.
