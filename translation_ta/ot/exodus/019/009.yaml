base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: ta
  text: யாவே மோசேயிடம், “இதோ, மக்கள் நான் உன்னோடு பேசுவதைக் கேட்கவும், உன்மீது என்றென்றும் நம்பிக்கை வைக்கவும் நான் அடர்ந்த மேகத்தில் உன்னிடம் வருகிறேன்” என்றார். பின்பு மோசே மக்களின் வார்த்தைகளை யாவேவிடம் தெரிவித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: நேரடியான கவன ஈர்ப்பையும் உரையின் மேன்மையான தொனியையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בָּא
  choice: வருகிறேன்
  rationale: எபிரெயப் பங்கேற்புவினையின் உடனடித்தன்மையையும் நிகழவிருக்கும் செயலின் உயிரோட்டத்தையும் காட்டுகிறது.
- source_word: בְּעַב הֶעָנָן
  choice: அடர்ந்த மேகத்தில்
  rationale: மேகத்தின் அடர்த்தியைக் குறிக்கும் மூல உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּעֲבוּר
  choice: …ும்படியாக
  rationale: பின்வரும் வாக்கியப்பகுதி நோக்கத்தைக் குறிப்பிடுவதால், தமிழில் நோக்கப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: நான் உன்னோடு பேசுவதை
  rationale: இறைவன் மோசேயுடன் பேசும் நிகழ்வை மக்கள் கேட்பார்கள் என்ற காலச்சார்ந்த பொருளை தெளிவாக வழங்குகிறது.
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: உன்மீதும் … நம்பிக்கை வைக்க
  rationale: மோசே இறைவனால் உறுதிப்படுத்தப்பட்ட பேச்சாளர் என்பதில் மக்கள் கொள்ளும் நம்பிக்கையை வெளிப்படுத்துகிறது; வழிபாட்டைக் குறிக்கும் அளவுக்கு பொருளை மிகைப்படுத்தவில்லை.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தைச் சுருக்கமாகவும் dignified modern Tamil-இலும் வெளிப்படுத்துகிறது.
- source_word: וַיַּגֵּד
  choice: தெரிவித்தார்
  rationale: மக்களின் சொற்களை மோசே யாவேவிடம் எடுத்துரைத்தார் என்ற அறிக்கைப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: דִּבְרֵי הָעָם
  choice: மக்களின் வார்த்தைகளை
  rationale: மூலத்தின் ‘வார்த்தைகள்’ என்ற சொல்லைத் தக்கவைத்து, இயல்பான தமிழ்ச் சொற்றொடராக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது உரையின் உடன்படிக்கைச் சூழலைப் பாதுகாக்கிறது.
- issue: בְּךָ יַאֲמִינוּ என்பதில் மோசேமீது கொள்ளப்படும் நம்பிக்கையின் தன்மை
  choice: உன்மீதும் நம்பிக்கை வைக்க
  alternative: உன்னையும் நம்ப; உன்னை விசுவாசிக்க
  rationale: எபிரெயச் சொற்றொடர் மோசேயை இறைவனின் உறுதிப்படுத்தப்பட்ட பேச்சாளராக மக்கள் ஏற்றுக்கொள்வதைக் குறிக்கலாம். ‘நம்பிக்கை வைக்க’ என்பது அந்த உறவைத் தக்கவைக்கிறது; மோசேமீது இறைநம்பிக்கை அல்லது வழிபாடு செலுத்தப்படுவதாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, ஆனால் மேன்மையும் நேரடி உரையின் solemnity-யும் குன்றாத நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை உரையாடலில் ‘உன்/உன்னிடம்’ என்பது எபிரெய மூலத்தின் இரண்டாம் நபர் ஒருமையைப் பிரதிபலிக்கிறது. அடிக்குறி குறி அது விளக்கும் சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
