  text: וַ/יֹּ֨אמֶר֙ אֶל הָ/עָ֔ם הֱי֥וּ נְכֹנִ֖ים לִ/שְׁלֹ֣שֶׁת יָמִ֑ים אַֽל תִּגְּשׁ֖וּ אֶל אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: ta
  text: அவர் மக்களிடம், “மூன்று நாட்களுக்கு ஆயத்தமாயிருங்கள்; ஒரு பெண்ணை அணுகாதீர்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “ஒரு பெண்ணை அணுகாதீர்கள்.” இச்சூழலில், ஆயத்தக் காலத்தில் பாலுறவைத் தவிர்க்க வேண்டும் என்பதைக் குறிக்கும் மறைமுகச் சொல்லாட்சி இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־הָעָם
  choice: அவர் மக்களிடம் … என்றார்
  rationale: எபிரெயக் கதைநடையின் வழக்கமான சொல்லமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; முந்தைய சூழலில் பேசுபவர் மோசே என்பது தெளிவாக இருப்பதால் பெயரைச் சேர்க்கவில்லை.
- source_word: הֱיוּ נְכֹנִים
  choice: ஆயத்தமாயிருங்கள்
  rationale: நிகழவிருக்கும் இறைத் தோற்றத்திற்கான தயார்நிலையை dignified, பொதுவாகப் புரியும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: மூன்று நாட்களுக்கு
  rationale: இந்த எபிரெயச் சொற்றொடரின் கால அளவை நேரடியாகப் பாதுகாக்கிறது; ‘மூன்றாம் நாளுக்காக’ என்று சூழலின் அடிப்படையில் மாற்றித் தீர்மானிக்கவில்லை.
- source_word: אַל־תִּגְּשׁוּ
  choice: அணுகாதீர்கள்
  rationale: נגשׁ என்பதன் ‘அருகில் செல்லுதல்/அணுகுதல்’ என்ற அடிப்படைப் பொருளையும் தடை வடிவத்தையும் சுருக்கமாகக் காக்கிறது.
- source_word: אֶל־אִשָּׁה
  choice: ஒரு பெண்ணை
  rationale: எபிரெயின் நேரடியான, ஆனால் சூழலில் மறைமுகப் பொருளுடைய சொல்லாட்சியை முதன்மை உரையில் பாதுகாக்கிறது; ‘மனைவி’ அல்லது வெளிப்படையான பாலுறவுச் சொல்லை உரைக்குள் இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: சடங்கு ஆயத்தக் காலத்தில் பாலுறவைத் தவிர்க்கும் கட்டளையை முதன்மை உரையிலேயே வெளிப்படையாக்க வேண்டுமா?
  choice: எபிரெய மறைமுகச் சொல்லாட்சியான ‘ஒரு பெண்ணை அணுகாதீர்கள்’ என்பதைப் பாதுகாத்தல்
  alternative: ‘ஒரு பெண்ணுடன் பாலுறவு கொள்ளாதீர்கள்’ அல்லது ‘உங்கள் மனைவியரை அணுகாதீர்கள்’
  rationale: மூல உரை வெளிப்படையான பாலியல் வினைச்சொல்லைப் பயன்படுத்தவில்லை. அதன் இயல்பான மறைமுகத்தன்மையையும் இறையியல் பதற்றத்தையும் முதன்மை உரையில் காத்து, சூழற்பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துவது மிகையாக விளக்காமல் வாசகருக்கு வெளிப்படைத்தன்மை அளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்தியுள்ளது. ‘ஆயத்தமாயிருங்கள்’ மற்றும் ‘அணுகாதீர்கள்’ ஆகியவை சற்று உயர்ந்தாலும் இயல்பான வழிபாட்டு/வேதாகமப் பதிவைத் தக்கவைக்கின்றன. அடிக்குறிப்பு குறியீடு தொடர்புடைய மறைமுகச் சொல்லாட்சிக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
