base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: ta
  text: நீ மக்களுக்குச் சுற்றிலும் எல்லை அமைத்து, அவர்களிடம், ‘நீங்கள் மலையின்மேல் ஏறாமலும் அதன் விளிம்பைத் தொடாமலும் எச்சரிக்கையாக இருங்கள். மலையைத் தொடுகிற யாரும் நிச்சயமாகக் கொல்லப்பட வேண்டும்[a]’ என்று சொல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிச்சயமாகச் சாக வேண்டும்.” எபிரெய மொழியில் இது மரணத்தை வலியுறுத்தும் சொற்றொடர். இங்கு செயப்பாட்டு வடிவத்தையும் அடுத்த வசனத்தில் பிறரால் நிறைவேற்றப்படும் மரணதண்டனையையும் கருத்தில் கொண்டு “நிச்சயமாகக் கொல்லப்பட வேண்டும்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: எல்லை வகுத்து
  rationale: גבל என்பதன் ஹிஃபில் வடிவம் ஓர் எல்லையையோ வரம்பையையோ நிர்ணயிப்பதைக் குறிக்கிறது. ‘எல்லை வகுத்து’ என்பது இயல்பான நவீனத் தமிழில் தடைசெய்யப்பட்ட சுற்றெல்லையைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָעָם
  choice: மக்களை
  rationale: இங்கு עם என்பது ஒன்றுகூடிய இஸ்ரவேல் மக்களை ஒரு கூட்டமாகக் குறிக்கிறது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: எல்லாப் பக்கங்களிலும் சுற்றியுள்ள நிலையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לֵאמֹר
  choice: அவர்களிடம் … என்று சொல்
  rationale: கட்டளையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் எபிரெய முடிவிலி வடிவம் தமிழில் நேரடி உரையுடன் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: எச்சரிக்கையாக இருங்கள்
  rationale: ‘உங்களைக் காத்துக்கொள்ளுங்கள்’ என்ற சொற்பொருளுடைய எச்சரிக்கை மரபுத்தொடரின் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֲלוֹת בָּהָר
  choice: மலையின்மேல் ஏறாமல்
  rationale: עלה உடன் בְ இங்கு மலையின்மேல் ஏறிச் செல்வதைக் குறிக்கிறது; ‘மலையின்மேல்’ என்பது மலையின் புனிதப் பகுதிக்குள் நுழையும் கருத்தையும் காக்கிறது.
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: அதன் விளிம்பைத் தொடாமல்
  rationale: קצהו என்பது அதன் கடைசி பகுதி அல்லது விளிம்பு. முன்பு வகுக்கப்பட்ட எல்லையுடன் தொடர்புடைய இடவியல் கருத்தை ‘விளிம்பு’ காக்கிறது.
- source_word: כָּל הַנֹּגֵעַ בָּהָר
  choice: மலையைத் தொடுகிற எவனும்
  rationale: இக்கட்டமைப்பு விதிவிலக்கின்றி ஒவ்வொருவருக்கும் பொருந்தும் எச்சரிக்கையைத் தருகிறது. ‘எவனும்’ என்பது அந்தப் பொதுமையான, பகிர்ந்தளிக்கும் வலிமையைத் தக்கவைக்கிறது.
- source_word: מוֹת יוּמָת
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  rationale: முடிவிலி முழுவடிவத்துடன் வரும் ஹொஃபால் வினைமுற்று மரணத் தீர்ப்பை வலியுறுத்துகிறது. ‘நிச்சயமாக’ வலியுறுத்தலையும், ‘கொல்லப்பட வேண்டும்’ செயப்பாட்டு வடிவத்தையும் அடுத்த வசனத்தின் தண்டனைச் சூழலையும் பிரதிபலிக்கிறது.
theological_decisions:
- issue: מוֹת יוּמָת என்பது உறுதியான மரணத்தையா அல்லது விதிக்கப்பட்ட மரணதண்டனையையா குறிக்கிறது?
  choice: நிச்சயமாகக் கொல்லப்பட வேண்டும்
  alternative: நிச்சயமாகச் சாக வேண்டும்
  rationale: எபிரெயச் செயப்பாட்டு வடிவமும் அடுத்த வசனத்தில் பிறரால் நிறைவேற்றப்படும் தண்டனை விவரிக்கப்படுவதும் மரணதண்டனைப் பொருளுக்கு ஆதரவளிக்கின்றன. இருப்பினும் மரபுத்தொடர் உறுதியான மரணத்தையும் குறிக்கக்கூடும் என்பதால் மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான பொதுநடை பயன்படுத்தப்பட்டுள்ளது. அரசாணை போன்ற எச்சரிக்கைத் தொனி காக்கப்பட்டுள்ளது; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
