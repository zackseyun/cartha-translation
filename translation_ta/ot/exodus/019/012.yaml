  source_fidelity: மூல எபிரெயத்தின் கட்டளை அமைப்பு, மலையில் ஏறுதல்/அதன் விளிம்பைத் தொடுதல் என்ற இரட்டைத் தடை, மற்றும் מוֹת יוּמָת-இன் வலியுறுத்தப்பட்ட செயப்பாட்டுத் தண்டனை ஆகியவை வரைவில் பெரும்பாலும் சரியாக உள்ளன. ஆனால் וְהִגְבַּלְתָּ אֶת־הָעָם סָבִיב என்பதில் எல்லை மக்களைச் சூழ்ந்து அமைக்கப்படுவதைத் தமிழில் தெளிவாகக் காட்ட, “மக்களுக்குச் சுற்றிலும்” என்பது சிறந்தது. பொதுமையான כָּל הַנֹּגֵעַ-க்கு பாலினக் குறிப்பற்ற “யாரும்” நவீனத் தமிழில் இயல்பானது.
