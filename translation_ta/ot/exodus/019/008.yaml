base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: ta
  text: மக்கள் அனைவரும் ஒருசேரப் பதிலளித்து, “யாவே சொன்ன அனைத்தையும் நாங்கள் செய்வோம்” என்றார்கள். பின்னர் மோசே மக்களின் வார்த்தைகளை யாவேயிடம் திரும்பத் தெரிவித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை இன்னும் நேரடியாக, “மக்களின் வார்த்தைகளை யாவேயிடம் திரும்பக் கொண்டுசென்றார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: பதிலளித்து
  rationale: இந்த உரையாடல் சூழலில் ענה என்பதன் இயல்பான பொருள் ‘பதிலளித்தல்’; அதைத் தொடர்ந்து வரும் நேரடிக் கூற்றுடனும் இது பொருந்துகிறது.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: கூட்டுமொத்த மக்களையும் குறிக்கும் எபிரெயச் சொல்லை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: יַחְדָּו
  choice: ஒருசேர
  rationale: மக்களின் ஒன்றுபட்ட கூட்டுப் பதிலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: כֹּל אֲשֶׁר דִּבֶּר
  choice: சொன்ன அனைத்தையும்
  rationale: ‘அவர் பேசிய எல்லாவற்றையும்’ என்ற கருத்தை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைபெயரை ஒரு பட்டத்தால் மாற்றாமல், Yahweh என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נַעֲשֶׂה
  choice: நாங்கள் செய்வோம்
  rationale: עשה என்பதன் நேரடிப் பொருளான ‘செய்’ என்பதைப் பாதுகாக்கிறது; ‘கீழ்ப்படிவோம்’ என்பது சூழலுக்குப் பொருந்தினாலும் விளக்க விரிவாக்கமாகும்.
- source_word: וַיָּשֶׁב
  choice: திரும்பத் தெரிவித்தார்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் இங்கு பதிலை மீண்டும் கொண்டு சென்று அறிவிப்பதைக் குறிக்கிறது; தமிழில் ‘திரும்பத் தெரிவித்தார்’ என்பது அந்தச் செய்தியனுப்பும் பொருளையும் திரும்புதல் என்ற கூறையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: דִּבְרֵי הָעָם
  choice: மக்களின் வார்த்தைகளை
  rationale: ‘வார்த்தைகள்’ என்ற மூலத்தின் கண்கூடான பெயர்ச்சொல்லைப் பாதுகாக்கிறது; ‘பதில்’ எனச் சுருக்கி விளக்கவில்லை.
- source_word: אֶל יְהוָה
  choice: யாவேயிடம்
  rationale: மோசே மக்களின் வார்த்தைகளை யாரிடம் தெரிவித்தார் என்ற திசை மற்றும் பெறுநரைக் தமிழில் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால் அதை ஒரு பட்டமாக மாற்றாமல் பாதுகாக்கிறது; ‘யாவே’ என்பது Yahweh என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பு.
- issue: נַעֲשֶׂה என்பதைக் கீழ்ப்படிதல் சார்ந்த சொல்லாக வழங்கலாமா
  choice: நாங்கள் செய்வோம்
  alternative: நாங்கள் கீழ்ப்படிவோம்
  rationale: உடன்படிக்கைச் சூழல் கீழ்ப்படிதலை உள்ளடக்கியபோதிலும், எபிரெய வினை நேரடியாக ‘செய்வோம்’ என்றே கூறுகிறது; மூலத்தின் சொற்பொருளையும் அதன் மறைமுகத் தத்துவ அழுத்தத்தையும் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘பதிலளித்து … என்றார்கள்’ என்பது எபிரெய மூலத்திலுள்ள இரண்டு பேச்சு வினைகளையும் பாதுகாக்கிறது. ‘ஒருசேர’ என்பது கூட்டுப் பதிலைத் தெளிவாக்குகிறது; ‘திரும்பத் தெரிவித்தார்’ என்பது தமிழில் இயல்பாக இருந்து, மூல வினையின் ‘திரும்பக் கொண்டுவருதல்’ என்ற உருவகத்தையும் ஓரளவு தக்கவைக்கிறது.
