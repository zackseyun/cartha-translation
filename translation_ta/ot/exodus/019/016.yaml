  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיֹ֣ת הַ/בֹּ֗קֶר וַ/יְהִי֩ קֹלֹ֨ת וּ/בְרָקִ֜ים וְ/עָנָ֤ן כָּבֵד֙ עַל הָ/הָ֔ר וְ/קֹ֥ל שֹׁפָ֖ר חָזָ֣ק מְאֹ֑ד וַ/יֶּחֱרַ֥ד כָּל הָ/עָ֖ם אֲשֶׁ֥ר בַּֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: ta
  text: மூன்றாம் நாள் காலை வந்தபோது, இடிமுழக்கங்களும் மின்னல்களும் உண்டாயின; மலையின்மேல் அடர்ந்த மேகம் இருந்தது; கொம்பின் முழக்கம்[a] மிகவும் உரத்ததாக இருந்தது[b]; முகாமில் இருந்த மக்கள் அனைவரும் நடுங்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘ஷோஃபாரின் முழக்கம்.’ ஷோஃபார் என்பது பொதுவாக விலங்கின் கொம்பினால் செய்யப்பட்ட ஓர் ஊதுகருவி.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘மிகவும் வலிமையானது’; இங்கு இது முழக்கத்தின் தீவிரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי בִּהְיֹת הַבֹּקֶר
  choice: மூன்றாம் நாள் காலையானபோது
  rationale: எபிரெயக் கதைத் தொடர் அமைப்பையும் காலத்தைக் குறிக்கும் infinitive construct-ஐயும் இயல்பான நவீன தமிழில் ஒருங்கிணைக்கிறது; தேவையற்ற ‘அது நிகழ்ந்தது’ என்பதைச் சேர்க்கவில்லை.
- source_word: קֹלֹת וּבְרָקִים
  choice: இடிமுழக்கங்களும் மின்னல்களும்
  rationale: בְרָקִים உடன் இணைந்துள்ளதால் קֹלֹת இங்கு இடிமுழக்கங்களைக் குறிப்பதே சூழலுக்கு ஏற்றது; இரண்டின் பன்மையும் காக்கப்படுகிறது.
- source_word: עָנָן כָּבֵד
  choice: அடர்ந்த மேகம்
  rationale: כָּבֵד என்பதன் அடிப்படைப் பொருள் ‘கனமான’ என்றாலும், மேகத்தோடு வரும்போது அதன் அடர்த்தியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל הָהָר
  choice: மலையின்மேல்
  rationale: עַל என்பதன் இடவியல் பொருளை நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: קֹל שֹׁפָר
  choice: கொம்பின் முழக்கம்
  rationale: שֹׁפָר என்பது விலங்குக் கொம்பினால் செய்யப்பட்ட ஊதுகருவி; பொதுவான ‘எக்காளம்’ என்பதைவிட மூலச்சொல்லின் கருவி வடிவத்தைத் தெளிவாகக் காக்கிறது.
- source_word: חָזָק מְאֹד
  choice: மிகவும் உரத்துக் கேட்டது
  rationale: சொற்பொருளில் ‘மிகவும் வலிமையானது’; ஒலியைச் சார்ந்த சூழலில் அதன் தீவிரத்தை இயல்பான தமிழில் ‘மிகவும் உரத்துக் கேட்டது’ என வழங்குகிறது.
- source_word: וַיֶּחֱרַד
  choice: நடுங்கினார்கள்
  rationale: அச்சம் அல்லது கலக்கத்தால் உடல் நடுங்கும் பொருளைத் தருகிறது; ‘பயந்தார்கள்’ என்று உணர்ச்சியை மட்டும் கூறி மிகையாக விளக்கவில்லை.
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: முகாமில் இருந்த மக்கள் அனைவரும்
  rationale: எபிரெய உறவுத்தொடரின் முழுப் பொருளையும் இயல்பான தமிழ் சொல் வரிசையில் காக்கிறது.
theological_decisions:
- issue: சீனாய் மலையில் இறைத்தோற்றத்துடன் தொடர்புடைய இயற்கை நிகழ்வுகள்
  choice: காட்சியையும் ஒலிகளையும் விளக்கவுரை சேர்க்காமல் நேரடியாக விவரித்தல்
  alternative: קֹלֹת என்பதை விண்ணுலக ‘குரல்கள்’ என மொழிபெயர்த்தல்
  rationale: மின்னல்களுடன் இணைந்துள்ள சூழலில் ‘இடிமுழக்கங்கள்’ என்பதே மிகச் சாத்தியமான பொருள். இருப்பினும், வசனத்தில் இல்லாத பிற்கால இறையியல் விளக்கங்களை மொழிபெயர்ப்புக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைந்த நடை. மூலத்தின் தொடர்ச்சியான ‘וַיְהִי’ அமைப்புகளை அசட்டான மறுமொழியாக்கமின்றி இயல்பான தமிழ் வாக்கியங்களாக வழங்குகிறது. அனைத்து அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
