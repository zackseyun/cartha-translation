base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: ta
  text: மோசே தேவனிடம் ஏறிச் சென்றார். அப்போது யாவே மலையிலிருந்து அவரை நோக்கிக் கூப்பிட்டு, “யாக்கோபின் வீட்டாரிடம் நீ இவ்வாறு சொல்; இஸ்ரவேலின் மகன்களுக்கு[a] அறிவி:” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் பிள்ளைகளுக்கு” அல்லது “இஸ்ரவேல் மக்களுக்கு.” எபிரெய மூலத்தில் “இஸ்ரவேலின் மகன்களுக்கு” என்று உள்ளது; இது ஒரு கூட்டத்தைக் குறிக்கும் ஆண்பால் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: ஏறிச் சென்றார்
  rationale: மேல்நோக்கிய இடப்பெயர்ச்சியை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: הָאֱלֹהִים
  choice: தேவனிடம்
  rationale: இச்சூழலில் இஸ்ரவேலின் தேவனையே குறிக்கிறது; எபிரெய மொழியின் முன்னொட்டுடன் கூடிய குறிப்புச் சுட்டைத் தமிழில் தனியே மொழிபெயர்ப்பது இயல்பல்ல.
- source_word: וַיִּקְרָא אֵלָיו
  choice: அவரைக் கூப்பிட்டு
  rationale: קרא אֶל என்பதன் ‘ஒருவரை நோக்கிக் கூப்பிடுதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִן הָהָר
  choice: மலையிலிருந்து
  rationale: உடனடிச் சூழலில் குறிக்கப்படும் சீனாய் மலையைச் சரியாகக் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: என்றார்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவத்தை இயல்பான தமிழ் மேற்கோள் அமைப்பில் தருகிறது.
- source_word: כֹּה תֹאמַר
  choice: நீ இப்படிச் சொல்ல வேண்டும்
  rationale: அதிகாரபூர்வமான தெய்வீகச் செய்தியை அறிமுகப்படுத்தும் கட்டளைத் தொனியையும் ‘இவ்வாறு’ என்ற பொருளையும் காக்கிறது.
- source_word: לְבֵית יַעֲקֹב
  choice: யாக்கோபின் வீட்டாரிடம்
  rationale: ‘யாக்கோபின் வீடு’ என்ற கூட்டு அடையாளத்தைச் சொற்சொல்லாகக் கடினப்படுத்தாமல், குடும்பம் அல்லது வம்சக்கூட்டம் என்ற பொருளில் இயல்பாகத் தருகிறது.
- source_word: וְתַגֵּיד
  choice: இதை அறிவிக்க வேண்டும்
  rationale: נגד என்பதன் Hiphil வடிவத்திலுள்ள ‘தெரிவித்தல்/அறிவித்தல்’ பொருளைத் தக்கவைத்து, முந்தைய ‘சொல்ல வேண்டும்’ என்பதுடன் உள்ள இணை அமைப்பையும் வேறுபாட்டையும் காட்டுகிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்கு
  rationale: בְּנֵי என்ற ஆண்பால் பன்மை வடிவத்தை வெளிப்படையாகக் காத்து, ‘யாக்கோபின் வீட்டார்’ என்பதுடனான கவிதைநடை இணைப்பையும் பாதுகாக்கிறது; அதன் கூட்டுப்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: לִבְנֵי יִשְׂרָאֵל என்பதிலுள்ள ஆண்பால் கூட்டுச் சொல்
  choice: இஸ்ரவேலின் மகன்களுக்கு
  alternative: இஸ்ரவேல் மக்களுக்கு / இஸ்ரவேலின் பிள்ளைகளுக்கு
  rationale: மூலத்தின் இலக்கண ஆண்பாலையும் இணை அமைப்பையும் முதன்மை உரையில் காக்கிறது; இது ஆண்களை மட்டுமே குறிக்க வேண்டியதில்லை என்ற உண்மையான கூட்டுப்பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. தொடரும் நேர்கூற்றைக் காட்ட வசனத்தின் முடிவில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘வீட்டார்’ என்பது வம்சக்கூட்டப் பொருளை இயல்பாகத் தருகிறது; ‘மகன்கள்’ என்ற மூலவடிவம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
