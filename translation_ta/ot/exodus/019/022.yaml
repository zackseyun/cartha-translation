  text: וְ/גַ֧ם הַ/כֹּהֲנִ֛ים הַ/נִּגָּשִׁ֥ים אֶל יְהוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן יִפְרֹ֥ץ בָּ/הֶ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: ta
  text: யாவேயை அணுகும்[a] ஆசாரியர்களும்கூடத் தங்களைப் பரிசுத்தப்படுத்திக்கொள்ள வேண்டும்; இல்லையெனில், யாவே அவர்கள்மேல் வெடித்தெழுவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயிடம் நெருங்கிவரும்.” இது வழிபாடு அல்லது பணிவிடைக்காக இறைசந்நிதியை அணுகுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவர்கள்மேல் வெடித்துப் புறப்படுவார்.” எபிரெயச் சொல் யாவேயின் தீர்ப்பு திடீரென வெளிப்படுவதைச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: ஆசாரியர்களும்கூட
  rationale: முந்தைய கட்டளையுடன் இவ்வெச்சரிக்கையை இணைத்து, ஆசாரியர்களும் இதற்கு விதிவிலக்கல்லர் என்ற சேர்க்கை வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: வழிபாட்டுச் சூழலில் כֹּהֲנִים என்பதற்கான நிலையான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: யாவேயிடம் நெருங்கிவரும்
  rationale: נגשׁ என்ற வினை இறைசந்நிதியை வழிபாட்டு அல்லது பணிவிடை நோக்கில் அணுகுவதைக் குறிக்கிறது; ‘நெருங்கிவரும்’ அதன் தொடர்ச்சியான பங்கேற்புவினைத் தன்மையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது; வசனத்தின் இரு இடங்களிலும் மீளுரையைத் தக்கவைக்கிறது.
- source_word: יִתְקַדָּשׁוּ
  choice: தங்களைப் பரிசுத்தப்படுத்திக்கொள்ள வேண்டும்
  rationale: Hitpael வடிவத்தின் தற்சார்பு பொருளையும், வழிபாட்டுக்காகத் தங்களைப் பரிசுத்தமாக ஆயத்தப்படுத்தும் கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: פֶּן
  choice: இல்லையெனில்
  rationale: கட்டளையை மீறினால் ஏற்படும் ஆபத்தான விளைவை எச்சரிக்கும் எதிர்மறை நோக்கை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: יִפְרֹץ בָּהֶם
  choice: அவர்களுக்கு எதிராகத் திடீரெனப் பாய்வார்
  rationale: פרץ குறிக்கும் திடீர், கட்டுப்படுத்த முடியாத வெளிப்பாட்டின் உருவகத்தையும், בָהֶם மற்றும் சூழல் உணர்த்தும் எதிரான தண்டனைத் திசையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்லாமல் நான்கெழுத்து இறைப்பெயரே இருமுறை வருகிறது; ஆகவே பெயரை ஒலிபெயர்த்து, அதன் மீளுரையையும் தக்கவைக்கிறது.
- issue: יִפְרֹץ בָּהֶם יְהוָה என்ற எச்சரிக்கையின் தன்மை
  choice: யாவே அவர்களுக்கு எதிராகத் திடீரெனப் பாய்வார்
  alternative: யாவே அவர்கள்மேல் வெடித்துப் புறப்படுவார்
  rationale: சீனாய் மலையின் சூழலில் இது எல்லைமீறலுக்கான திடீர் இறைத் தீர்ப்பைச் சித்தரிக்கிறது. தண்டனையின் குறிப்பிட்ட முறையைச் சேர்க்காமல், மூலத்தின் தீவிர உருவகத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் எழுதப்பட்டுள்ளது. ‘பரிசுத்தப்படுத்திக்கொள்ள’ என்பது வழிபாட்டுச் சூழலின் கண்ணியத்தையும் தற்சார்பு வினையையும் காக்கிறது. மூலத்தின் திடீர் தீர்ப்பு உருவகம் பிரதான உரையிலும் அடிக்குறிப்பிலும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
