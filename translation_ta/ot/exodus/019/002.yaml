base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: ta
  text: அவர்கள் ரெபிதீமிலிருந்து புறப்பட்டு, சீனாய் வனாந்தரத்துக்கு வந்து, வனாந்தரத்தில் முகாமிட்டார்கள். அங்கே இஸ்ரவேல் மலைக்கு எதிரே[a] முகாமிட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மலைக்கு முன்பாக.’ எபிரெய முன்னிடைச்சொல், ஒன்றை எதிர்நோக்கியோ அதன் முன்புறத்திலோ உள்ள இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: נסע என்பது பயணக் குறிப்புகளில் முகாமைக் கலைத்துப் புறப்படுவதைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מֵרְפִידִים
  choice: ரெபிதீமிலிருந்து
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; מֵ־ முன்னொட்டு ‘இலிருந்து’ எனக் கொடுக்கப்பட்டுள்ளது.
- source_word: וַיָּבֹאוּ
  choice: வந்து
  rationale: בוא என்பதன் வருதல் அல்லது சென்றடைதல் என்ற பரந்த பொருளை, தொடரின் இயல்பான ஓட்டத்துடன் ‘வந்து’ வெளிப்படுத்துகிறது.
- source_word: מִדְבַּר סִינַי
  choice: சீனாய் வனாந்தரம்
  rationale: מִדְבָּר என்பது மக்கள் குடியிருப்பு குறைந்த வறண்ட வனாந்தரப் பகுதியைக் குறிக்கிறது; ‘வனாந்தரம்’ பொருளை மிகக் குறுக்காமல் காக்கிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதற்கு நவீனத் தமிழில் இயல்பான ‘முகாமிடு’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: மூலத்தில் מִדְבָּר மீண்டும் வருவதால், தமிழிலும் அதே சொல் மீண்டும் வைக்கப்பட்டுள்ளது.
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: அங்கே இஸ்ரவேல் ... முகாமிட்டது
  rationale: שָׁם என்பதன் இட வலியுறுத்தல் ‘அங்கே’ என முன்னிறுத்தப்பட்டுள்ளது. எபிரெயத்தில் ஒருமை வினையுடன் வரும் கூட்டு தேசியப் பெயரான ‘இஸ்ரவேல்’, தமிழிலும் ஒருமைக் கூட்டுப் பொருளாகக் காக்கப்பட்டுள்ளது.
- source_word: נֶגֶד הָהָר
  choice: மலைக்கு எதிரே
  rationale: נֶגֶד குறிக்கும் எதிர்நோக்கிய அல்லது முன்புறமான இடநிலையை ‘எதிரே’ இயல்பாக வெளிப்படுத்துகிறது; துல்லியமான திசையமைப்பை தேவையின்றி நிர்ணயிப்பதில்லை.
