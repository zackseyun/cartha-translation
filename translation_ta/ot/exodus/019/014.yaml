base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: ta
  text: மோசே மலையிலிருந்து மக்களிடம் இறங்கிச் சென்று, மக்களைப் புனிதப்படுத்தினார்[a]. அவர்கள் தங்கள் ஆடைகளைத் துவைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களைப் பரிசுத்தப்படுத்தினார்,” அல்லது “மக்களைப் புனிதத்திற்காக வேறுபிரித்தார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: இறங்கி வந்து
  rationale: ירד கீழ்நோக்கிய நகர்வைக் குறிக்கிறது. மலையிலிருந்து மக்களிடம் வந்ததை நவீன தமிழில் இயல்பாகத் தெரிவிக்க ‘இறங்கி வந்து’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִן הָהָר
  choice: மலையிலிருந்து
  rationale: உடனடி சூழலில் הַר என்பது சீனாய் மலையைக் குறிக்கிறது; இவ்வசனத்தில் பெயரைச் சேர்க்காமல் எபிரெய உரையின் பொதுவான ‘மலை’ வடிவம் காக்கப்படுகிறது.
- source_word: אֶל הָעָם
  choice: மக்களிடம்
  rationale: עָם என்பதன் இயல்பான பொருள் ‘மக்கள்’; ‘சபை’ என மொழிபெயர்ப்பது மூலத்தில் இல்லாத அமைப்பு சார்ந்த பொருளைச் சேர்க்கும்.
- source_word: וַיְקַדֵּשׁ
  choice: புனிதப்படுத்தினார்
  rationale: קדשׁ என்பதன் பியேல் வடிவம் இங்கு தேவனைச் சந்திப்பதற்காக மக்களைச் சடங்குரீதியாக ஆயத்தப்படுத்தி வேறுபிரித்ததைக் குறிக்கிறது. ‘புனிதப்படுத்தினார்’ அதன் பரிசுத்த மொழியையும் செயப்படுபொருள் அமைப்பையும் காக்கிறது; அடிக்குறிப்பு பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: הָעָם
  choice: மக்களை
  rationale: எபிரெய உரையில் மீண்டும் வரும் ‘மக்கள்’ என்ற சொல்லைத் தெளிவுக்கும் மூல அமைப்புக்கும் ஏற்ப தக்கவைக்கிறது.
- source_word: וַיְכַבְּסוּ
  choice: துவைத்தார்கள்
  rationale: כבס குறிப்பாக ஆடைகளைத் துவைப்பதைக் குறிக்கிறது; ‘துவைத்தார்கள்’ என்பது இயல்பான, துல்லியமான தமிழாக்கம்.
- source_word: שִׂמְלֹתָם
  choice: தங்கள் ஆடைகளை
  rationale: שִׂמְלָה உடை அல்லது ஆடையைக் குறிக்கிறது. பன்மையையும் உடைமைத் தொடர்பையும் ‘தங்கள் ஆடைகளை’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சீனாய் மலையில் தேவன் வெளிப்படுவதற்கு முன் நிகழும் சடங்குசார் பரிசுத்த ஆயத்தத்தை மொழிபெயர்த்தல்
  choice: மக்களைப் புனிதப்படுத்தினார்
  alternative: மக்களைப் பரிசுத்தப்படுத்தினார்; மக்களைப் புனிதமானவர்களாக வேறுபிரித்தார்; மக்களை ஆயத்தப்படுத்தினார்
  rationale: இங்கு கூறப்படுவது வெறும் ஒழுக்க மாற்றமோ பொது ஆயத்தமோ அல்ல; தேவனைச் சந்திப்பதற்காக மக்களைப் பரிசுத்த நோக்கத்திற்கென வேறுபிரித்துச் சடங்குரீதியாக ஆயத்தப்படுத்துதல். ‘புனிதப்படுத்தினார்’ இதைச் சுருக்கமாகக் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியான செயல்கள் காக்கப்பட்டுள்ளன; தமிழின் இயல்புக்காக இறுதி செயல் தனி வாக்கியமாக வழங்கப்பட்டுள்ளது.
