base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: ta
  text: அப்போது மோசே மக்களைக் கடவுளைச் சந்திப்பதற்காக முகாமிலிருந்து வெளியே கொண்டுவந்தார்; அவர்கள் மலையின் அடிவாரத்தில்[a] நிலைகொண்டு நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மலையின் கீழ்ப்பகுதியில்.’ எபிரெயச் சொற்றொடர் மலையின் தாழ்வான பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம், மோசே மக்களை வெளியே வரச் செய்தார் என்ற காரணவினைப் பொருளைத் தருகிறது. ‘வெளியே கொண்டுவந்தார்’ என்பது வழிநடத்தும் முறையைத் தேவையின்றி சேர்க்காமல் அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: לִקְרַאת
  choice: சந்திப்பதற்காக
  rationale: இந்தச் சொல் ஓர் எதிர்கொள்ளல் அல்லது சந்திப்பை நோக்கிய நகர்வைக் குறிக்கிறது. இச்சூழலில் ‘சந்திப்பதற்காக’ என்பது நோக்கத்தையும் இயக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு குறிப்பிட்ட ஒரே கடவுளையே சுட்டுகிறது. தமிழில் ‘கடவுள்’ என்பது இயல்பான, தெளிவான மொழிபெயர்ப்பு.
- source_word: מִן הַמַּחֲנֶה
  choice: முகாமிலிருந்து வெளியே
  rationale: மக்கள் புறப்பட்ட இடம் முகாம் என்பதையும், அவர்கள் அதிலிருந்து வெளியே கொண்டுவரப்பட்டதையும் இந்தச் சொற்றொடர் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּתְיַצְּבוּ
  choice: நிலைகொண்டு நின்றார்கள்
  rationale: יצב என்பதன் ஹித்பாயேல் வடிவம் வெறுமனே நிற்பதைவிட, தங்கள் இடத்தில் உறுதியாக அல்லது ஆயத்தமாக நிற்பதைக் குறிக்கலாம். ‘நிலைகொண்டு நின்றார்கள்’ அந்த நோக்கமுள்ள நிலைப்பாட்டை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: בְּתַחְתִּית
  choice: அடிவாரத்தில்
  rationale: மலையைப் பற்றிய இச்சூழலில் இச்சொல் அதன் கீழ்ப்பகுதி அல்லது அடிப்பகுதியைக் குறிக்கிறது. ‘அடிவாரத்தில்’ என்பது மலையின் கீழே புதைந்திருப்பது போன்ற தவறான எண்ணத்தைத் தவிர்த்து, இயல்பாக இடத்தைக் குறிக்கிறது.
- source_word: הָהָר
  choice: மலை
  rationale: சீனாய் நிகழ்வின் சூழலில் הַר என்பதற்கு ‘மலை’ என்பதே பொருத்தமானது; சூழல் குறிப்பிட்ட மலையைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: சீனாய் இறைத்தோற்ற நிகழ்வில் הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: அந்தக் கடவுள்
  rationale: எபிரெயச் சொல்லில் சுட்டுத் தன்மை இருந்தாலும், இங்கு இஸ்ரவேலின் உடன்படிக்கைக் கடவுளையே குறிக்கிறது. தமிழில் ‘அந்தக் கடவுள்’ என்பது தேவையற்ற வேறுபாட்டை உணர்த்தக்கூடும்; ‘கடவுள்’ மூலத்தின் தெளிவான குறிப்பை இயல்பாகக் காக்கிறது.
- issue: בְּתַחְתִּית என்பதன் இடவியல் பொருள்
  choice: மலையின் அடிவாரத்தில்
  alternative: மலையின் கீழே
  rationale: இச்சூழலில் மக்கள் மலையின் கீழ்ப்பகுதி அல்லது அடிப்பகுதியில் நின்றதையே சொற்றொடர் குறிக்கிறது. ‘மலையின் கீழே’ என்பது அவர்கள் மலையின் நேரடிக் கீழ் இருந்ததாகப் புரிந்துகொள்ளப்படும் வாய்ப்புள்ளதால், இறையியல் அல்லது அற்புத விளக்கத்தை மொழிபெயர்ப்புக்குள் திணிக்காமல் ‘அடிவாரத்தில்’ என வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வாசிப்பிற்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘நிலைகொண்டு நின்றார்கள்’ என்பது மூலத்தில் உள்ள நோக்கமுள்ள நிலைப்பாட்டைக் காக்கிறது; ‘அடிவாரம்’ இடவியல் தெளிவை வழங்குகிறது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘மலையின் அடிவாரத்தில்’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
