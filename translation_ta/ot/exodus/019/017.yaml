  source_fidelity: மூல எபிரெயத்தின் காரணவினை வַיּוֹצֵא (‘வெளியே கொண்டுவந்தார்’), நோக்கத்தைச் சுட்டும் לִקְרַאת (‘சந்திப்பதற்காக’), மையப் பெயர்ச்சொல் הָאֱלֹהִים (‘கடவுள்’), மற்றும் நோக்கமுள்ள நிலைப்பாட்டைச் சுட்டும் וַיִּתְיַצְּבוּ (‘நிலைகொண்டு நின்றார்கள்’) ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. בְּתַחְתִּית הָהָר என்பதற்கு ‘மலையின் அடிவாரத்தில்’ என்பது சூழலுக்கேற்ற, இயல்பான பொருளைத் தருகிறது.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் வாசிப்பதற்கு இயல்பாகவும் உள்ளது. ‘மக்களைக் கடவுளைச் சந்திப்பதற்காக முகாமிலிருந்து வெளியே கொண்டுவந்தார்’ என்ற சொல் வரிசை நோக்கத்தையும் புறப்படும் இடத்தையும் தெளிவாக வெளிப்படுத்துகிறது. ‘நிலைகொண்டு நின்றார்கள்’ முறையான, ஆயத்தமான நிலைப்பாட்டின் நுணுக்கத்தைப் பாதுகாக்கிறது.
