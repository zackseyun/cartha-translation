  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: ta
  text: மோசே யாவேயிடம், “மக்கள் சீனாய் மலைக்கு ஏறிச் செல்ல முடியாது. ஏனெனில், ‘மலைக்கு எல்லை அமைத்து, அதைப் புனிதப்படுத்து’ என்று சொல்லி நீரே எங்களை உறுதியாக எச்சரித்தீர்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: לֹא יוּכַל הָעָם
  choice: மக்கள் ... ஏற முடியாது
  rationale: இங்கு יכל அனுமதியின்மையை மட்டும் அல்லாமல் இயலாமையை வெளிப்படுத்துகிறது; தமிழ் வாக்கிய அமைப்புக்கேற்ப வினையுடன் இணைக்கப்பட்டுள்ளது.
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: சீனாய் மலையின்மேல் ஏற
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தையும், אֶל இங்கு மலையை நோக்கி அல்லது அதன்மேல் ஏறும் சூழலையும் இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மோசே கூறியதற்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச்சொல்.
- source_word: אַתָּה
  choice: நீரே
  rationale: வினைச்சொல்லிலேயே இரண்டாம் நபர் குறிக்கப்பட்டிருந்தும் தனிப்பெயர் வந்துள்ள வலியுறுத்தலை ‘நீரே’ பிரதிபலிக்கிறது.
- source_word: הַעֵדֹתָה בָּנוּ
  choice: எங்களைக் கடுமையாக எச்சரித்தீர்
  rationale: עוד என்பதன் ஹிபீல் வடிவம் இச்சூழலில் முறையான, வலுவான எச்சரிப்பைக் குறிக்கிறது; அதன் சாட்சியமளித்தல் அல்லது உறுதியாகக் கட்டளையிடுதல் சார்ந்த பரப்பை அடிக்குறிப்பு காக்கிறது.
- source_word: הַגְבֵּל אֶת הָהָר
  choice: மலைக்கு எல்லை அமைத்து
  rationale: גבל என்பதன் ஹிபீல் கட்டளை மலையின் அணுகலை வரையறுக்கும் எல்லையை நிறுவுவதைக் குறிக்கிறது.
- source_word: וְקִדַּשְׁתּוֹ
  choice: அதைப் புனிதப்படுத்து
  rationale: קדשׁ என்பதன் பியேல் வடிவம் மலையைப் புனிதமானதாகத் தனியே ஒதுக்குவதைச் சுட்டுகிறது; ‘புனிதப்படுத்து’ வழிபாட்டுச் சார்ந்த பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: எபிரெய மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: הַעֵדֹתָה בָּנוּ என்பதன் பொருள்
  choice: எங்களைக் கடுமையாக எச்சரித்தீர்
  alternative: எங்களிடம் சாட்சியமளித்தீர்; எங்களுக்கு உறுதியாகக் கட்டளையிட்டீர்
  rationale: சீனாய் மலையின் எல்லையை மீறாதிருக்க முன்பு கொடுக்கப்பட்ட அறிவுறுத்தலைச் சூழல் சுட்டுவதால் ‘எச்சரித்தீர்’ முதன்மைப் பொருளாக இயல்பாகிறது; எனினும் வினையின் முறையான சாட்சி அல்லது பொறுப்புறுத்தல் சார்ந்த நிழற்பொருளை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் மரியாதைப் பன்மை (‘நீரே’, ‘எச்சரித்தீர்’) கையாளப்பட்டுள்ளது. ‘எல்லை அமைத்து’, ‘புனிதப்படுத்து’ ஆகியவை வாசிக்க எளிதாகவும் மூலத்தின் வழிபாட்டு மற்றும் சட்டச் சார்ந்த நுணுக்கங்களைத் தக்கவைக்கும் வகையிலும் உள்ளன.
