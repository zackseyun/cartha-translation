  rationale: இயக்கத்தின் இலக்கைக் குறிக்கும் எபிரெய முன்னிடைச்சொல்லைத் துல்லியமாக்க ‘சீனாய் மலைக்கு ஏறிச் செல்ல’ என மாற்றப்பட்டது. மூலத்தில் நேரடியாக இல்லாத ‘கடுமையாக’ என்பதற்குப் பதிலாக, வினையின் முறையான வலியுறுத்தலைக் காக்கும் ‘உறுதியாக’ பயன்படுத்தப்பட்டது. பெயருடன் வேற்றுமை உருபை இயல்பாக இணைக்க ‘யாவேயிடம்’ எனச் சீரமைக்கப்பட்டது. அடிக்குறிப்பு மூல வினையின் மாற்றுப்பொருள் பரப்பைத் தக்கவைக்கிறது.
