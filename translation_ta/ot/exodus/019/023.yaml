  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் நன்றாகப் பிரதிபலிக்கப்படுகிறது: மக்களின் இயலாமை, சீனாய் மலை, யாவேயின் வலியுறுத்தப்பட்ட முன் எச்சரிக்கை, எல்லையிடுதல், புனிதப்படுத்துதல் ஆகியவை உள்ளன. ஆனால் אֶל הַר סִינָי என்பதற்கு ‘சீனாய் மலையின்மேல்’ என்பது இலக்கிடத்தைவிட ஏற்கெனவே மலையின் மேல் இருப்பதைக் குறிக்கும் நிழலைத் தரலாம்; ‘சீனாய் மலைக்கு ஏறிச் செல்ல’ மூலத்தின் இயக்கத்தையும் இலக்கையும் தெளிவாகக் காக்கிறது.'
  naturalness: ‘மோசே யாவேவிடம்’ என்பதற்கு ‘மோசே யாவேயிடம்’ என்பது ஒலிப்பிலும் வேற்றுமை உருபிலும் இயல்பான நவீனத் தரத் தமிழ். மேற்கோள் உரைக்குள் ‘நீரே’ என்ற மரியாதை வடிவத்துக்கு ஏற்ப, ‘எங்களிடம்’/‘எங்களை’ போன்ற வடிவங்கள் இயல்பாக உள்ளன. ‘எங்களைக் கடுமையாக எச்சரித்தீர்’ இயல்பானது; ஆனால் ‘கடுமையாக’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத தீவிரத்தைச் சேர்க்கிறது. ‘உறுதியாக எச்சரித்தீர்’ முறையான வலியுறுத்தலைத் தருகிறது.
  terminology: ‘யாவே’, ‘சீனாய் மலை’, ‘எல்லை அமைத்து’, ‘புனிதப்படுத்து’ ஆகியவை பொருத்தமானவை. הָעֵדֹתָה בָּנוּ என்பதற்கான மாற்றுப் பொருள்களை அடிக்குறிப்பு முறையாகக் காக்கிறது. ஆங்கில audit trail-இல் உள்ள மேற்கோள்-அறிமுகச் சொல் தொடர்பான மாற்று வாசகத்தைத் தமிழில் தனியாக அடிக்குறிப்பாக்கத் தேவையில்லை; தமிழில் ‘என்று சொல்லி’ போதுமான நேரடியான வடிவமாகும்.
