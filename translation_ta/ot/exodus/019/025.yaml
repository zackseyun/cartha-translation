  text: அப்படியே மோசே மக்களிடம் இறங்கிச் சென்று, அவர்களிடம் பேசினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: இறங்கிச் சென்று
  rationale: மலையிலிருந்து மக்களிடம் கீழே சென்ற இயக்கத்தை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֶל־הָעָם
  choice: மக்களிடம்
  rationale: இலக்கு அல்லது அணுகுதலைக் குறிக்கும் אֶל என்பதையும், குறிப்பிட்ட இஸ்ரவேல் மக்களைக் குறிக்கும் הָעָם என்பதையும் இயல்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: அவர்களிடம் பேசினார்
  rationale: இங்கு நேரடி உரையின் உள்ளடக்கம் தரப்படாததால், தமிழில் இயல்பாகவும் ஆங்கில ஆலோசனை அடுக்குடன் ஒத்ததாகவும் ‘பேசினார்’ என வழங்கப்படுகிறது; அசல் வினைச்சொல்லின் தொடர்புரைத்தல் பொருள் காக்கப்படுகிறது.
