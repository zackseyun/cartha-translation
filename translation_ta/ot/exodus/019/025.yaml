  terminology: ‘மோசே’, ‘மக்கள்’, ‘பேசினார்’ ஆகியவை நிலையானவும் பொருத்தமானவையும். சிறப்புப் பெயர் அல்லது இறையியல் சொல் தொடர்பான சிக்கல் இல்லை.
