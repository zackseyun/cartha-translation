  source_fidelity: முதற் வாக்கியம் எபிரெய הוֹלֵךְ וְחָזֵק מְאֹד என்பதன் தொடர்ச்சியான தீவிரமாதலைப் பொருத்தமாகத் தருகிறது. ஆனால் “மோசே பேசும்போதெல்லாம்” என்பது மூலத்தின் imperfect வடிவங்கள் அனுமதிக்கும் நிகழ்ந்துகொண்டிருக்கும்/மீள்நிகழும் பொருளைவிட, ஒவ்வொரு முறையும் என்ற தெளிவான நிபந்தனை-மீள்நிகழ்வைச் சற்றே அதிகப்படுத்துகிறது. இரு imperfect வினைகளின் காட்சிநடையைக் “பேசிக்கொண்டிருந்தார் … பதிலளித்துக்கொண்டிருந்தார்” என்று தருவது பாதுகாப்பானது.
  naturalness: “மேலும் மேலும் மிகவும் வலுத்துக்கொண்டே போனது” என்பதில் “மேலும் மேலும்” மற்றும் “மிகவும்” இணைவு தமிழில் சற்றே கனமாக உள்ளது. “மேலும் மேலும் வலுத்துக்கொண்டே போனது” இயல்பாகவும், ஒலிக்குரிய சூழலில் தெளிவாகவும் உள்ளது. திருத்திய இரண்டாம் வாக்கியம் நவீன நிலையான தமிழில் இயல்பான தொடர்ச்சிக் காட்சியை வழங்குகிறது.
  terminology: “எக்காளத்தின் ஒலி,” “மோசே,” “கடவுள்,” மற்றும் “குரலால்” ஆகியவை பொருத்தமானவை. בְּקוֹל-ஐ “குரலால்” என வைத்திருப்பது இடிமுழக்கம் என்ற விளக்கத்தை முதன்மை உரைக்குள் இறக்குமதி செய்யாமல் மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
