  yaml_path: translation/ot/exodus/019/019.yaml
  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: ta
  text: எக்காளத்தின் ஒலி மேலும் மேலும் வலுத்துக்கொண்டே போனது[a]. மோசே பேசிக்கொண்டிருந்தார்; கடவுள் அவருக்குக் குரலால் பதிலளித்துக்கொண்டிருந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் மேலும் உரத்துக்கொண்டே போனது.” எபிரெயத்தில், எக்காளத்தின் ஒலி “சென்று, மிகவும் வலிமைபெற்றது” என்று சொல்லப்படுகிறது; இது தொடர்ந்து அதிகரிப்பதைக் குறிக்கும் வழக்கு.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இடிமுழக்கத்துடன் பதிலளித்தார்” அல்லது “கேட்கத்தக்க வகையில் பதிலளித்தார்.” எபிரெய உரை “குரலால்” என்று கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: …வலுத்துக்கொண்டே போனது
  rationale: இந்தக் கதைத் தொடர்ச்சிச் சொல், அடுத்து வரும் தொடர்ச்சியான அதிகரிப்பைக் குறிக்கும் அமைப்புடன் இணைக்கப்பட்டுள்ளது; தனியே ‘அது நடந்தது’ என்று மொழிபெயர்ப்பது தமிழில் இயல்பற்றதாக இருக்கும்.
- source_word: קוֹל הַשּׁוֹפָר
  choice: எக்காளத்தின் ஒலி
  rationale: קוֹל என்பது ‘ஒலி’ அல்லது ‘குரல்’ எனப் பொருள்படலாம்; שׁוֹפָר உடன் வருவதால் ‘ஒலி’ இயல்பானது. எக்காளம் என்பது ஊதப்படும் கொம்புக் கருவியைத் தெளிவாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: மேலும் மேலும் மிகவும் வலுத்துக்கொண்டே போனது
  rationale: இந்த எபிரெய அமைப்பு தொடர்ச்சியாக மிகுந்த வலிமை பெறுவதைச் சொல்கிறது. ‘வலுத்தது’ என்பது மூலத்தின் பரந்த படிமத்தைப் பாதுகாக்கிறது; ‘உரத்தது’ என்பது அதை ஒலியளவுக்கு மட்டும் சுருக்கிவிடும்.
- source_word: מֹשֶׁה יְדַבֵּר
  choice: மோசே பேசும்போதெல்லாம்
  rationale: இங்கு imperfect வடிவம் நிகழ்வினுள் தொடர்ந்த அல்லது மீண்டும் நிகழ்ந்த செயலைக் காட்டுகிறது. ‘பேசும்போதெல்லாம்’ என்பது கடவுளின் பதிலுடன் உள்ள தொடர்ச்சியான தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַעֲנֶנּוּ
  choice: அவருக்குப் பதிலளித்தார்
  rationale: ענה மற்றும் ஆண்பால் ஒருமை பின்னொட்டு சேர்ந்து ‘அவருக்குப் பதிலளித்தார்’ என்ற பொருளைத் தருகின்றன; இங்குள்ள ‘அவர்’ மோசேயைக் குறிக்கிறது.
- source_word: בְּקוֹל
  choice: குரலால்
  rationale: மூலத்தில் இருப்பது ‘குரலால்/ஒலியால்’ என்ற பரந்த சொற்றொடர். அதை ‘இடிமுழக்கத்தால்’ என்று விளக்கமாகச் சுருக்காமல், மூலத்தின் தெளிவின்மையைப் பாதுகாக்க ‘குரலால்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: சீனாயில் கடவுள் அளித்த பதிலின் இயல்பு
  choice: கடவுள் மோசேக்குக் ‘குரலால்’ பதிலளித்தார்
  alternative: கடவுள் இடிமுழக்கத்தில் பதிலளித்தார்; அல்லது அவர் கேட்கும்படியாகப் பதிலளித்தார்
  rationale: בְּקוֹל என்பது ‘குரலால்’ அல்லது ‘ஒலியால்’ எனப் பொருள்படக்கூடியது; இந்த இடத்தில் எபிரெய உரை இடிமுழக்கம் என்று வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே விளக்கத்தைத் தீர்மானித்துவிடாமல், மூலத்தின் இறையியல் அழுத்தமும் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான அதிகரிப்பை ‘வலுத்துக்கொண்டே போனது’ என்றும், மோசே பேசுவதற்கும் கடவுள் பதிலளிப்பதற்கும் இடையிலான மீள்நிகழ்வை ‘பேசும்போதெல்லாம்’ என்றும் இயல்பாக வெளிப்படுத்துகிறது. ‘குரலால்’ என்ற சொல் திட்டமிட்டு நேரடியாக வைக்கப்பட்டு, அதை இடிமுழக்கம் எனத் தீர்மானிக்கும் விளக்கம் அடிக்குறிப்பில் மட்டும் தரப்பட்டுள்ளது.
