  text: לֹא תִגַּ֨ע בּ֜/וֹ יָ֗ד כִּֽי סָק֤וֹל יִסָּקֵל֙ אוֹ יָרֹ֣ה יִיָּרֶ֔ה אִם בְּהֵמָ֥ה אִם אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּ/מְשֹׁךְ֙ הַ/יֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָ/הָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: ta
  text: அவனை எந்தக் கையும் தொடக்கூடாது[a]. அவன் கல்லெறிந்து கொல்லப்பட வேண்டும்; அல்லது அம்பால் எய்யப்பட்டுக் கொல்லப்பட வேண்டும்[b]. விலங்கோ மனிதனோ, உயிரோடு இருக்கக்கூடாது. செம்மறியாட்டுக் கொம்பின் நீண்ட முழக்கம் கேட்கும்போது[c], அவர்கள் மலையின்மேல் ஏறலாம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பின்னொட்டை இன்னும் பொதுவாக எடுத்தால், “அதை எந்தக் கையும் தொடக்கூடாது.” எல்லையை மீறியவனை நேரடியாகத் தொடாமல், தொலைவிலிருந்தே தண்டிக்க வேண்டும் என்பதே கருத்து.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “துளைத்துக் கொல்லப்பட வேண்டும்.” எபிரெய வினை எய்யப்படுவதைக் குறிக்கலாம்; இச்சூழலில் அம்பால் எய்யப்படுவதே பெரும்பாலும் கருதப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “யோபேல் நீட்டிக்கப்படும்போது.” இது செம்மறியாட்டுக் கொம்பில் எழுப்பப்படும் நீண்ட முழக்கத்தைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: அவனை எந்தக் கையும் தொடக்கூடாது
  rationale: ‘ஒரு கை அவனைத் தொடக்கூடாது’ என்ற எபிரெய சட்ட மொழிநடையை இயல்பான தமிழில் தருகிறது. ஆண்பால் ஒருமை பின்னொட்டு மலையின் எல்லையை மீறிய குற்றவாளியைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
- source_word: סָקוֹל יִסָּקֵל
  choice: அவன் கல்லெறிந்து கொல்லப்பட வேண்டும்
  rationale: வினையெச்ச முழுவடிவமும் வினையும் சேர்ந்த எபிரெய அமைப்பு தண்டனையின் உறுதியையும் கட்டாயத்தையும் வலியுறுத்துகிறது; ‘கொல்லப்பட வேண்டும்’ அதனைத் தெளிவாக்குகிறது.
- source_word: יָרֹה יִיָּרֶה
  choice: அம்பெய்து கொல்லப்பட வேண்டும்
  rationale: ירה என்பது இச்சூழலில் தொலைவிலிருந்து, பெரும்பாலும் அம்பால், எய்வதைக் குறிக்கலாம். ‘அம்பெய்து’ என்பது நவீன வாசகருக்குச் செயலைத் தெளிவாகக் காட்டுகிறது; ‘துளைக்கப்படுதல்’ என்ற விரிந்த பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: விலங்கானாலும் மனிதனானாலும்
  rationale: இரு வகைகளுக்கும் ஒரே தண்டனை பொருந்துவதை இயல்பான தமிழ் இணைப்பால் தெரிவிக்கிறது.
- source_word: לֹא יִחְיֶה
  choice: அது உயிரோடு இருக்கக்கூடாது
  rationale: விலங்கு அல்லது மனிதன் என்ற இரண்டையும் உள்ளடக்குவதற்காகப் பொதுவான ஒருமைச் சுட்டுப்பெயர் பயன்படுத்தப்பட்டுள்ளது; நீதித்தீர்ப்பின் கட்டாயத் தன்மை பாதுகாக்கப்படுகிறது.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: செம்மறியாட்டுக் கொம்பின் நீண்ட முழக்கம் கேட்கும்போது
  rationale: יובל இங்கு செம்மறியாட்டுக் கொம்பையோ அதன் முழக்கத்தையோ குறிக்கிறது; משׁך அந்த ஒலி நீட்டிக்கப்படுவதைச் சொல்கிறது. தமிழில் அதன் பண்பாட்டு மற்றும் ஒலிசார் பொருள் வெளிப்படையாக வழங்கப்பட்டுள்ளது.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: அவர்கள் மலையின்மேல் ஏறலாம்
  rationale: நீண்ட கொம்பொலிக்குப் பிறகு முந்தைய தடை நீங்குவதால், எளிய எதிர்காலத்தைவிட அனுமதியைக் காட்டும் ‘ஏறலாம்’ சூழலுக்கு ஏற்றது.
theological_decisions:
- issue: ‘எந்தக் கையும் அவனைத் தொடக்கூடாது’ என்பதில் ஆண்பால் ஒருமை பின்னொட்டின் குறிப்பு
  choice: மலையின் எல்லையை மீறிய குற்றவாளியைக் குறிக்கிறது
  alternative: தொடர்பால் விலக்கப்பட்டதாகிய பொருளை அல்லது உயிரினத்தைப் பொதுவாகக் குறிக்கிறது
  rationale: அடுத்துவரும் கல்லெறிதல் அல்லது அம்பெய்தல் நேரடித் தொடுதலின்றித் தொலைவிலிருந்து நிறைவேற்றப்படும் தண்டனையைக் காட்டுகிறது. ஆகவே தனிப்பட்ட குறிப்பு உடனடிச் சூழலின் சட்டத் தர்க்கத்துக்கு நன்றாகப் பொருந்துகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சட்டவிதியின் கண்ணியமானவும் உறுதியானவும் உள்ள தொனி காக்கப்பட்டுள்ளது. ‘கல்லெறிந்து கொல்லப்பட வேண்டும்’ மற்றும் ‘அம்பெய்து கொல்லப்பட வேண்டும்’ என்பவை மரணத்தண்டனையை மறைக்காமல் தெளிவாகக் கூறுகின்றன. மனிதன்/விலங்கு இரண்டையும் தொடரும் வாக்கியத்தில் உள்ளடக்க ‘அது’ பயன்படுத்தப்பட்டுள்ளது; இது தமிழில் இயல்பான பொதுச் சுட்டாகும். எல்லா அடிக்குறிப்பு குறிகளும் உரையில் அவை விளக்கும் இடங்களிலேயே உள்ளன.
