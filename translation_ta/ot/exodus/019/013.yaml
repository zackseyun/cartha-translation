  to: அவனை எந்தக் கையும் தொடக்கூடாது[a]. அவன் கல்லெறிந்து கொல்லப்பட வேண்டும்; அல்லது அம்பால் எய்யப்பட்டுக் கொல்லப்பட வேண்டும்[b]. விலங்கோ மனிதனோ, உயிரோடு இருக்கக்கூடாது. செம்மறியாட்டுக் கொம்பின் நீண்ட முழக்கம் கேட்கும்போது[c], அவர்கள் மலையின்மேல் ஏறலாம்.
