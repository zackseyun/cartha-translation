  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִישִׁ֔י לְ/צֵ֥את בְּנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בַּ/יּ֣וֹם הַ/זֶּ֔ה בָּ֖אוּ מִדְבַּ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள்[a] எகிப்து நாட்டிலிருந்து புறப்பட்டு மூன்றாம் மாதத்தில், இதே நாளில்[b], சீனாய் வனாந்தரத்திற்கு வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘இஸ்ரவேலின் மகன்கள்.’ ‘இஸ்ரவேலின் பிள்ளைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இந்த நாளில்’ என்றும் மொழிபெயர்க்கலாம். அவர்கள் வந்த துல்லியமான நாளை இச்சொற்றொடர் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: மூன்றாம் மாதத்தில்
  rationale: חֹדֶשׁ இங்குள்ள காலக்குறிப்பில் ‘மாதம்’ என்பதைக் குறிக்கிறது; ‘மூன்றாம் மாதத்தில்’ என்பது இயல்பான, துல்லியமான தமிழ்.
- source_word: לְצֵאת
  choice: புறப்பட்ட பிறகு
  rationale: ל உடன் வரும் infinitive construct, இஸ்ரவேல் மக்கள் வெளியேறிய நிகழ்வை இந்தக் காலக்குறிப்பின் தொடக்கப் புள்ளியாகக் காட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்[a]
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘இஸ்ரவேலின் மகன்கள்.’ ஆனால் இங்கு அது ஆண்களை மட்டும் அல்லாமல் உடன்படிக்கை மக்களாகிய முழு இனத்தையும் குறிக்கும் வழக்கமான பெயர்; நவீனத் தமிழில் தவறான பாலினக் கட்டுப்பாட்டைத் தவிர்க்க ‘இஸ்ரவேல் மக்கள்’ எனத் தரப்பட்டு, நேர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: אֶרֶץ என்பதன் ‘நாடு/நிலம்’ என்ற கூறை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: בַּיּוֹם הַזֶּה
  choice: இதே நாளில்[b]
  rationale: הַזֶּה என்பதிலுள்ள அண்மைச் சுட்டையும் வலியுறுத்தலையும் ‘இதே’ இயல்பாக வெளிப்படுத்துகிறது; சரியான நாளை வலியுறுத்தலாம் என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בָּאוּ
  choice: வந்தார்கள்
  rationale: בוא என்பதன் நேரடியான பொருள் ‘வருதல்’; ‘சென்றடைந்தார்கள்’ என்பதைக் காட்டிலும் குறைவான விளக்கச் சேர்க்கையுடன் மூலத்தைப் பின்பற்றுகிறது.
- source_word: מִדְבַּר סִינָי
  choice: சீனாய் வனாந்தரம்
  rationale: מִדְבָּר என்பது குடியிருப்பும் பயிரிடுதலும் குறைந்த வனாந்தரப் பகுதியைக் குறிக்கிறது; ‘பாலைவனம்’ எனக் கொடுத்தால் நிலத்தின் வறட்சியை அளவுக்கு அதிகமாகக் குறிப்பாக்கக்கூடும்.
theological_decisions:
- issue: உடன்படிக்கை மக்களைக் குறிக்கும் בְּנֵי יִשְׂרָאֵל என்ற பெயரின் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: எபிரெய மொழியில் ஆண்பால் பன்மை வடிவம் இருந்தாலும், சூழலில் அது ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் மக்களனைவரையும் குறிக்கிறது. நவீனத் தமிழில் ‘மகன்கள்’ என்பது ஆண்களை மட்டுமே குறிக்கும் எனப் புரிந்துகொள்ளப்பட வாய்ப்புள்ளதால், தேசிய-உடன்படிக்கை அடையாளத்தைத் தெளிவாகத் தரும் ‘மக்கள்’ தேர்ந்தெடுக்கப்பட்டது; மூல வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டுள்ளது. ‘வனாந்தரம்’ என்பது இச்சூழலில் நிலவகையை அளவுக்கு மீறிக் குறிப்பாக்காமல் தரும் நிலைபெற்ற சொல். காலக்குறிப்பின் எபிரெய அமைப்பு தமிழில் தெளிவாக இருக்கச் சொல் வரிசை இயல்பாக்கப்பட்டுள்ளது.
