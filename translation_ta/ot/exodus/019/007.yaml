  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: ta
  text: மோசே வந்து, மக்களின் மூப்பர்களை அழைத்து, யாஹ்வே தனக்குக் கட்டளையிட்ட இந்த வார்த்தைகள் அனைத்தையும் அவர்களுக்கு முன்பாக வைத்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பது பார்வைநிலைக்கேற்ப ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படலாம்; இங்கு மோசே யெகோவாவிடமிருந்து மக்களிடம் திரும்புவதால் ‘வந்து’ இயல்பாக உள்ளது.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: மக்களின் மூப்பர்களை அழைத்து
  rationale: קרא + ל என்பது ஒருவரைக் கூப்பிடுதல் அல்லது வரவழைத்தல் எனப் பொருள்படும். ‘அழைத்து’ என்பது சூழலுக்குப் பொருத்தமானதும், ‘வரவழைத்தார்’ என்பதிலுள்ள சற்றுக் கடுமையான அதிகாரத் தொனியைத் தவிர்ப்பதுமாகும்.
- source_word: זִקְנֵי הָעָם
  choice: மக்களின் மூப்பர்கள்
  rationale: זְקֵנִים என்பது வயதிலும் சமூக அங்கீகாரத்திலும் முதிர்ந்த பிரதிநிதிகளைக் குறிக்கிறது; ‘மூப்பர்கள்’ அதன் சமூக மற்றும் பிரதிநிதித்துவ நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: அவர்கள்முன் வைத்தார்
  rationale: שׂים + לפני என்பதன் நேரடிப் பொருள் ‘முன் வைத்தல்’; செய்தியை எடுத்துரைத்தல் என்ற சூழலிலும் இந்தத் தமிழ் சொற்றொடர் இயல்பாக உள்ளது.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள் அனைத்தையும்
  rationale: דְּבָרִים என்பது ‘வார்த்தைகள்’, ‘காரியங்கள்’, ‘விஷயங்கள்’ எனப் பொருள்படலாம். முந்தைய வசனங்களில் கொடுக்கப்பட்ட இறைச்செய்தியை மோசே எடுத்துரைப்பதால் ‘வார்த்தைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: யெகோவா தனக்குக் கட்டளையிட்டிருந்த
  rationale: கட்டளை மோசே அதை மூப்பர்கள்முன் வைப்பதற்கு முன்னரே கொடுக்கப்பட்டதை ‘கட்டளையிட்டிருந்த’ தெளிவாக்குகிறது; ஆண்பால் ஒருமை பின்னொட்டு மோசேயைக் குறிப்பதால் ‘தனக்கு’ பயன்படுத்தப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் உடன்படிக்கைப் பெயரான நான்கு எழுத்துத் திருப்பெயர் நேரடியாக இடம்பெறுகிறது; தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவமான ‘யெகோவா’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: இறைப்பெயர் יְהוָה-ஐ மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாஹ்வே
  rationale: மூலவசனம் பொதுப்பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரைப் பயன்படுத்துகிறது. அதைப் பெயராகவே வெளிப்படுத்த ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘கர்த்தர்’ பெயரைப் பட்டமாக மாற்றிவிடும், ‘யாஹ்வே’ மூல உச்சரிப்பை மீட்டமைக்கும் மற்றொரு சாத்திய வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கதைநடையின் செயல்வரிசை இயல்பான தமிழ் வாக்கியமாக இணைக்கப்பட்டுள்ளது; ‘அவர்கள்முன் வைத்தார்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது.
