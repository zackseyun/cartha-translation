  text: וְ/הָי֥וּ נְכֹנִ֖ים לַ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י יֵרֵ֧ד יְהוָ֛ה לְ/עֵינֵ֥י כָל הָ/עָ֖ם עַל הַ֥ר סִינָֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: ta
  text: மூன்றாம் நாளுக்குத் தயாராக இருக்கட்டும்; ஏனெனில் மூன்றாம் நாளில் யாவே மக்கள் அனைவரின் கண்முன்னே சீனாய் மலையின்மேல் இறங்கி வருவார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ
  choice: அவர்கள் ... இருக்கட்டும்
  rationale: முந்தைய கட்டளைகளைத் தொடரும் இந்தச் சூழலில், இறந்தகால வடிவம் அறிவுறுத்தல் அல்லது கட்டளை வலிமை பெறுகிறது; தமிழ் மொழியில் “இருக்கட்டும்” இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נְכֹנִים
  choice: ஆயத்தமாக
  rationale: இங்கு இந்தச் சொல் நிகழவிருக்கும் இறைத்தோற்றத்திற்காகத் தயாராக இருப்பதைக் குறிக்கிறது; “ஆயத்தமாக” என்பது தெளிவான, கண்ணியமான நவீனத் தமிழ்.
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளுக்காக
  rationale: לְ குறிக்கும் நோக்குநேரத்தைப் பாதுகாக்கிறது; அதை வெறும் காலக்கெடுவாக மாற்றாமல், அந்த நாளை முன்னிட்டு ஆயத்தமாவதைச் சொல்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: בְ என்பதன் இயல்பான காலக் குறிப்பு தமிழில் இடவேற்றுமையால் தெளிவாக வெளிப்படுகிறது.
- source_word: יֵרֵד
  choice: இறங்கி வருவார்
  rationale: ירד என்பதன் கீழ்நோக்கிய இயக்கத்தையும், மக்கள் இருக்கும் இடத்தை நோக்கிய வருகையையும் இயல்பான தமிழில் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְעֵינֵי כָל הָעָם
  choice: மக்கள் அனைவரின் கண் முன்னே
  rationale: “கண்களுக்கு முன்பாக” என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் பாதுகாத்து, நிகழ்வு அனைவருக்கும் புலப்படும் என்பதைத் தெரிவிக்கிறது.
- source_word: עַל הַר סִינָי
  choice: சீனாய் மலையின்மேல்
  rationale: இறங்கிவரும் இடமாக மலையைச் சுட்டும் עַל என்பதற்கு நேரான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: யாவே இறங்குவதை மக்கள் காண்பதன் வெளிப்பாடு
  choice: மக்கள் அனைவரின் கண் முன்னே
  alternative: மக்கள் அனைவரும் காணும்படி
  rationale: மாற்று வடிவமும் பொருளைத் தெளிவுபடுத்தும்; ஆனால் தேர்ந்த வடிவம் לְעֵינֵי என்பதிலுள்ள “கண் முன்னே” என்ற உயிரோட்டமான உருவகத்தைப் பாதுகாக்கிறது, நிகழ்வின் முறையை அதற்கு அப்பால் விளக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், இறைத்தோற்றச் சூழலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. வசனத்தில் தனி அடிக்குறிப்பு தேவைப்படும் அளவிலான உரைமாற்று இல்லை; வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு அதன் குறியிடப்பட்ட இடத்துடன் பொருந்தாததால் தமிழில் சேர்க்கப்படவில்லை.
