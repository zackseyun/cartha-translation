  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ אֶל הָ/עָ֔ם וְ/קִדַּשְׁתָּ֥/ם הַ/יּ֖וֹם וּ/מָחָ֑ר וְ/כִבְּס֖וּ שִׂמְלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “மக்களிடம் போ. இன்றும் நாளையும் அவர்களைப் புனிதப்படுத்து[a]; அவர்கள் தங்கள் ஆடைகளைத் துவைக்கட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைப் புனிதமாகப் பிரித்துவை” அல்லது “அவர்களைப் புனிதமாக ஆயத்தப்படுத்து.”
    reason: קדשׁ என்ற சொல்லில் புனிதமாக்குதல், புனிதத்திற்கெனப் பிரித்துவைத்தல், இறைச்சந்திப்புக்காக ஆயத்தப்படுத்துதல் ஆகிய ஒன்றோடொன்று தொடர்புடைய பொருள்கள் உள்ளன.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் ஒலிப்பெயர்ப்பாக வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றார்
  rationale: வாவ் தொடர்வினையின் கதை முன்னேற்றும் இயல்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לֵךְ אֶל־הָעָם
  choice: மக்களிடம் போ
  rationale: நேரடியான கட்டளையையும் עָם என்பதன் கூட்டுச் சமூகப் பொருளையும் தெளிவாகத் தருகிறது.
- source_word: וְקִדַּשְׁתָּם
  choice: அவர்களைப் புனிதப்படுத்து
  rationale: சீனாயில் இறைச்சந்திப்புக்காக மக்களைப் பரிசுத்த நிலையில் ஆயத்தப்படுத்தும் சடங்கு சார்ந்த பொருளைப் பாதுகாக்கிறது; உள்ளார்ந்த ஒழுக்க மாற்றம் என்று மட்டும் குறுக்கவில்லை.
- source_word: הַיּוֹם וּמָחָר
  choice: இன்றும் நாளையும்
  rationale: இரு நாள் ஆயத்தக் காலத்தைக் குறிக்கும் இயல்பான, துல்லியமான தமிழாக்கம்.
- source_word: וְכִבְּסוּ שִׂמְלֹתָם
  choice: அவர்கள் தங்கள் ஆடைகளைத் துவைக்கட்டும்
  rationale: மக்களைக் குறிக்கும் பன்மை வினையையும் கட்டளையின் விளைவையும் காக்கிறது; שִׂמְלָה என்பதற்கு இங்கு பொதுவான ‘ஆடைகள்’ பொருத்தமானது.
theological_decisions:
- issue: קדשׁ என்பதன் சடங்கு மற்றும் பரிசுத்தப் பொருள்
  choice: புனிதப்படுத்து
  alternative: தூயவர்களாக ஒதுக்கிவை; புனிதமானவர்களாக ஆயத்தப்படுத்து
  rationale: இது வெறும் உடல் சுத்தத்தையோ உள்ளார்ந்த ஒழுக்க மாற்றத்தையோ மட்டும் குறிக்காமல், யாவேயைச் சந்திப்பதற்கான சடங்கு மற்றும் உடன்படிக்கைச் சார்ந்த ஆயத்தத்தைக் குறிக்கிறது.
- issue: יְהוָה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயரால் மாற்றாமல் ஒலிப்பெயர்ப்பாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘புனிதப்படுத்து’ என்ற சொல் சடங்கு-பரிசுத்த நுணுக்கத்தைத் தக்கவைக்கிறது; அதன் பொருள் வரம்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
