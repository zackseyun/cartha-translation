  text: אַתֶּ֣ם רְאִיתֶ֔ם אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/מִצְרָ֑יִם וָ/אֶשָּׂ֤א אֶתְ/כֶם֙ עַל כַּנְפֵ֣י נְשָׁרִ֔ים וָ/אָבִ֥א אֶתְ/כֶ֖ם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: ta
  text: எகிப்துக்கு நான் செய்ததை நீங்களே பார்த்தீர்கள். கழுகுகளின் சிறகுகளின்மேல் உங்களைச் சுமந்து, உங்களை என்னிடம் கொண்டுவந்ததையும் பார்த்தீர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַתֶּם רְאִיתֶם
  choice: நீங்களே பார்த்தீர்கள்
  rationale: தனியே இடம்பெறும் אַתֶּם முன்னிலைப்படுத்தும் வலியுறுத்தலை ‘நீங்களே’ இயல்பாகக் காக்கிறது; நிறைவுற்ற நேரடி அனுபவத்தைத் தமிழில் எளிய இறந்தகாலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: எகிப்துக்கு நான் செய்ததை
  rationale: לְמִצְרָיִם என்பது இங்கு இறைவனுடைய செயல்களால் பாதிக்கப்பட்ட தேசத்தைக் குறிக்கிறது. ‘எகிப்துக்கு’ என்பது எபிரெய வடிவின் சுருக்கத்தையும் கூட்டுத் தேசியக் குறிப்பையும் காக்கிறது.
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: உங்களைச் சுமந்து
  rationale: נשא என்பதன் அடிப்படைப் பொருளான சுமத்தல்/தாங்குதலை ‘சுமந்து’ இயல்பாகவும் பாதுகாப்பான விடுதலையின் உருவகத்துக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: கழுகுகளின் சிறகுகளின்மேல்
  rationale: காப்பும் வலிமையும் விரைவும் கொண்ட உருவகத்தை நெருக்கமாகக் காக்கும் மரபான சூழல்சார் மொழிபெயர்ப்பு. נְשָׁרִים என்பதன் பரந்த பறவைப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: உங்களை என்னிடம் கொண்டுவந்ததையும்
  rationale: אֵלָי என்பதன் நேரடிப் பொருள் ‘என்னிடம்/என்னிடத்திற்கு’. ‘என்னிடம்’ என்பது உறவுசார் நோக்கைச் சுட்டினாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘எனக்காக’ போன்ற கருத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: விடுதலையின் உறவுசார் நோக்கம்
  choice: உங்களை என்னிடம் கொண்டுவந்ததையும்
  alternative: உங்களை என்னிடமாகக் கொண்டுவந்ததையும் / உங்களை எனக்கென்று கொண்டுவந்ததையும்
  rationale: எகிப்திலிருந்து மீட்பு கடவுளிடம் வருவதில் முடிகிறது என்ற உறவுசார் இயக்கத்தை உரை தெரிவிக்கிறது. ஆனால் אֵלָי என்பதைக் கடந்த உடைமை அல்லது தனியுரிமைக் கருத்தைச் சேர்க்காமல் ‘என்னிடம்’ என மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதைமிக்க பன்மை முகவரியுடன் அமைக்கப்பட்டது. எபிரெய வசனத்தின் இரண்டு இணைந்த செயல்களையும் தமிழில் தெளிவாக்க, ‘பார்த்தீர்கள்’ இரண்டாம் கூறின் முடிவில் இயல்பாக மீள்கொள்ளப்பட்டது. உருவகத்தின் கவித்துவமும் மூலத்தின் உறவுசார் திறந்த தன்மையும் காக்கப்பட்டுள்ளன.
