  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: ta
  text: சீனாய் மலை முழுவதும் புகை சூழ்ந்திருந்தது; ஏனெனில் யாவே நெருப்பில் அதன்மேல் இறங்கியிருந்தார். அதன் புகை உலையின் புகையைப்போல்[a] மேலெழுந்தது; முழு மலையும் மிகவும் அதிர்ந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூளையின் புகையைப்போல்.”
    reason: כִּבְשָׁן என்பது உலையையோ சூளையையோ குறிக்கக்கூடும்; உண்மையான சொற்பொருள் மாற்றை வாசகருக்காகப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְהַר סִינַי
  choice: சீனாய் மலை
  rationale: இடப்பெயரையும் הַר என்பதையும் இயல்பான தமிழ் சொல்வரிசையில் தருகிறது. தொடக்க וְ தனியாக ‘இப்போது’ என்று காலப்பொருள் சேர்க்காமல், வாக்கியத் தொடர்ச்சியைச் சூழல் வழியே விடுகிறது.
- source_word: עָשַׁן כֻּלּוֹ
  choice: முழுவதும் புகை சூழ்ந்திருந்தது
  rationale: மலை முழுவதும் புகை நிறைந்திருந்த நிலையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; எபிரெய வினையின் புகை எழும்/புகை சூழும் கருத்தை தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: מִפְּנֵי אֲשֶׁר
  choice: ஏனெனில்
  rationale: இங்கு வரும் காரண உறவை நேரடியாகக் காட்டும் இயல்பான நவீனத் தமிழ் இணைப்புச்சொல்.
- source_word: יָרַד עָלָיו יְהוָה
  choice: யாவே அதன்மேல் இறங்கியிருந்தார்
  rationale: יָרַד என்பதன் கீழிறங்குதல் கருத்தையும் עָלָיו என்பதன் ‘அதன்மேல்’ உறவையும் காக்கிறது. காரண வாக்கியத்தில் முன்னதாக நிகழ்ந்த செயலை ‘இறங்கியிருந்தார்’ இயல்பாகக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருநாமத்தின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: בָּאֵשׁ
  choice: நெருப்பில்
  rationale: இறங்கிய விதம் அல்லது வெளிப்பாட்டைச் சுட்டும் בְּ முன்னிடைச்சொல்லின் பொருளை எளிய, தற்போதைய தமிழில் தருகிறது.
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: அதன் புகை மேலெழுந்தது
  rationale: ஆண்பால் ஒருமை பின்னொட்டை மலையைக் குறிப்பதாகக் கொண்டு, புகையின் மேல் நோக்கிய இயக்கத்தைத் தெளிவாகக் காக்கிறது.
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: உலையின் புகையைப்போல்
  rationale: כִּבְשָׁן என்பதற்கு உலை அல்லது சூளை என்ற இரு பொருத்தமான பொருள்கள் உள்ளன. ‘உலை’ தீவிரமான நெருப்பு மற்றும் புகை என்ற காட்சியைப் பொதுவாசகருக்கு உடனடியாக உணர்த்துகிறது; ‘சூளை’ அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וַיֶּחֱרַד
  choice: அதிர்ந்தது
  rationale: மலையின் வலுவான உடல் நடுக்கத்தை இயல்பான தமிழில் காட்டுகிறது; பயம் என்ற உளவியல் பொருளை மலையின்மேல் கட்டாயமாக ஏற்றவில்லை.
- source_word: כָּל הָהָר מְאֹד
  choice: மலை முழுவதும் மிகவும் அதிர்ந்தது
  rationale: כָּל என்பதன் முழுமையையும் מְאֹד என்பதன் வலியுறுத்தலையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்துத் தனிப்பெயர் வருகிறது. ஆகவே திருநாமத்தை ‘யாவே’ என்று ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது; குறிப்பிட்ட சமய மரபின் பட்டப்பெயரை உள்ளே கொண்டுவருவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் dignified நடையில் வடிவமைக்கப்பட்டது. ‘நெருப்பு’, ‘புகை’, ‘அதிர்ந்தது’ போன்ற இயல்பான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறி அது விளக்கும் ‘உலையின் புகையைப்போல்’ என்ற தொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
