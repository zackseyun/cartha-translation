base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: ta
  text: நீங்கள் எனக்கு ஆசாரியர்களின் ராஜ்யமாகவும் பரிசுத்தமான தேசமாகவும் இருப்பீர்கள்.[a] இஸ்ரவேல் மக்களிடம்[b] நீ பேச வேண்டிய வார்த்தைகள் இவையே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆசாரியத் தன்மையுள்ள ராஜ்யம்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் ஆசாரியர்களால் அமைந்த ஒரு ராஜ்யத்தையோ, ஆசாரியத் தன்மையால் குறிக்கப்படும் ஒரு ராஜ்யத்தையோ குறிக்கலாம். 1 பேதுரு 2:9-இல் தொடர்புடைய சொற்றொடர் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “இஸ்ரவேலின் மகன்களிடம்.” இந்த எபிரெய மரபுத்தொடர் ஆண் இஸ்ரவேலரை மட்டும் அல்லாமல் இஸ்ரவேல் மக்களனைவரையும் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: இருப்பீர்கள்
  rationale: היה என்பதன் முற்றுப்பெறாத வினைவடிவம் இங்கு உடன்படிக்கை அறிவிப்பின் எதிர்கால அல்லது விளைவு சார்ந்த பொருளைத் தருகிறது; தமிழில் ‘இருப்பீர்கள்’ அதன் வாக்குறுதி நயத்தை இயல்பாகக் காக்கிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: לִי உறவு அல்லது உரிமைச் சார்பைக் குறிக்கிறது; ‘எனக்கு’ என்பது மூலத்தின் அமைப்பை நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: ஆசாரியர்களின் அரசு
  rationale: எபிரெயக் கட்டமைப்புத் தொடர் நேரடியாக ஆசாரியர்களைக் கொண்ட அல்லது ஆசாரியத் தன்மை கொண்ட அரசைக் குறிக்கலாம். ‘ஆசாரியர்களின் அரசு’ என்ற மொழிபெயர்ப்பு ‘அரசு’ என்னும் பெயர்ச்சொல்லைக் காத்து, உண்மையான பொருள் இருமையையும் அடிக்குறிப்பில் சுட்டுகிறது.
- source_word: גּוֹי קָדוֹשׁ
  choice: பரிசுத்த தேசம்
  rationale: கூட்டு உடன்படிக்கை அடையாளத்தையும் இறைவனுக்கெனப் பிரித்தெடுக்கப்பட்ட நிலையையும் தரும் நிலையான, கண்ணியமான தமிழ் சொற்றொடர்.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: வார்த்தைகள் இவையே
  rationale: நேரடிப் பேச்சை அறிவுறுத்தும் சூழலில் דְּבָרִים என்பதற்கு ‘வார்த்தைகள்’ பொருத்தமானது; தமிழ் வாக்கிய ஒழுங்கில் ‘இவையே’ வலியுறுத்தலைக் காக்கிறது.
- source_word: תְּדַבֵּר
  choice: நீ சொல்ல வேண்டிய
  rationale: மோசேயை நோக்கிய ஒருமை ஆண்பால் கட்டளையின் வலிமையை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘சொல்ல வேண்டும்’ என்பதைக் காட்டிலும் தொடர்புச் சொற்றொடரில் இது ஓட்டமுடையது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், எபிரெய மரபுத்தொடர் இங்கு ஆண்களை மட்டும் அல்லாது இஸ்ரவேல் மக்களனைவரையும் குறிக்கிறது. நவீன தமிழில் ‘இஸ்ரவேலின் மக்கள்’ அந்தக் கூட்டு அர்த்தத்தைத் தெளிவாகத் தருகிறது; மூலத்தின் வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கை அழைப்பில் இஸ்ரவேலின் கூட்டு அடையாளம்
  choice: ஆசாரியர்களின் அரசு
  alternative: ஆசாரியத்துவ அரசு
  rationale: மூல எபிரெயம் அரசை ஆசாரியர்களால் அமைந்ததாகவோ ஆசாரியத் தன்மையால் குறிக்கப்பட்டதாகவோ புரிந்துகொள்ள இடமளிக்கிறது. முதன்மை உரை பெயர்ச்சொற்களின் அமைப்பைக் காக்கிறது; அடிக்குறிப்பு அந்தப் பொருள் இருமையைத் திறந்துவைக்கிறது.
- issue: இஸ்ரவேல் மக்களைக் குறிக்கும் பாலினமுள்ள எபிரெய மரபுத்தொடர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: בְּנֵי יִשְׂרָאֵל வடிவில் ஆண்பால் என்றாலும், இச்சூழலில் உடன்படிக்கை மக்களனைவரையும் குறிக்கும் மரபுத்தொடராக உள்ளது. தமிழில் பாலினக் கட்டுப்பாட்டைத் தவறாக உணர்த்தாத வகையில் பொருள் மொழிபெயர்க்கப்பட்டு, வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’, ‘பரிசுத்தம்’, ‘இஸ்ரவேல்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தொடர்ச்சிக்காக வைக்கப்பட்டுள்ளன. அடிக்குறி [a] தொடர்புடைய தெளிவின்மை தோன்றும் சொற்றொடருக்குப் பின், [b] ‘இஸ்ரவேலின் மக்கள்’ என்பதற்குப் பின் அமைக்கப்பட்டுள்ளன.
