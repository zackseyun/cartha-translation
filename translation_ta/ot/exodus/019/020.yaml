  naturalness: ‘சீனாய் மலையின் உச்சியில் இறங்கினார்’ மற்றும் ‘மேலே ஏறிச் சென்றார்’ இயல்பான நவீனத் தமிழாக உள்ளன. ஆயினும் ‘சீனாய் மலையின்மேல், அதன் உச்சிக்கு இறங்கி வந்தார்’ என்பது மூலத்தின் இடவியல் தொடர்ச்சியைத் தெளிவாகக் காட்டுகிறது; ‘மேலே ஏறினார்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
  terminology: יהוה தனிப்பெயராகவே தரப்பட வேண்டும்; ‘ஆண்டவர்’ போன்ற பட்டமாக மாற்றப்படவில்லை என்பது நல்லது. ஆனால் POB ஆங்கிலத் தீர்மானத்தில் உள்ள ‘Yahweh’க்கு இணங்க, மறுகட்டமைக்கப்பட்ட உச்சரிப்பை பிரதிபலிக்கும் ‘யாவே’ பயன்படுத்தப்பட வேண்டும்; ‘யெகோவா’ ஆங்கில audit trail-இன் பெயர்வடிவத்துடன் ஒத்திசைவதில்லை.
