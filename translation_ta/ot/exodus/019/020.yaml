base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: ta
  text: யாவே சீனாய் மலையின்மேல், அதன் உச்சிக்கு இறங்கி வந்தார்.[a] பின்பு யாவே மோசேயை மலையின் உச்சிக்கு அழைத்தார்; மோசே மேலே ஏறினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே சீனாய் மலையின் உச்சியில் இறங்கினார்.”
    reason: எபிரெயத்தில் ‘சீனாய் மலையின்மேல், மலையின் உச்சிக்கு’ என்று இடமும் இலக்கும் தொடர்ச்சியாக வருகின்றன; தமிழில் ‘மலையின் உச்சியில்’ என்றும் இயல்பாகக் கூறலாம்.
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: இறங்கினார்
  rationale: ירד என்பது கீழே செல்லுதல் அல்லது இறங்குதல் என்று பொருள்படும். இங்கு கடவுள் மலையின் உச்சியில் இறங்கிய இயக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் திருமறையில் வரும் יהוה என்ற தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- source_word: הַר סִינַי
  choice: சீனாய் மலை
  rationale: இடப்பெயருக்குரிய தெளிவான, வழக்கிலுள்ள தமிழ் வடிவம்.
- source_word: אֶל רֹאשׁ הָהָר
  choice: மலையின் உச்சியில் / மலையின் உச்சிக்கு
  rationale: רֹאשׁ என்பதன் நேர்ப்பொருள் ‘தலை’; மலையைக் குறிக்கும்போது அது இயல்பாக ‘உச்சி’ எனப் பொருள்படுகிறது. முதல் நிகழ்வில் அசைவின் முடிவிடம், இரண்டாவது நிகழ்வில் அழைப்பின் திசை ஆகியவற்றுக்கேற்ப வேற்றுமை உருபுகள் மாறுகின்றன.
- source_word: וַיִּקְרָא
  choice: அழைத்தார்
  rationale: קרא இங்கு மோசேயைத் தம்மிடம் வருமாறு அழைப்பதைக் குறிக்கிறது; ‘அழைத்தார்’ என்பது நேரடியானதும் அளவுக்கு மீறி விளக்காததுமான தமிழ்.
- source_word: לְמֹשֶׁה
  choice: மோசேயை
  rationale: தமிழில் வழக்கிலுள்ள தனிப்பெயர் வடிவத்தையும், ‘அழைத்தார்’ வினைக்குத் தேவையான வேற்றுமையையும் பயன்படுத்துகிறது.
- source_word: וַיַּעַל
  choice: மேலே ஏறிச் சென்றார்
  rationale: עלה என்பது மேலே செல்லுதல் அல்லது ஏறுதல். மலையுச்சியை நோக்கிய இயக்கத்தைத் தெளிவாகக் காட்டி, முன்பு வரும் ‘இறங்கினார்’ என்பதுடன் உள்ள எதிரிணையைப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டமல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயர் நேரடியாக வருகிறது. அதை ‘ஆண்டவர்’ என்று மாற்றாமல் தனிப்பெயராகவே தரப்பட்டுள்ளது. பழைய தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும் ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டுள்ளது; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டமைக்கும் மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கதைநடையின் தொடர்ச்சியை ‘பின்பு’ மற்றும் அரைப்புள்ளி மூலம் இயல்பாக்கியுள்ளோம்; மூலத்தில் இருமுறை வரும் இறைப்பெயர் இருமுறையும் பேணப்பட்டுள்ளது.
