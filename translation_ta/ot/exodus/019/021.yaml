source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: ta
  text: யாவே மோசேயிடம், “கீழே போ; மக்கள் யாவேயைக் பார்க்க[a] தடையை மீறி அவரிடம் செல்லாதபடி அவர்களை எச்சரி; இல்லையெனில் அவர்களில் பலர் விழுவார்கள்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காண.” எபிரெய வினைச்சொல் ‘பார்’ அல்லது ‘காண்’ என்று பொருள்படலாம்; இங்கு யாவேயின் வெளிப்பாட்டைப் பார்க்க முயல்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “அவர்களிலிருந்து பலர் விழுவர்.” இச்சூழலில் ‘விழுதல்’ என்பது மரணத்தைக் குறிக்கலாம்; ஆனால் எபிரெய உரை அதை மேலும் வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமத்தின் நான்கு எபிரெய் எழுத்துகளைக் (יהוה) பட்டப்பெயராக மாற்றாமல், அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: רֵד
  choice: கீழே இறங்கிப் போ
  rationale: ירד என்பதன் கட்டளை வடிவத்திலுள்ள கீழ்நோக்கிய இயக்கத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעֵד בָּעָם
  choice: மக்களை எச்சரி
  rationale: இங்கு Hifil வடிவிலுள்ள עוד, மக்களுக்குக் கடுமையான எச்சரிக்கை கொடுப்பதைக் குறிக்கிறது.
- source_word: יֶהֶרְסוּ
  choice: தடையை மீறி வந்துவிடாதபடி
  rationale: சீனாய் மலையைச் சுற்றி விதிக்கப்பட்ட வரம்பை வலுக்கட்டாயமாக மீறி நெருங்குவதைச் சூழலுக்கேற்ற இயல்பான தமிழில் தெரிவிக்கிறது; ‘தடை’ என்பது உடனடியான சூழலால் விளக்கப்படும் பொருள்.
- source_word: לִרְאוֹת
  choice: பார்க்க
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சமாக இருந்து, யாவேயின் வெளிப்பாட்டைப் பார்க்க முயல்வதைச் சுட்டுகிறது; ‘காண’ என்பதும் சாத்தியம்.
- source_word: וְנָפַל מִמֶּנּוּ רָב
  choice: அவர்களில் பலர் விழுவார்கள்
  rationale: ‘அவர்களிலிருந்து பலர் விழுவர்’ என்ற எபிரெய் சொல்லமைப்பை இயல்பான தமிழாக்குகிறது; சூழலில் மரணம் உட்பொருளாக இருக்கலாம் என்றாலும், அதை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரால் மாற்றாமல் தமிழ் ஒலிபெயர்ப்பாக வழங்கப்பட்டது.
- issue: ‘விழுவார்கள்’ என்பதன் விளைவு
  choice: விழுவார்கள்
  alternative: இறந்துபோவார்கள்; அழிவார்கள்
  rationale: இந்த நியாயத்தீர்ப்புச் சூழலில் மரணம் குறிக்கப்படலாம்; ஆனாலும் נפל என்ற மூல வினை அதை வெளிப்படையாகச் சொல்லாததால் அந்தத் தெளிவின்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தடையை மீறி’ என்பது முந்தைய வசனங்களில் அமைக்கப்பட்ட எல்லையை நினைவூட்டுகிறது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
