base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: ta
  text: யாவே அவனிடம், “நீ கீழே போ. நீயும் உன்னோடு ஆரோனும் மேலே வர வேண்டும். ஆனால் ஆசாரியர்களும் மக்களும் யாவேயிடம் மேலே வருவதற்கு எல்லையை மீறிக்கொண்டு வரக்கூடாது; இல்லையெனில் அவர் அவர்களுக்கு எதிராக வெடித்தெழுவார்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எல்லையை மீறிக்கொண்டு மேலே வரக்கூடாது … அவர்களுக்கு எதிராக வெடித்தெழுவார்” என்பதற்கு, “தடையை உடைத்துக்கொண்டு மேலே வரக்கூடாது … அவர் அவர்கள்மேல் வெடித்துப் பாய்வார்” என்றும் மொழிபெயர்க்கலாம். மக்களின் அத்துமீறலுக்கும் யாவேயின் தீர்ப்புக்கும் உடைத்துக்கொண்டு செல்லும் ஒத்த உருவகங்கள் எபிரெயத்தில் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לֶךְ רֵד
  choice: நீ கீழே போ
  rationale: இரு கட்டளை வினைகளின் இயல்பான கூட்டு அர்த்தத்தைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וְעָלִיתָ אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: பிறகு நீயும் உன்னுடன் ஆரோனும் மேலே வாருங்கள்
  rationale: மேல்நோக்கிய இயக்கத்தையும், மோசே மீதான வலியுறுத்தலையும், ஆரோன் அவனுடன் வருவதையும் காக்கிறது; கூட்டு எழுவாய்க்கேற்ற இயல்பான தமிழ் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: ஆசாரியர்களும் மக்களும்
  rationale: வழிபாட்டுப் பணியாளர்களையும் பொதுமக்களையும் வேறுபடுத்தும் வழக்கமான, புரிந்துகொள்ளத்தக்க சொற்கள்.
- source_word: אַל יֶהֶרְסוּ לַעֲלֹת
  choice: மேலே வருவதற்காக அத்துமீறி வர வேண்டாம்
  rationale: நிர்ணயிக்கப்பட்ட எல்லையை வலுக்கட்டாயமாக மீறி நுழையும் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פֶּן יִפְרָץ בָּם
  choice: இல்லையெனில் அவர் அவர்களுக்கு எதிராகப் பாய்வார்
  rationale: திடீரென வெடித்தெழும் தெய்வீகத் தீர்ப்பின் வலிமையான உருவகத்தையும் எச்சரிக்கைத் தன்மையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; குறிப்பிட்ட உச்சரிப்பை முற்றிலும் உறுதிப்படுத்துவதாக இதைக் கருத வேண்டியதில்லை.
- issue: פֶּן יִפְרָץ בָּם என்பதில் மறைந்துள்ள எழுவாய்
  choice: அவர் அவர்களுக்கு எதிராகப் பாய்வார்
  alternative: யாவே அவர்களுக்கு எதிராகப் பாய்வார்
  rationale: சூழலில் எழுவாய் யாவே என்பது தெளிவாக இருந்தாலும், எபிரெய உரையின் சுட்டுப்பெயர் போன்ற தொடர்ச்சியைப் பேணி தேவையற்ற மறுபெயரிடலைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மலையைச் சார்ந்த ‘கீழே போ/மேலே வா’ என்ற திசை உருவகம் காக்கப்பட்டுள்ளது; தெய்வீகத் தீர்ப்பின் கடுமையும் மென்மைப்படுத்தப்படவில்லை.
