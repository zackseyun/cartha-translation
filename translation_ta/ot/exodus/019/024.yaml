- from: யாவே அவனிடம், “நீ கீழே போ. பிறகு நீயும் உன்னுடன் ஆரோனும் மேலே வாருங்கள். ஆனால் ஆசாரியர்களும் மக்களும் யாவேயிடம் மேலே வருவதற்காக அத்துமீறி வர வேண்டாம்; இல்லையெனில் அவர் அவர்களுக்கு எதிராகப் பாய்வார்[a]” என்றார்.
