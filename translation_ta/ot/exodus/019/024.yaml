    text: “எல்லையை மீறிக்கொண்டு மேலே வரக்கூடாது … அவர்களுக்கு எதிராக வெடித்தெழுவார்” என்பதற்கு, “தடையை உடைத்துக்கொண்டு மேலே வரக்கூடாது … அவர் அவர்கள்மேல் வெடித்துப் பாய்வார்” என்றும் மொழிபெயர்க்கலாம். மக்களின் அத்துமீறலுக்கும் யாவேயின் தீர்ப்புக்கும் உடைத்துக்கொண்டு செல்லும் ஒத்த உருவகங்கள் எபிரெயத்தில் பயன்படுத்தப்பட்டுள்ளன.
