  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: ta
  text: இப்போது, நீங்கள் என் குரலுக்குக் கவனமாகச் செவிகொடுத்து[a], என் உடன்படிக்கையைக் கடைப்பிடிப்பீர்களானால், எல்லா மக்களினங்களிலிருந்தும்[c] நீங்கள் எனக்கு அருமைச் சொத்தாக[b] இருப்பீர்கள்; ஏனெனில் பூமி முழுவதும் எனக்குச் சொந்தம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் குரலுக்கு உண்மையாகக் கீழ்ப்படிந்தால்.’ எபிரெய மொழியில் சொல்லர்த்தமாக ‘செவிகொடுத்து நீங்கள் செவிகொடுத்தால்’ என்று வரும் இந்த வலியுறுத்தல் அமைப்பு, கவனமாகவும் கீழ்ப்படிதலோடும் கேட்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் தனிச்சொத்தாக’ அல்லது ‘எனக்கே உரிய சிறப்புச் சொத்தாக.’
    reason: lexical_alternative
  - marker: c
    text: அதாவது, எல்லா மக்களினங்களின் நடுவிலிருந்து. அடுத்த கூற்று பூமி முழுவதும் கடவுளுக்கே சொந்தம் என்பதைத் தெளிவுபடுத்துகிறது.
    reason: cross_reference
