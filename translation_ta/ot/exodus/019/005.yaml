  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘குரலுக்குச் செவிகொடு,’ ‘உடன்படிக்கையைக் கடைப்பிடி,’ ‘அருமைச் சொத்து’ ஆகியவை மூலத்தின் உடன்படிக்கை மொழியையும் இயல்பான தமிழ் சொல்லோட்டத்தையும் சமநிலைப்படுத்துகின்றன.
