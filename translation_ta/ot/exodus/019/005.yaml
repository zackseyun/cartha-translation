- source_word: כִּי לִי כָּל־הָאָרֶץ
  choice: ஏனெனில் பூமி முழுவதும் எனக்குச் சொந்தம்
  rationale: כִּי அறிமுகப்படுத்தும் காரணத்தையும், לִי என்பதன் உரிமை வலியுறுத்தலையும் தெளிவாக வெளிப்படுத்துகிறது; இச்சூழலில் הָאָרֶץ ஒரு குறிப்பிட்ட நாட்டை அல்ல, முழுப் பூமியைக் குறிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் שׁמע என்பதை ‘செவிகொடு’ என்றா ‘கீழ்ப்படி’ என்றா மொழிபெயர்ப்பது
  choice: என் குரலுக்குக் கவனமாகச் செவிகொடுத்து
  alternative: என் குரலுக்கு உண்மையாகக் கீழ்ப்படிந்து
  rationale: இச்சொற்றொடர் கீழ்ப்படிதலை உள்ளடக்கியிருந்தாலும், மூலத்தின் கேட்பது சார்ந்த தெளிவான உருவகத்தை முதன்மை உரை பாதுகாக்கிறது; அடுத்து வரும் ‘உடன்படிக்கையைக் கடைப்பிடித்தால்’ கீழ்ப்படிதலின் நடைமுறைப் பரிமாணத்தை வெளிப்படுத்துகிறது.
- issue: סְגֻלָּה மூலம் கூறப்படும் இஸ்ரவேலின் தனிப்பட்ட நிலையை மிகைப்படுத்தாமல் தெரிவிப்பது
  choice: எல்லா மக்களினங்களிலிருந்தும் நீங்கள் எனக்கு அருமைச் சொத்தாக இருப்பீர்கள்
  alternative: எல்லா மக்களினங்களுக்கும் மேலாக நீங்கள் என் தனிச்சொத்தாக இருப்பீர்கள்
  rationale: தேர்ந்தெடுக்கப்பட்ட தனிப்பட்ட உடைமை என்ற கருத்தைப் பாதுகாக்கிறது; ஆனால் மற்ற மக்கள்மீது மதிப்பின் அடிப்படையிலான மேன்மையை உரையில் சேர்ப்பதில்லை. அடுத்த கூற்று பூமி முழுவதும் கடவுளுக்கே சொந்தம் என்ற உலகளாவிய உரிமையை நிலைநிறுத்துகிறது.
