  text: וְ/הָיוּ֙ שְׁמֹנָ֣ה קְרָשִׁ֔ים וְ/אַדְנֵי/הֶ֣ם כֶּ֔סֶף שִׁשָּׁ֥ה עָשָׂ֖ר אֲדָנִ֑ים שְׁנֵ֣י אֲדָנִ֗ים תַּ֚חַת הַ/קֶּ֣רֶשׁ הָ/אֶחָ֔ד וּ/שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַ/קֶּ֥רֶשׁ הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/025.yaml
  text: 'There shall be eight frames[a], with their silver bases: sixteen bases[b], two bases under one frame and two bases under the other frame.'
translation:
  language: ta
  text: 'எட்டு கட்டமைப்புச் சட்டங்களும் அவற்றுக்கான வெள்ளி அடிப்பீடங்களும் இருக்க வேண்டும்: மொத்தம் பதினாறு அடிப்பீடங்கள்; ஒவ்வொரு கட்டமைப்புச் சட்டத்தின் கீழும் இரண்டு அடிப்பீடங்கள் இருக்க வேண்டும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרָשִׁים
  choice: சட்டங்கள்
  rationale: கூடாரத்தின் செங்குத்தான கட்டமைப்பு உறுப்புகளைக் குறிக்கும் சொல்லாக, நவீன தமிழில் அவற்றின் கட்டுமானப் பணியை இயல்பாக வெளிப்படுத்துகிறது; ‘பலகைகள்’ என்பதும் சாத்தியமான மாற்று.
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: அடிப்பீடங்கள்
  rationale: சட்டங்களின் கீழே அவற்றைத் தாங்கும் தனித்தனி ஆதாரப் பகுதிகளைக் குறிக்கிறது. ‘அடித்தளங்கள்’ என்பதைவிட இவை தனிப்பட்ட கட்டுமான உறுப்புகள் என்பது ‘அடிப்பீடங்கள்’ என்பதில் தெளிவாகிறது.
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: அடிப்பீடங்கள் செய்யப்பட்ட பொருளை நேரடியாகக் குறிக்கிறது.
- source_word: שִׁשָּׁה עָשָׂר
  choice: பதினாறு
  rationale: எபிரெய எண்ணின் வழக்கமான தமிழ் வடிவம்.
- source_word: תַּחַת
  choice: கீழ்
  rationale: கட்டுமான அமைப்பில் உள்ள இடத்தொடர்பை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַקֶּרֶשׁ הָאֶחָד ... הַקֶּרֶשׁ הָאֶחָד
  choice: ஒரு சட்டம் ... மற்றொரு சட்டம்
  rationale: எபிரெயத்தில் மீண்டும் வரும் பகிர்ந்தளிக்கும் சொற்றொடரை, வரிசைமுறையைத் தேவையின்றி உணர்த்தாமல் இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: וְהָיוּ
  choice: இருக்க வேண்டும்
  rationale: கட்டுமான விவரக்குறிப்பில் வருகிற கட்டளைத் தன்மையுள்ள எதிர்காலப் பொருளை இயல்பான தமிழில் தருகிறது.
