    text: அல்லது, ‘பலகைகள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘செருகிடங்கள்.’
    reason: lexical_alternative
  revision_rationale: A construction qualifier is necessary to prevent “சட்டங்கள்” from being understood as laws. The revised sentence retains the source’s inventory and material designation, while expressing its distributive two-bases-per-frame sense unambiguously in modern standard Tamil. Footnote anchors are retained and the socket alternative is made idiomatic.
