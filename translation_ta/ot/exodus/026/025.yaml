revisions:
- from: 'சட்டங்கள்[a] எட்டும், அவற்றுக்கான வெள்ளி அடிப்பீடங்கள்[b] பதினாறும் இருக்க வேண்டும்: ஒரு சட்டத்தின் கீழ் இரண்டு அடிப்பீடங்களும், மற்றொரு சட்டத்தின் கீழ் இரண்டு அடிப்பீடங்களும் இருக்க வேண்டும்.'
  to: 'எட்டு கட்டமைப்புச் சட்டங்களும் அவற்றுக்கான வெள்ளி அடிப்பீடங்களும் இருக்க வேண்டும்: மொத்தம் பதினாறு அடிப்பீடங்கள்; ஒவ்வொரு கட்டமைப்புச் சட்டத்தின் கீழும் இரண்டு அடிப்பீடங்கள் இருக்க வேண்டும்.'
  rationale: A construction qualifier is necessary to prevent “சட்டங்கள்” from being understood as laws. The revised sentence retains the source’s inventory and material designation, while expressing its distributive two-bases-per-frame sense unambiguously in modern standard Tamil. Footnote anchors are retained and the socket alternative is made idiomatic.
