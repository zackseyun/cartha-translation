translation_notes:
  register: நவீன பொதுத் தமிழில், கட்டுமான விவரக்குறிப்புக்கேற்ற தெளிவும் கண்ணியமும் காக்கப்பட்டுள்ளது. எபிரெயத்தின் மீள்வாக்கியம் இயல்பான தமிழில் ‘ஒரு ... மற்றொரு ...’ எனத் தரப்பட்டுள்ளது; எண்ணிக்கையும் பொருளும் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
