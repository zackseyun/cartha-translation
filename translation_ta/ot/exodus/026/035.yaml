  text: וְ/שַׂמְתָּ֤ אֶת הַ/שֻּׁלְחָן֙ מִ/ח֣וּץ לַ/פָּרֹ֔כֶת וְ/אֶת הַ/מְּנֹרָה֙ נֹ֣כַח הַ/שֻּׁלְחָ֔ן עַ֛ל צֶ֥לַע הַ/מִּשְׁכָּ֖ן תֵּימָ֑נָ/ה וְ/הַ֨/שֻּׁלְחָ֔ן תִּתֵּ֖ן עַל צֶ֥לַע צָפֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: ta
  text: திரைக்கு வெளியே மேசையை வைக்க வேண்டும்; மேசைக்கு எதிரே, திருவாசஸ்தலத்தின் தெற்குப் பக்கத்தில் விளக்குத்தண்டை வைக்க வேண்டும்; மேசையை வடக்குப் பக்கத்தில் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: வைக்க வேண்டும்
  rationale: שׂוּם என்பது இச்சூழலில் ஓர் பொருளை குறிப்பிட்ட இடத்தில் வைப்பதைக் குறிக்கிறது; நவீன தமிழில் இயல்பான கட்டளை வடிவம்.
- source_word: הַשֻּׁלְחָן
  choice: மேசை
  rationale: எபிரெயச் சொல் இங்கு வெறுமனே ‘மேசை’ என்றே உள்ளது; சூழலிலிருந்து அறியப்படும் விரிவான அடையாளத்தை வசனத்துக்குள் சேர்க்கவில்லை.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: திரைக்கு வெளியே
  rationale: פָּרֹכֶת திருவாசஸ்தலத்தின் உட்பிரிவுத் திரையைக் குறிக்கிறது; ‘திரை’ என்பது பொருளை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַמְּנֹרָה
  choice: விளக்குத்தண்டு
  rationale: பெயரை ஒலிபெயர்ப்பதற்குப் பதிலாக, விளக்குகளைத் தாங்கும் அமைப்பு என்ற பொருளைத் தமிழில் தெளிவாகக் கொடுக்கிறது.
- source_word: נֹכַח
  choice: எதிரே
  rationale: மேசைக்கு நேர் எதிரான இட அமைப்பைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: திருவாசஸ்தலத்தின் தெற்குப் பக்கத்தில்
  rationale: צֶלַע என்பது ‘பக்கம்’ என்றும் תֵּימָנָה தெற்குத் திசையையும் குறிக்கின்றன; இட அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: תִּתֵּן
  choice: வைக்க வேண்டும்
  rationale: נָתַן இச்சூழலில் ‘வை/அமை’ என்ற பொருளில் வருகிறது; தமிழில் தெளிவான கட்டளை வடிவம்.
- source_word: עַל צֶלַע צָפוֹן
  choice: வடக்குப் பக்கத்தில்
  rationale: צֶלַע என்பதன் ‘பக்கம்’ என்ற பொருளையும் צָפוֹן என்பதன் ‘வடக்கு’ என்ற திசையையும் நேரடியாக வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு அமைப்புக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கட்டளையின் இரண்டாம் நபர் ஒருமை தமிழில் இயல்பான ‘வைக்க வேண்டும்’ வடிவில் தரப்பட்டுள்ளது. கடைசி கூறில் உள்ள வலியுறுத்தும் வேறுபாட்டை ‘மேசையையோ’ எனக் காத்துள்ளது.
