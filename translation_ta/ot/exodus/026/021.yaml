  yaml_path: translation/ot/exodus/026/021.yaml
  text: 'and their forty bases shall be of silver: two bases under the one frame[b][a], and two bases under the other frame.'
translation:
  language: ta
  text: 'அவற்றின் நாற்பது அடித்தளங்களும் வெள்ளியால் செய்யப்பட வேண்டும்: ஒரு சட்டத்தின் கீழ் இரண்டு அடித்தளங்களும், மற்றொரு சட்டத்தின் கீழ் இரண்டு அடித்தளங்களும் இருக்க வேண்டும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַרְבָּעִים אַדְנֵי/הֶם
  choice: அவற்றுக்கான நாற்பது அடித்தளங்களும்
  rationale: וְ முந்தைய வசனத்தின் கட்டுமான விவரத்தைத் தொடர்கிறது; אַדְנֵיהֶם என்பது சட்டங்களைத் தாங்கும் ஆதாரப் பகுதிகளைக் குறிக்கிறது. இயல்பான தமிழுக்காக உடைமைத் தொடர்பு ‘அவற்றுக்கான’ என வழங்கப்பட்டது.
- source_word: כָּסֶף
  choice: வெள்ளியால் செய்யப்பட வேண்டும்
  rationale: பெயர்ச்சொல் அடித்தளங்களின் மூலப்பொருளைச் சுட்டுகிறது. தமிழில் கட்டுமானப் பொருளைத் தெளிவாகச் சொல்ல ‘வெள்ளியால் செய்யப்பட வேண்டும்’ என்பது இயல்பானது.
- source_word: שְׁנֵי אֲדָנִים
  choice: இரண்டு அடித்தளங்கள்
  rationale: ஒவ்வொரு செங்குத்துச் சட்டத்திற்கும் கீழே அமைந்த இரண்டு வெள்ளி ஆதாரங்களைக் குறிக்கிறது; வசனம் முழுவதும் சொல்லாட்சி ஒரேபோல வைக்கப்பட்டது.
- source_word: תַּחַת
  choice: கீழ்
  rationale: ஒவ்வொரு சட்டத்தின் அடிப்பகுதியில் உள்ள இடநிலையை நேரடியாகக் குறிக்கிறது.
- source_word: הַ/קֶּרֶשׁ
  choice: சட்டம்
  rationale: கூடாரத்தின் செங்குத்தான கட்டமைப்புப் பகுதியைக் குறிக்கும் קֶרֶשׁ என்பதற்கு, வெறும் தட்டையான பலகை என்ற எண்ணத்தைவிட அதன் கட்டுமானச் செயல்பாட்டை ‘சட்டம்’ நன்றாக வெளிப்படுத்துகிறது.
- source_word: הָ/אֶחָד ... הָ/אֶחָד
  choice: ஒரு ... மற்றொரு
  rationale: எபிரெயத்தில் இரு இடங்களிலும் சொற்பட ‘அந்த ஒன்று’ என்றே இருந்தாலும், சூழலில் தொடர்ச்சியாக அமைந்த இரண்டு தனித்தனி சட்டங்களைப் பகிர்ந்துரைக்கும் பொருள் உள்ளது. தமிழில் தவறான ஒரே-சட்ட மறுபடிப்பு ஏற்படாமல் பகிர்வுப் பொருள் வெளிப்படுத்தப்பட்டது.
