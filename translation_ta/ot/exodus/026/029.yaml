  yaml_path: translation/ot/exodus/026/029.yaml
  text: You shall overlay the frames with gold[a], and you shall make their rings of gold as holders for the bars[b], and you shall overlay the bars with gold.
translation:
  language: ta
  text: சட்டங்களின்மேல்[a] தங்கம் பதிக்க வேண்டும். அவற்றின் வளையங்களைக் கம்பிகளுக்கான தாங்கிகளாக[b] தங்கத்தால் செய்ய வேண்டும். கம்பிகளின்மேலும் தங்கம் பதிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சட்டங்கள்’ என்பதற்குப் பதிலாக ‘பலகைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் திருக்கூடாரத்தின் நிமிர்ந்த கட்டமைப்புப் பகுதிகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘கம்பிகளுக்கான வீடுகளாக’; அதாவது கம்பிகள் பொருந்தி நிலைப்பதற்கான உறைகள் அல்லது தாங்கிகளாக.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: சட்டங்கள்
  rationale: திருக்கூடாரத்தின் நிமிர்ந்த கட்டமைப்புப் பகுதிகளை இச்சொல் குறிக்கிறது. அவை வெறும் மெல்லிய பலகைகள் என்று தீர்மானிக்காமல், அவற்றின் கட்டமைப்புப் பணியை இயல்பான தமிழில் தெரிவிக்க ‘சட்டங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: தங்கம் பதிக்க வேண்டும்
  rationale: பீயேல் வடிவிலுள்ள צפה, ஒரு பொருளின்மேல் உலோகத்தை மேலடுக்காகப் பதிப்பதைக் குறிக்கிறது. பொதுவாக ‘மூடுதல்’ என்பதைக் காட்டிலும் கைவினைச் செயலைத் துல்லியமாகத் தெரிவிக்கிறது.
- source_word: זָהָב
  choice: தங்கம் / தங்கத்தால்
  rationale: நேரடியான பொருட்பெயர். எபிரெய உரையில் மும்முறை வரும் தங்கம் பற்றிய குறிப்பும் தமிழில் ஒவ்வொரு இடத்திலும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: טַבְּעֹתֵיהֶם
  choice: அவற்றின் வளையங்கள்
  rationale: சட்டங்களோடு இணைக்கப்பட்ட உலோக வளையங்களைக் குறிக்கும் நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: תַּעֲשֶׂה
  choice: செய்ய வேண்டும்
  rationale: עשה என்பதன் பொதுவான கட்டளைப் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: בָּתִּים לַבְּרִיחִם
  choice: கம்பிகளுக்கான பிடிப்புகளாக
  rationale: சொல்லுக்குச் சொல் ‘கம்பிகளுக்கான வீடுகள்’; இங்கு கம்பிகள் பொருந்தி நிலைக்க உதவும் ஏற்பாடுகள் என்பதால், அதன் செயல்பாட்டை ‘பிடிப்புகள்’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַבְּרִיחִם
  choice: கம்பிகள்
  rationale: சட்டங்களை ஒன்றாக இணைத்து நிலைநிறுத்தும் நீண்ட கட்டமைப்புப் பகுதிகளைக் குறிக்கிறது. ‘குறுக்குக் கம்பிகள்’ என்பது சாத்தியமான விளக்க மொழிபெயர்ப்பு; ஆயினும் எபிரெயச் சொல்லில் இல்லாத திசைக் குறிப்பை முதன்மை உரையில் சேர்க்காமல் ‘கம்பிகள்’ எனத் தரப்பட்டுள்ளது.
