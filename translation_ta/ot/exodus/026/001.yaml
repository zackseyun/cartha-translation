source:
  edition: WLC
  text: וְ/אֶת הַ/מִּשְׁכָּ֥ן תַּעֲשֶׂ֖ה עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: ta
  text: “மேலும், திருக்கூடாரத்தைப் பத்து திரைச்சீலைகளால் செய்வாய். அவற்றை நன்றாக முறுக்கப்பட்ட மெல்லிய லினன் நூலாலும், நீல, ஊதா, செந்நிற நூல்களாலும் செய்வாய்; கலைநயமிக்க வேலைப்பாடாகக் கேருபீன்களை அவற்றில் உருவாக்குவாய்.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திறமையான வடிவமைப்பாளரின் வேலைப்பாடாகக் கேருபீன்களை அவற்றில் உருவாக்குவாய்.” எபிரெயத் தொடர் מַעֲשֵׂה חֹשֵׁב, துணியில் திட்டமிட்டு உருவாக்கப்படும் கலைநயமிக்க திறமையான வேலைப்பாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: இச்சொல் கடவுளின் பரிசுத்த உறைவிடமாக அமைக்கப்படும் கூடாரத்தைக் குறிக்கிறது. ‘திருக்கூடாரம்’ என்பது கட்டுமானச் சூழலையும் அதன் பரிசுத்தப் பயன்பாட்டையும் நவீனத் தமிழில் தெளிவாக உணர்த்துகிறது.
- source_word: יְרִיעֹת
  choice: திரைச்சீலைகள்
  rationale: இங்கு கூடாரத்தை உருவாக்கும் பெரிய துணிப் பகுதிகள் குறிக்கப்படுகின்றன; ‘திரைச்சீலைகள்’ என்பது அவற்றின் வடிவத்தையும் பயன்பாட்டையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: நன்றாக முறுக்கப்பட்ட மெல்லிய நார்நூல்
  rationale: שֵׁשׁ மெல்லிய லினன் வகை நாரையும், מָשְׁזָר முறுக்கப்பட்ட நூலையும் குறிக்கிறது. பருத்தி என்று பொருளை மாற்றாமல், பொருளும் நூல் தயாரிப்பு முறையும் இரண்டையும் இத்தொடர் வெளிப்படுத்துகிறது.
- source_word: תְּכֵלֶת
  choice: நீல நூல்
  rationale: கூடாரத் துணிகளுக்குப் பயன்படுத்தப்பட்ட நீலச் சாயமிட்ட நூல் அல்லது பொருளைக் குறிக்கிறது; பட்டியலின் துணிநூல் சூழலில் ‘நீல நூல்’ தெளிவானது.
- source_word: אַרְגָּמָן
  choice: ஊதா நூல்
  rationale: ஊதா நிறச் சாயமிட்ட விலையுயர்ந்த நூல் அல்லது துணிப்பொருளைக் குறிக்கும் வழக்கமான நிறச்சொல்.
- source_word: תֹלַעַת שָׁנִי
  choice: செந்நிற நூல்
  rationale: இத்தொடர் ஸ்கார்லெட் அல்லது ஆழ்ந்த சிவப்புச் சாயமிட்ட நூலைக் குறிக்கிறது. ‘செந்நிற நூல்’ நவீன வாசகருக்கு எளிதாகவும் துணிநூல் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: כְּרֻבִים
  choice: கேருபீன்கள்
  rationale: வேதாகம வழிபாட்டுச் சூழலுக்குரிய விண்ணுலக உயிரினங்களின் தொழில்நுட்பப் பெயரை ஒலிபெயர்த்து, வேறு வகைத் தூதர்களுடன் கலந்து விடாமல் காக்கிறது.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: திறமைமிக்க வடிவமைப்பாளரின் கைவினை
  rationale: חֹשֵׁב இங்கு சாதாரண உழைப்பை மட்டுமல்ல, திட்டமிட்ட கலைநயமுள்ள துணி வடிவமைப்பைக் குறிக்கிறது; ‘வடிவமைப்பாளரின் கைவினை’ அந்தக் கலைத்திறனை வெளிப்படுத்துகிறது.
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: மேலும் ... அமைப்பாய்
  rationale: இணைப்பிடைச்சொல் முந்தைய தெய்வீக அறிவுறுத்தலின் தொடர்ச்சியைக் காட்டுகிறது. கூடாரத்திற்காக ‘அமைப்பாய்’ என்றும், துணிகளுக்காக ‘செய்வாய்’ என்றும் தமிழில் இயல்பாக வேறுபடுத்தப்பட்டுள்ளது.
- source_word: אֹתָם
  choice: அவற்றை / அவற்றில்
  rationale: பன்மைச் சுட்டுப்பெயர் பத்துத் திரைச்சீலைகளைச் சுட்டுகிறது; தமிழில் அந்தப் பன்மைத் தொடர்பு தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது.
