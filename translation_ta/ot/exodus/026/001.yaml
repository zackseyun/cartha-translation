translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், கட்டளைத் தொனியும் வழிபாட்டுச் சூழலுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘திருக்கூடாரம்’ மற்றும் ‘கேருபீன்கள்’ தொழில்நுட்பச் சொற்களாகப் பயன்படுத்தப்பட்டாலும், வாக்கிய அமைப்பு பொதுவாசகருக்கு எளிதாக வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு மாற்றுப் பொருள் சார்ந்த சொற்றொடருக்குப் பின்னரே இடப்பட்டுள்ளது.
