revisions:
- from: 'திருவுறைவிடத்திற்கான சட்டங்களை நீ செய்வாயாக: தெற்குப் பக்கத்தில், தெற்கு நோக்கி, இருபது சட்டங்கள்[a].'
  to: 'திருவுறைவிடத்திற்காகக் கட்டமைப்புச் சட்டங்களைச் செய்வாயாக: தெற்குப் பக்கமாக, தெற்குத் திசையை நோக்கி, இருபது கட்டமைப்புச் சட்டங்களைச் செய்வாயாக.[a]'
  rationale: The revision qualifies “சட்டங்கள்” as construction frames, preventing its normal legal reading while retaining the source term’s possible sense of frames or boards. It also preserves the Hebrew’s repeated southern directional expression and its repetition of the structural-member noun.
