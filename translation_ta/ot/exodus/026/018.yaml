  yaml_path: translation/ot/exodus/026/018.yaml
  text: 'And you shall make the frames for the tabernacle: twenty frames for the south side[a], southward.'
translation:
  language: ta
  text: 'திருவுறைவிடத்திற்காகக் கட்டமைப்புச் சட்டங்களைச் செய்வாயாக: தெற்குப் பக்கமாக, தெற்குத் திசையை நோக்கி, இருபது கட்டமைப்புச் சட்டங்களைச் செய்வாயாக.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கட்டமைப்புச் சட்டங்கள்’ என்பதற்குப் பதிலாக ‘பலகைகள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் திருவுறைவிடத்தின் நிமிர்ந்த கட்டமைப்புக் கூறுகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: நீ செய்வாயாக
  rationale: அறிவுறுத்தல் சூழலில் இணைப்புடன் வரும் Qal perfect கட்டளை வலிமையைக் கொண்டுள்ளது; தமிழில் ‘செய்வாயாக’ அதைத் தெளிவாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: הַקְּרָשִׁים
  choice: சட்டங்கள்
  rationale: கֶרֶשׁ என்பது திருவுறைவிடத்தின் நிமிர்ந்த கட்டமைப்புக் கூறுகளைக் குறிக்கிறது. ‘சட்டங்கள்’ அவற்றின் கட்டமைப்புப் பணியை இயல்பாகக் காட்டுகிறது; ‘பலகைகள்’ என்பதும் சாத்தியம்.
- source_word: לַמִּשְׁכָּן
  choice: திருவுறைவிடத்திற்கான
  rationale: מִשְׁכָּן என்பதன் அடிப்படைப் பொருள் ‘உறைவிடம்’; யாத்திராகமத்தின் பரிசுத்தக் கூடாரச் சூழலில் ‘திருவுறைவிடம்’ அதன் வழிபாட்டு தன்மையையும் இருப்பிடக் கருத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: இருபது சட்டங்கள்
  rationale: எபிரெய எண்ணிக்கைக் கட்டமைப்பில் பெயர்ச்சொல் ஒருமையாக இருந்தாலும், தமிழ் வழக்கில் எண்ணப்பட்ட பொருள் பன்மையாக வருவது இயல்பு.
- source_word: לִפְאַת
  choice: பக்கத்தில்
  rationale: פֵאָה என்பது பக்கம், ஓரம், எல்லைப்பகுதி ஆகியவற்றைக் குறிக்கலாம்; கட்டட அமைப்பு பற்றிய இச்சூழலில் ‘பக்கம்’ பொருத்தமானது.
- source_word: נֶגְבָּה תֵימָנָה
  choice: தெற்குப் பக்கத்தில், தெற்கு நோக்கி
  rationale: இரு திசைச் சொற்களும் தெற்குத் திசையை வலியுறுத்தி விளக்குகின்றன; ஒன்றாகச் சுருக்காமல் இரண்டையும் தமிழில் தக்கவைத்துள்ளது.
