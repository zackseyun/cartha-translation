base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: ta
  text: அந்த ஒரு திரைச்சீலையில் ஐம்பது வளையங்களைச் செய்ய வேண்டும்; இரண்டாவது தொகுப்பில் உள்ள திரைச்சீலையின் ஓரத்திலும் ஐம்பது வளையங்களைச் செய்ய வேண்டும். அந்த வளையங்கள் ஒன்றுக்கு ஒன்று எதிரெதிராக இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “ஒவ்வொன்றும் தன் சகோதரியுடன்” என்று உள்ளது; வளையங்கள் தத்தம் இணைகளுடன் பொருந்தி எதிரெதிராக அமைந்திருப்பதைக் குறிக்கும் மரபுத்தொடர் இது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: வளையங்கள்
  rationale: திரைச்சீலைகளை இணைப்பதற்கான வளைய வடிவ இணைப்புகளை இச்சொல் குறிக்கிறது. அடுத்த வசனத்தில் வரும் உலோகக் கொக்கிகளிலிருந்து இவற்றை வேறுபடுத்தவும், இயல்பான தமிழில் பொருளைத் தெளிவாகத் தெரிவிக்கவும் ‘வளையங்கள்’ ஏற்றது.
- source_word: יְרִיעָה
  choice: திரைச்சீலை
  rationale: திருவாசஸ்தலச் சூழலில் பெரிய துணித் திரையை இச்சொல் குறிக்கிறது; ‘திரைச்சீலை’ என்பது நவீன தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: הָאֶחָת
  choice: ஒரு
  rationale: எபிரெயச் சொல் வரிசையைக் குறிப்பாக ‘முதல்’ என்று சொல்லாமல், இணைக்கப்படும் இரண்டில் ஒன்றை மட்டும் சுட்டுகிறது. ஆகவே ‘ஒரு’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: קְצֵה
  choice: ஓரம்
  rationale: திரைச்சீலையின் வெளிப்புற எல்லையைச் சுட்டுவதால், தையல் மற்றும் இணைப்புச் சூழலில் ‘ஓரம்’ இயல்பாகப் பொருந்துகிறது.
- source_word: מַחְבֶּרֶת
  choice: தொகுப்பு
  rationale: முந்தைய வசனங்களில் ஒன்றாக இணைக்கப்பட்ட திரைச்சீலைகளால் உருவான குழுவை இங்கு குறிக்கிறது. விளைவாக உருவாகும் அலகை ‘தொகுப்பு’ தெளிவாகக் காட்டுகிறது.
- source_word: הַשֵּׁנִית
  choice: இரண்டாவது
  rationale: இரு திரைச்சீலைத் தொகுப்புகளில் இரண்டாவதை நேரடியாக அடையாளப்படுத்துகிறது.
- source_word: מַקְבִּילֹת
  choice: நேரெதிராக இருக்க வேண்டும்
  rationale: இரு ஓரங்களிலுமுள்ள வளையங்கள் ஒன்றோடொன்று பொருந்தும் வகையில் எதிரெதிராக அமைந்திருப்பதை வெளிப்படுத்துகிறது.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ஒன்றுக்கொன்று
  rationale: ‘ஒரு பெண் தன் சகோதரியிடம்’ என்பது பொருட்கள் தத்தம் இணைகளுடன் பொருந்தியிருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் அதன் கருத்தை இயல்பாக ‘ஒன்றுக்கொன்று’ தெரிவிக்கிறது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
