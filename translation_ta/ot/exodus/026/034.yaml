  yaml_path: translation/ot/exodus/026/034.yaml
  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: ta
  text: சாட்சிப் பெட்டியின் மேல் பாவநிவாரண மூடியை மிகப் பரிசுத்தமான இடத்தில் வைப்பாயாக.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாவநிவாரண மூடி’ என்பதற்கு மாற்றாக, ‘கிருபாசனம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், ‘சாட்சியின் பெட்டி’; பல மொழிபெயர்ப்புகளில், ‘உடன்படிக்கைப் பெட்டி.’
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘பரிசுத்தப் பரிசுத்தம்’ (பாரம்பரியமாக, ‘பரிசுத்தப் பரிசுத்த ஸ்தலம்’).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: வைப்பாயாக
  rationale: தொடர்ச்சியான கட்டளைச் சூழலில் வரும் Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவத்தின் கட்டளை வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: பெட்டியின் மூடி என்பதையும் அது பாவநிவாரணச் சடங்கோடு தொடர்புடையதையும் தெளிவாகக் காட்டுகிறது; பாரம்பரிய மாற்றுச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַל
  choice: மேல்
  rationale: மூடி பெட்டியின்மீது வைக்கப்படுவதைக் குறிக்கும் இடவுறவை நேரடியாகத் தெரிவிக்கிறது.
- source_word: אֲרוֹן הָעֵדֻת
  choice: சாட்சிப் பெட்டி
  rationale: எபிரெய உரையில் உள்ள ‘சாட்சியின் பெட்டி’ என்ற சொல்லமைப்பைத் தொடர்ந்து, ‘உடன்படிக்கைப் பெட்டி’ என்று ஒத்திசைக்காமல் பாதுகாக்கிறது.
- source_word: בְּ/קֹדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்த இடத்தில்
  rationale: எபிரெய உயர்நிலைச் சொல்லாட்சியான ‘பரிசுத்தங்களின் பரிசுத்தம்’ என்பதன் பொருளை தெளிவான, மரியாதைக்குரிய நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: כַּפֹּרֶת என்பதைக் பாரம்பரியச் சொல்லால் தருவதா அல்லது அதன் செயலையும் வடிவத்தையும் தெளிவாக்குவதா
  choice: முதன்மை உரையில் ‘பாவநிவாரண மூடி’
  alternative: ‘கிருபாசனம்’
  rationale: ‘பாவநிவாரண மூடி’ என்பது பொருள் பெட்டியின் மூடி என்பதையும் பாவநிவாரணத்துடன் அதன் தொடர்பையும் தெரிவிக்கிறது; ‘கிருபாசனம்’ என்ற பாரம்பரியச் சொல் அது ஓர் இருக்கை என்ற தவறான எண்ணத்தை ஏற்படுத்தக்கூடும், எனினும் வாசகர் அறிமுகத்திற்காக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אֲרוֹן הָעֵדֻת என்பதில் ‘சாட்சி’யைத் தக்கவைத்தலா அல்லது பரவலான ‘உடன்படிக்கை’ என வழங்குவதா
  choice: ‘சாட்சிப் பெட்டி’
  alternative: ‘உடன்படிக்கைப் பெட்டி’
  rationale: மூல எபிரெயில் עֵדוּת, ‘சாட்சி,’ என்றே உள்ளது. பரவலான மாற்றுப் பெயர் அடிக்குறிப்பில் மட்டும் தரப்படுகிறது; இதனால் மூலத்தின் தனித்துவம் மறைக்கப்படாது.
- issue: קֹדֶשׁ הַקֳּדָשִׁים என்ற எபிரெய மிகைநிலையைத் தமிழில் எவ்வாறு வழங்குவது
  choice: ‘மகா பரிசுத்த இடம்’
  alternative: ‘பரிசுத்த இடங்களிலெல்லாம் பரிசுத்தமான இடம்’
  rationale: முதன்மைத் தேர்வு இயல்பான தமிழில் உள்ளார்ந்த திருத்தலத்தைத் தெளிவாக அடையாளப்படுத்துகிறது; மேலும் சொற்பொருள் சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: மரியாதைக்குரிய, இயல்பான நவீனத் தமிழ். கூடார வழிபாட்டுக்குரிய பொருட்களையும் இடத்தையும் சாதாரண வாசகர் புரிந்துகொள்ளும் வகையில் கூறுகிறது. மூன்று அடிக்குறிப்பு குறிப்பான்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
