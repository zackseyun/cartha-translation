  register: நவீன நிலையான தமிழில், கட்டுமான அறிவுறுத்தலுக்கேற்ற மரியாதையான மற்றும் தெளிவான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சித்தீம் மரம்’ என்பது பரவலாக அறியப்பட்ட வேதாகமத் தாவரப்பெயரைப் பேணுகிறது; தேவையற்ற இறையியல் விளக்கங்கள் சேர்க்கப்படவில்லை.
