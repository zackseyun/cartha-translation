- from: நீ அதைத் தங்கமுலாம் பூசப்பட்ட சித்தீம் மரத்தாலான நான்கு தூண்களில் தொங்கவிட வேண்டும். அவற்றின் கொக்கிகள் தங்கத்தால் செய்யப்பட்டிருக்க வேண்டும்; அந்தத் தூண்கள் வெள்ளியாலான நான்கு அடிப்பீடங்களில்[a] நிற்க வேண்டும்.
