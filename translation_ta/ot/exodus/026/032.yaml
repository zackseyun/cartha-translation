base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/032.yaml
  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: ta
  text: அதைத் தங்க முலாம் பூசப்பட்ட அகேசியா மரத்தாலான நான்கு தூண்களில் தொங்கவிட வேண்டும்; அவற்றின் கொக்கிகள் தங்கத்தால் ஆனவை; அந்தத் தூண்கள் வெள்ளியாலான நான்கு அடிப்பீடங்களின் மேல் இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெள்ளியாலான நான்கு பொருத்துக் குழிகள்.”
    reason: அடிப்பீடம் என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல், தூண்களைப் பொருத்தி நிறுத்தும் குழிவான தாங்கிகளையும் குறிக்கலாம்.
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: நீ அதைத் … தொங்கவிட வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘வை/அமை’ என்பதாக இருந்தாலும், முந்தைய வசனத்தில் கூறப்பட்ட திரை தூண்களோடு இணைக்கப்படும் இச்சூழலில் ‘தொங்கவிடு’ என்பது இயல்பாகவும் துல்லியமாகவும் செயலை வெளிப்படுத்துகிறது. பெண்பால் ஒருமை பின்னொட்டு முந்தைய வசனத்தின் திரையைக் குறிக்கிறது.
- source_word: עַל אַרְבָּעָה עַמּוּדֵי שִׁטִּים
  choice: சித்தீம் மரத்தாலான நான்கு தூண்களில்
  rationale: עַמּוּדִים என்பது நிமிர்ந்து நிற்கும் கட்டமைப்புத் தாங்கிகளைக் குறிக்கும்; அதற்கு ‘தூண்கள்’ பொருத்தமானது. שִׁטִּים என்பது சித்தீம்/அகேசியா மரப்பொருளைக் குறிக்கிறது; தமிழ் வேதாகமச் சொற்பயன்பாட்டோடு தொடர்ச்சியைப் பேண ‘சித்தீம் மரம்’ பயன்படுத்தப்பட்டது.
- source_word: מְצֻפִּים זָהָב
  choice: தங்கமுலாம் பூசப்பட்ட
  rationale: צפה என்ற வினையின் செயப்பாட்டு வடிவம் தூண்கள் தங்கத்தால் மூடப்பட்ட அல்லது மேற்பூச்சிடப்பட்ட நிலையைச் சுட்டுகிறது. ‘தங்கமுலாம் பூசப்பட்ட’ என்பது முழுத் தங்கம் என்ற தவறான எண்ணத்தைத் தவிர்த்து இதைத் தெளிவாகக் கூறுகிறது.
- source_word: וָוֵיהֶם זָהָב
  choice: அவற்றின் கொக்கிகள் தங்கத்தால் செய்யப்பட்டிருக்க வேண்டும்
  rationale: וָוִים இங்கு திரையைத் தூண்களில் தொங்கவிடப் பயன்படும் கொக்கிகளைக் குறிக்கிறது. எபிரெயச் சொற்றொடரின் சுருக்கமான ‘அவற்றின் கொக்கிகள் தங்கம்’ என்ற அமைப்பு இயல்பான தமிழில் பொருள் தெளிவாக விரிக்கப்பட்டுள்ளது.
- source_word: עַל אַרְבָּעָה אַדְנֵי כָסֶף
  choice: அந்தத் தூண்கள் வெள்ளியாலான நான்கு அடிப்பீடங்களில் நிற்க வேண்டும்
  rationale: אֲדָנִים என்பது தூண்களைத் தாங்கும் அடிப்பகுதிகள் அல்லது பொருத்துக் குழியுள்ள பீடங்களைக் குறிக்கலாம். ‘அடிப்பீடங்கள்’ தெளிவான நவீனத் தமிழ்; எபிரெயில் வெளிப்படையாக இல்லாத ‘தூண்கள்’ மற்றும் ‘நிற்க வேண்டும்’ ஆகியவை தொடர்பைத் தெளிவாக்க மட்டுமே சேர்க்கப்பட்டுள்ளன.
