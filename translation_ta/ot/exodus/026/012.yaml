  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: ta
  text: கூடாரத்தின் திரைச்சீலைகளில் மீதமிருக்கும் பகுதி[a]—மீதமிருக்கும் அரைத் திரைச்சீலை[b]—வாசஸ்தலத்தின் பின்புறத்தின் மேல் தொங்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூடாரத்தின் திரைச்சீலைகளில் மீதமிருக்கும் மிகுதி.”
    reason: lexical_alternative
  - marker: b
    text: இவ்வசனத்தில் எபிரெயம் “கூடாரம்” என்பதையும் “வாசஸ்தலம்” என்பதையும் வேறுபட்ட சொற்களால் குறிப்பிடுகிறது; முன்னது கூடார மூடுதலை, பின்னது வாசஸ்தலக் கட்டமைப்பைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: எஞ்சித் தொங்கும் பகுதி
  rationale: எஞ்சிய மிகுதி என்பதையும் அது நீட்டித் தொங்கும் கட்டட அமைப்புச் செயலையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: הָעֹדֵף / הָעֹדֶפֶת
  choice: எஞ்சிய / எஞ்சித்
  rationale: தேவையான அளவுக்கு மேலாக மீதமிருப்பதைக் குறிக்கும் எபிரெயப் பங்கேற்புச் சொற்களின் பொருளைப் பாதுகாக்கிறது.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: திரைச்சீலைகள் / திரைச்சீலை
  rationale: திருவாசஸ்தல அமைப்பில் பயன்படுத்தப்பட்ட பெரிய துணி மூடுதல்களை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: הָאֹהֶל
  choice: கூடாரம்
  rationale: பின்னர் வரும் מִשְׁכָּן என்பதிலிருந்து வேறுபட்ட வெளிப்புறக் கூடார மூடுதலைக் குறிக்கும் சொல் வேறுபாட்டைப் பேணுகிறது.
- source_word: חֲצִי הַיְרִיעָה
  choice: அரைத் திரைச்சீலை
  rationale: ஒரு திரைச்சீலையின் பாதி அளவைக் குறிக்கும் ஒருமை அமைப்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: תִּסְרַח
  choice: தொங்க வேண்டும்
  rationale: எஞ்சிய துணிப்பகுதி பின்புறத்தில் நீண்டு கீழே தொங்கும் காட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: עַל אֲחֹרֵי
  choice: பின்புறத்தின் மேல்
  rationale: துணி கட்டமைப்பின் பின்புறத்தை மூடியவாறு தொங்குவதைச் சுட்டும் இடவியல் உறவைப் பேணுகிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: இறை வாசஸ்தலக் கட்டமைப்பைக் குறிக்கும் தொழில்நுட்பச் சொல்லாகவும், கூடார மூடுதலிலிருந்து வேறுபடுத்தத்தக்கதாகவும் உள்ளது.
