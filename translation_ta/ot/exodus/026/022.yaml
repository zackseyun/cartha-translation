base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/022.yaml
  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
translation:
  language: ta
  text: திருவாசஸ்தலத்தின் மேற்குப் பக்கமான பின்புறத்திற்காக ஆறு பலகைகளைச் செய்ய வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சட்டகங்களை.” இக்கட்டுமான உறுப்புகள் திடமான பலகைகளாக அல்லாமல் திறந்த அமைப்புடைய சட்டகங்களாக இருந்தன என்று புரிந்துகொண்டால் இவ்வாறு மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: பின்புறமாகிய ... பக்கத்திற்காக
  rationale: இச்சொல் திருவாசஸ்தலத்தின் தொலைவான அல்லது பின்புறப் பகுதியைக் குறிக்கிறது; கட்டட அமைப்புச் சூழலில் இயல்பான தமிழாக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: யாத்திராகமத்தில் இச்சொல் இறைவன் வாசம்பண்ணும் பரிசுத்தக் கூடார அமைப்பைக் குறிக்கிறது; நவீனத் தமிழில் பொருளைத் தெளிவாகவும் மரியாதையுடனும் தெரிவிக்கிறது.
- source_word: יָמָּה
  choice: மேற்குப் பக்கம்
  rationale: சொல்லளவில் ‘கடலை நோக்கி’ என்றாலும், இஸ்ரவேலரின் திசை வழக்கில் இது மேற்கைக் குறிக்கிறது; இங்கு கட்டடத்தின் பக்கம் குறிப்பிடப்படுவதால் பெயர்ச்சொல் வடிவில் இயல்பாக வழங்கப்பட்டது.
- source_word: תַּעֲשֶׂה
  choice: செய்ய வேண்டும்
  rationale: Qal imperfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் இக்கட்டளைச் சூழலில் வழிகாட்டும் கட்டளையைத் தெரிவிக்கிறது.
- source_word: שִׁשָּׁה
  choice: ஆறு
  rationale: அடுத்து வரும் கட்டுமான உறுப்புகளின் எண்ணிக்கையைக் குறிக்கும் எளிய எண்ணுப்பெயர்.
- source_word: קְרָשִׁים
  choice: பலகைகள்
  rationale: திருவாசஸ்தலத்தின் சுவர்களை உருவாக்கும் மரக் கட்டுமான உறுப்புகளைக் குறிக்கிறது; அவை திடப் பலகைகளா அல்லது திறந்த சட்டங்களா என்பது உறுதியாக இல்லாததால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
