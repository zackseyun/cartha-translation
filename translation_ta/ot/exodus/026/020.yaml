  yaml_path: translation/ot/exodus/026/020.yaml
  text: And for the second side of the tabernacle[a], on the north side, twenty frames.
translation:
  language: ta
  text: திருவாசஸ்தலத்தின் இரண்டாவது பக்கமான வடக்குப் பக்கத்திற்கு இருபது சட்டங்களை[a] அமைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலகைகள்.” எபிரெயச் சொல் திருவாசஸ்தலத்தின் செங்குத்தான கட்டமைப்புக் கூறுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  choice: பக்கத்திற்கு
  rationale: צֶלַע இங்குக் கட்டட அமைப்பின் பக்கத்தை அல்லது பக்கச்சுவரைக் குறிக்கிறது; முன்னொட்டுகள் அடுத்த கட்டுமானக் குறிப்பைத் தொடர்கின்றன.
- source_word: הַמִּשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: מִשְׁכָּן என்பது இங்கு இஸ்ரவேலரின் பரிசுத்த வாசஸ்தலத்தைக் குறிக்கும் நிலையான பெயர்; ‘திருவாசஸ்தலம்’ அதன் வாசஸ்தலப் பொருளையும் புனிதச் சூழலையும் தெளிவாகத் தருகிறது.
- source_word: הַשֵּׁנִית
  choice: இரண்டாவது
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட முதல் நீளப்பக்கத்திற்கு இணையான அடுத்த பக்கத்தைத் துல்லியமாகக் குறிக்கிறது.
- source_word: לִפְאַת צָפוֹן
  choice: வடக்குப் பக்கமாகிய
  rationale: இந்தச் சொற்றொடர் அமைப்பின் வடதிசை நோக்கிய பக்கத்தைச் சுட்டுகிறது; தமிழில் இயல்பாகப் பெயரடைத் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: עֶשְׂרִים
  choice: இருபது
  rationale: எண்ணிக்கையின் நேரடியான மொழிபெயர்ப்பு.
- source_word: קָרֶשׁ
  choice: சட்டங்கள்
  rationale: கூடாரச் சுவரை உருவாக்கும் செங்குத்தான கட்டமைப்புக் கூறுகளை இச்சொல் குறிக்கிறது; ‘சட்டங்கள்’ அவற்றின் கட்டமைப்புப் பணியை வெளிப்படுத்துகிறது. பாரம்பரியமான ‘பலகைகள்’ என்பதும் சாத்தியம்.
