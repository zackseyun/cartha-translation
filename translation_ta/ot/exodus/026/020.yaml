translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கட்டுமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் வினைச்சொல் விடுபட்டுள்ளதால், முந்தைய கட்டளையின் தொடர்ச்சியை இயல்பான தமிழில் காட்ட ‘அமைக்க வேண்டும்’ சேர்க்கப்பட்டுள்ளது.
