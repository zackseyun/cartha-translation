translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான அறிவுறுத்தல் நடையைக் கையாளுகிறது. கட்டடக்கலைச் சொற்களில் உள்ள உண்மையான தெளிவின்மையை முதன்மை உரை மிகைப்படுத்தாமல் வழங்கி, மாற்று அமைப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
