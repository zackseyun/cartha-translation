  yaml_path: translation/ot/exodus/026/023.yaml
  text: And you shall make two boards for the corners of the tabernacle at the rear[a].
translation:
  language: ta
  text: மேலும், திருவுறைவிடத்தின் பின்புற மூலைகளுக்காக இரண்டு பலகைகளை நீ செய்ய வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருவுறைவிடத்தின் மூலைப் பகுதிகளுக்காக, இரண்டு பின்புறப் பகுதிகளில்.” எபிரேயச் சொற்கள் கட்டட அமைப்பைச் சார்ந்த நுட்பமான சொற்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: மேலும் ... இரண்டு
  rationale: இணைப்புச்சொல்லும் ‘இரண்டு’ என்பதன் construct வடிவமும் கட்டுமானப் பணிகளின் அடுத்த உருப்படியை அறிமுகப்படுத்துகின்றன; நவீன தமிழில் ‘மேலும் ... இரண்டு’ இயல்பாக உள்ளது.
- source_word: קְרָשִׁים
  choice: பலகைகள்
  rationale: இச்சூழலில் இந்தச் சொல் திருவுறைவிடத்தின் சுவர்களை உருவாக்கும் மரத்தாலான கட்டுமான உறுப்புகளைக் குறிக்கிறது. ‘பலகைகள்’ என்பது தேவையற்ற தொழில்நுட்ப விளக்கத்தைச் சேர்க்காமல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: תַּעֲשֶׂה
  choice: நீ செய்ய வேண்டும்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை imperfect வடிவம் இக்கட்டளைச் சூழலில் நேரடியான அறிவுறுத்தலைக் குறிக்கிறது; ‘நீ செய்ய வேண்டும்’ நவீன தமிழில் அதன் கட்டளை வலிமையை இயல்பாகப் பேணுகிறது.
- source_word: לִ/מְקֻצְעֹת
  choice: மூலைகளுக்காக
  rationale: இந்தக் கட்டடக்கலைச் சொல் மூலைகள் அல்லது கோண இணைப்பிடங்களைக் குறிக்கலாம். ‘மூலைகளுக்காக’ என்பது குறிப்பிட்ட வடிவமைப்பை ஊகித்துச் சேர்க்காமல் அடிப்படைப் பொருளைப் பேணுகிறது.
- source_word: הַ/מִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: மூலச்சொல் அடிப்படையில் ‘உறைவிடம்’ என்று பொருள்பட்டு, யாத்திராகமத்தில் புனிதக் கூடார-உறைவிடத்தைக் குறிக்கிறது. ‘திருவுறைவிடம்’ அதன் புனிதச் சூழலையும் உறைவிடக் கருத்தையும் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: בַּ/יַּרְכָתָיִם
  choice: பின்புற மூலைகளுக்காக
  rationale: இருமை வடிவம் பின்பக்கத்தின் இரண்டு கடைசிப் பகுதிகள் அல்லது பக்கங்களைக் குறிக்கிறது. முன்வரும் மூலைச் சொல்லுடன் இணைத்து ‘பின்புற மூலைகள்’ என மொழிபெயர்ப்பது தமிழில் இயல்பாகவும் கட்டட அமைப்பின் பொருளுக்கு ஏற்றதாகவும் உள்ளது; தொழில்நுட்ப மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
