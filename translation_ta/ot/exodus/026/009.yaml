translation_notes:
  register: நவீன தரத் தமிழில், கட்டுமான அறிவுறுத்தலுக்கேற்ற தெளிவான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. இரு திரைச்சீலைத் தொகுதிகளும் தனித்தனியாக இணைக்கப்படுகின்றன என்பது வெளிப்படையாகத் தரப்பட்டுள்ளது; ‘கூடாரம்’ என்ற மூலச்சொல் விளக்கவுரையின்றி காக்கப்பட்டுள்ளது.
