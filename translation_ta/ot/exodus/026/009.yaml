base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: ta
  text: ஐந்து திரைச்சீலைகளை ஒரு தொகுதியாக இணைக்க வேண்டும்; ஆறு திரைச்சீலைகளை மற்றொரு தொகுதியாக இணைக்க வேண்டும். ஆறாவது திரைச்சீலையைக் கூடாரத்தின் முன்புறத்தில் இரட்டையாக மடிக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆறாவது திரைச்சீலையைக் கூடாரத்தின் முகப்புக்கு எதிரே இரட்டையாக மடிக்க வேண்டும்.’
    reason: אֶל מוּל פְּנֵי என்ற இடவியல் தொடரை ‘கூடாரத்தின் முன்புறத்தில்’ என்றும், மேலும் சொற்சார்ந்து ‘கூடாரத்தின் முகப்புக்கு எதிரே’ என்றும் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: ஒன்றோடொன்று இணைக்க வேண்டும்
  rationale: חָבַר என்பது பல துண்டுகளை இணைத்து ஒரு தொகுதியாக்குவதைக் குறிக்கிறது. ‘ஒன்றோடொன்று இணைக்க’ என்பது இதை இயல்பான நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: திரைச்சீலைகள் / திரைச்சீலை
  rationale: இச்சொல் திருக்கூடாரத்தை மூடும் துணி விரிப்புகளைக் குறிக்கிறது. கட்டட அமைப்பின் இச்சூழலில் ‘திரைச்சீலை’ பொதுவாசகருக்குத் தெளிவாகவும் மூலச்சொல்லுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: לְבָד
  choice: தனியாக
  rationale: ஐந்து திரைச்சீலைகள் ஒரு தனித் தொகுதியாகவும் ஆறு திரைச்சீலைகள் மற்றொரு தனித் தொகுதியாகவும் இணைக்கப்பட வேண்டும் என்ற பகிர்வுப் பொருளை இது காக்கிறது.
- source_word: כָפַלְתָּ
  choice: இரட்டையாக மடிக்க வேண்டும்
  rationale: כָּפַל என்பது ஒன்றை மடித்து இரட்டையாக்குவதைக் குறிக்கிறது. ‘இரட்டையாக மடிக்க’ என்பது வெறுமனே வளைப்பதைக் காட்டிலும் அந்தப் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: הַשִּׁשִּׁית
  choice: ஆறாவது
  rationale: ‘திரைச்சீலை’ என்பதைக் குறிப்பிடும் வரிசை எண்ணை நேரடியாக மொழிபெயர்க்கிறது.
- source_word: אֶל מוּל פְּנֵי
  choice: முன்புறத்தில்
  rationale: கூடாரத்தின் முகப்பை நோக்கிய அல்லது அதற்கு எதிரான இடத்தைக் குறிக்கும் இடவியல் தொடரை இயல்பான தமிழில் தருகிறது; அதன் சற்றே சொற்சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הָאֹהֶל
  choice: கூடாரம்
  rationale: எபிரெயச் சொல் இங்கு நேரடியாக ‘கூடாரம்’ என்று பொருள்படுகிறது. ‘திருக்கூடாரம்’ என விளக்கமாக மாற்றாமல் மூலத்தின் சொல்வடிவம் காக்கப்படுகிறது.
