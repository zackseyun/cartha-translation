  register: நவீன நிலையான தமிழில், கட்டுமான அறிவுறுத்தலுக்கேற்ற மரியாதையான நேரடி நடையைக் கொண்ட மொழிபெயர்ப்பு. எபிரெய மூலத்தின் ‘ஒரு திரைச்சீலை’ என்ற வடிவமும் நிறச்சொல்லின் பரப்பும் அடிக்குறிப்புகளுடன் பாதுகாக்கப்பட்டுள்ளன.
