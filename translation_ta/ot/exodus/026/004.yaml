revisions:
- from: முதலாவது இணைப்புத் தொகுதியின் கடைசியில் இருக்கும் ஒரு திரைச்சீலையின் ஓரத்தில் நீலநிற வளையங்களைச் செய்வாய்[a][b]; அதேபோல், இரண்டாவது இணைப்புத் தொகுதியின் கடைசி திரைச்சீலையின் ஓரத்திலும் செய்வாய்[c].
  to: முதல் இணைக்கப்பட்ட தொகுதியின் இறுதியில் உள்ள அந்த ஒரு திரைச்சீலையின் ஓரத்தில் நீலநிற வளையங்களைச் செய்வாய்[a][b]; அதேபோல், இரண்டாவது இணைக்கப்பட்ட தொகுதியில் வெளிப்புறத்தில் உள்ள திரைச்சீலையின் ஓரத்திலும் செய்வாய்[c].
