base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: ta
  text: முதல் இணைக்கப்பட்ட தொகுதியின் இறுதியில் உள்ள அந்த ஒரு திரைச்சீலையின் ஓரத்தில் நீலநிற வளையங்களைச் செய்வாய்[a][b]; அதேபோல், இரண்டாவது இணைக்கப்பட்ட தொகுதியில் வெளிப்புறத்தில் உள்ள திரைச்சீலையின் ஓரத்திலும் செய்வாய்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீலநிற” என்பதற்கு “நீல-ஊதா நிற” அல்லது “ஊதா நிற” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் கூடாரத்தில் பயன்படுத்தப்பட்ட தனித்துவமான நீலச் சாயமிட்ட பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “இணைக்கப்பட்ட தொகுதி” என்பது ஒன்றாக இணைக்கப்பட்ட திரைச்சீலைகளின் தொகுதியைக் குறிக்கிறது; மரபாக “இணைப்பு” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: “வெளிப்புறத்தில் உள்ள திரைச்சீலை” என்பதற்கு “இறுதியில் உள்ள திரைச்சீலை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: வளையங்கள்
  rationale: திரைச்சீலைகளை ஒன்றோடொன்று இணைப்பதற்கான வளைய வடிவப் பொருத்துகளை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: תְּכֵלֶת
  choice: நீலநிற
  rationale: கூடாரத் துணிகளில் பயன்படுத்தப்பட்ட தனித்துவமான நீலம் அல்லது நீல-ஊதா சாயப்பொருளைக் குறிக்கிறது; எபிரெயச் சொல் நூல் என்று வெளிப்படையாகச் சொல்லாததால் பொருளைச் சேர்க்கவில்லை.
- source_word: שְׂפַת
  choice: ஓரம்
  rationale: துணியின் எல்லையைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: יְרִיעָה
  choice: திரைச்சீலை
  rationale: இங்கு கூடாரத்தை அமைக்கும் துணிப் பகுதிகளில் ஒன்றைக் குறிக்கிறது; தமிழில் புரிந்துகொள்ள எளிதான சூழல்சார் சொல்.
- source_word: הָאֶחָת
  choice: ஒரு
  rationale: எபிரெய மொழியின் ‘அந்த ஒன்று’ என்ற குறிப்பை ‘முதல்’ என்று மாற்றாமல் பாதுகாக்கிறது.
- source_word: מִקָּצָה
  choice: கடைசியில் இருக்கும்
  rationale: இணைக்கப்பட்ட தொகுதியின் முனையில் அமைந்த திரைச்சீலையை இயல்பான தமிழில் அடையாளப்படுத்துகிறது.
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  choice: இணைப்புத் தொகுதி
  rationale: பல திரைச்சீலைகள் இணைக்கப்பட்டு உருவான ஓர் அலகு என்ற பொருளைச் சுருக்கமாகத் தருகிறது; இரு தொடர்புடைய எபிரெயச் சொற்களுக்கும் ஒரே தமிழ்ச் சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְכֵן
  choice: அதேபோல்
  rationale: இரண்டாவது தொகுதிக்கும் இதே செய்முறை பொருந்துவதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַקִּיצוֹנָה
  choice: கடைசி
  rationale: தொகுதியின் முனையிலுள்ள திரைச்சீலையைக் குறிக்கிறது; ‘வெளிப்புறமான’ என்பதைக் காட்டிலும் இச்சூழலில் தெளிவானது.
- source_word: הַשֵּׁנִית
  choice: இரண்டாவது
  rationale: இரண்டு இணைக்கப்பட்ட தொகுதிகளில் இரண்டாமதைக் குறிப்பாக அடையாளப்படுத்துகிறது.
