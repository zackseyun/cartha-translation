  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: ta
  text: கூடாரத்தின் நுழைவாயிலுக்காக நீல, ஊதா, செந்நிற நூல்களாலும் மெல்லிய முறுக்கப்பட்ட ஆளிநார் நூலாலும், அலங்காரத் தையல் கலைஞனின் வேலைப்பாடாக ஒரு மறைப்புத் திரையைச் செய்ய வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மறைப்புத் திரை’ என்பதற்குப் பதிலாக ‘தொங்குதிரை’ அல்லது ‘மூடுதிரை’ என்றும் மொழிபெயர்க்கலாம். இந்த அதிகாரத்தில் வேறிடத்தில் கூறப்படும் உட்புறத் திரையிலிருந்து இதை வேறுபடுத்துவதற்காக இங்கே ‘மறைப்புத் திரை’ பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: மறைப்புத் திரை
  rationale: நுழைவாயிலை மூடும் அல்லது மறைக்கும் தொங்குதுணி என்ற செயல்பாட்டை இயல்பாகக் காட்டுகிறது; இதே அதிகாரத்தில் உள்ள உட்புறத் திரையிலிருந்து வேறுபடுத்தவும் உதவுகிறது.
- source_word: לְפֶתַח הָאֹהֶל
  choice: கூடாரத்தின் நுழைவாயிலுக்காக
  rationale: פֶתַח என்பதன் நுழைவு/திறப்பு பொருளையும் אֹהֶל என்பதன் நேரடியான ‘கூடாரம்’ பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: תְּכֵלֶת
  choice: நீலம்
  rationale: நீலம் அல்லது ஊதாநீலச் சாயமிட்ட உயர்தர நூற்பொருளைக் குறிக்கிறது; பட்டியலில் எளிதில் புரியும் வழக்கமான நிறப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַרְגָּמָן
  choice: ஊதா
  rationale: ஊதாச் சாயமிட்ட நூற்பொருளுக்கான இயல்பான, மரபாகப் புரிந்துகொள்ளப்படும் நிறப்பெயர்.
- source_word: תוֹלַעַת שָׁנִי
  choice: செந்நிற நூல்கள்
  rationale: சொல்லை நேரடியாகப் புழுவைக் குறிப்பதாக அல்லாமல், சூழலுக்கேற்ற செந்நிறச் சாயமிட்ட நூற்பொருளாக மொழிபெயர்க்கிறது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: முறுக்கப்பட்ட மெல்லிய நார்ப்பட்டு
  rationale: שֵׁשׁ குறிக்கும் உயர்தர மெல்லிய லினன் வகைத் துணிப்பொருளையும், מָשְׁזָר குறிக்கும் முறுக்கப்பட்ட நூல் தயாரிப்பையும் பாதுகாக்கிறது.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: பூத்தையல் கலைஞனின் வேலைப்பாடு
  rationale: அலங்கார நிறத்தையல் செய்யும் திறமையான கைவினைஞரின் பணியைச் சுட்டுகிறது; வெறுமனே ‘தையல்’ என்பதைக் காட்டிலும் கலைநயத்தை வெளிப்படுத்துகிறது.
- source_word: וְעָשִׂיתָ
  choice: நீ ... செய்ய வேண்டும்
  rationale: கூடார அமைப்பு வழிமுறைகளின் தொடரில் உள்ள கட்டளைத் தன்மையை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
