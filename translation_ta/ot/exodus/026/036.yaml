translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல்லின் செயல்பாட்டைத் தெளிவாக்க ‘மறைப்புத் திரை’ தேர்ந்தெடுக்கப்பட்டது. பொருட்களின் பட்டியல் தமிழில் இயல்பாக வாசிக்க இரு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; இரண்டாம் வாக்கியத்தில் மூலத்தின் செயப்படுபொருள் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
