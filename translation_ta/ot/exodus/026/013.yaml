revisions:
- from: 'கூடாரத் திரைச்சீலைகளின் நீளத்தில் கூடுதலாக இருக்கும் ஒரு முழம் இந்தப் பக்கத்திலும், ஒரு முழம் அந்தப் பக்கத்திலும்[a], திருவுறைவிடத்தின்[b] இரு பக்கங்களிலும் தொங்கி அதை மூடும்.


    [a] எபிரெய மொழியில், “இந்தப் பக்கத்தில் அந்த முழமும், அந்தப் பக்கத்தில் அந்த முழமும்” என்று உள்ளது. இங்கு ஒவ்வொரு பக்கத்திலும் எஞ்சியிருக்கும் அளவு குறிக்கப்படுகிறது.


    [b] “திருவுறைவிடம்” என்பது எபிரெய மொழியின் மிஷ்கான் என்ற சொல்லின் மொழிபெயர்ப்பு. இது கூடாரத் திரை மூடியிருந்த புனித உறைவிட அமைப்பைக் குறிக்கிறது.'
  to: கூடாரத் திரைச்சீலைகளின் நீளத்தில் எஞ்சியிருக்கும் ஒரு முழம் இந்தப் பக்கத்திலும், ஒரு முழம் அந்தப் பக்கத்திலும்[a], வாசஸ்தலத்தின் இருபுறங்களிலும் அதை மூடுவதற்காகத் தொங்கும்.[b]
  rationale: The revision preserves the Hebrew architectural description and repeated one-cubit measure, uses an idiomatic Tamil term for mishkan, and makes the purpose of the overhanging curtains explicit. Both footnote anchors remain attached to the relevant expressions, and note a is corrected to reflect the Hebrew accurately.
