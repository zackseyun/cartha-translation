  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: ta
  text: கூடாரத் திரைச்சீலைகளின் நீளத்தில் எஞ்சியிருக்கும் ஒரு முழம் இந்தப் பக்கத்திலும், ஒரு முழம் அந்தப் பக்கத்திலும்[a], வாசஸ்தலத்தின் இருபுறங்களிலும் அதை மூடுவதற்காகத் தொங்கும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இந்தப் பக்கத்தில் ஒரு முழம், அந்தப் பக்கத்தில் ஒரு முழம்” என்ற கருத்து மீண்டும் கூறப்படுகிறது. ஒவ்வொரு பக்கத்திலும் எஞ்சியிருக்கும் அளவையே இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “வாசஸ்தலம்” என்பது எபிரெய மிஷ்கான் என்ற சொல்லின் மொழிபெயர்ப்பு. இது கூடார மூடுதலுக்குக் கீழே இருந்த புனித உறைவிட அமைப்பைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה
  choice: ஒரு முழம்
  rationale: אַמָּה என்பது பழங்கால நீள அளவான ‘முழம்.’ எபிரெயச் சொல்லில் திட்டவட்டச் சுட்டு இருந்தாலும், ஒவ்வொரு பக்கத்திலும் எஞ்சிய அளவை இயல்பான தமிழில் ‘ஒரு முழம்’ எனக் கூறுவது தெளிவாக உள்ளது.
- source_word: מִזֶּה ... מִזֶּה
  choice: இந்தப் பக்கத்திலும் ... அந்தப் பக்கத்திலும்
  rationale: இரண்டு எதிரெதிர் பக்கங்களைக் குறிக்கும் சுட்டுச் சொற்றொடரின் மீளுரைப்பைத் தமிழிலும் இயல்பாகப் பேணுகிறது.
- source_word: בָּעֹדֵף
  choice: கூடுதலாக இருக்கும்
  rationale: திரைச்சீலைகளின் நீளத்தில் கட்டமைப்பின் அளவைத் தாண்டி எஞ்சியிருக்கும் பகுதியைக் குறிக்கிறது.
- source_word: אֹרֶךְ
  choice: நீளம்
  rationale: கட்டுமானச் சூழலில் நேரடியான பரிமாணச் சொல்.
- source_word: יְרִיעֹת הָאֹהֶל
  choice: கூடாரத் திரைச்சீலைகள்
  rationale: יְרִיעֹת என்பது துணியால் ஆன திரைப் பலகைகளையும், הָאֹהֶל அவை கூடாரத்திற்குரியவை என்பதையும் குறிக்கின்றன.
- source_word: יִהְיֶה סָרוּחַ
  choice: தொங்கி
  rationale: எஞ்சிய துணி பக்கங்களின்மேல் கீழாகத் தொங்கும் காட்சியைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: திருவுறைவிடத்தின் இரு பக்கங்கள்
  rationale: מִשְׁכָּן என்பது புனித உறைவிட அமைப்பு; צִדֵּי என்ற பன்மை இங்கு அதன் இரு பக்கங்களைக் குறிக்கிறது.
- source_word: לְכַסֹּתוֹ
  choice: அதை மூடும்
  rationale: தொங்கும் கூடுதல் துணியின் நோக்கம் திருவுறைவிடத்தை மூடுவதே என்பதைத் தெரிவிக்கும் நோக்கவினையை இயல்பான தமிழில் தருகிறது.
