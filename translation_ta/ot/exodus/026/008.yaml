base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: ta
  text: ஒவ்வொரு திரைச்சீலையின்[a] நீளம் முப்பது முழமும், அதன் அகலம் நான்கு முழமும் இருக்க வேண்டும்; பதினொரு திரைச்சீலைகள் அனைத்தும் ஒரே அளவில்[b] இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘அந்த ஒரு திரைச்சீலை’ என்று உள்ளது; இங்கு அது தனித்தனி திரைச்சீலை ஒவ்வொன்றையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல் ‘ஒரு அளவு’; பதினொரு திரைச்சீலைகளும் ஒரே பரிமாணங்களில் செய்யப்பட வேண்டும் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: நீளம்
  rationale: רֹחַב (‘அகலம்’) என்பதுடன் இணையாக வரும் வழக்கமான பரிமாணச் சொல்.
- source_word: יְרִיעָה
  choice: திரைச்சீலை
  rationale: திருவாசஸ்தலச் சூழலில் பெரிய துணி மூடுதுண்டைக் குறிக்கிறது; நவீன தமிழில் ‘திரைச்சீலை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הָאַחַת / הָאֶחָת
  choice: ஒவ்வொரு
  rationale: சொல்லுக்குச் சொல் ‘அந்த ஒன்று’ என்றாலும், இங்கு தனித்தனி திரைச்சீலைகள் ஒவ்வொன்றையும் பகிர்ந்தளிக்கும் பொருளில் சுட்டுகிறது.
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: முப்பது முழம்
  rationale: பண்டைய அளவான אַמָּה-வை நவீன அலகாக மாற்றாமல், தமிழில் வழக்கமான ‘முழம்’ எனத் தக்கவைக்கிறது.
- source_word: רֹחַב
  choice: அகலம்
  rationale: ‘நீளம்’ என்பதற்கு இணையான இயல்பான தமிழ்ப் பரிமாணச் சொல்.
- source_word: אַרְבַּע בָּאַמָּה
  choice: நான்கு முழம்
  rationale: மூலத்தின் பண்டைய அளவலகை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: מִדָּה אַחַת
  choice: ஒரே அளவில்
  rationale: சொல்லுக்குச் சொல் ‘ஒரு அளவு’; பதினொரு திரைச்சீலைகளும் ஒரே பரிமாணங்களைக் கொண்டிருந்ததை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: பதினொரு திரைச்சீலைகள் அனைத்தும்
  rationale: லְ முன்னொட்டு முழுத் தொகுப்புக்கும் ஒரே அளவு பொருந்துவதைக் காட்டுகிறது; தமிழில் எழுவாயாக அமைப்பது இயல்பானது.
