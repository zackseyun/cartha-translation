base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/016.yaml
  text: The length of each frame shall be ten cubits[a], and the width of each frame one and a half cubits.
translation:
  language: ta
  text: ஒவ்வொரு சட்டத்தின் நீளம் பத்து முழமும், அதன் அகலம் ஒன்றரை முழமும் இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை மரபான முறையில் ‘பலகை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶרֶשׁ
  choice: சட்டம்
  rationale: திருக்கூடாரக் கட்டுமானச் சூழலில், இது செங்குத்தாக நிறுத்தப்படும் கட்டமைப்பு உறுப்பைக் குறிக்கிறது. ‘சட்டம்’ அதன் கட்டமைப்புப் பணியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அதேவேளை ‘பலகை’ என்ற மரபான மாற்றும் சாத்தியம்.
- source_word: עֶשֶׂר אַמּוֹת
  choice: பத்து முழம்
  rationale: பண்டைய அளவலகான אַמָּה என்பதற்கு தமிழில் வழக்கமான ‘முழம்’ பயன்படுத்தப்பட்டு, அளவு மாற்றமின்றிப் பாதுகாக்கப்படுகிறது.
- source_word: אֹרֶךְ
  choice: நீளம்
  rationale: கட்டுமான அளவைக் குறிக்கும் இச்சொல்லின் நேரான, இயல்பான தமிழ் இணை.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: ஒன்றரை முழம்
  rationale: ‘ஒரு முழமும் அரை முழமும்’ என்ற எபிரெய வடிவின் சரியான அளவை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: רֹחַב
  choice: அகலம்
  rationale: கட்டுமானப் பொருளின் குறுக்குப் பரிமாணத்தைத் தெளிவாகக் குறிக்கும் பொதுவான நவீன தமிழ்ச்சொல்.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: ஒவ்வொரு சட்டமும் / அதன்
  rationale: உறுப்பொன்றின் தனித்தனி அளவைச் சொல்லும் எபிரெய ஒருமை வடிவின் பகிர்வுப் பொருளைத் தமிழில் ‘ஒவ்வொரு’ என்பதன் மூலம் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், கட்டுமான வழிமுறைக்கேற்ற தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய அளவலகு ‘முழம்’ என மாற்றமின்றி வைக்கப்பட்டுள்ளது.
