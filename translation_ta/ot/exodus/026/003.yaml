translation_notes:
  register: நவீன தரத் தமிழில், கட்டுமான அறிவுறுத்தலுக்கேற்ற தெளிவான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் இரு இணையான கூறுகளும் காக்கப்பட்டுள்ளன; தேவையற்ற சமயப் பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
