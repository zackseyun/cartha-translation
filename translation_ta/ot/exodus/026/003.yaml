base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/003.yaml
  text: Five curtains shall be joined to one another[a], and five curtains shall be joined to one another.
translation:
  language: ta
  text: ஐந்து திரைச்சீலைகள் ஒன்றோடொன்று இணைக்கப்பட வேண்டும்[a]; மற்ற ஐந்து திரைச்சீலைகளும் ஒன்றோடொன்று இணைக்கப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “ஒரு பெண் தன் சகோதரியோடு.” இது ஒன்றுக்கொன்று பொருந்தும் பொருட்கள் இணைக்கப்படுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  choice: திரைச்சீலைகள்
  rationale: திருவாசஸ்தல அமைப்பின் சூழலில், இச்சொல் பெரிய துணித் திரைகளைக் குறிக்கிறது. ‘திரைச்சீலைகள்’ என்பது நவீன தமிழில் இயல்பாகவும் கட்டுமானச் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: תִּהְיֶיןָ
  choice: இணைக்கப்பட வேண்டும்
  rationale: இங்கு היה வினையின் நிறைவுறா வடிவம் கட்டுமான அறிவுறுத்தலுக்குரிய கட்டளை/விதிப்பு நுணுக்கத்தைக் கொண்டுள்ளது; ‘வேண்டும்’ அதைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֹבְרֹת
  choice: இணைக்கப்பட
  rationale: חבר என்பதன் அடிப்படைப் பொருள் ‘இணைத்தல், சேர்த்தல்.’ துணித் திரைகளை ஒன்றுடன் ஒன்று சேர்ப்பதை ‘இணைக்கப்பட’ இயல்பாகக் கூறுகிறது.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ஒன்றோடொன்று
  rationale: சொல்லுக்குச் சொல் ‘ஒரு பெண் தன் சகோதரியோடு’ என்றாலும், உயிரற்ற பெண்பால் பெயர்ச்சொற்கள் ஒன்றுக்கொன்று பொருந்தி இணைவதைக் குறிக்கும் எபிரெய மரபுத்தொடர் இது. தமிழில் ‘ஒன்றோடொன்று’ அதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: ஐந்து ... மற்ற ஐந்து
  rationale: வசனம் பத்துத் திரைச்சீலைகளை ஐந்து வீதம் இரு தொகுதிகளாகப் பிரிக்கிறது. இரண்டாம் தொகுதியைத் தமிழில் தெளிவாகச் சுட்ட ‘மற்ற’ சேர்க்கப்பட்டுள்ளது; எண் அமைப்பு மாறவில்லை.
