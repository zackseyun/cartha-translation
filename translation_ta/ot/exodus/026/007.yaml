  yaml_path: translation/ot/exodus/026/007.yaml
  text: You shall make curtains of goats’ hair for a tent over the tabernacle[a]; you shall make them as eleven curtains.
translation:
  language: ta
  text: 7 திருவுறைவிடத்தின் மேல் கூடாரமாக இருக்கும்படி, வெள்ளாட்டு மயிரினால்[a] திரைச்சீலைகளைச் செய்ய வேண்டும்; பதினொரு திரைச்சீலைகளைச் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படி, ‘வெள்ளாடுகளின் திரைச்சீலைகள்.’ எபிரெயத்தில் ‘வெள்ளாடுகள்’ என்பது அவற்றின் மயிரால் செய்யப்பட்ட பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்ய வேண்டும்
  rationale: தொடர்ச்சியான கட்டுமான அறிவுறுத்தலில் வரும் இரண்டாம் நபர் வினை வடிவத்தை, நவீனத் தமிழில் நேரடியான கட்டளையாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְרִיעֹת
  choice: திரைச்சீலைகள்
  rationale: திருவுறைவிடக் கட்டுமானச் சூழலில் பெரிய துணிப் படலங்களைக் குறிக்கும் சொல்லுக்கு தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: עִזִּים
  choice: வெள்ளாட்டு மயிரால்
  rationale: எபிரெயச் சொல் சொற்படியாக ‘வெள்ளாடுகள்’ என்றாலும், இங்கு அவற்றின் மயிரால் செய்யப்பட்ட துணிப்பொருளைக் குறிக்கிறது; தமிழில் பொருளைத் தெளிவாக்க ‘மயிரால்’ சேர்க்கப்பட்டது.
- source_word: לְאֹהֶל
  choice: ஒரு கூடாரமாக அமைவதற்கு
  rationale: לְ முன்னிடைச்சொல் இங்கு நோக்கம் அல்லது பயன்பாட்டைக் குறிக்கிறது; திரைச்சீலைகள் கூடார மூடுதலாக அமையும் கருத்தை இயல்பாகத் தருகிறது.
- source_word: עַל הַמִּשְׁכָּן
  choice: திருவுறைவிடத்தின் மேல்
  rationale: עַל என்பதன் இடநிலைக் கருத்தை ‘மேல்’ காக்கிறது; מִשְׁכָּן என்பதற்கு புனித உறைவிடத்தைக் குறிக்கும் தெளிவான ‘திருவுறைவிடம்’ பயன்படுத்தப்பட்டது.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: பதினொரு
  rationale: எபிரெய எண்ணின் நேரடியான தமிழ் வடிவம்.
- source_word: יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: மொத்தம் பதினொரு திரைச்சீலைகளைச் செய்ய வேண்டும்
  rationale: மூலத்தில் ‘திரைச்சீலைகள்’ மீண்டும் வருவதையும் மொத்த எண்ணிக்கையின் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
