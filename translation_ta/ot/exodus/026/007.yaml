translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாயும் வழிபாட்டு/கட்டுமான அறிவுறுத்தலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘திருவுறைவிடம்’ என்பது மִשְׁכָּן என்பதன் ‘உறைவிடம்’ சார்ந்த அடிப்படைப் பொருளையும் புனிதச் சூழலையும் ஒருங்கே வெளிப்படுத்துகிறது.
