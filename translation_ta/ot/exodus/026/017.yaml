revisions:
- from: ஒவ்வொரு பலகைக்கும் ஒன்றோடொன்று இணைந்த இரண்டு பொருத்து முனைகள் இருக்க வேண்டும்[a]. திருவாசஸ்தலத்தின் எல்லாப் பலகைகளையும் இவ்வாறே செய்ய வேண்டும்.
  to: ஒவ்வொரு பலகையிலும் ஒன்றுக்கொன்று பொருந்துமாறு அமைந்த இரண்டு பொருத்து முனைகள் இருக்க வேண்டும்[a]. திருவாசஸ்தலத்தின் எல்லாப் பலகைகளையும் இவ்வாறே செய்ய வேண்டும்.
  rationale: The revision preserves the intended carpentry sense of “tenons” while avoiding the implication that the two tenons are physically joined to each other. The footnote retains the Hebrew’s striking idiom without presenting an interpretive comparison as a literal quotation.
