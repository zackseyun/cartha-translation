    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “ஒரு பலகைக்கு இரண்டு கைகள், இணைக்கப்பட்டவை, ஒரு பெண் தன் சகோதரியிடம்.” இது ஒத்த பகுதிகள் ஒன்றுக்கொன்று பொருந்தி அமைவதைக் குறிக்கும் வழக்கு. இங்கே “கைகள்” என்பது பலகையிலிருந்து நீண்டு, அதை அடித்தளத்தில் பொருத்த உதவும் இணைப்புப் பகுதிகளைக் குறிக்கிறது.
