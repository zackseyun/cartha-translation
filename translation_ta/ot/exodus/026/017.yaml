translation_notes:
  register: நவீன தரத் தமிழில், கட்டுமான அறிவுறுத்தலுக்கேற்ற தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளது. தொழில்நுட்பமான ‘tenon’ என்பதற்குப் பொதுவாசகர் புரிந்துகொள்ளக்கூடிய ‘பொருத்து முனை’ பயன்படுத்தப்பட்டு, மூலத்தின் உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
