base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/017.yaml
  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
translation:
  language: ta
  text: ஒவ்வொரு பலகையிலும் ஒன்றுக்கொன்று பொருந்துமாறு அமைந்த இரண்டு பொருத்து முனைகள் இருக்க வேண்டும்[a]. திருவாசஸ்தலத்தின் எல்லாப் பலகைகளையும் இவ்வாறே செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “ஒரு பலகைக்கு இரண்டு கைகள், இணைக்கப்பட்டவை, ஒரு பெண் தன் சகோதரியிடம்.” இது ஒத்த பகுதிகள் ஒன்றுக்கொன்று பொருந்தி அமைவதைக் குறிக்கும் வழக்கு. இங்கே “கைகள்” என்பது பலகையிலிருந்து நீண்டு, அதை அடித்தளத்தில் பொருத்த உதவும் இணைப்புப் பகுதிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: பொருத்து முனைகள்
  rationale: சொல்லுக்கு நேரடியாக ‘கைகள்’ என்று பொருள். ஆனால் இக்கட்டுமானச் சூழலில், அடித்தளங்களில் பொருத்துவதற்காகப் பலகையிலிருந்து நீளும் இணைப்புப் பகுதிகளைக் குறிக்கிறது; ‘பொருத்து முனைகள்’ என்பது பொதுவாசகருக்குத் தெளிவான தமிழாக்கம்.
- source_word: מְשֻׁלָּבֹת
  choice: இணைந்த
  rationale: இரண்டு முனைகளும் ஒன்றுக்கொன்று தொடர்புடையவையாக அல்லது இணையாக அமைக்கப்படுவதைச் சொல்கிறது; இணைப்பு முறையைத் தேவையின்றி மிகத் துல்லியமாக வரையறுக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ஒன்றோடொன்று
  rationale: ‘ஒரு பெண் தன் சகோதரியோடு’ என்ற சொல்லுக்குச் சொல் எபிரெய வழக்கு, ஒத்த பகுதிகள் ஒன்றுக்கொன்று அமைந்திருப்பதைக் குறிக்கிறது. தமிழில் ‘ஒன்றோடொன்று’ அதன் இயல்பான கருத்தைத் தருகிறது.
- source_word: קֶרֶשׁ
  choice: பலகை
  rationale: திருவாசஸ்தலத்தின் செங்குத்தான மரக் கட்டுமான உறுப்பைக் குறிக்கும் எளிய, இயல்பான தமிழ்ச் சொல்.
- source_word: מִשְׁכָּן
  choice: திருவாசஸ்தலம்
  rationale: அடிப்படைப் பொருள் ‘வாசஸ்தலம்’; யாத்திராகமத்தில் தேவனுடைய எடுத்துச் செல்லக்கூடிய பரிசுத்த வாசஸ்தலத்திற்கான நிலையான சூழல்சார் பெயராக வருகிறது.
- source_word: כֵּן תַּעֲשֶׂה
  choice: இவ்வாறே செய்ய வேண்டும்
  rationale: அனைத்துப் பலகைகளுக்கும் பின்பற்ற வேண்டிய செய்முறையைத் தெளிவான நவீனத் தமிழில் கட்டளையாகத் தெரிவிக்கிறது.
- source_word: שְׁתֵּי
  choice: இரண்டு
  rationale: ‘பொருத்து முனைகள்’ என்பதைக் குறிக்கும் நேரடியான எண்ணுப்பெயர்.
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: ஒவ்வொரு பலகைக்கும்
  rationale: சொல்லமைப்பில் ‘அந்த ஒரு பலகைக்கு’ என்றிருந்தாலும், சூழலில் ஒவ்வொரு தனிப்பலகைக்கும் பொருந்தும் பகிர்ந்தளிக்கும் பொருள் உள்ளது.
