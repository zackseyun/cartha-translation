base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: ta
  text: இணைப்பான்களுக்குக் கீழே அந்தத் திரையைத் தொங்கவிட வேண்டும். அங்கே, திரைக்கு உட்புறத்தில் சாட்சிப் பெட்டியை[a] கொண்டுவந்து வைக்க வேண்டும். அந்தத் திரை உங்களுக்காகப் பரிசுத்த இடத்தையும் மகா பரிசுத்த இடத்தையும்[b] பிரிக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உடன்படிக்கைப் பெட்டி.’ இங்கு எபிரெய மூலத்தில் ‘சாட்சி’ என்றே உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘பரிசுத்தங்களின் பரிசுத்தம்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: திரை
  rationale: உட்புறப் பரிசுத்த அறையை மறைத்துப் பிரிக்கும் தொங்குதிரையைச் சுட்டுகிறது. நவீன தமிழில் இயல்பாகவும் வழிபாட்டிடச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: קְרָסִים
  choice: இணைப்பான்கள்
  rationale: கூடாரத் துணிகளை ஒன்றோடொன்று இணைக்கப் பயன்பட்ட பொருள்களைக் குறிக்கிறது. அவற்றின் துல்லியமான வடிவத்தைத் தேவையின்றி வரையறுக்காமல் செயல்பாட்டைத் தெளிவுபடுத்துகிறது.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: திரைக்கு உட்புறத்தில்
  rationale: திரையால் பிரிக்கப்பட்ட உள் பக்கத்திலுள்ள இடத்தைக் குறிக்கும் எபிரெய இடவியல் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲרוֹן הָעֵדוּת
  choice: சாட்சிப் பெட்டி
  rationale: இவ்வசனத்தில் உள்ள עֵדוּת என்பதன் நேரடிப் பொருளான ‘சாட்சி’ என்பதைக் காக்கிறது; பழக்கமான ‘உடன்படிக்கைப் பெட்டி’ என்ற பெயருடன் அமைதியாக ஒத்திசைக்கவில்லை.
- source_word: וְהִבְדִּילָה
  choice: பிரிக்கும்
  rationale: திரை இரண்டு பரிசுத்தப் பகுதிகளுக்கும் இடையே வேறுபடுத்திப் பிரிக்கும் செயல்பாட்டை இயல்பாகக் கூறுகிறது.
- source_word: לָכֶם
  choice: உங்களுக்காக
  rationale: எபிரெய உரையில் வெளிப்படையாக உள்ள பன்மை முன்னிலைச் சுட்டைத் தக்கவைத்து, இஸ்ரவேலரின் வழிபாட்டு ஒழுங்கில் திரையின் செயல்பாட்டைக் காட்டுகிறது.
- source_word: הַקֹּדֶשׁ
  choice: பரிசுத்த இடம்
  rationale: உட்புற அறைக்கு வெளியேயுள்ள பரிசுத்த அறையைத் தெளிவாகக் குறிக்கும் வழிபாட்டிடச் சொற்றொடர்.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்த இடம்
  rationale: ‘பரிசுத்தங்களின் பரிசுத்தம்’ என்ற எபிரெய மிகையுயர்வு அமைப்பின் பொருளைத் தெளிவான நவீன தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: உட்புறப் பரிசுத்த அறைக்கான வழிபாட்டிடப் பெயர்
  choice: மகா பரிசுத்த இடம்
  alternative: பரிசுத்தங்களின் பரிசுத்த இடம்
  rationale: எபிரெய மிகையுயர்வு சொற்றொடரின் பொருளை அணுகத்தக்க தமிழில் தருகிறது; அதன் நேரடி அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பெட்டியின் பெயரில் עֵדוּת என்பதன் மொழிபெயர்ப்பு
  choice: சாட்சிப் பெட்டி
  alternative: உடன்படிக்கைப் பெட்டி
  rationale: இந்த வசனத்தின் எபிரெயச் சொல் ‘சாட்சி’ என்பதே; ஆகவே பரிச்சயமான வேறொரு வேதாகமப் பெயருடன் ஒத்திசைக்காமல் மூலச்சொல் முன்னுரிமை பெறுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும்படியும் வழிபாட்டிடச் சூழலுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ஒருமை ஆணைத் தொடர் தமிழில் இயல்பான ‘வேண்டும்’ அமைப்பால் தரப்பட்டுள்ளது; லָכֶם என்பதிலுள்ள பன்மை ‘உங்களுக்காக’ என்று வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
