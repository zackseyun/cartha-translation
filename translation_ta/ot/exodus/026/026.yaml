translation_notes:
  register: நவீனத் தரத் தமிழில், கட்டுமான அறிவுறுத்தலுக்கேற்ற சுருக்கமான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘திருவுறைவிடம்’ என்பது מִשְׁכָּן என்பதன் வாசஸ்தலக் கருத்தை வெளிப்படுத்துகிறது; ‘சீத்திம் மரம்’ வாசகர்களுக்கு அறிமுகமான மரப்பெயரைத் தக்கவைக்கிறது.
