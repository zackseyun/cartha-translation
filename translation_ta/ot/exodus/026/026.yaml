- from: மேலும், திருவுறைவிடத்தின் ஒரு பக்கத்திலுள்ள சட்டங்களுக்காகச் சீத்திம் மரத்தால் ஐந்து தாழ்ப்பாள்களைச் செய்வாய்.[a]
  to: மேலும், திருவாசஸ்தலத்தின் ஒரு பக்கத்திலுள்ள பலகைகளுக்காக அக்காசியா மரத்தால் ஐந்து தாழ்க்கம்பிகளைச் செய்வாய்.[a]
