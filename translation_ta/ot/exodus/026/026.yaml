  edition: WLC
  text: וְ/עָשִׂ֥יתָ בְרִיחִ֖ם עֲצֵ֣י שִׁטִּ֑ים חֲמִשָּׁ֕ה לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הָ/אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/026.yaml
  text: And you shall make five bars of acacia wood for the frames of the one side of the tabernacle[a].
translation:
  language: ta
  text: மேலும், திருவாசஸ்தலத்தின் ஒரு பக்கத்திலுள்ள பலகைகளுக்காக அக்காசியா மரத்தால் ஐந்து தாழ்க்கம்பிகளைச் செய்வாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பலகைகள்’ என்பதற்குப் பதிலாக ‘சட்டகங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் திருவாசஸ்தலத்தின் நிமிர்ந்த கட்டமைப்பு உறுப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: மேலும், ... செய்வாய்
  rationale: அறிவுறுத்தல் தொடரில் இணைப்புடன் வரும் வினை வடிவம் கட்டளையைக் குறிக்கிறது; முந்தைய கட்டுமான அறிவுறுத்தலோடு உள்ள தொடர்ச்சியையும் தமிழில் காக்கிறது.
- source_word: בְרִיחִם
  choice: தாழ்ப்பாள்கள்
  rationale: சட்டங்களை ஒன்றாகப் பிணைத்து நிலைநிறுத்தும் நீண்ட கட்டுமானக் கம்பிகளை இச்சூழலில் குறிக்கிறது; ‘தாழ்ப்பாள்’ என்பது கூடுதல் திசை விவரத்தைச் சேர்க்காமல் அதன் இணைப்புப் பணியை உணர்த்துகிறது.
- source_word: עֲצֵי שִׁטִּים
  choice: சீத்திம் மரத்தால்
  rationale: குறிப்பிட்ட மரவகையைத் தமிழில் வழக்கமான வேதாகமப் பெயரால் அடையாளப்படுத்துகிறது; பொருளால் செய்யப்பட்டதை இயல்பாக ‘மரத்தால்’ என வழங்குகிறது.
- source_word: חֲמִשָּׁה
  choice: ஐந்து
  rationale: தாழ்ப்பாள்களின் எண்ணிக்கையை நேரடியாக வழங்குகிறது.
- source_word: לְקַרְשֵׁי
  choice: சட்டங்களுக்காக
  rationale: קֶרֶשׁ என்பது திருவுறைவிடத்தின் நிமிர்ந்த கட்டமைப்பு உறுப்புகளைக் குறிக்கிறது; ‘சட்டங்கள்’ அவற்றின் கட்டுமானப் பணியைத் தெளிவாக்குகிறது, ஆனால் ‘பலகைகள்’ என்பதும் சாத்தியம்.
- source_word: צֶלַע
  choice: பக்கம்
  rationale: இங்கு சொல்லின் உருவகமற்ற கட்டடப் பொருள், திருவுறைவிடத்தின் பக்கவாட்டைக் குறிக்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: மூலச்சொல்லின் ‘வசிக்கும் இடம்’ என்ற கருத்தையும், யாத்திராகமத்தில் குறிப்பிட்ட பரிசுத்த கூடாரத்தைக் குறிக்கும் சூழலையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הָאֶחָד
  choice: ஒரு
  rationale: இரு பக்கங்களில் ஒன்றைக் குறிக்கிறது; அடுத்த வசனத்தில் வரும் மறுபக்கத்திற்கான அறிவுறுத்தலுக்கு முன்னேற்பாடாக உள்ளது.
