base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/028.yaml
  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: ta
  text: நிலைச்சட்டங்களின்[a] நடுவே இருக்கும் நடுக் குறுக்குச் சட்டம் ஒரு முனையிலிருந்து மறுமுனை வரை நீண்டிருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலகைகளின்.” எபிரெயச் சொல் திருக்கூடாரத்தின் செங்குத்தான கட்டமைப்புப் பகுதிகளைக் குறிக்கிறது; அவை வெறும் தட்டையான பலகைகள் என்ற எண்ணத்தைத் தவிர்க்க இங்கே “நிலைச்சட்டங்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: குறுக்குச் சட்டம்
  rationale: திருக்கூடாரத்தின் செங்குத்தான கட்டமைப்புப் பகுதிகளை ஒன்றாக இணைத்துப் பிடிக்கும் நீளமான சட்டத்தை இச்சொல் குறிக்கிறது; தமிழில் கட்டுமானச் சூழலுக்கு இயல்பாகவும் தெளிவாகவும் ‘குறுக்குச் சட்டம்’ அமைகிறது.
- source_word: הַתִּיכֹן
  choice: நடுக்
  rationale: மற்ற சட்டங்களுக்கு இடையில் அமைந்துள்ள அதன் இடத்தைக் குறிக்கும் பெயரடை; ‘நடுக்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּתוֹךְ
  choice: நடுவே இருக்கும்
  rationale: நிலைச்சட்டங்களுக்குள் அல்லது அவற்றின் மத்தியில் உள்ள இடநிலையைத் தெரிவிக்கிறது; சட்டம் துளைகளின் வழியாகச் சென்றது என்று மூலத்தில் இல்லாத கட்டுமான விவரத்தை இது சேர்ப்பதில்லை.
- source_word: הַקְּרָשִׁים
  choice: நிலைச்சட்டங்கள்
  rationale: திருக்கூடாரத்தின் செங்குத்தான கட்டமைப்புப் பகுதிகளை இச்சொல் குறிக்கிறது. வெறும் தட்டையான மரப்பலகைகள் என்ற எண்ணத்தைத் தவிர்க்க ‘நிலைச்சட்டங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מַבְרִחַ
  choice: நீண்டிருக்க வேண்டும்
  rationale: இங்குள்ள வினையெச்சம் சட்டம் கட்டமைப்பின் முழு நீளத்திலும் தொடர்வதை விவரிக்கிறது. துளைகளின் வழியாகக் கடந்து செல்வதாக அளவுக்கு மீறிக் குறிப்பாக்காமல், அறிவுறுத்தல் சூழலையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: ஒரு முனையிலிருந்து மறுமுனை வரை
  rationale: முழு நீளத்தையும் கடைசி வரை எட்டும் பொருளை இயல்பான நவீன தமிழில் தெளிவாகத் தருகிறது.
