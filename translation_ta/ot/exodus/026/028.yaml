translation_notes:
  register: நவீன தரத் தமிழில், கட்டுமான அறிவுறுத்தலுக்கேற்ற தெளிவும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘குறுக்குச் சட்டம்,’ ‘நிலைச்சட்டங்கள்’ ஆகிய சொற்கள் சாதாரண வாசகர்களுக்கும் புரியுமாறு தேர்ந்தெடுக்கப்பட்டன; எபிரெய மூலத்தில் வெளிப்படையாக இல்லாத இயந்திர அமைப்பு விவரங்கள் சேர்க்கப்படவில்லை.
