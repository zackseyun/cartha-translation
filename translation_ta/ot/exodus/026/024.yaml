  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: ta
  text: அவை கீழ்ப்பகுதியில் ஒன்றோடொன்று பொருந்திய இணையாக இருக்க வேண்டும்; மேலே, ஒரே வளையம் வரை, அவை ஒன்றுசேர்ந்து முழுமையாக இருக்க வேண்டும்.[a][b][c] அவை இரண்டுக்கும் இப்படியே இருக்க வேண்டும்; அவை அந்த இரண்டு மூலைகளுக்கானவையாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கீழே இரட்டையாக’ அல்லது ‘கீழே பொருந்தியவையாக’; எபிரெயச் சொல் இரு பலகைகளும் பொருந்திய இணையாக அமைவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘முழுமையடைய வேண்டும்’ அல்லது ‘முழுமையாகப் பொருந்த வேண்டும்’; இங்கு எபிரெயச் சொல் ஒழுக்கப் பரிபூரணத்தை அல்ல, கட்டமைப்பு முழுமையைச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘முதல் வளையம் வரை’; இந்தச் சொற்றொடர் இணைப் பலகைகளை மேலே சேர்க்கும் வளையத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
