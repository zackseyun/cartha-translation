  text: וְ/עָשִׂ֣יתָ פָרֹ֗כֶת תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב יַעֲשֶׂ֥ה אֹתָ֖/הּ כְּרֻבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: ta
  text: “நீலநூல், ஊதாநூல், செந்நிற நூல்[b], மெல்லிய முறுக்கப்பட்ட ஆளிநார் நூல் ஆகியவற்றால் ஒரு திரைச்சீலையை[a]ச் செய்ய வேண்டும். திறமையான கலைவேலைப்பாடாக, அதில் கேருபீன்களின் வடிவங்களைச் செய்ய வேண்டும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறைப்புத் திரை.” எபிரெயச் சொல் பரிசுத்த இடத்தையும் மகா பரிசுத்த இடத்தையும் பிரித்த உட்புறத் திரையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “செந்நிற நூல்” என்பதற்கான எபிரெயத் தொடர், இன்னும் சொல்லுக்குச் சொல்லாகச் செந்நிறச் சாயம் ஏற்றப்பட்ட பொருளைக் குறிக்கிறது; மரபாக அந்தச் சாயம் சிறு பூச்சிகளிலிருந்து பெறப்பட்டதாகக் கருதப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: פָרֹכֶת
  choice: மறைப்புத் திரை
  rationale: இது சாதாரணத் திரை மட்டுமல்லாமல், திருவாசஸ்தலத்தின் இரு பகுதிகளைப் பிரித்து மறைக்கும் உட்புறத் திரையைக் குறிக்கிறது. ‘மறைப்புத் திரை’ அதன் வடிவத்தையும் பணியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תְּכֵלֶת
  choice: நீலநூல்
  rationale: மதிப்புமிக்க நீலச் சாயம் ஏற்றப்பட்ட நெசவுப் பொருளைக் குறிக்கிறது. பொருட்களின் பட்டியலில் வருவதால் ‘நூல்’ என்பதை வெளிப்படையாகச் சேர்ப்பது தமிழில் தெளிவாக உள்ளது.
- source_word: אַרְגָּמָן
  choice: ஊதாநூல்
  rationale: திருவாசஸ்தல விவரிப்புகளில் வரும் விலையுயர்ந்த ஊதா நிறச் சாயம் ஏற்றப்பட்ட நெசவுப் பொருளைக் குறிக்கிறது.
- source_word: תוֹלַעַת שָׁנִי
  choice: செந்நிற நூல்
  rationale: செந்நிறச் சாயம் ஏற்றப்பட்ட பொருளைக் குறிக்கும் மரபுத்தொடர். அதன் நெசவுப் பொருள் சார்ந்த பொருளை ‘நூல்’ தெளிவாக்குகிறது; சாயத்தின் வரலாற்று மூலத்தை முதன்மை உரையில் தேவையின்றி விரிவாக்கவில்லை.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: முறுக்கப்பட்ட மெல்லிய சணல்நூல்
  rationale: שֵׁשׁ என்பது மெல்லிய சணலையும் מָשְׁזָר என்பது முறுக்கப்பட்ட அல்லது திரிக்கப்பட்ட தன்மையையும் குறிக்கிறது; இரு கூறுகளும் மொழிபெயர்ப்பில் காக்கப்பட்டுள்ளன.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: திறமையான கலைஞரின் வேலைப்பாடு
  rationale: இத்தொடர் நிபுணத்துவமும் கலைநயமும் கொண்ட வடிவமைப்பு வேலையைக் குறிக்கிறது. குறிப்பாக ‘பூவேலை’ அல்லது ஒரு தனிப்பட்ட நெசவு முறையென வரையறுக்காமல் மூலத்தின் பரந்த பொருளைக் காக்கிறது.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: அது செய்யப்பட வேண்டும்
  rationale: எபிரெயத்தில் இரண்டாம் நபர் கட்டளையிலிருந்து மூன்றாம் நபர் ஒருமை வினைக்கு மாறும் கட்டுமான அறிவுறுத்தலை, தமிழில் இயல்பான செயப்பாட்டு வடிவில் அளிக்கிறது.
- source_word: כְּרֻבִים
  choice: கேருபீன்களின் உருவங்களோடு
  rationale: கேருபீன்கள் திரையின் கலைவடிவத்தில் இடம்பெறுகின்றன என்பதைத் தெளிவாக்குகிறது. ‘கேருபீன்கள்’ என்ற மரபான வேதாகமப் பெயர் தக்கவைக்கப்பட்டுள்ளது; அவற்றின் இயல்பைப் பற்றிய கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: திருவாசஸ்தலக் கைவினை மொழியில் பிற்கால இறையியல் குறியீடுகளைச் சேர்த்தல்
  choice: திருவாசஸ்தலத்திற்கான நேரடியான கட்டுமான மற்றும் கலைப்பணி அறிவுறுத்தலாக மொழிபெயர்த்தல்
  alternative: திரை அல்லது கேருபீன்களின் பிற்கால வேதாகமத் தொடர்புகளை முன்னிறுத்தும் குறியீட்டு மொழியைப் பயன்படுத்துதல்
  rationale: இந்த வசனம் பொருட்கள், திரை, கேருபீன் வடிவங்கள், கலைவேலை ஆகியவற்றையே நேரடியாக அறிவுறுத்துகிறது. அது கூறாத பிற்கால இறையியல் விளக்கங்களை முதன்மை உரைக்குள் கொண்டுவராமல் உடனடிச் சூழலைக் காக்க வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், கட்டுமான அறிவுறுத்தலுக்கேற்ற கண்ணியமான மற்றும் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. வண்ணப் பெயர்களுடன் ‘நூல்’ சேர்க்கப்பட்டதால் பொருட்களின் பட்டியல் இயல்பாகிறது. ‘மறைப்புத் திரை’ வழிபாட்டிடச் சூழலைத் துல்லியமாகக் காட்டுகிறது; அடிக்குறிப்பு பொதுவான மாற்றுச் சொல்லை வழங்குகிறது.
