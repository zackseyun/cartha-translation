  verdict: revise
  source_fidelity: 'முக்கியப் பொருள் காக்கப்பட்டுள்ளது: உட்புறப் பிரிப்புத் திரை, நிறமிட்ட நெசவுப் பொருட்கள், திறமையான கலைவேலை, கேருபீன்கள் ஆகியவை இடம்பெறுகின்றன. ஆனால் שֵׁשׁ என்பது ஆளிநாரால் செய்யப்பட்ட மெல்லிய லினன்; ‘சணல்நூல்’ நவீனத் தமிழில் சணல்/ஜூட் அல்லது வேறு நாரைக் குறிப்பதால் துல்லியமல்ல. மேலும், கேருபீன்கள் திரையில் கலைவேலையாகச் செய்யப்பட வேண்டும் என்ற தொடர்பை உரையில் இன்னும் நேரடியாகக் காட்டலாம்.'
  naturalness: ‘மறைப்புத் திரை’ புரிந்துகொள்ளக்கூடியதாயினும், ‘திரைச்சீலை’ நவீனத் தமிழில் இயல்பானது. ‘திறமையான கலைஞரின் வேலைப்பாடாக அது செய்யப்பட வேண்டும்’ என்பது சிறிது தெளிவற்றது; கேருபீன் வடிவங்கள் திரையிலேயே செய்யப்படுகின்றன என்பதை வெளிப்படுத்தும் வாக்கிய அமைப்பு இயல்பாகும்.
  terminology: ‘கேருபீன்கள்’ சரியான மரபான பெயர். நிறப் பெயர்கள் பொருத்தமானவை. ‘மெல்லிய முறுக்கப்பட்ட ஆளிநார் நூல்’ என்பது fine twisted linen என்பதற்குத் துல்லியமான, நவீனத் தமிழில் புரியக்கூடிய இணை. ‘கலைவேலைப்பாடு’ מַעֲשֵׂה חֹשֵׁב என்பதன் திறமையான கலைக் கைவினைப் பொருளை ஒரு குறிப்பிட்ட தொழில்நுட்பமாகக் குறுக்காமல் காக்கிறது.
