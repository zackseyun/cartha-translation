translation_notes:
  register: நவீன பொதுத்தமிழில், கட்டுமான விவரத்தைத் தெளிவாகவும் கண்ணியமாகவும் வழங்கும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனம் முந்தைய கட்டளையின் தொடர்ச்சியான சொற்றொடராக இருந்தாலும், தமிழில் தனி வசனமாக இயங்குவதற்காக ‘செய்ய வேண்டும்’ சேர்க்கப்பட்டுள்ளது; இது சூழலிலிருந்து எடுத்துக்கொள்ளப்பட்ட வினை.
