  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
translation:
  language: ta
  text: திருக்கூடாரத்தின் இரண்டாவது பக்கத்திலுள்ள[a] பலகைகளுக்கு ஐந்து குறுக்குச் சட்டங்களும், திருக்கூடாரத்தின் மேற்குப் பின்புறப் பக்கத்திலுள்ள[b] பலகைகளுக்கு ஐந்து குறுக்குச் சட்டங்களும் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருக்கூடாரத்தின் மற்றொரு பக்கத்திலுள்ள.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “பின்புறத்தில், மேற்குநோக்கி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: குறுக்குச் சட்டங்கள்
  rationale: கூடாரத்தின் பலகைகளை ஒன்றாக இணைத்துப் பிடிக்கும் கிடைமட்டச் சட்டங்களை இச்சொல் குறிக்கிறது. ‘சட்டங்கள்’ என்பதைக் காட்டிலும் ‘குறுக்குச் சட்டங்கள்’ கட்டுமானப் பயன்பாட்டைத் தெளிவாக உணர்த்துகிறது.
- source_word: קַרְשֵׁי
  choice: பலகைகள்
  rationale: திருக்கூடாரத்தின் மரக் கட்டமைப்பு அலகுகளைச் சுட்டுகிறது. ‘பலகைகள்’ என்பது இயல்பானதும் பொருளை அளவுக்கு மீறி வரையறுக்காததுமான சொல்.
- source_word: צֶלַע
  choice: பக்கம்
  rationale: இக்கட்டிட விளக்கத்தில் திருக்கூடாரத்தின் ஒரு பக்கத்தைக் குறிக்கிறது; ‘பக்கம்’ என்பது நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: הַשֵּׁנִית
  choice: இரண்டாவது
  rationale: எபிரெயச் சொல் நேரடியாக ‘இரண்டாவது’ என்று பொருள்படும். சூழலில் அது முன்பு கூறப்பட்டதற்கு எதிரேயுள்ள மற்றொரு பக்கத்தைக் குறித்தாலும், மூலத்தின் வரிசைச் சொல்லை முதன்மை உரை பாதுகாக்கிறது.
- source_word: מִּשְׁכָּן
  choice: திருக்கூடாரம்
  rationale: தேவன் வாசம்பண்ணும் புனிதக் கூடாரத்தை இச்சொல் குறிக்கிறது. நவீன வாசகருக்கு தெளிவாகவும் மரியாதைமிக்கதாகவும் இருக்க ‘திருக்கூடாரம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לַיַּרְכָתַיִם
  choice: பின்புறப் பக்கம்
  rationale: கட்டமைப்பின் கடைசி அல்லது பின்புறப் பகுதியைக் குறிக்கிறது. தமிழில் இடவமைப்பை இயல்பாகத் தெரிவிக்க ‘பின்புறப் பக்கம்’ பயன்படுத்தப்பட்டது.
- source_word: יָמָּה
  choice: மேற்கே
  rationale: இது ‘மேற்கு நோக்கி/மேற்கே’ என்னும் திசைப் பொருளுடைய வினையடை. இங்கு திருக்கூடாரத்தின் பின்புறம் அமைந்த திசையைச் சுட்டுகிறது.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: ஐந்து ... ஐந்து
  rationale: இரு பக்கங்களுக்கும் தலா ஐந்து சட்டங்கள் என்பதைக் காட்டும் மூலத்தின் பட்டியல் அமைப்பும் மீளுரையும் தமிழில் பாதுகாக்கப்பட்டுள்ளன.
