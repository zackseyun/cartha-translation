  source_fidelity: 'கருத்து பெரும்பாலும் துல்லியமாக உள்ளது: நாற்பது வெள்ளி அடிப்பீடங்கள், இருபது செங்குத்துக் கட்டமைப்புக் கூறுகள், ஒவ்வொன்றின் இரண்டு பொருத்து முனைகள் ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘இருபது சட்டங்களின் கீழ் வைப்பதற்காக’ என்பது எபிரெயத்தில் இல்லாத நோக்கவுரையைச் சேர்க்கிறது; மேலும் ஒவ்வொரு பிரிவிலும் ‘அதன் கீழ்’ என்பதன் முன்னிலைத் தொடர்பு தெளிவாக இல்லை.'
  naturalness: ‘சட்டம்’ தனித்து வரும்போது நவீனத் தமிழில் பொதுவாக விதி அல்லது சட்டம் என்ற பொருளையே முதலில் தரும். கட்டுமானச் சூழலை உடனே தெளிவுபடுத்த ‘செங்குத்துச் சட்டம்’ பயன்படுத்தப்பட வேண்டும். சொற்தொடர் வரிசையையும் எளிமைப்படுத்தி, அடிப்பீடங்கள் சட்டங்களுக்குக் கீழே இருப்பதையும் பொருத்து முனைகளுக்கானவை என்பதையும் தெளிவாகக் கூறலாம்.
