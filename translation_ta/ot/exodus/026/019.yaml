translation:
  language: ta
  text: 'இருபது செங்குத்துச் சட்டங்களுக்குக் கீழே நாற்பது வெள்ளி அடிப்பீடங்களைச் செய்ய வேண்டும்: ஒரு செங்குத்துச் சட்டத்தின் இரண்டு பொருத்து முனைகளுக்காக, அந்தச் சட்டத்திற்குக் கீழே இரண்டு அடிப்பீடங்கள்; அடுத்த செங்குத்துச் சட்டத்தின் இரண்டு பொருத்து முனைகளுக்காக, அந்தச் சட்டத்திற்குக் கீழே இரண்டு அடிப்பீடங்கள்.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் சொல்லுக்குச் சொல் “கைகள்” என்று பொருள்படும்; இங்கு அடிப்பீடங்களில் பொருந்தும் நீட்டிப்புகளைக் குறிக்கும் கட்டுமானச் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “செங்குத்துச் சட்டங்கள்” என்பதற்குப் பதிலாக மரபுவழியாக “பலகைகள்” என்றும் மொழிபெயர்க்கப்படுகிறது. எபிரெயச் சொல் திருக்கூடாரத்தின் செங்குத்தான கட்டமைப்புப் பகுதிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: வெள்ளியால் ஆன அடிப்பீடங்கள்
  rationale: கூடாரக் கட்டுமானச் சூழலில் אֶדֶן என்பது செங்குத்துச் சட்டத்தைத் தாங்கி அதன் முனையை ஏற்றுக்கொள்ளும் அடிப்பகுதியைக் குறிக்கிறது; ‘அடிப்பீடு’ அதன் தாங்கும் பணியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תַּעֲשֶׂה
  choice: செய்ய வேண்டும்
  rationale: Qal imperfect இரண்டாம் நபர் ஒருமை வடிவம் இங்கு கட்டளையிடும் வழிமுறையாக உள்ளது; ‘செய்ய வேண்டும்’ நவீனத் தமிழில் அந்த உத்தரவு வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: תַּחַת
  choice: கீழ்
  rationale: சட்டங்களின் அடியில் அடிப்பீடங்கள் அமையும் இடத்தை நேரடியாகக் குறிக்கிறது.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: சட்டம்
  rationale: קֶרֶשׁ கூடாரத்தின் செங்குத்தான கட்டமைப்புப் பகுதிகளைக் குறிக்கிறது. ‘பலகை’ என்பதைவிட ‘சட்டம்’ அதன் கட்டமைப்புப் பணியைத் தெளிவாக உணர்த்துகிறது.
- source_word: שְׁנֵי אֲדָנִים
  choice: இரண்டு அடிப்பீடங்கள்
  rationale: ஒவ்வொரு சட்டத்தையும் தாங்கும் இரண்டு கூறுகளைக் குறிக்கிறது; முதல் பயன்பாட்டுடன் சொல்லாட்சித் தொடர்ச்சி காக்கப்படுகிறது.
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: அதன் இரண்டு பொருத்து முனைகளுக்காக
  rationale: சொல்லுக்குச் சொல் ‘அதன் இரண்டு கைகள்’ என்றாலும், இங்கு יָדוֹת என்பது அடிப்பீடங்களுக்குள் பொருந்தும் நீட்டிப்புகளைக் குறிக்கும் கட்டுமானச் சொல். பொதுவாசகருக்குப் புரியுமாறு ‘பொருத்து முனைகள்’ என வழங்கப்படுகிறது.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: ஒரு சட்டம் ... அடுத்த சட்டம்
  rationale: எபிரெய மொழியின் பகிர்ந்தளிக்கும் மீளுரையை இயல்பான தமிழில் காட்டி, ஒவ்வொரு சட்டத்துக்கும் இரண்டு அடிப்பீடங்கள் என்பதைத் தெரிவிக்கிறது.
