revisions:
- from: 'இருபது சட்டங்களின் கீழ் வைப்பதற்காக வெள்ளியால் நாற்பது அடிப்பீடங்களைச் செய்ய வேண்டும்: ஒரு சட்டத்தின் இரண்டு பொருத்து முனைகளுக்காக[a] அதன் கீழ் இரண்டு அடிப்பீடங்களும், அடுத்த சட்டத்தின் இரண்டு பொருத்து முனைகளுக்காக அதன் கீழ் இரண்டு அடிப்பீடங்களும் இருக்க வேண்டும்.[b]'
