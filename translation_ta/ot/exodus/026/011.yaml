base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/011.yaml
  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: ta
  text: நீ வெண்கலப் பிடிப்புகள் ஐம்பதைச் செய்து[a], அந்தப் பிடிப்புகளை வளையங்களில் நுழைத்து, கூடாரத்தை இணை; அப்போது அது ஒன்றாகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செம்புப் பிடிப்புகள்’ என்றும் மொழிபெயர்க்கலாம். נְחֹשֶׁת என்ற எபிரெயச் சொல் சூழலுக்கேற்ப செம்பையோ வெண்கலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: வெண்கலக் கொக்கிகள்
  rationale: קֶרֶס என்பது திரைத் துணிகளை இணைக்கும் பற்றுப் பொருளைக் குறிக்கிறது; இச்சூழலில் இயல்பான தமிழாக ‘கொக்கிகள்’ பொருந்துகிறது. נְחֹשֶׁת செம்பையோ வெண்கலத்தையோ குறிக்கக்கூடும்; வாசஸ்தல உலோகப் பணியின் சூழலும் வழக்கமான மொழிபெயர்ப்பும் கருதி ‘வெண்கலம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חֲמִשִּׁים
  choice: ஐம்பது
  rationale: கொக்கிகளின் எண்ணிக்கையைக் குறிக்கும் நேரடியான எண்ணுப்பெயர்.
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: அந்தக் கொக்கிகளை வளையங்களில் நுழைத்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு கொக்கிகளை வளையங்களுக்குள் செலுத்துவதைக் குறிக்கிறது; ‘நுழைத்து’ என்பது செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: கூடாரத்தை ஒன்றாக இணைக்க வேண்டும்
  rationale: חבר என்பது இணைத்தல் அல்லது பிணைத்தலைக் குறிக்கிறது. הָאֹהֶל என்பது இங்கு தனித்தனி மூடுதுணிப் பகுதிகள் சேர்ந்து உருவாகும் கூடார அமைப்பு.
- source_word: וְהָיָה אֶחָד
  choice: அப்போது அது ஒரே கூடாரமாகும்
  rationale: இணைப்பதன் விளைவாக முழு அமைப்பும் ஒன்றாகும் என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘கூடாரம்’ என்பது எதைக் குறிக்கிறது என்பதைத் தெளிவுபடுத்தச் சேர்க்கப்பட்டுள்ளது.
