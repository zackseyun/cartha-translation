- from: நீ வெண்கலக் கொக்கிகள் ஐம்பதைச் செய்து[a], அந்தக் கொக்கிகளை வளையங்களில் நுழைத்து, கூடாரத்தை ஒன்றாக இணைக்க வேண்டும்; அப்போது அது ஒரே கூடாரமாகும்.
