translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. 'திருவுறைவிடம்' என்பது தொழில்நுட்பத் துல்லியத்தையும் தமிழ்ச் சொல் இயல்பையும் இணைக்கிறது; 'அதன் முறைப்படியே' மூலத்தில் உள்ள நிர்ணயிக்கப்பட்ட ஒழுங்கு/முறை என்ற பொருள் பரப்பைப் பாதுகாக்கிறது.
