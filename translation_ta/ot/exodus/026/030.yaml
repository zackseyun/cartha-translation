base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/030.yaml
  text: And you shall set up the tabernacle according to its ordinance[a], which you were shown on the mountain.
translation:
  language: ta
  text: மலையில் உனக்குக் காட்டப்பட்ட அதன் முறையின்படியே திருக்கூடாரத்தை அமைப்பாயாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “மலையில் நீ கண்ட.” முதன்மை உரையில், அது உனக்குக் காட்டப்பட்டது என்ற சூழல் பொருள் இயல்பாகத் தெரிவிக்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: அமைப்பாயாக
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் கட்டளையைக் குறிக்கிறது. ஒரு கட்டமைப்பை நிறுவி நிறுத்துவதை நவீனத் தமிழில் இயல்பாகச் சொல்கிறது.
- source_word: הַמִּשְׁכָּן
  choice: திருவுறைவிடம்
  rationale: מִשְׁכָּן என்பது 'உறைவிடம்' என்ற அடிப்படைப் பொருளுடன், யாத்திராகமத்தில் இறைவனுடைய புனிதக் கூடாரத்தைக் குறிக்கிறது. 'திருவுறைவிடம்' அந்தப் புனிதத் தன்மையையும் குறிப்பிட்ட இடத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: כְּמִשְׁפָּטוֹ
  choice: அதன் முறைப்படியே
  rationale: מִשְׁפָּט இங்கு ஒரு கட்டுமானத்திற்குரிய நிர்ணயிக்கப்பட்ட ஒழுங்கு அல்லது முறை என்பதைக் குறிக்கிறது. 'முறைப்படியே' என்பது 'வடிவமைப்பு' என்று பொருளை அளவுக்கு மீறிக் குறுக்காமல், மூலத்தின் பரந்த பொருள் நிழலைக் காக்கிறது.
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: உனக்குக் காண்பிக்கப்பட்ட
  rationale: எபிரெய வடிவம் சொற்படியாக 'நீ கண்ட' என்று செயப்பாட்டு அல்லாத முறையில் உள்ளது. ஆனால் சூழலில் மோசே அதைக் காணும்படி காட்டப்பட்டது என்பதே பொருள்; தமிழில் 'உனக்குக் காண்பிக்கப்பட்ட' என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בָּהָר
  choice: மலையில்
  rationale: ב என்ற இடவுருபு இங்கு மோசே மலையில் இருந்த இடத்தைக் குறிக்கிறது; தமிழில் 'மலையில்' இயல்பான இடவுருவாக்கம்.
