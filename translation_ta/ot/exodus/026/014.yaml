  text: וְ/עָשִׂ֤יתָ מִכְסֶה֙ לָ/אֹ֔הֶל עֹרֹ֥ת אֵילִ֖ם מְאָדָּמִ֑ים וּ/מִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִ/לְ/מָֽעְלָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/014.yaml
  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: ta
  text: கூடாரத்திற்காகச் சிவப்புச் சாயமிட்ட ஆட்டுக்கடாக்களின் தோல்களால் ஓர் உறையையும், மேலாகத் தகாஷ் தோல்களால்[a] ஓர் உறையையும் செய்வாயாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தகாஷ்’ என்பதற்கான எபிரெயச் சொல் எதைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை. அது ஒரு குறிப்பிட்ட விலங்கையோ நீடித்துப் பயன்படும் ஒரு தோல் வகையையோ குறிக்கலாம்; ‘நேர்த்தியான தோல்,’ ‘கடற்பன்றித் தோல்,’ ‘கடற்பசுத் தோல்’ ஆகிய மொழிபெயர்ப்புகளும் முன்மொழியப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்வாயாக
  rationale: அறிவுறுத்தல் தொடரில் வரும் இந்த வினை வடிவத்தின் கட்டளைப் பொருளை, மரியாதையும் கண்ணியமும் கொண்ட தமிழ் கட்டளை நடையில் வெளிப்படுத்துகிறது.
- source_word: מִכְסֶה
  choice: உறை
  rationale: கூடாரத்தைப் பாதுகாக்கும் மேலடுக்கு அல்லது மூடுறையைக் குறிக்கும் பெயர்ச்சொல்லுக்கு இயல்பான, சுருக்கமான தமிழ் இணைச்சொல்.
- source_word: לָאֹהֶל
  choice: கூடாரத்திற்காக
  rationale: אֹהֶל என்பதன் நேரடிப் பொருளான ‘கூடாரம்’ என்பதையும், ל முன்னொட்டின் நோக்கம்/பயன் சார்ந்த உறவையும் காக்கிறது.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: சிவப்புச் சாயமிட்ட ஆட்டுக்கடாக்களின் தோல்கள்
  rationale: இது ஆட்டுக்கடாக்களின் தோல்களையும் அவை சிவப்பாக்கப்பட்ட நிலையையும் குறிக்கிறது; ‘சாயமிட்ட’ என்பது பதப்படுத்தப்பட்ட தோல்களின் நிறமூட்டலைத் தெளிவாகச் சொல்கிறது.
- source_word: עֹרֹת תְּחָשִׁים
  choice: தகாஷ் தோல்கள்
  rationale: תְּחָשִׁים குறிக்கும் விலங்கு அல்லது தோல் வகை உறுதியாக அறியப்படாததால், ஊகமான அடையாளத்தைத் தேர்ந்தெடுக்காமல் எபிரெயச் சொல்லை ஒலிபெயர்த்துள்ளது.
- source_word: מִלְמָעְלָה
  choice: அதற்கு மேலாக
  rationale: இரண்டாவது உறை முதல் உறையின் மேலே அமைக்கப்படுவதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது; சூழலில் உள்ள அடுக்கமைப்பை மட்டும் வெளிப்படுத்துகிறது.
