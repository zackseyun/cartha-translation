base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: ta
  text: நீ ஐம்பது தங்கப் பற்றிகளைச் செய்து, அந்தப் பற்றிகளால் திரைத் துணிகளை ஒன்றோடொன்று இணைக்க வேண்டும்; அப்போது திருக்கூடாரம் ஒன்றாயிருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “திரைத் துணிகள், ஒவ்வொன்றும் தன் சகோதரியோடு”; திரைத் துணிகள் ஒன்றுக்கொன்று பொருந்துமாறு இணைக்கப்பட வேண்டும் என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: நீ ... செய்து
  rationale: அறிவுறுத்தல் தொடரில் கட்டளையைக் குறிக்கும் வினை வடிவம்; அடுத்த வினையுடன் இயல்பான தமிழ் கட்டளைத் தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: קַרְסֵי זָהָב
  choice: தங்கக் கொக்கிகள்
  rationale: கֶרֶס என்பது திரைச்சீலைகளை இணைக்கும் சிறிய உலோகப் பொருள். அதன் வடிவத்தை அளவுக்கு மீறித் துல்லியப்படுத்தாமல், இச்சூழலில் புரிந்துகொள்ளத்தக்க சொல்லாக ‘கொக்கிகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְחִבַּרְתָּ
  choice: இணைக்க வேண்டும்
  rationale: חבר என்பதன் அடிப்படைப் பொருள் இணைத்தல்; கட்டுமான அறிவுறுத்தலுக்கு இயல்பான நவீன தமிழ்.
- source_word: הַיְרִיעֹת
  choice: திரைச்சீலைகள்
  rationale: யாத்திராகமக் கூடாரச் சூழலில் יְרִיעָה துணியால் ஆன திரைப்பலகைகளைச் சுட்டுகிறது; பொதுவாசகருக்குத் தெளிவாக ‘திரைச்சீலைகள்’ பயன்படுத்தப்பட்டது.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: ஒன்றோடொன்று
  rationale: சொல்லுக்குச் சொல் ‘ஒரு பெண் தன் சகோதரியோடு’ என்ற எபிரெய மரபுத்தொடர், உயிரற்ற பொருட்கள் ஒன்றுக்கொன்று இணையாகச் சேர்வதை இங்கு குறிக்கிறது; தமிழில் இயல்பான பொருள் மொழிபெயர்ப்பு தரப்பட்டது.
- source_word: בַּקְּרָסִים
  choice: அந்தக் கொக்கிகளால்
  rationale: בְּ இங்கு கருவிப் பொருளைக் குறிக்கிறது; ‘-ஆல்’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: அப்போது திருவாசஸ்தலம் ஒரே அமைப்பாக இருக்கும்
  rationale: திரைச்சீலைகளை இணைப்பதால் ஏற்படும் விளைவைத் தெரிவிக்கிறது. אֶחָד என்பது முழுக் கூடாரமும் ஒன்றிணைந்த முழுமையாக அமைவதைக் குறிக்கிறது.
theological_decisions:
- issue: הַמִּשְׁכָּן என்பதன் மொழிபெயர்ப்பு
  choice: திருவாசஸ்தலம்
  alternative: உறைவிடம் / திருக்கூடாரம்
  rationale: מִשְׁכָּן என்பதன் மூலப் பொருள் ‘உறைவிடம்’ என்றாலும், யாத்திராகமத்தில் அது தேவனுக்காக அமைக்கப்படும் எடுத்துச் செல்லத்தக்க பரிசுத்த அமைப்புக்கான தொழில்நுட்பச் சொல். ‘திருவாசஸ்தலம்’ அந்தப் பரிசுத்த உறைவிடப் பொருளைத் தக்கவைக்கிறது; குறிப்பிட்ட சமயப்பிரிவின் விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: וְהָיָה ... אֶחָד என்பதன் தொடர்பு
  choice: 'விளைவு: ‘அப்போது ... ஒரே அமைப்பாக இருக்கும்’'
  alternative: 'தொடர் கட்டளை/எதிர்காலம்: ‘திருவாசஸ்தலம் ஒன்றாயிருக்கும்’'
  rationale: முந்தைய இணைப்புச் செயலின் விளைவாக முழு அமைப்பு ஒன்றாகும் என்பதே சூழலுக்கு ஏற்றது; அதேவேளை ‘இருக்கும்’ என்பது மூலத்தின் எதிர்காலத் தொனியையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கட்டுமான அறிவுறுத்தலுக்கேற்ற தெளிவான, மரியாதைமிக்க நடை. எபிரெய மரபுத்தொடர் தமிழில் பொருள்முறையாக வழங்கப்பட்டுள்ளது. இவ்வசனத்தில் கட்டாயமாக விளக்க வேண்டிய உரைமாற்று அல்லது உண்மையான பொருள் ஐயம் இல்லாததால் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
