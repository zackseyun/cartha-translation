    issue: Ambiguous referent in ‘அவற்றுக்காக வெண்கலத்தால் ஐந்து அடித்தளங்களை வார்ப்பாய்.’
    rationale: The closest antecedent is ‘கொக்கிகள்,’ whereas the Hebrew לָהֶם refers to the five pillars. Explicitly saying ‘அந்தத் தூண்களுக்காக’ preserves the source relation.
