translation_notes:
  register: நவீனத் தரத் தமிழில், திருக்கூடாரக் கட்டுமான அறிவுறுத்தலுக்கேற்ற கண்ணியமான நேரடி நடை பயன்படுத்தப்பட்டுள்ளது. ‘சீத்திம் மரம்’ என்ற வேதாகமத் தாவரப் பெயர் முதன்மை உரையில் வைக்கப்பட்டு, அதன் அகேசியா வகை அடையாளம் சொல் முடிவின் காரணவிளக்கத்தில் குறிப்பிடப்பட்டுள்ளது. எபிரெய மூலத்தின் இரண்டாம் நபர் ஒருமை கட்டளைநடை ‘செய்து… மூடுவாய் / இருக்க வேண்டும் / வார்ப்பாய்’ எனத் தக்கவைக்கப்பட்டுள்ளது.
