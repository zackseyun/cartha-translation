base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: ta
  text: அந்த நுழைவுத் திரைக்காக[a] சீத்திம் மரத்தால் ஐந்து தூண்களைச் செய்து, அவற்றைத் தங்கத்தால் மூடுவாய். அவற்றின் கொக்கிகள் தங்கத்தால் இருக்க வேண்டும். அந்தத் தூண்களுக்காக வெண்கலத்தால் ஐந்து அடித்தளங்களை[b] வார்ப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நுழைவை மறைக்கும் தொங்குதிரை’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல், மகா பரிசுத்த இடத்தின் உட்திரையிலிருந்து வேறுபட்ட திருக்கூடார நுழைவுத் திரையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஐந்து வெண்கலப் பொருத்துத் தளங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָּסָךְ
  choice: நுழைவுத் திரை
  rationale: இங்கு இது மகா பரிசுத்த இடத்தைப் பிரிக்கும் உட்திரையை அல்ல, திருக்கூடாரத்தின் நுழைவில் தொங்கவிடப்படும் திரையைக் குறிக்கிறது. ‘நுழைவுத் திரை’ அதன் இடத்தையும் பணியையும் இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: சீத்திம் மரத்தால் ... தூண்கள்
  rationale: עַמּוּדִים என்பது கட்டமைப்பைத் தாங்கும் தூண்களைக் குறிக்கிறது; שִׁטִּים என்பது திருக்கூடாரப் பொருட்களில் பயன்படுத்தப்படும் சீத்திம்/அகேசியா வகை மரம்.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: அவற்றைத் தங்கத்தால் மூடுவாய்
  rationale: צפה இங்கு பொருளின் மேற்பரப்பை உலோகத்தால் மூடுதல் அல்லது தகடு பதித்தல் என்ற பொருளில் வருகிறது. ‘மூடுவாய்’ சாதாரண வாசகருக்குத் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וָוֵיהֶם
  choice: அவற்றின் கொக்கிகள்
  rationale: திரைகளுடன் தொடர்புடைய וָוִים என்பதற்கு ‘கொக்கிகள்’ என்பது பொருத்தமான செயல்பாட்டு மொழிபெயர்ப்பு.
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: வெண்கலத்தால் ... அடித்தளங்கள்
  rationale: אַדָן என்பது தூணைத் தாங்கும் அடி அல்லது பொருத்துக் குழி கொண்ட தாங்குதளத்தைக் குறிக்கிறது. ‘அடித்தளங்கள்’ இயல்பான தமிழ்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: பண்டைய திருக்கூடார உலோகப் பொருட்களின் சூழலில் נְחֹשֶׁת என்பதற்கு ‘வெண்கலம்’ என்பது நவீன தமிழில் பொருத்தமான பொதுப் பெயர்.
- source_word: וְיָצַקְתָּ לָהֶם
  choice: அவற்றுக்காக ... வார்ப்பாய்
  rationale: יצק உலோகத்தை உருக்கி வார்ப்பதைக் குறிக்கிறது; לָהֶם என்ற சொல் அடித்தளங்கள் அந்தத் தூண்களுக்காக வார்க்கப்படுகின்றன என்பதைத் தெரிவிக்கிறது.
