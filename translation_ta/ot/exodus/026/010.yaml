  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: ta
  text: இணைக்கப்பட்ட தொகுப்பில்[a] கடைசியில் உள்ள ஒரு திரைச்சீலையின் ஓரத்தில் ஐம்பது வளையங்களை நீ செய்ய வேண்டும்; இரண்டாவது இணைக்கப்பட்ட தொகுப்பிலுள்ள திரைச்சீலையின் ஓரத்திலும் ஐம்பது வளையங்களை நீ செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை, ‘இணைப்பில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், பல திரைச்சீலைகளை ஒன்றோடொன்று இணைத்ததால் உருவான தொகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: நீ அமைக்க வேண்டும்
  rationale: அறிவுறுத்தல் சூழலில் உள்ள வினை வடிவத்தின் கட்டளைப் பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֻלָאֹת
  choice: வளையங்கள்
  rationale: திரைச்சீலைகளை இணைப்பதற்கான துணி வளையங்களைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: שְׂפַת
  choice: ஓரம்
  rationale: சொல்லின் நேரடிப் பொருள் ‘உதடு’ என்றாலும், துணியைப் பற்றிய இச்சூழலில் ‘ஓரம்’ என்பதே இயல்பான தமிழ்.
- source_word: הַיְרִיעָה
  choice: திரைச்சீலை
  rationale: திருக்கூடார அமைப்பில் பயன்படுத்தப்படும் பெரிய துணிப் பகுதியை சாதாரண வாசகருக்குத் தெளிவாகக் குறிக்கிறது.
- source_word: הַקִּיצֹנָה
  choice: கடைசியாக இருக்கும்
  rationale: இணைக்கப்பட்ட தொகுப்பின் முனை அல்லது கடைசி நிலையிலுள்ள திரைச்சீலையைக் குறிக்கும் இடப்பொருளை வெளிப்படுத்துகிறது.
- source_word: בַּחֹבָרֶת
  choice: ஒன்றாக இணைக்கப்பட்ட ஒரு தொகுப்பில்
  rationale: இணைக்கப்பட்ட திரைச்சீலைகளால் உருவான முழுத் தொகுதியைக் குறிக்கும் எபிரெயச் சொல்லின் கட்டுமானப் பொருளைத் தெளிவாக்குகிறது.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: இணைக்கப்பட்ட இரண்டாவது தொகுப்பிலுள்ள
  rationale: இச்சொற்றொடரை ‘இரண்டாவது இணைக்கப்பட்ட தொகுப்பு’ எனப் புரிந்துகொள்வது எபிரெய அமைப்புக்கும் யாத்திராகமம் 26-ன் இரண்டு திரைச்சீலைத் தொகுப்புகள் என்ற சூழலுக்கும் நெருக்கமானது.
