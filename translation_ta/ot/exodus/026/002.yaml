base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: ta
  text: திரைச்சீலை ஒவ்வொன்றின்[a] நீளம் இருபத்தெட்டு முழமும், அகலம் நான்கு முழமும் இருக்க வேண்டும்; எல்லாத் திரைச்சீலைகளும் ஒரே அளவுடையவையாக[b] இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘அந்த ஒரு திரைச்சீலையின் … அந்த ஒரு திரைச்சீலையின்’; ஒவ்வொரு திரைச்சீலையின் அளவையும் தனித்தனியாகக் குறிப்பிட எபிரெயம் பகிர்வுப் பாங்கைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘எல்லாத் திரைச்சீலைகளுக்கும் ஒரு அளவு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: நீளம்
  rationale: கூடாரத்தின் பரிமாணங்களைக் குறிக்கும் சூழலில் இயல்பான நவீனத் தமிழ் அளவுச்சொல்.
- source_word: הַיְרִיעָה
  choice: திரைச்சீலை
  rationale: יְרִיעָה என்பது இங்கு துணியால் செய்யப்பட்ட பெரிய மூடுதுணிப் பகுதியைக் குறிக்கிறது; ‘திரைச்சீலை’ கூடாரச் சூழலுக்கும் பொதுவாசகர்களுக்கும் தெளிவாக உள்ளது.
- source_word: הָאַחַת / הָאֶחָת
  choice: ஒவ்வொன்றின்
  rationale: சொல்லுக்குச் சொல் ‘அந்த ஒன்று’ என்றாலும், எபிரெயப் பகிர்வுப் பயன்பாடு ஒவ்வொரு திரைச்சீலைக்கும் இந்த அளவுகள் பொருந்துவதைச் சொல்கிறது.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: இருபத்தெட்டு
  rationale: எண்ணின் நேரடியான தமிழ் வடிவம்.
- source_word: בָּאַמָּה
  choice: முழம்
  rationale: אַמָּה என்ற பண்டைய நீள அலகுக்கு வழக்கமான தமிழ் வேதாகம மற்றும் பொதுப் பயன்பாட்டுச் சொல்.
- source_word: וְרֹחַב
  choice: அகலம்
  rationale: ‘நீளம்’ என்பதுடன் இயல்பாக இணையும் பரிமாணச் சொல்.
- source_word: אַרְבַּע
  choice: நான்கு
  rationale: எண்ணின் நேரடியான தமிழ் வடிவம்.
- source_word: מִדָּה אַחַת
  choice: ஒரே அளவு
  rationale: சொல்லுக்குச் சொல் ‘ஒரு அளவு’; இங்கு எல்லாத் திரைச்சீலைகளுக்கும் அளவு ஒன்றே என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: לְכָל הַיְרִיעֹת
  choice: எல்லாத் திரைச்சீலைகளும்
  rationale: ஒரே அளவு முழுத் தொகுப்பிற்கும் பொருந்துகிறது என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
