  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘செய்வாய்’ கட்டளைத் தொடரின் நேர்முக ஒருமை வடிவத்தைப் பேணுகிறது; ‘திருக்கூடாரம்’ தொழில்நுட்பச் சொல்லை பொதுவாசகருக்கு அணுகத்தக்கதாக வழங்குகிறது.
