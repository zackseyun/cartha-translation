  text: וְ/עָשִׂ֥יתָ אֶת הַ/קְּרָשִׁ֖ים לַ/מִּשְׁכָּ֑ן עֲצֵ֥י שִׁטִּ֖ים עֹמְדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/015.yaml
  text: And you shall make the frames for the tabernacle of acacia wood[b][a], standing upright.
translation:
  language: ta
  text: திருக்கூடாரத்திற்காகச் சீத்திம் மரத்தினாலான நிமிர்ந்து நிற்கும் மரச்சட்டங்களைச் செய்வாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலகைகளை”; எபிரெயச் சொல் திருக்கூடாரத்தின் மரத்தாலான கட்டமைப்புக் கூறுகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்வாய்
  rationale: தொடர்ச்சியான வழிமுறைகளில் கட்டளையின் வலிமையுடன் வரும் வாவ் இணைந்த கால் வினைமுற்றை, தமிழில் dignified future-command வடிவில் இயல்பாக வழங்குகிறது.
- source_word: הַקְּרָשִׁים
  choice: சட்டங்களை
  rationale: கூடாரத்தின் நிமிர்ந்த கட்டமைப்புக் கூறுகளைக் குறிக்கிறது. ‘பலகைகள்’ என்பதைக் காட்டிலும் அவற்றின் கட்டுமானப் பணியை ‘சட்டங்கள்’ தெளிவாகக் காட்டுகிறது; lexical alternative அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לַמִּשְׁכָּן
  choice: திருக்கூடாரத்திற்கான
  rationale: யாத்திராகமத்தில் இச்சொல் இறைவழிபாட்டுக்குரிய எடுத்துச் செல்லக்கூடிய பரிசுத்தக் கூடார அமைப்புக்கான தொழில்நுட்பச் சொல். ‘திருக்கூடாரம்’ நவீன வாசகருக்குப் புரியக்கூடியதும் சூழலுக்குத் துல்லியமானதும் ஆகும்.
- source_word: עֲצֵי שִׁטִּים
  choice: சீத்திம் மரத்தால்
  rationale: சீத்திம் வகை மரத்திலிருந்து பெறப்பட்ட மரப்பொருளைக் குறிக்கும் construct chain. தமிழில் அறியப்பட்ட வேதாகமத் தாவரப்பெயரை வைத்திருப்பது, குறிப்பிட்ட தாவர இனத்தை அளவுக்கு மீறி உறுதிப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: עֹמְדִים
  choice: அவை நிமிர்ந்து நிற்பவையாக இருக்கும்படி
  rationale: ஆண்பால் பன்மை participle, கட்டமைப்புக் கூறுகளின் செங்குத்தான நிலையை விவரிக்கிறது. தமிழில் இதனைத் தனி கூறாக வழங்குவது ‘standing’ என்ற தொடர்நிலை நுணுக்கத்தையும் கட்டுமானப் பொருளையும் தெளிவாகக் காக்கிறது.
