  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: ta
  text: அப்போது பார்வோனின் மகள் அவளிடம், “இந்தக் குழந்தையை எடுத்துச் சென்று, எனக்காகப் பாலூட்டு[a]; நான் உனக்குக் கூலி கொடுப்பேன்” என்றாள். அந்தப் பெண் குழந்தையை எடுத்து பாலூட்டினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “எனக்காகத் தாய்ப்பால் கொடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: பார்வோனின் மகள்
  rationale: எபிரேய இணைப்புத் தொடரை இயல்பான நவீனத் தமிழில் உறவைக் குறிப்பிடும் உடைமை வடிவில் வழங்குகிறது.
- source_word: הֵילִיכִי
  choice: எடுத்துச் சென்று
  rationale: הלך என்பதன் ஹிஃபில் கட்டளை வடிவம் இச்சூழலில் குழந்தையைத் தன்னுடன் எடுத்துச் செல்லுமாறு கூறுகிறது; வெறும் ‘எடு’ என்பதைவிட இயக்கப் பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: הַיֶּלֶד הַזֶּה
  choice: இந்தக் குழந்தையை
  rationale: יֶלֶד என்பது குழந்தை அல்லது சிறுவன் எனப் பொருள்படலாம்; வயதை மிகையாகக் குறிப்பாக்காமல் சூழலுக்கு ஏற்ற பொதுவான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: וְהֵינִקִהוּ לִי
  choice: எனக்காகப் பாலூட்டு
  rationale: ינק என்பதன் காரணவினை வடிவம் குழந்தைக்குத் தாய்ப்பால் கொடுப்பதைக் குறிக்கிறது; לִי அந்தச் செயல் பார்வோனின் மகளின் சார்பில் செய்யப்படுவதைத் தெரிவிக்கிறது.
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: நான் உனக்குக் கூலி கொடுப்பேன்
  rationale: שָׂכָר செய்த பணிக்கான கூலியைக் குறிக்கிறது; எபிரேய வாக்கிய அமைப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: மூலத்தில் ‘பெண்’ என்றே உள்ளது; சூழலில் அவர் குழந்தையின் தாய் என்பது தெரிந்தாலும், அதனை இவ்வசனத்துக்குள் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וַתְּנִיקֵהוּ
  choice: பாலூட்டினாள்
  rationale: முன்னுள்ள கட்டளையுடன் சொல் ஒருமைப்பாட்டைப் பேணி, குழந்தைக்குத் தாய்ப்பால் கொடுத்த செயலை இயல்பான தமிழில் வழங்குகிறது.
