base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: ta
  text: குழந்தை வளர்ந்ததும், அவள் அவனைப் பார்வோனின் மகளிடம் கொண்டுவந்தாள். அவன் அவளுடைய மகனானான்.[a] அவள் அவனுக்கு “மோசே” என்று பெயரிட்டாள்.[b] ஏனெனில், “நான் அவனைத் தண்ணீரிலிருந்து வெளியே எடுத்தேன்” என்று அவள் சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் அவளுக்கு ஒரு மகனைப்போல் ஆனான்.”
    reason: lexical_alternative
  - marker: b
    text: “மோசே” என்ற பெயர், “வெளியே எடுத்தேன்” என்பதற்கான எபிரெயச் சொல்லுடன் ஒலியில் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: வளர்ந்ததும்
  rationale: גדל இங்கு குழந்தை வயதில் வளர்ந்ததைக் குறிக்கிறது; நிலை அல்லது பெருமையில் உயர்ந்ததைக் குறிக்கவில்லை. ‘வளர்ந்ததும்’ கதைத் தொடரை இயல்பாகக் காட்டுகிறது.
- source_word: הַיֶּלֶד
  choice: குழந்தை
  rationale: יֶלֶד என்பதற்கு ‘குழந்தை’ அல்லது ‘சிறுவன்’ என்று பொருள் கொள்ளலாம். முந்தைய பச்சிளம் பருவச் சூழலோடு ‘குழந்தை’ நன்றாகப் பொருந்துகிறது.
- source_word: וַתְּבִאֵהוּ
  choice: அவள் அவனைக் ... கொண்டுவந்தாள்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘கொண்டுவருதல்’ எனப் பொருள்படும். முந்தைய வசனத்தின் அடிப்படையில் இதன் எழுவாய் மோசேயின் தாய்.
- source_word: לְבַת פַּרְעֹה
  choice: பார்வோனின் மகளிடம்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள உறவுமுறையைத் தெளிவாகவும் நவீனத் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיְהִי לָהּ לְבֵן
  choice: அவன் அவளுடைய மகனானான்
  rationale: இந்தச் சொற்றொடர் உண்மையான மகன் என்ற உறவுநிலையைத் தெரிவிக்கிறது; ஆனால் சட்டபூர்வத் தத்தெடுப்பு நடைமுறை எதையும் வெளிப்படையாகக் குறிப்பிடவில்லை.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: அவள் அவனுக்கு ... என்று பெயரிட்டாள்
  rationale: எபிரெயப் பெயரிடும் மரபுச் சொற்றொடரின் இயல்பான தமிழாக்கம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பெயருக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக உள்ளது.
- source_word: מִן הַמַּיִם
  choice: தண்ணீரிலிருந்து
  rationale: מַיִם வடிவில் பன்மையாக இருந்தாலும், இச்சூழலில் தமிழில் ‘தண்ணீர்’ என்ற திரள்பொருள் ஒருமை இயல்பானது.
- source_word: מְשִׁיתִהוּ
  choice: நான் அவனை ... வெளியே எடுத்தேன்
  rationale: משׁה என்பது வெளியே எடுத்தல் அல்லது இழுத்தெடுத்தலைக் குறிக்கிறது. ‘வெளியே எடுத்தேன்’ மீட்புச் சூழலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; பெயருடனான எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: וַיְהִי לָהּ לְבֵן என்பதில் மோசேக்கும் பார்வோனின் மகளுக்கும் இடையிலான உறவின் தன்மை
  choice: அவன் அவளுடைய மகனானான்
  alternative: அவன் அவளுக்கு ஒரு மகனைப்போல் ஆனான்
  rationale: எபிரெயச் சொற்றொடர் மகன் என்ற வலுவான உறவுநிலையைக் காட்டுகிறது. அதேவேளையில், சட்டபூர்வத் தத்தெடுப்பு நடைமுறையை உரை விவரிக்காததால் அதை மொழிபெயர்ப்பில் சேர்க்கவில்லை; சற்றுத் தளர்வான வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified narrative நடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்வோன்’, ‘மோசே’ ஆகியவை பரவலாக அறியப்பட்ட தமிழ் வேதாகமப் பெயர் வடிவங்கள். மூலத்தின் தொடர் ‘அவள்’ சுட்டுப்பெயர்கள் அப்படியே வைக்கப்பட்டுள்ளன; முந்தைய சூழல் முதல் ‘அவள்’ மோசேயின் தாயையும் பின்னைய ‘அவள்’ பார்வோனின் மகளையும் அடையாளப்படுத்த உதவுகிறது.
