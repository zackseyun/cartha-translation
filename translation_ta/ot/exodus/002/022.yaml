base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: ta
  text: அவள் ஒரு மகனைப் பெற்றெடுத்தாள்; அவனுக்கு கேர்சோம்[a] என்று பெயரிட்டான். ஏனெனில், “நான் வேற்று நாட்டில் அந்நியனாக வாழ்ந்திருக்கிறேன்[b]” என்று அவன் சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கேர்சோம்” என்ற பெயர், மோசே கூறும் காரண விளக்கத்தைப் பிரதிபலிக்கும் வகையில், எபிரேயத்தில் “அங்கே அந்நியன்” என்பதற்குப் பின்னுள்ள சொற்றொடரைப் போல ஒலிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நான் வேற்று நாட்டில் அந்நியனாக வாழ்ந்தேன்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: அவள் ஒரு மகனைப் பெற்றெடுத்தாள்
  rationale: ילד என்பதன் பிறப்பித்தல் என்ற பொருளையும், בֵּן என்பதன் ‘மகன்’ என்ற பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: அவன் அவனுக்குக் … என்று பெயரிட்டான்
  rationale: ‘அவன் பெயரை அழைத்தான்’ என்ற எபிரேய மரபுத்தொடரை, பெயரிடும் செயலைத் தெளிவாகக் காட்டும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: גֵּרְשֹׁם
  choice: கேர்சோம்
  rationale: எபிரேயப் பெயரின் ஒலிக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு; பெயருக்கான விளக்கத்துடனான ஒலிச்சொல் தொடர்பு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: כִּי אָמַר
  choice: ஏனெனில், … என்று அவன் சொன்னான்
  rationale: כִּי இங்கு பெயரிட்டதற்கான காரண விளக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: גֵּר
  choice: அந்நியனாக
  rationale: தனக்குச் சொந்தமல்லாத மக்களிடையே வசிக்கும் குடியிருப்பு அந்நியன் என்ற சொல்லின் மையப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: הָיִיתִי
  choice: வாழ்ந்திருக்கிறேன்
  rationale: எபிரேய நிறைவுவினையின் கடந்தகால நிலையையும் பெயரிடும் தருணம்வரை அதன் தொடர்ச்சியையும் தமிழில் வெளிப்படுத்துகிறது; எளிய இறந்தகாலமும் சாத்தியம்.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: வேற்று நாட்டில்
  rationale: נָכְרִיָּה என்பதன் ‘வேற்றான/அந்நியமான’ பொருளை நவீனத் தமிழில் தெளிவாக வழங்கி, גֵּר உடனான கருத்துத் தொடர்பையும் காக்கிறது.
