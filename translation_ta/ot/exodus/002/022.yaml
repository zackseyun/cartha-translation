translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அந்நியன்’ என்பது גֵּר என்பதன் சமூக நிலையைத் தருகிறது; ‘வேற்று நாடு’ என்பதுடன் தேவையற்ற ஒரேசொல் மீளுரையைத் தவிர்த்தபோதும் மூலத்தின் கருத்துத் தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
