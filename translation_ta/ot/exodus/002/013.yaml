- source_word: וַיֵּצֵא
  choice: அவன் வெளியே சென்றான்
  rationale: יצא என்பதன் இயல்பான இறந்தகாலக் கதைநடை மொழிபெயர்ப்பு; முந்தைய சூழலிலிருந்து எழுவாய் மோசே என்பது தெளிவாகிறது.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: மறுநாள்
  rationale: சொல்லர்த்தமாக ‘இரண்டாம் நாளில்’; தொடரும் கதைநடையில் அதன் இயல்பான காலப்பொருள் ‘மறுநாள்’.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה திடீரெனக் கண்ணில் படுவதையும் வாசகரின் கவனத்தை ஈர்ப்பதையும் குறிக்கிறது; ‘இதோ’ அந்த உரையாடல் வலிமையைத் தக்கவைக்கிறது.
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: எபிரெய ஆண்கள் இருவர்
  rationale: மூலத்தில் எண்ணிக்கையும் ஆண்பாலைக் குறிக்கும் אֲנָשִׁים என்ற பெயர்ச்சொல்லும் வெளிப்படையாக இருப்பதால் இரண்டையும் மொழிபெயர்க்கிறது.
- source_word: נִצִּים
  choice: சண்டையிட்டுக்கொண்டிருந்தார்கள்
  rationale: இருவருக்கிடையே நடந்துகொண்டிருந்த மோதலைக் குறிக்கிறது; அடுத்த வாக்கியத்தில் ஒருவர் மற்றவரை அடிப்பது இதை உறுதிப்படுத்துகிறது.
- source_word: לָרָשָׁע
  choice: அநியாயம் செய்தவனிடம்
  rationale: רָשָׁע என்பதற்கு ‘தீயவன்’ என்றும் ‘தவறிழைத்தவன்/அநியாயம் செய்தவன்’ என்றும் பொருள் உண்டு. இங்கு குறிப்பிட்ட சண்டையில் தாக்குபவனைச் சுட்டுவதால், அவனுடைய முழுக் குணத்தைத் தீர்மானிக்காமல் சூழ்நிலைசார் குற்றத்தை வெளிப்படுத்துகிறது.
- source_word: לָמָּה תַכֶּה
  choice: நீ ஏன் … அடிக்கிறாய்?
  rationale: கேள்வி எழுப்பப்படும் வேளையில் செயல் நடந்துகொண்டிருப்பதைக் காட்டும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: רֵעֶךָ
  choice: உன் சக மனிதனை
  rationale: רֵעַ என்பது சூழலுக்கேற்ப உடனிருப்பவன், சக மனிதன், அயலான் அல்லது தோழன் எனப் பொருள்படும். ‘சக மனிதன்’ இங்கு தேவையற்ற நட்புறவையோ பிற்காலச் சட்ட மொழியையோ சேர்க்காமல் பரந்த உறவுப்பொருளைத் தருகிறது.
