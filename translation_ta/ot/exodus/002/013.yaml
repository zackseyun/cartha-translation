  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: ta
  text: மறுநாள் அவன் வெளியே சென்றான். இதோ, எபிரெய ஆண்கள் இருவர் சண்டையிட்டுக்கொண்டிருந்தார்கள். அப்போது, தவறு செய்பவனிடம்[a], “நீ ஏன் உன் தோழனை[b] அடிக்கிறாய்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தீயவனிடம்” அல்லது “அநியாயம் செய்தவனிடம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “உன் சக மனிதனை” அல்லது “உன் அயலானை.”
    reason: lexical_alternative
