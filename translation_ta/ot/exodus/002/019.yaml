  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: ta
  text: அவர்கள், “எகிப்தைச் சேர்ந்த ஒரு மனிதர் மேய்ப்பர்களின் கையிலிருந்து[a] எங்களைக் காப்பாற்றினார். அதுமட்டுமல்ல, அவர் எங்களுக்காகத் தண்ணீர் இறைத்தார்[b]; மந்தைக்குத் தண்ணீரும் கொடுத்தார்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மேய்ப்பர்களின் அதிகாரத்திலிருந்து’; எபிரெயத்தில் சொல்லுக்குச் சொல், ‘மேய்ப்பர்களின் கையிலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் வினை திரும்பக் கூறப்பட்டு வலியுறுத்தப்படுகிறது; சொல்லுக்குச் சொல், ‘அவர் எங்களுக்காக இறைத்தே இறைத்தார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: அவர்கள் … என்றார்கள்
  rationale: אמר என்பதன் மூன்றாம் நபர் பெண்பால் பன்மை வடிவம் மகள்களின் பதிலை அறிமுகப்படுத்துகிறது. தமிழில் மேற்கோளைத் தொடர்ந்து ‘என்றார்கள்’ என அமைப்பது இயல்பான நடை.
- source_word: אִישׁ מִצְרִי
  choice: எகிப்திய மனிதர் ஒருவர்
  rationale: אִישׁ என்ற ‘மனிதர்’ என்பதையும் מִצְרִי என்ற ‘எகிப்திய’ அடையாளத்தையும் வெளிப்படையாகத் தக்கவைத்து, தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: הִצִּילָנוּ
  choice: எங்களைக் காப்பாற்றினார்
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்தோ ஒருவரின் கட்டுப்பாட்டிலிருந்தோ விடுவித்துக் காப்பாற்றுவதைக் குறிக்கிறது; இச்சூழலில் ‘காப்பாற்றினார்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: ‘கையிலிருந்து’ என்பது எபிரெய மொழியின் உருவகத்தைத் தக்கவைக்கிறது; இங்கு அது மேய்ப்பர்களின் அதிகாரம் அல்லது பிடியிலிருந்து விடுவித்ததைக் குறிக்கிறது.
- source_word: הָרֹעִים
  choice: மேய்ப்பர்கள்
  rationale: רעה என்பதிலிருந்து வந்த இச்சொல் மந்தைகளை மேய்ப்பவர்களைக் குறிக்கிறது; ‘மேய்ப்பர்கள்’ நேரடியான நவீனத் தமிழ் இணை.
- source_word: וְגַם
  choice: அதுமட்டுமல்ல … -உம்
  rationale: மீட்புச் செயலுக்கு அப்பால் அவர் எதிர்பார்த்ததைவிட மேலும் செய்தார் என்ற வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דָּלֹה דָלָה
  choice: தண்ணீரும் இறைத்துக் கொடுத்து
  rationale: வினையெச்சத்தின் முழுவடிவமும் வினைமுற்றும் இணைந்து செயலை வலியுறுத்துகின்றன. ‘அதுமட்டுமல்ல’ மற்றும் ‘-உம்’ அந்த வலியுறுத்தலைத் தருகின்றன; ‘இறைத்துக் கொடுத்து’ அவர் அவர்களுக்காகக் கிணற்றிலிருந்து தண்ணீர் எடுத்ததைக் காட்டுகிறது.
- source_word: לָנוּ
  choice: எங்களுக்காக
  rationale: இச்செயல் அந்தப் பெண்களின் நன்மைக்காகச் செய்யப்பட்டது என்ற பயனாளிப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיַּשְׁקְ
  choice: தண்ணீர் காட்டினார்
  rationale: שקה என்பதன் ஹிஃபில் வடிவம் குடிக்கத் தண்ணீர் கொடுப்பதைக் குறிக்கிறது. கால்நடைகளைப் பற்றிய தமிழ்ப் பயன்பாட்டில் ‘தண்ணீர் காட்டினார்’ இயல்பான சொற்றொடர்.
- source_word: אֶת־הַצֹּאן
  choice: மந்தைக்கு
  rationale: צאן என்பது ஆடுகள், வெள்ளாடுகள் போன்ற சிறு கால்நடைகளின் கூட்டைக் குறிக்கும் கூட்டுப்பெயர்; உயிரின வகையைத் தேவையின்றிக் குறுக்காமல் ‘மந்தை’ அந்தப் பொருளைத் தக்கவைக்கிறது.
