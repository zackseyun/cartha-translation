  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: ta
  text: அவனுக்கு என்ன செய்யப்படும் என்று அறிந்துகொள்ள[b], அவனுடைய சகோதரி தூரத்தில்[a] நின்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தொலைவில்” அல்லது “தொலைவிலிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, “அவனுக்கு என்ன நடக்கும் என்பதைத் தெரிந்துகொள்ள.” எபிரெய உரையின் இன்னும் சொற்சார்ந்த வாசகம்: “அவனுக்கு என்ன செய்யப்படும் என்று அறிய.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: நின்றாள்
  rationale: יצב என்பதன் ஹித்பயேல் வடிவம் ஒரு இடத்தில் நிலைகொண்டு நிற்பதைக் குறிக்கிறது. “நின்றாள்” என்பது இதை இயல்பான நவீனத் தமிழில் அளவுக்கு மீறிய விளக்கமின்றி தெரிவிக்கிறது.
- source_word: אֲחֹתוֹ
  choice: அவனுடைய சகோதரி
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் பெயர்ச்சொல்லைத் துல்லியமாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: מֵרָחֹק
  choice: தூரத்தில்
  rationale: இது இடைவெளியைக் குறிக்கிறது. “தூரத்தில்” என்பது இயல்பான நவீனத் தமிழ்; “தொலைவிலிருந்து” என்பதும் சாத்தியம்.
- source_word: לְדֵעָה
  choice: அறிந்துகொள்ள
  rationale: ידע என்பதன் நோக்கத்தைக் காட்டும் வினையெச்ச வடிவம். சூழலில் தொடர்ந்து என்ன நிகழும் என்பதைத் தெரிந்துகொள்வது என்ற பொருள் இருப்பதால், “அறிந்துகொள்ள” என்பது மூலத்தின் ‘அறிதல்’ கருத்தையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: מַה
  choice: என்ன
  rationale: அவள் அறிய விரும்பியதன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் வழக்கமான வினாப்பெயர்.
- source_word: יֵּעָשֶׂה
  choice: செய்யப்படும்
  rationale: עשה என்பதன் நிஃபால் முற்றுப்பெறா வடிவத்திலுள்ள செயப்பாட்டு அமைப்பை “செய்யப்படும்” காக்கிறது; “நடக்கும்” என்பது இயல்பான மாற்றாக இருந்தாலும் செயப்பாட்டை மறைத்துவிடும்.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: ל முன்னிடைச்சொல் இங்கு அவனுக்கு அல்லது அவனைப் பொறுத்தவரை செய்யப்படுவதைச் சுட்டலாம். “அவனுக்கு” என்பது மூலத்தின் அமைப்பையும் ‘அவனுக்கு/அவன்மீது’ என்ற ஓரளவு திறந்த பொருளையும் காக்கிறது.
