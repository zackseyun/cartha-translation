  to: அந்நாட்களில், மோசே வளர்ந்தபின் தன் சகோதரர்களிடம்[a] சென்று அவர்களுடைய சுமைகளைப் பார்த்தான். அப்போது, ஒரு எகிப்திய மனிதன் தன் சகோதரர்களில் ஒருவனான ஒரு எபிரெய மனிதனை அடித்துக்கொண்டிருப்பதை அவன் பார்த்தான்.
