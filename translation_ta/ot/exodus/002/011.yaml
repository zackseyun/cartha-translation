  source_fidelity: மூல எபிரெயத்தின் கதைமாற்றுச் சூத்திரம், மோசே முதிர்ந்த நிலை, எபிரெயர்களுடனான அவரது உறவுமுறை அடையாளம், அவர்களது சுமைகள், மற்றும் ஒரு எகிப்தியன் எபிரெயனைத் தாக்கிக்கொண்டிருந்த நிகழ்வு ஆகியவை வரைவில் அடிப்படையில் துல்லியமாக உள்ளன. ஆனால் தொடக்கச் சொற்றொடர் தமிழில் தேவையற்ற முறையில் விளக்கத்தன்மையுடன் உள்ளது; மேலும் ‘ஓர் எபிரெய மனிதன்’ என்பதில் பெயர்ச்சொல் முன்வரும் வடிவம் இயல்பான நவீனத் தமிழ் பயன்பாட்டுக்கு ஏற்றதல்ல.
  naturalness: ‘அந்த நாட்களில் இவ்வாறு நிகழ்ந்தது:’ என்பது எபிரெயக் கதைச்சூத்திரத்தைச் சொல்லுக்குச்சொல் பிரதிபலிக்க முயன்றாலும் நவீனத் தமிழில் சற்றுச் செயற்கையாக ஒலிக்கிறது. ‘அந்நாட்களில், மோசே வளர்ந்தபின்’ என்பது அதே கால/கதைமாற்றுத் தொடர்பை இயல்பாகத் தருகிறது. இரண்டாம் வாக்கியத்தில் ‘ஒரு எபிரெய மனிதன்’ எனத் திருத்துவது ஒலியியல் மற்றும் நடைமுறைத் தமிழுக்கு ஏற்றது.
