base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: ta
  text: அந்நாட்களில், மோசே வளர்ந்தபின் தன் சகோதரர்களிடம்[a] சென்று அவர்களுடைய சுமைகளைப் பார்த்தான். அப்போது, ஒரு எகிப்திய மனிதன் தன் சகோதரர்களில் ஒருவனான ஒரு எபிரெய மனிதனை அடித்துக்கொண்டிருப்பதை அவன் பார்த்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சகோதரர்கள்” என்பதற்கு “உறவினர்கள்” அல்லது “தன் மக்கள்” என்றும் பொருள் கொள்ளலாம். எபிரெய மூலத்தில், எபிரெய மக்களோடு மோசே கொண்ட ஒருமைப்பாட்டை வெளிப்படுத்த குடும்ப உறவுச் சொல் பயன்படுத்தப்படுகிறது; வசனத்தின் பிற்பகுதியிலுள்ள “தன் சகோதரர்களில் ஒருவன்” என்பதற்கும் இது பொருந்தும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: அந்த நாட்களில் இவ்வாறு நிகழ்ந்தது
  rationale: எபிரெயக் கதைநடையின் மாற்றுச் சூத்திரத்தை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது; மூலத்தில் இல்லாத தனியான ‘இப்போது’ என்ற காலக் குறிப்பைச் சேர்ப்பதில்லை.
- source_word: וַיִּגְדַּל
  choice: வளர்ந்த பிறகு
  rationale: இச்சூழலில் மோசே பெருமை அல்லது அதிகாரம் பெற்றதைக் காட்டாமல், வயது வந்து முதிர்ந்ததைக் குறிக்கிறது.
- source_word: אֶל־אֶחָיו / מֵאֶחָיו
  choice: தன் சகோதரர்களிடம் / தன் சகோதரர்களில் ஒருவனான
  rationale: மூலத்தின் குடும்ப உறவுச் சொல்லையும், எபிரெயர்களோடு மோசே கொண்ட ஒருமைப்பாட்டையும் தக்கவைக்கிறது; இது உடன்பிறந்த சகோதரர்களை மட்டும் குறிக்க வேண்டியதில்லை என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: בְּסִבְלֹתָם
  choice: அவர்களுடைய சுமைகளை
  rationale: ஒடுக்குமுறையான கட்டாய உழைப்பைச் சூழல் உணர்த்தினாலும், ‘சுமைகள்’ என்பது மூலத்தின் concrete பொருளையும் அனுபவச் செறிவையும் மிகையாகக் குறிப்பாக்காமல் காக்கிறது.
- source_word: אִישׁ מִצְרִי / אִישׁ עִבְרִי
  choice: ஓர் எகிப்திய மனிதன் / ஓர் எபிரெய மனிதன்
  rationale: இருமுறை வரும் אִישׁ என்ற சொல்லின் இணையான அமைப்பைத் தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: מַכֶּה
  choice: அடித்துக்கொண்டிருப்பதை
  rationale: நடந்துகொண்டிருந்த உடல் தாக்குதலைக் குறிக்கும் எபிரெயப் பங்கேற்பு வினையின் தொடர்நிலையை வெளிப்படுத்துகிறது; தாக்குதலின் தீவிரத்தை ‘கொடூரமாகத் தாக்குதல்’ போன்ற சொற்களால் மிகையாக வரையறுப்பதில்லை.
theological_decisions:
- issue: אֶחָיו / מֵאֶחָיו என்பவற்றின் உறவுமுறை மொழி
  choice: சகோதரர்கள்
  alternative: உறவினர்கள்; தன் மக்கள்
  rationale: மோசே எபிரெயர்களைத் தனது குடும்பத்தாராக அடையாளப்படுத்தும் மூலத்தின் ஆண்பால் பன்மை உறவுமுறை மொழியைப் பாதுகாக்கிறது. இது நேரடியான உடன்பிறப்பை மட்டும் குறிக்கிறது என்று தீர்மானிக்காமல், பரந்த இன/உறவு சார்பை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கதைநடைச் சூத்திரமும் இருமுறை வரும் ‘பார்த்தான்’ அமைப்பும் தக்கவைக்கப்பட்டுள்ளன. ‘சுமைகள்’ என்பது கட்டாய உழைப்பைச் சூழல் உணர்த்த அனுமதிக்கிறது; மொழிபெயர்ப்பு அதை விளக்கமாக மாற்றவில்லை.
