  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: ta
  text: அந்தப் பெண் கர்ப்பமடைந்து ஒரு மகனைப் பெற்றாள். அவன் நன்றாக இருந்ததைக் கண்டு, அவள் அவனை மூன்று மாதங்கள் மறைத்து வைத்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: கர்ப்பமடைந்து
  rationale: הרה என்பது கருவுறுதல் அல்லது கர்ப்பமடைதலைக் குறிக்கிறது. ‘கர்ப்பமடைந்து’ என்பது நிகழ்வின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: הָאִשָּׁה
  choice: அந்தப் பெண்
  rationale: எபிரெய மூலத்தில் இவ்வசனம் ‘அந்தப் பெண்’ என்றே கூறுகிறது; சூழலிலிருந்து ‘அவனுடைய மனைவி’ என்பதை இங்கு சேர்க்கவில்லை.
- source_word: וַתֵּלֶד בֵּן
  choice: ஒரு மகனைப் பெற்றாள்
  rationale: ילד + בן என்பது மகனைப் பெற்றெடுப்பதற்கான வழக்கமான சொற்றொடர். ‘ஒரு மகனைப் பெற்றாள்’ என்பது இயல்பான, சுருக்கமான தமிழ்.
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: அவன் நல்லவனாக இருப்பதை அவள் கண்டு
  rationale: பொருளைக் குறிக்கும் אֹתוֹ மற்றும் כִּי வாக்கியத்தைத் தமிழில் இயல்பாக ஒருங்கிணைக்கிறது; טוֹב என்பதன் அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: כִּי טוֹב הוּא
  choice: அவன் நல்லவனாக இருப்பதை
  rationale: טוֹב என்பதன் நேரடியான பொருள் ‘நல்லது/நல்லவன்’; இது ஆதியாகமம் 1-ன் மொழிநடையுடன் இருக்கக்கூடிய ஒலிப்பையும் காக்கிறது. ‘அழகானவன்’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַתִּצְפְּנֵהוּ
  choice: அவனை மறைத்துவைத்தாள்
  rationale: צפן என்பது மறைத்தல் அல்லது ஒளித்துவைத்தலைக் குறிக்கிறது. குழந்தையை ஒரு காலப்பகுதி முழுவதும் மறைத்து வைத்திருந்த செயலை ‘மறைத்துவைத்தாள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: மூன்று மாதங்கள்
  rationale: יֶרַח என்பது மாதத்தைக் குறிக்கிறது; தொழில்நுட்பமாக ‘சந்திர மாதங்கள்’ என்று கூறாமல் வழக்கமான தமிழில் பொருள் துல்லியமாகத் தரப்படுகிறது.
theological_decisions:
- issue: குழந்தையை טוֹב என்று வர்ணித்தல்
  choice: நல்லவனாக
  alternative: அழகானவனாக; நேர்த்தியானவனாக
  rationale: எபிரெயச் சொல்லின் அடிப்படைப் பொருள் ‘நல்லது.’ இதை முதன்மை உரையில் வைத்திருப்பது மூலத்தின் பரந்த பொருளையும் முந்தைய படைப்பு மொழியுடன் இருக்கக்கூடிய இலக்கிய ஒலிப்பையும் காக்கிறது. அழகைக் குறிக்கும் பாரம்பரியப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: இயல்பான நவீனத் தமிழுடன் கண்ணியமான வேதாகம உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள ‘அந்தப் பெண்’ என்பதும் טוֹב என்பதன் ‘நல்லவன்’ என்ற அடிப்படைப் பொருளும் தக்கவைக்கப்பட்டுள்ளன.
