base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/001.yaml
  text: A man from the house of Levi went and took a daughter of Levi as his wife[a].
translation:
  language: ta
  text: லேவியின் குடும்பத்தைச் சேர்ந்த ஒரு மனிதன் போய், லேவியின் வழிவந்த ஒரு பெண்ணை மனைவியாகக் கொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “லேவியின் மகள்”; அதாவது, லேவியின் வழிவந்த ஒரு பெண். இதை “ஒரு லேவியப் பெண்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: போய்
  rationale: הלך என்ற வினையின் இயல்பான பொருளான ‘போ’ என்பதையும், எபிரெயச் செயல்தொடரையும் சுருக்கமாகப் பாதுகாக்கிறது; மூலத்தில் இல்லாத காலக் குறிப்பைச் சேர்க்கவில்லை.
- source_word: אִישׁ
  choice: ஒரு மனிதன்
  rationale: பெயர் குறிப்பிடப்படாத ஓர் ஆணை அறிமுகப்படுத்துகிறது. ‘கணவன்’ என்பது திருமண உறவை முன்கூட்டியே சேர்த்துவிடும்.
- source_word: מִבֵּית לֵוִי
  choice: லேவியின் குடும்பத்தைச் சேர்ந்த
  rationale: ‘லேவியின் வீடு’ என்ற சொல்லுக்குச் சொல் வடிவம் தமிழில் இயல்பற்றதாகவும் கட்டிடத்தைக் குறிப்பதாகவும் ஒலிக்கலாம். இங்கு בַּיִת வம்சம் அல்லது குடும்பக் குழுவைக் குறிக்கிறது; ‘குடும்பத்தைச் சேர்ந்த’ என்பது அந்த மரபுவழிப் பொருளை இயல்பாகத் தருகிறது.
- source_word: וַיִּקַּח
  choice: மனைவியாகக் கொண்டான்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டான்’; இச்சூழலில் அது திருமணம் செய்துகொள்வதைக் குறிக்கும் மரபுத்தொடர். தமிழில் ‘மனைவியாகக் கொண்டான்’ என்பது அந்தக் கருத்தைத் தெளிவாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: אֶת
  choice: '[நேரடி செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: אֶת என்பது எபிரெயத்தில் குறிப்பிட்ட நேரடி செயப்படுபொருளைக் குறிக்கும் இலக்கணச் சொல்; தமிழில் இதற்குத் தனிச் சொல் தேவையில்லை.
- source_word: בַּת לֵוִי
  choice: லேவியின் வழிவந்த ஒரு பெண்
  rationale: சொல்லுக்குச் சொல் ‘லேவியின் மகள்’ என்றாலும், இங்கு בַּת என்பது லேவியின் பெண் வழித்தோன்றலைக் குறிக்கிறது. ‘வழிவந்த ஒரு பெண்’ என்பது தவறான நேரடி தந்தை–மகள் புரிதலைத் தவிர்த்து, வம்சப் பொருளைத் துல்லியமாகத் தருகிறது.
