  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. எபிரெயச் செயல்தொடரில் உள்ள ‘போய்’ என்பதைக் காக்கிறது; அதேவேளையில் ‘மகள்’ என்ற மரபுவழிச் சொல்லை வாசகர் நேரடி உயிரியல் உறவாகத் தவறாகப் புரிந்துகொள்ளாதபடி முதன்மை உரையில் பொருளைத் தெளிவாக்குகிறது.
