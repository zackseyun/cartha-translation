  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: ta
  text: கடவுள் அவர்களுடைய குமுறலைக் கேட்டார்[a]. ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருடனான தமது உடன்படிக்கையைக் கடவுள் நினைவுகூர்ந்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய துயரக் குரலை.’ எபிரெயப் பெயர்ச்சொல் ஒடுக்குதலின்கீழ் எழும் கூக்குரலையோ குமுறலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘நினைவுகூர்ந்தார்’ என்பது உடன்படிக்கை சார்ந்த மொழி. கடவுள் மறந்திருந்தார் என்று இது குறிப்பதில்லை; உடன்படிக்கையின் சூழலில், அதன் அடிப்படையில் உண்மையுடன் செயல்படுதலை இது சுட்டுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேட்டார்
  rationale: שׁמע என்பதன் இயல்பான பொருளான ‘கேட்டார்’ என்பதைத் தக்கவைக்கிறது; இங்கு நீடித்துக் கவனித்துக் கேட்பதைவிட இஸ்ரவேலரின் துயரக் குரல் கடவுளை எட்டியதே முதன்மை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு ஒருமை வினைச்சொற்களுடன் வந்து இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது.
- source_word: נַאֲקָתָם
  choice: அவர்களுடைய குமுறல்
  rationale: ஒடுக்குதலாலும் வேதனையாலும் எழும் ஆழ்ந்த முனகல் அல்லது துயரக் குரலை ‘குமுறல்’ இயல்பாக வெளிப்படுத்துகிறது; முறையான புலம்பலைக் குறிப்பதாக மிகையாக விளக்குவதில்லை.
- source_word: וַיִּזְכֹּר
  choice: நினைவுகூர்ந்தார்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளைத் தக்கவைக்கிறது. உடன்படிக்கைச் சூழலில் தொடரவிருக்கும் உண்மையுள்ள செயல்பாட்டை இது சுட்டினாலும், அதை முதன்மை உரையிலேயே விரித்துரைக்கவில்லை.
- source_word: בְּרִיתוֹ
  choice: தாம் செய்துகொண்ட உடன்படிக்கை
  rationale: בְּרִית என்பதற்கான நிலையான ‘உடன்படிக்கை’ என்ற சொல்லைத் தக்கவைக்கிறது. ‘தாம்’ என்பது கடவுளையே திரும்பக் குறிக்கும் மரியாதை ஒருமை; ‘செய்துகொண்ட’ என்பது முற்பிதாக்களுடன் உள்ள உடன்படிக்கை உறவைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: ஆபிரகாமுடனும் ஈசாக்குடனும் யாக்கோபுடனும்
  rationale: ஒவ்வொரு முற்பிதாவுடனும் ‘உடன்’ உருபை மீண்டும் வழங்குவது எபிரெயத்தில் வரும் மறுமொழியின் வலியுறுத்தலையும் ஓசைநயத்தையும் இயல்பான தமிழில் ஓரளவு காக்கிறது.
theological_decisions:
- issue: ‘கடவுள் நினைவுகூர்ந்தார்’ என்பதில் உள்ள மனித இயல்புச் சாயலான மொழி
  choice: முதன்மை உரையில் ‘நினைவுகூர்ந்தார்’ என்பதை விளக்க விரிவாக்கமின்றித் தக்கவைத்தல்
  alternative: கடவுள் தமது உடன்படிக்கையின்படி செயல்படத் திரும்பினார்
  rationale: மூல எபிரெயம் சாதாரண மனித இயல்புச் சாயலுள்ள உடன்படிக்கை மொழியைப் பயன்படுத்துகிறது. ‘செயல்பட்டார்’ என்று மொழிபெயர்ப்பது சொல்லின் உட்குறிப்பை விளக்கமாக மாற்றி, உரையிலுள்ள இறையியல் இழுவிசையைத் தீர்த்துவிடும். எனவே ‘நினைவுகூர்ந்தார்’ தக்கவைக்கப்பட்டு, அது மறந்திருந்ததைக் குறிக்காது என்பதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘குமுறல்,’ ‘உடன்படிக்கை,’ ‘நினைவுகூர்ந்தார்’ ஆகிய சொற்கள் மூலத்தின் துயரம், உடன்படிக்கைத் தன்மை, இறையியல் இழுவிசை ஆகியவற்றைக் காக்கின்றன. மரியாதை ஒருமை வினைமுற்றுகளும் ‘தாம்’ என்ற திருப்புப்பெயரும் கடவுளைக் குறிக்க இயல்பாகப் பயன்படுத்தப்பட்டுள்ளன.
