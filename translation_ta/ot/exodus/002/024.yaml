revisions:
- from: கடவுள் அவர்களுடைய குமுறலைக் கேட்டார்[a]. ஆபிரகாமுடனும் ஈசாக்குடனும் யாக்கோபுடனும் தாம் செய்துகொண்ட உடன்படிக்கையைக் கடவுள் நினைவுகூர்ந்தார்[b].
  to: கடவுள் அவர்களுடைய குமுறலைக் கேட்டார்[a]. ஆபிரகாம், ஈசாக்கு, யாக்கோபு ஆகியோருடனான தமது உடன்படிக்கையைக் கடவுள் நினைவுகூர்ந்தார்[b].
  rationale: ‘செய்துகொண்ட’ என்பதை நீக்கி, மூலத்தில் உள்ள உடன்படிக்கை மற்றும் முற்பிதாக்களுடனான அதன் உறவை ‘ஆகியோருடனான தமது உடன்படிக்கை’ என்று வழங்கியுள்ளேன். இது தேவையற்ற செயல்வினையைச் சேர்க்காமல், தமிழ் இலக்கணத்திலும் பொருளிலும் தெளிவாக உள்ளது. அடிக்குறிப்பு b, ‘நினைவுகூர்ந்தார்’ என்ற சொல் முதன்மை உரையிலேயே காக்கப்பட்ட நிலையில், அதன் உடன்படிக்கைச் சூழல் பொருளைத் தெளிவுபடுத்துகிறது.
