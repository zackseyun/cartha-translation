  source_fidelity: முதற் வாக்கியம் மூலத்திற்கு நெருக்கமாக உள்ளது. ஆனால் ‘தாம் செய்துகொண்ட உடன்படிக்கை’ என்பதில் ‘செய்துகொண்ட’ என்ற வினை மூல வசனத்தில் வெளிப்படையாக இல்லை; மேலும் அது உடன்படிக்கையை கடவுள் ஒருதலைப்பட்சமாகச் செய்ததாகத் தோன்றச் செய்யலாம். ‘...உடனான தமது உடன்படிக்கை’ என்பது மூலத்தின் உறவுக் குறிப்பைத் துல்லியமாகவும் இயல்பாகவும் வழங்குகிறது.
