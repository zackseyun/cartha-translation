base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: ta
  text: ஆனால், அவனை இனிமேலும் மறைத்து வைக்க முடியாதபோது, அவனுக்காகப் பபைரஸ் நாணலால் ஆன ஒரு பேழையை[a] எடுத்தாள்; அதன்மேல் பிட்டுமனையும் தாரையும் பூசினாள். பின்பு குழந்தையை அதில் வைத்து, நைல் நதியின் கரையோர நாணல்களுக்கிடையே அதை வைத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பபைரஸ் கூடை.’ இங்கே ‘பேழை’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல், ஆதியாகமத்தில் நோவாவின் பேழைக்கும் பயன்படுத்தப்பட்ட அதே சொல்; இது நீரின் வழியாகக் காப்பாற்றப்படுதல் பற்றிய இலக்கிய எதிரொலியை உருவாக்குகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: அவனை ... மறைத்துவைக்க
  rationale: צפן என்பதன் ஹிஃபில் வடிவம் ‘அவனை மறைத்தல்’ என்று பொருள்படும். ‘மறைத்துவைக்க’ என்பது தொடர்ச்சியாக மறைத்து வைத்திருந்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תֵּבַת
  choice: பேழை
  rationale: תֵּבָה என்பது பெட்டி அல்லது மிதக்கும் கலம் போன்ற கொள்கலனைக் குறிக்கும்; ஆதியாகமத்தில் நோவாவின் பேழைக்கும் இதே எபிரெயச் சொல் வருகிறது. ‘பேழை’ அந்த இலக்கியத் தொடர்பைக் காக்கிறது; உடனடியான சூழலில் அதன் சிறிய அளவும் பொருளும் தெளிவாகக் கூறப்படுகின்றன.
- source_word: גֹּמֶא
  choice: நாணற்புல்
  rationale: இந்தச் சொல் எகிப்தில் வளரும் பபைரஸ் தாவரத்தைக் குறிப்பாகக் குறிக்கிறது. சாதாரண வாசகர்களுக்கு இயல்பாகப் புரியும்படி ‘நாணற்புல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: அதற்குக் கீல் ... பூசினாள்
  rationale: חמר வேரின் வினை இங்கு பூசுதல் என்றும் חֵמָר நீர்ப்புகாத பிட்டுமன்/அஸ்பால்ட் பொருள் என்றும் பொருள்படும். ‘கீல் பூசுதல்’ தமிழில் அந்த நீர்ப்புகாத பூச்சை இயல்பாகச் சொல்கிறது.
- source_word: וּבַזָּפֶת
  choice: தாரும்
  rationale: זֶפֶת என்பது தார் அல்லது பிசின் வகை நீர்ப்புகாத பொருளைக் குறிக்கிறது. மற்றொரு பூச்சுப் பொருளுடன் தனியே குறிப்பிடப்பட்டிருப்பதை ‘-உம்’ காக்கிறது.
- source_word: הַיֶּלֶד
  choice: குழந்தை
  rationale: יֶלֶד என்பது குழந்தை அல்லது சிறுவன் எனப் பொருள்படும். இச்சூழலில் பச்சிளம் ஆண் குழந்தையைக் குறித்தாலும், மூலத்தின் பொதுவான சொல்லளவை ‘குழந்தை’ காக்கிறது.
- source_word: בַּסּוּף
  choice: கோரைப்புற்களுக்கிடையே
  rationale: סוּף என்பது ஆற்றோர நாணல் அல்லது கோரைத் தாவரங்களைக் குறிக்கிறது. בְּ முன்னொட்டின் இடப்பொருளை ‘இடையே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: நைல் நதிக்கரையில்
  rationale: יְאֹר யாத்திராகமத்தின் எகிப்தியச் சூழலில் நைல் நதியைக் குறிக்கிறது; שָׂפָה இங்கு கரை அல்லது ஓரம் என்பதாகும்.
- source_word: לֹא יָכְלָה עוֹד
  choice: இனிமேலும் ... முடியாதபோது
  rationale: இந்தச் சொற்றொடர் ஒரு எல்லைக்குப் பின் தொடர்ந்து செய்ய இயலாமையைத் தெரிவிக்கிறது. தமிழ் வாக்கிய அமைப்பில் ‘இனிமேலும் ... முடியாதபோது’ இயல்பாக உள்ளது.
- source_word: לּוֹ
  choice: அவனுக்காக
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமை நலப்பொருள் சுட்டுப்பெயரை வெளிப்படையாகத் தக்கவைத்து, பேழை குழந்தைக்காகத் தயாரிக்கப்பட்டது என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: תֵּבָה மூலம் நோவாவின் பேழையுடன் உருவாகும் இலக்கிய எதிரொலி
  choice: முதன்மை உரையில் ‘பேழை’ என்று மொழிபெயர்த்து, பொருள் விளக்கத்தை அடிக்குறிப்பில் தருதல்
  alternative: முதன்மை உரையில் ‘கூடை’ என்று மொழிபெயர்த்து, ‘பேழை’ என்பதை அடிக்குறிப்பில் தருதல்
  rationale: இதே அரிய எபிரெயச் சொல் நோவாவின் பேழைக்கும் பயன்படுத்தப்படுவதால், நீரின் வழியாகக் காக்கப்படுதல் என்ற மூல உரையின் இலக்கிய எதிரொலியைத் தமிழிலும் காப்பது பொருத்தமானது. அதேவேளை இது நாணற்புல்லால் செய்யப்பட்ட சிறிய குழந்தைக் கலம் என்பதை அடிக்குறிப்பு தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நிகழ்வுவரிசை காக்கப்பட்டுள்ளது. ‘பேழை’ இலக்கியத் தொடர்பைத் தக்கவைக்கிறது; அதன் உடனடி வடிவம் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
