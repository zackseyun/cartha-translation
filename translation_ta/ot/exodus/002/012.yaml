  edition: WLC
  text: וַ/יִּ֤פֶן כֹּה֙ וָ/כֹ֔ה וַ/יַּ֖רְא כִּ֣י אֵ֣ין אִ֑ישׁ וַ/יַּךְ֙ אֶת הַ/מִּצְרִ֔י וַֽ/יִּטְמְנֵ֖/הוּ בַּ/חֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: ta
  text: அவன் இப்பக்கமும் அப்பக்கமும் பார்த்து, அங்கே யாரும் இல்லை[a] என்று கண்டதும், அந்த எகிப்தியனை அடித்து வீழ்த்தி, அவனை மணலில் மறைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “ஒரு மனிதனும் இல்லை.” இங்கு இச்சொற்றொடர் எந்த நபரும் அங்கே இல்லாததைக் குறிக்கும் பொதுப்பொருளில் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: இப்பக்கமும் அப்பக்கமும் பார்த்து
  rationale: פנה என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்’ என்றாலும், כֹּה וָכֹה உடன் சேர்ந்த இச்சொற்றொடர் சுற்றிலும் இரு திசைகளிலும் கவனித்துப் பார்ப்பதைக் குறிக்கிறது. இத்தமிழாக்கம் இயல்பாக அந்தக் காட்சிச் செயலை வெளிப்படுத்துகிறது.
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: அங்கே யாரும் இல்லை என்று கண்டதும்
  rationale: אִישׁ என்பதற்கு நேரடியாக ‘மனிதன்/ஆண்’ என்று பொருள் கொள்ளலாம்; ஆனால் இங்கு அது ஒருவர்கூட இல்லாததைக் குறிக்கும் பொதுப்பயன்பாட்டில் உள்ளது. ‘யாரும் இல்லை’ என்பது இயல்பான நவீனத் தமிழ்; நேரடிச் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּךְ
  choice: அடித்து வீழ்த்தி
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி/தாக்கு.’ அடுத்ததாக அவனை மணலில் மறைப்பது மரணம் ஏற்பட்டதைச் சூழலில் உணர்த்துகிறது. ‘அடித்து வீழ்த்தி’ என்பது வினையின் அடிப்படைப் படிமத்தையும் அதன் கடுமையான விளைவையும் காக்கிறது; எபிரெயத்தில் நேரடியாக இல்லாத ‘கொன்றான்’ என்பதைச் சேர்ப்பதில்லை.
- source_word: הַמִּצְרִי
  choice: அந்த எகிப்தியனை
  rationale: குறிப்பிட்ட எகிப்திய மனிதனைச் சுட்டும் பெயர்ச்சொல்லாக இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּטְמְנֵהוּ
  choice: அவனை … மறைத்தான்
  rationale: טמן என்பது ‘மறை/ஒளித்து வை’ என்று பொருள்படும். மணலில் உடலை மூடிய செயல் சூழலால் புரிந்தாலும், ‘புதைத்தான்’ என்று மட்டும் மாற்றாமல் மூலச்சொல்லின் மறைத்தல் என்ற கருத்து காக்கப்படுகிறது.
- source_word: בַּחוֹל
  choice: மணலில்
  rationale: חוֹל என்பதன் நேரடிப் பொருள் ‘மணல்’; இடத்தைக் குறிக்கும் בְּ முன்னொட்டு தமிழில் ‘-இல்’ வேற்றுமையால் இயல்பாக வெளிப்படுத்தப்படுகிறது.
