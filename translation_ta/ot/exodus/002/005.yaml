source:
  edition: WLC
  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: ta
  text: பின்பு பார்வோனின் மகள் நைல் நதியில் குளிப்பதற்காக இறங்கிச் சென்றாள்; அவளுடைய இளம்பெண்கள் நைல் நதிக்கரையோரமாக நடந்துகொண்டிருந்தார்கள். நாணல்களின் நடுவே இருந்த கூடையை[a] அவள் கண்டு, தன் பணிப்பெண்ணை அனுப்பி, அதைக் எடுத்தாள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “கூடை” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல்தான் ஆதியாகமம் 6–9 அதிகாரங்களில் நோவாவின் “பேழை”க்கும் பயன்படுத்தப்பட்டுள்ளது.
    reason: cross_reference
  - marker: b
    text: எபிரெயத்தில், “அவளுடைய பெண் பணியாளரை”; பாரம்பரியமாகச் சிலர் இதை “அவளுடைய கை” என்றும் வாசிக்கின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: இறங்கிச் சென்றாள்
  rationale: ירד என்பதன் கீழ்நோக்கிய திசைப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: בַּת פַּרְעֹה
  choice: பார்வோனின் மகள்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவான, வழக்கமான தமிழில் வழங்குகிறது.
- source_word: לִרְחֹץ עַל הַיְאֹר
  choice: நைல் நதியில் குளிப்பதற்காக
  rationale: רחץ இச்சூழலில் ‘குளி’ எனப் பொருந்துகிறது; על இங்கு இடப்பொருளில் எடுத்துக்கொள்ளப்பட்டுள்ளது.
- source_word: וְנַעֲרֹתֶיהָ הֹלְכֹת
  choice: அவளுடைய இளம்பெண்கள் ... நடந்துகொண்டிருந்தார்கள்
  rationale: נערות என்பதின் வயது மற்றும் பாலினக் குறிப்பைக் காக்கிறது; பங்கேற்புவினையின் தொடர்நிலைப் பின்னணியை ‘நடந்துகொண்டிருந்தார்கள்’ வெளிப்படுத்துகிறது.
- source_word: עַל יַד הַיְאֹר
  choice: நைல் நதிக்கரையோரமாக
  rationale: ‘அருகே/ஓரமாக’ என்ற எபிரெய மரபுத்தொடரின் இடப்பொருளை இயல்பாகவும் துல்லியமாகவும் தருகிறது.
- source_word: הַתֵּבָה
  choice: பெட்டி
  rationale: תבה என்பது குழந்தையை வைத்திருந்த மூடிய கொள்கலனைக் குறிக்கிறது. தமிழில் ‘பெட்டி’ என்பது ‘கூடை’யைவிட பொருளின் வடிவத்தை முன்கூட்டியே நிர்ணயிக்காமல் விடுகிறது; நோவாவின் பேழையுடனான சொல்லியல் தொடர்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְּתוֹךְ הַסּוּף
  choice: நாணல்களின் நடுவே
  rationale: סוּף என்பதற்கு இச்சூழலில் ‘நாணல்கள்’ பொருத்தமானது; בְּתוֹךְ என்பதின் ‘நடுவில்/மத்தியில்’ என்ற பொருளையும் காக்கிறது.
- source_word: אֲמָתָהּ
  choice: தன் பணிப்பெண்ணை
  rationale: மசோரா உயிர்க்குறிப்புகளின்படி ‘அவளுடைய பெண் பணியாளர்’ என்ற வாசிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: וַתִּשְׁלַח ... וַתִּקָּחֶהָ
  choice: அனுப்பி அதை எடுத்துவரச் செய்தாள்
  rationale: சொற்படி ‘அனுப்பினாள்; எடுத்தாள்’ என்ற தொடரைத் தமிழில் இயல்பாகத் தெளிவாக்குகிறது. அனுப்பப்பட்ட பணிப்பெண் பெட்டியை எடுத்துவந்தாள் என்ற சூழல்பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மோசேயின் கொள்கலனுக்கான תבה என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: பெட்டி
  alternative: பேழை / கூடை
  rationale: உடனடிச் சூழலில் சிறிய கொள்கலன் குறிக்கப்படுகிறது; ‘பெட்டி’ வடிவத்தைத் தேவையின்றி நிர்ணயிக்காது. ஆதியாகமம் 6–9 இல் நோவாவின் பேழைக்குப் பயன்படுத்தப்பட்ட அதே எபிரெயச் சொல் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- issue: אֲמָתָהּ என்பதன் வாசிப்பு
  choice: தன் பணிப்பெண்ணை
  alternative: தன் கையை
  rationale: மசோரா உரையின் உயிர்க்குறிப்பும் שלח என்ற ‘அனுப்பு’ வினையுடனான தொடரமைப்பும் ‘பணிப்பெண்’ வாசிப்பை ஆதரிக்கின்றன; பாரம்பரிய மாற்றுவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்வோன்’, ‘நைல் நதி’, ‘நாணல்கள்’ போன்ற பரவலாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. மூலத்தில் உண்மையாக உள்ள אֲמָתָהּ மாற்றுவாசிப்பு அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
