revisions:
- from: பின்பு பார்வோனின் மகள் நைல் நதியில் குளிப்பதற்காக இறங்கிச் சென்றாள்; அவளுடைய இளம்பெண்கள் நைல் நதிக்கரையோரமாக நடந்துகொண்டிருந்தார்கள். நாணல்களின் நடுவே இருந்த பெட்டியை[a] அவள் கண்டு, தன் பணிப்பெண்ணை அனுப்பி அதை எடுத்துவரச் செய்தாள்.[b]
  to: பின்பு பார்வோனின் மகள் நைல் நதியில் குளிப்பதற்காக இறங்கிச் சென்றாள்; அவளுடைய இளம்பெண்கள் நைல் நதிக்கரையோரமாக நடந்துகொண்டிருந்தார்கள். நாணல்களின் நடுவே இருந்த கூடையை[a] அவள் கண்டு, தன் பணிப்பெண்ணை அனுப்பி, அதைக் எடுத்தாள்.[b]
  rationale: The revision removes the unsupported causative “caused [her] to bring it,” retains Pharaoh’s daughter as the subject of “took it,” uses a natural contextual rendering for תֵּבָה, and makes the alternative-reading footnote precise without favoring it in the main text.
