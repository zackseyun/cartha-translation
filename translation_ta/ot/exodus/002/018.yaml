revisions:
- from: அவர்கள் தங்கள் தந்தை ரெகுவேலிடம் வந்தபோது, அவர், “இன்று ஏன் இவ்வளவு சீக்கிரமாக வந்துவிட்டீர்கள்?[a]” என்று கேட்டார்.
  to: அவர்கள் தங்கள் தந்தை ரெயூவேலிடம் வந்தபோது, அவர், “இன்று ஏன் இவ்வளவு சீக்கிரமாக வந்தீர்கள்?[a]” என்று கேட்டார்.
  rationale: The revision improves fidelity of the personal name to the Hebrew and makes the footnote’s literal alternative idiomatic Tamil. It also removes the slightly additional completive force of “வந்துவிட்டீர்கள்,” while retaining the contextual sense of returning unusually early.
