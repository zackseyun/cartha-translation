  text: וַ/תָּבֹ֕אנָה אֶל רְעוּאֵ֖ל אֲבִי/הֶ֑ן וַ/יֹּ֕אמֶר מַדּ֛וּעַ מִהַרְתֶּ֥ן בֹּ֖א הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: ta
  text: அவர்கள் தங்கள் தந்தை ரெயூவேலிடம் வந்தபோது, அவர், “இன்று ஏன் இவ்வளவு சீக்கிரமாக வந்தீர்கள்?[a]” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்ந்த மொழிபெயர்ப்பு: “இன்று வர ஏன் விரைந்தீர்கள்?” எபிரெயத்தில் “விரைதல்” என்ற வினைச்சொல் “வருதல்” என்பதுடன் பயன்படுத்தப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: அவர்கள் … வந்தபோது
  rationale: בוא என்பதன் மூன்றாம் நபர் பெண்பால் பன்மை வடிவம். மகள்களைக் குறிக்கும் பெண்பால் பன்மை எபிரெயத்தில் தெளிவாக இருந்தாலும், இயல்பான தமிழ் தொடரில் ‘அவர்கள்’ என்பதும் சூழலும் அதைக் காட்டுகின்றன; ‘வந்தபோது’ என்பது அடுத்த வினாவுடன் காலத் தொடர்பை இயல்பாக இணைக்கிறது.
- source_word: רְעוּאֵל
  choice: ரெகுவேல்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பை நெருக்கமாகப் பின்பற்றும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲבִיהֶן
  choice: தங்கள் தந்தை
  rationale: אָב என்பதன் பொருள் இச்சூழலில் அவர்களுடைய தந்தை. ‘தங்கள்’ என்பது எழுவாயான மகள்களையே இயல்பாகச் சுட்டுகிறது.
- source_word: וַיֹּאמֶר
  choice: அவர் … என்று கேட்டார்
  rationale: மூலத்தில் பொதுவாக ‘சொன்னார்’ என்ற வினை இருந்தாலும், தொடர்ந்து வருவது நேரடியான வினா என்பதால் தமிழில் ‘கேட்டார்’ என்பது உரையாடலின் செயல்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַדּוּעַ
  choice: ஏன்
  rationale: காரணத்தை வினவும் எபிரெயச் சொல்லின் நேரான, இயல்பான தமிழ் இணை.
- source_word: מִהַרְתֶּן בֹּא
  choice: இவ்வளவு சீக்கிரமாக வந்துவிட்டீர்கள்
  rationale: מִהַרְתֶּן என்பது ‘விரைதல்’ என்றும், בֹּא என்பது ‘வருதல்’ என்றும் பொருள்படும். இரண்டையும் சேர்த்துள்ள எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் விரைவான வருகையாக வழங்குகிறது; ‘வந்துவிட்டீர்கள்’ அவர்கள் எதிர்பார்த்ததைவிட முன்பாக வந்து சேர்ந்திருப்பதைச் சுட்டுகிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: ‘அந்த நாள்/இந்நாள்’ என்ற வடிவம் இங்கு கால வினையடையாகச் செயல்பட்டு ‘இன்று’ என்று பொருள்படுகிறது.
