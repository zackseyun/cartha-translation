translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதையுடனும் அமைக்கப்பட்டது. ‘தந்தை’ என்பது தற்போதைய வாசகர்களுக்கு தெளிவான சொல்; வினாவின் ஆச்சரியத் தொனி ‘இவ்வளவு சீக்கிரமாக’ என்பதால் வெளிப்படுகிறது. அடிக்குறி குறியீடு அது விளக்கும் சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
