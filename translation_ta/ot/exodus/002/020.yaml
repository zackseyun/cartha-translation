  text: וַ/יֹּ֥אמֶר אֶל בְּנֹתָ֖י/ו וְ/אַיּ֑/וֹ לָ֤/מָּה זֶּה֙ עֲזַבְתֶּ֣ן אֶת הָ/אִ֔ישׁ קִרְאֶ֥ן ל֖/וֹ וְ/יֹ֥אכַל לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/020.yaml
  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: ta
  text: அவர் தம் மகள்களிடம், “அப்படியானால் அவர் எங்கே? ஏன் அந்த மனிதரை விட்டுவிட்டு வந்தீர்கள்? அவர் உணவு உண்ணும்படி அவரை அழைத்து வாருங்கள்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: அப்படியானால் அவர் எங்கே?
  rationale: אַיּוֹ என்பது ‘அவர் எங்கே?’ என்ற வினா; வְ இணைப்பை உரையாடலின் இயல்பான தொடர்ச்சியைக் காட்டும் ‘அப்படியானால்’ என வழங்கியது.
- source_word: לָמָּה זֶּה
  choice: ஏன்
  rationale: சொல்லாட்சியில் வலியுறுத்தல் இருந்தாலும், நவீன தமிழில் இயல்பான நேரடி வினாவாக ‘ஏன்’ போதுமானது.
- source_word: עֲזַבְתֶּן אֶת־הָאִישׁ
  choice: அந்த மனிதரை அங்கேயே விட்டுவிட்டு வந்தீர்கள்
  rationale: עָזַב என்பதன் ‘விட்டுவிடுதல்’ பொருளையும், மகள்கள் அவரை இருந்த இடத்தில் விட்டுவிட்டு வீடு திரும்பிய சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קִרְאֶן לוֹ
  choice: அவரை அழைத்து வாருங்கள்
  rationale: இங்கு ‘அழையுங்கள்’ என்பது விருந்தினராக வரும்படி அழைப்பதைக் குறிக்கிறது; தமிழில் நோக்கம் தெளிவாக ‘அழைத்து வாருங்கள்’ என வழங்கப்பட்டது.
- source_word: וְיֹאכַל לָחֶם
  choice: அவர் உணவு உண்ணும்படி
  rationale: எபிரேய ‘அப்பம் உண்ணுதல்’ என்பது பொதுவாக உணவு உண்ணுதலைக் குறிக்கும் மொழிவழக்கு; இலக்கு மொழியில் பொருளை இயல்பாகத் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் உரையாடலின் இயல்பும் காக்கப்பட்டுள்ளன. தந்தையை ‘அவர்’ என்றும் அறிமுகமற்ற ஆணை மரியாதையுடன் ‘அந்த மனிதர்’ என்றும் குறிப்பிட்டுள்ளது; செய்யுள் எந்த இறையியல் சர்ச்சையையும் கொண்டிருக்கவில்லை.
