base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: ta
  text: மீதியானின் ஆசாரியனுக்கு ஏழு மகள்கள் இருந்தார்கள்.[a] அவர்கள் வந்து, கிணற்றிலிருந்து தண்ணீர் இறைத்து,[b] தங்கள் தந்தையின் மந்தைக்குத் தண்ணீர் கொடுப்பதற்காகத் தொட்டிகளை நிரப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீதியானைச் சேர்ந்த ஓர் ஆசாரியன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர், குறிப்பிட்ட ஓர் ஆசாரியனையோ மீதியானுடன் தொடர்புடைய ஆசாரியர்களில் ஒருவரையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘தண்ணீர் இறைத்து’ என்பது கிணற்றிலிருந்து தண்ணீரை மேலே எடுப்பதைக் குறிக்கும் எபிரெய வினைச்சொல்லின் மொழிபெயர்ப்பு.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: மீதியானின் ஆசாரியனுக்கு
  rationale: לְ உடன் அமைந்த எபிரெய உடைமை வாக்கியம் தமிழில் ‘ஆசாரியனுக்கு ... இருந்தார்கள்’ என இயல்பாக வருகிறது. כֹהֵן என்பதற்கு ‘ஆசாரியன்’; மִדְיָן என்பதற்கு பிராந்தியத் தொடர்பைக் காட்டும் ‘மீதியானின்’ பயன்படுத்தப்பட்டது.
- source_word: שֶׁבַע בָּנוֹת
  choice: ஏழு மகள்கள் இருந்தார்கள்
  rationale: எபிரெய பெயர்ச்சொல் வாக்கியத்தின் உடைமைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתָּבֹאנָה
  choice: அவர்கள் வந்து
  rationale: בוא என்பதன் எளிய கதைநடைத் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: וַתִּדְלֶנָה
  choice: கிணற்றிலிருந்து தண்ணீர் இறைத்து
  rationale: דלה என்பது கிணற்றிலிருந்து தண்ணீரை மேலே எடுப்பதைக் குறிக்கிறது; சூழலில் மறைந்துள்ள தண்ணீர் மற்றும் கிணறு ஆகியவை தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளன.
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: தொட்டிகளை நிரப்பினார்கள்
  rationale: רְהָטִים என்பது கால்நடைகளுக்குத் தண்ணீர் வைக்கும் தொட்டிகள் அல்லது நீர்வழித் தொட்டிகளைக் குறிக்கும்; ‘தொட்டிகள்’ பொதுவாசகருக்கு தெளிவான இணைச்சொல்.
- source_word: לְהַשְׁקוֹת צֹאן
  choice: மந்தைக்குத் தண்ணீர் காட்டுவதற்காக
  rationale: שקה என்பதன் causative பொருள் கால்நடைகளைத் தண்ணீர் குடிக்கச் செய்வது; தமிழில் ‘மந்தைக்குத் தண்ணீர் காட்டுதல்’ இயல்பான கால்நடைச் சொல்வழக்கு.
- source_word: אֲבִיהֶן
  choice: தங்கள் தகப்பனுடைய
  rationale: மகள்களையே திரும்பச் சுட்டும் பெண்பால் பன்மை உருபின் பொருளைத் தமிழில் ‘தங்கள்’ தெளிவாகக் காட்டுகிறது.
