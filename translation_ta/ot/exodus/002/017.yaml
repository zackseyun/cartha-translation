  text: וַ/יָּבֹ֥אוּ הָ/רֹעִ֖ים וַ/יְגָרְשׁ֑וּ/ם וַ/יָּ֤קָם מֹשֶׁה֙ וַ/יּ֣וֹשִׁעָ֔/ן וַ/יַּ֖שְׁקְ אֶת צֹאנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/017.yaml
  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: ta
  text: அப்போது மேய்ப்பர்கள் வந்து அவர்களை விரட்டிவிட்டார்கள். ஆனால் மோசே எழுந்து அவர்களைக் காப்பாற்றி[a], அவர்களுடைய மந்தைக்குத் தண்ணீர் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களை விடுவித்து.’ எபிரெய வினைச்சொல் காப்பாற்றுதல் அல்லது விடுவித்தல் என்று பொருள்படலாம்; இங்கு மேய்ப்பர்களின் தொல்லையிலிருந்து அந்தப் பெண்களை மோசே மீட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹעִים
  choice: மேய்ப்பர்கள்
  rationale: רעה என்பதன் பெயர்ச்சொல் பயன்பாடு மந்தைகளை மேய்ப்பவர்களைக் குறிக்கிறது; உடனடிச் சூழலுக்கும் நவீனத் தமிழுக்கும் ‘மேய்ப்பர்கள்’ இயல்பாகப் பொருந்துகிறது.
- source_word: וַיְגָרְשׁוּם
  choice: அவர்களை விரட்டிவிட்டார்கள்
  rationale: גרש இங்கு பெண்களை வலுக்கட்டாயமாக அங்கிருந்து அகற்றிய பகைமையான செயலைக் குறிக்கிறது; ‘விரட்டிவிட்டார்கள்’ அந்த வலிமையையும் இயல்பான தமிழ்நடையையும் காக்கிறது.
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום இங்கு மோசே உறுதியாகச் செயல்பட முன்வந்ததைக் குறிக்கிறது; ‘எழுந்து’ என்பது நேரடியும் இயல்புமான இணைவினை வடிவம்.
- source_word: וַיּוֹשִׁעָן
  choice: அவர்களைக் காப்பாற்றி
  rationale: ישע என்பதன் ஹிஃபில் வடிவம் காப்பாற்றுதல் அல்லது விடுவித்தல் என்ற வலுவான பொருளைக் கொண்டது. இச்சூழலில் மேய்ப்பர்களின் தொல்லையிலிருந்து பெண்களை மீட்டதைக் குறிக்க ‘காப்பாற்றி’ பொருத்தமானது.
- source_word: וַיַּשְׁקְ
  choice: தண்ணீர் கொடுத்தார்
  rationale: שקה என்பது குடிக்கத் தண்ணீர் கொடுத்தல் அல்லது கால்நடைகளுக்குத் தண்ணீர் அளித்தல் என்று பொருள்; ‘மந்தைக்குத் தண்ணீர் கொடுத்தார்’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: צֹאנָם
  choice: அவர்களுடைய மந்தை
  rationale: צאן என்பது ஆடுகள், வெள்ளாடுகள் போன்ற சிறு கால்நடைகளைத் தொகுப்பாகக் குறிக்கும்; ‘மந்தை’ இனத்தைத் தேவையின்றிக் குறிப்பாக்காமல் கூட்டுப்பொருளைக் காக்கிறது.
- source_word: וַיָּבֹאוּ
  choice: அப்போது ... வந்து
  rationale: தொடர்கதை வடிவமான wayyiqtol நிகழ்வின் அடுத்த கட்டத்தை முன்னெடுக்கிறது; ‘அப்போது’ அந்த வரிசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיּוֹשִׁעָן என்பதன் மீட்பு சார்ந்த வலுவான பொருள்
  choice: காப்பாற்றி
  alternative: உதவி செய்து / விடுவித்து
  rationale: வினையின் மீட்பு அல்லது விடுதலைப் பொருளை ‘உதவி செய்து’ என்று பலவீனப்படுத்தாமல் காக்கிறது; அதேவேளை இங்கு உயிராபத்திலிருந்து இரட்சித்தார் என்று தேவையின்றி மிகைப்படுத்தாமல், மேய்ப்பர்களின் துன்புறுத்தலிலிருந்து மீட்ட செயலைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவாகவும் மரியாதைமிக்க கதைநடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியும், மோசேயின் தீர்மானமான தலையீடும், ‘காப்பாற்றுதல்/விடுவித்தல்’ என்ற சொற்பொருள் வலிமையும் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் וַיּוֹשִׁעָן என்ற வினையின் தமிழாக்கத்துக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
