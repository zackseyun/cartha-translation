base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: ta
  text: அப்போது அவனுடைய சகோதரி பார்வோனின் மகளிடம், “நான் போய் எபிரெயப் பெண்களிடமிருந்து பாலூட்டும் ஒரு பெண்ணை[a] உங்களுக்காக அழைத்து வரட்டுமா? அவள் உங்களுக்காகக் குழந்தைக்குப் பாலூட்டுவாள்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எபிரெயப் பெண்களிடமிருந்து ஒரு பால்தாயை.”
    reason: אִשָּׁה מֵינֶקֶת என்பதற்கு இச்சூழலில் அமையும் ‘wet nurse’ என்ற பணிவழிப் பொருள் மாற்று.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... என்றாள்
  rationale: வாவ் தொடர் கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: אֲחֹתוֹ
  choice: அவனுடைய சகோதரி
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டை நேரடியாகப் பேணுகிறது; அது யாரைக் குறிக்கிறது என்பதை எபிரெய மூலத்தைப் போலவே சூழல் தீர்மானிக்க விடுகிறது.
- source_word: בַּת פַּרְעֹה
  choice: பார்வோனின் மகள்
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பான தமிழ் உடைமை வேற்றுமையில் வழங்குகிறது.
- source_word: הַאֵלֵךְ
  choice: நான் போகட்டுமா?
  rationale: வினாத்துகளுடன் வரும் முதல் நபர் நிறைவுறா வினை ஒரு மரியாதையான முன்மொழிவை அல்லது அனுமதி கோரலைக் குறிக்கிறது.
- source_word: וְקָרָאתִי
  choice: அழைத்துவர
  rationale: קרא இங்கு ஒருவரை அழைப்பது அல்லது வரவழைப்பது என்ற பொருளில் வருகிறது; காட்சியின் நடைமுறைச் செயலை இயல்பான தமிழில் ‘அழைத்துவர’ தெரிவிக்கிறது.
- source_word: אִשָּׁה מֵינֶקֶת
  choice: பாலூட்டும் ஒரு பெண்
  rationale: ‘பாலூட்டுகிற ஒரு பெண்’ என்ற மூலத்தின் வெளிப்படையான பொருளைப் பேணுகிறது; குறிப்பிட்ட சமூகப் பதவியைத் தேவையின்றி திணிப்பதில்லை.
- source_word: מִן הָעִבְרִיֹּת
  choice: எபிரெயப் பெண்களிலிருந்து
  rationale: מִן குறிக்கும் குழுவிலிருந்து தேர்ந்தெடுத்தல் என்ற கருத்தை நேரடியாகத் தெரிவிக்கிறது.
- source_word: וְתֵינִק
  choice: அவள் ... பாலூட்டுவாள்
  rationale: ינק என்பதன் ஹிஃபில் வடிவம் குழந்தையைப் பால் குடிக்கச் செய்தல், அதாவது பாலூட்டுதல் எனப் பொருள்படுகிறது; தொடரின் இலக்கண வடிவத்தையும் அதன் எதிர்பார்க்கப்பட்ட விளைவையும் பேணுகிறது.
- source_word: הַיָּלֶד
  choice: குழந்தை
  rationale: ילד இச்சூழலில் குழந்தையைக் குறிக்கிறது; பாலினத்தைச் சொல்லிலேயே கூடுதலாகக் குறிப்பதின்றி மூலத்தின் பொதுவான சொல்லை வழங்குகிறது.
