  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: ta
  text: மோசே அந்த மனிதரோடு குடியிருக்கச் சம்மதித்தார்[a]. அவன் தன் மகள் சிப்போராளை மோசேக்குக் கொடுத்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோசே அந்த மனிதரோடு குடியிருக்க மனமிருந்தார்.” எபிரெய வினைச்சொல் விருப்பம், இசைவு அல்லது மனநிறைவைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, சிப்போராளை மோசேக்குத் திருமணம் செய்துகொடுத்தான்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: சம்மதித்தார்
  rationale: யאל் வினைச்சொல் இங்கு விருப்பம் அல்லது இசைவை வெளிப்படுத்துகிறது. ‘சம்மதித்தார்’ என்பது தொடர்ந்துவரும் infinitive-உடன் இயல்பான நவீனத் தமிழாகவும், எபிரெயச் சொல்லின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: לָשֶׁבֶת
  choice: குடியிருக்க
  rationale: ישב என்பதன் அடிப்படைப் பொருள் ‘உட்காருதல்’ என்றாலும், இச்சூழலில் ஒருவரோடு தங்கி வாழ்வதை அல்லது வசிப்பதைச் சுட்டுகிறது. ‘குடியிருக்க’ என்பது நிலையான வசிப்பை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הָאִישׁ
  choice: அந்த மனிதரோடு
  rationale: எபிரெயம் பொதுப்பெயரான ‘அந்த மனிதன்’ என்பதையே பயன்படுத்துகிறது; சூழலில் அது மீதியானின் ஆசாரியனைச் சுட்டுகிறது. மூலத்தில் இல்லாத இயற்பெயரைச் சேர்க்கவில்லை.
- source_word: וַיִּתֵּן
  choice: கொடுத்தான்
  rationale: נתן என்பதன் நேரடிப் பொருள் ‘கொடுத்தான்’. திருமணச் சூழல் உட்பொருளாக இருந்தாலும், முதன்மை உரை மூலத்தின் சுருக்கமான சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: צִפֹּרָה
  choice: சிப்போராள்
  rationale: இயற்பெயர் தமிழ் வேதாகம மரபுக்கும் எபிரெய ஒலிக்கும் ஏற்றவாறு ஒலிபெயர்க்கப்பட்டது.
- source_word: בִתּוֹ
  choice: தன் மகள்
  rationale: இணைக்கப்பட்ட உருபு செயப்பாட்டின் எழுவாயான அந்த மனிதனையே சுட்டுகிறது; தமிழில் ‘தன் மகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לְמֹשֶׁה
  choice: மோசேக்கு
  rationale: לְ பெறுபவரைக் குறிக்கிறது. திருமண உறவு சூழலில் மறைமுகமாகத் தெரிந்தாலும், நேரடி சொல்லாட்சியை முதன்மை உரையில் வைத்துள்ளோம்.
