  yaml_path: translation/ot/exodus/002/008.yaml
  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: ta
  text: பார்வோனின் மகள் அவளிடம், “போ” என்றாள். அந்த இளம்பெண் போய், குழந்தையின் தாயை அழைத்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: பார்வோனின் மகள்
  rationale: எபிரெயக் கட்டமைப்புத் தொடர் பார்வோனுடைய மகளைக் குறிக்கிறது; இவ்வுடைமைத் தொடர் நவீனத் தமிழில் இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: לֵכִי
  choice: போ
  rationale: הלך என்பதன் பெண்பால் ஒருமை ஏவல் வடிவம். எபிரெயச் சொல்லின் சுருக்கத்தையும் நேரடித் தன்மையையும் எளிய தமிழ் ஏவல் வடிவம் காக்கிறது.
- source_word: הָעַלְמָה
  choice: அந்த இளம்பெண்
  rationale: עַלְמָה இளம் வயதுடைய பெண்ணைக் குறிக்கிறது. ‘இளம்பெண்’ என்பது பழமையான நடையின்றி சொற்பொருளைத் துல்லியமாகத் தருகிறது; சுட்டுச்சொல் கதையில் ஏற்கெனவே குறிப்பிடப்பட்ட பெண்ணைக் இயல்பாகத் தொடர்கிறது.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: குழந்தையின் தாயை அழைத்தாள்
  rationale: קרא இங்கு ஒருவரை அழைத்துவருதல் அல்லது வருமாறு அழைத்தல் என்ற பொருளுடையது. தமிழ் தொடர் எபிரெயக் கதையோட்டத்தின் நேரடித் தன்மையைப் பாதுகாக்கிறது.
- source_word: הַיָּלֶד
  choice: குழந்தை
  rationale: יֶלֶד குழந்தை அல்லது சிறுவன் எனப் பொருள்படலாம். இச்சூழலில் மோசே கைக்குழந்தையாக இருப்பதால், பாலினத்தை மீண்டும் தேவையின்றி வலியுறுத்தாத ‘குழந்தை’ இயல்பான தேர்வு.
