  text: וַ/תֹּֽאמֶר לָ֥/הּ בַּת פַּרְעֹ֖ה לֵ֑כִי וַ/תֵּ֨לֶךְ֙ הָֽ/עַלְמָ֔ה וַ/תִּקְרָ֖א אֶת אֵ֥ם הַ/יָּֽלֶד־־־׃
base_translation:
