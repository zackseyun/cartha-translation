  text: וַ/יְהִי֩ בַ/יָּמִ֨ים הָֽ/רַבִּ֜ים הָ/הֵ֗ם וַ/יָּ֨מָת֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יֵּאָנְח֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מִן הָ/עֲבֹדָ֖ה וַ/יִּזְעָ֑קוּ וַ/תַּ֧עַל שַׁוְעָתָ֛/ם אֶל הָ/אֱלֹהִ֖ים מִן הָ/עֲבֹדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: ta
  text: அந்த நெடுங்காலத்தில்[a] எகிப்தின் அரசன் இறந்தான். இஸ்ரவேல் மக்கள்[b] அடிமைத்தனத்தின் காரணமாக[c] முனகிக் கூக்குரலிட்டார்கள். அடிமைத்தனத்தின் காரணமாக அவர்களுடைய உதவிக்குரல் கடவுளிடம் எழும்பியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்படியான பொருள்: ‘அந்தப் பல நாட்களில்’; ‘பல நாட்களுக்குப் பிறகு’ என்றும் பொருள்கொள்ளலாம்.'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொற்படியாக ‘இஸ்ரவேலின் மகன்கள்’; இங்கு இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘கட்டாய உழைப்பின் காரணமாக’ அல்லது ‘அடிமை வேலையின் காரணமாக’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் இங்கு ஒடுக்குமுறை கட்டாய உழைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: அந்த நெடுங்காலத்தில் … இறந்தான்
  rationale: எபிரெயக் கதைநடையின் புதிய நிகழ்வை அறிமுகப்படுத்தும் வடிவம். தமிழில் தனியாக ‘நடந்தது’ என்று சேர்ப்பதைவிட, காலக் குறிப்புடன் நேரடியாக நிகழ்வைக் கூறுவது இயல்பான கதைநடையாகும்.
- source_word: בַיָּמִים הָרַבִּים הָהֵם
  choice: அந்த நெடுங்காலத்தில்
  rationale: சொற்றொடர் ஒரு துல்லியமான நாளைக் குறிக்காமல், நீண்ட காலப்பகுதியைக் குறிக்கிறது. ‘பல நாட்களுக்குப் பிறகு’ என்பது சாத்தியமான விளக்கப் பொருள் என்றாலும், ‘நெடுங்காலத்தில்’ மூலத்தின் காலவெளியைப் பாதுகாக்கிறது.
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசன் இறந்தான்
  rationale: மூலத்தின் நேரடியான நிகழ்வுக் கூற்றை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ அந்தக் கூட்டுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; மூலவடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וַיֵּאָנְחוּ
  choice: பெருமூச்சுவிட்டு
  rationale: துன்பத்தின் காரணமாக வெளிப்படும் ஆழ்ந்த முனகல் அல்லது பெருமூச்சைச் சுட்டுகிறது. தமிழில் சூழலுக்கு ஏற்ற, கண்ணியமான இயல்பான சொல்.
- source_word: מִן הָעֲבֹדָה
  choice: அடிமைத்தனத்தின் காரணமாக
  rationale: இச்சூழலில் עֲבֹדָה சாதாரண வேலை அல்லது சேவை அல்ல; கட்டாயப்படுத்தப்பட்ட ஒடுக்குமுறை உழைப்பையும் அடிமை நிலையையும் குறிக்கிறது. காரணப் பொருளையும் சமூக உண்மையையும் இந்தத் தேர்வு வெளிப்படுத்துகிறது.
- source_word: וַיִּזְעָקוּ
  choice: கூக்குரலிட்டார்கள்
  rationale: கடும் துயரிலிருந்து எழும் வலுவான கூக்குரலைக் குறிக்கிறது. எவரை நோக்கிக் கூக்குரலிட்டார்கள் என்பதை மூலத்தைப் போலவே இக்கூற்றில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: அவர்களுடைய உதவிக்குரல் … எழும்பியது
  rationale: שַׁוְעָה வெறும் சத்தமல்ல, உதவிக்காக எழுப்பப்படும் குரல். ‘எழும்பியது’ என்பது மூலத்திலுள்ள மேல்நோக்கிய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אֶל הָאֱלֹהִים
  choice: கடவுளிடம்
  rationale: மூலத்தில் உள்ள இலக்கை எளிய, இயல்பான தமிழில் தருகிறது; உரையில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: מִן הָעֲבֹדָה (second occurrence)
  choice: அடிமைத்தனத்தின் காரணமாக
  rationale: மூலத்தின் மறுபடியும் வரும் சொற்றொடரைத் தமிழிலும் திரும்பக் கூறி, மக்களின் துயரத்தையும் அவர்களுடைய உதவிக்குரலையும் அடிமைத்தனமே உண்டாக்கியது என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இஸ்ரவேலரின் עֲבֹדָה நிலையை எவ்வாறு மொழிபெயர்ப்பது
  choice: அடிமைத்தனம்
  alternative: வேலை / உழைப்பு / பணி
  rationale: யாத்திராகமத்தின் இச்சூழலில் இது எகிப்தியரால் திணிக்கப்பட்ட ஒடுக்குமுறை கட்டாய உழைப்பைக் குறிக்கிறது. ‘அடிமைத்தனம்’ அதன் தீவிரத்தை மென்மையாக்காமல் தெரிவிக்கிறது; இது கோட்பாட்டுச் சேர்க்கை அல்ல, சூழல்சார் சொற்பொருள் முடிவு.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் கூட்டுப் பொருள்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய வடிவம் இலக்கண ரீதியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் மக்களையும் கூட்டாகக் குறிக்கிறது. தமிழில் ‘மகன்கள்’ என்பது ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தை உருவாக்கலாம்; ஆகவே கூட்டுப் பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் காலவெளி, அடிமைத்தனத்தைக் குறிக்கும் இருமுறை வலியுறுத்தல், துயரக்குரல் மேலெழும் உருவகம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
