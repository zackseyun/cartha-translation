  text: וַ֠/יֹּאמֶר מִ֣י שָֽׂמְ/ךָ֞ לְ/אִ֨ישׁ שַׂ֤ר וְ/שֹׁפֵט֙ עָלֵ֔י/נוּ הַ/לְ/הָרְגֵ֨/נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּ/אֲשֶׁ֥ר הָרַ֖גְתָּ אֶת הַ/מִּצְרִ֑י וַ/יִּירָ֤א מֹשֶׁה֙ וַ/יֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: ta
  text: ஆனால் அவன், “யார் உன்னை எங்கள்மேல் அதிகாரியாகவும் நீதிபதியாகவும் நியமித்தது? எகிப்தியனைக் கொன்றதுபோல் என்னையும் கொல்ல நினைக்கிறாயா?[a]” என்றான். அப்போது மோசே பயந்து, “நிச்சயமாக இந்த விஷயம் தெரியவந்துவிட்டது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எகிப்தியனைக் கொன்றதுபோல் என்னையும் கொல்லப் போகிறாயா என்று சொல்கிறாயா?”
    reason: הַלְהָרְגֵנִי אַתָּה אֹמֵר என்ற எபிரெயத் தொடரில் அֹמֵר (‘சொல்கிறாய்’) இருப்பதால், நோக்கத்தைக் குறிக்கும் ‘நினைக்கிறாயா?’ என்பதோடு, சொல்வதை வெளிப்படையாகக் காட்டும் இந்த மாற்று மொழிபெயர்ப்பும் சாத்தியமாகும்.
lexical_decisions:
- source_word: מִי שָׂמְךָ
  choice: உன்னை ... நியமித்தது யார்?
  rationale: שׂים என்பதன் ‘வை, ஏற்படுத்து, நியமி’ என்ற பொருளையும், மோசேயின் அதிகாரத்தை எதிர்க்கும் கேள்வியின் இயல்பான தமிழ்நடையையும் காக்கிறது.
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: அதிகாரியாகவும் நீதிபதியாகவும்
  rationale: אִישׁ இங்கு அடுத்துவரும் பதவிப் பெயர்களோடு இணைந்த பயன்பாடு; தமிழில் ‘ஒரு மனிதனாக, அதிகாரியாக’ என்பது இயல்பற்றதால் தனியாக மொழிபெயர்க்கப்படவில்லை. שַׂר என்பதற்கு இச்சூழலில் ஆட்சியதிகாரத்தைக் குறிக்கும் ‘அதிகாரி’ பொருத்தமானது.
- source_word: עָלֵינוּ
  choice: எங்களுக்கு
  rationale: தமிழில் ‘எங்கள்மேல் அதிகாரியாக’ என்பதைக் காட்டிலும் ‘எங்களுக்கு அதிகாரியாக’ இயல்பாக உள்ளது; இருப்பினும் பேசுவோர்மீது அதிகாரம் செலுத்தும் கருத்தையே தெரிவிக்கிறது.
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: என்னையும் கொல்ல நினைக்கிறாயா?
  rationale: אֹמֵר இங்கு வெறுமனே வாயால் ‘சொல்வது’ என்பதைவிட நோக்கம் அல்லது எண்ணத்தைச் சுட்டும் சாத்தியம் உள்ளது. இயல்பான தமிழில் அதைப் பிரதிபலிக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת הַמִּצְרִי
  choice: எகிப்தியனைக் கொன்றதுபோல்
  rationale: ஒப்பீட்டுத் தொடரையும் குறிப்பிட்ட எகிப்தியனைச் சுட்டுவதையும் நேரடியாகக் காக்கிறது.
- source_word: וַיִּירָא מֹשֶׁה
  choice: அப்போது மோசே பயந்து
  rationale: கதைத் தொடர்ச்சியையும் மோசேயின் உடனடி அச்சத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָכֵן נוֹדַע הַדָּבָר
  choice: நிச்சயமாக இந்தச் செய்தி வெளியே தெரிந்துவிட்டது
  rationale: אָכֵן குறிக்கும் உறுதியான உணர்தலையும், Niphal נוֹדַע குறிக்கும் விஷயம் வெளிப்பட்டு அறியப்பட்டுவிட்ட நிலையையும் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: לְאִישׁ என்பதிலுள்ள ஆண்பால் பெயர்ச்சொல்
  choice: தமிழ் முதன்மை உரையில் தனியாக ‘மனிதன்’ என்று சேர்க்காமல், ‘அதிகாரியாகவும் நீதிபதியாகவும்’ என மொழிபெயர்த்தல்
  alternative: ‘ஒரு மனிதனாக, அதிகாரியாகவும் நீதிபதியாகவும்’
  rationale: אִישׁ இங்கு பதவிசார் கூறுகளை அறிமுகப்படுத்தும் appositional பயன்பாடாகப் புரிந்துகொள்ளலாம். அதைச் சொற்சொல்லாகச் சேர்ப்பது நவீன தமிழில் பொருளைக் குழப்பும்; நீக்குவது எந்தக் கோட்பாட்டு வேறுபாட்டையும் உருவாக்காது.
- issue: הַלְהָרְגֵנִי אַתָּה אֹמֵר என்பதன் தொடரமைப்பிலுள்ள தெளிவின்மை
  choice: ‘என்னையும் கொல்ல நினைக்கிறாயா?’
  alternative: ‘என்னைக் கொல்வேன் என்று சொல்கிறாயா?’ அல்லது ‘என்னைக் கொல்லப் போகிறாயா?’
  rationale: எபிரெயத் தொடரில் אֹמֵר இருப்பதால் சொல்வது/எண்ணுவது என்ற நுணுக்கம் உள்ளது. முதன்மை உரை நோக்கத்தைக் காட்டும் இயல்பான தமிழைப் பயன்படுத்துகிறது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. உரையாடலின் கூர்மையான சவாலும், மோசேயின் திடீர் அச்சமும் தக்கவைக்கப்பட்டுள்ளன. ‘எகிப்தியன்’ என்பது சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட குறிப்பிட்ட நபரைச் சுட்டுகிறது.
