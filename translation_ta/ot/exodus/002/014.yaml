  source_fidelity: 'முதன்மை உரை எபிரெயத்தின் கருத்தை பெருமளவு துல்லியமாகக் கொடுக்கிறது. ஆனால் עָלֵינוּ என்பது பேசுவோர்மேல் செலுத்தப்படும் அதிகாரத்தைக் குறிக்கிறது; ‘எங்களுக்கு அதிகாரியாக’ என்பது ‘எங்களுக்கான அதிகாரி’ என்ற மெலிந்த பொருளையும் தரலாம். மேலும் נוֹדַע הַדָּבָר என்பதற்கு ‘இந்த விஷயம் தெரியவந்துவிட்டது’ என்பது ‘செய்தி வெளியே தெரிந்துவிட்டது’ என்பதைக் காட்டிலும் நேரடியும் இயல்புமானது. '
  naturalness: ‘எங்கள்மேல் அதிகாரியாகவும் நீதிபதியாகவும்’ இயல்பான நவீன தமிழாகவும் சூழலுக்கு ஏற்ற சவாலான நடையாகவும் உள்ளது. ‘என்னை … கொல்ல நினைக்கிறாயா?’ இயல்பாக உள்ளது. மாற்று அடிக்குறிப்பில் உள்ள வினாவை முழுமையாக்குவது வாசிப்பை மேம்படுத்தும்.
