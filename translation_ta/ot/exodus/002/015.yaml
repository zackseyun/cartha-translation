base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: ta
  text: பார்வோன் இந்தச் சம்பவத்தைக்[a] கேள்விப்பட்டபோது, மோசேயைக் கொல்ல முயன்றான். ஆனால் மோசே பார்வோனிடமிருந்து தப்பியோடி, மீதியான் நாட்டில் குடியிருந்தான்[b]. பின்பு அவன் கிணற்றருகே உட்கார்ந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்தக் காரியத்தை’ அல்லது ‘இந்த நிகழ்வை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் ஒரே வினைச்சொல் இருமுறை வருகிறது: முதலில் மீதியானில் ‘குடியிருந்தான்’ என்றும், அடுத்து கிணற்றருகே ‘உட்கார்ந்தான்’ என்றும் பொருள்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: கேள்விப்பட்டபோது
  rationale: שׁמע என்பதன் அடிப்படைப் பொருள் ‘கேள்.’ இச்சூழலில் பார்வோன் நிகழ்ந்ததை அறிந்துகொண்டதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: הַדָּבָר הַזֶּה
  choice: இந்தச் சம்பவத்தை
  rationale: דבר இங்கு மோசே எகிப்தியனைக் கொன்ற நிகழ்வைக் குறிக்கிறது. ‘சம்பவம்’ சூழலைத் தெளிவாகக் காட்டினாலும் தேவையற்ற விவரத்தைச் சேர்ப்பதில்லை; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: கொல்ல முயன்றான்
  rationale: בקש + வினையெச்சம் நோக்கம் அல்லது முயற்சியை வெளிப்படுத்துகிறது. ‘முயன்றான்’ என்பது தற்போதைய தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: பார்வோனிடமிருந்து தப்பியோடி
  rationale: ברח மற்றும் מִפְּנֵי இணைந்து ஒருவரிடமிருந்து ஓடித் தப்புவதைக் குறிக்கின்றன. ‘தப்பியோடி’ ஆபத்திலிருந்து விலகிச் சென்ற உணர்வை இயல்பாகத் தருகிறது.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: மீதியான் நாட்டில் குடியிருந்தான்
  rationale: ישׁב இங்கு ஓரிடத்தில் தங்கி வாழ்வதைக் குறிக்கிறது. ‘குடியிருந்தான்’ நிரந்தரமாகவே குடியேறினான் என்று மிகைப்படுத்தாமல் வசித்ததைக் காட்டுகிறது.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: கிணற்றருகே உட்கார்ந்தான்
  rationale: இரண்டாவது ישׁב அதன் நேரடியான ‘உட்கார்’ என்ற பொருளில் வருகிறது. இச்சூழலில் עַל என்பதற்கு ‘அருகே’ என்பது இயல்பான தமிழ்.
- source_word: הַבְּאֵר
  choice: கிணறு
  rationale: எபிரெயச் சொல்லின் பொருள் ‘கிணறு.’ தமிழில் தனி வரையறைச் சுட்டு இல்லாமலேயே ‘கிணற்றருகே’ என்பது சூழலுக்குரிய குறிப்பிட்ட கிணற்றை இயல்பாகக் குறிக்க முடியும்.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: தமிழ் வேதாகம வழக்கில் நிலைபெற்ற அரசப் பட்டப்பெயர்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழில் நிலைபெற்ற தனிப்பெயர் வடிவம்.
- source_word: מִדְיָן
  choice: மீதியான்
  rationale: தமிழ் வேதாகம வழக்கில் நிலைபெற்ற இடப்பெயர் வடிவம்.
