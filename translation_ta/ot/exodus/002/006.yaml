base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: ta
  text: அதைத் திறந்து, அவனை—அந்தக் குழந்தையை—கண்டாள்[a]. இதோ, ஓர் ஆண் குழந்தை அழுதுகொண்டிருந்தது[b]. அவனுக்கு இரங்கி[c], “இவன் எபிரெயர்களின் குழந்தைகளில் ஒருவன்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் முதலில் “அவனை” என்ற ஆண்பால் ஒருமைச் சுட்டு வந்து, பின்னர் அவன் “அந்தக் குழந்தை” என்று அடையாளப்படுத்தப்படுகிறான்.
    reason: lexical_alternative
  - marker: b
    text: “இதோ” என்பது அவள் கண்ட காட்சியின்மீது உயிரோட்டமாகக் கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லை மொழிபெயர்க்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவன்மேல் இரக்கம் கொண்டு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: அதைத் திறந்து
  rationale: வினைச்சொல்லின் பொருள் ‘திறந்தாள்.’ எதைத் திறந்தாள் என்பது முந்தைய வசனத்திலுள்ள பெட்டியைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַתִּרְאֵהוּ אֶת־הַיֶּלֶד
  choice: அவனை—அந்தக் குழந்தையை—கண்டாள்
  rationale: எபிரெய உரையில் முதலில் ஆண்பால் ஒருமைப் பின்னொட்டு ‘அவனை’ வந்து, பின்னர் ‘அந்தக் குழந்தை’ என்று அதே நபர் வெளிப்படையாக அடையாளப்படுத்தப்படுகிறார். தமிழ் மொழிபெயர்ப்பு இந்த அமைப்பையும் தெளிவுபடுத்தும் உறவையும் காக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: காணப்பட்ட காட்சியின்மீது திடீரெனவும் உயிரோட்டமாகவும் கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: נַעַר
  choice: ஓர் ஆண் குழந்தை
  rationale: இந்தச் சொல் சிறுவன் முதல் இளைஞன் வரை பரந்த வயது வரம்பைக் குறிக்கலாம்; இச்சூழலில் குழந்தை மோசேயின் ஆண்பாலைச் சுட்டுவதால் ‘ஆண் குழந்தை’ பொருத்தமானது.
- source_word: בֹּכֶה
  choice: அழுதுகொண்டிருந்தது
  rationale: பங்கேற்பு வடிவம் அவள் கண்ட நேரத்தில் தொடர்ந்து நடந்த செயலைக் காட்டுகிறது; தொடர்நிலைத் தமிழ் வடிவம் அதைக் காக்கிறது.
- source_word: וַתַּחְמֹל עָלָיו
  choice: அவன்மேல் இரக்கம் கொண்டு
  rationale: חמל என்பதன் இங்குள்ள மையப் பொருள் இரக்கம் அல்லது பரிவு; அடுத்ததாக அவனை உயிரோடு விட்டதைக் கருத்தில் கொண்டு ‘காப்பாற்றினாள்’ என்று விளக்கமாக்காமல் உணர்ச்சியையே மொழிபெயர்க்கிறது.
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: எபிரெயரின் குழந்தைகளில் ஒருவன்
  rationale: מן கொண்ட அமைப்பு ஒரு குழுவிலிருந்து ஒருவனைச் சுட்டும் பகுதிப்பொருளை உடையது; குழந்தை எபிரெய மக்களைச் சேர்ந்தவன் என்பதைத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זֶה
  choice: இவன்
  rationale: முன்னிலையில் உள்ள ஆண் குழந்தையைச் சுட்டும் அண்மைச் சுட்டுப்பெயர்; நேரடியான தமிழில் ‘இவன்’ இயல்பானது.
