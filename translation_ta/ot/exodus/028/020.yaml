  yaml_path: translation/ot/exodus/028/020.yaml
  text: 'And the fourth row: beryl[a], onyx, and jasper; they shall be set in gold in their settings.'
translation:
  language: ta
  text: 'நான்காவது வரிசை: பெரில், ஓனிக்ஸ், யாஸ்பர்[a]; அவை தத்தம் தங்கப் பதிப்புகளில் பதிக்கப்பட வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தலைமை ஆசாரியனின் மார்ப்பதக்கத்திலுள்ள பல ரத்தினங்களின் துல்லிய அடையாளம் உறுதியாகத் தெரியவில்லை. תַּרְשִׁישׁ என்பதற்கு மரபாக ‘பெரில்’ என்றும், שֹׁהַם என்பதற்கு ‘ஓனிக்ஸ்’ என்றும் மொழிபெயர்க்கப்படுகிறது; வேறு அடையாளங்களும் முன்வைக்கப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: நான்காவது வரிசையில்
  rationale: மார்ப்பதக்கத்திலுள்ள கற்களின் தொடரை טוּר குறிக்கிறது. தமிழில் பட்டியல் தொடர்வதை இயல்பாகக் காட்ட இடவேற்றுமை பயன்படுத்தப்பட்டது.
- source_word: תַּרְשִׁישׁ
  choice: படிகப்பச்சை
  rationale: பண்டைய ரத்தினத்தின் துல்லிய அடையாளம் உறுதியில்லை; வழக்கமாக முன்வைக்கப்படும் ‘beryl’ என்பதற்கான தமிழ் பெயராக இது தேர்ந்தெடுக்கப்பட்டது, மேலும் ஐயத்தை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: שֹׁהַם
  choice: கோமேதகம்
  rationale: இந்த எபிரெயச் சொல்லின் துல்லியமான கனிம அடையாளம் விவாதத்திற்குரியது; ‘onyx’ என்பதற்குப் பரவலாகப் பயன்படும் தமிழ் வேதாகம மரபுச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יָשְׁפֵה
  choice: சிவப்புக்கல்
  rationale: பொதுவாக jasper என அடையாளப்படுத்தப்படும் கல்லுக்கு, சாதாரண வாசகருக்குப் புரியும் இயல்பான தமிழ் பெயர் பயன்படுத்தப்பட்டது.
- source_word: מְשֻׁבָּצִים זָהָב יִהְיוּ
  choice: தங்கத்தில் பதிக்கப்பட்டிருக்க வேண்டும்
  rationale: செயப்பாட்டு பொருளையும் கட்டுமானத்திற்கான விதிப்பொருளையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: בְּמִלּוּאֹתָם
  choice: தத்தம் பதிப்பிடங்களில்
  rationale: கற்கள் பொருத்தப்படும் தனித்தனி சட்டங்கள் அல்லது குழிகளை இச்சூழலில் குறிக்கிறது; ‘தத்தம்’ என்பது எபிரெயச் சொலின் பன்மை உடைமைப் பின்னொட்டை வெளிப்படுத்துகிறது.
