  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: ta
  text: கல்லில் பொறிக்கும் கைவினைஞனின் வேலைப்பாட்டைப் போலவும், முத்திரையின் பொறிப்புகளைப் போலவும், இஸ்ரவேலின் மகன்களின் பெயர்களை அந்த இரண்டு கற்களிலும் பொறிக்க வேண்டும்[a]; அவற்றைப் பொன்னாலான பதிப்புகளில் பதிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘இஸ்ரவேலின் மகன்கள்’; இங்கு இஸ்ரவேலின் கோத்திரங்களின் முன்னோர்களான மகன்களின் பெயர்கள் குறிக்கப்படுகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: கல் செதுக்குவோரின் கைவேலைபோல
  rationale: கல்லில் வேலை செய்யும் கைவினைஞரின் செய்முறையை அளவுகோலாகக் காட்டும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: פִּתּוּחֵי חֹתָם
  choice: முத்திரைச் செதுக்குகளாக
  rationale: முத்திரையில் காணப்படும் நுணுக்கமான பொறிப்பு முறையைக் குறிக்கிறது; ‘முத்திரை’ என்பது חֹתָם என்பதன் பரந்த பொருளையும் காக்கிறது.
- source_word: תְּפַתַּח
  choice: செதுக்க வேண்டும்
  rationale: கற்களில் பெயர்களைப் பொறிக்கும் செயலைத் தெளிவாகவும் இன்றைய தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: அந்த இரண்டு கற்கள்
  rationale: மூலத்தின் பொதுவான ‘கற்கள்’ என்ற சொல்லை, சூழலிலுள்ள குறிப்பிட்ட இரண்டு கற்களைக் காட்டும் வகையில் மொழிபெயர்க்கிறது.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுடைய பெயர்களை அந்த இரண்டு கற்களிலும்
  rationale: עַל என்பதன் மேற்பரப்பு/பொறிப்பு உறவை தமிழின் இடவியல் வேற்றுமையால் இயல்பாக வெளிப்படுத்துகிறது; בְּנֵי என்பதற்கு ‘மகன்கள்’ என்று நேரடியாகத் தருகிறது.
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: அவற்றைச் சுற்றிலும் பொன் பதிப்புகளை அமைக்க
  rationale: கற்கள் பொன்னாலான பிடிப்புகள் அல்லது சட்டங்களால் சூழப்படுவதைத் தெரிவிக்கிறது; பழங்கால நகைத் தொழில்நுட்பத்தை அளவுக்கு மீறி குறிப்பாக்கவில்லை.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: அமைக்க வேண்டும்
  rationale: கட்டளையின் வலிமையைத் தக்கவைத்து, பொன் பதிப்புகளை வடிவமைத்து பொருத்தும் செயலை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் குறித்த குடும்பச் சொல்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள் / இஸ்ரவேலின் பிள்ளைகள்
  rationale: இந்தச் சூழலில் கற்களில் பொறிக்கப்படுவது யாக்கோபாகிய இஸ்ரவேலின் மகன்களுடைய பெயர்கள்; ஆகவே மூலத்தின் ஆண்பால் குடும்பக் குறிப்பையும் வம்சவரலாற்றுச் சூழலையும் ‘மகன்கள்’ துல்லியமாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், திருவழிபாட்டு மரியாதைத் தொனியுடன் ஆனால் பொதுவாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘கைவேலை’, ‘செதுக்கு’, ‘பொன் பதிப்பு’ ஆகியவை கைவினைச் சூழலைத் தெளிவாக்குகின்றன; தேவையற்ற தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
