  text: וְ֠/הָ/אֲבָנִים תִּֽהְיֶ֜יןָ עַל שְׁמֹ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ תִּֽהְיֶ֕יןָ לִ/שְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: ta
  text: அந்தக் கற்கள் இஸ்ரவேலின் மகன்களுடைய பெயர்களுக்கு ஏற்ப, அவர்களுடைய பெயர்களின்படி பன்னிரண்டாக இருக்க வேண்டும்.[a] முத்திரைச் செதுக்கலைப் போல, ஒவ்வொரு கல்லிலும் அதற்குரிய பெயர் பொறிக்கப்பட்டிருக்க வேண்டும்;[b] அவை பன்னிரண்டு கோத்திரங்களுக்குரியவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயை இன்னும் நேரடியாக, “கற்கள் இஸ்ரவேலின் மகன்களுடைய பெயர்களின்படி இருக்க வேண்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “முத்திரைச் செதுக்குகளாக” அல்லது “ஒரு முத்திரையின் செதுக்கைப் போலச் செதுக்கப்பட்டு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: அந்தக் கற்கள்
  rationale: இணைப்புச் சொல்லின் தொடர்ச்சியும், முன்சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட கற்களைக் குறிக்கும் எபிரெயக் குறிப்புச்சொல்லின் வரையறையும் இயல்பான தமிழில் வெளிப்படுகின்றன.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுடைய பெயர்களுக்கு ஏற்ப ... இருக்க வேண்டும்
  rationale: תִּהְיֶיןָ என்பதன் ‘இருக்கும்’ பொருளைத் தக்கவைத்து, עַל இங்கு காட்டும் தொடர்பை ‘பெயர்களுக்கு ஏற்ப’ என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: அவர்களுடைய பெயர்களின்படி பன்னிரண்டாக
  rationale: கற்களின் எண்ணிக்கையும் பெயர்களுடனான ஒத்திசைவும் மூலத்தின் வரிசை மற்றும் கருத்துக்கு நெருக்கமாகத் தரப்படுகின்றன.
- source_word: פִּתּוּחֵי חוֹתָם
  choice: முத்திரைச் செதுக்கலைப் போல ... செதுக்கப்பட்டு
  rationale: முத்திரைக் கல்லில் செய்யப்படும் செதுக்குப் பாணியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; பெயர்கள் உண்மையில் கற்களில் பொறிக்கப்பட வேண்டும் என்ற சூழலையும் காக்கிறது.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: ஒவ்வொன்றிலும் ஒவ்வொருவனுடைய பெயர்
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் ஒருமைத் தன்மையைத் தக்கவைத்து, ஒவ்வொரு கல்லிலும் சம்பந்தப்பட்ட ஒருவனின் பெயர் இருப்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: பன்னிரண்டு கோத்திரங்களுக்குரியவை
  rationale: לְ குறிக்கும் தொடர்பு அல்லது பிரதிநிதித்துவத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் குறிக்கப்பட்ட உடன்படிக்கைச் சொற்றொடர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள் / இஸ்ரவேலர்
  rationale: எபிரெயில் உள்ள ‘இஸ்ரவேலின் மகன்கள்’ என்ற நேரடியான குடும்ப மற்றும் கோத்திர வழிச் சொல்லைத் தக்கவைக்கிறது; பொதுப்படுத்தி அதன் வடிவத்தை மறைக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு உடை தொடர்பான dignified சொற்களாக ‘முத்திரைச் செதுக்கல்’, ‘கோத்திரம்’ ஆகியவை பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் மறுமொழியை முற்றிலும் நீக்காமல், தமிழில் வாசிக்க இயலுமாறு வாக்கியம் அமைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
