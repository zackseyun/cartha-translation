    reason: lexical_alternative
  - marker: b
    text: “முத்திரைச் செதுக்குகளாக” அல்லது “ஒரு முத்திரையின் செதுக்கைப் போலச் செதுக்கப்பட்டு” என்றும் மொழிபெயர்க்கலாம்.
