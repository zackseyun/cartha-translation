  yaml_path: translation/ot/exodus/028/031.yaml
  text: You shall make the robe of the ephod entirely of blue[a][b].
translation:
  language: ta
  text: ஏபோத்துக்குரிய மேலங்கியை முழுவதும் நீல நிறத் துணியால்[a][b] செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “முழுவதும் நீல நிறத்தில்”; மேலங்கி முழுமையாக நீல நிறப் பொருளால் செய்யப்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நீலம்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், நீலம் முதல் நீல-ஊதா வரையிலான நிறத்தில் சாயமிடப்பட்ட விலையுயர்ந்த துணிப்பொருளைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்ய வேண்டும்
  rationale: அறிவுறுத்தல்களின் தொடரில் வரும் இவ்வினை வடிவம் கட்டளையைத் தெரிவிக்கிறது; நவீன தமிழில் இயல்பான கட்டளைநடையாக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: מְעִיל
  choice: மேலங்கி
  rationale: ஆசாரிய உடையுடன் தொடர்புடைய நீளமான அங்கியைக் குறிக்கிறது; தற்போதைய தமிழில் எளிதில் புரியும் சொல்லாக ‘மேலங்கி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָאֵפֹד
  choice: ஏபோத்து
  rationale: இது ஆசாரியருக்குரிய ஒரு சிறப்பு உடையின் தொழில்நுட்பப் பெயர்; உறுதியற்ற விளக்கச்சொல்லால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: כְּלִיל
  choice: முழுவதும்
  rationale: முழுமை அல்லது முற்றுமையை உணர்த்தும் எபிரெயச் சொல்லின் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: תְּכֵלֶת
  choice: நீல நிற நூல்
  rationale: கூடார மற்றும் ஆசாரிய உடைச் சூழலில், நீலம் முதல் நீல-ஊதா வரையிலான நிறத்தில் சாயமிடப்பட்ட விலையுயர்ந்த நூல் அல்லது துணிப்பொருளைக் குறிக்கிறது; இங்கு உடை செய்யும் பொருளைத் தெளிவுபடுத்த ‘நூல்’ சேர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் ஆசாரிய உடை குறித்த கண்ணியமான அறிவுறுத்தல் நடையைப் பேணுகிறது. ‘ஏபோத்து’ தொழில்நுட்பப் பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது; பொருள் மற்றும் நிறம் குறித்த எபிரெயச் சொல்லின் சாத்தியமான பரப்பை அடிக்குறிப்புகள் பாதுகாக்கின்றன.
