- from: ஏபோத்துக்குரிய மேலங்கியை முழுவதும் நீல நிற நூலால்[a][b] செய்ய வேண்டும்.
  to: ஏபோத்துக்குரிய மேலங்கியை முழுவதும் நீல நிறத் துணியால்[a][b] செய்ய வேண்டும்.
  rationale: தெகேலெத் என்ற எபிரெயச் சொல்லை ‘நூல்’ எனக் குறிப்பிட்டது மூலத்தில் இல்லாத பொருள்-வகை வரம்பைச் சேர்க்கிறது. அதை ‘நீல நிறத் துணி’ என மாற்றுவது மூலத்தின் பொருள் பரப்பையும் நவீனத் தமிழ் இயல்பையும் காக்கிறது. அடிக்குறிப்புகளும் இதற்கேற்ப ‘நூல் அல்லது துணி’ என்ற தேவையற்ற குறிப்பிலிருந்து நடுநிலையான ‘துணிப்பொருள்’ எனத் திருத்தப்பட்டுள்ளன.
