  yaml_path: translation/ot/exodus/028/002.yaml
  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: ta
  text: உன் சகோதரனாகிய ஆரோனுக்கு மகிமைக்காகவும் அழகுக்காகவும் பரிசுத்த ஆடைகளைச் செய்வாயாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மதிப்பிற்காகவும் அழகுக்காகவும்” அல்லது “மகிமைக்காகவும் பொலிவிற்காகவும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: כָּבוֹד என்பதற்கு “மதிப்பு/கௌரவம்” என்றும் תִּפְאֶרֶת என்பதற்கு “பொலிவு” என்றும் பொருள் வரலாம்; மூலத்தின் இணையான நோக்கத் தொடர்கள் காக்கப்படுகின்றன.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்வாயாக
  rationale: இணைப்புடன் வந்த Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் இச்சட்ட அறிவுறுத்தல் சூழலில் கட்டளையைக் குறிக்கிறது; ‘செய்வாயாக’ அதன் நேரடியான ஆணைத்தன்மையையும் கண்ணியமான நடையையும் காக்கிறது.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: பரிசுத்த ஆடைகள்
  rationale: கட்டமைப்புத் தொடரான இச்சொற்றொடர் புனிதப் பயன்பாட்டுக்கெனப் பிரித்துவைக்கப்பட்ட ஆடைகளைக் குறிக்கிறது; ‘பரிசுத்த ஆடைகள்’ consecratory sense-ஐ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: உன் சகோதரன் ஆரோனுக்காக
  rationale: ஆரோனை மோசேயுடனான குடும்ப உறவால் அடையாளப்படுத்தும் எபிரெய நேரடி அமைப்பை இயல்பான தமிழ்ச் சொல் வரிசையில் காக்கிறது.
- source_word: לְכָבוֹד
  choice: மகிமை
  rationale: כבוד என்பது மகிமை, கனம், மதிப்பு ஆகிய பொருள் வட்டத்தைக் கொண்டது; இணையாக வரும் תפארת உடன் இங்கு ஆசாரிய ஆடைகளின் உயர்வையும் காட்சிப்படுத்தும் மாண்பையும் ‘மகிமை’ காக்கிறது.
- source_word: וּלְתִפְאָרֶת
  choice: அழகு
  rationale: תפארת என்பது அழகு, பொலிவு, சிறப்பு என்பவற்றைக் குறிக்கலாம்; ‘அழகு’ தெளிவான நவீனத் தமிழில் அதன் அழகியல் பரிமாணத்தைத் தருகிறது.
theological_decisions:
- issue: ஆசாரிய ஆடைகளின் நோக்கத்தைச் சொல்லும் לְכָבוֹד וּלְתִפְאָרֶת
  choice: மகிமையும் அழகும் விளங்கும்படி
  alternative: மதிப்பிற்காகவும் பொலிவிற்காகவும்
  rationale: இந்த எபிரெயச் சொற்கள் மனிதருக்குரிய கௌரவத்தை மட்டுமோ, தெய்வீக மகிமையை மட்டுமோ திட்டவட்டமாகக் குறுக்குவதில்லை. தேர்ந்த மொழிபெயர்ப்பு ஆசாரியப் பணியின் மாண்பையும் ஆடைகளின் அழகியல் சிறப்பையும் வைத்திருக்கிறது; ‘விளங்கும்படி’ என்பது நோக்கம் அல்லது விளைவு என்ற இயல்பான பரப்பைத் தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், அதேவேளை சட்ட-ஆசாரியச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த’ என்பது வேதாகமச் சூழலில் பரவலாகப் புரியப்படும் சொல்லாகவும், ‘செய்வாயாக’ நேரடி கட்டளையைத் தக்கவைக்கும் உயர்நடையாகவும் உள்ளது.
