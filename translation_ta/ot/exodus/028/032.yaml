  text: וְ/הָיָ֥ה פִֽי רֹאשׁ֖/וֹ בְּ/תוֹכ֑/וֹ שָׂפָ֡ה יִֽהְיֶה֩ לְ/פִ֨י/ו סָבִ֜יב מַעֲשֵׂ֣ה אֹרֵ֗ג כְּ/פִ֥י תַחְרָ֛א יִֽהְיֶה לּ֖/וֹ לֹ֥א יִקָּרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: ta
  text: அதில் தலை நுழையும் திறப்பு அதன் நடுவில் இருக்க வேண்டும். அந்தத் திறப்பைச் சுற்றிலும் நெசவால் செய்யப்பட்ட ஓரம் இருக்க வேண்டும். அது கவச ஆடையின் திறப்பைப் போல இருக்க வேண்டும்[a]; அந்த ஆடை கிழிந்துபோகக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கவசத்தின் திறப்பைப் போல’ அல்லது ‘மார்புக் கவசத்தின் திறப்பைப் போல’ என்றும் மொழிபெயர்க்கலாம். תַחְרָא (தஹ்ரா) என்ற எபிரெயச் சொல் அரிதானது; கிழியாமல் தாங்கும் வகையில் உறுதியாக அமைக்கப்பட்ட கழுத்துத் திறப்பே இந்த ஒப்புமையின் கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: அதன் தலை நுழையும் திறப்பு
  rationale: ஆடைச் சூழலில் פֶּה என்பது சொல்லாட்சிப்படி ‘வாய்’ என்றாலும், இங்கு தலை நுழையும் திறப்பைக் குறிக்கிறது. இயல்பான தமிழில் செயல்பாட்டைத் தெளிவாக்குகிறது.
- source_word: בְּתוֹכוֹ
  choice: அதன் நடுவில்
  rationale: திறப்பு ஆடையின் மையப்பகுதியில் அமைவதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: நெசவால் செய்யப்பட்ட ஓரம்
  rationale: שָׂפָה இங்கு திறப்பைச் சுற்றியுள்ள ஓரத்தையும், מַעֲשֵׂה אֹרֵג அது நெசவுத் தொழிலால் செய்யப்பட்டதையும் குறிக்கின்றன. ‘ஓரம்’ என்பது ‘கட்டு’ என்பதைவிட எபிரெயச் சொல்லுக்கு நெருக்கமானது.
- source_word: לְפִיו סָבִיב
  choice: அந்தத் திறப்பைச் சுற்றிலும்
  rationale: மீண்டும் வரும் פֶּה ஆடையின் திறப்பைக் குறிக்கிறது; סָבִיב முழுச் சுற்றையும் உணர்த்துகிறது.
- source_word: כְּפִי תַחְרָא
  choice: கவச ஆடையின் திறப்பைப் போல
  rationale: תַחְרָא அரிதான சொல்; கவசம் அல்லது கவச மேலாடை எனப் பொருள்கொள்ளப்படுகிறது. உறுதியூட்டப்பட்ட கழுத்துத் திறப்பை ஒப்புமை சுட்டுவதால், பொதுவாகப் புரியும் ‘கவச ஆடை’ தேர்ந்தெடுக்கப்பட்டது; சொல்லின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֹא יִקָּרֵעַ
  choice: அது கிழிந்துபோகக் கூடாது
  rationale: நிபால் வடிவத்தின் செயப்பாட்டு/விளைவு உணர்வை வைத்துக்கொண்டு, எபிரெய கட்டளையின் நேரடித் தொனியை இயல்பான தமிழில் தருகிறது.
