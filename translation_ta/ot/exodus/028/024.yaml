revisions:
- from: பொன்னால் பின்னப்பட்ட இரண்டு சங்கிலிகளையும்[a] அந்த இரண்டு வளையங்களில், மார்பணியின்[b] முனைகளில் பொருத்துவாயாக.
  to: பொன்னால் பின்னப்பட்ட அந்த இரண்டு சங்கிலிகளையும் மார்புத் துண்டின் முனைகளிலுள்ள இரண்டு வளையங்களில் பொருத்துவாயாக.
  rationale: 'The revision makes explicit that the two rings are located at the ends of the breastpiece, preserving the Hebrew construction and the practical fastening sequence. Footnote markers are retained for the documented lexical alternatives: [a] after ‘சங்கிலிகளையும்’ and [b] after ‘மார்புத் துண்டின்.’'
