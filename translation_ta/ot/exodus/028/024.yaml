  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: ta
  text: பொன்னால் பின்னப்பட்ட அந்த இரண்டு சங்கிலிகளையும் மார்புத் துண்டின் முனைகளிலுள்ள இரண்டு வளையங்களில் பொருத்துவாயாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: பொருத்துவாயாக
  rationale: தொடர்ச்சியான கட்டளைச் சூழலில் வந்துள்ள வாவுடன் கூடிய வினைமுற்றைத் தமிழில் இயல்பான கட்டளையாக வழங்குகிறது; சங்கிலிகளை வளையங்களோடு இணைக்கும் செயலை ‘பொருத்து’ தெளிவாகக் காட்டுகிறது.
- source_word: שְׁתֵּי עֲבֹתֹת הַזָּהָב
  choice: பொன்னால் பின்னப்பட்ட இரண்டு சங்கிலிகள்
  rationale: עֲבֹתֹת என்பது முறுக்கப்பட்ட அல்லது பின்னப்பட்ட கயிறு போன்ற சங்கிலி வேலையைக் குறிக்கிறது; பொன் அதன் பொருளைச் சுட்டுகிறது.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: அந்த இரண்டு வளையங்களில்
  rationale: இங்கு עַל சங்கிலிகளை வளையங்களோடு இணைத்துப் பொருத்துவதைக் குறிக்கிறது; தமிழில் ‘வளையங்களில் பொருத்து’ என்பது இயல்பும் தெளிவும் உடையது.
- source_word: אֶל קְצוֹת הַחֹשֶׁן
  choice: மார்பணியின் முனைகளில்
  rationale: קְצוֹת என்பது முனைகள் அல்லது ஓரப்பகுதிகளைக் குறிக்கிறது. חֹשֶׁן உலோகக் கவசமல்ல, ஆசாரிய உடையின் அலங்காரப் பகுதியாக இருப்பதால் ‘மார்பணி’ என வழங்கப்பட்டுள்ளது.
