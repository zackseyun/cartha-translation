source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: ta
  text: “நியாயத்தீர்ப்பின் மார்பணியை[a] கலைநயம் மிக்க கைவினைஞரின் வேலைப்பாடாகச் செய்ய வேண்டும். ஏபோத்தின் வேலைப்பாட்டைப் போலவே அதைச் செய்ய வேண்டும். தங்கம், நீலநூல், ஊதாநூல், செந்நிற நூல், நேர்த்தியாக முறுக்கப்பட்ட மெல்லிய லினன் நூல் ஆகியவற்றால் அதைச் செய்ய வேண்டும்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயத்தீர்ப்புக்கான மார்பணி” அல்லது “தீர்மானத்திற்கான மார்பணி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  choice: மார்பணி
  rationale: தலைமைக் குருவின் மார்பில் அணியப்பட்ட அலங்காரமும் சடங்குப் பயன்பாடும் கொண்ட பொருளைக் குறிக்கிறது. ‘மார்புக்கவசம்’ என்பது போர்க்கவசம் என்ற தவறான எண்ணத்தைத் தரக்கூடும்; ‘மார்பணி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִשְׁפָּט
  choice: நியாயத்தீர்ப்பின்
  rationale: எபிரெயக் கட்டமைப்பை முறையாகப் பேணுவதோடு, நீதிசார் அல்லது தீர்மானம் வழங்கும் சடங்குச் செயல்பாட்டுடனான தொடர்பையும் விளக்கத்தை மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: கலைநயம் மிக்க கைவினைஞரின் வேலைப்பாடாக
  rationale: திட்டமிட்டு வடிவமைக்கப்பட்ட திறமையான கைவினைப் பணியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இதை வெறும் நெசவாக மட்டும் குறுக்கவில்லை.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: ஏபோத்தின் வேலைப்பாட்டைப் போலவே
  rationale: ஏபோத்துக்குப் பயன்படுத்தப்பட்ட அதே வகையான அல்லது அதே தரமான கைவினை முறையை ஒப்பீட்டுடன் வெளிப்படுத்துகிறது.
- source_word: אֵפֹד
  choice: ஏபோத்
  rationale: தனித்துவமான குருத்துவ உடையைக் குறிக்கும் தொழில்நுட்பச் சொல் என்பதால் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: זָהָב
  choice: தங்கம்
  rationale: பொருட்களின் பட்டியலில் வரும் நேரடியான பொருட்பெயர்.
- source_word: תְּכֵלֶת
  choice: நீலநூல்
  rationale: கூடாரத் துணிகளில் பயன்படும் நீலச் சாயமிட்ட நூலைத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: אַרְגָּמָן
  choice: ஊதாநூல்
  rationale: விலையுயர்ந்த ஊதா நிறச் சாயமிட்ட நூலைப் பொருட்பட்டியலின் சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: תוֹלַעַת שָׁנִי
  choice: செந்நிற நூல்
  rationale: சாயமிட்ட செந்நிறத் துணிநூலைக் குறிக்கும் சொல்லிணையை வாசகர்களுக்குப் புரியும் வகையில் தருகிறது.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: நன்றாக முறுக்கப்பட்ட மெல்லிய சணல்நூல்
  rationale: உயர்தரமான மெல்லிய சணல் இழைகள் முறுக்கப்பட்டிருந்த தன்மையைத் தெளிவாகப் பேணுகிறது.
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: அதைச் செய்ய வேண்டும் ... அதைச் செய்ய வேண்டும்
  rationale: எபிரெய உரையின் அறிவுறுத்தல் பாணியிலுள்ள வினைச்சொல் மறுபடியும் வருவதைச் சுருக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: חֹשֶׁן מִשְׁפָּט என்பதன் செயல்பாடு
  choice: நியாயத்தீர்ப்பின் மார்பணி
  alternative: தீர்மானத்திற்கான மார்பணி; நீதியின் மார்பணி
  rationale: இச்சொற்றொடர் குருத்துவத் தீர்மானம் அல்லது நீதிசார் செயல்பாட்டோடு தொடர்புடையதாக இருக்கலாம்; ஆனால் இந்த வசனம் அதன் செயல்முறையை விளக்கவில்லை. எனவே அதன் சடங்கு மற்றும் இறையியல் ஒலிப்பைத் தக்கவைத்து, பொருளை ஒரு குறிப்பிட்ட விளக்கத்துக்குள் அடைக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. குருத்துவ உடைக்கான தொழில்நுட்பச் சொல்லாக ‘ஏபோத்’ ஒலிபெயர்க்கப்பட்டுள்ளது. அறிவுறுத்தலின் மறுமொழிப் பாணியும் பொருட்பட்டியலின் துணிநூல் சூழலும் பேணப்பட்டுள்ளன.
