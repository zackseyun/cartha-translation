source:
  edition: WLC
  text: וַ/עֲשֵׂ֤ה לָ/הֶם֙ מִכְנְסֵי בָ֔ד לְ/כַסּ֖וֹת בְּשַׂ֣ר עֶרְוָ֑ה מִ/מָּתְנַ֥יִם וְ/עַד יְרֵכַ֖יִם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/042.yaml
  text: And make for them linen undergarments to cover their naked flesh[b][a]; they shall be from the hips to the thighs.
translation:
  language: ta
  text: அவர்களுடைய நிர்வாண உடற்பகுதியை மூடுவதற்காக அவர்களுக்கு லினன் துணியாலான உள்ளாடைகள்[a] செய்; அவை இடுப்பிலிருந்து தொடைகள் வரை இருக்க வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லினன் கீழாடைகள்.” இங்கு வரும் எபிரேயச் சொல், ஆசாரிய உடைகளுக்குக் கீழே அணிந்து கீழ் உடலை மூடும் ஆடையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “அரைக்கட்டிலிருந்து தொடைகள் வரை.” ஆடையின் மேல்தொடக்கப் பகுதியைக் குறிக்க இங்கு “இடுப்பு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: செய்
  rationale: தொடர்ச்சியான கட்டளையின் தொனியை இயல்பான தமிழ் ஏவல் வடிவில் தருகிறது; வாவ் இணைப்பின் தொடர்ச்சி வசனச் சூழலில் புலப்படுகிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆசாரியர்களுக்காகச் செய்யப்படுவதைத் தெரிவிக்கும் இயல்பான நான்காம் வேற்றுமை வடிவம்.
- source_word: מִכְנְסֵי בָד
  choice: மெல்லிய நார்த்துணியால் உள்ளாடைகள்
  rationale: מִכְנְסֵי என்பது கீழ் உடலை மூடி மற்ற ஆசாரிய ஆடைகளுக்குக் கீழே அணியும் ஆடையைக் குறிக்கிறது. בָד என்பதன் துணிவகையைத் தமிழில் பொதுவாகப் புரியும்படி ‘மெல்லிய நார்த்துணி’ என வழங்குகிறது; மாற்றுப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְכַסּוֹת
  choice: மூடுவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் எபிரேய வினையெச்சத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּשַׂר עֶרְוָה
  choice: அவர்களுடைய நிர்வாண உடல்
  rationale: சொல்லடியாக ‘நிர்வாணத்தின் சதை/உடல்’; மிகையான மறைமொழியோ தேவையற்ற வெளிப்படைத்தன்மையோ இன்றி உடல் நிர்வாணத்தைக் குறிப்பிடுகிறது.
- source_word: מִמָּתְנַיִם
  choice: இடுப்பிலிருந்து
  rationale: מָתְנַיִם என்பதன் இடுப்பு/அரைக்கட்டு/இடுப்புப் பகுதி வரம்பில், ஆடையின் மேல்தொடக்கப் பகுதியை இயல்பான தமிழில் குறிப்பிடுகிறது.
- source_word: וְעַד יְרֵכַיִם
  choice: தொடைகள் வரை
  rationale: יָרֵךְ என்பதன் பொதுவான பொருளான ‘தொடை’யை வைத்து ஆடையின் கீழ் எல்லையைத் தெரிவிக்கிறது.
- source_word: יִהְיוּ
  choice: இருக்க வேண்டும்
  rationale: எளிய ‘இருக்கும்/இருக்கட்டும்’ கருத்தை, கட்டளைச் சூழலுக்கேற்ற விதிமுறைத் தமிழில் வழங்குகிறது; ‘நீள வேண்டும்’ என வினையில் இல்லாத பொருளைச் சேர்க்கவில்லை.
