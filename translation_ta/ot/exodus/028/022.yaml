  yaml_path: translation/ot/exodus/028/022.yaml
  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: ta
  text: மார்ப்பதக்கத்தின்மேல் தூய தங்கத்தால் கயிறுபோல் பின்னப்பட்ட சங்கிலிகளைச் செய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை ‘முறுக்கப்பட்ட சங்கிலிகள்’ அல்லது ‘கயிறு வடிவச் சங்கிலிகள்’ என்றும் மொழிபெயர்க்கலாம்; சங்கிலிகள் பின்னப்பட்ட அல்லது கயிறு போன்ற வடிவில் செய்யப்பட்டதை எபிரெயச் சொற்றொடர் விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்
  rationale: அறிவுறுத்தல்களின் தொடரில் வரும் இந்த வினைவடிவம் கட்டளையின் வலிமையைக் கொண்டுள்ளது; நவீன தமிழில் நேரடியான ஒருமைக் கட்டளையாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: עַל הַחֹשֶׁן
  choice: மார்ப்பதக்கத்தின்மேல்
  rationale: עַל என்பதன் அடிப்படைப் பொருளான ‘மேல்’ என்பதையும், சங்கிலிகள் மார்ப்பதக்கத்துடன் இணைக்கப்படும் சூழலையும் இது தெளிவாகக் காட்டுகிறது.
- source_word: שַׁרְשֹׁת
  choice: சங்கிலிகளை
  rationale: இச்சொல் இணைப்புகளால் ஆன சங்கிலிகளைக் குறிக்கிறது; அணிகலன் மற்றும் திருக்கூடாரப் பொருள் சூழலில் ‘சங்கிலிகள்’ தெளிவான இயல்பான சொல்.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: கயிறுபோல் பின்னப்பட்ட
  rationale: எபிரெயச் சொற்றொடர் கட்டப்பட்ட, முறுக்கப்பட்ட அல்லது பின்னப்பட்ட கயிறு போன்ற வேலைப்பாட்டை விவரிக்கிறது. ‘கயிறுபோல் பின்னப்பட்ட’ என்பது அதன் உருவகத்தையும் தயாரிப்பு முறையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கத்தால்
  rationale: பொருளின் தன்மையையும் அதனால் சங்கிலிகள் செய்யப்படுவதையும் தெளிவாகக் குறிக்கும் வழக்கமான தமிழ் வடிவம்.
