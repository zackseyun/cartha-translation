revisions:
- from: அந்த இரண்டு முறுக்குச் சங்கிலிகளின் இரு முனைகளையும் இரண்டு பதக்கங்களில் பொருத்தி, அவற்றை ஏபோதின் தோள்பட்டைகளின் முன்பக்கத்தில் வைக்க வேண்டும்.
  to: அந்த இரண்டு முறுக்குக் கயிறுகளின் இரு முனைகளையும் அந்த இரண்டு பொருத்துக்களில் வைத்து, அந்தப் பொருத்துக்களை ஏபோதின் தோள்பட்டைகளில் அதன் முன்பக்கத்தில் வைக்க வேண்டும்.எ
  rationale: ‘பதக்கங்கள்’ என்பதற்குப் பதிலாக, மூலத்தின் பொருத்து/அமைப்பு பொருளைத் துல்லியமாகத் தரும் ‘பொருத்துக்கள்’ பயன்படுத்தப்பட்டுள்ளது. முறுக்குக் கயிறுகள்/சங்கிலிகள் என்ற சொல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. இரண்டாம் வினையின் பொருளாக அமைப்புகளை வெளிப்படையாகக் குறிப்பிடுவது தொடர்ச்சியான கட்டுமான வழிமுறையைத் தமிழில் தெளிவாக்குகிறது.
