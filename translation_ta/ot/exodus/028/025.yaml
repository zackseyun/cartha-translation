  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: ta
  text: அந்த இரண்டு முறுக்குக் கயிறுகளின் இரு முனைகளையும் அந்த இரண்டு பொருத்துக்களில் வைத்து, அந்தப் பொருத்துக்களை ஏபோதின் தோள்பட்டைகளில் அதன் முன்பக்கத்தில் வைக்க வேண்டும்.எ
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְצוֹת
  choice: முனைகள்
  rationale: முறுக்குச் சங்கிலிகளின் முடிவுப் பகுதிகளைக் குறிக்கும் இயல்பான, துல்லியமான தமிழ்ச் சொல்.
- source_word: הָעֲבֹתֹת
  choice: முறுக்குச் சங்கிலிகள்
  rationale: இச்சொல் தடித்த கயிறுகளையோ பின்னல்/முறுக்கு வேலைப்பாடுள்ள சங்கிலிகளையோ குறிக்கலாம்; முந்தைய வசனத்தின் பொன் சங்கிலி சூழல் இங்கு சங்கிலிகளைக் குறிக்கிறது.
- source_word: הַמִּשְׁבְּצֹת
  choice: பதக்கங்கள்
  rationale: ஏபோதுடன் இணைக்கப்படும் பொன் பொருத்துப் பகுதிகளைக் குறிக்கிறது; அலங்கார வடிவை அளவுக்கு மீறி வரையறுக்காமல் நவீன தமிழில் புரியுமாறு தருகிறது.
- source_word: כִתְפֹת
  choice: தோள்பட்டைகள்
  rationale: உடலின் தோள்களை அல்ல, ஏபோதின் தோள் பகுதிகளை இவ்வுடைத் தயாரிப்பு சூழல் குறிக்கிறது.
- source_word: אֵפֹד
  choice: ஏபோது
  rationale: துல்லியமான தமிழ் இணைச்சொல் இல்லாத சிறப்பு ஆசாரிய உடையின் பெயர் என்பதால் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: אֶל מוּל פָּנָיו
  choice: முன்பக்கத்தில்
  rationale: ஏபோதின் முன்னோக்கிய பக்கத்தில் அமைக்க வேண்டும் என்ற இடத்தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְנָתַתָּה
  choice: வைக்க வேண்டும்
  rationale: கட்டளைத் தன்மையை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது; தொடர்புடைய பொருட்கள் பன்மை என்பதால் பொருள் சூழலிலிருந்து அறியப்படுகிறது.
