  text: וְ/אַתָּ֡ה הַקְרֵ֣ב אֵלֶי/ךָ֩ אֶת אַהֲרֹ֨ן אָחִ֜י/ךָ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ מִ/תּ֛וֹךְ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/כַהֲנ/וֹ לִ֑/י אַהֲרֹ֕ן נָדָ֧ב וַ/אֲבִיה֛וּא אֶלְעָזָ֥ר וְ/אִיתָמָ֖ר בְּנֵ֥י אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: ta
  text: '“நீயோ, உன் சகோதரன் ஆரோனையும், அவனுடன் அவன் மகன்களையும், இஸ்ரவேல் மக்களின் நடுவிலிருந்து[a] உன்னருகே அழைத்து வா; அவர்கள் எனக்காக ஆசாரியப் பணியாற்றும்படி: ஆரோன், நாதாப், அபிகூ, எலெயாசார், இத்தாமார்—ஆரோனின் மகன்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொற்சொல்லாக, “இஸ்ரவேலின் மகன்களின் நடுவிலிருந்து”; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான கூட்டு அடையாளம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: தொடக்கத்திலுள்ள தனிப்பெயர்ச்சொல் வலியுறுத்தலையும் உரையாடலின் திருப்பத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַקְרֵב אֵלֶיךָ
  choice: உன்னருகே வரச்செய்
  rationale: ‘அருகில் கொண்டுவா’ என்ற எபிரேயச் சொல்லின் நேரடியான இயக்கத்தையும் மோசேயை நோக்கிய தனிப்பட்ட திசையையும் காக்கிறது; முழுமையான திருநிலைப்படுத்தல் என்ற கருத்தை முன்கூட்டியே சேர்க்கவில்லை.
- source_word: אָחִיךָ
  choice: உன் சகோதரன்
  rationale: ஆரோனுக்கும் மோசேக்கும் இடையிலான குடும்ப உறவை மூலத்தைப் போல வெளிப்படையாகக் காட்டுகிறது.
- source_word: בָּנָיו אִתּוֹ
  choice: அவனுடன் அவன் மகன்களையும்
  rationale: ஆரோனும் அவன் மகன்களும் ஒன்றாக அழைக்கப்படுவதை אִתּוֹ என்ற உடனிருப்புச் சொல் வலியுறுத்துகிறது.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களின் நடுவிலிருந்து
  rationale: உடன்படிக்கை மக்களுக்குள் இருந்து தேர்ந்தெடுக்கப்படுவதைத் தெளிவாகவும் இயல்பான தமிழிலும் தருகிறது; மூலத்தின் சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְכַהֲנוֹ לִי
  choice: எனக்கு ஆசாரியர்களாகப் பணிசெய்ய வேண்டும்
  rationale: כהן வினையின் ஆசாரியப் பணியையும் לִי என்பதன் ‘எனக்கு’ என்ற உறவையும் காக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்களான
  rationale: பெயரிடப்பட்ட நால்வரும் ஆரோனின் மகன்கள் என்பதைத் தெளிவாக அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற கூட்டு மக்களினப் பெயர்
  choice: இஸ்ரவேல் மக்களின் நடுவிலிருந்து
  alternative: இஸ்ரவேலின் மகன்களின் நடுவிலிருந்து
  rationale: எபிரேயத்தில் ‘இஸ்ரவேலின் மகன்கள்’ என்பது முழு உடன்படிக்கை மக்களையும் குறிக்கும் வழக்கமான கூட்டு அடையாளம். நவீனத் தமிழில் பாலின வரம்பு இருப்பதாகத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க அதன் பொருள் முதன்மை உரையில் தரப்பட்டு, மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமச் சூழலுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘ஆசாரியர்’ என்பது சமயப் பணியைத் தெளிவாகக் குறிக்கப் பயன்படுத்தப்பட்டுள்ளது. பெயர்ப்பட்டியலின் தொடர்பு தமிழில் தெளிவாக இருக்க இரண்டாவது வாக்கியமாக அமைக்கப்பட்டுள்ளது.
