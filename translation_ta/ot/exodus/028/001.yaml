revisions:
- from: “நீயோ, உன் சகோதரன் ஆரோனையும் அவனுடன் அவன் மகன்களையும் இஸ்ரவேல் மக்களின் நடுவிலிருந்து[a] உன்னருகே வரச்செய்; அவர்கள் எனக்கு ஆசாரியர்களாகப் பணிசெய்ய வேண்டும். அவர்கள் ஆரோனும், ஆரோனின் மகன்களான நாதாப், அபிகூ, எலெயாசார், இத்தாமார் ஆகியோரும் ஆவர்.”
  to: '“நீயோ, உன் சகோதரன் ஆரோனையும், அவனுடன் அவன் மகன்களையும், இஸ்ரவேல் மக்களின் நடுவிலிருந்து[a] உன்னருகே அழைத்து வா; அவர்கள் எனக்காக ஆசாரியப் பணியாற்றும்படி: ஆரோன், நாதாப், அபிகூ, எலெயாசார், இத்தாமார்—ஆரோனின் மகன்கள்.”'
  rationale: The revision retains the draft’s sound lexical choices while restoring the Hebrew appositional list and its scope. It also expresses the purpose of priestly service without turning it into an independent necessity statement. The existing footnote remains correctly anchored and accurately explains the corporate designation.
