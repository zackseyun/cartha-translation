base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: ta
  text: நீ நியாயத்தீர்ப்பின் மார்புப்பைக்குள்[b] ஊரீமையும் தும்மீமையும்[a] வைக்க வேண்டும். ஆரோன் யாவேவின் முன்னிலையில் நுழையும்போது, அவை அவனுடைய இருதயத்தின்மேல் இருக்கும். இஸ்ரவேலின் மகன்களின்[c] நியாயத்தீர்ப்பை ஆரோன் தன் இருதயத்தின்மேல் யாவேவின் முன்னிலையில் எப்போதும் சுமப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஊரீம்’, ‘தும்மீம்’ என்பவை ஆசாரியரின் நியாயத்தீர்ப்புடன் தொடர்புடைய புனிதப் பொருட்களின் எபிரெயப் பெயர்கள். அவற்றின் துல்லியமான வடிவமும் செயல்முறையும் உறுதியாகத் தெரியவில்லை. அவற்றின் சாத்தியமான சொற்பிறப்புப் பொருள்கள் முறையே ‘வெளிச்சங்கள்’, ‘நிறைவுகள்’ என்பவையாகும்.
    reason: lexical_alternative
  - marker: b
    text: ‘நியாயத்தீர்ப்புக்கான மார்புப்பை’ அல்லது ‘நீதியின் மார்புப்பை’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மִשְׁפָּט என்ற சொல் சூழலுக்கு ஏற்ப நியாயத்தீர்ப்பு, தீர்மானம், நீதி ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: ‘இஸ்ரவேலின் மகன்கள்’ என்பது எபிரெயச் சொல்லாட்சி; இங்கு அது இஸ்ரவேலின் உடன்படிக்கை மக்கள் முழுவதையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: நியாயத்தீர்ப்பின் மார்புப்பை
  rationale: חֹשֶׁן என்பது பிரதான ஆசாரியன் மார்பில் அணிந்த பைபோன்ற பொருளைக் குறிக்கிறது; மִשְׁפָּט என்பதன் ‘நியாயத்தீர்ப்பு’ என்ற பொருளையும், வசனத்தின் பின்னைய பயன்பாட்டுடனான சொல் தொடர்பையும் இவ்வடிவம் காக்கிறது.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: ஊரீமும் தும்மீமும்
  rationale: இவற்றின் துல்லியமான வடிவமும் செயல்முறையும் உறுதியாகத் தெரியாததால், ஊகமான சொற்பிறப்புப் பொருளை மொழிபெயர்ப்பாக அளிக்காமல் எபிரெயப் பெயர்கள் ஒலிபெயர்க்கப்பட்டன.
- source_word: אֶל
  choice: உள்ளே
  rationale: נָתַתָּ உடன் வரும் אֶל, மார்புப்பையில் பொருட்களை வைப்பதைக் குறிக்கும் இடநோக்குப் பொருளைக் கொண்டதால் ‘மார்புப்பைக்குள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: அவை ஆரோனுடைய இருதயத்தின்மேல் இருக்கும்
  rationale: மார்பில் அணிந்த பொருளின் உடல்சார்ந்த நிலையையும், ஆரோனின் பிரதிநிதித்துவப் பொறுப்பைக் குறிக்கும் உருவகத்தையும் ஒருங்கே காக்கிறது.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: ஆரோன் யாவேவின் முன்னிலையில் நுழையும்போது
  rationale: ஆசரிப்புக்கூடாரத்திற்குள் சென்று இறை முன்னிலையில் வருவதைக் குறிக்கும் நுழைவு நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְנָשָׂא
  choice: சுமந்துகொண்டு ... இருப்பான்
  rationale: נשא-வின் உடல்சார்ந்த ‘சுமத்தல்’ பொருளையும் ஆசாரியனின் பிரதிநிதித்துவப் பொறுப்பையும் காக்கிறது; תָּמִיד உடன் தமிழில் இயல்பாக அமைகிறது.
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களின் நியாயத்தீர்ப்பு
  rationale: மִשְׁפָּט என்பதைக் ‘நியாயத்தீர்ப்பு’ என்று மீண்டும் வழங்கி, முதல் தொடருடனான சொல் மீளுருவை காக்கிறது; ‘தீர்மானம்’ அல்லது ‘நீதி’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மொழியின் ஆண்பால் பன்மை வடிவத்தையும் உடன்படிக்கை மக்களுக்கான மரபுப் பெயரையும் தக்கவைக்கிறது; அதன் விரிவான குறிப்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: ஆசாரியப் பணியில் தொடர்ந்து நிலவும் கடமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ஒவ்வொரு கணமும் இடைவிடாத உடல் நடவடிக்கை என்ற அவசியமான பொருளைத் திணிக்கவில்லை.
theological_decisions:
- issue: אוּרִים மற்றும் תֻּמִּים என்பவற்றை பொருள்மொழிபெயர்ப்பதா அல்லது ஒலிபெயர்ப்பதா
  choice: ‘ஊரீம்’, ‘தும்மீம்’ என்று ஒலிபெயர்த்தல்
  alternative: ‘வெளிச்சங்கள்’, ‘நிறைவுகள்’ என்று சொற்பிறப்பு அடிப்படையில் மொழிபெயர்த்தல்
  rationale: அவற்றின் வடிவம், பயன்பாடு, சொற்பிறப்பு ஆகியவை உறுதியற்றவை. ஒலிபெயர்ப்பு விவாதத்திற்குரிய விளக்கத்தை உறுதியான இறையியல் கருத்தாக மாற்றுவதைத் தவிர்க்கிறது.
- issue: מִשְׁפָּט என்பதன் பொருள்
  choice: இரு இடங்களிலும் ‘நியாயத்தீர்ப்பு’
  alternative: ‘தீர்மானம்’ அல்லது ‘நீதி’
  rationale: இச்சொல் அதிகாரபூர்வமான தீர்மானத்தையும் நீதிசார் தீர்ப்பையும் உள்ளடக்கக்கூடும். ஒரே சொல்லை மீண்டும் பயன்படுத்துவது எபிரெய வசனத்தின் தொடர்பையும் அதன் உண்மையான பொருள் விரிவையும் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: ‘இஸ்ரவேலின் மகன்கள்’
  alternative: ‘இஸ்ரவேல் மக்கள்’ அல்லது ‘இஸ்ரவேலர்’
  rationale: எபிரெய ஆண்பால் வடிவமும் உடன்படிக்கை மக்களுக்கான மரபுச் சொல்லாட்சியும் பிரதான உரையில் காக்கப்படுகின்றன; இது முழு இஸ்ரவேல் சமூகத்தைக் குறிப்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: יְהוָה என்ற இறைப்பெயர்
  choice: ‘யாவே’ என்று ஒலிபெயர்த்தல்
  alternative: ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றுதல்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை வெளிப்படையாகக் காக்கிறது; அதை ஒரு பொதுப் பட்டமாக மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மதிப்புமிக்க நடையைப் பயன்படுத்துகிறது. ஆசாரிய உடையின் பைபோன்ற தன்மையையும் אֶל என்பதன் உள்ளிடும் பொருளையும் காட்ட ‘மார்புப்பை’ தேர்ந்தெடுக்கப்பட்டது. ‘இருதயத்தின்மேல்’ என்ற சற்று இலக்கியமான வடிவம் உடல்சார்ந்த மற்றும் பிரதிநிதித்துவ உருவகங்களை இரண்டையும் காக்கிறது. அடிக்குறிப்பு குறிகள் பிரதான உரையில் அனைத்தும் இடம்பெற்றுள்ளன.
