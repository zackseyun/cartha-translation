  text: 'and the second row: turquoise[a], sapphire, and diamond.'
translation:
  language: ta
  text: 'மேலும், இரண்டாவது வரிசையில்: டர்காய்ஸ் கல்[a], சபையர், வைரம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு குறிப்பிடப்படும் சில பண்டைய ரத்தினங்களின் துல்லியமான அடையாளம் உறுதியற்றது. נֹפֶךְ என்பது மரகதம் அல்லது கார்பங்கிளைக் குறிக்கலாம்; סַפִּיר என்பது லாபிஸ் லாசுலியைக் குறிக்கலாம்; יָהֲלֹם என்பது ஜாசிந்த் அல்லது யாஸ்பரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: வரிசையில்
  rationale: மார்ப்பதக்கத்தில் பதிக்கப்பட்ட கற்களின் அடுக்கை טוּר குறிக்கிறது. பட்டியலைத் தொடரும் எபிரெய இணைப்புச் சொல் தமிழில் இயல்பான பட்டியல் அமைப்பால் வெளிப்படுகிறது.
- source_word: הַ/שֵּׁנִי
  choice: இரண்டாவது
  rationale: ‘வரிசை’ என்பதைக் குறிக்கும் எளிய வரிசை எண்.
- source_word: נֹפֶךְ
  choice: மரகதப்பச்சைக் கல்
  rationale: இந்தப் பழங்கால இரத்தினக்கல்லின் துல்லியமான அடையாளம் உறுதியல்ல. பச்சை நிற இரத்தினத்தைக் குறிக்கும் புரிந்துகொள்ளத்தக்க தமிழ்ப் பெயர் முதன்மை உரையில் பயன்படுத்தப்பட்டு, மாற்றுப் பெயர்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: סַפִּיר
  choice: நீலக்கல்
  rationale: பாரம்பரியமாக ‘சபையர்’ என அடையாளப்படுத்தப்படும் கல்லுக்கு இயல்பான தமிழ்ப் பெயர். இது இன்றைய சபையராக இல்லாமல் லாபிஸ் லாசுலியாக இருக்கக்கூடும் என்பதால் அந்த ஐயம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְ/יָהֲלֹם
  choice: வயிரம்
  rationale: יָהֲלֹם என்பதற்கான பொதுவான பாரம்பரிய மொழிபெயர்ப்பு; கல்லின் துல்லிய அடையாளம் உறுதியல்ல என்பதால் பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
