  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான שֹׁהַם (ஷோஹாம்) எந்த வகை விலையுயர்ந்த கல்லைக் குறிக்கிறது என்பது உறுதியாகத் தெரியவில்லை. அது பாரம்பரியமாக ‘கோமேதகம்’ என மொழிபெயர்க்கப்படுகிறது; ‘சார்டோனிக்ஸ்’ அல்லது ‘பெரில்’ என்றும் சிலர் கருதுகின்றனர்.
