lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: நீ ... எடுத்து
  rationale: அறிவுறுத்தல் தொடரில் வரும் இணைப்புடன் கூடிய Qal வினைமுற்றின் கட்டளைப் பொருளை, அடுத்த வினையுடன் இயல்பான நவீனத் தமிழில் இணைக்கிறது.
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: இரண்டு கோமேதகக் கற்களை
  rationale: שֹׁהַם குறிக்கும் கனிமத்தின் துல்லிய அடையாளம் உறுதியற்றது. பாரம்பரியமாக அறியப்பட்ட ‘கோமேதகம்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּפִתַּחְתָּ
  choice: பொறிக்க வேண்டும்
  rationale: ரத்தினக் கற்களின்மேல் பெயர்களை வெட்டிப் பதிக்கும் செயலை ‘பொறி’ துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘வேண்டும்’ கட்டளை வலிமையை வெளிப்படுத்துகிறது.
- source_word: עֲלֵיהֶם
  choice: அவற்றின்மேல்
  rationale: பன்மையில் உள்ள இரண்டு கற்களையே சுட்டி, அவற்றின் மேற்பரப்பில் பொறிப்பதைத் தெளிவாகக் கூறுகிறது.
- source_word: שְׁמוֹת
  choice: பெயர்களை
  rationale: பொறிக்கப்பட வேண்டிய பொருளாக குறிப்பிட்ட பெயர்களை இயல்பான தமிழ் வேற்றுமை வடிவில் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுடைய
  rationale: இங்கு பொதுவாக இஸ்ரவேலரை அல்ல, கோத்திர முன்னோர்களான இஸ்ரவேலின் மகன்களையே குறிக்கிறது; ஆகவே மூலத்தின் உறவுப் பொருளும் பாலினக் குறிப்பும் காக்கப்படுகின்றன.
