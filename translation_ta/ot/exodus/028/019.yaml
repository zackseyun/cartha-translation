  language: ta
  text: 'மூன்றாவது வரிசையில்: ஜசிந்த் கல்[a], அகேட் கல்[b], மற்றும் அமெதிஸ்ட் கல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு வரும் எபிரெய இரத்தினப் பெயர்களின் துல்லியமான அடையாளம் உறுதியற்றது. “ஜசிந்த் கல்” என்பது לֶשֶׁם என்பதற்கான ஓர் அண்மித்த மொழிபெயர்ப்பு; இதை மரபாக “லிகூர்” என்றும் மொழிபெயர்த்துள்ளனர்.
    reason: lexical_alternative
  - marker: b
    text: שְׁבוֹ என்பது “ஓனிக்ஸ் கல்” என்றும் இருக்கலாம்; பழங்கால இரத்தினப் பெயர்கள் நவீன கனிமப் பெயர்களுடன் எப்போதும் துல்லியமாகப் பொருந்துவதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: மூன்றாவது வரிசையில்
  rationale: மார்ப்பதக்கத்தில் பதிக்கப்பட்ட கற்களின் தொடரை טוּר குறிக்கிறது; தமிழில் இயல்பாக அமைய, தொடர்ச்சியைக் குறிக்கும் וְ தனியாக மொழிபெயர்க்கப்படாமல் பட்டியல் அமைப்பில் உணர்த்தப்பட்டுள்ளது.
- source_word: הַשְּׁלִישִׁי
  choice: மூன்றாவது
  rationale: வரிசைகளின் எண்ணிக்கையில் மூன்றாவதைத் தெளிவாகக் குறிக்கும் வரிசை எண்.
- source_word: לֶשֶׁם
  choice: ஹயசிந்த் கல்
  rationale: இந்தப் பழங்கால இரத்தினப் பெயரின் துல்லியமான அடையாளம் உறுதியில்லை. ஒரு நவீன கனிமத்துடன் அளவுக்கு மீறி ஒப்பிடாமல், பரவலான அண்மித்த பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; ஐயம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: שְׁבוֹ
  choice: அகேட் கல்
  rationale: பாரம்பரியமாகவும் அகராதிசார் சாத்தியமாகவும் ‘அகேட்’ என அடையாளப்படுத்தப்படுகிறது; துல்லியமான கனிம அடையாளம் உறுதியில்லாததால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאַחְלָמָה
  choice: அமெதிஸ்ட் கல்
  rationale: אַחְלָמָה பொதுவாக அமெதிஸ்ட் என அடையாளப்படுத்தப்படுகிறது; தமிழில் தெளிவுக்காக ‘கல்’ சேர்க்கப்பட்டுள்ளது. முன்வரும் וְ பட்டியலின் இறுதி உறுப்பை இணைக்கிறது; தமிழின் காற்புள்ளிப் பட்டியல் அதனை இயல்பாக வெளிப்படுத்துகிறது.
