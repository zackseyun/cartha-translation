base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/016.yaml
  text: It shall be square and doubled[a], a span its length and a span its width.
translation:
  language: ta
  text: அது சதுரமாகவும் இரட்டையாகவும்[a] இருக்க வேண்டும்; அதன் நீளம் ஒரு சாணும், அகலம் ஒரு சாணுமாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மடித்து இரட்டையாக்கப்பட்டதாக.” மார்ப்பதக்கம் இரட்டையான அமைப்பில் செய்யப்பட்டதை எபிரெயச் சொல் குறிக்கிறது; அது மடிக்கப்பட்டதால் ஏற்பட்ட அமைப்பாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבוּעַ
  choice: சதுரமாக
  rationale: நான்கு சம பக்கங்களைக் கொண்ட வடிவத்தைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் குறிக்கிறது.
- source_word: יִהְיֶה
  choice: இருக்க வேண்டும்
  rationale: இங்கு வரும் எபிரெய நிறைவுறா வினை, பொருள் எவ்வாறு செய்யப்பட வேண்டும் என்ற கட்டளையுடனான விவரக்குறிப்பைக் காட்டுகிறது.
- source_word: כָּפוּל
  choice: இரட்டையாக
  rationale: பொருள் இரட்டையான அமைப்பில் செய்யப்பட்டிருப்பதைச் சுருக்கமாகத் தெரிவிக்கிறது; அது மடிக்கப்பட்டது என்பது சாத்தியமானாலும், அந்த விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: זֶרֶת
  choice: ஒரு சாண்
  rationale: விரித்த கையின் கட்டைவிரல் நுனியிலிருந்து சுண்டுவிரல் நுனிவரையிலான பழங்கால நீள அளவைக் குறிக்கும் வழக்கமான தமிழ் அளவுச்சொல்.
- source_word: אָרְכּוֹ
  choice: அதன் நீளம்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு இங்கு விவரிக்கப்படும் மார்ப்பதக்கத்தைக் குறிக்கிறது; அளவீட்டுச் சூத்திரத்தில் இது இயல்பான தமிழ் நடை.
- source_word: וְזֶרֶת
  choice: ஒரு சாணும்
  rationale: இணைப்பிடைச்சொல்லின் பொருளைத் தமிழின் இணை அளவீட்டு அமைப்பான ‘நீளம் ஒரு சாணும், அகலம் ஒரு சாணுமாக’ என்பதில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רָחְבּוֹ
  choice: அகலம்
  rationale: நீளத்துக்கு எதிரான பரிமாணத்தை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
