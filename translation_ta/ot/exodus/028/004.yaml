  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: ta
  text: 'அவர்கள் செய்ய வேண்டிய ஆடைகள் இவையே: மார்பணி[a], ஏபோத்[b], மேலங்கி, வேலைப்பாடுடன் நெய்த அங்கி[c], தலைப்பாகை, இடைக்கச்சை. உன் சகோதரனாகிய ஆரோனுக்கும் அவன் மகன்களுக்கும், அவன் எனக்கு ஆசாரியனாகப் பணியாற்றும்படி, அவர்கள் பரிசுத்த ஆடைகளை[d] செய்ய வேண்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மார்புப்பதக்கம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஆசாரியர் மார்பில் அணிந்த பொருளைக் குறிக்கிறது; அது போர்க்கவசம் அல்ல.
    reason: lexical_alternative
  - marker: b
    text: ‘ஏபோத்’ என்பது துல்லியமான தமிழ் இணைச்சொல் இல்லாத, ஆசாரியருக்குரிய தனித்துவமான ஓர் ஆடையின் எபிரெயப் பெயர்.
    reason: cultural_note
  - marker: c
    text: எபிரெயச் சொற்றொடர் கட்டவடிவம் அல்லது வேறு நெய்த வேலைப்பாடுள்ள அங்கியைக் குறிக்கலாம்; அதன் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: d
    text: ‘புனித ஆடைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் கடவுளுக்கென ஒதுக்கப்பட்ட ஆடைகளைக் குறிக்கிறது. வசனத்தின் இறுதியில் உள்ள எபிரெய வடிவம் சொற்பட ஒருமையில், ‘அவன் எனக்கு ஆசாரியனாகப் பணியாற்றும்படி’ என்று உள்ளது.
    reason: textual_ambiguity
lexical_decisions:
- source_word: בְּגָדִים
  choice: ஆடைகள்
  rationale: ஆசாரிய உடைகளைக் குறிக்கும் இயல்பான, பொதுவாகப் புரியக்கூடிய தமிழ் சொல்.
- source_word: יַעֲשׂוּ
  choice: செய்ய வேண்டும்
  rationale: இந்தச் சூழலில் எபிரெய வினைமுற்றின் கட்டளை சார்ந்த எதிர்காலப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: חֹשֶׁן
  choice: மார்பணி
  rationale: இது போர்க்கவசம் அல்ல, ஆசாரியர் மார்பில் அணியும் தனிப்பட்ட பொருள்; ஆகவே கவசப் பொருளைத் தவிர்த்து, அதன் சரியான வடிவம் குறித்த உறுதியின்மையையும் அளவுக்கு மீறித் தீர்மானிக்காத சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֵפוֹד
  choice: ஏபோத்
  rationale: இதற்கு துல்லியமான தமிழ் இணைச்சொல் இல்லாததால், ஆசாரியருக்குரிய தனித்துவமான ஆடையின் பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: מְעִיל
  choice: மேலங்கி
  rationale: ஆசாரிய உடையின் வெளிப்புற அங்கியைக் குறிக்கும் இயல்பான நவீன தமிழ் சொல்.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: வேலைப்பாடுடன் நெய்த அங்கி
  rationale: תַּשְׁבֵּץ என்பது நெய்த வடிவம் அல்லது கட்டவடிவ வேலைப்பாட்டைக் குறிக்கலாம்; குறிப்பிட்ட கட்ட வடிவமே என்று உறுதிசெய்யாமல் கைவினைத் தன்மையைத் தெரிவிக்கிறது.
- source_word: מִצְנֶפֶת
  choice: தலைப்பாகை
  rationale: ஆசாரியர் தலையில் சுற்றி அணியும் ஆடைக்கான தெளிவான தமிழ் இணை.
- source_word: אַבְנֵט
  choice: இடைக்கச்சை
  rationale: இடுப்பைச் சுற்றி அணியும் துணிப்பட்டையைச் சடங்கு உடைச் சூழலுக்கு ஏற்றவாறு குறிக்கிறது.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: பரிசுத்த ஆடைகள்
  rationale: קֹדֶשׁ என்பதன் தூய்மை மற்றும் கடவுளுக்கென ஒதுக்கப்பட்ட தன்மை ஆகிய இரண்டையும் ஆசாரியச் சூழலில் காக்கிறது.
- source_word: לְאַהֲרֹן אָחִיךָ וּלְבָנָיו
  choice: உன் சகோதரன் ஆரோனும் அவனுடைய மகன்களும் ... அவர்களுக்கு
  rationale: மோசேயுடன் ஆரோனுக்குள்ள உறவையும், בָּנִים என்பதன் ஆண்பால் குறிப்பையும் துல்லியமாகக் காக்கிறது.
- source_word: לְכַהֲנוֹ לִי
  choice: எனக்கு ஆசாரியர்களாகப் பணியாற்றுவதற்காக
  rationale: ஆசாரியப் பணியின் நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; சூழலில் ஆரோனும் அவன் மகன்களும் குறிப்பிடப்படுவதால் தமிழ் இலக்கணத்தில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ஆசாரிய உடைச் சொற்களைப் பிற்கால சமய மரபுகளின் தனிச்சொற்களால் விளக்காமல் மொழிபெயர்த்தல்
  choice: பொதுவாகப் புரியும் ‘மார்பணி’, ‘மேலங்கி’, ‘அங்கி’, ‘தலைப்பாகை’, ‘இடைக்கச்சை’ ஆகிய சொற்களைப் பயன்படுத்தி, துல்லியமான இணை இல்லாத ‘ஏபோத்’ என்பதை ஒலிபெயர்த்தல்
  alternative: எல்லா பொருட்களுக்கும் பாரம்பரிய அல்லது விளக்கவுரை சார்ந்த பெயர்களைப் பயன்படுத்துதல்
  rationale: திருக்கூடார ஆசாரிய உடைகளின் தனித்தன்மை காக்கப்படுகிறது; அதேவேளையில் பிற்கால திருச்சபை உடைமரபுகள் உரைக்குள் இறக்குமதி செய்யப்படவில்லை.
- issue: ஆரோனுடைய மகன்களின் பாலினக் குறிப்பு
  choice: ‘அவனுடைய மகன்கள்’
  alternative: ‘அவனுடைய பிள்ளைகள்’ அல்லது ‘சந்ததியினர்’
  rationale: எபிரெய உரை ஆண் மக்களைத் தெளிவாகக் குறிப்பிடுகிறது; ஆசாரியப் பணியின் இச்சூழலில் அந்தக் குறிப்பை நடுநிலைப்படுத்தாமல் காக்க வேண்டும்.
- issue: לְכַהֲנוֹ என்பதிலுள்ள ஒருமை வடிவமும் ஆரோன் மற்றும் அவன் மகன்கள் என்ற பன்மைச் சூழலும்
  choice: இலக்கு மொழியின் இயல்புக்காக ‘ஆசாரியர்களாகப் பணியாற்றுவதற்காக’ என்று பன்மையில் மொழிபெயர்த்தல்
  alternative: ‘அவன் எனக்கு ஆசாரியனாகப் பணியாற்றுவதற்காக’ என்று எபிரெய இலக்கண ஒருமையை நேரடியாகக் காத்தல்
  rationale: உடைகள் ஆரோனுக்கும் அவன் மகன்களுக்கும் செய்யப்படுகின்றன; ஆசாரியப் பணி அனைவருக்கும் பொருந்துகிறது. இருப்பினும் மூலத்தின் ஒருமை வடிவம் அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகருக்கு எளிதாகவும் வழிபாட்டு உரைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. தொழில்நுட்பமான ‘ஏபோத்’ மட்டும் ஒலிபெயர்க்கப்பட்டு விளக்கப்பட்டுள்ளது. எபிரெய இறுதிப்பகுதியின் ஒருமை–பன்மை பதற்றம் அடிக்குறிப்பில் மறைக்காமல் பதிவு செய்யப்பட்டுள்ளது.
