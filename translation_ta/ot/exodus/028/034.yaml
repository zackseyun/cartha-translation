  source_fidelity: மூல எபிரெயத்தின் மீளும் வரிசையான “தங்க மணி மற்றும் மாதுளம்பழம்” இருமுறையும் பாதுகாக்கப்பட்டுள்ளது. அங்கியின் கீழ் ஓரத்தை முழுவதும் சுற்றிய அமைவிடத்தை “அங்கியின் கீழ் ஓரத்தைச் சுற்றிலும்” சரியாக வெளிப்படுத்துகிறது. தனி வசனத்தில் மறைந்திருக்கும் கட்டளைச் சூழலைத் தமிழில் முழுமையாக்கும் “இருக்க வேண்டும்” பொருளை மாற்றவில்லை.
  naturalness: நவீனத் தரத் தமிழில் வாசிப்பு இயல்பாகவும் கண்ணியமாகவும் உள்ளது. “அங்கி,” “கீழ் ஓரம்,” மற்றும் “சுற்றிலும்” ஆகியவை உடைச் சூழலுக்கு ஏற்ற தெளிவான சொற்கள்.
