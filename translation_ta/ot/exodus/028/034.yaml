translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தின் இருமுறை வரும் ‘தங்க மணியும் மாதுளம்பழமும்’ என்ற வரிசை பாதுகாக்கப்பட்டுள்ளது. தனி வசனமாகத் தமிழில் நிறைவாக வாசிக்க ‘இருக்க வேண்டும்’ சேர்க்கப்பட்டுள்ளது; இது சுற்றியுள்ள கட்டளைச் சூழலால் விளங்கும் வினையை வெளிப்படுத்துகிறது.
