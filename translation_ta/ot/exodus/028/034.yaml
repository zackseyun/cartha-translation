  text: a gold bell and a pomegranate[a], a gold bell and a pomegranate[b], around the hem of the robe all around.
translation:
  language: ta
  text: தங்க மணியும் மாதுளம்பழமும்[a], தங்க மணியும் மாதுளம்பழமும் என அங்கியின் கீழ் ஓரத்தைச் சுற்றிலும்[b] இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘மாதுளம்பழம்’ என்பது மணிகளுக்கு இடையில் பொருத்தப்பட்ட மாதுளம்பழ வடிவ அலங்காரத்தைக் குறிக்கக்கூடும்.
    reason: cultural_note
  - marker: b
    text: வேறு வகையில், ‘அங்கியின் கீழ் ஓரத்தின் மேல், சுற்றிலும்’ என மொழிபெயர்க்கலாம். எபிரெய மொழியில் ‘மேல்’ என்ற முன்னிடைச்சொல்லும் ‘சுற்றிலும்’ என்ற வினையடையும் இணைந்துள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: மணி
  rationale: ஆசாரியரின் ஆடையில் பொருத்தப்பட்ட சிறிய மணியைக் குறிக்கிறது; நவீன தமிழில் இயல்பான, தெளிவான இணைச்சொல்.
- source_word: זָהָב
  choice: தங்க
  rationale: மணி செய்யப்பட்ட பொருளை நேரடியாகக் குறிக்கும் இயல்பான தமிழ்ப் பெயரடை வடிவம்.
- source_word: רִמּוֹן
  choice: மாதுளம்பழம்
  rationale: எபிரெயச் சொல்லின் வழக்கமான பொருளை முதன்மை உரையில் அப்படியே வைத்திருக்கிறது; இங்கு அது பழ வடிவிலான அலங்காரத்தைக் குறிக்கலாம் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: עַל
  choice: சுற்றிலும்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், שׁוּלֵי மற்றும் סָבִיב ஆகியவற்றுடன் சேர்ந்து அங்கியின் கீழ் ஓரத்தைச் சுற்றிய அமைவிடத்தைக் குறிக்கிறது.
- source_word: שׁוּלֵי
  choice: கீழ் ஓரம்
  rationale: ஆடையின் அடிப்பகுதியிலுள்ள ஓரத்தைக் குறிக்கிறது; ‘விளிம்பு’ என்பதைக் காட்டிலும் ஆடைச் சூழலில் ‘கீழ் ஓரம்’ தெளிவானது.
- source_word: מְעִיל
  choice: அங்கி
  rationale: ஆசாரிய உடையின் ஒரு குறிப்பிட்ட மேலாடையைக் குறிக்கும் மரியாதையான, பரவலாகப் புரிந்துகொள்ளக்கூடிய சொல்.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: அமைப்பு முழு ஓரத்தையும் சுற்றி இருந்ததை வலியுறுத்துகிறது.
