  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: ta
  text: அவர்கள் பொன்[a], நீலநூல், ஊதாநூல், செந்நிறநூல், நுண்ணிய முறுக்கப்பட்ட ஆளிநூல் ஆகியவற்றால் ஏபோத்தைத் திறமைமிக்க வடிவமைப்பாளரின் வேலைப்பாடாகச் செய்ய வேண்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொன்நூல்”; எபிரெய உரை “பொன்” என்று மட்டுமே கூறுகிறது. இங்கு அது துணியில் இணைத்து நெய்யப்பட்ட பொன்னைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வடிவமைப்பாளரின் வேலைப்பாடாக” அல்லது “திறமைமிக்க கைவினைஞரின் வேலைப்பாடாக”; எபிரெயத் தொடர் கலைநயமுள்ள, வடிவமைக்கப்பட்ட வேலைப்பாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: அவர்கள் ... செய்ய வேண்டும்
  rationale: அறிவுறுத்தல் தொடரில் வரும் வினை வடிவம் கட்டளையைக் குறிக்கிறது; நவீன தமிழில் இயல்பான கட்டளைநடையாக மொழிபெயர்க்கப்பட்டது.
- source_word: הָאֵפֹד
  choice: ஏபோத்தை
  rationale: துல்லியமான தமிழ் இணைச்சொல் இல்லாத ஆசாரிய உடைக்குரிய தொழில்நுட்பப் பெயர் என்பதால் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: זָהָב
  choice: பொன்
  rationale: எபிரெய உரை ‘பொன்’ என்று மட்டுமே கூறுகிறது; நூல் என்பது சூழலால் ஊகிக்கப்படுவதால் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: תְּכֵלֶת וְאַרְגָּמָן תּוֹלַעַת שָׁנִי
  choice: நீலநூல், ஊதாநூல், செந்நிறநூல்
  rationale: துணி நெய்யும் சூழலைத் தமிழில் தெளிவாக்க நிறப்பொருட்கள் நூல்களாக இயல்பாக வழங்கப்பட்டன.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: முறுக்கப்பட்ட மெல்லிய சணல்நூல்
  rationale: שֵׁשׁ என்பதன் மெல்லிய சணல் பொருளையும் מָשְׁזָר என்பதன் முறுக்கப்பட்ட தன்மையையும் காக்கிறது.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: திறமைமிக்க வடிவமைப்பாளரின் கைவினையாக
  rationale: திட்டமிட்ட கலைநயமுள்ள வேலைப்பாட்டைக் குறிக்கிறது; ‘பூவேலை’ எனக் குறுக்கிப் பொருள் கொள்ளாமல் பொதுவான கைவினை மற்றும் வடிவமைப்பு கருத்துகள் காக்கப்பட்டன.
