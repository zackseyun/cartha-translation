base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: ta
  text: ஆரோன் ஊழியம் செய்யும்போது அது அவன் மேல் இருக்க வேண்டும். அவன் யாவேயின் முன்னிலையில் பரிசுத்த இடத்திற்குள் செல்லும்போதும் வெளியே வரும்போதும் அதன் ஒலி கேட்கப்பட வேண்டும்; அப்பொழுது அவன் இறக்கமாட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: அது அவன்மேல் இருக்க வேண்டும்
  rationale: அறிவுறுத்தல் சூழலில் உள்ள எபிரெய வினைவடிவின் கட்டளைசார் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ‘அது’ என்பது முன்பு விவரிக்கப்பட்ட மேலங்கியைக் குறிக்கிறது.
- source_word: לְשָׁרֵת
  choice: திருப்பணி செய்யும்போது
  rationale: לְ உடன் வரும் infinitive இங்கு நோக்கத்தையோ நிகழும் சூழலையோ குறிக்கலாம். ஆசாரியப் பணியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘திருப்பணி செய்யும்போது’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: அதன் ஒலி கேட்க வேண்டும்
  rationale: சொல்லுக்குச் சொல் அமைப்பையும் கட்டளைசார் வலியுறுத்தலையும் காக்கிறது. பின்னொட்டு இலக்கணப்படி ‘அவனுடைய’ என்றும் கொள்ளப்படலாம்; ஆனால் உடனடியான சூழலில் மேலங்கியின் மணியொலியே இயல்பான குறிப்பு.
- source_word: בְּבֹאוֹ ... וּבְצֵאתוֹ
  choice: செல்லும்போதும் வெளியே வரும்போதும்
  rationale: இணையான இரண்டு காலவுணர்வு infinitive வடிவங்களையும் சுருக்கமான, இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: אֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்திற்குள்
  rationale: கூடாரத்தின் புனிதப் பகுதியைக் குறிக்கும் הַקֹּדֶשׁ என்பதன் குறிப்பிட்ட வழிபாட்டுப் பொருளைத் தக்கவைக்கிறது; אֶל உடன் இயக்கம் இருப்பதால் ‘இடத்திற்குள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் திருமுன்
  rationale: தெய்வீக நாமத்தை ‘யாவே’ என்று ஒலிபெயர்த்து, לִפְנֵי என்பதன் சமூக-வழிபாட்டு ‘முன்னிலையில்’ என்ற பொருளை dignified Tamil-இல் ‘திருமுன்’ எனத் தருகிறது.
- source_word: וְלֹא יָמוּת
  choice: அப்போது அவன் சாகமாட்டான்
  rationale: எபிரெய இணைப்புச் சொல்லின் விளைவு/தடுப்பு உறவை இயல்பாகக் காட்டுகிறது; நோக்கப் பொருளான ‘அவன் சாகாதபடிக்கு’ என்பது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: கேட்கப்படும் ஒலி எதைக் குறிக்கிறது?
  choice: மேலங்கியில் பொருத்தப்பட்ட மணிகளின் ஒலி
  alternative: ஆரோனுடைய ஒலி அல்லது அவரது அசைவால் பொதுவாக எழும் ஒலி
  rationale: முந்தைய வசனங்கள் மேலங்கியின் கீழ் ஓரத்திலுள்ள மணிகளை விவரிப்பதால், ‘அதன் ஒலி’ என்பது அவற்றையே மிக இயல்பாகக் குறிக்கிறது. இருப்பினும் எபிரெய ஆண்பால் பின்னொட்டின் இலக்கணத் திறப்பை அடிக்குறிப்பு சுட்டுகிறது.
- issue: וְלֹא יָמוּת என்பதன் தொடர்பு
  choice: 'வழிமுறையைப் பின்பற்றுவதன் விளைவு: ‘அப்போது அவன் சாகமாட்டான்’'
  alternative: 'எச்சரிக்கை/நோக்கம்: ‘அவன் சாகாதபடிக்கு’ அல்லது ‘இல்லையெனில் அவன் சாவான்’'
  rationale: וְ + மறுப்பு imperfect வடிவம் நேரடியாக ‘அவன் சாகமாட்டான்’ எனப் படலாம்; சடங்குச் சட்டச் சூழல் நோக்கம் அல்லது அபாயத் தடுப்பு நுணுக்கத்தையும் அனுமதிக்கிறது. முதன்மை உரை நேரடி விளைவைக் கொடுத்து, மாற்றை அடிக்குறிப்பில் வைக்கிறது.
- issue: יהוה என்ற தெய்வீக நாமம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையிலுள்ள தனிப்பெயரை பட்டப்பெயராக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட நவீன ஒலிப்புக்கு அருகில் தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘திருப்பணி’, ‘பரிசுத்த இடம்’, ‘திருமுன்’ ஆகியவை ஆசாரிய மற்றும் கூடாரச் சூழலைத் தெளிவாக்குகின்றன; அதிகமாகப் பழமையான வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன.
