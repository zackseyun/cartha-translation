  source_fidelity: 'முதன்மை உரை எபிரெயத்தின் வாக்கிய அமைப்பையும் முக்கியக் கூறுகளையும் பெரும்பாலும் சரியாகத் தருகிறது: மேலங்கி ஆரோன்மேல் இருக்க வேண்டும்; உள்ளே செல்லும்போதும் வெளியே வரும்போதும் ஒலி கேட்கப்பட வேண்டும்; அவன் இறக்கக்கூடாது. ஆனால் “திருமுன் பரிசுத்த இடத்திற்குள்” என்ற சொற்றொடர் நவீன உரைநடையில் இயல்பாக இல்லை; לִפְנֵי יְהוָה என்பதன் ‘யாவேயின் முன்னிலையில்’ என்ற உறவைத் தெளிவாகச் சொல்ல வேண்டும். இறுதி வினைச்சொல்லுக்கு ‘இறக்கமாட்டான்’ என்பது பதிவிற்கு ஏற்றது.'
