- from: “தூய தங்கத்தால் ஒரு பட்டத்தைச் செய். முத்திரையில் பொறிப்பதுபோல் அதன்மேல், ‘யாவேக்குப் பரிசுத்தமானது’[a] என்று பொறி.”
  to: “தூய தங்கத்தால் ஒரு தகட்டைச் செய். முத்திரைப் பொறிப்புகளைப்போல் அதன்மேல், ‘யாவேக்குப் பரிசுத்தமானது’[a] என்று பொறி.”
  rationale: The metal ornament is revised to “தகடு” for accurate and natural reference to a plate of gold. The comparison is revised to “முத்திரைப் பொறிப்புகளைப்போல்” to reflect the source expression more closely. The divine name and the primary inscription rendering are retained, and the legitimate nominal alternative remains anchored in the footnote.
