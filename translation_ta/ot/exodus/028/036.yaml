reference: Exodus 28:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ צִּ֖יץ זָהָ֣ב טָה֑וֹר וּ/פִתַּחְתָּ֤ עָלָי/ו֙ פִּתּוּחֵ֣י חֹתָ֔ם קֹ֖דֶשׁ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: ta
  text: “தூய தங்கத்தால் ஒரு தகட்டைச் செய். முத்திரைப் பொறிப்புகளைப்போல் அதன்மேல், ‘யாவேக்குப் பரிசுத்தமானது’[a] என்று பொறி.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்குப் பரிசுத்தம்.”
    reason: קֹדֶשׁ என்ற எபிரெயச் சொல் இங்கு பண்புப்பொருளிலோ பெயர்ச்சொற்பொருளிலோ எடுத்துக்கொள்ளப்படலாம்.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்
  rationale: தொடர்ச்சியாக வழங்கப்படும் கைவினைப் பணிக்கான கட்டளையை நவீன தமிழில் இயல்பான ஒருமை ஏவல் வடிவில் தருகிறது.
- source_word: צִּיץ
  choice: பட்டை
  rationale: வேறு சூழல்களில் இச்சொல் மலர் அல்லது பூவைக் குறிக்கலாம்; இங்கு தலைமீது அணியப்படும் தங்க ஆபரணத்தின் தகடு போன்ற வடிவத்தைக் குறிக்க ‘பட்டை’ தெளிவாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கத்தால்
  rationale: பொருளின் மூலப்பொருளையும் அதன் தூய்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: அதன்மேல் ... பொறி
  rationale: உலோகத்தின் மேல் எழுத்துகளை வெட்டிப் பதிக்கும் செயலை ‘பொறி’ துல்லியமாகக் குறிக்கிறது.
- source_word: פִּתּוּחֵי חֹתָם
  choice: முத்திரையில் பொறிப்பதுபோல்
  rationale: முத்திரை அல்லது கணையாழியில் செய்யப்படும் நுணுக்கமான பொறிப்பின் முறையைச் சுட்டும் எபிரெயச் சொற்றொடரை இயல்பாகத் தருகிறது; மூலத்தின் பன்மை வடிவத்தைத் தமிழில் செயன்முறை சார்ந்த ஒருமைப் பொதுப்படையாக மொழிபெயர்க்கிறது.
- source_word: קֹדֶשׁ לַיהוָה
  choice: யாவேக்குப் பரிசுத்தமானது
  rationale: சுருக்கமான அர்ப்பணிப்பு வாசகத்தின் பண்புப்பொருளையும் ‘யாவேக்கென ஒதுக்கப்பட்டது’ என்ற திசையையும் அதிக விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், பொதுப் பட்டத்தைப் பதிலிடாமல் அந்தப் பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: קֹדֶשׁ לַיהוָה என்ற வாசகத்தின் இலக்கணப் பொருள்
  choice: யாவேக்குப் பரிசுத்தமானது
  alternative: யாவேக்குப் பரிசுத்தம்
  rationale: קֹדֶשׁ என்பது இங்கு ‘பரிசுத்தமானது’ என்ற பண்புப்பொருளாகவோ ‘பரிசுத்தம்’ என்ற பெயர்ச்சொற்பொருளாகவோ புரிந்துகொள்ளப்படலாம். முதன்மை உரை அர்ப்பணிக்கப்பட்ட பொருளைக் குறிக்கும் வாசிப்பைத் தருகிறது; பெயர்ச்சொல் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மோசேயை நோக்கிய ஒருமை ஏவல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. பொறிக்கப்படும் வாசகத்தின் கல்வெட்டு போன்ற சுருக்கம் காக்கப்பட்டுள்ளது; ‘பரிசுத்தம்’ என்ற வேதாகமச் சூழலில் பரவலாகப் புரியப்படும் மரியாதைமிக்க சொல் பயன்படுத்தப்பட்டுள்ளது.
