  revision_rationale: The metal ornament is revised to “தகடு” for accurate and natural reference to a plate of gold. The comparison is revised to “முத்திரைப் பொறிப்புகளைப்போல்” to reflect the source expression more closely. The divine name and the primary inscription rendering are retained, and the legitimate nominal alternative remains anchored in the footnote.
