base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/039.yaml
  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: ta
  text: மெல்லிய நார்ப்பட்டால் கட்ட வடிவ நெசவுடன் உள்ளங்கியை நெய்ய வேண்டும்[a]. மெல்லிய நார்ப்பட்டால் தலைப்பாகையையும் செய்ய வேண்டும். இடைக்கச்சையை அலங்காரத் தையல் வேலை செய்பவரின் வேலைப்பாடாகச் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மெல்லிய நார்ப்பட்டால் கட்ட வடிவமுள்ள உள்ளங்கியைச் செய்ய வேண்டும்.’ எபிரேய வினை வடிவமைப்புள்ள துணியை உருவாக்குவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּצְתָּ
  choice: கட்டவேலைப்பாட்டில் ... நெய்ய வேண்டும்
  rationale: எபிரேய வினை இச்சூழலில் கட்டங்கள் போன்ற வடிவமைப்புடன் துணியை உருவாக்குவதைக் குறிக்கிறது; ‘நெய்ய வேண்டும்’ என்பது துணி உருவாக்கும் செயலை இயல்பாக வெளிப்படுத்துகிறது, ‘கட்டவேலைப்பாட்டில்’ என்பது அதன் சாத்தியமான வடிவத்தைக் காக்கிறது.
- source_word: הַכְּתֹנֶת
  choice: உள்ளங்கி
  rationale: இது ஆசாரிய உடையில் உடலுக்கு அணுக்கமாக அணியும் நீளமான அடிப்படை ஆடையைக் குறிக்கிறது; நவீனத் தமிழில் ‘உள்ளங்கி’ அதன் பயன்பாட்டைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: שֵׁשׁ
  choice: மெல்லிய நார்ப்பட்டு
  rationale: கூடார மற்றும் ஆசாரிய ஆடைச் சூழலில் உயர்தரமான மெல்லிய linen துணியைக் குறிக்கிறது; ‘நார்ப்பட்டு’ தமிழ் வேதாகம நடையில் அறியப்பட்ட பொருட்பெயராகவும் ‘மெல்லிய’ அதன் தரத்தையும் வெளிப்படுத்துகிறது.
- source_word: מִצְנֶפֶת
  choice: தலைப்பாகை
  rationale: தலையைச் சுற்றிக் கட்டப்படும் ஆசாரியத் தலை ஆடையை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: אַבְנֵט
  choice: இடைக்கச்சை
  rationale: இது இடுப்பைச் சுற்றிக் கட்டப்படும் நீண்ட அலங்காரத் துணி; ‘இடைக்கச்சை’ என்பது ‘இடுப்புப்பட்டை’ என்பதைவிட துணியால் ஆன ஆடையணி என்ற தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: பூவேலை செய்பவரின் வேலைப்பாடாக
  rationale: எபிரேயக் கட்டமைப்பிலுள்ள கைவினைஞர் மையப்படுத்தப்பட்ட சொல்லாக்கத்தைப் பேணுகிறது; ‘பூவேலை’ அலங்கார நூல்வேலையை இயல்பாகக் குறிக்கிறது.
