  yaml_path: translation/ot/exodus/028/010.yaml
  text: six of their names on the one stone[a], and the names of the remaining six on the second stone, according to their birth order.
translation:
  language: ta
  text: அவர்களுடைய பெயர்களில் ஆறு பெயர்களை ஒரு கல்லிலும், மீதமுள்ள ஆறு பெயர்களை இரண்டாவது கல்லிலும், அவர்கள் பிறந்த வரிசைப்படி[a] பொறிக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய வம்சவரிசைப்படி.” எபிரெயச் சொல் வம்சத் தோற்றத்தையோ, அதிலிருந்து அமையும் பிறப்பு வரிசையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: அவர்களுடைய பெயர்களில் ஆறு பெயர்களை
  rationale: מן பகுதியைக் குறிக்கும் பயன்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மொத்தப் பெயர்களிலிருந்து ஆறு என்பதைக் காக்கிறது.
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: ஒரு கல்லிலும்
  rationale: האחת என்பதன் ‘ஒரு’ என்ற நேரடிப் பொருளையும், அடுத்து வரும் ‘இரண்டாவது கல்’ என்பதுடனான எதிரிணையையும் காக்கிறது.
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: மீதமுள்ள ஆறு பெயர்களை
  rationale: נותרים என்பதன் எஞ்சிய அல்லது மீதமுள்ள என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: இரண்டாவது கல்லிலும்
  rationale: השנית என்பது தெளிவான வரிசை எண்ணாக இருப்பதால் ‘இரண்டாவது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: כְּתוֹלְדֹתָם
  choice: அவர்கள் பிறந்த வரிசைப்படி
  rationale: இந்தச் சூழலில் பெயர்களை அமைக்கும் முறையைக் குறிக்கும் இயல்பான பொருள் இது; அதேவேளையில் மூலச்சொல்லின் வம்சவழி/தலைமுறை நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כתיבה implied by context
  choice: பொறிக்க வேண்டும்
  rationale: இது முந்தைய வசனத்தின் ‘பொறிக்க வேண்டும்’ என்ற கட்டளையைத் தொடரும் துணைவாக்கியம்; தமிழில் முழுமையான, தெளிவான வாக்கியமாக்க அந்தச் செயற்பாடு வெளிப்படையாகச் சேர்க்கப்பட்டது.
theological_decisions:
- issue: כְּתוֹלְדֹתָם என்பதன் பொருள் வரம்பு
  choice: அவர்கள் பிறந்த வரிசைப்படி
  alternative: அவர்களுடைய தலைமுறைகளின்படி / வம்சவரிசைப்படி
  rationale: இஸ்ரவேலின் மகன்களுடைய பெயர்கள் இரு கற்களில் பகுக்கப்படும் உடனடிச் சூழலில் பிறப்பு வரிசை மிக இயல்பான குறிப்பு. எனினும் תולדות வம்சத் தோற்றம் அல்லது தலைமுறைத் தொடரையும் குறிக்கக்கூடியதால் அந்த நுணுக்கம் அடிக்குறிப்பில் விடப்பட்டுள்ளது; எந்தத் தனிப்பட்ட கோட்பாட்டு விளக்கமும் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிய வாசிப்புத் தன்மையும் கொண்ட நடை. ‘பெயர்களில் ஆறு பெயர்களை’ என்பது பகுதியைக் குறிக்கும் எபிரெய அமைப்பை இயல்பாகக் காட்டுகிறது. வசனம் முந்தைய கட்டளையின் தொடராக இருப்பதால் ‘பொறிக்க வேண்டும்’ சேர்க்கப்பட்டுள்ளது.
