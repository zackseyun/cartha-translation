  edition: WLC
  text: וְ/עָשִׂ֣יתָ עַל שׁוּלָ֗י/ו רִמֹּנֵי֙ תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת שָׁנִ֔י עַל שׁוּלָ֖י/ו סָבִ֑יב וּ/פַעֲמֹנֵ֥י זָהָ֛ב בְּ/תוֹכָ֖/ם סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: ta
  text: அதன் கீழ் ஓரத்தைச் சுற்றிலும் நீலநிற, ஊதாநிற, செந்நிற நூல்களால் செய்யப்பட்ட மாதுளம்பழங்களை[a] அமைக்க வேண்டும்; அவற்றின் நடுவே, அந்த ஓரத்தைச் சுற்றிலும், பொன் மணிகளையும் அமைக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மாதுளம்பழ வடிவிலான அலங்காரங்கள்.’ எபிரெய மொழியில் சொல்லுக்குச் சொல் ‘மாதுளம்பழங்கள்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: அமைக்க வேண்டும்
  rationale: அறிவுறுத்தல் சூழலில் கட்டளையை வெளிப்படுத்தும் வினை வடிவம்; தமிழில் இயல்பான, மரியாதைமிக்க கட்டளை நடையாக உள்ளது.
- source_word: שׁוּלָיו
  choice: அதன் கீழ் ஓரம்
  rationale: அங்கியின் கீழ்ப்புற விளிம்பைக் குறிக்கிறது; 'கீழ் ஓரம்' என்பது சாதாரண வாசகருக்குத் தெளிவான ஆடைச்சொல்.
- source_word: רִמֹּנֵי
  choice: மாதுளம்பழங்கள்
  rationale: எபிரெயச் சொல் நேரடியாக 'மாதுளம்பழங்கள்' என்கிறது; அலங்கார வடிவங்கள் என்ற சூழல்சார் பொருளை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல் அடிக்குறிப்பில் தருகிறது.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: நீலநிற, ஊதாநிற, செந்நிற நூல்கள்
  rationale: இவை திருக்கூடாரத் துணிகளில் பயன்படும் சாயமிட்ட நூல்/பொருள் நிறங்களைக் குறிக்கின்றன; சூழலைத் தெளிவாக்க 'நூல்கள்' சேர்க்கப்பட்டது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: கீழ் ஓரம் முழுவதும் தொடர்ச்சியாக அமைந்துள்ளதைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: பொன் மணிகள்
  rationale: தங்கத்தால் செய்யப்பட்ட சிறிய ஒலிமணிகளைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: בְּתוֹכָם
  choice: அவற்றின் இடையிடையே
  rationale: மாதுளம்பழ அலங்காரங்களின் நடுவே மணிகள் மாறிமாறி அமைக்கப்படுவதைத் தெளிவாக உணர்த்துகிறது.
