translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு ஆடை செய்வதற்கான அறிவுறுத்தலுக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நேரடியான ‘மாதுளம்பழங்கள்’ என்ற சொல்லாட்சி பாதுகாக்கப்பட்டு, சூழல்சார் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
