review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the clothing, anointing, installation, consecration, and priestly service. However, «எண்ணெயால்» explicitly supplies “with oil,” which is not stated in this verse, and «அப்போது» adds a temporal/resultative connection not expressed by the Hebrew. The literal footnote should reflect the singular Hebrew noun, “hand,” while retaining the plural possessive sense.
  naturalness: The imperative sequence and terminology are natural modern standard Tamil. Minor punctuation and wording revisions improve flow and avoid the somewhat unnecessary temporal inference introduced by «அப்போது».
  terminology: «அபிஷேகம்», «புனிதப்படுத்து», and «ஆசாரியர்களாகப் பணியாற்று» are suitable and appropriately formal. «பணியில் அமர்த்தி» is a clear, non-denominational functional rendering of the installation idiom; its literal form is retained in the footnote.
  issues:
  - severity: low
    issue: The main text adds «எண்ணெயால்» (“with oil”).
    rationale: Although anointing commonly entails oil and the wider ritual context uses it, the Hebrew wording of this verse says only “anoint them.” Omitting the added instrument is more textually precise.
  - severity: low
    issue: The main text adds «அப்போது» (“then”).
    rationale: The final clause states that they will serve as priests to God; “then” makes the temporal/resultative relation more explicit than the Hebrew does.
  - severity: low
    issue: The footnote uses plural «கைகளை» for a Hebrew idiom containing singular “hand.”
    rationale: Tamil can preserve the literal morphology more closely as «அவர்களுடைய கையை நிரப்பி», while the explanation makes clear that it is an idiom.
  revised_text: உன் சகோதரன் ஆரோனுக்கும், அவனோடுகூட அவனுடைய மகன்களுக்கும் அந்த ஆடைகளை அணிவி; அவர்களை அபிஷேகம் செய்து, அவர்களைப் பணியில் அமர்த்தி[a], அவர்களைப் புனிதப்படுத்து. அவர்கள் எனக்கு ஆசாரியர்களாகப் பணியாற்றுவார்கள்.
