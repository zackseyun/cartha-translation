base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: ta
  text: உன் சகோதரன் ஆரோனுக்கும், அவனோடுகூட அவனுடைய மகன்களுக்கும் அந்த ஆடைகளை அணிவி; அவர்களை அபிஷேகம் செய்து, அவர்களைப் பணியில் அமர்த்தி[a], அவர்களைப் புனிதப்படுத்து. அவர்கள் எனக்கு ஆசாரியர்களாகப் பணியாற்றுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “அவர்களுடைய கையை நிரப்பி.” இது ஒருவரை ஆசாரியப் பணியில் அமர்த்துவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: அந்த ஆடைகளை அணிவி
  rationale: לבשׁ என்பதன் ஹிஃபில் வடிவம் பிறருக்கு ஆடை அணிவிப்பதைக் குறிக்கிறது. முந்தைய வசனங்களில் விவரிக்கப்பட்ட ஆசாரிய ஆடைகளே இங்கு குறிக்கப்படுவதால், தமிழில் இயல்பாகவும் சூழலைத் தெளிவுபடுத்தும் வகையிலும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֹתָם ... אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: உன் சகோதரன் ஆரோனுக்கும் அவனோடு அவன் மகன்களுக்கும்
  rationale: எபிரெயச் சொற்றொடரில் முன்வரும் பன்மைப் பதிலிடுபெயரைத் தொடர்ந்து ஆரோனும் அவன் மகன்களும் குறிப்பிடப்படுகின்றனர். தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்து, அனைவரும் செயற்பாட்டின் பெறுநர்கள் என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: அவர்களை எண்ணெயால் அபிஷேகம் செய்து
  rationale: משׁח என்பது இந்த ஆசாரியச் சடங்குச் சூழலில் எண்ணெயால் அபிஷேகம் செய்வதைக் குறிக்கும் தொழில்நுட்பச் சொல். தமிழில் ‘அபிஷேகம்’ மட்டும் வேறு சடங்குகளையும் குறிக்கக்கூடும் என்பதால் ‘எண்ணெயால்’ எனத் தெளிவுபடுத்தப்பட்டது.
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: அவர்களைப் பணியில் அமர்த்தி
  rationale: சொல்லுக்குச் சொல் ‘அவர்களுடைய கைகளை நிரப்பு’ என்ற எபிரெய மரபுத்தொடர், ஆசாரியப் பணியில் அதிகாரபூர்வமாக அமர்த்துவதைக் குறிக்கிறது. குறிப்பிட்ட பிற்காலத் திருச்சபை மரபின் ‘திருநிலைப்படுத்தல்’ போன்ற சொல்லை இறக்குமதி செய்யாமல் அதன் செயல்பாட்டைத் தெரிவிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: அவர்களைப் புனிதப்படுத்து
  rationale: קדשׁ இங்கு இறைச் சேவைக்காகப் புனிதமானவர்களாக வேறுபிரித்தலைக் குறிக்கிறது. ‘புனிதப்படுத்து’ என்பது சடங்கு மற்றும் புனிதத் தன்மை இரண்டையும் காக்கிறது.
- source_word: וְכִהֲנוּ לִי
  choice: அவர்கள் எனக்கு ஆசாரியர்களாகப் பணியாற்றுவார்கள்
  rationale: כהן என்பதன் பியேல் வடிவம் ஆசாரியராகச் செயல்படுவதைக் குறிக்கிறது. ‘ஆசாரியர்களாகப் பணியாற்று’ என்பது பதவியையும் சேவையையும் காக்கிறது; לִי என்பதையும் ‘எனக்கு’ என்று நேரடியாகத் தருகிறது.
theological_decisions:
- issue: מִלֵּא אֶת־יָד என்ற ஆசாரியப் பணி அமர்த்தல் மரபுத்தொடர்
  choice: முதன்மை உரையில் ‘பணியில் அமர்த்தி’ என்று பொருள்வழியாக மொழிபெயர்த்தல்
  alternative: ‘அவர்களுடைய கைகளை நிரப்பி’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: நேரடி வடிவம் நவீனத் தமிழ் வாசகருக்கு பொருள் தெளிவில்லாததாக இருக்கும். சூழலில் இது ஆசாரியப் பணியில் அதிகாரபூர்வமாக அமர்த்துவதைக் குறிக்கிறது. ‘பணியில் அமர்த்தி’ என்பது அந்தச் செயலைத் தெளிவாகச் சொல்வதோடு, பிற்காலச் சமய அமைப்புகளுக்குரிய தனிப்பட்ட பதவியேற்புக் கருத்துகளைச் சேர்ப்பதில்லை; மூல மரபுத்தொடர் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இறைவன் மோசேயிடம் கூறும் ஒருமை ஏவல் வடிவங்கள் தமிழில் இயல்பாகப் பேணப்பட்டுள்ளன. ‘ஆசாரியர்’ என்பது பொதுவாகப் புரியக்கூடிய வேதாகமச் சொல்; ‘எண்ணெயால் அபிஷேகம்’ என்பது மூலச் சடங்கின் தன்மையைத் தெளிவாக்குகிறது.
