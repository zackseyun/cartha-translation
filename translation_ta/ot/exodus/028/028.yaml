translation_notes:
  register: நவீனத் தரத் தமிழ்; ஆசாரிய உடை குறித்த தொழில்நுட்ப வழிமுறைக்கு ஏற்ற கண்ணியமான, தெளிவான நடை. ‘ஏபோது’ என்ற மரபான வேதாகம ஆடைச்சொல் ஒலிபெயர்ப்பாகத் தக்கவைக்கப்பட்டது. மூலத்தில் அடங்கிய நோக்கம்/விளைவு உறவும், יִזַּח என்பதிலுள்ள இடமாற்றம் அல்லது பிரிவு சார்ந்த விரிவும் தீர்த்துவிடப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
