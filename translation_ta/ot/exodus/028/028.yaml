base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: ta
  text: மார்ப்பதக்கத்தை அதன் வளையங்களிலிருந்து ஏபோதின் வளையங்களோடு நீலநூல் கயிற்றால் கட்ட வேண்டும்; அது ஏபோதின் நுணுக்கமாக நெய்யப்பட்ட இடைக்கச்சின்மேல் இருக்கும்படி கட்ட வேண்டும். மார்ப்பதக்கம் ஏபோதிலிருந்து விலகிவிடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: கட்ட வேண்டும்
  rationale: வளையங்களையும் கயிற்றையும் பயன்படுத்தி இரு பகுதிகளை உறுதியாக இணைப்பதைக் குறிக்கும்; செய்முறையை அளவுக்கு மீறி குறிப்பாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: הַחֹשֶׁן
  choice: மார்ப்பதக்கம்
  rationale: இது போர்க்கவசம் அல்ல; ஏபோதுடன் இணைக்கப்பட்டு கற்கள் பதிக்கப்பட்ட ஆசாரிய உடையின் மார்புப் பகுதி. ‘மார்ப்பதக்கம்’ அந்த அலங்காரப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִטַּבְּעֹתָיו
  choice: அதன் வளையங்களிலிருந்து
  rationale: מִן முன்னொட்டு மார்ப்பதக்கத்தின் வளையங்கள் இணைப்பின் தொடக்கப் புள்ளியாக இருப்பதை வெளிப்படுத்துகிறது.
- source_word: טַבְּעֹת הָאֵפֹד
  choice: ஏபோதின் வளையங்களோடு
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகப் பேணி, இணைப்பின் மறுமுனையைக் குறிக்கிறது.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: நீலநூல் கயிற்றால்
  rationale: פְּתִיל என்பது நூற்கயிறு அல்லது திரித்த நூல்; תְּכֵלֶת ஆசரிப்புக்கூடாரத் துணிகளில் பயன்படுத்தப்பட்ட நீலச் சாயமிட்ட பொருளைக் குறிக்கிறது.
- source_word: לִהְיוֹת עַל
  choice: இவ்வாறு அது … மேல் இருக்கும்
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் வினையெச்சக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது; ‘தங்கியிருக்கும்’ போன்ற மூலத்தில் இல்லாத கூடுதல் நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: ஏபோதின் நுணுக்கமாக நெய்யப்பட்ட இடைக்கச்சு
  rationale: இச்சூழலில் ஏபோதோடு ஒருங்கிணைந்த நெய்யப்பட்ட கச்சு அல்லது பட்டையைக் குறிக்கிறது; முந்தைய சூழலில் சொல்லப்பட்ட திறமையான நெசவையும் பிரதிபலிக்கிறது.
- source_word: וְלֹא יִזַּח
  choice: விலகிவிடாது
  rationale: தன் இடத்திலிருந்து நகர்த்தப்படுதல் அல்லது பிரிதலைக் குறிக்கும் அரிய வினையின் சூழல்சார்ந்த பொருளைத் தருகிறது; ‘அவிழ்ந்துவிடாது’ என்பது கட்டு தானே அவிழ்வதாகத் தவறாக உணர்த்தலாம்.
- source_word: מֵעַל הָאֵפֹד
  choice: ஏபோதிலிருந்து
  rationale: ஏபோதின்மேல் உள்ள நிலையிலிருந்து மார்ப்பதக்கம் பிரியாமல் இருப்பதை இயல்பான தமிழில் கூறுகிறது.
