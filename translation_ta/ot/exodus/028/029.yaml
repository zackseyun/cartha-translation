  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: ta
  text: ஆரோன் பரிசுத்த இடத்திற்குள் நுழையும்போது, இஸ்ரவேலின் மகன்களுடைய பெயர்களைத் தீர்ப்புக்குரிய மார்ப்பதக்கத்தில்[a] தன் இதயத்தின்மேல் சுமப்பான்; யாவேக்கு முன்பாக எப்போதும் நினைவாகச் சுமப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீர்மானத்துக்குரிய மார்ப்பதக்கத்தில்.” இந்த எபிரெயப் பெயர், கடவுளின் முன்னிலையில் தீர்ப்பு அல்லது தீர்மானம் வழங்குவதோடு தொடர்புடைய ஆசாரிய மார்ப்பதக்கத்தைக் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָשָׂא
  choice: சுமந்துகொள்வான்
  rationale: נשא என்பதன் ‘சுமத்தல்/தாங்குதல்’ என்ற நேரடியான பொருளையும், ஆசாரிய உடையில் மார்ப்பதக்கத்தை அணிந்திருக்கும் சூழலையும் இயல்பான தமிழில் தருகிறது.
- source_word: שְׁמוֹת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுடைய பெயர்கள்
  rationale: பொறிக்கப்பட்ட பெயர்களே இங்கு மையம்; בְּנֵי יִשְׂרָאֵל என்பதன் வம்சவழி வடிவத்தையும் பாதுகாக்கிறது.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: தீர்ப்புக்குரிய மார்ப்பதக்கத்தில்
  rationale: חֹשֶׁן என்பது பிரதான ஆசாரியனின் மார்பில் அணியும் தனிப்பட்ட அணிகலன்; מִשְׁפָּט இங்கு தீர்ப்பு அல்லது தீர்மானத்துடன் அதன் தொடர்பைக் குறிக்கிறது. தமிழ் இயல்புக்காக உறவுப்பொருள் ‘-க்குரிய’ எனத் தரப்பட்டது.
- source_word: עַל לִבּוֹ
  choice: தன் இதயத்தின்மேல்
  rationale: அணிகலனின் உடல் அமைவிடத்தையும் பிரதிநிதித்துவ அடையாளத்தையும் காக்கும் நேரடி மொழிபெயர்ப்பு.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்திற்குள் நுழையும்போது
  rationale: בְּ + வினையெச்சப் பெயரின் காலப் பொருளை ‘நுழையும்போது’ எனவும், הַקֹּדֶשׁ என்பதைக் கூடாரத்தின் பரிசுத்தப் பகுதி எனவும் தெளிவாகக் காட்டுகிறது.
- source_word: לְזִכָּרוֹן
  choice: நினைவூட்டுதலாக
  rationale: நினைவுகூரச் செய்யும் அடையாளம் என்ற நோக்கைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘நினைவுச்சின்னம்’ என்பதைக் காட்டிலும் இச்சூழலில் செயல்பாட்டைத் தெளிவுபடுத்துகிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யெகோவாவின் திருமுன்
  rationale: ‘யெகோவாவின் முன்னிலையில்’ என்ற பொருளை மரியாதைமிக்க, வேதாகமத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை பட்டப்பெயராக மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: வழிபாட்டுச் சேவையில் தொடர்ந்து அல்லது தவறாமல் நிகழ்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: חֹשֶׁן הַמִּשְׁפָּט என்ற ஆசாரிய அணிகலனின் பெயர்
  choice: தீர்ப்புக்குரிய மார்ப்பதக்கம்
  alternative: தீர்மானத்துக்குரிய மார்ப்பதக்கம்; நீதியின் மார்ப்பதக்கம்
  rationale: מִשְׁפָּט என்பதைக் குறிப்பாக ‘நீதி’ அல்லது ‘தெய்வீகத் தீர்மானம்’ என்று குறுக்காமல், தீர்ப்புடன் தொடர்புடைய வழிபாட்டு அணிகலன் என்ற பரந்த பொருளைத் தக்கவைக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் வம்சவழி வடிவம்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்; இஸ்ரவேலின் பிள்ளைகள்
  rationale: எபிரெய மூலத்தின் ஆண்பால் வம்சவழிச் சொல்லாக்கத்தைப் பாதுகாக்கிறது; சூழலில் அது இஸ்ரவேலிலிருந்து வந்த கோத்திரங்களை மொத்தமாகக் குறிக்கிறது.
- issue: הַקֹּדֶשׁ குறிக்கும் வழிபாட்டு இடம்
  choice: பரிசுத்த இடம்
  alternative: பரிசுத்த ஸ்தலம்; சரணாலயம்
  rationale: கூடாரத்தின் புனிதப் பகுதியைக் குறிக்கும் இடப்பொருளைத் தெளிவாகவும், தேவையற்ற கட்டடவியல் விவரத்தைச் சேர்க்காமலும் தருகிறது.
- issue: לְזִכָּרוֹן לִפְנֵי יְהוָה என்பதன் தொடர்பு
  choice: அவை யெகோவாவின் திருமுன் நினைவூட்டுதலாக இருக்கும்
  alternative: யெகோவாவின் திருமுன் நினைவுச்சின்னமாக அவற்றைச் சுமந்துகொள்வான்
  rationale: எபிரெய சொற்றொடரின் நோக்கப் பொருளைத் தக்கவைத்து, நினைவூட்டுதல் யெகோவாவின் முன்னிலையில் நிகழ்கிறது என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நினைவுகூருபவர் யார் என்பதை உரை கூறாததால் அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘மார்ப்பதக்கம்’ என்பது ஆசாரியனின் மார்பில் அணியும் חֹשֶׁן என்பதைக் குறிக்கிறது. ‘திருமுன்’ என்ற சொல் வழிபாட்டு மரியாதையைத் தக்கவைத்தாலும் வாக்கிய அமைப்பு எளிமையாக வைக்கப்பட்டுள்ளது.
