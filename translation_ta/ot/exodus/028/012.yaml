  edition: WLC
  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: ta
  text: அந்த இரண்டு கற்களையும் ஏபோத்தின் தோள்பட்டைகளின்மேல் இஸ்ரவேலின் மகன்களுக்கான[b] நினைவுக் கற்களாக[a] வைக்க வேண்டும். ஆரோன் அவர்களுடைய பெயர்களை யாவேக்கு முன்பாகத் தன் இரு தோள்களின்மேல் நினைவுக்காகச் சுமப்பான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நினைவின் கற்களாக.’
    reason: lexical_alternative
  - marker: b
    text: ‘இஸ்ரவேலின் மகன்கள்’ என்பது குடும்பம் மற்றும் உடன்படிக்கையைச் சுட்டும் எபிரேயச் சொல்லாட்சி; இங்கு அது இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: பதிக்க வேண்டும்
  rationale: שׂים என்பது வைக்குதல் அல்லது அமைத்தல் என்று பொருள்படும். செதுக்கப்பட்ட கற்களை ஆசாரிய உடையின் தோள்பட்டைகளில் உறுதியாக அமைக்கும் சூழலில் ‘பதிக்க வேண்டும்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது; எபிரேய இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளையின் வலிமையையும் காக்கிறது.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: அந்த இரண்டு கற்கள்
  rationale: முந்தைய சூழலில் அடையாளம் காணப்பட்ட இரண்டு கற்களையே குறிப்பதால் தமிழில் ‘அந்த’ என்பது எபிரேய definite article-ஐ இயல்பாக வெளிப்படுத்துகிறது; இவ்வசனத்தில் இல்லாத ‘கோமேதகக் கற்கள்’ என்ற விவரத்தைச் சேர்க்கவில்லை.
- source_word: כִּתְפֹת הָאֵפֹד
  choice: ஏபோத்தின் தோள்பட்டைகள்
  rationale: כָּתֵף அடிப்படையில் ‘தோள்’ என்றாலும், இங்கு ஆடையின் தோள்பகுதியில் உள்ள கட்டமைப்புகளைக் குறிக்கிறது. ‘தோள்பட்டைகள்’ என்பது ஆரோனின் உடல் தோள்களிலிருந்து இதைத் தெளிவாக வேறுபடுத்துகிறது.
- source_word: אַבְנֵי זִכָּרֹן
  choice: நினைவுக் கற்கள்
  rationale: இந்த construct phrase ‘நினைவின் கற்கள்/நினைவுச் சின்னமான கற்கள்’ எனப் பொருள்படும். ‘நினைவுக் கற்கள்’ சுருக்கமாகவும் இயல்பாகவும் இருந்து அதன் நினைவூட்டும் பணியைப் பாதுகாக்கிறது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களுக்கான
  rationale: בְּנֵי என்பதன் குடும்ப-உடன்படிக்கை உருவகத்தை ‘மகன்கள்’ என்று காக்கிறது. இங்கு அது இஸ்ரவேலின் வழிவந்த மக்களையும் கோத்திரங்களையும் கூட்டாகக் குறிக்கிறது.
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: ஆரோன் அவர்களுடைய பெயர்களை ... சுமப்பான்
  rationale: נשׂא என்பதன் நேரடியான ‘சுமத்தல்/தாங்குதல்’ கருத்தையும், ஆசாரியன் மக்களைப் பிரதிநிதித்துவப்படுத்தி அவர்களின் பெயர்களை தேவனுக்கு முன்பாக எடுத்துச் செல்லும் படிமத்தையும் ‘சுமப்பான்’ காக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது ‘முன்பாக/சந்நிதியில்’ என்று பொருள்படும்; יְהוָה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: தன் இரு தோள்களின்மேல்
  rationale: இங்கு ஆடையின் தோள்பட்டைகள் அல்ல, ஆரோனின் சொந்த இரு தோள்களே குறிக்கப்படுகின்றன. ‘தன்’ என்ற reflexive வடிவம் இதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: לְזִכָּרֹן
  choice: நினைவுக்காக
  rationale: இந்த நோக்குச் சொற்றொடர் யார் நினைவுகூருகிறார் என்பதைத் தீர்மானிக்காமல் விடுகிறது. மேலும், முந்தைய זִכָּרֹן உடனான சொல் தொடர்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டப் பெயராக மாற்றாமல், ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைக் காக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதிலுள்ள பாலினமும் குடும்ப மொழியும்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேல் மக்கள்
  rationale: மூலத்தின் ‘மகன்கள்’ என்ற குடும்ப-வம்ச மொழி பாதுகாக்கப்படுகிறது; அதேவேளை அது ஆண்களுக்கு மட்டும் வரையறுக்கப்படாமல் இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- issue: לְזִכָּרֹן என்பதில் யார் நினைவுகூருகிறார் என்பது
  choice: நினைவுக்காக
  alternative: யாவே நினைவுகூரும்படி
  rationale: எபிரேய உரை நினைவுகூரும் கர்த்தாவை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே தேவனின் நினைவு அல்லது மக்களின் நினைவு என்று ஒருதலைப்பட்சமாகத் தீர்மானிக்காமல் உண்மையான தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உடைச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஏபோத்’ என்ற தொழில்நுட்ப வேதாகமச் சொல் ஒலிபெயர்ப்பாக வைக்கப்பட்டுள்ளது. முதல் தோள்குறிப்புக்கு ‘தோள்பட்டைகள்’ என்றும் ஆரோனின் உடல் தோள்களுக்கு ‘தோள்கள்’ என்றும் வேறுபடுத்தப்பட்டுள்ளது; நினைவு தொடர்பான மூலத்தின் மறுமொழியும் பாதுகாக்கப்பட்டுள்ளது.
