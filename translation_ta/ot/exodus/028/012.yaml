    rationale: The note's explanation of ‘இஸ்ரவேலின் மகன்கள்’ belongs immediately after that phrase. The added observation about ‘நினைவுக்காக’ is a separate interpretive note and is not part of the English POB footnote set; retaining it under the same distant anchor weakens anchor fidelity.
