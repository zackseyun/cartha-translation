source:
  edition: WLC
  text: וּ/מִלֵּאתָ֥ ב/וֹ֙ מִלֻּ֣אַת אֶ֔בֶן אַרְבָּעָ֖ה טוּרִ֣ים אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּ/בָרֶ֔קֶת הַ/טּ֖וּר הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: ta
  text: 'அதில் நான்கு வரிசைகளாக இரத்தினக் கற்களைப் பதிக்க வேண்டும்: முதல் வரிசையில் மாணிக்கம், புஷ்பராகம், மரகதம் ஆகியவை இருக்க வேண்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த இரத்தினக் கற்களின் துல்லியமான அடையாளம் உறுதியில்லை. “மாணிக்கம்” என்பது “சிவப்புமணி” (கார்னீலியன்) என்றும், “புஷ்பராகம்” என்பது “கிரிசோலைட்” அல்லது “பெரிடோட்” என்றும், “மரகதம்” என்பது “பெரில்” என்றும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: அதில் இரத்தினக் கற்களைப் பதிக்க வேண்டும்
  rationale: מלא என்பதன் அடிப்படைப் பொருள் ‘நிரப்பு’ என்றாலும், இங்கு மார்ப்பதக்கத்தில் கற்களைப் பொருத்தும் கைவினைச் சூழலில் ‘பதிக்க’ என்பது இயல்பான தமிழாகவும் கருத்துக்குத் துல்லியமாகவும் உள்ளது. מִלֻּאַת אֶבֶן என்ற தொழில்நுட்பச் சொற்றொடரின் பொருளும் இதில் அடங்குகிறது.
- source_word: אַרְבָּעָה טוּרִים אָבֶן
  choice: நான்கு வரிசைகளாக இரத்தினக் கற்களை
  rationale: טוּר என்பது இங்கு ஒழுங்காக அமைக்கப்பட்ட கற்களின் ‘வரிசை’யைக் குறிக்கிறது. אֶבֶן ஒருமை வடிவில் இருந்தாலும் கூட்டுப்பொருளில் வருவதால் ‘கற்கள்’ என மொழிபெயர்க்கப்பட்டது; சூழலைத் தெளிவாக்க ‘இரத்தினக் கற்கள்’ பயன்படுத்தப்பட்டது.
- source_word: טוּר ... הָאֶחָד
  choice: முதல் வரிசையில்
  rationale: நான்கு வரிசைகளில் வரிசைமுறையின் முதலாவதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אֹדֶם
  choice: மாணிக்கம்
  rationale: சிவப்பு நிற இரத்தினத்தைக் குறிக்கும் இச்சொல்லின் துல்லியமான கனிம அடையாளம் உறுதியில்லை. மரபாக அறியப்பட்ட ‘மாணிக்கம்’ முதன்மை உரையில் வைக்கப்பட்டு மாற்று அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: פִּטְדָה
  choice: புஷ்பராகம்
  rationale: பழமையான இக்கல்லின் துல்லிய அடையாளம் விவாதத்திற்குரியது. Topaz என்பதற்கான நிலைபெற்ற தமிழ் இரத்தினப் பெயராக ‘புஷ்பராகம்’ தேர்ந்தெடுக்கப்பட்டது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וּבָרֶקֶת
  choice: மரகதம்
  rationale: ஒளிர்தல் என்ற கருத்துடன் தொடர்புடைய இச்சொல்லின் துல்லியமான கல் அடையாளம் உறுதியில்லை. மரபான ‘மரகதம்’ உரையில் வைக்கப்பட்டு ‘பெரில்’ மாற்றாகக் குறிப்பிடப்படுகிறது.
