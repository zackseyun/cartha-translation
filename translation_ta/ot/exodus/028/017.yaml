translation_notes:
  register: நவீன நிலையான தமிழில், திருவழிபாட்டு ஆடை தயாரிப்பின் கைவினைச் சூழலுக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் ‘நிரப்புதல்/பதித்தல்’ உருவகம் தமிழில் இயல்பாக ‘பதிக்க’ என வழங்கப்பட்டுள்ளது; இரத்தினங்களின் உறுதியற்ற அடையாளங்கள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
