translation:
  language: ta
  text: மார்ப்பதக்கத்தில் இரண்டு பொன் வளையங்களைச் செய்து, அந்த இரண்டு வளையங்களையும் மார்ப்பதக்கத்தின் இரு முனைகளில் வைக்க வேண்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: செய்து ... வேண்டும்
  rationale: தொடர்ச்சியான அறிவுறுத்தல்களில் வாவுடன் வரும் Qal perfect கட்டளைப் பொருளைத் தருகிறது; தமிழில் தொடர்வினையுடன் இறுதியில் ‘வேண்டும்’ பயன்படுத்துவது இயல்பாகவும் கட்டளை வலிமையுடனும் உள்ளது.
- source_word: עַל הַחֹשֶׁן
  choice: மார்ப்பதக்கத்தில்
  rationale: இங்கு עַל, மார்ப்பதக்கத்துடன் வளையங்கள் இணைக்கப்படுவதைக் குறிக்கிறது; ‘-இல்’ என்பது இயல்பான இடவியல்/இணைப்பு உறவை வெளிப்படுத்துகிறது.
- source_word: הַחֹשֶׁן
  choice: மார்ப்பதக்கம்
  rationale: யாத்திராகமம் 28-இன் ஆசாரிய உடைச் சூழலில், மார்பில் அணியும் சிறப்புப் பொருளைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: இரண்டு பொன் வளையங்கள்
  rationale: זָהָב பொருளைக் குறிப்பிடுகிறது; ‘பொன் வளையங்கள்’ என்பது நேரடியும் இயல்புமான தமிழ் வடிவம்.
- source_word: וְנָתַתָּ
  choice: பொருத்த வேண்டும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘வை/இடு’; இச்சூழலில் வளையங்களை ஓரங்களில் இணைக்கும் செயலைத் தெளிவுபடுத்த ‘பொருத்து’ இயல்பான நடைமுறைச் சொல்.
- source_word: אֶת שְׁתֵּי הַטַּבָּעוֹת
  choice: அந்த இரண்டு வளையங்களையும்
  rationale: முன்னர் கூறப்பட்ட குறிப்பிட்ட இரண்டு வளையங்களையே சுட்டுவதால் ‘அந்த’ என்பதும் நேரடி செயப்படுபொருள் குறிக்க ‘-ஐயும்’ என்பதும் பயன்படுத்தப்பட்டன.
- source_word: עַל שְׁנֵי קְצֹוֹת הַחֹשֶׁן
  choice: மார்ப்பதக்கத்தின் இரு முனைகளில்
  rationale: קָצֶה என்பது ‘முனை/எல்லை’ எனப் பொருள்படும்; இரு இணைப்பிடங்களைக் குறிக்க ‘இரு முனைகளில்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
