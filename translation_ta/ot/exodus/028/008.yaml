  text: וְ/חֵ֤שֶׁב אֲפֻדָּת/וֹ֙ אֲשֶׁ֣ר עָלָ֔י/ו כְּ/מַעֲשֵׂ֖/הוּ מִמֶּ֣/נּוּ יִהְיֶ֑ה זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: ta
  text: 'ஏபோத்தின் மேல் இருக்கும் அதன் கலைநயமாய் நெய்யப்பட்ட இடைக்கச்சை[a], அதன் வேலைப்பாட்டைப் போலவே, அதிலிருந்தே அமைந்திருக்க வேண்டும்[b]. அது தங்கம், நீலநிற நூல், ஊதாநிற நூல், கருஞ்சிவப்புநிற நூல், முறுக்கப்பட்ட மெல்லிய ஆளிநார் நூல் ஆகியவற்றால் செய்யப்பட வேண்டும்.


    [a] “ஏபோத்” என்பது தலைமைக் குரு அணிந்த சிறப்பு ஆசாரிய உடையாகும்.


    [b] எபிரெய மொழியில், “அதன் வேலைப்பாட்டைப் போல; அதிலிருந்து அது இருக்க வேண்டும்.” இடைக்கச்சை ஏபோத்தின் வேலைப்பாட்டுக்கு ஒத்ததாகவும் அதனோடு ஒருங்கிணைந்த பகுதியாகவும் இருக்க வேண்டும் என்பதை இது வலியுறுத்துகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏபோத்” என்பது தலைமைக் குரு அணிந்த சிறப்பு ஆசாரிய உடையாகும்.
    reason: cultural_note
  - marker: b
    text: எபிரெய மொழியில், “அதன் வேலைப்பாட்டைப் போல; அதிலிருந்து அது இருக்க வேண்டும்.” இடைக்கச்சை ஏபோத்தின் வேலைப்பாட்டுக்கு ஒத்ததாகவும் அதனோடு ஒருங்கிணைந்த பகுதியாகவும் இருக்க வேண்டும் என்பதை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵשֶׁב
  choice: கலைநயத்துடன் நெய்யப்பட்ட இடைக்கச்சை
  rationale: ஆசாரிய உடை குறித்த இச்சூழலில் இது சிந்தனை என்பதைக் குறிக்காமல், நெய்யப்பட்டு இடுப்பில் கட்டப்படும் அலங்காரப் பட்டையைக் குறிக்கிறது. ‘கலைநயத்துடன்’ என்பது அதன் நுணுக்கமான வேலைப்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲפֻדָּתוֹ
  choice: ஏபோத்தின் … அதன்
  rationale: אֵפוֹד என்ற ஆசாரிய மேலாடைப் பெயர் ஒலிபெயர்க்கப்பட்டது. உடைதான் உடனடி உரையாடல் பொருள் என்பதால், ஆண்பால் ஒருமை பின்னொட்டு தமிழில் ‘அதன்’ என வழங்கப்பட்டது; வாக்கிய அமைப்பில் ‘ஏபோத்தின்’ என மீண்டும் கூறுவது தெளிவைத் தருகிறது.
- source_word: אֲשֶׁר עָלָיו
  choice: ஏபோத்தின் மேல் இருக்கும்
  rationale: עָלָיו என்பதிலுள்ள பின்னொட்டு இலக்கண ரீதியாக ‘அதன் மேல்’ அல்லது ‘அவன்மேல்’ என அமையலாம். உடனடி முன்னிலைச் சொல்லும் உடை வடிவமைப்புச் சூழலும் ஏபோத்தைக் குறிப்பதாக இருப்பதால் ‘ஏபோத்தின் மேல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כְּמַעֲשֵׂהוּ
  choice: ஏபோத்தின் வேலைப்பாட்டைப் போலவே
  rationale: ‘அதன் வேலைப்பாட்டைப் போல’ என்ற ஒப்புமையைத் தனியாகப் பாதுகாக்கிறது; அடுத்த சொற்றொடரிலுள்ள ஒருங்கிணைந்த அமைப்பு என்ற கருத்துடன் இதைக் கலக்கவில்லை.
- source_word: מִמֶּנּוּ יִהְיֶה
  choice: அதிலிருந்தே செய்யப்பட்டதாக இருக்க வேண்டும்
  rationale: சொல்லுக்கு நெருக்கமாக இது ‘அதிலிருந்து அது இருக்க வேண்டும்’ என்பதாகும். சூழலில் இடைக்கச்சை தனியாக இணைக்கப்பட்ட ஒன்றல்லாமல் ஏபோத்தோடு ஒருங்கிணைந்ததாக இருப்பதைச் சுட்டுகிறது; மூலத்தின் செறிவும் சற்றே திறந்த பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: זָהָב
  choice: தங்கம்
  rationale: பொருளைக் குறிக்கும் நேரடியான சொல்.
- source_word: תְּכֵלֶת
  choice: நீலநிற நூல்
  rationale: கூடாரத் துணிகள் மற்றும் ஆசாரிய உடைகளில் பயன்படுத்தப்பட்ட சாயமிட்ட நூற்பொருளைக் குறிக்கும் நிறச்சொல்; தமிழில் பொருள் பட்டியலின் துணிநூல் தன்மையை வெளிப்படுத்த ‘நூல்’ சேர்க்கப்பட்டது.
- source_word: אַרְגָּמָן
  choice: ஊதாநிற நூல்
  rationale: சாயமிட்ட ஊதா நிறத் துணிநூலைக் குறிக்கும் வழக்கமான பொருள்.
- source_word: תוֹלַעַת שָׁנִי
  choice: கருஞ்சிவப்புநிற நூல்
  rationale: செந்நிறச் சாயத்தால் நிறமூட்டப்பட்ட நூற்பொருளைக் குறிக்கும். ‘கருஞ்சிவப்பு’ என்பது தெளிவான நவீனத் தமிழ் நிறப்பெயர்.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: முறுக்கப்பட்ட மெல்லிய சணல்நூல்
  rationale: שֵׁשׁ மெல்லிய சணல் துணி அல்லது நூலையும், מָשְׁזָר முறுக்கப்பட்ட அல்லது திரிக்கப்பட்ட தன்மையையும் குறிக்கிறது; இரு கூறுகளும் தமிழில் வெளிப்படுகின்றன.
theological_decisions:
- issue: עָלָיו என்ற பின்னொட்டின் குறிப்பு
  choice: ஏபோத்தின் மேல்
  alternative: அவன்மேல், அதாவது தலைமைக் குருவின்மேல்
  rationale: உடனடி முன்னிலைச் சொல் ஏபோத் என்பதும், இப்பகுதி உடையின் கட்டமைப்பை விவரிப்பதும் ‘அதன் மேல்’ என்ற புரிதலை ஆதரிக்கின்றன. இது கோட்பாட்டுச் சார்பான தீர்வு அல்ல; இலக்கண-சூழல் சார்ந்த தேர்வு.
- issue: מִמֶּנּוּ יִהְיֶה கூறும் கட்டமைப்பு
  choice: அதிலிருந்தே செய்யப்பட்டதாக இருக்க வேண்டும்
  alternative: அதனோடு ஒரே துண்டாக இருக்க வேண்டும்
  rationale: ‘ஒரே துண்டு’ என்பது சூழலுக்கு ஏற்ற விளக்கமாக இருந்தாலும், எபிரெயச் சொற்றொடர் நேரடியாக ‘அதிலிருந்து அது இருக்க வேண்டும்’ என்று மட்டுமே கூறுகிறது. ஆகவே பிரதான உரை மூலத்திற்கு அருகில் வைக்கப்பட்டு, ஒருங்கிணைந்த பகுதி என்ற பொருள் அடிக்குறிப்பில் விளக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘ஏபோத்’ என்ற வரலாற்று உடைப்பெயர் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் சுருக்கமாக விளக்கப்பட்டது. தொழில்நுட்பமான எபிரெய வாக்கிய அமைப்பு வாசிப்புக்கு ஏற்ற இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; ஆனால் வேலைப்பாட்டு ஒப்புமையும் அதிலிருந்து உருவான ஒருங்கிணைந்த தன்மையும் தனித்தனியாகப் பாதுகாக்கப்பட்டன.
