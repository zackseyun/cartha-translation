base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: ta
  text: ஆரோனின் மகன்களுக்காக நீ அங்கிகளைச் செய்ய வேண்டும்; அவர்களுக்காக இடைக்கச்சைகளையும் செய்ய வேண்டும்; அவர்களுக்காகத் தலைப்பாகைகளையும் செய்ய வேண்டும். இவை மாட்சிக்காகவும் அழகுக்காகவும் இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘தொப்பிகள்,’ ‘முண்டாசுகள்,’ அல்லது ‘தலை அணிகலன்கள்.’ ஆசாரியர்களுக்குரிய இந்தத் தலைப்பாகைகளின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்களுக்காக
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான தந்தை–மகன் உறவை இயல்பான நவீன தமிழில் பாதுகாக்கிறது; ‘சந்ததியினர்’ என்று பொருளை விரிவாக்கவில்லை.
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: நீ ... செய்ய வேண்டும்
  rationale: அறிவுறுத்தல் சூழலில் உள்ள கட்டளைத் தன்மையைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: כֻתֳּנֹת
  choice: அங்கிகள்
  rationale: உடலை மூடும் அடிப்படை நீளாடைகளைக் குறிக்கும் சொல்லுக்கு ஏற்ற, கண்ணியமான பொதுத் தமிழ் இணைச்சொல்.
- source_word: אַבְנֵטִים
  choice: இடைக்கச்சைகள்
  rationale: இடுப்பைச் சுற்றிக் கட்டப்படும் துணிப்பட்டைகளைத் துல்லியமாகக் குறிக்கிறது; நவீன இறுக்கமான ‘பெல்ட்’ என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: מִגְבָּעוֹת
  choice: தலைப்பாகைகள்
  rationale: ஆசாரியர்களுக்குரிய தலை அணிகலனைக் குறிக்கும் பொதுவான, எச்சரிக்கையான மொழிபெயர்ப்பு; அதன் துல்லியமான வடிவத்தைத் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: לְכָבוֹד
  choice: மாட்சிக்காக
  rationale: כָּבוֹד என்பதிலுள்ள பெருமை, கண்ணியம், மகிமை ஆகிய உயர்ந்த பொருள் வட்டத்தை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּלְתִפְאָרֶת
  choice: அழகுக்காக
  rationale: תִּפְאֶרֶת என்பதிலுள்ள அழகு மற்றும் பொலிவு சார்ந்த நோக்கத்தைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ஆசாரிய உடைகளின் நோக்கத்தைக் குறிக்கும் சொற்றொடர்
  choice: மாட்சிக்காகவும் அழகுக்காகவும்
  alternative: கண்ணியத்திற்காகவும் பொலிவிற்காகவும்
  rationale: உடைகள் கண்ணியமும் அழகும் கொண்டிருக்க வேண்டும் என்ற எபிரெய உரையின் இரட்டை நோக்கத்தைப் பாதுகாக்கிறது; பிற்கால அடையாளவியல் விளக்கங்களை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய வினை அமைப்பு தமிழில் தெளிவாகத் தெரிய ‘செய்ய வேண்டும்’ மீண்டும் வழங்கப்பட்டுள்ளது; இணைப்புச் சொற்கள் இயல்புக்காக ‘-யும்’ வடிவில் அமைக்கப்பட்டுள்ளன.
