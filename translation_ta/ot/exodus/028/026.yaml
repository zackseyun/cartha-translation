  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஆசாரிய ஆடையின் தொழில்நுட்பப் பெயராக ‘ஏபோது’ ஒலிபெயர்க்கப்பட்டு, חֹשֶׁן என்பதற்கு புரியத்தக்க ‘மார்புப்பதக்கம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது. கட்டளையின் வலிமை ‘வேண்டும்’ மூலம் தக்கவைக்கப்பட்டுள்ளது.
