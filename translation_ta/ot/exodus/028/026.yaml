  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: ta
  text: நீ இரண்டு பொன் வளையங்களைச் செய்து, அவற்றை மார்புப்பதக்கத்தின் இரு முனைகளிலும், ஏபோதின் பக்கமாக உள்நோக்கி இருக்கும் அதன் ஓரத்தில் பொருத்த வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏபோதின் பக்கமாக இருக்கும் அதன் உள்புற ஓரத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: நீ ... செய்து
  rationale: அறிவுறுத்தல் தொடரில் கட்டளையைக் குறிக்கும் வினை; அடுத்த வினையுடன் இயல்பான தமிழ்த் தொடராக அமைக்கப்பட்டது.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: இரண்டு பொன் வளையங்கள்
  rationale: எண்ணிக்கை, பொருள், உலோகம் ஆகியவற்றைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְשַׂמְתָּ אֹתָם
  choice: அவற்றை ... பொருத்த வேண்டும்
  rationale: שׂים என்பதன் ‘வை/அமை’ என்ற பொருளை இக்கைவினைச் சூழலில் ‘பொருத்து’ என்பது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: மார்புப்பதக்கத்தின் இரு முனைகளிலும்
  rationale: קצה என்பதன் முனை அல்லது கடைக்கோடி என்ற இடவியல் பொருளை இயல்பான தமிழில் தருகிறது; חֹשֶׁן இங்கு ஆசாரிய உடையின் மார்புப்பதக்கத்தைக் குறிக்கிறது.
- source_word: עַל שְׂפָתוֹ
  choice: அதன் ... ஓரத்தில்
  rationale: שָׂפָה என்பதன் நேரடி ‘உதடு’ என்ற உருவகத்திற்குப் பதிலாக, பொருளின் விளிம்பைக் குறிக்கும் இயல்பான ‘ஓரம்’ பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: ஏபோதுக்கு நேராக உள்ள அதன் உட்புற
  rationale: עֵבֶר குறிக்கும் எதிர்நோக்கிய பக்கத்தையும் בָּיְתָה குறிக்கும் உள்நோக்கிய திசையையும் ஒன்றிணைத்து, இடவியல் உறவைத் தெளிவாகத் தருகிறது; எபிரெயச் சொற்றொடரின் சற்றே தெளிவற்ற இணைப்பு அடிக்குறிப்பில் மாற்றாகப் பாதுகாக்கப்படுகிறது.
