translation_notes:
  register: நவீன பொதுத்தமிழில், கண்ணியமான கட்டளை நடையில் மொழிபெயர்க்கப்பட்டது. ஆசாரிய உடையின் தொழில்நுட்பப் பெயரான ‘ஏபோத்து’ ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் சுருக்கமாக விளக்கப்பட்டுள்ளது; கட்டுமான இடவியல் உறவுகள் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
