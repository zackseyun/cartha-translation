base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: ta
  text: நீ இரண்டு பொன் வளையங்களைச் செய்து, அவற்றை ஏபோத்தின்[a] இரண்டு தோள்பட்டைகளிலும், கீழ்ப்புறத்தில், அதன் முன்பக்கத்தில், அது இணையும் இடத்திற்கு[b] எதிராக, ஏபோத்தின் நுணுக்கமாக நெய்யப்பட்ட இடைக்கச்சைக்கு மேலே பொருத்த வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஏபோத்து என்பது தலைமைக் குரு அணிந்த சிறப்பான ஆசாரிய ஆடை.
    reason: technical_term
  - marker: b
    text: அல்லது, ‘அதன் இணைப்புக்கு’ அல்லது ‘அது பொருத்தப்படும் இடத்திற்கு.’ எபிரெயச் சொல் ஏபோத்து இணைக்கப்படும் இடத்தைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: பொன் வளையங்கள்
  rationale: ஆசரிப்புக்கூடாரம் மற்றும் ஆசாரிய உடை தொடர்பான சூழலில் இச்சொல் பொதுவாகக் கட்டுவதற்குப் பயன்படும் உலோக வளையங்களைக் குறிக்கிறது.
- source_word: כִתְפוֹת הָאֵפוֹד
  choice: ஏபோத்தின் தோள்பட்டைகள்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘தோள்கள்’ என்றாலும், இங்கு உடையின் தோள்பகுதிகளாக அமைந்த துண்டுகளைக் குறிக்கிறது.
- source_word: הָאֵפוֹד
  choice: ஏபோத்து
  rationale: இது ஆசாரியருக்குரிய ஒரு தனிப்பட்ட ஆடையின் தொழில்நுட்பப் பெயர்; சுருக்கமான துல்லியமான தமிழ் இணை இல்லாததால் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: מִלְמַטָּה
  choice: கீழ்ப்புறத்தில்
  rationale: வளையங்கள் ஏபோத்தின் கீழான பகுதியில் அமைக்கப்பட வேண்டிய இடத்தைக் குறிக்கும் இயல்பான இடவியல் சொற்றொடர்.
- source_word: מִמּוּל פָּנָיו
  choice: அதன் முன்பக்கத்தில்
  rationale: ‘அதன் முகத்திற்கு முன்பாக’ என்னும் எபிரெய வழக்கை உயிரற்ற பொருளுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: לְעֻמַּת מֶחְבַּרְתּוֹ
  choice: அது இணையும் இடத்திற்கு எதிராக
  rationale: מֶחְבֶּרֶת என்பது தையல் கோடு மட்டுமல்லாமல் இணைப்பு அல்லது சேரும் இடத்தையும் பரந்த வகையில் குறிக்கலாம்; ஆகவே மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: לְחֵשֶׁב הָאֵפוֹד
  choice: ஏபோத்தின் நுணுக்கமாக நெய்யப்பட்ட இடைக்கச்சை
  rationale: חֵשֶׁב என்பது ஏபோத்துடன் சேர்ந்த, சிறப்பாகச் செய்யப்பட்ட பட்டை அல்லது இடைக்கச்சையைக் குறிக்கிறது; சூழலில் அதன் நெய்த வேலைப்பாடும் முக்கியம்.
