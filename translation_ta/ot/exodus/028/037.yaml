  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: ta
  text: அதை நீலநிறக் கயிற்றில் பொருத்தி, தலைப்பாகையின்மேல் வைக்க வேண்டும்; அது தலைப்பாகையின் முன்புறத்தில் இருக்க வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நீலநிறக் கயிறு” என்பதற்கு “நீலநிற நூல்” அல்லது “நீலநிற நாடா” என்றும் மொழிபெயர்க்கலாம். எபிரெய இடக்குறிப்பு தலைப்பாகையின் முகப்பு அல்லது முன்புறத்தை நோக்கிய அமைவைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: அதை ... வைக்க வேண்டும்
  rationale: שׂים என்பது ‘வை, பொருத்து, அமை’ என்று பொருள்படும். இங்கு கொடுக்கப்படும் நேரடியான வழிமுறையை இயல்பான நவீன தமிழில் ‘வைக்க வேண்டும்’ எனத் தருகிறது; நாடாவுடனான தொடர்பைத் தெளிவாக்க ‘கட்டி’ சேர்க்கப்பட்டுள்ளது.
- source_word: פְּתִיל
  choice: நாடா
  rationale: פְּתִיל என்பது கட்டுவதற்குப் பயன்படும் நூல், கயிறு அல்லது நாடாவைக் குறிக்கிறது. தலைப்பாகையில் பொன் தகட்டைப் பொருத்தும் சூழலில் ‘நாடா’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: תְּכֵלֶת
  choice: நீலநிற
  rationale: תְּכֵלֶת என்பது திருவாசஸ்தலப் பொருட்களில் பயன்படுத்தப்பட்ட விலையுயர்ந்த தனித்துவமான நீலச் சாயம் அல்லது அந்த நிறத் துணியைக் குறிக்கிறது. அதன் துல்லியமான நிறச்சாயல் உறுதியற்றதால் பொதுவான ‘நீலநிற’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְהָיָה עַל הַמִּצְנָפֶת
  choice: தலைப்பாகையின்மேல் ... இருக்க வேண்டும்
  rationale: מִצְנֶפֶת என்பது தலைமைக் குருவின் சுற்றிக் கட்டப்படும் தலை அணியைக் குறிக்கிறது. நவீனத் தமிழில் புரிந்துகொள்ள எளிதான ‘தலைப்பாகை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶל מוּל פְּנֵי הַמִּצְנֶפֶת
  choice: தலைப்பாகையின் முன்புறத்தில்
  rationale: இந்த எபிரெயச் சொற்றொடர் தலைப்பாகையின் முகப்பு நோக்கிய அல்லது அதற்கு எதிரான இடத்தைக் குறிக்கிறது. பொருளைத் தெளிவாகக் காட்ட ‘முன்புறத்தில்’ என மொழிபெயர்க்கப்பட்டுள்ளது; சொல்லுக்குச் சொல் அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִהְיֶה
  choice: இருக்க வேண்டும்
  rationale: இறுதி வினைச்சொல் இடத்தைக் குறித்த கட்டளையை மீண்டும் வலியுறுத்துகிறது. ‘இருக்க வேண்டும்’ அந்தக் கட்டாயத்தையும் எபிரெய உரையின் மீளுரைப்பையும் காக்கிறது.
