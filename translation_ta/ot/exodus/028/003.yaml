source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּדַבֵּר֙ אֶל כָּל חַכְמֵי לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖י/ו ר֣וּחַ חָכְמָ֑ה וְ/עָשׂ֞וּ אֶת בִּגְדֵ֧י אַהֲרֹ֛ן לְ/קַדְּשׁ֖/וֹ לְ/כַהֲנ/וֹ לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: ta
  text: நீ இதயத்தில் ஞானமுள்ள அனைவரிடமும்[a] பேசு. ஞானத்தின் ஆவியால்[b] நான் நிரப்பியவர்கள் அவர்களே. ஆரோன் எனக்கு ஆசாரியனாகப் பணியாற்றுவதற்காக அவனைப் பரிசுத்தப்படுத்த, அவர்கள் அவனுடைய ஆடைகளைச் செய்ய வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘இதயத்தில் ஞானமுள்ளவர்கள்.’ இது திறனும் புரிதலும் அருளப்பெற்றவர்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: ‘ஞான ஆவி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் தேவனால் அளிக்கப்பட்ட ஞான ஆவியையோ ஞானமுள்ள மனப்பாங்கையையோ குறிக்கக்கூடும்; இங்கு அது குறிப்பாகப் பரிசுத்த ஆவியையே குறிக்கிறதா என்பதைச் சொல்வடிவு தீர்மானிப்பதில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: பேசு
  rationale: அறிவுறுத்தல் சூழலில் உள்ள வினை வடிவத்தின் கட்டளைத் தன்மையை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: חַכְמֵי לֵב
  choice: இதயத்தில் ஞானமுள்ளவர்கள்
  rationale: ‘இதயம்’ என்பதைப் புரிதல் மற்றும் திறனின் உள்ளார்ந்த இருக்கையாகக் காட்டும் எபிரெய மரபுத்தொடரைத் தக்கவைக்கிறது; சூழலில் இது செயல் திறனையும் உள்ளடக்குகிறது.
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: அவர்களை ஞான ஆவியால் நிரப்பியிருக்கிறேன்
  rationale: מלא என்பதன் ‘நிரப்புதல்’ உருவகத்தையும் רוּחַ חָכְמָה என்பதிலுள்ள ஆவி/மனப்பாங்கு சார்ந்த உண்மையான தெளிவின்மையையும் தக்கவைக்கிறது. எபிரெய ஒருமைச் சுட்டுப்பெயர் ஒரு கூட்டத்தை ஒருமையாகக் குறிப்பதாகத் தமிழில் இயல்பான பன்மையில் வழங்கப்பட்டுள்ளது.
- source_word: בִּגְדֵי אַהֲרֹן
  choice: ஆரோனுடைய ஆடைகள்
  rationale: மூலத்தில் வெளிப்படையாக இல்லாத ‘ஆசாரிய ஆடைகள்’ என்ற விளக்கத்தைச் சேர்க்காமல் உடைமைத் தொடர்பை நேரடியாகக் காட்டுகிறது.
- source_word: לְקַדְּשׁוֹ
  choice: அவனைப் பரிசுத்தப்படுத்துவதற்காக
  rationale: ஆசாரியப் பணிக்கென ஒருவரைப் புனிதமாகப் பிரித்துவைக்கும் பொருளைத் தக்கவைக்கிறது.
- source_word: לְכַהֲנוֹ לִי
  choice: எனக்கு ஆசாரியனாகப் பணியாற்றும்படி
  rationale: כהן என்ற வினையின் ‘ஆசாரியனாகச் செயல்படு/பணியாற்று’ என்ற பொருளையும் לִי என்பதன் தேவனுக்கான சேவையையும் தெளிவாக வழங்குகிறது.
- source_word: וְעָשׂוּ
  choice: அவர்கள் … செய்ய வேண்டும்
  rationale: அறிவுறுத்தல் தொடரில் இவ்வடிவம் கொண்டுள்ள ஆணைத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: רוּחַ חָכְמָה என்பது பரிசுத்த ஆவியை நேரடியாகக் குறிக்கிறதா
  choice: ஞான ஆவி
  alternative: ஞானத்தின் ஆவியானவர் / ஞானமுள்ள மனப்பாங்கு
  rationale: எபிரெயில் இச்சொற்றொடர் குறிப்பிட்ட சுட்டுடன் வரவில்லை; அது தேவனால் அருளப்பட்ட ஞான ஆவியையோ ஞானமுள்ள மனப்பாங்கையையோ குறிக்கலாம். தமிழ் முதன்மை உரை பின்னாளைய திரித்துவ அடையாளத்தைத் திணிக்காமல் இத்தெளிவின்மையைத் தக்கவைக்கிறது.
- issue: לְקַדְּשׁוֹ לְכַהֲנוֹ ஆகிய இரு நோக்க வினையெச்சங்களின் தொடர்பு
  choice: ஆசாரியனாகப் பணியாற்றும்படி அவனைப் பரிசுத்தப்படுத்துவதற்காக
  alternative: அவனைப் பரிசுத்தப்படுத்துவதற்காக, அவன் எனக்கு ஆசாரியனாகப் பணியாற்றுவதற்காக
  rationale: ஆசாரியப் பணியே பரிசுத்தப்படுத்துதலின் நோக்கம் என்ற நெருங்கிய தொடர்பை இயல்பான தமிழில் காட்டுகிறது; இரண்டையும் தொடர்பற்ற தனித்த நோக்கங்களாகப் பிரிக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்,’ ‘பரிசுத்தப்படுத்துதல்’ ஆகியவை ஆசாரிய நியமனச் சூழலின் புனிதத் தன்மையைத் தக்கவைக்கின்றன. எபிரெய மரபுத்தொடர் முதன்மை உரையில் வாசிக்கத்தக்க வகையில் வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
