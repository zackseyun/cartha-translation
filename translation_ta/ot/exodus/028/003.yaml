revisions:
- from: நீ இதயத்தில் ஞானமுள்ள அனைவரிடமும்[a] பேசு. நான் அவர்களை ஞான ஆவியால்[b] நிரப்பியிருக்கிறேன். ஆரோன் எனக்கு ஆசாரியனாகப் பணியாற்றும்படி அவனைப் பரிசுத்தப்படுத்துவதற்காக அவர்கள் அவனுடைய ஆடைகளைச் செய்ய வேண்டும்.
  to: நீ இதயத்தில் ஞானமுள்ள அனைவரிடமும்[a] பேசு. ஞானத்தின் ஆவியால்[b] நான் நிரப்பியவர்கள் அவர்களே. ஆரோன் எனக்கு ஆசாரியனாகப் பணியாற்றுவதற்காக அவனைப் பரிசுத்தப்படுத்த, அவர்கள் அவனுடைய ஆடைகளைச் செய்ய வேண்டும்.
