  text: And you shall make settings of gold[a].
translation:
  language: ta
  text: தங்கத்தால் அலங்காரப் பதிப்பிடங்களைச் செய்வாயாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கப் பொருத்திடங்கள்’ அல்லது ‘தங்கச் சரிகை வேலைப்பாடுள்ள பதிப்பிடங்கள்.’ எபிரெயச் சொல் அலங்காரப் பதிப்பிடங்களைக் குறிக்கிறது; சுற்றியுள்ள வசனங்களில் சொல்லப்படும் கற்களையோ சங்கிலிகளையோ இணைப்பதற்கானவையாக இவை இருந்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָשִׂיתָ
  choice: செய்வாயாக
  rationale: அறிவுறுத்தல் தொடரில் வரும் இரண்டாம் நபர் ஆண்பால் ஒருமை வினை வடிவத்தை, நவீனத் தமிழில் இயல்பான கட்டளை நடையாக மொழிபெயர்க்கிறது. வְ இணைப்புச்சொல் தமிழில் தனியே வெளிப்படுத்தப்படாமல், தொடர்ச்சியான சூழலால் உணர்த்தப்படுகிறது.
- source_word: מִשְׁבְּצֹת
  choice: அலங்காரப் பதிப்பிடங்கள்
  rationale: இச்சொல் நகைக்கற்கள் அல்லது சங்கிலிகள் பொருத்தப்படும் அலங்கார அமைப்புகளைக் குறிக்கிறது. ‘பதிப்பிடங்கள்’ பொருத்தும் இடங்கள் என்ற கருத்தைக் காக்கிறது; ‘அலங்காரப்’ என்பது பொருளின் அலங்காரத் தன்மையைத் தெளிவாக்குகிறது, ஆனால் குறிப்பிட்ட கைவினை முறையைத் தேவையின்றி நிர்ணயிப்பதில்லை.
- source_word: זָהָב
  choice: தங்கத்தால்
  rationale: இந்தப் பதிப்பிடங்கள் தங்கத்தால் செய்யப்பட வேண்டும் என்பதைக் குறிக்கும் பொருள் உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
