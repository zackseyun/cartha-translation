  yaml_path: translation/ot/exodus/028/007.yaml
  text: It shall have two shoulder pieces joined to its two ends[b][a], so that it may be joined together.
translation:
  language: ta
  text: அதன் இரண்டு முனைகளோடும் இணைக்கப்பட்ட இரண்டு தோள்பட்டைகள்[a] அதற்கு இருக்க வேண்டும்; இவ்வாறு அது ஒன்றாக இணைக்கப்படும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தோள்பகுதிகள்.’ எபிரெயச் சொல் உடலின் தோள்களை அல்லாமல், தோளோடு தொடர்புடைய ஆடைப் பகுதிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் சொல்லுக்குச் சொல்லாக, ‘அது இணைக்கப்படும்.’ இறுதிக் கூற்று, இந்தத் தோள்பட்டைகள் மூலம் ஏபோத் ஒன்றாக இணைக்கப்படுவதைத் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: இரண்டு தோள்பட்டைகள்
  rationale: כְתֵפֹת என்பது இங்கு உடலின் தோள்களைக் குறிக்காமல், ஏபோத்தின் தோள்மேல் அமையும் ஆடைப் பகுதிகளைக் குறிக்கிறது. ‘தோள்பட்டைகள்’ என்பது தெளிவான இயல்பான தமிழாக்கம்.
- source_word: חֹבְרֹת
  choice: இணைக்கப்பட்ட
  rationale: חבר வேரின் பெண்பால் பன்மை வினையெச்சம்; தோள்பட்டைகள் ஆடையின் முனைகளோடு இணைந்திருப்பதைத் தெரிவிக்கிறது.
- source_word: יִהְיֶה לּוֹ
  choice: அதற்கு இருக்க வேண்டும்
  rationale: ל உடனான எபிரெய இருப்புக் கட்டமைப்பு உடைமையை உணர்த்துகிறது. தமிழில் இயல்பாகவும், மூலத்தின் கட்டமைப்புக்கு அருகிலும் ‘அதற்கு இருக்க வேண்டும்’ என வழங்கப்படுகிறது.
- source_word: שְׁנֵי קְצוֹתָיו
  choice: அதன் இரண்டு முனைகள்
  rationale: קָצֶה என்பது ஒரு பொருளின் எல்லை அல்லது முனையைக் குறிக்கும்; ஆடை அமைப்பில் ‘முனைகள்’ தெளிவாக உள்ளது.
- source_word: וְחֻבָּר
  choice: இவ்வாறு அது ஒன்றாக இணைக்கப்படும்
  rationale: חבר வேரின் செயப்பாட்டு வடிவத்தைப் பாதுகாக்கிறது. வாவ் இணைப்பை இங்கு விளைவைச் சுட்டுவதாக இயல்பான தமிழில் ‘இவ்வாறு’ என வெளிப்படுத்துகிறது.
