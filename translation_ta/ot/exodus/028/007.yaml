translation_notes:
  register: நவீன தரத் தமிழில், ஆடைத் தயாரிப்பு சூழலுக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. חבר என்ற ஒரே எபிரெய வேரின் மறுமொழி ‘இணைக்கப்பட்ட/இணைக்கப்படும்’ எனப் பாதுகாக்கப்பட்டது; இறுதிக் கூற்றின் விளைவு சார்ந்த தொடர்பும் வெளிப்படுத்தப்பட்டது.
