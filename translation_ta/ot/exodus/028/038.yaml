revisions:
- from: அது ஆரோனின் நெற்றியின்மேல் இருக்க வேண்டும். இஸ்ரவேலின் மகன்கள்[c] தங்களுடைய பரிசுத்தப் பொருட்களின் எல்லாக் கொடைகளாகப் பரிசுத்தமாக அர்ப்பணிப்பவற்றின் அக்கிரமத்தை ஆரோன் சுமப்பான்[a]. அது எப்போதும் அவனுடைய நெற்றியின்மேல் இருக்க வேண்டும்; யாவேக்கு முன்பாக அவர்கள் ஏற்றுக்கொள்ளப்படுவதற்காக அது அங்கே இருக்கும்[b].
  to: அது ஆரோனின் நெற்றியின்மேல் இருக்க வேண்டும். இஸ்ரவேல் மக்கள்[c] பரிசுத்தமாக அர்ப்பணிக்கும் பரிசுத்தப் பொருட்களின் அக்கிரமத்தை—அவர்களுடைய பரிசுத்தக் கொடைகள் அனைத்தோடும் தொடர்புடைய அக்கிரமத்தை—ஆரோன் சுமப்பான்[a]. அவர்கள் யாவேக்கு முன்பாக ஏற்றுக்கொள்ளப்படுவதற்காக, அது எப்போதும் அவனுடைய நெற்றியின்மேல் இருக்க வேண்டும்[b].
  rationale: The revision makes the difficult offerings phrase readable by retaining both ‘holy things’ and ‘all their holy gifts’ in an appositional relationship. This avoids resolving the syntax into a doctrinally or ritually narrower claim. It also corrects the Tamil description of the ‘bear iniquity’ idiom and removes redundant material not represented in the Hebrew.
