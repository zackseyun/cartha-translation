  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: ta
  text: அது ஆரோனின் நெற்றியின்மேல் இருக்க வேண்டும். இஸ்ரவேல் மக்கள்[c] பரிசுத்தமாக அர்ப்பணிக்கும் பரிசுத்தப் பொருட்களின் அக்கிரமத்தை—அவர்களுடைய பரிசுத்தக் கொடைகள் அனைத்தோடும் தொடர்புடைய அக்கிரமத்தை—ஆரோன் சுமப்பான்[a]. அவர்கள் யாவேக்கு முன்பாக ஏற்றுக்கொள்ளப்படுவதற்காக, அது எப்போதும் அவனுடைய நெற்றியின்மேல் இருக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குற்றத்தைச் சுமப்பான்.” “அக்கிரமத்தைச் சுமப்பது” என்ற எபிரெய மரபுத்தொடர், பரிசுத்தக் காணிக்கைகளுடன் தொடர்புடைய குற்றப்பொறுப்பைச் சுமப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுக்கு தயவு கிடைப்பதற்காக,” அல்லது “யாவேக்கு முன்பாக அவர்கள் ஏற்றுக்கொள்ளப்படும்படி.”
    reason: alternative_reading
  - marker: c
    text: எபிரெயத்தில் “இஸ்ரவேலின் மகன்கள்”; இது இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் வழக்கமான உடன்படிக்கைச் சொல்லாட்சி.
    reason: cultural_note
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: நெற்றி / அவனுடைய நெற்றி
  rationale: தலையின் முன்பகுதியைக் குறிக்கும் சொல்லுக்கு இயல்பான, தெளிவான நவீனத் தமிழ் இணை.
- source_word: נָשָׂא ... עֲוֺן
  choice: அக்கிரமத்தைச் சுமப்பான்
  rationale: குற்றப்பொறுப்பை ஏற்றுச் சுமத்தல் என்ற ஆசாரியச் சட்டப் பொருளைத் தீர்த்துவிடாமல், எபிரெய மரபுத்தொடரின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: הַקֳּדָשִׁים
  choice: பரிசுத்தப் பொருட்கள்
  rationale: வழிபாட்டில் தேவனுக்கென ஒதுக்கப்பட்ட காணிக்கைகள் அல்லது பொருட்கள் என்ற சடங்கியல் வகையைத் தெளிவாகக் குறிக்கிறது.
- source_word: יַקְדִּישׁוּ
  choice: பரிசுத்தமாக அர்ப்பணிப்பார்கள்
  rationale: தேவனுக்கெனப் பிரித்து அர்ப்பணிக்கும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் முறையாக ஆண்பால் அமைந்த உடன்படிக்கைச் சொல்லாட்சியைப் பாதுகாக்கிறது; அது ஒட்டுமொத்த இஸ்ரவேல் மக்களையும் குறிக்கும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: தங்களுடைய பரிசுத்தப் பொருட்களின் எல்லாக் கொடைகளாக
  rationale: கடினமான எபிரெய தொடரில் ‘கொடைகள்’ என்பதற்கும் ‘அவர்களுடைய பரிசுத்தப் பொருட்கள்’ என்பதற்கும் உள்ள உறவைச் சுருக்கித் தீர்மானிக்காமல் முடிந்தவரை பாதுகாக்கிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: தொடர்ந்து அங்கே இருக்க வேண்டிய தன்மையை எளிய நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לְרָצוֹן לָהֶם
  choice: அவர்கள் ஏற்றுக்கொள்ளப்படுவதற்காக
  rationale: மக்களையும் அவர்களுடைய அர்ப்பணிப்புகளையும் உள்ளடக்கக்கூடிய நோக்கம் அல்லது விளைவை இயல்பான தமிழில் கூறுகிறது; ‘தயவு கிடைப்பதற்காக’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: ஆரோன் ‘பரிசுத்தப் பொருட்களின் அக்கிரமத்தை’ சுமப்பதன் பொருள்
  choice: பரிசுத்த அர்ப்பணிப்புகளுடன் தொடர்புடைய அக்கிரமம் அல்லது குற்றப்பொறுப்பை ஆரோன் தன் ஆசாரியப் பிரதிநிதித்துவப் பணியில் சுமக்கிறான்.
  alternative: அவன் அந்தப் பாவத்தை நேரடியாக அகற்றுகிறான்; அல்லது இஸ்ரவேலின் பாவ நினைவை வெறுமனே அடையாளமாகத் தாங்குகிறான்.
  rationale: נָשָׂא עָוֺן என்ற மரபுத்தொடர் குற்றம் அல்லது அதற்கான பொறுப்பைச் சுமப்பதைக் குறிக்கலாம். ‘அக்கிரமத்தைச் சுமப்பான்’ என்பது பரிகாரத்தைப் பற்றிய ஒரு முழுக் கோட்பாட்டை வசனத்துக்குள் சேர்க்காமல் அந்த இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: ‘அவர்கள் ஏற்றுக்கொள்ளப்படுவதற்காக’ என்பதன் சுட்டுப்பொருள்
  choice: தங்கள் அர்ப்பணிப்புகளோடு தொடர்புடைய இஸ்ரவேல் மக்கள் யாவேக்கு முன்பாக ஏற்றுக்கொள்ளப்படுதல்.
  alternative: கொடைகள் மட்டுமே ஏற்றுக்கொள்ளப்படுதல்.
  rationale: ‘அவர்களுக்கு’ என்ற பன்மைப் பிரதிப்பெயர் இயல்பாக மக்களைச் சுட்டுகிறது; இருப்பினும் சூழலில் அவர்களுடைய கொடைகளும் இணைந்துள்ளன. மொழிபெயர்ப்பு இதை அளவுக்கு மீறிக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய dignified வேதாகம நடையைப் பயன்படுத்துகிறது. ‘பரிசுத்தம்,’ ‘அக்கிரமம்,’ ‘அர்ப்பணித்தல்’ போன்ற சடங்கியல் சொற்கள் சூழலின் சட்ட-ஆசாரியத் தன்மையைப் பாதுகாக்கின்றன; கடினமான எபிரெய தொடரை முழுமையாகச் சீராக்கி அதன் தெளிவின்மையை அழிக்காமல் வாசிக்கத்தக்க அமைப்பில் வழங்குகிறது.
