translation:
  language: ta
  text: தூய தங்கத்தால் இரண்டு சங்கிலிகளை, கயிறுபோல் முறுக்கப்பட்ட வேலைப்பாடாகச் செய்; அந்த முறுக்கப்பட்ட சங்கிலிகளைப் பதிப்புகளில் பொருத்து.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் கயிறுபோன்ற அல்லது முறுக்கப்பட்ட வேலைப்பாட்டைக் குறிக்கும் தொடர்புடைய இரண்டு சொற்றொடர்கள் பயன்படுத்தப்பட்டுள்ளன; அவற்றின் துல்லியமான தொழில்நுட்பப் பொருள் உறுதியற்றது.
    reason: lexical_alternative
  - marker: b
    text: “பதிப்புகள்” என்பதை “தாங்கிகள்,” “பொருத்துகள்,” அல்லது “தங்கப் பதிப்புகள்” என்றும் மொழிபெயர்க்கலாம்; இது ஆசாரிய உடையில் இணைக்கப்பட்ட தங்கச் சட்டகங்களைக் குறிக்கிறது.
    reason: lexical_alternative
