base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: ta
  text: ஆரோனும் அவன் மகன்களும் அவற்றை அணிந்திருக்க வேண்டும். அவர்கள் சந்திப்புக் கூடாரத்திற்குள் நுழையும்போதோ, பரிசுத்த இடத்தில் பணிவிடை செய்வதற்காகப் பலிபீடத்தை அணுகும்போதோ, குற்றத்தைச் சுமந்து இறக்காதபடி அவற்றை அணிந்திருக்க வேண்டும்.[a] இது அவனுக்கும் அவனுக்குப் பின் அவன் சந்ததிக்கும் நிரந்தர நியமமாக இருக்கும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குற்றத்துக்கு ஆளாகி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத்தில் சொல்லுக்குச் சொல் ‘குற்றத்தைச் சுமந்து’ என்பது சட்ட-வழிபாட்டுச் சூழலுக்குரிய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘என்றென்றும் நிலைக்கும் நியமம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל
  choice: அணிந்திருக்க வேண்டும்
  rationale: சொல்லுக்குச் சொல் ‘மேல் இருக்க வேண்டும்’ என்றாலும், முந்தைய வசனத்தில் கூறப்பட்ட ஆடைகள் ஆரோனும் அவன் மகன்களும் அணிந்திருக்க வேண்டியதை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இறைவன் தம் மக்களைச் சந்திக்கும் வழிபாட்டு அமைப்பைக் குறிக்கும் எபிரெயப் பெயரின் பொருளையும் கூடாரச் சூழலையும் காக்கிறது.
- source_word: בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: பலிபீடத்தை அணுகும்போது
  rationale: ஆசாரியப் பணியில் பரிசுத்தமான பொருளருகே வருவதைக் குறிக்கும் נגשׁ என்பதன் வழிபாட்டுச் சிறப்பை ‘அணுகு’ காக்கிறது.
- source_word: לְשָׁרֵת
  choice: பணிவிடை செய்வதற்காக
  rationale: பொதுவான சேவையைவிட, ஆசாரியர் ஆற்றும் வழிபாட்டுப் பணியைத் தெளிவாகவும் மரியாதையான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: சொல்லின் பரிசுத்தத் தன்மையை நேரடியாகக் காக்கிறது; இது பரிசுத்தப் பகுதி அல்லது திருத்தலத்தைக் குறிக்கக்கூடிய சூழல்சார் விரிவை தேவையின்றி குறுக்கவில்லை.
- source_word: וְלֹא יִשְׂאוּ עָוֹן
  choice: குற்றப்பழியைச் சுமந்து சாகாதபடி
  rationale: ‘குற்றத்தைச் சுமத்தல்/சுமத்திக்கொள்ளல்’ என்ற சட்ட-வழிபாட்டு மரபுத்தொடரின் தீவிரத்தைத் தக்கவைத்து, தடுப்பு நோக்கத்தையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חֻקַּת עוֹלָם
  choice: நிரந்தர நியமம்
  rationale: சட்டக் கட்டளையின் தொடர்ச்சியான, நிலையான இயல்பை நவீனத் தமிழில் தெளிவாகக் கூறுகிறது; கால அளவைத் தேவையின்றி தத்துவ ரீதியாக வரையறுக்கவில்லை.
- source_word: זַרְעוֹ
  choice: அவன் சந்ததி
  rationale: எபிரெயத்தில் ஒருமை வடிவில் வரும் கூட்டுப் பொருளை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: முறையான ஆசாரிய உடையின்றி அணுகுவதற்கான தண்டனைக் கூற்று
  choice: உடைகளை அணியாததால் அவர்கள் குற்றப்பழியைச் சுமந்து இறக்க நேரிடும் உண்மையான விளைவைக் கூறும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்கள் குற்றத்துக்கு ஆளாகி இறந்துவிடாதபடி’ என்று மேலும் விளக்கமாக மொழிபெயர்க்கலாம்.
  rationale: மூல எபிரெயம் பரிசுத்தத்தை மீறுவதோடு தொடர்புடைய சட்ட-வழிபாட்டு குற்றப்பொறுப்பையும் மரணத்தையும் இணைக்கிறது. அதன் தீவிரத்தைக் குறைக்காமலும், அதன் இயல்பைத் தனிப்பட்ட கோட்பாட்டால் விளக்காமலும் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வழிபாட்டுச் சூழலின் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அணிந்திருக்க வேண்டும்’ என்பது எபிரெயத்தின் ‘அவர்கள் மேல் இருக்க வேண்டும்’ என்ற அமைப்பை இயல்பான தமிழாக்கமாக்குகிறது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; இரண்டாவது வாக்கியத்தில் ‘அவற்றை அணிந்திருக்க வேண்டும்’ என மீண்டும் கூறுவது தொடர்பைத் தெளிவாக்குகிறது.
