review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the referent as the priestly garments and preserves the temporal clauses, sacred-service setting, guilt/liability idiom, death consequence, and enduring ordinance. However, its opening construction makes the garments grammatically appear to be the ones doing the wearing, rather than being worn by Aaron and his sons. The revised wording makes the Hebrew relation explicit without adding interpretation.
  naturalness: ‘அவை ஆரோனும் அவன் மகன்களும் அணிந்திருக்க வேண்டும்’ is syntactically awkward in modern Tamil, since the compound subject can be read as the garments wearing something. ‘குற்றப்பழியைச் சுமந்து சாகாதபடி’ is also less idiomatic and mixes a redundant expression with a relatively colloquial verb. The revision uses clear, formal modern Tamil.
  terminology: ‘சந்திப்புக் கூடாரம்,’ ‘பலிபீடம்,’ ‘பரிசுத்த இடம்,’ ‘பணிவிடை,’ ‘நிரந்தர நியமம்,’ and ‘சந்ததி’ are suitable and consistent with the cultic/legal register. ‘குற்றத்தைச் சுமந்து’ retains the Hebrew legal-cultic idiom more directly than ‘குற்றப்பழியைச் சுமந்து.’
  issues:
  - severity: medium
    issue: Opening clause has an unclear grammatical subject
    rationale: The Hebrew says that the garments are to be on Aaron and his sons. In Tamil, ‘அவை ஆரோனும் அவன் மகன்களும் அணிந்திருக்க வேண்டும்’ can construe ‘அவை’ as the subject and ‘ஆரோனும் அவன் மகன்களும்’ as an awkward coordinated complement. Recasting Aaron and his sons as the explicit wearers conveys the intended relation clearly.
  - severity: low
    issue: Penalty clause is stylistically and lexically awkward
    rationale: ‘குற்றப்பழி’ is somewhat redundant, and ‘சாகாதபடி’ is less fitting for the formal legal-cultic register. ‘குற்றத்தைச் சுமந்து இறக்காதபடி’ is direct, natural, and preserves the idiom and consequence.
  revised_text: ஆரோனும் அவன் மகன்களும் அவற்றை அணிந்திருக்க வேண்டும். அவர்கள் சந்திப்புக் கூடாரத்திற்குள் நுழையும்போதோ, பரிசுத்த இடத்தில் பணிவிடை செய்வதற்காகப் பலிபீடத்தை அணுகும்போதோ, குற்றத்தைச் சுமந்து இறக்காதபடி அவற்றை அணிந்திருக்க வேண்டும்.[a] இது அவனுக்கும் அவனுக்குப் பின் அவன் சந்ததிக்கும் நிரந்தர நியமமாக இருக்கும்.[b]
