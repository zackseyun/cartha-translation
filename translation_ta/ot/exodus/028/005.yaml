  rationale: திருவாசஸ்தலச் சூழலில் இச்சொல் உயர்தர மெல்லிய சணல் நாரால் செய்யப்பட்ட துணி அல்லது நூற்பொருளைக் குறிக்கிறது; ‘நார்ப்பட்டு’ நவீன வாசகருக்கு பட்டுப்பூச்சிப் பட்டு என்று தவறாகப் புரியாதவாறு நாரால் ஆன நுண்ணிய துணியைச் சுட்டுகிறது.
