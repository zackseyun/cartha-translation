- source_word: וְהֵם
  choice: அவர்கள்
  rationale: தனித்துப் பயன்படுத்தப்பட்ட எபிரெயப் பெயர்ப்பதிலி, முந்தைய சூழலில் குறிப்பிடப்பட்ட கைவினைஞர்களை வெளிப்படையான எழுவாயாக வலியுறுத்துகிறது; தமிழில் இயல்பான அளவில் இதைத் தக்கவைக்கிறது.
- source_word: יִקְחוּ
  choice: எடுத்துக்கொள்ள வேண்டும்
  rationale: இந்த இறந்தகாலமல்லாத வினைவடிவு, திருவாசஸ்தலப் பணிகளுக்கான அறிவுறுத்தல் சூழலில் கட்டளை சார்ந்த பொருளைக் கொண்டுள்ளது; ‘வேண்டும்’ அதன் வழிகாட்டும் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַזָּהָב
  choice: தங்கத்தையும்
  rationale: குறிப்பிட்ட ஆசாரிய உடைகளுக்காக ஒதுக்கப்பட்ட பொருளைக் குறிக்கும் எபிரெயச் சுட்டை, பட்டியலின் சூழலில் தமிழ் வேற்றுமை உருபுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַתְּכֵלֶת
  choice: நீலநிற நூலையும்
  rationale: இந்தச் சொல் வெறும் நிறத்தை மட்டுமல்லாமல் அந்த நிறத்தில் சாயமிடப்பட்ட நெசவுப் பொருளையும் குறிக்கும்; உடை தயாரிக்கும் சூழலில் ‘நூல்’ என்பது பொருளைத் தெளிவாக்குகிறது.
- source_word: הָאַרְגָּמָן
  choice: ஊதாநிற நூலையும்
  rationale: ஊதா நிறத்தில் சாயமிடப்பட்ட நெசவுப் பொருளைக் குறிக்கிறது; இணையான பட்டியல் அமைப்பையும் உடைத் தயாரிப்பு சூழலையும் கருத்தில் கொண்டு ‘நூல்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: கருஞ்சிவப்பு நூலையும்
  rationale: பூச்சியிலிருந்து பெறப்பட்ட சாயத்தால் நிறமூட்டப்பட்ட செந்நிற நெசவுப் பொருளைக் குறிக்கும் மரபுத்தொடர்; நவீன தமிழில் ‘கருஞ்சிவப்பு நூல்’ அதன் நிறத்தையும் பயன்பாட்டையும் தெளிவாகத் தருகிறது.
- source_word: הַשֵּׁשׁ
