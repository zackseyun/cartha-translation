  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
translation:
  language: ta
  text: அவர்கள் தங்கத்தையும், நீலநிற நூலையும்[a], ஊதாநிற நூலையும், கருஞ்சிவப்பு நூலையும்[b], மெல்லிய சணல் துணியையும் எடுத்துக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொற்கள் வெறும் நீலம், ஊதா ஆகிய நிறங்களை மட்டுமல்லாமல், அவ்வண்ணம் சாயமிடப்பட்ட நூல் அல்லது நெசவுப் பொருளையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயில், ‘கருஞ்சிவப்புப் புழு’ எனும் மரபுத்தொடர் உள்ளது. இது பூச்சியிலிருந்து பெறப்பட்ட சாயத்தால் நிறமூட்டப்பட்ட கருஞ்சிவப்பு நூற்பொருளைக் குறிக்கிறது.
    reason: cultural_note
