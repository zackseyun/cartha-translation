translation:
  language: ta
  text: விபசாரம் செய்யாதே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא
  choice: செய்யாதே
  rationale: எபிரெய மொழியின் நிலையான மறுப்புச் சொல்லான לֹא, இரண்டாம் நபர் ஒருமை வினையுடன் சேர்ந்து உறுதியான தடையை வெளிப்படுத்துகிறது. தமிழில் எதிர்மறை ஏவல் வடிவமான ‘செய்யாதே’ இதை இயல்பாகவும் நேரடியாகவும் தருகிறது.
- source_word: תִּנְאָף
  choice: விபசாரம் செய்
  rationale: נָאַף என்ற வினை கால் வடிவில் திருமண உறுதிப்பாட்டை மீறிய பாலுறவாகிய விபசாரத்தைச் செய்வதைக் குறிக்கிறது. ‘விபசாரம் செய்’ என்பது நவீனத் தமிழில் தெளிவான, நிலைபெற்ற சட்ட-அறநெறிசார் இணைச்சொல்.
theological_decisions:
- issue: பத்துக் கட்டளைகளின் தடை மொழிநடை
  choice: விபசாரம் செய்யாதே.
  alternative: நீ விபசாரம் செய்யக்கூடாது.
  rationale: לֹא + இரண்டாம் நபர் ஒருமை முற்றுப்பெறா வினை உடன்படிக்கைச் சட்டத்தில் உறுதியான தடையைத் தருகிறது. ‘செய்யாதே’ என்பது தமிழில் சுருக்கமாகவும் கண்ணியமாகவும் கட்டளையின் நேரடி வலிமையைப் பாதுகாக்கிறது; ‘செய்யக்கூடாது’ என்பதும் சாத்தியமானது, ஆனால் இங்கு சற்றுக் குறைவான நேரடித்தன்மை கொண்டது.
- issue: ஆண்பால் ஒருமை வினைவடிவத்தின் பயன்பாட்டு எல்லை
  choice: பாலினத்தைக் குறிப்பிடாத தமிழ் இரண்டாம் நபர் ஒருமை எதிர்மறை ஏவல்
  alternative: ஆணை மட்டும் வெளிப்படையாகக் குறிக்கும் சொற்களைச் சேர்த்தல்
  rationale: எபிரெய வினை இலக்கணத்தில் ஆண்பால் ஒருமையாக இருந்தாலும், பத்துக் கட்டளையின் உடன்படிக்கை முகவரி பிரதிநிதித்துவமானது. தமிழ் ‘செய்யாதே’ பாலினத்தைக் கூடுதலாக வரையறுக்காமல் ஒருமை நேரடி முகவரியையும் கட்டளையின் நோக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குத் தெளிவானதும் பத்துக் கட்டளைக்கேற்ற சுருக்கமான கண்ணியமும் கொண்டதும். மூலத்தின் ஒருமை நேரடி முகவரி தமிழ் வினைவடிவத்தில் பாதுகாக்கப்பட்டுள்ளது.
