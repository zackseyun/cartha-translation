  yaml_path: translation/ot/exodus/020/008.yaml
  text: Remember the Sabbath day[a], to keep it holy.
translation:
  language: ta
  text: ஓய்வுநாளைப் பரிசுத்தப்படுத்துவதற்காக அதை நினைவில் கொள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைப் பரிசுத்தமானதாகத் தனியே ஒதுக்கிவைப்பதற்காக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: நினைவில் கொள்
  rationale: זכר என்ற வினையின் ஆண்பால் ஒருமை கட்டளை வடிவம் இது. வெறுமனே மனத்தில் தோன்றுவதை அல்லாமல், உடன்படிக்கைக்குரிய செயற்பூர்வமான நினைவுகூருதலைத் தெரிவிக்கிறது.
- source_word: אֶת
  choice: '[நேரடி செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரெயத்தில் வரையறுக்கப்பட்ட நேரடி செயப்படுபொருளைக் குறிக்கிறது; தமிழில் இதற்குத் தனிச்சொல் தேவையில்லை.
- source_word: יוֹם הַשַּׁבָּת
  choice: ஓய்வுநாள்
  rationale: குறிப்பிட்ட உடன்படிக்கைக்குரிய சபாத்து நாளைக் குறிக்கிறது. ‘ஓய்வுநாள்’ என்பது שַׁבָּת என்பதன் ஓய்தல் அல்லது வேலையை நிறுத்துதல் என்ற அடிப்படைப் பொருளையும் தமிழில் நிலைபெற்ற வேதாகமப் பயன்பாட்டையும் தக்கவைக்கிறது.
- source_word: לְקַדְּשׁוֹ
  choice: அதைப் பரிசுத்தப்படுத்துவதற்காக
  rationale: קדשׁ வேரிலிருந்து வந்த நோக்கம் அல்லது விளைவைச் சுட்டும் infinitive construct; மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு ஓய்வுநாளைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு நாளைப் புனிதமானதாகக் கருதி தனியே ஒதுக்கிவைக்கும் கருத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ஓய்வுநாளைப் பற்றிய கட்டளையில் קדשׁ என்ற பரிசுத்த மொழியை மொழிபெயர்த்தல்
  choice: அதைப் பரிசுத்தப்படுத்துவதற்காக
  alternative: அதைப் பரிசுத்தமானதாகத் தனியே ஒதுக்கிவைப்பதற்காக
  rationale: எபிரெயச் சொல் அந்த நாளைப் புனிதமானதாக ஆக்குதல் அல்லது நடத்துதல், அதைப் பரிசுத்தமானதாகத் தனியே ஒதுக்கிவைத்தல் ஆகிய நெருக்கமான கருத்துகளைத் தாங்குகிறது. முதன்மைத் தேர்வு மூலத்தின் நோக்க அமைப்பையும் இறையியல் கனத்தையும் காக்கிறது; அடிக்குறிப்பு அதன் பொருள் வரம்பை விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கட்டளை நடையைப் பயன்படுத்துகிறது. ‘நினைவில் கொள்’ செயற்பூர்வமான நினைவுகூருதலைக் காட்டுகிறது; ‘பரிசுத்தப்படுத்து’ மூலத்தின் קדשׁ மொழியையும் அதன் திறந்த பொருள் வரம்பையும் பாதுகாக்கிறது.
