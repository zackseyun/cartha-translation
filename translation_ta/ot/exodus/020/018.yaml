source:
  edition: WLC
  text: וְ/כָל הָ/עָם֩ רֹאִ֨ים אֶת הַ/קּוֹלֹ֜ת וְ/אֶת הַ/לַּפִּידִ֗ם וְ/אֵת֙ ק֣וֹל הַ/שֹּׁפָ֔ר וְ/אֶת הָ/הָ֖ר עָשֵׁ֑ן וַ/יַּ֤רְא הָ/עָם֙ וַ/יָּנֻ֔עוּ וַ/יַּֽעַמְד֖וּ מֵֽ/רָחֹֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: ta
  text: மக்கள் அனைவரும் இடிமுழக்கங்களையும்[a], தீப்பிழம்புகளையும்[b], எக்காளத்தின் ஓசையையும், புகைந்துகொண்டிருந்த மலையையும் கண்டுகொண்டிருந்தார்கள்[c]. மக்கள் அவற்றைக் கண்டபோது நடுங்கி, தொலைவில் நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, ‘ஒலிகள்’ அல்லது ‘குரல்கள்’; இச்சூழலில் இது இடிமுழக்கங்களைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தீவட்டிகள்’; இச்சூழலில் மின்னலைப் போன்ற தீ ஒளிவீச்சுகளைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: c
    text: ஒலியும் இதில் அடங்கியிருந்தாலும், மக்கள் இந்நிகழ்வுகளைக் ‘கண்டுகொண்டிருந்தார்கள்’ என்றே எபிரெயம் கூறுகிறது; இக்காட்சி எல்லாப் புலன்களையும் ஆட்கொண்ட தீவிரத்தை இது காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: கண்டுகொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்நிலை உணர்வை வெளிப்படுத்துகிறது. ஒலிகளும் இதன் செயப்படுபொருள்களில் அடங்குவதால், மூலத்தின் புலன்கலந்த தீவிரமான காட்சியை இயன்றவரை அப்படியே காக்கிறது.
- source_word: הַקּוֹלֹת
  choice: இடிமுழக்கங்கள்
  rationale: இதன் நேரடிப் பொருள் ‘ஒலிகள்’ அல்லது ‘குரல்கள்’; ஆனால் சீனாய் மலையின் இந்தச் சூழலில் இது இடிமுழக்கங்களைக் குறிப்பதாகப் பொருள் கொள்வது இயல்பானது.
- source_word: הַלַּפִּידִם
  choice: தீப்பிழம்புகள்
  rationale: நேரடியாக ‘தீவட்டிகள்’ எனப் பொருள்படக்கூடிய சொல்; இத்தெய்வத் தோற்றச் சூழலில் மின்னலைப் போன்ற தீ ஒளிவீச்சுகளைக் குறிக்கிறது. ‘தீப்பிழம்புகள்’ அதன் தீ சார்ந்த காட்சியுருவைக் காக்கிறது.
- source_word: קוֹל הַשֹּׁפָר
  choice: எக்காளத்தின் ஓசை
  rationale: கொம்பினால் செய்யப்பட்ட ஊதுகருவியின் ஒலியைக் குறிக்கும் கட்டமைப்பை நெருக்கமாகவும், நவீனத் தமிழில் புரியும்படியும் தருகிறது.
- source_word: הָהָר עָשֵׁן
  choice: புகைந்துகொண்டிருந்த மலை
  rationale: மலை புகை எழுப்பிக்கொண்டிருந்த உயிரோட்டமான காட்சியைத் தொடர்நிலை வடிவில் வெளிப்படுத்துகிறது.
- source_word: וַיַּרְא הָעָם
  choice: மக்கள் அவற்றைக் கண்டபோது
  rationale: முன்பு பட்டியலிடப்பட்ட நிகழ்வுகள் அனைத்தையும் கூட்டாகச் சுட்டி, அவற்றைத் தொடர்ந்து வந்த மக்களின் எதிர்வினையை இயல்பான தமிழில் இணைக்கிறது.
- source_word: וַיָּנֻעוּ
  choice: நடுங்கி
  rationale: அச்சத்தால் குலுங்குதல் அல்லது அசைதல் என்ற பொருளை இச்சூழலில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: தொலைவில் நின்றார்கள்
  rationale: அச்சத்தால் விலகி நின்ற இடநிலையை மூலத்திற்கு நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְכָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: திரண்டிருந்த மக்கள் முழுவதையும் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
theological_decisions:
- issue: கேட்கக்கூடிய நிகழ்வுகளையும் மக்கள் ‘கண்டார்கள்’ என்று கூறும் புலன்கலந்த மொழி
  choice: ‘கண்டுகொண்டிருந்தார்கள்’ என்பதை வைத்திருந்து, மூலத்தின் புலன்கலந்த காட்சியைப் பாதுகாத்தல்
  alternative: ‘இடிமுழக்கங்களைக் கேட்டார்கள்’ அல்லது ‘இவற்றை உணர்ந்தார்கள்’ என்று புலன்களைத் தனித்தனியாக இயல்பாக்குதல்
  rationale: இறைத்தோற்றத்தின் திகைப்பூட்டும் முழுமையை எபிரெய உரை ஒலி உட்பட அனைத்தையும் மக்கள் ‘காண்பதாக’ விவரிக்கிறது. அதைச் சீராக்கி அதன் பதற்றத்தை நீக்காமல் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கண்டுகொண்டிருந்தார்கள்’ என்ற வடிவம் சற்றே அசாதாரணமாகத் தோன்றினாலும், மூல எபிரெயத்தின் தொடர்நிலையையும் ஒலி-காட்சி கலப்பையும் நோக்கத்துடன் காக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் தொடர்புடைய சொற்களுக்குப் பின்னர் இடப்பட்டுள்ளன.
