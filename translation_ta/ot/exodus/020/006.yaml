  yaml_path: translation/ot/exodus/020/006.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: ta
  text: ஆனால், ஆயிரங்களுக்கு[a] மாறாத அன்பைக் காட்டுகிறேன்—என்னை நேசித்து என் கட்டளைகளைக் கடைப்பிடிப்பவர்களுக்கு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆயிரம் தலைமுறைகளுக்கு” (உபாகமம் 5:10-ஐ ஒப்பிடுக); இங்கே எபிரெய உரை சொற்சொல்லாக “ஆயிரங்களுக்கு” என்று மட்டுமே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: ஆனால் ... காட்டுகிறேன்
  rationale: முந்தைய வசனத்தின் தண்டனைக்குரிய கூற்றுக்கு எதிர்மாறான தொடர்ச்சியைச் சூழல் காட்டுவதால் וְ என்பதை இயல்பான தமிழில் ‘ஆனால்’ என வழங்குகிறது; עֹשֶׂה என்பதன் செயற்பொருள் ‘காட்டுகிறேன்’ என வெளிப்படுகிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: חֶסֶד என்பது உறுதியான, பற்றுறுதியுள்ள அன்பையும் இரக்கநிறைந்த நன்மையையும் குறிக்கிறது. ‘மாறாத அன்பு’ அதன் நிலைத்த தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לַאֲלָפִים
  choice: ஆயிரக்கணக்கானோருக்கு
  rationale: எபிரெய உரையில் ‘தலைமுறைகள்’ என்ற சொல் வெளிப்படையாக இல்லை; ஆகவே பன்மையான ‘ஆயிரங்களுக்கு’ என்ற வடிவத்தை மனிதர்களைக் குறிக்கும் இயல்பான தமிழில் ‘ஆயிரக்கணக்கானோருக்கு’ என வழங்குகிறது.
- source_word: לְאֹהֲבַי
  choice: என்னிடம் அன்புகூர்ந்து
  rationale: முதலாம் நபர் பின்னொட்டுடன் வரும் பங்கேற்புவினையை, தொடர்ந்து அன்புகூருவோரைக் குறிக்கும் இயல்பான தமிழ் உறவுத்தொடராக வழங்குகிறது.
- source_word: וּלְשֹׁמְרֵי
  choice: கடைப்பிடிப்பவர்களில்
  rationale: கட்டளைகளைப் பொருளாகக் கொண்ட שׁמר என்பது ‘காத்தல், கடைப்பிடித்தல்’ எனப் பொருள்படும்; இங்கு ‘கடைப்பிடித்தல்’ சட்டப்பூர்வச் சூழலுக்கு இயல்பானது. ‘-வர்களில்’ என்பது ‘ஆயிரக்கணக்கானோர்’ யார் என்பதைத் தெளிவாக்குகிறது.
- source_word: מִצְוֺתָי
  choice: என் கட்டளைகளை
  rationale: מִצְוָה என்பதன் உடன்படிக்கை மற்றும் சட்டச் சார்ந்த பொருளை ‘கட்டளை’ துல்லியமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: לַאֲלָפִים என்பதன் வரம்பு
  choice: ஆயிரக்கணக்கானோருக்கு
  alternative: ஆயிரம் தலைமுறைகளுக்கு
  rationale: இந்த வசனத்தின் எபிரெய உரையில் ‘தலைமுறைகள்’ என்பது இல்லை. எனவே மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் முதன்மை உரை பாதுகாக்கிறது; உபாகமம் 5:10 போன்ற இணை உரைகளின் அடிப்படையில் தலைமுறைகள் உட்கருத்தாக இருக்கலாம் என்ற புரிதல் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘மாறாத அன்பு’ என்பது חֶסֶד என்பதன் நிலைத்த, பற்றுறுதியுள்ள அன்பை சமயப்பிரிவு சார்ந்த தனிச்சொற்கள் இன்றி தெரிவிக்கிறது.
