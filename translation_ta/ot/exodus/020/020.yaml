base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: ta
  text: மோசே மக்களிடம், “பயப்படாதீர்கள்[a]. உங்களைச் சோதிப்பதற்காகவும், நீங்கள் பாவம் செய்யாதபடி அவருக்குரிய பயம்[b] உங்கள் முன் இருக்க வேண்டும்[c] என்பதற்காகவும் கடவுள் வந்திருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அஞ்சாதீர்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் எபிரெயச் சொல்வேரே பின்னர் ‘அவருக்குரிய பயம்’ என்பதிலும் வருகிறது; திகிலடையும் பயத்துக்கும் கடவுளுக்குரிய பயத்துக்கும் இடையிலான நோக்கமுள்ள வேறுபாட்டை இது உருவாக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவரிடம் பயபக்தி’ என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பெயர்ச்சொல் திகிலான பயத்தையும் பயபக்தியுடன் கூடிய வியப்பையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், ‘உங்கள் முகங்களின்மேல்.’ ஒருவர் தம் நினைவில் தொடர்ந்து வைத்திருக்கும் ஒன்றைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: பயப்படாதீர்கள்
  rationale: יִרְאָה என்ற ஒரே எபிரெய வேர் பின்னர் வரும் ‘அவரைப் பற்றிய பயம்’ என்பதிலும் ஒலிப்பதால், திடீர் அச்சத்துக்கும் கடவுளுக்குரிய நிலையான பயத்துக்கும் இடையிலான நோக்கமுள்ள முரண்பாட்டை இது காக்கிறது.
- source_word: לְבַעֲבוּר
  choice: …பதற்காகவும்
  rationale: இரண்டு இடங்களிலும் நோக்கத்தைக் குறிக்கும் இச்சொற்றொடரை இயல்பான தமிழ் நோக்க விகுதியால் மொழிபெயர்த்துள்ளது.
- source_word: נַסּוֹת
  choice: சோதிப்பதற்காக
  rationale: נסה என்பது ஒருவரைச் சோதித்து அல்லது பரிசோதித்து உண்மைநிலையை வெளிப்படுத்துவதைக் குறிக்கும்; தீமைக்குத் தூண்டுதல் என்ற கருத்தைச் சேர்க்காமல் ‘சோதித்தல்’ இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: בָּא
  choice: வந்திருக்கிறார்
  rationale: சீனாய் நிகழ்வில் கடவுளின் வருகை நிகழ்ந்து அதன் விளைவு தற்போதும் நிலவுவதைத் தமிழ் நிறைவுநிலை வடிவம் இயல்பாகக் காட்டுகிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கும் பொதுவான தெய்வப் பெயர் பயன்படுத்தப்பட்டுள்ளது; தமிழில் ‘கடவுள்’ நேரான, இயல்பான இணைச்சொல்.
- source_word: יִרְאָתוֹ
  choice: அவரைப் பற்றிய பயம்
  rationale: יִרְאָה என்பது பயத்தையும் பயபக்தியையும் குறிக்கக்கூடும். ‘பயம்’ என்பது தொடக்கத்திலுள்ள ‘பயப்படாதீர்கள்’ என்பதுடன் உள்ள சொல்வேர் தொடர்பையும் பொருளியல் இழுபறியையும் காக்கிறது.
- source_word: עַל־פְּנֵיכֶם
  choice: உங்கள் முன்
  rationale: சொல்லுக்குச் சொல் ‘உங்கள் முகங்களின்மேல்’ என்றாலும், ஒருவர் எப்போதும் உணர்வில் வைத்திருக்க வேண்டிய ஒன்றைக் குறிக்கும் எபிரெய மரபுத்தொடரை ‘உங்கள் முன்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: நீங்கள் பாவம் செய்யாதபடி
  rationale: எதிர்மறை நோக்கத்தை இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘பயப்படாதீர்கள்’ என்பதற்கும் ‘அவரைப் பற்றிய பயம்’ என்பதற்கும் இடையிலான தோற்ற முரண்பாடு
  choice: இரு இடங்களிலும் ‘பயம்’ என்ற ஒரே தமிழ்ச் சொல்வேரைப் பயன்படுத்துதல்
  alternative: முதல் இடத்தில் ‘அஞ்சாதீர்கள்’ என்றும் இரண்டாம் இடத்தில் ‘அவரிடம் பயபக்தி’ என்றும் மொழிபெயர்த்தல்
  rationale: எபிரெயம் திகிலூட்டும் அச்சத்தையும் கடவுளுக்குரிய பயத்தையும் ஒரே சொல்வேரால் வேறுபடுத்துகிறது. அதை விளக்கத்தின் மூலம் நீக்காமல் மூலத்தின் இறையியல் இழுபறியை முதன்மை உரை பாதுகாக்கிறது.
- issue: கடவுள் செய்வதாகக் கூறப்படும் ‘சோதனை’யின் இயல்பு
  choice: தீமைக்குத் தூண்டுதல் என்ற கருத்தைச் சேர்க்காமல் ‘சோதித்தல்’ என்று மொழிபெயர்த்தல்
  alternative: புடமிடுதல்; பரிசோதித்தல்
  rationale: மக்கள் பாவம் செய்யாமல் இருப்பதே கூறப்பட்ட நோக்கம். ஆகவே மூலத்தில் இல்லாத தீமைக்கான தூண்டுதல் என்ற பொருளைச் சேர்க்காமல் சோதித்து வெளிப்படுத்தும் கருத்தை மட்டும் மொழிபெயர்ப்பு தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கொண்டுள்ளது. ‘பயப்படாதீர்கள்/பயம்’ என்ற சொல்வேர் மீளுருவாக்கம் மூலத்தின் சொல்விளையாட்டையும் இறையியல் இழுபறியையும் காக்கிறது; எபிரெய மரபுத்தொடர் முதன்மை உரையில் இயல்பாகவும் அடிக்குறிப்பில் சொல்லுக்குச் சொல்லாகவும் தரப்பட்டுள்ளது.
