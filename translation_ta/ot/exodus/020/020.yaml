- from: மோசே மக்களிடம், “பயப்படாதீர்கள்[a]. உங்களைச் சோதிப்பதற்காகவும், நீங்கள் பாவம் செய்யாதபடி அவரைப் பற்றிய பயம்[b] உங்கள் முன் இருக்க வேண்டும்[c] என்பதற்காகவும் கடவுள் வந்திருக்கிறார்” என்றார்.
  to: மோசே மக்களிடம், “பயப்படாதீர்கள்[a]. உங்களைச் சோதிப்பதற்காகவும், நீங்கள் பாவம் செய்யாதபடி அவருக்குரிய பயம்[b] உங்கள் முன் இருக்க வேண்டும்[c] என்பதற்காகவும் கடவுள் வந்திருக்கிறார்” என்றார்.
