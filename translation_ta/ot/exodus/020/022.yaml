source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: ta
  text: 'பின்பு யாவே மோசேயிடம், “நீ இஸ்ரவேல் மக்களிடம் இவ்வாறு சொல்ல வேண்டும்: வானத்திலிருந்து நான் உங்களோடு பேசியதை நீங்களே கண்டீர்கள்” என்றார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட தனிப்பெயர் வடிவில் நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரைத் தெரிவிக்கிறது; பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றவில்லை.
- source_word: וַיֹּאמֶר
  choice: பின்பு ... என்றார்
  rationale: வாவ் தொடர்வினையின் கதை முன்னேற்றத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֹּה תֹאמַר
  choice: இவ்வாறு சொல்ல வேண்டும்
  rationale: தூதுச் செய்திக்குரிய கட்டளைச் சூத்திரத்தின் முறையான தொனியையும் கடமைப் பொருளையும் காக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் இயல்பான தமிழ் கூட்டுப்பெயர்; பாலினத்தைக் குறித்துத் தவறான வரம்பை உருவாக்குவதில்லை.
- source_word: אַתֶּם
  choice: நீங்களே
  rationale: தனியே இடம்பெறும் எபிரெயப் பிரதிப்பெயரின் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ விகுதி இயல்பாக எடுத்துரைக்கிறது.
- source_word: רְאִיתֶם
  choice: கண்டீர்கள்
  rationale: நிகழ்ந்து முடிந்த சம்பவத்தை நேரடியாகக் கண்ட சாட்சியைக் குறிக்கும் எளிய இறந்தகாலம் தமிழில் இயல்பானது.
- source_word: מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: எபிரெயில் வடிவம் பன்மையாக இருந்தாலும் இச்சூழலில் தமிழ் வழக்கில் ஒருமையான ‘வானம்’ இயல்பாகப் பொருளைத் தருகிறது.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: உங்களோடு பேசினேன்
  rationale: עִם என்பதன் ‘உடன்/ஓடு’ பொருளைப் பாதுகாத்து, தேவனுக்கும் மக்களுக்கும் இடையிலான நேரடி சந்திப்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர் வடிவில் தருகிறது. ‘யாவே’ என்பது மூல உச்சரிப்புக்கு நெருக்கமான மாற்று எழுத்துப்பெயர்ப்பு.
- issue: בְּנֵי יִשְׂרָאֵל என்ற சமூகப் பெயர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலர்
  rationale: சொற்றொடரின் இலக்கண வடிவம் ஆண்பால் பன்மை என்றாலும் இங்கு முழுச் சமூகத்தையும் கூட்டாகக் குறிக்கிறது; இயல்பான தமிழில் அதன் பரப்பைத் தெளிவாகக் காக்கிறது.
- issue: עִמָּכֶם என்பதிலுள்ள தொடர்பின் தன்மை
  choice: உங்களோடு
  alternative: உங்களிடம்
  rationale: ‘ஓடு’ என்பது மூல முன்னிடைச்சொல்லின் பரஸ்பர/நேரடி சந்திப்பு நிழற்பொருளைக் காக்கிறது; இருப்பினும் சூழலில் ஒருதிசை உரையைக் குறிக்கும் ‘உங்களிடம்’ என்பதும் சாத்தியம்.
translation_notes:
  register: நவீன, மரியாதையான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். தூதுச் செய்திச் சூத்திரத்தின் முறையான தொனி காக்கப்பட்டுள்ளது; தேவையற்ற பழமையான நடை தவிர்க்கப்பட்டுள்ளது.
