  footnotes:
  - marker: a
    text: இதை விரிவான பொருளில், ‘கொல்லாதே’ என்றும் மொழிபெயர்க்கலாம். எனினும், இங்குள்ள எபிரெய வினைச்சொல் பொதுவாக எல்லா வகையான கொல்லுதலையும் அல்ல, சட்டத்திற்குப் புறம்பான கொலை அல்லது கொலைக்குற்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: செய்யாதே
  rationale: எபிரெய எதிர்மறைத் துகள், இரண்டாம் நபர் வினைவடிவத்துடன் சேர்ந்து நேரடியான தடையை வெளிப்படுத்துகிறது. தமிழில் ஒருமை முன்னிலையில் இயல்பான கட்டளைத் தடை வடிவமான ‘செய்யாதே’ இதைத் தெளிவாகக் கொடுக்கிறது.
- source_word: תִּרְצָח
  choice: கொலை செய்ய
  rationale: רצח என்பது பொதுவாக எல்லா வகையான உயிர்க்கொல்லலையும் குறிக்காமல், சட்டவிரோதமான மனிதக் கொலையை அல்லது கொலைக்குற்றத்தைச் சுட்டுகிறது. ‘கொலை செய்ய’ என்பது அந்தக் குறிப்பான பொருளை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: பத்துக் கட்டளைகளில் இத்தடையின் வரம்பு
  choice: ‘கொல்லாதே’ என்பதற்குப் பதிலாக ‘கொலை செய்யாதே’
  alternative: கொல்லாதே.
  rationale: ‘கொல்லாதே’ என்பது எந்தச் சூழலிலும் உயிரைப் பறிப்பதற்கான முழுமையான தடையாகப் புரிந்துகொள்ளப்படலாம். ஆனால் இச்சட்டச் சூழலில் רצח என்பதன் வழக்கமான பொருள் சட்டவிரோதமான மனிதக் கொலை. ‘கொலை செய்யாதே’ என்பது உரையின் அறவலிமையையும் அதன் சொற்பொருள் வரம்பையும் காக்கிறது.
translation_notes:
  register: சுருக்கமான, நேரடியான, கண்ணியமுள்ள நவீனத் தமிழ். ஒருமை முன்னிலையில் உள்ள தடை வடிவம் மூலத்தின் இரண்டாம் நபர் ஒருமை அமைப்பை இயல்பாகப் பிரதிபலிக்கிறது.
