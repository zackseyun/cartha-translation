revisions:
- from: ஆறு நாட்கள் நீ உழைத்து, உன் வேலைகளையெல்லாம் செய்ய வேண்டும்.[a]
  to: ஆறு நாட்கள் நீ உழைத்து, உன் எல்லா வேலையையும் செய்ய வேண்டும்.[a]
  rationale: The revision retains the draft’s accurate command force and natural register, while representing the Hebrew singular collective ‘your work’ more closely and removing the footnote’s added distributive nuance.
  reviewer_model: gpt-5.6-terra
