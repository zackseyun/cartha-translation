  yaml_path: translation/ot/exodus/020/009.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: ta
  text: ஆறு நாட்கள் நீ உழைத்து, உன் எல்லா வேலையையும் செய்ய வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆறு நாட்கள் நீ வேலை செய்ய வேண்டும்.’
    reason: תַּעֲבֹד என்பதற்கு ‘உழை’ என்பதோடு ‘வேலை செய்’ என்றும் பொருள் கொள்ளலாம்; காலத் தொடரை ‘ஆறு நாட்கள்’ எனவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: ஆறு நாட்கள்
  rationale: எபிரெயக் கட்டமைப்பில் முன்னிடைச்சொல் வெளிப்படையாக இல்லை; தமிழிலும் கால அளவைக் குறிக்க இயல்பாக ‘ஆறு நாட்கள்’ என்று கூறலாம்.
- source_word: תַּעֲבֹד
  choice: நீ உழைத்து
  rationale: עבד என்பதன் ‘வேலைசெய்/உழை’ என்ற பொருளையும் கட்டளையின் தீவிரத்தையும் ‘உழைத்து’ தக்கவைக்கிறது; அடுத்த வினையுடன் இணைந்து இயல்பான தமிழ் தொடரை உருவாக்குகிறது.
- source_word: וְעָשִׂיתָ
  choice: செய்ய வேண்டும்
  rationale: עשה என்பது இங்கு מְלָאכָה என்பதுடன் ‘வேலைகளைச் செய்’ எனப் பொருள்படுகிறது. ‘வேண்டும்’ சட்டவழிக் கட்டளையின் பணிப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: எல்லாம்
  rationale: כָּל என்பதன் முழுமையைக் குறிக்கும் பொருளை இயல்பான தமிழில் ‘எல்லாம்’ வெளிப்படுத்துகிறது.
- source_word: מְלַאכְתֶּךָ
  choice: உன் வேலைகளை
  rationale: מְלָאכָה ஓய்வுநாள் சூழலில் வேலை, பணி அல்லது தொழிற்செயலைக் குறிக்கிறது. ஒருமைத் தொகுப்புப் பொருளைத் தமிழில் இயல்பாக ‘வேலைகள்’ என்ற பன்மை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஓய்வுநாள் சட்டத்தில் நிறைவுறா வினையின் கட்டளை வலிமை
  choice: ‘செய்ய வேண்டும்’ என்று பணிப்பொருளுடன் மொழிபெயர்த்தல்
  alternative: ‘செய்யலாம்’
  rationale: பத்துக் கட்டளைகளின் உடன்படிக்கைச் சட்டச் சூழலில் வினை வெறும் எதிர்காலக் கூற்றாகவோ அனுமதியாகவோ இல்லாமல் பணிப்புரையாகச் செயல்படுகிறது. ‘வேண்டும்’ அந்த வலிமையை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான சட்டக் கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்’ என்பதற்குப் பதிலாக மூலத்தின் இரண்டாம் நபர் ஒருமையை நேரடியாகக் காட்டும் ‘நீ/உன்’ பயன்படுத்தப்பட்டுள்ளது.
