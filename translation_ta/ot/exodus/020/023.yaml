  text: לֹ֥א תַעֲשׂ֖וּ/ן אִתִּ֑/י אֱלֹ֤הֵי כֶ֨סֶף֙ וֵ/אלֹהֵ֣י זָהָ֔ב לֹ֥א תַעֲשׂ֖וּ לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: ta
  text: என்னோடு சேர்த்து வெள்ளியால் ஆன தெய்வங்களை நீங்கள் உருவாக்கக் கூடாது[a]; உங்களுக்காகத் தங்கத்தால் ஆன தெய்வங்களையும் உருவாக்கக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னோடு” அல்லது “என்னுடன்.” எபிரெய மொழியில் சொற்பட “என்னோடு” என்று உள்ளது. போட்டித் தெய்வங்களைத் தடைசெய்வதை வலியுறுத்தும் விளக்கமான மொழிபெயர்ப்புகளில் “என்னோடு சேர்த்து” என்றும் கூறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: உருவாக்கக் கூடாது
  rationale: עשה இச்சூழலில் வழிபாட்டுக்குரிய உருவங்களைச் செய்தல் அல்லது வடிவமைத்தலைக் குறிக்கிறது. ‘உருவாக்கு’ என்பது இயல்பான நவீனத் தமிழில் நேரடியான தடையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אִתִּי
  choice: என்னோடு சேர்த்து
  rationale: முதலாம் நபர் ஒருமை பின்னொட்டுடன் வரும் இந்த முன்னிடைச்சொல்லின் அடிப்படைப் பொருள் ‘என்னோடு’ என்பதாகும். ‘சேர்த்து’ என்பது தெய்வங்களை ஆண்டவருடன் இணையாக வைத்துக்கொள்ளும் சூழல்சார் உறவை இயல்பான தமிழில் காட்டுகிறது; ‘எனக்கு அருகில்’ போன்ற அதிக விளக்கமான பொருளைத் திணிக்கவில்லை.
- source_word: אֱלֹהֵי כֶסֶף
  choice: வெள்ளியால் ஆன தெய்வங்கள்
  rationale: எபிரெயக் கட்டமைப்பு ‘வெள்ளியின் தெய்வங்கள்’ என்று சொற்பட இருந்தாலும், பொருளால் செய்யப்பட்ட வழிபாட்டு உருவங்களைக் குறிக்கும் இயல்பான தமிழாக்கம் ‘வெள்ளியால் ஆன தெய்வங்கள்’ ஆகும்.
- source_word: וֵאלֹהֵי זָהָב
  choice: தங்கத்தால் ஆன தெய்வங்களையும்
  rationale: இணைப்புச் சொல்லையும் இரண்டாவது தடையையும் தமிழில் ‘-யும் ... கூடாது’ என்ற இணை அமைப்பு இயல்பாக வெளிப்படுத்துகிறது; தங்கத்தால் செய்யப்பட்ட தெய்வங்கள் என்ற பொருளையும் காக்கிறது.
- source_word: לָכֶם
  choice: உங்களுக்காக
  rationale: לְ முன்னிடைச்சொல்லுடன் இரண்டாம் நபர் பன்மை பின்னொட்டு, மக்கள் தங்களுக்கென்று அவற்றை உருவாக்குவதைச் சுட்டுகிறது. ‘உங்களுக்காக’ இதை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לֹא ... לֹא
  choice: கூடாது ... கூடாது
  rationale: மீண்டும் வரும் இரு எதிர்மறைக் கட்டளைகளும் உடன்படிக்கைச் சட்டத்தின் வலிமையுடன் தனித்தனியே காக்கப்படுகின்றன.
theological_decisions:
- issue: אִתִּי என்பதை தனிப்பட்ட வழிபாட்டை வலியுறுத்தும் வகையில் ‘எனக்கு அருகில்’ அல்லது ‘எனக்குப் போட்டியாக’ என்று விளக்கமாக மொழிபெயர்ப்பதா
  choice: என்னோடு சேர்த்து
  alternative: என்னோடு; எனக்கு அருகில்
  rationale: எபிரெயச் சொல் அடிப்படையில் ‘என்னோடு’ என்று பொருள்படும். சூழல் போட்டித் தெய்வங்களைத் தடைசெய்வதை உணர்த்தினாலும், அதை மூலத்தில் இருப்பதைவிடத் திட்டவட்டமாக்காமல் ‘என்னோடு சேர்த்து’ என்ற வாசகம் சொற்பொருளையும் சூழல்சார் உறவையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified சட்டநடை பயன்படுத்தப்பட்டுள்ளது. பன்மை ‘நீங்கள்’ வடிவமும் மீளும் ‘கூடாது’ அமைப்பும் மூலத்தின் கட்டளை வலிமையைப் பாதுகாக்கின்றன.
