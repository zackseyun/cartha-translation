  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: ta
  text: உன் அயலானின் வீட்டின்மேல் ஆசை வைக்காதே[a]; உன் அயலானின் மனைவியின்மேலோ, அவனுடைய ஆண் அடிமையின்மேலோ, பெண் அடிமையின்மேலோ, எருதின்மேலோ, கழுதையின்மேலோ, உன் அயலானுக்குச் சொந்தமான எதன்மேலுமோ ஆசை வைக்காதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் அயலானின் குடும்பம்’ அல்லது ‘வீட்டார்’ என்றும் மொழிபெயர்க்கலாம். ‘வீடு’ என்பதற்கான எபிரெயச் சொல் ஒரு குடும்பத்தையோ வீட்டாரையோ குறிக்கவும் முடியும்; ஆனால் இங்கு மனைவி, அடிமைகள், விலங்குகள் தொடர்ந்து தனித்தனியாகப் பட்டியலிடப்படுவதால் ‘வீடு’ என்பது சூழலுக்கு நன்கு பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: ஆசை வைக்காதே
  rationale: இந்தக் கட்டளையின் சூழலில் חמד என்பது பிறருக்குச் சொந்தமானதைத் தனக்கென விரும்பும் தவறான ஆசையைக் குறிக்கிறது. ‘ஆசை வைக்காதே’ என்பது நவீன தமிழில் இயல்பாக இருந்து, தடைச் சூழலின் நெறிசார் வலிமையையும் காக்கிறது.
- source_word: בֵּית רֵעֶךָ
  choice: உன் அயலானின் வீடு
  rationale: בַּיִת என்பதற்கு ‘வீடு’ என்றும் ‘வீட்டார்/குடும்பம்’ என்றும் பொருள் உண்டு. தொடர்ந்து மனைவி, அடிமைகள், விலங்குகள் தனித்தனியாகப் பட்டியலிடப்படுவதால் இங்கு ‘வீடு’ முதன்மைப் பொருளாக ஏற்றது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רֵעֶךָ
  choice: உன் அயலான்
  rationale: உடன்படிக்கைச் சட்டத்தில் רֵעַ சமூகத்தில் உள்ள மற்றொருவரைக் குறிக்கிறது. ‘அயலான்’ அதன் நபர்களுக்கிடையிலான நெறிசார் உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: உன் அயலானின் மனைவி
  rationale: எபிரெயக் கட்டமைப்பின் நேரடியான உறவுப் பொருளையும் சட்டச் சூழலையும் தெளிவாகப் பேணுகிறது.
- source_word: עַבְדּוֹ
  choice: அவனுடைய ஆண் அடிமை
  rationale: சொத்துப் பட்டியலைக் கொண்ட இந்தச் சட்டச் சூழலில் பிணைக்கப்பட்ட சமூக நிலை முன்னிலையில் இருப்பதால் ‘அடிமை’ பொருத்தமானது; ‘ஆண்’ என்பது அடுத்து வரும் பெண்பால் சொல்லிலிருந்து வேறுபடுத்துகிறது.
- source_word: אֲמָתוֹ
  choice: அவனுடைய பெண் அடிமை
  rationale: אָמָה பெண் அடிமை அல்லது பணிப்பெண்ணைக் குறிக்கலாம். עֶבֶד என்பதற்கு இணையாகவும் இச்சட்டச் சூழலிலும் ‘பெண் அடிமை’ சமூக நிலையையும் பாலின வேறுபாட்டையும் காக்கிறது.
- source_word: שׁוֹרוֹ
  choice: அவனுடைய எருது
  rationale: שׁוֹר இங்கு பொதுவாக உழைப்புக்குப் பயன்படுத்தப்படும் மாட்டினத்தைக் குறிக்கிறது; ஒருமைச் சட்டப் பட்டியலில் ‘எருது’ இயல்பான தமிழ் இணைச்சொல்.
- source_word: חֲמֹרוֹ
  choice: அவனுடைய கழுதை
  rationale: חֲמוֹר என்பதற்கான தெளிவான, தற்போதைய தமிழ் இணைச்சொல் ‘கழுதை’.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: உன் அயலானுக்குச் சொந்தமான வேறு எதுவும்
  rationale: இந்தச் சொற்றொடர் பட்டியலில் விடுபட்ட அனைத்தையும் உள்ளடக்கும் நிறைவுக் கூற்று. ‘வேறு எதுவும்’ என்பது தமிழில் பட்டியலுக்குப் பின் இயல்பாக இருந்து, לְ என்பதன் உடைமைப் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: לֹא ... לֹא
  choice: ஆசை வைக்காதே ... ஆசை வைக்காதே
  rationale: எபிரெய உரையின் இரு தடைகளும் ஒன்றாகச் சுருக்கப்படாமல் மீண்டும் கூறப்பட்டு, கட்டளையின் அமைப்பும் வலியுறுத்தலும் காக்கப்படுகின்றன.
theological_decisions:
- issue: முதல் கூறிலுள்ள בֵּית என்பதை ‘வீடு’ எனவா, ‘வீட்டார்/குடும்பம்’ எனவா மொழிபெயர்ப்பது
  choice: வீடு
  alternative: வீட்டார் / குடும்பம்
  rationale: בַּיִת இரு பொருள்களையும் ஏற்கலாம். ஆனால் மனைவி, அடிமைகள், விலங்குகள் பின்னர் தனித்தனியாகச் சொல்லப்படுவதால் ‘வீடு’ தேவையற்ற மறுகூறலைத் தவிர்த்து, வசனத்தின் பட்டியல் அமைப்புக்கு ஏற்றதாக உள்ளது. உண்மையான சொற்பொருள் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: உடன்படிக்கைச் சட்டத்தில் அடிமைத்தனச் சொற்களை எவ்வாறு வழங்குவது
  choice: ஆண் அடிமை / பெண் அடிமை
  alternative: ஆண் வேலைக்காரன் / பெண் வேலைக்காரி
  rationale: இந்தச் சட்டப் பட்டியலில் பிணைக்கப்பட்ட சமூக நிலை குறிப்பிடத்தக்கதாக இருப்பதால், மென்மையாக்காமல் ‘அடிமை’ என்று மொழிபெயர்ப்பது மூலத்தின் வரலாற்றுச் சமூக உண்மையைத் தெளிவாகக் காக்கிறது; இது அந்த அமைப்பை ஆதரிப்பதாக அல்ல.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, அதே நேரத்தில் கட்டளைக்குரிய கண்ணியமும் வலிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. பழமையான ‘இச்சியாதிருப்பாயாக’ போன்ற வடிவங்கள் தவிர்க்கப்பட்டன. ‘ஆசை வைக்காதே’ என்ற மீளுரை எபிரெயத் தடையின் இருமுறை அமைப்பைக் காக்கிறது; ‘மேல்/மீது ஆசை வைப்பது’ என்ற இயல்பான தமிழ் வழக்கு பட்டியலெங்கும் தொடர்கிறது.
