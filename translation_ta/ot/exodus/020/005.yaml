  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: ta
  text: நீ அவற்றின் முன் பணியவும் வேண்டாம்[a]; அவற்றுக்குச் சேவை செய்யவும் வேண்டாம்[b]. ஏனெனில், நான் உன் கடவுளாகிய யாவே, பொறாமையுள்ள கடவுள்; என்னை வெறுக்கிறவர்களின் மூன்றாம் மற்றும் நான்காம் தலைமுறைகள்மேலும் தந்தையரின் அக்கிரமத்தைப் பிள்ளைகள்மேல் விசாரிக்கிறேன்[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் முன் தரையில் விழுந்து பணியவும் வேண்டாம்.” எபிரெய வினை மரியாதை அல்லது வணக்கத்தின் அடையாளமாக உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றை வழிபடவும் வேண்டாம்.” இங்குள்ள “சேவை செய்” என்ற வினை சிலைகளுக்குச் செய்யப்படும் வழிபாட்டுப் பணிவிடையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “தந்தையரின் அக்கிரமத்தைப் பிள்ளைகள்மேல் விசாரிக்கிறேன்.” இந்த எபிரெயச் சொல்லாட்சி அப்படியே பாதுகாக்கப்பட்டுள்ளது. தனிப்பட்ட பொறுப்பைப் பற்றிய தொடர்புடைய போதனைக்கு உபாகமம் 24:16; எசேக்கியேல் 18 ஆகியவற்றைப் பார்க்கவும்.'
    reason: cross_reference
  - marker: d
    text: அல்லது, “என்னை வெறுக்கிறவர்களுக்கு மூன்றாம் மற்றும் நான்காம் தலைமுறைகள்மேல்.”
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: பணிந்து வணங்க
  rationale: எபிரெய வினை மரியாதை அல்லது வழிபாட்டின் அடையாளமாக உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கிறது. ‘பணிந்து வணங்க’ என்பது உடல் செயலும் வழிபாட்டுச் சூழலும் இரண்டையும் இயல்பான தமிழில் தெரிவிக்கிறது; அடுத்துள்ள ‘சேவை செய்’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: תָעָבְדֵם
  choice: அவைகளுக்குச் சேவை செய்ய
  rationale: עבד என்பதன் அடிப்படைப் பொருள் ‘சேவை செய்’. சிலை வழிபாட்டுச் சூழலில் வழிபாட்டுக்குரிய பணிவிடையையும் குறிக்கலாம்; இங்கு சொற்களுக்கிடையிலான வேறுபாட்டைக் காக்க ‘சேவை செய்ய’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ வழங்கப்பட்டது.
- source_word: אֵל קַנָּא
  choice: பொறாமையுள்ள கடவுள்
  rationale: உடன்படிக்கைச் சூழலில் קַנָּא என்பது போட்டி வழிபாட்டை ஏற்காத கடவுளின் உரிமையுள்ள தனிப்பட்ட கோரிக்கையை வெளிப்படுத்துகிறது. பதற்றத்தை மென்மைப்படுத்தாமல் ‘பொறாமையுள்ள’ என மொழிபெயர்க்கப்பட்டது.
- source_word: פֹּקֵד
  choice: விசாரிக்கிறவர்
  rationale: פקד என்பது கவனத்தில் கொண்டு கணக்குக் கேட்பது அல்லது நீதியாகத் தலையிடுவது ஆகிய பரப்பைக் கொண்டது. ‘தண்டிக்கிறவர்’ எனப் பொருளைச் சுருக்காமல், தமிழ் வேதாகம நடையில் புரியக்கூடிய ‘விசாரிக்கிறவர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֲוֺן
  choice: அக்கிரமம்
  rationale: עון என்பது அக்கிரமம், குற்றப்பழி, அதன் விளைவு ஆகிய பொருள் பரப்பைக் கொண்டது. ‘அக்கிரமம்’ அதன் ஒழுக்கக் கனத்தைக் காக்கிறது.
- source_word: אָבֹת
  choice: தந்தையர்
  rationale: மூலச்சொல் ஆண்பால் பன்மையாக இருப்பதால் ‘பெற்றோர்’ எனப் பாலினத்தைப் பொதுமைப்படுத்தாமல் ‘தந்தையர்’ என வழங்கப்பட்டது.
- source_word: בָּנִים
  choice: பிள்ளைகள்
  rationale: בנים என்பதற்கு ‘மகன்கள்’ என்ற நேர்ப்பொருள் இருந்தாலும், தலைமுறைத் தொடரைக் குறிக்கும் இச்சூழலில் இருபாலரையும் உள்ளடக்கும் இயல்பான ‘பிள்ளைகள்’ பொருத்தமானது.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: மூன்றாம் தலைமுறையிலும் நான்காம் தலைமுறையிலும்
  rationale: எபிரெய மொழியில் மறைவாக உள்ள ‘தலைமுறை’ என்பதைத் தமிழில் வெளிப்படையாகச் சேர்த்தது பொருளைத் தெளிவாக்குகிறது; இரு எண்களுடனும் இணைப்பை மீளக் கூறுவது மூலத்தின் ஓசையையும் வரம்பையும் பிரதிபலிக்கிறது.
- source_word: לְשֹׂנְאָי
  choice: என்னை வெறுக்கிறவர்களிடையே
  rationale: இந்தச் சொற்றொடர் எச்சரிக்கையின் தொடர்புடைய மனிதக் குழுவைக் குறிக்கிறது. எபிரெய இலக்கணத்தில் அதன் துல்லிய இணைப்பு குறித்து சிறு இடைவெளி இருப்பதால், மாற்று அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தெய்வீகப் பொறாமையை எவ்வாறு மொழிபெயர்ப்பது
  choice: பொறாமையுள்ள கடவுள்
  alternative: தீவிர வைராக்கியமுள்ள கடவுள்
  rationale: சிலை வழிபாட்டைத் தடைசெய்யும் உடன்படிக்கைச் சூழலில், கடவுளின் உரிமையுள்ள தனித்த கோரிக்கையை ‘பொறாமை’ துல்லியமாகக் காக்கிறது; அதை வெறும் ஆர்வமாக மென்மைப்படுத்தவில்லை.
- issue: தலைமுறைகளுக்கிடையிலான நீதித் தீர்ப்பை எவ்வாறு வெளிப்படுத்துவது
  choice: தந்தையரின் அக்கிரமத்தைப் பிள்ளைகள்மேல் ... விசாரிக்கிறவர்
  alternative: தந்தையரின் பாவத்திற்காகப் பிள்ளைகளை ... தண்டிக்கிறவர்
  rationale: மூலத்தின் சொற்றொடர் அக்கிரமத்தை ‘விசாரித்தல்/கவனத்தில் கொள்தல்’ என்று கூறுகிறது. ‘பிள்ளைகளைத் தண்டித்தல்’ எனத் தீர்மானமாக விரிவாக்காமல், உபாகமம் 24:16 மற்றும் எசேக்கியேல் 18 போன்ற பகுதிகளுடன் இருக்கும் இறையியல் பதற்றம் பாதுகாக்கப்பட்டது.
- issue: ‘என்னை வெறுக்கிறவர்கள்’ என்பதன் தலைமுறைச் சொற்றொடருடனான தொடர்பு
  choice: என்னை வெறுக்கிறவர்களிடையே ... மூன்றாம் தலைமுறையிலும் நான்காம் தலைமுறையிலும்
  alternative: என்னை வெறுக்கிறவர்களின் மூன்றாம், நான்காம் தலைமுறைவரை
  rationale: לְשֹׂנְאָי என்பது எச்சரிக்கை பொருந்தும் குழுவைக் குறிக்கிறது; அது தலைமுறைகளை நேரடியாக உரிமைத் தொடர்பில் கட்டுகிறதா அல்லது மொத்த நீதிக் கூற்றை வரையறுக்கிறதா என்ற நுண்மையான தெளிவின்மையை அடிக்குறிப்புடன் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில், கட்டளையின் ஒருமை முகவரி காக்கப்பட்டுள்ளது. உயிரற்ற சிலைகளைக் குறிக்கும் வகையில் ‘அவைகள்’ பயன்படுத்தப்பட்டுள்ளது. ‘விசாரிக்கிறவர்’ மூல மொழியின் நீதிசார் சொல்லாட்சியைத் திறந்த நிலையில் வைத்திருக்கிறது; அடிக்குறிப்புகள் சொற்பொருள் மாற்றுகளையும் இறையியல் பதற்றத்தையும் வெளிப்படுத்துகின்றன.
