revisions:
- from: நீ அவைகளுக்கு முன்பாகப் பணிந்து வணங்கவும் வேண்டாம்[a]; அவைகளுக்குச் சேவை செய்யவும் வேண்டாம்[b]. ஏனெனில், உன் கடவுளாகிய யாவே என்னும் நான் பொறாமையுள்ள கடவுள்; என்னை வெறுக்கிறவர்களிடையே, தந்தையரின் அக்கிரமத்தைப் பிள்ளைகள்மேல் மூன்றாம் தலைமுறையிலும் நான்காம் தலைமுறையிலும் விசாரிக்கிறவர்[c][d].
