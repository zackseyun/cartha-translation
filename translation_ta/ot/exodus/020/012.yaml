base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: ta
  text: உன் தந்தையையும் உன் தாயையும் மதித்து நட. அப்படிச் செய்தால், உன் கடவுளாகிய யாவே உனக்குக் கொடுக்கிற நாட்டில்[a] நீ நீண்ட காலம் வாழ்வாய்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “நிலத்தின் மேல்.” இச்சூழலில் அது யாவே கொடுக்கிற நாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்சொல்லாக, “உன் நாட்கள் நீடிக்கும்”; இது நீண்ட ஆயுளைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: மதித்து நட
  rationale: பியேல் கட்டளை வடிவம் பெற்றோரை மதிப்புக்குரியவர்களாகக் கருதி அதற்கேற்ப நடத்த வேண்டும் என்ற செயற்பாட்டு வலிமையைக் கொண்டது. ‘மதி’ என்பதைக் காட்டிலும் ‘மதித்து நட’ என்பது அந்த நடைமுறைப் பொறுப்பை இயல்பான நவீன தமிழில் தெளிவாக்குகிறது.
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: உன் தந்தையையும் உன் தாயையும்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதிகளுடன் வரும் குடும்ப உறவுச் சொற்களை நேரடியாகவும் கண்ணியமாகவும் மொழிபெயர்க்கிறது.
- source_word: לְמַעַן
  choice: அப்போது
  rationale: இங்கு கட்டளையையும் அதைத் தொடரும் வாக்குறுதியையும் நோக்கம் அல்லது விளைவு சார்ந்த உறவில் இணைக்கிறது. தமிழில் ‘அப்போது’ இயல்பாக அந்தத் தொடர்பை வெளிப்படுத்துகிறது; அதை இயந்திரமான காரண-விளைவு விதியாக மிகைப்படுத்தாது.
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: நீ நீண்ட காலம் வாழ்வாய்
  rationale: எபிரேய மொழியின் ‘உன் நாட்கள் நீடிக்கும்’ என்ற மரபுத்தொடரின் பொருள் நீண்ட ஆயுள். சொற்சொல்லான வடிவத்தைவிட இத்தமிழாக்கம் இயல்பானது; அடிக்குறிப்பு மூல உருவகத்தைப் பதிவு செய்கிறது.
- source_word: עַל הָאֲדָמָה
  choice: நாட்டில்
  rationale: אֲדָמָה இச்சூழலில் வெறும் மண்ணையல்ல, கடவுள் இஸ்ரவேலுக்குக் கொடுக்கிற நிலப்பரப்பைக் குறிக்கிறது. עַל என்பதன் சொற்சொல்லான பொருள் ‘மேல்’ என்றாலும், தமிழில் மக்கள் வாழும் நிலப்பரப்பைக் குறிப்பிட ‘நாட்டில்’ என்பது இயல்பானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பொருளைத் தக்கவைத்து, அடுத்துவரும் தெய்வீகப் பெயருடன் இயல்பான தமிழ் தொடரை உருவாக்குகிறது.
- source_word: נֹתֵן לָךְ
  choice: உனக்குக் கொடுக்கிற
  rationale: எபிரேய நிகழ்கால வினையெச்சம் தொடரும் அல்லது நிகழவிருக்கும் கொடையைச் சுட்டக்கூடும். சீனாய் சூழலில் இன்னும் முழுமையாகச் சுதந்தரிக்கப்படாத நாட்டைக் குறிக்க ‘கொடுக்கிற’ அந்தத் திறந்த காலநிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, உடன்படிக்கைப் பெயரே நேரடியாக உள்ளது. ஆகவே அதைப் பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- issue: הָאֲדָמָה குறிக்கும் பரப்பு
  choice: நாடு
  alternative: நிலம்; மண்; பூமி
  rationale: ‘உனக்குக் கொடுக்கிற’ என்ற தொடரும் பத்துக் கட்டளைகளின் வரலாற்றுச் சூழலும், இது பொதுவான பூமியையோ வெறும் மண்ணையோ அல்லாமல் இஸ்ரவேலுக்குக் கொடுக்கப்படும் நாட்டைக் குறிக்கிறது என்பதைக் காட்டுகின்றன. ‘வாக்குத்தத்த நாடு’ என்று மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
- issue: יַאֲרִכוּן יָמֶיךָ என்ற வாக்குறுதியின் வடிவம்
  choice: நீ நீண்ட காலம் வாழ்வாய்
  alternative: உன் நாட்கள் நீடிக்கும்
  rationale: மூலத்தின் எபிரேய மரபுத்தொடர் நீண்ட வாழ்வைக் குறிக்கிறது. தமிழ் வாசகருக்கு பொருள் நேரடியாகப் புரிய இயல்பான வடிவம் முதன்மை உரையில் தரப்பட்டு, மூலச் சொல்லமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான ஒருமை நேர்முக உரை பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் செயற்பாட்டு வலிமைக்காக ‘மதித்து நட’ என்றும், எபிரேய மரபுத்தொடரின் இயல்பான தமிழ்ப் பொருளுக்காக ‘நீ நீண்ட காலம் வாழ்வாய்’ என்றும் வழங்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் அவை விளக்கும் சொற்றொடருக்குப் பின்பு இடம்பெறுகின்றன.
