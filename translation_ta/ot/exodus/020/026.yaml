  language: en
  yaml_path: translation/ot/exodus/020/026.yaml
  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: ta
  text: என் பலிபீடத்துக்குப் படிகளில் ஏறிச் செல்லக் கூடாது; உன் நிர்வாணம் என் பலிபீடத்தின்மேல் வெளிப்படாதபடி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் நிர்வாணம் என் பலிபீடத்தின்மேல் வெளிப்படிவிடாதபடி.”
    reason: אֲשֶׁר לֹא உடனான தொடரின் தடுப்பு/நோக்க நுணுக்கத்தைத் தக்கவைத்துக்கொண்டு, תִּגָּלֶה-யின் ‘வெளிப்படுதல்/மறைப்பு நீங்குதல்’ என்னும் பொருளை மாற்று நடையில் காட்டுகிறது.
lexical_decisions:
- source_word: תַעֲלֶה
  choice: நீ ஏறிச் செல்லக் கூடாது
  rationale: עלה என்பதன் ‘மேலே போ/ஏறு’ என்ற திசை உணர்வையும், לֹא உடன் வரும் தடையையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְמַעֲלֹת
  choice: படிகள் வழியாக
  rationale: מַעֲלוֹת என்பது படிகள் அல்லது படிக்கட்டுகளைக் குறிக்கிறது; בְּ என்ற முன்னொட்டின் வழி/முறை உணர்வை ‘வழியாக’ இயல்பாகக் காட்டுகிறது.
- source_word: מִזְבְּחִי
  choice: என் பலிபீடத்துக்கு
  rationale: מִזְבֵּחַ உடன் முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டை நேரடியாகவும் வழக்கமான வேதாகமத் தமிழிலும் தருகிறது.
- source_word: אֲשֶׁר לֹא
  choice: அப்படிச் செய்தால்
  rationale: தடைக்குப் பின்வரும் விளைவு/தவிர்க்க வேண்டிய நிலையை இயல்பான தமிழில் இணைக்கிறது; நோக்கமா விளைவா என்ற எபிரேயத் தெளிவின்மையை கடுமையாகத் தீர்மானிக்கவில்லை.
- source_word: תִּגָּלֶה
  choice: வெளிப்படும்
  rationale: גלה என்பதன் நிபால் வடிவிலுள்ள ‘மறைப்பு நீங்கி வெளிப்படு’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: עֶרְוָתְךָ
  choice: உன் நிர்வாணம்
  rationale: עֶרְוָה குறிக்கும் உடல் நிர்வாணத்தையும் அதிலுள்ள பாலியல் மரியாதை உணர்வையும், ‘மறைவிடங்கள்’ என்று மிகையாகக் குறிப்பாக்காமல் பாதுகாக்கிறது.
- source_word: עָלָיו
  choice: அதன்மேல்
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயர் பலிபீடத்தைக் குறிக்கிறது; עַל என்பதன் ‘மேல்’ என்ற உறவை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: பலிபீடத்துக்குப் படிகள் வழியாக ஏறுவதைத் தடைசெய்வதற்கான காரணம்
  choice: ஆராதனைச் சூழலில் உடல் நிர்வாணம் பலிபீடத்தின்மேல் வெளிப்படுவதைத் தவிர்ப்பதே உரை வெளிப்படையாகக் கூறும் காரணம்.
  alternative: இது தேவனுக்கு முன் தாழ்மையின் அடையாளம்; அல்லது குறிப்பாக ஆசாரிய உடைகளால் ஏற்படக்கூடிய வெளிப்பாட்டைப் பற்றியது.
  rationale: எபிரேய உரை உடல் வெளிப்பாட்டையே காரணமாகத் தருகிறது. அதற்கு அப்பாற்பட்ட அடையாளவியல் அல்லது ஆசாரிய உடை சார்ந்த விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பலிபீடம்’ என்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டது; ‘நிர்வாணம்’ மூலத்தின் நேர்மையையும் மரியாதைத் தொனியையும் பாதுகாக்கிறது.
