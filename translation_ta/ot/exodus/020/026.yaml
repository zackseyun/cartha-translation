revisions:
- from: என் பலிபீடத்துக்குப் படிகள் வழியாக நீ ஏறிச் செல்லக் கூடாது; அப்படிச் செய்தால், உன் நிர்வாணம் அதன்மேல் வெளிப்படும்.[a]
  to: என் பலிபீடத்துக்குப் படிகளில் ஏறிச் செல்லக் கூடாது; உன் நிர்வாணம் என் பலிபீடத்தின்மேல் வெளிப்படாதபடி.[a]
  rationale: முக்கிய உரை எபிரேயத்தின் நோக்கு அல்லது தடுப்பு உறவை நேரடியாகத் தருமாறு திருத்தப்பட்டுள்ளது; நிபந்தனை-விளைவு வாசிப்பு தவிர்க்கப்பட்டுள்ளது. சொற்களும் நடையும் நவீன தரத் தமிழுக்கு இயல்பாகச் சீரமைக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
