review_pass:
  verdict: revise
  source_fidelity: 'The main sense is conveyed well: an altar made of stones must not be made with worked stones, and applying the ''sword'' to it results in profanation. ‘வாள்’ appropriately retains the Hebrew חַרְבְּךָ rather than prematurely substituting ‘tool.’ The final singular reference is correctly represented by ‘அதை,’ referring to the altar. However, the footnote anchoring does not correspond to the English audit trail: the draft’s sole [a] is attached to ‘ஓங்கினால்’ but contains the English [b] cultural note, while the lexical alternative for גָּזִית is absent.'
  naturalness: The Tamil is clear and appropriately formal. ‘அதைச் செதுக்கப்பட்ட கற்களால் கட்டாதே’ is natural and accurately communicates the prohibition. ‘தீட்டுப்படுத்திவிடுவாய்’ is understandable, though ‘தீட்டுப்படுத்துவாய்’ is slightly more direct and avoids adding an unnecessary completive nuance. ‘ஓங்கினால்’ preserves the image of raising/wielding the sword and is acceptable in context.
  terminology: ‘பலிபீடம்’ is standard and suitable. ‘செதுக்கப்பட்ட கற்கள்’ is an apt rendering of גָּזִית; an alternative such as ‘வெட்டப்பட்ட கற்கள்’ can be supplied in a lexical footnote. ‘தீட்டுப்படுத்துவாய்’ suitably retains the cultic force of חלל without imposing an explanation for why the altar is profaned.
  issues:
  - severity: medium
    issue: Footnote marker and content do not align with the audit trail.
    rationale: The English source has [a] on ‘stones’ for the lexical alternative ‘hewn stone’ and [b] on ‘sword’ for the cultural note. The Tamil draft instead places [a] after ‘ஓங்கினால்’ and uses it for the cultural note, leaving the lexical alternative unrepresented. Restoring two anchored notes makes the annotation set traceable and semantically accurate.
  - severity: low
    issue: The completive ‘விடு’ in ‘தீட்டுப்படுத்திவிடுவாய்’ is not required by the Hebrew.
    rationale: The Hebrew states that the altar is profaned; the simpler future ‘தீட்டுப்படுத்துவாய்’ expresses this directly without an added aspectual emphasis.
  revised_text: எனக்காகக் கற்களால் ஒரு பலிபீடத்தை நீ அமைத்தால், அதைச் செதுக்கப்பட்ட கற்களால்[a] கட்டாதே; ஏனெனில், உன் வாளை அதன்மேல் நீ ஓங்கினால்[b], அதைத் தீட்டுப்படுத்துவாய்.
