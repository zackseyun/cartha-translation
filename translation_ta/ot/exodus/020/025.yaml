  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: ta
  text: எனக்காகக் கற்களால் ஒரு பலிபீடத்தை நீ அமைத்தால், அதைச் செதுக்கப்பட்ட கற்களால்[a] கட்டாதே; ஏனெனில், உன் வாளை அதன்மேல் நீ ஓங்கினால்[b], அதைத் தீட்டுப்படுத்துவாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெட்டப்பட்ட கற்கள்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘உன் வாள்.’ இச்சூழலில் கற்களைச் செதுக்கப் பயன்படுத்தப்படும் உலோகக் கருவியை இது குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: அமைத்தால்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் நிபந்தனையைத் தமிழில் இயல்பான நிபந்தனை வினைமுற்று வெளிப்படுத்துகிறது; முந்தைய அறிவுறுத்தலுடனான தொடர்பு வசனத் தொடரால் தெளிவாகிறது.
- source_word: מִזְבַּח אֲבָנִים
  choice: கற்களால் ஒரு பலிபீடம்
  rationale: கற்களைக் கொண்டு செய்யப்படும் பலிபீடம் என்ற எபிரெயக் கட்டமைப்பின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: תַּעֲשֶׂה לִּי
  choice: எனக்காக ... நீ அமைத்தால்
  rationale: לִּי என்பதன் நோக்கு உறவை ‘எனக்காக’ எனப் பாதுகாக்கிறது; பலிபீடத்துடன் ‘அமை’ என்பது இயல்பான தமிழ்.
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: அதைச் செதுக்கப்பட்ட கற்களால் கட்டாதே
  rationale: சட்டக் கட்டளையை நேரடியான எதிர்மறை ஏவலாகத் தருகிறது; גָּזִית என்பது மனிதக் கருவியால் செதுக்கி வடிவமைக்கப்பட்ட கற்களைக் குறிக்கிறது.
- source_word: חַרְבְּךָ
  choice: உன் வாள்
  rationale: மூலச்சொல்லின் வழக்கமான நேரடிப் பொருளான ‘வாள்’ என்பதையே வைத்துள்ளது; அதை பொதுவாக ‘கருவி’ என்று பிரதியில் மாற்றவில்லை.
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: அதன்மேல் நீ ஓங்கினால்
  rationale: நוף வினையின் உயர்த்துதல் அல்லது வீசுதல் சார்ந்த படிமத்தைப் பாதுகாக்கிறது; இச்சூழலில் கல்லின்மேல் வாளைப் பயன்படுத்துவதைக் குறிக்கிறது.
- source_word: וַתְּחַלְלֶהָ
  choice: அதைத் தீட்டுப்படுத்திவிடுவாய்
  rationale: חלל என்பதன் வழிபாட்டு தூய்மை சார்ந்த எதிர்மறைப் பொருளை சாதாரண வாசகருக்குப் புரியும் தமிழில் தருகிறது; வெறும் உடல் சேதம் என்று குறுக்கவில்லை.
theological_decisions:
- issue: பலிபீடம் தீட்டுப்படுவதன் தன்மை
  choice: மனிதன் வாளை அல்லது உலோகக் கருவியைச் செதுக்கப்படாத கற்களின்மேல் பயன்படுத்துவது பலிபீடத்தை வழிபாட்டு ரீதியில் தீட்டுப்படுத்துகிறது.
  alternative: இது முதன்மையாக வன்முறையுடனான தொடர்பைத் தவிர்ப்பது அல்லது ஆடம்பரமின்மையைப் பேணுவது பற்றிய கட்டளை.
  rationale: חלל என்பது புனிதத்தை அவமதித்தல் அல்லது தீட்டுப்படுத்துதல் சார்ந்த சொல். ஆனால் அதற்கான விரிவான காரணத்தை வசனம் விளக்காததால், வன்முறை அல்லது எளிமை குறித்த குறிப்பிட்ட தத்துவ விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் எளிமையும் கொண்ட சட்டவழக்குப் பதிவு பயன்படுத்தப்பட்டுள்ளது. ‘பலிபீடம்,’ ‘செதுக்கப்பட்ட கற்கள்,’ ‘தீட்டுப்படுத்துதல்’ ஆகியவை வேதாகமச் சூழலைத் தக்கவைத்தபடியே பொதுவாசகருக்குப் புரியும் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
