revisions:
- from: எனக்காகக் கற்களால் ஒரு பலிபீடத்தை நீ அமைத்தால், அதைச் செதுக்கப்பட்ட கற்களால் கட்டாதே; ஏனெனில், உன் வாளை அதன்மேல் நீ ஓங்கினால்[a], அதைத் தீட்டுப்படுத்திவிடுவாய்.
