base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: ta
  text: உன் கடவுளாகிய யாவேயின் பெயரைப் பொய்யாகச் சுமக்காதே[a]. ஏனெனில், அவரது பெயரைப் பொய்யாகச் சுமக்கிறவனை யாவே தண்டிக்காமல் விடமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரியமாக, “உன் கடவுளாகிய யாவேயின் பெயரை வீணாக எடுத்துக்கொள்ளாதே” என மொழிபெயர்க்கப்படுகிறது. எபிரெய சொற்றொடரின் நேரடிப் பொருள், “பெயரை வெறுமைக்காகச் சுமக்காதே” என்பதற்கு நெருக்கமானது; இது பொய்யாணை, பொருளற்ற அழைப்பு, அல்லது கடவுளின் பெயரைத் தாங்குவதாகக் கூறிக்கொண்டு அவரைத் தவறாகப் பிரதிநிதித்துவப்படுத்துதல் ஆகியவற்றையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: சுமக்காதே / சுமக்கிறவனை
  rationale: எபிரெய வினையின் அடிப்படைப் பொருளான ‘தூக்குதல், சுமத்தல், சுமத்திச் செல்லுதல்’ என்பதையும், வசனத்தின் இரு பகுதிகளிலுள்ள சொல்லிணைப்பையும் காக்கிறது. ‘தவறாகப் பயன்படுத்தாதே’ என்பது பொருளை முன்னரே குறுக்கிவிடும்.
- source_word: שֵׁם / שְׁמוֹ
  choice: பெயரை / தமது பெயரை
  rationale: இது வெறும் உச்சரிப்பை மட்டுமல்லாமல் யாவேயின் வெளிப்படுத்தப்பட்ட அடையாளம், புகழ், உடன்படிக்கை உரிமை ஆகியவற்றையும் குறிக்கக்கூடிய ‘பெயர்’ என்ற பரந்த கருத்தைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய
  rationale: இரண்டாம் நபர் ஒருமையின் நேரடியான உடன்படிக்கை அழைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: לַשָּׁוְא
  choice: பொய்யாக
  rationale: שָׁוְא என்பதிலுள்ள பொய், வெறுமை, பயனின்மை, மதிப்பின்மை ஆகிய பொருள் வட்டத்தில், நவீன தமிழில் தெளிவாக வாசிக்கக்கூடிய தேர்வு. அதன் பரந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கட்டளைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: יְנַקֶּה (נקה)
  choice: தண்டிக்காமல் விடமாட்டார்
  rationale: குற்றத்திலிருந்து விடுவிக்காமை அல்லது தண்டனையின்றி விடாமை என்ற நீதித்துறை சார்ந்த வலிமையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר
  choice: சுமக்கிறவனை
  rationale: அவ்வாறு செய்கிற எந்த நபரையும் குறிக்கும் உறவுத்தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இறைபெயரைச் சுமப்பது குறித்த தடையின் பரப்பு
  choice: யாவேயின் பெயரைப் பொய்யாக, வெறுமையாக அல்லது தகாத முறையில் சுமப்பதற்கு எதிரான பரந்த தடை
  alternative: இதைப் பொய்யாணைக்கு மட்டும் அல்லது இறைநிந்தையான பேச்சுக்கு மட்டும் வரையறுத்தல்
  rationale: נשא (‘சுமத்தல்/சுமத்திச் செல்லுதல்’), שֵׁם (‘பெயர்’), שָׁוְא (‘பொய்/வெறுமை/மதிப்பின்மை’) ஆகியவற்றின் சேர்க்கை வெறும் தவறான உச்சரிப்பைக் காட்டிலும் விரிவானது. ஆகவே முதன்மை உரை அந்தப் பரப்பை மூடிவிடாமல் வைக்கிறது; அடிக்குறிப்பு சாத்தியமான பயன்பாடுகளை விளக்குகிறது.
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: தனிப்பட்ட இறைத் திருப்பெயரை பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து, மூல உரையின் பெயர்ச்சார் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் ஒருமை ‘உன்’ மற்றும் נשא வினையின் இருமுறைத் தோற்றம் பாதுகாக்கப்பட்டுள்ளன. யாவேயைக் குறிக்கும் இடத்தில் மரியாதைப் பன்மை வினைமுற்றும் ‘தமது’ என்பதும் தமிழின் கண்ணியமான வழக்கிற்காகப் பயன்படுத்தப்பட்டுள்ளன.
