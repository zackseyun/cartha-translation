  naturalness: ‘உன் கடவுளாகிய யாவேயின் பெயரைப் பொய்யாகச் சுமக்காதே’ என்பது மரியாதைமிக்க நவீனத் தமிழில் இயல்பாகவும் கட்டளை நடையில் தெளிவாகவும் உள்ளது. அடிக்குறிப்பிலுள்ள பாரம்பரிய மொழிபெயர்ப்பு மட்டும் ‘வழங்காதே’ என இருப்பது இயல்பான நிலையான சொல்லாட்சியல்ல; ‘வீணாக எடுத்துக்கொள்ளாதே’ என்பது பொருத்தமானது.
