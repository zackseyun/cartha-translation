base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: ta
  text: எனக்காக மண்ணால் ஒரு பலிபீடத்தை அமைக்க வேண்டும். அதன்மேல் உன் தகனபலிகளையும் சமாதானபலிகளையும், உன் ஆடுகளையும் மாடுகளையும் பலியிட வேண்டும். என் பெயரை நான் நினைவுகூரச் செய்யும் ஒவ்வோர் இடத்திலும்[a] உன்னிடம் வந்து உன்னை ஆசீர்வதிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பெயரை நான் அறிவிக்கும் ஒவ்வோர் இடத்திலும்” அல்லது “என் பெயரை நான் பதிவுசெய்யும் ஒவ்வோர் இடத்திலும்.” எபிரெய வினைச்சொல் காரணவினை வடிவில் உள்ளது; கடவுளுடைய பெயரை நினைவுகூரச் செய்தல், குறிப்பிடச் செய்தல் அல்லது அறிவித்தல் ஆகிய நுண்பொருள்கள் இதில் அடங்கியிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: மண்ணால் ஒரு பலிபீடம்
  rationale: இந்த இணைப்புச் சொற்றொடர் மண் அல்லது நிலத்தால் செய்யப்பட்ட பலிபீடத்தைக் குறிக்கிறது. தமிழில் பொருளையும் இயல்பான நடையையும் காக்கிறது.
- source_word: תַּעֲשֶׂה לִּי
  choice: எனக்காக ... அமைக்க வேண்டும்
  rationale: சட்ட அறிவுறுத்தலாக வரும் இரண்டாம் நபர் வினையைத் தெளிவான கட்டளையாகவும், לִי என்பதன் அர்ப்பணிப்பு நோக்கை ‘எனக்காக’ என்றும் வழங்குகிறது.
- source_word: וְזָבַחְתָּ עָלָיו
  choice: அதன்மேல் ... பலியிட வேண்டும்
  rationale: பலிச் சூழலில் זבח என்பதற்கு ‘பலியிடு’ இயல்பானது; עָלָיו பலிபீடத்தின்மேல் என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: עֹלֹתֶיךָ
  choice: உன் தகனபலிகள்
  rationale: முழுவதும் எரிக்கப்படும் பலிக்கான வழக்கமான, துல்லியமான தமிழ்ச் சொல்.
- source_word: שְׁלָמֶיךָ
  choice: உன் சமாதானபலிகள்
  rationale: நலன், முழுமை, சமாதானம் ஆகிய பொருள் வீச்சுடன் தொடர்புடைய பலிவகையை மரபாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் குறிக்கிறது.
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: உன் ஆடுகளையும் மாடுகளையும்
  rationale: צֹאן சிறு கால்நடைகளையும் בָּקָר மாட்டினத்தையும் குறிக்கின்றன. சாதாரண வாசகருக்குத் தெளிவான வகையில் விலங்கு வகைகளை நேரடியாக வழங்குகிறது.
- source_word: בְּכָל הַמָּקוֹם
  choice: ஒவ்வோர் இடத்திலும்
  rationale: எபிரெயச் சொற்றொடரின் பகிர்வுப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: என் பெயரை நான் நினைவுகூரச் செய்யும்
  rationale: זכר என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும், கடவுளுடைய செயற்பாட்டையும் காக்கிறது; அறிவித்தல் அல்லது பதிவுசெய்தல் என்ற ஒரே நுண்பொருளுக்குள் வாசகத்தைச் சுருக்கவில்லை.
- source_word: אָבֹא אֵלֶיךָ וּבֵרַכְתִּיךָ
  choice: உன்னிடம் வந்து உன்னை ஆசீர்வதிப்பேன்
  rationale: கடவுளின் அணுகிவருதலையும் தொடர்ந்து அவர் அளிக்கும் ஆசீர்வாதத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי என்பதில் கடவுளுடைய செயலின் பொருள்
  choice: என் பெயரை நான் நினைவுகூரச் செய்யும்
  alternative: என் பெயரை நான் அறிவிக்கும் / என் பெயரை நான் பதிவுசெய்யும்
  rationale: காரணவினை வடிவத்தையும், தமது பெயர் நினைவுகூரப்பட வேண்டிய இடங்களை கடவுளே ஏற்படுத்துகிறார் என்ற செயற்பாட்டையும் இவ்வாசகம் காக்கிறது. அது எவ்வாறு நிகழ்கிறது என்பதை அறிவித்தல் அல்லது எழுதிப் பதிவுசெய்தல் எனத் தீர்மானிக்காமல் மூலத்தின் பொருள் நெருக்கடியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. பலிச் சொற்களுக்கு பரவலாக அறியப்படும் ‘தகனபலி’, ‘சமாதானபலி’, ‘பலிபீடம்’ ஆகியவை வைக்கப்பட்டுள்ளன; காரணவினையின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
