lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: உனக்கு இருக்கக் கூடாது
  rationale: எபிரெயக் கட்டமைப்பு சொற்படியாக ‘உனக்கு இருக்காது’ என இருப்பினும், உடைமை அல்லது ஒருவருக்குரியதாக இருப்பதைச் சுட்டுகிறது; தமிழில் தடைப்பொருளை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்த ‘உனக்கு இருக்கக் கூடாது’ என மொழிபெயர்க்கப்பட்டது. ஒருமை முன்னிலைத் தொடர்பும் காக்கப்படுகிறது.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்கள்
  rationale: பன்மையான אֱלֹהִים என்பதற்கு இச்சூழலில் ‘தெய்வங்கள்’ என்பதும், אֲחֵרִים என்பதற்கு மிகைப்படுத்தாமல் ‘வேறு’ என்பதும் இயல்பான தமிழாக்கங்கள்.
- source_word: עַל פָּנָי
  choice: என்னைத் தவிர
  rationale: சொற்படியாக ‘என் முகத்துக்கு முன்பாக’ எனும் எபிரெய மரபுத்தொடர் இவ்வுடன்படிக்கைச் சூழலில் தனிப்பட்ட விசுவாசத்தையும் விலக்கத்தையும் குறிக்க முடியும். இயல்பான தமிழில் ‘என்னைத் தவிர’ முதன்மை உரையாகத் தரப்பட்டு, இடநிலை/சன்னிதி நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: עַל פָּנָי என்பதன் பொருள்
  choice: என்னைத் தவிர
  alternative: எனக்கு முன்பாக; என் முன்னிலையில்
  rationale: இத்தொடர் ‘என் முன்னிலையில்’ என்ற இடநிலைப் பொருளையும், இச்சூழலில் ‘என்னைத் தவிர’ என்ற விலக்கப் பொருளையும் தாங்கக்கூடும். வாசகருக்குத் தெளிவான விலக்கப் பொருள் முதன்மை உரையில் வைக்கப்பட்டாலும், எபிரெயத்தின் உண்மையான பொருள் விரிவு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை முன்னிலையை ‘உனக்கு’ எனக் காத்து, கட்டளையின் கண்ணியமும் நேரடித்தன்மையும் பேணப்பட்டுள்ளன. ‘தெய்வங்கள்’ என்பது பொதுவாசகருக்கு இயல்பாகவும் இச்சூழலுக்கு ஏற்றதாகவும் உள்ளது.
