source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אֶל מֹשֶׁ֔ה דַּבֵּר אַתָּ֥ה עִמָּ֖/נוּ וְ/נִשְׁמָ֑עָה וְ/אַל יְדַבֵּ֥ר עִמָּ֛/נוּ אֱלֹהִ֖ים פֶּן נָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: ta
  text: அவர்கள் மோசேயிடம், “நீரே எங்களோடு பேசுங்கள்; நாங்கள் செவிகொடுப்போம்.[a] ஆனால் கடவுள் எங்களோடு பேச வேண்டாம்; இல்லையெனில் நாங்கள் இறந்துவிடுவோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் கேட்போம்.” எபிரெய வினைச்சொல் கவனமாகக் கேட்பதையும், கேட்டதற்கு இணங்கி நடப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: அவர்கள் மோசேயிடம் ... என்றார்கள்
  rationale: வய்யிக்தோல் வடிவம் கதை நிகழ்வை எளிய இறந்தகாலத்தில் முன்னெடுக்கிறது; אֶל என்பதற்கு இயல்பான தமிழில் ‘மோசேயிடம்’ பொருந்துகிறது.
- source_word: דַּבֵּר אַתָּה
  choice: நீரே ... பேசும்
  rationale: கட்டளை வினையுடன் வரும் வெளிப்படையான ‘நீர்’ என்ற பதிலிடுபெயர் மோசேதான் பேச வேண்டும் என்ற வலியுறுத்தலைக் காட்டுகிறது. மரியாதை ஒருமையான ‘நீரே’ மற்றும் ‘பேசும்’ dignified direct address-ஐ வழங்குகின்றன.
- source_word: עִמָּנוּ
  choice: எங்களோடு
  rationale: עִם என்பதன் அடிப்படை உடனிணைவு பொருளை ‘எங்களோடு’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְנִשְׁמָעָה
  choice: நாங்கள் செவிகொடுப்போம்
  rationale: இந்த வினை கேட்பதையும் கவனமாக ஏற்றுக்கொள்வதையும் குறிக்கலாம். சூழலில் பதிலளிக்கும் கேட்பை ‘செவிகொடுப்போம்’ இயல்பாக வெளிப்படுத்துகிறது; ‘கேட்போம்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאַל יְדַבֵּר ... אֱלֹהִים
  choice: ஆனால் கடவுள் ... பேச வேண்டாம்
  rationale: אַל உடன் வரும் வினை தடை அல்லது வேண்டுகோள் சார்ந்த எதிர்மறை விருப்பத்தைத் தருகிறது; தமிழில் ‘பேச வேண்டாம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது. וְ இங்குள்ள முரணை ‘ஆனால்’ வெளிப்படுத்துகிறது.
- source_word: פֶּן נָמוּת
  choice: பேசினால் நாங்கள் இறந்துவிடுவோம்
  rationale: פֶּן அஞ்சப்படும் விளைவை அறிமுகப்படுத்துகிறது. நவீன தமிழில் ‘பேசினால் ... இறந்துவிடுவோம்’ அந்தக் காரண–விளைவு அச்சத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் எண்ணும் சுட்டுப்பொருளும்
  choice: ஒருமைப் பொருளில் ‘கடவுள்’
  alternative: ‘தெய்வங்கள்’
  rationale: சீனாய் சூழலும் ஒருமை வினை வடிவமும் இஸ்ரவேலின் கடவுளையே சுட்டுகின்றன; பன்மை வாசிப்பு இங்கு இலக்கணத்திற்கும் சூழலுக்கும் பொருந்தாது.
- issue: וְנִשְׁמָעָה என்பதில் கேட்பும் கீழ்ப்படிதலும் இடையிலான பொருள் பரப்பு
  choice: முதன்மை உரையில் ‘செவிகொடுப்போம்’
  alternative: ‘கேட்போம்’ அல்லது வெளிப்படையாக ‘கீழ்ப்படிவோம்’
  rationale: ‘செவிகொடுப்போம்’ கவனமாகக் கேட்டு ஏற்றுக்கொள்ளும் நுணுக்கத்தைத் தக்கவைக்கிறது; ‘கீழ்ப்படிவோம்’ என்று மட்டும் மொழிபெயர்ப்பது இவ்விடத்தில் உள்ள உண்மையான சொற்பொருள் பரப்பை அளவுக்கு மீறித் தீர்மானித்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. மோசேயை நோக்கிய மரியாதை ஒருமைக்கு ‘நீரே’ தேர்ந்தெடுக்கப்பட்டது. ‘எங்களோடு’ என்பது எபிரெய முன்னிடைச்சொல்லின் உடனிணைவு நுணுக்கத்தைப் பாதுகாக்கிறது; பழமையான ‘அன்றேல்/இல்லையேல்’ அமைப்புக்குப் பதிலாக அஞ்சப்படும் விளைவு தெளிவாகத் தரப்பட்டுள்ளது.
