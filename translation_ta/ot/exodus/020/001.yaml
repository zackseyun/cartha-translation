lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: உரைத்துச்
  rationale: தொடர்ச்சியான கதைநடையில் வரும் ‘பேசினார்/உரைத்தார்’ என்ற பொருளை, பின்வரும் לֵאמֹר உடன் இயல்பாக இணைக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கும் பொதுவான, மரியாதைமிக்க நவீனத் தமிழ் இணை.
- source_word: כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள் அனைத்தையும்
  rationale: דְּבָרִים என்பதன் நேரடியான ‘வார்த்தைகள்’ என்ற பொருளையும், முழுத் தொகுப்பைக் குறிக்கும் כָּל என்பதையும் காக்கிறது.
- source_word: לֵאמֹר
  choice: 'சொன்னதாவது:'
  rationale: அடுத்து வரும் நேரடி உரையை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை இயல்பான தமிழில் வெளிப்படுத்தி, இரட்டைப் பேச்சுவினையின் வலிமையையும் ஓரளவு காக்கிறது.
