base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: ta
  text: ஏனெனில், யாவே ஆறு நாட்களில் வானங்களையும் பூமியையும், கடலையும், அவற்றில் உள்ள அனைத்தையும் உண்டாக்கினார்; ஏழாம் நாளில் ஓய்ந்தார்.[a] ஆகவே, யாவே ஓய்வுநாளை ஆசீர்வதித்து, அதைப் புனிதமாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழாம் நாளில் வேலையை நிறுத்தினார்.” எபிரேய வினைச்சொல் ஓய்வதையோ, செய்துவந்த வேலையை நிறுத்துவதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய ஓய்வுநாள் கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שֵׁשֶׁת יָמִים
  choice: ஆறு நாட்களில்
  rationale: படைப்புச் செயல் நிகழ்ந்த காலவரம்பைத் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் குறிக்கிறது.
- source_word: עָשָׂה
  choice: உண்டாக்கி
  rationale: வானங்கள், பூமி, கடல் ஆகியவற்றை நேரடிப் பொருள்களாகக் கொண்ட படைப்புச் சூழலில் ‘செய்தார்’ என்பதைவிட இயல்பான தமிழ்ச் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַשָּׁמַיִם
  choice: வானங்கள்
  rationale: எபிரேயப் பன்மையைப் பாதுகாத்து, படைப்புச் சூழலின் பரந்த பொருளைத் தருகிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: ‘வானங்கள்’ என்பதுடன் இணைந்த படைப்புச் சூழலில் இது ஒரு குறிப்பிட்ட நாட்டை அல்ல, பூமியைக் குறிக்கிறது.
- source_word: הַיָּם
  choice: கடல்
  rationale: மூலத்தின் ஒருமையைத் தக்கவைத்து இயல்பான தமிழில் வழங்குகிறது.
- source_word: כָּל אֲשֶׁר בָּם
  choice: அவற்றில் உள்ள அனைத்தையும்
  rationale: வானங்கள், பூமி, கடல் ஆகிய அனைத்திலும் உள்ளவற்றை உள்ளடக்கும் உறவுப்பிரிவைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיָּנַח
  choice: ஓய்ந்திருந்தார்
  rationale: ஓய்வுநாள் சூழலில் ஓய்வு அல்லது பணிநிறுத்தம் என்ற பொருளை இயல்பாகக் காட்டுகிறது; களைப்பை அவசியமாக உணர்த்தாது.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: ஓய்வு நிகழ்ந்த நாளைத் தெளிவாகக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: עַל כֵּן
  choice: ஆகவே
  rationale: படைப்பின் நடைமுறையிலிருந்து ஓய்வுநாளின் ஆசீர்வாதமும் புனிதப்படுத்தலும் முடிவாக வருவதைச் சுட்டுகிறது.
- source_word: בֵּרַךְ
  choice: ஆசீர்வதித்து
  rationale: ברך என்பதற்கான வழக்கமான, தெளிவான வேதாகமத் தமிழாக்கம்.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: அதைப் புனிதமாக்கினார்
  rationale: அந்த நாளைத் தனியே பிரித்து புனிதமானதாக ஆக்கிய செயலை நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: ஏழாம் நாளில் கடவுளின் செயல் நிறுத்தத்தை விவரித்தல்
  choice: ஓய்ந்திருந்தார்
  alternative: வேலையை நிறுத்தினார்
  rationale: נוּחַ வினைச்சொல் ஓய்வதையும் செயலை நிறுத்துவதையும் குறிக்க முடியும். முதன்மை உரையில் இயல்பான ‘ஓய்ந்திருந்தார்’ பயன்படுத்தப்பட்டு, ‘நிறுத்தினார்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; இது கடவுள் களைப்படைந்தார் என்று அவசியமாகக் கூறுவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமத்துக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. நீளமான எபிரேய வாக்கியத்தின் காரண–முடிவு அமைப்பு ‘ஏனெனில்’ மற்றும் ‘ஆகவே’ மூலம் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது. ‘ஓய்வுநாள்’ என்பது சபாத்தைக் குறிக்கும் புரிந்துகொள்ளக்கூடிய தமிழ்ச் சொல்.
