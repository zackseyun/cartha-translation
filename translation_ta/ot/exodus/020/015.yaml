id: EXO.20.15
reference: Exodus 20:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹ֖א תִּגְנֹֽב׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/015.yaml
  text: You shall not steal[a].
translation:
  language: ta
  text: திருடாதே[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சட்டநடையில், ‘நீ திருடக்கூடாது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: -ஆதே
  rationale: எபிரேய மறுப்புச் சொல் இங்கு நேரடியான தடையை உருவாக்குகிறது. தமிழில் எதிர்மறை ஏவல் விகுதியான ‘-ஆதே’ இதை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: תִּגְנֹב
  choice: திருடு
  rationale: גנב என்ற வினையின் பொதுவான பொருள் ‘திருடு’. சில சூழல்களில் அது ஆளைக் கடத்துவதைக் குறிக்கலாம்; ஆனால் இவ்வசனத்தில் செயப்படுபொருள் குறிப்பிடப்படாததால், அதன் பரந்த பொதுப் பொருளைத் தக்கவைத்துள்ளோம்.
theological_decisions:
- issue: பத்துக் கட்டளையிலுள்ள தடையின் வடிவம்
  choice: திருடாதே.
  alternative: நீ திருடக்கூடாது.
  rationale: לֹא + imperfect என்பது உடன்படிக்கைச் சட்டத்தில் நேரடியான தடையாக உள்ளது. ‘திருடாதே’ என்பது தமிழில் கட்டளையின் சுருக்கத்தையும் நேரடித்தன்மையையும் காக்கிறது; ‘நீ திருடக்கூடாது’ சட்டநடையை அதிகமாக வெளிப்படுத்தும் சாத்தியமான மாற்று.
translation_notes:
  register: சுருக்கமான, கண்ணியமான நவீனத் தமிழ். எபிரேயப் பத்துக் கட்டளையின் நேரடியான தடை வடிவம் இயல்பான தமிழ் எதிர்மறை ஏவலால் வழங்கப்பட்டுள்ளது.
