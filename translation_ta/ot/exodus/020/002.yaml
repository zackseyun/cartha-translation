  terminology: ‘யாவே’ appropriately transliterates יהוה, and ‘அடிமைகள்’ rightly conveys the bonded status denoted by עבדים in this context. ‘அடிமைகளின் வீடு’ retains the source’s concrete construct imagery; the footnote appropriately supplies the idiomatic alternative without replacing the main-text wording.
