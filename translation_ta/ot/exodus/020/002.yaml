  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: ta
  text: “நானே உன் கடவுளாகிய யாவே[a]; உன்னை எகிப்து நாட்டிலிருந்தும் அடிமைகளின் வீட்டிலிருந்தும்[b] வெளியே கொண்டுவந்தவன்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் YHWH; மரபாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது; இங்கு ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: இன்னும் இயல்பாக, ‘அடிமைத்தனத்தின் வீட்டிலிருந்து’ எனலாம். எபிரெயத்தில் நேரடியாக ‘அடிமைகளின் வீட்டிலிருந்து’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: நானே
  rationale: தனித்து வரும் முதல் நபர் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் ‘நானே’ இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டமல்ல, இறைப் பெயரான நான்கு எழுத்துப் பெயர்; ஆகவே அதன் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இங்கு ஒருமைச் சுட்டுடன் இஸ்ரயேலின் கடவுளையே குறிக்கிறது. எபிரெயச் சொல்லின் வடிவம் பன்மையாக இருந்தாலும் பொருள் ஒருமை.
- source_word: הוֹצֵאתִיךָ
  choice: உன்னை ... வெளியே கொண்டுவந்த
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல்/வெளியே கொண்டுவருதல்’ என்று பொருள்படும்; ‘வெளியே கொண்டுவந்த’ என்பது செயப்படுபொருளையும் மீட்புச் செயலையும் இயல்பாகத் தருகிறது.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: מן குறிக்கும் புறப்படும் இடத்தையும், ‘எகிப்து நாடு’ என்ற முறையான புவியியல் சொல்லாட்சியையும் பாதுகாக்கிறது.
- source_word: מִבֵּית עֲבָדִים
  choice: அடிமைகளின் வீட்டிலிருந்து
  rationale: எபிரெயின் concrete construct phrase ஆகிய ‘அடிமைகளின் வீடு’ என்ற உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் עֲבָדִים கட்டுண்ட அடிமைகளைக் குறிக்கிறது, சாதாரண பணியாட்களை அல்ல.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாகத் தனிப்பட்ட இறைப் பெயர் உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது பெயருக்கும் பட்டத்திற்கும் உள்ள வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: עֲבָדִים என்பதன் சமூக நிலை
  choice: அடிமைகள்
  alternative: பணியாளர்கள்
  rationale: எகிப்தியக் கட்டாய உழைப்பு மற்றும் அடிமைத்தனச் சூழலில் கட்டுண்ட நிலையே முன்னிலையில் உள்ளது; ‘பணியாளர்கள்’ அதன் தீவிரத்தைக் குறைத்துவிடும்.
- issue: אָנֹכִי என்பதிலுள்ள வலியுறுத்தல்
  choice: நானே
  alternative: நான்
  rationale: சுயாதீன முதல் நபர் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் வெளிப்படையாகக் காக்கிறது; இதனால் வேறு எவரையும் மறுக்கும் பொருளைத் தேவையின்றி சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, உரத்த அறிவிப்பு நடையைப் பயன்படுத்துகிறது. தமிழின் இயல்பான வாக்கிய அமைப்புக்காக அடையாளப்படுத்தும் ‘யாவே நானே’ இறுதியில் வைக்கப்பட்டுள்ளது; அதேவேளை எபிரெயத்தின் ‘நான்’ என்ற வலியுறுத்தல் ‘நானே’ என்பதில் பாதுகாக்கப்படுகிறது. ஒருமை இரண்டாம் நபர் ‘உன்/உன்னை’ மூலம் இஸ்ரயேலை ஒருங்கிணைந்த ஒருவராக அணைக்கும் மூலநடை காக்கப்பட்டுள்ளது.
