base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: ta
  text: உனக்காகச் செதுக்கப்பட்ட உருவத்தையோ[a], மேலே வானங்களில் இருப்பதற்கோ, கீழே பூமியில் இருப்பதற்கோ, பூமிக்குக் கீழே உள்ள நீரில் இருப்பதற்கோ ஒப்பான எந்த வடிவத்தையோ[b] செய்யாதே.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செதுக்கிய உருவம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் செதுக்கி உருவாக்கப்பட்ட உருவத்தைக் குறிப்பாகக் குறிக்கிறது; ‘விக்கிரகம்’ என்பது அதன் வழிபாட்டுப் பயன்பாட்டை விளக்கமாகச் சேர்க்கும் சொல்.
    reason: lexical_alternative
  - marker: b
    text: ‘எந்த ஒப்புருவம்’ அல்லது ‘எந்தப் பிரதிநிதித்துவ உருவம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'இந்த வசனம் படைக்கப்பட்ட உலகின் தளங்களைப் பண்டைய இடவியல் மொழியில் விவரிக்கிறது: மேலே வானங்கள், கீழே பூமி, பூமிக்குக் கீழே நீர்கள்.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: உனக்காகச் செய்யாதே
  rationale: לֹא உடன் வரும் இரண்டாம் நபர் வினை நேரடியான தடையைத் தெரிவிக்கிறது; לְךָ என்பதன் தன்நல/தனக்குரிய பொருளை ‘உனக்காக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פֶסֶל
  choice: செதுக்கப்பட்ட உருவம்
  rationale: இந்தச் சொல் செதுக்கி வடிவமைக்கப்பட்ட உருவத்தைக் குறிப்பாகச் சுட்டுகிறது. ‘விக்கிரகம்’ என்பது வழிபாட்டு நோக்கத்தை முன்கூட்டியே விளக்கும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: וְכָל תְּמוּנָה
  choice: வேறு எந்த வடிவம்
  rationale: תְּמוּנָה என்பதற்கு வடிவம், ஒப்புருவம், பிரதிநிதித்துவம் ஆகிய பொருள் வாய்ப்புகள் உள்ளன. ‘வடிவம்’ இயல்பான தமிழில் அந்தப் பொருள் விரிவை ஓரளவு காக்கிறது; כָל என்பதன் முழுமையையும் ‘எந்த’ தெரிவிக்கிறது.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: மேலே வானங்களில் இருப்பவை
  rationale: שָׁמַיִם என்ற எபிரெயப் பன்மை வடிவத்தையும் מִמַּעַל என்ற மேல்நிலைச் சித்திரத்தையும் பாதுகாக்கிறது.
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: கீழே பூமியில் இருப்பவை
  rationale: மேலே/கீழே என்ற இடவியல் எதிரிணையைத் தக்கவைத்து, בָּאָרֶץ என்பதைக் தமிழில் இயல்பாக ‘பூமியில்’ என வழங்குகிறது.
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: பூமிக்குக் கீழுள்ள நீர்நிலைகளில் இருப்பவை
  rationale: மூலத்தின் ‘பூமிக்குக் கீழுள்ள நீரில்’ என்ற பண்டைய இடவியல் காட்சியை விளக்கிச் சீர்செய்யாமல் காக்கிறது; பன்மையான מַּיִם-ஐ இயல்பான தமிழில் ‘நீர்நிலைகள்’ என வழங்குகிறது.
- source_word: וְ
  choice: -யோ ... -யோ
  rationale: பட்டியலிலுள்ள மாற்று வகைகளைத் தமிழில் இயல்பாக இணைக்கும் பிரிப்புநிலை அமைப்பு; எபிரெய இணைப்புச் சொற்களை இயந்திரமாக ‘மற்றும்’ என்று மீட்டுரைப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: இரண்டாம் கட்டளையிலுள்ள தடையின் வரம்பு
  choice: செதுக்கப்பட்ட உருவத்தையும் படைக்கப்பட்ட உலகிலுள்ளவற்றின் எந்த வடிவத்தையும் செய்வதை வசனம் தடைசெய்வதாக மொழிபெயர்க்கப்பட்டுள்ளது; ‘வழிபடுவதற்காக’ என்பது சேர்க்கப்படவில்லை.
  alternative: எல்லா காட்சிக் கலையையும் முற்றிலும் தடைசெய்வதாக விரிவாக்குதல்; அல்லது வழிபாட்டுக்கான விக்கிரகங்கள் மட்டுமே என்று மொழிபெயர்ப்பிலேயே வரம்பிடுதல்.
  rationale: எபிரெய உரை செதுக்கப்பட்ட உருவத்தையும் எந்த வடிவத்தையும் பெயரிட்டு, வானம், பூமி, நீர் ஆகிய தளங்களைப் பட்டியலிடுகிறது. பணிதல் மற்றும் வழிபாடு பற்றிய சூழல் அடுத்த வசனத்தில் வருகிறது. ஆகவே ‘விக்கிரகம்’ அல்லது ‘வழிபடுவதற்காக’ என்று இங்கே சேர்க்காமல் உரையின் இறையியல் இழுபறி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் நேரடியான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ‘விக்கிரகம்’ என்ற விளக்கமளிக்கும் சமயச் சொல்லுக்குப் பதிலாக மூலச்சொல்லின் உருவாக்க முறையைத் தெரிவிக்கும் ‘செதுக்கப்பட்ட உருவம்’ தேர்ந்தெடுக்கப்பட்டது. நீண்ட எபிரெய வாக்கியத்தை தமிழில் தெளிவாக வாசிக்க இடவியல் பட்டியல் முன்னிறுத்தப்பட்டுள்ளது; பொருள் உறவுகள் மாற்றப்படவில்லை.
