base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: ta
  text: மக்கள் தொலைவில் நின்றனர்; மோசேயோ கடவுள் இருந்த காரிருளை[a] அணுகினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கருமேகம்,” “இருண்ட மங்கல்.” எபிரெயச் சொல், கடவுள் தம்மை வெளிப்படுத்தும் நிகழ்வோடு தொடர்புடைய அடர்ந்த இருளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: நின்றார்கள்
  rationale: עמד என்பதன் இவ்வடிவம் மக்கள் ஒரு இடத்தில் நின்ற நிலையை எளிய இறந்தகால நிகழ்வாகக் கூறுகிறது. இயல்பான நவீனத் தமிழில் பன்மை மரியாதையின்றி ‘நின்றார்கள்’ என்பது கூட்டத்தைக் குறிக்கத் தெளிவாக அமைகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: சீனாய் மலையருகே ஏற்கெனவே குறிப்பிடப்பட்டிருந்த கூடியிருந்த மக்களையே குறிப்பதால், எபிரெயத்தில் இல்லாத ‘இஸ்ரவேல்’ என்ற சொல்லைச் சேர்க்காமல் ‘மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מֵרָחֹק
  choice: தொலைவில்
  rationale: இது இடவியல் தூரத்தையும் பிரிவையும் குறிக்கிறது; ‘தொலைவில்’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ்.
- source_word: נִגַּשׁ
  choice: அணுகினார்
  rationale: נגשׁ என்பது அருகில் செல்லுதல் அல்லது நெருங்குதல் என்று பொருள்படும். ‘அணுகினார்’ இங்கு மோசே அந்த இருள் இருந்த இடத்தை நோக்கிச் சென்றதைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָעֲרָפֶל
  choice: காரிருள்
  rationale: עֲרָפֶל என்பது அடர்ந்த இருள் அல்லது மங்கலைக் குறிக்கும்; இறைவெளிப்பாட்டுடன் தொடர்புடைய மறைவையும் அச்சமூட்டும் அடர்த்தியையும் ‘காரிருள்’ இயல்பாகப் பாதுகாக்கிறது. ‘கருமேகம்’ என்பது மேகமாகத் தீர்மானித்து விடக்கூடியதால் முதன்மை உரையில் தவிர்க்கப்பட்டது.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: கடவுள் இருந்த
  rationale: இடத்தைக் குறிக்கும் சார்பு வாக்கியத்தைத் தமிழில் இயல்பாக ‘கடவுள் இருந்த’ என்று பெயரெச்சத் தொடராக வழங்குகிறது; ‘அங்கே’ என்பதைத் தனியாகச் சேர்ப்பது தேவையில்லை.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் אֱלֹהִים இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பயன்பாடு; ஆகவே ‘கடவுள்’ பொருத்தமானது.
theological_decisions:
- issue: இருளில் வெளிப்படும் கடவுளின் பிரசன்னம்
  choice: עֲרָפֶל என்பதை ‘காரிருள்’ என்று நேரடியாக வழங்கி, ‘கடவுள் இருந்த’ என்ற உரையின் முரணுணர்வை அப்படியே வைத்தல்.
  alternative: ‘கடவுள் பிரசன்னமாயிருந்த கருமேகம்’ அல்லது ‘கடவுள் இருந்த மங்கல்’
  rationale: கடவுளின் பரிசுத்த பிரசன்னம் மறைவும் அணுகமுடியாமையும் நிறைந்த இருளோடு தொடர்புபடுத்தப்படும் இறையியல் பதற்றத்தை வசனம் தக்கவைக்கிறது. அதை வெறும் வானிலை நிகழ்வாகவோ விளக்கவுரையாகவோ மாற்றக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மோசேயோ’ என்பது மக்கள் தொலைவில் நின்றதற்கும் மோசே அணுகியதற்கும் இடையிலான எதிர்மறை ஒப்புமையை இயல்பாக வெளிப்படுத்துகிறது; மூலத்தில் உள்ள இறைவெளிப்பாட்டின் மறைமையை விளக்கிச் சமப்படுத்தாமல் பாதுகாக்கிறது.
