base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: ta
  text: ஆனால் ஏழாம் நாள் உன் கடவுளாகிய யாவேக்குரிய ஓய்வுநாள்[a]. அன்று நீ எந்த வேலையும் செய்யக் கூடாது—நீயோ, உன் மகனோ, உன் மகளோ, உன் ஆண் அடிமையோ, உன் பெண் அடிமையோ[b], உன் கால்நடைகளோ, உன் நகரங்களுக்குள் குடியேறி வாழும் வெளிநாட்டவரோ[c] வேலை செய்யக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழாம் நாளும்.” எபிரெய இணைப்புச்சொல்லை இவ்வாறும் மொழிபெயர்க்கலாம்; இங்கு முந்தைய ஆறு வேலைநாட்களுடனான வேறுபாட்டை “ஆனால்” வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “உன் ஆண் அடிமை … உன் பெண் அடிமை.” இவற்றை மரபாக “வேலைக்காரன் … வேலைக்காரி” என்றும் மொழிபெயர்த்துள்ளனர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உன் நகரங்களுக்குள் வாழும் குடியேறிய அந்நாட்டவர்.” எபிரெய גֵּר (கேர்) என்பது இஸ்ரவேலரிடையே குடியேறி வாழும் வெளிநாட்டவரைக் குறிக்கிறது; “உன் வாசல்கள்” என்பது இங்கு உன் நகரங்கள் அல்லது சமூக எல்லையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: ஆனால் ஏழாம் நாள்
  rationale: וְ என்ற இணைப்புச்சொல் அடிப்படையில் ‘மேலும்/அப்பொழுது’ என வரக்கூடியது; முந்தைய வசனத்தின் ஆறு வேலைநாட்களுடன் உள்ள எதிர்மறை ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்த ‘ஆனால்’ தேர்ந்தெடுக்கப்பட்டது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שַׁבָּת
  choice: ஓய்வுநாள்
  rationale: שַׁבָּת என்பது வேலை நிறுத்தி ஓய்வதற்காகத் தனியே பிரிக்கப்பட்ட நாளைக் குறிக்கும். நவீன வாசகர்களுக்குப் புரியும் மரபான தமிழ் வேதாகமச் சொல்லான ‘ஓய்வுநாள்’ மூலப்பெயர்ச்சொல்லின் கருத்தைத் தக்கவைக்கிறது.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவேக்குரிய
  rationale: לְ இங்கு உரிமை/அர்ப்பணிப்பு உறவைச் சுட்டுகிறது; ‘யாவேக்குரிய’ என்பது ஏழாம் நாள் அவருக்கெனப் பிரிக்கப்பட்டது என்பதைத் தெளிவாகக் காட்டுகிறது. יהוה நேரடியாக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: எந்த வேலையும் செய்யக் கூடாது
  rationale: לֹא உடனான வினைவடிவு சட்டக் கட்டளையின் தடை வலிமையைத் தருகிறது; כָל מְלָאכָה என்பதன் முழுமையான பரப்பை ‘எந்த வேலையும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: உன் ஆண் அடிமையோ, உன் பெண் அடிமையோ
  rationale: இணையாக வரும் עֶבֶד மற்றும் אָמָה வீட்டுக்குட்பட்ட அடிமை நிலையைச் சுட்டுகின்றன. சமூக யதார்த்தத்தை ‘வேலைக்காரர்’ என்று மென்மைப்படுத்தாமல், பாலின வேறுபாட்டுடன் வெளிப்படையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: וּבְהֶמְתֶּךָ
  choice: உன் கால்நடைகளோ
  rationale: בְּהֵמָה இச்சூழலில் வீட்டாருக்குச் சொந்தமான வளர்ப்பு விலங்குகளைத் தொகுப்பாகக் குறிக்கிறது; ‘கால்நடைகள்’ நவீனத் தமிழில் இயல்பானதும் போதிய பரப்புடையதும் ஆகும்.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: உன் வாசல்களுக்குள் குடியிருக்கும் அந்நியரோ
  rationale: גֵּר என்பது இஸ்ரவேலரிடையே குடியிருக்கும் இஸ்ரவேலர் அல்லாதவரைக் குறிக்கிறது; ‘குடியிருக்கும் அந்நியர்’ அந்த நிலையை வெளிப்படுத்துகிறது. ‘வாசல்களுக்குள்’ என்பது நகர எல்லை/அதிகார வட்டம் குறித்த மூல உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நான்கு எழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதில் தனிப்பெயரை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ஓய்வுநாள் தடையின் குடும்ப மற்றும் சமூகப் பரப்பு
  choice: பிள்ளைகள், அடிமைகள், கால்நடைகள், குடியிருக்கும் அந்நியர் ஆகிய அனைவரையும் தனித்தனியாகச் சேர்த்துக் கூறுதல்
  alternative: வீட்டார் அனைவரும் என்ற பொதுமைப்படுத்தல்
  rationale: எபிரெய உரை ஒவ்வொரு பிரிவையும் வெளிப்படையாகப் பட்டியலிடுகிறது. அவற்றைப் பொதுமைப்படுத்தாமல் வைத்திருப்பது கட்டளையின் சமூகப் பரப்பையும் உள்ளார்ந்த பதற்றத்தையும் காக்கிறது.
- issue: עבד/אמה சமூக நிலை
  choice: ஆண் அடிமை / பெண் அடிமை
  alternative: வேலைக்காரன் / வேலைக்காரி
  rationale: இச்சூழலில் சொற்கள் குடும்பத் தலைவனுக்குக் கீழ்ப்பட்ட அடிமை நிலையைச் சுட்டுகின்றன; மென்மையான மாற்றுச்சொல் வரலாற்றுச் சமூக நிலையை மறைக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான சட்டக் கட்டளை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரான ‘உன்/நீ’ தக்கவைக்கப்பட்டுள்ளது. பட்டியலின் ஒவ்வொரு உறுப்புக்கும் ‘-ஓ’ இணைத்து தடையின் தனித்தனி பரப்பு தெளிவாக்கப்பட்டுள்ளது; இறுதியில் ‘வேலை செய்யக் கூடாது’ மீண்டும் கூறப்படுவது தமிழில் பட்டியலின் இலக்கணத் தெளிவை உறுதிப்படுத்துகிறது.
