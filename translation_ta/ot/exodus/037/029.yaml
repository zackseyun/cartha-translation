  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: ta
  text: அவன் பரிசுத்த அபிஷேக எண்ணெயையும், தூய நறுமணத் தூபத்தையும்[a] ஒரு நறுமணக் கலவை செய்பவரின் வேலைப்பாடாகச் செய்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நறுமணப் பொருட்களின் தூபம்’ அல்லது ‘நறுமணப் பொருட்களால் செய்யப்பட்ட தூபம்.’ எபிரெயச் சொற்றொடர் நறுமணப் பொருட்களால் தயாரிக்கப்படும் தூபத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒரு நறுமணக் கலவை செய்பவரின் வேலை’ அல்லது ‘ஒரு நறுமணக் கலவை செய்பவரால் தயாரிக்கப்பட்டது.’ எபிரெயச் சொற்றொடர் ஒரு திறமைமிக்க நிபுணரின் தயாரிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் செய்தான்
  rationale: עשה என்பதன் wayyiqtol வடிவம் நிறைவுற்ற கடந்தகாலச் செயலைத் தொடர்ச்சியான விவரிப்பில் குறிக்கிறது; தமிழில் இயல்பான கதைநடையாக இவ்வாறு தரப்பட்டது.
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: பரிசுத்த அபிஷேக எண்ணெய்
  rationale: இந்த எபிரெயச் சொற்றொடர் அபிஷேகத்திற்காக ஒதுக்கப்பட்ட புனித எண்ணெயைக் குறிக்கிறது; வழிபாட்டுச் சூழலையும் இயல்பான தமிழ் நடையையும் இத்தேர்வு காக்கிறது.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: நறுமணத் தூபம்
  rationale: சொல்லுக்கு நெருக்கமாக இது ‘நறுமணப் பொருட்களின் தூபம்’ என்பதைக் குறிக்கிறது; ‘நறுமணத் தூபம்’ அதன் மணமிக்க இயல்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: טָהוֹר
  choice: தூய
  rationale: வழிபாட்டு மற்றும் பொருள் சார்ந்த இச்சூழலில் טָהוֹר தூய்மையைக் குறிக்கிறது; ‘தூய’ என்பது பொருத்தமான நவீனத் தமிழ் வடிவம்.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: நறுமணக் கலவை செய்பவரின் கைவேலையாக
  rationale: இந்தப் பெயர்ச்சொல் அமைப்பு, மணப்பொருட்களைத் திறமையாகக் கலந்து தயாரிக்கும் சிறப்புத் தொழிலாளரின் வேலையை வலியுறுத்துகிறது; ‘கைவேலை’ அதன் கைவினை நுட்பத்தை வெளிப்படுத்துகிறது.
