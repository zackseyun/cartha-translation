translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகம வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘அபிஷேக எண்ணெய்’, ‘தூபம்’ ஆகிய பரவலாக அறியப்பட்ட சொற்கள் வைக்கப்பட்டன; ரֹקֵחַ என்பதற்கு பழைய அல்லது தெளிவற்ற தொழிற்பெயரை விட விளக்கமான ‘நறுமணக் கலவை செய்பவர்’ தேர்ந்தெடுக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெற்றுள்ளன.
