translation_notes:
  register: நவீனத் தரத் தமிழில், கைவினை அமைப்பைச் சாதாரண வாசகர் தெளிவாகக் கற்பனை செய்யும் வகையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் மூன்று மடங்கு மீளுரை பேணப்பட்டுள்ளது; தமிழில் குறிப்பு தெளிவாக இருக்க ‘முதல்’, ‘அடுத்த’, ‘மற்ற’ என்பவை சூழலுக்கேற்ப சேர்க்கப்பட்டுள்ளன. இறுதி சுருக்கவாக்கியம் மூலத்தின் לְ־ சொற்றொடரின் பகிர்ந்தமைவு உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
