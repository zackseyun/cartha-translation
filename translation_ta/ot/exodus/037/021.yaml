translation:
  language: ta
  text: அதிலிருந்து வெளிவந்த இரு கிளைகளுக்குக் கீழே ஒரு குமிழ், அதிலிருந்து வெளிவந்த இரு கிளைகளுக்குக் கீழே ஒரு குமிழ், அதிலிருந்து வெளிவந்த இரு கிளைகளுக்குக் கீழே ஒரு குமிழ்—அதிலிருந்து வெளிவந்த ஆறு கிளைகளுக்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: குமிழ்
  rationale: குத்துவிளக்கின் வட்டமான அலங்கார உறுப்பைக் குறிக்கும் சொல்லாக இச்சூழலில் இயல்பாகவும் வடிவத்தைத் தெளிவாகவும் தெரிவிக்கிறது; ‘குமிழ் போன்ற அலங்காரம்’ என்ற மாற்றும் சாத்தியம்.
- source_word: תַּחַת
  choice: கீழே
  rationale: இரண்டு கிளைகள் பிரியும் இடத்திற்குக் கீழுள்ள அமைவிடத்தை நேரடியாகக் காட்டுகிறது.
- source_word: שְׁנֵי הַקָּנִים
  choice: இரண்டு கிளைகள்
  rationale: קנה என்பதன் அடிப்படைப் பொருள் நாணல் அல்லது தண்டு என்றாலும், விளக்குத்தண்டிலிருந்து நீளும் பக்க உறுப்புகளை இங்கு ‘கிளைகள்’ என்பது தாவர வடிவக் காட்சியோடு இயல்பாகக் குறிக்கிறது.
- source_word: מִמֶּנָּה
  choice: அதிலிருந்து
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயரைப் பேணி, முன்சூழலில் உள்ள விளக்குத்தண்டைக் குறிக்கிறது; மூலத்தில் இல்லாத பெயர்ச்சொல்லை இங்கு சேர்க்கவில்லை.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: ஆறு கிளைகளுக்கும்
  rationale: மூன்று குமிழ்களுக்கும் தலா இரண்டு கிளைகள் என்ற பகிர்ந்தமைவை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: அதிலிருந்து புறப்பட்ட
  rationale: மையத் தண்டிலிருந்து கிளைகள் வெளியே நீள்வதைச் செயற்படிமத்துடன் தெரிவிக்கிறது.
