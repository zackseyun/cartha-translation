- from: ஒரு கேருபை இந்தப் பக்கத்திலுள்ள ஒரு முனையிலிருந்தும், மற்றொரு கேருபை அந்தப் பக்கத்திலுள்ள ஒரு முனையிலிருந்தும் செய்தான். பாவநிவாரண மூடியிலிருந்தே[a] கேருபுகளை அதன் இரண்டு முனைகளிலும் செய்தான்.
  to: ஒரு கேருபை இந்த முனையிலிருந்தும், மற்றொரு கேருபை அந்த முனையிலிருந்தும் செய்தான். பாவநிவாரண மூடியின் இரு முனைகளிலிருந்தே[a] கேருபுகளைச் செய்தான்.
