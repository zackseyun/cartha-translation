  yaml_path: translation/ot/exodus/037/008.yaml
  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: ta
  text: ஒரு கேருபை இந்த முனையிலிருந்தும், மற்றொரு கேருபை அந்த முனையிலிருந்தும் செய்தான். பாவநிவாரண மூடியின் இரு முனைகளிலிருந்தே[a] கேருபுகளைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூடியிலிருந்து” அல்லது “பாவநிவாரண மூடியிலிருந்து”; எபிரேயத்தில் கப்போரெத் என்பது உடன்படிக்கைப் பெட்டியின் பொன் மூடியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּב
  choice: கேருபு
  rationale: உடன்படிக்கைப் பெட்டியுடன் தொடர்புடைய குறிப்பிட்ட விண்ணுலகக் காவல் உருவைக் குறிக்கும் எபிரேயப் பெயரை, ஊக விளக்கமின்றி வழக்கமான தமிழ்ச் சொல்லாகப் பாதுகாக்கிறது.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: இந்தப் பக்கத்திலுள்ள ஒரு முனையிலிருந்து ... அந்தப் பக்கத்திலுள்ள ஒரு முனையிலிருந்து
  rationale: இணையாக வரும் சொற்றொடர்கள் எதிரெதிரான இரு பக்கங்களையும் முனைகளையும் குறிக்கின்றன; தமிழ் வாசகருக்குத் தெளிவாக அந்த இடவியல் வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: הַכַּפֹּרֶת
  choice: பாவநிவாரண மூடி
  rationale: இது உடன்படிக்கைப் பெட்டியின் பொன் மூடியைக் குறிக்கும் வழிபாட்டுத் தொழில்நுட்பச் சொல். 'மூடி' என்ற பொருளையும் அதன் பாவநிவாரணத் தொடர்பையும் சுருக்கமாகத் தக்கவைக்கிறது; மாற்று எளிய மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עָשָׂה
  choice: செய்தான்
  rationale: பொதுவான எபிரேய வினையின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: מִשְּׁנֵי קְצֹוֹתָיו
  choice: அதன் இரண்டு முனைகளிலும்
  rationale: கேருபுகள் மூடியின் இரு முனைகளிலும் அமைந்திருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; முந்தைய 'மூடியிலிருந்தே' என்பது அவை அதனோடு ஒரே துண்டாகச் செய்யப்பட்டதையும் காட்டுகிறது.
theological_decisions:
- issue: திருக்கூடாரச் சூழலில் הַכַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: பாவநிவாரண மூடி
  alternative: மூடி; இரக்க ஆசனம்
  rationale: இச்சொல் பெட்டியின் மூடியையும் அதன் வழிபாட்டு மற்றும் பாவநிவாரணச் செயல்பாட்டையும் குறிக்கிறது. 'பாவநிவாரண மூடி' பொருளையும் இறையியல் தொடர்பையும் காக்கிறது; 'இரக்க ஆசனம்' என்ற மரபுவழிச் சொல் தமிழில் பொருளைத் தவறாக ஓர் இருக்கையாக உணர்த்தக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடை. எபிரேய உரையின் இடவியல் மறுபதிப்பும், கேருபுகள் மூடியிலிருந்தே செய்யப்பட்டவை என்ற கருத்தும் பாதுகாக்கப்பட்டுள்ளன.
