  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: ta
  text: அதன் மேற்பகுதியையும், சுற்றிலும் உள்ள அதன் பக்கங்களையும், அதன் கொம்புகளையும் தூய தங்கத்தால் மூடினான்; அதற்குச் சுற்றிலும் தங்க அலங்கார விளிம்பை[a] அமைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதைச் சுற்றிலும் ஒரு தங்க மகுடத்தை.” எபிரெயச் சொல் அந்தப் பொருளைச் சுற்றி அமைந்த அலங்கார ஓரம் அல்லது பட்டையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: மூடினான்
  rationale: இச்சூழலில் மரத்தால் செய்யப்பட்ட பொருளின் மேல் தங்கத் தகடு பதித்து மூடுவதைக் குறிக்கிறது. ‘மூடினான்’ என்பது இயல்பான நவீனத் தமிழ்; பொருள் குறிப்பிடப்பட்டிருப்பதால் தங்கத்தால் மேற்பூச்சு செய்யப்பட்ட கருத்தும் தெளிவாகிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: தங்கத்தின் தூய்மையையும் தரத்தையும் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: גַּגּוֹ
  choice: அதன் மேற்பகுதி
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘கூரை’ என்றாலும், சிறிய பலிபீடத்தைப் பற்றிய இச்சூழலில் அதன் மேலுள்ள பரப்பையே குறிக்கிறது.
- source_word: קִירֹתָיו
  choice: அதன் பக்கங்கள்
  rationale: நேரடியாக ‘சுவர்கள்’ எனக் கூறக்கூடிய சொல் இங்கு ஒரு பொருளின் செங்குத்தான பக்கங்களைக் குறிக்கிறது; ‘பக்கங்கள்’ தமிழில் இயல்பாக உள்ளது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: எல்லாப் பக்கங்களையும் சூழ்ந்திருக்கும் முழுமையான பரப்பைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: קַרְנֹתָיו
  choice: அதன் கொம்புகள்
  rationale: பலிபீடத்தின் மூலைகளில் நீட்டியிருந்த வழிபாட்டுச் சார்ந்த கொம்புகளைக் குறிக்கும் சொல்லை உருவகப்படுத்தாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: זֵר
  choice: அலங்கார விளிம்பு
  rationale: பொருளைச் சுற்றி அமைந்த அலங்காரப் பட்டை அல்லது ஓரத்தை நவீன வாசகருக்குத் தெளிவாகக் காட்டுகிறது. ‘மகுடம்’ என்ற பாரம்பரிய மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
