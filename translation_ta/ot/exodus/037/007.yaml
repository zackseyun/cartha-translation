base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
translation:
  language: ta
  text: அவர் தங்கத்தால் இரண்டு கேருபீன்களைச் செய்தார்; கிருபாசனத்தின்[a] இரு முனைகளிலிருந்து அவற்றைத் தட்டியமைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவநிவாரண மூடி.” எபிரெயச் சொல் உடன்படிக்கைப் பெட்டியின் மூடியைக் குறிக்கிறது; அது பாவநிவாரணத்துடன் தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் செய்தார்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் எபிரெய வாவ் வடிவத்தை ஒவ்வொரு வாக்கியத்திலும் ‘பின்பு’ என்று வெளிப்படுத்தாமல், இயல்பான தமிழ் கதைநடையில் வினைச்சொல்லால் மொழிபெயர்க்கிறது.
- source_word: שְׁנֵי כְרֻבִים
  choice: இரண்டு கேருபீன்கள்
  rationale: கூடார வழிபாட்டுடன் தொடர்புடைய தனிப்பட்ட வானுலக உருவங்களைக் குறிக்கும் எபிரெயச் சொல்லின் மரபான தமிழாக்கத்தைப் பாதுகாக்கிறது.
- source_word: זָהָב
  choice: தங்கத்தால்
  rationale: கேருபீன்கள் செய்யப்பட்ட பொருளை இயல்பான தமிழில் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: מִקְשָׁה
  choice: சுத்தியலால் அடித்து வடிவமைத்து
  rationale: உலோகத்தை அடித்து உருவாக்கும் தயாரிப்பு முறையே சொல்லின் முதன்மைப் பொருள்; ‘ஒரே துண்டாக’ என்பது சூழலிலிருந்து பெறப்படும் விளக்கம் என்பதால் நேரடியாகச் சேர்க்கப்படவில்லை.
- source_word: עָשָׂה אֹתָם
  choice: அவற்றை ... வடிவமைத்தார்
  rationale: மூலத்தில் עשה மீண்டும் வருவதைத் தமிழ் நடையில் இயல்பாக வைத்துக்கொண்டு, உருவாக்கும் செயலைத் தெளிவுபடுத்துகிறது.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: இரு முனைகளிலிருந்து
  rationale: מִן என்னும் முன்னிடைச்சொல்லின் தோற்றமூலப் பொருளைப் பாதுகாத்து, கேருபீன்கள் மூடியின் முனைகளிலிருந்தே எழும்பிய அமைப்பை உணர்த்துகிறது.
- source_word: הַכַּפֹּרֶת
  choice: கிருபாசனம்
  rationale: உடன்படிக்கைப் பெட்டியின் தங்க மூடிக்கான பரவலாக அறியப்பட்ட தமிழ் வேதாகமச் சொல்; அதன் பாவநிவாரணத் தொடர்பை மாற்று மொழிபெயர்ப்பாக அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: கூடாரச் சூழலில் הַכַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: கிருபாசனம்
  alternative: பாவநிவாரண மூடி; மூடி
  rationale: ‘கிருபாசனம்’ வழிபாட்டுச் சூழலில் அறியப்பட்ட சொல்லாகவும் வேதாகமத் தொடர்ச்சியைப் பேணுவதாகவும் உள்ளது. அதேவேளை, எபிரெயச் சொல் உடன்படிக்கைப் பெட்டியின் மூடியைக் குறிக்கிறது என்பதையும் அதன் பாவநிவாரணத் தொடர்பையும் அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது; குறிப்பிட்ட கோட்பாட்டு விளக்கம் திணிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தொழில்நுட்ப வழிபாட்டுச் சொல்லான ‘கிருபாசனம்’ மட்டும் மரபுத் தொடர்ச்சிக்காக வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
