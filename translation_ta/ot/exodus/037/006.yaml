  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ כַּפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: ta
  text: அவன் தூய தங்கத்தால் கிருபாசனத்தை[a] செய்தான். அதன் நீளம் இரண்டரை முழமும், அகலம் ஒன்றரை முழமும் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பாவநிவிர்த்தி மூடியை.’ எபிரெயச் சொல் உடன்படிக்கைப் பெட்டியின் தங்க மூடியைக் குறிக்கிறது; அது பாவநிவிர்த்தியோடு தொடர்புடையது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் செய்தான்
  rationale: וַיַּעַשׂ என்பது தொடர்ச்சியான கடந்தகால நிகழ்வை விவரிக்கிறது. நவீன தமிழில் இயல்பாக இருக்கத் தொடக்க இணைப்புச்சொல் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
- source_word: כַּפֹּרֶת
  choice: கிருபாசனம்
  rationale: இது உடன்படிக்கைப் பெட்டியின் தங்க மூடியைக் குறிக்கும் வழிபாட்டுச் சொல்; பாவநிவிர்த்தியோடு தொடர்புடைய அதன் தனித்துவத்தையும் பாரம்பரிய வேதாகமப் பெயரையும் ‘கிருபாசனம்’ தக்கவைக்கிறது. பொருளை விளக்கும் மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கத்தால்
  rationale: பொருள் எதனால் செய்யப்பட்டது என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: இரண்டரை முழம்
  rationale: எபிரெய அளவான இரண்டு முழமும் அரை முழமும் என்பதை இயல்பான நவீன தமிழில் கூறுகிறது.
- source_word: אָרְכָּהּ
  choice: அதன் நீளம்
  rationale: பெயர்ச்சொல்லோடு இணைந்துள்ள மூன்றாம் நபர் ஒருமை உரிமைப் பின்னொட்டு கிருபாசனத்தைக் குறிக்கிறது.
- source_word: וְאַמָּה וָחֵצִי
  choice: ஒன்றரை முழம்
  rationale: ஒரு முழமும் அரை முழமும் என்ற எபிரெய அளவைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: רָחְבָּהּ
  choice: அகலம்
  rationale: பொருளின் குறுக்குப் பரிமாணத்தைக் குறிக்கும் தெளிவான நவீன தமிழ்ச் சொல்.
theological_decisions:
- issue: வழிபாட்டுச் சூழலில் כַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: கிருபாசனம்
  alternative: பாவநிவிர்த்தி மூடி; மூடி
  rationale: இந்த எபிரெயச் சொல் உடன்படிக்கைப் பெட்டியின் மூடியைக் குறித்தாலும், இஸ்ரவேலின் வழிபாட்டில் அது பாவநிவிர்த்தியோடு சிறப்பாகத் தொடர்புடையது. ‘கிருபாசனம்’ அந்த வழிபாட்டு-இறையியல் அடையாளத்தைத் தக்கவைக்கிறது; ‘பாவநிவிர்த்தி மூடி’ என்ற விளக்கமான மாற்று அடிக்குறிப்பில் கொடுக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘கிருபாசனம்’ என்பது வழிபாட்டுச் சிறப்புப் பெயராகத் தக்கவைக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. அளவுக்காகத் தமிழில் நிலைபெற்ற ‘முழம்’ பயன்படுத்தப்பட்டுள்ளது.
