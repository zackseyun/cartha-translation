  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: ta
  text: அவன் சீத்தீம் மரத்தினால் மேசையைச் செய்தான். அதன் நீளம் இரண்டு முழம், அகலம் ஒரு முழம், உயரம் ஒன்றரை முழம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “ஒரு முழமும் அரை முழமும்.”'
    reason: மூலத்தில் உள்ள அளவீட்டின் சொற்சொல் வடிவத்தைத் தெரிவிக்கும் lexical alternative.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் செய்தான்
  rationale: வாவ் தொடர்வினையுடன் உள்ள עשה கடந்தகாலத் தொடர் நிகழ்வைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் நேரடியாகவும் ‘அவன் செய்தான்’ என்று மொழிபெயர்க்கப்படுகிறது.
- source_word: הַשֻּׁלְחָן
  choice: மேசையை
  rationale: இச்சொல் இங்கு திருக்கூடாரத்திற்குரிய குறிப்பிட்ட மேசையைக் குறிக்கிறது; வேற்றுமை உருபுடன் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: עֲצֵי שִׁטִּים
  choice: சித்தீம் மரத்தால்
  rationale: שִׁטָּה குறிக்கும் மரத்தின் துல்லிய தாவரவியல் அடையாளம் விவாதத்திற்குரியது. ‘அகாசியா’ என்று உறுதியாக்காமல், வரலாற்று மரப்பெயரை ஒலிபெயர்த்து மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: אַמָּתַיִם
  choice: இரண்டு முழம்
  rationale: אַמָּה என்பது பண்டைய முன்கை நீள அளவான ‘முழம்.’ வரலாற்று அளவை நவீன அலகாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: אָרְכּוֹ
  choice: அதன் நீளம்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு மேசையைக் குறிக்கிறது; தமிழில் ‘அதன் நீளம்’ என்பது இயல்பான வடிவம்.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: அகலம் ஒரு முழம்
  rationale: மேசையின் இரண்டாவது பரிமாணத்தைத் துல்லியமாகக் கூறுகிறது; முந்தைய கூறின் இலக்கண அமைப்பு தொடர்கிறது.
- source_word: וְאַמָּה וָחֵצִי
  choice: ஒன்றரை முழம்
  rationale: ‘ஒரு முழமும் அரை முழமும்’ என்ற எபிரேய அளவை நவீன தமிழில் இயல்பாக ‘ஒன்றரை முழம்’ என வழங்குகிறது.
- source_word: קֹמָתוֹ
  choice: உயரம்
  rationale: ஒரு பொருளின் செங்குத்துப் பரிமாணத்தை இச்சூழலில் ‘உயரம்’ தெளிவாகக் குறிக்கிறது.
