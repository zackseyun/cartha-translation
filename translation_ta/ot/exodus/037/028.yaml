base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/028.yaml
  text: He made the poles of acacia wood and overlaid them with gold.
translation:
  language: ta
  text: அவர் சுமப்பதற்கான கோல்களை அகாசியா மரத்தால் செய்து, அவற்றைத் தங்கத்தால் மூடினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் ... செய்து
  rationale: עשה என்பதன் Qal wayyiqtol வடிவம் தொடர்ச்சியான இறந்தகாலக் கதைநடையைக் குறிக்கிறது. தமிழில் அடுத்த வினையுடன் இயல்பாக இணைக்க வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הַבַּדִּים
  choice: சுமக்கும் கோல்களை
  rationale: திருக்கூடப் பொருட்களின் சூழலில் בַּדִּים என்பது அவற்றைச் சுமப்பதற்குப் பயன்படும் கோல்களைக் குறிக்கிறது; பயன்பாட்டைத் தெளிவாக்கும் இயல்பான தமிழ் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֲצֵי שִׁטִּים
  choice: அகாசியா மரத்தால்
  rationale: இந்த எபிரெயக் கூட்டுச்சொல் அகாசியா மரப்பொருளைக் குறிக்கிறது. பொருளைச் சுட்ட தமிழில் கருவிப்பொருள் வேற்றுமை பயன்படுத்தப்பட்டது.
- source_word: וַיְצַף
  choice: மேற்பூச்சிட்டார்
  rationale: கைவினைச் சூழலில் צפה என்பது ஓர் பொருளை மற்றொரு பொருளால் மூடி மேற்பூச்சிடுவதைக் குறிக்கிறது. தங்கத் தகடு என மூலத்தில் இல்லாத விவரத்தைச் சேர்க்காமல் இச்சொல் பொருளைத் தருகிறது.
- source_word: אֹתָם
  choice: அவற்றை
  rationale: இந்த நேரடி செயப்படுபொருள் சுட்டுப்பெயர் முன் குறிப்பிடப்பட்ட கோல்களைக் குறிக்கிறது.
- source_word: זָהָב
  choice: தங்கத்தால்
  rationale: צפה வினையுடன் வரும் זָהָב மேற்பூச்சுக்குப் பயன்படுத்தப்பட்ட பொருளைக் குறிக்கிறது; தமிழில் கருவிப்பொருள் வேற்றுமை இயல்பாக உள்ளது.
