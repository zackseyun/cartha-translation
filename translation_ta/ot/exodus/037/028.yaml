translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified கதைநடை பயன்படுத்தப்பட்டது. ‘கோல்கள்’ என்பதன் சுமக்கும் பயன்பாடு சூழலுக்கேற்ப வெளிப்படுத்தப்பட்டது; மூலத்தில் இல்லாத தொழில்நுட்ப விவரங்கள் சேர்க்கப்படவில்லை.
