  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: ta
  text: அவன் சுத்தமான தங்கத்தால் விளக்குத்தண்டைச் செய்தான். அதைச் சுத்தியலால் அடித்துத் தட்டி உருவாக்கினான்[a]. அதன் அடிப்பகுதியும் தண்டும், அதன் கிண்ணங்களும், மொட்டுகளும்[b], மலர்களும் அதிலிருந்தே ஒரே முழுமையாக அமைந்திருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அடித்துத் தட்டிய வேலை.’ எபிரெயச் சொல், உலோகத்தைச் சுத்தியலால் அடித்துத் தட்டி வடிவமைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மொட்டுகள்’ என்பதற்குப் பதிலாக ‘குமிழ்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் புடைத்த அலங்கார உறுப்புகளைக் குறிக்கிறது; விளக்குத்தண்டின் தாவர வடிவமைப்பைக் கருத்தில் கொண்டு ‘மொட்டுகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרָה
  choice: விளக்குத்தண்டு
  rationale: இது ஒரு தனி விளக்கை அல்ல, திருவழிபாட்டுக்குரிய கிளைகளைக் கொண்ட விளக்குத் தாங்கியைச் சுட்டுகிறது; ‘விளக்குத்தண்டு’ தமிழில் சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: זָהָב טָהוֹר
  choice: சுத்தத் தங்கம்
  rationale: பொருளின் கலப்பற்ற, தூய தன்மையை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִקְשָׁה
  choice: அடித்துத் தட்டி உருவாக்கப்பட்ட வேலைப்பாடு
  rationale: ஒரே உலோகத் துண்டைச் சுத்தியலால் அடித்துத் தட்டி வடிவமைக்கும் உற்பத்தி முறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְרֵכָהּ
  choice: அதன் அடிப்பாகம்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘தொடை/பக்கம்’ என்றாலும், இப்பொருளின் கீழ்தாங்கும் பகுதியையே சூழல் குறிக்கிறது.
- source_word: קָנָהּ
  choice: அதன் தண்டு
  rationale: இங்கு விளக்குத்தண்டின் நடுவிலுள்ள முதன்மைக் கட்டமைப்புப் பகுதியைக் குறிக்கிறது.
- source_word: גְּבִיעֶיהָ
  choice: அதன் கிண்ணங்கள்
  rationale: கிண்ண வடிவிலான அலங்கார உறுப்புகளை நேரடியாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: כַּפְתֹּרֶיהָ
  choice: அதன் மொட்டுகள்
  rationale: இச்சொல் உருண்டு புடைத்த அலங்கார உறுப்புகளைக் குறிக்கலாம்; விளக்குத்தண்டின் தாவர வடிவமைப்புக்கு ஏற்றவாறு ‘மொட்டுகள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது, ஆனால் ‘குமிழ்கள்’ என்பதும் சாத்தியம்.
- source_word: פְרָחֶיהָ
  choice: அதன் மலர்கள்
  rationale: தாவர வடிவ அலங்காரத்தைத் தெளிவாகக் காட்டி, ‘மொட்டுகள்’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: מִמֶּנָּה הָיוּ
  choice: அதனோடு ஒரே துண்டாக இருந்தன
  rationale: இப்பகுதிகள் தனியே இணைக்கப்பட்டவை அல்லாமல் விளக்குத்தண்டுடன் ஒருங்கிணைந்த ஒரே உலோகத் துண்டின் பகுதிகளாக இருந்ததைத் தெரிவிக்கிறது.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: செய்தான் ... செய்தான்
  rationale: எபிரெய உரையின் வினைச்சொல் மீளுரைப்பைத் தமிழிலும் எளிமையாகத் தக்கவைக்கிறது.
