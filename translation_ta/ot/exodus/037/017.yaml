translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இருமுறை வரும் ‘செய்தான்’ தக்கவைக்கப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் [a] குறி ‘சுத்தத் தங்கம்’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு מִקְשָׁה என்ற ‘அடித்துத் தட்டி உருவாக்கப்பட்ட வேலைப்பாடு’ என்பதையே விளக்குவதால், தமிழில் குறி அதற்குரிய இடத்தில் வைக்கப்பட்டுள்ளது.
