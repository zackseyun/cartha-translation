source:
  edition: WLC
  text: וַ/יְצַפֵּ֛/הוּ זָהָ֥ב טָה֖וֹר מִ/בַּ֣יִת וּ/מִ/ח֑וּץ וַ/יַּ֥עַשׂ ל֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/002.yaml
  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: ta
  text: அவன் அதன் உட்புறத்திலும் வெளிப்புறத்திலும் தூய தங்கத் தகடு பதித்து, அதைச் சுற்றிலும் தங்க விளிம்பு[a] ஒன்றை அமைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுற்றிலும் தங்க அலங்காரப்பட்டை’ அல்லது ‘அதைச் சுற்றிய தங்கக் கரை.’ எபிரெயச் சொல் זֵר, ஒரு பொருளைச் சுற்றிய அலங்கார ஓரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: தங்கத் தகடு பதித்து
  rationale: பיעேல் வடிவிலுள்ள צפה இங்கு ஒரு பொருளின் மேற்பரப்பை உலோகத்தால் மூடும் கைவினைச் செயலைக் குறிக்கிறது. ‘தகடு பதித்து’ என்பது சாதாரணமாக மூடுதல் அல்லது பூசுதல் என்ற எண்ணத்தைத் தவிர்த்து, தங்க மேலுறை அமைத்தலைத் தெளிவாகச் சொல்கிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: இந்தச் சொற்றொடர் கலப்பற்ற அல்லது சுத்தமான தங்கத்தைக் குறிக்கிறது; ‘தூய தங்கம்’ இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: מִבַּיִת וּמִחוּץ
  choice: உட்புறத்திலும் வெளிப்புறத்திலும்
  rationale: பெட்டியின் உள் மற்றும் வெளி மேற்பரப்புகள் இரண்டையும் குறிக்கும் இடவியல் இணையைத் தெளிவாகப் பேணுகிறது.
- source_word: וַיַּעַשׂ לוֹ
  choice: அதைச் சுற்றிலும் ... அமைத்தான்
  rationale: לֹו என்பதன் மறைமுகப் பொருள் தமிழில் பெட்டியைச் சுட்டும் ‘அதைச் சுற்றிலும்’ என்பதாலும், விளிம்பை உருவாக்கிய செயலைக் குறிக்கும் ‘அமைத்தான்’ என்பதாலும் இயல்பாக வெளிப்படுகிறது.
- source_word: זֵר
  choice: விளிம்பு
  rationale: திருக்கூடாரப் பொருட்களின் சூழலில் இச்சொல் பொருளைச் சுற்றிய அலங்கார ஓரம் அல்லது உயர்ந்த கரையைக் குறிக்கிறது. ‘விளிம்பு’ பொதுவாசகருக்கு எளிதில் புரியும்; ‘கிரீடம்’ என்ற தேவையற்ற அரசச் சாயலை ஏற்படுத்தாது.
- source_word: זֵר זָהָב
  choice: தங்க விளிம்பு
  rationale: விளிம்பு எந்தப் பொருளால் ஆனது என்பதைத் தமிழில் இயல்பான பெயர்த்தொகையாகக் காட்டுகிறது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: அந்த விளிம்பு பொருளைச் சுற்றி அமைந்திருந்ததை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
