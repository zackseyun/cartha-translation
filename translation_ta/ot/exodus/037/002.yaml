  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் அதேவேளையில் கைவினைச் செயலைத் துல்லியமாகக் காட்டும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘தகடு பதித்து’ என்பது தங்கத்தை வெறுமனே பூசியதாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது; זֵר என்பதிலுள்ள வடிவத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
