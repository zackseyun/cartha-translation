  text: וַ/יַּ֨עַשׂ ל֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וַ/יַּ֧עַשׂ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/012.yaml
  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: ta
  text: அதற்குச் சுற்றிலும் ஒரு உள்ளங்கை அகலமுள்ள சட்டத்தைச் செய்தான்[a]; அந்தச் சட்டத்தைச் சுற்றிலும் தங்க அலங்கார விளிம்பைச் செய்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சட்டம்’ என்பதற்குப் பதிலாக ‘ஓரம்’ அல்லது ‘விளிம்பு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: மரபுவழியாக ‘தங்கக் கிரீடம்’ என மொழிபெயர்க்கப்படுகிறது; இங்கு சட்டத்தைச் சுற்றிய அலங்கார ஓரத்தைக் குறிப்பதால் ‘தங்க அலங்கார விளிம்பு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: சட்டம்
  rationale: மேசையைச் சுற்றி அமைக்கப்பட்ட கட்டமைப்புப் பகுதியை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது; ‘விளிம்பு’ அல்லது ‘ஓரம்’ என்பவையும் சாத்தியம்.
- source_word: טֹפַח
  choice: ஒரு உள்ளங்கை அகலம்
  rationale: கை அகலத்தை அடிப்படையாகக் கொண்ட அளவைக் குறிக்கிறது; ‘அகலம்’ என்பது இங்கு அளவின் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: எல்லாப் பக்கங்களிலும் சூழ்ந்திருப்பதைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: זֵר
  choice: அலங்கார விளிம்பு
  rationale: ஆசரிப்புக்கூடப் பொருட்களின் சூழலில் அலங்காரமாக அமைந்த ஓரம் அல்லது வார்ப்பைக் குறிக்கிறது; நேரடியான ‘கிரீடம்’ இன்றைய வாசகரைத் தவறாக வழிநடத்தக்கூடும்.
- source_word: זָהָב
  choice: தங்க
  rationale: அலங்கார விளிம்பு செய்யப்பட்ட பொருளை இயல்பான தமிழில் பெயரடையாகக் குறிப்பிடுகிறது.
- source_word: לְמִסְגַּרְתּוֹ
  choice: அந்தச் சட்டத்தைச் சுற்றிலும்
  rationale: முன்னர் கூறப்பட்ட சட்டத்துடன் தங்க அலங்கார விளிம்புக்கு உள்ள தொடர்பைத் தெளிவாகக் காட்டுகிறது; எபிரெய முன்னிடைச்சொல்லின் தொடர்புப் பொருளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
