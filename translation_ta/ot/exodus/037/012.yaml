translation_notes:
  register: நவீனத் தரத் தமிழில், கட்டுமான விவரத்தை சாதாரண வாசகர் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் வழங்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இரு இணைச் செயல்களும் பாதுகாக்கப்பட்டுள்ளன; ‘செய்தான்’ என்ற ஆண்பால் ஒருமை வினை வடிவமும் மூலத்துக்கு ஏற்ப வைக்கப்பட்டுள்ளது.
