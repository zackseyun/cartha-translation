  source_fidelity: எபிரெய மூலத்தின் இரு செயல்களும், அளவுக்குறிப்பும், இருமுறை வரும் ‘சுற்றிலும்’ என்பதும் நம்பகமாகப் பாதுகாக்கப்பட்டுள்ளன. מִסְגֶּרֶת என்பதற்கு ‘சட்டம்’, טֹפַח என்பதற்கு ‘ஒரு உள்ளங்கை அகலம்’, זֵר என்பதற்கு ‘தங்க அலங்கார விளிம்பு’ ஆகியவை இச்சூழலில் ஏற்கத்தக்கவை. இரண்டாம் தொடரில் ‘அந்தச் சட்டத்தைச் சுற்றிலும்’ என்பது לְמִסְגַּרְתּוֹ மற்றும் סָבִיב ஆகியவற்றின் சட்டகத்துடனான தொடர்பையும் சுற்றியமைப்பையும் இயல்பாகத் தெரிவிக்கிறது.
