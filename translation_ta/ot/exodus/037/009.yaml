base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: ta
  text: கேருபீன்கள் தங்கள் சிறகுகளை மேல்நோக்கி விரித்து, தங்கள் சிறகுகளால் கிருபாசனத்தின்[a] மேல் நிழலிட்டன. அவற்றின் முகங்கள் ஒன்றையொன்று நோக்கியிருந்தன; கேருபீன்களின் முகங்கள் கிருபாசனத்தை நோக்கியிருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, நேரடியாக, “மூடி” அல்லது “பாவநிவிர்த்தி மூடி.”
    reason: எபிரெய הַכַּפֹּרֶת என்பதற்கான நேரடியான மற்றும் வழிபாட்டுச் சூழலுக்குரிய மாற்று மொழிபெயர்ப்புகளைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: கேருபீன்கள்
  rationale: வானுலகச் சிற்ப உருவங்களைக் குறிக்கும் எபிரெயப் பெயரை, வேறு உயிரினப் பெயராக விளக்காமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: தங்கள் சிறகுகளை மேல்நோக்கி விரித்து
  rationale: சிறகுகள் மேல்திசையில் விரிக்கப்பட்டிருந்த நிலையை இயல்பான நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: தங்கள் சிறகுகளால் ... மேலிருந்து மூடியிருந்தன
  rationale: சிறகுகளைக் கொண்டு மேலாகப் பரந்து மூடியிருந்த காட்சியைத் தருகிறது; முற்றிலும் மறைத்துவிட்டன என்ற தேவையற்ற பொருளைத் தவிர்க்க ‘மேலிருந்து’ சேர்க்கப்பட்டுள்ளது.
- source_word: הַכַּפֹּרֶת
  choice: கிருபாசனம்
  rationale: உடன்படிக்கைப் பெட்டியின் மூடியைக் குறிக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்லைப் பயன்படுத்துகிறது; சொல்லின் நேரடியான ‘மூடி’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: அவற்றின் முகங்கள் ஒன்றையொன்று நோக்கியிருந்தன
  rationale: ‘ஒவ்வொன்றும் தன் சகோதரனை நோக்கி’ என்ற எபிரெய மரபுத்தொடரின் பரஸ்பர நோக்குநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: கேருபீன்களின் முகங்கள் கிருபாசனத்தை நோக்கியிருந்தன
  rationale: முகங்களையும் கிருபாசனத்தையும் மீண்டும் வெளிப்படையாகக் குறிப்பதன் மூலம் எபிரெய உரையின் இணை அமைப்பையும் வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: கூடார வழிபாட்டுச் சூழலில் הַכַּפֹּרֶת என்பதன் மொழிபெயர்ப்பு
  choice: கிருபாசனம்
  alternative: மூடி; பாவநிவிர்த்தி மூடி
  rationale: ‘கிருபாசனம்’ என்பது தமிழில் அறியப்பட்ட வழிபாட்டுச் சொல்; எனினும் எபிரெயச் சொல் உடன்படிக்கைப் பெட்டியின் ‘மூடி’யை நேரடியாகக் குறிக்க முடியும். எந்த ஒரு பாவநிவிர்த்திக் கோட்பாட்டையும் வசனத்துக்குள் அதிகமாக இறக்குமதி செய்யாமல், மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். சிற்ப உருவங்களைக் குறிக்கும் பன்மைக்கு ‘இருந்தன/அவற்றின்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையிலுள்ள முகங்களின் இரட்டை நோக்குநிலையும் மறுசொல்லாக்கமும் சுருக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
