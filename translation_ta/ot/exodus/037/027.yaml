base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: ta
  text: அதன் விளிம்புக்குக் கீழே[a], அதன் இரண்டு பக்கத் தகடுகளின்மேல், அதன் இரண்டு பக்கங்களிலும்[b], அதைச் சுமக்கும் தடிகளுக்கான தாங்கிகளாக இரண்டு தங்க வளையங்களை அதற்கு செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் அலங்கார வார்ப்புக்குக் கீழே.” எபிரேயச் சொல் זֵר மேல்புறத்தைச் சுற்றிய அலங்கார ஓரம் அல்லது வார்ப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரேயம் தொடர்புடைய இரண்டு சொற்றொடர்களை அடுத்தடுத்து பயன்படுத்துகிறது: “அதன் இரண்டு பக்கத் தகடுகளின்மேல், அதன் இரண்டு பக்கங்களிலும்.” இந்தத் திரும்பக்கூறல் நீக்கப்படாமல் மொழிபெயர்ப்பில் பாதுகாக்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: இரண்டு தங்க வளையங்கள்
  rationale: טַבָּעוֹת என்பது இங்கு பரிசுத்தப் பொருளைச் சுமக்கும் தடிகளுக்கான உலோக வளையங்களைக் குறிக்கிறது; தமிழில் பொருளை இயல்பாகக் காட்ட ‘தங்க வளையங்கள்’ என வழங்கப்பட்டது.
- source_word: עָשָׂה לוֹ
  choice: அதற்குச் செய்தான்
  rationale: לוֹ என்பதன் சுட்டுப்பொருள் சூழலில் தூபபீடம்; ஆகவே நபரை அல்ல, அந்தப் பொருளைக் குறிக்கும் பயனுறு வேற்றுமை பாதுகாக்கப்பட்டது.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: அதன் விளிம்புக்குக் கீழே
  rationale: זֵר என்பது மேல்புறத்தைச் சுற்றிய அலங்கார ஓரம் அல்லது வார்ப்பைக் குறிக்கிறது. ‘விளிம்பு’ நவீன தமிழில் தெளிவானது; மாற்று அர்த்தம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: עַל שְׁתֵּי צַלְעֹתָיו
  choice: அதன் இரண்டு பக்கத் தகடுகளின்மேல்
  rationale: צלע என்பது பக்கம், விலா, அல்லது கட்டமைப்பின் பக்கப்பகுதி எனப் பொருள்படும். அடுத்துள்ள צִדָּיו என்பதிலிருந்து வேறுபாட்டை வைத்திருக்க ‘பக்கத் தகடுகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: அதன் இரண்டு பக்கங்களிலும்
  rationale: צד என்பது பொதுவாக ‘பக்கம்’ என்று பொருள். எபிரேயத்தில் உள்ள தொடர்புடைய இரட்டைச் சொல்லாக்கத்தை நீக்காமல் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: לְבָתִּים לְבַדִּים
  choice: தடிகளுக்கான செருகிடங்களாக
  rationale: בָּתִּים என்பதன் சொற்பொருள் ‘வீடுகள்’; இங்கு தடிகளைச் செலுத்தும் உறைகள் அல்லது இடங்கள். ‘செருகிடங்கள்’ அவற்றின் செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: அதைச் சுமக்கும் தடிகள்
  rationale: இறுதிநோக்கும் கருவிப்பொருளும் தமிழில் இயல்பாக ஒரே தொடரில் வெளிப்படுத்தப்பட்டுள்ளன; ‘அதை’ என்பது தூபபீடத்தைக் குறிக்கிறது.
