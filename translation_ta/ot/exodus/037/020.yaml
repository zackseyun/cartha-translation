  yaml_path: translation/ot/exodus/037/020.yaml
  text: And on the lampstand were four cups shaped like almond blossoms[a], its buds and its flowers.
translation:
  language: ta
  text: விளக்குத்தண்டில் பாதாம் பூக்களைப் போல் வடிவமைக்கப்பட்ட நான்கு கிண்ணங்களும்[a], அதன் குமிழ்களும் பூக்களும் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாதாம் வடிவிலான நான்கு கிண்ணங்களும்.”
    reason: מְשֻׁקָּדִים என்பது பாதாம் பூ வடிவைக் குறிப்பதா அல்லது பொதுவாகப் பாதாம் வடிவைக் குறிப்பதா என்பதில் உள்ள சொற்பொருள் மாற்றுவாய்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: விளக்குத்தண்டில்
  rationale: בְּ குறிக்கும் இடத்தொடர்பை இயல்பான தமிழில் தருகிறது; அலங்காரக் கூறுகள் விளக்குத்தண்டின் பகுதிகளாக இருப்பதால் ‘விளக்குத்தண்டில்’ பொருத்தமானது.
- source_word: אַרְבָּעָה
  choice: நான்கு
  rationale: גְבִעִים என்பதைக் கணக்கிடும் நேரடியான எண்ணுப்பெயர்.
- source_word: גְבִעִים
  choice: கிண்ணங்கள்
  rationale: விளக்குத்தண்டில் உள்ள கிண்ண வடிவ அலங்காரப் பகுதிகளைக் குறிக்கிறது; ‘கிண்ணங்கள்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: מְשֻׁקָּדִים
  choice: பாதாம் பூக்களைப் போல் வடிவமைக்கப்பட்ட
  rationale: பாதாம் பூவை ஒத்த வடிவமைப்பைக் குறிக்கும் எபிரெயப் பங்கேற்புவினையின் அலங்காரப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘பாதாம் வடிவிலான’ என்ற சுருக்கமான புரிதலும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: כַּפְתֹּרֶיהָ
  choice: அதன் குமிழ்கள்
  rationale: כפתור என்பது விளக்குத்தண்டின் குமிழ் போன்ற புடைப்பான அலங்காரப் பகுதியைக் குறிக்கிறது. மலர் உருவகத்தின் அடிப்படையில் ‘மொட்டுகள்’ என்றும் புரிந்துகொள்ளலாம்; ஆனால் ‘குமிழ்கள்’ வடிவத்தையும் பொருளின் தொழில்நுட்ப இயல்பையும் பாதுகாக்கிறது.
- source_word: וּ/פְרָחֶיהָ
  choice: அதன் பூக்கள்
  rationale: פֶּרַח என்பதன் நேரடியான பொருள் ‘பூ/மலர்’; அருகிலுள்ள ‘பாதாம் பூக்கள்’ என்பதோடும் இயல்பாக இணைகிறது.
