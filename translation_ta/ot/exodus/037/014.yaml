translation:
  language: ta
  text: வளையங்கள் சட்டகத்துக்கு அருகில்[a] இருந்தன; மேசையைச் சுமப்பதற்கான தண்டுகளைச் செருகும் உறைகளாக அவை இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எதிரே.”
    reason: לְעֻמַּת என்ற எபிரெயச் சொல் இடத்தொடர்பில் ‘அருகில்’ அல்லது ‘எதிரே’ எனப் புரிந்துகொள்ளப்படலாம்; மூலத்தின் உண்மையான நுண்பொருள் வேறுபாட்டைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: לְעֻמַּת
  choice: அருகில்
  rationale: இச்சூழலில் வளையங்கள் சட்டகத்துடன் கொண்டுள்ள இடத்தொடர்பை இயல்பாகக் குறிக்கிறது; எபிரெயச் சொல் ‘எதிரே’ என்றும் பொருள்படக்கூடியதால் அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַמִּסְגֶּרֶת
  choice: சட்டகம்
  rationale: மேசையைச் சுற்றியுள்ள கட்டமைப்புப் பகுதியைக் குறிக்கும் சொல்லுக்கு தெளிவான, நவீனத் தமிழ் இணை.
- source_word: בָּתִּים
  choice: உறைகள்
  rationale: சொற்பொருளில் ‘வீடுகள்’ என்றாலும், இங்கு தண்டுகள் செருகப்படும் பிடிப்பிடங்கள் அல்லது உறைகள் என்பதே செயல்சார் பொருள்.
- source_word: בַּדִּים
  choice: தண்டுகள்
  rationale: மேசையைத் தூக்கிச் செல்ல வளையங்களில் செருகப்படும் நீளமான கம்புகளைக் குறிக்கிறது.
- source_word: לָשֵׂאת
  choice: சுமப்பதற்கான
  rationale: மேசையைத் தூக்கிக் கொண்டு செல்லும் நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
