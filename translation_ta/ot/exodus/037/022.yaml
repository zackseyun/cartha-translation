    text: எழுத்துப்படி, ‘அதிலிருந்து’; மொட்டுகளும் கிளைகளும் விளக்குத்தண்டிலிருந்தே, அதே துண்டிலிருந்து உருவாக்கப்பட்டன என்பது பொருள். ‘மொட்டுகள்’ என்பதற்கு ‘உருண்டை வடிவ அலங்காரங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
