  language: ta
  text: அதன் மொட்டுகளும் கிளைகளும் அதிலிருந்தே ஒரே துண்டாக உருவாக்கப்பட்டிருந்தன[a]; அது முழுவதும் தூய தங்கத்தால் ஒரே துண்டிலிருந்து அடித்து உருவாக்கப்பட்ட வேலைப்பாடாக இருந்தது[b].
  philosophy: optimal-equivalence
