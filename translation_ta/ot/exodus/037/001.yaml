base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: ta
  text: பெசலெயேல் அக்காசியா மரத்தால் பெட்டியைச் செய்தான். அதன் நீளம் இரண்டரை முழம்[a]; அதன் அகலம் ஒன்றரை முழம்; அதன் உயரம் ஒன்றரை முழம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஒரு முழம் என்பது பொதுவாக முழங்கையிலிருந்து நடுவிரல் நுனிவரையுள்ள நீளத்தை அடிப்படையாகக் கொண்ட பண்டைய அளவு. அதன் துல்லியமான நீளம் காலத்துக்கும் மரபுக்கும் ஏற்ப மாறுபட்டது.
    reason: பண்டைய அளவீட்டு அலகை விளக்குதல்
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עָשָׂה என்பது பொதுவாக ‘செய்/உருவாக்கு’ என்று பொருள்படும்; கைவினை நுணுக்கம் போன்ற கூடுதல் கருத்தைச் சேர்க்காமல் இங்கு இயல்பாக ‘செய்தான்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּצַלְאֵל
  choice: பெசலெயேல்
  rationale: தனிநபர் பெயர் நவீனத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
- source_word: הָאָרֹן
  choice: உடன்படிக்கைப் பெட்டி
  rationale: אָרוֹן என்பதன் பொதுப் பொருள் ‘பெட்டி’; ஆனால் கூடாரச் சூழலில் இது பரிசுத்த உடன்படிக்கைப் பெட்டியைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாகவும் நிலைபெற்ற குறிப்பாகவும் இருக்க ‘உடன்படிக்கைப் பெட்டி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עֲצֵי שִׁטִּים
  choice: சித்தீம் மரத்தால்
  rationale: இது שִׁטָּה மரத்தின் மரப்பொருளைக் குறிக்கும். தாவரவியல் அடையாளத்தை அளவுக்கு மீறி உறுதிப்படுத்தாமல், வேதாகமத் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பான ‘சித்தீம் மரம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: இரண்டரை முழம்
  rationale: பண்டைய அளவான אַמָּה-வை நவீன அலகாக மாற்றாமல், தமிழில் நிலைபெற்ற ‘முழம்’ என்ற அளவுப் பெயருடன் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: אָרְכּוֹ
  choice: அதன் நீளம்
  rationale: சுட்டுப்பெயர் விகுதியுடன் உள்ள சொல்லின் நேரடியான பொருள் பொருளின் நீளத்தைக் குறிக்கிறது.
- source_word: וְאַמָּה וָחֵצִי
  choice: ஒன்றரை முழம்
  rationale: ‘ஒரு முழமும் அரை முழமும்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் ‘ஒன்றரை முழம்’ என வழங்குகிறது.
- source_word: רָחְבּוֹ
  choice: அதன் அகலம்
  rationale: குறுக்குப் பரிமாணத்தைக் குறிக்கும் רֹחַב என்பதற்கு பொருட்களின் அளவீட்டில் இயல்பான தமிழ் ‘அகலம்’ ஆகும்.
- source_word: קֹמָתוֹ
  choice: அதன் உயரம்
  rationale: இங்கு קוֹמָה பொருளின் செங்குத்துப் பரிமாணத்தைக் குறிப்பதால் ‘உயரம்’ தெளிவான மொழிபெயர்ப்பு.
