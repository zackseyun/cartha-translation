  yaml_path: translation/ot/exodus/037/024.yaml
  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: ta
  text: தூய தங்கம் ஒரு தாலந்தால் அதையும் அதற்குரிய எல்லாப் பொருட்களையும் செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதற்குரிய எல்லாப் பாத்திரங்களையும்” அல்லது “அதற்குரிய எல்லாக் கருவிகளையும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் விளக்குத்தண்டுடன் தொடர்புடைய பலவகைப் பொருட்களைக் குறிக்கும் பரந்த சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: ஒரு தாலந்து
  rationale: திருவாசஸ்தலப் பணியின் சூழலில் இது எடையளவான ‘தாலந்து’ என்பதைக் குறிக்கிறது; அதன் அடிப்படை வடிவப் பொருளான வட்டப்பண்டம் அல்லது தட்டு என்பதல்ல.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: பொருளின் கலப்பின்மையையும் தூய்மையையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: עָשָׂה
  choice: செய்தான்
  rationale: எபிரெய வினையின் நேரடியான பொதுப் பொருளைத் தக்கவைக்கிறது; யாரைக் குறிக்கிறது என்பது முந்தைய சூழலில் தெளிவாக உள்ளது.
- source_word: אֹתָהּ
  choice: அதையும்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முந்தைய வசனங்களில் உள்ள விளக்குத்தண்டைக் குறிக்கிறது; தமிழில் சூழலால் antecedent தெளிவாக இருப்பதால் இயல்பான சுட்டுப்பெயர் பயன்படுத்தப்படுகிறது.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: அதற்குரிய எல்லாப் பொருட்களையும்
  rationale: כֵּלִים என்பது பாத்திரங்கள், கருவிகள், துணைப் பொருட்கள் ஆகியவற்றைக் குறிக்கக்கூடிய பரந்த சொல். ‘பொருட்கள்’ அதன் பொருள் அகலத்தைக் காக்கிறது; ‘அதற்குரிய’ என்பது விளக்குத்தண்டுடன் அவற்றின் தொடர்பைத் தெளிவாக்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. மூலத்தின் பொருள் வரிசையை இயன்றவரைத் தக்கவைத்து, இயல்பான தமிழ் வாக்கிய அமைப்புக்காக கருவிப்பொருள் கூறு முன்னிறுத்தப்பட்டுள்ளது.
