translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரிதான எபிரெயப் பாத்திரப் பெயர்களின் நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது; முதன்மை உரையில் பட்டியலின் வேறுபாடுகள் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன.
