base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: ta
  text: அவர் மேசையின்மேல் இருந்த பாத்திரங்களை—அதன் தட்டுகள்[a], கிண்ணங்கள், குடுவைகள், பானபலி வார்க்கப் பயன்படுத்தப்படும் கலங்கள் ஆகியவற்றை—தூய தங்கத்தால் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் அகன்ற பாத்திரங்கள், சிறு கிண்ணங்கள், குடங்கள், கலங்கள்.” இவ்வசனத்திலுள்ள பல பாத்திரப் பெயர்கள் அரிதானவை அல்லது குறிப்பிட்ட சூழலுக்குரியவை; ஆகவே அவற்றின் துல்லியமான வடிவமும் பயன்பாடும் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: பாத்திரங்கள்
  rationale: כְּלִים என்பது கருவிகள் அல்லது பாத்திரங்களைக் குறிக்கும் பரந்த சொல்; மேசைச் சூழலில் ‘பாத்திரங்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: மேசையின்மேல் இருந்த
  rationale: ‘மேசையின்மேல் இருந்தவை’ என்ற எபிரெய நேரடிப் பொருளைச் செயல்பாட்டை ஊகிக்காமல் காக்கிறது.
- source_word: קְעָרֹתָיו
  choice: அதன் தட்டுகள்
  rationale: קְעָרָה பொதுவாகத் தட்டு அல்லது அகன்ற பாத்திரத்தைக் குறிக்கிறது; மேசைப் பயன்பாட்டுக்கு ‘தட்டுகள்’ பொருத்தமானது.
- source_word: כַּפֹּתָיו
  choice: கிண்ணங்கள்
  rationale: இச்சூழலில் சிறிய கொள்ளளவுப் பாத்திரங்களைக் குறிக்கும்; ‘கிண்ணங்கள்’ நவீனத் தமிழில் இயல்பான அண்மைப் பொருள்.
- source_word: מְנַקִּיֹּתָיו
  choice: குடுவைகள்
  rationale: இது அரிதான பாத்திரப் பெயர்; திரவத்தை வைத்திருக்கவோ வார்க்கவோ பயன்படும் பாத்திரம் என்ற சாத்தியமான பொருளை ‘குடுவைகள்’ எளிய தமிழில் தருகிறது.
- source_word: הַקְּשָׂוֹת
  choice: கலங்கள்
  rationale: பானபலி வார்ப்புடன் தொடர்புடைய மற்றொரு வகைப் பாத்திரத்தைக் குறிக்கிறது; முந்தைய பாத்திரப் பெயர்களோடு செயற்கையாக ஒன்றாக்காமல் ‘கலங்கள்’ என வேறுபடுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: பானபலி வார்க்கப் பயன்பட்ட
  rationale: נסך என்பதன் வழிபாட்டுச் சூழலிலான பொருள் பானபலியை வார்ப்பதாகும். எபிரெயச் செயலற்ற வடிவத்தின் கருவிப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ஒருமைச் செயல்வடிவத்தை தேவையின்றிப் பன்மையாக்கவில்லை.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கத்தால்
  rationale: பட்டியலிடப்பட்ட பாத்திரங்கள் செய்யப்பட்ட பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
