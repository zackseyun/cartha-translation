translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. பரிமாணங்கள் சுருக்கமான தனித்தனி வாக்கியங்களாக அமைக்கப்பட்டுள்ளன; பண்டைய அளவான ‘முழம்’ பாதுகாக்கப்பட்டுள்ளது.
