source:
  edition: WLC
  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הַ/קְּטֹ֖רֶת עֲצֵ֣י שִׁטִּ֑ים אַמָּ֣ה אָרְכּ/וֹ֩ וְ/אַמָּ֨ה רָחְבּ֜/וֹ רָב֗וּעַ וְ/אַמָּתַ֨יִם֙ קֹֽמָת֔/וֹ מִמֶּ֖/נּוּ הָי֥וּ קַרְנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/025.yaml
  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: ta
  text: அவர் அகேசியா மரத்தால் தூபப் பலிபீடத்தை[a] செய்தார். அதன் நீளம் ஒரு முழம், அகலம் ஒரு முழம்; அது சதுரமாக இருந்தது. அதன் உயரம் இரண்டு முழம். அதன் கொம்புகள் அதனோடு ஒரே துண்டாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூபத்திற்கான பலிபீடத்தை.’
    reason: மִזְבַּח הַקְּטֹרֶת என்ற எபிரெயக் கட்டமைப்பிற்கான இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் செய்தார்
  rationale: தொடர்ச்சியான இறந்தகாலக் கதைச்செயலை இயல்பான நவீனத் தமிழில் தருகிறது; எபிரெய முன்னொட்டிலுள்ள ‘மற்றும்’ என்பதைத் தனியே மொழிபெயர்க்காமல் கதைத் தொடர்ச்சி பாதுகாக்கப்படுகிறது.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: தூபப் பலிபீடம்
  rationale: தூபம் செலுத்துவதற்கான வழிபாட்டுப் பலிபீடம் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עֲצֵי שִׁטִּים
  choice: அகேசியா மரம்
  rationale: பண்டைய தாவரப் பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்படும் நவீன அடையாளத்தைத் தருகிறது; தெளிவற்ற பழைய ஒலிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: אַמָּה / אַמָּתַיִם
  choice: முழம் / இரண்டு முழம்
  rationale: அளவை நவீன அலகாக ஊகித்து மாற்றாமல், பண்டைய நீள அலகைத் தமிழில் வழக்கமான ‘முழம்’ என்று பாதுகாக்கிறது.
- source_word: אָרְכּוֹ ... רָחְבּוֹ ... קֹמָתוֹ
  choice: அதன் நீளம் ... அகலம் ... அதன் உயரம்
  rationale: உடைமைப் பின்னொட்டுகள் பலிபீடத்தின் பரிமாணங்களைக் குறிக்கின்றன; தமிழ் அளவீட்டு நடைக்கு ஏற்றவாறு வெளிப்படையாகத் தரப்பட்டுள்ளன.
- source_word: רָבוּעַ
  choice: அது சதுரமாக இருந்தது
  rationale: வடிவத்தைக் குறிக்கும் பெயரடையைத் தெளிவான தமிழ் வாக்கியமாக வழங்குகிறது.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: அதன் கொம்புகள் அதனோடு ஒரே துண்டாக இருந்தன
  rationale: கொம்புகள் தனியே இணைக்கப்படாமல் பலிபீடத்திலிருந்தே ஒருங்கிணைந்த பகுதிகளாக உருவாக்கப்பட்டிருந்த கட்டுமானப் பொருளைத் தெரிவிக்கிறது.
