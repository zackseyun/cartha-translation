translation:
  language: ta
  text: அவன் அகாசியா மரத்தால் தண்டுகளைச் செய்து, அவற்றைத் தங்கத்தால் மூடினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்து
  rationale: עשה என்பதன் Qal wayyiqtol வடிவம் தொடர்ச்சியான கதைநடையைச் சுட்டுகிறது. தமிழில் அடுத்த வினையுடன் இயல்பாக இணைக்க வினையெச்சம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַּדֵּי
  choice: தண்டுகளை
  rationale: திருப்பணிப் பொருட்களைச் சுமப்பதற்குப் பயன்படுத்தப்பட்ட நீண்ட கோல்களை இச்சொல் குறிக்கிறது; நவீன தமிழில் ‘தண்டுகள்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: עֲצֵי שִׁטִּים
  choice: அகாசியா மரத்தால்
  rationale: இது அகாசியா வகை மரத்தைக் குறிக்கும் construct phrase. தமிழில் பொருளை இயல்பாகத் தெரிவிக்க ‘அகாசியா மரம்’ என வழங்கப்பட்டுள்ளது.
- source_word: וַיְצַף
  choice: தங்கத் தகடு பதித்தான்
  rationale: צפה என்பது கைவினைச் சூழலில் ஒரு பொருளின் மேற்பரப்பை உலோகத்தால் மூடுதல் அல்லது தகடு பதித்தலைக் குறிக்கிறது; தமிழில் இச்செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: אֹתָם
  choice: அவற்றின்மேல்
  rationale: பன்மை நேரடி செயப்படுபொருள் சுட்டுப்பெயர் முன் கூறப்பட்ட தண்டுகளைக் குறிக்கிறது; தமிழ் வாக்கிய அமைப்பில் மேல்பரப்பைச் சுட்ட ‘அவற்றின்மேல்’ என இயல்பாக்கப்பட்டுள்ளது.
- source_word: זָהָב
  choice: தங்கத் தகடு
  rationale: மூடுவதற்குப் பயன்படுத்தப்பட்ட பொருள் தங்கம். ‘தகடு’ என்பது மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், צפה குறிக்கும் கைவினைச் செயலை இயல்பான தமிழில் விளக்குகிறது.
