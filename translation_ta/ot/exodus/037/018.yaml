  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/שִׁשָּׁ֣ה קָנִ֔ים יֹצְאִ֖ים מִ/צִּדֶּ֑י/הָ שְׁלֹשָׁ֣ה קְנֵ֣י מְנֹרָ֗ה מִ/צִּדָּ/הּ֙ הָֽ/אֶחָ֔ד וּ/שְׁלֹשָׁה֙ קְנֵ֣י מְנֹרָ֔ה מִ/צִּדָּ֖/הּ הַ/שֵּׁנִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/018.yaml
  text: 'And six branches were coming out from its sides: three branches of the lampstand from its one side[b][a], and three branches of the lampstand from its second side.'
translation:
  language: ta
  text: 'அதன் பக்கங்களிலிருந்து ஆறு கிளைகள் வெளியே நீண்டிருந்தன: விளக்குத்தண்டின் ஒரு பக்கத்திலிருந்து மூன்று கிளைகளும், அதன் மறுபக்கத்திலிருந்து மூன்று கிளைகளும் வெளியே நீண்டிருந்தன.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “அதன் ஒரு பக்கத்திலிருந்து ... அதன் இரண்டாம் பக்கத்திலிருந்து” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: கிளைகள்
  rationale: விளக்குத்தண்டின் பக்கங்களிலிருந்து நீளும் கிளை போன்ற தண்டுகளை இச்சூழலில் குறிக்கிறது; நவீன தமிழில் ‘கிளைகள்’ இயல்பாகவும் உருவகத்தைத் தக்கவைத்தும் உள்ளது.
- source_word: יֹצְאִים
  choice: வெளியே நீண்டிருந்தன
  rationale: יצא வினையின் பங்கேற்பு வடிவம் கிளைகள் விளக்குத்தண்டிலிருந்து வெளிப்பட்டு நீள்வதை விவரிக்கிறது; ‘வெளியே நீண்டிருந்தன’ அதன் இயக்கத் தன்மையையும் உருவ அமைப்பையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: அதன் பக்கங்களிலிருந்து / ஒரு பக்கத்திலிருந்து
  rationale: צד என்பதன் அடிப்படைப் பொருளான ‘பக்கம்’ என்பதையும், பன்மையிலிருந்து ஒவ்வொரு பக்கத்தையும் தனித்துக் குறிப்பிடும் எபிரெய அமைப்பையும் தக்கவைக்கிறது.
- source_word: מְנֹרָה
  choice: விளக்குத்தண்டு
  rationale: திருக்கூடாரத்திலிருந்த விளக்குகளைத் தாங்கும் அமைப்பைக் குறிக்கும் பொதுப்பெயர்; ஒலிபெயர்ப்பைவிட பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: ஒரு பக்கம் ... மறுபக்கம்
  rationale: சொல்லுக்கு சொல் ‘ஒரு பக்கம் ... இரண்டாம் பக்கம்’ என்றாலும், இரு எதிரெதிர் பக்கங்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் இணை ‘ஒரு பக்கம் ... மறுபக்கம்’ ஆகும்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் மீளுரைப்பை ஓரளவு தக்கவைத்து, ‘இரண்டாம் பக்கம்’ என்பதை இயல்பான தமிழில் ‘மறுபக்கம்’ என வழங்கி, சொல்லடிப்படையான வடிவத்தை அடிக்குறிப்பில் பதிவு செய்துள்ளது.
