  text: He made the poles of acacia wood and overlaid them with gold, to carry the table.
translation:
  language: ta
  text: மேசையைச் சுமப்பதற்காக அவர் அகேசியா மரத்தால் தண்டுகளைச் செய்து, அவற்றைத் தங்கத்தால் மூடினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் ... செய்து
  rationale: தொடர்ச்சியான அடுத்த செயலைக் குறிக்கும் வாவ்-தொடர்நிலை வடிவம். தமிழில் வாக்கிய ஓட்டத்திற்கேற்ப வினையெச்சமாக வழங்கப்பட்டுள்ளது.
- source_word: הַבַּדִּים
  choice: சுமக்கும் தண்டுகளை
  rationale: பரிசுத்தக் கூடாரப் பொருட்களைத் தூக்கிச் செல்வதற்குப் பயன்படுத்தப்பட்ட நீண்ட தண்டுகளைக் குறிக்கிறது; ‘சுமக்கும்’ என்பது அவற்றின் பயன்பாட்டைத் தெளிவாக்குகிறது.
- source_word: עֲצֵי שִׁטִּים
  choice: சீத்திம் மரத்தால்
  rationale: שִׁטָּה என்பதற்கான பாரம்பரியத் தமிழ் தாவரப்பெயர் ‘சீத்திம்’; இங்கு பொருளைக் குறிக்கும் இயல்பான ஒருமை வடிவில் வழங்கப்பட்டுள்ளது.
- source_word: וַיְצַף אֹתָם זָהָב
  choice: அவற்றைத் தங்கத்தால் மூடினார்
  rationale: கைவினைச் சூழலில் צפה என்பது உலோகத்தால் மேற்பரப்பை மூடுதல் அல்லது பூசுதல்; ‘தங்கத்தால் மூடினார்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: לָשֵׂאת
  choice: சுமப்பதற்காக
  rationale: இந்த infinitive நோக்கத்தைக் குறிக்கிறது; தண்டுகள் மேசையைச் சுமப்பதற்காகச் செய்யப்பட்டன என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַשֻּׁלְחָן
  choice: மேசையை
  rationale: எபிரெய உரை குறிப்பிட்ட அந்த மேசையையே சொல்கிறது; சூழலில் அது பரிசுத்தக் கூடாரத்தின் மேசை என்றாலும், மொழிபெயர்ப்பில் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
