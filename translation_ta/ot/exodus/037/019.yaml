base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: ta
  text: ஒவ்வொரு கிளையிலும் வாதுமைப் பூ வடிவிலான மூன்று கிண்ணங்களும், ஒரு குமிழும் ஒரு பூவும் இருந்தன. விளக்குத்தண்டிலிருந்து வெளிவரும் ஆறு கிளைகளிலும் இவ்வாறே இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְבִעִים
  choice: கிண்ணங்கள்
  rationale: விளக்குத்தண்டில் அமைந்த கிண்ணம் போன்ற அலங்கார வடிவங்களை இச்சொல் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מְשֻׁקָּדִים
  choice: வாதுமைப் பூ வடிவிலான
  rationale: வாதுமை மரத்தோடு தொடர்புடைய வடிவமைப்பைக் குறிக்கிறது; இச்சூழலில் பூ அலங்காரத்தைத் தெளிவுபடுத்துகிறது.
- source_word: קָנֶה
  choice: கிளை
  rationale: விளக்குத்தண்டிலிருந்து பக்கவாட்டில் நீளும் உறுப்பைக் குறிக்க இச்சூழலில் ‘கிளை’ இயல்பானதும் பொருத்தமானதும் ஆகும்.
- source_word: כַּפְתֹּר
  choice: மொட்டு
  rationale: உருண்டையான தாவர வடிவ அலங்கார உறுப்பை இயல்பான தமிழில் காட்டுகிறது; ‘குமிழ்’ என்பதும் சாத்தியம்.
- source_word: פֶרַח
  choice: பூ
  rationale: மலர் வடிவ அலங்காரத்தைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியும் சொல்.
- source_word: כֵּן
  choice: இவ்வாறே இருந்தது
  rationale: முன்னர் கூறிய வடிவமைப்பு ஆறு கிளைகளுக்கும் பொருந்தியதைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: விளக்குத்தண்டிலிருந்து நீண்டுவந்த
  rationale: கிளைகள் மைய விளக்குத்தண்டிலிருந்து வெளிப்பட்டு நீள்வதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְנֹרָה
  choice: விளக்குத்தண்டு
  rationale: பொருளை ஒலிபெயர்க்காமல், பல விளக்குகளைத் தாங்கும் மைய அமைப்பைக் குறிக்கும் புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
