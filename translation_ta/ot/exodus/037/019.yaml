revisions:
- from: ஒரு கிளையில் வாதுமைப் பூ வடிவிலான மூன்று கிண்ணங்களும், ஒவ்வொன்றோடும் ஒரு மொட்டும் ஒரு பூவும் இருந்தன[a]; மற்றொரு கிளையிலும் வாதுமைப் பூ வடிவிலான மூன்று கிண்ணங்களும், ஒவ்வொன்றோடும் ஒரு மொட்டும் ஒரு பூவும் இருந்தன[b]. விளக்குத்தண்டிலிருந்து நீண்டுவந்த ஆறு கிளைகளிலும் இவ்வாறே இருந்தது.
  to: ஒவ்வொரு கிளையிலும் வாதுமைப் பூ வடிவிலான மூன்று கிண்ணங்களும், ஒரு குமிழும் ஒரு பூவும் இருந்தன. விளக்குத்தண்டிலிருந்து வெளிவரும் ஆறு கிளைகளிலும் இவ்வாறே இருந்தது.
  rationale: The revision removes the unsupported cup-by-cup distribution, renders the repeated branch pattern naturally as applying to every branch, and uses ‘குமிழ்’ for the rounded ornamental feature. Footnote anchors a and b are retained and the complete footnote set is supplied.
