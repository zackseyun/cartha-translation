  text: அதற்கு நான்கு தங்க வளையங்களை வார்த்து, அந்த வளையங்களை அதன் நான்கு கால்களிடத்திலுள்ள நான்கு மூலைகளில் பொருத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் நான்கு கால்களுக்குரிய நான்கு மூலைகளில்.”
    reason: எபிரெயச் சொற்றொடர் மூலைகள் நான்கு கால்கள் அமைந்த இடத்தோடு தொடர்புடையவை என்றும், அவை அந்த நான்கு கால்களுக்குரியவை என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: וַיִּצֹק
  choice: வார்த்து
  rationale: உலோக வேலைப்பாட்டுச் சூழலில் உருக்கிய தங்கத்தை அச்சில் வார்ப்பதைக் குறிக்கிறது; பொதுவாக ஊற்றுவதைக் காட்டிலும் துல்லியமான சொல்.
- source_word: לוֹ
  choice: அதற்காக
  rationale: பின்னொட்டு முந்தைய வசனங்களில் கூறப்பட்ட மேசையைக் குறிக்கிறது; தமிழில் உயிரற்ற பொருளுக்கான இயல்பான சுட்டு.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: நான்கு தங்க வளையங்கள்
  rationale: சுமக்கும் தண்டுகளைச் செலுத்துவதற்கான உலோக வளையங்களையும் அவற்றின் பொருளையும் நேரடியாகக் குறிக்கிறது.
- source_word: וַיִּתֵּן
  choice: பொருத்தினான்
  rationale: வளையங்களை மேசையின் குறிப்பிட்ட இடங்களில் நிலையாக அமைத்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: நான்கு மூலைகளிலும்
  rationale: עַל என்பதன் இடச்சார்ந்த பொருளையும், פֵּאוֹת என்பதன் மரச்சாமான் சார்ந்த ‘மூலைகள்’ என்ற பொருளையும் சுருக்கமாகக் காக்கிறது; ‘-இலும்’ ஒவ்வொரு மூலையிலும் ஒன்றென உணர்த்துகிறது.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: அதன் நான்கு கால்களிடத்தில் இருந்த
  rationale: மேசையின் நான்கு கால்களுடன் மூலைகளுக்குள்ள இடத் தொடர்பைத் தெரிவிக்கிறது; எபிரெயச் சொற்றொடரின் உறவுசார் மாற்றுப் புரிதல் அடிக்குறிப்பில் காக்கப்படுகிறது.
