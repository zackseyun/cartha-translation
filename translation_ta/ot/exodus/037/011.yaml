translation:
  language: ta
  text: அவன் தூய தங்கத்தால் அதை மூடி, அதற்குச் சுற்றிலும் தங்கத்தால் ஓர் அலங்கார விளிம்பை[a] செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்க விளிம்பை’; மரபுவழியாக, ‘தங்கக் கிரீடத்தை.’
    reason: זֵר என்பது அலங்கார ஓரம் அல்லது உயர்ந்த விளிம்பைக் குறிக்கலாம்; மரபுவழி மொழிபெயர்ப்புகளில் ‘கிரீடம்’ என்றும் வழங்கப்படுகிறது.
lexical_decisions:
- source_word: וַיְצַף
  choice: பொதிந்து
  rationale: இச்சூழலில் צפה என்பது ஒரு பொருளின் மேற்பரப்பில் உலோகத் தகட்டை மேற்பூச்சாகப் பதிப்பதைக் குறிக்கிறது. ‘பொதிந்து’ என்பது கைவினைச் சூழலுக்கேற்ற இயல்பான தமிழ்.
- source_word: אֹתוֹ
  choice: அதை
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மேசையைச் சுட்டும் நேரடிப் பொருள் ஒருமைப் பெயர்ப்பதிலி.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: உயர்ந்த தூய்மையுள்ள தங்கத்தைக் குறிக்கும் எளிய, நிறுவப்பட்ட நவீனத் தமிழ் மொழிபெயர்ப்பு.
- source_word: וַיַּעַשׂ לוֹ
  choice: அதைச் சுற்றிலும் … செய்தான்
  rationale: לֹו குறிக்கும் ‘அதற்காக/அதற்கு’ என்ற உறவு, தமிழில் பொருளின் இருப்பிடத்தைத் தெளிவுபடுத்தும் ‘அதைச் சுற்றிலும்’ என்ற தொடரில் இயல்பாக வெளிப்படுகிறது.
- source_word: זֵר
  choice: அலங்காரப் பட்டை
  rationale: மேசையைச் சுற்றியுள்ள வடிவமைக்கப்பட்ட உயர்ந்த ஓரம் அல்லது அலங்கார விளிம்பைக் குறிக்கிறது. ‘அலங்காரப் பட்டை’ என்பது ‘கிரீடம்’ என்பதால் உருவாகக்கூடிய தவறான நவீனப் பொருளைத் தவிர்த்து, கைவினை அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: זָהָב
  choice: தங்கத்தால்
  rationale: அலங்காரப் பட்டை செய்யப்பட்ட பொருளை இயல்பான தமிழில் கருவிப் பொருள் வேற்றுமையால் வெளிப்படுத்துகிறது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: முழுமையாகச் சூழ்ந்திருக்கும் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
