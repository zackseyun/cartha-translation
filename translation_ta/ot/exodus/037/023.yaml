  text: He made its seven lamps[a], its tongs[b], and its firepans of pure gold.
translation:
  language: ta
  text: அதன் ஏழு விளக்குகளையும், அதன் திரிகளைக் கையாளும் இடுக்கிகளையும்[a], அதன் தட்டுகளையும்[b] தூய தங்கத்தால் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திரி வெட்டிகள்.” எபிரெயச் சொல் விளக்குத் திரிகளைக் கையாளப் பயன்பட்ட ஒரு கருவியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நெருப்புச் சட்டிகள்.” இச்சூழலில், விளக்குத்தண்டுடன் தொடர்புடைய சிறிய கொள்கலன்கள் அல்லது தட்டுகளை இச்சொல் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பதன் தொடர்கதை வடிவம்; நவீன தமிழில் இயல்பான இறந்தகால வினையாக வழங்கப்பட்டது. וַ־ என்பதன் தொடர்ச்சி சூழலால் வெளிப்படுவதால் தனியே ‘பின்பு’ எனச் சேர்க்கப்படவில்லை.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: அதன் ஏழு விளக்குகள்
  rationale: נֵרוֹת என்பது விளக்குகளைக் குறிக்கிறது; பெண்பால் ஒருமை உடைமை விகுதி சூழலில் விளக்குத்தண்டைக் குறிக்கிறது. தமிழின் இயல்பான சொல் வரிசையில் எண் பெயர்ச்சொல்லுக்கு முன் வைக்கப்பட்டது.
- source_word: מַלְקָחֶיהָ
  choice: அதன் திரித்திருத்தும் இடுக்கிகள்
  rationale: விளக்குத் திரிகளைப் பிடித்துக் கையாளப் பயன்படும் கருவி என்பதைக் கூறும் வகையில், பொதுவான ‘இடுக்கிகள்’ என்பதைக் காட்டிலும் சூழலைத் தெளிவுபடுத்தும் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது; சொல்லின் துல்லிய வடிவம் உறுதியற்றதால் அடிக்குறிப்பு தரப்பட்டது.
- source_word: מַחְתֹּתֶיהָ
  choice: அதன் தட்டுகள்
  rationale: இச்சூழலில் விளக்குத்தண்டுடன் தொடர்புடைய சிறிய கொள்கலன்கள் அல்லது தட்டுகள் எனப் பொருள்படலாம். பலிபீடப் பயன்பாட்டைத் தவறாக உணர்த்தக்கூடிய ‘நெருப்புச் சட்டிகள்’ என்பதற்கு பதிலாக சூழலுக்கு ஏற்ற பொதுவான சொல் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கத்தால்
  rationale: பொருட்கள் செய்யப்பட்ட மூலப்பொருளைக் குறிக்கும் இயல்பான தமிழ் கருவிப்பொருள் வேற்றுமை வடிவம்.
