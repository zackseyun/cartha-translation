  text: וַ/יִּצֹ֣ק ל֗/וֹ אַרְבַּע֙ טַבְּעֹ֣ת זָהָ֔ב עַ֖ל אַרְבַּ֣ע פַּעֲמֹתָ֑י/ו וּ/שְׁתֵּ֣י טַבָּעֹ֗ת עַל צַלְע/וֹ֙ הָֽ/אֶחָ֔ת וּ/שְׁתֵּי֙ טַבָּע֔וֹת עַל צַלְע֖/וֹ הַ/שֵּׁנִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/003.yaml
  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: ta
  text: அதற்காக, அதன் நான்கு கால்களிலும்[a]—அதன் ஒரு பக்கத்தில் இரண்டு வளையங்களும் மறுபக்கத்தில் இரண்டு வளையங்களுமாக[b]—நான்கு பொன் வளையங்களை வார்த்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் நான்கு மூலைகளிலும்” அல்லது “அதன் நான்கு தாங்கும் பகுதிகளிலும்”; எபிரேயச் சொல் கால்களையோ கீழ் முனைகள் அல்லது தாங்கும் பகுதிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லெழுத்தாக, “அதன் ஒரு பக்கத்தில் இரண்டு வளையங்களும் அதன் இரண்டாம் பக்கத்தில் இரண்டு வளையங்களும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: வார்த்து
  rationale: உலோக வேலைச் சூழலில் יצק என்பது உருக்கிய உலோகத்தை அச்சில் ஊற்றி உருவாக்குவதைக் குறிக்கிறது; தமிழில் ‘வார்த்து’ என்பது இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: לוֹ
  choice: அதற்காக
  rationale: இங்குள்ள பின்னொட்டு சூழலில் குறிப்பிடப்படும் பெட்டியைக் குறிக்கிறது; உயிரற்ற பொருளுக்கான இயல்பான தமிழ் வடிவம்.
- source_word: טַבְּעֹת זָהָב
  choice: பொன் வளையங்கள்
  rationale: எபிரேயச் சொற்றொடரின் பொருளைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தருகிறது.
- source_word: פַּעֲמֹתָיו
  choice: அதன் நான்கு கால்கள்
  rationale: இந்தச் சொல் கால்கள், கீழ் முனைகள் அல்லது தாங்கும் பகுதிகள் எனப் பொருள்படலாம். முதன்மை உரையில் ‘கால்கள்’ நேரடியான பொருத்தம்; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: צַלְעוֹ
  choice: பக்கம்
  rationale: பொருட்களின் அமைப்பை விவரிக்கும் இடங்களில் צלע என்பதற்கான இயல்பான தமிழ் இணைச்சொல் ‘பக்கம்’.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: ஒரு பக்கம் ... மறுபக்கம்
  rationale: சொல்லெழுத்தாக ‘ஒரு பக்கம் ... இரண்டாம் பக்கம்’ என்றாலும், அதே வேறுபாட்டை இயல்பான தமிழில் ‘ஒரு பக்கம் ... மறுபக்கம்’ தெளிவாக வெளிப்படுத்துகிறது.
