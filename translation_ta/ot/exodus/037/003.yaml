translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரேய மூலத்தின் உலோக வார்ப்பு, நான்கு கீழ்ப்பகுதிகள், இரு பக்கங்களிலும் தலா இரண்டு வளையங்கள் ஆகிய விவரங்கள் பாதுகாக்கப்பட்டுள்ளன.
