  edition: WLC
  text: וַ/יָּבֵ֤א אֶת הַ/בַּדִּים֙ בַּ/טַּבָּעֹ֔ת עַ֖ל צַלְעֹ֣ת הָ/אָרֹ֑ן לָ/שֵׂ֖את אֶת הָ/אָרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/005.yaml
  text: And he put the poles into the rings on the sides of the ark, to carry the ark.
translation:
  language: ta
  text: பெட்டியைத் தூக்கிச் செல்வதற்காக, அதன் பக்கங்களில் இருந்த வளையங்களுக்குள் தண்டுகளைச் செலுத்தினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: செலுத்தினார்
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்/கொண்டுவருதல்’; ஆனால் தண்டுகளையும் வளையங்களையும் குறிக்கும் இக்கட்டமைப்பில், வளையங்களுக்குள் தண்டுகளை நுழைத்த செயலை இயல்பாகக் குறிக்கிறது. ‘செலுத்தினார்’ என்பது செயலைத் தெளிவாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: הַבַּדִּים
  choice: தண்டுகளை
  rationale: בַּדִּים என்பது பரிசுத்தப் பொருளைத் தூக்கிச் செல்வதற்கான நீண்ட தண்டுகளைக் குறிக்கிறது. நவீனத் தமிழில் ‘தண்டுகள்’ தெளிவான, இயல்பான சொல்.
- source_word: בַּטַּבָּעֹת
  choice: வளையங்களுக்குள்
  rationale: בְּ என்ற முன்னொட்டு இச்சூழலில் வளையங்களின் உள்ளே தண்டுகள் செலுத்தப்பட்டதைக் குறிக்கிறது; ‘வளையங்களுக்குள்’ அந்த இடநிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: பெட்டியின் பக்கங்களில் இருந்த
  rationale: צְלָעוֹת என்பது இங்கு பெட்டியின் பக்கங்கள் அல்லது பக்கப் பகுதிகளைக் குறிக்கிறது. வளையங்கள் அந்தப் பக்கங்களில் இருந்தன என்பதைக் காட்ட தமிழில் இயல்பான தொடர்புச் சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָאָרֹן
  choice: பெட்டி
  rationale: אָרוֹן என்பது இங்கு திருக்கூடாரத்தின் பரிசுத்தப் பெட்டியைக் குறிக்கிறது. ‘பெட்டி’ அதன் பொருளை நேரடியாகவும் நவீன வாசகருக்குப் புரியுமாறும் தருகிறது; இவ்வசனத்தில் ‘உடன்படிக்கைப் பெட்டி’ என்ற விரிவாக்கம் மூலத்தில் இல்லை.
- source_word: לָשֵׂאת
  choice: தூக்கிச் செல்வதற்காக
  rationale: נשא வினையின் நோக்கத்தைக் குறிக்கும் infinitive வடிவம் இது. தண்டுகளைக் கொண்டு பெட்டியைத் தூக்கிச் சுமந்து நகர்த்துவது குறிக்கப்படுவதால், ‘தூக்கிச் செல்வதற்காக’ என்பது நோக்கத்தையும் செயல் முறையையும் இயல்பாகத் தெரிவிக்கிறது.
