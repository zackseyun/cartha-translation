translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றாமல், நோக்கவாக்கியத்தை முன்வைத்து இயல்பான தமிழ் வாக்கிய அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
