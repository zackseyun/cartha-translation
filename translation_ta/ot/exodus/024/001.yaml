  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: ta
  text: பின்பு அவர் மோசேயிடம்[a], “நீயும் ஆரோனும் நாதாபும் அபியூவும் இஸ்ரவேலின் மூப்பர்களில் எழுபது பேரும் யாவேயிடம் ஏறிவாருங்கள்; தொலைவிலிருந்து பணிந்துகொள்ளுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, “யாவேயிடம் ஏறிவா” என்று உள்ளது. பேசுபவர் யாவே என்றிருந்தும் மூல உரை இந்தச் சொல்லமைப்பையே கொண்டுள்ளது; சில மொழிபெயர்ப்புகள் இதை “என்னிடம் ஏறிவா” அல்லது “யாவேயின் முன்னிலைக்கு ஏறிவா” என்று சீராக்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: பின்பு அவர் மோசேயிடம் ... என்றார்
  rationale: எபிரேய வாக்கிய அமைப்பு முந்தைய நிகழ்வுடன் இணைந்த புதிய உரையைத் தொடங்குகிறது. தமிழில் இயல்பாக இருக்க வினைச்சொல் இறுதியில் வைக்கப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத எழுவாய் சூழலிலிருந்து ‘அவர்’ என வழங்கப்படுகிறது.
- source_word: עֲלֵה
  choice: ஏறிவந்து
  rationale: עלה என்ற கட்டளை மேல்நோக்கிச் சென்று அணுகுவதைக் குறிக்கிறது. பேசுபவரின் முன்னிலையை நோக்கிய அழைப்பாக இருப்பதால் ‘ஏறிவந்து’ என்பது இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: אֶל יְהוָה
  choice: யாவேயிடம்
  rationale: உடன்படிக்கையின் தனிப்பெயரான יהוה ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்கப்படுகிறது; אֶל குறிக்கும் அணுகுதலை ‘-யிடம்’ எடுத்துரைக்கிறது. பேசுபவர் யாவே என்றிருந்தும் ‘என்னிடம்’ என்று மாற்றாமல் மூலத்தின் வியப்பூட்டும் சொல்லமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: நீயும் ஆரோனும் நாதாபும் அபியூவும்
  rationale: வெளிப்படையான ‘நீ’ என்பதையும் பெயர்ப் பட்டியலின் ஒருங்கிணைப்பையும் தமிழ் ‘-உம்’ தொடரால் இயல்பாகப் பாதுகாக்கிறது.
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்களில் எழுபது பேரும்
  rationale: 'מִן பகுதியெடுப்பைக் குறிக்கிறது: எல்லா மூப்பர்களும் அல்ல, அவர்களிலிருந்து எழுபது பேர். ‘மூப்பர்களில் எழுபது பேர்’ அந்த நுட்பத்தைத் தெளிவாகக் காக்கிறது.'
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: பணிந்துகொள்ளுங்கள்
  rationale: இந்த வினை உடலைத் தாழ்த்திப் பணிவதைச் சுட்டுகிறது. ‘வழிபடுங்கள்’ என்று சமயப் பொருளை மட்டும் முன்கூட்டியே நிர்ணயிக்காமல், மரியாதையுடன் பணியும் உடற்செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵ/רָחֹק
  choice: தொலைவில் நின்று
  rationale: அருகில் வராமல் இடைவெளியிலிருந்து பணிய வேண்டும் என்ற இடவியல் கருத்தைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலம் நான்கெழுத்து உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதில் அதன் பெயர்த் தன்மையைப் பாதுகாக்கும் ‘யாவே’ பயன்படுத்தப்படுகிறது.
- issue: யாவே பேசும் சூழலில் ‘யாவேயிடம் ஏறிவா’ என்ற வழக்கத்திற்கு மாறான சொல்லமைப்பு
  choice: ‘யாவேயிடம்’ என்பதை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: என்னிடம் ஏறிவா; யாவேயின் முன்னிலைக்கு ஏறிவா
  rationale: எபிரேய உரை வெளிப்படையாக אֶל יְהוָה என்று கூறுகிறது. ‘என்னிடம்’ என்று மாற்றுவது மூலத்தில் தீர்க்கப்படாமல் உள்ள உரைநடை/இறையியல் இறுக்கத்தை மொழிபெயர்ப்பிலேயே தீர்த்துவிடும்; ஆகவே அது பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, சாதாரண வாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மூப்பர்களில் எழுபது பேர்’ என்பதால் பகுதியெடுப்பு நுட்பமும், ‘பணிந்துகொள்ளுங்கள்’ என்பதால் உடலைத் தாழ்த்தும் செயலும் பாதுகாக்கப்பட்டுள்ளன. பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிவடிவங்களுக்கு நெருக்கமாக வழங்கப்பட்டுள்ளன.
