base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/006.yaml
  text: Moses took half of the blood and put it in basins[a], and half of the blood he threw against the altar.
translation:
  language: ta
  text: மோசே இரத்தத்தின் பாதியை எடுத்து, கிண்ணங்களில் வைத்தார்; இரத்தத்தின் மறுபாதியைப் பலிபீடத்தின்மேல் வீசினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பலிபீடத்தின்மேல் தெளித்தார்’ அல்லது ‘தூவினார்’ என்றும் மொழிபெயர்க்கலாம். பலிச்சடங்கின் சூழலில் இந்த எபிரெய வினை பல விதமாகப் பொருள்படலாம்; செயலில் இருந்திருக்கக்கூடிய வலிமையை வெளிப்படுத்த முதன்மை உரையில் ‘வீசினார்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்பதன் வழக்கமான கதைநடைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: חֲצִי הַדָּם
  choice: இரத்தத்தில் பாதி
  rationale: குறிப்பிட்ட அந்த இரத்தத்தின் ஒரு பாதி என்ற பகுதிப்பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: וַיָּשֶׂם
  choice: வைத்தார்
  rationale: שׂים குறிக்கும் பொதுவான வைக்கும் செயலை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: בָּאַגָּנֹת
  choice: கிண்ணங்களில்
  rationale: திரவத்தைத் தாங்கும் அகன்ற பாத்திரங்களைக் குறிக்கும் אַגָּנֹת என்பதற்கு, சடங்குச் சூழலில் தெளிவான இயல்பான சொல்.
- source_word: זָרַק
  choice: வீசினார்
  rationale: பலிச்சடங்கில் இரத்தத்தை மெதுவாகத் தூவுவதைவிட, அதை வேகத்துடன் பலிபீடத்தின் மீது செலுத்தும் செயலை இந்த வினை குறிக்கக்கூடும்; ‘வீசினார்’ அந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: עַל הַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல்
  rationale: עַל என்பதன் இடப்பொருளையும், இரத்தம் பலிபீடத்தின் மேற்பரப்பை நோக்கிச் செலுத்தப்பட்டதையும் நேரடியாகக் காட்டுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
theological_decisions:
- issue: பலிபீடத்தில் இரத்தத்தைச் செலுத்திய சடங்குச் செயல்
  choice: ‘வீசினார்’ என்று வலிமைமிக்க செயலாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தெளித்தார்’ அல்லது ‘தூவினார்’
  rationale: זָרַק என்பது இச்சூழலில் மென்மையான தூவுதலை மட்டும் கட்டாயப்படுத்தாது; இரத்தத்தை வீசி அல்லது தெறிக்கச் செலுத்தும் செயலையும் குறிக்கலாம். ஆகவே சடங்கின் உடல்சார் வலிமையை முதன்மை உரை காக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. இணை அமைப்பைக் காக்க ‘இரத்தத்தில் பாதி / இரத்தத்தின் மறுபாதி’ என வடிவமைக்கப்பட்டது; சடங்குச் செயலை மென்மையாக்காமல் மூலத்தின் சாத்தியமான வலிமை பாதுகாக்கப்பட்டது.
