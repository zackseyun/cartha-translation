  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וִ/יהוֹשֻׁ֖עַ מְשָׁרְת֑/וֹ וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הַ֥ר הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: ta
  text: மோசே தம் உதவியாளரான[a] யோசுவாவுடன் எழுந்தார்; பின்னர் மோசே கடவுளுடைய மலைக்கு ஏறிச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணியாளரான.” எபிரெயச் சொல் அருகிருந்து பணிவிடை செய்பவரைக் குறிக்கலாம்; இங்கு மோசேக்கு தனிப்பட்ட முறையில் உதவிய யோசுவாவைக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்தார்
  rationale: קום என்பதன் Qal தொடர் இறந்தகால வடிவம் இங்கு அடுத்த நிகழ்வைத் தொடங்கும் ‘எழுந்தார்’ என்ற பொருளைத் தருகிறது; புறப்பட்டார் என்று கூடுதலாக விளக்காமல் எபிரெயச் சொல்லின் இயல்பான பொருளைப் பேணுகிறது.
- source_word: וִיהוֹשֻׁעַ
  choice: யோசுவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர் வடிவம்.
- source_word: מְשָׁרְתוֹ
  choice: தம் உதவியாளரான
  rationale: שרת என்பது அருகிருந்து பணிபுரிபவரைக் குறிக்க முடியும். இச்சூழலில் ‘உதவியாளர்’ என்பது அடிமைத்தனத்தையோ சமயப் பதவியையோ உணர்த்தாமல் யோசுவா மோசேக்கு உதவிப் பணியாற்றிய உறவை இயல்பான நவீன தமிழில் தெரிவிக்கிறது. ‘தம்’ என்பது பின்னொட்டின் உடைமைத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: וַיַּעַל
  choice: ஏறிச் சென்றார்
  rationale: עלה இங்கு மலையை நோக்கிய மேல்நோக்கிச் செல்லுதலைக் குறிக்கிறது; ‘ஏறிச் சென்றார்’ அந்த இடவியல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַר הָאֱלֹהִים
  choice: கடவுளுடைய மலை
  rationale: எபிரெய மொழியின் உடைமைத் தொடர்பை நேரடியாகப் பேணி, மலையின் புனித முக்கியத்துவத்தை விளக்கவுரையின்றி தெரிவிக்கிறது.
theological_decisions:
- issue: מְשָׁרְתוֹ என்பதில் மோசேக்கும் யோசுவாவுக்கும் இடையிலான உறவு
  choice: யோசுவா மோசேயின் உதவியாளர் என்று குறிப்பிடப்படுகிறார்.
  alternative: பணியாளர்; ஊழியர்
  rationale: இச்சொல் பலவகையான சேவையைக் குறிக்கக்கூடியது. ஆனால் உடைமைப் பின்னொட்டும் இக்கதைச் சூழலும் மோசேயுடன் இருந்து அவருக்கு உதவிப் பணியாற்றியவரையே சுட்டுகின்றன. ‘ஊழியர்’ என்பது சமயப் பதவியை உணர்த்தக்கூடும்; ‘பணியாளர்’ என்பது வேலை அல்லது கீழ்நிலைச் சமூக உறவை அதிகமாக உணர்த்தக்கூடும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் மோசேயின் பெயர் மீண்டும் வருவதால் தமிழிலும் அந்த மீளுரைத்தல் பேணப்பட்டுள்ளது; ‘பின்னர்’ என்பது கதை நிகழ்வுகளின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
