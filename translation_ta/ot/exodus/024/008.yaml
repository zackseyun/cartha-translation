base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: ta
  text: பின்பு மோசே இரத்தத்தை எடுத்து, அதை மக்கள்மேல் வீசினார்[a]. அவர், “இதோ, இந்த வார்த்தைகள் அனைத்தின்படியும் யாவே உங்களோடு செய்த உடன்படிக்கையின் இரத்தம்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அதை மக்கள்மேல் தெளித்தார்.” எபிரெய வினைச்சொல் பொதுவாக “எறிதல்” அல்லது “வீசுதல்” என்று பொருள்படும்; பலிச் சடங்குச் சூழலில் இரத்தத்தைச் சடங்குமுறையில் செலுத்துவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “யாவே உங்களோடு வெட்டிய உடன்படிக்கையின் இரத்தம்.” “உடன்படிக்கையை வெட்டுதல்” என்பது உடன்படிக்கை செய்தலைக் குறிக்கும் எபிரெய மொழிமரபு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்து
  rationale: לקח என்பதன் வழக்கமான கதைநடைப் பொருள் ‘எடுத்தார்’; தொடரும் செயலை இயல்பான தமிழில் இணைக்க வினையெச்சமாக வழங்கப்பட்டது.
- source_word: הַדָּם
  choice: இரத்தத்தை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட பலியிரத்தத்தையே சுட்டுவதால் திட்டமான பொருள் தமிழில் சூழலால் தெளிவாகிறது.
- source_word: וַיִּזְרֹק
  choice: தெளித்தார்
  rationale: זרק அடிப்படையில் ‘எறிதல்/வீசுதல்’ என்றாலும், பலிச் சடங்கில் இரத்தத்தை மக்கள்மேல் செலுத்திய செயலை நவீன தமிழில் ‘தெளித்தார்’ இயல்பாகக் குறிக்கிறது; சொல்லின் நேரடியான வலிமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: עַל הָעָם
  choice: மக்கள்மேல்
  rationale: עַל என்பதன் இடவியல் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: சடங்கார்ந்த, கவனத்தை ஈர்க்கும் முன்னிலைப்படுத்தலை நவீன, கண்ணியமான தமிழில் தக்கவைக்கிறது.
- source_word: דַם הַבְּרִית
  choice: உடன்படிக்கையின் இரத்தம்
  rationale: எபிரெயக் கட்டமைப்பை நெருக்கமாகப் பாதுகாப்பதோடு அதன் வேதாகம மற்றும் இறையியல் எதிரொலியையும் தக்கவைக்கிறது.
- source_word: כָּרַת ... בְּרִית
  choice: உடன்படிக்கை செய்த
  rationale: எபிரெய மொழிமரபின் நேரடிப் பொருள் ‘உடன்படிக்கையை வெட்டுதல்’; ஆனால் தமிழில் ‘உடன்படிக்கை செய்தல்’ என்பதே பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. நேரடி உருவகம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமமான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עִמָּכֶם
  choice: உங்களோடு
  rationale: இரண்டாம் நபர் பன்மை பின்னொட்டின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள் அனைத்தின்படியும்
  rationale: உடன்படிக்கைக்கும் முன் கூறப்பட்ட வார்த்தைகளுக்கும் உள்ள அடிப்படை அல்லது ஒத்திசைவு உறவைப் பாதுகாக்கிறது; דְּבָרִים என்பதை விளக்கமாக ‘நிபந்தனைகள்’ என்று மாற்றாமல் ‘வார்த்தைகள்’ எனவே தருகிறது.
theological_decisions:
- issue: כָּרַת ... בְּרִית என்ற உடன்படிக்கை உருவகத்தை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் ‘உடன்படிக்கை செய்த’
  alternative: ‘உடன்படிக்கையை வெட்டிய’
  rationale: நேரடி எபிரெய உருவகத்தைத் தமிழில் அப்படியே வைத்தால் செயற்கையாகவும் தவறாகப் புரியக்கூடியதாகவும் இருக்கும். இயல்பான பொருள் முதன்மை உரையில் தரப்பட்டு, பலியோடு தொடர்புடையிருக்கக்கூடிய நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: יהוה என்ற இறைநாமத்தை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் இருப்பதால் அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்தது.
- issue: עַל כָּל הַדְּבָרִים הָאֵלֶּה என்பதன் உறவு
  choice: இந்த வார்த்தைகள் அனைத்தின்படியும்
  alternative: இந்த வார்த்தைகள் அனைத்தைக் குறித்தும்
  rationale: עַל இங்கு ‘அடிப்படையில்/படி’ அல்லது ‘குறித்து’ என்ற நுண்பொருள்களை ஏற்கலாம். உடன்படிக்கையின் விதிமுறைகளுடனான தொடர்பைத் தெரிவிக்கும் ‘அனைத்தின்படியும்’ தேர்ந்தெடுக்கப்பட்டது; சொல்லை ‘நிபந்தனைகள்’ என்று இறுக்கமாக விளக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டது. ‘இதோ’, ‘உடன்படிக்கையின் இரத்தம்’ ஆகிய சொற்றொடர்கள் வசனத்தின் சடங்கார்ந்த தீவிரத்தையும் பின்னைய வேதாகம எதிரொலியையும் காக்கின்றன. கடினமான எபிரெய உருவகங்கள் முதன்மை உரையில் இயல்பாக்கப்பட்டு அடிக்குறிப்புகளில் வெளிப்படையாகப் பதிவு செய்யப்பட்டன.
