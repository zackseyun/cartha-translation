source:
  edition: WLC
  text: וַ/יִּקַּח֙ סֵ֣פֶר הַ/בְּרִ֔ית וַ/יִּקְרָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֥ה וְ/נִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: ta
  text: பின்பு அவர் உடன்படிக்கை நூலை எடுத்து, மக்கள் கேட்கும்படி வாசித்தார். அவர்கள், “யாவே சொன்ன அனைத்தையும் நாங்கள் செய்வோம்; செவிகொடுப்போம்[a]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீழ்ப்படிவோம்.” எபிரெய வினைச்சொல் ‘கேட்பது/செவிகொடுப்பது’ என்றும், உடன்படிக்கைச் சூழல்களில் ‘கீழ்ப்படிவது’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: பின்பு அவர் ... எடுத்து
  rationale: வַ தொடர்வினை கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது. ‘பின்பு’ இயல்பான தமிழ் நிகழ்வோட்டத்தைத் தருகிறது; ‘எடுத்து’ என்பது לָקַח என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: סֵפֶר הַבְּרִית
  choice: உடன்படிக்கை நூல்
  rationale: סֵפֶר என்பது இங்கு எழுதப்பட்ட ஆவணத்தைக் குறிக்கிறது. ‘உடன்படிக்கை நூல்’ அதன் தெளிவான, குறிப்பிட்ட தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: மக்கள் கேட்கும்படி வாசித்தார்
  rationale: எழுதப்பட்ட நூல் சூழலில் קרא என்பது ‘வாசித்தார்’ எனப் பொருள்படும். ‘மக்கள் கேட்கும்படி’ என்பது ‘மக்களின் செவிகளில்’ என்ற எபிரெய மொழிமரபை இயல்பான தமிழில் வெளிப்படுத்தி, அவர் உரக்க வாசித்ததையும் உணர்த்துகிறது.
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: யாவே சொன்ன அனைத்தையும்
  rationale: כֹּל אֲשֶׁר என்பதன் முழுமையை ‘அனைத்தையும்’ காக்கிறது. தெய்வீகப் பெயரான יהוה பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: נַעֲשֶׂה
  choice: நாங்கள் செய்வோம்
  rationale: עשה என்பதன் பரந்த, நேரடியான செயற்பொருளை ‘செய்வோம்’ காக்கிறது; அதையே முன்கூட்டியே ‘கீழ்ப்படிவோம்’ என்று விளக்கவில்லை.
- source_word: וְנִשְׁמָע
  choice: செவிகொடுப்போம்
  rationale: שׁמע என்பதில் கேட்பது, கவனித்துக் கேட்பது, கீழ்ப்படிவது ஆகிய பொருள் நிழல்கள் உள்ளன. ‘செவிகொடுப்போம்’ அதன் செவிவழிப் படிமத்தையும் உடன்படிக்கைச் சூழலின் ஏற்றுக்கொள்ளும் மனப்பாங்கையும் காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைப் பதிலிலுள்ள וְנִשְׁמָע என்பதன் பொருள்
  choice: செவிகொடுப்போம்
  alternative: கீழ்ப்படிவோம்
  rationale: உடன்படிக்கை நூல் வாசிக்கப்படும் உடனடிச் சூழலில் கேட்பதன் பொருள் தெளிவாக உள்ளது; அதேவேளையில், שׁמע உடன்படிக்கைச் சூழலில் கீழ்ப்படிதலையும் குறிக்கலாம். முதன்மை உரை இரு பொருள் நிழல்களையும் சாத்தியமாக வைத்திருக்கிறது; அடிக்குறிப்பு கீழ்ப்படிதல் என்ற பொருளைத் தெளிவாகப் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள் கேட்கும்படி’ என்பது எபிரெய மொழிமரபை சொல்லுக்குச் சொல் கடினமாக்காமல் வெளிப்படுத்துகிறது. ‘செவிகொடுப்போம்’ இலக்கிய நயமுடையதாயினும் இன்றைய வாசகர்களுக்குப் புரியக்கூடியது; மேலும் மூலத்தின் கேட்பது–கீழ்ப்படிவது என்ற பொருள் அழுத்தத்தைத் தக்கவைக்கிறது.
