base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: ta
  text: அவர்கள் இஸ்ரவேலின் கடவுளைக் கண்டார்கள்; அவருடைய பாதங்களுக்குக் கீழே நீலமணிக் கல் பதித்த தளத்தின் வேலைப்பாட்டைப் போன்ற ஒன்று இருந்தது[a]; அது தெளிவில் வானமே போன்றிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீலமணி’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல்லுக்குப் பண்டைய உலகில் லாபிஸ் லசூலி என்ற பொருளும் இருந்திருக்கலாம்; எந்தக் கனிமம் துல்லியமாகக் குறிக்கப்படுகிறது என்பது உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: கண்டார்கள்
  rationale: ראה என்பதன் இயல்பான காட்சிப்புலப் பொருளை நேரடியாகத் தருகிறது; உரையின் வலிமையை மென்மைப்படுத்தவில்லை.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளை
  rationale: நேரடி செயப்படுபொருளாகக் குறிப்பிடப்படும் இஸ்ரவேலின் கடவுள் என்பதைக் குறிப்பாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: וְתַחַת רַגְלָיו
  choice: அவருடைய பாதங்களுக்குக் கீழே ... இருந்தது
  rationale: תחת என்பதன் கீழே என்ற பொருளையும், 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டையும் காக்கிறது; எபிரெய வினையற்ற தொடருக்கு தமிழில் வாசிப்புத் தெளிவுக்காக ‘இருந்தது’ சேர்க்கப்பட்டுள்ளது.
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: பதிக்கப்பட்ட தளம் போன்ற ஒன்று
  rationale: מַעֲשֶׂה-யின் செய்யப்பட்ட வேலை/வேலைப்பாடு என்ற நுணுக்கத்தையும் לִבְנָה-வின் செங்கல் அல்லது ஓடு பதித்த மேற்பரப்புக் காட்சியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַסַּפִּיר
  choice: நீலமணிக் கல்
  rationale: பாரம்பரியமாக ‘sapphire’ என அடையாளப்படுத்தப்படும் நீல நிற ரத்தினத்தைக் குறிக்கிறது; துல்லியமான பண்டைய கனிம அடையாளம் உறுதியற்றது என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: வானமே போன்றிருந்தது
  rationale: עֶצֶם இங்கு ‘எலும்பு’ என்று சொல்லர்த்தமாக அல்லாமல், வானம் தானே/வானமே என்ற வலியுறுத்தலாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: לָטֹהַר
  choice: தெளிவில்
  rationale: טֹהַר என்பதன் தூய்மை/தெளிவு நுணுக்கங்களில், இக்காட்சிசார் சூழலுக்கு ஒளிவெளித் தெளிவு பொருத்தமாக உள்ளது.
theological_decisions:
- issue: கடவுளைக் கண்டதாகவும் அவருடைய பாதங்கள் எனவும் கூறும் மனித உருவகக் காட்சி
  choice: ‘இஸ்ரவேலின் கடவுளைக் கண்டார்கள்’ என்றும் ‘அவருடைய பாதங்களுக்குக் கீழே’ என்றும் நேரடியாகத் தக்கவைத்தல்
  alternative: ‘இஸ்ரவேலின் கடவுளுடைய வெளிப்பாட்டைக் கண்டார்கள்’ அல்லது ‘அவர் நின்ற இடத்தைக் கண்டார்கள்’
  rationale: எபிரெய உரை கடவுளைக் கண்டதாக நேரடியாகக் கூறி, அவருடைய பாதங்களுக்குக் கீழிருந்ததை விவரிக்கிறது. ‘வெளிப்பாடு மட்டும்’ போன்ற விளக்கச் சொற்களைச் சேர்க்காமல் உரையிலுள்ள இறையியல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கண்டார்கள்’ மற்றும் ‘பாதங்கள்’ என்ற நேரடி மொழி பாதுகாக்கப்பட்டுள்ளது. ‘பதிக்கப்பட்ட தளம்’ என்பது வேலைப்பாடு கொண்ட செங்கல்/ஓடு போன்ற மேற்பரப்பைக் குறிக்கும் இயல்பான காட்சிசார் மொழியாகத் தேர்ந்தெடுக்கப்பட்டது.
