- from: அவர்கள் இஸ்ரவேலின் கடவுளைக் கண்டார்கள்; அவருடைய பாதங்களுக்குக் கீழே நீலமணிக் கல்லால் பதிக்கப்பட்ட தளம் போன்ற ஒன்று இருந்தது[a]; அது தெளிவில் வானமே போன்றிருந்தது.
