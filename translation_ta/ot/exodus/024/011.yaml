  text: וְ/אֶל אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑/וֹ וַֽ/יֶּחֱזוּ֙ אֶת הָ֣/אֱלֹהִ֔ים וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: ta
  text: ஆனால் இஸ்ரவேல் மக்களின் தலைவர்களுக்கு எதிராக அவர் தம் கையை நீட்டவில்லை. அவர்கள் கடவுளைக் கண்டார்கள்[a]; உண்டு குடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் கடவுளை உற்றுநோக்கினார்கள்.’ இங்குள்ள வினைச்சொல் கூர்ந்து காணுதல் அல்லது உற்றுநோக்குதல் என்ற நுண்பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: எதிராக
  rationale: שָׁלַח יָד (‘கையை நீட்டு’) என்ற சொற்றொடருடன் வரும் אֶל, இங்கு தீங்கு செய்யும் நோக்கிலான திசையைக் குறிக்கிறது; ஆகவே ‘எதிராக’ என்பது பொருத்தமானது.
- source_word: אֲצִילֵי
  choice: சிறப்புக்குரியவர்கள்
  rationale: இந்தச் சொல் சமூகத்தில் முதன்மையும் மதிப்பும் பெற்ற, தேர்ந்தெடுக்கப்பட்ட பிரதிநிதிகளைக் குறிக்கிறது. ‘சிறப்புக்குரியவர்கள்’ என்பது மரபுவழி சமூகப் பட்டத்தைத் தேவையின்றி சேர்க்காமல் அந்தப் பொருளைத் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது; இயல்பான நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ தெளிவாக உள்ளது.
- source_word: שָׁלַח יָדוֹ
  choice: தமது கையை நீட்டவில்லை
  rationale: இது தண்டிக்கவோ தாக்கவோ செயல்படுவதைக் குறிக்கும் மரபுத்தொடர். ‘கையை நீட்டவில்லை’ என்பது அதன் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַיֶּחֱזוּ
  choice: கண்டார்கள்
  rationale: வினைச்சொல் காணுதல், உற்றுநோக்குதல் அல்லது தரிசித்தல் ஆகிய தீவிர நுண்பொருள்களைக் கொண்டிருக்கலாம். முதன்மை உரையில் ‘கண்டார்கள்’ இயல்பாகவும் நேரடியாகவும் உள்ளது; மாற்று நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶת הָאֱלֹהִים
  choice: கடவுளை
  rationale: உரை தெய்வீகச் சந்திப்பை நேரடியாக ‘கடவுளைக் கண்டார்கள்’ என்று கூறுகிறது; ‘கடவுளின் வெளிப்பாடு’ என்று விளக்கி அதன் இறையியல் பதற்றத்தைத் தணிக்கவில்லை.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: அவர்கள் உண்டு குடித்தார்கள்
  rationale: இரு தொடர்வினைகளும் எளிமையாகவும் நேரடியாகவும் மொழிபெயர்க்கப்பட்டுள்ளன; தெய்வீகச் சந்திப்புக்குப் பின் அவர்கள் உண்பதும் குடிப்பதும் உரையில் உள்ளபடியே நிலைக்கிறது.
theological_decisions:
- issue: ‘தமது கையை நீட்டவில்லை’ என்பதன் எழுவாய்
  choice: மறைமுக எழுவாயான கடவுளை ‘அவர்’ என்று வெளிப்படுத்துதல்
  alternative: எழுவாயைக் குறிப்பிடாமல் விடுதல்
  rationale: எபிரெயத்தில் எழுவாய் மறைமுகமாக இருந்தாலும், சூழலில் அது கடவுளையே குறிக்கிறது. தமிழில் ‘அவர்’ என்று கூறுவது வாக்கியத்தைத் தெளிவாக்குகிறது; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
- issue: தெய்வீகச் சந்திப்பை மொழிபெயர்த்தல்
  choice: ‘அவர்கள் கடவுளைக் கண்டார்கள்’
  alternative: ‘அவர்கள் கடவுளின் வெளிப்பாட்டைக் கண்டார்கள்’ அல்லது ‘அவர்கள் கடவுளைத் தரிசித்தார்கள்’
  rationale: எபிரெய உரை கடவுளைக் கண்டதாக நேரடியாகக் கூறுகிறது. வேறு வேதாகமப் பகுதிகளுடன் தோன்றும் இறையியல் பதற்றத்தைத் தீர்க்கும் நோக்கில் ‘வெளிப்பாடு’ என்பதைச் சேர்க்காமல், உரையின் நேரடித்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சிறப்புக்குரியவர்கள்’ என்பது אֲצִילֵי என்பதன் சமூக முதன்மைப் பொருளைத் தருகிறது; ‘தமது கையை நீட்டவில்லை’ என்பது மூல உருவகத்தைப் பாதுகாக்கிறது. கடவுளைக் கண்டதாக உரை கூறும் இறையியல் பதற்றம் விளக்கிச் சீராக்கப்படாமல் அப்படியே வைக்கப்பட்டுள்ளது.
