revisions:
- from: ஆனால் இஸ்ரவேல் மக்களில் சிறப்புக்குரியவர்களுக்கு எதிராக அவர் தமது கையை நீட்டவில்லை. அவர்கள் கடவுளைக் கண்டார்கள்[a]; அவர்கள் உண்டு குடித்தார்கள்.
  to: ஆனால் இஸ்ரவேல் மக்களின் தலைவர்களுக்கு எதிராக அவர் தம் கையை நீட்டவில்லை. அவர்கள் கடவுளைக் கண்டார்கள்[a]; உண்டு குடித்தார்கள்.
