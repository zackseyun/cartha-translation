  text: Then Moses went up, and Aaron, Nadab, Abihu, and seventy of the elders of Israel.
translation:
  language: ta
  text: பின்பு மோசேயும் ஆரோனும், நாதாபும் அபிகூவும், இஸ்ரவேலின் மூப்பர்களில் எழுபது பேரும் மேலே ஏறிச் சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே ஏறிச் சென்றார்கள்
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. இந்த வசனத்தில் வெளிப்படையாக இல்லாத ‘மலைக்கு’ என்பதைச் சேர்க்கவில்லை. எபிரெயில் வினை ஒருமையில் இருந்தாலும், தொடரில் வரும் எல்லாப் பெயர்களும் அதன் கூட்டெழுவாயாக இருப்பதால் தமிழில் பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர் வடிவம்.
- source_word: וְאַהֲרֹן
  choice: ஆரோனும்
  rationale: இணைப்பைத் தமிழின் ‘-உம்’ இடைச்சொல் இயல்பாகக் காட்டுகிறது; பெயரின் நிலைபெற்ற தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: נָדָב
  choice: நாதாபும்
  rationale: எபிரெயப் பெயருக்கு நெருக்கமான, தமிழ் வேதாகமப் பயன்பாட்டில் அறியப்பட்ட வடிவம்; ‘-உம்’ இணைப்பைக் காட்டுகிறது.
- source_word: וַאֲבִיהוּא
  choice: அபிகூவும்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் நிலைபெற்ற வடிவம்; ‘-உம்’ இணைப்பைக் காட்டுகிறது.
- source_word: וְשִׁבְעִים
  choice: எழுபது பேரும்
  rationale: எண்ணையும் மனிதர்களைக் குறிக்கும் தமிழ் எண்ணுப்பின்னொட்டையும் கொண்டு இயல்பாக மொழிபெயர்க்கப்பட்டது; எபிரெய இணைப்பை ‘-உம்’ தக்கவைக்கிறது.
- source_word: מִזִּקְנֵי
  choice: மூப்பர்களில்
  rationale: מן இங்கு ஒரு பெரிய குழுவிலிருந்து தேர்ந்தெடுக்கப்பட்ட பகுதியைக் குறிக்கும் பங்கீட்டுப் பொருளில் உள்ளது; ‘மூப்பர்களில் எழுபது பேர்’ என்பது அதனைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தேசியப் பெயருக்கான பரவலாக அறியப்பட்ட தமிழ் வேதாகம வடிவம்; இங்கு மூப்பர்கள் இஸ்ரவேலைச் சேர்ந்தவர்கள் என்பதைத் தெரிவிக்கிறது.
