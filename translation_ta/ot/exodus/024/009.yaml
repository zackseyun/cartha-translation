  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெயச் சொற்றொடரின் ஒருங்கிணைப்பைத் தமிழ் ‘-உம்’ அமைப்பால் இயல்பாக்கி, சூழலில் மட்டும் தெரியும் ‘மலை’ என்ற சொல்லை உரைக்குள் சேர்க்காமல் விட்டுள்ளது.
