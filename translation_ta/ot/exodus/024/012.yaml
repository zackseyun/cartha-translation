base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: ta
  text: அப்போது யாவே மோசேயிடம், “மலையில் என்னிடம் ஏறிவந்து, அங்கேயே இரு. அவர்களுக்குப் போதிப்பதற்காக நான் எழுதிய கற்பலகைகளையும், திருச்சட்டத்தையும்[a], கட்டளையையும்[b] உனக்குக் கொடுப்பேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போதனை.” எபிரெய மொழியிலுள்ள தோரா என்ற சொல் சட்ட விதியை மட்டும் அல்லாமல், “அறிவுறுத்தல்” அல்லது “போதனை” என்றும் பலமுறை பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: “திருச்சட்டத்தையும் கட்டளையையும்” என்ற சொற்றொடர் கற்பலகைகளோடு கொடுக்கப்படும் கூடுதல் உடன்படிக்கைப் போதனையைக் குறிக்கலாம்; அல்லது அவற்றில் எழுதப்பட்டிருப்பதை மேலும் விளக்குவதாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரயேலுக்கு வெளிப்படுத்தப்பட்ட இறைவனின் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: மலையில் என்னிடம் ஏறிவந்து
  rationale: עֲלֵה אֵלַי என்பதிலுள்ள ‘என்னிடம் ஏறிவா’ என்ற அழைப்பையும், மலையை நோக்கிய இயக்கத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וֶהְיֵה שָׁם
  choice: அங்கேயே இரு
  rationale: வெறுமனே அங்கு இருப்பதைவிட, அங்கே தங்கியிருக்க வேண்டும் என்ற சூழல்சார் தொடர்நிலையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וְאֶתְּנָה לְךָ
  choice: உனக்குக் கொடுப்பேன்
  rationale: கட்டளையைத் தொடர்ந்து வரும் முதலாம் நபர் நோக்கம் அல்லது வாக்குறுதியை இயல்பான எதிர்கால வினையாக வழங்குகிறது.
- source_word: לֻחֹת הָאֶבֶן
  choice: கற்பலகைகள்
  rationale: கல்லால் செய்யப்பட்ட உடன்படிக்கைப் பலகைகளைத் தெளிவாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: וְהַתּוֹרָה
  choice: திருச்சட்டம்
  rationale: சீனாய் உடன்படிக்கைச் சூழலில் பரவலாகப் புரிந்துகொள்ளப்படும் சொல்லைத் தேர்ந்தெடுக்கிறது; תּוֹרָה என்பதன் ‘போதனை/அறிவுறுத்தல்’ என்ற பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְהַמִּצְוָה
  choice: கட்டளை
  rationale: எபிரெய மூலத்தில் உள்ள ஒருமையைப் பாதுகாக்கிறது; இதை பன்மையாகவோ முழுச் சட்டத்தொகுப்பாகவோ விரித்துரைக்கவில்லை.
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: நான் எழுதிய
  rationale: முடிவுற்ற இறைச் செயலை இயல்பான தமிழ் பெயரெச்சத் தொடராகத் தருகிறது.
- source_word: לְהוֹרֹתָם
  choice: அவர்களுக்குப் போதிப்பதற்காக
  rationale: ירה என்பதன் Hiphil வடிவிலுள்ள ‘போதித்தல்/அறிவுறுத்துதல்’ என்ற பொருளையும் நோக்கத்தையும் வெளிப்படுத்துகிறது; பன்மைச் சுட்டுப்பெயர் இஸ்ரயேல் மக்களைக் குறிக்கிறது.
theological_decisions:
- issue: ‘திருச்சட்டமும் கட்டளையும்’ என்பவை கற்பலகைகளோடு கொண்டுள்ள உறவு
  choice: கற்பலகைகள், திருச்சட்டம், கட்டளை ஆகியவற்றை இணைக்கப்பட்ட பெயர்களாகவே வைத்து, அவற்றை ஒரே கருத்தாகச் சுருக்காமல் மொழிபெயர்த்தல்.
  alternative: ‘திருச்சட்டமும் கட்டளையும்’ கற்பலகைகளில் எழுதப்பட்டவற்றை விளக்கும் ஒரே இணைப்புரையாக எடுத்துக்கொள்ளுதல்.
  rationale: எபிரெய உரை இணைப்பு இடைச்சொற்களால் பெயர்களை வரிசைப்படுத்துகிறது. இவை பலகைகளுக்கு அப்பாற்பட்ட உடன்படிக்கைப் போதனையா அல்லது பலகைகளின் உள்ளடக்கத்தையே மேலும் விளக்குகின்றனவா என்பதைத் தமிழ் முதன்மை உரை தீர்மானிக்காமல் விடுகிறது.
- issue: אֲשֶׁר כָּתַבְתִּי என்ற உறவுப்பெயர்த் தொடரின் வரம்பு
  choice: ‘நான் எழுதிய’ என்பதை ஒருங்கிணைந்த பட்டியலுக்கு முன் வைத்து, அது கற்பலகைகளையோ தொடர்ந்து வரும் சொற்களையோ இலக்கண ரீதியாகச் சாரக்கூடிய திறந்த அமைப்பைப் பாதுகாத்தல்.
  alternative: அதை கற்பலகைகளுக்கு மட்டும் அல்லது திருச்சட்டத்திற்கும் கட்டளைக்கும் மட்டும் வெளிப்படையாகக் கட்டுப்படுத்துதல்.
  rationale: மூலத்தில் உறவுத்தொடரின் துல்லியமான வரம்பு விளக்கத்திற்குரியது; தமிழ் மொழிபெயர்ப்பு அதை தேவையின்றித் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வாசிக்க எளிதானாலும் மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது. ‘திருச்சட்டம்’ வாசகர்களுக்கு அறிமுகமான உடன்படிக்கைச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டு, அதன் பரந்த ‘போதனை’ நுணுக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. ஒருமை ‘கட்டளை’ மற்றும் மூலத்தின் இணைப்புப் பட்டியல் பாதுகாக்கப்பட்டுள்ளன.
