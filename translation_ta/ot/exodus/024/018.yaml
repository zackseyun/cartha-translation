base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: ta
  text: மோசே மேகத்தின் நடுவிற்குள் நுழைந்து, மலையின்மேல் ஏறினார்.[a] மோசே நாற்பது பகலும் நாற்பது இரவும் மலையின்மேல் இருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேகத்திற்குள் நுழைந்தார்” அல்லது “மேகத்தின் நடுவிற்குள் நுழைந்தார்.” எபிரெய மொழி, மோசே மேகத்திற்கருகில் மட்டுமல்லாமல் மேகத்திற்குள்ளேயே நுழைந்தார் என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: நுழைந்து
  rationale: בוא இச்சூழலில் மேகத்தின் உள்ளே செல்லும் இயக்கத்தைக் குறிக்கிறது; ‘நுழைந்து’ என்பது திசையையும் உட்புகுதலையும் இயல்பான தமிழில் தெளிவாகத் தருகிறது.
- source_word: בְּתוֹךְ
  choice: நடுவே
  rationale: תּוֹךְ நடுப்பகுதி அல்லது உட்புறத்தைக் குறிக்கிறது. ‘மேகத்தின் நடுவே நுழைந்து’ என்பது மோசே மேகத்திற்கருகில் மட்டுமல்ல, அதற்குள்ளேயே சென்றார் என்ற எபிரெய வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: முன்னரே குறிப்பிடப்பட்ட, இறைப் பிரசன்னத்துடன் தொடர்புடைய குறிப்பிட்ட மேகத்தைச் சுட்டும் வகையில் வேற்றுமை உருபுடன் இயல்பாக வழங்கப்பட்டுள்ளது; ‘அடர்ந்த’ போன்ற மூலத்தில் இல்லாத பெயரடை சேர்க்கப்படவில்லை.
- source_word: וַיַּעַל אֶל הָהָר
  choice: மலையின்மேல் ஏறினார்
  rationale: עלה மேல்நோக்கிய இயக்கத்தையும் אֶל இலக்கையும் குறிக்கின்றன. ‘மலையின்மேல் ஏறினார்’ என்பது ஏற்றத்தையும் சென்றடைந்த இடத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: וַיְהִי מֹשֶׁה בָּהָר
  choice: மோசே மலையின்மேல் இருந்தார்
  rationale: היה இங்கு ஒரு காலப்பகுதியில் மோசேயின் இருப்பிட நிலையைக் குறிப்பிடுகிறது. ‘இருந்தார்’ என்பது ‘தங்கினார்’ போன்ற கூடுதல் நோக்கநுணுக்கத்தைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: நாற்பது பகலும் நாற்பது இரவும்
  rationale: எபிரெய காலஅளவு இணைப்பைத் துல்லியமாகவும் தமிழில் இயல்பாகவும் வழங்குகிறது; ‘பகலும் ... இரவும்’ என்ற வடிவம் முழுக் காலநீட்சியையும் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைப் பிரசன்னத்துடன் தொடர்புடைய மேகக் காட்சியை மொழிபெயர்த்தல்
  choice: மேகம்
  alternative: அடர்ந்த மேகம்
  rationale: இங்கு עָנָן என்ற சாதாரணப் பெயர்ச்சொல்லே உள்ளது; ‘அடர்ந்த’ என்று பொருள்படும் பெயரடை இல்லை. ஆகவே இறைத்தோற்றக் காட்சியை விளக்கவுரையால் விரிவுபடுத்தாமல் மூலத்தின் பதற்றமும் எளிமையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘மலையின்மேல்’ என்பது இடத்தையும் ஏற்றத்தின் இலக்கையும் தெளிவாக்குகிறது; ‘இருந்தார்’ என்பது மூலத்தில் இல்லாத ‘தங்கினார்’ என்ற கூடுதல் நுணுக்கத்தைத் தவிர்க்கிறது.
