source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: ta
  text: மோசே யாவேயின் வார்த்தைகள் அனைத்தையும் எழுதி வைத்தார். அவர் அதிகாலையில் எழுந்து, மலையின் அடிவாரத்தில்[a] ஒரு பலிபீடத்தைக் கட்டி, இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்களுக்காகப் பன்னிரண்டு கல் தூண்களையும்[b] நிறுவினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மலையின் கீழ்”; அதாவது, மலையின் அடிப்பகுதியில்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாட்டப்பட்ட பன்னிரண்டு கற்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: எழுதி வைத்தார்
  rationale: כתב என்பதன் அடிப்படைப் பொருள் ‘எழுதுதல்.’ பேசிய வார்த்தைகளை எழுத்தில் பதிவு செய்த செயலை இயல்பான நவீனத் தமிழில் ‘எழுதி வைத்தார்’ தெளிவாகக் காட்டுகிறது.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: யாவேயின் வார்த்தைகள் அனைத்தையும்
  rationale: דְּבָרִים இச்சூழலில் முன்பு உரைக்கப்பட்ட வார்த்தைகளைக் குறிக்கிறது. ‘கட்டளைகள்’ என்று குறுக்காமல், எபிரெயச் சொல்லின் பரந்த பொருளை ‘வார்த்தைகள்’ காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் சீக்கிரம் எழுவதைக் குறிக்கிறது; בַּבֹּקֶר உடன் சேர்ந்து ‘அதிகாலையில் எழுந்து’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: ஒரு பலிபீடத்தைக் கட்டி
  rationale: בנה + מזבח என்பதற்கு நேரான, தமிழில் வழக்கமான இணைச்சொல் ‘பலிபீடத்தைக் கட்டுதல்.’
- source_word: תַּחַת הָהָר
  choice: மலையின் அடிவாரத்தில்
  rationale: சொல்லுக்கு நேராக ‘மலையின் கீழ்’ என இருந்தாலும், இவ்விடவியல் சூழலில் மலையின் அடிப்பகுதியையே குறிக்கிறது; ‘அடிவாரத்தில்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: பன்னிரண்டு கல் தூண்களையும் நிறுவினார்
  rationale: מַצֵּבָה என்பது நிறுத்தப்பட்ட கல் அல்லது கல் தூணைக் குறிக்கும். ‘கல் தூண்கள்’ பொருளைத் தெளிவாக்குகிறது; அவற்றை நிறுத்திய செயலை ‘நிறுவினார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் பன்னிரண்டு கோத்திரங்களுக்காக
  rationale: לְ இங்கு அந்தக் கற்கள் பன்னிரண்டு கோத்திரங்களுடன் கொண்டுள்ள தொடர்பையோ பிரதிநிதித்துவத்தையோ குறிக்கிறது. ‘கோத்திரங்களுக்காக’ இதைத் தேவையற்ற விளக்கமின்றி காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அதனைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: பன்னிரண்டு கல் தூண்களின் தொடர்பு
  choice: பன்னிரண்டு கோத்திரங்களுக்காக
  alternative: பன்னிரண்டு கோத்திரங்களைப் பிரதிநிதித்துவப்படுத்தும்படி
  rationale: לְ என்பது தொடர்பையோ பிரதிநிதித்துவத்தையோ உணர்த்தலாம். ‘பிரதிநிதித்துவப்படுத்தின’ என்று வெளிப்படையாகத் தீர்மானிக்காமல், மூலத்தின் சுருக்கத்தையும் சிறு தெளிவின்மையையும் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கோத்திரங்கள்,’ ‘பலிபீடம்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; எபிரெயச் சொற்றொடரின் இயல்பைத் தமிழில் ஓட்டமுள்ள வாக்கியமாக வழங்க இணைவினை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
