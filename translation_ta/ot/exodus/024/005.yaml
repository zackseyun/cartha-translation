source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח אֶֽת נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּֽעֲל֖וּ עֹלֹ֑ת וַֽ/יִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַ/יהוָ֖ה פָּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: ta
  text: அவர் இஸ்ரவேல் மக்களின் இளைஞர்களை[a] அனுப்பினார். அவர்கள் யாவேக்கு முழுத் தகனப் பலிகளைச் செலுத்தி, காளைகளைச் சமாதானப் பலிகளாக[b] பலியிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இஸ்ரவேலரின் இளைஞர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘உறவுப் பலிகள்’ அல்லது ‘நல்வாழ்வுப் பலிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அவர் ... அனுப்பினார்
  rationale: שׁלח என்பதன் நேரடியான பொருளை இயல்பான தமிழ் நடையில் தருகிறது; எழுவாய் சூழலிலிருந்து மோசேயைக் குறிக்கிறது.
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிலிருந்த இளைஞர்களை
  rationale: נַעַר என்பதிலுள்ள ஆண் இளைஞர் குறிப்பைத் தக்கவைத்து, בְּנֵי יִשְׂרָאֵל என்ற வழக்கமான இனக்குழுப் பெயரை நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: முழுத் தகனபலிகளைச் செலுத்தி
  rationale: עֹלָה முழுவதும் எரிக்கப்படும் பலிவகையைக் குறிக்கிறது; עלה உடனான பலிசார் சொற்றொடரைத் தமிழில் இயல்பாக ‘செலுத்தி’ என வழங்குகிறது.
- source_word: וַיִּזְבְּחוּ
  choice: பலியிட்டார்கள்
  rationale: זבח என்பதன் பலிசார் செயலைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: זְבָחִים שְׁלָמִים
  choice: சமாதானப் பலிகளாக
  rationale: שְׁלָמִים என்ற அங்கீகரிக்கப்பட்ட பலிவகைக்கு தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் மரபான பெயரைப் பயன்படுத்துகிறது; அதன் உறவு அல்லது நல்வாழ்வு சார்ந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரேய மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: פָּרִים
  choice: காளைகளை
  rationale: பலியிடப்பட்ட விலங்குகள் ஆண் மாடுகள் என்பதைத் துல்லியமாகக் காட்டுகிறது; வாக்கிய அமைப்பில் அவை சமாதானப் பலிகளாக அளிக்கப்பட்டன என்பது தெளிவாகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை உடன்படிக்கைப் பெயரை நேரடியாகக் கொண்டிருப்பதால், அதைப் பொதுவான பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற இனக்குழுக் குறிப்பு
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இந்த எபிரேயச் சொற்றொடர் வழக்கமாக இஸ்ரவேலர் என்னும் மக்களைக் கூட்டாகக் குறிக்கிறது. அதேவேளை נַעֲרֵי என்பதிலுள்ள ஆண் இளைஞர் குறிப்பு ‘இளைஞர்கள்’ என்பதில் தக்கவைக்கப்பட்டுள்ளது.
- issue: שְׁלָמִים பலிவகையின் பொருள்
  choice: சமாதானப் பலிகள்
  alternative: உறவுப் பலிகள் / நல்வாழ்வுப் பலிகள்
  rationale: ஒரே குறிப்பிட்ட நுண்பொருளைத் திணிக்காமல் மரபாக அறியப்பட்ட பலிவகைப் பெயரை முதன்மை உரையில் வைத்து, பிற நியாயமான பொருள் நிழல்களை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பலிசார் சொற்களில் துல்லியத்திற்காக ‘முழுத் தகனபலி’ மற்றும் ‘சமாதானப் பலி’ பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் தொடர்ச்சியான இரு செயல்கள் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளன.
