revisions:
- from: அவர் இஸ்ரவேல் மக்களிலிருந்த இளைஞர்களை[a] அனுப்பினார். அவர்கள் யாவேக்கு முழுத் தகனபலிகளைச் செலுத்தி, சமாதானப் பலிகளாக[b] காளைகளைப் பலியிட்டார்கள்.
  to: அவர் இஸ்ரவேல் மக்களின் இளைஞர்களை[a] அனுப்பினார். அவர்கள் யாவேக்கு முழுத் தகனப் பலிகளைச் செலுத்தி, காளைகளைச் சமாதானப் பலிகளாக[b] பலியிட்டார்கள்.
  rationale: The revision removes an unintended ‘from among’ nuance, improves modern Tamil flow, and retains the Hebrew’s male reference in “இளைஞர்கள்,” the distinct sacrificial categories, the bulls, and the divine name. The alternatives remain in anchored footnotes without imposing a disputed nuance on the main text.
