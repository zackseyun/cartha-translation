reference: Exodus 24:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: ta
  text: மோசே மட்டும் யாவேயிடம் அணுக வேண்டும்; அவர்கள் அணுகக்கூடாது; மக்களும் மோசேயோடு மேலே ஏறக்கூடாது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: அருகில் வரவேண்டும்
  rationale: נגשׁ என்பதன் ‘அணுகுதல், அருகில் வருதல்’ என்ற பொருளையும், இச்சூழலில் உள்ள கட்டளைத் தன்மையையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֹשֶׁה לְבַדּוֹ
  choice: மோசே மட்டும்
  rationale: மோசே ஒருவன் மட்டுமே அணுக அனுமதிக்கப்பட்டான் என்ற தனித்துவத்தைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: אֶל יְהוָה
  choice: யாவே அருகில்
  rationale: אֶל குறிக்கும் அவரை நோக்கிய அணுகுதலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; יְהוָה என்ற உடன்படிக்கைப் பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְהֵם לֹא יִגָּשׁוּ
  choice: அவர்களோ அருகில் வரக்கூடாது
  rationale: முந்தைய வினையின் மறுபயன்பாட்டைப் பேணி, மோசேக்கும் மற்றவர்களுக்கும் இடையிலான எதிர்மறை வேறுபாட்டை ‘அவர்களோ’ தெளிவாக்குகிறது.
- source_word: וְהָעָם
  choice: மக்களும்
  rationale: எபிரெயத்தில் இல்லாத ‘இஸ்ரவேல்’ என்பதைச் சேர்க்காமல், עם என்பதைக் குழுவைக் குறிக்கும் பொதுச் சொல்லாக வழங்குகிறது.
- source_word: לֹא יַעֲלוּ עִמּוֹ
  choice: அவனோடு மேலே ஏறிவரக்கூடாது
  rationale: עלה குறிக்கும் மலையை நோக்கிய மேலேற்ற இயக்கத்தையும் עִמּוֹ குறிக்கும் மோசேயுடனான உடன்செல்லுதலையும் இயல்பாகப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது. அதன் உச்சரிப்பு மறுகட்டமைக்கப்பட்ட வடிவம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கட்டளைநடை பயன்படுத்தப்பட்டுள்ளது. ஒரே எபிரெய வினை மீண்டும் வருவதைக் காட்ட ‘அருகில் வர’ இருமுறையும் பேணப்பட்டுள்ளது; இறுதிப்பகுதியில் மலையேற்றச் சூழலைத் தெளிவாக்க ‘மேலே ஏறிவர’ பயன்படுத்தப்பட்டுள்ளது.
