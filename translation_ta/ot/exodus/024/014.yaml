  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: ta
  text: மூப்பர்களிடம் அவர், “நாங்கள் உங்களிடம் திரும்பி வரும்வரை எங்களுக்காக இங்கே காத்திருங்கள். இதோ, ஆரோனும் ஊரும் உங்களோடு இருக்கிறார்கள். யாருக்காவது தகராறு இருந்தால்[a], அவர் அவர்களிடம் செல்லட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாருக்காவது வழக்கு இருந்தால்.”
    reason: בַעַל דְּבָרִים என்ற எபிரெய மரபுத்தொடர் ‘தகராறு’ அல்லது முறையான ‘வழக்கு’ ஆகிய இரு நீதிசார் நுணுக்கங்களையும் ஏற்கக்கூடும்.
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: மூப்பர்கள்
  rationale: இங்கு வயதில் மூத்த ஆண்களை மட்டும் அல்லாமல், சமூகத்தின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கிறது; ‘மூப்பர்கள்’ என்பது இந்தப் பொறுப்புநிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: எங்களுக்காக இங்கே காத்திருங்கள்
  rationale: ישׁב என்பதன் அடிப்படைப் பொருள் ‘உட்காருங்கள்/தங்கியிருங்கள்’ என்றாலும், மோசே திரும்பும்வரை அங்கேயே இருக்கும்படி கூறும் சூழலில் ‘காத்திருங்கள்’ என்பது கட்டளையின் நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது; לָנוּ என்பதும் ‘எங்களுக்காக’ எனத் தக்கவைக்கப்படுகிறது.
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: நாங்கள் உங்களிடம் திரும்பி வரும்வரை
  rationale: שוב என்பதன் ‘திரும்புதல்’ என்ற பொருளையும் காலவரையறைக் கூறையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதற்குக் கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் உரையாடல் வலிமையை, பழமையான நடையின்றி dignified Tamil-ல் வெளிப்படுத்துகிறது.
- source_word: עִמָּכֶם
  choice: உங்களோடு இருக்கிறார்கள்
  rationale: ஆரோனும் ஊரும் அவர்களுடன் இருந்து உதவத் தயாராக இருப்பதை நேரடியாகத் தெரிவிக்கிறது.
- source_word: מִי בַעַל דְּבָרִים
  choice: யாருக்காவது தகராறு இருந்தால்
  rationale: בַעַל דְּבָרִים என்பது சொற்சொல்லாக ‘வார்த்தைகளின் உரிமையாளர்’ அல்ல; தீர்ப்புக்குக் கொண்டுவரப்பட வேண்டிய சட்ட அல்லது விவகாரத் தகராறு உடையவரைக் குறிக்கும் மரபுத்தொடர். ‘தகராறு’ அதன் பரந்த நீதிசார் வலிமையைப் பாதுகாக்கிறது.
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: அவர் அவர்களிடம் செல்லட்டும்
  rationale: இங்குள்ள imperfect வடிவத்தின் அறிவுறுத்தல் வலிமையை ‘செல்லட்டும்’ இயல்பாகத் தருகிறது; எபிரெயத்தின் ஒருமைப் பொதுப்பொருளும் ‘அவர்’ மூலம் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: சட்ட அறிவுறுத்தலில் ஒருமைப் பொதுப்பொருள்
  choice: அவர் அவர்களிடம் செல்லட்டும்
  alternative: அவர்கள் அவர்களிடம் செல்லட்டும்
  rationale: מִי ... יִגַּשׁ என்பது ஒருமைப் பொதுப்பொருளில் அமைந்துள்ளது. தமிழிலும் ‘யாருக்காவது ... இருந்தால், அவர்’ என்று ஒருமையைப் பாதுகாப்பது மூலவடிவத்துக்கு நெருக்கமாகவும் இயல்பாகவும் உள்ளது.
- issue: בַעַל דְּבָרִים என்பதன் நீதிசார் பரப்பு
  choice: தகராறு
  alternative: வழக்கு
  rationale: இந்த மரபுத்தொடர் முறையான நீதிமன்ற வழக்கை மட்டும் கட்டாயமாகக் குறுக்குவதில்லை; தீர்க்கப்பட வேண்டிய கோரிக்கை அல்லது சர்ச்சையையும் உள்ளடக்கலாம். ஆகவே முதன்மை உரையில் ‘தகராறு’ வைக்கப்பட்டு, ‘வழக்கு’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘இதோ’ கவன ஈர்ப்பைத் தக்கவைக்கிறது; ‘அணுகட்டும்’ என்பதற்குப் பதிலாக சாதாரண வாசகருக்குத் தெளிவான ‘செல்லட்டும்’ பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டிற்கு ஏற்ப ‘ஆரோன்’, ‘ஊர்’ என வழங்கப்பட்டுள்ளன.
