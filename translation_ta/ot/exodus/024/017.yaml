  text: וּ/מַרְאֵה֙ כְּב֣וֹד יְהוָ֔ה כְּ/אֵ֥שׁ אֹכֶ֖לֶת בְּ/רֹ֣אשׁ הָ/הָ֑ר לְ/עֵינֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: ta
  text: யாவேயின் மகிமையின் தோற்றம், மலையின் உச்சியில் விழுங்கும் நெருப்பைப் போல[a], இஸ்ரவேலின் பிள்ளைகளின் கண்களுக்கு முன்பாகத் தெரிந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எரித்து அழிக்கும் நெருப்பைப் போல.’
    reason: lexical_alternative
  - marker: b
    text: ‘இஸ்ரவேலின் பிள்ளைகள்’ என்பதை ‘இஸ்ரவேலின் மகன்கள்’ அல்லது ‘இஸ்ரவேலர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: தோற்றம்
  rationale: கண்ணுக்குப் புலப்படும் வடிவம் அல்லது தோன்றுதலைக் குறிக்கிறது; தீர்க்கதரிசனக் ‘காட்சி’ என்ற தேவையற்ற பொருளைச் சேர்க்காமல் எபிரெயச் சொல்லின் காட்சி சார்ந்த தன்மையைப் பேணுகிறது.
- source_word: כְּבוֹד
  choice: மகிமை
  rationale: யாவேயின் கண்கூடான, ஒளிமிக்க பிரசன்னத்தைக் குறிக்கும் இச்சூழலில் இயல்பானதும் வழக்கமானதுமான தமிழ்ச் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நான்கு எழுத்துப் பெயரின் பரவலான தமிழாக்க ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: விழுங்கும் நெருப்பைப் போல
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது; אֹכֶלֶת என்பதன் சொற்படிமமான ‘உண்ணுதல்/விழுங்குதல்’ என்பதையும் நெருப்பின் அழிக்கும் தீவிரத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְּרֹאשׁ הָהָר
  choice: மலையின் உச்சியில்
  rationale: மலையின் மிக உயர்ந்த பகுதியிலுள்ள இடத்தைக் குறிக்கும் எளிய, துல்லியமான நவீனத் தமிழ்.
- source_word: לְעֵינֵי
  choice: கண்களுக்கு முன்பாகத் தெரிந்தது
  rationale: மக்கள் நேரடியாகக் காணும் வகையில் அவர்களுடைய பார்வைக்கு வெளிப்பட்டிருந்தது என்ற காட்சி வலியுறுத்தலைப் பேணுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் பிள்ளைகள்
  rationale: ‘இஸ்ரவேலின் பிள்ளைகள்’ என்ற உடன்படிக்கைச் சொற்படிமத்தைத் தக்கவைத்தபடியே, நவீனத் தமிழில் புரிந்துகொள்ளக்கூடிய வடிவத்தை வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற உடன்படிக்கை அடையாளம்
  choice: இஸ்ரவேலின் பிள்ளைகள்
  alternative: இஸ்ரவேலின் மகன்கள்; இஸ்ரவேலர்
  rationale: בְּנֵי என்பதன் குடும்ப வழிவந்தோர் என்ற படிமத்தைப் பேணுகிறது. அதே நேரத்தில், இச்சூழலில் முழு இஸ்ரவேல் சமூகத்தையும் குறிக்கக்கூடிய வழக்குப் பயன்பாட்டை ஆண் உறுப்பினர்களுக்கு மட்டும் என்று தேவையின்றிக் குறுக்கவில்லை.
translation_notes:
  register: நவீன, தெளிவான, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் காட்சி வலியுறுத்தலும் ஒப்புமையும் தக்கவைக்கப்பட்டுள்ளன; தமிழில் முழுமையான வாக்கியமாக அமைய ‘தெரிந்தது’ சேர்க்கப்பட்டுள்ளது.
