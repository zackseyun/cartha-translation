base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: ta
  text: பின்பு மோசே வந்து, யாவே சொன்ன எல்லா வார்த்தைகளையும் எல்லா சட்ட விதிமுறைகளையும்[a] மக்களிடம் எடுத்துச் சொன்னார். மக்கள் அனைவரும் ஒரே குரலில், “யாவே சொன்ன அனைத்தையும் நாங்கள் செய்வோம்” என்று பதிலளித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சட்ட விதிமுறைகள்” என்பதற்கு “சட்டத் தீர்ப்புகள்” அல்லது “ஒழுங்குவிதிகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் மிஷ்பாட்டீம் (mishpatim) உடன்படிக்கை சார்ந்த சட்ட விதிகளையும் தீர்ப்புகளையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: பின்பு மோசே வந்து
  rationale: வாவ் தொடர்வினை கதையை முன்னெடுத்துச் செல்கிறது; בוא என்பதன் இயல்பான பொருளான ‘வந்து’ என்பதும் தமிழில் இயல்பான கதைத் தொடரான ‘பின்பு’ என்பதும் காக்கப்பட்டன.
- source_word: וַיְסַפֵּר
  choice: எடுத்துச் சொன்னார்
  rationale: פיעל வடிவிலுள்ள ספר இங்கு விவரித்தல் அல்லது எடுத்துரைத்தலைக் குறிக்கிறது; ‘எடுத்துச் சொன்னார்’ என்பது மக்களுக்கு முழுமையாக அறிவித்ததைக் காட்டும் இயல்பான நவீனத் தமிழ்.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: யாவே சொன்ன எல்லா வார்த்தைகளையும்
  rationale: דברים என்பதைக் பொதுமைப்படுத்தி ‘கட்டளைகள்’ என மாற்றாமல் ‘வார்த்தைகள்’ என வைத்ததோடு, தமிழ் வாக்கியத்தில் இயல்பாக இருக்க உடைமைத் தொடருக்குப் பதிலாக உறவுத் தொடர் பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய தனிப்பெயரின் தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַמִּשְׁפָּטִים
  choice: நீதிமுறைகள்
  rationale: מִשְׁפָּטִים இச்சூழலில் உடன்படிக்கை சார்ந்த சட்டத் தீர்ப்புகள் அல்லது ஒழுங்குவிதிகளைக் குறிக்கிறது; ‘நீதிமுறைகள்’ அதன் நீதி/சட்டத் தொடர்பைக் காத்து, ‘தீர்ப்புகள்’ என்பதைக் காட்டிலும் இங்கு இயல்பாக உள்ளது.
- source_word: וַיַּעַן
  choice: பதிலளித்தார்கள்
  rationale: ענה என்பதன் பதிலுரைத்தல் என்ற பொருளை நேரடியாகவும் மரியாதையான நவீனத் தமிழிலும் தருகிறது.
- source_word: קוֹל אֶחָד
  choice: ஒரே குரலில்
  rationale: ‘ஒரு குரல்’ என்ற எபிரெய மரபுத்தொடரின் ஒருமித்த பதிலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל הַדְּבָרִים אֲשֶׁר דִּבֶּר יְהוָה
  choice: யாவே சொன்ன எல்லா வார்த்தைகளின்படியும்
  rationale: முந்தைய ‘எல்லா வார்த்தைகள்’ என்பதுடனான சொல் இணைப்பைக் காக்கிறது; ‘-இன்படியும்’ என்பது அடுத்துள்ள ‘செய்வோம்’ உடன் தமிழில் தெளிவாக இணைகிறது.
- source_word: נַעֲשֶׂה
  choice: நாங்கள் செய்வோம்
  rationale: עשה என்பதன் நேரடியான ‘செய்’ என்ற பொருளை வைத்துள்ளது; ‘கீழ்ப்படிவோம்’ என்று விளக்கவுரையாக விரிவாக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக வருகிறது. அதை பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: மக்களின் உறுதிமொழியில் נַעֲשֶׂה என்பதன் வலிமை
  choice: நாங்கள் செய்வோம்
  alternative: நாங்கள் கீழ்ப்படிவோம்
  rationale: ‘செய்வோம்’ என்பது மூல வினையின் நேரடிப் பொருளையும் உடன்படிக்கை உறுதிமொழியின் வலிமையையும் காக்கிறது; கீழ்ப்படிதல் உட்பொருளாக இருந்தாலும் அதை உரைக்குள் சேர்த்து விளக்கவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழ் கலந்த பொதுநடை பயன்படுத்தப்பட்டுள்ளது. இறைப் பெயருக்கு ‘யாவே’ என்றும், சட்டச் சூழலிலுள்ள מִשְׁפָּטִים என்பதற்கு விளங்கத்தக்க ‘நீதிமுறைகள்’ என்றும் வழங்கப்பட்டுள்ளது. ஒருமித்த மக்களின் பதிலும் ‘செய்வோம்’ என்ற நேரடியான உடன்படிக்கை மொழியும் காக்கப்பட்டுள்ளன.
