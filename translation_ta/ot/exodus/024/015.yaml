  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הָ/הָ֑ר וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: ta
  text: பின்பு மோசே மலையின்மேல் ஏறிச் சென்றார்[a]; மேகம் மலையை மூடியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மோசே மலையை நோக்கி ஏறிச் சென்றார்.” எபிரெய இணைப்புச் சொல் “அப்போது/மேலும்” என்றும் மொழிபெயர்க்கப்படலாம்; אֶל என்ற முன்னிடைச்சொல் “நோக்கி” எனவும், “ஏறிச் சென்றார்” என்பதுடன் சேர்ந்து சூழலில் “மேல்” எனவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: பின்பு ... ஏறிச் சென்றார்
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தை இயல்பான நவீனத் தமிழில் காட்டுகிறது; וַ முன்னேறும் நிகழ்வுத் தொடரை இங்கு ‘பின்பு’ என வெளிப்படுத்துகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: אֶל
  choice: மலையின்மேல்
  rationale: עלה உடன் வரும் אֶל, மலையை நோக்கி மேலே சென்று அதன் மேல் அடைவதைக் குறிக்கலாம்; சூழலில் ‘மலையின்மேல்’ இயல்பாக உள்ளது, ஆனால் ‘மலையை நோக்கி’ என்பதும் இலக்கண ரீதியில் சாத்தியம்.
- source_word: הָהָר
  choice: மலை
  rationale: சீனாய் சூழலில் הַר என்பதற்கான பொருத்தமான வழக்குச் சொல்.
- source_word: וַיְכַס
  choice: மூடியது
  rationale: כסה என்பதன் நேரடியான பொருள் ‘மூடு’; ‘சூழ்ந்தது’ போன்ற விளக்கமான சொல்லைத் தவிர்த்து மூலத்தின் எளிமையைப் பேணுகிறது.
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: எபிரெய உரை குறிப்பிட்ட மேகத்தை மட்டும் பெயரிடுகிறது; தமிழில் சூழலால் அதன் குறிப்புத்தன்மை தெளிவாகிறது.
- source_word: אֶת
  choice: '[நேரடி செயப்படுபொருள் குறியீடு மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரெய நேரடி செயப்படுபொருள் குறியீட்டுக்குத் தமிழில் தனியான சொல் தேவையில்லை.
- source_word: וַ
  choice: பின்பு; இணைப்பில் இயல்பான தொடரமைப்பு
  rationale: முதல் וַ நிகழ்வின் தொடர்ச்சியை ‘பின்பு’ எனக் காட்டுகிறது; இரண்டாவது வாக்கியத்தை தமிழில் அரைப்புள்ளி மூலம் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: மேகத்தின் தன்மை
  choice: ‘மேகம்’ என்று மட்டும் விளக்கமாக மொழிபெயர்த்தல்
  alternative: ‘மகிமையின் மேகம்’ அல்லது ‘ஆண்டவரின் மேகம்’
  rationale: இந்த வசனத்தின் எபிரெய உரை ‘மேகம்’ என்று மட்டுமே கூறுகிறது. விரிந்த சூழல் அதை இறைச் சந்நிதியுடன் தொடர்புபடுத்தினாலும், உரையில் இல்லாத ‘மகிமை’ அல்லது ‘ஆண்டவரின்’ என்பதைச் சேர்க்காமல் அதன் கட்டுப்பாட்டைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட நிகழ்வுரைப் பாணி. மரியாதை ஒருமை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது. ‘மலையின்மேல்’ என்ற வடிவம் இயக்கத்தின் இலக்கைத் தெளிவாக்குகிறது; அடிக்குறிப்பு எபிரெய முன்னிடைச்சொல்லின் உண்மையான மாற்றுவாசிப்பைப் பாதுகாக்கிறது.
