base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: ta
  text: 'யாவேயின் மகிமை சீனாய் மலையின்மேல் தங்கியது. மேகம் அதை[a] ஆறு நாட்கள் மூடியிருந்தது. ஏழாம் நாளில் அவர் மேகத்தின் நடுவிலிருந்து[b] மோசேயைக் கூப்பிட்டார்.


    [a] “அதை” என்பது சீனாய் மலையைக் குறிப்பதாக இருக்கலாம்; அல்லது, மேகம் யாவேயின் மகிமையை மூடியது என்றும் பொருள்படலாம்.

    [b] அல்லது, “மேகத்துக்குள்ளிருந்து.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதை” என்பது சீனாய் மலையைக் குறிப்பதாக இருக்கலாம்; அல்லது, மேகம் யாவேயின் மகிமையை மூடியது என்றும் பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “மேகத்துக்குள்ளிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: தங்கியது
  rationale: שׁכן என்பது ஒரு இடத்தில் வந்து நிலைகொண்டு இருப்பதைக் குறிக்கிறது. “தங்கியது” என்பது அந்தக் காட்சியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כְּבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: כָּבוֹד என்பதன் வெளிப்படும் மாட்சிமை மற்றும் பிரசன்னம் சார்ந்த பொருளை “மகிமை” தருகிறது; יְהוָה என்பது பட்டப்பெயராக மாற்றப்படாமல் “யாவே” என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל הַר סִינַי
  choice: சீனாய் மலையின்மேல்
  rationale: மலைமீதான இடத்தைக் குறிக்கும் עַל என்பதன் இயல்பான தமிழ் வடிவம்.
- source_word: וַיְכַסֵּהוּ
  choice: மேகம் அதை மூடியிருந்தது
  rationale: ஆண்பால் ஒருமை பின்னொட்டின் சுட்டுப்பொருள் மலையாகவோ மகிமையாகவோ இருக்கலாம். “அதை” என்பது மூலத்தின் தெளிவின்மையைத் தக்கவைக்கிறது; தொடர்நிலையைத் தமிழில் இயல்பாகக் காட்ட “மூடியிருந்தது” பயன்படுத்தப்பட்டுள்ளது.
- source_word: שֵׁשֶׁת יָמִים
  choice: ஆறு நாட்கள்
  rationale: கால நீளத்தைத் தமிழில் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּקְרָא אֶל־מֹשֶׁה
  choice: அவர் மோசேயைக் கூப்பிட்டார்
  rationale: קרא இங்கு ஒருவரை நோக்கிக் கூப்பிடுவதைக் குறிக்கிறது. தமிழ்ச் சொற்றொடர் இயல்புக்காக வேற்றுமை உருபுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: குறிப்பிட்ட வரிசை நாளைக் குறிக்கும் இயல்பான நவீன தமிழ் வடிவம்.
- source_word: מִתּוֹךְ הֶעָנָן
  choice: மேகத்தின் நடுவிலிருந்து
  rationale: מִתּוֹךְ என்பது உள்ளிருந்து அல்லது நடுவிலிருந்து வருவதைக் குறிக்கிறது; மூலத்தின் இடவியல் உயிர்ப்பை இவ்வடிவம் காக்கிறது.
theological_decisions:
- issue: וַיִּקְרָא என்பதன் மறைமுக எழுவாய்
  choice: “அவர்” என்பது யாவேயைக் குறிக்கிறது
  alternative: “யாவேயின் மகிமை” என்பதை ஆகுபெயரான எழுவாயாகக் கொள்ளுதல்
  rationale: சீனாய் வெளிப்பாட்டின் கதைச்சூழலில் மோசேயைக் கூப்பிடுபவர் யாவே என்பதே இயல்பான வாசிப்பு. எனினும், எபிரெய உரையைப் போலவே பெயரை மீண்டும் சேர்க்காமல் “அவர்” என்று வைத்து கதைநடையைப் பாதுகாக்கிறது.
- issue: וַיְכַסֵּהוּ என்பதிலுள்ள பொருள் பின்னொட்டின் சுட்டுப்பொருள்
  choice: முதன்மையாக சீனாய் மலை
  alternative: யாவேயின் மகிமை
  rationale: காட்சியின் சூழல் மேகம் மலையை மூடியதாக வாசிப்பதை ஆதரிக்கிறது. ஆனால் இலக்கணப்படி “மகிமை” என்பதும் சாத்தியமானதால், தமிழ் முதன்மை உரையில் “அதை” என்று தெளிவின்மை காக்கப்பட்டு அடிக்குறிப்பில் மாற்று வாசிப்பு தரப்பட்டுள்ளது.
translation_notes:
  register: மொழிநடை நவீன நிலையான தமிழில், எளிமையும் மரியாதையும் கொண்டதாக அமைக்கப்பட்டுள்ளது. யாவே என்ற தனிப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. மூல எபிரெயத்தில் உள்ள சுட்டுப்பொருள் தெளிவின்மை நீக்கப்படாமல் உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
