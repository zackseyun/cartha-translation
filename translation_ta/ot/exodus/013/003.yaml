base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: ta
  text: மோசே மக்களிடம், “நீங்கள் எகிப்திலிருந்து, அடிமைத்தனத்தின் வீட்டிலிருந்து, வெளியே வந்த இந்த நாளை நினைவுகூருங்கள். ஏனெனில் யாவே தமது வலிமையான கையால் உங்களை அங்கிருந்து வெளியே கொண்டுவந்தார்; புளிப்பூட்டப்பட்ட எதையும் சாப்பிடக் கூடாது[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புளித்த அப்பத்தைச் சாப்பிடக் கூடாது.” எபிரெயச் சொல் புளிப்பூட்டப்பட்ட பொருளை அல்லது புளித்த உணவை குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: நினைவுகூருங்கள்
  rationale: ஒருமை கட்டளை வடிவம் மக்களை ஒரே சமூகமாக நோக்குகிறது. தமிழில் மரியாதை/பன்மை கட்டளை இயல்பாக இருப்பதோடு, நிகழ்வைத் தொடர்ந்து நினைவில் கடைப்பிடிக்கும் நினைவுச் சார்ந்த வலியையும் வெளிப்படுத்துகிறது.
- source_word: הַיּוֹם הַזֶּה
  choice: இந்த நாளை
  rationale: குறிப்புச் சுட்டுடன் உள்ள எபிரெயச் சொற்றொடரை நேராகவும் இயல்பாகவும் வழங்குகிறது; மூலத்தில் இல்லாத கூடுதல் வலியுறுத்தலைச் சேர்ப்பதில்லை.
- source_word: יְצָאתֶם מִמִּצְרַיִם
  choice: நீங்கள் எகிப்திலிருந்து ... வெளியே வந்த
  rationale: יצא என்பதன் வெளியேறுதல் பொருளையும், מִן என்பதன் தொடக்க இடத்தையும் தெளிவாகக் காக்கிறது.
- source_word: מִבֵּית עֲבָדִים
  choice: அடிமைத்தனத்தின் வீட்டிலிருந்து
  rationale: சொல்லுக்கு நெருக்கமாக ‘அடிமைகளின் வீடு’ எனக் கூறலாம்; ஆனால் இச்சூழலில் எகிப்தை அடிமைப்படுத்தப்பட்ட நிலையின் இடமாகக் குறிக்கும் எபிரெய மரபுத்தொடரை ‘அடிமைத்தனத்தின் வீடு’ இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இந்த நாளை நினைவுகூர வேண்டிய காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: בְּחֹזֶק יָד
  choice: தமது வலிமையான கையால்
  rationale: வல்லமையான தெய்வீகச் செயலைக் குறிக்கும் உருவகத்தைத் தக்கவைக்கிறது. தமிழில் உரிமை தெளிவுக்காக ‘தமது’ சேர்க்கப்பட்டுள்ளது; அது யாவேயின் கையைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הוֹצִיא ... אֶתְכֶם מִזֶּה
  choice: உங்களை அங்கிருந்து வெளியே கொண்டுவந்தார்
  rationale: יצא வினையின் ஹிஃபில் காரணவினை வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அங்கிருந்து’ என்பது எகிப்தைத் திரும்பச் சுட்டுகிறது.
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: புளிப்பூட்டப்பட்ட எதையும் சாப்பிடக் கூடாது
  rationale: חָמֵץ என்பது புளித்த அப்பத்துக்கு மட்டும் கட்டுப்படாமல் புளிப்பூட்டப்பட்ட உணவுப்பொருளையும் குறிக்கக்கூடும். எபிரெயச் செயலப்பாட்டு தடையின் பொதுவான கட்டளைத்தன்மையை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துவதால், அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: עֲבָדִים இடம்பெறும் வெளியேற்றச் சொற்றொடர்
  choice: அடிமைத்தனத்தின் வீடு
  alternative: அடிமைகளின் வீடு
  rationale: இங்கு உண்மையான அடிமைப்படுத்தப்பட்ட நிலையையே குறிக்கிறது. தேர்ந்த வடிவம் அந்தக் கடுமையை மென்மைப்படுத்தாமல், தமிழில் எகிப்து அடிமைத்தனத்தின் இடமாக இருந்ததைக் கூறும் மரபுத்தொடரின் பொருளை வெளிப்படுத்துகிறது.
- issue: חָמֵץ என்பதன் பரப்பு
  choice: புளிப்பூட்டப்பட்ட எதையும்
  alternative: புளித்த அப்பத்தை
  rationale: பெயர்ச்சொல் புளிப்பூட்டப்பட்ட பொருள் அல்லது உணவு என்ற பரந்த பொருளைக் கொள்ளக்கூடும்; ஆகவே அப்பம் என்று மட்டும் வரையறுக்காமல் மூலத்தின் சாத்தியமான பரப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில், எபிரெய உருவகங்களையும் வாக்கியத்தின் காரணத் தொடர்பையும் இயன்றவரை தக்கவைத்த optimal-equivalence மொழிபெயர்ப்பு. நேரடிப் பேச்சில் மக்களை நோக்கும் கட்டளை தமிழின் இயல்புக்கேற்ப மரியாதைப் பன்மையில் வழங்கப்பட்டது.
