  yaml_path: translation/ot/exodus/013/004.yaml
  text: Today you are going out[a], in the month of Abib.
translation:
  language: ta
  text: இன்று நீங்கள் ஆபீப்[a] மாதத்தில் புறப்படுகிறீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ஆபீப் என்பது ஒரு மாதத்தின் பெயர்; இச்சொல் வசந்த காலத்தில் தானியக் கதிர்கள் முற்றும் பருவத்தோடு தொடர்புடையது.
    reason: cultural_note
lexical_decisions:
- source_word: הַיּוֹם
  choice: இன்று
  rationale: குறிப்பிட்ட உருபுடன் வந்த இச்சொல் இங்கே வினையடைபோல் செயல்பட்டு, புறப்பாடு நிகழும் தற்போதைய நாளைக் குறிக்கிறது; “இன்று” என்பது இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אַתֶּם
  choice: நீங்கள்
  rationale: இஸ்ரவேல் மக்களைக் கூட்டாகச் சுட்டும் இரண்டாம் நபர் பன்மைப் பெயர்ச்சொல்; தமிழில் மரியாதை/பன்மை வடிவமான “நீங்கள்” சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: יֹצְאִים
  choice: புறப்படுகிறீர்கள்
  rationale: יצא என்பதன் Qal நிகழ்காலப் பங்கேற்பு வடிவம் நடந்துகொண்டிருக்கும் அல்லது உடனடியாக நிகழவிருக்கும் வெளியேற்றத்தைக் குறிக்கிறது. “புறப்படுகிறீர்கள்” எகிப்திலிருந்து வெளியேறும் நகர்வையும் நிகழ்கால உயிர்ப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּחֹדֶשׁ
  choice: மாதத்தில்
  rationale: בְּ முன்னிடைச்சொல்லும் “மாதம்” என்பதும் சேர்ந்து நிகழ்வின் காலத்தைக் குறிக்கின்றன; “மாதத்தில்” என்பது செறிவான இயல்பான தமிழ்.
- source_word: הָאָבִיב
  choice: ஆபீப்
  rationale: எபிரெய மாதப் பெயர்/காலக் குறியீட்டை விளக்கப் பொருளாக மாற்றாமல் ஒலிபெயர்த்துள்ளது; அதன் சொற்பின்னணி அடிக்குறிப்பில் தரப்படுகிறது.
