  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: ta
  text: 'பின்பு யாவே மோசேயிடம் பேசிச் சொன்னார்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பின்பு ... பேசினார்
  rationale: வாவ் தொடர்வடிவம் நிகழ்ச்சியை அடுத்த கட்டத்துக்கு நகர்த்துகிறது; ‘பின்பு’ அந்த வரிசைத்தன்மையை இயல்பான தமிழில் காட்டுகிறது. דבר என்பதன் அடிப்படைச் செயற்பொருளை ‘பேசினார்’ நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֶל
  choice: -யிடம்
  rationale: பேச்சு யாரை நோக்கியது என்பதைக் காட்டும் இயல்பான நவீனத் தமிழ் வேற்றுமை வடிவம்.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: לֵאמֹר
  choice: சொன்னார்
  rationale: அடுத்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை, ‘பேசிச் சொன்னார்’ என்ற இயல்பான தமிழ் தொடரால் பிரதிபலிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ அதை ஒரு பட்டமாக மாற்றாமல் பாதுகாக்கிறது; ‘யெகோவா’ மாற்று ஒலிவடிவம், ‘கர்த்தர்’ பெயருக்குப் பதிலான பட்டம்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. எபிரெயக் கதைத் தொடர்ச்சியும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் சூத்திரமும் இயல்பான தமிழில் காக்கப்பட்டுள்ளன.
