  text: שִׁבְעַ֥ת יָמִ֖ים תֹּאכַ֣ל מַצֹּ֑ת וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י חַ֖ג לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: ta
  text: ஏழு நாட்கள் நீ புளிப்பில்லாத அப்பம் உண்ண வேண்டும்; ஏழாம் நாளில் யாவேக்குப்[a] பண்டிகை[b] இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் ‘YHWH’; பாரம்பரியமாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: 'அல்லது, ‘விழா’. எபிரேயத்தில்: ‘யாவேக்குப் பண்டிகை’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: இக்கூட்டுச்சொல் காலநீட்சியைக் குறிக்கிறது. தமிழில் ‘ஏழு நாட்கள்’ என்பதே இயல்பாக அந்த நீட்சியை வெளிப்படுத்துகிறது.
- source_word: תֹּאכַל
  choice: நீ ... சாப்பிட வேண்டும்
  rationale: சட்டம் அல்லது அறிவுறுத்தல் சூழலில் வரும் இரண்டாம் நபர் ஆண்பால் ஒருமை வினைமுற்றின் கட்டளைத் தன்மையை, நவீனத் தமிழில் இயல்பாகவும் அளவுக்கு மீறிய வற்புறுத்தல் இல்லாமலும் தெரிவிக்கிறது.
- source_word: מַצֹּת
  choice: புளிப்பில்லாத அப்பம்
  rationale: பஸ்கா மற்றும் பண்டிகைச் சூழலில் இது புளிக்கவைக்கப்படாத அப்பத்தைக் குறிக்கிறது. தமிழில் தெளிவாகப் புரியும் பொதுவான சொல்லாக்கம் இது.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: எளிய இணைப்பை அரைப்புள்ளி வழியாகத் தொடர்ந்து, காலத்தைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழ்ச் சொல்லமைப்பில் தருகிறது.
- source_word: חַג
  choice: பண்டிகை
  rationale: வழிபாடு, கொண்டாட்டம், சில வேளைகளில் யாத்திரை ஆகிய நிழற்பொருள்களைக் கொண்ட சமய விழாவை ‘பண்டிகை’ இயல்பாகக் குறிக்கிறது; ‘விழா’ என்பதும் சாத்தியம்.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: ל அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிக்கிறது. கடவுளின் தனிப்பெயரான יהוה என்பதை பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, பண்டிகை அவருக்குரியது என்பதை நான்காம் வேற்றுமை உருபு தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட கடவுளின் தனிப்பெயர் நேரடியாக உள்ளது. அதைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது; பாரம்பரிய மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: חַג לַיהוָה என்ற வினையற்ற சொற்றொடர்
  choice: யாவேக்குப் பண்டிகை கொண்டாட வேண்டும்
  alternative: யாவேக்குப் பண்டிகை
  rationale: எபிரெயத்தில் இப்பகுதி வினையற்றது. முந்தைய அறிவுறுத்தல் சூழலிலுள்ள கட்டளைத் தன்மையைத் தமிழில் முழுமையான, இயல்பான வாக்கியமாக வெளிப்படுத்த ‘கொண்டாட வேண்டும்’ நிரப்பப்பட்டுள்ளது; இதை நிகழ்வைப் பற்றிய வெறும் முன்னறிவிப்பாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் வழிபாட்டு உரைக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ஒருமை இரண்டாம் நபரை வெளிப்படுத்த ‘நீ’ வைக்கப்பட்டுள்ளது; ‘புளிப்பில்லாத அப்பம்’ எண்ணிக்கையைக் காட்டாத பொதுப்பொருள் பெயராக இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
