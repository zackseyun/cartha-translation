- from: எனவே, கடவுள் மக்களை நாணற்கடலை[a] நோக்கிச் செல்லும் பாலைநிலப் பாதையில் சுற்றி வழிநடத்தினார். இஸ்ரவேலின் மகன்கள் ஆயுதம் ஏந்தியவர்களாய்[b] எகிப்து நாட்டிலிருந்து புறப்பட்டுச் சென்றார்கள்.
  to: ஆகவே, கடவுள் மக்களை நாணற்கடலுக்கு[a] செல்லும் பாலைநிலத்தின் வழியாகச் சுற்றி அழைத்துச் சென்றார். இஸ்ரவேலின் மகன்கள் போருக்கு ஆயத்தமாக[b] எகிப்து நாட்டிலிருந்து புறப்பட்டுச் சென்றார்கள்.
