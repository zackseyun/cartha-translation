  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: ta
  text: ஆகவே, கடவுள் மக்களை நாணற்கடலுக்கு[a] செல்லும் பாலைநிலத்தின் வழியாகச் சுற்றி அழைத்துச் சென்றார். இஸ்ரவேலின் மகன்கள் போருக்கு ஆயத்தமாக[b] எகிப்து நாட்டிலிருந்து புறப்பட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செங்கடல்.” எபிரெயப் பெயரின் சொற்பொருள் “நாணற்கடல்.”
    reason: alternative_reading
  - marker: b
    text: “போருக்கு ஆயத்தமாக” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியில்லை; “ஆயுதம் ஏந்தியவர்களாய்,” “படை அணிவகுப்பில்,” அல்லது பொதுவாக “ஒழுங்கான அணிகளாக” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: சுற்றி வழிநடத்தினார்
  rationale: சבב என்பதன் ஹிஃபில் வடிவம், நேரான வழிக்குப் பதிலாக மக்களைச் சுற்றுப்பாதையில் செல்லும்படி கடவுள் நடத்தியதைக் குறிக்கிறது; தமிழில் இது இயல்பாகவும் தெய்வீகச் செயற்பாட்டைத் தெளிவாகவும் காட்டுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வினைச்சொல் ஒருமையில் இருப்பதால் இங்கு ஒருமை இறைச்சுட்டே தெளிவானது; நவீனத் தமிழில் பொதுவாகப் புரியும் நிலையான சொல்.
- source_word: הָעָם
  choice: மக்களை
  rationale: பயணித்துக்கொண்டிருக்கும் இஸ்ரவேல் சமூகத்தை ஒட்டுமொத்தமாகக் குறிக்கும் இயல்பான கூட்டுப்பெயர்.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: பாலைநிலப் பாதையில்
  rationale: דֶּרֶךְ என்பதன் பாதை அல்லது வழித்தடம் என்ற பொருளையும், מִדְבָּר என்பதன் வறண்ட பாலைநிலச் சூழலையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יַם סוּף
  choice: நாணற்கடல்
  rationale: சொற்பொருளின்படி סוּף என்பது நாணல் அல்லது கோரை போன்ற நீர்த்தாவரத்தைக் குறிக்கிறது. மரபான ‘செங்கடல்’ என்பதற்குப் பதிலாக மூலமொழிக்கு முன்னுரிமை அளிக்கப்பட்டு, மரபுப்பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַחֲמֻשִׁים
  choice: ஆயுதம் ஏந்தியவர்களாய்
  rationale: இந்த அரிய சொல்லின் மிகச் சாத்தியமான போர்சார் பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது; படை அணிவகுப்பு அல்லது ஒழுங்கான அணிகள் என்ற மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: עָלוּ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: எகிப்திலிருந்து வெளியேறும் பயணத்தைத் தமிழில் இயல்பாகச் சொல்கிறது. ‘மேலே சென்றார்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பு இச்சூழலில் இயல்பற்றதாக இருக்கும்.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: மூலத்தின் ஆண்பால் பன்மை அமைப்பை வெளிப்படையாகப் பாதுகாக்கிறது; இச்சொற்றொடர் உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: מִן முன்னிடைச்சொல்லின் ‘இருந்து’ என்ற பொருளையும் אֶרֶץ என்பதையும் இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்பதன் பாலின வடிவமும் கூட்டுப்பொருளும்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள் / இஸ்ரவேல் மக்கள்
  rationale: எபிரெய ஆண்பால் பன்மை வடிவத்தை மறைக்காமல் வைத்திருக்கிறது; அதேவேளையில் இது உடன்படிக்கை மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் நிலையான இனக்குழுப் பெயர் என்பதை மொழிபெயர்ப்பு தீர்மானம் மாற்றவில்லை.
- issue: יַם סוּף என்ற இடப்பெயர்
  choice: நாணற்கடல்
  alternative: செங்கடல்
  rationale: மூலமொழியின் வெளிப்படையான சொற்பொருளுக்கு முன்னுரிமை அளிக்கப்படுகிறது. நீண்ட மொழிபெயர்ப்பு மரபில் பயன்படும் ‘செங்கடல்’ வாசகர்களுக்காக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: חֲמֻשִׁים என்பதன் உறுதியற்ற பொருள்
  choice: ஆயுதம் ஏந்தியவர்களாய்
  alternative: போருக்கு ஆயத்தமானவர்களாய் / படை அணிவகுப்பில் / ஒழுங்கான அணிகளாக
  rationale: போர்சார் ஆயத்தம் என்பது சூழலுக்கு ஏற்ற முதன்மைப் புரிதல்; ஆனால் சொல்லின் துல்லியமான நுண்பொருள் விவாதத்திற்குரியது என்பதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்படுகின்றன.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, கண்ணியமான ஆனால் எளிதில் புரியும் உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பாலைநிலப் பாதை,’ ‘சுற்றி வழிநடத்தினார்’ ஆகியவை மூலத்தின் வழித்தடக் கவனத்தை இயல்பாகப் பாதுகாக்கின்றன. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
