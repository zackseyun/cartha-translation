  choice: கடவுள் உங்களை நிச்சயமாகக் கவனித்துக்கொள்வார்
  alternative: கடவுள் உங்களை நிச்சயமாகச் சந்திப்பார்
  rationale: இந்த எபிரெயச் சொற்றொடர் வெறும் பார்த்தல் அல்லது நினைத்தல் மட்டுமல்லாமல், தம் மக்களுக்காகக் கடவுள் உறுதியாகத் தலையிடுவதையும் குறிக்கலாம். முதன்மை உரை இதைத் தெளிவாகத் தெரிவிக்கிறது; அதேவேளை சொற்சார்ந்த உருவகத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் குடும்பமுறைச் சொல்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்
  rationale: ‘இஸ்ரவேலர்’ என்பது கூட்டுப்பொருளை இயல்பாகத் தரும்; எனினும் இங்கு மூலத்தில் வெளிப்படையாக உள்ள தந்தை–சந்ததி உறவுமுறையை மறைக்காமல் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழ் நடையுடன், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரை பயன்படுத்தப்பட்டுள்ளது. ‘உறுதியாகச் சத்தியம் செய்யவைத்து’ என்பது மூலத்தின் காரணவினை மற்றும் வலியுறுத்தலைத் தருகிறது; ‘மேலே எடுத்துச் செல்ல’ என்பது வாக்குத்தத்த நாட்டை நோக்கிய திசைநுணுக்கத்தைப் பாதுகாக்கிறது.
