base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: ta
  text: மோசே யோசேப்பின் எலும்புகளைத் தன்னுடன் எடுத்துக்கொண்டார். ஏனெனில் யோசேப்பு இஸ்ரவேலின் மகன்களை உறுதியாகச் சத்தியம் செய்யவைத்து, “கடவுள் உங்களை நிச்சயமாகக் கவனித்துக்கொள்வார்[a]; நீங்கள் என் எலும்புகளை இங்கிருந்து உங்களோடு மேலே எடுத்துச் செல்ல வேண்டும்” என்று சொல்லியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் உங்களை நிச்சயமாகச் சந்திப்பார்.” இந்த எபிரெய மரபுத்தொடர், கடவுள் தம் மக்களுக்காகத் தீர்மானமாகத் தலையிடுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: எடுத்துக்கொண்டார்
  rationale: לקח என்பதன் வழக்கமான கதைநடைப் பொருளான ‘எடுத்தல்’ என்பதைக் இயல்பான தமிழில் தருகிறது.
- source_word: עַצְמוֹת יוֹסֵף
  choice: யோசேப்பின் எலும்புகளை
  rationale: ‘எஞ்சிய உடல்’ என்று பொதுமைப்படுத்தாமல், எபிரெய மூலத்தின் தெளிவான ‘எலும்புகள்’ என்ற சொல்லை நேரடியாகப் பாதுகாக்கிறது.
- source_word: עִמּוֹ
  choice: தன்னுடன்
  rationale: மோசேயையே சுட்டும் மூன்றாம் நபர் ஒருமைச் சுட்டுப்பெயரைத் தமிழில் குழப்பமின்றி வெளிப்படுத்துகிறது.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: உறுதியாகச் சத்தியம் செய்யவைத்து
  rationale: ஹிபில் வினையின் காரணவினைப் பொருளையும், infinitive absolute தரும் வலியுறுத்தலையும் தக்கவைக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களை
  rationale: கூட்டாக இஸ்ரவேலின் சந்ததியினரைக் குறித்தாலும், மூலத்தின் குடும்ப உறவுமுறையையும் ‘மகன்கள்’ என்ற வெளிப்படையான சொல்லையும் காக்கிறது.
- source_word: פָּקֹד יִפְקֹד
  choice: நிச்சயமாகக் கவனித்துக்கொள்வார்
  rationale: இவ்விடத்தில் உள்ள உறுதியான தெய்வீக அக்கறையையும் செயல்பாட்டையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘சந்திப்பார்’ என்ற சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהַעֲלִיתֶם
  choice: மேலே எடுத்துச் செல்ல வேண்டும்
  rationale: עלה என்பதிலுள்ள மேல்நோக்கிய நகர்வையும், ஆணையுடன் கூடிய எதிர்காலக் கடமையையும் பாதுகாக்கிறது.
- source_word: מִזֶּה אִתְּכֶם
  choice: இங்கிருந்து உங்களோடு
  rationale: பேசுபவரின் தற்போதைய இடமான எகிப்திலிருந்து புறப்படுவதையும், உடன்கொண்டு செல்வதையும் எளிமையாகத் தருகிறது.
theological_decisions:
