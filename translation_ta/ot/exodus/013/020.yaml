  text: They set out from Succoth and camped at Etham, on the edge of the wilderness.
translation:
  language: ta
  text: அவர்கள் சுக்கோத்திலிருந்து புறப்பட்டு, வனாந்தரத்தின் எல்லையில் இருந்த ஏத்தாமில் முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: அவர்கள் புறப்பட்டு
  rationale: נסע என்பதன் தொடர்கதை வடிவம் முகாமைக் கலைத்துப் பயணத்தைத் தொடங்கிய அடுத்த நிகழ்வைக் குறிக்கிறது; ‘புறப்பட்டு’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִסֻּכֹּת
  choice: சுக்கோத்திலிருந்து
  rationale: מִן முன்னொட்டு ‘இலிருந்து’ என்ற தொடக்க இடத்தைக் குறிக்கிறது; சுக்கோத் என்ற இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் பொருள் ஓர் இடத்தில் தங்கி முகாமிடுதல்; ‘முகாமிட்டார்கள்’ தெளிவான தற்போதைய தமிழாக்கம்.
- source_word: בְאֵתָם
  choice: ஏத்தாமில்
  rationale: בְ முன்னொட்டு இடத்தைக் குறிக்கிறது; தமிழில் ‘ஏத்தாமில்’ என்பது பயண விவரிப்புக்கு இயல்பான வடிவம்.
- source_word: בִּקְצֵה
  choice: எல்லையில்
  rationale: קָצֶה என்பது ஓரம், எல்லை, கடைசி முனை ஆகிய பொருள்களைக் கொண்டது; இங்குள்ள புவியியல் சூழலில் ‘எல்லையில்’ இயல்பாகப் பொருந்துகிறது.
- source_word: הַמִּדְבָּר
  choice: வனாந்தரத்தின்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் மக்கள் குடியிருப்பு குறைந்த வறண்ட வெளிப்பகுதியையும் குறிக்கலாம்; ‘வனாந்தரம்’ அந்தப் பரப்பை மிகையாகக் குறிப்பாக்காமல் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமப் பயணக் கதைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத் தொடர்கதை அமைப்பு தமிழில் இயல்பாக ‘புறப்பட்டு ... முகாமிட்டார்கள்’ என வழங்கப்பட்டுள்ளது.
