translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சட்டவிதி நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவைப் பேண ‘உன்/உன்னிடம்’ பயன்படுத்தப்பட்டுள்ளது. חָמֵץ மற்றும் שְׂאֹר ஆகிய இரு சொற்களுக்கிடையிலான வேறுபாடு ‘புளித்த எதுவும்’ மற்றும் ‘புளிப்பூட்டும் மாவு’ எனப் பேணப்பட்டுள்ளது.
