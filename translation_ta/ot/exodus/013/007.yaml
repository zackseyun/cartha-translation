  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: ta
  text: ஏழு நாட்கள் முழுவதும் புளிப்பில்லாத அப்பம் உண்ணப்பட வேண்டும். புளித்த எதுவும்[a] உன்னிடம் காணப்படக் கூடாது; உன் எல்லைக்குள் எங்கும் புளிப்பூட்டும் மாவு[b] காணப்படக் கூடாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் புளிக்கச் செய்யப்பட்ட அப்பத்தை மட்டுமல்லாமல், புளித்த எந்த உணவுப் பொருளையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இது மாவைப் புளிக்கச் செய்யப் பயன்படுத்தப்பட்ட புளித்த மாவு அல்லது மாவுப் புளியைக் குறிக்கிறது; அடுத்த தலைமுறைகளில் பயன்பட்ட நவீன வணிக ஈஸ்டை மட்டும் குறிப்பதல்ல.
    reason: lexical_clarification
lexical_decisions:
- source_word: מַצּוֹת
  choice: புளிப்பில்லாத அப்பம்
  rationale: பஸ்கா சூழலில் புளிக்கச் செய்யப்படாத அப்பத்தைக் குறிக்கிறது. இந்தச் சொற்றொடர் சடங்குசார் பொருளைத் தெளிவாகவும் இயல்பான நவீனத் தமிழிலும் தெரிவிக்கிறது.
- source_word: יֵאָכֵל
  choice: உண்ணப்பட வேண்டும்
  rationale: நிஃபால் வினைவடிவின் செயப்பாட்டு பொருளைப் பேணுகிறது; சட்டவிதியின் கட்டுப்பாட்டு வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: ஏழு நாட்கள் முழுவதும்
  rationale: கால அளவைக் குறிக்கும் வேற்றுமை உருபு, பண்டிகையின் முழு ஏழுநாள் காலத்தையும் சுட்டுகிறது.
- source_word: חָמֵץ
  choice: புளித்த எதுவும்
  rationale: இது புளிப்பூட்டும் காரணியை மட்டும் அல்லாமல், புளிக்கச் செய்யப்பட்ட பொருள் அல்லது உணவை விரிவாகக் குறிக்கலாம். அடுத்துள்ள שְׂאֹר என்பதிலிருந்து வேறுபாட்டைப் பேண இந்த மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: יֵרָאֶה לְךָ
  choice: உன்னிடம் காணப்படக் கூடாது
  rationale: சொல்லுக்குச் சொல் பொருள் ‘உன்னுடன்/உன்னிடம் காணப்படக் கூடாது.’ இந்தச் சட்டச் சூழலில் அது ஒருவரின் உடைமையிலோ ஆளுகைப் பகுதியிலோ இருக்கக்கூடாது என்பதைக் குறிக்கிறது; தமிழாக்கம் உருவகத்தைத் தீர்த்துவிடாமல் பேணுகிறது.
- source_word: שְׂאֹר
  choice: புளிப்பூட்டும் மாவு
  rationale: புளித்த உணவான חָמֵץ என்பதிலிருந்து வேறுபட்டு, இது மாவைப் புளிக்கச் செய்யப் பயன்படுத்தப்பட்ட புளித்த மாவுக் காரணியைக் குறிக்கிறது. ‘ஈஸ்ட்’ என்று மட்டும் கூறுவது நவீன வணிக ஈஸ்டைத் தவறாக நினைவூட்டக்கூடும்.
- source_word: בְּכָל גְּבֻלֶךָ
  choice: உன் எல்லைக்குள் எங்கும்
  rationale: ஒருவருக்குரிய முழு நிலப்பரப்பு அல்லது ஆளுகைப் பகுதியை உள்ளடக்கும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
