source:
  edition: WLC
  text: וַֽ/יהוָ֡ה הֹלֵךְ֩ לִ/פְנֵי/הֶ֨ם יוֹמָ֜ם בְּ/עַמּ֤וּד עָנָן֙ לַ/נְחֹתָ֣/ם הַ/דֶּ֔רֶךְ וְ/לַ֛יְלָה בְּ/עַמּ֥וּד אֵ֖שׁ לְ/הָאִ֣יר לָ/הֶ֑ם לָ/לֶ֖כֶת יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: ta
  text: யாவே[a] அவர்களுக்கு முன்னே பகலில் மேகத் தூணில் சென்று, வழியிலே அவர்களை வழிநடத்தவும், இரவில் நெருப்புத் தூணில் அவர்களுக்கு ஒளி கொடுக்கவும் சென்று கொண்டிருந்தார்; அதனால் அவர்கள் பகலும் இரவும் பயணம் செய்ய முடிந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: YHWH (יהוה).'
    reason: மூலத்தில் வரும் தனிப்பட்ட இறைப்பெயரின் எபிரெய வடிவத்தைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה-ஐ பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவத்தில் தருகிறது.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்னால் ... சென்று
  rationale: பங்கேற்புவினையின் தொடர்ச்சியான செயலையும், לִפְנֵיהֶם என்பதன் இடம் மற்றும் தலைமைத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יוֹמָם בְּעַמּוּד עָנָן
  choice: பகலில் ... மேகத் தூணில்
  rationale: பகல்–இரவு இணை அமைப்பையும், தேவனுடைய பிரசன்னம் மேகத் தூணில் இருந்த காட்சியையும் காக்கிறது.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: வழியில் அவர்களை வழிநடத்தினார்
  rationale: נחה என்பதன் நடத்துதல்/வழிகாட்டுதல் பொருளையும் הַדֶּרֶךְ என்பதையும் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וְלַיְלָה בְּעַמּוּד אֵשׁ
  choice: இரவில் ... நெருப்புத் தூணில்
  rationale: முந்தைய மேகத் தூண் சொற்றொடருடன் இணையான வடிவத்தையும் மூலத்தின் தெளிவான உருவகத்தையும் பேணுகிறது.
- source_word: לְהָאִיר לָהֶם
  choice: அவர்களுக்கு வெளிச்சம் கொடுப்பதற்காக
  rationale: האיר என்பதன் காரணவினைப் பொருளான ‘ஒளி கொடுத்தல்’ என்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: அவர்கள் இரவும் பகலும் பயணம் செய்ய முடிந்தது
  rationale: இறுதி நோக்கம்/விளைவைக் கருத்துத் தெளிவுடன் தருகிறது; பயணச் சூழலில் הלך என்பதற்கு ‘பயணம் செய்ய’ பொருத்தமானது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தின் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது. அதன் சரியான பண்டைய உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று வடிவத்தை அடிக்குறிப்பு குறிப்பிடுகிறது.
- issue: மேகத் தூண் மற்றும் நெருப்புத் தூணில் இறைச்செயலின் கர்த்தா
  choice: யெகோவாவே இரு தூண்களிலும் முன்னால் சென்றார்
  alternative: தூண்களே தனித்த வழிகாட்டும் கருவிகளாக முன்னால் சென்றன
  rationale: எபிரெய வாக்கியத்தின் எழுவாய் יהוה; இரு בְּ சொற்றொடர்களும் அவர் சென்ற வெளிப்பாட்டு வடிவம் அல்லது ஊடகத்தைக் குறிக்கின்றன. உரை இதன் இயல்பை மேலும் வரையறுக்காததால் அதற்கு அப்பாற்பட்ட விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான நடை. மூலத்தின் பகல்–இரவு இணை அமைப்பும் மேகத் தூண்/நெருப்புத் தூண் உருவகமும் காக்கப்பட்டுள்ளன.
