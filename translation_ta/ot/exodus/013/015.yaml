source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: ta
  text: பார்வோன் எங்களைப் போக அனுமதிக்கப் பிடிவாதமாக மறுத்தபோது, யாவே எகிப்து நாட்டிலிருந்த முதற்பேறான ஒவ்வொருவரையும்—மனிதரின் முதற்பேறுமுதல் கால்நடையின் முதற்பேறுவரை—கொன்றார். ஆகையால், கருப்பையைத் திறக்கும் ஒவ்வொரு ஆணையும் நான் யாவேக்குப் பலியிடுகிறேன்; ஆனால் என் ஒவ்வொரு முதற்பேறான மகனையும் மீட்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְשָׁה ... לְשַׁלְּחֵנוּ
  choice: எங்களைப் போகவிடாமல் பிடிவாதமாக மறுத்தபோது
  rationale: ஹிபில் வடிவம் இச்சூழலில் பார்வோனின் விடாப்பிடியான எதிர்ப்பைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் அதன் வலிமையை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை பொதுப்பட்டமாக மாற்றாமல், எபிரெய மூலத்திலுள்ள உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- source_word: בְּכוֹר
  choice: முதற்பேறானவர் / முதற்பேறானது
  rationale: பிறப்பு வரிசையில் முதலாவதாகப் பிறந்த மனிதரையோ விலங்கையோ குறிக்கும் சொல்லைச் சூழலுக்கேற்ப ஒரே கருத்துடன் வழங்குகிறது.
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: மனிதரின் முதற்பேறுமுதல் கால்நடையின் முதற்பேறுவரை
  rationale: אָדָם இங்கு மனித இனத்தைப் பொதுவாகக் குறித்து בְּהֵמָה உடன் மாறுபடுத்தப்படுகிறது; வேளாண்மை மற்றும் பலியிடல் சூழலில் ‘கால்நடை’ இயல்பானது.
- source_word: זֹבֵחַ
  choice: பலியிடுகிறேன்
  rationale: பலியாக அறுத்துப் படைப்பதைக் குறிக்கும் வழிபாட்டுச் செயலைச் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: פֶּטֶר רֶחֶם הַזְּכָרִים
  choice: கருப்பையைத் திறக்கும் ஆண் குட்டிகள் அனைத்தையும்
  rationale: முதலில் கருப்பையிலிருந்து வெளிவரும் ஆண் சந்ததியைக் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בָּנַי
  choice: என் மகன்களில்
  rationale: எபிரெயச் சொல் குறிப்பாக ஆண் பிள்ளைகளைக் குறிப்பதால் ‘மகன்கள்’ எனத் துல்லியமாக வழங்கப்படுகிறது.
- source_word: אֶפְדֶּה
  choice: மீட்டுக்கொள்கிறேன்
  rationale: மாற்றீடு அல்லது விலை செலுத்துதல் வழியாக விடுவிக்கும் சட்ட-வழிபாட்டு கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுவான பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: אָדָם என்பதன் பொதுமனிதப் பொருள்
  choice: மனிதர்
  alternative: மனிதகுலம்
  rationale: இங்கு தனிப்பட்ட ஆணை அல்ல, விலங்குகளுக்கு எதிராக மனிதர்களை மொத்தமாகக் குறிக்கிறது; ‘மனிதர்’ அந்த வேறுபாட்டை இயல்பாகத் தருகிறது.
- issue: முதற்பேறான விலங்குகளைப் பலியிடுதல் மற்றும் மகன்களை மீட்டல் ஆகியவற்றின் வேறுபாடு
  choice: ‘பலியிடுகிறேன்’ மற்றும் ‘மீட்டுக்கொள்கிறேன்’ எனத் தெளிவாக வேறுபடுத்தப்பட்டது
  alternative: இரண்டையும் பொதுவாக ‘அர்ப்பணிக்கிறேன்’ என வழங்குதல்
  rationale: மூலம் விலங்குகளுக்கான זבח செயலையும் மகன்களுக்கான פדה செயலையும் திட்டவட்டமாக வேறுபடுத்துகிறது; அந்த இறையியல் மற்றும் சட்டரீதியான பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் விதத்தில் கண்ணியமான வேதாகம நடையுடன் அமைக்கப்பட்டது. மூலத்தின் காரண-விளைவு தொடர்பும், மனித முதற்பேறு மற்றும் கால்நடை முதற்பேறு இடையிலான இணைப்பும், பலியிடுதல் மற்றும் மீட்டல் இடையிலான வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
