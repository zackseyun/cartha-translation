  source_fidelity: 'கருத்து மற்றும் அமைப்பு பெரும்பாலும் மூலத்திற்கு உண்மையாக உள்ளன: பார்வோனின் பிடிவாதம், எகிப்தின் மனிதர் மற்றும் கால்நடைகளின் முதற்பேறானோர், ஆண் கருப்பைத் திறப்போரின் பலி, முதற்பேறான மகன்களின் மீட்பு ஆகிய வேறுபாடுகள் பாதுகாக்கப்பட்டுள்ளன. ஆயினும், ‘முதற்பேறான அனைவரையும்’ என்பதற்குப் பதிலாக மனிதர்/விலங்கு இரண்டையும் தெளிவாக உள்ளடக்கும் ‘முதற்பேறான ஒவ்வொருவரையும்’ தேவைப்படுகிறது. ‘மீட்டுக்கொள்கிறேன்’ என்பது மீண்டும் தனக்காக்கிக் கொள்வது என்ற நிழற்பொருளைத் தரக்கூடியதால், பדה-வின் சட்ட-வழிபாட்டுப் பொருளுக்கு ‘மீட்கிறேன்’ நேர்த்தியானது.'
  naturalness: ‘எங்களைப் போகவிடாமல் பிடிவாதமாக மறுத்தபோது’ புரியத்தக்கது; ஆனால் ‘எங்களைப் போக அனுமதிக்கப் பிடிவாதமாக மறுத்தபோது’ நவீன நிலையான தமிழில் இலகுவாகவும் தெளிவாகவும் அமைகிறது. ‘கருப்பையைத் திறக்கும் ஆண் குட்டிகள்’ என்பது மூலத்தின் சொற்சித்திரத்தைத் தருகிறது; ‘ஒவ்வொரு ஆணையும்’ என அமைத்தல், விலங்கு முதல்பேறையே குறித்தாலும், மூலத்தின் பொது சட்டவழக்கை நெருக்கமாகப் பாதுகாக்கிறது.
