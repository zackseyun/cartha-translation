base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: ta
  text: பார்வோன் மக்களைப் போகவிட்டபோது, பெலிஸ்தியர் நாட்டின் வழி அருகில் இருந்தபோதிலும்[a], கடவுள் அவர்களை அந்த வழியாக நடத்தவில்லை. ஏனெனில் கடவுள், “மக்கள் போரைப் பார்க்கும்போது மனம் மாறி[b] எகிப்துக்குத் திரும்பிவிடுவார்களோ” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த வழி அருகில் இருந்ததால்.” இங்குள்ள எபிரெய இணைப்புச் சொல் காரணப் பொருளிலும் புரிந்துகொள்ளப்படலாம்; முதன்மை உரை சூழலுக்கு ஏற்ற விட்டுக்கொடுப்பு பொருளைத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வருந்தி” அல்லது “தங்கள் முடிவை மாற்றி.” இங்குள்ள எபிரெய வினைச்சொல், போரை எதிர்கொள்ளும்போது ஏற்படும் எண்ண அல்லது தீர்மான மாற்றத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: பார்வோன் மக்களைப் போகவிட்டபோது
  rationale: בְּ + infinitive construct காலச் சூழலைக் குறிக்கிறது. இச்சூழலில் שׁלח என்பது மக்களை விடுவித்துப் போகவிடுவதைக் குறிக்கிறது.
- source_word: נָחָם
  choice: நடத்தவில்லை
  rationale: נחה என்பது வழிநடத்துதல் அல்லது கூட்டிச் செல்லுதல். பயணப் பாதையைப் பற்றிய இச்சூழலில் ‘நடத்தவில்லை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் நாட்டின் வழி
  rationale: எபிரெயச் சொற்றொடர் ஒரு மக்கள் குழுவின் நாட்டினூடான வழியைக் குறிப்பிடுகிறது; ‘பெலிஸ்தியா’ என்று மாற்றாமல் ‘பெலிஸ்தியரின் நாடு’ எனும் அமைப்பு பாதுகாக்கப்படுகிறது.
- source_word: כִּי קָרוֹב הוּא
  choice: அருகில் இருந்தபோதிலும்
  rationale: כִּי காரண அல்லது விட்டுக்கொடுப்பு பொருளில் வரலாம். இங்கு குறுகிய/அருகிலுள்ள பாதையாக இருந்தும் கடவுள் அதில் நடத்தவில்லை என்பதே சூழலின் இயல்பான தொடர்பு; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: פֶּן
  choice: திரும்பிவிடக்கூடும்
  rationale: פֶּן எதிர்பார்க்கப்படும் விரும்பத்தகாத விளைவை அறிமுகப்படுத்துகிறது. தமிழில் ‘-க்கூடும்’ என்பது அந்த அச்சம் அல்லது சாத்தியத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִנָּחֵם
  choice: மனம் மாறி
  rationale: נחם என்பதன் நிஃபால் வடிவம் இங்கு போரைக் கண்டு தங்கள் தீர்மானத்தை மாற்றிக்கொள்வதைக் குறிக்கிறது; அறநெறிசார் மனந்திரும்புதலைத் தேவையின்றி புகுத்தவில்லை.
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: மக்கள் போரைப் பார்க்கும்போது
  rationale: בְּ + infinitive construct ‘பார்க்கும்போது’ என்ற காலச் சூழலைக் குறிக்கிறது; מִלְחָמָה என்பதற்கு இங்கு பொதுவான ‘போர்’ பொருந்துகிறது.
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: எகிப்துக்குத் திரும்பிவிடக்கூடும்
  rationale: שׁוב என்பது திரும்புதல்; מִצְרָיְמָה-விலுள்ள திசைச் சுட்டு ‘எகிப்துக்கு’ எனத் தரப்படுகிறது.
- source_word: וַיְהִי
  choice: …போது
  rationale: வசனத்தின் தொடக்கக் கதைத் தொடர்ச்சியைத் தமிழில் தேவையற்ற ‘இப்போது’ அல்லது ‘அப்போது நிகழ்ந்தது’ போன்ற சேர்க்கையின்றி காலத் துணைவாக்கியத்தில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பெலிஸ்தியரின் நாட்டுப் பாதையைத் தவிர்த்ததற்கான இறை காரணம்
  choice: மக்கள் போரைப் பார்த்தால் மனம் மாறி எகிப்துக்குத் திரும்பக்கூடும் என்பதே கடவுள் கூறிய காரணமாக நேரடியாக வழங்கப்படுகிறது.
  alternative: இது உரையாசிரியரின் ஊகம் என்றோ, கடவுள் எதிர்வினையாகத் திட்டத்தை மாற்றினார் என்றோ விளக்குதல்.
  rationale: כִּי אָמַר אֱלֹהִים (‘ஏனெனில் கடவுள் கூறினார்’) காரணத்தை உரையிலேயே கடவுளுடைய கூற்றாக முன்வைக்கிறது. இதற்கு அப்பாற்பட்ட இறையியல் முடிவுகள் சேர்க்கப்படவில்லை.
- issue: יִנָּחֵם என்பதன் பொருள்
  choice: போரைக் கண்டு மக்கள் தங்கள் எண்ணம் அல்லது தீர்மானத்தை மாற்றிக்கொள்வது.
  alternative: அறநெறிசார் மனந்திரும்புதல் அல்லது பாவத்திலிருந்து திரும்புதல்.
  rationale: சூழல் எகிப்துக்குத் திரும்பிச் செல்வதற்கான பயத்தால் உண்டாகும் மனமாற்றத்தைப் பற்றியது; ஆகவே தேவையற்ற சமயவியல் அர்த்தம் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்வோன்,’ ‘பெலிஸ்தியர்,’ ‘எகிப்து’ போன்ற பரவலாக அறியப்பட்ட வேதாகமப் பெயர்வடிவங்கள் வைக்கப்பட்டுள்ளன. எபிரெய உரையின் காரண/விட்டுக்கொடுப்பு ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; ஆங்கில ஆலோசனை உரையில் இடம் தவறியிருந்த அடிக்குறி குறிப்புகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் சரியாக வைக்கப்பட்டுள்ளன.
