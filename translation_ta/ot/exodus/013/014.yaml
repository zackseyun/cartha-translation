source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֣ר מַה זֹּ֑את וְ/אָמַרְתָּ֣ אֵלָ֔י/ו בְּ/חֹ֣זֶק יָ֗ד הוֹצִיאָ֧/נוּ יְהוָ֛ה מִ/מִּצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: ta
  text: பிற்காலத்தில் உன் மகன் உன்னிடம், ‘இது என்ன?’ என்று கேட்டால், நீ அவனிடம், ‘வலிமையான கரத்தால் ஆண்டவர் நம்மை எகிப்திலிருந்து, அடிமைகளின் வீட்டிலிருந்து வெளியே கொண்டுவந்தார்’ என்று சொல்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: பிற்காலத்தில்
  rationale: இங்கு சொல்லின் நேரடிப் பொருள் ‘நாளை’ என்றாலும், வருங்காலத் தலைமுறையில் மகன் கேட்கும் காலத்தைச் சுட்டுவதால் இயல்பான சூழற்பொருளைத் தருகிறது.
- source_word: בְּחֹזֶק יָד
  choice: தமது வலிமைமிக்க கரத்தால்
  rationale: ‘கரத்தின் வலிமையால்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடி, தமிழில் இயல்பாகவும் தேவனுடைய வல்லமையைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரைக் குறிக்கும் இடத்தில், தமிழ் வேதாகம வழக்கில் மரியாதையுடன் பரவலாக அறியப்படும் வடிவம்.
- source_word: מִבֵּית עֲבָדִים
  choice: அடிமைத்தனத்தின் வீட்டிலிருந்து
  rationale: ‘அடிமைகளின் வீடு’ என்றும் புரியக்கூடிய எபிரெய சொற்றொடரின் உருவக வடிவத்தைப் பாதுகாத்து, எகிப்து அடிமைப்படுத்தப்பட்ட இடம் என்பதைக் காட்டுகிறது.
theological_decisions:
- issue: யாத்திராகம நிகழ்வில் பிற்காலத் தலைமுறையின் பங்கேற்பு
  choice: நம்மை ... வெளியே கொண்டுவந்தார்
  alternative: அவர்களை ... வெளியே கொண்டுவந்தார்
  rationale: மூலத்தில் உள்ள முதல் நபர் பன்மை பின்னொட்டைத் தக்கவைத்து, பிற்காலத் தலைமுறையும் உடன்படிக்கைச் சமூகத்தின் விடுதலை வரலாற்றைத் தமக்குரியதாகச் சொல்வதை மாற்றாமல் விடுகிறது.
- issue: தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தெய்வீகப் பெயர் என்பதை மறுக்காமல், சாதாரண தமிழ் வாசகர்களுக்கு பரிச்சயமான பாரம்பரிய பிரதிநிதிப்பைப் பயன்படுத்துகிறது; குறிப்பிட்ட உச்சரிப்பை உரையில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ். எபிரெயத்தின் குடும்பக் கற்பித்தல் அமைப்பும் ‘வலிமைமிக்க கரம்’, ‘அடிமைத்தனத்தின் வீடு’ ஆகிய முக்கிய உருவகங்களும் பாதுகாக்கப்பட்டுள்ளன.
