revisions:
- from: யாவே உன்னைக் கானானியரின் நாட்டிற்குள் கொண்டுவரும்போது[a], அவர் உனக்கும் உன் தந்தையருக்கும்[b] ஆணையிட்டபடியே, அதை உனக்குக் கொடுப்பார்,
