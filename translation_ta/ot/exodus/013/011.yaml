  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: ta
  text: யாவே உன்னைக் கானானியரின் நாட்டிற்குள் கொண்டுவரும்போது[a], அவர் உனக்கும் உன் தந்தையருக்கும்[b] சத்தியமாக வாக்குறுதி அளித்தபடியே, அதை உனக்குக் கொடுப்பார்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “அப்படியாகும் போது.” இங்கு அது எதிர்காலச் சூழலை அறிமுகப்படுத்துகிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது “உன் முன்னோர்களுக்கும்”; எபிரெயத்தில் சொல்லுக்குச் சொல்: “உன் தந்தையருக்கும்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: கொண்டுவரும்போது
  rationale: இந்த எபிரெயச் சொற்றொடர் எதிர்காலத்தில் நிகழவிருக்கும் ஒரு சூழலை அறிமுகப்படுத்துகிறது. சொல்லுக்குச் சொல் அமைப்பைத் திணிக்காமல், அதன் காலப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְבִיאֲךָ
  choice: உன்னைக் ... கொண்டுவரும்போது
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘வரச் செய்’ அல்லது ‘கொண்டுவா’ என்று பொருள்படும். தொடர்ந்து வரும் நாட்டைக் குறிக்கும் சொற்றொடருடன் ‘கொண்டுவரு’ இயல்பாகப் பொருந்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது கடவுளின் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; அதற்குப் பதிலாக ஒரு பட்டப்பெயரை இடவில்லை.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: கானானியரின் நாட்டிற்குள்
  rationale: אֶל இங்கு ஓர் இடத்திற்குள் செல்லும் இயக்கத்தைக் குறிக்கிறது. הַכְּנַעֲנִי என்பது இனப்பெயரின் ஒருமை வடிவில் கூட்டாகப் பயன்படுத்தப்பட்டுள்ளதால், தமிழில் இயல்பாக ‘கானானியர்’ எனத் தரப்பட்டுள்ளது.
- source_word: כַּאֲשֶׁר
  choice: ஆணையிட்டபடியே
  rationale: முன்னர் செய்யப்பட்ட ஆணையுடன் நிகழ்வு ஒத்திருக்கிறது என்ற ஒப்பீட்டுப் பொருளை ‘படியே’ தெளிவாகக் காட்டுகிறது.
- source_word: נִשְׁבַּע
  choice: ஆணையிட்ட
  rationale: שׁבע என்பதன் நிஃபால் வடிவம் ‘ஆணையிடு, சத்தியம் செய்’ என்று பொருள்படும். இந்தச் சூழலில் ‘ஆணையிட்ட’ என்பது கண்ணியமானதும் இயல்பானதும் ஆகும்.
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: உனக்கும் உன் தந்தையருக்கும்
  rationale: மூலத்தில் இரு கூறுகளுடனும் வரும் לְ முன்னிடைச்சொல்லின் உறவு தமிழில் ‘-க்கும் ... -க்கும்’ எனத் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது. אָבוֹת என்பதன் நேரடிப் பொருளான ‘தந்தையர்’ முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- source_word: וּנְתָנָהּ לָךְ
  choice: அதை உனக்குக் கொடுப்பார்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன்வரும் ‘நாடு’ என்பதைக் குறிக்கிறது; தமிழில் அது ‘அதை’ என இயல்பாகக் குறிப்பிடப்படுகிறது. வாக்கியத்தின் எதிர்கால நோக்கை ‘கொடுப்பார்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பட்டப்பெயர் அல்ல, கடவுளின் தனிப்பட்ட பெயரே உள்ளது. ஆகவே அந்தப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: אָבוֹת என்பதன் பரப்பு
  choice: தந்தையர்
  alternative: முன்னோர்
  rationale: எபிரெயச் சொல் நேரடியாக ‘தந்தையர்’ என்று கூறுகிறது; சூழலில் அது முற்பிதாக்கள் அல்லது முன்னோர்களைக் குறிக்கக்கூடும் என்ற பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் வாக்கியத்தின் ஒரு பகுதியாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது; மூலத்தின் எதிர்கால நோக்கும் ஆணையின் வலிமையும் பாதுகாக்கப்பட்டுள்ளன.
