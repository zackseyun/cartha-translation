base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/013.yaml
  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: ta
  text: கழுதையின் ஒவ்வொரு தலையீற்றையும் ஒரு ஆட்டால்[a] மீட்டுக்கொள்ள வேண்டும்; அதை மீட்டுக்கொள்ளாவிட்டால், அதன் கழுத்தை முறிக்க வேண்டும். உன் மகன்களில் உள்ள ஒவ்வொரு தலைப்பிள்ளையையும் மீட்டுக்கொள்ள வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆடு’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், செம்மறியாடு அல்லது வெள்ளாடு ஆகிய சிறுகால்நடைகளில் ஒன்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר חֲמוֹר
  choice: கழுதையின் ஒவ்வொரு தலையீறு
  rationale: פֶּטֶר என்பது சொற்பட கருப்பையை முதலில் திறப்பதைக் குறிக்கிறது; இச்சட்டச் சூழலில் ‘தலையீறு’ இயல்பாகவும் சுருக்கமாகவும் முதல் பிறப்பைக் குறிக்கிறது. חֲמוֹר என்பதற்கு ‘கழுதை’.
- source_word: תִּפְדֶּה
  choice: மீட்டுக்கொள்ள வேண்டும்
  rationale: פדה என்பது பதிலீடு அல்லது விலை செலுத்துவதன் மூலம் மீட்பதைக் குறிக்கிறது. ‘மீட்டுக்கொள்ள வேண்டும்’ என்பது சட்டக் கட்டளையின் வலிமையையும் மீட்பின் கருத்தையும் தெளிவாகக் கொண்டுவருகிறது.
- source_word: בְשֶׂה
  choice: ஒரு செம்மறியாட்டுக் குட்டியால்
  rationale: שֶׂה என்பது செம்மறியாடு அல்லது வெள்ளாடு ஆகிய சிறுகால்நடைகளில் ஒன்றைக் குறிக்கக்கூடிய பரந்த சொல். பலிச் சூழலில் ‘செம்மறியாட்டுக் குட்டி’ இயல்பான மொழிபெயர்ப்பு; எபிரெயச் சொல்லின் பரந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַעֲרַפְתּוֹ
  choice: அதன் கழுத்தை முறிக்க வேண்டும்
  rationale: ערף என்பது வழக்கமான அறுப்பை அல்ல, கழுத்தின் பின்புறத்தை முறிப்பதைக் குறிக்கிறது; தமிழில் இச்செயலைத் தெளிவாகச் சொல்லும் இயல்பான வடிவம் இது.
- source_word: בְּכוֹר אָדָם
  choice: மனிதரின் ஒவ்வொரு தலையீறு
  rationale: אָדָם இங்கு விலங்கிற்கு எதிராக மனித இனத்தைச் சுட்டுகிறது; வயதுவந்த ஆணை மட்டும் குறிக்கவில்லை. ‘மனிதரின்’ என்பது அந்த இனவகை வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: בְּבָנֶיךָ
  choice: உன் மகன்களில்
  rationale: எபிரெய உரை பாலினப் பொதுமைப்படுத்தல் இல்லாமல் ‘உன் மகன்கள்’ என்று குறிப்பாகச் சொல்கிறது; ஆகவே அதே துல்லியம் தமிழிலும் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אָדָם என்பதன் பொருள்
  choice: விலங்கிற்கு எதிராக மனித இனத்தைக் குறிக்கும் ‘மனிதர்’
  alternative: ‘மனிதகுலம்’ அல்லது வயதுவந்த ஆணைக் குறிக்கும் ‘ஆண்’
  rationale: இப்பகுதி கழுதையின் தலையீற்றையும் மனிதத் தலையீற்றையும் வேறுபடுத்துகிறது. எனவே אָדָם மனித இனத்தைக் குறிக்கிறது; ஆனால் בְּבָנֶיךָ என்பது ‘உன் மகன்களில்’ என்று ஆண் பிள்ளைகளைத் தெளிவாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சட்டக் கட்டளைக்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘தலையீறு’ என்பது இச்சூழலில் முதலில் பிறந்த குட்டி அல்லது மகனை இயல்பாகக் குறிக்கிறது. அடிக்குறிப்பு குறியீடு முழு வசனத்தின் முடிவில் வைக்கப்பட்டாலும், அது குறிப்பாக ‘செம்மறியாட்டுக் குட்டி’ என்ற சொல்லை விளக்குகிறது.
