revisions:
- from: கழுதையின் ஒவ்வொரு தலையீற்றையும் ஒரு செம்மறியாட்டுக் குட்டியால் மீட்டுக்கொள்ள வேண்டும்; அதை மீட்டுக்கொள்ளாவிட்டால், அதன் கழுத்தை முறிக்க வேண்டும். உன் மகன்களில் மனிதரின் ஒவ்வொரு தலையீற்றையும் மீட்டுக்கொள்ள வேண்டும்.[a]
  to: கழுதையின் ஒவ்வொரு தலையீற்றையும் ஒரு ஆட்டால்[a] மீட்டுக்கொள்ள வேண்டும்; அதை மீட்டுக்கொள்ளாவிட்டால், அதன் கழுத்தை முறிக்க வேண்டும். உன் மகன்களில் உள்ள ஒவ்வொரு தலைப்பிள்ளையையும் மீட்டுக்கொள்ள வேண்டும்.
  rationale: The revision broadens the rendering of שֶׂה so that it does not specify a lamb or exclude a goat, improves the natural Tamil expression for the human firstborn among the addressee’s sons, and moves the note marker to its proper lexical anchor. The legal force and the difficult historical action of neck-breaking are retained without expansion.
