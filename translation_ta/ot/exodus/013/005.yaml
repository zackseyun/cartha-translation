revisions:
- from: யாவே உன்னைக் கானானியர், ஏத்தியர், எமோரியர், ஏவியர், எபூசியர் ஆகியோர் வாழும் நாட்டிற்குக் கொண்டுவரும்போது—உனக்குக் கொடுப்பதாக அவர் உன் முன்னோர்களுக்கு ஆணையிட்ட அந்தப் பாலும் தேனும் பெருக்கெடுத்து ஓடும் நாட்டிற்குக் கொண்டுவரும்போது—இந்த மாதத்தில் இந்த வழிபாட்டுச் செயலை[a] நீ நிறைவேற்ற வேண்டும்.
