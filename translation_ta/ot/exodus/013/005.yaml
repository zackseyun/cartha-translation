  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: ta
  text: யாவே உன்னை கானானியர், ஏத்தியர், எமோரியர், ஏவியர், எபூசியர் ஆகியோரின் நாட்டிற்குக் கொண்டுவரும்போது—அது உனக்குக் கொடுப்பதாக அவர் உன் முன்னோர்களுக்குச் சத்தியம் செய்த, பாலும் தேனும் பொழியும் நாடு—இந்த மாதத்தில் இந்த வழிபாட்டுச் செயலை[a] நீ நிறைவேற்ற வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த வழிபாட்டு முறையை” அல்லது “இந்த அனுசரிப்பை.” எபிரேயச் சொல் கட்டளையிடப்பட்ட வழிபாட்டுச் செயல் அல்லது சேவையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: கொண்டுவரும்போது
  rationale: எதிர்காலத்தில் நிகழவிருக்கும் சூழலை அறிமுகப்படுத்தும் எபிரேயத் தொடரின் காலப்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְבִיאֲךָ
  choice: உன்னைக் ... கொண்டுவரும்போது
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘உள்ளே கொண்டுவருதல்’ என்ற பொருளுடையது; இலக்கிடமான நாட்டுடன் தமிழில் ‘கொண்டுவருதல்’ இயல்பாக அமைகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பால் தருகிறது.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: கானானியர், ஏத்தியர், எமோரியர், ஏவியர், எபூசியர் ஆகியோர் வாழும் நாட்டிற்கு
  rationale: எபிரேயத்தில் ஒருமை இனப்பெயர்கள் தொடராக வந்தாலும், அவை குறிக்கும் மக்களினங்களை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் பன்மையில் தருகிறது; ‘வாழும்’ என்பது நாட்டுக்கும் மக்களுக்கும் உள்ள உறவைத் தெளிவாக்கும் குறைந்தபட்ச உள்ளடக்கச் சேர்ப்பு.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: உனக்குக் கொடுப்பதாக அவர் உன் முன்னோர்களுக்கு ஆணையிட்ட
  rationale: வாக்குறுதியை உறுதிப்படுத்தும் சத்தியத்தின் வலிமையை ‘ஆணையிட்ட’ என்பதால் வெளிப்படுத்தி, நிலத்தைச் சுட்டும் தொடர்புத் தொடரைத் தக்கவைக்கிறது.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: பாலும் தேனும் பெருக்கெடுத்து ஓடும் நாடு
  rationale: நிலத்தின் செழிப்பைக் குறிக்கும் எபிரேய உருவகத்தைத் தமிழில் உயிரோட்டத்துடன் தக்கவைக்கிறது.
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: இந்த வழிபாட்டுச் செயலை நீ நிறைவேற்ற வேண்டும்
  rationale: עבד/עֲבֹדָה என்பவற்றின் பணி, சேவை, வழிபாட்டு அனுசரிப்பு ஆகிய நுணுக்கங்களில், இச்சூழலில் கட்டளையிடப்பட்ட வழிபாட்டுச் செயலைச் செய்துமுடிப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: இந்த மாதத்தில்
  rationale: குறிப்பிட்ட மாதத்துக்குள் இந்த அனுசரிப்பு நடைபெற வேண்டும் என்ற நேரப் பொருளை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: עֲבֹדָה என்பதன் வழிபாட்டுச் சூழல்
  choice: வழிபாட்டுச் செயல்
  alternative: சேவை; சடங்கு; அனுசரிப்பு
  rationale: இச்சொல் கட்டளையிடப்பட்ட வழிபாட்டுப் பணியையோ அனுசரிப்பையையோ குறிக்கலாம். ‘வழிபாட்டுச் செயல்’ கடமையையும் வழிபாட்டுச் சூழலையும் காட்டுகிறது; குறிப்பிட்ட சடங்கு வடிவத்தைத் தேவையின்றி நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை இரண்டாம் நபரைத் தொடர்ந்து பயன்படுத்தி, மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பின்பற்றப்பட்டுள்ளது. நீண்ட எபிரேய வாக்கியத்தின் தொடர்பைத் தெளிவாக்க இடைக்கோடுகளுக்குள் வினைத்தொடர் மீண்டும் கூறப்பட்டுள்ளது; மூலத்தின் பொருள் உறவுகள் பாதுகாக்கப்பட்டுள்ளன.
