source:
  edition: WLC
  text: קַדֶּשׁ לִ֨/י כָל בְּכ֜וֹר פֶּ֤טֶר כָּל רֶ֨חֶם֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה לִ֖/י הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/002.yaml
  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: ta
  text: “இஸ்ரவேல் மக்களிடையே மனிதரிலும் கால்நடைகளிலும் கருப்பையை முதலில் திறக்கும் ஒவ்வொரு முதற்பேற்றையும் எனக்கென்று பரிசுத்தமாகப் பிரித்துவை; அது எனக்குரியது.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: பரிசுத்தமாகப் பிரித்துவை
  rationale: தேவனுக்கெனப் பரிசுத்தமானதாக ஒதுக்கிவைக்கும் கட்டளையைக் குறிக்கும்; வழிபாட்டுச் சார்ந்த வலிமையையும் இயல்பான நவீனத் தமிழையும் காக்கிறது.
- source_word: לִי
  choice: எனக்கென்று
  rationale: தேவனுக்கான அர்ப்பணிப்பையும் தனிப்பட்ட உரிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָל בְּכוֹר
  choice: ஒவ்வொரு முதற்பேற்றையும்
  rationale: எபிரெயத்தில் ‘ஆண்’ என்று வெளிப்படையாக இல்லை; ஆகவே அதைச் சேர்க்காமல் ‘முதற்பேறு’ என்ற பொருள் காக்கப்படுகிறது.
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: கருப்பையை முதலில் திறக்கும்
  rationale: முதற்பேறு என்பதைக் கருப்பையிலிருந்து முதலில் பிறப்பது என விளக்கும் எபிரெயப் பதத்தின் உடற்கூறு உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களிடையே
  rationale: சொல்லுக்கு நெருக்கமான ‘இஸ்ரவேலின் மகன்கள்’ தமிழில் இங்கு தேவையற்ற ஆண்-வரம்பை உணர்த்தலாம்; கூட்டாகிய இஸ்ரவேல் சமூகத்தை ‘இஸ்ரவேல் மக்கள்’ இயல்பாகக் குறிக்கிறது.
- source_word: בָּאָדָם
  choice: மனிதரிலும்
  rationale: אָדָם இங்கு விலங்கினத்துக்கு எதிராக மனித இனத்தைத் தொகுப்பொருளில் குறிக்கிறது; ‘மனிதர்’ அந்த வேறுபாட்டைத் தெளிவாகக் காக்கிறது.
- source_word: וּבַבְּהֵמָה
  choice: கால்நடைகளிலும்
  rationale: சட்ட மற்றும் குடும்பச் சொத்து சூழலில் בְּהֵמָה வளர்ப்பு விலங்குகளை, குறிப்பாக கால்நடைகளை, இயல்பாகக் குறிக்கிறது.
- source_word: לִי הוּא
  choice: அது எனக்குரியது
  rationale: இறுதிக் கூற்றிலுள்ள தேவனுடைய உரிமையைச் சுருக்கமாகவும் வலியுறுத்தலுடனும் தெரிவிக்கிறது.
theological_decisions:
- issue: אָדָם மற்றும் בְּהֵמָה ஆகிய தொகுப்பொருள் ஒருமைகளின் வேறுபாடு
  choice: மனிதரிலும் கால்நடைகளிலும்
  alternative: மனித இனத்திலும் விலங்கினத்திலும்
  rationale: இங்கு אָדָם ஓர் ஆணை மட்டும் அல்லாமல் மனித வகையைத் தொகுப்பொருளில் குறிக்கிறது. தமிழில் ‘மனிதர்’ அந்தப் பரப்பை இயல்பாகத் தருகிறது; בְּהֵמָה சூழலுக்கேற்றவாறு ‘கால்நடைகள்’ என மொழிபெயர்க்கப்படுகிறது.
- issue: முதற்பேற்றின் பாலினம்
  choice: ஆண் என்பதைச் சேர்க்காமல் ‘ஒவ்வொரு முதற்பேறு’
  alternative: ஒவ்வொரு ஆண் முதற்பேறு
  rationale: உடனடி எபிரெய வாசகத்தில் ‘ஆண்’ என்ற சொல் இல்லை. பிந்தைய சட்ட விளக்கத்தின் அடிப்படையில் அதை இங்கு வெளிப்படையாகச் சேர்ப்பது மூலத்தின் கூறாமையைத் தீர்த்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வேதாகமத் தொனியும் காக்கப்பட்டுள்ளன. ‘பரிசுத்தமாகப் பிரித்துவை’ வழிபாட்டுச் சார்ந்த קדשׁ என்பதன் பொருளைத் தெளிவாக்குகிறது. வசனத்தில் அடிக்குறிப்பு குறியீடுகள் தேவையில்லை.
