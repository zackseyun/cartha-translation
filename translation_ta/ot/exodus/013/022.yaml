base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/022.yaml
  text: The pillar of cloud by day and the pillar of fire by night did not depart from before the people[a].
translation:
  language: ta
  text: பகலில் மேகத்தூணும் இரவில் நெருப்புத்தூணும் மக்களுக்கு முன்னாலிருந்து விலகவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களுக்கு முன்னாலிருந்து அகன்றுபோகவில்லை.” வழிகாட்டிய தூண்கள் தொடர்ந்து அங்கே இருந்ததை எபிரெய வினை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִישׁ
  choice: விலகவில்லை
  rationale: מוּשׁ என்ற வினை அகலுதல் அல்லது இருந்த இடத்திலிருந்து விலகுதல் என்பதைக் குறிக்கிறது. வழிகாட்டிய தூண்கள் மக்களுக்கு முன்னால் தொடர்ந்து இருந்தன என்ற கருத்தை இயல்பான தமிழில் இது காக்கிறது.
- source_word: עַמּוּד
  choice: தூண்
  rationale: செங்குத்தான தூண் போன்ற வெளிப்பாட்டைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ் சொல்.
- source_word: הֶעָנָן
  choice: மேகம்
  rationale: עָנָן என்பதன் நேரடியான பொருள்; கூட்டுச்சொல்லில் ‘மேகத்தூண்’ என இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: יוֹמָם
  choice: பகலில்
  rationale: காலத்தைக் குறிக்கும் வினையடைப் பயன்பாடு; ‘இரவில்’ என்பதோடு இயல்பான இணை அமைப்பை உருவாக்குகிறது.
- source_word: וְעַמּוּד הָאֵשׁ
  choice: நெருப்புத்தூணும்
  rationale: மேகத்தூணுடன் உள்ள எபிரெய இணை அமைப்பையும் நெருப்பின் தெளிவான உருவகத்தையும் காக்கிறது.
- source_word: לָיְלָה
  choice: இரவில்
  rationale: இரவுக் காலத்தைக் குறிக்கும் இயல்பான தமிழ் வடிவம்; ‘பகலில்’ என்பதுடன் சமநிலை கொண்டுள்ளது.
- source_word: לִפְנֵי
  choice: மக்களுக்கு முன்னாலிருந்து
  rationale: விலகுதல் என்ற வினையுடன் சேர்ந்து, மக்கள் முன்பாக இருந்த இடத்திலிருந்து அகலவில்லை என்ற இடவியல் உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: இஸ்ரவேல் மக்களை ஒரே சமூகமாகக் குறிக்கும் எபிரெயக் கூட்டு ஒருமைக்கான இயல்பான தமிழ் இணை.
