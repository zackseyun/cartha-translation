  text: וְ/הָיָ֤ה לְ/אוֹת֙ עַל יָ֣דְ/כָ֔ה וּ/לְ/טוֹטָפֹ֖ת בֵּ֣ין עֵינֶ֑י/ךָ כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִיאָ֥/נוּ יְהוָ֖ה מִ/מִּצְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: ta
  text: அது உன் கையின்மேல் ஓர் அடையாளமாகவும், உன் கண்களுக்கு நடுவே நெற்றிப்பட்டைகளாகவும்[b][a] இருக்கும்; ஏனெனில், யாவே தமது வலிமையான கையால் நம்மை எகிப்திலிருந்து வெளியே கொண்டுவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பட்டைகள்’; மரபாக, ‘பிலாக்டரிகள்’ எனப்படுகிறது. இங்கே வரும் எபிரெயச் சொல் அரிதானது; நினைவூட்டுவதற்காக நெற்றியில் அணியப்பட்ட ஏதோ ஒன்றை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘உன் கண்களுக்கு நடுவே’; இந்தச் சொற்றொடர் பொதுவாக ‘உன் நெற்றியில்’ என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: அது ... இருக்கும்
  rationale: இங்கு இணைப்புடன் வரும் வினைமுற்று, இந்த நிகழ்வின் தொடர்ந்த நினைவூட்டும் பயனை எதிர்கால/விளைவு பொருளில் தெரிவிக்கிறது.
- source_word: לְאוֹת
  choice: ஓர் அடையாளமாக
  rationale: אוֹת என்பது பொதுவாக அடையாளம் அல்லது நினைவுக்குறியைக் குறிக்கிறது; ‘அடையாளம்’ இயல்பானதும் பரந்ததுமான தமிழ் சொல்.
- source_word: עַל יָדְכָה
  choice: உன் கையின்மேல்
  rationale: எபிரெய மூலத்தில் ‘கை’ என்றே உள்ளது; ‘முன்கை’ என்று விளக்கமாக மாற்றாமல் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וּלְטוֹטָפֹת
  choice: நெற்றிப்பட்டைகளாக
  rationale: טוֹטָפֹת அரிதான சொல்; நெற்றிப் பகுதியில் அணியப்படும் நினைவூட்டும் பொருளைச் சுட்டுவதாகத் தெரிகிறது. ‘நெற்றிப்பட்டைகள்’ பிற்காலச் சடங்கு சார்ந்த குறிப்பிட்ட சொல்லைத் திணிக்காமல் சாத்தியமான பொருளைத் தருகிறது.
- source_word: בֵּין עֵינֶיךָ
  choice: உன் கண்களுக்கு நடுவே
  rationale: எபிரெய உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; ‘உன் நெற்றியில்’ என்பது அதன் வழக்குப் பொருளாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன் கூறப்பட்ட அடையாளத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: בְּחֹזֶק יָד
  choice: தமது வலிமையான கையால்
  rationale: வல்லமையுள்ள தெய்வீகச் செயலைக் குறிக்கும் எபிரெய சொற்றொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது. தமிழில் உரிய மரியாதை ஒருமைக்காக ‘தமது’ சேர்க்கப்பட்டுள்ளது.
- source_word: הוֹצִיאָנוּ
  choice: நம்மை ... வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல்/வெளியே கொண்டுவருதல்’ என்று பொருள்படும்; யாத்திராகமச் சூழலில் இது தெளிவான மொழிபெயர்ப்பு.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக அளிக்கிறது.
- source_word: מִמִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: ‘வெளியே கொண்டுவந்தார்’ என்பதுடன் இயல்பாக இணைந்து மூலத்தின் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கை/கண்கள் பற்றிய மொழியை நேரடியாக மொழிபெயர்ப்பதா அல்லது பிற்காலச் சடங்குப் பொருளாக விளக்குவதா
  choice: முதன்மை உரையில் ‘உன் கையின்மேல்’ மற்றும் ‘உன் கண்களுக்கு நடுவே நெற்றிப்பட்டைகளாக’ என்ற உருவகமிக்க மொழியைப் பாதுகாத்தல்
  alternative: முதன்மை உரையிலேயே பிற்கால ‘பிலாக்டரிகள்’ எனக் குறிப்பாக்குதல், அல்லது முற்றிலும் உருவகமான நினைவூட்டல் என மொழிபெயர்த்தல்
  rationale: எபிரெய உரை பிற்காலச் சடங்கு நடைமுறையை வெளிப்படையாகப் பெயரிடவில்லை. நேரடி உருவகத்தைப் பாதுகாப்பது கட்டளை சொல்லாட்சியளவில் உடல்சார்ந்ததா, அடையாளம்சார்ந்ததா, அல்லது இரண்டுமா என்ற தெளிவின்மையைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ஒருமை இரண்டாம் நபர் வடிவங்கள் மூலத்துக்கு ஏற்ப வைக்கப்பட்டுள்ளன; யாவே குறித்த வினை மற்றும் சுட்டுப்பெயரில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. அடிக்குறி குறிகள் ஆங்கில ஆலோசனை உரையின் வரிசைப்படி [b][a] என முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளன.
