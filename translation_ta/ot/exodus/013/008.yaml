source:
  edition: WLC
  text: וְ/הִגַּדְתָּ֣ לְ/בִנְ/ךָ֔ בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר בַּ/עֲב֣וּר זֶ֗ה עָשָׂ֤ה יְהוָה֙ לִ֔/י בְּ/צֵאתִ֖/י מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: ta
  text: அந்நாளில் நீ உன் மகனிடம், “நான் எகிப்திலிருந்து வெளியேறியபோது, இதன் காரணமாகவே யாவே எனக்காகச் செயல்பட்டார்” என்று சொல்ல வேண்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் எகிப்திலிருந்து வெளியேறியபோது யாவே இதை எனக்காகச் செய்தார்.” எபிரெயத்தில் ‘இது’ என்பது அனுசரிப்பிற்கான காரணத்தோடு இணைந்ததாகவோ, யாவே செய்ததைக் குறிக்கும் சொல்லாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: நீ ... சொல்ல வேண்டும்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘சொல், அறிவி, தெரியப்படுத்து’ என்று பொருள்படும். பெற்றோர் மகனிடம் கூறும் கட்டளையாக, நவீனத் தமிழில் ‘சொல்ல வேண்டும்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְבִנְךָ
  choice: உன் மகனிடம்
  rationale: לְ மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது. בֵּן ஒருமை ஆண்பால் என்பதால் ‘மகன்’ என்று துல்லியமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்நாளில்
  rationale: குறிப்பிட்ட அந்த நாளைக் குறிக்கும் வழக்கமான காலச்சொற்றொடர்; ‘அந்நாளில்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: לֵאמֹר
  choice: என்று சொல்ல வேண்டும்
  rationale: தொடர்ந்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வினையெச்ச அமைப்பு தமிழில் மேற்கோளுக்குப் பின் வரும் ‘என்று சொல்ல வேண்டும்’ என்ற இயல்பான அமைப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בַּעֲבוּר זֶה
  choice: இதன் காரணமாகவே
  rationale: இச்சொற்றொடர் காரணம் அல்லது அடிப்படையைக் குறிக்கலாம். வலியுறுத்தலைக் காக்க ‘இதன் காரணமாகவே’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; ‘இது’ எதனுடன் இலக்கணரீதியாக இணைகிறது என்பதில் உள்ள தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עָשָׂה יְהוָה לִי
  choice: யாவே எனக்காகச் செயல்பட்டார்
  rationale: עָשָׂה என்பது ‘செய், உருவாக்கு, செயல்படு’ என விரிந்த பொருளுடையது; இங்கு வெளிப்படையான செயப்படுபொருள் இல்லை. ஆகவே ஒன்றை ஊகித்துச் சேர்க்காமல், யாவே பேச்சாளருக்காகத் தலையிட்டார் என்ற கருத்தை ‘எனக்காகச் செயல்பட்டார்’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைபெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; ஒரு பட்டப்பெயரால் மாற்றப்படவில்லை.
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: நான் எகிப்திலிருந்து வெளியேறியபோது
  rationale: בְּ முன்னொட்டுடன் கூடிய வினையெச்சம் காலச் சூழலைக் குறிக்கிறது. முதலாம் நபர் ஒருமையைப் பேணி, இயல்பான தமிழில் ‘வெளியேறியபோது’ என்று வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கெழுத்து இறைபெயரை நேரடியாகப் பயன்படுத்துகிறது. தனிப்பட்ட இறைபெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வடிவத்தையும் உடன்படிக்கைச் சூழலையும் காக்கிறது.
- issue: בֵּן என்ற உறவுமுறைச் சொல்லின் பாலினம்
  choice: உன் மகன்
  alternative: உன் பிள்ளை
  rationale: எபிரெயச் சொல் ஒருமை ஆண்பாலில் இருப்பதால் ‘மகன்’ என்று வழங்கப்பட்டுள்ளது; சூழல் பாலினப் பொதுமைப்படுத்தலைக் கட்டாயப்படுத்தவில்லை.
- issue: בַּעֲבוּר זֶה עָשָׂה என்பதன் தொடரியல் தெளிவின்மை
  choice: இதன் காரணமாகவே யாவே எனக்காகச் செயல்பட்டார்
  alternative: யாவே இதை எனக்காகச் செய்தார்
  rationale: ‘இது’ அனுசரிப்பின் காரணம் அல்லது நோக்கத்துடன் இணைக்கப்படலாம்; மாற்றாக, யாவே செய்ததின் பொருளாகப் புரிந்துகொள்ளலாம். முதன்மை உரை காரணப் பொருளைத் தேர்ந்தெடுக்கிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான கட்டளை நடையும் நேரடிக் கூற்று அமைப்பும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் முதலாம் நபர் அனுபவமும் ஒருமை ஆண்பால் உறவுமுறைச் சொல்லும் பாதுகாக்கப்பட்டுள்ளன.
