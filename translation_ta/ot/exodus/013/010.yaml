  text: You shall keep this statute at its appointed time from year to year[a].
translation:
  language: ta
  text: இந்த நியமத்தை அதற்குக் குறிக்கப்பட்ட காலத்தில் ஆண்டுதோறும் நீ கடைப்பிடிக்க வேண்டும்[a].
  philosophy: optimal-equivalence
