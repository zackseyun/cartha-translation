lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: நீ கடைப்பிடிக்க வேண்டும்
  rationale: שׁמר என்பது சட்டம் அல்லது வழிபாட்டு அனுசரிப்பைப் பற்றிய சூழலில் தொடர்ந்து கவனமாக அனுசரிப்பதைக் குறிக்கிறது. ‘கடைப்பிடிக்க வேண்டும்’ என்பது கட்டளையின் வலிமையையும் தொடர்ச்சியையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַחֻקָּה הַזֹּאת
  choice: இந்த நியமத்தை
  rationale: חֻקָּה என்பது நிலையாக விதிக்கப்பட்ட ஒழுங்கு அல்லது சட்ட நியமத்தைக் குறிக்கிறது. ‘நியமம்’ என்பது உடன்படிக்கைச் சட்டத்தின் முறையான தன்மையைத் தக்கவைத்துக்கொள்ளும் தெளிவான தமிழ்ச் சொல்.
- source_word: לְמוֹעֲדָהּ
  choice: அதற்குக் குறிக்கப்பட்ட காலத்தில்
  rationale: מוֹעֵד என்பது நியமிக்கப்பட்ட நேரம் அல்லது குறிப்பிட்ட தருணத்தைக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு இந்த அனுசரிப்புக்குரிய காலத்தைச் சுட்டுகிறது. இத்தொடர் அந்தக் கால அட்டவணைச் சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִיָּמִים יָמִימָה
  choice: ஆண்டுதோறும்
  rationale: சொல்லுக்கு சொல் ‘நாட்களிலிருந்து நாட்களுக்கு’ என்றாலும், ஆண்டு விழாவைப் பற்றிய இச்சூழலில் இது ஒவ்வோர் ஆண்டும் நிகழ்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர். வாசிக்க இயல்பான பொருள் முதன்மை உரையில் தரப்பட்டு, மூல வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
