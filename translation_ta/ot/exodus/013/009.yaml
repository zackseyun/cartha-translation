base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: ta
  text: இது உனக்குக் உன் கையின்மேல் ஓர் அடையாளமாகவும், உன் கண்களுக்கு இடையே[a] ஒரு நினைவுக்குறியாகவும் இருக்கும்; யாவேயின் சட்டம்[b] உன் வாயில் இருக்கும்படியாக. ஏனெனில், பலத்த கையால் யாவே உன்னை எகிப்திலிருந்து வெளியே கொண்டுவந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உன் கண்களுக்கு இடையே” என்பது “உன் நெற்றியில்” என்ற சொல்லாட்சிப் பொருளிலும் புரிந்துகொள்ளப்படலாம்; முதன்மை உரை எபிரெயச் சொற்றொடரை நேரடியாகத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவேயின் போதனை.” எபிரெயத்தில் தோரா என்னும் சொல் சூழலுக்கேற்ப “சட்டம்” அல்லது “போதனை” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: இருக்க வேண்டும் / அமையும்
  rationale: இணைப்புடன் வரும் Qal perfect இச்சூழலில் எதிர்நோக்கிய செயல்பாட்டைக் குறிக்கிறது. முதல் தொடரில் ‘இருக்க வேண்டும்’ என்பது அறிவுறுத்தலின் வலிமையையும், நோக்கத் தொடரில் ‘அமையும்’ என்பது இயல்பான தமிழ்நடையையும் தருகிறது.
- source_word: לְאוֹת
  choice: ஓர் அடையாளமாக
  rationale: אוֹת என்பது அடையாளம், குறி, சான்று ஆகிய பொருள்களைத் தரலாம். உடல்சார்ந்த குறியாக மட்டுமே பொருளைச் சுருக்காமல் இருக்க ‘அடையாளம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל יָדְךָ
  choice: உன் கையின்மேல்
  rationale: יָד என்பதன் நேரடிப் பொருளான ‘கை’ தக்கவைக்கப்பட்டது; பிற்கால சடங்கு நடைமுறையை மொழிபெயர்ப்பிலேயே புகுத்தவில்லை.
- source_word: וּלְזִכָּרוֹן
  choice: ஒரு நினைவுச்சின்னமாக
  rationale: זִכָּרוֹן நினைவூட்டும் அடையாளத்தையும் நினைவுகூருதலையும் குறிக்கிறது. ‘நினைவுச்சின்னம்’ அதன் பெயர்ச்சொல் வடிவத்தையும் நினைவுகூரும் நிறையையும் காக்கிறது.
- source_word: בֵּין עֵינֶיךָ
  choice: உன் கண்களுக்கு நடுவே
  rationale: எபிரெயச் சொற்றொடரின் நேரடி உருவகம் காக்கப்பட்டது. ‘நெற்றியில்’ என்பது சாத்தியமான இயல்புமொழிப் பொருளாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמַעַן
  choice: இருக்கும்படி
  rationale: இச்சொல் நோக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் நோக்க உறவை இயல்பாக வெளிப்படுத்த ‘இருக்கும்படி’ பயன்படுத்தப்பட்டது.
- source_word: תּוֹרַת יְהוָה
  choice: யாவேயின் சட்டம்
  rationale: תּוֹרָה இங்கு உடன்படிக்கைச் சூழலில் ‘சட்டம்’ எனப் பொருந்துகிறது; அதற்குள்ள விரிவான ‘போதனை/அறிவுரை’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּפִיךָ
  choice: உன் வாயில்
  rationale: வாய்மொழியாக உரைத்தல் அல்லது எப்போதும் சொல்லத் தயாராக வைத்திருத்தல் என்ற உருவகத்தைத் தீர்மானித்து விளக்காமல், மூலத்தின் நேரடி மொழி காக்கப்பட்டது.
- source_word: בְּיָד חֲזָקָה
  choice: பலத்த கையால்
  rationale: யாவேயின் வல்லமையான விடுதலைச் செயலைக் குறிக்கும் யாத்திராகமச் சொற்றொடர். חֲזָקָה என்பதற்கு நெருக்கமான ‘பலத்த’ என்றும், יָד என்பதற்கு ‘கை’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: הוֹצִאֲךָ
  choice: உன்னை வெளியே கொண்டுவந்தார்
  rationale: Hiphil வடிவத்தின் ‘வெளியே வரச் செய்தல்/வெளியே கொண்டுவருதல்’ என்ற காரணவினைப் பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நான்கெழுத்து இறைப்பெயரின் வழக்கமான தமிழொலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: கை மற்றும் கண்களுக்கு நடுவே என்ற மொழி நேரடியான சடங்குப் பொருள்களைக் குறிக்கிறதா அல்லது உருவகமா
  choice: ‘உன் கையின்மேல்’ மற்றும் ‘உன் கண்களுக்கு நடுவே’ என்ற மூல உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘உன் புயத்தில் கட்டி, உன் நெற்றியில் அணிந்து’ என்று பிற்கால தெபிலீன் நடைமுறையை வெளிப்படையாகக் குறிப்பிடுதல்; அல்லது உள்ளார்ந்த நினைவாக மட்டும் பொருளுரைத்தல்
  rationale: மூல எபிரெயம் தெளிவாக எந்தப் பிற்கால சடங்குப் பொருளையும் பெயரிடவில்லை. நேரடி உருவகத்தைத் தக்கவைப்பது உடல்சார்ந்த மற்றும் உருவக வாசிப்புகள் இரண்டிற்கும் இடமளிக்கிறது.
- issue: תּוֹרָה என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘சட்டம்’
  alternative: ‘போதனை’, ‘அறிவுரை’, அல்லது ‘தோரா’
  rationale: உடன்படிக்கைச் சூழலில் ‘சட்டம்’ பொருத்தமானது; இருப்பினும் எபிரெயச் சொல்லின் பொருள் சட்ட விதிகளை விட விரிவானதாக இருக்கக்கூடும் என்பதால் ‘போதனை’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை முன்னிலைப் பெயர்களைத் தொடர்ந்து பயன்படுத்தி, மூலத்தின் நினைவுச்சின்ன உருவகத்தையும் இறையியல் திறந்தநிலையையும் காக்கும் கண்ணியமான நடை. ‘யாவே’ தனிப்பட்ட இறைப்பெயராகப் பயன்படுத்தப்பட்டது; தேவையற்ற சமயப் பிரிவுச் சொற்கள் தவிர்க்கப்பட்டன.
