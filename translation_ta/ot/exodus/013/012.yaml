source:
  edition: WLC
  text: וְ/הַעֲבַרְתָּ֥ כָל פֶּֽטֶר רֶ֖חֶם לַֽ/יהֹוָ֑ה וְ/כָל פֶּ֣טֶר שֶׁ֣גֶר בְּהֵמָ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ הַ/זְּכָרִ֖ים לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/012.yaml
  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: ta
  text: கருப்பையைத் திறக்கும் ஒவ்வொன்றையும்[a] யாவேக்கென்று ஒதுக்கிவைப்பாய். உனக்கிருக்கும் கால்நடைகளின் முதற்பிறந்த குட்டிகளில்[b] ஆணானவை யாவேக்குரியவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பட, ‘கருப்பையைத் திறக்கும் ஒவ்வொன்றும்’; இது கருப்பையிலிருந்து முதலில் பிறப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொற்றொடர் கால்நடையின் முதல் ஈற்றை, அதாவது முதலில் பிறக்கும் குட்டியைக் குறிக்கிறது; அவற்றில் ஆண் குட்டிகளே யாவேக்குரியவை என்று வசனத்தின் இறுதிப்பகுதி குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: ஒதுக்கிவைப்பாய்
  rationale: עבר என்பதன் ஹிஃபில் வடிவம் சொற்பட ‘கடக்கச் செய்வாய்’ எனப் பொருள்படலாம்; இவ்வழிபாட்டுச் சட்டச் சூழலில் யாவேக்காக உரிமைமாற்றி அர்ப்பணிப்பதைக் குறிக்கிறது. ‘ஒதுக்கிவைப்பாய்’ என்பது அந்த அர்ப்பணிப்பு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: פֶּטֶר רֶחֶם
  choice: கருப்பையை முதலில் திறக்கும் ஒவ்வொன்றும்
  rationale: ‘கருப்பையைத் திறப்பது’ என்ற எபிரெய மரபுத்தொடரையும், அது முதல் பிறப்பைக் குறிப்பதையும் இந்த மொழிபெயர்ப்பு காக்கிறது. ‘முதலில்’ என்பது தமிழில் அதன் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கென்று / யாவேக்குரியவை
  rationale: உரையில் உள்ள உடன்படிக்கைப் பெயரான יהוה, பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது. முதல் இடத்தில் அர்ப்பணிப்பின் நோக்கமும், இறுதி இடத்தில் உரிமை அல்லது அர்ப்பணிப்பும் இயல்பான தமிழில் வேறுபடுத்திக் கூறப்படுகின்றன.
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: கால்நடைகள் ஈனும் முதல் குட்டிகள் அனைத்தும்
  rationale: שֶׁגֶר என்பது குறிப்பாக விலங்குகள் ஈனும் குட்டி அல்லது ஈற்றைக் குறிக்கிறது. சொற்றொடரின் விலங்கு-பிறப்பு சார்ந்த பொருளைத் தக்கவைத்து, நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: உனக்கிருக்கும்
  rationale: இது முகவரிடம் உடைமையாக அல்லது வசமாக இருக்கும் கால்நடைகளைச் சுட்டுகிறது; ‘உனக்கிருக்கும்’ சுருக்கமான இயல்பான தமிழ்.
- source_word: הַזְּכָרִים
  choice: ஆணானவை
  rationale: குறிப்பிட்ட முதல் குட்டிகளில் ஆண் குட்டிகளையே இச்சொல் வகையாகச் சுட்டுகிறது. முந்திய ‘குட்டிகள்’ என்பதுடன் தொடர்புபடுத்தி வாசிக்க ‘ஆணானவை’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: எபிரெய உரை நான்கெழுத்து உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. பொதுப்பட்டமாக மாற்றாமல் அந்தப் பெயரைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: முதல் பிறப்பை யாவேக்காக ஒதுக்குவதன் சட்ட-வழிபாட்டு வலிமை
  choice: ‘ஒதுக்கிவைப்பாய்’ என்றும் ‘யாவேக்குரியவை’ என்றும் வழங்குதல்
  alternative: ‘கொடுப்பாய்’ அல்லது ‘பலியிடுவாய்’
  rationale: இவ்வசனம் அர்ப்பணிப்பு மற்றும் உரிமையைச் சொல்கிறது; ஒவ்வொன்றும் எவ்வாறு நடத்தப்பட வேண்டும் என்பதை இங்கேயே ‘பலியிடுதல்’ என்று தீர்மானிப்பது சூழலுக்கு அப்பாற்பட்ட விளக்கத்தைச் சேர்க்கும். ஆகவே மூலத்திலுள்ள சட்ட-வழிபாட்டு பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், சட்டவிதிக்கேற்ற கண்ணியமான ஒருமை முன்னிலை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கருப்பையைத் திறத்தல்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டாலும், ‘முதலில்’ மற்றும் அடிக்குறிப்பு மூலம் சாதாரண வாசகருக்குத் தெளிவாக்கப்பட்டுள்ளது.
