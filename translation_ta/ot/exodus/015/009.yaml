  text: אָמַ֥ר אוֹיֵ֛ב אֶרְדֹּ֥ף אַשִּׂ֖יג אֲחַלֵּ֣ק שָׁלָ֑ל תִּמְלָאֵ֣/מוֹ נַפְשִׁ֔/י אָרִ֣יק חַרְבִּ֔/י תּוֹרִישֵׁ֖/מוֹ יָדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: ta
  text: 'எதிரி சொன்னான்: “நான் துரத்துவேன்; எட்டிப்பிடிப்பேன்; கொள்ளைப் பொருளைப் பங்கிடுவேன். அவர்களைக் கொண்டு என் வேட்கையைத் தீர்த்துக்கொள்வேன்.[a] என் வாளை உருவுவேன்; என் கை அவர்களை விரட்டியடிக்கும்.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “என் உள்ளம் அவர்களால் நிறையும்”; அதாவது, “அவர்களைக் கொண்டு என் வேட்கையைத் தீர்த்துக்கொள்வேன்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் கை அவர்களை அழித்துவிடும்” அல்லது “உடைமையிழக்கச் செய்யும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: எதிரி சொன்னான்
  rationale: பாடலின் கதைச்சூழலில் எதிரியின் தற்பெருமையான எண்ணத்தை அறிமுகப்படுத்தும் எளிய இறந்தகால வாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: நான் துரத்துவேன்; எட்டிப்பிடிப்பேன்
  rationale: இரு வினைகளும் எதிரி செய்ய எண்ணிய அடுத்தடுத்த செயல்களைச் சுட்டுகின்றன; ‘எட்டிப்பிடிப்பேன்’ என்பது துரத்திச் சென்று அடைவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲחַלֵּק שָׁלָל
  choice: கொள்ளைப் பொருளைப் பங்கிடுவேன்
  rationale: போரில் கைப்பற்றிய பொருளைப் பங்கிடுவதைக் குறிக்கும் வழக்குச் சொல்லின் பொருள் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: அவர்களால் என் ஆசை நிறைவேறும்
  rationale: நேரடியாக ‘என் நெஃபெஷ் அவர்களால் நிறையும்’ எனும் சொற்றொடரில் נֶפֶשׁ இங்கு உள்ளார்ந்த வேட்கை அல்லது பேராசையைக் குறிக்கிறது; தமிழில் இயல்பாகவும் எதிரியின் கொடிய விருப்பத்தை மறைக்காமலும் தரப்பட்டுள்ளது.
- source_word: אָרִיק חַרְבִּי
  choice: என் வாளை உருவுவேன்
  rationale: ריק என்பதன் ஹிஃபில் வடிவம் ‘வாள்’ என்பதோடு வரும்போது வாளை உறையிலிருந்து உருவுதல் என்ற மரபுத்தொடர் பொருளைக் கொண்டுள்ளது.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: என் கை அவர்களை விரட்டியடிக்கும்
  rationale: ירשׁ என்பதன் ஹிஃபில் வடிவம் பொதுவாக வெளியேற்றுதல் அல்லது உடைமையிலிருந்து அகற்றுதல் என்ற பொருளைக் கொண்டது. ‘விரட்டியடிக்கும்’ என்பது சூழலுக்கு இயல்பானது; ‘அழித்துவிடும்’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: ஆசை
  alternative: உயிர் / ஆத்துமா
  rationale: இங்கு தனித்த ஓர் ஆவிக்குரிய கூறை வரையறுப்பதைவிட எதிரியின் தீராத வேட்கையையே சொற்றொடர் வெளிப்படுத்துகிறது; எனினும் நேரடி உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: תּוֹרִישֵׁמוֹ என்பதன் சூழல்சார் நுண்பொருள்
  choice: விரட்டியடிக்கும்
  alternative: அழித்துவிடும் / உடைமையிழக்கச் செய்யும்
  rationale: எபிரெய வினை வெளியேற்றுதல், உடைமையிழக்கச் செய்தல் ஆகிய பொருள்களை ஏற்கிறது; இச்சூழலில் அழித்தல் என்ற வலுவான பொருளும் சாத்தியம் என்பதால் தெளிவற்ற தன்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பாடலுக்குரிய சுருக்கத்தையும் எதிரியின் தொடர்ச்சியான தற்பெருமையையும் காக்க அரைப்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன. ‘வாளை உருவுவேன்’ என்பது இலக்கிய நயமுள்ளதாயினும் இன்றும் எளிதில் புரியக்கூடிய மரபுத்தொடர். அனைத்து அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னர் இடப்பட்டுள்ளன.
