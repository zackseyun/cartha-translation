  source_fidelity: மொத்தத்தில் வினைத் தொடரும் போர்ச் சூழலும் துல்லியமாகத் தரப்பட்டுள்ளன. ஆனால் תִּמְלָאֵמוֹ נַפְשִׁי என்பதில் உள்ள ‘என் நெஃபெஷ் அவர்களால்/அவர்களைக் கொண்டு நிறையும்’ என்ற உருவகத்தை ‘அவர்களால் என் ஆசை நிறைவேறும்’ என்பது காரணப் பொருளாகச் சற்றே மங்கச் செய்கிறது. ‘அவர்களைக் கொண்டு என் வேட்கையைத் தீர்த்துக்கொள்வேன்’ என்பது எதிரியின் திருப்தியற்ற, பகைமையான வேட்கையைத் தெளிவாகக் காக்கிறது.
  naturalness: ‘துரத்துவேன்; எட்டிப்பிடிப்பேன்’ மற்றும் ‘வாளை உருவுவேன்’ நவீனத் தரத் தமிழிலும் இயல்பாக உள்ளன. திருத்தப்பட்ட நடுவாக்கியம் வினைத் தொடரின் முதலாம் நபர் தற்பெருமையோடு இணங்குகிறது.
