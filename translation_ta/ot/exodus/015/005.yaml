    text: அல்லது, “ஆழங்கள் அவர்களை மூடின.”
    reason: תְּהֹמֹת என்பதை நீர்சார் பொருளை வெளிப்படுத்தி ‘ஆழ்நீர்கள்’ என்றும், சொல்லமைப்புக்கு நெருக்கமாக ‘ஆழங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: ஆழ்கடல் நீர்கள்
  rationale: תְּהוֹם என்பதன் பன்மை ஆழமான நீர்ப்பரப்புகளைக் குறிக்கிறது. தமிழில் ‘ஆழ்கடல் நீர்கள்’ என்பது நீரைக் குறிக்கும் பொருளைத் தெளிவாகவும் கவிதைநயத்துடனும் தெரிவிக்கிறது.
- source_word: יְכַסְיֻמוּ
  choice: அவர்களை மூடின
  rationale: כסה என்ற வேர்ச்சொல்லின் நேரடிப் பொருள் ‘மூடுதல்’. வினைச்சொல் பன்மை எழுவாயைக் கொண்டிருந்தாலும், உயிரற்ற பன்மைக்கு நவீனத் தமிழில் ஒருமை வினை இயல்பாக இருப்பதால் ‘மூடின’ என வழங்கப்பட்டுள்ளது.
- source_word: יָרְדוּ
  choice: அவர்கள் இறங்கினார்கள்
  rationale: ירד என்பதன் அடிப்படைப் பொருள் ‘இறங்குதல்’. ‘மூழ்கினார்கள்’ என்பது சூழலுக்கு ஏற்றிருந்தாலும், மூலத்தின் இறங்கும் படிமத்தை ‘இறங்கினார்கள்’ நேரடியாகப் பேணுகிறது.
- source_word: בִמְצוֹלֹת
  choice: கடலின் ஆழங்களுக்குள்
  rationale: מְצוֹלָה குறிப்பாக கடல் ஆழங்களைக் குறிக்கலாம். இயக்க வினையோடு வரும் ב முன்னிடைச்சொல் தமிழில் இயல்பாக ‘-க்குள்’ என வழங்கப்பட்டுள்ளது; முதல் சொல்லிலிருந்து வேறுபட்ட எபிரெயச் சொல்லாக இருப்பதையும் ‘கடலின் ஆழங்கள்’ ஓரளவு உணர்த்துகிறது.
- source_word: כְּמוֹ
  choice: -ப்போல்
  rationale: ஒப்புமையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אָבֶן
  choice: கல்
  rationale: பொதுவான ‘stone’ என்ற பொருளைத் தருகிறது; தமிழில் ஒப்புமையில் ‘ஒரு’ சேர்க்காமல் ‘கல்லைப்போல்’ என்பதே இயல்பானது.
