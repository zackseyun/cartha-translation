source:
  edition: WLC
  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: ta
  text: யா என் வலிமையும் பாடலும்; அவர் எனக்கு மீட்பாக ஆனார். இவரே என் கடவுள்; நான் அவரைப் புகழ்வேன்[a]; என் தந்தையின் கடவுள்; நான் அவரை உயர்த்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அவருக்காக ஓர் உறைவிடத்தை ஆயத்தப்படுத்துவேன்.” இங்குள்ள எபிரெய வினைச்சொல்லின் பொருள் உறுதியாகத் தெரியவில்லை; அது உறைவிடம் அமைத்தல் அல்லது அழகுபடுத்துதல், மகிமைப்படுத்துதல் என்ற கருத்தையும் தரக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: என் வலிமை
  rationale: עֹז் என்பதன் அடிப்படைப் பொருள் வலிமை அல்லது ஆற்றல். கவிதை நடையில் இயல்பாகவும் தெளிவாகவும் இருப்பதால் ‘என் வலிமை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְזִמְרָת יָהּ
  choice: என் பாடலும் யா
  rationale: זִמְרָה என்பது பாடல் அல்லது இசைசார்ந்த துதியைக் குறிக்கலாம். வெற்றிப் பாடலின் சூழலுக்கும் ‘வலிமை’ என்பதுடன் அமைந்துள்ள கவிதை இணைப்புக்கும் ‘பாடல்’ பொருந்துகிறது; יָהּ என்ற சுருக்கமான இறைப்பெயர் ‘யா’ எனத் தனித்த வடிவில் பாதுகாக்கப்பட்டது.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: அவர் எனக்கு மீட்பானார்
  rationale: היה + ל என்ற எபிரெய மரபுத்தொடர், ஒருவர் இன்னொருவருக்கு ஒன்றாக ஆனார் அல்லது விளங்கினார் என்ற பொருளைத் தருகிறது. நிகழ்ந்த விடுதலையைச் சுருக்கமாகவும் இயல்பாகவும் ‘எனக்கு மீட்பானார்’ வெளிப்படுத்துகிறது.
- source_word: זֶה אֵלִי
  choice: இவரே என் இறைவன்
  rationale: זֶה என்பதன் சுட்டிக்காட்டும் வலியுறுத்தலை ‘இவரே’ காக்கிறது. אֵלִי என்பதற்கு இச்சூழலில் இயல்பான மரியாதைமிக்க வடிவாக ‘என் இறைவன்’ பயன்படுத்தப்பட்டது.
- source_word: וְאַנְוֵהוּ
  choice: நான் அவரைப் புகழ்வேன்
  rationale: இந்த வினைச்சொல்லின் பொருள் விவாதத்திற்குரியது. அடுத்துவரும் ‘உயர்த்திப் போற்றுவேன்’ என்ற இணைவரிக்கும் துதிப்பாடல் சூழலுக்கும் ‘புகழ்வேன்’ நன்கு பொருந்துகிறது; உறைவிடம் ஆயத்தப்படுத்தும் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: אֱלֹהֵי אָבִי
  choice: என் தந்தையின் கடவுள்
  rationale: ஒருமை முதல் நபர் பின்னொட்டைக் கொண்ட எபிரெயச் சேர்க்கையின் குடும்பத் தொடர்பை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: நான் அவரை உயர்த்திப் போற்றுவேன்
  rationale: רומם என்பது உயர்த்துதல் அல்லது மேன்மைப்படுத்துதல் எனப் பொருள்படும். தமிழில் வழிபாட்டு மொழியாக இயல்பாகவும் உருவகத்தைத் தக்கவைத்தும் இருக்க ‘உயர்த்திப் போற்றுவேன்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: יָהּ என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயரான יהוה அல்லாமல் அதன் சுருக்க வடிவமான יָהּ வருகிறது. அந்த வேறுபாட்டையும் பாடலின் ஒலிநயத்தையும் காக்க ‘யா’ பயன்படுத்தப்பட்டது.
- issue: וְאַנְוֵהוּ என்பதன் பொருள்
  choice: நான் அவரைப் புகழ்வேன்
  alternative: நான் அவருக்காக ஓர் உறைவிடத்தை ஆயத்தப்படுத்துவேன்
  rationale: வினைச்சொல் சொற்பொருள் அளவில் தெளிவற்றது. கவிதை இணைநிலைக்கும் வழிபாட்டுச் சூழலுக்கும் பொருந்தும் ‘புகழ்வேன்’ முதன்மைப் பாடத்தில் வைக்கப்பட்டு, உறைவிடம் சார்ந்த குறிப்பிடத்தக்க மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘யா’ மூலத்திலுள்ள சுருக்கமான இறைப்பெயரைப் பாதுகாக்கிறது. இணைவரிகளின் தாளத்திற்காகச் சுருக்கமான வாக்கிய அமைப்பும் ‘இவரே’ என்ற வலியுறுத்தலும் பயன்படுத்தப்பட்டுள்ளன.
