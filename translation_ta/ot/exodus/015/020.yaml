revisions:
- from: அப்போது ஆரோனின் சகோதரியான இறைவாக்கினர் மிரியாம் தன் கையில் கைத்தப்பை எடுத்தாள். பெண்கள் அனைவரும் கைத்தப்புகளை இசைத்துக்கொண்டும் நடனமாடிக்கொண்டும்[a] அவளைப் பின்தொடர்ந்து வெளியே சென்றார்கள்.
  to: அப்போது இறைவாக்கு உரைப்பவளும் ஆரோனின் சகோதரியுமான மிரியாம் தன் கையில் கைத்தப்பை எடுத்தாள். பெண்கள் அனைவரும் கைத்தப்புகளுடனும் நடனமாடிக்கொண்டும் அவளைப் பின்தொடர்ந்து வெளியே சென்றார்கள்.[a]
  rationale: The revision removes the added assertion that the women were playing the hand drums, while retaining the instrumental accompaniment indicated by the Hebrew. It also renders Miriam's feminine prophetic designation explicitly and idiomatically. The footnote remains anchored to «நடனமாடிக்கொண்டும்» and preserves the lexical alternative ‘with dances.’
