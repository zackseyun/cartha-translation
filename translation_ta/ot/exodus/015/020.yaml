base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: ta
  text: அப்போது இறைவாக்கு உரைப்பவளும் ஆரோனின் சகோதரியுமான மிரியாம் தன் கையில் கைத்தப்பை எடுத்தாள். பெண்கள் அனைவரும் கைத்தப்புகளுடனும் நடனமாடிக்கொண்டும் அவளைப் பின்தொடர்ந்து வெளியே சென்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நடனங்களுடன்.” எபிரெயச் சொல்லை நடனமாடும் செயல் என்றும், நடனங்கள் என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: அப்போது ... எடுத்தாள்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; ‘அப்போது’ இயல்பான தமிழ் நிகழ்வுத் தொடரைத் தருகிறது.
- source_word: מִרְיָם
  choice: மிரியாம்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: הַנְּבִיאָה
  choice: இறைவாக்கினர்
  rationale: பெண் தீர்க்கதரிசியைக் குறிக்கும் சொல்லை, இன்றைய வாசகர்களுக்குப் புரியும் மரியாதையான பொதுத் தமிழில் தருகிறது; மிரியாம் என்றும் ‘சகோதரியான’ என்றும் வருவதால் பெண்பால் தெளிவாக உள்ளது.
- source_word: אֲחוֹת אַהֲרֹן
  choice: ஆரோனின் சகோதரியான
  rationale: மிரியாம் மோசேயின் சகோதரியும் என்றாலும், மூல எபிரெயம் குறிப்பாக ஆரோனின் சகோதரி என்று அடையாளப்படுத்துவதால் அதையே தக்கவைக்கிறது.
- source_word: הַתֹּף
  choice: கைத்தப்பை
  rationale: תֹף என்பது கையில் பிடித்து இசைக்கும் சட்டக வடிவத் தாளக்கருவி; பழமையான அல்லது தெளிவற்ற கருவிப் பெயருக்குப் பதிலாக எளிதில் புரியும் நவீனத் தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּיָדָהּ
  choice: தன் கையில்
  rationale: உடைமைத் தொடர்பை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַתֵּצֶאןָ
  choice: வெளியே சென்றார்கள்
  rationale: יצא என்பதன் அடிப்படைப் பொருளான வெளியே செல்லுதலைவும் பன்மை பெண்பால் வினையையும் சூழலுக்கு ஏற்ற தமிழில் தருகிறது.
- source_word: כָל הַנָּשִׁים
  choice: பெண்கள் அனைவரும்
  rationale: எபிரெயத்தில் வெளிப்படையாகக் குறிப்பிடப்பட்ட பெண்களையும் முழுமையைக் குறிக்கும் ‘அனைவரும்’ என்பதையும் தக்கவைக்கிறது.
- source_word: אַחֲרֶיהָ
  choice: அவளைப் பின்தொடர்ந்து
  rationale: ஊர்வலமாக அவளுக்குப் பின்னால் சென்றனர் என்ற உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּתֻפִּים
  choice: கைத்தப்புகளை இசைத்துக்கொண்டும்
  rationale: கருவியைக் ‘கொண்டு’ சென்றது மட்டுமல்லாமல் அதை இசைத்தபடி சென்றனர் என்ற கருவிப் பயன்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּבִמְחֹלֹת
  choice: நடனமாடிக்கொண்டும்
  rationale: מְחֹלֹת குறிக்கும் கொண்டாட்ட நடனச் செயலை இயல்பான நவீனத் தமிழில் தருகிறது; பெயர்ச்சொல் வடிவான ‘நடனங்களுடன்’ என்பது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: הַנְּבִיאָה என்ற பெண்பால் இறைவாக்கினர் பட்டம்
  choice: இறைவாக்கினர்
  alternative: தீர்க்கதரிசினி
  rationale: மிரியாமின் இறைவாக்குப் பணியைத் தெளிவாகக் காத்து, சமய மரபுக்கே உரியதாகவோ இன்றைய வாசகருக்கு பழமையானதாகவோ தோன்றக்கூடிய சொல்லைத் தவிர்க்கிறது. சூழலில் பெண்பால் தெளிவாக இருப்பதால் மூலத்தின் தகவல் இழக்கப்படவில்லை.
translation_notes:
  register: நவீன, எளிதில் புரியும், மரியாதையான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் நிகழ்வுத் தொடரும், மிரியாம் ஆரோனின் சகோதரி என்ற குறிப்பும், பெண்கள் அவளைப் பின்தொடர்ந்து வெளியே சென்ற இயக்கமும் தக்கவைக்கப்பட்டுள்ளன.
