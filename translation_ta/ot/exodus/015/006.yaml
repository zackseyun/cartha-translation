source:
  edition: WLC
  text: יְמִֽינְ/ךָ֣ יְהוָ֔ה נֶאְדָּרִ֖י בַּ/כֹּ֑חַ יְמִֽינְ/ךָ֥ יְהוָ֖ה תִּרְעַ֥ץ אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: ta
  text: 'யாவே[a], உமது வலக்கரம் வல்லமையில் மாட்சிமை மிக்கது[b];

    யாவே, உமது வலக்கரம் பகைவனை நொறுக்குகிறது[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘YHWH’; பாரம்பரியமாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வலிமையில் மகிமை பொருந்தியது.’
    reason: lexical_alternative
  - marker: c
    text: 'எபிரெய வினை ‘நீர் நொறுக்குகிறீர்’ என்றும் புரிந்துகொள்ளப்படலாம்: ‘உமது வலக்கரத்தால், யாவே, நீர் பகைவனை நொறுக்குகிறீர்.’ அல்லது, ‘பகைவனை நசுக்குகிறது.’'
    reason: textual_ambiguity
lexical_decisions:
- source_word: יְמִינְךָ
  choice: உமது வலக்கரம்
  rationale: יָמִין என்பதன் நேர்ப்பொருள் ‘வலக்கரம்/வலப்பக்கம்’. வெற்றியையும் வல்லமையான செயலையும் குறிக்கும் கவித்துவ உருவகத்தைப் பராமரிக்க ‘உமது வலக்கரம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எபிரெய மெய்யெழுத்துகள். பாரம்பரியப் பதிலீட்டைப் பயன்படுத்தாமல், ‘Yahweh’ என்பதற்கான இயல்பான தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டது.
- source_word: נֶאְדָּרִי
  choice: மாட்சிமை மிக்கது
  rationale: אדר வேர் மாட்சி, மகிமை, சிறப்பு ஆகிய பொருள்களைக் கொண்டது. பெண்பால் ஒருமை வடிவம் ‘வலக்கரம்’ என்பதோடு இணைந்து அதன் தன்மையைச் சொல்வதால், இயல்பான கவித்துவத் தமிழில் ‘மாட்சிமை மிக்கது’ என வழங்கப்பட்டது.
- source_word: בַּכֹּחַ
  choice: வல்லமையில்
  rationale: כֹּחַ என்பது வலிமை அல்லது வல்லமையைக் குறிக்கிறது; முன்னொட்டு בְּ- இங்குள்ள தன்மை அல்லது துறையைக் காட்டுவதால் ‘வல்லமையில்’ என்பது மூல அமைப்பையும் கவித்துவச் செறிவையும் காக்கிறது.
- source_word: תִּרְעַץ
  choice: நொறுக்குகிறது
  rationale: רָעַץ என்பது நசுக்குதல், அடித்து உடைத்தல், நொறுக்குதல் என்ற தீவிரமான பொருளைக் கொண்டது. தீர்மானமான வெற்றிச் செயலைத் தெளிவாக வெளிப்படுத்த ‘நொறுக்குகிறது’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אוֹיֵב
  choice: பகைவனை
  rationale: אוֹיֵב இலக்கணப்படி ஒருமையாக இருந்தாலும், சூழலில் எதிரிப் படையையோ பகைமைச் சக்தியையோ கூட்டாகக் குறிக்கலாம். ஒருமை வடிவத்தையும் இயல்பான தமிழையும் காக்க ‘பகைவனை’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தேவனுடைய தனிப்பெயர் நேரடியாக வருகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல், தமிழ் ஒலியமைப்புக்கு ஏற்ற ‘யாவே’ என வழங்குவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: תִּרְעַץ என்ற வினையின் இலக்கண உறவு
  choice: உமது வலக்கரம் பகைவனை நொறுக்குகிறது
  alternative: உமது வலக்கரத்தால் நீர் பகைவனை நொறுக்குகிறீர்
  rationale: எபிரெய வினை இரண்டாம் ஆண்பால் ஒருமையில் (‘நீர் நொறுக்குகிறீர்’) உள்ளது; ஆனால் முன்வந்துள்ள ‘உமது வலக்கரம்’ கவித்துவமாகச் செய்பவர் போலக் கொள்ளப்படலாம். முதன்மை உரை இணைவரியின் வலக்கர உருவகத்தையும் பாரம்பரிய கவித்துவ வாசிப்பையும் காக்கிறது; மாற்று இலக்கண வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடியதாயும், வெற்றிப்பாடலுக்குரிய உயர்ந்த கவித்துவ நடையுடனும் வடிவமைக்கப்பட்டது. மரியாதைத் தன்மைக்காக ‘உமது’ பயன்படுத்தப்பட்டது; அரிதான அல்லது பழமையான சொற்கள் தவிர்க்கப்பட்டன.
