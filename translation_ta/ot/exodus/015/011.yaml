  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: ta
  text: யெகோவாவே, தெய்வங்களுக்குள் உமக்கு நிகர் யார்? பரிசுத்தத்தில் மாட்சிமைமிக்கவராய், துதிகளில் அஞ்சத்தக்கவராய், அதிசயங்களைச் செய்கிறவராய் இருக்கிற உமக்கு நிகர் யார்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: தெய்வங்களுக்குள்
  rationale: இச்சொல்லின் இயல்பான பன்மைப் பொருளான ‘தெய்வங்களுள்/தெய்வங்களுக்குள்’ என்பதைப் பாதுகாக்கிறது; இதை ‘வல்லமையுள்ளவர்கள்’ என்று மாற்றி உரையின் ஒப்பீட்டை மறைக்கவில்லை.
- source_word: יְהוָה
  choice: யெகோவாவே
  rationale: தனிப்பட்ட தெய்வீகப் பெயரை பொதுப் பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாகத் தமிழ் வாசகர்களுக்கு பரிச்சயமான ஒலிபெயர்ப்பில் தருகிறது; அழைப்புவேற்றுமையையும் வெளிப்படுத்துகிறது.
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: பரிசுத்தத்தில் மாட்சிமைமிக்கவர்
  rationale: נֶאְדָּר என்பதன் மகத்துவம்/மாட்சிமை உணர்வையும், בַּקֹּדֶשׁ என்பதன் ‘பரிசுத்தத்தில்’ என்ற வடிவத்தையும் காக்கிறது.
- source_word: נוֹרָא תְהִלֹּת
  choice: துதிக்கப்படுகையில் அச்சத்துக்குரியவர்
  rationale: נוֹרָא என்பதன் ‘அஞ்சத்தக்க, அச்சத்துக்குரிய’ வலிமையைத் தக்கவைத்து, சுருக்கமான எபிரெயச் சேர்க்கையின் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் ‘அற்புதமானவர்’ என மெலிதாக்கவில்லை.
- source_word: עֹשֵׂה פֶלֶא
  choice: அதிசயங்களைச் செய்கிறவர்
  rationale: சொல்லாட்சிப்படி ஒருமையான ‘அதிசயம்’ இருந்தாலும், இது தேவனுடைய அதிசயச் செயல்களைப் பொதுவாக விவரிக்கும் தொகைமையான பயன்பாடு; தமிழில் பன்மை இயல்பாக அமைகிறது.
theological_decisions:
- issue: ‘தெய்வங்களுக்குள்’ என்ற ஒப்பீட்டின் பொருள்
  choice: ஒப்பீட்டை உரையில் உள்ளபடியே திறந்த நிலையில் வைத்தல்
  alternative: ‘வல்லமையுள்ளவர்களுக்குள்’ அல்லது ‘பொய்த் தெய்வங்களுக்குள்’ என்று விளக்குதல்
  rationale: எபிரெய உரை אֵלִם என்று கூறுகிறது; இவர்கள் யார் அல்லது அவர்களின் இருப்பியல் நிலை என்ன என்பதை மொழிபெயர்ப்பு தானாகத் தீர்மானிக்கக் கூடாது.
- issue: נוֹרָא תְהִלֹּת என்ற சொற்றொடரின் தொடர்பு
  choice: ‘துதிக்கப்படுகையில் அச்சத்துக்குரியவர்’
  alternative: ‘துதிகளில் அச்சத்துக்குரியவர்’ அல்லது ‘துதிக்கத்தக்க அற்புதமானவர்’
  rationale: மூலத்தின் சுருக்கமும் சிறு தெளிவின்மையும் முழுமையாகக் களையப்படாமல், அச்சம்/பயபக்தி சார்ந்த נוֹרָא என்பதன் அர்த்தம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பாடலுக்குரிய கண்ணியத்தையும் இணை வினாக்கட்டமைப்பையும் காக்கும் வகையில் அமைக்கப்பட்டது. இறைவனை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
