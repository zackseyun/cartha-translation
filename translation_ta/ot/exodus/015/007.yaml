source:
  edition: WLC
  text: וּ/בְ/רֹ֥ב גְּאוֹנְ/ךָ֖ תַּהֲרֹ֣ס קָמֶ֑י/ךָ תְּשַׁלַּח֙ חֲרֹ֣נְ/ךָ֔ יֹאכְלֵ֖/מוֹ כַּ/קַּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: ta
  text: உமது பேர்மாட்சியால், உமக்கு எதிராக எழும்புகிறவர்களை அழிக்கிறீர்[a]; உமது எரியும் கோபத்தை அனுப்புகிறீர்[b]; அது அவர்களை வைக்கோலைப்போல் விழுங்குகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது மாட்சிமையின் மிகுதியில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது கடுங்கோபத்தை அனுப்புகிறீர்.” எபிரெயச் சொல் சொல்லாட்சிப்படி “உமது எரியும் கோபம்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב
  choice: உமது மாட்சிமையின் பெருக்கில்
  rationale: בְּ முன்னொட்டு சூழல் அல்லது கருவியைக் குறிக்கலாம்; רֹב மிகுதி அல்லது பெருக்கைக் குறிக்கிறது. இச்சொற்றொடர் வெற்றிப்பாடலுக்கேற்ற இயல்பான தமிழில் அந்த மிகுதியைத் தக்கவைக்கிறது.
- source_word: גְּאוֹנְךָ
  choice: உமது மாட்சிமை
  rationale: גָּאוֹן இங்கு உயர்வு, மேன்மை, மாட்சிமை ஆகிய பொருள்களை உடையது; தேவனுடைய பேருயர்வையும் அரசருக்குரிய மகத்துவத்தையும் ‘மாட்சிமை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תַּהֲרֹס
  choice: தகர்த்துப்போடுகிறீர்
  rationale: הרס என்பதன் அடிப்படைப் பொருள் இடித்தல் அல்லது தகர்த்தல். மனித எதிரிகளைச் சுட்டும் இப்போர்க்கவிதைச் சூழலில், அவர்களை முழுமையாக வீழ்த்துவதை இச்சொல் வலிமையாகக் காட்டுகிறது.
- source_word: קָמֶיךָ
  choice: உமக்கு எதிராக எழும்புகிறவர்கள்
  rationale: קום வினையின் பங்கேற்பு வடிவத்திலுள்ள ‘எழும்புகிறவர்கள்’ என்ற சொல்லாற்றலையும், எழுச்சி தேவனுக்கு எதிரானது என்பதையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: תְּשַׁלַּח
  choice: அனுப்புகிறீர்
  rationale: שׁלח என்பதன் நேரடிப் பொருளான ‘அனுப்பு’ என்பதைக் காக்கிறது; கோபத்தின் தீவிரம் அதன் பெயர்ச்சொல்லிலும் அடுத்துள்ள எரிக்கும் உருவகத்திலும் ஏற்கெனவே வெளிப்படுகிறது.
- source_word: חֲרֹנְךָ
  choice: உமது கொதிக்கும் கோபம்
  rationale: חָרוֹן சூடேறுதல் அல்லது எரிதல் சார்ந்த கோபத்தைச் சுட்டுகிறது. ‘கொதிக்கும் கோபம்’ வெப்ப உருவகத்தையும் இயல்பான தமிழையும் இணைக்கிறது.
- source_word: יֹאכְלֵמוֹ
  choice: அது அவர்களை எரித்து அழிக்கிறது
  rationale: אכל அடிப்படையில் ‘உண்ணுதல்’; தீ குறித்த உருவகத்தில் ‘எரித்து அழித்தல்’ இயல்பான தமிழாகும். ஒருமை வினையின் எழுவாயாக முந்தைய ‘கோபம்’ தொடர்கிறது.
- source_word: כַּקַּשׁ
  choice: வைக்கோல் தாள்களைப்போல்
  rationale: קַשׁ அறுவடைக்குப் பின் எஞ்சும் உலர்ந்த தாள் அல்லது வைக்கோலைக் குறிக்கிறது; விரைவாக எரிந்து அழியும் பொருள் என்ற உருவகத்தை ‘வைக்கோல் தாள்கள்’ தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: தெய்வீக நியாயத்தீர்ப்பின் தீவிரமான உருவகம்
  choice: உமது கொதிக்கும் கோபத்தை அனுப்புகிறீர்; அது அவர்களை வைக்கோல் தாள்களைப்போல் எரித்து அழிக்கிறது
  alternative: உமது கடுங்கோபத்தை வெளிப்படுத்துகிறீர்; அது அவர்களை வைக்கோலைப்போல் விழுங்குகிறது
  rationale: எபிரெய உரை அழிவை உண்டாக்கும் கோபத்தை நேரடியாக தேவனுக்குச் சார்புபடுத்துகிறது. பின்னைய கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் அதன் வலிமையைத் தணிக்காமலும் தீ மற்றும் அழிவு உருவகங்கள் காக்கப்படுகின்றன.
- issue: தேவனை நோக்கிய இரண்டாம் நபர் நேரடி உரை
  choice: உமது ... உமக்கு ... உமது ... செய்கிறீர்
  alternative: உன் ... உனக்கு ... உன் ... செய்கிறாய்
  rationale: பாடல் தேவனை நேரடியாக அழைக்கிறது. நவீன மரியாதைத் தமிழின் ‘உமது/செய்கிறீர்’ வடிவம் அந்த வழிபாட்டு மற்றும் அறிக்கையிடும் தன்மையை இயல்பாகக் காக்கிறது.
- issue: בְּ முன்னொட்டின் சூழல் அல்லது கருவிப் பொருள்
  choice: மாட்சிமையின் பெருக்கில்
  alternative: மாட்சிமையின் பெருக்கினால்
  rationale: எபிரெய בְּ இங்கு ‘அதில்/அந்தச் சூழலில்’ அல்லது ‘அதனால்/அதன் மூலம்’ என்ற இரு நிழற்பொருள்களையும் ஏற்க முடியும். முதன்மை உரை சூழல் சார்ந்த வாசிப்பைத் தருகிறது; அடிக்குறிப்பு கருவிப் பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பாடலுக்குரிய உயர்வும் சாதாரண வாசகருக்கான தெளிவும் சமநிலைப்படுத்தப்பட்டுள்ளன. தேவனை நோக்கிய மரியாதைப் பன்மை ஒருமைப்பாட்டுடன் பயன்படுத்தப்பட்டுள்ளது; எபிரெயக் கவிதையின் வலிமையான போர் மற்றும் தீ உருவகங்கள் மென்மைப்படுத்தப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
