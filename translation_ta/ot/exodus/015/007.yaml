  source_fidelity: மூல எபிரெயத்தின் இரண்டாம் நபர் நேரடி அழைப்பு, எதிராக எழுவோர், அழிவை உண்டாக்கும் கோபம், தீயால் நுகரப்படுதல் போன்ற உருவகம் ஆகியவை வரைவில் அடிப்படையில் தக்கவைக்கப்பட்டுள்ளன. ஆனால் כַּקַּשׁ என்பதற்கு “வைக்கோல் தாள்கள்” என்பது இயல்பற்றதும் தேவையற்ற அளவு குறிப்பிட்டதுமாக உள்ளது; பொதுவான “வைக்கோல்” உருவகத்தைச் சிறப்பாகக் கொடுக்கிறது. “எரியும் கோபம்” חָרוֹן என்ற சொல்லின் தீ-உருவகத்தை “கொதிக்கும்” என்பதைக் காட்டிலும் நேரடியாகக் காக்கிறது.
