  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: ta
  text: 'பேரச்சமும் திகிலும் அவர்கள் மேல் விழும்;


    உமது புயத்தின் மாபெரும் வலிமையால்


    அவர்கள் கல்லைப்போல் அசைவற்று இருப்பார்கள்[a],


    யாவே, உமது மக்கள் கடந்துசெல்லும்வரை[b],


    நீர் உரிமையாக்கிக்கொண்ட[c] இந்த மக்கள் கடந்துசெல்லும்வரை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அமைதியாக இருப்பார்கள்” அல்லது “மௌனமாயிருப்பார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடந்துபோகும்வரை” அல்லது “கடக்கும்வரை.”
    reason: lexical_alternative
  - marker: c
    text: “உரிமையாக்கிக்கொண்ட” என்பதை “வாங்கிக்கொண்ட,” “பெற்றுக்கொண்ட,” அல்லது விரிந்த உடன்படிக்கைப் பொருளில் “உமக்குச் சொந்தமாக்கிக்கொண்ட” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם
  choice: அவர்கள்மேல் விழும்
  rationale: נפל என்பதன் நேரடியான ‘விழும்’ என்ற உருவகத்தைத் தக்கவைத்து, பெண்பால் ஒருமை வினைச்சொல் முன்வரும் இணைந்த உணர்ச்சிகளை ஒருங்கிணைந்த தாக்கமாகக் குறிப்பிடுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵימָתָה וָפַחַד
  choice: பேரச்சமும் திகிலும்
  rationale: அருகிய பொருளுடைய இரு எபிரேயச் சொற்களின் கவிதைத் தீவிரத்தையும் வேறுபாட்டையும் ஒரே சொல்லாகச் சுருக்காமல் காக்கிறது.
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: உமது புயத்தின் பெருவலிமையால்
  rationale: ‘புயம்’ என்ற உடல்-உறுப்பு உருவகத்தைத் தக்கவைத்து, גֹּדֶל குறிக்கும் பெருமை அல்லது மாபெரும் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יִדְּמוּ כָּאָבֶן
  choice: கல்லைப்போல் அசைவற்று இருப்பார்கள்
  rationale: דמם அமைதி, மௌனம், அசைவின்மை ஆகிய பொருள் நிழல்களைக் கொண்டது; ‘கல்லைப்போல்’ என்ற உவமையுடன் சூழலில் அசைவின்மை முன்னிலைப்படுகிறது, மற்ற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: עַד יַעֲבֹר
  choice: கடந்துசெல்லும்வரை
  rationale: עבר என்பதன் பொதுவான கடத்தல் அல்லது கடந்து செல்லுதல் என்ற இயக்கத்தை வழங்குகிறது; குறிப்பாக நீரைக் கடப்பதாக மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: עַמְּךָ
  choice: உமது மக்கள்
  rationale: עם என்பதன் மக்கள் என்ற கூட்டுறவு மற்றும் உடன்படிக்கைச் சார்ந்த உறவை நேரடியாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עַם זוּ
  choice: இந்த மக்கள்
  rationale: זוּ-வின் சுட்டுப்பொருளை வெளிப்படையாகக் காத்து, முந்தைய ‘உமது மக்கள்’ என்பதுடன் உள்ள கவிதை இணைப்பைத் தொடர்கிறது.
- source_word: קָנִיתָ
  choice: நீர் உரிமையாக்கிக்கொண்ட
  rationale: קנה என்பதன் வாங்குதல், பெற்றுக்கொள்ளுதல், சொந்தமாக்குதல் ஆகிய பொருள் பரப்பை உடன்படிக்கைச் சூழலில் இயல்பாகக் காட்டுகிறது; ‘மீட்டுக்கொண்ட’ என்று ஆதாரத்தைவிடக் குறிப்பிட்ட இறையியல் கருத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயர் வருகிறது; ஆகவே பெயரைக் காக்கும் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: קָנִיתָ என்பதன் உடன்படிக்கைச் சார்ந்த பொருள்
  choice: நீர் உரிமையாக்கிக்கொண்ட
  alternative: நீர் வாங்கிக்கொண்ட / நீர் பெற்றுக்கொண்ட / நீர் உமக்குச் சொந்தமாக்கிக்கொண்ட
  rationale: ‘உரிமையாக்கிக்கொண்ட’ என்பது அடிப்படைப் பெறுதல் அல்லது சொந்தமாக்குதல் கருத்தைக் காக்கிறது; விலை கொடுத்து வாங்குதல் அல்லது மீட்பு என்ற ஒரே விளக்கத்தைத் திணிக்கவில்லை.
- issue: יִדְּמוּ என்பதில் மௌனமா அசைவின்மையா
  choice: அசைவற்று இருப்பார்கள்
  alternative: அமைதியாக இருப்பார்கள் / மௌனமாயிருப்பார்கள்
  rationale: ‘கல்லைப்போல்’ என்ற உடனடி உவமை அசைவின்மையை முன்னிறுத்துகிறது; எனினும் சொல்லின் மௌனம் மற்றும் அமைதி சார்ந்த பொருள் அடிக்குறிப்பில் காக்கப்பட்டது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கும் பொதுப் பயன்பாட்டுத் தமிழுக்கும் இடைப்பட்ட கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. பாடல் வரியின் மறுமொழி அமைப்பு காக்கப்பட்டுள்ளது; இறுதி ‘அப்படியே இருப்பார்கள்’ என்பது தமிழில் நீண்ட ‘வரை…வரை’ கட்டமைப்பை நிறைவு செய்யத் தெளிவுக்காகச் சேர்க்கப்பட்டது.
