base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/024.yaml
  text: And the people grumbled against Moses[a], saying, “What shall we drink?”
translation:
  language: ta
  text: மக்கள் மோசேக்கு எதிராக முணுமுணுத்து[a], “நாம் என்ன குடிப்பது?” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘குறை கூறி’ அல்லது ‘முறையிட்டு’ என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெய வினைச்சொல், குறிப்பாக வனாந்தர நிகழ்வுகளில், மக்கள் கூட்டாக அதிருப்தியுடன் புகார் கூறுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: முறையிட்டு
  rationale: வனாந்தர நிகழ்வுகளில் לון/לין என்பது ஒரு தலைவருக்கு எதிராக மக்கள் கூட்டாக அதிருப்தியை வெளிப்படுத்துவதைக் குறிக்கிறது. ‘முறையிட்டு’ என்பது நவீனத் தமிழில் இயல்பாகவும் எதிர்மறையான கூட்டுப் புகாரின் பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: עם என்பதன் நேரடியான பொருள் ‘மக்கள்’; எபிரெய உரையில் இல்லாத ‘இஸ்ரயேல்’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: עַל
  choice: மோசேக்கு எதிராக
  rationale: புகார் அல்லது முறையீட்டைக் குறிக்கும் வினையுடன் על, அந்த முறையீடு யாருக்கு எதிரானது என்பதைச் சுட்டுகிறது.
- source_word: מֹשֶׁה
  choice: மோசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர்வடிவம்.
- source_word: לֵאמֹר
  choice: என்று கேட்டார்கள்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயச் சூத்திரத்தை, தமிழில் கேள்வி வாக்கியத்துடன் இயல்பாக இணைக்கிறது; ‘சொல்லி’ என்ற சொற்சொல் வடிவத்தை விட நடப்பு தமிழில் தெளிவானது.
- source_word: מַה
  choice: என்ன
  rationale: எளிய வினாப் பெயர்ச்சொல்லின் நேரடியான தமிழ் இணை.
- source_word: נִּשְׁתֶּה
  choice: நாங்கள் என்ன குடிப்போம்?
  rationale: שׁתה என்பதன் முதலாம் நபர் பன்மை imperfect வடிவம். இங்கு உடனடியான தேவையையும் என்ன செய்வது என்ற கேள்வியையும் ‘குடிப்போம்’ இயல்பாக வெளிப்படுத்துகிறது.
