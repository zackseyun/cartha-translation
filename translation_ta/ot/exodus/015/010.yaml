source:
  edition: WLC
  text: נָשַׁ֥פְתָּ בְ/רוּחֲ/ךָ֖ כִּסָּ֣/מוֹ יָ֑ם צָֽלֲלוּ֙ כַּֽ/עוֹפֶ֔רֶת בְּ/מַ֖יִם אַדִּירִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: ta
  text: நீர் உமது காற்றால் ஊதினீர்; கடல் அவர்களை மூடியது[a]. வலிமைமிக்க நீரில் அவர்கள் ஈயம்போல் மூழ்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது மூச்சால்.’ எபிரெயச் சொல் ‘காற்று,’ ‘மூச்சு,’ அல்லது ‘ஆவி’ என்று பொருள்படலாம்; இங்கே கடலைக் கடக்கும் நிகழ்வின் சூழல் ‘காற்று’ என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: நீர் ஊதினீர்
  rationale: נשׁף என்பது ஊதுவதையோ மூச்சை வெளிவிடுவதையோ குறிக்கிறது. கடலின்மேல் கடவுள் செயல்படும் இந்தப் பாடல் சூழலில், ‘ஊதினீர்’ என்பது நேரடியானதும் இயல்பானதுமான மொழிபெயர்ப்பு.
- source_word: בְרוּחֲךָ
  choice: உமது காற்றை
  rationale: רוּחַ என்பதற்கு ‘காற்று,’ ‘மூச்சு,’ ‘ஆவி’ ஆகிய பொருள்கள் உண்டு. ஊதுதல் மற்றும் கடல் நிகழ்வு ஆகிய உடனடிச் சூழல் ‘காற்று’ என்ற பொருளை ஆதரிக்கிறது; சாத்தியமான ‘மூச்சு’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כִּסָּמוֹ יָם
  choice: கடல் அவர்களை மூடியது
  rationale: כסה என்பதன் அடிப்படைப் பொருள் ‘மூடுதல்.’ இச்சொல்லாக்கம் எபிரெய உரையின் நேரடியான படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: צָלֲלוּ
  choice: அவர்கள் அமிழ்ந்தார்கள்
  rationale: இச்சூழலில் צלל நீருக்குள் கீழே சென்றதைக் குறிக்கிறது. ‘அமிழ்ந்தார்கள்’ என்பது ஈயத்தின் கனத்தை உணர்த்தும் அடுத்த உவமைக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: כַּעוֹפֶרֶת
  choice: ஈயத்தைப்போல்
  rationale: עוֹפֶרֶת என்பது ஈயம் என்னும் உலோகம். இத்தேர்வு மூலத்தின் உவமையையும் கனத்தின் படிமத்தையும் தெளிவாகக் காக்கிறது.
- source_word: בְּמַיִם אַדִּירִים
  choice: வலிமைமிக்க நீரில்
  rationale: אַדִּירִים வலிமை, மகத்துவம் அல்லது பேராற்றலைக் குறிக்கலாம். ‘வலிமைமிக்க’ என்பது ‘ஆழமான’ போன்ற சூழல் சார்ந்த கூடுதல் விளக்கத்தைச் சேர்க்காமல் மூலத்தின் வலிமையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைத்தோற்றப் பாடல் சூழலில் רוּחַ என்பதன் பொருள்
  choice: காற்று
  alternative: மூச்சு; ஆவி
  rationale: எகிப்தியர் கடலில் தோற்கடிக்கப்பட்ட உடனடிச் சூழலும் ‘ஊதினீர்’ என்ற வினையும் இயற்கைக் காற்று அல்லது இறை மூச்சின் படிமத்தை ஆதரிக்கின்றன. இங்கு ‘ஆவி’ என்று வெளிப்படையாக மொழிபெயர்ப்பது உரையில் இல்லாத ஒரு குறிப்பிட்ட இறையியல் வாசிப்பை முன்னிறுத்தக்கூடும். ஆகவே முதன்மை உரையில் ‘காற்று’ என்றும், நெருக்கமான மாற்றுப் பொருளான ‘மூச்சு’ அடிக்குறிப்பிலும் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், பாடலுக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளைக் குறிக்க மரியாதை ஒருமையான ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் சுருக்கமான கவிதை இணைநிலை பாதுகாக்கப்பட்டுள்ளது.
