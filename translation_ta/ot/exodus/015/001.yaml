  to: 'அப்போது மோசேயும் இஸ்ரவேலின் மகன்களும் யாவேக்கு[a] இந்தப் பாடலைப் பாடினார்கள். அவர்கள் இவ்வாறு சொன்னார்கள்:


    “நான் யாவேக்குப் பாடுவேன்;

    ஏனெனில் அவர் மிகுந்த மாட்சிமையுடன் வெற்றி பெற்றார்[b].

    குதிரையையும் அதன்மேல் ஏறியவனையும்

    அவர் கடலுக்குள் எறிந்தார்.”'
  rationale: 'திருத்தம் மூலத்தின் குறிப்புகளைத் துல்லியமாகக் காக்கிறது: בְנֵי இன் ‘மகன்கள்’ குறிப்பு மீட்டெடுக்கப்பட்டது; רֹכְבוֹ கூடுதல் போரியல் பொருளின்றி ‘அதன்மேல் ஏறியவன்’ எனத் தரப்பட்டது; பன்மை பேச்சு அறிமுகம் இலக்கணமாகச் சரிசெய்யப்பட்டது. பாடலின் வலியுறுத்தப்பட்ட வெற்றி/மாட்சிமை நவீன, கண்ணியமான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.'
