source:
  edition: WLC
  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: ta
  text: 'அப்போது மோசேயும் இஸ்ரவேலின் மகன்களும் யாவேக்கு[a] இந்தப் பாடலைப் பாடினார்கள். அவர்கள் இவ்வாறு சொன்னார்கள்:


    “நான் யாவேக்குப் பாடுவேன்;

    ஏனெனில் அவர் மிகுந்த மாட்சிமையுடன் வெற்றி பெற்றார்[b].

    குதிரையையும் அதன்மேல் ஏறியவனையும்

    அவர் கடலுக்குள் எறிந்தார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: ‘YHWH’ (יהוה); மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது; ‘யாவே’ என்றும் வழங்கப்படுகிறது.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘அவர் மிகவும் உயர்ந்திருக்கிறார்.’ ஒரே எபிரெய வேரின் இரு வடிவங்கள் அடுத்தடுத்து வருவதால் கருத்து வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: கடல் கடந்த நிகழ்வைத் தொடர்ந்து பாடல் தொடங்குவதைச் சுட்டும் காலத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: יָשִׁיר
  choice: பாடினார்கள்
  rationale: வடிவில் imperfect என்றாலும், אָז உடன் வரும் இந்தக் கதைச் சூழலில் இறந்தகால நிகழ்வைக் குறிக்கிறது.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: எபிரெய வெளிப்பாட்டின் வம்ச/சமூகப் பொருளை இயல்பான நவீன தமிழில் தருகிறது; ஆண்களை மட்டும் குறிக்கும் எனத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: இந்தப் பாடல்
  rationale: கூடுதல் விளக்கப் பொருள் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து, தமிழின் வேற்றுமை உருபுடன் இயல்பாக இணைக்கிறது.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: அவர்கள் சொன்னது
  rationale: எபிரெய மொழியின் இரட்டித்த பேச்சு அறிமுகத்தைத் தமிழில் செயற்கையாக மீளுரைக்காமல், மேற்கோளை இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: אָשִׁירָה
  choice: நான் ... பாடுவேன்
  rationale: முதலாம் நபர் ஒருமை cohortative வடிவின் தீர்மானத்தையும், பன்மை அறிமுகத்திலிருந்து ஒருமைப் பாடற்குரலுக்கு வரும் மாற்றத்தையும் காக்கிறது.
- source_word: גָאֹה גָּאָה
  choice: மிகவும் மேன்மையாய் வெற்றிபெற்றார்
  rationale: ஒரே வேரின் infinitive absolute மற்றும் finite verb சேர்க்கை தரும் வலியுறுத்தலைக் காத்து, சூழலிலுள்ள மேன்மையும் வெற்றியும் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: סוּס וְרֹכְבוֹ
  choice: குதிரையையும் அதன் வீரனையும்
  rationale: கவிதைக்குரிய கூட்டு ஒருமையையும் உடைமைப் பின்னொட்டையும் காக்கிறது; רֹכֵב என்பதை இந்தப் போர்ச் சூழலில் குதிரை வீரன் என இயல்பாகத் தருகிறது.
- source_word: רָמָה בַיָּם
  choice: கடலுக்குள் எறிந்தார்
  rationale: வலிமையாக வீசும் செயலும் கடலை நோக்கிய இயக்கமும் தமிழில் தெளிவாக வெளிப்படுகின்றன.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது; உச்சரிப்பு முழுமையாக உறுதியானதல்ல என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- issue: גָאֹה גָּאָה என்பதின் பொருள்
  choice: மிகவும் மேன்மையாய் வெற்றிபெற்றார்
  alternative: மிகவும் உயர்ந்திருக்கிறார்
  rationale: கடலில் பகைவரை வீழ்த்திய உடனடி சூழல் வெற்றிப் பொருளை ஆதரிக்கிறது; அதேவேளை உயர்வு/மேன்மை என்ற சொற்பொருள் பதற்றத்தையும் முதன்மை உரையிலும் அடிக்குறிப்பிலும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையுடன், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. மேற்கோள் பாடல் வரிகளாக அமைக்கப்பட்டு கவிதைத் தன்மை காக்கப்பட்டுள்ளது; தேவையற்ற பழமொழிநடை மற்றும் சமயக்குழு சார்ந்த சொற்பயன்பாடு தவிர்க்கப்பட்டுள்ளது.
