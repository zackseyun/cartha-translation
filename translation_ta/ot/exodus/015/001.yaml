  source_fidelity: மூலத்தின் காலத் தொடர்பு, பாடலின் ஒருமை முதல் நபர் குரல், யாவே என்ற இறைநாமம், மற்றும் குதிரை–சவாரி செய்பவர் என்ற கவிதைமயமான ஒருமை ஆகியவை பெரும்பாலும் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் ‘இஸ்ரவேலின் மக்கள்’ என்பது וּבְנֵי יִשְׂרָאֵל என்பதிலுள்ள ‘மகன்கள்/புதல்வர்கள்’ என்ற குறிப்பைத் தளர்த்துகிறது; மேலும் ‘வீரன்’ என்பது רֹכְבוֹ (‘அதன் மேல் சவாரி செய்பவன்’) என்பதைக் காட்டிலும் குறிப்பான போர்வீரர் என்ற பொருளைச் சேர்க்கிறது.
  naturalness: ‘அவர்கள் சொன்னது’ என்பது பன்மை எழுவாயுடன் பொருந்தாத வடிவம். ‘அவர்கள் இவ்வாறு சொன்னார்கள்’ என்பது நவீன தரமான தமிழில் இயல்பாகவும், மேற்கோளைத் தெளிவாக அறிமுகப்படுத்துவதாகவும் உள்ளது. ‘மிகவும் மேன்மையாய் வெற்றிபெற்றார்’ என்பதற்குப் பதிலாக ‘மிகுந்த மாட்சிமையுடன் வெற்றி பெற்றார்’ இயல்பான கவிதைநடையாக அமைகிறது.
