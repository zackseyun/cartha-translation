translation_notes:
  register: நவீன நிலையான தமிழில், பாடலுக்குரிய இணைவரி அமைப்பையும் அச்சத்தின் தீவிரத்தையும் தக்கவைக்கும் கண்ணியமான நடை. மூலத்தின் ‘கரைந்துபோதல்’ உருவகம் விளக்கவுரையாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் மோவாபின் தலைவர்கள் என்ற தொடரிலேயே வைக்கப்பட்டுள்ளது.
