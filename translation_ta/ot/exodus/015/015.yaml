  source_fidelity: 'மூல எபிரெயத்தின் மூன்று இணைவரிகளும் துல்லியமாகத் தரப்பட்டுள்ளன: ஏதோமின் தலைவர்கள் அஞ்சுதல், மோவாபின் வலிமைமிக்க/முக்கியமானவர்களை நடுக்கம் பற்றிக்கொள்ளுதல், கானான் குடியிருப்போர் கரைந்துபோதல். יֹאחֲזֵמוֹ என்ற பன்மைச் சுட்டுதலுக்கு ஏற்ப “தலைவர்களை” என்ற வேற்றுமை வடிவம் அமைந்துள்ளது; “நடுக்கம் பற்றிக்கொண்டது” மூலத்தின் உயிரூட்டப்பட்ட சொல்லாட்சியைப் பாதுகாக்கிறது.'
  naturalness: நவீன நிலையான தமிழில் நடை இயல்பாகவும் கவிதைத் தன்மையுடனும் உள்ளது. அரைப்புள்ளிகளால் அமைந்த இணைவரி வடிவம் பாடலின் ஓசையையும் முன்னேற்றத்தையும் நன்றாகக் காட்டுகிறது.
  terminology: “ஏதோமின் தலைவர்கள்” אַלּוּפֵי என்பதற்கு பொருத்தமானது. “மோவாபின் வலிமைமிக்க தலைவர்கள்” மூலச் சொல்லின் வலிமை நிழற்பொருளையும் சூழலின் தலைமைப் பொருளையும் சமநிலைப்படுத்துகிறது. அடிக்குறிப்பு மாற்று நேரடிப் பொருளான “ஆட்டுக்கடாக்கள்” என்பதையும் அதன் உருவகப் பயன்பாட்டையும் தெளிவுபடுத்துகிறது. “கரைந்துபோனார்கள்” நָמֹגוּ என்ற அச்ச உருவகத்தை விளக்கவுரையாக்காமல் காக்கிறது.
