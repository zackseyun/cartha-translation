  text: אָ֤ז נִבְהֲלוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אֵילֵ֣י מוֹאָ֔ב יֹֽאחֲזֵ֖/מוֹ רָ֑עַד נָמֹ֕גוּ כֹּ֖ל יֹשְׁבֵ֥י כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/015.yaml
  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: ta
  text: 'அப்போது ஏதோமின் தலைவர்கள் திகிலடைந்தார்கள்;

    மோவாபின் வலிமைமிக்க தலைவர்களை[a] நடுக்கம் பற்றிக்கொண்டது;

    கானானில் குடியிருப்போர் அனைவரும் கரைந்துபோனார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “மோவாபின் வலிமைமிக்கவர்கள்” அல்லது “மோவாபின் ஆட்டுக்கடாக்கள்” எனலாம்; இங்கு அது முக்கியமானவர்களையோ தலைவர்களையோ குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: முந்தைய மீட்புச் செயலின் விளைவாக நிகழ்ந்ததைச் சுட்டும் காலவினையடை; கவிதை நடையில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: נִבְהֲלוּ
  choice: திகிலடைந்தார்கள்
  rationale: בהל என்பதன் நிஃபால் வடிவம் கலக்கம், அச்சம், திகில் ஆகியவற்றைக் குறிக்கிறது; வெற்றிப்பாடலின் தீவிரமான அச்சச் சூழலை இது வெளிப்படுத்துகிறது.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: ஏதோமின் தலைவர்கள்
  rationale: אַלּוּף என்பது குலத்தலைவர் அல்லது தலைவன் எனப் பொருள்படலாம்; குறிப்பிட்ட அரச பதவியை ஊகிக்காமல் தலைமைப் பொருளைத் தக்கவைக்கிறது.
- source_word: אֵילֵי מוֹאָב
  choice: மோவாபின் வலிமைமிக்க தலைவர்கள்
  rationale: אֵילֵי என்பதில் வலிமைமிக்கவர்கள் என்ற உருவகப் பொருள் உள்ளது; இணையான ஏதோம் தலைவர்களைக் குறிக்கும் தொடரோடு பொருந்துமாறு தலைமைப் பொருளையும், எபிரெயச் சொல்லின் வலிமை நிழற்பொருளையும் தக்கவைக்கிறது.
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: நடுக்கம் பற்றிக்கொண்டது
  rationale: אחז வினைச்சொல்லும் רָעַד பெயர்ச்சொல்லும் சேர்ந்து நடுக்கம் அவர்களைப் பிடித்துக்கொண்டதை உயிரோட்டமாகச் சித்தரிக்கின்றன.
- source_word: נָמֹגוּ
  choice: கரைந்துபோனார்கள்
  rationale: மிகுந்த அச்சத்தால் உருகுதல் அல்லது துணிவிழத்தல் என்ற உருவகத்தைத் தீர்த்து விளக்காமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: கானானில் குடியிருப்போர் அனைவரும்
  rationale: பங்கேற்புவினை அமைப்பின் பொதுவான, அனைவரையும் உள்ளடக்கும் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
