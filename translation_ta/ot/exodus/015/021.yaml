source:
  edition: WLC
  text: וַ/תַּ֥עַן לָ/הֶ֖ם מִרְיָ֑ם שִׁ֤ירוּ לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: ta
  text: 'மிரியாம் அவர்களுக்குப் பதிலளித்தாள்:[a]


    “யாவேக்குப் பாடுங்கள்;

    ஏனெனில் அவர் மகிமையோடு வெற்றி பெற்றார்.[b]

    குதிரையையும் அதன்மேல் ஏறியவனையும்

    கடலுக்குள் வீசியெறிந்தார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிரியாம் அவர்களுக்கு மறுமொழியாகப் பாடினாள்.” ‘பதிலளித்தாள்’ என்று பொருள்படும் எபிரெய வினைச்சொல், இப்பாடல் சூழலில் எதிரொலியாக அல்லது மாறிமாறிப் பாடியதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் வலியுறுத்தும் தொடர்; “அவர் மிகவும் உயர்ந்திருக்கிறார்” அல்லது “அவர் மிகவும் மேன்மையடைந்தார்” என்றும் பொருள்கொள்ளலாம். வெற்றிப்பாடல் சூழலில் “மகிமையோடு வெற்றி பெற்றார்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: பதிலாகப் பாடினாள்
  rationale: ענה என்பதன் அடிப்படைப் பொருள் ‘பதிலளித்தாள்’; பாடல் சூழலில் இது மறுமொழியாக அல்லது எதிர்ப்பாட்டாகப் பாடுவதைக் குறிக்கலாம். தமிழில் ‘பதிலாகப் பாடினாள்’ என்பது இரு கூறுகளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: எபிரெய வடிவம் ஆண்பால் பன்மை என்றாலும், அது பொதுவான அல்லது கலப்புக் குழுவைக் குறிக்கலாம்; எனவே பாலினத்தை மிகையாகக் குறிப்பாக்காமல் ‘அவர்களுக்கு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִרְיָם
  choice: மிரியாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: שִׁירוּ
  choice: பாடுங்கள்
  rationale: இது பன்மை கட்டளை வடிவம்; ‘துதித்துப் பாடுங்கள்’ போன்ற விளக்கத்தைச் சேர்க்காமல் நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יְהוָה என்ற உடன்படிக்கைப் பெயர் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது; தமிழ் வேற்றுமை உருபுடன் இயல்பாக இணைக்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பாடுமாறு கூறியதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: גָאֹה גָּאָה
  choice: மகிமையாய் வெற்றி பெற்றார்
  rationale: ஒரே வேரின் infinitive absolute மற்றும் finite verb இணைவு தீவிரத்தை வலியுறுத்துகிறது. வெற்றிப்பாடல் சூழலில் மேன்மையையும் வெற்றியையும் வெளிப்படுத்தும் இயல்பான தமிழாக்கம் இது.
- source_word: סוּס
  choice: குதிரையை
  rationale: ஒருமை வடிவம் தொகுதி அல்லது பொதுப்பொருளில் வருகிறது; தமிழிலும் ஒருமையைத் தக்கவைக்கிறது.
- source_word: וְרֹכְבוֹ
  choice: அதன்மேல் ஏறியவனையும்
  rationale: பின்னொட்டு குதிரையைச் சுட்டுகிறது. ‘அதன் சவாரியையும்’ என்பதைக் காட்டிலும் இச்சூழலில் இயல்பான, தெளிவான தமிழ்.
- source_word: רָמָה
  choice: வீசியெறிந்தார்
  rationale: வீசுதல் அல்லது எறிதல் என்ற வலிமையான செயலைக் குறிக்கிறது; வெற்றிப்பாடலின் கவித்துவத் தீவிரத்தையும் தக்கவைக்கிறது.
- source_word: בַיָּם
  choice: கடலுக்குள்
  rationale: சொற்பட ‘கடலில்’ என்றாலும், எறிதல் வினையுடன் இயக்கத்தின் இலக்கை இயல்பான தமிழில் ‘கடலுக்குள்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டத்தால் மாற்றாமல் உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூல வேறுபாட்டைத் தக்கவைக்கிறது.
- issue: גָאֹה גָּאָה என்பதின் வெற்றி மற்றும் உயர்வு சார்ந்த பலபொருள்
  choice: மகிமையாய் வெற்றி பெற்றார்
  alternative: மிகவும் உயர்ந்திருக்கிறார்
  rationale: வடிவம் உயர்வு அல்லது மேன்மையை வலியுறுத்தினாலும், கடலில் பெற்ற வெற்றியைப் பாடும் உடனடிச் சூழல் வெற்றிப் பொருளை முன்னிறுத்துகிறது. ‘மகிமையாய்’ என்பது மேன்மை நிழற்பொருளையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. பாடலின் வரியமைப்பும் வலியுறுத்தலும் பேணப்பட்டுள்ளன; மூலத்தில் உள்ள மறுமொழிப் பாடல் மற்றும் மேன்மை/வெற்றி சார்ந்த நுணுக்கங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
