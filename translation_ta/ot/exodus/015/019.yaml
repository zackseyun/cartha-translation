revisions:
- from: பார்வோனுடைய குதிரைகள், அவனுடைய தேர்களோடும் குதிரைவீரர்களோடும் கடலுக்குள் சென்றபோது, யாவே கடலின் நீரை அவர்கள்மேல் திரும்பிவரச் செய்தார்; ஆனால் இஸ்ரவேல் மக்கள் கடலின் நடுவே உலர்ந்த தரையில் நடந்து சென்றார்கள்.
  to: ஏனெனில், பார்வோனின் குதிரைகள்[a] அவனுடைய தேர்களோடும் குதிரைவீரர்களோடும் கடலுக்குள் சென்றன; யாவே கடல்நீரை அவர்கள்மேல் மீண்டும் வரச் செய்தார். ஆனால்[b] இஸ்ரவேல் மக்கள் கடலின் நடுவே உலர்ந்த தரையில் நடந்தார்கள்.
  rationale: כִּי-யின் விளக்கத் தொடர்பை ‘ஏனெனில்’ என மீட்டெடுத்துள்ளேன். எபிரெய வினைச்சொல் הָלְכוּ-வின் எளிய பொருளை ‘நடந்தார்கள்’ என வைத்துள்ளேன். மூல ஒருமை வடிவத்தின் தொகுப்பொருளுக்கும், வְ இணைப்பை ‘ஆனால்’ எனத் தமிழில் வெளிப்படுத்தியதற்கும் audit-trail அடிக்குறிப்புகள் சேர்க்கப்பட்டுள்ளன.
