source:
  edition: WLC
  text: כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּ/רִכְבּ֤/וֹ וּ/בְ/פָרָשָׁי/ו֙ בַּ/יָּ֔ם וַ/יָּ֧שֶׁב יְהוָ֛ה עֲלֵ/הֶ֖ם אֶת מֵ֣י הַ/יָּ֑ם וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: ta
  text: ஏனெனில், பார்வோனின் குதிரைகள்[a] அவனுடைய தேர்களோடும் குதிரைவீரர்களோடும் கடலுக்குள் சென்றன; யாவே கடல்நீரை அவர்கள்மேல் மீண்டும் வரச் செய்தார். ஆனால்[b] இஸ்ரவேல் மக்கள் கடலின் நடுவே உலர்ந்த தரையில் நடந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘பார்வோனின் குதிரை ... அவனுடைய தேரோடு’ என்று ஒருமை வடிவம் உள்ளது; அது பார்வோனின் குதிரைப்படையையும் தேர்ப்படையையும் தொகுப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மேலும் இஸ்ரவேல் மக்கள்.’ எபிரெய இணைப்புச்சொல் வெறுமனே ‘மற்றும்’; முதன்மை உரையில் உள்ள ‘ஆனால்’ முரண்பாட்டைத் தெளிவாக்குகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: சென்றபோது
  rationale: இங்கு כִּי நிகழ்வை விளக்கும் கால/காரணத் தொடர்பை அறிமுகப்படுத்துகிறது. தமிழில் முழு வாக்கியத்தையும் இயல்பாக இணைக்க ‘சென்றபோது’ பொருத்தமானது; ‘ஏனெனில்’ என்பதும் சாத்தியம்.
- source_word: סוּס פַּרְעֹה
  choice: பார்வோனுடைய குதிரைகள்
  rationale: எபிரெயில் ‘குதிரை’ ஒருமையில் இருந்தாலும், சூழலில் பார்வோனின் குதிரைப்படையைச் சுட்டும் தொகுப்பொருள் கொண்டது; இயல்பான தமிழுக்காகப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: בְּרִכְבּוֹ
  choice: அவனுடைய தேர்களோடும்
  rationale: வடிவில் ஒருமையாக இருந்தாலும் רכב இங்கு தேர்ப்படையைத் தொகுப்பாகக் குறிக்கலாம்; பன்மை சூழலுக்கும் தமிழுக்கும் இயல்பானது.
- source_word: וּבְפָרָשָׁיו
  choice: குதிரைவீரர்களோடும்
  rationale: போருக்காகக் குதிரையில் சவாரி செய்பவர்களைக் குறிக்கும்; ‘குதிரைவீரர்கள்’ தெளிவான நவீனத் தமிழ்.
- source_word: וַיָּשֶׁב יְהוָה
  choice: யாவே ... திரும்பிவரச் செய்தார்
  rationale: שׁוב என்பதன் causative வடிவம் நீர் திரும்பும்படி யாவே செய்தார் என்ற தெய்வீகச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய உரையில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து வழங்குகிறது.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: ஆனால் இஸ்ரவேல் மக்கள்
  rationale: எபிரெய இணைப்புச்சொல் சொற்பட ‘மற்றும்’ என்றாலும், எகிப்தியரின் முடிவுக்கும் இஸ்ரவேலரின் பாதுகாப்பான கடத்தலுக்கும் இடையிலான தெளிவான எதிர்மறைத் தொடர்பைத் தமிழில் ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது. ‘இஸ்ரவேல் மக்கள்’ என்பது בְּנֵי יִשְׂרָאֵל என்பதற்கான உள்ளடக்கமான இயல்பான தமிழ்.
- source_word: בַּיַּבָּשָׁה בְּתוֹךְ הַיָּם
  choice: கடலின் நடுவே உலர்ந்த தரையில்
  rationale: கடலின் மத்தியில் இருந்த பாதை உலர்ந்திருந்தது என்ற காட்சியைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் வரும் தனிப்பட்ட இறைப்பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து பாதுகாக்கிறது.
- issue: וּבְנֵי יִשְׂרָאֵל முன் உள்ள וְ இணைப்பின் பொருள்
  choice: ஆனால்
  alternative: மற்றும்
  rationale: மூலத்தில் எளிய இணைப்புச்சொல் உள்ளது; இங்கு சூழலால் வெளிப்படும் வலுவான முரண்பாட்டைத் தமிழில் ‘ஆனால்’ தெளிவாக்குகிறது, புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான நடை. ஒருமை வடிவங்களின் தொகுப்பொருள் தமிழில் பன்மையாக வெளிப்படுத்தப்பட்டுள்ளது. மூலத்தின் காரண/காலத் தொடர்பும், எகிப்திய படைக்கும் இஸ்ரவேல் மக்களுக்கும் இடையிலான முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன.
