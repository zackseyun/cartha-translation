    rationale: தமிழ் முதன்மை உரை இயல்பாக இருந்தாலும், மூல ஒருமைச் சொல்லின் தொகுப்பொருளையும் எளிய וְ இணைப்பை ‘ஆனால்’ என வெளிப்படுத்தியதையும் வெளிப்படையாகப் பதிவு செய்வது audit trail-ஐப் பாதுகாக்கும்.
