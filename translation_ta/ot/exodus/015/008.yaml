  source_fidelity: 'மொத்தத்தில் எபிரெயக் கவித்துவப் படிமங்கள் நன்றாகத் தக்கவைக்கப்பட்டுள்ளன: நாசிகளின் மூச்சு/காற்று, நீர் குவிதல், குவியல்போல் நிற்றல், ஆழங்கள் உறைதல், கடலின் இதயம் ஆகியவை மூலத்துடன் ஒத்துள்ளன. ஆனால் נֹזְלִים (‘பாயும்/ஓடும் நீர்கள்’) என்பதன் பன்மைத் தன்மையும், நான்கு முக்கியச் சொற்றொடர்களின் இணையான கவிதை அமைப்பும் தமிழில் மேலும் தெளிவாகக் காட்டப்பட வேண்டும்.'
  naturalness: ‘மூச்சுக் காற்றால்’ புரிந்துகொள்ளக்கூடியது; எனினும் ‘நாசிகளிலிருந்து வந்த பெருமூச்சால்’ என்பது வலிமையான வெளிமூச்சின் படிமத்தை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது. ‘நீர்’ என்ற ஒருமை-கூட்டுப்பெயருக்குப் பதிலாக ‘நீர்கள்’ பயன்படுத்துவது இவ்வசனத்தின் இரண்டு நீர்ப் படிமங்களையும் தெளிவாக வேறுபடுத்தி, ‘பாய்ந்தோடும் நீர்கள்’ உடன் இயல்பான பன்மை வினைகளை அனுமதிக்கிறது.
  terminology: ‘நாசிகள்,’ ‘குவியல்,’ ‘ஆழங்கள்,’ ‘கடலின் இதயம்’ ஆகியவை பொருத்தமானவை. ‘உறைந்தன’ என்பது קָפְאוּ-க்குச் சாத்தியமான நேரடியான மொழிபெயர்ப்பு; மாற்றாக ‘இறுகின’ என அடிக்குறிப்பில் தரலாம். ‘கடலின் இதயத்தில்’ என்பதற்கான விளக்க அடிக்குறிப்பு சரியான இடத்தில் உள்ளது.
