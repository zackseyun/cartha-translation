source:
  edition: WLC
  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: ta
  text: உமது நாசிகளிலிருந்து வந்த பெருமூச்சால்[a] நீர்கள் குவிந்தன; பாய்ந்தோடும் நீர்கள் குவியல்போல்[b] நின்றன; கடலின் இதயத்தில்[c] ஆழங்கள் உறைந்தன[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது நாசிகளின் காற்றால்.’
    reason: רוּחַ என்பது ‘மூச்சு’ என்றும் ‘காற்று’ என்றும் பொருள்படலாம்.
  - marker: b
    text: ‘குவியல்’ என்பது எபிரெயப் பெயர்ச்சொல்லின் நேரடிப் பொருள்; தொடர்புடைய கடல் கடத்தல் படிமத்தின் அடிப்படையில் சில மொழிபெயர்ப்புகள் ‘சுவர்’ எனக் கூறுகின்றன.
    reason: נֵד என்பதற்கான சொல்லியல் மாற்றை விளக்குகிறது.
  - marker: c
    text: அதாவது, ‘கடலின் நடுவில்.’
    reason: ‘கடலின் இதயத்தில்’ என்ற எபிரெய உருவகச் சொற்றொடரின் கருத்தை விளக்குகிறது.
  - marker: d
    text: அல்லது, ‘இறுகின.’ இவ்வினை தடித்தல், இறுகுதல் அல்லது உறைதலைக் குறிக்கலாம்.
    reason: קָפְאוּ என்பதன் பொருள் வரம்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: உமது நாசிகளின் மூச்சுக் காற்றால்
  rationale: רוּחַ என்பது காற்று அல்லது மூச்சு எனப் பொருள்படும்; אַפֶּיךָ இங்கு நாசிகளைக் குறிக்கிறது. இறைவனுடைய வல்லமையான வெளிமூச்சைச் சித்தரிக்கும் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: נֶעֶרְמוּ מַיִם
  choice: நீர் குவிந்தது
  rationale: נֶעֶרְמוּ என்பது குவிதல் அல்லது குவிக்கப்படுதல் என்ற படிமத்தைக் கொண்டது. தமிழில் கூட்டுப் பொருளாகிய ‘நீர்’ உடன் ஒருமை வினை இயல்பாக அமைகிறது.
- source_word: נִצְּבוּ כְמוֹ נֵד נֹזְלִים
  choice: பாய்ந்தோடும் நீர் குவியல்போல் நின்றது
  rationale: נֹזְלִים என்பதன் பாயும் தன்மையையும், נֵד என்பதன் முதன்மைப் பொருளான குவியலையும், נִצְּבוּ என்பதன் ‘நின்றது’ என்ற நேரடிப் பொருளையும் காக்கிறது.
- source_word: קָפְאוּ תְהֹמֹת
  choice: ஆழங்கள் உறைந்தன
  rationale: קָפְאוּ என்பது இறுகுதல், தடித்தல் அல்லது உறைதல் எனக் குறிக்கலாம். ‘உறைந்தன’ கவிதைநயத்துடன் பொருளைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּלֶב יָם
  choice: கடலின் இதயத்தில்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான ‘கடலின் இதயத்தில்’ என்ற கவித்துவ உருவகத்தைத் தக்கவைக்கிறது; அது கடலின் நடுப்பகுதியைக் குறிக்கும்.
theological_decisions:
- issue: கடவுளை மனித உடல் உருவகத்தில் சித்தரித்தல்
  choice: ‘உமது நாசிகளின் மூச்சுக் காற்றால்’ என்று உறுதியான உடல் உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உமது கோபத்தால்’ என்று கருத்தாக்கமாக மொழிபெயர்த்தல்
  rationale: மூல எபிரெயம் கடவுளின் வல்லமையான செயலை நாசிகளிலிருந்து வரும் மூச்சு அல்லது காற்றாகக் கவிதைமயமாகச் சித்தரிக்கிறது. அதை ‘கோபம்’ என்று மாற்றுவது இவ்விடத்தின் குறிப்பான உருவகத்தை மறைத்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பாடலுக்குரிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நாசிகள்,’ ‘குவியல்,’ ‘கடலின் இதயம்’ ஆகிய மூலப் படிமங்கள் எளிமைப்படுத்தி அழிக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளன; தெளிவுக்காக மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
