  to: உமது நாசிகளிலிருந்து வந்த பெருமூச்சால்[a] நீர்கள் குவிந்தன; பாய்ந்தோடும் நீர்கள் குவியல்போல்[b] நின்றன; கடலின் இதயத்தில்[c] ஆழங்கள் உறைந்தன[d].
  rationale: திருத்தம் மூல எபிரெயத்தின் பன்மை வினை வடிவங்களையும் இணையான கவிதை வரிசைகளையும் தமிழில் தெளிவாக்குகிறது. ‘பெருமூச்சு’ என்பது நாசிகளோடு இணைந்த ருּஅḥ-இன் வலிமையான வெளிமூச்சுப் படிமத்தைத் தக்கவைக்கிறது; அதை கோபம் போன்ற கருத்தாக்கமாக மாற்றவில்லை. அடிக்குறிப்பு அடையாளங்களும் அவை சுட்டும் சொற்றொடர்களும் மாற்றமின்றி சரியாகப் பாதுகாக்கப்பட்டுள்ளன.
