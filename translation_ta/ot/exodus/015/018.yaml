base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/018.yaml
  text: Yahweh will reign forever and ever[a].
translation:
  language: ta
  text: யாவே என்றென்றைக்கும் அரசாளுவார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH” (יהוה). மரபாக “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது; மாற்றாக, “யாவே” என்று ஒலிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יִמְלֹךְ
  choice: அரசாளுவார்
  rationale: מלך என்பதன் அரசருக்குரிய ஆட்சிப் பொருளைத் தெளிவாகக் காட்டுகிறது; இச்சூழலில் எபிரெய வினைமுற்றின் எதிர்கால நோக்கையும் தமிழ் வினை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְעֹלָם וָעֶד
  choice: என்றென்றைக்கும்
  rationale: எல்லையற்ற காலத்தைக் குறிப்பதோடு, எபிரெய இரட்டைச் சொல்லாட்சியின் வலியுறுத்தலையும் இயல்பான நவீன தமிழில் சுருக்கமாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, தேவனுடைய தனிப்பெயரே உள்ளது. ஆகவே அதைத் தமிழில் ஒலிபெயர்த்து, மரபான பட்ட மொழிபெயர்ப்பை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: יִמְלֹךְ என்பதன் காலமும் பொருளும்
  choice: அரசாளுவார்
  alternative: அரசாளுகிறார்; அரசராக இருப்பார்
  rationale: வெற்றிப் பாடலின் நிறைவில் யாவேயின் முடிவில்லாத அரசாட்சியை அறிவிக்கும் எதிர்காலத் தொனியைப் பாதுகாக்கிறது; அதேவேளை ஆட்சிசெய்தல் என்ற அரசருக்குரிய பொருளையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: சுருக்கமான பாடல் வரியின் மகத்துவமும் அறிவிப்புத் தொனியும் காக்கப்பட்டுள்ளன. “என்றென்றைக்கும்” என்பது நவீன வாசகர்களுக்கு இயல்பாகவும், மூலத்தின் கால வலியுறுத்தலைத் தக்கவைக்கும் வகையிலும் உள்ளது.
