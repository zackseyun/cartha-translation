  text: וַ/יָּבֹ֣אוּ מָרָ֔תָ/ה וְ/לֹ֣א יָֽכְל֗וּ לִ/שְׁתֹּ֥ת מַ֨יִם֙ מִ/מָּרָ֔ה כִּ֥י מָרִ֖ים הֵ֑ם עַל כֵּ֥ן קָרָֽא שְׁמָ֖/הּ מָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: ta
  text: பின்பு அவர்கள் மாராவுக்கு[a] வந்தார்கள். ஆனால், மாராவிலிருந்த தண்ணீர் கசப்பாக இருந்ததால், அவர்களால் அதைக் குடிக்க முடியவில்லை. ஆகவே அதற்கு மாரா என்று பெயரிடப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாரா” என்ற பெயர், “கசப்பு” என்று பொருள்படும் எபிரெயச் சொல்லைப் போல ஒலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: பின்பு அவர்கள் வந்தார்கள்
  rationale: Wayyiqtol வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பான தொடர்ச்சியைப் ‘பின்பு’ வெளிப்படுத்துகிறது.
- source_word: מָרָתָה
  choice: மாராவுக்கு
  rationale: இடப்பெயருடன் சேர்ந்த directional he இலக்கைச் சுட்டுகிறது; தமிழில் ‘-க்கு’ இயல்பான இயக்க இலக்கு உருபாகும்.
- source_word: וְלֹא יָכְלוּ לִשְׁתֹּת
  choice: ஆனால் அவர்களால் அதைக் குடிக்க முடியவில்லை
  rationale: வருகைக்கும் குடிக்க இயலாமைக்கும் இடையிலான முரணை ‘ஆனால்’ தெளிவாக்குகிறது; יכל அமைப்பை ‘அவர்களால்... முடியவில்லை’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: מַיִם מִמָּרָה
  choice: மாராவின் தண்ணீர்
  rationale: מן மூலத்தைக் குறித்தாலும், குறிப்பிட்ட இடத்திலிருந்த தண்ணீரை நவீன தமிழில் ‘மாராவின் தண்ணீர்’ என்று சொல்வது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: כִּי מָרִים הֵם
  choice: தண்ணீர் கசப்பாக இருந்ததால்
  rationale: כִּי-யின் காரணப் பொருளை ‘-தால்’ தருகிறது. எபிரெயில் predicate பன்மையாக இருந்தாலும், தமிழில் ‘தண்ணீர்’ ஒருமைப் பொருண்மைப் பெயராக இயல்பாகக் கையாளப்படுகிறது.
- source_word: עַל כֵּן
  choice: ஆகவே
  rationale: பெயரிடப்பட்டதற்கான காரணவிளைவைச் சுட்டும் இயல்பான தமிழ்ச் சொல்.
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: அந்த இடத்திற்கு மாரா என்று பெயரிடப்பட்டது
  rationale: வினைக்கு வெளிப்படையான எழுவாய் இல்லை; எழுவாயை ஊகிக்காமல் தமிழின் செயப்பாட்டு அமைப்பு impersonal naming construction-ஐப் பாதுகாக்கிறது.
- source_word: מָרָה / מָרִים
  choice: மாரா / கசப்பு
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்படுகிறது; பெயருக்கும் ‘கசப்பு’ என்ற பொருளுக்கும் உள்ள எபிரெயச் சொல்விளையாட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது.
