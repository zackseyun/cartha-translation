translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் பெயரிடுபவர் வெளிப்படையாகக் குறிப்பிடப்படாததால், எந்த நபரையும் சேர்க்காமல் செயப்பாட்டு வடிவம் தேர்ந்தெடுக்கப்பட்டது.
