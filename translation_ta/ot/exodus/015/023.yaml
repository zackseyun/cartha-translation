- from: பின்பு அவர்கள் மாராவுக்கு[a] வந்தார்கள். ஆனால் மாராவின் தண்ணீர் கசப்பாக இருந்ததால், அவர்களால் அதைக் குடிக்க முடியவில்லை. ஆகவே, அந்த இடத்திற்கு மாரா என்று பெயரிடப்பட்டது.
  to: பின்பு அவர்கள் மாராவுக்கு[a] வந்தார்கள். ஆனால், மாராவிலிருந்த தண்ணீர் கசப்பாக இருந்ததால், அவர்களால் அதைக் குடிக்க முடியவில்லை. ஆகவே அதற்கு மாரா என்று பெயரிடப்பட்டது.
