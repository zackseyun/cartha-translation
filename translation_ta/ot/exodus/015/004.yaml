  source_fidelity: 'மூல எபிரேயத்தின் இணைச்சொல் அமைப்பும் வினைப் பொருளும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன: பார்வோனின் தேர்களும் படையும் கடலுக்குள் எறியப்படுதல், அவனுடைய தேர்ந்தெடுக்கப்பட்ட உயர்நிலை இராணுவ அதிகாரிகள் நாணற்கடலில் மூழ்கடிக்கப்படுதல் ஆகியவை துல்லியமாக வெளிப்படுகின்றன. יָם־סוּף என்பதற்கான சொற்பொருள் மொழிபெயர்ப்பு முதன்மை உரையில் உள்ளது; மரபுவழி மாற்றுப்பெயர் அடிக்குறிப்பில் சரியாகக் கொடுக்கப்பட்டுள்ளது.'
