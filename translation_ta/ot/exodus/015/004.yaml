source:
  edition: WLC
  text: מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְ/חֵיל֖/וֹ יָרָ֣ה בַ/יָּ֑ם וּ/מִבְחַ֥ר שָֽׁלִשָׁ֖י/ו טֻבְּע֥וּ בְ/יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: ta
  text: பார்வோனின் தேர்களையும் அவனுடைய படையையும் அவர் கடலுக்குள் எறிந்தார்; அவனுடைய தலைசிறந்த படைத்தலைவர்கள் நாணற்கடலில்[a] மூழ்கடிக்கப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக “செங்கடல்” என்று மொழிபெயர்க்கப்படுகிறது. எபிரெய மொழியில் “நாணற்கடல்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: தேர்கள்
  rationale: பார்வோனின் போர்த் தேர்களை இயல்பாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: פַּרְעֹה
  choice: பார்வோன்
  rationale: எகிப்திய அரசருக்கான பட்டத்தின் தமிழ் வேதாகம மரபில் அறியப்பட்ட வடிவம்.
- source_word: וְחֵילוֹ
  choice: அவனுடைய படை
  rationale: இச்சூழலில் חַיִל செல்வத்தையோ பொதுவான வலிமையையோ அல்ல, இராணுவப் படையைக் குறிக்கிறது.
- source_word: יָרָה
  choice: எறிந்தார்
  rationale: எறிதல் அல்லது வீசுதல் என்ற வினையின் வலிமையைத் தக்கவைக்கிறது; மறைமுக எழுவாயாகிய தேவனை மரியாதைப் பன்மையால் சுட்டுகிறது.
- source_word: בַיָּם
  choice: கடலுக்குள்
  rationale: எறிதல் என்ற வினையுடன் இயக்கத்தையும் நீருக்குள் சென்றதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמִבְחַר
  choice: தலைசிறந்த
  rationale: தேர்ந்தெடுக்கப்பட்ட மிகச் சிறந்தவர்கள் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: שָׁלִשָׁיו
  choice: அவனுடைய படைத்தலைவர்கள்
  rationale: உயர்நிலை இராணுவ அதிகாரிகளைச் சுட்டுகிறது; தேர்ப்படை அதிகாரிகள் என்று ஆதாரத்தைவிடக் குறுகலாக வரையறுப்பதைத் தவிர்க்கிறது.
- source_word: טֻבְּעוּ
  choice: மூழ்கடிக்கப்பட்டார்கள்
  rationale: எபிரெய வினையின் செயப்பாட்டு வடிவத்தையும் நீரில் அமிழ்த்தப்பட்ட படிமத்தையும் பாதுகாக்கிறது.
- source_word: בְיַם סוּף
  choice: நாணற்கடலில்
  rationale: יַם סוּף என்பதன் சொற்பொருளான ‘நாணல்களின் கடல்’ என்பதைக் கச்சிதமான தமிழ்ப் பெயராக வழங்குகிறது; பரவலான மரபுவழிப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יַם סוּף என்பதன் மொழிபெயர்ப்பு
  choice: நாணற்கடல்
  alternative: செங்கடல்
  rationale: மூலமொழிக்கு முன்னுரிமை அளித்து ‘நாணல்களின் கடல்’ என்ற பொருள் முதன்மை உரையில் வைக்கப்படுகிறது; வாசகர்கள் அறிந்த மரபுவழி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יָרָה என்ற வினையின் வெளிப்படாத எழுவாய்
  choice: அவர்
  alternative: யெகோவா / ஆண்டவர்
  rationale: பாடலின் முந்தைய சூழலில் எழுவாய் தேவன் என்பது தெளிவாயினும், இவ்வசனத்தில் தெய்வப் பெயர் மீண்டும் சொல்லப்படவில்லை. ஆகவே பெயரைச் சேர்க்காமல் பிரதிப்பெயர் மூலம் மூலத்தின் கவித்துவத் தொடர்ச்சி காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பாடலுக்கேற்ற கண்ணியமான தொனியுடன் அமைக்கப்பட்டது. ‘தேர்கள்’, ‘படை’, ‘படைத்தலைவர்கள்’ போன்ற சொற்கள் பொதுவாசகருக்குத் தெளிவாக உள்ளன. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘நாணற்கடலில்’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
