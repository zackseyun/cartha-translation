  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “உன் கடவுளாகிய யாவேயின் குரலை நீ கவனமாகக் கேட்டு, அவருடைய பார்வையில் சரியானதைச் செய்து, அவருடைய கட்டளைகளுக்குச் செவிகொடுத்து, அவருடைய எல்லா விதிமுறைகளையும் கடைப்பிடித்தால், எகிப்தில் நான் வரச்செய்த நோய்களில் எதையும் உன்மேல் வரச்செய்யமாட்டேன். ஏனெனில், நானே உன்னைக் குணமாக்குகிற யாவே.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில், நானே உன் குணமாக்குபவராகிய யாவே.”
    reason: רֹפְאֶךָ என்ற பங்கேற்புச் சொல்லை வினைநிலையாகவும் பெயர்நிலையாகவும் இயல்பாகப் புரிந்துகொள்ள முடியும்.
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: கவனமாகக் கேட்டு
  rationale: முடிவிலியுடன் வினைச்சொல் திரும்ப வருவது கேட்பதின் தீவிரத்தையும் கீழ்ப்படிதலுடன் கூடிய கவனத்தையும் வலியுறுத்துகிறது; தமிழில் இயல்பாக இதை வெளிப்படுத்துகிறது.
- source_word: לְקוֹל
  choice: குரலை
  rationale: எபிரெயச் சொல்லின் நேரடியான ‘குரல்’ பொருளையும் ‘ஒருவரின் குரலைக் கேட்பது’ என்ற இயல்பான சொற்றொடரையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துகளைக் கொண்ட தெய்வீகப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் தனிப்பெயராகக் காட்டுகிறது.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: அவருடைய பார்வையில் நேர்மையானதை
  rationale: ‘அவருடைய கண்களில் நேரானது’ என்ற மூல மொழி வழக்கின் ஒழுக்கப் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: וְהַאֲזַנְתָּ
  choice: செவிகொடுத்து
  rationale: முன்னுள்ள ‘கேட்டு’ என்பதிலிருந்து வேறுபட்டு, உன்னிப்பாகக் கவனித்துக் கேட்பதைக் குறிக்கிறது.
- source_word: לְמִצְוֺתָיו
  choice: அவருடைய கட்டளைகளுக்கு
  rationale: உடன்படிக்கைச் சூழலில் מִצְוֹת என்பதன் சட்டபூர்வமான பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: וְשָׁמַרְתָּ כָּל חֻקָּיו
  choice: அவருடைய எல்லாச் சட்டங்களையும் கடைப்பிடித்தால்
  rationale: שׁמר என்பதன் ‘கடைப்பிடி’ என்ற சட்டச் சூழல் பொருளையும் חֻקִּים என்பதன் நிர்ணயிக்கப்பட்ட சட்டங்கள் என்ற பொருளையும் தருகிறது.
- source_word: כָּל הַמַּחֲלָה
  choice: நோய்களில் எதையும்
  rationale: ஒருமைத் தொகுப்புப் பெயரைத் தமிழில் இயல்பான பன்மை மறுப்பு அமைப்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם ... לֹא אָשִׂים עָלֶיךָ
  choice: எகிப்தின்மேல் நான் வரச்செய்த ... எதையும் உன்மேல் வரச்செய்யமாட்டேன்
  rationale: שׂים என்ற ஒரே வேரின் மீளுரையை இரு இடங்களிலும் ஒரே சொல்லாக்கத்தால் காக்கிறது; ‘வைத்தல்’ என்பதைவிட நோய் தொடர்பில் ‘வரச்செய்தல்’ நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: רֹפְאֶךָ
  choice: உன்னைக் குணமாக்குகிற
  rationale: செயற்பெயரெச்சத்தின் தொடர்ச்சியான/பண்புரைக்கும் வினைநிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூல உரை உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராக வழங்கப்படுகிறது; தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: நோய் குறித்த வாக்குறுதியின் இயல்பு
  choice: கீழ்ப்படிந்து கேட்பதை நிபந்தனையாகக் கொண்ட, எகிப்தின்மேல் வந்த நோய்களை இஸ்ரவேலின்மேல் வரச்செய்யாத உடன்படிக்கை வாக்குறுதி
  alternative: எல்லாச் சூழல்களிலும் ஒவ்வொரு தனிநபருக்கும் உடல் குணமளிப்பு உறுதி; முற்றிலும் உருவகமான ஆன்மீக குணமாக்குதல்
  rationale: வசனத்தின் நிபந்தனை அமைப்பும் எகிப்தின் வரலாற்றுத் தீர்ப்பைக் குறிக்கும் சூழலும் அப்படியே காக்கப்படுகின்றன; பிற்காலக் கோட்பாடுகள் உரைக்குள் சேர்க்கப்படவில்லை.
- issue: רֹפְאֶךָ என்பதன் இலக்கண நுணுக்கம்
  choice: உன்னைக் குணமாக்குகிற யெகோவா
  alternative: உன் குணமாக்குபவராகிய யெகோவா
  rationale: எபிரெயப் பங்கேற்புச் சொல்லை வினைநிலை வாசிப்பாக முதன்மை உரை வழங்குகிறது; பெயர்நிலை வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ஒருமை இரண்டாம் நபர் வடிவங்கள் மூல உரைக்கு ஏற்ப காக்கப்பட்டுள்ளன. ‘குரல்’, ‘செவிகொடுத்து’, ‘கட்டளைகள்’, ‘சட்டங்கள்’ ஆகிய வேறுபாடுகள் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
