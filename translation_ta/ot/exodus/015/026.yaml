    issue: ‘எகிப்தின்மேல்’ translates בְמִצְרַיִם less closely.
    rationale: The Hebrew preposition is locative (‘in Egypt’). ‘எகிப்தில் நான் வரச்செய்த’ is natural Tamil and avoids shifting the expressed relation.
