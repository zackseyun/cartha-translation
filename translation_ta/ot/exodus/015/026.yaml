  to: 'அவர் சொன்னார்: “உன் கடவுளாகிய யாவேயின் குரலை நீ கவனமாகக் கேட்டு, அவருடைய பார்வையில் சரியானதைச் செய்து, அவருடைய கட்டளைகளுக்குச் செவிகொடுத்து, அவருடைய எல்லா விதிமுறைகளையும் கடைப்பிடித்தால், எகிப்தில் நான் வரச்செய்த நோய்களில் எதையும் உன்மேல் வரச்செய்யமாட்டேன். ஏனெனில், நானே உன்னைக் குணமாக்குகிற யாவே.”[a]'
