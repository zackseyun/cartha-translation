base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: ta
  text: பின்பு அவர்கள் ஏலிமுக்கு வந்தார்கள். அங்கே பன்னிரண்டு நீரூற்றுகளும் எழுபது பேரீச்ச மரங்களும்[a] இருந்தன. அவர்கள் அங்கே தண்ணீரருகே[b] முகாமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பேரீச்ச மரங்கள்’ என்பதைப் பொதுவாக ‘பனைமரங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தண்ணீர்’ என்பதற்கான எபிரெயச் சொல் பன்மை வடிவில் உள்ளது; அது பெரும்பாலும் நீரைத் தொகுப்பாகக் குறிக்கிறது. எனவே ‘நீர்நிலைகளருகே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: பின்பு அவர்கள் வந்தார்கள்
  rationale: Wayyiqtol வடிவம் கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; நவீன தமிழில் இயல்பான தொடர்ச்சியை ‘பின்பு’ வெளிப்படுத்துகிறது.
- source_word: אֵילִמָה
  choice: ஏலிமுக்கு
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டு, சொல்லிலுள்ள திசைகாட்டும் -ה ‘-க்கு’ என்பதால் வெளிப்படுத்தப்படுகிறது.
- source_word: וְשָׁם
  choice: அங்கே
  rationale: எபிரெயச் சொல்லின் இடப்பொருளை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: שְׁתֵּים עֶשְׂרֵה עֵינֹת מַיִם
  choice: பன்னிரண்டு நீரூற்றுகள்
  rationale: עַיִן இச்சூழலில் இயற்கையான நீரூற்றைக் குறிக்கிறது; ‘நீரூற்றுகள்’ நவீன தமிழில் தெளிவான சொல்.
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: எழுபது பேரீச்ச மரங்கள்
  rationale: תָּמָר என்பது பொதுவான பனைமரத்தைவிட குறிப்பாகப் பேரீச்ச மரத்தைக் குறிக்கக்கூடும்; பாலைவனச் சோலைச் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: וַיַּחֲנוּ
  choice: முகாமிட்டார்கள்
  rationale: חנה என்பதன் ‘தங்கி முகாமிடுதல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: עַל הַמָּיִם
  choice: தண்ணீரருகே
  rationale: இங்கு עַל மேலிருப்பதை அல்ல, நீர்நிலைக்கு அருகிலுள்ள இடத்தைக் குறிக்கிறது; ‘தண்ணீரருகே’ சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
