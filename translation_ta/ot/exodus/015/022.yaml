base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: ta
  text: பின்பு மோசே இஸ்ரவேலரை நாணல் கடலிலிருந்து[a] புறப்படச் செய்தார்; அவர்கள் சூர் வனாந்தரத்திற்குள் சென்றார்கள். அவர்கள் வனாந்தரத்தில் மூன்று நாட்கள் நடந்தார்கள்; தண்ணீர் எதுவும் கிடைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபுவழியாக ‘செங்கடல்’ என்று மொழிபெயர்க்கப்படுகிறது; எபிரெயத்தில் ‘நாணல் கடல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: புறப்படச் செய்தார்
  rationale: 'נסע என்பதன் ஹிஃபில் வடிவம் இங்கு காரணவினைப் பொருளைத் தருகிறது: மோசே இஸ்ரவேலரை அங்கிருந்து பயணத்தைத் தொடரச் செய்தார். தமிழ் நடையில் இந்த காரணவினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.'
- source_word: מִיַּם־סוּף
  choice: நாணல் கடலிலிருந்து
  rationale: יָם־סוּף என்பதன் எபிரெய நேரடிப் பொருள் ‘நாணல் கடல்.’ மொழிபெயர்ப்பு மரபில் உள்ள ‘செங்கடல்’ என்பதற்குப் பதிலாக மூலமொழிப் பொருள் முதன்மை உரையில் வைக்கப்பட்டு, மரபுவழிப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִדְבַּר שׁוּר
  choice: சூர் வனாந்தரம்
  rationale: מִדְבָּר என்பது குடியிருப்பற்ற வறண்ட அல்லது காட்டுப்புற நிலத்தைக் குறிக்கலாம்; மணற்பாலை மட்டுமே எனக் குறுக்காமல், கண்ணியமான வேதாகமத் தமிழில் ‘வனாந்தரம்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: וַיֵּצְאוּ
  choice: சென்றார்கள்
  rationale: יצא என்பதன் அடிப்படைப் பொருள் ‘வெளியேறு/புறப்பட்டுச் செல்.’ கடற்பகுதியிலிருந்து சூர் வனாந்தரத்திற்கான நகர்வை இயல்பான தமிழில் ‘சென்றார்கள்’ எனத் தெரிவிக்கிறது.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: மூன்று நாட்கள்
  rationale: இது காலநீட்சியைக் குறிக்கும் வேற்றுமை அமைப்பு. ‘மூன்று நாள் பயணம்’ என்ற கூடுதல் விளக்கத்தைச் சேர்க்காமல், மூலத்தின் எளிய காலக்குறிப்பு பாதுகாக்கப்படுகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: בְּ முன்னிடைச்சொல்லின் நேரடிப் பொருளான ‘இல்’ பாதுகாக்கப்படுகிறது; ‘வனாந்தரத்தின் வழியாக’ என்று திசை அல்லது கடத்தலை அதிகமாக விளக்கவில்லை.
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: அவர்களுக்குத் தண்ணீர் கிடைக்கவில்லை
  rationale: ‘தண்ணீரைக் காணவில்லை’ என்பதைவிட இச்சூழலில் இயல்பான நவீனத் தமிழாகவும், தேடியும் தண்ணீர் அகப்படவில்லை என்ற பொருளைத் துல்லியமாகவும் வழங்குகிறது.
