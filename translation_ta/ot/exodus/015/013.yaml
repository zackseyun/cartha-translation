id: EXO.15.13
reference: Exodus 15:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: נָחִ֥יתָ בְ/חַסְדְּ/ךָ֖ עַם ז֣וּ גָּאָ֑לְתָּ נֵהַ֥לְתָּ בְ/עָזְּ/ךָ֖ אֶל נְוֵ֥ה קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: ta
  text: 'உமது நிலையான அன்பினால் நீர் மீட்ட மக்களை[a] வழிநடத்தினீர்;

    உமது வல்லமையால் அவர்களை உமது பரிசுத்த உறைவிடத்திற்கு[b] நடத்திச் சென்றீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீர் மீட்ட இந்த மக்களை.’
    reason: lexical_alternative
  - marker: b
    text: ‘உமது பரிசுத்த உறைவிடம்’ என்பது தேவனுடைய பரிசுத்த பிரசன்னம் விளங்கும் இடத்தைப் பொதுவாகக் குறிக்கலாம்; அது சீனாய், வாக்குத்தத்த நாடு, அல்லது சீயோன்/ஆலயம் என்று பலவாறு புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: வழிநடத்தினீர்
  rationale: נחה என்பதன் ஹிஃபில் வடிவம் ‘வழிநடத்து’ என்ற பொருளைத் தருகிறது. விடுதலை பெற்ற மக்களை தேவன் முன்னே நடத்துவதை இயல்பான தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: בְחַסְדְּךָ
  choice: உமது நிலையான அன்பினால்
  rationale: חֶסֶד என்பது அன்பு, இரக்கம், உறுதியான பற்றுறுதி ஆகிய நுணுக்கங்களை உள்ளடக்குகிறது. ‘நிலையான அன்பு’ அதன் அன்பையும் மாறாத தன்மையையும் தெளிவாகக் காக்கிறது; ב இங்கு செயலை நிறைவேற்றும் அடிப்படையாக ‘-இனால்’ என்று தரப்பட்டுள்ளது.
- source_word: עַם זוּ
  choice: மக்களை
  rationale: கவிதைநடையில் זוּ தொடர்புச் சொல்லாகப் புரிந்துகொள்ளப்படலாம்; தொடர்ந்து வரும் גָּאָלְתָּ அந்த மக்களை அடையாளப்படுத்துகிறது. ‘இந்த மக்கள்’ என்ற சுட்டுப்பொருளும் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: גָּאָלְתָּ
  choice: நீர் மீட்ட
  rationale: גאל என்பது விலைகொடுத்து அல்லது உரிமையுடன் விடுவித்தல், மீட்டல் என்ற உடன்படிக்கை சார்ந்த நிறையைக் கொண்டது. ‘மீட்ட’ என்பது அந்த இறையியல் நிறையையும் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: נֵהַלְתָּ
  choice: நடத்திச் சென்றீர்
  rationale: נהל என்பது அக்கறையுடன் வழிகாட்டி அழைத்துச் செல்வதைக் குறிக்கலாம். முதல் அடியின் ‘வழிநடத்தினீர்’ என்பதிலிருந்து சிறிய சொற்பொருள் வேறுபாட்டைக் காத்து, இலக்கை நோக்கிச் சென்ற இயக்கத்தையும் இது தெரிவிக்கிறது.
- source_word: בְעָזְּךָ
  choice: உமது வல்லமையால்
  rationale: עֹז என்பது வலிமை அல்லது வல்லமையைக் குறிக்கிறது. இங்கு ב கருவிப்பொருளில் இருப்பதால் ‘வல்லமையால்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶל
  choice: -க்கு
  rationale: இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கும் אֶל, ‘உறைவிடத்திற்கு’ என்ற வேற்றுமை உருபால் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது; அதற்குள் நுழைந்தார்கள் என்று தேவையின்றி மிகைப்படுத்தப்படவில்லை.
- source_word: נְוֵה קָדְשֶׁךָ
  choice: உமது பரிசுத்த உறைவிடம்
  rationale: נָוֶה என்பது உறைவிடம், வாழிடம் அல்லது மேய்ச்சல் தங்குமிடம் எனப் பொருள்படலாம். இச்சூழலில் தேவனுடைய பரிசுத்த பிரசன்னம் தங்கும் இடத்தைப் பரந்த வகையில் குறிக்க ‘பரிசுத்த உறைவிடம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: ‘உமது பரிசுத்த உறைவிடம்’ எதைக் குறிக்கிறது?
  choice: தேவனுடைய பரிசுத்த பிரசன்னத்தின் இடத்தைப் பரந்த வகையில் குறிக்கும் சொற்றொடராகவே மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: சீனாய், வாக்குத்தத்த நாடு, அல்லது சீயோன்/ஆலயம் என்று குறிப்பாக அடையாளப்படுத்துதல்.
  rationale: எபிரெயச் சொற்றொடர் ஓர் இடத்தைத் தெளிவாகத் தனித்து அடையாளப்படுத்தவில்லை. கடல்பாட்டின் கவிதைநடை தேவனுடைய மீட்புச் செயலை அதன் பிற்கால இலக்குவரை ஒருங்கே நோக்கக்கூடும்; ஆகவே பிரதான உரை அந்த இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனைச் சுட்டும் ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘நீர்’, ‘-னீர்’ காக்கப்பட்டுள்ளன; இரண்டு இணை அடிகளின் சமநிலையும் இயன்றவரை பேணப்பட்டுள்ளது.
