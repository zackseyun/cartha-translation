lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டமாக மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பின் தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אִישׁ מִלְחָמָה
  choice: ஒரு போர்வீரர்
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘போரின் மனிதர்’ எனும் எபிரெயக் கவித்துவத் தொடர். நவீனத் தமிழில் அதன் பொருளையும் வலிமையையும் இயல்பாக வெளிப்படுத்த ‘ஒரு போர்வீரர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁמוֹ
  choice: என்பது அவர் பெயர்
  rationale: வினைச்சொல் இல்லாத எபிரெய வாக்கியமான ‘யாவே—அவர் பெயர்’ என்பதை இயல்பான தமிழில் தருவதோடு, தெய்வீகப் பெயரின் முன்னிலையையும் வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட இறைப்பெயரே இடம்பெறுகிறது. ஆகவே அதை ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது; ‘யெகோவா’ என்பது மாற்று மரபுவழி வடிவம்.
- issue: אִישׁ מִלְחָמָה என்பதை நேரடியாகவா, மரபுத்தொடரின் பொருள்படவா தருவது
  choice: ஒரு போர்வீரர்
  alternative: போரின் மனிதர்
  rationale: ‘போரின் மனிதர்’ என்பது எபிரெய வடிவத்தை நெருக்கமாகப் பின்பற்றினாலும் தமிழில் இயல்பற்றதாகவும் தவறாகப் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது. ‘போர்வீரர்’ மூல மரபுத்தொடரின் பொருளைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, பொதுவாகப் புரியும், கவித்துவக் கண்ணியமுள்ள தமிழ். கடவுளைக் குறிக்கும் இடத்தில் மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது; எபிரெயத்தின் சுருக்கமான இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
