  terminology: ‘யாவே’ என்பது மூலத்தின் தெய்வீகப் பெயரைப் பட்டமாக மாற்றாமல் காக்கிறது. ‘போர்வீரர்’ என்பது அசல் மரபுத்தொடரான ‘போரின் மனிதர்’ என்பதற்கான சரியான இயல்புத் தமிழாக்கம். குறிப்பு அச்சொல்லின் நேரடித் தோற்றத்தைத் தெளிவாகச் சுட்டுகிறது.
