  rationale: שָׁמְעוּ மற்றும் אָחַז ஆகிய perfect வடிவங்களுடன் இறந்தகாலம் தமிழில் இயல்பான தொடர்ச்சியை அளிக்கிறது; ஆனால் יִרְגָּזוּ/ן imperfect வடிவம் தரும் உயிரோட்டமான நிகழ் அல்லது எதிர்காலச் சாயலை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
