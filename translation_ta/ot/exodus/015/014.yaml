  yaml_path: translation/ot/exodus/015/014.yaml
  text: The peoples heard; they trembled[a]. Anguish seized the inhabitants of Philistia.
translation:
  language: ta
  text: மக்களினங்கள் கேள்விப்பட்டன; அவை நடுங்கின[a]. பெலிஸ்தியாவில் குடியிருப்பவர்களை வேதனை பற்றிக்கொண்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களினங்கள் கேள்விப்பட்டுள்ளன; அவை நடுங்குகின்றன. பெலிஸ்தியாவில் குடியிருப்பவர்களை நடுக்கம் பற்றிக்கொண்டது.” எபிரெயக் கவிதை எளிய இறந்தகாலப் பொருளோடு, உயிரோட்டமான நிகழ்கால அல்லது எதிர்காலச் சாயலையும் அனுமதிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: கேள்விப்பட்டன
  rationale: שׁמע என்பதன் Qal perfect 3cp வடிவம். சுற்றியுள்ள மக்களினங்கள் செய்தியை அறிந்ததைக் குறிக்க, தமிழில் இயல்பான இறந்தகாலச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַמִּים
  choice: மக்களினங்கள்
  rationale: עם என்பதன் பன்மை; சுற்றியுள்ள பல இன மக்களைத் தொகுப்பாகக் குறிக்கிறது. பன்மையையும் கவிதை நடையையும் காக்கிறது.
- source_word: יִרְגָּזוּ/ן
  choice: அவை நடுங்கின
  rationale: רָגַז என்பது பயத்தால் நடுங்குதல், அதிர்தல், கலங்குதல் ஆகிய பொருள்களை உடையது. பாடலின் காலநிலைத் தெளிவின்மையை அடிக்குறிப்பில் காத்து, முதன்மை உரையில் தொடர்ச்சியான இறந்தகாலம் பயன்படுத்தப்பட்டது.
- source_word: חִיל
  choice: வேதனை
  rationale: உடல் மற்றும் உள்ளத்தைப் பற்றும் துயரம், நடுக்கம், பிரசவ வேதனை போன்ற பொருள் வரம்பு இதற்கு உண்டு. இங்கு வெளிப்படையாக இல்லாத பிரசவ உருவகத்தைச் சேர்க்காமல் தீவிரமான துன்பத்தை வெளிப்படுத்துகிறது.
- source_word: אָחַז
  choice: பற்றிக்கொண்டது
  rationale: אחז என்பதன் அடிப்படைப் பொருள் பிடித்தல் அல்லது பற்றுதல். வேதனை ஒருவரை ஆட்கொள்வதைத் தமிழில் இயல்பாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: יֹשְׁבֵי
  choice: குடியிருப்போரை
  rationale: ישׁב என்பதன் பெயர்ச்சொல் இயல்பில் பயன்படுத்தப்பட்ட பங்கேற்பு வடிவம்; ஓர் இடத்தில் வசிப்பவர்களைக் குறிக்கிறது.
- source_word: פְּלָשֶׁת
  choice: பெலிஸ்தியா
  rationale: பெலிஸ்தியரின் நிலப்பகுதியைக் குறிக்கும் இடப்பெயர்; மக்களினப் பெயராக மாற்றாமல் புவியியல் குறிப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: எபிரெயக் கவிதையில் வினைச்சொற்களின் காலநிலை
  choice: முதன்மை உரையில் இறந்தகாலம்
