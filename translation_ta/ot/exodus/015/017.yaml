  source_fidelity: மொத்தத்தில் மூலத்தின் கவிதை அமைப்பும், இரு இறைக் குறிப்புகளின் வேறுபாடும் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் נַחֲלָה என்பதற்கான “உரிமைச் சொத்து” வழக்கமான ‘சுதந்தரம்/பங்காகக் கிடைத்த உடைமை’ என்ற நுண்ணிய பொருளைச் சற்றுக் கடினமாகவும் குறுகலாகவும் காட்டுகிறது. மேலும் ‘மலை—இடம்—பரிசுத்த இடம்’ என்ற மூன்று இணை குறிப்புகளும் ஒரே இடத்தைக் குறிக்கும் அமைப்பைத் தெளிவாக்குவது நல்லது.
  naturalness: “உமது சுதந்தர மலை” நவீனத் தரமான தமிழில் இயல்பாகவும் கவிதைநயத்துடனும் உள்ளது. இடத்தைக் குறிக்கும் மூன்று தொடர்களையும் ஒரே வாக்கியத்தில் அமைத்தால், அவை ‘அவர்களை நாட்டுவீர்’ என்பதோடு தெளிவாக இணையும்.
