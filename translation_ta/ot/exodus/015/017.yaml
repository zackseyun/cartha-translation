  text: תְּבִאֵ֗/מוֹ וְ/תִטָּעֵ֨/מוֹ֙ בְּ/הַ֣ר נַחֲלָֽתְ/ךָ֔ מָכ֧וֹן לְ/שִׁבְתְּ/ךָ֛ פָּעַ֖לְתָּ יְהוָ֑ה מִקְּדָ֕שׁ אֲדֹנָ֖/י כּוֹנְנ֥וּ יָדֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: ta
  text: 'நீர் அவர்களை அழைத்துவந்து,

    உமது சுதந்தர மலையில்[b],

    யாவே, நீர் தங்குவதற்காக ஏற்படுத்திய இடத்தில்,

    ஆண்டவரே[c], உமது கைகள் நிலைநிறுத்திய பரிசுத்த இடத்தில்,

    அவர்களை நாட்டுவீர்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை நிலைநிறுத்துவீர்.” எபிரெய வினையின் நேரடிப் பொருள் “நாட்டுதல்”; பாதுகாப்பாகக் குடியமர்த்தும் உருவகத்தை அது தக்கவைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “உமது சுதந்தர மலை” என்பது கடவுள் தமது மக்களுக்குக் கொடுக்கும் தேசத்தைப் பொதுவாகவோ, கடவுளின் பரிசுத்த இடம் அமைந்த மலையைக் குறிப்பாகவோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: c
    text: இந்த வசனத்தின் எபிரெய உரையில் தனிப்பட்ட இறைப்பெயரான “யாவே” என்பதும், “ஆண்டவர்” என்ற பட்டப்பெயரும் வருகின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: நீர் அவர்களை அழைத்துவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம், அவர்களை ஓர் இடத்திற்குள் கொண்டுவரும் காரணவினைப் பொருளைத் தருகிறது. ‘அழைத்துவந்து’ என்பது அந்த இயக்கத்தையும் இலக்கிடத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְתִטָּעֵמוֹ
  choice: அவர்களை நாட்டுவீர்
  rationale: נטע என்பதன் நேரடிப் பொருள் ‘நடுதல்/நாட்டுதல்.’ இங்கு மக்களைப் பாதுகாப்பாகக் குடியமர்த்துவதற்கான கவிதை உருவகமாக இருப்பதால், உருவகத்தைத் தக்கவைக்க ‘நாட்டுவீர்’ பயன்படுத்தப்படுகிறது.
- source_word: בְּהַר נַחֲלָתְךָ
  choice: உமது உரிமைச் சொத்தாகிய மலையில்
  rationale: இந்தத் தொடர் யாவேக்குச் சொந்தமான பங்காகிய மலையைக் குறிக்கிறது. ‘உரிமைச் சொத்து’ என்பது נַחֲלָה-வின் உடைமை/பங்கு கருத்தைத் தெளிவாகத் தருகிறது; மலை என்ற கவிதைப் படிமமும் காக்கப்படுகிறது.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: நீர் குடியிருப்பதற்காக உருவாக்கிய இடத்தில்
  rationale: מָכוֹן என்பது நிலைநிறுத்தப்பட்ட இடம் அல்லது தளத்தைக் குறிக்கலாம். לְשִׁבְתְּךָ உடன், அது கடவுள் குடியிருப்பதற்கான இடம் எனப் பொருள்படுகிறது. தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘இடத்தில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: פָּעַלְתָּ
  choice: நீர் ... உருவாக்கிய
  rationale: פעל என்பது செய்தல் அல்லது உருவாக்குதல் என்ற பரந்த பொருளுடைய வினை. இங்கு கடவுள் தமது குடியிருப்பிடத்தை உண்டாக்கிய செயலை ‘உருவாக்கிய’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட தனிப்பட்ட இறைப்பெயர். ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: מִקְּדָשׁ
  choice: பரிசுத்த இடம்
  rationale: מִקְדָּשׁ என்பது பரிசுத்தமான இடம் அல்லது சரணாலயத்தைக் குறிக்கிறது. ‘பரிசுத்த இடம்’ அதன் அடிப்படைப் பொருளை எளிய, தற்காலத் தமிழில் தருகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: אֲדֹנָי இங்கு இறைவனுக்கான பட்டப்பெயராக வருகிறது. விளிவடிவிலுள்ள ‘ஆண்டவரே’ கவிதையின் நேரடி அழைப்பைத் தக்கவைத்து, முன் வரும் ‘யாவே’ என்ற பெயரிலிருந்து வேறுபடுத்துகிறது.
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: உமது கைகள் நிறுவிய
  rationale: כון என்ற வினை இங்கு உறுதியாக நிறுவுதல் அல்லது நிலைநாட்டுதல் எனப் பொருள்படுகிறது. ‘உமது கைகள் நிறுவிய’ என்பது மூலத்திலுள்ள மனித உருவகத்தையும் உறுதியான நிறுவுதலையும் காக்கிறது.
theological_decisions:
- issue: ஒரே வசனத்தில் வரும் יְהוָה மற்றும் אֲדֹנָי ஆகிய இரு இறைக் குறிப்புகளை மொழிபெயர்த்தல்
  choice: יְהוָה என்பதை ‘யாவே’ என்றும் אֲדֹנָי என்பதை ‘ஆண்டவர்’ என்றும் வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘ஆண்டவர்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெய உரை தனிப்பட்ட இறைப்பெயரையும் பட்டப்பெயரையும் தனித்தனியாகப் பயன்படுத்துகிறது. தமிழிலும் அந்த வேறுபாட்டைப் பேணுவது மூலத்தின் சொல்லாட்சியைத் தெளிவாகக் காக்கிறது.
- issue: ‘உமது உரிமைச் சொத்தாகிய மலை’ மற்றும் ‘பரிசுத்த இடம்’ ஆகியவற்றின் புவியியல் குறிப்பு
  choice: வாக்குத்தத்த தேசத்தையோ பரிசுத்த இடத்தின் மலையையோ வெளிப்படையாகத் தனித்துக் குறிப்பிடாமல் மூலத்தின் கவிதைத் தொடர்பைத் தக்கவைத்தல்
  alternative: இதனை வெளிப்படையாக சீயோன்/ஆலய மலை என்றோ, கானான் தேசம் முழுவதும் என்றோ விளக்குதல்
  rationale: இந்தக் கவிதை இஸ்ரவேலின் பரந்த குடியேற்றத்தையும் கடவுளின் பரிசுத்த இடத்தையும் ஒருங்கே எதிர்நோக்கக்கூடும். மூல உரை தீர்மானிக்காத சரியான புவியியல் எல்லையை மொழிபெயர்ப்பு கட்டாயமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதையும் கவிதைநயமும் கொண்ட தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘நீர்/உமது’ என்ற உயர்திணை ஒருமை இறைவனை நேரடியாக அழைக்கும் பாடல் நடையைப் பேணுகிறது. வரிப்பிரிப்பு எபிரெயக் கவிதையின் இணை அமைப்பையும் ‘மலை—இடம்—பரிசுத்த இடம்’ என்ற தொடரையும் தெளிவாக்குகிறது.
