  yaml_path: translation/ot/exodus/015/012.yaml
  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: ta
  text: நீர் உமது வலக்கையை நீட்டினீர்; பூமி அவர்களை விழுங்கியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலம் அவர்களை விழுங்கியது”; அல்லது, “தரை அவர்களை விழுங்கியது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָטִיתָ
  choice: நீர் ... நீட்டினீர்
  rationale: נטה என்பதன் Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம்; கடவுளை நேரடியாக மரியாதையுடன் விளிக்கும் தமிழில் ‘நீர் ... நீட்டினீர்’ இயல்பாகவும் மூலத்தின் நிறைவுற்ற செயலைத் தெளிவாகவும் காட்டுகிறது.
- source_word: יְמִינְךָ
  choice: உமது வலக்கையை
  rationale: எபிரெயச் சொல் நேரடியாக ‘உமது வலக்கை’ என்று பொருள்படும். அது வல்லமையைக் குறிக்கும் கவித்துவப் படிமமாக இருந்தாலும், அதை விளக்கமாக மாற்றாமல் உடல் உறுப்பைக் குறிக்கும் மூலப் படிமமே தக்கவைக்கப்படுகிறது.
- source_word: תִּבְלָעֵמוֹ
  choice: அவர்களை விழுங்கியது
  rationale: בלע என்பதன் பொருள் ‘விழுங்குதல்/முற்றிலும் மூடிக்கொள்ளுதல்’; 3fs வினையுடன் 3mp பொருட்சுட்டு இணைந்துள்ளது. ‘விழுங்கியது’ மூலத்தின் உயிரோட்டமான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אָרֶץ
  choice: பூமி
  rationale: אֶרֶץ என்பதற்கு ‘பூமி,’ ‘நிலம்,’ அல்லது ‘தரை’ என்று பொருள் வரலாம். இங்குள்ள வியத்தகு கவித்துவக் காட்சியில் ‘பூமி’ இயல்பாகப் பொருந்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: கடவுளின் செயலை மனித உடல் உறுப்பின் வழியாகச் சித்தரிக்கும் மொழி
  choice: ‘உமது வலக்கை’ என்ற தெளிவான படிமத்தைத் தக்கவைத்தல்
  alternative: ‘உமது வல்லமை’ அல்லது ‘உமது வலிமைமிக்க கை’
  rationale: எபிரெயக் கவிதை கடவுளின் வல்லமையை வலக்கை என்ற உருவகத்தால் வெளிப்படுத்துகிறது. அதை கருத்துரையாக மாற்றாமல் அப்படியே தக்கவைப்பது இலக்கிய மற்றும் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கடவுளை நோக்கிய கவித்துவமும் மரியாதையும் காக்க ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வாக்கியம் சுருக்கமாகவும் பாடல் நடைக்கு ஏற்ற கண்ணியத்துடனும் அமைந்துள்ளது.
