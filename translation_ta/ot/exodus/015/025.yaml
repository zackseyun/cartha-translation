  text: וַ/יִּצְעַ֣ק אֶל יְהוָ֗ה וַ/יּוֹרֵ֤/הוּ יְהוָה֙ עֵ֔ץ וַ/יַּשְׁלֵךְ֙ אֶל הַ/מַּ֔יִם וַֽ/יִּמְתְּק֖וּ הַ/מָּ֑יִם שָׁ֣ם שָׂ֥ם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט וְ/שָׁ֥ם נִסָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: ta
  text: அப்போது அவன் ஆண்டவரை நோக்கிக் கூப்பிட்டான். ஆண்டவர் அவனுக்கு ஒரு மரத்தைக் காட்டினார். அவன் அதைத் தண்ணீரில் எறிந்தபோது, தண்ணீர் இனிப்பானது. அங்கே அவர் அவர்களுக்கு ஒரு நியமத்தையும் நீதிமுறையையும் ஏற்படுத்தினார்; அங்கே அவர்களைச் சோதித்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: கூப்பிட்டான்
  rationale: துயரத்தில் உதவி வேண்டி உரக்க அழைப்பதைக் குறிக்கும் எபிரெய வினையின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயருக்கான மரபாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் வேதாகம வழக்கைத் தொடர்ந்து, பெயரின் தனித்தன்மையை மரியாதையுடன் பிரதிபலிக்கிறது.
- source_word: עֵץ
  choice: ஒரு மரம்
  rationale: இச்சொல்லின் முதன்மைப் பொருள் ‘மரம்’; சூழல் அதை வெட்டப்பட்ட மரத்துண்டு என்று கட்டாயப்படுத்தாததால் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וַיִּמְתְּקוּ הַמָּיִם
  choice: தண்ணீர் இனிப்பானது
  rationale: கசப்புக்கு எதிரான ‘இனிமை’ என்ற மூல உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; வெறுமனே ‘குடிக்கத் தகுந்தது’ என்று விளக்கவில்லை.
- source_word: חֹק וּמִשְׁפָּט
  choice: ஒரு நியமத்தையும் நீதிமுறையையும்
  rationale: இரண்டு தனித்த எபிரெயச் சட்டச் சொற்களையும் வைத்திருக்கிறது; חֹק என்பது நிர்ணயிக்கப்பட்ட விதியையும், מִשְׁפָּט என்பது நீதிசார் ஒழுங்கு அல்லது தீர்ப்பையும் குறிக்கலாம்.
- source_word: נִסָּהוּ
  choice: அவர்களைச் சோதித்தார்
  rationale: இச்சூழலில் ‘சோதித்தல்/பரிசோதித்தல்’ என்ற பொருளை இயல்பாகத் தருகிறது; தீமைக்கு இட்டுச் செல்லும் ‘சோதனை’ என்ற கருத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: שָׂם மற்றும் נִסָּהוּ ஆகியவற்றின் ஒருமை எழுவாய்
  choice: ‘அவர்’ என்பது ஆண்டவரைக் குறிக்கிறது
  alternative: மோசே நியமத்தை ஏற்படுத்தி மக்களைச் சோதித்தான்
  rationale: உடனடி உரையில் ஆண்டவரே மிக இயல்பான எழுவாய்; இருப்பினும் எபிரெயத்தில் எழுவாய் வெளிப்படையாக மீண்டும் குறிப்பிடப்படவில்லை.
- issue: לֹו மற்றும் נִסָּהוּ ஆகிய ஒருமை பின்னொட்டுகளின் கூட்டுப் பொருள்
  choice: தமிழில் ‘அவர்களுக்கு/அவர்களை’ என இஸ்ரவேல் மக்களை கூட்டாகக் குறிப்பிட்டது
  alternative: ‘அவனுக்கு/அவனை’ என ஒருமையில் மொழிபெயர்த்தல்
  rationale: எபிரெய ஒருமை பின்னொட்டு மக்களை ஒரு கூட்டுத் தொகுதியாகக் குறிக்கிறது; இயல்பான தமிழில் பன்மை தெளிவானது.
translation_notes:
  register: நவீன நிலையான தமிழ்; dignified ஆனால் பொதுவாசகர்களுக்கு எளிதான நடை. ‘மரம்’, ‘இனிப்பானது’, ‘நியமம் மற்றும் நீதிமுறை’ ஆகியவை மூலத்தின் சொற்சாயலையும் கருத்து வேறுபாடுகளையும் இயன்றவரை காக்கின்றன.
