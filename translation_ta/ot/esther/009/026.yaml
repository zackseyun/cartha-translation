translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் நீண்ட காரணத் தொடர் மற்றும் அடுத்த வசனத்துடன் தொடரும் நிறைவுறாத வாக்கிய அமைப்பு இறுதியிலுள்ள காற்புள்ளியால் பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
