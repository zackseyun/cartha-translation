base_translation:
  language: en
  yaml_path: translation/ot/esther/009/026.yaml
  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
translation:
  language: ta
  text: ஆகையால், பூர் என்ற பெயரின் அடிப்படையில் இந்த நாட்களைப் பூரீம்[a] என்று அழைத்தார்கள். ஆகையால், இந்தக் கடிதத்தின் எல்லா வார்த்தைகளின் காரணமாகவும், இந்தக் காரியத்தைக் குறித்து அவர்கள் கண்டவற்றின் காரணமாகவும், அவர்களுக்கு நேரிட்டவற்றின் காரணமாகவும்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூரின் பெயரின்படி.” எபிரெயத்தில் சொல்லடியாக, “பூரின் பெயரின்மேல்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள்மேல் வந்தவற்றின் காரணமாகவும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: அழைத்தார்கள்
  rationale: பெயரிடும் சூழலில் வரும் வினை; எபிரெய மொழியின் பொருளுக்கு நெருக்கமாகவும் இயல்பான தமிழாகவும் உள்ளது.
- source_word: לַיָּמִים הָאֵלֶּה
  choice: அந்த நாட்களை
  rationale: சூழலில் ஏற்கெனவே குறிப்பிடப்பட்டுள்ள குறிப்பிட்ட பண்டிகை நாட்களைக் குறிக்க நவீன தமிழில் இயல்பான சுட்டுப்பெயர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: פוּרִים
  choice: பூரீம்
  rationale: பண்டிகையின் தனிப்பெயர் என்பதால் ஒலிபெயர்ப்பு செய்யப்பட்டது; பன்மை வடிவின் நீண்ட உயிரொலியும் பிரதிபலிக்கப்படுகிறது.
- source_word: עַל שֵׁם הַפּוּר
  choice: ‘பூர்’ என்ற பெயரை அடிப்படையாகக் கொண்டு
  rationale: ‘பூரின் பெயரின்படி’ என்ற எபிரெய மரபுத்தொடரின் பெயரியல் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் எடுத்துரைக்கிறது.
- source_word: הַפּוּר
  choice: பூர்
  rationale: பண்டிகைப் பெயருடன் உள்ள சொற்பிறப்புத் தொடர்பைக் காக்க கடன்சொல் வடிவம் பயன்படுத்தப்பட்டது; இதன் பொருள் ‘சீட்டு’ என்பது சூழலில் முன்னரே விளக்கப்பட்டுள்ளது.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: காரணத்திலிருந்து வரும் முடிவைத் தெரிவிப்பதோடு, வசனத்தில் இருமுறை வரும் தொடர் தமிழிலும் இருமுறை காக்கப்படுகிறது.
- source_word: עַל כָּל דִּבְרֵי הָאִגֶּרֶת הַזֹּאת
  choice: இந்தக் கடிதத்தில் எழுதப்பட்டிருந்த எல்லாவற்றின் காரணமாகவும்
  rationale: ‘இந்தக் கடிதத்தின் எல்லா வார்த்தைகள்/காரியங்கள்’ என்ற சொற்றொடரை தமிழில் தெளிவாக வழங்கி, עַל என்பதன் காரணப் பொருளையும் காக்கிறது.
- source_word: וּמָה רָאוּ עַל כָּכָה
  choice: இந்தக் காரியம் தொடர்பாகத் தாங்கள் கண்டவற்றின் காரணமாகவும்
  rationale: ‘கண்டார்கள்’ என்ற அடிப்படைப் பொருளையும் ‘இது தொடர்பாக’ என்ற உறவையும் காக்கிறது; எழுவாய் மக்களே என்பதால் மரியாதைப் பன்மையான ‘தாங்கள்’ பயன்படுத்தப்பட்டது.
- source_word: וּמָה הִגִּיעַ אֲלֵיהֶם
  choice: தங்களுக்கு நேரிட்டவற்றின் காரணமாகவும்
  rationale: ‘அவர்களிடம் வந்தடைந்தது’ என்ற சொல்லடிப் படிமத்தை இயல்பான தமிழில் ‘நேரிட்டது’ என வழங்குகிறது; மாற்றுச் சொல்லடிப் படிமம் அடிக்குறிப்பில் தரப்படுகிறது.
