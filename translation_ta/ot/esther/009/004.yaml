base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
translation:
  language: ta
  text: ஏனெனில், அரசரின் அரண்மனையில் மொர்தெகாய் முக்கியமானவராக இருந்தார்; அவரைப் பற்றிய செய்தி எல்லா மாகாணங்களிலும் பரவிக்கொண்டிருந்தது.[a] ஏனெனில், மொர்தெகாய் தொடர்ந்து மேன்மேலும் உயர்ந்துகொண்டிருந்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய புகழ் எல்லா மாகாணங்களிலும் பரவிக்கொண்டிருந்தது.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அந்த மனிதர் மொர்தெகாய் போய்க்கொண்டும் பெரியவராகிக்கொண்டும் இருந்தார்”; இது ஒருவரின் பெருமை அல்லது செல்வாக்கு தொடர்ந்து உயர்வதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லின் விளக்கத் தன்மையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: גָדוֹל ... בְּבֵית הַמֶּלֶךְ
  choice: அரசரின் அரண்மனையில் ... முக்கியமானவராக
  rationale: גָדוֹל இங்கு உடல் அளவை அல்ல, உயர்ந்த நிலை அல்லது முக்கியத்துவத்தைக் குறிக்கிறது. בְּבֵית הַמֶּלֶךְ என்பதன் அரசவை/அரண்மனைச் சூழலைக் குறுகலாக விளக்காமல் இந்த மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
- source_word: שָׁמְעוֹ
  choice: அவரைப் பற்றிய செய்தி
  rationale: இந்தச் சொல் செய்தி, அறிக்கை, புகழ் ஆகிய பொருள்களை ஏற்கக்கூடும். ‘அவரைப் பற்றிய செய்தி’ என்பது புகழ் என்ற ஒரே பொருளுக்குள் அதைச் சுருக்காமல், பரவிவந்த தகவல் மற்றும் நற்பெயர் ஆகிய இரண்டுக்கும் இடமளிக்கிறது.
- source_word: הוֹלֵךְ בְּכָל הַמְּדִינוֹת
  choice: எல்லா மாகாணங்களிலும் பரவிக்கொண்டிருந்தது
  rationale: ‘செய்தி’ எழுவாயாக இருப்பதால் הוֹלֵךְ குறிக்கும் தொடர்ச்சியான பரவலை இயல்பான தமிழில் தெரிவிக்கிறது; מְדִינוֹת என்பதன் பாரசீக நிர்வாகச் சூழலுக்கு ‘மாகாணங்கள்’ பொருத்தமானது.
- source_word: הָאִישׁ מָרְדֳּכַי
  choice: மொர்தெகாய்
  rationale: எபிரெயத்தில் ‘அந்த மனிதர் மொர்தெகாய்’ என வலியுறுத்தப்பட்டிருந்தாலும், அதைச் சொற்சொல்லாகத் தமிழாக்குவது செயற்கையாக ஒலிக்கும். பெயரை மீண்டும் பயன்படுத்துவது அந்த வலியுறுத்தலை இயல்பாகத் தக்கவைக்கிறது.
- source_word: הוֹלֵךְ וְגָדוֹל
  choice: மேன்மேலும் உயர்வடைந்துகொண்டிருந்தார்
  rationale: தொடர்ந்து அதிகரிக்கும் பெருமை, நிலை, செல்வாக்கு ஆகியவற்றைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
