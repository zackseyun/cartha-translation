  yaml_path: translation/ot/esther/009/023.yaml
  text: So the Jews accepted what they had begun to do[a], and what Mordecai had written to them.
translation:
  language: ta
  text: எனவே யூதர்கள் தாங்கள் செய்யத் தொடங்கியதையும்[a], மொர்தெகாய் தங்களுக்கு எழுதியிருந்ததையும் ஏற்றுக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாங்கள் செய்யத் தொடங்கியதைத் தங்கள்மேல் கடமையாக ஏற்றுக்கொண்டார்கள்.” எபிரெய வினைச்சொல் ஒன்றை ஏற்றுக்கொள்வது அல்லது தம்மீது பொறுப்பாக எடுத்துக்கொள்வது என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבֵּל
  choice: ஏற்றுக்கொண்டார்கள்
  rationale: קבל இச்சூழலில் ஒரு நடைமுறையை ஏற்றுக்கொண்டு தங்கள்மேல் கடமையாக எடுத்துக்கொள்ளும் பொருளைக் கொண்டுள்ளது. ‘ஏற்றுக்கொண்டார்கள்’ என்பது அதன் இயல்பான தமிழ் வடிவம்; வெறுமனே பெற்றுக்கொண்டார்கள் என்ற செயலற்ற பொருளைத் தவிர்க்கிறது.
- source_word: הַיְּהוּדִים
  choice: யூதர்கள்
  rationale: குறிப்பிட்ட மக்களைக் குறிக்கும் எபிரெயப் பெயர்ச்சொல்லின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אֵת אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  choice: தாங்கள் செய்யத் தொடங்கியதையும்
  rationale: הֵחֵלּוּ என்பது ‘தொடங்கினார்கள்’ என்றும் לַעֲשׂוֹת என்பது ‘செய்ய’ என்றும் பொருள்படும். ‘தாங்கள்’ எழுவாயாகிய யூதர்களையே தெளிவாகச் சுட்டுகிறது.
- source_word: וְאֵת אֲשֶׁר
  choice: …தையும்
  rationale: முதல் மற்றும் இரண்டாம் நேரடிச் செயப்படுபொருட்களின் இணையான அமைப்பைத் தமிழில் ‘…தையும் …தையும்’ என்ற வடிவம் இயல்பாகப் பாதுகாக்கிறது.
- source_word: כָּתַב
  choice: எழுதியிருந்ததையும்
  rationale: மொர்தெகாயின் எழுத்து யூதர்களின் ஏற்றுக்கொள்ளுதலுக்கு முன்பே நிகழ்ந்ததைத் தமிழ் இறந்தகால நிறைவுவடிவம் தெளிவாக்குகிறது.
- source_word: מָרְדֳּכַי
  choice: மொர்தெகாய்
  rationale: தனிப்பெயரின் பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பு.
- source_word: אֲלֵיהֶם
  choice: தங்களுக்கு
  rationale: எழுத்து யூதர்களை நோக்கி அனுப்பப்பட்டதைக் காட்டும் இயல்பான தமிழ் வடிவம்; ‘தாங்கள்’ என்பதுடன் ஒருமைப்பாட்டைத் தருகிறது.
