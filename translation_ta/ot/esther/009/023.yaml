translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் இரண்டு இணையான செயப்படுபொருட்களும் ‘…தையும் …தையும்’ எனப் பாதுகாக்கப்பட்டுள்ளன; קבל என்பதிலுள்ள ஏற்றுக்கொள்ளுதல்/கடமையாக மேற்கொள்ளுதல் என்ற நுணுக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
