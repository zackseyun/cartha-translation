  text: And in Susa the citadel[a], the Jews killed and destroyed five hundred men.
translation:
  language: ta
  text: சூசான் கோட்டையிலும் யூதர்கள் ஐந்நூறு ஆண்களைக் கொன்று அழித்தனர்.[a]
