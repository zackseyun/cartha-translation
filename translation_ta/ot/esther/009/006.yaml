lexical_decisions:
- source_word: וּ/בְ/שׁוּשַׁן
  choice: சூசானில்
  rationale: முன்னைய நிகழ்வுடன் தொடர்ச்சியைக் காட்டும் וּ மற்றும் இடப்பொருளைக் காட்டும் בְ ஆகியவை தமிழில் இயல்பான வாக்கிய அமைப்பில் இடப்பொருளால் வெளிப்படுகின்றன; சூசான் என்பது இடப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: הַ/בִּירָה
  choice: கோட்டை
  rationale: בִּירָה என்பது அரண்மனை மட்டும் அல்லாமல் பாதுகாப்பு அரண்களைக் கொண்ட நிர்வாக மையம் அல்லது கோட்டைப் பகுதியையும் குறிக்கலாம்; 'கோட்டை' இங்கு இயல்பான, பரந்த பொருளுடைய தேர்வு.
- source_word: הָרְגוּ
  choice: கொன்று
  rationale: הרג என்பதன் நேரடியான பொருள் 'கொல்'; தொடரும் வினையுடன் இணைக்க தமிழில் வினையெச்ச வடிவம் இயல்பாக உள்ளது.
- source_word: הַ/יְּהוּדִים
  choice: யூதர்கள்
  rationale: எஸ்தர் நூலின் சூழலில் இது இன-சமய மக்களைக் குறிக்கிறது; 'யூதர்கள்' என்பது நவீன தமிழில் தெளிவான வழக்குச் சொல்.
- source_word: וְ/אַבֵּד
  choice: அழித்தார்கள்
  rationale: பியேல் வடிவிலுள்ள אבד அழிவை உண்டாக்குதல் என்ற வலுவான பொருளைக் கொண்டது; எபிரெயத்தின் இரு வினைச்சொல் அமைப்பைப் பாதுகாக்க 'கொன்று அழித்தார்கள்' என்று தனித்தனியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: ஐந்நூறு ஆண்களை
  rationale: אִישׁ ஆண்பால் எண்ணுப்பெயராக வருவதால் பாலினத்தைப் பொதுமைப்படுத்தாமல் 'ஆண்கள்' என்று மொழிபெயர்க்கப்படுகிறது; வேற்றுமை உருபுடன் 'ஆண்களை' என அமைந்துள்ளது.
