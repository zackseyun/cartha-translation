translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியத்தின் கடமை சார்ந்த அமைப்பு, முக்காற்புள்ளிக்குப் பின் அதன் உள்ளடக்கத்தைத் தருவதன் மூலம் தெளிவாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
