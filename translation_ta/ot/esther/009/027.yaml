base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
translation:
  language: ta
  text: 'யூதர்கள், தங்கள் மீதும் தங்கள் சந்ததியினரின் மீதும், தங்களோடு சேர்ந்துகொண்ட அனைவரின் மீதும்[a], இந்தக் கடமையை நிலைநிறுத்தி ஏற்றுக்கொண்டார்கள்: இந்த இரண்டு நாட்களையும் அவற்றுக்கென எழுதப்பட்டபடியும் அவற்றுக்குரிய நேரத்திலும், ஆண்டுதோறும் கடைப்பிடிப்பதைத் தவறவிடக் கூடாது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்களோடு தங்களை இணைத்துக்கொண்ட அனைவரின் மீதும்.’ எபிரெயச் சொல் யூதர்களோடு சேர்ந்த அல்லது தங்களை இணைத்துக்கொண்டவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அது நின்றுபோகக் கூடாது’ அல்லது ‘அது புறக்கணிக்கப்படக் கூடாது.’ இந்த அனுசரிப்பு காலப்போக்கில் கைவிடப்படக் கூடாது என்பதே இத்தொடரின் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִיְּמוּ
  choice: நிலைநிறுத்தி
  rationale: קום என்பதன் காரணவினைப் பொருள் ஒரு ஏற்பாட்டை நிலைபெறச் செய்வதைக் குறிக்கிறது; சட்டபூர்வமாக ஓர் அனுசரிப்பை நிறுவும் சூழலுக்கு ‘நிலைநிறுத்தி’ பொருந்துகிறது.
- source_word: וְקִבֵּל
  choice: ஏற்றுக்கொண்டார்கள்
  rationale: எபிரெய வடிவத்தில் எழுத்து–வாசிப்பு சிக்கல் இருந்தாலும், சூழலில் யூதர்கள் இந்தக் கடமையைத் தங்கள்மேல் ஏற்றுக்கொண்டார்கள் என்பதே பொருள். பன்மை எழுவாய்க்கேற்ப தமிழில் பன்மையாக மொழிபெயர்க்கப்பட்டது.
- source_word: עֲלֵיהֶם
  choice: தங்களுக்கும் … கடமையாக
  rationale: கடமையைத் தங்கள்மேல் ஏற்றுக்கொள்ளுதல் என்ற எபிரெயச் சொல்லாட்சியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: זַרְעָם
  choice: தங்கள் சந்ததியினருக்கும்
  rationale: ‘விதை’ என்ற சொற்பொருளை விட தலைமுறைத் தொடர்ச்சியை இச்சூழலில் இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  choice: தங்களோடு சேர்ந்துகொண்ட அனைவருக்கும்
  rationale: לוה என்பது தம்மை இணைத்துக்கொள்ளுதல் அல்லது ஒரு சமூகத்தோடு சேர்ந்துகொள்ளுதல் என்ற பொருளுடையது; அந்தப் பொதுவான தொடர்பை இத் தேர்வு காக்கிறது.
- source_word: וְלֹא יַעֲבוֹר
  choice: தவறவிடக் கூடாது
  rationale: அனுசரிப்பு நின்றுபோகாமலும் கைவிடப்படாமலும் இருக்க வேண்டும் என்ற மொழிவழக்குப் பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: לִהְיוֹת עֹשִׂים
  choice: கடைப்பிடிப்பதை
  rationale: சொல்லுக்குச் சொல் ‘செய்துகொண்டிருப்பது’ என்றாலும், பண்டிகை நாட்களைத் தொடர்ந்து அனுசரிக்கும் சூழலில் ‘கடைப்பிடித்தல்’ இயல்பானது.
- source_word: שְׁנֵי הַיָּמִים הָאֵלֶּה
  choice: இந்த இரண்டு நாட்களையும்
  rationale: சுட்டுப்பெயருடன் கூடிய மூலமொழித் தொடரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּכְתָבָם
  choice: அவற்றைக் குறித்து எழுதப்பட்டிருந்தபடியும்
  rationale: எழுத்தில் வகுக்கப்பட்ட முறை அல்லது அறிவுறுத்தலைக் குறிக்கிறது; எந்த ஆவணம் என்று தேவையின்றி வரையறுக்கவில்லை.
- source_word: וְכִזְמַנָּם
  choice: அவற்றுக்குரிய காலத்திலும்
  rationale: זמן குறிக்கும் நிர்ணயிக்கப்பட்ட நேரத்தைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது; இரண்டு நாட்களுக்கான காலக் குறிப்பின் பன்மைத் தொடர்பும் காக்கப்படுகிறது.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: ஆண்டுதோறும்
  rationale: ஒவ்வோர் ஆண்டும் தொடர்ந்து நிகழும் அனுசரிப்பைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
