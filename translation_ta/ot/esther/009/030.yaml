  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
translation:
  language: ta
  text: அகாஸ்வேருவின் அரசாட்சியிலுள்ள நூற்று இருபத்தேழு மாகாணங்களிலும் இருந்த யூதர்கள் அனைவருக்கும், சமாதானமும் உண்மையுமான வார்த்தைகளைக் கொண்ட கடிதங்களை அனுப்பினார்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அகாஸ்வேரு என்பது அரசரின் பெயருக்கான எபிரெய வடிவம்; வரலாற்றில் இவரை முதலாம் செர்க்செஸ் என்று சிலர் அடையாளப்படுத்துகின்றனர்.
    reason: cultural_note
  - marker: b
    text: “சமாதானமும் உண்மையுமான செய்தி” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லர்த்தமாக, “சமாதானமும் உண்மையுமான வார்த்தைகள்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: c
    text: இச்சூழலில் “உண்மை” என்பது “உண்மைத்தன்மை” அல்லது “நம்பகத்தன்மை” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அவர் ... அனுப்பினார்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழில் தருகிறது; வினை ஆண்பால் ஒருமையாக இருப்பதால் எழுவாய் ‘அவர்’ என வைக்கப்பட்டுள்ளது.
- source_word: סְפָרִים
  choice: கடிதங்கள்
  rationale: பாரசீகப் பேரரசின் நிர்வாகச் சூழலில் அனுப்பப்பட்ட எழுத்துப்பூர்வச் செய்திகளைக் குறிக்கும் இயல்பான தமிழ் இணைச்சொல்.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: யூதர்கள் அனைவருக்கும்
  rationale: பேரரசெங்கும் வாழ்ந்த யூதர்களை ஒட்டுமொத்தமாகக் குறிக்கும் சொற்றொடரைத் தெளிவாக வழங்குகிறது.
- source_word: אֶל שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה
  choice: நூற்று இருபத்தேழு மாகாணங்களிலும் இருந்த
  rationale: இரண்டாவது אֶל பெறுநர்கள் வாழ்ந்த புவியியல் பரப்பைக் குறிக்கிறது; மாகாணங்களே கடிதங்களின் நேரடி பெறுநர்கள் என்று தவறாகப் புரிந்துகொள்ளாதவாறு தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: מְדִינָה
  choice: மாகாணங்கள்
  rationale: பாரசீகப் பேரரசின் நிர்வாகப் பிரிவுகளைக் குறிக்கும் தெளிவான, வழக்கமான தமிழ்ச்சொல்.
- source_word: מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேருவின் அரசாட்சி
  rationale: மூலத்தின் உடைமைத் தொடர்பையும் பேரரசு சார்ந்த அதிகார அமைப்பையும் கூடுதல் சொல்லின்றி வெளிப்படுத்துகிறது.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு
  rationale: வரலாற்று அடையாளத்தை மொழிபெயர்ப்புக்குள் புகுத்தாமல் எபிரெயப் பெயரின் வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  choice: சமாதானமும் உண்மையும் பற்றிய வார்த்தைகள்
  rationale: ‘வார்த்தைகள்’ என்ற மூல உருவகத்தையும் שָׁלוֹם, אֱמֶת ஆகியவற்றின் நேரடி பொருள்களையும் காக்கிறது; தமிழில் கடிதங்களின் உள்ளடக்கமாக இயல்பாகப் புரியுமாறு அமைக்கப்பட்டுள்ளது.
