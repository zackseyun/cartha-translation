translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘வார்த்தைகள்’ என்ற வெளிப்பாடு தக்கவைக்கப்பட்டு, அதன் சாத்தியமான பொருள் நுணுக்கங்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
