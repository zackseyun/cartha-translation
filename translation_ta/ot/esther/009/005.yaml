base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
translation:
  language: ta
  text: யூதர்கள் தங்கள் பகைவர்கள் அனைவரையும் வாளால் தாக்கி, கொன்று, அழித்தார்கள்[a]; தங்களை வெறுத்தவர்களுக்கு அவர்கள் விரும்பியபடியே[b] செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘வாளின் அடி, கொலை, அழிவு’ என்று உள்ளது.
    reason: מַכַּת חֶרֶב וְהֶרֶג וְאַבְדָן என்ற பெயர்ச்சொல் குவிப்பின் சொற்பொருள் வடிவத்தைக் காட்டுகிறது.
  - marker: b
    text: அல்லது, ‘தங்கள் விருப்பத்தின்படி.’
    reason: כִּרְצוֹנָם என்பதற்கான சொற்பொருள் சார்ந்த மாற்று.
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: வெட்டிக் கொன்று அழித்தார்கள்
  rationale: נכה என்பதன் ‘தாக்கு/அடி’ என்ற பரந்த பொருளைத் தொடர்ந்து வரும் ‘வாளின் வெட்டு, கொலை, அழிவு’ என்பவை உயிர்க்கொல்லும் செயலாகத் தெளிவுபடுத்துகின்றன. தமிழில் மூலத்தின் வன்மையான சொற்குவிப்பை இயல்பாக வெளிப்படுத்த வினைத்தொடராக அமைக்கப்பட்டது.
- source_word: הַיְּהוּדִים
  choice: யூதர்கள்
  rationale: எஸ்தர் நூலின் பாரசீகப் புலம்பெயர் சூழலில் இது யூத மக்களைக் குறிக்கிறது; நவீன தமிழில் இயல்பான, துல்லியமான பெயர் ‘யூதர்கள்’.
- source_word: בְּכָל אֹיְבֵיהֶם
  choice: தங்கள் பகைவர்கள் அனைவரையும்
  rationale: כָּל காட்டும் முழுமையான பரப்பை ‘அனைவரையும்’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: מַכַּת חֶרֶב וְהֶרֶג וְאַבְדָן
  choice: வாளால் வெட்டிக் கொன்று அழித்தார்கள்
  rationale: ‘வாளின் வெட்டு, கொலை, அழிவு’ என்ற மூன்று கடுமையான கூறுகளையும் தமிழில் இயல்பான தொடர்வினைகளாக அளிக்கிறது; வன்முறையை மென்மைப்படுத்தவோ ‘முற்றிலும் நிர்மூலமாக்கினர்’ என்று மிகைப்படுத்தவோ இல்லை.
- source_word: בְשֹׂנְאֵיהֶם
  choice: தங்களை வெறுத்தவர்களுக்கு
  rationale: முன்னுள்ள ‘பகைவர்கள்’ என்பதிலிருந்து שׂנא என்ற சொல்லின் ‘வெறுத்தவர்கள்’ என்னும் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: כִּרְצוֹנָם
  choice: தாங்கள் விரும்பியபடியே
  rationale: ‘தங்கள் விருப்பத்தின்படி’ என்ற சொற்பொருளை நவீன தமிழில் இயல்பாகவும், அவர்களுக்கிருந்த செயல்சுதந்திரத்தை வலியுறுத்தும் வகையிலும் தருகிறது.
theological_decisions:
- issue: போர்ச் சூழலின் கொடிய வன்முறையை மென்மைப்படுத்தாமல் அல்லது மிகைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: ‘வாளால் வெட்டிக் கொன்று அழித்தார்கள்’ என்று மூலத்தின் கடுமையான மூன்று கூறுகளையும் நேரடியாக வைத்தல்
  alternative: ‘தோற்கடித்தார்கள்’ என்று பொதுமைப்படுத்துதல் அல்லது ‘முற்றிலும் நிர்மூலமாக்கினார்கள்’ என்று வலுப்படுத்துதல்
  rationale: எபிரெய உரை வாளின் வெட்டு, கொலை, அழிவு ஆகிய சொற்களைக் குவிக்கிறது. மொழிபெயர்ப்பு அந்தக் கடுமையைத் தக்கவைக்க வேண்டும்; அதேவேளை உரை கூறுவதற்கு மேல் ஒரு முழுமையான இனஅழிப்பு கருத்தைச் சேர்க்கக் கூடாது.
- issue: כִּרְצוֹנָם என்பதில் உள்ள விருப்பம் அல்லது சித்தம் என்ற நுணுக்கம்
  choice: ‘தாங்கள் விரும்பியபடியே’
  alternative: ‘தங்கள் சித்தத்தின்படி’
  rationale: இங்கு இறையியல் சார்ந்த ‘சித்தம்’ என்ற தொழில்நுட்பத் தோற்றத்தைத் தவிர்த்து, மனிதர்களின் விருப்பப்படி நடந்த செயலை இயல்பாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. மூலத்தின் வன்மையான சொற்குவிப்பு தமிழில் இயல்பான தொடர்வினைகளாக மாற்றப்பட்டுள்ளது. ‘பகைவர்கள்’ மற்றும் ‘வெறுத்தவர்கள்’ என்ற சொல் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
