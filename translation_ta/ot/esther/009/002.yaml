base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
translation:
  language: ta
  text: தங்களுக்குத் தீங்கு செய்ய முயல்கிறவர்களைத் தாக்குவதற்காக[a], அகாஸ்வேரு ராஜாவின் எல்லா மாகாணங்களிலும் யூதர்கள் தங்கள் நகரங்களில் ஒன்றுகூடினார்கள். அவர்களை எதிர்த்து நிற்க ஒருவராலும் முடியவில்லை[b]; ஏனெனில் அவர்களைப் பற்றிய அச்சம் எல்லா மக்களினங்கள்மீதும் விழுந்திருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, ‘அவர்களுக்கு எதிராகக் கையை நீட்டுவதற்காக’; இது பகைமையுடன் தாக்குவதைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களை ஒருவரும் எதிர்த்து நிற்கவில்லை.’
    reason: lexical_alternative
  - marker: c
    text: ‘மக்களினங்கள்’ என்பது பேரரசிலிருந்த பல்வேறு இனக்குழுக்கள் அல்லது மக்கள் தொகுதிகளைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: கהל என்பதன் நிஃபால் வடிவம் மக்கள் ஒருங்கே கூடுவதைச் சுட்டுகிறது; இத்தமிழாக்கம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּעָרֵיהֶם
  choice: தங்கள் நகரங்களில்
  rationale: עִיר என்பதன் அடிப்படைப் பொருள் ‘நகரம்’; பன்மை மற்றும் உரிமை விகுதி தமிழில் நேரடியாகப் பிரதிபலிக்கப்படுகின்றன.
- source_word: בְּכָל מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு ராஜாவின் எல்லா மாகாணங்களிலும்
  rationale: מְדִינוֹת என்பது பாரசீகப் பேரரசின் நிர்வாக மாகாணங்களைக் குறிக்கிறது; בְּכָל என்பதன் முழுமையான பரப்பும் காக்கப்பட்டுள்ளது.
- source_word: לִשְׁלֹחַ יָד
  choice: தாக்குவதற்காக
  rationale: சொல்லுக்கு சொல் ‘கையை நீட்டுதல்’ என்றாலும், இச்சூழலில் இது பகைமையுடன் தாக்குவதைக் குறிக்கும் எபிரேய மரபுத்தொடர்; இயல்பான தமிழில் அதன் நோக்கம் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  choice: தங்களுக்குத் தீங்கு செய்ய முயன்றவர்களை
  rationale: சொல்லர்த்தத்தில் ‘அவர்களுடைய தீங்கை நாடுகிறவர்கள்’; தமிழ் வழக்கில் பகை நோக்கைத் தெளிவாகவும் செயற்பாட்டுடனும் தெரிவிக்கிறது.
- source_word: וְאִישׁ לֹא עָמַד לִפְנֵיהֶם
  choice: அவர்களை எதிர்த்து நிற்க ஒருவராலும் முடியவில்லை
  rationale: சொல்லர்த்தம் ‘ஒருவன் அவர்களுக்கு முன் நிற்கவில்லை’; இச்சூழலில் எதிர்க்கவோ தாக்குப்பிடிக்கவோ இயலாமை என்ற மரபுத்தொடரின் பொருள் தரப்பட்டுள்ளது.
- source_word: כִּי נָפַל פַּחְדָּם
  choice: ஏனெனில் அவர்களைப் பற்றிய அச்சம் ... விழுந்திருந்தது
  rationale: פחד என்பதன் ‘அச்சம்/பீதி’ என்ற பொருளையும், נפל על என்ற ‘மேல் விழுதல்’ உருவகத்தையும் முடிந்தவரை காக்கிறது.
- source_word: עַל כָּל הָעַמִּים
  choice: எல்லா மக்களினங்கள்மீதும்
  rationale: עַמִּים என்ற பன்மை, பேரரசிலிருந்த பல்வேறு இன அல்லது மக்கள் குழுக்களைக் குறிக்கிறது; ஒற்றை மக்கள்தொகை என்று சுருக்கப்படவில்லை.
- source_word: אֳחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு
  rationale: தமிழ் வேதாகமப் பெயர்வழக்கிற்கு ஏற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
