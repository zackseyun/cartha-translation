  text: וּ/שְׁאָ֣ר הַ/יְּהוּדִ֡ים אֲשֶׁר֩ בִּ/מְדִינ֨וֹת הַ/מֶּ֜לֶךְ נִקְהֲל֣וּ וְ/עָמֹ֣ד עַל נַפְשָׁ֗/ם וְ/נ֨וֹחַ֙ מֵ/אֹ֣יְבֵי/הֶ֔ם וְ/הָרֹג֙ בְּ/שֹׂ֣נְאֵי/הֶ֔ם חֲמִשָּׁ֥ה וְ/שִׁבְעִ֖ים אָ֑לֶף וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָֽׁלְח֖וּ אֶת יָדָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
translation:
  language: ta
  text: அரசனுடைய மாகாணங்களில் இருந்த மற்ற யூதர்கள் ஒன்றுகூடி, தங்கள் உயிரைக் காத்துக்கொள்ள நிலைத்து நின்றார்கள்[a]. அவர்கள் தங்கள் பகைவர்களிடமிருந்து நிம்மதி பெற்று, தங்களை வெறுத்தவர்களில் எழுபத்தைந்தாயிரம் பேரைக் கொன்றார்கள். ஆனால் கொள்ளைப் பொருளின்மேல் அவர்கள் கை வைக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் உயிர்களுக்காக நிலைத்து நின்றார்கள்.”
    reason: எபிரெயச் சொல்லாட்சியின் நேரடியான மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: “கொள்ளைப் பொருள்” என்பதை “போரில் கைப்பற்றிய பொருட்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: בִּזָּה என்பதற்கான விளக்கமான சொல் மாற்று.
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  choice: மற்ற யூதர்கள்
  rationale: שְׁאָר என்பது முன்னர் குறிப்பிடப்பட்ட சூசானிலிருந்த யூதர்களுக்கு மாறாக மீதமிருந்தவர்களைக் குறிக்கிறது; ‘மற்ற யூதர்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בִּמְדִינוֹת הַמֶּלֶךְ
  choice: அரசனுடைய மாகாணங்களில்
  rationale: מְדִינוֹת பேரரசின் நிர்வாக மாகாணங்களைக் குறிக்கிறது; இத்தொடர் அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: נִקְהֲלוּ
  choice: ஒன்றுகூடி
  rationale: இந்த வினை அரச கட்டளைக்குப் பதிலாக யூதர்கள் கூட்டாகத் திரண்டதைக் குறிக்கிறது; ‘ஒன்றுகூடி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וְעָמֹד עַל נַפְשָׁם
  choice: தங்கள் உயிரைக் காத்துக்கொள்ள நிலைத்து நின்றார்கள்
  rationale: சொல்லடியாக ‘தங்கள் உயிர்களுக்காக நின்றார்கள்’ என்ற எபிரெய உருவகத்தையும், உயிர்தற்காப்பு என்ற இடியப் பொருளையும் இவ்வாக்கியம் இணைக்கிறது.
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  choice: தங்கள் பகைவர்களிடமிருந்து விடுதலை பெற்று
  rationale: נוּחַ இங்கு மோதலுக்குப் பின் பகைவர்களிடமிருந்து ஓய்வு அல்லது நிம்மதி கிடைத்ததைக் குறிக்கிறது; ‘விடுதலை பெற்று’ சூழலில் இயல்பாக உள்ளது.
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם
  choice: தங்களை வெறுத்தவர்களில் ... பேரைக் கொன்றார்கள்
  rationale: בְּ முன்னொட்டை முற்றிலும் அழிக்காமல், வெறுத்தவர்களின் தொகுதிக்குள் கொல்லப்பட்ட எண்ணிக்கையை ‘-வர்களில்’ தெளிவாகக் காட்டுகிறது.
- source_word: חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  choice: எழுபத்தைந்தாயிரம் பேர்
  rationale: எபிரெய எண்ணை இயல்பான தமிழ் வரிசையிலும் மனிதர்களைக் குறிக்கும் ‘பேர்’ உடனும் வழங்குகிறது.
- source_word: וּבַבִּזָּה
  choice: ஆனால் கொள்ளைப் பொருளின்மேல்
  rationale: בִּזָּה போரில் கைப்பற்றப்படும் பொருட்களைக் குறிக்கிறது; ‘கொள்ளைப் பொருள்’ நவீன வாசகருக்குத் தெளிவு. இணைப்புச்சொல் முன் செயலுக்கும் பொருள்களை எடுக்க மறுத்ததற்கும் உள்ள முரணால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: அவர்கள் கை வைக்கவில்லை
  rationale: சொல்லடியாக ‘தங்கள் கையை நீட்டவில்லை’ என்ற மரபுத்தொடர் எதையும் எடுத்துக்கொள்ளவில்லை என்பதைக் குறிக்கிறது; ‘கை வைக்கவில்லை’ அதற்கு இயல்பான தமிழ் இணை.
theological_decisions:
- issue: யூதர்களின் செயலுக்கான ஒழுக்கச் சட்டகம்
  choice: ‘தங்கள் உயிரைக் காத்துக்கொள்ள நிலைத்து நின்றார்கள்’ என்று தற்காப்புச் சட்டகத்தைத் தக்கவைத்தல்
  alternative: ‘தங்களுக்காக நின்றார்கள்’ அல்லது ‘எதிர்த்து நின்றார்கள்’
  rationale: எபிரெய மூலத்தில் உயிரைப் பாதுகாப்பது வெளிப்படையாகச் சொல்லப்படுகிறது. வன்முறையை மூலத்தைவிட மென்மையாக்காமலும், கதையின் தற்காப்புச் சட்டகத்தை நீக்காமலும் மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது; நிகழ்வுகளின் வரிசையும் எதிர்மறை முடிவும் பாதுகாக்கப்பட்டன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
