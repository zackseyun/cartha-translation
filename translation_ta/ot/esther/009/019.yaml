  source_fidelity: திருத்தம் தேவை. மூல எபிரெயத்தில் பதினான்காம் நாள் மகிழ்ச்சி, விருந்து, பண்டிகை நாள், மேலும் ஒருவருக்கொருவர் பங்குகளை அனுப்பும் நாள் என நான்கு இணையான கூறுகளுடன் குறிக்கப்படுகிறது. வரைவில் ‘பங்குகள் அனுப்புதல்’ நாள் பற்றிய பண்பாக இல்லாமல் தனிச் செயலாக அமைந்துள்ளது; மேலும் ‘உணவுப்’ என்று முதன்மை உரையில் குறிப்பாக்கப்பட்டுள்ளது.
