base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
translation:
  language: ta
  text: ஆகையால், அரணில்லாத ஊர்களில் வாழும் கிராமப்புற யூதர்கள்[a], ஆதார் மாதத்தின் பதினான்காம் நாளை மகிழ்ச்சியும் விருந்தும் கொண்ட பண்டிகை நாளாகவும், ஒருவருக்கொருவர் பங்குகளை[b] அனுப்பும் நாளாகவும் கொண்டாடுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திறந்த வெளிக் குடியிருப்புகளாகிய அரணில்லாத நகரங்களில் வாழும் யூதர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “பங்குகள்” என்பது விருந்துக்கான உணவுப் பங்குகள் அல்லது உணவுப் பரிசுகளைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய நிகழ்வுகளிலிருந்து வரும் விளைவைக் காட்டும் இயல்பான காரண-முடிவு இணைப்புச் சொல்.
- source_word: הַיְּהוּדִים
  choice: யூதர்கள்
  rationale: பாரசீகப் பேரரசில் வாழ்ந்த இன-சமய மக்களைக் குறிக்கிறது; யூதேயா நாட்டினரை மட்டும் குறிக்கவில்லை.
- source_word: הפרוזים / הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת
  choice: அரணில்லாத ஊர்களில் குடியிருந்த கிராமப்புற யூதர்கள்
  rationale: கோட்டைச் சுவரால் சூழப்பட்ட சூசானுக்கு எதிராக, திறந்த அல்லது அரணில்லாத குடியிருப்புகளில் வாழ்ந்தவர்களைக் குறிக்கும் புவியியல் வேறுபாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר
  choice: பதினான்காம் நாளை ... கொண்டாடி
  rationale: ஒரு நாளைக் கடைப்பிடித்தல் அல்லது கொண்டாடுதல் என்ற இச்சூழலிலுள்ள עשה வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: ஆதார் மாதத்தின்
  rationale: எபிரெய தேதிக் குறிப்பின் உடைமைத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: שִׂמְחָה וּמִשְׁתֶּה וְיוֹם טוֹב
  choice: மகிழ்ச்சிக்கும் விருந்துக்கும் உரிய பண்டிகை நாள்
  rationale: மகிழ்ச்சி, விருந்து, விழாக்கால நாள் ஆகிய மூன்று கூறுகளையும் சுருக்காமல், இயல்பான தமிழ் தொடராகத் தருகிறது.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: உணவுப் பங்குகளை அனுப்புகிறார்கள்
  rationale: מָנוֹת என்பது பங்குகள் அல்லது பரிமாறப்படும் பகுதிகள் எனப் பொருள்படும்; விருந்து சூழலில் உணவுப் பங்குகள் என்பது சாத்தியமான பொருளைத் தெளிவாக்குகிறது, அதேவேளை குறிப்பிலே பரந்த மாற்று தரப்படுகிறது.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: ஒருவருக்கொருவர்
  rationale: எபிரெய மொழியின் ஆண்பால் ஒருமை பகிர்வுச் சொல்லாடல் சமூகத்தின் உறுப்பினர்கள் பரஸ்பரம் அனுப்புவதைச் சுட்டுகிறது; தமிழில் ‘ஒருவருக்கொருவர்’ இயல்பாகவும் பாலினத்தைத் தேவையின்றி வரையறுக்காமலும் உள்ளது.
theological_decisions:
- issue: אִישׁ לְרֵעֵהוּ என்ற ஆண்பால் வடிவமுள்ள பகிர்வுச் சொல்லாடல்
  choice: ஒருவருக்கொருவர்
  alternative: ஒவ்வொரு ஆணும் தன் அயலானுக்கு
  rationale: இது இலக்கண ரீதியாக ஆண்பால் ஒருமையில் இருந்தாலும், சமூகமெங்கும் நடைபெறும் பரஸ்பரச் செயலைக் குறிக்கும் வழக்குச் சொல்லாடல். ‘ஒவ்வொரு ஆணும்’ என்பது தமிழில் ஆண்களுக்கு மட்டும் உரிய கட்டளையாகத் தவறாகக் குறுக்கிவிடக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘அரணில்லாத ஊர்கள்’ என்பது சூழலின் மதிலுள்ள/மதிலில்லாத குடியிருப்பு வேறுபாட்டை வெளிப்படுத்துகிறது. ‘ஆதார்’ என்ற மாதப்பெயர் தமிழ் ஒலிப்புமுறைக்கு ஏற்ப தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
