revisions:
- from: யூதர்களின் பகைவனான அம்மெதாத்தாவின் மகன் ஆமானின் பத்து மகன்களையும் அவர்கள் கொன்றார்கள்; ஆனால் கொள்ளைப்பொருள்மீது[a] அவர்கள் கை வைக்கவில்லை.
  to: அம்மெதாத்தாவின் மகனும் யூதர்களின் பகைவனுமான ஆமானின் பத்து மகன்களை அவர்கள் கொன்றார்கள்; ஆனால் கொள்ளைப்பொருள்மீது[a] அவர்கள் கை வைக்கவில்லை.
  rationale: 'The revision retains every source element while restructuring the apposition: Haman is explicitly both Hammedatha’s son and the enemy of the Jews. This resolves the modifier-attachment ambiguity without adding interpretive content.'
