    text: அல்லது, “கொள்ளை.”
    reason: lexical_alternative
  revision_rationale: 'The revision retains every source element while restructuring the apposition: Haman is explicitly both Hammedatha’s son and the enemy of the Jews. This resolves the modifier-attachment ambiguity without adding interpretive content.'
