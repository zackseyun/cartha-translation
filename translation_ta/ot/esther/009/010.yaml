  text: the ten sons of Haman son of Hammedatha[a], the enemy of the Jews, they killed; but they did not lay a hand on the plunder.
translation:
  language: ta
  text: அம்மெதாத்தாவின் மகனும் யூதர்களின் பகைவனுமான ஆமானின் பத்து மகன்களை அவர்கள் கொன்றார்கள்; ஆனால் கொள்ளைப்பொருள்மீது[a] அவர்கள் கை வைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொள்ளை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: ஆமானின் பத்து மகன்களையும்
  rationale: Construct phrase ‘Haman’s ten sons’ is rendered naturally in Tamil; the accusative suffix marks them as the object of ‘they killed,’ in keeping with the Hebrew syntax and context.
- source_word: בֶּן הַמְּדָתָא
  choice: அம்மெதாத்தாவின் மகன்
  rationale: Genealogical apposition identifying Haman; the personal name is transliterated in established Tamil biblical style.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: யூதர்களின் பகைவனான
  rationale: צֹרֵר describes one who is hostile toward or afflicts another. ‘பகைவன்’ is clear, current Tamil and fits the appositional description of Haman.
- source_word: הָרָגוּ
  choice: அவர்கள் கொன்றார்கள்
  rationale: Directly represents the 3rd-person plural verb הרג in plain, dignified modern Tamil.
- source_word: וּבַבִּזָּה
  choice: ஆனால் கொள்ளைப்பொருள்மீது
  rationale: בִּזָּה denotes plunder or spoil. ‘கொள்ளைப்பொருள்’ clearly denotes goods available for seizure; the conjunction is rendered adversatively because this clause contrasts their killing with their refusal to take the goods.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: அவர்கள் கை வைக்கவில்லை
  rationale: Preserves the Hebrew hand imagery while using a natural Tamil idiom meaning that they did not take or appropriate the plunder.
theological_decisions: []
translation_notes:
  register: Modern standard Tamil with a dignified narrative register. Hebrew apposition is retained in a natural Tamil sequence, and the idiom involving the hand is preserved without woodenly translating ‘send out their hand.’ The supplied English footnote marker appears misplaced after ‘Hammedatha’; because its content concerns בִּזָּה (‘spoil’), the Tamil marker is attached to ‘கொள்ளைப்பொருள்.’
