translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், காலத் தொடர்பும் எதிர்மறைத் திருப்பமும் காக்கப்பட்டுள்ளன. ‘ஆதிக்கம் செலுத்த’ என்பது இரு தரப்பையும் குறிக்கும் இணையான கூறுகளில் திட்டமிட்டு மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
