- source_word: בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: பதின்மூன்றாம் நாளில்
  rationale: בּוֹ என்பதன் மாதத்தைக் குறிக்கும் தொடர்பு, தமிழின் ‘ஆதார் மாதத்தின் பதின்மூன்றாம் நாளில்’ என்ற உருபமைப்பில் தெளிவாகப் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר הִגִּיעַ דְּבַר הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת
  choice: அரசனுடைய வார்த்தையும் அவனுடைய சட்டமும் நிறைவேற்றப்பட வேண்டிய நேரம் வந்தது
  rationale: הִגִּיעַ என்பதன் ‘வந்தடைந்தது’ என்ற அடிப்படை உணர்வு ‘நேரம் வந்தது’ என்பதில் நிலைக்கிறது. דְּבַר மற்றும் דָת ஆகியவற்றின் வேறுபாட்டை முறையே ‘வார்த்தை’, ‘சட்டம்’ எனக் காக்கிறது; לְהֵעָשׂוֹת செயப்பாட்டு வடிவில் ‘நிறைவேற்றப்பட’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׂבְּרוּ
  choice: எதிர்பார்த்திருந்த
  rationale: இந்த வினை நம்பிக்கையுடன் எதிர்பார்த்தல் அல்லது நடக்கும் என்று எண்ணுதல் ஆகிய இரு நிழற்பொருள்களையும் தருகிறது. சூழலில் பகைவர்களின் எதிர்பார்ப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִשְׁלֹט בָּהֶם / יִשְׁלְטוּ ... בְּשֹׂנְאֵיהֶם
  choice: அவர்கள்மேல் ஆதிக்கம் செலுத்த / தங்களை வெறுத்தவர்கள்மேல் ஆதிக்கம் செலுத்தினார்கள்
  rationale: שׁלט என்பதன் ஆளுகை அல்லது மேலாதிக்கம் செலுத்துதல் என்ற பொருளை இரு எதிரெதிர் கூறுகளிலும் ஒரே சொல்லால் பாதுகாக்கிறது.
- source_word: וְנַהֲפוֹךְ הוּא
  choice: நிலைமை தலைகீழாக மாறியது
  rationale: சொற்றொடர் திடீர் முழுமையான நிலைமாற்றத்தைக் குறிக்கிறது. தமிழில் இயல்பாகவும் நிகழ்வின் வியப்பூட்டும் திருப்பத்தைத் தெளிவாகவும் கூறுகிறது; மாற்று நேரடி வடிவங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: הַיְּהוּדִים הֵמָּה
  choice: யூதர்களே
  rationale: הֵמָּה தரும் எதிர்மறை ஒப்பீட்டு வலியுறுத்தலை ஏகாரத்தின் மூலம் சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: שֹׂנְאֵיהֶם
  choice: தங்களை வெறுத்தவர்கள்
  rationale: எளிய ‘பகைவர்கள்’ என்று மாற்றாமல், எபிரெயப் பங்கேற்பு வடிவின் வினைத் தன்மையான ‘வெறுத்தவர்கள்’ என்பதைப் பாதுகாக்கிறது.
