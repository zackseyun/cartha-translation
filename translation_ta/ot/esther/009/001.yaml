base_translation:
  language: en
  yaml_path: translation/ot/esther/009/001.yaml
  text: 'In the twelfth month[a], that is, the month Adar, on the thirteenth day of it, when the king’s word and his decree were to be carried out, on the day when the enemies of the Jews had hoped to rule over them, the opposite happened: the Jews themselves ruled over those who hated them.'
translation:
  language: ta
  text: 'பன்னிரண்டாம் மாதமான ஆதார் மாதத்தின் பதின்மூன்றாம் நாளில், அரசனின் வார்த்தையும் அவனுடைய சட்டமும் நிறைவேற்றப்பட வேண்டிய அந்த நாளில், யூதர்களின் பகைவர்கள் அவர்கள்மேல் ஆதிக்கம் செலுத்துவார்கள் என்று எதிர்பார்த்திருந்தார்கள்; ஆனால் மாறாக நடந்தது[a]: யூதர்களே தங்களை வெறுத்தவர்கள்மேல் ஆதிக்கம் செலுத்தினார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “அது தலைகீழானது” அல்லது “அது திருப்பப்பட்டது.”'
    reason: וְנַהֲפוֹךְ הוּא என்ற எபிரெயச் சொற்றொடரை நேரடியான ‘தலைகீழாதல்’ அல்லது ‘திருப்பப்படுதல்’ என்ற வடிவிலும் புரிந்துகொள்ளலாம்.
lexical_decisions:
