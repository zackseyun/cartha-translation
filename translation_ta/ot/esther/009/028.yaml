  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெயத்தின் பகிர்ந்தளிக்கும் மீளுரைகளை ‘-தோறும்’ வடிவில் காத்து, சட்டப்பூர்வமான கட்டளைத் தொனியை ‘வேண்டும்/கூடாது’ வழியாக வெளிப்படுத்தியுள்ளது.
