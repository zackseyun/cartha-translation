  source_fidelity: 'முதல் வாக்கியத்தில் எபிரெயப் பங்கேற்பு வடிவங்கள் நிகழ்கால/நிலையான அறிவிப்பாக உள்ளன: நாட்கள் ‘நினைவுகூரப்படுகின்றன, அனுசரிக்கப்படுகின்றன’; ‘வேண்டும்’ என்பது மூலத்தில் இல்லாத கட்டளை/கடமைத் தொனியைச் சேர்க்கிறது. இரண்டாம் வாக்கியத்தில் ‘வழக்கொழிந்து போகக்கூடாது’ என்பதும் அதே தேவையற்ற தடைத் தொனியைச் சேர்க்கிறது; மூலத்தின் எதிர்கால உறுதியான மறுப்பைத் தக்கவைக்க வேண்டும்.'
