  terminology: ‘பூரீம்,’ ‘யூதர்கள்,’ ‘மாகாணம்,’ ‘சந்ததியினர்’ பொருத்தமானவை. ‘இந்நாட்கள்’ என்பது முன்வரும் நாட்களையும் பூரீம் நாட்களையும் இணைக்கும் இயல்பான நடை.
