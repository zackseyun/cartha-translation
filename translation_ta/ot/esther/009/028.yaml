base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
translation:
  language: ta
  text: இந்த நாட்கள் தலைமுறைதோறும், குடும்பந்தோறும், மாகாணந்தோறும், நகரந்தோறும் நினைவுகூரப்பட்டு அனுசரிக்கப்படுகின்றன.[a] இப்பூரீம் நாட்கள் யூதர்கள் மத்தியிலிருந்து நீங்கிப்போகாது; அவற்றைப் பற்றிய நினைவு அவர்களுடைய சந்ததியினரிடமிருந்து ஒழிந்துபோகாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த நாட்கள் ஒவ்வொரு தலைமுறையிலும், ஒவ்வொரு குடும்பத்திலும், ஒவ்வொரு மாகாணத்திலும், ஒவ்வொரு நகரத்திலும் நினைவுகூரப்பட்டு அனுசரிக்கப்படுகின்றன.” எபிரெயத்தில் ஒருமைப் பெயர்ச்சொற்கள் மீண்டும் மீண்டும் வருவது ஒவ்வொன்றையும் தனித்தனியாக உள்ளடக்கும் வலியுறுத்தலைத் தருகிறது. “அனுசரிக்கப்படுகின்றன” என்று மொழிபெயர்க்கப்பட்ட வினைச்சொல்லின் நேரடிப் பொருள் “செய்யப்படுகின்றன” என்பதாகும்; இங்கே பண்டிகையை நடைமுறையில் கடைப்பிடிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְכָּרִים
  choice: நினைவுகூரப்பட்டு
  rationale: நிஃபால் வடிவத்தின் ‘நினைவில் வைக்கப்படுதல்/நினைவுகூரப்படுதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; அடுத்த வினை நடைமுறை அனுசரிப்பைக் குறிக்க இடமளிக்கிறது.
- source_word: וְנַעֲשִׂים
  choice: அனுசரிக்கப்பட வேண்டும்
  rationale: சொல்லுக்குச் சொல் ‘செய்யப்படுதல்’ என்றாலும், பண்டிகை நாட்களை நடைமுறையில் கடைப்பிடிப்பதே சூழல்சார் பொருள். ‘அனுசரிக்கப்படுதல்’ இதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּכָל דּוֹר וָדוֹר
  choice: தலைமுறைதோறும்
  rationale: மீண்டும் வரும் ஒருமைச் சொல்லின் பகிர்ந்தளிக்கும் வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: מִשְׁפָּחָה וּמִשְׁפָּחָה
  choice: குடும்பந்தோறும்
  rationale: ஒவ்வொரு குடும்பத்தையும் தனித்தனியாக உள்ளடக்கும் எபிரெயப் பகிர்ந்தளிக்கும் அமைப்பைத் தமிழில் பிரதிபலிக்கிறது.
- source_word: מְדִינָה וּמְדִינָה
  choice: மாகாணந்தோறும்
  rationale: எஸ்தர் நூலின் பாரசீகப் பேரரசு நிர்வாகச் சூழலில் מְדִינָה என்பது மாகாணத்தைக் குறிக்கிறது.
- source_word: וְעִיר וָעִיר
  choice: நகரந்தோறும்
  rationale: ஒவ்வொரு நகரத்தையும் குறிக்கும் பகிர்ந்தளிக்கும் வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: יְמֵי הַפּוּרִים
  choice: பூரீம் நாட்கள்
  rationale: பண்டிகையின் பெயரை ஒலிபெயர்த்து, எபிரெயக் கட்டமைப்பை இயல்பான தமிழ்ச் சொற்றொடராக வழங்குகிறது.
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  choice: யூதர்களிடையே ஒருபோதும் வழக்கொழிந்து போகக்கூடாது
  rationale: עבר מן என்பதிலுள்ள சமூகத்தின் மத்தியிலிருந்து மறைந்து அல்லது ஒழிந்து போதல் என்ற உருவகத்தை, பண்டிகை அனுசரிப்பு சூழலில் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְזִכְרָם
  choice: அவற்றைப் பற்றிய நினைவு
  rationale: பன்மைச் சுட்டுப்பெயர் பூரீம் நாட்களைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவுபடுத்தி, நினைவுகூரும் கருத்தைக் காக்கிறது.
- source_word: לֹא יָסוּף מִזַּרְעָם
  choice: அவர்களுடைய சந்ததியினரிடமிருந்து ஒருபோதும் மறையக்கூடாது
  rationale: יסוף என்பதன் ‘முடிவுறுதல்/ஒழிதல்’ பொருளையும் זֶרַע என்பதன் இச்சூழலிலான ‘சந்ததியினர்’ பொருளையும் இயல்பான தமிழில் தருகிறது.
