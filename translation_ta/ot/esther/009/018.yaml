base_translation:
  language: en
  yaml_path: translation/ot/esther/009/018.yaml
  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
translation:
  language: ta
  text: ஆனால் சூசானில் இருந்த யூதர்கள் அந்த மாதத்தின் பதின்மூன்றாம் நாளிலும் பதினான்காம் நாளிலும் ஒன்றுகூடினார்கள்; பதினைந்தாம் நாளில்[a] ஓய்வெடுத்து, அதை விருந்தும் மகிழ்ச்சியும் கொண்ட நாளாக ஆக்கினார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அதில் பதின்மூன்றாம் நாளில் ... அதில் பதினான்காம் நாளில் ... அதில் பதினைந்தாம் நாளில்’ என்று உள்ளது; ‘அதில்’ என்பது சூழலிலிருந்து அந்த மாதத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதை விருந்துண்ணுதலும் மகிழ்ச்சியும் கொண்ட நாளாக ஆக்கினார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: ஆனால் ... யூதர்கள்
  rationale: முந்தைய வசனத்தில் மாகாணங்களிலிருந்த யூதர்களைப் பற்றிக் கூறப்பட்டதற்கு மாறாக, இங்கு சூசானிலிருந்த யூதர்களைப் பற்றிக் கூறப்படுவதால் וְ என்பதன் உரையாடல் சார்ந்த முரண்பாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בְּשׁוּשָׁן
  choice: சூசானில் இருந்த
  rationale: சூசான் நகரில் இருந்த குறிப்பிட்ட யூதர்களை அடையாளப்படுத்தும் தொடர்புச் சொற்றொடரை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: נִקְהֲלוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: קהל என்பதன் நிஃபால் வடிவம் மக்கள் கூடுவதைக் குறிக்கிறது; அவர்களின் நோக்கத்தைத் தேவையின்றி விளக்காமல் அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ
  choice: அந்த மாதத்தின் பதின்மூன்றாம் நாளிலும் பதினான்காம் நாளிலும்
  rationale: எபிரெயத்தில் ‘அதில்’ என்று வரும் சுட்டுப்பெயர் சூழலின்படி மாதத்தைக் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘அந்த மாதத்தின்’ என்று வெளிப்படையாகக் கூறப்பட்டுள்ளது.
- source_word: וְנוֹחַ
  choice: ஓய்ந்திருந்து
  rationale: நிகழ்ந்த போராட்டச் செயல்கள் முடிந்து ஓய்வுபெற்றதைக் குறிக்கும் נוח என்ற வினையின் பொருளைத் தொடர்ச்சியான தமிழ் வாக்கியத்தில் இயல்பாக வழங்குகிறது.
- source_word: בַּחֲמִשָּׁה עָשָׂר בּוֹ
  choice: பதினைந்தாம் நாளில்
  rationale: முன்னரே மாதம் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளதால், தமிழில் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்த்தும் தேதித் தொடரைத் தெளிவாகவும் வைத்திருக்கிறது.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: அந்த நாளை ... உரிய நாளாக்கினார்கள்
  rationale: עשה உடன் வரும் சுட்டுப்பெயர், அந்த நாளை ஒரு குறிப்பிட்ட வகையில் கடைப்பிடிக்கத்தக்க நாளாக ஆக்கியதைக் குறிக்கிறது; ‘நியமித்தார்கள்’ போன்ற அதிக அதிகாரப்பூர்வப் பொருளைச் சேர்க்கவில்லை.
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: விருந்துக்கும் மகிழ்ச்சிக்கும் உரிய நாள்
  rationale: מִשְׁתֶּה என்பது விருந்து அல்லது விருந்துண்ணுதலையும், שִׂמְחָה என்பது மகிழ்ச்சியையும் குறிக்கிறது; இவ்விரண்டையும் கண்ணியமான, புரிந்துகொள்ள எளிய தமிழில் இணைக்கிறது.
