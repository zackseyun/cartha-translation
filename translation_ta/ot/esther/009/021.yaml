  text: לְ/קַיֵּם֮ עֲלֵי/הֶם֒ לִ/הְי֣וֹת עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר וְ/אֵ֛ת יוֹם חֲמִשָּׁ֥ה עָשָׂ֖ר בּ֑/וֹ בְּ/כָל שָׁנָ֖ה וְ/שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/021.yaml
  text: to establish among them that they should observe the fourteenth day of the month Adar[a], and the fifteenth day of it, year after year,
translation:
  language: ta
  text: ஆதார் மாதத்தின் பதினான்காம் நாளையும், அதே மாதத்தின் பதினைந்தாம் நாளையும் ஆண்டுதோறும்[a] அவர்கள் அனுசரிக்க வேண்டும் என்று அவர்களிடையே நிலைநாட்டுவதற்காக,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் ‘ஒவ்வோர் ஆண்டும் ஆண்டும்’ என்று ‘ஆண்டு’ என்ற சொல் மீண்டும் கூறப்பட்டு, தவறாமல் ஒவ்வொரு ஆண்டும் என்பதற்கு வலியுறுத்தல் தரப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: நிலைநாட்டுவதற்காக
  rationale: פיעל வடிவிலுள்ள קום இங்கு ஒரு சமூகக் கடமையையோ வழக்கத்தையோ உறுதியாக ஏற்படுத்துதல் என்ற பொருளைக் கொண்டுள்ளது. முந்தைய வசனத்துடன் தொடரும் நோக்க வினையெச்ச அமைப்பையும் இந்தத் தேர்வு காக்கிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்களிடையே
  rationale: சொல்லுக்குச் சொல் பொருள் ‘அவர்கள்மேல்’ என்றாலும், இங்கு யூத சமூகத்தில் ஓர் அனுசரிப்பை நடைமுறையாக நிலைநாட்டுவதை இயல்பான தமிழில் ‘அவர்களிடையே’ தெரிவிக்கிறது; கடமை சார்ந்த வலிமை ‘நிலைநாட்டுதல்’ என்பதில் தங்குகிறது.
- source_word: לִהְיוֹת עֹשִׂים
  choice: அவர்கள் அனுசரிக்க வேண்டும் என்று
  rationale: சொல்லுக்குச் சொல் ‘செய்துகொண்டிருக்க’ என்பதாகும். குறிப்பிட்ட நினைவுநாட்களைச் சார்ந்த சூழலில் ‘அனுசரிக்க’ என்பது தொடர்ச்சியான பண்டிகைக் கடைப்பிடிப்பைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: אֵת יוֹם אַרְבָּעָה עָשָׂר
  choice: பதினான்காம் நாளையும்
  rationale: எபிரெய தேதிக் குறிப்பை நவீனத் தமிழின் வழக்கமான வரிசை எண் அமைப்பில் துல்லியமாக வழங்குகிறது.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: ஆதார் மாதத்தின்
  rationale: எபிரெய நாட்காட்டிப் பெயரான אֲדָר என்பதை ‘ஆதார்’ என்று ஒலிபெயர்த்து, தேதியுடனான உறவை இயல்பான தமிழ் உடைமை அமைப்பில் காட்டுகிறது.
- source_word: וְאֵת יוֹם חֲמִשָּׁה עָשָׂר בּוֹ
  choice: அதே மாதத்தின் பதினைந்தாம் நாளையும்
  rationale: בּוֹ முன் குறிப்பிடப்பட்ட ஆதார் மாதத்தையே சுட்டுகிறது. தமிழில் தெளிவுக்காக ‘அதே மாதத்தின்’ என்று வெளிப்படையாக வழங்கப்பட்டுள்ளது.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: ஆண்டுதோறும்
  rationale: ‘ஒவ்வோர் ஆண்டும் ஆண்டும்’ என்ற எபிரெய மறுபதிப்பு பகிர்வியல் வலியுறுத்தலைக் கொண்டது. ‘ஆண்டுதோறும்’ அதன் வருடாந்திர தொடர்ச்சியை இயல்பான தமிழில் தருகிறது.
