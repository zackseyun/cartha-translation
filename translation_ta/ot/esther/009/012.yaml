  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֡ה הָרְגוּ֩ הַ/יְּהוּדִ֨ים וְ/אַבֵּ֜ד חֲמֵ֧שׁ מֵא֣וֹת אִ֗ישׁ וְ/אֵת֙ עֲשֶׂ֣רֶת בְּנֵֽי הָמָ֔ן בִּ/שְׁאָ֛ר מְדִינ֥וֹת הַ/מֶּ֖לֶךְ מֶ֣ה עָשׂ֑וּ וּ/מַה שְּׁאֵֽלָתֵ/ךְ֙ וְ/יִנָּ֣תֵֽן לָ֔/ךְ וּ/מַה בַּקָּשָׁתֵ֥/ךְ ע֖וֹד וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
translation:
  language: ta
  text: அப்போது அரசன் எஸ்தர் ராணியிடம், “சூசான் கோட்டையில் யூதர்கள் ஐந்நூறு ஆண்களையும் ஆமானின் பத்து மகன்களையும் கொன்று அழித்திருக்கிறார்கள். அப்படியானால், அரசனுடைய மற்ற மாகாணங்களில் அவர்கள் என்ன செய்திருக்கிறார்கள்?[a] இப்போது உன் விண்ணப்பம் என்ன? அது உனக்கு வழங்கப்படும். இன்னும் உன் வேண்டுகோள் என்ன? அது நிறைவேற்றப்படும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனுடைய மற்ற மாகாணங்களில் அவர்கள் என்ன செய்திருக்கிறார்கள்?” எபிரெய வினாவை இவ்வாறு எளிமையாகவும் வாசிக்கலாம்; முதன்மை உரையிலுள்ள “அப்படியானால்” என்பது சூசானைப் பற்றிய அறிக்கையிலிருந்து அரசன் ஊகிப்பதை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: சூசான் கோட்டையில்
  rationale: בִּירָה என்பது அரசருக்குரிய பாதுகாப்புமிக்க கோட்டை வளாகத்தைக் குறிக்கிறது. ‘கோட்டை’ என்பது இங்கு இயல்பான, தெளிவான நவீனத் தமிழ் சொல்.
- source_word: הָרְגוּ ... וְאַבֵּד
  choice: கொன்று அழித்திருக்கிறார்கள்
  rationale: எபிரெய மொழியில் உள்ள இரு வினைகளின் கூட்டுவலிமையையும் வன்முறையின் தீவிரத்தையும் இச்சொற்றொடர் காக்கிறது.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: ஐந்நூறு ஆண்கள்
  rationale: எண்ணுக்குப் பின் பகிர்ந்த ஒருமையாக வரும் אִישׁ இங்கு ஆண்களைக் குறிக்கிறது; பாலினக் குறிப்பைத் துல்லியமாகப் பேணுகிறது.
- source_word: וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  choice: ஆமானின் பத்து மகன்களையும்
  rationale: கூடுதல் நேரடிச் செயப்படுபொருளைத் தமிழின் ‘-யும்’ இணைப்பு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ
  choice: அரசனுடைய மற்ற மாகாணங்களில்
  rationale: பாரசீகப் பேரரசின் நிர்வாகப் பகுதிகளுக்கு ‘மாகாணங்கள்’ பொருத்தமானது; שְׁאָר என்பதன் மீதமுள்ள/மற்ற என்ற பொருளும் பேணப்படுகிறது.
- source_word: מֶה עָשׂוּ
  choice: அப்படியானால் ... அவர்கள் என்ன செய்திருக்கிறார்கள்?
  rationale: சூசானில் நடந்ததை அடிப்படையாகக் கொண்ட அரசனின் ஊகத்தொனியை ‘அப்படியானால்’ வெளிப்படுத்துகிறது; அடிப்படை வினா footnote-இல் தரப்படுகிறது.
- source_word: שְּׁאֵלָתֵךְ
  choice: உன் விண்ணப்பம்
  rationale: அரசரிடம் முறையாக முன்வைக்கும் கோரிக்கையைக் குறிக்கும் அரசவைக் கூறாக ‘விண்ணப்பம்’ பொருந்துகிறது.
- source_word: וְיִנָּתֵן לָךְ
  choice: அது உனக்கு வழங்கப்படும்
  rationale: נתן என்பதன் செயப்பாட்டு வடிவத்தைப் பேணுவதோடு, அரசன் ஒரு விண்ணப்பத்தை ஏற்றுக்கொள்வதையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בַּקָּשָׁתֵךְ עוֹד
  choice: இன்னும் உன் வேண்டுகோள்
  rationale: இரண்டாம் கோரிக்கையின் கூடுதல் தன்மையை עוֹד குறிக்கிறது; ‘இன்னும்’ அதை நேரடியாகப் பேணுகிறது. ‘வேண்டுகோள்’ முதல் சொல்லுடனான பொருள் நெருக்கத்தையும் சிறிய சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: וְתֵעָשׂ
  choice: அது நிறைவேற்றப்படும்
  rationale: வேண்டுகோள் செயல்படுத்தப்படும் என்ற சூழ்நிலைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
