  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified அரசவைக் கூறு பயன்படுத்தப்பட்டுள்ளது. ‘விண்ணப்பம்/வேண்டுகோள்’ என்ற நெருங்கிய பொருளுடைய இரு சொற்கள் மூலத்தின் இணைச்சொல் வேறுபாட்டைப் பேணுகின்றன; அரசனின் வினாவில் உள்ள ஊகத்தன்மை முதன்மை உரையிலும் மாற்று எளிய வாசிப்பு அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
