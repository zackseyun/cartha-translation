  text: וַ֠/תִּכְתֹּב אֶסְתֵּ֨ר הַ/מַּלְכָּ֧ה בַת אֲבִיחַ֛יִל וּ/מָרְדֳּכַ֥י הַ/יְּהוּדִ֖י אֶת כָּל תֹּ֑קֶף לְ/קַיֵּ֗ם אֵ֣ת אִגֶּ֧רֶת הַ/פּוּרִ֛ים הַ/זֹּ֖את הַ/שֵּׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
translation:
  language: ta
  text: அபிகாயிலின் மகளான எஸ்தர் அரசி, யூதனான மொர்தெகாயுடன், முழு அதிகாரத்துடன்[a] பூரீமின் இந்த இரண்டாவது கடிதத்தை உறுதிப்படுத்துவதற்காக எழுதினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முழு வலிமையுடன்’ அல்லது ‘முழு சட்டப்பூர்வ வலிமையுடன்.’ இந்த எபிரெயச் சொற்றொடர் கடிதத்தின் அதிகாரப்பூர்வ வலிமையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: எழுதினாள்
  rationale: வினைச்சொல் பெண்பால் ஒருமையில் இருப்பதால், எஸ்தரையே இலக்கண எழுவாயாகக் கொண்டு இறந்தகாலத் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶסְתֵּר הַמַּלְכָּה בַת אֲבִיחַיִל
  choice: அபிகாயிலின் மகளான எஸ்தர் அரசி
  rationale: எஸ்தரின் அரசப் பதவியையும் வம்ச அடையாளத்தையும் எபிரெய மூலத்தின் அடுக்கிற்கு நெருக்கமாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  choice: யூதனான மொர்தெகாயுடன் சேர்ந்து
  rationale: மூல வினைச்சொல் பெண்பால் ஒருமையில் இருப்பதை மதித்து, மொர்தெகாயை எஸ்தருடன் இணைந்து செயல்பட்டவராகத் தமிழில் இயல்பாகக் காட்டுகிறது; இருவரையும் பன்மை எழுவாயாக்கி மூல இலக்கணத்தை மறைக்கவில்லை.
- source_word: אֶת כָּל תֹּקֶף
  choice: முழு அதிகாரத்துடன்
  rationale: תֹּקֶף என்பதன் வலிமை, செயல்திறன், அதிகாரபூர்வ வலு ஆகிய பொருள்களில், அரசாணைத் தன்மை கொண்ட கடிதச் சூழலுக்கு ‘முழு அதிகாரத்துடன்’ மிகத் தெளிவாகப் பொருந்துகிறது.
- source_word: לְקַיֵּם
  choice: உறுதிப்படுத்துவதற்காக
  rationale: ஏற்கெனவே நிறுவப்பட்ட பூரீம் அனுசரிப்பையும் அதைப் பற்றிய கடிதத்தையும் அதிகாரபூர்வமாக நிலைநிறுத்தும் நோக்கத்தைத் தெரிவிக்கிறது.
- source_word: אִגֶּרֶת הַפּוּרִים הַזֹּאת הַשֵּׁנִית
  choice: பூரீம் குறித்த இந்த இரண்டாவது கடிதம்
  rationale: எபிரெயக் கட்டமைப்பின் தொடர்பைத் தெளிவான நவீன தமிழில் வழங்கி, குறிப்பிட்ட இரண்டாவது கடிதம் என்பதையும் காக்கிறது.
