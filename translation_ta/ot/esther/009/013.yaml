base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
translation:
  language: ta
  text: எஸ்தர், “அரசருக்கு விருப்பமானால், சூசானில் உள்ள யூதர்கள் நாளையும் இன்றைய ஆணையின்படி செய்ய அனுமதிக்கப்படட்டும்; ஆமானின் பத்து மகன்களையும் மரத்தில் தொங்கவிடட்டும்[a]” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூக்குமேடையில் தொங்கவிடட்டும்” அல்லது “மரக்கம்பில் குத்தியேற்றப்படட்டும்.” எபிரேயத்தில் சொல்லுக்குச் சொல் “மரத்தில்/மரப்பொருளில்” என்று உள்ளது; இச்சூழலில் அது தண்டனை நிறைவேற்றப் பயன்படுத்தப்பட்ட ஒரு மர அமைப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: அரசருக்கு விருப்பமானால்
  rationale: இது நன்மை குறித்த ஒழுக்கத் தீர்ப்பை அல்ல, அரசரின் விருப்பத்தையும் ஒப்புதலையும் குறிக்கும் அரண்மனை வழக்குச்சொல்.
- source_word: יִנָּתֵן
  choice: அனுமதி அளிக்கப்படட்டும்
  rationale: செயப்பாட்டு வேண்டுகோள் நுணுக்கத்தையும் அரசரிடமிருந்து கோரப்படும் அதிகாரபூர்வ அனுமதியையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: גַּם מָחָר
  choice: நாளையும்
  rationale: இன்றைய அதிகாரத்தை அடுத்த நாளுக்கும் நீட்டிக்கும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: சூசானில் இருக்கும் யூதர்கள்
  rationale: எபிரேய உறவுத்தொடரையும் அனுமதியின் பயனாளிகளையும் இயல்பாகக் காட்டுகிறது.
- source_word: לַעֲשׂוֹת כְּדָת הַיּוֹם
  choice: இன்றைய ஆணையின்படியே ... செய்ய
  rationale: דָּת என்பதன் அரச ஆணை சார்ந்த பொருளைப் பேணுகிறது; ‘செய்ய’ என்பதைக் குறிப்பிட்ட செயலாக விளக்காமல் மூலத்தின் பொதுமையைத் தக்கவைக்கிறது.
- source_word: דָּת
  choice: ஆணை
  rationale: எஸ்தர் நூலின் பாரசீக அரசவைச் சூழலில் அதிகாரபூர்வ அரச ஆணையைச் சுட்டும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: ஆமானின் பத்துப் மகன்கள்
  rationale: எபிரேய உடைமைத் தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: יִתְלוּ עַל־הָעֵץ
  choice: மரக்கழுவில் தொங்கவிடப்படட்டும்
  rationale: תלה என்பதன் ‘தொங்கவிடு’ பொருளையும் עֵץ என்பதன் மரத்தாலான தண்டனை அமைப்பு என்ற சூழல்சார் பொருளையும் தருகிறது; அமைப்பின் துல்லிய வடிவம் உறுதியல்ல என்பதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
