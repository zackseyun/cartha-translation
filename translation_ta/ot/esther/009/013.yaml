translation_notes:
  register: நவீன, கண்ணியமான, பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசவைக்குரிய மரியாதைத் தொனி ‘அரசருக்கு விருப்பமானால்’ என்பதில் பேணப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் நீண்ட வேண்டுகோள் அமைப்பு தமிழில் தெளிவாகப் பிரிக்கப்பட்டாலும் ஒரே நேரடி உரையாக வைக்கப்பட்டுள்ளது.
