    rationale: சேர்க்கப்பட்ட ‘இவை நடந்தன’ நீக்கப்பட்ட பின், இந்த அடிக்குறிப்பில் உள்ள முக்கிய விளக்கம் பொருந்தாது. எபிரெய வினைவடிவங்களின் மாற்று ஆங்கிலப் பிரதிநிதித்துவம் தமிழ்வாசகருக்குத் தேவையான உரை-அடிக்குறிப்பு அல்ல.
