  text: on the thirteenth day of the month of Adar[a], and resting on the fourteenth day of it[b], and making it a day of feasting and gladness.
translation:
  language: ta
  text: ஆதார் மாதத்தின் பதின்மூன்றாம் நாளில்; அந்த மாதத்தின் பதினான்காம் நாளில்[a] ஓய்வெடுத்து, அதை விருந்தும் மகிழ்ச்சியும் கொண்ட நாளாக ஆக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ஆதார் மாதத்தின் பதினான்காம் நாள்.
    reason: cultural_note
lexical_decisions:
- source_word: בְּיוֹם שְׁלֹשָׁה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: ஆதார் மாதத்தின் பதின்மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் בְּ முன்னிடைச்சொல்லையும், தேதியிடும் சூழலில் வரிசை எண்ணாகச் செயல்படும் எபிரெய எண்ணையும் இயல்பான நவீனத் தமிழில் தருகிறது; אֲדָר மாதப்பெயர் ‘ஆதார்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וְנוֹחַ
  choice: அவர்கள் ஓய்வெடுத்து
  rationale: נוח இங்கு போர்ச் செயலிலிருந்து ஓய்வதைக் குறிக்கிறது. எழுவாய் முந்தைய சூழலிலிருந்து பெறப்பட்டு, தமிழ் வாக்கியத் தெளிவுக்காக வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: בְּאַרְבָּעָה עָשָׂר בּוֹ
  choice: அந்த மாதத்தின் பதினான்காம் நாளில்
  rationale: בּוֹ என்பது முன்பு கூறப்பட்ட ஆதார் மாதத்தையே சுட்டுகிறது; தெளிவான தமிழுக்காக ‘அந்த மாதத்தின்’ என்று விரிக்கப்பட்டுள்ளது.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: அதை ... உரிய நாளாக்கினார்கள்
  rationale: அந்த நாளை ஒரு குறிப்பிட்ட தன்மையுடைய நாளாக ஆக்குதல் அல்லது கடைப்பிடித்தல் என்ற கருத்தைத் தருகிறது; ‘நாளாக்கினார்கள்’ என்பது எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: יוֹם מִשְׁתֶּה
  choice: விருந்துக்கு உரிய நாள்
  rationale: מִשְׁתֶּה விருந்து, விருந்துண்ணல், பானத்துடன் கூடிய கொண்டாட்டம் ஆகியவற்றைக் குறிக்கலாம்; ‘விருந்து’ அதன் பரந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: וְשִׂמְחָה
  choice: மகிழ்ச்சிக்கு உரிய நாள்
  rationale: שִׂמְחָה என்பது மகிழ்ச்சி அல்லது கொண்டாட்டத்தைக் குறிக்கிறது; பெயர்ச்சொல் வடிவம் தமிழிலும் காக்கப்பட்டுள்ளது.
