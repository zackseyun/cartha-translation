  verdict: revise
  source_fidelity: மூல எபிரெயம் வசனத்தின் தொடக்கத்தில் தனி முதன்மை வினையை வழங்கவில்லை; அது முந்தைய வசனத்தின் நிகழ்வுத் தொடரின் பகுதியாகத் தேதியைக் குறிப்பிடுகிறது. வரைவில் சேர்க்கப்பட்டுள்ள ‘இவை நடந்தன’ மூலத்தில் வெளிப்படையாக இல்லை. அதை நீக்கி, எபிரெயத்தின் தொடர்ச்சித் தன்மையைத் தமிழில் காக்க வேண்டும். ‘ஓய்வெடுத்து’ மற்றும் ‘ஆக்கினார்கள்’ என்பது וְנוֹחַ, וְעָשֹׂה אֹתוֹ ஆகியவற்றைச் சரியாக வழங்குகின்றன.
  naturalness: திருத்தப்பட்ட வாக்கியம் நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. ‘விருந்துக்கும் மகிழ்ச்சிக்கும் உரிய நாளாக்கினார்கள்’ என்பதற்குப் பதிலாக ‘விருந்தும் மகிழ்ச்சியும் கொண்ட நாளாக ஆக்கினார்கள்’ என்பது தெளிவான, இயல்பான இணைச்சொல் அமைப்பாகும்.
  terminology: ‘ஆதார்’ மாதப்பெயருக்குப் பொருத்தமான ஒலிபெயர்ப்பு. ‘விருந்து,’ ‘மகிழ்ச்சி,’ ‘ஓய்வெடுத்து’ ஆகியவை மூலத்தின் பொருளையும் நடையையும் நன்றாகக் காக்கின்றன. בּוֹ குறிக்கும் மாதத்தைத் தெளிவுபடுத்தும் ‘அந்த மாதத்தின்’ பொருத்தமானது.
  issues:
  - severity: medium
    issue: ‘இவை நடந்தன’ என்ற சேர்க்கை
    rationale: மூல எபிரெயத்தில் வசனம் இவ்வாறு தனி முதன்மை வினையுடன் தொடங்கவில்லை. முந்தைய வசனத் தொடரைத் தமிழில் முழுமையாக்குவதற்காகச் சேர்க்கப்பட்டாலும், அது மூலத்தில் இல்லாத நிகழ்வுக் கூற்றை உருவாக்குகிறது. அடிக்குறிப்பு சேர்க்கையை ஒப்புக்கொள்வது அதை மூலத்துக்கு உண்மையானதாக ஆக்காது.
  - severity: low
