translation:
  language: ta
  text: அந்த நாளில், சூசான் கோட்டையில் கொல்லப்பட்டவர்களின் எண்ணிக்கை அரசனின் முன்னிலையில் வந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּשַׁן הַבִּירָה
  choice: சூசான் கோட்டை
  rationale: שׁוּשַׁן என்ற இடப்பெயரை ஒலிபெயர்த்து, הַבִּירָה என்பதைக் கோட்டையமைந்த அரச மையத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்லாக மொழிபெயர்க்கிறது.
- source_word: בָּא ... לִפְנֵי הַמֶּלֶךְ
  choice: அரசனின் முன்னிலையில் வந்தது
  rationale: எபிரெய மூலத்தின் ‘வந்தது’ என்ற நேரடி உருவகத்தையும், தகவல் அரசனிடம் எட்டிய பொருளையும் தேவையின்றி விளக்கிவிடாமல் பாதுகாக்கிறது.
- source_word: מִסְפַּר הַהֲרוּגִים
  choice: கொல்லப்பட்டவர்களின் எண்ணிக்கை
  rationale: இது உயிரிழந்தவர்களின் கணக்கைக் குறிக்கிறது; செயப்பாட்டு வடிவம் மூலத்தின் பொருளைத் தெளிவாகப் பிரதிபலிக்கிறது.
