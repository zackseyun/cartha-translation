  naturalness: «அந்த நாளில், சூசான் கோட்டையில் கொல்லப்பட்டவர்களின் எண்ணிக்கை அரசனின் முன்னிலையில் வந்தது» என்பது நவீன தரத் தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம உரைநடையிலும் உள்ளது. ‘முன்னிலையில் வந்தது’ மூலத்தின் சொல்லாட்சியை இயல்பாகத் தக்கவைக்கிறது.
