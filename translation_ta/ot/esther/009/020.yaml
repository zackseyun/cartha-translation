base_translation:
  language: en
  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
translation:
  language: ta
  text: 'மொர்தெகாய் இந்தக் காரியங்களை[a] எழுதி, அகாஸ்வேரு அரசனுடைய எல்லா மாகாணங்களிலும் அருகிலும் தொலைவிலும் வாழ்ந்த யூதர்கள் அனைவருக்கும் கடிதங்களை அனுப்பினார்.


    [a] அல்லது, “இந்தச் சொற்களை.” எபிரெயச் சொல், இப்போது விவரிக்கப்பட்ட நிகழ்வுகளையோ அவற்றைக் குறித்து மொர்தெகாய் எழுதிய சொற்களையோ குறிக்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தச் சொற்களை.” எபிரெயச் சொல், இப்போது விவரிக்கப்பட்ட நிகழ்வுகளையோ அவற்றைக் குறித்து மொர்தெகாய் எழுதிய சொற்களையோ குறிக்கலாம்.
    reason: הַדְּבָרִים הָאֵלֶּה என்பதில் நிகழ்வுகள்/காரியங்கள் மற்றும் எழுதப்பட்ட சொற்கள் என்ற இரு பொருள் வாய்ப்புகளும் உள்ளன.
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: எழுதி
  rationale: כתב என்ற வினை நேரடியாக எழுதுவதைக் குறிக்கிறது; தொடர்ச்சியான கதைநடையில் “எழுதி” இயல்பாக அமைகிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்தக் காரியங்களை
  rationale: דְּבָרִים என்பது “சொற்கள்,” “காரியங்கள்,” அல்லது விவரிக்கப்பட்ட நிகழ்வுகள் ஆகியவற்றைக் குறிக்கக்கூடும். “இந்தக் காரியங்களை” என்ற மொழிபெயர்ப்பு பொருளை அளவுக்கு மீறிக் குறுக்காமல் பரந்த அர்த்தத்தைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: கடிதங்களை அனுப்பினார்
  rationale: பாரசீகப் பேரரசின் நிர்வாகச் சூழலில் סְפָרִים என்பது அனுப்பப்பட்ட எழுத்துப்பூர்வமான செய்திகளைக் குறிக்கிறது; தமிழில் “கடிதங்கள்” தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כָּל הַיְּהוּדִים
  choice: யூதர்கள் அனைவருக்கும்
  rationale: இது பேரரசெங்கும் இருந்த யூத சமூகத்தைக் குறிக்கும் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: בְּכָל מְדִינוֹת
  choice: எல்லா மாகாணங்களிலும்
  rationale: מְדִינוֹת என்பது பேரரசின் நிர்வாகப் பிரிவுகளைக் குறிக்கிறது; அதற்கு “மாகாணங்கள்” பொருத்தமான தமிழ் இணைச்சொல்.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு அரசனுடைய
  rationale: எபிரெயச் சொற்றொடரின் உடைமைத் தொடர்பை இயல்பான தமிழில் வழங்கி, பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  choice: அருகிலும் தொலைவிலும் வாழ்ந்த
  rationale: இணையான இந்த உரிச்சொற்கள் பேரரசின் எல்லாப் பகுதிகளிலும் இருந்த யூதர்களைக் குறிக்கின்றன. தமிழ் வடிவம் அந்த விரிவான இடக்குறிப்பை இயல்பாகத் தக்கவைக்கிறது.
- source_word: וַ
  choice: வாக்கியத் தொடர்ச்சியால் வெளிப்படுத்தப்பட்டது
  rationale: தொடக்க வாவ் கதைநடையின் அடுத்த நிகழ்வை இணைக்கிறது. தமிழில் தனியாக “பின்பு” சேர்க்காமலேயே வினைத் தொடர்ச்சி அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
