  register: நவீனத் தரத் தமிழில் எளிமையான, மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. “காரியங்கள்,” “மாகாணங்கள்,” “கடிதங்கள்” ஆகியவை பொதுவாகப் புரியும் சொற்களாகவும் மூலத்தின் நிர்வாக மற்றும் கதைச் சூழலுக்கு ஏற்றவையாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
