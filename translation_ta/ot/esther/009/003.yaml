translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பாரசீக நிர்வாகப் பதவிகளுக்கிடையிலான வேறுபாட்டைக் காக்க ‘சத்ரப்கள்’ என்ற வரலாற்றுப் பதவி ஒலிபெயர்க்கப்பட்டுள்ளது; அரிதான இச்சொல்லைச் சுற்றியுள்ள நிர்வாகப் பட்டியல் அதன் பொருளை உணர உதவுகிறது. மூலத்தின் தெளிவான காரணத் தொடர்பும் ‘அச்சம் விழுதல்’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
