base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
translation:
  language: ta
  text: மாகாணங்களின் அதிகாரிகள் அனைவரும், சத்ரப்களும், ஆளுநர்களும், அரசனுடைய பணிகளைச் செய்தவர்களும் யூதர்களுக்கு ஆதரவளித்தார்கள்[a]. ஏனெனில் மொர்தெகாயைப் பற்றிய அச்சம் அவர்கள்மேல் விழுந்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதர்களுக்கு உதவினார்கள்.’ இதற்கான எபிரெய வினைச்சொல் அவர்களை ‘உயர்த்தினார்கள்’ அல்லது அவர்களுக்குச் ‘சாதகமாக நடந்துகொண்டார்கள்’ என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: மாகாணங்களின் அதிகாரிகள்
  rationale: மாகாண நிர்வாகப் பொறுப்பில் இருந்த ஆட்சியாளர்களை அல்லது அதிகாரிகளைக் குறிக்கும் சொற்றொடர்; பட்டியலில் தொடர்ந்து வரும் நிர்வாகப் பதவிகளோடு பொருந்தும் இயல்பான நவீனத் தமிழ்.
- source_word: אֲחַשְׁדַּרְפְּנִים
  choice: சத்ரப்கள்
  rationale: பாரசீகப் பேரரசின் தனித்த நிர்வாகப் பதவியைப் பொதுவான ‘ஆளுநர்கள்’ என்ற சொல்லோடு கலக்காமல், வரலாற்றுச் சூழலைப் பாதுகாக்கும் ஒலிபெயர்ப்பு.
- source_word: פַּחוֹת
  choice: ஆளுநர்கள்
  rationale: சத்ரப்களிலிருந்து வேறுபட்ட ஒரு பிராந்திய நிர்வாகப் பதவிக்கான தெளிவான நவீனத் தமிழ் இணை.
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ
  choice: அரசனுடைய பணிகளைச் செய்தவர்கள்
  rationale: ‘அரசனுக்குரிய பணியைச் செய்பவர்கள்’ என்ற எபிரெயச் சொற்றொடரின் அகன்ற பொருளையும், அரச அலுவலர்கள் என்ற சாத்தியத்தையும் குறுக்காமல் காக்கிறது.
- source_word: מְנַשְּׂאִים אֶת־הַיְּהוּדִים
  choice: யூதர்களுக்கு ஆதரவளித்தார்கள்
  rationale: நָשָׂא என்பதன் ஹிஃபில் வடிவம் உயர்த்துதல், தாங்குதல், உதவுதல் அல்லது ஆதரித்தல் ஆகிய பொருள்களை ஏற்கலாம்; இச்சூழலில் நடைமுறை உதவியையும் சாதகமான அணுகுமுறையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அதிகாரிகள் யூதர்களை ஆதரித்ததற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  choice: மொர்தெகாயைப் பற்றிய அச்சம் அவர்கள்மேல் விழுந்திருந்தது
  rationale: அச்சம் ஒருவர்மேல் ‘விழுதல்’ என்ற எபிரெய உருவகத்தையும், சூழலில் ஏற்கெனவே ஏற்பட்டிருந்த நிலையைச் சுட்டும் வினை வடிவத்தையும் பாதுகாக்கிறது; அச்சத்தின் தொடர்பைத் தமிழில் இயல்பாகக் காட்ட ‘பற்றிய’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מָרְדֳּכַי
  choice: மொர்தெகாய்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவத்தில் தரப்பட்டுள்ளது.
