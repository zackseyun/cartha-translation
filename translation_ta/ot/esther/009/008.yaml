  text: and Poratha[a], and Adalia, and Aridatha.
translation:
  language: ta
  text: போராத்தாவையும்[a], அதலியாவையும், அரிதாத்தாவையும் கொன்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனம் முந்தைய வசனங்களில் தொடரும் ஆமானின் மகன்களுடைய பெயர்ப்பட்டியலின் ஒரு பகுதியாகும்; “கொன்றார்கள்” என்ற வினை எஸ்தர் 9:6-இலிருந்து பொருளில் எடுத்துக்கொள்ளப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אֵת
  choice: -ஐயும் / -ஆவையும்
  rationale: וְ இணைப்பைத் தமிழின் ‘-உம்’ விகுதியாலும், אֵת குறிக்கும் நேர்செயப்படுபொருளை இரண்டாம் வேற்றுமை விகுதியாலும் வெளிப்படுத்துவது தொடரும் பட்டியலின் இலக்கணப் பங்கை இயல்பாகக் காட்டுகிறது.
- source_word: פּוֹרָתָא
  choice: போராத்தா
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்தை நவீனத் தமிழ் எழுத்துமுறையில் ஒலிபெயர்த்துள்ளது.
- source_word: אֲדַלְיָא
  choice: அதலியா
  rationale: எபிரெய தனிப்பெயரை அதன் மெய்யொலிகளுக்கு ஏற்றவாறு தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֲרִידָתָא
  choice: அரிதாத்தா
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவத்தைத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: (understood from Esther 9:7)
  choice: கொன்றார்கள்
  rationale: மூலத்தில் இவ்வசனம் முந்தைய வசனத்தின் வினையைத் தொடர்ந்து வரும் பெயர்ப்பட்டியல். தனி வசனமாக வாசிக்கத் தெளிவாக இருக்க, எஸ்தர் 9:7-இன் ‘கொன்றார்கள்’ என்ற வினை இங்கே வெளிப்படையாக வழங்கப்பட்டுள்ளது; இதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூன்று பெயர்களின் பட்டியல் ‘-ஆவையும்’ என்ற இணைப்பு-வேற்றுமை அமைப்பால் பாதுகாக்கப்பட்டுள்ளது; மூலத்தில் மறைந்துள்ள வினை வாசிப்புத் தெளிவுக்காகச் சேர்க்கப்பட்டு அடிக்குறிப்பில் சுட்டப்பட்டுள்ளது.
