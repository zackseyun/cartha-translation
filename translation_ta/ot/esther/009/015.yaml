base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
translation:
  language: ta
  text: சூசானில் இருந்த யூதர்களும் ஆதார் மாதத்தின் பதினான்காம் நாளில் ஒன்றுகூடி, சூசானில் முந்நூறு ஆண்களைக் கொன்றார்கள். ஆனால் கொள்ளைப் பொருள்மீது அவர்கள் கை வைக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லர்த்தமாக, “கொள்ளைப் பொருளை நோக்கித் தங்கள் கையை நீட்டவில்லை.”
    reason: எபிரெய மரபுத்தொடரின் சொல்லர்த்த வடிவத்தைப் பாதுகாக்கும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: ஒன்றுகூடி
  rationale: קהל என்பதன் இவ்வடிவம் ஒரு குழுவாக நோக்கத்துடன் கூடிவருவதைக் குறிக்கிறது; ‘ஒன்றுகூடி’ என்பது இயல்பான, தெளிவான நவீனத் தமிழ்.
- source_word: הַיְּהוּדִים
  choice: யூதர்கள்
  rationale: எஸ்தர் நூலில் இது பெர்சியப் புலம்பெயர் சூழலில் உள்ள யூத இன-சமய மக்களைக் குறிக்கிறது; ‘யூதர்கள்’ என்பது நிலையான தமிழ்ச் சொல்.
- source_word: אֲשֶׁר בְּשׁוּשָׁן
  choice: சூசானில் இருந்த
  rationale: சூசான் நகரத்தில் வாழ்ந்த யூதர்களைத் தனிப்படுத்தும் தொடர்புச் சொல்லை இயல்பான தமிழில் தருகிறது.
- source_word: גַּם
  choice: -உம்
  rationale: முந்தைய நிகழ்வுகளோடு இதையும் சேர்க்கும் பொருளை ‘யூதர்களும்’ என்ற இணைப்புருபு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: ஆதார் மாதத்தின் பதினான்காம் நாளில்
  rationale: எபிரெய தேதிக் குறிப்பின் முழுமையையும் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיַּהַרְגוּ
  choice: கொன்றார்கள்
  rationale: הרג என்பதன் நேரடியான பொருள் ‘கொல்லுதல்’; மறைமுகமாகவோ மென்மைப்படுத்தியோ மொழிபெயர்க்காமல் நேராகத் தரப்படுகிறது.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: முந்நூறு ஆண்களை
  rationale: எண்ணுக்குப் பின் வரும் ஆண்பால் אִישׁ என்பதைக் கருத்தில் கொண்டு, பாலினக் குறிப்பைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: וּבַבִּזָּה
  choice: ஆனால் கொள்ளைப் பொருள்மீது
  rationale: בִּזָּה போராட்டத்தில் கைப்பற்றப்படும் பொருட்களைக் குறிக்கிறது. முன்னுள்ள கொலைச் செயலுக்கும் பொருட்களை எடுத்துக்கொள்ளாததற்கும் இடையிலான மாறுபாட்டால் וְ என்பது ‘ஆனால்’ என வழங்கப்பட்டுள்ளது.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: அவர்கள் கை வைக்கவில்லை
  rationale: சொல்லர்த்தமாக ‘தங்கள் கையை நீட்டவில்லை’ என்ற எபிரெய மரபுத்தொடர், இங்கு கொள்ளைப் பொருளை எடுத்துக்கொள்ளவில்லை என்பதைக் குறிக்கிறது; ‘கை வைக்கவில்லை’ என்பது உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
