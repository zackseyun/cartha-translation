translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தெளிவுக்காக இரு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘பூர்’ என்ற பண்பாட்டுச் சொல் தக்கவைக்கப்பட்டு உடனடியாக விளக்கப்பட்டுள்ளது; לְהֻמָּם என்பதின் உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
