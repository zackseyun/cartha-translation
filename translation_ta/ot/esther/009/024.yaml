base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
translation:
  language: ta
  text: ஏனெனில், அம்மெதாத்தாவின் மகனான ஆகாகியன் ஆமான், யூதர்கள் அனைவரின் பகைவனாக இருந்து, யூதர்களை அழிப்பதற்காக அவர்களுக்கு எதிராகச் சதித்திட்டம் தீட்டினான். மேலும், அவர்களை நிலைகுலையச் செய்து[b] அழிப்பதற்காகப் பூர்[a]—அதாவது, சீட்டு—போட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பூர்’ என்பதை வசனமே ‘சீட்டு’ என்று விளக்குகிறது. இச்சொல்லைத் தக்கவைப்பது, சுற்றியுள்ள பகுதியில் வரும் ‘பூரீம்’ என்ற பெயருடனான தொடர்பைப் பாதுகாக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, ‘அவர்களைப் பீதியடையச் செய்து’, ‘அவர்களைக் குழப்பி’, அல்லது ‘அவர்களை நசுக்கி’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வசனங்களில் கூறப்படும் பூரீம் அனுசரிப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  choice: அம்மெதாத்தாவின் மகனும் ஆகாகியனுமான ஆமான்
  rationale: தனிப்பெயர்களையும் ஆகாகுடன் தொடர்புடைய இன/வம்ச அடையாளத்தையும் ஒலிபெயர்த்து பாதுகாக்கிறது.
- source_word: צֹרֵר כָּל הַיְּהוּדִים
  choice: யூதர்கள் அனைவரின் பகைவன்
  rationale: எல்லா யூதர்களுக்கும் எதிராகச் செயல்படும் பகைவன் என்ற பங்கேற்புவினையின் வலிமையையும் முழுமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: חָשַׁב עַל הַיְּהוּדִים
  choice: யூதர்களுக்கு எதிராகச் சதித்திட்டம் தீட்டினான்
  rationale: இச்சூழலில் வெறும் எண்ணத்தை அல்ல, தீங்கிழைக்கும் திட்டமிடுதலைக் குறிக்கிறது.
- source_word: לְאַבְּדָם
  choice: அவர்களை அழிப்பதற்காக
  rationale: இங்கு אבד என்பதன் காரணவினைப் பொருளான முழுமையான அழிவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְהִפִּיל פּוּר
  choice: பூர் போட்டான்
  rationale: பாரசீகக் கடன்சொல்லான ‘பூர்’ என்பதைத் தக்கவைத்து, பூரீம் என்ற பெயருடனான சொல்லிணைப்பைப் பாதுகாக்கிறது; ‘போட்டான்’ என்பது சீட்டுப் போடுதலைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: הוּא הַגּוֹרָל
  choice: அதாவது, சீட்டு
  rationale: அயல்மொழிச் சொல்லான ‘பூர்’ என்பதற்கு மூலவசனமே தரும் விளக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְהֻמָּם
  choice: அவர்களை நிலைகுலையச் செய்து
  rationale: המם என்பதிலுள்ள கலக்கம், பீதி, திகைப்பு அல்லது கடுமையாகத் தாக்குதல் ஆகிய பொருள் வரம்பை முற்றிலும் ஒரு திசையில் முடிவுசெய்யாமல் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּלְאַבְּדָם
  choice: அழிப்பதற்காக
  rationale: வசனத்தின் தொடக்கத்தில் வந்த அழித்தல் நோக்கத்தை இறுதியில் மீண்டும் கூறும் எபிரெய அமைப்பைப் பாதுகாக்கிறது.
