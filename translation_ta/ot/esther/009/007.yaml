lexical_decisions:
- source_word: וְאֵת
  choice: ஆகியோரையும்
  rationale: மீண்டும் வரும் וְאֵת, முந்தைய வசனத்தின் ‘கொன்றார்கள்’ என்ற வினைக்கான நேரடிச் செயப்படுபொருட்களின் பட்டியலைத் தொடர்கிறது. தமிழில் பட்டியலின் இறுதியில் ‘ஆகியோரையும்’ என்று கூறுவது அந்தத் தொடர்ச்சியையும் செயப்படுபொருள் உறவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פַּרְשַׁנְדָּתָא
  choice: பர்ஷந்தாத்தா
  rationale: பாரசீக மூலமுடையதாகக் கருதப்படும் நபரின் பெயர்; பொருள் மொழிபெயர்க்கப்படாமல் எபிரெய வடிவத்திற்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: דַּלְפוֹן
  choice: தல்போன்
  rationale: நபரின் பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய உச்சரிப்பிற்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַסְפָּתָא
  choice: அஸ்பாத்தா
  rationale: நபரின் பெயர் என்பதால் மொழிபெயர்க்காமல், எபிரெய வடிவத்தைப் பிரதிபலிக்கும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
