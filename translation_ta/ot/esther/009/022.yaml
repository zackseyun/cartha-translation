  source_fidelity: 'கருத்து பெரும்பாலும் மூலத்திற்கு உண்மையாக உள்ளது: பகைவர்களிடமிருந்து கிடைத்த ஓய்வு, துயரம் மகிழ்ச்சியாகவும் புலம்பல் நல்ல நாளாகவும் மாறுதல், விருந்து, பரிமாற்றம், ஏழைகளுக்கான கொடைகள் ஆகியவை அனைத்தும் உள்ளன. எனினும், “விருந்துண்டு மகிழும் நாட்கள்” என்பது יְמֵי מִשְׁתֶּה וְשִׂמְחָה என்பதன் பெயர்த் தொடர் அமைப்பைச் சற்றே தனிப்பட்ட செயலாக மாற்றுகிறது. மேலும், “கொண்டாடி ... அனுப்பி ... கொடுக்க வேண்டும்” என்ற இணைப்பு மூலத்தின் ‘அவற்றை ... நாட்களாக ஆக்க/அனுசரிக்க’ என்ற அமைப்பை விடக் குறைவாகத் தெளிவாக உள்ளது.'
