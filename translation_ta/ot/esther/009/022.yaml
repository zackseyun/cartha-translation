  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
translation:
  language: ta
  text: யூதர்கள் தங்கள் பகைவர்களிடமிருந்து ஓய்வு பெற்ற நாட்களாகவும், அவர்களுக்குத் துயரம் மகிழ்ச்சியாகவும், புலம்பல் நல்ல நாளாகவும்[a] மாறிய மாதமாகவும் அவற்றைக் கொண்டு, அவற்றை விருந்தும் மகிழ்ச்சியும் நிறைந்த நாட்களாகக் கொண்டாடவும், ஒருவன் தன் தோழனுக்குப் பங்குகளை[b] அனுப்பவும், ஏழைகளுக்குப் பரிசுகள் கொடுக்கவும் வேண்டும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விழா நாளாக” அல்லது “கொண்டாட்ட நாளாக.” எபிரெயத்தில் சொல்லுக்குச் சொல் “நல்ல நாளாக” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “பங்குகளை அனுப்புவது” என்பது விழாப் பரிசுகளாக உணவுப் பங்குகளை அனுப்புவதைக் குறிக்க வாய்ப்புள்ளது.
    reason: cultural_note
  - marker: c
    text: சொல்லுக்குச் சொல், “ஒருவன் தன் தோழனுக்கு.” இது ஒவ்வொருவரும் மற்றவருக்குக் கொடுப்பதைக் குறிக்கும் பகிர்ந்தளிப்பு மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחוּ
  choice: ஓய்வு பெற்ற
  rationale: נוח என்பது ஓய்வையோ விடுதலையையோ அடைவதைக் குறிக்கிறது. பகைவர்களின் அச்சுறுத்தலிலிருந்து கிடைத்த நிம்மதியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵאֹיְבֵיהֶם
  choice: தங்கள் பகைவர்களிடமிருந்து
  rationale: מִן பிரிவு அல்லது விடுதலையின் மூலத்தைச் சுட்டுகிறது; இங்கு பகைவர்களிடமிருந்து கிடைத்த ஓய்வைக் குறிக்கிறது.
- source_word: נֶהְפַּךְ
  choice: மாறிய
  rationale: הפך என்பதன் நிஃபால் வடிவம் ஏற்பட்ட மாற்றத்தைக் குறிக்கிறது. தமிழில் செயப்பாட்டு வடிவத்தை வற்புறுத்தாமல், நிறைவேறிய நிலைமாற்றத்தை இயல்பாகக் காட்டுகிறது.
- source_word: יָגוֹן
  choice: துயரம்
  rationale: ஆழ்ந்த வருத்தத்தைக் குறிக்கும் சொல்லாக இருந்து, மகிழ்ச்சியுடன் தெளிவான எதிர்மறை இணையை உருவாக்குகிறது.
- source_word: שִׂמְחָה
  choice: மகிழ்ச்சி / மகிழும்
  rationale: விழாக்கால மகிழ்ச்சியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֵבֶל
  choice: புலம்பல்
  rationale: தனிப்பட்ட துயரத்தைவிட வெளிப்படையான துக்க அனுசரிப்பு அல்லது புலம்பலின் நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: לְיוֹם טוֹב
  choice: நல்ல நாளாக
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான உருவகத்தைத் தக்கவைக்கிறது; சூழலில் அதன் விழாக்காலப் பொருள் தெளிவாகிறது.
- source_word: לַעֲשׂוֹת אוֹתָם
  choice: அந்நாட்களை ... நாட்களாகக் கொண்டாடி
  rationale: சொல்லுக்குச் சொல் ‘அவற்றை ஆக்குதல்’ என்றாலும், நினைவுநாட்களாக அனுசரிப்பதே சூழலின் பொருள்; ‘கொண்டாடி’ என்பது அதனை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְמֵי מִשְׁתֶּה
  choice: விருந்துண்டு மகிழும் நாட்கள்
  rationale: מִשְׁתֶּה விருந்து அல்லது விருந்துண்ணுதலைக் குறிக்கிறது; மதுபானத்தைத் தேவையின்றி முன்னிறுத்தாமல் விழாக்கால விருந்தைத் தெரிவிக்கிறது.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: பங்குகளை அனுப்பி
  rationale: மָנוֹת என்பது பங்குகள் அல்லது ஒதுக்கப்பட்ட பகுதிகள். அவை உணவுப் பங்குகளாக இருக்க வாய்ப்பிருந்தாலும், அந்த விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல் வைத்திருக்கிறது.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: ஒருவருக்கொருவர்
  rationale: சொல்லளவில் ‘ஒருவன் தன் தோழனுக்கு’ என்ற ஆண்பால் ஒருமை அமைப்பு இருந்தாலும், இது பரஸ்பரப் பகிர்வைக் குறிக்கும் பகிர்ந்தளிப்பு மரபுத்தொடர்; ‘ஒருவருக்கொருவர்’ நவீன தமிழில் அதன் செயல்பாட்டைத் துல்லியமாகத் தருகிறது.
- source_word: מַתָּנוֹת לָאֶבְיוֹנִים
  choice: ஏழைகளுக்குப் பரிசுகள்
  rationale: אֶבְיוֹנִים பொருளாதாரத் தேவையில் உள்ள ஏழைகளைச் சுட்டுகிறது; சமூக அக்கறையைத் தெளிவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: אִישׁ לְרֵעֵהוּ என்ற ஆண்பால் வடிவமுள்ள பகிர்ந்தளிப்பு மரபுத்தொடர்
  choice: ஒருவருக்கொருவர்
  alternative: ஒவ்வொருவனும் தன் தோழனுக்கு
  rationale: இங்கு இலக்கண ஆண்பால் குறிப்பிட்ட ஆண்களை மட்டும் வரையறுப்பதற்காக அல்ல, பரஸ்பரமாக வழங்குதலைக் கூறும் மரபுத்தொடராகச் செயல்படுகிறது. பாலினத்தைத் தேவையின்றி விரிவுபடுத்தவோ குறுக்கவோ செய்யாமல் அதன் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய சூழலின் தொடர்ச்சியான காரண–நோக்க அமைப்பாக இருப்பதால், தமிழில் முழுமையான வாக்கியமாகப் புரிய “இருந்ததால்” மற்றும் “வேண்டும்” பயன்படுத்தப்பட்டுள்ளன; கொண்டாட்டம், பரஸ்பரப் பகிர்வு, ஏழைகளுக்கான கொடை ஆகிய மூன்று அம்சங்களும் தெளிவாக வைக்கப்பட்டுள்ளன.
