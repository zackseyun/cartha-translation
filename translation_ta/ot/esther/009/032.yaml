source:
  edition: WLC
  text: וּ/מַאֲמַ֣ר אֶסְתֵּ֔ר קִיַּ֕ם דִּבְרֵ֥י הַ/פֻּרִ֖ים הָ/אֵ֑לֶּה וְ/נִכְתָּ֖ב בַּ/סֵּֽפֶר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/032.yaml
  text: And Esther’s command confirmed these matters of Purim[b][a], and it was written in the book.
translation:
  language: ta
  text: எஸ்தரின் ஆணை இந்தப் பூரீம் குறித்த காரியங்களை[a] உறுதிப்படுத்தியது; அது நூலில் எழுதப்பட்டது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்தப் பூரீம் அனுசரிப்புகள் குறித்த வார்த்தைகளை.’ எபிரெய மொழியில் ‘வார்த்தைகள்’ என்பது நிர்வாகச் சூழல்களில் ‘காரியங்கள்’ அல்லது ‘விவகாரங்கள்’ என்றும் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அது நூலில் பதிவுசெய்யப்பட்டது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲמַר
  choice: ஆணை
  rationale: இது வெறும் சொல்லைக் குறிக்காமல், பூரீம் அனுசரிப்பை அதிகாரபூர்வமாக நிலைநிறுத்திய எஸ்தரின் உத்தரவைக் குறிக்கிறது.
- source_word: אֶסְתֵּר
  choice: எஸ்தர்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: קִיַּם
  choice: உறுதிப்படுத்தியது
  rationale: ‘நிலைநிறுத்துதல், உறுதிசெய்தல்’ என்ற சட்ட அல்லது நிர்வாகச் சூழலுக்குரிய பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דִּבְרֵי
  choice: காரியங்களை
  rationale: எபிரெயச் சொல் ‘வார்த்தைகள்’ என்பதோடு ‘காரியங்கள், விவகாரங்கள்’ என்றும் பொருள்படும்; இங்கு பூரீம் தொடர்பான ஏற்பாடுகளைக் குறிக்கிறது. நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: הַפֻּרִים
  choice: பூரீம்
  rationale: விழாவின் தனிப்பெயர் தமிழ் மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָאֵלֶּה
  choice: இந்த
  rationale: முன்னர் குறிப்பிடப்பட்ட பூரீம் தொடர்பான காரியங்களைச் சுட்டும் எபிரெயச் சுட்டுப்பெயரின் வலிமையைப் பேணுகிறது.
- source_word: וְנִכְתָּב
  choice: அது நூலில் எழுதப்பட்டது
  rationale: எபிரெய மொழியின் செயப்பாட்டு வடிவத்தை நேரடியாகப் பேணுகிறது; ‘பதிவுசெய்யப்பட்டது’ என்பதும் சாத்தியமான பொருள்.
- source_word: בַּסֵּפֶר
  choice: நூலில்
  rationale: סֵפֶר என்பது நூல், சுருள் அல்லது எழுத்துப் பதிவு ஆகியவற்றைக் குறிக்கலாம். குறிப்பிட்ட நூலின் அடையாளத்தை வசனம் தெரிவிக்காததால் ‘நூலில்’ என்று பொதுவாக வைக்கப்பட்டுள்ளது.
