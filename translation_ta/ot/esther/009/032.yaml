  source_fidelity: 'மூல எபிரெயத்தின் சொற்தொடரும் பொருளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: எஸ்தரின் அதிகாரப்பூர்வ ஆணை பூரீமைச் சார்ந்த காரியங்களை உறுதிப்படுத்தியது; பின்னர் அது நூலில் எழுதப்பட்டது. செயப்பாட்டு வடிவமும், குறிப்பிட்ட நூலின் அடையாளத்தைத் தெரிவிக்காத மூலத்தின் தெளிவின்மையும் பேணப்பட்டுள்ளன.'
  naturalness: “எஸ்தரின் ஆணை இந்தப் பூரீம் குறித்த காரியங்களை உறுதிப்படுத்தியது; அது நூலில் எழுதப்பட்டது” என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் அதிகாரப்பூர்வமான பதிவுக்கு ஏற்றதாகவும் உள்ளது. “அது” என்பது எஸ்தரின் ஆணையைச் சுட்டுவது சூழலில் தெளிவாக உள்ளது.
  terminology: “எஸ்தர்,” “ஆணை,” “பூரீம்,” “காரியங்கள்,” “நூல்” ஆகியவை பொருத்தமானவை. “பூரீம்” விழாப் பெயராகத் தக்கவைக்கப்பட்டுள்ளது; דִּבְרֵי என்பதற்கான “காரியங்கள்” நிர்வாகச் சூழலுக்கு ஏற்றது. மாற்று வாசகங்களை அடிக்குறிப்புகள் சமநிலையாகக் கொடுக்கின்றன.
