  register: நவீனத் தரத் தமிழில், அதிகாரபூர்வமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் சட்ட/நிர்வாகத் தொனியும் செயப்பாட்டு அமைப்பும் பேணப்பட்டுள்ளன; நூலின் அடையாளம் தேவையின்றி குறிப்பாக்கப்படவில்லை.
