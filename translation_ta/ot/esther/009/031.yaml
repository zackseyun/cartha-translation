base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
translation:
  language: ta
  text: இந்தப் பூரீம் நாட்களை அவற்றுக்குரிய காலங்களில் நிலைநாட்டும்படி[a], யூதனான மொர்தெகாயும் அரசி எஸ்தரும் அவர்களுக்காக ஏற்படுத்தியபடியும், அவர்கள் தங்கள்மேலும் தங்கள் சந்ததியினர்மேலும் நோன்புகள் மற்றும் அவர்களுடைய கூக்குரல் தொடர்பான காரியங்களை ஏற்றுக்கொண்டபடியும்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘நிலைநாட்டுதல்’ என்பதற்குப் பதிலாக ‘உறுதிப்படுத்துதல்’ என்றும் மொழிபெயர்க்கலாம். இவ்வசனத்தில் மீண்டும் வரும் קים என்ற எபிரெய வினை, இந்த அனுசரிப்பை முறையாக நிர்ணயித்து உறுதிசெய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: நிலைநாட்டுவதற்காக
  rationale: பியெல் வடிவிலுள்ள קים இங்கு பூரீம் நாட்களின் அனுசரிப்பை முறையாக நிறுவி உறுதிப்படுத்துவதைக் குறிக்கிறது. ‘நிலைநாட்டுதல்’ சட்டபூர்வமான அல்லது சமூக ரீதியான உறுதிப்பாட்டையும் வெளிப்படுத்துகிறது.
- source_word: יְמֵי הַפֻּרִים הָאֵלֶּה
  choice: இந்தப் பூரீம் நாட்களை
  rationale: குறிப்பிட்ட அந்த விழா நாட்களைச் சுட்டும் எபிரெயச் சொற்றொடரின் அமைப்பையும் சுட்டுப்பெயரின் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בִּזְמַנֵּיהֶם
  choice: அவற்றுக்குரிய குறிக்கப்பட்ட காலங்களில்
  rationale: זמן என்பது நிர்ணயிக்கப்பட்ட அல்லது குறிக்கப்பட்ட காலத்தைக் குறிக்கிறது; பன்மை வடிவமும் நாட்கள் ஒவ்வொன்றிற்குரிய காலங்களும் இவ்வாறு தெளிவாகின்றன.
- source_word: כַּאֲשֶׁר קִיַּם עֲלֵיהֶם
  choice: அவர்களுக்காக ஏற்படுத்தியபடியும்
  rationale: על உடன் வரும் קים சமூகத்தின் மீது பிணைப்புடைய ஏற்பாட்டை நிறுவியதைக் காட்டுகிறது. ‘ஏற்படுத்தினார்’ என்பது கட்டாயப்படுத்துதல் என்ற தேவையற்ற கடுமையைச் சேர்க்காமல் அதன் அதிகாரபூர்வத் தன்மையை வெளிப்படுத்துகிறது.
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: யூதனான மொர்தெகாய்
  rationale: இது எஸ்தர் நூலில் வரும் இன அடையாளத்தைத் தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: அரசி எஸ்தர்
  rationale: எபிரெயப் பின்னிணைப்பின் பொருளை இயல்பான நவீனத் தமிழ்ச் சொல்லமைப்பில் தருகிறது.
- source_word: וְכַאֲשֶׁר קִיְּמוּ עַל נַפְשָׁם וְעַל זַרְעָם
  choice: அவர்கள் தங்களுக்காகவும் தங்கள் சந்ததியினருக்காகவும் ... ஏற்றுக்கொண்டபடியும்
  rationale: தங்கள்மீதும் பின்வரும் தலைமுறைகள்மீதும் ஒரு கடமையை ஏற்றுக்கொள்வதே இங்கு கருத்து. தமிழில் ‘ஏற்றுக்கொண்டனர்’ இந்தத் தற்சார்பு மற்றும் பிணைப்புடைய பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זַרְעָם
  choice: தங்கள் சந்ததியினர்
  rationale: זֶרַע இங்கு வருங்கால வழித்தோன்றல்களைக் குறிக்கிறது; ‘சந்ததியினர்’ தெளிவான, கண்ணியமான நவீனத் தமிழ்.
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  choice: நோன்புகள் மற்றும் தங்கள் கூக்குரல் தொடர்பான காரியங்கள்
  rationale: דברים நிர்வாகச் சூழலில் ‘காரியங்கள்’ அல்லது ‘விவகாரங்கள்’ எனப் பொருள்படலாம். זעקה தீவிரமான அழுகுரல் அல்லது உதவிக்கான கூக்குரலைக் குறிக்கும்; அதை ஜெபம் என்று மட்டும் குறுக்காமல் ‘கூக்குரல்’ எனத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: நோன்புடன் இணைந்த זַעֲקָה என்பதன் தன்மை
  choice: கூக்குரல்
  alternative: மன்றாட்டு / புலம்பல்
  rationale: மூலச்சொல் ஜெபம், புலம்பல், உதவிக்கான அழுகுரல் ஆகியவற்றுள் ஒன்றை மட்டும் நிர்ணயிக்கவில்லை. ‘கூக்குரல்’ அதன் தீவிரத்தையும் பொருள் அகலத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வரலாற்று-நிர்வாக நடையைப் பயன்படுத்துகிறது. மூல வசனம் முந்தைய வாக்கியத்தைத் தொடரும் நோக்கப்பொருள் அமைப்பாக இருப்பதால், அதன் தொடர்ச்சித் தன்மையை இறுதி நீள்கோடுகள் காக்கின்றன. ஒரே எபிரெய வினையின் சூழல்சார் நுணுக்கங்கள் ‘நிலைநாட்டுதல்’, ‘ஏற்படுத்துதல்’, ‘ஏற்றுக்கொள்ளுதல்’ என இயல்பான தமிழில் வேறுபடுத்தப்பட்டுள்ளன.
