  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டது. மூலத்தின் சுருக்கமான ‘கடிதத்தோடு சொன்னான்’ என்ற அமைப்பும் மரணதண்டனையின் சரியான முறையிலுள்ள தெளிவின்மையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
