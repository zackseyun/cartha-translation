base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
translation:
  language: ta
  text: ஆனால் அவள் அரசனின் முன்னிலையில் வந்தபோது, யூதர்களுக்கு எதிராக அவன் தீட்டிய தீய திட்டம் அவன் தலையின்மேலேயே திரும்பும்படி அரசன் கடிதத்தின் மூலம் கட்டளையிட்டான்[a]. மேலும், ஆமானையும் அவனுடைய மகன்களையும் மரக்கம்பத்தில் தொங்கவிட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் இதைச் சொல்லர்த்தமாக, “அவன் கடிதத்தோடு சொன்னான்” அல்லது “ஆவணத்துடன் கூறினான்” எனப் புரிந்துகொள்ளலாம்; சூழலில் அரசன் எழுத்துப்பூர்வமாக ஆணையிட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “தொங்கவிட்டார்கள்” என்பதை “கழுவேற்றினார்கள்” என்றும் புரிந்துகொள்ளலாம். “மரக்கம்பம்” என்பதற்கான எபிரேயச் சொல் சொல்லர்த்தமாக “மரம்” அல்லது “மரத்தாலான அமைப்பு” என்று பொருள்படும்; அது நவீனத் தூக்குமேடையைக் குறிக்க வேண்டியதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: அவள் ... வந்தபோது
  rationale: பெண்பால் ஒருமை பின்னொட்டு சூழலில் எஸ்தரைச் சுட்டுகிறது; பெயரைத் தேவையின்றி மீண்டும் கூறாமல் அந்தச் சுட்டைத் தக்கவைக்கிறது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசனின் முன்னிலையில்
  rationale: அரசனிடம் நேரில் வருவதைக் குறிக்கும் எபிரேய மரபுத்தொடருக்கு இயல்பான, கண்ணியமான தமிழ்.
- source_word: אָמַר עִם הַסֵּפֶר
  choice: அரசன் கடிதத்தின் மூலம் கட்டளையிட்டான்
  rationale: எபிரேய சொற்றொடர் சுருக்கமானதும் ஓரளவு தெளிவற்றதுமாக உள்ளது; சூழலில் அரசனுடைய எழுத்துப்பூர்வ ஆணையைக் குறிக்கிறது. ‘கடிதத்தின் மூலம்’ என்பது סֵפֶר என்பதையும் வெளிப்படுத்துகிறது.
- source_word: יָשׁוּב
  choice: திரும்பும்படி
  rationale: ஆமானின் திட்டம் அவன்மீதே எதிர்மாறாகத் திரும்பும் நீதியான விளைவைக் குறிக்கிறது; அரசனுடைய ஆணையைச் சார்ந்த வாக்கிய அமைப்புக்கும் பொருந்துகிறது.
- source_word: מַחֲשַׁבְתּוֹ הָרָעָה אֲשֶׁר חָשַׁב
  choice: அவன் தீட்டிய தீய திட்டம்
  rationale: ஒரே சொல்வேரைத் திரும்பப் பயன்படுத்தும் எபிரேய நடை தமிழில் இயல்பாக அமைய ‘திட்டம்’ மற்றும் ‘தீட்டிய’ என்பவை தேர்ந்தெடுக்கப்பட்டன; தீய நோக்கமும் தெளிவாகிறது.
- source_word: עַל רֹאשׁוֹ
  choice: அவனுடைய தலையின்மேலேயே
  rationale: தான் பிறருக்கு வகுத்த தீங்கு தன்மீதே திரும்புவதைச் சுட்டும் பழமொழித் தன்மையையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו עַל הָעֵץ
  choice: ஆமானையும் அவனுடைய மகன்களையும் மரக்கம்பத்தில் தொங்கவிட்டார்கள்
  rationale: תלה என்பது தொங்கவிடுதல் அல்லது கழுவேற்றுதல் ஆகிய கருத்துகளைத் தரக்கூடும்; עֵץ என்பது சொல்லர்த்தத்தில் மரம் அல்லது மரத்தாலான அமைப்பு. நவீன தூக்குமேடை என்ற தவறான படிமத்தைத் தவிர்க்க ‘மரக்கம்பம்’ பயன்படுத்தப்பட்டு, மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
