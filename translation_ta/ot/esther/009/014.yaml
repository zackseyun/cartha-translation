translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் செயப்பாட்டு அமைப்பும், அரசாணையின் நிர்வாகத் தன்மையும், மரணதண்டனை அல்லது உடல் காட்சிப்படுத்தப்பட்ட முறையைப் பற்றிய சொற்பொருள் தெளிவின்மையும் காக்கப்பட்டுள்ளன.
