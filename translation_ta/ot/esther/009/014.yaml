  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
translation:
  language: ta
  text: அப்படியே செய்யப்பட வேண்டும் என்று அரசன் சொன்னான். சூசானில் ஓர் அரசாணை பிறப்பிக்கப்பட்டது; ஆமானின் பத்து மகன்களும் தூக்கிலிடப்பட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கழுவில் ஏற்றப்பட்டார்கள்.” எபிரெய வினைச்சொல், உடல்களை ஒரு கழுமரம் அல்லது கம்பத்தில் தொங்கவிடுவதையும் குறிக்கலாம்; நவீன அர்த்தத்தில் கழுத்தில் கயிறிட்டுத் தூக்கிலிடுவதையே அது கட்டாயமாகக் குறிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: சொன்னான்
  rationale: אמר என்பதன் இயல்பான பொருள் ‘சொல்’. சூழலில் இது அரசனின் அதிகாரப்பூர்வ ஒப்புதலைக் குறித்தாலும், ‘கட்டளையிட்டான்’ என்று மொழிபெயர்ப்பது மூலச்சொல்லைவிட வலுவாக இருக்கும்.
- source_word: לְהֵעָשׂוֹת כֵּן
  choice: அப்படியே செய்யப்பட வேண்டும் என்று
  rationale: עשה என்பதன் செயப்பாட்டு கருத்தையும் כֵּן என்பதன் ‘அப்படியே’ என்ற சுட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַתִּנָּתֵן דָּת
  choice: ஓர் அரசாணை பிறப்பிக்கப்பட்டது
  rationale: נתן + דת என்பது பாரசீகக் கால நிர்வாக வழக்கு; சொல்லுக்குச் சொல் ‘சட்டம் கொடுக்கப்பட்டது’ என்பதைக் காட்டிலும் ‘அரசாணை பிறப்பிக்கப்பட்டது’ தெளிவான நவீனத் தமிழ்.
- source_word: בְּשׁוּשָׁן
  choice: சூசானில்
  rationale: שׁוּשָׁן என்ற இடப்பெயருக்கான தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பைத் தொடர்கிறது.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: ஆமானின் பத்து மகன்களும்
  rationale: எபிரெயக் கூட்டுச் சொல்லை இயல்பான தமிழில் நேரடியாக வழங்குகிறது; ‘-உம்’ தொடரின் இறுதி நிகழ்வை இணைக்கிறது.
- source_word: תָּלוּ
  choice: தூக்கிலிடப்பட்டார்கள்
  rationale: תלה என்பதற்கான பரவலாகப் புரியும் தமிழ் வடிவம். இது நவீன கழுத்துத் தூக்கை மட்டுமே கட்டாயமாகக் குறிக்காது என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
