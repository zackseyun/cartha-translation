  register: நவீன நிலையான தமிழில், அரசவைக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் கை உருவகம், எடையளவு, பன்மை ‘கருவூலங்கள்’ ஆகியவை தக்கவைக்கப்பட்டுள்ளன.
