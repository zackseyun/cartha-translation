base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
translation:
  language: ta
  text: அரசருக்கு நல்லதென்று தோன்றினால்[a], அவர்கள் அழிக்கப்படும்படி எழுதப்படட்டும். பத்தாயிரம் தாலந்து வெள்ளியை[b], பணியைச் செய்கிறவர்களின் கைகளில்[c] எடைபோட்டுக் கொடுப்பேன்; அதை அரசரின் கருவூலங்களுக்குக் கொண்டு வருவதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அரசருக்கு விருப்பமானால்.’
    reason: lexical_alternative
  - marker: b
    text: ‘பத்தாயிரம் தாலந்து வெள்ளி’ என்பது நாணய மதிப்பாக அல்லாமல் எடையால் அளக்கப்பட்ட மிகப் பெரும் தொகை.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘பணியைச் செய்கிறவர்கள் மூலமாக’; அதாவது, அப்பணியை நிறைவேற்றுகிறவர்களின் வழியாக.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: அரசருக்கு நல்லதென்று தோன்றினால்
  rationale: அரசரின் ஒப்புதல் அல்லது விருப்பத்தைச் சுட்டும் எபிரெய மரபுத்தொடரின் ‘நல்லது’ என்ற உருவகத்தைத் தக்கவைத்தபடி, இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יִכָּתֵב
  choice: எழுதப்படட்டும்
  rationale: כתב என்பதன் நிபால் வடிவிலுள்ள ‘எழுதப்படுதல்’ என்ற பொருளை நேரடியாகத் தக்கவைக்கிறது; அரசவைக் சூழல் இது அதிகாரப்பூர்வ ஆணை என்பதை உணர்த்தினாலும், மூலத்தில் இல்லாத பெயர்ச்சொல்லைச் சேர்க்கவில்லை.
- source_word: לְאַבְּדָם
  choice: அவர்கள் அழிக்கப்படும்படி
  rationale: அவர்களை முற்றாக ஒழிக்கும் நோக்கத்தைத் தெளிவாகத் தெரிவிக்கிறது; தேவையற்ற உணர்ச்சிவசப்பட்ட சொற்களைச் சேர்க்கவில்லை.
- source_word: כִּכַּר כֶּסֶף
  choice: தாலந்து வெள்ளி
  rationale: כִּכָּר என்பது எடையளவு. ஊகத்திற்குரிய நவீன எடை மாற்றத்தை முதன்மை உரையில் தராமல், வழக்கமான அளவுப்பெயரான ‘தாலந்து’ என்பதைப் பயன்படுத்துகிறது.
- source_word: אֶשְׁקוֹל
  choice: நிறுத்துக் கொடுப்பேன்
  rationale: שקל வினையின் அடிப்படைப் பொருளான எடைபோடுதலைத் தக்கவைத்து, எடையால் அளக்கப்பட்ட வெள்ளியை ஒப்படைக்கும் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל יְדֵי
  choice: கைகளில்
  rationale: மூலத்தின் கை உருவகத்தைப் பாதுகாக்கிறது; இதற்கு ‘மூலமாக’ என்ற முகமைப் பொருளும் இருக்கலாம் என்பதைக் குறிப்பில் தருகிறது.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: பணியைச் செய்கிறவர்கள்
  rationale: அந்த நபர்கள் யார் என்பதை எபிரெய உரை துல்லியமாகக் குறிப்பிடாததால், ‘அதிகாரிகள்’ என்று மிகையாகக் குறிப்பாக்காமல் அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: גִּנְזֵי הַמֶּלֶךְ
  choice: அரசரின் கருவூலங்கள்
  rationale: மூலத்திலுள்ள பன்மை வடிவைப் பாதுகாக்கிறது.
