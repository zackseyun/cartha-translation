  source_fidelity: The draft accurately represents the Persian administrative term as a copy, the document as a written decree, its promulgation as binding law, public disclosure to all the peoples, and their required readiness for the specified day. The Hebrew's distributive repetition of ‘province’ is appropriately represented in the main text by ‘ஒவ்வொரு’ and documented in a note.
