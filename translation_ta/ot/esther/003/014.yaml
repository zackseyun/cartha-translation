  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָֽ/עַמִּ֑ים לִ/הְי֥וֹת עֲתִדִ֖ים לַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
translation:
  language: ta
  text: எழுதப்பட்ட ஆணையின் நகல் ஒவ்வொரு மாகாணத்திலும்[a] சட்டமாகப் பிறப்பிக்கப்பட்டு, எல்லா மக்களுக்கும் வெளிப்படையாக அறிவிக்கப்பட வேண்டும்; அவர்கள் இந்நாளுக்காக[b] ஆயத்தமாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘மாகாணம்’ என்ற சொல் பகிர்வுநிலையாக மீண்டும் வருகிறது; விதிவிலக்கின்றி ஒவ்வொரு மாகாணத்தையும் அது வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அந்த நாளுக்காக’; ஆணையில் குறிப்பிடப்பட்டிருந்த குறிப்பிட்ட நாளை இது சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן
  choice: நகல்
  rationale: அரசாங்க ஆவணத்தின் அதிகாரப்பூர்வ நகல் அல்லது படி என்பதைக் குறிக்கும் பாரசீகக் கடன்சொல்; நிர்வாகச் சூழலில் ‘நகல்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַכְּתָב
  choice: எழுதப்பட்ட ஆணை
  rationale: சொல்லளவில் ‘எழுத்து/ஆவணம்’; இச்சூழலில் அது எழுத்தில் பிறப்பிக்கப்பட்ட அரச ஆணையாதலால், அதன் வடிவத்தையும் செயல்பாட்டையும் இச்சொற்றொடர் தெளிவாக்குகிறது.
- source_word: לְהִנָּתֵן דָּת
  choice: சட்டமாகப் பிறப்பிக்கப்பட்டு
  rationale: נתן என்பதன் செயப்பாட்டு வடிவம் இங்கு அதிகாரப்பூர்வ வெளியீட்டைச் சுட்டுகிறது; דָּת அந்த ஆவணத்தின் கட்டுப்படுத்தும் சட்ட வலிமையைக் குறிக்கிறது.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: ஒவ்வொரு மாகாணத்திலும்
  rationale: எபிரெயத்தில் ‘மாகாணம்’ இருமுறை வருவது பகிர்வுநிலை வலியுறுத்தல். தமிழில் ‘ஒவ்வொரு’ அந்த முழுமையான பகிர்வுப் பொருளை இயல்பாகத் தருகிறது.
- source_word: גָּלוּי
  choice: வெளிப்படையாக அறிவிக்கப்பட வேண்டும்
  rationale: ஆணை பொதுமக்களுக்குத் திறந்தவெளியில் தெரியப்படுத்தப்படுவதைச் செயப்பாட்டு அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: לְכָל הָעַמִּים
  choice: எல்லா மக்களுக்கும்
  rationale: பேரரசிலிருந்த பல்வேறு இன மக்களைக் குறிக்கும் பன்மையை ‘மக்கள்’ இயல்பாகத் தக்கவைக்கிறது; ‘நாடுகள்’ என்பது இங்கு அரசியல் அலகுகள் என்ற தவறான எண்ணத்தைத் தரக்கூடும்.
- source_word: לִהְיוֹת עֲתִדִים
  choice: ஆயத்தமாயிருக்க வேண்டும்
  rationale: நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவைச் சுட்டும் தொடர்; குறிப்பிட்ட நாளுக்குத் தயாராக இருக்க வேண்டுமென்ற பொருளை dignified modern Tamil-இல் தருகிறது.
- source_word: לַיּוֹם הַזֶּה
  choice: இந்நாளுக்காக
  rationale: எபிரெயத்தின் சுட்டுப்பெயரை நேரடியாகத் தக்கவைக்கிறது; சூழலில் ஆணையில் குறிப்பிடப்பட்ட நாளையே இது சுட்டுகிறது.
theological_decisions:
- issue: ‘அவர்கள்’ என்பதன் தொடர்பு
  choice: ‘எல்லா மக்களுக்கும்’ என்ற அருகிலுள்ள பன்மைப் பெயருடன் தொடர்புபடுத்தி, சுட்டுப்பெயரை வெளிப்படையாக வைத்தல்
  alternative: சுட்டுப்பெயரைத் தவிர்த்து, யார் ஆயத்தமாக வேண்டும் என்பதைத் தெளிவுபடுத்துதல்
  rationale: மூல உரை ஆயத்தமாக இருப்போரைக் கூடுதல் விளக்கமின்றி பன்மையில் குறிப்பிடுகிறது. தமிழில் ‘அவர்கள்’ என வைத்திருப்பது அந்த இலக்கணத் தொடர்பைத் தக்கவைத்து, விளக்கவுரையை வசனத்துக்குள் இறக்குமதி செய்வதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாக வாசிக்கக்கூடிய, ஆனால் அரச ஆவணத்தின் கண்ணியமான நிர்வாகத் தொனியைத் தக்கவைக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் பகிர்வுநிலை இரட்டிப்பு தமிழில் மரப்போல ஒலிக்காதவாறு ‘ஒவ்வொரு’ என முதன்மை உரையில் வழங்கப்பட்டு, சொல்லளவான அமைப்பு அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
