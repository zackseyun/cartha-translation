base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
translation:
  language: ta
  text: அரச வாசலில் இருந்த அரசனின் பணியாளர்கள் அனைவரும் ஆமானுக்கு முன் மண்டியிட்டு வணக்கம் செலுத்திவந்தார்கள்[a]. ஏனெனில், அவனைக் குறித்து அரசன் அவ்வாறு கட்டளையிட்டிருந்தான்[b]. ஆனால் மொர்தெகாய் மண்டியிடவோ வணக்கம் செலுத்தவோ மாட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆமானுக்கு முன் தரைவரை பணிந்து விழுந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு வரும் எபிரெய வினை, செயல் கடவுளை நோக்கியதாக இருக்கும் வேறு சூழல்களில் ‘வழிபடுதல்’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஏனெனில் அரசன் அவனுக்கு அவ்வாறு கட்டளையிட்டிருந்தான்’ என்றும் மொழிபெயர்க்கலாம். எனினும், இங்குள்ள சுட்டுப்பெயர் ஆமானைக் குறிப்பதாகவும், அவனுக்கு அளிக்க வேண்டிய மரியாதை பற்றியே கட்டளை இருந்ததாகவும் புரிந்துகொள்வது பொருத்தமானது.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: அரசவையின் சூழலில் עֶבֶד என்பது அரசனுக்குப் பணிபுரியும் நபர்களைக் குறிக்கிறது. ‘அடிமைகள்’ என்பது இங்கு தேவையற்ற வகையில் கட்டுண்ட அடிமைநிலையை வலியுறுத்தும்; ‘அதிகாரிகள்’ என்பது சொல்லின் பொருளை அளவுக்கு மீறிக் குறுக்கும்.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: அரச வாசலில்
  rationale: அரச அலுவல்கள் நடைபெற்ற பொது/நிர்வாக இடத்தைக் குறிக்கும் மூலமொழியின் உருவகமற்ற, இடவியல் குறிப்பைப் பாதுகாக்கிறது.
- source_word: כֹּרְעִים
  choice: மண்டியிட்டு
  rationale: כּרע குறிக்கும் கீழ்ப்படிதலின் உடல் அசைவைத் தெளிவாகக் காட்டுகிறது. எபிரெயப் பங்கேற்புவினையின் வழக்கமான அல்லது தொடர்ச்சியான செயலை ‘செலுத்திவந்தார்கள்’ என்ற தொடரால் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּמִשְׁתַּחֲוִים
  choice: வணக்கம் செலுத்தி
  rationale: השתחוה தெய்வத்திற்கான வழிபாட்டையோ மனிதருக்கான பணிவான மரியாதையையோ சூழலுக்கேற்ப குறிக்கலாம். மனிதனான ஆமான் இங்கு பெறுபவர் என்பதால், மதவழிபாடு என்று முன்கூட்டியே தீர்மானிக்காமல் அரசவை மரியாதையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  choice: ஏனெனில், அவனைக் குறித்து அரசன் அவ்வாறு கட்டளையிட்டிருந்தான்
  rationale: לוֹ என்ற சுட்டுப்பெயர் ஆமானைக் குறிக்கிறது என்றும், அவனுக்கு அளிக்கப்பட வேண்டிய மரியாதை தொடர்பாகக் கட்டளை பிறப்பிக்கப்பட்டது என்றும் இயல்பாகப் புரிந்துகொள்ளப்படுகிறது; அதேவேளை மாற்று இலக்கண வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  choice: மண்டியிடவோ வணக்கம் செலுத்தவோ மாட்டான்
  rationale: இரு எதிர்மறை imperfect வினைகளும் மொர்தெகாயின் தொடர்ச்சியான, மனவுறுதியான மறுப்பைக் காட்டுகின்றன. ‘மாட்டான்’ என்பது அந்த விருப்ப மறுப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הִשְׁתַּחֲוָה என்பதை வெளிப்படையான மதச்சொல்லான ‘வழிபடுதல்’ என்று மொழிபெயர்க்க வேண்டுமா?
  choice: ‘வணக்கம் செலுத்துதல்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘சாஷ்டாங்கமாக விழுதல்’ அல்லது ‘வழிபடுதல்’
  rationale: இந்த எபிரெய வினை கடவுளை வழிபடுவதையும் மனிதர்முன் பணிந்து மரியாதை செய்வதையும் குறிக்கலாம். இங்கு பெறுபவர் ஆமான் என்பதால், மூலவசனம் கட்டாயப்படுத்தாத மதவழிபாட்டு கருத்தை மொழிபெயர்ப்பில் புகுத்தாமல், அதன் பொருள் விரிவையும் இறையியல் பதற்றத்தையும் அடிக்குறிப்புடன் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் அரசவைக் காட்சிக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘அரச வாசல்’ என்ற சுருக்கமான தொடர் மூலத்தின் இடக்குறிப்பைப் பாதுகாக்கிறது. ‘மண்டியிடுதல்’ மற்றும் ‘வணக்கம் செலுத்துதல்’ என்ற இரு தனித்த செயல்களும் மூலத்தில் இருப்பதுபோல வசனத்தின் இரு பகுதிகளிலும் மீண்டும் வழங்கப்பட்டுள்ளன.
