base_translation:
  language: en
  yaml_path: translation/ot/esther/003/010.yaml
  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
translation:
  language: ta
  text: அப்போது அரசன் தன் கையிலிருந்த முத்திரை மோதிரத்தைக் கழற்றி, அம்மெதாத்தாவின் மகனும் ஆகாகியனுமான, யூதர்களின் பகைவனாகிய ஆமானிடம் கொடுத்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதேயர்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் יְהוּדִים யூத மக்களைப் பொதுவாகக் குறிக்கலாம்; சில சூழல்களில் யூதா அல்லது யூதேயாவைச் சேர்ந்தவர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: கழற்றி
  rationale: இந்த வினைச்சொல் அகற்றுதல் அல்லது எடுத்துவிடுதல் என்று பொருள்படும். மோதிரம் கையில் இருந்ததாகத் தொடர்வதால், தமிழில் இயல்பாகவும் துல்லியமாகவும் ‘கழற்றி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: טַבַּעְתּוֹ
  choice: தன் முத்திரை மோதிரத்தை
  rationale: அரசவைக் சூழலில் இது அலங்கார மோதிரம் மட்டுமல்ல, அரசாணைக்கு அதிகாரப்பூர்வ முத்திரையிடப் பயன்படும் மோதிரம். ‘முத்திரை மோதிரம்’ அதன் செயல்பாட்டைத் தெளிவாக்குகிறது.
- source_word: מֵעַל יָדוֹ
  choice: தன் கையிலிருந்த
  rationale: எபிரெயச் சொற்றொடரின் ‘அவனுடைய கையிலிருந்து’ என்ற காட்சியை இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: וַיִּתְּנָהּ
  choice: கொடுத்தான்
  rationale: பெண்பால் பின்னொட்டு முன்வரும் மோதிரத்தைக் குறிக்கிறது. தமிழில் பொருள் ஏற்கெனவே தெளிவாக இருப்பதால் தனிப் பிரதிப்பெயர் இல்லாமல் ‘கொடுத்தான்’ என்பது இயல்பாக உள்ளது.
- source_word: לְהָמָן
  choice: ஆமானிடம்
  rationale: ஆள் பெயர் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது; கொடுப்பதன் பெறுநரை ‘-இடம்’ வேற்றுமை இயல்பாகக் குறிக்கிறது.
- source_word: בֶּן הַמְּדָתָא
  choice: அம்மெதாத்தாவின் மகன்
  rationale: தந்தை–மகன் உறவு நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது; பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָאֲגָגִי
  choice: ஆகாகியன்
  rationale: இது ஆகாகுடன் தொடர்புடைய இன அல்லது மரபுவழி அடையாளப்பெயர். அதன் கதையியல் எதிரொலியை விளக்கமாக விரிவுபடுத்தாமல் எபிரெய வடிவம் பாதுகாக்கப்பட்டுள்ளது.
- source_word: צֹרֵר
  choice: பகைவன்
  rationale: எதிர்த்து நிற்பவன் அல்லது பகைமை காட்டுபவன் என்பதே இப்பங்கேற்புப் பெயர்ச்சொல்லின் பொருள். சூழலில் ‘பகைவன்’ இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: הַיְּהוּדִים
  choice: யூதர்கள்
  rationale: எஸ்தர் நூலில் இச்சொல் யூத மக்களையோ யூதேயர்களையோ குறிக்கக்கூடும். இங்கு குறிவைக்கப்படும் இன மக்களைக் குறிக்கும் சூழலால் ‘யூதர்கள்’ முதன்மை உரையில் ஏற்றது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַ
  choice: அப்போது
  rationale: முன்னைய நிகழ்வைத் தொடர்ந்து நிகழும் கதையோட்டத்தை நவீன தமிழில் இயல்பாக இணைக்கிறது; வெறும் ‘மேலும்’ என்பதைக் காட்டிலும் இங்கு நிகழ்வுத் தொடரைத் தெளிவாகக் காட்டுகிறது.
