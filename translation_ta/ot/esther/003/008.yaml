  choice: ஒரு குறிப்பிட்ட மக்கள் இனம் இருக்கிறது
  rationale: இந்த எபிரெயச் சொற்றொடர், பெயர் குறிப்பிடப்படாத ஒரு குறிப்பிட்ட இனத்தைச் சுட்டுகிறது. ஆமானின் மறைமுகமான குற்றச்சாட்டுத் தொனியையும் ஒருமை இனக் குறிப்பையும் இது இயல்பாகப் பாதுகாக்கிறது.
- source_word: מְפֻזָּר וּמְפֹרָד
  choice: சிதறியும் தனித்தும் வாழ்கிற
  rationale: இரண்டு பங்கெச்சங்களையும் பிரதிபலிக்கிறது. இரண்டாவது சொல் அவர்களுக்குள் ஏற்பட்ட பிளவைக் குறிப்பதாகத் தேவையின்றி விளக்காமல், பிற மக்களிடையே இருந்தும் தனித்திருக்கும் நிலையை வெளிப்படுத்துகிறது.
- source_word: בֵּין הָעַמִּים
  choice: மக்கள் இனங்களிடையே
  rationale: பேரரசுக்குள் இருந்த பல்வேறு இனக்குழுக்களை இங்கு குறிக்கிறது; நவீன அரசியல் நாடுகள் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: בְּכֹל מְדִינוֹת מַלְכוּתֶךָ
  choice: உமது அரசாட்சியின் எல்லா மாகாணங்களிலும்
  rationale: எஸ்தர் நூலின் பாரசீக நிர்வாகச் சூழலில் מְדִינוֹת என்பது நிர்வாக மாகாணங்களைக் குறிக்கிறது.
- source_word: דָתֵיהֶם
  choice: அவர்களுடைய சட்டங்கள்
  rationale: அரசரின் சட்டங்களுடன் நேரடியாக ஒப்பிடப்படுவதால், ‘பழக்கவழக்கங்கள்’ என்பதைக் காட்டிலும் சட்ட வலிமையை ‘சட்டங்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שֹׁנוֹת מִכָּל עָם
  choice: மற்ற எல்லா மக்கள் இனங்களுடைய சட்டங்களிலிருந்தும் வேறுபட்டவை
  rationale: ஒப்பீடு மக்களுக்கும் சட்டங்களுக்கும் இடையில் அல்ல, அவர்களுடைய சட்டங்களுக்கும் பிற இனங்களுடைய சட்டங்களுக்கும் இடையில் இருப்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וְאֶת דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים
  choice: அவர்கள் அரசரின் சட்டங்களைக் கடைப்பிடிப்பதில்லை
  rationale: சட்டங்களுடன் வரும் עָשָׂה என்பதன் ‘கைக்கொள்ளுதல்/கடைப்பிடித்தல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה
  choice: அரசருக்கு நன்மையானதல்ல
  rationale: இந்த மொழிவழக்கு அரசருக்குக் கிடைக்கும் பயன் அல்லது சாதகத்தைக் குறிக்கிறது; ஆமானின் நடைமுறை நலன் சார்ந்த முறையீட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לְהַנִּיחָם
  choice: அவர்களை அப்படியே விட்டுவைப்பது
  rationale: இந்த இடத்தில் வினைச்சொல் அவர்களைத் தொந்தரவு செய்யாமல் இருக்க விடுதல், தொடர்ந்து இருக்க அனுமதித்தல் ஆகிய பொருட்களுக்கு இடமளிக்கிறது. ‘அப்படியே விட்டுவைப்பது’ அந்தத் திறந்த பொருள் வரம்பைப் பாதுகாக்கிறது.
