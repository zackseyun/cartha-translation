translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைக் கூற்றுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘மக்கள் இனம்’ என்பது பேரரசுக்குள் வாழ்ந்த இனக்குழுவைக் குறிக்கப் பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் பெயர் சொல்லாமல் பழிசுமத்தும் ஆமானின் தொனி காக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு தொடர்புடைய சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
