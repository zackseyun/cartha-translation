base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
translation:
  language: ta
  text: அப்போது ஆமான் அகாஸ்வேரு அரசனிடம், “உமது அரசின் எல்லா மாகாணங்களிலும் பிற மக்களிடையே சிதறியும் பிரிந்தும் இருக்கும் ஒரு மக்கள் கூட்டம் உள்ளது. அவர்களுடைய சட்டங்கள் எல்லா பிற மக்களுடைய சட்டங்களிலிருந்தும் வேறுபட்டவை; அவர்கள் அரசரின் சட்டங்களைக் கடைப்பிடிப்பதில்லை. ஆகவே, அவர்களை அப்படியே விட்டுவிடுவது[a] அரசருக்கு நன்மையானதல்ல” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களைத் தொந்தரவு செய்யாமல் விடுவது”; “அவர்கள் தொடர்ந்து இருக்க அனுமதிப்பது.” எபிரெய வினைச்சொல், ஒருவரை அப்படியே இருக்க விடுதல் அல்லது இடையூறு செய்யாமல் இருக்க அனுமதித்தல் எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
