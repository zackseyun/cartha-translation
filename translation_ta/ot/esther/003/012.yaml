  rationale: எபிரெய வினையின் செயப்பாட்டு வடிவத்தையும் அரண்மனை நிர்வாகச் சூழலையும் தெளிவாகக் காக்கிறது; ‘எழுத்தர்கள்’ என்பது அதிகாரப்பூர்வ ஆவணங்களை எழுதுவோரைக் குறிக்கிறது.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: முதலாம் மாதத்தின் பதின்மூன்றாம் நாளில்
  rationale: மாதத்தை மீண்டும் சுட்டும் எபிரெயத் தொடரை இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் துல்லியமாகவும் வழங்குகிறது.
- source_word: כְּכָל אֲשֶׁר צִוָּה הָמָן
  choice: ஆமான் கட்டளையிட்ட அனைத்தின்படியும்
  rationale: כְּכָל என்பதிலுள்ள முழுமையான ஒத்திசைவைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘அரசாணை’ என்ற பெயர்ச்சொல்லைச் சேர்க்கவில்லை.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: அரசனுடைய பேரரசு மண்டல ஆளுநர்கள்
  rationale: பாரசீக நிர்வாகப் பதவியான satrap என்பதை தமிழில் புரியக்கூடிய வகையில் வழங்கி, அடுத்ததாக வரும் மாகாண ஆளுநர்களிலிருந்து பதவி வேறுபாட்டைக் காக்கிறது.
- source_word: הַפַּחוֹת אֲשֶׁר עַל מְדִינָה וּמְדִינָה
  choice: ஒவ்வொரு மாகாணத்துக்கும் பொறுப்பான ஆளுநர்கள்
  rationale: மீளுரைப்பால் வெளிப்படும் பகிர்வுப் பொருளை ‘ஒவ்வொரு’ என்று இயல்பாகக் காட்டுகிறது.
- source_word: שָׂרֵי עַם וָעָם
  choice: ஒவ்வொரு மக்களினத்தின் அதிகாரிகள்
  rationale: שָׂרִים என்பதன் நிர்வாகச் சூழலுக்கேற்ற பொதுவான பொருளைத் தேர்ந்தெடுக்கிறது; ‘இளவரசர்கள்’ என்ற தேவையற்ற அரசகுல நுணுக்கத்தைத் தவிர்க்கிறது.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: ஒவ்வொரு மாகாணத்துக்கும் அதனதன் எழுத்துமுறையில்
  rationale: כְּתָב என்பது இங்கு மொழியை அல்ல, பயன்படுத்தப்பட்ட எழுத்து அமைப்பைச் சுட்டுவதால் ‘எழுத்துமுறை’ துல்லியமான தேர்வு.
- source_word: וְעַם וָעָם כִּלְשׁוֹנוֹ
  choice: ஒவ்வொரு மக்களினத்துக்கும் அதனதன் மொழியில்
  rationale: பலமொழிப் பேரரசின் சூழலில் לָשׁוֹן என்பதன் பொருளை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: וְנֶחְתָּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: அரசனுடைய முத்திரை மோதிரத்தால் முத்திரையிடப்பட்டது
  rationale: טַבַּעַת என்பதைக் குறிப்பற்ற ‘முத்திரை’ என்று மட்டும் விடாமல், அதிகாரப்பூர்வ முத்திரை பதிக்கப்பட்ட மோதிரமாகத் தெளிவுபடுத்துகிறது.
