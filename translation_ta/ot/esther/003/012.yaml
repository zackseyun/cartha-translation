translation_notes:
  register: நவீனத் தரத் தமிழில், அரச நிர்வாகச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காகப் பல வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், பெறுநர்களின் வரிசையும் செயப்பாட்டு அமைப்பும் காக்கப்பட்டுள்ளன. ‘சத்ரப்’ என்ற அறிமுகமற்ற கடன்சொல்லுக்குப் பதிலாக பதவிநிலையை விளக்கும் ‘பேரரசு மண்டல ஆளுநர்’ பயன்படுத்தப்பட்டுள்ளது.
