base_translation:
  language: en
  yaml_path: translation/ot/esther/003/012.yaml
  text: Then the king’s scribes were summoned in the first month[a], on the thirteenth day of it, and it was written exactly as Haman commanded to the king’s satraps, to the governors who were over each province, and to the officials of each people, to every province in its own script and to every people in its own language[b]. It was written in the name of King Ahasuerus and sealed with the king’s signet ring.
translation:
  language: ta
  text: முதலாம் மாதத்தின் பதின்மூன்றாம் நாளில் அரசனுடைய எழுத்தர்கள் அழைக்கப்பட்டார்கள். ஆமான் கட்டளையிட்ட அனைத்தின்படியும், அரசனுடைய பேரரசு மண்டல ஆளுநர்களுக்கும், ஒவ்வொரு மாகாணத்துக்கும் பொறுப்பான ஆளுநர்களுக்கும், ஒவ்வொரு மக்களினத்தின் அதிகாரிகளுக்கும் எழுதப்பட்டது. ஒவ்வொரு மாகாணத்துக்கும் அதனதன் எழுத்துமுறையிலும்[a], ஒவ்வொரு மக்களினத்துக்கும் அதனதன் மொழியிலும் அது எழுதப்பட்டது. அகாஸ்வேரு அரசனின் பெயரில் அது எழுதப்பட்டு, அரசனுடைய முத்திரை மோதிரத்தால் முத்திரையிடப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எழுத்துமுறை’ என்பது ஒவ்வொரு மாகாணத்திலும் பயன்படுத்தப்பட்ட எழுத்து அமைப்பைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
