base_translation:
  language: en
  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
translation:
  language: ta
  text: அவர்கள் நாள்தோறும் அவனிடம் பேசிவந்தும், அவன் அவர்களுக்குச் செவிகொடுக்கவில்லை. மொர்தெகாயின் வார்த்தைகள் நிலைநிற்குமா[a] என்று பார்ப்பதற்காக அவர்கள் ஆமானிடம் தெரிவித்தார்கள்; ஏனெனில், தான் ஒரு யூதன் என்று மொர்தெகாய் அவர்களிடம் சொல்லியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மொர்தெகாய் சொன்ன காரணம் ஏற்றுக்கொள்ளப்படுமா.” எபிரேயத்தில் நேரடியாக, “மொர்தெகாயின் வார்த்தைகள் நிலைநிற்குமா” என்று உள்ளது. இது, தான் பணிந்து வணங்க மறுத்ததற்கு அவன் கூறிய காரணம் செல்லுபடியாகுமா என்பதையோ, அழுத்தம் வந்தாலும் அவன் தன் நிலைப்பாட்டில் உறுதியாக இருப்பானா என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו יוֹם וָיוֹם
  choice: அவர்கள் நாள்தோறும் அவனிடம் சொல்லியும்
  rationale: וַיְהִי + בְּ temporal setting introduces the repeated action. “நாள்தோறும்” naturally conveys יוֹם וָיוֹם, while “சொல்லியும்” links that persistent speaking to Mordecai’s refusal.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: அவன் அவர்களுக்குச் செவிகொடுக்காததால்
  rationale: שׁמע אֶל means to listen to or heed someone. “செவிகொடுக்காததால்” expresses deliberate noncompliance and fits the repeated setting.
- source_word: וַיַּגִּידוּ לְהָמָן
  choice: அவர்கள் ஆமானிடம் தெரிவித்தார்கள்
  rationale: The Hiphil of נגד means tell, report, or make known. “தெரிவித்தார்கள்” naturally communicates that they reported the matter to Haman.
- source_word: לִרְאוֹת הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  choice: மொர்தெகாயின் வார்த்தைகள் நிலைநிற்குமா என்று பார்ப்பதற்காக
  rationale: '“நிலைநிற்குமா” preserves the עמד metaphor and the source ambiguity: his words may be tested for validity, or his stated position may be tested for endurance.'
- source_word: כִּי הִגִּיד לָהֶם אֲשֶׁר הוּא יְהוּדִי
  choice: ஏனெனில், தான் ஒரு யூதன் என்று மொர்தெகாய் அவர்களிடம் சொல்லியிருந்தான்
  rationale: כִּי gives the reason for their report, and “சொல்லியிருந்தான்” marks the prior disclosure. Repeating “மொர்தெகாய்” avoids possible ambiguity in Tamil pronoun reference; “ஒரு யூதன்” directly renders the nominal identity term יְהוּדִי.
