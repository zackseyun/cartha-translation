translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. “வார்த்தைகள் நிலைநிற்குமா” என்ற சற்றே உருவகமான சொற்றொடர், எபிரெய மூலத்தின் உண்மையான இருபொருள் வாய்ப்பைப் பாதுகாக்க நோக்கத்துடன் வைக்கப்பட்டுள்ளது.
