base_translation:
  language: en
  yaml_path: translation/ot/esther/003/005.yaml
  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
translation:
  language: ta
  text: மொர்தெகாய் ஆமானுக்கு முன்பாகக் குனிந்து வணங்காமலும் தரையில் விழுந்து பணியாமலும் இருப்பதை[a] ஆமான் கண்டபோது, ஆமான் கடுஞ்சினத்தால் நிறைந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முழங்கால் மடக்காமலும் வணக்கம் செலுத்தாமலும்.’ எபிரெயத்தில் பணிவைக் காட்டும் தொடர்புடைய, ஆனால் வேறுபட்ட இரண்டு வினைச்சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: தொடர்கதை அமைப்பில் இந்த வினை காலத் தொடர்பையும் அடுத்த நிகழ்வுக்கான காரணச் சூழலையும் காட்டுகிறது; தமிழில் ‘கண்டபோது’ இயல்பாக இதைப் பிடிக்கிறது.
- source_word: כִּי אֵין מָרְדֳּכַי
  choice: மொர்தெகாய் ... வணங்காமலும் ... பணியாமலும் இருப்பதை
  rationale: אֵין உடன் வரும் பங்கேற்பு வடிவங்கள் தொடர்ச்சியாக நடைபெறாத செயல்களைக் குறிக்கின்றன; ‘இருப்பதை’ என்ற அமைப்பு அந்த நீடித்த மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֹּרֵעַ
  choice: குனிந்து வணங்காமலும்
  rationale: כרע முழங்காலை மடக்குதல் அல்லது உடலைக் குனிதல் என்ற பொருள் தருகிறது. ‘குனிந்து வணங்குதல்’ அரண்மனைச் சூழலிலுள்ள கீழ்ப்படிதல் சைகையைத் தெளிவாகவும் அடுத்த வினையிலிருந்து வேறுபட்டும் காட்டுகிறது.
- source_word: וּמִשְׁתַּחֲוֶה
  choice: தரையில் விழுந்து பணியாமலும்
  rationale: השתחוה தரையில் தாழ்ந்து அல்லது முழுவதுமாக விழுந்து பணிவை வெளிப்படுத்துவதைக் குறிக்கலாம். இந்த மொழிபெயர்ப்பு முதல் வினையைவிட வலுவான உடல் செயலைப் பாதுகாக்கிறது.
- source_word: לוֹ
  choice: தனக்கு முன்பாக
  rationale: எழுத்துப்படி ‘அவனுக்கு’ என்றாலும், வணக்கச் செயல்கள் ஆமானை நோக்கி அவன் முன்னிலையில் செய்யப்படுகின்றன என்பதைக் ‘தனக்கு முன்பாக’ இயல்பாகக் காட்டுகிறது.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: கடுஞ்சினத்தால் நிறைந்தான்
  rationale: ‘நிறைந்தான்’ என்பது எபிரெய மொழியின் உருவகச் சொற்றொடரைப் பாதுகாக்கிறது; ‘கடுஞ்சினம்’ חֵמָה குறிக்கும் தீவிரமான கோபத்தை நவீன, கண்ணியமான தமிழில் தருகிறது.
- source_word: חֵמָה
  choice: கடுஞ்சினம்
  rationale: இச்சூழலில் இது சாதாரண கோபத்தைவிடத் தீவிரமான சினத்தைக் குறிக்கிறது; ‘கடுஞ்சினம்’ அந்த வலிமையை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
