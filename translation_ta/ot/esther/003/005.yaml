- from: மொர்தெகாய் தனக்கு முன்பாகக் குனிந்து வணங்காமலும் தரையில் விழுந்து பணியாமலும் இருப்பதை ஆமான் கண்டபோது[a], ஆமான் கடுஞ்சினத்தால் நிறைந்தான்.
  to: மொர்தெகாய் ஆமானுக்கு முன்பாகக் குனிந்து வணங்காமலும் தரையில் விழுந்து பணியாமலும் இருப்பதை[a] ஆமான் கண்டபோது, ஆமான் கடுஞ்சினத்தால் நிறைந்தான்.
