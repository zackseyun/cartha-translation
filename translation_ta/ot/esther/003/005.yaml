translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘குனிந்து வணங்குதல்’ மற்றும் ‘தரையில் விழுந்து பணிதல்’ என்ற இணைச்சொற்கள் எபிரெய மூலத்திலுள்ள இரண்டு தனித்த உடல் சைகைகளின் வேறுபாட்டைப் பாதுகாக்கின்றன; ஆமானின் பெயர் மீண்டும் வருவது மூலத்தின் வலியுறுத்தலைத் தக்கவைக்கிறது.
