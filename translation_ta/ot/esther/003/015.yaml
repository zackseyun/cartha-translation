  source_fidelity: 'தமிழ் உரை எபிரெய மூலத்தின் கூறுகளைத் துல்லியமாகப் பிரதிபலிக்கிறது: அரசத் தூதர்கள் அரசனின் கட்டளையால் அவசரப்படுத்தப்பட்டு புறப்படுதல், சூசான் கோட்டையில் அரசாணை வெளியிடப்படுதல், அரசனும் ஆமானும் குடிக்க அமர்தல், நகரம் குழப்பமடைதல் ஆகியவை அனைத்தும் பாதுகாக்கப்பட்டுள்ளன. இறுதி வாவின் முரண்பாட்டுத் தொடர்பை ‘ஆனால்’ என மொழிபெயர்த்திருப்பது சூழலுக்கேற்ற, அளவான நடைமுறை மாற்றமாகும்.'
