  text: הָֽ/רָצִ֞ים יָצְא֤וּ דְחוּפִים֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וְ/הַ/מֶּ֤לֶךְ וְ/הָמָן֙ יָשְׁב֣וּ לִ/שְׁתּ֔וֹת וְ/הָ/עִ֥יר שׁוּשָׁ֖ן נָבֽוֹכָה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
translation:
  language: ta
  text: அரசனின் கட்டளையால் அவசரப்படுத்தப்பட்ட தூதர்கள் புறப்பட்டுச் சென்றார்கள். சூசான் கோட்டையில் அரசாணை வெளியிடப்பட்டது[a]. அரசனும் ஆமானும் குடிப்பதற்காக அமர்ந்தார்கள்; ஆனால் சூசான் நகரமோ குழப்பத்தில் ஆழ்ந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சூசான் கோட்டையில் சட்டம் கொடுக்கப்பட்டது.’ எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘கொடுக்கப்பட்டது’; பாரசீக நிர்வாகச் சூழலில் דָּת என்பதற்கு ‘சட்டம்’ அல்லது ‘அரசாணை’ என்று பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘திகைத்துப்போனது’ அல்லது ‘கலக்கமடைந்தது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: தூதர்கள்
  rationale: பாரசீக அரச நிர்வாகத்தில் அதிகாரப்பூர்வச் செய்திகளை எடுத்துச் செல்லும் ஆட்களைக் குறிக்கிறது. சொற்பொருளான ‘ஓட்டக்காரர்கள்’ என்பதைக் காட்டிலும் ‘தூதர்கள்’ அவர்களுடைய பணியை இயல்பாகத் தெரிவிக்கிறது.
- source_word: דְחוּפִים
  choice: அவசரப்படுத்தப்பட்ட
  rationale: தூதர்கள் தாமாகவே விரைந்தார்கள் என்பதற்குப் பதிலாக, அரச கட்டளையால் விரைந்து செல்லும்படி நெருக்கப்பட்டனர் என்ற எபிரெயச் செயல்பாட்டின் பொருளைத் தக்கவைக்கிறது.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: அரசனின் கட்டளையால்
  rationale: இங்கு דָּבָר வெறும் சொல்லையல்ல, அதிகாரமுள்ள அரச உத்தரவைக் குறிக்கிறது.
- source_word: הַדָּת נִתְּנָה
  choice: அரசாணை வெளியிடப்பட்டது
  rationale: דָּת என்பது பாரசீக நிர்வாகச் சூழலில் சட்டபூர்வமான ஆணையைக் குறிக்கிறது; נִתְּנָה என்பதன் சொற்பொருள் ‘கொடுக்கப்பட்டது’ என்றாலும், இங்கு ஆணை அதிகாரப்பூர்வமாகப் பிரசுரிக்கப்பட்டதைக் குறிக்கிறது.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: சூசான் கோட்டை
  rationale: בִּירָה என்பது அரண்மனை அமைந்திருந்த பாதுகாப்புமிக்க கோட்டை வளாகத்தைக் குறிக்கிறது. ‘சூசான் கோட்டை’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  choice: குடிப்பதற்காக அமர்ந்தார்கள்
  rationale: எபிரெய மொழிநடையை நேர்த்தியாகப் பிரதிபலித்து, அழிவுக்கான ஆணைக்குப் பின்னர் அரசனும் ஆமானும் குடிக்க அமர்ந்த கசப்பான முரண்பாட்டைப் பாதுகாக்கிறது.
- source_word: נָבוֹכָה
  choice: குழப்பத்தில் ஆழ்ந்தது
  rationale: நகரம் திகைப்பு, கலக்கம், நிலைகுலைவு ஆகியவை சேர்ந்த நிலையில் இருந்தது என்ற விளைவுநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְ
  choice: ஆனால் … நகரமோ
  rationale: எபிரெயில் இணைப்புச்சொல் பொதுவாக ‘மேலும்/அப்போது’ என்றாலும், அரசனும் ஆமானும் குடிப்பதற்காக அமர்வதற்கும் நகரம் குழப்பமடைவதற்கும் இடையிலுள்ள கதைநடை முரண்பாட்டைத் தமிழில் வெளிப்படுத்துகிறது.
