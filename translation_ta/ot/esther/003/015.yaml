translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரச நிர்வாகச் சூழலைத் தெளிவாக்கும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; அதேவேளை נָבוֹכָה என்பதிலுள்ள திகைப்பு மற்றும் கலக்கம் சார்ந்த பொருள் அகலம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
