base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு[a], அரசன் அகாஸ்வேரு ஆகாகியனான அம்மெதாத்தாவின் மகன் ஆமானைப் பதவியில் உயர்த்தி, அவரை மேன்மைப்படுத்தி, தன்னோடிருந்த எல்லா அதிகாரிகளுக்கும் மேலாக அவரது அரியணையை[c] அமைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இந்த நிகழ்வுகளுக்குப் பிறகு.’
    reason: lexical_alternative
  - marker: c
    text: ‘அரியணை’ என்பதற்கு ‘அதிகார இருக்கை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: இவற்றுக்குப் பிறகு
  rationale: அடுத்த கதைநிகழ்வை அறிமுகப்படுத்தும் எபிரெய காலச் சொற்றொடரை இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: גִּדַּל
  choice: பதவியில் உயர்த்தி
  rationale: அரசவையில் ஒருவரின் நிலை அல்லது பதவியை உயர்த்துதல் என்பதே சூழல்சார் பொருள்; வெறுமனே ‘பெரியவராக்கி’ என்பதைவிட இது தெளிவானது.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு அரசன்
  rationale: பெயரை ஒலிபெயர்த்து, எபிரெயச் சொல் வரிசையையும் இயல்பான தமிழ்நடையையும் இணைக்கிறது.
- source_word: הָמָן
  choice: ஆமான்
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: בֶּן הַמְּדָתָא
  choice: அம்மெதாத்தாவின் மகனான
  rationale: தந்தைவழி அடையாளத்தை மூலத்தில் உள்ளபடியே வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: הָאֲגָגִי
  choice: ஆகாகியன்
  rationale: ஆகாகுடன் தொடர்புடைய மரபு, குலம் அல்லது மக்களடையாளத்தைக் குறிக்கக்கூடிய எபிரெயப் பெயரடையை மேலதிக வரலாற்றுத் தீர்மானமின்றிப் பாதுகாக்கிறது.
- source_word: וַיְנַשְּׂאֵהוּ
  choice: அவரை மேன்மைப்படுத்தி
  rationale: முந்தைய பதவி உயர்வைத் தொடர்ந்து வரும் கௌரவ மற்றும் மேல்நிலை நுணுக்கத்தைத் தனியாகப் பாதுகாக்கிறது.
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ
  choice: அவரது அரியணையை அமைத்தார்
  rationale: כִּסֵּא என்பது இருக்கையையும் ஆட்சியதிகார அரியணையையும் குறிக்கலாம்; அரசவைச் சூழலில் ‘அரியணை’ அதிகார நிலையைக் காட்டுகிறது.
- source_word: מֵעַל כָּל הַשָּׂרִים
  choice: எல்லா அதிகாரிகளுக்கும் மேலாக
  rationale: பாரசீக அரசவையின் பிற உயரதிகாரிகளைக் காட்டிலும் மேலான பதவி என்பதை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: אֲשֶׁר אִתּוֹ
  choice: தன்னோடிருந்த
  rationale: சுட்டுப்பெயர் அரசனைக் குறிக்கும் இயல்பான வாசிப்பைத் தமிழில் தெளிவாக்குகிறது; அரசனுடன் இணைந்த அரசவை அதிகாரிகளை இது விவரிக்கிறது.
