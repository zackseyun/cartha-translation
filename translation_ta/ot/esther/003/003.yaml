  text: Then the king’s servants who were at the king’s gate said to Mordecai[a], “Why are you transgressing the king’s command?”
translation:
  language: ta
  text: அப்போது அரசரின் வாசலில் இருந்த பணியாளர்கள் மொர்தெகாயிடம், “நீ ஏன் அரசரின் கட்டளையை மீறுகிறாய்?” என்று கேட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது … கேட்டார்கள்
  rationale: வாவ்-தொடர்வினை கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; ‘அப்போது’ அந்தத் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது. நேரடி உரை கேள்வியாக இருப்பதால், தமிழில் ‘கேட்டார்கள்’ என்பது ‘சொன்னார்கள்’ என்பதைவிட இயல்பான உரையாடல் நடை.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: அரசரின் … பணியாளர்கள்
  rationale: עֶבֶד என்பதன் அடிப்படைப் பொருளான ‘பணியாளர்/ஊழியர்’ என்பதைக் காக்கிறது; இங்கே அவர்களை உயரதிகாரிகள் என்றோ அடிமைகள் என்றோ தேவையின்றி குறிப்பாக வரையறுக்கவில்லை.
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  choice: அரசரின் வாசலில் இருந்த
  rationale: அவர்கள் இருந்த இடத்தைத் தெளிவாகக் குறிக்கிறது. ‘வாசல்’ என்பது அரண்மனை நுழைவிடத்தையும் அதனுடன் தொடர்புடைய அரசவைப் பகுதியையும் குறிக்கக்கூடிய எபிரெயச் சொல்லின் சூழல்சார்ந்த நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: לְמָרְדֳּכָי
  choice: மொர்தெகாயிடம்
  rationale: உரையின் மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: מַדּוּעַ אַתָּה
  choice: நீ ஏன்
  rationale: மொர்தெகாயை ஒருமையில் நேரடியாக விளித்து, காரணம் கேட்கும் எபிரெய அமைப்பைத் தெளிவாக வழங்குகிறது.
- source_word: עוֹבֵר אֵת מִצְוַת הַמֶּלֶךְ
  choice: அரசரின் கட்டளையை மீறுகிறாய்
  rationale: עבר என்பதன் ‘எல்லையைக் கடத்தல்/மீறுதல்’ என்ற கருத்தையும், מִצְוָה என்பதன் அரசாணைச் சூழலிலான ‘கட்டளை’ என்ற பொருளையும் இயல்பாகக் காக்கிறது.
