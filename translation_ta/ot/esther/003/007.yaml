  choice: ‘பூர்’ ... சீட்டு போடப்பட்டது
  rationale: הִפִּיל என்பதன் சீட்டுப் போடுதல் என்ற மரபுத்தொடர் பொருளைத் தருகிறது; வெளிப்படையான செய்பவர் இல்லாததால் தமிழிலும் செயப்பாட்டு வடிவம் வைக்கப்பட்டது.
- source_word: פּוּר הוּא הַגּוֹרָל
  choice: ‘பூர்’—அதாவது, சீட்டு
  rationale: பாரசீகக் கடன்சொல்லான ‘பூர்’ பின்னர் ‘பூரீம்’ என்ற பெயருடன் உள்ள தொடர்புக்காகப் பாதுகாக்கப்பட்டு, எபிரெய உரை தரும் விளக்கத்தின்படி ‘சீட்டு’ என விளக்கப்பட்டது.
- source_word: לִפְנֵי הָמָן
  choice: ஆமானின் முன்னிலையில்
  rationale: சீட்டு ஆமானுக்கு எதிரே போடப்பட்டது என்ற தவறான எண்ணத்தைத் தவிர்த்து, ‘அவர் முன்னிலையில்’ என்ற இடப்பொருளைத் தெளிவாக்குகிறது.
