base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
translation:
  language: ta
  text: முதலாம் மாதமான நிசான் மாதத்தில், அகாஸ்வேரு அரசனின் பன்னிரண்டாம் ஆட்சியாண்டில், ஆமானின் முன்னிலையில் ‘பூர்’—அதாவது, சீட்டு—போடப்பட்டது; நாளிலிருந்து நாளுக்கும், மாதத்திலிருந்து மாதத்துக்கும், பன்னிரண்டாவது மாதமான ஆதார் மாதம்வரை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சார்ந்த மொழிபெயர்ப்பு: “நாளிலிருந்து நாளுக்கும், மாதத்திலிருந்து மாதத்துக்கும்—பன்னிரண்டு, அதாவது ஆதார் மாதம்.” இறுதித் தொடர் சுருக்கமானது; சீட்டுப் போடுதல் காலண்டரில் பன்னிரண்டாவது மாதமான ஆதார்வரை சென்றது என்பதே அதன் பொருளாகத் தெரிகிறது.'
    reason: lexical_alternative
lexical_decisions:
