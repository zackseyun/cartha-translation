  choice: ஒவ்வொரு நாளுக்காகவும் ஒவ்வொரு மாதத்திற்காகவும்
  rationale: சூழலில் சீட்டால் நாட்களும் மாதங்களும் பரிசீலிக்கப்பட்டன என்ற கருத்தை இயல்பான தமிழில் தருகிறது; எபிரெயத் தொடரின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: பன்னிரண்டாம் மாதமாகிய ஆதார் மாதம் தெரிவானது
  rationale: தொடரின் சூழ்நிலைப் பொருளான தேர்வு முடிவைத் தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் ‘தெரிவானது’ வெளிப்படையாக இல்லை என்பதால் அடிக்குறிப்பில் சொற்சார்ந்த அமைப்பு தரப்படுகிறது.
theological_decisions:
- issue: சீட்டுப் போடுதலின் விளைவும் காலவரிசையும்
  choice: பன்னிரண்டாம் மாதமாகிய ஆதார் மாதம் தெரிவானது
  alternative: நாளிலிருந்து நாளுக்கும் மாதத்திலிருந்து மாதத்துக்கும்—பன்னிரண்டு, அதாவது ஆதார் மாதம்
  rationale: எபிரெய தொடரின் இறுதிப்பகுதி சுருக்கமானதும் இலக்கண ரீதியாகக் கடினமானதும் ஆகும். சூழல் ஆதார் மாதம் சீட்டால் குறிக்கப்பட்டதை உணர்த்துகிறது; எனினும் மூலத்தின் தெளிவின்மையை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. ‘நிசான்’, ‘ஆதார்’, ‘பூர்’, ‘ஆமான்’, ‘அகாஸ்வேரு’ ஆகியவை மூலப்பெயர்களின் தமிழ் ஒலிபெயர்ப்புகளாக வைக்கப்பட்டன. மூலத்தின் இறுதித் தொடரிலுள்ள சுருக்கமும் உண்மையான தெளிவின்மையும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
