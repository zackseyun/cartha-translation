  to: அப்போது அரசன் ஆமானிடம், “வெள்ளி[a] உனக்குக் கொடுக்கப்பட்டுள்ளது; மக்களும்[b] உனக்குக் கொடுக்கப்பட்டுள்ளனர். உன் பார்வைக்கு நல்லதாகத் தோன்றுவதுபோல் அவர்களை நடத்திக்கொள்” என்றான்.
