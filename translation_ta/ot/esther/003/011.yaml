base_translation:
  language: en
  yaml_path: translation/ot/esther/003/011.yaml
  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
translation:
  language: ta
  text: அப்போது அரசன் ஆமானிடம், “வெள்ளி[a] உனக்குக் கொடுக்கப்பட்டுள்ளது; மக்களும்[b] உனக்குக் கொடுக்கப்பட்டுள்ளனர். உன் பார்வைக்கு நல்லதாகத் தோன்றுவதுபோல் அவர்களை நடத்திக்கொள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணம்.” எபிரெயச் சொல் כֶּסֶף என்பதற்கு நேரடியாக “வெள்ளி” என்றும், விரிவான பயன்பாட்டில் “பணம்” என்றும் பொருள் உண்டு.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் “மக்கள்” என்பது இலக்கணப்படி ஒருமையில் உள்ள கூட்டுப்பெயர்; அதைத் தொடர்ந்து வரும் சுட்டுப்பெயரும் ஒருமையில் உள்ளது. தமிழில் மக்களைக் குறிக்க இயல்பான பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வின் அடுத்த கட்டத்தை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதை ஓட்டத்தையும் நிகழ்வுகளின் வரிசையையும் காட்டுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய மூலத்தில் தனிப்பட்ட அரசரின் பெயருக்குப் பதிலாகத் திட்டவட்டமான பட்டமே பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְהָמָן
  choice: ஆமானிடம்
  rationale: முன்னிடைச்சொல்லும் ஆமான் என்ற தனிப்பெயரும் சேர்ந்து சொல்லப்படுவது யாரிடம் அரசன் பேசினான் என்பதைக் குறிக்கிறது.
- source_word: הַכֶּסֶף
  choice: அந்த வெள்ளி
  rationale: כֶּסֶף என்பதன் நேரடிப் பொருள் ‘வெள்ளி’; சூழலில் அது பணத்தையும் குறிக்கலாம். மூலச் சொல்லின் உருவகத் திறப்பைத் தக்கவைக்க ‘வெள்ளி’ உரையில் வைக்கப்பட்டு, ‘பணம்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: נָתוּן לָךְ
  choice: உனக்குக் கொடுக்கப்பட்டுள்ளது
  rationale: செயப்பாட்டு வினையெச்ச அமைப்பு வெள்ளி ஆமானின் வசம் ஒப்படைக்கப்பட்டதை அல்லது அவனுக்கே வழங்கப்பட்டதைச் சுட்டுகிறது; தமிழிலும் அதன் செயப்பாட்டு வடிவம் காக்கப்பட்டுள்ளது.
- source_word: וְהָעָם
  choice: அந்த மக்களும்
  rationale: இணைப்புச்சொல் வெள்ளியுடன் மக்களையும் அரசனின் ஒப்படைப்பில் இணைக்கிறது; ‘-உம்’ இரண்டாவது பொருளும் சேர்க்கப்படுவதை இயல்பாகக் காட்டுகிறது.
- source_word: לַעֲשׂוֹת בּוֹ
  choice: அவர்களுக்குச் செய்
  rationale: எபிரெயில் ‘அதில்/அவனில் செய்ய’ என்ற ஒருமை வடிவம் கூட்டுப்பெயரான ‘மக்கள்’ என்பதைக் குறிக்கிறது. தமிழில் மனிதர்களைக் குறிக்கும் இயல்பான பன்மைச் சுட்டு பயன்படுத்தப்பட்டுள்ளது; வினையின் பரந்த பொருள் தேவையின்றி ‘நடத்திக்கொள்’ எனக் குறுக்கப்படவில்லை.
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  choice: உன் பார்வைக்கு நல்லதாகத் தோன்றுவதுபோல்
  rationale: ஒருவருக்குச் சரியென்றோ விருப்பமானதென்றோ தோன்றுவதைச் சுட்டும் எபிரெய மொழிமரபின் ‘கண்களில் நல்லது’ என்ற உருவகத்தை வாசிக்க இயலும் நவீன தமிழில் ‘பார்வைக்கு’ என்று தக்கவைக்கிறது.
