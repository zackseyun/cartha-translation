translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அரசனின் கடுமையான ஒப்படைப்பையும், ‘வெள்ளி/பணம்’ மற்றும் கூட்டொருமைச் சுட்டின் மூலமொழி நுணுக்கங்களையும் அடிக்குறிப்புகளுடன் காக்கிறது. மூலத்தின் ‘உன் கண்களில் நல்லது’ என்ற மொழிமரபு முற்றிலும் கரைத்துவிடப்படாமல் ‘உன் பார்வைக்கு நல்லதாகத் தோன்றுவதுபோல்’ என வழங்கப்பட்டுள்ளது.
