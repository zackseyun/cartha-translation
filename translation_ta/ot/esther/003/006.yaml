base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
translation:
  language: ta
  text: மொர்தெகாய்மேல் மட்டும் கை வைப்பது அவனுக்கு இழிவானதாகத் தோன்றியது. ஏனெனில் மொர்தெகாய் எந்த மக்களைச் சேர்ந்தவன் என்று அவனுக்குத் தெரிவித்திருந்தார்கள். ஆகவே, அகாஸ்வேருவின் அரசாட்சியெங்கும் இருந்த யூதர்கள் அனைவரையும்—மொர்தெகாயின் மக்களை[a]—அழித்தொழிக்க ஆமான் வழி தேடினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘மொர்தெகாயின் மக்கள்’; அதாவது, மொர்தெகாய் எந்த மக்களைச் சேர்ந்தவனோ அந்த மக்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  choice: அவனுடைய பார்வையில் அற்பமான செயலாகத் தோன்றியது
  rationale: בזה என்பதும் ‘அவனுடைய கண்களில்’ என்ற எபிரெய மரபுத்தொடரும் இகழ்ச்சியையும், மொர்தெகாயை மட்டும் தாக்குவது தன் நோக்கத்திற்கு மிகச் சிறியதாகக் கருதப்பட்டதையும் வெளிப்படுத்துகின்றன. நவீன தமிழில் இயல்பாக இருக்கும்படி உருவகத்தை ‘பார்வையில்’ என்று தக்கவைத்துள்ளது.
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: தாக்குவது
  rationale: சொல்லுக்குச் சொல் ‘ஒருவருக்கு எதிராகக் கையை நீட்டுவது’ என்றாலும், இங்கு வன்முறையாகத் தீங்கு செய்வதே பொருள். தமிழில் ‘கை நீட்டுவது’ உதவி செய்வதையும் குறிக்கக்கூடும் என்பதால் தெளிவான ‘தாக்குவது’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְבַדּוֹ
  choice: மட்டும்
  rationale: மொர்தெகாய் ஒருவனை இலக்காக்குவதற்கும் அவனுடைய மக்கள் அனைவரையும் இலக்காக்குவதற்கும் உள்ள எதிர்மறையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: כִּי הִגִּידוּ לוֹ
  choice: ஏனெனில் ... அவனுக்குத் தெரிவித்திருந்தார்கள்
  rationale: ஆமானின் விரிவான திட்டத்திற்கான காரணத்தை இக்கூற்று தருகிறது; முன்னரே தெரிவிக்கப்பட்டிருந்த செய்தி என்பதை ‘தெரிவித்திருந்தார்கள்’ காட்டுகிறது.
- source_word: אֶת עַם מָרְדֳּכָי
  choice: மொர்தெகாய் எந்த மக்களைச் சேர்ந்தவன்
  rationale: சொல்லுக்குச் சொல் ‘மொர்தெகாயின் மக்கள்’ என்பது அவன் சேர்ந்த இன மக்களைக் குறிக்கிறது. முதல் occurrence-இல் பொருள் தெளிவாகும்படி விரித்துரைக்கப்பட்டுள்ளது.
- source_word: וַיְבַקֵּשׁ
  choice: வகை தேடினான்
  rationale: בקש இங்கு திட்டமிட்ட நோக்கத்தையும் அதை நிறைவேற்ற வழி நாடியதையும் குறிக்கிறது; திட்டம் ஏற்கெனவே வெற்றி பெற்றதாக மிகைப்படுத்தாமல் இந்தத் தொடர்ச்சி கூறுகிறது.
- source_word: לְהַשְׁמִיד
  choice: அழித்தொழிக்க
  rationale: ஷמד என்பதன் காரணவினை வடிவம் முழுமையாக அழிக்கும் கடுமையான நோக்கைக் குறிக்கிறது. ‘அழித்தொழிக்க’ அந்த வலிமையை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: כָּל הַיְּהוּדִים
  choice: யூதர்கள் அனைவரையும்
  rationale: எஸ்தர் நூலின் சூழலில் இது யூத இன மக்களைக் குறிக்கிறது; யூதா நாட்டில் வசிப்பவர்களை மட்டும் அல்ல.
- source_word: אֲשֶׁר בְּכָל מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேருவின் முழு அரசிலும் இருந்த
  rationale: அரசு முழுவதிலும் பரவியிருந்த யூதர்கள் அனைவரையும் குறிக்கும் பரப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַם מָרְדֳּכָי
  choice: மொர்தெகாயின் மக்களை
  rationale: வசனத்தின் முடிவில் மீண்டும் வரும் எபிரெய சொற்றொடரைத் தக்கவைத்து, யூதர்கள் மொர்தெகாய் சேர்ந்த மக்கள் என்ற வலியுறுத்தலைப் பாதுகாக்கிறது.
