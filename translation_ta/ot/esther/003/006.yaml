- from: மொர்தெகாயை மட்டும் தாக்குவது அவனுடைய பார்வையில் அற்பமான செயலாகத் தோன்றியது. ஏனெனில் மொர்தெகாய் எந்த மக்களைச் சேர்ந்தவன் என்று அவனுக்குத் தெரிவித்திருந்தார்கள். ஆகவே, அகாஸ்வேருவின் முழு அரசிலும் இருந்த யூதர்கள் அனைவரையும்—மொர்தெகாயின் மக்களை[a]—அழித்தொழிக்க ஆமான் வகை தேடினான்.
  to: மொர்தெகாய்மேல் மட்டும் கை வைப்பது அவனுக்கு இழிவானதாகத் தோன்றியது. ஏனெனில் மொர்தெகாய் எந்த மக்களைச் சேர்ந்தவன் என்று அவனுக்குத் தெரிவித்திருந்தார்கள். ஆகவே, அகாஸ்வேருவின் அரசாட்சியெங்கும் இருந்த யூதர்கள் அனைவரையும்—மொர்தெகாயின் மக்களை[a]—அழித்தொழிக்க ஆமான் வழி தேடினான்.
