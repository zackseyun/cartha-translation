translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான அரச ஆணை நடையைப் பயன்படுத்துகிறது. மூல வசனத்தின் நீண்ட நிர்வாக வாக்கியம் தமிழில் வாசிக்க எளிதாக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; ‘என்று எழுதப்பட்டிருந்தது’ என்பது கடிதங்களின் நோக்கத்தை இயல்பாக இணைக்கும் வெளிப்படையான தமிழாக்கம். எபிரெய மூவினை வலியுறுத்தலும், வயது வரம்பைக் குறிக்கும் ஆண்பால் ஒருமை வடிவமும், கொள்ளைக்கான அனுமதியும் மங்கச் செய்யப்படவில்லை.
