  terminology: ‘யூதர்கள்,’ ‘ஆதார்,’ ‘அழிக்கவும், கொல்லவும், முற்றிலும் ஒழிக்கவும்,’ மற்றும் ‘இளைஞன் முதல் முதியவன் வரை’ ஆகியவை பொருத்தமானவை. ‘அரசத் தூதர்கள்’ என்பது சூழலுக்கு ஏற்றது; ஆனால் மூலத்தில் வெளிப்படையாக வரும் ‘ஓட்டக்காரர்கள்’ என்ற சொல்லை அடிக்குறிப்பு பாதுகாக்கிறது.
