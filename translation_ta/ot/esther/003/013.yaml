  text: וְ/נִשְׁל֨וֹחַ סְפָרִ֜ים בְּ/יַ֣ד הָ/רָצִים֮ אֶל כָּל מְדִינ֣וֹת הַ/מֶּלֶךְ֒ לְ/הַשְׁמִ֡יד לַ/הֲרֹ֣ג וּ/לְ/אַבֵּ֣ד אֶת כָּל הַ֠/יְּהוּדִים מִ/נַּ֨עַר וְ/עַד זָקֵ֜ן טַ֤ף וְ/נָשִׁים֙ בְּ/י֣וֹם אֶחָ֔ד בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֣דֶשׁ אֲדָ֑ר וּ/שְׁלָלָ֖/ם לָ/בֽוֹז־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/013.yaml
  text: Letters were sent by the hand of the couriers to all the provinces of the king[a], to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women, in one day, on the thirteenth day of the twelfth month, that is, the month Adar[d][c][b], and to plunder their spoil.
translation:
  language: ta
  text: அரசனின் எல்லா மாகாணங்களுக்கும் அரசத் தூதர்கள் மூலம் கடிதங்கள் அனுப்பப்பட்டன[a]. அவற்றில், யூதர்கள் அனைவரையும்—இளைஞன் முதல் முதியவன் வரை[b], குழந்தைகளையும் பெண்களையும்—அழிக்கவும், கொல்லவும், முற்றிலும் ஒழிக்கவும்[c], ஒரே நாளில், பன்னிரண்டாம் மாதமாகிய ஆதார் மாதத்தின் பதின்மூன்றாம் நாளில், அவர்களுடைய உடைமைகளை கொள்ளைப் பொருளாகப் பறித்துக்கொள்ளவும்[d] என்று எழுதப்பட்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, ‘தூதர்கள் மூலம்.’ சொல்லுக்குச் சொல்: ‘ஓடுகிறவர்களின் கையால்.’ இவர்கள் அரசத் தூதர்கள்.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இளையோர் முதல் முதியோர் வரை.’ எபிரெயம் சொல்லுக்குச் சொல் ‘இளைஞன் முதல் முதியவன் வரை’ என்று கூறி, எல்லா வயதினரையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘அழிக்கவும், கொல்லவும், முற்றிலும் ஒழிக்கவும்’ என்ற மூன்று வினைச்சொற்களும் எபிரெய ஆணையில் வன்முறையின் முழுமையைத் திட்டமிட்டு வலியுறுத்துகின்றன.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, ‘அவர்களுடைய பொருள்களைக் கொள்ளைப் பொருளாகக் கைப்பற்றவும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁלוֹחַ סְפָרִים
  choice: கடிதங்கள் அனுப்பப்பட்டன
  rationale: எபிரெயச் செயல்பாட்டு வடிவத்தின் செயப்பாட்டு/ஆளில்லா பொருளை இயல்பான தமிழ்ச் செயப்பாட்டு வாக்கியமாக்குகிறது; பாரசீக அரச நிர்வாகச் சூழலில் סְפָרִים என்பது எழுத்துப்பூர்வமான அரச கடிதங்களைக் குறிக்கிறது.
- source_word: בְּיַד הָרָצִים
  choice: அஞ்சல் தூதர்களின் கையில்
  rationale: ‘கையில்’ என்ற எபிரெய மரபுத்தொடரைத் தக்கவைத்தபடி, ‘ஓடுகிறவர்கள்’ என்போர் அரச அஞ்சல் தூதர்கள் என்பதைத் தெளிவாக்குகிறது.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: அழிக்கவும், கொல்லவும், முற்றிலும் ஒழிக்கவும்
  rationale: முழுமையான வன்முறையை வலியுறுத்தும் மூன்று நெருங்கிய பொருளுடைய வினைச்சொற்களின் திட்டமிட்ட அடுக்கைத் தமிழிலும் மூன்று தனி வினைச்சொற்களாகப் பாதுகாக்கிறது.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: இளைஞன் முதல் முதியவன் வரை
  rationale: எபிரெயத்தில் உள்ள ஒருமை ஆண்பால் சொற்களையும், அவை மக்கள் முழுவதையும் வயது வரம்பின் மூலம் பகிர்ந்துணர்த்தும் பயன்பாட்டையும் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: טַף וְנָשִׁים
  choice: குழந்தைகளையும் பெண்களையும்
  rationale: טַף என்பதன் ‘சிறு பிள்ளைகள்/குழந்தைகள்’ என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; போரில் ஈடுபடாதவர்களும் ஆணையில் சேர்க்கப்பட்டதை வெளிப்படுத்துகிறது.
- source_word: בְּיוֹם אֶחָד
  choice: ஒரே நாளில்
  rationale: அழிப்பு முழுவதும் ஒரு குறிப்பிட்ட நாளுக்குள் நடத்தப்பட வேண்டும் என்ற செறிவான காலக் குறிப்பைப் பாதுகாக்கிறது.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: பன்னிரண்டாம் மாதமாகிய ஆதார் மாதத்தின் பதின்மூன்றாம் நாளில்
  rationale: எபிரெயத் தேதி முறையையும், பன்னிரண்டாம் மாதமே ஆதார் என்ற விளக்கத்தையும் இயல்பான தமிழ்ச் சொல்லமைப்பில் ஒருங்கிணைக்கிறது.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: அவர்களுடைய உடைமைகளைக் கொள்ளையிடவும்
  rationale: அவர்களுடைய பொருள்களைச் சட்டபூர்வமான கொள்ளையாகக் கைப்பற்ற அனுமதித்த ஆணையின் பொருளை இயல்பான தமிழில் தருகிறது; மூலத்தின் கொள்ளை சார்ந்த வலியுறுத்தல் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
