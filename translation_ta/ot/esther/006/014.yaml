translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல்லின் ‘அலிகள்/அதிகாரிகள்’ என்ற உண்மையான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
