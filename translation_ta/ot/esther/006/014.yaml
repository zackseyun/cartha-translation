  text: עוֹדָ/ם֙ מְדַבְּרִ֣ים עִמּ֔/וֹ וְ/סָרִיסֵ֥י הַ/מֶּ֖לֶךְ הִגִּ֑יעוּ וַ/יַּבְהִ֨לוּ֙ לְ/הָבִ֣יא אֶת הָמָ֔ן אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשְׂתָ֥ה אֶסְתֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/014.yaml
  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
translation:
  language: ta
  text: அவர்கள் இன்னும் அவனோடு பேசிக்கொண்டிருக்கும்போதே, அரண்மனை அதிகாரிகள்[a] வந்து, எஸ்தர் ஏற்பாடு செய்திருந்த விருந்துக்கு ஆமானை அவசரமாக அழைத்துச் சென்றார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனின் அலிகள்.” எபிரெயச் சொல் அரண்மனை அதிகாரிகளையும் அலிகளையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, அவரை மிகுந்த விரைவுடன் கூட்டிச் சென்றார்கள். இங்குள்ள எபிரெய வினைச்சொல் அவசர வேகத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים עִמּוֹ
  choice: அவர்கள் இன்னும் அவனோடு பேசிக்கொண்டிருக்கும்போதே
  rationale: எபிரெய உரையிலுள்ள தொடர்ந்துகொண்டிருந்த செயலும், அது முடிவதற்குள் அடுத்த நிகழ்வு நடந்ததும் இயல்பான நவீன தமிழில் வெளிப்படுகிறது. עִמּוֹ என்பதிலுள்ள ‘அவனோடு’ என்ற உறவும் காக்கப்படுகிறது.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: அரண்மனை அதிகாரிகள்
  rationale: סָרִיס் என்பது உடல்சார்ந்த பொருளில் ‘அலிகள்’ என்றும், அரசவையில் பணியாற்றும் அதிகாரிகள் என்றும் குறிக்கலாம். இச்சூழலில் பணியை முன்னிறுத்தும் இயல்பான தமிழாக ‘அரண்மனை அதிகாரிகள்’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הִגִּיעוּ
  choice: வந்து
  rationale: அவர்கள் அந்த இடத்தை வந்தடைந்தனர் என்ற நிகழ்வை தமிழ் கதைநடைக்கு இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיְבַהִלוּ לְהָבִיא
  choice: அவசரமாக அழைத்துச் சென்றார்கள்
  rationale: Hiphil வடிவம் விரைவுபடுத்துதல் அல்லது அவசரப்படுதல் என்ற கருத்தைக் கொண்டது. இலக்கிடம் நோக்கி ஆமானைக் கூட்டிச் சென்ற செயலைத் தமிழில் ‘அழைத்துச் சென்றார்கள்’ இயல்பாகக் கூறுகிறது; அவசரத்தின் வலிமை அடிக்குறிப்பிலும் விளக்கப்படுகிறது.
- source_word: הַמִּשְׁתֶּה
  choice: விருந்து
  rationale: மது உட்படக்கூடிய அரசவைக் கொண்டாட்ட உணவைச் சுட்டும் מִשְׁתֶּה என்பதற்கு தெளிவான, பொதுவாகப் புரியும் தமிழ் இணை.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: எஸ்தர் ஏற்பாடு செய்திருந்த
  rationale: עשה என்பதன் நேரடிப் பொருள் ‘செய்தாள்’ என்றாலும், விருந்தைப் பற்றிய இயல்பான தமிழில் ‘ஏற்பாடு செய்திருந்த’ என்பது முன்பே ஆயத்தப்படுத்தப்பட்ட நிகழ்வைத் தெளிவுபடுத்துகிறது.
