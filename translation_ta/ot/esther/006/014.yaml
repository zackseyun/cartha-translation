  source_fidelity: 'மூல எபிரெயத்தின் நிகழ்வுவரிசையும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: அவர்கள் ஆமானோடு இன்னும் பேசிக்கொண்டிருக்கையில் அரசனின் சָרִיסֵי வந்தனர்; பின்னர் அவனை எஸ்தர் ஆயத்தப்படுத்திய விருந்துக்கு அவசரமாகக் கொண்டுசென்றனர். ‘வந்து’ என்பது הִגִּיעוּ-க்கு இயல்பான கதைநடை இணையாகும்; ‘ஏற்பாடு செய்திருந்த’ என்பது விருந்துச் சூழலில் עָשְׂתָה-க்கு பொருத்தமானது.'
  naturalness: உரை நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘பேசிக்கொண்டிருக்கும்போதே’ தொடர்ச்சியான செயலைத் தக்கவைக்கிறது; ‘அவசரமாக அழைத்துச் சென்றார்கள்’ கதையின் வேகத்தைச் சரியாக வெளிப்படுத்துகிறது.
  terminology: ‘அரண்மனை அதிகாரிகள்’ என்பது סָרִיסֵי என்பதன் அரசவைப் பணியாளர் பொருளை இயல்பாகத் தருகிறது. ‘அரசனின் அலிகள்’ என்ற மாற்றுப்பொருள் அடிக்குறிப்பில் வழங்கப்பட்டிருப்பதால், சொல்லின் பாலியல்/அரசவைப் பொருள் விரிவும் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது. எஸ்தர், ஆமான் ஆகிய பெயர்கள் நிலையான தமிழ்வேதாகமப் பயன்பாட்டிற்கு ஏற்றவை.
