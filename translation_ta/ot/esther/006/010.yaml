base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
translation:
  language: ta
  text: அப்போது அரசன் ஆமானிடம், “விரைந்து, நீ சொன்னபடியே அந்த அங்கியையும் குதிரையையும் எடுத்துக்கொண்டு, அரசனின் வாயிலில் அமர்ந்திருக்கும் யூதனாகிய[a] மொர்தெகாய்க்கு அவ்வாறே செய். நீ சொன்னவற்றில் ஒன்றைக்கூட விட்டுவிடாதே[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதன்” என்பதற்கு “யூதேயன்” என்றும் மொழிபெயர்க்கலாம்; ஆனால் இங்கே அது மொர்தெகாயின் இன-சமய அடையாளத்தைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “நீ சொன்ன எல்லாவற்றிலிருந்தும் ஒரு காரியத்தையும் விழவிடாதே.” இது எதையும் விட்டுவிடக் கூடாது என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: சீக்கிரம்!
  rationale: உடனடியாகச் செயல்படும்படி வலியுறுத்தும் கட்டளையின் அவசரத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: קַח
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடு’ என்பதைக் காக்கிறது; தொடரும் கட்டளையுடன் இயல்பாக இணைகிறது.
- source_word: הַלְּבוּשׁ
  choice: அந்த அங்கி
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட சிறப்பான அரச உடையைக் குறிக்கும் definite வடிவத்தை ‘அந்த’ என்பதும், சூழலுக்கேற்ற garment வகையை ‘அங்கி’ என்பதும் இயல்பாகத் தெரிவிக்கின்றன.
- source_word: הַסּוּס
  choice: குதிரை
  rationale: மூலத்தில் பெயர்ச்சொல் வெறுமனே ‘குதிரை’ என்றே உள்ளது; இவ்வசனத்தில் இல்லாத ‘அரச குதிரை’ என்ற அடைமொழி சேர்க்கப்படவில்லை.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: நீ சொன்னபடியே
  rationale: ஆமான் முன்மொழிந்த விதத்திலேயே செய்ய வேண்டும் என்ற வலியுறுத்தலைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: וַעֲשֵׂה כֵן
  choice: அவ்வாறே செய்
  rationale: முன்னர் சொன்ன செயல் முறையை அப்படியே நிறைவேற்றும்படி கூறும் கட்டளையை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לְמָרְדֳּכַי
  choice: மொர்தெகாய்க்கு
  rationale: לְ இங்குப் பயனடைவோரைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை உருபு இயல்பான இணை.
- source_word: הַיְּהוּדִי
  choice: யூதனாகிய
  rationale: கதையில் மொர்தெகாயின் இன-சமய அடையாளத்தை இயல்பான தமிழில் குறிக்கிறது; புவியியல் சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: அரண்மனை வாயிலில் அமர்ந்திருக்கும்
  rationale: சொல்லுக்கு சொல் ‘அரசனின் வாயில்’ என்பதைவிட, அரச அரண்மனையின் அதிகாரபூர்வ வாயில்/நுழைவிடத்தைக் குறிக்கும் சூழலை நவீன தமிழில் தெளிவாகத் தருகிறது; நிகழ்காலப் பெயரெச்சம் மொர்தெகாயின் அறியப்பட்ட இருப்பிடத்தையும் பணிநிலையையும் விளக்குகிறது.
- source_word: אַל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  choice: நீ சொன்னவற்றில் ஒன்றைக்கூட விட்டுவிடாதே
  rationale: ‘ஒரு காரியத்தையும் விழவிடாதே’ என்ற எபிரெய மரபுத்தொடரின் நோக்கமான, எதையும் தவிர்க்காமல் முழுமையாகச் செய்ய வேண்டும் என்ற பொருளைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
