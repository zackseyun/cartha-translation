translation_notes:
  register: நவீனத் தரத் தமிழில், அரச கட்டளைக்கேற்ற கண்ணியமான நேரடி நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சீக்கிரம்!’ என்ற தனிக் கட்டளை மூலத்தின் அவசரத்தை வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
