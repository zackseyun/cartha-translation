  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֥שָׁב מָרְדֳּכַ֖י אֶל שַׁ֣עַר הַ/מֶּ֑לֶךְ וְ/הָמָן֙ נִדְחַ֣ף אֶל בֵּית֔/וֹ אָבֵ֖ל וַ/חֲפ֥וּי רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/012.yaml
  text: Then Mordecai returned to the king’s gate[a], but Haman hurried to his house[b], mourning and with his head covered.
translation:
  language: ta
  text: பின்பு மொர்தெகாய் ராஜாவின் வாசலுக்குத் திரும்பினான். ஆனால் ஆமான் துக்கத்துடன், தலையை மூடியவனாக[b], தன் வீட்டுக்கு விரைந்து சென்றான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் வீட்டுக்குத் தள்ளப்பட்டான்.’ இவ்வாறு மொழிபெயர்த்தால் எபிரெய வினைச்சொல்லின் செயப்பாட்டு வலிமை தெளிவாகத் தெரியும்.
    reason: lexical_alternative
  - marker: b
    text: தலையை மூடிக்கொள்வது துயரம், அவமானம் அல்லது புலம்பலை வெளிப்படுத்திய ஒரு பண்பாட்டு அடையாளம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பினான்
  rationale: שׁוּב என்பதன் தொடர்கதை வடிவம், முன்பு இருந்த இடத்திற்குத் திரும்புவதைக் குறிக்கிறது; ‘திரும்பினான்’ என்பது இயல்பான, நேரடியான தமிழ்.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: ராஜாவின் வாசல்
  rationale: இது ராஜா அல்லது அரண்மனை வளாகத்துடன் தொடர்புடைய வாசலைக் குறிக்கும் பெயர்ச்சொல் தொடர். ‘ராஜாவின் வாசல்’ மூலத்தின் அமைப்பையும் வழக்கமான எஸ்தர் கதைநடையையும் காக்கிறது.
- source_word: נִדְחַף
  choice: விரைந்து சென்றான்
  rationale: דחף என்பதன் நிஃபால் வடிவம் தள்ளப்படுதல் அல்லது உந்தப்படுதல் என்ற செயல்பாட்டு நிழலைக் கொண்டுள்ளது. இச்சூழலில் அவமானத்திற்குப் பின் ஆமான் வேகமாக அகன்றதைக் ‘விரைந்து சென்றான்’ இயல்பாகத் தெரிவிக்கிறது; அதன் வலுவான செயப்பாட்டு மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֵּיתוֹ
  choice: தன் வீட்டுக்கு
  rationale: உடையவரைச் சுட்டும் மூல வடிவத்தைத் தமிழ் தற்சுட்டுப் பெயரால் இயல்பாக வெளிப்படுத்துகிறது; ‘வீடு’ கதைநடைக்கு ஏற்ற நேரடியான சொல்.
- source_word: אָבֵל
  choice: துக்கத்துடன்
  rationale: இந்தப் பெயரடை ஆமானின் துயரம் அல்லது புலம்பல் நிறைந்த நிலையைக் குறிக்கிறது. ‘துக்கத்துடன்’ நவீன தமிழில் இயல்பாக இருந்து, அவன் மனநிலையை மிகையாக விளக்காமல் தெரிவிக்கிறது.
- source_word: חֲפוּי רֹאשׁ
  choice: தலையை மூடியவனாக
  rationale: தலை மூடப்பட்டிருந்தது என்ற மூலத்தின் கண்கூடான உருவகத்தைத் தக்கவைக்கிறது; அதை ‘அவமானமடைந்து’ போன்ற விளக்கச் சொல்லால் மாற்றவில்லை.
