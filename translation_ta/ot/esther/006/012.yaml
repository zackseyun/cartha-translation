translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் சுருக்கமும் காட்சிப்படிமமும் காக்கப்பட்டுள்ளன; נִדְחַף என்பதிலுள்ள இயக்கம் மற்றும் செயப்பாட்டு நிழல் முதன்மை உரை மற்றும் அடிக்குறிப்பு மூலம் சமநிலைப்படுத்தப்பட்டுள்ளது.
