base_translation:
  language: en
  yaml_path: translation/ot/esther/006/004.yaml
  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
translation:
  language: ta
  text: அரசர், “முற்றத்தில் யார் இருக்கிறார்?” என்று கேட்டார். அந்த நேரத்தில் ஆமான், அவன் மொர்தெகாய்க்காக அமைத்திருந்த தூக்குமரத்தில் மொர்தெகாயைத் தூக்கிலிடுவது குறித்து அரசரிடம் பேசுவதற்காக அரண்மனையின் வெளிமுற்றத்துக்கு வந்திருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶחָצֵר / לַחֲצַר
  choice: முற்றத்தில் / வெளிமுற்றத்துக்கு
  rationale: חָצֵר என்பது சூழப்பட்ட முற்றத்தைக் குறிக்கிறது. முதல் இடத்தில் இயல்பான ‘முற்றம்’ என்றும், הַחִיצוֹנָה உடன் வரும் இரண்டாம் இடத்தில் ‘வெளிமுற்றம்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: וְהָמָן בָּא
  choice: அந்த நேரத்தில் ஆமான் ... வந்திருந்தான்
  rationale: இந்தக் கூற்று அரசரின் கேள்விக்கான பின்னணிச் சூழலை அளிக்கிறது. ஆமான் ஏற்கெனவே வெளிமுற்றத்துக்கு வந்திருந்ததைத் தமிழில் இயல்பாகக் காட்ட இறந்தகால நிறைவுவினை பயன்படுத்தப்பட்டது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரண்மனை
  rationale: சொல்லுக்கு சொல் ‘அரசரின் வீடு’ என்றாலும், அரசவைக் சூழலில் ‘அரண்மனை’ என்பதே இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: לֵאמֹר לַמֶּלֶךְ
  choice: அரசரிடம் பேசுவதற்காக
  rationale: இங்கு אמר என்பதன் வினையெச்ச வடிவம் ஆமான் வந்த நோக்கத்தைச் சுட்டுகிறது; ‘பேசுவதற்காக’ என்பது அவன் கோரிக்கையை முன்வைக்க வந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִתְלוֹת
  choice: தூக்கிலிடுவது குறித்து
  rationale: תלה என்பதன் அடிப்படை உணர்வு தொங்கவிடுதல் அல்லது தூக்கிலிடுதல். அரசரிடம் பேச வேண்டிய பொருளாக இதைத் தமிழில் இயல்பாக இணைக்க ‘குறித்து’ பயன்படுத்தப்பட்டது.
- source_word: הָעֵץ
  choice: தூக்குமரம்
  rationale: עֵץ என்பதற்கு ‘மரம்’ அல்லது ‘மரப்பொருள்’ என்பது நேர்ப்பொருள். இச்சூழலில் அது மரணதண்டனைக்காக ஆமான் அமைத்த மரக் கட்டமைப்பைக் குறிக்கிறது; ‘தூக்குமரம்’ இயல்பாகவும் புரியத்தக்கதாகவும் இருந்து, மூலத்தின் ‘மரம்’ என்ற உணர்வையும் ஓரளவு காக்கிறது.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: தான் மொர்தெகாய்க்காக அமைத்திருந்த
  rationale: לוֹ என்பதன் சுட்டு இச்சூழலில் மொர்தெகாயைக் குறிக்கிறது. முன்பே செய்யப்பட்ட ஆயத்தத்தை ‘அமைத்திருந்த’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: தண்டனை நிறைவேற்றும் முறையின் துல்லியம்
  choice: மூலத்தின் பரந்த சொல்லை ‘தூக்குமரம்’ என மொழிபெயர்த்து, அடிக்குறிப்பில் அதன் நேர்ப்பொருளையும் வடிவம் குறிப்பிடப்படாததையும் தெரிவித்தல்
  alternative: ‘தூக்குக் கட்டமைப்பு,’ ‘மரக்கம்பம்,’ அல்லது ‘கழுமரம்’ என்று குறிப்பாக்குதல்
  rationale: עֵץ தண்டனைக் கருவியின் துல்லிய வடிவத்தையோ, இங்கு தொங்கவிடுதல் மற்றும் கழுவேற்றுதல் ஆகியவற்றில் எது நோக்கமோ தனியாகத் தீர்மானிக்கவில்லை. ஆகவே மூலத்தில் இல்லாத தொழில்நுட்பத் துல்லியத்தை உரையில் சேர்க்காமல் ambiguity காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரசருக்கான மரியாதைப் பன்மை வினைமுறை பயன்படுத்தப்பட்டது; ஆமானைப் பற்றிய கதைசொல்லல் இயல்பான ஒருமையில் வைக்கப்பட்டது. மூலத்தின் நாடகப்பாங்கான நேரச்சேர்க்கையை ‘அந்த நேரத்தில்’ என்பதும், முன்நிகழ்வை ‘வந்திருந்தான்’ என்பதும் வெளிப்படுத்துகின்றன.
