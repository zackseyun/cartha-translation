base_translation:
  language: en
  yaml_path: translation/ot/esther/006/005.yaml
  text: The king’s attendants said to him[a], “Look, Haman is standing in the court.” And the king said, “Let him come in.”
translation:
  language: ta
  text: ராஜாவின் பணியாளர்கள் அவரிடம், “இதோ, ஆமான் முற்றத்தில்[a] நின்றுகொண்டிருக்கிறார்” என்றார்கள். அதற்கு ராஜா, “அவன் உள்ளே வரட்டும்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அரண்மனை முற்றத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: ராஜாவின் பணியாளர்கள்
  rationale: נַעַר என்பது இளைஞன், பணியாள் அல்லது உதவியாளர் எனப் பொருள்படலாம். அரண்மனைச் சூழலில் வயதை வலியுறுத்தாமல் அவர்களுடைய பணியை இயல்பாகக் காட்டுவதால் ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை உடனடியாக ஈர்க்கும் எபிரெய இடைச்சொல்லின் சுட்டிக்காட்டும் தன்மையை இயல்பான, கண்ணியமான நவீனத் தமிழில் ‘இதோ’ தக்கவைக்கிறது.
- source_word: הָמָן
  choice: ஆமான்
  rationale: தனிப்பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபின்படி தரப்பட்டது.
- source_word: עֹמֵד
  choice: நின்றுகொண்டிருக்கிறார்
  rationale: இச்சொல் அப்போது தொடர்ந்துகொண்டிருந்த நிலையைச் சுட்டும் பங்கேற்பு வடிவம். ‘காத்திருக்கிறார்’ என்பது சூழலை விளக்கிச் சேர்க்கும் பொருளாக இருப்பதால் தவிர்க்கப்பட்டது.
- source_word: בֶּחָצֵר
  choice: முற்றத்தில்
  rationale: חָצֵר என்பது கட்டடத்துடன் தொடர்புடைய திறந்த முற்றம் அல்லது அரண்மனை முற்றத்தைக் குறிக்கிறது. ‘முற்றத்தில்’ என்பது மூலத்தின் சுருக்கத்தையும் இடப்பொருளையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: יָבֹא
  choice: அவன் உள்ளே வரட்டும்
  rationale: இங்குள்ள வினைவடிவம் ராஜாவின் கட்டளை அல்லது அனுமதியை வெளிப்படுத்துகிறது. ‘உள்ளே வரட்டும்’ என்பது அந்த வழிநடத்தும் வலிமையையும் ராஜாவின் முன்னிலைக்குள் வரும் இயக்கத்தையும் இயல்பாகக் காட்டுகிறது.
