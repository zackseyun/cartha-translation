translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான அரண்மனைச் சொல்லாட்சி பயன்படுத்தப்பட்டுள்ளது. ராஜாவைக் குறிக்க மரியாதை ஒருமை கையாளப்பட்டுள்ளது; ராஜாவின் நேரடிக் கூற்றில் ஆமானைக் குறிக்கும் ‘அவன்’ அதிகார உறவை இயல்பாகப் பிரதிபலிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத ‘காத்திருக்கிறார்’ போன்ற விளக்கப் பொருள் சேர்க்கப்படவில்லை.
