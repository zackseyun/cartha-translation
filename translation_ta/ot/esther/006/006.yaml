translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அரசவைக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசரைச் சுட்டும்போது மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; ஆமானின் உள்பேச்சில் அவனது தன்னுயர்வு வெளிப்படும் வினாத்தொனி காக்கப்பட்டுள்ளது.
