base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
translation:
  language: ta
  text: ஆமான் உள்ளே வந்தான். அரசர் அவனிடம், “அரசர் கௌரவிக்க விரும்புகிற அந்த மனிதனுக்கு என்ன செய்ய வேண்டும்?” என்று கேட்டார். ஆமான் தன் மனத்தில்[a], “என்னை விட அதிகமாகக் கௌரவிக்க அரசர் வேறு யாரை விரும்புவார்?” என்று நினைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “ஆமான் தன் இதயத்தில் சொன்னான்”; அதாவது, அவன் தனக்குள் சொல்லிக்கொண்டான்.'
    reason: எபிரெய மொழியின் உள்பேச்சைக் குறிக்கும் உருவகச் சொற்றொடரைப் பாதுகாக்கும் சொற்பொருள் விளக்கம்.
lexical_decisions:
- source_word: וַיָּבוֹא הָמָן
  choice: ஆமான் உள்ளே வந்தான்
  rationale: வழக்கமான கதைத்தொடர்ச்சியை இயல்பான நவீன தமிழில் தருகிறது; அரசரின் முன்னிலைக்குள் நுழைந்த சூழலை ‘உள்ளே வந்தான்’ தெளிவாக உணர்த்துகிறது.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: அரசர் அவனிடம் ... என்று கேட்டார்
  rationale: אָמַר என்பதன் அடிப்படைப் பொருள் ‘சொல்’ என்றாலும், இங்கு அதன் உள்ளடக்கம் நேரடியான கேள்வி. தமிழில் ‘கேட்டார்’ என்பது இயல்பாகவும் பொருள்துல்லியமாகவும் உள்ளது.
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  choice: அந்த மனிதனுக்கு என்ன செய்ய வேண்டும்?
  rationale: என்ன செய்யப்பட வேண்டும் என்ற கடமை/தகுதியை இக்கட்டமைப்பு காட்டுகிறது. தமிழில் ‘மனிதனுக்கு என்ன செய்ய வேண்டும்’ என்பது இயல்பாக உள்ளது.
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: அரசர் கௌரவிக்க விரும்புகிற
  rationale: חָפֵץ இங்கு மனவிருப்பத்தையும் மகிழ்ச்சியையும் குறிக்கிறது; יְקָר அரசரால் அளிக்கப்படும் கௌரவத்தைக் குறிக்கிறது. ‘கௌரவிக்க விரும்புகிற’ இரண்டையும் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  choice: ஆமான் தன் மனத்தில் ... என்று நினைத்தான்
  rationale: ‘தன் இதயத்தில் சொன்னான்’ என்பது எபிரெய மொழிமரபு. அதன் உள்பேச்சுப் பொருளை நவீன தமிழில் இயல்பாகத் தர ‘தன் மனத்தில் ... நினைத்தான்’ பயன்படுத்தப்பட்டுள்ளது; சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר יוֹתֵר מִמֶּנִּי
  choice: என்னைவிட அதிகமாக அரசர் வேறு யாரைக் கௌரவிக்க விரும்புவார்?
  rationale: ஆமானின் தன்னம்பிக்கையும் இறுமாப்பும் வெளிப்படும் வினாவடிவத்தைப் பாதுகாக்கிறது. ‘வேறு யார்’ என்பது தமிழில் எதிர்பார்க்கப்படும் ‘யாருமில்லை’ என்ற பொருளை இயல்பாக உணர்த்துகிறது; ‘என்னைவிட அதிகமாக’ ஒப்பீட்டைத் தக்கவைக்கிறது.
