translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவைச் சூழலுக்கேற்ற கண்ணியமான அதேவேளையில் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. மூலத்தின் செயப்பாட்டு அமைப்பும் ‘மரியாதை மற்றும் மேன்மை’ என்ற இரட்டைப் பதமும் பேணப்பட்டுள்ளன.
