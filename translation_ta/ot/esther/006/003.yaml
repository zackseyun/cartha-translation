  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַֽה נַּעֲשָׂ֞ה יְקָ֧ר וּ/גְדוּלָּ֛ה לְ/מָרְדֳּכַ֖י עַל זֶ֑ה וַ/יֹּ֨אמְר֜וּ נַעֲרֵ֤י הַ/מֶּ֨לֶךְ֙ מְשָׁ֣רְתָ֔י/ו לֹא נַעֲשָׂ֥ה עִמּ֖/וֹ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
translation:
  language: ta
  text: அப்போது அரசன், “இதற்காக மொர்தெகாய்க்கு என்ன மரியாதையும் மேன்மையும் செய்யப்பட்டன?” என்று கேட்டான். அரசனுக்குப் பணிவிடை செய்த இளைஞர்கள், “மொர்தெகாய்க்கு ஒன்றும் செய்யப்படவில்லை” என்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  choice: என்ன ... செய்யப்பட்டன
  rationale: נַעֲשָׂה என்பதன் செயப்பாட்டு பொருளை நேரடியாகப் பேணுகிறது; தொடரும் இரு பெயர்ச்சொற்களோடும் இயல்பாக அமைகிறது.
- source_word: יְקָר
  choice: மரியாதை
  rationale: அரசவைச் சூழலில் ஒருவருக்குக் காட்டப்படும் கௌரவத்தைக் குறிக்கிறது; பொருளின் விலைமதிப்பை அல்ல.
- source_word: וּגְדוּלָּה
  choice: மேன்மை
  rationale: உயர்நிலை அல்லது பெருமை அளிக்கப்படுவதைப் பிரதிபலிக்கிறது; மூலத்தின் ‘greatness’ சார்ந்த பொருளையும் பேணுகிறது.
- source_word: לְמָרְדֳּכַי
  choice: மொர்தெகாய்க்கு
  rationale: லாமேத் குறிக்கும் மறைமுகப் பெறுநர் அல்லது பயனாளியைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: עַל זֶה
  choice: இதற்காக
  rationale: முந்தைய சூழலில் பதிவான மொர்தெகாயின் செயலுக்கான காரணம் அல்லது கைம்மாறு என்ற தொடர்பைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: அரசனின் இளைஞர்கள்
  rationale: נְעָרִים என்பதன் அடிப்படைப் பொருளான ‘இளைஞர்கள்’ என்பதைப் பேணுகிறது.
- source_word: מְשָׁרְתָיו
  choice: அவனுக்குப் பணிவிடை செய்த
  rationale: அரசனிடம் தனிப்பட்ட முறையில் சேவை செய்து உடனிருந்த அரசவைப் பணியாளர்களைக் குறிக்கும் பங்கேற்புவினையின் பொருளைத் தெளிவாக்குகிறது.
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  choice: அவனுக்கு ஒன்றும் செய்யப்படவில்லை
  rationale: அவனுக்காக எந்த நடவடிக்கையும் எடுக்கப்படவில்லை என்ற எபிரெய மொழிநடையை இயல்பான தமிழில் செயப்பாட்டு வடிவில் தருகிறது.
