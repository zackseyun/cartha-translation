base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
translation:
  language: ta
  text: அப்போது ஆமான் அந்த அரச உடையையும் குதிரையையும் எடுத்துக்கொண்டு, மொர்தெகாய்க்கு அந்த உடையை அணிவித்து, அவரைக் குதிரையில் ஏற்றி நகரச் சதுக்கம் வழியாகச் செல்லச் செய்தான். அவருக்கு முன்னால், “அரசர் கௌரவிக்க விரும்பும் மனிதனுக்கு இப்படித்தான் செய்யப்படும்” என்று அறிவித்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלְּבוּשׁ
  choice: அந்த அரச உடை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட குறிப்பிட்ட அரச உடையைச் சுட்டுகிறது. தமிழில் தொடர்பைத் தெளிவாக்க ‘அரச’ சேர்க்கப்பட்டுள்ளது; இது முந்தைய வசனத்தின் வெளிப்படையான சூழல் தகவல்.
- source_word: הַסּוּס
  choice: குதிரை
  rationale: எபிரெயில் குறிப்பிட்ட குதிரை என்றே உள்ளது; அரசருக்குரிய தொடர்பை இங்கு கூடுதலாகச் சேர்க்காமல் எளிய சொல்லாக்கம் வைக்கப்படுகிறது.
- source_word: וַיַּלְבֵּשׁ אֶת מָרְדֳּכָי
  choice: மொர்தெகாய்க்கு அந்த உடையை அணிவித்து
  rationale: לבש என்பதன் காரணவினைப் பொருளான ஒருவருக்கு உடை அணிவித்தலை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וַיַּרְכִּיבֵהוּ
  choice: அவரைக் குதிரையில் ஏற்றி
  rationale: רכב என்பதன் காரணவினை வடிவம் மொர்தெகாயைக் குதிரையில் சவாரி செய்ய வைத்ததைச் சொல்கிறது. ‘ஏற்றி’ என்பது இதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בִּרְחוֹב הָעִיר
  choice: நகரத்தின் திறந்த வெளி வழியாக
  rationale: רְחוֹב என்பது சாதாரணத் தெருவைவிட நகரின் அகன்ற பொதுவெளி அல்லது சதுக்கத்தைக் குறிக்கலாம். ‘திறந்த வெளி’ அதன் பொதுமக்கள் கூடும் பரந்த இடப் பொருளைப் பாதுகாக்கிறது.
- source_word: וַיִּקְרָא לְפָנָיו
  choice: அவருக்கு முன்னால் ... அறிவித்துக்கொண்டே சென்றான்
  rationale: קרא இங்கு பொதுமக்களுக்கு உரத்துச் செய்யப்படும் அதிகாரபூர்வ அறிவிப்பு; לְפָנָיו இடவியல் பொருளைத் தீர்மானிக்காமல் ‘அவருக்கு முன்னால்’ எனப் பாதுகாக்கிறது.
- source_word: כָּכָה יֵעָשֶׂה
  choice: இப்படியே செய்யப்படும்
  rationale: எபிரெயின் சுட்டும் வலிமையையும் செயப்பாட்டு வடிவத்தையும் நவீன, கண்ணியமான தமிழில் காக்கிறது.
- source_word: לָאִישׁ אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: அரசர் கனப்படுத்த விரும்பும் மனிதருக்கு
  rationale: חפץ இங்கு விருப்பம் அல்லது மகிழ்ச்சியுடன் விரும்புதலைக் குறிக்கிறது; יקר மரியாதை அல்லது கனம் அளிப்பதைக் குறிக்கிறது. ‘கனப்படுத்த விரும்பும்’ என்பது நீதிமன்றச் சூழலுக்கு ஏற்ற சுருக்கமான தமிழ்.
