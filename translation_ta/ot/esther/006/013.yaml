base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
translation:
  language: ta
  text: ஆமான் தன் மனைவி செரேஷிடமும் தன் நண்பர்கள் அனைவரிடமும் தனக்கு நேர்ந்த எல்லாவற்றையும் விவரித்தான். அப்போது அவனுடைய ஞானிகளும் அவன் மனைவி செரேஷும் அவனிடம், “நீ யாருக்கு முன்பாக விழத் தொடங்கியிருக்கிறாயோ அந்த மொர்தெகாய் யூதர்களின் சந்ததியைச் சேர்ந்தவனாக இருந்தால்[a], உன்னால் அவனை வெல்ல முடியாது; அவனுக்கு முன்பாக நீ நிச்சயமாக விழுவாய்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடிப்படையாக, “யூதர்களின் விதையிலிருந்து வந்தவனாக இருந்தால்.”
    reason: זֶרַע என்ற எபிரெயச் சொல்லின் ‘விதை’ உருவகத்தைப் பாதுகாக்கும் சொல்லடிப்படையான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: விவரித்தான்
  rationale: நிகழ்ந்தவற்றை ஒன்றன்பின் ஒன்றாக எடுத்துரைத்தல் என்ற பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֹהֲבָיו
  choice: தன் நண்பர்கள் அனைவரிடமும்
  rationale: சொல்லடிப்படையில் ‘அவனை நேசித்தவர்கள்’ என்றாலும், இச்சூழலில் ஆமானின் நெருங்கிய சமூகத் தோழர்களைக் குறிப்பதால் ‘நண்பர்கள்’ இயல்பானது.
- source_word: כָּל אֲשֶׁר קָרָהוּ
  choice: தனக்கு நேர்ந்த எல்லாவற்றையும்
  rationale: קרהו என்பது ஒருவருக்கு நிகழ்ந்த அல்லது நேர்ந்தவற்றைக் குறிக்கிறது; ‘நேர்ந்த’ என்பது இங்குள்ள எதிர்மறை அனுபவத்தையும் நன்கு சுமக்கிறது.
- source_word: חֲכָמָיו
  choice: அவனுடைய ஞானிகள்
  rationale: எபிரெயச் சொல்லின் வடிவத்தைப் பாதுகாக்கிறது; பாரசீக அரசவையுடன் தொடர்புடைய ஆலோசகர்களையும் குறிக்கக்கூடிய சொல்லாக இது புரிந்துகொள்ளத்தக்கது.
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  choice: யூதர்களின் சந்ததியைச் சேர்ந்தவனாக இருந்தால்
  rationale: זֶרַע என்பதன் ‘விதை/சந்ததி’ என்ற வம்சப் பொருளை இயல்பான தமிழில் தருகிறது; சொல்லடிப்படையான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  choice: நீ யாருக்கு முன்பாக விழத் தொடங்கியிருக்கிறாயோ
  rationale: החל உடன் வரும் வினையெச்சம் வீழ்ச்சியின் தொடக்கத்தைச் சுட்டுகிறது; பின்னர் மீண்டும் வரும் ‘விழுவாய்’ என்பதோடு உள்ள சொல்லாட்சித் தொடர்பையும் காக்கிறது.
- source_word: לֹא תוּכַל לוֹ
  choice: உன்னால் அவனை வெல்ல முடியாது
  rationale: יכל + ל இச்சூழலில் எதிராளியை மேற்கொள்ள அல்லது வெல்ல இயலாமையைக் குறிக்கிறது; ‘வெல்ல முடியாது’ நவீன தமிழில் தெளிவானது.
- source_word: נָפוֹל תִּפּוֹל
  choice: நீ நிச்சயமாக விழுவாய்
  rationale: முற்றுவினைக்கு முன் வரும் infinitive absolute தரும் உறுதியான வலியுறுத்தலை ‘நிச்சயமாக’ வெளிப்படுத்துகிறது.
- source_word: לְפָנָיו
  choice: அவனுக்கு முன்பாக
  rationale: மொர்தெகாயுடன் தொடர்புடைய தோல்வி அல்லது தாழ்வைக் குறிக்கும் மீளுரையைச் சுருக்காமல் பாதுகாக்கிறது.
