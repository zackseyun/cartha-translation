  text: וַ/יֹּ֥אמֶר הָמָ֖ן אֶל הַ/מֶּ֑לֶךְ אִ֕ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/007.yaml
  text: And Haman said to the king[a], “For the man whom the king delights to honor—”
translation:
  language: ta
  text: ஆமான் அரசனிடம், “அரசர் யாரைக் கௌரவிக்க விரும்புகிறாரோ, அந்த மனிதனுக்கு[a]—” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மூலத்தை இன்னும் சொற்சார்பாக, “அரசர் கௌரவிக்க விரும்புகிற ஒரு மனிதன்” என்றும் மொழிபெயர்க்கலாம். אִישׁ என்பது ஆண்பால் ஒருமை; இங்கு அது குறிப்பிட்ட மனிதனையோ, அல்லது பொதுவாக ‘ஒரு மனிதன்’ என்பதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: தொடர்கதைச் சூழலில் வரும் உரையாடலை இயல்பான தமிழ் மேற்கோள் அமைப்பில் முடிக்கிறது; இணைப்பான வாவைத் தனியாக மொழிபெயர்க்காமல் கதைத் தொடர்ச்சியில் உணர்த்துகிறது.
- source_word: הָמָן
  choice: ஆமான்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
- source_word: אֶל־הַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: பேச்சு செலுத்தப்படும் நபரைத் தமிழில் இயல்பாகக் குறிக்கும் வடிவம்.
- source_word: אִישׁ אֲשֶׁר
  choice: யாரை ... அந்த மனிதனுக்கு
  rationale: எபிரெய மொழியின் ஆண்பால் ஒருமை உறவுத்தொடரை இயல்பான தமிழ் தொடர்பிணை அமைப்பாக வழங்குகிறது; அடுத்த வசனத்தில் தொடரும் கட்டளைக்கேற்ப ‘மனிதனுக்கு’ என அமைக்கப்பட்டுள்ளது.
- source_word: הַמֶּלֶךְ
  choice: அரசர்
  rationale: மேற்கோளுக்குள் ஆமானின் அரசமரியாதை நிறைந்த பேச்சை இயல்பாக வெளிப்படுத்த மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: חָפֵץ
  choice: விரும்புகிறாரோ
  rationale: இங்கு ஒருவர் கௌரவிக்கப்படுவதில் அரசனுக்கு உள்ள விருப்பம் அல்லது மகிழ்ச்சியைச் சுட்டுகிறது; தமிழில் ‘விரும்பு’ இயல்பாகவும் சூழலுக்கேற்றவாறும் உள்ளது.
- source_word: בִּיקָרוֹ
  choice: பெருமைப்படுத்த
  rationale: יְקָר என்பதன் அரசவைக் கௌரவம், மதிப்பு, சிறப்பு என்ற பொருளை இச்சூழலில் வினை வடிவில் இயல்பாக வழங்குகிறது.
