  text: בַּ/לַּ֣יְלָה הַ/ה֔וּא נָדְדָ֖ה שְׁנַ֣ת הַ/מֶּ֑לֶךְ וַ/יֹּ֗אמֶר לְ/הָבִ֞יא אֶת סֵ֤פֶר הַ/זִּכְרֹנוֹת֙ דִּבְרֵ֣י הַ/יָּמִ֔ים וַ/יִּהְי֥וּ נִקְרָאִ֖ים לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/001.yaml
  text: On that night the king could not sleep[a], so he ordered the book of records, the chronicles, to be brought[b], and they were read before the king.
translation:
  language: ta
  text: அந்த இரவில் அரசருக்குத் தூக்கம் வரவில்லை[a]. ஆகவே, நினைவுப் பதிவுகளின் நூலான நாளேடுகளைக் கொண்டுவரும்படி அவர் கட்டளையிட்டார்[b]. அவை அரசரின் முன்னிலையில் வாசிக்கப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “அரசரின் தூக்கம் விலகிப்போனது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நினைவுகளின் நூல், அதாவது நாளேடுகள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: அந்த இரவில்
  rationale: குறிப்பிட்ட அந்த இரவைச் சுட்டும் காலத் தொடரை இயல்பான நவீனத் தமிழில் துல்லியமாகத் தருகிறது.
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  choice: அரசருக்குத் தூக்கம் வரவில்லை
  rationale: சொல்லர்த்தமாக ‘அரசரின் தூக்கம் விலகிப்போனது’; அதன் பொருளை இயல்பான தமிழில் தெளிவாகக் கூறி, மூல உருவகத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: וַיֹּאמֶר
  choice: கட்டளையிட்டார்
  rationale: அடிப்படைப் பொருள் ‘சொன்னார்’ என்றாலும், இங்கு நூலைக் கொண்டுவருமாறு அரசர் பிறப்பித்த ஆணையைச் சூழல் தெளிவாகக் காட்டுகிறது.
- source_word: לְהָבִיא
  choice: கொண்டுவரும்படி
  rationale: கட்டளையின் உள்ளடக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; செயலை நிறைவேற்றும் பணியாளர்கள் மூலத்தில் குறிப்பிடப்படவில்லை.
- source_word: סֵפֶר הַזִּכְרֹנוֹת
  choice: நினைவுப் பதிவுகளின் நூல்
  rationale: நினைவில் வைத்திருக்கப் பாதுகாக்கப்பட்ட அதிகாரப்பூர்வப் பதிவுகள் என்ற கருத்தைத் தக்கவைக்கிறது.
- source_word: דִּבְרֵי הַיָּמִים
  choice: அரச நாளேடு
  rationale: நாட்களின் நிகழ்வுகள் அடங்கிய அரண்மனை ஆண்டு/நாள் பதிவைக் குறிக்கிறது; முன்னுள்ள தொடருக்கு விளக்கமான இணைப்பாக அமைந்துள்ளது.
- source_word: וַיִּהְיוּ נִקְרָאִים
  choice: அது ... வாசிக்கப்பட்டது
  rationale: எபிரெயத்தில் இலக்கண வடிவம் பன்மையாக இருப்பினும், தமிழில் ‘நூலாகிய அரச நாளேடு’ என்ற ஒருமைத் தலைப்பைத் தொடர்ந்து ஒருமை இயல்பாகிறது; வாசித்தல் தொடர்ந்த நிகழ்வாக இருந்ததைச் சூழல் அனுமதிக்கிறது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசருக்கு முன்பாக
  rationale: ‘அரசரின் முன்னிலையில்’ என்ற மூலப் பொருளைச் சுருக்கமாகவும் dignified தமிழிலும் தருகிறது; அவருக்குக் கேட்கும்படி வாசிக்கப்பட்டது என்பதும் சூழலால் விளங்குகிறது.
