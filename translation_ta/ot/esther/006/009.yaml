  text: וְ/נָת֨וֹן הַ/לְּב֜וּשׁ וְ/הַ/סּ֗וּס עַל יַד אִ֞ישׁ מִ/שָּׂרֵ֤י הַ/מֶּ֨לֶךְ֙ הַֽ/פַּרְתְּמִ֔ים וְ/הִלְבִּ֨ישׁוּ֙ אֶת הָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֣ץ בִּֽ/יקָר֑/וֹ וְ/הִרְכִּיבֻ֤/הוּ עַל הַ/סּוּס֙ בִּ/רְח֣וֹב הָ/עִ֔יר וְ/קָרְא֣וּ לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: ta
  text: அந்த ஆடையையும் குதிரையையும் அரசனுடைய உயர்குடி அதிகாரிகளில் ஒருவரிடம் ஒப்படைக்கட்டும். அரசன் கௌரவிக்க விரும்புகிற மனிதனுக்கு அவர்கள் அந்த ஆடையை அணிவித்து, அவனைக் குதிரைமேல் ஏற்றி, நகரத்தின் பொது வெளி வழியாகச் செல்லச் செய்யட்டும். அவனுக்கு முன்பாக, ‘அரசன் கௌரவிக்க விரும்புகிற மனிதனுக்கு இப்படியே செய்யப்படும்!’ என்று அறிவிக்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפַּרְתְּמִים
  choice: உயர்குடி அதிகாரிகள்
  rationale: இச்சொல் பாரசீக அரசவையின் உயர்நிலைப் பிரபுக்கள் அல்லது அதிகாரிகளைக் குறிக்கிறது; பதவிநிலையும் உயர்குடித் தன்மையும் இயல்பான தமிழில் வெளிப்பட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: பெருமைப்படுத்த விரும்புகிற
  rationale: חָפֵץ என்பது விருப்பம் அல்லது மகிழ்ச்சியுடன் விரும்புதலைக் குறிக்கிறது; יְקָר என்பது இங்கு வழங்கப்படும் கௌரவத்தைக் குறிக்கிறது. இயல்பான தமிழில் இரண்டையும் சேர்த்து இவ்வாறு வழங்கப்பட்டது.
- source_word: בִּרְחוֹב הָעִיר
  choice: நகரத்தின் திறந்த வெளி வழியாக
  rationale: רְחוֹב என்பது குறுகிய தெருவை மட்டுமல்ல, நகரின் அகன்ற பொது வெளியையோ சதுக்கத்தையோ குறிக்கலாம்; மூலத்தின் பரப்பான பொருளைத் தக்கவைக்கப்பட்டது.
- source_word: וְהִרְכִּיבֻהוּ עַל הַסּוּס
  choice: அவனைக் குதிரைமேல் ஏற்றி ... அழைத்துச் செல்லட்டும்
  rationale: வினைச்சொல் ஒருவரைக் குதிரையில் ஏறவைத்து சவாரி செய்யச் செய்வதைக் குறிக்கிறது; தமிழில் செயற்பாட்டின் தொடர்ச்சியை இயல்பாகக் காட்ட இவ்வாறு அமைக்கப்பட்டது.
- source_word: וְקָרְאוּ לְפָנָיו
  choice: அவனுக்கு முன்னால் ... அறிவிக்கட்டும்
  rationale: לְפָנָיו என்பதன் இடவியல் பொருளான ‘அவனுக்கு முன்னால்’ நேரடியாகப் பாதுகாக்கப்பட்டது; קרא இச்சூழலில் பொதுவெளிப் பிரகடனத்தைக் குறிக்கிறது.
