translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக் கண்ணியத்துக்கு ஏற்ற மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் கட்டளை/ஆலோசனைத் தொடர் ‘ஒப்படைக்கட்டும்... அணிவித்து... அழைத்துச் செல்லட்டும்... அறிவிக்கட்டும்’ என்ற வடிவில் பாதுகாக்கப்பட்டுள்ளது.
