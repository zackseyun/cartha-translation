  text: וַ/יִּמָּצֵ֣א כָת֗וּב אֲשֶׁר֩ הִגִּ֨יד מָרְדֳּכַ֜י עַל בִּגְתָ֣נָא וָ/תֶ֗רֶשׁ שְׁנֵי֙ סָרִיסֵ֣י הַ/מֶּ֔לֶךְ מִ/שֹּׁמְרֵ֖י הַ/סַּ֑ף אֲשֶׁ֤ר בִּקְשׁוּ֙ לִ/שְׁלֹ֣חַ יָ֔ד בַּ/מֶּ֖לֶךְ אֲחַשְׁוֵרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/002.yaml
  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
translation:
  language: ta
  text: மொர்தெகாய், அரசனின் இரு அரண்மனை அதிகாரிகளான பிக்தானா மற்றும் தேரேசு[a] குறித்து அறிவித்திருந்ததாக எழுதப்பட்டிருப்பது கண்டுபிடிக்கப்பட்டது. அவர்கள் வாசலைக் காத்தவர்களில் இருந்தவர்கள்[b]; அவர்கள் அகாஸ்வேரு அரசன்மேல் கை வைக்க முயன்றிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பிக்தானா என்பது இவ்வசனத்தில் உள்ள எபிரெயப் பெயர் வடிவம்; வேறு இடங்களில் இப்பெயர் பிக்தான் என்று வருகிறது.
    reason: பெயரின் மாற்று வடிவத்தைத் தெளிவுபடுத்துகிறது.
  - marker: b
    text: அரண்மனை அதிகாரிகள் என்பதற்கான எபிரெயச் சொல் குறிப்பாக அண்ணகர்கள் என்றும் பொருள்படலாம்.
    reason: எபிரெயச் சொல்லின் அரசவை அதிகாரி/அண்ணகர் என்னும் பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  choice: அதில் எழுதப்பட்டிருப்பது கண்டுபிடிக்கப்பட்டது
  rationale: எழுத்துப் பதிவில் அந்தச் செய்தி காணப்பட்டதை எபிரெய மொழியின் செயப்பாட்டு அமைப்புக்கு ஏற்ற இயல்பான தமிழில் தருகிறது; ‘அதில்’ என்பது முந்தைய வசனத்தில் வாசிக்கப்பட்ட நாள்குறிப்பைக் குறிக்கிறது.
- source_word: הִגִּיד
  choice: அறிவித்திருந்ததும்
  rationale: அரசவையின் அதிகாரப்பூர்வப் பதிவுச் சூழலில் ‘சொன்னான்’ என்பதைவிட ‘அறிவித்தான்’ பொருத்தமானது; முன்னர் நிகழ்ந்த செயலை ‘இருந்த’ வடிவம் காட்டுகிறது.
- source_word: עַל
  choice: குறித்து
  rationale: மொர்தெகாயின் அறிவிப்பின் பொருளைச் சுட்டுகிறது; ‘எதிராக’ என்று மொழிபெயர்த்து குற்றஞ்சாட்டும் நுட்பத்தை அளவுக்கு மீறித் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: בִּגְתָנָא וָתֶרֶשׁ
  choice: பிக்தானாவையும் தேரேசையும்
  rationale: இவ்வசனத்தின் எபிரெய வடிவமான בִּגְתָנָא என்பதைப் பின்பற்றி ‘பிக்தானா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  choice: அரசனுடைய அரண்மனை அதிகாரிகளில் இருவர்
  rationale: סָרִיסִים என்பது உடலியல் பொருளில் ‘அண்ணகர்கள்’ என்பதையும் பொதுவாக அரசவை அதிகாரிகள் என்பதையும் குறிக்கலாம். இங்கு உறுதியாகாத உடலியல் குறிப்பைத் திணிக்காமல் அரசவைப் பங்கை இயல்பான தமிழில் தருகிறது.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: வாசலைக் காவல்காத்தவர்களில் சேர்ந்தவர்கள்
  rationale: பகுதிப்பொருளைக் காட்டும் מִן என்பதையும், סַף குறிக்கும் வாசல்/வாசற்படி காவலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בִּקְשׁוּ
  choice: முயன்றதும்
  rationale: சதிச் சூழலில் நோக்கத்தோடு செயலில் இறங்கியதைக் காட்டுகிறது; முயற்சி வெற்றியடைந்ததாகச் சொல்லவில்லை.
- source_word: לִשְׁלֹחַ יָד
  choice: கை வைக்க
  rationale: பகைமையுடன் ஒருவருக்கு எதிராகக் கை நீட்டுதல் அல்லது தாக்குதல் என்னும் எபிரெய மரபுத்தொடரின் உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: בַּמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு அரசன்மேல்
  rationale: ‘கை வைக்க’ என்ற மரபுத்தொடருடன் இயல்பாக இணைந்து, செயல் அரசனுக்கு எதிரானது என்பதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: סָרִיסֵי என்பதன் குறிப்பான பொருள்
  choice: அரண்மனை அதிகாரிகள்
  alternative: அண்ணகர்கள்
  rationale: எபிரெயச் சொல் இரு பொருள்களையும் ஏற்கும். இச்சூழல் அவர்களது அரசவைப் பதவியை உறுதிப்படுத்தினாலும் உடலியல் நிலையைக் கட்டாயப்படுத்தாததால், பரந்த பொருள் முதன்மை உரையில் வைக்கப்பட்டு மற்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியத்தின் உறவுத் தொடர்கள் தமிழில் தெளிவாக அமைய ‘இருவரும்… சேர்ந்தவர்களுமான’ என்ற இணை அமைப்பு பயன்படுத்தப்பட்டது. வாசற்படியைச் சொற்சொல்லாக வழங்காமல் காவல் பணியைக் குறிக்கும் இயல்பான ‘வாசல்’ தேர்ந்தெடுக்கப்பட்டது.
