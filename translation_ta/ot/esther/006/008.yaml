  naturalness: ‘அரசர் சவாரி செய்ததும் அரச மகுடம் தலையில் வைக்கப்பட்டதுமான ஒரு குதிரை’ என்பது நவீன நிலையான தமிழில் இணையான உறவுத்தொடர்களைச் சரளமாகத் தருகிறது. ‘அவர்கள் கொண்டுவரட்டும்’ என்பது பன்மை இச்சை/கட்டளை நுணுக்கத்தைத் தெளிவுபடுத்துகிறது.
