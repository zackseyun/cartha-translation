base_translation:
  language: en
  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
translation:
  language: ta
  text: அரசர் அணிந்த அரச ஆடையையும், அரசர் சவாரி செய்ததும் அரச மகுடம் தலையில் வைக்கப்பட்டதுமான ஒரு குதிரையையும் அவர்கள் கொண்டுவரட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அவன்/அதன் தலையில்’ என்ற சுட்டுப்பெயர், தொடரமைப்பின்படி மிக இயல்பாகக் குதிரையைக் குறிக்கிறது; ஆனால் சிலர் அதை அரசரைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבִיאוּ
  choice: கொண்டுவரட்டும்
  rationale: ஹிஃபில் முற்றுப்பெறா வினையின் இச்சை/கட்டளை நுணுக்கத்தை, நேரடி உரையில் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְבוּשׁ מַלְכוּת
  choice: அரச உடை
  rationale: அரசாட்சியுடன் தொடர்புடைய சிறப்பு ஆடையைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  choice: அரசர் அணிந்த
  rationale: அந்த உடையை அரசரே அணிந்திருந்தார் என்ற அடையாளப்படுத்தும் உறவுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: וְסוּס
  choice: ஒரு குதிரை
  rationale: கட்டுருபு இல்லாத பெயர்ச்சொல் இரண்டாவது பொருளை அறிமுகப்படுத்துவதால் ‘ஒரு’ என்பது தமிழில் இயல்பானது.
- source_word: אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  choice: அரசர் ஏறிச் சென்றதும்
  rationale: அரசர் அந்தக் குதிரையில் சவாரி செய்தார் என்பதைத் தெளிவாகவும் தொடரின் இணை அமைப்பைத் தக்கவைத்தும் தெரிவிக்கிறது.
- source_word: כֶּתֶר מַלְכוּת
  choice: அரச மகுடம்
  rationale: அரசுரிமையுடன் தொடர்புடைய மகுடத்தை நவீன, கண்ணியமான தமிழில் குறிக்கிறது.
- source_word: בְּרֹאשׁוֹ
  choice: அதன் தலையில்
  rationale: அருகிலுள்ள ஆண்பால் ஒருமைப் பெயரான குதிரையையே சுட்டுப்பெயர் இயல்பாகக் குறிக்கிறது; அதே நேரத்தில் மூலத்தின் சுட்டுப்பெயர் வடிவம் வெளிப்படையாகத் தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: בְּרֹאשׁוֹ என்பதிலுள்ள மூன்றாம் நபர் ஒருமைச் சுட்டுப்பெயரின் குறிப்பு
  choice: ‘அதன்’ என்பது குதிரையைக் குறிக்கிறது
  alternative: அது அரசரைக் குறிக்கிறது
  rationale: உடனடியான தொடரமைப்பில் சுட்டுப்பெயருக்கு மிக அருகிலுள்ள பொருத்தமான முன்னிலைச் சொல் ‘குதிரை’; இருப்பினும் வேறு புரிதல் சாத்தியமுள்ளதால் அடிக்குறிப்பில் அது வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான நேரடி உரை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அரசர்’ என்பது இச்சூழலில் ராஜாவைக் குறிக்கும் இயல்பான மரியாதைச் சொல்; சுட்டுப்பெயரின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
