  edition: WLC
  text: וַ/יֵּצֵ֤א הָמָן֙ בַּ/יּ֣וֹם הַ/ה֔וּא שָׂמֵ֖חַ וְ/ט֣וֹב לֵ֑ב וְ/כִ/רְאוֹת֩ הָמָ֨ן אֶֽת מָרְדֳּכַ֜י בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ וְ/לֹא קָם֙ וְ/לֹא זָ֣ע מִמֶּ֔/נּוּ וַ/יִּמָּלֵ֥א הָמָ֛ן עַֽל מָרְדֳּכַ֖י חֵמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
translation:
  language: ta
  text: அன்று ஆமான் மகிழ்ச்சியுடனும் மனக்களிப்புடனும் வெளியே சென்றான். ஆனால் அரசனின் வாயிலில்[a] மொர்தெகாயைக் கண்டபோது, மொர்தெகாய் ஆமானுக்காக எழுந்து நிற்கவோ, அவனுக்கு முன்பாக நடுங்கவோ இல்லை என்பதைக் கண்டு, ஆமான் மொர்தெகாய்மேல் கடுங்கோபம் கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனின் வாயில் வளாகத்தில்.”
    reason: எபிரெயத்தில் உள்ள சொற்றொடர் அரசனின் வாயிலையோ அதனைச் சுற்றியுள்ள வாயில் வளாகத்தையோ குறிக்கலாம்.
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  choice: மகிழ்ச்சியுடனும் மனக்களிப்புடனும்
  rationale: இணையான எபிரெயச் சொற்றொடர் மிகுந்த மகிழ்ச்சியையும் உள்ளார்ந்த களிப்பையும் குறிக்கிறது; தமிழில் இயல்பாகவும் இரட்டைப் பொருள் வலிமையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: குறிப்பிட்ட அந்த நாளைக் குறிக்கும் காலச்சுட்டை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: அரசனின் அரண்மனை வாயிலில்
  rationale: שַׁעַר என்பது வெறும் கதவை அல்ல, அரசவைச் செயல்கள் நடைபெற்ற வாயில் வளாகத்தையும் குறிக்கலாம்; ‘அரண்மனை வாயில்’ தமிழில் சூழலைத் தெளிவுபடுத்துகிறது.
- source_word: וְלֹא קָם
  choice: எழுந்திருக்கவும் இல்லை
  rationale: இங்கு קום மரியாதை செலுத்துவதற்காக இருக்கையிலிருந்து எழும் சமூகச் செயலைக் குறிக்கிறது.
- source_word: וְלֹא זָע מִמֶּנּוּ
  choice: தனக்கு முன்பாக நடுங்கவும் இல்லை
  rationale: זוע என்பதன் ‘நடுங்குதல்/அச்சத்தால் அசைதல்’ என்ற வலிமையைத் தக்கவைக்கிறது; ஹாமானுக்கு முன் மொர்தெகாய் அச்சம் காட்டாத சூழலுக்கும் பொருந்துகிறது.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: கடுங்கோபம் கொண்டான்
  rationale: சொல்லுக்குச் சொல் ‘கோபத்தால் நிரம்பினான்’ என்பதற்குப் பதிலாக, தீவிரமான சினத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל מָרְדֳּכַי
  choice: மொர்தெகாய்மேல்
  rationale: கோபத்தின் இலக்கு மொர்தெகாய் என்பதை עַל தெளிவாகக் குறிக்கிறது.
