    issue: The main text renders בְּשַׁעַר הַמֶּלֶךְ as “அரசனின் அரண்மனை வாயிலில்.”
    rationale: ‘Palace’ is a plausible contextual inference, but it is not stated in the Hebrew. The direct expression ‘அரசனின் வாயிலில்’ preserves the source wording; the broader gate-complex sense may be placed in a note.
  - severity: medium
    issue: “அவன் எழுந்திருக்கவும் இல்லை, தனக்கு முன்பாக நடுங்கவும் இல்லை” has potentially unclear Tamil referents.
    rationale: The source’s pronouns refer to Mordecai’s refusal to rise or be shaken before Haman. Naming Mordecai and Haman in this clause preserves this relationship unambiguously.
  - severity: low
    issue: “என்பதால்” makes the preceding observation sound explicitly causal.
    rationale: The Hebrew construction presents Haman’s observation followed by his rage. “என்பதைக் கண்டு” more closely retains the observational sequence.
