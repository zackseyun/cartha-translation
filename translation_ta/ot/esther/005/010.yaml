translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தொடர்ச்சியான எபிரெய வினைகளைத் தமிழின் இயல்பான வினையெச்சத் தொடராக அமைத்து, கோபத்தை அடக்கிய பிரதிபெயர்ச்சிப் பொருளையும் வரவழைத்த காரணவினைப் பொருளையும் பாதுகாத்துள்ளது.
