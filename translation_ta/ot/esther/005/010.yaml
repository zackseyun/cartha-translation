base_translation:
  language: en
  yaml_path: translation/ot/esther/005/010.yaml
  text: But Haman restrained himself and went to his house[b][a]. Then he sent and brought in his friends and Zeresh his wife.
translation:
  language: ta
  text: ஆனால் ஆமான் தன்னைக் கட்டுப்படுத்திக்கொண்டு[a] தன் வீட்டுக்குச் சென்றான்[b]. பின்பு அவன் ஆளனுப்பித் தன் நண்பர்களையும் தன் மனைவி சேரேஷையும் வரவழைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன்னை அடக்கிக்கொண்டு” அல்லது “தன்னைத் தடுத்துக்கொண்டு.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வீட்டுக்குப் போனான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַפַּק
  choice: தன்னைக் கட்டுப்படுத்திக்கொண்டு
  rationale: התאפק என்பதன் பிரதிபெயர்ச்சிப் பொருள், முந்தைய சூழலில் எழுந்த கோபத்தை வெளிப்படுத்தாமல் ஆமான் தன்னையே அடக்கிக்கொண்டதைக் குறிக்கிறது; இத்தமிழாக்கம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: தன் வீட்டுக்குச் சென்றான்
  rationale: בוא + אֶל בֵּיתוֹ என்பது அவன் வீட்டை நோக்கிய இயக்கத்தைச் சொல்கிறது. ‘தன் வீட்டுக்குச் சென்றான்’ என்பது எபிரெய வடிவத்துக்கு நெருக்கமாகவும் தமிழில் இயல்பாகவும் உள்ளது.
- source_word: וַיִּשְׁלַח
  choice: ஆளனுப்பி
  rationale: எபிரெய வினைச்சொல் ‘அனுப்பினான்’ என்று மட்டும் கூறி அனுப்பப்பட்ட நபர் அல்லது செய்தியை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆட்களை வரவழைக்கும் சூழலில் ‘ஆளனுப்பி’ என்பது அந்தச் சுருக்கமான தொடர் செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיָּבֵא
  choice: வரவழைத்தான்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘வரச் செய்தான்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘வரவழைத்தான்’ என்பது வீட்டுக்குள் கூட்டிவரச் செய்த சூழலைத் துல்லியமாகத் தருகிறது.
- source_word: אֹהֲבָיו
  choice: தன் நண்பர்களை
  rationale: אהב வேரிலிருந்து வந்தாலும், இங்குள்ள பன்மைப் பெயர்ச்சொல் சமூக உறவிலுள்ள நண்பர்கள் அல்லது நெருங்கியவர்களைக் குறிக்கிறது; ‘நண்பர்கள்’ நவீனத் தமிழில் இயல்பான தெரிவு.
- source_word: זֶרֶשׁ אִשְׁתּוֹ
  choice: தன் மனைவி சேரேஷை
  rationale: தமிழில் உறவுமுறையையும் பெயரையும் தெளிவாக இணைக்கும் இயல்பான வரிசை இது. எபிரெயத்தில் பெயர் முதலில் வந்தாலும் பொருள் மற்றும் அடையாளம் முழுமையாகப் பாதுகாக்கப்படுகின்றன.
- source_word: וַ
  choice: ஆனால்
  rationale: இது கதைத் தொடர்ச்சிக்கான waw என்றாலும், முந்தைய வசனத்தில் ஆமான் கோபமடைந்ததற்கும் இங்கு தன்னை அடக்கிக்கொண்டதற்கும் இடையிலான மென்மையான எதிர்மறைத் தொடர்பை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
