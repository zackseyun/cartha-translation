  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ஆமானின் தன்னிலைப் பெருமிதம் உரையில் வெளிப்படுகிறது; ஆனால் மூலத்தில் நேரடியாக இல்லாத ‘தற்பெருமை பேசினான்’ போன்ற மதிப்பீட்டுச் சொற்கள் சேர்க்கப்படவில்லை. இணையான நான்கு கூறுகளும் ‘-ஐயும்/இருப்பதையும்/அனைத்தையும்/உயர்த்தியதையும்’ என்ற தொடரமைப்பில் பாதுகாக்கப்பட்டுள்ளன.
