  text: וַ/יְסַפֵּ֨ר לָ/הֶ֥ם הָמָ֛ן אֶת כְּב֥וֹד עָשְׁר֖/וֹ וְ/רֹ֣ב בָּנָ֑י/ו וְ/אֵת֩ כָּל אֲשֶׁ֨ר גִּדְּל֤/וֹ הַ/מֶּ֨לֶךְ֙ וְ/אֵ֣ת אֲשֶׁ֣ר נִשְּׂא֔/וֹ עַל הַ/שָּׂרִ֖ים וְ/עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
translation:
  language: ta
  text: ஆமான் தன் செல்வத்தின் மாட்சிமையையும்[a], தனக்கு ஏராளமான மகன்கள் இருப்பதையும்[b], அரசன் தன்னைப் பெரியவனாக்கச் செய்த அனைத்தையும்[c], அரசனுடைய அதிகாரிகளுக்கும் பணியாளர்களுக்கும் மேலாகத் தன்னை உயர்த்தியதையும்[d] அவர்களிடம் விவரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் செல்வத்தின் சிறப்பையும்.’ எபிரெயத் தொடர் ஆமானின் செல்வத்துடன் தொடர்புடைய மகத்துவத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, ‘தன் மகன்களின் பெருந்தொகையையும்.’ எபிரெயம் பொதுவாகப் ‘பிள்ளைகள்’ என்று அல்ல, குறிப்பாக ‘மகன்கள்’ என்று கூறுகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அரசன் தன்னை உயர்ந்த நிலைக்குக் கொண்டுவந்த அனைத்தையும்.’
    reason: lexical_alternative
  - marker: d
    text: அல்லது, ‘அரசனுடைய அதிகாரிகளையும் பணியாளர்களையும் விடத் தன்னை உயர்ந்தவனாக்கியதையும்.’ இது மற்றவர்களுக்கு மேலான பதவி உயர்வைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: விவரித்தான்
  rationale: இந்த வினைச்சொல் ஆமான் தன்னுடைய செல்வம், குடும்பம், பதவி ஆகியவற்றைப் பற்றி விரிவாக எடுத்துரைத்ததைக் குறிக்கிறது. ‘விவரித்தான்’ என்பது இயல்பான நவீனத் தமிழில் அந்தக் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: כְּבוֹד עָשְׁרוֹ
  choice: தன் செல்வத்தின் மாட்சிமை
  rationale: כָּבוֹד என்பது இங்கு செல்வத்தோடு தொடர்புடைய பெருமை, சிறப்பு, பகட்டு ஆகியவற்றைக் குறிக்கிறது. ‘மாட்சிமை’ மூலத்தின் வலிமையைத் தக்கவைத்தபடி செல்வத்தின் கண்ணைக் கவரும் பெருமையை உணர்த்துகிறது.
- source_word: רֹב בָּנָיו
  choice: தனக்கு ஏராளமான மகன்கள் இருப்பது
  rationale: רֹב மிகுதி அல்லது பெருந்தொகையைக் குறிக்கிறது; בָּנִים குறிப்பாக ‘மகன்கள்’ என்பதால் பொதுவான ‘பிள்ளைகள்’ என்று மாற்றப்படவில்லை. பெயர்ச்சொல் தொடரை இயல்பான தமிழ்ச் சொல்லாக்கமாக மாற்றியுள்ளது.
- source_word: גִּדְּלוֹ
  choice: தன்னைப் பெரியவனாக்கிய
  rationale: גדל என்பதன் தீவிர வினைவடிவம் ஒருவரைப் பெரியவராக அல்லது உயர்ந்த நிலையில் ஆக்குதல் என்ற காரணப் பொருளைக் கொண்டுள்ளது. ‘பெரியவனாக்கிய’ என்பது அரசனின் செயற்பாட்டையும் மூலத்தின் நேரடியான உருவகத்தையும் காக்கிறது.
- source_word: נִשְּׂאוֹ עַל
  choice: மேலாகத் தன்னை உயர்த்திய
  rationale: נשא உடன் עַל வருவது மற்றவர்களைவிடப் பதவியில் உயர்த்தியதைக் குறிக்கிறது. இந்தத் தமிழாக்கம் உயர்வையும் ஒப்பீட்டு அதிகார நிலையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: பாரசீக அரசவைச் சூழலில் שָׂרִים என்பது ஆட்சிப் பொறுப்பிலுள்ள அதிகாரிகளைக் குறிக்கிறது. ‘அதிகாரிகள்’ என்பது மரபுவழிப் பிரபுக்களை மட்டும் சுட்டாத தெளிவான நவீனச் சொல்.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: அரசனுடைய பணியாளர்கள்
  rationale: இங்கு עֲבָדִים அரசனுக்குச் சேவை செய்யும் அரசவைப் பணியாளர்களைக் குறிக்கிறது. சூழலுக்குப் பொருந்தாத அடிமைத்தன அர்த்தத்தைத் தேவையின்றி முன்னிறுத்தாமல் ‘பணியாளர்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
