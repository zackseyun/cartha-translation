translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. அரசவைக் காட்சிக்கேற்ற ‘அரசி’, ‘அரசன்’, ‘பொற்செங்கோல்’ ஆகிய சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. எபிரெய மொழிமரபின் உருவகத்தை முற்றிலும் அழிக்காமல் தெளிவுபடுத்த அடிக்குறிப்பு வழங்கப்பட்டுள்ளது.
