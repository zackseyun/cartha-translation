base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
translation:
  language: ta
  text: அரசி எஸ்தர் முற்றத்தில்[a] நிற்பதை அரசன் கண்டபோது, அரசனின் பார்வையில் அவள் தயவு பெற்றாள்.[b] அரசன் தன் கையிலிருந்த பொற்செங்கோலை எஸ்தரை நோக்கி நீட்டினான். எஸ்தர் அருகில் வந்து செங்கோலின் முனையைத் தொட்டாள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரண்மனை முற்றத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்கு சொல்: “அவனுடைய கண்களில் அவள் தயவைச் சுமந்தாள்”; அதாவது, அவனுடைய சாதகமான பார்வையைப் பெற்றாள்.'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “செங்கோலின் மேற்பகுதியைத் தொட்டாள்.” எபிரெயத்தில், “செங்கோலின் தலையை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹת
  choice: கண்டபோது
  rationale: וַיְהִי + infinitive construct இங்குக் காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான கதைநடைக்காக ‘கண்டபோது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: அரசி எஸ்தர்
  rationale: எபிரெயத்தில் பெயருக்குப் பின் பட்டம் வந்தாலும், நவீனத் தமிழில் ‘அரசி எஸ்தர்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עֹמֶדֶת בֶּחָצֵר
  choice: முற்றத்தில் நிற்பதை
  rationale: עֹמֶדֶת எஸ்தரின் நிலையைச் சுட்டுகிறது; חָצֵר என்பது சூழலுக்கு ஏற்ப முற்றம் அல்லது அரண்மனை முற்றம் எனப் பொருள்படும்.
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  choice: அவள் அவனுடைய பார்வையில் தயவு பெற்றாள்
  rationale: ‘அவனுடைய கண்களில் தயவைச் சுமந்தாள்’ என்ற சொற்படிமத்தைத் தமிழில் புரியத்தக்கவாறு வழங்கி, பார்வை சார்ந்த எபிரெய மொழிமரபையும் ஓரளவு காக்கிறது.
- source_word: וַיּוֹשֶׁט
  choice: நீட்டினான்
  rationale: ஒருவரை நோக்கி ஓர் பொருளை நீட்டுவதைக் குறிக்கும் வினைக்கு இயல்பான நேரடி தமிழ் இணை.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: பொற்செங்கோல்
  rationale: அரச அதிகாரத்தின் அடையாளமான பொன்னாலான கோலைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ் சொல்.
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: தன் கையிலிருந்த
  rationale: அரசன் கையில் வைத்திருந்த குறிப்பிட்ட செங்கோலைச் சுருக்கமாகவும் தெளிவாகவும் அடையாளப்படுத்துகிறது.
- source_word: וַתִּקְרַב
  choice: அருகில் வந்து
  rationale: அரசனின் செயலுக்குப் பதிலாக எஸ்தர் நெருங்கிச் சென்றதைக் கதைநடையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט
  choice: செங்கோலின் முனையைத் தொட்டாள்
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; செங்கோல் போன்ற பொருளில் தமிழ் வழக்கில் ‘முனை’ என்பது இயல்பானது. ‘மேற்பகுதி’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் மாற்று தரப்பட்டுள்ளது.
