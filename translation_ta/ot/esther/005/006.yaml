base_translation:
  language: en
  yaml_path: translation/ot/esther/005/006.yaml
  text: And the king said to Esther at the wine banquet[a], “What is your petition? It will be granted to you. And what is your request? Even up to half the kingdom[b], it will be done.”
translation:
  language: ta
  text: திராட்சரச விருந்தில் அரசன் எஸ்தரிடம், “உன் விண்ணப்பம் என்ன? அது உனக்குக் கொடுக்கப்படும்.[a] உன் வேண்டுகோள் என்ன? அது அரசாட்சியின் பாதிவரை[b] இருந்தாலும், நிறைவேற்றப்படும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது உனக்கு வழங்கப்படும்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அரசாட்சியின் பாதிவரை”; “என் அரசாட்சியின்” என்று வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: திராட்சரச விருந்தின்போது
  rationale: מִשְׁתֶּה என்பது பருகுதலுடன் கூடிய விருந்து; הַיַּיִן அதைத் திராட்சரச விருந்தாகக் குறிப்பாக்குகிறது. இத்தொடர் இயல்பான நவீனத் தமிழில் நிகழ்வின் சூழலைத் தெளிவாகத் தருகிறது.
- source_word: שְּׁאֵלָתֵךְ
  choice: உன் விண்ணப்பம்
  rationale: இங்கு שאל என்பதிலிருந்து வந்த பெயர்ச்சொல் ஒரு கேள்வியை அல்ல, அதிகாரியிடம் முன்வைக்கும் கோரிக்கையைக் குறிக்கிறது. அரசவைக் சூழலில் ‘விண்ணப்பம்’ பொருத்தமானது; அடுத்துள்ள בַּקָּשָׁה என்பதிலிருந்தும் ஓரளவு வேறுபடுத்துகிறது.
- source_word: וְיִנָּתֵן לָךְ
  choice: அது உனக்குக் கொடுக்கப்படும்
  rationale: נתן என்பதன் நிஃபால் வடிவை நேரடியாகப் பாதுகாக்கும் இயல்பான தமிழ். சூழலில் இது விண்ணப்பம் ஏற்றுக்கொள்ளப்படும் என்ற அரசனின் உறுதியைக் குறிக்கிறது.
- source_word: בַּקָּשָׁתֵךְ
  choice: உன் வேண்டுகோள்
  rationale: בַּקָּשָׁה என்பது நாடப்படும் கோரிக்கை அல்லது விருப்பம். ‘வேண்டுகோள்’ என்பது இயல்பாக இருப்பதோடு שְׁאֵלָה என்பதற்கு பயன்படுத்திய ‘விண்ணப்பம்’ என்பதிலிருந்து மென்மையான சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: அரசாட்சியின் பாதிவரை கேட்டாலும்
  rationale: எபிரெயத்தில் ‘என்’ என்ற உடைமைச்சொல் இல்லை; ஆகவே அதைச் சேர்க்கவில்லை. עַד என்பதன் எல்லையைக் குறிக்கும் வலிமையும், இது அரசனின் மிகைப்படுத்திய உறுதிமொழி என்பதும் தமிழில் ‘பாதிவரை கேட்டாலும்’ என இயல்பாக வெளிப்படுகின்றன.
- source_word: וְתֵעָשׂ
  choice: அது நிறைவேற்றப்படும்
  rationale: עשה என்பதன் இச்சூழலுக்குரிய பொருள் வேண்டுகோள் செயலாக்கப்பட்டு நிறைவேற்றப்படுவது. ‘நிறைவேற்றப்படும்’ என்பது செயலின் மறைமுக வடிவையும் அரசனின் உறுதியையும் இயல்பான தமிழில் தருகிறது.
