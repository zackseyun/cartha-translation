translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயச் சொல் இணையின் வேறுபாட்டைக் காக்க שְׁאֵלָה என்பதற்கு ‘விண்ணப்பம்,’ בַּקָּשָׁה என்பதற்கு ‘வேண்டுகோள்’ பயன்படுத்தப்பட்டன. நேரடி உரையில் அரசன் எஸ்தரை ஒருமையில் அழைப்பதால் ‘உன்/உனக்கு’ பயன்படுத்தப்பட்டது.
