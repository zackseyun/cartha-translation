base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
translation:
  language: ta
  text: அரசரின் கண்களில் எனக்குத் தயவு கிடைத்திருந்தால்[a], என் விண்ணப்பத்தை அருளவும் என் வேண்டுகோளை நிறைவேற்றவும் அரசருக்கு விருப்பமாயிருந்தால், அரசரும் ஆமானும் அவர்களுக்காக நான் ஏற்பாடு செய்யும் விருந்துக்கு வரவேண்டும். நாளை அரசரின் சொல்லின்படி செய்வேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான மரபுத்தொடரில், “அரசரின் தயவு எனக்குக் கிடைத்திருந்தால்.”
    reason: lexical_alternative
  - marker: b
    text: இது எபிரெயில், “அரசரின் சொல்லின்படி செய்வேன்” என்று உள்ளது. அரசர் கேட்டுக்கொண்டபடி எஸ்தர் மறுநாள் தன் விண்ணப்பத்தைத் தெரிவிப்பார் என்பதே இதன் சூழல்சார் பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  choice: அரசரின் கண்களில் எனக்குத் தயவு கிடைத்திருந்தால்
  rationale: ‘கண்களில்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, ஒருவரின் சாதகமான பார்வையைப் பெற்றிருப்பதைக் குறிக்கும் அரசவை மொழிநடையை வெளிப்படுத்துகிறது.
- source_word: עַל הַמֶּלֶךְ טוֹב
  choice: அரசருக்கு விருப்பமாயிருந்தால்
  rationale: சொல்லுக்குச் சொல் ‘அரசருக்கு நன்றாயிருந்தால்’ என்பதற்குப் பதிலாக, அரசருக்கு ஏற்றதாகவும் விருப்பமானதாகவும் இருப்பதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לָתֵת אֶת שְׁאֵלָתִי
  choice: என் விண்ணப்பத்தை அருளவும்
  rationale: ‘கொடுத்தல்’ என்ற மூல வினையின் அரசவைச் சூழலுக்குரிய பொருளை ‘அருளுதல்’ இயல்பாக வெளிப்படுத்துகிறது; שְׁאֵלָה என்பதற்கு முறையான ‘விண்ணப்பம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  choice: என் வேண்டுகோளை நிறைவேற்றவும்
  rationale: எபிரெயில் உள்ள ‘செய்தல்’ என்பதைத் தமிழில் வேண்டுகோளுடன் இயல்பாக இணையும் ‘நிறைவேற்றுதல்’ என மொழிபெயர்த்து, இணையான இரு பெயர்ச்சொற்களின் வேறுபாட்டையும் பேணுகிறது.
- source_word: יָבֹא
  choice: வரவேண்டும்
  rationale: வடிவில் நிறைவுறா வினையாக இருந்தாலும், இங்கு மரியாதையான அழைப்பு அல்லது வேண்டுகோளைக் குறிக்கும் சூழல்சார் வலிமையை வெளிப்படுத்துகிறது.
- source_word: הַמִּשְׁתֶּה
  choice: விருந்து
  rationale: குடிப்பையும் உள்ளடக்கக்கூடிய விருந்தைக் குறிக்கும் சொல்லுக்கு, அரசவைச் சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ள பொதுத் தமிழ் இணை இது.
- source_word: אֲשֶׁר אֶעֱשֶׂה לָהֶם
  choice: அவர்களுக்காக நான் ஏற்பாடு செய்யும்
  rationale: விருந்தை ‘செய்தல்’ என்ற எபிரெய வழக்கைத் தமிழில் இயல்பாக ‘ஏற்பாடு செய்தல்’ என வழங்குகிறது.
- source_word: וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  choice: நாளை அரசரின் சொல்லின்படி செய்வேன்
  rationale: எஸ்தர் நாளை தன் விண்ணப்பத்தைத் தெரிவிப்பார் என்பது சூழலில் சாத்தியமானாலும், மூலத்தின் சற்றே விடுபட்ட, திறந்த சொற்றொடரை விளக்கிச் சுருக்காமல் அப்படியே பேணுகிறது.
