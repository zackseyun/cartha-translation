translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய மரியாதையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘விண்ணப்பம் / வேண்டுகோள்’ என்ற இரட்டைச் சொற்கள் மூலத்தின் இணையானதாயினும் வேறுபட்ட பெயர்ச்சொற்களைப் பிரதிபலிக்கின்றன. இறுதி வாக்கியத்தின் எபிரெயத் தெளிவின்மை விளக்கவுரையால் தீர்க்கப்படாமல் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளது.
