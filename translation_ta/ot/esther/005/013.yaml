translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஒரு பொருட்டாகவே இல்லை’ என்பது மூலத்தின் மதிப்பு/பயன் சார்ந்த மொழிநடையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; குறிப்புகள் மூலத்தில் உள்ள சொற்பொருள் மாற்றுவாய்ப்புகளைப் பாதுகாக்கின்றன.
