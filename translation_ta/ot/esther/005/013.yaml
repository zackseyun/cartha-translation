  text: Yet all this is worth nothing to me whenever I see Mordecai the Jew sitting at the king’s gate[a][b].
translation:
  language: ta
  text: ஆனாலும், யூதனாகிய மொர்தெகாய் அரசரின் வாசலில் அமர்ந்திருப்பதை நான் காணும் போதெல்லாம், இவை அனைத்தும் எனக்கு ஒரு பொருட்டாகவே இல்லை.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும், யூதனாகிய மொர்தெகாய் அரசரின் வாசலில் அமர்ந்திருப்பதை நான் காணும் ஒவ்வொரு முறையும், இவை அனைத்தும் எனக்கு மதிப்பில்லாதவையாக இருக்கின்றன.”
    reason: lexical_alternative
  - marker: b
    text: “யூதனாகிய” என்பதை “யூதா நாட்டைச் சேர்ந்த” என்றும் மொழிபெயர்க்கலாம்; இங்கு பாரசீக அரசவைச் சூழலில் மொர்தெகாயின் யூத இன அடையாளமே பெரும்பாலும் வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל זֶה
  choice: ஆனாலும், இவை அனைத்தும்
  rationale: וְ என்பது பொதுவாக ‘மேலும்/மற்றும்’ என்று பொருள்படலாம்; ஆனால் ஆமான் முன்பு பெருமையாகக் கூறிய அனைத்துக்கும் இப்போது சொல்லப்படுவது முரணாக இருப்பதால், ‘ஆனாலும்’ என்பது சூழலின் எதிர்மறைத் திருப்பத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  choice: எனக்கு ஒரு பொருட்டாகவே இல்லை
  rationale: שׁוה என்பதன் மதிப்பு அல்லது பயன் சார்ந்த பொருளையும், ஆமானின் பார்வையில் அவனுடைய சிறப்புகள் அனைத்தும் ஒன்றுமில்லாதவையாகிவிடுகின்றன என்பதையும் இந்தத் தமிழ் மரபுத்தொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּ/כָל עֵת אֲשֶׁר
  choice: போதெல்லாம்
  rationale: ‘ஒவ்வொரு முறையும்’ என்ற மீண்டும் நிகழும் காலப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: רֹאֶה
  choice: நான் காணும்
  rationale: אֲנִי உடன் வரும் பங்கேற்புவினை தொடர்ச்சியாக அல்லது மீண்டும் நிகழும் பார்வையைக் குறிக்கிறது; ‘போதெல்லாம்’ என்பதுடன் ‘காணும்’ இயல்பாக இணைகிறது.
- source_word: מָרְדֳּכַי
  choice: மொர்தெகாய்
  rationale: எபிரெய தனிப்பெயரின் பரவலாக அறியப்பட்ட தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַיְּהוּדִי
  choice: யூதனாகிய
  rationale: பாரசீக அரண்மனைச் சூழலில் மொர்தெகாயின் யூத இன அடையாளத்தை இச்சொல் முதன்மையாக வலியுறுத்துகிறது.
- source_word: יוֹשֵׁב
  choice: அமர்ந்திருப்பதை
  rationale: மொர்தெகாயின் நிலை அல்லது இருப்பிடத்தை விவரிக்கும் பங்கேற்புவினையின் நேரடியான பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בְּ/שַׁעַר הַמֶּלֶךְ
  choice: அரசரின் வாசலில்
  rationale: அரச நிர்வாகத்துடன் தொடர்புடைய அரண்மனை வாசல் பகுதியைக் குறிக்கிறது; ‘வாசலில்’ என்பது இடப்பொருளை இயல்பாகத் தருகிறது.
