base_translation:
  language: en
  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
translation:
  language: ta
  text: அப்போது ஆமான், “உண்மையில், எஸ்தர் அரசி ஏற்பாடு செய்த விருந்துக்கு[a] என்னைத் தவிர வேறு யாரையும் அரசருடன் வரவழைக்கவில்லை; நாளையும் நான் அரசருடன் அவளால் அழைக்கப்பட்டுள்ளேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விருந்துணவுக்கு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் מִשְׁתֶּה விருந்தை, குறிப்பாகப் பானம் பரிமாறப்படும் விருந்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அவளால் அழைக்கப்பட்டவனாக இருக்கிறேன்.’ இச்சூழலில் இது விருந்துக்கு அழைக்கப்பட்டிருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: தொடர்கதை நிகழ்வின் அடுத்த கட்டத்தை இயல்பான நவீனத் தமிழில் காட்டுகிறது.
- source_word: אַף לֹא
  choice: ஆம், ... வேறு யாரையும் ... இல்லை
  rationale: ஆமானின் தற்பெருமை நிறைந்த வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֵבִיאָה
  choice: வரவழைக்கவில்லை
  rationale: எபிரெய வினையின் ‘வரச் செய்தல்’ என்ற அடிப்படைப் பொருளையும் விருந்து சூழலில் உள்ள அழைப்பின் கருத்தையும் ஒருங்கே தக்கவைக்கிறது.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: எஸ்தர் அரசி
  rationale: பெயரையும் அரச பட்டத்தையும் இயல்பான தமிழ் வரிசையில் தருகிறது.
- source_word: אֶל הַמִּשְׁתֶּה
  choice: விருந்துக்கு
  rationale: அரண்மனைச் சூழலில் மִשְׁתֶּה குறிக்கும் விருந்து அல்லது விருந்துணவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: தான் ஏற்பாடு செய்த
  rationale: சொல்லுக்குச் சொல் ‘செய்த’ என்பதை விருந்து நடத்தும் சூழலுக்கு ஏற்ற தமிழில் வழங்குகிறது; ‘தான்’ ஆமானின் வலியுறுத்தலையும் தொடர்கிறது.
- source_word: כִּי אִם אוֹתִי
  choice: என்னைத் தவிர வேறு யாரையும்
  rationale: விலக்கைக் குறிக்கும் எபிரெய அமைப்பைத் தெளிவான தமிழில் பிரதிபலிக்கிறது.
- source_word: וְגַם לְמָחָר
  choice: நாளையும்
  rationale: காலக் குறிப்பையும் கூடுதல் வலியுறுத்தலையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: קָרוּא לָהּ
  choice: அவளால் அழைக்கப்பட்டிருக்கிறேன்
  rationale: சொல்லுக்குச் சொல் ‘அவளால் அழைக்கப்பட்டவன்’ என்ற கருத்தை விருந்து அழைப்புக்குரிய இயல்பான தமிழில் தருகிறது.
- source_word: עִם הַמֶּלֶךְ
  choice: அரசருடன்
  rationale: ஆமான் அரசரோடு சேர்ந்து கலந்துகொள்வதைக் குறிக்கும் முன்னிடைச்சொல் தொடரை நேரடியாக வழங்குகிறது.
