  source_fidelity: மூல எபிரெயத்தின் பேச்சாளர்கள், ஐம்பது முழ உயரம், அரசரிடம் தெரிவித்து மொர்தெகாயை மர அமைப்பில் தண்டிக்கக் கோருதல், விருந்துக்குச் செல்லுதல், ஆமானின் ஒப்புதல் மற்றும் அமைப்பை ஏற்படுத்துதல் ஆகிய கருத்துகள் வரைவில் பாதுகாக்கப்பட்டுள்ளன. ஆனால் வினைமுறைகள் நவீனத் தமிழில் எதிர்காலமாகவும் பழைய ஏவல் வடிவமாகவும் படிக்கக்கூடியதால், மூலத்தின் ஆலோசனை/ஏவல் தொனி தெளிவாக்கப்பட வேண்டும். ‘பிடித்திருந்தது’ மூலத்தின் எளிய இறந்தகாலத்துக்குப் பதிலாகத் தேவையற்ற முன்இறந்தகால நிழலைத் தருகிறது.
  naturalness: ‘அமைக்கச் செய்யும்’, ‘தூக்கிலிடச் செய்யும்’, ‘போகும்’ என்பவை இச்சூழலில் நவீன நிலையான தமிழில் தெளிவற்ற ஏவல் வடிவங்கள். ‘...செய்யுங்கள்’, ‘போங்கள்’ என்பவை இயல்பாகவும் தெளிவாகவும் உள்ளன. ‘பிடித்தது’ என்பதும் நேரடியான நடை.
  terminology: ‘மரத்தூண்’ என்பது עֵץ என்பதன் வடிவ/தண்டனைமுறை உறுதியின்மையைத் திறந்தவாறே காக்கும் ஏற்ற தேர்வு. ‘தூக்கிலிடுதல்’ முதன்மை உரையில் புரியக்கூடியது; ‘கழுவேற்றுதல்’ மாற்று வாசிப்பாக அடிக்குறிப்பில் இருக்க வேண்டும். அடிக்குறிப்பு a-இல் ‘கொலைத் தண்டனை அமைப்பு’ என்பது கொலைக்கான தண்டனை என்று தவறாகப் புரியலாம்; ‘மரணதண்டனைக்கான மர அமைப்பு’ எனத் திருத்தப்பட்டுள்ளது. அளவு அடிக்குறிப்பு எண்ணளவுடன் நேரடியாக இணைக்கப்பட்டுள்ளது.
