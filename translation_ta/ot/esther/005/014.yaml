base_translation:
  language: en
  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
translation:
  language: ta
  text: அப்போது அவனுடைய மனைவி சேரேஷும் அவனுடைய நண்பர்கள் அனைவரும் அவனிடம், “ஐம்பது முழம்[b] உயரமுள்ள ஒரு மரத்தூணை[a] அமைக்கச் செய்யுங்கள். காலையில் ராஜாவிடம் சொல்லி, மொர்தெகாயை அதில் தூக்கிலிடச் செய்யுங்கள்[c]. பிறகு மகிழ்ச்சியுடன் ராஜாவோடு விருந்துக்குப் போங்கள்” என்றார்கள். அந்த ஆலோசனை ஆமானுக்குப் பிடித்தது; அவன் அந்த மரத்தூணை அமைக்கச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் ‘மரம்,’ ‘மரக்கம்பம்,’ அல்லது மரத்தால் செய்யப்பட்ட மரணதண்டனைக்கான அமைப்பு எனப் பொருள்படலாம்; அதன் துல்லிய வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ஐம்பது முழம் என்பது ஏறத்தாழ 23 மீட்டர் (75 அடி).
    reason: cultural_note
  - marker: c
    text: அல்லது, “மொர்தெகாயை அதில் கழுவேற்றச் செய்யுங்கள்.” எபிரெய வாசகம் மரத்தாலான ஓர் அமைப்பில் தொங்கவிடுவதையோ கழுவேற்றுவதையோ குறிக்கலாம்; தண்டனை நிறைவேற்றப்பட்ட துல்லிய முறை விவாதத்திற்குரியது.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  choice: அவனுடைய நண்பர்கள்
  rationale: சொல்லாட்சியில் ‘அவனை நேசித்தவர்கள்’ என்றாலும், அரசவைச் சூழலில் ஆமானோடு நெருக்கமாக இருந்த தோழர்களையோ ஆதரவாளர்களையோ குறிக்கிறது; ‘நண்பர்கள்’ இயல்பான நவீனத் தமிழ்.
- source_word: יַעֲשׂוּ
  choice: அமைக்கச் செய்யும்
  rationale: குறிப்பிடப்படாத பன்மைச் செய்பவர்களைக் கொண்ட ஆலோசனைத் தொனியை, தமிழில் இயல்பான காரணவினை வடிவம் வெளிப்படுத்துகிறது.
- source_word: עֵץ
  choice: மரத்தூண்
  rationale: எபிரெயச் சொல் மரம், மரப்பொருள், அல்லது மரத்தால் செய்யப்பட்ட கொலை/காட்சிப்படுத்தும் அமைப்பு ஆகியவற்றைக் குறிக்கலாம். குறுக்குச்சட்டமுள்ள நவீனத் தூக்குமேடையை உறுதிப்படுத்தாமல் இருக்க ‘மரத்தூண்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: ஐம்பது முழம் உயரமுள்ள
  rationale: பண்டைய அளவான ‘முழம்’ மூலத்தில் உள்ளபடியே வைக்கப்பட்டு, நவீன அளவு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּבַבֹּקֶר
  choice: காலையில்
  rationale: எபிரெய மூலத்தின் நேரக் குறிப்பை ‘நாளைக் காலை’ என்று வெளிப்படையாகச் சேர்க்காமல் இயல்பாக வழங்குகிறது.
- source_word: אֱמֹר לַמֶּלֶךְ
  choice: ராஜாவிடம் சொல்லி
  rationale: ‘ராஜாவிடம் சொல்’ என்ற நேரடியான பொருளைப் பாதுகாக்கிறது; ‘கேள்’ என்ற விளக்கத்தை வினைக்குள் சேர்க்கவில்லை.
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  choice: மொர்தெகாயை அதில் தூக்கிலிடச் செய்யும்
  rationale: குறிப்பிடப்படாத பன்மைச் செய்பவர்களை தமிழில் காரணவினையாக இயல்பாகக் காட்டுகிறது. தொங்கவிடுதலா கழுவேற்றுதலா என்பது உறுதியற்றதால் மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וּבֹא עִם־הַמֶּלֶךְ אֶל־הַמִּשְׁתֶּה
  choice: ராஜாவோடு விருந்துக்குப் போகும்
  rationale: அரச விருந்துச் சூழலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׂמֵחַ
  choice: மகிழ்ச்சியுடன்
  rationale: ஆமான் விருந்துக்குச் செல்லும் மனநிலையைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן
  choice: அந்த ஆலோசனை ஆமானுக்குப் பிடித்திருந்தது
  rationale: ‘அந்தக் காரியம் அவன் பார்வையில் நன்றாயிருந்தது’ என்ற எபிரெய மொழிவழக்கின் இயல்பான தமிழ் பொருள்.
- source_word: וַיַּעַשׂ הָעֵץ
  choice: அவன் அந்த மரத்தூணை அமைக்கச் செய்தான்
  rationale: தனிப்பட்ட முறையில் கட்டினான் என்று தேவையின்றி வலியுறுத்தாமல், ஆமான் அதை ஏற்பாடு செய்தான் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: மொர்தெகாய்க்குத் திட்டமிடப்பட்ட மரணதண்டனையின் துல்லிய முறை
  choice: முதன்மை உரையில் ‘தூக்கிலிடச் செய்யும்’; அமைப்புக்கு ‘மரத்தூண்’
  alternative: ‘கழுவேற்றச் செய்யும்’ அல்லது ‘தூக்குமரம்’
  rationale: תלה மற்றும் עֵץ ஆகியவை தொங்கவிடுதல், மரத்தூணில் ஏற்றுதல், அல்லது கொன்றபின் காட்சிப்படுத்துதல் ஆகியவற்றில் எதைக் குறிப்பதாகும் என்பது விவாதத்திற்குரியது. முதன்மை உரை பரவலாகப் புரியும் மொழியைப் பயன்படுத்தி, உறுதியின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். பாரசீக அரசவைச் சூழலுக்கு ஏற்றவாறு ‘ராஜா’ பயன்படுத்தப்பட்டது. ஆலோசனைத் தொனிக்கு மரியாதை/ஏவல் வினைமுற்றான ‘செய்யும், போகும்’ பயன்படுத்தப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
