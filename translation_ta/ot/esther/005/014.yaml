  revised_text: அப்போது அவனுடைய மனைவி சேரேஷும் அவனுடைய நண்பர்கள் அனைவரும் அவனிடம், “ஐம்பது முழம்[b] உயரமுள்ள ஒரு மரத்தூணை[a] அமைக்கச் செய்யுங்கள். காலையில் ராஜாவிடம் சொல்லி, மொர்தெகாயை அதில் தூக்கிலிடச் செய்யுங்கள்[c]. பிறகு மகிழ்ச்சியுடன் ராஜாவோடு விருந்துக்குப் போங்கள்” என்றார்கள். அந்த ஆலோசனை ஆமானுக்குப் பிடித்தது; அவன் அந்த மரத்தூணை அமைக்கச் செய்தான்.
