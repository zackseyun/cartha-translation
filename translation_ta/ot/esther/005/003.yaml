base_translation:
  language: en
  yaml_path: translation/ot/esther/005/003.yaml
  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
translation:
  language: ta
  text: அப்போது ராஜா அவளிடம், “என்ன விஷயம், எஸ்தர் அரசியே?[a] உன் வேண்டுகோள்[b] என்ன? அரசாட்சியின் பாதிவரைகூட[c] உனக்குக் கொடுக்கப்படும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்ன கவலை, எஸ்தர் அரசியே?” எபிரெய மரபுத்தொடர் எழுத்துப்படி, “உனக்கு என்ன?” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விண்ணப்பம்.”
    reason: lexical_alternative
  - marker: c
    text: இது தாராளமாக அளிப்பதாகக் கூறும் வழக்கமான அரசவைக் கூற்று; அரசாட்சியை உண்மையில் பாதியாகப் பிரித்துக் கொடுப்பதாக அவசியம் பொருளல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் இயல்பான நிகழ்வரிசையை ‘அப்போது’ காட்டுகிறது.
- source_word: לָהּ
  choice: அவளிடம்
  rationale: முன்னிடைச்சொல்லையும் பெண்பால் ஒருமை பின்னொட்டையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַמֶּלֶךְ
  choice: ராஜா
  rationale: குறிப்பிட்ட ஆண் அரசரைக் குறிக்கும் சொல்லுக்கு இச்சூழலில் இயல்பான தமிழ்ச் சொல்.
- source_word: מַה לָּךְ
  choice: என்ன வேண்டும்
  rationale: எழுத்துப்படி ‘உனக்கு என்ன?’ என்ற எபிரெய மரபுத்தொடர், அவளுடைய கவலை அல்லது விருப்பம் என்ன என்று கேட்கிறது. அரசவைக் சூழலில் ‘என்ன வேண்டும்?’ இயல்பாக உள்ளது; அதன் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: எஸ்தர் அரசியே
  rationale: பெயரையும் அரசப் பட்டத்தையும் தக்கவைத்து, நேரடி அழைப்பைத் தமிழின் விளிவேற்றுமையால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: உன் வேண்டுகோள் என்ன
  rationale: בַּקָּשָׁה என்பது வேண்டுகோள் அல்லது விண்ணப்பம்; ‘வேண்டுகோள்’ நவீன வாசகருக்குப் புரியக்கூடியதுடன் அரசவைச் சூழலுக்கும் பொருந்துகிறது.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: அரசாட்சியில் பாதிவரைகூட
  rationale: ராஜா வழங்க முன்வரும் உச்ச அளவைத் தெரிவிக்கிறது. ‘அரசாட்சி’ என்பது இங்கு ஆட்சிக்குட்பட்ட ராஜ்யத்தைக் குறிக்கிறது; ‘வரைகூட’ தாராளமான வாக்குறுதியின் வலியுறுத்தலைக் காக்கிறது.
- source_word: וְיִנָּתֵן לָךְ
  choice: உனக்குக் கொடுக்கப்படும்
  rationale: נתן என்பதன் நிஃபால் முற்றுப்பெறா வடிவம் இங்கு செயல்படுபவர் வெளிப்படாத வாக்குறுதியாக உள்ளது; தமிழின் செயப்பாட்டு வடிவம் அதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அரசாட்சியில் பாதிவரை’ என்ற வாக்குறுதியின் இயல்பு
  choice: மூலத்தின் மிகைப்படுத்திய அரசவைக் கூற்றை正文த்தில் அப்படியே தக்கவைத்தல்
  alternative: ராஜா எஸ்தரின் எந்த வேண்டுகோளையும் நிறைவேற்றுவார் என்று பொருளை மட்டும் வெளிப்படையாகச் சொல்லுதல்
  rationale: இது சொல்லாட்சியில் தாராள வாக்குறுதியாக இருந்தாலும், அரசாட்சியை உண்மையில் இரண்டாகப் பிரிப்பதாக அவசியம் பொருள்படாது. மூல உருவகத்தை உரையில் காத்து, பண்பாட்டுச் சூழலை அடிக்குறிப்பில் விளக்குவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான அரசவை நடையைப் பயன்படுத்துகிறது. ‘ராஜா’ மற்றும் ‘அரசி’ ஆகியவை பொதுவாக அறியப்பட்ட இயல்பான சொற்கள். மூலத்தின் கேள்வி–வாக்குறுதி அமைப்பும், செயப்பாட்டு வினையும், மரபுத்தொடரின் நுணுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
