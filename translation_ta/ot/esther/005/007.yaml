  yaml_path: translation/ot/esther/005/007.yaml
  text: Then Esther answered and said[a], “My petition and my request are:”
translation:
  language: ta
  text: 'அப்போது எஸ்தர் மறுமொழியாகச் சொன்னாள்: “என் விண்ணப்பமும் என் வேண்டுகோளும் இதுதான்:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַן
  choice: அப்போது ... மறுமொழியாக
  rationale: வாவ் தொடர்வினை கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; ענה என்பதன் பேச்சுக்குப் பதிலளிக்கும் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶסְתֵּר
  choice: எஸ்தர்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַתֹּאמַר
  choice: சொன்னது
  rationale: எபிரெய மொழியின் ‘மறுமொழியாகச் சொன்னாள்’ என்ற இரட்டைச் சொல்லாட்சியில் உள்ள இரு வினைகளையும் தமிழில் இயன்றவரை தக்கவைக்கிறது.
- source_word: שְׁאֵלָתִי
  choice: என் விண்ணப்பம்
  rationale: இச்சூழலில் இது கேள்வியைக் காட்டிலும் அரசனிடம் முன்வைக்கப்படும் முறையான கோரிக்கையைக் குறிக்கிறது; ‘விண்ணப்பம்’ அந்த மன்றச்சூழலையும் பணிவான முறையீட்டையும் வெளிப்படுத்துகிறது.
- source_word: וּבַקָּשָׁתִי
  choice: என் வேண்டுகோள்
  rationale: בַּקָּשָׁה என்பது கோரிக்கை அல்லது மன்றாட்டைக் குறிக்கிறது; இணையாக வரும் இரு பெயர்ச்சொற்களின் நுண்ணிய வேறுபாட்டை ‘விண்ணப்பம்—வேண்டுகோள்’ என்ற இணை காக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் முறையான இணைச்சொல் அமைப்பு காக்கப்பட்டுள்ளது; அடுத்த வசனத்தில் நிறைவுபெறும் வாக்கியம் என்பதால் இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
