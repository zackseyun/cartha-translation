    issue: Relative verb form in ‘ஆயத்தம் செய்திருக்கும்’
    rationale: The Hebrew עָשִׂיתִי is a completed action (‘I prepared/made’). ‘ஆயத்தம் செய்திருக்கும்’ can carry a ‘will have prepared’ or ‘presumably prepared’ sense in Tamil. ‘ஏற்பாடு செய்த’ naturally expresses the completed preparation of a banquet.
