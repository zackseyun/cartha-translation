translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக்குரிய மரியாதைத் தொனியைப் பேணும் வகையில் ‘அரசருக்கு விருப்பமானால்’ என்றும், பணிவான அழைப்பை ‘வரட்டும்’ என்றும் வழங்கப்பட்டுள்ளது. ஒருமைச் சுட்டின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
