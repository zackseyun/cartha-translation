  text: וַ/תֹּ֣אמֶר אֶסְתֵּ֔ר אִם עַל הַ/מֶּ֖לֶךְ ט֑וֹב יָב֨וֹא הַ/מֶּ֤לֶךְ וְ/הָמָן֙ הַ/יּ֔וֹם אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשִׂ֥יתִי לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/004.yaml
  text: Esther said[a], “If it pleases the king[b], let the king and Haman come today to the banquet that I have prepared for him.”
translation:
  language: ta
  text: எஸ்தர், “அரசருக்கு விருப்பமானால், அரசரும் ஆமானும் இன்று நான் அவருக்காக[a] ஏற்பாடு செய்த விருந்துக்கு வரட்டும்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவருக்காக” என்பது எபிரெய மொழியில் ஒருமையில் உள்ளது; ஆமானும் அழைக்கப்பட்டிருந்தாலும், இது அரசரையே குறிப்பதாகத் தோன்றுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: அரசருக்கு விருப்பமானால்
  rationale: அரசரின் ஒப்புதலைப் பணிவுடன் கோரும் எபிரெய அரசவை மரபுத்தொடரின் பொருளையும் தொனியையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָבוֹא
  choice: வரட்டும்
  rationale: வடிவில் முற்றுப்பெறாத வினையாக இருந்தாலும், இச்சூழலில் பணிவான வேண்டுகோள் அல்லது அழைப்பைக் குறிக்கும் விருப்பவினை வலிமையைத் தருகிறது.
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: அரசரும் ஆமானும்
  rationale: மூலத்தில் அரசரின் பெயர் சேர்க்கப்படாமல் பட்டம் மீண்டும் பயன்படுத்தப்படுவதால், அதையே தமிழிலும் பாதுகாக்கிறது.
- source_word: הַיּוֹם
  choice: இன்று
  rationale: அழைப்பின் உடனடித் தன்மையை இயல்பாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: הַמִּשְׁתֶּה
  choice: விருந்து
  rationale: மது அருந்துதலையும் உட்படுத்தக்கூடிய அரச விருந்தைக் குறிக்கும் சொல்லுக்கு, சூழலுக்கு ஏற்ற இயல்பான தமிழ்ச் சொல்.
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  choice: நான் அவருக்காக ஆயத்தம் செய்திருக்கும்
  rationale: விருந்துடன் வரும் עָשָׂה என்பதற்கு ‘ஆயத்தம் செய்தல்’ இயல்பான தமிழ். לוֹ ஒருமையாக இருப்பதால், இருவரையும் அழைத்தாலும் அது அரசரையே குறிப்பதாகத் தோன்றும் ஒருமைச் சுட்டு பாதுகாக்கப்படுகிறது.
