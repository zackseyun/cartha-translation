translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக் கதைநடைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘எஸ்தரின் சொல்’ என்ற நேரடி வடிவம் தமிழில் தெளிவின்றி இருப்பதால், சூழலில் உறுதியாகத் தெரியும் ‘வேண்டுகோள்’ என வழங்கப்பட்டது.
