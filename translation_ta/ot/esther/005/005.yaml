base_translation:
  language: en
  yaml_path: translation/ot/esther/005/005.yaml
  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
translation:
  language: ta
  text: அப்போது அரசன், “எஸ்தரின் வேண்டுகோளை நிறைவேற்ற[a] ஆமானை விரைவாக அழைத்து வாருங்கள்” என்றான். அரசனும் ஆமானும் எஸ்தர் ஏற்பாடு செய்திருந்த விருந்துக்கு வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எஸ்தரின் சொல்லின்படி செய்ய.” எபிரேயத்தில் நேரடியாக, “எஸ்தரின் சொல்லைச் செய்ய” என்று உள்ளது; “சொல்” என்பது அவர் தெரிவித்த வேண்டுகோளையையோ அறிவுறுத்தலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ אֶת הָמָן
  choice: ஆமானை விரைவாக அழைத்து வாருங்கள்
  rationale: מַהֲרוּ என்பது பணியாளர்கள் பலரிடம் சொல்லப்பட்ட பன்மை ஏவல்; ஆமானை உடனடியாக வரச்செய்ய வேண்டும் என்பதே சூழல்சார் பொருள். தமிழில் இயல்பாகவும் அவசரத்தைக் காக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לַעֲשׂוֹת אֶת דְּבַר אֶסְתֵּר
  choice: எஸ்தரின் வேண்டுகோளை நிறைவேற்ற
  rationale: דְּבַר என்பதன் நேர்பொருள் ‘சொல்/காரியம்’; இங்கு எஸ்தர் முன்வைத்த வேண்டுகோளைச் சுட்டுகிறது. ‘நிறைவேற்ற’ என்பது לַעֲשׂוֹת-இன் நோக்கத்தையும் அரசவைக் கட்டளையின் இயல்பையும் தெளிவாகத் தருகிறது.
- source_word: וַיָּבֹא
  choice: வந்தார்கள்
  rationale: בוא என்பது பார்வைக்கோணத்திற்கேற்ப ‘வருதல்/செல்லுதல்’ என அமையும். விருந்து இலக்காகக் கூறப்பட்டுள்ள இக்கதைநடையில் ‘வந்தார்கள்’ இயல்பானது; எபிரேய ஒருமை வினை, இணைந்த எழுவாயை முன்னிட்டு வருவது தமிழில் பன்மையாக வழங்கப்படுகிறது.
- source_word: הַמִּשְׁתֶּה
  choice: விருந்து
  rationale: מִשְׁתֶּה என்பது பானத்துடன் கூடிய விருந்து அல்லது விருந்துபசாரத்தைக் குறிக்கும். அரசச் சூழலுக்கு ஏற்ற, பொதுவாகப் புரியும் நவீனத் தமிழ் சொல் ‘விருந்து’.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: எஸ்தர் ஏற்பாடு செய்திருந்த
  rationale: விருந்துடன் வரும் עשה, அதை ஆயத்தம் செய்தல் அல்லது ஏற்பாடு செய்தல் என்ற பொருளுடையது. அவர்கள் வருவதற்கு முன்பே அது ஏற்பாடு செய்யப்பட்டிருந்ததை ‘செய்திருந்த’ காட்டுகிறது.
