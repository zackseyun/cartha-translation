base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: On the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
translation:
  language: ta
  text: மூன்றாம் நாளில், எஸ்தர் அரச உடைகளை[a] அணிந்துகொண்டு, அரசனுடைய அரண்மனையின் உள்முற்றத்தில், அரச மாளிகைக்கு எதிரே நின்றாள். அப்போது அரசன், அரச மாளிகையில்[b] அதன் நுழைவாயிலுக்கு எதிரே தன் அரச அரியணையில் அமர்ந்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேர்ப்பொருளாக, ‘அரசத்தன்மையை அணிந்துகொண்டாள்’; அதாவது, அரச உடை அல்லது அரச அணிகலன்களை அணிந்தாள்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெயச் சொல் ‘வீடு’ என்றும் பொருள்படும்; அரசவைச் சூழலில் அது ‘மாளிகை’ அல்லது ‘அரண்மனை’யைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: தனி இணைப்புச் சொல் இன்றி தொடரும் காலவாக்கியம்
  rationale: இந்த வடிவம் கதைப்போக்கில் அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. நவீன தமிழில் ‘அப்பொழுது நடந்ததாவது’ போன்ற கனமான சொற்றொடர் தேவையில்லை; ‘மூன்றாம் நாளில்’ என்ற தொடக்கம் இயல்பாகக் கதைத் தொடர்ச்சியைத் தருகிறது.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: மூலத்தின் காலக் குறிப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת
  choice: எஸ்தர் அரச உடைகளை அணிந்துகொண்டு
  rationale: מַלְכוּת என்பதன் நேர்ப்பொருள் ‘அரசத்தன்மை/அரசாட்சி’ என்றாலும், இச்சூழலில் அரச அணிகலன் அல்லது அரச உடையைக் குறிக்கும் மரபுத்தொடர். தமிழில் ‘அரச உடைகள்’ தெளிவாகவும், அளவுக்கு மீறிய விளக்கமின்றியும் உள்ளது.
- source_word: וַתַּעֲמֹד
  choice: நின்றாள்
  rationale: எளிய கதை வினைக்கு இயல்பான தமிழ் இணை.
- source_word: בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית
  choice: அரசனுடைய அரண்மனையின் உள்முற்றத்தில்
  rationale: חָצֵר என்பது முற்றம் அல்லது பிராகாரம்; பொதுவாசகருக்கு ‘உள்முற்றம்’ இயல்பானதும் அரண்மனை அமைப்பைத் தெளிவுபடுத்துவதுமாகும். בֵּית־הַמֶּלֶךְ இச்சூழலில் அரண்மனையைக் குறிக்கிறது.
- source_word: נֹכַח בֵּית הַמֶּלֶךְ
  choice: அரச மாளிகைக்கு எதிரே
  rationale: נֹכַח குறிக்கும் எதிர்நிலை அல்லது முகநோக்கிய அமைப்பை ‘எதிரே’ சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: அப்போது அரசன் ... அமர்ந்திருந்தான்
  rationale: இந்த உட்பிரிவு எஸ்தர் நிற்கும் வேளையில் அரசன் அமர்ந்திருந்த பின்னணிச் செயலைக் குறிக்கிறது. ‘அப்போது’ மற்றும் தொடர்நிலை வினை ஒரேகால நிகழ்வை இயல்பான தமிழில் தெரிவிக்கின்றன.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: தன் அரச அரியணையில்
  rationale: சொற்றொடர் அரசனுடைய அரச மரியாதைக்குரிய அரியணையைக் குறிக்கிறது; ‘அரச அரியணை’ இயல்பான தமிழ்.
- source_word: בְּבֵית הַמַּלְכוּת
  choice: அரச மாளிகையில்
  rationale: நேரடியாக ‘அரசாட்சியின் வீட்டில்’ என்று மொழிபெயர்ப்பதைவிட, அரசவைச் சூழலில் கட்டடத்தைக் குறிக்கும் பொருளை ‘அரச மாளிகை’ தெளிவாகத் தருகிறது.
- source_word: נֹכַח פֶּתַח הַבָּיִת
  choice: அதன் நுழைவாயிலுக்கு எதிரே
  rationale: அரியணை மாளிகையின் நுழைவாயிலை எதிர்நோக்கியிருந்த இடவமைப்பைத் தெளிவாகக் காட்டுகிறது; ‘அதன்’ என்பது தமிழில் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
