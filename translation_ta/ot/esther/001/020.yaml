base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
translation:
  language: ta
  text: அரசர் பிறப்பிக்கும் ஆணை அவருடைய பேரரசு முழுவதும் கேட்கப்படும்போது—அது பரந்தது—எல்லாப் பெண்களும் தங்கள் கணவர்களுக்கு, பெரியவர் முதல் சிறியவர் வரை, மதிப்புக் கொடுப்பார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆணை’ என்பதற்கு ‘அரச அறிவிப்பு’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அதிகாரபூர்வமான அரச பிரகடனத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மதிப்புக் கொடுப்பார்கள்’ என்பதற்கு ‘மரியாதை காட்டுவார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַע
  choice: கேள்விப்படும்போது
  rationale: நிஃபால் வடிவத்தின் செயப்பாட்டு கருத்தையும், அதைத் தொடர்ந்து வரும் விளைவுக்கான காலச் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פִּתְגָם
  choice: ஆணை
  rationale: பாரசீக அரசவைச் சூழலில் இது அதிகாரபூர்வமான அரச அறிவிப்பைக் குறிக்கிறது; நவீன தமிழில் ‘ஆணை’ இயல்பாகவும் முறையாகவும் உள்ளது.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: பிறப்பிக்கும்
  rationale: ‘செய்’ என்ற அடிப்படைப் பொருளை அப்படியே மொழிபெயர்ப்பதைவிட, அரசாணையுடன் இயல்பாக இணையும் ‘பிறப்பிக்கும்’ என்பது இச்சூழலின் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: அவருடைய பேரரசு முழுவதும்
  rationale: அரசாட்சியின் முழுப் பரப்பிலும் செய்தி பரவுவதைக் குறிக்கிறது; எஸ்தர் நூலின் பாரசீகப் பின்னணியில் ‘பேரரசு’ பொருத்தமானது.
- source_word: כִּי רַבָּה הִיא
  choice: அது பரந்த பேரரசு
  rationale: רַבָּה இங்கு அரசின் மிகுந்த பரப்பைச் சுட்டுகிறது. தமிழில் குறிப்புப்பெயர்ச்சொல்லின் தொடர்பைத் தெளிவாக்க ‘பேரரசு’ மீண்டும் சொல்லப்பட்டுள்ளது.
- source_word: וְכָל הַנָּשִׁים
  choice: எல்லாப் பெண்களும்
  rationale: எபிரெய உரையின் பொதுவான பன்மையைப் பேணுகிறது; அடுத்துள்ள ‘தங்கள் கணவர்களுக்கு’ என்பது திருமண உறவைத் தெளிவாக்குகிறது.
- source_word: יִתְּנוּ יְקָר
  choice: மதிப்புக் கொடுப்பார்கள்
  rationale: ‘மதிப்பு/கனம் கொடுத்தல்’ என்ற எபிரெய மரபுத்தொடரை இயல்பான நவீன தமிழில் நெருக்கமாகத் தருகிறது.
- source_word: לְבַעְלֵיהֶן
  choice: தங்கள் கணவர்களுக்கு
  rationale: בעל என்பதற்கு வேறு சூழல்களில் ‘எஜமான்/உரிமையாளர்’ என்ற பொருள் இருந்தாலும், இக்குடும்பச் சூழலில் ‘கணவர்’ என்பதே தெளிவான பொருள்.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: பெரியவர்முதல் சிறியவர்வரை
  rationale: சமூக நிலையின் முழு வரம்பையும் குறிக்கும் எபிரெய மரபுத்தொடரைச் சுருக்கமாகவும் நெருக்கமாகவும் தருகிறது.
