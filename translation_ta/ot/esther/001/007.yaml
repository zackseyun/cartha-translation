- from: பானங்கள் பொற்கிண்ணங்களில் பரிமாறப்பட்டன; ஒவ்வொரு கிண்ணமும் மற்றொன்றிலிருந்து வேறுபட்டிருந்தது. அரசனின் தாராளத்திற்கேற்ப அரச மதுவும் மிகுதியாக இருந்தது.
  to: பானங்கள் பொன் பாத்திரங்களில் பரிமாறப்பட்டன; பாத்திரங்கள் ஒவ்வொன்றும் மற்றொன்றிலிருந்து வேறுபட்டவையாக இருந்தன. அரசனின் தாராளத்திற்கேற்ப அரச மதுவும் மிகுதியாக இருந்தது.
