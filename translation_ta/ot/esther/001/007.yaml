source:
  edition: WLC
  text: וְ/הַשְׁקוֹת֙ בִּ/כְלֵ֣י זָהָ֔ב וְ/כֵלִ֖ים מִ/כֵּלִ֣ים שׁוֹנִ֑ים וְ/יֵ֥ין מַלְכ֛וּת רָ֖ב כְּ/יַ֥ד הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: ta
  text: பானங்கள் பொன் பாத்திரங்களில் பரிமாறப்பட்டன; பாத்திரங்கள் ஒவ்வொன்றும் மற்றொன்றிலிருந்து வேறுபட்டவையாக இருந்தன. அரசனின் தாராளத்திற்கேற்ப அரச மதுவும் மிகுதியாக இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְׁקוֹת
  choice: பானங்கள் பரிமாறப்பட்டன
  rationale: இச்சொல் குடிக்கச் செய்வதையோ பானம் வழங்குவதையோ குறிக்கிறது. விருந்துச் சூழலில் இயல்பான தமிழாக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בִּכְלֵי זָהָב
  choice: பொற்கிண்ணங்களில்
  rationale: כְּלִי என்பது பாத்திரம் என்ற பொதுப்பொருள் கொண்டாலும், பானம் வழங்கப்படும் சூழலில் ‘கிண்ணங்கள்’ இயல்பாக உள்ளது.
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים
  choice: ஒவ்வொரு கிண்ணமும் மற்றொன்றிலிருந்து வேறுபட்டிருந்தது
  rationale: பாத்திரங்கள் ஒன்றுக்கொன்று வேறுபட்டிருந்தன என்ற எபிரெயச் சொல்லமைப்பின் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וְיֵין מַלְכוּת
  choice: அரச மது
  rationale: இது அரசனுக்குரிய அல்லது அரசவைக்குரிய மதுவைக் குறிக்கிறது; ‘அரச மது’ மூலத்தின் சுருக்கத்தையும் ambiguity-யையும் காக்கிறது.
- source_word: רָב
  choice: மிகுதியாக
  rationale: மதுவின் பெருமளவைக் குறிக்கும் இயல்பான தமிழ்.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: அரசனின் தாராளத்திற்கேற்ப
  rationale: ‘அரசனின் கைக்கு ஏற்ப’ என்ற மொழிவழக்கு இங்கு அவனுடைய வளமான கொடை அல்லது தாராளத்தைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், விருந்தின் செழுமையை dignified ஆகவும் எளிதில் புரியுமாறும் வெளிப்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் மூன்று இணை கூறுகளும் காக்கப்பட்டுள்ளன.
