  text: אִם עַל הַ/מֶּ֣לֶךְ ט֗וֹב יֵצֵ֤א דְבַר מַלְכוּת֙ מִ/לְּ/פָנָ֔י/ו וְ/יִכָּתֵ֛ב בְּ/דָתֵ֥י פָֽרַס וּ/מָדַ֖י וְ/לֹ֣א יַעֲב֑וֹר אֲשֶׁ֨ר לֹֽא תָב֜וֹא וַשְׁתִּ֗י לִ/פְנֵי֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וּ/מַלְכוּתָ/הּ֙ יִתֵּ֣ן הַ/מֶּ֔לֶךְ לִ/רְעוּתָ֖/הּ הַ/טּוֹבָ֥ה מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
translation:
  language: ta
  text: அரசருக்கு இது நலமாகத் தோன்றினால்[a], அவரிடமிருந்து ஓர் அரச கட்டளை பிறப்பிக்கப்பட்டு, அது பெர்சியா மற்றும் மேதியாவின் சட்டங்களில் எழுதப்படட்டும்; அது ரத்து செய்யப்படாதிருக்கட்டும்[b]. அந்தக் கட்டளையின்படி, வஸ்தி அகாஸ்வேரு அரசரின் முன்னிலைக்கு வரக்கூடாது; மேலும், அரசர் அவளுடைய அரசி பதவியை[c] அவளைவிடச் சிறந்த வேறொரு பெண்ணுக்குக் கொடுக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசருக்கு விருப்பமானால்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அது மாற்றப்படாதிருக்கட்டும்” அல்லது “அது மீறப்படாதிருக்கட்டும்.” எபிரெய மரபுத்தொடர் அந்தக் கட்டளையின் நிலையான சட்ட வலிமையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “அவளுடைய அரசாட்சி” அல்லது “அவளுடைய அரச நிலை.” இங்கு அது அரசியாக அவள் வகித்த பதவியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: அரசருக்கு இது நலமாகத் தோன்றினால்
  rationale: அரசரின் ஒப்புதலை மரியாதையுடன் கோரும் அரசவை வழக்கைத் தமிழில் இயல்பாகவும், טוֹב என்பதன் ‘நலம்/நன்று’ என்ற கருத்துக்கு நெருக்கமாகவும் தெரிவிக்கிறது.
- source_word: יֵצֵא דְבַר מַלְכוּת מִלְּפָנָיו
  choice: அவரிடமிருந்து ஓர் அரச கட்டளை பிறப்பிக்கப்படட்டும்
  rationale: דְבַר מַלְכוּת என்பது சாதாரண சொல் அல்ல, அதிகாரபூர்வமான அரசாணை. מִלְּפָנָיו அரசரின் முன்னிலையிலிருந்தும் அதிகாரத்திலிருந்தும் அது வெளியாவதைக் குறிக்கிறது.
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי
  choice: அது பெர்சியா மற்றும் மேதியாவின் சட்டங்களில் எழுதப்படட்டும்
  rationale: அந்த அரச கட்டளை அங்கீகரிக்கப்பட்ட சட்டத் தொகுப்பில் அதிகாரபூர்வமாகப் பதிவுசெய்யப்படுவதைத் தெளிவாகக் காட்டுகிறது; எபிரெய வரிசையும் காக்கப்படுகிறது.
- source_word: וְלֹא יַעֲבוֹר
  choice: அதை ரத்துசெய்ய முடியாதிருக்கட்டும்
  rationale: சட்டச் சூழலில் இந்த மரபுத்தொடர் கட்டளையை நீக்கவோ செல்லாததாக்கவோ முடியாத நிலையான சட்ட வலிமையைக் குறிக்கிறது.
- source_word: אֲשֶׁר לֹא תָבוֹא וַשְׁתִּי לִפְנֵי הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அந்தக் கட்டளையின்படி, வஸ்தி அகாஸ்வேரு அரசரின் முன்னிலைக்கு வரக்கூடாது
  rationale: אֲשֶׁר தொடங்கும் பகுதி கட்டளையின் உள்ளடக்கத்தை அளிக்கிறது. ‘வரக்கூடாது’ தடைப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது; மூலத்தில் இல்லாத ‘மீண்டும்’ சேர்க்கப்படவில்லை.
- source_word: וּמַלְכוּתָהּ
  choice: அவளுடைய அரசி பதவி
  rationale: இங்கு מַלְכוּת என்பது நிலப்பரப்பான அரசைக் குறிக்காமல், வஸ்தியின் அரச நிலை அல்லது அரசி பொறுப்பைக் குறிக்கிறது.
- source_word: לִרְעוּתָהּ הַטּוֹבָה מִמֶּנָּה
  choice: அவளைவிடச் சிறந்த வேறொரு பெண்ணுக்கு
  rationale: רְעוּתָהּ என்பதன் அடிப்படைப் பொருள் அவளுடன் தொடர்புடைய மற்றொரு பெண்/தோழி; மாற்று அரசியைத் தேர்ந்தெடுக்கும் சூழலில் ‘வேறொரு பெண்’ இயல்பானது. הַטּוֹבָה מִמֶּנָּה கூறும் மதிப்பீட்டை கூடுதல் ஒழுக்க விளக்கமின்றி ‘அவளைவிடச் சிறந்த’ எனப் பாதுகாக்கிறது.
