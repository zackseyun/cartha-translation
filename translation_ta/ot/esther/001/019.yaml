translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அரசவை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அரச கட்டளை,’ ‘சட்டங்கள்,’ ‘அரசி பதவி’ ஆகிய சொற்கள் நிர்வாக மற்றும் அரசியல் சூழலைத் தெளிவாக்குகின்றன. மூலத்தில் வெளிப்படையாக இல்லாத ‘மீண்டும்’ சேர்க்கப்படவில்லை; கட்டளையின் மாற்ற முடியாத தன்மையிலுள்ள சொற்பொருள் விருப்பங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
