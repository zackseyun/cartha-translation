  text: וְֽ/הַ/יּ֨וֹם הַ/זֶּ֜ה תֹּאמַ֣רְנָה שָׂר֣וֹת פָּֽרַס וּ/מָדַ֗י אֲשֶׁ֤ר שָֽׁמְעוּ֙ אֶת דְּבַ֣ר הַ/מַּלְכָּ֔ה לְ/כֹ֖ל שָׂרֵ֣י הַ/מֶּ֑לֶךְ וּ/כְ/דַ֖י בִּזָּי֥וֹן וָ/קָֽצֶף׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
translation:
  language: ta
  text: இன்றே, அரசியின் வார்த்தையைக்[b] கேட்ட பெர்சியா மற்றும் மேதியாவின் உயர்குலப் பெண்கள்[a], அரசனுடைய அதிகாரிகள் அனைவரிடமும் இதையே சொல்வார்கள்; அதனால் அவமதிப்பும் கோபமும் போதுமான அளவு உண்டாகும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெர்சியா மற்றும் மேதியாவின் அரசகுலப் பெண்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உயர்நிலையிலுள்ள பெண்களைக் குறிக்கிறது; அவர்கள் கட்டாயமாக அரசரின் மகள்கள் என்று பொருளல்ல.
    reason: lexical_alternative
  - marker: b
    text: ‘அரசி சொன்னதைக் கேட்ட’ அல்லது ‘அரசியைப் பற்றிய காரியத்தைக் கேட்ட’ என்றும் பொருள் கொள்ளலாம். இங்குள்ள எபிரெய ‘வார்த்தை’ என்பது அவள் சொன்னதையோ, அவளைப் பற்றிய செய்தி அல்லது நிகழ்வையோ குறிக்கக்கூடும். ‘இதையே’ என்பது சூழலிலிருந்து தெளிவாகும் கருத்தை வெளிப்படுத்துகிறது; அந்தச் சொல் எபிரெயத்தில் நேரடியாக இல்லை.
    reason: lexical_alternative
  - marker: c
    text: இறுதிக் கூறு எபிரெயத்தில் வினைச்சொல் இல்லாமல், சொல்லுக்குச் சொல் ‘போதுமான அவமதிப்பும் கோபமும்’ என்பதுபோல் சுருக்கமாக உள்ளது. தெளிவான தமிழுக்காக ‘அதனால்’ மற்றும் ‘உண்டாகும்’ சேர்க்கப்பட்டுள்ளன.
    reason: ellipsis
lexical_decisions:
- source_word: וְהַיּוֹם הַזֶּה
  choice: இன்றே
  rationale: குறிப்பிட்ட அந்த நாளின் உடனடித் தன்மையையும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: תֹּאמַרְנָה
  choice: சொல்வார்கள்
  rationale: אמר என்பதன் வழக்கமான பொருள் ‘சொல்’; மெமுகான் எதிர்பார்க்கும் விளைவை இங்கு எதிர்கால வினை இயல்பாகக் காட்டுகிறது.
- source_word: שָׂרוֹת
  choice: உயர்குலப் பெண்கள்
  rationale: உயர் சமூக நிலையிலுள்ள பெண்களைக் குறிக்கிறது; அவர்கள் அரசரின் மகள்கள் என்று தேவையின்றிக் குறிப்பதில்லை.
- source_word: פָּרַס וּמָדַי
  choice: பெர்சியா, மேதியாவின்
  rationale: தமிழில் பரவலாக அறியப்படும் வரலாற்றுப் பெயர்களைப் பயன்படுத்தி, அந்த நாடுகளைச் சேர்ந்த பெண்கள் என்ற உறவைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: கேட்ட
  rationale: முடிவுற்ற செயலைத் தமிழின் இயல்பான பெயரெச்ச வடிவில் தருகிறது; அதன் விளைவு தற்போதைய சூழலில் தொடர்கிறது.
- source_word: אֶת דְּבַר הַמַּלְכָּה
  choice: அரசியின் வார்த்தையை
  rationale: דבר என்பதிலுள்ள ‘வார்த்தை/செய்தி/காரியம்’ என்ற பொருள் விரிவை ஓரளவு திறந்தவாறே வைத்து, எபிரெயச் சொற்றொடரின் சுருக்கத்தைக் காக்கிறது.
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  choice: அரசனுடைய அதிகாரிகள் அனைவரிடமும்
  rationale: שָׂרֵי என்பது அரசவைத் தலைவர்களையோ ஆட்சிப் பொறுப்பாளர்களையோ குறிக்கிறது; ‘அதிகாரிகள்’ என்பது அரச குமாரர்கள் என்ற தவறான உட்பொருளைத் தவிர்க்கிறது.
- source_word: וּכְדַי
  choice: போதுமான அளவு உண்டாகும்
  rationale: எபிரெய இறுதிக் கூறு வினையின்றிச் சுருக்கமாக உள்ளது; தமிழில் முழுமையான பொருள் தர ‘உண்டாகும்’ சேர்க்கப்பட்டு, ‘போதுமான அளவு’ என்ற நிறைவு/மிகுதி உணர்வு காக்கப்படுகிறது.
- source_word: בִּזָּיוֹן
  choice: அவமதிப்பு
  rationale: இழிவாக எண்ணி நடத்தும் மனப்பாங்கையும் சமூக அவமரியாதையையும் இயல்பாகக் குறிக்கிறது.
- source_word: וָקָצֶף
  choice: கோபம்
  rationale: קצף குறிக்கும் தீவிரமான சினத்தைத் தெளிவான, பொதுவாகப் புரியும் தமிழில் தருகிறது.
