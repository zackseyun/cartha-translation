  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
translation:
  language: ta
  text: அரசனுக்கும் அதிகாரிகளுக்கும் அந்தக் காரியம் நல்லதாகத் தோன்றியது[a]. அரசன் மெமூகானின் சொல்லின்படி செய்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்த முன்மொழிவு அரசனுக்கும் அதிகாரிகளுக்கும் நல்லதாகத் தோன்றியது.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “மெமூகானின் சொல்லின்படி”; அதாவது, மெமூகானின் ஆலோசனைக்கு ஏற்ப.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב ... בְּעֵינֵי
  choice: நல்லதாகத் தோன்றியது
  rationale: ‘கண்களில் நல்லதாக இருந்தது’ என்ற எபிரெய மரபுத்தொடரின் மதிப்பீட்டுப் பொருளை இயல்பான தமிழில் தருகிறது; ‘மகிழ்வித்தது’ என்பதைக் காட்டிலும் முன்மொழிவு ஏற்றதாகக் கருதப்பட்டதைத் தெளிவாகச் சொல்கிறது.
- source_word: הַדָּבָר
  choice: அந்தக் காரியம்
  rationale: דָּבָר என்பதன் விரிவான ‘சொல்/விஷயம்/காரியம்’ பொருளைத் தக்கவைத்து, முந்தைய வசனத்தில் கூறப்பட்ட ஆலோசனையைச் சுட்டுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: מֶלֶךְ என்பதற்கான நேரடியான, இயல்பான நவீனத் தமிழ் இணை.
- source_word: וְהַשָּׂרִים
  choice: அதிகாரிகளுக்கும்
  rationale: שָׂרִים என்பது அரசவையின் உயர்நிலைத் தலைவர்கள் அல்லது ஆட்சிப் பொறுப்பாளர்களைக் குறிக்கிறது; ‘அதிகாரிகள்’ என்பது பாரசீக அரசவைச் சூழலுக்கு ஏற்ற தெளிவான பொதுச் சொல்.
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עָשָׂה என்ற பொதுவான ‘செய்’ வினையை நெருக்கமாகத் தருகிறது; அடுத்து வரும் சொற்றொடர் அவர் எதன்படி செய்தார் என்பதை விளக்குகிறது.
- source_word: כִּדְבַר
  choice: சொல்லின்படியே
  rationale: ‘ஒருவரின் சொல்லின்படி’ என்ற எபிரெய அமைப்பைத் தக்கவைக்கிறது; சூழலில் அது ஆலோசனையை நடைமுறைப்படுத்தியதைக் குறித்தாலும், மூலத்தின் ‘சொல்’ என்ற பரந்த தன்மையைச் சுருக்கவில்லை.
- source_word: מְמוּכָן
  choice: மெமுகான்
  rationale: எபிரெயப் பெயரின் ஒலியை நவீனத் தமிழில் இயல்பாக எழுத்துப்பெயர்க்கிறது.
