base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
translation:
  language: ta
  text: “சட்டத்தின்படி[a], அண்ணகர்கள் மூலம்[b] அகாஸ்வேரு அரசன் அனுப்பிய கட்டளையை அவள் நிறைவேற்றாததால்[c], அரசி வஸ்தியின் விஷயத்தில் என்ன செய்ய வேண்டும்?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அரச வழக்கத்தின்படி.’ இச்சூழலில் எபிரெயச் சொல் பொதுவாகச் சட்டம் அல்லது அதிகாரபூர்வ ஆணையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘அண்ணகர்களின் கையால்.’ இச்சொல் விரிவான பொருளில் அரண்மனை அலுவலர்களையும் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘அகாஸ்வேரு அரசனின் கட்டளைக்கு அவள் கீழ்ப்படியாததால்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדָת
  choice: சட்டத்தின்படி
  rationale: எஸ்தர் நூலின் பாரசீக அரசவைச் சூழலில் דָּת என்பது வழக்கத்தைவிடச் சட்டம் அல்லது அதிகாரபூர்வ ஆணையைக் குறிப்பது இயல்பானது; கேள்வியின் சட்டரீதியான தொனியையும் இது காக்கிறது.
- source_word: מַה לַּעֲשׂוֹת בַּמַּלְכָּה וַשְׁתִּי
  choice: அரசி வஸ்தியை என்ன செய்ய வேண்டும்?
  rationale: இக்கட்டமைப்பு அவளுக்கு எதிராக என்ன தண்டனை கொடுக்க வேண்டும் என்று முன்கூட்டியே தீர்மானிக்காமல், அவளைப் பற்றி எத்தகைய நடவடிக்கை எடுக்க வேண்டும் என்ற நீதிமன்ற ஆலோசனைக் கேள்வியை வெளிப்படுத்துகிறது.
- source_word: עַל אֲשֶׁר לֹא עָשְׂתָה
  choice: அவள் நிறைவேற்றாததால்
  rationale: எபிரெயச் சொல் அடிப்படையில் ‘செய்யவில்லை’ என்று பொருள்படும். ‘கட்டளையை நிறைவேற்றவில்லை’ என்பது இயல்பான தமிழாகவும், ‘கீழ்ப்படியவில்லை’ என்ற வலுவான விளக்கத்தை முதன்மை உரையில் சேர்க்காததாகவும் உள்ளது.
- source_word: מַאֲמַר
  choice: கட்டளை
  rationale: அரசனின் அதிகாரமுள்ள கூற்றைக் குறிக்கும் இச்சொல்லுக்கு இச்சூழலில் ‘கட்டளை’ தெளிவான மற்றும் இயல்பான இணைச்சொல்.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு அரசன்
  rationale: அரசுப் பட்டம் தமிழாக்கப்பட்டு, ஆள்பெயர் எபிரெய வடிவத்தை ஒட்டி ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּיַד הַסָּרִיסִים
  choice: அண்ணகர்கள் மூலம்
  rationale: ‘அண்ணகர்களின் கையால்’ என்ற சொல்லுக்குச் சொல் மரபுத்தொடர் இங்கு இடைத்தரகர்களின் வாயிலாகக் கட்டளை தெரிவிக்கப்பட்டதைக் குறிக்கிறது. סָרִיסִים என்பதன் நேரடியான பொருளை முதன்மை உரை காக்கிறது.
