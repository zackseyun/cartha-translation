- from: “சட்டத்தின்படி[a], அரசி வஸ்தியை என்ன செய்ய வேண்டும்? அண்ணகர்கள் மூலம்[b] அகாஸ்வேரு அரசன் பிறப்பித்த கட்டளையை அவள் நிறைவேற்றாததால்[c] என்ன செய்ய வேண்டும்?”
  to: “சட்டத்தின்படி[a], அண்ணகர்கள் மூலம்[b] அகாஸ்வேரு அரசன் அனுப்பிய கட்டளையை அவள் நிறைவேற்றாததால்[c], அரசி வஸ்தியின் விஷயத்தில் என்ன செய்ய வேண்டும்?”
