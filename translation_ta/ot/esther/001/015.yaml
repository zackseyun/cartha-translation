translation_notes:
  register: நவீனத் தரத் தமிழில், அரசவையின் சட்ட ஆலோசனைத் தொனி காக்கப்பட்டுள்ளது. ‘அண்ணகர்கள்’ என்பது நேரடியான வரலாற்றுச் சொல்லாக வைக்கப்பட்டு, அதன் விரிவான ‘அரண்மனை அலுவலர்கள்’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. எபிரெய வசனத்தின் ஒரே கேள்வியைத் தமிழில் தேவையின்றி இருமுறை கூறாமல் அமைக்க வேண்டும் என்பதால், இறுதி வெளியீட்டில் வாக்கிய ஓட்டம் சரிபார்க்கப்பட வேண்டும்.
