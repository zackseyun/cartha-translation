base_translation:
  language: en
  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
translation:
  language: ta
  text: குடிப்பது ஒழுங்குமுறைப்படி[a] நடந்தது; யாரும் கட்டாயப்படுத்தப்படவில்லை.[b] ஏனெனில், ஒவ்வொருவரின் விருப்பப்படியே[c] செய்யுமாறு அரண்மனைப் பொறுப்பாளர்கள் அனைவருக்கும் அரசன் கட்டளையிட்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒழுங்குமுறைப்படி” என்பதற்கு “சட்டப்படி” அல்லது “விதிப்படி” என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் சட்டம், ஆணை அல்லது முறையான விதியைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “கட்டாயம் இல்லை”; அதாவது, குடிக்கும்படி யாரும் வற்புறுத்தப்படவில்லை.
    reason: lexical_alternative
  - marker: c
    text: எபிரேயத்தில், “ஒவ்வொரு மனிதனின் விருப்பப்படி”; இது ஒவ்வொரு தனிநபரையும் குறிக்கும் பகிர்ந்தளிக்கும் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁתִיָּה
  choice: குடிப்பது
  rationale: விருந்தின் முழுச் செயலை அல்லாமல், பானம் அருந்தும் செயலைக் குறிப்பாகச் சுட்டுகிறது.
- source_word: כַדָּת
  choice: ஒழுங்குமுறைப்படி
  rationale: דָּת என்பது சட்டம், ஆணை, முறைமை எனப் பொருள்படலாம்; இச்சூழலில் விருந்துக்கான நடைமுறை விதியை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֵין אֹנֵס
  choice: யாரும் கட்டாயப்படுத்தப்படவில்லை
  rationale: கட்டாயம் இல்லாததை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יִסַּד
  choice: கட்டளையிட்டிருந்தான்
  rationale: அடிப்படைப் பொருள் ‘நிறுவுதல்/வகுத்தல்’; இங்கு அரசன் நடைமுறையை அதிகாரபூர்வமாக விதித்ததைக் குறிக்கிறது.
- source_word: עַל כָּל רַב בֵּיתוֹ
  choice: அரண்மனைப் பொறுப்பாளர்கள் அனைவருக்கும்
  rationale: சொல்லடிப்படையில் ‘அவனுடைய வீட்டின் தலைவர்கள்’; அரசவைக் சூழலில் அரண்மனை நிர்வாகப் பொறுப்பாளர்களைக் குறிக்கிறது.
- source_word: כִּרְצוֹן אִישׁ וָאִישׁ
  choice: ஒவ்வொருவரின் விருப்பப்படியே
  rationale: எபிரேய இரட்டிப்பு ஒவ்வொரு தனிநபரையும் பகிர்ந்தளிக்கும் முறையில் குறிக்கிறது; தமிழில் பாலினத்தைத் தேவையின்றி சேர்க்காமல் இயல்பாக வழங்கப்படுகிறது.
