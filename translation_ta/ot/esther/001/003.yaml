translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்குரிய கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் நீண்ட பட்டியல் தமிழில் தெளிவாக அமைய இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; இரண்டாம் வாக்கியத்தின் ‘இருந்தார்கள்’ என்பது לְפָנָיו குறிக்கும் முன்னிலைச் சூழலை இயல்பாக வெளிப்படுத்தும் நிரப்புச் சொல்.
