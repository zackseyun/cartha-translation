- from: அவன் அரசாண்ட மூன்றாம் ஆண்டில், தன் அதிகாரிகள், பணியாளர்கள் அனைவருக்கும் ஒரு விருந்து[a] வைத்தான். பெர்சியா, மேதியா நாடுகளின் படை[b], உயர்குடியினர், மாகாணங்களின் அதிகாரிகள் ஆகியோர் அவன் முன்னிலையில்[c] இருந்தார்கள்.
