base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
translation:
  language: ta
  text: அவன் அரசாண்ட மூன்றாம் ஆண்டில், தன் அதிகாரிகளும் பணியாளர்களும், பெர்சியா, மேதியாவின் படை[b], உயர்குடியினர், தன் முன்னிலையில்[c] இருந்த மாகாண அதிகாரிகள் ஆகிய அனைவருக்கும் ஒரு விருந்து[a] வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குடிப்பும் கொண்டாட்டமும் இடம்பெற்ற விருந்து.’ எபிரெயச் சொல் இத்தகைய விருந்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பெர்சியா, மேதியாவின் இராணுவ வலிமை.’
    reason: lexical_alternative
  - marker: c
    text: அதாவது, அரசனின் நேரடி முன்னிலையில்.
    reason: clarification
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: அவன் அரசாண்ட மூன்றாம் ஆண்டில்
  rationale: காலக் குறிப்பையும் ஆட்சிக்காலத்தைக் குறிக்கும் பொருளையும் இயல்பான நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: עָשָׂה מִשְׁתֶּה
  choice: ஒரு விருந்து வைத்தான்
  rationale: சொல்லுக்குச் சொல் ‘செய்தான்’ என்பதற்குப் பதிலாக, விருந்து நடத்துவதைக் குறிக்கும் இயல்பான தமிழ் மரபுத்தொடர்; மִשְׁתֶּה-யின் குடிப்பும் கொண்டாட்டமும் சேர்ந்த விருந்து என்ற பொருளையும் அடக்குகிறது.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: தன் அதிகாரிகள், பணியாளர்கள் அனைவருக்கும்
  rationale: שָׂרִים என்பதன் ஆட்சிசார் பதவியையும், עֲבָדִים என்பதன் அரண்மனைச் சேவைச் சூழலையும் தேவையின்றி அடிமைத்தனமாகக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: חֵיל פָּרַס וּמָדַי
  choice: பெர்சியா, மேதியா நாடுகளின் படை
  rationale: חֵיל என்பதன் முதன்மையான இராணுவக் கூட்டுப் பொருளைப் பாதுகாக்கிறது; ‘நாடுகளின்’ என்பது இரு பெயர்களும் அரசியல் நிலப்பகுதிகள் என்பதைத் தமிழில் இயல்பாகத் தெளிவாக்குகிறது.
- source_word: הַפַּרְתְּמִים
  choice: உயர்குடியினர்
  rationale: இந்தப் பாரசீகக் கடன்சொல் குறிக்கும் உயர்நிலைப் பிரபுக்கள் அல்லது குலத்தலைவர்களை பொதுவான நவீனத் தமிழில் தருகிறது.
- source_word: וְשָׂרֵי הַמְּדִינוֹת
  choice: மாகாணங்களின் அதிகாரிகள்
  rationale: שָׂרֵי என்பதை குறிப்பிட்ட ‘ஆளுநர்’ பதவியாக மிகைப்படுத்தாமல், மாகாணத் தலைமை அதிகாரிகள் என்ற பரந்த பொருளில் தருகிறது.
- source_word: לְפָנָיו
  choice: அவன் முன்னிலையில்
  rationale: சொற்றொடரின் நீதிமன்றச் சூழலுக்குரிய ‘அவனுக்கு முன்பாக/அவன் சந்நிதியில்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
