base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
translation:
  language: ta
  text: வெண்ணிறப் பருத்தித் துணியாலும் நீலநிறத் துணியாலும் ஆன திரைகள், மெல்லிய நார்ப்பட்டு மற்றும் ஊதாநிற நூல்களால் செய்யப்பட்ட கயிறுகளைக் கொண்டு வெள்ளி வளையங்களிலும்[a] சலவைக்கல் தூண்களிலும் கட்டப்பட்டிருந்தன. வெண்பளிங்கு, சலவைக்கல், முத்துச்சிப்பி, விலையுயர்ந்த கற்கள் ஆகியவற்றால் அமைக்கப்பட்ட தரையின்மேல்[b] தங்கத்தாலும் வெள்ளியாலும் செய்யப்பட்ட சாய்விருக்கைகள்[c] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெள்ளி வளையங்கள்’ என்பதற்குப் பதிலாக ‘வெள்ளிக் கம்பிகள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் வட்டமான அல்லது உருளை வடிவிலான வெள்ளிப் பொருத்திகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: தரையில் பயன்படுத்தப்பட்டதாகக் கூறப்படும் கற்களையும் பொருட்களையும் குறிக்கும் எபிரெயச் சொற்களின் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை. அவை வெண்பளிங்கு, சலவைக்கல், முத்துச்சிப்பி, விலையுயர்ந்த கற்கள் என்று இங்கு மொழிபெயர்க்கப்பட்டுள்ளன; வேறு வகைக் கற்களாகவும் இவை அடையாளம் காணப்படுகின்றன.
    reason: lexical_alternative
  - marker: c
    text: ‘சாய்விருக்கைகள்’ என்பது விருந்தின்போது சாய்ந்து அமர்ந்து உண்பதற்கான இருக்கைகளைக் குறிக்கிறது; தூங்குவதற்கான சாதாரண படுக்கைகளை அல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: חוּר כַּרְפַּס
  choice: வெண்ணிறப் பருத்தித் துணி
  rationale: חוּר என்பதை நிறத்தைக் குறிக்கும் ‘வெண்ணிறம்’ என்றும், பாரசீகக் கடன்சொல்லான כַּרְפַּס என்பதை பருத்தித் துணி என்றும் எடுத்துக்கொள்வது அரண்மனை அலங்காரச் சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: תְכֵלֶת
  choice: நீலநிறத் துணி
  rationale: இந்தச் சொல் மதிப்புமிக்க நீலம் அல்லது நீல-ஊதா நிறச் சாயத்தைக் குறிக்கிறது; இங்கு திரைத் துணிகளின் பட்டியலில் வருவதால் ‘நீலநிறத் துணி’ என இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: חַבְלֵי בוּץ וְאַרְגָּמָן
  choice: மெல்லிய நார்ப்பட்டு மற்றும் ஊதாநிற நூல்களால் செய்யப்பட்ட கயிறுகள்
  rationale: בוּץ உயர்தர மெல்லிய நார்ப்பட்டைக் குறிக்கிறது; אַרְגָּמָן ஊதா நிறமுள்ள விலையுயர்ந்த நூல் அல்லது துணியைக் குறிக்கிறது. இவை திரைகளைக் கட்டும் கயிறுகளின் பொருட்களாகத் தெளிவுபடுத்தப்பட்டுள்ளன.
- source_word: גְּלִילֵי כֶסֶף
  choice: வெள்ளி வளையங்கள்
  rationale: גְּלִילִים என்பது வட்டமான அல்லது சுருட்டப்பட்ட பொருட்களைக் குறிக்கலாம். திரைகளைப் பொருத்தும் சூழலில் ‘வளையங்கள்’ பொருத்தமாக உள்ளது; ‘வெள்ளிக் கம்பிகள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: சலவைக்கல் தூண்கள்
  rationale: இங்கு שֵׁשׁ நார்ப்பட்டைக் குறிக்காமல் வெண்மையான கட்டடக் கல்லைக் குறிக்கிறது; ‘சலவைக்கல்’ தெளிவான கட்டடவியல் சொல்லாகும்.
- source_word: מִטּוֹת זָהָב וָכֶסֶף
  choice: தங்கத்தாலும் வெள்ளியாலும் செய்யப்பட்ட சாய்விருக்கைகள்
  rationale: விருந்து உண்பவர்கள் சாய்ந்து அமரும் இருக்கைகளே இங்கு குறிக்கப்படுகின்றன; தூங்கும் படுக்கைகள் அல்ல.
- source_word: רִצְפַת
  choice: தரை
  rationale: கற்களால் அமைக்கப்பட்ட மேற்பரப்பை இயல்பான நவீன தமிழில் ‘தரை’ என்று வழங்குவது தெளிவாக உள்ளது; ‘மொசைக் தரை’ என்பது தேவைக்கு மீறிய விளக்கமாகும்.
- source_word: בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  choice: வெண்பளிங்கு, சலவைக்கல், முத்துச்சிப்பி, விலையுயர்ந்த கற்கள்
  rationale: இந்த நான்கு அரிய தரைப்பொருட்களின் துல்லியமான அடையாளங்கள் உறுதியற்றவை. பொதுவாக ஏற்றுக்கொள்ளப்படும் அடையாளங்கள் முதன்மை உரையில் தரப்பட்டு, நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
