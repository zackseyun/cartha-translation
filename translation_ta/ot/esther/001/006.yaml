translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரண்மனை அலங்காரத்தின் செழுமை தெளிவாகத் தெரிவதோடு, அறியப்படாத பழங்காலப் பொருட்களின் அடையாளங்கள் அளவுக்கு மீறி உறுதிப்படுத்தப்படவில்லை. நீண்ட எபிரெயப் பட்டியல் வாசிப்புக்கு ஏற்றவாறு இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
