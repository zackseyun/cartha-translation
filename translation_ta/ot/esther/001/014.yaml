translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அரசவை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கிய அமைப்பு வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், ஏழு நபர்களும் ஒரே உயரதிகாரிகள் குழுவைச் சேர்ந்தவர்கள் என்ற தொடர்பு வெளிப்படையாக வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே இடப்பட்டுள்ளன.
