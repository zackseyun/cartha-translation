base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
translation:
  language: ta
  text: அவருக்கு மிக நெருக்கமானவர்கள் கர்ஷெனா, சேத்தார், அத்மாதா, தர்ஷீஷ், மேரெஸ், மர்செனா, மெமூகான் ஆகியோர். இவர்கள் அரசரின் முகத்தைப் பார்ப்பவர்களும்[a], அரசில் முதல் இடங்களில் அமர்ந்திருந்தவர்களுமான[b] பெர்சியா மற்றும் மேதியாவின் ஏழு உயரதிகாரிகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “அரசரின் முகத்தைப் பார்ப்பவர்கள்.” இது அரசரின் முன்னிலையை நேரடியாக அணுகும் உரிமை பெற்றவர்களைக் குறிக்கும் பெர்சிய அரசவைச் சொல்வழக்கு.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அரசில் மிக உயர்ந்த பதவிகளை வகித்தவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרֹב אֵלָיו
  choice: அவருக்கு மிக நெருக்கமானவர்கள்
  rationale: קָרוֹב இலக்கண வடிவில் ஒருமையாக இருந்தாலும், தொடர்ந்து ஏழு அரசவை அதிகாரிகள் பட்டியலிடப்படுவதால் இதைத் தொகுப்பொருளில் பன்மையாக மொழிபெயர்ப்பது இயல்பானது.
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  choice: கர்ஷெனா, சேத்தார், அத்மாதா, தர்ஷீஷ், மேரெஸ், மர்செனா, மெமூகான்
  rationale: தனிப்பட்ட நபர்களின் பெயர்கள் மூலமொழி ஒலிப்புக்கு நெருக்கமாகத் தமிழ் எழுத்துகளில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: שִׁבְעַת שָׂרֵי
  choice: ஏழு உயரதிகாரிகள்
  rationale: שָׂרֵי என்பது உயர் பதவியிலுள்ள ஆட்சியாளர்கள் அல்லது அரசவை அதிகாரிகளைக் குறிக்கிறது. மரபுவழி இளவரசர்கள் என்ற பொருளைத் தேவையின்றி ஏற்படுத்தாமல், அவர்களின் உயர்ந்த அரசவை நிலையைக் ‘உயரதிகாரிகள்’ தெளிவாகக் காட்டுகிறது.
- source_word: פָּרַס וּמָדַי
  choice: பெர்சியா மற்றும் மேதியா
  rationale: இரட்டை பேரரசின் அரசியல்-புவியியல் பெயர்கள் தமிழில் வழக்கமான வடிவில் தரப்பட்டுள்ளன.
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  choice: அரசரின் முகத்தைப் பார்ப்பவர்கள்
  rationale: ‘அரசரின் முகத்தைப் பார்ப்பது’ என்ற மூலமொழியின் அரசவை உருவகம் பாதுகாக்கப்படுகிறது; அரசரின் முன்னிலையை நேரடியாக அணுகும் உரிமை என்ற அதன் பண்பாட்டுப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  choice: அரசில் முதல் இடங்களில் அமர்ந்திருந்தவர்கள்
  rationale: மூலத்தில் உள்ள அமர்வு மற்றும் தரவரிசை உருவகத்தைப் பாதுகாத்து, அரசாட்சியில் அவர்கள் வகித்த முதன்மையான நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
