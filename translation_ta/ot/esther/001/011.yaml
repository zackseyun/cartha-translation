base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
translation:
  language: ta
  text: மக்களுக்கும் அதிகாரிகளுக்கும் அவளுடைய அழகைக் காட்டுவதற்காக, அரச கிரீடத்துடன் அரசி வஸ்தியை அரசனின் முன்னிலையில் அழைத்து வர வேண்டும்; ஏனெனில் அவள் பார்ப்பதற்கு அழகாக இருந்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהָבִיא
  choice: அழைத்து வந்து
  rationale: בוא என்பதன் ஹிஃபில் வினையெச்ச வடிவம் ஒருவரை வரச்செய்வதைக் குறிக்கிறது; சூழலில் பணியாளர்கள் வஸ்தியை அரசனிடம் அழைத்து வர வேண்டும் என்பதால் இத்தேர்வு இயல்பாக உள்ளது.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: அரசி வஸ்தியை
  rationale: வஸ்தி என்ற பெயருடன் அவளுடைய அரசப் பட்டத்தையும் தமிழில் இயல்பான அடைமொழி வரிசையில் தருகிறது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசனின் முன்னிலையில்
  rationale: לִפְנֵי என்பது ‘முன், முன்னிலையில்’ எனப் பொருள்படும்; இங்கு அரசனுடைய சமூகத்தில் நேரில் நிற்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּכֶתֶר מַלְכוּת
  choice: அரச கிரீடத்துடன்
  rationale: בְּ என்ற முன்னிடைச்சொல்லின் உடனிகழ்ச்சிப் பொருளைத் தக்கவைத்து, கிரீடத்தை ‘அணிந்திருந்தாள்’ என்று மூலத்தில் வெளிப்படையாக இல்லாத செயலைச் சேர்க்காமல் மொழிபெயர்க்கிறது.
- source_word: לְהַרְאוֹת
  choice: காட்ட வேண்டும்
  rationale: ראה என்பதன் ஹிஃபில் வடிவம் ‘காணச் செய், காட்டு’ என்று பொருள்படும்; முந்தைய கட்டளையின் நோக்கத்தைத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: הָעַמִּים
  choice: மக்களுக்கும்
  rationale: எபிரெய மூலத்தில் பன்மை இருந்தாலும், ‘மக்கள்’ என்ற தமிழ்ச் சொல் பல இனக்குழுக்களை உள்ளடக்கும் பொதுப்பன்மையாக இயல்பாகச் செயல்படுகிறது.
- source_word: וְהַשָּׂרִים
  choice: அதிகாரிகளுக்கும்
  rationale: שָׂרִים என்பது ஆட்சியாளர்கள் அல்லது உயரதிகாரிகளைக் குறிக்கலாம்; ‘அதிகாரிகள்’ என்பது அரச குமாரர்கள் என்ற தவறான எண்ணத்தைத் தவிர்க்கும் நவீன பொதுச்சொல்.
- source_word: יָפְיָהּ
  choice: அவளுடைய அழகை
  rationale: மூன்றாம் நபர் பெண்பால் உரிமை விகுதியுள்ள அருவப்பெயரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவளுடைய அழகைக் காட்டச் சொன்னதற்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: טוֹבַת מַרְאֶה
  choice: பார்ப்பதற்கு அழகாக
  rationale: சொல்லளவில் ‘தோற்றத்தில் நல்லவள்’ என்ற எபிரெய மரபுத்தொடர் உடல் தோற்ற அழகைக் குறிக்கிறது; தமிழில் ‘பார்ப்பதற்கு அழகாக’ என்பது அந்தக் காட்சிசார் வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
