translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், மரியாதையும் இலக்கியத் தன்மையும் கொண்ட நடை. வசனம் முந்தைய கட்டளையின் தொடர்ச்சி என்பதால் நோக்கத்தைக் குறிக்கும் ‘வேண்டும்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் ‘அழகு/பார்ப்பதற்கு அழகு’ என்ற மீளுரைப்பும் தக்கவைக்கப்பட்டுள்ளது.
