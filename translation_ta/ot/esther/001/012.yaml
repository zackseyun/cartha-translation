base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
translation:
  language: ta
  text: ஆனால் அரசி வஸ்தி, அரண்மனை அண்ணகர்கள் வழியாகத் தெரிவிக்கப்பட்ட அரசனின் கட்டளைப்படி வர மறுத்தாள்[a]. அதனால் அரசன் மிகவும் கோபமடைந்தான்; அவனுடைய கடுஞ்சினம் அவனுக்குள் பற்றி எரிந்தது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “அண்ணகர்களின் கையால்.” இது அவர்களுடைய வழியாகக் கட்டளை தெரிவிக்கப்பட்டது என்னும் பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயம் கோபத்தை நெருப்பாகச் சித்தரிக்கிறது; “அவனுடைய கடுஞ்சினம் அவனுக்குள் எரிந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  choice: மறுத்தாள்
  rationale: מ־א־ן என்பது மனமில்லாமையை மட்டும் அல்லாது திட்டவட்டமான மறுப்பைக் குறிக்கிறது; ‘மறுத்தாள்’ அதன் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: הַמַּלְכָּה וַשְׁתִּי
  choice: அரசி வஸ்தி
  rationale: பதவியையும் தனிப்பெயரையும் நவீனத் தமிழின் இயல்பான வரிசையில் தருகிறது.
- source_word: לָבוֹא
  choice: வர
  rationale: அரசனின் அழைப்புக்கு இணங்கி அவன் முன்னிலைக்கு வருவதையே சூழல் குறிக்கிறது.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: அரசனின் கட்டளைக்கு இணங்கி
  rationale: דבר இச்சூழலில் வெறும் ‘சொல்’ அல்ல, அரச கட்டளை; בְּ தொடர்பை ‘இணங்கி’ எனத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בְּיַד הַסָּרִיסִים
  choice: திருநங்கைக் காவலர்கள் வழியாகத் தெரிவிக்கப்பட்ட
  rationale: ביד என்ற எபிரெய வழக்கு இடைநிலையாக்கம் அல்லது முகவர் வழியாகச் செய்தலைக் குறிக்கிறது. சָרִיסִים பாரசீக அரண்மனைச் சூழலில் ஆண்மை நீக்கம் செய்யப்பட்ட அரண்மனை அலுவலர்களைக் குறிக்கும்; தமிழில் மனித மரியாதையையும் அரண்மனைப் பணியையும் உணர்த்த இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיִּקְצֹף מְאֹד
  choice: மிகவும் கோபமடைந்தான்
  rationale: קצף குறிக்கும் தீவிர கோபத்தையும் מְאֹד தரும் வலியுறுத்தலையும் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: וַחֲמָתוֹ בָּעֲרָה בוֹ
  choice: அவனுடைய கடுஞ்சினம் அவனுக்குள் பற்றி எரிந்தது
  rationale: חֵמָה என்பதன் தீவிரத்தையும் בער என்பதிலுள்ள நெருப்பு உருவகத்தையும், בוֹ என்பதன் உள்நிலைப் பொருளையும் பாதுகாக்கிறது.
