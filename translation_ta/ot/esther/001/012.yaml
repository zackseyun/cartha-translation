translation_notes:
  register: நவீன நிலையான தமிழில், கதைநடைக்கேற்ற கண்ணியமான நடையும் மூலத்தின் கோபம்–நெருப்பு உருவகமும் பாதுகாக்கப்பட்டுள்ளன. வசனத்தின் தொடக்க எதிர்மறைத் திருப்பை ‘ஆனால்’ வெளிப்படுத்துகிறது.
