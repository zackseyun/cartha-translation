revisions:
- from: அப்போது அரசன், காலங்களின் தன்மையை அறிந்த ஞானிகளிடம் பேசினான். ஏனெனில் சட்டத்தையும் நீதிமுறையையும் அறிந்த அனைவரின் முன்னிலையிலும் அரசனுடைய காரியங்கள் இவ்வாறே எடுத்துரைக்கப்படுவது வழக்கம்.
  to: அப்போது அரசன், காலங்களை அறிந்த ஞானிகளிடம் கூறினான்; ஏனெனில், சட்டம் மற்றும் நியாயத்தீர்ப்பை அறிந்த அனைவரின் முன்னிலும் அரசனின் விவகாரம் இவ்வாறே இருந்தது.
  rationale: The revision removes the unsupported passive idea of explaining matters and restores the source’s singular “matter.” It keeps the Hebrew’s explanatory parenthetical sense and its formal court setting without over-defining the sages’ expertise or the king’s procedure.
