translation_notes:
  register: நவீன தரநிலைத் தமிழில் அரசவைச் சூழலுக்கேற்ற கண்ணியமான நடை. எபிரெய உரையின் விளக்க இடைச்சொற்றொடர் தமிழில் முழுமையான வாக்கியமாக இயல்புபடுத்தப்பட்டுள்ளது; குறிப்பிட்ட சமய விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
