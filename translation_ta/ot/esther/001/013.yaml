  yaml_path: translation/ot/esther/001/013.yaml
  text: Then the king said to the wise men who knew the times—for this was the king’s procedure before all who knew law and judgment—
translation:
  language: ta
  text: அப்போது அரசன், காலங்களை அறிந்த ஞானிகளிடம் கூறினான்; ஏனெனில், சட்டம் மற்றும் நியாயத்தீர்ப்பை அறிந்த அனைவரின் முன்னிலும் அரசனின் விவகாரம் இவ்வாறே இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹדְעֵי הָעִתִּים
  choice: காலங்களின் தன்மையை அறிந்தவர்கள்
  rationale: சூழ்நிலைக்கும் காலத்திற்கும் ஏற்றதைப் பகுத்தறிந்த அரசவை ஞானிகளைக் குறிக்கிறது; வெறும் காலக்கணிப்பாகக் குறுக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: דְּבַר הַמֶּלֶךְ
  choice: அரசனுடைய காரியங்கள்
  rationale: דבר என்பது இங்கு அரசனின் விவகாரம் அல்லது அலுவல் நடைமுறையைக் குறிக்கலாம்; தொடரின் விளக்கவாக்கியத்தில் இயல்பான பன்மை பொதுப்பொருளாக வழங்கப்பட்டது.
- source_word: דָּת וָדִין
  choice: சட்டத்தையும் நீதிமுறையையும்
  rationale: דת என்பது சட்டம் அல்லது அரசாணை; דין என்பது தீர்ப்பு, நியாயவிசாரணை அல்லது நீதிநடைமுறை. இரண்டின் வேறுபாட்டைக் காக்கிறது.
