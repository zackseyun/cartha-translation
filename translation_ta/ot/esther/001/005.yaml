translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தகவல் வரிசை பெருமளவு காக்கப்பட்டாலும், தமிழின் இயல்புக்காக இடச்சொற்றொடர் வினைக்கு முன் அமைக்கப்பட்டுள்ளது. சமூக உள்ளடக்கத்தைக் காட்டும் ‘பெரியவர்முதல் சிறியவர்வரை’ என்ற உருவகம் விளக்கமாக விரிவாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
