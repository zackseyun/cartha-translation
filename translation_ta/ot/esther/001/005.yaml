  text: וּ/בִ/מְל֣וֹאת הַ/יָּמִ֣ים הָ/אֵ֗לֶּה עָשָׂ֣ה הַ/מֶּ֡לֶךְ לְ/כָל הָ/עָ֣ם הַ/נִּמְצְאִים֩ בְּ/שׁוּשַׁ֨ן הַ/בִּירָ֜ה לְ/מִ/גָּ֧דוֹל וְ/עַד קָטָ֛ן מִשְׁתֶּ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/חֲצַ֕ר גִּנַּ֥ת בִּיתַ֖ן הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
translation:
  language: ta
  text: இந்த நாட்கள் முடிந்தபோது, அரசன் சூசான் அரண்கோட்டையில்[b] இருந்த எல்லா மக்களுக்கும்—பெரியவர் முதல் சிறியவர்வரை[c]—அரசனின் அரண்மனைத் தோட்ட முற்றத்தில் ஏழு நாட்களுக்கு விருந்து[a] அளித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விருந்து’ என்பதற்கான எபிரெயச் சொல், பெரும்பாலும் மதுபானம் அருந்தும் விருந்தைக் குறிக்கிறது; ‘குடிவிருந்து’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சூசான் அரண்கோட்டையில்’ என்பதை ‘சூசான் நகரத்தின் அரண்கோட்டையில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘பெரியவர் முதல் சிறியவர்வரை’ என்பது சமூகத்தின் எல்லா நிலைகளையும் சேர்ந்த மக்களைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאות הַיָּמִים הָאֵלֶּה
  choice: இந்த நாட்கள் முடிந்தபோது
  rationale: בְּ + நிறைவினைச் சுட்டும் infinitive construct காலச் சூழலைக் குறிக்கிறது. முந்தைய வசனங்களில் கூறப்பட்ட நாட்களைத் தெளிவாகச் சுட்டிக்காட்டும் இயல்பான நவீனத் தமிழ் இது.
- source_word: עָשָׂה ... מִשְׁתֶּה
  choice: விருந்து அளித்தான்
  rationale: עָשָׂה என்பதன் அடிப்படைப் பொருள் ‘செய்தான்’ என்றாலும், מִשְׁתֶּה உடன் வரும்போது விருந்து நடத்துதல் அல்லது அளித்தல் என்ற மரபுத்தொடர் பொருளைத் தருகிறது.
- source_word: לְכָל הָעָם הַנִּמְצְאִים
  choice: இருந்த மக்கள் அனைவருக்கும்
  rationale: הַנִּמְצְאִים இங்கு ஒரு இடத்தில் காணப்பட்டவர்கள் என்பதைக் காட்டிலும் அங்கு இருந்தவர்கள் அல்லது கூடியிருந்தவர்கள் என்னும் பொருளைக் கொண்டது. ‘மக்கள் அனைவருக்கும்’ என்பது இனக்குழு என்ற தேவையற்ற வரையறையைத் தவிர்க்கிறது.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: சூசான் கோட்டையில்
  rationale: בִּירָה என்பது அரண்சூழ்ந்த கோட்டை அல்லது கோட்டைநகரப் பகுதியைக் குறிக்கிறது. எபிரெயப் பெயரிணை அமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் தமிழில் தருகிறது.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: பெரியவர்முதல் சிறியவர்வரை
  rationale: சமூக நிலை அல்லது தரம் எதுவாயினும் அனைவரையும் உள்ளடக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: விருந்து நீடித்த கால அளவை நேரடியாகவும் இயல்பாகவும் குறிப்பிடுகிறது.
- source_word: בַּחֲצַר גִּנַּת
  choice: தோட்ட முற்றத்தில்
  rationale: חָצֵר என்பது முற்றம் அல்லது திறந்த வெளி அரங்கைக் குறிக்கலாம்; construct தொடரை இயல்பான தமிழில் ‘தோட்ட முற்றம்’ என வழங்குகிறது.
- source_word: בִּיתַן הַמֶּלֶךְ
  choice: அரச அரண்மனையின்
  rationale: பாரசீகக் கடன்சொல்லான בִּיתַן அரண்மனை, மாளிகை, கூடாரம் போன்ற பொருட்களை ஏற்கலாம். அரசச் சூழலில் ‘அரண்மனை’ தெளிவான தெரிவாகும்; நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִשְׁתֶּה
  choice: விருந்து
  rationale: இச்சொல் விருந்தைக் குறிக்கிறது; பல இடங்களில் மதுபானம் அருந்துதல் அதன் முக்கிய அம்சமாக உள்ளது. பிரதான உரையில் இயல்பான ‘விருந்து’ பயன்படுத்தப்பட்டு, அந்த நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
