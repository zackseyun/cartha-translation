base_translation:
  language: en
  yaml_path: translation/ot/esther/001/002.yaml
  text: In those days[a], when King Ahasuerus sat on his royal throne, which was in Susa the citadel,
translation:
  language: ta
  text: அந்த நாட்களில், அகாஸ்வேரு அரசன் சூசா[a] கோட்டையில் இருந்த தனது அரச அரியணையில் அமர்ந்திருந்தபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சூசான்.’
    reason: இடப்பெயரின் மாற்று ஒலிபெயர்ப்பு.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: அந்த நாட்களில்
  rationale: எபிரெய உரையின் வழக்கமான காலச் சூழல் அறிமுகத்தையும் சுட்டுப்பொருளையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: כְּשֶׁבֶת
  choice: அமர்ந்திருந்தபோது
  rationale: כְּ + வினையெச்சப் பெயர் அமைப்பு தரும் காலப் பொருளைத் தமிழின் இயல்பான காலத் துணைவாக்கியமாக வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு அரசன்
  rationale: தனிப்பெயரைத் தமிழில் பரவலாக அறியப்படும் வடிவில் ஒலிபெயர்த்து, பட்டத்தை இயல்பான தமிழ்ச் சொல்லொழுங்கில் அமைக்கிறது.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: தனது அரச அரியணையில்
  rationale: சொல்லுக்குச் சொல் ‘தனது அரசாட்சியின் அரியணையில்’ என்பதன் அரச அதிகாரப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; உடைமைப் பின்னொட்டையும் காக்கிறது.
- source_word: אֲשֶׁר
  choice: இருந்த
  rationale: அரியணையை விவரிக்கும் தொடர்புத் துணைவாக்கியத்தை இயல்பான தமிழ்ப் பெயரெச்சமாகக் காட்டுகிறது.
- source_word: בְּשׁוּשַׁן
  choice: சூசா
  rationale: பண்டைய இடப்பெயரின் நவீனமாக அறியப்படும் வடிவத்தைப் பயன்படுத்துகிறது; ‘சூசான்’ என்ற நேரடி ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַבִּירָה
  choice: கோட்டை
  rationale: בִּירָה குறிக்கும் அரண்மனை மற்றும் நிர்வாக மையத்தைக் கொண்ட அரண் சூழ்ந்த வளாகத்தைத் தமிழில் தெளிவாகக் குறிக்கிறது; ‘தலைநகர்’ என்பது மிக விரிவான பொருளாகிவிடும்.
