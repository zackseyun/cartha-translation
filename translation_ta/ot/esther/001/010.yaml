base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
translation:
  language: ta
  text: ஏழாம் நாளில், திராட்சரசத்தால் அரசனின் உள்ளம் மகிழ்ந்திருந்தபோது[a], அகாஸ்வேரு அரசனின் முன்னிலையில் பணியாற்றிய மெஹூமான், பிஸ்தா, ஹர்போனா, பிக்தா, அபக்தா, சேதார், கர்காஸ் ஆகிய ஏழு அண்ணகர்களிடம்[b] அவன் கூறினான்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திராட்சரசத்தால் அரசன் உற்சாகமான மனநிலையில் இருந்தபோது.’ எபிரெய மரபுத்தொடர் திராட்சரசத்தால் அரசனின் உள்ளம் மகிழ்ந்ததாகக் கூறுகிறது; அவன் குடிபோதையில் இருந்ததாக வெளிப்படையாகக் கூறவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘அண்ணகர்கள்’ என்பதற்கான எபிரெயச் சொல் சில சூழல்களில் அரசவை அதிகாரிகளைப் பொதுவாகவும் குறிக்கலாம்; இங்கே அதன் நேரடியான பொருள் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: ஏழாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது; ‘விருந்தின்’ என்பது இவ்வசனத்தில் வெளிப்படையாக இல்லை.
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  choice: திராட்சரசத்தால் அரசனின் உள்ளம் மகிழ்ந்திருந்தபோது
  rationale: திராட்சரசத்தின் காரணமாக அரசனின் ‘உள்ளம் நன்றாக/மகிழ்ச்சியாக இருந்தது’ என்ற எபிரெய மரபுத்தொடரின் உருவகத் தன்மையைப் பேணுகிறது; அவன் குடிபோதையில் இருந்தான் என்று மூலத்தைவிட அதிகமாகப் பொருள் கூறுவதில்லை.
- source_word: אָמַר
  choice: அவன் கூறினான்
  rationale: பொதுவான ‘சொன்னான்/கூறினான்’ என்ற பொருளைத் தருகிறது. கட்டளையின் உள்ளடக்கம் அடுத்த வசனத்தில்தான் வருவதால் இங்கே ‘கட்டளையிட்டான்’ என்று மிகைப்படுத்தவில்லை.
- source_word: לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס
  choice: மெஹூமான், பிஸ்தா, ஹர்போனா, பிக்தா, அபக்தா, சேதார், கர்காஸ்
  rationale: தனிப்பெயர்கள் எபிரெய ஒலிவடிவங்களுக்கு நெருக்கமாகவும் தமிழில் வாசிக்க இயலுமாறும் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: שִׁבְעַת הַסָּרִיסִים
  choice: ஏழு அண்ணகர்கள்
  rationale: סָרִיסִים என்பதன் நேரடியான, இச்சூழலுக்குப் பொருத்தமான பொருளைத் தருகிறது; அரசவையில் இது விரிவாக அதிகாரிகளையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי
  choice: முன்னிலையில் பணியாற்றிய
  rationale: அரசரின் முகத்திற்கு முன்பாகச் சேவை செய்தல் என்ற அரசவை மரபுத்தொடரின் தனிப்பட்ட சேவை மற்றும் உடனிருப்பு உணர்வைப் பேணுகிறது.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு அரசன்
  rationale: அரச பட்டத்தையும் பெயரையும் இயல்பான தமிழ் வரிசையில் தருகிறது.
