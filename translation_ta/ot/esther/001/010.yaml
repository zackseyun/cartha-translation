translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான அரசவை நடையைப் பயன்படுத்துகிறது. எபிரெய வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது; அடுத்த வசனத்தின் கட்டளை இங்கே முன்கூட்டியே சேர்க்கப்படவில்லை. ஆலோசனை ஆங்கில உரையில் அடிக்குறிப்பு குறிகள் தவறான சொற்களருகே இருந்ததால், அவை தமிழில் தத்தம் பொருளுக்குரிய இடங்களில் அமைக்கப்பட்டுள்ளன.
