  rationale: அரச நிர்வாகச் சூழலில் பேரரசு முழுவதும் அனுப்பப்பட்ட எழுத்துப்பூர்வமான அதிகாரபூர்வச் செய்திகளைக் குறிக்கிறது.
- source_word: כָּל מְדִינוֹת הַמֶּלֶךְ
