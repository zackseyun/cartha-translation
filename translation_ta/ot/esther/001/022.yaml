  yaml_path: translation/ot/esther/001/022.yaml
  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
translation:
  language: ta
  text: அவர் அரசனுடைய எல்லா மாகாணங்களுக்கும் கடிதங்களை அனுப்பினார்[a]. ஒவ்வொரு மாகாணத்திற்கும் அதற்குரிய எழுத்துமுறையிலும், ஒவ்வொரு மக்களினத்திற்கும் அவரவரது மொழியிலும் அவை அனுப்பப்பட்டன[b]. ஒவ்வோர் ஆணும் தன் வீட்டில் ஆளுகை செலுத்தவும்[c], தன் இன மக்களின் மொழியைப் பேசவும் வேண்டும் என்று அவற்றில் அறிவிக்கப்பட்டது[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனின் எல்லா மாகாணங்களுக்கும்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “ஒவ்வொரு மாகாணத்திற்கும் அதனதன் எழுத்துமுறையின்படி ... ஒவ்வொரு மக்களினத்திற்கும் அதனதன் மொழியின்படி”; அரசாணைக் கடிதங்கள் ஒவ்வொரு மாகாணத்திற்கும் மக்களினத்திற்கும் ஏற்ற எழுத்துமுறை மற்றும் மொழியில் அனுப்பப்பட்டதை இது வலியுறுத்துகிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “ஒவ்வொரு கணவனும் தன் வீட்டை ஆளவும்.” எபிரெய் உரை “ஒவ்வோர் ஆணும்” என்று கூறுகிறது; ஆனால் உடனடியான சூழல் திருமணமும் வீட்டாரின் அதிகாரமும் தொடர்புடையது.
    reason: lexical_alternative
  - marker: d
    text: எபிரெயில், “தன் மக்களின் மொழியின்படி பேசவும்.” இங்குள்ள “மக்கள்” என்பது ஒருவரின் பிள்ளைகளை அல்ல, அவரது இன அல்லது மக்கள் குழுவைக் குறிக்கிறது.
    reason: translation_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அவர் ... அனுப்பினார்
  rationale: Wayyiqtol கதையின் நிகழ்வை முன்னெடுக்கும் இறந்தகால வினை; இயல்பான தமிழ் வாக்கிய அமைப்புக்காக எழுவாய் வெளிப்படையாகத் தரப்பட்டது.
- source_word: סְפָרִים
