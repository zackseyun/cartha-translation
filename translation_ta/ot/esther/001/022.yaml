  rationale: பெயர்ச்சொல் மீளுரைப்பின் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: כִּכְתָבָהּ
  choice: அதனதன் எழுத்துமுறையில்
  rationale: ஒவ்வொரு மாகாணத்திற்கும் உரிய எழுத்து அல்லது வரிவடிவத்தைக் குறிக்கிறது; ‘எழுத்துமுறை’ என்பது நவீனத் தமிழில் தெளிவான சொல்.
- source_word: וְאֶל עַם וָעָם
  choice: ஒவ்வொரு மக்களினத்திற்கும்
  rationale: பேரரசுக்குள் இருந்த மொழி-இனக் குழுக்களைச் சுட்டுகிறது; ‘நாடு’ என்பதைக் காட்டிலும் இங்கு ‘மக்களினம்’ துல்லியமானது.
- source_word: כִּלְשׁוֹנוֹ
  choice: அதனதன் மொழியில்
  rationale: לשון இச்சூழலில் பேசுமொழியைக் குறிக்கிறது; நிர்வாகப் பன்மொழித்தன்மையைத் தெளிவாக்குகிறது.
- source_word: לִהְיוֹת
  choice: வேண்டும் என்று அறிவித்தார்
  rationale: நோக்கம் அல்லது அரசாணையின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் infinitive; தமிழ் அரசாணை நடையில் இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: כָּל אִישׁ
  choice: ஒவ்வோர் ஆணும்
  rationale: எபிரெயில் ஆண்பால் ஒருமை பகிர்ந்தளிக்கும் பொருளில் வருகிறது; திருமண-குடும்பச் சூழலில் ஆண்களையே குறிக்கிறது.
