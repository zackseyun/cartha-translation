  rationale: ஆளுதல் அல்லது மேலாதிக்கம் செலுத்துதல் என்ற participle-இன் பொருளைப் பாதுகாக்கிறது; ‘எஜமானன்’ என்பதிலுள்ள தேவையற்ற சமூகத் தொனியைத் தவிர்க்கிறது.
- source_word: בְּבֵיתוֹ
  choice: தன் வீட்டில்
  rationale: அதிகாரம் செயல்படும் குடும்பச் சூழலைக் குறிக்கிறது; ‘வீட்டின்மேல்’ என்று பொருளை மிகைப்படுத்தாமல் இடம்/செயற்பாட்டுக் களத்தின் நுணுக்கத்தைப் பேணுகிறது.
- source_word: וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: தன் மக்களின் மொழியைப் பேச
