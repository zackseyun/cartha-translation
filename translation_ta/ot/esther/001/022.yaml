- from: அரசனுடைய எல்லா மாகாணங்களுக்கும் அவர் கடிதங்களை அனுப்பினார்[a]. ஒவ்வொரு மாகாணத்திற்கும் அதனதன் எழுத்துமுறையிலும், ஒவ்வொரு மக்களினத்திற்கும் அதனதன் மொழியிலும்[b] அவற்றை அனுப்பி, ஒவ்வோர் ஆணும் தன் வீட்டில் அதிகாரம் செலுத்தவும்[c], தன் மக்களின் மொழியைப் பேசவும்[d] வேண்டும் என்று அறிவித்தார்.
