base_translation:
  language: en
  yaml_path: translation/ot/esther/001/001.yaml
  text: It happened in the days of Ahasuerus—the Ahasuerus who reigned from India to Cush[b][a], over one hundred twenty-seven provinces—
translation:
  language: ta
  text: அகாஸ்வேருவின்[a] நாட்களில் நடந்தது என்னவென்றால்—இந்தியா முதல் கூஷ்[b] வரை நூற்று இருபத்தேழு மாகாணங்களை அரசாண்ட அகாஸ்வேரு இவரே—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயப் பெயரை வரலாற்றில் அடையாளப்படுத்தப்பட்ட பாரசீக அரசனின் பெயராக எடுத்தால், ‘செர்க்செஸ்’ என்றும் வழங்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘கூஷ்’ என்பது பழங்காலப் பிரதேசத்தின் பெயர்; சில மொழிபெயர்ப்புகள் இதை ‘எத்தியோப்பியா’ என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: நடந்ததாவது
  rationale: எபிரெயக் கதைத் தொடக்கத்தை இயல்பான நவீனத் தமிழில் தருகிறது; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலச்சொல் சேர்க்கப்படவில்லை.
- source_word: בִּימֵי
  choice: நாட்களில்
  rationale: கதைநடையின் வழக்கமான காலக் குறிப்பை மூலத்திற்கு நெருக்கமாகவும் தமிழில் புரியும்படியாகவும் தருகிறது.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு
  rationale: எபிரெயப் பெயரின் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது; வரலாற்று அடையாளமான ‘செர்க்செஸ்’ உரைக்குள் திணிக்கப்படவில்லை.
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு இவரே
  rationale: எந்த அகாஸ்வேரு என்பதைக் குறிப்பாக அடையாளப்படுத்தும் மூலத்தின் மறுபெயரிடலைத் தக்கவைக்கிறது.
- source_word: הַמֹּלֵךְ
  choice: அரசாண்ட
  rationale: ஆட்சி செய்தவராக அவரை அடையாளப்படுத்தும் எபிரெயப் பங்கேற்பெயரின் இயல்பான தமிழாக்கம்.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: இந்தியா முதல் கூஷ் வரை
  rationale: הֹדּוּ என்பதற்கான மரபான புவியியல் அடையாளம் ‘இந்தியா’; כּוּשׁ நவீன எத்தியோப்பியா நாட்டுடன் தவறாக ஒப்பிடப்படாமல் பழங்காலப் பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: שֶׁבַע וְעֶשְׂרִים וּמֵאָה
  choice: நூற்று இருபத்தேழு
  rationale: எபிரெய எண்ணை இயல்பான தமிழ் வரிசையில் துல்லியமாக வழங்குகிறது.
- source_word: מְדִינָה
  choice: மாகாணங்கள்
  rationale: பாரசீகப் பேரரசின் நிர்வாகப் பிரிவுகளைக் குறிக்கும் தெளிவான, வழக்கிலுள்ள தமிழ்ச் சொல்.
