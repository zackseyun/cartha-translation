revisions:
- from: ஏனெனில், அரசியைப் பற்றிய இந்தச் செய்தி எல்லாப் பெண்களிடமும் பரவும். அப்போது அவர்கள், ‘அகாஸ்வேரு அரசர் வஸ்தி அரசியைத் தம்முன் அழைத்து வரச் சொன்னார்; ஆனால் அவள் வரவில்லை’ என்று சொல்லி, தங்கள் கணவர்களைத் தங்கள் பார்வையில் அற்பமாகக் கருதுவார்கள்.
  to: ஏனெனில், அரசியின் விஷயம் எல்லாப் பெண்களிடமும் பரவும்; அதனால் அவர்கள், ‘அகாஸ்வேரு அரசர் வஸ்தி அரசியைக் தம்முன் கொண்டு வரச் சொன்னார்; ஆனால் அவள் வரவில்லை’ என்று சொல்லி, தங்கள் கணவர்களைத் தங்கள் பார்வையில் இகழ்வார்கள்.
  rationale: The revision preserves the source’s deliberate breadth in ‘the queen’s matter,’ removes an unsupported demonstrative, and renders ‘to bring’ more directly. The wording continues to reflect the court official’s projected consequence as reported speech rather than as a translator’s judgment.
