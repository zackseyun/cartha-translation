translation_notes:
  register: நவீனத் தரத் தமிழில், அரண்மனைச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. பேச்சுக்குள் உள்ள மேற்கோள் தெளிவாக வைக்கப்பட்டுள்ளது; ஆலோசகரின் அச்சத்தை உரை சொல்வதுபோலவே வழங்கி, அதை மொழிபெயர்ப்பாளரின் மதிப்பீடாக மாற்றவில்லை.
