base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: ta
  text: ஏனெனில், அரசியின் விஷயம் எல்லாப் பெண்களிடமும் பரவும்; அதனால் அவர்கள், ‘அகாஸ்வேரு அரசர் வஸ்தி அரசியைக் தம்முன் கொண்டு வரச் சொன்னார்; ஆனால் அவள் வரவில்லை’ என்று சொல்லி, தங்கள் கணவர்களைத் தங்கள் பார்வையில் இகழ்வார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  choice: அரசியைப் பற்றிய இந்தச் செய்தி
  rationale: דָּבָר என்பதற்கு ‘சொல், செய்தி, விஷயம்’ என்ற பொருள் வரலாம். இங்கு வஸ்தியின் செயலைப் பற்றிய தகவல் பெண்களிடையே பரவுவது சூழலுக்குப் பொருந்துவதால், இயல்பான தமிழில் ‘இந்தச் செய்தி’ என மொழிபெயர்க்கப்பட்டது; ‘நடத்தை’ என்று குறிப்பாக்கப்படவில்லை.
- source_word: יֵצֵא ... עַל כָּל הַנָּשִׁים
  choice: எல்லாப் பெண்களிடமும் பரவும்
  rationale: எழுத்துப்படி ‘எல்லாப் பெண்களிடமும் வெளியே செல்லும்’; தகவல் பரவுவதைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்லாக்கம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן
  choice: தங்கள் கணவர்களைத் தங்கள் பார்வையில் அற்பமாகக் கருதுவார்கள்
  rationale: בזה என்பது இகழ்தல் அல்லது மதிப்பற்றதாகக் கருதுதல். ‘தங்கள் பார்வையில்’ என்ற எபிரெயச் சொற்றொடரின் கோணம் காக்கப்பட்டது.
- source_word: אָמַר לְהָבִיא
  choice: அழைத்து வரச் சொன்னார்
  rationale: மூலத்தில் ‘கட்டளையிட்டார்’ என்பதற்கான வலுவான வினை அல்ல, ‘கொண்டு வரச் சொன்னார்’ என்பதே உள்ளது. தமிழில் நபரை மரியாதையுடன் வரவழைப்பதற்கு ‘அழைத்து வர’ இயல்பானது.
- source_word: לְפָנָיו
  choice: தம்முன்
  rationale: அரசரைக் குறிக்கும் மரியாதைப் பன்மைத் தமிழ்நடையுடன், ‘அவருக்கு முன்பாக’ என்ற மூலப் பொருள் சுருக்கமாகக் காக்கப்பட்டது.
