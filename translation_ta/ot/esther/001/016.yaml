  text: וַ/יֹּ֣אמֶר מומכן לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/הַ/שָּׂרִ֔ים לֹ֤א עַל הַ/מֶּ֨לֶךְ֙ לְ/בַדּ֔/וֹ עָוְתָ֖ה וַשְׁתִּ֣י הַ/מַּלְכָּ֑ה כִּ֤י עַל כָּל הַ/שָּׂרִים֙ וְ/עַל כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֕ר בְּ/כָל מְדִינ֖וֹת הַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
translation:
  language: ta
  text: 'அப்போது மெமூகான் ராஜா மற்றும் அதிகாரிகள் முன்னிலையில் கூறினான்: “வஸ்தி அரசி ராஜாவுக்கு மட்டும் எதிராகத் தவறிழைக்கவில்லை; அகாஸ்வேரு ராஜாவின் எல்லா மாநிலங்களிலும் உள்ள எல்லா அதிகாரிகளுக்கும் எல்லா மக்களினங்களுக்கும் எதிராகவும் தவறிழைத்தாள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையைத் தருகிறது.
- source_word: מומכן
  choice: மெமூகான்
  rationale: தனிப்பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: ராஜாவும் அதிகாரிகளும் இருந்த முன்னிலையில் பேசியதைக் குறிக்கிறது.
- source_word: הַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: பாரசீக அரசவையின் உயர்நிலை ஆட்சிப் பொறுப்பாளர்களைக் குறிக்கும் நவீன, தெளிவான சொல்.
- source_word: עָוְתָה
  choice: தவறிழைத்திருக்கிறாள்
  rationale: இச்சொல் தவறாக அல்லது முறைகேடாக நடந்துகொள்வதைக் குறிக்கிறது; வெறும் தனிப்பட்ட அவமதிப்பாகக் குறுக்காமல் அறச்சுமையைப் பாதுகாக்கிறது.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: வஸ்தி அரசி
  rationale: தமிழில் இயல்பான பெயர்–பட்டம் வரிசை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא עַל הַמֶּלֶךְ לְבַדּוֹ ... כִּי עַל
  choice: ராஜாவுக்கு எதிராக மட்டும் ... இல்லை; ... எதிராகவும்
  rationale: எபிரெயத்தின் ‘ஒருவருக்கு மட்டும் அல்ல, மற்றவர்களுக்கும்’ என்ற திருத்தி விரிவாக்கும் அமைப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: הָעַמִּים
  choice: மக்களினங்கள்
  rationale: பன்மையான עַמִּים என்பதையும் பல இன மக்களைக் கொண்ட பேரரசின் சூழலையும் பாதுகாக்கிறது.
- source_word: מְדִינוֹת
  choice: மாநிலங்கள்
  rationale: பேரரசின் நிர்வாகப் பிரிவுகளைக் குறிக்கும் தெளிவான நவீன தமிழ்ச் சொல்.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு
  rationale: எபிரெயப் பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
