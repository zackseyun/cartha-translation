    rationale: அடிக்குறிப்பு ‘எபிரெய வாக்கியத்தின் சொல் வரிசை’ மாற்று எனக் கூறினாலும், மூலத்தின் ‘எல்லா மாநிலங்களிலும் உள்ள’ கூறையும் அகாஸ்வேருவின் பெயரையும் விடுக்கிறது. மேலும் [a] ‘முன்னிலையில்’ என்ற சொல்லில் வைக்கப்பட்டுள்ளது; ஆனால் அடிக்குறிப்பு வஸ்தி பற்றிய வாக்கியத்திற்கான மாற்றாக உள்ளது. மூலத்தில் உரை வேறுபாடு அல்லது அவசியமான தெளிவின்மை இல்லாததால் அடிக்குறிப்பை நீக்குவது பாதுகாப்பானது.
