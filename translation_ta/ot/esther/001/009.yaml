  text: Queen Vashti also gave a feast for the women in the royal house that belonged to King Ahasuerus[a][b].
translation:
  language: ta
  text: வஸ்தி அரசியும், அகாஸ்வேரு அரசனுக்குரிய அரண்மனையில் பெண்களுக்காக ஒரு விருந்து வைத்தாள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விருந்து’ என்பதற்குப் பதிலாக ‘விருந்துவிழா’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பெரும்பாலும் மது அருந்துதலோடு தொடர்புடைய விருந்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, ‘அரசாட்சியின் வீட்டில்’ அல்லது ‘அரச வீட்டில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: -உம்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட அரசனின் விருந்துடன் இதையும் இணைக்கும் சேர்க்கைப் பொருளை இயல்பான தமிழில் வினையெச்சத் தலைப்போடு வரும் ‘அரசியும்’ என்பதன் ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: வஸ்தி அரசி
  rationale: பெயரைத் தமிழில் ஒலிபெயர்த்து, பட்டத்தை இயல்பான பெயர்-பட்ட வரிசையில் வழங்குகிறது.
- source_word: עָשְׂתָה
  choice: வைத்தாள்
  rationale: எபிரெய வினையின் அடிப்படைப் பொருள் ‘செய்தாள்’ என்றாலும், விருந்துடன் தமிழில் ‘விருந்து வைத்தாள்’ என்பது இயல்பானதும் பொருளுக்கு நெருக்கமானதும் ஆகும்.
- source_word: מִשְׁתֵּה
  choice: ஒரு விருந்து
  rationale: உணவும் பானமும் உடைய கொண்டாட்ட விருந்தைக் குறிக்கும் சொல்லை பொதுவாகவும் தெளிவாகவும் வழங்குகிறது; குடிப்பதுடன் உள்ள தொடர்பு அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: נָשִׁים
  choice: பெண்களுக்காக
  rationale: விருந்து யாருக்காக நடத்தப்பட்டது என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: בֵּית הַמַּלְכוּת
  choice: அரண்மனையில்
  rationale: சொல்லுக்கு நேரான வடிவம் ‘அரசாட்சியின்/அரசருக்குரிய வீடு’; சூழலில் அது அரச அரண்மனையைக் குறிக்கிறது. இயல்பான நவீன தமிழுக்காக ‘அரண்மனை’ தேர்ந்தெடுக்கப்பட்டது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு அரசனுக்குரிய
  rationale: அரண்மனை அரசனுடையது என்ற உறவைக் குறுகிய, இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு
  rationale: எபிரெய வடிவத்தை அடிப்படையாகக் கொண்ட தமிழ் ஒலிபெயர்ப்பு.
