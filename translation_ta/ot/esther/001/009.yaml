translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வஸ்தி அரசியும்’ என்பதில் உள்ள ‘-உம்’ முந்தைய அரச விருந்துடன் உள்ள தொடர்பைப் பாதுகாக்கிறது. ‘அரண்மனை’ வாசகருக்கு இயல்பான இடச்சொல்; எபிரெய மூலத்தின் நேரடி ‘வீடு’ உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிப்பான்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
