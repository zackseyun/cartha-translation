base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
translation:
  language: ta
  text: “நீ போய், சூசானில் இருக்கும் யூதர்கள் எல்லாரையும் ஒன்றுகூட்டி, எனக்காக நோன்பிருங்கள். மூன்று நாட்கள் இரவும் பகலும் சாப்பிடாமலும் குடிக்காமலும் இருங்கள். நானும் என் பணிப்பெண்களும் அதேபோல் நோன்பிருப்போம். அதன்பின், சட்டப்படி அல்லாததாயிருந்தாலும், நான் அரசரிடம் செல்வேன்; நான் அழிந்தால், அழிகிறேன்.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் அழியும்போது, அழிகிறேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சுருக்கமாகவும் வலியுறுத்தலுடனும் உள்ளது; நேரக்கூற்றாகவோ நிபந்தனையாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
