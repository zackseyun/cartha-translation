theological_decisions:
- issue: எஸ்தரின் இறுதி கூற்றின் கால/நிபந்தனை நுணுக்கம்
  choice: நான் அழிந்தால், அழிகிறேன்
  alternative: நான் அழிய வேண்டியிருந்தால், அழிகிறேன் / நான் அழியும்போது, அழிகிறேன்
  rationale: כַאֲשֶׁר என்பதற்கு ‘எப்படி/எப்போது/என்றால்’ போன்ற நுணுக்கங்கள் இருக்கலாம். சூழலில் நிபந்தனைப்போன்ற தமிழ் இயல்பானது; ஆனால் இறையியல் தீர்மானவாதத்தைச் சேர்க்காமல் மூலத்தின் துணிவும் தெளிவின்மையும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; நேரடி உரையின் கண்ணியத்தையும் அவசரத்தையும் காக்கும் எளிய நடை. ‘சூசான்’ என்பது שׁוּשָׁן என்பதற்கான தமிழாக்க ஒலிபெயர்ப்பு. அடிக்குறி குறியீடு தொடர்புடைய இறுதி கூற்றுக்குப் பின் வைக்கப்பட்டுள்ளது.
