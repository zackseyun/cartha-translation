base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy[a] of the written decree issued in Susa for their destruction, to show it to Esther and explain it to her, and to charge her to go to the king, implore his favor, and plead before him on behalf of her people.
translation:
  language: ta
  text: மொர்தெகாய், சூசானில் அவர்களை அழிப்பதற்காகப் பிறப்பிக்கப்பட்டிருந்த எழுத்துப்பூர்வமான அரசாணையின் நகலை[a] அவனிடம் கொடுத்தான். அதை எஸ்தருக்குக் காட்டவும், அவளுக்கு விளக்கிச் சொல்லவும், அவள் தன் மக்களுக்காக அரசனிடம் சென்று அவனுடைய தயவை இறைஞ்சி, அவன் முன்னிலையில் மன்றாடும்படி அவளுக்குக் கட்டளையிடவும் அவனிடம் கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நகல்’ என்று மொழிபெயர்க்கப்பட்டுள்ள பாரசீகக் கடன்சொல், அதிகாரப்பூர்வ ஆவணத்தின் உரையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  choice: எழுத்துப்பூர்வமான அரசாணையின் நகல்
  rationale: பாரசீகக் கடன்சொல் அதிகாரப்பூர்வ ஆவணத்தின் உரையையோ அதன் நகலையோ குறிக்கலாம். முதன்மை உரையில் இயல்பான ‘நகல்’ பயன்படுத்தப்பட்டு, அதன் விரிந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַדָּת
  choice: அரசாணை
  rationale: எஸ்தர் நூலின் பாரசீக அரசவைச் சூழலில் இது பொதுவான ‘சட்டம்’ என்பதைக் காட்டிலும் வெளியிடப்பட்ட அரச ஆணையைக் குறிக்கிறது.
- source_word: נִתַּן בְּשׁוּשָׁן
  choice: சூசானில் ... பிறப்பிக்கப்பட்டிருந்த
  rationale: நிர்வாகச் சூழலில் ஆணை வெளியிடப்பட்டதைக் குறிக்கிறது; தமிழில் முந்தைய நிகழ்வைக் காட்ட ‘பிறப்பிக்கப்பட்டிருந்த’ இயல்பாக உள்ளது.
- source_word: לְהַשְׁמִידָם
  choice: அவர்களை அழிப்பதற்காக
  rationale: ஆணையின் நோக்கத்தையும் உயிரழிக்கும் தீவிரத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וּלְהַגִּיד לָהּ
  choice: அவளுக்கு விளக்கிச் சொல்லவும்
  rationale: ஆவணத்தின் செய்தியை எஸ்தருக்குத் தெரியப்படுத்துவதைச் சூழலுக்கேற்ற தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּלְצַוּוֹת עָלֶיהָ
  choice: அவளிடம் வலியுறுத்திக் கூறும்படி
  rationale: צוה என்பதன் வலுவான கட்டளைத் தன்மையைத் தக்கவைத்தும், மொர்தெகாய் அரச அதிகாரத்தால் கட்டளையிடுவதாகத் தவறாக உணர்த்தாமலும் உள்ளது.
- source_word: לְהִתְחַנֶּן לוֹ
  choice: அவனுடைய தயவை இறைஞ்சி
  rationale: חנן வேரின் தயவு நாடும் பொருளையும் தீவிரமான வேண்டுதலையும் வெளிப்படுத்துகிறது.
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו עַל עַמָּהּ
  choice: தன் மக்களுக்காக ... அவன் முன்னிலையில் மன்றாடவும்
  rationale: அரசனின் முன்னிலையில் மனுச் செய்வதைக் குறிக்கும் அரசவைச் சொற்றொடரையும், எஸ்தரின் மக்களுக்கான பிரதிநிதித்துவ வேண்டுதலையும் இயல்பான தமிழில் தருகிறது.
