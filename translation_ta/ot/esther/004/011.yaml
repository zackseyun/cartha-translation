translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அரசவை நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் சட்ட அறிவிப்பு அமைப்பு காக்கப்பட்டாலும், வாசிப்புத் தெளிவுக்காக நிறுத்தக்குறிகள் பயன்படுத்தப்பட்டுள்ளன. ‘அரசர்’, ‘மாகாணங்கள்’, ‘உள் முற்றம்’, ‘தங்கச் செங்கோல்’ ஆகியவை சூழலுக்கு ஏற்ற இயல்பான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன.
