  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
translation:
  language: ta
  text: '“அரசரின் பணியாளர்கள் அனைவருக்கும், அரசருடைய மாகாணங்களின் மக்களுக்கும் இது தெரியும்: அழைக்கப்படாமல்[a] உள் முற்றத்திற்குள் அரசரிடம் வரும் எந்த ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும், அவருக்கு ஒரே சட்டம்தான்[b]—அவர் கொல்லப்பட வேண்டும். அரசர் யாரை நோக்கித் தங்கச் செங்கோலை நீட்டுகிறாரோ அவர் மட்டும் உயிர்வாழ்வார். ஆனால் நானோ, கடந்த முப்பது நாட்களாக அரசரிடம் செல்ல அழைக்கப்படவில்லை.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அழைக்கப்படாத நிலையில்.’ எபிரெயச் செயப்பாட்டு வினைச்சொல் அரசவைக்கான அதிகாரபூர்வ அழைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது, ‘அவருக்கு ஒரே தீர்ப்புதான்: மரணம்.’ எபிரெய மரபுத்தொடர் இத்தகைய நிலையில் ஒரே சட்டமே பொருந்தும் என்று சொல்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: அரசரின் சேவையில் இருப்பவர்களை விரிவாகக் குறிக்கிறது; இச்சூழலில் ‘அடிமைகள்’ என்பது தேவையற்ற அளவு கட்டுப்பட்ட நிலையைக் குறிக்கும்.
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  choice: அரசருடைய மாகாணங்களின் மக்கள்
  rationale: அரண்மனைப் பணியாளர்களைத் தாண்டி பேரரசின் மாகாணங்களில் வாழும் மக்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: எந்த ஆணாக இருந்தாலும் பெண்ணாக இருந்தாலும்
  rationale: எபிரெய உரையில் இருபாலரும் வெளிப்படையாகக் குறிப்பிடப்படுவதையும், யாருக்கும் விதிவிலக்கு இல்லை என்ற பகிர்ந்தளிக்கும் பொருளையும் காக்கிறது.
- source_word: יָבוֹא אֶל הַמֶּלֶךְ אֶל הֶחָצֵר הַפְּנִימִית
  choice: உள் முற்றத்திற்குள் அரசரிடம் வரும்
  rationale: அரசரை அணுகுவதற்காக அனுமதி கட்டுப்படுத்தப்பட்ட உள் முற்றத்திற்குள் வருவதை இயல்பான அரண்மனைச் சொல்லாட்சியில் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  choice: அழைக்கப்படாமல்
  rationale: קרא என்பதன் செயப்பாட்டு வடிவம் அரசரின் முன்னிலைக்கு அதிகாரபூர்வமாக அழைக்கப்படுவதைக் குறிக்கிறது.
- source_word: אַחַת דָּתוֹ
  choice: அவருக்கு ஒரே சட்டம்தான்
  rationale: ஒவ்வொரு இத்தகைய நிகழ்வுக்கும் மாறாத ஒரே சட்ட முடிவு உண்டு என்ற எபிரெய மரபுத்தொடரின் வடிவத்தையும் வலிமையையும் காக்கிறது.
- source_word: לְהָמִית
  choice: அவர் கொல்லப்பட வேண்டும்
  rationale: இது இயல்பான மரணத்தை அல்ல, சட்டப்படி நிறைவேற்றப்படும் மரண தண்டனையைச் சுட்டுகிறது.
- source_word: יוֹשִׁיט לוֹ הַמֶּלֶךְ אֶת שַׁרְבִיט הַזָּהָב
  choice: அரசர் யாரை நோக்கித் தங்கச் செங்கோலை நீட்டுகிறாரோ
  rationale: அரசரின் சாதகமான தீர்ப்பைக் காட்டும் அரண்மனைச் செயலைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְחָיָה
  choice: அவர் மட்டும் உயிர்வாழ்வார்
  rationale: செங்கோல் நீட்டப்பட்டதன் விளைவாக மரண தண்டனையிலிருந்து தப்பி வாழ்வதைத் தெரிவிக்கிறது; לְבַד குறிக்கும் ஒரே விதிவிலக்கையும் ‘மட்டும்’ வெளிப்படுத்துகிறது.
- source_word: זֶה שְׁלוֹשִׁים יוֹם
  choice: கடந்த முப்பது நாட்களாக
  rationale: நிகழ்காலத்தை எட்டும் முப்பது நாள் காலப்பகுதியை நவீன தமிழில் தெளிவாகக் குறிக்கிறது.
