base_translation:
  language: en
  yaml_path: translation/ot/esther/004/003.yaml
  text: And in every province[a], wherever the king’s word and his decree reached, there was great mourning among the Jews, with fasting and weeping and lamentation; sackcloth and ashes were spread out for many.
translation:
  language: ta
  text: ஒவ்வொரு மாகாணத்திலும், அரசனுடைய வார்த்தையும் அவனுடைய ஆணையும் எங்கெல்லாம் சென்றடைந்தனவோ, அங்கெல்லாம் யூதர்களிடையே பெருந்துக்கம் நிலவியது; அவர்கள் உண்ணாநோன்பிருந்து அழுது புலம்பினார்கள். பலருக்காகச் சாக்குத்துணியும் சாம்பலும் விரிக்கப்பட்டன[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலர் சாக்குத்துணியையும் சாம்பலையும் பயன்படுத்தினார்கள்.” “விரிக்கப்பட்டன” என்பதற்குப் பின் வரும் எபிரெயச் சொற்றொடர் சுருக்கமானது. துக்கத்தின் இந்த அடையாளங்கள் பலருக்காக விரிக்கப்பட்டன என்றோ, பலர் அவற்றைப் பயன்படுத்தினார்கள் என்றோ இதைப் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  choice: ஒவ்வொரு மாகாணத்திலும்
  rationale: எபிரெய மொழியின் பகிர்முறை மறுபதிப்பை இயல்பான நவீனத் தமிழில் முழுமையுணர்வுடன் தெரிவிக்கிறது.
- source_word: מְקוֹם אֲשֶׁר
  choice: எங்கெல்லாம் ... அங்கெல்லாம்
  rationale: அரச ஆணை சென்றடைந்த எல்லா இடங்களிலும் ஒரே நிலை ஏற்பட்டது என்ற பகிர்முறை வலியுறுத்தலைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: அரசனுடைய வார்த்தையும் அவனுடைய ஆணையும்
  rationale: דְּבַר என்பதன் ‘வார்த்தை’ என்ற நேரடியான பொருளையும், דָת என்பதன் அரசச் சட்ட ஆணை என்ற பொருளையும் வேறுபடுத்திப் பாதுகாக்கிறது.
- source_word: מַגִּיעַ
  choice: சென்றடைந்தன
  rationale: அரசனுடைய வார்த்தையும் ஆணையும் மாகாணங்களுக்குப் பரப்பப்பட்டு அங்கு வந்து சேர்ந்ததை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֵבֶל גָּדוֹל לַיְּהוּדִים
  choice: யூதர்களிடையே பெருந்துக்கம் நிலவியது
  rationale: சமூகமெங்கும் காணப்பட்ட ஆழ்ந்த துக்கத்தையும் துக்க அனுசரிப்பையும் குறிக்கிறது.
- source_word: וְצוֹם וּבְכִי וּמִסְפֵּד
  choice: அவர்கள் உண்ணாநோன்பிருந்து அழுது புலம்பினார்கள்
  rationale: மூன்று பெயர்ச்சொற்களையும் தமிழ் நடையில் இயல்பான செயற்பாட்டு தொடராக வழங்கி, உண்ணாமை, அழுகை, முறையான புலம்பல் ஆகிய தனித்த கூறுகளைப் பாதுகாக்கிறது.
- source_word: שַׂק וָאֵפֶר
  choice: சாக்குத்துணியும் சாம்பலும்
  rationale: பண்டைய துக்க அடையாளங்களை சாதாரண நவீன வாசகருக்கும் புரியும்படி நேரடியாகக் குறிப்பிடுகிறது.
- source_word: יֻצַּע לָרַבִּים
  choice: பலருக்காக ... விரிக்கப்பட்டன
  rationale: Hophal வினையின் ‘விரிக்கப்படுதல்/பரப்பப்படுதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; לָרַבִּים என்பதன் நேரடியான ‘பலருக்காக’ என்ற வாசிப்பை முதன்மைப்படுத்துகிறது.
