translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாக்குத்துணி’ என்பது பழமையான ‘இரட்டுத்துணி’ என்பதைவிட உடனடியாகப் புரியும் சொல். மூலத்தின் இறுதி சொற்றொடரிலுள்ள உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
