  rationale: ஒரே எபிரேய வினையால் இணைக்கப்பட்ட இரண்டு இலக்குத் தொடர்களைத் தமிழிலும் ஒரே இயக்க வாக்கியமாக வைத்துள்ளோம். இதனால் ஹத்தாக் மொர்தெகாயிடம் சென்றதும், அந்தச் சந்திப்பு அரசனுடைய வாசலுக்கு முன்பாக இருந்த நகரப் பொது வெளியில் நிகழ்ந்ததும் வெளிப்படுகிறது; மூலத்தில் இல்லாத தனி இருப்புக் கூற்று சேர்க்கப்படவில்லை.
