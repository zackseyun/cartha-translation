- from: மொர்தெகாய் அங்கிருந்து சென்று[a], எஸ்தர் தனக்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் செய்தான்.
  to: மொர்தெகாய் புறப்பட்டுச் சென்று[a], எஸ்தர் மொர்தெகாய்க்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் செய்தான்.
