base_translation:
  language: en
  yaml_path: translation/ot/esther/004/017.yaml
  text: So Mordecai went away and did according to all that Esther had commanded him[a].
translation:
  language: ta
  text: மொர்தெகாய் புறப்பட்டுச் சென்று[a], எஸ்தர் மொர்தெகாய்க்குக் கட்டளையிட்ட எல்லாவற்றின்படியும் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடந்து சென்றான்’ அல்லது ‘தொடர்ந்து சென்றான்.’ எபிரெய வினைச்சொல் சொல்லுக்குச் சொல் ‘கடந்து செல்’ என்று பொருள்படும்; இங்கு எஸ்தர் கட்டளையிட்டதைச் செய்வதற்காக மொர்தெகாய் புறப்பட்டுச் சென்றதை இது பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: அங்கிருந்து சென்று
  rationale: עבר என்பதன் அடிப்படைப் பொருள் ‘கடந்து செல்/செல்’ என்பதாகும். இச்சூழலில், எஸ்தரின் அறிவுறுத்தலை நிறைவேற்ற மொர்தெகாய் அவ்விடத்தைவிட்டுச் சென்றதை இயல்பான தமிழில் இது தெரிவிக்கிறது; எதையோ உடலளவில் ‘கடந்தான்’ என்று தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பதன் நேரடியான ‘செய்’ என்ற பொருளையும் எளிய கதைநடையையும் காக்கிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: எல்லாவற்றின்படியும்
  rationale: மொர்தெகாயின் செயல் எஸ்தர் கூறிய அனைத்திற்கும் ஒத்திருந்தது என்பதையும் כֹּל என்பதன் முழுமையான வலியுறுத்தலையும் சுருக்கமாகக் காக்கிறது.
- source_word: צִוְּתָה
  choice: கட்டளையிட்ட
  rationale: צוה என்பதன் ‘கட்டளையிடு’ என்ற பொருளை நடுநிலையாகவும் நேரடியாகவும் வழங்குகிறது.
- source_word: עָלָיו
  choice: தனக்கு
  rationale: צוה உடன் வரும் על கட்டளை பெறும் நபரைக் குறிக்கிறது. தமிழில் ‘தனக்கு’ என்பது மொர்தெகாயை இயல்பாகச் சுட்டுகிறது.
- source_word: אֶסְתֵּר
  choice: எஸ்தர்
  rationale: தமிழில் பரவலாக அறியப்படும் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல்லின் இடமாற்றப் பொருள் முதன்மை உரையில் இயல்பாகத் தரப்பட்டு, அதன் சொற்பொருள் சார்ந்த மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
