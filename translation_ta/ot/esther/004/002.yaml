base_translation:
  language: en
  yaml_path: translation/ot/esther/004/002.yaml
  text: He came as far as the front of the king’s gate[b][a], because no one could enter the king’s gate clothed in sackcloth.
translation:
  language: ta
  text: அவன் அரசரின் வாசலுக்கு முன்பாகவே வந்தான்[a]; ஏனெனில் சாக்குத் துணியால் ஆன உடை அணிந்து அரசரின் வாசலுக்குள் நுழைய யாருக்கும் அனுமதி இல்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசரின் வாசலுக்கு முன்னால் வரை வந்தான்.” எபிரெயம், அவன் வாசலுக்கு முன்னுள்ள இடம் வரை மட்டுமே வந்ததை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “சாக்குத் துணி உடையுடன் அரசரின் வாசலுக்குள் நுழைவது அனுமதிக்கப்படவில்லை.” இங்குள்ள பொருள், சாக்குத் துணியாலான துக்க உடை அணிந்தவர்கள் உள்ளே செல்லத் தடை இருந்தது என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: அவன் வந்தான்
  rationale: בוא என்பதன் தொடர்கதை வடிவம் மொர்தெகாயின் நகர்வை விவரிக்கிறது; சூழலில் ‘வந்தான்’ இயல்பான தமிழாக உள்ளது.
- source_word: עַד לִפְנֵי
  choice: முன்பாக மட்டும்
  rationale: வாசலுக்கு முன்னுள்ள இடம் வரை அவன் வந்தான், ஆனால் உள்ளே செல்லவில்லை என்ற எல்லையையும் இடப்பொருளையும் இது தெளிவாகக் காட்டுகிறது.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: அரச வாசல்
  rationale: எபிரெயக் கட்டமைப்பின் ‘அரசனுடைய வாசல்’ என்ற பொருளை, அரண்மனைச் சூழலுக்கு ஏற்ற சுருக்கமான நவீன தமிழில் வழங்குகிறது.
- source_word: כִּי אֵין לָבוֹא
  choice: ஏனெனில் ... நுழைய யாருக்கும் அனுமதி இல்லை
  rationale: אֵין + வினையெச்சம் இச்சூழலில் நடைமுறைத் தடை அல்லது அனுமதியின்மையைக் குறிக்கிறது; அவன் வாசலுக்கு முன் நின்றதற்கான காரணத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל שַׁעַר הַמֶּלֶךְ
  choice: அரச வாசலுக்குள்
  rationale: אֶל என்பதன் திசைப்பொருள் இங்கு வாசல் வழியாக அல்லது அதன் வளாகத்திற்குள் செல்வதைக் குறிக்கிறது; ‘உள்ளே’ என்பதை வெளிப்படுத்துவது தமிழில் தெளிவாக உள்ளது.
- source_word: בִּלְבוּשׁ שָׂק
  choice: துக்கவுடை அணிந்துகொண்டு
  rationale: சாக்குத் துணியாலான உடை துக்கத்தின் அடையாளம் என்பதை வாசகருக்குத் தெளிவாக்கும் இயல்பான தமிழ்; துணியின் தன்மையைப் பற்றிய மாற்று வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
