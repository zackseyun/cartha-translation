translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. ‘துக்கவுடை’ என்பது சாக்குத் துணியாலான இரங்கல் உடையின் பண்பாட்டுப் பொருளை இயல்பாகத் தெரிவிக்கிறது; அதன் சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. மூலத்தில் உள்ள அணுகல் எல்லையும் நுழைவுத் தடையும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
