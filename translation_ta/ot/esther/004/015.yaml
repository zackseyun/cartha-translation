  yaml_path: translation/ot/esther/004/015.yaml
  text: Then Esther told them to reply to Mordecai:[a]
translation:
  language: ta
  text: அப்போது எஸ்தர் மொர்தெகாய்க்குப் பதில் அனுப்புமாறு கூறினாள்:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “எஸ்தர் மொர்தெகாயிடம் திரும்பச் சொல்லுமாறு கூறினாள்.” இதன் பொருள், மொர்தெகாய்க்குப் பதில் அனுப்புமாறு அவள் கூறினாள் என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது ... கூறினாள்
  rationale: வாவ்-தொடர்நிலை கதை நிகழ்வை முன்னெடுத்துச் செல்கிறது; ‘அப்போது’ அதன் தொடர்ச்சியை இயல்பான தமிழில் காட்டுகிறது. பெண்பால் வினைமுற்று எழுவாயான எஸ்தருக்கு ஏற்ப உள்ளது.
- source_word: אֶסְתֵּר
  choice: எஸ்தர்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயரெழுத்தாக்கம்.
- source_word: לְהָשִׁיב
  choice: பதில் சொல்லும்படி
  rationale: שׁוב என்பதன் ஹிஃபில் வினையெச்சம் இங்கு ‘பதில் திரும்பச் செய்யுதல்,’ அதாவது பதில் அனுப்புதல் என்ற மொழிவழக்குப் பொருளைக் கொண்டது. ‘பதில் சொல்லும்படி’ என்பது தமிழில் இயல்பாக அந்த மறுமொழிச் செயலை வெளிப்படுத்துகிறது.
- source_word: אֶל
  choice: மொர்தெகாய்க்கு
  rationale: திசை அல்லது பெறுநரைக் குறிக்கும் முன்னிடைச்சொல், தமிழில் நான்காம் வேற்றுமை உருபால் இயல்பாகக் காட்டப்படுகிறது.
- source_word: מָרְדֳּכָי
  choice: மொர்தெகாய்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயரெழுத்தாக்கம்.
