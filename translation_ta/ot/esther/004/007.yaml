source:
  edition: WLC
  text: וַ/יַּגֶּד ל֣/וֹ מָרְדֳּכַ֔י אֵ֖ת כָּל אֲשֶׁ֣ר קָרָ֑/הוּ וְ/אֵ֣ת פָּרָשַׁ֣ת הַ/כֶּ֗סֶף אֲשֶׁ֨ר אָמַ֤ר הָמָן֙ לִ֠/שְׁקוֹל עַל גִּנְזֵ֥י הַ/מֶּ֛לֶךְ ב/יהודיים לְ/אַבְּדָֽ/ם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/007.yaml
  text: Mordecai told him everything that had happened to him[a], and the exact amount of money that Haman had said he would weigh out into the king’s treasuries for the destruction of the Jews.
translation:
  language: ta
  text: மொர்தெகாய் தனக்கு நேரிட்ட எல்லாவற்றையும், யூதர்களை அழிப்பதற்காக அரசனின் கருவூலங்களில் எடைபோட்டுச் செலுத்துவதாக ஆமான் கூறியிருந்த குறிப்பிட்ட பணத்தொகையையும்[a] அவனுக்குத் தெரிவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணத்தைப் பற்றிய முழு விவரத்தையும்” அல்லது “பணத்தொகையையும்.” ஆமான் செலுத்த முன்வந்த குறிப்பிட்ட தொகையை எபிரெயச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: தெரிவித்தான்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவித்தல், சொல்லுதல்’ என்று பொருள்படும்; கதைநடையில் ‘தெரிவித்தான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לוֹ
  choice: அவனிடம்
  rationale: சூழலில் இது அத்தாக்கைக் குறிக்கிறது; எபிரெயச் சுட்டுப்பெயரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  choice: தனக்கு நேரிட்ட எல்லாவற்றையும்
  rationale: קָרָהוּ என்பதில் உள்ள மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு மொர்தெகாயைக் குறிக்கிறது; ‘தனக்கு நேரிட்ட’ என்பது அந்தப் பொருளை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: פָּרָשַׁת הַכֶּסֶף
  choice: பணத்தின் சரியான தொகை
  rationale: פָּרָשָׁה என்பது குறிப்பிட்ட விவரம், துல்லியமான கணக்கு அல்லது தொகையைக் குறிக்கலாம். இச்சூழலில் ஆமான் முன்மொழிந்த குறிப்பிட்ட பணத்தொகையை ‘சரியான தொகை’ தெளிவாக எடுத்துரைக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אָמַר ... לִשְׁקוֹל
  choice: எடைபோட்டுச் செலுத்துவதாகக் கூறியிருந்த
  rationale: பணம் எடையால் அளக்கப்பட்ட concrete imagery-ஐ ‘எடைபோட்டு’ பாதுகாக்கிறது; நோக்கப்பட்ட கட்டணச் செயலை ‘செலுத்துவதாக’ இயல்பான தமிழில் விளக்குகிறது.
- source_word: עַל גִּנְזֵי הַמֶּלֶךְ
  choice: அரசனின் கருவூலங்களில்
  rationale: גִּנְזֵי என்பது பன்மை வடிவம்; பணம் அரச கருவூல அமைப்பில் சேர்க்கப்படுவதை இச்சொற்றொடர் காட்டுகிறது.
- source_word: ביהודיים לְאַבְּדָם
  choice: யூதர்களை அழிப்பதற்காக
  rationale: לְאַבְּדָם என்பது அவர்களை அழிப்பதைக் குறிக்கிறது; அதன் பின்னொட்டு யூதர்களைக் குறிப்பதால் தமிழில் பெயர்ச்சொல்லை மீண்டும் கூறுவது தெளிவானது.
