  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பணத்தை எடைபோடும் உருவகம் காக்கப்பட்டுள்ளது. அடிக்குறி அது விளக்கும் ‘பணத்தின் சரியான தொகை’ என்பதற்குப் பின்னர் வைக்கப்பட்டுள்ளது.
