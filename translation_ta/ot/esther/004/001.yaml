base_translation:
  language: en
  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
translation:
  language: ta
  text: நடந்திருந்த எல்லாவற்றையும் மொர்தெகாய் அறிந்தபோது, அவன் தன் ஆடைகளைக் கிழித்து, சாக்குத்துணியையும் சாம்பலையும் அணிந்துகொண்டான். பின்பு அவன் நகரத்தின் நடுவே சென்று, உரத்ததும் கசப்புமான பெரும் கூக்குரலிட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பெரியதும் கசப்புமான கூக்குரலைக் கூவினான்” என்று, வினைச்சொல்லுடன் அதே வேரிலிருந்து வந்த பெயர்ச்சொல்லும் பயன்படுத்தப்பட்டுள்ளது. இது கூக்குரலின் தீவிரத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַע
  choice: அறிந்தபோது
  rationale: சூழலில் மொர்தெகாய் ஏற்கெனவே அறிந்திருந்த நிலையை மட்டும் அல்லாமல், நடந்தவற்றை அறியவந்த தருணத்தை இது குறிக்கிறது; ‘அறிந்தபோது’ என்பது தமிழில் இயல்பாக அதைக் காட்டுகிறது.
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  choice: நடந்திருந்த எல்லாவற்றையும்
  rationale: எபிரெயத்தின் செயப்பாட்டு வடிவத்தைத் தமிழில் சொற்சொல்லாகக் கடினப்படுத்தாமல், முந்தைய நிகழ்வுகளைக் குறிக்கும் விதத்தில் இயல்பாகத் தருகிறது.
- source_word: וַיִּקְרַע ... אֶת בְּגָדָיו
  choice: தன் ஆடைகளைக் கிழித்து
  rationale: துக்கத்தின் அடையாளமான செயலை நவீனத் தமிழில் தெளிவாகவும் நேரடியாகவும் கூறுகிறது.
- source_word: שַׂק וָאֵפֶר
  choice: சாக்குத்துணியை உடுத்திக்கொண்டு சாம்பலைப் பூசிக்கொண்டான்
  rationale: துக்கத்தையும் தாழ்மையையும் வெளிப்படுத்திய இரு வெளிப்புறச் செயல்களையும் சாதாரண வாசகர் புரிந்துகொள்ளும் வகையில் விளக்கமாகத் தருகிறது.
- source_word: בְּתוֹךְ הָעִיר
  choice: நகரத்தின் நடுவே
  rationale: בְּתוֹךְ என்பதன் இடவியல் பொருளான ‘நடுவில்/மத்தியில்’ என்பதை ‘நகர மையம்’ என்ற கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  choice: பெரிதும் மனங்கசந்து உரக்கக் கதறினான்
  rationale: வினைச்சொல்–அதே வேர்ச்சொல் பெயர்ச்சொல் அமைப்பின் தீவிரத்தை இயல்பான தமிழில் ‘உரக்கக் கதறினான்’ எனவும், גְדֹלָה மற்றும் מָרָה ஆகியவற்றின் வலிமையை ‘பெரிதும் மனங்கசந்து’ எனவும் வெளிப்படுத்துகிறது; மூலத்தின் சொற்றொடர் அடிக்குறிப்பில் தரப்படுகிறது.
