base_translation:
  language: en
  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
translation:
  language: ta
  text: அப்போது எஸ்தர், தனக்குப் பணிவிடை செய்ய அரசன் நியமித்திருந்த அண்ணகர்களில் ஒருவனான ஹத்தாக்கை[a] அழைத்தாள். மொர்தெகாயைப் பற்றி, இது என்ன, இதற்குக் காரணம் என்ன என்பதை அறிந்துகொள்ளும்படி அவனுக்குக் கட்டளையிட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரசனின் அரசவை அதிகாரிகளில் ஒருவன்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் குறிப்பாக அண்ணகரையோ, சில சூழல்களில் பொதுவாக ஓர் அரசவை அதிகாரியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  choice: அப்போது எஸ்தர் ... அழைத்தாள்
  rationale: வழக்குரைக் காலவரிசையை இயல்பான தமிழில் முன்னெடுக்கிறது; לַהֲתָךְ உடன் வரும் வினை ஹத்தாக்கைத் தன் முன்னிலைக்கு அழைப்பதைக் குறிக்கிறது.
- source_word: לַהֲתָךְ
  choice: ஹத்தாக்கை
  rationale: எபிரெய தனிப்பெயர் הֲתָךְ என்பதன் ஒலியை நவீனத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்த்து, வேற்றுமை உருபுடன் வழங்குகிறது.
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  choice: அரசன் நியமித்திருந்த அண்ணகர்களில் ஒருவனான
  rationale: סָרִיס் என்பதன் அரசவைக் சூழலிலுள்ள முதன்மையான, குறிப்பான பொருளைத் தக்கவைக்கிறது; அது பொதுவாக அரசவை அதிகாரியையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  choice: தனக்குப் பணிவிடை செய்ய அரசன் நியமித்திருந்த
  rationale: הֶעֱמִיד என்பதன் மறைமுக எழுவாய் முந்தைய தொடரிலுள்ள அரசன் என இயல்பாகப் புரிகிறது; ‘அவளுக்கு முன்பாக நிறுத்தியிருந்த’ என்ற சொற்சொல் வடிவத்தின் பணியமர்த்தல் மற்றும் சேவை கருத்துகளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  choice: மொர்தெகாயைப் பற்றிய ... அறிந்துவரும்படி அவனுக்குக் கட்டளையிட்டாள்
  rationale: צוה வினையின் கட்டளை வலிமையையும் עַל מָרְדֳּכָי என்பதன் விசாரணைப் பொருளையும் தக்கவைக்கிறது; தமிழின் இயல்பான வாக்கிய அமைப்புக்காக நோக்கத் தொடர் இடையில் அமைக்கப்பட்டுள்ளது.
- source_word: לָדַעַת
  choice: அறிந்துவரும்படி
  rationale: நோக்கத்தைக் குறிக்கும் infinitive; ஹத்தாக் விசாரித்து வந்து தெரிவிக்க வேண்டிய சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַה זֶּה וְעַל מַה זֶּה
  choice: இந்தக் காரியம் என்ன, இதற்குக் காரணம் என்ன
  rationale: இணையான இரு கேள்விகளையும்—நிகழ்வின் தன்மை மற்றும் அதன் காரணம்—வேறுபடுத்திக் காட்டுகிறது; தெளிவற்ற ‘இது’ என்பதைக் சூழலுக்கேற்ற ‘இந்தக் காரியம்’ என இயல்பாக்கினாலும், காரணத்தை அளவுக்கு மீறி விளக்கவில்லை.
