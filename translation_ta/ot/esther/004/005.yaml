translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அண்ணகர்’ என்பது இன்றைய பொதுப் பேச்சில் அரிதாக இருந்தாலும், மூலச்சொல்லின் குறிப்பான அரசவைக் கருத்தைச் சுருக்கமாகத் தக்கவைக்கிறது; அதன் பரந்த பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டாகப் பிரிக்கப்பட்டுள்ளது.
