  text: And they told Mordecai Esther’s words[a].
translation:
  language: ta
  text: அவர்கள் எஸ்தரின் வார்த்தைகளை[a] மொர்தெகாயிடம் தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எஸ்தரின் செய்தியை’ அல்லது ‘எஸ்தரின் பதிலை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: தெரிவித்தார்கள்
  rationale: נגד என்பதன் ஹிஃபில் தொடர் இறந்தகால வடிவம் அடுத்த கதை நிகழ்வைச் சுட்டுகிறது; எழுவாய் குறிப்பிடப்படாத பன்மையைத் தமிழில் இயல்பாகப் பிரதிபலிக்கிறது. ‘சொன்னார்கள்’ என்பதும் சாத்தியம்; ஆனால் செய்தியை ஒருவரிடம் கொண்டு சேர்த்த சூழலை ‘தெரிவித்தார்கள்’ தெளிவாகக் காட்டுகிறது.
- source_word: לְמָרְדֳּכָי
  choice: மொர்தெகாயிடம்
  rationale: לְ மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது; தமிழில் ‘-இடம்’ வேற்றுமை உருபுடன் இயல்பாக வழங்கப்படுகிறது. பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֵת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது எபிரெய மொழியின் நேரடிச் செயப்படுபொருள் குறியீடு; தமிழில் இதற்குத் தனிச் சொல் தேவையில்லை, வாக்கிய அமைப்பே அதன் செயல்பாட்டை வெளிப்படுத்துகிறது.
- source_word: דִּבְרֵי
  choice: வார்த்தைகளை
  rationale: דָּבָר என்பதன் இணைநிலைப் பன்மை இங்கு ‘வார்த்தைகள்’, ‘செய்தி’, அல்லது சூழலின்படி ‘பதில்’ எனப் பொருள்படலாம். ‘வார்த்தைகள்’ மூலத்தின் வடிவத்தையும் எஸ்தர் கூறியவற்றின் உள்ளடக்கத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֶסְתֵּר
  choice: எஸ்தரின்
  rationale: דִּבְרֵי אֶסְתֵּר என்ற இணைநிலைத் தொடர்பு தமிழில் ஆறாம் வேற்றுமையான ‘எஸ்தரின்’ என்று இயல்பாக வழங்கப்படுகிறது.
