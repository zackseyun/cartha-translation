translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் குறிப்பிடப்படாத பன்மை எழுவாய் ‘அவர்கள்’ எனவும், דִּבְרֵי என்பதிலுள்ள சொற்பொருள் நெகிழ்வு அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
