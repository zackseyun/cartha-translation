base_translation:
  language: en
  yaml_path: translation/ot/esther/004/009.yaml
  text: So Hathach came and told Esther the words of Mordecai[a].
translation:
  language: ta
  text: அத்தாகு வந்து, மொர்தெகாயின் வார்த்தைகளை[a] எஸ்தரிடம் தெரிவித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மொர்தெகாயின் செய்தியை” அல்லது “மொர்தெகாய் சொன்னவற்றை.” எபிரெய மொழியில் சொல்லுக்குச் சொல் “மொர்தெகாயின் வார்த்தைகளை” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּב֖וֹא
  choice: வந்து
  rationale: בוא என்பது ‘வருதல்/செல்லுதல்’ என்ற இயக்கத்தைக் குறிக்கும். மொர்தெகாயிடம் சென்ற அத்தாகு எஸ்தரிடம் திரும்பிவரும் சூழலைத் தமிழில் ‘வந்து’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲתָ֑ךְ
  choice: அத்தாகு
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியை நவீனத் தமிழில் வாசிக்க ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
- source_word: וַיַּגֵּ֣ד
  choice: தெரிவித்தான்
  rationale: נגד என்பதன் Hiphil வடிவம் ‘அறிவித்தல், தெரிவித்தல், சொல்லுதல்’ என்று பொருள்படும். தூதர் செய்தியை மீண்டும் எடுத்துரைக்கும் இச்சூழலில் ‘தெரிவித்தான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לְאֶסְתֵּ֔ר
  choice: எஸ்தரிடம்
  rationale: לְ குறிக்கும் மறைமுகச் செயப்படுபொருளைத் தமிழில் இயல்பான ‘-இடம்’ வேற்றுமையால் வெளிப்படுத்துகிறது.
- source_word: אֵ֖ת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழ்ச் சொற்றொடர் அமைப்பிலேயே அதன் பணி வெளிப்படுகிறது.
- source_word: דִּבְרֵ֥י
  choice: வார்த்தைகளை
  rationale: דָּבָר என்பதன் பன்மை இணைப்பு வடிவம்; ‘வார்த்தைகள்’ மூலத்தின் வடிவத்தையும் ‘செய்தி/சொன்னவை’ என்ற பொருள் விரிவையும் காணக்கூடியவாறு காக்கிறது.
- source_word: מָרְדֳּכָֽי
  choice: மொர்தெகாய்
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் நிலைபெற்ற வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
