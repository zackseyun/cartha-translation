translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான வினை அமைப்பு தமிழில் இயல்பான ‘வந்து ... தெரிவித்தான்’ என வழங்கப்பட்டுள்ளது; [a] குறிப்பு மூலத்திலுள்ள דִּבְרֵי என்ற சொல்லின் உண்மையான மொழிபெயர்ப்பு வாய்ப்புகளைப் பாதுகாக்கிறது.
