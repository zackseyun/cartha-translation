  text: Then Mordecai said to reply to Esther, “Do not imagine that you alone of all the Jews will escape in the king’s house.
translation:
  language: ta
  text: 'அப்போது மொர்தெகாய் எஸ்தருக்குப் பதில் சொல்லும்படி கூறினார்: “அரசனின் அரண்மனையில் இருந்து, மற்ற எல்லா யூதர்களையும் விட நீ மட்டுமே தப்பித்துக்கொள்வாய் என்று நினைக்காதே.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהָשִׁיב אֶל־אֶסְתֵּר
  choice: எஸ்தருக்குப் பதில் சொல்லும்படி
  rationale: எஸ்தரிடம் பதில் திரும்பச் சொல்லப்படுவதைக் குறிக்கும் எபிரெயச் சொற்றொடரின் மறைமுகத் தகவலனுப்பும் அமைப்பைப் பாதுகாக்கிறது.
- source_word: אַל־תְּדַמִּי בְנַפְשֵׁךְ
  choice: என்று நினைக்காதே
  rationale: சொல்லுக்கு சொல் ‘உன் உள்ளத்தில் எண்ணாதே’; நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் பொருளைத் தருகிறது.
- source_word: לְהִמָּלֵט
  choice: தப்பித்துக்கொள்வாய்
  rationale: ஆபத்திலிருந்து உயிர்தப்புதல் என்ற nifal வடிவின் பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரண்மனையில் இருப்பதால்
  rationale: சொற்பொருள் ‘அரசனின் வீட்டில்’; இச்சூழலில் அரச அரண்மனையைக் குறிக்கிறது. எஸ்தர் அங்கே இருப்பதையே தப்புவதற்கான காரணமாக எண்ண வேண்டாம் என்ற வாக்கியத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்த ‘இருப்பதால்’ சேர்க்கப்பட்டுள்ளது.
- source_word: מִכָּל־הַיְּהוּדִים
  choice: யூதர்கள் எல்லாரிலும் நீ மட்டும்
  rationale: ஒப்பீட்டு/விலக்குப் பொருளைச் சுமக்கும் מִן அமைப்பை, மற்ற யூதர்களிலிருந்து எஸ்தர் மட்டும் தப்புவாள் என்ற எண்ணமாகத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: எஸ்தரின் அரண்மனை நிலை அவளுக்கு விதிவிலக்கு அளிக்குமா
  choice: ‘நீ மட்டும் ... தப்பித்துக்கொள்வாய் என்று நினைக்காதே’
  alternative: ‘மற்ற எல்லா யூதர்களைவிட நீ அரண்மனையில் தப்புவாய் என்று நினைக்காதே’
  rationale: மூலத்தின் எச்சரிக்கையைப் பாதுகாத்து, அரண்மனை பாதுகாப்பு உறுதியானது என்ற முடிவை மறுக்கிறது; மறைமுகமான தெய்வீகக் காரணத்தை இவ்வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் கதையாடல் செறிவும் கொண்ட நேரடியான நடை. ‘மொர்தெகாய்’ மற்றும் ‘எஸ்தர்’ என்ற பரவலாக அறியப்பட்ட பெயர்வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
