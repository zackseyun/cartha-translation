revisions:
- from: ஏனெனில், இந்நேரத்தில் நீ தொடர்ந்து மௌனமாக இருந்தால், யூதர்களுக்கு வேறொரு இடத்திலிருந்து நிம்மதியும் விடுதலையும் எழும்பும்; ஆனால் நீயும் உன் தந்தையின் குடும்பமும் அழிந்துபோவீர்கள். இப்படிப்பட்ட ஒரு காலத்திற்காகவே நீ அரசிப் பதவிக்கு வந்திருக்கிறாயோ—யாருக்குத் தெரியும்?
  to: ஏனெனில், இந்நேரத்தில் நீ தொடர்ந்து மௌனமாக இருந்தால், யூதர்களுக்கு வேறொரு இடத்திலிருந்து நிவாரணமும் விடுதலையும் எழும்; ஆனால் நீயும் உன் தந்தையின் வீட்டாரும் அழிந்துபோவீர்கள். இப்படிப்பட்ட காலத்திற்காக நீ அரசிப் பதவிக்கு வந்திருக்கிறாயோ, யாருக்குத் தெரியும்?
  rationale: The revision sharpens the sense of relief from danger, represents ‘father’s house’ as a household/kin group in idiomatic Tamil, and removes an unwarranted emphatic particle from the final deliberately tentative question. It retains the Hebrew’s indirect wording and does not make divine agency explicit.
