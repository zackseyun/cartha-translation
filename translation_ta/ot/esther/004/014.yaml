reference: Esther 4:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you remain silent at this time, relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have come to your royal position for a time like this?
translation:
  language: ta
  text: ஏனெனில், இந்நேரத்தில் நீ தொடர்ந்து மௌனமாக இருந்தால், யூதர்களுக்கு வேறொரு இடத்திலிருந்து நிவாரணமும் விடுதலையும் எழும்; ஆனால் நீயும் உன் தந்தையின் வீட்டாரும் அழிந்துபோவீர்கள். இப்படிப்பட்ட காலத்திற்காக நீ அரசிப் பதவிக்கு வந்திருக்கிறாயோ, யாருக்குத் தெரியும்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: ஏனெனில், ... இருந்தால்
  rationale: முந்தைய வசனத்தோடு இணைக்கும் விளக்கத் தன்மையையும் நிபந்தனைப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  choice: நீ தொடர்ந்து மௌனமாக இருந்தால்
  rationale: வினையெச்ச முழுவடிவம் தரும் வலியுறுத்தலையும், பேசாமல் நீடிப்பதைக் குறிக்கும் சூழலையும் வெளிப்படுத்துகிறது.
- source_word: בָּעֵת הַזֹּאת
  choice: இந்நேரத்தில்
  rationale: தற்போதைய நெருக்கடியான நேரத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: רֶוַח
  choice: நிம்மதி
  rationale: ஆபத்திலிருந்து கிடைக்கும் ஓய்வு அல்லது நெருக்கடி நீக்கத்தைப் பொதுவான நவீன தமிழில் குறிக்கிறது.
- source_word: וְהַצָּלָה
  choice: விடுதலை
  rationale: அழிவு அச்சுறுத்தலிலிருந்து காப்பாற்றப்படுவதைச் சுட்டுகிறது; இச்சூழலில் தேவையற்ற கோட்பாட்டுச் சாயலைச் சேர்க்காது.
- source_word: יַעֲמֹד
  choice: எழும்பும்
  rationale: உதவி வேறொரு திசையிலிருந்து தோன்றி செயல்படும் என்ற எபிரேயச் சொல்லாட்சியை நெருக்கமாகக் காக்கிறது.
- source_word: לַיְּהוּדִים
  choice: யூதர்களுக்கு
  rationale: பாரசீகப் பேரரசில் வாழ்ந்த யூத மக்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: מִמָּקוֹם אַחֵר
  choice: வேறொரு இடத்திலிருந்து
  rationale: விடுதலையின் மூலத்தைத் திட்டவட்டமாக அடையாளப்படுத்தாமல் நிற்கும் மூலமொழியின் மறைமுகத் தன்மையைப் பாதுகாக்கிறது.
- source_word: וְאַתְּ וּבֵית אָבִיךְ
  choice: ஆனால் நீயும் உன் தந்தையின் குடும்பமும்
  rationale: எபிரேய உறவுமுறைச் சொல்லான ‘தந்தையின் வீடு’ என்பதன் குடும்ப மற்றும் வம்சச் சார்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תֹּאבֵדוּ
  choice: அழிந்துபோவீர்கள்
  rationale: மரணத்தையும் குடும்ப அழிவையும் உள்ளடக்கக்கூடிய வினையின் பரந்த, கடுமையான பொருளைக் காக்கிறது.
- source_word: וּמִי יוֹדֵעַ
  choice: யாருக்குத் தெரியும்?
  rationale: உறுதியான அறிவிப்பாக மாற்றாமல், சாத்தியத்தை முன்வைக்கும் வினாவாக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: אִם לְעֵת כָּזֹאת הִגַּעַתְּ לַמַּלְכוּת
  choice: இப்படிப்பட்ட ஒரு காலத்திற்காகவே நீ அரசிப் பதவிக்கு வந்திருக்கிறாயோ
  rationale: எஸ்தர் அரச நிலையை அடைந்ததையும், அதற்குப் பின்னால் இருக்கக்கூடிய நோக்கத்தையும் உறுதிப்படுத்தாமல் சாத்தியமாகவே முன்வைக்கிறது.
theological_decisions:
- issue: ‘வேறொரு இடத்திலிருந்து’ மற்றும் ‘இப்படிப்பட்ட ஒரு காலத்திற்காகவே’ என்பவற்றில் மறைமுகமாகத் தோன்றும் இறைநடத்துதல்
  choice: மூலமொழியைப் போலவே கடவுளை வெளிப்படையாகப் பெயரிடாமல் மறைமுகச் சொல்லாட்சியைப் பேணுதல்
  alternative: ‘கடவுளிடமிருந்து’ அல்லது ‘கடவுளின் திட்டத்தின்படி’ என்று வெளிப்படையாக்குதல்
  rationale: இந்த வசனம் இறைநடத்துதலை வலுவாக உணர்த்தினாலும், எபிரேய உரை கடவுளை இங்கு வெளிப்படையாகக் குறிப்பிடவில்லை. எனவே அந்த இறையியல் அழுத்தத்தையும் தெளிவின்மையையும் மொழிபெயர்ப்பு அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். எஸ்தரிடம் ஒருமையில் பெண்பாலாகப் பேசும் சூழல் தமிழில் இயல்பாக வெளிப்படுகிறது. ‘அரசிப் பதவி’ என்பது ‘ராஜ்யம்’ என்ற தவறான இடப்பொருளைத் தவிர்த்து, எஸ்தர் அடைந்த அரச நிலையைக் குறிக்கிறது.
