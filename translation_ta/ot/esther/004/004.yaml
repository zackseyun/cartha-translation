base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
translation:
  language: ta
  text: எஸ்தரின் இளம்பெண்களும்[a] அவளுடைய அண்ணகர்களும்[b] வந்து அவளுக்குத் தெரிவித்தார்கள். அப்போது அரசி மிகவும் கலக்கமடைந்தாள். மொர்தெகாய்க்கு உடை அணிவிக்கவும், அவனிடமிருந்து அவனுடைய சாக்குத்துணி ஆடையை[c] அகற்றவும் அவள் உடைகளை அனுப்பினாள். ஆனால் அவன் அவற்றை ஏற்றுக்கொள்ளவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இளம்பெண்கள்’ என்பதற்கு ‘பெண் பணியாளர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அண்ணகர்கள்’ என்பது ஆண்மை நீக்கப்பட்ட அரண்மனை அலுவலர்களைக் குறிக்கிறது. சில சூழல்களில் மூலச்சொல் பொதுவாக அரசவை அலுவலர்களையும் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: ‘சாக்குத்துணி ஆடை’ என்பது துக்கம், வேதனை அல்லது அவமானத்தின் அடையாளமாக அணியப்பட்ட கரடுமுரடான துணியால் செய்யப்பட்ட ஆடை.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹת
  choice: இளம்பெண்கள்
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருளைத் தக்கவைக்கிறது; அரண்மனைச் சூழலில் எஸ்தருக்குப் பணிவிடை செய்த இளம்பெண்களைக் குறிக்கிறது.
- source_word: וְסָרִיסֶיהָ
  choice: அவளுடைய அண்ணகர்கள்
  rationale: அரசவைகளில் பணியாற்றிய ஆண்மை நீக்கப்பட்ட அலுவலர்களைக் குறிக்கும் சொல்லின் குறிப்பான வரலாற்றுப் பொருளைத் தக்கவைக்கிறது.
- source_word: וַיַּגִּידוּ לָהּ
  choice: வந்து அவளிடம் இதைத் தெரிவித்தார்கள்
  rationale: வந்து அறிவித்தனர் என்ற எபிரெயக் கதைநகர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சூழலால் விளங்கும் செய்தியைத் தமிழில் ‘இதை’ எனத் தெளிவாக்குகிறது.
- source_word: וַתִּתְחַלְחַל
  choice: மிகவும் கலக்கமடைந்தாள்
  rationale: கடுமையான உள்ளக் கிளர்ச்சி அல்லது அதிர்ச்சியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: הַמַּלְכָּה
  choice: அரசி
  rationale: எஸ்தரின் அரசப் பதவியைக் குறிக்கும் தெளிவான, இயல்பான தமிழ்ச் சொல்.
- source_word: בְּגָדִים
  choice: உடைகள்
  rationale: நவீன வாசகர்களுக்கு இயல்பாகவும் அரண்மனைச் சூழலுக்கு ஏற்ற கண்ணியத்துடனும் உள்ளது.
- source_word: לְהַלְבִּישׁ אֶת מָרְדֳּכַי
  choice: மொர்தெகாய்க்கு உடைகள் அணிவித்து
  rationale: மொர்தெகாயை உடையணியச் செய்வதற்கான நோக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּלְהָסִיר שַׂקּוֹ מֵעָלָיו
  choice: அவன் உடுத்தியிருந்த துக்கவுடையை அகற்றுவதற்காக
  rationale: அவனிடமிருந்து சாக்குத் துணியை அகற்றுதல் என்ற செயலை இயல்பான தமிழில் தருகிறது; அதன் துக்க அடையாளப் பயன்பாட்டையும் வாசகருக்குப் புரியுமாறு வெளிப்படுத்துகிறது.
- source_word: שַׂקּוֹ
  choice: அவன் உடுத்தியிருந்த துக்கவுடை
  rationale: שַׂק என்பது துக்கத்தின் அடையாளமாக அணிந்த கரடுமுரடான சாக்குத் துணி ஆடை; ‘துக்கவுடை’ வாசிப்பில் தெளிவை அளிக்கிறது, அடிக்குறிப்பு அதன் பொருட்சார்ந்த தன்மையை விளக்குகிறது.
- source_word: וְלֹא קִבֵּל
  choice: ஆனால் அவன் அவற்றை ஏற்றுக்கொள்ளவில்லை
  rationale: மறைமுகமாக உள்ள பொருள் உடைகள் என்பதை ‘அவற்றை’ எனத் தெளிவுபடுத்தி, அவன் மறுத்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
