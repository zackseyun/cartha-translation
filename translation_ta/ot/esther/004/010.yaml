  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கட்டளையிட்டாள்’ என்பது மூலவினையின் வலிமையைப் பாதுகாக்கிறது; தமிழில் முழுமையற்றதாக ஒலிக்கக்கூடிய எபிரெயச் சுருக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
