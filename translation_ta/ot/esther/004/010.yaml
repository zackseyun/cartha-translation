  text: Then Esther spoke to Hathach and commanded him to go to Mordecai[a].
translation:
  language: ta
  text: அப்போது எஸ்தர் ஹத்தாக்கிடம் பேசி, மொர்தெகாயிடம் போகும்படி அவனுக்குக் கட்டளையிட்டாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அப்போது எஸ்தர் ஹத்தாக்கிடம் சொல்லி, அவனுக்கு மொர்தெகாயிடம் கட்டளையிட்டாள்.” எபிரெயத்தில் “போகும்படி” என்ற வினை வெளிப்படையாக இல்லை; ஹத்தாக் மொர்தெகாயிடம் செல்லும்படி எஸ்தர் கட்டளையிட்டாள் என்பது பொருளில் உட்குறிப்பாக உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது எஸ்தர் ... பேசி
  rationale: தொடர்நிகழ்வைக் குறிக்கும் வாவ் வடிவத்தை ‘அப்போது’ எனவும், אמר என்பதைக் சூழலுக்கு இயல்பாக ‘பேசி’ எனவும் மொழிபெயர்க்கிறது.
- source_word: אֶסְתֵּר
  choice: எஸ்தர்
  rationale: தமிழில் வழக்கிலுள்ள வேதாகமப் பெயர் வடிவம்.
- source_word: לַהֲתָךְ
  choice: அதாக்கிடம்
  rationale: ל முன்னிடைச்சொல் இங்கு எஸ்தர் யாரிடம் பேசினாள் என்பதைக் குறிக்கிறது; பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַתְּצַוֵּהוּ
  choice: அவனுக்குக் கட்டளையிட்டாள்
  rationale: צוה என்பதன் பியேல் வடிவத்திலுள்ள கட்டளையின் வலிமையைப் பாதுகாக்கிறது; ஆண்பால் ஒருமை பின்னொட்டு அதாக்கைக் குறிக்கிறது.
- source_word: אֶל
  choice: போகும்படி ... இடம்
  rationale: எபிரெயத்தில் சொல்லுக்குச் சொல் ‘நோக்கி/இடம்’ என்றிருந்தாலும், கட்டளையின் உள்ளடக்கமாகச் செல்லுதலைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘போகும்படி’ சேர்க்கப்பட்டுள்ளது.
- source_word: מָרְדֳּכָי
  choice: மொர்தெகாய்
  rationale: தமிழில் பரவலாக அறியப்படும் வேதாகமப் பெயர் வடிவம்.
