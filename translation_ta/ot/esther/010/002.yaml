base_translation:
  language: en
  yaml_path: translation/ot/esther/010/002.yaml
  text: And all the acts of his power and might[a], and the full account of the greatness of Mordecai, to which the king raised him—are they not written in the Book of the Chronicles of the Kings of Media and Persia?
translation:
  language: ta
  text: அவனுடைய அதிகாரம் மற்றும் வல்லமையின் எல்லாச் செயல்களும், அரசன் மொர்தெகாய்க்கு அளித்த மேன்மையைப் பற்றிய விரிவான விவரமும், மேதியா மற்றும் பெர்சிய அரசர்களின் நாளாகமப் புத்தகத்தில்[a] எழுதப்பட்டுள்ளன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேதியா மற்றும் பெர்சிய அரசர்களின் ஆண்டுக் குறிப்புப் புத்தகத்தில்.”
    reason: סֵפֶר דִּבְרֵי הַיָּמִים என்பது அதிகாரப்பூர்வ ஆண்டுக் குறிப்புகள் அல்லது அரச நாளேட்டைக் குறிக்கவும் পারে.
lexical_decisions:
- source_word: מַעֲשֵׂה תָקְפּוֹ וּגְבוּרָתוֹ
  choice: அவனுடைய அதிகாரத்தையும் வல்லமையையும் வெளிப்படுத்திய செயல்கள்
  rationale: מַעֲשֵׂה என்பது செய்யப்பட்ட செயல்களைக் குறிக்கிறது. תֹּקֶף அரச அதிகாரம் அல்லது ஆற்றலையும், גְּבוּרָה வல்லமை அல்லது வீர ஆற்றலையும் குறிக்கும். தமிழில் இயல்பாகவும் இணைச்சொற்களின் வேறுபாட்டைத் தக்கவைத்தும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וּפָרָשַׁת
  choice: முழு விவரம்
  rationale: இந்தச் சொல் விரிவாக எடுத்துரைக்கப்பட்ட பதிவு அல்லது விவரத்தைக் குறிக்கிறது; அதிகாரப்பூர்வ வரலாற்றுப் பதிவின் சூழலில் ‘முழு விவரம்’ இயல்பாக உள்ளது.
- source_word: גְּדֻלַּת מָרְדֳּכַי אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ
  choice: மொர்தெகாயின் மேன்மையையும் அரசன் அவனை உயர்த்திய விதத்தையும் பற்றிய
  rationale: גְּדֻלָּה மொர்தெகாயின் மேன்மை அல்லது உயர்ந்த நிலையைச் சுட்டுகிறது; பியேல் வடிவான גִּדְּלוֹ அரசன் அவனைப் பெரியவனாக்கினான் அல்லது பதவியில் உயர்த்தினான் என்பதைக் குறிக்கிறது. தமிழில் தெளிவாக வாசிக்க இரு கூறுகளும் வெளிப்படையாகத் தரப்பட்டன.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன அல்லவா?
  rationale: எபிரெய உரையின் வழக்கமான வரலாற்று மேற்கோள் வினா வடிவத்தையும் அதன் வலியுறுத்தலையும் தக்கவைக்கிறது.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: நாளாகமப் புத்தகம்
  rationale: நாட்கள் அல்லது கால நிகழ்வுகளைப் பதிவு செய்த அதிகாரப்பூர்வ அரச வரலாற்று நூலைக் குறிக்கும் சொல்லாக்கம்; ‘ஆண்டுக் குறிப்புப் புத்தகம்’ என்ற மாற்றும் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְמַלְכֵי מָדַי וּפָרָס
  choice: மேதியா மற்றும் பெர்சிய அரசர்களின்
  rationale: לְ இங்கு அந்த அரசர்களுக்குரிய அல்லது அவர்களுடைய ஆட்சிகளைப் பற்றிய அதிகாரப்பூர்வ பதிவைக் குறிக்கிறது; தமிழில் உடைமைத் தொடர்பு இயல்பானது.
