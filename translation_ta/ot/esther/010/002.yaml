translation_notes:
  register: நவீன நிலையான தமிழில், அரச வரலாற்றுச் சுருக்கத்திற்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் சொல்லாட்சியைப் பின்பற்றி ‘அவன்’ என்ற பிரதிப்பெயர் தக்கவைக்கப்பட்டுள்ளது; சூழலில் அது அரசனைச் சுட்டுகிறது. வினாவாக்கிய வடிவமும் இணைச்சொற்களின் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
