translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தம்’ என்ற மரியாதைமிக்க தற்சுட்டுப் பெயர் தொடர்ச்சியாகப் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பங்கேற்புவினைகளின் தொடர்ச்சியான செயற்பாட்டு நுணுக்கத்தை ‘நாடி’ மற்றும் ‘பேசிவந்தார்’ மூலம் வெளிப்படுத்தியுள்ளது; ‘சமாதானத்தைப் பேசுதல்’ என்ற செமித்திய உருவகம் அதன் பொருள் பரப்பைச் சுருக்காமல் தக்கவைக்கப்பட்டுள்ளது.
