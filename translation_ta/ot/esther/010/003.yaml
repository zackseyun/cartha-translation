  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
translation:
  language: ta
  text: ஏனெனில், யூதனாகிய மொர்தெகாய் அகாஸ்வேரு அரசருக்கு அடுத்த இரண்டாம் நிலையில் இருந்தார்; யூதர்களிடையே மேன்மை பெற்றவராகவும், தம் சகோதரர்களில் பெருந்திரளானோரால் விரும்பப்பட்டவராகவும் இருந்தார்.[a][b] அவர் தம் மக்களின் நன்மையை நாடி, தம் சந்ததியார் அனைவருக்கும் சமாதானத்தைப் பேசினார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தம் சகோதரர்களில் பெரும்பான்மையோரால் விரும்பப்பட்டவராக.’ எபிரெயச் சொற்றொடர் ஒரு பெருந்திரளையோ பெரும்பான்மையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘சகோதரர்கள்’ என்பது உடன்பிறந்த ஆண்களை மட்டும் அல்லாமல், சக யூதர்களையோ உறவினர்களையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘தம் வழித்தோன்றல்கள் அனைவருக்கும்.’ எபிரெய மொழியில் ‘சந்ததி’ என்பதற்கான சொல் கூட்டுப்பொருளில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: (தனி இணைப்புச்சொல்லாக மொழிபெயர்க்கப்படவில்லை)
  rationale: இது முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்துகிறது. தனி வசனமாக வாசிக்கப்படும் இயல்பான தமிழில் ‘ஏனெனில்’ என்பது முழுமையற்றதாகத் தோன்றுவதால், விளக்கத் தொடர்பை வாக்கிய அமைப்பிலேயே வைத்துள்ளது.
- source_word: הַיְּהוּדִי
  choice: யூதனாகிய
  rationale: பாரசீகச் சூழலில் மொர்தெகாயின் இன-சமய அடையாளத்தைக் குறிக்கிறது; புவியியல் சார்ந்த ‘யூதேயன்’ என்பதைவிட ‘யூதன்’ சூழலுக்குப் பொருத்தமானது.
- source_word: מִשְׁנֶה לַמֶּלֶךְ
  choice: அகாஸ்வேரு அரசருக்கு அடுத்த நிலையில்
  rationale: அரசருக்கு அடுத்த தரநிலையைக் குறிக்கிறது; மூலத்தில் இல்லாத குறிப்பிட்ட பதவிப் பெயரைச் சேர்க்காமல் அதன் பொருளைத் தெளிவாக்குகிறது.
- source_word: וְגָדוֹל לַיְּהוּדִים
  choice: யூதர்களிடையே மேன்மை பெற்றவராக
  rationale: யூத மக்களிடையே அவர் பெற்றிருந்த உயர்ந்த சமூக நிலையையும் செல்வாக்கையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְרָצוּי
  choice: ஆதரவைப் பெற்றவராக
  rationale: சமூகத்தினரால் ஏற்றுக்கொள்ளப்பட்டு விரும்பப்பட்ட நிலையைத் தெரிவிக்கிறது; வெறும் தனிப்பட்ட பாசத்தைவிட பொதுவான அங்கீகாரத்தை இங்கு குறிக்கிறது.
- source_word: לְרֹב אֶחָיו
  choice: தம் சகோதரர்களில் பெருந்திரளானோரின்
  rationale: רֹב என்பதிலுள்ள ‘பெருந்திரள்’ அல்லது ‘பெரும்பான்மை’ என்ற இரு சாத்தியங்களையும் ஒன்றாகத் தீர்மானிக்காமல், அளவுசார் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: אֶחָיו
  choice: தம் சகோதரர்கள்
  rationale: எபிரெயச் சொலின் குடும்ப உறவு உருவகத்தைத் தக்கவைக்கிறது; சூழலில் இது உடன்பிறந்த ஆண்களை மட்டும் அல்ல, சக யூதர்களையும் உறவினரையும் குறிக்கலாம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: דֹּרֵשׁ טוֹב לְעַמּוֹ
  choice: தம் மக்களின் நன்மையை நாடி
  rationale: தம் மக்களுக்கு நன்மை உண்டாகச் செயற்பாட்டுடன் முயல்வதை, மூலத்தின் ‘நன்மையை நாடுதல்’ என்ற சொல்லாட்சிக்கு நெருக்கமாகத் தெரிவிக்கிறது.
- source_word: וְדֹבֵר שָׁלוֹם
  choice: சமாதானத்தைப் பேசிவந்தார்
  rationale: שָׁלוֹם என்பதன் சமாதானம், நல்வாழ்வு, முழுநலம் ஆகிய பரந்த எதிரொலியைத் தக்கவைக்கும் எபிரெய வழக்கை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: לְכָל זַרְעוֹ
  choice: தம் சந்ததியார் அனைவருக்கும்
  rationale: זֶרַע என்பது கூட்டுப்பொருளில் சந்ததி அல்லது வழித்தோன்றல்களைக் குறிக்கிறது; ‘விதை’ என்ற நேரடி ஆனால் தெளிவற்ற சொல்லைவிட இது இயல்பாக உள்ளது.
