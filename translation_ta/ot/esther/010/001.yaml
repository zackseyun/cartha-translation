  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
translation:
  language: ta
  text: அகாஸ்வேரு அரசர் நாட்டின்மீதும் கடல்தீவுகளின்மீதும்[a] கப்பம்[b] விதித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடற்கரைப் பகுதிகளின்மீதும்.’ எபிரெயச் சொல் தீவுகளையோ கடலோரப் பகுதிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வரி’ அல்லது ‘தீர்வை.’ எபிரெயச் சொல் சில சூழல்களில் கட்டாய உழைப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: விதித்தார்
  rationale: שׂוּם מַס עַל என்ற நிர்வாகச் சொற்றொடரில் வரி அல்லது கப்பத்தைச் சுமத்துதல் என்ற பொருள் வருகிறது; நவீன தமிழில் ‘விதித்தார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַמֶּלֶךְ אחשרש
  choice: அகாஸ்வேரு அரசர்
  rationale: பெயருடன் வரும் அரசப் பட்டத்தை இயல்பான தமிழ் மரியாதை நடையில் ‘அரசர்’ எனப் பெயருக்குப் பின் அமைத்துள்ளது; பெயர் எபிரெய வடிவை ஒட்டித் தமிழெழுத்துப்பெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: מַס
  choice: கப்பம்
  rationale: இச்சொல் வரி, கப்பம், கட்டாய உழைப்பு ஆகியவற்றைக் குறிக்கலாம். நாடு மற்றும் கடல்சார் பகுதிகள் முழுவதன்மீதும் விதிக்கப்படுவது இங்கு பேரரசுக்குச் செலுத்தும் கப்பம் அல்லது தீர்வையைக் குறிக்க அதிக வாய்ப்புள்ளது; ‘கப்பம்’ அதன் அரசியல் சார்பைத் தக்கவைக்கிறது.
- source_word: עַל הָאָרֶץ
  choice: நாட்டின்மீதும்
  rationale: הָאָרֶץ இச்சூழலில் பூமி முழுவதையும் அல்ல, ஆட்சிக்குட்பட்ட நிலப்பரப்பைக் குறிக்கிறது; ‘நாடு’ அந்தப் புவியியல்-அரசியல் பொருளை இயல்பாகத் தருகிறது.
- source_word: וְאִיֵּי הַיָּם
  choice: கடல்தீவுகளின்மீதும்
  rationale: אִיִּים என்பது தீவுகளையோ கடற்கரைப் பகுதிகளையோ குறிக்கக்கூடும். ‘கடல்தீவுகள்’ எபிரெயச் சொற்றொடரின் உருவகத்தைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
