base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
translation:
  language: ta
  text: அவன் தன் தந்தையின் சகோதரருடைய மகளான[a] ஹதஸ்ஸாளை—அதாவது எஸ்தரை—பராமரித்து வளர்த்து வந்தான்; ஏனெனில் அவளுக்குத் தந்தையும் தாயும் இல்லை. அந்த இளம்பெண் அழகிய உடல்வடிவமும் வசீகரமான தோற்றமும் உடையவளாக இருந்தாள். அவளுடைய தந்தையும் தாயும் இறந்தபோது, மொர்தெகாய் அவளைத் தனக்கு மகளாக எடுத்துக்கொண்டான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, உறவுமுறைப்படி அவள் மொர்தெகாயின் ஒன்றுவிட்ட சகோதரி.
    reason: kinship_clarification
  - marker: b
    text: ‘அவளைத் தன் மகளாகத் தத்தெடுத்துக்கொண்டான்’ என்றும் பொருள் கொள்ளலாம். எபிரெயம் சொற்பட, ‘அவளைத் தனக்கென மகளாக எடுத்துக்கொண்டான்’ என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵן
  choice: பராமரித்து வளர்த்து வந்தான்
  rationale: இந்தப் பங்கேற்புவினை மொர்தெகாய் அவளைத் தொடர்ந்து பேணி வளர்த்துவந்ததைக் குறிக்கிறது. தமிழில் ‘பராமரித்து வளர்த்து வந்தான்’ என்பது அந்த நீடித்த பொறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  choice: அதஸ்ஸாளை—அதாவது எஸ்தரை—
  rationale: הִיא ஒரே நபரை இரு பெயர்களால் அடையாளப்படுத்துகிறது. ‘அதாவது’ என்ற அமைப்பு அந்த விளக்க உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּת דֹּדוֹ
  choice: தன் தந்தையின் சகோதரருடைய மகளான
  rationale: எபிரெயச் சொற்றொடரின் உறவுமுறை விவரத்தை ‘உறவுச் சகோதரி’ என்று சுருக்காமல் காக்கிறது; தமிழில் பெரியப்பா அல்லது சித்தப்பா என்று வயதின் அடிப்படையில் தேவையற்ற விவரத்தைச் சேர்ப்பதையும் தவிர்க்கிறது.
- source_word: כִּי אֵין לָהּ אָב וָאֵם
  choice: ஏனெனில் அவளுக்குத் தந்தையும் தாயும் இல்லை
  rationale: ‘அநாதை’ என்று மறைபொருளை மட்டும் தராமல், மூலத்தில் உள்ளபடி பெற்றோர் இருவரும் இல்லாததை நேரடியாகச் சொல்கிறது.
- source_word: הַנַּעֲרָה
  choice: அந்த இளம்பெண்
  rationale: திருமண வயதுடைய இளம் பெண்ணைக் குறிக்கும் இச்சூழலில், நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ளது.
- source_word: יְפַת תֹּאַר
  choice: அழகிய உடல்வடிவம்
  rationale: உடலமைப்பு அல்லது வடிவத்தின் அழகைச் சுட்டும் சொற்றொடரின் தனித்துவத்தைப் பேணுகிறது.
- source_word: טוֹבַת מַרְאֶה
  choice: வசீகரமான தோற்றம்
  rationale: முந்தைய உடல்வடிவக் குறிப்பிலிருந்து வேறுபட்டு, பார்வைக்கு ஈர்ப்பான தோற்றத்தைக் குறிக்கிறது.
- source_word: וּבְמוֹת אָבִיהָ וְאִמָּהּ
  choice: அவளுடைய தந்தையும் தாயும் இறந்தபோது
  rationale: மூலத்தின் காலச்சூழலை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת
  choice: மொர்தெகாய் அவளைத் தனக்கு மகளாக எடுத்துக்கொண்டான்
  rationale: ‘தனக்கென மகளாக எடுத்தான்’ என்ற எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் காக்கிறது; ‘தத்தெடுத்தான்’ என்று குறிப்பிட்ட சட்டபூர்வ நடைமுறையை உரைக்குள் இறக்குமதி செய்யவில்லை.
