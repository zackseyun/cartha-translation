translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. ‘தகப்பன்’ என்பதற்குப் பதில் இன்றைய பொதுவழக்கான ‘தந்தை’ பயன்படுத்தப்பட்டுள்ளது. இரு அழகுக் குறிப்புகளின் வேறுபாடும், மகளாக எடுத்துக்கொண்டதின் சட்டநிலை குறித்த மூலத்தின் அளவான தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
