translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையான ஒருமை வினைமுற்றுகளுடன் இயல்பான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் அறிமுக அமைப்பும் வம்சவரிசைத் தொடரும் காக்கப்பட்டுள்ளன; ‘யூதர்/யூதேயர்’ மற்றும் ‘கோட்டை/அரண்மனை வளாகம்’ என்ற பொருள் வாய்ப்புகள் அடிக்குறிப்புகளில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
