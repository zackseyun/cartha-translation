  text: אִ֣ישׁ יְהוּדִ֔י הָיָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וּ/שְׁמ֣/וֹ מָרְדֳּכַ֗י בֶּ֣ן יָאִ֧יר בֶּן שִׁמְעִ֛י בֶּן קִ֖ישׁ אִ֥ישׁ יְמִינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/005.yaml
  text: There was a Jewish man in Susa the citadel[a], and his name was Mordecai son of Jair, son of Shimei, son of Kish[c][b], a Benjaminite.
translation:
  language: ta
  text: சூசான் கோட்டையில்[a] யூத இனத்தைச் சேர்ந்த ஒரு மனிதர் இருந்தார்[b]. அவர் பெயர் மொர்தெகாய்; அவர் யாயீரின் மகன், சிமெயியின் மகன், கீசின் மகன்[c]; பென்யமீன் கோத்திரத்தைச் சேர்ந்தவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூசான் அரண்மனை வளாகத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யூதேயாவைச் சேர்ந்த ஒரு மனிதர்.”
    reason: lexical_alternative
  - marker: c
    text: மரபுவழிப் பட்டியல்களில் “மகன்” என்பதற்கான எபிரெயச் சொல் தொலைவான சந்ததியுறவையும் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ יְהוּדִי
  choice: யூத இனத்தைச் சேர்ந்த ஒரு மனிதர்
  rationale: יְהוּדִי என்பது யூத அடையாளத்தையோ யூதேயாவைச் சேர்ந்தவரையோ குறிக்கலாம். பாரசீகப் புலம்பெயர் சூழலில் இன-மக்கள் அடையாளத்தை இயல்பாகத் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָיָה
  choice: இருந்தார்
  rationale: புதிய கதாபாத்திரத்தை அறிமுகப்படுத்தும் எபிரெய இருப்புக் கூற்றை இயல்பான தமிழ் நடையில் வெளிப்படுத்துகிறது.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: சூசான் கோட்டையில்
  rationale: שׁוּשַׁן என்பது இடப்பெயர்; הַבִּירָה என்பது அரணமைந்த அரச வளாகம் அல்லது கோட்டை. சுருக்கமாகவும் இயல்பாகவும் அதன் இடப்பொருளைத் தருகிறது.
- source_word: וּשְׁמוֹ
  choice: அவர் பெயர்
  rationale: கதாபாத்திரத்தின் பெயரை அறிமுகப்படுத்தும் எபிரெய தொடரை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: מָרְדֳּכַי
  choice: மொர்தெகாய்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் அறிமுகமான ஒலிபெயர்ப்பு வடிவம்.
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  choice: யாயீரின் மகன், சிமெயியின் மகன், கீசின் மகன்
  rationale: בֶּן என்பதன் நேரடிப் பொருளான ‘மகன்’ என்பதைக் காத்து, மரபுவழிப் பட்டியலின் கட்டமைப்பையும் பாதுகாக்கிறது. இது தொலைவான சந்ததியுறவையும் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אִישׁ יְמִינִי
  choice: பென்யமீன் கோத்திரத்தைச் சேர்ந்தவர்
  rationale: பென்யமீன் குலம் அல்லது கோத்திரத்துடனான தொடர்பை நவீன வாசகர்களுக்குத் தெளிவாகக் கூறுகிறது.
