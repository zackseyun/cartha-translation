translation_notes:
  register: நவீன தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் செயப்பாட்டு வலியுறுத்தலும் ஆட்சியாண்டு மற்றும் மாதக் குறிப்புகளும் காக்கப்பட்டுள்ளன; தமிழ் வாக்கிய ஓட்டத்திற்காக காலக் குறிப்புகளின் வரிசை இயல்பாக அமைக்கப்பட்டுள்ளது.
