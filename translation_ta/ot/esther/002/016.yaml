source:
  edition: WLC
  text: וַ/תִּלָּקַ֨ח אֶסְתֵּ֜ר אֶל הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ אֶל בֵּ֣ית מַלְכוּת֔/וֹ בַּ/חֹ֥דֶשׁ הָ/עֲשִׂירִ֖י הוּא חֹ֣דֶשׁ טֵבֵ֑ת בִּ/שְׁנַת שֶׁ֖בַע לְ/מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
translation:
  language: ta
  text: எஸ்தர் அரசன் அகாஸ்வேருவிடம்[a], அவருடைய அரண்மனைக்குள், பத்தாம் மாதத்தில், அதாவது தேபேத் மாதத்தில்[b], அவருடைய ஆட்சியின் ஏழாம் ஆண்டில் அழைத்துச் செல்லப்பட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரசன் அகாஸ்வேருவிடம் கொண்டுவரப்பட்டாள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் செயப்பாட்டு வடிவில் இருப்பதால், எஸ்தர் பிறரின் செயலுக்கு உட்பட்டார் என்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘தேபேத் மாதம்.’ இது பத்தாம் மாதத்திற்கான பாபிலோனியப் பெயர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּלָּקַח
  choice: அழைத்துச் செல்லப்பட்டாள்
  rationale: לקח என்பதன் நிஃபால் வடிவம் இங்கு செயப்பாட்டு பொருளைக் கொண்டது. எஸ்தர் தானாகச் சென்றார் என்று சொல்லாமல், பிறரால் கொண்டு செல்லப்பட்டார் என்ற எபிரெய வலியுறுத்தலை இது இயல்பான தமிழில் காக்கிறது.
- source_word: אֶל הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அரசன் அகாஸ்வேருவிடம்
  rationale: முதல் אֶל அரசனை நோக்கிய நகர்வைக் குறிக்கிறது; பட்டமும் பெயரும் தமிழின் இயல்பான வரிசையில் தரப்பட்டுள்ளன.
- source_word: אֶל בֵּית מַלְכוּתוֹ
  choice: அவனுடைய அரண்மனைக்கு
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய அரசாட்சியின் வீடு’; சூழலில் அரசனின் அரண்மனையைக் குறிப்பதால் தெளிவான நவீனத் தமிழில் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי הוּא חֹדֶשׁ טֵבֵת
  choice: பத்தாம் மாதமாகிய தேபேத் மாதத்தில்
  rationale: வரிசை எண்ணால் குறிக்கப்பட்ட மாதத்தையும் அதன் பெயரையும் இணைக்கும் எபிரெய விளக்க அமைப்பைப் பாதுகாக்கிறது.
- source_word: טֵבֵת
  choice: தேபேத்
  rationale: எபிரெய மாதப் பெயரின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  choice: அவனுடைய ஆட்சியின் ஏழாம் ஆண்டில்
  rationale: அரசனின் ஆட்சியாண்டைக் குறிக்கும் வழக்கமான காலக் குறிப்பை இயல்பான தமிழில் தருகிறது.
