source:
  edition: WLC
  text: לֹא הִגִּ֣ידָה אֶסְתֵּ֔ר אֶת עַמָּ֖/הּ וְ/אֶת מֽוֹלַדְתָּ֑/הּ כִּ֧י מָרְדֳּכַ֛י צִוָּ֥ה עָלֶ֖י/הָ אֲשֶׁ֥ר לֹא תַגִּֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/010.yaml
  text: Esther had not disclosed her people or her kindred[a], because Mordecai had commanded her not to disclose it.
translation:
  language: ta
  text: எஸ்தர் தன் மக்களையும் தன் வம்சத்தையும்[a] வெளிப்படுத்தவில்லை; ஏனெனில் அதை வெளிப்படுத்தக் கூடாது என்று மொர்தெகாய் அவளுக்குக் கட்டளையிட்டிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் உறவினரை” அல்லது “தன் பூர்வீகத்தை.” எபிரெயச் சொல் உறவுக்குழு, வம்சாவளி அல்லது பிறப்பிடம் ஆகியவற்றைக் குறிக்கலாம்; இங்கு எஸ்தரின் குடும்ப வழித்தோன்றலைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידָה
  choice: வெளிப்படுத்தவில்லை
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவித்தல், வெளிப்படுத்துதல்’ என்று பொருள்படும். அரசவையில் அடையாளத்தை மறைக்கும் இச்சூழலில் ‘வெளிப்படுத்தவில்லை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: עַמָּהּ
  choice: தன் மக்கள்
  rationale: עַם இங்கு எஸ்தரின் இன அல்லது தேசிய மக்களைக் குறிக்கிறது. ‘தன் மக்கள்’ அதன் பரந்த சமூகப் பொருளைப் பாதுகாக்கிறது.
- source_word: מוֹלַדְתָּהּ
  choice: தன் வம்சம்
  rationale: מוֹלֶדֶת பிறப்பு, உறவுக்குழு, மரபுவழி அல்லது தோற்றம் ஆகியவற்றைக் குறிக்கலாம். ‘தன் மக்கள்’ என்பதுடன் இணைந்துள்ளதால், இங்கு குடும்ப வழித்தோன்றலைக் குறிக்கும் ‘தன் வம்சம்’ பொருத்தமானது; சொல்லின் பொருள் அகலத்தை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: צִוָּה עָלֶיהָ
  choice: அவளுக்குக் கட்டளையிட்டிருந்தான்
  rationale: צוה வலுவான கட்டளையைக் குறிக்கிறது. முன்பு கொடுக்கப்பட்ட கட்டளை நிகழ்காலச் செயலுக்குப் பின்னணியாக இருப்பதால் ‘கட்டளையிட்டிருந்தான்’ என்ற வடிவம் கதைத் தொடர்பைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר לֹא תַגִּיד
  choice: அதை வெளிப்படுத்தக் கூடாது என்று
  rationale: இது மொர்தெகாயின் கட்டளையின் உள்ளடக்கத்தைக் கூறுகிறது. ‘அதை’ என்பது முன் குறிப்பிடப்பட்ட மக்களையும் வம்சத்தையும் ஒருங்கே சுட்டுகிறது; முதல் வினையுடன் ஒத்திசைவாக ‘வெளிப்படுத்த’ மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶסְתֵּר
  choice: எஸ்தர்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: מָרְדֳּכַי
  choice: மொர்தெகாய்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
