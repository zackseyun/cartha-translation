revisions:
- from: மொர்தெகாயின் தந்தையின் சகோதரரான அபிகாயிலின் மகள் எஸ்தரை மொர்தெகாய் தன் மகளாக ஏற்றுக்கொண்டிருந்தான்[a]. அவள் அரசனிடம் செல்ல வேண்டிய முறை வந்தபோது, பெண்களின் பொறுப்பாளனாகிய அரசனின் அண்ணகன் ஹேகாய்[b] சொல்லியதைத் தவிர வேறெதையும் அவள் கேட்கவில்லை. எஸ்தர், தன்னைப் பார்த்த அனைவரிடமும் நன்மதிப்பைப் பெற்றாள்.
  to: அரசனிடம் செல்ல எஸ்தரின் முறை வந்தபோது—மொர்தெகாயின் உறவினரான அபிகாயிலின் மகளும், மொர்தெகாய் தன் மகளாக ஏற்றுக்கொண்டவளுமான எஸ்தர்—பெண்களின் பொறுப்பாளனாகிய அரசனின் அண்ணகன் ஹேகாய்[b] சொன்னதை மட்டுமே கேட்டாள்[a]. எஸ்தர் தன்னைப் பார்த்த அனைவரிடமும் நன்மதிப்பைப் பெற்றாள்.
  rationale: மூலம் வெளிப்படுத்தாத தந்தைவழி உறவைக் கழற்றி, דּוֹד சொல்லின் உறவுமுறைத் தெளிவின்மையைப் பாதுகாத்துள்ளேன். எஸ்தர் ஹேகாய் சொன்னவற்றை மட்டுமே கேட்டாள் என்ற விதிவிலக்குப் பொருளும் தெளிவுபடுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு “தன் மகளாக ஏற்றுக்கொண்டவள்” என்ற சொல்லோடு இணைக்கப்பட்டுள்ளது.
