base_translation:
  language: en
  yaml_path: translation/ot/esther/002/015.yaml
  text: When Esther’s turn came—the daughter of Abihail[a], the uncle of Mordecai, who had taken her as his own daughter—to go in to the king, she asked for nothing except what Hegai, the king’s eunuch, keeper of the women, advised[b]. And Esther was gaining favor in the eyes of all who saw her.
translation:
  language: ta
  text: அரசனிடம் செல்ல எஸ்தரின் முறை வந்தபோது—மொர்தெகாயின் உறவினரான அபிகாயிலின் மகளும், மொர்தெகாய் தன் மகளாக ஏற்றுக்கொண்டவளுமான எஸ்தர்—பெண்களின் பொறுப்பாளனாகிய அரசனின் அண்ணகன் ஹேகாய்[b] சொன்னதை மட்டுமே கேட்டாள்[a]. எஸ்தர் தன்னைப் பார்த்த அனைவரிடமும் நன்மதிப்பைப் பெற்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தன் மகளாக ஏற்றுக்கொண்டான்” என்பது எபிரெய மொழியில், எஸ்தரை மொர்தெகாய் மகளுக்குரிய உறவிலும் பராமரிப்பிலும் ஏற்றுக்கொண்டதைக் குறிக்கிறது. இதை “தத்தெடுத்தான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அண்ணகன்” என்பதற்கான எபிரெயச் சொல் சில இடங்களில் பொதுவாக “அரசவை அதிகாரி” என்றும் பொருள்படலாம். இங்கு அரசனின் பெண்கள் தங்கிய பகுதியைப் பற்றிய சூழல் இருப்பதால், குறிப்பான பொருள் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַגִּיעַ תֹּר
  choice: செல்ல வேண்டிய முறை வந்தபோது
  rationale: இந்தக் கட்டமைப்பு காலத்தைக் குறிக்கும் துணைவாக்கியமாக இருந்து, பெண்கள் ஒவ்வொருவராக அரசனிடம் செல்லும் ஒதுக்கப்பட்ட முறையைக் குறிப்பிடுகிறது.
- source_word: דֹּד
  choice: தந்தையின் சகோதரர்
  rationale: இங்கு அபிகாயிலுக்கும் மொர்தெகாய்க்கும் உள்ள உறவை வயதில் மூத்தவர் அல்லது இளையவர் என்று உரையில் இல்லாத தகவலைச் சேர்க்காமல் தெளிவாகக் கூறுகிறது.
- source_word: לָקַח לוֹ לְבַת
  choice: தன் மகளாக ஏற்றுக்கொண்டிருந்தான்
  rationale: எஸ்தரை மகளுக்குரிய உறவிலும் பராமரிப்பிலும் மொர்தெகாய் ஏற்றுக்கொண்டதைத் தெரிவிக்கிறது; சட்டபூர்வமான தத்தெடுப்பு நடைமுறை நடந்ததாக அவசியமின்றி உணர்த்தாது.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: அரசனிடம் செல்ல
  rationale: அரசனின் முன்னிலைக்குள் செல்வதைக் குறிக்கும் அரண்மனைச் சொல்லாட்சியை இயல்பான தமிழில் தருகிறது; பின்னணியை மூலத்தைவிட வெளிப்படையாக்கவில்லை.
- source_word: לֹא בִקְשָׁה דָּבָר כִּי אִם
  choice: சொல்லியதைத் தவிர வேறெதையும் அவள் கேட்கவில்லை
  rationale: எஸ்தர் கூடுதலாக எதையும் கோராமல் ஹேகாய் குறிப்பிட்டதை மட்டுமே பெற்றுக்கொண்டாள் என்ற விதிவிலக்குக் கட்டமைப்பைப் பாதுகாக்கிறது.
- source_word: סְרִיס
  choice: அண்ணகன்
  rationale: அரசரின் பெண்கள் தங்கிய பகுதியைக் கவனிக்கும் சூழலில், அரசவையில் பணியாற்றிய ஆண்மை நீக்கப்பட்டவரைக் குறிக்கும் குறிப்பான பொருளைத் தக்கவைக்கிறது.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: பெண்களின் பொறுப்பாளன்
  rationale: பெண்கள்மீது ஹேகாய்க்கிருந்த நிர்வாக மற்றும் பராமரிப்புப் பொறுப்பை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַתְּהִי אֶסְתֵּר נֹשֵׂאת חֵן בְּעֵינֵי כָּל רֹאֶיהָ
  choice: எஸ்தர், தன்னைப் பார்த்த அனைவரிடமும் நன்மதிப்பைப் பெற்றாள்
  rationale: ‘அனைவரின் கண்களிலும் அருள் சுமந்தாள்’ என்ற எபிரெய மொழிமரபின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: மொர்தெகாய் எஸ்தரை மகளாக ஏற்றுக்கொண்ட உறவின் தன்மை
  choice: தன் மகளாக ஏற்றுக்கொண்டிருந்தான்
  alternative: அவளைத் தத்தெடுத்திருந்தான்
  rationale: மகளுக்குரிய உறவும் பராமரிப்பும் தெளிவாகின்றன; ஆனால் மூலத்தில் உறுதிப்படுத்தப்படாத ஒரு முறையான சட்டத் தத்தெடுப்பைத் திணிப்பது தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கதைநடைக்கு ஏற்ற கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; உறவுமுறை வயது சார்ந்த ஊகமின்றி விளக்கப்பட்டுள்ளது.
