base_translation:
  language: en
  yaml_path: translation/ot/esther/002/023.yaml
  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
translation:
  language: ta
  text: அந்தக் காரியம் விசாரிக்கப்பட்டு, அது உண்மை என்று கண்டறியப்பட்டபோது, அவர்கள் இருவரும் ஒரு மரத்தில் தூக்கிலிடப்பட்டார்கள்.[a] இது அரசனின் முன்னிலையில் நாளாகமப் புத்தகத்தில் எழுதப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு மரத்தில்/கம்பத்தில் கழுவேற்றப்பட்டார்கள்.’ எபிரெயம் சொல்லுக்கு சொல் ‘ஒரு மரத்தில் தூக்கிலிடப்பட்டார்கள்’ என்று கூறுகிறது; ஆனால் பாரசீகர்களின் சரியான தண்டனை முறை கழுவேற்றுதலாகவோ, பொதுமக்கள் காணும்படி தொங்கவிடுதலாகவோ இருந்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר
  choice: அந்தக் காரியம் விசாரிக்கப்பட்டு
  rationale: בקש என்பதன் செயப்பாட்டு வடிவம் இங்கு அறிவிக்கப்பட்ட சதித்திட்டத்தைப் பற்றிய அதிகாரபூர்வ விசாரணையைக் குறிக்கிறது. ‘விசாரிக்கப்பட்டு’ என்பது நீதிமுறை நுணுக்கத்தையும் செயப்பாட்டு பொருளையும் இயல்பான தமிழில் தருகிறது.
- source_word: וַיִּמָּצֵא
  choice: அது உண்மை என்று கண்டறியப்பட்டபோது
  rationale: இந்தக் கதைச் சூழலில் מצא என்பதன் பொருள் குற்றச்சாட்டு உறுதிப்படுத்தப்பட்டது என்பதாகும். ‘அது உண்மை என்று’ என்பது எபிரெயத்தில் மறைமுகமாக உள்ள முடிவைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיִּתָּלוּ
  choice: தூக்கிலிடப்பட்டார்கள்
  rationale: תלה என்பது தொங்கவிடுதல் அல்லது தூக்கிலிடுதலைக் குறிக்கும்; பாரசீகச் சூழலில் கழுவேற்றுதல் சாத்தியமானாலும், எபிரெய வினை அந்தத் துல்லியமான முறையை கட்டாயப்படுத்தவில்லை.
- source_word: שְׁנֵיהֶם
  choice: அவர்கள் இருவரும்
  rationale: சதியாளர்கள் இருவரையும் ஒன்றாக வலியுறுத்தும் இயல்பான தமிழ் வடிவம்.
- source_word: עַל עֵץ
  choice: ஒரு மரத்தில்
  rationale: עֵץ என்பதன் அடிப்படைப் பொருள் ‘மரம்’; தண்டனைச் சூழலில் மரத்தாலான கம்பம் அல்லது அமைப்பையும் குறிக்கலாம். மூலத்தின் திட்டமிடப்படாத தெளிவின்மையை முதன்மை உரை காக்கிறது.
- source_word: וַיִּכָּתֵב
  choice: எழுதப்பட்டது
  rationale: כתב என்பதன் செயப்பாட்டு வடிவத்தை நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  choice: நாளாகமப் புத்தகத்தில்
  rationale: அரசவையின் அதிகாரபூர்வ நிகழ்வுப் பதிவைக் குறிக்கும் தொடரை, அறிமுகமானதும் சுருக்கமானதுமான தமிழில் தருகிறது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசனின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்னிலையில்’ என்ற நேரடியான பொருளையும் அரசவைச் சூழலையும் காக்கிறது.
