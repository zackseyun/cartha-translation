translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘காரியம்,’ ‘நாளாகமப் புத்தகம்,’ ‘அரசனின் முன்னிலையில்’ ஆகிய சொற்றொடர்கள் அரசவைப் பதிவின் முறையான தொனியைக் காக்கின்றன. தண்டனை முறையைத் தேவையின்றி குறிப்பாக்காமல், எபிரெய மூலத்தின் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
