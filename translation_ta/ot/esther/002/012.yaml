  text: וּ/בְ/הַגִּ֡יעַ תֹּר֩ נַעֲרָ֨ה וְ/נַעֲרָ֜ה לָ/ב֣וֹא אֶל הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֗וֹשׁ מִ/קֵּץ֩ הֱי֨וֹת לָ֜/הּ כְּ/דָ֤ת הַ/נָּשִׁים֙ שְׁנֵ֣ים עָשָׂ֣ר חֹ֔דֶשׁ כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י מְרוּקֵי/הֶ֑ן שִׁשָּׁ֤ה חֳדָשִׁים֙ בְּ/שֶׁ֣מֶן הַ/מֹּ֔ר וְ/שִׁשָּׁ֤ה חֳדָשִׁים֙ בַּ/בְּשָׂמִ֔ים וּ/בְ/תַמְרוּקֵ֖י הַ/נָּשִֽׁים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'When the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: ta
  text: 'ஒவ்வோர் இளம்பெண்ணும் அகாஸ்வேரு அரசனிடம் செல்ல வேண்டிய முறை வந்தபோது, பெண்களுக்கான ஒழுங்கின்படி அவளுக்காக நிர்ணயிக்கப்பட்ட பன்னிரண்டு மாதங்கள் முடிந்திருந்தன; ஏனெனில், அவர்களுடைய அழகுப் பராமரிப்புக்கான நாட்கள் இவ்வாறே நிறைவடைந்தன: வெள்ளைப்போள எண்ணெயுடன் ஆறு மாதங்கள், நறுமணப் பொருள்களுடனும் பெண்களுக்கான அழகுப் பராமரிப்புப் பொருள்களுடனும் ஆறு மாதங்கள்—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּר
  choice: முறை
  rationale: ஒவ்வொரு இளம்பெண்ணுக்கும் அரசனிடம் செல்ல நிர்ணயிக்கப்பட்ட வரிசை அல்லது வாய்ப்பைக் குறிக்கும் இயல்பான தமிழ் சொல்.
- source_word: כְּדָת הַנָּשִׁים
  choice: பெண்களுக்கான விதிமுறையின்படி
  rationale: דָּת இங்கு அரசவையால் வகுக்கப்பட்ட ஒழுங்கு அல்லது விதிமுறையைக் குறிக்கிறது; ‘சட்டம்’ என்பதைக் காட்டிலும் சூழலுக்கு ஏற்றது.
- source_word: מְרוּקֵיהֶן
  choice: அழகுப் பராமரிப்பு
  rationale: சுத்திகரிப்பு, உடல் பராமரிப்பு, அழகூட்டல் ஆகிய பொருள் பரப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֶׁמֶן הַמֹּר
  choice: வெள்ளைப்போள எண்ணெய்
  rationale: מֹר என்பது myrrh; தமிழில் அறியப்பட்ட ‘வெள்ளைப்போளம்’ என்ற பெயரை எண்ணெய் என்ற மூலச்சொல்லுடன் இணைக்கிறது.
- source_word: בַּבְּשָׂמִים
  choice: நறுமணப் பொருள்கள்
  rationale: வாசனைத் திரவியங்கள் மற்றும் மணமூட்டும் பொருள்களைக் குறிக்கும் பன்மைச் சொல்லின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: תַמְרוּקֵי הַנָּשִׁים
  choice: பெண்களுக்குரிய அழகு சாதனங்கள்
  rationale: முந்தைய பொதுவான பராமரிப்புச் சொல்லிலிருந்து வேறுபடுத்தி, பெண்களுக்காகப் பயன்படுத்தப்பட்ட அழகூட்டும் பொருள்களைத் தெளிவாகக் குறிக்கிறது.
