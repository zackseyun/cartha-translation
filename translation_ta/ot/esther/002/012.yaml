translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக் குறிப்புக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனம் அடுத்த வசனத்துக்குள் தொடரும் அமைப்பை இறுதி நீள்கோடு தக்கவைக்கிறது; மூலத்தில் இல்லாத சமய அல்லது அறநெறி விளக்கங்கள் சேர்க்கப்படவில்லை.
