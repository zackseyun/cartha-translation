revisions:
- from: 'ஒவ்வோர் இளம்பெண்ணும் அகாஸ்வேரு அரசனிடம் செல்வதற்கான முறை வந்தபோது, பெண்களுக்கான விதிமுறையின்படி பன்னிரண்டு மாதங்கள் அவளுக்குரிய பராமரிப்பு முடிந்திருந்தது. ஏனெனில், அவர்களுடைய அழகுப் பராமரிப்புக் காலம் இவ்வாறு நிறைவுபெற்றது: ஆறு மாதங்கள் வெள்ளைப்போள எண்ணெயாலும், ஆறு மாதங்கள் நறுமணப் பொருள்களாலும் பெண்களுக்குரிய அழகு சாதனங்களாலும் பராமரிக்கப்பட்டார்கள்—'
  to: 'ஒவ்வோர் இளம்பெண்ணும் அகாஸ்வேரு அரசனிடம் செல்ல வேண்டிய முறை வந்தபோது, பெண்களுக்கான ஒழுங்கின்படி அவளுக்காக நிர்ணயிக்கப்பட்ட பன்னிரண்டு மாதங்கள் முடிந்திருந்தன; ஏனெனில், அவர்களுடைய அழகுப் பராமரிப்புக்கான நாட்கள் இவ்வாறே நிறைவடைந்தன: வெள்ளைப்போள எண்ணெயுடன் ஆறு மாதங்கள், நறுமணப் பொருள்களுடனும் பெண்களுக்கான அழகுப் பராமரிப்புப் பொருள்களுடனும் ஆறு மாதங்கள்—'
  rationale: The revision preserves the verse’s unfinished continuation, clarifies that the twelve months were the prescribed regimen, and follows the Hebrew’s two parallel six-month treatment periods without adding a passive action not expressed in the source.
