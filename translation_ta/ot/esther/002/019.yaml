translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கன்னிப்பெண்கள்’ மூலத்தின் குறிப்பிட்ட பொருளைத் தக்கவைக்கிறது; ‘அரண்மனை வாயில்’ சொல்லுக்கு சொல் வடிவத்தைவிட தமிழில் இயல்பாகச் சூழலை வெளிப்படுத்துகிறது.
