base_translation:
  language: en
  yaml_path: translation/ot/esther/002/019.yaml
  text: When the virgins were gathered a second time[b][a], Mordecai was sitting at the king's gate.
translation:
  language: ta
  text: கன்னிப்பெண்கள் இரண்டாவது முறையாக[a] ஒன்றுகூட்டப்பட்டபோது, மொர்தெகாய் அரண்மனை வாயிலில்[b] அமர்ந்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும்.” எபிரெய மொழியில் சொல்லுக்கு சொல் “இரண்டாவது முறையாக” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “அரண்மனை வாயில்” என்பது அரச அரண்மனை வளாகத்தின் வாயில் பகுதியைக் குறிக்கலாம்; அது அலுவல் பணியும் நிர்வாகமும் நடைபெற்ற இடமாக இருந்தது.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  choice: ஒன்றுகூட்டப்பட்டபோது
  rationale: בְּ + நிஃபால் வினையெச்சக் கட்டமைப்பு காலத்தைக் குறிக்கும் துணைவாக்கியத்தை உருவாக்குகிறது; செயப்பாட்டு வடிவமும் ‘போது’ என்ற காலத் தொடர்பும் பாதுகாக்கப்படுகின்றன. தொடக்க וּ இயல்பான தமிழ் வாக்கிய ஓட்டத்தில் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: בְּתוּלוֹת
  choice: கன்னிப்பெண்கள்
  rationale: இந்தச் சொல் இச்சூழலில் கன்னித்தன்மையைக் குறிப்பாகக் குறிக்கிறது; பொதுவான ‘இளம்பெண்கள்’ என்பதைவிட ‘கன்னிப்பெண்கள்’ மூலத்தின் துல்லியத்தைப் பாதுகாக்கிறது.
- source_word: שֵׁנִית
  choice: இரண்டாவது முறையாக
  rationale: ‘மீண்டும்’ என்பதைக் காட்டிலும், எபிரெயச் சொல்லின் ‘இரண்டாம் முறை’ என்ற வெளிப்படையான பொருளை நேரடியாகத் தருகிறது.
- source_word: וּמָרְדֳּכַי
  choice: மொர்தெகாய்
  rationale: எபிரெயப் பெயரின் ஒலிப்பை நவீனத் தமிழில் அறியப்பட்ட வடிவில் எழுத்துப்பெயர்த்தல்.
- source_word: יֹשֵׁב
  choice: அமர்ந்திருந்தான்
  rationale: கால் நிகழ்காலப் பெயரெச்சம் நீடித்த நிலையைக் குறிக்கிறது; ‘அமர்ந்தான்’ என்பதைவிட ‘அமர்ந்திருந்தான்’ அந்தத் தொடர்நிலையைப் பாதுகாக்கிறது.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: அரண்மனை வாயிலில்
  rationale: சொல்லுக்கு சொல் ‘அரசனின் வாயிலில்’ என்றாலும், இச்சொற்றொடர் அரசனுடைய அரண்மனை வளாகத்தின் வாயில் பகுதியைக் குறிக்கிறது. ‘அரண்மனை வாயிலில்’ என்பது நவீனத் தமிழில் இயல்பாகவும் சூழலைத் தெளிவாகவும் தருகிறது; பண்பாட்டு விளக்கம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
