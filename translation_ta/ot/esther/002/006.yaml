translation:
  language: ta
  text: எருசலேமிலிருந்து, யூதாவின் அரசனாகிய எகொனியாவுடன் பாபிலோனின் அரசனாகிய நேபுகாத்நேச்சார் நாடுகடத்திய நாடுகடத்தப்பட்டவர்களோடு அவன் நாடுகடத்தப்பட்டிருந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவன்” என்பது மொர்தெகாயைக் குறிக்காமல், அவனுடைய மூதாதையான கீசைக் குறிக்கலாம்; ஏனெனில் எகொனியாவுடன் நிகழ்ந்த நாடுகடத்தல் மொர்தெகாயின் காலத்துக்கு பல தலைமுறைகளுக்கு முன்பு நடந்தது.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: அவன்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட நபரைத் தொடரும் உறவுப்பெயரை, தமிழில் இயல்பான தனி வாக்கியத் தொடக்கமாக மாற்றுகிறது; குறிப்பின் தொடர்பை அடிக்குறிப்பு விளக்குகிறது.
- source_word: הָגְלָה
  choice: நாடுகடத்தப்பட்டிருந்தான்
  rationale: கட்டாயமாகத் தாய்நாட்டிலிருந்து அகற்றப்பட்டதையும் எபிரெயச் செயலின் செயப்பாட்டு பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: מִירוּשָׁלַיִם
  choice: எருசலேமிலிருந்து
  rationale: மூலத்தின் இடப்பெயரையும் ‘இலிருந்து’ என்ற முன்னொட்டுப் பொருளையும் நேரடியாகக் கொடுக்கிறது.
- source_word: עִם הַגֹּלָה
  choice: நாடுகடத்தப்பட்டவர்களோடு
  rationale: கூட்டுப் பெயரான הַגּוֹלָה-வை ஒரு நிகழ்வாக அல்லாமல் நாடுகடத்தப்பட்ட மக்கள் குழுவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר הָגְלְתָה
  choice: அவர்கள் ... நாடுகடத்தப்பட்டவர்கள்
  rationale: பெண்பால் ஒருமை வினையுடன் வரும் கூட்டுப் பெயரின் பன்மைக் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְכָנְיָה
  choice: எகொனியா
  rationale: இவ்வசனத்தின் எபிரெயப் பெயர்வடிவமான יְכָנְיָה-வை மாற்றுப் பெயரான யோயாக்கீன் என்பதுடன் ஒத்திசைக்காமல் ஒலிபெயர்க்கிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: எபிரெய இணைப்புத் தொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: אֲשֶׁר הֶגְלָה
  choice: அவர்களை நாடுகடத்தியிருந்தான்
  rationale: நேபுகாத்நேச்சாரைச் செய்பவராகவும் நாடுகடத்தப்பட்டோர் குழுவைச் செயப்படுபொருளாகவும் தெளிவாகக் காட்டுகிறது; மூலத்தில் மீண்டும் வரும் גלה வேரின் தொடர்ச்சியையும் காக்கிறது.
- source_word: נְבוּכַדְנֶאצַּר
  choice: நேபுகாத்நேச்சார்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும், மூலப் பெயருக்கு அண்மையான ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ בָּבֶל
  choice: பாபிலோனின் அரசன்
  rationale: எபிரெய இணைப்புத் தொடரைத் தெளிவான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: எஸ்தர் 2:6-இல் உறவுப்பெயர் சுட்டும் நபர்
  choice: முதன்மை உரையில் அது மொர்தெகாயைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: எகொனியாவின் நாடுகடத்தலுக்கும் மொர்தெகாயின் காலத்துக்கும் இடையிலுள்ள தலைமுறைக் காலத்தை முன்னிட்டு, அது மொர்தெகாயின் மூதாதையான கீசைக் குறிக்கலாம்.
  rationale: எபிரெய உரையின் மேற்பரப்பு இலக்கண ஓட்டத்தில் அண்மைய நபர் மொர்தெகாய். ஆயினும் காலவரிசையால் உருவாகும் உண்மையான இருபொருள் வாய்ப்பைத் தீர்த்துவிடாமல் அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீண்ட எபிரெய உறவுத்தொடர் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; நாடுகடத்தலைக் குறிக்கும் גלה வேரின் மீள்வருகை தமிழிலும் திட்டமிட்டு மீள்கிறது.
