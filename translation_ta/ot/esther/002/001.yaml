source:
  edition: WLC
  text: אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כְּ/שֹׁ֕ךְ חֲמַ֖ת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ זָכַ֤ר אֶת וַשְׁתִּי֙ וְ/אֵ֣ת אֲשֶׁר עָשָׂ֔תָה וְ/אֵ֥ת אֲשֶׁר נִגְזַ֖ר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/001.yaml
  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
translation:
  language: ta
  text: இவற்றுக்குப் பிறகு, அகாஸ்வேரு அரசனின் கடுங்கோபம் தணிந்தபோது, அவன் வஸ்தியையும், அவள் செய்ததையும், அவளுக்கு எதிராக விதிக்கப்பட்டதையும் நினைத்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: இவற்றுக்குப் பிறகு
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் எபிரெய காலக் கூறை இயல்பான நவீன தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: כְּשֹׁךְ חֲמַת
  choice: கடுங்கோபம் தணிந்தபோது
  rationale: שׁכך என்பதன் ‘தணிதல்’ என்ற பொருளையும் חֵמָה குறிக்கும் தீவிரமான கோபத்தையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு அரசன்
  rationale: அரச பட்டத்தையும் பெயரையும் இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: זָכַר
  choice: நினைத்தான்
  rationale: கடந்தவற்றை மனத்தில் நினைவுகூர்ந்தான் என்ற வினையின் நேரடியான பொருளைச் சூழலுக்கேற்ற தமிழில் தருகிறது.
- source_word: וַשְׁתִּי
  choice: வஸ்தி
  rationale: பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: அவள் செய்ததையும்
  rationale: அரசன் பின்னோக்கி நினைத்த செயலை எளிய, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר נִגְזַר עָלֶיהָ
  choice: அவளுக்கு எதிராக விதிக்கப்பட்டதையும்
  rationale: נִגְזַר என்பதிலுள்ள அதிகாரபூர்வத் தீர்ப்பு அல்லது விதிப்பின் செயலற்ற வடிவையும் עָלֶיהָ என்பதன் பாதகமான சார்பையும் பாதுகாக்கிறது.
