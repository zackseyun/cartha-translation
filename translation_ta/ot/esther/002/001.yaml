  register: நவீன நிலையான தமிழில், கதைநடைக்கு ஏற்ற கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. மூலத்தின் மூன்று நினைவுப் பொருட்களும் இணையான அமைப்பில் பாதுகாக்கப்பட்டுள்ளன.
