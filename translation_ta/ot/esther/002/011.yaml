  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: ta
  text: ஒவ்வொரு நாளும் மொர்தெகாய், எஸ்தர் எப்படி இருக்கிறாள் என்றும் அவளுக்கு என்ன நடக்கும் என்றும் அறிந்துகொள்வதற்காக, பெண்கள் இல்லத்தின் முற்றத்துக்கு முன்னால் முன்னும் பின்னுமாக நடந்துகொண்டிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל יוֹם וָיוֹם
  choice: ஒவ்வொரு நாளும்
  rationale: எபிரெய மொழியின் பகிர்மான வலியுறுத்தலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִתְהַלֵּךְ
  choice: முன்னும் பின்னுமாக நடந்துகொண்டிருந்தான்
  rationale: தொடர்ந்து அங்குமிங்கும் நடப்பதைக் குறிக்கும் வடிவத்தையும், வழக்கமான கடந்தகாலச் செயலையும் வெளிப்படுத்துகிறது.
- source_word: חֲצַר בֵּית הַנָּשִׁים
  choice: பெண்கள் இல்லத்தின் முற்றம்
  rationale: அரண்மனையில் பெண்கள் தங்கியிருந்த தனிப் பகுதியையும் அதன் முற்றத்தையும் நேரடியாகக் குறிக்கிறது.
- source_word: אֶת שְׁלוֹם אֶסְתֵּר
  choice: எஸ்தர் எப்படி இருக்கிறாள்
  rationale: שָׁלוֹם இங்கு நலநிலையை விசாரிப்பதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்கப்பட்டுள்ளது.
- source_word: וּמַה יֵּעָשֶׂה בָּהּ
  choice: அவளுக்கு என்ன நடக்கும்
  rationale: செயப்பாட்டு வடிவத்தின் திட்டமிடப்படாத அல்லது பிறரால் செய்யப்படும் நடவடிக்கை என்ற திறந்த தன்மையை இயல்பான தமிழில் பாதுகாக்கிறது.
