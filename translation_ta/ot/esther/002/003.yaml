base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
translation:
  language: ta
  text: அரசர் தமது ஆட்சிக்குட்பட்ட எல்லா மாகாணங்களிலும் அதிகாரிகளை நியமிக்கட்டும். அவர்கள் அழகிய தோற்றமுள்ள இளம் கன்னிப் பெண்கள் அனைவரையும் சூசான் கோட்டைக்கு, அங்குள்ள பெண்கள் இல்லத்துக்கு[a] அழைத்துவந்து, பெண்களைக் கவனிக்கும் அரசரின் அண்ணகனான[b] ஹேகாயின் பொறுப்பில் ஒப்படைக்கட்டும். அவர்களுக்கான அழகுப் பராமரிப்புப் பொருட்கள்[c] வழங்கப்படட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தப்புரத்துக்கு.’ எபிரேயத்தில் சொல்லுக்கு சொல், ‘பெண்களின் இல்லத்துக்கு.’
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘அரசவை அதிகாரி’ என்றும் மொழிபெயர்க்கலாம். பெண்கள் இல்லத்தின் சூழலில் ‘அண்ணகன்’ என்பது அதிகம் பொருந்துகிறது.
    reason: lexical_ambiguity
  - marker: c
    text: அல்லது, ‘அழகூட்டும் பராமரிப்புகள்.’ எபிரேயச் சொல் ஒப்பனைப் பொருட்களையோ அழகுப் பராமரிப்பு முறைகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד ... פְּקִידִים
  choice: அதிகாரிகளை நியமிக்கட்டும்
  rationale: הִפעיל வடிவிலுள்ள יפקד இங்கு ஒரு பணிக்காக அரச அதிகாரிகளை நியமிப்பதைக் குறிக்கிறது; அரச நிர்வாகச் சூழலை இயல்பாகத் தருகிறது.
- source_word: מְדִינוֹת מַלְכוּתוֹ
  choice: தமது ஆட்சிக்குட்பட்ட எல்லா மாகாணங்களிலும்
  rationale: எஸ்தர் நூலின் பேரரசு நிர்வாகச் சூழலில் מדינות என்பது ‘மாகாணங்கள்’; מלכותו என்பது அரசரின் ஆட்சி அல்லது ராஜ்யத்தைக் குறிக்கிறது.
- source_word: וְיִקְבְּצוּ
  choice: அழைத்து வந்து ... ஒப்படைக்கட்டும்
  rationale: பல இடங்களிலிருந்து பெண்களை ஒரே இடத்தில் ஒன்றுசேர்க்கும் ஆணையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடுத்துள்ள אֶל־יַד என்பதன் பொறுப்பில் ஒப்படைக்கும் கருத்துடனும் இணைக்கப்பட்டுள்ளது.
- source_word: כָּל נַעֲרָה בְתוּלָה
  choice: இளம் கன்னிப் பெண்கள் அனைவரையும்
  rationale: נערה காட்டும் இளமையையும் בתולה காட்டும் கன்னித்தன்மையையும் இரண்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: טוֹבַת מַרְאֶה
  choice: அழகிய தோற்றமுள்ள
  rationale: ‘தோற்றத்தில் நல்ல’ என்ற எபிரெயக் கருத்தின் பார்வை சார்ந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: சூசான் கோட்டை
  rationale: הבירה என்பது சூசானிலுள்ள பாதுகாப்புடைய அரச மையம் அல்லது கோட்டையைக் குறிக்கிறது; வெறும் நகரம் அல்லது அரண்மனை என்று சுருக்கப்படவில்லை.
- source_word: בֵּית הַנָּשִׁים
  choice: பெண்கள் இல்லம்
  rationale: எபிரெயின் ‘பெண்களின் வீடு/இல்லம்’ என்ற வெளிப்படையான சொல்லமைப்பைப் பாதுகாக்கிறது; ‘அந்தப்புரம்’ என்பது சூழலுக்கேற்ற விளக்க மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶל יַד הֵגֶא
  choice: ஹேகாயின் பொறுப்பில் ஒப்படைக்கட்டும்
  rationale: சொல்லுக்கு சொல் ‘ஹேகாயின் கையில்’ என்ற மரபுத்தொடர் அவரது அதிகாரத்திற்கும் பராமரிப்பிற்கும் உட்படுத்தப்படுவதைச் சொல்கிறது.
- source_word: סְרִיס
  choice: அண்ணகன்
  rationale: பெண்கள் இல்லச் சூழலில் ‘eunuch’ என்ற முதன்மைப் பொருள் பொருத்தமானது; இருப்பினும் ‘அரசவை அதிகாரி’ என்ற விரிவான சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: பெண்களைக் கவனிக்கும்
  rationale: ஹேகாயின் பொறுப்பு, மேற்பார்வை, பாதுகாப்பு ஆகியவற்றை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: וְנָתוֹן תַּמְרוּקֵיהֶן
  choice: அவர்களுக்குத் தேவையான அழகுப் பராமரிப்புப் பொருட்கள் வழங்கப்படட்டும்
  rationale: תמרוקים என்பது அழகூட்டும் பூச்சுகள், ஒப்பனைப் பொருட்கள் அல்லது பராமரிப்புகளை விரிவாகக் குறிக்கலாம்; பொதுவான பொருள் முதன்மை உரையிலும் மாற்று நுணுக்கம் அடிக்குறிப்பிலும் தரப்பட்டுள்ளது.
