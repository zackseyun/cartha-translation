translation_notes:
  register: நவீன நிலையான தமிழில், அரச ஆணையின் முன்மொழிவு வடிவத்தை ‘நியமிக்கட்டும் / ஒப்படைக்கட்டும் / வழங்கப்படட்டும்’ எனப் பாதுகாத்துள்ளது. வரலாற்று அரசவைச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது; அரிதான ‘அண்ணகன்’ என்ற சொல்லின் பொருள் மற்றும் மாற்று வாசிப்பு அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
