base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
translation:
  language: ta
  text: அரசன் எல்லாப் பெண்களையும்விட எஸ்தரை அதிகமாக நேசித்தான். எல்லாக் கன்னிப்பெண்களையும்விட அவள் அவனுடைய பார்வையில் நன்மதிப்பையும் தயவையும் பெற்றாள்[a]. ஆகவே, அவன் அவளுடைய தலையில் அரச மகுடத்தை வைத்து, வஸ்திக்குப் பதிலாக அவளை அரசியாக்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவள் அவனுடைய பார்வையில் நன்மதிப்பையும் தயவையும் பெற்றுக்கொண்டாள்.” எபிரேய மரபுத்தொடர் சொல்லுக்கு சொல் “அவனுக்கு முன்பாக நன்மதிப்பையும் தயவையும் சுமந்தாள்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: நேசித்தான்
  rationale: אהב என்பது இங்கு அன்பு அல்லது பாசத்தை நேரடியாகக் குறிக்கிறது; வெறும் விருப்பம் அல்லது சாதகமான பார்வை என்று மெலிவுபடுத்தப்படவில்லை.
- source_word: מִכָּל הַנָּשִׁים
  choice: மற்ற எல்லாப் பெண்களையும்விட
  rationale: מן + כל ஒப்பீட்டுக் கட்டமைப்பை இயல்பான தமிழில் தெளிவாக வெளிப்படுத்துகிறது; נָשִׁים என்பதன் பொதுவான ‘பெண்கள்’ என்ற பொருளையும் காக்கிறது.
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד
  choice: தயவையும் அன்பையும் பெற்றாள்
  rationale: ‘சுமந்தாள்’ என்ற எபிரேய மரபுத்தொடரை இயல்பான தமிழில் ‘பெற்றாள்’ என வழங்குகிறது. חֵן என்பதை ‘தயவு’ என்றும், இச்சூழலில் חֶסֶד என்பதை கனிவான அன்பு எனவும் வேறுபடுத்திக் காக்கிறது.
- source_word: לְפָנָיו
  choice: அவனிடத்தில்
  rationale: சொல்லெழுத்தாக ‘அவனுக்கு முன்பாக’ என்றாலும், ஒருவரின் பார்வையில் அல்லது உறவில் கிடைத்த சாதகமான ஏற்றுக்கொள்ளுதலை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִכָּל הַבְּתוּלֹת
  choice: மற்ற எல்லாக் கன்னிப்பெண்களையும்விட
  rationale: בְּתוּלֹת என்பது முந்தைய נָשִׁים என்பதைக் காட்டிலும் குறிப்பான சொல்; அந்த வேறுபாடு ‘கன்னிப்பெண்கள்’ மூலம் காக்கப்படுகிறது.
- source_word: וַיָּשֶׂם כֶּתֶר מַלְכוּת
  choice: அரச மகுடத்தை வைத்து
  rationale: ‘அரசாட்சி/அரசுரிமையின் மகுடம்’ என்ற பொருளை இயல்பும் கண்ணியமும் கொண்ட தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: וַיַּמְלִיכֶהָ
  choice: அவளை அரசியாக்கினான்
  rationale: מלך என்பதன் ஹிஃபில் வடிவம் ஒருவரை அரசராக அல்லது அரசியாக ஏற்படுத்துவதைக் குறிக்கிறது; சூழலில் இதுவே தெளிவான தமிழ்.
- source_word: תַּחַת וַשְׁתִּי
  choice: வஸ்திக்குப் பதிலாக
  rationale: பதவி மாற்றம் அல்லது வாரிசுரிமைச் சூழலில் תַּחַת என்பதன் ‘இடத்தில்/பதிலாக’ என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
