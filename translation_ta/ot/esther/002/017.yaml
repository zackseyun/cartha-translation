  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் அரசவைக் கதைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. נָשִׁים மற்றும் בְּתוּלֹת ஆகியவற்றின் வேறுபாடு முறையே ‘பெண்கள்’ மற்றும் ‘கன்னிப்பெண்கள்’ என்று பாதுகாக்கப்பட்டுள்ளது. எபிரேய மரபுத்தொடர் தமிழில் இயல்பாக மாற்றப்பட்டுள்ளது.
