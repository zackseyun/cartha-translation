- from: அரசன் மற்ற எல்லாப் பெண்களையும்விட எஸ்தரை அதிகமாக நேசித்தான். மற்ற எல்லாக் கன்னிப்பெண்களையும்விட அவள் அவனிடத்தில் தயவையும் அன்பையும் பெற்றாள். ஆகவே, அவன் அவளுடைய தலையில் அரச மகுடத்தை வைத்து, வஸ்திக்குப் பதிலாக அவளை அரசியாக்கினான்.
