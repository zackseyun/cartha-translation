base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
translation:
  language: ta
  text: அந்த இளம்பெண் அவனுக்குப் பிடித்திருந்தாள்; அவனுடைய பார்வையில் அவளுக்குத் தயவு கிடைத்தது. அவளுக்குரிய அழகுப் பராமரிப்புப் பொருட்களையும் அவளுக்கான பங்குகளையும் அவன் விரைவாக வழங்கினான். மேலும், அரண்மனையிலிருந்து அவளுக்குக் கொடுக்கத் தகுதியான ஏழு இளம்பெண்களையும் கொடுத்தான். அவளையும் அவளுக்குக் கொடுக்கப்பட்ட இளம்பெண்களையும் பெண்கள் மாளிகையின் மிகச் சிறந்த பகுதிக்கு மாற்றினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெண்கள் மாளிகையின் சிறந்த இடத்திற்கு” அல்லது “பெண்கள் மாளிகையின் சிறந்த பகுதிக்கு.” இது அரசரின் பெண்கள் மாளிகைக்குள் இருந்த மேம்பட்ட இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
