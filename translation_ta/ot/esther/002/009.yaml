  rationale: מָנוֹת என்பது ஒதுக்கப்பட்ட பங்குகளை, இச்சூழலில் பெரும்பாலும் உணவு அல்லது வாழ்வாதாரப் பொருட்களை, குறிக்கிறது; தமிழில் பொருள் தெளிவுக்காக ‘உணவு’ சேர்க்கப்பட்டுள்ளது.
- source_word: שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת לָתֶת לָהּ
  choice: அவளுக்குப் பணிவிடை செய்யத் தகுதியான ஏழு இளம்பெண்கள்
  rationale: பெண்கள் அவளுக்கென நியமிக்கப்படுவதன் பணிப்பெண் பங்கைச் சூழலிலிருந்து வெளிப்படுத்துகிறது; הָרְאֻיוֹת என்பதன் ‘தகுதியான’ பொருளையும் காக்கிறது.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: அரண்மனையிலிருந்து
  rationale: ‘அரசனுடைய வீடு’ என்பதற்கான அரசவைக் சூழலுக்கு இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: וַיְשַׁנֶּהָ
  choice: மாற்றினான்
  rationale: இடம் அல்லது நிலைமாற்றத்தைக் குறிக்கும் இவ்வினைச்சொல்லை, ஆதாரத்தில் வெளிப்படையாக இல்லாத பதவி உயர்வு என்ற கருத்தைச் சேர்க்காமல் வழங்குகிறது.
- source_word: לְטוֹב בֵּית הַנָּשִׁים
  choice: பெண்கள் மாளிகையின் மிகச் சிறந்த பகுதிக்கு
  rationale: பெண்களுக்கான அரச மாளிகைக்குள் இருந்த மேம்பட்ட இடத்தைக் குறிக்கிறது; ‘அந்தப்புரம்’ என்ற பண்பாட்டு விளக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.
