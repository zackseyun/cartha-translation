translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான அரண்மனை வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. மொர்தெகாயைக் குறிப்பிட மரியாதைப் பன்மை வினைமுற்றும், எஸ்தரைக் குறிப்பிட இலக்கண ஒருமை பெண்பால் வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் தொடர்ச்சியான வினைநடையை தமிழில் தெளிவுபடுத்த இரண்டு வாக்கியங்களாக வழங்கப்பட்டுள்ளது.
