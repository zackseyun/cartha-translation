base_translation:
  language: en
  yaml_path: translation/ot/esther/002/022.yaml
  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
translation:
  language: ta
  text: அந்தக் காரியம் மொர்தெகாய்க்குத் தெரியவந்தபோது[a], அவர் அதை அரசி எஸ்தரிடம்[b] தெரிவித்தார். எஸ்தர் அதை மொர்தெகாயின் பெயரில்[c] அரசனிடம் தெரிவித்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் காரியம் மொர்தெகாய்க்கு அறிவிக்கப்பட்டபோது.” எபிரெய வினைச்சொல்லின் நிஃபால் வடிவம், அந்தக் காரியம் அவருக்குத் தெரியவந்ததையோ, யாரோ அவருக்கு அறிவித்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “எஸ்தர் அரசியிடம்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மொர்தெகாயின் பெயரால்” அல்லது “மொர்தெகாயின் சார்பாக.” எஸ்தர் அந்தத் தகவல் மொர்தெகாயிடமிருந்து வந்ததாக அரசனிடம் தெரிவித்ததை இச்சொற்றொடர் உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּדַע
  choice: தெரியவந்தபோது
  rationale: ידע என்பதன் நிஃபால் வடிவம், அந்தக் காரியம் மொர்தெகாயின் அறிவுக்கு வந்ததைச் சுட்டுகிறது; அதை யார் அறிவித்தார் என்பதைத் தீர்மானிக்காமல் இயல்பான தமிழில் செயல்பாட்டின் மறைநிலையைப் பேணுகிறது.
- source_word: הַדָּבָר
  choice: அந்தக் காரியம்
  rationale: דבר என்பது பொதுவான சொல்; உடனடி சூழலில் முன்பு கூறப்பட்ட சதியைக் குறித்தாலும், மூலத்தின் பொதுத்தன்மையை மிகையாக விளக்காமல் ‘அந்தக் காரியம்’ என வழங்கப்படுகிறது.
- source_word: לְמָרְדֳּכַי
  choice: மொர்தெகாய்க்கு
  rationale: செயல்பாட்டின் மறைநிலை வினையுடன் ל, தகவல் யாருக்குத் தெரியவந்தது என்பதைச் சுட்டுகிறது.
- source_word: וַיַּגֵּד
  choice: தெரிவித்தார்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ‘தெரிவித்தல்/அறிவித்தல்’ எனப் பொருள்படும்; மரியாதையும் இயல்பும் கொண்ட நவீனத் தமிழ் நடை.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: அரசி எஸ்தரிடம்
  rationale: ‘எஸ்தர் அரசி’ என்ற எபிரெயப் பின்னிணைப்பை இயல்பான தமிழ்ச் சொல் வரிசையில் வழங்கி, அவளுடைய அரசப் பட்டத்தைப் பேணுகிறது.
- source_word: וַתֹּאמֶר
  choice: தெரிவித்தாள்
  rationale: אמר அடிப்படையில் ‘சொன்னாள்’ என்றாலும், இங்கு தகவலை அரசனிடம் எடுத்துரைக்கும் செயலை நவீனத் தமிழில் இயல்பாக ‘தெரிவித்தாள்’ என வழங்குகிறது.
- source_word: לַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: மூலத்தின் முன்னிடைச்சொல் தொடரை நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: בְּשֵׁם מָרְדֳּכָי
  choice: மொர்தெகாயின் பெயரால்
  rationale: בשם என்பதன் ‘பெயரில்/பெயரால்’ என்ற வடிவத்தைப் பேணி, அறிக்கையின் மூலமாக மொர்தெகாய் அடையாளப்படுத்தப்பட்டதை உணர்த்துகிறது; ‘அவர் சார்பாக’ என மட்டும் விளக்கிக் கட்டுப்படுத்தவில்லை.
