base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
translation:
  language: ta
  text: அரசனின் கட்டளையும் அவனுடைய ஆணையும் அறிவிக்கப்பட்டபோது, பல இளம் பெண்கள் சூசான் கோட்டையில் எகாயின் பொறுப்பின்கீழ் ஒன்றுகூட்டப்பட்டார்கள். அப்போது எஸ்தரும் அரச மாளிகைக்கு[a] அழைத்துச் செல்லப்பட்டு, பெண்களின் காவலனான எகாயின் பொறுப்பில்[b] ஒப்படைக்கப்பட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “அரசனின் வீடு.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “எகாயின் கையில்.” இது அவரது அதிகாரம் அல்லது காவலின்கீழ் இருப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: கட்டளை
  rationale: அரசவைச் சூழலில் இது அரசனிடமிருந்து வந்த அதிகாரபூர்வமான உத்தரவைக் குறிக்கிறது; பொதுவான ‘வார்த்தை’ என்பதைவிட ‘கட்டளை’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: דָת
  choice: ஆணை
  rationale: பாரசீக அரசவைப் பின்னணியில் அதிகாரபூர்வமாகப் பிறப்பிக்கப்பட்ட நியமம் அல்லது அரசாணையைச் சுட்டுகிறது. ‘ஆணை’ வாசிக்க இயல்பான முறையில் அதன் சட்டபூர்வத் தன்மையை வெளிப்படுத்துகிறது.
- source_word: נְעָרוֹת רַבּוֹת
  choice: பல இளம் பெண்கள்
  rationale: திருமண வயதிலுள்ள இளம் பெண்களைக் குறிக்கும்; இவ்வசனத்தில் தனியாக வெளிப்படாத கன்னித்தன்மையைச் சேர்க்காமல் மூலத்தின் பொருளைப் பாதுகாக்கிறது.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: சூசான் கோட்டை
  rationale: அரச வளாகம் அமைந்திருந்த அரண்சூழ்ந்த கோட்டைப் பகுதியைக் குறிக்கும் இடப்பெயர்; ‘கோட்டை’ வாசகருக்கு இயல்பாகப் புரியும்.
- source_word: אֶל יַד
  choice: பொறுப்பில்
  rationale: சொல்லுக்கு சொல் ‘கையில்’ என்றாலும், இங்கு ஒருவரின் அதிகாரம், கண்காணிப்பு, காவல் ஆகியவற்றின்கீழ் வைக்கப்படுவதைச் சுட்டும் எபிரெய மரபுத்தொடர்.
- source_word: וַתִּלָּקַח
  choice: அழைத்துச் செல்லப்பட்டு
  rationale: எஸ்தர் தானாக முன்வந்ததாகக் காட்டாமல், அவள்மீது நிகழ்த்தப்பட்ட செயலைச் செயல்பாட்டு வினையின் செயப்பாட்டு வடிவில் நிலைநிறுத்துகிறது; ‘பிடித்துச் செல்லப்பட்டாள்’ என்பது மூலத்தைவிட வன்முறையை அதிகப்படுத்தக்கூடும்.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரச மாளிகை
  rationale: சொல்லுக்கு சொல் ‘அரசனின் வீடு’; இச்சூழலில் அரச அரண்மனை வளாகத்தைக் குறிக்கிறது. ‘அரச மாளிகை’ நவீனத் தமிழில் தெளிவாக உள்ளது.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: பெண்களின் காவலன்
  rationale: பெண்களைக் கண்காணித்துப் பாதுகாக்கும் பொறுப்புடைய அலுவலனைச் சுருக்கமாகவும் மூலத்திற்கு நெருக்கமாகவும் குறிக்கிறது.
- source_word: וַיְהִי בְּהִשָּׁמַע ... וּבְהִקָּבֵץ
  choice: … கேள்விப்பட்டபோது, … ஒன்றுகூட்டப்பட்டார்கள். அப்போது …
  rationale: இரு காலச்சூழல் கூறுகளையும் தக்கவைத்தபடி, நீண்ட எபிரெய வாக்கியத்தை இயல்பான நவீனத் தமிழ் நடைக்காக இரண்டு வாக்கியங்களாக அமைக்கிறது.
theological_decisions:
- issue: எஸ்தர் அரச மாளிகைக்குச் சென்ற விதத்தில் அவளுடைய விருப்பம் அல்லது கட்டாயம்
  choice: செயப்பாட்டு வடிவமான ‘அழைத்துச் செல்லப்பட்டு’ என்பதைக் கொண்டு, அவள் செயலைத் தொடங்கவில்லை என்பதைத் தக்கவைத்தல்
  alternative: ‘பிடித்துச் செல்லப்பட்டாள்’ அல்லது ‘தானாகச் சென்றாள்’
  rationale: וַתִּלָּקַח என்பது செயப்பாட்டு வடிவில் உள்ளது; அது எஸ்தரின் சம்மதத்தையோ வெளிப்படையான வன்முறையையோ தனியாகத் தீர்மானிப்பதில்லை. ஆகவே இரண்டையும் தேவையின்றி சேர்க்காமல் மூலத்தின் இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையான ஆனால் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசவைச் சூழலுக்கேற்ற அதிகாரபூர்வச் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; பழமையான சொற்களும் தேவையற்ற விளக்கச் சேர்க்கைகளும் தவிர்க்கப்பட்டுள்ளன.
