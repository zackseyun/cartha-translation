translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. வழக்கொழிந்த சொற்களைத் தவிர்த்தாலும், ‘அண்ணகன்’ மற்றும் ‘மறுமனைவியர்’ ஆகியவை அரண்மனைப் பதவியையும் சமூக நிலையையும் தேவையான துல்லியத்துடன் குறிக்கத் தேர்ந்தெடுக்கப்பட்டன. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
