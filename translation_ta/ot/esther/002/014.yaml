base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
translation:
  language: ta
  text: மாலையில் அவள் அரசனிடம் செல்வாள்[b]; காலையில், மறுமனைவியருக்குப் பொறுப்பான அரசனின் அண்ணகன் ஷாஷ்காஸின் பொறுப்பிலுள்ள பெண்களின் இரண்டாம் இல்லத்திற்குத் திரும்புவாள்[a]. அரசன் அவளை விரும்பி, அவள் பெயரிட்டு அழைக்கப்பட்டாலன்றி, அவள் மீண்டும் அரசனிடம் செல்லமாட்டாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “பெண்களின் இரண்டாம் இல்லம்”; இது இரண்டாம் அந்தப்புரத்தைக் குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: “அரசனிடம் செல்லுதல்” என்பது அரசனின் அறைக்குள் அல்லது முன்னிலைக்குள் செல்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; இச்சூழல் பாலுறவையும் உட்குறிப்பாகக் கொண்டுள்ளது, ஆனால் அதை நேரடியாகச் சொல்லவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֶרֶב הִיא בָאָה
  choice: மாலையில் அவள் அரசனிடம் செல்வாள்
  rationale: கதையில் தொடர்ந்து பின்பற்றப்பட்ட நடைமுறையைத் தமிழின் இயல்பான எதிர்கால வடிவில் கூறுகிறது. בוא என்பதன் அடிப்படைப் பொருளைக் காத்து, சூழலால் விளங்கும் அரசனின் அறைக்குள் நுழைதலை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וּבַבֹּקֶר הִיא שָׁבָה
  choice: காலையில் ... திரும்புவாள்
  rationale: எளிய காலத் தொடரையும் שׁוב என்பதன் ‘திரும்புதல்’ என்ற பொருளையும் காக்கிறது.
- source_word: בֵּית הַנָּשִׁים שֵׁנִי
  choice: பெண்களின் இரண்டாம் இல்லம்
  rationale: எபிரெயச் சொல்லமைப்பை நெருக்கமாகக் காக்கிறது; ‘அந்தப்புரம்’ என விளக்கமாக மொழிபெயர்த்து குறிப்பிட்ட பண்பாட்டு அமைப்பைத் திணிக்கவில்லை.
- source_word: אֶל יַד
  choice: பொறுப்பில்
  rationale: ‘கைக்குள்’ என்ற எபிரெய மரபுத்தொடரின் நிர்வாகப் பொறுப்பு அல்லது பராமரிப்பு என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שַׁעֲשְׁגַז
  choice: சாஷ்காஸ்
  rationale: எபிரெய மெய்யெழுத்து வடிவத்துக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: סְרִיס הַמֶּלֶךְ
  choice: அரசனின் அண்ணகன்
  rationale: அரண்மனைச் சூழலில் סריס என்பதற்கான குறிப்பான, சாத்தியமான பொருளைத் தருகிறது; பொதுவான ‘அதிகாரி’ என்பதைவிட மூலத்துக்கு நெருக்கமானது.
- source_word: שֹׁמֵר הַפִּילַגְשִׁים
  choice: மறுமனைவியரைக் கவனித்துக்கொண்ட
  rationale: שׁמר என்பதன் காத்தல்/பொறுப்பேற்றல் கருத்தையும், פילגש என்பதன் அரசனின் இரண்டாம் நிலை மனைவியர் என்ற சமூக நிலையையும் வாசிக்கத்தக்க தமிழில் தெரிவிக்கிறது.
- source_word: לֹא תָבוֹא עוֹד אֶל הַמֶּלֶךְ
  choice: அவள் மீண்டும் அரசனிடம் செல்லமாட்டாள்
  rationale: ‘அரசனிடம் செல்லுதல்’ என்ற மூல மரபுத்தொடரை மறைமுகமாகவே வைத்திருந்து, சூழலில் உள்ள பாலுறவுக் குறிப்பை மூலத்தைவிட வெளிப்படையாக்கவில்லை.
- source_word: כִּי אִם
  choice: அன்றி
  rationale: ஒரே விதிவிலக்கைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: חָפֵץ בָּהּ
  choice: அவள்மீது விருப்பங்கொண்டு
  rationale: חפץ என்பதில் உள்ள விரும்புதல்/மகிழ்தல் பொருள் பரப்பைத் திறந்தவாறே வைக்கிறது; இதை வெறும் பாலியல் ஆசையாகக் குறுக்கவில்லை.
- source_word: וְנִקְרְאָה בְשֵׁם
  choice: அவள் பெயர் சொல்லி அழைக்கப்பட்டால்
  rationale: செயப்பாட்டு வடிவத்தையும், தனிப்பட்ட முறையில் பெயரிட்டு அழைத்தல் என்ற பொருளையும் தெளிவாகக் காக்கிறது.
