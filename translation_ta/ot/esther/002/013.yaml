base_translation:
  language: en
  yaml_path: translation/ot/esther/002/013.yaml
  text: 'And in this way the young woman went to the king: whatever she said would be given to her to take with her from the house of the women to the king’s house[a][b].'
translation:
  language: ta
  text: 'இவ்விதமாக அந்த இளம்பெண் அரசனிடம் செல்வாள்: அவள் எதைக் கேட்டாலும்[a], அது அவளுக்குக் கொடுக்கப்படும்; பெண்களின் இல்லத்திலிருந்து அரசனின் இல்லம் வரை அவளுடன் செல்லுவதற்கு[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “அவள் சொல்வதெல்லாம்”; இச்சூழலில், அவள் எடுத்துச் செல்லக் கேட்டவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “பெண்களின் இல்லம்” என்பது எபிரெயச் சொற்றொடரின் நேரடி மொழிபெயர்ப்பு; இது பெண்கள் தங்கியிருந்த தனிப் பகுதியைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָזֶה
  choice: இவ்விதமாகவே
  rationale: בְּזֶה இங்கு முன்பு விவரிக்கப்பட்ட நடைமுறையைச் சுட்டுகிறது; ‘இவ்விதமாகவே’ என்பது அதன் இடைமாற்றத் தன்மையையும் வலியுறுத்தலையும் இயல்பாகத் தருகிறது.
- source_word: הַנַּעֲרָה
  choice: அந்த இளம்பெண்
  rationale: נַעֲרָה என்பது இளம் பெண்ணைக் குறிக்கிறது; ‘இளம்பெண்’ நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: בָּאָה אֶל־הַמֶּלֶךְ
  choice: அரசனிடம் செல்வாள்
  rationale: בוא + אֶל என்பது சூழலில் ஒருவரிடம் செல்வதைக் குறிக்கிறது. முறையாகத் தொடர்ந்து நடந்த செயலை imperfect வடிவம் விவரிப்பதால் ‘செல்வாள்’ பொருத்தமானது.
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  choice: அவள் எதைக் கேட்டாலும்
  rationale: எபிரெயத்தில் சொற்சொல்லாக ‘அவள் சொல்வதெல்லாம்’ என்றாலும், எடுத்துச் செல்ல வேண்டியவற்றைக் கோருவதையே சூழல் குறிக்கிறது. தமிழில் ‘கேட்டாலும்’ அந்த நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִנָּתֵן לָהּ
  choice: அது அவளுக்குக் கொடுக்கப்படும்
  rationale: נתן என்பதன் Niphal வடிவம் செயல்பாட்டுப்பாட்டில் ‘கொடுக்கப்படும்’ என்று பொருள்படும்; imperfect இங்கு வழக்கமான நடைமுறையைச் சுட்டுகிறது.
- source_word: לָבוֹא עִמָּהּ
  choice: தன்னுடன் எடுத்துச் செல்ல
  rationale: בוא + עִם என்பதன் உடன்செல்லும் கருத்தை, சூழலில் வழங்கப்படும் பொருட்களை அவள் தன்னுடன் கொண்டு செல்வதாக இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִבֵּית הַנָּשִׁים
  choice: பெண்களின் இல்லத்திலிருந்து
  rationale: ‘பெண்களின் இல்லம்’ என்பது எபிரெயச் சொல்லமைப்பைத் தக்கவைக்கிறது; மூலத்தில் இல்லாத கலாச்சார விளக்கப் பெயரைத் தவிர்க்கிறது.
- source_word: עַד בֵּית הַמֶּלֶךְ
  choice: அரசனின் இல்லத்திற்கு
  rationale: בֵּית הַמֶּלֶךְ என்பதன் நேரடி இணைப்பைத் தக்கவைக்கிறது; עַד இங்கு சென்றடையும் எல்லையைக் குறிப்பதால் இலக்கு வேற்றுமை இயல்பான தமிழை அளிக்கிறது.
