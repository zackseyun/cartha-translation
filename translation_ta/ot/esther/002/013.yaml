translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்’, ‘இளம்பெண்’, ‘இல்லம்’ ஆகியவை தெளிவும் மூலச்சொல் தொடர்பும் காக்கத் தேர்ந்தெடுக்கப்பட்டன. வழக்கமான நடைமுறையை உணர்த்த எதிர்கால வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
