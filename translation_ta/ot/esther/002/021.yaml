translation_notes:
  register: நவீன நிலையான தமிழ்; கதைநடைக்கு ஏற்ற கண்ணியமான, எளிதில் புரியும் நடை. எபிரெய மூலத்தில் உள்ள அரண்மனைப் பதவியின் பொருள் விரிவும் ‘கைநீட்டுதல்’ என்ற வன்முறை மரபுத்தொடரும் அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறிகள் பொருந்தாத இடங்களில் இருந்ததால், தமிழில் [a] அதிகாரிகள்/அண்ணகர்கள் என்பதற்கும் [b] கைநீட்டுதல் என்பதற்கும் சரியான இடங்களில் இணைக்கப்பட்டுள்ளன.
