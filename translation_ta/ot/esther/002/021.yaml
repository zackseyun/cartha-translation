base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
translation:
  language: ta
  text: அந்த நாட்களில், மொர்தெகாய் அரண்மனை வாசலில் அமர்ந்திருந்தபோது, அரசனுடைய இரு அரண்மனை அதிகாரிகளான பிக்தானும் தேரேசும், வாசல் காவலர்களில் இருந்தவர்கள், கோபமடைந்து அரசன் அகாஸ்வேருவுக்கு எதிராகக் கைநீட்ட முயன்றார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அரண்மனை அதிகாரிகள் என்பதற்கு அல்லது, “அரசனின் அண்ணகர்கள்.” எபிரெயச் சொல் அரசவை அதிகாரிகளைப் பொதுவாகக் குறிக்கலாம்; இந்த அரண்மனைச் சூழலில் அண்ணகர்களையும் குறிக்கலாம். “கைநீட்ட” என்பது சொல்லுக்கு சொல், “எதிராகக் கையை நீட்ட” என்பதாகும்; அதாவது, அரசனைத் தாக்கவோ கொல்லவோ முயல்வது.
    reason: lexical_alternative; idiom_explanation
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: அந்த நாட்களில்
  rationale: எபிரெயக் கதைநடையின் பொதுவான காலக் குறிப்பை இயல்பான தமிழில், தேவையற்ற காலத் துல்லியம் சேர்க்காமல் வழங்குகிறது.
- source_word: יֹשֵׁב
  choice: அமர்ந்திருந்தபோது
  rationale: தொடர்ந்து நிலவிய பின்னணிச் சூழலைக் காட்டும் எபிரெயப் பங்கேற்புவினையின் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: அரண்மனை வாசலில்
  rationale: இது அரச நிர்வாகத்துடன் தொடர்புடைய அரண்மனை வாயில் பகுதியைக் குறிக்கிறது; சொல்லுக்குச் சொல் ‘அரசனின் வாசல்’ என்பதைவிட இத்தொடர் நவீன தமிழில் தெளிவானது.
- source_word: קָצַף
  choice: கோபமடைந்து
  rationale: கூட்டெழுவாய்க்கு முன் ஒருமையில் வரும் எபிரெய வினை இருவருக்கும் பொருந்துகிறது; கோபத்தின் தீவிரத்தை மிகைப்படுத்தாமல் அடிப்படைப் பொருளைத் தருகிறது.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: அரசனின் அரண்மனை அதிகாரிகள்
  rationale: סָרִיסִים என்பது உடல் மாற்றம் செய்யப்பட்ட அரண்மனைப் பணியாளர்களையோ, விரிவாக அரசவை அதிகாரிகளையோ குறிக்கலாம். முதன்மை உரையில் இயல்பான பரந்த பொருள் தரப்பட்டு, குறிப்பான மாற்று அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: வாயிலைக் காவல்காத்த
  rationale: ‘வாசற்படி’ என்ற நேரடிப் படிமத்தின் சூழற்பொருள் அரண்மனை நுழைவாயிலைக் காப்பது என்பதால், தெளிவான தமிழ் பொறுப்புப் பெயராக வழங்கப்படுகிறது.
- source_word: וַיְבַקְשׁוּ
  choice: முயன்றார்கள்
  rationale: இங்கு ‘தேடினார்கள்’ என்பது தமிழில் இயல்பாகாது; தீங்கு செய்யும் நோக்கத்தைச் செயலாக்க முயன்றனர் என்ற சூழற்பொருளை இது தெளிவாகத் தருகிறது, ஆனால் திட்டத்தின் விவரத்தைச் சேர்ப்பதில்லை.
- source_word: לִשְׁלֹחַ יָד
  choice: எதிராகக் கைநீட்ட
  rationale: ‘கையை அனுப்புதல்/நீட்டுதல்’ என்ற எபிரெய மரபுத்தொடரின் உருவகத்தைப் பேணி, வன்முறைத் தாக்குதல் என்ற பொருளை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு
  rationale: வரலாற்று அடையாளமான ‘செர்க்செஸ்’ என்பதைப் பதிலீடு செய்யாமல், எபிரெயப் பெயரின் வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது.
