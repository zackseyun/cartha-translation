  source_fidelity: முதல் வாக்கியம் மூலத்தின் மறுப்புத் தொடர்நிலை, ‘பிறப்பு/வம்சம்’ மற்றும் ‘மக்கள்’ என்ற இணையை, மொர்தெகாயின் கட்டளையைக் கச்சிதமாகத் தருகிறது. இரண்டாம் வாக்கியத்தில் தொடர்செயல் நன்கு வெளிப்படுகிறது; ஆனால் ‘பராமரிப்பில் வளர்ந்துவந்தபோது’ என்பதில் மொர்தெகாய் எஸ்தரை வளர்த்த உறவு வெளிப்படையாக இல்லை. அதைத் தெளிவுபடுத்துதல் בְאָמְנָה אִתּוֹ-வின் வளர்ப்பு/பாதுகாவலர் பொருளைச் சிறப்பாகக் காக்கும்.
  naturalness: ‘மொர்தெகாய் தனக்குக் கட்டளையிட்டபடியே’ என்பதில் ‘தனக்கு’ என்ற தற்சுட்டுப் பதிலிப்பெயர் மொர்தெகாயையே சுட்டுவதுபோல் கணநேரத் தெளிவின்மையை உருவாக்கலாம். ‘அவளுக்குக்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது. திருத்தப்பட்ட இரண்டாம் வாக்கியம் நவீனத் தரத் தமிழில் தெளிவாக ஒலிக்கிறது.
