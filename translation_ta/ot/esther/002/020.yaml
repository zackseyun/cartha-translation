base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
translation:
  language: ta
  text: மொர்தெகாய் அவளுக்குக் கட்டளையிட்டபடியே, எஸ்தர் தன் பிறப்புவழியையோ தன் மக்களையோ இன்னும் தெரிவிக்கவில்லை[a]. மொர்தெகாய் அவளை வளர்த்துவந்த காலத்தில் செய்ததுபோலவே, அவர் சொன்னதை எஸ்தர் தொடர்ந்து செய்துவந்தாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன் பிறப்புவழி’ என்பதற்குப் பதிலாக ‘தன் வம்சம்’ அல்லது ‘தன் உறவினர்குழு’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் பிறப்பு, மூதாதையர் வழி அல்லது உறவுக்குழுவைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, மொர்தெகாய் அவளை வளர்த்துவந்த காலத்தில் செய்ததுபோல. எஸ்தரின் முந்தைய வாழ்க்கையில் அவர் அவளுடைய பாதுகாவலராக இருந்து அவளை வளர்த்ததை எபிரேயச் சொற்றொடர் நினைவுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין אֶסְתֵּר מַגֶּדֶת
  choice: எஸ்தர் ... இன்னும் தெரிவிக்கவில்லை
  rationale: אֵין உடன் வரும் நிகழ்காலப் பங்கேற்புவினை, அந்தக் கதைக்கட்டம் வரையிலும் தகவலை வெளியிடாத தொடர்நிலையை உணர்த்துகிறது. தமிழில் ‘இன்னும் தெரிவிக்கவில்லை’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מוֹלַדְתָּהּ
  choice: தன் பிறப்புவழி
  rationale: இந்தச் சொல் பிறப்பு, மூதாதையர் வழி அல்லது உறவுக்குழுவைக் குறிக்கலாம். ‘பிறப்புவழி’ அதன் விரிவை ஓரளவு காத்து, அடுத்துவரும் ‘தன் மக்கள்’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: עַמָּהּ
  choice: தன் மக்கள்
  rationale: עַם இங்கு எஸ்தர் சார்ந்த இன/தேசிய மக்களைக் குறிக்கிறது. ‘தன் மக்கள்’ இயல்பானதும் தேவையற்ற நவீன வகைப்பாட்டைச் சேர்க்காததும் ஆகும்.
- source_word: כַּאֲשֶׁר צִוָּה עָלֶיהָ מָרְדֳּכָי
  choice: மொர்தெகாய் தனக்குக் கட்டளையிட்டபடியே
  rationale: צוה என்பது வெறும் ஆலோசனையைவிட வலிமையான ஆணையைத் தருகிறது; ‘கட்டளையிட்டபடியே’ அந்த வலிமையையும் כַּאֲשֶׁר-ன் ஒப்புமையையும் காக்கிறது.
- source_word: מַאֲמַר מָרְדֳּכַי
  choice: அவர் சொன்னதை
  rationale: מַאֲמַר என்பது சொல், கூற்று அல்லது கட்டளை எனப் பொருள்படலாம். முன்பே ‘கட்டளையிட்ட’ என்று வந்துள்ளதால், இங்கு ‘அவர் சொன்னதை’ என்பது மறுபடியும் பொருளை மிகைப்படுத்தாமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: אֶסְתֵּר עֹשָׂה
  choice: எஸ்தர் தொடர்ந்து செய்துவந்தாள்
  rationale: பங்கேற்புவினையான עֹשָׂה வழக்கமான அல்லது தொடர்ந்த செயலைக் குறிக்கிறது. ‘தொடர்ந்து செய்துவந்தாள்’ அந்த நீடித்த கீழ்ப்படிதலைத் தமிழில் தெளிவாக்குகிறது.
- source_word: כַּאֲשֶׁר הָיְתָה בְאָמְנָה אִתּוֹ
  choice: மொர்தெகாயின் பராமரிப்பில் வளர்ந்துவந்தபோது செய்ததுபோலவே
  rationale: אמן சார்ந்த வடிவம் வளர்க்கப்படுதல் அல்லது பாதுகாவலரின் பராமரிப்பில் இருத்தலை நினைவுபடுத்துகிறது. ‘பராமரிப்பில் வளர்ந்துவந்தபோது’ வளர்ப்பு மற்றும் காவல் ஆகிய இரு நுணுக்கங்களையும் இயல்பாகக் கொண்டுவருகிறது.
