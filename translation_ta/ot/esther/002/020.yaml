translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பெயர் ‘மொர்தெகாய்’ எனத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் வைக்கப்பட்டது. தொடர்செயலைக் காட்ட ‘இன்னும் தெரிவிக்கவில்லை’, ‘தொடர்ந்து செய்துவந்தாள்’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டன; மூலத்தின் பிறப்பு/உறவு மற்றும் வளர்ப்பு/பாதுகாப்பு சார்ந்த பொருள் நெகிழ்வு அடிக்குறிப்புகளில் காக்கப்பட்டது.
