  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்வைக்கு விருப்பமான’ என்பது முதல் எபிரெய மரபுத்தொடரின் உருவகச் சுவையை ஓரளவு தக்கவைக்கிறது; அதே மரபுத்தொடரின் இரண்டாம் நிகழ்வு இயல்பான தமிழுக்காக ‘நன்றாகத் தோன்றியது’ என வழங்கப்பட்டுள்ளது.
