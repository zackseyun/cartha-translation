revisions:
- from: அரசனின் பார்வைக்கு விருப்பமான இளம்பெண் வஸ்திக்குப் பதிலாக அரசியாகட்டும்[a]. இந்த யோசனை அரசனுக்கு நன்றாகத் தோன்றியது[b]; அவன் அதன்படியே செய்தான்.
  to: அரசனுக்குப் பிடித்த இளம்பெண் வஸ்திக்குப் பதிலாக அரசியாகட்டும்[a]. இந்த யோசனை அரசனுக்கு நன்றாகத் தோன்றியது[b]; அவன் அதன்படியே செய்தான்.
  rationale: The revision replaces an unnatural and potentially visually restrictive expression with idiomatic Tamil that conveys the Hebrew idiom of pleasing the king. It retains the contextual rendering ‘அரசியாகட்டும்’ and preserves the alternative ‘ஆட்சி செய்யட்டும்’ in a footnote. The second footnote is adjusted to present its wording as an alternative translation rather than as a strictly literal one.
