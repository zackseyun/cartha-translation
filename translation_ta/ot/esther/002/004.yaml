base_translation:
  language: en
  yaml_path: translation/ot/esther/002/004.yaml
  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
translation:
  language: ta
  text: அரசனுக்குப் பிடித்த இளம்பெண் வஸ்திக்குப் பதிலாக அரசியாகட்டும்[a]. இந்த யோசனை அரசனுக்கு நன்றாகத் தோன்றியது[b]; அவன் அதன்படியே செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்று மொழிபெயர்ப்பு: ‘வஸ்திக்குப் பதிலாக ஆட்சி செய்யட்டும்.’'
    reason: lexical_alternative
  - marker: b
    text: 'மாற்று மொழிபெயர்ப்பு: ‘இந்தக் காரியம் அரசனின் பார்வையில் நல்லதாக இருந்தது.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: இளம்பெண்
  rationale: נַעֲרָה என்பது இளம் வயதுடைய பெண்ணைக் குறிக்கிறது; ‘இளம்பெண்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ளது.
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  choice: அரசனின் பார்வைக்கு விருப்பமான
  rationale: ‘அரசனின் கண்களில் நல்லவளாக இருத்தல்’ என்ற எபிரெய மரபுத்தொடரின் மதிப்பீடு மற்றும் விருப்பம் ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: תִּמְלֹךְ
  choice: அரசியாகட்டும்
  rationale: மூல வினைச்சொல் நேரடியாக ‘ஆட்சி செய்யட்டும்’ எனப் பொருள்படலாம்; இச்சூழலில் வஸ்திக்குப் பதிலாக அரசியின் நிலையை ஏற்றுக்கொள்வதைக் குறிக்கும் இயல்பான தமிழ் ‘அரசியாகட்டும்’ ஆகும். நேரடி பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תַּחַת וַשְׁתִּי
  choice: வஸ்திக்குப் பதிலாக
  rationale: תַּחַת இங்கு இடத்தைக் குறிக்காமல் மாற்றீட்டைக் குறிக்கிறது.
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  choice: இந்த யோசனை அரசனுக்கு நன்றாகத் தோன்றியது
  rationale: דָּבָר இச்சூழலில் முன்வைக்கப்பட்ட திட்டம் அல்லது யோசனையைக் குறிக்கிறது; בְּעֵינֵי என்ற மரபுத்தொடரையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּעַשׂ כֵּן
  choice: அவன் அதன்படியே செய்தான்
  rationale: முன்வைக்கப்பட்ட யோசனையின்படி அரசன் செயல்பட்டான் என்ற எளிய கதைநடைச் சூத்திரத்தைத் தெளிவாக வழங்குகிறது.
