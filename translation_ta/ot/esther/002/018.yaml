translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரசவைச் சூழலுக்காக ‘அதிகாரிகள்’, ‘மாகாணங்கள்’ போன்ற தெளிவான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தில் உள்ள הֲנָחָה என்பதன் உண்மையான பொருள் அகலம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
