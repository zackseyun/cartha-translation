base_translation:
  language: en
  yaml_path: translation/ot/esther/002/018.yaml
  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
translation:
  language: ta
  text: பின்பு அரசன் தன் அதிகாரிகள், பணியாளர்கள் அனைவருக்கும் ஒரு பெரிய விருந்தை நடத்தினான்—எஸ்தரின் விருந்து. மாகாணங்களுக்கு நிவாரணம் அளித்து[a], அரசனின் தாராளத்திற்கேற்ப பரிசுகளையும் வழங்கினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாகாணங்களில் விடுமுறை அறிவித்தான்” அல்லது “மாகாணங்களுக்கு வரி முதலியவற்றிலிருந்து விலக்கு அளித்தான்.” எபிரெயச் சொல் ஓய்வு, நிவாரணம் அல்லது விலக்கு ஆகிய பொருள்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “அரசனின் கைக்கு ஏற்ப.” இது அரசனுக்குரிய வளம் அல்லது தாராளத்திற்கேற்ற அளவைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדוֹל
  choice: ஒரு பெரிய விருந்து
  rationale: מִשְׁתֶּה என்பது பானத்துடன் கூடிய விருந்து அல்லது விருந்துபசாரத்தைக் குறிக்கிறது; அரசவைச் சூழலில் இயல்பான தமிழாக ‘பெரிய விருந்து’ பொருந்துகிறது.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: தன் அதிகாரிகள், பணியாளர்கள் அனைவருக்கும்
  rationale: שָׂרִים என்பதை பாரசீக அரசவைச் சூழலுக்கேற்ற ‘அதிகாரிகள்’ என்றும், עֲבָדִים என்பதன் அடிப்படைப் பொருளைத் தக்கவைத்து ‘பணியாளர்கள்’ என்றும் மொழிபெயர்க்கிறது.
- source_word: אֵת מִשְׁתֵּה אֶסְתֵּר
  choice: எஸ்தரின் விருந்து எனப்பட்ட
  rationale: எபிரெயக் கட்டமைப்பு எஸ்தரோடு தொடர்புடைய விருந்தைக் குறிக்கிறது. தமிழ் வாசகத்தில் அது விருந்தின் பெயர் அல்லது மரியாதைத் தொடர்பு என்பதை இயல்பாகத் தெரிவிக்க இவ்வாறு அமைக்கப்பட்டுள்ளது; எஸ்தர் விருந்தளித்தார் என்று தவறாக உணர்த்துவதைத் தவிர்க்கிறது.
- source_word: וַהֲנָחָה לַמְּדִינוֹת עָשָׂה
  choice: மாகாணங்களுக்கு நிவாரணம் அளித்து
  rationale: הֲנָחָה ஓய்வு, தளர்வு, சலுகை அல்லது வரிவிலக்கு போன்ற பல பொருள்களை ஏற்கக்கூடியது. ‘நிவாரணம்’ அந்தப் பொருள் அகலத்தை ஓரளவு காக்கிறது; மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: מַשְׂאֵת
  choice: பரிசுகள்
  rationale: இச்சூழலில் அரசனால் வழங்கப்பட்ட கொடைகள் அல்லது அன்பளிப்புகளைக் குறிக்கும் பரந்த, இயல்பான தமிழ் சொல்.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: அரசனுக்கேற்ற தாராளத்துடன்
  rationale: சொல்லர்த்தமாக ‘அரசனின் கைக்கு ஏற்ப’ என்ற மரபுத்தொடர், அரசரின் செல்வவளம் அல்லது தாராளத்திற்கேற்ற அளவைக் குறிக்கிறது. தமிழில் பொருளை இயல்பாக எடுத்துரைக்கிறது; சொல்லர்த்தம் அடிக்குறிப்பில் உள்ளது.
- source_word: וַיַּעַשׂ
  choice: நடத்தினான்
  rationale: விருந்தின் தொடர்பில் ‘செய்தான்’ என்பதைக் காட்டிலும் ‘விருந்தை நடத்தினான்’ என்பது நவீனத் தமிழில் இயல்பான நிகழ்ச்சி நடத்தல் பொருளைத் தருகிறது.
