- from: பின்பு அரசன் தன் அதிகாரிகள், பணியாளர்கள் அனைவருக்கும் எஸ்தரின் விருந்து எனப்பட்ட ஒரு பெரிய விருந்தை நடத்தினான். மாகாணங்களுக்கு நிவாரணம் அளித்து[a], அரசனுக்கேற்ற தாராளத்துடன் பரிசுகளையும் வழங்கினான்[b].
