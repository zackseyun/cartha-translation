  language: ta
  text: அப்போது அரசனுக்குப் பணிவிடை செய்த இளைஞர்கள், “தோற்றத்தில் அழகான இளம் கன்னிப்பெண்களை அரசனுக்காகத் தேடட்டும்[a]” என்றார்கள்.
