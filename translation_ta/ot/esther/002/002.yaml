lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: அப்போது ... என்றார்கள்
  rationale: வாவ்-தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீன தமிழில் இயல்பான நிகழ்வுத் தொடரை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: அரசனுடைய இளைஞர்கள்
  rationale: נַעַר என்பதன் அடிப்படை வயதுசார் பொருளைத் தக்கவைக்கிறது; அடுத்துள்ள מְשָׁרְתָיו அவர்களுடைய பணியைத் தனியாகக் குறிப்பிடுவதால் ‘ஊழியர்கள்’ என்று மட்டும் மொழிபெயர்க்கப்படவில்லை.
- source_word: מְשָׁרְתָיו
  choice: அரசனுக்குப் பணிவிடை செய்த
  rationale: அரசனுக்குத் தனிப்பட்ட முறையில் சேவை செய்து வந்தவர்களைக் குறிக்கும் பங்கேற்பு வடிவத்தை இயல்பான தமிழ்ப் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: יְבַקְשׁוּ
  choice: தேடட்டும்
  rationale: மூலத்தின் செயப்பாட்டு வடிவத்தையும் முன்மொழிவு அல்லது கட்டளை நயத்தையும் காக்கிறது; செய்பவர் குறிப்பிடப்படாத தன்மையையும் தமிழில் இயல்பாக விடுகிறது.
- source_word: לַמֶּלֶךְ
  choice: அரசனுக்காக
  rationale: நோக்கம் அல்லது பயனாளியைக் குறிக்கும் எளிய தாதிவுப் பொருளை மேலதிக விளக்கம் இன்றித் தருகிறது.
- source_word: נְעָרוֹת בְּתוּלוֹת
  choice: இளம் கன்னிப்பெண்கள்
  rationale: இளமை மற்றும் கன்னித்தன்மை ஆகிய இரு கூறுகளையும் தெளிவாகவும் நவீன தமிழில் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: טוֹבוֹת מַרְאֶה
  choice: தோற்றத்தில் அழகான
  rationale: ‘தோற்றத்தில் நல்ல’ என்ற எபிரெய மொழிவழக்கின் உடல் அழகைக் குறிக்கும் பொருளைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
