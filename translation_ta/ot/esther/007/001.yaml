  yaml_path: translation/ot/esther/007/001.yaml
  text: So the king and Haman came to drink with Queen Esther[a].
translation:
  language: ta
  text: அரசனும் ஆமானும் அரசி எஸ்தருடன் குடிப்பதற்காக வந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லமைப்பை இன்னும் நெருக்கமாகப் பின்பற்றினால்: “அரசனும் ஆமானும் எஸ்தர் அரசியுடன் குடிப்பதற்காக வந்தார்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தார்கள்
  rationale: בוא என்பதன் wayyiqtol வடிவம் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. எழுவாய் இருவரைக் குறிப்பதால் தமிழில் மரியாதைப் பன்மையான ‘வந்தார்கள்’ இயல்பாக உள்ளது; ‘உள்ளே நுழைந்தார்கள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத குறிப்பைச் சேர்க்கும்.
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: அரசனும் ஆமானும்
  rationale: இணைப்புச் சொல்லுடன் வரும் இரு பெயர்ச்சொற்களையும் தமிழின் இயல்பான ‘-உம் ... -உம்’ அமைப்பில் வழங்குகிறது. הַמֶּלֶךְ என்பது குறிப்பிட்ட அரசனைச் சுட்டுவதால் ‘அரசன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִשְׁתּוֹת
  choice: குடிப்பதற்காக
  rationale: שׁתה என்பதன் infinitive construct நேரடியாக ‘குடிக்க’ எனப் பொருள்படும். விருந்து அல்லது திராட்சரசம் இங்கு வெளிப்படையாகக் குறிப்பிடப்படாததால் அவை உரையில் சேர்க்கப்படவில்லை.
- source_word: עִם
  choice: உடன்
  rationale: உடனிருத்தல் அல்லது சேர்ந்து செய்தலைக் குறிக்கும் இந்த முன்னிடைச்சொல்லின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: அரசி எஸ்தர்
  rationale: எபிரெயத்தில் சொற்படி ‘எஸ்தர் அரசி’ என்ற பின்னிணைவு அமைப்பு உள்ளது. நவீன தமிழில் பட்டத்தைப் பெயருக்கு முன் வைக்கும் ‘அரசி எஸ்தர்’ இயல்பானதும் பொருளை மாற்றாததும் ஆகும்.
