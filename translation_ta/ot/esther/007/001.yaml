translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடிப்பதற்காக’ என்று மூலத்தின் குறுகிய பொருள் காக்கப்பட்டு, சூழலால் ஊகிக்கக்கூடிய ‘விருந்துண்ண’ அல்லது ‘திராட்சரசம் குடிக்க’ என்பவை சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
