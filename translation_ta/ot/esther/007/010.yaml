base_translation:
  language: en
  yaml_path: translation/ot/esther/007/010.yaml
  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
translation:
  language: ta
  text: மொர்தெகாய்க்காக ஆமான் தயார் செய்திருந்த மரக்கம்பத்தில் ஆமானைத் தொங்கவிட்டார்கள்[a]. அப்போது அரசனுடைய கடுங்கோபம் தணிந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மொர்தெகாய்க்காக ஆமான் தயார் செய்திருந்த கம்பத்தில் அவனைக் குத்தி ஏற்றினார்கள்.” எபிரெய மொழியில் עֵץ என்பது ‘மரம்,’ ‘மரப்பொருள்,’ அல்லது ‘கம்பம்’ என்றும், תלה என்பது உடலை உயர்த்தித் தொங்கவிடுதல் என்றும் பொருள்படலாம்; தண்டனை நிறைவேற்றப்பட்ட துல்லியமான முறை விவாதத்திற்குரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְלוּ
  choice: தொங்கவிட்டார்கள்
  rationale: תלה என்பதன் அடிப்படைப் பொருள் ஒருவரையோ ஒன்றையோ தொங்கவிடுதல் அல்லது உயர்த்தித் தொங்கச் செய்தல். மரணதண்டனையின் துல்லியமான முறை எபிரெயச் சொற்களில் தெளிவாக நிர்ணயிக்கப்படாததால், பொதுவான பொருளை முதன்மை உரை காக்கிறது.
- source_word: הָמָן
  choice: ஆமான்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל הָעֵץ
  choice: மரக்கம்பத்தில்
  rationale: עֵץ என்பது மரம், மரப்பொருள் அல்லது மரக்கம்பம் எனப் பொருள்படலாம். இச்சூழலில் தண்டனைக்காக அமைக்கப்பட்ட மரச் சாதனத்தை இயல்பாகக் குறிக்க ‘மரக்கம்பம்’ தேர்ந்தெடுக்கப்பட்டது; ‘தூக்குமரம்’ என மொழிபெயர்ப்பது தண்டனை முறையைத் தேவையின்றி குறுக்கிவிடும்.
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  choice: மொர்தெகாய்க்காக ஆமான் தயார் செய்திருந்த
  rationale: הכין என்பதன் ‘தயார் செய்தல், ஆயத்தப்படுத்துதல்’ என்ற பொருளையும், ஆமான் பிறருக்காகத் தயாரித்த சாதனமே அவனுக்குப் பயன்படுத்தப்பட்ட கதைநய முரணையும் தெளிவாகக் காக்கிறது.
- source_word: וַחֲמַת הַמֶּלֶךְ
  choice: அரசனுடைய கடுங்கோபம்
  rationale: חֵמָה குறிக்கும் தீவிரமான சினத்தை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்த ‘கடுங்கோபம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שָׁכָכָה
  choice: தணிந்தது
  rationale: שׁכך என்பதன் ‘அடங்குதல், குறைதல், தணிதல்’ என்ற பொருளுக்கு இயல்பான நவீனத் தமிழ் இணை.
