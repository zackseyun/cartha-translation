  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
translation:
  language: ta
  text: அப்போது ராஜாவின் முன்னிலையில் இருந்த அரண்மனை அதிகாரிகளில் ஒருவனான ஹர்போனா[a], “மேலும், இதோ, ராஜாவுக்கு நன்மையாகப் பேசிய மொர்தெகாய்க்காக ஆமான் அமைத்த மரக்கட்டமைப்பு[b] ஆமானின் வீட்டில் நிற்கிறது; அது ஐம்பது முழம் உயரமானது” என்றான். அதற்கு ராஜா, “அவனை அதில் தொங்கவிடுங்கள்[c]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரண்மனை அதிகாரிகள்” என்பதற்கான எபிரெயச் சொல் அரசவையில் பணியாற்றிய அண்ணகர்களை, அதாவது ஆண்மை நீக்கப்பட்ட பணியாளர்களை, குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் சொல்லர்த்தமாக “மரம்” அல்லது “மரப்பொருள்.” இங்கு அது மரணதண்டனைக்காக அமைக்கப்பட்ட மரக்கட்டமைப்பைக் குறிக்கிறது; அதன் துல்லியமான வடிவம் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: c
    text: “தொங்கவிடுங்கள்” என்பதற்குப் பதிலாக “அதிலே கழுவேற்றுங்கள்” என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொற்கள் மரக்கட்டமைப்பில் உடலைத் தொங்கவிடுதல் அல்லது ஏற்றுதல் என்ற விரிவான பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  choice: ஹர்போனா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: הַסָּרִיסִים
  choice: அரண்மனை அதிகாரிகள்
  rationale: அரசவையில் பணியாற்றிய ஆண்மை நீக்கப்பட்ட பணியாளர்களைக் குறிப்பது முதன்மையான சாத்தியம்; ஆனால் இச்சொல் விரிவாக அரசவை அதிகாரிகளையும் குறிக்கக்கூடும். இயல்பான நவீனத் தமிழுக்காக பொதுவான பொருள் முதன்மை உரையில் வைக்கப்பட்டு, குறிப்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: ராஜாவின் முன்னிலையில் இருந்த
  rationale: அரசரின் சமூகத்தில் பணியாற்றி அவர் முன்னிலையில் இருந்த அரசவைச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גַּם הִנֵּה
  choice: இதோ
  rationale: கவனத்தை உடனடியாக ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையைத் தக்கவைக்கிறது; ‘גם’ என்பதன் சேர்க்கை உணர்வு சூழலில் இயல்பாக உட்பொதிகிறது.
- source_word: הָעֵץ
  choice: மரத்தாலான கொலைக்கருவி
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘மரம்/மரப்பொருள்’; இங்கு மரணதண்டனைக்காக அமைக்கப்பட்ட கட்டமைப்பைக் குறிக்கிறது. பின்னாளைய தூக்குமேடை வடிவைத் தேவையின்றி முன்கூட்டியே நிர்ணயிக்காமல் செயல்பாட்டைத் தெளிவாக்குகிறது.
- source_word: עָשָׂה ... לְמָרְדֳּכַי
  choice: மொர்தெகாய்க்காக ஆமான் அமைத்த
  rationale: ‘செய்தான்’ என்ற அடிப்படைப் பொருளையும் மொர்தெகாய்க்கு எதிரான நோக்கத்தையும் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  choice: ராஜாவுக்கு நன்மை உண்டாகும்படி பேசிய
  rationale: மொர்தெகாய் ராஜாவுக்கு நன்மையான செய்தியைச் சொன்னார் என்ற பொருளை வெளிப்படுத்துகிறது; ‘ராஜாவைப் பற்றி நல்லவிதமாகப் பேசினார்’ என்ற மாற்றுச் சாத்தியத்தை முற்றிலும் மறைக்காமல் எபிரெய மொழிநடையின் நோக்கை இயல்பாக்குகிறது.
- source_word: עֹמֵד בְּבֵית הָמָן
  choice: ஆமானின் வீட்டில் நிற்கிறது
  rationale: நிகழ்காலப் பங்கேற்புச் சொல்லின் கண்முன் நிற்கும் தன்மையையும் ஆமானின் வளாகம் என்ற இடத்தையும் நெருக்கமாகத் தருகிறது.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: ஐம்பது முழம் உயரமானது
  rationale: பண்டைய அளவான முழத்தை மாற்றாமல் வைத்து, மூலத்தின் முறையான அளவீட்டைத் தக்கவைக்கிறது.
- source_word: תְּלֻהוּ עָלָיו
  choice: அவனை அதிலேயே தொங்கவிடுங்கள்
  rationale: கட்டளை வடிவையும் முன் குறிப்பிடப்பட்ட மரக்கருவியைக் குறிக்கும் சுட்டையும் தெளிவாகத் தருகிறது; செய்முறை தூக்கிலிடுதலா அல்லது கழுவேற்றுதலா என்ற வரலாற்றுத் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: மொர்தெகாய் ராஜாவுக்காகச் செய்த நன்மையின் சொல்லாக்கம்
  choice: ராஜாவுக்கு நன்மை உண்டாகும்படி பேசிய
  alternative: ராஜாவைப் பற்றி நல்லவிதமாகப் பேசிய
  rationale: இது குறிப்பாக ஒரு கோட்பாட்டுச் சிக்கல் அல்ல; இருப்பினும் மொர்தெகாயின் செயலை வெறும் புகழ்ச்சியாக மாற்றாமல், ராஜாவுக்கு நன்மை பயந்த தகவலை அவர் தெரிவித்தார் என்ற கதையோட்டத்தைப் பாதுகாக்கிறது, அதே நேரத்தில் மூலத்தின் மொழிநடைத் திறப்பை அடிக்குறிப்பில் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் அரசவைக் காட்சிக்குரிய கண்ணியமும் இணைக்கப்பட்டுள்ளன. “ராஜா,” “அரண்மனை அதிகாரிகள்,” “முழம்” ஆகிய சொற்கள் சாதாரண வாசகர்களுக்குப் புரியக்கூடியவையாகவும் மூலச் சூழலுக்கு நெருக்கமாகவும் உள்ளன. மரணதண்டனைக் கருவியின் வடிவமும் סריסים என்ற அரசவைச் சொல்லின் குறிப்பான பொருளும் உறுதியாகத் தீர்மானிக்கப்படாமல் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
