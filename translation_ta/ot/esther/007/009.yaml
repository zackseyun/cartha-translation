  source_fidelity: முதன்மை உரை பெரும்பாலும் மூலத்திற்கு நெருக்கமாக உள்ளது. ஆனால் “மரத்தாலான கொலைக்கருவி” என்பது הָעֵץ (‘மரம்/மரப்பொருள்’) என்பதைக் காட்டிலும் மரணதண்டனைக் கருவி என அதிகமாக நிர்ணயிக்கிறது; “ராஜாவுக்கு நன்மை உண்டாகும்படி பேசிய” என்பதும் மூலத்தின் சற்றே திறந்த சொல்லாக்கத்தை விளக்கமாக்குகிறது. திருத்தம் இவ்விரு இடங்களிலும் மூலத்தின் திறப்பைச் சிறப்பாகப் பாதுகாக்கிறது; גַּם הִנֵּה-யின் சேர்க்கை வலிமையும் வெளிப்படுத்தப்படுகிறது.
  naturalness: நடை தெளிவாகவும் நவீனத் தரத் தமிழுக்கு ஏற்றதாகவும் உள்ளது. “மரக்கட்டமைப்பு” என்பது இச்சூழலில் இயல்பானது; அதேவேளை அதன் துல்லியமான வடிவத்தைத் தீர்மானிப்பதில்லை. அடிக்குறிப்பு அ-வில் இருந்த இலக்கணச் சீர்கேடும் சரிசெய்யப்பட்டுள்ளது.
  terminology: “அரண்மனை அதிகாரிகள்” என்பது סָרִיסִים என்பதன் பரந்த அரசவைப் பொருளுக்குப் பொருத்தமான முதன்மை உரைத் தேர்வு; அண்ணகர்கள் என்ற குறிப்பான சாத்தியம் அடிக்குறிப்பில் முறையாகத் தரப்படுகிறது. “மரக்கட்டமைப்பு,” “முழம்,” மற்றும் “தொங்கவிடுங்கள்” ஆகியவை மூலத்தின் பொருளையும் வரலாற்றுத் தெளிவின்மையையும் பாதுகாக்கின்றன.
