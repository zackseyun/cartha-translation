  text: וְ/הַ/מֶּ֜לֶךְ קָ֤ם בַּ/חֲמָת/וֹ֙ מִ/מִּשְׁתֵּ֣ה הַ/יַּ֔יִן אֶל גִּנַּ֖ת הַ/בִּיתָ֑ן וְ/הָמָ֣ן עָמַ֗ד לְ/בַקֵּ֤שׁ עַל נַפְשׁ/וֹ֙ מֵֽ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה כִּ֣י רָאָ֔ה כִּֽי כָלְתָ֥ה אֵלָ֛י/ו הָ/רָעָ֖ה מֵ/אֵ֥ת הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
translation:
  language: ta
  text: அப்போது ராஜா கடும் சினத்துடன் திராட்சரச விருந்திலிருந்து எழுந்து அரண்மனைத் தோட்டத்திற்குச் சென்றார்.[a] ஆனால் ஆமான் தன் உயிருக்காக அரசி எஸ்தரிடம் மன்றாடுவதற்காகத் தங்கியிருந்தான்; தனக்கு எதிரான கேடு ராஜாவால் முடிவாகிவிட்டதை அவன் கண்டான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரண்மனைத் தோட்டம்’ என்பதை ‘மண்டபத் தோட்டம்’ அல்லது ‘அரண்மனை வளாகத்தின் தோட்டம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில் இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக, ‘ராஜாவிடமிருந்து தனக்கு எதிரான கேடு முடிவாகிவிட்டதை அவன் கண்டான்’ என்று உள்ளது. ராஜாவின் தீர்ப்பு இனி மாறாதபடி உறுதியாகிவிட்டது என்பதே கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  choice: கடும் சினத்துடன்
  rationale: חֵמָה குறிக்கும் தீவிரமான, எரியும் கோபத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  choice: திராட்சரச விருந்திலிருந்து
  rationale: מִשְׁתֶּה என்பதன் விருந்து/குடிவிருந்து பொருளையும் הַיַּיִן என்பதன் வெளிப்படையான திராட்சரசக் குறிப்பையும் காக்கிறது.
- source_word: גִּנַּת הַבִּיתָן
  choice: அரண்மனைத் தோட்டத்திற்கு
  rationale: பாரசீக அரசவையின் சூழலில் בִּיתָן குறிக்கக்கூடிய அரண்மனை அல்லது மண்டப வளாகத்தை வாசகருக்கு இயல்பாகப் புரியவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עָמַד
  choice: அங்கேயே நின்றான்
  rationale: எபிரெயச் சொல்லின் நேரடியான ‘நின்றான்’ என்ற தோற்றத்தையும், ராஜா வெளியேறியபோது ஆமான் அங்கேயே தங்கியிருந்த கதைநடை எதிர்மறையையும் காக்கிறது.
- source_word: לְבַקֵּשׁ עַל נַפְשׁוֹ
  choice: தன் உயிரைக் காப்பாற்றும்படி ... மன்றாட
  rationale: தன் உயிருக்காக வேண்டுதல் என்ற எபிரெய மொழிமரபை இயல்பான தமிழில், காட்சியின் அவசரத்துடன் வெளிப்படுத்துகிறது.
- source_word: מֵאֶסְתֵּר הַמַּלְכָּה
  choice: அரசி எஸ்தரிடம்
  rationale: அரசப் பட்டத்தைப் பெயருக்கு முன் வைத்து நவீனத் தமிழ் வழக்கில் இயல்பாக அளிக்கிறது.
- source_word: כִּי רָאָה
  choice: ஏனெனில் ... கண்டான்
  rationale: ஆமான் மன்றாடியதற்கான காரணத்தை அறிமுகப்படுத்தும் כִּי-யின் காரணப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: כִּי כָלְתָה אֵלָיו הָרָעָה מֵאֵת הַמֶּלֶךְ
  choice: ராஜா தனக்குத் தீங்கு செய்யத் தீர்மானித்துவிட்டதை
  rationale: ‘தீமை/பேரழிவு அவனுக்கு எதிராக ராஜாவிடமிருந்து முடிவாகிவிட்டது’ என்ற சொற்றொடரின் இறுதியான தீர்ப்பு உணர்வை இயல்பான தமிழில் தருகிறது; மூலத்தின் மாற்றுப் படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: הָרָעָה என்பதன் ‘தீமை’ மற்றும் ‘பேரழிவு/தீங்கு’ இடையிலான பொருள் நெருக்கடி
  choice: தீங்கு
  alternative: தீமை; பேரழிவு; அழிவு
  rationale: இங்கு சொல் ஆமான்மீது வரவிருக்கும் அரச தண்டனை அல்லது கேட்டைச் சுட்டுகிறது. ‘தீங்கு’ நெறிசார் தீமை என்று மட்டும் தீர்மானிக்காமல் நிகழவிருக்கும் கேட்டைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜா’, ‘அரசி’, ‘மன்றாட’ ஆகியவை பொதுவாசகருக்குப் புரியும் வகையிலும் அரசவைக் காட்சிக்கேற்ற முறையிலும் உள்ளன. நேரடி எபிரெயப் படிமம் தமிழில் இயல்பற்ற இடங்களில் பொருள் சார்ந்த சமநிலை தேர்ந்தெடுக்கப்பட்டு, உண்மையான சொற்பொருள் வேறுபாடுகள் அடிக்குறிப்புகளில் காக்கப்பட்டுள்ளன.
