base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
translation:
  language: ta
  text: இரண்டாம் நாளிலும், திராட்சரச விருந்தின்போது, அரசன் எஸ்தரிடம், “எஸ்தர் அரசியே, உன் விண்ணப்பம் என்ன? அது உனக்கு வழங்கப்படும். உன் வேண்டுகோள் என்ன? அரசாட்சியின் பாதிவரை கூட[a], அது நிறைவேற்றப்படும்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரசாட்சியின் பாதிவரை” என்பது அரசரின் மிகுந்த தயவைக் காட்டும் வழக்கமான அரசவைக் கூற்று; அரசாட்சியை உண்மையாகவே இரண்டாகப் பிரித்துக் கொடுப்பதாக அவசியம் பொருள்படாது.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם בַּיּוֹם הַשֵּׁנִי
  choice: இரண்டாம் நாளிலும்
  rationale: גַּם குறிக்கும் தொடர்ச்சியையும் בַּיּוֹם הַשֵּׁנִי என்பதன் நேரடியான காலக் குறிப்பையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: திராட்சரச விருந்தின்போது
  rationale: மது அருந்தும் விருந்து என்ற குறிப்பிட்ட சூழலைப் பாதுகாத்து, நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: מַה שְּׁאֵלָתֵךְ
  choice: உன் விண்ணப்பம் என்ன?
  rationale: அரசவைக்குரிய முறையான கோரிக்கையைச் சுட்டும் சொல்லாக ‘விண்ணப்பம்’ பொருத்தமானது.
- source_word: וְתִנָּתֵן לָךְ
  choice: அது உனக்கு வழங்கப்படும்
  rationale: எழுத்துப்பொருளான ‘கொடுக்கப்படும்’ என்பதையும் அரசரின் உறுதியான அனுமதி உணர்வையும் இயல்பாகத் தருகிறது.
- source_word: בַּקָּשָׁתֵךְ
  choice: உன் வேண்டுகோள்
  rationale: שְׁאֵלָה உடன் உள்ள பொருள் நெருக்கத்தையும் எபிரெயச் சொல் மாறுபாட்டையும் ‘விண்ணப்பம்/வேண்டுகோள்’ எனப் பிரதிபலிக்கிறது.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: அரசாட்சியில் பாதிவரை கேட்டாலும்
  rationale: ‘அரசாட்சியின் பாதிவரை’ என்ற எல்லையைத் தக்கவைத்து, தமிழில் முழுமையான நிபந்தனைத் தொடராக இயல்பாக்குகிறது; மூலத்தில் இல்லாத ‘என்’ சேர்க்கப்படவில்லை.
- source_word: וְתֵעָשׂ
  choice: அது நிறைவேற்றப்படும்
  rationale: வேண்டுகோள் செயலாக்கப்படும் என்ற விளைவை இயல்பாகவும் அரசவைக்குரிய கண்ணியமான நடையிலும் வெளிப்படுத்துகிறது.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: எஸ்தர் அரசியே
  rationale: நேரடி அழைப்பைத் தமிழின் விளிவேற்றுமையுடன் இயல்பாகவும் மரியாதையுடனும் தருகிறது.
