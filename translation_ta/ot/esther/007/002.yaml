translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் இரு இணையான கேள்விகளும் தொடர்ந்துள்ளன; சொல் மாறுபாடு ‘விண்ணப்பம்/வேண்டுகோள்’ எனப் பாதுகாக்கப்பட்டுள்ளது.
