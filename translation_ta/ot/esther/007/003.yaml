base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
translation:
  language: ta
  text: அதற்கு அரசி எஸ்தர் மறுமொழியாக, “அரசே, உமது பார்வையில் எனக்குத் தயவு கிடைத்திருந்தால், அரசருக்கு விருப்பமானால், என் வேண்டுதலின்படி என் உயிர் எனக்குத் தரப்படட்டும்; என் கோரிக்கையின்படி என் மக்களும் தரப்படட்டும்” என்றாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַר
  choice: மறுமொழியாக ... என்றாள்
  rationale: இரு எபிரெய வினைகளின் பதிலுரைப் பொருளையும் பேச்சை அறிமுகப்படுத்தும் பணியையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது; தேவையற்ற ‘பதிலளித்துச் சொன்னாள்’ என்ற இரட்டிப்பைத் தவிர்க்கிறது.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: அரசி எஸ்தர்
  rationale: எஸ்தரின் அரசப் பட்டத்தைத் தெளிவாகவும் இயல்பான தமிழ்ச் சொல்வரிசையிலும் தருகிறது.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: உமது பார்வையில் எனக்குத் தயவு கிடைத்திருந்தால்
  rationale: அரண்மனை மரியாதை மொழியையும் ‘உமது கண்களில்’ என்ற எபிரெய உருவகத்தின் பொருளையும் வாசிக்க இயல்பான முறையில் காக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசே
  rationale: இது நேரடி விளி என்பதையும் மரியாதையான அரசவைப் பேச்சையும் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  choice: அரசருக்கு விருப்பமானால்
  rationale: ‘அரசருக்கு நன்றாக இருந்தால்’ என்ற சொற்படி வடிவத்தைவிட, அரசரின் ஒப்புதல் அல்லது விருப்பத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழ்ப் பொருளை வழங்குகிறது.
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  choice: என் உயிர் எனக்குத் தரப்படட்டும்
  rationale: נתן என்பதன் நிஃபால் செயப்பாட்டு வடிவத்தையும் வேண்டுகோள் நயத்தையும் காக்கிறது; இச்சூழலில் נֶפֶשׁ என்பது ‘ஆத்துமா’ அல்ல, உயிரைக் குறிக்கிறது.
- source_word: בִּשְׁאֵלָתִי ... בְּבַקָּשָׁתִי
  choice: என் வேண்டுதலின்படி ... என் கோரிக்கையின்படி
  rationale: இணையான இரு எபிரெயப் பெயர்ச்சொற்களின் சிறிய சொல்வேறுபாட்டை ‘வேண்டுதல்/கோரிக்கை’ என்று காக்கிறது; בְּ என்பதன் அடிப்படை அல்லது தொடர்புப் பொருளை ‘-இன்படி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְעַמִּי
  choice: என் மக்களும்
  rationale: எஸ்தர் தன்னிலிருந்து தன் இன மக்களிடம் வேண்டுகோளை விரிவுபடுத்துவதை நேரடியாகக் காட்டுகிறது; ‘-உம்’ இணைநிலையை வெளிப்படுத்துகிறது.
