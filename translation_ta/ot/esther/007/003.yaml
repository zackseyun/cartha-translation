translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான அரசவைப் பேச்சு பயன்படுத்தப்பட்டுள்ளது. ‘உமது’, ‘அரசே’ ஆகிய வடிவங்கள் மரியாதையைத் தக்கவைக்கின்றன. மூலத்தின் செயப்பாட்டு வேண்டுகோள் பிரதான உரையில் பாதுகாக்கப்பட்டு, இயல்பான செய்பாட்டு மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
