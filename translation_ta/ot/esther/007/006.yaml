  text: And Esther said, “A hostile and enemy man—this evil Haman!” Then Haman was terrified before the king and the queen.
translation:
  language: ta
  text: எஸ்தர், “பகைவனும் எதிரியுமானவன் இந்தப் பொல்லாத ஆமான்தான்!” என்றாள். அப்போது ஆமான் ராஜாவுக்கும் ராணிக்கும் முன்பாகத் திகிலடைந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  choice: பகைவனும் எதிரியுமான மனிதன்
  rationale: אִישׁ என்பதையும் இரு இணையான பகைமைச் சொற்களையும் வெளிப்படையாக வைத்திருக்கிறது; இயல்பான தமிழில் குற்றஞ்சாட்டும் வலிமையையும் காக்கிறது.
- source_word: הָמָן הָרָע הַזֶּה
  choice: இந்தப் பொல்லாத ஆமான்தான்
  rationale: הַזֶּה என்பதன் சுட்டும் வலிமையையும், הָרָע என்பதன் ஒழுக்கத் தீர்ப்பையும், அடையாளத்தை வலியுறுத்தும் தமிழ் அமைப்பில் தருகிறது.
- source_word: נִבְעַת
  choice: திகிலடைந்தான்
  rationale: திடீரென அச்சத்தால் கலங்கிப்போன நிலையைச் சுருக்கமாகவும் வலிமையாகவும் தெரிவிக்கிறது.
- source_word: מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה
  choice: ராஜாவுக்கும் ராணிக்கும் முன்பாக
  rationale: இருவரின் முன்னிலையில் ஏற்பட்ட பயத்தை மூலத்தின் நேரடியான இடைமுகத்துடன் பாதுகாக்கிறது.
