revisions:
- from: அதற்கு எஸ்தர், “பகைவனும் எதிரியுமான மனிதன்—இந்தப் பொல்லாத ஆமான்தான்!” என்றாள். அப்போது ஆமான் ராஜாவுக்கும் ராணிக்கும் முன்பாகத் திகிலடைந்தான்.
  to: எஸ்தர், “பகைவனும் எதிரியுமானவன் இந்தப் பொல்லாத ஆமான்தான்!” என்றாள். அப்போது ஆமான் ராஜாவுக்கும் ராணிக்கும் முன்பாகத் திகிலடைந்தான்.
  rationale: The revision makes the accusation natural in modern standard Tamil without weakening the Hebrew's paired terms for hostility or its pointed identification, “this evil Haman.” It also removes a small added discourse connective while preserving the courtly narrative tone and the terror expressed by נִבְעַת.
