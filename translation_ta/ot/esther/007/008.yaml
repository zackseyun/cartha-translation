base_translation:
  language: en
  yaml_path: translation/ot/esther/007/008.yaml
  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: ta
  text: அரசன் அரண்மனைத் தோட்டத்திலிருந்து திராட்சரச விருந்து நடந்த அறைக்குத் திரும்பி வந்தான். அப்போது எஸ்தர் இருந்த மஞ்சத்தின்மேல் ஆமான் விழுந்துகொண்டிருந்தான்.[a] அரசன், “நான் இந்த வீட்டில் இருக்கும்போதே அரசியையும் இவன் பலவந்தப்படுத்தப் போகிறானா?”[b] என்றான். அரசனின் வாயிலிருந்து அந்த வார்த்தை வெளிவந்தவுடனே, அவர்கள் ஆமானின் முகத்தை மூடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விழுந்துகொண்டிருந்தான்” என்பது ஆமான் எஸ்தரிடம் இரக்கம் வேண்டி அவள் இருந்த மஞ்சத்தின்மேல் சாய்ந்து மன்றாடியதைக் குறிக்கலாம்.
    reason: எபிரெயப் பங்கேற்புவினையின் தொடர்நிலையையும், செயலின் சூழல்சார் பொருளையும் தெளிவுபடுத்துகிறது; ஆனால் அதை முதன்மை உரையில் விளக்கமாகச் சேர்த்து ambiguity-ஐ நீக்கவில்லை.
  - marker: b
    text: “பலவந்தப்படுத்த” என்பதற்கான எபிரெயச் சொல் “அடக்குதல்” அல்லது “வசப்படுத்துதல்” என்றும் பொருள்படலாம்; இங்கு அரசனின் கேள்வி உடல் அல்லது பாலியல் அத்துமீறலைச் சுட்டக்கூடும்.
    reason: மூலச் சொல்லின் பொருள் வரம்பையும் இச்சூழலில் உள்ள கடுமையான சாயலையும் வாசகருக்குக் காட்டுகிறது.
lexical_decisions:
- source_word: נֹפֵל
  choice: விழுந்துகொண்டிருந்தான்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்நிலைத் தன்மையைப் பாதுகாக்கிறது. சூழலில் ஆமான் இரக்கத்திற்காக எஸ்தரிடம் மன்றாடி மஞ்சத்தின்மேல் சாய்ந்திருக்கலாம்; வெறுமனே முன்பே விழுந்துவிட்டான் என்று முடிவுசெய்யவில்லை.
- source_word: לִכְבּוֹשׁ
  choice: பலவந்தப்படுத்த
  rationale: ‘அடக்குதல்/வசப்படுத்துதல்’ என்ற அடிப்படை உணர்வையும், அரசனின் குற்றச்சாட்டில் உள்ள உடல் அல்லது பாலியல் அத்துமீறல் சாயலையும் தாங்கும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; குறிப்பிட்ட செயலைத் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  choice: திராட்சரச விருந்து நடந்த அறை
  rationale: சொல்லுக்குச் சொல் அமைப்பின் பொருளை இயல்பான நவீனத் தமிழில் அறை/விருந்திடம் என வெளிப்படுத்துகிறது.
- source_word: וּפְנֵי הָמָן חָפוּ
  choice: அவர்கள் ஆமானின் முகத்தை மூடினார்கள்
  rationale: எபிரெய வடிவத்தின் பொருளை இயல்பான தமிழில் செயப்பாட்டு முகமாக வழங்குகிறது; செய்பவர்கள் அரண்மனைப் பணியாளர்கள் எனச் சூழல் உணர்த்தினாலும் உரை அவர்களைப் பெயரிடவில்லை.
theological_decisions:
- issue: ஆமானின் செயலை அரசன் எவ்வாறு விளக்குகிறான்
  choice: அரசியை ‘பலவந்தப்படுத்த’ முயல்வதாக அரசன் கேட்கிறான்
  alternative: ‘தாக்க’ அல்லது வெளிப்படையாக ‘வல்லுறவு கொள்ள’
  rationale: மூலச் சொல்லின் வன்முறை மற்றும் சாத்தியமான பாலியல் சாயலைப் பாதுகாத்து, அதன் பரந்த பொருளை ஒரே குறிப்பிட்ட குற்றமாகச் சுருக்காமல் விடுகிறது.
- issue: ஆமான் மஞ்சத்தின்மேல் இருந்த விதம்
  choice: ‘விழுந்துகொண்டிருந்தான்’ என்ற தொடர்நிலை
  alternative: ‘விழுந்திருந்தான்’ அல்லது ‘பணிந்து மன்றாடிக்கொண்டிருந்தான்’
  rationale: மூலத்தின் பங்கேற்புவினையை நெருக்கமாகப் பின்பற்றி, அது தற்செயலான விழுதலா அல்லது மன்றாட்டின் உடல்நிலையா என்ற சூழல்சார் பதற்றத்தைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான கதைநடை பயன்படுத்தப்பட்டது. ‘அரசன்’, ‘அரசி’, ‘மஞ்சம்’ ஆகியவை வேதாகம வரலாற்றுச் சூழலுக்கேற்ற பொதுவாகப் புரியும் சொற்கள். வாக்கிய ஓட்டம் இயல்பாக்கப்பட்டாலும், மூலத்தின் தொடர்நிலை, அரசனின் திடீர் குற்றச்சாட்டு, முகம் மூடப்பட்ட உடனடி விளைவு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
