translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரின் ‘உள்ளம்’ சார்ந்த உருவகம் பகுதியளவில் காக்கப்பட்டு, அதன் இயல்பான பொருள் முதன்மை உரையில் தெளிவாக்கப்பட்டுள்ளது.
