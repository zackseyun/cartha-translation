base_translation:
  language: en
  yaml_path: translation/ot/esther/007/005.yaml
  text: Then King Ahasuerus said to Esther the queen[a], “Who is he, and where is he[b], who has filled his heart to do this?”
translation:
  language: ta
  text: அப்போது அகாஸ்வேரு ராஜா எஸ்தர் அரசியிடம், “தன் மனதில் இதைச் செய்யத் துணிந்தவன் யார்? அவன் எங்கே இருக்கிறான்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: அப்போது ... கேட்டான்
  rationale: தொடர்கதை வரிசையை ‘அப்போது’ காட்டுகிறது. எபிரெய மொழியில் இருமுறை வரும் ‘சொன்னான்’ என்பதைத் தமிழில் இயல்பான ஒரே பேச்சு அறிமுகமாகச் சுருக்கி, வினாவின் சூழலுக்கேற்ப ‘கேட்டான்’ என வழங்கப்பட்டுள்ளது.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு ராஜா
  rationale: பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்த்து, தமிழில் இயல்பான பெயர்–பட்ட வரிசை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: எஸ்தர் அரசியிடம்
  rationale: எபிரெயத்தின் ‘எஸ்தர், அரசி’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מִי הוּא זֶה
  choice: யார்?
  rationale: இது நபரின் அடையாளத்தை வலியுறுத்திக் கேட்கிறது. தமிழில் ‘அவன் யார்?’ என்ற கருத்தை அடுத்த தொடர்புச் சொற்றொடருடன் இயல்பாக இணைக்கிறது.
- source_word: וְאֵי זֶה הוּא
  choice: அவன் எங்கே இருக்கிறான்?
  rationale: אֵי என்பதன் வழக்கமான இடவினாப் பொருளை ஏற்றுக்கொள்கிறது; அடையாளத்தை மட்டும் கேட்கும் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ
  choice: தன் உள்ளத்தில் துணிந்தவன்
  rationale: சொல்லுக்குச் சொல் ‘தன் இதயத்தை நிரப்பியவன்’ என்பது இங்கு துணிதல் அல்லது முனைதலைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘தன் உள்ளத்தில் துணிந்தவன்’ என்பது இதய/உள்ளக் கருத்தையும் மரபுத்தொடரின் பொருளையும் காக்கிறது.
- source_word: לַעֲשׂוֹת כֵּן
  choice: இதைச் செய்ய
  rationale: முன்பு கூறப்பட்ட அழிவுத் திட்டத்தையே כֵּן சுட்டுவதால், ‘இதை’ என்பது தெளிவான இயல்பான தமிழ்.
