  text: כִּ֤י נִמְכַּ֨רְנוּ֙ אֲנִ֣י וְ/עַמִּ֔/י לְ/הַשְׁמִ֖יד לַ/הֲר֣וֹג וּ/לְ/אַבֵּ֑ד וְ֠/אִלּוּ לַ/עֲבָדִ֨ים וְ/לִ/שְׁפָח֤וֹת נִמְכַּ֨רְנוּ֙ הֶחֱרַ֔שְׁתִּי כִּ֣י אֵ֥ין הַ/צָּ֛ר שֹׁוֶ֖ה בְּ/נֵ֥זֶק הַ/מֶּֽלֶךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male servants and female servants, I would have kept silent, for the adversary is not worth the damage to the king.
translation:
  language: ta
  text: ஏனெனில், நானும் என் மக்களும் அழிக்கப்படவும், கொல்லப்படவும், ஒழித்துக்கட்டப்படவும் விற்கப்பட்டிருக்கிறோம். ஆனால், நாங்கள் ஆண் அடிமைகளாகவும் பெண் அடிமைகளாகவும் விற்கப்பட்டிருந்தால், நான் மௌனமாக இருந்திருப்பேன்; ஏனெனில், அரசனுக்கு ஏற்படும் இழப்பை அந்த எதிரியால் ஈடுசெய்ய முடியாது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் சிரமமானது. இதை, “அரசனுக்கான இழப்பு” என்றும் மொழிபெயர்க்கலாம். “இழப்பு” என்பது நிதி இழப்பு, சேதம், அல்லது பாதிப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְכַּרְנוּ
  choice: விற்கப்பட்டிருக்கிறோம்
  rationale: מכר என்பதன் செயல்பாட்டு வடிவம் இயல்பாக ‘விற்கப்படுதல்’ எனப் பொருள்படும். அடுத்த பகுதியில் வரும் அடிமைகளாக விற்கப்படுதல் என்ற ஒப்பீட்டுடன் தொடர்புடைய வாணிக உருவகத்தையும் இச்சொல் காக்கிறது.
- source_word: עַמִּי
  choice: என் மக்கள்
  rationale: עם இங்கு எஸ்தர் தன்னை அடையாளப்படுத்திக்கொள்ளும் இன மக்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘என் மக்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: அழிக்கப்படவும் கொல்லப்படவும் ஒழித்துக்கட்டப்படவும்
  rationale: மூன்று நெருங்கிய பொருளுடைய வினைச்சொற்கள் அச்சுறுத்தலின் தீவிரத்தை அடுக்கிக் காட்டுகின்றன. தமிழிலும் மும்மை அமைப்பைத் தக்கவைத்து, சூழலில் பாதிக்கப்படுவோரின் கண்ணோட்டத்தை வெளிப்படுத்தச் செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְאִלּוּ
  choice: விற்கப்பட்டிருந்தால்
  rationale: உண்மையில் நிகழாத, குறைவான தீங்கைக் கொண்ட மாற்றுச் சூழலை அறிமுகப்படுத்தும் எதிர்நிலை நிபந்தனை தமிழின் ‘-இருந்தால்’ வடிவால் இயல்பாக வெளிப்படுகிறது.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: ஆண் அடிமைகளாகவும் பெண் அடிமைகளாகவும்
  rationale: எபிரெயம் ஆண் மற்றும் பெண் அடிமைகளைத் தனித்தனியாகக் குறிப்பிடுகிறது. கட்டாய அடிமைத்தனத்தின் வலிமையை மென்மைப்படுத்தாமல் ‘அடிமைகள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הֶחֱרַשְׁתִּי
  choice: நான் மவுனமாக இருந்திருப்பேன்
  rationale: நிபந்தனை வாக்கியத்தின் விளைவுப் பகுதியில் வரும் இவ்வடிவம் நிகழாத கடந்தகாலச் சாத்தியத்தைச் சுட்டுகிறது; ‘இருந்திருப்பேன்’ அதைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַצָּר
  choice: அந்த எதிரி
  rationale: צר பகைமை காட்டுகிற அல்லது நெருக்கடி உண்டாக்குகிற நபரைக் குறிக்கிறது. அரசவைக் சூழலில் ஆமானைச் சுட்டும் வகையில் ‘அந்த எதிரி’ தெளிவாக உள்ளது; மூலச்சொல்லை மிகக் குறுகலாகவும் விளக்கவில்லை.
- source_word: שֹׁוֶה בְּנֵזֶק הַמֶּלֶךְ
  choice: அரசனுக்கு ஏற்படும் இழப்புக்கு ஈடாக மாட்டான்
  rationale: שוה சமமாயிருத்தல் அல்லது ஈடாக இருத்தல் என்ற கருத்தைக் கொண்டது; נזק சேதம், பாதிப்பு அல்லது நிதி இழப்பு எனப் பலவாறு புரியலாம். சிரமமான எபிரெயச் சொற்றொடரின் ஒப்பீட்டு மொழியையும் தெளிவின்மையையும் இந்த மொழிபெயர்ப்பு இயன்றவரை தக்கவைக்கிறது.
