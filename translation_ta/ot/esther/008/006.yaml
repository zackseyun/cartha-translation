  text: כִּ֠י אֵיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בָּ/רָעָ֖ה אֲשֶׁר יִמְצָ֣א אֶת עַמִּ֑/י וְ/אֵֽיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בְּ/אָבְדַ֖ן מוֹלַדְתִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/006.yaml
  text: For how could I bear to see the disaster that will come upon my people? And how could I bear to see the destruction of my kindred?[a]
translation:
  language: ta
  text: ஏனெனில், என் மக்களுக்கு நேரிடும் பேரழிவை நான் எப்படிப் பார்க்க முடியும்? என் உறவினரின்[a] அழிவை நான் எப்படிப் பார்க்க முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிறப்பால் என்னைச் சேர்ந்தவர்களின்.” எபிரெயச் சொல் מוֹלַדְתִּי பிறந்த இடத்தை மட்டும் அல்லாமல், பிறப்பால் தொடர்புடையவர்களையோ உறவினரையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லின் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵיכָכָה אוּכַל וְרָאִיתִי
  choice: நான் எப்படிப் பார்த்துக்கொண்டிருக்க முடியும்?
  rationale: சொல்லளவில் ‘நான் எவ்வாறு முடியும், பார்த்துக்கொண்டு?’ என்ற அமைப்பு; இங்கு பேரிடரைத் தாங்கிக்கொண்டு சாட்சியாக நிற்க இயலாமையை உணர்ச்சிமிக்க வினாவாக இயல்பான தமிழில் தருகிறது.
- source_word: בָּרָעָה אֲשֶׁר יִמְצָא
  choice: நேரிடும் பேரழிவு
  rationale: רָעָה இங்கு ஒழுக்கத் தீமையைக் காட்டிலும் பேரிடர் அல்லது கேட்டை குறிக்கிறது; ימצא என்பது ஒருவருக்கு ஒன்று ‘நேரிடுதல்’ என்ற எபிரெய மரபுத்தொடர்.
- source_word: עַמִּי
  choice: என் மக்கள்
  rationale: எஸ்தர் தன்னை யூத மக்களோடு அடையாளப்படுத்துவதைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.
- source_word: בְּאָבְדַן
  choice: அழிவு
  rationale: אבד என்ற வேரிலிருந்து வரும் இப்பெயர்ச்சொல் அழிதல் அல்லது நாசமாதலைக் குறிக்கிறது; ‘அழிவு’ பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: מוֹלַדְתִּי
  choice: என் இனத்தார்
  rationale: பிறப்பால் தொடர்புடைய மக்கள் அல்லது உறவினர் என்ற பொருளை இச்சூழலில் தருகிறது; வெறும் பிறந்த இடம் என்று புவியியல் பொருளில் குறுக்காமல் இன மற்றும் உறவுப் பிணைப்பை வெளிப்படுத்துகிறது.
