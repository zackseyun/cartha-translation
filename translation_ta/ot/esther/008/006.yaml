- from: ஏனெனில், என் மக்களுக்கு நேரிடும் பேரழிவை நான் எப்படிப் பார்த்துக்கொண்டிருக்க முடியும்? என் இனத்தாரின்[a] அழிவை நான் எப்படிப் பார்த்துக்கொண்டிருக்க முடியும்?
  to: ஏனெனில், என் மக்களுக்கு நேரிடும் பேரழிவை நான் எப்படிப் பார்க்க முடியும்? என் உறவினரின்[a] அழிவை நான் எப்படிப் பார்க்க முடியும்?
