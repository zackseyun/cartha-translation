  source_fidelity: முதன்மை உரை எபிரெயக் கதைத் தொடரையும்—அரசனின் பெயரில் எழுதுதல், அரச முத்திரை மோதிரத்தால் முத்திரையிடுதல், குதிரைமேல் செல்லும் தூதர்கள் வழியாகக் கடிதங்களை அனுப்புதல்—நன்றாகக் கொண்டுவருகிறது. ஆனால் அரிய குதிரைத் தொடரில் உள்ள பலவகை ஐயங்களை ஒரே ‘அரசுக்குரிய உயர்ரகக் குதிரைகள்’ என்ற விளக்கமாகச் சுருக்குவது மூலத்தின் விவாதத்துக்குரிய சொற்களுக்குச் சற்றே அதிகத் துல்லியம் தருகிறது.
