  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
translation:
  language: ta
  text: அவன் அகாஸ்வேரு ராஜாவின் பெயரில் கடிதங்களை எழுதி, ராஜாவின் முத்திரை மோதிரத்தால் அவற்றுக்கு முத்திரையிட்டு, தேர்ந்த இனக் குதிரைகளில் சவாரி செய்த தூதர்கள் மூலம் அவற்றை அனுப்பினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வசனத்தில் குதிரைகளைக் குறிக்கும் எபிரெயச் சொற்கள் அரியவை; அவற்றின் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை. கடைசித் தொடரை இன்னும் சொல்லுக்குச் சொல்லாக, “குதிரைகள், ரெகெஷ், அகஷ்தரானீம், ரம்மாகீமின் சந்ததிகள்” என்றும் மொழிபெயர்க்கலாம். இவை அரச குதிரைப் பண்ணையைச் சேர்ந்த அல்லது அரசுத் தூதுப்பணிக்குப் பயன்படுத்தப்பட்ட விலங்குகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: அவன் ... கடிதங்களை எழுதி
  rationale: தொடர்ச்சியான எபிரெயக் கதை வினைச்சொல் தமிழில் இயல்பான இறந்தகாலத் தொடர்வினையாக மொழிபெயர்க்கப்பட்டது; முந்தைய சூழலில் உள்ள ஆண்பால் ஒருமை எழுவாய் ‘அவன்’ என்று வெளிப்படுத்தப்பட்டது.
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: அகாஸ்வேரு ராஜாவின் பெயரில்
  rationale: அரசனின் அதிகாரத்தின் கீழ் செயல்படுவதைக் குறிக்கும் בְּשֵׁם என்ற மரபுத்தொடரின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: ராஜாவின் முத்திரை மோதிரத்தால் அவற்றுக்கு முத்திரையிட்டு
  rationale: טַבַּעַת என்பதன் அரசவைக் சூழலிலான முத்திரை மோதிரப் பொருளை வெளிப்படுத்துகிறது. எபிரெயத்தில் செயல் ஒருமையாகக் கூறப்பட்டாலும், கடிதங்கள் பன்மை என்பதால் தமிழில் ‘அவற்றுக்கு’ என இயல்பாக அமைக்கப்பட்டது.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: கடிதங்களை ... அனுப்பினான்
  rationale: סְפָרִים இங்கு அதிகாரப்பூர்வமான எழுத்துத் தகவல்களைக் குறிக்கிறது; ‘கடிதங்கள்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: בְּיַד הָרָצִים
  choice: குதிரைத் தூதர்கள் மூலம்
  rationale: בְּיַד என்பதன் கருவி அல்லது முகமைப் பொருளை ‘மூலம்’ எனத் தருகிறது. இவர்கள் குதிரையில் செல்லும் அரசுத் தூதர்கள் என்பதால் ‘ஓடுகிறவர்கள்’ என்ற சொல்லுக்குச் சொல் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: בַּסּוּסִים רֹכְבֵי
  choice: குதிரைகளில் சவாரி செய்த
  rationale: குதிரைமேல் பயணித்த தூதர்களை இயல்பான தமிழில் விவரிக்கிறது.
- source_word: הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים
  choice: அரசுக்குரிய உயர்ரகக் குதிரைகள்
  rationale: இந்தத் தொடரிலுள்ள பல சொற்கள் அரியவையும் பொருள் உறுதியாகத் தெரியாதவையும் ஆகும். அரசவையோ அரசுத் தூதுப்பணியோ சார்ந்த தேர்ந்த சவாரி விலங்குகள் என்ற சூழல்சார்ந்த மையப் பொருளை இது தருகிறது; ஐயத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
