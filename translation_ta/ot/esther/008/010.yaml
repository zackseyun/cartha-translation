  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified narrative நடை பயன்படுத்தப்பட்டது. ‘ராஜா’, ‘முத்திரை மோதிரம்’, ‘குதிரைத் தூதர்கள்’ ஆகியவை அரசாணைச் சூழலைத் தெளிவாக்குகின்றன. அரிய பாரசீகக் காலக் குதிரைச்சொற்களுக்கு பொய்யான துல்லியம் கொடுக்காமல், மூலத்தின் ஐயம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
