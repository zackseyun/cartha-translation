base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
translation:
  language: ta
  text: பின்பு எஸ்தர் மறுபடியும் அரசரின் முன்னிலையில் பேசினாள். அவள் அவருடைய காலடியில் விழுந்து அழுது, ஆகாகியனான ஆமானின் தீமையையும் அவன் யூதர்களுக்கு எதிராகத் தீட்டிய திட்டத்தையும் நீக்கிவிடும்படி[a] அவரிடம் மன்றாடினாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடந்துபோகச் செய்யும்படி” அல்லது “அகற்றிவிடும்படி”; எபிரெய வினைச்சொல், ஆமானின் தீமையும் திட்டமும் நடைமுறைக்கு வராமல் நீக்கப்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף ... וַתְּדַבֵּר
  choice: மறுபடியும் ... பேசினாள்
  rationale: יסף உடன் தொடரும் வினை, செயல் மீண்டும் நிகழ்வதையோ தொடர்வதையோ குறிக்கிறது; நவீன தமிழில் ‘மறுபடியும் பேசினாள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசரின் முன்னிலையில்
  rationale: அரசவையின் முறையான சூழலையும் அரசரின் சந்நிதியில் பேசுவதையும் வெளிப்படுத்துகிறது.
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו
  choice: அவருடைய காலடியில் விழுந்து
  rationale: உடலால் தாழ விழுந்து வேண்டிக்கொள்ளும் பணிவான நிலையைக் குறிக்கும் எபிரெயச் சொல்லாட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: וַתֵּבְךְּ וַתִּתְחַנֶּן לוֹ
  choice: அழுது ... அவரிடம் மன்றாடினாள்
  rationale: בכה அழுகையையும், חנן என்பதன் ஹித்பயேல் வடிவம் இரக்கம் அல்லது தயவு நாடும் உருக்கமான வேண்டுதலையும் குறிக்கின்றன.
- source_word: לְהַעֲבִיר
  choice: நீக்கிவிடும்படி
  rationale: עבר என்பதன் ஹிப்இல் வடிவம் ஒன்றைக் கடந்துபோகச் செய்தல், அகற்றுதல் அல்லது நடைமுறையிலிருந்து நீக்குதல் என்ற பொருளைக் கொண்டது; இச்சூழலில் ‘நீக்கிவிடு’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: אֶת רָעַת הָמָן
  choice: ஆமானின் தீமையை
  rationale: רָעָה என்பது தீமை, கேடு அல்லது அழிவு எனப் பொருள்படலாம். அடுத்ததாக ‘திட்டம்’ தனியே வருவதால், இரண்டையும் ஒன்றாக்காமல் ‘தீமை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הָאֲגָגִי
  choice: ஆகாகியனான
  rationale: ஆமானை அடையாளப்படுத்தும் இன அல்லது வம்சப் பட்டப்பெயரைத் தமிழில் ஒலிபெயர்த்துத் தருகிறது.
- source_word: מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב
  choice: அவன் ... தீட்டிய திட்டத்தை
  rationale: חשב என்ற ஒரே வேர் பெயர்ச்சொல்லாகவும் வினையாகவும் வரும் வலியுறுத்தலை, தமிழில் தேவையற்ற மறுகூறல் இல்லாமல் திட்டமிட்ட சதிநோக்குடன் வெளிப்படுத்துகிறது.
- source_word: עַל הַיְּהוּדִים
  choice: யூதர்களுக்கு எதிராக
  rationale: பகைமையான சூழலில் עַל எதிரான நோக்கைக் குறிக்கிறது.
