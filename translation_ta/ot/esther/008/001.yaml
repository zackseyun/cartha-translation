  text: בַּ/יּ֣וֹם הַ/ה֗וּא נָתַ֞ן הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה אֶת בֵּ֥ית הָמָ֖ן צֹרֵ֣ר ה/יהודיים וּ/מָרְדֳּכַ֗י בָּ֚א לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ כִּֽי הִגִּ֥ידָה אֶסְתֵּ֖ר מַ֥ה הוּא לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: ta
  text: அந்த நாளில் அகாஸ்வேரு அரசன், யூதர்களின் பகைவனான ஆமானின் வீட்டை அரசி எஸ்தருக்குக் கொடுத்தான். எஸ்தர் மொர்தெகாய் தனக்கு என்ன உறவுடையவர் என்பதை அரசனிடம் தெரிவித்திருந்ததால், மொர்தெகாய் அரசனின் முன்னிலையில் வந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הָמָן
  choice: ஆமானின் உடைமைகள்
  rationale: எபிரெயச் சொல்லான בַּיִת இங்கு வெறும் குடியிருப்பை மட்டுமல்லாமல் ஆமானின் இல்லம், சொத்துகள், குடும்பச் செல்வம் ஆகியவற்றை உள்ளடக்கிய ‘estate/household’ பொருளில் வருகிறது; நவீன தமிழில் ‘உடைமைகள்’ சூழலுக்கேற்ற தெளிவை அளிக்கிறது.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: யூதர்களின் பகைவன்
  rationale: צֹרֵר என்பது பகைமை கொண்டு எதிர்ப்பவர் அல்லது துன்புறுத்துபவர்; இங்கு இயல்பான தமிழில் ‘பகைவன்’ பொருத்தமானது.
- source_word: בָּא לִפְנֵי הַמֶּלֶךְ
  choice: அரசன் முன்னிலையில் வந்தார்
  rationale: அரசவைக்கு அல்லது அரசனின் நேரடி முன்னிலைக்கு அனுமதிக்கப்பட்டதைச் சுட்டும் எபிரெய மொழிநடையை இயல்பாகவும் அதன் அரசவை நுணுக்கத்தை இழக்காமலும் வழங்குகிறது.
- source_word: מַה הוּא לָהּ
  choice: தனக்கு என்ன உறவுடையவர்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவர் அவளுக்கு என்னவாக இருந்தார்’ என்பதாக இருந்தாலும், தமிழில் இது அவர்களுக்கிடையிலான உறவைச் சுட்டுவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי
  choice: தெரிவித்திருந்ததால்
  rationale: இங்கு மொர்தெகாய் அரசன் முன்னிலையில் வந்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது; ஆகவே காரணப்பொருள் தமிழில் வினையுடன் இணைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: எஸ்தர் தெரிவித்த உறவின் துல்லிய தன்மை
  choice: ‘என்ன உறவுடையவர்’ என்று பொதுவாக வைத்தல்
  alternative: ‘தன் உறவினர்’ அல்லது ‘தன் வளர்ப்புத் தந்தை’ என்று குறிப்பாக்குதல்
  rationale: மூல வசனம் உறவின் தன்மையை இங்கே விவரிக்காமல் מַה הוּא לָהּ என்று மட்டுமே கூறுகிறது. முந்தைய கதைத்தகவலை இவ்வசனத்திற்குள் சேர்த்து மூலத்தின் பொதுமையைத் தீர்த்துவிடாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதையும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. பெயர்கள் ‘அகாஸ்வேரு, ஆமான், எஸ்தர், மொர்தெகாய்’ என தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பில் வழங்கப்பட்டுள்ளன. ‘அரசி’ என்பது இயல்பான நவீன தமிழ் சொற்தேர்வு.
