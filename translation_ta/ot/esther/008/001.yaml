  source_fidelity: ‘ஆமானின் உடைமைகளை’ என்பது בֵּית הָמָן (‘ஆமானின் வீடு/இல்லம்’) என்பதன் ஒருமை உருவத்தையும் அதன் நேரடி உருவகத்தையும் ‘உடைமைகள்’ எனப் பன்மையாக்கி விரிவுபடுத்துகிறது. சூழலில் அந்த ‘வீடு’ சொத்துரிமை அல்லது குடும்ப இல்லத்தை உள்ளடக்கலாம்; ஆனால் வசனத்தில் மூலச் சொல்லை நேரடியாகக் காக்க வேண்டும். பிற பகுதிகள்—ஆமான் யூதர்களின் பகைவன் எனும் அடைமொழி, மொர்தெகாய் அரசன் முன்னிலையில் வருதல், எஸ்தர் அவருக்கு என்ன உறவானவர் என்று தெரிவித்தல்—மூலத்துக்கு ஏற்ப உள்ளன.
