base_translation:
  language: en
  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
translation:
  language: ta
  text: அப்போது அரசன் அகாஸ்வேரு எஸ்தர் அரசியிடமும் யூதனாகிய மொர்தெகாயிடமும், “இதோ, ஆமானின் வீட்டை எஸ்தருக்குக் கொடுத்தேன். அவன் யூதர்களுக்கு எதிராகக் கை நீட்டியதால், அவனைத் தூக்குமரத்தில்[a] தூக்கிலிட்டார்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மரத்தின் மீது.” இங்கு அது ஆமானைத் தூக்கிலிடப் பயன்படுத்தப்பட்ட மரணதண்டனைக் கட்டமைப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழில் அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: அகாஸ்வேரு அரசன்
  rationale: எபிரெயப் பெயரைத் தமிழில் ஒலிபெயர்த்து, இயல்பான தமிழ் பெயர்–பட்ட வரிசை பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: எஸ்தர் அரசியிடம்
  rationale: அரச பட்டத்தைத் தக்கவைத்துக்கொண்டு, நவீனத் தமிழில் இயல்பான வடிவம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  choice: யூதனாகிய மொர்தெகாயிடம்
  rationale: הַיְּהוּדִי இங்கு இன அடையாளத்தைக் குறிக்கிறது; எஸ்தர் நூலின் சூழலில் ‘யூதன்’ பொருத்தமானது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் சுட்டும் வலியுறுத்தலும் இயல்பாகப் பாதுகாக்கப்படுகின்றன.
- source_word: בֵית הָמָן
  choice: ஆமானின் வீடு
  rationale: சொற்றொடரின் நேரடிப் பொருள் ‘ஆமானின் வீடு’; சூழலில் சொத்துடைமையையும் உள்ளடக்கலாம் என்றாலும், மூலத்தின் அகலமான பொருள் தக்கவைக்கப்பட்டுள்ளது.
- source_word: נָתַתִּי
  choice: கொடுத்தேன்
  rationale: முடிவுற்ற அரச நடவடிக்கையை இயல்பான தமிழ் இறந்தகாலத்தில் கூறுகிறது; அதன் தற்போதைய விளைவு சூழலால் தெளிவாகிறது.
- source_word: וְאֹתוֹ תָּלוּ
  choice: அவனை ... தொங்கவிட்டார்கள்
  rationale: எபிரெயத்தில் செய்பவர் குறிப்பிடப்படாத மூன்றாம் நபர் பன்மை உள்ளது; தமிழிலும் பொதுப்பன்மை அதைப் பாதுகாக்கிறது.
- source_word: עַל הָעֵץ
  choice: மரத்தூக்குக் கட்டையில்
  rationale: עֵץ என்பதன் அடிப்படைப் பொருள் ‘மரம்/மரப்பொருள்’; இங்கு ஆமானுக்குப் பயன்படுத்தப்பட்ட மரணதண்டனைக் கட்டமைப்பைத் தெளிவாகக் குறிக்கிறது, அதேவேளை ‘மரம்’ என்ற மூலப் படிமத்தையும் தக்கவைக்கிறது.
- source_word: עַל אֲשֶׁר
  choice: '...தால்'
  rationale: தண்டனைக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שָׁלַח יָדוֹ
  choice: கைநீட்டினான்
  rationale: பகைமையான நடவடிக்கை அல்லது தாக்குதல் முயற்சியைக் குறிக்கும் எபிரெய மரபுத்தொடரின் கைப் படிமம் பாதுகாக்கப்படுகிறது.
- source_word: ביהודיים
  choice: யூதர்களுக்கு எதிராக
  rationale: முன்னொட்டு இங்கு பகைமையான திசையைச் சுட்டுகிறது; ‘எதிராக’ அந்த உறவைத் தெளிவுபடுத்துகிறது.
