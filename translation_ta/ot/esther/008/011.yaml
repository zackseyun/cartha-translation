  text: אֲשֶׁר֩ נָתַ֨ן הַ/מֶּ֜לֶךְ לַ/יְּהוּדִ֣ים אֲשֶׁ֣ר בְּ/כָל עִיר וָ/עִ֗יר לְ/הִקָּהֵל֮ וְ/לַ/עֲמֹ֣ד עַל נַפְשָׁ/ם֒ לְ/הַשְׁמִיד֩ וְ/לַ/הֲרֹ֨ג וּ/לְ/אַבֵּ֜ד אֶת כָּל חֵ֨יל עַ֧ם וּ/מְדִינָ֛ה הַ/צָּרִ֥ים אֹתָ֖/ם טַ֣ף וְ/נָשִׁ֑ים וּ/שְׁלָלָ֖/ם לָ/בֽוֹז׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
translation:
  language: ta
  text: ஒவ்வொரு நகரத்திலுமுள்ள யூதர்கள் ஒன்றுகூடவும், தங்கள் உயிரைக் காக்க நிற்கவும், தங்களைத் தாக்க வரக்கூடிய[a] எந்த மக்களினத்தையோ மாகாணத்தையோ சேர்ந்த எல்லா ஆயுதப் படையையும்—குழந்தைகளையும் பெண்களையும் சேர்த்து[b]—அழிக்கவும், கொல்லவும், முற்றிலும் ஒழிக்கவும், அவர்களுடைய பொருள்களைக் கொள்ளையிடவும் அரசர் அனுமதி அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களைப் பகைத்தவர்கள்.” எபிரெய பெயரெச்சம் அவர்களிடம் எதிரியாக நடந்துகொண்டவர்களைக் குறிக்கலாம்; இங்கு “தாக்க வரக்கூடிய” என்பது ஆணையின் தற்காப்புச் சூழலை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “குழந்தைகளும் பெண்களும்.” ஆணையின் சொற்கள் இவர்களையும் முன் குறிப்பிடப்பட்ட எதிரிக் குழுவிற்குள் வெளிப்படையாகச் சேர்க்கின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר נָתַן
  choice: அனுமதி அளித்தார்
  rationale: அரச ஆணையின் சூழலில், எளிய ‘கொடுத்தார்’ என்பதைவிட அதிகாரப்பூர்வ அனுமதியை இயல்பாக வெளிப்படுத்துகிறது; முந்தைய வசனத்திலிருந்து தொடரும் உறவுத்தொடரின் பொருளையும் தமிழில் முழுமையான வாக்கியமாக அளிக்கிறது.
- source_word: בְּכָל עִיר וָעִיר
  choice: ஒவ்வொரு நகரத்திலும்
  rationale: எபிரெய மொழியின் பகிர்வுநிலைத் திரும்புரையை இயல்பான நவீனத் தமிழில் முழுமையாகக் காட்டுகிறது.
- source_word: לְהִקָּהֵל
  choice: ஒன்றுகூடி
  rationale: நிப்ஆல் வடிவில் உள்ள கூட்டமாகச் சேர்தல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְלַעֲמֹד עַל נַפְשָׁם
  choice: தங்கள் உயிரைக் காக்க நிற்கவும்
  rationale: ‘தங்கள் உயிர்களுக்காக நிற்றல்’ என்ற எபிரெய உருவகத்தை ஓரளவு காத்துக்கொண்டு, அதன் தற்காப்புப் பொருளை தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  choice: அழிக்கவும், கொல்லவும், முற்றிலும் ஒழிக்கவும்
  rationale: மூன்று வன்முறை வினைகளின் திட்டமிட்ட குவிப்பையும் தனித்தனி வலிமையையும் விடாமல் பிரதிபலிக்கிறது.
- source_word: כָּל חֵיל
  choice: எல்லா ஆயுதப்படையினரையும்
  rationale: இச்சூழலில் חֵיל செல்வத்தைவிடப் போர்திறன் அல்லது ஆயுதப்படையைக் குறிக்கிறது; தமிழில் மனித இலக்குகளைக் குறிக்கும் தொடரோடு இயல்பாகப் பொருந்துகிறது.
- source_word: עַם וּמְדִינָה
  choice: எந்த மக்களினத்தையோ மாகாணத்தையோ சேர்ந்த
  rationale: பேரரசிற்குள் உள்ள இன-அரசியல் குழுக்களின் வரம்பற்ற பரப்பைத் தெரிவிக்கிறது.
- source_word: הַצָּרִים אֹתָם
  choice: தங்களைத் தாக்கக்கூடிய
  rationale: எதிரியாக நடப்பதைக் குறிக்கும் எபிரெய பங்கேற்புவினையை, ஆணையின் தற்காப்புச் சூழலில் சாத்தியமான தாக்குதலாகத் தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: טַף וְנָשִׁים
  choice: குழந்தைகளையும் பெண்களையும் சேர்த்து
  rationale: கடினமான மூலமொழி சொற்றொடரை மறைக்காமல் தருகிறது; ‘சேர்த்து’ என்பது அவர்கள் முன் குறிப்பிடப்பட்ட இலக்குக் குழுவின் வரம்பிற்குள் அடங்குவதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: அவர்களுடைய கொள்ளைப்பொருளைக் கொள்ளையிடவும்
  rationale: கைப்பற்றப்பட்ட பொருளைச் சூறையாட அனுமதிக்கும் சட்டநடைச் சொற்றொடரை அதன் வேர்ச்சொல் ஒலிப்புடன் நேரடியாகத் தருகிறது.
theological_decisions:
- issue: அரச ஆணையில் வரும் வன்முறை மொழி
  choice: மூன்று அழிவு வினைகளையும் மென்மைப்படுத்தாமல் மொழிபெயர்த்து, உயிரைக் காக்க நிற்பது மற்றும் எதிரிகளின் தாக்குதல் என்ற தற்காப்புச் சூழலையும் வைத்திருத்தல்
  alternative: ‘தோற்கடிக்க’ அல்லது ‘தங்களைப் பாதுகாத்துக்கொள்ள’ என்று வன்முறையின் தீவிரத்தைச் சுருக்குதல்
  rationale: மூல எபிரெயம் கொல்லுதல், அழித்தல், கொள்ளையிடுதல் ஆகியவற்றை வெளிப்படையாக அனுமதிக்கிறது. மொழிபெயர்ப்பு அதன் தீவிரத்தையும் தற்காப்புச் சட்டகத்தையும் இரண்டையும் பாதுகாக்க வேண்டும்.
- issue: ‘குழந்தைகளும் பெண்களும்’ என்பதன் வரம்பு
  choice: அவர்களை ஆணையில் குறிவைக்கப்பட்ட எதிரிக் குழுவிற்குள் உள்ளவர்களாக வெளிப்படையாகக் காட்டி, ஒழுக்கரீதியான பதற்றத்தைத் தீர்க்காமல் விடுதல்
  alternative: இச்சொற்றொடரை மறைத்தல், தவிர்த்தல், அல்லது போராளிகளோடு தொடர்பில்லாத தனி கருத்தாக மாற்றுதல்
  rationale: சொற்றொடரமைப்பில் ‘குழந்தைகளும் பெண்களும்’ குறிவைக்கப்பட்ட குழுவோடு இணைக்கப்பட்டுள்ளனர். மூலத்தின் கடினமான ஒழுக்கப் பதற்றத்தை மொழிபெயர்ப்பு சுத்திகரிக்கக் கூடாது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான அரசாணை நடையைப் பயன்படுத்துகிறது. வன்முறைச் சொற்கள் மென்மைப்படுத்தப்படவில்லை; ‘அழிக்கவும், கொல்லவும், முற்றிலும் ஒழிக்கவும்’ என்ற மும்மை பாதுகாக்கப்பட்டுள்ளது. ‘தங்கள் உயிரைக் காக்க நிற்கவும்’ என்பது மூல உருவகத்துக்கும் இயல்பான தமிழுக்கும் இடையிலான சமநிலை.
