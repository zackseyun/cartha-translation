- from: அரசர் ஒவ்வொரு நகரத்திலுமுள்ள யூதர்கள் ஒன்றுகூடி, தங்கள் உயிரைக் காக்க நிற்கவும், தங்களைத் தாக்கக்கூடிய[a] எந்த மக்களினத்தையோ மாகாணத்தையோ சேர்ந்த எல்லா ஆயுதப்படையினரையும்—குழந்தைகளையும் பெண்களையும் சேர்த்து[b]—அழிக்கவும், கொல்லவும், முற்றிலும் ஒழிக்கவும், அவர்களுடைய கொள்ளைப்பொருளைக் கொள்ளையிடவும் அனுமதி அளித்தார்.
  to: ஒவ்வொரு நகரத்திலுமுள்ள யூதர்கள் ஒன்றுகூடவும், தங்கள் உயிரைக் காக்க நிற்கவும், தங்களைத் தாக்க வரக்கூடிய[a] எந்த மக்களினத்தையோ மாகாணத்தையோ சேர்ந்த எல்லா ஆயுதப் படையையும்—குழந்தைகளையும் பெண்களையும் சேர்த்து[b]—அழிக்கவும், கொல்லவும், முற்றிலும் ஒழிக்கவும், அவர்களுடைய பொருள்களைக் கொள்ளையிடவும் அரசர் அனுமதி அளித்தார்.
