base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
translation:
  language: ta
  text: எழுதப்பட்ட ஆணையின் நகல் ஒவ்வொரு மாகாணத்திலும்[a] சட்டமாகப் பிறப்பிக்கப்பட்டு, எல்லா மக்களுக்கும் பகிரங்கமாக அறிவிக்கப்பட வேண்டும்; மேலும், யூதர்கள் அந்த நாளுக்காகத் தங்கள் பகைவர்கள்மேல் பழிவாங்க ஆயத்தமாக இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக, ‘ஒவ்வொரு மாகாணம் மாகாணத்திலும்.’ இந்தச் சொல் இரட்டிப்பு ‘ஒவ்வொரு மாகாணத்திலும்’ என்ற பகிர்வுப் பொருளைத் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: எழுதப்பட்ட ஆணையின் நகல்
  rationale: פַּתְשֶׁגֶן என்பது அதிகாரப்பூர்வ ஆவணத்தின் நகலைக் குறிக்கும் பாரசீகக் கடன்சொல்; הַכְּתָב என்பது இச்சூழலில் எழுத்துப்பூர்வமான அரச ஆணையைக் குறிக்கிறது.
- source_word: לְהִנָּתֵן דָּת
  choice: சட்டமாகப் பிறப்பிக்கப்பட வேண்டும்
  rationale: அதிகாரப்பூர்வ உத்தரவு சட்ட வலிமையுடன் வெளியிடப்படுவதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: ஒவ்வொரு மாகாணத்திலும்
  rationale: எபிரெய மொழியின் பகிர்வுப் பொருளுடைய சொல் இரட்டிப்பை இயல்பான தமிழில் துல்லியமாகத் தருகிறது; அதன் நேரடி வடிவம் அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: எல்லா மக்களுக்கும் பகிரங்கமாக அறிவிக்கப்பட வேண்டும்
  rationale: גָּלוּי என்பதன் திறந்த, வெளிப்படையான, பொதுவாக்கப்பட்ட என்ற பொருளையும் பேரரசின் பல்வேறு இன மக்களைக் குறிக்கும் பன்மையையும் வெளிப்படுத்துகிறது.
- source_word: עֲתוּדִים לַיּוֹם הַזֶּה
  choice: அந்த நாளில் ... ஆயத்தமாக இருக்க வேண்டும்
  rationale: குறிக்கப்பட்டிருந்த நாளைச் சுட்டும் உரையாடல் சூழலைத் தமிழில் இயல்பாகத் தருகிறது; עֲתוּדִים என்பதற்கு ‘ஆயத்தமாக’ என்பது பொருத்தமானது.
- source_word: לְהִנָּקֵם מֵאֹיְבֵיהֶם
  choice: தங்கள் பகைவர்களைப் பழிவாங்க
  rationale: נקם வினையின் நிபால் வடிவம் தமக்காகப் பழிவாங்குதல் அல்லது பகை தீர்த்தல் என்ற வலுவான பொருளைக் கொண்டது; வெறும் தற்காப்பு என்று மென்மையாக்கப்படவில்லை.
theological_decisions:
- issue: வன்முறை சார்ந்த நீதித்தீர்ப்பு மொழியை மென்மையாக்கும் சாத்தியம்
  choice: தங்கள் பகைவர்களைப் பழிவாங்க
  alternative: தங்களைத் தற்காத்துக்கொள்ள
  rationale: எபிரெய נקם என்பது குறிப்பாகப் பழிவாங்குதல் அல்லது பகை தீர்த்தலைக் குறிக்கிறது. விரிவான கதைக்களத்தில் தற்காப்பு இடம்பெற்றாலும், இவ்வசனத்தின் சொற்பொருளை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified அரசாணைச் சொற்களாக ‘ஆணை,’ ‘சட்டமாகப் பிறப்பிக்கப்படுதல்,’ ‘பகிரங்கமாக அறிவிக்கப்படுதல்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் நிர்வாகத் தொனியும் பழிவாங்குதல் குறித்த கடினமான சொற்பொருளும் காக்கப்பட்டுள்ளன.
