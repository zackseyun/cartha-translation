translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. அரிதான விலங்குப் பெயர்களின் உறுதியின்மையை முதன்மை உரையில் மிகைப்படுத்தாமல், அடிக்குறிப்பில் பாதுகாக்கிறது. எபிரெய மூலத்தின் இரண்டு அவசரப் பங்கேற்புவினைகளும் தனித்தனியாகத் தக்கவைக்கப்பட்டுள்ளன.
