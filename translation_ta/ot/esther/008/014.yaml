  text: הָ/רָצִ֞ים רֹכְבֵ֤י הָ/רֶ֨כֶשׁ֙ הָֽ/אֲחַשְׁתְּרָנִ֔ים יָֽצְא֛וּ מְבֹהָלִ֥ים וּ/דְחוּפִ֖ים בִּ/דְבַ֣ר הַ/מֶּ֑לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
translation:
  language: ta
  text: தூதர்கள்[a] அரசக் குதிரைகளின்மேல் ஏறி, அரசனின் கட்டளையினால் அவசரப்படுத்தப்பட்டும் உந்தப்பட்டும் புறப்பட்டுச் சென்றார்கள். அரசாணை சூசான் அரண்கோட்டையில் பிறப்பிக்கப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசப் பண்ணையில் வளர்க்கப்பட்ட குதிரைகளின்மேல் ஏறிய தூதர்கள்”; இங்கு சவாரி விலங்குகளைக் குறிக்கும் எபிரெயச் சொற்கள் அரிதானவை; அவற்றின் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: அரசத் தூதர்கள்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘ஓடுபவர்கள்’ என்றாலும், பெர்சிய அரச நிர்வாகச் சூழலில் அரச ஆணைகளை விரைந்து எடுத்துச் செல்லும் அதிகாரப்பூர்வத் தூதர்களைக் குறிக்கிறது.
- source_word: רֹכְבֵי
  choice: மேல் ஏறி
  rationale: தூதர்கள் சவாரி செய்த நிலையைக் காட்டும் எபிரெயப் பங்கேற்புவினையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  choice: அரசக் குதிரைகள்
  rationale: இரு சொற்களும் அரிதானவை; குறிப்பாகப் பெர்சியக் கடன்சொல்லின் துல்லியமான பொருள் உறுதியில்லை. அரசப் பணிக்குரிய வேகமான சவாரி விலங்குகள் என்ற சூழற்பொருளை மிகைப்படுத்தாமல் தருகிறது.
- source_word: יָצְאוּ
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: இங்குள்ள கதையோட்டத்தில் தூதர்கள் ஆணையுடன் வெளியே புறப்படுவதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: מְבֹהָלִים וּדְחוּפִים
  choice: விரைவுபடுத்தப்பட்டும் உந்தப்பட்டும்
  rationale: இரு செயலற்ற பங்கேற்புவினைகளும் வெளிப்புற அதிகாரத்தால் ஏற்பட்ட அவசரத்தையும் தீவிர உந்துதலையும் காட்டுகின்றன; அவற்றின் இணை வலிமை பாதுகாக்கப்படுகிறது.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: அரசனின் கட்டளையால்
  rationale: דבר இங்கு அதிகாரமுள்ள சொல் அல்லது ஆணையைக் குறிக்கிறது; בְּ காரண அல்லது கருவிப் பொருளைத் தருகிறது.
- source_word: וְהַדָּת
  choice: அந்த ஆணை
  rationale: எஸ்தர் நூலின் அரச நிர்வாகச் சூழலில் דת என்பது அதிகாரப்பூர்வ அரசாணையைக் குறிக்கிறது; முந்தைய வசனங்களிலுள்ள ஆணையைச் சுட்டுவதால் ‘அந்த’ இயல்பானது.
- source_word: נִתְּנָה
  choice: பிறப்பிக்கப்பட்டது
  rationale: நேரடியாக ‘கொடுக்கப்பட்டது’ என்றாலும், அரச நிர்வாகச் சூழலில் ஆணை அதிகாரப்பூர்வமாக வெளியிடப்பட்டதைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: சூசான் கோட்டையில்
  rationale: שׁוּשַׁן என்ற இடப்பெயரையும், அரண்மனை வளாகத்தைக் கொண்ட கோட்டை அல்லது கோட்டைப் பகுதியைக் குறிக்கும் הַבִּירָה என்பதையும் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
