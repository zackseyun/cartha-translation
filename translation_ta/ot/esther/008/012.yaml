language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בְּ/י֣וֹם אֶחָ֔ד בְּ/כָל מְדִינ֖וֹת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֥דֶשׁ אֲדָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: ta
  text: அகாஸ்வேரு ராஜாவின் எல்லா மாகாணங்களிலும் ஒரே நாளில், பன்னிரண்டாம் மாதமாகிய ஆதார் மாதத்தின் பதின்மூன்றாம் நாளில்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם אֶחָד
  choice: ஒரே நாளில்
  rationale: בְּ காலத்தைக் குறிக்கிறது; אֶחָד என்பதன் ‘ஒன்று’ என்ற பொருளையும், நடவடிக்கை ஒரே நாளில் நடைபெற வேண்டும் என்ற சூழல்சார் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּכָל מְדִינוֹת
  choice: எல்லா மாகாணங்களிலும்
  rationale: מְדִינוֹת என்பது பேரரசின் நிர்வாகப் பிரிவுகளைக் குறிக்கிறது; இடப்பொருளைத் தமிழ் வேற்றுமை உருபு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: அகாஸ்வேரு ராஜாவின்
  rationale: எபிரெயக் கட்டமைப்பு மாகாணங்கள் யாருடையவை என்பதைச் சுட்டுகிறது. பெயர் ஒலிபெயர்க்கப்பட்டு, ‘ராஜா’ என்பது பொதுவாகப் புரியும் மதிப்பான சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר
  choice: பதின்மூன்றாம் நாளில்
  rationale: மூலத்தில் எண்ணிக்கை இருந்தாலும், தேதிக் குறிப்பில் அது வரிசை எண்ணாகச் செயல்படுகிறது; தெளிவுக்காக ‘நாள்’ சேர்க்கப்படுகிறது.
- source_word: לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: பன்னிரண்டாம் மாதமாகிய
  rationale: சொல்லுக்குச் சொல் ‘பன்னிரண்டு மாதத்துக்கு’ என்ற அமைப்பை விட, தமிழ்த் தேதிமுறைக்கு ஏற்ப வரிசை எண்ணாக வழங்குவது இயல்பும் துல்லியமும் ஆகும்.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: ஆதார் மாதத்தின்
  rationale: הוּא இங்கு பன்னிரண்டாம் மாதத்தின் பெயரை விளக்கும் இணைப்பாக உள்ளது. தமிழில் ‘பன்னிரண்டாம் மாதமாகிய ஆதார் மாதம்’ என்ற அமைப்பு அந்த விளக்கத் தொடர்பைத் தெளிவாகத் தருகிறது.
