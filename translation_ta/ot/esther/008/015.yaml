  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
translation:
  language: ta
  text: மொர்தெகாய் நீலமும் வெண்மையுமான அரச உடையையும், பெரிய பொற்கிரீடத்தையும், நுண்ணிய லினன் துணியாலும் ஊதா நிறத் துணியாலும் ஆன மேலாடையையும் அணிந்துகொண்டு அரசனுடைய முன்னிலையிலிருந்து புறப்பட்டான்; சூசா நகரம் ஆரவாரித்து மகிழ்ந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  choice: அரசனுடைய முன்னிலையிலிருந்து புறப்பட்டான்
  rationale: எபிரெயச் சொற்றொடரின் ‘அரசனுக்கு முன்பிருந்து வெளியேறுதல்’ என்ற அரசவைச் சூழலையும் இயக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לְבוּשׁ מַלְכוּת
  choice: அரச உடை
  rationale: அரச நிலைக்குரிய ஆடையைக் குறிக்கும் தொடர்; நவீன தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: תְּכֵלֶת וָחוּר
  choice: நீலமும் வெண்மையுமான
  rationale: இரு வண்ணங்களையும் நேரடியாகக் காக்கிறது; תְּכֵלֶת நீலம் முதல் நீல-ஊதா வரையிலான சாயலைக் குறிக்கக்கூடும் என்றாலும், இங்கு சுருக்கமான ‘நீலம்’ பொருத்தமானது.
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  choice: பெரிய பொற்கிரீடம்
  rationale: அளவு அல்லது சிறப்பைக் குறிக்கும் גְּדוֹלָה என்பதையும், பொன்னால் ஆன தலைஅணியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תַכְרִיךְ בּוּץ וְאַרְגָּמָן
  choice: நுண்ணிய ஆளியும் ஊதா நிறத் துணியுமான மேலாடை
  rationale: תַכְרִיךְ என்பது சுற்றிப் போர்த்தும் வெளிப்புற ஆடை; בּוּץ உயர்தர ஆளி, אַרְגָּמָן அரச மரியாதையோடு தொடர்புடைய ஊதா நிறத் துணி. ‘மேலாடை’ போர்த்தும் ஆடையின் இயல்பைத் தெளிவாக்குகிறது.
- source_word: צָהֲלָה וְשָׂמֵחָה
  choice: ஆரவாரித்து மகிழ்ந்தது
  rationale: முதல் வினையின் ஒலியுடன் கூடிய களிப்பையும் இரண்டாவது வினையின் மகிழ்ச்சியையும் தனித்தனியாகக் காக்கிறது.
