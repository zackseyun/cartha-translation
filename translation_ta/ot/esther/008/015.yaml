  source_fidelity: 'பொருளடிப்படையில் வரைவு எபிரெய மூலத்திற்கு நெருக்கமாக உள்ளது: மொர்தெகாய் அரசன் முன்னிலையிலிருந்து வெளியேறுதல், அரச உடை, நீலமும் வெண்மையும், பெரிய பொற்கிரீடம், நுண்ணிய லினனும் ஊதாவும், சூசா நகரத்தின் ஆரவாரமும் மகிழ்ச்சியும் அனைத்தும் காக்கப்பட்டுள்ளன. ஆனால் בּוּץ וְאַרְגָּמָן என்பவை மேலாடையின் பொருள்/துணிவகைகளாக இணைவதைத் தமிழில் இன்னும் தெளிவாகக் காட்ட வேண்டும்.'
