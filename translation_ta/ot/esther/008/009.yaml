  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதானதாயினும் அரச ஆவணச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழின் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. எல்லா அடைமொழிகளும் நிர்வாகப் பதவிகளும் மூல வரிசைக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன.
