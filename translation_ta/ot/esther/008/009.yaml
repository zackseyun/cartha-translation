  yaml_path: translation/ot/esther/008/009.yaml
  text: Then the king’s scribes were summoned at that time[a], in the third month, that is, the month of Sivan, on its twenty-third day; and it was written exactly as Mordecai commanded, to the Jews and to the satraps, the governors, and the officials of the provinces from India to Cush, one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language[b], and also to the Jews in their own script and their own language.
translation:
  language: ta
  text: அப்போது, மூன்றாம் மாதமாகிய சீவான் மாதத்தின் இருபத்துமூன்றாம் நாளில், அரசனுடைய எழுத்தர்கள் அழைக்கப்பட்டார்கள். மொர்தெகாய் கட்டளையிட்ட அனைத்தின்படியும், யூதர்களுக்கும், இந்தியா முதல் கூஷ்[a] வரை பரவியிருந்த நூற்று இருபத்தேழு மாகாணங்களின் சத்ரபுகளுக்கும், ஆளுநர்களுக்கும், மாகாண அதிகாரிகளுக்கும் எழுதப்பட்டது. ஒவ்வொரு மாகாணத்துக்கும் அதனதன் எழுத்துமுறையிலும், ஒவ்வொரு மக்களினத்துக்கும் அவரவர் மொழியிலும், யூதர்களுக்கும் அவர்களுடைய எழுத்துமுறையிலும் அவர்களுடைய மொழியிலும் எழுதப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தியா முதல் எத்தியோப்பியா வரை.” எபிரெயில் “ஹோடு முதல் கூஷ் வரை” என்று உள்ளது. பண்டைய புவியியல் பெயரைத் துல்லியமாகப் பாதுகாக்க “கூஷ்” முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: அரசனுடைய எழுத்தர்கள் அழைக்கப்பட்டார்கள்
  rationale: நிபால் வினை வடிவத்தின் செயப்பாட்டு பொருளையும் அரண்மனைச் சூழலையும் தெளிவாகக் காட்டுகிறது; ‘எழுத்தர்கள்’ என்பது அரச ஆவணங்களை எழுதும் பணியாளர்களைக் குறிக்கும் இயல்பான சொல்.
- source_word: בָּעֵת הַהִיא
  choice: அப்போது
  rationale: காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரை நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי הוּא חֹדֶשׁ סִיוָן בִּשְׁלוֹשָׁה וְעֶשְׂרִים בּוֹ
  choice: மூன்றாம் மாதமாகிய சீவான் மாதத்தின் இருபத்துமூன்றாம் நாளில்
  rationale: மாதத்தின் அடையாளத்தையும் அதற்குள்ளான நாளையும் தெளிவாகப் பாதுகாக்கிறது; எபிரெயின் ‘அதில்’ என்ற பின்னோக்குச் சுட்டை தமிழில் இயல்பான உடைமை அமைப்பாக வழங்குகிறது.
- source_word: וַיִּכָּתֵב כְּכָל אֲשֶׁר צִוָּה מָרְדֳּכַי
  choice: மொர்தெகாய் கட்டளையிட்ட அனைத்தின்படியும் ... எழுதப்பட்டது
  rationale: செயப்பாட்டு வடிவத்தையும் כְּכָל என்பதிலுள்ள முழுமையான ஒத்திசைவு உணர்வையும் மிகைப்படுத்தாமல் நேரடியாகக் காக்கிறது.
- source_word: הָאֲחַשְׁדַּרְפְּנִים
  choice: ஆளுநர்கள்
  rationale: பாரசீகப் பேரரசின் உயர்நிலை மாகாண நிர்வாகிகளை சாதாரண தமிழ் வாசகர்கள் புரிந்துகொள்ளும் வகையில் தருகிறது; அடுத்த நிர்வாகப் பதவியிலிருந்து வேறுபடுத்த வரிசையும் சூழலும் உதவுகின்றன.
- source_word: הַפַּחוֹת
  choice: தேசாதிபதிகள்
  rationale: மாகாண நிர்வாகப் பட்டியலில் உள்ள இரண்டாவது தனிப்பட்ட பதவியை ‘ஆளுநர்கள்’ என்பதிலிருந்து வேறுபடுத்தி, வரலாற்று நிர்வாகத் தொனியைத் தக்கவைக்கிறது.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: மாகாணங்களின் ... அதிகாரிகள்
  rationale: שׂרים என்பதன் நிர்வாகச் சூழலுக்கேற்ற பொருளை வழங்குகிறது; அரசகுலத்தைச் சுட்டும் ‘இளவரசர்கள்’ என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: இந்தியா முதல் கூஷ் வரை
  rationale: הֹדּוּ என்பதற்கான ஏற்ற புவியியல் இணையாக ‘இந்தியா’ பயன்படுத்தப்படுகிறது; כּוּשׁ பின்னாளின் ‘எத்தியோப்பியா’வுடன் முழுமையாக ஒப்பிடப்படாமல் பண்டைய பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְעַם וָעָם כִּלְשֹׁנוֹ
  choice: ஒவ்வொரு மாகாணத்துக்கும் அதனதன் எழுத்துமுறையிலும், ஒவ்வொரு மக்களினத்துக்கும் அவரவர் மொழியிலும்
  rationale: எபிரெயிலுள்ள பகிர்ந்தளிக்கும் மறுபதிப்பை இயல்பான தமிழ் ‘ஒவ்வொரு/அதனதன்/அவரவர்’ அமைப்பால் வெளிப்படுத்துகிறது.
