  revised_text: அப்போது, மூன்றாம் மாதமாகிய சீவான் மாதத்தின் இருபத்துமூன்றாம் நாளில், அரசனுடைய எழுத்தர்கள் அழைக்கப்பட்டார்கள். மொர்தெகாய் கட்டளையிட்ட அனைத்தின்படியும், யூதர்களுக்கும், இந்தியா முதல் கூஷ்[a] வரை பரவியிருந்த நூற்று இருபத்தேழு மாகாணங்களின் சத்ரபுகளுக்கும், ஆளுநர்களுக்கும், மாகாண அதிகாரிகளுக்கும் எழுதப்பட்டது. ஒவ்வொரு மாகாணத்துக்கும் அதனதன் எழுத்துமுறையிலும், ஒவ்வொரு மக்களினத்துக்கும் அவரவர் மொழியிலும், யூதர்களுக்கும் அவர்களுடைய எழுத்துமுறையிலும் அவர்களுடைய மொழியிலும் எழுதப்பட்டது.
