  naturalness: வரைவின் நடை பொதுவாக நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. ஆனால் ‘மூல உரையில் வைக்கப்பட்டுள்ளது’ என்ற அடிக்குறிப்பு வாசகம் துல்லியமற்றது; மொழிபெயர்ப்பின் முதன்மை உரையைக் குறிக்க வேண்டும். திருத்தப்பட்ட வாக்கியப் பிரிப்பு நீண்ட நிர்வாகப் பட்டியலைத் தெளிவாக வாசிக்கச் செய்கிறது.
  terminology: ‘சத்ரபுகள்’ என்பது אֲחַשְׁדַּרְפְּנִים என்பதற்கான வரலாற்று நிர்வாகச் சொல்லைத் தக்கவைக்கிறது. הַפַּחוֹת என்பதற்கு ‘ஆளுநர்கள்’, שָׂרֵי הַמְּדִינוֹת என்பதற்கு ‘மாகாண அதிகாரிகள்’ என வழங்கப்படுவதால் மூன்று பதவிகளும் வேறுபடுகின்றன. ‘கூஷ்’ என்ற பண்டைய புவியியல் பெயர் சரியாகப் பாதுகாக்கப்பட்டுள்ளது.
