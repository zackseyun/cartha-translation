    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  choice: நீட்டினான்
  rationale: இந்த எபிரெய வினைச்சொல் ஒன்றை ஒருவரை நோக்கி நீட்டுவதைக் குறிக்கிறது. செங்கோல் இடம்பெறும் அரசவைச் சூழலில் ‘நீட்டினான்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: பொற்செங்கோலை
  rationale: இது தங்கத்தால் செய்யப்பட்ட அல்லது தங்கத் தோற்றமுடைய அரச செங்கோலைக் குறிக்கிறது. ‘பொற்செங்கோல்’ சுருக்கமான, இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: וַתָּקָם
  choice: எழுந்து
  rationale: வினைச்சொல் எழுவதைக் குறிக்கிறது. அடுத்துள்ள ‘நின்றாள்’ என்பதிலிருந்து செயலை வேறுபடுத்தி, நிகழ்வுகளின் தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: அரசனுக்கு முன்பாக நின்றாள்
  rationale: לִפְנֵי என்பது ‘முன்பாக’ அல்லது ‘சந்நிதியில்’ என்ற பொருளைக் கொண்டது. இத்தேர்வு எபிரெயச் சொற்றொடருக்கு நெருக்கமாக இருந்து அரசவைச் சூழலையும் காக்கிறது.
- source_word: וַ
  choice: அப்போது
  rationale: தொடக்க வாவ் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. ‘அப்போது’ என்பது தமிழில் அந்த நிகழ்வுத் தொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאֶסְתֵּר
  choice: எஸ்தரிடம்
  rationale: அரசன் செங்கோலை எஸ்தரை நோக்கி நீட்டியதைத் தமிழில் இயல்பாகக் காட்ட ‘எஸ்தரிடம்’ பயன்படுத்தப்பட்டுள்ளது; ‘எஸ்தரை நோக்கி’ என்பதும் சாத்தியம்.
