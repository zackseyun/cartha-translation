translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக் கண்ணியத்தைத் தக்கவைத்தும் பொதுவாசகர்களுக்கு எளிதில் புரியுமாறும் மொழிபெயர்க்கப்பட்டது. ‘ஆமானின் வீடு’ என்ற எபிரெயச் சொற்றொடரைச் சொற்படியாக விடாமல், உடனடியான இலக்கியச் சூழலின் அடிப்படையில் ‘ஆமானின் உடைமைகள்’ என்று இயல்பாக வழங்கப்பட்டுள்ளது.
