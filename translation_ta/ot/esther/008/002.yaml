base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
translation:
  language: ta
  text: அப்போது அரசன் தன் முத்திரை மோதிரத்தைக் கழற்றினான்; அதை அவன் ஆமானிடமிருந்து எடுத்திருந்தான். அதை மொர்தெகாய்க்குக் கொடுத்தான். எஸ்தர் மொர்தெகாயை ஆமானின் வீட்டுக்கு மேற்பார்வையாளராக நியமித்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆமானின் வீடு’ என்பது ஆமானின் வீட்டார், குடும்ப நிர்வாகம், அல்லது உடைமைகள்/எஸ்டேட்டைக் குறிக்கலாம்.
    reason: ‘பேத்’ (வீடு) என்பதன் சூழல் சார்ந்த பரந்த பொருளைத் தக்கவைத்து விளக்குகிறது.
lexical_decisions:
- source_word: וַיָּסַר
  choice: கழற்றி
  rationale: இங்கு அரசன் தன்னிடமிருந்த மோதிரத்தை அகற்றுவதைக் குறிக்கும் ஹிஃபில் வினைக்கு இயல்பான தமிழ்; மோதிரத்தை விரலிலிருந்து கழற்றும் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: טַבַּעְתּוֹ
  choice: தன் முத்திரை மோதிரத்தை
  rationale: எஸ்தர் நூலின் அரசவைக் சூழலில் இது ஆவணங்களுக்கு அதிகாரப்பூர்வ முத்திரையிடப் பயன்பட்ட அரச முத்திரை மோதிரம்; ‘முத்திரை மோதிரம்’ அதன் செயல்பாட்டைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר הֶעֱבִיר מֵהָמָן
  choice: ஆமானிடமிருந்து திரும்பப் பெற்றிருந்த
  rationale: העביר என்பது அகற்றுதல் அல்லது ஒருவரிடமிருந்து எடுத்துக்கொள்ளுதல் என்ற பொருளைக் கொண்டது. முன்பு ஆமானுக்குக் கொடுக்கப்பட்ட மோதிரம் அவனிடமிருந்து மீட்கப்பட்டதை ‘திரும்பப் பெற்றிருந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּתְּנָהּ לְמָרְדֳּכָי
  choice: அதை மொர்தெகாயிடம் கொடுத்தான்
  rationale: נתן என்பதன் நேரடியான பொருள் ‘கொடுத்தல்’; பெண்பால் பின்னொட்டு முத்திரை மோதிரத்தையே சுட்டுகிறது.
- source_word: וַתָּשֶׂם אֶסְתֵּר אֶת מָרְדֳּכַי עַל
  choice: எஸ்தர் மொர்தெகாயை ... பொறுப்பாளராக நியமித்தாள்
  rationale: שׂוּם עַל என்பது ஒருவரை ஒரு பொறுப்பின் மேல் வைத்தல் அல்லது நியமித்தல் எனும் நிர்வாகப் பொருளைக் கொண்டது; நவீன தமிழில் ‘பொறுப்பாளராக நியமித்தாள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בֵּית הָמָן
  choice: ஆமானின் உடைமைகளுக்கு
  rationale: בַּיִת என்பதற்கு வீடு, வீட்டார், சொத்து அல்லது உடைமைகள் என்ற பரப்பு உண்டு. எஸ்தர் 8:1-ல் ஆமானின் சொத்துகள் எஸ்தருக்குக் கொடுக்கப்பட்ட சூழலில், இங்கு நிர்வகிக்க ஒப்படைக்கப்பட்ட சொத்து முழுவதையும் ‘உடைமைகள்’ இயல்பாகக் குறிக்கிறது.
