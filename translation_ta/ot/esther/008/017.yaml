base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: ta
  text: ஒவ்வொரு மாகாணத்திலும், ஒவ்வொரு நகரத்திலும், அரசனுடைய வார்த்தையும் அவனுடைய ஆணையும் சென்றடைந்த இடமெல்லாம் யூதர்களுக்கு மகிழ்ச்சியும் களிப்பும், விருந்தும் மகிழ்வுநாளும் உண்டாயின. நாட்டின் பல மக்களுள் பலர் யூதர்களாக மாறிக்கொண்டிருந்தார்கள்[a]; ஏனெனில் யூதர்களைப் பற்றிய பயம் அவர்கள்மேல் விழுந்திருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூத அடையாளத்தை ஏற்றுக்கொண்டார்கள்.” அவர்கள் உண்மையாக மதம் மாறினார்களா, அல்லது பயத்தினால் வெளிப்புறமாக யூதர்களுடன் இணைந்தார்களா என்பது எபிரெயச் சொல்லில் தெளிவாக இல்லை.
    reason: அரிதான מִתְיַהֲדִים என்ற வினை, யூதராக ஆகுதல் அல்லது யூத அடையாளத்தை ஏற்றுக்கொள்ளுதல் ஆகிய இரு நுணுக்கங்களையும் கொண்டிருக்கலாம். காரணவாக்கியத்தில் கூறப்படும் பயம், அவர்களின் அடையாள ஏற்றலை வெறும் பாசாங்கு என்று முடிவுசெய்ய அனுமதிக்காது.
lexical_decisions:
- source_word: מְדִינָה וּמְדִינָה / עִיר וָעִיר
  choice: ஒவ்வொரு மாகாணத்திலும், ஒவ்வொரு நகரத்திலும்
  rationale: எபிரெய மொழியின் பகிர்வுப் பொருளுடைய இரட்டிப்பை இயல்பான நவீனத் தமிழில் ‘ஒவ்வொரு’ என வெளிப்படுத்துகிறது.
- source_word: דְּבַר הַמֶּלֶךְ
  choice: அரசனுடைய செய்தி
  rationale: דבר இங்கு அனுப்பப்பட்ட அரசுச் செய்தியைச் சுட்டுகிறது; தொடர்ந்து வரும் דת ‘ஆணை’ என்பதிலிருந்து வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: מִשְׁתֶּה וְיוֹם טוֹב
  choice: விருந்தும் கொண்டாட்ட நாளும்
  rationale: מִשְׁתֶּה என்பதன் விருந்து/விருந்துண்ணுதல் பொருளையும், יוֹם טוֹב என்பதன் விழாக்கால மகிழ்ச்சியையும் இயல்பாகக் காட்டுகிறது.
- source_word: מִתְיַהֲדִים
  choice: யூதர்களாக மாறிக்கொண்டிருந்தார்கள்
  rationale: התפעל வடிவத்தின் யூதராகத் தம்மை ஆக்கிக்கொள்ளுதல் அல்லது யூத அடையாளத்தை ஏற்றுக்கொள்ளுதல் என்ற அரிதான பொருளை நேரடியாக வழங்குகிறது; தொடர்ச்சியான செயற்பாட்டையும் காட்டுகிறது.
- source_word: פַּחַד הַיְּהוּדִים
  choice: யூதர்களைப் பற்றிய பயம்
  rationale: இணைப்புத் தொடரை யூதர்களால் உண்டான அல்லது அவர்களைப் பற்றிய பயம் என இயல்பாக மொழிபெயர்க்கிறது; ‘யூதர்களின் பயம்’ என்ற தமிழ்ச் சொற்றொடரின் தேவையற்ற இருபொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: מִתְיַהֲדִים என்பது உண்மையான மதமாற்றத்தையா அல்லது பயத்தினால் ஏற்ற வெளிப்புற யூத அடையாளத்தையா குறிக்கிறது?
  choice: யூதர்களாக மாறிக்கொண்டிருந்தார்கள்[a]
  alternative: தங்களை யூதர்களாகக் காட்டிக்கொண்டார்கள்
  rationale: எபிரெய வினை யூதர்களாக ஆகுதல்/யூத அடையாளத்தை ஏற்றல் என்பதைக் குறிக்கிறது; அடுத்த காரணவாக்கியம் பயத்தைக் கூறினாலும், அது வெறும் பாசாங்கு என்று உரை தெளிவாகத் தீர்மானிக்கவில்லை. எனவே அந்தத் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெயப் பகிர்வு இரட்டிப்புகள் தமிழின் ‘ஒவ்வொரு’ அமைப்பால் வழங்கப்பட்டுள்ளன; வாக்கியத்தின் கொண்டாட்டத் தன்மையும் இறுதியில் வரும் அச்சத்தின் இறையியல் பதற்றமும் தக்கவைக்கப்பட்டுள்ளன.
