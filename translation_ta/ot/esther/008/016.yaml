  yaml_path: translation/ot/esther/008/016.yaml
  text: For the Jews there was light and gladness and joy and honor[a].
translation:
  language: ta
  text: 'யூதர்களுக்கு ஒளியும் மகிழ்ச்சியும் பேருவகையும் மரியாதையும் உண்டாயின.[a]


    [a] அல்லது, “யூதர்களுக்கு ஒளியும் மகிழ்ச்சியும் பேருவகையும் மரியாதையும் இருந்தன.” எபிரெய வாக்கிய அமைப்பை “உண்டாயின” என்றோ, உடைமையைக் காட்டும் வகையில் “இருந்தன” என்றோ மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதர்களுக்கு ஒளியும் மகிழ்ச்சியும் பேருவகையும் மரியாதையும் இருந்தன.” எபிரெய வாக்கிய அமைப்பை “உண்டாயின” என்றோ, உடைமையைக் காட்டும் வகையில் “இருந்தன” என்றோ மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְּהוּדִים
  choice: யூதர்களுக்கு
  rationale: முன்னொட்டு ל இங்கு தொடர்பையோ உடைமையையோ குறிக்கலாம். “யூதர்களுக்கு” என்பது எபிரெய அமைப்பை இயல்பான தமிழில் காத்து, உடைமைப் பொருளை மட்டும் கட்டாயப்படுத்தாமல் விடுகிறது.
- source_word: הָיְתָה
  choice: உண்டாயின
  rationale: முன்னால் வந்த தத்திவப் போன்ற சொற்றொடருடன் היה இருப்பையோ ஏற்பட்ட நிலையையோ குறிக்கிறது. பட்டியலிலுள்ள பல பெயர்ச்சொற்களுடன் இயல்பான தமிழ் இசைவுக்காகப் பன்மை வினை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אוֹרָה
  choice: ஒளி
  rationale: இது விடுதலையையும் நல்வாழ்வையும் உருவகமாகச் சுட்டினாலும், “ஒளி” என்ற நேரடி சொல் மூல மொழியின் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: שִׂמְחָה
  choice: மகிழ்ச்சி
  rationale: பொதுவான சந்தோஷ நிலையைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; அடுத்துள்ள שָׂשׂוֹן என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: שָׂשׂוֹן
  choice: பேருவகை
  rationale: இந்தச் சொல் மிகுந்த, கொண்டாட்டமிக்க மகிழ்ச்சியைக் குறிக்கிறது. “பேருவகை” என்பது שִׂמְחָה என்பதற்கான “மகிழ்ச்சி”யுடன் உள்ள நெருங்கிய வேறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: יְקָר
  choice: மரியாதை
  rationale: சூழலில் சமூக மதிப்பையும் கண்ணியத்தையும் குறிக்கிறது. “மரியாதை” என்பது காட்சிசார் பொலிவை மிகைப்படுத்தாமல் அந்தப் பொருளை இயல்பாகத் தருகிறது.
