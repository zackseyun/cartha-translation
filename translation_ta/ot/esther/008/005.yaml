translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், அரசவைக்குரிய பணிவும் கண்ணியமும் நிலைக்கும்படி மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான நான்கு நிபந்தனை வாக்கியங்களும் செயப்பாட்டு வேண்டுகோள் வடிவமும் காக்கப்பட்டுள்ளன. ஆமானின் பெயர் ‘ஆமான்’, தந்தையின் பெயர் ‘அம்மெதாத்தா’, இன/வம்ச அடைமொழி ‘ஆகாகியன்’ எனத் தமிழ் வேதாகமப் பெயர்மரபுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
