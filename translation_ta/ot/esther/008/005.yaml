base_translation:
  language: en
  yaml_path: translation/ot/esther/008/005.yaml
  text: And she said[a], “If it seems good to the king, and if I have found favor before him, and if the matter is proper before the king, and if I am pleasing in his eyes, let it be written to revoke the letters devised by Haman son of Hammedatha the Agagite[b], which he wrote to destroy the Jews who are in all the provinces of the king.”
translation:
  language: ta
  text: அவள், “அரசருக்கு நல்லதாகத் தோன்றினால், அவர்முன் எனக்குத் தயவு கிடைத்திருந்தால், இந்தக் காரியம் அரசருக்கு ஏற்றதாக இருந்தால், அவருடைய பார்வையில் நான் பிரியமானவளாக இருந்தால், அரசருடைய எல்லா மாகாணங்களிலும் உள்ள யூதர்களை அழிப்பதற்காக ஆகாகியனான அம்மெதாத்தாவின் மகன் ஆமான் எழுதிய திட்டக் கடிதங்களைத் திரும்பப்பெறும்படி[a] எழுதப்படட்டும்” என்றாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடிதங்களை ரத்துசெய்யும்படி” அல்லது “திருப்பும்படி.” இங்குள்ள எபிரெய வினைச்சொல் ‘திருப்புதல்’ அல்லது நிர்வாகச் சூழலில் ‘ரத்துசெய்தல்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: அரசருக்கு நல்லதாகத் தோன்றினால்
  rationale: அரசவைக்குரிய பணிவான வேண்டுகோள் முறையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; ‘நல்லது’ என்ற எபிரெயச் சொல்லின் வடிவத்தையும் ஓரளவு காக்கிறது.
- source_word: מָצָאתִי חֵן לְפָנָיו
  choice: அவருக்கு முன்பாக எனக்குத் தயவு கிடைத்திருந்தால்
  rationale: חֵן என்பதன் அரசரிடமிருந்து கிடைக்கும் சாதகமான மனப்பான்மை என்ற பொருளை ‘தயவு’ தெரிவிக்கிறது; לְפָנָיו என்பதும் வெளிப்படையாகக் காக்கப்படுகிறது.
- source_word: וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ
  choice: இந்தக் காரியம் அரசருக்கு ஏற்றதாக இருந்தால்
  rationale: כָשֵׁר என்பதன் பொருத்தமானது, தகுந்தது என்ற பொருளை ‘ஏற்றது’ இயல்பாகத் தருகிறது; דָּבָר பொதுவான ‘காரியம்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: וְטוֹבָה אֲנִי בְּעֵינָיו
  choice: அவருடைய பார்வையில் நான் பிரியமானவளாக இருந்தால்
  rationale: சொல்லாட்சியிலுள்ள ‘அவருடைய கண்களில்’ என்ற உருவகத்தை இயல்பான ‘பார்வையில்’ என்பதால் காத்து, தனிப்பட்ட அங்கீகாரம் அல்லது விருப்பத்தை ‘பிரியமானவள்’ தெளிவுபடுத்துகிறது.
- source_word: יִכָּתֵב
  choice: எழுதப்படட்டும்
  rationale: எபிரெய மொழியின் செயப்பாட்டு வேண்டுகோள் வடிவத்தையும் முறையான அரசவை நடையையும் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘ஆணை’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: לְהָשִׁיב
  choice: திரும்பப்பெறும்படி
  rationale: முன்னர் அனுப்பப்பட்ட அதிகாரப்பூர்வக் கடிதங்களை செல்லாததாக்கி மீளப்பெறுதல் என்ற நிர்வாகச் சூழலைத் தமிழில் இயல்பாகக் காட்டுகிறது; ‘திருப்ப’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: הַסְּפָרִים
  choice: கடிதங்கள்
  rationale: எஸ்தர் நூலில் பேரரசு முழுவதும் அனுப்பப்படும் அரச ஆவணங்களைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: מַחֲשֶׁבֶת הָמָן
  choice: ஆமான் தீட்டிய திட்டத்தின்படி எழுதப்பட்ட
  rationale: சொற்றொடரின் நேரடிப் பொருள் ‘ஆமானின் திட்டம்/சதி’. கடிதங்களுக்கும் திட்டத்திற்கும் உள்ள தொடர்பைத் தமிழில் தெளிவாக்குகிறது; அந்தத் திட்டமே கடிதங்களில் செயலாக்கப்பட்டது என்ற சூழலை வெளிப்படுத்துகிறது.
- source_word: לְאַבֵּד
  choice: அழிப்பதற்காக
  rationale: உயிரிழக்கச் செய்தல் அல்லது முழுமையாக ஒழித்தல் என்ற வினையின் வலிமையை மிகைப்படுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: הַיְּהוּדִים אֲשֶׁר בְּכָל מְדִינוֹת הַמֶּלֶךְ
  choice: அரசருடைய எல்லா மாகாணங்களிலும் உள்ள யூதர்களை
  rationale: உறவுப்பெயர் வாக்கியத்தையும் பேரரசின் அனைத்து மாகாணங்களையும் உள்ளடக்கும் பரப்பையும் தெளிவாகக் காக்கிறது.
