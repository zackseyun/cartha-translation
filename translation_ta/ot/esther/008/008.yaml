  text: וְ֠/אַתֶּם כִּתְב֨וּ עַל הַ/יְּהוּדִ֜ים כַּ/טּ֤וֹב בְּ/עֵֽינֵי/כֶם֙ בְּ/שֵׁ֣ם הַ/מֶּ֔לֶךְ וְ/חִתְמ֖וּ בְּ/טַבַּ֣עַת הַ/מֶּ֑לֶךְ כִּֽי כְתָ֞ב אֲשֶׁר נִכְתָּ֣ב בְּ/שֵׁם הַ/מֶּ֗לֶךְ וְ/נַחְתּ֛וֹם בְּ/טַבַּ֥עַת הַ/מֶּ֖לֶךְ אֵ֥ין לְ/הָשִֽׁיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
translation:
  language: ta
  text: ஆனால் நீங்கள் யூதர்களைக் குறித்து, உங்கள் பார்வைக்கு நல்லதாகத் தோன்றுகிறபடி[a] அரசரின் பெயரில் எழுதி, அரசரின் முத்திரை மோதிரத்தால் அதற்கு முத்திரையிடுங்கள். ஏனெனில், அரசரின் பெயரில் எழுதப்பட்டு அரசரின் முத்திரை மோதிரத்தால் முத்திரையிடப்பட்ட ஆவணத்தைத் திரும்பப் பெற முடியாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களுக்குச் சரி என்று தோன்றுகிறபடி.” எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல், “உங்கள் கண்களில் நல்லதாக இருப்பதுபோல்” என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ரத்து செய்ய முடியாது.” இங்கு எபிரெயச் சொற்றொடர், அத்தகைய அரச ஆவணத்தை மீளப்பெறவோ செல்லாததாக்கவோ முடியாது என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: ஆனால் நீங்கள்
  rationale: முந்தைய அரசாணையை மாற்ற முடியாது என்பதற்கும் இப்போது வழங்கப்படும் அதிகாரத்திற்கும் இடையிலான எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; பன்மை ‘நீங்கள்’ என்பதையும் காக்கிறது.
- source_word: כִּתְבוּ
  choice: எழுதி ... முத்திரையிடுங்கள்
  rationale: எபிரெய கட்டளை வடிவைத் தக்கவைக்கிறது. சூழலில் இது அரசரால் வழங்கப்படும் அனுமதியையும் கட்டளையையும் ஒருங்கே உணர்த்துகிறது.
- source_word: עַל הַיְּהוּדִים
  choice: யூதர்களைக் குறித்து
  rationale: עַל என்பதன் பொதுவான ‘குறித்து/சம்பந்தமாக’ என்ற பொருளைக் காக்கிறது; ‘யூதர்களுக்காக’ என்று நோக்கத்தை அளவுக்கு மீறித் தெளிவுபடுத்தவில்லை.
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  choice: உங்கள் பார்வைக்கு நல்லதாகத் தோன்றுவதை
  rationale: ‘உங்கள் கண்களில் நல்லது’ என்ற எபிரெய உருவகத்தை வாசிக்கத்தக்க நவீன தமிழில் ஓரளவு பாதுகாக்கிறது; அதன் நடைமுறைப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּשֵׁם הַמֶּלֶךְ
  choice: அரசரின் பெயரில்
  rationale: அரச அதிகாரத்தின் கீழ் செயல்படுதலைக் குறிக்கும் மூலத்தின் ‘பெயரில்’ என்ற வடிவை நேரடியாகக் காக்கிறது.
- source_word: בְּטַבַּעַת הַמֶּלֶךְ
  choice: அரசரின் முத்திரை மோதிரத்தால்
  rationale: அதிகாரப்பூர்வ ஆவணங்களை முத்திரையிடப் பயன்படுத்தப்பட்ட signet ring என்ற நிர்வாகச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כְתָב
  choice: ஆவணம்
  rationale: ‘எழுத்து/எழுதப்பட்ட ஆவணம்’ என்ற பொதுவான பொருளைக் காக்கிறது; ‘அரசாணை’ என்று மூலச்சொல்லைவிடக் குறிப்பாக்கவில்லை.
- source_word: אֵין לְהָשִׁיב
  choice: திரும்பப் பெற முடியாது
  rationale: ‘திரும்பச் செய்ய இயலாது’ என்ற எபிரெயச் சொற்றொடரை, அதிகாரப்பூர்வ ஆவணத்தை ரத்துசெய்தல் அல்லது மீளப்பெறுதல் என்ற நிர்வாகப் பொருளில் இயல்பான தமிழில் தருகிறது; மற்றொரு சாத்தியம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
