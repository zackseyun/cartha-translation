translation_notes:
  register: நவீனத் தரமான, மரியாதையும் தெளிவும் கொண்ட தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அரசன்’ என்பதற்குப் பதில் பொதுவான கண்ணிய நடைக்கேற்ற ‘அரசர்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சட்ட-நிர்வாகத் தொனி காக்கப்பட்டு, தேவையற்ற சமயவியல் விளக்கம் சேர்க்கப்படவில்லை.
