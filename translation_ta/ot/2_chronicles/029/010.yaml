source:
  edition: WLC
  text: עַתָּה֙ עִם לְבָבִ֔/י לִ/כְר֣וֹת בְּרִ֔ית לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/יָשֹׁ֥ב מִמֶּ֖/נּוּ חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/010.yaml
  text: Now it is in my heart to make a covenant with Yahweh[a], the God of Israel, so that his burning anger may turn away from us.
translation:
  language: ta
  text: இப்போது இஸ்ரவேலின் கடவுளாகிய யாவேயோடு ஓர் உடன்படிக்கை செய்ய என் உள்ளத்தில் எண்ணம் உள்ளது[a]; அவருடைய எரியும் கோபம் நம்மைவிட்டு விலகும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில், சொல்லுக்குச் சொல்: “ஓர் உடன்படிக்கையை வெட்டுதல்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: எசேக்கியாவின் தீர்மானத்தின் உடனடித் தன்மையை இயல்பாகக் குறிக்கிறது.
- source_word: עִם לְבָבִי
  choice: என் உள்ளத்தில் இருக்கிறது
  rationale: உள்ளார்ந்த எண்ணத்தையும் உறுதியையும் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத்தைத் தமிழில் தெளிவாகப் பேணுகிறது.
- source_word: לִכְרֹת בְּרִית
  choice: ஓர் உடன்படிக்கை செய்ய வேண்டும்
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் ‘உடன்படிக்கையை வெட்டுதல்’; தமிழில் இயல்பான ‘உடன்படிக்கை செய்தல்’ பயன்படுத்தப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேயோடு
  rationale: லாமேத் இங்கு உடன்படிக்கையின் மறுதரப்பைக் குறிக்கிறது; எனவே தமிழில் ‘-ஓடு’ இயல்பானது. יהוה என்பது தனிப்பட்ட இறைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இறைப் பெயரை அடையாளப்படுத்தும் இணைப்புப் பட்டத்தைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וְיָשֹׁב
  choice: அப்போது ... விலகக்கூடும்
  rationale: வாவ் இணைப்பின் தொடர்ச்சி/விளைவு நுணுக்கத்தையும், யிக்தோல் வடிவின் உறுதிப்படுத்தப்படாத எதிர்பார்ப்பையும் பேணுகிறது; நோக்கத்தை மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: מִמֶּנּוּ
  choice: நம்மைவிட்டு
  rationale: முதல் நபர் பன்மை பின்னொட்டை நேரடியாக வழங்குகிறது.
- source_word: חֲרוֹן אַפּוֹ
  choice: அவருடைய எரியும் கோபம்
  rationale: கோபத்தின் வெம்மையையும் தீவிரத்தையும் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழில் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, உடன்படிக்கைச் சூழலில் வரும் தனிப்பட்ட இறைப் பெயர் உள்ளது; அதனைப் பெயராகவே ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பேணுகிறது.
- issue: וְיָשֹׁב என்பதன் தொடர்பு
  choice: அப்போது ... விலகக்கூடும்
  alternative: அதனால் ... விலகும்படி
  rationale: இது எதிர்பார்க்கப்படும் விளைவையோ நோக்கத்தையோ குறிக்கலாம். தமிழ் உரை விளைவு/எதிர்பார்ப்பு வாசிப்பைத் தருகிறது; ஆனால் அது நிச்சயமாக நிகழும் என்றோ, உடன்படிக்கையின் ஒரே நோக்கம் அதுவே என்றோ தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகமச் செறிவும் கொண்ட நடை. ‘என் உள்ளத்தில்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; கடினமான எபிரெய மரபுத்தொடர் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
