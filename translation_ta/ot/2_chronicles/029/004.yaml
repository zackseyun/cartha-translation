source:
  edition: WLC
  text: וַ/יָּבֵ֥א אֶת הַ/כֹּהֲנִ֖ים וְ/אֶת הַ/לְוִיִּ֑ם וַ/יַּֽאַסְפֵ֖/ם לִ/רְח֥וֹב הַ/מִּזְרָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/004.yaml
  text: Then he brought in the priests and the Levites and assembled them in the eastern square[a].
translation:
  language: ta
  text: பின்பு அவர் ஆசாரியர்களையும் லேவியர்களையும் அழைத்து வந்து, கிழக்கிலுள்ள திறந்த வெளியில்[a] அவர்களைக் கூட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கிழக்குச் சதுக்கத்தில்.”
    reason: ரְחוֹב என்பது அகன்ற பொதுவெளி அல்லது சதுக்கத்தைக் குறிக்கலாம்; הַמִּזְרָח அந்த இடத்தை கிழக்குடன் தொடர்புபடுத்துகிறது.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: பின்பு அவர் … அழைத்து வந்து
  rationale: בוא என்பதன் ஹிஃபில் தொடர் வினை வடிவம் ‘வரச் செய்தார்/அழைத்து வந்தார்’ என்ற பொருளைத் தருகிறது. ‘பின்பு’ என்பது எபிரெயக் கதைநடையின் தொடர்ச்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்களை
  rationale: ஆலயப் பணிக்குரிய כהנים என்பதற்கான தெளிவான, வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: הַלְוִיִּם
  choice: லேவியர்களை
  rationale: ஆசாரியர்களிலிருந்து தனியாகக் குறிப்பிடப்படும் லேவி கோத்திர ஆலயப் பணியாளர்களைக் குறிக்கும் நிலையான பெயர்.
- source_word: וַיַּאַסְפֵם
  choice: அவர்களைக் கூட்டினார்
  rationale: אסף என்பது இங்கு ஒரு குறிப்பிட்ட இடத்தில் மக்களை ஒன்றுகூட்டுவதைக் குறிக்கிறது; பொதுவான நவீன தமிழில் ‘கூட்டினார்’ இயல்பாக உள்ளது.
- source_word: לִרְחוֹב
  choice: திறந்த வெளியில்
  rationale: רְחוֹב என்பது நவீன அர்த்தத்தில் ஒரு தெருவை மட்டுமல்லாமல், அகன்ற பொதுவெளி அல்லது சதுக்கத்தைக் குறிக்கலாம். சூழலை முன்கூட்டியே மிகத் துல்லியமாக நிர்ணயிக்காமல் ‘திறந்த வெளி’ அந்த இடவகையைத் தெரிவிக்கிறது.
- source_word: הַמִּזְרָח
  choice: கிழக்குப் பக்கத்திலிருந்த
  rationale: מִזְרָח இங்கு அந்தத் திறந்த வெளியின் கிழக்குத் திசை சார்ந்த இருப்பிடத்தைக் குறிக்கிறது; இயல்பான தமிழில் திசைத் தொடர்பை தெளிவுபடுத்துகிறது.
