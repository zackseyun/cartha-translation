base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/009.yaml
  text: And behold[a], our fathers have fallen by the sword[b], and our sons and our daughters and our wives are in captivity because of this.
translation:
  language: ta
  text: இதோ[a], நம் தந்தையர் வாளால் வீழ்ந்தார்கள்; நம் மகன்களும் மகள்களும் மனைவிகளும் இதன் காரணமாகச் சிறையில் இருக்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதோ” என்பது அடுத்து வரும் கூற்றின்மீது வலியுறுத்திக் கவனத்தை ஈர்க்கும் எபிரேயச் சொல்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேய மூலத்தில் சொல்லுக்குச் சொல், “சிறையிருப்பில்” என்று உள்ளது; அதாவது, அவர்கள் சிறைபிடித்துச் செல்லப்பட்டுள்ளனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை வலியுறுத்தி அடுத்து வரும் கூற்றைச் சுட்டும் எபிரேய உரையாடல் குறியை, இயல்பானதும் கண்ணியமானதுமான நவீன தமிழில் வெளிப்படுத்துகிறது; தொடக்க וְ தமிழில் தனியே மொழிபெயர்க்கப்படாவிட்டாலும் தொடர்ச்சிப் பொருள் சூழலில் நிலைக்கிறது.
- source_word: נָפְלוּ
  choice: வீழ்ந்தார்கள்
  rationale: נפל என்பதன் அடிப்படைப் பொருளான ‘விழுதல்/வீழ்தல்’ என்பதையும், இச்சூழலில் போரில் கொல்லப்பட்டதைக் குறிக்கும் கண்ணியமான சொல்வழக்கையும் பாதுகாக்கிறது.
- source_word: אֲבוֹתֵינוּ
  choice: நம் தந்தையர்
  rationale: ‘முன்னோர்’ என்று பொதுமைப்படுத்தாமல், மூலத்தில் உள்ள ஆண்பால் உறவுமுறைச் சொல்லைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: בֶּחָרֶב
  choice: வாளால்
  rationale: வன்முறை அல்லது போர்மரணத்தைக் குறிக்கும் எபிரேய சொற்றொடருக்கு நேரான, இயல்பான தமிழ் இணை.
- source_word: וּבָנֵינוּ
  choice: நம் மகன்களும்
  rationale: அடுத்ததாக வரும் ‘மகள்கள்’ என்பதிலிருந்து வேறுபடுத்தப்பட்டுள்ள ஆண் பிள்ளைகள் என்ற மூலப்பொருளைப் பாதுகாக்கிறது.
- source_word: וּבְנוֹתֵינוּ
  choice: மகள்களும்
  rationale: எபிரேயச் சொல்லின் நேரடி பொருளையும் மகன்களிலிருந்து உள்ள வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: וְנָשֵׁינוּ
  choice: மனைவிகளும்
  rationale: உடைமை விகுதியுடனான குடும்பப் பட்டியலில் נָשִׁים என்பதற்கு ‘மனைவிகள்’ என்பதே சூழலுக்குப் பொருத்தமான துல்லியமான மொழிபெயர்ப்பு.
- source_word: בַּשְּׁבִי
  choice: சிறையிருப்பில் இருக்கிறார்கள்
  rationale: மூலத்தில் உள்ள பெயர்ச்சொல் கட்டமைப்பான ‘சிறையிருப்பில்’ என்ற நிலைப்பொருளைப் பாதுகாக்கிறது; தமிழில் இயல்பாகவும் விளங்குகிறது.
- source_word: עַל זֹאת
  choice: இதன் காரணமாக
  rationale: யூதாவின் முந்தைய துரோகத்தையும் அதன் விளைவான தண்டனையையும் பின்னோக்கிச் சுட்டும் காரணப்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்புச் சூழலில் பாலினம் குறிக்கப்பட்ட குடும்ப உறவுச் சொற்கள்
  choice: நம் தந்தையர் ... நம் மகன்களும் மகள்களும் மனைவிகளும்
  alternative: நம் முன்னோர் ... நம் பிள்ளைகளும் பெண்களும்
  rationale: மூல எபிரேயம் குறிப்பிட்ட குடும்பக் குழுக்களைத் தனித்தனியாகப் பட்டியலிடுகிறது. அவற்றைப் பாலினப் பொதுமைச் சொற்களாக மாற்றாமல், மூலத்தின் வேறுபாடுகள் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ என்பதால் வலியுறுத்தல் காக்கப்படுகிறது; ‘வீழ்ந்தார்கள்’ போர்மரணத்தின் செறிவையும் மூல உருவகத்தையும் பாதுகாக்கிறது. காரணத்தைக் குறிக்கும் சொற்றொடர் தமிழின் இயல்புக்காக வசனத்தின் தொடக்கப்பகுதிக்கு நகர்த்தப்பட்டுள்ளது.
