source:
  edition: WLC
  text: וַ/יְהִ֞י מִסְפַּ֣ר הָ/עֹלָה֮ אֲשֶׁ֣ר הֵבִ֣יאוּ הַ/קָּהָל֒ בָּקָ֣ר שִׁבְעִ֔ים אֵילִ֥ים מֵאָ֖ה כְּבָשִׂ֣ים מָאתָ֑יִם לְ/עֹלָ֥ה לַ/יהוָ֖ה כָּל אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/032.yaml
  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: ta
  text: 'சபையார் கொண்டுவந்த தகனபலிகளின் எண்ணிக்கை: எழுபது மாடுகள், நூறு செம்மறியாட்டுக் கடாக்கள், இருநூறு செம்மறியாட்டுக் குட்டிகள்; இவை அனைத்தும் ஆண்டவருக்கான தகனபலிகள்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה / לְעֹלָה
  choice: தகனபலிகள்
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் பலியைக் குறிக்கும் வழக்கமான, பொருள்தெளிவுள்ள தமிழ் வேதாகமச் சொல்.
- source_word: הַקָּהָל
  choice: சபையார்
  rationale: வழிபாட்டுக்காகக் கூடியிருந்த சமூகத்தைக் குறிக்கும் இயல்பான மரியாதைநிறைந்த பன்மை வடிவம்.
- source_word: בָּקָר
  choice: மாடுகள்
  rationale: எபிரெயச் சொல் பாலினத்தைக் குறிப்பாக வரையறுக்காமல் கால்நடைகளைச் சுட்டுவதால், 'காளைகள்' என்று குறுக்காமல் பொதுவான சொல்லைத் தேர்ந்தெடுத்தது.
- source_word: אֵילִים
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: பலியிடப்பட்ட வயதுவந்த ஆண் செம்மறியாடுகளைத் துல்லியமாகக் குறிக்கிறது.
- source_word: כְּבָשִׂים
  choice: செம்மறியாட்டுக் குட்டிகள்
  rationale: இளம் செம்மறியாடுகளைக் குறிக்கும் மூலச்சொல்லின் இயல்பான தமிழ் இணை.
- source_word: יהוה
  choice: ஆண்டவர்
  rationale: தமிழில் தேவனுடைய உடன்படிக்கைப் பெயருக்கான மரியாதைநிறைந்த பாரம்பரியப் பிரதிநிதித்துவம்.
theological_decisions:
- issue: יהוה என்ற தேவப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யெகோவா / யாவே
  rationale: மூலத்தில் தனிப்பட்ட தேவப்பெயர் இருப்பதை ஏற்றுக்கொண்டபோதும், பொதுவாசிப்புக்கு இயல்பான தமிழ் மரபையும் ஆங்கில ஆலோசனை உரையின் LORD பயன்பாட்டையும் பின்பற்றுகிறது; குறிப்பிட்ட உச்சரிப்பைத் தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைநிறைந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். எபிரெய வாக்கியத்தின் எண்ணிக்கைப் பட்டியல் அமைப்பைத் தெளிவாகப் பேணும் வகையில் இரு வாக்கியங்களாக இயல்பாக்கப்பட்டுள்ளது.
