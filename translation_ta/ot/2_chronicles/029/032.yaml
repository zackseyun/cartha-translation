- from: 'சபையார் கொண்டுவந்த தகனபலிகளின் எண்ணிக்கை: எழுபது மாடுகள், நூறு செம்மறியாட்டுக் கடாக்கள், இருநூறு செம்மறியாட்டுக் குட்டிகள். இவை அனைத்தும் ஆண்டவருக்குச் செலுத்தப்பட்ட தகனபலிகள்.'
