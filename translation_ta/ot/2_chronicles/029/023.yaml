source:
  edition: WLC
  text: וַ/יַּגִּ֨ישׁוּ֙ אֶת שְׂעִירֵ֣י הַֽ/חַטָּ֔את לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ וְ/הַ/קָּהָ֑ל וַ/יִּסְמְכ֥וּ יְדֵי/הֶ֖ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
translation:
  language: ta
  text: பின்னர் பாவநிவாரணப் பலிக்கான வெள்ளாட்டுக் கடாக்களை அரசன் மற்றும் கூடியிருந்த மக்கள் முன்பாகக் கொண்டுவந்தார்கள்[a]. அவர்கள் தங்கள் கைகளை அவற்றின்மேல் வைத்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாவநிவாரணப் பலிக்கான வெள்ளாட்டுக் கடாக்களை அரசன் மற்றும் கூடியிருந்த மக்கள் முன்பாக நிறுத்தினார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “அவர்கள் தங்கள் கைகளை அவற்றின்மேல் வைத்தார்கள்” என்றே எபிரெய உரை கூறுகிறது. ‘அவர்கள்’ என்பது மிக இயல்பாக அரசனையும் கூடியிருந்த மக்களையும் குறிக்கிறது; அவர்கள் பிரதிநிதிகள் மூலமாக இதைச் செய்திருக்கவும் வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  choice: கொண்டுவந்தார்கள்
  rationale: נגשׁ என்பதன் ஹிஃபில் வடிவம் அருகில் கொண்டுவருதல் அல்லது முன்வைத்தல் என்பதைக் குறிக்கிறது. பலிச் சடங்கின் சூழலில் நிகழ்ந்த நேரடியான நகர்வை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: שְׂעִירֵי הַחַטָּאת
  choice: பாவநிவாரணப் பலிக்கான வெள்ளாட்டுக் கடாக்கள்
  rationale: שְׂעִירֵי ஆண் வெள்ளாடுகளைக் குறிக்கிறது; இங்கு חַטָּאת வெறும் ‘பாவம்’ அல்ல, பாவத்துக்காகச் செலுத்தப்படும் பலியைக் குறிக்கிறது. ‘வெள்ளாட்டுக் கடாக்கள்’ அவை ஆண் விலங்குகள் என்பதைத் தெளிவாகக் காக்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: அரசனும் கூடியிருந்த மக்களும் காணும் வகையில் அவர்களுக்கு எதிரில் விலங்குகள் கொண்டுவரப்பட்டதைக் குறிக்கும் சுருக்கமான, இயல்பான சொல்.
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  choice: அரசனும் கூடியிருந்த மக்களும்
  rationale: קָהָל என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘கூடியிருந்த மக்கள்’ என்பது குறிப்பிட்ட சமய அமைப்பைக் குறிக்கும் சொல்லைத் திணிக்காமல் பொதுக் கூடுகையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  choice: அவர்கள் தங்கள் கைகளை ... வைத்தார்கள்
  rationale: பலிச் சடங்குகளில் סמך உடன் ‘கைகள்’ வரும்போது, விலங்கின்மேல் கைகளை வைக்கும் சடங்குச் செயலைக் குறிக்கிறது. தமிழ் வாக்கியம் எபிரெய உரையின் பன்மை எழுவாயைத் தெளிவாக்காமல் அப்படியே காக்கிறது.
- source_word: עֲלֵיהֶם
  choice: அவற்றின்மேல்
  rationale: பன்மையில் உள்ள வெள்ளாட்டுக் கடாக்களையே இது சுட்டுகிறது; உயிரினங்களைத் திரும்பச் சுட்டும் இடத்தில் ‘அவற்றின்மேல்’ இயல்பான தமிழ் வடிவமாகும்.
theological_decisions:
- issue: பலிச் சூழலில் חַטָּאת என்பதன் பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவம்
  rationale: வெள்ளாட்டுக் கடாக்கள் கொண்டுவரப்பட்டு அவற்றின்மேல் கைகள் வைக்கப்படும் உடனடிச் சூழல், חַטָּאת என்பது கருத்தளவிலான பாவத்தை அல்ல, பாவத்திற்காகச் செலுத்தப்படும் பலியை இங்கு குறிப்பதைக் காட்டுகிறது.
- issue: ‘அவர்கள் தங்கள் கைகளை வைத்தார்கள்’ என்பதன் எழுவாய்
  choice: எபிரெய உரையைப் போல ‘அவர்கள்’ என்று வைத்து, அரசனையும் கூடியிருந்த மக்களையும் இயல்பான அண்மை முன்னிலையாக விடுதல்
  alternative: ஆசாரியர்கள் கைகளை வைத்தார்கள் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: அரசனும் கூடியிருந்த மக்களுமே மிக அருகிலுள்ள முன்னிலைகள்; ‘தங்கள் கைகள்’ என்பதிலுள்ள பன்மைச் சுட்டும் இயல்பாக அவர்களையே குறிக்கலாம். அவர்கள் நேரடியாகவோ பிரதிநிதிகள் மூலமாகவோ செய்தார்களா என்பதை உரை விளக்காததால் மொழிபெயர்ப்பு அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் பலிச் சடங்குக்குரிய கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சபை’ என்ற சொல் தரக்கூடிய தேவாலயச் சார்பைத் தவிர்க்க ‘கூடியிருந்த மக்கள்’ பயன்படுத்தப்பட்டது; எபிரெய உரையில் உள்ள எழுவாய் தொடர்பான தெளிவின்மை பிரதான உரையில் பாதுகாக்கப்பட்டது.
