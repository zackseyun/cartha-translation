base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
translation:
  language: ta
  text: எசேக்கியாவும் மக்கள் அனைவரும், கடவுள் மக்களுக்காக ஆயத்தம் செய்திருந்ததை முன்னிட்டு மகிழ்ந்தார்கள்[a]; ஏனெனில் இந்தக் காரியம் திடீரென்று நடந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் மக்களை ஆயத்தப்படுத்தியிருந்ததால்” அல்லது “கடவுள் இதை மக்களுக்காக நிலைநிறுத்தியிருந்ததால்.”
    reason: הֵכִין ... לָעָם என்ற எபிரெய சொற்றொடர், மக்களை ஆயத்தப்படுத்துதல், மக்களுக்காக ஏற்பாடு செய்தல், அல்லது இதை அவர்களுக்காக நிலைநிறுத்துதல் ஆகிய பொருள் நிழல்களை அனுமதிக்கிறது.
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: மகிழ்ந்தார்கள்
  rationale: שׂמח என்பது மகிழ்ச்சி அடைதலைக் குறிக்கிறது. எசேக்கியாவையும் மக்கள் அனைவரையும் இணைத்த தமிழ்ச் சொற்றொடரில் பன்மை வினை இயல்பாக உள்ளது.
- source_word: יְחִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: וְכָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: עָם இங்கு கூடியிருந்த சமூகத்தைக் குறிக்கிறது; நவீன தமிழில் இது இயல்பான, தெளிவான வடிவம்.
- source_word: עַל
  choice: …குறித்து
  rationale: மகிழ்ச்சியின் காரணம் அல்லது சந்தர்ப்பத்தை அறிமுகப்படுத்தும் עַל என்பதன் பரப்பைச் சற்றே முறையாகப் பாதுகாக்கிறது.
- source_word: הֵכִין
  choice: ஆயத்தம் செய்திருந்தது
  rationale: כון என்பதன் ஹிஃபில் வடிவம் ஆயத்தப்படுத்துதல், தயார்செய்தல் அல்லது நிலைநிறுத்துதல் எனப் பொருள்படலாம். வழிபாட்டு மறுசீரமைப்பு விரைவாக நிறைவேறிய சூழலில் ‘ஆயத்தம் செய்திருந்தது’ பொருத்தமானது.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கிறது; பொதுவான நவீனத் தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לָעָם
  choice: மக்களுக்காக
  rationale: לְ முன்னொட்டு இங்கு நன்மை அல்லது சார்பு உறவைச் சுட்டுகிறது. மக்களையே நேரடியாக ஆயத்தப்படுத்தினார் என்று தேவையின்றி தீர்மானிக்காமல் எபிரெய வடிவத்தைப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன் கூறப்பட்ட மகிழ்ச்சிக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: בְּפִתְאֹם
  choice: திடீரென்று
  rationale: எதிர்பாராத விரைவையும் திடீர் நிகழ்வையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הָיָה הַדָּבָר
  choice: இது … நடந்தது
  rationale: דָּבָר இங்கு முழு நிகழ்வையும் குறிக்கும் பொதுப்பதம். ‘இது நடந்தது’ என்பது அதன் பொதுத்தன்மையைப் பேணும் இயல்பான தமிழ்.
theological_decisions:
- issue: மக்களுக்கான கடவுளின் ஆயத்தச் செயல்
  choice: கடவுள் மக்களுக்காக ஆயத்தம் செய்திருந்தது
  alternative: கடவுள் மக்களை ஆயத்தப்படுத்தியிருந்தார்; அல்லது கடவுள் இதை மக்களுக்காக நிலைநிறுத்தியிருந்தார்
  rationale: எபிரெய மொழியில் நேரடி செயப்படுபொருள் வெளிப்படையாக இல்லை; לָעָם என்பது ‘மக்களுக்காக’ என இயல்பாகப் புரியலாம். எனவே கடவுள் மக்களையே ஆயத்தப்படுத்தினார் என்று உரை கூறுவதாகத் தீர்மானிக்காமல், தெய்வீகச் செயலையும் மூலத்தின் தெளிவின்மையையும் முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. மூலத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால் ‘எதை’ ஆயத்தம் செய்தார் என்பதை முதன்மை உரை நிரப்பவில்லை; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டன.
