base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/001.yaml
  text: Hezekiah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abijah daughter of Zechariah.
translation:
  language: ta
  text: எசேக்கியா அரசனானபோது அவருக்கு இருபத்தைந்து வயது. அவர் எருசலேமில் இருபத்தொன்பது ஆண்டுகள் ஆட்சி செய்தார். அவருடைய தாயின் பெயர் சகரியாவின் மகளான அபியா.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְחִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட, எபிரெயப் பெயருக்குரிய வழக்கமான ஒலிபெயர்ப்பு.
- source_word: מָלַךְ
  choice: அரசனானபோது
  rationale: முதல் பயன்பாடு அரியணையேற்றத்தைக் குறிக்கிறது; வயதை இயல்பான தமிழில் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: அவருக்கு இருபத்தைந்து வயது
  rationale: எபிரெய மொழியின் வயதைக் குறிக்கும் மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: இருபத்தொன்பது ஆண்டுகள் ஆட்சி செய்தார்
  rationale: இரண்டாம் מָלַךְ ஆட்சிக்காலத்தின் நீளத்தைக் குறிப்பதால், தமிழில் இயல்பாக ‘ஆட்சி செய்தார்’ என வழங்கப்பட்டது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பொருளைக் குறிக்கும் முன்னொட்டையும் வழக்கமான தமிழ் இடப்பெயரையும் தெளிவாக வழங்குகிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவருடைய தாயின் பெயர்
  rationale: எபிரெய வாழ்க்கை வரலாற்றுச் சூத்திரத்தைத் தகவல் இழப்பின்றி இயல்பான தமிழில் வழங்குகிறது.
- source_word: אֲבִיָּה
  choice: அபியா
  rationale: எபிரெயப் பெண்பெயரின் தெளிவான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בַּת
  choice: மகள்
  rationale: இங்கு பெற்றோர் வழி உறவைக் குறிக்கும் வழக்கமான வம்சாவளிப் பயன்பாடு.
- source_word: זְכַרְיָהוּ
  choice: சகரியா
  rationale: எபிரெயப் பெயருக்கான தமிழ் வேதாகம மரபில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு.
