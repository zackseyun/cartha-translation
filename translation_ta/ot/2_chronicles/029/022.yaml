base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
translation:
  language: ta
  text: பின்பு அவர்கள் மாடுகளை அறுத்தார்கள்; ஆசாரியர்கள் இரத்தத்தைப் பெற்றுக்கொண்டு, அதை பலிபீடத்தின்மேல் பாய்ச்சினார்கள்.[a] அவர்கள் செம்மறியாட்டுக் கடாக்களை அறுத்து, இரத்தத்தைப் பலிபீடத்தின்மேல் பாய்ச்சினார்கள். அவர்கள் செம்மறியாட்டுக் குட்டிகளை அறுத்து, இரத்தத்தைப் பலிபீடத்தின்மேல் பாய்ச்சினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாய்ச்சினார்கள்” என்பதற்கு “பலிபீடத்தின்மேல் இரத்தத்தை வீசினார்கள்” அல்லது “பலிபீடத்தின் மீது இரத்தத்தைத் தெளித்தார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், இரத்தத்தை மெதுவாகத் தூவுவதையல்ல, விசையுடன் செய்யப்படும் சடங்குமுறைப் பயன்பாட்டைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: பலியிடுவதற்காக அறுத்தார்கள் / அறுத்தார்கள்
  rationale: שׁחט இங்கு பலிச் சடங்கில் விலங்கைக் கழுத்தறுப்பதைக் குறிக்கிறது. முதல் இடத்தில் சூழலைத் தெளிவுபடுத்த ‘பலியிடுவதற்காக’ சேர்க்கப்பட்டு, தொடரும் பட்டியலில் இயல்பான சுருக்கமாக ‘அறுத்தார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַבָּקָר
  choice: மாடுகள்
  rationale: בקר என்பது ஆண், பெண் என்று குறிப்பிடாத மாட்டினத்தின் கூட்டுப்பெயர். ‘காளைகள்’ என்று பாலினத்தை மிகுதியாகக் குறிப்பதைத் தவிர்க்க ‘மாடுகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיְקַבְּלוּ
  choice: பெற்றுக்கொண்டு
  rationale: קבל என்பதன் அடிப்படைப் பொருள் ‘பெற்றுக்கொள்’. பலிச் சடங்கில் ஆசாரியர்கள் இரத்தத்தை அடுத்த சடங்கு நடவடிக்கைக்காகப் பெற்றதை இது இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: כהנים என்பதற்கான தமிழ் வேதாகம வழக்கிலும் பொதுப் புரிதலிலும் நிலைபெற்ற சொல்.
- source_word: הַדָּם
  choice: இரத்தம்
  rationale: பலியிடப்பட்ட விலங்கின் இரத்தத்தைக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: וַיִּזְרְקוּ
  choice: வேகமாகத் தெளித்தார்கள்
  rationale: זרק பலிச் சடங்கில் இரத்தத்தைப் பலிபீடத்தின் மீது விசையுடன் வீசி அல்லது பாய்ச்சிப் பயன்படுத்துவதைக் குறிக்கிறது. வெறும் மென்மையான ‘தெளித்தல்’ என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘வேகமாக’ சேர்க்கப்பட்டுள்ளது; செயல் முறையின் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַמִּזְבֵּחָה
  choice: பலிபீடத்தின்மேல்
  rationale: திசையைக் காட்டும் வடிவம் பலிபீடத்தை நோக்கிச் சென்று அதன் மேல் அல்லது பக்கத்தில் இரத்தம் படும்படியான செயலைக் குறிக்கிறது. இயல்பான தமிழில் ‘பலிபீடத்தின்மேல்’ இதைத் தெளிவாகக் கூறுகிறது.
- source_word: הָאֵלִים
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: אילים என்பது ஆண் செம்மறியாடுகளைக் குறிக்கிறது. ‘கடாக்கள்’ மட்டும் ஆட்டின வகையைத் தெளிவுபடுத்தாமையால் முழு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: הַכְּבָשִׂים
  choice: செம்மறியாட்டுக் குட்டிகள்
  rationale: כבשים பலிப் பட்டியலில் பொதுவாக இளம் செம்மறியாடுகளைக் குறிக்கிறது; ‘ஆட்டுக்குட்டிகள்’ என்பதைக் காட்டிலும் இச்சொல் விலங்கின் வகையைத் துல்லியமாக்குகிறது.
