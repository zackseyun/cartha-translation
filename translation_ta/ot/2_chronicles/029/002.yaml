source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: ta
  text: அவன், தன் தந்தையான தாவீது செய்த எல்லாவற்றின்படியும், யாவேயின் பார்வையில் சரியானதைச் செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன் முன்னோரான தாவீது’ என்றும் மொழிபெயர்க்கலாம். இங்கு ‘தந்தை’ என்பது உடனடி தந்தையைக் குறிக்காமல், அரச வம்ச முன்னோரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவன் ... செய்தான்
  rationale: עשה என்பதன் Qal wayyiqtol வடிவம் தொடர்கதை நிகழ்வைச் சுட்டுகிறது. நவீன தமிழில் இயல்பான வாக்கிய அமைப்புக்காக தொடக்க வாவ் தனியே மொழிபெயர்க்கப்படவில்லை.
- source_word: הַיָּשָׁר
  choice: நேர்மையானதை
  rationale: உருபுடன் வரும் ישר இங்கு பெயர்ச்சொல் தன்மையில், ‘நேர்மையானது/சரியானது’ என்ற பொருளில் பயன்படுகிறது. ‘நேர்மையானதை’ என்பது அரசர்களைப் பற்றிய இம்மதிப்பீட்டு வாய்பாட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: சொற்பட ‘கண்களில்’ என்றாலும், ஒருவரது மதிப்பீட்டின்படி என்ற எபிரெய உருவகத்தின் பொருளை ‘பார்வையில்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்றுள்ள ஒலிபெயர்ப்பு வடிவமாக வழங்குகிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: செய்த எல்லாவற்றின்படியும்
  rationale: כְּ ஒப்புமை/இணக்கத்தையும் כֹּל முழுமையையும் குறிக்கின்றன; தமிழ் தொடரமைப்பில் இவை ‘எல்லாவற்றின்படியும்’ என இயல்பாக இணைகின்றன.
- source_word: עָשָׂה
  choice: செய்த
  rationale: தாவீதின் முந்தைய செயல்களை எசேக்கியாவின் நடத்தைக்கான அளவுகோலாகக் காட்டும் தொடர்பெயரெச்ச வடிவம்.
- source_word: דָּוִיד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக நிலைபெற்றுள்ள பெயர் வடிவம்.
- source_word: אָבִיו
  choice: தன் தந்தையாகிய
  rationale: אָב என்ற மூலச் சொல்லின் குடும்பச் சொல்லாட்சியை முதன்மை உரையில் பாதுகாக்கிறது; இங்கு உடனடி தந்தை அல்ல, வம்ச முன்னோர் என்ற பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் தனிப்பட்ட தெய்வீகப் பெயரை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது. உயிரெழுத்தாக்கம் குறித்த வேறுபாடு இருப்பதால், தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: ‘தன் தந்தையாகிய தாவீது’ என்பதன் வம்சப் பொருள்
  choice: முதன்மை உரையில் ‘தந்தை’ என்ற குடும்பச் சொல்லைத் தக்கவைத்தல்
  alternative: தன் முன்னோரான தாவீது
  rationale: எபிரெய அரச வம்ச வாய்பாட்டை நேரடியாகப் பாதுகாக்கிறது; தாவீது உடனடி தந்தை எனத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க வம்ச முன்னோர் என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வேதாகமச் செறிவும் கொண்ட எளிய நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மதிப்பீட்டு வாய்பாட்டின் உருவகத்தைச் சொற்பட ‘கண்களில்’ எனக் கடினப்படுத்தாமல் ‘பார்வையில்’ என இயல்பாக்கியுள்ளோம்; வம்ச உறவின் உண்மையான நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
