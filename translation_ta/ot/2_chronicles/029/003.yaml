  edition: WLC
  text: ה֣וּא בַ/שָּׁנָה֩ הָ/רִאשׁוֹנָ֨ה לְ/מָלְכ֜/וֹ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן פָּתַ֛ח אֶת דַּלְת֥וֹת בֵּית יְהוָ֖ה וַֽ/יְחַזְּקֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
translation:
  language: ta
  text: அவன் ஆட்சியின் முதலாவது ஆண்டின் முதலாவது மாதத்தில், யாவேவின் இல்லத்தின் கதவுகளைத் திறந்து, அவற்றைப் பழுதுபார்த்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றை வலுப்படுத்தினான்”; அதாவது, கதவுகளை மீண்டும் உறுதியாகவும் பாதுகாப்பாகவும் ஆக்கினான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: அவன்
  rationale: எபிரெயக் கதையோட்டத்தில் தனிப்பெயர்ச்சொல் எழுவாயை மீண்டும் தெளிவுபடுத்துகிறது; தமிழில் இயல்பாக ‘அவன்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ
  choice: அவன் ஆட்சியின் முதலாவது ஆண்டில்
  rationale: இது அவனுடைய அரசாட்சியின் முதல் ஆண்டைக் குறிக்கும் காலச்சொற்றொடர்; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் வழங்கப்பட்டுள்ளது.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: முதலாவது மாதத்தில்
  rationale: חֹדֶשׁ என்பதன் நேரான பொருள் ‘மாதம்’; இங்கு ஆட்சியின் முதல் ஆண்டிலுள்ள முதல் மாதத்தைக் குறிக்கிறது.
- source_word: פָּתַח
  choice: திறந்து
  rationale: ஆலயக் கதவுகளைத் திறந்த செயலை நேரடியாகக் குறிக்கிறது.
- source_word: דַּלְתוֹת
  choice: கதவுகள்
  rationale: இச்சொல் நகர வாயில்களைவிட கதவுகளையோ கதவுத் தகடுகளையோ குறிக்கிறது; ‘கதவுகள்’ இயல்பான தமிழ் வடிவம்.
- source_word: בֵּית יְהוָה
  choice: யாவேவின் இல்லம்
  rationale: மூலத்தின் ‘யாவேவின் வீடு/இல்லம்’ என்ற உருவகத்தைப் பாதுகாக்க ‘இல்லம்’ பயன்படுத்தப்பட்டுள்ளது; சூழலில் இது ஆலயத்தைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: וַיְחַזְּקֵם
  choice: அவற்றைப் பழுதுபார்த்தான்
  rationale: பியேல் வடிவம் அடிப்படையில் ‘வலுப்படுத்தினான்’ எனப் பொருள்படும்; சேதமடைந்த ஆலயக் கதவுகளின் சூழலில் அவற்றை மீண்டும் உறுதியான நிலையில் கொண்டுவருதல், அதாவது பழுதுபார்த்தல், இயல்பான பொருள். நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலவசனம் நான்கு எழுத்துகளாலான தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பட்டப்பெயரான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக, பொதுவாக ஏற்கப்படும் ‘யாவே’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘யாவேவின் இல்லம்’ என்பது மூலத்தின் உருவகத்தைப் பாதுகாக்கிறது; சூழல் அது ஆலயம் என்பதைத் தெளிவாக்குகிறது. அடிக்குறி தொடர்புடைய வினைச்சொல்லுக்குப் பிறகு வைக்கப்பட்டுள்ளது.
