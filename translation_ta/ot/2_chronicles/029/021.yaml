source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: ta
  text: அவர்கள் ஏழு காளைகளையும் ஏழு செம்மறியாட்டுக் கடாக்களையும் ஏழு செம்மறியாட்டுக் குட்டிகளையும் ஏழு வெள்ளாட்டுக் கடாக்களையும் அரசாட்சிக்காகவும் பரிசுத்த இடத்துக்காகவும் யூதாவுக்காகவும் பாவநிவாரணப் பலியாகக் கொண்டுவந்தார்கள். அவற்றை யாவேவின் பலிபீடத்தின்மேல் பலியிடும்படி ஆசாரியர்களாகிய ஆரோனின் மகன்களிடம் அவர் கூறினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: בוא என்பதன் தொடர் நிகழ்வைச் சொல்லும் வடிவம் பலிக்குரிய விலங்குகளைக் கொண்டுவருதலைக் குறிக்கிறது; இயல்பான தமிழ் இறந்தகால நடை.
- source_word: פָרִים
  choice: காளைகள்
  rationale: பலியிடும் சூழலில் ஆண் மாடுகளைக் குறிக்கிறது; இவ்வசனத்தில் வயது வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
- source_word: אֵילִים
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: ஆண் செம்மறியாடுகளுக்கான தெளிவான நவீனத் தமிழ் சொற்றொடர்.
- source_word: כְבָשִׂים
  choice: ஆட்டுக்குட்டிகள்
  rationale: பலியிடும் பட்டியலில் குட்டி ஆடுகளைக் குறிக்கும் வழக்கமான சொல்; மூலச்சொல்லில் இங்கு பாலினம் வெளிப்படையாக வலியுறுத்தப்படவில்லை.
- source_word: צְפִירֵי עִזִּים
  choice: வெள்ளாட்டுக் கடாக்கள்
  rationale: இந்த இணைச்சொல் குறிப்பாக ஆண் வெள்ளாடுகளைக் குறிக்கிறது.
- source_word: לְחַטָּאת
  choice: பாவநிவாரணப் பலியாக
  rationale: வழிபாட்டுச் சூழலில் חַטָּאת என்பது வெறும் ‘பாவம்’ அல்ல, குறிப்பிட்ட பலிவகையைக் குறிக்கிறது; ‘பாவநிவாரணப் பலி’ நவீனத் தமிழில் அந்தச் சடங்கு வகையைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַל הַמַּמְלָכָה
  choice: அரசாட்சிக்காக
  rationale: பலியின் தொடர்பில் עַל பிரதிநிதித்துவமாக அல்லது சார்பாகச் செய்யப்படுவதைக் குறிக்கிறது; ‘அரசாட்சிக்காக’ அதைச் சுருக்கமாகத் தருகிறது.
- source_word: הַמִּקְדָּשׁ
  choice: பரிசுத்த இடம்
  rationale: מִקְדָּשׁ என்பதன் புனிதத் தலச் சார்பைத் தக்கவைக்கிறது; பொதுவான ‘ஆலயம்’ என்பதைவிட மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: לִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: ஆசாரியர்களாகிய ஆரோனின் மகன்கள்
  rationale: குடும்ப அடையாளத்தையும் ஆசாரியப் பொறுப்பையும் இணைநிலையாகத் தக்கவைக்கிறது.
- source_word: לְהַעֲלוֹת
  choice: பலியிடும்படி
  rationale: עלה என்பதன் இவ்வழிபாட்டுப் பயன்பாடு பலிபீடத்தின்மேல் செலுத்துவதைக் குறிக்கிறது; தமிழில் ‘பலியிடு’ இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: מִזְבַּח יְהוָה
  choice: யாவேவின் பலிபீடம்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் உடைமைத் தொடராகத் தருகிறது; יהוה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்து இறைபெயர் நேரடியாக உள்ளது. பட்டப்பெயராக மாற்றாமல் உடன்படிக்கைப் பெயரைத் தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- issue: חַטָּאת என்பதன் வழிபாட்டுச் சார்ந்த பொருள்
  choice: பாவநிவாரணப் பலி
  alternative: பாவத்துக்கான பலி
  rationale: இங்கு இச்சொல் கருத்தரீதியான பாவத்தை அல்ல, குறிப்பிட்ட பலிவகையைக் குறிக்கிறது; பின்னாளைய கோட்பாட்டு விளக்கங்களைச் சேர்க்காமல் சடங்கு வகையை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. பட்டியலின் மீளுருவாக்கமும் ‘அரசாட்சி—பரிசுத்த இடம்—யூதா’ என்ற மூன்று சார்புகளும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்புகள் தேவையில்லை.
