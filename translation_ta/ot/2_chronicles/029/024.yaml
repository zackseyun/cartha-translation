base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
translation:
  language: ta
  text: ஆசாரியர்கள் அவற்றைப் பலியிடுவதற்காக அறுத்து, இஸ்ரவேல் முழுவதற்காகவும் பாவநிவிர்த்தி செய்ய அவற்றின் இரத்தத்தைப் பலிபீடத்தின்மேல் பூசினார்கள்.[a] ஏனெனில், தகனபலியும் பாவநிவாரண பலியும்[b] இஸ்ரவேல் முழுவதற்குமானவை என்று அரசன் கூறியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் இரத்தத்தால் பலிபீடத்தைத் தூய்மைப்படுத்தினார்கள்”; எபிரெய வினைச்சொல் பாவநிவாரண அல்லது தூய்மைப்படுத்தும் பலிச்சடங்கைச் செய்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தூய்மைப்படுத்தும் பலி.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  choice: அவற்றைப் பலியிடுவதற்காக அறுத்து
  rationale: שׁחט என்பது பலியிடும் சூழலில் மிருகங்களைப் பலியாக அறுப்பதைக் குறிக்கிறது; பன்மை பின்னொட்டு முந்தைய வசனத்திலுள்ள வெள்ளாட்டுக் கடாக்களைக் குறிக்கிறது.
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  choice: அவற்றின் இரத்தத்தைப் பலிபீடத்தின்மேல் பூசினார்கள்
  rationale: இச்சடங்குச் சூழலில் חטא என்பதன் ஹிஃபில் வடிவம் பாவநிவாரணம் அல்லது தூய்மைப்படுத்துதல் சார்ந்த சடங்கைச் செய்வதைக் குறிக்கலாம். தமிழில் இயல்பாகவும், நிகழ்ந்த செயலைத் தெளிவாகவும் காட்ட ‘இரத்தத்தைப் ... பூசினார்கள்’ என்று மொழிபெயர்க்கப்பட்டது; சடங்கின் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְכַפֵּר
  choice: பாவநிவிர்த்தி செய்ய
  rationale: כפר என்பது பலியிடும் சூழலில் குற்றத்தை நீக்கி உறவைச் சீர்செய்யும் பரிகாரச் செயலைக் குறிக்கும் மரபான இறையியல் சொல்; ‘பாவநிவிர்த்தி செய்ய’ என்பது தமிழில் தெளிவும் கண்ணியமும் உடையது.
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதற்காகவும்
  rationale: עַל இங்கு பாவநிவிர்த்திச் செயலின் பயனாளிகளைக் குறிக்கிறது; முழு மக்களையும் உள்ளடக்கும் எல்லை காக்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய செயலின் பரந்த நோக்கத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ
  choice: இஸ்ரவேல் முழுவதற்காகவும் செலுத்தப்பட வேண்டும் என்று அரசன் கூறியிருந்தான்
  rationale: எபிரெயச் சொல்வரிசையை இயல்பான தமிழாக மாற்றி, காணிக்கைகள் அனைத்துப் இஸ்ரவேலுக்காக என்ற அரசனின் முன் அறிவுறுத்தலைத் தெளிவாக்குகிறது. ‘செலுத்தப்பட வேண்டும்’ என்பது எபிரெயில் உள்ள நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்தும் சூழல் நிரப்பல்.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עוֹלָה என்பதற்கான நிலைபெற்ற தமிழ் வேதாகமப் பலியியல் சொல்; முழுவதும் எரிக்கப்படும் காணிக்கையைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: וְהַחַטָּאת
  choice: பாவநிவாரண பலி
  rationale: חַטָּאת இங்கு பாவத்தையே அல்ல, ஒரு பலிவகையைக் குறிக்கிறது. ‘பாவநிவாரண பலி’ வாசகர்களுக்கு தெளிவானது; ‘தூய்மைப்படுத்தும் பலி’ என்ற சடங்கு நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: חטא/חטאת தொடர்பான பலியியல் சொற்களின் பொருள்
  choice: முதன்மை உரையில் ‘பாவநிவாரண பலி’; இரத்தச் செயலை ‘பலிபீடத்தின்மேல் பூசினார்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘தூய்மைப்படுத்தும் பலி’; ‘அதன் இரத்தத்தால் பலிபீடத்தைத் தூய்மைப்படுத்தினார்கள்’
  rationale: சூழல் பாவத்தைக் கையாளும் பலியையும் தூய்மைப்படுத்தும் சடங்கையும் ஒருங்கே சுட்டலாம். முதன்மை உரை பழக்கமான பலிப்பெயரைப் பயன்படுத்துகிறது; எபிரெயின் தூய்மைப்படுத்தும் நுணுக்கத்தை அடிக்குறிப்பு காக்கிறது. இரத்தமே பலி என்று கூறாதபடி செயல் தனித்தே மொழிபெயர்க்கப்படுகிறது.
- issue: כפר என்பதன் பலியியல் நோக்கம்
  choice: ‘பாவநிவிர்த்தி செய்ய’
  alternative: ‘பரிகாரம் செய்ய’ அல்லது ‘தூய்மைப்படுத்த’
  rationale: இச்சொல் பலியால் நிகழும் பரிகாரத்தைச் சுட்டுகிறது; ஒரே கோட்பாட்டுச் செயல்முறையாக அதை விளக்காமல், தமிழில் பரவலாகப் புரியும் இறையியல் சொல்லால் மொழிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு உரைக்கேற்ற கண்ணியமான நடையும் சாதாரண வாசகருக்குப் புரியும் வாக்கிய அமைப்பும் பயன்படுத்தப்பட்டுள்ளன. ‘ஆசாரியர்கள்’, ‘பலிபீடம்’, ‘தகனபலி’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன; ஆனால் தேவையற்ற தொழில்நுட்ப மொழி தவிர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் உரிய கருத்துகளுக்குப் பின் [a], [b] என அமைக்கப்பட்டுள்ளன.
