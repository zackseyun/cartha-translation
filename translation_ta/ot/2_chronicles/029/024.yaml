  source_fidelity: 'முதன்மை வாக்கியம் எபிரெய மூலத்தின் செயல்களையும் நோக்கத்தையும் சரியாக வெளிப்படுத்துகிறது: ஆசாரியர்கள் மிருகங்களை அறுத்தனர், இரத்தத்தைப் பலிபீடத்தில் பயன்படுத்தினர், எல்லா இஸ்ரவேலுக்காகவும் பாவநிவிர்த்தி செய்தனர். ஆனால், இறுதிப் பகுதியில் உள்ள ‘செலுத்தப்பட வேண்டும்’ எபிரெயில் வெளிப்படையாக இல்லாத கட்டளை/தேவை நுணுக்கத்தைச் சேர்க்கிறது. அரசன் பலிகள் ‘எல்லா இஸ்ரவேலுக்குமானவை’ என்று கூறினான் என்பதே மூலத்தின் சுருக்கமான பொருள்.'
