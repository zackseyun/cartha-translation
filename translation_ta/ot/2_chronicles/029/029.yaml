base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
translation:
  language: ta
  text: அவர்கள் பலியைச் செலுத்தி முடித்தபோது, அரசரும் அவருடன் இருந்த அனைவரும் முழங்காலிட்டு, பணிந்து வழிபட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பணிந்து வழிபட்டார்கள்” என்பதற்கான எபிரெயச் சொல், பயபக்தியுடன் குனிதல் அல்லது தரையில் விழுந்து பணிதல் என்றும் பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְ/כַלּוֹת לְ/הַעֲל֑וֹת
  choice: அவர்கள் பலியைச் செலுத்தி முடித்தபோது
  rationale: כלה என்பதன் infinitive construct காலத்தைக் குறிக்கும் துணைவாக்கியத்தை உருவாக்குகிறது. העלות என்பது எழுத்துப்படி ‘மேலே எழும்பச் செய்தல்’; இங்குள்ள பலிச் சூழலில் பலியைச் செலுத்துவதைக் குறிக்கிறது. எபிரெயத்தில் கருமப்பொருள் வெளிப்படையாக இல்லாததால், ‘பலியை’ என்பது சூழலால் உணரப்படும் பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: כָּרְע֗וּ
  choice: முழங்கால்படியிட்டு
  rationale: כרע முழங்காலை மடக்குதல் அல்லது முழங்கால்படியிடுதலைக் குறிக்கிறது; அடுத்த வினைச்சொல்லிலுள்ள பணிந்து வழிபடும் செயலிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: הַ/מֶּ֛לֶךְ
  choice: அரசர்
  rationale: குறிப்பிட்ட அரசனைக் குறிக்கும் பெயர்ச்சொல்லின் நேரான, மரியாதைமிக்க தமிழ் வடிவம்.
- source_word: וְ/כָֽל הַ/נִּמְצְאִ֥ים אִתּ֖/וֹ
  choice: அவருடன் இருந்த அனைவரும்
  rationale: מצא என்பதன் Niphal participle இங்கு ‘உடனிருந்தவர்கள் / அங்கு இருந்தவர்கள்’ என்ற வழக்குப் பொருளைக் கொண்டது.
- source_word: וַ/יִּֽשְׁתַּחֲוֽוּ
  choice: பணிந்து வழிபட்டார்கள்
  rationale: שחה என்பதன் இவ்வடிவம் மரியாதையுடன் குனிதல், தரையில் விழுந்து பணிதல், அல்லது வழிபடுதல் ஆகிய உடல் மற்றும் சமயப் பொருள்களை ஒருங்கே தாங்குகிறது. ஆலயப் பலிச் சூழலில் ‘பணிந்து வழிபட்டார்கள்’ இரு கூறுகளையும் இயல்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆலய வழிபாட்டுச் சூழலில் שחה என்பதன் பொருள்
  choice: பணிந்து வழிபட்டார்கள்
  alternative: குனிந்து வணங்கினார்கள் / தரையில் விழுந்து பணிந்தார்கள்
  rationale: இது வெறும் உடல் அசைவா அல்லது வழிபாட்டுச் செயலா என்ற பிரிவை மூலவசனம் கட்டாயப்படுத்தவில்லை. பலி முடிந்த பின்பான ஆலயச் சூழல் வழிபாட்டுப் பொருளைத் தருகிறது; அதேவேளை வினைச்சொல்லின் உடல்சார்ந்த பணிதலையும் ‘பணிந்து’ பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரசர்’ என்ற மரியாதை ஒருமையுடன் வினைச்சொல் பன்மையில் அமைவது, அரசரும் மற்ற அனைவரும் சேர்ந்த எழுவாயாக இருப்பதனால் இயல்பானது. மூலத்தில் வெளிப்படையாக இல்லாத ‘தகனபலி’ என்பதைச் சேர்க்காமல், சூழலால் உணரப்படும் பொதுவான ‘பலி’ மட்டும் பயன்படுத்தப்பட்டது.
