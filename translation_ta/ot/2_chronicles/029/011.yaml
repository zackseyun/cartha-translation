source:
  edition: WLC
  text: בָּנַ֕/י עַתָּ֖ה אַל תִּשָּׁל֑וּ כִּֽי בָ/כֶ֞ם בָּחַ֣ר יְהוָ֗ה לַ/עֲמֹ֤ד לְ/פָנָי/ו֙ לְ/שָׁ֣רְת֔/וֹ וְ/לִ/הְי֥וֹת ל֖/וֹ מְשָׁרְתִ֥ים וּ/מַקְטִרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/011.yaml
  text: My sons[a], do not be negligent now, for Yahweh has chosen you to stand before him, to minister to him[d][c][b], and to be his ministers and burners of incense.
translation:
  language: ta
  text: என் மகன்களே, இப்போது அலட்சியமாக இருக்காதீர்கள்[a]. ஏனெனில், யாவே தமக்கு முன்பாக நிற்பதற்கும்[b], தமக்குப் பணிவிடை செய்வதற்கும், தமது பணிவிடையாளர்களாகவும் தூபம் செலுத்துபவர்களாகவும் இருப்பதற்கும் உங்களைத் தேர்ந்தெடுத்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “தளர்வாக இருக்காதீர்கள்” அல்லது “கவனக்குறைவாக இருக்காதீர்கள்.”'
    reason: lexical_alternative
  - marker: b
    text: “தமக்கு முன்பாக நிற்பது” என்பது இறைவனின் முன்னிலையில் ஆசாரியப் பணிசெய்வதைக் குறிக்கும் ஓர் எபிரெயச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: בָּנַי
  choice: என் மகன்களே
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியுடன் வரும் ஆண்பால் அழைப்பை நேரடியாகப் பிரதிபலிக்கிறது; சூழலில் ஆசாரியர்களும் லேவியர்களும் அழைக்கப்படுவதால் பாலினத்தையும் உரையின் அன்பான அறிவுறுத்தல் தொனியையும் காக்கிறது.
- source_word: עַתָּה
  choice: இப்போது
  rationale: எளிய கால வினையடை; அறிவுறுத்தலின் உடனடித் தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: אַל תִּשָּׁלוּ
  choice: அலட்சியமாக இருக்காதீர்கள்
  rationale: இந்தச் சூழலில் שלה என்பதன் சோம்பலாக, கவனமின்றி, கடமையில் தவறி இருத்தல் என்ற பொருளைத் தெளிவாகக் கொடுக்கிறது; ‘ஏமாறாதீர்கள்’ என்ற வேறு பொருள் இங்குள்ள ஆலயப் பணிச் சூழலுக்குப் பொருந்தாது.
- source_word: בָכֶם בָּחַר יְהוָה
  choice: யாவே ... உங்களைத் தேர்ந்தெடுத்திருக்கிறார்
  rationale: எபிரெயத்தில் முன்னிலைப்படுத்தப்பட்ட ‘உங்களை’ என்ற செயப்படுபொருளின் வலியுறுத்தலை இயல்பான தமிழ் வாக்கிய அமைப்பில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெயத் திருமறையில் உள்ள இறைத் தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לַעֲמֹד לְפָנָיו
  choice: தமக்கு முன்பாக நின்று
  rationale: இறைவனின் முன்னிலையில் நியமிக்கப்பட்ட பணியைச் செய்வதைக் குறிக்கும் ஆசாரியப் பயன்பாட்டின் உருவகத்தை அப்படியே காக்கிறது.
- source_word: לְשָׁרְתוֹ
  choice: தமக்குப் பணிவிடை செய்வதற்கும்
  rationale: שרת என்பதன் வழிபாட்டு மற்றும் ஆசாரியப் பணிநுட்பத்தைப் பொதுவான ‘சேவை’ என்பதைவிடத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְלִהְיוֹת לוֹ מְשָׁרְתִים
  choice: தமது பணிவிடையாளர்களாக ... இருப்பதற்கும்
  rationale: இறைவனுக்குரிய நியமிக்கப்பட்ட பணி நிலையைச் சுட்டும் வினையெச்சத்தின் பெயர்ச்சொல் தன்மையைப் பேணுகிறது.
- source_word: וּמַקְטִרִים
  choice: தூபம் செலுத்துகிறவர்களாகவும்
  rationale: ஆலயச் சூழலில் קטר என்பதன் புகையெழச் செய்யும் வழிபாட்டுச் செயலை இயல்பான தமிழில் தெரிவிக்கிறது; இணையான இரண்டு பணி அடையாளங்களையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் வரும் நான்கு எழுத்து இறைத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து, அது தனிப்பெயர் என்பதை வெளிப்படையாகப் பேணுகிறது.
- issue: ‘தமக்கு முன்பாக நிற்பது’ என்பதன் ஆசாரியப் பொருள்
  choice: எபிரெய உருவகத்தை முதன்மை உரையில் காத்தல்
  alternative: தமது முன்னிலையில் பணிசெய்ய
  rationale: இந்தச் சொற்றொடர் சாதாரணமாக நிற்பதையும் நியமிக்கப்பட்ட ஆசாரியப் பணியையும் ஒருங்கே உணர்த்தக்கூடியதால், அதன் உண்மையான உருவகத்தையும் நுட்பத்தையும் மொழிபெயர்ப்பில் காத்து, அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அறிவுறுத்தல் நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைக் குறிக்கும் இடங்களில் மரியாதைப் பன்மை வடிவங்களான ‘தமக்கு/தமது’ பயன்படுத்தப்பட்டுள்ளன. ‘பணிவிடை’ ஆலயச் சேவையின் நுட்பத்தைக் காக்கிறது; பழமையான அல்லது சமயப்பிரிவு சார்ந்த சிறப்புச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
