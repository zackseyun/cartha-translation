translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் பெயர்ச்சொல் மைய அமைப்பை இயல்பான தமிழ் வாக்கியமாக்க ‘இருந்தன’ சேர்க்கப்பட்டது; மூலத்தின் எண்ணிக்கைகளும் சொல்லியல் விரிவும் பாதுகாக்கப்பட்டன.
