  text: וְֽ/הַ/קֳּדָשִׁ֑ים בָּקָר֙ שֵׁ֣שׁ מֵא֔וֹת וְ/צֹ֖אן שְׁלֹ֥שֶׁת אֲלָפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/033.yaml
  text: And the consecrated offerings were six hundred cattle and three thousand sheep[a][b].
translation:
  language: ta
  text: அர்ப்பணிக்கப்பட்ட காணிக்கைகளாக அறுநூறு மாடுகளும் மூவாயிரம் ஆடுகளும்[a][b] இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அர்ப்பணிக்கப்பட்டவை” அல்லது “புனிதமானவை”; அதாவது, புனிதக் காணிக்கைகளாகப் பிரித்துவைக்கப்பட்ட விலங்குகள்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரெயச் சொல் செம்மறியாடுகள், வெள்ளாடுகள் ஆகிய இரண்டையும் உள்ளடக்கிய மந்தை விலங்குகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקֳּדָשִׁים
  choice: அர்ப்பணிக்கப்பட்ட காணிக்கைகள்
  rationale: இச்சொல் சொற்படியாக ‘புனிதமானவை’ அல்லது ‘அர்ப்பணிக்கப்பட்டவை’ எனப் பொருள்படும். தொடர்ந்து விலங்குகள் எண்ணப்படுவதால், இங்கு இறைவனுக்கெனப் பிரித்துவைக்கப்பட்ட பலிக்காணிக்கைகளைக் குறிக்கிறது என்பதை இயல்பாக வெளிப்படுத்த இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בָּקָר
  choice: மாடுகள்
  rationale: இது ஆண், பெண் வேறுபாட்டைக் குறிப்பிடாமல் மாட்டினத்தைக் கூட்டாகக் குறிக்கும் சொல்; நவீன தமிழில் ‘மாடுகள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: שֵׁשׁ מֵאוֹת
  choice: அறுநூறு
  rationale: எபிரெய எண்ணிக்கையின் நேரான தமிழ் வடிவம்.
- source_word: וְצֹאן
  choice: ஆடுகள்
  rationale: இது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய மந்தை விலங்குகளைக் குறிக்கும் கூட்டுப்பெயர். தமிழில் ‘ஆடுகள்’ இருவகையையும் பொதுவாகக் குறிக்கக்கூடிய இயல்பான சொல்; சொல்லின் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: மூவாயிரம்
  rationale: எபிரெய எண்ணிக்கையின் நேரான தமிழ் வடிவம்.
