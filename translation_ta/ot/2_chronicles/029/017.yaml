source:
  edition: WLC
  text: וַ֠/יָּחֵלּוּ בְּ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הָ/רִאשׁוֹן֮ לְ/קַדֵּשׁ֒ וּ/בְ/י֧וֹם שְׁמוֹנָ֣ה לַ/חֹ֗דֶשׁ בָּ֚אוּ לְ/אוּלָ֣ם יְהוָ֔ה וַ/יְקַדְּשׁ֥וּ אֶת בֵּית יְהוָ֖ה לְ/יָמִ֣ים שְׁמוֹנָ֑ה וּ/בְ/י֨וֹם שִׁשָּׁ֥ה עָשָׂ֛ר לַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן כִּלּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
translation:
  language: ta
  text: அவர்கள் முதலாம் மாதத்தின் முதல் நாளில் புனிதப்படுத்தத் தொடங்கினார்கள். மாதத்தின் எட்டாம் நாளில் அவர்கள் யாவேயின் முன்மண்டபத்துக்கு[a] வந்தார்கள். அவர்கள் யாவேயின் ஆலயத்தை எட்டு நாட்களில் புனிதப்படுத்தி, முதலாம் மாதத்தின் பதினாறாம் நாளில் வேலையை முடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முன்மண்டபம்’ என்பதை ‘முகப்பு மண்டபம்’ அல்லது ‘நுழைவு மண்டபம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: אוּלָם என்ற கட்டடக்கலைச் சொல்லுக்குரிய இயல்பான தமிழ் மாற்றுச் சொற்களைத் தருகிறது.
lexical_decisions:
- source_word: וַיָּחֵלּוּ
  choice: தொடங்கினார்கள்
  rationale: Hiphil வடிவில் உள்ள חלל இங்கு ‘தொடங்கு’ என்று பொருள்படுகிறது; தமிழ் கதைநடையில் இயல்பாகப் பன்மையில் வழங்கப்பட்டுள்ளது.
- source_word: לְקַדֵּשׁ / וַיְקַדְּשׁוּ
  choice: புனிதப்படுத்த / புனிதப்படுத்தி
  rationale: קדשׁ என்பது ஆலயத்தைப் புனிதப் பயன்பாட்டுக்கெனத் தகுதிப்படுத்துவதைச் சுட்டுகிறது. ‘புனிதப்படுத்த’ என்பது வெறும் உடல் தூய்மைப்படுத்துதலாகக் குறுக்காமல், சடங்கு சார்ந்த அர்ப்பணிப்பு மற்றும் தூய்மைப்படுத்துதல் ஆகிய கருத்துகளைத் தக்கவைக்கிறது.
- source_word: בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: முதலாம் மாதத்தின் முதல் நாளில்
  rationale: ‘மாதத்தின் ஒன்றாம் நாளில்’ என்ற எபிரெய தேதிக் கூறை இயல்பான நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: בָּאוּ לְאוּלָם יְהוָה
  choice: யாவேயின் முன்மண்டபத்துக்கு வந்தார்கள்
  rationale: אוּלָם என்பது ஆலயத்தின் முன்புற மண்டபம் அல்லது முகப்பு மண்டபம். לְ என்பதின் திசைநோக்குப் பொருளை ‘-க்கு வந்தார்கள்’ தக்கவைக்கிறது; உள்ளே முழுமையாக நுழைந்தார்கள் என்று மிகைப்படுத்தவில்லை.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லுக்கு சொல் ‘யாவேயின் வீடு’ என்றாலும், நாளாகமத்தின் இச்சூழலில் அது எருசலேம் ஆலயத்தைக் குறிக்கிறது. ‘ஆலயம்’ நவீன தமிழில் தெளிவும் இயல்பும் உடையது.
- source_word: לְיָמִים שְׁמוֹנָה
  choice: எட்டு நாட்களில்
  rationale: இப்பணிக்குத் தேவையான கால அளவைத் தெரிவிக்கிறது; தொடர்ந்து வரும் பதினாறாம் நாள் நிறைவு குறிப்போடு இயல்பாக இணைகிறது.
- source_word: כִּלּוּ
  choice: வேலையை முடித்தார்கள்
  rationale: Piel வடிவிலுள்ள כלה ‘முடித்தல்/நிறைவு செய்தல்’ என்று பொருள்படும். தமிழில் செயப்படுபொருள் இல்லாமல் ‘முடித்தார்கள்’ என்பது சற்றுத் தொங்குவதால், சூழலில் தெளிவாக உள்ள பணியை ‘வேலையை’ என வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதனை ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; ஒரு பட்டப்பெயராக மாற்றுவதையும் வேறொரு பாரம்பரிய ஒலிப்பைத் திணிப்பதையும் தவிர்க்கிறது.
- issue: קדשׁ என்பதன் ஆலயச் சூழல்
  choice: புனிதப்படுத்துதல்
  alternative: தூய்மைப்படுத்துதல் / அர்ப்பணித்தல்
  rationale: இச்சொல் ஆலயத்தை மாசிலிருந்து சுத்தம் செய்வதை உள்ளடக்கினாலும் அதோடு மட்டுப்படாது; அதை புனிதப் பயன்பாட்டுக்குத் தகுதிப்படுத்தும் கருத்தையும் கொண்டுள்ளது. ஆகவே இரு பரிமாணங்களையும் தாங்கக்கூடிய சொல்லாட்சி தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. தேதிக் கூறுகள் தமிழின் இயல்பான வரிசையில் அமைக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் தவறான இடத்தில் தோன்றியிருந்த [a] குறி, அதன் உண்மையான சொற்பொருள் தொடர்பான ‘முன்மண்டபம்’ என்பதற்குப் பிறகு வைக்கப்பட்டுள்ளது.
