source:
  edition: WLC
  text: וַ/יַּ֨עַן יְחִזְקִיָּ֜הוּ וַ/יֹּ֗אמֶר עַתָּ֨ה מִלֵּאתֶ֤ם יֶדְ/כֶם֙ לַ/יהוָ֔ה גֹּ֧שׁוּ וְ/הָבִ֛יאוּ זְבָחִ֥ים וְ/תוֹד֖וֹת לְ/בֵ֣ית יְהוָ֑ה וַ/יָּבִ֤יאוּ הַ/קָּהָל֙ זְבָחִ֣ים וְ/תוֹד֔וֹת וְ/כָל נְדִ֥יב לֵ֖ב עֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
translation:
  language: ta
  text: 'அப்போது எசேக்கியா பதிலளித்துக் கூறினார்: “இப்போது நீங்கள் யாவேக்காக உங்கள் கைகளை நிரப்பியிருக்கிறீர்கள்[a]. அருகில் வந்து, யாவேயின் இல்லத்துக்கு பலிகளையும் நன்றிப் பலிகளையும் கொண்டுவாருங்கள்.” சபையினர் பலிகளையும் நன்றிப் பலிகளையும் கொண்டுவந்தார்கள்; மனமுவந்த அனைவரும் தகனபலிகளைக் கொண்டுவந்தார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவேக்காக உங்கள் கைகளை நிரப்பியிருக்கிறீர்கள்.” இது திருப்பணிக்காக அர்ப்பணிக்கப்படுவதையோ அதில் நிறுவப்படுவதையோ குறிக்கும் ஒரு வழக்குத்தொடர்.
    reason: மூலமொழி வழக்குத்தொடரின் பொருளை விளக்குதல்
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: மறுமொழியாக ... என்றார்
  rationale: எபிரெயக் கதைநடையில் வரும் ‘பதிலளித்து கூறினார்’ என்ற இணைப்பை, பொருளை இழக்காமல் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: מִלֵּאתֶם יֶדְכֶם
  choice: உங்கள் கைகளை நிரப்பியிருக்கிறீர்கள்
  rationale: ‘கையை நிரப்புதல்’ என்ற மூலமொழியின் வழக்குத்தொடரை விளக்கமாக மாற்றாமல் முதன்மை உரையில் பாதுகாக்கிறது; அதன் திருப்பணி அர்ப்பணிப்பு சார்ந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: לְ முன்னிடைச்சொல்லின் ‘யாவேக்காக/யாவேக்கு’ என்ற அர்ப்பணிப்பு நோக்கத்தை இச்சூழலில் ‘யாவேக்காக’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: גֹּשׁוּ
  choice: அருகில் வந்து
  rationale: வழிபாட்டிற்காக அணுகும் கருத்தைக் கொண்ட ‘நெருங்குங்கள்’ என்பதன் இயல்பான தமிழ் வடிவம்.
- source_word: זְבָחִים
  choice: பலிகள்
  rationale: அறுத்துப் பலியிடப்படும் பலிகளைப் பொதுவாகக் குறிக்கும் சொல்லுக்கு எளிய, நிலையான தமிழ் இணை.
- source_word: תוֹדוֹת
  choice: நன்றிப் பலிகள்
  rationale: நன்றி செலுத்துவதற்கான பலிவகையைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: לְבֵית יְהוָה
  choice: யாவேயின் இல்லத்திற்கு
  rationale: ‘யாவேயின் வீடு/இல்லம்’ என்ற எபிரெய உருவகத்தை ‘ஆலயம்’ என்று விளக்கி மாற்றாமல் பாதுகாக்கிறது.
- source_word: הַקָּהָל
  choice: சபையார்
  rationale: கூடியிருந்த வழிபாட்டுச் சமூகத்தைக் குறிக்கும் இயல்பான, மரியாதையான தமிழ் சொல்.
- source_word: כָל נְדִיב לֵב
  choice: மனமுவந்த அனைவரும்
  rationale: உள்ளத்திலிருந்து தன்னார்வமாக முன்வந்த தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: முழுவதும் எரிக்கப்படும் பலிக்கான நிலையான வேதாகமத் தமிழ் பதம்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது.
- issue: מִלֵּאתֶם יֶדְכֶם என்ற அர்ப்பணிப்பு வழக்குத்தொடர்
  choice: மூல உருவகத்தை உரையில் வைத்து, பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: யாவேயின் பணிக்காக உங்களை அர்ப்பணித்திருக்கிறீர்கள்
  rationale: இச்சொற்றொடர் திருப்பணிக்காக அர்ப்பணிக்கப்படுதல் அல்லது நிறுவப்படுதல் என்பதைக் குறிக்கலாம்; விளக்க மொழிபெயர்ப்பு ஒன்றையே உரையில் உறுதிசெய்யாமல் மூலத்தின் தனித்த உருவகத்தையும் பொருள் வீச்சையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘யாவேயின் இல்லம்’ மற்றும் ‘கைகளை நிரப்புதல்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; மறைந்துவிடக்கூடிய அர்ப்பணிப்பு சார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
