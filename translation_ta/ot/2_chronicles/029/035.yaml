id: 2CH.29.35
reference: 2 Chronicles 29:35
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/גַם עֹלָ֨ה לָ/רֹ֜ב בְּ/חֶלְבֵ֧י הַ/שְּׁלָמִ֛ים וּ/בַ/נְּסָכִ֖ים לָ/עֹלָ֑ה וַ/תִּכּ֖וֹן עֲבוֹדַ֥ת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
translation:
  language: ta
  text: தகனபலிகளும் ஏராளமாக இருந்தன; அவற்றோடு சமாதானப் பலிகளின்[a] கொழுப்புப் பகுதிகளும், தகனபலிகளுக்குரிய பானபலிகளும் இருந்தன. இவ்வாறு யாவேயின் ஆலயப் பணி நிலைநிறுத்தப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நல்லுறவுப் பலிகள்.”
    reason: שְׁלָמִים என்பதற்கு சமாதானத்தையும் பகிர்ந்துண்ணும் நல்லுறவையும் சுட்டும் மாற்று மொழியாக்கம் சாத்தியம்.
lexical_decisions:
- source_word: וְגַם
  choice: -உம்
  rationale: முந்தைய சூழலோடு இணைக்கும் சேர்க்கைப் பொருளை இயல்பான தமிழ் இடைச்சொல் வெளிப்படுத்துகிறது.
- source_word: עֹלָה
  choice: தகனபலிகள்
  rationale: இலக்கண வடிவம் ஒருமையாக இருந்தாலும், לָרֹב என்பதோடும் பல பலிகள் செலுத்தப்பட்ட சூழலோடும் சேர்ந்து கூட்டுப்பொருள் தருவதால் தமிழில் பன்மை பயன்படுத்தப்பட்டது.
- source_word: לָרֹב
  choice: ஏராளமாக
  rationale: பெரிய எண்ணிக்கை அல்லது மிகுதியைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கான இயல்பான நவீனத் தமிழ்.
- source_word: בְּחֶלְבֵי
  choice: அவற்றோடு ... கொழுப்புப் பகுதிகளும்
  rationale: பலியிடும் சூழலில் חלב என்பது பொதுவாகக் கொழுப்பை மட்டுமல்ல, பலிபீடத்தில் செலுத்தப்பட்ட குறிப்பிட்ட கொழுப்புப் பகுதிகளைக் குறிக்கிறது; בְּ இங்கு உடனிணைப்பைக் காட்டுகிறது.
- source_word: הַשְּׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: எபிரெய வேதாகமத்தின் தனித்த பலிவகையைப் பாதுகாக்கும் வழக்கமான சொல்; குறுகிய ஓர் இறையியல் விளக்கத்தை உரைக்குள் திணிக்கவில்லை.
- source_word: וּבַנְּסָכִים
  choice: பானபலிகளும்
  rationale: ஊற்றிச் செலுத்தப்படும் திரவப் பலிகளைக் குறிக்கும் தெளிவான, சுருக்கமான தமிழ் வழக்கு.
- source_word: לָעֹלָה
  choice: தகனபலிகளுக்குரிய
  rationale: இப்பானபலிகள் முன் குறிப்பிடப்பட்ட தகனபலிகளுடன் தொடர்புடையவை என்பதை வெளிப்படுத்துகிறது.
- source_word: וַתִּכּוֹן
  choice: நிலைநிறுத்தப்பட்டது
  rationale: כון என்பதிலுள்ள ஒழுங்குபடுத்தப்பட்டு உறுதியாக ஏற்படுத்தப்படும் முடிவுநிலையைப் பாதுகாக்கிறது; 'மீட்டெடுக்கப்பட்டது' என்று மூலத்தில் வெளிப்படாத கருத்தைச் சேர்க்கவில்லை.
- source_word: עֲבוֹדַת בֵּית יְהוָה
  choice: யாவேயின் ஆலயப் பணி
  rationale: עֲבוֹדָה என்பதன் வழிபாடு சார்ந்த சேவைப் பொருளையும், בֵּית என்பதன் இச்சூழலிலான ஆலயக் குறிப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக இருப்பதால் அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்தது.
- issue: שְׁלָמִים என்ற பலிவகை
  choice: சமாதானப் பலிகள்
  alternative: நல்லுறவுப் பலிகள்
  rationale: அங்கீகரிக்கப்பட்ட பலிவகையைப் பாதுகாக்கிறது; அதன் நோக்கத்தை நல்லுறவு என்ற ஒரே விளக்கத்துக்குள் சுருக்காமல் மாற்று மொழியாக்கத்தை அடிக்குறிப்பில் தருகிறது.
- issue: וַתִּכּוֹן என்பதன் முடிவுநிலை
  choice: நிலைநிறுத்தப்பட்டது
  alternative: ஒழுங்குபடுத்தப்பட்டது
  rationale: ஆலயப் பணி முறையாக ஏற்படுத்தப்பட்டு உறுதியான நிலையை அடைந்தது என்ற பொருளைத் தருகிறது; அது முன்பு இருந்ததன் மீட்பு மட்டுமே என்று உரை கூறுவதைவிட அதிகமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன, தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. பலியியல் சார்ந்த தொழில்சொற்கள் சுருக்கமாகப் பாதுகாக்கப்பட்டுள்ளன; வாக்கிய உறவுகள் சாதாரண வாசகருக்குத் தெளிவாக இருக்கத் தேவையான அளவு மட்டும் வெளிப்படுத்தப்பட்டுள்ளன.
