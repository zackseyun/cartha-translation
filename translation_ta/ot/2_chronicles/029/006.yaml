id: 2CH.29.6
reference: 2 Chronicles 29:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּֽי מָעֲל֣וּ אֲבֹתֵ֗י/נוּ וְ/עָשׂ֥וּ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֵ֖י/נוּ וַ/יַּֽעַזְבֻ֑/הוּ וַ/יַּסֵּ֧בּוּ פְנֵי/הֶ֛ם מִ/מִּשְׁכַּ֥ן יְהוָ֖ה וַ/יִּתְּנוּ עֹֽרֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
translation:
  language: ta
  text: ஏனெனில், எங்கள் முன்னோர் நம்பிக்கைத் துரோகம் செய்து[a], எங்கள் கடவுளாகிய யாவேயின் பார்வையில் தீமையானதைச் செய்தார்கள். அவர்கள் அவரைக் கைவிட்டு, யாவேயின் உறைவிடத்திலிருந்து[b] தங்கள் முகங்களைத் திருப்பி, முதுகைக் காட்டினார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நம்பிக்கைக்குப் புறம்பாக நடந்துகொண்டார்கள்’, ‘துரோகம் செய்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல், குறிப்பாகக் கடவுளுடனான உடன்படிக்கை மற்றும் வழிபாடு சார்ந்த உறவில், நம்பிக்கை மீறுதலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், ‘யாவேயின் உறைவிடத்திலிருந்து.’ இச்சூழலில் இது ஆலயத்தைக் குறிக்கிறது; ‘யாவேயின் திருக்கூடாரத்திலிருந்து’ என்பதும் சொல்லளவில் சாத்தியம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயில் சொல்லுக்குச் சொல், ‘பிடரியைக் கொடுத்தார்கள்.’ மறுப்போடு விலகுவதை இந்த மரபுத்தொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  choice: நம்பிக்கைத் துரோகம் செய்து
  rationale: இந்த வினைச்சொல் வெறும் தவறை அல்லாமல், கடவுளுடனான உறவிலும் வழிபாட்டிலும் நம்பிக்கைக்குப் புறம்பாக நடந்துகொண்டதைச் சுட்டுகிறது. ‘நம்பிக்கைத் துரோகம்’ அதன் உடன்படிக்கை சார்ந்த வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: הָרַע
  choice: தீமையானதை
  rationale: עָשָׂה הָרַע என்ற எபிரெய வழக்கு ‘தீமையானதைச் செய்தல்’ என்று பொருள்படுகிறது; இது அறநெறி மதிப்பீட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: ‘யாவேயின் கண்களில்’ என்ற நேரடி உருவகத்தை இயல்பான தமிழில் ‘பார்வையில்’ என்று வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּעַזְבֻהוּ
  choice: அவரைக் கைவிட்டு
  rationale: עזב இங்கு கடவுளுடனான உறவைத் திட்டமிட்டு விட்டு விலகியதைக் குறிக்கிறது; ‘கைவிட்டு’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: தங்கள் முகங்களைத் திருப்பி
  rationale: மூலத்தின் உடல்சார்ந்த உருவகத்தையும் திட்டமிட்ட புறக்கணிப்பையும் காக்கிறது.
- source_word: מִמִּשְׁכַּן יְהוָה
  choice: யாவேயின் உறைவிடத்திலிருந்து
  rationale: מִשְׁכָּן என்பதன் அடிப்படைப் பொருள் ‘உறைவிடம்’. இச்சூழலில் அது ஆலயத்தைக் குறித்தாலும், ‘திருக்கூடாரம்’ என்று மொழிபெயர்த்து வேறு காலச் சூழலைக் குறிப்பதாகத் தோன்றுவதைத் தவிர்க்கிறது.
- source_word: וַיִּתְּנוּ עֹרֶף
  choice: முதுகுகாட்டினார்கள்
  rationale: சொல்லுக்குச் சொல் ‘பிடரியைக் கொடுத்தார்கள்’ என்ற எபிரெய மரபுத்தொடர் மறுப்போடும் எதிர்ப்போடும் விலகுவதைக் குறிக்கிறது. ‘முதுகுகாட்டினார்கள்’ அதே உருவகத்தையும் பொருளையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துவதால், பட்டப்பெயரைப் பதிலிடாமல் அதன் ஒலிபெயர்ப்பு தரப்பட்டுள்ளது.
- issue: ஆலயச் சூழலில் מִשְׁכָּן என்பதன் பொருள்
  choice: உறைவிடம்
  alternative: திருக்கூடாரம் அல்லது பரிசுத்த இடம்
  rationale: இங்கு ஆலயமே யாவேயின் உறைவிடமாகக் குறிப்பிடப்படுகிறது. ‘உறைவிடம்’ மூலச்சொல்லின் பொருளைக் காத்து, வனாந்தரத் திருக்கூடாரத்துடன் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. இணையான ‘முகங்களைத் திருப்பி / முதுகுகாட்டினார்கள்’ என்ற உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
