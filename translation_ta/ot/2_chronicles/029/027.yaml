base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
translation:
  language: ta
  text: பின்பு எசேக்கியா, தகனபலியைப் பலிபீடத்தின்மேல் செலுத்தும்படி கட்டளையிட்டான்.[a] தகனபலி தொடங்கிய நேரத்தில், எக்காளங்களுடனும் இஸ்ரவேலின் அரசனான தாவீதின் இசைக்கருவிகளின் துணையுடனும் யாவேயின் பாடல்[b] தொடங்கியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “தகனபலியைச் செலுத்தும்படி சொன்னான்.”'
    reason: மூல வினையான וַיֹּאמֶר என்பதன் சொற்சார்ந்த மாற்று மொழிபெயர்ப்பு.
  - marker: b
    text: 'அல்லது, “யாவேக்குப் பாடிய பாடல்.” எபிரெயத்தில் சொல்லுக்குச் சொல்: “யாவேயின் பாடல்.”'
    reason: שִׁיר יְהוָה என்ற உடைமைத் தொகையின் திசைநோக்குப் பொருளை மாற்று வாசிப்பாகப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: செலுத்தும்படி கட்டளையிட்டான்
  rationale: אָמַר என்பதன் அடிப்படைப் பொருள் ‘சொன்னான்’ என்றாலும், இங்கு לְ־ உடன் வரும் வினையெச்ச அமைப்பு அரசனின் ஆணையை வெளிப்படுத்துகிறது. ‘செலுத்தும்படி கட்டளையிட்டான்’ என்பது அந்தத் தொடரின் இயல்பான தமிழ்ப் பொருளைத் தருகிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் עֹלָה பலிக்கான வழக்கமான, சுருக்கமான தமிழ்ச் சொல்.
- source_word: לַמִּזְבֵּחַ
  choice: பலிபீடத்தின்மேல்
  rationale: பலியின் இடத்தைக் குறிக்கும் לְ־ முன்னொட்டின் சூழல்சார் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּבְעֵת הֵחֵל ... הֵחֵל
  choice: தொடங்கிய நேரத்தில் ... தொடங்கியது
  rationale: எபிரெய மூலத்தில் ஒரே வினை மீண்டும் வருவதால் உருவாகும் ஒருங்கிணைப்பைத் தமிழிலும் ‘தொடங்கு’ என்பதை மீண்டும் பயன்படுத்திப் பாதுகாக்கிறது.
- source_word: שִׁיר יְהוָה
  choice: யாவேயின் பாடல்
  rationale: மூலத்தின் உடைமைத் தொகை அமைப்பை அப்படியே காக்கிறது; பாடல் யாவேக்கு உரியது, அவருக்குச் செலுத்தப்பட்டது, அல்லது அவரைப் பற்றியது என்பவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַחֲצֹצְרוֹת
  choice: எக்காளங்கள்
  rationale: வழிபாட்டில் பயன்படுத்தப்பட்ட உலோக ஊதுகருவிகளைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்; மூலத்தில் இல்லாத ‘வெள்ளி’ என்ற விவரத்தைச் சேர்க்கவில்லை.
- source_word: וְעַל יְדֵי כְּלֵי דָּוִיד
  choice: தாவீதின் இசைக்கருவிகளின் மூலமாகவும்
  rationale: עַל־יְדֵי என்பதன் கருவிசார் பொருளையும், வழிபாட்டுச் சூழலில் כְּלֵי என்பது இசைக்கருவிகளைக் குறிக்கிறது என்பதையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனான
  rationale: தாவீதின் அரசப் பட்டத்தைத் தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட இறைப்பெயரே உள்ளது. ஆகவே அதனைப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: שִׁיר יְהוָה என்பதன் உறவு
  choice: யாவேயின் பாடல்
  alternative: யாவேக்குப் பாடிய பாடல்
  rationale: எபிரெய உடைமைத் தொகை பாடலின் உரிமை, பொருள் அல்லது நோக்கம் ஆகியவற்றில் எதைச் சுட்டுகிறது என்பது வெளிப்படையாகத் தீர்மானிக்கப்படவில்லை. முதன்மை உரை அந்தப் பதற்றத்தைப் பாதுகாக்கிறது; சூழலுக்குப் பொருந்தும் திசைநோக்குப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: וַיֹּאמֶר ... לְהַעֲלוֹת தொடரின் கட்டளை வலிமை
  choice: செலுத்தும்படி கட்டளையிட்டான்
  alternative: செலுத்தும்படி சொன்னான்
  rationale: אָמַר தனியாக ‘சொல்’ என்றாலும், இங்குள்ள அரச ஆணைச் சூழலும் לְ־ வினையெச்சத் தொடரும் உத்தரவுப் பொருளைத் தருகின்றன. மாற்று மொழிபெயர்ப்பு மூல வினைக்கு இன்னும் சொற்சார்பானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் மரியாதைமிக்க வரலாற்று-வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘தகனபலி’, ‘பலிபீடம்’, ‘எக்காளம்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் காக்கப்பட்டுள்ளன; வாக்கிய அமைப்பு மட்டும் இயல்பான தமிழுக்கேற்ப ஒழுங்குபடுத்தப்பட்டுள்ளது.
