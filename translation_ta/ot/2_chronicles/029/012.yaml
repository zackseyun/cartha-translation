  text: וַ/יָּקֻ֣מוּ הַ֠/לְוִיִּם מַ֣חַת בֶּן עֲמָשַׂ֞י וְ/יוֹאֵ֣ל בֶּן עֲזַרְיָהוּ֮ מִן בְּנֵ֣י הַ/קְּהָתִי֒ וּ/מִן בְּנֵ֣י מְרָרִ֔י קִ֚ישׁ בֶּן עַבְדִּ֔י וַ/עֲזַרְיָ֖הוּ בֶּן יְהַלֶּלְאֵ֑ל וּ/מִן הַ/גֵּ֣רְשֻׁנִּ֔י יוֹאָח֙ בֶּן זִמָּ֔ה וְ/עֵ֖דֶן בֶּן יוֹאָֽח־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
translation:
  language: ta
  text: 'அப்போது லேவியர்கள் எழுந்தனர்: கோகாத்தியரின் சந்ததியாரில் அமாசாயின் மகன் மாகாத்தும், அசரியாவின் மகன் யோவேலும்; மெராரியரின் சந்ததியாரில் அப்தியின் மகன் கீஷும், யெகல்லெலேலின் மகன் அசரியாவும்; கெர்சோனியரில்[a] சிம்மாவின் மகன் யோவாவும், யோவாவின் மகன் ஏதேன் என்பவரும் இருந்தனர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கெர்சோனின் வழிவந்தவர்களில்.” இங்கு எபிரெய உரை முந்தைய சொற்றொடரை அப்படியே மீண்டும் கூறாமல் குலப்பெயரைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: எழுந்தார்கள்
  rationale: קום என்பதன் தொடர்கதை வடிவம், அரசனின் கட்டளைக்குப் பதிலளித்து நடவடிக்கையைத் தொடங்கியதைச் சுட்டுகிறது; ‘எழுந்தார்கள்’ என்பது இயல்பாகவும் மூலத்தின் வடிவுணர்வைக் காக்கும் வகையிலும் உள்ளது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி குலத்தைச் சேர்ந்தவர்களுக்கான வழக்கமான, தெளிவான தமிழ்ப் பெயர்.
- source_word: מִן בְּנֵי הַקְּהָתִי
  choice: கோகாத்தியரின் வழிவந்தவர்களில்
  rationale: சொல்லுக்கு சொல் ‘கோகாத்தியரின் மகன்களில்’; இங்கு குலவழியைச் சுட்டுவதால், இயல்பான தமிழில் ‘வழிவந்தவர்களில்’ என வழங்கப்பட்டது.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: மெராரியின் வழிவந்தவர்களில்
  rationale: மெராரி குலத்தைச் சேர்ந்த பிரதிநிதிகளை அடையாளப்படுத்தும் வம்சவழிச் சொல்லமைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּמִן הַגֵּרְשֻׁנִּי
  choice: கெர்சோனியரில்
  rationale: எபிரெயத்தில் ஒருமை வடிவக் குலப்பெயர் தொகுதியாகப் பயன்படுத்தப்பட்டுள்ளது; தமிழில் பன்மைக் குலப்பெயராக இயல்பாக வழங்கப்பட்டது.
- source_word: בֶּן
  choice: மகன்
  rationale: இந்த வம்சப் பட்டியலில் நேரடியான தந்தை–மகன் உறவுக்கான இயல்பான மொழிபெயர்ப்பு; ‘வழித்தோன்றல்’ என விரிவாக்கத் தேவையான சூழல் இல்லை.
- source_word: מַחַת; עֲמָשַׂי; יוֹאֵל; עֲזַרְיָהוּ; קִישׁ; עַבְדִּי; יְהַלֶּלְאֵל; יוֹאָח; זִמָּה; עֵדֶן
  choice: மாகாத்; அமாசாய்; யோவேல்; அசரியா; கீஸ்; அப்தி; யெகல்லெலெயேல்; யோவாக்; சிம்மா; ஏதேன்
  rationale: தனிப்பட்ட பெயர்கள் மொழிபெயர்க்கப்படாமல் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுத்துப்பெயர்க்கப்பட்டன; உரையில் தமிழ் வேற்றுமை உருபுகளுக்கு ஏற்ப இறுதி ஒலிகள் இயல்பாக இணைக்கப்பட்டன.
