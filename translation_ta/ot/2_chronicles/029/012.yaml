- from: 'அப்போது லேவியர்கள் எழுந்தார்கள்: கோகாத்தியரின் வழிவந்தவர்களில் அமாசாயின் மகன் மாகாத்தும் அசரியாவின் மகன் யோவேலும்; மெராரியின் வழிவந்தவர்களில் அப்தியின் மகன் கீசும் யெகல்லெலெயேலின் மகன் அசரியாவும்; கெர்சோனியரில்[a] சிம்மாவின் மகன் யோவாகும் யோவாகின் மகன் ஏதேனும் எழுந்தார்கள்.'
  to: 'அப்போது லேவியர்கள் எழுந்தனர்: கோகாத்தியரின் சந்ததியாரில் அமாசாயின் மகன் மாகாத்தும், அசரியாவின் மகன் யோவேலும்; மெராரியரின் சந்ததியாரில் அப்தியின் மகன் கீஷும், யெகல்லெலேலின் மகன் அசரியாவும்; கெர்சோனியரில்[a] சிம்மாவின் மகன் யோவாவும், யோவாவின் மகன் ஏதேன் என்பவரும் இருந்தனர்.'
