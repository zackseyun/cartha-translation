  source_fidelity: மூல எபிரெய உரையின் மூன்று லேவியக் குலங்களும், ஒவ்வொன்றிலுமுள்ள இரு நபர்களும் சரியாகப் பட்டியலிடப்பட வேண்டும். வரைவில் இறுதியில் ‘எழுந்தார்கள்’ மீண்டும் சேர்க்கப்பட்டிருப்பது மூலத்தில் இல்லாத மறுமொழியாகும். மேலும் யோவா, ஏதேன், யெகல்லெலேல் ஆகிய பெயர்களின் வடிவங்களும், ‘ஏதேனும்’ என்ற பெயர்/இணைப்புச்சொல் குழப்பமும் திருத்தப்பட வேண்டும்.
  naturalness: திருத்தப்பட்ட உரை நவீனத் தரத் தமிழில் வம்சவரிசைப் பட்டியலுக்கேற்ற தெளிவான நடையைப் பயன்படுத்துகிறது. ‘சந்ததியாரில்’ என்பது ‘மகன்களில்’ என்ற எபிரெய வம்சவழி மரபுத்தொடரின் பொருளை இயல்பாக வெளிப்படுத்துகிறது. பட்டியலின் கடைசிப் பெயருக்குப் பின் ‘என்பவரும்’ சேர்ப்பது ஏதேன் என்ற பெயரை ‘ஏதேனும்’ எனப் பொருள்படும் சொல்லிலிருந்து வேறுபடுத்துகிறது.
  terminology: '‘லேவியர்கள்’, ‘கோகாத்தியர்’, ‘மெராரியர்’, ‘கெர்சோனியர்’ ஆகிய குலப்பெயர்கள் பொருத்தமானவை. பெயர்கள் மூல ஒலிவடிவத்திற்கு நெருக்கமாகச் சீரமைக்கப்பட்டுள்ளன: மாகாத், அமாசாய், யோவேல், அசரியா, கீஷ், யெகல்லெலேல், யோவா, சிம்மா, ஏதேன். கெர்சோனியர் என்பதற்கான மாற்றுவடிவக் குறிப்பின் குறியீடு உரையுடன் ஒத்துள்ளது.'
