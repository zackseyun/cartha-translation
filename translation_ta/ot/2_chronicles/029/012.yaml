translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. எபிரெய வம்சவழிச் சொற்றொடர்களின் பொருள் காக்கப்பட்டு, தமிழில் இயல்பற்ற ‘மகன்களில்’ என்பதற்குப் பதிலாக ‘வழிவந்தவர்களில்’ பயன்படுத்தப்பட்டது. நீண்ட பட்டியலின் அமைப்பை அரைப்புள்ளிகளால் தெளிவுபடுத்தி, தொடக்க வினைச்சொல் இறுதியிலும் மீண்டும் கூறப்பட்டது.
