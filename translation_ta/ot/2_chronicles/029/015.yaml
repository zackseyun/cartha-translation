source:
  edition: WLC
  text: וַ/יַּֽאַסְפ֤וּ אֶת אֲחֵי/הֶם֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבֹ֥אוּ כְ/מִצְוַת הַ/מֶּ֖לֶךְ בְּ/דִבְרֵ֣י יְהוָ֑ה לְ/טַהֵ֖ר בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/015.yaml
  text: They gathered their brothers[a], consecrated themselves, and came, according to the command of the king by the words of Yahweh[c][b], to cleanse the house of Yahweh.
translation:
  language: ta
  text: அவர்கள் தங்கள் சகோதரர்களை ஒன்றுகூட்டி, தங்களைப் பரிசுத்தப்படுத்திக்கொண்டு, யாவேவின் வார்த்தைகளின்படி அமைந்த அரசனின் கட்டளைக்கேற்ப, யாவேவின் ஆலயத்தைத் தூய்மைப்படுத்த வந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொற்றொடரை, “அரசனின் கட்டளையின்படியும் யாவேவின் வார்த்தைகளின்படியும்” என்றும் புரிந்துகொள்ளலாம்.
    reason: மூல மொழியில் בְּדִבְרֵי יְהוָה என்ற சொற்றொடர் அரசனின் கட்டளையுடன் எவ்வாறு இணைகிறது என்பதில் உள்ள உண்மையான தொடரமைப்பு மாற்றுவாய்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיַּאַסְפוּ אֶת־אֲחֵיהֶם
  choice: அவர்கள் தங்கள் சகோதரர்களைக் கூட்டிச் சேர்த்து
  rationale: אָסַף என்பதன் ‘கூட்டுதல்’ என்ற செயற்பொருளையும், אֲחֵיהֶם என்பதன் ஆண்பால் உறவுமுறைச் சொல்லான ‘அவர்களுடைய சகோதரர்கள்’ என்பதையும் காக்கிறது; சூழலில் இவர்கள் சக லேவியர்கள் என்றாலும் அதை முதன்மை உரையில் விளக்கமாகச் சேர்க்கவில்லை.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: தங்களைப் பரிசுத்தப்படுத்திக்கொண்டு
  rationale: ஹித்பயேல் வடிவம் புனிதப் பணிக்காகத் தங்களை ஆயத்தப்படுத்தும் சடங்குசார் பரிசுத்தப்படுத்துதலைக் குறிக்கிறது.
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: வினையின் அடிப்படைப் பொருளான ‘வந்தார்கள்’ என்பதைக் காக்கிறது; ‘உள்ளே நுழைந்தார்கள்’ என்ற குறிப்பிடப்படாத கருத்தைச் சேர்க்கவில்லை.
- source_word: כְמִצְוַת הַמֶּלֶךְ בְּדִבְרֵי יְהוָה
  choice: யாவேவின் வார்த்தைகளின்படி அமைந்த அரசனின் கட்டளைக்கேற்ப
  rationale: அரசனின் கட்டளைக்கும் யாவேவின் வார்த்தைகளுக்கும் உள்ள தொடர்பை இயல்பான தமிழில் காட்டுகிறது; בְּדִבְרֵי என்பதன் பன்மையையும் காக்கிறது, அதேவேளை எபிரெயச் சொற்றொடரின் இணைப்பில் உள்ள சிறிய தெளிவின்மையை அடிக்குறிப்பில் பதிவு செய்கிறது.
- source_word: לְטַהֵר
  choice: தூய்மைப்படுத்த
  rationale: ஆலயச் சூழலில் பியேல் வடிவம் சடங்குசார் தூய்மைப்படுத்துதலைக் குறிக்கிறது; நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: בֵּית יְהוָה
  choice: யாவேவின் ஆலயம்
  rationale: சொல்லெழுத்தாக ‘யாவேவின் வீடு’ என்றாலும், இச்சூழலில் குறிக்கப்படுவது ஆலயம் என்பதால் இயல்பான, தெளிவான தமிழாக்கம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துகிறது; ஆகவே பெயர் ஒலிபெயர்க்கப்படுகிறது.
- issue: בְּדִבְרֵי יְהוָה என்பது அரசனின் கட்டளையுடன் கொண்டுள்ள தொடர்பு
  choice: யாவேவின் வார்த்தைகளின்படி அமைந்த அரசனின் கட்டளை
  alternative: அரசனின் கட்டளையின்படியும் யாவேவின் வார்த்தைகளின்படியும்
  rationale: எபிரெய வரிசை, அரசனின் கட்டளை யாவேவின் வார்த்தைகளால் வழிநடத்தப்பட்டது அல்லது அவற்றுக்கு இணங்கியது என இயல்பாகப் புரியவைக்கிறது. இருப்பினும் தொடரமைப்பின் மாற்று இணைப்பு சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதானதாயும் ஆலயச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘சகோதரர்கள்’ என்ற மூலத்தின் ஆண்பால் உறவுமுறைச் சொல் காக்கப்பட்டது; ‘ஆலயம்’ என்பது சொல்லெழுத்தான ‘வீடு’ என்பதற்கான சூழல்சார் இயல்பான தமிழ்.
