  text: וַ/יָּב֤וֹאוּ פְנִ֨ימָה֙ אֶל חִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/יֹּ֣אמְר֔וּ טִהַ֖רְנוּ אֶת כָּל בֵּ֣ית יְהוָ֑ה אֶת מִזְבַּ֤ח הָ/עוֹלָה֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת שֻׁלְחַ֥ן הַֽ/מַּעֲרֶ֖כֶת וְ/אֶת כָּל כֵּלָֽי/ו־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
translation:
  language: ta
  text: பின்னர் அவர்கள் எசேக்கியா அரசனிடம் உள்ளே சென்று, “யாவேயின் ஆலயம் முழுவதையும், தகனபலிப் பீடத்தையும் அதன் எல்லா உபகரணங்களையும், வரிசையாக அடுக்குவதற்கான மேசையையும்[a] அதன் எல்லா உபகரணங்களையும் தூய்மைப்படுத்திவிட்டோம்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமுகத்து அப்பங்களின் மேசை”; அதாவது, யாவேக்கு முன்பாக வரிசையாக அடுக்கப்பட்ட அப்பங்களுக்கான மேசை.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנִימָה
  choice: உள்ளே சென்று
  rationale: இந்த வினையடை உள்நோக்கிய நகர்வைக் குறிக்கிறது. அரசனிடம் அறிக்கை செய்ய அவர்கள் உள்ளே சென்றதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: טִהַרְנוּ
  choice: தூய்மைப்படுத்திவிட்டோம்
  rationale: ஆலயச் சூழலில் சடங்குமுறைத் தூய்மைப்படுத்துதலைக் குறிக்கிறது; முடிவுற்ற பணியின் தற்போதைய விளைவையும் ‘விட்டோம்’ வெளிப்படுத்துகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: எபிரெய மொழியில் சொற்பட ‘யாவேயின் வீடு’ என்றாலும், இச்சூழலில் ‘ஆலயம்’ என்பது சாதாரண வாசகருக்குத் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புச் சொல்லால் மாற்றாமல், எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מִזְבַּח הָעוֹלָה
  choice: தகனபலிப் பீடம்
  rationale: முழுவதும் எரிக்கப்படும் பலிக்குரிய பீடத்தைக் குறிக்கும் வழிபாட்டுச் சொல்லைச் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: כֵּלָיו
  choice: அதன் எல்லா உபகரணங்கள்
  rationale: ஆலய வழிபாட்டில் பயன்படுத்தப்பட்ட பாத்திரங்கள் மற்றும் பிற சாதனங்கள் அனைத்தையும் உள்ளடக்கும் பரந்த தமிழ்ச் சொல்.
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: வரிசையாக அடுக்குவதற்கான மேசை
  rationale: מַעֲרֶכֶת என்பதிலுள்ள ஒழுங்காக அல்லது வரிசையாக அடுக்குதல் என்ற கருத்தைப் பாதுகாக்கிறது; மூலத்தில் நேரடியாக இல்லாத ‘அப்பம்’ என்பதை முதன்மை உரையில் சேர்க்காமல் விடுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: இங்கு பொதுப்பட்டம் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரே நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: שֻׁלְחַן הַמַּעֲרֶכֶת என்பதன் மறைமுகமான பொருள்
  choice: வரிசையாக அடுக்குவதற்கான மேசை
  alternative: சமுகத்து அப்பங்களின் மேசை
  rationale: எபிரெய உரை ‘அடுக்குதல்/வரிசை’ என்பதைக் கூறுகிறது; அடுக்கப்பட்டவை அப்பங்கள் என்பது ஆலயச் சூழலால் விளங்கினாலும் இச்சொற்றொடரில் வெளிப்படையாக இல்லை. முதன்மை உரை அந்தச் சுருக்கத்தைக் காக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான ஆலயச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மூலத்தின் பட்டியல் அமைப்பும் நிறைவுற்ற தூய்மைப்படுத்தும் பணியை அறிவிக்கும் தொனியும் காக்கப்பட்டுள்ளன.
