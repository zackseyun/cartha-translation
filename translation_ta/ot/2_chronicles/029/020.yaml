reference: 2 Chronicles 29:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּם֙ יְחִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/יֶּאֱסֹ֕ף אֵ֖ת שָׂרֵ֣י הָ/עִ֑יר וַ/יַּ֖עַל בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/020.yaml
  text: Then King Hezekiah rose early[a], gathered the officials of the city, and went up to the house of Yahweh.
translation:
  language: ta
  text: பின்பு அரசனாகிய எசேக்கியா அதிகாலையில் எழுந்து, நகரத்தின் அதிகாரிகளை ஒன்றுகூட்டி, யாவேயின் ஆலயத்திற்குச் சென்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “யாவேயின் வீடு”; “சென்றார்” என்பதற்கான வினைச்சொல் சொற்பட “மேலே சென்றார்” என்று பொருள்படும்.
    reason: ‘யாவேயின் வீடு’ என்ற மூல உருவகத்தையும், ஆலயத்தை நோக்கிய இயக்கத்தில் உள்ள ‘மேலே செல்’ என்ற நுட்பத்தையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் ஹிஃபில் வடிவம் அதிகாலையில் எழுவதையோ ஒரு செயலைக் காலையிலேயே தொடங்குவதையோ குறிக்கிறது; இத்தமிழாக்கம் அதன் காலநுட்பத்தை இயல்பாகக் காக்கிறது.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: எசேக்கியா அரசர்
  rationale: எபிரெயப் பெயர் வழக்கமான தமிழ்ச் சீரில் ஒலிபெயர்க்கப்பட்டு, பட்டப்பெயர் இயல்பான தமிழ்ச் சொல் வரிசையில் அமைக்கப்பட்டுள்ளது.
- source_word: וַיֶּאֱסֹף
  choice: ஒன்றுகூட்டி
  rationale: אָסַף இங்கு மக்களை ஒரே இடத்தில் கூட்டுவதைக் குறிக்கிறது; ‘ஒன்றுகூட்டி’ என்பது சூழலுக்கு ஏற்ற தெளிவான நவீனத் தமிழ்.
- source_word: אֵת שָׂרֵי הָעִיר
  choice: நகரத்தின் அதிகாரிகளை
  rationale: שָׂרִים என்பது இச்சூழலில் பரம்பரை இளவரசர்களைவிட நகர நிர்வாகத் தலைவர்களையோ அதிகாரிகளையோ குறிக்கிறது.
- source_word: וַיַּעַל
  choice: சென்றார்
  rationale: עָלָה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்’ என்றாலும், தமிழில் ஆலயத்திற்குச் செல்லும் இயக்கத்தை ‘மேலே சென்றார்’ எனக் கூறுவது இங்கு செயற்கையாக இருக்கும்; இலக்கு தெளிவாக இருப்பதால் இயல்பான ‘சென்றார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: בַּיִת என்பதன் சொற்பொருள் ‘வீடு’; ஆனால் இந்தச் சூழலில் அது ஆலயத்தைக் குறிக்கிறது. יְהוָה என்ற தனிப்பெயர் தமிழில் நிலைபெற்ற ‘யெகோவா’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கெழுத்து இறைப் பெயரே நேரடியாக உள்ளது. அதை மறைக்காமல் தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்குவது மூல வேறுபாட்டைக் காக்கிறது.
- issue: בֵּית יְהוָה என்பதன் உருவகம்
  choice: யெகோவாவின் ஆலயம்
  alternative: யெகோவாவின் வீடு
  rationale: ‘வீடு’ என்பது வடிவரீதியான மொழிபெயர்ப்பு; இங்கு குறிக்கப்படுவது எருசலேம் ஆலயம் என்பதால், சாதாரண வாசகருக்கு தெளிவான ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது. சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. தொடர்ச்சியான எபிரெயக் கதைநடையை ‘பின்பு’ என்பதன் மூலம் சுருக்கமாக வெளிப்படுத்தி, நிர்வாகச் சூழலில் שָׂרִים என்பதற்கு ‘அதிகாரிகள்’ பயன்படுத்தப்பட்டுள்ளது.
