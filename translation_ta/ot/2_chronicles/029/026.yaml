source:
  edition: WLC
  text: וַ/יַּֽעַמְד֤וּ הַ/לְוִיִּם֙ בִּ/כְלֵ֣י דָוִ֔יד וְ/הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְרֽוֹת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/026.yaml
  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
translation:
  language: ta
  text: அப்போது லேவியர்கள் தாவீதின் இசைக்கருவிகளுடன்[a] நின்றார்கள்; ஆசாரியர்கள் எக்காளங்களுடன்[b] நின்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதுக்குரிய இசைக்கருவிகளுடன்.” எபிரெயச் சொற்றொடர் தாவீதுக்குச் சொந்தமான, அவரால் ஏற்பாடு செய்யப்பட்ட, அல்லது அவருடன் தொடர்புடைய இசைக்கருவிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இவை ஆசாரியர்கள் வழிபாட்டில் பயன்படுத்திய எக்காளங்கள். வேறு சில இடங்களில் அவை வெள்ளியால் செய்யப்பட்டவை என்று குறிப்பிடப்பட்டாலும், அந்த விவரம் இவ்வசனத்தில் இல்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: அப்போது ... நின்றார்கள்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வின் அடுத்த கட்டத்தை முன்னெடுப்பதால் ‘அப்போது’ என்று இயல்பாகக் காட்டப்பட்டுள்ளது; עמד என்பதன் அடிப்படைப் பொருளான ‘நிற்றல்/நிலைகொள்ளுதல்’ பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தைச் சேர்ந்த ஆலயப் பணியாளர்களைக் குறிக்கும் வழக்கமான தமிழ்ச் சொல்; எபிரெயக் குறிப்புப்பெயர்ச்சொல்லின் திட்டத்தன்மை சூழலால் தெளிவாகிறது.
- source_word: בִּכְלֵי דָוִיד
  choice: தாவீதின் இசைக்கருவிகளுடன்
  rationale: כְּלִי என்பது பொதுவாகக் கருவி அல்லது பொருள் எனப் பொருள்படலாம்; ஆலய இசைச் சூழலில் ‘இசைக்கருவிகள்’ என்பது தெளிவான இயல்பான தெரிவு. தாவீதுடனான உரிமை, ஏற்பாடு அல்லது தொடர்பு ஆகியவற்றில் எது குறிக்கப்படுகிறது என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
- source_word: וְהַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலய வழிபாட்டுப் பணியை நிறைவேற்றும் כֹּהֲנִים என்பதற்கான நிலைபெற்ற தமிழ் வழக்கு. இணைப்புச் சொல் தமிழில் அரைப்புள்ளியால் இயல்பாக வெளிப்படுகிறது.
- source_word: בַּחֲצֹצְרוֹת
  choice: எக்காளங்களுடன்
  rationale: חֲצֹצְרוֹת என்பது ஆசாரியர்கள் பயன்படுத்திய வழிபாட்டு எக்காளங்களைக் குறிக்கிறது. இவ்வசனத்தில் ‘வெள்ளி’ என்று கூறப்படாததால் அந்த விவரம் சேர்க்கப்படவில்லை.
