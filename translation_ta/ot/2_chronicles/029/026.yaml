translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் சுருக்கமான இணை அமைப்பைத் தக்கவைத்தபோதும், தமிழில் இரு குழுக்களின் நிலைப்பாட்டைத் தெளிவாக்க இரண்டாம் பகுதியில் ‘நின்றார்கள்’ மீண்டும் வழங்கப்பட்டுள்ளது.
