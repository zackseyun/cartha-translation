base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/028.yaml
  text: And all the assembly was bowing down[a], while the song was being sung and the trumpets were sounding—all this continued until the burnt offering was finished.
translation:
  language: ta
  text: கூடியிருந்த மக்கள் அனைவரும் பணிந்து வணங்கிக்கொண்டிருந்தார்கள்; பாடல் ஒலித்துக்கொண்டும், எக்காளங்கள் முழங்கிக்கொண்டும் இருந்தன. தகனபலி முடியும் வரை இவை அனைத்தும் தொடர்ந்தன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָּהָל
  choice: கூடியிருந்த மக்கள்
  rationale: வழிபாட்டிற்காக ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபை’ என்பதால் ஏற்படக்கூடிய பிற்கால சமய அமைப்புச் சாயலைத் தவிர்த்து, கூடியிருந்த மக்களைக் இயல்பாகக் குறிப்பிடுகிறது.
- source_word: מִשְׁתַּחֲוִים
  choice: பணிந்து வணங்கிக்கொண்டிருந்தார்கள்
  rationale: தொடர்ச்சியாக நடைபெற்ற உடல்சார்ந்த பணிவையும் வணக்கத்தையும் வெளிப்படுத்துகிறது; வெறுமனே ‘வழிபட்டார்கள்’ என்று கூறி உடல் செயலை மறைக்கவில்லை.
- source_word: הַשִּׁיר מְשׁוֹרֵר
  choice: பாடல் பாடப்பட்டுக்கொண்டும்
  rationale: எபிரெயச் சொற்றொடரின் எழுவாய் ‘பாடல்’ என்பதைக் காக்கிறது; தமிழில் இயல்பாக இருக்க வினை செயப்பாட்டு வடிவில் தரப்படுகிறது.
- source_word: חֲצֹצְרוֹת מחצצרים
  choice: எக்காளங்கள் முழங்கிக்கொண்டும் இருந்தன
  rationale: வழிபாட்டில் பயன்படுத்தப்பட்ட நேரான உலோக ஊதுகருவிகளையும் அவற்றின் தொடர்ச்சியான ஒலியையும் இயல்பான தமிழில் தருகிறது; இவ்வசனத்தில் வெளிப்படையாக இல்லாத ‘வெள்ளி’ சேர்க்கப்படவில்லை.
- source_word: הַכֹּל
  choice: இவையெல்லாம்
  rationale: முன்பு கூறப்பட்ட வணக்கம், பாடல், எக்காள முழக்கம் ஆகிய செயல்கள் அனைத்தையும் தொகுத்துச் சுட்டுகிறது.
- source_word: עַד לִכְלוֹת הָעֹלָה
  choice: தகனபலி முடியும் வரை
  rationale: தொடர்ந்த செயல்களின் முடிவெல்லையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; עֹלָה என்பதற்கான வழக்கமான பலியியல் சொல்லாக ‘தகனபலி’ பயன்படுத்தப்படுகிறது.
