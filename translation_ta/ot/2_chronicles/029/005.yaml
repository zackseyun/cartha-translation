source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם שְׁמָע֣וּ/נִי הַ/לְוִיִּ֑ם עַתָּ֣ה הִֽתְקַדְּשׁ֗וּ וְ/קַדְּשׁוּ֙ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבֹתֵי/כֶ֔ם וְ/הוֹצִ֥יאוּ אֶת הַ/נִּדָּ֖ה מִן הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/005.yaml
  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
translation:
  language: ta
  text: அவர் அவர்களிடம், “லேவியர்களே, எனக்குச் செவிகொடுங்கள். இப்போது உங்களைப் பரிசுத்தப்படுத்திக்கொள்ளுங்கள்; உங்கள் தந்தையரின் இறைவனாகிய யாவேயின் ஆலயத்தையும் பரிசுத்தப்படுத்துங்கள்; பரிசுத்த இடத்திலிருந்து[b] தீட்டை[a] அகற்றுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசுத்தத்தை” அல்லது “மாசுபடுத்தும் பொருளை”; எபிரெயச் சொல் பரிசுத்த இடத்தைத் தீட்டுப்படுத்துவதை அல்லது அத்தகைய பொருளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆலயத்திலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעוּנִי
  choice: எனக்குச் செவிகொடுங்கள்
  rationale: கட்டளையின் நேரடியான அழைப்பையும் கவனத்துடன் கேட்க வேண்டும் என்ற பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்களே
  rationale: நேரடி விளிப்பைத் தெளிவாகக் காட்டும் வழக்கமான தமிழ்ப் பெயர்ப்பு.
- source_word: עַתָּה
  choice: இப்போது
  rationale: உடனடியாகத் தொடங்க வேண்டிய செயலைக் குறிக்கும் எபிரெய கால வினையடையை மிகைப்படுத்தாமல் தருகிறது.
- source_word: הִתְקַדְּשׁוּ / וְקַדְּשׁוּ
  choice: உங்களைப் பரிசுத்தப்படுத்திக்கொள்ளுங்கள் / பரிசுத்தப்படுத்துங்கள்
  rationale: முதல் வினையின் தற்சுட்டுப் பொருளையும் இரு வினைகளிலும் உள்ள קדשׁ என்ற ஒரே வேரின் சொல்லிணைப்பையும் பாதுகாக்கிறது; ஆலயப் பணிக்கான சடங்குசார் ஆயத்தம் சூழலால் தெளிவாகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லுக்கு சொல் ‘யாவேயின் வீடு’ என்றாலும், இச்சூழலில் ஆலயத்தையே குறிப்பதால் நவீன வாசகருக்கு இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: உங்கள் தந்தையரின் இறைவன்
  rationale: எபிரெய உடன்படிக்கைச் சொல்லமைப்பை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: הַנִּדָּה
  choice: தீட்டு
  rationale: ஆலயத்தை மாசுபடுத்தும் சடங்குசார் அசுத்தத்தைச் சுருக்கமாகவும் சூழலுக்கு ஏற்றவாறும் குறிக்கிறது; பொருட்கழிவை மட்டும் குறிப்பதாகக் கட்டுப்படுத்தவில்லை.
- source_word: מִן הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்திலிருந்து
  rationale: קֹדֶשׁ இங்கு அருவமான பரிசுத்தத்தைக் காட்டிலும் புனிதமான இடத்தைக் குறிப்பதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றுக்கு நெருக்கமானது.
- issue: הַנִּדָּה என்பது அகற்றப்படும் பொருளா அல்லது சடங்குசார் மாசா
  choice: தீட்டு
  alternative: அசுத்தம்; அருவருப்பான பொருள்
  rationale: சொல் சடங்குசார் மாசையும் அதை உண்டாக்கும் அசுத்தமானவற்றையும் குறிக்கக்கூடும். ‘தீட்டு’ அந்தப் பொருள் பரப்பைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, மரியாதையும் வழிபாட்டுச் சூழலின் கண்ணியமும் கொண்ட நடை. ‘பரிசுத்தப்படுத்து’ என்ற ஒரே வினைச்சொல் இருமுறை பயன்படுத்தப்பட்டு எபிரெய மூலத்தின் சொல்லிணைப்பு பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்புக் குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகில் வைக்கப்பட்டுள்ளன.
