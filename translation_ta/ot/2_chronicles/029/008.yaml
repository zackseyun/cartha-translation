source:
  edition: WLC
  text: וַ/יְהִי֙ קֶ֣צֶף יְהוָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם וַ/יִּתְּנֵ֤/ם ל/זועה לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה כַּ/אֲשֶׁ֛ר אַתֶּ֥ם רֹאִ֖ים בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
translation:
  language: ta
  text: ஆகவே, யூதாவின்மீதும் எருசலேமின்மீதும் யாவேயின் கடுங்கோபம் வந்தது. நீங்கள் உங்கள் கண்களாலேயே காண்கிறபடி, அவர் அவற்றைத் திகிலூட்டும் பொருளாகவும்[a], பாழ்நிலையாகவும், ஏளன விசிலுக்கு இலக்காகவும்[b] ஆக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திகிலுக்குரிய ஒன்றாகவும்”; இச்சொல் நடுக்கத்தையோ திகிலையோ உண்டாக்கும் ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இகழ்ச்சியான சீளடிப்புக்கு இலக்காகவும்”; இங்கு விசில் அல்லது சீளொலி என்பது அழிவைக் காண்போரின் ஏளனமான எதிர்வினையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצֶף
  choice: கடுங்கோபம்
  rationale: சாதாரண கோபத்தைவிடத் தீவிரமான தெய்வீக சினத்தையும் நியாயத்தீர்ப்பின் வலிமையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதப் பெயரின் தனிப்பெயர்த் தன்மையைப் பேணும், நவீன தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு.
- source_word: וַיְהִי ... עַל
  choice: மீதும் ... கடுங்கோபம் வந்தது
  rationale: கோபம் யூதாவுக்கும் எருசலேமுக்கும் எதிராக வந்து செயல்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயக்கத்தைப் பேணுகிறது.
- source_word: וַיִּתְּנֵם
  choice: அவர் அவற்றை ... ஆக்கினார்
  rationale: ל முன்னொட்டுடன் வரும் விளைவு நிலைகளைத் தெளிவாக வெளிப்படுத்துகிறது; இங்குள்ள சுட்டுப்பெயர் யூதாவையும் எருசலேமையும் குறிக்கிறது.
- source_word: לְזוֹעָה
  choice: திகிலூட்டும் காட்சி
  rationale: பார்ப்போருக்கு நடுக்கம் அல்லது திகில் உண்டாக்கும் ஒன்றைச் சுட்டும் அரிய எபிரெயச் சொல்லின் காரணவிளைவை இயல்பான தமிழில் தருகிறது.
- source_word: לְשַׁמָּה
  choice: பாழிடம்
  rationale: அழிவினால் ஏற்பட்ட வெறுமையையும் பாழ்நிலையையும் சுருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: וְלִשְׁרֵקָה
  choice: ஏளனச் சீளொலிக்கு இலக்கு
  rationale: அழிவைக் காண்போர் இகழ்ச்சியுடன் எழுப்பும் சீளொலி என்ற உருவகத்தை அழிக்காமல் அதன் ஏளனப் பொருளையும் தெளிவாக்குகிறது.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  choice: நீங்கள் உங்கள் கண்களாலேயே காண்கிறபடி
  rationale: நேரில் காணப்படும் சான்றை வலியுறுத்தும் மூலமொழியின் அழுத்தத்தை ‘கண்களாலேயே’ என்பதன் மூலம் பேணுகிறது.
theological_decisions:
- issue: தெய்வீக நியாயத்தீர்ப்பின் கடுமையை மென்மைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: யாவேயின் கடுங்கோபம் வந்தது; அவர் அவற்றை ... ஆக்கினார்
  alternative: யாவே யூதாவின்மீதும் எருசலேமின்மீதும் கோபமடைந்து, அவற்றைக் கைவிட்டார்
  rationale: மூலவசனம் நியாயத்தீர்ப்பை நேரடியாக யாவேயின் கடுங்கோபத்துடனும் செயலுடனும் இணைக்கிறது. தேர்ந்த மொழியாக்கம் அந்த இறையியல் பதற்றத்தைப் பேணுகிறது; அதேவேளை மூலத்தில் இல்லாத ‘கைவிட்டார்’ போன்ற விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘திகிலூட்டும் காட்சி—பாழிடம்—ஏளனச் சீளொலிக்கு இலக்கு’ என்ற இணை அமைப்பு எபிரெய மூன்றடுக்கை இயன்றவரை இயல்பாகப் பேணுகிறது; ‘நீங்கள் உங்கள் கண்களாலேயே’ என்பது மூலத்தின் வலியுறுத்தலைக் காக்கிறது.
