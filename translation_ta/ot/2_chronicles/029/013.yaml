translation_notes:
  register: நவீனத் தரத் தமிழில், பெயர்ப்பட்டியலுக்கேற்ற சுருக்கமான மற்றும் மரியாதைமிக்க நடை. எபிரேயத்தின் இணை அமைப்பு இரு ‘…மகன்களில்’ தொடர்களாலும், ஒவ்வொரு பெயரிலுமுள்ள ‘-உம்’ இணைப்பாலும் வெளிப்படுத்தப்பட்டுள்ளது. ஆங்கில ஆலோசனை உரையில் குறிப்புக்குறி [b] ஆசாப்புக்குப் பின் தவறாக அமைந்திருந்ததால், அது விளக்கும் יעואל என்ற பெயருக்குப் பின் வைக்கப்பட்டது.
