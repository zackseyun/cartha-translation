source:
  edition: WLC
  text: וּ/מִן בְּנֵי֙ אֱלִ֣יצָפָ֔ן שִׁמְרִ֖י ו/יעואל וּ/מִן בְּנֵ֣י אָסָ֔ף זְכַרְיָ֖הוּ וּ/מַתַּנְיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/013.yaml
  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
translation:
  language: ta
  text: மேலும், எலிசாப்பானின் மகன்களில்[a] சிம்ரியும் யெஊவேலும்[b]; மேலும் ஆசாப்பின் மகன்களில் சகரியாவும் மத்தனியாவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘மகன்கள்’ என்பது நேரடி மகன்களை மட்டுமல்லாமல், வழித்தோன்றலையோ குலத்தைச் சேர்ந்தவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரேயப் பெயர் ‘யெஊவேல்’; வேறு இடங்களில் காணப்படும் ஒத்த பெயரான ‘யெயியேல்’ என்பதிலிருந்து இதன் எழுத்தமைப்பு வேறுபடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: …மகன்களில்
  rationale: וּמִן என்பதன் பட்டியல் சார்ந்த ‘மேலும் … இலிருந்து/…களில்’ என்ற பொருளைத் தமிழில் இயல்பான பட்டியல் நடையில் ‘…மகன்களில்’ எனக் கொடுக்கிறது; இணைப்பை அடுத்த பெயரிலுள்ள ‘-உம்’ தாங்குகிறது.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: எபிரேயச் சொல்லின் நேரடியான குடும்பவழிச் சொல்லைத் தக்கவைக்கிறது; இச்சூழலில் உடனடி மகன்களைவிட விரிந்த வழித்தோன்றல் அல்லது குல உறுப்பினர்களையும் குறிக்கக்கூடும் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: אֱלִיצָפָן
  choice: எலிசாப்பான்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: שִׁמְרִי
  choice: சிம்ரி
  rationale: எபிரேயத் தனிப்பெயரின் சுருக்கமான ஒலிவடிவத்தைப் பேணுகிறது.
- source_word: ו/יעואל
  choice: யெஊவேலும்
  rationale: மூல மெய்யெழுத்து வடிவமான יעואל-ஐ ‘யெஊவேல்’ எனப் பிரதிபலித்து, இணைப்புச் சொல்லைத் தமிழ் ‘-உம்’ மூலம் காட்டுகிறது; ‘யெகியேல்/Jeiel’ என்ற வேறுபட்ட பெயருடன் இதை ஒன்றாக்கவில்லை.
- source_word: בְּנֵי אָסָף
  choice: ஆசாப்பின் மகன்களில்
  rationale: ஆசாப் முன்னோராகவோ குழுத் தலைவராகவோ உள்ள குடும்ப/குலச் சொல்லமைப்பைப் பேணுகிறது.
- source_word: זְכַרְיָהוּ
  choice: சகரியா
  rationale: தமிழில் பரவலாக அறியப்படும் வடிவத்தைப் பயன்படுத்தி எபிரேயத் தனிப்பெயரை அளிக்கிறது.
- source_word: וּ/מַתַּנְיָהוּ
  choice: மத்தனியாவும்
  rationale: எபிரேயத் தனிப்பெயரைத் தமிழில் எழுத்துப்பெயர்த்து, וּ இணைப்பை ‘-உம்’ எனப் பேணுகிறது.
