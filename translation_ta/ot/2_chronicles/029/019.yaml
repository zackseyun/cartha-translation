source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל הַ/כֵּלִ֗ים אֲשֶׁ֣ר הִזְנִיחַ֩ הַ/מֶּ֨לֶךְ אָחָ֧ז בְּ/מַלְכוּת֛/וֹ בְּ/מַעֲל֖/וֹ הֵכַ֣נּוּ וְ/הִקְדָּ֑שְׁנוּ וְ/הִנָּ֕/ם לִ/פְנֵ֖י מִזְבַּ֥ח יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
translation:
  language: ta
  text: அரசன் ஆகாஸ் தன் ஆட்சிக்காலத்தில் தன் நம்பிக்கைத்துரோகத்தின்போது ஒதுக்கிவைத்த[a] ஆலயப் பொருள்கள் அனைத்தையும் நாங்கள் ஆயத்தப்படுத்திப் பரிசுத்தப்படுத்தினோம். இதோ, அவை யாவேயின் பலிபீடத்தின் முன் இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “கைவிட்ட” அல்லது “புறக்கணித்த.”'
    reason: הִזְנִיחַ என்பது ஒதுக்கிவைத்தல், கைவிடுதல், அல்லது புறக்கணித்தல் என்பவற்றைக் குறிக்கலாம்; இச்சூழலில் பயன்பாட்டிலிருந்து விலக்கிவைத்தல் என்ற நுணுக்கம் முதன்மையானது.
lexical_decisions:
- source_word: הַכֵּלִים
  choice: ஆலயப் பொருள்கள்
  rationale: כֵּלִים என்பது பாத்திரங்கள், கருவிகள், பயன்பாட்டுப் பொருள்கள் ஆகியவற்றை உள்ளடக்கும் பரந்த சொல். ஆலயச் சூழலில் ‘ஆலயப் பொருள்கள்’ என்பது அதன் பரப்பைச் சுருக்காமல் இயல்பாகத் தருகிறது.
- source_word: הִזְנִיחַ
  choice: புறக்கணித்திருந்த
  rationale: இந்த வினை ஒன்றைக் கைவிடுதல், ஒதுக்கிவைத்தல், கவனிக்காமல் விடுதல் ஆகிய நிழற்பொருள்களைக் கொண்டது. ஆகாஸ் ஆலயப் பொருள்களைப் பயன்பாட்டிலிருந்து ஒதுக்கிய செயலை ‘புறக்கணித்திருந்த’ தெளிவாகக் காட்டுகிறது.
- source_word: בְּמַלְכוּתוֹ
  choice: தன் ஆட்சிக்காலத்தில்
  rationale: இங்கு முன்னிடைச்சொல் காலப் பொருளில் வருவதால், நவீனத் தமிழில் இயல்பான காலக் குறிப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּמַעֲלוֹ
  choice: நம்பிக்கைத் துரோகம் செய்து
  rationale: מַעַל என்பது வெறும் தவறு அல்ல; கடவுளுக்கு எதிரான விசுவாச மீறல் அல்லது நம்பிக்கைத் துரோகத்தைச் சுட்டுகிறது. வாக்கியத்தில் இயல்பாக அமைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הֵכַנּוּ
  choice: நாங்கள் ஆயத்தப்படுத்தி
  rationale: הֵכִין என்பது தயார் செய்தல் அல்லது முறையாக அமைத்தல். பொருள்களை மீண்டும் ஆலயப் பயன்பாட்டுக்கு ஏற்றதாக்கிய செயலை ‘ஆயத்தப்படுத்தி’ தருகிறது.
- source_word: וְהִקְדָּשְׁנוּ
  choice: புனிதப்படுத்தியிருக்கிறோம்
  rationale: קדשׁ என்பதன் ஹிபீல் வடிவம் புனிதப் பயன்பாட்டுக்கென அர்ப்பணித்தல் அல்லது பிரித்துவைத்தலைக் குறிக்கிறது. ‘புனிதப்படுத்துதல்’ இவ்வாலயச் சூழலுக்கு ஏற்றது.
- source_word: וְהִנָּם
  choice: இதோ, அவை
  rationale: הִנֵּה கூறுபவர் சுட்டிக்காட்டும் வலிமையைக் கொண்டது. ‘இதோ’ அந்தக் கவன ஈர்ப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: யாவேவின் பலிபீடத்திற்கு முன்பாக
  rationale: לִפְנֵי என்பது இங்கு இடத்தைக் குறிக்கும் ‘முன்பாக’. יְהוָה தனிப்பட்ட இறைப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: בְּמַעֲלוֹ என்பதிலுள்ள உடன்படிக்கை சார்ந்த குற்றத்தின் தன்மை
  choice: நம்பிக்கைத் துரோகம் செய்து
  alternative: உண்மையற்றவனாய் நடந்து / குற்றஞ்செய்து
  rationale: எபிரெயச் சொல் சாதாரணக் குற்றத்தைவிட ஒப்படைக்கப்பட்ட நம்பிக்கையை மீறிய செயலை வலியுறுத்துகிறது; ஆனால் குறிப்பிட்ட கோட்பாட்டு விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப்பெயரை பொதுப் பட்டமாக மாற்றாமல், அதன் பரவலாக ஏற்கப்பட்ட ஒலிப்பைத் தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; ஆலயச் சூழலின் புனிதத்தன்மையும் மூலத்தின் ‘இதோ’ என்ற சுட்டுவலிமையும் பாதுகாக்கப்பட்டுள்ளன.
