base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/014.yaml
  text: 'And from the sons of Heman: Jehuel and Shimei[a]; and from the sons of Jeduthun: Shemaiah and Uzziel.'
translation:
  language: ta
  text: மேலும், ஹேமானின் மகன்களில் யெகூவேலும் சிமெயியும்; யெதுத்தூனின் மகன்களில் செமாயாவும் உசியேலும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: மகன்களில்
  rationale: இணைப்பிடைச்சொல்லுடன் வரும் מִן, முந்தைய பட்டியலின் தொடர்ச்சியாக ஒரு குடும்பக் குழுவிலிருந்து தேர்ந்தெடுக்கப்பட்டவர்களை அறிமுகப்படுத்துகிறது. தமிழில் பட்டியல் அமைப்பே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துவதால் தனியே ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: בְּנֵי
  choice: மகன்கள்
  rationale: குடும்ப அல்லது மரபுவழிக் குழுவை நேரடியாகக் குறிக்கும் எபிரேயச் சொல்லைத் தெளிவாகவும் மரபுவழித் தொடர்பை மறைக்காமலும் வழங்குகிறது.
- source_word: הֵימָן
  choice: ஏமான்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியமைப்புக்கு ஏற்ற தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: יחואל
  choice: யெகுவேல்
  rationale: கொடுக்கப்பட்ட மெய்யெழுத்து வடிவத்தை அடிப்படையாகக் கொண்ட தமிழ் எழுத்துப்பெயர்ப்பு; ஆங்கில மரபுவழி வடிவத்தை அப்படியே பின்பற்றவில்லை.
- source_word: וְשִׁמְעִי
  choice: சிமெயியும்
  rationale: தனிப்பெயரை எழுத்துப்பெயர்த்து, முன்னொட்டாக உள்ள இணைப்பைத் தமிழ் பட்டியல் அமைப்புக்கேற்ப ‘-உம்’ மூலம் காக்கிறது.
- source_word: יְדוּתוּן
  choice: எதுத்தூன்
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியமைப்பைப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: שְׁמַעְיָה
  choice: செமாயா
  rationale: எபிரேயத் தனிப்பெயரின் ஒலியமைப்பைப் பிரதிபலிக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: וְעֻזִּיאֵל
  choice: ஊசியேலும்
  rationale: தனிப்பெயரை எழுத்துப்பெயர்த்து, இறுதிப் பட்டியல் உறுப்பை இணைக்கும் வாவை ‘-உம்’ மூலம் வெளிப்படுத்துகிறது.
