translation_notes:
  register: சுருக்கமான வம்சப் பட்டியலின் இணை அமைப்பு காக்கப்பட்டுள்ளது. நவீன நிலையான தமிழில் இயல்பாக ஒலிக்க, ஒவ்வொரு பிரிவிலும் உள்ள பெயர்கள் ‘-உம்’ இணைப்பால் அமைக்கப்பட்டுள்ளன; மொழிநடை மரியாதையானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமாக உள்ளது.
