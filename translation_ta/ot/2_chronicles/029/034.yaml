base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
translation:
  language: ta
  text: ஆனால் ஆசாரியர்கள் எண்ணிக்கையில் போதுமானவர்களாக இல்லை; அதனால் எல்லாத் தகனபலிகளின் தோலையும் அவர்களால் உரிக்க முடியவில்லை. ஆகவே, வேலை முடியும் வரையிலும் ஆசாரியர்கள் தங்களைப் பரிசுத்தப்படுத்திக்கொள்ளும் வரையிலும், அவர்களுடைய சகோதரர்களான லேவியர்கள் அவர்களுக்கு உறுதுணையாக இருந்தார்கள்[a]. ஏனெனில், தங்களைப் பரிசுத்தப்படுத்திக்கொள்வதில் ஆசாரியர்களைவிட லேவியர்கள் உள்ளத்தில் அதிக நேர்மையுள்ளவர்களாக[b] இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல்லின் நேரடிப் பொருள், “அவர்களை வலுப்படுத்தினார்கள்”; இங்கு “அவர்களுக்கு உதவினார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அதிக முழு மனதுள்ளவர்களாக”; எபிரெயச் சொற்றொடர் உள்ளார்ந்த நேர்மையையோ உண்மையான மனப்பாங்கையையோ வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק הַכֹּהֲנִים הָיוּ לִמְעָט
  choice: ஆனால் ஆசாரியர்கள் எண்ணிக்கையில் போதுமானவர்களாக இல்லை
  rationale: רַק இங்கு முந்தைய சூழலுடன் வேறுபாட்டைக் காட்டுகிறது; לִמְעָט வெறும் ‘சிலர்’ என்பதல்ல, பணிக்குப் போதாத எண்ணிக்கையைக் குறிக்கிறது.
- source_word: לְהַפְשִׁיט
  choice: தோலை உரிக்க
  rationale: பலிக்குரிய விலங்குகளின் தோலை அகற்றுவதைத் தெளிவான நவீன தமிழில் கூறுகிறது.
- source_word: הָעֹלוֹת
  choice: தகனபலிகள்
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான வழக்கமான, சுருக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: וַיְחַזְּקוּם
  choice: அவர்களுக்கு உறுதுணையாக இருந்தார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வலுப்படுத்தினார்கள்’; இச்சூழலில் பணியை நிறைவேற்ற நடைமுறையாகத் துணைநின்றதைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: அவர்களுடைய சகோதரர்களான லேவியர்கள்
  rationale: ‘சகோதரர்கள்’ என்ற மூலத்தின் உறவுமுறைச் சொல்லைத் தக்கவைத்து, அது லேவியர்களைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது.
- source_word: עַד כְּלוֹת הַמְּלָאכָה
  choice: வேலை முடியும் வரையிலும்
  rationale: குறிப்பிட்ட பணி நிறைவடையும் வரையிலான கால அளவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִתְקַדְּשׁוּ / לְהִתְקַדֵּשׁ
  choice: தங்களைப் பரிசுத்தப்படுத்திக்கொள்ள
  rationale: ஆலயப் பணிக்குத் தேவையான சடங்குசார் தூய ஆயத்தத்தை குறிக்கிறது; ‘தங்களை’ என்ற தற்சுட்டுப் பொருளையும் காக்கிறது.
- source_word: יִשְׁרֵי לֵבָב
  choice: உள்ளத்தில் அதிக நேர்மையுள்ளவர்களாக
  rationale: ‘உள்ளத்தில் நேரானவர்கள்’ என்ற எபிரெய மரபுத்தொடரின் உள்நேர்மை/உண்மையான மனப்பாங்கைத் தக்கவைக்கிறது; מִן உருவாக்கும் ஒப்பீட்டையும் ‘அதிக’ என்பதால் வெளிப்படுத்துகிறது.
- source_word: מֵהַכֹּהֲנִים
  choice: ஆசாரியர்களைவிட
  rationale: מִן குறிக்கும் ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் தமிழில் தருகிறது.
theological_decisions:
- issue: லேவியர்களுக்கும் ஆசாரியர்களுக்கும் இடையிலான ஒப்பீட்டின் தன்மை
  choice: தங்களைப் பரிசுத்தப்படுத்திக்கொள்வதில் லேவியர்கள் ஆசாரியர்களைவிட உள்ளத்தில் அதிக நேர்மையுள்ளவர்களாக இருந்தார்கள்
  alternative: லேவியர்கள் ஆசாரியர்களைவிட விரைவாகவோ அதிக முனைப்புடனோ தங்களைப் பரிசுத்தப்படுத்திக்கொண்டார்கள்
  rationale: יִשְׁרֵי לֵבָב என்பது வேகம் அல்லது நிர்வாகத் தயார்நிலையை மட்டும் அல்லாமல் உள்நேர்மையை வலியுறுத்துகிறது. அதேவேளை, இச்சம்பவத்திற்கு அப்பாற்பட்டு ஆசாரியத்துவத்தைப் பொதுவாகக் குறைகூறும் கருத்தை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: பரிசுத்தப்படுத்திக்கொள்ளுதல் என்பதன் பொருள்
  choice: ஆலயச் சேவைக்கான சடங்குசார் சுய ஆயத்தத்தைச் சுட்டும் வகையில் ‘தங்களைப் பரிசுத்தப்படுத்திக்கொள்ள’
  alternative: ‘தங்களைத் தூய்மைப்படுத்திக்கொள்ள’ அல்லது ‘தங்களை அர்ப்பணிக்க’
  rationale: קדשׁ என்ற சொல்லின் புனிதப் பயன்பாட்டையும் தற்சுட்டு வடிவத்தையும் காக்கிறது; வெறும் உடல் சுத்தம் அல்லது முழுமையான தனிப்பட்ட அர்ப்பணிப்பு என்று பொருளைச் சுருக்கவோ விரிவாக்கவோ செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பலிச் சடங்குக்குரிய ‘தகனபலி’, ‘பரிசுத்தப்படுத்திக்கொள்ளுதல்’ போன்ற நிலைபெற்ற சொற்கள் தேவைப்படும் இடங்களில் மட்டும் வைக்கப்பட்டுள்ளன. மூலத்தின் ஆசாரியர்–லேவியர் ஒப்பீடும் அதன் சங்கடமும் மென்மைப்படுத்தப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
