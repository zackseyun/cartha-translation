  source_fidelity: 'மூல எபிரெயத்தின் செயல்பட்டியல் முழுமையாகத் தக்கவைக்கப்பட்டுள்ளது: நுழைவு மண்டபக் கதவுகளை மூடுதல், விளக்குகளை அணைத்தல், தூபம் காட்டாமை, தகனபலிகளைச் செலுத்தாமை ஆகியவை சரியான வரிசையிலும் பொருளிலும் உள்ளன. בַּקֹּדֶשׁ என்பதன் இடக்குறிப்பு ‘பரிசுத்த இடத்தில்’ எனத் தேவையற்ற கட்டடவியல் வரையறை இன்றி மொழிபெயர்க்கப்பட்டுள்ளது; לֵאלֹהֵי יִשְׂרָאֵל என்பதும் ‘இஸ்ரவேலின் கடவுளுக்கு’ எனச் சரியாக உள்ளது.'
