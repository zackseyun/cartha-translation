source:
  edition: WLC
  text: גַּ֣ם סָֽגְר֞וּ דַּלְת֣וֹת הָ/אוּלָ֗ם וַ/יְכַבּוּ֙ אֶת הַ/נֵּר֔וֹת וּ/קְטֹ֖רֶת לֹ֣א הִקְטִ֑ירוּ וְ/עֹלָה֙ לֹא הֶעֱל֣וּ בַ/קֹּ֔דֶשׁ לֵ/אלֹהֵ֖י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
translation:
  language: ta
  text: அவர்கள் முன்மண்டபத்தின் கதவுகளையும்[a] மூடி, விளக்குகளை அணைத்துவிட்டார்கள். அவர்கள் தூபம் காட்டவும் இல்லை; இஸ்ரவேலின் கடவுளுக்குப் பரிசுத்த இடத்தில்[b] தகனபலிகளைச் செலுத்தவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நுழைவு மண்டபத்தின் கதவுகள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஆலயத்தின் நுழைவுப் பகுதியிலிருந்த மண்டபத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பரிசுத்தப் பகுதியில்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஆலயத்தின் புனிதப் பகுதியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: -உம் / மேலும் என்ற சேர்க்கைப் பொருள்
  rationale: முந்தைய குற்றச்சாட்டுகளோடு இதையும் சேர்க்கும் எபிரெயச் சொல்லின் தொடர்ச்சிப் பொருளை, ‘கதவுகளையும்’ என்பதிலுள்ள ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סָגְרוּ
  choice: மூடி
  rationale: கதவுகளை அடைத்த செயலை நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் கூறுகிறது.
- source_word: דַּלְתוֹת הָאוּלָם
  choice: முன்மண்டபத்தின் கதவுகள்
  rationale: אוּלָם என்பது ஆலயத்தின் நுழைவுப் பகுதியில் இருந்த மண்டபத்தைக் குறிக்கிறது; ‘முன்மண்டபம்’ கட்டட அமைப்பையும் இருப்பிடத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  choice: விளக்குகளை அணைத்துவிட்டார்கள்
  rationale: ஆலய வழிபாட்டுக்குரிய விளக்குகளை அணைத்த செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  choice: தூபம் காட்டவும் இல்லை
  rationale: தூபத்தைப் புகைக்கச் செய்யும் சடங்குச் செயலைத் தமிழில் வழக்கமான ஆலய மொழியில் தெரிவிக்கிறது; பொதுவான வழிபாடு என்று விரிவாக்கவில்லை.
- source_word: וְעֹלָה לֹא הֶעֱלוּ
  choice: தகனபலிகளைச் செலுத்தவும் இல்லை
  rationale: עֹלָה என்ற முழுவதும் எரிக்கப்படும் பலிக்குரிய தொழில்நுட்பச் சொல்லை ‘தகனபலி’ காக்கிறது; வினைச்சொல் பலி செலுத்தும் செயலை இயல்பாகத் தருகிறது.
- source_word: בַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: எபிரெயச் சொல் ஆலயத்தின் புனிதப் பகுதி அல்லது பரிசுத்த இடத்தைக் குறிக்கக்கூடும்; குறிப்பிட்ட உட்பிரிவைத் தீர்மானிக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளுக்கு
  rationale: லாமேத் முன்னொட்டு காட்டும் அர்ப்பணிப்பு அல்லது வழிபாட்டின் நோக்கை ‘-க்கு’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆலய வழிபாட்டுக்குரிய சொற்கள்
  choice: ‘தூபம்’, ‘தகனபலி’, ‘பரிசுத்த இடம்’ என்ற குறிப்பான வழிபாட்டுச் சொற்களைத் தக்கவைத்தல்
  alternative: ‘வழிபடவில்லை’ அல்லது ‘காணிக்கைகள் செலுத்தவில்லை’ போன்ற பொதுவான மொழி
  rationale: வசனம் பொதுவான இறைமறுப்பை அல்ல, ஆலயப் பணியின் குறிப்பிட்ட கடமைகள் புறக்கணிக்கப்பட்டதைப் பட்டியலிடுகிறது; ஆகவே வரலாற்று மற்றும் இறையியல் குறிப்புத்தன்மை காக்கப்படுகிறது.
- issue: בַקֹּדֶשׁ என்பதன் இடக்குறிப்பு
  choice: ‘பரிசுத்த இடத்தில்’ என்று மொழிபெயர்த்து அடிக்குறிப்பில் ‘பரிசுத்தப் பகுதியில்’ என்ற பரந்த வாய்ப்பைக் குறிப்பிடுதல்
  alternative: ‘ஆலயத்தில்’ அல்லது ஒரு குறிப்பிட்ட ஆலய உட்பகுதியின் பெயரை மட்டும் பயன்படுத்துதல்
  rationale: மூலச்சொல் பரிசுத்த இடத்தையோ புனித ஆலயப் பகுதியையோ குறிக்கலாம்; உரை உறுதிப்படுத்தாத கட்டடவியல் துல்லியத்தை மொழிபெயர்ப்பு திணிக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முன்மண்டபம்’ கட்டடவியல் துல்லியத்திற்கும் இயல்பான தமிழுக்கும் இடையில் சமநிலை தருகிறது. ‘தகனபலி’ வேதாகம வழிபாட்டின் குறிப்பான பலிவகையைப் பாதுகாக்கிறது; பன்மை தமிழின் இயல்புக்கும் பட்டியலின் பொதுப்பொருளுக்கும் ஏற்றது.
