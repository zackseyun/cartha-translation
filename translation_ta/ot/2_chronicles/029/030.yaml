  to: பின்பு எசேக்கியா அரசனும் அதிகாரிகளும், தாவீது மற்றும் தரிசனக்காரரான ஆசாப் ஆகியோரின் வார்த்தைகளால்[a] யாவேவைப் புகழும்படி லேவியர்களிடம் கூறினர். அவர்கள் மகிழ்ச்சியுடன்[b] புகழ்ந்து, தாழ்ந்து வணங்கி, வழிபட்டார்கள்.
  rationale: இறைப் பெயர் English POB audit trail-இன் “Yahweh” தீர்மானத்துக்கு ஏற்ப “யாவே” எனத் திருத்தப்பட்டது. முதல் அடிக்குறிப்பின் மாற்றுவாசிப்பைக் காக்கும் வகையில், முக்கிய உரையில் இயல்பான “வார்த்தைகளால்” பயன்படுத்தப்பட்டுள்ளது. இறுதித் தொடரில் உடலால் தாழ்தல் மற்றும் வழிபடுதல் என்ற இரண்டு எபிரெய வினைகளும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
