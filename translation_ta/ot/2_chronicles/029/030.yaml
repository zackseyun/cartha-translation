  text: וַ֠/יֹּאמֶר יְחִזְקִיָּ֨הוּ הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ לַ/לְוִיִּ֔ם לְ/הַלֵּל֙ לַֽ/יהוָ֔ה בְּ/דִבְרֵ֥י דָוִ֖יד וְ/אָסָ֣ף הַ/חֹזֶ֑ה וַֽ/יְהַלְלוּ֙ עַד לְ/שִׂמְחָ֔ה וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
translation:
  language: ta
  text: பின்பு எசேக்கியா அரசனும் அதிகாரிகளும், தாவீது மற்றும் தரிசனக்காரரான ஆசாப் ஆகியோரின் வார்த்தைகளால்[a] யாவேவைப் புகழும்படி லேவியர்களிடம் கூறினர். அவர்கள் மகிழ்ச்சியுடன்[b] புகழ்ந்து, தாழ்ந்து வணங்கி, வழிபட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீது மற்றும் தரிசனக்காரரான ஆசாப் ஆகியோரின் வார்த்தைகளின்படி.”
    reason: בְּ என்ற முன்னொட்டு கருவி அல்லது நெறி என்ற பொருளில் அமையலாம்.
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “மகிழ்ச்சிவரை” அல்லது “மகிழ்ச்சிக்கு”; அவர்களுடைய புகழ்ச்சி மகிழ்ச்சியோடு இருந்தது என்பதே இங்குள்ள கருத்து.
    reason: עַד לְשִׂמְחָה என்ற அபூர்வமான எபிரெயச் சொற்றொடரின் வடிவத்தையும் அதன் இயல்பான சூழற்பொருளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: கூறினார்கள்
  rationale: எபிரெய வினைச்சொல் அடிப்படையில் ‘சொன்னார்கள்’ எனப் பொருள்பட்டாலும், தொடர்ந்து வரும் நோக்கவினை இங்கு அறிவுறுத்தலைக் குறிக்கிறது. ‘கூறினார்கள்’ என்பது கட்டளையின் கடுமையைச் சேர்க்காமல் இயல்பாக உள்ளது.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: அரசனும் அதிகாரிகளும்
  rationale: שׂרים என்பது இச்சூழலில் ஆட்சித் தலைவர்கள் அல்லது அதிகாரிகளைக் குறிக்கிறது; ‘அதிகாரிகள்’ நவீனத் தமிழில் தெளிவானது.
- source_word: לְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தாரும் ஆலயப் பணியாளர்களுமான குழுவிற்கான வழக்கமான தமிழ்ப் பெயர்.
- source_word: לְהַלֵּל
  choice: புகழும்படி
  rationale: הלל வழிபாட்டுச் சூழலில் புகழ்தலைக் குறிக்கிறது; பாடுதல் சாத்தியமானாலும் வினைச்சொல் தனியாக அதை கட்டாயப்படுத்தவில்லை.
- source_word: לַיהוָה
  choice: யெகோவா
  rationale: மூலத்தில் நேரடியாக உள்ள יהוה என்ற இறைப் பெயரை ஒரு தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  choice: தாவீது மற்றும் தரிசனக்காரரான ஆசாப் ஆகியோரின் வார்த்தைகளைக் கொண்டு
  rationale: דברי என்பதன் ‘வார்த்தைகள்’ என்ற பரந்த பொருளைத் தக்கவைக்கிறது; ‘பாடல்கள்’ என்று குறுக்கவில்லை. בְּ கருவி அல்லது நெறி என்ற இரு நிழற்பொருள்களையும் ஏற்கக்கூடும் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַחֹזֶה
  choice: தரிசனக்காரர்
  rationale: חֹזֶה என்பது தீர்க்கதரிசனத் தரிசனங்களைப் பெறுகிறவருக்கான வரலாற்றுச் சமயப் பட்டம்; ‘தரிசனக்காரர்’ அதன் தனித்த நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: עַד לְשִׂמְחָה
  choice: மகிழ்ச்சியுடன்
  rationale: சொல்லுக்குச் சொல் ‘மகிழ்ச்சிவரை/மகிழ்ச்சிக்கு’ என்ற அபூர்வ அமைப்பு. சூழலில் புகழ்ச்சி மகிழ்ச்சியால் நிறைந்திருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; நேரடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ
  choice: தலைவணங்கி வழிபட்டார்கள்
  rationale: 'இரண்டு தனித்த எபிரெய வினைகளையும் தொடர்ச்சியான இரு செயல்களாகத் தக்கவைக்கிறது: முதலில் உடலைத் தாழ்த்துதல், பின்னர் வழிபடுதல்.'
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; ஆண்டவர்
  rationale: மூல உரை நான்கு எழுத்து இறைப் பெயரை நேரடியாகக் கொண்டுள்ளது. பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக தனிப்பெயரைத் தக்கவைக்க ‘யெகோவா’ பயன்படுத்தப்படுகிறது; துல்லியமான பண்டைய உச்சரிப்பு உறுதியற்றது.
- issue: இறுதி தொடரிலுள்ள உடல் வணக்கமும் வழிபாடும்
  choice: தலைவணங்கி வழிபட்டார்கள் என்ற இரு செயல்கள்
  alternative: வழிபாட்டுடன் தலைவணங்கினார்கள் என்ற ஒருங்கிணைந்த வாசிப்பு
  rationale: மூலத்தில் இரண்டு தனி வினைச்சொற்கள் உள்ளதால், உடல் தாழ்த்துதலையும் வழிபாட்டுச் செயலையும் ஒன்றாகச் சுருக்காமல் இரண்டையும் மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘வார்த்தைகள்’ என்று மூலத்தின் அகலப் பொருள் காக்கப்பட்டுள்ளது; ‘பாடல்கள்’ என விளக்கமாகக் குறுக்கப்படவில்லை. அடிக்குறிப்பு குறிகள் அனைத்தும் உரையில் இடம்பெற்றுள்ளன.
