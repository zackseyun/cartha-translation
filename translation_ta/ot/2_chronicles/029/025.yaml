base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
translation:
  language: ta
  text: அவன் லேவியர்களை யாவேயின் ஆலயத்தில் கைத்தாளங்கள், யாழ்கள், கின்னரங்கள் ஆகியவற்றுடன் நிறுத்தினான். தாவீதின் கட்டளையின்படியும், அரசனின் காட்சி காண்பவரான காத்[a], இறைவாக்கினரான நாத்தான் ஆகியோரின் கட்டளையின்படியும் அவன் அவ்வாறு செய்தான்; ஏனெனில் அந்தக் கட்டளை யாவேயிடமிருந்து அவருடைய இறைவாக்கினர்கள் வழியாக வந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காட்சி காண்பவர்” என்பது எபிரெயத்தில் வரும் חֹזֶה என்ற பட்டத்தின் மொழிபெயர்ப்பு. இது “இறைவாக்கினர்” என்பதற்கான נָבִיא என்ற சொல்லிலிருந்து வேறுபட்டது; இரண்டும் தொடர்புடைய பணிகளைக் குறிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: இதை இன்னும் சொற்சொல்லாக, “ஏனெனில் கட்டளை யாவேயின் கையால், அவருடைய இறைவாக்கினர்களின் கையால் வந்தது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: நிறுத்தினான்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் இங்கே லேவியர்களை வழிபாட்டுப் பணிக்குரிய இடங்களில் நிற்கச் செய்ததைக் குறிக்கிறது; ‘நிறுத்தினான்’ இடமளித்தலையும் பணிநியமனச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: எபிரெய ‘யாவேயின் வீடு’ என்ற வடிவத்தைச் சொற்சொல்லாகப் பின்பற்றாமல், நவீனத் தமிழில் இங்கு குறிக்கப்படும் கோவிலைத் தெளிவாகவும் மரியாதையாகவும் ‘ஆலயம்’ என வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: בִּמְצִלְתַּיִם
  choice: கைத்தாளங்கள்
  rationale: மோதித் தாளமிடப்படும் உலோக இசைக்கருவிகளைக் குறிக்கும் பொருத்தமான, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: בִּנְבָלִים
  choice: யாழ்கள்
  rationale: נבל என்பது தந்தி இசைக்கருவி; அதன் துல்லியமான நவீன ஒப்புமை உறுதியற்றதால், இயல்பான தமிழில் பொதுவாகப் புரியும் ‘யாழ்’ பயன்படுத்தப்படுகிறது.
- source_word: וּבְכִנֹּרוֹת
  choice: கின்னரங்கள்
  rationale: כנור என்பதை נבל உடன் ஒன்றாக்காமல் தனி இசைக்கருவியாகக் காட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது; அடிக்குறிப்பு அதன் வகையை விளக்குகிறது.
- source_word: גָּד חֹזֵה הַמֶּלֶךְ
  choice: அரசனின் திருக்காட்சியாளரான காத்
  rationale: חֹזֶה என்ற பட்டத்தை ‘இறைவாக்கினர்’ என ஒன்றாக்காமல், காட்சிபெறுகிறவர் என்ற தனித்த எபிரெயச் சொல்லின் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: נָתָן הַנָּבִיא
  choice: இறைவாக்கினரான நாத்தான்
  rationale: נביא என்பதற்கு நவீனத் தமிழ் வேதாகம நடையில் தெளிவான ‘இறைவாக்கினர்’ பயன்படுத்தப்படுகிறது.
- source_word: בְיַד יְהוָה ... בְיַד נְבִיאָיו
  choice: யாவேயிடமிருந்து அவருடைய இறைவாக்கினர்கள் வழியாக வந்தது
  rationale: ‘கையால்’ என்ற எபிரெய மரபுத்தொடர், யாவே இறுதி மூலமாகவும் இறைவாக்கினர்கள் இடைமுகமாகவும் இருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தாவீதின் வழிபாட்டு ஒழுங்குக்கும் தெய்வீக அதிகாரத்துக்கும் உள்ள உறவு
  choice: இசை வழிபாட்டுக்கான கட்டளை தாவீது, காத், நாத்தான் ஆகியோருடன் தொடர்புபடுத்தப்பட்டாலும், அதன் இறுதி மூலம் யாவே என்றும் அது அவருடைய இறைவாக்கினர்கள் வழியாக வந்தது என்றும் மொழிபெயர்க்கப்பட்டது.
  alternative: இது தாவீதின் அரச கட்டளை மட்டுமே என்று பொருள்படுத்துதல்.
  rationale: כִּי בְיַד יְהוָה הַמִּצְוָה בְיַד נְבִיאָיו என்ற காரணவாக்கியம் கட்டளையின் தெய்வீக மூலத்தையும் தீர்க்கதரிசிகளின் இடைமுகத்தையும் வெளிப்படையாகக் கூறுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. இசைக்கருவிகளுக்கான துல்லியமான நவீன ஒப்புமை உறுதியற்ற இடத்தில் வேறுபாட்டைப் பாதுகாக்க ‘யாழ்’ மற்றும் ‘கின்னரம்’ எனத் தனித்தனியாக வழங்கி அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. חֹזֶה மற்றும் נביא ஆகிய பட்டங்களும் ஒன்றாக்கப்படவில்லை.
