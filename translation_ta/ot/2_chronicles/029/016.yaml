source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ הַ֠/כֹּהֲנִים לִ/פְנִ֣ימָה בֵית יְהוָה֮ לְ/טַהֵר֒ וַ/יּוֹצִ֗יאוּ אֵ֤ת כָּל הַ/טֻּמְאָה֙ אֲשֶׁ֤ר מָֽצְאוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה לַ/חֲצַ֖ר בֵּ֣ית יְהוָ֑ה וַֽ/יְקַבְּלוּ֙ הַ/לְוִיִּ֔ם לְ/הוֹצִ֥יא לְ/נַֽחַל קִדְר֖וֹן חֽוּצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: ta
  text: அப்போது ஆசாரியர்கள் ஆண்டவருடைய ஆலயத்தின் உட்பகுதிக்குள் சென்று, அதைத் தூய்மைப்படுத்தினார்கள். அவர்கள் ஆண்டவருடைய ஆலயத்தில் கண்ட எல்லா அசுத்தத்தையும் ஆண்டவருடைய ஆலய முற்றத்திற்குக் கொண்டு வந்தார்கள். லேவியர்கள் அதை ஏற்றுக்கொண்டு, வெளியே கீதரோன் பள்ளத்தாக்கிற்குக் கொண்டு சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנִימָה בֵית יְהוָה
  choice: ஆண்டவருடைய ஆலயத்தின் உட்பகுதிக்குள்
  rationale: לִפְנִימָה என்பது ஆலயத்தின் உள்ளார்ந்த பகுதியைச் சுட்டுகிறது; இயல்பான நவீனத் தமிழில் இடத்தையும் இயக்கத்தையும் தெளிவாகக் கூறுகிறது.
- source_word: לְטַהֵר
  choice: அதைத் தூய்மைப்படுத்தினார்கள்
  rationale: ஆலயத்தைச் சடங்கியல் அசுத்தத்திலிருந்து சுத்திகரிக்கும் செயலைக் குறிக்கிறது; ‘தூய்மைப்படுத்துதல்’ இந்தச் சூழலில் பொருத்தமானது.
- source_word: כָּל הַטֻּמְאָה
  choice: அசுத்தமான அனைத்தையும்
  rationale: טֻמְאָה என்பது இங்கு ஆலயத்தில் இருந்த சடங்கியல் அசுத்தத்திற்குரிய பொருட்களை ஒருமையாகத் தொகுத்துக் கூறுகிறது; தமிழில் பன்மைச் சுட்டுப்பெயருடன் தொடர்வதற்கு இந்த வடிவம் இயல்பானது.
- source_word: בְּהֵיכַל יְהוָה
  choice: ஆண்டவருடைய ஆலயத்தில்
  rationale: הֵיכָל இங்கு ஆலயக் கட்டிடத்தைக் குறிக்கிறது. ‘ஆலயம்’ பொதுவாசகர்களுக்கு இயல்பாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: לְנַחַל קִדְרוֹן חוּצָה
  choice: வெளியே கீதரோன் பள்ளத்தாக்கிற்கு
  rationale: חוּצָה என்பதன் ‘வெளியே’ என்ற திசைப் பொருளைப் பாதுகாக்கிறது; נַחַל நிலவியல் சூழலில் பள்ளத்தாக்கு அல்லது ஓடைப் பள்ளத்தைச் சுட்டுவதால் வழக்கமான பெயர்ப்பாக ‘கீதரோன் பள்ளத்தாக்கு’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: தெய்வீகப் பெயர் יהוה
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: தமிழ் வேதாகம வாசிப்பு மரபில் அறியப்பட்ட மரியாதையான பிரதிநிதித்துவம்; வசனத்தில் பெயர் மூன்று முறை வருவதைப் போல மொழிபெயர்ப்பிலும் ஒவ்வொரு முறையும் வெளிப்படையாக வைத்துள்ளது.
- issue: טֻמְאָה என்பதன் தன்மை
  choice: அசுத்தமான அனைத்தும்
  alternative: தீட்டான பொருட்கள் அனைத்தும்
  rationale: மூலச்சொல் சடங்கியல் அசுத்தத்தையும் அசுத்தமான பொருட்களையும் உள்ளடக்கக்கூடியதால், குறிப்பிட்ட பொருட்கள் அல்லது வழிபாட்டு முறையை ஊகிக்காமல் அதன் பரப்பைத் திறந்தவாறே வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. எபிரெய உரையின் செயல்வரிசை—ஆசாரியர்கள் உட்பகுதியில் தூய்மைப்படுத்துதல், முற்றத்திற்குக் கொண்டுவருதல், லேவியர்கள் வெளியே சுமந்து செல்லுதல்—தெளிவாகப் பாதுகாக்கப்பட்டது.
