base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
translation:
  language: ta
  text: மேலும், ஓப்பீரிலிருந்து தங்கத்தைக் கொண்டுவந்த ஈராமின் பணியாளர்களும் சாலொமோனின் பணியாளர்களும் அல்கூம் மரப்பொருட்களையும்[a] விலையுயர்ந்த கற்களையும்[b] கொண்டுவந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அல்கூம்” என்பதன் துல்லியமான மர இனம் உறுதியாகத் தெரியவில்லை; சில மரபுகளில் இது வேறு ஒலிவடிவத்தில் வழங்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் “விலையுயர்ந்த கல்” என்று ஒருமை வடிவில் உள்ளது; இங்கு அது பல கற்களைக் கூட்டாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: மேலும்
  rationale: இணைப்பையும் கூடுதல் கருத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַבְדֵי
  choice: பணியாளர்கள்
  rationale: அரசப் பணியில் இருந்த சேவகர்கள் அல்லது பணியாளர்களைக் குறிக்கும் இச்சூழலில், அடிமை நிலையைத் தேவையின்றி வலியுறுத்தாமல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: חירם
  choice: ஈராம்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பெயர்த்தெழுதுகிறது.
- source_word: אֲשֶׁר הֵבִיאוּ זָהָב מֵאוֹפִיר
  choice: ஓப்பீரிலிருந்து தங்கத்தைக் கொண்டுவந்த
  rationale: உறவுநிலை வாக்கியத்தை இரு அரசர்களின் பணியாளர்களோடும் தொடர்புபடுத்தி, எபிரெயச் சொற்றொடரின் இயல்பான பொருளைப் பாதுகாக்கிறது.
- source_word: עֲצֵי אַלְגּוּמִּים
  choice: அல்கூம் மரக்கட்டைகள்
  rationale: மர இனத்தின் துல்லியமான அடையாளம் உறுதியில்லாததால் எபிரெயப் பெயரை ஒலிபெயர்த்து, சரக்காகக் கொண்டுவரப்பட்ட மரப்பொருளை இயல்பான தமிழில் குறிப்பிடுகிறது.
- source_word: וְאֶבֶן יְקָרָה
  choice: விலையுயர்ந்த கற்கள்
  rationale: எபிரெயில் ஒருமை வடிவம் இருந்தாலும் அது கூட்டுப்பொருளில் பயன்பட்டிருக்கலாம்; சரக்குப் பட்டியலில் தமிழ் பன்மை இயல்பானது.
