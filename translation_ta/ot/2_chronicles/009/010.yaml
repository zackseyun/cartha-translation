translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; உறுதியற்ற மர இனத்திற்கு விளக்கக் குறிப்பு தரப்பட்டுள்ளது.
