  yaml_path: translation/ot/2_chronicles/009/015.yaml
  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
translation:
  language: ta
  text: சாலொமோன் அரசன் அடித்துப் பரப்பிய தங்கத்தால் இருநூறு பெரிய கேடயங்களைச் செய்தான்; ஒவ்வொரு கேடயத்தின்மீதும் அறுநூறு சேக்கல்[a] எடையுள்ள அடித்துப் பரப்பிய தங்கம் இடப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், “அடித்துப் பரப்பிய தங்கம் அறுநூறு, அந்த ஒரு கேடயத்தின்மேல் ஏறியது.” இங்கு ஓர் எடை அலகு உள்ளுறையாகக் கருதப்படுகிறது; தெளிவுக்காக “சேக்கல்” சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עשה என்பதன் வழக்கமான பொருளான ‘செய்/உருவாக்கு’ என்பதை, பட்டியல் பாணியிலான இவ்வரலாற்றுச் சூழலில் இயல்பாக வழங்குகிறது.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசர்
  rationale: எபிரெயச் சொல்லமைப்பிலுள்ள அரசப் பட்டத்தையும் பெயரையும், இயல்பான நவீனத் தமிழ் வரிசையில் தருகிறது.
- source_word: מָאתַיִם צִנָּה
  choice: இருநூறு பெரிய கேடயங்கள்
  rationale: צִנָּה என்பது பொதுவாக உடலின் பெரும்பகுதியை மறைக்கும் பெரிய கேடயத்தைக் குறிக்கிறது; வேறு சிறிய கேடயச் சொல்லிலிருந்து உள்ள வேறுபாட்டை ‘பெரிய’ என்பது காக்கிறது.
- source_word: זָהָב שָׁחוּט
  choice: அடித்துப் பரப்பிய தங்கம்
  rationale: שָׁחוּט இங்கு தங்கத்தை அடித்து மெல்லியதாகப் பரப்பிய உலோக வேலைப்பாட்டைக் குறிக்கிறது. இத்தமிழாக்கம் செய்முறையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שֵׁשׁ מֵאוֹת
  choice: அறுநூறு
  rationale: எண்ணின் நேரடியான மொழிபெயர்ப்பு.
- source_word: יַעֲלֶה עַל
  choice: மேலும் ... இடப்பட்டது
  rationale: குறிப்பிட்ட அளவு தங்கம் கேடயத்தின்மேல் சென்றது அல்லது இடப்பட்டது என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; ‘முழுவதும் மூடப்பட்டது’ என்று அளவுக்கு மீறி விளக்குவதில்லை.
- source_word: הַצִּנָּה הָאֶחָת
  choice: ஒவ்வொரு கேடயத்தின்
  rationale: சொல்லுக்குச் சொல் ‘அந்த ஒரு கேடயம்’ என்றாலும், எண்ணிக்கையைப் பகிர்ந்தளிக்கும் இச்சூழலில் ‘ஒவ்வொரு கேடயம்’ என்பதே இயல்பான தமிழ்.
- source_word: '[שֵׁשׁ מֵאוֹת என்பதற்குப் பின் உள்ள உள்ளுறை அளவை]'
  choice: சேக்கல்
  rationale: எபிரெயில் எடை அலகு வெளிப்படையாகக் கூறப்படவில்லை; இங்கு தங்கத்தின் எடை குறிக்கப்படுவதால், வாசகருக்குத் தெளிவாக ‘சேக்கல்’ சேர்க்கப்பட்டு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
