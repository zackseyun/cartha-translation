  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட வரலாற்று வருணனை. ‘சிங்கங்கள்’ என்று உயிருள்ள விலங்குகளாகத் தவறாகப் புரிந்துகொள்ளப்படாமல், அரியணை அலங்காரச் சூழலுக்கேற்றவாறு ‘சிங்க உருவங்கள்’ பயன்படுத்தப்பட்டுள்ளது; இடவமைப்பின் சிறிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
