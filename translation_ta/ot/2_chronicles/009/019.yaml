base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/019.yaml
  text: And twelve lions were standing there on the six steps[a], on this side and on that side. Nothing like it had been made for any kingdom.
translation:
  language: ta
  text: பன்னிரண்டு சிங்கங்கள் அங்கே ஆறு படிகளின் இருபுறங்களிலும் நின்றன.[a] எந்த ராஜ்யத்திற்காகவும் இவ்வாறு செய்யப்பட்டதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பன்னிரண்டு சிங்கங்கள் அங்கே ஆறு படிகளின்மேல், ஒவ்வொரு பக்கத்திலும் ஒன்று வீதம் நின்றன.”
    reason: எபிரேயச் சொற்றொடர் பன்னிரண்டு சிங்கங்கள் ஆறு படிகளின் இருபுறங்களில் அமைந்திருந்ததைக் குறிக்கிறது; ஒவ்வொரு படியின் ஒவ்வொரு பக்கத்திலும் ஒன்று என்ற பகிர்வைச் சொல்லாக்கம் வெளிப்படையாக விவரிக்கவில்லை.
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיוֹת
  choice: பன்னிரண்டு சிங்க உருவங்கள்
  rationale: அரியணையின் அலங்கார அமைப்பில் இருந்த சிங்கச் சிலைகள் அல்லது வடிவங்களைக் குறிக்கும் சூழலைத் தெளிவுபடுத்த ‘உருவங்கள்’ சேர்க்கப்பட்டுள்ளது; மூலத்தின் எண்ணிக்கையும் உருவகமும் காக்கப்படுகின்றன.
- source_word: עֹמְדִים שָׁם
  choice: அங்கே ... நின்றன
  rationale: எபிரேயப் பங்கேற்புவினையின் காட்சிவருணனைத் தமிழில் இயல்பான இறந்தகால நிலைவருணனையாக வழங்குகிறது.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: ஆறு படிகளின்மேல்
  rationale: מַעֲלוֹת என்பது அரியணைக்குச் செல்லும் படிகளைக் குறிக்கிறது; עַל என்பதன் இடப்பொருளை ‘மேல்’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: מִזֶּה וּמִזֶּה
  choice: இருபுறமும்
  rationale: ‘இந்தப் புறமும் அந்தப் புறமும்’ என்ற பகிர்ந்தமைவைக் குறிக்கும் எபிரேயச் சொற்றொடருக்கு இயல்பான, சுருக்கமான தமிழ் இணை.
- source_word: לֹא נַעֲשָׂה כֵן לְכָל מַמְלָכָה
  choice: எந்த அரசாட்சிக்காகவும் இதுபோன்ற ஒன்று செய்யப்பட்டதில்லை
  rationale: செயப்பாட்டு வடிவத்தையும், பிற அரசாட்சிகளில் ஒப்பான ஒன்று இல்லை என்ற தனித்தன்மையையும் காக்கிறது.
