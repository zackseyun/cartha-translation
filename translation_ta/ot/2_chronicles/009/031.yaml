translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. எபிரெய அரச மரண மற்றும் வாரிசுரிமை அறிவிப்பின் சுருக்கமான தன்மை காக்கப்பட்டது; ‘நித்திரையடைந்தான்’ என்ற மரபுவழி உருவகம் அடிக்குறிப்புடன் வைக்கப்பட்டது.
