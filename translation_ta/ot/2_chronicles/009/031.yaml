base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/031.yaml
  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
translation:
  language: ta
  text: சாலொமோன் தன் முன்னோர்களோடு உறங்கினான்[a]. அவனை அவனுடைய தந்தையான தாவீதின் நகரத்தில் அடக்கம் செய்தார்கள். அவனுக்குப் பதிலாக அவன் மகன் ரெகொபெயாம் அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தன் முன்னோர்களோடு உறங்கினான்”; இது மரணத்தைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு நித்திரையடைந்தான்
  rationale: மரணத்தைக் குறிக்கும் எபிரெய வழக்குச் சொற்றொடரின் உருவகத்தையும் அரச மரண அறிவிப்புகளிலுள்ள அதன் தொடர்பொலியையும் காக்கிறது; நவீன தமிழில் ‘பிதாக்களோடு’ என்பதைக் காட்டிலும் ‘முன்னோர்களோடு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவனை ... அடக்கம் செய்தார்கள்
  rationale: எபிரெயத்தில் உள்ள செயப்பாட்டு பன்மையையும், செய்பவர்கள் யார் என்பதை வரையறுக்காமல் விடுவதையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: בְּעִיר דָּוִיד אָבִיו
  choice: அவனுடைய தந்தை தாவீதின் நகரத்தில்
  rationale: ‘தாவீதின் நகரம்’ என்ற அறியப்பட்ட இடப்பெயர் அமைப்பையும், தாவீது சாலொமோனுடைய தந்தை என்ற மூலத்தின் வெளிப்படையான குறிப்பையும் காக்கிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: அரசனாக ஆட்சி செய்தலைக் குறிக்கும் வழக்கமான எபிரெய அரசாட்சி வினையைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரச வாரிசுரிமையில் ஒருவரின் இடத்தை மற்றொருவர் ஏற்றுக்கொள்வதைத் தெளிவாகக் குறிக்கிறது.
