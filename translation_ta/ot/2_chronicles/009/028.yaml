translation_notes:
  register: நவீன பொதுத்தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கொண்டுவந்தார்கள்’ என்பது வணிக இறக்குமதியைத் தமிழில் தெளிவாக உணர்த்துகிறது; சொல்லர்த்தமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
