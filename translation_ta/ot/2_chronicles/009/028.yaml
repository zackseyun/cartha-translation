  yaml_path: translation/ot/2_chronicles/009/028.yaml
  text: And they were importing horses for Solomon from Egypt and from all the lands[a].
translation:
  language: ta
  text: சாலொமோனுக்காக எகிப்திலிருந்தும் எல்லா நாடுகளிலிருந்தும் குதிரைகளைக் கொண்டுவந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்சொல்லாக, “சாலொமோனுக்காக எகிப்திலிருந்தும் எல்லா நாடுகளிலிருந்தும் குதிரைகளை வெளியே கொண்டுவந்தார்கள்.” எபிரெய வினைச்சொல் சொல்லர்த்தமாக “வெளியே போகச் செய்தல்/வெளியே கொண்டுவருதல்” என்று பொருள்படும்; இச்சூழலில் அது வணிகத்தின் மூலம் குதிரைகள் கொண்டுவரப்பட்டதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  choice: கொண்டுவந்தார்கள்
  rationale: יצא என்பதன் ஹிஃபில் பங்கேற்புவினை வடிவம் சொல்லர்த்தமாக ‘வெளியே கொண்டுவருதல்’ எனப் பொருள்படும். இங்கு வணிக வழங்கல் சூழலில், தமிழில் இயல்பாகவும் மூலத்தின் இயக்கக் கருத்தைத் தக்கவைத்தும் ‘கொண்டுவந்தார்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது; பன்மை வடிவத்தின் குறிப்பிடப்படாத செய்பவர் நிலையும் பாதுகாக்கப்படுகிறது.
- source_word: סוּסִים
  choice: குதிரைகளை
  rationale: ‘குதிரைகள்’ என்னும் நேரடியான பன்மைப் பெயர்ச்சொல்; தமிழ் வாக்கிய அமைப்புக்கேற்ப இரண்டாம் வேற்றுமை உருபுடன் தரப்பட்டுள்ளது.
- source_word: מִ/מִּצְרַיִם
  choice: எகிப்திலிருந்து
  rationale: מן என்னும் முன்னிடைச்சொல் தோற்றுவாய் அல்லது புறப்படும் இடத்தைக் குறிக்கிறது.
- source_word: לִ/שְׁלֹמֹה
  choice: சாலொமோனுக்காக
  rationale: ל என்பது ‘சாலொமோனுக்கு’ அல்லது ‘சாலொமோனுக்காக’ என அமையலாம். வணிக வழங்கல் சூழலில் பயனாளியைத் தெளிவாகக் காட்ட ‘சாலொமோனுக்காக’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  choice: எல்லா நாடுகளிலிருந்தும்
  rationale: כָּל உடன் வரும் אֶרֶץ என்பதன் பன்மை பல்வேறு நிலப்பகுதிகள் அல்லது நாடுகளைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகப் புரிய ‘எல்லா நாடுகளிலிருந்தும்’ எனத் தரப்பட்டுள்ளது.
