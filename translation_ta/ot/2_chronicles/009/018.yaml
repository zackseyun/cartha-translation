base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
translation:
  language: ta
  text: அரியணைக்கு ஆறு படிகள் இருந்தன; அரியணையோடு இணைக்கப்பட்ட பொன்னாலான ஒரு கால்மணையும்[a] இருந்தது. இருக்கையின் இருபுறமும் கைதாங்கிகள் இருந்தன; அந்தக் கைதாங்கிகளின் அருகே இரண்டு சிங்கங்கள் நின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரியணையோடு இணைக்கப்பட்ட பொன்னாலான சாய்வுப்பாதை அல்லது படிக்கட்டு.” எபிரெயச் சொல்லைப் பலவாறு புரிந்துகொள்ளலாம்; அரியணைச் சூழலுக்கு “கால்மணை” நன்கு பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: படிகள்
  rationale: அரியணையை நோக்கி மேலே செல்லும் படிகளைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: כֶּבֶשׁ
  choice: கால்மணை
  rationale: அரியணைச் சூழலில் கால்களை வைக்கும் ஆதாரப் பகுதி என்ற பொருள் நன்கு பொருந்துகிறது; எனினும் ‘சாய்வுப்பாதை/படிக்கட்டு’ என்ற பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מָאֳחָזִים
  choice: இணைக்கப்பட்ட
  rationale: அந்தப் பொன் பகுதி அரியணையுடன் பொருத்தப்பட்டிருந்ததைச் சுட்டும் செயல்பாட்டுப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יָדוֹת
  choice: கைதாங்கிகள்
  rationale: சொல்லளவில் ‘கைகள்’ என்றாலும், இருக்கைத் தளவாடச் சூழலில் கைகளைத் தாங்கும் பக்கப் பகுதிகளைக் குறிக்கிறது.
- source_word: מִזֶּה וּמִזֶּה
  choice: இருபுறமும்
  rationale: ‘இந்தப் புறமும் அந்தப் புறமும்’ என்ற இருபக்க அமைப்பை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: מְקוֹם הַשָּׁבֶת
  choice: இருக்கையின்
  rationale: சொல்லளவில் ‘அமரும் இடம்’ என்பதைக் குறிக்கிறது; கைதாங்கிகளின் அமைவிடத்தைத் தமிழில் இயல்பாகக் காட்ட ‘இருக்கையின் இருபுறமும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֲרָיוֹת
  choice: சிங்கங்கள்
  rationale: எபிரெய உரையில் உள்ள பொதுவான பன்மைப் பெயரைத் தக்கவைக்கிறது; அவை சிற்பங்கள் என்று வெளிப்படையாகக் கூறப்படாததால் அவ்வாறு சேர்க்கப்படவில்லை.
- source_word: עֹמְדִים
  choice: நின்றன
  rationale: சிங்கங்கள் கைதாங்கிகளருகே நிமிர்ந்த நிலையில் அமைந்திருந்ததை நேரடியாகக் குறிக்கிறது.
- source_word: אֵצֶל
  choice: அருகே
  rationale: மிக நெருங்கிய பக்கவாட்டு அமைவிடத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
