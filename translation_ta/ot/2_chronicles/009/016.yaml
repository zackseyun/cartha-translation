base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/016.yaml
  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: ta
  text: மேலும், அடித்துத் தயாரிக்கப்பட்ட தங்கத்தால் முந்நூறு கேடயங்களைச் செய்தான்; ஒவ்வொரு கேடயத்தின்மேலும் முந்நூறு சேக்கல்[a] தங்கம் போடப்பட்டது. அரசன் அவற்றை லெபனோன் வன மாளிகையில்[b] வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில், ஒவ்வொரு கேடயத்திற்கும் ‘முந்நூறு தங்கம்’ என்று மட்டுமே உள்ளது; அளவின் அலகான ‘சேக்கல்’ என்பது 1 இராஜாக்கள் 10:17-இன் இணை உரையின் அடிப்படையில் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘லெபனோன் வன மாளிகை’ என்பது ஒரு பெயரிடப்பட்ட அரசக் கட்டடம்; மூலத்திற்கு நெருக்கமாக, இதை ‘லெபனோன் வன வீடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים
  choice: கேடயங்கள்
  rationale: מָגֵן என்பது பாதுகாப்புக்கான கேடயத்தைக் குறிக்கிறது; ‘கேடயம்’ தெளிவான, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: זָהָב שָׁחוּט
  choice: அடித்துத் தகடாக்கப்பட்ட தங்கம்
  rationale: שָׁחוּט இங்கு தங்கத்தை அடித்து மெல்லிய தகடாகச் செய்த உலோக வேலைப்பாட்டைக் குறிக்கிறது; வெறும் ‘அடித்த தங்கம்’ என்பதைக் காட்டிலும் இவ்வடிவம் பொருளைத் தெளிவாக்குகிறது.
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  choice: முந்நூறு சேக்கல் தங்கம்
  rationale: எபிரெய உரையில் அளவின் அலகு குறிப்பிடப்படாமல் ‘முந்நூறு தங்கம்’ என்றே உள்ளது. 1 இராஜாக்கள் 10:17-இன் இணை உரையை அடிப்படையாகக் கொண்டு ‘சேக்கல்’ தெளிவுக்காக வழங்கப்பட்டு, அடிக்குறிப்பில் மூலத்தின் சுருக்கம் பாதுகாக்கப்படுகிறது.
- source_word: יַעֲלֶה עַל
  choice: பயன்படுத்தப்பட்டது
  rationale: சொல்லுக்கு நேராக ‘அதன்மேல் ஏறியது/சென்றது’ என்ற உருவகம் இருந்தாலும், இச்சூழலில் குறிப்பிட்ட தங்க அளவு ஒவ்வொரு கேடயத்துக்கும் இடப்பட்டது என்பதே பொருள்; ‘பயன்படுத்தப்பட்டது’ இயல்பான தமிழில் அதைக் கூறுகிறது.
- source_word: הַמָּגֵן הָאֶחָת
  choice: ஒவ்வொரு கேடயத்திற்கும்
  rationale: வடிவத்தில் ஒருமையாக ‘அந்த ஒரு கேடயத்தின்மேல்’ இருந்தாலும், முந்நூறு கேடயங்களில் ஒவ்வொன்றையும் குறிக்கும் பகிர்மானப் பொருள் சூழலில் தெளிவாக உள்ளது.
- source_word: וַיִּתְּנֵם
  choice: அவற்றை ... வைத்தான்
  rationale: נתן இடத்தைக் குறிக்கும் தொடருடன் வரும்போது ‘வைத்தல்/நிறுவுதல்’ என்று பொருள்படும்; ‘வைத்தான்’ நேரடியும் இயல்புமானது.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: லெபனோன் வன மாளிகை
  rationale: இது ஓர் அரச கட்டடத்தின் பெயர். בֵּית என்பதன் அடிப்படைப் பொருள் ‘வீடு’ என்றாலும், அரச வளாகச் சூழலில் ‘மாளிகை’ வாசகருக்குத் தெளிவாக உள்ளது; பெயரின் தன்மை அடிக்குறிப்பில் விளக்கப்படுகிறது.
