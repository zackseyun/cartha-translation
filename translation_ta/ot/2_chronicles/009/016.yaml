translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்று உரைக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தில் வெளிப்படையாக இல்லாத ‘செய்தான்’ என்பது தமிழில் முழுமையான இயல்பான வாக்கியத்திற்காகச் சூழலிலிருந்து வழங்கப்பட்டுள்ளது. அளவின் அலகு குறித்த மூல மொழியின் சுருக்கமும் கட்டடப் பெயரின் தன்மையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
