  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. அளவுப் பெயரான ‘தாலந்து’ மரபான வேதாகமப் பயன்பாட்டின்படி வைக்கப்பட்டுள்ளது; அரிதான ‘சுகந்தவர்க்கம்’ போன்ற சொற்களுக்கு மாற்றாக பொதுவாகப் புரியும் ‘நறுமணப் பொருட்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
