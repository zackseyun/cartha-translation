base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
translation:
  language: ta
  text: அவள் அரசனுக்கு நூற்றிருபது தாலந்து தங்கத்தையும், மிக ஏராளமான நறுமணப் பொருட்களையும், விலையுயர்ந்த கற்களையும் கொடுத்தாள். சேபாவின் அரசி சாலொமோன் அரசனுக்குக் கொடுத்த அந்த நறுமணப் பொருட்களைப் போன்றவை அதுவரை இருந்ததே இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேபாவின் அரசி சாலொமோன் அரசனுக்குக் கொடுத்த அந்த நறுமணப் பொருட்களைப் போன்றவை பின்னரும் ஒருபோதும் இருந்ததில்லை.” எபிரெய வாசகம், அக்காலம்வரை அவற்றுக்கு இணையான நறுமணப் பொருட்கள் இல்லை என்றோ, பின்னரும் அப்படிப்பட்டவை ஒருபோதும் இல்லை என்றோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: அவள் ... கொடுத்தாள்
  rationale: נתן என்பதன் wayyiqtol வடிவம் நிகழ்ச்சித் தொடரை முன்னெடுக்கிறது; தமிழில் இயல்பான இறந்தகால வினை வடிவம் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: நூற்றிருபது தாலந்து தங்கம்
  rationale: כִּכָּר என்பது எடையளவு; வேதாகமச் சூழலில் வழக்கமான ‘தாலந்து’ என்ற பெயர் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּבְשָׂמִים לָרֹב מְאֹד
  choice: மிக ஏராளமான நறுமணப் பொருட்கள்
  rationale: בְשָׂמִים என்பது வாசனைமிக்க மசாலா அல்லது நறுமணப் பொருட்களைக் குறிக்கும் விரிவான சொல்; לָרֹב מְאֹד அளவின் மிகுதியை வலியுறுத்துகிறது.
- source_word: וְאֶבֶן יְקָרָה
  choice: விலையுயர்ந்த கற்கள்
  rationale: எபிரெய மொழியில் ஒருமை வடிவம் தொகுப்புப் பொருளில் வரலாம்; பரிசுகளின் பட்டியலில் தமிழில் பன்மை இயல்பாக உள்ளது.
- source_word: וְלֹא הָיָה כַּבֹּשֶׂם הַהוּא
  choice: அந்த நறுமணப் பொருட்களைப் போன்றவை அதுவரை இருந்ததே இல்லை
  rationale: כְּ ஒப்பீட்டைக் குறிக்கிறது; בֹּשֶׂם இங்கு தொகுப்புப் பொருளில் உள்ளது. ‘அதுவரை’ என்பது கதை நிகழும் காலம் வரையிலான ஒப்பற்ற தன்மையை இயல்பாகக் காட்டுகிறது; கால வரம்பின் விரிவான புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מַלְכַּת שְׁבָא
  choice: சேபாவின் அரசி
  rationale: இடப்பெயரையும் அரசப் பட்டத்தையும் தெளிவான, இயல்பான தமிழ் உடைமைத் தொடரில் வழங்குகிறது.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசனுக்கு
  rationale: பட்டமும் பெயரும் தமிழில் இயல்பான வரிசையில் அமைக்கப்பட்டுள்ளன.
