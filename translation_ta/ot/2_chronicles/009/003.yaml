  text: When the queen of Sheba saw Solomon’s wisdom and the house that he had built,[a]
translation:
  language: ta
  text: சேபாவின் அரசி சாலொமோனுடைய ஞானத்தையும் அவர் கட்டியிருந்த வீட்டையும்[a] கண்டபோது,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் கட்டியிருந்த அரண்மனையையும்.’ எபிரேய மூலத்தில் ‘வீடு’ என்றே உள்ளது; அரசச் சூழலில் இது சாலொமோனின் அரண்மனை வளாகத்தைக் குறிப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: கண்டபோது
  rationale: வாவ் தொடர் வடிவம் கதையை முன்னெடுக்கிறது; அடுத்த வசனத்தில் தொடரும் வாக்கிய அமைப்பை இயல்பாக இணைக்கத் தமிழில் காலத் தொடர்பைக் காட்டும் ‘கண்டபோது’ பயன்படுத்தப்பட்டது.
- source_word: מַלְכַּת שְׁבָא
  choice: சேபாவின் அரசி
  rationale: இது அரசியையும் அவளுடைய நாடு அல்லது பிரதேசத்தையும் இணைக்கும் எபிரெய கட்டமைப்பு; நவீனத் தமிழில் இயல்பாக ‘சேபாவின் அரசி’ என வழங்கப்பட்டது.
- source_word: אֵת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண அடையாளம்; தமிழில் தனிச்சொல் தேவையில்லை, ‘-ஐ/ையும்’ வேற்றுமை வடிவத்தில் அதன் செயல்பாடு வெளிப்படுகிறது.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: சாலொமோனுடைய ஞானம்
  rationale: எபிரெய இணைநிலை அமைப்பு உடைமையைக் காட்டுகிறது. ‘ஞானம்’ என்பது வெறும் அறிவை மட்டுமல்லாமல் விவேகத்தையும் ஆழ்ந்த புரிதலையும் உள்ளடக்குகிறது.
- source_word: וְהַבַּיִת
  choice: வீடு
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு.’ அரசச் சூழலில் இது சாலொமோனின் அரண்மனை வளாகத்தைக் குறிக்கக்கூடும்; இருப்பினும் மூலத்தின் பரந்த சொல்லாட்சியை முதன்மை உரை தக்கவைக்கிறது.
- source_word: אֲשֶׁר בָּנָה
  choice: அவன் கட்டியிருந்த
  rationale: ‘வீட்டை’ விவரிக்கும் தொடர்புத் தொடர். அரசி அதைக் கண்ட நேரத்திற்கு முன்பே கட்டுமானம் முடிந்திருந்ததை ‘கட்டியிருந்த’ இயல்பாகக் காட்டுகிறது.
