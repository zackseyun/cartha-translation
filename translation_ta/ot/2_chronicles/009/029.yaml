  to: சாலொமோனின் மற்ற செயல்கள், தொடக்கமுதல் முடிவுவரை, இறைவாக்கினரான நாத்தானின் பதிவில்[a], சீலோவைச் சேர்ந்த அகியாவின் இறைவாக்கில், நேபாத்தின் மகன் யெரொபெயாமைக் குறித்து[b] காட்சியாளரான இத்தோவின் தரிசனங்களில் எழுதப்பட்டிருக்கின்றன அல்லவா?
