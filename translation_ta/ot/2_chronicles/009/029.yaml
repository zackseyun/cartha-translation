source:
  edition: WLC
  text: וּ/שְׁאָר֙ דִּבְרֵ֣י שְׁלֹמֹ֔ה הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרוֹנִ֑ים הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל נְבוּאַ֞ת אֲחִיָּ֣ה הַ/שִּֽׁילוֹנִ֗י וּ/בַ/חֲזוֹת֙ יעדי הַ/חֹזֶ֔ה עַל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: The rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
translation:
  language: ta
  text: சாலொமோனின் மற்ற செயல்கள், தொடக்கமுதல் முடிவுவரை, இறைவாக்கினரான நாத்தானின் பதிவில்[a], சீலோவைச் சேர்ந்த அகியாவின் இறைவாக்கில், நேபாத்தின் மகன் யெரொபெயாமைக் குறித்து[b] காட்சியாளரான இத்தோவின் தரிசனங்களில் எழுதப்பட்டிருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இறைவாக்கினரான நாத்தானின் வார்த்தைகள்/வரலாற்றுக் குறிப்பில்.’ எபிரெயச் சொல் பேச்சுகளையோ எழுதப்பட்ட பதிவையோ குறிக்கலாம்; இங்கு அது ஆவண ஆதாரத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நேபாத்தின் மகன் யெரொபெயாமுக்கு எதிராக.’ எபிரெய முன்னிடைச்சொல் ‘குறித்து,’ ‘பற்றி,’ அல்லது சில சூழல்களில் ‘எதிராக’ எனப் பொருள்படலாம்; இங்கு ஆதார நூலின் பொருளைச் சுட்டுவதால் ‘குறித்து’ பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה
  choice: சாலொமோனின் மற்ற செயல்கள்
  rationale: அரச வரலாற்றுச் சுருக்கங்களில் דִּבְרֵי என்பது பேச்சுகளை மட்டும் அல்லாமல் செயல்கள் அல்லது நிகழ்வுகளையும் குறிக்கும்; இங்கு இயல்பான தமிழில் ‘செயல்கள்’ பொருத்தமானது.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים
  choice: தொடக்கமுதல் முடிவுவரை
  rationale: சாலொமோனைப் பற்றிய முழுக் காலப்பரப்பையும் குறிக்கும் எபிரெய மரபுத்தொடரின் மொத்தப்படுத்தும் பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டிருக்கின்றன அல்லவா?
  rationale: ஆவண ஆதாரங்களைச் சுட்டும் மரபான வினாவடிவத்தையும் அதன் உறுதிப்படுத்தும் தொனியையும் காக்கிறது.
- source_word: עַל דִּבְרֵי נָתָן הַנָּבִיא
  choice: இறைவாக்கினரான நாத்தானின் பதிவில்
  rationale: כתב உடன் வரும் עַל ஆதார நூலைச் சுட்டுகிறது; இங்கு דִּבְרֵי பெரும்பாலும் எழுதப்பட்ட வரலாற்றுப் பதிவைக் குறிக்கும் என்பதால் ‘பதிவு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי
  choice: சீலோனியரான அகியாவின் இறைவாக்கில்
  rationale: נְבוּאָה என்பதன் நேரான பொருளான ‘இறைவாக்கு’ காக்கப்படுகிறது; השילוני என்பது சீலோவைச் சேர்ந்தவர் என்ற அடையாளமாக மொழிபெயர்க்கப்படுகிறது.
- source_word: וּבַחֲזוֹת יֶעְדּוֹ הַחֹזֶה
  choice: திருக்காட்சியாளர் இத்தோ கண்ட காட்சிகளில்
  rationale: חֹזֶה என்ற தனிப்பட்ட தீர்க்கதரிசனப் பட்டத்தை ‘திருக்காட்சியாளர்’ என்று காட்டி, נָבִיא என்பதிலிருந்து உள்ள சொல்வேறுபாட்டைக் காக்கிறது; חֲזוֹת பன்மையான காட்சிகளைக் குறிக்கிறது.
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாமைக் குறித்து
  rationale: ஆவண ஆதாரப் பட்டியலின் சூழலில் עַל இயல்பாக ‘குறித்து’ என்று பொருள்படுகிறது; ‘எதிராக’ என்பதும் சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: עַל என்பதன் தொடர்புப்பொருள்
  choice: யெரொபெயாமைக் குறித்து
  alternative: யெரொபெயாமுக்கு எதிராக
  rationale: இந்த வசனத்தில் நூல் அல்லது காட்சிகளின் பொருளை அறிமுகப்படுத்தும் சூழல் இருப்பதால் ‘குறித்து’ என்பது மிக இயல்பானது; தீர்ப்புரையின் திசையை உரையில் கட்டாயப்படுத்தாமல் மாற்றுப் பொருள் அங்கீகரிக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. நָבִיא மற்றும் חֹזֶה ஆகிய வேறுபட்ட எபிரெயப் பட்டங்கள் முறையே ‘இறைவாக்கினர்’ மற்றும் ‘திருக்காட்சியாளர்’ என வேறுபடுத்தப்பட்டுள்ளன. வாசிப்பைச் சுமையாக்காததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
