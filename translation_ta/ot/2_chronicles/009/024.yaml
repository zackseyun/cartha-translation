- from: அவர்கள் ஒவ்வொருவரும் தங்கள் காணிக்கையாக[a] வெள்ளிப் பொருட்கள், பொன் பொருட்கள், ஆடைகள்[b], ஆயுதங்கள்[c], நறுமணப் பொருட்கள், குதிரைகள், கோவேறு கழுதைகள் ஆகியவற்றை ஆண்டுதோறும் கொண்டுவந்தார்கள்.
