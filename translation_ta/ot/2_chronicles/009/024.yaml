  text: וְ/הֵ֣ם מְבִיאִ֣ים אִ֣ישׁ מִנְחָת֡/וֹ כְּלֵ֣י כֶסֶף֩ וּ/כְלֵ֨י זָהָ֤ב וּ/שְׂלָמוֹת֙ נֵ֣שֶׁק וּ/בְשָׂמִ֔ים סוּסִ֖ים וּ/פְרָדִ֑ים דְּבַר שָׁנָ֖ה בְּ/שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: ta
  text: அவர்கள் ஒவ்வொருவரும் தத்தம் திறையாக[a] வெள்ளிப் பொருட்கள், பொன் பொருட்கள், ஆடைகள்[b], ஆயுதங்கள்[c], நறுமணப் பொருட்கள், குதிரைகள், கோவேறு கழுதைகள் ஆகியவற்றை ஆண்டுதோறும் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அன்பளிப்பாக’ அல்லது ‘பரிசாக.’ எபிரெயச் சொல் பொதுவாகக் கொடையையோ காணிக்கையையோ குறிக்கலாம்; இவ்வரசச் சூழலில் ‘திறை’ என்பது பொருத்தமான பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மேலாடைகள்.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘கவசங்கள்’ அல்லது பொதுவாக ‘போர்ச் சாதனங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִיאִים
  choice: கொண்டுவந்தார்கள்
  rationale: எபிரெயப் பெயரெச்ச வினைச்சொல் வழக்கமாகத் தொடர்ந்து நிகழ்ந்த செயலைக் குறிக்கிறது; ‘ஆண்டுதோறும்’ என்பதுடன் சேர்ந்து இத்தமிழ் வடிவம் அந்தத் தொடர்ச்சியான வழக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ מִנְחָתוֹ
  choice: ஒவ்வொருவரும் தங்கள் காணிக்கையாக
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொருவரும்’ என வருகிறது. מִנְחָה அரசரிடம் கொண்டுவரப்பட்ட பரிசையோ திறையையோ குறிக்கலாம்; ‘காணிக்கை’ அந்தப் பொருள் அகலத்தைத் தக்கவைக்கிறது.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: வெள்ளிப் பொருட்கள், பொன் பொருட்கள்
  rationale: כְּלִי என்பது பாத்திரங்கள் மட்டுமல்லாமல் பலவகைப் பொருட்களையும் குறிக்கும் பொதுச் சொல்; ஆகவே ‘பொருட்கள்’ என அகலமாக மொழிபெயர்க்கப்பட்டது.
- source_word: וּשְׂלָמוֹת
  choice: ஆடைகள்
  rationale: விலையுயர்ந்த மேலாடைகள் அல்லது அங்கிகளைக் குறிக்கக்கூடிய சொல்லை மிகக் குறிப்பாக்காமல் ‘ஆடைகள்’ என வழங்குகிறது.
- source_word: נֵשֶׁק
  choice: ஆயுதங்கள்
  rationale: இச்சொல் ஆயுதங்களையோ பரந்த போர்ச் சாதனங்களையோ குறிக்கலாம்; நவீனத் தமிழில் ‘ஆயுதங்கள்’ தெளிவான பொதுப் பொருளைத் தருகிறது.
- source_word: וּבְשָׂמִים
  choice: நறுமணப் பொருட்கள்
  rationale: அரசருக்கான பரிசுப் பட்டியலில் வரும் வாசனைமிக்க மசாலா அல்லது நறுமணப் பொருட்களை உள்ளடக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: סוּסִים וּפְרָדִים
  choice: குதிரைகள், கோவேறு கழுதைகள்
  rationale: இரண்டு விலங்குகளுக்கும் நேரான, பொதுவாகப் புரிந்துகொள்ளக்கூடிய தமிழ்ப் பெயர்கள் பயன்படுத்தப்பட்டுள்ளன.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: ஆண்டுதோறும்
  rationale: ஒவ்வோர் ஆண்டும் வழக்கமாக நிகழ்ந்ததைச் சுட்டும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
