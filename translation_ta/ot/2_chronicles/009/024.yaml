translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. பட்டியலின் எபிரெய வரிசை காக்கப்பட்டதுடன், தமிழில் இயல்பாக அமைய ‘ஆகியவற்றை’ சேர்க்கப்பட்டது; மூலத்தின் சொற்பொருள் ஐயங்கள் அடிக்குறிப்புகளில் தக்கவைக்கப்பட்டுள்ளன.
