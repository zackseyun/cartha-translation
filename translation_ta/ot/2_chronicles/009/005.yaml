base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/005.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: ta
  text: அப்போது அவள் அரசனிடம், “உங்கள் சொற்களையும் உங்கள் ஞானத்தையும் குறித்து என் நாட்டில் நான் கேள்விப்பட்ட செய்தி உண்மையே,” என்றாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உங்கள் காரியங்களையும் உங்கள் ஞானத்தையும் குறித்து என் நாட்டில் நான் கேள்விப்பட்டது உண்மையே.”'
    reason: דָּבָר என்ற சொல் இவ்வசனத்தில் ‘செய்தி/சொல்’ என்றும் ‘காரியம்/விவகாரம்’ என்றும் பொருள்படக்கூடிய சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: அப்போது அவள் ... என்றாள்
  rationale: தொடர்ச்சியாக நிகழும் அடுத்த செயலைக் குறிக்கும் wayyiqtol வடிவத்தை இயல்பான தமிழ் கதைநடையில் வெளிப்படுத்துகிறது.
- source_word: אֶל־הַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: אֱמֶת הַדָּבָר
  choice: செய்தி உண்மையே
  rationale: எபிரெயச் சொற்றொடர் கேட்ட தகவல் மெய்யானது என்பதை உறுதிப்படுத்துகிறது; ‘செய்தி’ என்பது இச்சூழலில் דָּבָר என்பதன் இயல்பான பொருள்.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: நான் கேள்விப்பட்ட
  rationale: தனது நாட்டில் பிறரிடமிருந்து அறிந்த செய்தியைக் குறிக்கும் சார்பு வாக்கியத்தை இயல்பாக வழங்குகிறது.
- source_word: בְּאַרְצִי
  choice: என் நாட்டில்
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עַל־דְּבָרֶיךָ
  choice: உங்கள் சொற்களையும்
  rationale: דְּבָרֶיךָ என்பதன் நேரடிப் பொருளான ‘உங்கள் சொற்கள்’ என்பதைப் பாதுகாக்கிறது; இதற்கு ‘உங்கள் காரியங்கள்/செயல்கள்’ என்ற பரந்த பொருளும் இருக்கலாம் என்பதால் அடிக்குறிப்பு தரப்படுகிறது.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: உங்கள் ஞானத்தையும் குறித்து
  rationale: சாலொமோனைப் பற்றிய இப்பகுதியின் மையக்கருத்தான ‘ஞானம்’ என்பதையும் இரண்டாம் நபர் உடைமையையும் நேரடியாகப் பாதுகாக்கிறது.
