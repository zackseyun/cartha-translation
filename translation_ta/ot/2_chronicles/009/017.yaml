  text: The king made a great ivory throne and overlaid it with pure gold[a].
translation:
  language: ta
  text: அரசன் தந்தத்தால் ஆன ஒரு பெரிய அரியணையைச் செய்து, அதைத் தூய தங்கத்தால் மூடினான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “பல்லால் ஆன அரியணை”; இத்தொடர் தந்த அரியணையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்து
  rationale: עשה என்பதன் இயல்பான பொருளான ‘செய்தல்’ என்பதை நேரடியாகவும் நவீனத் தமிழுக்கு ஏற்றவாறும் தருகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய உரை தனிப்பட்ட பெயரை அல்ல, குறிப்பிட்ட அரச பட்டத்தையே பயன்படுத்துவதால் அதையே நிலைநிறுத்துகிறது.
- source_word: כִּסֵּא
  choice: அரியணை
  rationale: அரசனுக்குரிய இருக்கை என்ற சூழலில் ‘அரியணை’ என்பதே பொருத்தமான பொருள்.
- source_word: שֵׁן
  choice: தந்த
  rationale: שֵׁן என்பதன் அடிப்படைப் பொருள் ‘பல்’; இக்கட்டமைப்பில் அது தந்தத்தைக் குறிக்கும் மரபுத்தொடராக இருப்பதால் ‘தந்த அரியணை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: גָּדוֹל
  choice: பெரிய
  rationale: அளவையும் மேன்மையையும் குறிக்கக்கூடிய மூலச்சொல்லின் பரந்த பொருளை எளிய தமிழில் பாதுகாக்கிறது.
- source_word: וַיְצַפֵּהוּ
  choice: அதைத் ... மூடினான்
  rationale: צפה என்பதன் பியேல் வடிவம் ஓர் பொருளின் மேற்பரப்பை வேறொரு பொருளால் மூடுதல் அல்லது பொதிதல் எனப் பொருள்படும்; ‘மூடினான்’ கூடுதல் தொழில்நுட்ப விவரத்தைச் சேர்க்காமல் அதைத் தருகிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கத்தால்
  rationale: பொருளையும் அதன் தூய்மையையும் இயல்பான தமிழ் சொற்றொடரில் நேரடியாக வெளிப்படுத்துகிறது.
