  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לְ/דִבְרֵי/הֶ֗ם עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּה֙ לֹ֣א הֻגַּד לִ֔/י חֲצִ֖י מַרְבִּ֣ית חָכְמָתֶ֑/ךָ יָסַ֕פְתָּ עַל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
translation:
  language: ta
  text: ஆனால் நான் வந்து என் கண்களால் காணும்வரை அவர்களுடைய வார்த்தைகளை நம்பவில்லை. இதோ, உமது ஞானத்தின் பெருமையில் பாதிகூட எனக்குச் சொல்லப்படவில்லை.[a] நான் கேட்ட செய்தியை நீர் விஞ்சியிருக்கிறீர்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது ஞானத்தின் மிகுதியில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நான் கேட்ட செய்தியை நீர் விஞ்சிவிட்டீர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: நம்பவில்லை
  rationale: இங்கு אמן என்பதன் ஹிஃபில் வடிவம், கேள்விப்பட்ட செய்தியை உண்மையென ஏற்றுக்கொள்வதைக் குறிக்கிறது; ‘நம்பவில்லை’ என்பது தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לְדִבְרֵיהֶם
  choice: அவர்களுடைய வார்த்தைகளை
  rationale: דבר என்பதன் அடிப்படைப் பொருளை நெருக்கமாகப் பேணுகிறது; சூழலில் இது அவர்கள் சொன்ன செய்திகளைக் குறிக்கிறது.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: என் கண்களால் காணும்வரை
  rationale: ‘என் கண்கள் கண்டன’ என்ற எபிரெய வெளிப்பாட்டின் நேரடி அனுபவத்தையும் வலியுறுத்தலையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה வெளிப்படுத்தும் கவன ஈர்ப்பையும் வியப்பையும் சுருக்கமாகப் பேணுகிறது.
- source_word: מַרְבִּית חָכְמָתֶךָ
  choice: உமது ஞானத்தின் பெருமை
  rationale: מַרְבִּית என்பதில் உள்ள மிகுதி அல்லது பெருமை என்ற பொருளைத் தருகிறது; அதன் ‘மிகுதி’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பேணப்படுகிறது.
- source_word: הֻגַּד לִי
  choice: எனக்குச் சொல்லப்படவில்லை
  rationale: נגד என்பதன் ஹொஃபால் வடிவிலுள்ள செயப்பாட்டு பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יָסַפְתָּ עַל
  choice: மிகுந்தவராய் இருக்கிறீர்
  rationale: இங்கு יסף + על முன்னர் கேட்ட செய்தியைக் கடந்திருக்கிற ஒப்பீட்டைக் குறிக்கிறது; ஞானமுள்ள நபரிடம் நேரடியாகப் பேசும் தமிழ்ச் சொல்லாக்கமாக இது இயல்பாக அமைகிறது.
- source_word: הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: நான் கேட்ட செய்தி
  rationale: שְׁמוּעָה என்பது கேள்விப்பட்ட செய்தி அல்லது அறிக்கையைக் குறிக்கிறது; ‘செய்தி’ தேவையற்ற எதிர்மறை நிழற்பொருள் இன்றி இயல்பாக உள்ளது.
