  register: நவீன நிலையான தமிழில், அரசரிடம் பேசுவதற்கேற்ற மரியாதை ஒருமை (‘உமது’, ‘நீர்’) பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் வியப்பும் நேரில் கண்ட உறுதிப்பாடும் பேணப்பட்டுள்ளன; சொற்சொல்லான கடினத்தன்மை தவிர்க்கப்பட்டுள்ளது.
