  text: וַ/יַּגֶּד לָ֥/הּ שְׁלֹמֹ֖ה אֶת כָּל דְּבָרֶ֑י/הָ וְ/לֹֽא נֶעְלַ֤ם דָּבָר֙ מִ/שְּׁלֹמֹ֔ה אֲשֶׁ֧ר לֹ֦א הִגִּ֖יד לָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/002.yaml
  text: And Solomon answered all her questions[b][a]; nothing was hidden from Solomon that he did not explain to her.
translation:
  language: ta
  text: சாலொமோன் அவளுடைய எல்லாக் கேள்விகளுக்கும் பதிலளித்தார்.[a] அவர் அவளுக்குச் சொல்லாத எந்தக் காரியமும் சாலொமோனுக்கு மறைவாயிருக்கவில்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாலொமோன் அவளுடைய எல்லா விஷயங்களையும் அவளுக்குச் சொன்னார்.” எபிரெய மொழியில் இன்னும் நேரடியாக, “அவளுடைய எல்லாச் சொற்களையும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “சாலொமோனுக்கு மறைவாயிருந்த எந்தக் காரியத்தையும் அவர் அவளுக்குச் சொல்லாமல் இருக்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: பதிலளித்தார்
  rationale: נגד என்பதன் அடிப்படைப் பொருள் ‘சொல்/அறிவி’ என்பதாக இருந்தாலும், முந்தைய வசனத்தில் அரசி கடினமான கேள்விகளால் சாலொமோனைச் சோதித்த சூழலில், இங்கு அவற்றுக்குப் பதிலளித்ததையே குறிக்கிறது.
- source_word: אֶת כָּל דְּבָרֶיהָ
  choice: அவளுடைய எல்லாக் கேள்விகளுக்கும்
  rationale: דבר என்பதற்கு ‘சொல்’, ‘காரியம்’, ‘விஷயம்’ ஆகிய பொருள்கள் உண்டு. உடனடிச் சூழலில் அரசி முன்வைத்த கேள்விகள் அல்லது விவகாரங்களே குறிக்கப்படுவதால் இயல்பான தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: נֶעְלַם
  choice: மறைவானது
  rationale: עלם என்பதன் நிஃபால் வடிவம் ‘மறைந்திரு/மறைக்கப்பட்டிரு’ என்ற கருத்தைத் தருகிறது; மூல உருவகத்தைத் தக்கவைக்க ‘மறைவானது’ பயன்படுத்தப்பட்டது.
- source_word: דָּבָר
  choice: ஒன்றும்
  rationale: மறுப்புடன் வரும் ஒருமைச் சொல் ‘ஒரு காரியமும் இல்லை’ என்ற பொருளைத் தருவதால், இயல்பான தமிழில் ‘ஒன்றும்’ என வழங்கப்பட்டது.
- source_word: מִשְּׁלֹמֹה
  choice: சாலொமோனால் … அவருக்கு
  rationale: מן என்பது இங்கு ஒரு காரியம் யாரிடமிருந்து மறைந்திருக்கிறதோ அவரைக் குறிக்கிறது. தமிழின் இயல்பான வாக்கிய அமைப்புக்காக ‘சாலொமோனால் … அவருக்கு மறைவானது’ என்று அமைக்கப்பட்டது.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: விளக்கிச் சொல்ல முடியாதபடி
  rationale: இவ்வுறவுச்சொல் தொடர், சாலொமோன் அரசிக்குத் தெரிவிக்காத அல்லது விளக்காத காரியம் எதுவும் அவரிடமிருந்து மறைந்திருக்கவில்லை என்று கூறுகிறது. கடினமான கேள்விகளின் சூழலில் ‘விளக்கிச் சொல்ல’ இயல்பாக உள்ளது; ‘சொல்லாத’ என்ற நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
