translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. அரசரை மரியாதைப் பன்மையில் குறிப்பிடுகிறது. கேள்வி–பதில் சூழலை முதன்மை உரையில் இயல்பாக வெளிப்படுத்தி, דבר மற்றும் נגד ஆகியவற்றின் அதிக நேரடியான பொருள்களை அடிக்குறிப்புகளில் பாதுகாக்கிறது.
