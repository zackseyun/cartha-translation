base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/008.yaml
  text: Blessed be Yahweh your God[a], who delighted in you and set you on his throne as king for Yahweh your God. Because your God loved Israel, to establish them forever[c][b], he made you king over them to administer justice and righteousness.
translation:
  language: ta
  text: உங்கள் கடவுளாகிய யெகோவா போற்றப்படுவாராக[a]! அவர் உங்கள்மேல் மகிழ்ச்சி கொண்டு, உங்கள் கடவுளாகிய யெகோவாவுக்காக அரசராக இருக்கும்படி உங்களைத் தமது அரியணையில் அமர்த்தினார். உங்கள் கடவுள் இஸ்ரவேலை நேசித்து, அதை என்றென்றும் நிலைநிறுத்துவதற்காக, நீதியையும் நேர்மையையும் நிலைநாட்ட உங்களை அவர்கள்மேல் அரசராக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் கடவுளாகிய யெகோவா ஆசீர்வதிக்கப்படுவாராக!”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: வாழ்த்துரையின் வேண்டுதல் தன்மையையும் இயல்பான நவீனத் தமிழ் நடையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகத் திருப்பெயரை பொதுப்பட்டப் பெயரால் மாற்றாமல் தனிப்பெயராக வழங்குகிறது.
- source_word: חָפֵץ בְּךָ
  choice: உங்கள்மேல் மகிழ்ச்சிகொண்டு
  rationale: ஒருவரில் இன்பமும் விருப்பமும் கொள்வது என்ற வினையின் வெப்பமான உணர்வைத் தக்கவைக்கிறது.
- source_word: לְתִתְּךָ עַל כִּסְאוֹ
  choice: உங்களைத் தமது அரியணையில் அமர்த்தினார்
  rationale: அரசாட்சிக்கு நியமித்தல் என்ற சூழல்சார் பொருளையும், அரியணை கடவுளுடையது என்ற முக்கியமான சொல்லாட்சியையும் காக்கிறது.
- source_word: לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ
  choice: உங்கள் கடவுளாகிய யெகோவாவுக்காக அரசராக இருக்கும்படி
  rationale: அரசன் யெகோவாவின் சார்பிலும் அதிகாரத்தின் கீழும் ஆளும் உறவை மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: בְּאַהֲבַת אֱלֹהֶיךָ אֶת יִשְׂרָאֵל
  choice: உங்கள் கடவுள் இஸ்ரவேலை நேசித்து
  rationale: בְּ அமைப்பின் காரணப்பொருளை அடுத்த நோக்கவாக்கியுடன் இயல்பாக இணைக்கிறது.
- source_word: לְהַעֲמִידוֹ לְעוֹלָם
  choice: அதை என்றென்றும் நிலைநிறுத்த விரும்பியதால்
  rationale: ஒருமை பின்னொட்டை ‘அதை’ என்று காத்து, அது கூட்டுப்பெயரான இஸ்ரவேலைக் குறிக்கிறது என்பதைத் தெளிவாக்குகிறது; தமிழில் காரண-நோக்க உறவை இயல்பாக்க ‘விரும்பியதால்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ
  choice: உங்களை அவர்கள்மேல் அரசராக்கினார்
  rationale: சொல்லுக்குச் சொல் ‘கொடுத்தார்’ என்பதற்குப் பதிலாக அரச நியமனச் சூழலில் இயல்பான பொருளை வழங்குகிறது.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: நீதியையும் நேர்மையையும் நிலைநாட்ட
  rationale: அரசாட்சி சார்ந்த செயற்பாட்டை இயல்பான தமிழில் காட்டி, இரு எபிரெயச் சொற்களுக்கிடையேயான வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: כִּסְאוֹ (‘அவருடைய அரியணை’) யாருடையது?
  choice: ‘தமது அரியணை’ என்று கடவுளுடைய அரியணையாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை வலுவான இறையியல் குறிப்பில்லாத அரச வம்சத்தின் அரியணை எனப் புரிந்துகொள்ளலாம்.
  rationale: இலக்கணத்தில் இதன் முன்னிலை யெகோவாவே; சாலொமோனின் ஆட்சி கடவுளின் அதிகாரத்தின் கீழ் நடைபெறுகிறது என்ற நாளாகமத்தின் கூற்றை இம்மொழிபெயர்ப்பு காக்கிறது.
- issue: לְהַעֲמִידוֹ என்பதிலுள்ள ஒருமை பின்னொட்டு
  choice: ‘அதை’ என்று மொழிபெயர்த்து, கூட்டுப்பெயரான இஸ்ரவேலைக் குறிக்கவிடப்பட்டது.
  alternative: மக்களைக் குறிக்கும் பொருளில் ‘அவர்களை’ என்று மொழிபெயர்க்கலாம்.
  rationale: எபிரெய மூலத்தின் இலக்கண ஒருமையைத் தக்கவைத்தபடியே, அடுத்துள்ள பன்மை ‘அவர்கள்மேல்’ என்பதுடன் கூட்டுப்பெயரின் இயல்பான பொருள் வெளிப்படுகிறது.
- issue: צְדָקָה அரசாட்சி சூழலில்
  choice: מִשְׁפָּט என்பதற்கு ‘நீதி’, צְדָקָה என்பதற்கு ‘நேர்மை’ என வேறுபடுத்தப்பட்டது.
  alternative: ‘நீதியும் நியாயமும்’ அல்லது ‘நீதியும் நீதிநெறியும்’.
  rationale: அரசன் நியாயமான தீர்ப்பையும் சரியான ஒழுங்கையும் நிலைநாட்ட வேண்டும் என்ற இணைச்சொல் கருத்தைத் தமிழில் இயல்பாகக் காக்கிறது.
translation_notes:
  register: மரியாதை ஒருமைக்குப் பதிலாக அரசரிடம் உரையாடும் நவீன மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. நடை தற்போதைய நிலையான தமிழில், கண்ணியமாகவும் பொதுவாசகருக்கு எளிதாகவும் வைக்கப்பட்டுள்ளது; ‘அரியணை’, ‘நிலைநிறுத்த’ போன்ற வேதாகமச் சூழலுக்கு ஏற்ற சொற்கள் பாதுகாக்கப்பட்டுள்ளன.
