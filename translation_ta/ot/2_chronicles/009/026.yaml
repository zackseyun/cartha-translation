  text: And he ruled over all the kings from the River to the land of the Philistines and to the border of Egypt[a].
translation:
  language: ta
  text: அவர் பேராறு முதல் பெலிஸ்தியரின் நாடு வரையும், எகிப்தின் எல்லை வரையும் உள்ள எல்லா அரசர்கள்மீதும் ஆட்சி செலுத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பேராறு” என்பது யூபிராத்து ஆற்றைக் குறிக்கலாம்; எபிரெய வேதாகமத்தில் இது வழக்கமான புவியியல் பெயராகப் பயன்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  choice: ஆட்சி செய்தார்
  rationale: היה என்பதுடன் வரும் משל வினையெச்சம் கடந்தகால ஆட்சிநிலையைச் சுட்டுகிறது; தமிழில் இயல்பான இறந்தகால வினையாக வழங்கப்பட்டது.
- source_word: בְּכָל הַמְּלָכִים
  choice: எல்லா அரசர்கள்மீதும்
  rationale: משל உடன் ב ஆட்சிக்குட்பட்டவர்களைக் குறிக்கிறது; ‘மீதும்’ என்பது மற்ற அரசர்கள்மேல் செலுத்திய மேலாதிக்கத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִן הַנָּהָר
  choice: பேராறு தொடங்கி
  rationale: எபிரெயத்தில் குறிப்பிட்ட ‘அந்த ஆறு’ இச்சூழலில் யூபிராத்து ஆற்றைக் குறிக்கும் வழக்கமான புவியியல் பெயர். மூலத்தின் பெயரிடும் முறையைத் தக்கவைக்க ‘பேராறு’ எனக் கொடுத்து, அடிக்குறிப்பில் அதன் அடையாளம் விளக்கப்படுகிறது.
- source_word: וְעַד אֶרֶץ פְּלִשְׁתִּים
  choice: பெலிஸ்தியரின் நாடு வரையிலும்
  rationale: மேற்குத் திசை எல்லையைக் குறிக்கும் சொற்றொடரை எபிரெய மூலத்துக்கு நெருக்கமாகவும் தமிழில் தெளிவாகவும் வழங்குகிறது.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: எகிப்தின் எல்லை வரையிலும்
  rationale: גְּבוּל என்பதன் நிலப்பரப்பு சார்ந்த ‘எல்லை’ என்ற பொருளையும் தென்மேற்கு வரம்பையும் நேரடியாகப் பாதுகாக்கிறது.
