translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் எண்ணிக்கையும் படைநிர்வாகச் சொற்களும் பாதுகாக்கப்பட்டுள்ளன; இணை வசனத்தின் வேறுபாடு அடிக்குறிப்பில் மறைக்காமல் தரப்பட்டுள்ளது.
