base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: ta
  text: சாலொமோனுக்கு குதிரைகளுக்கும் தேர்களுக்கும் உரிய நான்காயிரம் கொட்டில்கள்[a] இருந்தன; மேலும், பன்னிரண்டாயிரம் குதிரைவீரர்கள்[b] இருந்தனர். இவற்றை அவர் தேர்நகரங்களிலும், எருசலேமில் அரசனுடனும் நிலைநிறுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குதிரை லாயங்கள்.” אֻרְיוֹת என்ற எபிரெயச் சொல் குதிரைகளைத் தங்கவைக்கும் இடங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இதற்கு இணையான 1 இராஜாக்கள் 4:26-ல் “நாற்பதாயிரம் கொட்டில்கள்” என்று உள்ளது; ஆனால் இங்கே நாளாகமம் “நான்காயிரம்” என்று கூறுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: சாலொமோனுக்கு ... இருந்தன
  rationale: היה + ל என்ற எபிரெய உரிமை/இருப்பு மரபுத்தொடரை இயல்பான தமிழில் உரிமையையும் இருப்பையும் வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கிறது.
- source_word: אַרְבַּעַת אֲלָפִים
  choice: நான்காயிரம்
  rationale: எண்ணிக்கையை நேரடியாகவும் தெளிவாகவும் தருகிறது.
- source_word: אֻרְיוֹת
  choice: கொட்டில்கள்
  rationale: குதிரைகளைத் தனித்தனியாக அல்லது ஒழுங்குபடுத்தித் தங்கவைக்கும் இடங்களைக் குறிக்கும் சொல்லாக இங்கு பொருந்துகிறது; முழுக் குதிரை லாய வளாகங்களையே கட்டாயமாகக் குறிக்காது.
- source_word: סוּסִים וּמַרְכָּבוֹת
  choice: குதிரைகளுக்கும் தேர்களுக்கும்
  rationale: எபிரெயத்தில் உள்ள இரு பெயர்ச்சொற்களையும் காத்து, கொட்டில்கள் எவற்றுக்குரியவை என்பதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: மேலும், பன்னிரண்டாயிரம்
  rationale: எண்ணிக்கையையும் இணைப்பையும் நேரடியாக வழங்குகிறது.
- source_word: פָּרָשִׁים
  choice: குதிரைவீரர்கள்
  rationale: குதிரையில் சவாரி செய்யும் போர்வீரர்களைக் குறிக்கும் நேரடியான, நவீனத் தமிழ்ச் சொல்.
- source_word: וַיַּנִּיחֵם
  choice: அவர்களை ... நிறுத்திவைத்தார்
  rationale: இராணுவ நிர்வாகச் சூழலில் ஆட்களை குறிப்பிட்ட இடங்களில் நிலைநிறுத்திய கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: தேர்ப்படை நகரங்களில்
  rationale: தேர்களோடு தொடர்புடைய படைப்பிரிவுகள் நிறுத்தப்பட்ட சிறப்பு நகரங்கள் என்ற கருத்தை சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְעִם הַמֶּלֶךְ
  choice: அரசனுடனும்
  rationale: எபிரெயத்தின் எளிய சொல்லமைப்பைக் காத்து, படையினரில் ஒரு பகுதி அரசன் இருந்த இடத்தில் இருந்ததைச் சூழல் உணர்த்துமாறு விடுகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற இடப்பெயர் வடிவம்.
