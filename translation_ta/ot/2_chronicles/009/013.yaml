  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: ta
  text: ஓராண்டில் சாலொமோனிடம் வந்த தங்கத்தின் எடை அறுநூற்று அறுபத்தாறு தாலந்துகள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாலொமோனிடம் கொண்டுவரப்பட்ட தங்கம்.” எபிரெய மூலத்தில் சொற்சொல்லாக “சாலொமோனிடம் வந்த” என்று உள்ளது; அதைக் கொண்டுவந்தவர் யார் என்பது குறிப்பிடப்படவில்லை.
    reason: செய்பவர் குறிப்பிடப்படாத எபிரெயச் சொல்லாட்சிக்கான பொருள்சார் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தது (தமிழில் பெயர்ப் பயனிலையால் வெளிப்படுத்தப்பட்டது)
  rationale: இந்த வடிவம் கதைத் தொடரில் கூற்றை அறிமுகப்படுத்துகிறது. தமிழில் தேவையற்ற ‘இப்போது’ அல்லது ‘அப்போது’ போன்ற சொல்லைச் சேர்க்காமல், இயல்பான பெயர்ப் பயனிலை வாக்கியமாக அமைப்பது மூலத்தின் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: מִשְׁקַל הַזָּהָב
  choice: தங்கத்தின் எடை
  rationale: מִשְׁקַל என்பது பொதுவான அளவையோ மதிப்பையோ அல்ல, குறிப்பாக எடையைக் குறிக்கிறது; הַזָּהָב-இன் குறிப்புத்தன்மையும் இத்தொடரில் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר בָּא
  choice: வந்த
  rationale: எபிரெய வினைச்சொல் செய்பவரைக் குறிப்பிடாமல் ‘வந்தது’ என்று மட்டுமே கூறுகிறது. ‘கொண்டுவரப்பட்ட’ என்று மொழிபெயர்த்தால் மறைமுகமாக உள்ள செய்பாட்டை வெளிப்படையாகச் சேர்த்துவிடும்; ஆகவே மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: לִשְׁלֹמֹה
  choice: சாலொமோனிடம்
  rationale: இங்கு ל திசையையும் பெற்றுக்கொள்பவரையும் குறிக்கிறது. நவீனத் தமிழில் ‘சாலொமோனிடம்’ என்பது இந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּשָׁנָה אֶחָת
  choice: ஓராண்டில்
  rationale: ஒரு ஆண்டுக் காலத்திற்குள் வந்த மொத்தத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ
  choice: அறுநூற்று அறுபத்தாறு
  rationale: மூலத்தில் உள்ள எண்ணை எந்தக் குறியீட்டு விளக்கமும் சேர்க்காமல் துல்லியமாக வழங்குகிறது.
- source_word: כִּכְּרֵי זָהָב
  choice: தாலந்துகள்
  rationale: כִּכָּר என்பது பெரிய எடை அலகு; வேதாகமப் பயன்பாட்டில் அறியப்பட்ட ‘தாலந்து’ என்ற பெயர் தக்கவைக்கப்படுகிறது. வாக்கியத்தின் தொடக்கத்திலேயே தங்கம் குறிப்பிடப்பட்டிருப்பதால், தமிழில் தேவையற்ற மறுபடியுரையைத் தவிர்த்து அலகு மட்டும் இறுதியில் தரப்படுகிறது.
theological_decisions:
- issue: 666 என்ற எண்ணுக்கு இருக்கக்கூடிய குறியீட்டுப் பொருள்
  choice: அதை ஆண்டுதோறும் வந்த தங்கத்தின் வரலாற்று அளவாக மட்டும் நேரடியாக மொழிபெயர்த்தல்
  alternative: வேதாகமத்தின் பிற பகுதிகளில் 666 என்ற எண்ணுக்கு உள்ள பிற்காலக் குறியீட்டு ஒலிப்பை மொழிபெயர்ப்பிலேயே சுட்டிக்காட்டுதல்
  rationale: இவ்வசனத்தின் எபிரெய உரை தங்கத்தின் ஆண்டு எடையை மட்டுமே கூறுகிறது; அந்த எண்ணுக்குக் குறியீட்டு அல்லது இறையியல் விளக்கம் எதையும் இங்கே அளிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அத்தகைய தொடர்பை இறக்குமதி செய்யக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தாலந்து’ என்ற மரபான எடை அலகு பாதுகாக்கப்பட்டுள்ளது; செய்பவரைச் சேர்க்காமல் மூலத்தின் தெளிவின்மை தக்கவைக்கப்பட்டுள்ளது.
