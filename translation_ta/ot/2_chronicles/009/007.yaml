translation_notes:
  register: மரியாதைக்குரிய ஒருமையை வெளிப்படுத்த ‘உமது/உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. அரசவையின் உயர்ந்த தொனி காக்கப்பட்டாலும், பொதுவான நவீனத் தமிழ் வாசகர்களுக்குப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. மூலத்தில் இருமுறை வரும் אַשְׁרֵי என்பதற்கான இணையான அமைப்பு தமிழிலும் இருமுறை தக்கவைக்கப்பட்டுள்ளது.
