  terminology: ‘பேறுபெற்றவர்கள்’ אַשְׁרֵי-யின் வாழ்த்தத்தக்க/நற்பேறான நிலையை நன்றாக வெளிப்படுத்துகிறது. ‘பணியாளர்கள்’ அரசவையில் עֲבָדֶיךָ குறிக்கும் பணிச் சூழலுக்கு ஏற்புடையது. ‘ஞானம்’ חָכְמָתֶךָ-க்கு நேரடியானதும் நிலையானதுமான மொழிபெயர்ப்பு.
