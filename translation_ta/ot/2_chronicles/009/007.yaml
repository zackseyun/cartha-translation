  text: אַשְׁרֵ֣י אֲנָשֶׁ֔י/ךָ וְ/אַשְׁרֵ֖י עֲבָדֶ֣י/ךָ אֵ֑לֶּה הָ/עֹמְדִ֤ים לְ/פָנֶ֨י/ךָ֙ תָּמִ֔יד וְ/שֹׁמְעִ֖ים אֶת חָכְמָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/007.yaml
  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
translation:
  language: ta
  text: உமது ஆட்கள் பேறுபெற்றவர்கள்[a]! எப்போதும் உமக்கு முன்பாக நின்று[b] உமது ஞானத்தைக் கேட்கும் இந்த உமது பணியாளர்களும் பேறுபெற்றவர்கள்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகிழ்ச்சிக்குரியவர்கள்.” எபிரெயச் சொல் மகிழ்ச்சியான அல்லது நற்பேறு வாய்ந்த நிலையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உமக்கு முன்பாக நிற்பது” என்பது அரசனின் முன்னிலையில் இருந்து அவருக்குப் பணிபுரிவதைக் குறிக்கும் அரசவை மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவர்கள்
  rationale: இந்தச் சொல் மகிழ்ச்சியான, நற்பேறு வாய்ந்த, வாழ்த்தத்தக்க நிலையைக் குறிக்கிறது. தமிழில் உயர்ந்த தொனியையும் அந்த நிலைமையையும் இயல்பாக வெளிப்படுத்த ‘பேறுபெற்றவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֲנָשֶׁיךָ
  choice: உமது ஆட்கள்
  rationale: אֲנָשִׁים என்பதன் பொதுவான பொருள் ‘ஆண்கள்/மனிதர்கள்.’ அரசவைச் சூழலில் சாலொமோனைச் சேர்ந்த ஆண் அரசவையினரையோ அலுவலர்களையோ இது குறிக்கலாம்; ஆனால் மூலத்தில் இல்லாத குறிப்பிட்ட பதவியைச் சேர்க்காமல், இயல்பான தமிழில் ‘உமது ஆட்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்கள்
  rationale: עֶבֶד என்பது அடிமை அல்லது பணியாளர் எனப் பொருள்படலாம். இங்கு அரசவையில் அரசனுக்குப் பணிபுரிவதே முன்னிலைப்படுவதால் ‘பணியாளர்கள்’ சூழலுக்கு ஏற்றது.
- source_word: אֵלֶּה
  choice: இந்த
  rationale: பேசுபவரின் முன்னிலையில் உள்ள குறிப்பிட்ட பணியாளர்களைச் சுட்டும் எபிரெயச் சுட்டுப்பெயரின் வலிமையை ‘இந்த’ தக்கவைக்கிறது.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: உமக்கு முன்பாக நின்று
  rationale: சொற்றொடரின் நேரடியான காட்சியைத் தக்கவைக்கிறது; அரசவையில் அரசனின் முன்னிலையில் இருந்து அவருக்குப் பணிபுரிவதைக் குறிக்கும் மரபுத்தொடர் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: தொடர்ந்து அல்லது வழக்கமாக நிகழும் அரசவைப் பணியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; இடைவிடாத உடனிருப்பை அவசியமாக வலியுறுத்துவதில்லை.
- source_word: וְשֹׁמְעִים
  choice: கேட்கும்
  rationale: שׁמע என்பதன் அடிப்படைப் பொருளான ‘கேள்’ என்பதையும், இச்சூழலில் ஞானமொழிகளுக்குச் செவிகொடுக்கும் நுட்பத்தையும் தக்கவைக்கிறது.
- source_word: חָכְמָתֶךָ
  choice: உமது ஞானம்
  rationale: அரசனிடம் உள்ளதும் அவரால் வெளிப்படுத்தப்படுவதுமான ஞானத்தை எளிமையாகவும் நேரடியாகவும் குறிக்கிறது.
