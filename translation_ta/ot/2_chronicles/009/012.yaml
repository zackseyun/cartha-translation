  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மூலத்தின் மீளுரைப்பையும், מִלְּבַד மற்றும் וַתַּהֲפֹךְ ஆகியவற்றின் உண்மையான பொருள் நுணுக்கங்களையும் அடிக்குறிப்புகளுடன் காக்கிறது.
