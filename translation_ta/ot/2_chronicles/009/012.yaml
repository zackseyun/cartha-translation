base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
translation:
  language: ta
  text: அரசன் சாலொமோன் சேபாவின் அரசிக்கு அவள் விரும்பிய அனைத்தையும், அவள் கேட்டதையெல்லாம், அவள் அரசனிடம் கொண்டுவந்திருந்தவற்றுக்கு மேலுமாகக் கொடுத்தான்.[a] பின்பு அவள் திரும்பி, தன் நாட்டுக்குச் சென்றாள்; அவளும் அவளுடைய பணியாளர்களும் சென்றார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவள் அரசனிடம் கொண்டுவந்திருந்தவற்றைத் தவிர” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சாலொமோன் கொடுத்தவற்றையும் அரசி அவனிடம் கொண்டுவந்தவற்றையும் வேறுபடுத்திக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “அவள் தன் நாட்டுக்குத் திரும்பிச் சென்றாள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயில் சொல்லுக்குச் சொல், “அவள் திரும்பி, சென்றாள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: கொடுத்தான்
  rationale: பரிசுகள் வழங்கப்படும் இச்சூழலில் எளிமையான, நேரடியான பொருளைத் தருகிறது.
- source_word: מַלְכַּת שְׁבָא
  choice: சேபாவின் அரசி
  rationale: அரசப் பட்டத்தை இயல்பான தமிழில் மொழிபெயர்த்து, இடப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: כָּל חֶפְצָהּ
  choice: அவள் விரும்பிய அனைத்தையும்
  rationale: חֵפֶץ என்பது விருப்பத்தையோ விரும்பிய பொருளையோ குறிக்கலாம்; இச்சூழலில் இரண்டையும் இயல்பாக உள்ளடக்கும் சொற்றொடர்.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: அவள் கேட்டதையெல்லாம்
  rationale: அவள் விரும்பியவற்றை வேண்டிக் கேட்டாள் என்ற கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; மூலத்தின் வலியுறுத்தலையும் காக்கிறது.
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  choice: அரசனிடம் அவள் கொண்டுவந்திருந்தவற்றைத் தவிரவும்
  rationale: מִלְּבַד என்பதன் விலக்குதல் அல்லது கூடுதல் சார்ந்த நுணுக்கத்தைத் தீர்மானிக்காமல் வைத்துக்கொண்டு, அரசனின் கொடைகள் அவள் கொண்டுவந்தவற்றிலிருந்து வேறானவை என்பதைக் காட்டுகிறது.
- source_word: וַתַּהֲפֹךְ וַתֵּלֶךְ לְאַרְצָהּ
  choice: அவள் திரும்பி, தன் நாட்டுக்குச் சென்றாள்
  rationale: ‘திரும்பி/திரும்புதல்’ என்ற எபிரெய வினையின் இயக்கத்தையும், தொடர்ந்து வரும் தன் நாட்டுக்குச் செல்லுதலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: தன் பணியாளர்களுடன்
  rationale: அரசியுடன் பயணம் செய்த அரண்மனைச் சேவகர்களை இச்சூழலில் ‘பணியாளர்கள்’ எனக் குறிப்பிடுவது இயல்பானது; அவர்களின் சட்ட அல்லது அடிமை நிலையை உரை வலியுறுத்தவில்லை.
