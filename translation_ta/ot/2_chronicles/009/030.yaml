  yaml_path: translation/ot/2_chronicles/009/030.yaml
  text: And Solomon reigned in Jerusalem over all Israel forty years.
translation:
  language: ta
  text: சாலொமோன் எருசலேமில் இஸ்ரவேல் அனைத்தின்மேலும் நாற்பது ஆண்டுகள் அரசாண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டார்
  rationale: מלך என்பதன் தொடர்கதை வடிவம் கடந்தகால அரசாட்சியைக் குறிக்கிறது. ‘அரசாண்டார்’ என்பது அரசனாக ஆட்சி செய்தார் என்ற பொருளை இயல்பாகவும் குறிப்பாகவும் தருகிறது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: בִירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: בְ முன்னிடைச்சொல் இங்கு இடத்தைக் குறிக்கிறது; தமிழில் ‘-இல்’ என்ற இடவேற்றுமை இயல்பான இணை.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதையும்
  rationale: מלך உடன் வரும் עַל ஆளுகைக்கு உட்பட்ட மக்களையோ நாட்டையோ குறிக்கிறது. ‘இஸ்ரவேல் முழுவதையும்’ என்பது தேசியக் கூட்டுப்பொருளையும் முழுமையையும் காக்கிறது.
- source_word: אַרְבָּעִים שָׁנָה
  choice: நாற்பது ஆண்டுகள்
  rationale: எபிரெய மொழியில் எண்ணுக்குப் பின் ஒருமை வடிவில் வரும் காலஅளவு, தமிழில் இயல்பாகப் பன்மையில் மொழிபெயர்க்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான வரலாற்று நடையைப் பயன்படுத்தியுள்ளது. ‘ஆட்சி செய்தார்’ என்பதற்குப் பதில் அரசரின் ஆட்சியைத் தெளிவாகக் குறிக்கும் ‘அரசாண்டார்’ தேர்ந்தெடுக்கப்பட்டது.
