translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமானதும் பொதுவாசகருக்கு எளிதில் புரிவதுமான நடை. மூலத்தின் இரண்டு வணிகர் சொற்களும் தனித்த தமிழ்ச் சொற்களால் காக்கப்பட்டுள்ளன; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
