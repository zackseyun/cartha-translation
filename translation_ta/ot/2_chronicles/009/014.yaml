base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/014.yaml
  text: Besides what the traders and merchants brought, all the kings of Arabia and the governors of the land were bringing gold and silver to Solomon.
translation:
  language: ta
  text: வியாபாரிகளும் வணிகர்களும் கொண்டுவந்தவற்றைத் தவிர, அரேபியாவின் அரசர்கள் அனைவரும், நாட்டின் ஆளுநர்களும் சாலொமோனுக்குத் தங்கத்தையும் வெள்ளியையும் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי הַתָּרִים
  choice: வியாபாரிகள்
  rationale: சுற்றிச் சென்று வியாபாரம் செய்பவர்களைக் குறிக்கும் எபிரெயச் சொல்லின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַסֹּחֲרִים
  choice: வணிகர்கள்
  rationale: வர்த்தகத்தில் ஈடுபடுவோரைக் குறிக்கும் சொல்லை, முந்தைய சொல்லுடனான இணை அமைப்பையும் ஓரளவு வேறுபாட்டையும் காக்கும் வகையில் மொழிபெயர்க்கிறது.
- source_word: מַלְכֵי עֲרַב
  choice: அரேபியாவின் அரசர்கள்
  rationale: עֲרַב என்பதை இச்சூழலில் இடப்பெயராகப் புரிந்துகொள்ளும் பாரம்பரியமும் இணை வசனத்தின் ஆதாரமும் பொருந்துகின்றன; 'அரபிய அரசர்கள்' என்பதைவிட இது சாதாரண வாசகருக்குத் தெளிவு.
- source_word: פַחוֹת הָאָרֶץ
  choice: நாட்டின் ஆளுநர்கள்
  rationale: פַחוֹת என்பது மாகாண அல்லது நிர்வாக ஆளுநர்களைக் குறிக்கிறது; הָאָרֶץ என்பதன் பொதுவான 'நாடு/தேசம்' என்ற பொருளை மிகையாகக் குறிப்பாக்காமல் காக்கிறது.
- source_word: מְבִיאִים
  choice: கொண்டுவந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான அல்லது வழக்கமான செயல் நுணுக்கம் தமிழில் சூழலுக்கேற்ற இறந்தகால வினையால் இயல்பாக வெளிப்படுகிறது; இரு நிகழ்வுகளையும் தேவையின்றி வேறு காலநிலைகளாகப் பிரிக்கவில்லை.
