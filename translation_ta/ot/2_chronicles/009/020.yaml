translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அரச கட்டடத்தின் பெயர் சொற்சார்ந்த வடிவில் வைக்கப்பட்டு, விளக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது. மூலத்தின் தங்கம்–வெள்ளி எதிர்மறை வலியுறுத்தலும் வாக்கிய மீளுரைப்பும் பாதுகாக்கப்பட்டுள்ளன.
