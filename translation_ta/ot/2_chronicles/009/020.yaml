  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
translation:
  language: ta
  text: சாலொமோன் அரசனுடைய பானப் பாத்திரங்கள் அனைத்தும் தங்கத்தால் செய்யப்பட்டிருந்தன. ‘லெபனோன் வன இல்லத்தின்’[a] அனைத்துப் பாத்திரங்களும் தூய தங்கத்தால்[b] செய்யப்பட்டிருந்தன. சாலொமோனின் நாட்களில் வெள்ளி ஒரு பொருட்டாகக் கருதப்படவில்லை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லெபனோன் வன மாளிகை”; இது பெயரிடப்பட்ட ஓர் அரச கட்டடம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “அடைக்கப்பட்ட தங்கம்”; இது பொதுவாக “தூய தங்கம்” அல்லது “சுத்திகரிக்கப்பட்ட தங்கம்” என்று புரிந்துகொள்ளப்படும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “சாலொமோனின் நாட்களில் வெள்ளிக்கு எந்த மதிப்பும் இருப்பதாகக் கருதப்படவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: பானப் பாத்திரங்கள்
  rationale: כְּלֵי என்பது பலவகைப் பாத்திரங்களைக் குறிக்கும் விரிவான சொல்; מַשְׁקֵה அவை குடிப்பதற்குரியவை என வரையறுக்கிறது. ‘கோப்பைகள்’ என்று குறுக்காமல் இயல்பான தமிழில் பொருளைத் தருகிறது.
- source_word: זָהָב
  choice: தங்கம்
  rationale: மூலத்தின் நேரடியான பொருட்பெயர்; வசனத்தில் வரும் மீளுரைப்பும் தமிழில் தக்கவைக்கப்பட்டுள்ளது.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: ‘லெபனோன் வன இல்லம்’
  rationale: இது ஓர் குறிப்பிட்ட அரச கட்டடத்தின் பெயர். בֵּית என்பதற்கு ‘இல்லம்’ என்று நேரடியாக மொழிபெயர்த்து, பெயரின் தன்மையை மேற்கோள் குறிகளால் தெளிவாக்குகிறது; ‘மாளிகை’ என்பது பொருத்தமானாலும் சற்றே விளக்கவுரையானது.
- source_word: זָהָב סָגוּר
  choice: தூய தங்கம்
  rationale: ‘அடைக்கப்பட்ட தங்கம்’ என்பது தமிழில் தெளிவற்றதாக இருக்கும். இச்சொற்றொடர் உயர்தரமான அல்லது சுத்திகரிக்கப்பட்ட தங்கத்தைக் குறிக்கும் மரபுத்தொடர் என்பதால், இயல்பான ‘தூய தங்கம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  choice: வெள்ளி ஒரு பொருட்டாகவே எண்ணப்படவில்லை
  rationale: வெள்ளி ஒன்றுமில்லாததாகக் கருதப்பட்டதை மூலத்திற்கு நெருக்கமாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது; அதன் பொருளாதார மதிப்பை முற்றிலும் மறுத்ததாக அளவுக்கு மீறி விளக்கவில்லை.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: சாலொமோனின் நாட்களில்
  rationale: எபிரெயச் சொற்றொடரின் காலச்சுட்டை நேரடியாகப் பாதுகாக்கிறது; ‘ஆட்சிக்காலத்தில்’ என்று அரசியல் பொருளை அதிகமாக வெளிப்படுத்தவில்லை.
