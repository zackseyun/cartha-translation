  yaml_path: translation/ot/2_chronicles/009/022.yaml
  text: King Solomon surpassed all the kings of the earth in wealth and wisdom.
translation:
  language: ta
  text: சாலொமோன் அரசர் செல்வத்திலும் ஞானத்திலும் பூமியிலுள்ள எல்லா அரசர்களையும்விட மேன்மையடைந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: மேன்மையடைந்தார்
  rationale: גדל என்பதன் அடிப்படைப் பொருள் ‘பெரியவராதல்/மேன்மையடைதல்.’ מן உடனான ஒப்பீட்டு அமைப்பில், மற்ற அரசர்களைவிட உயர்ந்த நிலையை அடைந்தார் என்ற கருத்தை இது தருகிறது; நிகழ்ந்த வளர்ச்சியையும் ஒப்பீட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசர்
  rationale: அரசப் பட்டத்தையும் சாலொமோன் என்ற பெயரையும் நவீனத் தமிழில் இயல்பான மரியாதைமிக்க வரிசையில் வழங்குகிறது.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: பூமியிலுள்ள எல்லா அரசர்களையும்விட
  rationale: מן குறிக்கும் ஒப்பீட்டை ‘விட’ என்பதால் வெளிப்படுத்துகிறது. இங்குள்ள הָאָרֶץ சர்வதேச அளவிலான பரந்த ஒப்பீட்டைக் குறிப்பதால் ‘நாடு’ என்பதற்குப் பதில் ‘பூமி’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְעֹשֶׁר
  choice: செல்வத்தில்
  rationale: לְ இங்கு ஒப்பீடு நிகழும் துறையைச் சுட்டுகிறது. עֹשֶׁר என்பதற்கு ‘செல்வம்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: וְחָכְמָה
  choice: ஞானத்திலும்
  rationale: חָכְמָה என்பதன் ‘ஞானம்’ என்ற பொருளைத் தக்கவைத்து, இணையான இரண்டு துறைகளையும் தமிழில் ‘-த்திலும் ... -த்திலும்’ என்ற சமச்சீர் அமைப்பில் வழங்குகிறது.
