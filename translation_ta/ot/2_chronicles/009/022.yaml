translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயும் கண்ணியமானதாயும் உள்ள வேதாகம உரைநடை. எபிரெய ஒப்பீட்டு அமைப்பும், செல்வம் மற்றும் ஞானம் ஆகிய இரு துறைகளும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
