source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָֽ/אַלְגּוּמִּ֜ים מְסִלּ֤וֹת לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים וְ/לֹא נִרְא֥וּ כָ/הֵ֛ם לְ/פָנִ֖ים בְּ/אֶ֥רֶץ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
translation:
  language: ta
  text: அரசன் அல்கூம் மரத்தால்[b] யாவேவின் ஆலயத்திற்கும் அரசனின் அரண்மனைக்கும் நடைபாதைகளையும்[a], பாடகர்களுக்காக யாழ்களையும் வீணைகளையும் செய்தான். அவற்றைப் போன்றவை இதற்கு முன்பு யூதா நாட்டில் காணப்பட்டதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நடைபாதைகள்’ என்பதற்குப் பதிலாக ‘படிக்கட்டுகள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் கட்டடத்திற்குச் செல்லும் உயர்த்தப்பட்ட அணுகுவழிகளையோ படிக்கட்டுகளையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அல்கூம்’; இதற்கு இணையான 1 அரசர்கள் 10:12-இல் ‘அல்மூக்’ என்று உள்ளது. அது எந்த மர இனம் என்பது உறுதியாகத் தெரியவில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִּים
  choice: அல்கூம் மரம்
  rationale: இது அரிதாக வரும், இனத்தைத் துல்லியமாக அடையாளம் காண முடியாத விலையுயர்ந்த மரத்தின் பெயர். ஊகமான தாவரவியல் பெயருக்குப் பதிலாக எபிரெய வடிவம் ஒலிபெயர்க்கப்படுகிறது.
- source_word: מְסִלּוֹת
  choice: நடைபாதைகள்
  rationale: இச்சொல் பொதுவாக உயர்த்தப்பட்ட வழிகளைக் குறிக்கும்; இங்குள்ள கட்டடச் சூழலில் மரத்தால் அமைக்கப்பட்ட அணுகுவழிகள் என்று பொருள்படுகிறது. ‘படிக்கட்டுகள்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  choice: யாவேவின் ஆலயத்திற்கும் அரசனின் அரண்மனைக்கும்
  rationale: בַּיִת என்பதன் நேரடிப் பொருள் ‘வீடு/இல்லம்’; ஆனால் இச்சூழலில் முறையே ஆலயமும் அரச அரண்மனையும் குறிக்கப்படுவதால் இயல்பான நவீன தமிழில் அவ்வாறு மொழிபெயர்க்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதமொழியிலுள்ள இறைப் பெயரை ‘ஆண்டவர்’ போன்ற பட்டப்பெயரால் மாற்றாமல், Yahweh என்பதற்கான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כִנֹּרוֹת
  choice: யாழ்கள்
  rationale: כִּנּוֹר என்பது நரம்பிசைக் கருவி; தமிழில் பரவலாகப் புரியக்கூடிய பழமையான நரம்பிசைக் கருவிப் பெயரான ‘யாழ்’ பயன்படுத்தப்படுகிறது, ஆனால் கருவிகளுக்கு முழுமையான ஒற்றுமை இருப்பதாக இது கூறவில்லை.
- source_word: נְבָלִים
  choice: வீணைகள்
  rationale: נֵבֶל என்பது כִּנּוֹר இலிருந்து வேறுபட்ட மற்றொரு நரம்பிசைக் கருவி. துல்லியமான வடிவம் உறுதியில்லாததால், இரு கருவிகளின் வேறுபாட்டைக் காட்டும் இயல்பான தமிழ் இசைக்கருவிப் பெயர் தேர்ந்தெடுக்கப்படுகிறது.
- source_word: לַשָּׁרִים
  choice: பாடகர்களுக்காக
  rationale: שׁיר என்ற ‘பாடு’ என்னும் வேரிலிருந்து வந்த வடிவம் நேரடியாகப் பாடுகிறவர்களைக் குறிக்கிறது.
- source_word: וְלֹא נִרְאוּ כָהֵם לְפָנִים
  choice: அவற்றைப் போன்றவை இதற்கு முன்பு ... காணப்பட்டதில்லை
  rationale: முன்னர் இப்படிப்பட்டவை காணப்படவில்லை என்ற எபிரெயச் சொல்லாக்கத்தின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: யூதா நாட்டில்
  rationale: ‘நிலம்/நாடு’ என்ற வெளிப்படையான புவியியல் சொல்லைத் தக்கவைத்து நவீன தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதனை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: ‘அவற்றைப் போன்றவை’ என்பதன் சுட்டுப்பொருள்
  choice: முன்னர் கூறப்பட்ட செய்யப்பட்ட பொருட்களைப் பொதுவாகச் சுட்டுவதாக விடப்பட்டுள்ளது
  alternative: இசைக்கருவிகளை மட்டும் சுட்டுவதாகக் குறிப்பாக்குதல்
  rationale: எபிரெய ஆண்பால் பன்மை வடிவம் முன்னுள்ள பல பொருட்களைச் சுட்டக்கூடும்; எந்த ஒன்றை மட்டும் குறிக்கிறது என்று மூலமே தெளிவுபடுத்தாததால் மொழிபெயர்ப்பும் அந்த விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் மரியாதையும் எளிமையும் கலந்த நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கட்டடச் சொல்லிலுள்ள ஐயமும் மர இனத்தின் உறுதியின்மையும் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
