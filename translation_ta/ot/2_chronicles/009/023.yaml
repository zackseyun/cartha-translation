  text: וְ/כֹל֙ מַלְכֵ֣י הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן הָ/אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/023.yaml
  text: And all the kings of the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: ta
  text: உலகத்தின் அரசர்கள் அனைவரும் சாலொமோனைச் சந்திக்க நாடினார்கள்[a]; கடவுள் அவருடைய உள்ளத்தில் வைத்திருந்த ஞானத்தைக் கேட்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “சாலொமோனின் முகத்தை நாடினார்கள்”; இது அவரை அணுக அல்லது அவரிடம் சந்திப்புப் பெற நாடியதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל מַלְכֵי הָאָרֶץ
  choice: உலகத்தின் அரசர்கள் அனைவரும்
  rationale: וְכֹל தொடரும் உரையாடலில் ‘அனைவரும்’ என இயல்பாக வருகிறது. הָאָרֶץ இங்குள்ள பன்னாட்டு அரசச் சூழலில் ‘உலகம்’ என வழங்கப்பட்டுள்ளது; இது எபிரெய வெளிப்பாட்டின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: சாலொமோனைச் சந்திக்க நாடிவந்தார்கள்[a]
  rationale: சொல்லெழுத்தாக ‘சாலொமோனின் முகத்தை நாடினார்கள்’ என்றாலும், இது ஒருவரை நேரில் சந்திக்க அல்லது அவரிடம் அவை பெற நாடுவதை குறிக்கும் மரபுத்தொடர். தொடர்ச்சியான அல்லது மீண்டும் மீண்டும் நடந்த செயலைப் பன்மை இறந்தகாலத்தில் ‘நாடிவந்தார்கள்’ என இயல்பாகக் காட்டுகிறது.
- source_word: לִשְׁמֹעַ אֶת־חָכְמָתוֹ
  choice: அவருடைய ஞானத்தைக் கேட்பதற்காக
  rationale: לִשְׁמֹעַ நோக்கத்தைக் குறிக்கும் வினையெச்சம்; ‘கேட்பதற்காக’ என்பது நேரடியான மொழிபெயர்ப்பு. ‘அவருடைய ஞானம்’ என்ற மூலத்தின் சுருக்கமான வெளிப்பாடு விரிவாக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים בְּלִבּוֹ
  choice: கடவுள் அவருடைய உள்ளத்தில் வைத்திருந்த
  rationale: נתן அடிப்படையில் ‘கொடுத்தார்’ என்றாலும், בְּלִבּוֹ உடன் ‘உள்ளத்தில் வைத்திருந்த’ என்பது தமிழில் இயல்பாகவும் மூல உருவகத்திற்கு நெருக்கமாகவும் உள்ளது. לֵב அறிவு, மனவுறுதி உள்ளிட்ட உள்ளார்ந்த மனிதனைச் சுட்டுவதால் ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: சாலொமோனுடைய ஞானத்தின் தெய்வீக மூலம்
  choice: கடவுள் அவருடைய உள்ளத்தில் வைத்திருந்த
  alternative: கடவுள் அவருக்குக் கொடுத்திருந்த
  rationale: சாலொமோனின் ஞானம் கடவுளுடைய செயலால் உண்டானது என்பதை வசனம் வெளிப்படையாகக் கூறுகிறது. ‘உள்ளத்தில்’ என்பதைத் தக்கவைப்பது மூலத்தின் மனித உள்ளார்ந்த இயல்பைப் பற்றிய மொழியையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘முகத்தை நாடுதல்’ என்ற எபிரெய உருவகம் முதன்மை உரையில் இயல்பான பொருளாக வழங்கப்பட்டு, அடிக்குறிப்பில் சொல்லெழுத்தான வடிவம் பாதுகாக்கப்பட்டுள்ளது. இறுதி நோக்கவாக்கியத்தில் ‘அவர்கள் வந்தார்கள்’ என்பது தமிழில் தெளிவுக்காக வெளிப்படையாக மீண்டும் சேர்க்கப்பட்டுள்ளது.
