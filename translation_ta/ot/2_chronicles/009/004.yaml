revisions:
- from: அவருடைய மேசையில் பரிமாறப்பட்ட உணவையும், அவருடைய பணியாளர்களின் இருக்கை ஒழுங்கையும், அவருக்குப் பணிவிடை செய்தவர்கள் நின்றிருந்த ஒழுங்கையும் அவர்களுடைய உடைகளையும், அவருடைய பானம் பரிமாறுவோரையும் அவர்களுடைய உடைகளையும், யாவேயின் ஆலயத்திற்குச் செல்ல அவர் ஏறிய படிக்கட்டையும்[a] கண்டபோது, அவளுக்கு மூச்சே இல்லாமற்போனது[b].
  to: அவருடைய மேசையில் பரிமாறப்பட்ட உணவையும், அவருடைய பணியாளர்களின் இருக்கை ஒழுங்கையும், அவருக்காக நின்று பணியாற்றியவர்களின் ஒழுங்கையும் அவர்களுடைய உடைகளையும், அவருடைய பானம் பரிமாறுவோரையும் அவர்களுடைய உடைகளையும், யாவேயின் ஆலயத்திற்குச் செல்ல அவர் ஏறிச் சென்ற வழியையும்[a] கண்டபோது, அவளுக்கு இனி மூச்சே இருக்கவில்லை[b].
  rationale: The revision improves the final idiom’s Tamil naturalness while retaining its literal ‘breath’ imagery and footnoted explanation. It also smooths the attendants’ phrase and uses “ஏறிச் சென்ற வழி” in the main text so that the Hebrew ascent need not be narrowed exclusively to a constructed staircase; the stairway reading remains explicitly represented in the footnote.
