  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד מְשָׁרְתָ֜י/ו וּ/מַלְבּֽוּשֵׁי/הֶ֗ם וּ/מַשְׁקָי/ו֙ וּ/מַלְבּ֣וּשֵׁי/הֶ֔ם וַ/עֲלִיָּת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה ע֛וֹד בָּ֖/הּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
translation:
  language: ta
  text: அவருடைய மேசையில் பரிமாறப்பட்ட உணவையும், அவருடைய பணியாளர்களின் இருக்கை ஒழுங்கையும், அவருக்காக நின்று பணியாற்றியவர்களின் ஒழுங்கையும் அவர்களுடைய உடைகளையும், அவருடைய பானம் பரிமாறுவோரையும் அவர்களுடைய உடைகளையும், யாவேயின் ஆலயத்திற்குச் செல்ல அவர் ஏறிச் சென்ற வழியையும்[a] கண்டபோது, அவளுக்கு இனி மூச்சே இருக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, 1 இராஜாக்கள் 10:5 இல் உள்ள இணைப் பகுதியைப் பின்பற்றி, “யாவேயின் ஆலயத்தில் அவர் செலுத்திய தகனபலிகளையும்.” இங்குள்ள எபிரெய உரை மிகவும் இயல்பாக, “அவர் ஏறிச் சென்ற படிக்கட்டு/மேலேறும் வழி” என்று வாசிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: சொல்லர்த்தமாக, “அவளில் இனி மூச்சு இருக்கவில்லை”; இது அளவுகடந்த வியப்பை வெளிப்படுத்தும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: அவருடைய மேசையில் பரிமாறப்பட்ட உணவு
  rationale: மַאֲכַל என்பது உண்ணும் உணவு அல்லது உணவு ஏற்பாட்டைக் குறிக்கிறது. அரசவையின் விருந்து ஏற்பாட்டை இயல்பான தமிழில் வெளிப்படுத்த ‘மேசையில் பரிமாறப்பட்ட உணவு’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: அவருடைய பணியாளர்களின் இருக்கை ஒழுங்கு
  rationale: מוֹשָׁב என்பது அமர்வு, இருக்கை, அல்லது இருக்கைகளின் ஏற்பாடு என்று பொருள்படும். அரசவைச் சூழலில் காணப்பட்ட ஒழுங்கமைந்த அமர்வை ‘இருக்கை ஒழுங்கு’ தெளிவாகக் காட்டுகிறது; עֲבָדָיו இங்கு அடிமைகள் என்பதைவிட அரசப் பணியாளர்களைக் குறிக்கிறது.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: அவருக்குப் பணிவிடை செய்தவர்கள் நின்றிருந்த ஒழுங்கு
  rationale: מַעֲמַד என்பதில் நிற்றல் அல்லது நியமிக்கப்பட்ட நிலை என்ற காட்சிப்படிமம் உள்ளது. முந்தைய ‘இருக்கை ஒழுங்கு’ என்பதிலிருந்து வேறுபாட்டையும் பணிவிடையாளர்களின் ஒழுங்கமைந்த நிலையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: מַלְבּוּשֵׁיהֶם
  choice: அவர்களுடைய உடைகள்
  rationale: மַלְבּוּשׁ என்பது உடை அல்லது ஆடையைக் குறிக்கிறது. ‘உடைகள்’ என்பது தெளிவான, நவீன, நேரடியான தமிழ்.
- source_word: מַשְׁקָיו
  choice: அவருடைய பானம் பரிமாறுவோர்
  rationale: அரசவைச் சூழலில் இச்சொல் அரசனுக்குப் பானம் வழங்கும் பொறுப்புடையோரைக் குறிக்கிறது. தமிழில் இயல்பற்ற பதவிப்பெயரை உருவாக்காமல் பணியைத் துல்லியமாகக் கூறுகிறது.
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: யாவேயின் ஆலயத்திற்குச் செல்ல அவர் ஏறிய படிக்கட்டு
  rationale: மசோரா எபிரெய உரை இயல்பாக ஏறும் வழி அல்லது படிக்கட்டைக் குறிக்கிறது. 1 இராஜாக்கள் 10:5 இன் இணைப் பகுதியிலுள்ள ‘தகனபலிகள்’ என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בֵּית என்பது நேரடியாக ‘வீடு/இல்லம்’ என்றாலும், இச்சூழலில் வழிபாட்டுக் கட்டிடத்தை நவீன தமிழில் தெளிவாகக் குறிக்க ‘ஆலயம்’ பயன்படுத்தப்பட்டது. יהוה தனிப்பட்ட தெய்வீகப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  choice: அவளுக்கு மூச்சே இல்லாமற்போனது
  rationale: רוּחַ என்பதற்கு மூச்சு, ஆவி, காற்று ஆகிய பொருள்கள் உண்டு. இங்கு அதிர்ச்சியூட்டும் வியப்பைக் குறிக்கும் உயிரோட்டமான எபிரெய மரபுத்தொடரை விளக்கமாகச் சுருக்காமல் ‘மூச்சே இல்லாமற்போனது’ என்று காக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் நான்கு எழுத்துத் தெய்வீகப் பெயர் நேரடியாக வருகிறது. அதை ஒரு பட்டமாக மாற்றாமல் உடன்படிக்கையின் தனிப்பட்ட பெயராக வெளிப்படுத்த ‘யாவே’ என்ற பரவலாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: רוּחַ என்ற சொல்லின் பொருள்
  choice: மூச்சு
  alternative: ஆவி; மனத்திடம்
  rationale: இச்சூழலில் அந்த அரசி அடைந்த அளவுகடந்த வியப்பை விவரிக்கும் மரபுத்தொடரில் உடல்சார் ‘மூச்சு’ என்ற காட்சியே முதன்மையானது. ‘மனத்திடம்’ எனப் பொருள் விரித்து இறையியல் அல்லது உளவியல் விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், அரசவைக் காட்சியின் ஒழுங்கும் கண்ணியமும் தெளிவாகத் தோன்றும் நடை பயன்படுத்தப்பட்டது. ‘பணியாளர்கள்’ மற்றும் ‘பணிவிடை செய்தவர்கள்’ என்று வேறுபடுத்தி עֲבָדָיו / מְשָׁרְתָיו ஆகிய இரு குழுக்களின் வேறுபாடு காக்கப்பட்டது. தனித்து வாசிக்கும்போது தமிழ் வாக்கியம் முழுமையாக இருக்க, முந்தைய வசனத்திலிருந்து தொடரும் பார்வைச் செயல் ‘ஆகியவற்றைக் கண்டபோது’ என்ற தொடரில் வெளிப்படுத்தப்பட்டது. அடிக்குறிப்பு குறிகள் [a], [b] உரிய இடங்களில் முதன்மை உரையில் இடம்பெற்றுள்ளன.
