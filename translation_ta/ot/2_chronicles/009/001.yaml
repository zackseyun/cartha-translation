translation_notes:
  register: நவீன தரத் தமிழ்; எளிதில் புரியும், கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தில் இல்லாத தொடக்கக் கால/உரையாடல் இணைப்புச் சொல் சேர்க்கப்படவில்லை. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டது; கருத்து வரிசை பாதுகாக்கப்பட்டது.
