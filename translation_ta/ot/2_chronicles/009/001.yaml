  rationale: The revision removes the unintended second Jerusalem-arrival and attaches the entourage, camels, and goods directly to the queen’s one journey to Jerusalem. It preserves the subsequent, distinct statement that she came to Solomon. Minor phrasing adjustments improve modern Tamil flow while maintaining the Hebrew sequence and the heart idiom.
