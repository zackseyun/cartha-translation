  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: The queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
translation:
  language: ta
  text: சேபா நாட்டின் அரசி சாலொமோனின் புகழைக் கேள்விப்பட்டாள்.[a] அவள் விடுகதைகளால் சாலொமோனைச் சோதிப்பதற்காக, மிகப் பெரிய பரிவாரத்துடனும், நறுமணப் பொருட்கள், ஏராளமான தங்கம், விலையுயர்ந்த கற்கள் சுமந்த ஒட்டகங்களுடனும் எருசலேமுக்கு வந்தாள். அவள் சாலொமோனிடம் வந்து, அவளுடைய உள்ளத்தில் இருந்த அனைத்தையும் குறித்து அவருடன் பேசினாள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாலொமோனைப் பற்றிய செய்தியைக் கேள்விப்பட்டாள்.”
    reason: שֵׁמַע என்பது ‘புகழ்’ என்றும் ‘செய்தி/அறிக்கை’ என்றும் பொருள்படக்கூடும்.
  - marker: b
    text: “அவளுடைய உள்ளத்தில் இருந்த அனைத்தையும்” என்பது அவளுடைய எண்ணங்கள், கேள்விகள், கவலைகள் அனைத்தையும் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: மூலமொழியின் இதயம்/உள்ளம் சார்ந்த உருவகத்தின் பரந்த கருத்தை விளக்குகிறது.
lexical_decisions:
- source_word: שֵׁמַע
  choice: புகழைப் பற்றிக் கேள்விப்பட்டாள்
  rationale: இச்சூழலில் பெயர்ச்சொல் சாலொமோனைப் பற்றிப் பரவிய செய்தியையும் அதனால் ஏற்பட்ட புகழையும் குறிக்கிறது; தமிழ் வழக்கில் இந்தச் சொற்றொடர் இரு கூறுகளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְנַסּוֹת
  choice: சோதிப்பதற்காக
  rationale: சாலொமோனின் அறிவை விடுகதைகள் மூலம் பரிசோதிப்பதே இங்கு நோக்கம்.
- source_word: בְחִידוֹת
  choice: விடுகதைகளால்
  rationale: எபிரெயச் சொல் விடுகதைகள், புதிரான கூற்றுகள் ஆகியவற்றைக் குறிக்கிறது; ‘விடுகதைகள்’ அதன் துல்லியமான, பொதுவாகப் புரியும் தமிழ் இணை.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமுக்கு
  rationale: ב என்ற முன்னொட்டு பொதுவாக ‘இல்’ எனப் பொருள்பட்டாலும், இயக்க வினையுடன் இங்கு இலக்கைச் சுட்டுவதால் தமிழில் ‘எருசலேமுக்கு’ என்பது இயல்பானது.
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: மிகப் பெரிய பரிவாரத்தோடும்
  rationale: חַיִל வலிமை, படை, செல்வம் அல்லது கூட்டத்தைக் குறிக்கலாம்; ஒட்டகங்களும் மதிப்புமிக்க பொருட்களும் இடம்பெறும் அரசப் பயணச் சூழலில் ‘பரிவாரம்’ மிகவும் பொருத்தமானது.
- source_word: בְּשָׂמִים
  choice: நறுமணப் பொருட்கள்
  rationale: இப்பன்மைச் சொல் வாசனைமிக்க மசாலா அல்லது நறுமணப் பொருட்களைக் குறிக்கிறது; இனவகையை அளவுக்கு மீறிக் குறிப்பாக்காமல் தமிழில் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: לָרֹב
  choice: ஏராளமான
  rationale: தங்கம் மிகுந்த அளவில் இருந்ததைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אֶבֶן יְקָרָה
  choice: விலையுயர்ந்த கற்கள்
  rationale: ஒருமை வடிவிலுள்ள எபிரெயச் சொற்றொடர் இப்பட்டியலில் தொகுப்புப் பொருளில் வருகிறது; தமிழில் பன்மை இயல்பானது.
- source_word: וַתְּדַבֵּר עִמּוֹ
  choice: அவருடன் பேசினாள்
  rationale: עִם உடன் வரும் வினை ஒருதலைப்பட்ச உரையைவிட உரையாடலைச் சுட்டுகிறது.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: தன் உள்ளத்தில் இருந்த அனைத்தையும் குறித்து
  rationale: மனதில் இருந்த எண்ணங்கள், கேள்விகள், கவலைகள் அனைத்தையும் குறிக்கும் எபிரெய உருவகத்தை ‘உள்ளம்’ என்பதன் மூலம் பாதுகாக்கிறது.
