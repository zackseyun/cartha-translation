source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֧לֶךְ אֶת הַ/כֶּ֛סֶף בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
translation:
  language: ta
  text: ராஜா எருசலேமில் வெள்ளி கற்களைப்போல் ஏராளமாக இருக்கும்படி செய்தார்; கேதுருமரங்கள் தாழ்நிலப் பகுதியில்[a] உள்ள சிக்கமோர் அத்திமரங்களைப்போல் ஏராளமாக இருக்கும்படி செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஷெஃபெலாவில்”; இது யூதாவின் மத்திய மலைநாட்டுக்கு மேற்கே அமைந்துள்ள தாழ்நில அடிவாரப் பகுதி.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: ஏராளமாக்கினார் / மிகுதியாக்கினார்
  rationale: எபிரெய வினைச்சொல் அடிப்படையில் ‘கொடுத்தார்/வைத்தார்’ எனப் பொருள்பட்டாலும், இவ்விரு ஒப்பீடுகளிலும் ஒரு பொருளை மிகுதியாக இருக்கச் செய்தார் என்பதே மொழிவழக்குப் பொருள்.
- source_word: הַכֶּסֶף
  choice: வெள்ளி
  rationale: இங்கு நாணயப் பணத்தைக் குறிப்பாகச் சுட்டாமல், மதிப்புமிக்க உலோகமான வெள்ளியைக் குறிக்கிறது.
- source_word: כָּאֲבָנִים
  choice: கற்களைப்போல் ஏராளமாக
  rationale: ஒப்பீடு தோற்றத்தைவிட எண்ணிக்கையையும் பொதுவாகக் கிடைக்கும் நிலையையும் குறிக்கிறது; ‘ஏராளமாக’ என்பது அந்த உட்கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இடப்பொருளை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: הָאֲרָזִים
  choice: கேதுரு மரங்கள்
  rationale: கேதுரு மரங்களையோ அவற்றின் மரப்பொருளையோ குறிக்கக்கூடிய பன்மை வடிவம்; மூல உருவகத்தைத் தெளிவாகப் பேணுகிறது.
- source_word: כַּשִּׁקְמִים
  choice: அத்தி வகை மரங்களைப்போல்
  rationale: שִׁקְמִים என்பது பண்டைய அண்மைக் கிழக்கில் வளர்ந்த sycamore fig மரங்களைக் குறிக்கிறது; தமிழில் வெறும் ‘சிக்கமோர்’ என்ற ஒலிபெயர்ப்பைவிட ‘அத்தி வகை மரங்கள்’ பொதுவாசகருக்கு இயல்பாகப் புரியும்.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: பள்ளத்தாக்குப் பகுதியில்[a]
  rationale: שְׁפֵלָה என்பது பொதுவாகத் தாழ்வான பகுதியைக் குறித்தாலும், இங்கு யூதாவின் மத்திய மலைநாட்டுக்கு மேற்கிலுள்ள குறிப்பிட்ட அடிவாரப் பகுதியான ஷெஃபெலாவைக் குறிக்கிறது; உரையில் இயல்பான பொதுப்பெயரும் அடிக்குறிப்பில் புவியியல் விவரமும் தரப்படுகின்றன.
- source_word: לָרֹב
  choice: மிகுதியாக்கினார்
  rationale: கேதுரு மரங்களின் பெருக்கத்தை வலியுறுத்தும் சொல்லைத் தமிழ் வாக்கியத்தில் இயல்பாக ஒருங்கிணைக்கிறது.
