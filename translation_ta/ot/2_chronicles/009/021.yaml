translation_notes:
  register: இயல்பான, மரியாதைமிக்க நவீனத் தமிழில் வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. தர்ஷீசை முதலில் செல்லுமிடமாகவும் பின்னர் கப்பல்களுடன் தொடர்புடைய பெயராகவும் எபிரெய இலக்கண வேறுபாட்டுக்கு ஏற்ப வழங்கியுள்ளது; இறுதி விலங்குப் பெயரின் ஐயம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
