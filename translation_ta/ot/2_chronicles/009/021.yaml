  source_fidelity: எபிரெய மூலத்தின் விளக்கத் தொடர்பான כִּי, அரசனுக்குரிய கப்பல்கள், ஊராமின் பணியாளர்களுடனான பயணம், மூன்றாண்டுக்கு ஒருமுறையான வருகை, மற்றும் சரக்குப் பட்டியல் ஆகிய அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. முதல் இடத்தில் ‘தர்ஷீசுக்குச் செல்லும் கப்பல்கள்’ என்றும் இரண்டாம் இடத்தில் ‘தர்ஷீசுக் கப்பல்கள்’ என்றும் உள்ள வேறுபாடு மூலத்தின் வினைத் தொடர் மற்றும் பெயர்ச்சொல் இணைப்பை உரியவாறு காக்கிறது.
