base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/021.yaml
  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
translation:
  language: ta
  text: ஏனெனில், அரசனிடம் ஊராமின் பணியாளர்களோடு தர்ஷீசுக்குச் செல்லும் கப்பல்கள் இருந்தன. மூன்று ஆண்டுகளுக்கு ஒருமுறை தர்ஷீசுக் கப்பல்கள் பொன், வெள்ளி, தந்தம், குரங்குகள், மயில்கள்[a] ஆகியவற்றை ஏற்றிக்கொண்டு வந்து சேர்ந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “கிளிகள்”; இங்குள்ள எபிரெய விலங்குப் பெயரின் பொருள் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலில் கூறப்பட்ட அரசனின் செல்வத்திற்கான விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இயல்பாக அமைகிறது.
- source_word: אֳנִיּוֹת לַמֶּלֶךְ
  choice: அரசனிடம் ... கப்பல்கள் இருந்தன
  rationale: எபிரெய மொழியின் ‘அரசனுக்கு/அரசனுக்காக’ என்ற உடைமை அமைப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֹלְכוֹת תַּרְשִׁישׁ
  choice: தர்ஷீசுக்குச் செல்லும்
  rationale: வினையெச்சத்தையும் இடப்பெயரையும் இலக்கை அல்லது வணிகப் பாதையைச் சுட்டும் தொடராக நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: עִם עַבְדֵי חוּרָם
  choice: ஊராமின் பணியாளர்களோடு
  rationale: இங்கு அரசப் பணியில் உள்ள ஆட்களைச் சுட்டுவதால், அடிமை நிலையைத் தேவையின்றி வலியுறுத்தாத ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: மூன்று ஆண்டுகளுக்கு ஒருமுறை
  rationale: திரும்பத் திரும்ப நிகழ்ந்த கால இடைவெளியைத் தெளிவான நவீன தமிழில் வழங்குகிறது.
- source_word: תָּבוֹאנָה
  choice: வந்து சேர்ந்தன
  rationale: கடந்தகாலத்தில் வழக்கமாகத் திரும்ப நிகழ்ந்த வருகையை காலக் குறிப்புடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: தர்ஷீசுக் கப்பல்கள்
  rationale: இரண்டாம் இடத்தில் உள்ள பெயர்ச்சொல் இணைப்பைத் தக்கவைக்கிறது; இது தர்ஷீசுடன் தொடர்புடைய வணிகப் பாதை அல்லது கப்பல் வகையையும் குறிக்கக்கூடும்.
- source_word: שֶׁנְהַבִּים
  choice: தந்தம்
  rationale: வணிகப் பொருளாகக் குறிப்பிடப்படும் யானைத்தந்தப் பொருளுக்கான வழக்கமான தமிழ்ச் சொல்.
- source_word: וְקוֹפִים
  choice: குரங்குகள்
  rationale: இந்த விலங்குப் பெயருக்கான பொதுவான நவீனப் பொருள்; மனிதக் குரங்குகள் என்ற மாற்றுப் பொருளை விட பரந்தும் இயல்பாகவும் உள்ளது.
- source_word: וְתוּכִּיִּים
  choice: மயில்கள்
  rationale: மரபாக வழங்கப்படும் பொருள் தேர்ந்தெடுக்கப்பட்டது; எபிரெய விலங்குப் பெயரின் உறுதியின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
