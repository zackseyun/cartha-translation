  text: וַ/יִּפְשַׁ֨ע אֱד֜וֹם מִ/תַּ֣חַת יַד יְהוּדָ֗ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אָ֣ז תִּפְשַׁ֥ע לִבְנָ֛ה בָּ/עֵ֥ת הַ/הִ֖יא מִ/תַּ֣חַת יָד֑/וֹ כִּ֣י עָזַ֔ב אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
translation:
  language: ta
  text: ஏதோம் யூதாவின் ஆட்சியிலிருந்து கிளர்ச்சி செய்து பிரிந்தது[a][b]; அது இன்றுவரை அப்படியே உள்ளது. அப்போது லிப்னாவும் யோராமின் ஆட்சியிலிருந்து கிளர்ச்சி செய்து பிரிந்தது. ஏனெனில், அவன் தன் முன்னோர்களின் கடவுளாகிய யாவேவைக் கைவிட்டிருந்தான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கிளர்ச்சி செய்து பிரிந்தது’ என்பதற்கு ‘கலகம் செய்தது’ அல்லது ‘ஆட்சியை உதறிவிட்டது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘யூதாவின் கைக்குக் கீழிருந்து’ என்றும் பின்னர் ‘அவனுடைய கைக்குக் கீழிருந்து’ என்றும் உள்ளது. இது ஓர் ஆட்சியின் அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து விடுபடுவதைக் குறிக்கும் மொழிமரபு.
    reason: cultural_note
  - marker: c
    text: இந்தக் காரண வாக்கியம் யோராமின் துன்பங்களைப் பொதுவாக விளக்கலாம்; அல்லது குறிப்பாக லிப்னாவின் கிளர்ச்சியை மட்டும் விளக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  choice: கிளர்ந்து பிரிந்தது
  rationale: அரசியல் சூழலில் פשע என்பது ஆட்சியதிகாரத்திற்கு எதிராகக் கிளர்ச்சி செய்து அதிலிருந்து விலகுவதைக் குறிக்கிறது. ‘கிளர்ந்து பிரிந்தது’ என்பது கிளர்ச்சியின் வலிமையையும் அதன் விளைவான அரசியல் பிரிவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  choice: ஆட்சியிலிருந்து
  rationale: ‘கையின் கீழிருந்து’ என்ற எபிரெய மொழிமரபு ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து விடுபடுவதைக் குறிக்கிறது. சொற்படியாக மொழிபெயர்ப்பதைவிட ‘ஆட்சியிலிருந்து’ என்பது நவீன தமிழில் பொருளைத் தெளிவாகத் தருகிறது; மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: ராஜ்யம் மற்றும் கோத்திரத்தின் பெயருக்கான வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை அப்படியே இருக்கிறது
  rationale: இந்த நிலை நூலாசிரியரின் காலம்வரை தொடர்ந்ததைச் சுட்டும் எபிரெய காலவாய்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָז
  choice: அதே காலத்தில்
  rationale: ஏதோமின் கிளர்ச்சியுடன் தொடர்புடைய அதே காலப்பகுதியை இயல்பாகக் குறிக்கிறது.
- source_word: לִבְנָה
  choice: லிப்னா
  rationale: இடப்பெயருக்கான நேரடி தமிழ் ஒலிபெயர்ப்பு.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இறுதி வாக்கியப்பகுதி காரணத்தை அறிமுகப்படுத்துவதைத் தெளிவாகக் காட்டுகிறது; அந்தக் காரணம் எந்த நிகழ்வை விளக்குகிறது என்பதைக் கூடுதலாகத் தீர்மானிக்கவில்லை.
- source_word: עָזַב
  choice: கைவிட்டிருந்தான்
  rationale: עזב இங்கு யோராம் தன் முன்னோர்களின் கடவுளிடமிருந்து விலகியதன் உறவு மற்றும் உடன்படிக்கை சார்ந்த தீவிரத்தை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה என்பதை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: தன் முன்னோர்களின் கடவுள்
  rationale: אבותיו என்பதை பாலினத்தைச் சுருக்காமல் நவீன தமிழில் இயல்பாக ‘முன்னோர்கள்’ என அளித்து, அந்த முன்னோர்கள் வழிபட்ட உடன்படிக்கையின் கடவுளைச் சுட்டுகிறது.
theological_decisions:
- issue: கிளர்ச்சிகளுக்கான காரணத்தின் வரம்பு
  choice: ‘ஏனெனில்’ என்று காரண வாக்கியத்தை இணைத்தே வைத்தாலும், அது லிப்னாவின் கிளர்ச்சியை மட்டும் விளக்குகிறதா அல்லது யோராமின் அரசியல் துன்பங்கள் அனைத்தையும் பொதுவாக விளக்குகிறதா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.
  alternative: யோராம் யாவேவைக் கைவிட்டதே ஏதோம் மற்றும் லிப்னா ஆகிய இரண்டின் கிளர்ச்சிகளுக்கும் காரணம் என்று வெளிப்படையாக மொழிபெயர்ப்பது; அல்லது லிப்னாவின் கிளர்ச்சிக்கு மட்டுமே காரணம் என்று கட்டுப்படுத்துவது.
  rationale: எபிரெய தொடரமைப்பில் காரண வாக்கியம் லிப்னாவின் கிளர்ச்சியை உடனடியாகப் பின்தொடர்கிறது; அதேவேளையில் நாளாகம நூலின் விரிந்த இறையியல் நோக்கில் யோராமின் அரசியல் துன்பங்களைப் பொதுவாகவும் விளக்கக்கூடும். இந்தத் தெளிவின்மையை உரை மற்றும் அடிக்குறிப்பு பாதுகாக்கின்றன.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய அரசியல் மொழிமரபு பொருள் சார்ந்து மொழிபெயர்க்கப்பட்டு, அதன் சொற்படையான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. தெய்வீகப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
