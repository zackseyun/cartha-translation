  to: ஏதோம் யூதாவின் ஆட்சியிலிருந்து கிளர்ச்சி செய்து பிரிந்தது[a][b]; அது இன்றுவரை அப்படியே உள்ளது. அப்போது லிப்னாவும் யோராமின் ஆட்சியிலிருந்து கிளர்ச்சி செய்து பிரிந்தது. ஏனெனில், அவன் தன் முன்னோர்களின் கடவுளாகிய யாவேவைக் கைவிட்டிருந்தான்.[c]
  rationale: மூலத்தில் இல்லாத ‘எனவே’ நீக்கப்பட்டுள்ளது. அரசியல் பிணக்கின் வலிமையைத் தக்கவைக்க ‘கிளர்ச்சி செய்து பிரிந்தது’ பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் நிகழ்வின் ‘அவனுடைய கை’ என்பது யோராமைக் குறிக்கிறது என்பதால், நவீன தமிழில் தெளிவுக்காக ‘யோராமின் ஆட்சி’ எனக் கொடுக்கப்பட்டுள்ளது. காரணவாக்கியத்தின் நோக்க எல்லை பற்றிய மூலத்தின் சாத்தியமான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
