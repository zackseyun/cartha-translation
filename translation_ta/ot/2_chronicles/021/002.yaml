  text: וְ/לֽ/וֹ אַחִ֞ים בְּנֵ֣י יְהוֹשָׁפָ֗ט עֲזַרְיָ֤ה וִֽ/יחִיאֵל֙ וּ/זְכַרְיָ֣הוּ וַ/עֲזַרְיָ֔הוּ וּ/מִיכָאֵ֖ל וּ/שְׁפַטְיָ֑הוּ כָּל אֵ֕לֶּה בְּנֵ֥י יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
translation:
  language: ta
  text: 'அவனுக்கு யோசபாத்தின் மகன்களாகிய சகோதரர்கள் இருந்தார்கள்: அசரியா, யெகியேல், சகரியா, அசரியாஹு[a], மிகாயேல், செபத்தியா. இவர்கள் அனைவரும் இஸ்ரவேலின் அரசனான யோசபாத்தின் மகன்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நான்காவது பெயரின் எபிரெய எழுத்துவடிவம் முதல் ‘அசரியா’ என்ற பெயரிலிருந்து வேறுபடுகிறது; அந்த வேறுபாட்டைக் காட்ட இங்கு ‘அசரியாஹு’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயம்: ‘இஸ்ரவேலின் அரசன்.’ வரலாற்றில் யோசபாத் பொதுவாக யூதாவின் அரசன் என்று குறிப்பிடப்படுகிறார்; இங்கே நாளாகமம் ‘இஸ்ரவேல்’ என்பதை விரிந்த உடன்படிக்கைப் பொருளில் பயன்படுத்தியிருக்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֽ/וֹ אַחִים
  choice: அவனுக்குச் சகோதரர்கள் இருந்தார்கள்
  rationale: எபிரெய மொழியின் ‘அவனுக்கு சகோதரர்கள்’ என்ற உடைமைச் சொற்றொடரை இயல்பான தமிழில் தருகிறது; אַחִים என்பதைப் பரந்த உறவினராக அல்ல, உடன்பிறந்த ஆண் சகோதரர்களாகக் காட்டுகிறது.
- source_word: בְּנֵי יְהוֹשָׁפָט
  choice: யோசபாத்தின் மகன்களான
  rationale: சகோதரர்கள் யோசபாத்தின் மகன்கள் என்பதைத் தெளிவாகவும், பட்டியலுடன் இயல்பாக இணையுமாறும் தருகிறது.
- source_word: עֲזַרְיָה ... וַ/עֲזַרְיָהוּ
  choice: அசரியா ... அசரியாஹு
  rationale: முதல் பெயருக்கும் நான்காம் பெயருக்கும் எபிரெயத்தில் உள்ள எழுத்து வடிவ வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: וִֽ/יחִיאֵל
  choice: யெகியேல்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் அணுக்கமாகப் பெயர்க்கிறது.
- source_word: וּ/זְכַרְיָהוּ
  choice: சகரியா
  rationale: தமிழ் வாசகர்களுக்கு அறிமுகமான வடிவத்தைப் பயன்படுத்தியபடியே எபிரெயப் பெயரை அடையாளம் காணத்தக்கதாக வைத்திருக்கிறது.
- source_word: וּ/מִיכָאֵל
  choice: மிகாயேல்
  rationale: எபிரெயப் பெயரின் ஒலியமைப்புக்கு அணுக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּ/שְׁפַטְיָהוּ
  choice: செபத்தியா
  rationale: எபிரெயப் பெயரை இயல்பாக வாசிக்கக்கூடிய தமிழ் வடிவில் தருகிறது.
- source_word: כָּל אֵלֶּה
  choice: இவர்கள் அனைவரும்
  rationale: பட்டியலைத் தொகுத்துச் சொல்லும் எபிரெயச் சொற்றொடரின் இயல்பான தமிழ் இணை.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: மூல எபிரெயத்தில் உள்ள ‘இஸ்ரவேலின் அரசன்’ என்பதையே வைத்திருக்கிறது; வரலாற்றுச் சூழலுடன் ஒத்திசைக்க ‘யூதாவின் அரசன்’ என்று மாற்றவில்லை.
theological_decisions:
- issue: யோசபாத்துக்கான מֶלֶךְ יִשְׂרָאֵל என்ற பட்டம்
  choice: இஸ்ரவேலின் அரசன்
  alternative: யூதாவின் அரசன்
  rationale: எபிரெய மூலபாடம் வெளிப்படையாக ‘இஸ்ரவேலின் அரசன்’ என்கிறது. ‘யூதாவின் அரசன்’ என்பது வரலாற்றுச் சூழலோடு ஒத்திசைக்கும் விளக்க மாற்றமாகிவிடும். ‘இஸ்ரவேல்’ என்ற சொல்லை உடன்படிக்கை மக்களைக் குறிக்கும் விரிந்த பொருளில் நாளாகம ஆசிரியர் பயன்படுத்தியிருக்கக்கூடிய சாத்தியத்தையும் மூலத்தின் இறையியல் அழுத்தத்தையும் மொழிபெயர்ப்பு திறந்தவையாக வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய ஆனால் மரியாதைமிக்க வரலாற்று-வம்சவரிசை நடையில் அமைக்கப்பட்டுள்ளது. பெயர்கள் மூல எபிரெய ஒலியமைப்பையும் தமிழ் வாசிப்பின் இயல்பையும் சமநிலைப்படுத்துகின்றன. குறிப்புக்குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
