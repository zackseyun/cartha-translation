base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
translation:
  language: ta
  text: ஆனாலும், யெகோவா தாவீதின் வீட்டாரை அழிக்க விரும்பவில்லை; ஏனெனில், தாவீதோடு அவர் செய்த உடன்படிக்கையின் நிமித்தமும், தாவீதுக்கும் அவனுடைய மகன்களுக்கும் எல்லா நாட்களிலும் ஒரு விளக்கைக்[a] கொடுப்பதாக அவர் சொல்லியிருந்தபடியும் அவ்வாறு இருந்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விளக்கு’ என்பதற்கு ‘ஒளி’ என்றும் மொழிபெயர்க்கலாம். இங்கு அது தாவீதின் வம்சம் அல்லது அரசாட்சி தொடர்ந்து நிலைப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘எல்லா நாட்களிலும்’; இதை ‘என்றென்றும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: ஆனாலும் ... அழிக்க விரும்பவில்லை
  rationale: אָבָה என்பது வெறும் ஆசையைவிட மனவிருப்பம் அல்லது சம்மதத்தைக் குறிக்கிறது; முன்னுள்ள நியாயத்தீர்ப்புச் சூழலில் וְ என்பதன் மிதமான முரண்பாட்டை ‘ஆனாலும்’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பட்டத்தை மாற்றீடாக இடாமல், எபிரெய தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: לְהַשְׁחִית אֶת בֵּית דָּוִיד
  choice: தாவீதின் வீட்டாரை அழிக்க
  rationale: שׁחת என்பதன் காரணவினை வடிவுக்கு ‘அழிக்க’ நேரான பொருள். ‘தாவீதின் வீட்டார்’ என்பது בֵּית דָּוִיד என்ற வம்சத்தைக் குறிக்கும் வேதாகம மரபுத்தொடரை இயல்பான தமிழில் காக்கிறது.
- source_word: לְמַעַן הַבְּרִית אֲשֶׁר כָּרַת לְדָוִיד
  choice: அவர் தாவீதுடன் செய்த உடன்படிக்கையை முன்னிட்டு
  rationale: ‘உடன்படிக்கையை வெட்டுதல்’ என்ற எபிரெய மரபுத்தொடர் தமிழில் ‘உடன்படிக்கை செய்தல்’ என இயல்பாகிறது; לְמַעַן காரணத்தையும் அடிப்படையையும் காட்டுகிறது.
- source_word: וְכַאֲשֶׁר אָמַר
  choice: சொன்னதாலும்
  rationale: ‘வாக்குறுதி அளித்தார்’ என்று விளக்கிப் பெருக்காமல், தேவனுடைய முந்தைய சொல்லைச் சுட்டும் மூலத்தின் எளிய சொல்லாட்சியைப் பேணுகிறது.
- source_word: לָתֵת לוֹ נִיר וּלְבָנָיו
  choice: தாவீதுக்கும் அவனுடைய மகன்களுக்கும் ... ஒரு விளக்கைக் கொடுப்பதாக
  rationale: נִיר என்பதன் வம்சத் தொடர்ச்சியைக் குறிக்கும் உருவகத்தை ‘விளக்கு’ எனக் காக்கிறது; לוֹ ... וּלְבָנָיו என்பதில் உள்ள இரு பெறுநர்களையும் தெளிவாக இணைக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: எல்லா நாட்களிலும்
  rationale: ‘என்றென்றும்’ என்று பொருள் விரித்துத் தீர்மானிக்காமல், ‘எல்லா நாட்களும்’ என்ற எபிரெயச் சொற்றொடருக்கு நெருக்கமாக உள்ளது.
theological_decisions:
- issue: தாவீதின் உடன்படிக்கைச் சூழலில் נִיר என்ற வம்ச உருவகம்
  choice: விளக்கு
  alternative: ஒளி; வம்சம்
  rationale: தாவீதின் வழியும் ஆட்சியும் தொடர்வதை உருவகம் சுட்டினாலும், அதை ‘வம்சம்’ என்று வெளிப்படையாக மாற்றாமல் மூலத்தின் உருவகத்தையும் அதன் இறையியல் ஒலிப்பையும் காக்கிறது.
- issue: כָּל הַיָּמִים என்பதன் கால அளவு
  choice: எல்லா நாட்களிலும்
  alternative: என்றென்றும்
  rationale: சூழலில் நிலையான தொடர்ச்சி உட்பொருளாக இருக்கலாம்; இருப்பினும், மூலத்தின் சொற்றொடரைப் பேணி அதன் காலவியல் நுணுக்கத்தைத் தீர்த்து விடாமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘தாவீதின் வீட்டார்,’ ‘உடன்படிக்கை,’ ‘விளக்கு’ ஆகிய வேதாகமச் சொற்களும் உருவகமும் பேணப்பட்டுள்ளன; விளக்கவுரை அடிக்குறிப்புகளுக்குள் வைக்கப்பட்டுள்ளது.
