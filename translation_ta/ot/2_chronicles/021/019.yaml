  text: וַ/יְהִ֣י לְ/יָמִ֣ים מִ/יָּמִ֡ים וּ/כְ/עֵת֩ צֵ֨את הַ/קֵּ֜ץ לְ/יָמִ֣ים שְׁנַ֗יִם יָצְא֤וּ מֵעָי/ו֙ עִם חָלְי֔/וֹ וַ/יָּ֖מָת בְּ/תַחֲלֻאִ֣ים רָעִ֑ים וְ/לֹא עָ֨שׂוּ ל֥/וֹ עַמּ֛/וֹ שְׂרֵפָ֖ה כִּ/שְׂרֵפַ֥ת אֲבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
translation:
  language: ta
  text: சில காலம் கடந்தபின், இரண்டு ஆண்டுகள் முடிவடையும் வேளையில், அவனுடைய நோயினால் அவனுடைய குடல்கள் வெளியே வந்தன[a]. கொடிய நோய்களால் அவன் இறந்தான். அவனுடைய மக்களோ, அவனுடைய முன்னோர்களுக்குச் செய்ததைப்போன்ற தீமூட்டுதலை அவனுக்காகச் செய்யவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் பொதுவாக உடலின் உள்ளுறுப்புகளைக் குறிக்கிறது; இங்கு ‘அவனுடைய உள்ளுறுப்புகள் வெளியே வந்தன’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு தீமூட்டுதல் என்பது உடலைத் தகனம் செய்வதைக் குறிக்காமல், நறுமணப் பொருள்களை எரிப்பது போன்ற அரசருக்குரிய இறுதி மரியாதையைக் குறிக்கலாம்; நாளாகமப் புத்தகத்தில் காணப்படும் பிற அரச அடக்க வழக்கங்களோடு ஒப்பிடுக.
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  choice: சில காலம் கடந்தபின்
  rationale: இந்த எபிரெய மரபுத்தொடர் குறிப்பிட்ட கால அளவைக் கூறாமல் காலம் கடந்ததைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  choice: இரண்டு ஆண்டுகள் முடிவடையும் வேளையில்
  rationale: நோய் நீடித்த காலத்தின் முடிவை இரண்டு ஆண்டுகள் என்று உரை குறிப்பிடுகிறது; மூலத்தின் காலவுணர்வை இத்தொடர் காக்கிறது.
- source_word: מֵעָיו / יָצְאוּ מֵעָיו
  choice: அவனுடைய குடல்கள் வெளியே வந்தன
  rationale: מֵעִים என்பது உடலின் உள்ளுறுப்புகளை, குறிப்பாகக் குடல்களை, குறிக்கலாம். יצא என்பதன் நேரடியான ‘வெளியே வருதல்’ என்ற பொருளைக் காத்து, நிகழ்வின் கடுமையை மென்மைப்படுத்தாமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עִם חָלְיוֹ
  choice: அவனுடைய நோயினால்
  rationale: עִם பொதுவாக ‘உடன்’ எனப் பொருள்பட்டாலும், இங்கு நோய் அதற்குக் காரணமான அல்லது அதனுடன் இணைந்த சூழ்நிலையைக் குறிக்கிறது; காரணத் தொடர்பு இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְּתַחֲלֻאִים רָעִים
  choice: கொடிய நோய்களால்
  rationale: பெயர்ச்சொல்லின் பன்மையையும் நோய்களின் கடுமையையும் காக்கிறது; ‘கொடிய’ என்பது רָעִים என்பதன் இச்சூழலுக்குரிய தீவிரத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שְׂרֵפָה / כִּשְׂרֵפַת אֲבֹתָיו
  choice: அவனுடைய முன்னோர்களுக்காக மூட்டியதுபோன்ற தீ
  rationale: மூலத்தில் உள்ள ‘எரித்தல்/தீமூட்டுதல்’ என்ற சொல்லாட்சியைத் தெளிவாக வைத்திருக்கிறது; அதேவேளையில் உடலே எரிக்கப்பட்டதாகத் தமிழில் நேரடியாகத் தீர்மானிக்காமல், பண்பாட்டுப் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
theological_decisions:
- issue: அரசரின் இறுதிச்சடங்குச் சூழலில் שְׂרֵפָה என்பதன் தன்மை
  choice: முன்னோர் அரசர்களுக்கு அளிக்கப்பட்ட இறுதி மரியாதையுடன் தொடர்புடைய தீமூட்டுதல்; எகோராமின் உடல் தகனம் செய்யப்பட்டதாக உரையில் தீர்மானிக்கப்படவில்லை
  alternative: உடல் தகனம் அல்லது தன்மை குறிப்பிடப்படாத எரிப்புச் சடங்கு
  rationale: நாளாகமத்தின் அரசர் அடக்கச் சூழலில், முன்னோர் அரசர்களுக்குக் கிடைத்த மரியாதை எகோராமுக்கு மறுக்கப்பட்டதே வலியுறுத்தப்படுகிறது. பிரதான உரை மூலத்தின் ‘தீமூட்டுதல்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; அது நறுமணப் பொருள்களை எரித்தல் போன்ற இறுதி மரியாதையாக இருக்கக்கூடும் என்பதை அடிக்குறிப்பு எச்சரிக்கையுடன் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. நோயின் கொடுமை மென்மைப்படுத்தப்படவில்லை; இறுதிச்சடங்குத் தீ பற்றிய மூலத்தின் தெளிவின்மை உரையில் காக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
