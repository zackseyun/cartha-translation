translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான அரச வரலாற்றுத் தொனி பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மரண உருவகம் முதன்மை உரையில் காக்கப்பட்டு, அதன் நேரடிப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளன.
