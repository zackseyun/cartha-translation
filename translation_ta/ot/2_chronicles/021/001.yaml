  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹשָׁפָט֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑יד וַ/יִּמְלֹ֛ךְ יְהוֹרָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
translation:
  language: ta
  text: யோசபாத் தன் முன்னோர்களோடு துயிலடைந்தார்[a]; தாவீதின் நகரத்தில் தன் முன்னோர்களோடு அடக்கம் செய்யப்பட்டார்[b]. அவருக்குப் பதிலாக அவருடைய மகன் யோராம் அரசாண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறந்தார்”; சொல்லர்த்தமாக, “தன் முன்னோர்களோடு துயிலடைந்தார்.”
    reason: lexical_alternative
  - marker: b
    text: “தன் முன்னோர்களோடு” என்பது, மரணத்தில் ஒருவர் தம் மூதாதையரோடு சேர்ந்ததைக் குறிக்கும் எபிரெய மரபுத்தொடர்; இங்கு அவர்களோடு அடக்கம் செய்யப்பட்டதையும் சூழல் குறிப்பிடுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தார்
  rationale: அரச மரண அறிவிப்புகளில் இவ்வினைச்சொல் மரணத்தைக் குறிக்கும் மரபுத்தொடரின் பகுதி. ‘இறந்தார்’ என்று பொருளை மட்டும் வெளிப்படுத்தாமல், எபிரெய உருவகத்தையும் நினைவுகூரும் தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: אָבוֹת என்பதன் நேரடிப் பொருள் ‘தந்தையர்’ என்றாலும், இங்கு இறந்த மூதாதையரைச் சுட்டும் வம்ச மரபுத்தொடர். நவீன தமிழில் ‘முன்னோர்கள்’ பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டார்
  rationale: קבר என்ற சொல்லின் செயலப்பாட்டு வடிவைத் தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: בְּעִיר דָּוִיד
  choice: தாவீதின் நகரத்தில்
  rationale: எபிரெய இடப்பெயர் அமைப்பை நெருக்கமாகப் பின்பற்றி, பரவலாக அறியப்பட்ட வேதாகமப் பெயரமைப்பைக் காக்கிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டார்
  rationale: מלך என்பதையும் அரச வாரிசுரிமை அறிவிப்பின் மரபான தொனியையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: תַּחְתָּיו
  choice: அவருக்குப் பதிலாக
  rationale: முந்தைய அரசரின் இடத்தை மகன் ஏற்று அரசாண்ட வாரிசுரிமைப் பொருளை நேரடியாகக் காட்டுகிறது; வெறும் காலவரிசையைக் குறிக்கும் ‘அவருக்குப் பின்’ என்பதைவிட மூலத்துக்கு நெருக்கமானது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: יְהוֹרָם
  choice: யோராம்
  rationale: இங்குள்ள முழு எபிரெயப் பெயரான יְהוֹרָם-ஐ தமிழ் வாசிப்புக்கு ஏற்றவாறு ஒலிபெயர்க்கிறது.
