id: 2CH.21.14
reference: 2 Chronicles 21:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה נֹגֵ֛ף מַגֵּפָ֥ה גְדוֹלָ֖ה בְּ/עַמֶּ֑/ךָ וּ/בְ/בָנֶ֥י/ךָ וּ/בְ/נָשֶׁ֖י/ךָ וּ/בְ/כָל רְכוּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
translation:
  language: ta
  text: இதோ, யாவே[a] உன் மக்களையும், உன் மகன்களையும், உன் மனைவிகளையும், உன் உடைமைகள் அனைத்தையும் ஒரு பெரும் வாதையால் தாக்கப் போகிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: יהוה (YHWH). ‘யாவே’ என்பது பொதுவாகப் பயன்படுத்தப்படும் ஒலிபெயர்ப்பு; பழங்கால உச்சரிப்பு முழுமையாக உறுதியாகத் தெரியவில்லை.'
    reason: textual_or_pronunciation_clarification
  - marker: b
    text: “தாக்குகிறார்” அல்லது “ஒரு பெரும் அடியால்/துன்பத்தால் தாக்குவார்” என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பெயரெச்ச வினை நெருங்கிவரும் அல்லது நிகழும் செயலைக் குறிக்கலாம்; מַגֵּפָה என்பது வாதை, கொள்ளைநோய், அல்லது கடுமையான தெய்வீக அடி எனப் பொருள்படலாம்.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: தீர்க்கதரிசன அறிவிப்பின் கவன ஈர்ப்பையும் உடனடித் தன்மையையும் இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் இறைபெயரைத் தமிழில் பரவலாக அறியப்பட்ட வடிவில் பெயராகவே வழங்குகிறது; ‘கர்த்தர்’ என்ற பட்டமாக மாற்றவில்லை.
- source_word: נֹגֵף
  choice: தாக்கப்போகிறார்
  rationale: הִנֵּה உடன் வரும் நிகழ்காலப் பெயரெச்ச வடிவம் சூழலில் நெருங்கிவரும் தீர்ப்பைக் குறிக்க முடியும். தமிழ் வினை வடிவம் அந்த அண்மை எதிர்கால வலிமையை இயல்பாகத் தருகிறது.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: ஒரு பெரும் வாதையால்
  rationale: מַגֵּפָה என்பது கொள்ளைநோயையோ கடுமையான தெய்வீக அடியையோ குறிக்கலாம். ‘வாதை’ இந்த பொருள் அகலத்தைக் காக்கிறது; கருவிப் பொருளை ‘-ஆல்’ வெளிப்படுத்துகிறது.
- source_word: בְּעַמְּךָ
  choice: உன் மக்களையும்
  rationale: ב இங்கு தாக்குதலால் பாதிக்கப்படும் நேரடி இலக்கைக் குறிக்கிறது; தமிழ் ‘ஐ’ வேற்றுமை அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּבְבָנֶיךָ
  choice: உன் மகன்களையும்
  rationale: בָּנִים என்ற ஆண்பால் பன்மையைப் பொதுப்படுத்தாமல் துல்லியமாக வழங்குகிறது.
- source_word: וּבְנָשֶׁיךָ
  choice: உன் மனைவிகளையும்
  rationale: உடைமைச் சூழலில் נָשִׁים என்பது பொதுவாக பெண்களை அல்ல, மனைவிகளைக் குறிக்கிறது.
- source_word: וּבְכָל רְכוּשֶׁךָ
  choice: உன் உடைமைகள் அனைத்தையும்
  rationale: רְכוּשׁ குறிக்கும் சொத்து, செல்வம், பொருட்கள் ஆகியவற்றை உள்ளடக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைபெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழ் வாசகர்களிடையே பரவலாக அறியப்பட்ட வடிவைத் தேர்ந்தெடுத்துள்ளது; எபிரெய உச்சரிப்பு உறுதியாகத் தெரியாததால் மாற்று வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: נֹגֵף என்ற பெயரெச்ச வினையின் கால வலிமை
  choice: நெருங்கிய எதிர்காலம்—‘தாக்கப்போகிறார்’
  alternative: நிகழ்காலம்—‘தாக்குகிறார்’; எளிய எதிர்காலம்—‘தாக்குவார்’
  rationale: הִנֵּה + பெயரெச்ச வினை தீர்க்கதரிசன உரையில் உடனடியாக நிகழவிருக்கும் செயலைக் குறிக்கலாம். அதே நேரம் நிகழ்கால அல்லது எளிய எதிர்கால வாசிப்பும் இலக்கண ரீதியாக சாத்தியம் என்பதால் அடிக்குறிப்பில் ambiguity காக்கப்படுகிறது.
- issue: מַגֵּפָה என்பதன் தீர்ப்பு சார்ந்த பொருள்
  choice: வாதை
  alternative: கொள்ளைநோய்; கடுமையான அடி/துன்பம்
  rationale: இச்சொல் நோய்த் தொற்றை மட்டும் அல்லாமல் கடவுளால் வருகிற கடுமையான தாக்குதலையும் குறிக்க முடியும். ‘வாதை’ பொருளை தேவையின்றி குறுக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; தீர்க்கதரிசன எச்சரிக்கைக்குரிய கண்ணியமும் வலிமையும் காக்கப்பட்டுள்ளன. பட்டியல் அமைப்பு இயல்பான தமிழ் இணைப்புகளுடன் வழங்கப்பட்டுள்ளது; மூலத்தின் பொருள் ambiguity அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
