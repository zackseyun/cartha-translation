source:
  edition: WLC
  text: וַ/יָּ֨עַר יְהוָ֜ה עַל יְהוֹרָ֗ם אֵ֣ת ר֤וּחַ הַ/פְּלִשְׁתִּים֙ וְ/הָ֣/עַרְבִ֔ים אֲשֶׁ֖ר עַל יַ֥ד כּוּשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
translation:
  language: ta
  text: யாவே, யெகோராமுக்கு எதிராகப் பெலிஸ்தியர்களும் கூஷியர்களுக்கு அருகில் இருந்த அரேபியர்களும் கொண்டிருந்த ஆவியைத் தூண்டினார்[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எழுப்பினார்’ அல்லது ‘கிளர்ந்தெழச் செய்தார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல், யெகோராமுக்கு எதிராகப் பகைமையுடன் செயல்படும்படி யாவே இம்மக்களைத் தூண்டியதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கூஷியர்களுக்குப் பக்கத்தில் இருந்த.’ இச்சொற்றொடர் அரேபியர்கள் கூஷியர்களுக்கு அருகில் வாழ்ந்த புவியியல் நிலையைச் சுட்டலாம்.
    reason: lexical_alternative
  - marker: c
    text: மூலமொழியில் ‘பெலிஸ்தியர்களின் மற்றும் அரேபியர்களின் ஆவி’ என்பது ஒருமையில் உள்ளது; இது இரு மக்களையும் இயக்கிய பொதுவான பகைமை மனப்பாங்கைக் குறிக்கலாம்.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּעַר
  choice: தூண்டினார்
  rationale: இந்த வினைச்சொல் பகைமையுடன் செயல்படும்படி எழுப்புவதை அல்லது தூண்டுவதைச் சுட்டுகிறது. ‘தூண்டினார்’ என்பது தெய்வீகச் செயற்பாட்டைத் தெளிவாகக் காக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது எபிரெய வேதாகமத்தில் வரும் கடவுளின் தனிப்பட்ட பெயரான நான்கெழுத்துத் திருப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு; ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றப்படவில்லை.
- source_word: עַל יְהוֹרָם
  choice: யெகோராமுக்கு எதிராக
  rationale: பகைமையான செயலைக் குறிக்கும் இச்சூழலில் עַל என்பது ‘எதிராக’ என்ற பொருளைத் தருகிறது.
- source_word: רוּחַ
  choice: ஆவி
  rationale: רוּחַ என்பதற்கு ஆவி, காற்று, மனப்பாங்கு ஆகிய பொருள்கள் உண்டு. இங்கு இம்மக்களைப் பகைமையுடன் செயல்படத் தூண்டும் உள்நிலை அல்லது இயக்கும் ஆற்றலைக் குறிக்கிறது; ‘ஆவி’ மூலமொழியின் உருவகத்தையும் பொருள் விரிவையும் காக்கிறது.
- source_word: הַפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: பண்டைய இனக்குழுவின் தமிழில் வழக்கமான பெயர்.
- source_word: וְהָעַרְבִים
  choice: அரேபியர்கள்
  rationale: பண்டைய இனக்குழுவைக் குறிக்கும் பெயராக இச்சொல் பயன்படுத்தப்பட்டு, இன்றைய அரசியல் அல்லது தேசிய அடையாளத்தைத் தேவையின்றி முன்வைப்பது தவிர்க்கப்படுகிறது.
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  choice: கூஷியர்களுக்கு அருகில் இருந்த
  rationale: עַל יַד என்ற மரபுத்தொடர் பொதுவாக ‘அருகில், பக்கத்தில்’ எனப் பொருள்படும். இந்தப் புவியியல்/இனக்குழுச் சூழலில் அருகாமையைக் குறிக்கும் வாசிப்பு மிகவும் இயல்பானது.
theological_decisions:
- issue: யெகோராமுக்கு எதிராகப் பகைவர்களை எழுப்பியதில் யாவேயின் செயற்பாடு
  choice: இம்மக்களின் ஆவியை யாவே நேரடியாகத் தூண்டினார் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ஏற்கெனவே இருந்த பகைமை வெளிப்பட யாவே வெறுமனே அனுமதித்தார்.
  rationale: எபிரெய வினைச்சொல் இச்செயலை யாவேக்கு நேரடியாகக் கூறுகிறது. அதை வெறும் அனுமதியாக மென்மைப்படுத்தாமல், அதே நேரத்தில் வசனம் கூறாத விரிவான இறையியல் விளக்கத்தையும் சேர்க்காமல் மொழிபெயர்ப்பு பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. ‘ஆவி’ என்ற மூலமொழி உருவகம் காக்கப்பட்டது; வாக்கியத்தின் உடைமைத் தொடர் சற்றே இலக்கியத் தன்மை கொண்டிருந்தாலும் தெளிவாக உள்ளது. பண்டைய பெயர்கள் ‘யெகோராம்’, ‘பெலிஸ்தியர்கள்’, ‘அரேபியர்கள்’, ‘கூஷியர்கள்’ என ஒலிபெயர்க்கப்பட்டன.
