revisions:
- from: அவன் இஸ்ரவேல் அரசர்களின் வழியில் நடந்தான்; ஆகாபின் குடும்பத்தார் செய்ததுபோலவே அவனும் செய்தான். ஏனெனில் ஆகாபின் மகள் அவனுக்கு மனைவியாக இருந்தாள். அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான்.
  to: அவன் இஸ்ரவேல் அரசர்களின் வழியில், ஆகாபின் குடும்பம் செய்ததுபோலவே, நடந்தான்; ஏனெனில் ஆகாபின் மகள் அவனுடைய மனைவியாக இருந்தாள். அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான்.
  rationale: The revision retains all source-level content and the divine name while making the Ahab-house comparison modify ‘walked in the way’ directly. It also uses a collective expression for Ahab’s house that can bear the dynastic sense without adding interpretation.
