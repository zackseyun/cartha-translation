id: 2CH.21.6
reference: 2 Chronicles 21:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָ֥יְתָה לּ֖/וֹ אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/006.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: ta
  text: அவன் இஸ்ரவேல் அரசர்களின் வழியில், ஆகாபின் குடும்பம் செய்ததுபோலவே, நடந்தான்; ஏனெனில் ஆகாபின் மகள் அவனுடைய மனைவியாக இருந்தாள். அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: வழியில் நடந்தான்
  rationale: இது வாழ்க்கை நடத்தை அல்லது ஒழுக்கப் போக்கைக் குறிக்கும் எபிரேய உருவகச் சொற்றொடர். ‘வழியில் நடந்தான்’ என்பது அந்த உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்கள்
  rationale: வடக்கு அரசின் ஆட்சியாளர்களைக் குறிக்கும் நேரடியான உடைமைத் தொடர்புச் சொற்றொடர்.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: ஆகாபின் குடும்பத்தார் செய்ததுபோலவே
  rationale: בֵּית אַחְאָב என்பது ஆகாபின் அரசக் குடும்பத்தையும் வம்ச வீட்டாரையும் கூட்டாகக் குறிக்கிறது; பன்மை வினைச்சொல்லுக்கு ஏற்ப ‘குடும்பத்தார்’ இயல்பாக அமைகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஆகாபின் குடும்பத்தைப் போன்ற அவனது நடத்தைக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: בַּת אַחְאָב
  choice: ஆகாபின் மகள்
  rationale: வசனம் பெண்ணின் பெயரைச் சொல்லாமல் உறவுமுறையையே குறிப்பிடுவதால் அதையே மொழிபெயர்ப்பு காக்கிறது.
- source_word: הָיְתָה לּוֹ אִשָּׁה
  choice: அவனுக்கு மனைவியாக இருந்தாள்
  rationale: நடப்பிலிருந்த திருமண உறவைக் குறிக்கிறது; அந்த நேரத்தில்தான் திருமணம் நடந்தது என்ற பொருளைத் தவிர்க்கிறது.
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: குறிப்பிட்ட வடிவிலுள்ள הָרַע என்பதை ‘தீமையானது’ எனப் பொருள்படுத்தி, எபிரேய கட்டமைப்பைத் தெளிவான தமிழில் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் எபிரேய மரபுத்தொடரின் கருத்தையும் பார்வை உருவகத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. எனவே அதைப் பட்டப்பெயராக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தருவது மூல வேறுபாட்டைக் காக்கிறது.
- issue: בֵּית אַחְאָב என்பதன் பரப்பு
  choice: ஆகாபின் குடும்பத்தார்
  alternative: ஆகாபின் வம்சத்தார்
  rationale: இந்தச் சொற்றொடர் அரசக் குடும்பத்தையோ வம்சத்தையோ குறிக்கலாம். ‘குடும்பத்தார்’ என்பது வம்சத் தொடர்பை மறுக்காமல், ‘வம்சத்தார்’ என்று மட்டும் பொருளைக் குறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான வரலாற்று-வேதாகம நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேயத்தின் ‘வழியில் நடந்தான்’ மற்றும் ‘பார்வையில்’ என்ற உருவகங்கள் இயல்பாகக் காக்கப்பட்டுள்ளன.
