source:
  edition: WLC
  text: גַּם ה֥וּא עָשָֽׂה בָמ֖וֹת בְּ/הָרֵ֣י יְהוּדָ֑ה וַ/יֶּ֨זֶן֙ אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וַ/יַּדַּ֖ח אֶת יְהוּדָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
translation:
  language: ta
  text: அவனும் யூதாவின் மலைப்பகுதிகளில் வழிபாட்டு மேடைகளை அமைத்தான்; எருசலேமில் குடியிருந்தவர்களை வேசித்தனத்தில் ஈடுபடச் செய்தான்[a]; யூதாவையும் வழிதவறச் செய்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமில் குடியிருந்தவர்கள் தங்களை வேசிகளாக்கிக்கொள்ளச் செய்தான்.” இங்குள்ள எபிரெயச் சொல் பாலியல் ஒழுக்கக்கேட்டையும், வேறு தெய்வங்களைப் பின்பற்றுவதால் ஏற்படும் உடன்படிக்கைத் துரோகத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யூதாவை விலகிப்போகச் செய்தான்.” கர்த்தரிடமிருந்து விலகுதல் என்பது சூழலில் உணர்த்தப்பட்டாலும், எபிரெய மூலத்தில் அது வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: அவனும்
  rationale: גַּם என்பதன் தொடர்ச்சி மற்றும் வலியுறுத்தலை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: עָשָׂה בָמוֹת
  choice: வழிபாட்டு மேடைகளை அமைத்தான்
  rationale: בָמוֹת என்பது இச்சூழலில் உயர்ந்த இடங்களிலிருந்த வழிபாட்டுத் தலங்களைக் குறிக்கிறது. வெறும் ‘மேடைகள்’ என்று சொல்வதால் பொருள் தெளிவின்றிப் போகலாம்; ‘வழிபாட்டு’ என்பது சூழலிலேயே உள்ள பொருளைத் தெளிவாக்குகிறது.
- source_word: בְּהָרֵי יְהוּדָה
  choice: யூதாவின் மலைப்பகுதிகளில்
  rationale: הָרִים என்பது தனித்தனி மலைகளையும் ஒரு மலைநாட்டுப் பகுதியையும் குறிக்கலாம்; இங்கு புவியியல் பகுதியைக் குறிக்கும் இயல்பான தமிழ் நடை தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיֶּזֶן
  choice: வேசித்தனத்தில் ஈடுபடச் செய்தான்
  rationale: זנה என்பதன் காரணவினை வடிவம், அவர்களை வேசித்தனம் செய்ய வைத்தான் என்ற வலுவான உருவகத்தைத் தக்கவைக்கிறது. இச்சூழலில் அது பாலியல் ஒழுக்கக்கேட்டையும் உடன்படிக்கைத் துரோகமாகிய சமய விலகலையும் நினைவூட்டக்கூடும்.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: எருசலேமில் குடியிருந்தவர்கள்
  rationale: எருசலேமின் குடியிருப்பாளர்கள் என்ற பொருளை சாதாரண வாசகர்களுக்கு இயல்பான தமிழில் வழங்குகிறது.
- source_word: וַיַּדַּח אֶת יְהוּדָה
  choice: யூதாவையும் வழிதவறச் செய்தான்
  rationale: Hiphil வடிவிலுள்ள נדח ஒருவரை விலகச் செய்தல் அல்லது வழிதவறச் செய்தல் என்ற பொருள் தருகிறது. இங்கு யூதா மக்களைச் சரியான விசுவாசத்திலிருந்து விலகச் செய்த கருத்தை, எதிலிருந்து விலகினர் என்பதை மூலத்தைவிட வெளிப்படையாகச் சேர்க்காமல் தருகிறது.
theological_decisions:
- issue: வேசித்தனம் என்ற சொல் நேரடியான பாலியல் பொருளா அல்லது சமயத் துரோக உருவகமா
  choice: முதன்மை உரையில் வலுவான ‘வேசித்தனம்’ உருவகத்தை வைத்திருந்து, அதன் இரட்டைச் சாத்தியத்தை அடிக்குறிப்பில் விளக்குதல்
  alternative: அவர்களை இறைவனுக்கு உண்மையற்றவர்களாக்கினான்
  rationale: வழிபாட்டு மேடைகள் பற்றிய சூழல் சமயத் துரோகத்தை முன்னிறுத்தினாலும், எபிரெயச் சொல் பாலியல் உருவகத்தைத் திட்டவட்டமாகப் பயன்படுத்துகிறது. அதை அமைதியாக நீக்காமல் இரு நுணுக்கங்களும் பாதுகாக்கப்படுகின்றன.
- issue: யூதா எதிலிருந்து வழிதவறச் செய்யப்பட்டது என்பதை வெளிப்படையாகக் கூற வேண்டுமா
  choice: ‘யூதாவையும் வழிதவறச் செய்தான்’ என்று மூலத்தில் உள்ள மறைபொருளை மறைபொருளாகவே வைத்தல்
  alternative: யூதாவைக் கர்த்தரிடமிருந்து விலகச் செய்தான்
  rationale: சூழலில் கர்த்தரிடமிருந்து விலகுதல் தெளிவாக உணரப்பட்டாலும், இந்த வசனத்தின் எபிரெய உரையில் ‘கர்த்தரிடமிருந்து’ என்பது வெளிப்படையாக இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வேசித்தனம்’ என்ற வலுவான மூல உருவகம் மென்மையாக்கப்படாமல் வைக்கப்பட்டுள்ளது; அதன் சமய மற்றும் பாலியல் நுணுக்கங்கள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளன.
