  naturalness: உரை நவீன நிலையான தமிழில் தெளிவாகவும் வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் உள்ளது. ‘மலைப்பகுதிகள்,’ ‘குடியிருந்தவர்கள்,’ ‘வழிதவறச் செய்தான்’ ஆகியவை இயல்பானவை. ‘வேசித்தனத்தில் ஈடுபடச் செய்தான்’ என்பது மூலத்தின் வலுவான சொல்லுருவைத் தக்கவைத்துக்கொண்டு காரணவினைப் பொருளையும் தெளிவாகக் கொடுக்கிறது.
