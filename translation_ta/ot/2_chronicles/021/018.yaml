  yaml_path: translation/ot/2_chronicles/021/018.yaml
  text: And after all this[a], Yahweh struck him in his intestines with an incurable disease.
translation:
  language: ta
  text: இவை அனைத்திற்கும் பிறகு, யாவே அவனுடைய குடல்களில் குணமில்லாத ஒரு நோயால் அவனைத் தாக்கினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீர்வு இல்லாத”; சொல்லுக்குச் சொல், “குணப்படுத்துதல் இல்லாததாக.”
    reason: לְאֵין מַרְפֵּא என்பதன் மாற்றுச் சொல்லாட்சியையும் அதன் நேரடி வடிவத்தையும் காட்டுகிறது.
lexical_decisions:
- source_word: וְאַחֲרֵי כָּל זֹאת
  choice: இவை அனைத்திற்கும் பிறகு
  rationale: முந்தைய நிகழ்வுகளைத் தொகுத்துச் சுட்டும் காலத் தொடரை இயல்பான நவீனத் தமிழில் தருகிறது; தொடக்க வாவ் உரையோட்டத்தில் காலத் தொடரோடு இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: נְגָפוֹ
  choice: அவனைத் தாக்கினார்
  rationale: தெய்வீகத் தண்டனையின் நேரடியான வலிமையைப் பாதுகாக்கிறது; தாக்கிய விதத்தை மூலத்தைவிட அதிகமாகக் குறிப்பிடவில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்திலுள்ள தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பில் தருகிறது.
- source_word: בְּמֵעָיו
  choice: அவனுடைய குடல்களில்
  rationale: מֵעֶה இச்சூழலில் உள்ளுறுப்புகளை, குறிப்பாகக் குடல்களை, குறிக்கிறது; நவீனத் தமிழில் உடற்கூற்றுத் தெளிவை அளிக்கிறது.
- source_word: לָחֳלִי
  choice: ஒரு நோயால்
  rationale: அவனுக்கு ஏற்பட்ட கடுமையான உடல் நோய்நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְאֵין מַרְפֵּא
  choice: குணமாக்க முடியாத
  rationale: சொல்லாட்சியின் நேர்ப்பொருளான ‘குணமடைதல் இல்லாத’ என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; தீர்வு அல்லது குணம் இல்லாத நிலையைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் இறைவனுடைய தனிப்பெயரை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழில் நீண்டகாலமாக அறியப்பட்ட வடிவம் என்பதால் ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டுருவாக்கும் மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மருத்துவத் தெளிவுக்காக ‘குடல்கள்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் தெய்வீகத் தாக்குதல் மற்றும் குணமின்மை மென்மைப்படுத்தப்படவில்லை.
