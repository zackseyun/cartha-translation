  text: וַ/יָּ֨קָם יְהוֹרָ֜ם עַל מַמְלֶ֤כַת אָבִי/ו֙ וַ/יִּתְחַזַּ֔ק וַ/יַּהֲרֹ֥ג אֶת כָּל אֶחָ֖י/ו בֶּ/חָ֑רֶב וְ/גַ֖ם מִ/שָּׂרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: When Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
translation:
  language: ta
  text: யெகோராம் தன் தந்தையின் அரசாட்சிப் பொறுப்பை ஏற்று, தன் நிலையை உறுதிப்படுத்திக்கொண்டபோது, தன் சகோதரர்கள் அனைவரையும் வாளால் கொன்றான்; மேலும் இஸ்ரவேலின் தலைவர்களில் சிலரையும்[a] கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தலைவர்கள்” என்பதற்கு “அதிகாரிகள்” அல்லது “பிரபுக்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உயர்நிலை ஆட்சியாளர்களையோ நிர்வாகிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם עַל מַמְלֶכַת אָבִיו
  choice: தன் தந்தையின் அரசாட்சியின்மேல் எழுந்து
  rationale: קום உடன் עַל வருவது அரசாட்சியின்மேல் அதிகாரம் ஏற்றதைக் குறிக்கிறது. ‘அரசாட்சியின்மேல் எழுந்து’ என்பது மூலத்தின் உருவகத்தையும் அதிகார நுணுக்கத்தையும் காக்கிறது.
- source_word: וַיִּתְחַזַּק
  choice: தன்னை வலுப்படுத்திக்கொண்டபோது
  rationale: חזק என்பதன் ஹித்பயேல் வடிவிலுள்ள தன்முகச் செயற்பாட்டை வெளிப்படுத்துகிறது; அதிகாரத்தை உறுதிப்படுத்தினான் என்று மிகத் தெளிவாக விளக்கிச் சொல்லாமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: וַיַּהֲרֹג אֶת כָּל אֶחָיו בֶּחָרֶב
  choice: தன் சகோதரர்கள் அனைவரையும் வாளால் கொன்றான்
  rationale: ஆண் உடன்பிறந்தோரைச் சுட்டும் אֶחָיו என்பதற்கு ‘சகோதரர்கள்’ என்றும், கருவியைக் குறிக்கும் בֶּחָרֶב என்பதற்கு இயல்பான ‘வாளால்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְגַם מִשָּׂרֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தலைவர்களில் சிலரையும்
  rationale: מִן என்பதன் பகுதி சுட்டும் பொருளை ‘சிலர்’ வெளிப்படுத்துகிறது. שָׂרִים என்பது உயர்நிலைத் தலைவர்கள், அதிகாரிகள் அல்லது பிரபுக்களைக் குறிக்கலாம்; பொதுவான நவீன தமிழில் ‘தலைவர்கள்’ இயல்பாக உள்ளது.
theological_decisions:
- issue: ‘இஸ்ரவேல்’ என்பதன் குறிப்பு
  choice: இஸ்ரவேல் என்ற மூலப் பெயரையே தக்கவைத்தல்
  alternative: யூதா / தேசம்
  rationale: நாளாகமத்தில் ‘இஸ்ரவேல்’ விரிவான உடன்படிக்கை அல்லது அரசவம்சப் பொருளில் அமையக்கூடும். வரலாற்று நுணுக்கத்தை மொழிபெயர்ப்பில் தீர்மானித்துவிடாமல் மூலச் சொல்லைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, எளிதில் புரியும் கண்ணியமான நடை. அரசாட்சியேற்றத்தைக் குறிக்கும் மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; வன்முறை நேரடியாகவும் அலங்காரமின்றியும் சொல்லப்பட்டுள்ளது.
