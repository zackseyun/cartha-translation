  yaml_path: translation/ot/2_chronicles/021/008.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: ta
  text: அவன் நாட்களில், ஏதோமியர் யூதாவின் அதிகாரத்திலிருந்து கிளர்ந்தெழுந்து, தங்கள்மேல் ஆள ஒரு அரசனை ஏற்படுத்திக்கொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவின் கட்டுப்பாட்டிலிருந்து கிளர்ந்தெழுந்தார்கள்.” எபிரெயத்தில் நேரடியாக, “யூதாவின் கைக்குக் கீழிருந்து கலகம் செய்தார்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: அவனுடைய நாட்களில்
  rationale: யோராமின் ஆட்சிக்காலத்தைக் குறிக்கும் எபிரெய கால வழக்கை இயல்பான தமிழில், மூலத்தின் வடிவத்துக்கு நெருக்கமாகப் பேணுகிறது.
- source_word: פָּשַׁע
  choice: கலகம் செய்து
  rationale: இங்கு அறநெறி மீறலை அல்ல, யூதாவின் கட்டுப்பாட்டிலிருந்து ஏதோம் அரசியல் ரீதியாகக் கிளர்ந்தெழுந்ததைக் குறிக்கிறது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: இடம் மற்றும் மக்களின் பெயருக்கான தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: யூதாவின் ஆட்சிக்கு எதிராக
  rationale: சொல்லுக்குச் சொல் ‘யூதாவின் கைக்குக் கீழிருந்து’ என்ற உருவகத்தின் அரசியல் பொருளான யூதாவின் அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து விடுபடுதலை இயல்பான தமிழில் தெரிவிக்கிறது; நேரடி உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיַּמְלִיכוּ
  choice: ஏற்படுத்திக்கொண்டார்கள்
  rationale: מלך என்பதன் ஹிஃபில் வடிவம் ஒருவரை அரசனாக ஆளச் செய்வது அல்லது நிறுவுவது எனப் பொருள்படுகிறது; நடுநிலைத் தமிழில் இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עֲלֵיהֶם
  choice: தங்களுக்கு
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு, ஏதோமியர் தங்கள்மேல் ஆள ஒரு அரசனை நிறுவியதைச் சூழலுக்கேற்ற தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ
  choice: ஒரு அரசனை
  rationale: எபிரெயத்தில் பெயர்ச்சொல் இங்கு குறிப்பற்றது; தமிழில் ‘ஒரு’ என்பது அதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
