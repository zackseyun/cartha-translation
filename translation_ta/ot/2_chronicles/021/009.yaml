base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
translation:
  language: ta
  text: யோராம் தன் படைத்தலைவர்களோடும் தன்னுடன் இருந்த எல்லாத் தேர்களோடும் கடந்துசென்றான். இரவில் அவன் எழுந்து, தன்னைச் சூழ்ந்திருந்த ஏதோமியரையும் தேர்ப்படைத் தலைவர்களையும்[a] தாக்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேர்களின் தலைவர்கள்.’ எபிரெயச் சொற்றொடர் தேர்ப்படைக்குப் பொறுப்பான அதிகாரிகளைக் குறிப்பாகக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: கடந்துசென்றான்
  rationale: עבר என்பது கடத்தல் அல்லது கடந்துசெல்லுதல் என்ற பரந்த பொருளுடையது. இலக்கு அல்லது போர்த் தந்திரத்தை ஊகிக்காமல் படை நகர்வை இச்சொல் தெரிவிக்கிறது.
- source_word: שָׂרָיו
  choice: தன் படைத்தலைவர்களோடு
  rationale: שַׂר என்பது ஆட்சியாளர், அதிகாரி, படைத்தலைவர் ஆகியோரைக் குறிக்கலாம்; தேர்கள் இடம்பெறும் இப்போர்ச் சூழலில் ‘படைத்தலைவர்கள்’ இயல்பானது.
- source_word: הָרֶכֶב
  choice: எல்லாத் தேர்கள்
  rationale: רֶכֶב இங்கு தேர்களை அல்லது தேர்ப்படையைத் தொகுப்பாகக் குறிக்கிறது. ‘தேர்கள்’ மூலத்தின் உருவகத் தெளிவைப் பேணுகிறது.
- source_word: וַיְהִי קָם לַיְלָה
  choice: இரவில் அவன் எழுந்து
  rationale: எபிரெயக் கதைநடையின் ויהי + பங்கேற்புவினை அமைப்பைச் சொற்சுமையின்றி இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיַּךְ
  choice: தாக்கினான்
  rationale: נכה என்பது அடித்தல் அல்லது தாக்குதல் எனப் பொருள்படும். ‘தாக்கினான்’ போர்ச் சூழலுக்கு ஏற்றது; ‘தோற்கடித்தான்’ என மூலத்தைவிட அதிகமாகக் கூறுவதில்லை.
- source_word: אֱדוֹם הַסּוֹבֵב אֵלָיו
  choice: தன்னைச் சூழ்ந்திருந்த ஏதோமியர்
  rationale: நாட்டின் பெயரான ‘ஏதோம்’ இங்கு அதன் மக்களை அல்லது படையினரைத் தொகுப்பாகக் குறிக்கிறது; தமிழில் ‘ஏதோமியர்’ என்று தருவது செயப்படுபொருளை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: שָׂרֵי הָרָכֶב
  choice: தேர்ப்படைத் தலைவர்கள்
  rationale: இந்த இணைச்சொல் தேர்ப்படைக்குப் பொறுப்பான தலைவர்களைக் குறிக்கலாம். தமிழில் ‘தேர்ப்படைத் தலைவர்கள்’ சுருக்கமாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
