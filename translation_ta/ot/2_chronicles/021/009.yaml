translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத போர்த் தந்திரம் அல்லது முழுமையான வெற்றி போன்ற கருத்துகள் சேர்க்கப்படவில்லை. அடிக்குறிப்பு குறி அது விளக்கும் ‘தேர்ப்படைத் தலைவர்கள்’ என்ற சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
