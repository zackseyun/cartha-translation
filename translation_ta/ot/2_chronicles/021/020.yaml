base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/020.yaml
  text: He was thirty-two years old when he began to reign[a], and he reigned eight years in Jerusalem. Then he departed with no regret, and they buried him in the city of David, but not in the tombs of the kings.
translation:
  language: ta
  text: அவன் அரசனானபோது முப்பத்திரண்டு வயதாயிருந்தான்; எருசலேமில் எட்டு ஆண்டுகள் ஆட்சிசெய்தான். அவன் மறைந்தான்; யாரும் அவனுக்காக வருந்தவில்லை[a]. அவனைத் தாவீதின் நகரத்தில் அடக்கம் செய்தார்கள்; ஆனால் அரசர்களின் கல்லறைகளில் அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் விரும்பப்படாதவனாகவே போனான்”; இது எபிரெயத் தொடரின் நேரடியான பொருளுக்கு நெருக்கமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם
  choice: முப்பத்திரண்டு வயதாயிருந்தான்
  rationale: இது வயதைக் குறிக்கும் வழக்கமான எபிரெய மொழியமைப்பு; தமிழில் இயல்பான வயதுக் குறிப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְמָלְכוֹ
  choice: அவன் அரசனானபோது
  rationale: அவன் அரசாட்சியை ஏற்ற காலத்தைச் சுட்டும் இத்தொடர், நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்கப்பட்டுள்ளது.
- source_word: וּשְׁמוֹנֶה שָׁנִים מָלַךְ
  choice: எட்டு ஆண்டுகள் ஆட்சிசெய்தான்
  rationale: מָלַךְ என்பதன் ‘அரசாளுதல்’ என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் நேரடியான பயன்பாடு.
- source_word: וַיֵּלֶךְ
  choice: அவன் மறைந்தபோது
  rationale: இறப்பைக் குறிக்கும் சூழல்சார் மென்மொழியை, ‘இறந்தான்’ என்று வெளிப்படையாகக் கூறாமல் தமிழிலும் மென்மையாகப் பேணுகிறது.
- source_word: בְּלֹא חֶמְדָּה
  choice: யாரும் வருந்தவில்லை
  rationale: חֶמְדָּה என்பது விருப்பம், வாஞ்சை, மதிப்பு போன்ற பொருள்களைக் கொண்டது. இச்சூழலில் அவனது மறைவு இழப்புணர்வையோ மக்கள் அன்பையோ எழுப்பவில்லை என்ற இயல்பான கருத்தை இத்தொடர் தெரிவிக்கிறது; சொல்லுக்கு நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவனை ... அடக்கம் செய்தார்கள்
  rationale: பன்மை வினையுடன் வரும் பொருள் பின்னொட்டை, குறிப்பிடப்படாத மனிதச் செய்பொருளுடன் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: בְּעִיר דָּוִיד
  choice: தாவீதின் நகரத்தில்
  rationale: எருசலேமிலுள்ள தாவீதுடன் தொடர்புடைய பகுதியைக் குறிக்கும் வழக்கமான இடப்பெயர்த் தொடர்.
- source_word: וְלֹא בְּקִבְרוֹת הַמְּלָכִים
  choice: ஆனால் அரசர்களின் கல்லறைகளில் அடக்கம் செய்யவில்லை
  rationale: அரசர்களுக்குரிய அடக்க இடங்களைக் குறிக்கும் எதிர்மறை வேறுபாட்டைத் தெளிவாகப் பேணுகிறது.
