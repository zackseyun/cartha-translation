lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: முப்பத்திரண்டு வயதுடையவராக இருந்தார்
  rationale: எபிரெய வயதுக் குறிப்பு மரபுத்தொடரைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் வெளிப்படுத்துகிறது; சொல்லுக்குச் சொல் ‘முப்பத்திரண்டு ஆண்டுகளின் மகன்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: יְהוֹרָם
  choice: யெகோராம்
  rationale: இங்குள்ள முழுமையான எபிரெயப் பெயர்வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: ב முன்னொட்டும், உரிமை விகுதி பெற்ற வினையெச்சப் பெயர்ச்சொல்லும் இணைந்து அரசாட்சியை ஏற்ற காலத்தைக் குறிக்கின்றன.
- source_word: וּשְׁמוֹנֶה שָׁנִים
  choice: எட்டு ஆண்டுகள்
  rationale: அவருடைய ஆட்சிக்காலத்தின் நீளத்தை நேரடியாகக் குறிக்கிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தார்
  rationale: ‘அரசராக ஆளுதல்’ என்ற வினையின் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பொருளுடைய ב முன்னொட்டை ‘-இல்’ வேற்றுமை உருபால் வெளிப்படுத்தி, ஆட்சியின் மைய இடத்தைக் குறிப்பிடுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம வரலாற்றுக் குறிப்புக்கு ஏற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை. மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் சுருக்கமான அரசாட்சிக் குறிப்பின் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
