translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் நேரடியானதும் கண்ணியமானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. நோயின் கொடூரமான விளைவு மூலத்தில் உள்ளபடியே மென்மைப்படுத்தாமல் கூறப்பட்டுள்ளது; இறுதிச் சொற்றொடர் காலம் தொடர்ந்து நீள்வதைத் தெளிவாக்குகிறது.
