source:
  edition: WLC
  text: וְ/אַתָּ֛ה בָּ/חֳלָיִ֥ים רַבִּ֖ים בְּ/מַחֲלֵ֣ה מֵעֶ֑י/ךָ עַד יֵצְא֤וּ מֵעֶ֨י/ךָ֙ מִן הַ/חֹ֔לִי יָמִ֖ים עַל יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
translation:
  language: ta
  text: நீயோ பல நோய்களால் துன்பப்படுவாய்; உன் குடல்களில் இருக்கும் ஒரு நோயுடன், அந்த நோயின் காரணமாக நாளுக்கு நாள் உன் குடல்கள் வெளியே வரும்வரை துன்பப்படுவாய்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் உடலின் உள்ளுறுப்புகளைக் குறிக்கலாம்; இங்கு குறிப்பாகக் குடல்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “நாட்கள் மேல் நாட்கள்”; அதாவது, நாளுக்கு நாள் அல்லது பல நாட்களாக.
    reason: idiom
lexical_decisions:
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: தனிப்பட்ட சுட்டுப்பெயருடன் வரும் இணைப்புச் சொல், யோராமை நேரடியாகவும் வலியுறுத்தியும் நோக்கித் திருப்புகிறது; ‘நீயோ’ அந்த வலியுறுத்தலை இயல்பான தமிழில் தருகிறது.
- source_word: בָּחֳלָיִם רַבִּים
  choice: பல நோய்களால் துன்பப்படுவாய்
  rationale: எபிரெயச் சொற்றொடர் பல நோய்களுக்கு உட்பட்ட நிலையைக் குறிக்கிறது. எதிர்காலத் தண்டனைச் சூழலில் ‘துன்பப்படுவாய்’ என்பது தமிழில் இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
- source_word: בְּמַחֲלֵה מֵעֶיךָ
  choice: உன் குடல்களில் ஏற்படும் நோயினால்
  rationale: בְּ முன்னிடைச்சொல்லின் தொடர்பு/கருவிப் பொருளையும், குறிப்பிட்ட உட்புற உறுப்பைப் பாதிக்கும் நோயையும் இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעֶיךָ
  choice: உன் குடல்கள்
  rationale: מֵעֶה உடலின் உள்ளுறுப்புகளை, குறிப்பாக குடல்களை, குறிக்கலாம். இவ்வசனத்தின் மருத்துவச் சூழலிலும் அடுத்துவரும் ‘வெளியே வந்துவிடும்’ என்ற கூற்றிலும் ‘குடல்கள்’ மிகத் தெளிவான தேர்வு.
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  choice: உன் குடல்கள் வெளியே வந்துவிடும்வரை
  rationale: יָצָא என்பதன் நேரடியான ‘வெளியே வருதல்’ என்ற பொருளை மென்மைப்படுத்தாமல் காக்கிறது; עַד என்பதன் எல்லைப் பொருளையும் ‘வரை’ தெரிவிக்கிறது.
- source_word: מִן הַחֹלִי
  choice: அந்த நோயினால்
  rationale: מִן இங்கு நோயே விளைவுக்குக் காரணம் என்பதைத் தெரிவிக்கிறது; ‘நோயினால்’ அந்தக் காரணப் பொருளைச் சுருக்கமாக வழங்குகிறது.
- source_word: יָמִים עַל יָמִים
  choice: நாளுக்கு நாள்
  rationale: ‘நாட்கள் மேல் நாட்கள்’ என்ற எபிரெய மரபுத்தொடர், காலம் தொடர்ச்சியாக நீள்வதைக் குறிக்கிறது; ‘நாளுக்கு நாள்’ என்பது இயல்பான நவீனத் தமிழ் இணை.
