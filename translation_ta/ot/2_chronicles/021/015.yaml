revisions:
- from: நீயோ பல நோய்களால் துன்பப்படுவாய்; உன் குடல்களில்[a] ஏற்படும் நோயினால் உன் குடல்கள் வெளியே வந்துவிடும்வரை, அது நாளுக்கு நாள்[b] நீடிக்கும்.
  to: நீயோ பல நோய்களால் துன்பப்படுவாய்; உன் குடல்களில் இருக்கும் ஒரு நோயுடன், அந்த நோயின் காரணமாக நாளுக்கு நாள் உன் குடல்கள் வெளியே வரும்வரை துன்பப்படுவாய்.[a][b]
  rationale: The revision removes the added statement that an unspecified ‘it’ continues, retains the direct and unsparing description, and makes the ‘day after day’ idiom modify the protracted progression up to the bowels coming out. “ஒரு நோயுடன்” represents the accompanying-condition sense of the first Hebrew preposition, while “அந்த நோயின் காரணமாக” renders the causal force of the later phrase.
