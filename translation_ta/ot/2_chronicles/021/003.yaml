base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
translation:
  language: ta
  text: அவர்களுடைய தந்தை அவர்களுக்கு வெள்ளி, தங்கம், விலையுயர்ந்த பொருட்கள்[a] என ஏராளமான பரிசுகளையும், யூதாவில் உள்ள அரண்களால் பாதுகாக்கப்பட்ட நகரங்களையும் கொடுத்தார். ஆனால் யோராம் மூத்த மகன் என்பதால், அரசாட்சியை அவனுக்குக் கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தேர்ந்தெடுக்கப்பட்ட பொருட்கள்’ அல்லது ‘மதிப்புமிக்க பரிசுகள்’ என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொல் மதிப்புமிக்க அல்லது சிறப்பாகத் தேர்ந்தெடுக்கப்பட்ட பொருட்களைப் பரந்த வகையில் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் வழக்கமான இறந்தகாலக் கதைநடைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מַתָּנוֹת רַבּוֹת
  choice: ஏராளமான பரிசுகள்
  rationale: ரַבּוֹת குறிக்கும் மிகுதியைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לְכֶסֶף וּלְזָהָב
  choice: வெள்ளி, தங்கம்
  rationale: לְ முன்னொட்டு இங்கு பரிசுகளின் வகைகளை அறிமுகப்படுத்துகிறது; பொருட்களின் பட்டியலாகத் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וּלְמִגְדָּנוֹת
  choice: விலையுயர்ந்த பொருட்கள்
  rationale: מִגְדָּנוֹת என்பது தேர்ந்தெடுக்கப்பட்ட அல்லது மதிப்புமிக்க பொருட்களைக் குறிக்கலாம்; அரச மரபுரிமைச் சூழலில் உணவுப் பண்டங்கள் என்ற குறுகிய பொருளைத் தவிர்த்து, பரந்த பொருளை இது தருகிறது.
- source_word: עִם עָרֵי מְצֻרוֹת
  choice: அரண்செய்யப்பட்ட நகரங்களையும்
  rationale: עִם குறிக்கும் ‘கூடவே’ என்ற சேர்க்கையை ‘-யும்’ வடிவம் இயல்பாக வெளிப்படுத்துகிறது; מְצֻרוֹת என்பதன் பாதுகாப்பு அரண் கொண்ட தன்மையையும் காக்கிறது.
- source_word: בִּיהוּדָה
  choice: யூதாவிலிருந்த
  rationale: அரண்செய்யப்பட்ட நகரங்கள் யூதா நாட்டில் அமைந்திருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְאֶת הַמַּמְלָכָה נָתַן לִיהוֹרָם
  choice: ஆனால் ... அரசாட்சியை அவனுக்குக் கொடுத்தார்
  rationale: எபிரெய இணைப்புச்சொல் வடிவில் ‘மற்றும்’ என்றாலும், மற்ற மகன்களுக்குக் கொடுக்கப்பட்ட பரிசுகளுக்கும் யோராமுக்குக் கொடுக்கப்பட்ட அரசாட்சிக்கும் உள்ள உரையாடல் மாறுபாட்டை ‘ஆனால்’ தெளிவாக்குகிறது.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: யோராம் முதற்பேறானவன் என்பதால்
  rationale: כִּי தரும் காரணத்தையும் הַבְּכוֹר குறிக்கும் குடும்பச் சட்டநிலையையும் தெளிவாகப் பாதுகாக்கிறது.
