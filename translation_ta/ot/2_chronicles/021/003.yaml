translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரசாட்சி’ என்பது வெறும் நிலப்பரப்பைவிட மன்னராட்சிச் செல்வாக்கையும் உரிமையையும் எடுத்துரைக்கிறது; ‘முதற்பேறானவன்’ என்பது மூலத்தின் குடும்ப மற்றும் மரபுரிமைச் சொற்பயன்பாட்டைக் காக்கிறது.
