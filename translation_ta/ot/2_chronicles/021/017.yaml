base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
translation:
  language: ta
  text: அவர்கள் யூதாவுக்கு எதிராகப் படையெடுத்து வந்து, அதற்குள் உடைத்துப் புகுந்தார்கள். அரச அரண்மனையில் காணப்பட்ட எல்லா உடைமைகளையும் கொள்ளையிட்டுக் கொண்டுபோனார்கள்; அவனுடைய மகன்களையும் மனைவிகளையும் சிறைபிடித்துக் கொண்டுபோனார்கள். அவனுடைய மகன்களில் இளையவனான யெகோவாகாசைத்[a] தவிர வேறு எந்த மகனும் அவனுக்கு மீந்திருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யெகோவாகாஸ் என்பவர் மற்ற இடங்களில் அகசியா என்று அழைக்கப்படுகிற அதே நபராக இருக்கலாம் (2 இராஜாக்கள் 8:24–26; 2 நாளாகமம் 22:1 ஆகியவற்றை ஒப்பிடுக).
    reason: இணைப் பகுதிகளில் காணப்படும் மாற்றுப் பெயர் அல்லது அடையாளத்தை வெளிப்படையாகக் காட்டுதல்.
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  choice: அவர்கள் யூதாவுக்கு எதிராகப் படையெடுத்து வந்து
  rationale: עלה உடன் ב என்பது ஒரு நிலப்பகுதிக்குள் மேலே செல்வதைக் குறிக்கலாம்; இங்கு இராணுவச் சூழல் இருப்பதால், பகைமையான முன்னேற்றத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּבְקָעוּהָ
  choice: அதற்குள் புகுந்தார்கள்
  rationale: בקע என்பதன் அடிப்படைப் பொருள் பிளத்தல் அல்லது உடைத்துத் திறத்தல். யூதா நாடு பொருளாக வருவதால், அதன் பாதுகாப்பை உடைத்து உள்ளே நுழைந்தார்கள் என்ற கருத்தை இது இயல்பாகத் தருகிறது.
- source_word: וַיִּשְׁבּוּ
  choice: சிறைபிடித்துக் கொண்டுபோனார்கள்
  rationale: שבה பொதுவாகச் சிறைபிடித்தலைக் குறிக்கிறது. இங்கு பொருட்களும் மனிதர்களும் கொண்டுபோகப்பட்டதால், கொள்ளையிடுதல் மற்றும் சிறைபிடித்தல் ஆகிய இரு நிழற்பொருள்களையும் இந்தச் சொற்றொடர் தக்கவைக்கிறது.
- source_word: כָּל הָרְכוּשׁ
  choice: எல்லா உடைமைகளையும்
  rationale: רכוש என்பது அசையும் சொத்துகள், பொருட்கள், உடைமைகள் ஆகியவற்றைக் குறிக்கும்; ‘உடைமைகள்’ என்பது விரிவானதும் இயல்பானதும் ஆகும்.
- source_word: הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  choice: அரச அரண்மனையில் காணப்பட்ட
  rationale: נמצא என்பது ‘காணப்பட்ட/இருந்த’ என்றும் בית המלך அரசனின் வீடு அல்லது அரண்மனை என்றும் பொருள்படும். இச்சூழலில் ‘அரச அரண்மனை’ தெளிவான இயல்பான தமிழ்.
- source_word: וְגַם בָּנָיו וְנָשָׁיו
  choice: அவனுடைய மகன்களையும் மனைவிகளையும்
  rationale: גם சேர்க்கை வலியுறுத்தலைக் கொண்டது; தமிழில் ‘-உம்/-ஐயும்’ அமைப்பு அந்தச் சேர்க்கையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא נִשְׁאַר לוֹ בֵּן
  choice: வேறு எந்த மகனும் அவனுக்கு மீந்திருக்கவில்லை
  rationale: שׁאר என்பதன் நிபால் வடிவம் மீந்திருத்தலைக் குறிக்கிறது. விதிவிலக்கைத் தொடர்ந்து வரும் தமிழ்ச் சொற்றொடர் முடிவுநிலையைத் தெளிவாகத் தருகிறது.
- source_word: כִּי אִם
  choice: தவிர
  rationale: இங்கு ஒரே விதிவிலக்கை அறிமுகப்படுத்துவதால் ‘தவிர’ நேரடியான பொருத்தம்.
- source_word: יְהוֹאָחָז
  choice: யெகோவாகாஸ்
  rationale: மசோரா உரையில் உள்ள பெயரையே முதன்மை உரையில் தக்கவைக்கிறது; இணைப் பகுதிகளில் வரும் அகசியா என்ற அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: קְטֹן בָּנָיו
  choice: அவனுடைய மகன்களில் இளையவனான
  rationale: குடும்பச் சூழலில் קטן உடல் அளவை அல்ல, வயதில் இளையவனைச் சுட்டுகிறது.
theological_decisions:
- issue: யோராமின் உயிர்தப்பிய மகனின் பெயர் வடிவம்
  choice: மசோரா உரையிலுள்ள ‘யெகோவாகாஸ்’ என்பதை முதன்மை உரையில் வைத்தல்
  alternative: இணைப் பகுதிகளின் அடிப்படையில் ‘அகசியா’ என்று அடையாளப்படுத்துதல்
  rationale: இது கோட்பாட்டுச் சிக்கலைவிட உரை மற்றும் கதைமாந்தர் அடையாளம் சார்ந்தது. மூலமொழி உரைக்கு முன்னுரிமை கொடுத்து ‘யெகோவாகாஸ்’ முதன்மை உரையில் வைக்கப்படுகிறது; வாசகத் தெளிவுக்காக இணைப் பெயர் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. எபிரெய இராணுவச் சொற்றொடரின் இரு படிநிலைகள்—எதிராகப் படையெடுத்து வருதல், பாதுகாப்பை உடைத்து உள்ளே புகுதல்—தனித்தனியாகத் தக்கவைக்கப்பட்டுள்ளன.
