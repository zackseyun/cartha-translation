source:
  edition: WLC
  text: וַ/תֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַ/תַּזְנֶ֤ה אֶת יְהוּדָה֙ וְ/אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כְּ/הַזְנ֖וֹת בֵּ֣ית אַחְאָ֑ב וְ/גַ֨ם אֶת אַחֶ֧י/ךָ בֵית אָבִ֛י/ךָ הַ/טּוֹבִ֥ים מִמְּ/ךָ֖ הָרָֽגְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
translation:
  language: ta
  text: ஆனால் நீ இஸ்ரவேல் அரசர்களின் வழியில் நடந்து, ஆகாபின் வீட்டார் அவர்களை விபசாரம் செய்யச் செய்ததுபோல, யூதாவையும் எருசலேமில் வாழ்பவர்களையும் விபசாரம் செய்யச் செய்தாய்[a]. மேலும், உன்னைவிட நல்லவர்களாயிருந்த உன் தந்தையின் வீட்டைச் சேர்ந்த உன் சகோதரர்களைக் கொன்றாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விபசாரம் செய்யச் செய்தாய்” என்பது தீர்க்கதரிசன மொழியில் உடன்படிக்கைக்கு உண்மையற்றுப்போவதைக் குறிக்கும் உருவகம்; அது பெரும்பாலும் விக்கிரக வழிபாட்டில் வெளிப்பட்டது.
    reason: lexical_alternative
  - marker: b
    text: “உன் தந்தையின் வீடு” என்பது இங்கு அரசகுடும்பத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  choice: வழியில் நடந்து
  rationale: நடத்தை அல்லது வாழ்வுமுறையைப் பின்பற்றுவதைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழ் வழக்கில் தக்கவைக்கிறது.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்கள்
  rationale: யூதாவுக்கும் வடக்கு இஸ்ரவேல் அரசுக்கும் உள்ள வரலாற்று வேறுபாட்டை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַתַּזְנֶה אֶת יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלַם
  choice: யூதாவையும் எருசலேமின் குடிகளையும் வேசித்தனம் செய்யவைத்தாய்
  rationale: הזנה என்பதன் காரணவினைத் தன்மையையும் זנה என்பதன் அதிர்ச்சியூட்டும் தீர்க்கதரிசன உருவகத்தையும் பாதுகாக்கிறது; இதை வெறுமனே ‘விக்கிரக வழிபாட்டில் ஈடுபடுத்தினாய்’ என்று குறுக்கவில்லை.
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  choice: ஆகாபின் வம்சத்தார் செய்ததுபோல
  rationale: ‘ஆகாபின் வீடு’ என்பது ஆளும் வம்சத்தைக் குறிக்கும் மரபுத்தொடர். தமிழில் இயல்பாக இருக்க ‘வம்சத்தார்’ எனத் தரப்பட்டு, முந்தைய ‘வேசித்தனம் செய்யவைத்தாய்’ என்பதே ஒப்பீட்டின் செயலாகப் புரியுமாறு அமைக்கப்பட்டுள்ளது.
- source_word: אַחֶיךָ בֵית אָבִיךָ
  choice: உன் தகப்பனுடைய குடும்பத்தைச் சேர்ந்த உன் சகோதரர்கள்
  rationale: அவர்கள் அரசகுடும்பத்தைச் சேர்ந்த உடன்பிறந்தவர்கள் அல்லது சகோதரர்கள் என்பதைத் தெளிவாகவும் மூலத்தின் இரு கூறுகளையும் காத்தும் தெரிவிக்கிறது.
- source_word: הַטּוֹבִים מִמְּךָ
  choice: உன்னைவிட நல்லவர்கள்
  rationale: ஒப்பீட்டு அமைப்பை நேரடியாகத் தக்கவைத்து, ‘தகுதியானவர்கள்’ போன்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: הָרָגְתָּ
  choice: கொன்றுவிட்டாய்
  rationale: ‘கொல்’ என்பதே நேரடியான பொருள்; ‘கொலைசெய்தாய்’ என்று சட்ட அல்லது நோக்கத் தீர்ப்பை மேலதிகமாகச் சேர்க்காமல், முடிந்த செயலைக் காட்டுகிறது.
theological_decisions:
- issue: זנה என்பதன் உடலுறவு சார்ந்த சொல்லாட்சியும் உடன்படிக்கைத் துரோக உருவகமும்
  choice: முதன்மை உரையில் ‘வேசித்தனம் செய்யவைத்தாய்’ என உருவகத்தை வெளிப்படையாகத் தக்கவைத்தல்
  alternative: ‘விக்கிரக வழிபாட்டில் ஈடுபடுத்தினாய்’ அல்லது ‘உண்மையற்றவர்களாக்கினாய்’ என விளக்கமாக மொழிபெயர்த்தல்
  rationale: இச்சூழலில் ஆகாபின் வம்சத்துடன் தொடர்புடைய சமயத் துரோகமே குறிக்கப்படுகிறதாயினும், எபிரெய உரை பாலியல் உருவகத்தைப் பயன்படுத்துகிறது. அதை ‘விக்கிரக வழிபாடு’ என்று மட்டும் மொழிபெயர்ப்பது மூலத்தின் வலிமையையும் பரப்பையும் குறுக்கும்; அடிக்குறிப்பு உருவகத்தின் செயல்பாட்டை விளக்குகிறது.
- issue: בֵּית אַחְאָב என்பதன் குறிப்பு
  choice: ‘ஆகாபின் வம்சத்தார்’
  alternative: ‘ஆகாபின் வீடு’
  rationale: இங்கு கட்டடமோ இல்லமோ அல்ல, ஆகாபின் ஆளும் வம்சமே குறிக்கப்படுகிறது. நவீன தமிழில் தவறான புரிதலைத் தவிர்க்க பொருளைத் தெளிவாகக் கொடுக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘வழியில் நடந்து’ என்ற பரிச்சயமான உருவகம் காக்கப்பட்டுள்ளது. பாலியல் உருவகத்தை மறைக்காமல் ‘வேசித்தனம்’ எனத் தரப்பட்டுள்ளது; அதன் உடன்படிக்கைத் துரோகப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது. ‘எருசலேமின் குடிகள்’ என்பது சுருக்கமான, பொதுவாகப் புரியும் உயர்நடை.
