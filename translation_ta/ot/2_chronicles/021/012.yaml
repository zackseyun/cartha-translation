source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֵלָי/ו֙ מִכְתָּ֔ב מֵֽ/אֵלִיָּ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹ֑ר כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֱלֹהֵי֙ דָּוִ֣יד אָבִ֔י/ךָ תַּ֗חַת אֲשֶׁ֤ר לֹֽא הָלַ֨כְתָּ֙ בְּ/דַרְכֵי֙ יְהוֹשָׁפָ֣ט אָבִ֔י/ךָ וּ/בְ/דַרְכֵ֖י אָסָ֥א מֶֽלֶךְ יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/012.yaml
  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
translation:
  language: ta
  text: 'அப்போது இறைவாக்கினரான எலியாவிடமிருந்து அவனுக்கு ஒரு கடிதம் வந்தது. அதில் இவ்வாறு கூறப்பட்டிருந்தது: “உன் தந்தையான தாவீதின்[a] கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: உன் தந்தை யோசபாத்தின் வழிகளிலும், யூதாவின் அரசன் ஆசாவின் வழிகளிலும் நீ நடக்காததால்,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “தந்தை” என்பது வம்ச முன்னோரைக் குறிக்கிறது.
    reason: தாவீது யோராமின் நேரடித் தந்தை அல்ல; எபிரெய אָב வம்ச முன்னோரையும் குறிக்கக்கூடும் என்பதைக் தெளிவுபடுத்துகிறது.
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  choice: அப்போது ... அவனுக்கு ஒரு கடிதம் வந்தது
  rationale: מִכְתָּב என்பதே வினையின் எழுவாய்; ‘கடிதம் வந்தது’ என்பது எபிரெய அமைப்பையும் இயல்பான தமிழையும் காக்கிறது. தொடக்க வாவ் தொடர்கதை நகர்வாக ‘அப்போது’ எனத் தரப்பட்டுள்ளது.
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  choice: இறைவாக்கினரான எலியாவிடமிருந்து
  rationale: נָבִיא என்பதற்கு சமயப் பிரிவுச் சார்பற்ற, நவீனத் தமிழில் புரியக்கூடிய ‘இறைவாக்கினர்’ பயன்படுத்தப்பட்டுள்ளது; பெயர் வழக்கமான தமிழுருவில் தரப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: அதில் கூறப்பட்டிருந்ததாவது
  rationale: கடிதத்தில் வரும் மேற்கோளை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது; ‘கூறி’ என்று மொழிபெயர்த்து எலியா நேரில் பேசியதாகத் தோன்றுவதைத் தவிர்க்கிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதர் சூத்திரத்தின் அதிகாரபூர்வத் தன்மையைத் தக்கவைக்கிறது; יהוה என்பது பட்டமாக அல்லாமல் ‘யாவே’ என்ற தனிப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  choice: உன் தந்தையான தாவீதின் கடவுள்
  rationale: எபிரெயச் சொல் வரிசையையும் ‘தந்தை’ என்ற வம்சவழிப் பயன்பாட்டையும் தக்கவைக்கிறது; இங்கு அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
- source_word: תַּחַת אֲשֶׁר
  choice: …நடக்காததால்
  rationale: பின்வரும் தண்டனை அறிவிப்பிற்கான காரணத்தை இச்சொற்றொடர் அறிமுகப்படுத்துகிறது; தமிழில் இயல்பாக காரண விகுதியால் தரப்பட்டுள்ளது.
- source_word: לֹא הָלַכְתָּ בְּדַרְכֵי
  choice: வழிகளில் … நீ நடக்காததால்
  rationale: வாழ்க்கை நடத்தையைக் குறிக்கும் ‘நடத்தல்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וּבְדַרְכֵי אָסָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் ஆசாவின் வழிகளிலும்
  rationale: וּ என்பதன் கூட்டுப்பொருள் ‘-உம்’ மூலம் நேரடியாகத் தரப்பட்டுள்ளது. முந்தைய மறுப்புடன் இரு முன்னுதாரணங்களையும் பின்பற்றவில்லை என்ற பொருள் தமிழில் இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயரான நான்கெழுத்து இறைப்பெயர் உள்ளது. அதனை ஒரு பட்டத்தால் மாற்றாமல், பரவலாக ஏற்கப்படும் ‘Yahweh’ உச்சரிப்புக்கு அண்மையான தமிழுருவில் தரப்பட்டுள்ளது.
- issue: דָּוִיד אָבִיךָ என்பதில் אָבִיךָ-வின் உறவு
  choice: உன் தந்தையான தாவீது; அடிக்குறிப்பில் வம்ச முன்னோர் என விளக்கம்
  alternative: உன் முன்னோரான தாவீது
  rationale: ‘தந்தை’ என்ற மூலச் சொல்லை முதன்மை உரையில் தக்கவைத்து அதன் பரந்த வம்சவழிப் பொருளை விளக்குவது, மூலத்தின் சொற்படிமத்தையும் வரலாற்று உறவையும் ஒருங்கே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. வசனம் அடுத்த வசனத்தில் தொடர்வதால் இறுதியில் வாக்கியம் முடிக்கப்படவில்லை. எபிரெய வாவ் ‘ஆசாவின் வழிகளிலும்’ என நேரடியாகக் காக்கப்பட்டுள்ளது; தமிழில் மறுப்புடன் இது இயல்பானது என்பதால் ஆங்கிலத்தின் ‘and/or’ மாற்றத்திற்கான அடிக்குறிப்பு தேவையில்லை.
