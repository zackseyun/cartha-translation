base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
translation:
  language: ta
  text: அவர்கள் யூதாவில் கற்பித்தார்கள்; யாவேயின் சட்டப் புத்தகம்[a] அவர்களோடு இருந்தது. அவர்கள் யூதாவின் எல்லா நகரங்களிலும் சுற்றிச் சென்று, மக்களிடையே கற்பித்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவேயின் சட்டச் சுருள்.’ எபிரெயச் சொல் சுருள் வடிவிலான எழுதப்பட்ட ஆவணத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மக்களுக்குக் கற்பித்தார்கள்.’ எபிரெயம் இன்னும் சொற்சொல்லாக ‘மக்களிடையே கற்பித்தார்கள்’ என்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ
  choice: கற்பித்தார்கள்
  rationale: למד என்பதன் பியேல் வடிவம் ‘கற்பித்தல், போதித்தல்’ என்று பொருள்படும். இங்கு பொதுவான கல்விப்பணியை நேரடியாகக் குறிக்க ‘கற்பித்தார்கள்’ இயல்பான தமிழாக்கம்; வசனத்தின் இறுதியிலும் இதே வினைச்சொல் மீண்டும் வருகிறது.
- source_word: בִּיהוּדָה
  choice: யூதாவில்
  rationale: ב என்ற முன்னொட்டு இங்கு இடத்தைக் குறிக்கிறது. பின்னர் எல்லா நகரங்களுக்கும் சுற்றிச் சென்றதாகக் கூறப்படுவதால், தொடக்கச் சொற்றொடரை எளிமையாக ‘யூதாவில்’ என வைத்திருக்கிறது.
- source_word: וְעִמָּהֶם סֵפֶר
  choice: புத்தகம் அவர்களிடம் இருந்தது
  rationale: 'இது எபிரெயத்தில் வினை இல்லாத உடைமை/உடனிருப்பு வாக்கியம்: ‘அவர்களுடன் புத்தகம்’. இயல்பான தமிழில் ‘அவர்களிடம் இருந்தது’ என வெளிப்படுத்தப்பட்டுள்ளது.'
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: யாவேயின் திருச்சட்டப் புத்தகம்
  rationale: סֵפֶר என்பது எழுதப்பட்ட ஆவணம் அல்லது சுருளைக் குறிக்கலாம்; முதன்மை உரையில் இயல்பான ‘புத்தகம்’ பயன்படுத்தப்படுகிறது. תּוֹרָה இச்சூழலில் யாவேயின் உடன்படிக்கைச் சட்டப் போதனையைக் குறிக்கிறது; ‘திருச்சட்டம்’ தெளிவாகவும் மரியாதைமிக்கதாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குகிறது.
- source_word: וַיָּסֹבּוּ
  choice: சுற்றிச் சென்று
  rationale: סבב இங்கு பல இடங்களுக்குச் சுற்றிப் பயணித்ததைக் குறிக்கிறது. ‘சுற்றிச் சென்று’ அதன் பயணச் சுற்றுப்பணியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: யூதாவின் எல்லா நகரங்களுக்கும்
  rationale: இயக்கத்தைக் குறிக்கும் வினையுடன், בְּכָל עָרֵי என்ற சொற்றொடர் அவர்கள் அந்த எல்லா நகரங்களிலும் பயணித்ததைச் சொல்கிறது. தமிழில் இலக்கை உணர்த்தும் ‘நகரங்களுக்கும்’ இயல்பாக உள்ளது.
- source_word: וַיְלַמְּדוּ בָּעָם
  choice: மக்களிடையே கற்பித்தார்கள்
  rationale: בָּעָם என்பதில் உள்ள ב முன்னொட்டு கற்பித்தல் மக்களின் நடுவே நடைபெற்றதைக் காட்டுகிறது. ஆகவே அதை நேரடி செயப்படுபொருளாக மாற்றாமல் ‘மக்களிடையே’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் தமிழாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அந்தப் பெயரை பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது; ‘யெகோவா’ என்பது பிற்கால கலப்பு உச்சரிப்பு, ‘கர்த்தர்’ என்பது பெயருக்குப் பதிலான பட்டம்.
- issue: תּוֹרָה என்பதன் பொருள்
  choice: திருச்சட்டம்
  alternative: போதனை; நியாயப்பிரமாணம்
  rationale: இச்சொல் பொதுவாக ‘போதனை’ என்றும் பொருள்படலாம்; ஆனால் סֵפֶר உடனான இக்கூட்டு மற்றும் அரசரின் சீர்திருத்தச் சூழல், யாவேயின் உடன்படிக்கைச் சட்டத் தொகுப்பைக் குறிக்கிறது. ‘திருச்சட்டம்’ அதைக் தெளிவாகவும் தேவையற்ற சமயக்குழு சார்பின்றியும் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தின் மூன்று ஒருங்கிணைந்த நிகழ்வுகள் தமிழில் தெளிவுக்காகத் தனித்தனி வாக்கியங்களாக அமைக்கப்பட்டுள்ளன. ‘மக்களிடையே’ என்பது மூலத்தின் முன்னொட்டு நுணுக்கத்தைத் தக்கவைக்கிறது; சுருள்/புத்தகம் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
