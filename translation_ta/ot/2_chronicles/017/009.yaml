- from: அவர்கள் யூதாவில் கற்பித்தார்கள். யாவேயின் திருச்சட்டப் புத்தகம்[a] அவர்களிடம் இருந்தது. அவர்கள் யூதாவின் எல்லா நகரங்களுக்கும் சுற்றிச் சென்று, மக்களிடையே கற்பித்தார்கள்[b].
  to: அவர்கள் யூதாவில் கற்பித்தார்கள்; யாவேயின் சட்டப் புத்தகம்[a] அவர்களோடு இருந்தது. அவர்கள் யூதாவின் எல்லா நகரங்களிலும் சுற்றிச் சென்று, மக்களிடையே கற்பித்தார்கள்[b].
