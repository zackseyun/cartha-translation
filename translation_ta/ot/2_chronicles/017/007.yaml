  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. பெயர்ப்பட்டியலைத் தமிழ் வாக்கிய அமைப்புக்கு ஏற்றவாறு ‘ஆகியோரை’ கொண்டு இணைத்துள்ளோம். அடிக்குறிப்பு குறி, அது விளக்கும் ‘அதிகாரிகளான’ என்ற சொல்லுக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
