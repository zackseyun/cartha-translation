base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/007.yaml
  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
translation:
  language: ta
  text: தமது ஆட்சியின் மூன்றாம் ஆண்டில், அவர் யூதாவின் நகரங்களில் கற்பிப்பதற்காகத் தம் அதிகாரிகளான[a] பென்-ஹாயில், ஒபதியா, சகரியா, நெத்தனேல், மிகாயா ஆகியோரை அனுப்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம் தலைவர்களான” அல்லது “தம் இளவரசர்களான”; இங்குள்ள எபிரெயச் சொல் அரச அல்லது நிர்வாக அதிகாரிகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: அவர் ஆட்சி செய்த மூன்றாம் ஆண்டில்
  rationale: எபிரெயக் காலக் குறிப்பை இயல்பான நவீனத் தமிழில் தருகிறது; לְמָלְכוֹ என்பதிலுள்ள அரசாட்சிப் பொருளையும் காக்கிறது.
- source_word: שָׁלַח
  choice: அனுப்பினார்
  rationale: அனுப்புதல் என்ற பொதுவான வினையின் நேரடியான, சூழலுக்கு ஏற்ற தமிழ் வடிவம்.
- source_word: לְשָׂרָיו
  choice: தம் அதிகாரிகளான
  rationale: שַׂר என்பது இளவரசர், தலைவர், அதிகாரி எனப் பலவாறு பொருள்படலாம். அரசரால் பணிக்காக அனுப்பப்படும் பெயரிடப்பட்ட நபர்களைக் குறிக்கும் இச்சூழலில் ‘அதிகாரிகள்’ என்பது அரசகுல உறவைத் தேவையின்றி உணர்த்தாமல் நிர்வாகப் பங்கைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְבֶן חַיִל וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ
  choice: பென்-ஹயில், ஒபதியா, சகரியா, நெத்தனேல், மிகாயா ஆகியோரை
  rationale: இவை நபர்களின் பெயர்கள் என்பதால் மொழிபெயர்க்காமல் எபிரெய வடிவங்களுக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: לְלַמֵּד
  choice: கற்பிப்பதற்காக
  rationale: למד என்பதன் தீவிர வினைவடிவம் இங்கு ‘கற்பித்தல்’ என்று நேரடியாகப் பொருள்படுகிறது; நோக்கத்தைக் காட்டும் לְ முன்னொட்டு ‘-தற்காக’ எனத் தரப்பட்டுள்ளது.
- source_word: בְּעָרֵי יְהוּדָה
  choice: யூதாவின் நகரங்களில்
  rationale: בְּ என்னும் முன்னிடைச்சொல்லின் இடப்பொருளை நேரடியாகக் காக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘நகரங்கள் முழுவதிலும்’ என்ற பகிர்வுப் பொருள் சேர்க்கப்படவில்லை.
