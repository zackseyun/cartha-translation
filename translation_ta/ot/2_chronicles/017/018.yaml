  text: And at his side was Jehozabad[b][a], and with him were 180,000 armed for war.
translation:
  language: ta
  text: அவனுக்குப் பக்கத்தில்[a] யெகோசாபாத் இருந்தான். போருக்காக ஆயுதம் தரித்த 1,80,000 படைவீரர்கள் அவனுடன் இருந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், ‘அவனுடைய கையருகில்’; இது அவனுடைய வழிநடத்துதலின் கீழ் இருப்பதையோ அல்லது அவனுக்குப் பக்கத்தில் நிறுத்தப்பட்டிருப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘போருக்கு ஆயத்தப்படுத்தப்பட்ட 1,80,000 படைவீரர்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: அவனுக்குப் பக்கத்தில்
  rationale: ‘அவனுடைய கையருகில்’ என்ற சொல்லாட்சியின் இடம்/தொடர்பு சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; இதைத் திட்டவட்டமாக ‘அவனுடைய கட்டுப்பாட்டின்கீழ்’ என்று பொருள்கொள்ளாமல் மூலத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: יְהוֹזָבָד
  choice: யெகோசாபாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீன தமிழில் தெளிவாக எழுத்துப்பெயர்க்கிறது.
- source_word: וְעִמּוֹ
  choice: அவனுடன்
  rationale: உடனிருத்தல் அல்லது இணைந்திருத்தல் என்ற எபிரெய முன்னிடைச்சொல்லின் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 1,80,000
  rationale: ‘நூற்று எண்பதாயிரம்’ என்ற எண்ணிக்கையைத் தமிழ் வாசகர்களுக்குப் பழக்கமான இலக்கக் குழுவாக்கத்தில் தெளிவாகக் காட்டுகிறது.
- source_word: חֲלוּצֵי צָבָא
  choice: போருக்காக ஆயுதம் தரித்த ... பேர்
  rationale: போருக்கென ஆயத்தப்படுத்தப்பட்ட அல்லது ஆயுதம் ஏந்திய படைவீரர்கள் என்ற இராணுவப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
