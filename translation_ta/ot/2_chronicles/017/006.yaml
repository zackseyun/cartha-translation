  text: וַ/יִּגְבַּ֥הּ לִבּ֖/וֹ בְּ/דַרְכֵ֣י יְהוָ֑ה וְ/ע֗וֹד הֵסִ֛יר אֶת הַ/בָּמ֥וֹת וְ/אֶת הָ/אֲשֵׁרִ֖ים מִ/יהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
translation:
  language: ta
  text: யாவேயின் வழிகளில் அவனுடைய உள்ளம் உயர்ந்தது[a]. மேலும், அவன் யூதாவிலிருந்து உயர்ந்த வழிபாட்டு இடங்களையும் அசேரீம்களையும்[b] அகற்றினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் வழிகளில் அவனுடைய உள்ளம் துணிவடைந்தது.” எபிரெயச் சொற்றொடர் உள்ளம் உயர்வதையோ துணிவடைவதையோ குறிக்கலாம்; இங்கு சூழல் ஆணவத்தை அல்ல, பாராட்டத்தக்க மனவுறுதியைக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அசேரா வழிபாட்டுப் பொருட்கள்” அல்லது “புனிதக் கம்பங்கள்.” எபிரெயச் சொல் அசேரா வழிபாட்டுடன் தொடர்புடைய பொருட்களைக் குறிக்கிறது; அவற்றின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  choice: அவனுடைய உள்ளம் உயர்ந்தது
  rationale: גבהּ என்பதன் ‘உயர்தல்’ என்ற உருவகத்தையும் לֵב குறிக்கும் உள்ளார்ந்த மனவுறுதி/மனப்பாங்கையும் காக்கிறது. சூழல் இதை ஆணவமாக அல்ல, யாவேயின் வழிகளில் ஏற்பட்ட துணிவும் உறுதியுமாகக் காட்டுகிறது.
- source_word: בְּדַרְכֵי יְהוָה
  choice: யாவேயின் வழிகளில்
  rationale: דֶּרֶךְ என்பதன் பன்மை இங்கு நடத்தை அல்லது வாழ்க்கை முறையைக் குறிக்கிறது. יְהוָה என்ற தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְעוֹד
  choice: மேலும்
  rationale: முந்தைய கூற்றுடன் இன்னொரு செயலைச் சேர்க்கும் சொல்லின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הֵסִיר
  choice: அகற்றினான்
  rationale: Hiphil வடிவின் ‘நீக்குதல், அகற்றுதல்’ என்ற நேரடியான பொருளைத் தருகிறது.
- source_word: הַבָּמוֹת
  choice: வழிபாட்டு மேடுகள்
  rationale: בָּמוֹת என்பது வழிபாட்டுக்குப் பயன்படுத்தப்பட்ட உயரமான இடங்கள் அல்லது மேடுகளைக் குறிக்கும் தொழில்நுட்பச் சொல்; ‘வழிபாட்டு’ என்பது தமிழில் அதன் சமயச் சூழலைத் தெளிவாக்குகிறது.
- source_word: הָאֲשֵׁרִים
  choice: அசேரா சின்னங்கள்
  rationale: இந்தப் பன்மைச் சொல் அசேரா வழிபாட்டுடன் தொடர்புடைய பொருட்களைக் குறிக்கிறது; அவற்றின் வடிவம் எப்போதும் உறுதியாகத் தெரியாததால் ‘கம்பங்கள்’ என்று அளவுக்கு மீறித் தீர்மானிக்காமல் ‘சின்னங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִיהוּדָה
  choice: யூதாவிலிருந்து
  rationale: மִן குறிக்கும் அகற்றப்படும் இடத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: וַיִּגְבַּהּ לִבּוֹ என்பது ஆணவத்தையா அல்லது நேர்மறையான துணிவு/உறுதியையா குறிக்கிறது?
  choice: ‘அவனுடைய உள்ளம் உயர்ந்தது’ என்று உருவகத்தைத் தக்கவைத்து, அடிக்குறிப்பில் நேர்மறையான சூழலை விளக்குதல்
  alternative: ‘அவன் துணிவடைந்தான்’ அல்லது ‘அவனுடைய உள்ளம் பெருமைகொண்டது’
  rationale: இந்தச் சொற்றொடர் வேறு சூழல்களில் பெருமையைக் குறிக்கக்கூடும். ஆனால் ‘யாவேயின் வழிகளில்’ என்ற வரையறையும் தொடர்ந்து வரும் வழிபாட்டுச் சீர்திருத்தமும் இங்கு பாராட்டத்தக்க மனவுறுதியைக் காட்டுகின்றன. மூலத்தின் உண்மையான பொருள் வீச்சை முற்றிலும் நீக்காமல் உருவகம் பாதுகாக்கப்படுகிறது.
- issue: אֲשֵׁרִים என்பதைக் குறிப்பிட்ட வடிவமுடைய கம்பங்களாக மொழிபெயர்க்கலாமா?
  choice: அசேரா சின்னங்கள்
  alternative: அசேரா கம்பங்கள்; அசேரீம்; புனிதக் கம்பங்கள்
  rationale: இச்சொல் அசேரா வழிபாட்டுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறித்தாலும், அவை அனைத்தும் ஒரே வடிவமுடைய கம்பங்கள் என்று உரை கூறவில்லை. ஆகவே தொடர்பைத் தெளிவாகக் காட்டி, துல்லியமற்ற வடிவத் தீர்மானத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உள்ளம் உயர்ந்தது’ என்ற எபிரெய உருவகம் பாதுகாக்கப்பட்டு அதன் நேர்மறையான சூழல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. ‘வழிபாட்டு மேடுகள்’ மற்றும் ‘அசேரா சின்னங்கள்’ என்பவை சமயச் சூழலைத் தெளிவாக்கினாலும், மூலத்தில் இல்லாத அளவுக்கு அவற்றின் வடிவத்தை வரையறுக்கவில்லை.
