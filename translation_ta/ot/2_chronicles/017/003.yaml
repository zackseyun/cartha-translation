source:
  edition: WLC
  text: וַ/יְהִ֥י יְהוָ֖ה עִם יְהוֹשָׁפָ֑ט כִּ֣י הָלַ֗ךְ בְּ/דַרְכֵ֞י דָּוִ֤יד אָבִי/ו֙ הָ/רִ֣אשֹׁנִ֔ים וְ/לֹ֥א דָרַ֖שׁ לַ/בְּעָלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
translation:
  language: ta
  text: யாவே யோசபாத்துடன் இருந்தார்; ஏனெனில், அவர் தம் தந்தையாகிய தாவீதின் முந்தைய வழிகளில்[a] நடந்து, பாகால்களை நாடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம் தந்தையாகிய தாவீதின் முற்கால வழிகளில்.” எபிரெயச் சொல் தாவீதின் முந்தைய நடத்தையைக் குறிக்கிறது; அது அவரது பிற்கால நடத்தையிலிருந்து அதனை வேறுபடுத்திக் காட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיְהִי ... עִם
  choice: உடன் இருந்தார்
  rationale: இது உடனிருப்பு, ஆதரவு ஆகியவற்றை உணர்த்தும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யாவே யோசபாத்துடன் இருந்ததற்கான காரணத்தை இங்கு அறிமுகப்படுத்தும் காரணப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: வழிகளில் நடந்து
  rationale: ஒழுக்கம் மற்றும் வாழ்க்கை நடத்தையைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழிலும் பாதுகாக்கிறது.
- source_word: דָּוִיד אָבִיו
  choice: தம் தந்தையாகிய தாவீது
  rationale: வம்ச உறவைக் குறிக்கும் மூலத்தின் ‘தந்தை’ என்ற உடன்படிக்கை மற்றும் அரசவம்ச மொழியை மாற்றாமல் வைத்திருக்கிறது.
- source_word: הָרִאשֹׁנִים
  choice: முற்கால
  rationale: தாவீதின் ஆரம்ப அல்லது முந்தைய நடத்தையைக் குறிப்பிட்டு, பிற்கால நடத்தையிலிருந்து அதைப் பிரித்துக் காட்டும் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: דָרַשׁ
  choice: நாடவில்லை
  rationale: ஒரு தெய்வத்திடம் வழிகாட்டலைத் தேடுதல், அதைச் சார்தல் அல்லது வணக்க நோக்குடன் அணுகுதல் ஆகியவற்றை உள்ளடக்கக்கூடிய எபிரெயச் சொல்லின் அகன்ற சமயப் பொருளைப் பாதுகாக்கிறது.
- source_word: לַבְּעָלִים
  choice: பாகால்களை
  rationale: எபிரெயத்தில் உள்ள பன்மையைத் தெளிவாகப் பாதுகாத்து, பாகாலின் பல்வேறு உள்ளூர் வடிவங்கள் அல்லது வழிபாடுகளைக் குறிக்க இடமளிக்கிறது.
theological_decisions:
- issue: தாவீதின் வாழ்க்கை முழுவதையும் முன்மாதிரியாகக் காட்டுகிறதா, அல்லது அவரது முற்கால நடத்தையை மட்டும் குறிக்கிறதா?
  choice: தாவீதின் முற்கால வழிகள்
  alternative: தாவீதின் முதல் வழிகள்
  rationale: הָרִאשֹׁנִים என்பது ஒப்பீட்டைத் தாவீதின் முந்தைய நடத்தைக்கு வரையறுக்கிறது. இதனால் அவரது பிற்காலத் தவறுகளையும் யோசபாத் பின்பற்றினார் என்ற தேவையற்ற முடிவு தவிர்க்கப்படுகிறது; அதேவேளையில் மூலத்தின் கால வேறுபாடு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வழிகளில் நடந்து’ என்ற வேதாகம உருவகம் தமிழில் புரிந்துகொள்ளத்தக்கதாக இருப்பதால் தக்கவைக்கப்பட்டது. ‘பாகால்கள்’ என்ற பன்மை மூலத்தின்படி பாதுகாக்கப்பட்டுள்ளது.
