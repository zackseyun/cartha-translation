reference: 2 Chronicles 17:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֨כֶן יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ בְּ/יָד֔/וֹ וַ/יִּתְּנ֧וּ כָל יְהוּדָ֛ה מִנְחָ֖ה לִ/יהוֹשָׁפָ֑ט וַֽ/יְהִי ל֥/וֹ עֹֽשֶׁר וְ/כָב֖וֹד לָ/רֹֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/005.yaml
  text: So Yahweh established the kingdom in his hand[a], and all Judah gave tribute to Jehoshaphat; and he had riches and honor in abundance.
translation:
  language: ta
  text: அப்போது யாவே அரசாட்சியை அவன் கையில் உறுதிப்படுத்தினார். யூதா மக்கள் அனைவரும் யோசபாத்துக்குத் திறை[a] செலுத்தினார்கள்; அவனுக்குச் செல்வமும் மரியாதையும் ஏராளமாக இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “திறை” என்பதற்கான எபிரெயச் சொல் பரிசு, அன்பளிப்பு அல்லது காணிக்கை என்றும் பொருள்படலாம்; இங்குள்ள அரசச் சூழல் “திறை” என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: உறுதிப்படுத்தினார்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் ‘நிலைநிறுத்துதல், உறுதியாக்குதல்’ எனப் பொருள்படும். அரசாட்சி பாதுகாப்பாக யோசபாத்தின் வசமானதைக் குறிக்க ‘உறுதிப்படுத்தினார்’ இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַמַּמְלָכָה
  choice: அரசாட்சி
  rationale: מַמְלָכָה என்பது நாடாகிய அரசையும் ஆட்சியுரிமையையும் குறிக்கலாம். இங்கு யோசபாத்தின் கையில் நிலைபெறும் அரச அதிகாரமே முன்னிலையில் இருப்பதால் ‘அரசாட்சி’ பொருத்தமானது; சொல்லின் பரந்த பொருளையும் முற்றிலும் விலக்கவில்லை.
- source_word: בְּיָדוֹ
  choice: அவன் கையில்
  rationale: எபிரெய உருவகத்தைத் தக்கவைத்து, அரசாட்சி அவனுடைய அதிகாரத்திலும் கட்டுப்பாட்டிலும் இருந்ததைக் காட்டுகிறது.
- source_word: וַיִּתְּנוּ כָל יְהוּדָה
  choice: யூதா மக்கள் அனைவரும் ... செலுத்தினார்கள்
  rationale: ‘யூதா முழுவதும்’ என்பது மக்களைக் குறிக்கும் கூட்டுப்பெயர். தமிழில் இயல்பாக இருக்க ‘யூதா மக்கள் அனைவரும்’ என விரிக்கப்பட்டது; திறையுடன் ‘செலுத்தினார்கள்’ இயல்பான வினைச்சொல்.
- source_word: מִנְחָה
  choice: திறை
  rationale: இந்தச் சொல்லுக்கு காணிக்கை, பரிசு போன்ற பொருள்களும் உண்டு. அரசியல் மற்றும் அரசவைச் சூழலில் அரசனுக்குக் கொடுக்கப்படும் tribute என்ற பொருளை ‘திறை’ துல்லியமாகக் காட்டுகிறது.
- source_word: לִיהוֹשָׁפָט
  choice: யோசபாத்துக்கு
  rationale: יְהוֹשָׁפָט என்ற பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: וַיְהִי לוֹ
  choice: அவனுக்கு ... இருந்தன
  rationale: ‘அவனுக்காக/அவனிடம் இருந்தது’ என்ற உடைமைப் பொருளுடைய எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
- source_word: עֹשֶׁר
  choice: செல்வம்
  rationale: பொருளாதார வளத்தைக் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் நேரடியான, இயல்பான இணை.
- source_word: וְכָבוֹד
  choice: மதிப்பு
  rationale: இங்கு כָבוֹד என்பது அரசனுக்குக் கிடைத்த மரியாதை, உயர்நிலை அல்லது பெருமையைக் குறிக்கிறது. தெய்வீக ‘மகிமை’ என்ற பொருளைத் தேவையின்றி புகுத்தாமல் ‘மதிப்பு’ பொதுவாகப் புரிகிறது.
- source_word: לָרֹב
  choice: ஏராளமாக
  rationale: மிகுந்த அளவைச் சுட்டும் சொற்றொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை பொதுப் பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; ‘யாவே’ என்பது எபிரெயப் பெயரின் ஏற்றுக்கொள்ளப்பட்ட நவீன மறுவொலிப்புக்கு நெருக்கமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அவன் கையில்’ என்ற எபிரெய உருவகம் பாதுகாக்கப்பட்டுள்ளது. ‘யூதா’ என்பது இங்கு நிலப்பகுதியை மட்டும் அல்லாமல் அதன் மக்களைச் சுட்டுவதால் ‘யூதா மக்கள் அனைவரும்’ எனத் தெளிவாக்கப்பட்டது.
