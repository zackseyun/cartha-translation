  source_fidelity: 'The draft accurately represents the two deployments: military forces in every fortified city of Judah, and garrisons in Judah and in the Ephraimite cities captured by Asa, Jehoshaphat''s father. The footnote appropriately preserves the administrative sense that נְצִיבִים can bear.'
