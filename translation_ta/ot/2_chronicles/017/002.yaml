translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. முதல் נתן என்பதற்கு ‘நிறுத்தினான்,’ இரண்டாவதற்கு ‘அமர்த்தினான்’ எனச் சூழலுக்கேற்ற இயல்பான வேறுபாடு காக்கப்பட்டது. נְצִיבִים என்பதிலுள்ள இராணுவ/நிர்வாகப் பொருள் ஐயம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
