  text: וַ/יִּ֨תֶּן חַ֔יִל בְּ/כָל עָרֵ֥י יְהוּדָ֖ה הַ/בְּצֻר֑וֹת וַ/יִּתֵּ֤ן נְצִיבִים֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/עָרֵ֣י אֶפְרַ֔יִם אֲשֶׁ֥ר לָכַ֖ד אָסָ֥א אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
translation:
  language: ta
  text: அவன் யூதாவின் அரண்களால் பாதுகாக்கப்பட்ட நகரங்கள் அனைத்திலும் படைகளை நிறுத்தினான். மேலும், யூதா நாட்டிலும் தன் தந்தையான ஆசா கைப்பற்றியிருந்த எப்பிராயீமின் நகரங்களிலும் காவல் படைகளை[a] அமர்த்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆளுநர்களை,’ ‘நியமிக்கப்பட்ட அதிகாரிகளை,’ அல்லது ‘நிர்வாகப் பிரதிநிதிகளை.’ எபிரெயச் சொல் (נְצִיבִים) நியமிக்கப்பட்ட அதிகாரிகளையும் இராணுவக் காவல் அமைப்புகளையும் குறிக்கலாம்; இங்குள்ள இராணுவச் சூழல் ‘காவல் படைகள்’ என்ற பொருளுக்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן חַיִל
  choice: படைகளை நிறுத்தினான்
  rationale: חַיִל என்பதற்கு பல பொருள்கள் இருந்தாலும், அரண் அமைக்கப்பட்ட நகரங்களில் நிறுத்தப்படுவது இங்கு இராணுவப் படைகளையே குறிக்கிறது. נתן என்பதன் அடிப்படைப் பொருளான ‘வைத்தான்’ என்பதை இந்தச் சூழலில் இயல்பாக வெளிப்படுத்த ‘நிறுத்தினான்’ பயன்படுத்தப்பட்டது.
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: யூதாவிலிருந்த அரண் அமைக்கப்பட்ட நகரங்கள் அனைத்திலும்
  rationale: הַבְּצֻרוֹת என்பது பாதுகாப்புக்காக அரண் செய்யப்பட்ட நகரங்களைக் குறிக்கிறது; நவீனத் தமிழில் தெளிவாக இருக்க ‘அரண் அமைக்கப்பட்ட நகரங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נְצִיבִים
  choice: காவற்படைகளை
  rationale: இந்தச் சொல் நியமிக்கப்பட்ட அதிகாரிகளையோ இராணுவக் காவல் அமைப்புகளையோ குறிக்கக்கூடும். முந்தைய பகுதியின் படை மற்றும் அரண் சூழல் காரணமாக ‘காவற்படைகள்’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது; மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: யூதா நாட்டிலும்
  rationale: אֶרֶץ இங்கு நகரங்களைத் தாண்டிய யூதாவின் பரந்த நிலப்பகுதியைக் குறிக்கிறது; ‘யூதா நாடு’ இயல்பான புவியியல் சொல்லாக்கம்.
- source_word: וּבְעָרֵי אֶפְרַיִם
  choice: எப்பிராயீமின் நகரங்களிலும்
  rationale: கோத்திர-புவியியல் உடைமைத் தொடர்பைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לָכַד אָסָא אָבִיו
  choice: தன் தந்தையான ஆசா கைப்பற்றியிருந்த
  rationale: לכד என்பது நகரங்களை இராணுவமாகக் கைப்பற்றுவதைக் குறிக்கிறது. ஆசாவின் முந்தைய செயலைத் தெளிவாக்க ‘கைப்பற்றியிருந்த’ என்ற இறந்தகால முற்றெச்ச வடிவம் பயன்படுத்தப்பட்டது.
