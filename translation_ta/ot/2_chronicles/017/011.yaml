base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
translation:
  language: ta
  text: 'பெலிஸ்தியர்களில் சிலர் யோசபாத்துக்குக் கப்பத்தையும் சுமையாகிய வெள்ளியையும் கொண்டுவந்தார்கள்[a][b]. அரேபியர்களும் அவருக்கு மந்தைகளைக் கொண்டுவந்தார்கள்: செம்மறியாட்டுக் கடாக்கள் 7,700, வெள்ளாட்டுக் கடாக்கள் 7,700.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பெலிஸ்தியர்களிடமிருந்து’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் அவர்களில் சிலரைக் குறிப்பதற்குப் பதிலாக, கப்பம் வந்த மூலத்தை வலியுறுத்தியிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘வெள்ளி, ஒரு சுமை.’ இது கப்பமாகச் சுமந்து கொண்டுவரப்பட்ட வெள்ளியைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִן פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களில் சிலர்
  rationale: מִן ஓர் இனப்பெயருடன் வரும்போது ‘இவர்களில் சிலர்’ என்ற பகுதியுணர்வையோ ‘இவர்களிடமிருந்து’ என்ற மூலத்தைக் குறிக்கும் பொருளையோ தரலாம். இயல்பான தமிழ் நடைக்காக முதன்மைப் பாடத்தில் பகுதியுணர்வு வைக்கப்பட்டு, மற்ற வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מְבִיאִים
  choice: கொண்டுவந்தார்கள்
  rationale: எபிரெயப் பெயரெச்ச வடிவம் தொடர்ச்சியான அல்லது வழக்கமான செயலைக் குறிக்கலாம். இங்கு தமிழ் இறந்தகால வினை சூழலில் இயல்பாக இருந்து, மக்கள் தொடர்ந்து கப்பம் செலுத்திய கருத்தையும் அனுமதிக்கிறது.
- source_word: מִנְחָה
  choice: கப்பமாக
  rationale: அரசனுக்கும் அயல் மக்களுக்கும் இடையிலான அரசியல் சூழலில் இது பொதுவான பரிசையோ வழிபாட்டுப் படையலையோ விடக் கப்பத்தைக் குறிக்கிறது.
- source_word: וְ/כֶסֶף מַשָּׂא
  choice: வெள்ளியைச் சுமை சுமையாக
  rationale: כֶסֶף என்பதன் நேரடிப் பொருள் ‘வெள்ளி’; מַשָּׂא என்பது ‘சுமை’. கப்பமாகச் சுமந்து கொண்டுவரப்பட்ட வெள்ளி என்ற திடமான உருவகத்தை இந்தத் தமிழ் சொற்றொடர் காக்கிறது.
- source_word: גַּם הָעַרְבִיאִים
  choice: அரேபியர்களும்
  rationale: גַּם என்பதன் சேர்க்கைப் பொருளையும் வரலாற்றுச் சூழலுக்குரிய மக்கள் குழுவின் பெயரையும் இயல்பான தமிழில் தருகிறது.
- source_word: ל/וֹ צֹאן
  choice: அவருக்கு மந்தைகளை
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கும் சிறுகால்நடைகளுக்கான கூட்டுப்பெயர்; பின்னர் அவற்றின் ஆண் விலங்குகள் தனித்தனியாகக் குறிப்பிடப்படுவதால் ‘மந்தைகள்’ பொருத்தமானது.
- source_word: אֵילִים
  choice: செம்மறியாட்டுக் கடாக்கள்
  rationale: வயதுவந்த ஆண் செம்மறியாடுகளைத் துல்லியமாகவும் பொதுவாசகருக்குப் புரியும்படியும் குறிக்கிறது.
- source_word: שִׁבְעַת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: 7,700
  rationale: நவீன தமிழ் வாசிப்பில் எளிதாக அறிய அரபிக் எண்கள் பயன்படுத்தப்படுகின்றன; அளவில் மாற்றமில்லை.
- source_word: וּ/תְיָשִׁים
  choice: வெள்ளாட்டுக் கடாக்கள்
  rationale: இந்த எபிரெயச் சொல் குறிப்பாக ஆண் வெள்ளாடுகளைக் குறிக்கிறது; ‘கடாக்கள்’ அந்தப் பாலின வேறுபாட்டைப் பாதுகாக்கிறது.
