source:
  edition: WLC
  text: כִּ֠י לֵֽ/אלֹהֵ֤י אָבִי/ו֙ דָּרָ֔שׁ וּ/בְ/מִצְוֺתָ֖י/ו הָלָ֑ךְ וְ/לֹ֖א כְּ/מַעֲשֵׂ֥ה יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
translation:
  language: ta
  text: மாறாக[a], அவன் தன் தந்தையின் கடவுளைத் தேடினான்; அவருடைய கட்டளைகளின்படி நடந்தான்; இஸ்ரவேலின் செயல்களின்படி அல்ல.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில், அவன் தன் தந்தையின் கடவுளைத் தேடினான்.” எபிரேய இணைப்புச்சொல்லை “ஏனெனில்” என்றும் மொழிபெயர்க்கலாம்; முந்தைய வசனத்துடனான வேறுபாட்டை வெளிப்படுத்த முதன்மை உரையில் “மாறாக” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “இஸ்ரவேல்” என்பது யூதாவுக்கு எதிராக வடக்கு இஸ்ரவேல் ராஜ்யத்தைக் குறிப்பதாக இருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: மாறாக
  rationale: இணைப்புச்சொல் பொதுவாக ‘ஏனெனில்’ என்றும் பொருள்படலாம்; ஆனால் முந்தைய வசனத்திலுள்ள இஸ்ரவேலின் வழிகளோடு யோசபாத்தை வேறுபடுத்திக் காட்டும் சூழலில் எதிர்மறை வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֵאלֹהֵי אָבִיו
  choice: தன் தந்தையின் கடவுளை
  rationale: דרש உடன் வரும் ל தேடப்படும் பொருளைக் குறிக்கிறது; தமிழில் வேற்றுமை உருபுடன் இயல்பாக மொழிபெயர்க்கப்பட்டது. אָבִיו ஒருமையைப் பாதுகாக்க ‘தந்தையின்’ என வழங்கப்பட்டது.
- source_word: דָּרָשׁ
  choice: தேடி
  rationale: இங்கு வெறும் தகவல் விசாரணையை அல்லாமல், கடவுளை நாடும் பக்திசார்ந்த செயலைக் குறிக்கிறது; ‘தேடி’ மூலத்தின் சுருக்கத்தையும் பொருளையும் காக்கிறது.
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  choice: அவருடைய கட்டளைகளின்படி நடந்தான்
  rationale: הלך என்பதன் வாழ்க்கைநடத்தைச் சுட்டும் உருவகத்தை ‘நடந்தான்’ பாதுகாக்கிறது; בְּ இங்கு நெறிக்கேற்ப நடத்தலைக் குறிப்பதால் ‘கட்டளைகளின்படி’ என்பது தெளிவான நவீன தமிழ்.
- source_word: וְלֹא
  choice: நடக்கவில்லை
  rationale: எபிரேயில் வினைச்சொல் மறுபடியும் வராமல் விடப்பட்டிருந்தாலும், தமிழில் முந்தைய ‘நடந்தான்’ என்பதை இயல்பாக நிரப்பி எதிர்மறை வாக்கியமாக்குகிறது.
- source_word: כְּמַעֲשֵׂה
  choice: செயல்களின்படி
  rationale: מַעֲשֶׂה இங்கு நடத்தை அல்லது நடைமுறைகளைக் குறிக்கிறது; ‘செயல்கள்’ மூலத்துக்கு நெருக்கமாகவும் தமிழில் புரியத்தக்கதாகவும் உள்ளது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: மூலத்தில் உள்ள பெயரை அப்படியே தக்கவைத்து, ‘வடக்கு ராஜ்யம்’ என்ற சூழல்சார் விளக்கத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
theological_decisions:
- issue: ‘இஸ்ரவேல்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘இஸ்ரவேல்’ என்றே வைத்தல்
  alternative: ‘வடக்கு இஸ்ரவேல் ராஜ்யம்’ அல்லது ‘ஆகாபின் வீடு’ என்று விரித்துரைத்தல்
  rationale: எபிரேய உரை ‘இஸ்ரவேல்’ என்று மட்டுமே கூறுகிறது. இது இங்கு யூதாவுக்கு எதிராக வடக்கு ராஜ்யத்தைக் குறிக்கக்கூடும் என்ற சூழல்சார் விளக்கத்தை அடிக்குறிப்பில் தருவது, மூல உரையின் சாத்தியமான விரிவை முதன்மை உரை முன்கூட்டியே தீர்மானிக்காமல் காக்கிறது.
- issue: כִּי இணைப்புச்சொல்லின் தொடர்பு
  choice: சூழலிலுள்ள வேறுபாட்டை வெளிப்படுத்த ‘மாறாக’
  alternative: ‘ஏனெனில்’ அல்லது ‘ஆகையால்’
  rationale: כִּי காரணத்தைக் குறிக்கக்கூடியது என்ற மொழியியல் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; முந்தைய வசனத்துடன் உள்ள தெளிவான வேறுபாட்டை முதன்மை உரை இயல்பான தமிழில் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நடந்தான்’ என்ற வேதாகம வாழ்க்கைநடை உருவகம் காக்கப்பட்டாலும், ‘கட்டளைகளில் நடந்தான்’ என்ற செயற்கையான சொல்லமைப்புக்கு பதிலாக ‘கட்டளைகளின்படி நடந்தான்’ என இயல்பாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
