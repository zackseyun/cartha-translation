revisions:
- from: இவர்களே அரசனுக்குப் பணிசெய்தவர்கள்; இவர்களைத் தவிர, யூதா முழுவதிலும் இருந்த அரண்சூழ்ந்த நகரங்களில் அரசன் நிறுத்திவைத்தவர்களும் இருந்தார்கள்.
  to: யூதா முழுவதிலும் உள்ள அரணமைக்கப்பட்ட நகரங்களில் அரசன் நிறுத்தியவர்களைத் தவிர, இவர்களே அரசனுக்குச் சேவை செய்தவர்கள்.
  rationale: The revision preserves the Hebrew’s resumptive “these,” the participial sense of service to the king, and the distinction/addition expressed by מִלְּבַד. It also uses a more precise contemporary Tamil expression for fortified cities without adding interpretive detail.
