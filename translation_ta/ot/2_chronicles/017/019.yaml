translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் சுருக்கமான அமைப்பு தமிழில் தெளிவாக இருக்க இரண்டு இணை வாக்கியங்களாக அமைக்கப்பட்டது; எந்த சமயப்பிரிவு சார்ந்த விளக்கமும் சேர்க்கப்படவில்லை.
