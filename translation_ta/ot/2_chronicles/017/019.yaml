base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/019.yaml
  text: These were the ones serving the king[a], besides those whom the king had stationed in the fortified cities throughout all Judah.
translation:
  language: ta
  text: யூதா முழுவதிலும் உள்ள அரணமைக்கப்பட்ட நகரங்களில் அரசன் நிறுத்தியவர்களைத் தவிர, இவர்களே அரசனுக்குச் சேவை செய்தவர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְשָׁרְתִים אֶת־הַמֶּלֶךְ
  choice: அரசனுக்குப் பணிசெய்தவர்கள்
  rationale: שׁרת என்பதன் பங்கேற்புவினை வடிவம் அதிகாரப்பூர்வமான சேவை அல்லது உடனிருந்து பணிபுரிதலைக் குறிக்கிறது. இராணுவ-நிர்வாகச் சூழலில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘பணிசெய்தவர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִלְּבַד
  choice: இவர்களைத் தவிர
  rationale: முன்பு பட்டியலிடப்பட்டவர்களிலிருந்து வேறான இன்னொரு குழுவை இச்சொல் சுட்டுகிறது. ‘தவிர’ என்பது அந்த வேறுபாட்டைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר נָתַן הַמֶּלֶךְ
  choice: அரசன் நிறுத்திவைத்தவர்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘வைத்தான்/கொடுத்தான்’ என்றாலும், அரண்சூழ்ந்த நகரங்களில் படையினரை நியமித்த இராணுவச் சூழலில் ‘நிறுத்திவைத்தவர்கள்’ என்பது செயல்பாட்டுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: அரண்சூழ்ந்த நகரங்களில்
  rationale: இக்கூட்டுச்சொல் பாதுகாப்புக்காக அரணிடப்பட்ட நகரங்களைக் குறிக்கிறது. ‘அரண்சூழ்ந்த நகரங்கள்’ என்பது தெளிவான, தற்போதைய தமிழாக்கம்.
- source_word: בְּכָל יְהוּדָה
  choice: யூதா முழுவதிலும்
  rationale: בְּ + כָּל என்பது யூதா பிரதேசம் முழுவதிலும் பரவியிருந்த நிலையைத் தெரிவிக்கிறது.
- source_word: אֵלֶּה
  choice: இவர்களே
  rationale: சுட்டுப்பெயர் முன்பு எண்ணிக் கூறப்பட்ட அதிகாரிகளையும் படையினரையும் திரும்பச் சுட்டுகிறது; ‘இவர்களே’ அதன் தொகுப்புச் செயல்பாட்டை இயல்பான தமிழில் தருகிறது.
