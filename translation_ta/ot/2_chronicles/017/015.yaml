  yaml_path: translation/ot/2_chronicles/017/015.yaml
  text: And under his command was Jehohanan the commander[a], and with him were two hundred and eighty thousand.
translation:
  language: ta
  text: அவனுடைய அதிகாரத்தின் கீழ் தளபதியான யெகோஹானான்[a] இருந்தான்; அவனுடன் இருநூற்று எண்பதாயிரம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்கு அருகில் தளபதியான யெகோஹானான் இருந்தான்”; அல்லது, “அவனுடைய அதிகாரத்தின்கீழ் தளபதியான யெகோஹானான் இருந்தான்.” எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் “அவனுடைய கையின்மேல்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: அவனுடைய அதிகாரத்தின்கீழ்
  rationale: ‘அவனுடைய கையின்மேல்’ என்ற எபிரெயச் சொற்றொடர் இங்கு இராணுவ நிர்வாகப் பட்டியலில் ஒருவரின் அதிகாரம் அல்லது தலைமையின்கீழ் இருப்பதைக் குறிக்கிறது.
- source_word: יְהוֹחָנָן
  choice: யெகோனான்
  rationale: தனிப்பெயர் எபிரெய வடிவத்தை நெருக்கமாகப் பிரதிபலிக்கும் வகையில் ஒலிபெயர்க்கப்பட்டது.
- source_word: הַשַּׂר
  choice: தளபதி
  rationale: שַׂר என்பது தலைவர், அதிகாரி, தளபதி எனப் பொருள்படக்கூடியது; இங்குள்ள இராணுவப் பட்டியல் சூழலில் ‘தளபதி’ இயல்பானது.
- source_word: וְעִמּוֹ
  choice: அவனுடன் ... இருந்தார்கள்
  rationale: யெகோனானுடன் இணைக்கப்பட்ட படைவீரர்களின் எண்ணிக்கையை அறிமுகப்படுத்தும் சொற்றொடராகத் தெளிவுபடுத்தப்பட்டது.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: 2,80,000 பேர்
  rationale: எபிரெய மூலத்திலுள்ள 280,000 என்ற எண்ணிக்கையைத் துல்லியமாகவும் தமிழில் வழக்கமான இந்திய இலக்கப் பிரிப்புடனும் வழங்குகிறது; சூழலின்படி ‘பேர்’ சேர்க்கப்பட்டது.
