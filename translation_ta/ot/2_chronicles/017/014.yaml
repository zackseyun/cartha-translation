base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/014.yaml
  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
translation:
  language: ta
  text: 'அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படியான படைத்திரட்டுப் பிரிவுகள்[a] இவையே: யூதாவுக்காக, ஆயிரம் பேருக்கான படைத்தலைவர்கள்: தலைவரான அத்னா; அவருடன் மூன்று இலட்சம் வல்லமைமிக்க வீரர்கள் இருந்தனர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய எண்ணிக்கை” அல்லது “அவர்களுடைய பதிவுப் பட்டியல்”; எபிரெயச் சொல் மக்கள் அல்லது படைவீரர்களைக் கணக்கெடுத்தல், படைத்திரட்டல், அல்லது அதன் விளைவாக அமைந்த படைப்பிரிவுகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: அவர்களுடைய படைத்திரட்டுப் பிரிவுகள்
  rationale: פקד என்ற வேரிலிருந்து வந்த இச்சொல் இங்கு இராணுவச் சூழலில் படைவீரர்களைக் கணக்கெடுத்தல், திரட்டல், அல்லது அதன் விளைவாக அமைந்த படைப்பிரிவுகள் ஆகிய பொருள்களைத் தரலாம். தொடரும் தலைவர்கள் மற்றும் வீரர் எண்ணிக்கைகளின் பட்டியலுக்கு ஏற்றவாறு ‘படைத்திரட்டுப் பிரிவுகள்’ என மொழிபெயர்க்கப்பட்டது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: அவர்களுடைய தந்தைவழிக் குடும்பங்களின்படி
  rationale: வம்சம் மற்றும் நிர்வாக அமைப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரை, இன்றைய வாசகர்களுக்குப் புரியும் வகையிலும் தந்தைவழி அமைப்பைத் தெளிவாகக் காட்டும் வகையிலும் மொழிபெயர்க்கிறது.
- source_word: לִיהוּדָה
  choice: யூதாவுக்குரிய
  rationale: பட்டியலிடப்படும் படைப்பிரிவு யூதாவைச் சேர்ந்தது என்பதைத் தலைப்புப்போல் அறிமுகப்படுத்துகிறது.
- source_word: שָׂרֵי אֲלָפִים
  choice: ஆயிரம் பேரின் படைத்தலைவர்கள்
  rationale: ஆயிரக்கணக்கான படைவீரர்களுக்குப் பொறுப்பான இராணுவ அதிகாரிகளைக் குறிக்கும் பதவி. ‘படைத்தலைவர்கள்’ என்பது நவீன தமிழில் தெளிவானது.
- source_word: עַדְנָה הַשָּׂר
  choice: படைத்தலைவரான அத்னா
  rationale: הַשָּׂר என்பது அத்னாவின் இராணுவத் தலைமைப் பதவியை அடையாளப்படுத்துகிறது; முந்தைய שָׂרֵי என்பதுடனான சொற்பொருள் தொடர்பும் காக்கப்பட்டுள்ளது.
- source_word: גִּבּוֹרֵי חַיִל
  choice: வல்லமைமிக்க வீரர்கள்
  rationale: போர்த்திறனும் வலிமையும் கொண்ட தேர்ந்த வீரர்களைக் குறிக்கும் எபிரெய மரபுத்தொடரின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: שְׁלֹשׁ מֵאוֹת אָלֶף
  choice: மூன்று இலட்சம் பேர்
  rationale: எபிரெய மூலத்தின் எண்ணிக்கையை மாற்றமின்றி, தமிழில் வழக்கமான எண்ணியல் வடிவில் தருகிறது.
