translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பங்கள்’ பழங்கால வம்ச அடிப்படையிலான நிர்வாக அமைப்பைத் தெளிவாக்குகிறது. எபிரெய வாக்கியத்தின் பட்டியல் தன்மையைத் தக்கவைத்தபடியே தமிழில் முழுமையான வாக்கியமாக இயல்பாக்க ‘இருந்தனர்’ சேர்க்கப்பட்டுள்ளது.
