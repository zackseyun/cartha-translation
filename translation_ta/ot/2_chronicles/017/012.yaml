base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/012.yaml
  text: And Jehoshaphat became greater and greater[b][a], and he built fortresses and store cities in Judah.
translation:
  language: ta
  text: யோசபாத் தொடர்ந்து மேலும் மேலும் மகத்துவம் அடைந்தார்; அவர் யூதாவில் கோட்டைகளையும்[a] சேமிப்புப் பட்டணங்களையும்[b] கட்டினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரண்கள்.” எபிரெயச் சொல் அரண் செய்யப்பட்ட வலுவான இடங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “களஞ்சியப் பட்டணங்கள்” அல்லது “வழங்கல் பட்டணங்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... הֹלֵךְ וְגָדֵל עַד לְמָעְלָה
  choice: மேலும் மேலும் வலிமைபெற்று உயர்ந்தார்
  rationale: தொடர்ந்து அதிகரித்து மிக உயர்ந்த நிலையை அடைந்ததைக் குறிக்கும் எபிரெய முறையை இயல்பான தமிழில் தருகிறது. சூழலில் அரச வலிமையும் செல்வாக்கும் வளர்ந்ததைக் காட்டுவதால் ‘வலிமைபெற்று’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; עַד לְמָעְלָה என்பதன் தீவிரப்படுத்தும் நுணுக்கத்தை ‘உயர்ந்தார்’ தக்கவைக்கிறது.
- source_word: וַיִּבֶן
  choice: கட்டினார்
  rationale: கட்டுமானத்தைச் சுட்டும் வழக்கமான, நேரடியான தமிழ் வினைச்சொல்.
- source_word: בִּיהוּדָה
  choice: யூதாவில்
  rationale: கட்டுமானம் நடைபெற்ற இடத்தை நேரடியாகக் குறிக்கிறது.
- source_word: בִּירָנִיּוֹת
  choice: கோட்டைகள்
  rationale: பாதுகாப்புக்காக அரண் செய்யப்பட்ட வலுவான இடங்களைக் குறிக்கும் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: சேமிப்புப் பட்டணங்கள்
  rationale: பொருட்களையும் தேவையான வழங்கல்களையும் சேமிப்பதற்குப் பயன்படுத்தப்பட்ட நிர்வாக அல்லது இராணுவ நகரங்களைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று உரைக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் தொடர்ச்சியான வளர்ச்சியும் தீவிரப்படுத்தலும் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளன.
