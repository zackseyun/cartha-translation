  text: וְ/עַל יָד/וֹ֙ עֲמַסְיָ֣ה בֶן זִכְרִ֔י הַ/מִּתְנַדֵּ֖ב לַ/יהוָ֑ה וְ/עִמּ֛/וֹ מָאתַ֥יִם אֶ֖לֶף גִּבּ֥וֹר חָֽיִל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
translation:
  language: ta
  text: அவனுடைய கட்டுப்பாட்டின்கீழ் சிக்ரியின் மகனான அமசியா இருந்தான். அவன் யாவேக்கு மனமுவந்து தன்னை அர்ப்பணித்தவன்[a]. அவனுடன் வலிமைமிக்க வீரர்கள் இருநூறாயிரம் பேர் இருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்காகத் தன்னை மனமுவந்து ஒப்புக்கொடுத்தவன்.” எபிரெயப் பங்கேற்புச் சொல் தன்னார்வமான சுயஅர்ப்பணிப்பை வலியுறுத்தலாம்; அதனுடன் வரும் முன்னொட்டு “யாவேக்கு” என்றும் “யாவேக்காக” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: அவனுக்கு அடுத்தபடியாக
  rationale: படைத் தலைவர்களையும் அவர்களுடன் இருந்த வீரர்களையும் வரிசையாகப் பட்டியலிடும் சூழலில், இந்த எபிரெய மரபுத்தொடர் முந்தைய தலைவருக்கு அடுத்த இடத்திலிருந்தவரை அறிமுகப்படுத்துகிறது. எனவே தெளிவான நவீனத் தமிழில் இவ்வாறு தரப்பட்டது.
- source_word: עֲמַסְיָה בֶן זִכְרִי
  choice: சிக்ரியின் மகனான அமசியா
  rationale: தனிப்பெயர்கள் எபிரெய ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டன; בֶן குறிக்கும் மகன் உறவும் வெளிப்படையாக வைக்கப்பட்டது.
- source_word: הַמִּתְנַדֵּב לַיהוָה
  choice: யாவேக்கு மனமுவந்து தன்னை அர்ப்பணித்தவன்
  rationale: התפעל வினையிலிருந்து வந்த பங்கேற்புச் சொல் தன்னார்வத்தையும் தன்னையே ஒப்புக்கொடுக்கும் நுண்பொருளையும் கொண்டுள்ளது. לַיהוָה அர்ப்பணிப்பின் இலக்காக யாவேயைக் காட்டுகிறது.
- source_word: וְעִמּוֹ מָאתַיִם אֶלֶף
  choice: அவனுடன் ... இருநூறாயிரம் பேர் இருந்தார்கள்
  rationale: அமசியாவுடன் இணைக்கப்பட்ட படைவீரர்களின் எண்ணிக்கையை இயல்பான தமிழ் வாக்கிய அமைப்பில் தெரிவிக்கிறது.
- source_word: גִּבּוֹר חָיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: இந்த இருசொல் இராணுவச் சொற்றொடர் வலிமையும் போர்திறனும் கொண்ட வீரர்களைக் குறிக்கிறது; உயர்வான தன்மையை இழக்காமல் இன்றைய வாசகருக்குத் தெளிவாக மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் கடவுளின் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைபெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் வழக்கமான ஒலிப்பெயர்ப்பான ‘யாவே’ என்று தரப்பட்டது.
- issue: לַיהוָה என்பதிலுள்ள அர்ப்பணிப்பின் தொடர்பு
  choice: யாவேக்கு ... தன்னை அர்ப்பணித்தவன்
  alternative: யாவேக்காகத் தன்னை மனமுவந்து ஒப்புக்கொடுத்தவன்
  rationale: ל முன்னொட்டு ‘யாவேக்கு’ அல்லது ‘யாவேக்காக’ எனப் புரிந்துகொள்ளப்படலாம். முதன்மை உரை அர்ப்பணிப்பின் இலக்கை முன்னிறுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இராணுவப் பட்டியலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘அடுத்தபடியாக’ என்பது சூழலிலுள்ள தலைவர்களின் வரிசையை இயல்பாகக் காட்டுகிறது; ‘மனமுவந்து தன்னை அர்ப்பணித்தவன்’ என்பது தன்னார்வத்தையும் சுய அர்ப்பணிப்பையும் இரண்டையும் காக்கிறது.
