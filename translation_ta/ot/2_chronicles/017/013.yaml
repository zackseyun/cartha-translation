lexical_decisions:
- source_word: מְלָאכָה רַבָּה
  choice: ஏராளமான பணிகள்
  rationale: מְלָאכָה என்பதன் முதன்மைப் பொருள் வேலை அல்லது பணி. சூழலில் அதன் துல்லிய இயல்பு குறிப்பிடப்படாததால், ‘சொத்துகள்’ என்று பொருளைச் சுருக்காமல் பொதுவான சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: போரில் வல்ல ... வீரர்கள்
  rationale: சொல்லுக்குச் சொல் ‘போர் மனிதர்கள்’; இயல்பான நவீனத் தமிழில் போர்த் திறன் கொண்ட வீரர்கள் என்ற பொருளை வெளிப்படுத்துகிறது.
- source_word: גִּבּוֹרֵי חַיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: வலிமை, திறமை, வீரத்தன்மை ஆகிய பொருள்களைக் கொண்ட எபிரெயச் சொற்றொடரைப் பொதுவாகவும் கண்ணியமாகவும் தருகிறது.
