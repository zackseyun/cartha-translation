translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுக் குறிப்புக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இரண்டாம் எபிரெயக் கூறு வினையற்றதாக இருப்பதால், தமிழில் தெளிவுக்காக ‘அவரிடம் இருந்தார்கள்’ என்று நிரப்பப்பட்டுள்ளது; இது முதல் கூறிலுள்ள ‘அவருக்கு’ என்பதோடு இயல்பாக இணைகிறது.
