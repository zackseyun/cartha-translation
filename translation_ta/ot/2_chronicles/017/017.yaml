  text: וּ/מִ֨ן בִּנְיָמִ֔ן גִּבּ֥וֹר חַ֖יִל אֶלְיָדָ֑ע וְ/עִמּ֛/וֹ נֹֽשְׁקֵי קֶ֥שֶׁת וּ/מָגֵ֖ן מָאתַ֥יִם אָֽלֶף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/017.yaml
  text: 'And from Benjamin: Eliada[a], a mighty man of valor, and with him two hundred thousand armed with bow and shield.'
translation:
  language: ta
  text: பென்யமீன் கோத்திரத்திலிருந்து வலிமைமிக்க வீரனான எலியாதாவும், அவனோடு வில்லும் கேடயமும் ஏந்திய இருநூறாயிரம் பேரும் இருந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வில்லும் கேடயமும் தாங்கியவர்கள்’ அல்லது ‘வில் மற்றும் கேடயங்களுடன் ஆயத்தமாக இருந்தவர்கள்.’ எபிரெயப் பங்கேற்பு வடிவம், இந்த ஆயுதங்களால் ஆயத்தமாக இருந்த ஆட்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בִּנְיָמִן
  choice: பென்யமீன் கோத்திரத்திலிருந்து
  rationale: இடைச்சொல் முந்தைய பட்டியலுடன் இந்தப் படைப்பிரிவை இணைக்கிறது. தமிழில் பழங்குடியைக் குறிக்கும் பெயர் இயல்பாகப் புரிய ‘கோத்திரம்’ தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: גִּבּוֹר חַיִל
  choice: வலிமைமிக்க வீரன்
  rationale: இந்தச் சொற்றொடர் வலிமையும் போர்வீரத் திறனும் கொண்ட ஒருவரைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: אֶלְיָדָע
  choice: எலியாதா
  rationale: எபிரெய தனிப்பெயரின் ஒலிவடிவம் தமிழில் பெயர்க்கப்பட்டுள்ளது.
- source_word: וְעִמּוֹ
  choice: அவனோடு
  rationale: முதலில் தலைவனையும் பின்னர் அவனுடன் இருந்த படைவீரர்களையும் குறிப்பிடும் பட்டியல் அமைப்பைப் பேணுகிறது.
- source_word: נֹשְׁקֵי קֶשֶׁת וּמָגֵן
  choice: வில்லும் கேடயமும் ஏந்தியிருந்தவர்கள்
  rationale: பங்கேற்புவினை வடிவம் இந்த ஆயுதங்களைத் தரித்த அல்லது அவற்றால் ஆயத்தப்படுத்தப்பட்ட ஆட்களைக் குறிக்கிறது. ‘ஏந்தியிருந்தவர்கள்’ என்பது உருவகத்தையும் இராணுவச் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מָאתַיִם אָלֶף
  choice: இருநூறாயிரம் பேர்
  rationale: எபிரெய எண்ணிக்கையை நேரடியாகத் தருகிறது; ‘பேர்’ மனிதர்களின் எண்ணிக்கை என்பதை இயல்பாகக் காட்டுகிறது.
