source:
  edition: WLC
  text: וַ/יְהִ֣י פַּ֣חַד יְהוָ֗ה עַ֚ל כָּל מַמְלְכ֣וֹת הָֽ/אֲרָצ֔וֹת אֲשֶׁ֖ר סְבִיב֣וֹת יְהוּדָ֑ה וְ/לֹ֥א נִלְחֲמ֖וּ עִם יְהוֹשָׁפָֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
translation:
  language: ta
  text: யூதாவைச் சுற்றியிருந்த நாடுகளின் எல்லா அரசுகளின்மேலும் யாவேயின் பேரச்சம் வந்தது[a]. அவர்கள் யோசபாத்துக்கு எதிராகப் போரிடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேயிடமிருந்து வந்த திகில்” அல்லது “யாவேயால் உண்டான பேரச்சம்” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்றொடர் யாவேயுடன் தொடர்புடைய அச்சத்தைக் குறிக்கலாம்; இங்கே சுற்றியிருந்த அரசுகளின்மேல் தேவனால் உண்டாக்கப்பட்ட பேரச்சத்தைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ஏற்பட்டது
  rationale: ஒரு நிலை புதிதாக உண்டாகி அவர்களை ஆட்கொண்டதைக் குறிக்கும் எபிரேயச் சொற்றொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פַּחַד יְהוָה
  choice: யாவே பற்றிய திகில்
  rationale: פַּחַד என்பது அச்சம், திகில், பேரச்சம் ஆகிய பொருள்களைக் கொண்டது. இக்கட்டமைப்பு யாவே குறித்த திகிலையோ யாவேயால் உண்டான திகிலையோ குறிக்கலாம்; முதன்மை உரை அந்தத் தொடர்பைத் திறந்தவாறே வைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: நாடுகளின் எல்லா அரசுகள்மேலும்
  rationale: מַמְלְכוֹת என்பதற்கு ‘அரசுகள்’ என்றும் הָאֲרָצוֹת என்பதற்கு ‘நாடுகள்’ என்றும் தனித்தனியாக இடமளித்து, עַל குறிக்கும் பாதிப்பை ‘மேலும்’ எனக் காட்டுகிறது.
- source_word: אֲשֶׁר סְבִיבוֹת יְהוּדָה
  choice: யூதாவைச் சுற்றியிருந்த
  rationale: யூதாவைச் சூழ்ந்திருந்த அண்டை நாடுகளைச் சுட்டும் உறவுக்கூற்றைச் சுருக்கமின்றி இயல்பான தமிழில் தருகிறது.
- source_word: וְלֹא נִלְחֲמוּ עִם
  choice: அதனால் அவர்கள் ... எதிராகப் போரிடவில்லை
  rationale: נלחם עם என்பதன் இராணுவப் பொருளை ‘எதிராகப் போரிடு’ எனத் தெளிவாகக் காட்டுகிறது. சூழலில் அச்சமே போரின்மைக்குக் காரணம் என்பதால் இணைப்பை இயல்பான தமிழில் ‘அதனால்’ என வெளிப்படுத்துகிறது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: எபிரேயத் தனிப்பெயரின் வழக்கமான தமிழ் வேதாகம ஒலிவடிவத்தைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: פַּחַד יְהוָה என்பதன் பொருள்
  choice: யாவே பற்றிய திகில்; சூழலில் யாவேயால் உண்டாக்கப்பட்ட திகிலையும் உள்ளடக்கக்கூடிய திறந்த வடிவம்
  alternative: யாவேயிடமிருந்து வந்த திகில்; யாவே மீதான பயபக்தி
  rationale: இராணுவ-அரசியல் சூழல் சுற்றியிருந்த அரசுகளைப் போரிலிருந்து தடுத்த தெய்வீகமாக உண்டான பேரச்சத்தை வலியுறுத்துகிறது. எனினும் எபிரேயச் சார்புநிலையின் இலக்கணத் தெளிவின்மையை முதன்மை உரை முற்றிலும் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட வரலாற்று நடையாக அமைக்கப்பட்டுள்ளது. ‘திகில்’ இராணுவச் சூழலின் வலிமையைத் தருகிறது; அடிக்குறிப்பு எபிரேயத்தின் உண்மையான பொருள் வாய்ப்புகளைப் பாதுகாக்கிறது.
