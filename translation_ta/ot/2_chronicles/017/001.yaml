source:
  edition: WLC
  text: וַ/יִּמְלֹ֛ךְ יְהוֹשָׁפָ֥ט בְּנ֖/וֹ תַּחְתָּ֑י/ו וַ/יִּתְחַזֵּ֖ק עַל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/001.yaml
  text: And Jehoshaphat his son became king in his place, and he strengthened himself against Israel.
translation:
  language: ta
  text: அவருக்குப் பதிலாக அவருடைய மகன் யோசபாத் அரசரானார்; அவர் இஸ்ரவேலுக்கு எதிராகத் தன்னை வலுப்படுத்திக்கொண்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: அரசரானார்
  rationale: ‘அரசாளத் தொடங்கினார் / அரசரானார்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: תַּחְתָּיו
  choice: அவருக்குப் பதிலாக
  rationale: முந்தைய அரசரின் இடத்தில் வாரிசாக ஆட்சியேற்றதைக் குறிக்கும் எபிரெய வழக்கை இயல்பாக எடுத்துரைக்கிறது.
- source_word: וַיִּתְחַזֵּק
  choice: தன்னை வலுப்படுத்திக்கொண்டார்
  rationale: ஹித்பயேல் வடிவத்தின் தன்னிலை/தீவிரப் பொருளைப் பாதுகாக்கிறது; சூழலில் தன் ஆட்சியையோ பாதுகாப்பையோ வலுப்படுத்தியதாகப் பொருள் கொள்ளலாம்.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: இங்கு עַל பகைமை அல்லது எதிர்நிலை உறவைச் சுட்டுகிறது; வடக்கு இஸ்ரவேல் அரசுக்கு எதிராகத் தன்னை வலுப்படுத்தியதாக மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ‘இஸ்ரவேல்’ என்பதன் குறிப்பு
  choice: இஸ்ரவேல்
  alternative: இஸ்ரவேல் அரசு / வடக்கு இஸ்ரவேல் அரசு
  rationale: மூலத்தில் உள்ள சுருக்கமான பெயரையே வைத்திருந்து, உரையில் இல்லாத அரசியல் விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; வரலாற்று உரைக்கு ஏற்ற கண்ணியமான, தெளிவான நடை. ‘தன்னை வலுப்படுத்திக்கொண்டார்’ என்ற சொற்றொடர் மூலத்தின் தன்னிலைச் செயலைப் பாதுகாக்கிறது.
