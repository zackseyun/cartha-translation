base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
translation:
  language: ta
  text: அவர்களுடன் லேவியர்களான செமாயா, நெத்தனியா, செபதியா, ஆசகேல், செமிராமோத், யெஹோனத்தான்[a], அதோனியா, தோபியாஹு[b], தோப்-அதோனியா[c] ஆகியோர் இருந்தார்கள். அவர்களுடன் ஆசாரியர்களான எலிசாமாவும் யோராமும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யெஹோனத்தான்’ என்பது இங்குள்ள எபிரெய பெயரின் முழு வடிவம்; சில மொழிபெயர்ப்புகள் இதைச் சுருக்கி ‘யோனத்தான்’ என வழங்குகின்றன.
    reason: lexical_alternative
  - marker: b
    text: ‘தோபியாஹு’ என்பது எபிரெய பெயரின் முழு வடிவத்தைப் பிரதிபலிக்கிறது; சுருக்கமான வடிவம் ‘தோபியா’.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய உரையில் ‘தோப் அதோனியா’ என்று இரண்டு கூறுகளாக எழுதப்பட்டுள்ளது; இது ஒரே கூட்டுத் தனிப்பெயராக இருக்க வாய்ப்புள்ளதால் இங்கு ‘தோப்-அதோனியா’ என வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: அவர்களுடன் ... இருந்தார்கள்
  rationale: எபிரெய முன்னிடைச்சொற்றொடர் உடன்சென்றவர்களை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான முழு வாக்கியமாக அமைய ‘இருந்தார்கள்’ சேர்க்கப்பட்டது.
- source_word: הַלְוִיִּם
  choice: லேவியர்களான
  rationale: குறிப்பிட்ட லேவியப் பணியாளர் குழுவைக் குறிக்கும் எபிரெய சொல்லின் வரையறுத்த தன்மையையும், தொடர்ந்து வரும் பெயர்களுடன் அதன் தொடர்பையும் இது தெளிவாகக் காட்டுகிறது.
- source_word: שְׁמַעְיָהוּ
  choice: செமாயா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் பரவலாக அறியத்தக்க ஒலிபெயர்ப்பு.
- source_word: נְתַנְיָהוּ
  choice: நெத்தனியா
  rationale: எபிரெய தனிப்பெயரை இயல்பான தமிழ் ஒலியமைப்பில் வழங்குகிறது.
- source_word: זְבַדְיָהוּ
  choice: செபதியா
  rationale: எபிரெய தனிப்பெயருக்கான அறியத்தக்க தமிழ் ஒலிபெயர்ப்பு.
- source_word: עֲשָׂהאֵל
  choice: ஆசகேல்
  rationale: தனிப்பெயரின் எபிரெய ஒலிவடிவத்தைத் தமிழில் நெருக்கமாகக் காட்டுகிறது.
- source_word: שמרימות
  choice: செமிராமோத்
  rationale: மெய்யெழுத்து வடிவத்துக்கு ஏற்ற தனிப்பெயர் ஒலிபெயர்ப்பு.
- source_word: יְהוֹנָתָן
  choice: யெகோனத்தான்
  rationale: இங்கு காணப்படும் நீண்ட எபிரெய பெயர்வடிவத்தைச் சுருக்காமல் பிரதிபலிக்கிறது.
- source_word: אֲדֹנִיָּהוּ
  choice: அதோனியா
  rationale: எபிரெய தனிப்பெயருக்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு.
- source_word: טוֹבִיָּהוּ
  choice: தோபியாஹு
  rationale: மூலத்தில் உள்ள -யாஹு இறுதியை வெளிப்படையாகப் பேணுகிறது.
- source_word: טוֹב אֲדוֹנִיָּה
  choice: தோப்-அதோனியா
  rationale: மசோரா உரையில் இரண்டு கூறுகளாக எழுதப்பட்டிருந்தாலும் ஒரே கூட்டுத் தனிப்பெயராகச் செயல்படுவதாகத் தோன்றுவதால் இடைக்கோடு பயன்படுத்தப்பட்டது.
- source_word: אֱלִישָׁמָע
  choice: எலிசாமா
  rationale: எபிரெய தனிப்பெயரின் இயல்பான தமிழ் ஒலிபெயர்ப்பு.
- source_word: יְהוֹרָם
  choice: யோராம்
  rationale: தமிழில் அறியத்தக்க வடிவத்தைப் பயன்படுத்தி எபிரெய தனிப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்களான
  rationale: இறுதியில் வரும் இருவரையும் முதல் பட்டியலிலுள்ள லேவியர்களிலிருந்து தனிக் குழுவாக அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: லேவியர்களுக்கும் ஆசாரியர்களுக்கும் இடையிலான வேறுபாடு
  choice: முதல் பெயர்ப்பட்டியலை ‘லேவியர்கள்’ என்றும், எலிசாமாவையும் யோராமையும் தனியே ‘ஆசாரியர்கள்’ என்றும் வழங்குதல்
  alternative: எல்லாப் பெயர்களையும் வேறுபாடின்றி ஒரே லேவியர் பட்டியலாக வழங்குதல்
  rationale: எபிரெய வாக்கிய அமைப்பு முதலில் லேவியர்களையும், பின்னர் ‘அவர்களுடன்’ இருந்த எலிசாமா, யோராம் ஆகிய ஆசாரியர்களையும் தனித்தனியாகக் குறிக்கிறது; இந்த அமைப்புசார் வேறுபாட்டைப் பேண வேண்டும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட பட்டியல் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய தொடரமைப்பு அப்படியே கடினமாக ஒட்டப்படாமல், இரு பணிக்குழுக்களின் வேறுபாடு தெளிவாகத் தெரியும் வகையில் இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது. தனிப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன.
