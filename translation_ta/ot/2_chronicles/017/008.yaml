  terminology: ‘லேவியர்கள்’ and ‘ஆசாரியர்கள்’ accurately retain the institutional distinction in the Hebrew. The compound-name treatment ‘தோப்-அதோனியா’ appropriately reflects the likely single personal name while retaining the textual ambiguity explained in the note.
