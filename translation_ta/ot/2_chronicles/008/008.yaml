base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
translation:
  language: ta
  text: அவர்களுடைய வழித்தோன்றல்களில், அவர்களுக்குப் பின்பு நாட்டில் எஞ்சியிருந்தவர்களை—இஸ்ரவேல் மக்கள் அழித்தொழிக்காதவர்களை[a]—சாலொமோன் கட்டாய உழைப்புக்கு[b] உட்படுத்தினான்; அது இன்றுவரை தொடர்ந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர் முற்றிலும் ஒழித்துக்கட்டாதவர்களை.” எபிரெயில் சொற்படியாக “இஸ்ரவேலின் மகன்கள்” என்று உள்ளது; இது இஸ்ரவேல் மக்களைக் குறிக்கும் வழக்கமான தேசியப் பெயர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கட்டாய அரசுப் பணிக்கு.” எபிரெயச் சொல் அரசு விதித்த கட்டாய உழைப்பையோ பணிக்கடமையையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  choice: அவர்களுடைய வழித்தோன்றல்களில்
  rationale: בנים என்பது சொற்படியாக ‘மகன்கள்/பிள்ளைகள்’ என்றாலும், இங்கு முந்தைய மக்களினங்களின் பிற்காலச் சந்ததியினரைக் குறிக்கிறது; ‘வழித்தோன்றல்கள்’ அந்தப் பரந்த மரபுவழிப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם בָּאָרֶץ
  choice: அவர்களுக்குப் பின்பு அந்த நாட்டில் எஞ்சியிருந்தவர்களை
  rationale: נוֹתְרוּ என்பதன் எஞ்சியிருத்தல் என்ற விளைவுநிலையையும், אַחֲרֵיהֶם என்பதன் காலத்தொடர்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֲשֶׁר לֹא כִלּוּם בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் முற்றிலும் அழிக்காதவர்களை
  rationale: Piel வடிவிலுள்ள כלה இச்சூழலில் முழுமையாக அழித்தல் அல்லது ஒழித்துக்கட்டுதல் என்ற பொருளுடையது. ‘இஸ்ரவேல் மக்கள்’ என்பது எபிரெய ‘இஸ்ரவேலின் மகன்கள்’ என்ற தேசியப் பெயரைக் குறிக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: וַיַּעֲלֵם שְׁלֹמֹה לְמַס
  choice: சாலொமோன் கட்டாய வேலைக்காக அமர்த்தினான்
  rationale: עלה + לְמַס என்ற நிர்வாக மரபுத்தொடர், அவர்கள்மீது கட்டாய அரசுப் பணியை விதித்ததைக் குறிக்கிறது; ‘அமர்த்தினான்’ causative செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இன்றுவரை அவர்கள் அவ்வாறே உள்ளனர்
  rationale: எழுத்தாளரின் காலம்வரை அந்த நிலை தொடர்ந்ததைச் சுட்டும் எபிரெய மரபுத்தொடரின் பொருளைத் தமிழில் முழுமையான வாக்கியமாகத் தருகிறது.
