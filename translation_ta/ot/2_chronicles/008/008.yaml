translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. நீண்ட எபிரெய தொடர்பாக்கம் கோடுகளால் தெளிவுபடுத்தப்பட்டது. ‘அடிமைகள்’ என்று மூலத்தில் இல்லாத சமூக நிலையைச் சேர்க்காமல், கட்டாய அரசுப் பணி என்ற நிர்வாகப் பொருள் காக்கப்பட்டது.
