base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
translation:
  language: ta
  text: சாலொமோன் பார்வோனின் மகளைத் தாவீதின் நகரத்திலிருந்து அவளுக்காகத் தான் கட்டியிருந்த வீட்டுக்கு மேலே அழைத்துச் சென்றான். ஏனெனில் அவன், “இஸ்ரவேலின் அரசனாகிய தாவீதின் வீட்டில் என் மனைவி குடியிருக்கக் கூடாது; ஏனெனில் யாவேயின் உடன்படிக்கைப் பெட்டி வந்த இடங்கள் பரிசுத்தமானவை[a]” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயில் சொல்லுக்குச் சொல்: “யாவேயின் பெட்டி எவற்றிடம் வந்ததோ, அவை பரிசுத்தமானவை.” மறைந்துள்ள பன்மைச் சுட்டுப்பொருள் மொழிபெயர்ப்பில் “இடங்கள்” என்று வெளிப்படுத்தப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱלָה
  choice: அழைத்துச் சென்றான்
  rationale: இது עלה என்பதன் ஹிஃபில் வடிவம்; ‘மேலே கொண்டுசென்றான்’ என்ற திசை நுணுக்கம் உள்ளபோதிலும், தமிழில் இயல்பான இடமாற்றச் சொல்லாக ‘அழைத்துச் சென்றான்’ பயன்படுத்தப்பட்டது.
- source_word: מֵעִיר דָּוִיד
  choice: தாவீதின் நகரத்திலிருந்து
  rationale: புவியியல் பெயரை நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  choice: அவளுக்காகத் தான் கட்டியிருந்த வீட்டுக்கு
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருளான ‘வீடு’ தக்கவைக்கப்பட்டது; கட்டுதல் இடமாற்றத்துக்கு முன்பே நடந்ததை ‘கட்டியிருந்த’ காட்டுகிறது.
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  choice: என் மனைவி குடியிருக்கக் கூடாது
  rationale: சூழலில் אִשָּׁה என்பது ‘பெண்’ என்பதைவிட ‘மனைவி’ என்று பொருள்படுகிறது; ישׁב இங்கு வசித்தல் அல்லது குடியிருத்தலைக் குறிக்கிறது.
- source_word: בְּבֵית דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனாகிய தாவீதின் வீட்டில்
  rationale: ‘வீடு’ என்ற சொல் எபிரெயச் சொல்லோடு நெருக்கமாக உள்ளது; ‘அரசனாகிய’ என்பது தமிழில் உறவைத் தெளிவாக்குகிறது.
- source_word: קֹדֶשׁ הֵמָּה
  choice: பரிசுத்தமானவை
  rationale: பன்மை எழுவாயோடு வரும் பரிசுத்தத் தன்மையைத் தக்கவைக்கிறது.
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  choice: யெகோவாவின் உடன்படிக்கைப் பெட்டி வந்த இடங்கள்
  rationale: הֵמָּה மற்றும் אֲלֵיהֶם ஆகிய பன்மை வடிவங்கள் சுட்டும் மறைமுகப் பன்மைப் பொருளை ‘இடங்கள்’ என்று வெளிப்படுத்துகிறது; אָרוֹן சூழலில் உடன்படிக்கைப் பெட்டியைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: சாலொமோனின் பரிசுத்தம் குறித்த காரணத்தில் மறைந்துள்ள பன்மைச் சுட்டுப்பொருள்
  choice: உடன்படிக்கைப் பெட்டி வந்த ‘இடங்கள்’ என்று பன்மைச் சுட்டுப்பொருளை வெளிப்படுத்துதல்
  alternative: தாவீதின் வீடு பொதுவாகப் பரிசுத்தமானது என்று ஒருமையாகப் புரிந்துகொள்ளுதல்; அல்லது எபிரெயின் ஒழுங்கற்ற தன்மையை அப்படியே விடுதல்
  rationale: எபிரெயில் ‘அவை பரிசுத்தமானவை; அவற்றிடம் பெட்டி வந்தது’ எனப் பன்மை உள்ளது. ‘இடங்கள்’ என்பது இலக்கணத்தை விளக்குகிறது; ஆனால் அது உரையில் மறைந்துள்ள சொல்லாக இருப்பதால் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: אִשָּׁה என்பதன் பொருள்
  choice: மனைவி
  alternative: பெண்
  rationale: பார்வோனின் மகளையும் சாலொமோனின் திருமண உறவையும் பற்றிய உடனடிச் சூழல் ‘மனைவி’ என்ற குறிப்பிட்ட பொருளை ஆதரிக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டது. ‘குடியிருக்க’ என்பது வசிப்பதைக் குறிக்கும் இயல்பான சொல்; ‘உடன்படிக்கைப் பெட்டி’ என்பது சூழலைத் தெளிவாக்குகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
