base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/004.yaml
  text: He built Tadmor in the wilderness[a], and all the storage cities that he built in Hamath.
translation:
  language: ta
  text: அவன் வனாந்தரத்தில் தத்மோரை[a] கட்டினான்; ஆமாத்தில் அவன் கட்டிய எல்லாச் சேமிப்புப் பட்டணங்களையும் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தத்மோர் என்பது மரபாக பல்மைராவுடன் அடையாளம் காணப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּבֶן
  choice: அவன் கட்டினான்
  rationale: בנה என்பதன் wayyiqtol வடிவம் தொடர்ச்சியான கடந்தகாலச் செயலைக் குறிக்கிறது. தமிழில் எளிய இறந்தகாலம் இயல்பாக உள்ளது; וַ־ என்பதன் தொடர்ச்சி நுணுக்கத்தை வாக்கிய ஓட்டமே வெளிப்படுத்துகிறது.
- source_word: תַּדְמֹר
  choice: தத்மோர்
  rationale: இது இடப்பெயர் என்பதால் மூல எபிரெய உச்சரிப்பை அணுகிய ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது; பிற்கால கிரேக்க/லத்தீன் பெயரான பல்மைரா அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்புகள் குறைந்த வறண்ட அல்லது பாழ்நிலப் பகுதியைக் குறிக்கலாம். ‘வனாந்தரம்’ மணற்பாலை என்று மட்டும் பொருள்படாமல் இப்புவியியல் பொருளைத் தக்கவைக்கிறது.
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  choice: எல்லாச் சேமிப்புப் பட்டணங்களையும்
  rationale: இந்த இணைப்புச் சொற்றொடர் பொருட்களையோ வழங்கல்களையோ சேமிக்கப் பயன்படுத்தப்பட்ட பட்டணங்களைக் குறிக்கிறது. ‘சேமிப்புப் பட்டணங்கள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: אֲשֶׁר בָּנָה
  choice: அவன் கட்டிய
  rationale: சேமிப்புப் பட்டணங்களைக் குறிக்கும் சார்பு வாக்கியத்தைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: בַּחֲמָת
  choice: ஆமாத்தில்
  rationale: חֲמָת என்பது இடப்பெயர்; בְּ־ இங்கு ‘-இல்’ என்று வழங்கப்படுகிறது. இந்த வடிவம் நகரத்தையா அதன் ஆட்சிப் பகுதியையா குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுகிறது.
