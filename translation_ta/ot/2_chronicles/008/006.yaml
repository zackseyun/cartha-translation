  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
translation:
  language: ta
  text: பாலாத்தையும், சாலொமோனுக்குச் சொந்தமான எல்லாக் களஞ்சியப் பட்டணங்களையும்[a], தேர்களுக்கான எல்லாப் பட்டணங்களையும், குதிரைவீரர்களுக்கான பட்டணங்களையும்[b], எருசலேமிலும் லெபனோனிலும் தன் ஆட்சிக்குட்பட்ட நாடெங்கிலும் சாலொமோன் கட்ட விரும்பிய அனைத்தையும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சேமிப்புப் பட்டணங்கள்,’ ‘பொருள் வழங்கல் பட்டணங்கள்’ அல்லது ‘பொக்கிஷப் பட்டணங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘குதிரைகளுக்கான பட்டணங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எனினும், இங்குள்ள எபிரெயச் சொல் பொதுவாகக் குதிரைவீரர்களையே குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், ‘சாலொமோனின் எல்லா விருப்பமும்—அவன் கட்ட விரும்பியது’ என்று, ‘விருப்பம்’ என்பதற்குரிய ஒரே வேரிலிருந்து வந்த பெயர்ச்சொல்லும் வினைச்சொல்லும் இணைந்து அவனுடைய விருப்பத்தை வலியுறுத்துகின்றன.
    reason: lexical_alternative
