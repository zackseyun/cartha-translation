translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூல வசனம் முந்தைய வாக்கியத்தின் தொடர்ச்சியாக இணைப்புச் சொற்களால் வருவதால், தனி நிறைவுற்ற வினைச்சொல் சேர்க்கப்படாமல் பொருட்களின் தொடராகவே அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னால் முறையான [a], [b], [c] வரிசையில் வைக்கப்பட்டுள்ளன.
