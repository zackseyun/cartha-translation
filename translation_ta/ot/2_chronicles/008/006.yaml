- source_word: בַּעֲלָת
  choice: பாலாத்
  rationale: இது ஓர் இடப்பெயர்; பொருளாக்காமல், நவீனத் தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: களஞ்சியப் பட்டணங்கள்
  rationale: உணவுப்பொருட்கள் அல்லது பிற பொருட்களைச் சேமித்து வைக்கும் பட்டணங்கள் என்ற நிர்வாகச் சூழலைத் தெளிவாகவும் இயல்பாகவும் உணர்த்துகிறது; ‘பொக்கிஷப் பட்டணங்கள்’ என்று தேவையற்ற விதத்தில் பொருளைக் குறுக்கவில்லை.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: சாலொமோனுக்குச் சொந்தமான
  rationale: எபிரெய மொழியின் உடைமைப் பொருளை இயல்பான தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: עָרֵי הָרֶכֶב
  choice: தேர்களுக்கான பட்டணங்கள்
  rationale: தேர்ப்படையுடனும் அதன் ஆதரவு வசதிகளுடனும் தொடர்புடைய பட்டணங்கள் என்ற பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: குதிரைவீரர்களுக்கான பட்டணங்கள்
  rationale: פָּרָשִׁים என்பது பொதுவாகக் குதிரைகளைக் காட்டிலும் குதிரைவீரர்களைக் குறிக்கிறது; தேர்களுக்கான பட்டணங்களிலிருந்து உள்ள சொற்பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: சாலொமோன் ... விரும்பிய அனைத்தையும்
  rationale: ‘விருப்பம்/விரும்புதல்’ என்ற ஒரே வேர்ச்சொல்லிலான எபிரெய வலியுறுத்தலைத் தமிழில் அளவுக்கு மீறிய செயற்கைத் திருப்பமின்றி பொருளோடு வழங்குகிறது.
- source_word: לִבְנוֹת
  choice: கட்ட
  rationale: மூலத்தில் பொதுவாக ‘கட்டுதல்’ என்றே உள்ளது; ‘மீண்டும் கட்டுதல்’ என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
- source_word: וּבַלְּבָנוֹן
  choice: லெபனோனிலும்
  rationale: நவீனத் தமிழில் அறியப்படும் நிலையான புவிப்பெயர் வடிவம்.
- source_word: בְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: தன் ஆட்சிக்குட்பட்ட நாடெங்கிலும்
  rationale: מֶמְשָׁלָה என்பதிலுள்ள ஆட்சி/அதிகாரம் என்ற கருத்தையும், அது விரிந்துள்ள முழு நிலப்பரப்பையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
