  yaml_path: translation/ot/2_chronicles/008/017.yaml
  text: Then Solomon went to Ezion-geber and to Eloth[a], on the shore of the sea in the land of Edom.
translation:
  language: ta
  text: பின்பு சாலொமோன் ஏதோம் நாட்டில் கடலின் கரையோரத்திலுள்ள எசியோன்-கேபேருக்கும் ஏலோத்துக்கும்[a] சென்றார்.
  philosophy: optimal-equivalence
