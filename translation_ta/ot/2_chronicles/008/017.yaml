    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: பின்பு
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத் தொடர் குறியீடு; இயல்பான தமிழ் கதைநடையைத் தருகிறது.
- source_word: הָלַךְ
  choice: சென்றார்
  rationale: இங்கு பொதுவாக ஓர் இடத்திற்குச் செல்வதைக் குறிக்கிறது; ‘நடந்தார்’ என்று மொழிபெயர்ப்பது தேவையற்ற குறிப்பைச் சேர்க்கும்.
- source_word: לְעֶצְיוֹן גֶּבֶר
  choice: எசியோன்-கேபேருக்கு
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பெயர்ப்பு; கூட்டுப் பெயரின் அமைப்பைக் காட்ட இடைக்கோடு வைக்கப்பட்டுள்ளது.
- source_word: וְאֶל אֵילוֹת
  choice: ஏலோத்துக்கும்
  rationale: இணைப்பையும் திசையைக் குறிக்கும் முன்னிடைச்சொல்லையும் தமிழில் இயல்பாக ‘-க்கும்’ என்ற வேற்றுமை வடிவில் தருகிறது; இடப்பெயர் எபிரெய வடிவுக்கு நெருக்கமாக ஒலிப்பெயர்க்கப்பட்டுள்ளது.
- source_word: עַל שְׂפַת הַיָּם
  choice: கடற்கரையிலிருந்த
  rationale: சொல்லடியாக ‘கடலின் ஓரத்தில்’ என்ற இடப்பொருளைக் கொண்டது; இரு நகரங்களின் இருப்பிடத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: ஏதோம் நாட்டில்
  rationale: மூலத்தில் உள்ள ‘நாடு/தேசம்’ என்ற சொல்லைப் பேணி, இடப்பெயரை வழக்கமான தமிழ் ஒலிப்பெயர்ப்பில் வழங்குகிறது.
