  yaml_path: translation/ot/2_chronicles/008/003.yaml
  text: Then Solomon went to Hamath-zobah and prevailed against it[a].
translation:
  language: ta
  text: பின்பு சாலொமோன் ஹமாத்-சோபாவுக்குச் சென்று, அதன்மேல் வெற்றி கொண்டான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்புகள்: “அதை அடக்கினான்” அல்லது “அதைத் தன் கட்டுப்பாட்டுக்குள் கொண்டுவந்தான்.” எபிரெய மொழித்தொடரின் நேர்ப்பொருள் “அதன்மேல் வலிமை பெற்றான்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்று
  rationale: הלך என்ற வினை இங்கு அடிப்படையாக ‘சென்றான்’ என்று பொருள்படும். போர் நடவடிக்கை சூழலில் ‘படையெடுத்துச் சென்றான்’ என விரிவாக்க இயன்றாலும், பகைமை அல்லது படையெடுப்பு என்ற கருத்தை இந்த வினை தனியாக வெளிப்படையாகக் குறிக்காததால் எளிய ‘சென்று’ பயன்படுத்தப்பட்டது.
- source_word: חֲמָת צוֹבָה
  choice: ஆமாத்-சோபா
  rationale: இரு பெயர்களும் இச்சூழலில் இணைந்த ஓர் இடப்பெயராகச் செயல்படுகின்றன. அவற்றின் எபிரெய வடிவத்தையும் தமிழில் வாசிக்கத்தக்க தன்மையையும் காக்க இணைப்புக்குறியுடன் எழுதப்பட்டது.
- source_word: וַיֶּחֱזַק עָלֶיהָ
  choice: அதன்மேல் வெற்றிகொண்டான்
  rationale: חזק על என்ற மொழித்தொடர் ஒருவரையோ ஓர் இடத்தையோ விட வலிமைபெற்று மேலோங்குதல், வெற்றிகொள்ளுதல் அல்லது கட்டுப்பாட்டுக்குள் கொண்டுவருதல் ஆகிய பொருள்களைத் தரலாம். ‘அதன்மேல் வெற்றிகொண்டான்’ என்பது மூலத்தின் உருவகத்தை ஓரளவு காத்தபடி, அரசியல்-இராணுவச் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கதைநடைத் தொடர்ச்சிக்காக ‘பின்பு’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் சுருக்கமும் வினைச்சொல்லிலுள்ள பொருள் நெகிழ்வும் அடிக்குறிப்பின் உதவியுடன் பாதுகாக்கப்பட்டுள்ளன.
