translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் உள்ள நடை. மூலத்தின் காரணவினை ‘குடியேற்றினார்’ எனவும், ஏற்கெனவே இருந்த நகரங்களுக்கான בנה என்பதன் சூழற்பொருள் ‘மீண்டும் கட்டி’ எனவும் தரப்பட்டுள்ளது; உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
