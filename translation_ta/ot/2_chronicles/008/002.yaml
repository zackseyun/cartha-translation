id: 2CH.8.2
reference: 2 Chronicles 8:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הֶ/עָרִ֗ים אֲשֶׁ֨ר נָתַ֤ן חוּרָם֙ לִ/שְׁלֹמֹ֔ה בָּנָ֥ה שְׁלֹמֹ֖ה אֹתָ֑/ם וַ/יּ֥וֹשֶׁב שָׁ֖ם אֶת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/002.yaml
  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
translation:
  language: ta
  text: ஹூராம்[a] சாலொமோனுக்குக் கொடுத்திருந்த நகரங்களைச் சாலொமோன் மீண்டும் கட்டி[b], இஸ்ரவேலின் மக்களை[c] அங்கே குடியேற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஹூராம்’; மரபுவழியாக ‘ஹீராம்’ என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘கட்டி.’ எபிரெய வினைச்சொல் ‘கட்டு’ என்று பொருள்படும்; இச்சூழலில் ‘மீண்டும் கட்டு’ அல்லது ‘சீரமைத்துக் கட்டு’ என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்கு சொல், ‘இஸ்ரவேலின் மகன்களை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  choice: நகரங்களை
  rationale: எபிரெய இணைப்புச்சொல் இங்கு முந்தைய நிகழ்வைத் தொடர்ந்து நகரங்களை முன்னிலைப்படுத்துகிறது; தமிழில் இயல்பான வாக்கிய அமைப்புக்காக தனியான ‘அந்த நகரங்களைப் பொறுத்தவரை’ என்பதின்றி நேரடிப் பொருளாக வழங்கப்பட்டது.
- source_word: נָתַן
  choice: கொடுத்திருந்த
  rationale: நகரங்களைக் கொடுத்த செயல், சாலொமோன் அவற்றைக் கட்டியதற்கு முந்தியது என்பதைத் தமிழின் இறந்தகால நிறைவுவினை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חוּרָם
  choice: ஹூராம்
  rationale: மூல எபிரெயப் பெயரான חוּרָם என்பதன் ஒலிப்பெயர்ப்பு பாதுகாக்கப்படுகிறது.
- source_word: בָּנָה
  choice: மீண்டும் கட்டி
  rationale: அடிப்படைப் பொருள் ‘கட்டு’; ஏற்கெனவே இருந்தும் ஒப்படைக்கப்பட்ட நகரங்கள் என்ற சூழலில் ‘மீண்டும் கட்டு/சீரமைத்துக் கட்டு’ என்ற பொருள் இயல்பானது. அடிப்படைப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: וַיּוֹשֶׁב
  choice: குடியேற்றினார்
  rationale: ישׁב வேரின் ஹிஃபீல் வடிவம் பிறரை வசிக்கச் செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டது; ‘குடியேற்றினார்’ அதைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களை
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’; இச்சூழலில் இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிப்பதால், பாலின வரம்பைத் தவிர்க்கும் இயல்பான தமிழ் பயன்படுத்தப்பட்டது.
