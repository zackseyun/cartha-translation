base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/005.yaml
  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
translation:
  language: ta
  text: அவன் மேல் பெத்-ஓரோனையும் கீழ் பெத்-ஓரோனையும் மதில்களும் கதவுகளும்[a] தாழ்ப்பாள்களும்[b] கொண்ட அரண் நகரங்களாகக் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவை அரண் நகரங்களின் வாயிற்கதவுகளைக் குறிக்கலாம். எபிரெயத்தில் நேரடியாக ‘கதவுகள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘குறுக்குச் சட்டங்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டி ... அமைத்தான்
  rationale: בנה என்பதன் அடிப்படைப் பொருள் ‘கட்டினான்’. வசனத்தின் பிற்பகுதியில் நகரங்களின் அரண் அமைப்பு விவரிக்கப்படுவதால், இயல்பான தமிழில் ‘கட்டி ... அமைத்தான்’ என்று வழங்கப்பட்டது; ‘மீண்டும் கட்டினான்’ என்ற பொருள் வினையிலேயே கட்டாயமாக இல்லை.
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן
  choice: மேல் பெத்-ஓரோன்
  rationale: இது உயரத்தின் அடிப்படையில் வேறுபடுத்தப்படும் இடப்பெயர். பெயர் ஒலிபெயர்க்கப்பட்டு, הָעֶלְיוֹן இயல்பான தமிழில் ‘மேல்’ என வழங்கப்பட்டது.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: கீழ் பெத்-ஓரோன்
  rationale: இணையான மற்ற இடப்பெயரிலிருந்து வேறுபடுத்த, הַתַּחְתּוֹן ‘கீழ்’ என வழங்கப்பட்டது.
- source_word: עָרֵי מָצוֹר
  choice: அரண் நகரங்கள்
  rationale: இக்கட்டமைப்புச் சொற்றொடர் பாதுகாப்பு ஏற்பாடுகளால் வலுப்படுத்தப்பட்ட நகரங்களைக் குறிக்கிறது. ‘அரண் நகரங்கள்’ சுருக்கமான, இயல்பான தமிழ்.
- source_word: חוֹמוֹת
  choice: மதில்கள்
  rationale: நகரங்களைச் சுற்றிய பாதுகாப்புச் சுவர்களைக் குறிக்க, சூழலுக்கேற்ற ‘மதில்கள்’ பயன்படுத்தப்பட்டது.
- source_word: דְּלָתַיִם
  choice: கதவுகள்
  rationale: எபிரெயச் சொல் பொதுவாக ‘கதவுகள்’ அல்லது ‘இரட்டைக் கதவுகள்’ எனப் பொருள்படும்; நகரவாயில்களிலுள்ள கதவுகள் இங்கு குறிக்கப்படலாம். வழக்கமான ‘நகரவாயில்’ என்ற எபிரெயச் சொல் அல்லாததால் ‘வாயில்கள்’ என மாற்றப்படவில்லை.
- source_word: וּבְרִיחַ
  choice: தாழ்ப்பாள்கள்
  rationale: கதவு அல்லது வாயிற்கதவை உறுதியாகப் பூட்டும் bar/bolt-ஐ குறிக்கிறது. நவீன தமிழில் ‘தாழ்ப்பாள்கள்’ தெளிவாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
