translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன. எபிரெய வசனத்தின் appositional அமைப்பு தமிழில் தெளிவாக இருக்க ‘அவற்றை ... கொண்ட அரண் நகரங்களாக அமைத்தான்’ என இயல்பாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
