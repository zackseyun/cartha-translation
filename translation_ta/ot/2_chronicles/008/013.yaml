  naturalness: நடை பொதுவாக நவீன நிலையான தமிழுக்கு ஏற்றது. ஆனால் தொடக்க வினையெச்சமும் இறுதி வினைமுற்றும் ஒரே ‘பலிகளைச் செலுத்துதல்’ செயலை இரட்டிப்பாக்குவதால் வாக்கியம் சற்றே கனமாகிறது. திருத்தப்பட்ட வடிவம் பொருளையும் வாக்கிய ஓட்டத்தையும் மேம்படுத்துகிறது.
  terminology: ‘ஓய்வுநாட்கள்,’ ‘அமாவாசைகள்,’ ‘நியமிக்கப்பட்ட பண்டிகைகள்,’ ‘புளிப்பில்லாத அப்பப் பண்டிகை,’ ‘வாரங்களின் பண்டிகை,’ ‘கூடாரப் பண்டிகை’ ஆகிய சொற்கள் மூலச்சொற்களுக்கும் நவீனத் தமிழ் வேதாகம நடைக்கும் ஏற்றவை. ‘பெந்தெகொஸ்தே’ மற்றும் ‘குடில்கள்/தற்காலிகக் கூடாரங்கள்’ பற்றிய அடிக்குறிப்புகள் பொருத்தமானவை.
