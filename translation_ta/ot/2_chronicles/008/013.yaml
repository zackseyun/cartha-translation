base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
translation:
  language: ta
  text: ஒவ்வொரு நாளுக்கும் உரிய பலிகளை அந்தந்த நாளில் செலுத்தும்படி மோசே கட்டளையிட்டபடி, ஓய்வுநாட்களிலும், அமாவாசைகளிலும், ஆண்டில் மூன்று முறை வரும் நியமிக்கப்பட்ட பண்டிகைகளிலும்—அதாவது, புளிப்பில்லாத அப்பப் பண்டிகையிலும், வாரங்களின் பண்டிகையிலும்[b], கூடாரப் பண்டிகையிலும்[c]—அவன் செலுத்தினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “ஒரு நாளின் காரியத்தை அதன் நாளில்.” இது ஒவ்வொரு நாளுக்கும் நியமிக்கப்பட்ட பலிகளைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: “வாரங்களின் பண்டிகை” பின்னாளைய கிரேக்க வழக்கில் “பெந்தெகொஸ்தே” என்று அழைக்கப்பட்டது.
    reason: cross_reference
  - marker: c
    text: எபிரேயச் சொல்லின் பொருள் “குடில்கள்” அல்லது “தற்காலிகக் கூடாரங்கள்”; இதை “குடில்களின் பண்டிகை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  choice: ஒவ்வொரு நாளுக்கும் உரிய ... அந்தந்த நாளில்
  rationale: ‘ஒரு நாளின் காரியம் அதன் நாளில்’ என்ற எபிரேய மரபுத்தொடரின் நாள்தோறும் நிறைவேற்ற வேண்டிய நியமத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அதன் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לְהַעֲלוֹת
  choice: பலிகளைச் செலுத்தி / பலிகளைச் செலுத்தினான்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் இப்பலிச் சூழலில் பலியை மேலே எழும்பச் செய்தல், அதாவது பலியிடுதல் என்பதைக் குறிக்கிறது. தமிழில் ‘பலிகளைச் செலுத்துதல்’ வழிபாட்டுச் செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: כְּמִצְוַת מֹשֶׁה
  choice: மோசே கட்டளையிட்டபடி
  rationale: மோசேயின் கட்டளைக்கு ஏற்ப என்பதைக் கண்ணியமான, இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: לַשַּׁבָּתוֹת
  choice: ஓய்வுநாட்களிலும்
  rationale: சப்பாத்துகளை வாசகருக்கு உடனடியாகப் புரியும் பொருள்வழித் தமிழில் தருகிறது; பன்மையையும் வழிபாட்டு நிகழ்வுக்கான காலத்தையும் காக்கிறது.
- source_word: וְלֶחֳדָשִׁים
  choice: அமாவாசைகளிலும்
  rationale: வழிபாட்டுக் கால அட்டவணையில் חֹדֶשׁ என்பது பொதுவாக மாதத்தை அல்ல, புதிய நிலா நாளைக் குறிக்கிறது. நவீனத் தமிழில் ‘அமாவாசை’ இதற்கான இயல்பான பெயர்.
- source_word: וְלַמּוֹעֲדוֹת
  choice: நியமிக்கப்பட்ட பண்டிகைகளிலும்
  rationale: מוֹעֵד என்பதிலுள்ள நியமிக்கப்பட்ட காலம் என்ற கருத்தையும், பின்னர் பட்டியலிடப்படும் விழாக்களின் பண்டிகைத் தன்மையையும் இணைத்துக் காக்கிறது.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: ஆண்டில் மூன்று முறை வரும்
  rationale: வருடாந்தம் மூன்று நிகழ்வுகள் என்ற நேரடியான காலக் குறிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: בְּחַג הַמַּצּוֹת
  choice: புளிப்பில்லாத அப்பப் பண்டிகை
  rationale: מַצּוֹת என்பதன் புளிப்பூட்டப்படாத அப்பங்கள் என்ற நேரடிப் பொருளைத் தெளிவாக வைத்திருக்கிறது.
- source_word: וּבְחַג הַשָּׁבֻעוֹת
  choice: வாரங்களின் பண்டிகை
  rationale: எபிரேயப் பெயரான ‘வாரங்கள்’ என்பதையே முதன்மை உரையில் காக்கிறது; பின்னாளைய கிரேக்கப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּבְחַג הַסֻּכּוֹת
  choice: கூடாரப் பண்டிகை
  rationale: סֻכּוֹת என்பதன் தற்காலிகக் குடில்கள்/கூடாரங்கள் என்ற உருவகத்தைத் தமிழில் சுருக்கமாகவும் பரிச்சயமாகவும் தருகிறது.
theological_decisions:
- issue: இஸ்ரவேலின் மூன்று பண்டிகைகளின் பெயர்களை மூல எபிரேயப் பெயர்களுக்கு நெருக்கமாக வழங்குதல்
  choice: புளிப்பில்லாத அப்பப் பண்டிகை / வாரங்களின் பண்டிகை / கூடாரப் பண்டிகை
  alternative: பஸ்கா காலம் / பெந்தெகொஸ்தே / கூடாரத் திருவிழா
  rationale: எபிரேய உரை பண்டிகைகளை அவற்றின் நேரடிப் பெயர்களால் குறிப்பிடுகிறது. பின்னாளைய கிரேக்க அல்லது திருச்சபை வழக்குப் பெயர்களை முதன்மை உரைக்குள் கொண்டு வராமல், தேவையானதை அடிக்குறிப்பில் தருவது மூலமொழி முன்னுரிமையையும் வாசிப்புத் தெளிவையும் காக்கிறது.
- issue: முந்தைய வசனத்திலிருந்து தொடரும் எபிரேய வாக்கியத்தை தமிழில் முழுமையாக்குதல்
  choice: ‘அவன் பலிகளைச் செலுத்தினான்’ என்பதை இறுதியில் வெளிப்படையாகச் சேர்த்தல்
  alternative: வினைமுற்றில்லாத தொடராக, ‘...செலுத்துவதற்காக’ என்று மட்டும் விடுதல்
  rationale: எபிரேயத்தில் இவ்வசனம் 12ஆம் வசனத்தின் செயலைத் தொடர்ந்து விளக்குகிறது. தனி வசனமாகவும் இயல்பாகப் புரிய தமிழுக்கு வேண்டிய எழுவாய்-வினைமுற்று சேர்க்கப்பட்டுள்ளது; புதிய இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. வசனம் முந்தைய வசனத்தின் தொடராக இருப்பதால் தமிழில் தேவையான வினைமுற்று சேர்க்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே முதன்மை உரையில் இடப்பட்டுள்ளன.
