base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
translation:
  language: ta
  text: ஊராம் தன் பணியாளர்கள் மூலமாக[a] கப்பல்களையும், கடல் பயணத்தில் அனுபவமுள்ள பணியாளர்களையும்[b] சாலொமோனுக்கு அனுப்பினான். அவர்கள் சாலொமோனின் பணியாளர்களுடன் ஓபீருக்குச் சென்று, அங்கிருந்து நானூற்று ஐம்பது தாலந்து எடையுள்ள தங்கத்தை[c] எடுத்துச் சாலொமோன் அரசனிடம் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘தன் பணியாளர்களின் கையால்’; அதாவது, ‘தன் பணியாளர்கள் மூலமாக.’
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘கடலை அறிந்த பணியாளர்கள்.’ இதை ‘கடல் பயணத்தில் தேர்ச்சியுள்ள பணியாளர்கள்’ அல்லது ‘மாலுமிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘தாலந்து’ என்பது பண்டைய எடை அலகு; அதன் துல்லியமான எடை காலத்திற்கும் இடத்திற்கும் ஏற்ப மாறியிருக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: எபிரெயக் கதைநடையில் שלח என்பதற்கான இயல்பான, நேரடியான தமிழ் வினைச்சொல்.
- source_word: חוּרָם
  choice: ஊராம்
  rationale: இவ்வசனத்திலுள்ள חוּרָם என்ற எபிரெயப் பெயரின் ஒலியைத் தமிழில் நெருக்கமாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: בְּיַד עֲבָדָיו
  choice: தன் பணியாளர்கள் மூலமாக
  rationale: சொல்லுக்குச் சொல் ‘தன் பணியாளர்களின் கையால்’; இங்கு நபர்கள் வழியான செயற்பாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: אוניות
  choice: கப்பல்கள்
  rationale: ஓபீருக்குச் செல்லும் கடற்பயணச் சூழலுக்கு ஏற்ற பொதுவான சொல்.
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  choice: கடல் பயணத்தில் அனுபவமுள்ள பணியாளர்கள்
  rationale: ‘கடலை அறிந்த பணியாளர்கள்’ என்ற மூலத்தின் இரு கூறுகளையும் காத்து, நவீன தமிழில் அதன் கடற்பயணத் திறமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אוֹפִירָה
  choice: ஓபீருக்கு
  rationale: இறுதியில் உள்ள திசைச்சுட்டும் ־ָה, ஓபீரை நோக்கிய இயக்கத்தைக் குறிக்கிறது.
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: அங்கிருந்து … எடுத்துச்
  rationale: לקח என்பதன் நேரடியான பொருளைக் காக்கிறது; தங்கம் எவ்வாறு பெறப்பட்டது என்பதை மேலதிகமாக ஊகிக்கவில்லை.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  choice: நானூற்று ஐம்பது தாலந்து தங்கம்
  rationale: வரலாற்றுச் சிறப்புடைய பண்டைய எடை அலகை நவீன அலகாக ஊகித்து மாற்றாமல் வைத்திருக்கிறது.
- source_word: וַיָּבִיאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசனிடம் கொண்டுவந்தார்கள்
  rationale: ‘அரசன் சாலொமோனிடம் கொண்டுவந்தார்கள்’ என்ற மூலச் சொற்றொடரின் இலக்கையும் செயற்பாட்டையும் இயல்பான தமிழில் தருகிறது.
