translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பணியாளர்கள்’ என்பது עֲבָדִים என்பதிலுள்ள கீழ்ப்பட்ட சேவைநிலையைத் தெரிவிக்கிறது; ‘மாலுமிகள்’ என்று மட்டும் சுருக்கப்படவில்லை. ‘கடலை அறிந்தவர்கள்’ என்ற சொற்படி வடிவம் தமிழில் தெளிவில்லாமல் இருக்கக்கூடும் என்பதால், சூழலுக்கேற்ற ‘கடல் பயணத்தில் அனுபவமுள்ள’ என முதன்மை உரையில் தரப்பட்டு, சொற்படி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
