  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
translation:
  language: ta
  text: தன் தந்தையான தாவீதின் ஒழுங்குமுறைப்படி, ஆசாரியர்களை அவர்களுடைய பணிக்குரிய பிரிவுகளில் அவன் நியமித்தான்; லேவியர்களை அவர்களுடைய பொறுப்புகளுக்காக, ஆசாரியர்களின் முன்னிலையில் துதித்துப் பணிவிடை செய்யவும், ஒவ்வொரு நாளுக்கும் உரிய பணியைச் செய்யவும் நியமித்தான்; வாயிற்காவலர்களை ஒவ்வொரு வாசலுக்குமான அவர்களுடைய பிரிவுகளில் நியமித்தான். ஏனெனில் தேவனுடைய மனிதரான தாவீதின் கட்டளை அப்படியே இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒவ்வொரு நாளுக்கும் உரிய பணி” என்பது சொல்லுக்கு சொல் மொழிபெயர்த்தால், “ஒரு நாளின் காரியத்தை அதனதன் நாளில்” என வரும்; ஒவ்வொரு நாளுக்கும் நிர்ணயிக்கப்பட்ட தேவையை இது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: அவன் நியமித்தான்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் இங்கு ஆலயப் பணியாளர்களை உரிய பணிநிலைகளில் அமர்த்துவதைக் குறிக்கிறது; எனவே உடல்நிலையைக் குறிக்கும் ‘நிறுத்தினான்’ என்பதைக் காட்டிலும் ‘நியமித்தான்’ நிர்வாகச் சூழலுக்கு இயல்பானது.
- source_word: כְּמִשְׁפַּט
  choice: வகுத்த ஒழுங்குமுறைப்படி
  rationale: מִשְׁפָּט இங்கு தீர்ப்பை அல்ல, முன்பே நிர்ணயிக்கப்பட்ட ஆலயப் பணி ஒழுங்கைச் சுட்டுகிறது. ‘ஒழுங்குமுறை’ நவீன தமிழில் தெளிவாகவும் அதிகாரபூர்வமாகவும் உள்ளது.
- source_word: דָּוִיד אָבִיו
  choice: தன் தந்தை தாவீது
  rationale: இந்தச் சூழலில் தாவீது சாலொமோனின் நேரடியான தந்தை; ஆகவே எபிரெயச் சொல்லின் இயல்பான பொருளையே தமிழில் நேராகத் தருகிறது.
- source_word: מַחְלְקוֹת
  choice: பிரிவுகள்
  rationale: ஆசாரியர், வாயிற்காவலர் ஆகியோரின் ஒழுங்கமைக்கப்பட்ட பணிக்குழுக்களைக் குறிக்கும் தெளிவான நவீனத் தமிழ் சொல்.
- source_word: עַל עֲבֹדָתָם
  choice: அவர்களுடைய பணிக்கான
  rationale: ஆசாரியர்களுக்குக் கொடுக்கப்பட்ட ஆலயச் சேவைத் துறையைத் தெரிவிக்கிறது; ‘பணி’ பொதுவாசகருக்கு தெளிவானது.
- source_word: מִשְׁמְרוֹתָם
  choice: அவர்களுடைய பொறுப்புகள்
  rationale: இச்சொல் காவல் முறை, ஒப்படைக்கப்பட்ட கடமை அல்லது பொறுப்பு எனப் பொருள்படலாம். லேவியர்களின் கடமைகள் அடுத்து விளக்கப்படுவதால் ‘பொறுப்புகள்’ பொருத்தமானது.
- source_word: לְהַלֵּל וּלְשָׁרֵת
  choice: துதிக்கவும் பணிவிடை செய்யவும்
  rationale: הלל என்பதன் துதித்தல் பொருளையும், שרת என்பதன் பரிசுத்த இடச் சேவை நுணுக்கத்தையும் இயல்பான தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: נֶגֶד הַכֹּהֲנִים
  choice: ஆசாரியர்களுக்கு முன்பாக
  rationale: נֶגֶד என்பதன் இடம் அல்லது உறவுநிலையைக் குறிக்கும் ‘முன்பாக/முன்னிலையில்’ என்ற திறந்த பொருளைத் தக்கவைக்கிறது; ‘அவர்களுடன்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: ஒவ்வொரு நாளுக்கும் உரிய பணியைச் செய்து
  rationale: ஒவ்வொரு நாளுக்கும் நிர்ணயிக்கப்பட்ட தேவையை அல்லது காரியத்தைச் செய்யுதல் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הַשּׁוֹעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: ஆலய வாசல்களைக் கவனிக்கும் பணியாளர்களைத் துல்லியமாகக் குறிக்கும் புரிந்துகொள்ளத்தக்க தமிழ் இணைச்சொல்.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: ஒவ்வொரு வாசலுக்குமான
  rationale: எபிரெய மொழியின் பகிர்ந்தளிக்கும் அமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִצְוַת
  choice: கட்டளையிட்டிருந்தார்
  rationale: மூலத்தில் பெயர்ச்சொல்லாக உள்ள அதிகாரபூர்வக் ‘கட்டளை’ தமிழில் இயல்பான வாக்கிய ஓட்டத்திற்காக வினையாக வழங்கப்பட்டுள்ளது; அதன் அதிகாரத் தன்மை தக்கவைக்கப்படுகிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர்
  rationale: தீர்க்கதரிசி அல்லது தேவனால் அதிகாரமளிக்கப்பட்டவர் என்பதைக் குறிக்கும் வேதாகமப் பட்டத்தை விளக்கிச் சுருக்காமல் நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘தேவனுடைய மனிதர்’ என்ற தாவீதின் பட்டம்
  choice: பட்டத்தை நேரடியாக ‘தேவனுடைய மனிதர்’ என்று தக்கவைத்தல்
  alternative: ‘தேவபக்தர்’ அல்லது ‘தேவனின் ஊழியர்’ என்று விளக்குதல்
  rationale: אִישׁ הָאֱלֹהִים என்ற மூலப் பட்டம் பக்தி அல்லது பதவியை மட்டும் குறிக்கிறதா என்பதை மொழிபெயர்ப்பில் தீர்மானிக்காமல் அதன் விரிவான வேதாகமப் பொருளைத் திறந்தவாறு வைக்கிறது.
- issue: ஆசாரியர்களுடன் லேவியர்களின் உறவுநிலை
  choice: ‘ஆசாரியர்களுக்கு முன்பாக’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஆசாரியர்களோடு சேர்ந்து’ அல்லது ‘ஆசாரியர்களுக்குக் கீழ்’
  rationale: נֶגֶד இடம், முன்னிலை அல்லது தொடர்பைச் சுட்டலாம். மூலத்தில் வெளிப்படையாக இல்லாத சமநிலை அல்லது கீழ்ப்படிதல் அமைப்பைச் சேர்க்காமல் ambiguity-ஐத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், ஆலய நிர்வாகச் சூழலுக்கேற்ற கண்ணியமான நடையும் பொதுவாசகருக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியத்தின் இணை அமைப்பு தமிழிலும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளது; பழமையான அல்லது குறிப்பிட்ட திருச்சபை மரபுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
