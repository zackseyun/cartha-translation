  yaml_path: translation/ot/2_chronicles/008/015.yaml
  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
translation:
  language: ta
  text: ஆசாரியர்களையும் லேவியர்களையும் குறித்த அரசனின் கட்டளையைவிட்டு அவர்கள் எந்தக் காரியத்திலும் கருவூலங்களைக்[a] குறித்தும் விலகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கருவூலங்கள்” என்பதற்கான எபிரெயச் சொல் אֹצָרוֹת, பொருட்களைச் சேமிக்கும் “களஞ்சியங்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרוּ
  choice: விலகவில்லை
  rationale: סור என்பதன் அடிப்படைப் பொருள் ‘விலகு/வழுவு’ என்பதாகும். கட்டளைக்குக் கீழ்ப்படிதலைக் குறிக்கும் இந்தச் சூழலில், ‘கட்டளையைவிட்டு விலகவில்லை’ என்பது எபிரெய மொழிநடையையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: அரசனுடைய கட்டளை
  rationale: מִצְוָה என்பது ‘கட்டளை’ அல்லது ‘கட்டளைச்சட்டம்’ எனப் பொருள்படும்; இங்குள்ள நிர்வாகச் சூழலில் ஒருமையான ‘கட்டளை’ இயல்பாக உள்ளது.
- source_word: עַל
  choice: குறித்த
  rationale: இங்கு עַל அதிகாரத்தைக் குறிக்காமல், கட்டளையின் பொருள் அல்லது தொடர்புடைய துறையை அறிமுகப்படுத்துகிறது; ஆகவே ‘குறித்த’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ஆசாரியர்களையும் லேவியர்களையும்
  rationale: எபிரெயத்தில் இரு குழுக்களும் தனித்தனியாகச் சுட்டப்படுகின்றன. நாளாகமத்தில் முக்கியமான இந்த வேறுபாடு தமிழிலும் தெளிவாக வைக்கப்பட்டுள்ளது.
- source_word: לְכָל דָּבָר
  choice: எந்தக் காரியத்திலும்
  rationale: எதிர்மறை வாக்கியத்தில் இச்சொற்றொடர் ‘எந்த விஷயத்திலும்/காரியத்திலும்’ என்ற இயல்பான பொருளைத் தருகிறது.
- source_word: וְלָאֹצָרוֹת
  choice: கருவூலங்களைக் குறித்தும்
  rationale: אֹצָרוֹת என்பது செல்வம் வைக்கப்படும் கருவூலங்களையோ பொருட்கள் வைக்கப்படும் களஞ்சியங்களையோ குறிக்கலாம். ஆலய நிர்வாகச் சூழலில் ‘கருவூலங்கள்’ முதன்மைத் தேர்வாக எடுக்கப்பட்டது; எபிரெய இணைப்புச் சொல்லின் ‘மேலும்/குறித்தும்’ என்ற தொடர்பும் காக்கப்பட்டது.
