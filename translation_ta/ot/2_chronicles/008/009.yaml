  edition: WLC
  text: וּ/מִן בְּנֵי֙ יִשְׂרָאֵ֔ל אֲ֠שֶׁר לֹא נָתַ֧ן שְׁלֹמֹ֛ה לַ/עֲבָדִ֖ים לִ/מְלַאכְתּ֑/וֹ כִּי הֵ֜מָּה אַנְשֵׁ֤י מִלְחָמָה֙ וְ/שָׂרֵ֣י שָׁלִישָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make servants for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
translation:
  language: ta
  text: ஆனால் இஸ்ரவேல் மக்களில் எவரையும் சாலொமோன் தன் வேலைக்காக அடிமைகளாக்கவில்லை[a]; ஏனெனில் அவர்கள் போர்வீரர்களாகவும், அவனுடைய படைத்துறை அதிகாரிகளாகவும்[b], அவனுடைய தேர்ப்படைத் தலைவர்களாகவும் குதிரைப்படை வீரர்களாகவும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் பணிக்காக அடிமை உழைப்பில் அமர்த்தவில்லை.” எபிரெயச் சொற்றொடர் அவர்களை அடிமை நிலையிலோ அடிமை உழைப்பிலோ வைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கே பயன்படுத்தப்பட்ட எபிரெயச் சொல் உயர்நிலைப் படைத்துறை அதிகாரிகள் அல்லது படைத்துறை உதவியாளர்களைக் குறிக்கலாம்; அதன் துல்லியமான பதவி உறுதியாகத் தெரியவில்லை.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וּמִן בְּנֵי יִשְׂרָאֵל
  choice: ஆனால் இஸ்ரவேல் மக்களில் எவரையும்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கட்டாய உழைப்பாளர்களுடன் உள்ள வேறுபாட்டை ‘ஆனால்’ காட்டுகிறது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற சொல்லுக்குச் சொல் வடிவத்தைவிட, அதே இன-தேசிய பொருளை இயல்பான நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ தெரிவிக்கிறது; எதிர்மறை வாக்கிய அமைப்புக்காக ‘எவரையும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לֹא נָתַן שְׁלֹמֹה לַעֲבָדִים לִמְלַאכְתּוֹ
  choice: சாலொமோன் தன் வேலைக்காக அடிமைகளாக்கவில்லை
  rationale: ‘அடிமைகளாகக் கொடுக்கவில்லை’ என்னும் எபிரெயக் கட்டமைப்பு, ஒருவரை அடிமை நிலையிலோ அடிமை உழைப்பிலோ அமர்த்துவதைக் குறிக்கிறது. ‘அடிமைகளாக்கவில்லை’ அதன் வலிமையை மென்மைப்படுத்தாமல் இயல்பான தமிழில் தருகிறது.
- source_word: כִּי הֵמָּה אַנְשֵׁי מִלְחָמָה
  choice: ஏனெனில் அவர்கள் போர்வீரர்களாகவும்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது; ‘போர்வீரர்கள்’ என்பது எபிரெய ‘போர் மனிதர்கள்’ என்ற மரபுத்தொடரின் தெளிவான, இயல்பான தமிழ் வடிவம்.
- source_word: שָׂרֵי שָׁלִישָׁיו
  choice: அவனுடைய படைத்துறை அதிகாரிகளாகவும்
  rationale: שָׁלִישׁ என்பது துல்லியமான பதவி உறுதியாகத் தெரியாத இராணுவ-நிர்வாகச் சொல். ‘படைத்துறை அதிகாரிகள்’ சூழலைத் தெளிவாக்குவதோடு, ‘தளபதிகள்’ போன்ற அளவுக்கு மீறிய துல்லியத்தைத் தவிர்க்கிறது.
- source_word: שָׂרֵי רִכְבּוֹ
  choice: அவனுடைய தேர்ப்படைத் தலைவர்களாகவும்
  rationale: தேர்களுக்குப் பொறுப்பான தலைமை அதிகாரிகளை இச்சொற்றொடர் குறிக்கிறது. ‘தேர்ப்படைத் தலைவர்கள்’ நவீன வாசகருக்கு இராணுவப் பிரிவையும் தலைமைப் பொறுப்பையும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וּפָרָשָׁיו
  choice: குதிரைப்படை வீரர்களாகவும்
  rationale: பָרָשִׁים என்பது குதிரைமேல் போரிடுவோர் அல்லது குதிரைப்படையினரைக் குறிக்கிறது; ‘குதிரைப்படை வீரர்கள்’ தெளிவான நவீன தமிழ்.
theological_decisions: []
translation_notes:
  register: நவீன, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் மாறுபாட்டு உறவும் காரணத் தொடர்பும் காக்கப்பட்டுள்ளன. அடிமை உழைப்பின் வலிமை மென்மைப்படுத்தப்படவில்லை; தெளிவற்ற இராணுவப் பதவிக்கு பொய்யான துல்லியம் தரப்படவில்லை.
