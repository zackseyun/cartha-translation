base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/016.yaml
  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
translation:
  language: ta
  text: இவ்வாறு, யாவேயின் ஆலயத்திற்கு அடித்தளம் இடப்பட்ட நாள் முதல் அது நிறைவடைந்ததுவரை, சாலொமோனின் முழுப் பணியும் ஒழுங்காக அமைக்கப்பட்டது.[a][b] இவ்வாறு யாவேயின் ஆலயம் முழுமையடைந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒழுங்காக அமைக்கப்பட்டது” என்பதற்கு “ஆயத்தப்படுத்தப்பட்டது” அல்லது “நிலைநிறுத்தப்பட்டது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொற்றொடரை மிக நேரடியாக, “யாவேயின் ஆலயத்திற்கு அடித்தளம் இடப்பட்ட நாள் வரையும், அது நிறைவடையும் வரையும்” என்று மொழிபெயர்க்கலாம்; இங்கு அடித்தளமிடப்பட்ட நாள் முதல் நிறைவுவரையிலான காலப்பகுதி பொருளாகக் கொள்ளப்பட்டுள்ளது.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַתִּכֹּן
  choice: ஒழுங்குபடுத்தப்பட்டன
  rationale: כון என்பதன் நிபால் வடிவம் நிலைநிறுத்தப்படுதல், ஆயத்தப்படுத்தப்படுதல், ஒழுங்குபடுத்தப்படுதல் ஆகிய பொருள்களைத் தரலாம். கட்டுமானப் பணிகள் முறையாக நிறைவேற்றப்பட்ட முடிவுநிலையை இங்கு இயல்பான தமிழில் தெரிவிக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  choice: சாலொமோனின் வேலைகள் அனைத்தும்
  rationale: מְלָאכָה என்பது வேலை, பணி, திட்டப்பணி ஆகியவற்றைக் குறிக்கும். தமிழில் பன்மையாக அமைப்பது முழுக் கட்டுமானத் திட்டத்திலுள்ள பணிகள் அனைத்தையும் இயல்பாகக் குறிக்கிறது.
- source_word: עַד הַיּוֹם מוּסַד בֵּית יְהוָה וְעַד כְּלֹתוֹ
  choice: யாவேயின் ஆலயத்திற்கு அடித்தளம் இடப்பட்ட நாள் முதல் அது கட்டி முடிக்கப்பட்டதுவரை
  rationale: கட்டுமானத்தின் தொடக்கத்திலிருந்து நிறைவுவரையிலான காலவெளியே சூழலில் நோக்கமாக உள்ளது. எபிரெயச் சொற்றொடரின் நேரடியான ‘வரை’ அமைப்பிலுள்ள சுருக்கம் மற்றும் தெளிவின்மை அடிக்குறிப்பில் சுட்டப்படுகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லுக்கு நேராக ‘யாவேயின் வீடு/இல்லம்’ என்றாலும், இச்சூழலில் அது எருசலேம் ஆலயத்தையே குறிக்கிறது. ‘ஆலயம்’ என்பது சாதாரண நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: שָׁלֵם
  choice: முழுமையாகக் கட்டி முடிக்கப்பட்டது
  rationale: שָׁלֵם இங்கு ஆலயம் முழுமையடைந்த நிலையைக் குறிப்பதாகப் பயனிலை வகிக்கிறது. ‘முழுமையாகக் கட்டி முடிக்கப்பட்டது’ அதன் நிறைவுநிலையையும் கட்டுமானச் சூழலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது. பட்டப்பெயரான ‘கர்த்தர்’ என்பதற்குப் பதிலாகவும், வேறொரு மரபுவழி ஒலிப்பான ‘யெகோவா’ என்பதற்குப் பதிலாகவும், Yahweh-ஐ நெருக்கமாக ஒலிபெயர்க்கும் ‘யாவே’ தேர்ந்தெடுக்கப்பட்டது.
- issue: முதல் வாக்கியத்தின் காலத் தொடர்பு
  choice: அடித்தளம் இடப்பட்ட நாள் முதல் கட்டி முடிக்கப்பட்டதுவரை
  alternative: அடித்தளம் இடப்பட்ட நாள்வரை, அதன் நிறைவுவரை
  rationale: எபிரெயத்தில் עַד இருமுறை வருவதால் நேரடி வடிவம் ‘வரை ... வரை’ என அமையும்; ஆயினும் சூழல் அடித்தளமிடுதலிலிருந்து நிறைவுவரையிலான மொத்தப் பணியைக் குறிக்கிறது. இயல்பான தமிழில் காலவெளி தெளிவாக்கப்பட்டது; மூலத்தின் சுருக்கமான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘வீடு/இல்லம்’ என்ற சொற்சொல் வடிவத்திற்கு மாற்றாக, இச்சூழலின் குறிப்பிட்ட பொருளைத் தெளிவுபடுத்த ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது. சாலொமோனின் பெயர் தமிழ் வேதாகமப் பயன்பாட்டுடன் ஒத்த எழுத்துப்பெயர்ப்பில் வழங்கப்பட்டது.
