source:
  edition: WLC
  text: אָ֣ז הֶעֱלָ֧ה שְׁלֹמֹ֛ה עֹל֖וֹת לַ/יהוָ֑ה עַ֚ל מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֥ר בָּנָ֖ה לִ/פְנֵ֥י הָ/אוּלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/012.yaml
  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
translation:
  language: ta
  text: அப்போது சாலொமோன், மண்டபத்தின் முன்பாகத் தான் கட்டியிருந்த யாவேயின் பலிபீடத்தின்மேல் யாவேக்குத் தகனபலிகளைச் செலுத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மண்டபம்” என்பதற்கு “முகப்பு மண்டபம்” அல்லது “முன்மண்டபம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் ஆலயத்தின் நுழைவு மண்டபத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலச் சுட்டியாக இயல்பான நவீனத் தமிழில் அமைகிறது.
- source_word: הֶעֱלָה
  choice: செலுத்தினார்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் பலியிடும் சூழலில் பலியைச் செலுத்துவதைக் குறிக்கிறது; தகனபலி என்ற பொருளோடு சேர்ந்து தமிழில் தெளிவாக உள்ளது.
- source_word: שְׁלֹמֹה
  choice: சாலொமோன்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: முழுவதும் எரித்துச் செலுத்தப்படும் பலிவகையைத் துல்லியமாகவும் வழக்கமான வேதாகமத் தமிழிலும் குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ அர்ப்பணிப்பின் இலக்கைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל מִזְבַּח יְהוָה
  choice: யாவேயின் பலிபீடத்தின்மேல்
  rationale: பலிகள் வைக்கப்பட்ட இடத்தையும் பலிபீடம் யாவேக்கு உரியது என்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בָּנָה
  choice: தான் கட்டியிருந்த
  rationale: சாலொமோனே முன்பு கட்டிய பலிபீடம் என்பதைத் தெளிவுபடுத்தி, முதன்மைச் செயலுக்கு முந்திய செயலைக் காட்டுகிறது.
- source_word: לִפְנֵי הָאוּלָם
  choice: மண்டபத்தின் முன்பாக
  rationale: ஆலயத்தின் நுழைவு மண்டபத்துக்கு முன்னிருந்த இடத்தை இயல்பான தமிழில் குறிக்கிறது; கட்டடவியல் மாற்றுப் பெயர்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், நவீனத் தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய உறவுத்தொடர் தமிழில் வாசிக்க இயலுமாறு ஒழுங்குபடுத்தப்பட்டாலும், பலிபீடம், அதன் இருப்பிடம், பலியின் இலக்கு ஆகிய தகவல்கள் அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
