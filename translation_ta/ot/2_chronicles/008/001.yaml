source:
  edition: WLC
  text: וַ/יְהִ֞י מִ/קֵּ֣ץ עֶשְׂרִ֣ים שָׁנָ֗ה אֲשֶׁ֨ר בָּנָ֧ה שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּיתֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
translation:
  language: ta
  text: சாலொமோன் யாவேயின் இல்லத்தையும் தன் இல்லத்தையும் கட்டிய இருபது ஆண்டுகளின் முடிவில்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: …முடிவில்,
  rationale: இது அடுத்த நிகழ்வை அறிமுகப்படுத்தும் எபிரெயக் கதைத் தொடரமைப்பு. வசனம் அடுத்த வசனத்தில் நிறைவடைவதால், தமிழில் இயல்பான தொடர்வாக்கியமாக இறுதியில் காற்புள்ளியுடன் தரப்பட்டுள்ளது.
- source_word: מִקֵּץ עֶשְׂרִים שָׁנָה
  choice: இருபது ஆண்டுகளின் முடிவில்
  rationale: குறிப்பிட்ட காலப்பகுதி நிறைவடைந்த நேரத்தை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר בָּנָה
  choice: கட்டிமுடித்த
  rationale: அந்த இருபது ஆண்டு காலத்திற்குள் கட்டுமானப் பணி நிறைவடைந்ததைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லம்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருளான ‘இல்லம்’ என்பதையும், יְהוָה என்ற இறைப் பெயரையும் நேரடியாகப் பாதுகாக்கிறது; ‘ஆலயம்’ என்பது சூழலுக்கு ஏற்றதாயினும் விளக்க மொழிபெயர்ப்பு.
- source_word: בֵּיתוֹ
  choice: தன் சொந்த இல்லம்
  rationale: சாலொமோனுக்குரிய இல்லத்தை யாவேயின் இல்லத்திலிருந்து தெளிவாக வேறுபடுத்துகிறது; ‘அரண்மனை’ என்பது சூழல்சார் மாற்றுப் பொருளாக அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் நடையைப் பயன்படுத்துகிறது. மூல வசனம் அடுத்த வசனத்தோடு இலக்கண ரீதியாகத் தொடர்வதால் காற்புள்ளியுடன் முடிக்கப்படுகிறது.
