  source_fidelity: 'மூல எபிரெயத்தின் கூறுகள் அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: சாலொமோனுக்குரிய நியமன அலுவலர்களின் தலைவர்கள், அவர்களின் எண்ணிக்கை இருநூற்று ஐம்பது, மேலும் அவர்கள் மக்கள்மேல் நிர்வாக அதிகாரம் செலுத்தியமை. ''மக்கள்மேல்'' என்பது בָּעָם என்பதையும், ''அதிகாரம் செலுத்திய'' என்பது הָרֹדִים என்பதன் நிர்வாகச் சூழலிலான பொருளையும் நன்றாகக் காக்கிறது.'
