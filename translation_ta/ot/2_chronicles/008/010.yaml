  terminology: '''நியமிக்கப்பட்ட அதிகாரிகள்'' என்பது נְצִיבִים என்பதற்கு பாதுகாப்பான நிர்வாகச் சொல்; ''தலைவர்கள்'' என்பது שָׂרֵי என்பதன் மேல்நிலையைச் சரியாகக் காட்டுகிறது. தேவையற்ற இராணுவம், கட்டாய உழைப்பு, அல்லது குறிப்பிட்ட இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.'
