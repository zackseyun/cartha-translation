source:
  edition: WLC
  text: וְ/אֵ֨לֶּה שָׂרֵ֤י ה/נציבים אֲשֶׁר לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם הָ/רֹדִ֖ים בָּ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/010.yaml
  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
translation:
  language: ta
  text: 'சாலொமோன் அரசனுடைய நியமிக்கப்பட்ட அதிகாரிகளின் தலைவர்கள் இவர்களே: மக்கள்மேல் அதிகாரம் செலுத்திய இருநூற்று ஐம்பது பேர்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மக்களை மேற்பார்வையிட்ட” அல்லது “மக்களுக்குப் பொறுப்பாக இருந்த” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் நிர்வாக அதிகாரம் செலுத்துவதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: எபிரெயக் கதையோட்டத்தில் பட்டியலின் முடிவை அல்லது தொகுப்பை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான வலியுறுத்தலுடன் வழங்கப்பட்டுள்ளது.
- source_word: שָׂרֵי הַנְּצִיבִים
  choice: நியமிக்கப்பட்ட அதிகாரிகளின் தலைவர்கள்
  rationale: שָׂרֵי என்பது தலைமைப் பதவியையும், נְצִיבִים என்பது அரசரால் நியமிக்கப்பட்ட அலுவலர்களையும் குறிக்கிறது. இராணுவப் பொருளைத் தேவையின்றி புகுத்தாமல் நிர்வாகப் படிநிலையைத் தெளிவாக்குகிறது.
- source_word: אֲשֶׁר לַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசனுடைய
  rationale: அரசருடன் உள்ள உடைமை அல்லது நிர்வாகச் சார்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: இருநூற்று ஐம்பது பேர்
  rationale: எபிரெய எண்ணிக்கையின் நேரான தமிழ் வடிவம்; நபர்களைக் குறிக்க ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הָרֹדִים בָּעָם
  choice: மக்கள்மேல் அதிகாரம் செலுத்திய
  rationale: רדה ஆட்சி செய்தல் அல்லது அதிகாரம் செலுத்துதல் எனப் பொருள்படும். இங்கு நிர்வாகச் சூழலுக்கு ஏற்றபடி ‘அதிகாரம் செலுத்திய’ என மொழிபெயர்க்கப்பட்டுள்ளது; בָּעָם என்பதன் நேரான பொருளான ‘மக்கள்மேல்’ தக்கவைக்கப்பட்டுள்ளது.
