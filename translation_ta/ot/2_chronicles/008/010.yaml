  register: நவீன நிலையான தமிழில், கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நிர்வாகப் பதவிகளின் படிநிலையைத் தெளிவாகக் காட்டியபோதும், மூலத்தில் இல்லாத கட்டாய உழைப்பு அல்லது இராணுவப் பொருள் சேர்க்கப்படவில்லை.
