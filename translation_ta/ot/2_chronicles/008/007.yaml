  text: כָּל הָ֠/עָם הַ/נּוֹתָ֨ר מִן הַ/חִתִּ֜י וְ/הָ/אֱמֹרִ֤י וְ/הַ/פְּרִזִּי֙ וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֔י אֲשֶׁ֛ר לֹ֥א מִ/יִּשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/007.yaml
  text: As for all the people who were left from the Hittites[a], the Amorites, the Perizzites, the Hivites, and the Jebusites, who were not from Israel—
translation:
  language: ta
  text: ஏத்தியர், எமோரியர், பெரிசியர், ஏவியர், எபூசியர் ஆகிய அந்த இனங்களில் எஞ்சியிருந்த, இஸ்ரவேலைச் சேர்ந்திராத[a] எல்லா மக்களையும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலர் அல்லாத.” எபிரெயத்தில் இன்னும் நேரடியாக, “இஸ்ரவேலிலிருந்து அல்லாத.”
    reason: மூலத்தின் מִן என்ற முன்னிடைச்சொல்லின் நேரடியான வடிவத்தையும் இயல்பான மாற்று மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: כָּל הָעָם
  choice: அனைவரையும்
  rationale: இங்கு עָם ஒரு கூட்டுமக்களைக் குறிக்கிறது; அடுத்த வசனத்துடன் தொடரும் வாக்கிய அமைப்பில் ‘அனைவரையும்’ என்பது இயல்பாகவும் முழுமையைக் காட்டுவதாகவும் உள்ளது.
- source_word: הַנּוֹתָר
  choice: மீதியாயிருந்த
  rationale: נותר என்பதன் நிபால் வினையெச்சம் அழிவுக்குப் பின் எஞ்சியிருந்தவர்களைக் குறிக்கிறது; ‘மீதியாயிருந்த’ என்பது அந்தப் பின்னோக்கிய வரலாற்றுப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מִן
  choice: ஆகிய மக்களுள்
  rationale: מִן இங்கு பட்டியலிடப்பட்ட இனங்களிலிருந்து எஞ்சியவர்களைக் குறிக்கிறது; தமிழில் ‘மக்களுள்’ என்பது மூல/குழுச் சார்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: இத்தியர், எமோரியர், பெரிசியர், ஏவியர், எபூசியர்
  rationale: எபிரெயத்தில் ஒருமை வடிவங்கள் ஒவ்வொரு இனத்தையும் கூட்டாகக் குறிக்கின்றன; தமிழில் பன்மை இனப்பெயர்கள் அதனை இயல்பாகத் தெரிவிக்கின்றன.
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  choice: இஸ்ரவேலைச் சேர்ந்திராத
  rationale: இந்தச் சொற்றொடர் அவர்கள் இஸ்ரவேல் மக்களுக்குள் சேர்ந்தவர்கள் அல்ல என்பதைச் சொல்கிறது. ‘சேர்ந்திராத’ என்பது מִן காட்டும் தொடர்பை இயல்பான தமிழில் காக்கிறது; ‘இஸ்ரவேலர் அல்லாத’ என்ற சுருக்கமான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இன அல்லது சமூகச் சார்பைக் குறிக்கும் אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה என்ற சொற்றொடர்
  choice: இஸ்ரவேலைச் சேர்ந்திராத
  alternative: இஸ்ரவேலர் அல்லாத
  rationale: மூலத்தில் உள்ள מִן (‘இலிருந்து/சேர்ந்த’) என்பதை முற்றிலும் நீக்காமல், அவர்கள் இஸ்ரவேலுடன் சார்பில்லாதவர்கள் என்ற பொருளை மட்டும் தருகிறது; இன அடையாளத்தை மூலத்தைவிட அதிகமாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று உரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூல வசனம் அடுத்த வசனத்தில் நிறைவடையும் வாக்கியத்தின் தொடக்கமாக இருப்பதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி அது விளக்கும் சொற்றொடருக்குப் பின் இடப்பட்டுள்ளது.
