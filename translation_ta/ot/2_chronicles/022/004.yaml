source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּי הֵ֜מָּה הָֽיוּ ל֣/וֹ יֽוֹעֲצִ֗ים אַחֲרֵ֛י מ֥וֹת אָבִ֖י/ו לְ/מַשְׁחִ֥ית לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
translation:
  language: ta
  text: அவன் ஆகாபின் குடும்பத்தாரைப் போல யாவேயின் பார்வையில் தீமையானதைச் செய்தான். ஏனெனில், அவனுடைய தந்தை இறந்தபின் அவர்களே அவனுடைய ஆலோசகர்களாக இருந்து, அவனுடைய அழிவுக்கு வழிவகுத்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுடைய அழிவுக்காக” அல்லது “அவனை அழிப்பதற்காக” என்றும் பொருள்கொள்ளலாம். எபிரெயச் சொற்றொடர் அவர்களுடைய ஆலோசனையின் அழிவான விளைவையோ அதன் அழிவு நோக்கத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: எபிரெய மதிப்பீட்டுச் சூத்திரத்தின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; தொடக்க וַ־ தொடர்ச்சியான நிகழ்வைக் குறித்தாலும் தமிழில் தனியாக ‘மேலும்’ சேர்க்கத் தேவையில்லை.
- source_word: בְּעֵינֵי יְהוָה
  choice: யெகோவாவின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் ‘கண்களில்’ என்ற எபிரெய மரபுத்தொடரை இயல்பான தமிழில் ‘பார்வையில்’ எனத் தருகிறது; יְהוָה தனிப்பட்ட இறைப்பெயராக ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: כְּבֵית אַחְאָב
  choice: ஆகாபின் வம்சத்தாரைப் போலவே
  rationale: בֵּית இங்கு ஒரு கட்டிடத்தை அல்ல, ஆகாபின் குடும்பம் அல்லது அரச வம்சத்தைச் சுட்டுகிறது; ‘வம்சத்தார்’ அந்தக் கூட்டுப் பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: הֵמָּה הָיוּ לוֹ יוֹעֲצִים
  choice: அவர்களே அவனுடைய ஆலோசகர்களாக இருந்து
  rationale: הֵמָּה-வின் வலியுறுத்தலை ‘அவர்களே’ காக்கிறது; பெயர்ச்சொல் பயனிலை அமைப்பான ‘ஆலோசகர்களாக இருந்தார்கள்’ என்பதும் பேணப்படுகிறது.
- source_word: אַחֲרֵי מוֹת אָבִיו
  choice: அவனுடைய தந்தை இறந்தபின்
  rationale: ‘அவனுடைய தந்தையின் மரணத்திற்குப் பின்’ என்பதைக் காட்டிலும் பொதுவாசகருக்கு இயல்பான தமிழாகவும் மூலத்தின் காலத் தொடர்பைத் துல்லியமாகவும் தருகிறது.
- source_word: לְמַשְׁחִית לוֹ
  choice: அவனுடைய அழிவுக்கு வழிவகுத்தார்கள்
  rationale: அவர்களுடைய ஆலோசனையின் அழிவான விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெய சொற்றொடர் நோக்கத்தையும் விளைவையும் குறிக்கக்கூடியதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப்பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பட்ட பெயராக வைத்திருக்கிறது. தமிழில் பரவலாக அறியப்படும் ஒலிவடிவமாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
- issue: לְמַשְׁחִית לוֹ என்பதில் நோக்கமா விளைவா
  choice: அவர்களுடைய ஆலோசனை அவனுடைய அழிவுக்கு வழிவகுத்தது என்ற விளைவு வாசிப்பு
  alternative: அவனை அழிக்கும்படி அவர்கள் ஆலோசகர்களாக இருந்தார்கள் என்ற நோக்க வாசிப்பு
  rationale: לְ முன்னொட்டு நோக்கத்தையோ விளைவையோ குறிக்கலாம். முதன்மை உரை சூழலுக்கேற்ற அழிவான விளைவைத் தருகிறது; ஆலோசகர்கள் திட்டமிட்டு அவனை அழிக்க முயன்றார்கள் என்று உறுதியாக்காமல், நோக்க வாசிப்பை அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் ஆனால் மதிப்புக்குரிய நடையில் வடிவமைக்கப்பட்டது. ‘ஆகாபின் வீடு’ என்ற சொல்லுக்குச் சொல் வடிவம் கட்டிடத்தை நினைவூட்டக்கூடும் என்பதால், மூலத்தின் வம்ச/குடும்பப் பொருள் ‘ஆகாபின் வம்சத்தார்’ எனத் தெளிவாக்கப்பட்டது. அடிக்குறிப்பு குறியீடு தெளிவுபடுத்தும் இறுதிச் சொற்றொடரிலேயே வைக்கப்பட்டுள்ளது.
