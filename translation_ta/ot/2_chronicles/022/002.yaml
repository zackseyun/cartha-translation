  rationale: வழங்கப்பட்ட WLC மூல உரை ‘நாற்பத்திரண்டு’ என்றே வாசிக்கிறது. இணைச் செய்தியுடன் ஒத்திசைக்க எண்ணை மௌனமாகத் திருத்தாமல், உரைச் சிக்கலை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுவது மூலத்திற்கும் அதன் உண்மையான பதற்றத்திற்கும் நீதி செய்கிறது.
- issue: ‘உம்ரியின் மகள்’ என்பதன் வம்சவழிப் பொருள்
  choice: முதன்மை உரையில் ‘உம்ரியின் மகள்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘உம்ரியின் வழித்தோன்றல்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெய உரையில் சாதாரண உறவுமுறைச் சொல்லான ‘மகள்’ உள்ளது. அது சில சூழல்களில் பெண் வழித்தோன்றலையும் குறிக்கக்கூடும் என்பதால் அந்த வாய்ப்பை அடிக்குறிப்பில் காக்கிறது; முதன்மை உரை கேள்வியை முன்கூட்டியே தீர்ப்பதில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரசர் குறித்த வரலாற்றுச் செய்தியின் சுருக்கமான தன்மை காக்கப்பட்டுள்ளது. உரை மற்றும் வம்சவழிச் சிக்கல்கள் முதன்மை உரையில் தீர்க்கப்படாமல் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
