  text: בֶּן אַרְבָּעִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲתַלְיָ֖הוּ בַּת עָמְרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
translation:
  language: ta
  text: அகசியா அரசனானபோது நாற்பத்திரண்டு வயதுடையவனாக இருந்தான்[a]. அவன் எருசலேமில் ஓராண்டு ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் அத்தாலியா[b]; அவள் உம்ரியின் மகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “நாற்பத்திரண்டு வயது.” இதற்கு இணையான 2 இராஜாக்கள் 8:26-ல் “இருபத்திரண்டு வயது” என்று உள்ளது. ஆகவே, சிலர் இதை உரைப்பிரதிச் சிக்கலாகக் கருதுகின்றனர்; வேறு சிலர் இந்த எண்ணை வேறொரு கணக்குமுறையின்படி புரிந்துகொள்கின்றனர்.'
    reason: textual_variant
  - marker: b
    text: அல்லது, “உம்ரியின் வழித்தோன்றல்.” எபிரெய மொழியில் “மகள்” என்ற சொல் சில நேரங்களில் பெண் சந்ததியைக் குறிக்கும் பரந்த பொருளிலும் பயன்படுத்தப்படலாம்.
    reason: lexical_alternative
