id: 2CH.22.3
reference: 2 Chronicles 22:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: גַּם ה֣וּא הָלַ֔ךְ בְּ/דַרְכֵ֖י בֵּ֣ית אַחְאָ֑ב כִּ֥י אִמּ֛/וֹ הָיְתָ֥ה יֽוֹעַצְתּ֖/וֹ לְ/הַרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/003.yaml
  text: He too walked in the ways of the house of Ahab[a], because his mother was his counselor to act wickedly.
translation:
  language: ta
  text: அவனும் ஆகாபின் வீட்டாரின் வழிகளில் நடந்தான்; ஏனெனில், அவனுடைய தாய் அவனைத் தீமை செய்யத் தூண்டும் ஆலோசகராக இருந்தாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமை செய்வதில் அவனுக்கு ஆலோசனை கூறினாள்.”
    reason: ‘ஆலோசகராக இருந்தாள்’ என்ற பெயர்ச்சொல் அமைப்பைத் தமிழில் வினைச்சொல் அமைப்பாகவும் இயல்பாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: גַּם הוּא
  choice: அவனும்
  rationale: גַּם என்பதன் சேர்க்கைப் பொருளையும், தனிப்பட்ட சுட்டுப்பெயர் தரும் வலியுறுத்தலையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הָלַךְ בְּדַרְכֵי
  choice: வழிகளில் நடந்தான்
  rationale: ஒழுக்கம் மற்றும் வாழ்க்கை நடத்தையைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியக்கூடிய வகையில் தக்கவைக்கிறது.
- source_word: בֵּית אַחְאָב
  choice: ஆகாபின் வீட்டார்
  rationale: בֵּית என்பதில் குடும்பம், அரசகுலம் ஆகிய இரு தொடர்புகளும் உள்ளன; ‘வீட்டார்’ அந்தக் குடும்ப/வம்சப் பொருளை ‘அரசவம்சம்’ என மிகத் திட்டமாக்காமல் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை இங்கு தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: אִמּוֹ
  choice: அவனுடைய தாய்
  rationale: மூலத்தின் உடைமைத் தொடர்பை நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: הָיְתָה יֹעַצְתּוֹ
  choice: அவனுக்கு ஆலோசகராக இருந்தாள்
  rationale: ஒருமுறை ஆலோசனை கூறியதாக அல்லாமல், தொடர்ந்து ஆலோசகராக இருந்த நிலையை உணர்த்தும் மூலத்தின் பெயர்ச்சொல் அமைப்பைப் பாதுகாக்கிறது.
- source_word: לְהַרְשִׁיעַ
  choice: தீமை செய்யும்படி
  rationale: ரשע என்பதன் தெளிவான ஒழுக்க மதிப்பீட்டையும், ஆலோசனையின் நோக்கம் அல்லது விளைவையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தாயின் செல்வாக்கின்கீழ் அரசனின் நடத்தைக்கு வழங்கப்படும் ஒழுக்க மதிப்பீடு
  choice: அவனுடைய தாய் தீமை செய்யும்படி அவனுக்கு ஆலோசகராக இருந்தாள் என்று உரையின் வெளிப்படையான மதிப்பீட்டைத் தக்கவைத்தல்
  alternative: ‘அவனுடைய தாய் அவனைத் தீமை செய்ய ஊக்குவித்தாள்’ என்று விரிவாகப் பொருளுரைத்தல்
  rationale: לְהַרְשִׁיעַ தீய நடத்தையைத் தெளிவாகக் குறிக்கிறது. ஆனால் ‘ஊக்குவித்தாள்’ என்பது மூலத்தில் நேரடியாக இல்லாத உளவியல் நுணுக்கத்தைச் சேர்க்கக்கூடும்; ஆகவே ஆலோசகர் என்ற அமைப்பு தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிகளில் நடந்தான்’ என்ற வேதாகம உருவகம் பொருள் தெளிவாக இருப்பதால் தக்கவைக்கப்பட்டது; ‘வீட்டார்’ குடும்பத்தையும் அரசகுலத்தையும் உள்ளடக்கும் வகையில் தேர்ந்தெடுக்கப்பட்டது.
