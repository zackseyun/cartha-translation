base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
translation:
  language: ta
  text: அவனும் அவர்களுடைய ஆலோசனையின்படி நடந்தான்[a]. அவன் இஸ்ரவேலின் அரசனான ஆகாபின் மகன் யெகோராமுடன்[c], கீலேயாத்திலுள்ள ராமோத்தில் அராமின் அரசனான அசகேலுக்கு எதிராகப் போரிடச் சென்றான்[b]. அராமியர்கள் யோராமைக் காயப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், “அவர்களுடைய ஆலோசனையில் நடந்தான்”; அதாவது, அவர்களுடைய ஆலோசனையின் வழிநடத்துதலின்படி செயல்பட்டான்.
    reason: lexical_alternative
  - marker: b
    text: “அராம்” என்பது பாரம்பரியமாக “சீரியா” என்றும், “அராமியர்கள்” என்பது “சீரியர்கள்” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
  - marker: c
    text: இவ்வசனத்தின் முற்பகுதியில் “யெகோராம்” என்றும் இறுதியில் “யோராம்” என்றும் தொடர்புடைய இரு பெயர் வடிவங்களை எபிரேய மூலபாடம் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּעֲצָתָם הָלַךְ
  choice: அவனும் அவர்களுடைய ஆலோசனையின்படி நடந்தான்
  rationale: ‘நடந்தான்’ என்பது எபிரேய உருவகத்தைத் தக்கவைக்கிறது; ‘ஆலோசனையின்படி’ என்பது அவர்களது அறிவுரையின் வழிநடத்துதலின்படி அவன் செயல்பட்டான் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיֵּלֶךְ אֶת
  choice: அவனுடன் ... சென்றான்
  rationale: இக்கட்டமைப்பு யெகோராமோடு சேர்ந்து சென்றதைக் குறிக்கிறது; தமிழில் உடன்செல்லும் பொருள் தெளிவாக வெளிப்படுகிறது.
- source_word: יְהוֹרָם ... יוֹרָם
  choice: யெகோராம் ... யோராம்
  rationale: எபிரேய மூலத்தில் ஒரே நபரின் பெயர் தொடர்புடைய இரு வடிவங்களில் வருவதால் அந்த வேறுபாடு தமிழிலும் தக்கவைக்கப்படுகிறது.
- source_word: אֲרָם / הָרַמִּים
  choice: அராம் / அராமியர்கள்
  rationale: பிற்கால வழக்கான ‘சீரியா/சீரியர்கள்’ என்பதற்குப் பதிலாக எபிரேயத்தின் வரலாற்றுப் பெயரை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: கீலேயாத்திலுள்ள ராமோத்தில்
  rationale: இடப்பெயரின் இரு கூறுகளையும் தெளிவாகக் காட்டி, போரின் இடத்தையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: וַיַּכּוּ
  choice: காயப்படுத்தினார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘அடித்தார்கள்’ என்றாலும், அடுத்த வசனம் விளக்கும் காயத்தையே இங்கு சூழல் குறிப்பதால் ‘காயப்படுத்தினார்கள்’ பொருத்தமானது.
theological_decisions:
- issue: אֲרָם மற்றும் הָרַמִּים ஆகிய வரலாற்றுப் பெயர்களின் மொழிபெயர்ப்பு
  choice: அராம் / அராமியர்கள்
  alternative: சீரியா / சீரியர்கள்
  rationale: மூலமொழியின் வரலாற்று-இனப்பெயரைப் பேணுகிறது; பிற்கால அரசியல்-புவியியல் பெயரை உரைக்குள் கொண்டுவருவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆலோசனையின்படி நடந்தான்’ என்ற சொற்றொடர் எபிரேய உருவகத்தையும் தமிழின் இயல்பையும் சமநிலைப்படுத்துகிறது. வரலாற்றுப் பெயர்கள் மூலமொழிக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன.
