base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
translation:
  language: ta
  text: அகசியா யோராமிடம் சென்றபோது அவருக்கு ஏற்பட்ட வீழ்ச்சி[a] கடவுளிடமிருந்து வந்தது. அவர் அங்கு வந்தபோது, நிம்சியின் மகன் யெகூவிடம் யெகோராமுடன் புறப்பட்டுச் சென்றார். ஆகாபின் குடும்பத்தை அடியோடு ஒழிப்பதற்காக யெகூவை யாவே அபிஷேகம் செய்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரது அழிவு.” பின்னுள்ள சொற்றொடரை “யெகோராமுடன் யெகூவுக்கு எதிராகப் புறப்பட்டார்” அல்லது “யெகூவைச் சந்திக்கப் புறப்பட்டார்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்குச் சொல் “யெகூவிடம்” என்று உள்ளது; சூழல் ஒரு பகைமையான சந்திப்பைக் குறிப்பதாகத் தெரிகிறது.
    reason: תְּבוּסַת என்பதன் பொருள் பரப்பையும், אֶל יֵהוּא என்பதன் நேரடியான திசைப் பொருளையும் சூழல் சார்ந்த மாற்றுவாசிப்புகளையும் காட்டுகிறது.
lexical_decisions:
- source_word: וּמֵאֱלֹהִים
  choice: கடவுளிடமிருந்து வரக் காரணமாயிற்று
  rationale: מן முன்னிடைச்சொல் மூலத்தையோ தோற்றுவாயையோ குறிக்கிறது. தமிழில் இயல்பான வாக்கிய அமைப்புக்காக வீழ்ச்சி கடவுளிடமிருந்து வந்தது என்ற தெய்வீகக் காரணத்தை இவ்வாறு வெளிப்படுத்துகிறது; அது எவ்விதத்தில் நிகழ்ந்தது என்பதை உரை கூறுவதற்கு மேல் வரையறுக்கவில்லை.
- source_word: תְּבוּסַת אֲחַזְיָהוּ
  choice: அகசியாவின் வீழ்ச்சி
  rationale: תְּבוּסָה மிதித்தல், தோல்வி, அழிவு ஆகிய பரப்பைக் கொண்டது. சூழலில் அகசியாவுக்கு ஏற்பட்ட பேரழிவான முடிவைக் குறிக்க ‘வீழ்ச்சி’ இயல்பாகவும் போதிய பரப்புடனும் உள்ளது.
- source_word: לָבוֹא אֶל יוֹרָם
  choice: யோராமிடம் சென்றதே
  rationale: ל உடனான வினையெச்சம் அவரது வீழ்ச்சியுடன் தொடர்புடைய சந்தர்ப்பத்தையோ வழியையோ குறிக்கிறது. தமிழில் வலியுறுத்தும் ‘சென்றதே’ அந்த இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: וּבְבֹאוֹ
  choice: அவர் அங்கு வந்தபோது
  rationale: ב உடனான வினையெச்ச வடிவம் இங்கு காலத்தைக் குறிக்கிறது. முந்தைய ‘யோராமிடம்’ என்பதைக் கருத்தில் கொண்டு ‘அங்கு’ சேர்ப்பது தமிழில் இயல்பான குறிப்பை அளிக்கிறது.
- source_word: יָצָא עִם יְהוֹרָם אֶל יֵהוּא
  choice: யெகூவிடம் யெகோராமுடன் புறப்பட்டுச் சென்றார்
  rationale: יָצָא என்பது ‘புறப்பட்டுச் செல்’ என்று பொருள்படும்; אֶל நேரடியாக ‘இடம்/நோக்கி’ என்பதைக் குறிக்கிறது. பகைமையான சந்திப்பு சூழலில் சாத்தியமானாலும், முதன்மை உரை அதைச் சேர்த்து தீர்மானிக்கவில்லை.
- source_word: יוֹרָם / יְהוֹרָם
  choice: யோராம் / யெகோராம்
  rationale: எபிரெய உரையிலுள்ள இரு பெயர் வடிவங்களையும் ஒரே நபரைக் குறிப்பினும் ஒத்திசைக்காமல் தமிழில் வேறுபடுத்திக் காட்டுகிறது.
- source_word: מְשָׁחוֹ
  choice: அபிஷேகம் செய்திருந்தார்
  rationale: முதன்மை நிகழ்வுக்கு முன்பே யெகூ அபிஷேகம் செய்யப்பட்டதை இறந்தகால நிறைவுவடிவம் காட்டுகிறது. ‘அபிஷேகம்’ வேதாகமச் சூழலில் பரவலாக அறியப்படும் கண்ணியமான சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  choice: ஆகாபின் குடும்பத்தை அடியோடு ஒழிப்பதற்காக
  rationale: הכרית என்பது துண்டித்தல், முற்றிலும் அகற்றுதல், அழித்தல் என்ற பொருள்பரப்பைக் கொண்டது. ‘அடியோடு ஒழித்தல்’ முழுமையான வம்சத் தீர்ப்பை இயல்பான தமிழில் எடுத்துரைக்கிறது; בֵּית இங்கு கட்டடமல்ல, குடும்பம் அல்லது வம்சம்.
theological_decisions:
- issue: அகசியாவின் வீழ்ச்சியில் கடவுளின் காரணப்பங்கு
  choice: அகசியாவின் வீழ்ச்சி கடவுளிடமிருந்து வந்தது என்ற உரையின் நேரடி கூற்றைப் பேணுதல்
  alternative: கடவுள் அதை முன்கூட்டியே நியமித்தார் அல்லது வெறுமனே அனுமதித்தார் என்று குறிப்பாக விளக்குதல்
  rationale: எபிரெய உரை வீழ்ச்சியின் மூலத்தை கடவுளுக்குச் சேர்க்கிறது; ஆனால் நேரடி நியமனம், பராமரிப்புச் செயல், அனுமதி ஆகியவற்றில் ஒன்றைத் தனியாக வரையறுக்கவில்லை. ஆகவே அந்த இறையியல் அழுத்தமும் தெளிவின்மையும் பேணப்படுகின்றன.
- issue: யெகூவுடனான சந்திப்பின் தன்மை
  choice: ‘யெகூவிடம்’ என்ற நடுநிலையான திசைச்சொல்லை முதன்மை உரையில் வைத்தல்
  alternative: ‘யெகூவுக்கு எதிராக’ அல்லது ‘யெகூவைச் சந்திக்க’
  rationale: சூழல் பகைமையைச் சுட்டினாலும், எபிரெய אֶל நேரடியாக ‘இடம்/நோக்கி’ என்று மட்டுமே கூறுகிறது. பகைமைத் தன்மையை முதன்மை உரையில் கட்டாயமாக்காமல் அடிக்குறிப்பில் மாற்றுவாசிப்பாகத் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. பெயர்களின் எபிரெய வடிவ வேறுபாடு ‘யோராம்/யெகோராம்’ எனப் பேணப்பட்டுள்ளது. ‘யாவே’ தனிப்பெயராகவும், ‘அபிஷேகம்’ பொதுவாக அறியப்படும் வேதாகமச் சொல்லாகவும் பயன்படுத்தப்பட்டுள்ளன.
