  terminology: அகசியா, யோராம்/யெகோராம், யெகூ, யாவே, அபிஷேகம், ஆகாபின் குடும்பம் ஆகியவை ஏற்கத்தக்க வேதாகமப் பயன்பாடுகள். எபிரெய மூலத்தில் உள்ள யோராம்/யெகோராம் என்ற இரு வடிவங்களின் வேறுபாடு பேணப்பட்டுள்ளது. “அடியோடு ஒழிப்பதற்காக” הכרית என்பதன் முழுமையான அகற்றும் பொருளைச் சரிவரத் தருகிறது.
