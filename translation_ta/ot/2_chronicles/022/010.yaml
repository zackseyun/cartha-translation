base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
translation:
  language: ta
  text: அகசியாவின் தாயான அத்தாலியா, தன் மகன் இறந்துவிட்டதைக் கண்டதும், எழுந்து யூதா வம்சத்தைச் சேர்ந்த அரச சந்ததியினர் அனைவரையும் அழித்துப்போட்டாள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரெய வினைவடிவம் கடினமானது; சொற்பட அது “பேசினாள்” என்று உள்ளது. ஆனால் இச்சூழலும் 2 இராஜாக்கள் 11:1-இன் இணை விவரமும் “அழித்தாள்” அல்லது “கொன்றுபோட்டாள்” என்ற பொருளை ஆதரிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  choice: அத்தாலியா
  rationale: எபிரெயப் பெயர் நவீனத் தமிழில் இயல்பாக ஒலிபெயர்க்கப்பட்டது; முன்னுள்ள வாவுக்கு தனியே காலக் குறிப்பு சேர்க்கப்படவில்லை.
- source_word: אֵם אֲחַזְיָהוּ
  choice: அகசியாவின் தாயான
  rationale: இணைப்புச் சொற்றொடரின் உறவைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  choice: தன் மகன் இறந்துவிட்டதைக் கண்டதும்
  rationale: כִּי அறிமுகப்படுத்தும் உண்மைநிலையை வெளிப்படுத்துகிறது; கதையின் தொடர்ச்சியில் உடனடியாக நிகழும் தீர்மானமான செயலை ‘கண்டதும்’ இயல்பாக இணைக்கிறது.
- source_word: וַתָּקָם
  choice: எழுந்து
  rationale: கூம் என்னும் வினை இங்கு தீர்மானமான நடவடிக்கையைத் தொடங்குவதைச் சுட்டுகிறது; தமிழில் ‘எழுந்து’ அதன் கதைநடை வலிமையைப் பேணுகிறது.
- source_word: וַתְּדַבֵּר
  choice: அழித்துப்போட்டாள்
  rationale: மசோரா உயிர்க்குறிப்பின்படி வடிவம் ‘பேசினாள்’ எனத் தோன்றினாலும், நேரடிச் செயப்படுபொருளும் 2 இராஜாக்கள் 11:1 இணை நிகழ்வும் அழித்தல் என்ற பொருளை ஆதரிக்கின்றன. செய்முறையைத் தேவையின்றி குறிப்பாக்காமல் முழுமையான ஒழிப்பை இச்சொல் தெரிவிக்கிறது.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: அரச சந்ததியினர் அனைவரையும்
  rationale: זֶרַע என்பதன் ‘விதை/சந்ததி’ கருத்தை வம்ச ஆட்சிச் சூழலில் வாசிக்க எளிதான முறையில் காக்கிறது.
- source_word: לְבֵית יְהוּדָה
  choice: யூதா வம்சத்தைச் சேர்ந்த
  rationale: அரச சந்ததி எந்த வம்சத்துக்குரியது என்பதைத் தெளிவுபடுத்துகிறது; ‘வீடு’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட வம்சப் பொருளை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: וַתְּדַבֵּר என்னும் கடினமான வினைவடிவத்தின் பொருள்
  choice: சூழலின் அடிப்படையில் ‘அழித்துப்போட்டாள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘பேசினாள்’ அல்லது ‘கொலை செய்ய ஏற்பாடு செய்தாள்’
  rationale: ‘அரச சந்ததியினர் அனைவரையும்’ என்ற நேரடிச் செயப்படுபொருளோடு ‘பேசினாள்’ என்பது பொருந்தாது; 2 இராஜாக்கள் 11:1-இன் இணை விவரமும் கொன்றழித்தலைக் குறிக்கிறது. இருப்பினும், எபிரெய வடிவிலுள்ள சிக்கல் அடிக்குறிப்பில் வெளிப்படையாகப் பதிவு செய்யப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டது. ‘அரச சந்ததி’ வம்சத் தொடர்பைத் துல்லியமாகக் காக்கிறது; கடினமான எபிரெய வினை வாசகரிடமிருந்து மறைக்கப்படாமல் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
