  text: וַ/יְהִ֕י כְּ/הִשָּׁפֵ֥ט יֵה֖וּא עִם בֵּ֣ית אַחְאָ֑ב וַ/יִּמְצָא֩ אֶת שָׂרֵ֨י יְהוּדָ֜ה וּ/בְנֵ֨י אֲחֵ֧י אֲחַזְיָ֛הוּ מְשָׁרְתִ֥ים לַ/אֲחַזְיָ֖הוּ וַ/יַּהַרְגֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
translation:
  language: ta
  text: யெகூ ஆகாபின் வீட்டார்மீது தீர்ப்பை நிறைவேற்றிக்கொண்டிருந்தபோது[a], யூதாவின் அதிகாரிகளையும் அகசியாவின் சகோதரர்களுடைய மகன்களையும்[b], அகசியாவுக்குச் சேவை செய்துகொண்டிருந்தவர்களையும் கண்டான்; அவர்களைக் கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெகூ ஆகாபின் வீட்டாரை நியாயந்தீர்த்துக்கொண்டிருந்தபோது.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அகசியாவின் சகோதரர்களுடைய மகன்கள்”; அதாவது, அகசியாவின் அண்ணன் அல்லது தம்பிமாரின் மகன்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהִשָּׁפֵט
  choice: தீர்ப்பை நிறைவேற்றிக்கொண்டிருந்தபோது
  rationale: שׁפט என்பதன் நீதித்தீர்ப்பு சார்ந்த பொருளையும், כְּ உடன் வரும் காலத் தொடர்பையும் இயல்பான தமிழில் காக்கிறது; வெறும் ‘தண்டித்தபோது’ என்று கூறி பொருளைச் சுருக்கவில்லை.
- source_word: עִם בֵּית אַחְאָב
  choice: ஆகாபின் வீட்டார்மீது
  rationale: இங்கு עִם பகைமை சார்ந்த செயலின் இலக்கைக் குறிக்கிறது. ‘வீட்டார்’ என்பது ஆகாபின் குடும்பம்/அரச மரபு என்ற எபிரெயச் சொல்லாட்சியைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: שָׂרֵי יְהוּדָה
  choice: யூதாவின் அதிகாரிகள்
  rationale: שָׂרִים என்பது தலைவர்கள், பிரபுக்கள் அல்லது அதிகாரிகளைக் குறிக்கலாம்; அரசவைக் சூழலில் ‘அதிகாரிகள்’ போதுமான பரப்பைத் தக்கவைக்கிறது.
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  choice: அகசியாவின் சகோதரர்களுடைய மகன்கள்
  rationale: மூலத்தின் உறவுமுறை அமைப்பை அப்படியே பாதுகாக்கிறது; தமிழில் இவர்கள் அகசியாவின் மருமகன்கள் என்று அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: מְשָׁרְתִים לַאֲחַזְיָהוּ
  choice: அகசியாவுக்குப் பணிபுரிந்துவந்த
  rationale: தொடர்ச்சியான சேவை அல்லது அரசவைப் பணியைப் பங்கேற்பு வடிவம் குறிக்கிறது; வழிபாட்டுச் சேவை என்ற தேவையற்ற நிழற்பொருளைத் தவிர்க்கிறது.
- source_word: וַיַּהַרְגֵם
  choice: கொன்றான்
  rationale: הרג என்பதன் நேரடியான பொருளைத் தெளிவாகவும் மிகைப்படுத்தாமலும் வழங்குகிறது.
theological_decisions:
- issue: யெகூவின் செயலை நீதித்தீர்ப்பு மொழியில் விவரித்தல்
  choice: ‘தீர்ப்பை நிறைவேற்றிக்கொண்டிருந்தபோது’ என்று மொழிபெயர்த்தல்
  alternative: ‘நியாயந்தீர்த்துக்கொண்டிருந்தபோது’ அல்லது ‘தண்டித்துக்கொண்டிருந்தபோது’
  rationale: மூலத்தின் நீதித்துறை சார்ந்த வலிமையைப் பாதுகாக்கிறது; அதேவேளையில் இந்தக் கொலைகள் ஒவ்வொன்றுக்கும் வெளிப்படையான இறை அங்கீகாரம் இருந்ததாக வசனத்தை விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கதைத் தொடரின் வַיְהִי சூத்திரத்தைத் தமிழில் தனியே ‘அது நிகழ்ந்தது’ எனக் கட்டாயமாக்காமல், ‘...போது’ என்ற இயல்பான காலத் தொடரால் எடுத்துரைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
