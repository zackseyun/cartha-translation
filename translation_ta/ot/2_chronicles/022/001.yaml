base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: ta
  text: பின்பு எருசலேமில் குடியிருந்தவர்கள் யெகோராமின் இளைய மகனாகிய அகசியாவை யெகோராமுக்குப் பதிலாக அரசனாக்கினர். ஏனெனில், அரபியர்களோடு பாளயத்திற்குள் வந்த கொள்ளைக்கூட்டம்[a] மூத்த மகன்கள் அனைவரையும் கொன்றிருந்தது. இவ்வாறு யூதாவின் அரசனாகிய யெகோராமின் மகன் அகசியா அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரபியர்களிடையே பாளயத்திற்குள் வந்த படைக்கூட்டம்.” ‘அரபியர்கள்’ என்பதோடு வரும் எபிரெய முன்னிடைச்சொல்லை எவ்வாறு புரிந்துகொள்கிறோம் என்பதைப் பொறுத்து இத்தொடருக்கு வேறுவிதமாகவும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  choice: அரசனாக்கினர்
  rationale: מלך என்பதன் ஹிஃபில் வடிவம் ஒருவரை அரசராக ஏற்படுத்துதல் அல்லது அமர்த்துதல் என்ற காரணவினைப் பொருளைக் குறிக்கிறது; ‘அரசனாக்கினர்’ அதை இயல்பாகத் தருகிறது.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: எருசலேமில் குடியிருந்தவர்கள்
  rationale: ‘எருசலேமில் வசிப்போர்’ என்ற எபிரெயச் சொல்லின் பொருளை நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: בְנוֹ הַקָּטֹן
  choice: யெகோராமின் இளைய மகன்
  rationale: קטן அடிப்படையில் ‘சிறிய/இளைய’ என்று பொருள்பட்டாலும், தொடர்ந்து வரும் மூத்த மகன்களுடனான வேறுபாடு இங்கு குடும்பத்தின் இளைய மகனைக் குறிக்கிறது. முன்னிலைச் சொல்லின் குறிப்பைத் தெளிவாக்க யெகோராமின் பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரசுரிமைத் தொடர்ச்சியில் ஒருவரின் இடத்தை மற்றொருவர் ஏற்றுக்கொள்வதைத் துல்லியமாகக் காட்டுகிறது.
- source_word: כָל הָרִאשֹׁנִים
  choice: மூத்த மகன்கள் எல்லாரையும்
  rationale: சொல்லுக்கு நேராக ‘முந்தியவர்கள் எல்லாரும்’ என்றாலும், இளைய மகனைப் பற்றிய உடனடிச் சூழலில் அவனுக்கு மூத்த மகன்களையே குறிக்கிறது.
- source_word: הַגְּדוּד
  choice: கொள்ளைக்கூட்டம்
  rationale: גדוד என்பது படைக்கூட்டம் அல்லது தாக்கிக் கொள்ளையிடும் கூட்டத்தைக் குறிக்கலாம்; இச்சூழலில் ‘கொள்ளைக்கூட்டம்’ அதன் இராணுவத் தாக்குதல் சார்ந்த பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַבָּא בָעַרְבִים לַמַּחֲנֶה
  choice: அரபியர்களோடு பாளயத்திற்குள் வந்த
  rationale: ב என்ற முன்னிடைச்சொல் இங்கு உடன்சேர்க்கைப் பொருளில் புரிந்துகொள்ளப்பட்டு, לַמַּחֲנֶה தாக்குதலின் இலக்கான பாளயத்திற்குள் வந்ததைச் சுட்டுகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הָרַג
  choice: கொன்றுபோட்டிருந்தது
  rationale: அகசியாவை அரசனாக்குவதற்கு முன்பே நிகழ்ந்த கொலைதான் அதற்கான காரணம் என்பதைத் தமிழின் நிறைவுற்ற இறந்தகால வடிவம் தெளிவாக்குகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசனானான்
  rationale: இங்கு வினை அரசாட்சியின் தொடக்கத்தைச் சுருக்கமாக அறிவிக்கிறது; ‘அரசனானான்’ accession பொருளைத் தருவதோடு முந்தைய காரணவினையிலிருந்து வேறுபடுகிறது.
