  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
translation:
  language: ta
  text: 'ஆனால் அரசரின் மகளான யெகோஷபியாத், அகசியாவின் மகன் யோவாசை எடுத்துக்கொண்டு, கொல்லப்பட்டுக் கொண்டிருந்த அரசரின் மகன்களின் நடுவிலிருந்து[a] அவனை இரகசியமாகக் கொண்டுபோனாள். பிறகு அவனையும் அவனுக்குப் பாலூட்டிய செவிலியையும் படுக்கையறையில்[b] வைத்தாள். அரசர் யெகோராமின் மகளும் அர்ச்சகர் யெகோயாதாவின் மனைவியுமான யெகோஷபியாத், அகசியாவின் சகோதரியாக இருந்ததால், யோவாசை அத்தாலியாவிடமிருந்து மறைத்துவைத்தாள்; அவன் கொல்லப்படவில்லை.[c]


    [a] அல்லது, “கொல்லப்படவிருந்த அரசரின் மகன்களின் நடுவிலிருந்து.”


    [b] எபிரெய மொழியில், “படுக்கைகளின் அறையில்.”


    [c] எபிரெய மொழியில் இறுதி வினையின் பெண்பால் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. சூழலின்படி அது பெரும்பாலும் அத்தாலியாவைக் குறிக்கிறது: யெகோஷபியாத் யோவாசை மறைத்ததால் அத்தாலியா அவனைக் கொல்லவில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொல்லப்படவிருந்த அரசரின் மகன்களின் நடுவிலிருந்து.”
    reason: הַמּוּמָתִים என்பது இச்சூழலில் நிகழ்ந்துகொண்டிருந்த கொலையையோ உடனடியாக நிகழவிருந்த கொலையையோ குறிக்கக்கூடும்.
  - marker: b
    text: எபிரெய மொழியில், “படுக்கைகளின் அறையில்.”
    reason: மூல மொழியின் நேரடிச் சொற்றொடரைத் தருகிறது; முதன்மை உரையில் அதன் இயல்பான தமிழ் பொருள் பயன்படுத்தப்பட்டுள்ளது.
  - marker: c
    text: 'எபிரெய மொழியில் இறுதி வினையின் பெண்பால் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படவில்லை. சூழலின்படி அது பெரும்பாலும் அத்தாலியாவைக் குறிக்கிறது: யெகோஷபியாத் யோவாசை மறைத்ததால் அத்தாலியா அவனைக் கொல்லவில்லை.'
    reason: இறுதி பெண்பால் வினையின் எழுவாய் குறித்த இலக்கண மறைநிலையையும், சூழல் சார்ந்த முதன்மை வாசிப்பையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: எடுத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்தல்’ என்பதைக் காக்கிறது; ‘மீட்டாள்’ என்று சூழலின் விளக்கத்தைச் சொல்லுக்குள் சேர்க்கவில்லை.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: அவனை இரகசியமாகக் கொண்டுபோனாள்
  rationale: גנב இங்கு குழந்தையை மறைவாக அப்புறப்படுத்திய செயலைக் குறிக்கிறது. தமிழில் ‘அவனைத் திருடினாள்’ என்பது தவறான குற்றச்செயல் நிழற்பொருளை அதிகப்படுத்தக்கூடும்; தேர்ந்த வடிவம் இரகசியத் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: கொல்லப்பட்டுக்கொண்டிருந்த அரச குமாரர்களின் நடுவிலிருந்து
  rationale: הַמּוּמָתִים என்ற காரணவினைப் பொருள் கொண்ட நிகழ்காலப் பங்கேற்பு வடிவம், அவர்கள் கொல்லப்படும் நிகழ்வின் நடுவிலிருந்த உடனடி ஆபத்தை வெளிப்படுத்துகிறது. ‘கொல்லப்படவிருந்த’ என்பது அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
- source_word: מֵינִקְתּוֹ
  choice: அவனுக்குப் பாலூட்டிய செவிலி
  rationale: இந்தப் பெயர்ச்சொல் குழந்தைக்குப் பாலூட்டும் பெண்ணைக் குறிப்பாகக் குறிக்கிறது; பொதுவான ‘செவிலி’ என்பதைவிட மூலத்தின் பொருளைத் தெளிவாக அளிக்கிறது.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: படுக்கையறையில்
  rationale: சொல்லுக்கு சொல் ‘படுக்கைகளின் அறை’; ‘படுக்கையறை’ என்பது அதற்கான இயல்பான நவீனத் தமிழ் இணை.
- source_word: וַתַּסְתִּירֵהוּ
  choice: மறைத்துவைத்தாள்
  rationale: סתר என்பதன் ‘மறைத்தல்/ஒளித்துவைத்தல்’ பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֵשֶׁת יְהוֹיָדָע הַכֹּהֵן
  choice: அர்ச்சகர் யெகோயாதாவின் மனைவி
  rationale: யெகோஷபியாத்தின் குடும்ப மற்றும் சமயத் தொடர்பைச் சொல்லும் மூலத்தின் அடையாளக் குறிப்பை முழுமையாகக் காக்கிறது.
- source_word: כִּי הִיא הָיְתָה אֲחוֹת אֲחַזְיָהוּ
  choice: அகசியாவின் சகோதரியாக இருந்ததால்
  rationale: כִּי தரும் காரணத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: அத்தாலியாவிடமிருந்து
  rationale: ‘அத்தாலியாவின் முன்னிலையிலிருந்து’ என்ற சொல்லடிப் பொருளை, அவளது பார்வைக்கும் கைக்கும் எட்டாதபடி மறைத்தல் என்ற சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וְלֹא הֱמִיתָתְהוּ
  choice: ஆகவே அவள் அவனைக் கொல்லவில்லை
  rationale: இறுதி பெண்பால் எழுவாய் மூலத்தில் பெயரிட்டு வெளிப்படுத்தப்படாததால் ‘அவள்’ என வைத்துப் பொருள் மயக்கத்தைப் பாதுகாக்கிறது; ‘ஆகவே’ சூழலில் விளையும் முடிவுத் தொடர்பை உணர்த்துகிறது.
theological_decisions:
- issue: וְלֹא הֱמִיתָתְהוּ என்ற இறுதி வினையின் எழுவாய்
  choice: முதன்மை உரையில் ‘அவள்’ என்ற மறைசுட்டைத் தக்கவைத்து, அடிக்குறிப்பில் அது பெரும்பாலும் அத்தாலியா என்று விளக்கப்பட்டுள்ளது.
  alternative: எழுவாயை வெளிப்படையாக ‘அத்தாலியா’ என மொழிபெயர்த்தல்; அல்லது யெகோஷபியாத் என்று புரிந்துகொள்ளுதல்.
  rationale: எபிரெய வினை பெண்பால் ஒருமையைக் காட்டினாலும் பெயரை மீண்டும் குறிப்பிடவில்லை. உடனடியான ‘அத்தாலியாவிடமிருந்து’ என்ற தொடரும் நிகழ்ச்சியின் பொருளும் அத்தாலியாவையே வலுவாகச் சுட்டுகின்றன; ஆயினும் இலக்கண ரீதியான மறைநிலையை முதன்மை உரை நீக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், மரியாதைமிக்க கதைநடை பயன்படுத்தப்பட்டுள்ளது. அரச குடும்பத்தைச் சுட்ட ‘அரச குமாரர்கள்’ என்றும், הכהן என்பதற்கு சமயப் பணியைத் தெளிவாகக் காட்ட ‘அர்ச்சகர்’ என்றும் வழங்கப்பட்டுள்ளது. எபிரெயப் பெயர்கள் மூல உச்சரிப்பை அணுகும் வகையில் யெகோஷபியாத், யோவாஸ், அகசியா, யெகோராம், யெகோயாதா, அத்தாலியா என்று ஒலிபெயர்க்கப்பட்டுள்ளன.
