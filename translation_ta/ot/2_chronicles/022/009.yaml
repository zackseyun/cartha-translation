base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/009.yaml
  text: And he sought Ahaziah[a], and they captured him while he was hiding in Samaria, and they brought him to Jehu and put him to death. Then they buried him, for they said, “He is the son of Jehoshaphat[b], who sought Yahweh with all his heart.” And the house of Ahaziah had no power to retain the kingdom.
translation:
  language: ta
  text: அவன் அகசியாவைத் தேடினான். சமாரியாவில் ஒளிந்துகொண்டிருந்த அகசியாவை அவர்கள் பிடித்து, யெகூவிடம் கொண்டுவந்து, கொன்றார்கள்.[a] பின்பு அவர்கள் அவனை அடக்கம் செய்தார்கள். ஏனெனில், “இவன் தன் முழு இதயத்தோடும் யாவேவைத் தேடிய யோசபாத்தின் மகன்” என்று அவர்கள் சொன்னார்கள். அகசியாவின் வம்சத்தாருக்கு அரசாட்சியைத் தக்கவைத்துக்கொள்ளும் வலிமை இல்லை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினை காரணவினை வடிவில் இருப்பதால், சொற்பொருளாக “சாகும்படி செய்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அகசியாவின் வீட்டாருக்கு அரசாட்சியைத் தக்கவைத்துக்கொள்ள வலிமை இல்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: அவன் ... தேடினான்
  rationale: בקש என்பது தேடுதல் அல்லது தேடிக் கண்டுபிடிக்க முயலுதல். எபிரெய உரையில் எழுவாய் மறைமுகமாகவும் வினை ஒருமையிலும் உள்ளது; முந்தைய சூழலில் அது யெகூவையோ அவனது அதிகாரத்தையோ குறிக்கலாம். உரையில் இல்லாத பெயரைச் சேர்க்காமல் ஒருமையைப் பாதுகாக்கிறது.
- source_word: וַיִּלְכְּדֻהוּ
  choice: அவர்கள் ... பிடித்து
  rationale: לכד என்பதன் பொருள் பிடித்தல் அல்லது கைப்பற்றுதல். எபிரெய வினையின் பன்மை எழுவாய் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: מִתְחַבֵּא
  choice: ஒளிந்துகொண்டிருந்த
  rationale: ஹித்பயேல் நிகழ்காலப் பெயரெச்சம், அகசியா தொடர்ந்து மறைந்திருந்த நிலையைக் காட்டுகிறது.
- source_word: בְשֹׁמְרוֹן
  choice: சமாரியாவில்
  rationale: ב இங்கு இடத்தைக் குறிக்கிறது; நவீன தமிழில் இயல்பான இடப்பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיְבִאֻהוּ אֶל־יֵהוּא
  choice: யெகூவிடம் கொண்டுவந்து
  rationale: ஹிஃபீல் வடிவிலுள்ள בוא, ஒருவரை இன்னொருவரிடம் கொண்டுவருதல் என்ற பொருளைத் தருகிறது.
- source_word: וַיְמִתֻהוּ
  choice: கொன்றுபோட்டார்கள்
  rationale: מות என்பதன் காரணவினை வடிவம் ‘சாகும்படி செய்தார்கள்’ என்பதைக் குறிக்கிறது. ‘கொன்றுபோட்டார்கள்’ என்பது அதைப் பொதுமக்களுக்கு இயல்பான தமிழில் தெரிவிக்கிறது; ‘மரண தண்டனை நிறைவேற்றினார்கள்’ என்ற அதிகக் குறிப்பான சட்டப் பொருளைத் தவிர்க்கிறது.
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவனை அடக்கம் செய்தார்கள்
  rationale: קבר என்பதற்கான இயல்பான, கண்ணியமான நவீனத் தமிழ் நடை.
- source_word: כִּי אָמְרוּ
  choice: ஏனெனில் ... என்று அவர்கள் சொன்னார்கள்
  rationale: כִּי இங்கு அவனை அடக்கம் செய்ததற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: בֶּן־יְהוֹשָׁפָט הוּא
  choice: இவன் ... யோசபாத்தின் மகன்
  rationale: வினைச்சொல் இல்லாத எபிரெய வாக்கியத்தின் நேரடிப் பேச்சு உடனடித்தன்மையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר דָּרַשׁ אֶת־יְהוָה
  choice: யாவேவைத் தேடிய
  rationale: דרש என்பது இங்கு கடவுளை பக்தியோடும் சார்போடும் நாடுதலைக் குறிக்கிறது. ‘தேடிய’ என்பது மூல உருவகத்தையும் கருத்தையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பு வடிவத்தில் தருகிறது.
- source_word: בְּכָל־לְבָבוֹ
  choice: தன் முழு இதயத்தோடும்
  rationale: முழுமனதான அர்ப்பணிப்பைக் குறிக்கும் உடன்படிக்கைச் சொற்றொடரின் இதய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: וְאֵין לְבֵית אֲחַזְיָהוּ לַעְצֹר כֹּחַ לְמַמְלָכָה
  choice: அகசியாவின் வம்சத்தாருக்கு அரசாட்சியைத் தக்கவைத்துக்கொள்ளும் வலிமை இல்லை
  rationale: בית என்பதன் அரச வம்சப் பொருளையும், עצר כח என்பதன் வலிமையை நிலைநிறுத்துதல் அல்லது தக்கவைத்தல் என்ற கருத்தையும் வெளிப்படுத்துகிறது; இறுதித் தொடரின் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரையே பயன்படுத்துகிறது. ‘யாவே’ அதை பெயராகவே பாதுகாக்கிறது.
- issue: அகசியாவின் வீட்டாரைப் பற்றிய இறுதித் தொடரின் பொருள்
  choice: அரசாட்சியைத் தக்கவைத்துக்கொள்ளும் வம்ச வலிமை அவர்களுக்கு இல்லை
  alternative: அரசாளும் வலிமையுள்ள ஒருவர் அகசியாவின் வம்சத்தில் இல்லை
  rationale: לַעְצֹר כֹּחַ לְמַמְלָכָה என்ற சுருக்கமான எபிரெய தொடர் அரச அதிகாரத்தை நிலைநிறுத்தும் திறன் என்றும், அரசாளத் தகுந்த வலிமையுள்ள ஒருவரின் இல்லாமை என்றும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை வம்சத்தின் இயலாமையை முன்னிறுத்துகிறது; தனிநபரை மையப்படுத்தும் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை எழுவாயிலிருந்து பன்மைச் செயற்பாட்டாளர்களுக்கு மாறும் எபிரெய உரையின் திடீர் மாற்றம் பாதுகாக்கப்பட்டுள்ளது. ‘வம்சத்தார்’ என்பது அரசகுடியைக் குறிக்கும் בית என்பதின் சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
