  text: וַ/יָּ֜שָׁב לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל כִּ֤י הַ/מַּכִּים֙ אֲשֶׁ֣ר הִכֻּ֣/הוּ בָֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/עֲזַרְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יְהוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּי חֹלֶ֥ה הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
translation:
  language: ta
  text: அவன் அராம் அரசனான அசாயேலுக்கு எதிராகப் போரிட்டபோது, ராமாவில் அவர்கள் அவனுக்கு ஏற்படுத்திய காயங்களிலிருந்து குணமடைவதற்காக யெஸ்ரயேலுக்குத் திரும்பினான். யூதாவின் அரசனான யெகோராமின் மகன் அசரியா[a], ஆகாபின் மகன் யெகோராமைப் பார்ப்பதற்காக[b] யெஸ்ரயேலுக்குக் கீழே சென்றான்; ஏனெனில் அவன் நோயுற்றிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு நாளாகம நூலின் எபிரெய உரையில் எழுதப்பட்டுள்ள பெயர் ‘அசரியா’; இதே அரசன் வேறு இடங்களில் ‘அகசியா’ என்று அழைக்கப்படுகிறான்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘சந்திப்பதற்காக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பினான்
  rationale: שוב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதையும் எபிரெயக் கதையோட்டத்தின் தொடர்ச்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: לְהִתְרַפֵּא
  choice: குணமடைவதற்காக
  rationale: רפא என்பதன் ஹித்பயேல் வடிவம் இங்கே காயங்களிலிருந்து மீண்டு குணமடைவதைக் குறிக்கிறது; இது இயல்பான நவீனத் தமிழ்.
- source_word: כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ
  choice: அவர்கள் அவனுக்கு ஏற்படுத்திய காயங்களிலிருந்து
  rationale: מַכִּים என்பது அடிகள் அல்லது அவற்றால் ஏற்பட்ட காயங்கள் எனப் பொருள்படலாம். குணமடைதல் என்ற சூழலில் ‘காயங்கள்’ இயல்பானது; எபிரெயத்தில் குறிப்பிடப்படாத பன்மைச் செய்பவரை ‘அவர்கள்’ எனத் தக்கவைக்கிறது.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: அவன் அராம் அரசன் அசகேலுடன் போரிட்டபோது
  rationale: ב + வினையெச்ச அமைப்பின் காலச்சூழலை ‘போரிட்டபோது’ எனத் தெளிவாகத் தருகிறது; לחם உடன் வரும் אֶת இங்கே எதிர்த்துப் போரிடும் உறவைக் குறிக்கிறது.
- source_word: וַעֲזַרְיָהוּ
  choice: அசரியா
  rationale: WLC உரையில் இவ்வசனத்தில் உள்ள עֲזַרְיָהוּ என்ற பெயரை இணை வசனங்களோடு ஒத்திசைத்து மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יָרַד
  choice: சென்றான்
  rationale: ירד என்பதற்கு சொற்பட ‘கீழே சென்றான்’ என்றாலும், தமிழில் இங்கு வெறும் பயணத்தைக் குறிக்க ‘சென்றான்’ இயல்பாக உள்ளது; புவியியல் திசையைத் தேவையின்றி வலியுறுத்துவதில்லை.
- source_word: לִרְאוֹת
  choice: பார்ப்பதற்காக
  rationale: ראה என்பதன் நேரடிப் பொருளைப் பிரதான உரையில் பாதுகாக்கிறது; சூழலுக்கேற்ற ‘சந்திப்பதற்காக’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי חֹלֶה הוּא
  choice: ஏனெனில் யெகோராம் நோயுற்றிருந்தான்
  rationale: כִּי என்பதன் காரணப் பொருளையும் חֹלֶה என்பதன் நோயுற்ற நிலைமையையும் தெளிவான தமிழில் தருகிறது; தமிழில் சுட்டுப்பெயர் ஏற்படுத்தக்கூடிய குழப்பத்தைத் தவிர்க்க பெயர் மீண்டும் பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: நாளாகம நூலில் அரசனின் பெயர் மாறுபடுவது
  choice: பிரதான உரையில் ‘அசரியா’ என்று வைப்பது
  alternative: அகசியா
  rationale: இவ்வசனத்தின் எபிரெய மூல உரை עֲזַרְיָהוּ என்று வாசிக்கிறது. இணை இடங்களோடு அமைதியாக ஒத்திசைக்காமல் மூல வடிவம் பாதுகாக்கப்படுகிறது; வேறு இடங்களில் காணப்படும் பெயர் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அரசப் பட்டங்கள் இயல்பான தமிழ் வரிசையில் அமைக்கப்பட்டுள்ளன. பெயர்கள் எபிரெய வடிவங்களுக்கு அண்மையான, வாசிக்க ஏற்ற தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன. மூல உரையின் பெயர் மாறுபாடும் ‘பார்த்தல்/சந்தித்தல்’ என்ற சொற்பொருள் நுணுக்கமும் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
