  text: וַ/יְהִ֤י אִתָּ/ם֙ בְּ/בֵ֣ית הָֽ/אֱלֹהִ֔ים מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֖ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
translation:
  language: ta
  text: அவன் அவர்களுடன் கடவுளின் இல்லத்தில்[b] ஆறு ஆண்டுகள் ஒளிந்திருந்தான்[a]; அக்காலத்தில் அத்தாலியாள் நாட்டை ஆண்டுகொண்டிருந்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மறைத்து வைக்கப்பட்டிருந்தான்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேயப் பெயரெச்சம் அவன் தானே ஒளிந்திருந்ததையோ, சூழலின்படி அவன் மறைக்கப்பட்ட நிலையில் இருந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ஆலய வளாகத்தில்; சொல்லர்த்தமாக, ‘கடவுளின் இல்லத்தில்.’
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי אִתָּם
  choice: அவன் அவர்களுடன் இருந்தான்
  rationale: היה என்பதன் தொடர்நிலைச் சூழலும் אִתָּם என்பதன் ‘அவர்களுடன்’ என்ற நேரடிப் பொருளும் காக்கப்படுகின்றன; தமிழில் முழு வாக்கியத்தோடு இயல்பாக அமைய ‘ஒளிந்திருந்தான்’ என்பதுடன் இணைக்கப்பட்டுள்ளது.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: கடவுளின் இல்லத்தில்
  rationale: ‘கடவுளின் வீடு/இல்லம்’ என்ற எபிரேயச் சொல்லாட்சியைப் பாதுகாக்கிறது; இச்சூழலில் அது ஆலயத்தையும் அதன் வளாகத்தையும் குறிக்கிறது.
- source_word: מִתְחַבֵּא
  choice: ஒளிந்திருந்தான்
  rationale: Hitpael நிகழ்காலப் பெயரெச்சத்தின் நீடித்த, தற்சார்பு/இடைநிலைப் பொருளை இயல்பான தமிழில் தருகிறது; ‘மறைத்து வைக்கப்பட்டிருந்தான்’ என்ற சூழல்சார் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שֵׁשׁ שָׁנִים
  choice: ஆறு ஆண்டுகள்
  rationale: கால நீட்சியைத் தமிழில் இயல்பாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  choice: அக்காலத்தில் அத்தாலியாள் ... ஆண்டுகொண்டிருந்தாள்
  rationale: பெண்பால் ஒருமை நிகழ்காலப் பெயரெச்சம் குறிக்கும் தொடர்ச்சியான ஆட்சியையும், முந்தைய செயலுடன் ஒரே காலத்தில் நடந்ததையும் வெளிப்படுத்துகிறது.
- source_word: עַל הָאָרֶץ
  choice: நாட்டை
  rationale: இங்கு הָאָרֶץ என்பது உலகத்தை அல்ல, யூதாவின் நிலப்பரப்பு/அரசாட்சிப் பகுதியைக் குறிக்கிறது; ‘நாடு’ சூழலுக்கு இயல்பானது, ஆனால் ‘அரசு’ என மிகையாகக் குறிப்பாக்கவில்லை.
theological_decisions:
- issue: மִתְחַבֵּא என்பதன் தற்சார்பு அல்லது மறைக்கப்பட்ட நிலை
  choice: முதன்மை உரையில் ‘ஒளிந்திருந்தான்’
  alternative: ‘மறைத்து வைக்கப்பட்டிருந்தான்’
  rationale: Hitpael வடிவம் தற்சார்பு அல்லது இடைநிலை உணர்வை ஆதரிக்கிறது; முந்தைய சூழலில் பிறர் அவனை மறைத்ததால் செயப்பாட்டு உணர்வும் முற்றிலும் விலக்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அத்தாலியாள்’ என்ற பெண்பால் பெயர்வடிவமும் ‘ஆண்டுகொண்டிருந்தாள்’ என்ற தொடர்நிலை வினையும் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
