base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
translation:
  language: ta
  text: இதோ, மரம் வெட்டுகிறவர்களுக்கு—மரங்களை வெட்டுகிற உமது பணியாளர்களுக்கு—நான் இருபதாயிரம் கோர் இடித்த கோதுமையையும்[a], இருபதாயிரம் கோர் வாற்கோதுமையையும், இருபதாயிரம் பாத் திராட்சரசத்தையும், இருபதாயிரம் பாத் எண்ணெயையும் கொடுத்திருக்கிறேன்.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இடித்த கோதுமை” என்பதற்கான எபிரெயத் தொடர் அரிதானது; “உணவுக்கான கோதுமை” அல்லது “நசுக்கிய கோதுமை” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: கோர் என்பது பண்டைய உலர் கொள்ளளவு அலகு.
    reason: cultural_note
  - marker: c
    text: பாத் என்பது பண்டைய திரவக் கொள்ளளவு அலகு.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: இணைப்பையும் கவனத்தை ஈர்க்கும் הִנֵּה என்பதன் உரையாடல் வலிமையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  choice: மரம் வெட்டுகிறவர்களுக்கு—மரங்களைத் தறிக்கிற உமது பணியாளர்களுக்கு
  rationale: எபிரெயத்தில் உள்ள ஒன்றுக்கொன்று நெருக்கமான இரு செயப்பெயர் தொடர்களையும் அழிக்காமல், இரண்டாவது தொடர் முதல் குழுவை விளக்குவதாகத் தமிழில் அமைக்கிறது.
- source_word: נָתַתִּי
  choice: கொடுத்திருக்கிறேன்
  rationale: கடிதச் சூழலில் ஏற்கெனவே உறுதிசெய்யப்பட்ட ஏற்பாட்டைக் குறிக்கும் எபிரெய நிறைவுவினையைத் தமிழின் நிகழ்நிலை நிறைவு வடிவில் தருகிறது.
- source_word: חִטִּים מַכּוֹת
  choice: இடித்த கோதுமை
  rationale: அரிதான மַכּוֹת என்ற சொல்லை உணவுக்காக இடித்தோ பதப்படுத்தியோ உள்ள கோதுமை எனச் சூழலுக்கு ஏற்றவாறு தருகிறது; உறுதியின்மையை அடிக்குறிப்பில் காக்கிறது.
- source_word: לַעֲבָדֶיךָ
  choice: உமது பணியாளர்களுக்கு
  rationale: இவர்கள் இச்சூழலில் மரம் வெட்டும் தொழிலாளர்கள் என்பதால், அடிமைத்தன்மையைத் தேவையின்றி வலியுறுத்தாத ‘பணியாளர்கள்’ இயல்பான தேர்வு.
- source_word: כֹּרִים
  choice: கோர்
  rationale: ஊகமான நவீன அலகு மாற்றத்தைத் தவிர்த்து, பண்டைய உலர் கொள்ளளவு அலகை ஒலிபெயர்க்கிறது.
- source_word: בַּתִּים
  choice: பாத்
  rationale: பண்டைய திரவக் கொள்ளளவு அலகை ஒலிபெயர்த்து மூலப் பண்பாட்டு அளவைப் பாதுகாக்கிறது.
- source_word: שְׂעֹרִים
  choice: வாற்கோதுமை
  rationale: பார்லி தானியத்துக்கான புரியத்தக்க செந்தரத் தமிழ்ச் சொல்லைப் பயன்படுத்துகிறது.
- source_word: יַיִן
  choice: திராட்சரசம்
  rationale: יַיִן என்பதன் வழக்கமான பொருளை நவீன தரமான தமிழில் தெளிவாகத் தருகிறது.
- source_word: שֶׁמֶן
  choice: எண்ணெய்
  rationale: மூலத்தில் ஒலிவ எண்ணெய் என்று குறிப்பாகச் சொல்லப்படாததால் பொதுவான சொல்லையே காக்கிறது.
- source_word: עֶשְׂרִים אֶלֶף
  choice: இருபதாயிரம்
  rationale: ஒவ்வொரு பொருளுக்கும் தரப்பட்ட எண்ணிக்கையை நேரடியாகப் பாதுகாக்கிறது.
