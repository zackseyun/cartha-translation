translation_notes:
  register: நவீன செந்தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. எபிரெயத்தின் இரட்டை மரவெட்டுச் சொல்லாக்கம் கோடிட்ட விளக்க அமைப்பில் பாதுகாக்கப்பட்டுள்ளது. அளவைகள் மாற்றமின்றி ஒலிபெயர்க்கப்பட்டு, அவற்றின் தன்மை அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளது.
