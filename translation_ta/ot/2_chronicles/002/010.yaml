source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר חוּרָ֤ם מֶֽלֶךְ צֹר֙ בִּ/כְתָ֔ב וַ/יִּשְׁלַ֖ח אֶל שְׁלֹמֹ֑ה בְּ/אַהֲבַ֤ת יְהוָה֙ אֶת עַמּ֔/וֹ נְתָנְ/ךָ֥ עֲלֵי/הֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
translation:
  language: ta
  text: 'பின்பு தீருவின் அரசன் ஊராம்[a], சாலொமோனுக்கு அனுப்பிய கடிதத்தில் இவ்வாறு பதிலளித்தான்[c]: “யாவே தம் மக்கள்மீது கொண்டுள்ள அன்பினால்[b], உம்மை அவர்கள்மேல் அரசனாக வைத்திருக்கிறார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஊராம்’; மரபாக ‘ஈராம்’ என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தம் மக்கள்மேல் யாவே கொண்ட அன்பின் காரணமாக.”
    reason: lexical_alternative
  - marker: c
    text: இன்னும் சொற்சார்பாக, “ஒரு கடிதத்தில் கூறி, அதைச் சாலொமோனுக்கு அனுப்பினான்.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பின்பு … பதிலளித்தான்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுக்கிறது. முந்தைய சூழலில் இது சாலொமோனின் வேண்டுகோளுக்கான பதில் என்பதால், ‘பதிலளித்தான்’ என்பது இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: חוּרָם
  choice: ஊராம்
  rationale: இவ்வசனத்தின் எபிரெய வடிவமான חוּרָם என்பதைக் நேரடியாகத் தமிழில் ஒலிபெயர்க்கிறது; மரபாக அறியப்படும் ‘ஈராம்’ வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֶלֶךְ צֹר
  choice: தீருவின் அரசன்
  rationale: இணைப்புநிலைத் தொடர் ஊராமின் ஆட்சிப் பதவியையும் நாட்டையும் நேரடியாகக் குறிக்கிறது.
- source_word: בִּכְתָב
  choice: கடிதத்தில்
  rationale: எழுத்து அல்லது எழுத்து ஆவணம் என்னும் பொருளை, அதைச் சாலொமோனுக்கு அனுப்பியதாக வரும் சூழலில் ‘கடிதம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁלַח אֶל שְׁלֹמֹה
  choice: சாலொமோனுக்கு அனுப்பிய
  rationale: இரண்டாவது வினையைத் தமிழில் சார்புத்தொடராக அமைப்பது, கடிதமே அனுப்பப்பட்ட பொருள் என்பதைத் தெளிவாக்கி தேவையற்ற மறுகூற்றைத் தவிர்க்கிறது.
- source_word: בְּאַהֲבַת
  choice: கொண்டுள்ள அன்பினால்
  rationale: ב முன்னொட்டுடன் வரும் ‘அன்பு’ என்ற கருத்துப்பெயர் இங்கு காரணத்தைக் குறிக்கலாம். பெயர்ச்சொல் அமைப்பின் சுவையைத் தக்கவைத்தபடி தமிழில் காரண உறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עַמּוֹ
  choice: தம் மக்கள்
  rationale: ஒருமை மூன்றாம் நபர் பின்னொட்டு யாவேயைக் குறிக்கிறது; ‘தம்’ என்பது தமிழில் தெளிவான மரியாதைத் தற்சுட்டாக உள்ளது.
- source_word: נְתָנְךָ
  choice: உம்மை … வைத்திருக்கிறார்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு/வை’ என்பதையும், ஒருவரை அரசராக நிலைநிறுத்தும் இச்சூழலையும் ‘வைத்திருக்கிறார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: அவர்கள்மேல் அரசனாக
  rationale: על உடன் வரும் מלך, மக்கள்மேல் செலுத்தும் அரசாட்சியைச் சுருக்கமாகவும் நேரடியாகவும் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலவசனம் தெய்வீகத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டமாக மாற்றாமல் பாதுகாக்கும் ஒலிபெயர்ப்பு.
- issue: யாவேயின் அன்புக்கும் சாலொமோனின் அரசாட்சிக்கும் உள்ள உறவு
  choice: அன்பினால் — காரண உறவு
  alternative: தம் மக்கள்மீது யாவே கொண்ட அன்பில்
  rationale: בְּאַהֲבַת என்ற அமைப்பு காரணத்தையோ அன்பின் அடிப்படையிலான செயலையோ குறிக்கலாம். முதன்மை உரை இயல்பான காரண வாசிப்பைத் தருகிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. அரசனிடம் நேரடியாகச் சொல்லப்படும் உரையில் ‘உம்மை’ என்றும், கடவுளைக் குறிக்கும் வினையில் மரியாதை ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரு வினைகளை இயல்பான தமிழுக்காக சார்புத்தொடராக அமைத்தாலும், சொற்சார்ந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
