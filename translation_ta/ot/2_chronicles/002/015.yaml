  text: וַ֠/אֲנַחְנוּ נִכְרֹ֨ת עֵצִ֤ים מִן הַ/לְּבָנוֹן֙ כְּ/כָל צָרְכֶּ֔/ךָ וּ/נְבִיאֵ֥/ם לְ/ךָ֛ רַפְסֹד֖וֹת עַל יָ֣ם יָפ֑וֹ וְ/אַתָּ֛ה תַּעֲלֶ֥ה אֹתָ֖/ם יְרוּשָׁלִָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
translation:
  language: ta
  text: நாங்கள் உமக்குத் தேவையான அளவுக்கு லெபனோனிலிருந்து மரங்களை வெட்டி, அவற்றை மரத்தெப்பங்களாகக் கட்டிக் கடல்வழியாக யாப்போவுக்குக் கொண்டுவருவோம்[a]; நீர் அவற்றை எருசலேமுக்கு மேலே கொண்டுசெல்வீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: யாப்போ என்பது பின்னாளில் யாப்பா என அறியப்பட்ட கடல்துறைமுகம்.
    reason: cultural_note
  - marker: b
    text: எபிரெயத்தில், “அவற்றை எருசலேமுக்கு மேலே கொண்டுசெல்வீர்.” “மேலே” என்பது எருசலேமின் உயரமான நிலப்பரப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרֹת עֵצִים
  choice: மரங்களை வெட்டி
  rationale: כרת என்பதன் Qal வடிவம் மரங்களைக் குறிக்கும் இச்சூழலில் ‘வெட்டு’ எனப் பொருள்படும்; עֵצִים கட்டுமானத்திற்கான மரப்பொருளைக் குறித்தாலும், ‘மரங்களை வெட்டி’ என்பது தமிழில் இயல்பாகவும் மூலத்தின் பன்மையைத் தக்கவைத்தும் உள்ளது.
- source_word: מִן הַלְּבָנוֹן
  choice: லெபனோனிலிருந்து
  rationale: நன்கு அறியப்பட்ட லெபனோன் மலைக்காடுப் பகுதியிலிருந்து மரம் பெறப்படுவதை நேரடியாகக் காட்டுகிறது.
- source_word: כְּכָל צָרְכֶּךָ
  choice: உமக்குத் தேவையான அளவுக்கு
  rationale: சாலொமோனின் முழுத் தேவைக்கேற்ற அளவைச் சுட்டும் எபிரெயச் சொல்லாக்கத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּנְבִיאֵם לְךָ
  choice: அவற்றை ... கொண்டுவருவோம்
  rationale: எபிரெய மூலத்தில் உள்ள பன்மைச் சுட்டுப்பெயரைத் தக்கவைத்து, வெட்டப்பட்ட மரங்களைக் குறிக்கிறது.
- source_word: רַפְסֹדוֹת
  choice: தோணிகளாகக் கட்டி
  rationale: இச்சொல் ஒன்றாகப் பிணைக்கப்பட்டு மிதக்கவிடப்படும் மரக்கட்டுத் தொகுதிகளைக் குறிக்கிறது; ‘தோணிகளாகக் கட்டி’ என்பது அவை போக்குவரத்திற்காக மிதக்கும் கட்டுகளாக்கப்பட்டதைத் தெளிவுபடுத்துகிறது.
- source_word: עַל יָם יָפוֹ
  choice: கடல்வழியாக ... யாப்போவுக்கு
  rationale: கடல் போக்குவரத்தையும் அதன் இலக்கான யாப்போ துறைமுகத்தையும் இயல்பான தமிழ்ச் சொல்லமைப்பில் தருகிறது.
- source_word: יָפוֹ
  choice: யாப்போ
  rationale: எபிரெயப் பெயரின் ஒலியை நெருக்கமாகப் பின்பற்றும் தமிழ் வேதாகமப் பெயர்ப்பு வடிவம்.
- source_word: תַּעֲלֶה אֹתָם
  choice: அவற்றை ... மேலே கொண்டுசெல்ல வேண்டும்
  rationale: עלה என்பதிலுள்ள ‘மேலே ஏற்றிச் செல்லுதல்’ என்ற திசைநுட்பத்தைத் தக்கவைக்கிறது; எருசலேமின் உயரமான நிலப்பரப்பையும் இது பிரதிபலிக்கிறது.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேம்
  rationale: தமிழில் நிலைபெற்றுள்ள வேதாகம இடப்பெயர் வடிவம்.
