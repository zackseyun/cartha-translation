  text: וַ/יֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְ/דָוִ֨יד הַ/מֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּ/בִינָ֔ה אֲשֶׁ֤ר יִבְנֶה בַּ֨יִת֙ לַ/יהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
translation:
  language: ta
  text: அப்போது ஊராம்[a], “வானங்களையும் பூமியையும் உண்டாக்கிய இஸ்ரவேலின் கடவுளாகிய யாவே போற்றப்படுவாராக! விவேகமும் புரிந்துணர்வும் கொண்ட[b] ஞானமுள்ள ஒரு மகனைத் தாவீது அரசருக்குக் கொடுத்திருக்கிறார். அவன் யாவேக்காக ஒரு வீட்டையும், தன் அரசாட்சிக்காக ஒரு வீட்டையும்[c] கட்டுவான்” என்று சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதே அரசன் 1 அரசர்கள் நூலின் இணையான பதிவில் ‘ஈராம்’ என்று அழைக்கப்படுகிறார்; இங்கே நாளாகமத்தின் எபிரெய வடிவம் ‘ஊராம்’ என்பதாகும்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயச் சொற்றொடரை “விவேகத்தையும் புரிந்துணர்வையும் அறிந்தவன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: நேர்ச்சொல்லாக, “தன் அரசாட்சிக்காக ஒரு வீடு”; இது அரச அரண்மனையையோ அரண்மனை வளாகத்தையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்று சொன்னான்
  rationale: வாவ் தொடர் வடிவம் கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; இச்சொற்றொடர் அந்த வரிசையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: חוּרָם
  choice: ஊராம்
  rationale: நாளாகமத்தில் உள்ள חוּרָם என்ற எபிரெயப் பெயரின் வடிவத்தையே பின்பற்றுகிறது; அரசர்கள் நூலிலுள்ள ‘ஈராம்’ வடிவத்துடன் ஒத்திசைக்கவில்லை.
- source_word: בָּרוּךְ יְהוָה
  choice: யாவே போற்றப்படுவாராக
  rationale: ஆசீர்வாத/துதிப்பு வாய்பாட்டின் வேண்டுதல் நயத்தை இயல்பான, கண்ணியமான தமிழில் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெய இணைப்புநிலையைத் தெளிவாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: עָשָׂה אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: வானங்களையும் பூமியையும் உண்டாக்கிய
  rationale: הַשָּׁמַיִם என்பதன் பன்மை வடிவத்தையும் படைப்புச் சொல்லாட்சியையும் பாதுகாக்கிறது.
- source_word: נָתַן לְדָוִיד הַמֶּלֶךְ
  choice: தாவீது அரசருக்குக் கொடுத்திருக்கிறார்
  rationale: நிறைவுற்ற செயல் தற்போதைய முக்கியத்துவம் உடையதாக இருப்பதைத் தமிழின் நிறைவு வடிவம் வெளிப்படுத்துகிறது.
- source_word: בֵּן חָכָם
  choice: ஞானமுள்ள ஒரு மகன்
  rationale: חָכָם என்பதன் அறிவும் நடைமுறைத் திறனும் சேர்ந்த பரந்த பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  choice: விவேகத்தையும் புரிந்துகொள்ளும் திறனையும் உடைய
  rationale: שֵׂכֶל என்பதின் நடைமுறை நுண்ணறிவையும் בִּינָה என்பதின் புரிந்துணர்வையும் வேறுபடுத்திக் காட்டி, தமிழில் இயல்பாக அமைகிறது.
- source_word: בַּיִת לַיהוָה
  choice: யாவேக்காக ஓர் ஆலயம்
  rationale: எபிரெயத்தில் ‘வீடு’ என்றாலும் சூழலில் குறிக்கப்படுவது வழிபாட்டு ஆலயம்; சாதாரண தமிழ் வாசகருக்கு தெளிவாகப் பொருளைத் தருகிறது.
- source_word: בַּיִת לְמַלְכוּתוֹ
  choice: தன் அரசாட்சிக்காக ஓர் அரண்மனை
  rationale: முதல் ‘வீடு’ ஆலயத்தையும் இரண்டாவது அரச ஆட்சிக்குரிய கட்டிடத்தையும் குறிக்கும் சூழல் வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் அரசாட்சி தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: בַּיִת לַיהוָה என்பதின் பொருள்
  choice: யாவேக்காக ஓர் ஆலயம்
  alternative: யாவேக்காக ஒரு வீடு
  rationale: ‘வீடு’ என்பது மூல உருவகம்; இச்சூழலில் சாலொமோன் கட்டவிருக்கும் ஆலயத்தையே தெளிவாகக் குறிக்கிறது. தமிழில் தவறான நேரடி புரிதலைத் தவிர்க்க ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
- issue: בַּיִת לְמַלְכוּתוֹ என்பதின் குறிப்பு
  choice: தன் அரசாட்சிக்காக ஓர் அரண்மனை
  alternative: தன் அரசாட்சிக்காக ஒரு வீடு
  rationale: இது அரசாட்சிக்குரிய அரண்மனை அல்லது அரண்மனை வளாகத்தைக் குறிக்கலாம். முதன்மை உரையில் இயல்பான குறிப்பைத் தந்து, சாத்தியமான பரந்த பொருளை அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வரலாற்று-வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ என்ற பெயர் தொடர்ச்சியாகப் பாதுகாக்கப்பட்டுள்ளது. மூலத்தின் ‘வீடு’ என்ற சொல் தமிழில் தவறாகப் புரியக்கூடிய இடங்களில் ‘ஆலயம்’, ‘அரண்மனை’ எனச் சூழல்படி வழங்கப்பட்டு, நேர்ச்சொல் அடிக்குறிப்பில் தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
