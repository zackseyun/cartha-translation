  to: அப்போது ஊராம்[a], “வானங்களையும் பூமியையும் உண்டாக்கிய இஸ்ரவேலின் கடவுளாகிய யாவே போற்றப்படுவாராக! விவேகமும் புரிந்துணர்வும் கொண்ட[b] ஞானமுள்ள ஒரு மகனைத் தாவீது அரசருக்குக் கொடுத்திருக்கிறார். அவன் யாவேக்காக ஒரு வீட்டையும், தன் அரசாட்சிக்காக ஒரு வீட்டையும்[c] கட்டுவான்” என்று சொன்னான்.
