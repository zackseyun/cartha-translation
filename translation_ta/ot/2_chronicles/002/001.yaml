source:
  edition: WLC
  text: וַ/יִּסְפֹּ֨ר שְׁלֹמֹ֜ה שִׁבְעִ֥ים אֶ֨לֶף֙ אִ֣ישׁ סַבָּ֔ל וּ/שְׁמוֹנִ֥ים אֶ֛לֶף אִ֖ישׁ חֹצֵ֣ב בָּ/הָ֑ר וּ/מְנַצְּחִ֣ים עֲלֵי/הֶ֔ם שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/001.yaml
  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
translation:
  language: ta
  text: சுமை சுமப்பவர்களாக எழுபதாயிரம் ஆண்களையும், மலைப்பகுதியில் வெட்டுகிறவர்களாக[a] எண்பதாயிரம் ஆண்களையும், அவர்களுக்கு மேற்பார்வையாளர்களாக மூவாயிரத்து அறுநூறு பேரையும் சாலொமோன் எண்ணினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “மலையில் வெட்டுகிறவர்கள்.” எதை வெட்டினர் என்பது வெளிப்படையாகக் குறிப்பிடப்படவில்லை; கட்டுமானச் சூழலில் அது கல்லாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: கணக்கிட்டான்
  rationale: ספר என்ற வினை இங்கு தொழிலாளர்களை எண்ணிக் கணக்கிடுவதைக் குறிக்கிறது. ‘கணக்கிட்டான்’ என்பது நவீன தமிழில் இயல்பாகவும், ‘நியமித்தான்’ என்று பொருளை மாற்றாமலும் உள்ளது.
- source_word: אִישׁ ... סַבָּל
  choice: சுமை சுமப்பவர்களாக ... ஆண்களை
  rationale: סַבָּל என்பது சுமையைத் தூக்கிச் செல்பவரைக் குறிக்கிறது; אִישׁ ஆண் தொழிலாளர்களைத் தெளிவாகக் குறிக்கிறது. ‘சுமை சுமப்பவர்கள்’ என்பது சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான தொழிற்பெயர்.
- source_word: חֹצֵב בָּהָר
  choice: மலைப்பகுதியில் கல் வெட்டுபவர்களாக
  rationale: חצב என்பதன் அடிப்படைப் பொருள் ‘வெட்டு/செதுக்கு’; எதை வெட்டினர் என்பது எபிரெயத்தில் வெளிப்படையாகச் சொல்லப்படவில்லை. கட்டுமானத் தொழிலின் சூழலில் ‘கல்’ என்பது நியாயமான உட்பொருள்; בָּהָר-ஐ ‘மலைப்பகுதியில்’ என இயல்பாக மொழிபெயர்த்துள்ளோம். சொல்லுக்குச் சொல் அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  choice: அவர்கள்மேல் மேற்பார்வையாளர்களாக
  rationale: இந்த நிர்வாகச் சூழலில் נצח வேரிலான சொல் பணியை நடத்தி மேற்பார்வையிடுவோரைக் குறிக்கிறது; עֲלֵיהֶם என்பதையும் ‘அவர்கள்மேல்’ என்று வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: மூவாயிரத்து அறுநூறு
  rationale: எண்ணிக்கையைத் துல்லியமாகவும் இயல்பான தமிழ் எண்ணமைப்பிலும் தருகிறது.
- source_word: אִישׁ
  choice: ஆண்கள்
  rationale: மூல எபிரெயச் சொல் இங்குள்ள அரசுப் பணிக்குழுவின் ஆண் தொழிலாளர்களைக் குறிக்கிறது; பாலினத்தைப் பொதுமைப்படுத்தாமல் பாதுகாக்கப்பட்டுள்ளது.
