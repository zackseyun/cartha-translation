source:
  edition: WLC
  text: וְ/עַתָּ֗ה שָׁלַ֧חְתִּי אִישׁ חָכָ֛ם יוֹדֵ֥עַ בִּינָ֖ה לְ/חוּרָ֥ם אָבִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
translation:
  language: ta
  text: இப்போது நான் ஞானமும் புரிந்துகொள்ளும் திறனும் கொண்ட ஒருவனை—ஊராம்-அபியை[a]—அனுப்பியிருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் “ஊராம்-அபி.” இறுதிச் சொல் சொல்லர்த்தமாக “என் தந்தை” எனப் பொருள்படும்; ஆனால் இங்கு அது ஒரு மரியாதைப் பட்டமாகவோ கைவினைஞனின் பெயர் அல்லது அடைமொழியின் பகுதியாகவோ இருக்கலாம். 2 நாளாகமம் 4:16-ஐயும் ஒப்பிடுக.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: இணைப்புச் சொல்லுடன் வரும் கால வினையடை, அரசனுடைய பதிலின் அடுத்த கட்டத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘இப்போது’ இயல்பாக அந்த உரையோட்டத்தைத் தருகிறது.
- source_word: שָׁלַחְתִּי
  choice: அனுப்பியிருக்கிறேன்
  rationale: எபிரேய நிறைவுவினை இச்சூழலில் செய்து முடிக்கப்பட்டும் தற்போது பொருத்தமுடையதுமான செயலைக் குறிக்கிறது; தமிழ் நிகழ்கால நிறைவு வடிவம் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ
  choice: ஒருவனை
  rationale: குறிப்பிட்ட ஓர் ஆண் நபரைக் குறிக்கும் ஆண்பால் ஒருமைச் சொல்லாக இருப்பதால் ‘ஒருவனை’ துல்லியமானது.
- source_word: חָכָם
  choice: ஞானமும் … கொண்ட
  rationale: முதன்மையாக ‘ஞானமுள்ள’ என்று பொருள்படும்; கைவினைச் சூழலில் திறமையையும் உள்ளடக்கலாம். அடுத்த சொற்றொடருடன் இயல்பாக இணைவதற்காக பெயர்ச்சொல் அமைப்பில் தரப்பட்டுள்ளது.
- source_word: יוֹדֵעַ בִּינָה
  choice: புரிந்துகொள்ளும் திறனும் கொண்ட
  rationale: சொல்லர்த்தமாக ‘புரிதலை அறிந்தவன்’; அறிவாற்றலையும் நடைமுறை நுண்திறனையும் உள்ளடக்கும் இயல்பான நவீனத் தமிழ் வடிவம் இது.
- source_word: לְחוּרָם אָבִי
  choice: ஊராம்-அபியை
  rationale: இலக்கணத்திலும் பொருளிலும் கடினமான தொடர். צורின் அரசன் அனுப்பும் கைவினைஞனின் பெயர் அல்லது மரியாதைப் பட்டமாக இது செயல்படுகிறது. ‘அபி’ என்பதை ஒலிபெயர்ப்பது ‘என் தந்தை’ அல்லது ‘தலைமைக் கைவினைஞன்’ என்று ஒரே பொருளைத் திணிக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: לְחוּרָם אָבִי என்பதில் אָבִי என்பதன் பொருள்
  choice: கைவினைஞனின் பெயர்/அடைமொழியின் பகுதியாகக் கொண்டு ‘ஊராம்-அபி’ என்று ஒலிபெயர்த்தல்
  alternative: ‘ஊராம், என் தந்தை’ அல்லது ‘ஊராம், என் தலைமைக் கைவினைஞன்’
  rationale: ‘தந்தை’ என்ற சொல் உயிரியல் உறவை மட்டுமல்லாமல் மதிப்புக்குரிய தலைவர், ஆலோசகர் அல்லது கலைஞரையும் குறிக்கக்கூடும். இங்கு அது பெயர் அல்லது மரியாதைப் பட்டம் போலச் செயல்பட வாய்ப்புள்ளது; ஒலிபெயர்ப்பு இந்த உண்மையான பொருள் தெளிவின்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஞானம்’ என்ற மூலச் சொல்லின் நேரடித் தன்மையும் கைவினைச் சூழலின் நடைமுறைப் புரிதலும் இணைத்துப் பாதுகாக்கப்பட்டுள்ளன. கடினமான பெயர்/பட்டம் அடிக்குறிப்புடன் ஒலிபெயர்க்கப்பட்டுள்ளது.
