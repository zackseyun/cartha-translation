  source_fidelity: 'மூல எபிரேயத்தின் வாக்கிய அமைப்பும் கருத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: அனுப்புதல் நிறைவுச் செயல், ஞானமுள்ள ஆண் கைவினைஞன், மற்றும் יוֹדֵעַ בִּינָה என்பதின் அறிவு/திறன் சார்ந்த பொருள் ஆகியவை இயல்பாக வெளிப்படுகின்றன. לְחוּרָם אָבִי என்ற கடினமான பெயர்/பட்டத் தொடரை ‘ஊராம்-அபி’ என ஒலிபெயர்ப்பது உரிய தெளிவின்மையைப் பாதுகாக்கிறது.'
