source:
  edition: WLC
  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
translation:
  language: ta
  text: இதோ, என் கடவுளாகிய யாவேயின் பெயருக்காக ஓர் ஆலயத்தைக் கட்டுகிறேன். அதை அவருக்கென்று புனிதப்படுத்தவும், அவர் முன்னிலையில் நறுமணத் தூபம் எரிக்கவும், அப்பங்களைத் தொடர்ந்து வரிசையாக வைக்கவும், காலையிலும் மாலையிலும், ஓய்வுநாட்களிலும், மாதப்பிறப்பு நாட்களிலும், நம் கடவுளாகிய யாவேயின் நியமிக்கப்பட்ட பண்டிகைகளிலும் தகனபலிகளைச் செலுத்தவும் அதை கட்டுகிறேன். இது இஸ்ரவேலுக்கு என்றென்றும் உரிய கடமை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: அறிவிப்பின் மீது கவனத்தை ஈர்க்கும் உயர்நடை உரைக்குறியை இயல்பான நவீனத் தமிழில் பாதுகாக்கிறது.
- source_word: בַּיִת לְשֵׁם יְהוָה
  choice: யாவேயின் பெயருக்காக ஓர் ஆலயம்
  rationale: בַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு/இல்லம்’ என்றாலும், இச்சூழலில் கட்டப்படுவது வழிபாட்டு ஆலயம். ‘பெயருக்காக’ என்பது எபிரேய இறையியல் சொல்லாட்சியைப் பாதுகாக்கிறது; நேர்ப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְהַקְדִּישׁ לוֹ
  choice: அதை அவருக்கென்று புனிதப்படுத்த
  rationale: קדשׁ என்பதன் ஹிஃபில் வடிவம், கடவுளுக்காகப் புனிதமாகப் பிரித்துவைப்பதைச் சுட்டுகிறது; ‘அதை’ என்பது முன்னுள்ள ஆலயத்திலிருந்து இயல்பாக நிரப்பப்படுகிறது.
- source_word: קְטֹרֶת סַמִּים
  choice: நறுமணத் தூபம்
  rationale: வாசனைப் பொருள்களால் செய்யப்பட்ட வழிபாட்டுத் தூபத்தின் மணத்தையும் சடங்குச் செயலையும் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: מַעֲרֶכֶת תָּמִיד
  choice: அப்பங்களைத் தொடர்ந்து வரிசையாக வைக்க
  rationale: சொற்றொடர் நேரடியாக ‘தொடர்ச்சியான அடுக்கு/வரிசை’ என்று இருந்தாலும், ஆலயத்தில் யாவேக்கு முன் ஒழுங்காக வைக்கப்பட்ட அப்பங்களையே குறிக்கிறது. பாரம்பரியக் கலைச்சொல்லைத் தவிர்த்து செயலைத் தெளிவாகக் கூறுகிறது.
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: முழுவதும் எரித்துப் படைக்கப்படும் பலிக்கான வழக்கமான, துல்லியமான தமிழ்ச் சொல்.
- source_word: לַבֹּקֶר וְלָעֶרֶב
  choice: காலையிலும் மாலையிலும்
  rationale: தினந்தோறும் நிகழும் இருவேளை பலிச் சுழற்சியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לֶחֳדָשִׁים
  choice: மாதப்பிறப்புகளில்
  rationale: புதிய நிலவுடன் தொடங்கும் மாதாந்திர வழிபாட்டு நாளைக் குறிக்கும் வேதாகமச் சூழலை ‘புதிய மாதங்கள்’ என்பதைவிடத் தெளிவாகத் தருகிறது.
- source_word: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: இது இஸ்ரவேலுக்கு என்றென்றும் உரிய கடமை
  rationale: ‘இது இஸ்ரவேலின்மேல் என்றென்றும்’ என்ற எபிரேய அமைப்பில் உள்ள தொடர்ந்த பொறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நேரடி அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை எவ்வாறு வழங்குவது
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், மூலமொழி வடிவத்துக்கு அண்மையான தமிழாக்கத்தைப் பயன்படுத்துகிறது.
- issue: בַּיִת என்பதை ‘இல்லம்’ என்றா ‘ஆலயம்’ என்றா மொழிபெயர்ப்பது
  choice: ஆலயம்
  alternative: இல்லம்
  rationale: ‘இல்லம்’ என்பது சொல்லுக்கு நெருக்கமானது; ஆனால் இங்கு சாலொமோன் கட்டும் வழிபாட்டுக் கட்டடமே தெளிவான குறிப்பு. வாசகருக்கான தெளிவுக்காக ‘ஆலயம்’ முதன்மை உரையில் வைக்கப்பட்டு, நேர்ப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: מַעֲרֶכֶת תָּמִיד என்பதில் மூலத்தில் வெளிப்படையாக இல்லாத ‘அப்பம்’ என்பதைச் சேர்ப்பதா
  choice: அப்பங்களைத் தொடர்ந்து வரிசையாக வைக்க
  alternative: தொடர்ச்சியான வரிசையை அமைக்க; காணிக்கை அப்பத்தை எப்போதும் வைக்க
  rationale: ஆலய வழிபாட்டுச் சூழலில் குறிக்கப்படும் பொருள் அப்பமே. தெளிவுக்காக அதை உரையில் வெளிப்படுத்தினாலும், மூலத்தின் சுருக்கமான சொல்லாட்சி அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: ‘இது இஸ்ரவேலின்மேல் என்றென்றும்’ என்ற முடிவுரையின் பொருள்
  choice: இது இஸ்ரவேலுக்கு என்றென்றும் உரிய கடமை
  alternative: இது இஸ்ரவேலின்மேல் என்றென்றும் உள்ளது
  rationale: עַל இங்கு இஸ்ரவேல்மீது உள்ள தொடர்ந்த பொறுப்பைக் குறிக்கிறது. தமிழில் தெளிவாக இருக்க ‘கடமை’ என வெளிப்படுத்தப்படுகிறது; மூலத்தின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரச அறிவிப்புக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’, ‘புனிதப்படுத்த’, ‘தகனபலிகள்’ போன்ற வேதாகமச் சொற்கள் தேவையான உயர்நடையைத் தக்கவைக்கின்றன; அரிதான பாரம்பரியச் சடங்குக் கலைச்சொற்கள் முதன்மை உரையில் தவிர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளன.
