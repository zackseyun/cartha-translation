  source_fidelity: 'மூலத்தின் முக்கிய கூறுகள் துல்லியமாக உள்ளன: யாவே என்ற பெயர், ‘பெயருக்காக,’ புனிதப்படுத்துதல், நறுமணத் தூபம், தொடர்ச்சியான அப்ப வரிசை, தகனபலிகள், காலம் சார்ந்த பட்டியல், இஸ்ரவேலுக்கு நிரந்தரமான பொறுப்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் முதன்மை உரையில் இறுதியில் மீண்டும் வரும் ‘கட்டுகிறேன்’ தமிழ்ச் சொற்றொடரமைப்பில் தேவையற்ற மறுசொல்லாகவும், நோக்கத் தொடர்களின் ஆளுகையைத் தாமதமாக்குவதாகவும் உள்ளது.'
  naturalness: நடை பொதுவாக நவீன நிலையான தமிழுக்கு ஏற்றது. நோக்கங்களை முதலில் ஒருங்கிணைத்து, பின்னர் ‘ஆலயத்தைக் கட்டுகிறேன்’ என முடிப்பது இயல்பாகவும் தெளிவாகவும் அமையும். ‘மாதப்பிறப்பு நாட்கள்’ என்பது புதிய நிலவு/புதிய மாதத் தொடக்கத்தைக் குறிக்கும் சூழலை வாசகருக்குத் தெளிவாக்குகிறது.
  terminology: ‘யாவே,’ ‘ஆலயம்,’ ‘புனிதப்படுத்த,’ ‘நறுமணத் தூபம்,’ ‘தகனபலிகள்’ ஆகியவை பொருத்தமானவை. מַעֲרֶכֶת תָּמִיד குறிக்கும் அப்ப வரிசையை உரையில் விளக்கமாகக் கொடுப்பது ஏற்கத்தக்கது; அடிக்குறிப்பு மூலத்தின் சுருக்கமான சொல்லாட்சியையும் பாரம்பரியப் பெயரையும் சரியாகக் குறிப்பிடுகிறது.
  issues:
  - severity: medium
    issue: வாக்கியத்தின் இறுதியில் ‘கட்டுகிறேன்’ மீண்டும் வருதல்
    rationale: ‘... தகனபலிகளைச் செலுத்தவும் கட்டுகிறேன்’ என்பது இலக்கணப்படி பொருள் கொள்ளக்கூடியதாயினும், தொடக்கத்தில் ஏற்கெனவே வந்த வினையை தேவையின்றி மீண்டும் கூறுகிறது. மேலும், பல நோக்கத் தொடர்களுக்குப் பிறகு வினை வருவதால் வாசிப்பு சற்றே கனமாகிறது. நோக்கங்களை ‘... செய்வதற்காக’ என ஒருங்கிணைத்து ஆலயக் கட்டுதலுடன் இணைப்பது பொருளை மாற்றாமல் இயல்பை மேம்படுத்தும்.
  - severity: low
    issue: முடிவுரை அடிக்குறிப்பில் ‘இவ்வழிபாட்டுப் படையல்கள்’ என வருதல்
    rationale: முந்திய பட்டியலில் தூபம், அப்ப வரிசை, தகனபலிகள் ஆகிய பல்வேறு ஆலயக் கடமைகள் உள்ளன; ‘படையல்கள்’ மட்டும் எல்லாவற்றையும் முழுமையாகக் குறிக்காது. ‘இந்த வழிபாட்டுக் கடமைகள்’ என்பது விரிவானதும் துல்லியமானதும்.
  revised_text: இதோ, என் கடவுளாகிய யாவேயின் பெயருக்காக ஓர் ஆலயத்தைக் கட்டுகிறேன். அதை அவருக்கென்று புனிதப்படுத்தவும், அவர் முன்னிலையில் நறுமணத் தூபம் எரிக்கவும், அப்பங்களைத் தொடர்ந்து வரிசையாக வைக்கவும், காலையிலும் மாலையிலும், ஓய்வுநாட்களிலும், மாதப்பிறப்பு நாட்களிலும், நம் கடவுளாகிய யாவேயின் நியமிக்கப்பட்ட பண்டிகைகளிலும் தகனபலிகளைச் செலுத்தவும் அதை கட்டுகிறேன். இது இஸ்ரவேலுக்கு என்றென்றும் உரிய கடமை.
  revised_footnotes:
  - marker: a
    text: எபிரேய மொழியில், “யாவேயின் பெயருக்காக ஓர் இல்லம்.” இங்கு “இல்லம்” என்பது ஆலயத்தைக் குறிக்கிறது.
    reason: மூலமொழியின் நேரடிச் சொல்லாட்சியையும் ‘பெயருக்காக’ என்ற இறையியல் மொழிநடையையும் காட்டுகிறது.
  - marker: b
    text: எபிரேய மொழியில், “தொடர்ச்சியான அடுக்கு” அல்லது “தொடர்ச்சியான வரிசை.” இது யாவேக்கு முன் தொடர்ந்து வைக்கப்பட்ட அப்பங்களைக் குறிக்கிறது; பாரம்பரியமாக “சமுகத்தப்பம்” என்றும் அழைக்கப்படுகிறது.
    reason: மூலத்தில் ‘அப்பம்’ வெளிப்படையாக இல்லாததையும், ஆலய வழிபாட்டில் இச்சொற்றொடர் குறிக்கும் நடைமுறையையும் விளக்குகிறது.
  - marker: c
    text: எபிரேய மொழியில், “இது இஸ்ரவேலின்மேல் என்றென்றும்.” அதாவது, இந்த வழிபாட்டுக் கடமைகள் இஸ்ரவேலுக்கு நீடித்த கடமையாக விதிக்கப்பட்டன.
    reason: சுருக்கமான எபிரேய முடிவுரையின் நேரடி வடிவத்தையும் அதன் சூழல்சார் பொருளையும் பாதுகாக்கிறது.
  revision_rationale: முதன்மை உரையில் இறுதியாக மீண்டும் வந்த ‘கட்டுகிறேன்’ என்பதைப் பொருளைத் தெளிவாக்கும் வகையில் முன்னுள்ள ‘அதை’யுடன் இணைத்துள்ளோம்; இதனால் ஆலயத்தை ஏன் கட்டுகிறார் என்பது முழுப் பட்டியலுக்கும் இயல்பாகப் பொருந்துகிறது. ‘மாதப்பிறப்புகள்’ என்பதை ‘மாதப்பிறப்பு நாட்கள்’ எனச் சிறிது தெளிவாக்கியுள்ளோம். இறுதி அடிக்குறிப்பில் ‘படையல்கள்’ என்பதற்குப் பதிலாக, தூபம் மற்றும் அப்ப வரிசையையும் உள்ளடக்கும் ‘வழிபாட்டுக் கடமைகள்’ பயன்படுத்தப்பட்டுள்ளது.
