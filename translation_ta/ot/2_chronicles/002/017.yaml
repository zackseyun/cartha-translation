base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
translation:
  language: ta
  text: அவர்களில் எழுபதாயிரம் பேரைச் சுமை சுமப்பவர்களாகவும், எண்பதாயிரம் பேரை மலைப்பகுதியில் கல் வெட்டுபவர்களாகவும்[a], மூவாயிரத்து அறுநூறு பேரை மக்களை வேலை செய்ய வைக்கும் மேற்பார்வையாளர்களாகவும் நியமித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “மலைப்பகுதியில் வெட்டுபவர்கள்.” வெட்டப்படும் பொருள் கல் என்பது கட்டுமானச் சூழலிலிருந்து பெறப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  choice: அவர்களில் ... நியமித்தான்
  rationale: ஒரு குழுவிலிருந்து குறிப்பிட்ட பணிகளுக்கு ஆட்களை ஏற்படுத்துதல் அல்லது நியமித்தல் என்ற எபிரெயச் சொற்றொடரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: סַבָּל
  choice: சுமை சுமப்பவர்கள்
  rationale: சுமைகளைத் தூக்கிச் செல்பவர்களைக் குறிக்கும் பெயர்ச்சொல்லின் துல்லியமான, எளிதில் புரியும் தமிழ் வடிவம்.
- source_word: חֹצֵב בָּהָר
  choice: மலைப்பகுதியில் கல் வெட்டுகிறவர்கள்
  rationale: חצב என்பது வெட்டுதல் அல்லது செதுக்குதல் எனப் பொருள்படும்; ஆலயக் கட்டுமானச் சூழலில் மறைந்திருக்கும் செயப்படுபொருள் ‘கல்’ என்பதால் அதை உரையில் வெளிப்படுத்துகிறது. בָּהָר என்பதை இயல்பாக ‘மலைப்பகுதியில்’ என வழங்குகிறது.
- source_word: מְנַצְּחִים
  choice: மேற்பார்வையாளர்கள்
  rationale: இப்பணிநிர்வாகச் சூழலில் வேலைகளை வழிநடத்தி மேற்பார்வையிடுவோரைக் குறிக்கிறது.
- source_word: לְהַעֲבִיד אֶת הָעָם
  choice: மக்களை வேலை செய்ய வைக்கும்
  rationale: עבד என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: எபிரெயத்தில் உள்ள பொதுவான சொல்லைப் பாதுகாக்கிறது; அவர்கள் தொழிலாளர்கள் என்பது சூழலால் தெளிவாகிறது.
