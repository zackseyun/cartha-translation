translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட பட்டியல் அமைப்பு தமிழில் தெளிவாக இருக்க ‘...பேரை ...ஆகவும்’ என்ற இணை அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
