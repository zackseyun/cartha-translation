base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
translation:
  language: ta
  text: 'பின்பு சாலொமோன் தீருவின் அரசன் ஹூராமுக்கு[a] இவ்வாறு சொல்லிச் செய்தி அனுப்பினான்: “என் தந்தை தாவீதிடம் நீர் நடந்துகொண்ட விதம்போலவும், அவர் குடியிருப்பதற்காக ஒரு வீட்டைக் கட்ட அவருக்குக் கேதுரு மரங்களை அனுப்பியதுபோலவும்—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரெய உரையில் பெயர் ‘ஹூராம்’ என்று உள்ளது; அரசர்கள் நூலின் இணையான பகுதியில் இது பொதுவாக ‘ஹீராம்’ என்று வருகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: பின்பு ... ஆள் அனுப்பினான்
  rationale: வாவ் தொடர் கதையை அடுத்த நிகழ்வுக்கு நகர்த்துகிறது. இங்கு அனுப்பப்பட்ட செய்தி நேரடி உரையாகத் தொடர்வதால், தமிழில் ‘ஆள் அனுப்பினான்’ என்பது செயலை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: חוּרָם
  choice: ஹூராம்
  rationale: நாளாகமத்தில் உள்ள חוּרָם என்ற எபிரெயப் பெயர்வடிவத்தை முதன்மை உரை ஒலிபெயர்க்கிறது; அரசர்கள் நூலில் பொதுவாகக் காணப்படும் ‘ஹீராம்’ என்ற வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֶלֶךְ צֹר
  choice: தீருவின் அரசன்
  rationale: அரசர் பட்டத்தையும் இடப்பெயரையும் இணைக்கும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு சொல்லி
  rationale: தொடர்ந்து வரும் நேரடி உரையை நவீன தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: כַּאֲשֶׁר
  choice: '...போல'
  rationale: ஹூராம் முன்பு தாவீதுக்குச் செய்ததையும் இப்போது சாலொமோன் முன்வைக்கும் வேண்டுகோளையும் ஒப்பிடும் கட்டமைப்பைத் தக்கவைக்கிறது; அதன் நிறைவு அடுத்த வசனத்தில் வருவதால் இவ்வசனத்தில் ஒப்பீடு திறந்த நிலையில் விடப்படுகிறது.
- source_word: עָשִׂיתָ עִם דָּוִיד אָבִי
  choice: என் தந்தை தாவீதுடன் நீர் நடந்துகொண்டு
  rationale: עשה עם என்ற பரந்த பொருளுடைய சொற்றொடரை ஒரு குறிப்பிட்ட உதவியாக மட்டும் சுருக்காமல், ஒருவரிடம் நடந்துகொண்ட விதம் என்ற பொருளில் தருகிறது.
- source_word: וַתִּשְׁלַח לוֹ אֲרָזִים
  choice: அவருக்குக் கேதுரு மரங்களை அனுப்பி
  rationale: אֲרָזִים என்பதன் நேரடிப் பன்மைப் பொருளைத் தக்கவைக்கிறது. கட்டுமானச் சூழல் மரப்பொருளைக் குறித்தாலும், மூலத்தில் இல்லாத ‘மரக்கட்டைகள்’ என்ற கூடுதல் குறிப்பைச் சேர்க்கவில்லை.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: ஒரு வீட்டைக் கட்ட
  rationale: வீடு கட்டும் நோக்கத்தைச் சுருக்கமாகத் தருகிறது; முந்தைய ‘அவருக்கு’ என்பதுடன் பயனாளியின் தொடர்பு தமிழிலும் தெளிவாக உள்ளது.
- source_word: לָשֶׁבֶת בּוֹ
  choice: அவர் குடியிருப்பதற்காக
  rationale: ישב இச்சூழலில் ‘வசித்தல்/குடியிருத்தல்’ என்று பொருள்படும். ‘குடியிருப்பதற்காக’ என்பது தற்போதைய தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: வசன முடிவில் உள்ள நிறைவுபெறாத ஒப்பீட்டு அமைப்பு
  choice: '...அனுப்பியதுபோல—'
  rationale: எபிரெய மூலத்தில் ‘எனக்கும் அவ்வாறே செய்யும்’ என்ற நிறைவு இவ்வசனத்தில் இல்லை; வேண்டுகோள் அடுத்த வசனத்தில் தொடர்கிறது. நீள்கோடு தொடர்ச்சியை உணர்த்தி, மூலத்தின் இலக்கணத் திறந்தநிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஒப்பீட்டு வாக்கியத்தின் மறைபொருளை இவ்வசனத்திலேயே வெளிப்படையாகச் சேர்ப்பதா
  choice: மூலத்தில் உள்ள நிறைவுபெறாத ஒப்பீட்டை அப்படியே தக்கவைத்தல்
  alternative: ‘எனக்கும் அவ்வாறே செய்யும்’ என்று சேர்த்து வாக்கியத்தை நிறைவு செய்தல்
  rationale: ‘எனக்கும் அவ்வாறே செய்யும்’ என்பது சூழலுக்குப் பொருத்தமான உணர்த்தப்பட்ட கருத்தாக இருந்தாலும், WLC எபிரெய உரையில் இவ்வசனத்தில் அந்தச் சொற்கள் இல்லை. அடுத்த வசனமே வேண்டுகோளைத் தொடர்வதால், அவற்றை முதன்மை உரையில் சேர்ப்பது மூலத்தை விட அதிகமாகத் தீர்மானித்துவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதை ஒருமையான ‘நீர்’ வடிவமும் கண்ணியமான வேதாகம நடையும் பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தில் அடுத்த வசனத்திற்குத் தொடரும் வாக்கிய அமைப்பைத் தமிழிலும் இயல்பாக உணர்த்த நீள்கோடு இடப்பட்டுள்ளது; மூலத்தில் இல்லாத நிறைவு சேர்க்கப்படவில்லை.
