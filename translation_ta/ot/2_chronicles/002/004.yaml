source:
  edition: WLC
  text: וְ/הַ/בַּ֛יִת אֲשֶׁר אֲנִ֥י בוֹנֶ֖ה גָּד֑וֹל כִּֽי גָד֥וֹל אֱלֹהֵ֖י/נוּ מִ/כָּל הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/004.yaml
  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
translation:
  language: ta
  text: மேலும், நான் கட்டிக்கொண்டிருக்கும் வீடு[a] பெரியதாக இருக்கும்; ஏனெனில் நம் கடவுள் எல்லாத் தெய்வங்களையும்விட பெரியவர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் கட்டிக்கொண்டிருக்கும் ஆலயம் பெரியதாக இருக்கும்.” எபிரெயில் நேரடியாக, “வீடு” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நம் கடவுள் எல்லாத் தெய்வங்களுக்கும் மேலாகப் பெரியவர்.” எபிரெயில் ‘பெரியவர்’ என்பதுடன் ‘எல்லாத் தெய்வங்களைவிட’ என்ற ஒப்பீட்டு அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הַ/בַּיִת
  choice: மேலும், ... வீடு
  rationale: בַּיִת என்பதன் நேரடிப் பொருள் ‘வீடு’. இச்சூழலில் அது கடவுளுக்காகக் கட்டப்படும் ஆலயத்தைக் குறித்தாலும், ‘வீடு’ என்பது எபிரெயச் சொல்லின் உருவக மற்றும் இறையியல் ஒலிப்பைத் தக்கவைக்கிறது; வְ இணைப்பு ‘மேலும்’ என்று இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: நான் கட்டிக்கொண்டிருக்கும்
  rationale: בּוֹנֶה என்பது நிகழ்ந்துகொண்டிருக்கும் அல்லது மேற்கொள்ளப்பட்டுவரும் செயலைக் குறிக்கும் பங்கேற்பு வடிவம். ‘கட்டிக்கொண்டிருக்கும்’ என்பது நவீனத் தமிழில் அந்தத் தொடர்நிலையை இயல்பாகத் தருகிறது.
- source_word: גָּדוֹל
  choice: பெரியதாக இருக்கும்
  rationale: இந்தச் சொல் அளவிலும் முக்கியத்துவத்திலும் உள்ள பெருமையைச் சுட்டலாம். ‘பெரியதாக’ இரு நிழல்களையும் திறந்தவையாக வைத்திருக்கிறது; தமிழில் முழுமையான வாக்கியமாக அமைய ‘இருக்கும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துவதால், காரணத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமைப் பின்னொட்டுடன் வரும் இஸ்ரவேலின் கடவுளைக் குறிக்கும் வடிவத்தின் இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: גָדוֹל ... מִכָּל הָאֱלֹהִים
  choice: எல்லாத் தெய்வங்களையும்விட பெரியவர்
  rationale: גָדוֹל என்ற பெயரடை தனியாக ஒப்பீட்டு வடிவில் இல்லாவிட்டாலும், מִן உடனான அமைப்பு வெளிப்படையான ஒப்பீட்டை உருவாக்குகிறது. ‘…விட பெரியவர்’ என்பது அதைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: הָאֱלֹהִים
  choice: தெய்வங்கள்
  rationale: இங்கு பிற கடவுள்கள் அல்லது தெய்வீக ஆளுமைகளைக் குறிக்கக்கூடிய சொல்லை ‘தெய்வங்கள்’ என மொழிபெயர்ப்பது உரையின் ஒப்பீட்டு சொல்லாட்சியைப் பாதுகாக்கிறது; அவை சிலைகளா, பொய்த் தெய்வங்களா, வானுலக ஆளுமைகளா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
theological_decisions:
- issue: பிற தெய்வங்களுடனான ஒப்பீடு
  choice: நம் கடவுள் எல்லாத் தெய்வங்களையும்விட பெரியவர்
  alternative: நம் கடவுள் எல்லாத் தெய்வங்களுக்கும் மேலாகப் பெரியவர்
  rationale: எபிரெயில் ‘பெரியவர்’ என்பதுடன் מִן (‘…விட/…க்கும் மேலாக’) பயன்படுத்தப்பட்டு நேரடி ஒப்பீடு செய்யப்படுகிறது. பிற ‘தெய்வங்கள்’ என்பவை என்ன இயல்புடையவை என்பதை விளக்கிச் சமயவியல் பதில் அளிக்காமல், மூலத்தின் பதற்றமும் சொல்லாட்சியும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீடு’ மூலச்சொல்லை நெருக்கமாகப் பாதுகாக்கிறது; ‘ஆலயம்’ அடிக்குறிப்பில் சூழல்சார் மாற்றாக வழங்கப்பட்டுள்ளது. ‘தெய்வங்கள்’ என்ற சொல் உரையின் இறையியல் தெளிவின்மையைத் தீர்க்காமல் வைத்திருக்கிறது.
