base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/014.yaml
  text: And now[a], let my lord send to his servants the wheat and the barley, the oil and the wine[b], of which he has spoken.
translation:
  language: ta
  text: 'இப்போது, என் ஆண்டவர் தாம் கூறிய[a] கோதுமையையும் வாற்கோதுமையையும் எண்ணெயையும்[b] திராட்சரசத்தையும் தமது பணியாளர்களுக்கு அனுப்புவாராக.


    [a] வேறு விதமாக, “சொன்ன” எனலாம்; இங்கு வரும் எபிரெயச் சொல், “வாக்குறுதி அளித்த” என்ற வலுவான பொருளைக் கட்டாயப்படுத்துவதில்லை.

    [b] இந்த உணவுப்பொருள் வழங்கும் சூழலில், “எண்ணெய்” என்பது குறிப்பாக “ஒலிவ எண்ணெய்” எனப் புரிந்துகொள்ளப்படலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு விதமாக, “சொன்ன” எனலாம்; இங்கு வரும் எபிரெயச் சொல், “வாக்குறுதி அளித்த” என்ற வலுவான பொருளைக் கட்டாயப்படுத்துவதில்லை.
    reason: lexical_alternative
  - marker: b
    text: இந்த உணவுப்பொருள் வழங்கும் சூழலில், “எண்ணெய்” என்பது குறிப்பாக “ஒலிவ எண்ணெய்” எனப் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: தொடர்ந்து வரும் நடைமுறைக் கோரிக்கையை அறிமுகப்படுத்தும் உரையாடல் இணைப்பாக இயல்பான நவீனத் தமிழில் தரப்பட்டுள்ளது; வாவ் இணைப்பின் தொடர்ச்சிப் பொருள் சூழலிலேயே வெளிப்படுகிறது.
- source_word: הַחִטִּים
  choice: கோதுமை
  rationale: குறிப்பிட்ட வழங்குபொருளைக் குறிக்கும் பன்மை வடிவம் தமிழில் இயல்பாகத் திரள்பொருள் ஒருமையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: וְהַשְּׂעֹרִים
  choice: வாற்கோதுமை
  rationale: பார்லியைக் குறிக்கும் எபிரெயப் பொருளுக்கு பொதுவாகப் புரியும் துல்லியமான தமிழ்ச் சொல்.
- source_word: הַשֶּׁמֶן
  choice: எண்ணெய்
  rationale: சூழலில் ஒலிவ எண்ணெயாக இருக்க வாய்ப்பிருந்தாலும், மூலச்சொல் பொதுவாக எண்ணெய் என்றே கூறுவதால் முதன்மை உரை அதனை மிகையாகக் குறிப்பாக்கவில்லை.
- source_word: וְהַיַּיִן
  choice: திராட்சரசம்
  rationale: வழங்க வேண்டிய பானப்பொருளைக் குறிக்கும் יין என்பதற்கான தெளிவான, மரியாதைநடையுடைய தமிழாக்கம்.
- source_word: אֲשֶׁר אָמַר
  choice: தாம் கூறிய
  rationale: முன்னர் குறிப்பிடப்பட்ட பொருட்களைச் சுட்டுகிறது; אמר என்பதில் இல்லாத ‘வாக்குறுதி அளித்தார்’ என்ற வலுவான நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: אֲדֹנִי
  choice: என் ஆண்டவர்
  rationale: ஈராம் சாலொமோனிடம் காட்டும் அரசவை மரியாதையை வெளிப்படுத்துகிறது; இங்கு இது தெய்வப் பட்டம் அல்ல.
- source_word: יִשְׁלַח
  choice: அனுப்புவாராக
  rationale: இச்சூழலில் யிக்தோல் வடிவம் வேண்டுகோள் சார்ந்த கட்டளைப் பொருளைக் கொண்டிருப்பதை மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַעֲבָדָיו
  choice: தமது பணியாளர்களுக்கு
  rationale: ஈராமின் வேலைக்காரர் அல்லது ஊழியர்களைக் குறிக்கும் சொல்லை இன்றைய தமிழில் தெளிவாகவும் சூழலுக்கு ஏற்றவாறும் தருகிறது.
