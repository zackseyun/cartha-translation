translation_notes:
  register: நவீன பொதுத்தமிழில், அரசவைக்குரிய மரியாதையைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. பொருட்களின் பட்டியல் தமிழ் வேற்றுமை உருபுகளுடன் இயல்பாக அமைக்கப்பட்டு, வேண்டுகோளின் பணிவு ‘அனுப்புவாராக’ என்பதால் பாதுகாக்கப்பட்டுள்ளது.
