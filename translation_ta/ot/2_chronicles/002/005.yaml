id: 2CH.2.5
reference: 2 Chronicles 2:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מִ֤י יַעֲצָר כֹּ֨חַ֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת כִּ֧י הַ/שָּׁמַ֛יִם וּ/שְׁמֵ֥י הַ/שָּׁמַ֖יִם לֹ֣א יְכַלְכְּלֻ֑/הוּ וּ/מִ֤י אֲנִי֙ אֲשֶׁ֣ר אֶבְנֶה לּ֣/וֹ בַ֔יִת כִּ֖י אִם לְ/הַקְטִ֥יר לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
translation:
  language: ta
  text: ஆனால், அவருக்காக ஓர் இல்லத்தைக் கட்ட யாரால் இயலும்? வானங்களும் வானாதி வானங்களும்கூட[a] அவரைக் கொள்ள முடியாது. அப்படியிருக்க, அவர் திருமுன் தூபம் எரிப்பதற்காக மட்டுமே[b] அவருக்காக ஓர் இல்லத்தைக் கட்ட நான் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “வானங்களும் வானங்களின் வானங்களும்”; இது மிக உயர்ந்த வானங்களைக் குறிக்கும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் திருமுன் தூபம் செலுத்துவதற்காக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  choice: கட்ட வல்லவர்
  rationale: இந்த எபிரெயச் சொற்றொடர் ஒரு பணியைச் செய்வதற்குப் போதிய வலிமை அல்லது ஆற்றல் உடையிருப்பதைக் குறிக்கிறது. ‘வல்லவர்’ என்பது சொல்லாட்சியைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: அவருக்காக ஓர் ஆலயத்தைக் கட்ட
  rationale: בַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு’ என்றாலும், இங்கு கட்டப்படுவது இறைவழிபாட்டுக்குரிய ஆலயம் என்பது சூழலில் தெளிவு. நவீன தமிழில் ‘ஆலயம்’ குழப்பமின்றிப் பொருளைத் தெரிவிக்கிறது.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: வானங்களும் வானாதி வானங்களும்கூட
  rationale: ‘வானங்களின் வானங்கள்’ என்ற எபிரெய மிகையுயர்வு அமைப்பை, தமிழில் வேதாகமச் செறிவும் புரிதலும் கொண்ட ‘வானாதி வானங்கள்’ எனப் பேணி, இருபகுதி வலியுறுத்தலையும் காக்கிறது.
- source_word: לֹא יְכַלְכְּלֻהוּ
  choice: அவரைக் கொள்ள முடியாது
  rationale: இங்கு வானங்கள்கூட கடவுளைத் தம்முள் அடக்கவோ இடமளித்துக் கொள்ளவோ இயலாது என்பதே கருத்து. ‘கொள்ள முடியாது’ அந்த இடவியல் உருவகத்தையும் இறைமீவியலையும் இயல்பாகப் பேணுகிறது.
- source_word: וּמִי אֲנִי
  choice: நான் யார்?
  rationale: கடவுளின் அளவிட முடியாத மகத்துவத்தின் முன்னிலையில் பேசுபவரின் தாழ்மையையும் தகுதியின்மையையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: כִּי אִם
  choice: மட்டுமே
  rationale: ஆலயம் கடவுளைக் கொண்டிருக்க அல்ல, அவர் முன்னிலையில் வழிபடுவதற்கே என்ற வரம்பை இச்சொல் தெளிவாகக் காட்டுகிறது.
- source_word: לְהַקְטִיר לְפָנָיו
  choice: அவர் திருமுன் தூபம் எரிப்பதற்காக
  rationale: הקטיר என்பது ஒன்றைப் புகையாக எழச்செய்வதைக் குறிக்கலாம்; இச்சூழலில் தூபம் எரித்தல் பொருத்தமானது. ‘திருமுன்’ என்பது לפניו என்பதிலுள்ள மரியாதைமிக்க முன்னிலை உணர்வை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கடவுளின் மீவியலும் ஆலயத்துடனான அவரது தொடர்பும்
  choice: ஆலயம் கடவுளைத் தன்னுள் அடக்குவதில்லை; அவர் திருமுன் வழிபாடு நடைபெறும் இடமாகவே கட்டப்படுகிறது என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ஆலயம் கடவுளை உள்ளடக்கும் அவரது உறைவிடமாகப் புரிந்துகொள்ளுதல்.
  rationale: ‘வானங்களும் வானாதி வானங்களும்கூட அவரைக் கொள்ள முடியாது’ என்ற உட்கூறு, ஆலய மொழியின் பொருளைக் கட்டுப்படுத்துகிறது. அதேவேளை, ‘அவர் திருமுன் தூபம் எரிப்பதற்காக’ என்பது ஆலயத்துடனான வழிபாட்டுத் தொடர்பைப் பேணுகிறது.
- issue: הקטיר என்பதன் பல்பொருள் வாய்ப்பு
  choice: முதன்மை உரையில் ‘தூபம் எரிப்பது’ என வழங்கி, விரிவான பலியர்ப்பணப் பொருளை அடிக்குறிப்பில் வைத்தல்.
  alternative: ‘காணிக்கைகளைப் புகையாக எழச்செய்வது’ அல்லது ‘தூபம் செலுத்துவது’.
  rationale: ஆலயச் சூழலில் தூபம் என்பது இயல்பான குறிப்புப் பொருள்; ஆயினும் எபிரெய வினை பலியைக் கொளுத்திப் புகையாக எழச்செய்வதையும் குறிக்கக்கூடும். அந்த உண்மையான சொற்பொருள் அகலத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஓர் ஆலயம்’, ‘திருமுன்’ ஆகியவை வழிபாட்டுச் சூழலுக்கேற்ற மரியாதை நடையை வழங்குகின்றன. மூலத்தின் இரு வினாவடிவங்களும் வியப்பும் தாழ்மையும் வெளிப்படுமாறு பேணப்பட்டுள்ளன; [a], [b] குறிகள் முதன்மை உரையில் இடம்பெற்றுள்ளன.
