translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் வரலாற்று உரைக்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அந்நியர்’ என்பதுடன் ‘வாழ்ந்துவந்த’ என்று சேர்த்து, அவர்கள் வெறும் பயணிகள் அல்லாமல் அந்நாட்டில் குடியிருந்தவர்கள் என்பதைத் தெளிவாக்குகிறது.
