  text: וַ/יִּסְפֹּ֣ר שְׁלֹמֹ֗ה כָּל הָ/אֲנָשִׁ֤ים הַ/גֵּירִים֙ אֲשֶׁר֙ בְּ/אֶ֣רֶץ יִשְׂרָאֵ֔ל אַחֲרֵ֣י הַ/סְּפָ֔ר אֲשֶׁ֥ר סְפָרָ֖/ם דָּוִ֣יד אָבִ֑י/ו וַ/יִּמָּצְא֗וּ מֵאָ֤ה וַ/חֲמִשִּׁים֙ אֶ֔לֶף וּ/שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
translation:
  language: ta
  text: அதன்பின்பு, சாலொமோன் இஸ்ரவேல் நாட்டில் குடியிருந்து வாழ்ந்த அந்நியர்கள்[a] அனைவரையும் எண்ணினான். தன் தந்தையான தாவீது அவர்களைக் கணக்கெடுத்த பிறகு, அவர்கள் ஒரு இலட்சத்து ஐம்பத்துமூவாயிரத்து அறுநூறு பேர் எனக் கண்டறியப்பட்டனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குடியிருந்த அந்நியர்கள்.’ எபிரேயச் சொல் இஸ்ரவேல் நாட்டில் குடியிருந்து வாழ்ந்த இஸ்ரவேலர் அல்லாதவர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: எண்ணினான்
  rationale: இங்கு ספר என்பது ஆட்களை எண்ணிக் கணக்கிடுவதைக் குறிக்கிறது; ‘எண்ணினான்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הָאֲנָשִׁים הַגֵּירִים
  choice: வாழ்ந்துவந்த அந்நியர்
  rationale: גֵּרִים என்பது தற்காலிகப் பயணிகளை அல்ல, இஸ்ரவேல் நாட்டில் குடியிருந்து வாழ்ந்த இஸ்ரவேலரல்லாதவர்களைக் குறிக்கிறது. ‘வாழ்ந்துவந்த அந்நியர்’ இந்தச் சமூக நிலையைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: இஸ்ரவேல் நாட்டில்
  rationale: אֶרֶץ என்பதன் நிலப்பரப்பு சார்ந்த பொருளைப் பாதுகாக்கும் இயல்பான தமிழாக்கம்.
- source_word: אַחֲרֵי הַסְּפָר
  choice: ஏற்கெனவே ... கணக்கெடுத்திருந்தபடி
  rationale: இந்தத் தொடர் முந்தைய கணக்கெடுப்புக்குப் பின்னர் அல்லது அதன் பதிவை அடிப்படையாகக் கொண்டு செய்யப்பட்ட எண்ணிக்கையைக் குறிக்கலாம். சூழலில் இரண்டாவது சாத்தியத்தை இயல்பாக வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו
  choice: அவனுடைய தந்தை தாவீது ஏற்கெனவே அவர்களைக் கணக்கெடுத்திருந்தபடி
  rationale: முன்னர் தாவீது செய்த கணக்கெடுப்பையும் தாவீது சாலொமோனின் தந்தை என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַיִּמָּצְאוּ
  choice: அவர்களின் எண்ணிக்கை ... என்று தெரியவந்தது
  rationale: Niphal வடிவத்தின் முடிவாகக் கண்டறியப்பட்ட எண்ணிக்கை என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: ஒரு இலட்சத்து ஐம்பத்துமூவாயிரத்து அறுநூறு
  rationale: எபிரேய உரையிலுள்ள 153,600 என்ற மொத்த எண்ணிக்கையைத் துல்லியமாகவும் தமிழ் நடைமுறைக்கு ஏற்ற சொல் வடிவிலும் தருகிறது.
