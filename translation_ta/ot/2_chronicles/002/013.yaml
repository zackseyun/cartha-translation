source:
  edition: WLC
  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
translation:
  language: ta
  text: அவன் தாணின் மகள்களில் ஒருத்தியின் மகன்[a]; அவனுடைய தந்தை தீருவைச் சேர்ந்த மனிதர். பொன், வெள்ளி, வெண்கலம், இரும்பு, கல், மரம் ஆகியவற்றிலும், ஊதா, நீலம், மெல்லிய சணல் துணி, கருஞ்சிவப்பு[b] ஆகியவற்றிலும் வேலை செய்வதிலும், எல்லாவகைச் செதுக்குவேலைகளையும் செய்வதிலும், உமது திறமைசாலிகளோடும் உமது தந்தையாகிய என் ஆண்டவர் தாவீதின் திறமைசாலிகளோடும் சேர்ந்து, அவனுக்குக் கொடுக்கப்படும் ஒவ்வொரு வடிவமைப்பையும் திட்டமிடுவதிலும் அவன் திறமைமிக்கவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாணின் மகள்களில் ஒருத்தி” என்பது அவனுடைய தாய் தாண் கோத்திரத்தைச் சேர்ந்தவர் என்பதைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
    text: “கருஞ்சிவப்பு” என்பதற்கு “செந்நிறம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  choice: தாணின் மகள்களில் ஒருத்தியின் மகன்
  rationale: ‘தாணின் மகள்களில்’ என்ற எபிரெயச் சொல்லமைப்பைப் பாதுகாத்து, நவீன தமிழில் இயல்பாகப் புரிய ‘ஒருத்தியின் மகன்’ என்று வழங்கப்பட்டுள்ளது; இது தாண் கோத்திரத்தைச் சேர்ந்த தாய்வழி மரபைக் குறிக்கலாம்.
- source_word: וְאָבִיו אִישׁ צֹרִי
  choice: அவனுடைய தந்தை தீருவைச் சேர்ந்தவர்
  rationale: צֹרִי என்பது தீரு நகரத்தைச் சேர்ந்த ஒருவரைக் குறிக்கிறது; தமிழில் இயல்பான புவியியல் அடையாளமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יוֹדֵעַ לַעֲשׂוֹת
  choice: வேலை செய்வதில் திறமைபெற்றவன்
  rationale: இது வெறும் அறிவை அல்ல, நடைமுறை கைவினைத் தேர்ச்சியைக் குறிக்கிறது.
- source_word: בַּזָּהָב וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל בָּאֲבָנִים וּבָעֵצִים
  choice: பொன், வெள்ளி, வெண்கலம், இரும்பு, கல், மரம் ஆகியவற்றில்
  rationale: בְּ முன்னிடைச்சொல் கைவினைஞன் பயன்படுத்தும் பொருட்களைக் குறிக்கிறது; தமிழில் பொருட்களின் பட்டியல் தெளிவாகவும் இயல்பாகவும் தரப்பட்டுள்ளது.
- source_word: בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל
  choice: ஊதா, நீலம், மெல்லிய நார்த்துணி, கருஞ்சிவப்பு
  rationale: பண்டைய சாயநிறப் பொருட்களைக் குறிக்கும் சொற்கள் வழக்கமான நிறப்பெயர்களாலும், בּוּץ மட்டும் அதன் தரத்தைக் காட்டும் ‘மெல்லிய நார்த்துணி’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: וּלְפַתֵּחַ כָּל פִּתּוּחַ
  choice: எல்லாவகைச் செதுக்குவேலைகளையும் செய்ய
  rationale: ஒரே வேரிலிருந்து வரும் வினை–பெயர்ச்சொல் இணைப்பு செதுக்கும் கைவினைத் திறனை வலியுறுத்துகிறது; தமிழில் தேவையற்ற மறுசொல்லாக்கத்தைத் தவிர்த்து அதன் முழு பரப்பும் காக்கப்பட்டுள்ளது.
- source_word: וְלַחְשֹׁב כָּל מַחֲשָׁבֶת
  choice: எந்தக் கலை வடிவமைப்பையும் உருவாக்க
  rationale: חשׁב என்ற வினை கைவினைச் சூழலில் கலைத் திட்டத்தை வகுத்தல் அல்லது வடிவமைத்தலைக் குறிக்கிறது; ‘கலை வடிவமைப்பு’ சூழலைத் தெளிவுபடுத்துகிறது.
- source_word: אֲשֶׁר יִנָּתֶן לוֹ
  choice: அவனிடம் ஒப்படைக்கப்படும்
  rationale: செயப்பாட்டு வடிவம் காக்கப்பட்டு, கைவினைஞனுக்குக் கொடுக்கப்படும் பணியையோ வடிவமைப்பையோ இயல்பான தமிழில் குறிக்கிறது.
- source_word: חֲכָמֶיךָ ... חַכְמֵי אֲדֹנִי דָּוִיד
  choice: உமது திறமைசாலிகள் ... என் ஆண்டவர் தாவீதின் திறமைசாலிகள்
  rationale: חכם இங்கு பொது ஞானத்தைவிட கைவினைத் தேர்ச்சியுடையவர்களைக் குறிக்கிறது; אֲדֹנִי மனித அரசருக்கான மரியாதைமிக்க அழைப்பாக ‘என் ஆண்டவர்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: கைவினைஞர்களைக் குறிக்கும் ஆண்பால் பன்மை
  choice: திறமைசாலிகள்
  alternative: திறமைபெற்ற பணியாளர்கள் / கைவினைஞர்கள்
  rationale: எபிரெய ஆண்பால் வடிவத்தைத் தமிழில் செயற்கையாக வலியுறுத்தாமல், சூழலுக்கேற்ற பொதுப்பெயர் பயன்படுத்தப்பட்டுள்ளது; குறிப்பிட்ட பாலினத்தைச் சேர்க்கவோ நீக்கவோ உரை கட்டாயப்படுத்தவில்லை.
- issue: אֲדֹנִי என்ற அரசவைக் கௌரவ அழைப்பு
  choice: என் ஆண்டவர் தாவீது
  alternative: என் தலைவர் தாவீது
  rationale: இது தேவனுக்கான பட்டம் அல்ல; தாவீதுக்குக் கொடுக்கப்படும் மனித அரசவைக் கௌரவச் சொல். ‘என் ஆண்டவர்’ அந்த மரியாதைத் தன்மையைக் காக்கிறது.
- issue: தாணின் மகள்கள் என்ற மரபுவழிக் குறிப்பு
  choice: மூல உருவகத்தை முதன்மை உரையில் காத்தல்
  alternative: தாண் கோத்திரத்தைச் சேர்ந்த பெண்ணின் மகன்
  rationale: மூலத்தின் குடும்ப/கோத்திர மொழிநடையை அழிக்காமல் வைத்துப், அதன் சாத்தியமான கோத்திரப் பொருளை அடிக்குறிப்பில் விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசவைக் கடிதத்திற்கேற்ற கண்ணியமான நடையும் பொதுவாசகர்களுக்குப் புரியும் கைவினைச் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. வசனம் முந்தைய வசனத்தின் தொடராக இருப்பினும், தனியாக வாசிக்க ஏதுவாகத் தெளிவான வாக்கியங்களாக அமைக்கப்பட்டுள்ளது.
