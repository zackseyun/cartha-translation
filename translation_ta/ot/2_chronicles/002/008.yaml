  text: and to prepare for me timber in abundance[b][a], for the house that I am building will be great and wonderful.
translation:
  language: ta
  text: மேலும், எனக்காக ஏராளமான கட்டுமானத்திற்கான மரப்பொருளை ஆயத்தம் செய்யவும்; ஏனெனில் நான் கட்டும் வீடு[a] மிகப் பெரியதும் அற்புதமானதுமாக இருக்கும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆலயம்’; எபிரெயத்தில் சொல்லுக்குச் சொல் ‘வீடு.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பெரியதும் வியப்பூட்டுவதுமானதும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהָכִין
  choice: மேலும் … ஆயத்தம் செய்ய வேண்டும்
  rationale: முன் வசனத்தில் தொடங்கிய வேண்டுகோளைத் தொடரும் நோக்கப் பொருளுடைய வினையெச்ச வடிவம்; தமிழில் முழுமையான வாக்கியமாக இயல்பாக அமைய ‘வேண்டும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לִי
  choice: எனக்காக
  rationale: முதல் நபருக்கான பயன் அல்லது நோக்கத்தை நேரடியாகக் காட்டுகிறது.
- source_word: עֵצִים
  choice: கட்டுமான மரங்கள்
  rationale: கட்டடச் சூழலில் பொதுவான ‘மரம்’ என்பதைவிட, கட்டுவதற்குப் பயன்படும் மரப்பொருளைத் தெளிவாகக் குறிக்கிறது.
- source_word: לָרֹב
  choice: ஏராளமான
  rationale: மிகுந்த அளவு என்ற பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் பங்கைத் தெளிவாகப் பேணுகிறது.
- source_word: הַבַּיִת
  choice: வீடு
  rationale: எபிரெய மூலத்தின் நேரடிப் பொருளைப் பேணுகிறது; சூழலில் இது ஆலயத்தைக் குறிக்கிறது.
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: நான் கட்டுகிற
  rationale: எபிரெயப் பங்கேற்பு வடிவத்தின் நடைபெறும் அல்லது நெருங்கிய செயல் நுணுக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גָּדוֹל
  choice: மிகப் பெரியதாக
  rationale: அளவையும் மேன்மையையும் உள்ளடக்கக்கூடிய ‘பெரிய’ என்பதுடன், வாக்கியத்தின் வலிமையை இயல்பாக வெளிப்படுத்த ‘மிக’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהַפְלֵא
  choice: அற்புதமானதாகவும்
  rationale: פלא வேரின் அசாதாரணம், வியப்பூட்டும் சிறப்பு ஆகிய பொருள்களைப் பேணுகிறது.
