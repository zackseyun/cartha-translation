  text: וּֽ/שְׁלַֽח לִ/י֩ עֲצֵ֨י אֲרָזִ֜ים בְּרוֹשִׁ֣ים וְ/אַלְגּוּמִּים֮ מֵֽ/הַ/לְּבָנוֹן֒ כִּ֚י אֲנִ֣י יָדַ֔עְתִּי אֲשֶׁ֤ר עֲבָדֶ֨י/ךָ֙ יֽוֹדְעִ֔ים לִ/כְר֖וֹת עֲצֵ֣י לְבָנ֑וֹן וְ/הִנֵּ֥ה עֲבָדַ֖/י עִם עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
translation:
  language: ta
  text: லெபனோனிலிருந்து கேதுரு, சைப்ரஸ்[a], அல்கூம்[b] மரக்கட்டைகளை எனக்கு அனுப்பிவையுங்கள். ஏனெனில், லெபனோனில் மரங்களை வெட்ட உங்கள் பணியாளர்களுக்குத் தெரியும் என்று நான் அறிவேன். இதோ, என் பணியாளர்கள் உங்கள் பணியாளர்களோடு இருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சைப்ரஸ்’ என்பதற்கான எபிரெயச் சொல் பெரோஷிம். இதை ‘ஜூனிப்பர்’ அல்லது ‘ஃபர்’ என்றும் மொழிபெயர்க்கலாம்; துல்லியமான மரவகை உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘அல்கூம்’ என்பதை ‘அல்மூக்’ என்றும் வழங்கலாம். சிலர் இதைச் சந்தனமரம் என்று அடையாளம் காண்கின்றனர்; ஆனால் துல்லியமான மரவகை உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח לִי
  choice: எனக்கு அனுப்பிவையுங்கள்
  rationale: இணைப்புச் சொல்லுடன் வரும் கட்டளை. மூலத்தில் காலத்தைக் குறிக்கும் ‘இப்போது’ என்ற தனிச்சொல் இல்லாததால் அதைச் சேர்க்கவில்லை; மரியாதைப் பன்மை அரசரிடம் செய்யப்படும் வேண்டுகோளுக்கு இயல்பானது.
- source_word: עֲצֵי אֲרָזִים
  choice: கேதுரு ... மரக்கட்டைகள்
  rationale: கட்டுமானப் பொருட்கள் கேட்கப்படும் சூழலில், மரவகையின் பெயருடன் ‘மரக்கட்டைகள்’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּרוֹשִׁים
  choice: சைப்ரஸ்
  rationale: குறிப்பிட்ட மரவகை உறுதியாக அடையாளம் காணப்படவில்லை. பொதுவான மொழிபெயர்ப்பான ‘சைப்ரஸ்’ முதன்மை உரையில் வைக்கப்பட்டு, பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אַלְגּוּמִּים
  choice: அல்கூம்
  rationale: மரவகை உறுதியாகத் தெரியாததால் ஊகமான தாவரவியல் பெயரைத் திணிக்காமல் எபிரெயப் பெயரின் ஒலிவடிவம் பாதுகாக்கப்படுகிறது.
- source_word: מֵהַלְּבָנוֹן
  choice: லெபனோனிலிருந்து
  rationale: பொருட்கள் வரும் இடத்தை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: כִּי אֲנִי יָדַעְתִּי
  choice: ஏனெனில் ... நான் அறிவேன்
  rationale: எபிரெய நிறைவுவினை இச்சூழலில் தற்போதைய அறிவைக் குறிக்கிறது; ‘அறிவேன்’ அதைப் பேணுகிறது.
- source_word: אֲשֶׁר עֲבָדֶיךָ יֹדְעִים לִכְרוֹת
  choice: வெட்ட உங்கள் பணியாளர்களுக்குத் தெரியும் என்று
  rationale: ‘அறிந்திருக்கிறார்கள்’ என்பதன் செயற்றிறன் சார்ந்த பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘பணியாளர்கள்’ அரசரின் சேவகர்களைக் குறிக்கும் நடுநிலையான சொல்.
- source_word: עֲצֵי לְבָנוֹן
  choice: லெபனோனில் மரங்களை
  rationale: எபிரெயத் தொடரை அதன் நிலப்பகுதி சார்ந்த பொருளோடு நேரடியாகக் கொடுக்கிறது; இங்கு நிற்கும் மரங்களை வெட்டும் செயல் முன்னிலைப்படுகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: அடுத்து சொல்லப்படுவதின் மீது கவனம் ஈர்க்கும் எபிரெய இடைச்சொல்லின் வலிமையைச் சுருக்கமாகப் பேணுகிறது.
- source_word: עֲבָדַי עִם עֲבָדֶיךָ
  choice: என் பணியாளர்கள் உங்கள் பணியாளர்களோடு இருப்பார்கள்
  rationale: மூலத்தில் வெளிப்படையான வினைச்சொல் இல்லை. வேண்டுகோள் மற்றும் வரவிருக்கும் வேலை ஏற்பாட்டின் சூழலால் எதிர்கால வினை தமிழில் நிரப்பப்பட்டுள்ளது.
