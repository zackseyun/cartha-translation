translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. அரசரிடம் உரைக்கப்படும் கட்டளைக்கு மரியாதைப் பன்மை இடப்பட்டுள்ளது. உறுதியற்ற இரு மரவகைப் பெயர்களும் முதன்மை உரையில் எச்சரிக்கையுடன் வழங்கப்பட்டு, மாற்று அடையாளங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
