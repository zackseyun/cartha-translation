translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், கைவினைஞன் ஏற்கெனவே உள்ள திறமைமிக்கவர்களுடன் இணைந்து பணியாற்ற வேண்டும் என்ற தொடர்பு காக்கப்பட்டுள்ளது. மூலத்தில் உள்ள וְעַתָּה காரணமாக ‘இப்போது’ விடப்படவில்லை.
