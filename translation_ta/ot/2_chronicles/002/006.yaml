  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
translation:
  language: ta
  text: இப்போது, தங்கம், வெள்ளி, வெண்கலம், இரும்பு, ஊதா, கருஞ்சிவப்பு[a], நீலம் ஆகியவற்றில் வேலை செய்யவும், செதுக்குவேலைகளைச் செதுக்கவும்[b] அறிந்த திறமைமிக்க ஒருவனை, யூதாவிலும் எருசலேமிலும் என்னோடு இருக்கும், என் தந்தை தாவீது ஆயத்தப்படுத்திய[c] திறமைமிக்கவர்களுடன் இருக்கும்படி எனக்கு அனுப்புங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கருஞ்சிவப்பு’ என்பதற்கு ‘செந்நிறம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “செதுக்கல்களைச் செதுக்க”; இது திறமையான செதுக்குவேலையை வலியுறுத்தும் ஒரே வேர்ச்சொல் அமைப்பு.
    reason: lexical_alternative
  - marker: c
    text: ‘ஆயத்தப்படுத்திய’ என்பதற்கு ‘நியமித்த’ அல்லது ‘தயாராக்கிய’ என்றும் மொழிபெயர்க்கலாம்; சூழலுக்கேற்ப எபிரெய வினை இப்பொருட்களைத் தரக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: וְעַתָּה என்பது வெளிப்படையான கால/உரையாடல் தொடர்ச்சிச் சொல்; தமிழில் இயல்பாக ‘இப்போது’ என வழங்கப்படுகிறது.
- source_word: אִישׁ חָכָם
  choice: திறமைமிக்க ஒருவன்
  rationale: கைவினைச் சூழலில் חָכָם பொதுவான ஞானத்தைவிட தொழில்திறமையைக் குறிக்கிறது; ஆண்பால் ஒருமையும் காக்கப்படுகிறது.
- source_word: לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  choice: தங்கம், வெள்ளி, வெண்கலம், இரும்பு ஆகியவற்றில் வேலை செய்ய
  rationale: בְּ இங்கு கைவினைஞன் வேலை செய்யும் மூலப்பொருட்களைக் குறிக்கிறது; נְחֹשֶׁת வரலாற்றுப் பொருட்சூழலில் ‘வெண்கலம்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: אַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  choice: ஊதா, செந்நிறம், நீலம்
  rationale: எபிரெயச் சொற்கள் வண்ணமிடப்பட்ட விலையுயர்ந்த பொருட்கள் அல்லது அவற்றின் வண்ணங்களைக் குறிக்கின்றன. மூலத்தில் ‘நூல்’ என்று வெளிப்படையாக இல்லாததால் வண்ணப்பெயர்கள் மட்டும் வைக்கப்பட்டுள்ளன.
- source_word: יֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  choice: செதுக்குவேலைகளைச் செதுக்கத் தெரிந்த
  rationale: ஒரே வேர்ச்சொல்லிலிருந்து வந்த வினை–பெயர் இணைப்பின் வலியுறுத்தலை தமிழிலும் இயன்றவரை காக்கிறது.
- source_word: עִם הַחֲכָמִים
  choice: திறமைமிக்கவர்களுடன்
  rationale: ஆலயக் கைவினைச் சூழலில் இவர்கள் நிபுணத்துவம் பெற்ற பணியாளர்கள்; வசனத்தின் முந்தைய חָכָם என்பதுடனான சொற்பொருள் தொடர்பும் காக்கப்படுகிறது.
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: என் தந்தை தாவீது ஆயத்தப்படுத்திய
  rationale: הֵכִין என்பதன் விரிவான ‘ஆயத்தப்படுத்து/தயாராக்கு’ பொருளைக் காக்கிறது; முறையாக ‘நியமித்தார்’ என்று தேவையின்றிக் குறுக்கவில்லை.
