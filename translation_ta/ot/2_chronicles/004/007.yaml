translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகமக் கதைநடையின் சுருக்கமும் காக்கப்பட்டுள்ளன. ‘பிரதான மண்டபம்’ இடத்தைக் குறிப்பாக்குகிறது; ‘வலப்புறம்/இடப்புறம்’ என்ற மூலச் சொற்கள் விளக்கவுரையாகத் திசைகளாக மாற்றப்படவில்லை. எல்லா அடிக்குறிப்பு குறியீடுகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
