base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
translation:
  language: ta
  text: அவர் தங்க விளக்குத்தண்டுகள் பத்தை அவற்றுக்குரிய முறைப்படி[a] செய்து, அவற்றை ஆலயத்தின் பிரதான மண்டபத்தில்[b] வைத்தார்—வலப்புறத்தில் ஐந்தும் இடப்புறத்தில் ஐந்தும்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றுக்குரிய விதிப்படி” அல்லது “அவற்றின் மாதிரிப்படி.” எபிரெயச் சொல் நிர்ணயிக்கப்பட்ட விதி, ஒழுங்குமுறை அல்லது வடிவமைப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆலயத்தில்” அல்லது “பரிசுத்த இடத்தில்.” எபிரெயச் சொல் விரிந்த ஆலய வளாகத்தை அல்லாமல் ஆலயக் கட்டடத்தின் பிரதான உட்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “வலப்புறத்தில் ஐந்தும் இடப்புறத்தில் ஐந்தும்.” ஆலயத்தின் நோக்குநிலையைப் பொறுத்து இவை முறையே தெற்குப் பக்கத்தையும் வடக்குப் பக்கத்தையும் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் ... செய்து
  rationale: עשה என்பதன் Qal wayyiqtol வடிவம் தொடர்ச்சியான கதைநடையில் ‘செய்தார்’ எனப் பொருள்படும்; அடுத்த வினையுடன் இயல்பாக இணைக்க ‘செய்து’ பயன்படுத்தப்பட்டது.
- source_word: מְנֹרוֹת הַזָּהָב עֶשֶׂר
  choice: தங்கக் குத்துவிளக்குகள் பத்தை
  rationale: מְנוֹרָה என்பது வெறும் விளக்கை அல்ல, விளக்குகளைத் தாங்கும் அமைப்பைக் குறிக்கிறது. ஆலயப் பயன்பாட்டை இயல்பான தமிழில் தெரிவிக்க ‘குத்துவிளக்கு’ தேர்ந்தெடுக்கப்பட்டது; எண்ணிக்கை பத்து தெளிவாகப் பாதுகாக்கப்பட்டது.
- source_word: כְּמִשְׁפָּטָם
  choice: அவற்றுக்குரிய முறைப்படி
  rationale: מִשְׁפָּט இங்கு தீர்ப்பு என்ற வழக்கமான பொருளில் அல்லாமல், நிர்ணயிக்கப்பட்ட விதம், ஒழுங்கு அல்லது வடிவமைப்பு என்ற பொருள் வரம்பைக் கொண்டுள்ளது. மூலத்தின் தெளிவின்மையைச் சுருக்காமல் ‘முறைப்படி’ என வழங்கி மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டன.
- source_word: וַיִּתֵּן
  choice: வைத்தார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’; ஆலயப் பொருட்களை ஓர் இடத்தில் அமைக்கும் சூழலில் ‘வைத்தார்’ இயல்பான தமிழ்.
- source_word: בַּהֵיכָל
  choice: ஆலயத்தின் பிரதான மண்டபத்தில்
  rationale: הֵיכָל இங்கு விரிந்த ஆலய வளாகம் முழுவதையும் விட ஆலயக் கட்டடத்தின் பிரதான உட்பகுதியைக் குறிக்கிறது. ‘பிரதான மண்டபம்’ அந்த இடவியல் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: חָמֵשׁ מִיָּמִין וְחָמֵשׁ מִשְּׂמֹאול
  choice: வலப்புறத்தில் ஐந்தும் இடப்புறத்தில் ஐந்தும்
  rationale: மூல எபிரெயம் திசைப்பெயர்களைப் பயன்படுத்தாமல் ‘வலது’, ‘இடது’ என்று கூறுவதால் அவையே பிரதான உரையில் பாதுகாக்கப்பட்டன.
