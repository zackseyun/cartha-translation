base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/012.yaml
  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
translation:
  language: ta
  text: இரண்டு தூண்கள், தூண்களின் உச்சியிலிருந்த இரண்டு கிண்ண வடிவ அமைப்புகள்[a] மற்றும் இரண்டு தூண் முகடுகள், தூண்களின் உச்சியிலிருந்த அந்த முகடுகளின் இரண்டு கிண்ண வடிவ அமைப்புகளை மூடுவதற்கான இரண்டு வலைப்பின்னல் அலங்காரங்கள்[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கோள வடிவங்கள்’ அல்லது ‘வட்டமான அமைப்புகள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் குறிக்கும் துல்லியமான கட்டடக்கலை வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘வலை அமைப்புகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדִים
  choice: தூண்கள்
  rationale: ஆலயத்தின் இரு கட்டடக்கலைத் தூண்களைக் குறிக்கும் இயல்பான, தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: גֻּלּוֹת
  choice: கிண்ண வடிவ அமைப்புகள்
  rationale: தூண்களின் மேற்பகுதியோடு தொடர்புடைய வட்டமான அல்லது கிண்ணம் போன்ற கட்டடக்கலை வடிவங்களைக் குறிக்கிறது. அது சாதாரண கிண்ணம் அல்ல என்பதை ‘வடிவ அமைப்புகள்’ தெளிவாக்குகிறது; துல்லியமான வடிவம் உறுதியற்றதால் மாற்றுக் கருத்து அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כֹּתָרוֹת
  choice: தூண் முகடுகள்
  rationale: தூணின் உச்சியிலுள்ள அலங்காரக் கட்டடக்கலைப் பகுதியைச் சுட்டும் புரிந்துகொள்ளக்கூடிய தமிழ்ச் சொற்றொடர்.
- source_word: רֹאשׁ
  choice: உச்சி
  rationale: சொற்பொருளில் ‘தலை’ என்றாலும், கட்டடக்கலைச் சூழலில் தூணின் மேல்பகுதி அல்லது உச்சி என்பதே இயல்பான பொருள்.
- source_word: שְּׂבָכוֹת
  choice: பின்னல் வேலைப்பாடுகள்
  rationale: வலைபோல ஒன்றோடொன்று பின்னப்பட்ட அலங்கார அமைப்பைக் குறிக்கிறது; நவீனத் தமிழில் அதன் தோற்றத்தையும் பயன்பாட்டையும் தெளிவாக உணர்த்துகிறது.
- source_word: לְכַסּוֹת
  choice: மூடுவதற்கான
  rationale: எபிரெய வினையெச்சத்தின் நோக்கப் பொருளைப் பாதுகாத்து, பின்னல் வேலைப்பாடுகளின் பயன்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שְׁנַיִם / שְׁתַּיִם / שְׁתֵּי
  choice: இரண்டு
  rationale: ஆலயப் பொருட்களை ஒவ்வொன்றாகக் கணக்கிடும் எபிரெய உரையின் மீளுரைப்பை முழுமையாகத் தக்கவைக்கிறது.
