translation_notes:
  register: நவீன நிலையான தமிழில், பட்டியல் வடிவிலுள்ள வசனத் துணுக்கின் இலக்கண அமைப்பைத் தக்கவைத்து மொழிபெயர்க்கப்பட்டுள்ளது. கட்டடக்கலைச் சொற்கள் பொதுவாசகர்களுக்குப் புரியும் வகையில் ‘தூண் முகடுகள்’, ‘பின்னல் வேலைப்பாடுகள்’ என்று வழங்கப்பட்டுள்ளன. எபிரெயத்தில் மீண்டும் மீண்டும் வரும் ‘இரண்டு’ என்பதும் நோக்கத்துடன் பாதுகாக்கப்பட்டுள்ளது.
