  yaml_path: translation/ot/2_chronicles/004/018.yaml
  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
translation:
  language: ta
  text: 'சாலொமோன் இந்தப் பொருட்கள் அனைத்தையும் மிகப் பெருமளவில் செய்தான்; ஏனெனில் வெண்கலத்தின் எடை நிர்ணயிக்கப்படவில்லை.[a]


    [a] அல்லது, “வெண்கலத்தின் எடை ஆராய்ந்து கண்டறியப்படவில்லை.” எபிரேய வினைச்சொல்லுக்கு “ஆராய்ந்து கண்டறிதல்” அல்லது “நிர்ணயித்தல்” என்று பொருள் கொள்ளலாம். வெண்கலம் மிகுதியாக இருந்ததால் அதன் எடை நிர்ணயிக்கப்படவில்லை என்பதே இங்குள்ள கருத்து.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெண்கலத்தின் எடை ஆராய்ந்து கண்டறியப்படவில்லை.” எபிரேய வினைச்சொல்லுக்கு “ஆராய்ந்து கண்டறிதல்” அல்லது “நிர்ணயித்தல்” என்று பொருள் கொள்ளலாம். வெண்கலம் மிகுதியாக இருந்ததால் அதன் எடை நிர்ணயிக்கப்படவில்லை என்பதே இங்குள்ள கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்ற பொதுவான வினை இங்கு ஆலயப் பொருட்களை உருவாக்கியதைக் குறிக்கிறது; “செய்தான்” இயல்பானதும் பொருத்தமானதும் ஆகும்.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: இந்தப் பொருட்கள் அனைத்தையும்
  rationale: כֵּלִים என்பது பாத்திரங்கள் மட்டுமல்லாமல் கருவிகள் மற்றும் பிற உபயோகப் பொருட்களையும் குறிக்கும் பரந்த சொல்; சுற்றியுள்ள பலவகை ஆலயப் பொருட்களை உள்ளடக்க “பொருட்கள்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: לָרֹב מְאֹד
  choice: மிகப் பெருமளவில்
  rationale: இந்தச் சொற்றொடர் மிகவும் அதிகமான அளவு அல்லது எண்ணிக்கையை வலியுறுத்துகிறது; தமிழ் மொழியில் இயல்பாக அந்த வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்துவதால் causal தொடர்பு வெளிப்படையாகக் காட்டப்பட்டது.
- source_word: לֹא נֶחְקַר
  choice: கணக்கிடப்படவில்லை
  rationale: חקר என்பதன் நிபால் வடிவம் ‘ஆராய்ந்து கண்டறியப்படவில்லை’ அல்லது ‘நிர்ணயிக்கப்படவில்லை’ எனப் பொருள்படும்; எடையின் சூழலில் “கணக்கிடப்படவில்லை” இயல்பான தமிழாகும், அதேவேளை மூலத்தின் சொற்பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִשְׁקַל
  choice: எடை
  rationale: מִשְׁקַל பொதுவான அளவை அல்ல, குறிப்பாக எடையைக் குறிக்கிறது.
- source_word: הַנְּחֹשֶׁת
  choice: வெண்கலம்
  rationale: ஆலய உலோகப் பொருட்களின் சூழலில் נְחֹשֶׁת வழக்கமாக வெண்கலத்தைக் குறிக்கிறது.
