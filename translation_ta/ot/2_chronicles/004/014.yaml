id: 2CH.4.14
reference: 2 Chronicles 4:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אֶת הַ/מְּכֹנ֖וֹת עָשָׂ֑ה וְ/אֶת הַ/כִּיֹּר֥וֹת עָשָׂ֖ה עַל הַ/מְּכֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/014.yaml
  text: He made the stands[b][a], and he made the basins on the stands.
translation:
  language: ta
  text: அவன் தாங்கிகளை[a] செய்தான்; அந்தத் தாங்கிகளின்மேல் தொட்டிகளையும்[b] செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அடித்தளங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் தொட்டிகளைத் தாங்கிய அமைப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இவை கழுவுவதற்குப் பயன்படுத்தப்பட்ட பெரிய பாத்திரங்கள்.
    reason: lexical_clarification
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: தாங்கிகள்
  rationale: இச்சூழலில் מְכוֹנוֹת என்பது தொட்டிகளைத் தாங்குவதற்காக வடிவமைக்கப்பட்ட அமைப்புகளைக் குறிக்கிறது. ‘தாங்கிகள்’ என்பது அவற்றின் செயல்பாட்டை இயல்பான நவீன தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: עָשָׂה
  choice: செய்தான்
  rationale: עָשָׂה என்பதன் பொதுவான நேரடிப் பொருள் ‘செய்தான்’; கைவினை நயத்தைத் தேவையின்றி கூட்டாமல் எபிரெய உரையின் எளிய நடையைப் பேணுகிறது.
- source_word: הַכִּיֹּרוֹת
  choice: தொட்டிகள்
  rationale: כִּיּוֹר என்பது கழுவுவதற்கான பெரிய பாத்திரம் அல்லது தொட்டியைக் குறிக்கிறது. ‘தொட்டிகள்’ என்பது ஆலயப் பொருட்களின் சூழலுக்கு ஏற்ற, பொதுமக்கள் புரிந்துகொள்ளக்கூடிய சொல்.
- source_word: עַל
  choice: மேல்
  rationale: עַל இங்கு தொட்டிகள் தாங்கிகளின் மேற்பகுதியில் அமைந்திருந்த இடத்தொடர்பைக் குறிக்கிறது; ‘மேல்’ இயல்பான தமிழ் இணை.
- source_word: וְאֶת ... וְאֶת
  choice: …; …யும்
  rationale: இணைப்புச் சொற்களுடன் திரும்ப வரும் நேரடிச் செயப்படுபொருள் குறிகளைத் தமிழில் இயல்பான பட்டியல் அமைப்பாகக் காட்ட அரைப்புள்ளியும் ‘-யும்’ விகுதியும் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையிலுள்ள இரண்டு இணை வாக்கியங்களும் பேணப்பட்டுள்ளன; ‘தாங்கிகள்’ மற்றும் ‘தொட்டிகள்’ என்பவை தொன்மையான அல்லது அரிதான ஆலயச் சொற்களுக்குப் பதிலாகத் தெளிவான செயல்பாட்டு இணைகளாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
