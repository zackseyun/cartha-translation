  text: וַ/יַּ֣עַשׂ שֻׁלְחָנוֹת֮ עֲשָׂרָה֒ וַ/יַּנַּח֙ בַּֽ/הֵיכָ֔ל חֲמִשָּׁ֥ה מִ/יָּמִ֖ין וַ/חֲמִשָּׁ֣ה מִ/שְּׂמֹ֑אול וַ/יַּ֛עַשׂ מִזְרְקֵ֥י זָהָ֖ב מֵאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/008.yaml
  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
translation:
  language: ta
  text: அவன் பத்து மேசைகளைச் செய்து, அவற்றை ஆலயத்தில் வலப்புறத்தில் ஐந்தும் இடப்புறத்தில் ஐந்துமாக வைத்தான். மேலும், பொன்னால் செய்யப்பட்ட நூறு கிண்ணங்களையும்[a] செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொற்கலங்கள்” அல்லது “பொன் தெளிப்புக் கிண்ணங்கள்.” இதற்கான எபிரெயச் சொல் ஆலயப் பணியில் பயன்படுத்தப்பட்ட சடங்குக் கலன்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: மேசைகள்
  rationale: இச்சொல் பொதுவாக ‘மேசைகள்’ என்பதைக் குறிக்கிறது; ஆலயப் பொருட்களின் பட்டியல் என்ற சூழலிலும் இதுவே இயல்பான, மிகைப்படுத்தாத பொருள்.
- source_word: וַיַּנַּח
  choice: வைத்தான்
  rationale: ஒரு பொருளை ஓரிடத்தில் அமைத்தல் அல்லது வைத்தல் என்ற நேரடியான செயலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּהֵיכָל
  choice: ஆலயத்தில்
  rationale: இங்கு הֵיכָל என்பது அரண்மனையை அல்ல, ஆலயக் கட்டிடத்தைக் குறிக்கிறது.
- source_word: מִיָּמִין
  choice: வலப்புறத்தில்
  rationale: மூலத்தின் இடஞ்சார்ந்த ‘வலப்புறம்’ என்ற பொருளைப் பேணுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத தென்திசை என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: מִשְּׂמֹאול
  choice: இடப்புறத்தில்
  rationale: ‘வலப்புறத்தில்’ என்பதற்கு இணையாக இயல்பாக அமைந்து, மூலத்தின் நேரடியான இடக்குறிப்பைப் பேணுகிறது.
- source_word: מִזְרְקֵי זָהָב
  choice: பொன்னால் செய்யப்பட்ட கிண்ணங்கள்
  rationale: מִזְרָק என்பது ஆலயச் சடங்குகளில் பயன்படுத்தப்பட்ட கிண்ணம் அல்லது கலத்தைக் குறிக்கலாம். ‘கிண்ணங்கள்’ என்பது வாசிக்க எளிதான பொதுச் சொல்; அதன் சடங்குசார் நுட்பம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵאָה
  choice: நூறு
  rationale: எண்ணிக்கையை நேரடியாகவும் சுருக்கமாகவும் வழங்குகிறது.
