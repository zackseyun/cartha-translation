  text: וְ/אֶת הַ/מְּנֹר֞וֹת וְ/נֵרֹתֵי/הֶ֗ם לְ/בַעֲרָ֧/ם כַּ/מִּשְׁפָּ֛ט לִ/פְנֵ֥י הַ/דְּבִ֖יר זָהָ֥ב סָגֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/020.yaml
  text: the lampstands and their lamps[a], to burn according to the ordinance before the inner sanctuary, of pure gold[b];
translation:
  language: ta
  text: தூய தங்கத்தாலான விளக்குத்தண்டுகளையும் அவற்றின் விளக்குகளையும், உள் திருவறையின் முன்பாக முறைப்படி எரியவைக்கும்படி;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנֹרוֹת
  choice: விளக்குத்தண்டுகள்
  rationale: מְנוֹרָה என்பது பல விளக்குகளைத் தாங்கும் தண்டைக் குறிக்கிறது. ‘விளக்குத்தண்டுகள்’ என்பது ஆலயப் பொருட்களின் சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וְנֵרֹתֵיהֶם
  choice: அவற்றின் விளக்குகள்
  rationale: נֵר இங்கு விளக்குத்தண்டுகளில் வைக்கப்பட்ட விளக்குகளைக் குறிக்கிறது; உடைமைப் பின்னொட்டையும் பன்மையையும் நேரடியாகக் காக்கிறது.
- source_word: לְבַעֲרָם
  choice: எரியவைக்க வேண்டிய
  rationale: இந்த நோக்கவினை வடிவம் விளக்குகளை எரியச் செய்வதைக் குறிக்கிறது. பட்டியல் வாக்கியத்தின் தமிழ்நடைக்கு ஏற்றவாறு நோக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כַּמִּשְׁפָּט
  choice: முறைப்படி
  rationale: מִשְׁפָּט இங்கு வழிபாட்டிற்கென விதிக்கப்பட்ட ஒழுங்கை அல்லது நியமிக்கப்பட்ட முறையைக் குறிக்கிறது. ‘முறைப்படி’ என்பது பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לִפְנֵי הַדְּבִיר
  choice: உள் திருவறைக்கு முன்பாக
  rationale: דְּבִיר ஆலயத்தின் உட்புறப் பரிசுத்த அறையைக் குறிக்கிறது. ‘உள் திருவறை’ அதன் இடவியல் மற்றும் புனிதப் பயன்பாடு இரண்டையும் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: זָהָב סָגוּר
  choice: தூய தங்கத்தாலான
  rationale: זָהָב סָגוּר உயர்தரமாகத் தூய்மைப்படுத்தப்பட்ட தங்கத்தைக் குறிக்கும் மரபுச்சொற்றொடர். ‘தூய தங்கம்’ இயல்பான தமிழில் அதன் பொருளைத் தருகிறது.
- source_word: וְאֶת
  choice: —ஐயும் (வேற்றுமைத் தொடர்ச்சி)
  rationale: இது முந்தைய வசனத்திலிருந்து தொடரும் பட்டியலில் இணைப்புடன் வந்த நேரடிச் செயப்படுபொருள் குறியீடு. தமிழில் ‘விளக்குத்தண்டுகளையும்’ என்ற வடிவில் இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: הַדְּבִיר என்பதன் ஆலயப் பகுதி குறிப்பு
  choice: உள் திருவறை
  alternative: அதிபரிசுத்த இடம்
  rationale: ‘அதிபரிசுத்த இடம்’ என்பது பொருத்தமான மரபுவழி மாற்றாக இருந்தாலும், எபிரெயச் சொல் நேரடியாக ஆலயத்தின் உள் அறையைக் குறிக்கிறது. ஆகவே பிரதான உரை அந்த இடவியல் பொருளைக் காக்கிறது; மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயப் பொருட்களின் பட்டியல் தொடராக வசனம் அமைக்கப்பட்டுள்ளது. மூலத்தின் சொல்வரிசையை இயந்திரமாகப் பின்பற்றாமல், ‘தூய தங்கத்தாலான’ என்பதை அது வருணிக்கும் பொருட்களுக்கு முன் வைத்து இயல்பான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. வாக்கிய முடிவிலுள்ள அரைப்புள்ளி, அடுத்தடுத்த பட்டியல் அமைப்பை உணர்த்துகிறது.
