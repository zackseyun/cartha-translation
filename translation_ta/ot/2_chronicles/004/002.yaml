base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
translation:
  language: ta
  text: அவர் வார்ப்பாகச் செய்யப்பட்ட, ‘கடல்’ எனப்படும் பெரிய தொட்டியைச் செய்தார்.[a] அது வாய்விளிம்பிலிருந்து எதிர் வாய்விளிம்புவரை பத்து முழம் அகலமும், சுற்றிலும் வட்ட வடிவமும், ஐந்து முழம் உயரமும் இருந்தது. முப்பது முழமுள்ள ஓர் அளவுக்கோடு அதைச் சுற்றிலும் சென்றது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘கடல்.’ ஆலயப் பொருட்களில் இருந்த இந்தப் பெரிய தொட்டிக்கு வழங்கப்பட்ட பெயர் இது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘முப்பது முழமுள்ள ஒரு கோடு அதைச் சுற்றிலும் சென்றது.’ இவ்வாறு அதன் சுற்றளவு பண்டைய வழக்கப்படி விவரிக்கப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הַיָּם
  choice: ‘கடல்’ எனப்படும் பெரிய தொட்டி
  rationale: எபிரெயச் சொல் நேரடியாக ‘கடல்’ என்று பொருள்பட்டாலும், இச்சூழலில் அது ஆலயத்தின் பெரிய நீர்த்தொட்டிக்குரிய பெயர். பெயரையும் பொருளையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: מוּצָק
  choice: வார்ப்பிக்கப்பட்ட உலோகத்தால்
  rationale: உலோகத்தை உருக்கி வார்த்துச் செய்யப்பட்ட பொருள் என்ற உற்பத்தி முறையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: பத்து முழம்
  rationale: பண்டைய அளவலகான ‘முழம்’ என்பதைக் காலத்திய வேறு அலகாக மாற்றாமல் தக்கவைக்கிறது.
- source_word: מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  choice: விளிம்பிலிருந்து மறுவிளிம்புவரை
  rationale: பாத்திரத்தின் ஒரு வாய்விளிம்பிலிருந்து எதிர் வாய்விளிம்புவரையிலான விட்ட அளவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עָגוֹל סָבִיב
  choice: சுற்றிலும் வட்ட வடிவம்
  rationale: வடிவத்தையும் அதன் முழுச் சுற்றையும் குறிக்கும் எபிரெயச் சொற்றொடரின் இரு கூறுகளையும் தக்கவைக்கிறது.
- source_word: וְחָמֵשׁ בָּאַמָּה קוֹמָתוֹ
  choice: ஐந்து முழம் உயரம்
  rationale: எபிரெய அளவுக் கூற்றைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְקָו
  choice: ஓர் அளவுக் கயிறு
  rationale: קו என்பதன் கயிறு அல்லது அளவிடும் கோடு என்ற concrete imagery-ஐத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: அதைச் சுற்றி அளந்தது
  rationale: கயிறு பொருளைச் சுற்றிச் சென்றதையும் அதன் மூலம் சுற்றளவு குறிப்பிடப்படுவதையும் இயல்பாக வெளிப்படுத்துகிறது.
