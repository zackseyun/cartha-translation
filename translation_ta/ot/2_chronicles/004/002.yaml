  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கடல்’ என்ற பெயர் தனியாகத் தவறாகப் புரியாதபடி ‘பெரிய தொட்டி’ என்று விளக்கப்பட்டுள்ளது; பண்டைய ‘முழம்’ அலகு மாற்றமின்றித் தக்கவைக்கப்பட்டுள்ளது.
