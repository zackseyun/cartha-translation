translation_notes:
  register: நவீன நிலையான தமிழ்; ஆலயப் பொருட்களின் பட்டியல் நடைக்கு ஏற்ற கண்ணியமான, தெளிவான மொழி. வசனம் முந்தைய பட்டியலின் தொடர்ச்சி என்பதால் தொடக்கத்தில் இணைப்பு உணர்வு தக்கவைக்கப்பட்டுள்ளது; தமிழில் முழுமையான வாசிப்புக்காக சூழலிலிருந்து ‘செய்தான்’ சேர்க்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
