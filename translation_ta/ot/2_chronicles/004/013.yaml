  terminology: “பின்னல்வேலைகள்” suitably conveys the ornamental net/latticework; “மாதுளம்பழ வடிவங்கள்” appropriately identifies the decorative forms without implying actual fruit. “மகுடங்கள்” is intelligible in this architectural context, though it should be understood as pillar capitals rather than royal crowns. The footnotes preserve the lexical alternatives and the rounded/bowl-like imagery.
