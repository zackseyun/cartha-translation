base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
translation:
  language: ta
  text: மேலும், இரண்டு பின்னல்வேலைகளுக்காக[a] நானூறு மாதுளம்பழ வடிவங்களையும்—ஒவ்வொரு பின்னல்வேலைக்கும் இரண்டு வரிசை மாதுளம்பழ வடிவங்களையும்—தூண்களின் உச்சியில் இருந்த மகுடங்களின் இரண்டு கிண்ண வடிவப் பகுதிகளை[b] மூடுவதற்காகச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வலைவேலைகள்.’ எபிரெயச் சொல் மகுடங்களிலிருந்த வலைபோன்ற அலங்கார வேலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் சொற்படி, ‘மகுடங்களின் இரண்டு கிண்ணங்களை.’ இது மகுடங்களின் வட்டமான மேற்பகுதிகளைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמּוֹנִים
  choice: மாதுளம்பழ வடிவங்கள்
  rationale: சொல் நேரடியாக மாதுளம்பழங்களைக் குறித்தாலும், இச்சூழலில் அவை ஆலயத் தூண் மகுடங்களில் அமைந்த அலங்கார வடிவங்கள். சாதாரண வாசகர் உண்மையான பழங்கள் எனப் புரிந்துகொள்ளாதபடி ‘வடிவங்கள்’ சேர்க்கப்பட்டது.
- source_word: אַרְבַּע מֵאוֹת
  choice: நானூறு
  rationale: எண்ணிக்கையை நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: שְּׂבָכוֹת
  choice: பின்னல்வேலைகள்
  rationale: வலைபோலப் பின்னப்பட்ட அலங்காரக் கட்டமைப்பை இயல்பான நவீன தமிழில் குறிக்கிறது; ‘வலைவேலைகள்’ என்பது மாற்று.
- source_word: שְׁנַיִם טוּרִים
  choice: இரண்டு வரிசை
  rationale: ஒழுங்காக அமைக்கப்பட்ட இரண்டு வரிசைகள் என்ற எபிரெயச் சொல்லின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: ஒவ்வொரு பின்னல்வேலைக்கும்
  rationale: சொல்லுக்கு நெருக்கமாக ‘ஒரு பின்னல்வேலைக்கு’ என்றாலும், இரண்டு வேலைகளுக்கும் பகிர்ந்தளிக்கும் ஒருமை கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְכַסּוֹת
  choice: மூடுவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சத்தின் நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: גֻּלּוֹת
  choice: கிண்ண வடிவப் பகுதிகள்
  rationale: மகுடங்களின் வட்டமான அல்லது கிண்ணம்போன்ற மேற்பகுதிகளைச் சுட்டும் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: כֹּתָרוֹת
  choice: மகுடங்கள்
  rationale: தூண்களின் உச்சியிலுள்ள கட்டடக்கலை capitals என்பதற்கான புரியத்தக்க தமிழ்; அரச மகுடங்கள் அல்ல என்பதைச் சூழல் தெளிவாக்குகிறது.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: தூண்களின் உச்சியில்
  rationale: சொல்லுக்கு நேராக ‘தூண்களின் முகப்பு/மேற்பரப்பின்மேல்’; மகுடங்களின் இடத்தைக் குறிக்கும் கட்டடச் சூழலில் ‘உச்சியில்’ என்பது தெளிவான இயல்பான தமிழ்.
