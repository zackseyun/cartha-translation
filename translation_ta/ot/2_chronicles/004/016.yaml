source:
  edition: WLC
  text: וְ/אֶת הַ֠/סִּירוֹת וְ/אֶת הַ/יָּעִ֤ים וְ/אֶת הַ/מִּזְלָגוֹת֙ וְ/אֶת כָּל כְּלֵי/הֶ֔ם עָשָׂ֞ה חוּרָ֥ם אָבִ֛יו לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מָרֽוּק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
translation:
  language: ta
  text: ஊராம்-அபி[a], பானைகளையும் சாம்பல் அகற்றும் வாரிகளையும் முள்கரண்டிகளையும் அவற்றோடு தொடர்புடைய எல்லாக் கருவிகளையும் சாலொமோன் அரசனுக்காக, யாவேயின் ஆலயத்திற்காக, மெருகூட்டப்பட்ட வெண்கலத்தால்[b] செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “ஊராம்-அபி”; இதை “ஊராம், அவன் தந்தை” என்றும் பிரித்துப் பொருள்கொள்ளலாம். இங்கு இது கைவினைஞரின் பெயர் அல்லது பட்டமாக இருக்க வாய்ப்பு அதிகம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது “பளபளப்பாக்கப்பட்ட வெண்கலத்தால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: பானைகள்
  rationale: இச்சொல் பொதுவாகச் சமையல் அல்லது பிற பயன்பாட்டுக்குரிய பானைகளைக் குறிக்கிறது; ஆலயக் கருவிகளின் பட்டியலில் ‘பானைகள்’ என்பது இயல்பான, பரந்த பொருளுடைய மொழிபெயர்ப்பு.
- source_word: הַיָּעִים
  choice: சாம்பல் வாரும் கரண்டிகள்
  rationale: பலியிடும் இடத்திலிருந்து சாம்பலை அகற்ற அல்லது நெருப்புத்தணலைக் கையாளப் பயன்படும் கருவிகளை இச்சொல் குறிக்கிறது; அவற்றின் பணியைத் தெளிவுபடுத்தும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַמִּזְלָגוֹת
  choice: முள்கரண்டிகள்
  rationale: முனைகள் கொண்ட முட்கருவிகளை இச்சொல் குறிக்கிறது. ‘முள்கரண்டிகள்’ என்பது மிகையாகக் குறிப்பிட்ட பயன்பாட்டைத் திணிக்காமல் வடிவத்தைத் தெளிவாகச் சொல்கிறது.
- source_word: כָּל כְּלֵיהֶם
  choice: அவற்றிற்குரிய மற்ற எல்லாக் கருவிகள்
  rationale: כְּלִי என்பது பாத்திரங்கள், சாதனங்கள், கருவிகள் எனப் பரந்த பொருள் தருகிறது. பட்டியலிடப்பட்ட பொருட்களோடு தொடர்புடைய எஞ்சிய சாதனங்களைக் குறிக்கும் இயல்பான தமிழாக்கம் இது; ‘மற்ற’ என்பது தமிழில் பட்டியலின் தொகுப்புப் பொருளைத் தெளிவாக்குகிறது.
- source_word: חוּרָם אָבִיו
  choice: ஊராம்-அபி
  rationale: இச்சூழலில் இது கைவினைஞரின் கூட்டுப்பெயர் அல்லது பட்டமாக இருப்பதற்கே வாய்ப்பு அதிகம். இருப்பினும் ‘ஊராம், அவன் தந்தை’ என்று பிரித்துப் புரிந்துகொள்ளும் இலக்கண வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசனுக்கு
  rationale: לְ இங்கு அரசனுக்காக அல்லது அவனது ஆணையின்படி செய்யப்பட்டதைத் தெரிவிக்கிறது; தமிழ் வேற்றுமை உருபு அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְבֵית יְהוָה
  choice: யாவேயின் ஆலயத்திற்காக
  rationale: בַּיִת என்பதன் சொற்பொருள் ‘வீடு’ என்றாலும், இங்கு அது ஆலயத்தைக் குறிக்கிறது. நவீன தமிழில் ‘ஆலயம்’ உடனடியாகவும் இயல்பாகவும் புரிகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் நெருங்கிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נְחֹשֶׁת מָרוּק
  choice: மெருகூட்டப்பட்ட வெண்கலம்
  rationale: נְחֹשֶׁת இச்சூழலில் வெண்கல உலோகப்பணியையும் מָרוּק மெருகிடப்பட்ட அல்லது பளபளப்பாக்கப்பட்ட நிலையையும் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்ற ஒலிபெயர்ப்பு அதனைப் பொதுப்பட்டமாக மாற்றாமல் காக்கிறது.
- issue: חוּרָם אָבִיו என்பதன் பொருள்
  choice: ஊராம்-அபி என்ற கூட்டுப்பெயர் அல்லது பட்டம்
  alternative: ஊராம், அவன் தந்தை
  rationale: நாளாகம ஆசிரியரின் பயன்பாட்டிலும் இச்சூழலிலும் இது கைவினைஞரின் பெயர் அல்லது பட்டமாகச் செயல்படுவது பொருத்தமானது; எனினும் சொற்களைத் தனித்தனியாக வாசிக்கும் மாற்றுவாய்ப்பு உண்மையானதாக இருப்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ஆலயக் கருவிகளுக்குத் தொழில்நுட்பத் துல்லியமும் வாசிப்பின் இயல்பும் சமநிலைப்படுத்தப்பட்டுள்ளன; மூலத்தின் வினை இறுதிக் கட்டமைப்பைத் தமிழுக்கு இயல்பாக வைத்திருக்கிறது.
