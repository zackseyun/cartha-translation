source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/אֵת֙ מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָנ֔וֹת וַ/עֲלֵי/הֶ֖ם לֶ֥חֶם הַ/פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
translation:
  language: ta
  text: 'சாலொமோன் இறைவனுடைய ஆலயத்திற்குரிய எல்லாப் பொருட்களையும் செய்தான்: பொன் பலிபீடத்தையும், மேசைகளையும், அவற்றின்மேல் வைக்கப்பட்டிருந்த முன்னிலையின் அப்பத்தையும்[a] செய்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “முன்னிலையின் அப்பம்”; அதாவது, இறைவனுடைய முன்னிலையில் வைக்கப்படும் அப்பம். மரபாக, “சமுகத்து அப்பம்” என்றும் வழங்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பதன் பொதுவான பொருள் ‘செய்/உருவாக்கு’. ஆலயப் பொருட்களின் பட்டியல் சூழலில் ‘செய்தான்’ இயல்பாகவும் மூலத்துக்கு அணுக்கமாகவும் உள்ளது.
- source_word: כָּל הַכֵּלִים
  choice: எல்லாப் பொருட்களையும்
  rationale: כֵּלִים இங்கு வழிபாட்டுக்குரிய கருவிகள், பாத்திரங்கள், தளவாடங்கள் ஆகியவற்றை உள்ளடக்கும் பொதுப்பெயர். ‘பொருட்கள்’ தமிழில் இந்த விரிந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: இறைவனுடைய ஆலயம்
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி ‘இறைவனுடைய வீடு’ என்றாலும், இச்சூழலில் அது ஆலயத்தையே குறிக்கிறது. நவீன தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מִזְבַּח הַזָּהָב
  choice: பொன் பலிபீடம்
  rationale: ‘பொன்னாலான பலிபீடம்’ என்னும் பொருளைச் சுருக்கமாகவும் வழிபாட்டுச் சூழலுக்கேற்றவாறும் தருகிறது.
- source_word: הַשֻּׁלְחָנוֹת
  choice: மேசைகள்
  rationale: பன்மை வடிவை நேரடியாகப் பாதுகாக்கும் இயல்பான தமிழ் இணை.
- source_word: וַעֲלֵיהֶם
  choice: அவற்றின்மேல் வைக்கப்படும்
  rationale: அப்பம் மேசைகளின்மேல் இருப்பதைக் குறிக்கும் இடவுறவைத் தெளிவான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: לֶחֶם הַפָּנִים
  choice: திருமுன்னிலை அப்பம்
  rationale: ‘முன்னிலையின் அப்பம்’ என்ற எபிரெய வழிபாட்டுச் சொல்லின் கருத்தைப் பாதுகாக்கிறது; ‘திரு-’ இறைமுன்னிலையைக் குறிக்கும் மரியாதைச் சுட்டாக அமைந்து, தமிழில் தொழில்நுட்ப வழிபாட்டுச் சொல்லாக இயல்பாக ஒலிக்கிறது.
theological_decisions:
- issue: בֵּית הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: இறைவனுடைய ஆலயம்
  alternative: இறைவனுடைய வீடு
  rationale: எழுத்துப்படியான ‘வீடு’ என்ற உருவகத்தைவிட இச்சூழலில் குறிக்கப்படும் ஆலயத்தை நவீன வாசகருக்குத் தெளிவாகக் காட்டுகிறது; கருத்தில் கோட்பாட்டு விரிவாக்கம் செய்யவில்லை.
- issue: לֶחֶם הַפָּנִים என்பதன் மொழிபெயர்ப்பு
  choice: திருமுன்னிலை அப்பம்
  alternative: சமுகத்து அப்பம் / இறைவனின் முன்னிலையில் வைக்கப்படும் அப்பம்
  rationale: மூலத்திலுள்ள ‘முன்னிலை’ என்னும் கருத்தையும் அதன் வழிபாட்டுச் சிறப்பையும் சுருக்கமாகப் பாதுகாக்கிறது. அடிக்குறிப்பு அதன் பொருளை வெளிப்படையாக விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. பட்டியலின் எபிரெய இணைப்பமைப்பு தமிழில் இயல்பாக இருக்க வினைச்சொல் இறுதியில் மீண்டும் இடப்பட்டுள்ளது. ‘ஆலயத்திற்குரிய’ என்பது பொருட்கள் ஆலயத்துக்காக/ஆலயத்தைச் சேர்ந்தவை என்ற மூலக் கட்டமைப்பின் பொருளைப் பாதுகாக்கிறது.
