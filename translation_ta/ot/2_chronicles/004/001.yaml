base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/001.yaml
  text: He made a bronze altar[a], twenty cubits its length and twenty cubits its width, and ten cubits its height.
translation:
  language: ta
  text: அவர் வெண்கலப் பலிபீடம்[a] ஒன்றைச் செய்தார். அது இருபது முழம் நீளமும், இருபது முழம் அகலமும், பத்து முழம் உயரமும் கொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘செம்புப் பலிபீடம்’; மரபுவழியாக, ‘பித்தளைப் பலிபீடம்.’ எபிரெயச் சொல் נְחֹשֶׁת செம்பையோ செம்புக் கலப்பு உலோகத்தையோ குறிக்கலாம்; ஆலயப் பொருட்களின் சூழலில் பொதுவாக ‘வெண்கலம்’ என மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: அவர் செய்தார்
  rationale: עשה என்பதன் wayyiqtol வடிவம் கதை நிகழ்வை அடுத்த கட்டத்துக்கு நகர்த்தும் எளிய இறந்தகாலச் செயலைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்க தொடக்க இணைப்புச்சொல் வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: מִזְבַּח
  choice: பலிபீடம்
  rationale: பலிகள் செலுத்தப்படும் அமைப்பைக் குறிக்கும் מזבח என்பதற்கான இயல்பான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: ஆலயப் பொருட்களின் சூழலில் נְחֹשֶׁת என்பதற்கு ‘வெண்கலம்’ என்பது வழக்கமான நவீனத் தமிழ் மொழிபெயர்ப்பு; ‘செம்பு’ என்பதும் மூலச்சொல்லின் சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עֶשְׂרִים אַמָּה
  choice: இருபது முழம்
  rationale: பண்டைய அளவலகான אַמָּה மாற்றிக் கணக்கிடப்படாமல் ‘முழம்’ எனத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: אָרְכּוֹ
  choice: நீளம்
  rationale: பலிபீடத்தின் நீள அளவைக் குறிக்கும் பெயர்ச்சொல்; தமிழில் அளவுகளை ஒரே தொடராக இயல்பாக வழங்க ‘நீளம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: רָחְבּוֹ
  choice: அகலம்
  rationale: கட்டமைப்பின் குறுக்கு அளவைக் குறிக்கும் இயல்பான நவீனத் தமிழ் கட்டடவியல் சொல்.
- source_word: וְעֶשֶׂר אַמּוֹת
  choice: பத்து முழம்
  rationale: எண்ணும் பண்டைய அளவலகும் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளன.
- source_word: קוֹמָתוֹ
  choice: உயரம்
  rationale: உயிரற்ற கட்டமைப்பைப் பற்றிய இச்சூழலில் קוֹמָה அதன் உயரத்தைக் குறிக்கிறது.
