translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மொழியின் அளவுக் கூறுகளைச் சொற்சொல்லாக அடுக்காமல், தமிழில் இயல்பான ‘நீளமும்… அகலமும்… உயரமும் கொண்டிருந்தது’ என்ற அமைப்பு பயன்படுத்தப்பட்டுள்ளது. ‘முழம்’ என்ற பண்டைய அளவலகு மாற்றமின்றித் தக்கவைக்கப்பட்டுள்ளது.
