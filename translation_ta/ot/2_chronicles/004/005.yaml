source:
  edition: WLC
  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת/וֹ֙ כְּ/מַעֲשֵׂ֣ה שְׂפַת כּ֔וֹס פֶּ֖רַח שֽׁוֹשַׁנָּ֑ה מַחֲזִ֣יק בַּתִּ֔ים שְׁלֹ֥שֶׁת אֲלָפִ֖ים יָכִֽיל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
translation:
  language: ta
  text: அதன் தடிமன் ஒரு கை அகலம்[a]. அதன் விளிம்பு ஒரு கோப்பையின் விளிம்பின் வேலைப்பாட்டைப் போல, லில்லி மலரைப் போல இருந்தது[b]. அது மூவாயிரம் பாத் அளவு கொள்ளக்கூடியதாக இருந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கை அகலம்’ என்பது கையின் அகலத்தை அடிப்படையாகக் கொண்ட ஒரு பண்டைய நீள அளவு.
    reason: cultural_note
  - marker: b
    text: இங்குள்ள எபிரெய மலர்ப்பெயர் பொதுவாக ‘லில்லி’ என மொழிபெயர்க்கப்படுகிறது; அது குறிக்கும் துல்லியமான தாவரவியல் இனம் உறுதியாகத் தெரியவில்லை.
    reason: translation_note
  - marker: c
    text: ‘பாத்’ என்பது பண்டைய எபிரெய திரவ அளவு. 1 இராஜாக்கள் 7:26 இத்தொட்டி இரண்டாயிரம் பாத் கொள்ளும் எனக் கூறுகிறது; இங்கு மூவாயிரம் பாத் என உள்ளது. இது முழுக் கொள்ளளவுக்கும் வழக்கமாக நிரப்பப்படும் அளவுக்கும் உள்ள வேறுபாட்டையோ, உரை அல்லது மரபு வேறுபாட்டையோ பிரதிபலிக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: அதன் தடிமன்
  rationale: வார்ப்புக் கடல்தொட்டியின் சுவருடைய பருமனைக் குறிப்பதால், நவீனத் தமிழில் இயல்பான ‘தடிமன்’ பயன்படுத்தப்பட்டது.
- source_word: טֶפַח
  choice: ஓர் உள்ளங்கை அகலம்
  rationale: இது கையின் அகலத்தை அடிப்படையாகக் கொண்ட சிறிய பண்டைய அளவு; ‘உள்ளங்கை அகலம்’ அதன் பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: שְׂפָתוֹ / שְׂפַת כּוֹס
  choice: அதன் விளிம்பு / ஒரு கோப்பையின் விளிம்பு
  rationale: பாத்திரத்தின் மேல் ஓரத்தைக் குறிக்கும் சொல்லை இரு இடங்களிலும் ‘விளிம்பு’ என மொழிபெயர்த்து, எபிரெயச் சொல்லின் மீள்வருகையும் ஒப்புமையும் காக்கப்பட்டன.
- source_word: כְּמַעֲשֵׂה
  choice: வடிவமைக்கப்பட்டிருந்தது
  rationale: விளிம்பின் கைவினை வடிவத்தைக் குறிக்கும் சொற்றொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது; வெறும் தோற்ற ஒப்புமையைக் காட்டிலும் செய்யப்பட்ட வடிவத்தைப் பாதுகாக்கிறது.
- source_word: פֶּרַח שׁוֹשַׁנָּה
  choice: மலர்ந்த அல்லிப்பூ
  rationale: மலரின் மலர்ந்த வடிவத்தைத் தெளிவாகவும் காட்சியுணர்வுடனும் தருகிறது; துல்லியமான தாவரவியல் இனத்தின் நிச்சயமின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: מַחֲזִיק ... יָכִיל
  choice: கொள்ளும்
  rationale: பங்கேற்பு வடிவமும் வினையும் சேர்ந்து தொட்டியின் கொள்ளளவை வலியுறுத்துகின்றன; தமிழில் தேவையற்ற இரட்டிப்பைத் தவிர்த்து ஒரே இயல்பான வினையால் பொருள் தரப்பட்டது.
- source_word: בַּתִּים שְׁלֹשֶׁת אֲלָפִים
  choice: மூவாயிரம் பாத் அளவு
  rationale: பண்டைய எபிரெய திரவ அளவான ‘பாத்’ மாற்றமின்றி ஒலிபெயர்க்கப்பட்டு, எண்ணிக்கை நேரடியாகக் காக்கப்பட்டது.
theological_decisions:
- issue: 1 இராஜாக்கள் 7:26-இல் காணப்படும் கொள்ளளவு எண்ணிக்கையுடன் வேறுபாடு
  choice: நாளாகமத்தின் எபிரெய உரையிலுள்ள ‘மூவாயிரம்’ அப்படியே வைக்கப்பட்டது
  alternative: 1 இராஜாக்கள் 7:26-க்கு ஏற்ப ‘இரண்டாயிரம்’ என ஒத்திசைத்தல்
  rationale: சாட்சியமுள்ள எபிரெய மூல உரையை அமைதியாகத் திருத்தாமல், இணை வசனத்தின் வேறுபாட்டை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுவது உரைநேர்மையையும் உண்மையான பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டது. அளவுப் பெயரான ‘பாத்’ ஒலிபெயர்க்கப்பட்டு விளக்கப்பட்டது; எபிரெய மூலத்தின் இரண்டு ஒப்புமைகளும் கொள்ளளவு எண்ணிக்கையும் பாதுகாக்கப்பட்டன.
