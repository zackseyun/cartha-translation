base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
translation:
  language: ta
  text: அதன் கீழே, அதைச் சுற்றிலும் எருதுகளின் உருவங்கள்[a] இருந்தன; ஒரு முழத்திற்கு பத்து[b] என அவை கடலைச் சுற்றி அமைந்திருந்தன. அந்த எருது உருவங்கள் இரண்டு வரிசைகளாக இருந்தன; கடல் வார்க்கப்பட்டபோது அவையும் அதனோடு ஒரே வார்ப்பாக வார்க்கப்பட்டன[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருதுகளின் சாயல்கள்.” எபிரெயச் சொல் உயிருள்ள விலங்குகளை அல்ல, எருது வடிவிலான அலங்கார உருவங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “முழத்திற்கு பத்து”; சுற்றளவில் ஒவ்வொரு முழ நீளத்திற்கும் பத்து உருவங்கள் இருந்தன என்பது இதன் பொருளாக இருக்கலாம்.
    reason: cultural_note
  - marker: c
    text: எபிரெயத்தில், “அதன் வார்ப்பில் வார்க்கப்பட்டவை”; அதாவது, கடலோடு ஒரே உலோக வார்ப்பின் பகுதியாக உருவாக்கப்பட்டவை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְמוּת בְּקָרִים
  choice: எருதுகளின் உருவங்கள்
  rationale: דְּמוּת என்பது உயிருள்ள எருதுகளை அல்ல, அவற்றின் வடிவில் செய்யப்பட்ட அலங்கார உருவங்களைக் குறிக்கிறது; בָּקָר இச்சூழலில் உலோகத்தில் வடிக்கப்பட்ட எருது வடிவங்களைக் குறிக்கிறது.
- source_word: תַּחַת לוֹ
  choice: அதன் கீழே
  rationale: ‘கடல்’ எனப்படும் பெரிய தொட்டியின் கீழ்ப்பகுதியில் உருவங்கள் இருந்த இடத்தை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: סָבִיב סָבִיב
  choice: அதைச் சுற்றிலும்
  rationale: எபிரெயச் சொல்லின் இரட்டிப்பு முழுவதுமாகச் சுற்றியிருந்ததை வலியுறுத்துகிறது; தமிழில் ‘சுற்றிலும்’ அந்த வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: ஒரு முழத்திற்கு பத்து
  rationale: சுற்றளவில் ஒவ்வொரு முழ நீளத்திற்கும் பத்து உருவங்கள் இருந்த எண்ணிக்கை விகிதத்தை, மூலத்தின் சுருக்கத்தையும் ஓரளவு தக்கவைத்து வெளிப்படுத்துகிறது.
- source_word: הַיָּם
  choice: கடல்
  rationale: ஆலயத்திலிருந்த பெரிய வார்ப்புத் தொட்டிக்கான தனிப்பெயர்போன்ற பயன்பாட்டை நேரடியாகத் தக்கவைக்கிறது.
- source_word: שְׁנַיִם טוּרִים
  choice: இரண்டு வரிசைகளாக
  rationale: טוּרִים என்பது ஒழுங்காக அமைந்த வரிசைகளைக் குறிக்கிறது; தமிழில் இந்த அமைப்பு இயல்பாக உள்ளது.
- source_word: יְצוּקִים בְּמֻצַקְתּוֹ
  choice: கடல் வார்க்கப்பட்டபோதே அவையும் அதனுடன் ஒன்றாக வார்க்கப்பட்டிருந்தன
  rationale: உருவங்கள் பின்னர் இணைக்கப்படாமல், தொட்டியோடு ஒரே வார்ப்பாக உருவாக்கப்பட்ட உலோகவேலைச் சூழலைத் தெளிவாகச் சொல்கிறது.
