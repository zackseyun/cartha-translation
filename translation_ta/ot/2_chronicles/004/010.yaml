  text: וְ/אֶת הַ/יָּ֗ם נָתַ֞ן מִ/כֶּ֧תֶף הַ/יְמָנִ֛ית קֵ֖דְמָ/ה מִ/מּ֥וּל נֶֽגְבָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/010.yaml
  text: And he set the Sea at the southeast side[a], facing south.
translation:
  language: ta
  text: அவன் கடலைத் தென்கிழக்குப் பக்கத்தில்[a], தெற்குக்கு எதிரே வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பொருளாக, “வலப்புறத்தில் கிழக்குப் புறமாக, தெற்குக்கு எதிரே” என்று உள்ளது. எபிரெய இடவியல் திசைமுறையில் பொதுவாகக் கிழக்கு நோக்கி நிற்பது கருதப்படுவதால், வலப்புறம் தெற்காகும்; ‘கிழக்குப் புறமாக’ என்பதுடன் சேர்ந்து இச்சொற்றொடர் தென்கிழக்குப் பக்கத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: அவன் … தொட்டியை
  rationale: וְ தொடர்ச்சியைச் சுட்டுகிறது; אֵת நேரடியாக மொழிபெயர்க்கப்படாத குறித்த செயப்படுபொருள் அடையாளம். தமிழில் இயல்பான வாக்கிய அமைப்புக்காக வெளிப்படையான ‘மேலும்’ சேர்க்கப்படவில்லை.
- source_word: הַיָּם
  choice: கடல் தொட்டி
  rationale: ஆலயத்திலிருந்த பெரிய வெண்கல நீர்த்தொட்டிக்கு எபிரெயம் ‘கடல்’ என்ற பெயரைப் பயன்படுத்துகிறது. ‘கடல் தொட்டி’ என்பது அந்தப் பெயரையும் பொருளின் தன்மையையும் தெளிவாகக் காக்கிறது.
- source_word: נָתַן
  choice: வைத்தான்
  rationale: ஒரு பொருளை குறிப்பிட்ட இடத்தில் நிறுவி வைப்பதை இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: מִכֶּתֶף
  choice: பக்கத்தில்
  rationale: כָּתֵף என்பதன் அடிப்படைப் பொருள் ‘தோள்’; இடவியல் பயன்பாட்டில் அது ‘பக்கம்’ அல்லது ‘ஓரம்’ என்பதைக் குறிக்கிறது.
- source_word: הַיְמָנִית קֵדְמָה
  choice: தென்கிழக்குப் பக்கத்தில்
  rationale: கிழக்கு நோக்கி நிற்பதை அடிப்படையாகக் கொண்ட எபிரெய திசைமுறையில் ‘வலப்பக்கம்’ தெற்கைக் குறிக்கும்; அதனுடன் ‘கிழக்கு நோக்கி’ என்பதும் சேர்ந்து தென்கிழக்குப் பகுதியைக் குறிக்கிறது. மூலத்தின் சொற்சார் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִמּוּל נֶגְבָּה
  choice: தெற்கு நோக்கி
  rationale: מִמּוּל என்பது எதிர்நோக்கிய இடவுறவையும் נֶגְבָּה தெற்குத் திசையையும் குறிக்கின்றன; தமிழில் ‘தெற்கு நோக்கி’ என்பது இந்த அமைப்பை இயல்பாக வெளிப்படுத்துகிறது.
