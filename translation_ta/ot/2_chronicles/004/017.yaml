  text: In the plain of the Jordan the king cast them in the clay ground[a], between Sukkoth and Zeredah.
translation:
  language: ta
  text: யோர்தான் சமவெளியில், அடர்ந்த களிமண் நிலத்தில், சுக்கோத்துக்கும் செரேதாவுக்கும் இடையே அரசன் அவற்றை வார்த்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 இராஜாக்கள் 7:46-இல் உள்ள இணைப் பகுதியில் இந்த இடம் ‘சரேத்தான்’ என்று அழைக்கப்படுகிறது. இங்கே நாளாகமம் ‘செரேதா’ என்று வாசிக்கிறது; இது அதே இடப்பெயரின் வேறொரு வடிவமாக இருக்கலாம்.
    reason: textual_variant
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: யோர்தான் சமவெளியில்
  rationale: כִּכָּר என்பது வட்டாரத்தையோ சமவெளிப் பகுதியையோ குறிக்கலாம்; இப்புவியியல் சூழலில் ‘சமவெளி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְצָקָם
  choice: அவற்றை வார்ப்பித்தான்
  rationale: יצק இங்கு வெண்கலப் பொருட்களை உருக்கி வார்ப்பதைக் குறிக்கிறது. எபிரெய வினைச் சொல்லின் causative அல்லாத வடிவம் இருந்தாலும், அரசன் தனிப்பட்ட முறையில் வார்க்கவில்லை; அவனது ஆணையின்படி வேலை நடைபெற்றது என்பதை இயல்பான தமிழில் ‘வார்ப்பித்தான்’ தெரிவிக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் சாலொமோனைக் குறிக்கும் definite noun; பெயரைச் சேர்க்காமல் மூலத்தின் ‘அரசன்’ என்ற வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: בַּעֲבִי הָאֲדָמָה
  choice: களிமண் நிலத்தில்
  rationale: עֲבִי என்பதன் அடிப்படைப் பொருள் தடிமன் அல்லது அடர்த்தி; אֲדָמָה உடன் இங்கு உலோக வார்ப்புக்கு ஏற்ற அடர்ந்த களிமண் நிலத்தைக் குறிக்கிறது.
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  choice: சுக்கோத்துக்கும் செரேதாவுக்கும் இடையே
  rationale: இடப்பெயர்கள் எபிரெய வடிவத்திற்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன; நாளாகமத்தின் צְרֵדָתָה ‘செரேதா’ என வழங்கப்படுகிறது.
