base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/006.yaml
  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
translation:
  language: ta
  text: அவர் பத்துக் கழுவுத் தொட்டிகளைச்[a] செய்து, ஐந்தை வலப்பக்கத்திலும் ஐந்தை இடப்பக்கத்திலும், அவற்றில் கழுவுவதற்காக வைத்தார்; அவற்றில் எரிபலிக்கானவற்றை அலசுவார்கள்[b]. ஆனால் ‘கடல்’[c] ஆசாரியர்கள் அதில் கழுவிக்கொள்வதற்காக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கழுவும் கலன்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் சொல்லுக்கு சொல், ‘எரிபலியின் செயல்.’ எரிபலியை ஆயத்தப்படுத்துவதுடன் தொடர்புடைய பொருட்களை இத்தொடர் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘கடல்’ என்பது ஆலயத்திலிருந்த பெரிய வெண்கல நீர்த்தேக்கத்தின் பெயர்; அது ஆசாரியர்கள் கழுவிக்கொள்வதற்காகப் பயன்படுத்தப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹרִים
  choice: கழுவுத் தொட்டிகள்
  rationale: ஆலயப் பணியில் பயன்படுத்தப்பட்ட பெரிய கழுவும் கலன்களைக் குறிக்கிறது. ‘கழுவுத் தொட்டிகள்’ என்பது நவீன வாசகர்களுக்குத் தெளிவாகவும் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: מִיָּמִין / מִשְּׂמֹאול
  choice: வலப்பக்கத்தில் / இடப்பக்கத்தில்
  rationale: இட அமைப்பைக் குறிக்கும் எபிரெயச் சொற்களை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: לְרָחְצָה
  choice: கழுவுவதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சப் பொருளைப் பாதுகாக்கிறது; வாக்கியத்தில் அடுத்து வரும் அலசும் செயல் இதன் பயன்பாட்டை விளக்குகிறது.
- source_word: מַעֲשֵׂה הָעוֹלָה
  choice: எரிபலிக்குப் பயன்படுத்தப்பட்டவை
  rationale: சொல்லுக்கு சொல் ‘எரிபலியின் வேலை/செயல்’ என்ற தெளிவற்ற தொடராகும். சூழலில் எரிபலியை ஆயத்தப்படுத்துவதுடன் தொடர்புடைய பொருட்களை இது குறிக்கிறது; அதைக் குறைந்த அளவு விளக்கத்துடன் இயல்பான தமிழில் தருகிறது.
- source_word: יָדִיחוּ
  choice: அலசுவார்கள்
  rationale: דיח என்பதன் ஹிஃபீல் வடிவம் கழுவியகற்றுதல் அல்லது அலசுதல் என்னும் பொருளைத் தருகிறது. நிறைவுறாத வினைவடிவத்தின் வழக்கமான செயல் நுட்பத்தை ‘அலசுவார்கள்’ பாதுகாக்கிறது.
- source_word: וְהַיָּם
  choice: ‘கடல்’ எனப்பட்ட பெரிய தொட்டி
  rationale: பெரிய வெண்கல நீர்த்தேக்கத்துக்குரிய தனிப்பெயரான ‘கடல்’ என்பதைக் காக்கிறது; அதேவேளையில் நவீன வாசகர் அதை இயற்கைக் கடலாகத் தவறாகப் புரிந்துகொள்ளாதபடி அதன் வடிவத்தையும் சுருக்கமாகத் தெளிவுபடுத்துகிறது.
- source_word: לַכֹּהֲנִים
  choice: ஆசாரியர்கள் … கழுவிக்கொள்வதற்காக
  rationale: ஆசாரியர்களின் பயன்பாடு அல்லது நோக்கம் என்பதைக் குறிக்கும் தத்திவுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
