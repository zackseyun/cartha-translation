translation_notes:
  register: நவீன பொதுத்தமிழில், ஆலயச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘எரிபலிக்குப் பயன்படுத்தப்பட்டவை’ என்ற சொற்றொடர் மூலத்தின் சுருக்கமான அமைப்பை விளக்கினாலும், அது குறிக்கும் பொருட்களை அளவுக்கு மீறி வரையறுக்கவில்லை. ‘அலசுவார்கள்’ வழக்கமாக நிகழ்ந்த செயலை வெளிப்படுத்துகிறது.
