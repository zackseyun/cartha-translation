translation:
  language: ta
  text: பூவடிவ அலங்காரமும்[a], விளக்குகளும், இடுக்கிகளும் தங்கம்—நிறைவாக்கப்பட்ட தங்கம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்கு சொல், ‘பூ.’ இங்கு பூவடிவ அலங்கார வேலைப்பாட்டைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயச் சொற்றொடர் அரிதானதும் பொருள் உறுதியில்லாததும் ஆகும்; சொல்லுக்கு சொல், ‘தங்கம்—அது தங்கத்தின் முழுமைகள்.’ இது முழுமையாகச் சுத்திகரிக்கப்பட்ட தங்கத்தையோ, நிறைவாக முடிக்கப்பட்ட தங்க வேலைப்பாட்டையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַפֶּרַח
  choice: பூ அலங்காரங்களும்
  rationale: פֶּרַח என்பதன் அடிப்படைப் பொருள் ‘பூ/மலர்.’ ஆலய விளக்குத்தண்டுகளின் சூழலில் இது பூவடிவ அலங்கார வேலைப்பாட்டைச் சுட்டுவது இயல்பு. எபிரேய ஒருமை இங்கு தொகுப்புப்பொருளில் புரிந்துகொள்ளப்படுகிறது.
- source_word: וְהַנֵּרוֹת
  choice: விளக்குகளும்
  rationale: נֵרוֹת என்பது விளக்குகளைக் குறிக்கும் வழக்கமான பன்மைச் சொல்; ஆலயப் பொருட்களின் பட்டியலிலும் இதுவே நேரடியான, இயல்பான மொழிபெயர்ப்பு.
- source_word: וְהַמֶּלְקַחַיִם
  choice: இடுக்கிகளும்
  rationale: מֶלְקַחַיִם என்பது திரி அல்லது நெருப்புத்துண்டைப் பற்றிப் பிடிக்கப் பயன்படும் கருவி. ‘இடுக்கிகள்’ அதன் வடிவத்தையும் பொதுச் செயலையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: זָהָב
  choice: தங்கத்தால்
  rationale: முதல் זָהָב பட்டியலிடப்பட்ட பொருட்களின் மூலப்பொருளைக் குறிப்பிடுகிறது; தமிழில் கருவிப் பொருளை இயல்பாகக் காட்ட ‘தங்கத்தால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הוּא מִכְלוֹת זָהָב
  choice: முழுமையாகப் பக்குவப்படுத்தப்பட்ட தங்கத்தால்
  rationale: மிக அரிதும் கடினமுமான מִכְלוֹת என்ற வடிவம் ‘முழுமை/நிறைவு’ என்ற கருத்தைத் தருவதாகத் தெரிகிறது. அது தங்கத்தின் முழுப் பக்குவம் அல்லது நிறைவான வேலைப்பாட்டைக் குறிக்கலாம்; எனவே ‘தூய்மையானது’ என்று மட்டும் தீர்மானிக்காமல் மூலத்தின் அழுத்தமும் தெளிவின்மையும் பாதுகாக்கப்பட்டன.
