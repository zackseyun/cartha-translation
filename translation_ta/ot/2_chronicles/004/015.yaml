translation_notes:
  register: நவீன செந்தமிழில், பட்டியல் தன்மையைத் தக்கவைத்து இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வசனம் தொடர்ச்சிப் பட்டியலின் துணைச்சொற்றொடராக இருப்பினும், தமிழில் முழு வாக்கியமாக வாசிக்க முந்தைய சூழலிலிருந்து ‘செய்தான்’ சேர்க்கப்பட்டுள்ளது.
