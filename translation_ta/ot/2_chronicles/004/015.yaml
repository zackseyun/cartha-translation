translation:
  language: ta
  text: ‘கடல்’ எனப்பட்ட அந்த ஒரே தொட்டியையும்,[a] அதற்குக் கீழிருந்த பன்னிரண்டு மாடுகளையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடல் என்று அழைக்கப்பட்ட அந்தப் பெரிய தொட்டியையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: கடல் தொட்டி
  rationale: יָם என்பதன் நேரடிப் பொருள் ‘கடல்’; ஆலயப் பொருட்களின் சூழலில் இது ‘கடல்’ என்று அழைக்கப்பட்ட பெரிய வார்ப்புத் தொட்டியைக் குறிக்கிறது. ‘கடல் தொட்டி’ என்பது பொருளையும் சிறப்புப் பெயரையும் தெளிவாகக் காக்கிறது.
- source_word: אֶחָד
  choice: ஒரே
  rationale: இந்த எண்ணுப்பெயர் ‘கடல் தொட்டி’ ஒன்றே இருந்ததைச் சுட்டுகிறது; பட்டியல் நடைக்கு இயல்பாக ‘ஒரே’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַבָּקָר
  choice: மாடுகள்
  rationale: בָּקָר என்பது மாட்டினத்தைக் குறிக்கும் கூட்டுப்பெயர். இங்கு தொட்டியைத் தாங்கிய பன்னிரண்டு மாட்டு உருவங்களைக் குறிக்கிறது; பாலினத்தை மூலச்சொல் உறுதிப்படுத்தாததால் ‘மாடுகள்’ என வழங்கப்பட்டுள்ளது.
- source_word: שְׁנֵים עָשָׂר
  choice: பன்னிரண்டு
  rationale: கூட்டு எண்ணின் நேரான தமிழ் வடிவம்.
- source_word: תַּחְתָּיו
  choice: அதற்குக் கீழே
  rationale: ஆண்பால் ஒருமை பின்னொட்டு முன் குறிப்பிடப்பட்ட ‘கடல் தொட்டி’யைச் சுட்டுகிறது; தமிழில் இயல்பாக ‘அதற்குக் கீழே’ என வழங்கப்பட்டுள்ளது.
- source_word: אֶת ... וְאֶת
  choice: தனியாக மொழிபெயர்க்கப்படவில்லை
  rationale: אֶת நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கண உருபு; தமிழில் வேற்றுமை உருபும் வாக்கிய அமைப்பும் அதன் பணியை வெளிப்படுத்துகின்றன.
