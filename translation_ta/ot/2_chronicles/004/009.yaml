  text: וַ/יַּ֨עַשׂ֙ חֲצַ֣ר הַ/כֹּהֲנִ֔ים וְ/הָ/עֲזָרָ֖ה הַ/גְּדוֹלָ֑ה וּ/דְלָת֧וֹת לָ/עֲזָרָ֛ה וְ/דַלְתוֹתֵי/הֶ֖ם צִפָּ֥ה נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/009.yaml
  text: And he made the court of the priests[a], and the great court, and doors for the court[c][b]; and he overlaid their doors with bronze.
translation:
  language: ta
  text: அவர் ஆசாரியர்களின் முற்றத்தையும் பெரிய முற்றத்தையும், அந்த முற்றத்துக்கான கதவுகளையும்[a] செய்தார்; அவற்றின் கதவுகளை[b] வெண்கலத்தால்[c] உறையிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முற்றத்திற்கான வாயிற்கதவுகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொதுவாக ‘கதவுகள்’ என்று பொருள்படுவதால், முதன்மை உரையில் ‘கதவுகள்’ என்றே தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் நேரடியாக ‘அவற்றின் கதவுகள்’ என்று பன்மையில் உள்ளது. இது முன்பு குறிப்பிடப்பட்ட முற்ற அமைப்புகளைக் குறிக்கலாம்; தமிழில் கருத்தை எளிமைப்படுத்தி ‘அதன் கதவுகள்’ என்றும் கூறலாம்.
    reason: grammatical_ambiguity
  - marker: c
    text: ‘செம்பால்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் செம்பையோ வெண்கலத்தையோ குறிக்கக்கூடும்; ஆலயப் பொருட்களின் சூழலுக்கு ‘வெண்கலம்’ பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தார்
  rationale: עָשָׂה என்பது ‘செய்/உருவாக்கு’ என்ற பரந்த பொருளுடைய வினை. கட்டுமானச் சூழலில் ‘செய்தார்’ இயல்பாகவும் மூலத்தின் பொதுவான பொருளை மிகைப்படுத்தாமலும் உள்ளது.
- source_word: חֲצַר הַכֹּהֲנִים
  choice: ஆசாரியர்களின் முற்றம்
  rationale: חָצֵר என்பது முற்றம் அல்லது முற்றவெளியைக் குறிக்கிறது; எபிரெயக் கட்டமைப்பிலுள்ள ஆசாரியர்களுடனான உறவு நேரடியாகப் பேணப்பட்டுள்ளது.
- source_word: וְהָעֲזָרָה הַגְּדוֹלָה
  choice: பெரிய முற்றம்
  rationale: ஆலயச் சூழலில் עֲזָרָה ஒரு முற்றம் அல்லது அடைக்கப்பட்ட வெளி. ‘பெரிய முற்றம்’ நவீன தமிழில் இயல்பாகவும் கட்டிடச் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: וּדְלָתוֹת לָעֲזָרָה
  choice: அந்த முற்றத்துக்கான கதவுகள்
  rationale: דֶּלֶת பொதுவாக ‘கதவு’ என்பதைக் குறிக்கிறது. לָעֲזָרָה என்பதிலுள்ள குறிப்பிட்ட முற்றத்தைத் தெளிவுபடுத்த ‘அந்த முற்றத்துக்கான’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְדַלְתוֹתֵיהֶם
  choice: அவற்றின் கதவுகள்
  rationale: எபிரெயச் சொல் மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதியைக் கொண்டிருப்பதால், பன்மைக் குறிப்பை அழிக்காமல் ‘அவற்றின்’ என்று தரப்பட்டுள்ளது; இது முன் குறிப்பிடப்பட்ட முற்ற அமைப்புகளைக் குறிக்கலாம்.
- source_word: צִפָּה
  choice: மூடினார்
  rationale: இந்தக் கட்டமைப்பில் צִפָּה என்பது ஓர் உலோகத்தால் மேற்பரப்பை மூடுதல் அல்லது தகடு பதித்தல். ‘மூடினார்’ பொதுவான வாசகருக்குத் தெளிவாக இருந்து, கருவி வேற்றுமையுடன் அந்தச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: נְחֹשֶׁת செம்பையோ செம்புக் கலவையான வெண்கலத்தையோ குறிக்கலாம். ஆலயப் பொருட்களின் சூழலில் ‘வெண்கலம்’ பொருத்தமான வழக்குச் சொல்.
