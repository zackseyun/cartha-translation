  terminology: ‘மாடுகள்’ என்பது בָּקָר என்ற பொதுவான போவைன் குறிப்பை தேவையற்ற பாலினக் குறிப்பாக்கமின்றி தருகிறது. ‘கடல்’ என்பது இச்சூழலில் ஆலயத்தின் பெரிய வெண்கலத் தொட்டியின் நிலையான பெயரைக் காக்கிறது. ‘பின்பகுதிகள்’ மற்றும் ‘உட்புறம் நோக்கி’ என்பன אֲחֹרֵיהֶם, בָּיְתָה ஆகியவற்றுக்கு பொருத்தமானவை.
