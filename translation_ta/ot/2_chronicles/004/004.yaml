  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் அமைப்பும் இடவியல் விவரமும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: பன்னிரண்டு மாட்டுருவங்கள், ஒவ்வொரு திசையிலும் மூன்று, அவற்றின் மேலுள்ள ‘கடல்,’ மற்றும் அவற்றின் பின்பகுதிகள் உட்புறம் நோக்கிய நிலை ஆகியவை அனைத்தும் காக்கப்பட்டுள்ளன. יָמָּה என்பதன் வழக்கான ‘மேற்கு’ பொருளும் அடிக்குறிப்பில் வெளிப்படையாக விளக்கப்பட்டுள்ளது.'
