source:
  edition: WLC
  text: עוֹמֵ֞ד עַל שְׁנֵ֧ים עָשָׂ֣ר בָּקָ֗ר שְׁלֹשָׁ֣ה פֹנִ֣ים צָפ֡וֹנָ/ה וּ/שְׁלוֹשָׁה֩ פֹנִ֨ים יָ֜מָּ/ה וּ/שְׁלֹשָׁ֣ה פֹּנִ֣ים נֶ֗גְבָּ/ה וּ/שְׁלֹשָׁה֙ פֹּנִ֣ים מִזְרָ֔חָ/ה וְ/הַ/יָּ֥ם עֲלֵי/הֶ֖ם מִ/לְ/מָ֑עְלָ/ה וְ/כָל אֲחֹרֵי/הֶ֖ם בָּֽיְתָ/ה־׀׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
translation:
  language: ta
  text: 'அது பன்னிரண்டு மாடுகள்மேல் நின்றது: மூன்று வடக்குநோக்கியும், மூன்று மேற்குநோக்கியும்[a], மூன்று தெற்குநோக்கியும், மூன்று கிழக்குநோக்கியும் இருந்தன. கடல் அவற்றின்மேல் இருந்தது; அவற்றின் பின்பகுதிகள் அனைத்தும் உட்புறம் நோக்கியிருந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லடியாக, “மூன்று கடலை நோக்கியும்” என்று உள்ளது; இங்கு “கடலை நோக்கி” என்பது மேற்குத் திசையைக் குறிக்கும் எபிரெய வழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹמֵד
  choice: நின்றது
  rationale: עמד என்பதன் Qal நிகழ்காலப் பெயரெச்சம் இங்கு கடலின் நிலையை விவரிக்கும் பயனிலையில் வருகிறது; தமிழில் இறந்தகால வினை இயல்பாக உள்ளது.
- source_word: בָּקָר
  choice: மாடுகள்
  rationale: பெரிய வெண்கலக் கடலைத் தாங்கிய பன்னிரண்டு மாட்டுருவங்களைக் குறிக்கிறது; பாலினத்தை மூலவுரை தெளிவுபடுத்தாததால் ‘காளைகள்’ என்று மிகுதியாகக் குறிப்பாக்காமல் ‘மாடுகள்’ எனத் தரப்பட்டது.
- source_word: פֹנִים
  choice: நோக்கியும்
  rationale: சொல்லடியாக ‘முகங்கள்’ என்றாலும், திசையைக் குறிக்கும் இக்கட்டமைப்பில் உருவங்கள் எந்தப் பக்கம் திரும்பியிருந்தன என்பதே பொருள்.
- source_word: צָפוֹנָה
  choice: வடக்குநோக்கி
  rationale: திசையைக் குறிக்கும் -ה வடிவம் வடதிசையை நோக்கிய அமைப்பைக் காட்டுகிறது.
- source_word: יָמָּה
  choice: மேற்குநோக்கி
  rationale: சொல்லடியாக ‘கடலை நோக்கி’ என்றாலும், எபிரெய வழக்கில் இது மேற்குத் திசையைக் குறிக்கிறது.
- source_word: נֶגְבָּה
  choice: தெற்குநோக்கி
  rationale: திசைப் பட்டியலில் இது நெகேபு பகுதியைத் தனிப்படக் குறிப்பதல்ல; தெற்குத் திசையைக் குறிக்கிறது.
- source_word: מִזְרָחָה
  choice: கிழக்குநோக்கி
  rationale: இங்கு இயல்பான கிழக்குத் திசைக் குறிப்பு.
- source_word: הַיָּם
  choice: கடல்
  rationale: ஆலயத்திலிருந்த பெரிய வெண்கல நீர்த்தொட்டிக்கு வழங்கப்பட்ட பெயரை, மூலத்தின் உருவகச் சொல்லைத் தக்கவைத்து மொழிபெயர்க்கிறது.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: அவற்றின்மேல் இருந்தது
  rationale: மாடுகளுக்கு மேலாகக் கடல் அமைந்திருந்த நிலையைத் தெளிவாகவும் தேவையற்ற மறுகூறல் இன்றியும் தருகிறது.
- source_word: אֲחֹרֵיהֶם
  choice: அவற்றின் பின்பகுதிகள்
  rationale: ‘அவற்றின் பின்புறப் பகுதிகள்’ என்ற உடற்கூறு சார்ந்த பொருளை கண்ணியமாகவும் தெளிவாகவும் தருகிறது.
- source_word: בָּיְתָה
  choice: உட்புறம் நோக்கி
  rationale: திசையைக் குறிக்கும் இவ்வடிவம், கடலின் அடிப்பகுதி அல்லது மையத்தை நோக்கி அமைந்திருந்ததைச் சுட்டுகிறது.
