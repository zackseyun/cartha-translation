translation_notes:
  register: நவீனத் தரத் தமிழில், ஆலயக் கட்டமைப்பை விவரிக்கும் மூலவுரையின் கண்ணியமான நடையைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘கடல்’ என்பது பெரிய வெண்கல நீர்த்தொட்டியின் பெயராகச் சூழலால் விளங்குகிறது. பாலினம் தெளிவாகக் குறிக்கப்படாத בָּקָר என்பதற்கு ‘மாடுகள்’ பயன்படுத்தப்பட்டது.
