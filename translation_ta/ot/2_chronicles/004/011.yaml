  text: וַ/יַּ֣עַשׂ חוּרָ֔ם אֶת הַ֨/סִּיר֔וֹת וְ/אֶת הַ/יָּעִ֖ים וְ/אֶת הַ/מִּזְרָק֑וֹת וַ/יְכַ֣ל חירם לַ/עֲשׂוֹת֙ אֶת הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בְּ/בֵ֥ית הָ/אֱלֹהִֽים־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
translation:
  language: ta
  text: 'ஊராம்[அ] பானைகளையும், சாம்பல் அள்ளும் கருவிகளையும், கிண்ணங்களையும் செய்தான். இவ்வாறு, சாலொமோன் அரசனுக்காக தேவனுடைய ஆலயத்தில் செய்த வேலையை ஊராம் முடித்தான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: அ
    text: எபிரெயப் பெயர் இவ்வசனத்திலும் தொடர்புடைய பகுதிகளிலும் «ஈராம்» என்றும் எழுதப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: חוּרָם / חירם
  choice: ஊராம்
  rationale: இவ்வசனத்தின் எபிரெய வடிவத்தைத் தமிழில் இயல்பாக ஒலிபெயர்க்கிறது. மெய்யெழுத்து வேறுபாடு இருந்தாலும் இங்கு தனிப்பட்ட அடிக்குறிப்பு தேவையில்லை.
- source_word: הַסִּירוֹת
  choice: பானைகள்
  rationale: பல்வகைப் பாத்திரங்களைக் குறிக்கும் சொல்லுக்கு, செயல்பாட்டை மிகையாகக் குறிப்பாக்காமல் தெளிவான பொதுப்பெயரைத் தருகிறது.
- source_word: הַיָּעִים
  choice: சாம்பல் அள்ளும் கருவிகள்
  rationale: பலிபீடப் பணியில் சாம்பலை அகற்றப் பயன்படும் கருவிகளைக் குறிக்கும் சூழல்சார் பொருளை நவீன தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: הַמִּזְרָקוֹת
  choice: கிண்ணங்கள்
  rationale: ஆலயச் சடங்கில் பயன்படுத்தப்பட்ட பாத்திரங்களைக் குறிக்கிறது; அவற்றின் குறிப்பிட்ட பயன்பாட்டை மூலத்தைவிட அதிகமாக நிர்ணயிக்கவில்லை.
- source_word: וַיְכַל
  choice: முடித்தான்
  rationale: வேலையை நிறைவு செய்தான் என்ற கதைநடைப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: לַעֲשׂוֹת אֶת הַמְּלָאכָה / אֲשֶׁר עָשָׂה
  choice: தான் செய்துவந்த வேலையை
  rationale: மூலத்தின் ஒரே வேர்ச்சொல் மீள்வதைத் தமிழில் செயற்கையாக இரட்டிக்காமல், தொடர்ச்சியாக மேற்கொண்ட கைவினைப் பணியை இயல்பாகக் காட்டுகிறது.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: சாலொமோன் அரசனுக்காக
  rationale: அரசனின் ஆணைக்கிணங்க அல்லது அவனுக்காகச் செய்யப்பட்ட பணியென்பதைத் தெளிவாகத் தருகிறது.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயத்தில்
  rationale: சொற்படி ‘தேவனுடைய வீட்டில்’ என்றாலும், இச்சூழலில் ‘ஆலயம்’ நவீன தமிழில் இயல்பாகவும் குறிப்பாகவும் பொருளைத் தருகிறது; בְּ என்பதன் இடப்பொருளை ‘-த்தில்’ காக்கிறது.
theological_decisions:
- issue: בְּבֵית הָאֱלֹהִים என்பதிலுள்ள இடப்பொருள் மற்றும் இலக்குப் பொருள்
  choice: தேவனுடைய ஆலயத்தில்
  alternative: தேவனுடைய ஆலயத்திற்காக
  rationale: בְּ என்பதன் மிக நேரடியான பொருள் ‘இல்/உள்ளே’ என்பதால் இடப்பொருள் முதன்மைப்படுத்தப்பட்டது; பணியின் பொருட்கள் ஆலயத்திற்கானவை என்ற சூழல்சார் சாத்தியத்தை மொழிபெயர்ப்பு வெளிப்படையாக மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; மரியாதையான எளிய கதைநடை. கோயில் உபகரணங்களின் பெயர்கள் சாதாரண வாசகருக்குத் தெளிவாக வழங்கப்பட்டுள்ளன. வசன இறுதியிலுள்ள இரட்டைப்புள்ளி அடுத்துவரும் பட்டியலோடு உள்ள தொடர்ச்சியைப் பாதுகாக்கிறது.
