base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/022.yaml
  text: the snuffers[a], the basins, the bowls, and the firepans of pure gold; and the entrance of the house, its inner doors for the Most Holy Place, and the doors of the house for the nave[c][b], were of gold.
translation:
  language: ta
  text: திரிகளைச் சீராக்கும் கருவிகள், தெளிப்புப் பாத்திரங்கள், கிண்ணங்கள், நெருப்புத் தட்டுகள் ஆகியவை தூய தங்கத்தால் செய்யப்பட்டிருந்தன; ஆலயத்தின் நுழைவாயிலும், மகா பரிசுத்த இடத்திற்கான அதன் உட்புறக் கதவுகளும், ஆலய மண்டபத்திற்கான அதன் கதவுகளும் தங்கத்தால் செய்யப்பட்டிருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு “ஆலய மண்டபம்” என்பது மகா பரிசுத்த இடத்திற்கு வெளியே இருந்த ஆலயத்தின் பிரதான அறையைக் குறிக்கிறது.
    reason: lexical_clarification
lexical_decisions:
- source_word: מְזַמְּרוֹת
  choice: திரி வெட்டும் கருவிகள்
  rationale: ஆலய விளக்குகளின் திரிகளை வெட்டிச் சீராக்கப் பயன்படுத்திய கருவிகளைக் குறிக்கும்; நவீனத் தமிழில் செயல்பாட்டைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: מִּזְרָקוֹת
  choice: தெளிப்புப் பாத்திரங்கள்
  rationale: பலியின்போது திரவத்தைப் பெற்றுக்கொள்ளவோ தெளிக்கவோ பயன்பட்ட பாத்திரங்கள் என்ற வழிபாட்டுச் சூழலைக் காட்டுவதோடு, அடுத்து வரும் כַּפּוֹת என்பதிலிருந்தும் வேறுபடுத்துகிறது.
- source_word: כַּפּוֹת
  choice: கிண்ணங்கள்
  rationale: சிறிய கொள்கலன்கள் அல்லது கிண்ணங்களைக் குறிக்கக்கூடிய பொதுவான சொல்லை இயல்பான தமிழில் வழங்குகிறது.
- source_word: מַּחְתּוֹת
  choice: நெருப்புத் தட்டுகள்
  rationale: நெருப்பையோ எரியும் கரிகளையோ எடுத்துச் செல்லும் பாத்திரங்கள் என்பதைக் காட்டுகிறது; தூபப் பயன்பாட்டை தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: זָהָב סָגוּר
  choice: தூய தங்கம்
  rationale: மிகவும் சுத்திகரிக்கப்பட்ட உயர்தரத் தங்கத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் இயல்பான தமிழ் இணை.
- source_word: פֶּתַח הַבַּיִת
  choice: ஆலய நுழைவாயில்
  rationale: פֶּתַח என்பதன் நுழைவு அல்லது திறப்பு என்ற பொருளையும், இங்கு בַּיִת என்பது ஆலயத்தைக் குறிப்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דַּלְתוֹתָיו הַפְּנִימִיּוֹת
  choice: அதன் உட்புறக் கதவுகள்
  rationale: இணைக் கதவுகள் அல்லது கதவுத் தகடுகளைக் குறிக்கும் பன்மையையும், அடுத்த கதவுத் தொகுதியுடனான வேறுபாட்டையும் காக்கிறது.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்த இடத்திற்கான
  rationale: எபிரெயில் உள்ள மிக உயர்ந்த பரிசுத்தத்தைக் குறிக்கும் வலியுறுத்தலை தெளிவான, மரியாதையான தமிழில் தருகிறது.
- source_word: לַהֵיכָל
  choice: ஆலய மண்டபத்திற்கான
  rationale: உட்புற மகா பரிசுத்த இடத்திலிருந்து வேறுபட்ட ஆலயத்தின் பிரதான அறையைக் குறிக்கிறது.
- source_word: זָהָב
  choice: தங்கத்தால் செய்யப்பட்டிருந்தன
  rationale: இறுதியில் வரும் பொருள்-குறிப்பு கதவுகளின் தயாரிப்புப் பொருளைச் சுட்டுவதால், தமிழில் தேவையான வினையை வெளிப்படையாக வழங்குகிறது.
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים என்பதன் தமிழ் வடிவம்
  choice: மகா பரிசுத்த இடம்
  alternative: பரிசுத்த இடங்களிலெல்லாம் பரிசுத்தமான இடம்
  rationale: முதன்மை வடிவம் எபிரெயின் உயர்நிலைப் பொருளைச் சுருக்கமாகவும் வழிபாட்டுச் சூழலில் புரியுமாறும் தருகிறது; குறிப்பிட்ட சமயப் பிரிவின் தனிச்சொல்லாக்கத்தைச் சேர்க்கவில்லை.
- issue: הֵיכָל என்பதன் இடவியல் பொருள்
  choice: ஆலய மண்டபம்
  alternative: பரிசுத்த இடம் / ஆலயம்
  rationale: இங்கு அது மகா பரிசுத்த இடத்திலிருந்து வேறுபட்ட பிரதான அறையைக் குறிக்கிறது; பொதுவாக ‘ஆலயம்’ என்று மட்டும் மொழிபெயர்த்தால் அந்த வேறுபாடு மறையலாம்.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெயப் பட்டியல் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டாலும், பொருட்களும் கதவுகளும் தங்கத்தால் செய்யப்பட்டவை என்ற மூலத்தின் அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
