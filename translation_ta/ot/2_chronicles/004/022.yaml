revisions:
- from: திரி வெட்டும் கருவிகள், தெளிப்புப் பாத்திரங்கள், கிண்ணங்கள், நெருப்புத் தட்டுகள் ஆகியவை தூய தங்கத்தால் செய்யப்பட்டிருந்தன. ஆலய நுழைவாயிலின் உட்புறக் கதவுகள், அதாவது மகா பரிசுத்த இடத்திற்கான கதவுகள், ஆலய மண்டபத்திற்கான[a] கதவுகள் ஆகியவையும் தங்கத்தால் செய்யப்பட்டிருந்தன.
  to: திரிகளைச் சீராக்கும் கருவிகள், தெளிப்புப் பாத்திரங்கள், கிண்ணங்கள், நெருப்புத் தட்டுகள் ஆகியவை தூய தங்கத்தால் செய்யப்பட்டிருந்தன; ஆலயத்தின் நுழைவாயிலும், மகா பரிசுத்த இடத்திற்கான அதன் உட்புறக் கதவுகளும், ஆலய மண்டபத்திற்கான அதன் கதவுகளும் தங்கத்தால் செய்யப்பட்டிருந்தன.[a]
