revisions:
- from: மேலும், ஆசாரியர்களின் தலைவர்கள் அனைவரும் மக்களும், பிற இனத்தாரின் அருவருப்பான செயல்கள் அனைத்திற்கும் ஏற்ப[a], நம்பிக்கைத் துரோகத்தை மேன்மேலும் செய்தார்கள். யாவே[b] எருசலேமில் புனிதப்படுத்தியிருந்த அவரது ஆலயத்தையும் அவர்கள் தீட்டுப்படுத்தினார்கள்.
  to: மேலும், ஆசாரியர்களின் தலைவர்களும் மக்களும் அனைவரும் பிற இனத்தாரின் அருவருப்பான செயல்கள் அனைத்திற்கும் ஏற்ப[a] மேன்மேலும் நம்பிக்கைத் துரோகமாக நடந்துகொண்டார்கள். யாவே[b] எருசலேமில் பரிசுத்தப்படுத்தியிருந்த தனது ஆலயத்தை அவர்கள் தீட்டுப்படுத்தினார்கள்.
  rationale: The revision clarifies that the entire priestly leadership and the people are included, improves modern Tamil flow, and uses customary cultic wording for consecration. It retains the source's intensification, the comparative/conformity nuance of כְּכֹל, Yahweh's name, and both existing footnote anchors and alternatives.
