source:
  edition: WLC
  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
translation:
  language: ta
  text: மேலும், ஆசாரியர்களின் தலைவர்களும் மக்களும் அனைவரும் பிற இனத்தாரின் அருவருப்பான செயல்கள் அனைத்திற்கும் ஏற்ப[a] மேன்மேலும் நம்பிக்கைத் துரோகமாக நடந்துகொண்டார்கள். யாவே[b] எருசலேமில் பரிசுத்தப்படுத்தியிருந்த தனது ஆலயத்தை அவர்கள் தீட்டுப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பிற இனத்தாரின் அருவருப்பான செயல்கள் அனைத்தையும் போல” அல்லது “பிற இனத்தாரின் அருவருப்பான பழக்கங்கள் அனைத்தையும் பின்பற்றி.”
    reason: lexical_alternative
  - marker: b
    text: “யாவே” என்பது יהוה (YHWH) என்ற இறைத் திருப்பெயரின் ஒலிபெயர்ப்பு; சில மொழிபெயர்ப்புகள் இதை “கர்த்தர்” என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: மேலும்
  rationale: முந்தைய நிகழ்வுகளுடன் தொடர்ச்சியையும் வலியுறுத்தலையும் இயல்பாகக் காட்டுகிறது.
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  choice: ஆசாரியர்களின் தலைவர்கள் அனைவரும் மக்களும்
  rationale: שָׂרֵי என்பதை ஆசாரியர் குழுவின் தலைவர்கள் எனக் காட்டி, எபிரெயச் சொற்றொடரின் அமைப்பைப் பாதுகாக்கிறது.
- source_word: הִרְבּוּ לִמְעָול מַעַל
  choice: நம்பிக்கைத் துரோகத்தை மேன்மேலும் செய்தார்கள்
  rationale: வினைச்சொல்லும் அதே வேரிலான பெயர்ச்சொல்லும் தரும் தீவிரப்படுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; கடவுளிடம் காட்டிய விசுவாசமின்மையையும் உடன்படிக்கை மீறலையும் குறிக்கிறது.
- source_word: כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  choice: பிற இனத்தாரின் அருவருப்பான செயல்கள் அனைத்திற்கும் ஏற்ப
  rationale: כְּכֹל என்பதிலுள்ள ஒப்புமை அல்லது ஒத்திசைவு நுட்பத்தைப் பாதுகாத்து, תֹּעֲבוֹת என்பதை வெறும் விருப்பமின்மையாக அல்லாமல் ஒழுக்க-சமய அருவருப்பாகக் காட்டுகிறது.
- source_word: וַיְטַמְּאוּ
  choice: தீட்டுப்படுத்தினார்கள்
  rationale: ஆலயச் சூழலில் உள்ள சடங்கு மற்றும் ஒழுக்க மாசுபாட்டைத் தெளிவாகக் குறிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בֵּית என்பதன் நேர்ப்பொருள் ‘வீடு’ என்றாலும், இங்கு எருசலேம் திருக்கோவிலே குறிக்கப்படுவதால் நவீன தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם
  choice: எருசலேமில் புனிதப்படுத்தியிருந்த
  rationale: ஆலயத்தைத் தமக்கெனப் பரிசுத்தமாக ஒதுக்கிய செயலைக் காட்டுகிறது; உறவுப்பெயர் தொடர் ஆலயத்தையே சுட்டுகிறது.
theological_decisions:
- issue: מָעַל குறிக்கும் உடன்படிக்கை மற்றும் வழிபாட்டு மீறல்
  choice: நம்பிக்கைத் துரோகம்
  alternative: விசுவாசமின்மை; குற்றமீறல்
  rationale: கடவுளுக்குரிய பற்றுறுதியை மீறியதையும் ஆலயச் சூழலையும் ஒருங்கே காட்டுகிறது; வெறும் சட்டக் குற்றமாகச் சுருக்குவதில்லை.
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் தனிப்பெயரைப் பாதுகாக்கிறது; பட்டப்பெயரைப் பதிலீடு செய்வதைத் தவிர்க்கிறது.
- issue: כְּכֹל என்பதிலுள்ள ஒப்புமை/ஒத்திசைவு
  choice: அனைத்திற்கும் ஏற்ப
  alternative: அனைத்தையும் போல
  rationale: அவர்களின் நடத்தை பிற இனத்தாரின் அருவருப்பான பழக்கங்களுடன் ஒத்திருந்தது என்ற பொருளைத் தருகிறது; ஒப்புமை என்ற மாற்று நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நம்பிக்கைத் துரோகத்தை மேன்மேலும் செய்தார்கள்’ என்பது மூலத்தின் வலியுறுத்தலைத் தக்கவைத்தபடியே தமிழில் தெளிவாக அமைகிறது; ‘ஆலயம்’ சூழலிலுள்ள எருசலேம் திருக்கோவிலைத் தெளிவுபடுத்துகிறது.
