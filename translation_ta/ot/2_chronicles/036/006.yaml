source:
  edition: WLC
  text: עָלָ֣י/ו עָלָ֔ה נְבוּכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יַּֽאַסְרֵ֨/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם לְ/הֹלִיכ֖/וֹ בָּבֶֽלָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/006.yaml
  text: Nebuchadnezzar king of Babylon came up against him and bound him with bronze chains to take him to Babylon[a].
translation:
  language: ta
  text: பாபிலோன் அரசன் நேபுகாத்நேச்சார் அவனுக்கு எதிராகப் படையெடுத்து வந்து, அவனைப் பாபிலோனுக்குக் கொண்டுபோகும்படி வெண்கலச் சங்கிலிகளால்[a] பிணைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெண்கலக் கை-கால் விலங்குகளால்” அல்லது “வெண்கலக் கை-கால் பூட்டுகளால்.” எபிரெயச் சொல் கைதியின்மேல் இடப்பட்ட வெண்கலக் கட்டுப்பாடுகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  choice: அவனுக்கு எதிராகப் படையெடுத்து வந்து
  rationale: இராணுவச் சூழலில் இந்த எபிரெய மரபுத்தொடர் ஒருவருக்கு எதிராக முன்னேறி வருவதைக் குறிக்கிறது. ‘படையெடுத்து வந்து’ என்பது பகைமையான இராணுவ நகர்வை இயல்பான தமிழில் தெரிவிக்கிறது; நடந்ததைக் குறிப்பாக ‘தாக்கினான்’ என்று அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: נְבוּכַדְנֶאצַּר
  choice: நேபுகாத்நேச்சார்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்; மூலப்பெயரின் ஒலியையும் போதுமான அளவு பிரதிபலிக்கிறது.
- source_word: מֶלֶךְ בָּבֶל
  choice: பாபிலோன் அரசன்
  rationale: பெயருக்கு முன் வரும் இயல்பான நவீனத் தமிழ் அரச பட்டமாக அமைக்கப்பட்டுள்ளது.
- source_word: וַיַּאַסְרֵהוּ
  choice: அவனை … கட்டினான்
  rationale: אָסַר என்பதன் நேரடிப் பொருள் கட்டுதல் அல்லது பிணைத்தல். அடுத்து வரும் வெண்கலக் கட்டுப்பாட்டுக் கருவியுடன் இது தெளிவாகப் பொருந்துகிறது.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: வெண்கல விலங்குகளால்
  rationale: இந்தச் சொல் கைதி மீது இடப்பட்ட வெண்கலக் கட்டுப்பாடுகளைக் குறிக்கிறது. ‘விலங்குகள்’ என்பது கை அல்லது கால் பூட்டுகளைக் குறிக்கக்கூடிய, dignified Tamil term; சங்கிலிகள் என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: לְהֹלִיכוֹ
  choice: அவனை … கொண்டுபோவதற்காக
  rationale: הלך என்பதன் Hiphil வடிவம் ஒருவரைச் செல்லச் செய்வதை, இங்கு கைதியாக ஓரிடத்திற்குக் கொண்டுபோவதை, குறிக்கிறது.
- source_word: בָּבֶלָה
  choice: பாபிலோனுக்கு
  rationale: திசையைக் குறிக்கும் இறுதி ה இலக்கை நோக்கிய இயக்கத்தைக் காட்டுகிறது; தமிழில் இலக்கு வேற்றுமை இதை இயல்பாக வெளிப்படுத்துகிறது.
