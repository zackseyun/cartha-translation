  text: யோவாகாஸ் அரசனானபோது இருபத்து மூன்று வயதுடையவனாக இருந்தான்[a]. அவன் எருசலேமில் மூன்று மாதங்கள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
