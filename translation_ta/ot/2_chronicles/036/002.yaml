lexical_decisions:
- source_word: בֶּן שָׁלֹשׁ וְעֶשְׂרִים שָׁנָה
  choice: இருபத்து மூன்று வயதுடையவனாக இருந்தான்
  rationale: ‘… ஆண்டுகளின் மகன்’ என்ற எபிரெய வயதுக் குறிப்பை, அதன் பொருளைத் துல்லியமாகக் காக்கும் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: יוֹאָחָז
  choice: யோவாகாஸ்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் தெளிவாகப் பெயர்த்தெழுதுகிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: இந்த அரசாட்சி தொடக்கச் சூத்திரத்தில், ஒருவர் அரசாட்சியை ஏற்ற காலத்தைக் குறிக்கும் எபிரெய வடிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים
  choice: மூன்று மாதங்கள்
  rationale: எண்ணும் கால அலகும் நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: அரசனாக ஆளுதல் என்ற பொருளை சாதாரண நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: בְ முன்னிடைச்சொல் குறிக்கும் இடப்பொருளைத் தமிழின் ‘-இல்’ வேற்றுமையால் நேரடியாக வழங்குகிறது.
