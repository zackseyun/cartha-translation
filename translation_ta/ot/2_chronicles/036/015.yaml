  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: யாவே, அவர்களுடைய முன்னோர்களின் கடவுள், தூதர்கள் வழியாக அனுப்புதல், தொடர்ச்சியான அனுப்புதலைக் குறிக்கும் மரபுத்தொடர், மக்கள்மீதும் உறைவிடத்தின்மீதும் இரக்கம் ஆகியவை அனைத்தும் இடம்பெற்றுள்ளன. ‘மீண்டும் மீண்டும்’ என்பது הַשְׁכֵּם וְשָׁלוֹחַ என்பதன் விடாமுயற்சியான, மீள்மீளும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.'
