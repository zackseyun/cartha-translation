source:
  edition: WLC
  text: וַ/יִּשְׁלַ֡ח יְהוָה֩ אֱלֹהֵ֨י אֲבוֹתֵי/הֶ֧ם עֲלֵי/הֶ֛ם בְּ/יַ֥ד מַלְאָכָ֖י/ו הַשְׁכֵּ֣ם וְ/שָׁל֑וֹחַ כִּֽי חָמַ֥ל עַל עַמּ֖/וֹ וְ/עַל מְעוֹנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
translation:
  language: ta
  text: அவர்களுடைய முன்னோர்களின் கடவுளாகிய யாவே, தமது தூதர்களின் மூலம் அவர்களிடம் மீண்டும் மீண்டும் செய்தி அனுப்பினார்[a]. ஏனெனில், அவர் தமது மக்கள்மீதும் தமது உறைவிடத்தின்மீதும்[b] இரக்கம் கொண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அதிகாலையில் எழுந்து அனுப்பினார்.” இது அக்கறையுடனும் விடாமுயற்சியுடனும் தொடர்ந்து அனுப்பியதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, தமது மக்களிடையே கடவுள் உறையும் இடமாகக் கருதப்பட்ட எருசலேம் ஆலயம்.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தெய்வீகப் பெயரான YHWH-ஐ பட்டப்பெயராக மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: அவர்களுடைய முன்னோர்களின் கடவுள்
  rationale: உடன்படிக்கை மற்றும் வரலாற்றுத் தொடர்பைப் பாதுகாக்கிறது; இன்றைய தமிழில் ‘பிதாக்கள்’ என்பதைவிட ‘முன்னோர்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיִּשְׁלַח ... עֲלֵיהֶם
  choice: அவர்களிடம் செய்தி அனுப்பினார்
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு’; தூதர்கள் குறிப்பிடப்படுவதால் மறைந்துள்ள செய்தியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּיַד מַלְאָכָיו
  choice: தமது தூதர்களின் மூலம்
  rationale: ‘கையால்’ என்பது இங்கு செயலாற்றும் முகவரைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் அதன் பொருளை இயல்பாகத் தருகிறது.
- source_word: מַלְאָכָיו
  choice: தமது தூதர்கள்
  rationale: מַלְאָךְ என்பது செய்தியுடன் அனுப்பப்பட்டவரைக் குறிக்கிறது. சூழலில் மனித தீர்க்கதரிசனத் தூதர்கள் பொருந்தினாலும், மூலத்தின் பொதுவான சொல்லைத் தக்கவைக்கிறது.
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  choice: மீண்டும் மீண்டும் செய்தி அனுப்பினார்
  rationale: சொல்லுக்குச் சொல் ‘அதிகாலையில் எழுந்து அனுப்புதல்’ என்ற மரபுத்தொடர், ஆர்வமுள்ள இடைவிடாத செயலையே குறிக்கிறது; அதன் பொருளை முதன்மை உரையில் தெளிவாகத் தருகிறது.
- source_word: כִּי חָמַל
  choice: ஏனெனில், அவர் ... இரக்கம் கொண்டார்
  rationale: חמל இரக்கத்தால் விட்டுவைக்க அல்லது காப்பாற்ற முனைவதைக் குறிக்கிறது; காரணத்தைக் காட்டும் כִּי-யையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עַל עַמּוֹ
  choice: தமது மக்கள்மீது
  rationale: חמל உடன் வரும் עַל-ஐ தமிழின் ‘இரக்கம் கொள்’ என்ற இயல்பான இணைப்பில் வழங்குகிறது.
- source_word: מְעוֹנוֹ
  choice: தமது உறைவிடம்
  rationale: מָעוֹן என்பதன் ‘வசிக்கும் இடம்’ என்ற பொருளைப் பாதுகாக்கிறது; அதை நேரடியாக ‘ஆலயம்’ என்று விளக்கிப் பெயர்க்கவில்லை.
theological_decisions:
- issue: ‘தமது தூதர்கள்’ என்போரின் அடையாளம்
  choice: பொதுவான ‘தூதர்கள்’ என்ற சொல்லை வைத்துக்கொண்டு, சூழலில் மனித செய்தியாளர்களைக் குறிக்க இடமளித்தல்
  alternative: வானதூதர்கள் அல்லது வெளிப்படையாக ‘தீர்க்கதரிசிகள்’
  rationale: சுற்றியுள்ள பகுதி தீர்க்கதரிசிகள் வழியாக வழங்கப்பட்ட எச்சரிக்கைகளைக் குறிக்கிறது. எனினும், ‘தீர்க்கதரிசிகள்’ என்று விரிவாக்காமல் மூலச்சொல்லின் பரப்பைத் தக்கவைக்கிறது; ‘வானதூதர்கள்’ என்ற தேவையற்ற முடிவையும் திணிக்கவில்லை.
- issue: ‘தமது உறைவிடம்’ என்பதன் குறிப்பு
  choice: இறைவனுடைய உறைவிடம் என்ற உடன்படிக்கை சார்ந்த உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘ஆலயம்’ என்று நேரடியாக அடையாளப்படுத்துதல்
  rationale: சூழலில் இது எருசலேம் ஆலயத்தைக் குறித்தாலும், மக்கள் மற்றும் தமது உறைவிடம் ஆகிய இரண்டின்மீதும் கடவுள் கொண்ட இரக்கத்தை எபிரெயம் இணைக்கிறது. அந்த இறையியல் தொடர்பை மொழிபெயர்ப்பு சுருக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘முன்னோர்கள்,’ ‘மீண்டும் மீண்டும்,’ ‘உறைவிடம்’ ஆகியவை எளிதில் புரியக்கூடியவையாக இருந்து, மூலத்தின் வரலாற்று மற்றும் இறையியல் நுணுக்கங்களையும் காக்கின்றன. தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
