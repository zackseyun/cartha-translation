base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
translation:
  language: ta
  text: யோயாக்கீன் அரசனானபோது அவனுக்கு எட்டு வயது[a]. அவன் எருசலேமில் மூன்று மாதங்களும் பத்து நாட்களும் ஆட்சி செய்தான். அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 இராஜாக்கள் 24:8-இல் ‘எட்டு வயது’ என்பதற்குப் பதிலாக ‘பதினெட்டு வயது’ என்று உள்ளது.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: அவனுக்கு எட்டு வயது
  rationale: எபிரேய வயதைக் குறிக்கும் மரபுத்தொடர் சொல்லர்த்தமாக ‘எட்டு ஆண்டுகளின் மகன்’; இயல்பான நவீனத் தமிழில் வயதைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוֹיָכִין
  choice: யோயாக்கீன்
  rationale: எபிரேய தனிப்பெயரின் ஒலிப்பைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் வடிவம்.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: அரசாட்சியின் தொடக்க நேரத்தைக் குறிக்கும் எபிரேய அமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  choice: மூன்று மாதங்களும் பத்து நாட்களும்
  rationale: ஆட்சிக்காலத்தின் கால அளவை நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: அரசனாக ஆளுதலைக் குறிக்கும் מלך என்பதற்கான இயல்பான தமிழ் வினைத்தொடர்.
- source_word: בִּירוּשָׁלָם
  choice: எருசலேமில்
  rationale: இடப்பொருளை நேரடியாகக் காட்டுகிறது.
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: குறிப்பிட்ட தீமையைச் செய்தான் என்ற எபிரேய மரபுத்தொடரின் இலக்கண வலிமையை வாசிக்க எளிய தமிழில் காக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யெகோவாவின் பார்வையில்
  rationale: தெய்வீக மதிப்பீட்டைக் குறிக்கும் ‘கண்களில்’ என்ற உருவகத்தை இயல்பான தமிழில் ‘பார்வையில்’ என வழங்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவத்தில் வழங்குகிறது.
theological_decisions:
- issue: 2 இராஜாக்கள் 24:8-இல் அரசாட்சியைத் தொடங்கிய வயது பதினெட்டு என இருப்பதால் எழும் காலக்கணக்குத் தொடர்பான முரண்பாடு
  choice: மசோரா மூலத்தில் உள்ள ‘எட்டு வயது’ என்பதை முதன்மை உரையில் வைத்தல்
  alternative: பதினெட்டு வயது
  rationale: கொடுக்கப்பட்ட WLC எபிரேய மூலம் ‘எட்டு’ என்றே வாசிக்கிறது. இணைப் பகுதியுடன் அமைதியாக ஒத்திசைக்காமல், அந்த வேறுபாட்டை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசர் குறித்த அறிவிப்பின் சுருக்கமான நடை காக்கப்பட்டுள்ளது; மூலத்தில் உள்ள வாசக வேறுபாடு தீர்க்கப்படாமல் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
