base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became servants to him and to his sons until the reign of the kingdom of Persia.
translation:
  language: ta
  text: வாளுக்குத் தப்பி எஞ்சியவர்களை அவன் பாபிலோனுக்கு நாடுகடத்திக் கொண்டுபோனான். அவர்கள் பாரசீக இராச்சியத்தின் ஆட்சி தொடங்கும்வரை அவனுக்கும் அவன் மகன்களுக்கும் அடிமைகளாக[a] இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பணியாளர்களாக.’ எபிரெயச் சொல் பணியாளர்கள் அல்லது அடிமைகள் ஆகிய இரு பொருள்களையும் குறிக்கலாம்; இங்கு வெற்றி மற்றும் நாடுகடத்தலின் சூழல் ‘அடிமைகள்’ என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: நாடுகடத்திக் கொண்டுபோனான்
  rationale: גלה என்பதன் காரணவினைப் பொருள், மக்களை வலுக்கட்டாயமாகத் தங்கள் நாட்டிலிருந்து அகற்றி வேறிடத்திற்குக் கொண்டுபோவதைக் குறிக்கிறது. ‘நாடுகடத்திக் கொண்டுபோனான்’ என்பது அந்தக் கட்டாய இடப்பெயர்வை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  choice: வாளுக்குத் தப்பி எஞ்சியவர்களை
  rationale: ‘எஞ்சியவர்கள்’ என்பது הַשְּׁאֵרִית என்பதன் மீதியானோர் என்ற பொருளைப் பாதுகாக்கிறது; ‘வாளுக்குத் தப்பி’ என்பது போரிலும் படுகொலையிலும் கொல்லப்படாமல் மீந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל בָּבֶל
  choice: பாபிலோனுக்கு
  rationale: எபிரெய திசைச்சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וַיִּהְיוּ לוֹ וּלְבָנָיו לַעֲבָדִים
  choice: அவனுக்கும் அவன் மகன்களுக்கும் அடிமைகளாக இருந்தார்கள்
  rationale: עֲבָדִים என்பது பணியாளர்கள் அல்லது அடிமைகள் எனப் பொருள்படலாம். வெற்றி, நாடுகடத்தல், அரசியல் அடக்குமுறை ஆகிய இச்சூழலில் கட்டாய அடிமைநிலை முன்னிலைப்படுவதால் ‘அடிமைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: பாரசீக அரசு ஆளத் தொடங்கும்வரை
  rationale: מְלֹךְ இங்கு பாரசீக ஆட்சி ஏற்படுவதைச் சுட்டுகிறது. ‘ஆளத் தொடங்கும்வரை’ என்பது கால எல்லையையும் ஆட்சியின் தொடக்கத்தையும் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: வெற்றி மற்றும் நாடுகடத்தல் சூழலில் עֲבָדִים என்பதன் பொருள்
  choice: அடிமைகள்
  alternative: பணியாளர்கள்
  rationale: எபிரெயச் சொல் இரு பொருள்களையும் ஏற்கக்கூடியது. ஆனால் இங்கு போரில் மீந்தவர்கள் வெற்றிகொண்ட அரசனுக்கும் அவன் வம்சத்தாருக்கும் கீழ்ப்படுத்தப்பட்டிருப்பதால் ‘அடிமைகள்’ சூழலுக்கு மிகப் பொருத்தமானது. சொலின் உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; பொதுவாசகர்களுக்குத் தெளிவாகவும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. எபிரெய மொழியின் சுருக்கமான தொடரை இயல்பான தமிழுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம்.
