source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ יְהוֹיָקִ֣ים בְּ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/005.yaml
  text: Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the eyes of Yahweh his God.
translation:
  language: ta
  text: யோயாக்கீம் அரசனானபோது அவனுக்கு இருபத்தைந்து வயது. அவன் எருசலேமில் பதினொரு ஆண்டுகள் அரசாண்டான். அவன் தன் கடவுளாகிய யாவேவின் பார்வையில் தீமையானதைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: அவனுக்கு இருபத்தைந்து வயது
  rationale: எபிரெய வயதைக் குறிக்கும் மரபுத்தொடரை இயல்பான நவீனத் தமிழில் பொருள்தெளிவுடன் வழங்குகிறது.
- source_word: יְהוֹיָקִים
  choice: யோயாக்கீம்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: בְּ முன்னொட்டுடன் வரும் இவ்வடிவம் அரியணையேற்ற நேரத்தைக் குறிக்கிறது; தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: பதினொரு ஆண்டுகள் அரசாண்டான்
  rationale: מָלַךְ என்பதன் ‘அரசாளுதல்’ என்ற செயற்பொருளை நேரடியாகத் தருகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: அரசாட்சியின் இடத்தைக் குறிக்கும் நேரடியான இடவேற்றுமை மொழிபெயர்ப்பு.
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: செயலையும் அதன் ஒழுக்க மதிப்பீட்டையும் மூலத்துக்கு நெருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ஒருவருடைய மதிப்பீட்டின்படி என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் தெளிவான தமிழ் இணை.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிப்பெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהָיו
  choice: தன் கடவுளாகிய
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு யோயாக்கீமைக் குறிப்பதைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ஒரு பட்டமாக மாற்றாமல் ஒலிப்பெயர்க்கிறது; ‘யாவே’ என்பது சாத்தியமான எபிரெய உச்சரிப்பை தமிழில் நெருக்கமாகக் காட்டுகிறது.
- issue: אֱלֹהָיו என்பதில் உள்ள உடைமை உறவு
  choice: தன் கடவுளாகிய
  alternative: அவனுடைய கடவுளாகிய
  rationale: உடைமைப் பின்னொட்டு யோயாக்கீமையே சுட்டுகிறது. ‘தன்’ என்பது தமிழில் அந்தத் தற்சுட்டுறவை இயல்பாகவும் தெளிவாகவும் காக்கிறது; கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று அரசாட்சி அறிவிப்புக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. எபிரெய வாக்கிய அமைப்பை மரத்தனமாகப் பின்பற்றாமல், அதன் தகவல் வரிசை, ஒழுக்க மதிப்பீடு, தெய்வீகத் தனிப்பெயர் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
