base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
translation:
  language: ta
  text: அவர்கள் கடவுளின் இல்லத்தை[a] எரித்து, எருசலேமின் மதிலை இடித்துப்போட்டு, அதன் அரண்மனைகள் அனைத்தையும் தீயால் எரித்து, அதன் விலைமதிப்புமிக்க பொருள்கள் அனைத்தையும் அழித்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் ஆலயத்தை.” எபிரெயில் நேரடியாக, “கடவுளின் இல்லத்தை” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இந்த இறுதிச் சொற்றொடரை, “அதன் விரும்பத்தக்க பொருள்கள் அனைத்தையும் அழிவுக்குள்ளாக்கினர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרְפוּ
  choice: எரித்து
  rationale: שׂרף என்பதன் எளிய பொருள் ‘எரி/எரித்துவிடு.’ தொடர்ச்சியான எபிரெயக் கதைநடையைத் தமிழில் இணை வினையெச்சத் தொடராக இயல்பாகக் கொடுக்கிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: கடவுளின் இல்லத்தை
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளான ‘கடவுளின் வீடு/இல்லம்’ என்பதைக் காக்கிறது; சூழலில் இது ஆலயத்தைக் குறிக்கிறது.
- source_word: וַיְנַתְּצוּ
  choice: இடித்துப்போட்டு
  rationale: נתץ என்பது மதில் போன்ற கட்டமைப்பை இடித்தல் அல்லது தகர்த்தல். ‘இடித்துப்போட்டு’ என்பது முழுமையான அழிப்பை இயல்பாக உணர்த்துகிறது.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: எருசலேமின் மதிலை
  rationale: எபிரெயில் ஒருமையில் உள்ள நகர மதிலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אַרְמְנוֹתֶיהָ
  choice: அதன் அரண்மனைகள்
  rationale: אַרְמוֹן என்பது அரண்மனை அல்லது பாதுகாப்புள்ள உயர்கட்டிடத்தைக் குறிக்கலாம்; இச்சூழலில் ‘அரண்மனைகள்’ வழக்கமான பொருள்.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: தீயால் எரித்து
  rationale: எபிரெயில் வெளிப்படையாக உள்ள ‘தீயால்’ என்ற வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  choice: அதன் விலையேறப்பெற்ற பொருள்கள் அனைத்தையும்
  rationale: כְּלִי என்பது பாத்திரங்கள், கருவிகள் அல்லது பொருள்கள் எனப் பரந்த பொருளுடையது; மַחֲמַד என்பது விரும்பத்தக்க, மதிப்புமிக்க அல்லது பொக்கிஷமானவற்றைக் குறிக்கிறது. ‘பொருள்கள்’ என்பது மூலத்தின் பரப்பைச் சுருக்காமல் காக்கிறது.
- source_word: לְהַשְׁחִית
  choice: அழித்தார்கள்
  rationale: அழிக்கும்படி/அழிவுக்காக என்ற எபிரெய இறுதிநிலை வடிவத்தை, முன் வரும் செயல்களுடன் இணைந்த முடிவுச் செயலாக இயல்பான தமிழ் வாக்கியத்தில் தருகிறது.
