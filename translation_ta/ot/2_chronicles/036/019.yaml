translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, எளிதில் புரியும் கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வினைத்தொடரின் ஓட்டம் தமிழ் வினையெச்சங்களால் காக்கப்பட்டுள்ளது. ‘கடவுளின் இல்லம்’ என்ற மூல உருவகம் பிரதான உரையில் வைக்கப்பட்டு, ‘ஆலயம்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது. כְּלִי என்ற பரந்த சொல்லை தேவையின்றி ‘பாத்திரங்கள்’ என்று சுருக்காமல் ‘பொருள்கள்’ என மொழிபெயர்த்துள்ளது.
