source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י בֵּ֤ית הָ/אֱלֹהִים֙ הַ/גְּדֹלִ֣ים וְ/הַ/קְּטַנִּ֔ים וְ/אֹֽצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֹצְר֥וֹת הַ/מֶּ֖לֶךְ וְ/שָׂרָ֑י/ו הַ/כֹּ֖ל הֵבִ֥יא בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
translation:
  language: ta
  text: கடவுளின் ஆலயத்தைச் சேர்ந்த பெரியதும் சிறியதுமான எல்லாப் பொருட்களையும், யாவேயின் ஆலயத்தின் பொக்கிஷங்களையும், அரசனின் மற்றும் அவனுடைய அதிகாரிகளின் பொக்கிஷங்களையும்—இவை அனைத்தையும் அவன் பாபிலோனுக்குக் கொண்டுபோனான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל כְּלֵי
  choice: எல்லாப் பொருட்களையும்
  rationale: כְּלֵי என்பது ஆலயப் பயன்பாட்டிற்குரிய பாத்திரங்கள், கருவிகள் உள்ளிட்ட பலவகைப் பொருட்களைக் குறிக்கக்கூடும். தமிழில் ‘பொருட்கள்’ என்பது பொருளைத் தேவையின்றிக் குறுக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: கடவுளின் ஆலயம்
  rationale: எபிரெய ‘கடவுளின் வீடு’ என்ற சொற்றொடர் இங்கு ஆலயத்தைக் குறிக்கிறது; நவீன தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
  choice: பெரியதும் சிறியதுமான
  rationale: பொருட்களின் அளவு அல்லது முக்கியத்துவம் இரண்டையும் உள்ளடக்கக்கூடிய எபிரெய இணையை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְאֹצְרוֹת
  choice: பொக்கிஷங்கள்
  rationale: אוֹצָר என்பது பொக்கிஷங்களையோ அவை வைக்கப்படும் கருவூலங்களையோ குறிக்கலாம். பாபிலோனுக்குக் கொண்டுபோகப்பட்டவற்றைப் பட்டியலிடும் சூழலில் உள்ளிருந்த மதிப்புமிக்க பொருட்கள் என்பதே பொருத்தமானது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: יהוה என்ற தனிப்பட்ட இறைப்பெயரை ‘யாவே’ என ஒலிபெயர்த்து, ‘வீடு’ என்பதன் சூழல்சார் பொருளை ‘ஆலயம்’ என வழங்குகிறது.
- source_word: וְשָׂרָיו
  choice: அவனுடைய அதிகாரிகளுடையவும்
  rationale: שָׂרִים என்பது இளவரசர்கள் மட்டுமல்லாமல் தலைவர்கள் அல்லது உயர் அதிகாரிகளையும் குறிக்கக்கூடிய பரந்த சொல்; ‘அதிகாரிகள்’ நவீன தமிழில் அந்தப் பரப்பை நன்றாகத் தருகிறது.
- source_word: הַכֹּל הֵבִיא בָבֶל
  choice: அனைத்தையும் அவன் பாபிலோனுக்குக் கொண்டுபோனான்
  rationale: הַכֹּל முந்தைய முழுப் பட்டியலையும் தொகுத்துக் குறிக்கிறது. הֵבִיא என்பது இலக்கை நோக்கிக் கொண்டுசென்றதைக் குறிக்கும்; சூழலில் ஒருமை எழுவாய் நேபுகாத்நேச்சார்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல எபிரெய உரையில் உடன்படிக்கையின் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட தமிழ்ச் சத்தவடிவமான ‘யாவே’ என வழங்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெயப் பட்டியலின் ஒத்திசைவும் முழுமையை வலியுறுத்தும் மறுமொழிகளும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன; தொழில்நுட்பமான அல்லது பழமையான ஆலயச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
