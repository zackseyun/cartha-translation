  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேய வாக்கியத்தின் இரு இணையான காலக் குறிப்புகளும் பாதுகாக்கப்பட்டுள்ளன.
