  text: Zedekiah was twenty-one years old when he became king, and he reigned eleven years in Jerusalem.
translation:
  language: ta
  text: சிதேக்கியா அரசனானபோது அவருக்கு இருபத்தொன்று வயது; அவர் எருசலேமில் பதினொரு ஆண்டுகள் ஆட்சி செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: அவருக்கு இருபத்தொன்று வயது
  rationale: எபிரேய வயதுக் குறிப்பின் சொற்பொருள் ‘இருபத்தொன்று ஆண்டுகளின் மகன்’ என்பதாக இருந்தாலும், நவீனத் தமிழில் வயதை இயல்பாகவும் துல்லியமாகவும் இவ்வாறு குறிப்பிடுவது பொருத்தமானது.
- source_word: צִדְקִיָּהוּ
  choice: சிதேக்கியா
  rationale: எபிரேயப் பெயரின் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: בְמָלְכוֹ
  choice: அரசனானபோது
  rationale: בְ முன்னொட்டுடன் வரும் இக்கட்டமைப்பு அவர் அரசாட்சியைத் தொடங்கிய காலத்தைக் குறிக்கிறது; ‘அரசனானபோது’ என்பது சுருக்கமான, இயல்பான தமிழாக்கம்.
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה
  choice: பதினொரு ஆண்டுகள்
  rationale: அரசாட்சியின் கால அளவைக் குறிக்கும் எண்ணும் காலப்பெயரும் நேரடியாக மொழிபெயர்க்கப்பட்டன.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தார்
  rationale: அரசராக ஆளுதல் என்னும் பொருளை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பொருளைக் காட்டும் בִּ முன்னொட்டு தமிழின் ‘-இல்’ வேற்றுமை உருபால் வழங்கப்பட்டது; இடப்பெயரின் நிலைபெற்ற தமிழ் வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions: []
