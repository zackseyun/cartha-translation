  text: לְ/מַלֹּ֤אות דְּבַר יְהוָה֙ בְּ/פִ֣י יִרְמְיָ֔הוּ עַד רָצְתָ֥ה הָ/אָ֖רֶץ אֶת שַׁבְּתוֹתֶ֑י/הָ כָּל יְמֵ֤י הָשַּׁמָּ/ה֙ שָׁבָ֔תָה לְ/מַלֹּ֖אות שִׁבְעִ֥ים שָׁנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
translation:
  language: ta
  text: எரேமியாவின் வாய்மூலம் யாவே கூறிய வார்த்தை நிறைவேறும்படியாக, நிலம் தன் ஓய்வுநாடுகளை அனுபவிக்கும்வரை, அது பாழாய்க் கிடந்த நாட்களெல்லாம் ஓய்வுநாளைக் கடைப்பிடித்தது[a][b], எழுபது ஆண்டுகள் நிறைவடையும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஓய்வெடுத்தது” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் “ஓய்வுநாடுகள்” என்பதற்கும் “ஓய்வுநாளைக் கடைப்பிடித்தது” என்பதற்கும் ஒரே சொல்வேரைப் பயன்படுத்தி சொல்விளையாட்டு அமைக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: தேசம் பாழாயிருந்தபோது நிலம் தன் ஓய்வுநாடுகளை அனுபவிக்கும் என்ற உடன்படிக்கை எச்சரிக்கையை இச்சொற்கள் எதிரொலிக்கின்றன; லேவியராகமம் 26:34–35 பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: לְמַלֹּאות
  choice: நிறைவேறும்படியாக
  rationale: முன்னொட்டு ל உடைய מלא வினையெச்சம் இங்கு நோக்கம் அல்லது விளைவைக் குறிக்கிறது; தீர்க்கதரிசன வார்த்தை நிகழ்வில் நிறைவேறுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: தீர்க்கதரிசன நிறைவேற்றச் சூழலில் דָּבָר என்பதன் ‘வார்த்தை’ என்ற பொருள் இலக்கியத் தொடர்பைத் தக்கவைக்கிறது; יהוה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: בְּפִי יִרְמְיָהוּ
  choice: எரேமியாவின் வாய்மூலம் உரைக்கப்பட்ட
  rationale: ‘எரேமியாவின் வாயால்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடியே, அது யாவேயின் வார்த்தையைத் தொடர்புபடுத்துவதைத் தெளிவான நவீன தமிழில் காட்டுகிறது.
- source_word: עַד רָצְתָה הָאָרֶץ אֶת שַׁבְּתוֹתֶיהָ
  choice: தேசம் தன் ஓய்வுநாடுகளை அனுபவித்துத் தீரும்வரை
  rationale: רצה இங்கு தேசம் தனக்குரிய ஓய்வைப் பெற்றதைக் குறிக்கிறது. ‘அனுபவித்துத் தீரும்வரை’ என்பது நிறைவு நிழற்பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: அது பாழாய்க் கிடந்த நாட்களெல்லாம்
  rationale: தேசமே பாழாய்க் கிடந்தது என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் சொல்கிறது.
- source_word: שָׁבָתָה
  choice: ஓய்வுநாள் அனுசரித்தது
  rationale: שבת வினைக்கும் שַׁבָּתוֹת பெயர்ச்சொல்லுக்கும் இடையிலான ஓய்வுநாள்/ஓய்வெடுத்தல் சொல்விளையாட்டை முடிந்தவரைத் தக்கவைக்கிறது.
- source_word: לְמַלֹּאות שִׁבְעִים שָׁנָה
  choice: எழுபது ஆண்டுகள் நிறைவேறும்படியாக
  rationale: தொடக்கத்திலுள்ள לְמַלֹּאות என்பதன் மறுபயன்பாட்டை ‘நிறைவேறும்படியாக’ என்று மீண்டும் வழங்கி, காலஅளவு முழுமையடைந்ததை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கெழுத்து இறைப் பெயரே உள்ளது; ஆகவே தனிப்பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: שַׁבְּתוֹתֶיהָ / שָׁבָתָה ஆகியவற்றின் ஓய்வுநாள் தொடர்பு
  choice: தன் ஓய்வுநாடுகளை ... ஓய்வுநாள் அனுசரித்தது
  alternative: தன் ஓய்வுகளை ... ஓய்வெடுத்தது
  rationale: தேசத்தின் ஓய்வுநாடுகளுக்கும் அது பாழாயிருந்த காலத்திற்கும் உள்ள உடன்படிக்கைத் தொடர்பை மறைக்காமல், எபிரெயச் சொல்விளையாட்டையும் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெயத்தின் நீண்ட காரண–கால அமைப்பு தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது. ‘தேசம்’ என்பது முழு பூமியல்ல, யூதா நாட்டைக் குறிக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
