id: 2CH.36.12
reference: 2 Chronicles 36:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו לֹ֣א נִכְנַ֗ע מִ/לִּ/פְנֵ֛י יִרְמְיָ֥הוּ הַ/נָּבִ֖יא מִ/פִּ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/012.yaml
  text: He did what was evil in the eyes of Yahweh his God[a], and he did not humble himself before Jeremiah the prophet, who spoke from the mouth of Yahweh.
translation:
  language: ta
  text: அவன் தன் கடவுளாகிய யாவேயின் பார்வையில் தீமையானதைச் செய்தான். யாவேயின் வாயிலிருந்து பேசிய இறைவாக்கினரான எரேமியாவின் முன்னிலையில் அவன் தன்னைத் தாழ்த்திக்கொள்ளவும் இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: எபிரேய மதிப்பீட்டு மரபுத்தொடரான ‘தீமையைச் செய்தான்’ என்பதன் பொருளை இயல்பான நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ஒருவருடைய மதிப்பீட்டின்படி என்ற எபிரேய மரபுத்தொடரின் பொருளையும் அதன் உருவகத்தையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהָיו
  choice: தன் கடவுளாகிய
  rationale: மூலத்திலுள்ள மூன்றாம் நபர் உடைமைப் பின்னொட்டைத் தக்கவைத்து, யாவே அவனுடைய கடவுள் என்ற உடன்படிக்கைப் பொறுப்பை வெளிப்படுத்துகிறது.
- source_word: לֹא נִכְנַע
  choice: தன்னைத் தாழ்த்திக்கொள்ளவும் இல்லை
  rationale: נכנע என்பதிலுள்ள இடைநிலை/தற்சுட்டுப் பொருளை வெளிப்படுத்தி, அவன் மனத்தாழ்மையையும் பணிவையும் காட்ட மறுத்ததை இயல்பான தமிழில் கூறுகிறது.
- source_word: מִלִּפְנֵי
  choice: முன்னிலையில்
  rationale: எரேமியாவுக்கு முன்பாகத் தன்னைத் தாழ்த்த வேண்டிய உறவுநிலையை இயல்பாகக் குறிக்கிறது.
- source_word: הַנָּבִיא
  choice: இறைவாக்கினர்
  rationale: எரேமியாவின் அதிகாரப்பூர்வ தீர்க்கதரிசனப் பணியை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
- source_word: מִפִּי יְהוָה
  choice: யாவேயின் வாயிலிருந்து பேசிய
  rationale: ‘யாவேயின் வாயிலிருந்து’ என்ற மூலத்தின் உயிரோட்டமான தீர்க்கதரிசன இடைமுக உருவகத்தைத் தக்கவைக்கிறது; இது எரேமியாவை விவரிப்பதாக வாக்கிய அமைப்பு தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டமல்ல, தேவனுடைய தனிப்பெயரே உள்ளது. எனவே அதைத் தமிழில் ஒலிபெயர்ப்பது உரையின் உடன்படிக்கைச் சிறப்பைத் தக்கவைக்கிறது.
- issue: נִכְנַע என்பதன் செயப்படுபொருள்/தற்சுட்டு நுணுக்கம்
  choice: தன்னைத் தாழ்த்திக்கொள்ளவும் இல்லை
  alternative: தாழ்த்தப்படவில்லை
  rationale: சூழல் செதேக்கியாவின் நெறிசார் மறுப்பை வலியுறுத்துவதால், வெறும் செயப்பாட்டு நிலையைவிடத் தன்னைத்தானே தாழ்த்தாத செயற்பாட்டுப் பொருள் பொருத்தமானது; இருப்பினும் எபிரேய நிபால் வடிவத்தின் நுணுக்கம் முற்றிலும் அழிக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும் அதேவேளை வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடை. எபிரேய உருவகமான ‘யாவேயின் வாயிலிருந்து’ இயல்பைச் சற்றே சவாலாக்கினாலும், தீர்க்கதரிசன அதிகாரத்தைத் துல்லியமாகத் தக்கவைக்க வேண்டி பாதுகாக்கப்பட்டுள்ளது.
