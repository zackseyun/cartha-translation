base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
translation:
  language: ta
  text: ஆண்டு திரும்பும் வேளையில்[a], நேபுகாத்நேச்சார் அரசன் ஆள் அனுப்பி, யாவேயின் ஆலயத்திலிருந்த விலையுயர்ந்த பாத்திரங்களோடு அவனைப் பாபிலோனுக்குக் கொண்டுவரச் செய்தான்[b]. அவனுடைய சகோதரனான[c] சிதேக்கியாவை யூதாவுக்கும் எருசலேமுக்கும் அரசனாக்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘ஆண்டு திரும்பும் வேளையில்.’ இது ஆண்டு மீண்டும் சுற்றிவரும் காலத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யாவேயின் ஆலயத்தின் அருமையான பொருட்கள்.’
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், ‘அவனுடைய சகோதரன்.’ வம்ச உறவின்படி சிதேக்கியா யோயாக்கீனின் நெருங்கிய அரசகுல உறவினர்; இன்னும் துல்லியமாகச் சொன்னால், அவனுடைய சிற்றப்பன்.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  choice: ஆண்டு திரும்பிவரும் காலத்தில்
  rationale: எபிரெயச் சொற்றொடரின் ‘ஆண்டு திரும்புதல்’ என்ற உருவகத்தைத் தக்கவைத்து, அது குறிப்பாக வசந்தகாலமே என்று மூலத்தில் இல்லாத தகவலைச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: שָׁלַח ... וַיְבִאֵהוּ
  choice: ஆள் அனுப்பி, அவனைப் ... கொண்டுவரச் செய்தான்
  rationale: ‘அனுப்பினான்’ என்பதையும், בוא என்பதன் ஹிஃபில் வினைவடிவிலுள்ள பிறவினைப் பொருளையும் வெளிப்படுத்துகிறது; ‘அவன்’ என்பது முந்தைய வசனத்திலுள்ள யோயாக்கீனைக் குறிக்கிறது.
- source_word: בָבֶלָה
  choice: பாபிலோனுக்கு
  rationale: இறுதியில் உள்ள திசைகாட்டும் ה, பாபிலோனை நோக்கிய நகர்வைக் குறிக்கிறது.
- source_word: כְּלֵי חֶמְדַּת
  choice: விலையுயர்ந்த பாத்திரங்கள்
  rationale: כְּלֵי என்பது பொருட்கள் அல்லது பாத்திரங்களையும், חֶמְדַּת என்பது விரும்பத்தக்க தன்மை அல்லது மதிப்புமிக்க தன்மையையும் குறிக்கிறது; ஆலயச் சூழலில் இத்தேர்வு தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: ‘யாவேயின் வீடு’ என்பதே சொற்சொல் பொருள்; இச்சூழலில் ‘ஆலயம்’ என்பது சாதாரண வாசகருக்குத் தெளிவான, பொருளை மாற்றாத தமிழ் நடை.
- source_word: וַיַּמְלֵךְ
  choice: அரசனாக்கினான்
  rationale: ‘ஆட்சி செய்யும்படி செய்தான்’ அல்லது ‘அரசனாக்கினான்’ என்ற ஹிஃபில் பிறவினைப் பொருளைச் சுருக்கமாகவும் துல்லியமாகவும் தருகிறது.
- source_word: אָחִיו
  choice: அவனுடைய சகோதரன்
  rationale: மூல எபிரெயம் நேரடியாக ‘அவனுடைய சகோதரன்’ என்கிறது. வரலாற்று வம்ச உறவில் சிதேக்கியா யோயாக்கீனின் சிற்றப்பன் என்பதைக் காலடிக்குறிப்பில் விளக்கி, மூலத்தின் உறவுமுறைச் சொல்லை முதன்மை உரையில் தக்கவைக்கிறது.
- source_word: עַל יְהוּדָה וִירוּשָׁלָם
  choice: யூதாவுக்கும் எருசலேமுக்கும் அரசனாக
  rationale: עַל குறிக்கும் ஆட்சிக்குட்பட்ட பரப்பை, ராஜ்யமான யூதாவையும் அதன் தலைநகரான எருசலேமையும் உள்ளடக்கும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்த்து, உடன்படிக்கையின் தனிப்பெயரைத் தக்கவைக்கிறது.
- issue: אָחִיו என்ற உறவுமுறைச் சொல்லின் வரலாற்றுப் பொருத்தம்
  choice: முதன்மை உரையில் ‘சகோதரன்’; காலடிக்குறிப்பில் ‘சிற்றப்பன்’ என்ற விளக்கம்
  alternative: முதன்மை உரையிலேயே ‘உறவினர்’ அல்லது ‘சிற்றப்பன்’ என்று எழுதுதல்
  rationale: எபிரெய உரையின் வெளிப்படையான சொல்லை மறைக்காமல் வைத்தபடியே, வம்சவரலாற்றுத் தகவலால் எழும் பதற்றத்தை நேர்மையாக விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஆண்டு திரும்பிவரும் காலம்’ என்ற உருவகம் மூலத்தின் காலக் குறிப்பிலுள்ள திறந்த தன்மையைப் பாதுகாக்கிறது. நீண்ட எபிரெய வாக்கியத்தை வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரித்தாலும், செயல்களின் வரிசையும் தொடர்பும் தக்கவைக்கப்பட்டுள்ளன.
