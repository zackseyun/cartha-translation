base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
translation:
  language: ta
  text: எகிப்தின் அரசன் எருசலேமில் அவனைப் பதவியிலிருந்து நீக்கினான்[a]. மேலும், நாட்டின்மேல் நூறு தாலந்து வெள்ளியையும் ஒரு தாலந்து தங்கத்தையும்[b][c] அபராதமாகச் விதித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனை அகற்றினான்’ அல்லது ‘அவனைக் கொண்டுபோனான்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் ஒருவரைப் பதவியிலிருந்து நீக்குவதையோ ஓரிடத்திலிருந்து அகற்றுவதையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘நாட்டின்மேல் பண அபராதம் விதித்தான்’ என்றும் மொழிபெயர்க்கலாம்; இவ்வினைச்சொல் பண அபராதத்தைச் சுமத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: ‘தாலந்து’ என்பது பண்டைய காலத்தின் பெரிய எடை அலகு; அதை நவீன எடையாக மாற்றாமல், மூலத்தில் உள்ள அளவே உரையில் தக்கவைக்கப்பட்டுள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  choice: அவனைப் பதவியிலிருந்து நீக்கினான்
  rationale: הסיר என்பதன் அடிப்படைப் பொருள் ‘அகற்றுதல்/நீக்குதல்.’ அரசரைப் பற்றிய இச்சூழலில் பதவியிலிருந்து நீக்குதல் என்பது இயல்பான பொருள்; ஒருவரை வேறிடத்திற்குக் கொண்டுபோதல் என்ற சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது; இவ்வசனத்தில் இல்லாத பார்வோன் நேகோ என்ற பெயரைச் சேர்க்கவில்லை.
- source_word: בִּירוּשָׁלָם
  choice: எருசலேமில்
  rationale: ב இங்கு இடத்தைக் குறிக்கிறது; அதனால் ‘எருசலேமில்’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַיַּעֲנֹשׁ
  choice: அபராதமாக விதித்தான்
  rationale: ענשׁ இங்கு பின்னர் குறிப்பிடப்படும் பணத்தொகையை நாட்டின்மேல் நிதித் தண்டமாகச் சுமத்துவதைக் குறிக்கிறது. ‘தண்டித்தான்’ என்பது பணம் சார்ந்த பொருளைத் தெளிவாகக் காட்டாது.
- source_word: הָאָרֶץ
  choice: நாடு
  rationale: இங்கு אָרֶץ முழு பூமியை அல்ல, யூதா நாட்டை/அதன் நிலப்பரப்பைக் குறிக்கிறது. ‘நாடு’ என்பது இச்சூழலில் தெளிவான இயல்புத் தமிழ்.
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: நூறு தாலந்து வெள்ளி
  rationale: כִּכָּר என்பது பண்டைய எடை அலகு. நவீன எடையாக ஊகித்து மாற்றாமல் ‘தாலந்து’ என்று பாதுகாக்கப்பட்டது.
- source_word: וְכִכַּר זָהָב
  choice: ஒரு தாலந்து தங்கம்
  rationale: எபிரெய மூலத்தில் உள்ள ஒருமையையும் அதே பண்டைய எடை அலகையும் துல்லியமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: யோவாகாசுக்கு நிகழ்ந்த அரச நடவடிக்கையின் துல்லிய இயல்பு
  choice: முதன்மை உரையில் ‘பதவியிலிருந்து நீக்கினான்’
  alternative: ‘அவனை அகற்றினான்’ அல்லது ‘அவனைக் கொண்டுபோனான்’
  rationale: அரச வரலாற்றுச் சூழல் பதவிநீக்கத்தை வலுவாகக் குறிக்கிறது; எனினும் எபிரெய வினைச்சொல்லின் பரந்த பொருளை அடிக்குறிப்பில் வெளிப்படையாக வைத்திருப்பதால் தேவையற்ற உறுதிப்படுத்தல் தவிர்க்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று விவரணைக்கு ஏற்ற கண்ணியமான எளிய நடை பயன்படுத்தப்பட்டது. நீண்ட ஒரே வாக்கியத்தை இரண்டு தொடர்புடைய வாக்கியங்களாகப் பிரித்து வாசிப்புத் தெளிவு மேம்படுத்தப்பட்டது; எபிரெய உரையின் நிகழ்வுவரிசையும் பொருளும் பாதுகாக்கப்பட்டன.
