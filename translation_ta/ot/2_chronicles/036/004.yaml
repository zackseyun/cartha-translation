translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. அரசப் பெயர்கள் தமிழ் வேதாகம வழக்கிற்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளன. மூலத்தின் இணைப்புச் சொல்லில் இல்லாத வலுவான எதிர்மறைப் பொருள் சேர்க்கப்படவில்லை.
