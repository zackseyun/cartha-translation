base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
translation:
  language: ta
  text: எகிப்தின் அரசன், யோவாகாசின் சகோதரனான எலியாக்கீமை யூதாவுக்கும் எருசலேமுக்கும் அரசனாக்கி, அவனுடைய பெயரை யோயாக்கீம் என்று மாற்றினான். நேகோ[a], எலியாக்கீமின் சகோதரனான யோவாகாசை அழைத்துக்கொண்டு எகிப்துக்குப் போனான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “நேகோ”; “நெகோ” என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: அரசனாக்கி
  rationale: מלך என்பதன் ஹிஃபில் வடிவம் இங்கு காரணவினைப் பொருளில் வந்து, எகிப்தின் அரசன் எலியாக்கீமை அரசனாக நிறுவியதைக் குறிக்கிறது.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசன்
  rationale: குறிப்பிட்ட எகிப்திய அரசனைச் சுட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: אֶלְיָקִים אָחִיו
  choice: எலியாக்கீமை அவனுடைய சகோதரனுக்குப் பதிலாக
  rationale: ஆதார உரையின் אָחִיו என்பது உடனடி இலக்கண அமைப்பில் எலியாக்கீமை யோவாகாசின் சகோதரன் எனக் குறிக்கிறது. முன்னைய வசனச் சூழல், எலியாக்கீம் யோவாகாசுக்குப் பதிலாக அரசனாக்கப்பட்டான் என்பதைத் தெளிவுபடுத்துவதால், தமிழில் தொடர்பு தெளிவாக வெளிப்படுத்தப்பட்டது.
- source_word: עַל יְהוּדָה וִירוּשָׁלַם
  choice: யூதாவுக்கும் எருசலேமுக்கும் அரசனாக
  rationale: עַל இங்கு ஆட்சிப்பரப்பைக் குறிக்கிறது; நாடும் தலைநகரமும் இரண்டும் தக்கவைக்கப்பட்டுள்ளன.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ יְהוֹיָקִים
  choice: அவனுடைய பெயரை யோயாக்கீம் என்று மாற்றினான்
  rationale: பெயரை மாற்றுதல் என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וְאֶת יוֹאָחָז אָחִיו לָקַח נְכוֹ
  choice: பின்னர் நேகோ, அவனுடைய சகோதரனாகிய யோவாகாசைப் பிடித்து
  rationale: לקח அடிப்படையில் ‘எடுத்தான்’ எனினும், பதவியிலிருந்து அகற்றப்பட்ட அரசனை எகிப்துக்குக் கொண்டுசெல்லும் சூழலில் ‘பிடித்து’ என்பது செயற்பொருளை இயல்பாகத் தெரிவிக்கிறது. וְ என்பதற்கு தேவையற்ற எதிர்மறை மாறுபாட்டைச் சேர்க்காமல் நிகழ்வின் தொடர்ச்சியைக் காட்ட ‘பின்னர்’ பயன்படுத்தப்பட்டது.
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  choice: எகிப்துக்குக் கொண்டுபோனான்
  rationale: מִצְרָיְמָה என்பதிலுள்ள திசைச்சுட்டு முடிவு எகிப்தை நோக்கிய இயக்கத்தைக் குறிக்கிறது; தமிழில் ‘எகிப்துக்குக் கொண்டுபோனான்’ இயல்பானது.
- source_word: נְכוֹ
  choice: நேகோ
  rationale: எபிரெய உயிர்ப்புள்ளி மரபை நெருக்கமாகப் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு; ‘நெகோ’ என்ற மாற்றும் பயன்பாட்டில் உள்ளது.
