source:
  edition: WLC
  text: וְ֠/גַם בַּ/מֶּ֤לֶךְ נְבֽוּכַדְנֶאצַּר֙ מָרָ֔ד אֲשֶׁ֥ר הִשְׁבִּיע֖/וֹ בֵּֽ/אלֹהִ֑ים וַ/יֶּ֤קֶשׁ אֶת עָרְפּ/וֹ֙ וַ/יְאַמֵּ֣ץ אֶת לְבָב֔/וֹ מִ/שּׁ֕וּב אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/013.yaml
  text: He also rebelled against King Nebuchadnezzar[a], who had made him swear by God; he stiffened his neck and hardened his heart from turning to Yahweh[b], the God of Israel.
translation:
  language: ta
  text: மேலும், அவன் நேபுகாத்நேச்சார் அரசனுக்கு எதிராகக் கிளர்ச்சி செய்தான். அந்த அரசன் அவனைக் கடவுளின் பெயரில் சத்தியம் செய்ய வைத்திருந்தான்[a]. அவன் தன் கழுத்தை விறைப்பாக்கி[b], இஸ்ரவேலின் கடவுளான யாவேவிடம் திரும்பாமல் தன் இதயத்தைக் கடினப்படுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளின் முன்னிலையில் ஓர் ஆணையால் அவனைக் கட்டுப்படுத்தியிருந்தான்.” எபிரெயச் சொற்றொடர் அவனைச் சத்தியம் செய்ய வைத்த செயலையோ, கடவுளுடன் தொடர்புடைய அந்த ஆணையின் புனிதமான சூழலையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கழுத்தை விறைப்பாக்குதல்” என்பது பிடிவாதமாக எதிர்த்து அடங்க மறுப்பதைக் குறிக்கும் எபிரெய உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: எதிராகவும்
  rationale: முந்தைய விவரத்துடன் இச்செயலையும் இணைக்கும் எபிரெயச் சேர்க்கைப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד
  choice: நேபுகாத்நேச்சார் அரசனுக்கு எதிராகக் கிளர்ச்சி செய்தான்
  rationale: מָרַד அரசியல் ஆட்சியாளருக்கு எதிரான கிளர்ச்சியைக் குறிக்கிறது; ‘கிளர்ச்சி செய்தான்’ நவீனத் தமிழில் தெளிவான இணைச்சொல்.
- source_word: אֲשֶׁר הִשְׁבִּיעוֹ בֵּאלֹהִים
  choice: அந்த அரசன் அவனைக் கடவுள்மேல் ஆணையிடச் செய்திருந்தான்
  rationale: שׁבע என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஆணையிடச் செய்வதைக் குறிக்கிறது; தொடர்புச் சொல்லின் முன்னிலை நேபுகாத்நேச்சார் என்பதால் அவரே செயப்படுத்துபவர் என வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיֶּקֶשׁ אֶת עָרְפּוֹ
  choice: தன் கழுத்தை விறைப்பாக்கி
  rationale: பிடிவாதமான எதிர்ப்பைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיְאַמֵּץ אֶת לְבָבוֹ
  choice: தன் இதயத்தைக் கடினப்படுத்தினான்
  rationale: אָמֵץ பொதுவாக வலுப்படுத்துதல் என்று பொருள்படலாம்; இங்கு மனந்திரும்ப மறுக்கும் சூழலில் பிடிவாதமாக்குதல் அல்லது கடினப்படுத்துதல் என்ற எதிர்மறைப் பொருள் பொருத்தமானது.
- source_word: מִשּׁוּב אֶל
  choice: நோக்கித் திரும்பாமல்
  rationale: מִן உடன் வரும் வினையெச்ச வடிவம் திரும்புவதிலிருந்து விலகியிருத்தல் அல்லது அதைத் தடுத்தல் என்ற கருத்தைத் தருகிறது; ‘திரும்பாமல்’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெய இணைப்புநிலையைத் தெளிவாகவும் வழக்கமான தமிழிலும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது அதை ஒரு பொதுப் பட்டமாக மாற்றாமல், ஏற்றுக்கொள்ளப்பட்ட நவீன உச்சரிப்புக்கு நெருக்கமாக ஒலிபெயர்க்கிறது.
- issue: இதயத்தைக் கடினப்படுத்தியதற்கும் திரும்பாததற்கும் இடையிலான தொடர்பு
  choice: திரும்பாமல் தன் இதயத்தைக் கடினப்படுத்தினான்
  alternative: திரும்பாதபடி தன் இதயத்தைக் கடினப்படுத்தினான்
  rationale: மூலத்தின் מִן கட்டமைப்பு பிரிவு அல்லது தடை ஆகிய இரு நுணுக்கங்களையும் அனுமதிக்கிறது. நோக்கத்தை மிகத் திட்டவட்டமாக நிர்ணயிக்காமல், திரும்ப மறுத்த நிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெய உருவகமான ‘கழுத்தை விறைப்பாக்குதல்’ விளக்கக் குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது; அரசியல் கிளர்ச்சியும் ஆன்மீகப் பிடிவாதமும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன.
