source:
  edition: WLC
  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
translation:
  language: ta
  text: ஆனால் அவர்கள் தேவனுடைய தூதுவர்களைக்[a] கேலி செய்தும், அவருடைய வார்த்தைகளை இகழ்ந்தும், அவருடைய தீர்க்கதரிசிகளைப் பரிகசித்தும் வந்தார்கள்; யாவேயின் கடுங்கோபம் அவருடைய மக்களுக்கு எதிராக எழுந்து, சீர்படுத்த வழியே இல்லாத நிலை ஏற்படும் வரை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேவனுடைய தேவதூதர்களை.’ ஆனால் அடுத்ததாக வரும் ‘அவருடைய தீர்க்கதரிசிகள்’ என்ற குறிப்பு, இங்கு தேவனால் அனுப்பப்பட்ட மனிதத் தூதுவர்களையே வலுவாகச் சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘குணமாக்குதல் இல்லாத நிலை ஏற்படும் வரை’ அல்லது ‘குணப்படுத்த முடியாத நிலை ஏற்படும் வரை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: செய்தும் ... வந்தார்கள்
  rationale: தொடர்ந்து அல்லது வழக்கமாக நிகழ்ந்த கடந்தகாலச் செயலைக் குறிக்கும் துணைவினை அமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַלְעִבִים
  choice: கேலி செய்தும்
  rationale: அவமதிப்புடன் நகைத்தலைக் குறிக்கிறது; அடுத்துவரும் இணைச் சொற்களிலிருந்து வேறுபட்டும் இயல்பாகவும் உள்ளது.
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  choice: தேவனுடைய தூதுவர்களை
  rationale: מַלְאָךְ என்பதற்கு தூதுவர் அல்லது தேவதூதர் என இரு பொருள் இருக்கலாம். இங்கு ‘அவருடைய தீர்க்கதரிசிகள்’ என்ற இணைச் சொற்றொடர் மனிதத் தூதுவர்களையே வலுவாகச் சுட்டுகிறது.
- source_word: וּבוֹזִים דְּבָרָיו
  choice: அவருடைய வார்த்தைகளை இகழ்ந்தும்
  rationale: בזה குறிக்கும் அவமதிப்பான நிராகரிப்பையும் דְּבָרָיו என்பதன் பன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וּמִתַּעְתְּעִים בִּנְבִיאָיו
  choice: அவருடைய தீர்க்கதரிசிகளைப் பரிகசித்தும்
  rationale: இகழ்ச்சியுடன் கேலி செய்வதைக் குறிக்கிறது; முதல் வினைச்சொல்லை அப்படியே மீண்டும் பயன்படுத்தாமல் எபிரெயச் சொற்றொடரின் படிநிலை அமைப்பைக் காக்கிறது.
- source_word: עַד עֲלוֹת חֲמַת יְהוָה
  choice: இறுதியில், யாவேயின் கடுங்கோபம் ... எழுந்தது
  rationale: עַד עֲלוֹת குறிக்கும் உச்சநிலையை இயல்பான தமிழில் ‘இறுதியில் ... எழுந்தது’ எனத் தருகிறது; חֵמָה-வின் தீவிரத்தை ‘கடுங்கோபம்’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றாமல், தமிழில் அதன் பெயரொலிக்கு நெருக்கமாகக் கொடுக்கிறது.
- source_word: בְּעַמּוֹ
  choice: அவருடைய மக்களுக்கு எதிராக
  rationale: கோபத்தின் இலக்கை இச்சூழலில் தெளிவாகக் காட்டுகிறது.
- source_word: עַד לְאֵין מַרְפֵּא
  choice: நிவாரணமே இல்லாமல் போனது
  rationale: மருத்துவம், குணமாக்குதல், தீர்வு ஆகிய பொருள் வாய்ப்புகளைக் கொண்ட מַרְפֵּא என்பதை நியாயத்தீர்ப்பின் இறுதித் தன்மைக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘தேவனுடைய தூதுவர்கள்’ என்பதன் குறிப்பு
  choice: மனிதத் தீர்க்கதரிசனத் தூதுவர்கள்
  alternative: தேவதூதர்கள்
  rationale: உடனடியாக வரும் ‘அவருடைய தீர்க்கதரிசிகள்’ என்ற இணையான குறிப்பு, தேவனால் அனுப்பப்பட்ட மனிதர்களைக் குறிக்கிறது; எனினும் மூலச்சொல்லின் மற்றொரு பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், எபிரெயப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாகத் தமிழில் எழுதுகிறது.
- issue: עַד לְאֵין מַרְפֵּא என்பதன் இறுதித் தன்மை
  choice: நிவாரணமே இல்லாமல் போனது
  alternative: குணமாக்குதல் இல்லாமல் போனது; குணப்படுத்த முடியாத நிலை ஏற்பட்டது
  rationale: தீர்ப்பு மாற்ற முடியாத நிலையை அடைந்தது என்ற கருத்தைத் தருகிறது; எந்தக் குறிப்பிட்ட பாவமன்னிப்பு அல்லது இரட்சிப்பியல் கோட்பாட்டையும் வசனத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கேலி செய்தும் ... இகழ்ந்தும் ... பரிகசித்தும் வந்தார்கள்’ என்ற மும்மை அமைப்பு மூலத்தின் நீடித்த செயலையும் சொற்படிநிலையையும் காக்கிறது. இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
