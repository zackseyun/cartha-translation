- from: ஆனால் அவர்கள் தேவனுடைய தூதுவர்களைக்[a] கேலி செய்தும், அவருடைய வார்த்தைகளை இகழ்ந்தும், அவருடைய தீர்க்கதரிசிகளைப் பரிகசித்தும் வந்தார்கள். இறுதியில், யாவேயின் கடுங்கோபம் அவருடைய மக்களுக்கு எதிராக எழுந்தது; நிவாரணமே இல்லாமல் போனது.[b]
  to: ஆனால் அவர்கள் தேவனுடைய தூதுவர்களைக்[a] கேலி செய்தும், அவருடைய வார்த்தைகளை இகழ்ந்தும், அவருடைய தீர்க்கதரிசிகளைப் பரிகசித்தும் வந்தார்கள்; யாவேயின் கடுங்கோபம் அவருடைய மக்களுக்கு எதிராக எழுந்து, சீர்படுத்த வழியே இல்லாத நிலை ஏற்படும் வரை.[b]
