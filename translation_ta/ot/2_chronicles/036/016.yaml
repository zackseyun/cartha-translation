  terminology: ‘தேவனுடைய தூதுவர்கள்,’ ‘தீர்க்கதரிசிகள்,’ ‘யாவே,’ மற்றும் ‘கடுங்கோபம்’ ஆகியன பொருத்தமானவை. ‘நிவாரணம்’ என்பதற்குப் பதிலாக ‘சீர்படுத்த வழி’ என்பது מַרְפֵּא-வின் remedy/healing வரம்பைத் தீர்ப்புச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது; அடிக்குறிப்பு ‘குணமாக்குதல்’ மற்றும் ‘குணப்படுத்த முடியாதது’ ஆகிய மாற்றுவாய்ப்புகளைப் பாதுகாக்கிறது.
