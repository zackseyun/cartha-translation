base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
translation:
  language: ta
  text: ஆகையால் அவர் கல்தேயரின் அரசனை[a] அவர்களுக்கு எதிராக வரச்செய்தார். அவன் அவர்களுடைய பரிசுத்த ஆலயத்தில் அவர்களுடைய இளைஞர்களை வாளால் கொன்றான். இளைஞனுக்கோ கன்னிப்பெண்ணுக்கோ[c], முதியவனுக்கோ மிகவும் வயதானவனுக்கோ அவன் இரக்கம் காட்டவில்லை[b]. அனைவரையும் அவர் அவன் கையில் ஒப்புக்கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாபிலோனியரின் அரசனை”; எபிரேயத்தில், “கல்தேயரின்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “விட்டுவைக்கவில்லை.”
    reason: lexical_alternative
  - marker: c
    text: எபிரேயத்தில், “கன்னி”; குறிப்பாகத் திருமணமாகாத இளம் பெண்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עֲלֵיהֶם
  choice: அவர்களுக்கு எதிராக வரச்செய்தார்
  rationale: עלה என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும், עַל என்பதன் எதிர்ப்புப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ כשדיים
  choice: கல்தேயரின் அரசன்
  rationale: எபிரேய இனப்பெயரை நேரடியாகக் காக்கிறது; வரலாற்றுச் சூழலில் ‘பாபிலோனியர்’ என்பதும் சாத்தியமான புரிதல் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּחוּרֵיהֶם
  choice: அவர்களுடைய இளைஞர்கள்
  rationale: வாழ்க்கையின் வலிமையான இளம்பருவத்திலுள்ள ஆண்களைச் சுட்டும் சொல்லை தெளிவான நவீன தமிழில் தருகிறது.
- source_word: בְּבֵית מִקְדָּשָׁם
  choice: அவர்களுடைய பரிசுத்த இடத்தின் ஆலயத்திலேயே
  rationale: ‘அவர்களுடைய பரிசுத்த இடத்தின் வீடு’ என்ற மூல அமைப்பின் கூறுகளைக் காத்து, தமிழில் ஆலயத்தைக் குறிக்கும் இயல்பான தொடராகவும், அங்கேயே கொலை நடந்த வலியுறுத்தலுடனும் வழங்குகிறது.
- source_word: וְלֹא חָמַל
  choice: இரக்கம் காட்டவில்லை
  rationale: இரக்கத்தினால் ஒருவரை விட்டுவைத்தல் அல்லது காப்பாற்றுதல் என்ற חמל சொல்லின் உணர்ச்சி மற்றும் செயற்பொருளை வெளிப்படுத்துகிறது.
- source_word: בָּחוּר וּבְתוּלָה
  choice: இளைஞனோ கன்னிப்பெண்ணோ
  rationale: இரண்டாவது சொல் திருமணமாகாத இளம் பெண்ணை, குறிப்பாக கன்னியைச் சுட்டுவதால் அதன் குறிப்பான பொருள் காக்கப்படுகிறது.
- source_word: זָקֵן וְיָשֵׁשׁ
  choice: முதியவனோ மிகவும் வயதானவனோ
  rationale: வயதின் இரண்டு நிலைகளைச் சொல்லும் எபிரேய இணையின் சொல்லாட்சிப் பெருக்கைத் தமிழிலும் வேறுபடுத்திக் காட்டுகிறது.
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  choice: அனைவரையும் அவர் அவன் கையில் ஒப்புக்கொடுத்தார்
  rationale: உடனடி சூழலில் மக்கள் குறிக்கப்படுவதால் ‘அனைவரையும்’ எனவும், ஒருவரின் அதிகாரத்திற்குள் ஒப்படைத்தல் என்ற சொல்லடக்கை ‘கையில் ஒப்புக்கொடுத்தார்’ எனவும் தருகிறது.
theological_decisions:
- issue: தொடக்க வினை மற்றும் இறுதி வாக்கியத்தின் எழுவாய்
  choice: முந்தைய வசனத்திலிருந்து தொடரும் எழுவாய் கடவுள்; அவர் கல்தேய அரசனை வரச்செய்து அனைவரையும் அவன் கையில் ஒப்புக்கொடுத்தார்.
  alternative: தமிழில் எழுவாயைச் சொல்லாமல் விட்டால் அது தெளிவற்றதாக இருக்கலாம்.
  rationale: எபிரேய வினைகள் ஆண்பால் ஒருமையில் உள்ளன; முந்தைய வசனத்தில் கர்த்தர் எழுவாயாக இருப்பதால் ‘அவர்’ அந்தத் தொடர்ச்சியைக் காக்கிறது. ‘அவன்’ கல்தேய அரசனைத் தெளிவாகச் சுட்டுகிறது.
- issue: கொன்றவன் யார் என்பதன் இலக்கணத் தொடர்பு
  choice: ‘அவன்’ என்பது கல்தேயரின் அரசனைச் சுட்டுகிறது.
  alternative: தொடர்வாக்கியமாக ‘அவன் கொன்றான்’ என்பதற்குப் பதில் தொடர்புப்பெயர் அமைப்பு பயன்படுத்தலாம்.
  rationale: எபிரேயத்தில் அடுத்த ஆண்பால் ஒருமை வினையின் இயல்பான எழுவாய் அருகிலுள்ள கல்தேய அரசனே; தனி வாக்கியம் தமிழில் தெளிவையும் ஓட்டத்தையும் தருகிறது.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ். ‘ஆலயத்திலேயே’ என்பது பரிசுத்த இடத்துக்குள்ளேயே நிகழ்ந்த கொலையின் அதிர்ச்சியை இயல்பாக வலியுறுத்துகிறது. கடவுளைக் குறிக்கும் ‘அவர்’ மற்றும் அரசனைக் குறிக்கும் ‘அவன்’ மூலம் இரு எழுவாய்களும் தெளிவுபடுத்தப்பட்டுள்ளன.
