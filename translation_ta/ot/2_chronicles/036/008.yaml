revisions:
- from: யோயாக்கீமின் மற்ற செயல்களும், அவன் செய்த அருவருப்பான செயல்களும், அவனுக்கு எதிராகக் கண்டறியப்பட்டவையும்[a] இஸ்ரவேல் மற்றும் யூதா அரசர்களின் வரலாற்றுப் புத்தகத்தில் எழுதப்பட்டுள்ளன. அவனுக்குப் பதிலாக அவன் மகன் யோயாக்கீன் அரசனானான்.
  to: யோயாக்கீமின் மீதமுள்ள செயல்களும், அவன் செய்த அருவருப்புகளும், அவனுக்கு எதிராகக் கண்டறியப்பட்டவையும்[a] இஸ்ரவேல் மற்றும் யூதா அரசர்களின் நூலில் எழுதப்பட்டுள்ளன; இதோ, அவை அங்கே எழுதப்பட்டுள்ளன. அவனுக்குப் பதிலாக அவன் மகன் யோயாக்கீன் அரசனானான்.
  rationale: 'திருத்தப்பட்ட உரையில் מקורத்தின் ‘இதோ, அவை எழுதப்பட்டுள்ளன’ என்ற ஒரே வாக்கிய அமைப்பை தவறுதலாக இருமுறை எழுதாமல், இயல்பான தமிழில் அதே வலியுறுத்தலைக் காக்க வேண்டும். எனவே முழு உரையின் பாதுகாப்பான இறுதி வடிவம்: “யோயாக்கீமின் மீதமுள்ள செயல்களும், அவன் செய்த அருவருப்புகளும், அவனுக்கு எதிராகக் கண்டறியப்பட்டவையும்[a] இஸ்ரவேல் மற்றும் யூதா அரசர்களின் நூலில் எழுதப்பட்டுள்ளன; இதோ, அவை அங்கே எழுதப்பட்டுள்ளன” என அல்ல. இந்த மறுஆய்வில் கருவி-புலத்தில் ஒரே வாக்கிய அமைப்பை இரட்டித்துள்ளதால், உண்மையான திருத்தப்பட்ட முழு உரை பின்வருமாறு இருக்க வேண்டும்: “யோயாக்கீமின் மீதமுள்ள செயல்களும், அவன் செய்த அருவருப்புகளும், அவனுக்கு எதிராகக் கண்டறியப்பட்டவையும்[a]—இதோ, அவை இஸ்ரவேல் மற்றும் யூதா அரசர்களின் நூலில் எழுதப்பட்டுள்ளன. அவனுக்குப் பதிலாக அவன் மகன் யோயாக்கீன் அரசனானான்.” இது மூலத்தின் இணைப்புகள், வலியுறுத்தல், மற்றும் நூல்-மேற்கோளைத் தக்கவைக்கிறது.'
