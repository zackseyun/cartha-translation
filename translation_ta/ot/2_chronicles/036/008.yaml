source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהֽוֹיָקִ֜ים וְ/תֹֽעֲבֹתָ֤י/ו אֲשֶׁר עָשָׂה֙ וְ/הַ/נִּמְצָ֣א עָלָ֔י/ו הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר מַלְכֵ֥י יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: The rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
translation:
  language: ta
  text: யோயாக்கீமின் மீதமுள்ள செயல்களும், அவன் செய்த அருவருப்புகளும், அவனுக்கு எதிராகக் கண்டறியப்பட்டவையும்[a] இஸ்ரவேல் மற்றும் யூதா அரசர்களின் நூலில் எழுதப்பட்டுள்ளன; இதோ, அவை அங்கே எழுதப்பட்டுள்ளன. அவனுக்குப் பதிலாக அவன் மகன் யோயாக்கீன் அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனைப் பற்றிக் கண்டறியப்பட்டவையும்.” எபிரெயச் சொற்றொடர் யோயாக்கீமைப் பற்றிக் கண்டறியப்பட்டவற்றைப் பொதுவாகக் குறிக்கலாம்; ஆனால் எதிர்மறையான சூழலில் “அவனுக்கு எதிராக” என்பது பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: யோயாக்கீமின் மற்ற செயல்களும்
  rationale: அரசர் பற்றிய வரலாற்றுச் சுருக்கங்களில் דִּבְרֵי என்பது சொற்களை மட்டுமல்லாமல் அவரது ஆட்சிக்காலச் செயல்களையும் நிகழ்வுகளையும் குறிக்கிறது; יֶתֶר என்பதற்கு இயல்பான தமிழில் ‘மற்ற’ என வழங்கப்பட்டது.
- source_word: וְתֹעֲבֹתָיו אֲשֶׁר עָשָׂה
  choice: அவன் செய்த அருவருப்பான செயல்களும்
  rationale: תֹּועֵבָה வலுவான அறநெறி அல்லது வழிபாட்டுச் சார்ந்த வெறுப்புணர்வைக் குறிக்கிறது. ‘அருவருப்பான செயல்கள்’ அதன் மதிப்பீட்டு வலிமையைத் தக்கவைத்து நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: וְהַנִּמְצָא עָלָיו
  choice: அவனுக்கு எதிராகக் கண்டறியப்பட்டவையும்
  rationale: נמצא என்ற செயல்பாட்டு வடிவத்தையும் עָלָיו என்பதன் பாதகமான சாத்தியப் பொருளையும் தக்கவைக்கிறது; சட்டரீதியான ‘குற்றச்சாட்டுகள்’ என்று தேவைக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: הִנָּם כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: தமிழில் இயல்பான வாக்கிய அமைப்பில் மூலத்தின் கவனஈர்ப்புத் துகள் הִנָּם தனியாக மொழிபெயர்க்கப்படாமல், பதிவு உண்மையை உறுதியாகக் கூறும் நிறைவு வினையில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: இஸ்ரவேல் மற்றும் யூதா அரசர்களின் வரலாற்றுப் புத்தகம்
  rationale: இது அரசர்களைப் பற்றிய எழுத்துப் பதிவைக் குறிக்கும் தலைப்புப்போன்ற மேற்கோள். ‘வரலாற்று’ என்பது தமிழில் இதை அரசர்களால் எழுதப்பட்ட புத்தகம் என்று தவறாகப் புரிந்துகொள்ளாமல் இருக்க உதவுகிறது.
- source_word: וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக அவன் மகன் யோயாக்கீன் அரசனானான்
  rationale: அரச வாரிசுரிமை அறிவிப்பை இயல்பான தமிழில் தருகிறது; תַּחְתָּיו என்பதன் ‘அவனுடைய இடத்தில்’ என்ற பொருள் ‘அவனுக்குப் பதிலாக’ என வெளிப்படுகிறது.
theological_decisions:
- issue: וְהַנִּמְצָא עָלָיו என்பதன் பாதகமான அல்லது பொதுவான தொடர்புப் பொருள்
  choice: அவனுக்கு எதிராகக் கண்டறியப்பட்டவை
  alternative: அவனைப் பற்றிக் கண்டறியப்பட்டவை
  rationale: முந்தைய ‘அருவருப்பான செயல்கள்’ என்ற எதிர்மறைச் சூழல் ‘எதிராக’ என்பதைக் ஆதரிக்கிறது; எனினும் எபிரெய வெளிப்பாடு பொதுவாக அவனைப் பற்றிக் கண்டறியப்பட்டவற்றையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குத் தெளிவானதும் வரலாற்று நூலுக்கேற்ற கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகம மரபுக்கு ஒத்த வடிவில் வழங்கப்பட்டுள்ளன; மூலத்தின் உண்மையான பொருள் தெளிவின்மை அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது.
