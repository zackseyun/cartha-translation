reference: 2 Chronicles 36:22
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת אַחַ֗ת לְ/כ֨וֹרֶשׁ֙ מֶ֣לֶךְ פָּרַ֔ס לִ/כְל֥וֹת דְּבַר יְהוָ֖ה בְּ/פִ֣י יִרְמְיָ֑הוּ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ כּ֣וֹרֶשׁ מֶֽלֶךְ פָּרַ֔ס וַ/יַּֽעֲבֶר קוֹל֙ בְּ/כָל מַלְכוּת֔/וֹ וְ/גַם בְּ/מִכְתָּ֖ב לֵ/אמֹֽר־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
translation:
  language: ta
  text: 'பெர்சிய அரசனாகிய கோரேசின் முதலாம் ஆண்டில், எரேமியாவின் வாய்மூலம்[a] யெகோவா கூறிய வார்த்தை நிறைவேறும்படி, யெகோவா பெர்சிய அரசனாகிய கோரேசின் மனதைத் தூண்டினார்; அவன் தன் ராஜ்யம் முழுவதும் ஒரு அறிவிப்பை வெளியிட்டு, அதை எழுத்து வடிவிலும் வெளியிட்டான்; இவ்வாறு கூறினான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எரேமியாவின் மூலம்’; எபிரேய மொழியில் சொல்லுக்குச் சொல், ‘எரேமியாவின் வாயினால்.’
    reason: ‘வாய்மூலம்’ என்ற எபிரேய மரபுத்தொடரின் நேரடி வடிவத்தையும் இயல்பான மாற்று மொழிபெயர்ப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת אַחַת
  choice: முதலாம் ஆண்டில்
  rationale: காலத்தைக் குறிக்கும் இயல்பான தமிழ் வடிவம்; தொடக்க வாவைத் தனியாக மொழிபெயர்க்காமல் உரையின் தொடர்ச்சியில் வெளிப்படுத்துகிறது.
- source_word: לְ/כ֨וֹרֶשׁ מֶ֣לֶךְ פָּרַ֔ס
  choice: பெர்சிய அரசன் கோரேசின்
  rationale: அரசப் பட்டத்தையும் பெயரையும் நவீன தமிழில் இயல்பாக அமைக்கிறது.
- source_word: לִ/כְל֥וֹת דְּבַר יְהוָה
  choice: யெகோவா உரைத்த வார்த்தை நிறைவேறும்படி
  rationale: இறைவாக்கின் நிறைவேற்றத்தைக் குறிக்கும் நோக்கம் அல்லது விளைவு இரண்டையும் இயல்பாகத் தாங்குகிறது.
- source_word: בְּ/פִ֣י יִרְמְיָ֑הוּ
  choice: எரேமியாவின் வாய்மூலம்
  rationale: ‘வாயினால்/வாய்மூலம்’ என்ற எபிரேய உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הֵעִיר
  choice: தூண்டினார்
  rationale: ஒருவரின் உள்ளார்ந்த மனப்பாங்கை எழுப்பி செயல்படச் செய்வதைக் குறிக்கும் இயல்பான தமிழ் வினை.
- source_word: אֶת רוּחַ כּוֹרֶשׁ
  choice: கோரேசின் உள்ளத்தை
  rationale: இங்கு רוּחַ என்பது கோரேசின் உள்ளார்ந்த உந்துதலைக் குறிப்பதால் ‘உள்ளம்’ வாசகருக்கு இயல்பாக உள்ளது; வெறும் மனவியல் பொருளாகக் குறுக்கப்படவில்லை.
- source_word: וַ/יַּֽעֲבֶר קוֹל
  choice: ஒரு அறிவிப்பைச் செய்யவும்
  rationale: சொல்லாட்சியாக ‘குரலைக் கடத்தினான்’ என்பதற்குப் பதிலாக, ராஜ்யம் முழுவதும் செய்தியைப் பிரகடனப்படுத்திய கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: בְּ/כָל מַלְכוּת/וֹ
  choice: தன் ஆட்சி நாடு முழுவதும்
  rationale: அறிவிப்பு அவனுடைய முழு ராஜ்யத்திலும் பரவியதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְ/גַם בְּ/מִכְתָּב
  choice: அதை எழுத்திலும் வெளியிடவும்
  rationale: வாய்மொழிப் பிரகடனத்துடன் எழுத்து வடிவமும் இருந்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵ/אמֹר
  choice: 'இவ்வாறு கூறினான்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றிற்கு இயல்பான அறிமுகம்.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: நான்கு எழுத்து இறைப் பெயரைப் பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது; தமிழில் பரவலாக அறியப்படும் வடிவம் பயன்படுத்தப்பட்டது.
- issue: רוּחַ כּוֹרֶשׁ என்பதன் பொருள்
  choice: கோரேசின் உள்ளம்
  alternative: கோரேசின் ஆவி
  rationale: இந்தச் சூழலில் அரசனின் உள்ளார்ந்த மனப்பாங்கும் செயல் உந்துதலும் முன்னிலையாகின்றன; ‘ஆவி’ என மொழிபெயர்ப்பதால் தனியான ஆன்மீகப் பொருள் தேவையின்றி உருவாகக்கூடும்.
- issue: לִכְלוֹת என்பதிலுள்ள நோக்கம்/விளைவு உறவு
  choice: நிறைவேறும்படி
  alternative: நிறைவேறுவதற்காக
  rationale: இறைவார்த்தை நிறைவேறியது என்ற கருத்தைப் பாதுகாத்து, இது நோக்கமா விளைவா என்பதை அளவுக்கு மீறி வரையறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ். நீண்ட எபிரேய வாக்கியத்தின் தொடர்பைத் தக்கவைத்தபடியே தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது.
