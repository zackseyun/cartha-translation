base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
translation:
  language: ta
  text: 'பெர்சியாவின் அரசனாகிய கோரேசு கூறுவது இதுவே: “வானத்தின் கடவுளாகிய யாவே[a] பூமியிலுள்ள எல்லா அரசுகளையும் எனக்குத் தந்திருக்கிறார். யூதாவிலுள்ள எருசலேமில் தமக்காக ஓர் ஆலயத்தைக் கட்டும்படி அவர் எனக்குக் கட்டளையிட்டிருக்கிறார். உங்களுள் அவருடைய மக்களில் எவராயிருந்தாலும், அவருடைய கடவுளாகிய யாவே அவரோடு இருப்பாராக[b]; அவர் எருசலேமுக்குச் செல்லட்டும்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் கடவுளுடைய தனிப்பட்ட திருநாமமான יהוה (YHWH) உள்ளது.
    reason: திருநாம விளக்கம்
  - marker: b
    text: இதனை, “அவருடைய கடவுளாகிய யாவே அவரோடு இருக்கிறார்” என்றும் வாசிக்கலாம். வினைச்சொல் இல்லாத எபிரேயத் தொடர் சுட்டுநிலையாகவும் புரிந்துகொள்ளப்படலாம்; இச்சூழலில் ஆசீர்வாதப் பொருள் அதிகம் பொருந்துகிறது.
    reason: மாற்று வாசிப்பு
  - marker: c
    text: எபிரேயத்தில் சொற்சொல்லாக, “அவர் மேலே செல்லட்டும்.” எருசலேமுக்குச் செல்வதை ‘மேலே செல்லுதல்’ என்று சொல்வது வழக்கமான வேதாகம மரபுத்தொடர்.
    reason: பண்பாட்டு மற்றும் மொழியியல் குறிப்பு
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: அரச அறிவிப்புக்குரிய எபிரேயத் தூதர் சூத்திரத்தை இயல்பான நவீனத் தமிழில் நிகழ்காலத் தன்மையுடன் வழங்குகிறது.
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: பெர்சியாவின் அரசனாகிய கோரேசு
  rationale: பெயரைத் தமிழில் வழக்கமான வேதாகம வடிவில் ஒலிபெயர்த்து, அரச பட்டத்தைத் தெளிவாகக் கொடுக்கிறது.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: பூமியிலுள்ள எல்லா அரசுகளையும்
  rationale: இங்கு אֶרֶץ பரந்த புவிசார் பொருளைக் கொண்டது; ‘நாடு’ என்று குறுக்காமல் ‘பூமி’ என வழங்கப்பட்டுள்ளது.
- source_word: נָתַן לִי
  choice: எனக்குத் தந்திருக்கிறார்
  rationale: முன்னர் நிகழ்ந்த கொடையின் தற்போதைய விளைவைத் தமிழின் நிறைவுநிலை வடிவம் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: வானத்தின் கடவுள்
  rationale: எபிரேய இணைப்புச் சொற்றொடரின் பொருளை இயல்பான தமிழில் துல்லியமாகக் கொடுக்கிறது.
- source_word: וְהוּא פָקַד עָלַי
  choice: அவர் எனக்குக் கட்டளையிட்டிருக்கிறார்
  rationale: இந்தச் சூழலில் פקד ஒப்படைக்கப்பட்ட அதிகாரபூர்வ பணியைக் குறிக்கிறது; ‘கட்டளையிட்டார்’ என்பது சாதாரண வாசகருக்குத் தெளிவு.
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: தமக்காக ஓர் ஆலயத்தைக் கட்டும்படி
  rationale: בַיִת என்பதன் நேர்ப்பொருள் ‘வீடு’ என்றாலும், இங்கு எருசலேமில் கடவுளுக்குக் கட்டப்படும் வழிபாட்டுக் கட்டிடமே குறிக்கப்படுவதால் தமிழில் ‘ஆலயம்’ தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
