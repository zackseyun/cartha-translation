translation_notes:
  register: நவீன நிலையான தமிழில், அரச அறிவிப்புக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடையைப் பயன்படுத்தியது. ‘தமக்காக’ என்பது கடவுளைக் குறிக்கும் மரியாதைத் தற்சுட்டு. சுருக்கமான எபிரேய இறுதித் தொடரின் அசைவு மற்றும் ஆசீர்வாதத் தன்மை பாதுகாக்கப்பட்டுள்ளன.
