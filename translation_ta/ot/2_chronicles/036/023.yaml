  rationale: எபிரேய உறவுப்பிரிவின் முழுப் பொருளையும் இயல்பான தமிழ் இடப்பெயர்ச் சொற்றொடராக வழங்குகிறது.
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: உங்களில் அவருடைய மக்கள் அனைவரிலும் யார் இருக்கிறாரோ
  rationale: சுருக்கமான எபிரேயப் பகுதி, அங்குள்ள கர்த்தருடைய மக்களில் எந்த ஒருவரும் பதிலளிக்கலாம் என்ற பகுதியுறவு அர்த்தத்துடன் நெருக்கமாக வைக்கப்பட்டுள்ளது.
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  choice: அவருடைய கடவுளாகிய யெகோவா அவரோடு இருப்பாராக
  rationale: வினையற்ற எபிரேய வாக்கியத்தைச் சூழலுக்கு ஏற்ற ஆசீர்வாத விருப்பாகத் தருகிறது; சுட்டுநிலை வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
