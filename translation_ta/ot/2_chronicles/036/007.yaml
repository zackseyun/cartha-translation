base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
translation:
  language: ta
  text: நேபுகாத்நேச்சார் யாவேயின் ஆலயப் பாத்திரங்களில் சிலவற்றையும் பாபிலோனுக்குக் கொண்டு சென்று, பாபிலோனிலுள்ள தன் ஆலயத்தில்[a] வைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் அரண்மனையில்.’ எபிரேயச் சொல் சூழலைப் பொறுத்து ஆலயத்தையோ அரண்மனையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִכְּלֵי
  choice: பாத்திரங்களில் சிலவற்றையும்
  rationale: מִן இங்கு பகுதியைக் குறிக்கும் பொருளில் வருவதால் ‘பாத்திரங்களில் சிலவற்றை’ என்று மொழிபெயர்க்கப்பட்டது; וּ இணைப்பும் கூடுதல் பொருளும் ‘-யும்’ மூலம் வெளிப்படுத்தப்பட்டன.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: எபிரேயச் சொற்றொடர் நேரடியாக ‘யாவேயின் வீடு’ என இருந்தாலும், வழிபாட்டுக் கட்டடத்தைக் குறிக்கும் சூழலில் நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் ‘யாவேயின் ஆலயம்’ என வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் உள்ள இறைபெயரை ஒரு பொதுப்பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הֵבִיא
  choice: கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘கொண்டுவருதல்’ எனப் பொருள்படுகிறது; அடுத்த வினையுடன் இயல்பாக இணைய வினையெச்ச வடிவம் பயன்படுத்தப்பட்டது.
- source_word: נְבוּכַדְנֶאצַּר
  choice: நேபுகாத்நேச்சார்
  rationale: பெயர் தமிழில் நிலைபெற்றுள்ள வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு வழங்கப்பட்டது.
- source_word: לְבָבֶל
  choice: பாபிலோனுக்கு
  rationale: לְ இங்கு செல்லும் இலக்கைச் சுட்டுவதால் நான்காம் வேற்றுமை உருபுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּתְּנֵם
  choice: வைத்தார்
  rationale: נתן இச்சூழலில் பொருட்களை ஓர் இடத்தில் வைப்பதைக் குறிக்கிறது; தமிழ் உரைநடைக்கு ஏற்ற மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டது.
- source_word: בְּהֵיכָלוֹ
  choice: தன் கோவிலில்
  rationale: הֵיכָל என்பதற்கு ‘கோவில்’ அல்லது ‘அரண்மனை’ என இரு பொருள்கள் இருக்கலாம். புனிதப் பாத்திரங்கள் வைக்கப்படும் சூழலால் ‘கோவில்’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது; உடைமைப் பின்னொட்டு ‘தன்’ எனத் தெளிவாக்கப்பட்டது.
- source_word: בְּבָבֶל
  choice: பாபிலோனிலிருந்த
  rationale: இடத்தைக் குறிக்கும் בְּ தமிழில் இடப்பொருளாக வழங்கப்பட்டு, கோவில் பாபிலோனில் இருந்ததை இயல்பாகத் தெரிவிக்க பெயரெச்ச வடிவம் பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் தனிப்பட்ட இறைபெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்கப்பட்டது.
- issue: நேபுகாத்நேச்சாரின் הֵיכָל என்பதன் பொருள்
  choice: தன் கோவில்
  alternative: தன் அரண்மனை
  rationale: ஆலயத்திலிருந்து எடுத்த புனிதப் பாத்திரங்களை வைத்த சூழல் வழிபாட்டுக் கட்டடத்தைக் குறிப்பதற்குச் சாதகமாக உள்ளது. இருப்பினும் எபிரேயச் சொல்லின் உண்மையான சொற்பொருள் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. பகுதியைக் குறிக்கும் מִן வெளிப்படையாக மொழிபெயர்க்கப்பட்டு, הֵיכָל என்பதிலுள்ள பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
