base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
translation:
  language: ta
  text: அப்போது நாட்டின் மக்கள்[a] யோசியாவின் மகன் யோவாகாசை எடுத்து, அவனுடைய தந்தைக்குப் பதிலாக எருசலேமில் அரசனாக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொதுமக்கள்.” “நாட்டின் மக்கள்” என்ற எபிரெயச் சொற்றொடர் நாட்டின் மக்கள்தொகையைக் குறிக்கலாம்; சில சூழல்களில், அவர்களுக்குள் இருந்த ஒரு குறிப்பிட்ட சமூகக் குழுவையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: தேர்ந்தெடுத்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்தல்’. இச்சூழலில் ஒருவரை அரசனாக்குவதற்காக மக்களால் எடுத்துக்கொள்ளப்பட்டதைக் குறிக்கிறது. தமிழில் ‘தேர்ந்தெடுத்து’ என்பது வற்புறுத்திப் பிடித்தார்கள் என்ற தேவையற்ற பொருளைச் சேர்க்காமல், அந்தச் சூழ்நிலைப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַם הָאָרֶץ
  choice: நாட்டின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் பரந்த பொருளைத் தக்கவைத்து, அதை ஒரு குறிப்பிட்ட சமூக வகுப்பாக முன்கூட்டியே குறுக்காமல் கூறும் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: יְהוֹאָחָז
  choice: யோவாகாஸ்
  rationale: எபிரெயப் பெயருக்கான தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: யோசியாவின் மகன்
  rationale: வம்ச உறவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיַּמְלִיכֻהוּ
  choice: அரசனாக்கினார்கள்
  rationale: מלך என்பதன் ஹிஃபில் வடிவிலுள்ள ‘ஒருவரை அரசனாக்குதல்’ என்ற காரணவினைப் பொருளைத் துல்லியமாகத் தருகிறது; முடிசூட்டும் சடங்கு நடந்ததாக உரையில் இல்லாத தகவலைச் சேர்ப்பதில்லை.
- source_word: תַחַת אָבִיו
  choice: அவனுடைய தந்தைக்குப் பதிலாக
  rationale: இங்கு תחת என்பது இடத்தைக் குறிக்காமல், தந்தையைத் தொடர்ந்து அவரது இடத்தில் ஆட்சி ஏற்றதைக் குறிக்கிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: ב முன்னிடைச்சொல்லுடன் வரும் இடப்பெயரை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
