base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/004.yaml
  text: 'This is what you shall do: one third of you who come in on the Sabbath[a], of the priests and of the Levites, shall be gatekeepers of the thresholds.'
translation:
  language: ta
  text: '“நீங்கள் செய்ய வேண்டியது இதுதான்: ஓய்வுநாளில் பணிக்கு வருகிற உங்களுள் ஆசாரியர்களிலும் லேவியர்களிலும் மூன்றில் ஒரு பங்கினர் வாசற்படிகளைக் காக்கும் வாயிற்காவலர்களாக[a] இருக்க வேண்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வாசற்படிகளின் வாயிற்காவலர்களாக இருக்க வேண்டும்.” எபிரெயச் சொற்றொடர் ‘வாயிற்காவலர்கள்’ என்பதையும் ‘வாசற்படிகள்’ என்பதையும் இணைத்து, நுழைவிடங்களைக் காப்பதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: நீங்கள் செய்ய வேண்டியது இதுதான்
  rationale: எபிரெய அறிமுகக் கட்டளையின் வலிமையைப் பேணியபடி, நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: உங்களில் மூன்றில் ஒரு பங்கு
  rationale: அழைக்கப்பட்ட குழுவிலிருந்து மூன்றில் ஒரு பகுதியைக் குறிக்கும் பகுதிப்பொருளைத் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: ஓய்வுநாளன்று பணிக்கு வருகிற
  rationale: சொல்லாட்சியில் ‘ஓய்வுநாளில் வருகிறவர்கள்’ என்றாலும், சூழலில் கோவில் பணிமுறைக்கு வருவதைக் குறிக்கிறது; ‘பணிக்கு’ என்பது இதை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: ஆசாரியர்களும் லேவியர்களும்
  rationale: வருகிற குழுவை அடையாளப்படுத்தும் இணைப்புச் சொற்றொடராகத் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது; எபிரெயத்தின் சற்றே நெருக்கமான தொடரமைப்பை தேவையின்றி அப்படியே பின்பற்றவில்லை.
- source_word: לְשֹׁעֲרֵי הַסִּפִּים
  choice: வாசற்படிகளின் வாயிற்காவலர்களாக
  rationale: שֹׁעֲרֵי என்பதன் ‘வாயிற்காவலர்கள்’ என்ற பணிப்பெயரையும், סִפִּים என்பதன் ‘வாசற்படிகள்/நுழைவிடங்கள்’ என்ற உறுதியான படிமத்தையும் பேணுகிறது.
