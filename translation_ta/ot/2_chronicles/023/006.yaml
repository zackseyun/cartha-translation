  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
translation:
  language: ta
  text: ஆசாரியர்களும் ஊழியம் செய்யும் லேவியர்களும் தவிர வேறு யாரும் யெகோவாவின் இல்லத்திற்குள்[a] நுழையக் கூடாது. அவர்கள் பரிசுத்தமானவர்கள் என்பதால் நுழையலாம். மக்கள் அனைவரும் யெகோவாவின் கடமையைக் கடைப்பிடிக்க வேண்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெகோவாவின் ஆலயத்திற்குள்.” சொல்லுக்கு சொல், “யெகோவாவின் இல்லத்திற்குள்.”
    reason: lexical_alternative
  - marker: b
    text: “யெகோவாவின் கடமையைக் கடைப்பிடிக்க வேண்டும்” என்பதை “யெகோவாவுக்காகக் காவல் காக்க வேண்டும்” அல்லது “யெகோவா ஒப்படைத்த கடமையை நிறைவேற்ற வேண்டும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יָבוֹא
  choice: நுழையக் கூடாது
  rationale: אַל உடன் வரும் வினைவடிவம் தடையைத் தெரிவிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் எதிர்மறைக் கட்டளையை வெளிப்படுத்துகிறது.
- source_word: בֵית יְהוָה
  choice: யெகோவாவின் இல்லம்
  rationale: எபிரெயச் சொல்லாக்கமான ‘யெகோவாவின் வீடு/இல்லம்’ என்பதைப் பாதுகாக்கிறது; சூழலில் இது ஆலயத்தைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பட்டமாக மாற்றாமல், நான்கெழுத்துத் திருப்பெயரைத் தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
- source_word: כִּי אִם
  choice: தவிர
  rationale: முந்தைய தடைக்கு அனுமதிக்கப்பட்ட விதிவிலக்கைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: הַכֹּהֲנִים וְהַמְשָׁרְתִים לַלְוִיִּם
  choice: ஆசாரியர்களும் ஊழியம் செய்யும் லேவியர்களும்
  rationale: מְשָׁרְתִים என்பதை லேவியர்களோடு இணைத்து, ஆலயப் பணியில் ஈடுபடுவோர் என்ற வழிபாட்டுச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֵמָּה יָבֹאוּ
  choice: அவர்கள் ... உள்ளே நுழையலாம்
  rationale: விதிவிலக்காகக் குறிப்பிடப்பட்டவர்களுக்கு வழங்கப்பட்ட அனுமதியைச் சூழலுக்கேற்ப வெளிப்படுத்துகிறது.
- source_word: כִּי קֹדֶשׁ הֵמָּה
  choice: அவர்கள் பரிசுத்தமானவர்கள் என்பதால்
  rationale: கோயில் நுழைவுக்குரிய சடங்கு சார்ந்த அர்ப்பணிப்பு நிலையை ‘பரிசுத்தம்’ என்ற வேதாகமப் பதத்தால் தருகிறது; பாவமற்றவர்கள் என்ற பொருளைச் சேர்ப்பதில்லை.
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  choice: யெகோவா விதித்த காவல் கடமையைக் கடைப்பிடிக்க வேண்டும்
  rationale: שמר משמרת என்பதிலுள்ள ‘காத்தல்’ மற்றும் ‘ஒப்படைக்கப்பட்ட கடமையை நிறைவேற்றுதல்’ ஆகிய இரு நிழற்பொருள்களையும் ‘காவல் கடமை’ என்பதன் மூலம் தக்கவைக்கிறது; இணைப்பின் பொருளை நவீன தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: ஆசாரியர்களும் லேவியர்களும் பரிசுத்தமானவர்கள் எனப்படுதல்
  choice: ‘பரிசுத்தமானவர்கள்’ என்று மொழிபெயர்த்து, ஆலய நுழைவுக்கான சடங்கு சார்ந்த அர்ப்பணிப்பு நிலையைக் குறிக்க விடப்பட்டது.
  alternative: ‘அர்ப்பணிக்கப்பட்டவர்கள்’ அல்லது ‘தனியே பிரிக்கப்பட்டவர்கள்’
  rationale: קֹדֶשׁ என்ற மூலச் சொல்லின் வேதாகம வகைப்பாட்டைப் பாதுகாக்கிறது; இது ஒழுக்க ரீதியான பூரணத்தைக் கூறுகிறது என்று உரைக்குள் சேர்த்து விளக்கவில்லை.
- issue: இறைபெயர் יְהוָה
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: இறைப்பட்டத்தால் மாற்றாமல் தனிப்பெயராக வழங்குகிறது. தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பைத் தேர்ந்தெடுக்கிறது; எபிரெய உச்சரிப்பின் மறுகட்டமைப்பு குறித்த விவாதத்தை வசனத்தில் தீர்மானிக்கவில்லை.
- issue: מִשְׁמֶרֶת என்பதன் பொருள்
  choice: காவல் கடமை
  alternative: காவல்; கட்டளை; ஒப்படைக்கப்பட்ட கடமை
  rationale: சொல் காவல் நிற்பதையும் விதிக்கப்பட்ட புனிதப் பொறுப்பைக் கடைப்பிடிப்பதையும் குறிக்கக்கூடும். இரு நிழற்பொருள்களையும் உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஆசாரியர்,’ ‘லேவியர்,’ ‘பரிசுத்தம்’ போன்ற பொதுவாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. மூலத்தில் உள்ள தடை, அனுமதி, காரணம், மக்களுக்கான கடமை ஆகிய தொடர்புகள் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
