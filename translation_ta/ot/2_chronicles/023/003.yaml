  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת כָּל הַ/קָּהָ֥ל בְּרִ֛ית בְּ/בֵ֥ית הָ/אֱלֹהִ֖ים עִם הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר לָ/הֶ֗ם הִנֵּ֤ה בֶן הַ/מֶּ֨לֶךְ֙ יִמְלֹ֔ךְ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה עַל בְּנֵ֥י דָוִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: ta
  text: சபையினர் அனைவரும் கடவுளின் ஆலயத்தில் அரசனுடன் உடன்படிக்கை செய்துகொண்டார்கள். அவர் அவர்களிடம், “இதோ, அரசனின் மகன் ஆட்சி செய்வார்; தாவீதின் மகன்களைக் குறித்து ஆண்டவர் கூறியபடியே” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל הַקָּהָל
  choice: சபையார் அனைவரும்
  rationale: முழுவதுமாகக் கூடியிருந்த சமூகத்தைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பான, மரியாதையான நவீனத் தமிழில் வழங்குகிறது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: முறைப்படியான, கட்டுப்படுத்தும் covenant உறவைத் தெளிவாகக் குறிக்கும் நிலையான தமிழ் சொல்.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் வலிமையைச் சுருக்கமாகப் பேணுகிறது.
- source_word: יִמְלֹךְ
  choice: ஆட்சி செய்வார்
  rationale: அரசராக ஆளுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; வெறும் பதவியேற்பு எனச் சுருக்கவில்லை.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயருக்கான பரவலாக அறியப்படும் மரியாதைமிக்க தமிழ் வேதாகம மரபைப் பின்பற்றுகிறது.
- source_word: עַל בְּנֵי דָוִיד
  choice: தாவீதின் மகன்களைக் குறித்து
  rationale: עַל என்பதன் இங்குள்ள ‘குறித்து’ என்ற தொடர்பையும், בְּנֵי என்பதன் பன்மையையும் நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: ‘அரசன்’ என்பவர் யார், ‘அவர் கூறினார்’ என்பதன் உரையாளர் யார் என்ற தொடரியல்
  choice: முதல் வாக்கியத்தில் ‘அரசனுடன்’ என்றும் அடுத்ததில் ‘அவர்’ என்றும் மூலத்தின் அமைப்பைப் பேணுதல்
  alternative: யோயாதா என்று உரையாளரைப் பெயரிட்டு தெளிவாக்குதல்
  rationale: சூழலில் உரையாளர் யோயாதா என்பது புரிந்தாலும், இவ்வசனம் பெயரை மீண்டும் சொல்லவில்லை; மொழிபெயர்ப்பு மூலத்தின் குறிப்பீட்டு அமைப்பைத் தேவையின்றி விளக்கமிடவில்லை.
- issue: தாவீதின் வம்சத்தைப் பற்றிய வாக்குறுதியின் வடிவம்
  choice: ‘தாவீதின் மகன்களைக் குறித்து ஆண்டவர் கூறியபடியே’
  alternative: ‘தாவீதின் சந்ததியினருக்கு ஆண்டவர் வாக்களித்தபடியே’
  rationale: மூலத்தில் ‘கூறினார்’ என்றும் ‘மகன்களைக் குறித்து’ என்றும் உள்ளது; அதை ‘வாக்களித்தார்’ அல்லது ‘சந்ததி’ எனத் தத்துவ விளக்கத்துடன் மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், அரசவைக் காட்சிக்கும் உடன்படிக்கைச் சூழலுக்கும் ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. நேரடி உரையின் வலியுறுத்தலை ‘இதோ’ பேணுகிறது.
