revisions:
- from: சபையார் அனைவரும் கடவுளின் ஆலயத்தில் அரசனுடன் உடன்படிக்கை செய்துகொண்டார்கள். அப்போது அவர் அவர்களிடம், “இதோ, அரசனின் மகனே ஆட்சி செய்வார்; தாவீதின் மகன்களைக் குறித்து ஆண்டவர் கூறியபடியே இது நடக்கும்” என்றார்.
  to: சபையினர் அனைவரும் கடவுளின் ஆலயத்தில் அரசனுடன் உடன்படிக்கை செய்துகொண்டார்கள். அவர் அவர்களிடம், “இதோ, அரசனின் மகன் ஆட்சி செய்வார்; தாவீதின் மகன்களைக் குறித்து ஆண்டவர் கூறியபடியே” என்றார்.
  rationale: The revision removes the unsupported addition “இது நடக்கும்,” retains the source’s concise comparative ending, and makes a minor idiomatic improvement to the rendering of “all the assembly.” The unnamed speaker is retained as “அவர்,” preserving the source’s referential economy rather than supplying a name from context.
