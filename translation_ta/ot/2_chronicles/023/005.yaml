source:
  edition: WLC
  text: וְ/הַ/שְּׁלִשִׁית֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/הַ/שְּׁלִשִׁ֖ית בְּ/שַׁ֣עַר הַ/יְס֑וֹד וְ/כָל הָ/עָ֔ם בְּ/חַצְר֖וֹת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/005.yaml
  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
translation:
  language: ta
  text: மூன்றில் ஒரு பகுதியினர் அரச மாளிகையிலும், மூன்றில் ஒரு பகுதியினர் அஸ்திவார வாசலிலும்[a] இருக்க வேண்டும். மக்கள் அனைவரும் யாவேயின் ஆலய முற்றங்களில் இருக்க வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அஸ்திவாரத்தின் வாசல்.” இது ஒரு குறிப்பிட்ட வாசலின் பெயராக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: மூன்றில் ஒரு பகுதியினர்
  rationale: பெண்பால் வரிசை எண்ணாகிய இந்தச் சொல் இங்கு பெயர்ச்சொல் போலப் பயன்படுத்தப்பட்டு, குழுவின் மூன்றில் ஒரு பகுதியைக் குறிக்கிறது. சூழலில் நபர்கள் பகுக்கப்படுவதால் ‘பகுதியினர்’ என்பது இயல்பான தமிழ்.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: அரச மாளிகையில்
  rationale: சொல்லர்த்தமாக ‘அரசனின் வீட்டில்’ என்றாலும், இங்கு அரசன் வசிக்கும் அரண்மனை வளாகமே குறிக்கப்படுகிறது. ‘அரச மாளிகை’ நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּשַׁעַר הַיְסוֹד
  choice: அஸ்திவார வாசலில்
  rationale: שַׁעַר என்பது ‘வாசல்’; יְסוֹד என்பது ‘அஸ்திவாரம்/அடித்தளம்’. இது குறிப்பிட்ட வாசலின் பெயராக இருக்கக்கூடும் என்பதால், ‘அஸ்திவார வாசல்’ எனப் பெயர்போல மொழிபெயர்க்கப்பட்டுள்ளது; எபிரெயச் சொற்றொடரின் வேறொரு புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְכָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: עָם என்பதற்கான இயல்பான பொதுப் பொருள் ‘மக்கள்’. தமிழ் வாக்கிய அமைப்புக்கு ஏற்றவாறு ‘மக்கள் அனைவரும்’ என வழங்கப்பட்டுள்ளது.
- source_word: בְּחַצְרוֹת
  choice: முற்றங்களில்
  rationale: חָצֵר என்பதன் பன்மை, சுற்றுச்சுவரால் வரையறுக்கப்பட்ட திறந்த முற்றங்களைக் குறிக்கிறது. ஆலயச் சூழலில் ‘முற்றங்கள்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லர்த்தமாக ‘யாவேயின் வீடு’ என்றாலும், இங்கு ஆலய வளாகமே குறிக்கப்படுகிறது. நவீன வாசகருக்குத் தெளிவாக ‘ஆலயம்’ பயன்படுத்தப்பட்டு, יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், தமிழில் புரிந்துகொள்ளத்தக்க வகையில் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: בֵּית יְהוָה என்பதில் ‘வீடு’ அல்லது ‘ஆலயம்’
  choice: யாவேயின் ஆலயம்
  alternative: யாவேயின் வீடு
  rationale: இங்கு முற்றங்களைக் கொண்ட எருசலேம் ஆலய வளாகமே தெளிவாகக் குறிக்கப்படுகிறது. ‘ஆலயம்’ என்பது குறிப்பை வெளிப்படையாக்கினாலும், மூலத்தின் உறவுநிலையை ‘யாவேயின்’ என்ற அமைப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தில் வினைச்சொல் வெளிப்படையாக இல்லாததால், பணியமர்த்தும் சூழலுக்கேற்ப ‘இருக்க வேண்டும்’ இரு வாக்கியங்களிலும் சேர்க்கப்பட்டுள்ளது. நீண்ட பட்டியலைத் தெளிவாக்க இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
