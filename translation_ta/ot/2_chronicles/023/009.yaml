  text: וַ/יִּתֵּן֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן לְ/שָׂרֵ֣י הַ/מֵּא֗וֹת אֶת הַֽ/חֲנִיתִים֙ וְ/אֶת הַ/מָּגִנּוֹת֙ וְ/אֶת הַ/שְּׁלָטִ֔ים אֲשֶׁ֖ר לַ/מֶּ֣לֶךְ דָּוִ֑יד אֲשֶׁ֖ר בֵּ֥ית הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
translation:
  language: ta
  text: அப்போது ஆசாரியரான யோயாதா, நூறுபேர் கொண்ட படைப்பிரிவுகளின் தளபதிகளிடம்[a], கடவுளின் இல்லத்தில்[c] இருந்த தாவீது அரசனுக்குச் சொந்தமான ஈட்டிகளையும் கேடயங்களையும் பெரிய கேடயங்களையும்[b] கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “நூறுகளின் தலைவர்கள்”; நூறுபேர் கொண்ட படைப்பிரிவுகளுக்குப் பொறுப்பான இராணுவ அதிகாரிகளை இது குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் இங்கே “கேடயங்கள்” என்பதிலிருந்து வேறுபட்ட மற்றொரு பாதுகாப்புக் கருவிக்கான சொல் வருகிறது; அதன் துல்லியமான வகை உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, கடவுளின் ஆலயம். நேர்ச்சொல்லாக, “கடவுளின் இல்லம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் இயல்பான கதைநடைப் பொருளான பொருட்களை ஒப்படைத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: ஆசாரியரான யோயாதா
  rationale: பெயரைத் தமிழில் ஒலிபெயர்த்து, அவருடைய பணிப்பட்டத்தை இயல்பான தமிழ் இணைப்பில் வழங்குகிறது.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: நூறுபேர் கொண்ட படைப்பிரிவுகளின் தளபதிகளிடம்
  rationale: ‘நூறுகளின் தலைவர்கள்’ என்ற எபிரெய இராணுவ அமைப்பை ரோமப் படையின் பதவிப்பெயரைத் திணிக்காமல் தெளிவுபடுத்துகிறது.
- source_word: הַחֲנִיתִים
  choice: ஈட்டிகள்
  rationale: חנית என்ற பொதுவான நீண்ட குத்தாயுதத்திற்கான தெளிவான நவீனத் தமிழ் சொல்.
- source_word: הַמָּגִנּוֹת
  choice: கேடயங்கள்
  rationale: מגן குறிக்கும் பொதுவகைப் பாதுகாப்புக் கேடயத்தை இயல்பாக மொழிபெயர்க்கிறது.
- source_word: הַשְּׁלָטִים
  choice: பெரிய கேடயங்கள்
  rationale: முந்தைய מגנים என்பதிலிருந்து வேறுபட்ட மற்றொரு கேடய வகையை இது குறிப்பதாகத் தோன்றுவதால், அந்த வேறுபாட்டைக் காக்கிறது; சொல்லின் துல்லியமான வடிவம் உறுதியற்றது.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: தாவீது அரசனுக்குச் சொந்தமான
  rationale: எபிரெய உறவுத்தொடரில் வெளிப்படும் உடைமையை நேரடியாகக் காட்டுகிறது; தேவையற்ற இறந்தகால நிறைவுநிலையைச் சேர்ப்பதில்லை.
- source_word: בֵּית הָאֱלֹהִים
  choice: கடவுளின் இல்லம்
  rationale: ‘கடவுளின் வீடு/இல்லம்’ என்ற மூல மொழியின் உருவகத்தைக் காக்கிறது; சூழலில் இது ஆலயத்தைக் குறிக்கிறது.
