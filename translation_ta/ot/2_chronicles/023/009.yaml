translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ஆயுதப் பட்டியலும், இரண்டு வகைக் கேடயங்களுக்கு இடையிலான வேறுபாடும், ‘கடவுளின் இல்லம்’ என்ற சொற்றொடரும் பாதுகாக்கப்பட்டுள்ளன.
