source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֨ה הַ/שְּׁבִעִ֜ית הִתְחַזַּ֣ק יְהוֹיָדָ֗ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת לַ/עֲזַרְיָ֣הוּ בֶן יְרֹחָ֡ם וּ/לְ/יִשְׁמָעֵ֣אל בֶּן יְ֠הוֹחָנָן וְ/לַֽ/עֲזַרְיָ֨הוּ בֶן עוֹבֵ֜ד וְ/אֶת מַעֲשֵׂיָ֧הוּ בֶן עֲדָיָ֛הוּ וְ/אֶת אֱלִישָׁפָ֥ט בֶּן זִכְרִ֖י עִמּ֥/וֹ בַ/בְּרִֽית־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
translation:
  language: ta
  text: ஏழாம் ஆண்டில் யோயாதா தன்னைத் திடப்படுத்திக்கொண்டு, நூறுபேருக்குத் தலைவர்களான எரோகாமின் மகன் அசரியா, யோகனானின் மகன் இஸ்மவேல், ஓபேதின் மகன் அசரியா, அதாயாவின் மகன் மாசெயா, சிக்ரியின் மகன் எலிஷாபாத் ஆகியோரைத் தன்னுடன் உடன்படிக்கையில் இணைத்துக்கொண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடன் ஓர் உடன்படிக்கை செய்தார்.” எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல், இவர்களை “தன்னுடன் உடன்படிக்கையில் எடுத்துக்கொண்டார்” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִעִית
  choice: ஏழாம் ஆண்டில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான தமிழில் தருகிறது; தொடக்க இணைப்புச் சொல் தமிழில் அவசியமில்லை.
- source_word: הִתְחַזַּק
  choice: தன்னைத் திடப்படுத்திக்கொண்டு
  rationale: Hitpael வடிவிலுள்ள தற்சார்பு நுணுக்கத்தைப் பேணுகிறது; சூழலில் துணிவுடனும் உறுதியுடனும் செயல்படத் தயாரானதையும் உணர்த்துகிறது.
- source_word: וַיִּקַּח ... עִמּוֹ בַבְּרִית
  choice: அவர்களைத் தன்னுடன் உடன்படிக்கையில் இணைத்துக்கொண்டார்
  rationale: ‘எடுத்தார்’ என்ற சொல்லைத் தமிழில் அப்படியே கொடுத்தால் பொருள் இயல்பற்றதாகும். அதிகாரிகளைத் தன்னோடு ஓர் உடன்படிக்கை உறவுக்குள் கொண்டுவந்தார் என்ற மொத்த எபிரெயக் கட்டமைப்பைத் தெளிவாகக் கொடுக்கிறது.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: நூறுபேருக்குத் தலைவர்கள்
  rationale: நூறு பேர் கொண்ட படைப்பிரிவுகளுக்குப் பொறுப்பான அதிகாரிகளைக் குறிக்கும் இராணுவப் பட்டத்தை, ரோமப் படை சார்ந்த தேவையற்ற தொடர்புகளைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
- source_word: בֶן
  choice: மகன்
  rationale: தந்தைவழி அடையாளத்தைத் தரும் வழக்கமான தமிழாக்கம்.
- source_word: לַעֲזַרְיָהוּ ... וּלְיִשְׁמָעֵאל ... וְלַעֲזַרְיָהוּ ... וְאֶת מַעֲשֵׂיָהוּ ... וְאֶת אֱלִישָׁפָט
  choice: அசரியா ... இஸ்மவேல் ... அசரியா ... மாசெயா ... எலிஷாபாத்
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தில் இருமுறை வரும் அசரியா என்ற பெயரும் அப்படியே பேணப்பட்டுள்ளது.
theological_decisions:
- issue: உடன்படிக்கையின் தன்மை
  choice: தன்னுடன் உடன்படிக்கையில் இணைத்துக்கொண்டார்
  alternative: அவர்களுடன் ஓர் உடன்படிக்கை செய்தார்
  rationale: மூலத்தின் ‘எடுத்துக்கொள்’, ‘அவனுடன்’, ‘உடன்படிக்கையில்’ என்ற கூறுகளை ஒன்றிணைத்து, யோயாதா இவர்களை உடன்படிக்கை சார்ந்த கூட்டில் சேர்த்தார் என்ற பொருளைத் தருகிறது; உடன்படிக்கையின் குறிப்பிட்ட உள்ளடக்கத்தை ஊகித்துச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிவடிவங்களுக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன; இராணுவப் பட்டம் விளக்கமாக மொழியாக்கப்பட்டுள்ளது.
