  source_fidelity: மூல எபிரெயத்தின் காலக்குறிப்பு, யோயாதாவின் தற்சார்பான ‘தன்னை வலுப்படுத்துதல்’ செயல், நூறுபேரின் தலைவர்கள் என்ற இராணுவப் பதவி, ஐந்து பெயர்களும் தந்தைவழி அடையாளங்களும், அவர்களை உடன்படிக்கையில் சேர்த்துக்கொண்ட செயலும் முழுமையாகப் பிரதிபலிக்கின்றன. ‘இணைத்துக்கொண்டார்’ என்பது וַיִּקַּח ... עִמּוֹ בַבְּרִית என்ற சொற்றொடரின் சூழல்சார் பொருளைத் தகுந்தவாறு தருகிறது; உடன்படிக்கையின் உள்ளடக்கத்தைச் சேர்க்கவில்லை.
