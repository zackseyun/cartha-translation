    rationale: எபிரெயச் சொற்றொடர் கடினமானது என்றாலும், முக்கிய வாசிப்பில் அணிவரிசைகளின் இடைவெளி வழியாக வெளியேற்றும் பொருளை ‘அணிவரிசைகளின் நடுவழியாக ... வெளியே’ எனத் தெளிவாகச் சொல்லலாம்; மாற்று ‘வரிசைகளுக்கு வெளியே’ அடிக்குறிப்பில் இருக்க வேண்டும்.
  revised_text: அப்போது ஆசாரியனாகிய யோயாதா, படைக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த நூற்றுத் தலைவர்களை வெளியே வரவழைத்து, அவர்களிடம், “அணிவரிசைகளின் நடுவழியாக அவளை வெளியே கொண்டுபோங்கள்[a]. அவளைப் பின்தொடர்ந்து வருகிற யாரும் வாளால் கொல்லப்பட வேண்டும்” என்றான். ஏனெனில் ஆசாரியன், “யாவேயின் ஆலயத்தில் அவளைக் கொல்லாதீர்கள்” என்று சொல்லியிருந்தான்.
