  revision_rationale: திருத்தம் இறைபெயரை POB-யின் ‘Yahweh’ தீர்மானத்துக்கு ஏற்ப ‘யாவே’ என மாற்றுகிறது. கடினமான מִבֵּית הַשְּׂדֵרוֹת சொற்றொடரின் முதன்மை வாசிப்பை நவீன தமிழில் இயல்பாக அமைத்து, உரையில் உறுதியாகத் தீர்க்க முடியாத மாற்று இடவியல் வாய்ப்பை அடிக்குறிப்பில் காக்கிறது. மற்ற மாற்றங்கள் சொற்பொருளை மாற்றாமல் நடை மற்றும் இராணுவப் பதவியின் தெளிவை மேம்படுத்துகின்றன.
