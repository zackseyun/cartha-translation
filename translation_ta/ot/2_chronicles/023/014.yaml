  source_fidelity: மொத்தத்தில் எபிரெய மூலத்தின் கட்டளைத் தொடர், இராணுவ அதிகாரிகள், அத்தாலியாளை வெளியேற்றுதல், அவளைத் தொடர்ந்து வருபவருக்கான தண்டனை, ஆலயத்துக்குள் கொல்ல வேண்டாமென்ற தடை ஆகியவை துல்லியமாக உள்ளன. ஆனால் יְהוָה என்பதற்கான POB தீர்மானமும் ஆங்கில audit trail-உமும் “Yahweh” என்பதையே பின்பற்றுவதால், ‘யெகோவா’ என்பதற்குப் பதிலாக ‘யாவே’ பயன்படுத்தப்பட வேண்டும். கடினமான இடவியல் சொற்றொடருக்கு ‘அணிவரிசைகளின் நடுவழியாக’ என்பது ‘நடுவே வெளியே’ என்பதைவிட இயல்பாகவும் மூலத்தின் சாத்தியமான பொருளைத் தெளிவாகவும் தருகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
  naturalness: நடை பொதுவாக நவீன நிலையான தமிழுக்கு ஏற்றதாக உள்ளது. இருப்பினும் ‘அணிவரிசைகளுக்கு நடுவே வெளியே கொண்டுபோங்கள்’ என்ற அமைப்பு சற்றே இடறலாக உள்ளது. ‘அணிவரிசைகளின் நடுவழியாக அவளை வெளியே கொண்டுபோங்கள்’ என்பது இயல்பான கட்டளைநடையாகும். பொதுப்பொருள் ஒருமைக்கு ‘எவனும்’ என்பதற்குப் பதில் ‘யாரும்’ நவீன பொதுநடையில் மேலும் நடுநிலையானது.
  terminology: ‘ஆசாரியன்’, ‘படை’, ‘வாள்’, ‘ஆலயம்’ ஆகியவை பொருத்தமானவை. ‘நூற்றுப்படைத்தலைவர்கள்’ என்பது புரியத்தக்கது; ஆனால் ‘நூற்றுத் தலைவர்கள்’ என்பது எபிரெய இராணுவப் பதவியின் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது. இறைபெயராக ‘யாவே’ ஆங்கில POB-யின் தற்போதைய பெயர்த் தேர்வுடன் ஒத்திசைகிறது.
