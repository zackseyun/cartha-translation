base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
translation:
  language: ta
  text: அப்போது ஆசாரியனாகிய யோயாதா, படைக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த நூற்றுத் தலைவர்களை வெளியே வரவழைத்து, அவர்களிடம், “அணிவரிசைகளின் நடுவழியாக அவளை வெளியே கொண்டுபோங்கள்[a]. அவளைப் பின்தொடர்ந்து வருகிற யாரும் வாளால் கொல்லப்பட வேண்டும்” என்றான். ஏனெனில் ஆசாரியன், “யாவேயின் ஆலயத்தில் அவளைக் கொல்லாதீர்கள்” என்று சொல்லியிருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வரிசைகளுக்கு வெளியே.” இங்குள்ள எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது; அத்தாலியாளை ஒழுங்குபடுத்தப்பட்ட அணிவரிசைகளின் வழியாகவோ, அவற்றுக்கு இடையிலோ, அல்லது அவற்றுக்கு வெளியேயோ கொண்டுபோவதை இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: வெளியே அழைத்து
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல்/கொண்டுவருதல்’ என்பதைக் குறிக்கிறது; அதிகாரிகளை வரவழைத்து வெளியே கொண்டுவந்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: நூற்றுப்படைத்தலைவர்கள்
  rationale: நூறு வீரர்களைக் கொண்ட படைப்பிரிவின் தலைவர்கள் என்ற முறையான இராணுவப் பதவியைத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: פְּקוּדֵי הַחַיִל
  choice: படைக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த
  rationale: פקד என்பதன் பங்கேற்பு வடிவம் படை தொடர்பாக நியமிக்கப்பட்ட அல்லது பொறுப்பளிக்கப்பட்ட அதிகாரிகளைச் சுட்டுகிறது.
- source_word: הוֹצִיאוּהָ
  choice: அவளை ... வெளியே கொண்டுபோங்கள்
  rationale: மூன்றாம் நபர் பெண்பால் பின்னொட்டுடன் வரும் பன்மை ஏவல்; அத்தாலியாளை அந்த இடத்திலிருந்து வெளியே அழைத்துச் செல்லும் கட்டளையைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  choice: அணிவரிசைகளுக்கு நடுவே
  rationale: எபிரெயச் சொற்றொடர் கடினமானது. சூழலில் השדרות என்பது ஒழுங்குபடுத்தப்பட்ட படை வரிசைகளைக் குறிக்கலாம்; இந்த வாசிப்பு பொருளுள்ள தமிழைத் தருகிறது, ஆனால் மாற்று வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: அவளைப் பின்தொடர்ந்து வருகிற எவனும்
  rationale: הבא என்ற பங்கேற்பும் אחריה என்பதும் அவளுக்குப் பின்னால் வருகிற ஒருவனை, சூழலில் அவளது ஆதரவாளரை, குறிக்கின்றன; ஆதரவாளர் என்ற விளக்கத்தை நேரடியாக உரையில் சேர்க்காமல் மூலத்தின் பரப்பை காக்கிறது.
- source_word: יוּמַת בֶּחָרֶב
  choice: வாளால் கொல்லப்பட வேண்டும்
  rationale: செயப்பாட்டு வடிவத்தின் கட்டளை அல்லது தீர்ப்புத் தன்மையைக் கண்ணியமான நவீன தமிழில் தருகிறது.
- source_word: כִּי אָמַר הַכֹּהֵן
  choice: ஏனெனில் ... ஆசாரியன் சொல்லியிருந்தான்
  rationale: כי முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; முன்னரே கொடுக்கப்பட்ட அறிவுறுத்தல் என்பதால் தமிழில் இறந்தகால நிறைவு இயல்பாக அமைகிறது.
- source_word: לֹא תְמִיתוּהָ
  choice: அவளைக் கொல்லாதீர்கள்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘கொல்லுதல்/மரணத்துக்கு உட்படுத்துதல்’; நேரடியான தடைச்சொல்லாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: ‘யெகோவாவின் வீடு’ என்ற சொற்படி வடிவம் தமிழில் கட்டிடத்தின் பொதுப்பெயராகத் தவறாகப் புரியலாம்; இங்கு தேவாலயத்தைக் குறிக்கும் ‘ஆலயம்’ தெளிவானது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைபெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவத்தில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல எபிரெய உரை நான்கெழுத்து இறைபெயரை நேரடியாகக் கொண்டுள்ளது. அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்க ‘யெகோவா’ பயன்படுத்தப்பட்டது; ‘கர்த்தர்’ என்பது பட்டப்பெயராக மாற்றிவிடும், ‘யாவே’ என்பது மாற்று ஒலிபெயர்ப்பு.
- issue: அத்தாலியாளைப் பின்தொடர்பவரைக் கொல்லும் கட்டளையின் பரப்பு
  choice: அவளைப் பின்தொடர்ந்து வருகிற எவனும்
  alternative: அவளுக்கு ஆதரவளிக்கிற எவனும்
  rationale: எபிரெயம் பின்தொடர்ந்து வருதலை நேரடியாகச் சொல்கிறது; ஆதரவாளர்கள் குறிக்கப்படலாம் என்றாலும் அந்த விளக்கத்தை உரைக்குள் உறுதிப்படுத்தாமல் மூலத்தின் இயல்பான பதற்றமும் பரப்பும் காக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. இராணுவப் பதவிக்கு ‘நூற்றுப்படைத்தலைவர்கள்’ என்றும், בית יהוה என்பதற்கு இயல்பான சூழற்பொருளாக ‘யெகோவாவின் ஆலயம்’ என்றும் பயன்படுத்தப்பட்டது. கடினமான இடவியல் சொற்றொடரின் ஐயம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
