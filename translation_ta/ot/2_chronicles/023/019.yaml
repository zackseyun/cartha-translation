reference: 2 Chronicles 23:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יַּעֲמֵד֙ הַ/שּׁ֣וֹעֲרִ֔ים עַֽל שַׁעֲרֵ֖י בֵּ֣ית יְהוָ֑ה וְ/לֹֽא יָבֹ֥א טָמֵ֖א לְ/כָל דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/019.yaml
  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
translation:
  language: ta
  text: அவர் யாவேயின் ஆலய வாசல்களில் வாயிற்காவலர்களை நிறுத்தினார்; எந்த வகையிலும் தீட்டுப்பட்ட எவரும் உள்ளே நுழையாதபடி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: நிறுத்தினார்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரை அவருடைய பணியிடத்தில் நிற்கச் செய்வதைக் குறிக்கிறது; வாயிற்காவலர்களைப் பணியில் அமர்த்திய செயலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַשּׁוֹעֲרִים
  choice: வாயிற்காவலர்களை
  rationale: ஆலயத்தின் நுழைவாயில்களைக் காக்க நியமிக்கப்பட்டவர்களைத் துல்லியமாகக் குறிக்கிறது.
- source_word: עַל שַׁעֲרֵי
  choice: வாசல்களில்
  rationale: இந்த இடச்சூழலில் עַל என்பது வாசல்களருகே அல்லது வாசல்களில் பணிநிலையில் நிறுத்தப்பட்டிருப்பதைக் குறிக்கிறது; தமிழில் ‘வாசல்களில்’ இயல்பாக உள்ளது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בַּיִת என்பதன் சொற்பொருள் ‘வீடு’ என்றாலும், இங்கு அது வழிபாட்டுக்குரிய ஆலயத்தைக் குறிக்கிறது; ‘ஆலயம்’ நவீன தமிழில் தெளிவானதும் கண்ணியமானதும் ஆகும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரை பொதுப்பட்டப் பெயராக மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: וְלֹא יָבֹא
  choice: உள்ளே நுழையாதபடி
  rationale: இணைப்புச்சொல்லுடன் கூடிய மறுப்பு முற்றுப்பெறாத வினை, காவலர்களை நிறுத்திய நோக்கம் அல்லது எதிர்பார்க்கப்பட்ட விளைவை இங்கு வெளிப்படுத்துகிறது.
- source_word: טָמֵא
  choice: தீட்டுப்பட்ட
  rationale: ஆலய நுழைவுச் சூழலில் இது சடங்குசார் அசுத்த நிலையைக் குறிக்கிறது; ‘தீட்டுப்பட்ட’ என்பது அந்த வகைப்பாட்டை சாதாரண ஒழுக்கக்கேடாக மாற்றாமல் தெரிவிக்கிறது.
- source_word: לְכָל דָּבָר
  choice: எந்த வகையிலும்
  rationale: சொல்லுக்கு சொல் ‘எந்தக் காரியத்திற்காகவும்’ என இருந்தாலும், சூழலில் எந்தக் காரணத்தினாலோ வகையினாலோ தீட்டுப்பட்ட நிலை என்ற விரிவான பொருளை இது தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைத் திருப்பெயர் நேரடியாக உள்ளது. அதைப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று வழங்குவது மூலத்தின் பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: טָמֵא என்பதன் தன்மை
  choice: சடங்குசார் தீட்டு உணர்வுடைய ‘தீட்டுப்பட்ட’
  alternative: அசுத்தமான
  rationale: ஆலயத்துக்குள் அனுமதிக்கப்படாமை குறித்த சூழல் சடங்குசார் தூய்மை நிலையை முன்னிறுத்துகிறது; பொதுவான உடல் அழுக்கையோ கட்டாயமாக ஒழுக்கப் பாவத்தையோ மட்டும் குறிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வாயிற்காவலர்கள்’ பணியின் தன்மையைத் துல்லியமாகவும், ‘தீட்டுப்பட்ட’ என்பது சடங்குசார் பொருளையும் காக்கின்றன. நோக்கத்தைக் காட்டும் எபிரெய இணைப்பு தமிழில் ‘நுழையாதபடி’ என இயல்பாக்கப்பட்டது.
