base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
translation:
  language: ta
  text: பின்பு அவர் நூற்றுக்குத் தலைவர்களையும், பெருமக்களையும்[a], மக்கள்மேல் அதிகாரம் செலுத்தியவர்களையும், நாட்டின் மக்கள் அனைவரையும்[b] தம்முடன் அழைத்துக்கொண்டு, அரசனை யாவேயின் ஆலயத்திலிருந்து கீழே அழைத்து வந்தார். அவர்கள் அரச மாளிகையின் மேல் வாசல் வழியாகச் சென்று, அரசனை அரசாட்சியின் அரியணையில் அமர்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வல்லமைமிக்கவர்கள்.” எபிரெயச் சொல் உயர்நிலையோ செல்வாக்கோ வல்லமையோ பெற்றவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நாட்டின் மக்கள்” என்பது அரசாட்சிக் கதைகளில் மக்களை ஒரு சமூக-அரசியல் அமைப்பாகக் குறிக்கப் பயன்படும் வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: தம்முடன் அழைத்துக்கொண்டு
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்.’ இச்சூழலில் யோயாதா குறிப்பிடப்பட்ட குழுக்களைத் தம்முடன் கூட்டிச் சென்றதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் இவ்வாறு வழங்கப்பட்டது.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: நூற்றுக்குத் தலைவர்கள்
  rationale: நூறு வீரர்களைக் கொண்ட படைப்பிரிவுகளின் தலைவர்களைக் குறிக்கும் எபிரெய இராணுவப் பட்டத்தின் அமைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הָאַדִּירִים
  choice: பெருமக்கள்
  rationale: சமூகத்தில் செல்வாக்கும் உயர்நிலையும் வல்லமையும் பெற்றவர்களைக் குறிக்கும் சொல். ‘பெருமக்கள்’ என்பது உடல் வலிமையை மட்டும் உணர்த்தாமல் அரசியல்-சமூக முக்கியத்துவத்தை வெளிப்படுத்துகிறது.
- source_word: הַמֹּשְׁלִים בָּעָם
  choice: மக்கள்மேல் அதிகாரம் செலுத்தியவர்கள்
  rationale: மக்களிடையே ஆளும் அதிகாரத்தை வகித்தவர்களை எபிரெயச் சொற்றொடருக்கு நெருக்கமாகவும் இயல்பான தமிழிலும் குறிக்கிறது.
- source_word: כָּל עַם הָאָרֶץ
  choice: நாட்டின் மக்கள் அனைவரும்
  rationale: அரசாட்சிக் கதைகளில் சமூக-அரசியல் அமைப்பாகக் கருதப்படும் நாட்டின் மக்களைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளைப் பாதுகாக்கிறது.
- source_word: וַיּוֹרֶד אֶת הַמֶּלֶךְ
  choice: அரசனை ... கீழே அழைத்து வந்தார்
  rationale: ירד என்பதன் காரணவினை வடிவம் ‘கீழே வரச் செய்தல்/கீழே கொண்டுவருதல்’ என்பதைக் குறிக்கிறது; ஆலயத்திலிருந்து அரண்மனை நோக்கிய கீழிறங்கும் இயக்கம் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- source_word: מִבֵּית יְהוָה
  choice: யாவேயின் ஆலயத்திலிருந்து
  rationale: בית என்பது இங்கு வழிபாட்டு ஆலயத்தைக் குறிப்பதால் நவீனத் தமிழில் தெளிவாக ‘ஆலயம்’ என வழங்கப்பட்டது; יְהוָה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  choice: மேல் வாசல் வழியாக
  rationale: இயக்கத்தைச் சுட்டும் இச்சூழலில் ‘வாசலின் நடுவாக/வழியாக’ என்ற இடப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரச மாளிகை
  rationale: சொல்லுக்கு சொல் ‘அரசனின் வீடு’ என்றாலும், இங்கு அரசனின் அதிகாரபூர்வ இருப்பிடமான அரண்மனையைக் குறிக்கிறது; ‘அரச மாளிகை’ நவீன வாசகருக்குத் தெளிவானது.
- source_word: וַיּוֹשִׁיבוּ
  choice: அமர்த்தினார்கள்
  rationale: ‘உட்காரச் செய்தார்கள்’ என்ற காரணவினைப் பொருளையும் அரியணையேற்றும் நிகழ்வையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּסֵּא הַמַּמְלָכָה
  choice: அரசாட்சியின் அரியணை
  rationale: ממלכה என்பதிலுள்ள ‘அரசாட்சி/ஆட்சியுரிமை’ என்ற பெயர்ச்சொல் பொருளைப் பாதுகாக்கிறது; ‘அரியணை’ அரசருக்குரிய ஆசனத்தைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டம் அல்லாமல் நான்கு எழுத்துகளைக் கொண்ட இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. அதைப் பட்டமாக மாற்றாமல், நவீனத் தமிழில் அதன் பரவலான ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என வழங்குவது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. ‘நூற்றுக்குத் தலைவர்கள்,’ ‘அரசாட்சியின் அரியணை’ போன்ற சொற்றொடர்கள் மூலத்தின் அமைப்பைத் தெளிவாகப் பாதுகாக்கின்றன; மரபுத்தொடர்கள் தேவைப்படும் இடங்களில் இயல்பான தமிழாக்கமும் அடிக்குறிப்புகளும் பயன்படுத்தப்பட்டுள்ளன.
