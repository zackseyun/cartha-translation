  text: וַ/יַּעֲמֵ֨ד אֶת כָּל הָ/עָ֜ם וְ/אִ֣ישׁ שִׁלְח֣/וֹ בְ/יָד֗/וֹ מִ/כֶּ֨תֶף הַ/בַּ֤יִת הַ/יְמָנִית֙ עַד כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/שְּׂמָאלִ֔ית לַ/מִּזְבֵּ֖חַ וְ/לַ/בָּ֑יִת עַל הַ/מֶּ֖לֶךְ סָבִֽיב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: ta
  text: அவன் மக்கள் அனைவரையும், ஒவ்வொருவரும் தங்கள் ஆயுதத்தைக் கையில் ஏந்தியபடி, ஆலயத்தின் தெற்குப் பக்கத்திலிருந்து ஆலயத்தின் வடக்குப் பக்கம்வரை, பலிபீடத்தருகிலும் ஆலயத்தருகிலும், அரசனைச் சுற்றி நிறுத்தினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: நிறுத்தினான்
  rationale: ஹிஃபில் வடிவத்தின் ‘நிற்கச் செய்தான்/நியமித்த இடத்தில் நிறுத்தினான்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שִׁלְחוֹ
  choice: தங்கள் ஆயுதத்தை
  rationale: இங்கு சொல்லின் பொருள் கையில் வைத்திருக்கும் ஆயுதம். எபிரெயத்தில் ஒருமை உடைமைப்பெயர் இருந்தாலும், ‘ஒவ்வொருவரும்’ என்பதோடு பொருந்த தமிழில் பகிர்வுப் பன்மை இயல்பானது.
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית ... עַד כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  choice: ஆலயத்தின் தெற்குப் பக்கத்திலிருந்து ஆலயத்தின் வடக்குப் பக்கம்வரை
  rationale: எபிரெயத்தில் சொற்பட ‘வலப்பக்கம் ... இடப்பக்கம்’; கிழக்கு நோக்கிய திசை அமைப்பில் இவை தெற்கு, வடக்கு என்பவற்றைக் குறிக்கின்றன. சூழல் தெளிவிற்காக திசைப் பெயர்கள் பயன்படுத்தப்பட்டன.
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: இச்சூழலில் ‘வீடு’ என்பது யெகோவாவின் ஆலயத்தைக் குறிக்கும்; நவீன தமிழில் ‘ஆலயம்’ தெளிவானதும் இயல்பானதும்.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: அரசனைச் சுற்றி
  rationale: பாதுகாப்பு அணிவகுப்பு அரசனைச் சூழ்ந்திருந்ததைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் இடவமைப்பும் ஆயுதமேந்திய பாதுகாப்புச் சூழலும் பாதுகாக்கப்பட்டுள்ளன.
