  yaml_path: translation/ot/2_chronicles/023/021.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
translation:
  language: ta
  text: நாட்டின் மக்கள் அனைவரும் மகிழ்ந்தார்கள்; நகரமும் அமைதியாக இருந்தது. அத்தாலியாளை அவர்கள் வாளால் கொன்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: மகிழ்ந்தார்கள்
  rationale: שׂמח என்பதன் பொதுவான பொருள் மகிழ்தல்; பொதுமக்களின் வெளிப்படையான மகிழ்ச்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: כָל עַם הָאָרֶץ
  choice: நாட்டின் மக்கள் அனைவரும்
  rationale: எபிரெயச் சொற்றொடரின் முழுமையையும் காத்து, அந்நாட்டின் பொதுமக்களைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: וְהָעִיר שָׁקָטָה
  choice: நகரமும் அமைதியாக இருந்தது
  rationale: שׁקט குறிக்கும் அமைதி அல்லது கலக்கமின்மையை நேரடியாகத் தருகிறது; சூழலில் நகரம் எருசலேம் என்றாலும், மூலத்தில் உள்ளபடி பெயரைக் குறிப்பிடாமல் ‘நகரம்’ என வைக்கப்படுகிறது.
- source_word: וְאֶת עֲתַלְיָהוּ הֵמִיתוּ
  choice: அத்தாலியாளை அவர்கள் கொன்றார்கள்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘சாகச் செய்தார்கள்’, அதாவது ‘கொன்றார்கள்’ என்று பொருள்படும். வெளிப்படையாக உள்ள பன்மை வினைச்செய்பவரைத் தமிழில் ‘அவர்கள்’ எனத் தெளிவாக்குகிறது; waw-ஐ காரணவிளக்கமாக மாற்றாமல் தனி ஒருங்கிணைந்த வாக்கியமாகப் பாதுகாக்கிறது.
- source_word: בֶחָרֶב
  choice: வாளால்
  rationale: בְּ இங்கு கருவியைக் குறிக்கிறது; ‘வாளால்’ என்பது சுருக்கமானதும் நேரடியானதும் ஆகும்.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் மூன்று இணைநிலை வாக்கியங்களும் காரணத் தொடர்பு சேர்க்காமல் காக்கப்பட்டுள்ளன; தமிழில் இயல்பாக வாசிக்க நிறுத்தற்குறிகள் பயன்படுத்தப்பட்டுள்ளன.
