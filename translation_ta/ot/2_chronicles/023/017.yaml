source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ כָל הָ/עָ֤ם בֵּית הַ/בַּ֨עַל֙ וַֽ/יִּתְּצֻ֔/הוּ וְ/אֶת מִזְבְּחֹתָ֥י/ו וְ/אֶת צְלָמָ֖י/ו שִׁבֵּ֑רוּ וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֥י הַֽ/מִּזְבְּחֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: ta
  text: பின்பு மக்கள் அனைவரும் பாகாலின் கோவிலுக்குச் சென்று அதை இடித்துத் தள்ளினார்கள். அவனுடைய பலிபீடங்களையும் சிலைகளையும் நொறுக்கினார்கள்; பாகாலின் அர்ச்சகரான மத்தானைப் பலிபீடங்களின் முன் கொன்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַבַּעַל
  choice: பாகாலின் கோவில்
  rationale: இங்கு בֵּית என்பது பாகாலுக்கான வழிபாட்டுக் கட்டிடத்தைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் ‘கோவில்’ என வழங்கப்பட்டது.
- source_word: וַיִּתְּצֻהוּ
  choice: அதை இடித்துத் தள்ளினார்கள்
  rationale: கட்டிடத்தை முற்றிலும் தகர்த்த செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צְלָמָיו
  choice: சிலைகள்
  rationale: வழிபாட்டுக்குரிய உருவங்களைக் குறிக்கும் சொல்லுக்கு சூழலுக்கேற்ற பொதுவான தமிழ் இணை.
- source_word: שִׁבֵּרוּ
  choice: நொறுக்கினார்கள்
  rationale: பலிபீடங்களையும் சிலைகளையும் உடைத்துச் சிதைத்த வலுவான செயலைப் பிரதிபலிக்கிறது.
- source_word: כֹּהֵן הַבַּעַל
  choice: பாகாலின் அர்ச்சகர்
  rationale: ஒரு தெய்வத்தின் கோவில் வழிபாட்டுப் பணியாளரை நவீனத் தமிழில் இயல்பாகக் குறிக்கும் சொல்.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: பலிபீடங்களின் முன்
  rationale: எபிரெயச் சொற்றொடரின் இடவியல் பொருளையும் பன்மையையும் நேரடியாகப் பேணுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டது. பாகால் ஆண்பால் தெய்வமாகக் குறிப்பிடப்படுவதால் ‘அவனுடைய’ என மூலத்தின் சுட்டுப்பெயர் வேறுபாடு பேணப்பட்டது.
