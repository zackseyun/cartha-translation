base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
translation:
  language: ta
  text: 'பின்பு அவர்கள் அரசனின் மகனை வெளியே கொண்டுவந்து, அவன்மேல் கிரீடத்தையும் சாட்சியத்தையும்[a] வைத்து, அவனை அரசனாக்கினார்கள்; யோயாதாவும் அவரது மகன்களும் அவனை அபிஷேகம் செய்து, “அரசர் நீடூழி வாழ்க!” என்று கூறினார்கள்.


    [a] “சட்டம்” அல்லது “உடன்படிக்கை ஆவணம்” என்றும் பொருள்படலாம். அரசரின் ஆட்சியோடு தொடர்புடைய எழுத்துப்பூர்வமான உடன்படிக்கைச் சாட்சியை எபிரெயச் சொல் இங்கே குறிக்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சட்டம்” அல்லது “உடன்படிக்கை ஆவணம்” என்றும் பொருள்படலாம். அரசரின் ஆட்சியோடு தொடர்புடைய எழுத்துப்பூர்வமான உடன்படிக்கைச் சாட்சியை எபிரெயச் சொல் இங்கே குறிக்கலாம்.
    reason: הָעֵדוּת என்பதன் அடிப்படைச் சொற்பொருளான ‘சாட்சி’யை முதன்மை உரையில் காத்து, முடிசூட்டு சூழலில் சாத்தியமான சட்ட அல்லது உடன்படிக்கை ஆவணப் பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: வெளியே அழைத்துவந்து
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல்/வெளியே கொண்டுவருதல்’ எனப் பொருள்படும். முடிசூட்டு நிகழ்வுக்காக அரசகுமாரனை மக்கள் முன் கொண்டுவருவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בֶּן הַמֶּלֶךְ
  choice: அரசனின் மகன்
  rationale: அரச வம்ச அடையாளத்தை நேரடியாகவும் தெளிவாகவும் காக்கிறது.
- source_word: הַנֵּזֶר
  choice: கிரீடம்
  rationale: נזר என்பது அர்ப்பணிப்பின் அடையாளத்தையோ அரச மணிமுடியையோ குறிக்கலாம்; இங்கு முடிசூட்டு சூழலில் ‘கிரீடம்’ தெளிவான, பொதுவாகப் புரியும் சொல்.
- source_word: הָעֵדוּת
  choice: சாட்சி
  rationale: ‘சாட்சி/சான்று’ என்ற அடிப்படைப் பொருளையும் உடன்படிக்கை சார்ந்த ஒலிநயத்தையும் காக்கிறது; அது சட்டமா அல்லது உடன்படிக்கை ஆவணமா என்பதை முதன்மை உரை கட்டாயமாகத் தீர்மானிக்கவில்லை.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: அவனை அரசனாக்கினார்கள்
  rationale: מלך என்பதன் ஹிஃபில் வடிவத்திலுள்ள ‘ஆட்சி செய்ய வைத்தல்/அரசனாக்குதல்’ என்ற பொருளைத் துல்லியமாகத் தருகிறது; கிரீடம் வைக்கும் தனிச் செயலுடன் இதைக் கலக்கவில்லை.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: அவனை அபிஷேகம் செய்து
  rationale: அரச நிறுவல் சூழலில் משׁח குறிக்கும் சடங்கு மற்றும் இறையியல் முக்கியத்துவத்தை வழக்கமான தமிழ் வேதாகமச் சொல்லால் காக்கிறது.
- source_word: יְהוֹיָדָע וּבָנָיו
  choice: யோயாதாவும் அவனுடைய மகன்களும்
  rationale: எபிரெயச் சேர்க்கையை நேரடியாகத் தருவதுடன், பின்னர் வரும் அபிஷேகமும் முழக்கமும் இவர்களுடைய செயல்கள் என்பதைத் தெளிவாக்குகிறது.
- source_word: יְחִי הַמֶּלֶךְ
  choice: அரசர் நீடூழி வாழ்க!
  rationale: விருப்பவினை வடிவிலுள்ள அரச வாழ்த்தொலியின் வலிமையை இயல்பான, கண்ணியமான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: முடிசூட்டு நிகழ்வில் הָעֵדוּת என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘சாட்சி’
  alternative: ‘சட்டம்’ அல்லது ‘உடன்படிக்கை ஆவணம்’
  rationale: எபிரெயச் சொல் வெறும் சட்டத் தொகுப்பைவிடப் பரந்தது; உடன்படிக்கை சார்ந்த சாட்சி என்ற கருத்தையும் கொண்டுள்ளது. ‘சாட்சி’ என்பது அந்தச் சொல்லின் பரப்பை நிலைநிறுத்துகிறது; அடிக்குறிப்பு சாத்தியமான ஆவணப் பொருளை விளக்குகிறது.
- issue: அபிஷேகம் செய்தவர்களின் அடையாளம்
  choice: யோயாதாவும் அவனுடைய மகன்களும் அபிஷேகம் செய்ததாகத் தெளிவாக அமைத்தல்
  alternative: முன்னர் குறிப்பிடப்பட்ட பெயரற்ற குழுவே அபிஷேகம் செய்ததாக அமைத்தல்
  rationale: எபிரெய உரையின் இடைநிறுத்தமும், வினைக்குப் பின் வரும் வெளிப்படையான பன்மை எழுவாயும், ‘யோயாதாவும் அவன் மகன்களும்’ என்பது அபிஷேக வினைக்கும் தொடர்ந்து வரும் கூற்றுக்கும் எழுவாய் என்பதை ஆதரிக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘அபிஷேகம்’ அரச நிறுவல் சூழலில் நிலைபெற்ற சொல் என்பதால் வைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத் தொடரை அப்படியே நீண்ட வாக்கியமாக்காமல் இரண்டு வாக்கியங்களாகப் பிரித்து, யார் அபிஷேகம் செய்தார்கள் என்பதைக் குழப்பமின்றிக் காட்டுகிறது.
