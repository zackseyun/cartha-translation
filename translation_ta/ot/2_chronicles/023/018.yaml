source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
translation:
  language: ta
  text: யோய்தா, யாவேயின் ஆலயத்தின் மேற்பார்வைப் பொறுப்புகளை, அந்த ஆலயத்தின்மீது தாவீது நியமித்திருந்த ஆசாரியர்கள், லேவியர்கள்[b] கையில்[a] ஒப்படைத்தார். அவர்கள் மோசேயின் சட்டத்தில் எழுதப்பட்டபடி, மகிழ்ச்சியோடும் பாடலோடும், தாவீது வகுத்த ஏற்பாட்டின்படி[c], யாவேக்குத் தகனபலிகளைச் செலுத்தும்படியாக அவர் இவ்வாறு செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “கையில்.” இச்சொல்லாட்சி ஒருவரிடம் பொறுப்பை ஒப்படைப்பதை அல்லது அவரது அதிகாரத்தின் கீழ் வைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “லேவிய ஆசாரியர்கள்” என்றும், “ஆசாரியர்களும் லேவியர்களும்” என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொற்றொடர் ஒன்றுக்கு மேற்பட்ட புரிதலுக்கு இடமளிக்கிறது.
    reason: alternative_reading
  - marker: c
    text: சொல்லுக்குச் சொல், “தாவீதின் கையால்”; அதாவது, தாவீது வகுத்த ஏற்பாடு அல்லது அறிவுறுத்தலின்படி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... פְּקֻדֹּת
  choice: மேற்பார்வைப் பொறுப்புகளை ... ஒப்படைத்தார்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’; ஆலய நிர்வாகச் சூழலில் פְּקֻדֹּת உடன் சேர்ந்து பொறுப்பை ஏற்படுத்தி ஒப்படைப்பதைக் குறிக்கிறது. ‘மேற்பார்வைப் பொறுப்புகள்’ என்பது நிர்வாகச் செயலையும் பன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: ‘வீடு’ என்பது சொற்பொருளாயினும் இங்கு வழிபாட்டு ஆலயம் குறிக்கப்படுகிறது; நவீனத் தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּיַד
  choice: கையில்
  rationale: எபிரெயச் சொல்லாட்சியின் ‘கையில்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; இச்சூழலில் பொறுப்பை ஒருவரின் அதிகாரத்திற்குள் ஒப்படைப்பது அதன் பொருள்.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: ஆசாரியர்கள், லேவியர்கள்
  rationale: இரு பெயர்களுக்கிடையேயான தொடர்பை விளக்கிச் சேர்க்காமல் எபிரெயின் நெருக்கமான அமைப்பைத் தக்கவைக்கிறது; இதனால் ‘லேவிய ஆசாரியர்கள்’ அல்லது ‘ஆசாரியர்களும் லேவியர்களும்’ என்ற இரு புரிதல்களும் திறந்தவையாக இருக்கின்றன.
- source_word: אֲשֶׁר חָלַק דָּוִיד
  choice: தாவீது பிரிவுகளாக நியமித்திருந்த
  rationale: חלק என்பதன் ‘பிரித்தல்/பங்கிடுதல்’ என்ற அடிப்படை உணர்வையும், தாவீது ஆலயப் பணியாளர்களை ஒழுங்குபடுத்திய நிர்வாகப் பொருளையும் இணைக்கிறது.
- source_word: עֹלוֹת
  choice: தகனபலிகள்
  rationale: முழுவதும் பலிபீடத்தில் எரிக்கப்படும் பலிவகைக்கான தமிழில் நிலைபெற்ற, சுருக்கமான சமயச் சொல்.
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: மோசேயின் சட்டத்தில் எழுதியிருக்கிறபடி
  rationale: எழுத்துப்பூர்வமான மோசேயின் தோரா அறிவுறுத்தலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּשִׂמְחָה וּבְשִׁיר
  choice: மகிழ்ச்சியோடும் பாடலோடும்
  rationale: வழிபாட்டின் மகிழ்ச்சியான மற்றும் இசைசார்ந்த முறையை, மூலத்தின் இணையான பெயர்ச்சொல் அமைப்புக்கு நெருக்கமாகக் காட்டுகிறது.
- source_word: עַל יְדֵי דָוִיד
  choice: தாவீதின் வழிகாட்டுதலின்படி
  rationale: சொல்லுக்குச் சொல் ‘தாவீதின் கையால்’ என்றாலும், இங்கு தாவீது ஏற்படுத்திய வழிமுறை அல்லது ஏற்பாட்டைக் குறிக்கும் நிர்வாகப் பொருள் இயல்பான தமிழில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்திலுள்ள தேவனுடைய தனிப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூல உரை நான்கு எழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயருக்குப் பதிலாக அதன் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பு தரப்படுகிறது.
- issue: הַכֹּהֲנִים הַלְוִיִּם என்பதில் ஆசாரியர்களுக்கும் லேவியர்களுக்கும் உள்ள தொடர்பு
  choice: ஆசாரியர்கள், லேவியர்கள் என்று தெளிவுபடுத்தாமல் தக்கவைத்தல்
  alternative: லேவிய ஆசாரியர்கள்; அல்லது ஆசாரியர்களும் லேவியர்களும்
  rationale: எபிரெயத் தொடரை ஒரே குழுவைக் குறிக்கும் இணைப்பெயராகவும், இரண்டு தொடர்புடைய குழுக்களைக் குறிக்கும் தொடராகவும் புரிந்துகொள்ள முடியும். உரை அவற்றில் ஒன்றை மட்டும் தீர்மானிக்கவில்லை.
- issue: עַל יְדֵי דָוִיד என்பதன் செயற்பாட்டுப் பொருள்
  choice: தாவீதின் வழிகாட்டுதலின்படி
  alternative: தாவீதின் கையால்
  rationale: தாவீது அக்காலத்தில் நேரடியாகச் செயற்பட்டார் என்று பொருள்படாமல், அவர் முன்பு வகுத்த ஆலய இசை மற்றும் பலி ஒழுங்கை இச்சொற்றொடர் சுட்டுகிறது; அதே நேரத்தில் சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனப் பொதுத் தமிழில், வழிபாட்டு உரைக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’, ‘தகனபலிகள்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் வாசகர் அறிதலுக்காகத் தக்கவைக்கப்பட்டுள்ளன. எபிரெயின் நீண்ட வாக்கியம் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், காரணமும் நோக்கமும் இடையிலான தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
