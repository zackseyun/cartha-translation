revisions:
- from: யோய்தா, யாவேயின் ஆலய மேற்பார்வைப் பொறுப்புகளை, அந்த ஆலயப் பணிக்காகத் தாவீது பிரிவுகளாக நியமித்திருந்த ஆசாரியர்கள், லேவியர்கள்[b] கையில்[a] ஒப்படைத்தார். மோசேயின் சட்டத்தில் எழுதியிருக்கிறபடி யாவேக்குத் தகனபலிகளை மகிழ்ச்சியோடும் பாடலோடும் செலுத்துவதற்காக, தாவீதின் வழிகாட்டுதலின்படி[c] இவ்வாறு செய்தார்.
  to: யோய்தா, யாவேயின் ஆலயத்தின் மேற்பார்வைப் பொறுப்புகளை, அந்த ஆலயத்தின்மீது தாவீது நியமித்திருந்த ஆசாரியர்கள், லேவியர்கள்[b] கையில்[a] ஒப்படைத்தார். அவர்கள் மோசேயின் சட்டத்தில் எழுதப்பட்டபடி, மகிழ்ச்சியோடும் பாடலோடும், தாவீது வகுத்த ஏற்பாட்டின்படி[c], யாவேக்குத் தகனபலிகளைச் செலுத்தும்படியாக அவர் இவ்வாறு செய்தார்.
  rationale: The revision restores the Hebrew purpose relation by explicitly making the offering of burnt offerings the purpose of Jehoiada's entrusting the responsibilities. It also renders David's prior administrative assignment as being ‘over’ the house of Yahweh, while preserving the source's ambiguity concerning ‘the priests, the Levites.’ Footnote markers and their referents remain structurally valid.
