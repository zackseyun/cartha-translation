  text: וַ/תִּשְׁמַ֣ע עֲתַלְיָ֗הוּ אֶת ק֤וֹל הָ/עָם֙ הָֽ/רָצִ֔ים וְ/הַֽ/מְהַֽלְלִ֖ים אֶת הַ/מֶּ֑לֶךְ וַ/תָּב֥וֹא אֶל הָ/עָ֖ם בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/012.yaml
  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: ta
  text: ஓடிக்கொண்டும் அரசனைப் புகழ்ந்துகொண்டும் இருந்த மக்களின் சத்தத்தை அத்தாலியா கேட்டபோது, அவள் யெகோவாவின் ஆலயத்தில் இருந்த மக்களிடம் வந்தாள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קול
  choice: ஆரவாரம்
  rationale: இங்கு קוֹל என்பது வெறும் ‘குரல்’ அல்ல; ஓடிவந்து அரசனைப் புகழும் கூட்டத்தினரால் எழுந்த கேட்கத்தக்க சத்தத்தைக் குறிக்கிறது. இயல்பான தமிழில் ‘ஆரவாரம்’ சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָרָצִים
  choice: ஓடிவந்த
  rationale: רוץ என்பதன் அடிப்படைப் பொருளான ‘ஓடு’ பாதுகாக்கப்படுகிறது; கூட்டம் எழுப்பிய ஆரவாரத்தின் சூழலில் நிறைவுற்ற செயலை இயல்பாகச் சுட்ட ‘ஓடிவந்த’ என வழங்கப்பட்டது.
- source_word: מְהַלְלִים
  choice: வாழ்த்திப் புகழ்ந்துகொண்டே
  rationale: הלל என்பதன் ‘புகழ்தல்’ பொருளைப் பாதுகாத்து, புதிதாக அறிவிக்கப்பட்ட அரசனை மகிழ்ச்சியுடன் பாராட்டும் சூழலைத் தமிழில் இயல்பாகக் காட்ட ‘வாழ்த்திப் புகழ்தல்’ பயன்படுத்தப்பட்டது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: இறைப்பெயரை பொதுப்பட்டத்தால் மாற்றாமல் பெயர்ப்படுத்தி, בַּיִת என்பதைக் கட்டிடச் சூழலுக்கு இயல்பான ‘ஆலயம்’ என்று மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை பொதுப்பட்டமாக மாற்றாமல் வெளிப்படையாகப் பாதுகாக்கிறது; இவ்வசனத்தில் தனியாக விளக்க வேண்டிய கோட்பாட்டுச் சிக்கல் இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் நிகழ்வுவரிசை பாதுகாக்கப்பட்டாலும், இயல்பான தமிழ் சொல்வரிசைக்காக இடக்குறிப்பு இறுதி பிரிவுடன் இணைக்கப்பட்டது.
