base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/015.yaml
  text: So they laid hands on her[a], and she went to the entrance of the Horse Gate at the king’s house[b], and they put her to death there.
translation:
  language: ta
  text: ஆகவே அவர்கள் அவளைப் பிடித்துக்கொண்டார்கள்[a]. அவள் அரசரின் இல்லத்திலுள்ள குதிரை வாசலின் நுழைவிடத்துக்கு வந்தாள்[b]; அங்கே அவர்கள் அவளைக் கொன்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘அவள்மீது கைகளை வைத்தார்கள்.’ ‘அவளுக்கு வழிவிட்டார்கள்’ என்றும் பொருள் கொள்ள வாய்ப்புண்டு.'
    reason: lexical_alternative
  - marker: b
    text: ‘அரசரின் இல்லம்’ என்பது இங்கே ‘அரண்மனை’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: அவர்கள் அவளைப் பிடித்துக்கொண்டார்கள்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘அவள்மேல் கைகளை வைத்தார்கள்’ எனப் பொருள்படும். கைது செய்து கொல்ல அழைத்துச் செல்லும் இச்சூழலில், ‘பிடித்துக்கொண்டார்கள்’ என்பது அதன் இயல்பான கருத்தைத் தெளிவாகத் தருகிறது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מְבוֹא
  choice: நுழைவிடம்
  rationale: வாசலுக்குள் செல்லும் இடத்தையோ நுழைவுப் பகுதியையோ குறிக்கும் பெயர்ச்சொல்லுக்கு இயல்பான நவீனத் தமிழ்.
- source_word: שַׁעַר הַסּוּסִים
  choice: குதிரை வாசல்
  rationale: இது ஒரு குறிப்பிட்ட வாசலின் பெயராகத் தோன்றுவதால், ‘குதிரைகளின் வாசல்’ என்பதற்குப் பதிலாகச் சுருக்கமான இடப்பெயர் வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரசரின் இல்லம்
  rationale: எபிரெயச் சொற்றொடரின் வடிவத்தை நெருக்கமாகக் காக்கிறது. சூழலில் இது அரண்மனையைக் குறிக்கலாம் என்பதால் அந்த இயல்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיְמִיתוּהָ
  choice: அவர்கள் அவளைக் கொன்றார்கள்
  rationale: ‘அவளைச் சாகச் செய்தார்கள்’ என்ற காரணவினை கருத்தைத் தெளிவான தமிழில் தருகிறது. ‘மரணதண்டனை நிறைவேற்றினார்கள்’ என்பது சட்டரீதியான நுணுக்கத்தை அளவுக்கு மீறிச் சேர்க்கக்கூடும்.
- source_word: שָׁם
  choice: அங்கே
  rationale: முந்தைய நுழைவிடத்தைக் குறிக்கும் இயல்பான இடவினையடை.
