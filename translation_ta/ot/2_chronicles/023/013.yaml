base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
translation:
  language: ta
  text: அவள் பார்த்தாள்; இதோ, நுழைவிடத்தில் அரசன் தனக்குரிய தூணருகே நின்றுகொண்டிருந்தான். அதிகாரிகளும் எக்காளங்களும்[a] அரசனருகே இருந்தன. நாட்டின் மக்கள் எல்லாரும் மகிழ்ந்து எக்காளங்களை ஊதிக்கொண்டிருந்தார்கள்; பாடகர்கள் இசைக்கருவிகளுடன் புகழ்ச்சியை வழிநடத்திக்கொண்டிருந்தார்கள்[b]. அப்போது அத்தாலியாள் தன் ஆடைகளைக் கிழித்தாள்; “சதி! சதி!” என்று சொன்னாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அதிகாரிகளும் எக்காளங்களும் அரசனருகே.” கருவிகளைக் கொண்டு அவற்றை ஊதுகிறவர்களைக் குறிக்கும் ஆகுபெயராக இதைப் புரிந்து, சில மொழிபெயர்ப்புகள் “எக்காளம் ஊதுகிறவர்கள்” என்று தருகின்றன.
    reason: lexical_alternative
  - marker: b
    text: “புகழ்ச்சியை நெறிப்படுத்திக்கொண்டிருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம். இந்த இசைச் சூழலில் எபிரெயச் சொற்றொடர் மரபுத்தொடர் தன்மை கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: அவள் பார்த்தபோது, இதோ
  rationale: ראה என்பதன் நேரடியான பார்வை உணர்வையும், הִנֵּה என்பதன் திடீர் கவன ஈர்ப்பையும் இயல்பான தமிழ் கதைநடையில் காக்கிறது.
- source_word: הַמֶּלֶךְ עוֹמֵד עַל עַמּוּדוֹ בַּמָּבוֹא
  choice: நுழைவிடத்தில் அரசன் தனக்குரிய தூணருகே நின்றுகொண்டிருந்தான்
  rationale: பங்கேற்பு வடிவமான עוֹמֵד காட்சியின் தொடர்நிலையைச் சுட்டுவதால் ‘நின்றுகொண்டிருந்தான்’ என மொழிபெயர்க்கப்பட்டது. עַל இங்கு தூணின் மேல் அல்ல, அதனருகிலுள்ள அரச சடங்கு இடத்தைக் குறிக்கிறது.
- source_word: הַשָּׂרִים וְהַחֲצֹצְרוֹת עַל הַמֶּלֶךְ
  choice: அதிகாரிகளும் எக்காளங்களும் அரசனருகே இருந்தன
  rationale: மசோரெட்டிக் உரையில் ‘எக்காளம் ஊதுகிறவர்கள்’ என்று இல்லாமல் ‘எக்காளங்கள்’ என்றே இருப்பதால், கருவியால் வாசிப்பவர்களைக் குறிக்கும் ஆகுபெயர் வாய்ப்பைத் தீர்த்துவிடாமல் மூல வடிவம் காக்கப்பட்டது.
- source_word: וְכָל עַם הָאָרֶץ שָׂמֵחַ וְתוֹקֵעַ בַּחֲצֹצְרוֹת
  choice: நாட்டின் மக்கள் எல்லாரும் மகிழ்ந்து எக்காளங்களை ஊதிக்கொண்டிருந்தார்கள்
  rationale: עם הארץ என்பது நாட்டின் பொதுமக்களைச் சுட்டுகிறது; ஒருமை கூட்டுப்பெயரின் செயலைத் தமிழில் இயல்பாகப் பன்மையில் வழங்குகிறது.
- source_word: וְהַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר
  choice: பாடகர்கள் இசைக்கருவிகளுடன்
  rationale: מְשׁוֹרֲרִים குறிப்பாகப் பாடகர்களையும், כְּלֵי הַשִּׁיר இசைக்கான கருவிகளையும் குறிக்கிறது.
- source_word: וּמוֹדִיעִים לְהַלֵּל
  choice: புகழ்ச்சியை வழிநடத்திக்கொண்டிருந்தார்கள்
  rationale: இந்த இசை மற்றும் வழிபாட்டுச் சூழலில் Hiphil வடிவம் புகழ்ச்சியை நடத்துதல் அல்லது நெறிப்படுத்துதல் என்ற செயற்பாட்டுப் பொருளைத் தருகிறது; எவ்வாறு செய்தார்கள் என்று தேவையின்றி விரிவாக்கப்படவில்லை.
- source_word: קֶשֶׁר קָשֶׁר
  choice: சதி! சதி!
  rationale: קֶשֶׁר என்பது ஆட்சிக்கு எதிரான சதி அல்லது கிளர்ச்சித் திட்டத்தைக் குறிக்கிறது. இருமுறை கூறப்பட்ட அவசரக் கூச்சல் அப்படியே காக்கப்பட்டது.
