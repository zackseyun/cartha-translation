base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
translation:
  language: ta
  text: லேவியர்கள் அரசனைச் சுற்றிலும் சூழ்ந்திருக்க வேண்டும்; ஒவ்வொருவரும் தங்கள் ஆயுதங்களைக் கையில் வைத்திருக்க வேண்டும். வீட்டிற்குள்[a] நுழைபவன் எவனும் கொல்லப்பட வேண்டும். அரசன் உள்ளே வரும்போதும் வெளியே செல்லும்போதும் அவனோடு இருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘வீடு’; நாளாகமத்தில் இது ஆலயத்தைக் குறிக்கும் வழக்குச் சொல்லாகப் பயன்படுத்தப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקִּיפוּ
  choice: சூழ்ந்திருக்க வேண்டும்
  rationale: ஹிபில் வடிவம் இங்கு யோயாதாவின் கட்டளையாக வருகிறது; ‘வேண்டும்’ என்பது அதன் கட்டளை வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி குலத்தைச் சேர்ந்த ஆலயப் பணியாளர்களைக் குறிக்கும் நேரடியான பெயர்.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: அரசனை எல்லாப் பக்கங்களிலும் சூழ்வதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: ஒவ்வொருவரும் தங்கள் ஆயுதங்களைக் கையில் வைத்திருக்க வேண்டும்
  rationale: אִישׁ பகிர்நிலைப் பொருளில் ‘ஒவ்வொருவரும்’ எனவும், பாதுகாப்புச் சூழலில் כֵלָיו ‘ஆயுதங்கள்’ எனவும் பொருந்துகின்றன.
- source_word: וְהַבָּא אֶל הַבַּיִת
  choice: ஆலயத்திற்குள் நுழைகிற எவனும்
  rationale: உருபுடன் வந்த வினையெச்சம் பொதுவான நிபந்தனைப் பொருளைக் கொண்டது. ‘எவனும்’ அதன் எச்சரிக்கை மற்றும் சட்டப்பாங்கைத் தக்கவைக்கிறது.
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: சொற்பொருள் ‘வீடு’ என்றாலும், நாளாகமத்தில் இச்சூழலில் அது கர்த்தருடைய ஆலயத்தைக் குறிக்கும் வழக்குச் சொல்லாக இருப்பதால் முதன்மை உரையில் ‘ஆலயம்’ தெளிவானது; சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יוּמָת
  choice: கொல்லப்பட வேண்டும்
  rationale: ஹொஃபால் செயப்பாட்டு வடிவம் வெறுமனே இறப்பதை அல்ல, மரணத்திற்குள்ளாக்கப்படுவதைச் சுட்டுகிறது.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: அரசனோடு இருங்கள்
  rationale: היה உடன் אֶת இங்கு அரசனுடன் பாதுகாப்பாகத் துணைநிற்பதைக் குறிக்கிறது; ‘இருங்கள்’ மூலத்தின் எளிய கட்டளை வடிவத்தைப் பாதுகாக்கிறது.
- source_word: בְּבֹאוֹ וּבְצֵאתוֹ
  choice: அரசன் உள்ளே வரும்போதும் வெளியே செல்லும்போதும்
  rationale: இணையான எபிரெயச் சொற்றொடரின் இயக்கப் பொருளையும் இரு நேரங்களையும் தெளிவாகத் தருகிறது.
