base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
translation:
  language: ta
  text: 'பின்பு யோயாதா, தமக்கும் மக்கள் அனைவருக்கும் அரசனுக்கும் இடையே ஓர் உடன்படிக்கை செய்தார்[a]; அவர்கள் யாவேவுக்குரிய மக்களாக இருக்க வேண்டும் என்பதே அதன் நோக்கம்[b].


    [a] எபிரெய மொழியில் சொல்லர்த்தமாக, “ஓர் உடன்படிக்கையை வெட்டினார்.”

    [b] இதை, “யாவேவுக்கென்று ஒரு மக்களாக இருக்கும்படி” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லர்த்தமாக, “ஓர் உடன்படிக்கையை வெட்டினார்.”
    reason: lexical_alternative
  - marker: b
    text: இதை, “யாவேவுக்கென்று ஒரு மக்களாக இருக்கும்படி” என்றும் மொழிபெயர்க்கலாம்.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: ஓர் உடன்படிக்கை செய்தார்
  rationale: எபிரெய மொழியின் சொல்லர்த்தம் ‘உடன்படிக்கையை வெட்டினார்’ என்றாலும், தமிழில் solemn covenant-making idiom-ஐ இயல்பாகவும் தெளிவாகவும் ‘உடன்படிக்கை செய்தார்’ என்பதே தெரிவிக்கிறது; தொடக்க ‘பின்பு’ தொடர்கதை வாவை எடுத்துக்காட்டுகிறது.
- source_word: בֵּינוֹ וּבֵין כָּל הָעָם וּבֵין הַמֶּלֶךְ
  choice: தமக்கும் மக்கள் அனைவருக்கும் அரசனுக்கும் இடையே
  rationale: யோயாதா, மக்கள் அனைவரும், அரசன் ஆகிய மூன்று தரப்புகளையும் எபிரெய தொடரமைப்பின்படி வேறுபடுத்திக் காட்டுகிறது. ‘தமக்கும்’ என்பது யோயாதாவைத் திரும்பச் சுட்டும் மரியாதை ஒருமை வடிவம்.
- source_word: כָּל הָעָם
  choice: மக்கள் அனைவருக்கும்
  rationale: மூலத்தில் உள்ள ‘எல்லா மக்களும்’ என்ற அளவையே காக்கிறது; ‘நாட்டின் மக்கள்’ போன்ற மூலத்தில் இல்லாத விரிவாக்கம் சேர்க்கப்படவில்லை.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: அவர்கள் யாவேவுக்குரிய மக்களாக இருக்க வேண்டும் என்பதே அதன் நோக்கம்
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் infinitive clause-ஐ இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘யாவேவுக்குரிய மக்கள்’ என்பது உடன்படிக்கை சார்ந்த சொந்தத்தையும் பற்றுறுதியையும் தெளிவாகக் காட்டுகிறது; மேலும் சொல்லர்த்தமான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் நேரடியாக வரும் தேவனுடைய உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: உடன்படிக்கையின் தரப்புகளும் நோக்கமும்
  choice: யோயாதா, மக்கள் அனைவரும், அரசன் ஆகியோர் உடன்படிக்கையின் தரப்புகள்; யாவேவுக்குரிய மக்களாக இருப்பது அதன் நோக்கம்
  alternative: யாவே ஒரு நேரடி உடன்படிக்கைத் தரப்பாக இருந்தார் என்று வாசித்தல்
  rationale: எபிரெய உரை ‘அவனுக்கும் ... மக்கள் அனைவருக்கும் ... அரசனுக்கும் இடையே’ என்று மூன்று தரப்புகளைச் சொல்கிறது. யாவேவை நேரடி தரப்பாகப் பட்டியலிடாமல், மக்கள் யாருக்குரியவர்களாக இருக்க வேண்டும் என்பதை இறுதி நோக்கக் கூற்று தெரிவிக்கிறது.
- issue: לִהְיוֹת என்பதன் மறைமுக எழுவாய்
  choice: ‘அவர்கள்’ என்று சூழலிலிருந்து வெளிப்படுத்தப்பட்டது
  alternative: எழுவாயைக் குறிப்பிடாமல் ‘யாவேவுக்கென்று ஒரு மக்களாக இருக்கும்படி’ என்று மொழிபெயர்த்தல்
  rationale: எபிரெய infinitive-இல் எழுவாய் வெளிப்படையாக இல்லை. தமிழில் வாக்கியத்தை இயல்பாக்க ‘அவர்கள்’ சேர்க்கப்பட்டுள்ளது; யோயாதா, மக்கள், அரசன் ஆகிய முன்சொல்லப்பட்ட உடன்படிக்கைத் தரப்புகளையே இது இயல்பாகச் சுட்டுகிறது. மூலத்தின் மேலும் சொல்லர்த்தமான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘உடன்படிக்கை’ என்ற சொல் மத மற்றும் அரசியல் தீவிரத்தைக் காக்கிறது. ‘யாவேவுக்குரிய மக்கள்’ இயல்பான தமிழ்; அதேவேளை மூலத்தின் ‘ஒரு மக்கள் யாவேவுக்காக’ என்ற அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
