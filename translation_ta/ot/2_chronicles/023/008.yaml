base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
translation:
  language: ta
  text: லேவியர்களும் யூதா மக்கள் அனைவரும் ஆசாரியனான யோய்தா கட்டளையிட்ட அனைத்தின்படியும் செய்தார்கள். ஒவ்வொருவரும், ஓய்வுநாளில் பணிக்கு வந்தவர்களையும் ஓய்வுநாளில் பணிமுடிந்து செல்ல வேண்டியவர்களையும் சேர்த்து, தம் ஆட்களை அழைத்துக்கொண்டார்கள்; ஏனெனில் ஆசாரியனான யோய்தா பணிப்பிரிவுகளைப் பணியிலிருந்து விடுவிக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பணிப்பிரிவுகள்” என்பதற்கு “முறைப்பணிக் குழுக்கள்” அல்லது “பணிமுறைகள்” என்றும் மொழிபெயர்க்கலாம். இது திட்டமிட்ட முறைப்படி சேவை செய்த ஆசாரியர் மற்றும் லேவியர் குழுக்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: செய்தார்கள்
  rationale: עשה என்பது இங்கு யோய்தாவின் கட்டளைக்குக் கீழ்ப்படிந்து செயல்பட்டதைக் குறிக்கிறது; தமிழில் ‘அனைத்தின்படியும் செய்தார்கள்’ என்பது இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தையும் ஆலயப் பணிக் குழுவையும் குறிக்கும் வழக்கமான தமிழ் வடிவம்.
- source_word: וְכָל יְהוּדָה
  choice: யூதா மக்கள் அனைவரும்
  rationale: ‘யூதா முழுவதும்’ என்ற சொற்சொல் வடிவத்தைவிட, இடப்பெயர் மக்களைக் கூட்டாகக் குறிக்கும் எபிரெயப் பயன்பாட்டைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: கட்டளையிட்ட அனைத்தின்படியும்
  rationale: כְּכֹל என்பதிலுள்ள முழுமையான கீழ்ப்படிதலைப் பாதுகாக்கிறது.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: ஆசாரியனாகிய யோய்தா
  rationale: தனிப்பெயரை ஒலிபெயர்த்து, பதவியை இயல்பான தமிழ் தொடரில் தருகிறது.
- source_word: וַיִּקְחוּ אִישׁ אֶת אֲנָשָׁיו
  choice: ஒவ்வொருவரும் ... தம்முடன் வைத்துக்கொண்டார்கள்
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் பொருளை ‘ஒவ்வொருவரும்’ எனக் காட்டுகிறது. சூழலில் தலைவர்கள் தங்கள் ஆட்களை அழைத்துக்கொண்டதைக் குறிக்கும்; அடுத்துள்ள இரு பணிக்குழுக்களுடன் தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: ஓய்வுநாளில் பணிக்கு வந்தவர்கள்
  rationale: வாராந்திரப் பணிமுறை மாற்றத்தில் உள்ளே வந்த குழுவைக் குறிக்கிறது; ‘பணிக்கு’ என்பது சூழலால் தெளிவுபடுத்தப்பட்ட இயல்பான சேர்ப்பு.
- source_word: עִם יוֹצְאֵי הַשַּׁבָּת
  choice: ஓய்வுநாளில் பணியிலிருந்து செல்லவிருந்தவர்கள்
  rationale: வழக்கமாக அந்நாளில் பணி முடிந்து வெளியேற வேண்டிய குழுவைக் குறிக்கிறது; அவர்கள் உண்மையில் விடுவிக்கப்படவில்லை என்பதால் ‘சென்றவர்கள்’ என்பதற்குப் பதில் ‘செல்லவிருந்தவர்கள்’ பொருத்தமானது.
- source_word: לֹא פָטַר
  choice: பணியிலிருந்து விடுவிக்கவில்லை
  rationale: פטר இங்கு வழக்கமான கடமையின் முடிவில் ஆட்களை அனுப்பிவிடுதல் அல்லது விடுவித்தலைக் குறிக்கிறது.
- source_word: הַמַּחְלְקוֹת
  choice: பணிப்பிரிவுகள்
  rationale: ஒழுங்குபடுத்தப்பட்ட ஆசாரிய மற்றும் லேவிய சேவைக் குழுக்களைக் குறிக்கும் சொல்லை நவீன வாசகருக்குத் தெளிவாகத் தருகிறது.
