base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
translation:
  language: ta
  text: அவர்கள் யூதா நாடெங்கும் சென்று, யூதாவின் எல்லா நகரங்களிலிருந்தும் லேவியர்களையும் இஸ்ரவேலின் தந்தைவழிக் குடும்பங்களின் தலைவர்களையும்[a] ஒன்றுகூட்டினார்கள்; பின்னர் அவர்கள் எருசலேமுக்கு வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேலின் மூதாதையர் குடும்பங்களின் தலைவர்கள்”; இன்னும் இயல்பாக, “இஸ்ரவேலின் குடும்பத் தலைவர்கள்.”
    reason: וְרָאשֵׁי הָאָבוֹת என்ற எபிரெய மரபுத்தொடரின் வடிவநெருக்கமான மற்றும் பொருள்நெருக்கமான மாற்றுகளைப் பாதுகாக்கும் சொற்பொருள் விளக்கம்.
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: நாடெங்கும் சென்று
  rationale: סבב இங்கு வெறுமனே ‘திரும்புதல்’ என்பதல்ல; ஒரு பணிக்காக யூதா முழுவதும் சுற்றிச் செல்வதைக் குறிக்கிறது. ‘நாடெங்கும் சென்று’ என்பது அந்த இயக்கத்தையும் பரப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּיהוּדָה
  choice: யூதா
  rationale: இடப்பெயருக்கான வழக்கமான தமிழ் வடிவம்; ‘நாடெங்கும்’ என்பதுடன் சேர்ந்து இது பிரதேசத்தைக் குறிக்கிறது.
- source_word: וַיִּקְבְּצוּ
  choice: ஒன்றுகூட்டினார்கள்
  rationale: קבץ என்பதன் அடிப்படைப் பொருள் சிதறியிருப்பவர்களை ஒரே இடத்திற்குக் கூட்டுவது. இச்சூழலில் ‘ஒன்றுகூட்டினார்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֶת־הַלְוִיִּם
  choice: லேவியர்களை
  rationale: இது லேவி கோத்திரத்தைச் சேர்ந்தவர்களுக்கான நிலையான தமிழ் வேதாகமப் பெயர்.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: யூதாவின் எல்லா நகரங்களிலிருந்தும்
  rationale: מִן ஆதார இடத்தையும் כָּל முழுமையான பரப்பையும் குறிக்கின்றன; தமிழ் வடிவம் இரண்டையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்களையும்
  rationale: சொல்லுக்கு நெருக்கமாக ‘தந்தையரின் தலைவர்கள்’ என்று மொழிபெயர்ப்பது தமிழில் தவறாகப் புரியக்கூடும். நாளாகமத்தில் இது வம்ச அல்லது மூதாதையர் குடும்பப் பிரிவுகளின் தலைவர்களைக் குறிக்கும் மரபுத்தொடர் என்பதால், ‘தந்தைவழிக் குடும்பங்களின் தலைவர்கள்’ மூலத்தின் உறவுமுறை அமைப்பையும் பொருளையும் காக்கிறது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலின்
  rationale: לְ இங்கு நோக்கத்தைக் காட்டுவதற்குப் பதிலாக உறவு அல்லது சேர்ந்திருத்தலைக் காட்டுகிறது. ஆகவே ‘இஸ்ரவேலுக்காக’ என்பதைக் காட்டிலும் ‘இஸ்ரவேலின்’ பொருத்தமானது.
- source_word: וַיָּבֹאוּ אֶל־יְרוּשָׁלִָם
  choice: அவர்கள் எருசலேமுக்கு வந்தார்கள்
  rationale: בוא உடன் אֶל வரும்போது ஓர் இடத்தை நோக்கி வந்து சேர்வது குறிக்கப்படுகிறது. ‘எருசலேமுக்கு வந்தார்கள்’ இயல்பான, துல்லியமான தமிழாக்கம்.
theological_decisions:
- issue: யூதாவை மையமாகக் கொண்ட சூழலில் ‘இஸ்ரவேல்’ என்பதன் பரப்பு
  choice: மூலத்தில் உள்ளபடியே ‘இஸ்ரவேல்’ என்று வைத்தல்
  alternative: ‘யூதா’ அல்லது ‘இஸ்ரவேல் மக்கள்’ என்று விளக்கமாக மாற்றுதல்
  rationale: எபிரெய மூலத்தில் יִשְׂרָאֵל என்று வெளிப்படையாக உள்ளது. நாளாகமத்தில் தென் ராஜ்யச் சூழலிலும் இது விரிந்த உடன்படிக்கை மக்களைக் குறிக்கக்கூடும். அதை ‘யூதா’ என்று குறுக்காமலும், குறிப்பிட்ட விளக்கத்தைத் திணிக்காமலும் மூலத்தின் இறையியல் சொல்லாட்சியைப் பாதுகாக்கிறது.
- issue: הָאָבוֹת என்ற உறவுமுறை மரபுத்தொடர்
  choice: ‘தந்தைவழிக் குடும்பங்கள்’ என்று முதன்மை உரையில் வழங்கி, அடிக்குறிப்பில் மாற்று இயல்பான வடிவங்களைத் தருதல்
  alternative: ‘மூதாதையர் குடும்பங்கள்’ அல்லது ‘குடும்பங்கள்’
  rationale: இந்த மரபுத்தொடர் நாளாகமத்தின் வம்ச மற்றும் நிர்வாக அமைப்பில் முக்கியமானது. ‘தந்தைவழி’ என்பது அதன் மூல உறவுமுறைச் சாயலைக் காக்கிறது; அடிக்குறிப்பு வாசிப்பை எளிதாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய இணைப்புத் தொடரைத் தமிழில் தெளிவாக்க அரைப்புள்ளியும் ‘பின்னர்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன; நிகழ்வுகளின் வரிசை மாற்றப்படவில்லை. ‘இஸ்ரவேல்’ என்ற பெயரும் தந்தைவழிக் குடும்ப அமைப்பும் விளக்கவுரை மூலம் குறுக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
