id: 2CH.1.1
reference: 2 Chronicles 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֛ק שְׁלֹמֹ֥ה בֶן דָּוִ֖יד עַל מַלְכוּת֑/וֹ וַ/יהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וַֽ/יְגַדְּלֵ֖/הוּ לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
translation:
  language: ta
  text: தாவீதின் மகன் சாலொமோன் தன் அரசாட்சியில் வலிமையடைந்தான்[a]. அவனுடைய கடவுளாகிய யாவே[b] அவனோடு இருந்தார்; அவனை மிகுந்த மகத்துவம் உடையவனாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் அரசாட்சியின் மீது தன்னை வலுப்படுத்திக்கொண்டான்” அல்லது “தன் அரசாட்சியில் உறுதிப்படுத்தப்பட்டான்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் יהוה (YHWH) என்ற இறைப் பெயர்; பாரம்பரியமாக “கர்த்தர்” என்று வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: தன்னை வலுப்படுத்திக்கொண்டான்
  rationale: חזק என்பதன் ஹித்பயேல் வடிவம் தற்சார்பு அல்லது தன்வினை நுணுக்கத்தைக் கொண்டுள்ளது. சாலொமோன் வலிமைபெற்றதையும் அவன் தன்னை வலுப்படுத்திக்கொண்டதையும் குறிக்கக்கூடிய மூலத்தின் நெகிழ்வை இத்தேர்வு இயன்றவரை காக்கிறது.
- source_word: עַל מַלְכוּתוֹ
  choice: தன் அரசாட்சியின்மேல்
  rationale: עַל இங்கு அரசாட்சி அல்லது ஆட்சியதிகாரத்தின்மேல் உள்ள மேலாதிக்க உறவைக் காட்டுகிறது; 'அரசாட்சியின்மேல்' என்பது அந்த உருவகப்பொருளை விளக்கவுரை செய்யாமல் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் வழக்கிலுள்ள ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: אֱלֹהָיו
  choice: அவனுடைய கடவுள்
  rationale: உடைமைத் தொடர்பைக் கொண்ட எளிய எபிரெய அமைப்பை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: עִמּוֹ
  choice: அவனோடு இருந்து
  rationale: தெய்வீக உடனிருப்பைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: וַיְגַדְּלֵהוּ
  choice: அவனை ... மேன்மைப்படுத்தினார்
  rationale: גדל என்பதன் பியேல் வடிவிலுள்ள பிறவினைச் செயற்பொருளைத் தெளிவாகக் காக்கிறது; கடவுள் சாலொமோனை உயர்ந்த நிலைக்கு கொண்டுவந்தார் என்பது வெளிப்படுகிறது.
- source_word: לְמָעְלָה
  choice: மிகவும்
  rationale: இங்கு வினையை வலுப்படுத்தும் வினையடைப் பயன்பாடு; 'மிகவும்' என்பது நவீன தமிழில் இயல்பாக அதன் தீவிரத்தை வெளிப்படுத்துகிறது.
- source_word: בֶן דָּוִיד
  choice: தாவீதின் மகன்
  rationale: மகன் என்ற நேரடியான உறவையும் வம்சத் தொடர்பையும் அப்படியே காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை 'கர்த்தர்' என்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது. தமிழ் வாசகர்களிடையே நன்கு அறியப்பட்ட 'யெகோவா' முதன்மை உரையில் பயன்படுத்தப்பட்டு, மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: சாலொமோனின் உயர்வில் செயற்பாடு
  choice: சாலொமோன் தன்னை வலுப்படுத்திக்கொண்டதையும் கடவுள் அவனை மேன்மைப்படுத்தியதையும் இரண்டையும் வைத்திருத்தல்
  alternative: முதல் கூற்றை 'உறுதிப்படுத்தப்பட்டான்' என்று முழுமையாகச் செயப்பாட்டுவினையாக்குதல்
  rationale: எபிரெய உரை சாலொமோனின் தற்சார்பான வலுப்பெறுதலையும் யெகோவாவின் உடனிருப்பு மற்றும் செயற்பாட்டையும் அருகருகே வைக்கிறது. அந்த இறையியல் இழுவிசை தீர்த்துவிடப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. முதல் கூற்றின் சற்றே கடினமான 'அரசாட்சியின்மேல்' என்ற அமைப்பு, மூலத்தின் ஆட்சி-மேலாதிக்க உருவகத்தையும் உண்மையான பொருள் நெகிழ்வையும் காக்கத் திட்டமிட்டு விடப்பட்டுள்ளது.
