base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
translation:
  language: ta
  text: சாலொமோன் யாவேயின் பெயருக்காக ஒரு இல்லத்தையும், தன் அரசாட்சிக்காக ஒரு இல்லத்தையும் கட்டத் தீர்மானித்தான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “சொன்னான்”; இச்சூழலில் “தீர்மானித்தான்” அல்லது “கட்டளையிட்டான்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் இரண்டு இடங்களிலும் “இல்லம்” என்ற ஒரே சொல் வருகிறது; சூழலின்படி முதலாவது ஆலயத்தையும் இரண்டாவது அரண்மனையையும் குறிக்கிறது.
    reason: source_form
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: சொன்னான்
  rationale: எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருளான ‘சொல்’ என்பதைக் காக்கிறது. தொடர்ந்து வரும் நோக்கவினை அமைப்பால் இது தீர்மானம் அல்லது கட்டளையையும் குறிக்கக்கூடும்; அந்தச் சூழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִבְנוֹת
  choice: கட்ட வேண்டும் என்று
  rationale: ‘கட்ட’ என்ற பொருளைத் தெளிவாகக் கொடுத்து, வַיֹּאמֶר உடன் சேர்ந்த எபிரெய அமைப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּיִת ... וּבַיִת
  choice: ஓர் இல்லத்தையும் ... ஓர் இல்லத்தையும்
  rationale: இரு இடங்களிலும் வரும் ஒரே எபிரெயச் சொல்லின் மறுபயன்பாட்டைக் காக்கிறது. முதல் இல்லம் ஆலயத்தையும் இரண்டாவது இல்லம் அரண்மனையையும் சூழல் வழியாகக் குறிக்கின்றன.
- source_word: לְשֵׁם יְהוָה
  choice: யாவேயின் பெயருக்காக
  rationale: ஆலயம் யாவேயின் ‘பெயருக்காக’ அமைக்கப்படுவது என்ற எபிரெய இறையியல் மரபுத்தொடரை விளக்கிக் கரைக்காமல் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், பொதுவாக ஏற்கப்படும் ‘Yahweh’ உச்சரிப்புக்கு ஏற்ற தமிழெழுத்துப் பெயர்ப்பாக வழங்குகிறது.
- source_word: לְמַלְכוּתוֹ
  choice: தன் அரசாட்சிக்காக
  rationale: מַלְכוּת என்பதன் ‘அரசாட்சி/ராஜ்யம்’ என்ற பொருளை இங்கு சாலொமோனின் அரச ஆட்சியுடன் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: தெய்வீகப் பெயரும் ஆலயப் பெயர் மரபுத்தொடரும்
  choice: யாவேயின் பெயருக்காக
  alternative: கர்த்தருடைய பெயருக்காக
  rationale: மூலத்தில் உள்ள தனிப்பெயரையும், தேவன் ஆலயத்திற்குள் அடங்கியிருக்கிறார் என்று சொல்லாமல் அவரது பெயருடன் ஆலயத்தை இணைக்கும் மரபுத்தொடரையும் காக்கிறது.
- issue: בַּיִת என்ற சொல்லின் இருமுறை பயன்பாடு
  choice: இல்லம் ... இல்லம்
  alternative: ஆலயம் ... அரண்மனை
  rationale: மூலத்தின் திட்டமிட்ட சொல் மறுபயன்பாட்டைக் காக்கிறது; அதேவேளை சூழலில் குறிக்கப்படும் கட்டடங்களை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: וַיֹּאמֶר மற்றும் நோக்கவினையின் உறவு
  choice: கட்ட வேண்டும் என்று ... சொன்னான்
  alternative: கட்டத் தீர்மானித்தான் / கட்டும்படி கட்டளையிட்டான்
  rationale: மூல வினையின் நேரடிப் பொருளைக் காத்து, அது தீர்மானமா கட்டளையா என்பதை பிரதான உரையில் ஒருதலைப்பட்சமாக முடிவுசெய்யாமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘இல்லம்’ என்ற சொல் ‘வீடு’ என்பதைவிட ஆலயச் சூழலில் உயர்ந்த நடைக்கு ஏற்றதாகவும், மூலத்தின் சொல் மறுபயன்பாட்டைக் காக்கத்தக்கதாகவும் தேர்ந்தெடுக்கப்பட்டது. ‘தன்’ என்பது அரசாட்சி சாலொமோனுக்குரியது என்பதைத் தெளிவாக்குகிறது.
