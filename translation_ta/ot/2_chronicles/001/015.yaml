  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת הַ/כֶּ֧סֶף וְ/אֶת הַ/זָּהָ֛ב בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
translation:
  language: ta
  text: அரசன் எருசலேமில் வெள்ளியையும் தங்கத்தையும் கற்களைப்போல ஏராளமாக்கினான்[a]; கேதுரு மரங்களையும், தாழ்நிலப் பகுதியில்[b] உள்ள காட்டத்தி மரங்களைப்போல ஏராளமாக்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வெள்ளியையும் தங்கத்தையும் கற்களைப்போல ஆக்கினான்.” எபிரெய மொழி ஒப்புமையின் வழியாக அசாதாரணமான மிகுதியை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “தாழ்நிலப் பகுதி” என்பது மலைநாட்டுக்கும் கடற்கரைச் சமவெளிக்கும் இடையிலுள்ள யூதாவின் அடிவாரப் பிரதேசமான ஷெஃபெலாவைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: ஏராளமாக்கினான்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தான்/வைத்தான்’ என்றாலும், இங்கு பொருட்களும் ஒப்புமையும் சேர்ந்த அமைப்பு அவற்றை மிகுதியாகக் கிடைக்கச் செய்தான் என்ற விளைவுப் பொருளைத் தருகிறது.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: வெள்ளியையும் தங்கத்தையும்
  rationale: இரு விலைமதிப்புள்ள உலோகங்களையும் குறிக்கும் இயல்பான நவீனத் தமிழ் இணைப்பு; எபிரெய நேரடி பொருள் அமைப்பும் காக்கப்படுகிறது.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் எளிய நேரடி மொழிபெயர்ப்பு.
- source_word: כָּאֲבָנִים
  choice: கற்களைப்போல ஏராளமாக
  rationale: சொல்லளவில் ‘கற்களைப்போல’; இங்கு ஒப்புமை பொருள் ஒற்றுமையை அல்ல, மிகுதியைக் குறிப்பதால் ‘ஏராளமாக’ என்று வெளிப்படுத்தப்பட்டது.
- source_word: הָאֲרָזִים
  choice: கேதுரு மரங்கள்
  rationale: இது கேதுரு மரங்களையோ அவற்றின் மரப்பொருள் வளத்தையோ குறிக்கலாம்; ‘மரங்கள்’ என்பது வாசகருக்குத் தெளிவாகவும் எபிரெய பன்மையை நெருக்கமாகவும் வைத்திருக்கிறது.
- source_word: כַּשִּׁקְמִים
  choice: காட்டத்தி மரங்களைப்போல
  rationale: שׁקמה என்பது அப்பகுதியின் sycamore fig மரத்தைக் குறிக்கிறது; தமிழில் அறியப்படும் தாவரப்பெயரான ‘காட்டத்தி’ பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: தாழ்நிலப் பகுதியில் உள்ள
  rationale: שְׁפֵלָה யூதாவின் மலைநாட்டுக்கும் கடற்கரைச் சமவெளிக்கும் இடையிலுள்ள தாழ்வான அடிவாரப் பிரதேசத்தைக் குறிக்கலாம்; பொதுவாசகருக்காக பொருள்மொழிபெயர்ப்பு தரப்பட்டது.
- source_word: לָרֹב
  choice: ஏராளமாக
  rationale: மிகுதி என்ற பொருளைத் தரும் சொற்றொடர்; தமிழில் ஒப்புமையோடு இயல்பாக இணைக்கப்பட்டது.
