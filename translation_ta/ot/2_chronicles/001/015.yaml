  register: நவீன நிலையான தமிழில், இயல்பானதும் கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை. எபிரெய ஒப்புமையின் மிகுதிப் பொருள் முதன்மை உரையில் தெளிவாக்கப்பட்டு, சொல்லளவிலான மாற்று அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
