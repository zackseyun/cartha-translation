base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
translation:
  language: ta
  text: பின்பு சாலொமோன் கிபியோனிலிருந்த மேட்டிலுள்ள வழிபாட்டு இடத்திலிருந்து[a][c], சந்திப்புக் கூடாரத்தின் முன்னிலையிலிருந்து[b], எருசலேமுக்கு வந்து, இஸ்ரவேலின்மேல் ஆட்சி செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சென்றார்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் பார்வைநிலைக்கு ஏற்ப ‘வந்தார்’ அல்லது ‘சென்றார்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘சந்திப்புக் கூடாரத்தின் முன்பிருந்து’; இது பரிசுத்தக் கூடாரப் பகுதியிலிருந்து புறப்பட்டதைக் குறிக்கும் இடவியல் சொற்றொடர்.
    reason: cultural_note
  - marker: c
    text: அதாவது, சந்திப்புக் கூடாரம் அமைந்திருந்த கிபியோனின் மேட்டிலுள்ள வழிபாட்டு இடம்.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: בוא என்பது பார்வைநிலைக்கு ஏற்ப ‘வருதல்’ அல்லது ‘செல்லுதல்’ எனப் பொருள்படும். இங்கு இலக்கான எருசலேமை மையமாகக் கொண்டு ‘வந்து’ என்பது இயல்பாக உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַבָּמָה
  choice: மேட்டுத் தொழுகையிடம்
  rationale: במה என்பது உயர்ந்த இடத்தில் அமைந்த வழிபாட்டுத் தலத்தைக் குறிக்கிறது. வெறும் ‘மேடு’ என்பதைக் காட்டிலும் சமயப் பயன்பாட்டைத் தெளிவாக்கும் இயல்பான தமிழ் சொற்றொடர் இது; இச்சூழலில் கண்டனத் தொனியையும் சேர்ப்பதில்லை.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: கிபியோனிலிருந்த
  rationale: மேட்டுத் தொழுகையிடத்தின் இருப்பிடத்தை இயல்பான தமிழில் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: יְרוּשָׁלִַם
  choice: எருசலேமுக்கு
  rationale: எபிரெயச் சொல் வரிசை நெருக்கமாக இருந்தாலும், சூழலும் இயக்கத்தின் பொருளும் எருசலேமே இலக்கு என்பதைக் காட்டுகின்றன.
- source_word: מִלִּפְנֵי
  choice: முன்பிருந்து
  rationale: ‘முன்னிலையிலிருந்து’ என்ற இடவியல் கருத்தை நெருக்கமாகப் பாதுகாக்கிறது; கூடாரப் பரப்பிலிருந்து புறப்பட்டதைக் குறிக்கிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இறைவனோடு சந்திக்கும் நியமிக்கப்பட்ட கூடாரம் என்ற எபிரெயச் சொல்லாக்கத்தைத் தெளிவாகப் பிரதிபலிக்கிறது; விளக்கப் பொருளான ‘திருக்கூடாரம்’ என்பதைக் காட்டிலும் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַיִּמְלֹךְ
  choice: ஆட்சி செய்தார்
  rationale: சாலொமோன் ஏற்கெனவே அரசராக இருப்பதால் ‘அரசரானார்’ என்பதற்குப் பதில், தொடர்ந்து அரசாட்சி செய்தார் என்ற சூழலுக்குப் பொருந்துகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: מלך על என்பதன் இயல்பான தமிழ் வினை அமைப்பு ‘இஸ்ரவேலை ஆட்சி செய்தார்’ ஆகும்.
theological_decisions:
- issue: சுருக்கமான எபிரெயச் சொல் வரிசையில் ‘எருசலேம்’ என்பதன் தொடரியல் உறவு
  choice: சாலொமோன் கிபியோனிலுள்ள மேட்டுத் தொழுகையிடத்திலிருந்து எருசலேமுக்கு வந்தார்
  alternative: எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றி ‘கிபியோனிலுள்ள மேட்டுத் தொழுகையிடத்திற்கு எருசலேம் வந்தார்’ எனத் தெளிவின்றி மொழிபெயர்த்தல்
  rationale: முந்தைய சூழலில் சாலொமோன் கிபியோனுக்குச் சென்றிருந்தார்; இப்போது அங்கிருந்து எருசலேமுக்குத் திரும்புகிறார். இலக்கைத் தெளிவுபடுத்துவது சூழல் சார்ந்த தொடரியலை வெளிப்படுத்துகிறது; புதிய தகவலைச் சேர்ப்பதில்லை.
- issue: சந்திப்புக் கூடாரத்தோடு தொடர்புடைய கிபியோன் மேட்டுத் தொழுகையிடத்தின் சித்தரிப்பு
  choice: மேட்டுத் தொழுகையிடம்
  alternative: கண்டனப் பொருள் தோன்றக்கூடிய ‘புறமத மேடை’ போன்ற சொல்
  rationale: இங்கு במה என்ற சொல்லை அதன் வழிபாட்டுத் தலப் பொருளில் மொழிபெயர்த்து, பிற்கால எதிர்மறை மதிப்பீட்டை வசனத்திற்குள் இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேட்டுத் தொழுகையிடம்’ என்பது במה-வின் உயர்ந்த வழிபாட்டுத் தலம் என்ற கருத்தை சாதாரண வாசகருக்குத் தெளிவாக்குகிறது. மூலத்தின் ‘முன்பிருந்து’ என்ற இடவியல் நுணுக்கம் உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
