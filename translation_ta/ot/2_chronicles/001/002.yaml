source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֣ה לְ/כָל יִשְׂרָאֵ֡ל לְ/שָׂרֵי֩ הָ/אֲלָפִ֨ים וְ/הַ/מֵּא֜וֹת וְ/לַ/שֹּֽׁפְטִ֗ים וּ/לְ/כֹ֛ל נָשִׂ֥יא לְ/כָל יִשְׂרָאֵ֖ל רָאשֵׁ֥י הָ/אָבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
translation:
  language: ta
  text: சாலொமோன் இஸ்ரவேல் மக்கள் அனைவரிடமும் பேசினார்:[a] ஆயிரங்களுக்கும் நூறுகளுக்கும் தலைவர்களிடமும், நீதிபதிகளிடமும், இஸ்ரவேல் முழுவதிலும் உள்ள ஒவ்வொரு தலைவரிடமும்—அதாவது, தந்தைவழிக் குடும்பங்களின் தலைவர்களிடமும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சொன்னார்.”
    reason: lexical_alternative
  - marker: b
    text: “தந்தைவழிக் குடும்பங்களின் தலைவர்கள்” என்பது குலம் அல்லது மூதாதையர் வீட்டின் தலைவர்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: பேசினார்
  rationale: எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘சொன்னார்’ என்றாலும், இங்கு பல்வேறு தலைவர்களை நோக்கிய பொதுவான உரையாடலைக் குறிப்பதால் இயல்பான தமிழில் ‘பேசினார்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேல் அனைவரிடமும்
  rationale: ‘இஸ்ரவேல் முழுவதையும்’ என்ற தேசியக் கூட்டுப் பொருளைத் தக்கவைத்தபடி, ஆட்களை நோக்கிப் பேசும் தமிழ் அமைப்புக்கு ஏற்றவாறு வழங்குகிறது.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: ஆயிரத்துக்குத் தலைவர்களிடமும் நூற்றுக்குத் தலைவர்களிடமும்
  rationale: שָׂרֵי என்பதன் தலைமை அல்லது அதிகாரப் பொறுப்பை ‘தலைவர்கள்’ எனத் தருகிறது. ‘ஆயிரம்’, ‘நூறு’ என்பவை இராணுவ அல்லது நிர்வாகப் பிரிவுகளாக இருக்கக்கூடிய மூலத்தின் பொதுமையைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: וְלַשֹּׁפְטִים
  choice: நீதிபதிகளிடமும்
  rationale: שׁפט என்ற சொல்லிலிருந்து வந்த நிர்வாகப் பதவியை நேரடியாகவும் வழக்கமான தமிழிலும் குறிக்கிறது.
- source_word: וּלְכֹל נָשִׂיא
  choice: ஒவ்வொரு தலைவரிடமும்
  rationale: נָשִׂיא என்பதற்கு தலைவர், தலைமை வகிப்பவர், அதிபதி போன்ற பொருள்கள் உள்ளன; இச்சூழலில் அரச குமாரன் என்ற தவறான எண்ணத்தைத் தவிர்க்க ‘தலைவர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின் தலைவர்கள்
  rationale: மூலத்தின் ஆண்-மூதாதையர் வழியிலான சமூக அமைப்பை மறைக்காமல், இன்றைய வாசகருக்குப் புரியும் வகையில் வழங்குகிறது; இது முன் வரும் ‘ஒவ்வொரு தலைவர்’ என்பதற்கான விளக்க இணைப்பாகப் புரிந்துகொள்ளப்படுகிறது.
theological_decisions:
- issue: הָאָבוֹת என்ற உறவுமுறை–நிர்வாகச் சொல்லின் மொழிபெயர்ப்பு
  choice: தந்தைவழிக் குடும்பங்கள்
  alternative: மூதாதையர் குடும்பங்கள்; குடும்பங்கள்
  rationale: இது கோட்பாட்டுச் சர்ச்சைக்குரிய சொல் அல்ல. எனினும், எபிரெயச் சமூக அமைப்பின் தந்தைவழித் தன்மையைப் பொதுவான ‘குடும்பங்கள்’ என்று சமப்படுத்தாமல் வரலாற்றுத் துல்லியத்துடன் தக்கவைக்கிறது.
- issue: רָאשֵׁי הָאָבוֹת என்பதன் தொடரியல் தொடர்பு
  choice: ‘ஒவ்வொரு தலைவர்’ என்பதற்கு விளக்க இணைப்பாக ‘அதாவது’ கொண்டு வழங்குதல்
  alternative: தனியான மேலும் ஒரு தலைவர்களின் குழுவாகப் பட்டியலிடுதல்
  rationale: எபிரெய மொழியில் இச்சொற்றொடர் முன் வரும் தலைவர்களை அடையாளப்படுத்தும் இணைப்பாக இயல்பாகப் படிக்கப்படுகிறது; ‘அதாவது’ அந்தத் தொடர்பைத் தமிழில் தெளிவாக்குகிறது, ஆனால் அடிப்படை சமூகப் பதவியை மாற்றுவதில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. நிர்வாகப் பட்டியல் தெளிவாகத் தெரிய நீண்ட வாக்கியத்தில் கோடுகள் பயன்படுத்தப்பட்டன. ‘ஆயிரம்’ மற்றும் ‘நூறு’ என்பவை இராணுவப் பிரிவுகளா நிர்வாகப் பிரிவுகளா என்பதை உரைத் தீர்மானிக்காததால் ‘தளபதிகள்’ என்று மிகத் தெளிவுபடுத்தாமல் ‘தலைவர்கள்’ என வைக்கப்பட்டது.
