base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
translation:
  language: ta
  text: அவர்கள் எகிப்திலிருந்து ஒரு தேரை அறுநூறு சேக்கல் வெள்ளிக்கும், ஒரு குதிரையை நூற்றைம்பது சேக்கல் வெள்ளிக்கும் இறக்குமதி செய்தார்கள்.[a] அவ்வாறே, ஏத்தியரின் எல்லா அரசர்களுக்கும் அராம் அரசர்களுக்கும் அவர்கள் வழியாகவே அவற்றை ஏற்றுமதி செய்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “அவர்கள் மேலே கொண்டுவந்து, எகிப்திலிருந்து வெளியே கொண்டுவந்தார்கள்.” வணிகச் சூழலில் இதற்கு “இறக்குமதி செய்தார்கள்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “அவர்கள் வழியாக” என்பது எபிரெயத்தில் சொற்படியாக “அவர்களுடைய கையால்.” இந்த மரபுத்தொடர் அவர்கள் வழியாக அல்லது அவர்களால் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  choice: எகிப்திலிருந்து ... இறக்குமதி செய்தார்கள்
  rationale: இரு எபிரெய இயக்க வினைகளும் சொற்படியாக ‘மேலே கொண்டுவந்து வெளியே கொண்டுவந்தார்கள்’ எனப் பொருள்படும். விலை குறிப்பிடப்படும் வணிகச் சூழலில் இயல்பான நவீனத் தமிழில் ‘இறக்குமதி செய்தார்கள்’ என்பது கருத்தைத் தெளிவாகத் தருகிறது; சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֶרְכָּבָה
  choice: ஒரு தேர்
  rationale: விலை ஒவ்வொரு பொருளுக்குமானதாக அமைவதால் ஒருமை வடிவம் தக்கவைக்கப்படுகிறது.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: அறுநூறு சேக்கல் வெள்ளிக்கு
  rationale: எபிரெயத்தில் வெள்ளியின் அளவு மட்டும் உள்ளது; அக்காலத்தில் குறிக்கப்படும் எடை/பண அலகைத் தெளிவுபடுத்த ‘சேக்கல்’ சேர்க்கப்படுகிறது.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: ஒரு குதிரையை நூற்றைம்பது சேக்கல் வெள்ளிக்கும்
  rationale: சாதாரணமான ‘குதிரை’ என்ற பொருள் போதுமானது. முந்தைய விலைச் சொற்றொடரிலிருந்து வெள்ளியும் சேக்கலும் விடுபட்டிருப்பதாகப் புரிவதால் தமிழில் தெளிவுக்காக மீண்டும் வழங்கப்படுகின்றன.
- source_word: וְכֵן
  choice: அவ்வாறே
  rationale: அதே வணிக நடை தொடர்ந்ததை இயல்பாகக் குறிக்கிறது.
- source_word: לְכָל מַלְכֵי הַחִתִּים וּמַלְכֵי אֲרָם
  choice: ஏத்திய அரசர்கள் அனைவருக்கும் அராம் அரசர்களுக்கும்
  rationale: மக்கள் பெயரான ‘ஹித்தியர்’ என்பதற்கு தமிழில் நிலைபெற்ற ‘ஏத்தியர்’ வடிவமும், இடப்பெயருக்கு மூலத்தோடு நெருக்கமான ‘அராம்’ வடிவமும் பயன்படுத்தப்படுகின்றன.
- source_word: בְּיָדָם יוֹצִיאוּ
  choice: அவர்களுடைய முகவர்கள் மூலமாக அவற்றை ஏற்றுமதி செய்தார்கள்
  rationale: ‘அவர்களுடைய கையால்’ என்ற எபிரெய மரபுத்தொடர் இடைத்தரகு அல்லது முகவர் வழியிலான செயலைக் குறிக்கிறது. வணிகச் சூழலில் ‘முகவர்கள் மூலமாக’ என்பது அதன் கருத்தைத் தெளிவாக்குகிறது; יוֹצִיאוּ இங்கு பொருட்களை வேறு அரசர்களிடம் அனுப்பும் ஏற்றுமதியைக் குறிக்கிறது.
