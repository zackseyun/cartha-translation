translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. வணிகப் பின்னணியைத் தெளிவாக்க ‘இறக்குமதி/ஏற்றுமதி’ பயன்படுத்தப்பட்டாலும், மூலத்தின் சொற்படியான இயக்க மொழி அடிக்குறிப்பில் தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
