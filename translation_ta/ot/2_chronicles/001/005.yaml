revisions:
- from: ஊரியின் மகனும் கூரின் பேரனுமான பெசலேல் செய்த வெண்கலப் பலிபீடம் யாவேயின் திருக்கூடாரத்துக்கு முன்பாக அங்கே இருந்தது. சாலொமோனும் சபையினரும் அங்கே அதை[a] நாடிச் சென்றார்கள்.
  to: ஊரியின் மகனும் கூரின் பேரனுமான பெசலேல் செய்த வெண்கலப் பலிபீடம் யாவேயின் திருக்கூடாரத்துக்கு முன்பாக அங்கே இருந்தது. சாலொமோனும் சபையினரும் அதை[a] நாடினார்கள்.
  rationale: The revision removes the unsupported sense of travel while retaining the draft’s primary altar referent and its necessary footnoted alternative that the masculine suffix refers to Yahweh. No doctrinal interpretation is imposed.
