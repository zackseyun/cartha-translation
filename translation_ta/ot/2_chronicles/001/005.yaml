  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
translation:
  language: ta
  text: ஊரியின் மகனும் கூரின் பேரனுமான பெசலேல் செய்த வெண்கலப் பலிபீடம் யாவேயின் திருக்கூடாரத்துக்கு முன்பாக அங்கே இருந்தது. சாலொமோனும் சபையினரும் அதை[a] நாடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவரை நாடினார்கள்,” என்று யாவேயைக் குறித்துப் புரிந்துகொள்ளலாம். எபிரெய மொழியிலுள்ள பின்னொட்டு பலிபீடத்தையோ யாவேயையோ குறிக்கக்கூடியதாக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: வெண்கலப் பலிபீடம்
  rationale: מִזְבַּח என்பது பலிபீடம்; இவ்வழிபாட்டுப் பொருளின் சூழலில் נְחֹשֶׁת என்பதற்கு நவீன தமிழில் ‘வெண்கலம்’ பொருத்தமானது. தொடக்க ו இணைப்பின் தொடர்ச்சி தமிழில் வாக்கிய ஓட்டத்தால் இயல்பாக வெளிப்படுகிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: செய்த
  rationale: பலிபீடத்தை அடையாளப்படுத்தும் தொடர்பெயரெச்சமாகச் சுருக்கமான, இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: ஊரியின் மகனும் கூரின் பேரனுமான பெசலேல்
  rationale: எபிரெய மரபுவரிசையைத் தெளிவான நவீன தமிழில் காட்டுகிறது; ‘ஊரியின் மகன், கூரின் மகன்’ என்ற குழப்பமூட்டும் நேரடி வடிவத்தைத் தவிர்க்கிறது.
- source_word: שָׂם
  choice: அங்கே இருந்தது
  rationale: சொல்லின் இடநிலை விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; உரையில் சொல்லப்படாத செய்பவரைச் சேர்க்கவில்லை.
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: யாவேயின் திருக்கூடாரத்துக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் இடவியல் பொருள் ‘முன்பாக’; מִשְׁכָּן வழிபாட்டுக்குரிய வாசஸ்தலக் கூடாரம். יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּדְרְשֵׁהוּ
  choice: அங்கே அதை நாடிச் சென்றார்கள்
  rationale: דרשׁ என்பதன் ‘நாடு/தேடிச் செல்’ என்ற பொருளைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது. ஆண்பால் ஒருமை பின்னொட்டின் சுட்டுப்பொருளாக அருகிலுள்ள பலிபீடம் முதன்மை வாசிப்பாக எடுத்துக்கொள்ளப்படுகிறது; யாவேயைக் குறிக்கும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: שְׁלֹמֹה וְהַקָּהָל
  choice: சாலொமோனும் சபையினரும்
  rationale: קָהָל என்பது கூடிவந்த மக்கள் கூட்டத்தைக் குறிக்கிறது; ‘சபையினர்’ பொதுவழிபாட்டுச் சூழலில் தெளிவான, இயல்பான தமிழ்.
theological_decisions:
- issue: וַיִּדְרְשֵׁהוּ என்பதிலுள்ள பின்னொட்டின் சுட்டுப்பொருள்
  choice: 'அது பலிபீடத்தைக் குறிக்கிறது: ‘அதை நாடிச் சென்றார்கள்.’'
  alternative: 'அது யாவேயைக் குறிக்கலாம்: ‘அவரை நாடினார்கள்’; அல்லது இடத்தை மட்டும் மையப்படுத்தி ‘அங்கே நாடினார்கள்’ எனப் புரிந்துகொள்ளலாம்.'
  rationale: உடனடியாக முன்னுள்ள முக்கியப் பெயர்ச்சொல் பலிபீடம் என்பதால் முதன்மை உரையில் அதைக் குறிக்கும் வாசிப்பு ஏற்கப்படுகிறது. ஆனால் דרשׁ என்பது கடவுளை நாடுவதற்கும் வழக்கமாகப் பயன்படுவதால், எபிரெய உரையின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், மரியாதைமிக்க வேதாகம நடை. பெயர்கள் எபிரெய ஒலிக்கு அண்மையாக வழங்கப்பட்டுள்ளன. உரையில் இல்லாத செய்பவர் அல்லது கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை; சுட்டுப்பெயரின் இருபொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
