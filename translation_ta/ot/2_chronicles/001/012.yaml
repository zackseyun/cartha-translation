  text: הַֽ/חָכְמָ֥ה וְ/הַ/מַּדָּ֖ע נָת֣וּן לָ֑/ךְ וְ/עֹ֨שֶׁר וּ/נְכָסִ֤ים וְ/כָבוֹד֙ אֶתֶּן לָ֔/ךְ אֲשֶׁ֣ר לֹא הָ֣יָה כֵ֗ן לַ/מְּלָכִים֙ אֲשֶׁ֣ר לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹ֥א יִֽהְיֶה כֵּֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
translation:
  language: ta
  text: ஞானமும் அறிவும் உனக்கு வழங்கப்பட்டுள்ளன. செல்வத்தையும் சொத்துகளையும் கௌரவத்தையும் உனக்குத் தருவேன். உனக்கு முன்பிருந்த அரசர்கள் எவருக்கும் இத்தகையவை இருந்ததில்லை; உனக்குப் பிறகு வரும் அரசர்கள் எவருக்கும் இத்தகையவை இருக்காது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் நேரடியாக: “உனக்கு முன்பிருந்த அரசர்களுக்கு இவ்வாறு இருந்ததில்லை; உனக்குப் பிறகும் இவ்வாறு இருக்காது.”'
    reason: எபிரெயின் ‘இவ்வாறு’ என்ற சுருக்கமான ஒப்பீட்டு அமைப்பை முதன்மை உரை இயல்பான தமிழில் விரித்துக் கூறுகிறது; அடிக்குறிப்பு அதன் நேரடி வடிவத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: הַחָכְמָה
  choice: ஞானம்
  rationale: חָכְמָה என்பதன் வழக்கமான பொருளான ‘ஞானம்’ என்பதைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַמַּדָּע
  choice: அறிவு
  rationale: מַדָּע என்பது அறிவு அல்லது புரிந்துகொள்ளும் திறனைக் குறிக்கலாம்; ‘ஞானம்’ என்பதுடன் இயல்பாக இணையும் நேரடியான சொல் ‘அறிவு’.
- source_word: נָתוּן לָךְ
  choice: உனக்கு அருளப்பட்டிருக்கின்றன
  rationale: செயப்படுபொருள் சார்ந்த எபிரெயப் பெயரெச்சம், ஏற்கெனவே வழங்கப்பட்டு இப்போது பெற்றிருக்கும் நிலையைக் காட்டுகிறது. இறைவன் வழங்கும் கொடை என்ற சூழலில் ‘அருளப்பட்டிருக்கின்றன’ இயல்பானது.
- source_word: עֹשֶׁר
  choice: செல்வம்
  rationale: பொருளாதார வளத்தைக் குறிக்கும் עֹשֶׁר என்பதற்கான தெளிவான நவீனத் தமிழ் சொல்.
- source_word: נְכָסִים
  choice: சொத்துகள்
  rationale: உடைமைகள் அல்லது சொத்துகளைக் குறிக்கும் சொல்லை, முந்தைய ‘செல்வம்’ என்பதிலிருந்து வேறுபடுத்திக் காட்டுகிறது.
- source_word: כָבוֹד
  choice: பெருமை
  rationale: அரசருக்குக் கிடைக்கும் கனம், மதிப்பு, மகிமை ஆகிய பொருள் எல்லைகளைத் தக்கவைக்கிறது; இங்கு இறைமகிமை என்று மிகைப்படுத்தாமல் அரச மரியாதையைக் குறிக்கிறது.
- source_word: אֶתֶּן לָךְ
  choice: உனக்குத் தருவேன்
  rationale: இறைவன் இனி வழங்குவதாகக் கூறும் வாக்குறுதியை எபிரெய வினையின் சூழல்சார் எதிர்காலப் பொருளுடன் தருகிறது.
- source_word: אֲשֶׁר לֹא הָיָה כֵן
  choice: இத்தகையவை இருந்ததில்லை
  rationale: ‘இவ்வாறு இருந்ததில்லை’ என்ற சொல்லுக்குச் சொல் அமைப்பை இயல்பான தமிழில், முன் பட்டியலிடப்பட்ட கொடைகளையே சுட்டும் வகையில் தருகிறது.
- source_word: לַמְּלָכִים אֲשֶׁר לְפָנֶיךָ
  choice: உனக்கு முன்பிருந்த அரசர்கள் எவருக்கும்
  rationale: அரச ஆட்சித் தொடரில் சாலொமோனுக்கு முந்திய அரசர்களை ஒப்பிடும் காலப்பொருளைத் தெளிவாக்குகிறது.
- source_word: וְאַחֲרֶיךָ לֹא יִהְיֶה כֵן
  choice: உனக்குப் பிறகு வரும் அரசர்கள் எவருக்கும் இத்தகையவை இருக்காது
  rationale: பின்னர் வரும் அரசர்களுடனான ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெயில் மறைமுகமாக உள்ள ‘அரசர்கள்’ என்பதைக் சூழலிலிருந்து வெளிப்படையாக்குகிறது.
theological_decisions:
- issue: சாலொமோனின் ஒப்பற்ற தன்மை எதன் வரம்பிற்குள் கூறப்படுகிறது
  choice: ஒப்பீடு இவ்வசனத்தில் பட்டியலிடப்பட்ட ஞானம், அறிவு, செல்வம், சொத்துகள், பெருமை ஆகிய கொடைகளைக் குறிக்கிறது.
  alternative: சாலொமோன் தன் வாழ்வின் அல்லது ஆட்சியின் எல்லா அம்சங்களிலும் மற்ற எல்லா அரசர்களையும்விட ஒப்பற்றவர் என்ற பரந்த கூற்று.
  rationale: எபிரெயச் சொல்லமைப்பில் ஒப்பீடு உடனடியாக முன் கூறப்பட்ட கொடைகளோடு இணைகிறது. ஆகவே வசனம் கூறாத முழுமையான தனிநபர் மேன்மையை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. ‘அருளப்பட்டிருக்கின்றன’ என்பது தெய்வீக வழங்கலைக் குறிக்கிறது; ‘பெருமை’ அரச மரியாதை மற்றும் கனம் ஆகிய பொருள்களைத் தக்கவைக்கிறது. எபிரெயின் சுருக்கமான ஒப்பீடு முதன்மை உரையில் இயல்பாக விரிக்கப்பட்டு, அதன் நேரடி வடிவம் [a] அடிக்குறிப்பில் தரப்பட்டுள்ளது.
