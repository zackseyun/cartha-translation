base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/004.yaml
  text: But David had brought up the ark of God from Kiriath-jearim to the place David had prepared for it[a], for he had pitched a tent for it in Jerusalem.
translation:
  language: ta
  text: ஆனால் தேவனுடைய பெட்டியைத் தாவீது கீரியாத்-யெயாரீமிலிருந்து அதற்காகத் தாவீது ஆயத்தம் செய்திருந்த இடத்திற்குக் கொண்டு வந்திருந்தான்[a]. ஏனெனில், அதற்காக எருசலேமில் ஒரு கூடாரத்தை அமைத்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்கு நெருக்கமாக, ‘தாவீது அதற்காக ஆயத்தம் செய்திருந்த இடத்திற்கு.’ எபிரெயத் தொடர் சுருக்கமாக உள்ளது; தாவீது அதற்காக ஆயத்தம் செய்திருந்த இடத்திற்குப் பெட்டியைக் கொண்டு வந்தான் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: ஆனால்
  rationale: முந்தைய வசனத்தில் கிபியோனில் இருந்த வெண்கலப் பலிபீடத்துக்கும், வேறிடத்தில் இருந்த தேவனுடைய பெட்டிக்கும் இடையிலான வேறுபாட்டைக் குறிக்கிறது.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: தேவனுடைய பெட்டி
  rationale: இது இயல்பான நேரடிப் பொருள்; ‘உடன்படிக்கைப் பெட்டி’ என்று மூலத்தில் இல்லாத சொல்லை இங்கு சேர்க்கவில்லை.
- source_word: הֶעֱלָה
  choice: கொண்டுவந்திருந்தான்
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் பெட்டியைக் கொண்டுவருவதைக் குறிக்கிறது; முந்தியே நிகழ்ந்த பின்னணிச் செயலைத் தமிழில் நிறைவுற்ற இறந்தகால வடிவம் தெளிவுபடுத்துகிறது.
- source_word: מִקִּרְיַת יְעָרִים
  choice: கீரியாத்-யெயாரீமிலிருந்து
  rationale: எபிரெய இடப்பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: בַּהֵכִין לוֹ דָוִיד
  choice: அதற்காகத் தான் ஆயத்தம் செய்திருந்த இடத்திற்கு
  rationale: எபிரெயத் தொடர் சுருக்கமானது; இலக்கைத் தெளிவாக்க ‘இடம்’ சேர்க்கப்படுகிறது. ‘தான்’ என்பது தாவீதையே வலியுறுத்தும் சொல்வரிசையை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: נָטָה לוֹ אֹהֶל
  choice: அதற்காக ஒரு கூடாரத்தை அமைத்திருந்தான்
  rationale: נטה + אהל என்பது கூடாரத்தை விரித்து அமைத்தல் என்ற பொருளுடைய வழக்குத் தொடர்; ‘அமைத்தான்’ என்பது இயல்பான நவீன தமிழ்.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டுடன் வரும் பெயரைத் தமிழின் வழக்கமான வடிவில் தருகிறது.
