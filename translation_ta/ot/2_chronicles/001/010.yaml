  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עַתָּ֗ה חָכְמָ֤ה וּ/מַדָּע֙ תֶּן לִ֔/י וְ/אֵֽצְאָ֛ה לִ/פְנֵ֥י הָֽ/עָם הַ/זֶּ֖ה וְ/אָב֑וֹאָה כִּֽי מִ֣י יִשְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/זֶּ֖ה הַ/גָּדֽוֹל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
translation:
  language: ta
  text: இப்போது எனக்கு ஞானத்தையும் அறிவையும் தாரும். அதனால் இந்த மக்களுக்கு முன்பாக நான் புறப்பட்டுச் செல்லவும் திரும்பி வரவும் முடியும்[a]. ஏனெனில், உமக்குரிய இந்த மாபெரும் மக்களுக்கு[b] யார் நியாயந்தீர்க்க முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த மக்களுக்கு முன்பாகப் புறப்பட்டுச் சென்று திரும்பி வருவது” என்பது பொதுவில் தலைமை வகிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “உமது இந்த மாபெரும் மக்களுக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: சாலொமோனின் வேண்டுகோளை அறிமுகப்படுத்தும் காலக் குறிப்பு; நவீனத் தமிழில் நேரடியும் இயல்புமான இணை.
- source_word: חָכְמָה וּמַדָּע
  choice: ஞானத்தையும் அறிவையும்
  rationale: ஆட்சிக்கும் நீதிவழங்குதலுக்கும் தேவையான ஞானத்தையும் அறிவையும் தனித்தனி கருத்துகளாகப் பேணுகிறது; இரண்டையும் ஒரே சொல்லாகச் சுருக்கவில்லை.
- source_word: תֶּן לִי
  choice: எனக்கு ... தாரும்
  rationale: நேரடியான வேண்டுகோளை மரியாதைக்குரிய இறைமுகப்பு நடையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֵצְאָה ... וְאָבוֹאָה
  choice: நான் புறப்பட்டுச் செல்லவும் திரும்பி வரவும் முடியும்
  rationale: பொது தலைமை வகிப்பதைக் குறிக்கும் எபிரெய உருவகச் சொற்றொடரைத் தமிழில் புரியக்கூடிய வடிவில் பேணுகிறது; அதை நேரடியாக ‘ஆள’ என்று விரித்துரைக்கவில்லை.
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: இந்த மக்களுக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக’ என்ற உருவகத்தைப் பேணி, மக்களின் முன்னிலையில் தலைமை வகிக்கும் சூழலையும் உணர்த்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சாலொமோன் ஏன் ஞானத்தையும் அறிவையும் கேட்கிறான் என்பதற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: מִי יִשְׁפֹּט
  choice: யாரால் நியாயந்தீர்க்க முடியும்?
  rationale: יִשְׁפֹּט என்பதன் நீதித்துறை சார்ந்த அடிப்படைப் பொருளைப் பேணுகிறது; வினாவிலுள்ள இயலாமை/தகுதி குறித்த சொல்லாட்சியை ‘முடியும்’ வெளிப்படுத்துகிறது.
- source_word: עַמְּךָ הַזֶּה הַגָּדוֹל
  choice: உமக்குரிய இந்த மாபெரும் மக்களுக்கு
  rationale: இவர்கள் கடவுளுக்குரிய மக்கள் என்பதையும், הַגָּדוֹל குறிக்கும் எண்ணிக்கையிலும் முக்கியத்துவத்திலும் உள்ள பெருமையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: சாலொமோனின் வேண்டுகோளிலுள்ள தலைமைத்துவ மரபுத்தொடர்
  choice: ‘புறப்பட்டுச் செல்லவும் திரும்பி வரவும்’ என்ற மூலமொழிப் படிமத்தை முதன்மை உரையில் பேணுதல்
  alternative: ‘இந்த மக்களை வழிநடத்த’ அல்லது ‘இந்த மக்களை ஆள’
  rationale: மூல எபிரெயம் தலைமை வகிப்பதை உருவகமாகக் கூறுகிறது. வெளிப்படையான பொருளுரையை மட்டும் இடுவது அந்தப் படிமத்தை நீக்கிவிடும்; அடிக்குறிப்பு அதன் பண்பாட்டுப் பொருளை விளக்குகிறது.
- issue: יִשְׁפֹּט என்பதன் அரசாட்சி சார்ந்த விரிந்த பொருள்
  choice: நியாயந்தீர்க்க
  alternative: ஆள அல்லது ஆட்சிசெய்ய
  rationale: அரசன் ஆளுவதையும் நீதி நிர்வகிப்பதையும் இவ்வினைச்சொல் சூழலில் உள்ளடக்கலாம்; ஆயினும் ‘நியாயந்தீர்க்க’ அதன் நேரடியான நீதிசார் மையத்தைப் பேணி, அரசாட்சியாக மட்டும் பொருளைக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் ‘உமது’, ‘தாரும்’ என்ற மரியாதை வடிவங்கள் இடம்பெறுகின்றன. மூலமொழியின் தலைமைத்துவப் படிமம் முதன்மை உரையில் வைக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
