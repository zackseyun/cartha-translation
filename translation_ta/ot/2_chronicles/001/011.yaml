source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
translation:
  language: ta
  text: தேவன் சாலொமோனிடம், “இது உன் உள்ளத்தில் இருந்ததாலும், நீ செல்வத்தையோ, உடைமைகளையோ, கௌரவத்தையோ, உன்னை வெறுப்பவர்களின் உயிரையோ கேட்காமலும், நீண்ட ஆயுளையும்[a] கேட்காமலும், நான் உன்னை அரசனாக்கிய என் மக்களுக்கு நீதி வழங்குவதற்காக உனக்காக ஞானத்தையும் அறிவையும் கேட்டதாலும்,” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “பல நாட்களையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: …தாலும்
  rationale: கடவுளின் பதிலுக்கான காரணத்தைத் தெரிவிக்கும் எபிரெயக் காரணத் தொடர்பை இயல்பான தமிழில் தொடர்ச்சியான ‘…தாலும்’ அமைப்பால் காக்கிறது.
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  choice: இது உன் உள்ளத்தில் இருந்தது
  rationale: உள்ளார்ந்த மனநிலையையோ நோக்கத்தையோ குறிக்கும் எபிரெய உருவகத்தை விளக்கி முடிவுசெய்யாமல், தமிழில் புரியத்தக்க வகையில் காக்கிறது.
- source_word: עֹשֶׁר
  choice: செல்வம்
  rationale: பொதுவாகப் புரியும் நவீனத் தமிழ் சொல்; அடுத்துள்ள உடைமைகள் என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: נְכָסִים
  choice: உடைமைகள்
  rationale: சொத்து மற்றும் பொருள் வைத்திருப்புகளை இயல்பாகக் குறித்து, עֹשֶׁר என்பதிலிருந்து தனித்த பொருளைத் தக்கவைக்கிறது.
- source_word: כָבוֹד
  choice: மதிப்பு
  rationale: அரசருக்குரிய அந்தஸ்து, சிறப்பு, பிறரிடமிருந்து கிடைக்கும் மரியாதை ஆகியவற்றை இச்சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  choice: உன்னை வெறுப்பவர்களின் உயிர்
  rationale: נֶפֶשׁ என்பதன் இச்சூழலுக்குரிய ‘உயிர்’ பொருளையும், שֹׂנְאֶיךָ என்பதன் பங்கேற்புவினை வடிவத்தையும் நெருக்கமாகக் காக்கிறது.
- source_word: יָמִים רַבִּים
  choice: நீண்ட ஆயுள்
  rationale: சொல்லுக்குச் சொல் ‘பல நாட்கள்’ என்றாலும், வேண்டப்படும் நன்மையாகிய நீண்ட வாழ்நாளை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חָכְמָה וּמַדָּע
  choice: ஞானமும் அறிவும்
  rationale: இரு எபிரெயச் சொற்களின் வேறுபாட்டைக் காக்கும் நிலையான, தெளிவான தமிழ்ச் சொற்கள்.
- source_word: לְךָ
  choice: உனக்கு
  rationale: ஞானமும் அறிவும் அளிக்கப்பட வேண்டிய பெறுநர் சாலொமோன் என்பதை இயல்பான தமிழில் குறிக்கிறது; சுயநலப் பொருளைச் சேர்ப்பதில்லை.
- source_word: אֲשֶׁר תִּשְׁפּוֹט
  choice: நீ நீதி வழங்குவதற்காக
  rationale: שׁפט என்பதன் நீதித்தீர்ப்பு சார்ந்த பொருளையும், இங்கு காணப்படும் நோக்கத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֱלֹהִים என்ற தெய்வீகக் குறிப்பின் மொழிபெயர்ப்பு
  choice: தேவன்
  alternative: கர்த்தர்
  rationale: மூலத்தில் אֱלֹהִים உள்ளது; ய்ஹ்வெ என்ற தெய்வீகப் பெயர் இல்லை. எனவே ‘கர்த்தர்’ என்பதை இறக்குமதி செய்யாமல் ‘தேவன்’ என்று மொழிபெயர்க்கப்படுகிறது.
- issue: שׁפט என்பதன் அரசாட்சி சார்ந்த பொருள்
  choice: நீதி வழங்கு
  alternative: ஆட்சி செய்
  rationale: அரசரின் ஆட்சிப் பொறுப்பு பின்னணியில் இருந்தாலும், மூல வினையின் நீதித்தீர்ப்பு சார்ந்த வலிமையை மறைக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், அரசவைக் கூற்றுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. வசனம் அடுத்த வசனத்தில் தொடரும் காரணவாக்கியமாக இருப்பதால் இறுதியில் முடிவுறாத தொடரமைப்பு பாதுகாக்கப்பட்டுள்ளது.
