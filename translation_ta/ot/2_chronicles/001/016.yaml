translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய வசனத்தின் தொடரோட்டம் அரைப்புள்ளியால் காக்கப்பட்டுள்ளது. கூவே/சேகரிப்பு இடம் என்ற உண்மையான உரைநிலை ஐயம் முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் மறைக்கப்படவில்லை.
