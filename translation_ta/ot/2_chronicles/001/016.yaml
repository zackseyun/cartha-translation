  text: וּ/מוֹצָ֧א הַ/סּוּסִ֛ים אֲשֶׁ֥ר לִ/שְׁלֹמֹ֖ה מִ/מִּצְרָ֑יִם וּ/מִ/קְוֵ֕א סֹחֲרֵ֣י הַ/מֶּ֔לֶךְ מִ/קְוֵ֥א יִקְח֖וּ בִּ/מְחִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
translation:
  language: ta
  text: சாலொமோனுக்குரிய குதிரைகள் கிடைத்த இடங்கள் எகிப்தும் கூவேயும்[a] ஆகும்; அரசனுடைய வணிகர்கள் அவற்றைக் கூவேயிலிருந்து விலை கொடுத்து வாங்கிக்கொள்வார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சேகரிப்பு இடமும்.” מִקְוֵא என்ற எபிரெயச் சொல் விளக்குவதற்குக் கடினமானது; இது ‘கூவே’ என்ற இடப்பெயராக அல்லாமல், சேகரிப்பு இடத்தைக் குறிக்கும் பொதுப்பெயராகவும் புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: 'மாற்றுப் புரிதல்: “அரசனுடைய வணிகர்கள் அவற்றைச் சேகரிப்பு இடத்திலிருந்து விலை கொடுத்து வாங்கிக்கொள்வார்கள்.” இவ்வாசிப்பு מִקְוֵא என்பதை இடப்பெயராக அல்லாமல் சேகரிப்பு இடம் என்று எடுத்துக்கொள்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצָא
  choice: வந்தன
  rationale: மוֹצָא என்பது தோற்றுவாய் அல்லது கிடைக்கும் இடத்தைக் குறிக்கலாம். வணிகச் சூழலில், குதிரைகள் அந்த இடங்களிலிருந்து வந்தன என்று இயல்பான தமிழில் கூறுவது அதன் கருத்தை அளவுக்கு மீறி விளக்காமல் வெளிப்படுத்துகிறது.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: சாலொமோனுக்குரிய குதிரைகள்
  rationale: לִשְׁלֹמֹה இங்கு உடைமை அல்லது தொடர்பைக் குறிக்கிறது; ‘சாலொமோனுக்குரிய’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: מִמִּצְרָיִם
  choice: எகிப்திலிருந்து
  rationale: முற்சொல் מִן குறிக்கும் ‘இலிருந்து’ என்ற பொருளையும் நிலையான இடப்பெயரையும் நேரடியாகத் தருகிறது.
- source_word: וּמִקְוֵא / מִקְוֵא
  choice: கூவேயிலிருந்து
  rationale: வாசகம் கடினமானது. எகிப்துக்கு இணையாக வரும் இடப்பெயராகவும், இரண்டாம் இடத்திலும் அதே இடத்தைக் குறிப்பதாகவும் எடுத்துக்கொள்ளப்பட்டது; பொதுப்பெயர் எனும் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: அரசனுடைய வணிகர்கள்
  rationale: வணிகத்தில் ஈடுபடுவோரைக் குறிக்கும் பெயர்ச்சொல் பயன்பாட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: יִקְחוּ
  choice: பெற்றுக்கொள்வார்கள்
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; விலை சார்ந்த இச்சூழலில் ‘பெற்றுக்கொள்’ என்பது வாங்குதல் என்ற கருத்தை உணர்த்தினாலும் வினைச்சொல்லில் இல்லாத குறிப்பை அதிகமாகச் சேர்ப்பதில்லை.
- source_word: בִּמְחִיר
  choice: விலைகொடுத்து
  rationale: பணம் செலுத்தி நிகழும் வணிகப் பரிமாற்றத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
