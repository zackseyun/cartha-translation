base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: ta
  text: சாலொமோன் தேர்களையும் குதிரைவீரர்களையும்[a] திரட்டினான். அவனிடம் 1,400 தேர்களும் 12,000 குதிரைவீரர்களும் இருந்தனர். அவற்றை அவன் தேர்நகரங்களிலும்[b] எருசலேமில் அரசனோடும் நிறுத்திவைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குதிரைப்படையையும்.’ எபிரெயச் சொல் குதிரைமேல் ஏறிச் செல்லும் வீரர்களைக் குறிக்கிறது; ‘குதிரைவீரர்கள்’ என்பது அதன் நேரடியான மொழிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, தேர்கள் வைக்கப்பட்ட அல்லது தேர்ப்படை நிறுத்தப்பட்ட சிறப்பு நகரங்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: திரட்டினான்
  rationale: אָסַף என்பதன் ‘ஒன்றுசேர்த்தல், சேகரித்தல்’ என்ற பொருளை, இராணுவ வளங்களைப் பெருக்கிக்கொண்ட சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רֶכֶב
  choice: தேர்கள்
  rationale: இந்தச் சொல் கூட்டாகத் தேர்ப்படையைக் குறிக்கக்கூடும்; ஆனால் இங்கு 1,400 என்று எண்ணிக்கை தரப்படுவதால், எண்ணக்கூடிய பொருளான ‘தேர்கள்’ என்பது தெளிவான மொழிபெயர்ப்பு.
- source_word: פָּרָשִׁים
  choice: குதிரைவீரர்கள்
  rationale: இந்த எபிரெயச் சொல் பொதுவாகக் குதிரைகளையே அல்ல, அவற்றின்மேல் ஏறிச் செல்லும் வீரர்களைக் குறிக்கிறது. ‘குதிரைவீரர்கள்’ மூலத்தின் தனிநபர் குறியீட்டையும் இராணுவச் சூழலையும் காக்கிறது.
- source_word: וַיְהִי לוֹ
  choice: அவனிடம் ... இருந்தனர்
  rationale: ‘அவனுக்கு இருந்தது’ என்ற எபிரெய உடைமை மரபுத்தொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1,400 தேர்கள்
  rationale: மூலத்திலுள்ள துல்லியமான எண்ணிக்கையை வாசிக்க எளிதான எண் வடிவில் காக்கிறது.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12,000 குதிரைவீரர்கள்
  rationale: மூலத்திலுள்ள துல்லியமான எண்ணிக்கையையும் ‘வீரர்கள்’ என்ற மனிதக் குறியீட்டையும் காக்கிறது.
- source_word: וַיַּנִּיחֵם
  choice: அவற்றை ... நிறுத்திவைத்தான்
  rationale: இராணுவ வளங்களை குறிப்பிட்ட இடங்களில் வைத்தான் என்ற causative பொருளை ‘நிறுத்திவைத்தான்’ இயல்பாகத் தருகிறது. ஒரே பன்மைச் சுட்டுப்பெயர் தேர்களையும் வீரர்களையும் கூட்டாகச் சுட்டும் மூலத்தின் சுருக்கத்தைக் காக்கிறது.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: தேர்நகரங்களில்
  rationale: தேர்கள் வைக்கப்பட்ட அல்லது காவல்படையாக நிறுத்தப்பட்ட சிறப்பு நகரங்களைக் குறிக்கும் சுருக்கமான பெயராக அமைந்துள்ளது.
- source_word: וְעִם הַמֶּלֶךְ
  choice: அரசனிடமும்
  rationale: ‘அரசனுடன்’ என்ற மூலக் கருத்தை, பொருட்களும் படைவீரர்களும் அரசன் இருந்த இடத்தில் வைக்கப்பட்டனர் என இயல்பாகத் தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘சிலவற்றை’ என்பதைச் சேர்க்கவில்லை.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவத்தையும் இடப்பொருள் வேற்றுமையையும் பயன்படுத்துகிறது.
