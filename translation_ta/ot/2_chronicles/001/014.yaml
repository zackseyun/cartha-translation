translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இராணுவச் சூழலைத் தெளிவாக்கும் சொற்கள் பயன்படுத்தப்பட்டாலும், மூலத்தில் இல்லாத படைப்பிரிவு விவரங்கள் சேர்க்கப்படவில்லை. அடிக்குறிப்புகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே பொருத்தப்பட்டுள்ளன.
