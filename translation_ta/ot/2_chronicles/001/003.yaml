revisions:
- from: அப்போது சாலொமோனும் அவனுடன் இருந்த சபையார் அனைவரும் கிபியோனிலிருந்த மேட்டிலுள்ள வழிபாட்டிடத்திற்குச் சென்றார்கள்; ஏனெனில் கடவுளின் சந்திப்புக் கூடாரம் அங்கே இருந்தது. அதை யாவேயின் ஊழியரான மோசே பாலைவனத்தில் அமைத்திருந்தார்.
  to: அப்போது சாலொமோனும் அவரோடு சபையினர் அனைவரும் கிபியோனில் இருந்த உயர்ந்த வழிபாட்டு இடத்திற்குச் சென்றார்கள்; ஏனெனில் அங்கே, யாவேயின் ஊழியரான மோசே வனாந்தரத்தில் செய்த கடவுளின் சந்திப்புக் கூடாரம் இருந்தது.
  rationale: 'The revision improves idiomatic modern Tamil and keeps the syntax close to the Hebrew: the high place is located at Gibeon, and the tent of meeting is explicitly the one Moses made in the wilderness. It retains the nonjudgmental rendering of במה and transliterates the divine name as ‘யாவே.’'
