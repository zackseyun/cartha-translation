id: 2CH.1.3
reference: 2 Chronicles 1:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
translation:
  language: ta
  text: அப்போது சாலொமோனும் அவரோடு சபையினர் அனைவரும் கிபியோனில் இருந்த உயர்ந்த வழிபாட்டு இடத்திற்குச் சென்றார்கள்; ஏனெனில் அங்கே, யாவேயின் ஊழியரான மோசே வனாந்தரத்தில் செய்த கடவுளின் சந்திப்புக் கூடாரம் இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: சென்றார்கள்
  rationale: הלך என்பதன் வழக்கமான கதைத் தொடர்ச்சி வினை; மூலத்தில் இல்லாத திசைநுட்பத்தைச் சேர்க்காமல் இயல்பான இறந்தகாலமாக மொழிபெயர்க்கப்பட்டது.
- source_word: הַקָּהָל
  choice: சபையார் அனைவரும்
  rationale: קהל கூடிய சமூகத்தைக் குறிக்கிறது; நவீனத் தமிழில் கூட்டாகச் சேர்ந்த மக்களை இயல்பாகவும் மரியாதையாகவும் தெரிவிக்கிறது.
- source_word: לַבָּמָה
  choice: மேட்டிலுள்ள வழிபாட்டிடம்
  rationale: במה என்பது உயரமான இடத்திலிருந்த வழிபாட்டுத் தலத்தைக் குறிக்கிறது. வெறும் ‘மேடு’ என்பதைக் காட்டிலும் அதன் வழிபாட்டுச் செயல்பாட்டைத் தெளிவாக்குகிறது; இச்சூழலில் எதிர்மறைத் தீர்ப்பைச் சேர்க்கவில்லை.
- source_word: בְּגִבְעוֹן
  choice: கிபியோனில்
  rationale: இடப்பெயர் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டு, בְ என்பதன் இடப்பொருள் இயல்பாகக் காட்டப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சாலொமோன் அங்கே சென்றதற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக எடுத்துக்கொள்ளப்பட்டது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: தேவன் தம் மக்களைச் சந்திக்கும் புனிதக் கூடாரத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் கூறுகளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הָאֱלֹהִים
  choice: கடவுளின்
  rationale: சந்திப்புக் கூடாரத்துடனான உரிமை/தொடர்பு இயல்பான தமிழ் உடைமை வடிவில் தரப்பட்டது.
- source_word: עָשָׂה
  choice: அமைத்திருந்தார்
  rationale: கூடாரத்தை உருவாக்கி நிறுவிய செயலைத் தமிழில் இயல்பாகக் காட்டுகிறது; முதன்மைக் கதைக்காலத்திற்கு முந்திய செயல் என்பதால் நிறைவுற்ற முன்னிலைப் பொருள் பாதுகாக்கப்பட்டது.
- source_word: עֶבֶד יְהוָה
  choice: யாவேயின் ஊழியர்
  rationale: மோசேக்கு வழங்கப்படும் மதிப்புக்குரிய பணிசார் பட்டமாக עבד இங்கு செயல்படுவதால் ‘ஊழியர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பொதுவான தமிழ் ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- source_word: בַּמִּדְבָּר
  choice: பாலைவனத்தில்
  rationale: மக்கள் குடியிராத வறண்ட வனாந்தரப் பகுதியை இன்றைய பொதுத் தமிழில் தெளிவாகக் குறிக்கிறது.
theological_decisions:
- issue: ஆலயம் கட்டப்படுவதற்கு முன் முறையான வழிபாடு நடைபெற்ற சூழலில் במה என்பதன் மொழிபெயர்ப்பு
  choice: மேட்டிலுள்ள வழிபாட்டிடம்
  alternative: உயர்ந்த இடம் / மேட்டுக் கோவில்
  rationale: இடத்தின் உயரத்தையும் வழிபாட்டுச் செயல்பாட்டையும் தெரிவிக்கிறது; இவ்வசனத்தில் இல்லாத கண்டனத் தொனியையோ அங்கீகாரத் தீர்ப்பையோ இறக்குமதி செய்யவில்லை.
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பெயரை பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. நீண்ட எபிரெய வாக்கியம் தமிழ் வாசிப்புத் தெளிவுக்காக இரு வாக்கியங்களாகப் பிரிக்கப்பட்டது. மூலத்தின் כִּי தெளிவாகக் காரணப்பொருள் தருவதால் ஆங்கில ஆலோசனை உரையிலுள்ள மாற்றுக் குறிப்பைத் தமிழில் சேர்க்க வேண்டியதில்லை.
