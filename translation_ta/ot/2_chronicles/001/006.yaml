  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּעַל֩ שְׁלֹמֹ֨ה שָׁ֜ם עַל מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר לְ/אֹ֣הֶל מוֹעֵ֑ד וַ/יַּ֧עַל עָלָ֛י/ו עֹל֖וֹת אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
translation:
  language: ta
  text: சாலொமோன் அங்கே, யாவேவின் முன்னிலையில், சந்திப்புக் கூடாரத்தருகில் இருந்த வெண்கலப் பலிபீடத்திற்குச் சென்று, அதன்மேல் ஆயிரம் தகனபலிகளைச் செலுத்தினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל ... שָׁם
  choice: அங்கே ... சென்றான்
  rationale: עלה அடிப்படையில் மேலே செல்லுதல் என்ற திசை உணர்வைக் கொண்டது. இங்கு சாலொமோன் பலிபீடத்தை அணுகிச் சென்றதைக் குறிக்கும் இயல்பான நவீனத் தமிழாக ‘சென்றான்’ பயன்படுத்தப்பட்டுள்ளது; ‘ஏறினான்’ என்பது பலிபீடத்தின் மேல் உடலால் ஏறியதாகத் தவறாகப் புரியக்கூடும்.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: வெண்கலப் பலிபீடம்
  rationale: நְחֹשֶׁת செம்பையோ செம்புக் கலவையான வெண்கலத்தையோ குறிக்கக்கூடும்; வழிபாட்டுச் சூழலில் மரபாகவும் தெளிவாகவும் உள்ள ‘வெண்கலம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: לִפְנֵי என்பது ஒருவரின் முன்னிலையையோ சந்நிதியையோ குறிக்கிறது. ‘முன்னிலையில்’ என்பது இடத்தையும் தெய்வீகச் சந்நிதியையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் கடவுளின் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல், நவீனத் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֲשֶׁר לְאֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரத்தருகே இருந்த
  rationale: לְ இங்கு கூடாரத்துடன் பலிபீடத்துக்கு உள்ள இடம் அல்லது தொடர்பைக் குறிக்கிறது. சூழலுக்கு ஏற்ற முதன்மை வாசிப்பாக அருகாமை வெளிப்படுத்தப்பட்டுள்ளது; தொடர்பு சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: அதன்மேல் ... தகனபலிகளைச் செலுத்தினான்
  rationale: עלה இங்கு பலி செலுத்தும் வழிபாட்டுச் சொல்லாட்சியாக வருகிறது. ‘செலுத்தினான்’ தமிழில் இயல்பாக அந்தச் செயலைத் தெரிவிக்கிறது; עָלָיו என்பதன் பலிபீடத்தின் மேல் என்ற குறிப்பும் தனியே தக்கவைக்கப்பட்டுள்ளது.
- source_word: עֹלוֹת אָלֶף
  choice: ஆயிரம் தகனபலிகள்
  rationale: עֹלָה முழுவதும் எரிக்கப்படும் பலிக்கான நிலையான வழிபாட்டுச் சொல்; אָלֶף எண்ணிக்கையை நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பட்டப்பெயரை அல்ல, நான்கு எழுத்துகளாலான தனிப்பெயரை நேரடியாகக் கொண்டுள்ளது. ஆகவே அந்த வேறுபாட்டைத் தக்கவைக்க ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது; வாசகர்களுக்கான விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: பலிபீடம் சந்திப்புக் கூடாரத்துடன் கொண்ட உறவு
  choice: சந்திப்புக் கூடாரத்தருகே இருந்த
  alternative: சந்திப்புக் கூடாரத்துக்குரியதாக இருந்த
  rationale: לְ என்ற முன்னொட்டு இடத் தொடர்பையோ உடைமை/இணைப்பு தொடர்பையோ காட்டலாம். வசனச் சூழலில் இடத் தொடர்பு முதன்மை உரையில் இயல்பாக உள்ளது; மாற்றுப் புரிதல் மறைக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தகனபலி’, ‘பலிபீடம்’, ‘சந்திப்புக் கூடாரம்’ போன்ற பரவலாக அறியப்படும் வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. முதன்மை உரையில் வரும் ஒவ்வொரு அடிக்குறிப்புக் குறிப்பும் உரையோடு இணைக்கப்பட வேண்டும்.
