base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/007.yaml
  text: That night God appeared to Solomon and said to him[a], “Ask what I should give you.”
translation:
  language: ta
  text: அந்த இரவில் கடவுள் சாலொமோனுக்குத் தோன்றி, “நான் உனக்கு என்ன கொடுக்க வேண்டும் என்று கேள்” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சொல்லுக்கு இன்னும் நெருக்கமாக: “நான் உனக்கு என்ன கொடுப்பேன் என்று கேள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: அந்த இரவில்
  rationale: எபிரெயச் சொற்றொடரின் காலக் குறிப்பை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: נִרְאָה
  choice: தோன்றி
  rationale: נפעל வடிவம் இங்குள்ள இறைத்தோற்றச் சூழலில் ‘தோன்றினார்’ என்ற பொருளைக் கொடுக்கிறது; ‘காணப்பட்டார்’ என்பது தமிழில் செயற்கையாக இருக்கும்.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: சொல் வடிவத்தில் பன்மையாக இருந்தாலும், ஒருமை வினையோடும் சூழலிலும் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது.
- source_word: לִשְׁלֹמֹה
  choice: சாலொமோனுக்கு
  rationale: ל முன்னொட்டு தோற்றத்தின் தொடர்புப் பெறுநரைக் குறிக்கிறது; தமிழில் நான்காம் வேற்றுமை இயல்பானது.
- source_word: וַיֹּאמֶר לוֹ
  choice: என்றார்
  rationale: தமிழ் மேற்கோள் அமைப்பில் ‘அவனிடம் கூறினார்’ என்பதைக் காட்டிலும் சுருக்கமாகவும் இயல்பாகவும் உள்ளது; மரியாதைப் பன்மை கடவுளைக் குறிக்கும் வழக்கமான தமிழ்நடையைப் பேணுகிறது.
- source_word: שְׁאַל
  choice: கேள்
  rationale: நேரடியான ஒருமை கட்டளையை எளிய, இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מָה אֶתֶּן לָךְ
  choice: நான் உனக்கு என்ன கொடுக்க வேண்டும் என்று
  rationale: சொல்லுக்கு நெருக்கமான ‘நான் உனக்கு என்ன கொடுப்பேன்?’ என்ற கேள்வியின் பொருளை, ‘கேள்’ என்பதுடன் இயல்பாக இணையும் மறைமுகக் கேள்வியாகத் தருகிறது; எபிரெயத்தின் திறந்த அழைப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: இறைத்தோற்றச் சூழலில் אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: தெய்வங்கள்
  rationale: ஒருமை வினை ஒத்திசைவும் கதைச் சூழலும் ஒருமைச் சுட்டுதலைத் தெளிவாக்குகின்றன; ‘கடவுள்’ என்பது கூடுதல் கோட்பாட்டுக் கருத்துகளைப் புகுத்தாமல் உரையின் சுட்டுதலைப் பிரதிபலிக்கிறது.
- issue: מָה אֶתֶּן לָךְ என்பதிலுள்ள எதிர்கால/விருப்ப நுணுக்கம்
  choice: நான் உனக்கு என்ன கொடுக்க வேண்டும்
  alternative: நான் உனக்கு என்ன கொடுப்பேன்
  rationale: முதன்மை உரை நவீன தமிழில் கட்டளையைத் தொடர்ந்து இயல்பாகப் படிக்கிறது; சொல்லுக்கு நெருக்கமான எதிர்கால வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்/உமக்கு’ என்ற உயர்திணை வடிவத்திற்குப் பதிலாக, எபிரெய ஒருமை உரையாடலைத் தெளிவாகக் காட்ட ‘நீ/உனக்கு’ பயன்படுத்தப்பட்டுள்ளது. அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
