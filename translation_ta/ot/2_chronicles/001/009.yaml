source:
  edition: WLC
  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
translation:
  language: ta
  text: இப்போது, யாவே தேவனே, என் தந்தையாகிய தாவீதுக்கு நீர் சொன்ன வார்த்தை உறுதிப்படுவதாக[a]. ஏனெனில், பூமியின் தூளைப்போல் ஏராளமான மக்கள்மேல் நீர் என்னை அரசனாக்கியிருக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தந்தையாகிய தாவீதுக்கு நீர் அளித்த வாக்குறுதி நிலைநிறுத்தப்படுவதாக.”
    reason: ‘வார்த்தை’ என்பது இச்சூழலில் வாக்குறுதியைக் குறிக்கலாம்; יֵאָמֵן என்பதையும் ‘நிலைநிறுத்தப்படுவதாக’ என மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: சாலொமோனின் வேண்டுதலை அறிமுகப்படுத்தும் காலம் மற்றும் உரைநடைச் சுட்டியாக உள்ள எபிரெயச் சொல்லை இயல்பாகத் தருகிறது.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவனே
  rationale: יְהוָה என்ற இறைபெயரை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהִים என்பதை அழைப்புவடிவில் ‘தேவனே’ என வழங்குகிறது.
- source_word: יֵאָמֵן
  choice: உறுதிப்படுவதாக
  rationale: אמן என்பதன் நிஃபால் வடிவம் இங்கு இறைவனின் வார்த்தை உறுதியாக நிலைநிறுத்தப்பட வேண்டும் என்ற விருப்பத்தை வெளிப்படுத்துகிறது; தமிழ் வேண்டுதல் நடைக்கு ‘உறுதிப்படுவதாக’ பொருந்துகிறது.
- source_word: דְּבָרְךָ
  choice: நீர் சொன்ன வார்த்தை
  rationale: எபிரெய மூலத்தின் ‘உமது வார்த்தை’ என்ற நேரடிப் பொருளைப் பாதுகாக்கிறது; தமிழில் அது தாவீதிடம் சொல்லப்பட்ட வார்த்தை என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: עִם דָּוִיד אָבִי
  choice: என் தந்தையாகிய தாவீதுக்கு
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’ என்றாலும், דָּבָר உடன் வரும் இச்சூழலில் ஒருவரிடம் சொல்லப்பட்ட வார்த்தையைக் குறிக்கும் மொழிமரபை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சாலொமோனின் வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הִמְלַכְתַּנִי
  choice: நீர் என்னை அரசனாக்கியிருக்கிறீர்
  rationale: מלך என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளான ‘என்னை அரசனாக்கினீர்’ என்பதை இயல்பான மரியாதைத் தமிழில் தருகிறது.
- source_word: עַל עַם רַב
  choice: ஏராளமான மக்கள்மேல்
  rationale: ரַב என்பதற்கு ‘பெரிய’ என்றும் ‘ஏராளமான’ என்றும் பொருள் உண்டு; தொடர்ந்து வரும் தூள் உவமை எண்ணிக்கையை வலியுறுத்துவதால் ‘ஏராளமான’ என்பது சூழலுக்குப் பொருத்தமானது.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: பூமியின் தூளைப்போல்
  rationale: எண்ணிலடங்காத பெருந்தொகையைக் குறிக்கும் வழக்கமான எபிரெய உவமையை அதன் உருவகத்துடன் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை எவ்வாறு வழங்குவது
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்து இறைபெயரை நேரடியாகப் பயன்படுத்துவதால், பொதுப்பட்டமாக மாற்றாமல் உடன்படிக்கையின் தனிப்பெயரை ஒலிபெயர்க்கிறது.
- issue: דְּבָרְךָ என்பதை ‘வாக்குறுதி’ என்று வெளிப்படையாக்க வேண்டுமா
  choice: நீர் சொன்ன வார்த்தை
  alternative: நீர் அளித்த வாக்குறுதி
  rationale: சூழலில் இது தாவீதுக்குக் கொடுக்கப்பட்ட வாக்குறுதியைக் குறித்தாலும், எபிரெயச் சொல் நேரடியாக ‘வார்த்தை’ என்பதால் முதன்மை உரை அந்தப் பரந்த சொல்லாட்சியைப் பாதுகாக்கிறது; வாக்குறுதி என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ஜெபத்தின் அழைப்பும் வேண்டுதலும் மரியாதைப் பன்மை வினைமுற்றுகளால் இயல்பாக வழங்கப்பட்டுள்ளன; எபிரெய மூலத்தின் இறைபெயர், காரணவினை, தூள் உவமை ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
