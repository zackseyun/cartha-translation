source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁלֹמֹה֙ לֵֽ/אלֹהִ֔ים אַתָּ֗ה עָשִׂ֛יתָ עִם דָּוִ֥יד אָבִ֖/י חֶ֣סֶד גָּד֑וֹל וְ/הִמְלַכְתַּ֖/נִי תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
translation:
  language: ta
  text: சாலொமோன் கடவுளிடம், “நீர் என் தந்தை தாவீதுக்கு மிகுந்த உடன்படிக்கை அன்பைக் காட்டி[a], அவருடைய இடத்தில் என்னை அரசனாக்கியிருக்கிறீர்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தந்தை தாவீதுக்கு மிகுந்த இரக்கத்தைக் காட்டி” அல்லது “மிகுந்த நிலையான அன்பைக் காட்டி.” எபிரெயச் சொல் חֶסֶד உண்மையுள்ள, நிலையான, உடன்படிக்கைசார் அன்பு அல்லது பற்றுறுதியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: வாவ் தொடர்வினை கதைநடையை முன்னெடுக்கிறது. தமிழில் மேற்கோளின் முடிவில் ‘என்றான்’ என்பது இயல்பான கதைநடை வடிவம்.
- source_word: לֵאלֹהִים
  choice: கடவுளிடம்
  rationale: சாலொமோன் ஒரே மெய்க் கடவுளை நேரடியாக நோக்கிப் பேசுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עָשִׂיתָ עִם ... חֶסֶד גָּדוֹל
  choice: மாபெரும் உடன்படிக்கைப் பேரன்பைக் காட்டி
  rationale: עשה עם + חֶסֶד என்ற சொல்லிணைப்பு ஒருவரிடம் உண்மையுடனும் நிலைத்த அன்புடனும் செயல்படுவதைக் குறிக்கிறது. தாவீதுடனான உறவின் சூழலில் ‘உடன்படிக்கைப் பேரன்பு’ அதன் உறவுசார் மற்றும் உடன்படிக்கைசார் நிறையைத் தக்கவைக்கிறது; ‘மாபெரும்’ என்பது גָּדוֹל என்பதைக் காட்டுகிறது.
- source_word: דָּוִיד אָבִי
  choice: என் தந்தை தாவீது
  rationale: நவீனத் தமிழில் இயல்பான பெயர்ச்சொல் வரிசையைப் பயன்படுத்துகிறது; எபிரெய உரையின் உறவைக் குறிக்கும் பொருள் முழுமையாகத் தக்கவைக்கப்படுகிறது.
- source_word: וְהִמְלַכְתַּנִי
  choice: என்னை அரசனாக்கியிருக்கிறீர்
  rationale: מלך என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும், சாலொமோனை அரசனாக்கிய கடவுளின் செயற்பாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: תַּחְתָּיו
  choice: அவருக்குப் பதிலாக
  rationale: அரச மரபுரிமைச் சூழலில் ‘அவருடைய இடத்தில்’ அல்லது ‘அவருக்குப் பின்’ என்ற பொருளைக் கொண்டது. ‘அவருக்குப் பதிலாக’ என்பது வலுக்கட்டாய அகற்றலைக் குறிக்காமல் அரசப் பதவியின் தொடர்ச்சியை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: உடன்படிக்கைப் பேரன்பு
  alternative: மாபெரும் இரக்கம்; மாபெரும் நிலையான அன்பு; மாபெரும் உண்மைத்தன்மை
  rationale: חֶסֶד என்பது பொதுவான இரக்கத்தை மட்டும் அல்லாமல் உறுதியான, விசுவாசமுள்ள உறவுசார் அன்பையும் குறிக்கலாம். தாவீதைக் குறித்த இச்சூழலில் உடன்படிக்கை பரிமாணம் பொருத்தமானது; அதேவேளை மாற்று மொழிபெயர்ப்புகள் அடிக்குறிப்பில் தரப்பட்டு சொல்லின் பொருள் அகலம் பாதுகாக்கப்படுகிறது.
- issue: அரச வாரிசுரிமையும் கடவுளின் செயற்பாடும்
  choice: அவருக்குப் பதிலாக என்னை அரசனாக்கியிருக்கிறீர்
  alternative: அவருக்குப் பின் என்னை ஆட்சி செய்ய வைத்திருக்கிறீர்
  rationale: காரணவினையைத் தக்கவைத்து, சாலொமோன் அரசனானதில் கடவுளின் செயலை நேரடியாகக் கூறுகிறது; இதற்கு அப்பாற்பட்ட கோட்பாட்டுக் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமையான ‘நீர்/இருக்கிறீர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘உடன்படிக்கைப் பேரன்பு’ மூலச்சொல்லின் இறையியல் மற்றும் உறவுசார் நிறையைத் தக்கவைக்கிறது; அதன் இயல்பான மாற்றுகள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளன.
