source:
  edition: WLC
  text: וְ/קוֹרֵ֨א בֶן יִמְנָ֤ה הַ/לֵּוִי֙ הַ/שּׁוֹעֵ֣ר לַ/מִּזְרָ֔חָ/ה עַ֖ל נִדְב֣וֹת הָ/אֱלֹהִ֑ים לָ/תֵת֙ תְּרוּמַ֣ת יְהוָ֔ה וְ/קָדְשֵׁ֖י הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
translation:
  language: ta
  text: இம்னாவின் மகனான கோரே என்ற லேவியர், கிழக்குப் பக்க வாயிற்காவலராக, கடவுளுக்கான தன்னார்வக் காணிக்கைகளின் பொறுப்பில் இருந்தார்; யாவேக்குரிய பங்களிப்பையும் மிகப் பரிசுத்தமான பொருட்களையும்[b] பகிர்ந்தளிப்பதற்காக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “கொடுப்பதற்கு.” இங்கு அர்ப்பணிக்கப்பட்டவற்றை உரியவர்களுக்குப் பகிர்ந்தளிப்பது என்று பொருள்.'
    reason: lexical_alternative
  - marker: b
    text: “மிகப் பரிசுத்தமான காணிக்கைகள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் சிறப்பாகப் பரிசுத்தமாக்கப்பட்ட பொருட்களைக் குறிக்கிறது; அது அவசியமாக ஆலயத்தின் “மகா பரிசுத்த ஸ்தலத்தை” குறிக்காது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹרֵא בֶן יִמְנָה
  choice: இம்னாவின் மகனான கோரே
  rationale: பெயர்களைத் தமிழில் இயல்பாக ஒலிபெயர்த்து, எபிரெய மரபுவழி உறவைத் தெளிவாகக் காக்கிறது; தொடக்க இணைப்புச்சொல் தமிழில் தனியாகத் தேவைப்படவில்லை.
- source_word: הַלֵּוִי
  choice: லேவியர்
  rationale: கோரேயின் கோத்திர மற்றும் ஆலயப் பணியாளர் அடையாளத்தைக் குறிக்கிறது; மனிதரைக் குறிப்பிடும் மரியாதை ஒருமை நவீன தமிழுக்கு இயல்பானது.
- source_word: הַשּׁוֹעֵר לַמִּזְרָחָה
  choice: கிழக்குப் பக்க வாயிற்காவலர்
  rationale: கிழக்குப் பகுதியில் பணியாற்றிய வாயிற்காவலர் என்ற பொருளைத் தெளிவாகத் தருகிறது; மூலத்தில் தனியாக ‘வாசல்’ குறிப்பிடப்படாததால் ‘கிழக்கு வாசல்’ என மிகையாக விரித்துரைக்கவில்லை.
- source_word: עַל
  choice: பொறுப்பாயிருந்தார்
  rationale: இங்கு இடநிலையை அல்ல, காணிக்கைகள் மீதான நிர்வாகப் பொறுப்பைக் குறிக்கிறது.
- source_word: נִדְבוֹת הָאֱלֹהִים
  choice: கடவுளுக்கான தன்னார்வக் காணிக்கைகள்
  rationale: נִדְבוֹת என்பதன் விருப்பத்துடன் அளிக்கப்படும் காணிக்கைகள் என்ற பொருளையும், அவை கடவுளுக்கு அர்ப்பணிக்கப்பட்டவை என்ற சூழல்சார் உறவையும் இயல்பான தமிழில் தருகிறது.
- source_word: לָתֵת
  choice: பகிர்ந்தளிப்பதற்காக
  rationale: சொல்லுக்குச் சொல் பொருள் ‘கொடுப்பதற்கு’; இங்கு அர்ப்பணிக்கப்பட்டவற்றை உரியவர்களுக்குக் கொடுத்து வழங்கும் நிர்வாகச் சூழலில் ‘பகிர்ந்தளித்தல்’ பொருத்தமானது. நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: תְּרוּמַת יְהוָה
  choice: யாவேக்குரிய பங்களிப்பு
  rationale: תְּרוּמָה என்பது பிரித்துவைக்கப்பட்ட பங்கு அல்லது பங்களிப்பு. எபிரெய இணைப்புத் தொடரின் உறவை ‘யாவேக்குரிய’ எனக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகத் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: மிகப் பரிசுத்தமான பொருட்கள்
  rationale: எபிரெயச் சொல்லமைப்பின் உயர்நிலைப் பரிசுத்தத்தைக் காட்டுகிறது; இச்சூழலில் உள்ளகத் திருத்தலமான ‘மகா பரிசுத்த ஸ்தலம்’ என்று தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்புக்கு ஏற்ப தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைக் காக்கிறது.
- issue: קָדְשֵׁי הַקֳּדָשִׁים என்பதன் குறிப்பு
  choice: மிகப் பரிசுத்தமான பொருட்கள்
  alternative: மிகப் பரிசுத்தமான காணிக்கைகள் / மகா பரிசுத்த ஸ்தலம்
  rationale: இலக்கண வடிவம் மிக உயர்ந்த பரிசுத்தமுள்ள பொருட்களைக் குறிக்கிறது; சூழல் அவற்றை காணிக்கைகள் எனப் புரிந்துகொள்ள இடமளித்தாலும், மூலத்தில் அதற்கான பெயர்ச்சொல் வெளிப்படையாக இல்லை. அது ஆலயத்தின் உள்ளகத் திருத்தலத்தைக் குறிப்பதல்ல.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஆலய நிர்வாகச் சூழலைச் சாதாரண வாசகருக்குத் தெளிவாக்கும் வகையில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘பங்களிப்பு’, ‘தன்னார்வக் காணிக்கை’, ‘வாயிற்காவலர்’ ஆகியவை மூலத்தின் வழிபாட்டு மற்றும் நிர்வாகப் பொருளை இயல்பாகக் காக்கின்றன. மூலத்தின் ஒரே தொடரை தமிழில் வாசிப்புக்கு ஏற்ற இரண்டு வாக்கியங்களாக அமைத்தாலும், கருத்துறவுகள் காக்கப்பட்டுள்ளன.
