base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
translation:
  language: ta
  text: ஆசாரியர்களான ஆரோனின் மக்களுக்கும்[a], அவர்களுடைய பட்டணங்களைச் சுற்றியிருந்த மேய்ச்சல் நிலங்களில்[b], ஒவ்வொரு பட்டணத்திலும்[c], பெயர் குறிப்பிட்டு அடையாளப்படுத்தப்பட்ட[d] ஆட்கள் இருந்தார்கள். அவர்கள் ஆசாரியர்களில் உள்ள ஆண்கள் அனைவருக்கும், லேவியர்களில் வம்சாவளிப் பதிவில் சேர்க்கப்பட்டிருந்த[e] அனைவருக்கும் பங்குகளைக் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆசாரியர்களான ஆரோனின் சந்ததியினருக்கும்.’ எபிரெய மொழியில் நேரடியாக ‘ஆரோனின் மக்களுக்கும்’ என்று உள்ளது; இந்த வம்சவழிச் சொற்றொடர் பிற்காலச் சந்ததியினரையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுடைய பட்டணங்களின் பொது நிலங்களில்’ அல்லது ‘திறந்த வெளி நிலங்களில்.’ இச்சொல் பட்டணங்களைச் சுற்றியிருந்த, பொதுவாக மேய்ச்சலுக்குப் பயன்படுத்தப்பட்ட நிலத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: எபிரெய மொழியில் ‘ஒவ்வொரு பட்டணமும் பட்டணமும்’ என்று உள்ளது; இது எந்தப் பட்டணத்தையும் விடாமல் அனைத்தையும் குறிக்கும் சொல்வழக்கு.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, ‘பெயரால் குறிப்பிடப்பட்ட’ அல்லது ‘பெயர்ப் பட்டியலில் சேர்க்கப்பட்ட.’ இவர்கள் அதிகாரபூர்வமாகப் பெயர் குறிப்பிட்டு அடையாளப்படுத்தப்பட்டவர்கள் என்பதை எபிரெய சொற்றொடர் காட்டுகிறது.
    reason: lexical_alternative
  - marker: e
    text: அதாவது, லேவியர்களின் வம்சாவளிப் பதிவுகளில் பெயர் சேர்க்கப்பட்டவர்கள்.
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: ஆசாரியர்களான ஆரோனின் மக்களுக்கும்
  rationale: בני என்பதன் நேரடியான வடிவமான ‘மக்கள்’ என்பதையும், הַכֹּהֲנִים என்பதன் விளக்க உறவையும் காக்கிறது; இச்சூழலில் பிற்கால சந்ததியினரையும் குறிக்கலாம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  choice: அவர்களுடைய பட்டணங்களைச் சுற்றியிருந்த மேய்ச்சல் நிலங்களில்
  rationale: מגרש என்பது பட்டணங்களைச் சுற்றியிருந்த திறந்த பொதுநிலத்தை, குறிப்பாக மேய்ச்சலுக்குப் பயன்பட்ட நிலத்தை, குறிக்கிறது; நவீனத் தமிழில் இடவமைப்பையும் பயன்பாட்டையும் தெளிவாகத் தெரிவிக்கிறது.
- source_word: בְּכָל עִיר וָעִיר
  choice: ஒவ்வொரு பட்டணத்திலும்
  rationale: ‘பட்டணம் பட்டணமாக’ என்ற எபிரெய விநியோக இரட்டிப்பின் முழுமையான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: பெயரால் நியமிக்கப்பட்ட ஆட்கள்
  rationale: பெயர் குறிப்பிட்டு அதிகாரபூர்வமாக அடையாளப்படுத்தப்பட்ட அல்லது பொறுப்பில் அமர்த்தப்பட்ட நிர்வாகப் பொருளை வெளிப்படுத்துகிறது; ‘பட்டியலிடப்பட்ட’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் ambiguity காக்கப்படுகிறது.
- source_word: לָתֵת מָנוֹת
  choice: பங்குகளைக் கொடுத்தார்கள்
  rationale: מנות என்பது வழங்கப்படும் ஒதுக்கீட்டுப் பங்குகளைக் குறிக்கிறது; அத்தியாயத்தின் உணவுப் பொருள் பகிர்வு சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  choice: ஆசாரியர்களில் ஆண்கள் அனைவருக்கும்
  rationale: זכר என்பதன் பாலினக் குறிப்பை ‘ஆண்கள்’ என்று துல்லியமாகக் காத்து, ב என்ற பகுதிப்பொருளை ‘ஆசாரியர்களில்’ என வழங்குகிறது.
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  choice: லேவியர்களில் வம்சாவளிப் பதிவில் சேர்க்கப்பட்டிருந்த அனைவருக்கும்
  rationale: התיחש என்பது வம்சாவளியின் அடிப்படையில் பதிவு செய்யப்படுதலைக் குறிக்கிறது; நிர்வாக மற்றும் வம்சவழிப் பொருள் இரண்டையும் தெளிவாகக் காக்கிறது.
