base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
translation:
  language: ta
  text: யெகியேல், அசசியா, நாகாத், ஆசகேல், யெரிமோத், யோசபாத், எலியேல், யிஸ்மகியா, மாகாத், பெனாயா ஆகியோர் கோனனியாவினதும் அவனுடைய சகோதரன் சிமெயியினதும் அதிகாரத்தின்கீழ்[a] பணியாற்றிய அதிகாரிகள். இவர்கள் எசேக்கியா அரசனும் தேவனுடைய ஆலயத்தின் தலைமை அதிகாரியான அசரியாவும் செய்த நியமனத்தின்படி[b] பணியாற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “கோனனியாவினதும் அவனுடைய சகோதரன் சிமெயியினதும் கையின்கீழ்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது “கட்டளையின்படி”; அல்லது “மேற்பார்வையின்கீழ்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  choice: அதிகாரிகள்
  rationale: நியமிக்கப்பட்டு நிர்வாகப் பொறுப்பை வகிப்பவர்களைக் குறிக்கும் சொல். ஆலய நிர்வாகச் சூழலில் பதவியின் நிலையை மிகைப்படுத்தாமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִיַּד
  choice: அதிகாரத்தின்கீழ்
  rationale: சொல்லுக்குச் சொல் ‘கையின்கீழ்/கையிலிருந்து’ என்றாலும், இங்கு கட்டுப்பாடு அல்லது மேற்பார்வையின்கீழ் இருப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: בְּמִפְקַד
  choice: செய்த நியமனத்தின்படி
  rationale: நியமனம், கட்டளை அல்லது மேற்பார்வை என்ற பொருள் வாய்ப்புகள் உள்ளன. இங்கு நிர்வாக அதிகாரிகள் பற்றிய சூழலில் முறையான நியமனத்தை முதன்மைப் பொருளாகக் கொள்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: נְגִיד
  choice: தலைமை அதிகாரி
  rationale: ஒரு தலைவர் அல்லது முதன்மைப் பொறுப்பாளர் என்று பொருள்படும். ஆலய நிர்வாகச் சூழலில் ‘தலைமை அதிகாரி’ தெளிவாகவும் மிகைப்படுத்தாமலும் உள்ளது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயம்
  rationale: சொல்லுக்குச் சொல் ‘தேவனுடைய வீடு/இல்லம்’; இங்கு ஆலயத்தைக் குறிக்கும் நிலையான எபிரெயச் சொற்றொடர் என்பதால் நவீனத் தமிழில் தெளிவான ‘ஆலயம்’ பயன்படுத்தப்படுகிறது.
- source_word: אָחִיו
  choice: அவனுடைய சகோதரன்
  rationale: சிமெயி கோனனியாவின் உடன்பிறந்த சகோதரன் எனும் நேரடியான உறவுமுறையைப் பாதுகாக்கிறது.
- source_word: Proper names
  choice: யெகியேல், அசசியா, நாகாத், அசகேல், யெரிமோத், யோசபாத், எலியேல், யிஸ்மகியா, மாகாத், பெனாயா, கோனனியா, சிமெயி, எசேக்கியா, அசரியா
  rationale: எபிரெயப் பெயர்களின் ஒலிப்பை அணுகும் வகையிலும், தமிழில் பரவலாக அறியப்பட்ட வேதாகமப் பெயர் வடிவங்களை இயன்றவரை பின்பற்றும் வகையிலும் ஒலிபெயர்க்கப்பட்டுள்ளன.
theological_decisions:
- issue: ஆலய நிர்வாகப் பதவிகளின் தன்மை
  choice: சாதாரண நிர்வாக மொழியில் ‘அதிகாரிகள்’ மற்றும் ‘தலைமை அதிகாரி’ என்று மொழிபெயர்த்தல்
  alternative: ‘ஆளுநர்கள்’, ‘பிரபுக்கள்’ அல்லது ஆசாரியப் படிநிலையை உணர்த்தும் உயர்நிலைப் பட்டங்களைப் பயன்படுத்துதல்
  rationale: வசனம் நிர்வாகப் பொறுப்பாளர்களையும் அவர்களுடைய அதிகாரத் தொடர்பையும் பட்டியலிடுகிறது. எபிரெய உரை கூறுவதைவிட உயர்ந்த அரசியல் அல்லது சமயப் பதவியை மொழிபெயர்ப்பு சுமத்தக்கூடாது.
- issue: בְּמִפְקַד என்பதன் நிர்வாகப் பொருள்
  choice: ‘நியமனத்தின்படி’ என்பதை முதன்மை வாசகமாகக் கொள்ளுதல்
  alternative: ‘கட்டளையின்படி’ அல்லது ‘மேற்பார்வையின்கீழ்’
  rationale: சொல் முறையான நியமனம், கட்டளை, கண்காணிப்பு ஆகிய பொருள்களைத் தாங்கக்கூடும். சூழலுக்கு ஏற்ற முதன்மைத் தெரிவை உரையில் கொடுத்து, உண்மையான பொருள் நெகிழ்வை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் கண்ணியமான நிர்வாக நடையில் அமைக்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; பெயர்ப்பட்டியலும் அதிகாரத் தொடர்பும் அசல் வரிசையில் பாதுகாக்கப்பட்டுள்ளன.
