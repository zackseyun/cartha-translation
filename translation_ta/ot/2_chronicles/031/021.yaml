base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
translation:
  language: ta
  text: கடவுளின் ஆலயப் பணியிலும், திருச்சட்டத்திலும்[a], கட்டளையிலும், தம் கடவுளைத் தேடுவதற்காக[b] அவர் தொடங்கிய ஒவ்வொரு செயலையும் முழு இருதயத்தோடு செய்து வெற்றி பெற்றார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“திருச்சட்டம்” என்பதற்குப் பதிலாக “போதனை” என்றும் மொழிபெயர்க்கலாம் (எபிரெயம்: தோரா).'
    reason: lexical_alternative
  - marker: b
    text: “தம் கடவுளிடம் விசாரிப்பதற்காக” என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெய வினைச்சொல் தேடுதல், விசாரித்தல் ஆகிய இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: “செழிப்படைந்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה אֲשֶׁר הֵחֵל
  choice: தொடங்கிய ஒவ்வொரு செயலையும்
  rationale: מַעֲשֶׂה என்பது செயல், பணி, நடவடிக்கை ஆகிய பரந்த பொருள்களைக் கொண்டது; தொடங்கியதைச் செய்தார் என்ற எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: கடவுளின் ஆலயப் பணி
  rationale: עֲבוֹדָה என்பது பணி அல்லது வழிபாட்டுச் சேவை எனப் பொருள்படலாம். இங்கு ஆலயம் சார்ந்த பணிகளைப் பரந்த வகையில் குறிக்கிறது.
- source_word: וּבַתּוֹרָה
  choice: திருச்சட்டம்
  rationale: תּוֹרָה என்பதன் சட்டம் சார்ந்த பொருள் எசேக்கியாவின் சீர்திருத்தச் சூழலுக்கு ஏற்றது; ‘போதனை’ என்ற பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וּבַמִּצְוָה
  choice: கட்டளை
  rationale: எபிரெய மூலத்தில் உள்ள ஒருமை வடிவம் தமிழிலும் தக்கவைக்கப்பட்டுள்ளது; இது தொகுப்புப் பொருளிலும் இயங்கலாம்.
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  choice: தம் கடவுளைத் தேடுவதற்காக
  rationale: דָּרַשׁ என்பது தேடுதல் அல்லது விசாரித்தல் எனப் பொருள்படும். நாளாகமத்தில் கடவுளை மனப்பூர்வமாக நாடும் முக்கிய கருத்தை ‘தேடுதல்’ காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּכָל לְבָבוֹ
  choice: முழு இருதயத்தோடு
  rationale: முழுமையான உள்ளார்ந்த அர்ப்பணிப்பைக் குறிக்கும் எபிரெய மரபுத்தொடருக்கு கண்ணியமான, பரிச்சயமான தமிழ் இணை.
- source_word: עָשָׂה וְהִצְלִיחַ
  choice: செய்தார்; வெற்றியும் பெற்றார்
  rationale: இரு எபிரெய வினைகளையும் தனித்தனியாகக் காக்கிறது. הצליח என்பதன் இச்சூழலுக்குரிய இயல்பான தமிழ் ‘வெற்றி பெற்றார்’; ‘செழிப்படைந்தார்’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: תּוֹרָה என்பதன் பொருள்
  choice: திருச்சட்டம்
  alternative: போதனை
  rationale: அரசரின் ஆலயச் சீர்திருத்தமும் உடன்படிக்கை கீழ்ப்படிதலும் சார்ந்த சூழலில் ‘திருச்சட்டம்’ முதன்மைப் பொருளைத் தெளிவாகத் தருகிறது; சொல்லின் விரிவான போதனைப் பொருளை அடிக்குறிப்பு காக்கிறது.
- issue: לִדְרֹשׁ אֱלֹהִים என்பதன் கருத்து
  choice: கடவுளைத் தேடுதல்
  alternative: கடவுளிடம் விசாரித்தல்
  rationale: நாளாகமத்தில் இது தகவல் கேட்பதை மட்டும் அல்லாமல் கடவுளை மனப்பூர்வமாக நாடுவதையும் குறிக்கிறது. இருந்தாலும் விசாரித்தல் என்ற உண்மையான பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: בְּכָל לְבָבוֹ எதனுடன் இணைகிறது
  choice: ‘செய்தார்’ என்பதுடன் இணைக்கப்பட்டது
  alternative: ‘கடவுளைத் தேடுதல்’ என்பதுடன் இணைத்தல்
  rationale: மசோரா உச்சரிப்புக் குறியீட்டில் לֵאלֹהָיו என்பதற்குப் பின் முக்கிய இடைநிறுத்தம் இருப்பதால், ‘முழு இருதயத்தோடு’ என்பது அடுத்துள்ள ‘செய்தார்’ என்பதுடன் இயல்பாக இணைகிறது. பொருளில் கடவுளைத் தேடும் அர்ப்பணிப்பும் முற்றிலும் விலக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘தம்’, ‘இருதயம்’, ‘திருச்சட்டம்’ ஆகியவை மரியாதை மற்றும் வேதாகமப் பதிவேட்டின் நயத்தைக் காக்கின்றன.
