translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘குவியல்கள்’ என்ற சொல் மூலத்தின் கண்கூடான உருவகத்தைப் பாதுகாக்கிறது; எபிரெய மொழியின் சுருக்கமான ‘குவியல்களை அடித்தளமிடுதல்’ என்ற அமைப்பு இயல்பான தமிழுக்காக முதன்மை உரையில் தெளிவாக்கப்பட்டு, அதன் நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
