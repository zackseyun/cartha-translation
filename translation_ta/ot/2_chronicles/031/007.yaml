  yaml_path: translation/ot/2_chronicles/031/007.yaml
  text: In the third month they began to lay the foundation of the heaps[b][a], and in the seventh month they finished them.
translation:
  language: ta
  text: மூன்றாம் மாதத்தில் அவர்கள் குவியல்களை அடுக்கத் தொடங்கினார்கள்[a]; ஏழாம் மாதத்தில் அவற்றை அடுக்கி முடித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “குவியல்களை அடிப்பகுதியிலிருந்து அமைக்கத் தொடங்கினார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִשִׁי
  choice: மூன்றாம் மாதத்தில்
  rationale: காலக் குறிப்பில் חֹדֶשׁ என்பதன் இயல்பான பொருள் ‘மாதம்’; முன்னொட்டு ב இடப்பொருளில் ‘-இல்’ என வழங்கப்பட்டுள்ளது.
- source_word: הֵחֵלּוּ
  choice: தொடங்கினார்கள்
  rationale: இந்த அமைப்பில் வினைச்சொல் ‘தொடங்கு’ எனப் பொருள்படுகிறது; பன்மை எழுவாய்க்கேற்ற இயல்பான தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָעֲרֵמוֹת
  choice: குவியல்கள்
  rationale: עֲרֵמוֹת என்பது சூழலில் காணிக்கையாகக் கொண்டுவரப்பட்ட விளைபொருட்களின் திரண்ட குவியல்களைக் குறிக்கிறது; ‘குவியல்கள்’ அதன் தெளிவான காட்சியுருவைப் பாதுகாக்கிறது.
- source_word: לְיִסּוֹד
  choice: அடித்தளம் அமைக்க
  rationale: יסד என்ற infinitive construct, குவியல்களை அவற்றின் அடிப்பகுதியிலிருந்து தொடங்கிய செயலைக் குறிக்கிறது. ‘அடித்தளம் அமைக்கத் தொடங்கினார்கள்’ என்பது எபிரெயச் சொல்லமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதத்தில்
  rationale: ו தொடர்ச்சியைக் காட்டுகிறது; தமிழில் அரைப்புள்ளிக்குப் பின் வரும் காலக்குறிப்பே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּלּוּ
  choice: அவற்றை முடித்தார்கள்
  rationale: כלה என்ற வினை ‘முடி/நிறைவு செய்’ எனப் பொருள்படும். எபிரெயத்தில் மறைந்துள்ள செயப்படுபொருள், முன் குறிப்பிடப்பட்ட குவியல்களைக் குறிக்கும் ‘அவற்றை’ என்று தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
