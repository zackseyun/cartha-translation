base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/020.yaml
  text: Hezekiah did this throughout all Judah[a], and he did what was good and right and true before Yahweh his God.
translation:
  language: ta
  text: எசேக்கியா யூதா முழுவதிலும் இவ்வாறு செய்தான். அவன் தன் கடவுளான யாவேக்கு முன்பாக நல்லதையும் சரியானதையும் உண்மையானதையும்[a] செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையுள்ளதையும்” அல்லது “நம்பிக்கைக்குரியதையும்.” இங்குள்ள எபிரேயச் சொல் உண்மை, நம்பகத்தன்மை அல்லது உண்மையுள்ள நடத்தை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  choice: இவ்வாறு செய்தான்
  rationale: முன்னர் விவரிக்கப்பட்ட சீர்திருத்தங்களையும் ஏற்பாடுகளையும் சுருக்கமாகச் சுட்டும் எபிரெயச் சொற்றொடரின் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּכָל יְהוּדָה
  choice: யூதா முழுவதிலும்
  rationale: முழு யூதா பிரதேசத்தையும் உள்ளடக்கும் செயலின் பரப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַטּוֹב
  choice: நன்மையானதையும்
  rationale: குறிப்பிட்ட உருபுடன் பெயர்ச்சொல் தன்மையில் வரும் சொல்லை, ‘நன்மையானதை’ செய்தான் என்ற ஒழுக்கப் பொருளில் வழங்குகிறது.
- source_word: הַיָּשָׁר
  choice: நேர்மையானதையும்
  rationale: இச்சூழலில் உள்ள ஒழுக்கரீதியான சரியான அல்லது செம்மையான நடத்தையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאֱמֶת
  choice: உண்மையானதையும்
  rationale: אֱמֶת என்பதன் நேரடியான ‘உண்மை’ பொருளைப் பாதுகாக்கிறது; அதேவேளையில் அதன் ‘உண்மைத்தன்மை, நம்பகத்தன்மை, உண்மையுள்ள நடத்தை’ ஆகிய சாத்தியமான நிழற்பொருள்களை அடிக்குறிப்பில் திறந்துவைக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: கடவுளின் முன்னிலையிலும் அவரது மதிப்பீட்டின்படியும் செய்யப்பட்ட செயல் என்ற தொடர்பியல் மற்றும் மதிப்பீட்டுப் பொருளைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்திலுள்ள கடவுளின் தனிப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהָיו
  choice: தன் கடவுளாகிய
  rationale: எசேக்கியாவைக் குறிக்கும் ஒருமை ஆண்பால் உடைமை உறவையும், ‘யாவே’ என்பதுடன் அதன் இயல்பான தமிழ் இணைப்பையும் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் நான்கெழுத்து இறைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டத்தால் மாற்றாமல் பரவலாக ஏற்றுக்கொள்ளப்படும் ஒலிப்புக்கு ஏற்ப ‘யாவே’ என்று வழங்குகிறது.
- issue: הָאֱמֶת என்பதன் ஒழுக்கப் பொருள்
  choice: உண்மையானதையும்
  alternative: உண்மையுள்ளதையும் / நம்பிக்கைக்குரியதையும்
  rationale: ‘உண்மை’ என்ற நேரடிப் பொருளையும் ‘உண்மையுள்ள, நம்பகமான நடத்தை’ என்ற சூழல்சார் பொருளையும் உரை மற்றும் அடிக்குறிப்பு மூலம் ஒன்றை ஒன்று நீக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நன்மையானது—நேர்மையானது—உண்மையானது’ என்ற மூன்று கூறுகளின் இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது; நீண்ட கூட்டு வாக்கியத்தை வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளது.
