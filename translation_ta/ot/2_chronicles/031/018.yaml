  text: וּ/לְ/הִתְיַחֵ֗שׂ בְּ/כָל טַפָּ֧/ם נְשֵׁי/הֶ֛ם וּ/בְנֵי/הֶ֥ם וּ/בְנוֹתֵי/הֶ֖ם לְ/כָל קָהָ֑ל כִּ֥י בֶ/אֱמוּנָתָ֖/ם יִתְקַדְּשׁוּ קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
translation:
  language: ta
  text: அவர்களுடைய சிறு பிள்ளைகள்[a], மனைவிகள், மகன்கள், மகள்கள் ஆகிய அனைவரையும், சபை முழுவதற்காகவும், வம்சப் பதிவில் சேர்ப்பதற்காகவும்; ஏனெனில் அவர்கள் தங்கள் நம்பகத்தன்மையில் தங்களைப் பரிசுத்தமானவர்களாக அர்ப்பணித்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய பிள்ளைகள் அனைவரையும் வம்சாவளிப்படி பதிவு செய்வதற்காகவும்.” எபிரெய வினை குடும்ப அல்லது வம்சப் பதிவேட்டில் பதிவு செய்யப்படுதலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நம்பகத்தன்மை” என்பது இங்கு முதன்மையாக உள்ளார்ந்த நம்பிக்கையை அல்ல, பரிசுத்தப் பொறுப்புகளை நிறைவேற்றுவதில் காட்டிய நம்பகமான கடமைநிறைவேற்றுதலைக் குறிக்கலாம். கடைசிப் பகுதியை “அவர்கள் தங்களைப் பரிசுத்தப்படுத்திக்கொண்டார்கள்” அல்லது “பரிசுத்தத்தில் தங்களை அர்ப்பணித்தார்கள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயம் பரிசுத்தம் என்ற கருத்தை வினை மற்றும் பெயர்ச்சொல் இரண்டாலும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  choice: வம்சப் பதிவில் சேர்த்தார்கள்
  rationale: דברי הימים நூல்களில் יחס என்பதன் ஹித்பயேல் வடிவம் குடும்ப அல்லது வம்சப் பதிவேட்டில் பதிவு செய்யப்படுவதைக் குறிக்கிறது. தமிழில் இயல்பாக இருக்கவும் நிர்வாகப் பதிவு என்ற பொருள் தெளிவாக இருக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּכָל טַפָּם
  choice: அவர்களுடைய சிறு பிள்ளைகள் அனைவரையும்
  rationale: טַף என்பது பொதுவாக எல்லாப் பிள்ளைகளையும் அல்ல, சிறு பிள்ளைகளைக் குறிப்பாகச் சுட்டுகிறது; ஆகவே மூலத்தின் குறிப்புத்தன்மை காக்கப்பட்டது.
- source_word: נְשֵׁיהֶם
  choice: மனைவிகள்
  rationale: குடும்ப உறுப்பினர்களின் பட்டியலாகிய இச்சூழலில் 'மனைவிகள்' என்பதே பொருத்தமான பொருள்.
- source_word: וּבְנֵיהֶם וּבְנוֹתֵיהֶם
  choice: மகன்கள், மகள்கள்
  rationale: எபிரெய உரை ஆண், பெண் பிள்ளைகளைத் தனித்தனியாகக் குறிப்பிடுவதால் இரண்டும் வெளிப்படையாகத் தக்கவைக்கப்பட்டன.
- source_word: לְכָל קָהָל
  choice: சபை முழுவதற்காகவும்
  rationale: קָהָל இங்கு சமூகக் குழுவை அல்லது சபையைச் சுட்டுகிறது. לְ என்ற முன்னொட்டின் நோக்கம்/பயன் சார்ந்த நுணுக்கமும் தக்கவைக்கப்பட்டது.
- source_word: בֶאֱמוּנָתָם
  choice: தங்கள் உண்மைத்தன்மையில்
  rationale: இந்த ஆசாரிய-நிர்வாகச் சூழலில் אֱמוּנָה என்பது முதன்மையாக உள்ளார்ந்த விசுவாசத்தை அல்ல, நம்பகமான கடமைநிறைவேற்றுதலையும் பற்றுறுதியையும் குறிக்கிறது.
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: தங்களைப் பரிசுத்தமானவர்களாக அர்ப்பணித்தார்கள்
  rationale: קדש வினையின் தன்னைச்சார்ந்த அர்ப்பணிப்பு/பரிசுத்தப்படுத்தல் பொருளையும், தொடர்ந்து வரும் קֹדֶשׁ வலியுறுத்தும் பரிசுத்த நிலையையும் ஒருங்கே வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆசாரிய-நிர்வாகச் சூழலில் אֱמוּנָה என்பதன் பொருள்
  choice: பரிசுத்தப் பொறுப்புகளை நிறைவேற்றுவதில் உண்மைத்தன்மை அல்லது நம்பகத்தன்மை
  alternative: உள்ளார்ந்த அல்லது பக்திசார்ந்த விசுவாசம்
  rationale: சூழல் ஆசாரியர் மற்றும் லேவியரின் பங்கீட்டு நிர்வாகத்தையும் பரிசுத்த நிலையையும் பற்றியது. எனவே பிற்காலக் கோட்பாட்டுப் பொருளை இறக்குமதி செய்யாமல், பொறுப்பில் காட்டிய உண்மைத்தன்மை என்ற பொருள் முன்னிலைப்படுத்தப்பட்டது.
- issue: יִתְקַדְּשׁוּ קֹדֶשׁ என்பதில் இருமுறை வரும் பரிசுத்தக் கருத்து
  choice: தங்களைப் பரிசுத்தமானவர்களாக அர்ப்பணித்தார்கள்
  alternative: தங்களைப் பரிசுத்தப்படுத்திக்கொண்டார்கள் / பரிசுத்தத்தில் தங்களை அர்ப்பணித்தார்கள்
  rationale: வினையும் பெயர்ச்சொல்லும் சேர்ந்து தரும் வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது; செயல் வெறும் ஒழுக்கத் தூய்மையா அல்லது வழிபாட்டுக்கான அர்ப்பணிப்பா என்ற நுண்ணிய இடைவெளியை முழுமையாக நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு புரியும் மரியாதையான வேதாகம நடையைக் கடைப்பிடிக்கிறது. ‘வம்சப் பதிவு’, ‘உண்மைத்தன்மை’, ‘பரிசுத்தமானவர்களாக அர்ப்பணித்தார்கள்’ ஆகிய சொற்கள் மூலத்தின் நிர்வாக, ஒழுக்க, வழிபாட்டுச் சார்ந்த நுணுக்கங்களை சமநிலைப்படுத்துகின்றன.
