source:
  edition: WLC
  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
translation:
  language: ta
  text: இவையெல்லாம் முடிந்தபோது, அங்கே இருந்த இஸ்ரவேலர் அனைவரும் யூதாவின் நகரங்களுக்குச் சென்றார்கள். அவர்கள் வழிபாட்டுத் தூண்களை உடைத்து, அசேரா சின்னங்களை[a] வெட்டி வீழ்த்தி, உயர்ந்த வழிபாட்டிடங்களையும் பலிபீடங்களையும் இடித்துத் தள்ளினார்கள். யூதா, பென்யமீன், எப்பிராயீம், மனாசே முழுவதிலும் அவற்றை முற்றிலும் அழிக்கும்வரை இப்படிச் செய்தார்கள். பின்பு இஸ்ரவேல் மகன்கள் அனைவரும் தங்கள் நகரங்களில் உள்ள தம் உடைமைகளுக்குத் திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசேரா கம்பங்களை.” எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; அவை பெரும்பாலும் மரக் கம்பங்களாகவோ மரங்களாகவோ புரிந்துகொள்ளப்படுகின்றன.
    reason: The precise physical form of אֲשֵׁרִים remains uncertain; the footnote supplies the common narrower rendering without imposing it in the main text.
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  choice: இவையெல்லாம் முடிந்தபோது
  rationale: כ prefixed to the infinitive construct forms a temporal clause. The passive-like Tamil expression avoids supplying an unstated subject and reads naturally.
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצְאִים
  choice: அங்கே இருந்த இஸ்ரவேலர் அனைவரும்
  rationale: הַנִּמְצְאִים denotes those who were present. அங்கே இருந்த communicates that participial sense idiomatically in modern Tamil.
- source_word: וַיְשַׁבְּרוּ הַמַּצֵּבוֹת
  choice: வழிபாட்டுத் தூண்களை உடைத்து
  rationale: מַצֵּבוֹת are standing stones or pillars used in worship. வழிபாட்டுத் தூண்கள் makes the cultic function clear without overdefining their material or exact form.
- source_word: וַיְגַדְּעוּ הָאֲשֵׁרִים
  choice: அசேரா சின்னங்களை வெட்டி வீழ்த்தி
  rationale: אֲשֵׁרִים denotes cultic objects associated with Asherah, but their precise form is not specified. அசேரா சின்னங்கள் preserves that breadth, while வெட்டி வீழ்த்தி reflects גדע.
- source_word: וַיְנַתְּצוּ אֶת הַבָּמוֹת
  choice: உயர்ந்த வழிபாட்டிடங்களை இடித்துத் தள்ளி
  rationale: בָּמוֹת are elevated cult sites. This rendering is clearer to ordinary Tamil readers than the potentially ambiguous bare term மேடைகள் and retains the action of demolition.
- source_word: וְאֶת הַמִּזְבְּחֹת
  choice: பலிபீடங்களையும்
  rationale: பலிபீடம் is the established, transparent Tamil equivalent of מִזְבֵּחַ.
- source_word: מִכָּל יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה
  choice: யூதா, பென்யமீன் முழுவதிலும், எப்பிராயீம், மனாசே பகுதிகளிலும்
  rationale: The phrase marks comprehensive geographical scope. Tamil locative wording communicates removal throughout the named regions naturally while retaining the Hebrew distinction before Ephraim and Manasseh.
- source_word: עַד לְכַלֵּה
  choice: அவற்றை முற்றிலும் அழிக்கும்வரை
  rationale: The infinitive conveys carrying the destruction through to completion. அவற்றை explicitly refers back to the cultic installations and is required for natural Tamil clarity.
- source_word: וַיָּשׁוּבוּ כָּל בְּנֵי יִשְׂרָאֵל אִישׁ לַאֲחֻזָּתוֹ לְעָרֵיהֶם
  choice: இஸ்ரவேல் மகன்கள் அனைவரும் அவரவர் உடைமையிருந்த தங்கள் நகரங்களுக்குத் திரும்பினார்கள்
  rationale: இஸ்ரவேல் மகன்கள் preserves the masculine ethnonym, அவரவர் conveys the distributive אִישׁ, and உடைமை reflects the landed holding denoted by אֲחֻזָּה. The syntax is combined slightly for idiomatic Tamil while retaining both possession and cities.
theological_decisions:
- issue: Gendered ethnonym and distributive singular
  choice: இஸ்ரவேல் மகன்கள் அனைவரும் அவரவர் உடைமையிருந்த தங்கள் நகரங்களுக்குத் திரும்பினார்கள்
  alternative: இஸ்ரவேலர் அனைவரும் அவரவர் சொந்த நகரங்களுக்குத் திரும்பினார்கள்
  rationale: The source explicitly uses בְּנֵי יִשְׂרָאֵל and the masculine distributive אִישׁ. The chosen wording preserves the source's masculine form and individual distribution without adding a claim that women were excluded.
- issue: Identity and form of the אֲשֵׁרִים
  choice: அசேரா சின்னங்கள்
  alternative: அசேரா கம்பங்கள்
  rationale: The Hebrew can denote various cultic objects associated with Asherah and does not settle their exact physical form here. The main text therefore avoids narrowing the reference to poles alone; the common alternative is retained in a footnote.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. நீளமான எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காகச் சிறு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. வழிபாட்டுச் சூழலைத் தெளிவுபடுத்தும் சொற்கள் பயன்படுத்தப்பட்டாலும், அசேரா சின்னங்களின் சரியான வடிவம் திட்டவட்டமாக்கப்படவில்லை.
