  text: מִ/לְּ/בַ֞ד הִתְיַחְשָׂ֣/ם לִ/זְכָרִ֗ים מִ/בֶּ֨ן שָׁל֤וֹשׁ שָׁנִים֙ וּ/לְ/מַ֔עְלָ/ה לְ/כָל הַ/בָּ֥א לְ/בֵית יְהוָ֖ה לִ/דְבַר י֣וֹם בְּ/יוֹמ֑/וֹ לַ/עֲב֣וֹדָתָ֔/ם בְּ/מִשְׁמְרוֹתָ֖/ם כְּ/מַחְלְקוֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
translation:
  language: ta
  text: மூன்று வயது மற்றும் அதற்கு மேற்பட்ட வயதுடைய ஆண்களில் வம்சாவளிப் பதிவில் சேர்க்கப்பட்டவர்களைத் தவிர[a], அன்றாடத் தேவைக்கேற்ப[b], யாவேவின் ஆலயத்துக்கு வந்த அனைவருக்கும், அவரவர் பிரிவுகளின்படி தங்கள் பணிமுறைகளில் அவர்கள் செய்யும் சேவைக்காகப் பங்கு வழங்கப்பட்டது.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்களில் வம்சாவளிப் பதிவில் பதிவு செய்யப்பட்டவர்களைத் தவிர.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேய மொழியில் சொல்லுக்குச் சொல், “அந்தந்த நாளில் அந்நாளுக்குரிய காரியத்திற்காக”; அதாவது, ஒவ்வொரு நாளின் தேவைக்கேற்ப.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தங்கள் காவல் முறைகளில்” அல்லது “தங்கள் பணிச் சுழற்சிகளில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: தவிர
  rationale: இச்சொல் தனியாகக் கருதப்படும் மற்றொரு பிரிவை அறிமுகப்படுத்துகிறது. ‘தவிர’ என்பது கூட்டுதலா விலக்குதலா என்பதைச் சூழலே தீர்மானிக்க இடமளித்து, எபிரேய மொழியின் நெகிழ்வைப் பாதுகாக்கிறது.
- source_word: הִתְיַחְשָׂם לִזְכָרִים
  choice: ஆண்களில் வம்சாவளிப் பதிவில் சேர்க்கப்பட்டவர்கள்
  rationale: יחש என்பதன் ஹித்பயேல் வடிவம் வம்சாவளி அடிப்படையிலான அதிகாரப்பூர்வப் பதிவைக் குறிக்கிறது; לִזְכָרִים ஆண்களைத் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: מִבֶּן שָׁלֹשׁ שָׁנִים וּלְמַעְלָה
  choice: மூன்று வயதும் அதற்கு மேற்பட்ட
  rationale: வயது வரம்பை இயல்பான நவீனத் தமிழில் துல்லியமாகக் கூறுகிறது.
- source_word: לְכָל הַבָּא לְבֵית יְהוָה
  choice: யாவேவின் ஆலயத்துக்கு வந்த அனைவருக்கும்
  rationale: கூட்டுப் பொருளில் வரும் பங்கேற்புவினையை ‘வந்த அனைவருக்கும்’ என வழங்குகிறது; בית என்பதைக் கோவில் சூழலில் இயல்பான ‘ஆலயம்’ என மொழிபெயர்க்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: அன்றாடத் தேவைக்கேற்ப
  rationale: ‘ஒரு நாளின் காரியம் அதனதன் நாளில்’ என்ற எபிரேய மரபுத்தொடரின் தினசரித் தேவை அல்லது ஒதுக்கீடு என்ற நிர்வாகப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַעֲבוֹדָתָם
  choice: அவர்கள் செய்யவேண்டிய பணிக்காக
  rationale: ஆலயச் சூழலிலுள்ள சேவை அல்லது கடமையைப் பிற்காலத் திருச்சபைச் சொல்லாட்சியைப் புகுத்தாமல் கூறுகிறது.
- source_word: בְּמִשְׁמְרוֹתָם
  choice: தங்களுக்கு நியமிக்கப்பட்ட பணிமுறைகளில்
  rationale: מִשְׁמֶרֶת குறிக்கும் நியமிக்கப்பட்ட காவல் முறை, பணி முறை அல்லது பணிப் பொறுப்பு என்ற பொருள் வரம்பைத் தக்கவைக்கிறது.
- source_word: כְּמַחְלְקוֹתֵיהֶם
  choice: அவரவர் பிரிவுகளின்படி
  rationale: ஆலயப் பணியாளர்களின் ஒழுங்கமைக்கப்பட்ட பிரிவுகளைக் குறிக்கும் சொல்லைத் தெளிவான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: ஆலயப் பணியாளர்களைக் குறிக்கும் பாலினச் சொல்
  choice: ஆண்களில்
  alternative: மக்களில் / அவர்களில்
  rationale: לִזְכָרִים என்பது ஆண்பாலினரை வெளிப்படையாகக் குறிப்பிடுவதால், பாலினக் குறிப்பை நடுநிலைப்படுத்தாமல் பாதுகாக்கிறது.
- issue: יְהוָה என்ற இறைநாமம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமம் நேரடியாக வருவதால், பட்டப்பெயரைப் பதிலிடாமல் அதன் தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- issue: வசனத்தில் வெளிப்படையாக இல்லாத பகிர்ந்தளிக்கும் வினை
  choice: பங்கு வழங்கப்பட்டது
  alternative: வினையைச் சேர்க்காமல் தொடரியல் துண்டாக விடுதல்
  rationale: எபிரேய வசனம் முந்தைய வசனங்களின் பகிர்ந்தளித்தல் கருத்தைத் தொடர்கிறது. தனித்து வாசிக்கக்கூடிய தமிழுக்காக அந்த மறைமுக வினை சேர்க்கப்படுகிறது; இது புதிய இறையியல் கருத்தல்ல, உடனடிச் சூழலிலிருந்து நிரப்பப்படும் இலக்கணத் தகவல்.
translation_notes:
  register: நவீனத் தரத்தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் ஆலய நிர்வாக மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’, ‘வம்சாவளிப் பதிவு’, ‘பணிமுறை’, ‘பிரிவு’ ஆகிய சொற்கள் முறையே இடம், பதிவு, நியமிக்கப்பட்ட கடமை, அமைப்புப் பிரிவு ஆகிய வேறுபாடுகளைத் தக்கவைக்கின்றன. வசனம் முந்தைய சூழலைச் சார்ந்த தொடரியல் துண்டாக இருப்பதால், தமிழில் முழுமையான வாக்கியமாக வாசிக்க ‘பங்கு வழங்கப்பட்டது’ என்பது சூழலிலிருந்து வெளிப்படையாக நிரப்பப்பட்டுள்ளது.
