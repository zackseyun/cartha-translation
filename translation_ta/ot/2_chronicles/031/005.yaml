  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
translation:
  language: ta
  text: அந்தச் செய்தி பரவியவுடன், இஸ்ரவேல் மக்கள் தானியம், புதுத் திராட்சரசம், எண்ணெய், தேன்[a], வயலின் எல்லா விளைச்சல் ஆகியவற்றின் முதற்பலன்களை ஏராளமாகக் கொண்டுவந்தார்கள்; எல்லாவற்றின் பத்திலொரு பங்கையும் மிகுதியாகக் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தேன்” என்பது தேனீத் தேனை மட்டுமல்லாமல், சில சூழல்களில் பேரீச்சம்பழப் பாகு போன்ற இனிப்புச் சாறையும் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִ/פְרֹץ הַ/דָּבָר
  choice: அந்தச் செய்தி பரவியவுடன்
  rationale: פרץ என்பதன் திடீரெனப் பரவுதல் என்ற நுணுக்கத்தையும், כי உடன் வரும் காலப்பொருளையும் இயல்பான தமிழில் தருகிறது. הַדָּבָר சூழலில் அறிவிக்கப்பட்ட கட்டளை அல்லது அதைப் பற்றிய செய்தி இரண்டையும் குறிக்கலாம்; இங்கு ‘செய்தி’ இயல்பாக இருந்தாலும் அதன் சூழல்சார் பரப்பை மிகையாகக் குறுக்கவில்லை.
- source_word: הִרְבּוּ
  choice: ஏராளமாகக் கொண்டுவந்தார்கள்
  rationale: רבה என்பதன் மிகுதிப் பொருளைத் தொடர்ந்து வரும் הֵבִיאוּ என்ற கொண்டுவரும் செயலுடன் இணைத்து இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: இது ஆண் பிள்ளைகளை மட்டும் குறிக்காமல் இஸ்ரவேல் சமூகத்தை மொத்தமாகக் குறிக்கும் வழக்கமான எபிரெயக் கூட்டுப்பெயர்; நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: רֵאשִׁית
  choice: முதற்பலன்களை
  rationale: காணிக்கையாக அர்ப்பணிக்கப்பட்ட விளைச்சலின் முதல் பகுதியைக் குறிக்கும் வழிபாட்டு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: דָּגָן
  choice: தானியம்
  rationale: பலவகைத் தானிய விளைபொருட்களைக் குறிக்கும் பொதுச்சொல்லுக்கு ஏற்ற நவீனத் தமிழ்.
- source_word: תִּירוֹשׁ
  choice: புதுத் திராட்சரசம்
  rationale: புதியதாக உற்பத்தி செய்யப்பட்ட திராட்சரசம் அல்லது திராட்சைச் சாற்றின் வேளாண்மை நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: יִצְהָר
  choice: எண்ணெய்
  rationale: பொதுவாக ஒலிவ எண்ணெயைக் குறித்தாலும் மூலத்தில் உள்ள பொதுமையைப் பாதுகாக்க ‘எண்ணெய்’ எனத் தரப்படுகிறது.
- source_word: דְבַשׁ
  choice: தேன்
  rationale: மூலச்சொல் தேனீத் தேனையோ பேரீச்சம்பழப் பாகு போன்ற இனிப்புச் சாறையோ குறிக்கக்கூடும்; பிரதான உரையில் வழக்கமான ‘தேன்’ வைக்கப்பட்டு மாற்றுச் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְ/כֹל תְּבוּאַת שָׂדֶה
  choice: வயலின் விளைச்சல் அனைத்திலும்
  rationale: תבואה என்பதன் வேளாண் விளைபொருள் அல்லது மகசூல் என்ற பொருளை இயல்பாகத் தருகிறது; முதற்பலன்கள் பட்டியலிலுள்ள அனைத்திற்கும் தொடர்புடையவை என்பதைத் தமிழ் வேற்றுமை வடிவம் தெளிவாக்குகிறது.
- source_word: וּ/מַעְשַׂר הַ/כֹּל
  choice: எல்லாவற்றின் பத்திலொரு பங்கையும்
  rationale: מעשר என்ற வழிபாட்டுச் சார்ந்த பத்திலொரு பங்கை சாதாரண வாசகர்களும் உடனே புரிந்துகொள்ளும் வகையில் தெளிவாக வழங்குகிறது.
- source_word: לָ/רֹב
  choice: மிகுதியாக
  rationale: கொண்டுவரப்பட்ட பத்திலொரு பங்கின் பெரும் அளவைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל என்ற பாலின வடிவமுள்ள கூட்டுச் சொல்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெய மொழியில் இச்சொற்றொடர் இஸ்ரவேல் மக்களைச் சமூகமாகக் குறிக்கிறது. தமிழில் ‘இஸ்ரவேலின் மகன்கள்’ என்பது ஆண்களை மட்டும் குறிக்கும் தவறான எண்ணத்தைத் தரக்கூடும்; எனவே கூட்டுப்பொருள் நேரடியாக வழங்கப்படுகிறது.
- issue: הַדָּבָר என்பதன் சூழல்சார் பொருள்
  choice: அந்தச் செய்தி
  alternative: அந்தக் கட்டளை / அந்தக் காரியம்
  rationale: முந்தைய வசனத்தில் அரசன் பிறப்பித்த கட்டளை மக்களிடையே பரவியது என்பதே சூழல். ‘செய்தி’ அதன் அறியப்படுதல் மற்றும் பரவுதல் ஆகியவற்றை இயல்பாகக் காட்டுகிறது; ஆனால் சொல்லின் பரந்த பொருளை ஒரு குறிப்பிட்ட இறையியல் விளக்கமாக மாற்றவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் மீளுரையை அளவோடு காத்து, தமிழில் இயல்பான வாக்கிய ஓட்டம் பயன்படுத்தப்பட்டுள்ளது. ‘பத்திலொரு பங்கு’ என்பது தொழில்நுட்பச் சொல்லைவிட உடனடியாகப் புரியும் வடிவமாகத் தேர்ந்தெடுக்கப்பட்டது.
