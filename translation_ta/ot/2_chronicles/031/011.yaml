  text: וַ/יֹּ֣אמֶר יְחִזְקִיָּ֗הוּ לְ/הָכִ֧ין לְשָׁכ֛וֹת בְּ/בֵ֥ית יְהוָ֖ה וַ/יָּכִֽינוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
translation:
  language: ta
  text: பின்பு எசேக்கியா, யாவேயின் ஆலயத்தில் அறைகளை[a] ஆயத்தப்படுத்தும்படி கட்டளையிட்டான்[b]; அவர்களும் அவற்றை ஆயத்தப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அறைகள்’ என்பதற்கு ‘கூடங்கள்’ என்றும், சூழலின்படி ‘சேமிப்பு அறைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, ‘ஆயத்தப்படுத்தும்படி சொன்னான்.’ இங்கு அந்தச் சொல் அரசனின் அறிவுறுத்தலை அறிமுகப்படுத்துவதால், முதன்மை உரையில் ‘கட்டளையிட்டான்’ என வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: கட்டளையிட்டான்
  rationale: இந்த வினைச்சொல்லின் நேரடிப் பொருள் ‘சொன்னான்’ என்பதாக இருந்தாலும், அதைத் தொடர்ந்து வரும் לְהָכִין என்னும் நோக்கவினை அரசனின் அறிவுறுத்தலைக் குறிக்கிறது. ஆகவே சூழலுக்கேற்ற இயல்பான தமிழாக ‘கட்டளையிட்டான்’ பயன்படுத்தப்பட்டது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְחִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: לְהָכִין
  choice: ஆயத்தப்படுத்தும்படி
  rationale: כון என்பதன் ஹிஃபில் வடிவம் இங்கு ஒன்றைத் தயாராகச் செய்வதைக் குறிக்கிறது. ‘ஆயத்தப்படுத்து’ ஆலய அறைகளைப் பயன்பாட்டுக்குத் தயாராக்கும் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְשָׁכוֹת
  choice: அறைகளை
  rationale: இந்தப் பன்மைப் பெயர்ச்சொல் ஆலய வளாகத்திலுள்ள அறைகளைக் குறிக்கிறது. அவை சேமிப்புக்குப் பயன்படுத்தப்பட்டன என்பது சூழலால் தெரிந்தாலும், அந்தச் செயல்பாடு சொல்லிலேயே வெளிப்படையாக இல்லை; எனவே பொதுவான ‘அறைகள்’ முதன்மை உரையில் வைக்கப்பட்டது.
- source_word: בְּבֵית יְהוָה
  choice: யாவேயின் ஆலயத்தில்
  rationale: எபிரெயத்தில் நேரடியாக ‘யாவேயின் வீட்டில்’ என்று உள்ளது; இங்கு அது ஆலயத்தைக் குறிக்கும் நிலையான சொற்றொடர். நவீன தமிழில் பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் நான்கு மெய்யெழுத்துகளான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெயத் திருநாமத்தின் பரவலான ஒலிப்பைத் தமிழில் ‘யாவே’ என்று வழங்குகிறது.
- source_word: וַיָּכִינוּ
  choice: அவர்களும் அவற்றை ஆயத்தப்படுத்தினார்கள்
  rationale: வினை பன்மையில் உள்ளது; அதன் வெளிப்படாத செயப்படுபொருள் முன் குறிப்பிடப்பட்ட அறைகள். தெளிவான தமிழுக்காக ‘அவற்றை’ சேர்க்கப்பட்டது. வַ என்பதன் தொடர்ச்சி, கட்டளை நிறைவேற்றப்பட்டதை இயல்பாகக் காட்ட ‘அவர்களும்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: יהוה என்னும் இறைத் திருநாமத்தை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பட்டப்பெயரை அல்ல, இறைவனின் தனிப்பட்ட திருநாமமான יהוה-ஐப் பயன்படுத்துகிறது. அந்த வேறுபாட்டைப் பாதுகாக்கத் திருநாமம் ஒலிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆலயம்’, ‘அறைகள்’, ‘ஆயத்தப்படுத்து’ ஆகிய சொற்கள் இயல்பான தெளிவையும் மூலத்தின் கட்டிட மற்றும் செயற்பாட்டு நுணுக்கங்களையும் சமநிலைப்படுத்துகின்றன. மூலத்தில் வெளிப்படாத செயப்படுபொருள் தமிழில் தெளிவுக்காக மட்டும் சேர்க்கப்பட்டுள்ளது.
