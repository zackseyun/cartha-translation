lexical_decisions:
- source_word: וַיִּדְרֹשׁ
  choice: கேட்டார்
  rationale: இங்கு דרשׁ என்பது விசாரித்தல் அல்லது கேட்டறிதல் என்ற பொருளில் வருகிறது; சூழலில் இயல்பான தமிழாக ‘கேட்டார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: குருமாரிடமும் லேவியரிடமும்
  rationale: עַל உடன் வரும் நபர்கள் கேள்வி கேட்கப்பட்டவர்களைக் குறிக்கின்றனர்; தமிழில் ‘-இடம்’ உருபு இதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: הָעֲרֵמוֹת
  choice: அந்தக் குவியல்கள்
  rationale: முன்னைய சூழலில் குறிப்பிடப்பட்ட காணிக்கைப் பொருட்களின் குவியல்களைக் குறிக்கும் திட்டவட்டமான பன்மை வடிவம் பாதுகாக்கப்பட்டது.
