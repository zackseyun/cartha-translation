base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
translation:
  language: ta
  text: அவனுடைய மேற்பார்வையின் கீழ் ஏதேன், மின்யாமின், யேசுவா, செமாயா, அமரியா, செக்கனியா ஆகியோர் ஆசாரியர்களின் நகரங்களில் தங்கள் சகோதரர்களுக்கு அவரவர் பிரிவுகளின்படி, பெரியவருக்கும் சிறியவருக்கும் ஒரேபோல, நம்பிக்கையுடன் பங்குகளை வழங்கினர்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனுடைய பக்கத்தில்’ அல்லது ‘அவனுடைய பொறுப்பின்கீழ்’ என்றும் மொழிபெயர்க்கலாம்; எபிரேய மரபுத்தொடர் துணைநிற்றல், பொறுப்பு அல்லது மேற்பார்வையைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘சகோதரர்கள்’ என்பது இங்கு அவர்களுடன் சேர்ந்த ஆசாரிய சமூகத்தினரைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל־יָדוֹ
  choice: அவனுடைய மேற்பார்வையில்
  rationale: עַל־יָד என்ற எபிரேய மரபுத்தொடர் நிர்வாகச் சூழலில் ஒருவரின் பொறுப்பு அல்லது மேற்பார்வைக்குக் கீழ் செயல்படுவதைக் குறிக்கலாம். இயல்பான நவீன தமிழில் இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ
  choice: ஏதேன், மின்யாமின், யேசுவா, செமாயா, அமரியா, செக்கனியா
  rationale: தனிப்பெயர்கள் மொழிபெயர்க்கப்படாமல், எபிரேய உச்சரிப்பை அணுகும் தமிழெழுத்துப் பெயர்ப்பில் தரப்பட்டுள்ளன.
- source_word: בְּעָרֵי הַכֹּהֲנִים
  choice: ஆசாரியர்களின் நகரங்களில்
  rationale: எபிரேய உடைமைத் தொடர்பை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בֶּאֱמוּנָה
  choice: நம்பிக்கையுடன் பணியாற்றி
  rationale: இங்கு אֱמוּנָה என்பது நம்பத்தகுந்த, உண்மையான முறையில் நிர்வாகப் பொறுப்பைச் செய்ததைக் குறிக்கிறது. தனித்து நிற்கும் ‘உண்மையுடன்’ என்பதைவிட இச்சொற்றொடர் தமிழில் செயற்பாட்டைத் தெளிவாக்குகிறது.
- source_word: לָתֵת
  choice: பங்குகளை வழங்கினார்கள்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘கொடுத்தல்’. முந்தைய வசனங்களின் ஒழுங்கமைந்த பங்கீட்டுச் சூழலைக் கருத்தில் கொண்டு, ‘பங்குகளை வழங்குதல்’ என இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לַאֲחֵיהֶם
  choice: தங்கள் சகோதரர்களுக்கு
  rationale: எபிரேயத்தின் நேரடிப் பொருளான ‘அவர்களுடைய சகோதரர்கள்’ பாதுகாக்கப்படுகிறது; இச்சூழலில் அது அவர்களுடன் சேர்ந்த ஆசாரிய சமூகத்தினரைக் குறிக்கிறது.
- source_word: בְּמַחְלְקוֹת
  choice: அவரவர் பிரிவுகளின்படி
  rationale: מַחְלְקוֹת என்பது ஒழுங்கமைக்கப்பட்ட பணிப்பிரிவுகள் அல்லது குழுக்களைக் குறிக்கிறது. ‘பிரிவுகளின்படி’ என்பது அந்த நிர்வாக அமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: כַּגָּדוֹל כַּקָּטָן
  choice: பெரியவருக்கும் சிறியவருக்கும் ஒரேபோல
  rationale: சொற்றொடரின் இணை அமைப்பையும், நிலை அல்லது வயது வேறுபாடின்றி வழங்கப்பட்டதையும் பாதுகாக்கிறது; ‘மூத்தவர்/இளையவர்’ என்று மட்டும் பொருளைச் சுருக்கவில்லை.
theological_decisions:
- issue: כַּגָּדוֹל כַּקָּטָן என்பதன் குறிப்பு
  choice: பெரியவருக்கும் சிறியவருக்கும் ஒரேபோல
  alternative: மூத்தவருக்கும் இளையவருக்கும் ஒரேபோல
  rationale: எபிரேயச் சொற்கள் வயதையோ நிலையையோ குறிக்கக்கூடியவை. மூலத்தின் விரிவான, ஓரளவு திறந்த பொருளைச் சுருக்காமல் ‘பெரியவர்/சிறியவர்’ எனப் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. நீண்ட எபிரேய வாக்கிய அமைப்பு தமிழில் வாசிக்க எளிதாக அரைப்புள்ளியால் பிரிக்கப்பட்டது. ‘ஆசாரியர்’, ‘மேற்பார்வை’, ‘பிரிவுகளின்படி’ போன்ற சொற்கள் நிர்வாக மற்றும் வழிபாட்டுச் சூழலைத் தெளிவாக வைத்திருக்கின்றன.
