  source_fidelity: திருத்தம் தேவை. எபிரெயத்தில் לְמַעַן יֶחֶזְקוּ என்பதன் நோக்கப் பிரிவின் எழுவாய் ஆசாரியர்களும் லேவியர்களும் ஆகும். வரைவு உரையின் “அப்படிச் செய்தார்” என்பது அரசனையே மீண்டும் எழுவாயாகக் காட்டி, மூலத்தில் இல்லாத ஒரு செயலைச் சேர்க்கிறது. மேலும் יְהוָה-வுக்கு POB-இன் நிறுவப்பட்ட ‘Yahweh’ வழங்கலோடு ஒத்த பெயர்வடிவம் ‘யாவே’ பயன்படுத்தப்பட வேண்டும்; ‘யெகோவா’ ஆங்கில audit trail-இன் தீர்மானத்துடன் ஒவ்வாது.
