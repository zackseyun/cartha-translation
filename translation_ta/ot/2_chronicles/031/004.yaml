source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
translation:
  language: ta
  text: எருசலேமில் குடியிருந்த மக்களுக்கு, ஆசாரியர்களுக்கும் லேவியர்களுக்கும் உரிய பங்கை வழங்கும்படி அவர் கட்டளையிட்டார்; அவர்கள் யாவேயின் சட்டத்தில் உறுதியாக நிலைத்திருக்கும்படியாக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் யாவேயின் சட்டத்தில் வலிமைபெறும்படியாக”; அல்லது, “அவர்கள் யாவேயின் சட்டத்தை உறுதியாகப் பற்றிக்கொள்ளும்படியாக.” சூழலுக்கு ஏற்ப, “அவர்கள் யாவேயின் சட்டத்திற்குத் தங்களை முழுமையாக அர்ப்பணிக்கும்படியாக” என்றும் பொருளாகலாம்.
    reason: חזק என்ற வினை ‘வலிமைபெறு’, ‘உறுதியாய் இரு’, ‘உறுதியாகப் பற்றிக்கொள்’ ஆகிய நுணுக்கங்களைத் தரக்கூடும். ஆசாரியர், லேவியருக்கான பொருளாதார ஆதரவு என்ற சூழல் முழுமையான ஈடுபாடு என்ற பொருளையும் சாத்தியமாக்குகிறது; ஆனால் மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் … கட்டளையிட்டார்
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொன்னார்’ என்றாலும், அரசன் மக்களுக்குக் கொடுக்கும் அதிகாரப்பூர்வ அறிவுறுத்தல் என்ற சூழலில் ‘கட்டளையிட்டார்’ என்பது இயல்பாக அதன் வலிமையை வெளிப்படுத்துகிறது.
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם
  choice: எருசலேமில் குடியிருந்த மக்களிடம்
  rationale: ‘மக்கள், எருசலேமில் குடியிருப்பவர்கள்’ என்ற எபிரெய இணைப்பை, அதே குறிப்பு எல்லையைத் தெளிவாகக் காட்டும் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: לָתֵת
  choice: வழங்கும்படி
  rationale: נתן என்பதன் ‘கொடு’ என்ற நேரடிப் பொருளை, ஒதுக்கப்பட்ட ஆதரவுப் பங்கை அளிக்கும் சூழலுக்கேற்ற கண்ணியமான தமிழில் தருகிறது.
- source_word: מְנָת
  choice: உரிய பங்கை
  rationale: מְנָה என்பது ஒதுக்கப்பட்ட பங்கு அல்லது பங்கீட்டைக் குறிக்கிறது; ‘உரிய’ என்பது இங்கு ஆசாரியர் மற்றும் லேவியருக்குக் கிடைக்க வேண்டிய பங்கு என்பதைச் சுருக்கமாக உணர்த்துகிறது.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ஆசாரியர்களுக்கும் லேவியர்களுக்கும்
  rationale: இரு தனித்த குழுக்களையும் எபிரெய உரையைப் போலவே தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְמַעַן
  choice: …தற்காக
  rationale: நோக்கத்தைக் குறிக்கும் இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֶחֶזְקוּ
  choice: உறுதியாக நிலைத்திருப்பதற்காக
  rationale: חזק என்பதிலுள்ள ‘வலிமையாய் இரு / உறுதியாகப் பற்றிக்கொள்’ என்ற கருத்தைத் தக்கவைக்கிறது; பொருளாதார ஆதரவால் பணியில் முழுமையாக ஈடுபடுதல் என்ற சூழற்பொருளையும் அனுமதிக்கிறது, ஆனால் அதை மட்டும் ஒரே பொருளாக நிர்ணயிப்பதில்லை.
- source_word: בְּתוֹרַת יְהוָה
  choice: யெகோவாவின் திருச்சட்டத்தில்
  rationale: תּוֹרָה இங்கு உடன்படிக்கை சார்ந்த சட்டம்/போதனையைக் குறிக்கிறது. ‘திருச்சட்டம்’ நவீன தமிழில் கண்ணியமாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது; בְּ என்பதன் ‘இல்’ உறவையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவத்தில் தருகிறது.
theological_decisions:
- issue: יֶחֶזְקוּ בְּתוֹרַת יְהוָה என்பதன் பொருள்
  choice: யெகோவாவின் திருச்சட்டத்தில் உறுதியாக நிலைத்திருப்பதற்காக
  alternative: யெகோவாவின் திருச்சட்டத்திற்குத் தங்களை முழுமையாக அர்ப்பணிப்பதற்காக
  rationale: எபிரெய חזק என்பது ‘வலிமைபெறு’, ‘உறுதியாயிரு’, ‘உறுதியாகப் பற்றிக்கொள்’ ஆகிய நுணுக்கங்களை அனுமதிக்கிறது. முதன்மை உரை அதன் உருவகத்தையும் உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது; சூழலில் சாத்தியமான பணியர்ப்பணப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: יְהוָה என்ற திருநாமத்தின் வழங்கல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட திருநாமத்தை ‘ஆண்டவர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் பெயராகவே வழங்குகிறது. தமிழில் வாசகர்களுக்கு நன்கு அறிமுகமான ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; உச்சரிப்பை மீட்டமைக்கும் ‘யாவே’ என்பதும் சாத்தியம்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கொண்டுள்ளது. ‘ஆசாரியர்’, ‘லேவியர்’, ‘திருச்சட்டம்’ ஆகியவை வேதாகமச் சூழலுக்குரிய பரவலாகப் புரிந்துகொள்ளப்படும் சொற்கள். மூலத்தின் நீண்ட அமைப்பு வாசிப்புத் தெளிவுக்காக அரைப்புள்ளியால் பிரிக்கப்பட்டது; எந்தக் கருத்தும் சேர்க்கப்படவில்லை.
