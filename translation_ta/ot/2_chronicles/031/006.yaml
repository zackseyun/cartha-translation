  text: וּ/בְנֵ֧י יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה הַ/יּֽוֹשְׁבִים֮ בְּ/עָרֵ֣י יְהוּדָה֒ גַּם הֵ֗ם מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן וּ/מַעְשַׂ֣ר קָֽדָשִׁ֔ים הַ/מְקֻדָּשִׁ֖ים לַ/יהוָ֣ה אֱלֹהֵי/הֶ֑ם הֵבִ֕יאוּ וַֽ/יִּתְּנ֖וּ עֲרֵמ֥וֹת עֲרֵמֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
translation:
  language: ta
  text: யூதாவின் நகரங்களில் குடியிருந்த இஸ்ரவேலரும் யூதரும் மாடுகள் மற்றும் ஆடுகளின் பத்தில் ஒரு பங்கையும், தங்கள் கடவுளாகிய யாவேக்கு அர்ப்பணிக்கப்பட்ட பரிசுத்தப் பொருட்களின் பத்தில் ஒரு பங்கையும் கொண்டுவந்து, அவற்றைக் குவியல் குவியலாக வைத்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: இஸ்ரவேல் மற்றும் யூதா மக்கள்
  rationale: בני என்பதன் சொற்பொருள் ‘மகன்கள்/பிள்ளைகள்’ என்றாலும், இங்கு இரு மக்களினங்களையும் ஒட்டுமொத்தமாகக் குறிக்கிறது; ஆண்களை மட்டும் குறிப்பதாகத் தோன்றாமல் இயல்பான தமிழில் வழங்கப்பட்டது.
- source_word: הַיּוֹשְׁבִים בְּעָרֵי יְהוּדָה
  choice: யூதாவின் நகரங்களில் குடியிருந்த
  rationale: ישב இங்குக் குறிப்பது தற்காலிகமாகத் தங்குவதை அல்ல, அங்கு வசிப்பதை; ‘குடியிருந்த’ என்பது அந்த நிலையான வாழ்விடப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: גַּם הֵם
  choice: மக்களும்
  rationale: முன்னர் குறிப்பிடப்பட்டவர்களுடன் இவர்களும் பங்குகொண்டார்கள் என்ற வலியுறுத்தலைத் தமிழ் இணைப்பு ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַעְשַׂר בָּקָר וָצֹאן
  choice: மாடுகளிலும் ஆடுகளிலும் பத்தில் ஒரு பங்கு
  rationale: מַעְשַׂר என்பது பத்தில் ஒரு பங்கு. צֹאן செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறுகால்நடைத் தொகுப்புப் பெயர்; பொதுத் தமிழில் ‘ஆடுகள்’ இரண்டையும் உள்ளடக்க இயலும்.
- source_word: וּמַעְשַׂר קָדָשִׁים הַמְקֻדָּשִׁים
  choice: அர்ப்பணிக்கப்பட்ட பரிசுத்தப் பொருட்களில் பத்தில் ஒரு பங்கு
  rationale: קָדָשִׁים இங்கு கடவுளுக்கெனப் பிரித்துவைக்கப்பட்ட பொருட்களைச் சுட்டுகிறது; הַמְקֻדָּשִׁים அதையே ‘அர்ப்பணிக்கப்பட்ட’ என மேலும் வரையறுக்கிறது. மூலத்தின் இரு கூறுகளும் தமிழில் பாதுகாக்கப்பட்டன.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய யாவேக்கு
  rationale: לְ என்பதன் நோக்கு ‘யாவேக்கு’ எனத் தரப்பட்டது; אֱלֹהֵיהֶם உறவுப்பொருள் ‘தங்கள் கடவுள்’ எனப் பாதுகாக்கப்பட்டது. יהוה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: הֵבִיאוּ וַיִּתְּנוּ
  choice: கொண்டுவந்து, ... வைத்தார்கள்
  rationale: இரு தொடர்ச்சியான செயல்களும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன; נתן இச்சூழலில் பொருட்களைக் குவியலாக வைப்பதைக் குறிக்கிறது.
- source_word: עֲרֵמוֹת עֲרֵמוֹת
  choice: குவியல் குவியலாக
  rationale: எபிரெயச் சொல்லின் இரட்டிப்பு பல குவியல்களையும் மிகுதியையும் உணர்த்துகிறது; தமிழ் இரட்டிப்புத் தொடர் அதைப் பொருத்தமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைத் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல், தனிப்பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ என வழங்கப்பட்டது.
- issue: קָדָשִׁים הַמְקֻדָּשִׁים என்பதன் பொருள்
  choice: அர்ப்பணிக்கப்பட்ட பரிசுத்தப் பொருட்கள்
  alternative: பரிசுத்தக் காணிக்கைகள்
  rationale: இவை காணிக்கைகளே என்று சாத்தியமிருந்தாலும், மூலச்சொல் அவற்றின் துல்லிய வகையை நிர்ணயிக்கவில்லை. ஆகவே ‘பொருட்கள்’ என்று பொதுவாக வைத்து, கடவுளுக்கெனப் பிரித்துவைக்கப்பட்ட தன்மையைப் பாதுகாத்தது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு அண்மையான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தசமபாகம்’ போன்ற சமய வழக்குச் சொல்லுக்கு மாற்றாக வெளிப்படையான ‘பத்தில் ஒரு பங்கு’ பயன்படுத்தப்பட்டது. வசனத்தில் தனியாக விளக்க வேண்டிய உரைவேறுபாடு இல்லாததால் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
