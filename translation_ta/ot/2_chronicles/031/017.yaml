translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானாலும் அதிகாரப்பூர்வ நிர்வாகச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெயத்தின் சுருக்கமான நீள்வாக்கியம் தமிழில் அரைப்புள்ளியால் இரண்டு இணைக் கூறுகளாக அமைக்கப்பட்டது; மூலத்தின் பொருள் நிரப்பப்பட்ட இடம் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டது.
