  text: וְ/אֵ֨ת הִתְיַחֵ֤שׂ הַ/כֹּהֲנִים֙ לְ/בֵ֣ית אֲבוֹתֵי/הֶ֔ם וְ/הַ֨/לְוִיִּ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑עְלָ/ה בְּ/מִשְׁמְרוֹתֵי/הֶ֖ם בְּ/מַחְלְקוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
translation:
  language: ta
  text: ஆசாரியர்கள் தங்கள் தந்தைவழிக் குடும்பங்களின்படி[a] வம்சாவளிப் பதிவில் சேர்க்கப்பட்டார்கள்; லேவியர்கள் இருபது வயது முதலும் அதற்கு மேற்பட்டவர்களும், தங்கள் பணிப்பொறுப்புகளின்படியும் தங்கள் பிரிவுகளின்படியும் பதிவுசெய்யப்பட்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தந்தைவழிக் குடும்பங்கள்” என்பது அதிகாரப்பூர்வப் பதிவுக்கும் சேவை ஒழுங்கமைப்புக்கும் பயன்படுத்தப்பட்ட மூதாதையர் வழிக் குடும்பக் குழுக்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: எபிரெய வாசகம் சுருக்கமாகவும் சில சொற்கள் விடுபட்ட அமைப்பிலும் உள்ளது. “பதிவுசெய்யப்பட்டார்கள்” என்பது முதல் கூறிலுள்ள வம்சாவளிப் பதிவு என்ற கருத்தை லேவியர்களுக்கும் தொடர்வதாகத் தெளிவுபடுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  choice: வம்சாவளிப் பதிவில் சேர்க்கப்பட்டார்கள்
  rationale: இந்தச் சொல் ஒருவரது வம்சவழியை அடிப்படையாகக் கொண்டு அதிகாரப்பூர்வப் பதிவில் சேர்க்கப்படுவதைக் குறிக்கிறது. தமிழ் வாக்கியத்தில் நிர்வாகப் பதிவின் பொருள் தெளிவாக வெளிப்பட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: தங்கள் தந்தைவழிக் குடும்பங்களின்படி
  rationale: இது தனிப்பட்ட தந்தையின் வீட்டை மட்டுமல்லாமல், அதிகாரப்பூர்வப் பதிவுக்கும் பணியமைப்புக்கும் பயன்படுத்தப்பட்ட மூதாதையர் வழிக் குடும்பக் குழுக்களைக் குறிக்கிறது.
- source_word: וְהַלְוִיִּם מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: லேவியர்களில் இருபது வயது தொடங்கி அதற்கு மேற்பட்ட வயதுடையவர்கள்
  rationale: எபிரெய வயது வரம்புச் சொற்றொடரின் உள்ளடக்கத்தை இயல்பான நவீன தமிழில் தருகிறது; இருபது வயதும் இதில் அடங்கும்.
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  choice: தங்கள் பணிப்பொறுப்புகளின்படி
  rationale: இச்சூழலில் காவல் முறை மட்டும் அல்லாமல் ஒப்படைக்கப்பட்ட பணி, பொறுப்பு அல்லது சேவை நியமனத்தையும் குறிக்கக்கூடிய பரந்த சொல்லாக இருப்பதால் இத்தேர்வு செய்யப்பட்டது.
- source_word: בְּמַחְלְקוֹתֵיהֶם
  choice: தங்கள் பிரிவுகளின்படி
  rationale: லேவியர்கள் சேவை செய்த ஒழுங்கமைக்கப்பட்ட குழுக்கள் அல்லது முறைகளைக் குறிக்கிறது. மூலத்தில் இரு பெயர்ச்சொற்களுக்கும் ஒரே בְּ முன்னொட்டு இருப்பதால், தமிழில் இணையான ‘-இன்படி’ அமைப்பு பயன்படுத்தப்பட்டது.
