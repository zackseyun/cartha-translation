base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
translation:
  language: ta
  text: எசேக்கியா ஆசாரியர்களின் மற்றும் லேவியர்களின் பிரிவுகளை அவர்களுடைய பிரிவுகளின்படி[a] ஏற்படுத்தினார்; ஒவ்வொருவருக்கும் அவரவருடைய பணிக்கேற்ப தகனபலிகள் மற்றும் சமாதானபலிகளுக்காக[b] ஊழியம் செய்யவும், யாவேயின் பாளையங்களின் வாயில்களில்[c] நன்றி செலுத்தவும் புகழவும் பொறுப்பளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிரிவுகள்’ என்பதற்குப் பதிலாக, ஒழுங்கமைக்கப்பட்ட ஆசாரிய மற்றும் லேவியப் பணிக்குழுக்களைக் குறிக்கும் ‘முறைப்பிரிவுகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சமாதானபலிகள்’ என்பதை ‘ஐக்கியப் பலிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘யாவேயின் பாளையங்கள்.’ ஆலயச் சூழலைக் கருத்தில் கொண்டு சிலர் இதை ‘யாவேயின் பிரகாரங்கள்’ என்று பொருள்கொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: நியமித்தார்
  rationale: இங்கு உடலளவில் நிறுத்துவதைவிட, ஆசாரியர்களையும் லேவியர்களையும் ஒழுங்குபடுத்தி அவரவர் பணியில் அமர்த்துவதே கருத்து.
- source_word: מַחְלְקוֹת
  choice: பிரிவுகள்
  rationale: ஆசாரியர்களும் லேவியர்களும் பணிக்காக ஒழுங்கமைக்கப்பட்ட குழுக்களை இச்சொல் குறிக்கிறது; நவீனத் தமிழில் ‘பிரிவுகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַל מַחְלְקוֹתָם
  choice: அவர்களுடைய பிரிவுகளின்படி
  rationale: ஏற்கெனவே அமைந்திருந்த பிரிவு ஒழுங்கிற்கு ஏற்ப நியமிக்கப்பட்டதை இது தெரிவிக்கிறது.
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: ஒவ்வொருவரையும் அவரவருடைய பணிக்கேற்ப
  rationale: எபிரெய மொழியின் பகிர்ந்தளிக்கும் ஒருமையை இயல்பான தமிழில் காட்டுகிறது; ஆலயப் பணியாளர்களுக்கு அளிக்கப்பட்ட தனித்தனி பொறுப்புகளையும் தெளிவாக்குகிறது.
- source_word: לְעֹלָה
  choice: தகனபலிகளுக்காக
  rationale: முழுவதும் எரிக்கப்படும் பலியின் வழக்கமான வேதாகமத் தமிழ்ச் சொல்லைத் தக்கவைக்கிறது; ஒருமை வடிவம் இங்கு பலிவகையை மொத்தமாகக் குறிக்கிறது.
- source_word: וְלִשְׁלָמִים
  choice: சமாதானபலிகளுக்காக
  rationale: எபிரெய பலிவகையுடன் நேரடியான சொல்லியல் தொடர்பைத் தக்கவைக்கிறது; ‘ஐக்கியப் பலிகள்’ என்பது சாத்தியமான விளக்க மொழிபெயர்ப்பு என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְשָׁרֵת
  choice: ஊழியம் செய்யவும்
  rationale: ஆலயச் சூழலில் நடைபெறும் புனிதப் பணியைத் தமிழில் இயல்பாகக் குறிக்கிறது.
- source_word: וּלְהוֹדוֹת וּלְהַלֵּל
  choice: நன்றி செலுத்தவும் புகழ்பாடவும்
  rationale: வழிபாட்டுச் சூழலில் ידה என்பது நன்றி செலுத்துதலையும், הלל என்பது புகழ்தலையும் குறிக்கின்றன; இரு வேறுபட்ட செயல்களும் பாதுகாக்கப்படுகின்றன.
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  choice: யாவேயின் பாளையங்களுடைய வாயில்களில்
  rationale: மַחֲנוֹת என்பதன் பன்மையையும் ‘பாளையங்கள்’ என்ற மூல உருவகத்தையும் மாற்றாமல் தக்கவைக்கிறது; בְּ இங்குள்ள இடத்தொடர்பை ‘வாயில்களில்’ எனக் காட்டுகிறது.
theological_decisions:
- issue: שְׁלָמִים என்ற பலிவகையின் பொருள்
  choice: சமாதானபலிகள்
  alternative: ஐக்கியப் பலிகள்
  rationale: மூலச்சொல்லின் பலியியல் வகையை நேரடியாகக் காட்டி, அதன் பொருளை ‘ஐக்கியம்’ என்ற ஒரே விளக்கத்திற்கு உட்படுத்தாமல் விடுகிறது.
- issue: מַחֲנוֹת יְהוָה என்ற வழக்கத்திற்கு மாறான ஆலயச் சொற்றொடர்
  choice: யாவேயின் பாளையங்கள்
  alternative: யாவேயின் பிரகாரங்கள்
  rationale: ஆலயச் சூழலில் ‘பிரகாரங்கள்’ எனப் புரிந்துகொள்ள வாய்ப்பிருந்தாலும், எபிரெய உரையில் தெளிவாக உள்ள பன்மை ‘பாளையங்கள்’ என்ற உருவகத்தை முதன்மை உரை பாதுகாக்கிறது.
- issue: אִישׁ என்ற ஆண்பால் ஒருமை பகிர்ந்தளிப்புச் சொல்
  choice: ஒவ்வொருவரையும்
  alternative: ஒவ்வொரு ஆணையும்
  rationale: இச்சூழலில் ஆசாரியர்களும் லேவியர்களும் வரலாற்றாக ஆண்களாக இருந்தபோதிலும், தமிழில் ‘ஒவ்வொருவரும்’ என்பது எபிரெய பகிர்ந்தளிப்பு அர்த்தத்தை இயல்பாகத் தருகிறது; பாலினத்தை மறுப்பதோ விரிவாக்குவதோ அல்ல.
- issue: יהוה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘பிரிவுகள்’ என்ற நிர்வாகச் சொல்லும், வழக்கத்திற்கு மாறான ‘யாவேயின் பாளையங்கள்’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; ‘நியமித்தார்’ மீண்டும் கூறப்படுவது இரண்டாம் வாக்கியத்தின் சார்பைத் தெளிவாக்குகிறது.
