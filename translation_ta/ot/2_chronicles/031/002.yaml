revisions:
- from: எசேக்கியா ஆசாரியர்களையும் லேவியர்களையும் அவர்களுடைய பிரிவுகளின்படி[a] நியமித்தார். ஆசாரியர்களிலும் லேவியர்களிலும் ஒவ்வொருவரையும் அவரவருடைய பணிக்கேற்ப, தகனபலிகளுக்காகவும் சமாதானபலிகளுக்காகவும்[b], ஊழியம் செய்யவும் நன்றி செலுத்தவும் புகழ்பாடவும் யாவேயின் பாளையங்களுடைய வாயில்களில்[c] நியமித்தார்.
  to: எசேக்கியா ஆசாரியர்களின் மற்றும் லேவியர்களின் பிரிவுகளை அவர்களுடைய பிரிவுகளின்படி[a] ஏற்படுத்தினார்; ஒவ்வொருவருக்கும் அவரவருடைய பணிக்கேற்ப தகனபலிகள் மற்றும் சமாதானபலிகளுக்காக[b] ஊழியம் செய்யவும், யாவேயின் பாளையங்களின் வாயில்களில்[c] நன்றி செலுத்தவும் புகழவும் பொறுப்பளித்தார்.
  rationale: The revision keeps the Hebrew plural מַחֲנוֹת (“camps”) and the deliberately literal wording reflected in footnote c. It recasts the Tamil so that Hezekiah’s establishment of the divisions is the governing action and the individual assignments are expressed as responsibilities within those divisions, rather than as a second appointment. All footnote markers remain attached to their relevant terms.
  reviewer_model: gpt-5.6-terra
