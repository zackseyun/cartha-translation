base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
translation:
  language: ta
  text: 'யாவேயின் திருச்சட்டத்தில்[d] எழுதப்பட்டபடி, ராஜாவின் சொந்த உடைமைகளிலிருந்து வந்த பங்கு[a] எரிபலிகளுக்காக இருந்தது: காலையிலும் மாலையிலும் செலுத்தப்படும் எரிபலிகளுக்காகவும், ஓய்வுநாட்கள், அமாவாசைகள்[b], நியமிக்கப்பட்ட பண்டிகைகள்[c] ஆகியவற்றில் செலுத்தப்படும் எரிபலிகளுக்காகவும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ராஜாவுக்குரிய பங்கு” அல்லது “ராஜாவின் பங்கீடு.”
    reason: lexical_alternative
  - marker: b
    text: “அமாவாசைகள்” என்பது இஸ்ரவேலின் வழிபாட்டு நாட்காட்டியில் ஒவ்வொரு மாதத்தின் தொடக்கத்திலும் அனுசரிக்கப்பட்ட புதுநிலா நாட்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “நியமிக்கப்பட்ட காலங்கள்” அல்லது “நியமிக்கப்பட்ட விழாக்கள்.”
    reason: lexical_alternative
  - marker: d
    text: எபிரெயத்தில், “யாவேயின் தோராவில்”; “யாவேயின் அறிவுரையில்” என்பது மற்றொரு சாத்தியமான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ
  choice: ராஜா ... ஒதுக்கிய பங்கு
  rationale: מְנָה என்பது ஒதுக்கப்பட்ட பங்கு அல்லது பங்கீட்டைக் குறிக்கிறது. தமிழில் இச்சொற்றொடர் அது ராஜாவின் தனிப்பட்ட வளங்களிலிருந்து குறிப்பிட்ட நோக்கத்திற்காக ஒதுக்கப்பட்டதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִן רְכוּשׁוֹ
  choice: தன் சொந்த உடைமைகளிலிருந்து
  rationale: רְכוּשׁ என்பது சொத்து, பொருட்கள், உடைமைகள் ஆகிய பரந்த பொருளுடையது; உடைமைகள் என்பது சூழலுக்கு ஏற்ற இயல்பான பொதுச்சொல்.
- source_word: לָעֹלוֹת ... לְעֹלוֹת
  choice: எரிபலிகளுக்காகவும் ... எரிபலிகளுக்காகவும்
  rationale: עֹלָה முழுவதும் எரித்துச் செலுத்தப்படும் பலியைக் குறிக்கும் வழக்கமான எபிரெயச் சொல். மூலத்தில் வரும் பொது குறிப்பையும் அதை விளக்கும் பட்டியலையும் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  choice: காலை மற்றும் மாலை எரிபலிகளுக்காகவும்
  rationale: காலை, மாலை ஆகிய இரு நேரங்களிலும் முறையாகச் செலுத்தப்பட்ட எரிபலிகளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: ஓய்வுநாட்கள், அமாவாசைகள், நியமிக்கப்பட்ட பண்டிகைகள்
  rationale: இவை இஸ்ரவேலின் வழிபாட்டு நாட்காட்டியிலுள்ள வாராந்தர ஓய்வுநாட்கள், மாதாந்தர புதுநிலா அனுசரிப்புகள், நியமிக்கப்பட்ட விழாக்காலங்கள் ஆகியவற்றைக் குறிக்கின்றன.
- source_word: כַּכָּתוּב
  choice: எழுதப்பட்டபடி
  rationale: எழுதப்பட்ட வேத ஆணைக்கு ஏற்ப நடந்ததைச் சுட்டும் எபிரெய வழக்குச் சூத்திரத்தை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: בְּתוֹרַת יְהוָה
  choice: யாவேயின் திருச்சட்டத்தில்
  rationale: இந்த வழிபாட்டுச் சட்டச் சூழலில் תּוֹרָה எழுதப்பட்ட தெய்வீக நியமத்தைக் குறிக்கிறது; יְהוָה தனிப்பெயராக யாவே என்று எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல் பெயராகவே தக்கவைக்கிறது.
- issue: תּוֹרָה என்பதன் பொருள்
  choice: திருச்சட்டம்
  alternative: அறிவுரை / தோரா
  rationale: இங்கு பலிகள் மற்றும் வழிபாட்டு நாட்காட்டிக்கான எழுதப்பட்ட கட்டளைகள் குறிக்கப்படுவதால், சட்டப் பொருள் முன்னிலையில் உள்ளது; இருப்பினும் அடிப்படைச் சொல்லுக்கு விரிவான 'அறிவுரை' என்ற பொருளும் உண்டு.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் நீண்ட பட்டியல் தமிழில் தெளிவாக அமைய வாக்கிய வரிசை மாற்றப்பட்டுள்ளது; உள்ளடக்கம் சேர்க்கப்படவில்லை. “அமாவாசை” என்பது தமிழ் வாசகர்களுக்குப் பரிச்சயமான சொல் என்றாலும், இங்கு இஸ்ரவேலின் மாதாந்தர புதுநிலா வழிபாட்டு அனுசரிப்பைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
