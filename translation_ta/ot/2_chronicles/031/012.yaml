  text: וַ/יָּבִ֨יאוּ אֶת הַ/תְּרוּמָ֧ה וְ/הַֽ/מַּעֲשֵׂ֛ר וְ/הַ/קֳּדָשִׁ֖ים בֶּ/אֱמוּנָ֑ה וַ/עֲלֵי/הֶ֤ם נָגִיד֙ כונניהו הַ/לֵּוִ֔י וְ/שִׁמְעִ֥י אָחִ֖י/הוּ מִשְׁנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
translation:
  language: ta
  text: அவர்கள் காணிக்கையையும், பத்திலொரு பங்கையும், பரிசுத்தப் பொருட்களையும் உண்மையுடன் உள்ளே கொண்டுவந்தார்கள். அவற்றுக்குப் பொறுப்பான தலைவராக லேவியனான கொனனியா இருந்தான்; அவனுடைய சகோதரன் சிமேயி இரண்டாம் பொறுப்பில் இருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: உள்ளே கொண்டுவந்தார்கள்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘கொண்டுவருதல்/உள்ளே கொண்டுவருதல்’ எனப் பொருள்படும். ஆலயப் பண்டகசாலைச் சூழலில் பொருட்களை உள்ளே சேர்த்ததை இயல்பாகத் தெரிவிக்கிறது; சேமிப்பை வினைச்சொல்லுக்கு அப்பாற்பட்டு மிகைப்படுத்தவில்லை.
- source_word: הַתְּרוּמָה
  choice: காணிக்கை
  rationale: תְּרוּמָה என்பது பரிசுத்தப் பயன்பாட்டிற்காக ஒதுக்கப்பட்ட பங்களிப்பைக் குறிக்கிறது. நவீன தமிழ் வேதாகம நடையில் ‘காணிக்கை’ இயல்பாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
- source_word: הַמַּעֲשֵׂר
  choice: பத்திலொரு பங்கு
  rationale: מַעֲשֵׂר என்பது தேவனுக்குக் கொடுக்கப்படும் பத்தில் ஒரு பங்கைக் குறிக்கும் நிலையான சொல். ‘பத்திலொரு பங்கு’ சாதாரண வாசகருக்கு நேரடியாகப் புரியும்.
- source_word: הַקֳּדָשִׁים
  choice: பரிசுத்தப் பொருட்கள்
  rationale: קֹדֶשׁ என்பதன் பன்மை இங்கு பரிசுத்தப் பயன்பாட்டிற்கு அர்ப்பணிக்கப்பட்ட பொருட்களைக் குறிக்கிறது. ‘பரிசுத்தப் பொருட்கள்’ மூலத்தின் பொதுவான, குறிப்பாகத் தீர்மானிக்கப்படாத தன்மையைப் பாதுகாக்கிறது.
- source_word: בֶּאֱמוּנָה
  choice: உண்மையுடன்
  rationale: אֱמוּנָה நிர்வாகச் சூழலில் நம்பகத்தன்மை, நேர்மை, உண்மைத்தன்மை ஆகியவற்றைக் குறிக்கலாம். ‘உண்மையுடன்’ இந்த முறையியல் பொருளை இயல்பான தமிழில் வழங்குகிறது.
- source_word: וַעֲלֵיהֶם נָגִיד
  choice: அவற்றுக்குப் பொறுப்பான தலைவராக
  rationale: עַל உடன் נָגִיד வருவது முன்சொல்லப்பட்ட பொருட்கள் அல்லது அவற்றின் நிர்வாகத்தின் மேற்பார்வையைக் குறிக்கிறது. தமிழில் ‘பொறுப்பான தலைவராக’ அதிகாரத்தையும் நிர்வாகப் பணியையும் தெளிவாக்குகிறது.
- source_word: כונניהו הַלֵּוִי
  choice: லேவியனான கொனனியா
  rationale: பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பில் தரப்படுகிறது; הַלֵּוִי உள்ள குறிப்புருபு கொனனியாவை லேவியராக அடையாளப்படுத்துகிறது.
- source_word: וְשִׁמְעִי אָחִיהוּ מִשְׁנֶה
  choice: அவனுடைய சகோதரன் சிமேயி இரண்டாம் பொறுப்பில் இருந்தான்
  rationale: אָחִיהוּ இயல்பாக ‘அவனுடைய சகோதரன்’; מִשְׁנֶה இரண்டாம் நிலை அதிகாரி அல்லது துணைப் பொறுப்பாளர் என்பதைக் குறிக்கிறது. ‘இரண்டாம் பொறுப்பில்’ என்பது தரவரிசையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
