  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகருக்கு எளிதில் புரியத்தக்கதுமான நடை பயன்படுத்தப்பட்டது. ஆலய நிர்வாகச் சூழல் தெளிவுபடுத்தப்பட்டாலும், மூலத்தில் இல்லாத குறிப்பிட்ட சடங்கு அல்லது பதவிப் பெயர் சேர்க்கப்படவில்லை.
