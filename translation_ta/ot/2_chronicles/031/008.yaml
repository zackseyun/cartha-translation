base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
translation:
  language: ta
  text: எசேக்கியாவும் அதிகாரிகளும் வந்து அந்தக் குவியல்களைக் கண்டபோது, யெகோவாவையும் அவருடைய மக்களான இஸ்ரவேலரையும் போற்றினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடைய’ என்பது யெகோவாவைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயில் அது எசேக்கியாவைக் குறிப்பதாகவும் எடுத்துக்கொள்ள இயலும்; அப்படியானால், ‘எசேக்கியாவின் மக்களான இஸ்ரவேலரையும்’ என்று பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்து
  rationale: בוא என்பதன் தொடர்கதை வடிவம் இங்கு எளிய நிகழ்வுத் தொடரைக் குறிக்கிறது; அடுத்த வினையோடு இயல்பாக இணைக்கத் தமிழில் ‘வந்து’ என வழங்கப்பட்டது.
- source_word: יְחִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தனிப்பெயர் நவீனத் தமிழில் பரவலாக அறியப்படும் வடிவில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְהַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: שָׂרִים என்பது தலைவர்கள் அல்லது ஆட்சிப் பொறுப்பாளர்களைக் குறிக்கிறது; இச்சூழலில் ‘அதிகாரிகள்’ தெளிவான நவீனத் தமிழ்.
- source_word: וַיִּרְאוּ
  choice: கண்டபோது
  rationale: ראה இங்கு நேரடியான பார்வையைக் குறிக்கிறது. எபிரெய நிகழ்வுத் தொடரை இயல்பான தமிழ் காலத் துணைவாக்கியமாக மாற்றுகிறது.
- source_word: הָעֲרֵמוֹת
  choice: அந்தக் குவியல்கள்
  rationale: עֲרֵמוֹת என்பது திரட்டிச் சேர்க்கப்பட்ட விளைபொருட்கள் அல்லது காணிக்கைகளின் குவியல்களைக் குறிக்கும் தெளிவான உருவகச் சொல்.
- source_word: וַיְבָרֲכוּ
  choice: வாழ்த்தினார்கள்
  rationale: ברך என்பதன் நேரடி பொருளான ‘வாழ்த்துதல்/ஆசீர்வதித்தல்’ இங்கு யெகோவாவையும் மக்களையும் ஒரே வினையின் பொருள்களாகக் கொண்டுள்ளது; ‘வாழ்த்தினார்கள்’ இரண்டிற்கும் இயல்பாகப் பொருந்தி, ‘புகழ்ந்தார்கள்’ என்று பொருளைச் சுருக்குவதைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: அவருடைய மக்களான இஸ்ரவேலர்
  rationale: உடைமைப் பின்னொட்டு சூழல்படி யெகோவாவைக் குறிப்பதாக முதன்மையாக எடுத்துக்கொள்ளப்படுகிறது; יִשְׂרָאֵל என்பதை மக்களைச் சுட்டும் இயல்பான தமிழில் ‘இஸ்ரவேலர்’ என வழங்குகிறது.
theological_decisions:
- issue: עַמּוֹ (‘அவருடைய மக்கள்’) என்பதிலுள்ள உடைமைப் பின்னொட்டின் குறிப்பு
  choice: '‘அவருடைய’ என்பது யெகோவாவைக் குறிக்கிறது: ‘அவருடைய மக்களான இஸ்ரவேலர்.’'
  alternative: '‘அவருடைய’ என்பது எசேக்கியாவைக் குறிக்கலாம்: ‘எசேக்கியாவின் மக்களான இஸ்ரவேலர்.’'
  rationale: உடனடி சொற்றொடரில் யெகோவாவைத் தொடர்ந்து வரும் ‘அவருடைய மக்கள்’ என்பது உடன்படிக்கை மக்களான இஸ்ரவேலரை இயல்பாகக் குறிக்கிறது. ஆயினும், எபிரெய இலக்கணத்தில் எசேக்கியாவைக் குறிக்கும் வாய்ப்பும் இருப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டது. எபிரெய வினைத் தொடரை இயல்பான தமிழ் வாக்கிய அமைப்பாக மாற்றியபோதும், குவியல்கள் என்ற concrete image மற்றும் உடைமைப் பின்னொட்டின் உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டுள்ளன.
