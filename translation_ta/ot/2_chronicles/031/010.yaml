base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
translation:
  language: ta
  text: 'சாதோக்கின் குடும்பத்தைச் சேர்ந்த முதன்மை ஆசாரியரான அசரியா அவரிடம் கூறினார்: “யாவேயின் ஆலயத்திற்குள் காணிக்கையைக்[a] கொண்டு வரத் தொடங்கியதிலிருந்து, நாங்கள் உண்டு திருப்தியடைந்தோம்; ஏராளமாக மீதமுமுள்ளது. ஏனெனில், யாவே தம் மக்களை ஆசீர்வதித்திருக்கிறார். இந்தப் பெரும் மிகுதியே மீதமுள்ளது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “பங்களிப்பு”; எபிரெயச் சொல் பரிசுத்தப் பயன்பாட்டுக்காக ஒதுக்கி அளிக்கப்படும் ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: தலைமை ஆசாரியர்
  rationale: ‘தலைமை’ என்பது ஆசாரியர்களிடையே அசரியாவின் முன்னணி நிலையை இயல்பாகக் காட்டுகிறது; எபிரெயச் சொற்றொடரில் வெளிப்படையாக இல்லாத பிற்காலத் தொழில்நுட்பப் பட்டத்தைச் சேர்ப்பதில்லை.
- source_word: לְבֵית צָדוֹק
  choice: சாதோக்கின் குடும்பத்தைச் சேர்ந்த
  rationale: இங்கு ‘வீடு’ என்பது கட்டடத்தை அல்ல, குடும்ப அல்லது வம்சச் சார்பைக் குறிக்கிறது; நவீன தமிழில் இதுவே தெளிவான இயல்பான வடிவம்.
- source_word: מֵהָחֵל
  choice: தொடங்கியதுமுதல்
  rationale: מן உடன் வரும் வினையெச்ச அமைப்பு செயல் தொடங்கிய காலப்புள்ளியிலிருந்து தொடரும் நிலையைச் சுட்டுகிறது.
- source_word: הַתְּרוּמָה
  choice: காணிக்கை
  rationale: பரிசுத்தப் பயன்பாட்டுக்காகப் பிரித்து அளிக்கப்பட்ட பொருளைத் தமிழில் இயல்பாகக் குறிக்கிறது; ‘பங்களிப்பு’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָבִיא בֵית יְהוָה
  choice: யெகோவாவின் ஆலயத்திற்குக் ... கொண்டுவர
  rationale: בוא இங்குத் திசைநோக்கிய கொண்டு வருதலைக் குறிக்கிறது; ‘ஆலயம்’ என்பது சூழலில் ‘யெகோவாவின் வீடு’ குறிக்கும் தேவாலயத்தைத் தெளிவாகவும் இயல்பாகவும் சொல்கிறது.
- source_word: אָכוֹל וְשָׂבוֹעַ
  choice: நாங்கள் உண்டு திருப்தியடைந்தோம்
  rationale: உண்பதையும் நிறைவடைவதையும் இணைக்கும் எபிரெயச் சொல்லமைப்பின் விளைவை இயல்பான தமிழ் வாக்கியமாகத் தருகிறது; பேசுபவரின் கூட்டு நோக்கிற்கு ஏற்ப ‘நாங்கள்’ வெளிப்படுத்தப்படுகிறது.
- source_word: וְהוֹתֵר עַד לָרֹב
  choice: ஏராளமாக மீந்தும் இருக்கிறது
  rationale: יתר மற்றும் עד לרב இணைந்து மிகுந்த உபரியைச் சுட்டுகின்றன; தமிழ் வடிவம் அந்த அளவுமிகுதியையும் தொடரும் நிலையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்தான தேவனுடைய தனிப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு வடிவத்தில் வழங்குகிறது.
- source_word: בֵּרַךְ אֶת עַמּוֹ
  choice: தமது மக்களை ஆசீர்வதித்திருக்கிறார்
  rationale: மிகுதியின் காரணமாக ஏற்கெனவே நிகழ்ந்து தற்போதும் விளைவுள்ள ஆசீர்வாதத்தை நிறைவு வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  choice: மீதமிருப்பது இந்தப் பெருமளவுதான்
  rationale: הנותר என்பதன் ‘மீதமிருப்பது’ என்ற பெயர்ச்செயல்பாட்டையும், பொருட்களின் திரள் அல்லது மிகுதியைக் குறிக்கும் המון என்பதையும் கூட்டத்தினர் எனத் தவறாகப் புரியாமல் சூழலுக்கேற்றவாறு தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூல உரை பொதுப் பட்டத்தை அல்ல, திருநான்கெழுத்தான தனிப்பெயரைப் பயன்படுத்துகிறது. ஆகவே தனிப்பெயர் தனிப்பெயராகவே காக்கப்படுகிறது; தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இருமுறை வரும் ‘கூறினார்’ என்ற அறிமுக அமைப்பு தமிழில் தேவையற்ற மறுமொழியாக இருப்பதால் ஒரே இயல்பான உரையறிமுகமாகச் சுருக்கப்பட்டுள்ளது; பொருள் நீக்கப்படவில்லை.
