revisions:
- from: 'சாதோக்கின் குடும்பத்தைச் சேர்ந்த தலைமை ஆசாரியரான அசரியா அவரிடம் கூறியது: “யெகோவாவின் ஆலயத்திற்குக் காணிக்கையைக்[a] கொண்டுவரத் தொடங்கியதுமுதல், நாங்கள் உண்டு திருப்தியடைந்தோம்; ஏராளமாக மீந்தும் இருக்கிறது. ஏனெனில், யெகோவா தமது மக்களை ஆசீர்வதித்திருக்கிறார். மீதமிருப்பது இந்தப் பெருமளவுதான்.”'
  to: 'சாதோக்கின் குடும்பத்தைச் சேர்ந்த முதன்மை ஆசாரியரான அசரியா அவரிடம் கூறினார்: “யாவேயின் ஆலயத்திற்குள் காணிக்கையைக்[a] கொண்டு வரத் தொடங்கியதிலிருந்து, நாங்கள் உண்டு திருப்தியடைந்தோம்; ஏராளமாக மீதமுமுள்ளது. ஏனெனில், யாவே தம் மக்களை ஆசீர்வதித்திருக்கிறார். இந்தப் பெரும் மிகுதியே மீதமுள்ளது.”'
  rationale: The revision corrects the narrative verb, aligns the rendering of the Tetragrammaton with the POB’s “Yahweh” policy, and makes the final surplus statement more idiomatic while retaining the source’s emphasis. The footnote continues to identify the sacred-contribution nuance of תרומה.
