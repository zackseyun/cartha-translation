source:
  edition: WLC
  text: וּ/בְ/כָל עִ֤יר וָ/עִיר֙ צִנּ֣וֹת וּ/רְמָחִ֔ים וַֽ/יְחַזְּקֵ֖/ם לְ/הַרְבֵּ֣ה מְאֹ֑ד וַ/יְהִי ל֖/וֹ יְהוּדָ֥ה וּ/בִנְיָמִֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/012.yaml
  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
translation:
  language: ta
  text: ஒவ்வொரு நகரத்திலும்[a] கேடயங்களையும் ஈட்டிகளையும் வைத்தான்; அந்நகரங்களை மிகவும் பலப்படுத்தினான். யூதாவும் பென்யமீனும் அவன் வசம் இருந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் ‘நகரம்’ என்ற சொல் பகிர்வுப் பொருளில் இருமுறை வருகிறது: ‘ஒவ்வொரு நகரமும் நகரமும்’; இது தனித்தனி ஒவ்வொரு நகரத்தையும் வலியுறுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/כָל עִיר וָ/עִיר
  choice: ஒவ்வொரு நகரத்திலும்
  rationale: எபிரெய மொழியின் பகிர்வுப் பொருளுடைய இரட்டிப்பு, இயல்பான நவீனத் தமிழில் ‘ஒவ்வொரு நகரத்திலும்’ என வழங்கப்படுகிறது; மூலத்தின் வலியுறுத்தல் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: צִנּוֹת
  choice: கேடயங்கள்
  rationale: போரில் பயன்படுத்தப்படும் shields என்பதற்கான தெளிவான, பொதுவாகப் புரியும் தமிழ்ச்சொல்; அளவை மூலவசனம் வெளிப்படையாக வலியுறுத்தாததால் ‘பெரிய கேடயங்கள்’ என மிகைப்படுத்தப்படவில்லை.
- source_word: וּ/רְמָחִים
  choice: ஈட்டிகள்
  rationale: רמח என்பதற்கான இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: וַֽ/יְחַזְּקֵם
  choice: அவற்றை மிகவும் வலுப்படுத்தினான்
  rationale: முன்னைய சூழலில் உள்ள நகரங்களையே பன்மைச் சுட்டுப்பெயர் குறிக்கிறது. ‘வலுப்படுத்தினான்’ என்பது חזק என்பதன் வலிமைப்படுத்தும் கருத்தைப் பாதுகாக்கிறது; ‘அரணமைத்தான்’ என்று சூழல்சார் பொருளை அளவுக்கு மீறித் தெளிவுபடுத்தவில்லை.
- source_word: לְ/הַרְבֵּה מְאֹד
  choice: மிகவும்
  rationale: செயலைத் தீவிரப்படுத்தும் எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் வலுவாகக் காட்டுகிறது.
- source_word: וַ/יְהִי ל֖/וֹ יְהוּדָה וּ/בִנְיָמִן
  choice: யூதாவும் பென்யமீனும் அவன் வசம் இருந்தன
  rationale: ויהי לו குறிக்கும் உடைமை அல்லது ஆட்சிக்குட்பட்ட நிலையை, மக்கள் அவனுடைய சொத்துகள் என்ற தவறான எண்ணத்தைத் தவிர்த்து, அரசியல் கட்டுப்பாடு/விசுவாசம் என்ற பொருளில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யூதாவும் பென்யமீனும் ரெகொபெயாமுடன் கொண்ட உறவு
  choice: அவன் வசம் இருந்தன
  alternative: அவனுடையவையாக இருந்தன
  rationale: மூலத்தின் உடைமை அல்லது சார்பு சார்ந்த மொழிநடையைப் பாதுகாத்தபடியே, பழங்குடிகள் அல்லது பிரதேசங்கள் தனிப்பட்ட சொத்துகள் எனத் தோன்றும் பொருளைத் தவிர்க்கிறது. குறிப்பாக ஆட்சி, கட்டுப்பாடு, விசுவாசம் ஆகிய நிழற்பொருள்களைத் திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் அசாதாரண இரட்டிப்பு பிரதான உரையில் இயல்பாக்கப்பட்டு, அதன் வலியுறுத்தல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
