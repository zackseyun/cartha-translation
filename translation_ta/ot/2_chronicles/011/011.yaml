translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று உரைக்கேற்ற கண்ணியமான எளிய நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் தொடர்ச்சியான இரண்டு செயல்களும் ஒரே வாக்கியத்தில் இயல்பாக இணைக்கப்பட்டுள்ளன. இவ்வசனத்தில் வெளியீட்டிற்கு இன்றியமையாத உரை அல்லது இறையியல் அடிக்குறிப்பு இல்லை.
