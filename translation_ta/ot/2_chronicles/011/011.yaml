  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְחַזֵּ֖ק אֶת הַ/מְּצֻר֑וֹת וַ/יִּתֵּ֤ן בָּ/הֶם֙ נְגִידִ֔ים וְ/אֹצְר֥וֹת מַאֲכָ֖ל וְ/שֶׁ֥מֶן וָ/יָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
translation:
  language: ta
  text: அவன் அரணாக்கப்பட்ட இடங்களைப் பலப்படுத்தி, அவற்றில் தளபதிகளையும் உணவு, எண்ணெய், திராட்சரசம் ஆகியவற்றின் சேமிப்புகளையும் வைத்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: பலப்படுத்தி
  rationale: חזק என்பதன் பியேல் வடிவம் ஒன்றை வலிமையாக்குதல் அல்லது பாதுகாப்பானதாக்குதல் என்னும் செயலைக் குறிக்கிறது; அடுத்துவரும் அரணாக்கப்பட்ட இடங்கள் என்பதுடன் தேவையற்ற சொல் மீளலைத் தவிர்க்கிறது.
- source_word: הַמְּצֻרוֹת
  choice: அரணாக்கப்பட்ட இடங்களை
  rationale: இச்சொல் கோட்டைகள் அல்லது பாதுகாப்புக்காக அரணாக்கப்பட்ட இடங்களைக் குறிக்கலாம்; எல்லாவற்றையும் பெரிய கோட்டைகள் என்று மிகையாகக் குறிப்பதின்றி எபிரெயச் சொல்லின் பரந்த பொருளைக் காக்கிறது.
- source_word: וַיִּתֵּן בָּהֶם
  choice: அவற்றில் ... வைத்தான்
  rationale: נתן உடன் வரும் ב, அந்த அரணாக்கப்பட்ட இடங்களுக்குள் ஆட்களையும் பொருட்களையும் வைத்ததை இயல்பாகக் குறிக்கிறது.
- source_word: נְגִידִים
  choice: தளபதிகளை
  rationale: נָגִיד என்பது தலைவர், அதிகாரி, ஆளுநர் போன்ற பல பொருள்களைக் கொண்டது; இங்குள்ள அரண் மற்றும் பாதுகாப்புச் சூழலில் தளபதிகள் என்பது இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: וְאֹצְרוֹת
  choice: சேமிப்புகளை
  rationale: אֹצָרוֹת என்பது களஞ்சியங்களையோ சேமித்து வைக்கப்பட்ட பொருட்களையோ குறிக்கலாம்; தொடர்ந்து உணவுப் பொருட்கள் பட்டியலிடப்படுவதால் இருப்பில் வைக்கப்பட்ட பொருட்கள் என்ற பொருளில் சேமிப்புகள் என மொழிபெயர்க்கப்பட்டது.
- source_word: מַאֲכָל
  choice: உணவு
  rationale: உணவு அல்லது உணவுப் பொருட்களைக் குறிக்கும் பொதுவான எபிரெயச் சொல்லுக்கு தெளிவான நவீனத் தமிழ் இணை.
- source_word: שֶׁמֶן
  choice: எண்ணெய்
  rationale: இது அநேகமாக ஒலிவ எண்ணெயைக் குறித்தாலும், மூலத்தில் வகை வெளிப்படையாகச் சொல்லப்படாததால் பொதுவான எண்ணெய் என்பதே காக்கப்பட்டது.
- source_word: יָיִן
  choice: திராட்சரசம்
  rationale: יין என்பதன் வழக்கமான பொருளை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
