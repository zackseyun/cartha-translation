  text: אֱמֹ֕ר אֶל רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וְ/אֶל֙ כָּל יִשְׂרָאֵ֔ל בִּ/יהוּדָ֥ה וּ/בִנְיָמִ֖ן לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/003.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all Israel in Judah and Benjamin, saying,
translation:
  language: ta
  text: 'சாலொமோனின் மகனும் யூதாவின் அரசனுமான ரெகொபெயாமிடமும், யூதாவிலும் பென்யமீனிலும் உள்ள இஸ்ரயேல் மக்கள் அனைவரிடமும் இவ்வாறு சொல்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר ... לֵאמֹר
  choice: 'இவ்வாறு சொல்:'
  rationale: முதலில் வரும் கட்டளை வினையையும், தொடர்ந்து செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்தும் לֵאמֹר என்பதையும் இயல்பான நவீன தமிழில் ஒருங்கிணைக்கிறது; அடுத்த வசனத்தில் நேரடி செய்தி வருவதைக் காட்ட இரட்டைப்புள்ளி இடப்பட்டுள்ளது.
- source_word: רְחַבְעָם
  choice: ரெகொபெயாம்
  rationale: எபிரேயப் பெயருக்கான தெளிவான தமிழ் ஒலிபெயர்ப்பு.
- source_word: בֶּן שְׁלֹמֹה
  choice: சாலொமோனின் மகன்
  rationale: எபிரேய இணைப்புத் தொடரை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: அரசப் பட்டத்தையும் அது சார்ந்த நாட்டையும் நேரடியாகக் காட்டுகிறது.
- source_word: וְאֶל כָּל יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்கள் அனைவரிடமும்
  rationale: இங்கே ‘இஸ்ரயேல்’ என்பது அழைக்கப்படும் மக்களைக் குறிக்கிறது. ‘மக்கள்’ என்பது தமிழில் பொருளைத் தெளிவாக்குகிறது; ‘அனைவரும்’ כָּל என்பதன் முழுமையைப் பேணுகிறது.
- source_word: בִּיהוּדָה וּבִנְיָמִן
  choice: யூதாவிலும் பென்யமீனிலும் உள்ள
  rationale: ב முன்னிடைச்சொல்லின் இடப்பொருளைப் பேணி, இவர்கள் அந்தப் பகுதிகளில் இருப்பவர்கள் என்பதைத் தெரிவிக்கிறது; கோத்திரச் சார்பாக மட்டும் மாற்றிப் பொருள் கொள்ளவில்லை.
theological_decisions:
- issue: ‘இஸ்ரயேல்’ என்பதன் சூழல்சார் குறிப்பு
  choice: யூதாவிலும் பென்யமீனிலும் உள்ள ‘இஸ்ரயேல் மக்கள்’ என்று தேசிய/உடன்படிக்கைப் பெயரைப் பேணுதல்
  alternative: ‘யூதா, பென்யமீன் கோத்திரத்தார்’ என்று குறிப்பாக்குதல்
  rationale: மூலத்தில் כָּל יִשְׂרָאֵל என்று இருப்பதால், அதை இரண்டு கோத்திரங்களாக மட்டும் விளக்கி வரையறுக்காமல், மூலத்தின் பரந்த பெயரிடலைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரமான, மரியாதைமிக்க, எளிதில் புரியும் தமிழ். எபிரேய வசனத்தின் நீண்ட அழைப்புத் தொடரைத் தமிழுக்கு இயல்பான வரிசையில் அமைத்துள்ளது; அடுத்த வசனத்தின் நேரடி உரையை அறிமுகப்படுத்தும் முடிவு இரட்டைப்புள்ளியால் குறிக்கப்படுகிறது.
