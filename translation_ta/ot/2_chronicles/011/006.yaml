base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/006.yaml
  text: And he built Bethlehem[a], Etam, and Tekoa.
translation:
  language: ta
  text: பெத்லெகேம், ஏத்தாம், தெக்கோவா ஆகியவற்றை அவன் கட்டினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டினான்
  rationale: Qal wayyiqtol வடிவிலுள்ள בנה என்பதன் நேரடியான பொருள் ‘கட்டினான்.’ சூழலில் அரணாக்குதல் அடங்கியிருக்கலாம்; எனினும் அந்தக் கூடுதல் கருத்தை வசனத்துக்குள் வெளிப்படையாகச் சேர்க்காமல் மூல வினையின் பொதுவான பொருள் காக்கப்படுகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது எபிரெய மொழியின் நேரடி செயப்படுபொருள் குறியீடு; இயல்பான தமிழில் இதற்குத் தனிச் சொல் தேவையில்லை.
- source_word: בֵּית לֶחֶם
  choice: பெத்லெகேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
- source_word: עֵיטָם
  choice: ஏத்தாம்
  rationale: எபிரெய இடப்பெயரின் ஒலியை இயல்பான தமிழ் எழுத்துமுறையில் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: תְּקוֹעַ
  choice: தெக்கோவா
  rationale: எபிரெய இடப்பெயரின் ஒலியைத் தமிழில் அடையாளம் காணத்தக்க வகையில் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: וְ...וְ...וְ
  choice: பெயர்ப் பட்டியல் + ‘ஆகிய’
  rationale: எபிரெய இணைப்புச் சொற்களை ஒவ்வொன்றாக ‘மற்றும்’ என்று மொழிபெயர்ப்பது தமிழில் செயற்கையாக ஒலிக்கும்; ‘ஆகிய’ மூன்று நகரங்களையும் இயல்பாக ஒரே பட்டியலாக இணைக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘நகரங்கள்’ என்பது உடனடி சூழலில் குறிப்பிடப்படும் கட்டப்பட்ட இடங்களின் தன்மையைத் தமிழில் தெளிவாக்குகிறது; ‘அரணாக்கினான்’ என்று சூழல் சார்ந்த பொருள் வசனத்துக்குள் சேர்க்கப்படவில்லை.
