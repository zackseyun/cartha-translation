base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
translation:
  language: ta
  text: ஏனெனில், லேவியர்கள் தங்களுடைய மேய்ச்சல் நிலங்களையும்[a] உடைமைகளையும் விட்டுவிட்டு யூதாவுக்கும் எருசலேமுக்கும் சென்றார்கள்; யெரொபெயாமும் அவனுடைய மகன்களும் யாவேக்கு ஆசாரியர்களாகச் சேவை செய்வதிலிருந்து அவர்களை விலக்கிவிட்டிருந்ததால்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுடைய பொதுநிலங்கள்’ அல்லது ‘அவர்களுடைய திறந்தவெளி நிலங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அவர்களுடைய நகரங்களுடன் இணைந்திருந்த திறந்த நிலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேக்கு ஆசாரியர்களாகச் சேவை செய்யாதபடி அவர்களை நிராகரித்துவிட்டிருந்தார்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  choice: தங்களுடைய மேய்ச்சல் நிலங்கள்
  rationale: מִגְרָשׁ என்பது நகரங்களுடன் இணைந்திருந்த திறந்தவெளி அல்லது கால்நடை மேய்ச்சலுக்கான நிலத்தைக் குறிக்கிறது; லேவியர் நகரங்களின் சூழலில் ‘மேய்ச்சல் நிலங்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֲחֻזָּתָם
  choice: உடைமைகள்
  rationale: אֲחֻזָּה என்பது சொந்தமாக வைத்திருக்கும் நிலம் அல்லது உரிமைப் பங்கைக் குறிக்கிறது. ‘உடைமைகள்’ அதன் பரந்த பொருளைப் பாதுகாக்கிறது; ‘சுதந்தரம்’ என்று மொழிபெயர்ப்பது இங்கு வெளிப்படையாக இல்லாத உடன்படிக்கை சார்ந்த நுணுக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  choice: யூதாவுக்கும் எருசலேமுக்கும் சென்றார்கள்
  rationale: הלך உடன் வரும் ל இலக்கை நோக்கிய நகர்வைக் காட்டுகிறது; ‘சென்றார்கள்’ எபிரெயக் கதைநோக்கை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: הִזְנִיחָם
  choice: அவர்களை விலக்கிவிட்டார்கள்
  rationale: זנח என்பதன் ஹிஃபில் வடிவம் நிராகரித்தல், ஒதுக்குதல் அல்லது ஒரு பொறுப்பிலிருந்து விலக்குதல் என்ற பொருளைக் கொண்டது. தொடரும் מִכַּהֵן காரணமாக, இங்கு ஆசாரியப் பணியிலிருந்து நிறுவனரீதியாக விலக்கியது இயல்பாக வெளிப்படுகிறது.
- source_word: מִכַּהֵן
  choice: குருக்களாகப் பணிசெய்வதிலிருந்து
  rationale: מִן உடன் வரும் כהן வினையின் infinitive construct, குருத்துவப் பணியைச் செய்யவிடாமல் தடுத்தல் அல்லது அதிலிருந்து நீக்குதல் என்பதைக் குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற தனிப்பெயர் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது; ל முன்னொட்டு பணியின் இலக்கைச் சுட்டுவதால் ‘யாவேக்கு’ என வழங்கப்பட்டுள்ளது.
- source_word: כִּי ... כִּי
  choice: '[முந்தைய வசனத்திற்கான விளக்கம்] ... ஏனெனில்'
  rationale: முதல் כִּי முந்தைய கூற்றை விளக்குகிறது; வசனத்தைத் தனியாகத் தொடங்கும்போது தமிழில் கட்டாயமாக இணைப்புச்சொல் சேர்ப்பது இயல்பற்றது. இரண்டாவது כִּי லேவியர்கள் சென்றதற்கான காரணத்தைத் தெளிவாகக் காட்டுவதால் ‘ஏனெனில்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதற்குப் பதிலாக ‘யாவே’ என்பது அந்த உடன்படிக்கைப் பெயரைத் தனிப்பெயராகப் பாதுகாக்கிறது.
- issue: லேவியர்களின் குருத்துவப் பணியிலிருந்து விலக்கப்பட்ட நிலை
  choice: குருக்களாகப் பணிசெய்வதிலிருந்து அவர்களை விலக்கிவிட்டார்கள்
  alternative: குருக்களாகப் பணிசெய்யாதபடி அவர்களை நிராகரித்துவிட்டார்கள்
  rationale: הִזְנִיחָם என்பதில் தனிப்பட்ட நிராகரிப்பும் பணியிலிருந்து விலக்குதலும் இரண்டும் சாத்தியம். சூழலில் குருத்துவச் சேவை வெளிப்படையாகக் குறிப்பிடப்படுவதால் முதன்மை உரை நிறுவனரீதியான விலக்குதலைச் சொல்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘குருக்கள்’ வழிபாட்டுச் சேவைக்குரிய cultic பங்கைத் தெளிவாகக் காட்டுகிறது; ‘யாவே’ தனிப்பெயராகப் பாதுகாக்கப்பட்டுள்ளது.
