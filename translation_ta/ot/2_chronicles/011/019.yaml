source:
  edition: WLC
  text: וַ/תֵּ֥לֶד ל֖/וֹ בָּנִ֑ים אֶת יְע֥וּשׁ וְ/אֶת שְׁמַרְיָ֖ה וְ/אֶת זָֽהַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/019.yaml
  text: 'And she bore him sons: Jeush, Shemariah, and Zaham.'
translation:
  language: ta
  text: 'அவள் அவனுக்கு மகன்களைப் பெற்றெடுத்தாள்: எயூஷ், செமரியா, ஸஹாம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: பெற்றெடுத்தாள்
  rationale: ילד என்பதன் தொடர்கதை வினை வடிவம் அடுத்த நிகழ்வைக் குறிக்கிறது; பெண் எழுவாயையும் பிறப்பித்தல் என்ற பொருளையும் இயல்பான தமிழில் தெளிவாகக் காக்கிறது.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: ל முன்னிடைச்சொல்லுடன் வந்த ஆண்பால் ஒருமை பின்னொட்டு, இந்தப் பிறப்பு மரபுத்தொடரில் தந்தையைக் குறிக்கிறது; தமிழில் ‘அவனுக்கு ... பெற்றெடுத்தாள்’ என்பது மூலத்தின் உறவமைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּנִים
  choice: மகன்களை
  rationale: எபிரெயச் சொல் பொதுவாகப் பிள்ளைகள் என்று அல்ல, குறிப்பாக மகன்கள் என்று கூறுகிறது; தொடர்ந்து மூன்று ஆண் பெயர்கள் வருகின்றன.
- source_word: יְעוּשׁ
  choice: எயூஷ்
  rationale: எபிரெயப் பெயரின் மெய் மற்றும் உயிரொலி அமைப்பை நவீனத் தமிழில் முடிந்தவரை நெருக்கமாக ஒலிபெயர்க்கிறது.
- source_word: שְׁמַרְיָה
  choice: செமரியா
  rationale: שְׁמַרְיָה என்ற எபிரெய வடிவத்தைத் தமிழில் வாசிக்க இயலுமாறு ஒலிபெயர்க்கிறது; இறுதியிலுள்ள தெய்வப்பெயர் கூறின் சுருக்க வடிவம் ‘யா’ எனப் பிரதிபலிக்கப்படுகிறது.
- source_word: זָהַם
  choice: சாகாம்
  rationale: זָהַם என்ற தனிப்பெயரின் நீளுயிர்களையும் மெய்யொலிகளையும் தமிழில் நெருக்கமாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான வம்சவரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள பெண் எழுவாயும் ‘மகன்கள்’ என்ற பாலினக் குறிப்பும் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற விளக்கச் சேர்க்கைகள் இல்லை.
