id: 2CH.11.2
reference: 2 Chronicles 11:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל שְׁמַֽעְיָ֥הוּ אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/002.yaml
  text: And the word of Yahweh came to Shemaiah the man of God, saying,
translation:
  language: ta
  text: 'யாவேயின் வார்த்தை தேவனுடைய மனிதராகிய செமாயாவுக்கு வந்தது:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: அப்போது ... வந்தது
  rationale: வாவ் தொடர்வினை அடுத்த நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் ‘அப்போது’ என்பது முந்தைய நிகழ்வுடன் இயல்பான கதைத் தொடர்ச்சியை ஏற்படுத்துகிறது; எபிரெயச் சொற்றொடரைச் செயற்கையாக ‘அது நிகழ்ந்தது’ என்று மொழிபெயர்ப்பதைத் தவிர்க்கிறது.
- source_word: דְּבַר יְהוָה
  choice: யெகோவாவின் வார்த்தை
  rationale: இது தீர்க்கதரிசன உரையை அறிமுகப்படுத்தும் வழக்கமான சொற்றொடர். எபிரெயக் கட்டமைப்பையும் அடையாளம் காணத்தக்க வேதாகம வழக்கையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இங்கு வரும் நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
- source_word: שְׁמַעְיָהוּ
  choice: செமாயா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிக்கு ஏற்ற, தமிழில் இயல்பான ஒலிபெயர்ப்பு.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதரான
  rationale: தீர்க்கதரிசனப் பணியாளரைக் குறிக்கும் நிலையான பட்டத்தைப் பாதுகாத்து, செமாயாவை அடையாளப்படுத்தும் வகையில் இயல்பான தமிழில் அமைக்கிறது.
- source_word: לֵאמֹר
  choice: 'வந்தது:'
  rationale: இந்த எபிரெய வடிவம் தொடர்ந்து வரும் நேரடிக் கூற்றை அறிமுகப்படுத்துகிறது. தமிழில் முக்காற்புள்ளி இதைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; தனியே ‘சொல்லி’ என்பதைக் கூட்டத் தேவையில்லை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக வருகிறது. அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் பெயராகவே வழங்குகிறது. ‘யாவே’ என்பது சாத்தியமான மறுவடிவம் என்றாலும், ‘யெகோவா’ நவீன தமிழ் வாசகர்களிடையே பரவலாக அறியப்படுகிறது.
- issue: אִישׁ הָאֱלֹהִים என்பதன் தன்மை
  choice: இறைவனின் மனிதரான
  alternative: இறைமனிதரான; கடவுளுக்குரிய மனிதரான
  rationale: இது பொதுவான பக்தி விளக்கமல்ல; தீர்க்கதரிசனப் பிரதிநிதியைக் குறிக்கும் பட்டம். சொற்றொடரின் தனித்துவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. வசனம் அடுத்த நேரடிக் கூற்றை அறிமுகப்படுத்துவதால் இறுதியில் முக்காற்புள்ளி இடப்பட்டுள்ளது.
