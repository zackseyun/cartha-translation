  text: காத், மரேஷா, சீப் ஆகிய நகரங்களையும் கட்டினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: ஆகிய நகரங்களையும்
  rationale: אֵת என்பது நேரடிச் செயப்படுபொருளைக் குறிக்கும் உருபு; வְ தொடரிலுள்ள இடப்பெயர்களை இணைக்கிறது. முந்தைய வசனத்திலிருந்து தொடரும் வினையின் செயப்படுபொருளாக இப்பட்டியல் இருப்பதை இயல்பான தமிழில் ‘ஆகிய நகரங்களையும்’ வெளிப்படுத்துகிறது.
- source_word: גַּת
  choice: காத்
  rationale: யூதாவிலிருந்த இடத்தின் எபிரேயப் பெயரை நவீனத் தமிழில் ஒலிபெயர்த்த வடிவம்.
- source_word: מָרֵשָׁה
  choice: மரேசா
  rationale: எபிரேய இடப்பெயரின் ஒலியைத் தமிழில் இயல்பாகப் பிரதிபலிக்கும் வடிவம்.
- source_word: זִיף
  choice: சீப்
  rationale: எபிரேய இடப்பெயரான זִיף என்பதன் நீண்ட உயிரையும் இறுதி மெய்யையும் பிரதிபலிக்கும் தமிழ் ஒலிபெயர்ப்பு.
