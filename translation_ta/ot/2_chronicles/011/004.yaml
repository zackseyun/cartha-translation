- from: '“யாவே கூறுவது இதுவே: நீங்கள் படையெடுத்துச் செல்லாதீர்கள்; உங்கள் சகோதரர்களுக்கு எதிராகப் போரிடாதீர்கள்.[a] நீங்கள் ஒவ்வொருவரும் உங்கள் வீட்டுக்குத் திரும்புங்கள். ஏனெனில் இந்தக் காரியம் என்னிடமிருந்தே நிகழ்ந்தது.[b]” அவர்கள் யாவேயின் வார்த்தைகளுக்குச் செவிகொடுத்து, யெரொபெயாமுக்கு எதிராகச் செல்வதை விட்டுத் திரும்பினார்கள்.[c]'
  to: '“யாவே கூறுவது இதுவே: நீங்கள் மேலே செல்லாதீர்கள்; உங்கள் சகோதரர்களுக்கு எதிராகப் போரிடாதீர்கள்.[a] நீங்கள் ஒவ்வொருவரும் உங்கள் வீட்டுக்குத் திரும்புங்கள். ஏனெனில் இந்தக் காரியம் என்னிடமிருந்தே வந்தது.[b]” அவர்கள் யாவேயின் வார்த்தைகளுக்குச் செவிகொடுத்து, யெரொபெயாமுக்கு எதிராகச் செல்வதை விட்டுத் திரும்பினார்கள்.[c]'
  rationale: The revision restores the lexical force of ‘go up’ in the first prohibition and uses a more natural Tamil expression for the matter’s coming from Yahweh. It retains the draft’s faithful contextual rendering of hostile movement toward Jeroboam, with the more literal alternative preserved in the footnote.
