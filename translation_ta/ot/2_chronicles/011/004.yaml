base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
translation:
  language: ta
  text: '“யாவே கூறுவது இதுவே: நீங்கள் மேலே செல்லாதீர்கள்; உங்கள் சகோதரர்களுக்கு எதிராகப் போரிடாதீர்கள்.[a] நீங்கள் ஒவ்வொருவரும் உங்கள் வீட்டுக்குத் திரும்புங்கள். ஏனெனில் இந்தக் காரியம் என்னிடமிருந்தே வந்தது.[b]” அவர்கள் யாவேயின் வார்த்தைகளுக்குச் செவிகொடுத்து, யெரொபெயாமுக்கு எதிராகச் செல்வதை விட்டுத் திரும்பினார்கள்.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சகோதரர்கள்’ என்பது எதிர்ப்புறத்தில் இருப்பவர்களும் சக இஸ்ரவேலரே என்பதை வலியுறுத்துகிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “ஏனெனில் இந்த விவகாரம் என்னிடமிருந்து வந்தது.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “யெரொபெயாமிடம் செல்வதிலிருந்து திரும்பினார்கள்.” சூழலில் அது ஆயுத மோதலுக்காகச் செல்வதைக் குறிப்பதால், முதன்மை உரையில் “எதிராக” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் அதிகாரபூர்வமான தன்மையைத் தக்கவைத்தபடியே நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: לֹא תַעֲלוּ
  choice: நீங்கள் படையெடுத்துச் செல்லாதீர்கள்
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்’; இங்கு போருக்கான முன்னேற்றத்தைக் குறிக்கும் சூழலில், சொல்லுக்குச் சொல் மொழிபெயர்ப்பான ‘மேலே செல்லாதீர்கள்’ ஏற்படுத்தும் தெளிவின்மையைத் தவிர்த்து இராணுவச் சூழலை வெளிப்படுத்துகிறது.
- source_word: וְלֹא תִלָּחֲמוּ עִם אֲחֵיכֶם
  choice: உங்கள் சகோதரர்களுக்கு எதிராகப் போரிடாதீர்கள்
  rationale: לחם போரில் ஈடுபடுவதைக் குறிக்கிறது. עִם என்பதற்குச் சொற்பொருளாக ‘உடன்’ இருந்தாலும், போர்ச் சூழலில் எதிர்ப்புற உறவைத் தமிழில் ‘எதிராக’ என்று இயல்பாகக் கூற வேண்டும். ‘சகோதரர்கள்’ என்பது இஸ்ரவேலருக்கிடையேயான உறவைப் பாதுகாக்கிறது.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: நீங்கள் ஒவ்வொருவரும் உங்கள் வீட்டுக்குத் திரும்புங்கள்
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் வருவதால் ‘ஒவ்வொருவரும்’ என்று வழங்குவது பொருளைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: ஏனெனில் இந்தக் காரியம் என்னிடமிருந்தே நிகழ்ந்தது
  rationale: நிகழ்வின் தோற்றத்தையோ காரணத்தையோ கடவுளிடம் சார்த்தும் எபிரெயச் சொல்லமைப்பைப் பாதுகாக்கிறது; ‘-ஏ’ வலியுறுத்தல் מֵאִתִּי என்பதன் அழுத்தத்தை வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  choice: அவர்கள் யாவேயின் வார்த்தைகளுக்குச் செவிகொடுத்து
  rationale: שׁמע என்பது கேட்பதையும் கீழ்ப்படிவதையும் குறிக்கக்கூடும். அடுத்த செயல் அவர்களுடைய இணக்கத்தைக் காட்டுவதால், ‘செவிகொடுத்து’ இரு நுணுக்கங்களையும் மிகைப்படுத்தாமல் கொண்டுவருகிறது.
- source_word: וַיָּשֻׁבוּ מִלֶּכֶת אֶל יָרָבְעָם
  choice: யெரொபெயாமுக்கு எதிராகச் செல்வதை விட்டுத் திரும்பினார்கள்
  rationale: אֶל சொற்பொருளில் ‘நோக்கி/இடம்’ என்றாலும், சூழல் ஆயுத மோதலுக்காக யெரொபெயாமை நோக்கிச் செல்வதைச் சுட்டுகிறது. ‘எதிராக’ என்பது அந்தச் சூழற்பொருளைத் தெளிவாக்குகிறது; மாற்று நேரடி வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா / கர்த்தர்
  rationale: எபிரெய மெய்யெழுத்துப் பெயரின் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பைத் தமிழில் வெளிப்படையாகக் காட்டி, தனிப்பட்ட இறைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה என்பதில் இறைச் செயல்பாடு
  choice: இந்தக் காரியம் என்னிடமிருந்தே நிகழ்ந்தது
  alternative: இந்தக் காரியம் என்னிடமிருந்து வந்தது / இந்தக் காரியம் என்னால் நிகழ்ந்தது
  rationale: அரசியல் நிகழ்வை யாவே தம்மிடமிருந்து ஏற்பட்டதாகக் கூறும் மூலவாக்கின் வலிமையைப் பாதுகாக்கிறது; அதே நேரத்தில், காரணம் அல்லது அனுமதி பற்றிய விரிவான கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: שׁמע என்பதிலுள்ள கேட்டல்–கீழ்ப்படிதல் நுணுக்கம்
  choice: செவிகொடுத்து
  alternative: கீழ்ப்படிந்து / கேட்டு
  rationale: அவர்கள் கேட்டதையும் அதற்கேற்ப நடந்ததையும் ஒருங்கே உணர்த்துகிறது; மூலத்தில் உள்ள நுணுக்கத்தை ஒரே திசையில் மட்டும் முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் உள்ளது. தீர்க்கதரிசன அறிவிப்பின் அதிகாரத் தொனியும், சக இஸ்ரவேலரை ‘சகோதரர்கள்’ என அழைக்கும் உறவுமுறையும், நிகழ்வு யாவேயிடமிருந்து ஏற்பட்டது என்ற இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
