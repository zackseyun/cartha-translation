source:
  edition: WLC
  text: וְ/אֶת צָרְעָה֙ וְ/אֶת אַיָּל֔וֹן וְ/אֶת חֶבְר֔וֹן אֲשֶׁ֥ר בִּ/יהוּדָ֖ה וּ/בְ/בִנְיָמִ֑ן עָרֵ֖י מְצֻרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/010.yaml
  text: and Zorah[a], Aijalon, and Hebron, which are in Judah and in Benjamin[b], fortified cities.
translation:
  language: ta
  text: மேலும், யூதாவிலும் பென்யமீனிலும் உள்ள அரண்களால் பாதுகாக்கப்பட்ட நகரங்களான சோரா, அய்யாலோன், எப்ரோன் ஆகியவற்றையும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרְעָה
  choice: சோரா
  rationale: இது ஓர் இடப்பெயர்; எபிரெய ஒலிப்பை நவீனத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: אַיָּלוֹן
  choice: அய்யாலோன்
  rationale: இடப்பெயரின் எபிரெய மெய்யொலி இரட்டிப்பைத் தமிழில் தெளிவாகக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: חֶבְרוֹן
  choice: எப்ரோன்
  rationale: இது ஓர் இடப்பெயர்; வழக்கமான தமிழ் வேதாகமப் பெயர்வடிவத்துக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: אֲשֶׁר
  choice: இவை ... உள்ள
  rationale: பட்டியலிடப்பட்ட நகரங்களை விளக்கும் தொடர்புச் சொல்லின் பணியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִּיהוּדָה וּבְבִנְיָמִן
  choice: யூதாவிலும் பென்யமீனிலும்
  rationale: இரண்டு பெயர்களோடும் வரும் இடப்பொருள் முன்னொட்டுகளை ‘-இலும் ... -இலும்’ என்று காத்து, உடைமைக்குப் பதிலாக புவியியல் அமைவிடத்தைத் தெரிவிக்கிறது.
- source_word: עָרֵי מְצֻרוֹת
  choice: அரண்சூழ்ந்த நகரங்கள்
  rationale: பாதுகாப்புக்காக அரண் அமைக்கப்பட்ட நகரங்கள் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: மேலும் ... ஆகியவற்றையும்
  rationale: முந்தைய வசனத்திலிருந்து தொடரும் நேரடிச் செயப்படுபொருள் பட்டியலைத் தமிழில் இயல்பாகத் தொடர்கிறது; எபிரெய செயப்படுபொருள் குறியீட்டுக்குத் தனிச் சொல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ‘அரண்சூழ்ந்த நகரங்கள்’ என்ற இறுதித் தொடரின் பொருள் எல்லை
  choice: இவ்வசனத்தில் பெயரிடப்பட்ட நகரங்களை விளக்கும் பின்னிணைப்பாக வைத்தல்
  alternative: முந்தைய வசனங்கள் முதல் வரும் முழு நகரப் பட்டியலையும் சுருக்குவதாக எடுத்தல்
  rationale: எபிரெய தொடரமைப்பு இரு வாசிப்புகளுக்கும் இடமளிக்கக்கூடும். மொழிபெயர்ப்பு உடனடியாக முன்வரும் பெயர்களோடு இயல்பாக இணைக்கிறது; ஆனால் கோடிட்ட இடைநிறுத்தம் அதன் சுருக்கத் தன்மையைத் தேவையின்றி கடுமையாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்திலிருந்து தொடரும் பட்டியல் என்பதால் மூலத்தில் இல்லாத வினைச்சொல் சேர்க்கப்படவில்லை; கோடு இறுதி விளக்கத் தொடரைத் தெளிவுபடுத்துகிறது.
