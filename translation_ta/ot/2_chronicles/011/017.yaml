revisions:
- from: அதனால் அவர்கள் யூதாவின் அரசை வலுப்படுத்தி, சாலொமோனின் மகன் ரெகொபெயாமையும் மூன்று ஆண்டுகள் உறுதிப்படுத்தினார்கள்; ஏனெனில் மூன்று ஆண்டுகள் அவர்கள் தாவீதும் சாலொமோனும் நடந்த வழியில் நடந்தார்கள்.
  to: அதனால் அவர்கள் யூதா ராஜ்யத்தைப் பலப்படுத்தினார்கள்; சாலொமோனின் மகன் ரெகொபெயாமையும் மூன்று ஆண்டுகள் வலிமைப்படுத்தினார்கள். ஏனெனில், மூன்று ஆண்டுகள் அவர்கள் தாவீதும் சாலொமோனும் நடந்த வழியில் நடந்தார்கள்.
  rationale: The revision retains the Hebrew parallelism and repeated duration while using modern, natural Tamil verbs that accurately express strengthening both the kingdom and Rehoboam. The final clause preserves the biblical 'walked in the way' idiom and does not expand its restricted historical evaluation into a broader theological claim.
