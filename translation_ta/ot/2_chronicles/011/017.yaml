id: 2CH.11.17
reference: 2 Chronicles 11:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יְחַזְּקוּ֙ אֶת מַלְכ֣וּת יְהוּדָ֔ה וַֽ/יְאַמְּצ֛וּ אֶת רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה לְ/שָׁנִ֣ים שָׁל֑וֹשׁ כִּ֣י הָֽלְכ֗וּ בְּ/דֶ֧רֶךְ דָּוִ֛יד וּ/שְׁלֹמֹ֖ה לְ/שָׁנִ֥ים שָׁלֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
translation:
  language: ta
  text: அதனால் அவர்கள் யூதா ராஜ்யத்தைப் பலப்படுத்தினார்கள்; சாலொமோனின் மகன் ரெகொபெயாமையும் மூன்று ஆண்டுகள் வலிமைப்படுத்தினார்கள். ஏனெனில், மூன்று ஆண்டுகள் அவர்கள் தாவீதும் சாலொமோனும் நடந்த வழியில் நடந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  choice: வலுப்படுத்தி
  rationale: חזק என்பதன் பியேல் வடிவம் ‘வலிமையாக்குதல், உறுதிப்படுத்துதல்’ எனப் பொருள்படும். அரசை நிலைபெறச் செய்ததை இயல்பான தமிழில் தெரிவிக்க ‘வலுப்படுத்தி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מַלְכוּת יְהוּדָה
  choice: யூதாவின் அரசை
  rationale: מַלְכוּת என்பது அரசாட்சி அல்லது அரசு/ராஜ்யம் எனப் பொருள்படலாம். இங்கு அரசியல் ஆட்சியமைப்பு முன்னிலையில் இருப்பதால் ‘யூதாவின் அரசு’ பொருத்தமானது.
- source_word: וַיְאַמְּצוּ
  choice: உறுதிப்படுத்தினார்கள்
  rationale: אמץ என்பதன் பியேல் வடிவம் ‘வலிமையாக்குதல், உறுதிப்படுத்துதல், ஊக்கப்படுத்துதல்’ என்ற பொருள் தருகிறது. நேரடிப் பொருள் ரெகொபெயாம் என்பதால், வெறும் மன ஊக்கத்தைவிட அவரை ஆட்சியில் வலிமைப்படுத்தியதைக் காட்ட ‘உறுதிப்படுத்தினார்கள்’ பயன்படுத்தப்பட்டது; முந்தைய חזק உடனான ஒரே பொருட்களத்தைத் தக்கவைத்தபடி தமிழில் தேவையற்ற சொல் மீளுரையைத் தவிர்க்கிறது.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: சாலொமோனின் மகன் ரெகொபெயாம்
  rationale: மகன்-தந்தை உறவு தெளிவாகவும் இயல்பான தமிழ் சொல்வரிசையிலும் தரப்பட்டுள்ளது; பெயர்கள் வழக்கமான தமிழ் வேதாகம ஒலிபெயர்ப்பு வடிவில் உள்ளன.
- source_word: לְשָׁנִים שָׁלוֹשׁ
  choice: மூன்று ஆண்டுகள்
  rationale: לְ உடனான காலநீட்சி இயல்பான தமிழில் ‘மூன்று ஆண்டுகள்’ என வழங்கப்படுகிறது. எபிரெயத்தில் இருமுறை வரும் காலக்குறிப்பு இருமுறையும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வலுப்படுத்துதலுக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாகக் கொள்ளப்பட்டது.
- source_word: הָלְכוּ
  choice: நடந்தார்கள்
  rationale: הלך + ‘வழியில்’ என்ற நடத்தை சார்ந்த உருவகத்தை விளக்கவுரையாக்காமல் நேரடியாகத் தக்கவைக்கிறது; நவீன தமிழிலும் புரியத்தக்கது.
- source_word: בְּדֶרֶךְ דָּוִיד וּשְׁלֹמֹה
  choice: தாவீதும் சாலொமோனும் நடந்த வழியில்
  rationale: எபிரெயத்தின் ஒருமை ‘வழி’ தக்கவைக்கப்பட்டுள்ளது. தமிழ் தெளிவிற்காக அந்த வழியை இருவரும் நடந்த வழியாக வெளிப்படுத்துகிறது; அவர்களுடைய வாழ்வு முழுவதையும் பற்றிய கூடுதல் மதிப்பீடு சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ‘தாவீதும் சாலொமோனும் நடந்த வழி’ என்பதன் மதிப்பீடு
  choice: உருவகத்தை விரிவாக்காமல், மூன்று ஆண்டுகள் என்ற வரையறுக்கப்பட்ட காலத்தோடு அப்படியே தக்கவைத்தல்
  alternative: ‘தாவீதும் சாலொமோனும் செய்ததுபோல் அவர்கள் ஆண்டவருக்கு உண்மையாயிருந்தார்கள்’ என்று விளக்கிப் பொழிப்புரை செய்தல்
  rationale: மூலவசனம் அந்தக் குறிப்பிட்ட மூன்று ஆண்டுகளுக்கான சாதகமான வரலாற்று மதிப்பீட்டை மட்டுமே தருகிறது. வாழ்நாள் முழுவதுமான அல்லது முழுமையான நீதியை அது கூறுவதாக விரிவுபடுத்தக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதும். எபிரெயத்தில் இருமுறை வரும் ‘மூன்று ஆண்டுகள்’ வலியுறுத்தலைத் தக்கவைத்துள்ளது. חזק மற்றும் אמץ ஆகிய நெருங்கிய வினைகளுக்கு ‘வலுப்படுத்தி / உறுதிப்படுத்தினார்கள்’ என வேறுபடுத்தி, பொருள் உறவைப் பாதுகாத்தபடி தமிழ் மீளுரையைத் தவிர்த்துள்ளது.
