    text: அல்லது, “அரணமைக்கப்பட்ட நகரங்கள்” அல்லது “அரண்களாகிய நகரங்கள்.” எபிரெயத்தில் நேரடியாக, “அரணமைப்புக்கான நகரங்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: வசித்தான்
  rationale: ישב என்பது இச்சூழலில் ‘வாழ்தல்/குடியிருத்தல்’ என்ற பொருளைத் தருகிறது. ‘வசித்தான்’ என்பது நவீனத் தமிழில் இயல்பாகவும், எருசலேமில் ரெகொபெயாம் தங்கியிருந்ததையும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இது இடத்தைக் குறிக்கும் நேரடியான முன்னொட்டுத் தொடர்; தமிழ் வேதாகம மரபில் பரவலாக அறியப்படும் பெயர்வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּבֶן
  choice: கட்டினான்
  rationale: בנה என்பதன் அடிப்படைப் பொருள் ‘கட்டு’ என்பதே. இராணுவச் சூழல் இருந்தாலும், வினைச்சொல்லையே ‘அரணாக்கினான்’ என்று மாற்றாமல் மூலத்தின் வேறுபாடு காக்கப்பட்டுள்ளது.
- source_word: עָרִים
  choice: நகரங்களை
  rationale: עִיר என்பதன் பன்மைக்கு ‘நகரங்கள்’ என்பது நிலையான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: לְמָצוֹר
  choice: பாதுகாப்புக்காக
  rationale: מָצוֹר இங்கு நகரங்கள் கட்டப்பட்ட தற்காப்பு அல்லது அரணமைப்புச் சார்ந்த நோக்கத்தைக் குறிக்கிறது. ‘பாதுகாப்புக்காக’ என்பது அதன் செயல்நோக்கைத் தெளிவாகச் சொல்கிறது; நகரங்கள் ஏற்கெனவே இருந்தன என்று கருத வைக்கும் ‘அரணாக்கினான்’ என்ற மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: בִּיהוּדָה
  choice: யூதாவில்
  rationale: நகரங்கள் கட்டப்பட்ட பகுதியைக் குறிக்கும் நேரடியான இடவுரை.
