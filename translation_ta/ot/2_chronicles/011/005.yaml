  yaml_path: translation/ot/2_chronicles/011/005.yaml
  text: Rehoboam lived in Jerusalem[a], and he built fortified cities in Judah.
translation:
  language: ta
  text: ரெகொபெயாம் எருசலேமில் வசித்தான்; அவன் யூதாவில் பாதுகாப்புக்காக[a] நகரங்களைக் கட்டினான்.
  philosophy: optimal-equivalence
