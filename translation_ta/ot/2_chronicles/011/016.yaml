  source_fidelity: மூல எபிரெய உரையின் தொடர்ச்சிக் குறிப்பு (‘அவர்களுக்குப் பின்பு’), இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் என்ற பரப்பு, யாவேவைத் தேடுவதற்கான மனஉறுதியான நோக்கம், எருசலேமுக்கு வந்ததன் பலிநோக்கம், மற்றும் ‘தங்கள் தந்தையரின் கடவுள்’ என்ற உடன்படிக்கைச் சொற்றொடர் ஆகிய அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. בָּאוּ என்பதற்கான ‘வந்தார்கள்’ என்ற தேர்வு சூழலுக்கு ஏற்றது; மாற்று வாசிப்பு அடிக்குறிப்பில் உரியவாறு தரப்பட்டுள்ளது.
  naturalness: நடை நவீன பொதுத்தமிழில் தெளிவாகவும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியத்துடனும் உள்ளது. ‘கோத்திரங்கள்,’ ‘உள்ளத்தை உறுதியாகச் செலுத்தியவர்கள்,’ ‘பலியிட’ ஆகியவை பொருளைச் செயற்கையில்லாமல் வெளிப்படுத்துகின்றன.
