source:
  edition: WLC
  text: וְ/אַחֲרֵי/הֶ֗ם מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל הַ/נֹּֽתְנִים֙ אֶת לְבָבָ֔/ם לְ/בַקֵּ֕שׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בָּ֚אוּ יְר֣וּשָׁלִַ֔ם לִ/זְבּ֕וֹחַ לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
translation:
  language: ta
  text: அவர்களுக்குப் பின்பு, இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும், இஸ்ரவேலின் கடவுளாகிய யாவேவைத் தேடத் தங்கள் உள்ளத்தை உறுதியாகச் செலுத்தியவர்கள்[a], தங்கள் தந்தையரின் கடவுளாகிய யாவேவுக்குப் பலியிட எருசலேமுக்கு வந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘தங்கள் இருதயத்தை அளித்தவர்கள்’; இம்மரபுத்தொடர் யாவேவைத் தேடுவதில் தங்கள் உள்ளத்தை நிலைநிறுத்தியதை அல்லது அர்ப்பணித்ததைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘எருசலேமுக்குச் சென்றார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ஒரே வினைச்சொல் கதைசொல்லும் நோக்குநிலைக்கேற்ப ‘வருதல்’ அல்லது ‘செல்லுதல்’ என்ற பொருளில் பயன்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  choice: அவர்களுக்குப் பின்பு
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களைத் தொடர்ந்து நிகழ்ந்ததை וְ மற்றும் אַחֲרֵי காட்டுவதால், தொடர்ச்சியும் காலமுறையும் இயல்பான தமிழில் பாதுகாக்கப்படுகின்றன.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும்
  rationale: מִן பிறப்பிடம் அல்லது வந்த இடத்தைக் குறிக்கிறது; כֹּל என்பதன் முழுமையான பரப்பையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: הַנֹּתְנִים אֶת לְבָבָם
  choice: தங்கள் உள்ளத்தை உறுதியாகச் செலுத்தியவர்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘தங்கள் இருதயத்தை அளித்தவர்கள்.’ இங்கு அது உள்ளார்ந்த விருப்பத்தையும் மனவுறுதியையும் யாவேவைத் தேடுவதில் நிலைநிறுத்துவதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: לְבַקֵּשׁ
  choice: தேட
  rationale: இந்த இறைசார்ந்த சூழலில் בקש என்பது வெறுமனே கண்டுபிடிக்க முயல்வதை அல்ல, கடவுளை நாடுவதைக் குறிக்கிறது; ‘தேட’ நேரடியானதும் இயல்பானதும் ஆகும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது கடவுளின் தனிப்பட்ட உடன்படிக்கைப் பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது; அதற்குப் பதிலாக ஒரு பட்டப்பெயர் இடப்படவில்லை.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: யாவேவை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்தும் எபிரெய இணைநிலைச் சொற்றொடரை நேரடியாக வழங்குகிறது.
- source_word: בָּאוּ יְרוּשָׁלִַם
  choice: எருசலேமுக்கு வந்தார்கள்
  rationale: בוא என்பது கதைசொல்லும் நோக்குநிலைக்கேற்ப ‘வந்தார்கள்’ அல்லது ‘சென்றார்கள்’ என்று அமையலாம்; இங்கு எருசலேமை மையமாகக் கொண்ட நோக்குநிலைக்கு ‘வந்தார்கள்’ இயல்பாக உள்ளது.
- source_word: לִזְבּוֹחַ
  choice: பலியிட
  rationale: לְ முன்னொட்டுடன் வரும் வினையெச்சம் எருசலேமுக்கு வந்த நோக்கத்தைக் குறிக்கிறது; ‘பலியிட’ சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: தங்கள் தந்தையரின் கடவுள்
  rationale: אֲבוֹתֵיהֶם என்பதன் ஆண்பால் பன்மை வடிவையும் உடன்படிக்கைச் சொற்றொடரின் தன்மையையும் ‘தந்தையர்’ பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது. ‘யாவே’ என்ற ஒலிபெயர்ப்பு அந்தப் பெயரைப் பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது.
- issue: אֱלֹהֵי אֲבוֹתֵיהֶם என்ற பாலினம் குறிக்கப்பட்ட உடன்படிக்கைச் சொற்றொடர்
  choice: தங்கள் தந்தையரின் கடவுள்
  alternative: தங்கள் முன்னோர்களின் கடவுள்
  rationale: எபிரெயம் வெளிப்படையாக ‘தந்தையர்’ என்ற ஆண்பால் பன்மையைப் பயன்படுத்துவதால், பாலினத்தைப் பொதுமைப்படுத்தாமல் அதைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும், அதேவேளையில் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘கோத்திரம்,’ ‘பலியிடுதல்’ போன்ற சூழலுக்குரிய சொற்கள் துல்லியத்திற்காக வைக்கப்பட்டுள்ளன; எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல் கடினமாக ஒலிக்காமல் அதன் நோக்கத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது.
