translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. திட்டமிட்ட நிர்வாகப் பகிர்வைக் காட்ட ‘பிரித்து அமர்த்தினான்’ என்றும், நிர்வாகப் பகுதிகளைக் காட்ட ‘பிரதேசங்கள்’ என்றும் தேர்ந்தெடுக்கப்பட்டுள்ளது. மூலத்தில் வெளிப்படையாக இல்லாத ‘அவர்களுக்காக’ என்பது சூழலிலிருந்து நிரப்பப்பட்டதால் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
