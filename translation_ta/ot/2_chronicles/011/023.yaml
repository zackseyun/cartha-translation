base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
translation:
  language: ta
  text: அவன் விவேகத்துடன் செயல்பட்டான்[a]; தன் மகன்களில் சிலரை யூதா, பென்யமீன் பிரதேசங்கள் எங்குமுள்ள அரணமைந்த நகரங்கள் அனைத்திலும் பிரித்து அமர்த்தினான்[b]. அவர்களுக்கு ஏராளமான உணவுப்பொருள்களைக் கொடுத்து, அவர்களுக்காகப் பல மனைவிகளைத் தேடினான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘புரிந்துகொண்டு செயல்பட்டான்’ அல்லது ‘பகுத்தறிவைக் காட்டினான்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எல்லா மகன்களும் ஒவ்வோர் இடத்திற்கும் அனுப்பப்பட்டார்கள் என்பது பொருளல்ல; தன் மகன்களில் சிலரை வெவ்வேறு அரணமைந்த நகரங்களில் அவன் அமர்த்தினான் என்பதே எபிரேயத் தொடரின் சாத்தியமான பொருள்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘பல மனைவிகளைத் தேடினான்.’ மகன்களுக்காகத் திருமணங்களை ஏற்பாடு செய்தான் என்பதே இங்கு சாத்தியமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: விவேகத்துடன் செயல்பட்டு
  rationale: בין என்பதன் இவ்வடிவம் புரிந்துகொள்வதை மட்டுமல்லாமல், புரிதலோடும் பகுத்தறிவோடும் செயல்படுவதையும் குறிக்கலாம். அரச நிர்வாகச் சூழலில் இந்தத் தமிழ் சொற்றொடர் இயல்பாக அந்தப் பொருளை வெளிப்படுத்துகிறது.
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  choice: தன் மகன்களில் சிலரை ... பிரித்து அமர்த்தினான்
  rationale: פרץ இங்கு பல இடங்களுக்குப் பரப்புதல் அல்லது பிரித்தனுப்புதல் என்ற பொருளில், இடங்களைக் குறிக்கும் தொடரோடு வருகிறது. מן + כל בניו என்பதன் பகுதிப்பொருளை ‘மகன்களில் சிலரை’ என்பது காட்டுகிறது; சூழல் திட்டமிட்ட நிர்வாக நியமிப்பைக் காட்டுவதால் ‘அமர்த்தினான்’ சேர்க்கப்பட்டுள்ளது.
- source_word: לְכָל אַרְצוֹת יְהוּדָה וּבִנְיָמִן
  choice: யூதா, பென்யமீன் பிரதேசங்கள் எங்கும்
  rationale: אֲרָצוֹת இங்கு தனித்தனி நாடுகளைக் காட்டாமல் யூதா, பென்யமீன் பகுதிகளின் நிலப்பரப்புகள் அல்லது பிரதேசங்களைக் குறிக்கிறது.
- source_word: לְכֹל עָרֵי הַמְּצֻרוֹת
  choice: அரண்சூழ்ந்த நகரங்களிலெல்லாம்
  rationale: מְצֻרוֹת என்பது பாதுகாப்பு அரண்களால் வலுப்படுத்தப்பட்ட நகரங்களைக் குறிக்கிறது. ‘அரண்சூழ்ந்த நகரங்கள்’ நவீன தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  choice: அவர்களுக்கு ஏராளமான உணவுப்பொருள்களைக் கொடுத்து
  rationale: מָזוֹן உணவு, வாழ்வாதாரப் பொருள் அல்லது உணவுவகை ஏற்பாட்டைக் குறிக்கிறது; לָרֹב மிகுதியைக் குறிக்கிறது.
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  choice: அவர்களுக்காகப் பல மனைவிகளைத் தேடினான்
  rationale: שׁאל கேட்பது, நாடுவது அல்லது தேடுவது எனப் பொருள்படும். முந்தைய பன்மைச் சுட்டின் சூழலால், மகன்களுக்குத் திருமண ஏற்பாடு செய்தான் என்ற பொருளில் ‘அவர்களுக்காக’ வெளிப்படையாகத் தரப்பட்டுள்ளது; சொற்பொருளின் திறந்த தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
