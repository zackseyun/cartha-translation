base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
translation:
  language: ta
  text: ரெகொபெயாம் எருசலேமுக்கு வந்து, யூதா மற்றும் பென்யமீன் வம்சத்தாரை[a]—போரிடத் தேர்ந்தெடுக்கப்பட்ட ஒரு இலட்சத்து எண்பதாயிரம் வீரர்களை[b]—இஸ்ரவேலுக்கு எதிராகப் போரிட்டு, ராஜ்யத்தை ரெகொபெயாமிடம் மீட்டுக் கொண்டுவருவதற்காகத் திரட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘யூதா மற்றும் பென்யமீன் வீட்டார்’; இது அந்த இரு கோத்திரங்களையும் சேர்ந்த மக்களைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘போரிடத் தகுதியுள்ள தேர்ந்தெடுக்கப்பட்ட ஆண்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தபோது
  rationale: בוא என்பதன் இயல்பான கதைநடைப் பொருளான ‘வந்து/அடைந்து’ என்பதை, அடுத்த செயலை இணைக்கும் தமிழ்ச் சொற்றொடராக வழங்குகிறது.
- source_word: יְרוּשָׁלִַם
  choice: எருசலேம்
  rationale: தமிழில் பரவலாக அறியப்பட்ட இடப்பெயர் வடிவம்.
- source_word: וַיַּקְהֵל
  choice: ஒன்றுதிரட்டினான்
  rationale: קהל என்பதன் Hiphil வடிவம் மக்களை, குறிப்பாகப் படையினரை, திரட்டுவதைக் குறிக்கிறது; இச்சூழலில் ‘ஒன்றுதிரட்டினான்’ இயல்பாக உள்ளது.
- source_word: בֵּית יְהוּדָה וּבִנְיָמִן
  choice: யூதா மற்றும் பென்யமீன் வம்சத்தார்
  rationale: בֵּית என்பதன் குடும்பம்/வம்சம்/கூட்டமைப்பு சார்ந்த பொருளைப் பாதுகாத்து, தெற்கு அரசின் இரு கோத்திர மக்களையும் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: ஒரு இலட்சத்து எண்பதாயிரம்
  rationale: எண்ணிக்கையை நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: בָּחוּר
  choice: தேர்ந்தெடுக்கப்பட்ட
  rationale: இராணுவச் சூழலில் இச்சொல் வெறுமனே ‘இளைஞர்’ என்பதைக் காட்டிலும் தேர்ந்தெடுக்கப்பட்ட அல்லது சிறந்த வீரர்களைக் குறிக்கலாம்.
- source_word: עֹשֵׂה מִלְחָמָה
  choice: போர்வீரர்கள்
  rationale: சொல்லுக்கு சொல் ‘போர் செய்பவர்கள்’; ‘போர்வீரர்கள்’ அதன் இராணுவப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராகப் போரிட்டு
  rationale: பகைமைச் சூழலில் עִם என்பது எதிர்த்துப் போரிடுதலைக் குறிக்கிறது; தமிழ் சொற்றொடர் அந்த உறவைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְהָשִׁיב
  choice: திரும்பக் கொண்டுவருவதற்காக
  rationale: שוב என்பதன் Hiphil வடிவிலுள்ள ‘மீண்டும் வரச்செய்தல்’ என்ற காரணவினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: הַמַּמְלָכָה
  choice: ராஜ்யத்தை
  rationale: מַמְלָכָה குறிக்கும் அரசியல் ஆட்சிப்பரப்பையும் அரசையும் உள்ளடக்கும் வழக்கமான வேதாகமத் தமிழ்ச் சொல்.
- source_word: לִרְחַבְעָם
  choice: ரெகொபெயாமிடம்
  rationale: லாமேத் முன்னொட்டு காட்டும் பெறுநர்/இலக்கு நுணுக்கத்தைப் பாதுகாக்கிறது; மூலத்தில் பெயர் மீண்டும் வருவதையும் தக்கவைக்கிறது.
theological_decisions:
- issue: அரசுப் பிரிவுக்குப் பின் ‘இஸ்ரவேல்’ என்பதன் குறிப்பு
  choice: மூலத்தில் உள்ளபடியே ‘இஸ்ரவேல்’ என்று வைத்தல்
  alternative: வடக்குக் கோத்திரங்கள் / இஸ்ரவேல் கலகக்காரர்கள்
  rationale: எபிரெய உரையே எதிர் அரசியல் அமைப்பை ‘இஸ்ரவேல்’ என்று அழைக்கிறது. விளக்கச் சொற்களைச் சேர்க்காமல் இருப்பது நாளாகம ஆசிரியரின் சொல்லாட்சியையும் வரலாற்று-இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
- issue: ராஜ்யம் யாரிடம் மீட்கப்பட வேண்டும் என்பதன் வெளிப்பாடு
  choice: ‘ரெகொபெயாமிடம்’ என்று மூன்றாம் நபர் பெயரை மீண்டும் கூறுதல்
  alternative: ‘தன்னிடம்’ / ‘அவனிடம்’
  rationale: மூல எபிரெயம் ரெகொபெயாமின் பெயரை மீண்டும் கூறுகிறது; அதை இயல்பாக்கி மறைக்காமல் தக்கவைத்துள்ளது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியத்தை வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரித்தாலும், நோக்கம், படையணி, எதிரி, ராஜ்யத்தை மீட்கும் இலக்கு ஆகிய தொடர்புகள் மாறாமல் வைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
