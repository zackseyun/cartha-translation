- from: ரெகொபெயாம் எருசலேமுக்கு வந்தபோது, யூதா மற்றும் பென்யமீன் வம்சத்தாரை[a]—தேர்ந்தெடுக்கப்பட்ட போர்வீரர்கள்[b] ஒரு இலட்சத்து எண்பதாயிரம் பேரை—ஒன்றுதிரட்டினான். இஸ்ரவேலுக்கு எதிராகப் போரிட்டு, ராஜ்யத்தை ரெகொபெயாமிடம் திரும்பக் கொண்டுவருவதற்காக அவன் அவர்களை ஒன்றுதிரட்டினான்.
