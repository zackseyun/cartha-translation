base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/013.yaml
  text: And the priests and the Levites who were in all Israel took their stand with him from all their territories[a].
translation:
  language: ta
  text: இஸ்ரவேல் முழுவதிலும் இருந்த ஆசாரியர்களும் லேவியர்களும் தங்கள் எல்லாப் பகுதிகளிலிருந்தும் அவன் பக்கம் நின்றார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனிடம் தங்களை முன்னிறுத்தினார்கள்” அல்லது “அவன் முன்னிலையில் நின்றார்கள்.” எபிரெயச் சொற்றொடர் அவன் முன்னிலையில் நேரில் நிற்பதையோ அவன் பக்கம் சேர்வதையோ குறிக்கலாம்; சூழல் பிந்தைய பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֹּהֲנִים
  choice: ஆசாரியர்களும்
  rationale: இணைப்புச் சொல்லையும் வரையறுத்த பன்மைப் பெயரையும் இயல்பான தமிழ் வாக்கிய அமைப்பில் காட்டுகிறது.
- source_word: וְהַלְוִיִּם
  choice: லேவியர்களும்
  rationale: லேவிய வழிவந்த பணியாளர் வகுப்புக்கான வழக்கமான தமிழ் வேதாகமப் பெயரைப் பயன்படுத்துகிறது.
- source_word: אֲשֶׁר בְּכָל יִשְׂרָאֵל
  choice: இஸ்ரவேல் நாடெங்கும் இருந்த
  rationale: அவர்கள் இஸ்ரவேல் முழுவதிலும் பரவியிருந்ததைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הִתְיַצְּבוּ עָלָיו
  choice: அவனுக்கு ஆதரவாக நின்றார்கள்
  rationale: இந்த எபிரெயச் சொற்றொடர் நேரில் வந்து நிற்பதையோ ஒருவரின் பக்கம் உறுதியாக நிற்பதையோ குறிக்கலாம்; சூழலில் ரெகொபெயாமுக்கு விசுவாசமாக இணைந்ததைக் காட்டும் பொருள் முன்னிலை பெறுகிறது.
- source_word: מִכָּל גְּבוּלָם
  choice: தங்கள் எல்லாப் பகுதிகளிலிருந்தும்
  rationale: גְּבוּל இங்கு எல்லைக்கோடுகளைவிட அவர்கள் வாழ்ந்த பிரதேசங்கள் அல்லது பகுதிகளைக் குறிக்கிறது; தமிழில் ‘பகுதிகள்’ இயல்பான புவியியல் பொருளைத் தருகிறது.
theological_decisions:
- issue: הִתְיַצְּבוּ עָלָיו என்ற சொற்றொடரில் உடல்ரீதியான முன்னிலை அல்லது அரசியல்-விசுவாச ஆதரவு
  choice: அவனுக்கு ஆதரவாக நின்றார்கள்
  alternative: அவனிடம் வந்து நின்றார்கள் / அவன் முன்னிலையில் நின்றார்கள்
  rationale: அடுத்தடுத்த சூழல் அவர்கள் ரெகொபெயாமின் பக்கம் சேர்ந்ததைக் காட்டுவதால் ஆதரவு என்ற நுண்பொருள் முதன்மைப்படுத்தப்படுகிறது; எனினும் மூலத்தின் இயல்பான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; மரியாதையும் தெளிவும் கொண்ட இயல்பான நடை. ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன. ‘வந்து’ என்பது מִן (‘இருந்து’) மற்றும் பிரதான வினையின் இயக்கச் சூழலை தமிழில் இயல்பாக்குகிறது.
