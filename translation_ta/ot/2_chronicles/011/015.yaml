  text: וַ/יַּֽעֲמֶד ל/וֹ֙ כֹּֽהֲנִ֔ים לַ/בָּמ֖וֹת וְ/לַ/שְּׂעִירִ֑ים וְ/לָ/עֲגָלִ֖ים אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
translation:
  language: ta
  text: அவன் தனக்கென மேட்டு வழிபாட்டு இடங்களுக்கும், வெள்ளாட்டுப் பேய்களுக்கும்[a], தான் செய்த கன்றுக்குட்டிகளுக்கும் ஆசாரியர்களை நியமித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை ‘வெள்ளாடுகள்’ அல்லது ‘சாட்டியர்கள்’ என்றும் மொழிபெயர்க்கலாம். இச்சூழலில், முறைகேடான வழிபாட்டுடன் தொடர்புடைய வெள்ளாட்டுருவ அமானுஷ்ய உயிர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֶד
  choice: நியமித்தான்
  rationale: ஆசாரியர்களைப் பணியில் அமர்த்தியதைக் குறிக்கும் இப்பிறவினைச் சூழலில், வெறுமனே ‘நிற்கச் செய்தான்’ என்பதல்லாமல் பதவிக்கு நியமித்தான் என்பதே பொருத்தம்.
- source_word: לּוֹ
  choice: தனக்கென
  rationale: எரோபெயாம் தன் சொந்த வழிபாட்டு அமைப்பிற்காகச் செய்த செயலை இயல்பான தமிழில் பிரதிபலிக்கிறது.
- source_word: כֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: வழிபாட்டுப் பணிக்குரிய பதவியைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: לַבָּמוֹת
  choice: மேட்டு வழிபாட்டிடங்களுக்கு
  rationale: במות என்பது உயரமான இடங்களில் அல்லது மேடுகளில் அமைந்த வழிபாட்டுத் தலங்களைக் குறிக்கும்; ‘மேடைகள்’ என்று மட்டும் கூறுவதால் ஏற்படும் தெளிவின்மையை இத்தேர்வு தவிர்க்கிறது.
- source_word: לַשְּׂעִירִים
  choice: வெள்ளாட்டுருவப் பேய்களுக்கு
  rationale: முறைகேடான வழிபாட்டுப் பொருட்கள் பட்டியலிடப்படும் இச்சூழலில், சொல் சாதாரண வெள்ளாடுகளைக் காட்டிலும் வெள்ளாட்டைப் போன்ற அமானுஷ்ய வழிபாட்டு உருவங்களைக் குறிக்க வாய்ப்பு அதிகம்; எபிரெய உருவகத்தைத் தமிழிலும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: וְלָעֲגָלִים
  choice: கன்றுக்குட்டிச் சிலைகளுக்கு
  rationale: அடிப்படைப் பெயர் ‘கன்றுக்குட்டிகள்’ என்றாலும், அவை செய்யப்பட்டவை என்றும் வழிபாட்டுக்குரிய பட்டியலில் வருவதாலும் உயிருள்ள விலங்குகள் அல்ல, கன்றுக்குட்டி உருவச் சிலைகள் என்பது தமிழில் தெளிவாக்கப்படுகிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: தான் செய்த
  rationale: அவன் முன்பே உருவாக்கிய கன்றுக்குட்டிச் சிலைகளைக் குறிக்கும் சார்புத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: விக்கிரக வழிபாட்டுச் சூழலில் שְׂעִירִים என்பதன் பொருள்
  choice: வெள்ளாட்டுருவப் பேய்கள்
  alternative: வெள்ளாடுகள்; வெள்ளாட்டைப் போன்ற காட்டுத் தெய்வ உருவங்கள்
  rationale: அங்கீகரிக்கப்படாத வழிபாட்டிடங்களும் உருவங்களும் பட்டியலிடப்படுவதால், சாதாரண விலங்குகளைவிட வெள்ளாட்டைப் போன்ற அமானுஷ்ய வழிபாட்டு உருவங்களே இங்கு குறிக்கப்படுகின்றன. அதேவேளை, மூலச்சொல்லின் உருவகத் தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மேட்டு வழிபாட்டிடங்கள்’ என்பது பாரம்பரியமான ‘மேடைகள்’ என்பதைக் காட்டிலும் இன்றைய வாசகருக்கு வழிபாட்டுச் சூழலைத் தெளிவாக்குகிறது; ‘வெள்ளாட்டுருவப் பேய்கள்’ மூலத்தின் அசாதாரண உருவகத்தையும் கருத்துத் தெளிவின்மையையும் அடிக்குறிப்புடன் பாதுகாக்கிறது.
