revisions:
- from: அவன் தனக்கென மேட்டு வழிபாட்டிடங்களுக்கும், வெள்ளாட்டுருவப் பேய்களுக்கும்[a], தான் செய்த கன்றுக்குட்டிச் சிலைகளுக்கும் ஆசாரியர்களை நியமித்தான்.
  to: அவன் தனக்கென மேட்டு வழிபாட்டு இடங்களுக்கும், வெள்ளாட்டுப் பேய்களுக்கும்[a], தான் செய்த கன்றுக்குட்டிகளுக்கும் ஆசாரியர்களை நியமித்தான்.
  rationale: The revision improves modern Tamil flow and preserves the source-level distinction between the plain noun “calves” and the contextual inference that they were cult objects. It retains “goat-demons” as the likely contextual sense of שְׂעִירִים while the footnote records viable alternatives without importing a culturally specific interpretation.
