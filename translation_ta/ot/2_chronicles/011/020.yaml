base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
translation:
  language: ta
  text: அவளுக்குப் பிறகு, அவன் அப்சலோமின் மகளான[a] மாக்காவை மணந்துகொண்டான். அவள் அவனுக்கு அபியா, அத்தாய், சீசா, செலோமித் ஆகியோரைப் பெற்றெடுத்தாள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘அப்சலோமின் மகள்.’ இச்சொல் சில சமயங்களில் தொலைவான பெண் வழித்தோன்றலையும் குறிக்கலாம்; எனவே சிலர் இதை ‘அப்சலோமின் பேத்தி’ என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  choice: அவளுக்குப் பிறகு
  rationale: ‘பிறகு’ என்பதுடன் இணைந்த மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டு, முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மனைவியைக் குறிக்கிறது; ஆகவே பாலினச் சுட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לָקַח
  choice: மணந்துகொண்டான்
  rationale: அடிப்படைப் பொருள் ‘எடுத்துக்கொண்டான்’ என்றாலும், இங்கு ஒரு பெண்ணை மனைவியாக ஏற்ற திருமணச் சூழல் தெளிவாக இருப்பதால், நவீன தமிழில் இயல்பாகவும் துல்லியமாகவும் ‘மணந்துகொண்டான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מַעֲכָה
  choice: மாகாள்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: בַּת אַבְשָׁלוֹם
  choice: அப்சலோமின் மகளாகிய
  rationale: எபிரெய உரை நேரடியாக ‘அப்சலோமின் மகள்’ என்று கூறுவதால் அது முதன்மை உரையில் பாதுகாக்கப்படுகிறது; வம்சவரிசைச் சூழலில் தொலைவான பெண் வழித்தோன்றலையும் குறிக்கக்கூடிய சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַתֵּלֶד לוֹ
  choice: அவள் அவனுக்கு … பெற்றாள்
  rationale: ‘அவள் அவனுக்குப் பெற்றெடுத்தாள்’ என்ற எபிரெய அமைப்பை இயல்பான தமிழில் வழங்குகிறது.
- source_word: אֶת אֲבִיָּה וְאֶת עַתַּי וְאֶת זִיזָא וְאֶת שְׁלֹמִית
  choice: அபியா, அத்தாய், சீசா, செலோமித் ஆகியோரை
  rationale: தனிப்பெயர்கள் எபிரெய ஒலிப்பை அடிப்படையாகக் கொண்டு தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; மீண்டும் வரும் நேரடி செயப்படுபொருள் குறியீடுகள் தமிழில் தனித்தனியாகக் காட்டப்படவில்லை.
theological_decisions:
- issue: மாகாள் ‘அப்சலோமின் மகள்’ என்று குறிப்பிடப்படுதல்
  choice: முதன்மை உரையில் ‘அப்சலோமின் மகள்’ என்ற நேரடிப் பொருளைப் பாதுகாத்தல்
  alternative: அப்சலோமின் பேத்தி அல்லது பெண் வழித்தோன்றல்
  rationale: எபிரெய உரை வெளிப்படையாக ‘மகள்’ என்கிறது. எனினும், வம்சவரிசை மொழியில் இந்த உறவுச்சொல் சில சமயங்களில் தொலைவான வழித்தோன்றலைக் குறிக்கலாம்; அந்த விளக்கச் சாத்தியத்தை முதன்மை உரையில் தீர்மானிக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. எபிரெய வாக்கியத்தின் பெண்பால் சுட்டும் வம்சவரிசைச் சொல்லின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
