  register: நவீன நிலையான தமிழில், முந்தைய வசனத்திலிருந்து தொடரும் பட்டியல் அமைப்பு காக்கப்பட்டுள்ளது. இடப்பெயர்கள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன; வசனத் துணுக்கு தொடர்வதைக் காட்ட இறுதியில் அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
