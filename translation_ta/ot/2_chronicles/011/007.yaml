translation:
  language: ta
  text: பெத்-சூர்[a], சோகோ, அதுல்லாம் ஆகியவற்றையும்;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: “பெத்-சூர் … சோகோ … அதுல்லாம்.” வேதாகம மொழிபெயர்ப்புகளில் இவ்விடப்பெயர்களின் எழுத்துப்பெயர்ப்புகள் மாறுபடலாம்; “சோகோஹ்” என்பது “சோகோ” என்பதற்கான மற்றொரு பொதுவான வடிவம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: ஆகியவற்றையும்
  rationale: וְ உடன் வரும் நேரடிச் செயப்படுபொருள் குறியீடான אֶת, முந்தைய வசனத்திலிருந்து தொடரும் இடப்பெயர்ப் பட்டியலின் ஒவ்வொரு உறுப்பையும் அறிமுகப்படுத்துகிறது. தமிழில் பட்டியலின் இறுதியில் ‘ஆகியவற்றையும்’ என்பது இணைப்பையும் செயப்படுபொருள் உறவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּית צוּר
  choice: பெத்-சூர்
  rationale: இது ஓர் இடப்பெயர். அதன் சொற்பொருளை மொழிபெயர்க்காமல், எபிரெய உச்சரிப்புக்கு அருகான முறையில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שׂוֹכוֹ
  choice: சோகோ
  rationale: இது ஓர் இடப்பெயர். எபிரெய வடிவில் உள்ள முதல் மெய்யெழுத்து ś ஒலியைத் தமிழில் இயல்பாக ‘ச’ என்றும், பெயரின் உயிரொலிகளை ‘சோகோ’ என்றும் ஒலிபெயர்த்துள்ளோம்.
- source_word: עֲדֻלָּם
  choice: அதுல்லாம்
  rationale: இது யூதாவிலுள்ள பரிச்சயமான இடப்பெயர்; எபிரெய மெய்யொலி மற்றும் வலியுறுத்தப்பட்ட இறுதி மெய்யை அணுகும் வகையில் ‘அதுல்லாம்’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
