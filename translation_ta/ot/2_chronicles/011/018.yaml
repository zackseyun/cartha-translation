source:
  edition: WLC
  text: וַ/יִּֽקַּֽח ל֤/וֹ רְחַבְעָם֙ אִשָּׁ֔ה אֶת מָ֣חֲלַ֔ת בן יְרִימ֖וֹת בֶּן דָּוִ֑יד אֲבִיהַ֕יִל בַּת אֱלִיאָ֖ב בֶּן יִשָֽׁי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
translation:
  language: ta
  text: ரெகொபெயாம் தாவீதின் மகன் எரிமோத்தின் மகளும், ஈசாயின் மகன் எலியாபின் மகளான அபிகாயிலின் மகளுமான மகலாத்தைத் தனக்கு மனைவியாகக் கொண்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய வம்சக்குறிப்பு மிகவும் சுருக்கமாகவும் இலக்கணரீதியாகச் சிக்கலாகவும் உள்ளது. சொல்லுக்குச் சொல் வாசித்தால், “தாவீதின் மகன் எரிமோத்தின் மகன் மகலாத்; ஈசாயின் மகன் எலியாபின் மகள் அபிகாயில்” என்று வருகிறது. மகலாத் எரிமோத்தின் மகளும் அபிகாயிலின் மகளும்; ஆகவே அவள் தந்தை, தாய் இரு வழிகளிலும் இவ்வம்சங்களைச் சேர்ந்தவள் என்பதே சாத்தியமான பொருள். அபிகாயில் குடும்பக் குறிப்பில் வரும் வேறொரு பெயர் என்றோ, சாத்தியம் குறைவாக இரண்டாவது மனைவி என்றோ சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח לוֹ ... אִשָּׁה
  choice: தனக்கு மனைவியாகக் கொண்டான்
  rationale: எபிரேய மரபுத்தொடரின் ‘தனக்காக ஒரு பெண்ணை/மனைவியை எடுத்துக்கொண்டான்’ என்ற திருமணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָחֲלַת
  choice: மகலாத்
  rationale: தனிப்பெயர் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: בן יְרִימוֹת בֶּן דָּוִיד
  choice: தாவீதின் மகன் எரிமோத்தின் மகளான
  rationale: மசோரா உரையில் மகலாத்துக்கும் எரிமோத்துக்கும் இடையே בן (‘மகன்’) இருந்தாலும், பெண்பெயரான மகலாத்தையும் வசனத்தின் வம்சவரிசை அமைப்பையும் கருத்தில் கொண்டு உறவு ‘மகள்’ எனப் பொருள்வழி வழங்கப்படுகிறது; உரையின் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲבִיהַיִל בַּת אֱלִיאָב בֶּן יִשָׁי
  choice: ஈசாயின் மகன் எலியாபின் மகளான அபிகாயிலுக்கும் மகள்
  rationale: அபிகாயிலை இரண்டாம் மனைவியாக அல்லாமல் மகலாத்தின் தாய்வழி அடையாளமாகக் கொள்ளும் சாத்தியமான தொடரியல் வாசிப்பைத் தெளிவான தமிழில் தருகிறது.
theological_decisions:
- issue: வம்சவரிசையில் வரும் பெயர்களின் தொடரியல் உறவு
  choice: மகலாத் எரிமோத்தின் மகளும் அபிகாயிலின் மகளும் என வாசித்தல்
  alternative: அபிகாயிலை இரண்டாவது மனைவியாக வாசித்தல், அல்லது அபிகாயிலை குடும்பக் குறிப்பிலுள்ள வேறொரு அடையாளமாகக் கொள்ளுதல்
  rationale: ‘மனைவி’ ஒருமையில் வருவதாலும் நாளாகமத்தில் வம்சக் குறிப்புகள் சுருக்கமாக அமைவதாலும் ஒரே மனைவியான மகலாத்தின் தந்தை மற்றும் தாய் வழிகளை உரை தருகிறது என்பதே சூழலுக்கு மிகவும் இசைவானது; எனினும் எபிரேயத்தின் இலக்கணச் சிக்கல் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க வேதாகம நடையைப் பயன்படுத்துகிறது. மூலத்தின் சுருக்கமான வம்சத் தொடரை பிரதான உரையில் வாசிக்கத்தக்கவாறு தெளிவாக்கி, உண்மையான இலக்கணத் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
