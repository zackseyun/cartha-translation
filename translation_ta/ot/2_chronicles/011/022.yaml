source:
  edition: WLC
  text: וַ/יַּֽעֲמֵ֨ד לָ/רֹ֧אשׁ רְחַבְעָ֛ם אֶת אֲבִיָּ֥ה בֶֽן מַעֲכָ֖ה לְ/נָגִ֣יד בְּ/אֶחָ֑י/ו כִּ֖י לְ/הַמְלִיכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/022.yaml
  text: And Rehoboam appointed Abijah son of Maacah as chief among his brothers[a], for he intended to make him king.
translation:
  language: ta
  text: ரெகொபெயாம் மாக்காவின் மகன் அபியாவை, அபியாவின் சகோதரர்களிடையே முதன்மையானவனாகவும் தலைவனாகவும் நியமித்தான்; ஏனெனில், ரெகொபெயாம் அவனை அரசனாக்க எண்ணினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: நியமித்தான்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஒரு பதவியில் நிறுத்துதல் அல்லது நிறுவுதல் என்று இங்கு பொருள்படுகிறது; நவீன தமிழில் ‘நியமித்தான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לָרֹאשׁ ... לְנָגִיד
  choice: முதன்மையான ஆட்சித் தலைவனாக
  rationale: רֹאשׁ குறிக்கும் முதன்மை நிலையையும் נָגִיד குறிக்கும் அதிகாரமுள்ள தலைமைப் பதவியையும் ஒருங்கிணைத்து, எபிரெய மூலத்தின் இரு கூறுகளையும் தேவையற்ற மறுகூறலின்றி வெளிப்படுத்துகிறது.
- source_word: אֶת אֲבִיָּה בֶן מַעֲכָה
  choice: மாக்காவின் மகன் அபியாவை
  rationale: எபிரெய உறவுமுறைக் கட்டமைப்பை இயல்பான தமிழ்ச் சொல் வரிசையில் தருகிறது; பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: בְּאֶחָיו
  choice: அவனுடைய சகோதரர்களில்
  rationale: בְּ முன்னிடைச்சொல் குழுவுக்குள் உள்ள முதன்மை நிலையைக் குறிக்கக்கூடும்; ‘சகோதரர்களில்’ என்பது அந்த உறவை எச்சரிக்கையுடன் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய நியமனத்திற்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாகத் தெளிவாகச் செயல்படுகிறது.
- source_word: לְהַמְלִיכוֹ
  choice: அவனை அரசனாக்க எண்ணியிருந்தான்
  rationale: לְ முன்னொட்டுடன் வரும் வினையெச்ச வடிவம் நோக்கம் அல்லது எண்ணத்தைக் காட்டுகிறது; ‘அரசனாக்க’ המליך என்பதன் காரணவினைப் பொருளைக் காக்கிறது.
