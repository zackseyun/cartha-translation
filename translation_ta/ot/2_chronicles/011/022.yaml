translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முதன்மையான ஆட்சித் தலைவன்’ என்பது மூலத்தில் அடுத்தடுத்து வரும் தலைமை மற்றும் ஆளுகைச் சொற்களின் வேறுபாட்டைச் சுருக்காமல் காக்கிறது.
