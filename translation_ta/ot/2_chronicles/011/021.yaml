revisions:
- from: ரெகொபெயாம், அப்சலோமின் மகளான மாகாளைத்[a] தன் மனைவியர் மற்றும் மறுமனையாட்டிகள் எல்லாரையும்விட அதிகமாக நேசித்தான். ஏனெனில், அவன் பதினெட்டு மனைவிகளையும் அறுபது மறுமனையாட்டிகளையும் கொண்டிருந்தான்; அவனுக்கு இருபத்தெட்டு மகன்களும் அறுபது மகள்களும் பிறந்தார்கள்.
  to: ரெகொபெயாம் அப்சலோமின் மகளான மாகாளைத் தன் மனைவியர் மற்றும் துணைமனைவியர் அனைவரையும்விட அதிகமாக நேசித்தான். ஏனெனில், அவன் பதினெட்டு மனைவிகளையும் அறுபது துணைமனைவிகளையும் ஏற்றுக்கொண்டிருந்தான்; அவன் இருபத்தெட்டு மகன்களையும் அறுபது மகள்களையும் பெற்றான்.
  rationale: 'The revision makes two source-fidelity corrections: it renders the taking of wives and concubines as an action, and it explicitly identifies Rehoboam as the father of the children. It also uses a more natural modern Tamil term for concubines while retaining their distinction from wives, and refines the footnote to preserve rather than over-specify the genealogical ambiguity.'
