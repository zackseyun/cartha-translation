id: 2CH.11.21
reference: 2 Chronicles 11:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֶּאֱהַ֨ב רְחַבְעָ֜ם אֶת מַעֲכָ֣ה בַת אַבְשָׁל֗וֹם מִ/כָּל נָשָׁי/ו֙ וּ/פִ֣ילַגְשָׁ֔י/ו כִּ֠י נָשִׁ֤ים שְׁמוֹנֶֽה עֶשְׂרֵה֙ נָשָׂ֔א וּ/פִֽילַגְשִׁ֖ים שִׁשִּׁ֑ים וַ/יּ֗וֹלֶד עֶשְׂרִ֧ים וּ/שְׁמוֹנָ֛ה בָּנִ֖ים וְ/שִׁשִּׁ֥ים בָּנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
translation:
  language: ta
  text: ரெகொபெயாம் அப்சலோமின் மகளான மாகாளைத் தன் மனைவியர் மற்றும் துணைமனைவியர் அனைவரையும்விட அதிகமாக நேசித்தான். ஏனெனில், அவன் பதினெட்டு மனைவிகளையும் அறுபது துணைமனைவிகளையும் ஏற்றுக்கொண்டிருந்தான்; அவன் இருபத்தெட்டு மகன்களையும் அறுபது மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: நேசித்தான்
  rationale: אהב அன்பு அல்லது பாசத்தைக் குறிக்கிறது. ஒப்பீட்டுப் பொருள் தொடர்ந்து வரும் מִכָּל மூலம் வெளிப்படுவதால், வினைச்சொல் தனியே ‘நேசித்தான்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בַת אַבְשָׁלוֹם
  choice: அப்சலோமின் மகளான
  rationale: בַת என்பதன் இயல்பான நேரடிப் பொருள் ‘மகள்.’ வம்சவரிசைச் சூழலில் இது தொலைவான பெண் வழித்தோன்றலையும் குறிக்கக்கூடும் என்பதால் அந்த வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  choice: தன் மனைவியர் மற்றும் மறுமனையாட்டிகள் எல்லாரையும்விட அதிகமாக
  rationale: מִכָּל ஒப்பீட்டைச் சுட்டுகிறது. נָשִׁים இங்கு மனைவியரையும், פִילַגְשִׁים வேறுபட்ட சமூக-திருமண நிலை கொண்ட மறுமனையாட்டிகளையும் குறிக்கிறது; அந்த வேறுபாடு தக்கவைக்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்குப் பின்னணியாக விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இங்கு செயல்படுகிறது.
- source_word: נָשִׁים ... נָשָׂא
  choice: பதினெட்டு மனைவிகளையும் ... கொண்டிருந்தான்
  rationale: נשא נשים என்பது பெண்களை மனைவிகளாக ஏற்றுக்கொள்வதைக் குறிக்கும் மரபுத்தொடர். இங்கு தொடர்ந்து மறுமனையாட்டிகளின் எண்ணிக்கையும் வருவதால், இயல்பான தமிழில் ‘கொண்டிருந்தான்’ என்று வழங்கப்பட்டது.
- source_word: פִּילַגְשִׁים
  choice: மறுமனையாட்டிகள்
  rationale: மனைவியரிலிருந்து வேறுபட்ட இரண்டாம் நிலைத் திருமண/இல்லற உறவிலிருந்த பெண்களைச் சுட்டும் வரலாற்றுச் சொல்லின் சமூக வேறுபாட்டை இது காக்கிறது.
- source_word: וַיּוֹלֶד
  choice: அவனுக்கு ... பிறந்தார்கள்
  rationale: ஆண் எழுவாயுடன் வரும் ילד வடிவம் அவன் அந்தப் பிள்ளைகளுக்குத் தந்தையானதைக் குறிக்கிறது. தமிழில் ‘அவனுக்கு ... பிறந்தார்கள்’ என்பது இயல்பாகவும் தெளிவாகவும் அதே கருத்தைத் தருகிறது.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה בָּנִים
  choice: இருபத்தெட்டு மகன்கள்
  rationale: எண்ணிக்கையும் בָּנִים என்பதன் ‘மகன்கள்’ என்ற பொருளும் நேரடியாகத் தரப்பட்டன.
- source_word: וְשִׁשִּׁים בָּנוֹת
  choice: அறுபது மகள்கள்
  rationale: எண்ணிக்கையும் בָּנוֹת என்பதன் ‘மகள்கள்’ என்ற பொருளும் நேரடியாகத் தரப்பட்டன.
theological_decisions:
- issue: மாகாள் ‘அப்சலோமின் மகள்’ என்று அழைக்கப்படுவது
  choice: எபிரெய உரையின் நேரடிக் கூறான ‘அப்சலோமின் மகள்’ என்பதை முதன்மை உரையில் தக்கவைத்தல்
  alternative: விரிவான வம்சவழிப் பொருளில் ‘அப்சலோமின் பெண் வழித்தோன்றல்’ அல்லது ‘பேத்தி’ என்று புரிந்துகொள்ளுதல்
  rationale: இது பெரிதான கோட்பாட்டுச் சிக்கல் அல்ல என்றாலும், வம்சவரிசை தொடர்பான உண்மையான விளக்க வாய்ப்பாகும். மூலமொழியின் நேரடிக் கூறைத் தீர்மானமாக மாற்றாமல் முதன்மை உரையில் வைத்துக் கொண்டு, பரந்த பொருளை அடிக்குறிப்பில் தெரிவிப்பது தெளிவையும் நிலவும் ஐயத்தையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்றுச் சமூக வேறுபாடுகளை இழக்காத வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘மறுமனையாட்டிகள்’ என்பது அன்றாடப் பயன்பாட்டில் அரிதாக இருந்தாலும், פִילַגְשִׁים குறிக்கும் தனித்த நிலையைத் துல்லியமாகவும் கண்ணியமாகவும் காட்டுவதற்காகத் தேர்ந்தெடுக்கப்பட்டது.
