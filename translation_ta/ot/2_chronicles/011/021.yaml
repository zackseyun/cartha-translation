    text: அல்லது, ‘அப்சலோமின் பெண் சந்ததியான மாகாளை.’ எபிரெய மொழியில் ‘மகள்’ என்ற சொல் சில வம்சவரிசைச் சூழல்களில் பரந்த பொருளில் பயன்படுத்தப்படலாம்.
