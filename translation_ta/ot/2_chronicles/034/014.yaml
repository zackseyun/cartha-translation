  text: וּ/בְ/הוֹצִיאָ֣/ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה מָצָא֙ חִלְקִיָּ֣הוּ הַ/כֹּהֵ֔ן אֶת סֵ֥פֶר תּֽוֹרַת יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/014.yaml
  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
translation:
  language: ta
  text: 'யாவேயின் ஆலயத்திற்குக் கொண்டுவரப்பட்டிருந்த வெள்ளியை அவர்கள் வெளியே எடுத்தபோது, ஆசாரியரான இல்க்கியா, மோசே வழியாக[a] வந்த யாவேயின் திருச்சட்ட நூலைக் கண்டெடுத்தார்.


    [a] எபிரெயத்தில், “மோசேயின் கையால்” என்று உள்ளது. இது மோசேயின் முகமை அல்லது இடைநிலையைக் குறிக்கும் சொல்லாட்சி; “மோசே வழியாக” என்றும் பொருள் கொள்ளலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மோசேயின் கையால்” என்று உள்ளது. இது மோசேயின் முகமை அல்லது இடைநிலையைக் குறிக்கும் சொல்லாட்சி; “மோசே வழியாக” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  choice: அவர்கள் வெளியே எடுத்தபோது
  rationale: בְּ + வினையெச்ச வடிவம் காலத்தைச் சுட்டும் துணைவாக்கியமாக இருப்பதால், இயல்பான நவீனத் தமிழில் இவ்வாறு தரப்பட்டது.
- source_word: הַכֶּסֶף
  choice: வெள்ளி
  rationale: כֶּסֶף என்பதற்கு ‘வெள்ளி’ என்றும் ‘பணம்’ என்றும் பொருள் உண்டு. ஆலயப் பணிகளுக்காகச் சேகரிக்கப்பட்ட நிதியைச் சூழல் சுட்டினாலும், மூலத்தின் சொல் சார்ந்த தெளிவின்மையை ‘வெள்ளி’ காக்கிறது.
- source_word: הַמּוּבָא בֵּית יְהוָה
  choice: யாவேயின் ஆலயத்திற்குக் கொண்டுவரப்பட்டிருந்த
  rationale: Hophal வினையெச்சத்தின் செயப்பாட்டு பொருளையும் முன்பே உள்ளே கொண்டுவரப்பட்டிருந்த நிகழ்வையும் காட்டுகிறது. בֵּית என்பதன் நேரடிப் பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் இயல்பான தமிழுக்காக ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: ஆசாரியரான இல்க்கியா
  rationale: பெயரும் பணிப்பட்டமும் இயல்பான தமிழ் இடைச்சொல் அமைப்பில் தரப்பட்டன; பெயர் ஒலிபெயர்க்கப்பட்டது.
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: யாவேயின் திருச்சட்ட நூல்
  rationale: סֵפֶר என்பது நூல் அல்லது சுருள்; תּוֹרָה என்பது போதனை அல்லது சட்டம். உடன்படிக்கைச் சூழலில் நிலைபெற்ற ‘திருச்சட்டம்’ பொருத்தமாகவும், ‘நூல்’ வடிவம் குறித்த தேவையற்ற தீர்மானத்தைத் தவிர்ப்பதாகவும் உள்ளது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் கையால்
  rationale: மூலத்திலுள்ள ‘கையால்’ என்ற முகவாண்மை அப்படியே வைக்கப்பட்டு, அதன் முகமை அல்லது இடைநிலைப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது; பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- issue: בְּיַד מֹשֶׁה என்பதில் மோசேயின் பங்கு
  choice: மோசேயின் கையால் கொடுக்கப்பட்ட
  alternative: மோசே எழுதிய
  rationale: எபிரெயச் சொல்லாட்சி முகமை அல்லது இடைநிலையைச் சுட்டலாம்; அது நேரடியாக ‘எழுதிய’ என்று கூறாததால் ஆசிரியத்துவத்தைத் திட்டவட்டமாகச் சேர்க்கவில்லை. ‘கொடுக்கப்பட்ட’ என்பது சட்டம் மோசே வழியாக வந்ததை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நேரடி சொல்லாட்சி அடிக்குறிப்புடன் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழில் வடிவமைக்கப்பட்டது. ‘ஆசாரியர்’, ‘திருச்சட்டம்’, ‘ஆலயம்’ ஆகியவை சாதாரண வாசகர்களுக்குப் புரியும் நிலைபெற்ற வேதாகமச் சொற்களாகப் பயன்படுத்தப்பட்டன. வாக்கியத்தின் நிகழ்வுவரிசையும் மூலத்தின் ‘மோசேயின் கையால்’ என்ற சொல்லாட்சியும் காக்கப்பட்டுள்ளன.
