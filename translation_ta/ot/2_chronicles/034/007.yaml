  text: וַ/יְנַתֵּ֣ץ אֶת הַֽ/מִּזְבְּח֗וֹת וְ/אֶת הָ/אֲשֵׁרִ֤ים וְ/הַ/פְּסִלִים֙ כִּתַּ֣ת לְ/הֵדַ֔ק וְ/כָל הַֽ/חַמָּנִ֥ים גִּדַּ֖ע בְּ/כָל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יָּ֖שָׁב לִ/ירוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
translation:
  language: ta
  text: அவர் பலிபீடங்களையும் அசேரா வழிபாட்டுச் சின்னங்களையும்[a] இடித்துப்போட்டார்; செதுக்கப்பட்ட சிலைகளை நுண்பொடியாக நொறுக்கினார்; இஸ்ரவேல் நாடு முழுவதும் இருந்த ஹம்மானீம் எனப்படும் வழிபாட்டுச் சின்னங்கள்[b] அனைத்தையும் அழித்தார். பின்பு அவர் எருசலேமுக்குத் திரும்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசேரா கம்பங்கள்.” எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; சூழலுக்கு ஏற்ப அவற்றின் துல்லியமான வடிவம் மாறியிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஹம்மானீம்.” அல்லது, “சூரிய வழிபாட்டுத் தூண்கள்”; “தூபபீடங்கள்.” இது ஒரு வகை வழிபாட்டுப் பொருளைக் குறிக்கிறது; அதன் துல்லியமான அடையாளம் விவாதத்திற்குரியது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  choice: இடித்துப்போட்டார்
  rationale: נתץ என்பது கட்டமைப்புகளை இடித்துத் தகர்ப்பதைக் குறிக்கிறது; பலிபீடங்களுக்கு இயல்பாகப் பொருந்தும் நவீனத் தமிழ் சொற்றொடர்.
- source_word: הַמִּזְבְּחוֹת
  choice: பலிபீடங்கள்
  rationale: מִזְבֵּחַ என்பதற்கான துல்லியமான, வழக்கிலுள்ள தமிழ் மொழிபெயர்ப்பு.
- source_word: הָאֲשֵׁרִים
  choice: அசேரா வழிபாட்டுச் சின்னங்கள்
  rationale: இச்சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; அவை எப்போதும் ஒரே வடிவிலான கம்பங்கள் என்று தீர்மானிக்காமல் அவற்றின் குறிப்பிட்ட வழிபாட்டுத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: הַפְּסִלִים
  choice: செதுக்கப்பட்ட சிலைகள்
  rationale: פסילים என்பது செதுக்கி உருவாக்கப்பட்ட வழிபாட்டுச் சிலைகளைக் குறிப்பதால், பொதுவான ‘விக்கிரகங்கள்’ என்பதைவிட மூலச்சொல்லின் உருவாக்க முறையைத் தெளிவாகக் காட்டுகிறது.
- source_word: כִּתַּת לְהֵדַק
  choice: நுண்பொடியாக நொறுக்கினார்
  rationale: இந்த வினைச்சொல் சேர்க்கை மிக நுண்ணிய துகள்களாக நொறுக்கப்பட்ட முடிவை வலியுறுத்துகிறது.
- source_word: הַחַמָּנִים
  choice: தூபபீடங்கள்
  rationale: חַמָּנִים என்பதன் துல்லியமான அடையாளம் விவாதத்திற்குரியது; அது தூபம் செலுத்தும் வழிபாட்டு அமைப்புகளையோ சூரிய வழிபாட்டுடன் தொடர்புடைய தூண்களையோ குறிக்கலாம். வாசிக்கத் தெளிவான ஒரு அடையாளம் முதன்மை உரையில் தரப்பட்டு, மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: גִּדַּע
  choice: வெட்டி வீழ்த்தினார்
  rationale: גדע என்பது நின்றிருக்கும் பொருளை வெட்டி வீழ்த்துதல் அல்லது துண்டித்தல் என்ற பொருளுடையது.
- source_word: בְּכָל אֶרֶץ יִשְׂרָאֵל
  choice: இஸ்ரவேல் நாடெங்கும்
  rationale: செயல் இஸ்ரவேல் நிலப்பரப்பு முழுவதிலும் நடைபெற்றது என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיָּשָׁב לִירוּשָׁלִָם
  choice: பின்பு அவர் எருசலேமுக்குத் திரும்பினார்
  rationale: எபிரெயக் கதைத் தொடரின் அடுத்த நிகழ்வை ‘பின்பு’ இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: விக்கிரக வழிபாட்டுடன் தொடர்புடைய பொருட்களை மொழிபெயர்த்தல்
  choice: பலிபீடங்கள், அசேரா வழிபாட்டுச் சின்னங்கள், செதுக்கப்பட்ட சிலைகள், தூபபீடங்கள் எனத் தனித்தனி பொருட்கள் பெயரிடப்பட்டுள்ளன.
  alternative: அனைத்தையும் பொதுவாக ‘விக்கிரகங்களும் வழிபாட்டிடங்களும்’ என்று மொழிபெயர்த்தல்.
  rationale: மூல எபிரெய உரை வெவ்வேறு வழிபாட்டுப் பொருட்களைத் தனித்தனியாகக் குறிப்பிடுகிறது. அவற்றை ஒரு பொதுச் சொல்லுக்குள் ஒடுக்காமல் இருப்பது யோசியாவின் சீர்திருத்த நடவடிக்கைகளின் தெளிவையும் மூல உரையின் சொற்சிறப்பையும் பாதுகாக்கிறது.
- issue: חַמָּנִים என்ற வழிபாட்டுப் பொருளின் அடையாளம்
  choice: முதன்மை உரையில் ‘தூபபீடங்கள்’ என்றும் அடிக்குறிப்பில் ‘சூரிய வழிபாட்டுத் தூண்கள்’ என்றும் தரப்பட்டுள்ளது.
  alternative: முதன்மை உரையில் ‘சூரிய வழிபாட்டுத் தூண்கள்’ என்று தருதல்.
  rationale: இச்சொல்லின் துல்லியமான குறிப்பு உறுதியற்றது. ஒரு சாத்தியத்தை மட்டும் இறுதியானதாக அறிவிக்காமல், உண்மையான சொற்பொருள் தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. இணை அமைப்புகளையும் செயல்களின் தீவிரத்தையும் காக்க அரைப்புள்ளிகள் பயன்படுத்தப்பட்டுள்ளன; தெளிவற்ற வழிபாட்டுச் சொற்கள் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
