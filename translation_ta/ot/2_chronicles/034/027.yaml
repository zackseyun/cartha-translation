base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: ta
  text: “உன் உள்ளம் மென்மையாயிருந்ததாலும்[a], இந்த இடத்திற்கும் அதில் குடியிருப்பவர்களுக்கும் எதிரான கடவுளின் வார்த்தைகளை நீ கேட்டபோது கடவுளின் முன்னிலையில் உன்னைத் தாழ்த்திக்கொண்டதாலும், நீ என் முன்னிலையில் உன்னைத் தாழ்த்திக்கொண்டு உன் உடைகளைக் கிழித்து என் முன்னிலையில் அழுததாலும், நானும் கேட்டேன் என்று யாவே அறிவிக்கிறார்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் உள்ளம் மென்மையாக இருந்ததால்.” எபிரெய மொழிமரபு, கடவுளின் வார்த்தையை ஏற்றுக்கொள்ளும் தாழ்மையான உள்ளநிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: ஆகவே
  rationale: இறைவன் செவிகொடுத்ததற்கான காரணத்தை முன்வைக்கும் எபிரெயக் கட்டமைப்பை, தமிழில் காரணத்திலிருந்து விளைவுக்கு இயல்பாக நகரும் ‘ஆகவே’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
- source_word: רַךְ לְבָבְךָ
  choice: உன் உள்ளம் மென்மையடைந்து
  rationale: ரַךְ என்பதன் ‘மென்மை’ என்ற அடிப்படைப் பொருளையும், கடவுளின் வார்த்தைக்குச் செவிசாய்க்கும் தாழ்மையான மனநிலையையும் காக்கிறது; ‘இதயம்’ என்பதற்குப் பதிலாக இச்சூழலில் இயல்பான ‘உள்ளம்’ பயன்படுத்தப்படுகிறது.
- source_word: וַתִּכָּנַע
  choice: உன்னைத் தாழ்த்தினாய்
  rationale: כנע என்பதன் நிபால் வடிவம் இங்கு தன்னைத்தானே தாழ்த்திக்கொண்ட செயலைக் குறிக்கிறது. இரு நிகழ்வுகளிலும் ஒரே சொற்றொடர் வைக்கப்பட்டு எபிரெய மறுபதிப்பு காக்கப்படுகிறது.
- source_word: מִלִּפְנֵי אֱלֹהִים / לְפָנַי
  choice: கடவுளுக்கு முன்பாக / எனக்கு முன்பாக
  rationale: தெய்வீக முன்னிலையில் தாழ்ந்திருப்பதைக் குறிக்கும் நேரடியான மொழிமரபைத் தமிழில் இயல்பாகவும், மூலத்தின் சொல்லாட்சி மாறுபாட்டுடனும் தருகிறது.
- source_word: בְּשָׁמְעֲךָ
  choice: நீ கேட்டபோது
  rationale: בְּ உடன் வரும் infinitive construct-இன் காலப்பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: דְּבָרָיו
  choice: கடவுளின் வார்த்தைகளை
  rationale: மூன்றாம் நபர் பின்னொட்டு சூழலில் கடவுளைக் குறிக்கிறது. தமிழில் சுட்டுப்பெயரால் ஏற்படக்கூடிய குழப்பத்தைத் தவிர்க்கப் பெயர் மீண்டும் சொல்லப்படுகிறது.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: இந்த இடத்திற்கும் இதில் குடியிருப்பவர்களுக்கும் எதிரான
  rationale: நியாயத்தீர்ப்புச் சூழலில் עַל என்பதன் எதிர்நிலைப் பொருளை காக்கிறது; இரு இலக்குகளையும் இணைத்துச் சொல்லும் இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்படுகிறது.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: உன் உடைகளைக் கிழித்துக்கொண்டு
  rationale: துக்கத்தையும் மனந்திரும்புதலையும் வெளிப்படுத்தும் பண்டைய செயலை நேரடியாகவும் புரியத்தக்க வகையிலும் தருகிறது.
- source_word: וַתֵּבְךְּ
  choice: அழுதாய்
  rationale: בכה என்பதன் துயரமிகு அழுகையை எளிய, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְגַם אֲנִי שָׁמַעְתִּי
  choice: நானும் உன் வேண்டுதலைக் கேட்டேன்
  rationale: ‘நானும் கேட்டேன்’ என்ற மூலத்தின் கருத்தைத் தமிழில் முழுமையாக்குகிறது. ‘உன் வேண்டுதலை’ என்பது வெளிப்படையாக இல்லாத பொருளைச் சூழலிலிருந்து நிரப்புவதால், அதை மொழிபெயர்ப்பின் விளக்கத்தன்மையாகக் கருத வேண்டும்.
- source_word: נְאֻם יְהוָה
  choice: என்று யாவே அறிவிக்கிறார்
  rationale: தீர்க்கதரிசன அறிவிப்பு வாய்பாட்டின் அதிகாரத் தொனியைக் காக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
