revisions:
- from: 'யாவே கூறுவது இதுவே: ‘இதோ, நான் இந்த இடத்தின்மீதும் இதில் குடியிருப்பவர்கள்மீதும் பேரழிவைக் கொண்டுவரப்போகிறேன்—யூதாவின் ராஜாவுக்கு முன்பாக அவர்கள் வாசித்துக் காட்டிய நூலில்[b] எழுதப்பட்டுள்ள சாபங்கள்[a] அனைத்தையும் கொண்டுவரப்போகிறேன்.’'
  to: 'யாவே இவ்வாறு கூறுகிறார்: ‘இதோ, நான் இந்த இடத்தின்மீதும் அதில் வாழ்கிறவர்கள்மீதும் பேரழிவை—யூதா அரசருக்கு முன்பாக அவர்கள் வாசித்த நூலில்[b] எழுதப்பட்டிருக்கும் எல்லாச் சாபங்களையும்[a]—கொண்டுவருகிறேன்.’'
  rationale: 'The revision uses idiomatic modern Tamil while retaining the prophetic register and every essential source element. The dashes mark the Hebrew appositional relation: the disaster consists in the curses written in the document read before Judah’s king. Footnote anchors remain attached to their corresponding lexical items.'
