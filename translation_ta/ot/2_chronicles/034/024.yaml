source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יוֹשְׁבָ֑י/ו אֵ֤ת כָּל הָ/אָלוֹת֙ הַ/כְּתוּב֣וֹת עַל הַ/סֵּ֔פֶר אֲשֶׁ֣ר קָֽרְא֔וּ לִ/פְנֵ֖י מֶ֥לֶךְ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
translation:
  language: ta
  text: 'யாவே இவ்வாறு கூறுகிறார்: ‘இதோ, நான் இந்த இடத்தின்மீதும் அதில் வாழ்கிறவர்கள்மீதும் பேரழிவை—யூதா அரசருக்கு முன்பாக அவர்கள் வாசித்த நூலில்[b] எழுதப்பட்டிருக்கும் எல்லாச் சாபங்களையும்[a]—கொண்டுவருகிறேன்.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆணையுறுதிச் சாபங்கள்’; சட்ட நூலில் அறிவிக்கப்பட்ட உடன்படிக்கைத் தண்டனைகளை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘நூல்’ என்பதற்கான எபிரேயச் சொல் ஒரு சுருளையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேயத் தெய்வீகப் பெயரை பட்டப்பெயராக மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் அதிகாரப்பூர்வத் தொனியை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: הִנְנִי
  choice: இதோ, நான்
  rationale: வரவிருக்கும் தெய்வீகச் செயலின்மீது கவனத்தைத் திருப்பும் எபிரேய அறிவிப்புச் சொல்லின் வலியுறுத்தலைப் பேணுகிறது.
- source_word: מֵבִיא רָעָה
  choice: பேரழிவைக் கொண்டுவரப்போகிறேன்
  rationale: இங்கு רָעָה ஒழுக்கத் தீமையைக் குறிக்காமல் தண்டனைத் தீர்ப்பாக வரும் பெருந்தீங்கைக் குறிக்கிறது; எதிர்நோக்கிய செயலைத் தமிழ் வினை வடிவம் தெளிவாக்குகிறது.
- source_word: הַמָּקוֹם הַזֶּה
  choice: இந்த இடம்
  rationale: சூழலைத் தாண்டி எருசலேம் அல்லது யூதா என்று குறிப்பாக்காமல் மூலத்தின் பொதுவான சுட்டுப்பெயர்ச்சொல்லைப் பேணுகிறது.
- source_word: יוֹשְׁבָיו
  choice: இதில் குடியிருப்பவர்கள்
  rationale: இடத்துடன் இணைந்த உடைமைப் பொருளைத் தெளிவான இயல்பான தமிழில் தருகிறது.
- source_word: אֵת כָּל הָאָלוֹת
  choice: சாபங்கள் அனைத்தையும்
  rationale: உடன்படிக்கை மீறலுக்குரிய தண்டனைச் சாபங்களைக் குறிக்கும் אָלָה என்பதன் தெளிவான பொதுமொழிப் பொருளை வழங்குகிறது.
- source_word: הַכְּתוּבוֹת עַל הַסֵּפֶר
  choice: நூலில் எழுதப்பட்டுள்ள
  rationale: எழுத்து ஆவணத்தில் பதிவு செய்யப்பட்ட உள்ளடக்கம் என்ற பொருளை இயல்பான தமிழில் தருகிறது; சுருள் என்ற சாத்தியத்தைக் காலடிக்குறிப்பு காக்கிறது.
- source_word: אֲשֶׁר קָרְאוּ לִפְנֵי
  choice: முன்பாக அவர்கள் வாசித்துக் காட்டிய
  rationale: மூலத்தின் செயப்பாட்டு பன்மை எழுவாயைப் பேணி, அரசன் கேட்கும்படி வாசிக்கப்பட்டதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் ராஜா
  rationale: எபிரேய இணைப்புத் தொடரை நேராகவும் புரிந்துகொள்ளத்தக்க வகையிலும் தருகிறது.
theological_decisions:
- issue: தெய்வீகத் தீர்ப்பில் רָעָה என்பதன் இயல்பு
  choice: பேரழிவு
  alternative: தீமை; கேடு; பேரிடர்
  rationale: இவ்வசனத்தில் சொல் உடன்படிக்கைச் சாபங்களாக வரும் தண்டனைத் தீங்கைக் குறிக்கிறது. ‘பேரழிவு’ தீர்ப்பின் கடுமையைப் பேணுவதோடு, கடவுள் ஒழுக்கத் தீமையைச் செய்கிறார் என்ற தேவையற்ற பொருளை உருவாக்காது.
- issue: אָלָה என்பதன் உடன்படிக்கை சார்ந்த நுட்பம்
  choice: சாபங்கள்
  alternative: ஆணையுறுதிச் சாபங்கள்
  rationale: முதன்மை உரையில் பொதுவாகப் புரியும் சொல்லைப் பயன்படுத்தி, சட்ட நூலில் அறிவிக்கப்பட்ட உடன்படிக்கைத் தண்டனைகள் என்ற நுட்பத்தை காலடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் தீர்க்கதரிசன அறிவிப்புக்குரிய கண்ணியமான தொனியுடனும் வடிவமைக்கப்பட்டது. மூலத்தின் செயப்பாட்டு பன்மை (‘அவர்கள் வாசித்தார்கள்’) மற்றும் ‘இந்த இடம்’ என்ற குறிப்பிடாமை பேணப்பட்டுள்ளன.
