base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
translation:
  language: ta
  text: அரசன் சட்டத்தின்[a] வார்த்தைகளைக் கேட்டபோது, தன் ஆடைகளைக் கிழித்துக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போதனையின் வார்த்தைகள்”; எபிரெயத்தில் தோரா என்ற சொல் விரிவாகப் போதனை அல்லது அறிவுறுத்தலைக் குறிக்கலாம். இங்கு அது அரசன் முன் வாசிக்கப்பட்ட உடன்படிக்கைச் சட்டத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: கேட்டபோது
  rationale: כְּ + infinitive construct காலச் சூழலைக் குறிக்கிறது. தமிழில் இயல்பான காலத் துணைவாக்கியமாக மொழிபெயர்க்கப்பட்டுள்ளது; וַיְהִי என்பதற்குத் தனியாக ஒரு பழமையான தொடக்கச் சொற்றொடர் தேவையில்லை.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய மூலத்தில் தனிப்பெயர் அல்ல, உறுதியான அரசுப் பட்டமே உள்ளது; ஆகவே யோசியா என்ற பெயரைச் சேர்க்காமல் ‘அரசன்’ என வைக்கப்பட்டுள்ளது.
- source_word: דִּבְרֵי
  choice: வார்த்தைகள்
  rationale: இங்கு வாசிக்கப்பட்ட உரையின் சொற்கள் அல்லது உள்ளடக்கத்தைக் குறிக்கும் construct plural-ஐ நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַתּוֹרָה
  choice: திருச்சட்டம்
  rationale: תּוֹרָה பொதுவாக ‘போதனை/அறிவுறுத்தல்’ என்றும் பொருள்படலாம்; இச்சூழலில் அரசன் முன் வாசிக்கப்பட்ட உடன்படிக்கைச் சட்டத் தொகுப்பைக் குறிக்கிறது. ‘திருச்சட்டம்’ என்பது தமிழில் அதன் வேதாகமச் சூழலையும் சட்டத் தன்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּקְרַע
  choice: கிழித்துக்கொண்டான்
  rationale: קָרַע ஆடையைக் கிழிக்கும் செயலைக் குறிக்கிறது. தமிழ் தற்சுட்டு வடிவம், எழுவாய் தன் ஆடைகளையே கிழித்ததை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּגָדָיו
  choice: தன் ஆடைகள்
  rationale: בֶּגֶד என்பது பொதுவான உடைச் சொல்; ‘அரச உடைகள்’ அல்லது ‘அங்கிகள்’ என்று தேவையின்றி குறிப்பாக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: யோசியாவின் சீர்திருத்தச் சூழலில் תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: திருச்சட்டம்
  alternative: போதனை; தோரா
  rationale: கண்டெடுக்கப்பட்ட நூலின் உடன்படிக்கை மற்றும் சட்ட உள்ளடக்கம் இங்கு முன்னிலையில் உள்ளது. அதேவேளை எபிரெயச் சொல்லின் விரிவான ‘போதனை’ என்ற பொருளை அடிக்குறிப்பு பாதுகாக்கிறது; எந்தக் குறிப்பிட்ட சமயப்பிரிவின் சட்டக் கோட்பாடும் இறக்குமதி செய்யப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை. ‘திருச்சட்டம்’ வேதாகமச் சூழலில் תורה என்பதன் சட்டப் பொருளைத் தெளிவாக்குகிறது; அதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது. துயரம், அதிர்ச்சி அல்லது மனந்திரும்புதலின் அடையாளம் என்ற விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், மூலத்தின் சுருக்கமும் இறையியல் இறுக்கமும் பாதுகாக்கப்பட்டுள்ளன.
