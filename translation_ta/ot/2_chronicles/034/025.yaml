- from: அவர்கள் என்னைக் கைவிட்டு, வேறு தெய்வங்களுக்குத் தூபம் காட்டி[a], தங்கள் கைகளின் செயல்கள் அனைத்தாலும்[b] எனக்குக் கோபமூட்டியதால், என் கடுஞ்சினம் இந்த இடத்தின்மேல் ஊற்றப்படும்; அது அணைக்கப்படாது.
