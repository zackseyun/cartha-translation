  rationale: Only the rendering of לְמַעַן הַכְעִיסֵנִי is adjusted. The new wording preserves the Hebrew’s purpose/result relationship and avoids treating the people’s provocation merely as a separate causal clause. «எல்லாச் செயல்கள்» is the standard sandhi form of «அனைத்துச் செயல்கள்» and is natural in this register. Footnote anchors and their content remain unchanged.
