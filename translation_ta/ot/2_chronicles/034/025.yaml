base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
translation:
  language: ta
  text: அவர்கள் என்னைக் கைவிட்டு, வேறு தெய்வங்களுக்குத் தூபம் காட்டி[a], தங்கள் கைகளின் எல்லாச் செயல்களாலும்[b] என்னைக் கோபப்படுத்தும் வகையில் நடந்துகொண்டதால், என் கடுஞ்சினம் இந்த இடத்தின்மேல் ஊற்றப்படும்; அது அணைக்கப்படாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்நிய தெய்வங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் நேரடியாக ‘வேறு தெய்வங்கள்’ என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘தங்கள் கைகளின் செயல்கள்’ என்பது அவர்கள் உருவாக்கியவற்றையோ செய்தவற்றையோ பரவலாகக் குறிக்கலாம்; இச்சூழலில் மனிதர் செய்த சிலைகளும் அவற்றுடன் தொடர்புடைய செயல்களும் குறிப்பாக உள்ளடங்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: …மூட்டியதால்
  rationale: இந்த எபிரெயச் சொற்றொடர் அறிவிக்கப்படும் தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் காரணவினையெச்ச வடிவம் இயல்பாக அதன் காரணப் பொருளைத் தருகிறது.
- source_word: עֲזָבוּנִי
  choice: அவர்கள் என்னைக் கைவிட்டு
  rationale: עזב என்பதன் ‘கைவிடுதல்/விட்டுவிடுதல்’ என்ற அடிப்படைப் பொருளையும், உடன்படிக்கைத் துரோகத்தின் தீவிரத்தையும் ‘கைவிட்டு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּקְטִירוּ
  choice: தூபம் காட்டி
  rationale: Hiphil வடிவிலுள்ள קטר இச்சிலை வழிபாட்டுச் சூழலில் தூபத்தை எரித்துப் படைப்பதைக் குறிக்கிறது; நவீனத் தமிழில் ‘தூபம் காட்டுதல்’ தெளிவான வழிபாட்டுச் சொல்லாடல்.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களுக்கு
  rationale: אֲחֵרִים என்பதன் நேரடியான பொருள் ‘வேறு’; ‘அந்நிய’ என்று மட்டும் சுருக்காமல் மூலத்தின் எளிய உடன்படிக்கை மொழியைப் பேணுகிறது.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: எனக்குக் கோபமூட்டியதால்
  rationale: כעס Hiphil இறைவனைக் கோபப்படுத்துதல் என்ற பொருளுடையது. சூழலில் நோக்கம் அல்லது விளைவு என இருக்கக்கூடிய நுணுக்கத்தை அதிகமாகத் தீர்மானிக்காமல் காரண வாக்கியத்தில் இயல்பாக இணைக்கிறது.
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  choice: தங்கள் கைகளின் செயல்கள் அனைத்தாலும்
  rationale: மனிதர்கள் செய்த பொருட்களையும் செயல்களையும், குறிப்பாகச் சிலைகளையும் அவற்றுடன் தொடர்புடைய செயல்களையும் குறிக்கக்கூடிய மூல உருவகத்தைத் தமிழில் வெளிப்படையாகப் பேணுகிறது.
- source_word: וְתִתַּךְ חֲמָתִי
  choice: என் கடுஞ்சினம் … ஊற்றப்படும்
  rationale: נתך தரும் ‘ஊற்றப்படுதல்’ உருவகத்தையும் חֵמָה-வின் தீவிரமான நீதித்தீர்ப்புச் சினத்தையும் தணிக்காமல் தருகிறது.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: இந்த இடத்தின்மேல்
  rationale: ஊற்றப்படும் சினம் குறிவைக்கும் இடத்தை בְּ குறிக்கிறது; ‘இடத்தின்மேல்’ தமிழில் உருவகத்தோடு இயல்பாகப் பொருந்துகிறது.
- source_word: וְלֹא תִכְבֶּה
  choice: அது அணைக்கப்படாது
  rationale: כבה-வின் நெருப்பு உருவகத்தை ‘அணைக்கப்படாது’ நேரடியாகப் பேணுகிறது; ‘அது’ என்பது முன்வந்த கடுஞ்சினத்தைக் குறிக்கிறது.
theological_decisions:
- issue: இறை நீதித்தீர்ப்பின் மொழியைத் தணிக்காமலும் பிற்காலக் கோட்பாடுகளைச் சேர்க்காமலும் மொழிபெயர்த்தல்
  choice: என் கடுஞ்சினம் இந்த இடத்தின்மேல் ஊற்றப்படும்; அது அணைக்கப்படாது
  alternative: என் உக்கிரம் இந்த இடத்தின்மேல் ஊற்றப்பட்டு அணையாது
  rationale: வசனம் விக்கிரக வழிபாட்டிற்குப் பதிலாக வரும் இறைவனின் தனிப்பட்ட நீதித்தீர்ப்புச் சினத்தை நேரடியாகக் கூறுகிறது. ஊற்றுதல் மற்றும் அணைத்தல் ஆகிய இணைந்த உருவகங்களை மொழிபெயர்ப்பு பேணுகிறது.
- issue: முதல் நபர் இறைக் குறிப்பைப் பேணுதல்
  choice: என்னை / என்
  alternative: ஆண்டவரை / ஆண்டவருடைய
  rationale: எபிரெய மூலத்தில் இறைவன் தம்மைக் குறித்து முதல் நபரில் பேசுகிறார். பெயர்ச்சொல்லை மாற்றாகச் சேர்க்காமல் அந்த நேரடிக் குரலைப் பேணுவது மூலத்துக்கு நெருக்கமானது.
- issue: לְמַעַן கட்டுமானத்தின் நோக்கம்–விளைவு நுணுக்கம்
  choice: எனக்குக் கோபமூட்டியதால்
  alternative: எனக்குக் கோபமூட்டுவதற்காக
  rationale: לְמַעַן நோக்கத்தையோ விளைவையோ குறிக்கலாம். இங்கு தீர்ப்புக்கான காரணச் சங்கிலியில் இயல்பாக வாசிக்க ‘கோபமூட்டியதால்’ தேர்ந்தெடுக்கப்பட்டது; அவர்கள் வெளிப்படையான நோக்கம் அதுவே என்று கட்டாயமாகத் தீர்மானிப்பதை இது தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘கடுஞ்சினம்’, ‘ஊற்றப்படும்’, ‘அணைக்கப்படாது’ என்பவை நீதித்தீர்ப்பின் தீவிரத்தையும் மூல உருவகங்களையும் பேணுகின்றன; footnote குறிப்புகள் [a], [b] முதன்மை உரையில் உரிய இடங்களில் உள்ளன.
