source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר לָ/הֶ֔ם כֹּה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/023.yaml
  text: 'And she said to them[a], “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: ta
  text: 'அவள் அவர்களிடம் சொன்னாள்: “இஸ்ரவேலின் கடவுளாகிய யாவே[a] இவ்வாறு கூறுகிறார்: ‘உங்களை என்னிடம் அனுப்பிய அந்த மனிதனிடம் சொல்லுங்கள்:’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு YHWH என்ற இறைபெயர் உள்ளது; இது பாரம்பரியமாக “கர்த்தர்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר לָהֶם
  choice: அவள் அவர்களிடம் சொன்னாள்
  rationale: தொடர்ச்சியான கதைநடையை இயல்பான நவீனத் தமிழில் தருகிறது; பெண்பால் வினை வடிவத்தையும் உரையின் பெறுநர்களையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כֹּה אָמַר
  choice: இவ்வாறு கூறுகிறார்
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் அதிகாரப்பூர்வத் தன்மையைப் பாதுகாத்து, தமிழில் இயல்பாக நிகழ்காலத்தில் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தனிப்பட்ட இறைபெயர் YHWH-ஐ ஒரு பொதுப் பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இணைப்புநிலைத் தொடரைத் தெளிவாகவும் நேரடியாகவும் வழங்குகிறது; தமிழ்ச் சொற்றொடரில் ‘இஸ்ரவேலின் கடவுளாகிய யாவே’ என இயல்பாக அமைகிறது.
- source_word: אִמְרוּ
  choice: சொல்லுங்கள்
  rationale: குழுவினரை நோக்கிய பன்மை ஏவலை மரியாதை மற்றும் எண்ணிக்கைக் குழப்பமின்றி இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לָאִישׁ
  choice: மனிதனிடம்
  rationale: אִישׁ என்பதன் ஒருமை ஆண்பால் குறிப்பைத் தக்கவைக்கிறது; சூழலில் அரசன் யோசியாவைக் குறிப்பிட்டாலும், மூலத்தில் இல்லாத பட்டத்தைச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: உங்களை என்னிடம் அனுப்பிய
  rationale: தொடர்புச் சொற்றொடரின் செயலும் திசையும் நேரடியாகப் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை YHWH என்ற தனிப்பட்ட இறைபெயரைப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதன் வழக்கமான ஒலிபெயர்ப்பு; ‘கர்த்தர்’ என்பது பாரம்பரிய மாற்றுப் பட்டம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான தீர்க்கதரிசன உரைநடை பயன்படுத்தப்பட்டுள்ளது. அடுத்த வசனத்தில் தொடரும் செய்தியை உணர்த்த இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது; மேற்கோள் அடுக்குகள் பேச்சுக்குள் வரும் கட்டளையைத் தெளிவுபடுத்துகின்றன.
