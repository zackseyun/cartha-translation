base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/013.yaml
  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
translation:
  language: ta
  text: அவர்கள் சுமை சுமப்பவர்களுக்குப் பொறுப்பாக இருந்து, ஒவ்வொரு வகையான பணியிலும்[a] வேலைசெய்த அனைவரையும் மேற்பார்வையிட்டார்கள்; லேவியர்களில் சிலர் எழுத்தர்களாகவும் அதிகாரிகளாகவும் வாயிற்காவலர்களாகவும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பணி பணியாக.’ எபிரெயில் ‘பணி’ என்ற சொல் இருமுறை வருகிறது (சொல்லுக்குச் சொல், ‘பணிக்கும் பணிக்கும்’); இது பல்வேறு பணிகளுக்குரிய பகிர்வைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  choice: சுமை சுமப்பவர்களுக்குப் பொறுப்பாக இருந்து
  rationale: סַבָּלִים என்பது பொதுவான தொழிலாளர்களை அல்ல, சுமைகளைச் சுமந்தவர்களைக் குறிக்கிறது; עַל இங்கு நிர்வாகப் பொறுப்பையும் மேற்பார்வையையும் உணர்த்துகிறது.
- source_word: וּמְנַצְּחִים
  choice: மேற்பார்வையிட்டார்கள்
  rationale: נצח என்பதன் பங்கேற்புவினை வடிவம் இச்சூழலில் வேலைகளை வழிநடத்தும் அல்லது கண்காணிக்கும் பொறுப்பைக் குறிக்கிறது; தமிழில் சூழலிலிருந்து பெறப்படும் எழுவாயுடன் இறந்தகால வினையாக இயல்பாக வழங்கப்பட்டது.
- source_word: לְכֹל עֹשֵׂה מְלָאכָה
  choice: வேலை செய்த அனைவரையும்
  rationale: எல்லா வேலைசெய்பவர்களையும் உள்ளடக்கும் பகிர்வுப் பொருளையும், செயலில் ஈடுபட்டவர்களைச் சுட்டும் பங்கேற்புவினை உணர்வையும் தெளிவாகத் தருகிறது.
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  choice: பணி பணியாக
  rationale: எபிரெய மூலத்தில் עֲבוֹדָה திரும்பக் கூறப்படுவதைத் தக்கவைத்து, பல்வேறு பணிகளுக்கு உரிய பகிர்வு அல்லது தொடர்ச்சி உணர்வைத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: וּמֵהַלְוִיִּם
  choice: லேவியர்களில் சிலர்
  rationale: מִן இங்கு பகுதியைக் குறிக்கிறது; பின்வரும் பொறுப்புகளை எல்லா லேவியர்களும் அல்ல, அவர்களில் சிலர் வகித்தனர் என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: סוֹפְרִים
  choice: எழுத்தர்கள்
  rationale: பதிவெழுதுதல் அல்லது ஆவணப் பணியில் ஈடுபட்ட எழுத்தர்களைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ் இணைச்சொல்.
- source_word: שֹׁטְרִים
  choice: அதிகாரிகள்
  rationale: நிர்வாக அல்லது மேற்பார்வை அதிகாரம் கொண்ட அலுவலர்களைக் குறிக்கும் பொதுவான, மிகைப்படுத்தாத மொழிபெயர்ப்பு.
- source_word: שׁוֹעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: ஆலய வாயில்களில் காவல் மற்றும் தொடர்புடைய பணிகளைச் செய்தவர்களை நேரடியாகக் குறிக்கிறது.
