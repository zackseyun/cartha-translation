base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/011.yaml
  text: And they gave it to the craftsmen and to the builders to buy quarried stone and timber for the supports and for roofing the buildings that the kings of Judah had ruined[a][b][c].
translation:
  language: ta
  text: அவர்கள் அந்தப் பணத்தைக் கைவினைஞர்களுக்கும் கட்டடம் கட்டுபவர்களுக்கும் கொடுத்தார்கள்; யூதாவின் அரசர்கள் சீரழித்திருந்த கட்டடங்களின் இணைப்புப் பணிகளுக்கும் அவற்றுக்குக் கூரை அமைப்பதற்கும் தேவையான குவாரியிலிருந்து எடுக்கப்பட்ட கற்களையும் மரப்பொருட்களையும் வாங்குவதற்காகக் கொடுத்தார்கள்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெட்டியெடுக்கப்பட்ட கற்கள்.’ எபிரெயச் சொற்றொடர் கட்டுமானத்திற்காகக் கல் குவாரியிலிருந்து எடுக்கப்பட்ட கற்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘இணைப்புப் பணிகள்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியில்லை; அது கட்டமைப்பு இணைப்புகள், சட்டக உறுப்புகள், அல்லது தாங்கும் உறுப்புகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘மர உத்தரங்களை அமைப்பதற்கும்’ / ‘மூடுவதற்கும்.’ எபிரெய வினை ஒரு கட்டமைப்பை மர உத்தரங்களால் மூடுவதையோ கூரை அமைப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: அவர்கள் அந்தப் பணத்தைக் கொடுத்தார்கள்
  rationale: נתן என்பதன் நேரடிப் பொருள் ‘கொடுத்தார்கள்.’ எபிரெய உரையில் செயப்படுபொருள் வெளிப்படையாக இல்லை; முந்தைய வசனச் சூழலில் அது பணத்தைக் குறிக்கிறது என்பதால் இயல்பான தமிழுக்காக ‘அந்தப் பணத்தை’ சேர்க்கப்பட்டது.
- source_word: חָרָשִׁים
  choice: கைவினைஞர்கள்
  rationale: இச்சொல் பல்வேறு தொழில்களில் தேர்ச்சிபெற்ற பணியாளர்களைக் குறிக்கிறது; ‘தச்சர்கள்’ என்று ஒரு தொழிலுக்கு மட்டும் வரையறுக்காமல் பரந்த பொருளைப் பேணுகிறது.
- source_word: בֹּנִים
  choice: கட்டடம் கட்டுகிறவர்கள்
  rationale: בנה வேரிலிருந்து வந்த இச்சொல் கட்டுமானப் பணியில் ஈடுபடுகிறவர்களை நேரடியாகக் குறிக்கிறது; நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: לִקְנוֹת
  choice: வாங்குவதற்காக
  rationale: קנה என்ற வினையின் நோக்கத்தைக் காட்டும் வினையெச்ச வடிவத்தை இயல்பான தமிழில் தருகிறது.
- source_word: אַבְנֵי מַחְצֵב
  choice: குவாரிக் கற்கள்
  rationale: கட்டுமானத்திற்காக கல் குவாரியிலிருந்து வெட்டியெடுக்கப்பட்ட கற்களைச் சுட்டுகிறது; அவை எந்த அளவுக்கு செதுக்கப்பட்டன என்பதைத் தீர்மானிக்கவில்லை.
- source_word: עֵצִים
  choice: மரங்கள்
  rationale: கட்டுமானப் பொருளாகப் பயன்படுத்தப்படும் wood/timber என்பதைக் குறிக்கிறது. ‘மரக்கட்டைகள்’ என்பதும் சாத்தியம்; ஆனால் மூலத்தின் பொதுவான சொல்லை ‘மரங்கள்’ நெருக்கமாகப் பேணுகிறது.
- source_word: לַמְחַבְּרוֹת
  choice: இணைப்பதற்கு
  rationale: இச்சொல் அரிதானதும் பொருள் உறுதியற்றதும் ஆகும்; இணைப்புகள், கட்டமைப்புச் சட்டங்கள் அல்லது தாங்கும் உறுப்புகள் எனக் குறிக்கலாம். ‘இணைப்பதற்கு’ அதன் அடிப்படைச் சொல்லியல் கருத்தைப் பேணி, குறிப்பிட்ட கட்டட உறுப்பைத் திணிக்கவில்லை.
- source_word: וּלְקָרוֹת
  choice: கூரை அமைப்பதற்கு
  rationale: கட்டடத்தின் மேல் மரக்கட்டைகளை அமைத்தல், கூரையிடுதல் அல்லது மூடுதல் என்ற கட்டுமானச் செயலைக் குறிக்கிறது.
- source_word: הַבָּתִּים
  choice: கட்டடங்கள்
  rationale: בַּיִת பொதுவாக ‘வீடு’ என்றாலும், ஆலயப் பழுதுபார்ப்புச் சூழலில் ஆலய வளாகத்தின் கட்டமைப்புகளைச் சுட்டுவதால் ‘கட்டடங்கள்’ பொருத்தமானது.
- source_word: הִשְׁחִיתוּ
  choice: பாழாக்கியிருந்த
  rationale: שחת என்பதன் ஹிஃபில் வடிவம் அழித்தல், சீரழித்தல் அல்லது சேதப்படுத்துதல் எனப் பொருள்படலாம். முழுமையாக அழித்துவிட்டதாக மிகைப்படுத்தாமல், பழுதுபார்க்க வேண்டிய நிலைக்குக் கொண்டுவந்ததை ‘பாழாக்கியிருந்த’ தெரிவிக்கிறது.
- source_word: מַלְכֵי יְהוּדָה
  choice: யூதாவின் அரசர்கள்
  rationale: எபிரெய இணைநிலைத் தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
