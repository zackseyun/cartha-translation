- from: “நீங்கள் போய், கண்டெடுக்கப்பட்ட இந்தப் புத்தகத்தின் வார்த்தைகளைக் குறித்து, எனக்காகவும் இஸ்ரவேலிலும் யூதாவிலும் மீதியாயிருப்பவர்களுக்காகவும் யெகோவாவிடம் விசாரியுங்கள். நம் முன்னோர்கள் யெகோவாவின் வார்த்தையைக் கடைப்பிடித்து, இந்தப் புத்தகத்தில் எழுதப்பட்டுள்ள அனைத்தின்படியும் செய்யாததால், நம்மேல் பொழியப்பட்டுள்ள யெகோவாவின் கடுங்கோபம் பெரிதாயிருக்கிறது.”[a]
  to: “போய், கண்டெடுக்கப்பட்ட புத்தகத்தின்[a] வார்த்தைகளைக் குறித்து, எனக்காகவும் இஸ்ரவேலிலும் யூதாவிலும் மீதமுள்ளவர்களுக்காகவும் யாவேயிடம் விசாரியுங்கள். ஏனெனில், நம் தந்தையர்[b] யாவேயின் வார்த்தையைக் கடைப்பிடிக்காமலும், இந்தப் புத்தகத்தில் எழுதப்பட்டுள்ள எல்லாவற்றின்படியும் செய்யாமலும் இருந்ததால், நம்மேல் பொழியப்பட்டிருக்கிற யாவேயின் கடுங்கோபம் மிகப் பெரிது.”
