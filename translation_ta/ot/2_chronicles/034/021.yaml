base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
translation:
  language: ta
  text: “போய், கண்டெடுக்கப்பட்ட புத்தகத்தின்[a] வார்த்தைகளைக் குறித்து, எனக்காகவும் இஸ்ரவேலிலும் யூதாவிலும் மீதமுள்ளவர்களுக்காகவும் யாவேயிடம் விசாரியுங்கள். ஏனெனில், நம் தந்தையர்[b] யாவேயின் வார்த்தையைக் கடைப்பிடிக்காமலும், இந்தப் புத்தகத்தில் எழுதப்பட்டுள்ள எல்லாவற்றின்படியும் செய்யாமலும் இருந்ததால், நம்மேல் பொழியப்பட்டிருக்கிற யாவேயின் கடுங்கோபம் மிகப் பெரிது.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “புத்தகம்” என்பதற்கு “சுருள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தந்தையர்” என்பதற்கு “முன்னோர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொற்படியாக “நம் தந்தையர்” என உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: யெகோவாவிடம் விசாரியுங்கள்
  rationale: அரச கட்டளையின் சூழலில் דרשׁ என்பது பொதுவாகத் தேடுவதைக் காட்டிலும், கண்டெடுக்கப்பட்ட புத்தகத்தைப் பற்றி இறைவழிகாட்டுதலை நாடி விசாரிப்பதைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்திலுள்ள தனிப்பெயரான יהוה என்பதை பொதுப்பட்டப் பெயராக மாற்றாமல், நவீன தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: בַּעֲדִי
  choice: எனக்காக
  rationale: בעד இங்கு ஒருவரின் சார்பாக அல்லது நலனுக்காகச் செயல்படுவதைக் குறிக்கிறது; ‘எனக்காக’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַנִּשְׁאָר בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: இஸ்ரவேலிலும் யூதாவிலும் மீதியாயிருப்பவர்கள்
  rationale: הנשאר என்பது எஞ்சியிருக்கும் மக்களைக் குறிக்கிறது. ‘மீதியாயிருப்பவர்கள்’ என்பது ‘மீதியானோர்’ என்ற இறையியல் சொல்லாட்சியைத் தேவையின்றி திணிக்காமல் மூலப் பொருளைக் காக்கிறது.
- source_word: עַל דִּבְרֵי הַסֵּפֶר אֲשֶׁר נִמְצָא
  choice: கண்டெடுக்கப்பட்ட இந்தப் புத்தகத்தின் வார்த்தைகளைக் குறித்து
  rationale: על என்பது விசாரணையின் பொருளை அறிமுகப்படுத்துகிறது; ספר என்பதற்கு ‘புத்தகம்’ அல்லது ‘சுருள்’ இரண்டும் சாத்தியம். இங்கு இயல்பான தமிழுக்காக ‘புத்தகம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: גְדוֹלָה חֲמַת יְהוָה
  choice: யெகோவாவின் கடுங்கோபம் பெரிதாயிருக்கிறது
  rationale: חמה என்பது தீவிரமான, எரியும் கோபத்தைக் குறிக்கிறது. ‘கடுங்கோபம்’ அதன் வலிமையைக் காட்டுகிறது; ‘பெரிதாயிருக்கிறது’ என்ற அமைப்பு எபிரெய வலியுறுத்தலைக் காக்கிறது.
- source_word: נִתְּכָה בָנוּ
  choice: நம்மேல் பொழியப்பட்டுள்ள
  rationale: Niphal வடிவிலுள்ள נתך, குறிப்பாகக் கோபத்தைப் பற்றியபோது, ‘பொழியப்படுதல்’ என்ற உருவகத்தைத் தருகிறது.
- source_word: אֲבוֹתֵינוּ
  choice: நம் முன்னோர்கள்
  rationale: எபிரெயச் சொல் சொற்படியாக ‘நம் தந்தையர்’ என்றாலும், இங்கு முந்தைய தலைமுறையினரை ஒருமொத்தமாகக் குறிக்கிறது; நவீன தமிழில் ‘நம் முன்னோர்கள்’ இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது.
- source_word: שָׁמְרוּ אֶת־דְּבַר יְהוָה
  choice: யெகோவாவின் வார்த்தையைக் கடைப்பிடித்து
  rationale: שׁמר இங்கு வெறுமனே பாதுகாப்பதை அல்ல, சொல்லப்பட்டதை அனுசரித்து நிறைவேற்றுவதைக் குறிக்கிறது; ‘கடைப்பிடித்து’ அந்தச் செயல்பாட்டு அர்த்தத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לַעֲשׂוֹת כְּכָל הַכָּתוּב עַל־הַסֵּפֶר הַזֶּה
  choice: இந்தப் புத்தகத்தில் எழுதப்பட்டுள்ள அனைத்தின்படியும் செய்ய
  rationale: செய்வதற்கான அளவுகோலாக எழுதப்பட்ட அனைத்தையும் எபிரெயம் முன்வைக்கிறது. தமிழில் ‘அனைத்தின்படியும் செய்ய’ என்பது அந்த அமைப்பையும் முழுமையையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் தனிப்பெயரை ‘கர்த்தர்’ போன்ற பட்டப்பெயராக மாற்றாமல் வைத்திருக்கிறது. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ முதன்மை உரையில் பயன்படுத்தப்பட்டது; உச்சரிப்பு மறுகட்டமைப்பான ‘யாவே’ சாத்திய மாற்றாகும்.
- issue: אֲבוֹתֵינוּ என்பதன் குறிப்பீடு
  choice: நம் முன்னோர்கள்
  alternative: நம் தந்தையர்
  rationale: சொல் இலக்கண ரீதியாக ஆண்பால் பன்மை என்றாலும், இச்சூழலில் முந்தைய தலைமுறைகளைச் சுட்டுகிறது. ‘முன்னோர்கள்’ அந்த வரலாற்றுக் குறிப்பை இயல்பான தமிழில் தருகிறது; ‘தந்தையர்’ சொற்படியான மாற்றாகும்.
- issue: கடுங்கோபம் ஏற்கெனவே வெளிப்பட்டதா என்பதைக் காட்டுதல்
  choice: நம்மேல் பொழியப்பட்டுள்ள
  alternative: நம்மேல் பொழியப்படுகிறது
  rationale: נִתְּכָה என்பது நிறைவுற்ற நிலையை உணர்த்தக்கூடிய வடிவம். ‘பொழியப்பட்டுள்ள’ என்பது ஏற்பட்ட செயலும் தொடரும் விளைவும் இரண்டையும் காக்கிறது; நிகழ்காலச் சாயலை மட்டும் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரச கட்டளையின் பன்மை ஏவல் ‘நீங்கள் போய்… விசாரியுங்கள்’ எனக் காக்கப்பட்டது. நீண்ட எபிரெய வாக்கியத்தின் காரண–விளைவு உறவைத் தெளிவாக்கியபோதும், அதன் தீவிரமும் இறையியல் பதற்றமும் மெலிதாக்கப்படவில்லை. முதன்மை உரையில் உள்ள [a] குறி தொடர்புடைய மாற்று மொழிபெயர்ப்புகளை அடிக்குறிப்பில் வழங்குகிறது.
