translation_notes:
  register: நவீனத் தரமான, மரியாதையும் தெளிவும் கொண்ட தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசனுக்குரிய இரண்டாம் நபர் வடிவமாக ‘உமது’ தேர்ந்தெடுக்கப்பட்டது. எபிரெய மொழியின் ‘கையில்’ என்ற உருவகம் முதன்மை உரையில் காக்கப்பட்டு, அதன் பொறுப்பு ஒப்படைத்தல் சார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
