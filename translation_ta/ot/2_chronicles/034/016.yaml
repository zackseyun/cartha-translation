base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
translation:
  language: ta
  text: பின்பு சாப்பான் அந்தப் புத்தகத்தை அரசனிடம் கொண்டுவந்து, அரசனிடம் மேலும் செய்தி தெரிவித்து, “உமது பணியாளர்களின் கையில் ஒப்படைக்கப்பட்ட அனைத்தையும் அவர்கள் செய்துகொண்டிருக்கிறார்கள்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பணியாளர்களிடம் ஒப்படைக்கப்பட்ட அனைத்தையும் அவர்கள் நிறைவேற்றிவருகிறார்கள்.” எபிரெய மரபுத்தொடரின் சொற்பொருள், “உமது பணியாளர்களின் கையில் வைக்கப்பட்ட அனைத்தும்” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: கொண்டுவந்து
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இங்கு சாப்பான் புத்தகத்தை அரசனிடம் கொண்டு வந்ததைக் குறிக்கிறது.
- source_word: הַסֵּפֶר
  choice: அந்தப் புத்தகத்தை
  rationale: סֵפֶר என்பது புத்தகம், சுருள், ஆவணம் ஆகியவற்றைக் குறிக்கலாம்; இக்கதையில் முன்பே கண்டெடுக்கப்பட்ட நூலைச் சுட்டுவதால் இயல்பான தமிழில் ‘அந்தப் புத்தகம்’ என வழங்கப்பட்டது; அதன் பொருள் வடிவம் தேவையின்றி குறிப்பாக்கப்படவில்லை.
- source_word: וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר
  choice: அரசனிடம் மேலும் செய்தி தெரிவித்து
  rationale: שוב + דבר என்ற மரபுத்தொடர் செய்தியைத் திரும்பத் தெரிவிப்பதைக் குறிக்கிறது; עוֹד என்பதன் ‘மேலும்’ என்ற பொருளும் காக்கப்பட்டுள்ளது.
- source_word: לֵאמֹר
  choice: என்றான்
  rationale: நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய மேற்கோள் வடிவம் தமிழில் இயல்பாக வாக்கிய முடிவிலுள்ள ‘என்றான்’ மூலம் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: כֹּל אֲשֶׁר נִתַּן בְּיַד עֲבָדֶיךָ
  choice: உமது பணியாளர்களின் கையில் ஒப்படைக்கப்பட்ட அனைத்தையும்
  rationale: נתן ביד என்பது ஒருவரின் பொறுப்பில் ஒப்படைப்பதைக் குறிக்கும் மரபுத்தொடர். ‘கையில் ஒப்படைக்கப்பட்ட’ என்பது எபிரெய உருவகத்தையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்கள்
  rationale: அரசவையின் சூழலில் עבד என்பது அரச பணியாளர்கள் அல்லது ஊழியர்களைக் குறிக்கிறது; ‘அடிமைகள்’ என்பது இங்கு மிகைப்படுத்தலாகவும் ‘அதிகாரிகள்’ என்பது அதிக விளக்கமாகவும் அமையும்.
- source_word: הֵם עֹשִׂים
  choice: அவர்கள் செய்துகொண்டிருக்கிறார்கள்
  rationale: வெளிப்படையான பன்மைப் பெயர்ச்சொல்லும் நிகழ்காலப் பங்கேற்பு வடிவமும் தொடர்ந்த செயல் மற்றும் வலியுறுத்தலைக் காட்டுகின்றன; தமிழ் தொடர்நிலை வடிவம் அதைப் பிரதிபலிக்கிறது.
