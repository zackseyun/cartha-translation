  text: הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ אֶל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁ֨ר אֲנִ֥י מֵבִ֛יא עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹשְׁבָ֑י/ו וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
translation:
  language: ta
  text: “இதோ, நான் உன்னை உன் தந்தையரிடம் சேர்க்கப்போகிறேன்[a]. நீ சமாதானத்துடன் உன் கல்லறைகளில் சேர்க்கப்படுவாய்[b][c]. இந்த இடத்தின்மேலும் இதன் குடிகளின்மேலும் நான் கொண்டுவரும் முழுப் பேரழிவையும் உன் கண்கள் காணாது.” அவர்கள் அரசனுக்குச் செய்தியைத் திரும்பத் தெரிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் முன்னோர்களிடம்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் நேரடியாக ‘உன் தந்தையரிடம்’ என்று உள்ளது; இது மரணத்தில் முன்னோர்களுடன் சேர்வதைக் குறிக்கும் வழக்கமான மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘கல்லறைகள்’ என்பது பன்மையில் உள்ளது. இது முன்னோர்களின் அடக்கவிடங்களையோ குடும்பக் கல்லறைத் தொகுதியையோ குறிக்கக்கூடும்; தமிழில் ‘உன் கல்லறையில்’ என்றும் இயல்பாக மொழிபெயர்க்கலாம்.
    reason: source_form
  - marker: c
    text: இங்கு ‘சமாதானத்துடன்’ என்பது, அடுத்த கூற்று விளக்குவதுபோல், வரவிருக்கும் பேரழிவை யோசியா காணாமல் காக்கப்படுவார் என்பதைக் குறிக்கலாம்; அவரது மரணம் வன்முறையற்றதாகவே இருக்கும் என்று இது கட்டாயமாகக் கூறுவதில்லை.
    reason: cross_reference
lexical_decisions:
- source_word: הִנְנִי אֹסִפְךָ
  choice: இதோ, நான் உன்னை ... சேர்க்கப்போகிறேன்
  rationale: הִנְנִי என்ற கவன ஈர்ப்புச் சொல்லையும், வரவிருக்கும் செயலைக் குறிக்கும் பங்கேற்புவினையின் வலிமையையும் காக்கிறது. אָסַף என்பதன் ‘மரணத்தில் முன்னோர்களுடன் சேர்த்தல்’ என்ற உருவகமும் தக்கவைக்கப்படுகிறது.
- source_word: אֶל אֲבֹתֶיךָ
  choice: உன் தந்தையரிடம்
  rationale: எபிரெயச் சொல்லின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது; இங்கு அது மரணத்தில் முன்னோர்களுடன் சேர்வதைக் குறிக்கும் மரபுத்தொடர்.
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: உன் கல்லறைகளில் சேர்க்கப்படுவாய்
  rationale: முந்தைய אָסַף வினையுடனான சொல் தொடர்பையும், קִבְרֹתֶיךָ என்பதிலுள்ள பன்மையையும் வெளிப்படையாகக் காக்கிறது. பன்மை முன்னோர் அடக்கவிடங்களையோ குடும்பக் கல்லறைத் தொகுதியையோ குறிக்கக்கூடும்.
- source_word: בְּשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: שָׁלוֹם என்பதன் பரந்த பொருளைத் தக்கவைக்கிறது; மரணம் வன்முறையற்றதாக இருக்கும் என்று மொழிபெயர்ப்பிலேயே தீர்மானிக்கவில்லை.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: உன் கண்கள் காணாது
  rationale: ‘நீ காணமாட்டாய்’ என்று சுருக்காமல், எபிரெய மூலத்திலுள்ள உடலுறுப்பு சார்ந்த வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: בְּכֹל הָרָעָה
  choice: பேரழிவு எதையும்
  rationale: நியாயத்தீர்ப்புச் சூழலில் רָעָה என்பது ஒழுக்கத் தீமையைவிட வரவிருக்கும் கேடு அல்லது பேரழிவைக் குறிக்கிறது. எதையும் என்பது כֹל-இன் முழுமையை இயல்பான தமிழில் தருகிறது.
- source_word: אֲנִי מֵבִיא
  choice: நான் கொண்டுவரும்
  rationale: ஏற்கெனவே உறுதியாக வரவிருக்கும் செயலைக் காட்டும் எபிரெயப் பங்கேற்புவினையின் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: இந்த இடத்தின்மேலும் இதன் குடிகளின்மேலும்
  rationale: இடத்தையும் அதில் வசிப்பவர்களையும் தனித்தனியாகக் குறிப்பிடும் மூல அமைப்பைச் சுருக்கமாகவும் தெளிவாகவும் காக்கிறது.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: அவர்கள் அரசனிடம் மறுமொழியைக் கொண்டுவந்தார்கள்
  rationale: விசாரித்த செய்திக்கான பதிலைத் திரும்பக் கொண்டுவந்தார்கள் என்ற எபிரெய மரபுத்தொடரின் பொருளை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யோசியா பின்னர் போரில் இறந்ததற்கும் ‘சமாதானத்துடன்’ என்ற வாக்குறுதிக்கும் இடையிலான பதற்றம்
  choice: ‘சமாதானத்துடன்’ என்பதை அப்படியே வைத்துக் கொண்டு, அடுத்த கூற்று யோசியா வரவிருக்கும் பேரழிவைக் காணமாட்டார் என்பதைத் தெளிவுபடுத்துகிறது என்று அடிக்குறிப்பில் கூறப்பட்டுள்ளது.
  alternative: அவர் வன்முறையற்ற மரணம் அடைவார் என்று பொருளைத் திட்டவட்டமாக்குதல்; அல்லது இது அமைதியான அடக்கத்தையே குறிக்கிறது என்று மொழிபெயர்த்தல்.
  rationale: வசனமே தரும் விளக்கத்தை முன்னிறுத்துகிறது; ஆனால் சொற்றொடரின் பொருளை அதற்கு மட்டும் கட்டுப்படுத்தியோ, பின்னர் நிகழ்ந்ததை மறைமுகமாக ஒத்திசைத்தோ விடாமல் வேதபாடத்தின் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘இதோ’, ‘தந்தையர்’, ‘சமாதானத்துடன்’ போன்ற மூலநெருக்கமுள்ள சொற்கள் பயன்படுத்தப்பட்டாலும், வாக்கிய அமைப்பு சாதாரண வாசகர்களுக்குப் புரியும் வகையில் வைக்கப்பட்டுள்ளது. எபிரெயப் பன்மையான ‘கல்லறைகள்’ உரையில் பாதுகாக்கப்பட்டு அதன் இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
