source:
  edition: WLC
  text: וַ/יַּ֣עַן חִלְקִיָּ֗הוּ וַ/יֹּ֨אמֶר֙ אֶל שָׁפָ֣ן הַ/סּוֹפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֧ן חִלְקִיָּ֛הוּ אֶת הַ/סֵּ֖פֶר אֶל שָׁפָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
translation:
  language: ta
  text: 'அப்போது இல்க்கியா எழுத்தரான சாப்பானுக்குப் பதிலளித்துச் சொன்னான்: “யாவேயின் ஆலயத்தில் திருச்சட்ட நூலைக்[a] கண்டெடுத்தேன்.” இல்க்கியா அந்த நூலைச் சாப்பானிடம் கொடுத்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருச்சட்டச் சுருள்”; எபிரெயச் சொல் ஒரு நூல், ஆவணம் அல்லது சுருளைக் குறிக்கலாம்.
    reason: சֵפֶר என்ற எபிரெயச் சொல்லின் பொருள் வரம்பையும், பொருளின் வடிவம் குறித்த தெளிவின்மையையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: மறுமொழியாக ... என்றான்
  rationale: எபிரெயக் கதையாடலில் வரும் ‘பதிலளித்து, சொன்னான்’ என்ற இரட்டைச் சொற்றொடரின் மறுமொழித் தன்மையைப் பாதுகாத்து, தமிழில் இயல்பாக அமைக்கிறது.
- source_word: הַסּוֹפֵר
  choice: எழுத்தர்
  rationale: இச்சொல் எழுத்தர் அல்லது அரசவைச் செயலர் போன்ற அதிகாரியைக் குறிக்கலாம்; ‘எழுத்தர்’ மூலச்சொல்லுக்கு நெருக்கமாக இருந்து, பதவியை அளவுக்கு மீறிக் குறிப்பாக்குவதில்லை.
- source_word: סֵפֶר הַתּוֹרָה
  choice: திருச்சட்ட நூல்
  rationale: תּוֹרָה இச்சூழலில் உடன்படிக்கைச் சட்டத் தொகுப்பைக் குறிக்கிறது. סֵפֶר என்பது நூல், ஆவணம் அல்லது சுருள் எனப் பொருள்படலாம்; ‘நூல்’ அதன் வடிவத்தைத் தேவையின்றி முடிவுசெய்யாது.
- source_word: מָצָאתִי
  choice: கண்டெடுத்தேன்
  rationale: முடிவுற்ற கண்டுபிடிப்பையும், அதை உடனடியாக அறிவிக்கும் தற்போதைய தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּבֵית יְהוָה
  choice: யாவேயின் ஆலயத்தில்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு/இல்லம்’ என்றாலும், இச்சூழலில் அது எருசலேம் ஆலயத்தைக் குறிக்கிறது; ‘ஆலயம்’ நவீன தமிழில் தெளிவான சூழல்சார் மொழிபெயர்ப்பு.
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר אֶל שָׁפָן
  choice: அந்த நூலைச் சாப்பானிடம் கொடுத்தான்
  rationale: נתן என்பதன் சாதாரணமான ‘கொடு’ என்ற பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரெய உரையில் நான்கு எழுத்துகளாலான தனிப்பட்ட இறைபெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘கர்த்தர்’ என மாற்றாமல், தமிழில் பெயராக ஒலிபெயர்த்துள்ளது.
- issue: תּוֹרָה என்பதன் பொருள்
  choice: திருச்சட்டம்
  alternative: போதனை
  rationale: ‘போதனை’ என்பது சொற்பொருளில் சாத்தியமானாலும், ஆலயத்தில் கண்டெடுக்கப்பட்ட உடன்படிக்கைச் சட்டத் தொகுப்பே இங்கு கருத்தாக இருப்பதால் ‘திருச்சட்டம்’ சூழலுக்கு ஏற்றது; நூலின் துல்லியமான வரலாற்று அடையாளம் கூடுதலாக நிர்ணயிக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் எபிரெய வடிவங்களுக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளன; அதிகாரப்பூர்வப் பதவியும் நூலின் உடல் வடிவமும் தேவையின்றி மிகத் துல்லியமாக்கப்படவில்லை.
