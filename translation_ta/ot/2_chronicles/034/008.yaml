base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: In the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
translation:
  language: ta
  text: அவனுடைய ஆட்சியின் பதினெட்டாம் ஆண்டில், நாட்டையும் ஆலயத்தையும்[a] தூய்மைப்படுத்திய பின்பு, தன் கடவுளாகிய யாவேயின் ஆலயத்தைப் பழுதுபார்க்க[b] அசலியாவின் மகன் சாப்பானையும், நகரத் தலைவரான மாசெயாவையும், பதிவாளரான யோவாகாஸின் மகன் யோவாவையும் அனுப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “நாட்டையும் வீட்டையும்”; இங்கு “வீடு” என்பது ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வலுப்படுத்த”; கட்டடத்தைப் பற்றிய இச்சூழலில் பழுதுபார்த்து மீட்டமைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  choice: அவன் ஆட்சி செய்த பதினெட்டாம் ஆண்டில்
  rationale: அரசாட்சிக் காலத்தைக் குறிக்கும் எபிரெய வழக்கை இயல்பான நவீன தமிழில் தருகிறது; தொடக்க וְ என்பது கதைத் தொடர்ச்சியைக் குறிப்பதால் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: לְטַהֵר
  choice: தூய்மைப்படுத்திய பின்பு
  rationale: முந்தைய வசனங்களில் தூய்மைப்படுத்துதல் நிறைவடைந்ததாகக் கூறப்படும் கதைச்சூழலுக்கு ஏற்ப காலத் தொடர்பாக மொழிபெயர்க்கப்பட்டது; இலக்கண ரீதியான நோக்கப்பொருள் வாய்ப்பு முற்றிலும் மறுக்கப்படவில்லை.
- source_word: הָאָרֶץ וְהַבָּיִת
  choice: நாட்டையும் ஆலயத்தையும்
  rationale: הַבַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு’ என்றாலும், இங்கு யாவேயின் ஆலயமே குறிக்கப்படுவதால் வாசகருக்குத் தெளிவான ‘ஆலயம்’ பயன்படுத்தப்பட்டது; நேர்ப்பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: שַׂר הָעִיר
  choice: நகரத் தலைவர்
  rationale: שַׂר என்பது அதிகாரம் கொண்ட அலுவலர் அல்லது ஆளுநரைக் குறிக்கிறது; குறிப்பிட்ட நிர்வாக அமைப்பை அளவுக்கு மீறி நிர்ணயிக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: הַמַּזְכִּיר
  choice: பதிவாளர்
  rationale: அரச ஆவணங்கள் அல்லது நினைவுப் பதிவுகளுக்குப் பொறுப்பான அதிகாரப் பதவியைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: לְחַזֵּק
  choice: பழுதுபார்க்க
  rationale: வினையின் அடிப்படைப் பொருள் ‘வலுப்படுத்த’ என்பதாக இருந்தாலும், கட்டடத்தைப் பற்றிய இச்சூழலில் செப்பனிடுதல் அல்லது பழுதுபார்த்தலைக் குறிக்கிறது.
- source_word: בֵּית יְהוָה אֱלֹהָיו
  choice: தன் கடவுளாகிய யாவேயின் ஆலயம்
  rationale: சொந்தப்பெயரான יהוה-ஐ ஒலிபெயர்த்து, בֵּית என்பதைக் கோவில் சூழலுக்கேற்ற ‘ஆலயம்’ என்று தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் நான்கு எழுத்து இறைப்பெயரை பொதுப்பட்டமாக மாற்றாமல், ‘Yahweh’ என்பதற்கேற்ற தமிழாக்க ஒலிவடிவில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. பெயர்கள் தமிழில் உச்சரிக்க எளிதான ஒலிபெயர்ப்பில் தரப்பட்டன; நிர்வாகப் பதவிகளில் தேவையற்ற நவீனத் துல்லியம் திணிக்கப்படவில்லை.
