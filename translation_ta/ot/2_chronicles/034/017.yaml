  text: וַ/יַּתִּ֕יכוּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בְּ/בֵית יְהוָ֑ה וַֽ/יִּתְּנ֗וּ/הוּ עַל יַד֙ הַ/מֻּפְקָדִ֔ים וְ/עַל יַ֖ד עוֹשֵׂ֥י הַ/מְּלָאכָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
translation:
  language: ta
  text: யாவேயின் ஆலயத்தில் கண்டெடுக்கப்பட்ட வெள்ளிப் பணத்தை அவர்கள் காலிசெய்து, அதை மேற்பார்வையாளர்களிடமும் வேலை செய்பவர்களிடமும் ஒப்படைத்தார்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெளியே எடுத்தார்கள்’ அல்லது ‘வெள்ளியை வழங்கினார்கள்’ என்றும் பொருள்கொள்ளலாம். எபிரெய வினைச்சொல் அடிப்படையில் ‘ஊற்றுதல்’ என்பதைக் குறிக்கலாம்; வேறு சூழல்களில் ‘உருக்குதல்’ என்ற தொடர்பும் உண்டு. ஆனால் இங்கு அடுத்ததாக அந்த வெள்ளி பொறுப்பாளர்களிடமும் வேலை செய்பவர்களிடமும் ஒப்படைக்கப்படுவதால், சேகரிக்கப்பட்ட பணத்தைக் காலிசெய்து வழங்குவதே பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘யாவேயின் வீடு’; இது ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  choice: வெளியே எடுத்திருக்கிறார்கள்
  rationale: இந்தச் சூழலில் சேகரிக்கப்பட்ட வெள்ளியை இருந்த இடத்திலிருந்து வெளியே எடுத்து வழங்குவதே கருத்தாகத் தெரிகிறது. எபிரெய வினைச்சொல்லின் ‘ஊற்றுதல்/காலிசெய்தல்’ என்ற உருவகத்தைத் தமிழில் அப்படியே கூறுவது இயல்பற்றதாக இருப்பதால், அதன் சூழல்சார் பொருள் தெளிவாக வழங்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: הַכֶּסֶף
  choice: வெள்ளிப் பணம்
  rationale: כֶּסֶף என்பதன் அடிப்படைப் பொருள் ‘வெள்ளி’; இங்கு ஆலய நிதியாகப் பயன்படுத்தப்படும் பணத்தைக் குறிப்பதால் ‘வெள்ளிப் பணம்’ என்பது பொருளையும் உலோகத்தையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: הַנִּמְצָא
  choice: கண்டெடுக்கப்பட்ட
  rationale: நிபால் பங்கேற்புவினையின் செயப்படுபொருள் நிலையை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: בְּבֵית יְהוָה
  choice: யாவேயின் ஆலயத்தில்
  rationale: சொல்லுக்கு சொல் ‘யாவேயின் வீட்டில்’ என்றாலும், இச்சூழலில் அது ஆலயத்தையே குறிக்கிறது. ‘ஆலயம்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது; மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான நான்கு எபிரெய எழுத்துகளைக் பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיִּתְּנֻהוּ
  choice: ஒப்படைத்திருக்கிறார்கள்
  rationale: அடிப்படையில் ‘கொடுத்தார்கள்’ என்ற பொருள் இருந்தாலும், தொடர்ந்து வரும் ‘கையில்’ என்ற நிர்வாகப் பொறுப்பு மரபுத்தொடருக்கு ஏற்ப நிதியைப் பொறுப்பாக வழங்கியதை ‘ஒப்படைத்தல்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל יַד
  choice: -இடம் ஒப்படைத்தல்
  rationale: சொல்லுக்கு சொல் ‘கையின்மேல்’ என்ற எபிரெய மரபுத்தொடர் ஒருவரின் பொறுப்பில் ஒப்படைப்பதைக் குறிக்கிறது; தமிழில் நபரைக் குறிக்கும் ‘-இடம்’ மற்றும் ‘ஒப்படைத்தல்’ இணைப்பு அதே நிர்வாகப் பொருளைத் தருகிறது.
- source_word: הַמֻּפְקָדִים
  choice: மேற்பார்வையாளர்கள்
  rationale: நியமிக்கப்பட்டு பொறுப்பு வகித்தவர்களின் மேற்பார்வைப் பணியைச் சூழலுக்கேற்ற வகையில் காட்டுகிறது.
- source_word: עוֹשֵׂי הַמְּלָאכָה
  choice: வேலை செய்கிறவர்கள்
  rationale: குறிப்பிட்ட ஒரு தொழிலாளர் வகையைத் தேவையின்றி இறுக்கமாக்காமல், பணியில் ஈடுபட்ட அனைவரையும் உள்ளடக்கும் மூலத்தின் விரிவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பட்ட திருநாமம் நேரடியாக உள்ளது. ஆகவே அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பாக வழங்குவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மரியாதைமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டது. நிர்வாகச் சூழலைத் தெளிவாக்க ‘ஒப்படைத்திருக்கிறார்கள்’ பயன்படுத்தப்பட்டது. எபிரெய உரையின் தொடர்ச்சியான அறிக்கைநடையைப் பிரதிபலிக்க நிறைவுநிலை வினை வடிவம் காக்கப்பட்டது.
