- from: யாவேயின் ஆலயத்தில் கண்டெடுக்கப்பட்ட வெள்ளிப் பணத்தை அவர்கள் வெளியே எடுத்திருக்கிறார்கள்[a]; அதை மேற்பார்வையாளர்களிடமும் வேலை செய்கிறவர்களிடமும் ஒப்படைத்திருக்கிறார்கள்[b].
  to: யாவேயின் ஆலயத்தில் கண்டெடுக்கப்பட்ட வெள்ளிப் பணத்தை அவர்கள் காலிசெய்து, அதை மேற்பார்வையாளர்களிடமும் வேலை செய்பவர்களிடமும் ஒப்படைத்தார்கள்[a][b].
  rationale: கதைநடையின் இறந்தகாலத்தை இயல்பான தமிழில் மீட்டமைத்தோம். முதல் வினைக்குச் சூழலுக்கு ஏற்ற ‘காலிசெய்து’ என்பதைக் கொண்டு, அதன் பிறகு நிதி ஒப்படைக்கப்பட்ட தொடர்ச்சியைத் தெளிவாக்கினோம். திருநாமம், ஆலயக் குறிப்பு, நிர்வாகப் பொறுப்பு, மற்றும் இரு பெறுநர் குழுக்களும் பாதுகாக்கப்பட்டுள்ளன.
