  source_fidelity: மொத்தத்தில் பொருள் மூலத்திற்கு நெருக்கமாக உள்ளது. ஆனால் וַיַּתִּיכוּ என்பதற்கு ‘வெளியே எடுத்தார்கள்’ என்பது சாத்தியமான சூழல்சார் விளக்கமாக இருந்தாலும், வினையின் ‘காலிசெய்து/வெளியேற்றிக் கொடுத்த’ நுணுக்கத்தைச் சற்றுக் குறைக்கிறது. மேலும் வினைகள் எபிரெயக் கதைநடையின் இறந்தகாலச் செயலைக் குறிக்கின்றன; ‘எடுத்திருக்கிறார்கள்/ஒப்படைத்திருக்கிறார்கள்’ என்ற நிறைவுநிலை நிகழ்காலத் தொடர்பு வடிவம் இங்கு தேவையற்றது.
  naturalness: ‘வெள்ளிப் பணம்’ இயல்பானது. ‘வேலை செய்கிறவர்கள்’ என்பதற்குப் பதில் சூழலில் ‘வேலை செய்பவர்களிடம்’ என்பது சற்றே செம்மையாகவும் நேரடியாகவும் இருக்கும். ‘பொறுப்பாளர்கள்’ என்பது הַמֻּפְקָדִים என்ற ‘நியமிக்கப்பட்டவர்கள்/மேற்பார்வையாளர்கள்’ என்ற கருத்தை இயல்பாகத் தருகிறது.
  terminology: ‘யாவே’ என்ற திருநாம ஒலிபெயர்ப்பு சரியானது. ‘ஆலயம்’ சூழலுக்கு இயல்பானது; அடிக்குறிப்பு மூலத்தின் ‘யாவேயின் வீடு’ என்ற சொல்லாட்சியைப் பாதுகாக்கிறது. இரு பெறுநர் குழுக்களுக்கும் எபிரெயத்தின் தனித்தனி עַל־יַד அமைப்பைத் தமிழில் தெளிவாக வைத்திருக்க வேண்டும்.
