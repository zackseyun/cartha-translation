base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
translation:
  language: ta
  text: அந்த மனிதர்கள் வேலையில் நம்பகமாகப் பணியாற்றினார்கள். அவர்கள்மேல் மேற்பார்வை செய்ய மெராரியின் சந்ததியைச் சேர்ந்த லேவியர்களான யகாத்தும் ஒபதியாவும், கோகாத்தியரின் சந்ததியைச் சேர்ந்த செகரியாவும் மெசுல்லாமும் நியமிக்கப்பட்டிருந்தார்கள்; மேலும், இசைக்கருவிகளில் திறமைபெற்ற[b] லேவியர்கள் அனைவரும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: சொல்லர்த்தமாக, “பாடலுக்கான கருவிகளில் அறிவுள்ள அனைவரும்”; அதாவது, இசைக்கருவிகளில் தேர்ச்சி பெற்ற அனைவரும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּאֱמוּנָה
  choice: உண்மையுடன்
  rationale: இச்சொல் வினையடைப் பொருளில் வந்து, பணியாளர்கள் நம்பிக்கைக்குரியவர்களாகவும் நேர்மையாகவும் வேலை செய்த முறையைக் குறிக்கிறது; மனநிலையான ‘விசுவாசம்’ என்று பொருள் கொள்ளாமல் செயல் நம்பகத்தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּמְּלָאכָה
  choice: வேலையை
  rationale: இங்கு ஆலயப் பழுதுபார்ப்புப் பணியையே குறிக்கிறது. எபிரெயச் சொல்லமைப்பை அப்படியே பின்பற்றாமல், தமிழில் ‘வேலையைச் செய்தார்கள்’ என்பது இயல்பாக அமைகிறது.
- source_word: מֻפְקָדִים
  choice: நியமிக்கப்பட்டிருந்தார்கள்
  rationale: פקד என்பதன் ஹொஃபால் வினையெச்சம் பொறுப்புக்கு நியமிக்கப்பட்டிருப்பதைச் சுட்டுகிறது; அதன் செயப்பாட்டு வலிமையை இந்தத் தமிழ் வடிவம் காக்கிறது.
- source_word: יַחַת
  choice: யகாத்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்த்துள்ளது.
- source_word: עֹבַדְיָהוּ
  choice: ஒபதியா
  rationale: தமிழில் வாசிக்க இயல்பான முறையில் எபிரெயப் பெயர் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: מִן בְּנֵי מְרָרִי
  choice: மெராரியின் சந்ததியினர்
  rationale: சொல்லுக்கு சொல் ‘மெராரியின் மகன்கள்’ என்று கூறுவதைவிட, இங்குள்ள குலவழிப் பொருளை ‘சந்ததியினர்’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: זְכַרְיָה
  choice: செகரியா
  rationale: எபிரெயப் பெயருக்கு நெருக்கமான, தமிழில் தெளிவாக வாசிக்கக்கூடிய எழுத்துப்பெயர்ப்பு.
- source_word: מְשֻׁלָּם
  choice: மெசுல்லாம்
  rationale: எபிரெயப் பெயர் தமிழில் ஒலிப்புக்கு நெருக்கமாக எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: מִן בְּנֵי הַקְּהָתִים
  choice: கோகாத்தியரின் சந்ததியினர்
  rationale: கோகாத் குலத்தைச் சேர்ந்த சந்ததியினரை குறிக்கும் எபிரெயக் குலப்பெயரின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְנַצֵּחַ
  choice: மேற்பார்வையிட
  rationale: ஆலயப் பழுதுபார்ப்பின் நிர்வாகச் சூழலில் இவ்வினை பணியை வழிநடத்தி மேற்பார்வை செய்வதைக் குறிக்கிறது.
- source_word: כָּל מֵבִין
  choice: திறமைபெற்ற ... அனைவரும்
  rationale: מֵבִין என்பது வெறும் அறிவைப் பெறுவதைக் காட்டிலும் நடைமுறைத் தேர்ச்சியை இங்கு குறிக்கிறது.
- source_word: בִּכְלֵי שִׁיר
  choice: இசைக்கருவிகளில்
  rationale: சொல்லர்த்தத்தில் ‘பாடலின் கருவிகள்’; பயன்பாட்டுப் பொருளில் இசை இசைக்கப் பயன்படும் கருவிகள் என்பதால் இவ்வாறு இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: வசனத்தின் இறுதியில் உள்ள இலக்கணத் தொடர்ச்சி
  choice: முடிவில் நீண்ட கோடு வைத்து, அடுத்த வசனத்திற்குத் தொடரும் முழுமையடையாத சொற்றொடரைப் பாதுகாத்தல்
  alternative: ‘லேவியர்கள் அனைவரும்’ என்பதற்கு ஊகிக்கப்பட்ட ஒரு வினையைச் சேர்த்து முழு வாக்கியமாக்குதல்
  rationale: எபிரெய மூலத்தில் இறுதிப் பகுதியுக்கு வெளிப்படையான வினை இல்லை; அடுத்த வசனத்துடன் உள்ள தொடர்போ அல்லது முன் கூறப்பட்டவர்களுடனான இணைப்போ முற்றிலும் தீர்மானிக்கப்படாமல் உள்ளது. இல்லாத வினையைச் சேர்ப்பது அந்த உண்மையான தெளிவின்மையை நீக்கிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. குலவழிப் பெயர்களுக்கு ‘சந்ததியினர்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இறுதி இலக்கணத் தொடர்ச்சியைத் தீர்க்காமல் நீண்ட கோட்டால் காட்டப்பட்டுள்ளது; [a], [b] குறிப்பான்கள் அவை விளக்கும் சொற்களுக்குப் பின் நேரடியாக வைக்கப்பட்டுள்ளன.
