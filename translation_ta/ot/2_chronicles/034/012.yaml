revisions:
- from: அந்த மனிதர்கள் வேலையை உண்மையுடன் செய்தார்கள். அவர்களை மேற்பார்வையிட[a], மெராரியின் சந்ததியினரான லேவியர்கள் யகாத்தும் ஒபதியாவும், கோகாத்தியரின் சந்ததியினரான செகரியாவும் மெசுல்லாமும் நியமிக்கப்பட்டிருந்தார்கள்; மேலும், இசைக்கருவிகளில் திறமைபெற்ற[b] லேவியர்கள் அனைவரும்—
  to: அந்த மனிதர்கள் வேலையில் நம்பகமாகப் பணியாற்றினார்கள். அவர்கள்மேல் மேற்பார்வை செய்ய மெராரியின் சந்ததியைச் சேர்ந்த லேவியர்களான யகாத்தும் ஒபதியாவும், கோகாத்தியரின் சந்ததியைச் சேர்ந்த செகரியாவும் மெசுல்லாமும் நியமிக்கப்பட்டிருந்தார்கள்; மேலும், இசைக்கருவிகளில் திறமைபெற்ற[b] லேவியர்கள் அனைவரும்—
  rationale: The revision removes an unwarranted explicit object from the supervisory infinitive, improves the rendering of faithful work, and clarifies the coordinated Merari and Kohath groups. The final dash is retained because the Hebrew concludes with a verbless, syntactically suspended phrase; no inferred verb has been supplied. Footnote a is retained as part of the supplied audit trail even though the revised Tamil wording does not display an [a] anchor, since it documents the lexical alternative for ‘மேற்பார்வை செய்ய.’
