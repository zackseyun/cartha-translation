  text: וַ/יִּשְׁלַ֖ח הַ/מֶּ֑לֶךְ וַ/יֶּאֱסֹ֕ף אֶת כָּל זִקְנֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/029.yaml
  text: Then the king sent and gathered all the elders of Judah and Jerusalem[a].
translation:
  language: ta
  text: அப்போது அரசன் அனுப்பி, யூதா மற்றும் எருசலேமின் மூப்பர்கள் அனைவரையும் ஒன்றுகூட்டினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ஆளனுப்பி
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்பு.’ தொடர்ந்து மூப்பர்கள் ஒன்றுகூட்டப்பட்டதாக வருவதால், தமிழில் இயல்பாகவும் சூழலுக்கு ஏற்றவாறும் ‘ஆளனுப்பி’ என மொழிபெயர்க்கப்பட்டது. அனுப்பப்பட்டவர் யார் அல்லது அழைப்பு எவ்வாறு தெரிவிக்கப்பட்டது என்பதை இது குறிப்பாக நிர்ணயிப்பதில்லை.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய மூலத்தில் தனிப்பெயருக்குப் பதிலாக திட்டவட்டமான பட்டப்பெயர் பயன்படுத்தப்பட்டுள்ளதால், ‘அரசன்’ எனவே தக்கவைக்கப்பட்டது.
- source_word: וַיֶּאֱסֹף
  choice: ஒன்றுகூட்டினான்
  rationale: אָסף என்பது இச்சூழலில் மக்களைச் சேர்த்து ஒன்றுகூட்டுவதைக் குறிக்கிறது. ‘ஒன்றுகூட்டினான்’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: אֶת כָּל
  choice: அனைவரையும்
  rationale: אֶת நேரடி செயப்படுபொருள் அடையாளம்; כָּל முழுமையைக் குறிக்கிறது. மக்களைக் குறிக்கும் பன்மைச் சொல்லுடன் தமிழில் ‘அனைவரையும்’ என்பது பொருத்தமானது.
- source_word: זִקְנֵי
  choice: மூப்பர்கள்
  rationale: זָקֵן இங்கு வயதான ஆண்களை மட்டும் அல்லாமல், அங்கீகரிக்கப்பட்ட சமூகத் தலைவர்களான மூப்பர்களைக் குறிக்கிறது.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: யூதா மற்றும் எருசலேமின்
  rationale: இணைக்கப்பட்ட இரண்டு இடங்களுக்கும் உரிய மூப்பர்களைக் குறிக்கும் எபிரெய அமைப்பு தமிழில் சுருக்கமாகவும் தெளிவாகவும் இவ்வாறு வழங்கப்பட்டது.
