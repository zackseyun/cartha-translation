base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
translation:
  language: ta
  text: 'அப்போது இல்க்கியாவும் அரசன் அனுப்பியவர்களும் பெண் இறைவாக்கினரான[a] உல்தாவிடம் சென்றார்கள். உல்தா, ஆடைகளுக்குப் பொறுப்பாளரான அஸ்ராவின் மகன் தோக்காத்தின் மகன் சல்லூமின் மனைவி. அவள் எருசலேமில் இரண்டாம் பகுதியில்[b] வசித்து வந்தாள். அவர்கள் அவளிடம் இவ்வாறு பேசினார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல் பெண்பால் வடிவில் உள்ளது; அதனால் உல்தா பெண் இறைவாக்கினராகத் தெளிவாகக் குறிப்பிடப்படுகிறாள்.
    reason: lexical_note
  - marker: b
    text: எபிரேயத்தில் மிஷ்னே. இது எருசலேமின் ஒரு பகுதியின் பெயராக இருக்கலாம்; மரபாக ‘இரண்டாம் பகுதி’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: சென்றார்கள்
  rationale: எபிரேயக் கதைநடையின் தொடர்வினையை இயல்பான தமிழ் இறந்தகாலமாகத் தருகிறது; கூட்டு எழுவாய்க்கேற்ப பன்மை பயன்படுத்தப்பட்டது.
- source_word: וַאֲשֶׁר הַמֶּלֶךְ
  choice: மற்றும் அரசன் அனுப்பியவர்கள்
  rationale: மூலத்தில் உள்ள சுருக்கமான தொடர் முந்தைய வசனத்தின் தூதுக்குழுவைக் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க மறைந்துள்ள ‘அனுப்பிய’ கருத்து வெளிப்படுத்தப்பட்டது.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: இறைவாக்கினளான உல்தா
  rationale: பெண்பால் வடிவத்தைப் பேணியும், நவீனத் தமிழில் இயல்பாகவும் தருகிறது.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: சல்லூமின் மனைவி
  rationale: திருமண உறவைக் குறிக்கும் நேரடியான இணைப்புத் தொடர்.
- source_word: בֶּן תוקהת בֶּן חַסְרָה
  choice: சல்லூம் தோக்காத்தின் மகன், தோக்காத் அஸ்ராவின் மகன்
  rationale: வம்சத் தொடரைத் தெளிவான தமிழ்ச் சொற்றொடராகப் பேணுகிறது.
- source_word: שׁוֹמֵר הַבְּגָדִים
  choice: ஆடைகளின் பொறுப்பாளன்
  rationale: சொல்லடியாக ‘ஆடைகளைக் காப்பவன்’; இது அரச அலுவல் பதவியாக இருக்கலாம் என்பதைக் கட்டாயமாகத் தீர்மானிக்காமல் இயல்பாகத் தருகிறது.
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: அவள் ... குடியிருந்தாள்
  rationale: தொடர்ச்சியான வசிப்பிடத்தைச் சுட்டும் பங்கேற்பு வடிவத்தை இயல்பான தமிழ் பின்னணிக் கூற்றாகத் தருகிறது.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமின்
  rationale: தமிழில் நிலைபெற்ற இடப்பெயர் வடிவம்; அடுத்துள்ள பகுதியோடு உடைமைத் தொடர்பில் இயல்பாக இணைக்கப்பட்டது.
- source_word: בַּמִּשְׁנֶה
  choice: இரண்டாம் பகுதியில்
  rationale: எருசலேமிலிருந்த பெயரிடப்பட்ட ஒரு பகுதியாக இருக்கக்கூடிய சொல்லின் சாத்தியமான பொருளைத் தருகிறது; உறுதியின்மை அடிக்குறிப்பில் பேணப்படுகிறது.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  choice: 'அவர்கள் அவளிடம் இவ்வாறு பேசினார்கள்:'
  rationale: அடுத்து வரும் உரையை அறிமுகப்படுத்தும் மூலத்தின் சுட்டுத்தன்மையையும் கண்ணியமான தமிழ் நடையையும் பேணுகிறது.
