  text: וַ/יַּעֲמֹ֨ד הַ/מֶּ֜לֶךְ עַל עָמְד֗/וֹ וַ/יִּכְרֹ֣ת אֶֽת הַ/בְּרִית֮ לִ/פְנֵ֣י יְהוָה֒ לָ/לֶ֜כֶת אַחֲרֵ֣י יְהוָ֗ה וְ/לִ/שְׁמ֤וֹר אֶת מִצְוֺתָי/ו֙ וְ/עֵֽדְוֺתָ֣י/ו וְ/חֻקָּ֔י/ו בְּ/כָל לְבָב֖/וֹ וּ/בְ/כָל נַפְשׁ֑/וֹ לַ/עֲשׂוֹת֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית הַ/כְּתוּבִ֖ים עַל הַ/סֵּ֥פֶר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
translation:
  language: ta
  text: 'பின்னர் அரசன் தன் இடத்தில் நின்று, யாவேவின் முன்னிலையில் உடன்படிக்கையைச் செய்தான்: யாவேவைப் பின்பற்றி நடக்கவும், அவருடைய கட்டளைகளையும் சாட்சியங்களையும் விதிமுறைகளையும் தன் முழு இதயத்தோடும் முழு ஆன்மாவோடும் கடைப்பிடிக்கவும், இந்தப் புத்தகத்தில்[a] எழுதப்பட்டிருந்த உடன்படிக்கையின் வார்த்தைகளை நிறைவேற்றவும் உறுதியளித்தான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, வரலாற்று வழக்கில், “இந்தச் சுருளில்.” எபிரேயச் சொல் சுருள் வடிவிலான எழுதப்பட்ட ஆவணத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל־עָמְדוֹ
  choice: அரசன் தனக்குரிய இடத்தில் நின்று
  rationale: עַל־עָמְדוֹ என்பது அரசனுக்கென அமைந்த இடம் அல்லது நிலையைச் சுட்டும் மரபுத்தொடர். கட்டட அமைப்பை ஊகிக்காமல், இயல்பான தமிழில் அதன் பொருளைப் பாதுகாக்கிறது.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: அந்த உடன்படிக்கையை ஏற்படுத்தினான்
  rationale: כרת ברית என்பதன் சொற்பொருள் ‘உடன்படிக்கையை வெட்டுதல்’; ஆனால் அது உடன்படிக்கையைச் செய்தல் அல்லது உறுதிப்படுத்துதல் என்ற எபிரேய மரபுத்தொடர். இங்குள்ள குறிப்பிட்ட சுட்டை הַבְּרִית காரணமாக ‘அந்த’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவே முன்னிலையில்
  rationale: இச்சொற்றொடர் யாவேயின் சந்நிதியில் நிகழ்ந்த solemn covenant action-ஐக் குறிக்கிறது; இயல்பான நவீன தமிழில் ‘முன்னிலையில்’ இதைத் தெளிவாகத் தருகிறது.
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  choice: யாவேவைப் பின்பற்றி நடக்கவும்
  rationale: மூலத்திலுள்ள ‘பின்னால் நடத்தல்’ என்ற உடன்படிக்கைசார் உருவகத்தை ‘பின்பற்றி நட’ என்பது தமிழில் இயல்பாகவும் தெளிவாகவும் காக்கிறது.
- source_word: מִצְוֺתָיו וְעֵדְוֺתָיו וְחֻקָּיו
  choice: அவருடைய கட்டளைகளையும் சாட்சியங்களையும் சட்டங்களையும்
  rationale: அருகருகே வரும் மூன்று சட்டவியல் சொற்களையும் ஒன்றாகக் கலக்காமல் தனித்தனி இணைகளால் மொழிபெயர்க்கிறது. עֵדוֹת என்பதன் ‘சாட்சி’ சார்ந்த சொல்லமைப்பும் பாதுகாக்கப்படுகிறது.
- source_word: בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ
  choice: தன் முழு இதயத்தோடும் முழு ஆன்மாவோடும்
  rationale: உபாகம மொழிநடையை எதிரொலிக்கும் ‘இதயம்—ஆன்மா’ இணையைச் சுருக்கிப் பொது விசுவாசம் என மாற்றாமல் வைத்திருக்கிறது.
- source_word: לַעֲשׂוֹת אֶת־דִּבְרֵי הַבְּרִית
  choice: உடன்படிக்கையின் வார்த்தைகளை நிறைவேற்றவும்
  rationale: עשה இங்கு உடன்படிக்கையின் வார்த்தைகளை நடைமுறைப்படுத்துவதைக் குறிக்கிறது. ‘நிறைவேற்ற’ என்பது தமிழில் செயற்படுத்துதல் மற்றும் கீழ்ப்படிதல் ஆகிய கருத்துகளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַסֵּפֶר הַזֶּה
  choice: இந்தப் புத்தகத்தில்
  rationale: סֵפֶר என்பது எழுதப்பட்ட ஆவணம் அல்லது சுருளைக் குறிக்கலாம். வாசிப்புக்கு இயல்பான ‘புத்தகம்’ முதன்மை உரையில் வைக்கப்பட்டு, வரலாற்று வடிவமான ‘சுருள்’ அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கு எழுத்துகளாலான தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- issue: לָלֶכֶת אַחֲרֵי יְהוָה என்ற உடன்படிக்கைசார் உருவகத்தைப் பாதுகாத்தல்
  choice: யாவேவைப் பின்பற்றி நடக்கவும்
  alternative: யாவேவைப் பின்பற்றவும்
  rationale: ‘நடத்தல்’ என்ற மூல உருவகம் உபாகமச் சார்ந்த உடன்படிக்கை மொழியின் நயத்தைத் தாங்குவதால் அதைத் தமிழிலும் பாதுகாக்கிறது.
- issue: נֶפֶשׁ என்பதன் பொருள்
  choice: ஆன்மா
  alternative: முழு உயிர் / முழு ஆளுமை
  rationale: נֶפֶשׁ என்பதற்கு உயிர், நபர், முழு ஆளுமை போன்ற பரந்த பொருள்கள் இருந்தாலும், இங்குள்ள நிலையான ‘இதயம்—ஆன்மா’ உடன்படிக்கைச் சூத்திரத்தின் வேதாகமத் தொடர்பை முதன்மை உரை பாதுகாக்கிறது; இதனால் உடல்–ஆன்மா குறித்த குறிப்பிட்ட தத்துவப் பிரிவினை வலியுறுத்துவது நோக்கமல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டது. உடன்படிக்கைச் சட்டவியல் சொற்களும் ‘பின்பற்றி நட’ என்ற உருவகமும் பாதுகாக்கப்பட்டுள்ளன. மூல எபிரேயத்தின் நிறுத்தக்குறி கட்டமைப்பைத் தமிழில் தெளிவாக்க இரண்டாவது வாக்கியம் விளக்கவாக்கியமாக அமைக்கப்பட்டது.
