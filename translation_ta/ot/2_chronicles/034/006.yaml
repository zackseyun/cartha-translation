base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/006.yaml
  text: and in the cities of Manasseh and Ephraim and Simeon[a], even as far as Naphtali[b], in their surrounding ruins.
translation:
  language: ta
  text: மனாசே, எப்பிராயீம், சிமியோன் ஆகிய பகுதிகளின் நகரங்களிலும், நப்தலிவரையிலும், அவற்றைச் சுற்றியுள்ள பாழிடங்களிலும்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தின் இறுதிச் சொற்றொடரின் தொடர்பு சற்றுக் கடினமானது. சொல்லுக்குச் சொல், ‘அவற்றின் பாழிடங்களில், சுற்றிலும்’ எனலாம். இங்கு ‘அவற்றைச் சுற்றியுள்ள பாழிடங்களிலும்’ என்பது அதன் இயல்பான பொருளைத் தெரிவிக்கிறது.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְ/עָרֵי
  choice: நகரங்களிலும்
  rationale: இணைப்பையும் இடப்பொருளையும் தமிழ் வேற்றுமை உருபான ‘-இலும்’ இயல்பாக வெளிப்படுத்துகிறது; עָרֵי என்பதற்கு வரலாற்று உரைநடையில் ‘நகரங்கள்’ பொருத்தமானது.
- source_word: מְנַשֶּׁה וְ/אֶפְרַיִם וְ/שִׁמְעוֹן
  choice: மனாசே, எப்பிராயீம், சிமியோன் ஆகியோரின்
  rationale: கோத்திர/நிலப்பகுதிப் பெயர்கள் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டுள்ளன; ‘ஆகியோரின்’ என்பது இப்பெயர்களுக்குரிய நகரங்கள் என்ற தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְ/עַד נַפְתָּלִי
  choice: நப்தலிவரையிலும்
  rationale: עַד குறிக்கும் எல்லை அல்லது பரப்பை ‘வரையிலும்’ இயல்பாகவும் வலியுறுத்தலுடனும் தெரிவிக்கிறது.
- source_word: ב/הר בתי/הם סָבִיב
  choice: அவற்றைச் சுற்றியிருந்த பாழிடங்களிலும்
  rationale: மசோரா மெய்யெழுத்துத் தொடரின் பிரிப்பும் வாசிப்பும் கடினமானவை. சூழலும் பொதுவாக ஏற்கப்படும் வாசிப்பும் பாழடைந்த இடங்களைக் குறிக்கின்றன; סָבִיב என்பதன் சுற்றுப்புறப் பொருளும் இதில் காக்கப்படுகிறது.
theological_decisions: []
translation_notes:
  register: நவீன செந்தமிழ் உரைநடை பயன்படுத்தப்பட்டுள்ளது. இது முந்தைய வசனத்தின் செயலைத் தொடரும் இடப்பெயர்ப் பட்டியல் என்பதால் இறுதியில் நீண்ட கோடு இடப்பட்டுள்ளது; மூலத்தின் துண்டுவாக்கியத் தன்மை பாதுகாக்கப்படுகிறது. கடினமான இறுதித் தொடரை உரையில் இயல்பாகக் கொடுத்து, மாற்று வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
