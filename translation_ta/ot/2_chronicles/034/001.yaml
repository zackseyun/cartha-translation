source:
  edition: WLC
  text: בֶּן שְׁמוֹנֶ֥ה שָׁנִ֖ים יֹאשִׁיָּ֣הוּ בְ/מָלְכ֑/וֹ וּ/שְׁלֹשִׁ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/001.yaml
  text: Josiah was eight years old when he became king, and he reigned thirty-one years in Jerusalem.
translation:
  language: ta
  text: யோசியா அரசனானபோது அவருக்கு எட்டு வயது. அவர் எருசலேமில் முப்பத்தொன்று ஆண்டுகள் ஆட்சி செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: அவருக்கு எட்டு வயது
  rationale: ‘எட்டு ஆண்டுகளின் மகன்’ என்ற எபிரெய வயதுக் குறிப்பை, அதன் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יֹאשִׁיָּהוּ
  choice: யோசியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: בְמָלְכוֹ
  choice: அரசனானபோது
  rationale: இக்கட்டமைப்பு ஆட்சியேற்ற காலத்தைக் குறிக்கிறது; ‘அரசனானபோது’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: முப்பத்தொன்று ஆண்டுகள்
  rationale: ஆட்சிக்காலத்தின் மொத்த நீளத்தைத் தமிழின் இயல்பான எண் வரிசையில் தெரிவிக்கிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தார்
  rationale: அரசராக ஆட்சி புரிவதைக் குறிக்கும் எபிரெய வினையின் நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டைத் தமிழ் வேற்றுமை உருபுடன் இயல்பாக மொழிபெயர்க்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தமிழில் இயல்பான மரியாதை ஒருமைக்காக ‘அவருக்கு’, ‘அவர்’ ஆகிய வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
