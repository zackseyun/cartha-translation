source:
  edition: WLC
  text: וְ/עַצְמוֹת֙ כֹּֽהֲנִ֔ים שָׂרַ֖ף עַל מזבחותים וַ/יְטַהֵ֥ר אֶת יְהוּדָ֖ה וְ/אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/005.yaml
  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
translation:
  language: ta
  text: அவன் ஆசாரியர்களின் எலும்புகளை அவர்களுடைய பலிபீடங்களின்மேல் எரித்து[a], யூதாவையும் எருசலேமையும் தூய்மைப்படுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தப் பலிபீடங்களின்மேல்.’ இங்குள்ள எபிரெய வடிவம் வழக்கத்திற்கு மாறானது; யோசியா அந்த ஆசாரியர்களோடு தொடர்புடைய பலிபீடங்களின்மேல் அவர்களுடைய எலும்புகளை எரித்தான் என்பதே கருத்து.
    reason: textual_variant
lexical_decisions:
- source_word: וְעַצְמוֹת כֹּהֲנִים
  choice: ஆசாரியர்களின் எலும்புகளை
  rationale: עַצְמוֹת என்பது עֶצֶם என்பதன் பன்மை இணைப்பு வடிவம்; இங்கு அது உண்மையான எலும்புகளைக் குறிக்கிறது. כֹּהֲנִים என்பதைச் சூழல் விக்கிரக வழிபாட்டுடன் தொடர்புடைய ஆசாரியர்களைக் குறிப்பதாகக் காட்டினாலும், மூல உரை வெறுமனே ‘ஆசாரியர்கள்’ என்றே கூறுவதால் கூடுதல் விளக்கம் சேர்க்கப்படவில்லை.
- source_word: שָׂרַף עַל
  choice: மேல் எரித்து
  rationale: שָׂרַף என்பது ‘எரித்தான்’ என்றும் עַל என்பது ‘மேல்’ என்றும் இயல்பாகப் பொருள்படும். அடுத்த வினையுடன் தமிழில் சரளமாக இணைய ‘எரித்து’ எனத் தரப்பட்டுள்ளது.
- source_word: מזבחותים
  choice: அவர்களுடைய பலிபீடங்களின்மேல்
  rationale: இந்த எபிரெய வடிவம் வழக்கத்திற்கு மாறானது. சூழலில் ஆசாரியர்களோடு தொடர்புடைய பலிபீடங்கள் என்ற உடைமைப் பொருள் சாத்தியமானதால் ‘அவர்களுடைய’ எனத் தரப்பட்டுள்ளது; ‘அந்தப் பலிபீடங்கள்’ என்ற வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיְטַהֵר
  choice: தூய்மைப்படுத்தினான்
  rationale: טהר என்ற வினையின் தீவிரச் செயல்வடிவம் இங்கு சட்டவிரோத வழிபாட்டினால் ஏற்பட்ட தீட்டினை அகற்றுவதைக் குறிக்கிறது. ‘தூய்மைப்படுத்தினான்’ என்பது சடங்கு மற்றும் ஒழுக்கம் சார்ந்த இரு பரிமாணங்களையும் மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: אֶת יְהוּדָה וְאֶת יְרוּשָׁלִָם
  choice: யூதாவையும் எருசலேமையும்
  rationale: இவை வினையின் நேரடிச் செயப்படுபொருள்களாக உள்ள இடப்பெயர்கள். நவீனத் தமிழில் பரவலாக அறியப்படும் ‘யூதா’, ‘எருசலேம்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன.
theological_decisions:
- issue: தூய்மைப்படுத்துதலின் தன்மை
  choice: விக்கிரக வழிபாட்டினால் ஏற்பட்ட சமய-ஒழுக்கத் தீட்டிலிருந்து நாட்டையும் நகரத்தையும் தூய்மைப்படுத்துதல்
  alternative: வெறும் சடங்குத் தூய்மை அல்லது பொருட்களை அழித்துச் சுத்தம் செய்தல் மட்டும்
  rationale: சீர்திருத்தச் சூழலில் טהר என்பது தவறான வழிபாட்டுடன் தொடர்புடைய தீட்டை அகற்றுவதைக் குறிக்கிறது. ‘தூய்மைப்படுத்தினான்’ என்பது பிற்கால இறையியல் கருத்தொன்றைத் திணிக்காமல் இந்தப் பொருள் பரப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியர்கள்’, ‘பலிபீடங்கள்’, ‘தூய்மைப்படுத்தினான்’ ஆகிய சொற்கள் மூலத்தின் சமயச் சூழலைத் தக்கவைக்கின்றன; மூலத்தில் இல்லாத ‘விக்கிரக வழிபாட்டு ஆசாரியர்கள்’ போன்ற விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
