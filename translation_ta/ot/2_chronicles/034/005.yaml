  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் துல்லியமாகத் தரப்பட்டுள்ளன: ஆசாரியர்களின் எலும்புகள், அவற்றை/அவர்களோடு தொடர்புடைய பலிபீடங்களின்மேல் எரித்தல், யூதாவையும் எருசலேமையும் தூய்மைப்படுத்தல். தொடக்க இணைப்புச் சொல்லைத் தமிழில் வினையெச்சத் தொடராக (‘எரித்து’) இயல்பாகக் கொண்டுவந்திருப்பது பொருளை மாற்றவில்லை.'
  naturalness: ‘அவன் ஆசாரியர்களின் எலும்புகளை அவர்களுடைய பலிபீடங்களின்மேல் எரித்து, யூதாவையும் எருசலேமையும் தூய்மைப்படுத்தினான்’ என்பது நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமான வேதாகம நடையிலும் உள்ளது.
