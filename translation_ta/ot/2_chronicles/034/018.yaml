base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
translation:
  language: ta
  text: பின்பு எழுத்தராகிய சாப்பான் அரசனிடம், “ஆசாரியனாகிய இல்க்கியா என்னிடம் ஒரு புத்தகத்தை[a] கொடுத்திருக்கிறார்” என்று தெரிவித்தான். சாப்பான் அதிலிருந்து அரசனுக்கு முன்பாக வாசித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு சுருளை.” இதற்கான எபிரெயச் சொல் எழுதப்பட்ட ஆவணம் அல்லது புத்தகம் எனப் பொதுவாகக் குறிக்கலாம்; அக்காலத்தில் அது பெரும்பாலும் சுருள் வடிவில் இருந்தது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: தெரிவித்தான்
  rationale: נגד என்பதன் ஹிப்இல் வடிவம் இங்கு ‘தெரிவித்தல்/அறிவித்தல்’ என்று பொருள்படுகிறது. அரச அலுவல் சூழலுக்கு ஏற்றதாகவும், மிகையான முறையான தொனியின்றியும் ‘தெரிவித்தான்’ இயல்பாக உள்ளது.
- source_word: הַסּוֹפֵר
  choice: எழுத்தராகிய
  rationale: סֹפֵר என்பது எழுத்தர் அல்லது அரசச் செயலர் போன்ற அலுவலரைக் குறிக்கலாம். வரலாற்றுச் சொல்லமைப்பையும் பணியையும் காக்க ‘எழுத்தர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: סֵפֶר
  choice: ஒரு புத்தகத்தை
  rationale: סֵפֶר என்பது எழுதப்பட்ட ஆவணம் அல்லது புத்தகம் எனப் பொதுவாகக் குறிக்கும். அதன் உடல் வடிவம் சுருளாக இருந்திருக்கலாம் என்றாலும், எபிரெயச் சொல் அதைக் கட்டாயப்படுத்தாததால் பொதுவான ‘புத்தகம்’ பயன்படுத்தப்பட்டது.
- source_word: נָתַן לִי
  choice: என்னிடம் ... கொடுத்திருக்கிறார்
  rationale: முடிந்த செயல் தற்போது தொடர்புடையதாக—புத்தகம் சாப்பானிடம் இருப்பதாக—அமைவதைத் தமிழின் ‘கொடுத்திருக்கிறார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: ஆசாரியனாகிய இல்க்கியா
  rationale: தனிப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டு, பதவி ‘ஆசாரியன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּקְרָא בוֹ
  choice: அதிலிருந்து ... வாசித்தான்
  rationale: בּוֹ என்ற முன்னிடைச்சொல்லை வெளிப்படுத்தவும், எழுதப்பட்ட நூலிலிருந்து உரக்க வாசித்த செயலை இயல்பான தமிழில் கூறவும் ‘அதிலிருந்து வாசித்தான்’ பயன்படுத்தப்பட்டது.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: அரசனுக்கு முன்பாக
  rationale: அரசனின் முன்னிலையில் வாசித்ததைச் சுருக்கமாகவும் மூலத்துக்கு நெருக்கமாகவும் தெரிவிக்கிறது.
