base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
translation:
  language: ta
  text: பின்பு அவர்கள் தலைமைக் குருவான இல்க்கியாவிடம் வந்து, தேவனுடைய ஆலயத்துக்குள் கொண்டுவரப்பட்டிருந்த பணத்தை அவரிடம் கொடுத்தார்கள். அந்தப் பணத்தை வாசற்படிக் காவலர்களான லேவியர்கள் மனாசே, எப்பிராயீம் பகுதிகளிலிருந்தும், இஸ்ரவேலின் எஞ்சியோரிடமிருந்தும், யூதா, பென்யமீன் முழுவதிலிருந்தும், எருசலேமின் குடியிருப்பாளர்களிடமிருந்தும் திரட்டியிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வாயிற்காவலர்கள்’ அல்லது ‘கதவுக்காவலர்கள்’; நேர்ச்சொல்லாக, ‘வாசற்படியைக் காப்பவர்கள்.’
    reason: שֹׁמְרֵי הַסַּף என்பதன் நேர்ச்சொல் உருவகத்தையும் வழக்கமான செயல்சார்ந்த மொழிபெயர்ப்புகளையும் பதிவு செய்யும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: பின்பு அவர்கள் ... வந்து
  rationale: தொடர்ச்சியான கதைநகர்வைக் குறிக்கும் wayyiqtol வடிவத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: חִלְקִיָּהוּ
  choice: இல்க்கியா
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை பிரதிபலிக்கும் பெயரெழுத்தாக்கம்.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: தலைமைக் குரு
  rationale: முதன்மைப் குருத்துவப் பதவியைக் குறிக்கும் நிலைபெற்ற, தெளிவான தமிழாக்கம்; சொற்சொல்லான ‘பெரிய குரு’ என்பதைக் காட்டிலும் சூழலுக்குப் பொருத்தமானது.
- source_word: וַיִּתְּנוּ
  choice: கொடுத்தார்கள்
  rationale: நிதியை ஒப்படைத்த செயலை எளிமையாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: הַכֶּסֶף
  choice: பணம்
  rationale: சொல்லடிப்படையில் ‘வெள்ளி’ என்றாலும், ஆலய நிதி திரட்டப்பட்ட இச்சூழலில் பரிமாற்ற மதிப்புடைய பணத்தையே குறிக்கிறது.
- source_word: הַמּוּבָא
  choice: கொண்டுவரப்பட்டிருந்த
  rationale: முன்னரே ஆலயத்திற்குக் கொண்டுவரப்பட்டிருந்ததைப் passive participle மற்றும் நிகழ்வுகளின் வரிசைக்கு ஏற்ப காட்டுகிறது.
- source_word: בֵית אֱלֹהִים
  choice: தேவனுடைய ஆலயம்
  rationale: ‘தேவனுடைய வீடு’ என்ற மூல உருவகத்தின் சூழல்சார்ந்த பொருளை நவீனத் தமிழில் தெளிவாக அளிக்கிறது.
- source_word: אָסְפוּ
  choice: திரட்டியிருந்தார்கள்
  rationale: பணத்தைச் சேகரித்த செயல் அதை இல்க்கியாவிடம் கொடுப்பதற்கு முன்பே நடந்ததைத் தெளிவாக்குகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தாரும் ஆலயப் பணியாளர்களுமான குழுவுக்கான வழக்கமான தமிழ்ப் பெயர்.
- source_word: שֹׁמְרֵי הַסַּף
  choice: வாசற்படிக் காவலர்கள்
  rationale: ‘வாசற்படியைக் காப்பவர்கள்’ என்ற எபிரெய உருவகத்தையும் அவர்களின் ஆலயப் பணியையும் சுருக்கமாகப் பாதுகாக்கிறது; செயல்சார்ந்த மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: מִיַּד
  choice: இலிருந்து / இடமிருந்து
  rationale: சொற்சொல்லான ‘கையிலிருந்து’ என்பது இங்கு மூலத்தையோ உடைமையையோ குறிக்கும் மரபுத்தொடர்; இயல்பான தமிழில் பின்னொட்டுகளால் தரப்பட்டுள்ளது.
- source_word: מְנַשֶּׁה וְאֶפְרַיִם
  choice: மனாசே, எப்பிராயீம் ஆகியவை
  rationale: இங்கு நிதி வந்த கோத்திரப் பகுதிகளைக் குறிக்கும் தனிப்பெயர்களாகப் புரிந்துகொண்டு, ‘ஆகியவற்றிலிருந்து’ என்ற பகுதி சார்ந்த தொடருடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: எருசலேம் குடியிருப்பாளர்கள்
  rationale: எருசலேமில் வசித்த மக்களைக் குறிக்கும் மூலத்தின் பொருளை நேரடியாகத் தருகிறது.
theological_decisions:
- issue: שְׁאֵרִית (‘எஞ்சியோர்’) என்பதிலுள்ள சாத்தியமான உடன்படிக்கை சார்ந்த நுண்பொருள்
  choice: இஸ்ரவேலில் எஞ்சியிருந்த அனைவரும்
  alternative: இஸ்ரவேலின் மீதியானோர்
  rationale: வடக்கு இஸ்ரவேல் மக்களில் எஞ்சியிருந்தவர்களைக் குறிக்கும் வரலாற்றுப் பொருளை இயல்பான தமிழில் காட்டுகிறது; அதேவேளையில் ‘எஞ்சியிருந்த’ என்ற சொல் மூலத்தில் இருக்கக்கூடிய இறையியல் ஒலிப்பையும் முற்றிலும் நீக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம வரலாற்றுரைக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது; இரண்டாம் வாக்கியத்தில் ‘அந்தப் பணத்தை’ என்று மீளச்சுட்டி தொடர்பு பேணப்பட்டது.
