base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
translation:
  language: ta
  text: பின்பு அரசனும், யூதாவைச் சேர்ந்த ஒவ்வொரு ஆணும்[b], எருசலேமின் குடியிருப்பவர்களும், ஆசாரியர்களும், லேவியர்களும், பெரியோர் முதல் சிறியோர் வரையிலான மக்கள் அனைவரும் யாவேயின்[a] ஆலயத்துக்கு ஏறிச் சென்றார்கள். யாவேயின் ஆலயத்தில் கண்டெடுக்கப்பட்ட உடன்படிக்கைப் புத்தகத்தின் வார்த்தைகள் அனைத்தையும் அவர்கள் கேட்கும்படி அரசன் வாசித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவே’ என்பது எபிரெய மொழியிலுள்ள YHWH என்ற இறைத் திருப்பெயரின் ஒலிபெயர்ப்பு.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யூதாவின் ஆண்கள் அனைவரும்.’ எபிரெய மொழியில் ‘ஒவ்வொரு ஆணும்’ என்ற ஒருமை வடிவம் பகிர்வுப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ஏறிச் சென்றான்
  rationale: עלה என்பதிலுள்ள மேல்நோக்கிச் செல்லும் பொருளைத் தக்கவைக்கிறது; ஆலயம் இருந்த இடத்திற்குச் செல்வதையும் இயல்பாகக் குறிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படி ‘யாவேயின் வீடு’ என்றாலும், இச்சூழலில் ‘ஆலயம்’ என்பது நவீனத் தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כָל אִישׁ יְהוּדָה
  choice: யூதாவைச் சேர்ந்த ஒவ்வொரு ஆணும்
  rationale: אִישׁ என்ற ஆண்பால் ஒருமையைப் பகிர்வுப் பொருளில் உள்ளபடியே காட்டி, தமிழில் தெளிவாக வழங்குகிறது.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: எருசலேமில் குடியிருந்தவர்கள்
  rationale: ‘அங்கே வசிப்பவர்கள்’ என்ற பங்கேற்புவினைச் சொல்லின் கூட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயப் பணிச் சூழலில் כֹּהֲנִים என்பதற்கான பரவலாக அறியப்பட்ட தமிழ்ச் சொல்.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி குலத்தாரையும் ஆலயப் பணிக்குழுவையும் குறிக்கும் வழக்கமான பெயர்.
- source_word: כָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: கூடியிருந்த மக்களின் முழுமையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: מִגָּדוֹל וְעַד קָטָן
  choice: பெரியோர் முதல் சிறியோர் வரை
  rationale: சமூகத்தின் முழு வரம்பையும் குறிக்கும் எபிரெய மரபுத்தொடரின் உருவகத் திறந்த தன்மையைப் பாதுகாக்கிறது.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: அவர்கள் கேட்கும்படி அரசன் வாசித்தான்
  rationale: புத்தகத்தின் சொற்களைச் சபையோருக்கு உரக்க வாசித்த செயலைத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: כָל דִּבְרֵי סֵפֶר הַבְּרִית
  choice: உடன்படிக்கைப் புத்தகத்தின் வார்த்தைகள் அனைத்தையும்
  rationale: דִּבְרֵי என்பதன் ‘வார்த்தைகள்’ என்ற உரைமையையும், ஆவணத்தின் முழு உள்ளடக்கத்தையும் தக்கவைக்கிறது.
- source_word: הַנִּמְצָא בֵּית יְהוָה
  choice: யாவேயின் ஆலயத்தில் கண்டெடுக்கப்பட்ட
  rationale: நிறைவுற்ற கண்டுபிடிப்பைக் குறிக்கும் எபிரெயச் செயப்பாட்டு வடிவத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் YHWH என்ற தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: כָל אִישׁ יְהוּדָה என்பதிலுள்ள பாலினக் குறிப்பு
  choice: யூதாவைச் சேர்ந்த ஒவ்வொரு ஆணும்
  alternative: யூதாவைச் சேர்ந்த அனைவரும்
  rationale: மூலத்தின் אִישׁ என்ற ஆண்பால் சொல்லை மறைக்காமல் தக்கவைக்கிறது; பின்னர் வரும் ‘மக்கள் அனைவரும்’ என்ற விரிவான குறிப்பையும் தனியே பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டது. ‘ஆலயம்,’ ‘ஆசாரியர்கள்,’ ‘லேவியர்கள்,’ ‘உடன்படிக்கை’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டன.
