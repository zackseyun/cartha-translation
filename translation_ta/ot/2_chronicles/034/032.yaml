source:
  edition: WLC
  text: וַ/יַּעֲמֵ֕ד אֵ֛ת כָּל הַ/נִּמְצָ֥א בִ/ירוּשָׁלִַ֖ם וּ/בִנְיָמִ֑ן וַֽ/יַּעֲשׂוּ֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כִּ/בְרִ֥ית אֱלֹהִ֖ים אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/032.yaml
  text: Then he made everyone who was found in Jerusalem and Benjamin stand to it[a], and the inhabitants of Jerusalem acted according to the covenant of God[b], the God of their fathers.
translation:
  language: ta
  text: பின்பு அவர் எருசலேமிலும் பென்யமீனிலும் இருந்த அனைவரையும் அந்த உடன்படிக்கையில் நிலைத்து நிற்கச் செய்தார்[a]. எருசலேமில் குடியிருந்தவர்கள் கடவுளின், அதாவது தங்கள் முன்னோர்களின் கடவுளின், உடன்படிக்கையின்படி நடந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘அனைவரையும் நிற்கச் செய்தார்.’ அவர்கள் உடன்படிக்கையில் நிலைத்து நிற்கச் செய்யப்பட்டார்கள் என்பது இங்குள்ள சூழல் தரும் பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: நிலைத்து நிற்கச் செய்தார்
  rationale: עמד என்பதன் ஹிபீல் வடிவம் அடிப்படையில் ‘நிற்கச் செய்தார்’ எனப் பொருள்படும். உடன்படிக்கையைப் புதுப்பிக்கும் இச்சூழலில், வெறுமனே உடலளவில் நிறுத்துவதைவிட உடன்படிக்கையில் உறுதியாக நிலைக்கச் செய்தார் என்ற கருத்தை இயல்பான தமிழில் இது தெரிவிக்கிறது; ‘நிற்றல்’ என்ற மூல உருவகத்தையும் காக்கிறது.
- source_word: אֵת כָּל הַנִּמְצָא
  choice: இருந்த அனைவரையும்
  rationale: சொல்லுக்குச் சொல் ‘காணப்பட்ட அனைவரையும்’ என்று மொழிபெயர்ப்பது தமிழில் இயல்பற்றது. இங்கு குறிக்கப்படுவது அங்கே இருந்த மக்கள் அனைவரும் என்பதால் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: בִירוּשָׁלִַם וּבִנְיָמִן
  choice: எருசலேமிலும் பென்யமீனிலும்
  rationale: மூலத்தில் உள்ள இரு இடப்பெயர்களும் விளக்கச் சேர்க்கையின்றி நேரடியாக வைக்கப்பட்டுள்ளன. ‘பென்யமீன்’ அதன் கோத்திரப் பகுதியையோ மக்களையோ குறிக்கக்கூடும்; அந்தத் தெளிவின்மை பாதுகாக்கப்படுகிறது.
- source_word: וַיַּעֲשׂוּ
  choice: நடந்தார்கள்
  rationale: עשה என்பதுடன் உடன்படிக்கைக்கு முன் כ வருவது, உடன்படிக்கைக்கு ஏற்ப செயல்படுவதைக் குறிக்கிறது. ‘உடன்படிக்கையின்படி நடந்தார்கள்’ என்பது துல்லியமும் இயல்பும் வாய்ந்த தமிழ் நடை.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: எருசலேமில் குடியிருந்தவர்கள்
  rationale: அவ்விடத்தில் வசித்த மக்களைக் குறிக்கும் எளிய, தற்போதைய தமிழ் சொற்றொடர்.
- source_word: כִּבְרִית
  choice: உடன்படிக்கையின்படி
  rationale: முன்னொட்டு כ இங்கு ஒத்திசைவு அல்லது நெறிப்படி நடப்பதைக் குறிக்கிறது; ‘உடன்படிக்கையின்படி’ அந்த உறவைச் சுருக்கமாகத் தருகிறது.
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: தங்கள் முன்னோர்களின் கடவுளான கடவுள்
  rationale: மூலத்தின் அடுக்குச் சொல்லமைப்பையும் வலியுறுத்தலையும் காக்க ‘கடவுள்’ மீண்டும் வருகிறது. ‘தந்தையர்’ என்பதற்குப் பதில் தலைமுறை முன்னோர்களைக் குறிக்கும் இயல்பான ‘முன்னோர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: உடன்படிக்கைப் புதுப்பிப்பில் யோசியாவின் செயல்
  choice: அங்கிருந்தவர்களை உடன்படிக்கையில் உறுதியாக நிலைக்கச் செய்தார்
  alternative: அவர்களை உடலளவில் நிற்கச் செய்தார்; அல்லது உடன்படிக்கைக்குள் நுழையச் செய்தார்
  rationale: ஹிபீல் וַיַּעֲמֵד என்பதன் நிற்றல் உருவகம் காக்கப்படுகிறது. சூழல் உடன்படிக்கைப் பற்றுறுதியைச் சுட்டுவதால் அதையும் முதன்மை உரை வெளிப்படுத்துகிறது; ஆனால் மூலத்தில் ‘உடன்படிக்கையில்’ என்பது இவ்வினையுடன் வெளிப்படையாக இல்லை என்பதைக் குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘நிலைத்து நிற்க’ என்பது மூலத்தின் நிற்றல் உருவகத்தையும் உடன்படிக்கைப் பற்றுறுதியையும் இணைக்கிறது. ‘பென்யமீன்’ என்பதற்கு ‘பகுதி’ என்று சேர்க்காமல் மூலத்தின் சுருக்கமும் சாத்தியமான இட/மக்கள் இரட்டைப்பொருளும் பாதுகாக்கப்பட்டுள்ளன.
