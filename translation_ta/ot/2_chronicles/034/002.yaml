  source_fidelity: மூலத்தின் ஒழுக்க மதிப்பீடு, ‘வழிகளில் நட’ உருவகம், மற்றும் வலது/இடது விலகாமை ஆகியவை வரைவில் பெரும்பாலும் துல்லியமாக உள்ளன. ஆனால் אָבִיו (‘அவனுடைய தந்தை’) என்பதை முதன்மை உரையில் ‘முன்னோர்’ என மாற்றுவது மூலத்தின் நேரடியான சொல் தேர்வை அகற்றி விளக்கத்தை உரைக்குள் கொண்டுவருகிறது. அந்த வம்சார்த்த விளக்கம் அடிக்குறிப்பிலேயே இருக்க வேண்டும்.
  naturalness: ‘யாவேயின் பார்வையில் சரியானதைச் செய்தான்’ மற்றும் ‘வலப்பக்கமோ இடப்பக்கமோ விலகவில்லை’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘நேர்மையானதைச் செய்து’ என்பதற்குப் பதில் ‘சரியானதைச் செய்தான்’ அரசர்-மதிப்பீட்டு வழக்கிற்கு எளிமையாகவும் நேரடியாகவும் அமைகிறது.
