source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דַרְכֵי֙ דָּוִ֣יד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
translation:
  language: ta
  text: அவன் யாவேயின்[a] பார்வையில் சரியானதைச் செய்தான்; தன் தந்தையான[b] தாவீதின் வழிகளில் நடந்தான்; வலப்பக்கமோ இடப்பக்கமோ விலகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கர்த்தரின் பார்வையில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “தன் தந்தையான”; இங்கு “தந்தை” என்பது வம்ச முன்னோரைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: நேர்மையானதைச் செய்து
  rationale: עשה என்பதன் பொதுவான ‘செய்’ பொருளையும், பெயர்ச்சொல்லாகப் பயன்படும் הַיָּשָׁר என்பதன் ஒழுக்க மதிப்பீட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: ‘யாவேவின் கண்களில்’ என்ற எபிரெய உருவகத்தின் மதிப்பீட்டுப் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; தெய்வீகப் பெயரை ஒலிபெயர்க்கிறது.
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: வழிகளில் நடந்தான்
  rationale: הלך மற்றும் דרך இணையும் ஒழுக்க நடத்தை உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
- source_word: דָּוִיד אָבִיו
  choice: தன் முன்னோரான தாவீது
  rationale: אָב இங்கு நேரடியான தந்தையைக் குறிக்காமல் அரச வம்ச முன்னோரைக் குறிக்கிறது; தவறான புரிதலைத் தவிர்க்க இயல்பாகத் தெளிவாக்கப்பட்டுள்ளது.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: வலப்புறமோ இடப்புறமோ விலகவில்லை
  rationale: எந்தத் திசையிலும் நெறிதவறாதிருப்பதைக் குறிக்கும் நிலையான பாதை உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப்பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது; மரபான மாற்றை அடிக்குறிப்பு குறிப்பிடுகிறது.
- issue: דָּוִיד אָבִיו என்பதில் ‘தந்தை’ என்ற வம்சப் பயன்பாடு
  choice: தன் முன்னோரான தாவீது
  alternative: தன் தந்தையான தாவீது
  rationale: யோசியாவுக்கு தாவீது நேரடித் தந்தை அல்ல; எபிரெயத்தில் ‘தந்தை’ என்பது முன்னோரையும் குறிக்கக்கூடும். முதன்மை உரையில் உறவின் நோக்கத்தைத் தெளிவாக அளிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வேதாகமப் பாதை உருவகமும் காக்கப்பட்டுள்ளன. ‘நேர்மையானதை’ என்பது தெய்வீக மதிப்பீட்டின் ஒழுக்கப் பொருளைக் காட்டுகிறது; ‘வழிகளில் நடந்தான்’ மற்றும் ‘விலகவில்லை’ ஆகியவை மூல உருவகத் தொடர்ச்சியைப் பேணுகின்றன.
