  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன: யோசியா அருவருப்பானவற்றை அகற்றினான்; இஸ்ரவேலில் இருந்தவர்களை யாவேக்கு பணியச் செய்தான்; யோசியாவின் நாட்களெல்லாம் அவர்கள் யாவேயைப் பின்பற்றுவதை விட்டு விலகவில்லை. ‘நிலப்பகுதிகள்,’ ‘அருவருப்பானவை,’ ‘யாவே,’ ‘மூதாதையர்’ ஆகிய தெரிவுகள் சூழலுக்கு ஏற்றவை; பொருட்களா செயல்களா என்ற הַתּוֹעֵבוֹת-இன் பரப்பும் தேவையின்றிக் குறுக்கப்படவில்லை.'
  naturalness: முதல் வாக்கியத்தின் இரண்டாம் தொடரில் இலக்கணத் தெளிவின்மை உள்ளது. “இஸ்ரவேலில் இருந்த அனைவரும் ... பணியும்படி செய்தான்” என்பதில் “அனைவரும்” எழுவாயாக அமைவதால், யோசியா யாரைப் பணியச் செய்தான் என்பது தமிழில் முறையாக இணைவதில்லை. அதை “அனைவரையும்” எனக் கருமை வேற்றுமையில் மாற்ற வேண்டும். மற்ற வாக்கியங்கள் நவீனத் தரமான, கண்ணியமான தமிழில் இயல்பாக உள்ளன.
  terminology: ‘யாவே’ என்பது יהוה-க்கு நிலையான ஒலிபெயர்ப்பாக உள்ளது. ‘தங்கள் கடவுளாகிய யாவே,’ ‘பணியும்படி செய்தான்,’ ‘மூதாதையரின் கடவுள்’ ஆகியவை முறையே உடன்படிக்கைப் பெயர், காரணவினை வலிமை, மற்றும் தலைமுறை சார்ந்த வழக்குத் தொடரைச் சரியாகத் தருகின்றன.
