  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
translation:
  language: ta
  text: யோசியா, இஸ்ரவேல் மக்களுக்குரிய எல்லா நிலப்பகுதிகளிலிருந்தும் அருவருப்பானவை அனைத்தையும் அகற்றினான்.[a] இஸ்ரவேலில் இருந்த அனைவரையும்[b] தங்கள் கடவுளாகிய யாவேக்குப் பணியும்படி செய்தான். அவன் வாழ்நாளெல்லாம் அவர்கள் தங்கள் மூதாதையரின் கடவுளாகிய யாவேயைப் பின்பற்றுவதிலிருந்து விலகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “இஸ்ரவேலின் மகன்களுக்குரிய எல்லா நிலங்களிலிருந்தும்.” இது இஸ்ரவேல் மக்களுக்குச் சொந்தமான அல்லது அவர்களோடு தொடர்புடைய எல்லாப் பகுதிகளையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, “இஸ்ரவேலில் காணப்பட்ட அனைவரையும்.” இங்கு அதற்கு “இஸ்ரவேலில் இருந்த அனைவரையும்” என்று பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: அகற்றினான்
  rationale: הסיר என்பதன் காரணவினைப் பொருளான ‘நீக்குதல்/அகற்றுதல்’ என்பதை இயல்பான நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: הַתּוֹעֵבוֹת
  choice: அருவருப்பானவை
  rationale: உடன்படிக்கைக்கும் வழிபாட்டுக்கும் முரணான வெறுக்கத்தக்க பொருட்கள் அல்லது செயல்கள் ஆகிய இரண்டையும் உள்ளடக்கக்கூடியதாக மூலத்தின் பரந்த பொருளை வைத்திருக்கிறது.
- source_word: מִכָּל הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்குரிய எல்லா நிலப்பகுதிகளிலிருந்தும்
  rationale: אֲרָצוֹת என்ற பன்மையையும் לְ குறிக்கும் உரிமை/தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; בְּנֵי יִשְׂרָאֵל என்பதன் சொற்படியான குடும்ப மொழி அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּעֲבֵד
  choice: பணியும்படி செய்தான்
  rationale: עבד என்பதன் ஹிஃபில் காரணவினை வடிவைத் தக்கவைக்கிறது; யோசியாவின் செயற்பாட்டை மென்மைப்படுத்தாமல், வெளிப்படையான உடல் வற்புறுத்தலைச் சேர்க்காமலும் உள்ளது.
- source_word: כָּל הַנִּמְצָא בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில் இருந்த அனைவரும்
  rationale: நிஃபால் வினையெச்சத்தின் சூழல்சார் பொருள் ‘அங்கே இருந்தவர்கள்’ என்பதாகும். ‘காணப்பட்டவர்கள்’ என்ற சொற்படியான தமிழ் தேவையற்ற தேடிக் கண்டுபிடித்தல் என்ற நிழற்பொருளை ஏற்படுத்தலாம்; அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לַעֲבוֹד אֶת יְהוָה אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய யாவேக்குப் பணியும்படி
  rationale: עבד என்பதன் சேவை மற்றும் வழிபாடு ஆகிய இரு பரிமாணங்களையும் ‘பணிதல்’ இயல்பாகத் தாங்குகிறது; தெய்வீகப் பெயர் பெயராகவே ஒலிபெயர்க்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டமாக மாற்றாமல், பொதுவாக ஏற்கப்படும் ‘Yahweh’ உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כָּל יָמָיו
  choice: அவன் வாழ்நாளெல்லாம்
  rationale: சொற்படியான ‘அவனுடைய நாட்களெல்லாம்’ என்பதன் காலநீட்சி பொருளை இயல்பான தமிழில் தருகிறது; இங்குள்ள ஒருமை ஆண்பால் சுட்டுப்பெயர் யோசியாவைக் குறிக்கிறது.
- source_word: לֹא סָרוּ מֵאַחֲרֵי יְהוָה
  choice: யாவேயைப் பின்பற்றுவதிலிருந்து விலகவில்லை
  rationale: סור מן־אחרי என்ற தொடரின் ‘ஒருவரைப் பின்பற்றுவதிலிருந்து திரும்பிவிடுதல்’ என்ற உருவகத்தையும் உடன்படிக்கை விசுவாசத்தின் கருத்தையும் பாதுகாக்கிறது.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: தங்கள் மூதாதையரின் கடவுள்
  rationale: אָבוֹת என்பதன் தலைமுறைத் தொடர்பை நவீன தமிழில் இயல்பாகக் கூறுகிறது; இச்சூழலில் ‘தந்தையர்’ என்பது உடனடி உயிரியல் தந்தையரை மட்டும் குறிக்கும் தவறான எண்ணத்தைத் தரலாம்.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை எவ்வாறு வழங்குவது
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் பெயராக ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைத் தக்கவைக்கிறது.
- issue: וַיַּעֲבֵד என்ற காரணவினையின் வலிமை
  choice: பணியும்படி செய்தான்
  alternative: பணியுமாறு வழிநடத்தினான்
  rationale: மூலத்தின் காரணவினை யோசியா வெறுமனே ஊக்குவித்ததைவிடச் செயற்படச் செய்தான் என்பதைக் காட்டுகிறது. ‘செய்தான்’ அந்த வலிமையைப் பாதுகாக்கிறது; ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத உடல் வற்புறுத்தலைச் சேர்ப்பதில்லை.
- issue: בני ישראל மற்றும் אבותיהם ஆகிய குடும்பச் சொற்கள்
  choice: இஸ்ரவேல் மக்கள் / மூதாதையர்
  alternative: இஸ்ரவேலின் மகன்கள் / அவர்களுடைய தந்தையர்
  rationale: இவை இங்கு இன-உடன்படிக்கைச் சமூகத்தையும் முந்தைய தலைமுறைகளையும் குறிக்கும் நிலையான எபிரெயத் தொடர்கள். இயல்பான தமிழ் பொருளைத் தெளிவாக்குகிறது; בני ישראל என்பதன் சொற்படியான வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வாக்கிய அமைப்பு எளிதாக வாசிக்கும்படி பிரிக்கப்பட்டாலும், யோசியாவின் காரணவினைச் செயல், மக்களின் தொடர்ந்த கீழ்ப்படிதல், மற்றும் தெய்வீகப் பெயர் ஆகியவை மூலத்துக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன. ‘அருவருப்பானவை’ என்பது விக்கிரகப் பொருட்களா செயல்களா என்பதைத் தேவையின்றி முடிவுசெய்யாமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
