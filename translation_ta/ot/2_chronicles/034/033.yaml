  revised_text: யோசியா, இஸ்ரவேல் மக்களுக்குரிய எல்லா நிலப்பகுதிகளிலிருந்தும் அருவருப்பானவை அனைத்தையும் அகற்றினான்.[a] இஸ்ரவேலில் இருந்த அனைவரையும்[b] தங்கள் கடவுளாகிய யாவேக்குப் பணியும்படி செய்தான். அவன் வாழ்நாளெல்லாம் அவர்கள் தங்கள் மூதாதையரின் கடவுளாகிய யாவேயைப் பின்பற்றுவதிலிருந்து விலகவில்லை.
