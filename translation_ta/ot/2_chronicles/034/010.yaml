source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
translation:
  language: ta
  text: அவர்கள் அந்தப் பணத்தை யாவேயின் ஆலயத்தில் பொறுப்பாக நியமிக்கப்பட்டிருந்த பணியாளர்களின் கையில் ஒப்படைத்தார்கள். அந்தப் பணியாளர்கள், யாவேயின் ஆலயத்தில் வேலை செய்துகொண்டிருந்த பணியாளர்களுக்கு, ஆலயத்தைப் பழுதுபார்த்து வலுப்படுத்துவதற்காக அதைக் கொடுத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “யாவேயின் வீட்டைப் பழுதுபார்த்து வலுப்படுத்துவதற்காக.” “யாவேயின் வீடு” என்பது இங்கு ஆலயத்தைக் குறிக்கிறது; ‘பழுதுபார்த்து வலுப்படுத்துவதற்காக’ என்பதை ‘மீட்டமைத்து உறுதிப்படுத்துவதற்காக’ என்றும் மொழிபெயர்க்கலாம்.'
    reason: ‘வீடு’ என்ற எபிரெயச் சொல்லாட்சியையும், பழுதுபார்த்தல் மற்றும் வலுப்படுத்தல் என்பவற்றுக்கான பொருத்தமான மாற்று மொழிபெயர்ப்பையும் காட்டுகிறது.
lexical_decisions:
- source_word: וַיִּתְּנוּ ... עַל יַד
  choice: ஒப்படைத்தார்கள்
  rationale: נתן என்பதுடன் வரும் עַל יַד என்ற மரபுத்தொடர், ஒருவருடைய பொறுப்பில் ஒப்படைப்பதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் இதைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: பணியாளர்கள்
  rationale: கட்டடப் பணியைச் செய்பவர்களைக் கூட்டாகக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பான, பாலினப் பொதுமை கொண்ட தமிழ்ச் சொல்.
- source_word: הַמֻּפְקָדִים בְּבֵית יְהוָה
  choice: யாவேயின் ஆலயத்துக்குப் பொறுப்பாக நியமிக்கப்பட்டிருந்த
  rationale: פקד என்ற வினையின் செயப்பாட்டு வடிவத்திலுள்ள நியமிப்பும் மேற்பார்வைப் பொறுப்பும் இரண்டையும் வெளிப்படுத்துகிறது. בְּ இங்கு பொறுப்பின் தளத்தைக் குறிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லுக்குச் சொல் 'யாவேயின் வீடு' என்றாலும், இச்சூழலில் அது ஆலயத்தையே குறிக்கிறது; தமிழில் 'ஆலயம்' தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֹתוֹ
  choice: அதை
  rationale: முந்தைய சூழலில் சேகரிக்கப்பட்ட பணத்தைக் குறிக்கும் ஆண்பால் ஒருமைப் பெயர்ச்சுட்டைத் தொடர்கிறது; வசனத்தில் இல்லாத பெயர்ச்சொல்லை இரண்டாம் குறிப்பில் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: עוֹשֵׂי הַמְּלָאכָה אֲשֶׁר עֹשִׂים
  choice: வேலை செய்துகொண்டிருந்த பணியாளர்கள்
  rationale: עשה என்பதன் மீளுரைப்பையும் தொடர்ந்து நடைபெறும் செயலின் பொருளையும் இயல்பான தமிழில் ஓரளவு தக்கவைக்கிறது.
- source_word: לִבְדּוֹק
  choice: பழுதுபார்த்து
  rationale: בדק சில இடங்களில் 'ஆராய்தல்' எனப் பொருள்பட்டாலும், ஆலயப் புதுப்பிப்புச் சூழலில் கட்டடக் குறைகளைச் சீரமைத்தல் என்ற நிறுவப்பட்ட பொருள் பொருந்துகிறது.
- source_word: וּלְחַזֵּק
  choice: வலுப்படுத்துவதற்காக
  rationale: கட்டடத்தை உறுதியாக்குதல் அல்லது பலப்படுத்துதல் என்ற חזק என்பதன் காரணவினைப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַבָּיִת
  choice: ஆலயம்
  rationale: இங்கு முன்பு குறிப்பிடப்பட்ட யாவேயின் ஆலயத்தையே குறிக்கிறது; தமிழில் குறிப்பு தெளிவாக இருக்கப் பெயரை மீண்டும் பயன்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் உள்ளது. அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: בֵּית יְהוָה என்பதிலுள்ள 'வீடு' உருவகத்தை வழங்குதல்
  choice: யாவேயின் ஆலயம்
  alternative: யாவேயின் வீடு
  rationale: இங்கு குறிக்கப்படுவது எருசலேம் ஆலயம் என்பது சூழலில் தெளிவு. 'ஆலயம்' நவீனத் தமிழ் வாசகருக்கு உடனடியாகப் புரியும்; அடிக்குறிப்பில் சொல்லுக்குச் சொல் வடிவம் தரப்படுகிறது.
- issue: וַיִּתְּנוּ אֹתוֹ என்பதன் இரண்டாம் பயன்பாடு
  choice: அதைச் செலவிட்டார்கள்
  alternative: அதைக் கொடுத்தார்கள்
  rationale: கட்டடப் பழுதுபார்ப்புக்காக நிதியைப் பயன்படுத்த ஒப்படைத்தனர் என்பதே சூழல்சார் பொருள். எனினும் எபிரெயில் அதே נתן வினை மீண்டும் வருவதால், நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது. 'பணியாளர்கள்' பாலினப் பொதுமை கொண்ட சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; தெய்வீகப் பெயர் 'யாவே' என ஒலிபெயர்க்கப்பட்டது.
