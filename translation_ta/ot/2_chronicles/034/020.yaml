translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. எபிரெயப் பட்டியலை தமிழின் இயல்பான ‘ஆகியோருக்கு’ அமைப்பில் வழங்கி, அடுத்த வசனத்துக்குச் செல்லும் கட்டளை அறிமுகத்தை முக்காற்புள்ளியால் குறிக்கிறது. உரைவேறுபாட்டு [a] குறி தொடர்புடைய ‘அப்தோன்’ பெயருக்குப் பின்னும், சொல்லியல் மாற்றான [b] குறி அசாயாவின் பதவிவிளக்கத்துக்குப் பின்னும் வைக்கப்பட்டுள்ளன.
