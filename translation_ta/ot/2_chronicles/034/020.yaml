  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֡הוּ וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַבְדּ֨וֹן בֶּן מִיכָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סּוֹפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
translation:
  language: ta
  text: 'பின்பு அரசன் இல்க்கியா, சாப்பானின் மகன் அகிக்காம், மீகாவின் மகன் அப்தோன்[a], எழுத்தரான சாப்பான், அரசனின் பணியாளரான அசாயா[b] ஆகியோருக்கு இவ்வாறு கட்டளையிட்டான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மசோரா உரையில், “மீகாவின் மகன் அப்தோன்” என்று உள்ளது. இதற்கு இணையான 2 இராஜாக்கள் 22:12-ல், “மிகாயாவின் மகன் அக்போர்” என்று உள்ளது.
    reason: textual_variant
  - marker: b
    text: அல்லது, “அரசனின் அதிகாரியான அசாயா.” எபிரெய உரையில் சொல்லுக்குச் சொல், “அரசனின் பணியாளர்” என்று உள்ளது; இது அரசவை அதிகாரியைக் குறிக்கவும் கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: கட்டளையிட்டான்
  rationale: צוה என்ற வினை அரச அதிகாரத்துடன் இடப்பட்ட நேரடியான ஆணையைக் குறிக்கிறது; ‘கட்டளையிட்டான்’ அதன் வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் யோசியாவைக் குறிக்கும் திட்டவட்டமான பெயர்ச்சொல்; தமிழில் இயல்பாக ‘அரசன்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: חִלְקִיָּהוּ
  choice: இல்க்கியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நெருக்கமாகப் பெயர்த்தெழுதுகிறது.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: சாப்பானின் மகன் அகிக்காம்
  rationale: בן குறிக்கும் தந்தை–மகன் அடையாளத்தைத் தமிழின் இயல்பான பெயர் வரிசையில் தெளிவாகத் தருகிறது.
- source_word: עַבְדּוֹן בֶּן מִיכָה
  choice: மீகாவின் மகன் அப்தோன்
  rationale: நாளாகமத்தின் மசோரா உரையிலுள்ள தனிப்பெயரையும் தந்தைவழி அடையாளத்தையும் பின்பற்றுகிறது.
- source_word: שָׁפָן הַסּוֹפֵר
  choice: எழுத்தரான சாப்பான்
  rationale: סֹפֵר என்பது எழுத்தர் அல்லது அரசுச் செயலர் எனப் பொருள்படலாம்; ‘எழுத்தர்’ மூலச்சொல்லின் நேரடித் தன்மையைப் பாதுகாக்கிறது.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: அரசனின் பணியாளரான அசாயா
  rationale: עֶבֶד என்பதன் அடிப்படைப் பொருளான அரசனுக்குப் பணிபுரிபவர் என்பதைத் தருகிறது; அரசவைக் சூழலில் இது ஓர் அதிகாரியையும் குறிக்கலாம்.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு கட்டளையிட்டான்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயக் கூறுமுறையை தமிழில் இயல்பாகச் சுட்டுகிறது; முக்காற்புள்ளி உரை தொடர்வதைக் காட்டுகிறது.
