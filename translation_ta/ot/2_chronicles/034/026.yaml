source:
  edition: WLC
  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְר֣וֹשׁ בַּֽ/יהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
translation:
  language: ta
  text: 'ஆனால், யாவேயிடம் விசாரிப்பதற்காக[a] உங்களை அனுப்பிய யூதாவின் அரசனிடம் நீங்கள் இவ்வாறு சொல்லுங்கள்: “இஸ்ரயேலின் கடவுளாகிய யாவே இவ்வாறு கூறுகிறார்: நீ கேட்ட வார்த்தைகளைப் பொறுத்தவரை—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயைத் தேடுவதற்காக” அல்லது “யாவேயிடம் ஆலோசனை கேட்பதற்காக.” இங்குள்ள எபிரேய வினைச்சொல், தேடுதல் என்றும் தீர்க்கதரிசனச் சூழலில் விசாரித்தல் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל
  choice: ஆனால், … அரசனிடம்
  rationale: וְ இங்கு முந்தைய உரையிலிருந்து அரசனுக்கான தனிப்பட்ட செய்திக்குத் திருப்பத்தை அறிமுகப்படுத்துகிறது; אֶל என்பதன் திசைநோக்கு பொருளை ‘அரசனிடம்’ காக்கிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: எபிரேய இணைப்புத் தொடரை இயல்பான நவீனத் தமிழில் நேரடியாக வழங்குகிறது.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: உங்களை அனுப்பிய
  rationale: குறிப்பிட்ட அரசனை அடையாளப்படுத்தும் பெயரெச்சத் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது; אֶתְכֶם என்பதன் பன்மை ‘உங்களை’ என்பதில் காக்கப்படுகிறது.
- source_word: לִדְרֹשׁ בַּיהוָה
  choice: யாவேயிடம் விசாரிப்பதற்காக
  rationale: தீர்க்கதரிசன ஆலோசனையை நாடும் இச்சூழலில் דרשׁ என்பது இறைவனிடம் விசாரித்தலைக் குறிக்கிறது; ‘தேடுவதற்காக’ என்ற பரந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் நேரடியாக உள்ள இறைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: நீங்கள் இவ்வாறு சொல்லுங்கள்
  rationale: தூதுச் செய்திக்குரிய வழக்குச் சூத்திரத்தையும் பன்மை கட்டளை வலிமையையும் தெளிவாகக் காக்கிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே கூறுவது இதுவே
  rationale: தீர்க்கதரிசன அறிவிப்புச் சூத்திரத்தை இயல்பான, மதிப்புமிக்க நவீனத் தமிழில் வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரயேலின் கடவுளாகிய
  rationale: யாவேயை இஸ்ரயேலுடன் தொடர்புபடுத்தும் எபிரேய இணைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: நீ கேட்ட வார்த்தைகளைப் பொறுத்தவரை—
  rationale: அடுத்த வசனத்தில் நிறைவுபெறும் முன்னிலைப்படுத்தப்பட்ட தலைப்பை முழு வாக்கியமாக மாற்றாமல் காக்கிறது; שָׁמָעְתָּ என்பதன் ஒருமை ‘நீ’ என்பதில் வெளிப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப் பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பால் வழங்குகிறது.
- issue: דרשׁ ביהוה என்பதன் பொருள்
  choice: யாவேயிடம் விசாரித்தல்
  alternative: யாவேயைத் தேடுதல்
  rationale: இந்தத் தூதுக்குழு இறைச்செய்தியைப் பெற அனுப்பப்பட்ட சூழல் ‘விசாரித்தல்’ என்ற பொருளை ஆதரிக்கிறது; இருப்பினும் ‘தேடுதல்’ என்ற உண்மையான சொற்பொருள் சாத்தியம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: முடிவுறாத வாக்கிய அமைப்பு
  choice: நீ கேட்ட வார்த்தைகளைப் பொறுத்தவரை—
  alternative: 'நீ கேட்ட வார்த்தைகள் இவை:'
  rationale: எபிரேயத்தில் தலைப்பாக முன்னிறுத்தப்பட்ட சொற்றொடர் அடுத்த வசனத்தில்தான் நிறைவடைகிறது; கோடு அந்தத் தொடர்ச்சியையும் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க நடையில் அமைக்கப்பட்டுள்ளது. தூதுச் செய்திச் சூத்திரம் முறையான தொனியில் வைக்கப்பட்டுள்ளது; வசனத்தின் இறுதியில் அடுத்த வசனத்திற்குத் தொடரும் எபிரேய வாக்கிய அமைப்பு நீண்ட கோட்டால் காக்கப்பட்டுள்ளது.
