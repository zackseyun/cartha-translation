base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
translation:
  language: ta
  text: அவன் ஆட்சியின் எட்டாம் ஆண்டில், இன்னும் இளைஞனாக இருந்தபோது, தன் தந்தையான[a] தாவீதின் கடவுளைத் தேடத் தொடங்கினான். பன்னிரண்டாம் ஆண்டில், மேட்டு வழிபாட்டிடங்கள், அசேரா சின்னங்கள்[b], செதுக்கப்பட்ட உருவங்கள், வார்க்கப்பட்ட உலோக உருவங்கள்[c] ஆகியவற்றிலிருந்து யூதாவையும் எருசலேமையும் தூய்மைப்படுத்தத் தொடங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘தந்தை’ என்பது தாவீது அவனுடைய முன்னோர் என்பதைக் குறிக்கும் அரச வம்ச மொழிநடை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அசேரா கம்பங்கள்.’ எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுச் சின்னங்களை—பெரும்பாலும் மரக் கம்பங்கள் அல்லது மரங்களை—குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘வார்ப்புச் சிலைகள்’; அதாவது உருக்கிய உலோகத்தை அச்சில் வார்த்துச் செய்யப்பட்ட உருவங்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ
  choice: அவன் ஆட்சியின் எட்டாம் ஆண்டில்
  rationale: בְּ உடன் வரும் ஆண்டு குறிப்பு காலத்தைக் குறிக்கிறது; לְמָלְכוֹ என்பது அவனுடைய ஆட்சிக்காலக் கணக்கைத் தெளிவுபடுத்துகிறது.
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  choice: இன்னும் இளைஞனாக இருந்தபோதே
  rationale: נַעַר என்பதற்கு சிறுவன், இளைஞன் போன்ற பொருள்கள் உண்டு. இச்சூழலில் வயதில் இளமையான அரசனைச் சுட்டுவதால் ‘இளைஞன்’ இயல்பாக உள்ளது; עוֹדֶנּוּ என்பதிலுள்ள ‘இன்னும்’ என்ற நுட்பமும் காக்கப்படுகிறது.
- source_word: הֵחֵל לִדְרֹשׁ
  choice: தேடத் தொடங்கினான்
  rationale: கடவுளைப் பொருளாகக் கொண்ட דרשׁ வெறும் விசாரிப்பை அல்லாமல் பக்தியுடனும் பற்றுறுதியுடனும் அவரை நாடுவதைக் குறிக்கிறது.
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  choice: தன் தந்தையான தாவீதின் கடவுளை
  rationale: אָבִיו என்பதன் நேரடியான ‘தந்தை’ என்ற அரச மரபுவழக்கை முதன்மை உரை காக்கிறது; இங்கு உடனடி தந்தை அல்ல, முன்னோர் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וּבִשְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: பன்னிரண்டாம் ஆண்டில்
  rationale: முந்தைய ஆட்சியாண்டுக் குறிப்பே இங்கும் தொடர்வதால், தமிழில் அதை மீண்டும் விரித்துரைக்காமல் இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: הֵחֵל לְטַהֵר
  choice: தூய்மைப்படுத்தத் தொடங்கினான்
  rationale: טהר இங்கு வழிபாட்டுத் தீட்டாகக் கருதப்பட்டவற்றை நாட்டிலிருந்தும் நகரத்திலிருந்தும் அகற்றுவதைக் குறிக்கிறது; ‘தூய்மைப்படுத்துதல்’ அதன் சடங்கு மற்றும் சமய நுட்பங்களைத் தக்கவைக்கிறது.
- source_word: מִן הַבָּמוֹת
  choice: மேட்டு வழிபாட்டிடங்கள் ஆகியவற்றிலிருந்து
  rationale: בָּמוֹת என்பது பொதுவாக உள்ளூர் உயர்நில வழிபாட்டுத் தலங்களைக் குறிக்கும். வெறும் ‘உயர்ந்த இடங்கள்’ என்பதைவிட ‘மேட்டு வழிபாட்டிடங்கள்’ நவீன வாசகருக்குச் சூழலைத் தெளிவாக்குகிறது.
- source_word: וְהָאֲשֵׁרִים
  choice: அசேரா சின்னங்கள்
  rationale: אֲשֵׁרִים என்பது அசேராவுடன் தொடர்புடைய மரங்கள், மரக் கம்பங்கள் அல்லது பிற வழிபாட்டுச் சின்னங்களைக் குறிக்கக்கூடும். அவற்றின் துல்லியமான வடிவத்தைத் தீர்மானிக்காமல் ‘சின்னங்கள்’ என்ற பொதுச் சொல் ambiguity-ஐ காக்கிறது.
- source_word: וְהַפְּסִלִים
  choice: செதுக்கப்பட்ட உருவங்கள்
  rationale: פְּסִלִים என்பது செதுக்கி வடிவமைக்கப்பட்ட உருவங்களைக் குறிக்கிறது; பொதுவான ‘சிலைகள்’ என்பதைவிட உருவாக்க முறையையும் இது வெளிப்படுத்துகிறது.
- source_word: וְהַמַּסֵּכוֹת
  choice: வார்க்கப்பட்ட உலோக உருவங்கள்
  rationale: מַסֵּכוֹת என்பது உருக்கிய உலோகத்தை அச்சில் வார்த்துச் செய்யப்பட்ட உருவங்களைக் குறிக்கிறது. இத்தமிழாக்கம் பொருளையும் தயாரிப்பு முறையையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: ‘தாவீது அவனுடைய தந்தை’ என்ற மூதாதை மொழிநடை
  choice: முதன்மை உரையில் ‘தந்தை’ என்பதைத் தக்கவைத்தல்
  alternative: ‘முன்னோர்’ அல்லது ‘மூதாதை’
  rationale: எபிரெய உரை தாவீதிய அரச மரபை வலியுறுத்தும் வழக்கமான வம்ச மொழியைப் பயன்படுத்துகிறது. ‘தந்தை’ என்பதை வைத்திருப்பது அந்த இலக்கியத் தொடர்பைக் காக்கிறது; அது உடனடி தந்தையைக் குறிக்கவில்லை என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- issue: அசேரிம் என்பவற்றின் துல்லியமான வடிவம்
  choice: அசேரா சின்னங்கள்
  alternative: அசேரா கம்பங்கள்
  rationale: இச்சொல் வழிபாட்டுக் கம்பங்கள் அல்லது மரங்களைக் குறிக்கலாம்; ‘கம்பங்கள்’ என்று மட்டும் மொழிபெயர்ப்பது ஆதாரத்தில் உள்ள நிச்சயமின்மையை தேவையின்றி நீக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இரு ஆட்சியாண்டுக் கட்டங்களும் காக்கப்பட்டுள்ளன. வழிபாட்டுச் சொற்களில் தேவையற்ற சமயப் பிரிவு சார்ந்த விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன; அசேரா சின்னங்களின் வடிவம் குறித்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
