  terminology: ‘பாகால்கள்,’ ‘பலிபீடங்கள்,’ ‘செதுக்கப்பட்ட உருவங்கள்,’ ‘வார்ப்புச் சிலைகள்’ ஆகியவை பொருத்தமானவை. הָאֲשֵׁרִים-க்கு ‘அசேரீம்கள்’ என ஒலிபெயர்ப்பது, ‘அசேரா தூண்கள்’ என்ற விளக்கமான மாற்றை அடிக்குறிப்பில் வைத்தபடி சொற்பொருள் தெளிவின்மையைப் பாதுகாக்கிறது. הַחַמָּנִים-க்கு ‘தூபபீடங்கள்’ என்ற audit-trail வாசிப்பும் அதன் மாற்று அடிக்குறிப்பும் தக்கவைக்கப்பட்டுள்ளன.
