  text: וַ/יְנַתְּצ֣וּ לְ/פָנָ֗י/ו אֵ֚ת מִזְבְּח֣וֹת הַ/בְּעָלִ֔ים וְ/הַֽ/חַמָּנִ֛ים אֲשֶׁר לְ/מַ֥עְלָ/ה מֵ/עֲלֵי/הֶ֖ם גִּדֵּ֑עַ וְ֠/הָ/אֲשֵׁרִים וְ/הַ/פְּסִלִ֤ים וְ/הַ/מַּסֵּכוֹת֙ שִׁבַּ֣ר וְ/הֵדַ֔ק וַ/יִּזְרֹק֙ עַל פְּנֵ֣י הַ/קְּבָרִ֔ים הַ/זֹּבְחִ֖ים לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
translation:
  language: ta
  text: அவர்கள் அவன் முன்னிலையில் பாகால்களின் பலிபீடங்களை இடித்தார்கள். அவற்றின் மேலிருந்த தூபபீடங்களை[a] அவன் வெட்டி வீழ்த்தினான். அசேரீம்களையும்[b], செதுக்கப்பட்ட உருவங்களையும், வார்ப்புச் சிலைகளையும் அவன் உடைத்து நொறுக்கி, அவற்றுக்குப் பலியிட்டவர்களின் கல்லறைகள்மேல் சிதறவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூரிய வழிபாட்டுத் தூண்களை.” இங்குள்ள எபிரெயச் சொல் உறுதியற்றது; சூரிய வழிபாட்டோடு தொடர்புடைய வழிபாட்டுத் தூண்களை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அசேரா தூண்களையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתְּצוּ
  choice: அவர்கள் ... இடித்தார்கள்
  rationale: எபிரெயச் சொல்லின் பன்மை வினை வடிவத்தையும், கட்டமைப்புகளைத் தகர்த்தல் என்ற נתץ என்பதன் பொருளையும் வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: לְפָנָיו
  choice: அவன் முன்னிலையில்
  rationale: ‘அவனுடைய முகத்திற்கு முன்பாக’ என்ற நேரடிப் பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; இது யோசியாவின் முன்னிலையில் நடந்தது என்பதைக் காட்டுகிறது.
- source_word: מִזְבְּחוֹת הַבְּעָלִים
  choice: பாகால்களின் பலிபீடங்கள்
  rationale: בעלים என்ற பன்மையைத் தக்கவைத்து, பல உள்ளூர் பாகால் வழிபாட்டு வடிவங்களையோ பிரதிநிதித்துவங்களையோ குறிக்கும் வாய்ப்பைத் திறந்துவைக்கிறது.
- source_word: הַחַמָּנִים
  choice: தூபபீடங்கள்
  rationale: சீர்திருத்த நிகழ்வின் சூழலுக்கும் அவை பலிபீடங்களுக்கு மேலே இருந்தன என்ற விளக்கத்துக்கும் பொருந்தும் வாசிப்பு. சொல் உறுதியற்றதால் ‘சூரிய வழிபாட்டுத் தூண்கள்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר לְמַעְלָה מֵעֲלֵיהֶם
  choice: அவற்றுக்கு மேலே இருந்த
  rationale: தொடர்புச் சொற்றொடரை அருகிலுள்ள הַחַמָּנִים என்பதோடு இணைத்து, பாகால் பலிபீடங்களுக்கு மேலிருந்த அமைப்புகளாக இயல்பாகக் காட்டுகிறது.
- source_word: גִּדֵּעַ
  choice: வெட்டி வீழ்த்தினான்
  rationale: גדע என்பதிலுள்ள வெட்டித் தள்ளுதல் அல்லது துண்டித்தல் என்ற வலிமையான செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָאֲשֵׁרִים
  choice: அசேரா சின்னங்கள்
  rationale: அசேராவோடு தொடர்புடைய வழிபாட்டுப் பொருட்களைப் பொதுவாகக் குறிக்கிறது; அவை கட்டாயமாக மரத் தூண்களே என உரையில் தீர்மானிக்காமல் விடுகிறது.
- source_word: הַפְּסִלִים
  choice: செதுக்கப்பட்ட உருவங்கள்
  rationale: פסילים என்பவை செதுக்கி உருவாக்கப்பட்ட வழிபாட்டு உருவங்கள் என்பதை ‘சிலைகள்’ என்ற பொதுச் சொல்லைவிடத் துல்லியமாகக் காட்டுகிறது.
- source_word: הַמַּסֵּכוֹת
  choice: வார்ப்புச் சிலைகள்
  rationale: உலோகத்தை உருக்கி வார்த்து செய்யப்பட்ட உருவங்கள் என்ற מסכות என்பதன் தயாரிப்பு முறையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: שִׁבַּר וְהֵדַק
  choice: உடைத்து நொறுக்கி
  rationale: முதலில் உடைத்து, பின்னர் மிகச் சிறிய துண்டுகளாக அல்லது பொடியாக்கிய தொடர்ச்சியான தீவிர அழிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּזְרֹק
  choice: தூவினான்
  rationale: நொறுக்கப்பட்ட எச்சங்களை கல்லறைகள்மேல் சிதறவிட்ட செயலைச் சூழலுக்கேற்ற தமிழில் தெரிவிக்கிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத பொருளை தனியே சேர்க்கவில்லை.
theological_decisions:
- issue: הָאֲשֵׁרִים என்பதன் மொழிபெயர்ப்பு
  choice: அசேரா சின்னங்கள்
  alternative: அசேரா தூண்கள்
  rationale: இச்சொல் அசேராவோடு தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கலாம்; அவற்றின் வடிவம் தூண்களே என்று குறுக்காமல் ‘சின்னங்கள்’ என்பது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: הַחַמָּנִים என்பதன் மொழிபெயர்ப்பு
  choice: தூபபீடங்கள்
  alternative: சூரிய வழிபாட்டுத் தூண்கள்
  rationale: இந்த எபிரெயச் சொல்லின் துல்லியமான குறிப்பு உறுதியற்றது. முதன்மை வாசிப்பு இச்சூழலுக்கு ஏற்ற வழிபாட்டு அமைப்பைக் காட்டுகிறது; சூரிய வழிபாட்டோடு தொடர்புடைய தூண்கள் என்ற முக்கிய மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. பன்மை வினை, பாகால்களின் பன்மை, வழிபாட்டுப் பொருட்களின் வகைகள் ஆகியவை முடிந்தவரை தக்கவைக்கப்பட்டுள்ளன. உறுதியற்ற இரண்டு வழிபாட்டுச் சொற்களுக்கான மாற்று வாசிப்புகள் சரியான சொற்களின் பின்னர் [a], [b] எனக் குறிக்கப்பட்டுள்ளன.
