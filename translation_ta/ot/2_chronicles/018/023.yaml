base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: ta
  text: அப்போது கெனானாவின் மகன் சிதேக்கியா அருகில் வந்து, மிகாயாவின் கன்னத்தில் அடித்து, “யாவேயின் ஆவி என்னிடமிருந்து உன்னிடம் பேசுவதற்கு எந்த வழியாகக் கடந்து சென்றது?” என்று கூறினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: அருகில் வந்து
  rationale: נגשׁ என்பதன் அணுகுதல் என்ற உடல் இயக்கத்தையும் மோதலுக்குரிய சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִדְקִיָּהוּ בֶן־כְּנַעֲנָה
  choice: கெனானாவின் மகன் சிதேக்கியா
  rationale: தனிப்பெயர்கள் நவீனத் தமிழில் ஒலிபெயர்க்கப்பட்டு, எபிரெய உறவுமுறை இயல்பான தமிழ் உடைமைத் தொடரால் தரப்பட்டுள்ளது.
- source_word: וַיַּךְ אֶת־מִיכָיְהוּ עַל־הַלֶּחִי
  choice: மிகாயாவின் கன்னத்தில் அடித்து
  rationale: נכה என்பது பொதுவாக ‘அடி/தாக்கு’ என்று பொருள்படும்; לֶחִי கன்னம் அல்லது தாடைப் பகுதியைக் குறித்தாலும், இச்சூழலில் அவமதிப்பான அறையைக் குறிக்க இயல்பாக ‘கன்னம்’ தேர்ந்தெடுக்கப்பட்டது. வினையின் பரந்த பொருளைச் சுருக்காமல் ‘அடித்து’ எனத் தரப்பட்டுள்ளது.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: எந்த வழியாக
  rationale: இந்த வினாவாக்கியம் வழி அல்லது பாதை என்ற உருவகத்தைத் தக்கவைத்தபடி, தமிழில் இயல்பான சவாலான கேள்வியாக அமைகிறது.
- source_word: עָבַר
  choice: கடந்து சென்றது
  rationale: עבר-இன் ஓரிடத்திலிருந்து மற்றோரிடத்திற்குச் செல்லும் படிமத்தைத் தக்கவைக்கிறது; ஆவி ஒரு தீர்க்கதரிசியிடமிருந்து இன்னொருவரிடம் சென்றதாகச் சிதேக்கியா கேலி செய்வதும் வெளிப்படுகிறது.
- source_word: רוּחַ יְהוָה
  choice: யாவேயின் ஆவி
  rationale: רוּחַ இங்கு தீர்க்கதரிசனச் சூழலில் தேவ ஆவியைக் குறிக்கிறது; יהוה என்பது பொதுப்பட்டத்தால் மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מֵאִתִּי
  choice: என்னிடமிருந்து
  rationale: மூலம் அல்லது புறப்படும் இடம் என்ற பொருளை நேரடியாகக் காட்டுகிறது.
- source_word: לְדַבֵּר אֹתָךְ
  choice: உன்னிடம் பேசுவதற்காக
  rationale: דבר உடன் வரும் அரிதான אֵת அமைப்பைத் தமிழில் இயல்பாக ‘உன்னிடம் பேச’ எனக் கொடுக்கிறது; நோக்கத்தைக் குறிக்கும் לְ முன்னொட்டு ‘பேசுவதற்காக’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைக்குரிய தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் அறியத்தக்க வகையில் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: רוּחַ என்பதன் குறிப்பும் தமிழிலக்கணப் பாலும்
  choice: யாவேயின் ஆவி … கடந்து சென்றது
  alternative: யாவேயின் ஆவியானவர் … கடந்து சென்றார்
  rationale: இங்கு தேவ ஆவியே குறிக்கப்படுகிறார்; ஆயினும் ‘ஆவியானவர்’ என்ற விரிவாக்கத்தை மூலத்தில் சேர்க்காமல், தமிழ் பெயர்ச்சொல் இலக்கணத்துக்கு ஏற்ப ‘ஆவி … சென்றது’ எனத் தருவது உரையின் சொற்படிமத்தையும் தெய்வீகக் குறிப்பையும் ஒருங்கே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. சிதேக்கியாவின் கேலியும், ஆவி தன்னிடமிருந்து மிகாயாவிடம் சென்றதாக அவன் முன்வைக்கும் சவாலும் விளக்கமின்றி உரையிலேயே தக்கவைக்கப்பட்டுள்ளன.
