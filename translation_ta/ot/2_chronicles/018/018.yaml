source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שִׁמְע֣וּ דְבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יוֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹֽמְדִ֔ים עַל יְמִינ֖/וֹ וּ/שְׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
translation:
  language: ta
  text: 'அவன் சொன்னான்: “ஆகையால், யாவேயின் வார்த்தையைக் கேளுங்கள். யாவே தமது அரியணையில் அமர்ந்திருப்பதையும், வானத்தின் முழுப் படையும் அவரது வலப்புறத்திலும் இடப்புறத்திலும் நிற்பதையும் கண்டேன்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: முந்தைய உரையாடலிலிருந்து வரும் முடிவையும் தீர்க்கதரிசன அறிவிப்பின் வலிமையையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: שִׁמְעוּ
  choice: கேளுங்கள்
  rationale: பலரிடம் கூறப்படும் கட்டளை வடிவத்தையும், தெய்வீகச் செய்திக்குக் கவனம் செலுத்தும்படி அழைக்கும் பொருளையும் காக்கிறது.
- source_word: דְבַר יְהוָה
  choice: யாவேயின் வார்த்தை
  rationale: வழக்கமான தீர்க்கதரிசன அறிவிப்பு முறையைப் பாதுகாப்பதோடு, יְהוָה என்ற தனிப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: רָאִיתִי
  choice: கண்டேன்
  rationale: தீர்க்கதரிசி கண்ட தரிசனத்தை இயல்பான தமிழ் இறந்தகாலத்தில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: יוֹשֵׁב עַל כִּסְאוֹ
  choice: தமது அரியணையில் அமர்ந்திருப்பதை
  rationale: தொடர்நிலைப் பங்கேற்பெயரையும் அரசருக்குரிய அரியணைக் காட்சியையும் தெளிவாகக் காக்கிறது.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: வானத்தின் படை முழுவதும்
  rationale: צָבָא என்பதன் ஒன்றுதிரண்ட படை அல்லது சேனை என்ற கூட்டுப்பொருளைத் தக்கவைத்து, வானுலக அரசவைக் காட்சிக்கு ஏற்ற இயல்பான தமிழை வழங்குகிறது.
- source_word: עֹמְדִים
  choice: நிற்பதை
  rationale: அவர்களின் நிலையையும் அரசவையில் ஆயத்தமாக நிற்கும் காட்சியையும் கூடுதல் விளக்கமின்றி தெரிவிக்கிறது.
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  choice: அவரது வலப்புறத்திலும் இடப்புறத்திலும்
  rationale: இருபுறங்களிலும் இருந்த நிலையைத் துல்லியமாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: தீர்க்கதரிசி கண்டவரைக் குறிக்கும் יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை மறைக்காமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: כָל צְבָא הַשָּׁמַיִם குறிக்கும் வானுலகக் கூட்டத்தின் இயல்பு
  choice: வானத்தின் படை முழுவதும்
  alternative: வானுலகச் சேனைகள் அனைத்தும்
  rationale: இவர்கள் தேவதூதர்கள் என்று வெளிப்படையாகத் தீர்மானிக்காமல், மூலத்தின் படை அல்லது ஒன்றுதிரண்ட கூட்டம் என்ற உருவகத்தையும் அதன் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், தீர்க்கதரிசன அறிவிப்புக்குரிய கண்ணியமும் நேரடித்தன்மையும் காக்கப்பட்டுள்ளன. யாவே என்பதற்கு மரியாதைப் பன்மைச் சுட்டுப்பெயர்கள் பயன்படுத்தப்பட்டுள்ளன; ஆனால் மூலத்தில் இல்லாத தேவதூதர் போன்ற விளக்கம் உரைக்குள் சேர்க்கப்படவில்லை.
