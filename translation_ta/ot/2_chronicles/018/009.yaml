source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יוֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ וְ/יֹשְׁבִ֣ים בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָל הַ֨/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசனும் யூதாவின் அரசனான யோசபாத்தும் தத்தம் அரியணைகளில் அமர்ந்து, உடைகள் அணிந்தவர்களாய், சமாரியாவின் நகரவாசல் நுழைவிடத்திலுள்ள போரடிக்கும் களத்தில் அமர்ந்திருந்தார்கள்; தீர்க்கதரிசிகள் அனைவரும் அவர்களுக்கு முன்பாகத் தீர்க்கதரிசனம் சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனும்
  rationale: ו இணைப்பைத் தமிழில் இயல்பான ‘உம்’ மூலம் வெளிப்படுத்துகிறது; மூலத்தில் இல்லாத காலச் சுட்டைச் சேர்க்கவில்லை.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனான யோசபாத்தும்
  rationale: பெயரையும் அதன் அரசப் பட்டத்தையும் தெளிவான தமிழ் அடைமொழித் தொடராக வழங்குகிறது.
- source_word: יוֹשְׁבִים ... וְיֹשְׁבִים
  choice: அமர்ந்திருந்தார்கள்
  rationale: எபிரெயத்தில் இருமுறை வரும் பங்கேற்புவினை, அரியணையும் இடமும் ஒரே அமர்வு நிலையை விவரிப்பதால், தமிழில் இயல்பாக ஒரே வினையால் வாக்கிய முடிவில் தொகுக்கப்படுகிறது.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: தத்தம் அரியணையில்
  rationale: אִישׁ என்பதன் பகிர்நிலைப் பொருளான ‘ஒவ்வொருவரும் தமது’ என்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; அரசச் சூழலில் כִּסֵּא என்பது ‘அரியணை.’
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: அரச உடைகள் அணிந்து
  rationale: சொற்றொடர் நேரடியாக ‘உடைகள் அணிந்தவர்கள்’ எனினும், அரசர்கள் அரியணையில் அமர்ந்துள்ள பொதுவிழா சூழலில் ‘அரச உடைகள்’ இயல்பான பொருளைத் தருகிறது; குறிப்பிட்ட வகை ஆடையை ஊகிக்கவில்லை.
- source_word: בְּגֹרֶן
  choice: களத்துமேட்டில்
  rationale: தானியத்தைப் போரடித்துத் தூற்றும் இடத்தைக் குறிக்கும் גֹּרֶן என்பதற்கான தெளிவான, வழக்கிலுள்ள தமிழ் வேதாகமச் சொல்.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: சமாரியாவின் நுழைவாயிலுக்கு முன்பிருந்த
  rationale: פתח שער என்ற இடவமைப்பை ‘வாயிலின் நுழைவிடம்’ என்ற கடினமான சொல்லெதிர்ப்பைத் தவிர்த்து, நகர நுழைவாயிலுக்கு முன்னுள்ள இடமாக இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְכָל הַנְּבִיאִים
  choice: தீர்க்கதரிசிகள் அனைவரும்
  rationale: முழுமையைக் குறிக்கும் כָּל மற்றும் வரையறுக்கப்பட்ட பன்மையை இயல்பான தமிழ்ச் சொல்வரிசையில் காக்கிறது.
- source_word: מִתְנַבְּאִים לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாகத் தீர்க்கதரிசனம் உரைத்துக்கொண்டிருந்தார்கள்
  rationale: התפעל வடிவம் இங்கு நடைபெற்று வந்த தீர்க்கதரிசனச் செயலைக் குறிக்கிறது; ‘முன்பாக’ அரசர்களின் முன்னிலையில் நடந்ததைப் பாதுகாக்கிறது.
