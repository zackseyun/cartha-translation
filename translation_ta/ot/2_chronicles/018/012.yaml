base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: The messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
translation:
  language: ta
  text: மிகாயாவை அழைக்கச் சென்ற தூதன் அவனிடம், “இதோ, தீர்க்கதரிசிகளின் வார்த்தைகள் ஒரே குரலாக[a] அரசனுக்குச் சாதகமாக இருக்கின்றன. தயவுசெய்து, உமது வார்த்தையும் அவர்களுடைய வார்த்தைகளில் ஒன்றைப் போல இருக்கட்டும்; சாதகமாகப் பேசுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், “ஒரே வாயாக”; அதாவது, முழுமையாக ஒருமித்து அல்லது ஒரே குரலாக.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: தூதன்
  rationale: இச்சூழலில் மிகாயாவை அழைத்துவர அனுப்பப்பட்ட மனிதத் தூதரையே குறிக்கிறது; வானதூதனை அல்ல.
- source_word: לִקְרֹא
  choice: அழைத்துவர
  rationale: அரசனிடம் ஆஜராகும்படி அழைக்கும் அதிகாரப்பூர்வச் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְמִיכָיְהוּ
  choice: மிகாயா
  rationale: தமிழ் வேதாகமப் பெயர் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: דִּבֶּר אֵלָיו לֵאמֹר
  choice: அவனிடம் … என்றான்
  rationale: எபிரெயக் கூறுமுறையை இயல்பான தமிழ் நேரடிக் கூற்றாக மாற்றுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டுச் சொல்லின் வலிமையைச் சுருக்கமாகக் காக்கிறது.
- source_word: דִּבְרֵי הַנְּבִאִים
  choice: தீர்க்கதரிசிகளின் வார்த்தைகள்
  rationale: மூலத்தின் பன்மை வடிவத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: פֶּה אֶחָד
  choice: ஒரே குரலாக
  rationale: சொல்லுக்குச் சொல் ‘ஒரே வாய்’ என்ற உருவகத்தின் பொருளான முழு ஒருமித்த குரலைத் தெளிவான தமிழில் தருகிறது; அடிக்குறிப்பு மூல உருவகத்தைக் காட்டுகிறது.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: அரசனுக்குச் சாதகமாக
  rationale: இங்கு ‘நல்லது’ என்பது அரசனை ஆதரிக்கும் அல்லது அவனுக்கு நன்மையான அறிவிப்பைக் குறிக்கிறது.
- source_word: וִיהִי נָא
  choice: தயவுசெய்து … இருக்கட்டும்
  rationale: வேண்டுகோள் அல்லது மரியாதையான வற்புறுத்தலை வெளிப்படுத்தும் நָא மற்றும் விருப்ப வினைநிலையைப் பாதுகாக்கிறது.
- source_word: דְבָרְךָ
  choice: உமது வார்த்தை
  rationale: எபிரெய ஒருமையைப் பேணி, மிகாயாவின் தீர்க்கதரிசன உரையை ஒரு முழுமையான செய்தியாகக் காட்டுகிறது.
- source_word: כְּאַחַד מֵהֶם
  choice: அவர்களில் ஒருவருடைய வார்த்தையைப்போல்
  rationale: ஒப்பீடு தீர்க்கதரிசிகளில் ஒருவரின் வார்த்தையோடு என்பதைத் தமிழில் குழப்பமின்றித் தெளிவுபடுத்துகிறது.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: சாதகமாகப் பேசும்
  rationale: அரசனை ஆதரிக்கும் நல்ல செய்தியைச் சொல்லுமாறு வற்புறுத்தும் பொருளை இயல்பாகத் தருகிறது.
