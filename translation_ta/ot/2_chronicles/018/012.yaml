translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையுடனும் பொதுவாசகர்களுக்குப் புரியும் வகையிலும் அமைக்கப்பட்டுள்ளது. தூதன் மிகாயாவை மரியாதையாக ஒருமையில் அணுகுவதால் ‘உமது’ பயன்படுத்தப்பட்டுள்ளது; மேற்கோளின் இறுதியில் வேண்டுகோளோடு கலந்த வற்புறுத்தலைக் காட்ட ‘பேசும்’ என்ற உயர்திணை ஏவல் வடிவம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
