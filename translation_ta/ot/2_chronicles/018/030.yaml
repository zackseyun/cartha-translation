base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: The king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
translation:
  language: ta
  text: அராமின் அரசன் தனக்கிருந்த தேர்ப்படையின் தலைவர்களுக்கு, “சிறியவர், பெரியவர் எவருடனும் போரிடாதீர்கள்; இஸ்ரயேலின் அரசனுடன் மட்டுமே போரிடுங்கள்” என்று கட்டளையிட்டிருந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: அராமின் அரசன்
  rationale: வாவ் இணைப்பின் கதையோட்டத் தொடர்பைத் தமிழில் தனியாகச் சொல்லாமல் இயல்பான தொடரால் வெளிப்படுத்தலாம். אֲרָם என்பது இடப்பெயராக ‘அராம்’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: צִוָּה
  choice: கட்டளையிட்டிருந்தான்
  rationale: வினை ‘கட்டளையிடு’ என்று பொருள்படும். சுற்றியுள்ள நிகழ்வுகளுக்கு முன்பே இக்கட்டளை கொடுக்கப்பட்டதை ‘இருந்தான்’ வடிவம் தெளிவாக்குகிறது.
- source_word: שָׂרֵי הָרֶכֶב
  choice: தேர்ப்படைத் தலைவர்கள்
  rationale: שָׂרֵי என்பது இராணுவத் தலைவர்களையும் הָרֶכֶב என்பது தேர்களைக் கொண்ட படைப்பிரிவையும் குறிக்கிறது; இவ்விரண்டையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: אֲשֶׁר לוֹ
  choice: தனக்குக் கீழிருந்த
  rationale: சொல்லுக்கு சொல் ‘அவனுக்கு இருந்த’ என்ற உடைமைப் பொருள் இங்கு அரசனின் அதிகாரத்திற்குக் கீழிருந்த படைத்தலைவர்களைக் குறிப்பதால், இயல்பான தமிழில் இவ்வாறு தரப்பட்டுள்ளது.
- source_word: לֹא תִּלָּחֲמוּ
  choice: போரிடாதீர்கள்
  rationale: நேரடிக் கட்டளையிலுள்ள தடைப் பொருளை மரியாதைப் பன்மையுடன் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֶת־הַקָּטֹן אֶת־הַגָּדוֹל
  choice: சிறியவனோ பெரியவனோ எவனுடனும்
  rationale: ‘சிறியவன்—பெரியவன்’ என்ற மூலமொழி இணையைப் பாதுகாத்தபடியே, பதவி அல்லது நிலை எதுவாயினும் யாருடனும் போரிட வேண்டாம் என்ற மொழிவழக்குப் பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: כִּי אִם
  choice: மட்டுமே
  rationale: விதிவிலக்கையும் தனிப்படுத்தலையும் குறிக்கும் இக்கட்டமைப்பின் கட்டுப்படுத்தும் பொருளை இயல்பாகத் தருகிறது.
- source_word: אֶת־מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: இஸ்ரயேலின் அரசனுடன் மட்டுமே
  rationale: போரின் ஒரே இலக்கு இஸ்ரயேலின் அரசன்தான் என்ற பொருளைத் தருகிறது. לְבַדּוֹ-வின் தனிப்படுத்தும் வலிமை ‘மட்டுமே’ என்பதில் வெளிப்படுகிறது.
