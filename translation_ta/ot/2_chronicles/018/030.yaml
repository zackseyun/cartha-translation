  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இராணுவச் சூழலுக்கேற்ற ‘தேர்ப்படைத் தலைவர்கள்’ என்பதும், மூலத்தின் ‘சிறியவன்—பெரியவன்’ மொழிவழக்கை வாசகருக்குத் தெளிவாக்கும் ‘எவனுடனும்’ என்பதும் தேர்ந்தெடுக்கப்பட்டன.
