  text: וַ/יֹּ֣אמֶר יְהוָ֗ה מִ֤י יְפַתֶּה֙ אֶת אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַ֕עַל וְ/יִפֹּ֖ל בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יֹּ֕אמֶר זֶ֚ה אֹמֵ֣ר כָּ֔כָה וְ/זֶ֖ה אֹמֵ֥ר כָּֽכָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
translation:
  language: ta
  text: யாவே, “இஸ்ரவேலின் அரசன் ஆகாபை ராமோத் கிலேயாத்துக்கு ஏறிச் சென்று அங்கே வீழும்படி யார் தூண்டுவார்[a]?” என்று கூறினார். ஒருவன் இப்படிச் சொன்னான்; இன்னொருவன் அப்படிச் சொன்னான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இணங்கச் செய்வார்”; அல்லது, “ஏமாற்றுவார்.”
    reason: פתה என்ற எபிரெய வினைச்சொல்லின் பொருள் இச்சூழலில் தூண்டுதல், இணங்கச் செய்தல், ஏமாற்றுதல் ஆகியவற்றுக்கு இடையில் நுட்பமாக மாறக்கூடும்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: יְפַתֶּה
  choice: தூண்டுவார்
  rationale: இந்த பியேல் வினைச்சொல் தூண்டுதல், இணங்கச் செய்தல், ஏமாற்றுதல் ஆகிய பொருள் நிழல்களைக் கொண்டது. ஆகாபை ஒரு செயலுக்கு இட்டுச் செல்லும் கருத்தைத் தெரிவிக்கவும், ஏமாற்றுதல் என்ற பொருளை மட்டும் முதன்மை உரையில் தீர்மானித்துவிடாமல் இருக்கவும் ‘தூண்டுவார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன் ஆகாபை
  rationale: தமிழின் இயல்பான அடைமொழி வரிசையில் அரச பட்டமும் பெயரும் தரப்பட்டுள்ளன.
- source_word: וְיַעַל וְיִפֹּל
  choice: போய் அங்கே வீழும்படி
  rationale: தொடர்ந்து வரும் வினைகள் நோக்கம் அல்லது விளைவைச் சுட்டுகின்றன. ‘வீழ்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, போரில் மரணம் அல்லது தோல்வி என்ற உட்கருத்தைச் சூழலே வெளிப்படுத்த விடுகிறது.
- source_word: בְּרָמוֹת גִּלְעָד
  choice: ராமோத் கிலேயாத்துக்கு ... அங்கே
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; ஏறிச் செல்லும் இலக்கையும் அங்கு நிகழும் வீழ்ச்சியையும் இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  choice: ஒருவன் இப்படிச் சொன்னான்; இன்னொருவன் அப்படிச் சொன்னான்
  rationale: வெவ்வேறு ஆலோசனைகள் முன்வைக்கப்பட்டதைத் தெரிவிக்கும் எபிரெய இணை அமைப்பையும் ‘இப்படி/அப்படி’ என்ற வேறுபாட்டையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: ஆகாபின் வீழ்ச்சியில் யாவேயின் பங்கு
  choice: ஆகாபைத் தூண்டுவதற்கு யார் முன்வருவார் என்று யாவே நேரடியாகக் கேட்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: யாவே வெறுமனே ஆகாப் தூண்டப்பட அனுமதித்ததாக மென்மைப்படுத்துதல்.
  rationale: எபிரெய உரை இறை முன்முயற்சியை நேரடியாகச் சித்தரிக்கிறது. அந்த இறையியல் பதற்றத்தை விளக்கவோ மென்மைப்படுத்தவோ செய்யாமல் தக்கவைக்கிறது.
- issue: פתה என்பதன் அறநெறிப் பொருள் நிழல்
  choice: முதன்மை உரையில் ‘தூண்டுவார்’; அடிக்குறிப்பில் ‘இணங்கச் செய்வார்’ மற்றும் ‘ஏமாற்றுவார்’ என்ற மாற்றுகள்.
  alternative: முதன்மை உரையிலேயே ‘ஏமாற்றுவார்’ என்று பொருளைச் சுருக்குதல்.
  rationale: சூழலில் தவறாக வழிநடத்துதல் இடம்பெற்றாலும், வினைச்சொல்லின் பொருள் அதற்கு மட்டும் வரையறுக்கப்படவில்லை. ஆகவே உண்மையான சொற்பொருள் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையான, கண்ணியமான நடையைக் கொண்டுள்ளது. அரசவை மற்றும் விண்ணுலக ஆலோசனைக் காட்சிக்கு ஏற்ற மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயப் பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
