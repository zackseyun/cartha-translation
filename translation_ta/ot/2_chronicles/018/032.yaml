id: 2CH.18.32
reference: 2 Chronicles 18:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּ֥י לֹא הָיָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יָּשֻׁ֖בוּ מֵ/אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/032.yaml
  text: And when the commanders of the chariots saw that he was not the king of Israel[a], they turned back from following him.
translation:
  language: ta
  text: தேர்ப்படைத் தலைவர்கள் அவர் இஸ்ரவேலின் அரசர் அல்ல என்பதைக் கண்டபோது, அவரைப் பின்தொடர்வதை விட்டுத் திரும்பினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அவருக்குப் பின்னாலிருந்து திரும்பினார்கள்’; அதாவது, அவரைப் பின்தொடர்வதையோ துரத்துவதையோ நிறுத்தினார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: கண்டபோது
  rationale: וַיְהִי தொடரும் நிகழ்வை அறிமுகப்படுத்துகிறது; כִּרְאוֹת என்பது காலத்தைக் குறிக்கும் வினையெச்சத் தொடர். தமிழில் இரண்டையும் இயல்பாக ஒருங்கிணைத்து ‘கண்டபோது’ என்று வழங்கப்பட்டுள்ளது.
- source_word: שָׂרֵי הָרֶכֶב
  choice: தேர்ப்படைத் தலைவர்கள்
  rationale: שָׂרֵי என்பது இராணுவத் தலைவர்களையும், הָרֶכֶב என்பது இச்சூழலில் தேர்ப்படையையும் குறிக்கிறது. ‘தேர்ப்படைத் தலைவர்கள்’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּי לֹא הָיָה מֶלֶךְ יִשְׂרָאֵל
  choice: அவர் இஸ்ரவேலின் அரசர் அல்ல என்பதை
  rationale: எபிரெயத்தில் எழுவாய் வெளிப்படையாக இல்லாவிட்டாலும், மֵאַחֲרָיו என்பதிலுள்ள ஒருமை ஆண்பால் பின்னொட்டு அவர்கள் துரத்திய நபரையே சுட்டுகிறது. மரியாதைமிக்க இயல்பான தமிழுக்காக ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּשֻׁבוּ
  choice: திரும்பினார்கள்
  rationale: שׁוּב என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்.’ துரத்தலை நிறுத்தி அவர்கள் திரும்பியதை இச்சொல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: מֵאַחֲרָיו
  choice: அவரைப் பின்தொடர்வதை விட்டு
  rationale: சொல்லுக்குச் சொல் ‘அவருக்குப் பின்னாலிருந்து’ என்ற அமைப்பு, இச்சூழலில் அவரைப் பின்தொடர்வதையோ துரத்துவதையோ நிறுத்தியதைக் குறிக்கும் மரபுத்தொடர். ‘பின்தொடர்வதை விட்டு’ என்பது அந்தப் பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வரலாற்று விவரணைக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தேர்ப்படை’ என்பது தனித்தனி தேர்களை அல்ல, அவற்றைக் கொண்ட இராணுவப் பிரிவைக் குறிக்கிறது.
