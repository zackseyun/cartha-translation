source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ לְ/ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
translation:
  language: ta
  text: அவன், “நான் புறப்பட்டுப்போய், அவனுடைய எல்லாத் தீர்க்கதரிசிகளின் வாயிலும் பொய்யின் ஆவியாக இருப்பேன்” என்றான். அதற்கு அவர், “நீ அவனை வசப்படுத்துவாய்; வெற்றியும் பெறுவாய். புறப்பட்டுப்போய் அப்படியே செய்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵצֵא
  choice: நான் புறப்பட்டுப் போய்
  rationale: יצא என்பதன் வெளியே செல்லும் இயக்கத்தையும், பேச்சாளரின் நோக்கத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהָיִיתִי
  choice: மாறுவேன்
  rationale: היה என்பதன் அடிப்படைப் பொருள் ‘இருப்பேன்’ என்றாலும், இங்கு ஓர் ஆவி புதிய பங்கை ஏற்கும் மாற்றநிலையை வாக்கியச் சூழல் காட்டுவதால் ‘மாறுவேன்’ இயல்பாக உள்ளது.
- source_word: לְרוּחַ שֶׁקֶר
  choice: பொய் சொல்லும் ஆவியாக
  rationale: שֶׁקֶר ஆவியின் பொய்யான, ஏமாற்றும் செயல்பாட்டைக் குறிக்கிறது. ‘பொய் சொல்லும் ஆவி’ சாதாரண வாசகருக்குத் தெளிவாகவும் மூலத்தின் கருத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: בְּפִי כָּל נְבִיאָיו
  choice: அவனுடைய தீர்க்கதரிசிகள் எல்லாருடைய வாயிலும்
  rationale: ‘வாயில்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, ஒவ்வொரு தீர்க்கதரிசியின் பேச்சிலும் அந்த ஆவி செயல்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תְּפַתֶּה
  choice: நீ அவனை ஏமாற்றுவாய்
  rationale: Piel வடிவிலுள்ள פתה இங்கு ஒருவரை வஞ்சித்து இணங்கச் செய்யும் பொருளைக் கொண்டுள்ளது. சூழலின் ஏமாற்றும் தன்மையை ‘ஏமாற்றுவாய்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְגַם תּוּכָל
  choice: அதில் வெற்றியும் பெறுவாய்
  rationale: יכל இங்கு வெறும் திறனை அல்ல, திட்டம் செயல்பட்டு முடியும் என்பதைக் குறிக்கிறது; ‘அதில்’ என்பது தமிழில் தொடர்பைத் தெளிவாக்குகிறது, ‘வெற்றியும்’ וגם என்பதையும் பிரதிபலிக்கிறது.
- source_word: צֵא וַעֲשֵׂה כֵן
  choice: புறப்பட்டுப் போய் அப்படியே செய்
  rationale: יצא என்பதன் முந்தைய இயக்கத்தை மீண்டும் ஒலிக்கச் செய்து, עשה כן என்ற கட்டளையை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ஏமாற்றும் பணிக்கு இறைவன் அனுமதியும் ஆணையும் அளிப்பதாகத் தோன்றும் தரிசனக் காட்சி
  choice: அந்த ஆவியின் திட்டம் ஏற்றுக்கொள்ளப்பட்டு, ‘புறப்பட்டுப் போய் அப்படியே செய்’ என்று நேரடியாகக் கட்டளையிடப்படுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: இறைவனின் தொடர்பை மென்மைப்படுத்தி, வெறும் அனுமதி அல்லது முன்னறிவு போல மறைமுகமாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை ஏமாற்றும் திட்டத்தையும் அதற்கான ஒப்புதலையும் வெளிப்படையாக முன்வைக்கிறது. அதன் இறையியல் பதற்றத்தை விளக்கமூலம் நீக்காமல் அப்படியே பாதுகாக்க வேண்டும்.
- issue: וַיֹּאמֶר என்ற இரு வினைகளின் மறைமுக எழுவாய்கள்
  choice: முதல் பேச்சாளரை உயிரற்ற பால் சுட்டும் ‘அது’ என்றும், பதிலளிப்பவரை மரியாதை ஒருமையிலுள்ள ‘அவர்’ என்றும் சூழலுக்கேற்ப குறிப்பிட்டது.
  alternative: இருவருக்கும் ‘அவன்’ என ஒரே வடிவைப் பயன்படுத்துதல் அல்லது பெயர்களை உரையில் சேர்த்தல்.
  rationale: எபிரெயத்தில் எழுவாய் வெளிப்படையாக இல்லாவிட்டாலும் முந்தைய சூழலில் முதல் பேச்சாளர் ஓர் ஆவி, பதிலளிப்பவர் ஆண்டவர். தமிழில் குழப்பமின்றி வாசிக்க இச்சுட்டுப்பெயர்கள் தேவையானவை; அதே நேரத்தில் மூலத்தில் இல்லாத பெயர்கள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தீர்க்கதரிசிகள்’, ‘ஆவி’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. எபிரெயத்தின் ‘வாய்’ உருவகமும், ‘புறப்பட்டுப் போ’ என்ற வினை மீளுரையும் பாதுகாக்கப்பட்டுள்ளன.
