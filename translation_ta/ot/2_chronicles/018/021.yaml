- from: அப்போது அது, “நான் புறப்பட்டுப் போய், அவனுடைய தீர்க்கதரிசிகள் எல்லாருடைய வாயிலும் பொய் சொல்லும் ஆவியாக[a] மாறுவேன்” என்றது. அதற்கு அவர், “நீ அவனை ஏமாற்றுவாய்[b]; அதில் வெற்றியும் பெறுவாய். புறப்பட்டுப் போய் அப்படியே செய்” என்றார்.
  to: அவன், “நான் புறப்பட்டுப்போய், அவனுடைய எல்லாத் தீர்க்கதரிசிகளின் வாயிலும் பொய்யின் ஆவியாக இருப்பேன்” என்றான். அதற்கு அவர், “நீ அவனை வசப்படுத்துவாய்; வெற்றியும் பெறுவாய். புறப்பட்டுப்போய் அப்படியே செய்” என்றார்.
  rationale: மூலத்தில் இல்லாத ‘அப்போது’ நீக்கப்பட்டது. שֶׁקֶר-ன் பண்புக் கருத்தை நேரடியாகப் பாதுகாக்க ‘பொய்யின் ஆவி’ பயன்படுத்தப்பட்டது. פתה-வின் கவர்ந்து இணங்கச் செய்யும் நுணுக்கத்திற்கு ‘வசப்படுத்துவாய்’ தேர்ந்தெடுக்கப்பட்டு, ‘ஏமாற்றுவாய்’ அடிக்குறிப்பு மாற்றாகத் தக்கவைக்கப்பட்டது. அடிக்குறிப்பு அடையாளங்கள் திருத்திய உரையில் முறையே ‘ஆவியாக[a]’ மற்றும் ‘வசப்படுத்துவாய்[b]’ என இணைக்கப்பட வேண்டும்.
