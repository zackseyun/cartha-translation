revisions:
- from: அப்போது அரசன் அவனிடம், “யெகோவாவின் பெயரில் உண்மையை மட்டுமே என்னிடம் சொல்வதாக நான் உன்னை எத்தனை முறை ஆணையிடச் செய்ய வேண்டும்?” என்றான்.
  to: அப்போது அரசன் அவனிடம், “யாவேயின் பெயரில் உண்மையை மட்டுமே என்னிடம் சொல்வேன் என்று உன்னை நான் எத்தனை முறை சத்தியம் செய்ய வைக்க வேண்டும்?” என்றான்.
  rationale: The revision corrects the central causative-oath meaning of מַשְׁבִּיעֶךָ with “சத்தியம் செய்ய வைக்க வேண்டும்.” It retains the Hebrew content clause and its exclusivity (“உண்மையை மட்டுமே”), preserves the direct question and exasperated tone, and renders יהוה as “யாவே” in line with the project’s Yahweh policy.
