id: 2CH.18.15
reference: 2 Chronicles 18:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּיעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: ta
  text: அப்போது அரசன் அவனிடம், “யாவேயின் பெயரில் உண்மையை மட்டுமே என்னிடம் சொல்வேன் என்று உன்னை நான் எத்தனை முறை சத்தியம் செய்ய வைக்க வேண்டும்?” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழில் நிகழ்வுத் தொடரை வெளிப்படுத்துகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: எபிரெய மூலத்தில் பெயருக்குப் பதிலாகத் திட்டவட்டமான பட்டமே உள்ளது; அதையே தமிழிலும் வைத்திருக்கிறது.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: எத்தனை முறை
  rationale: மீண்டும் மீண்டும் செய்ய வேண்டியதைக் குறித்த அரசனின் எரிச்சலை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: מַשְׁבִּיעֶךָ
  choice: நான் உன்னை ... ஆணையிடச் செய்ய வேண்டும்
  rationale: שבע என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஆணையிடச் செய்தல் அல்லது ஆணைக்குக் கட்டுப்படுத்துதல் என்று பொருள்படும்; தமிழ் சொற்றொடர் causative நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: உண்மையை மட்டுமே என்னிடம் சொல்வதாக
  rationale: ஆணையிடச் செய்தலைத் தொடர்ந்து வரும் எதிர்மறை அமைப்பும் רַק என்ற வரையறையும் சேர்ந்து ‘உண்மையைத் தவிர வேறொன்றும் சொல்லாதிருத்தல்’ என்பதைக் குறிக்கின்றன; தமிழில் ‘உண்மையை மட்டுமே’ என்பது இயல்பாக அதையே தருகிறது.
- source_word: בְּשֵׁם יְהוָה
  choice: யெகோவாவின் பெயரில்
  rationale: בְּשֵׁם என்பது பெயரின் அதிகாரத்திலும் சாட்சியிலும் பேசுவதைச் சுட்டுகிறது. יהוה என்ற தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல் ‘யெகோவா’ என ஒலிபெயர்த்துள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. ‘கர்த்தர்’ என்பது பெயரைப் பட்டமாக மாற்றிவிடும்; ‘யாவே’ மூல உச்சரிப்பை மீட்டுருவாக்கும் பரவலான வடிவம் என்றாலும், நவீனத் தமிழ் வேதாகம வாசகர்களுக்கு அறிமுகமான தனிப்பெயர் வடிவமாக ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது. துல்லியமான பண்டைய உச்சரிப்பு உறுதியல்ல.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ஆனால் சாதாரண வாசகருக்குப் புரியும் கதைநடை. மூலத்தின் கேள்வி வடிவமும் அரசனின் எரிச்சலும், ‘ஆணையிடச் செய்ய’ என்ற காரணவினை நுணுக்கமும் காக்கப்பட்டுள்ளன.
