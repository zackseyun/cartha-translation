translation:
  language: ta
  text: இஸ்ரவேலின் அரசனும் யூதாவின் அரசனான யோசபாத்தும் ராமோத்-கீலேயாத்துக்கு மேலே சென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: புறப்பட்டுச் சென்றார்கள்
  rationale: עלה என்பது சொற்பொருளில் ‘மேலே செல்லுதல்’ எனினும், இங்கு ஓர் இடத்தை நோக்கிய பயணத்தைச் சுட்டுகிறது. தமிழில் ‘மேலே சென்றார்கள்’ என்பது புவியியல் உயரத்தைத் தேவையின்றி வலியுறுத்தக்கூடும்; ‘புறப்பட்டுச் சென்றார்கள்’ இயல்பான நடையில் பயணச் செயலைத் தெரிவிக்கிறது, ஆனால் எபிரேயத்தில் வெளிப்படையாக இல்லாத ‘படையெடுத்துச் சென்றார்கள்’ என்ற இராணுவப் பொருளைச் சேர்க்கவில்லை.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: அறியப்பட்ட அரசரைக் குறிக்கும் எபிரேய அரச பட்டத்தை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: וִיהוֹשָׁפָט
  choice: யோசபாத்தும்
  rationale: וְ இணைப்பைத் தமிழ் இணைப்பு விகுதியான ‘-உம்’ மூலம் இயல்பாகக் காட்டி, יהושפט என்ற பெயரை வழக்கமான தமிழ் வடிவில் ஒலிபெயர்க்கிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனான
  rationale: யோசபாத்தை விளக்கும் இணைப்புப் பட்டத்தைத் தமிழில் தெளிவாக இணைக்க ‘அரசனான’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֶל
  choice: -க்கு
  rationale: இலக்கை நோக்கிய இயக்கத்தைத் தமிழ் வேற்றுமை உருபால் இயல்பாகக் குறிக்கிறது.
- source_word: רָמֹת גִּלְעָד
  choice: கீலேயாத்திலுள்ள ராமோத்
  rationale: இது கீலேயாத் பிரதேசத்திலுள்ள ராமோத் என்ற இடப்பெயர் என்பதைத் தமிழில் தெளிவுபடுத்துகிறது; இரு பெயர்க் கூறுகளும் ஒலிபெயர்க்கப்பட்டுள்ளன.
