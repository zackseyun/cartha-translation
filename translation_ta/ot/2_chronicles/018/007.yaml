  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் அரசன் யோசபாத்திடம், “இன்னும் ஒருவர் இருக்கிறார்; அவர் மூலம் யாவேவிடம் விசாரிக்கலாம். ஆனால் நான் அவனை வெறுக்கிறேன்; ஏனெனில் அவன் என்னைக் குறித்து நன்மையாகத் தீர்க்கதரிசனம் சொல்வதே இல்லை; எப்போதும் தீமையாகவே சொல்கிறான். அவன் இம்லாவின் மகன் மிகாயா” என்றான். அதற்கு யோசபாத், “அரசர் அப்படிச் சொல்ல வேண்டாம்” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֣וֹד אִישׁ אֶחָד
  choice: இன்னும் ஒருவன் இருக்கிறான்
  rationale: עֹוד אִישׁ אֶחָד என்பது ஆலோசிக்கக் கிடைக்கிற மேலும் ஒரே ஒருவரைச் சுட்டுகிறது; நவீன தமிழில் இயல்பாகவும் மூலத்தின் எண்ணிக்கைக் குறிப்பைத் தக்கவைத்தும் உள்ளது.
- source_word: לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: யாவேவிடம் விசாரிக்க
  rationale: தீர்க்கதரிசியின் வாயிலாக யாவேவிடம் வழிகாட்டுதல் கேட்பதைக் குறிக்கும். அடுத்த சொற்றொடரில் அந்த மனிதர் அடையாளப்படுத்தப்படுவதால், தமிழில் இடைநிலையாளரைக் கூடுதலாக வெளிப்படுத்தாமல் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַאֲנִי שְׂנֵאתִיהוּ
  choice: ஆனால் நான் அவனை வெறுக்கிறேன்
  rationale: வினை வடிவம் அரசனின் நிலையான தற்போதைய மனப்பான்மையை வெளிப்படுத்துகிறது; சூழலின் எதிர்மறைத் திருப்பை ‘ஆனால்’ இயல்பாகக் காட்டுகிறது.
- source_word: כִּי אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה
  choice: அவன் என்னைக் குறித்து நன்மையாகத் தீர்க்கதரிசனம் சொல்வதே இல்லை
  rationale: எதிர்மறையுடன் வரும் பங்கேற்பு வடிவத்தின் வழக்கமான, தொடர்ச்சியான செயல் நிழலை ‘சொல்வதே இல்லை’ வெளிப்படுத்துகிறது.
- source_word: כִּי כָל־יָמָיו לְרָעָה
  choice: தன் வாழ்நாள் முழுவதும் தீமையாகவே சொல்கிறான்
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய எல்லா நாட்களிலும் தீமைக்காக’ என்பதன் காலநீட்சி வலிமையைத் தக்கவைத்து, முந்தைய ‘தீர்க்கதரிசனம் சொல்’ என்ற வினையைத் தமிழில் இயல்பாக நிரப்புகிறது.
- source_word: מִיכָיְהוּ בֶן־יִמְלָא
  choice: இம்லாவின் மகன் மிகாயா
  rationale: எபிரெயப் பெயர்கள் தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டு, தந்தை வழி அடையாளம் முழுமையாகப் பாதுகாக்கப்படுகிறது.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: அரசர் அப்படிச் சொல்ல வேண்டாம்
  rationale: אַל + முற்றுப்பெறா வினையின் தடைப் பொருளையும், யோசபாத் மற்றொரு அரசனை மரியாதையுடன் மறுத்துரைக்கும் மறைமுக நடையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தெய்வீகத் தனிப்பெயர் நேரடியாக உள்ளது. அதைப் பட்டப்பெயரால் மாற்றாமல், பரவலாக ஏற்கப்பட்ட ஒலிப்புக்கு அண்மையாக ‘யாவே’ என்று தருவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ‘நன்மை’ மற்றும் ‘தீமை’ என்பவற்றின் பொருள்
  choice: நன்மையாக / தீமையாக
  alternative: சாதகமாக / பாதகமாக
  rationale: טוֹבָה மற்றும் רָעָה என்பவற்றின் பரந்த நெறி மற்றும் நிகழ்வு சார்ந்த பதற்றத்தைத் தீர்மானித்து விடாமல் பாதுகாக்கிறது; அரசன் அவற்றைத் தனக்குச் சாதகமான அல்லது பாதகமான தீர்க்கதரிசனங்களாகப் புரிந்துகொள்வது சூழலிலிருந்து வெளிப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவைக் காட்சிக்கேற்ற மரியாதையும் கண்ணியமும் உள்ளதாயினும் பொதுவாசகருக்கு எளிதான நடை. உரையாடலில் பேச்சாளரின் நேரடி, குற்றஞ்சாட்டும் தொனி பாதுகாக்கப்பட்டுள்ளது.
