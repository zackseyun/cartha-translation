translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் உள்ள அரசுப் பதவிகளின் தெளிவின்மை அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது; ஆகாப் என்ற பெயர் சூழலிலிருந்து தெரிந்தாலும் உரையில் சேர்க்கப்படவில்லை.
