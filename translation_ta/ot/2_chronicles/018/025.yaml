  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל קְחוּ֙ אֶת מִיכָ֔יְהוּ וַ/הֲשִׁיבֻ֖/הוּ אֶל אָמ֣וֹן שַׂר הָ/עִ֑יר וְ/אֶל יוֹאָ֖שׁ בֶּן הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/025.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் அரசன், “மிகாயாவை அழைத்துக்கொண்டு, அவனை நகரத்தின் அதிகாரியான[a] ஆமோனிடமும் அரசனின் மகனான யோவாசிடமும் மீண்டும் கொண்டு செல்லுங்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்தின் தளபதி.” இதற்கான எபிரெயப் பதம் குடியாட்சி அதிகாரியையோ இராணுவத் தளபதியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; ‘அப்போது’ இயல்பான தமிழ் கதைநடையில் அந்த வரிசையை வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: எபிரெய மூலத்திலுள்ள பட்டத்தையே மொழிபெயர்க்கிறது; சூழலில் ஆகாபைக் குறித்தாலும், அவரது பெயரை உரைக்குள் சேர்க்கவில்லை.
- source_word: קְחוּ
  choice: பிடித்து
  rationale: לקח என்பதன் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்ளுங்கள்/கொண்டு செல்லுங்கள்.’ இங்கு காவலில் உள்ள மிகாயாவைக் கொண்டு செல்லும் கட்டளை என்பதால் ‘பிடித்து’ இயல்பாக உள்ளது; ‘கைதுசெய்து’ என்பது மூலத்தைவிட அதிகமாக விளக்கும்.
- source_word: מִיכָיְהוּ
  choice: மிகாயா
  rationale: தமிழில் வழக்கமான வேதாகமப் பெயர் வடிவம்.
- source_word: וַהֲשִׁיבֻהוּ
  choice: திரும்பக் கொண்டுபோங்கள்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் ஒருவரைத் திரும்பச் செல்லச் செய்வதைக் குறிக்கிறது; தமிழ் வழக்கில் இச்சொற்றொடர் அந்த causative பொருளைத் தெளிவாகத் தருகிறது.
- source_word: שַׂר הָעִיר
  choice: நகரத்தின் அதிகாரி
  rationale: שַׂר என்பது ஆட்சியாளர், அதிகாரி அல்லது தளபதி ஆகிய பொருள்களைக் கொள்ளலாம். பதவியின் நிர்வாக அல்லது இராணுவ இயல்பை மூலவசனம் தீர்மானிக்காததால், ‘அதிகாரி’ என்பது மிகக் குறைவாகத் தீர்மானிக்கும் இயல்பான தேர்வு.
- source_word: וְאֶל יוֹאָשׁ
  choice: யோவாசிடமும்
  rationale: மீண்டும் வரும் אֶל இரண்டாவது நபரையும் இலக்காகக் காட்டுகிறது; ‘-இடமும்’ அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בֶּן הַמֶּלֶךְ
  choice: அரசனின் மகன்
  rationale: உறவுமுறையைச் சொல்லும் எபிரெய சொற்றொடரை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது; ‘இளவரசன்’ என்று மொழிபெயர்ப்பது கூடுதல் பதவிப் பொருளைச் சேர்க்கும்.
