  yaml_path: translation/ot/2_chronicles/018/001.yaml
  text: Jehoshaphat had great wealth and honor[a], and he allied himself by marriage with Ahab.
translation:
  language: ta
  text: யோசபாத்துக்கு மிகுந்த செல்வமும் கௌரவமும் இருந்தன; அவர் ஆகாபுடன் திருமண உறவை ஏற்படுத்திக்கொண்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் திருமணத்தின் மூலம் ஆகாபுடன் உறவினரானார்”; அல்லது, “அவர் ஆகாபுடன் திருமணக் கூட்டணி ஏற்படுத்திக்கொண்டார்.”
    reason: וַיִּתְחַתֵּן என்பதன் குடும்பத் தொடர்பு மற்றும் வம்ச/அரசியல் கூட்டணி ஆகிய இரு நெருங்கிய பொருள் நிழல்களையும் காட்டும் மொழிபெயர்ப்பு மாற்றுகள்.
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தன
  rationale: היה என்பதன் தொடர்கதை வடிவம் இங்கு புதிய நிகழ்வை அறிமுகப்படுத்துகிறது. தமிழில் தேவையற்ற ‘அப்போது’ அல்லது ‘இப்படி நடந்தது’ என்பவற்றைச் சேர்க்காமல் இயல்பான இறந்தகால வாக்கியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: לִיהוֹשָׁפָט
  choice: யோசபாத்துக்கு
  rationale: எபிரெயப் பெயர் நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவத்தில் தரப்பட்டது; לְ உடைமைப் பொருளை ‘-க்கு ... இருந்தன’ என்ற இயல்பான தமிழ் அமைப்பு வெளிப்படுத்துகிறது.
- source_word: עֹשֶׁר
  choice: செல்வம்
  rationale: இச்சொல் பொருளாதார வளத்தைக் குறிக்கிறது; ‘செல்வம்’ தெளிவான, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: וְכָבוֹד
  choice: மதிப்பு
  rationale: அரச மற்றும் சமூகச் சூழலில் כָּבוֹד என்பது காணக்கூடிய தெய்வீக மகிமையைவிட அந்தஸ்து, கண்ணியம், பெருமதிப்பு ஆகியவற்றைக் குறிக்கிறது. இங்கு ‘மதிப்பு’ பொருத்தமானது.
- source_word: לָרֹב
  choice: ஏராளமான ... மிகுந்த
  rationale: இச்சொற்றொடர் செல்வமும் மதிப்பும் பெருமளவில் இருந்ததைச் சொல்கிறது. இரண்டு பெயர்ச்சொற்களுடனும் இயல்பாக இணைய தமிழில் ‘ஏராளமான’ மற்றும் ‘மிகுந்த’ என்று வெளிப்படுத்தப்பட்டது.
- source_word: וַיִּתְחַתֵּן
  choice: திருமண உறவை ஏற்படுத்திக்கொண்டார்
  rationale: חתן என்பதன் ஹித்பாயேல் வடிவம் இங்கு யோசபாத் தாமே ஆகாபை மணந்தார் என்று கூறாமல், திருமணத்தின் வழியாக இரு குடும்பங்களுக்கிடையே உறவு உருவானதைக் குறிக்கிறது. தேர்ந்தெடுத்த மொழிபெயர்ப்பு அந்த குடும்ப/அரசியல் பொருளைத் தெளிவாகவும் மிகையாகக் குறிப்பாக்காமலும் தருகிறது.
- source_word: לְאַחְאָב
  choice: ஆகாபுடன்
  rationale: உறவு ஏற்படுத்துவதைச் சொல்லும் தமிழ் வழக்கில் ‘-உடன்’ என்பது எபிரெய לְ இன் தொடர்புப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיִּתְחַתֵּן לְאַחְאָב என்பதில் யோசபாத்துக்கும் ஆகாபுக்கும் ஏற்பட்ட உறவின் தன்மை
  choice: அவர் ஆகாபுடன் திருமண உறவை ஏற்படுத்திக்கொண்டார்
  alternative: அவர் திருமணத்தின் மூலம் ஆகாபுக்கு உறவினரானார்; அவர் ஆகாபுடன் திருமணக் கூட்டணி ஏற்படுத்திக்கொண்டார்
  rationale: வசனம் வம்ச/அரசியல் நோக்கமுள்ள திருமணத் தொடர்பைக் குறிப்பிடுகிறது; யோசபாத் தனிப்பட்ட முறையில் ஆகாபை மணந்தார் என்று கூறவில்லை. முதன்மை உரை குடும்ப ஏற்பாட்டின் துல்லியமான வடிவத்தை நிர்ணயிக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியக்கூடிய, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத காலக் குறியீட்டைத் தொடக்கத்தில் சேர்க்கவில்லை. முதன்மை உரை திருமணத் தொடர்பைத் தெளிவுபடுத்தினாலும், எந்தக் குடும்ப உறுப்பினர் யாரை மணந்தார் என்பதை ஊகித்து நிரப்பவில்லை.
