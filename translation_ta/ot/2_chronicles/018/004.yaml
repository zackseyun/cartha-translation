source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/004.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: ta
  text: யோசபாத் இஸ்ரவேலின் அரசனிடம், “தயவுசெய்து இன்று யாவேயின் வார்த்தையை விசாரித்தறியுங்கள்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயிடமிருந்து ஒரு வார்த்தையைக் கேட்டறியுங்கள்.”
    reason: ‘யாவேயின் வார்த்தை’ என்ற எபிரேயச் சொற்றொடர் இச்சூழலில் யாவேயிடமிருந்து ஓர் அறிவிப்பை நாடுவதைச் சுட்டலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: எபிரேயக் கதைநடையின் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தனியாக ‘அப்போது’ அல்லது ‘மேலும்’ சேர்த்து காலத்தொடர்பை மிகையாக விளக்கவில்லை.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கம்.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனிடம்
  rationale: அரசப் பட்டத்தைத் தெளிவாகப் பேணும் இயல்பான தமிழ் வடிவம்.
- source_word: דְּרָשׁ
  choice: விசாரியுங்கள்
  rationale: இச்சூழலில் கடவுளிடமிருந்து தீர்க்கதரிசன வழிகாட்டுதலை நாடுதல் அல்லது கேட்டறிதல் என்ற பொருளைத் தருகிறது.
- source_word: נָא
  choice: தயவுசெய்து
  rationale: கட்டளையை வேண்டுகோளாக மென்மைப்படுத்தும் எபிரேயத் துகளின் பணியை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַיּוֹם
  choice: இன்றே
  rationale: உடனடியாக, இந்த நாளிலேயே விசாரிக்க வேண்டும் என்ற வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֶת דְּבַר יְהוָה
  choice: யெகோவாவின் வார்த்தையை
  rationale: தீர்க்கதரிசனச் சூழலுக்குரிய ‘யெகோவாவின் வார்த்தை’ என்ற சொல்லமைப்பைப் பேணுகிறது. ‘யெகோவாவிடமிருந்து ஒரு வார்த்தையை’ என்பதும் சூழலுக்கு ஏற்ற சாத்தியமான புரிதல்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்றுள்ள பெயரெழுத்தாக்கத்தில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தெய்வீகப் பெயரே நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ போன்ற பட்டமாக மாற்றாமல் பெயராகவே வழங்குகிறது; ‘யெகோவா’ என்பது தமிழில் பரவலாக அறியப்படும் வடிவம்.
- issue: דְּבַר יְהוָה என்பதன் குறிப்புத்தன்மை
  choice: யெகோவாவின் வார்த்தையை
  alternative: யெகோவாவிடமிருந்து ஒரு வார்த்தையை
  rationale: எபிரேயக் கட்டமைப்பை நெருக்கமாகப் பேணி, வழக்கமான தீர்க்கதரிசனச் சொற்றொடரை வழங்குகிறது; இருப்பினும் இச்சூழலில் குறிப்பிட்ட ஓர் அறிவிப்பை வேண்டுதல் என்ற மாற்றுப் புரிதலும் சாத்தியம்.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையான வேண்டுகோள் நடையும், வேதாகமக் கதைநடைக்கேற்ற கண்ணியமும் பேணப்பட்டுள்ளன. ‘இன்றே’ உடனடித் தன்மையை இயல்பாகக் காட்டுகிறது; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
