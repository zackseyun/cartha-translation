source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/ר֗וּחַ וַֽ/יַּעֲמֹד֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יֹּ֖אמֶר אֲנִ֣י אֲפַתֶּ֑/נּוּ וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו בַּ/מָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
translation:
  language: ta
  text: அப்போது அந்த ஆவி முன்வந்து, யாவேக்கு முன்பாக நின்று, “நான் அவனைத் தூண்டுவேன்[a]” என்றது. யாவே அதனிடம், “எதன் மூலம்?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அவனை இணங்க வைப்பேன்,” அல்லது “நான் அவனை ஏமாற்றுவேன்.” எபிரெய வினைச்சொல் சூழலைப் பொறுத்து தூண்டுதல், இணங்க வைத்தல், அல்லது ஏமாற்றுதல் என்ற பொருள்களைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: அந்த ஆவி
  rationale: விண்ணுலக அவைக் காட்சியில் இது முன்வருதல், நிற்றல், பேசுதல் போன்ற தனிப்பட்ட செயல்களைச் செய்வதால், ‘காற்று’ அல்லது ‘மூச்சு’ என்பதைக் காட்டிலும் ‘ஆவி’ சூழலுக்கு ஏற்றது. எபிரெயச் சொல்லிலுள்ள குறிப்பு உருபை ‘அந்த’ வெளிப்படுத்துகிறது.
- source_word: וַיֵּצֵא
  choice: முன்வந்து
  rationale: அடிப்படையில் ‘வெளியே சென்றது/வந்தது’ என்றாலும், அவையில் யாவேக்கு முன் தன்னை முன்வைக்கும் இயக்கத்தை இயல்பான தமிழில் ‘முன்வந்து’ தெளிவாகக் காட்டுகிறது.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: முன்பாக நின்று
  rationale: ஒருவரது முன்னிலையில் சேவை அல்லது அறிமுகத்திற்காக நிற்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரின் முறையான தன்மையை இது காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழுக்கு ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֲפַתֶּנּוּ
  choice: நான் அவனை இணங்கச் செய்வேன்
  rationale: פָּתָה வினையின் பியேல் வடிவம் சூழலைப் பொறுத்து இணங்கச் செய்தல், வசப்படுத்துதல் அல்லது ஏமாற்றுதல் எனப் பொருள்படலாம். அடுத்த வசனத்திற்கு முன்பே ஏமாற்றும் முறையைத் தீர்மானித்துவிடாமல், இவ்வசனத்தின் தெளிவின்மையையும் பதற்றத்தையும் ‘இணங்கச் செய்வேன்’ காக்கிறது.
- source_word: בַּמָּה
  choice: எதன் மூலம்?
  rationale: செயலை நிறைவேற்றும் முறை அல்லது சாதனத்தை விசாரிக்கும் கேள்வியாக இருப்பதால், ‘எப்படி?’ என்பதைவிட ‘எதன் மூலம்?’ மூலத்தின் நுணுக்கத்தைத் துல்லியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: தெய்வீக அவைக் காட்சியில் פתה என்பதன் அற மற்றும் இறையியல் நுணுக்கம்
  choice: இணங்கச் செய்வேன்
  alternative: வசப்படுத்துவேன்; ஏமாற்றுவேன்
  rationale: ஆவி முன்வைக்கும் செயலை இவ்வசனம் கூறினாலும், அதன் துல்லியமான வழிமுறையை அடுத்த வசனமே விளக்குகிறது. ஆகவே ‘ஏமாற்றுவேன்’ என்று இங்கேயே பொருளை முழுமையாகத் தீர்மானிக்காமல், மூலத்தின் பலபொருள் தன்மையும் இறையியல் பதற்றமும் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. விண்ணுலக அவையின் முறையான காட்சியை ‘முன்வந்து’, ‘முன்பாக நின்று’ என்பவை காக்கின்றன. ஆவிக்குப் பாலினம் குறிக்காத ‘அது/அதனிடம்’ சார்ந்த இலக்கணத் தேர்வு பயன்படுத்தப்பட்டுள்ளது; நேரடி உரை தெளிவாகப் பிரிக்கப்பட்டுள்ளது.
