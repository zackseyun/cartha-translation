source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפוֹצִ֣ים עַל הֶֽ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ן רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: ta
  text: 'அவன் சொன்னான்: “மேய்ப்பன் இல்லாத ஆடுகளைப்போல் இஸ்ரயேலர் அனைவரும் மலைகளில் சிதறிக்கிடப்பதை நான் கண்டேன். அப்போது யாவே, ‘இவர்களுக்கு எஜமானர்கள்[a] இல்லை; ஒவ்வொருவனும் தன் வீட்டுக்குச் சமாதானத்துடன் திரும்பிப் போகட்டும்’ என்றார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எஜமானர்கள்” என்பது எபிரேயத்தில் பன்மை; சில மொழிபெயர்ப்புகள் கூட்டுப்பொருளைக் கருத்தில் கொண்டு “எஜமான்” என்று ஒருமையில் தருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפוֹצִים
  choice: சிதறிக்கிடப்பதை
  rationale: போர் தோல்விக்குப் பின் மக்கள் பிரிந்து பரவியிருக்கும் நிலையையும், மேய்ப்பனில்லாத ஆடுகள் என்ற உருவகத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל הֶהָרִים
  choice: மலைகளில்
  rationale: எபிரேய இடவுருபின் பொருளை இயல்பான நவீன தமிழில் தருகிறது; ‘மலைகளின்மேல்’ என்பது இங்கு தேவையற்ற சொல்லுக்குச்சொல் நடையாக இருக்கும்.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  choice: மேய்ப்பன் இல்லாத ஆடுகளைப்போல்
  rationale: ஒப்புமையை முழுமையாகப் பாதுகாத்து, தமிழில் சுருக்கமாகவும் இயல்பாகவும் ஒலிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  choice: இவர்களுக்கு எஜமானர்கள் இல்லை
  rationale: אֲדֹנִים என்பதன் பன்மை வடிவத்தைப் பாதுகாக்கிறது; சூழலில் இது இறைவனுக்கான பட்டமல்ல, ஆட்சித் தலைமையைக் குறிக்கிறது.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: ஒவ்வொருவனும் தன் வீட்டுக்குத் திரும்பிப் போகட்டும்
  rationale: אִישׁ என்பதன் பகிர்ந்தளிக்கும் ஆண்பால் வடிவத்தையும், வினையின் வேண்டுகோள்/அனுமதி சார்ந்த ஆணை வலிமையையும் பிரதிபலிக்கிறது.
- source_word: בְּשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: பாதுகாப்பாகவும் எந்தத் தீங்கும் இன்றியும் திரும்புதல் என்ற எபிரேயச் சொல்லின் விரிந்த பொருளை, பழக்கமான வேதாகமத் தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக இருப்பதால், அதை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: אֲדֹנִים என்பதன் எண்ணும் பொருளும்
  choice: எஜமானர்கள்
  alternative: எஜமான்
  rationale: எபிரேயச் சொல் இலக்கணத்தில் பன்மையாக உள்ளது. இங்கு ராஜா இறந்த பின் மக்கள் ஆட்சித் தலைமையின்றி இருப்பதே கருத்து; பன்மையை ஒருமையாக்கி மறைத்துவிடாமல் அடிக்குறிப்புடன் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய உருவகமும் இறைத் திருப்பெயரும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற பழந்தமிழ் அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
