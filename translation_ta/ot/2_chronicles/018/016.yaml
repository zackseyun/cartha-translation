  terminology: “யாவே” மூலத்தில் உள்ள தனிப்பட்ட இறைநாமத்தைப் பாதுகாக்கிறது. “எஜமானர்கள்” இங்கு இறையியல் பட்டமாக அல்லாமல் அரசியல்/படைத்தலைமை இல்லாமையைக் குறிக்கும் வகையில் உள்ளது; அடிக்குறிப்பு மாற்று ஒருமை வாசிப்பைச் சரியாக விளக்குகிறது.
