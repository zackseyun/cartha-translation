  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִאִים֮ אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן הָ/אֱלֹהִ֖ים בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
translation:
  language: ta
  text: இஸ்ரவேலின் அரசன் நானூறு ஆண்களாகிய இறைவாக்கினர்களை ஒன்றுகூட்டி அவர்களிடம், “நாம் ராமோத்-கிலேயாத்துக்குப் போருக்குச் செல்லலாமா, அல்லது நான் விலகியிருக்க வேண்டுமா?” என்று கேட்டான். அதற்கு அவர்கள், “செல்லுங்கள்; கடவுள் அதை அரசனின் கையில்[a][b] கொடுப்பார்” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அரசனின் கையில் கொடுப்பார்’ என்பது அதை அரசனின் அதிகாரத்திற்குள் அல்லது கட்டுப்பாட்டிற்குள் ஒப்படைப்பார் என்னும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரை ‘உங்கள் கையில்’ என்று கூறாமல், எந்த அரசன் என்பதை மேலும் குறிப்பிடாது ‘அரசனின் கையில்’ என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ஒன்றுகூட்டி
  rationale: קבץ என்பதன் ‘ஒன்றாகக் கூட்டுதல்’ என்ற செயற்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הַנְּבִאִים
  choice: இறைவாக்கினர்கள்
  rationale: נביאים என்பதன் வழக்கமான சமயப் பொருளைத் தருகிறது; எதிர்காலத்தை முன்னறிவிப்பவர்கள் என்று மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: אַרְבַּע מֵאוֹת אִישׁ
  choice: நானூறு இறைவாக்கினர்கள்
  rationale: எபிரெய உரையில் எண்ணிக்கைக்குப் பின் אִישׁ இருந்தாலும், தமிழில் ‘நானூறு ஆண்களான இறைவாக்கினர்கள்’ என்பது தேவையற்ற விறைப்பை உண்டாக்கும்; மனிதர்களைக் குறிக்கும் எண்ணிக்கை தெளிவாகவே உள்ளது.
- source_word: הֲנֵלֵךְ
  choice: நாம் ... செல்லலாமா
  rationale: முதல் நபர் பன்மை வினாவைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: רָמֹת גִּלְעָד
  choice: ராமோத்-கிலேயாத்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; கூட்டு இடப்பெயரின் இரு பகுதிகளும் இணைப்புக்கோட்டுடன் வைக்கப்பட்டுள்ளன.
- source_word: לַמִּלְחָמָה
  choice: போருக்குச்
  rationale: நோக்கத்தைக் குறிக்கும் எபிரெய முன்னொட்டையும் ‘போர்’ என்ற பெயர்ச்சொல்லையும் இயல்பான தமிழில் தருகிறது.
- source_word: אִם אֶחְדָּל
  choice: அல்லது நான் விலகியிருக்க வேண்டுமா
  rationale: முந்தைய பன்மை ‘நாம்’ என்பதிலிருந்து ஒருமை ‘நான்’ என்பதற்கு மூலத்தில் ஏற்படும் மாற்றத்தை இணக்கப்படுத்தாமல் பாதுகாக்கிறது. חדל என்பதன் செயலை நிறுத்துதல்/விலகியிருத்தல் என்ற பொருளையும் தருகிறது.
- source_word: עֲלֵה
  choice: செல்லுங்கள்
  rationale: עלה என்பதன் அடிப்படை நகர்வுப் பொருளைத் தருகிறது. தமிழில் ‘மேலே செல்லுங்கள்’ இச்சூழலில் இயல்பற்ற நிலத்தோற்றக் குறிப்பாகப் புரியக்கூடும்; ‘படையெடுங்கள்’ என்பது மூலத்தைவிட வெளிப்படையான இராணுவப் பொருளைச் சேர்க்கும்.
- source_word: וְיִתֵּן
  choice: கொடுப்பார்
  rationale: נתן என்பதன் நேரடியான பொருளைப் பாதுகாக்கிறது; தமிழில் மறைமுகமாக உள்ள பொருளை ‘அதை’ என்று வெளிப்படுத்துவது வாக்கியத் தெளிவுக்கு அவசியம்.
- source_word: הָאֱלֹהִים
  choice: கடவுள்
  rationale: אֱלֹהִים வடிவில் பன்மையாகத் தோன்றினாலும், அதனுடன் வரும் יִתֵּן ஒருமை வினை; ஆகவே இங்கு ஒருமைத் தெய்வக் குறிப்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: அரசனின் கையில்
  rationale: எபிரெய உருவகத்தைத் தமிழிலும் புரியக்கூடிய வகையில் நேரடியாகப் பாதுகாக்கிறது; அதன் அதிகாரம்/கட்டுப்பாடு சார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: இறைவாக்கினர்களின் பதிலில் ‘அரசன்’ என்பவர் யார்?
  choice: எபிரெயில் உள்ளபடியே ‘அரசன்’ என்று மட்டும் குறிப்பிடுதல்
  alternative: ‘உங்கள் கையில்’ என்றோ ‘இஸ்ரவேல் அரசனின் கையில்’ என்றோ வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: மூல உரை בְּיַד הַמֶּלֶךְ, ‘அரசனின் கையில்’ என்றே கூறுகிறது. இணையான 1 இராஜாக்கள் 22:6-இன் வாசகத்தை இறக்குமதி செய்தோ, சூழலின் அடிப்படையில் சுட்டுப்பெயரை மாற்றியோ தெளிவுபடுத்தாமல், மூலத்தின் குறிப்பிடாமையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. அரசனின் கேள்வியில் உள்ள ‘நாம்’ என்பதிலிருந்து ‘நான்’ என்பதற்கான திடீர் மாற்றமும், பதிலில் ‘அரசன்’ என்பவரின் குறிப்பிடப்படாத அடையாளமும் பாதுகாக்கப்பட்டுள்ளன. ‘இறைவாக்கினர்கள்’ என்பது נביאים என்பதைக் ‘எதிர்காலம் கூறுவோர்’ என்ற பொருளுக்குள் மட்டும் கட்டுப்படுத்தாமல் வழங்குகிறது.
