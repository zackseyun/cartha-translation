  terminology: ‘தேரோட்டி,’ ‘மார்புக்கவசம்,’ ‘கவச இணைப்புகள்’ ஆகியவை பொருத்தமானவை. דְּבָקִים என்பதன் குறிப்பான கவசப் பொருள் நிச்சயமற்றதால், முதன்மை உரையில் பொதுவான சொல்லும் அடிக்குறிப்பில் மாற்றுப் புரிதலும் வழங்கப்படுவது சரியானது. ‘போர்க்களத்திலிருந்து’ என்பது מַחֲנֶה என்பதன் போர்ச்சூழல் பொருளைத் தருகிறது.
