translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘குறிபார்க்காமல்’ என்ற சொல் நிகழ்வின் தற்செயலான தன்மையை வெளிப்படுத்துகிறது; கவசப் பதங்களின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. நேரடி உரையில் எபிரெய மொழியின் ‘உன் கையைத் திருப்பி’ என்ற உருவகம் வைக்கப்பட்டு அதன் செயல்பாட்டு பொருள் விளக்கப்பட்டுள்ளது.
