  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּךְ֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לָֽ/רַכָּ֗ב הֲפֹ֧ךְ ידי/ך וְ/הוֹצֵאתַ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
translation:
  language: ta
  text: ஆனால் ஒருவன் குறிபார்க்காமல் தன் வில்லை இழுத்து அம்பு எய்தான்[a]. அந்த அம்பு இஸ்ரவேலின் அரசனுடைய கவச இணைப்புகளுக்கும் மார்புக்கவசத்துக்கும் இடையில் தாக்கியது[b]. அப்போது அரசன் தேரோட்டியிடம், “உன் கையைத் திருப்பி[c], என்னைப் போர்க்களத்திலிருந்து வெளியே கொண்டுபோ; ஏனெனில் நான் காயமடைந்துவிட்டேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தற்செயலாக’ அல்லது ‘தன் கபடமின்மையில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் எளிமை அல்லது கபடமின்மையைக் குறிக்கக்கூடும்; இப்போர்ச் சூழலில், குறிப்பிட்ட இலக்கைக் குறிவைக்காமல் அம்பெய்தியதையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கவசத் தகடுகளுக்கும் மார்புக்கவசத்துக்கும் இடையில்’ என்றும் பொருள் கொள்ளலாம். இங்குள்ள பழங்காலக் கவசப் பதங்களின் துல்லியமான பொருள் உறுதியற்றது; அம்பு கவசத்தின் இடைவெளியில் புகுந்தது என்பதே கருத்து.
    reason: cultural_note
  - marker: c
    text: சொல்லர்த்தமாக, ‘உன் கையைத் திருப்பு.’ இது தேரைத் திருப்பி, போர் நடக்கும் இடத்திலிருந்து விலக்கிச் செலுத்துவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: ஆனால் ஒருவன்
  rationale: וְ தொடர் நிகழ்வை அறிமுகப்படுத்துகிறது; முந்தைய போர்ச் சூழலில் ஏற்பட்ட திடீர் திருப்பத்தைத் தமிழில் இயல்பாகக் காட்ட ‘ஆனால்’ பயன்படுத்தப்பட்டது. אִישׁ குறிப்பிட்ட பெயரில்லாத ஒருவனைக் குறிக்கிறது.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: வில்லை எய்தான்
  rationale: எபிரெயச் சொற்றொடர் வில்லை இழுத்துப் பயன்படுத்துவதைக் குறிக்கிறது; அடுத்ததாக அம்பு தாக்கியதாக வருவதால், நவீன தமிழில் ‘வில்லை எய்தான்’ என்பது இயல்பான போரியல் வெளிப்பாடு.
- source_word: לְתֻמּוֹ
  choice: குறிபார்க்காமல்
  rationale: இந்தச் சொல் நேர்மை, கபடமின்மை அல்லது எளிமை என்ற நிழற்பொருள்களைக் கொண்டிருக்கலாம். இப்போர்ச் சூழலில் குறிப்பிட்ட இலக்கை நோக்காமல் அம்பெய்தியதையே பெரும்பாலும் குறிக்கிறது; ‘குறிபார்க்காமல்’ அந்தக் கருத்தைத் தெளிவாகவும் அளவுக்கு மீறாமல்வும் தருகிறது.
- source_word: וַיַּךְ
  choice: தாக்கியது
  rationale: נכה என்பது அடித்தல் அல்லது தாக்குதல் என்று பொருள்படும். காயத்தின் விளைவு வசனத்தின் முடிவில் தனியாகச் சொல்லப்படுவதால், இங்கு ‘தாக்கியது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: கவச இணைப்புகளுக்கும் மார்புக்கவசத்துக்கும் இடையில்
  rationale: இந்தப் பதங்கள் கவசத்தின் இரண்டு பகுதிகளுக்கு இடையிலிருந்த பாதுகாப்பற்ற இடத்தைக் குறிக்கின்றன. דְּבָקִים என்பதன் துல்லியமான போர்க்கவசப் பொருள் உறுதியற்றதால், ‘கவச இணைப்புகள்’ எனப் பொதுவாக மொழிபெயர்த்து மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: לָרַכָּב
  choice: தேரோட்டியிடம்
  rationale: இங்கு பெயர்ச்சொல் தேரை ஓட்டுபவனைக் குறிக்கிறது; ‘தேரோட்டி’ என்பது சுருக்கமான, இயல்பான நவீன தமிழ்ச் சொல்.
- source_word: הֲפֹךְ יָדֶיךָ
  choice: உன் கையைத் திருப்பி
  rationale: எபிரெய உருவகத்தை நேரடியாகப் பாதுகாக்கிறது. சூழலில் இது தேரைத் திருப்புவது அல்லது போர் நடக்கும் இடத்திலிருந்து அதை விலக்கிச் செலுத்துவது என்று பொருள்படுகிறது; விளக்கம் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: וְהוֹצֵאתַנִי מִן הַמַּחֲנֶה
  choice: என்னைப் போர்க்களத்திலிருந்து வெளியே கொண்டுபோ
  rationale: מַחֲנֶה என்பது பாசறை, படை அல்லது படை நிற்கும் இடம் என்று பொருள்படலாம். இங்கு அரசன் போரின் நடுவிலிருந்து அகற்றப்பட வேண்டுமென்று கூறுவதால், ‘போர்க்களத்திலிருந்து’ என்பது சூழலுக்கேற்ற இயல்பான மொழிபெயர்ப்பு.
- source_word: כִּי הָחֳלֵיתִי
  choice: ஏனெனில் நான் காயமடைந்துவிட்டேன்
  rationale: இந்த வினை பொதுவாக நோயுறுதல் அல்லது பலவீனமடைதல் என்றாலும், அம்பு தாக்கிய உடனடியான சூழலில் காயமடைதலைக் குறிக்கிறது. மூலத்தில் வெளிப்படையாக இல்லாத தீவிரத்தைச் சேர்க்காமல் ‘காயமடைந்துவிட்டேன்’ எனத் தரப்பட்டது.
