source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם לְ/רָֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/017.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் அரசன் யோசபாத்திடம், “அவன் என்னைக் குறித்து நன்மையைத் தீர்க்கதரிசனமாகச் சொல்லாமல், தீமையையே தீர்க்கதரிசனமாகச் சொல்வான் என்று நான் உம்மிடம் சொல்லவில்லையா?” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவன் என்னைக் குறித்து நல்லது எதையும் தீர்க்கதரிசனமாகச் சொல்லாமல், பேரழிவையே தீர்க்கதரிசனமாகச் சொல்வான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: ரா (רָע) என்பது இச்சூழலில் ஒழுக்கத் ‘தீமை’ என்பதை மட்டும் அல்லாமல், பாதகமான முடிவு அல்லது பேரழிவையும் குறிக்கக்கூடும்; தோவ் (טוֹב) என்பதும் ‘நல்லது எதையும்’ என விரிவாக அமையலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அப்போது ... என்றான்
  rationale: வாவ் தொடர்வினை கதையின் அடுத்த நிகழ்வை முன்னெடுக்கிறது; நவீனத் தமிழில் இயல்பான கதைத் தொடரை இது தருகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: אֶל יְהוֹשָׁפָט
  choice: யோசபாத்திடம்
  rationale: பேச்சு யாரை நோக்கிச் சொல்லப்பட்டது என்பதை இயல்பான தமிழில் குறிக்கிறது; மூலத்தில் இல்லாத அரசப் பட்டம் சேர்க்கப்படவில்லை.
- source_word: הֲלֹא אָמַרְתִּי אֵלֶיךָ
  choice: நான் உம்மிடம் சொல்லவில்லையா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எதிர்மறை வினாவின் வலிமையையும், கடந்தகாலக் குறிப்பையும் காக்கிறது.
- source_word: לֹא יִתְנַבֵּא
  choice: தீர்க்கதரிசனமாகச் சொல்லாமல்
  rationale: מִתְנַבֵּא என்பதன் தீர்க்கதரிசனச் செயலை வெளிப்படையாகக் காக்கிறது; தொடரும் எதிர்மறை-விதிவிலக்கு அமைப்புடன் இயல்பாக இணைகிறது.
- source_word: עָלַי
  choice: என்னைக் குறித்து
  rationale: இங்கு עַל பொருள் அல்லது தொடர்பைக் குறிக்கிறது; பயனுக்காக என்ற தவறான நுண்ணுணர்வைத் தவிர்க்கிறது.
- source_word: טוֹב
  choice: நன்மையானதை
  rationale: பெயர்ச்சொல் போலப் பயன்படும் உரிச்சொல்லைத் தமிழில் இயல்பாகக் காட்டி, எதிர்ச் சொல்லுடனான இணைப்பைத் தக்கவைக்கிறது.
- source_word: כִּי אִם
  choice: '...ஆமல், ...யையே'
  rationale: ‘அல்லாமல், மட்டுமே’ என்ற வலுவான விதிவிலக்கு/எதிர்மறை அமைப்பை இயல்பான தமிழ் வாக்கிய வடிவில் வெளிப்படுத்துகிறது.
- source_word: לְרָע
  choice: தீமையானதையே
  rationale: טוֹב / רָע என்ற மூலமொழியின் ‘நன்மை / தீமை’ எதிரிணையைப் பாதுகாக்கிறது; சூழலில் இது அரசனுக்குப் பாதகமான செய்தியைக் குறிக்கிறது.
theological_decisions:
- issue: முன்னறிவிக்கப்பட்ட செய்தியின் இயல்பு
  choice: ‘நன்மையானது ... தீமையானதே’ என்ற எதிரிணை தக்கவைக்கப்பட்டது.
  alternative: ‘நல்ல செய்தி ... பேரழிவு’ அல்லது ‘சாதகமானது ... பாதகமானது’
  rationale: இங்கு ஒழுக்கரீதியான தீமையைப் பற்றிய கோட்பாட்டுக் கூற்று அல்ல; தனக்குச் சாதகமாக மிகாயா தீர்க்கதரிசனம் சொல்லமாட்டான் என்ற அரசனின் குற்றச்சாட்டு. எனினும் மூலத்தின் திட்டமிட்ட நன்மை/தீமை எதிரிணையை மொழிபெயர்ப்பு அழிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகம உரைநடை. அரசன் யோசபாத்தை நேரடியாக அழைப்பதால் மரியாதைப் பன்மையான ‘உம்மிடம்’ பயன்படுத்தப்பட்டது. ‘தீர்க்கதரிசனம் உரைத்தல்’ என்பதைவிட சாதாரண வாசகருக்குத் தெளிவான ‘தீர்க்கதரிசனமாகச் சொல்லுதல்’ தேர்ந்தெடுக்கப்பட்டது. அடிக்குறி குறியீடு பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
