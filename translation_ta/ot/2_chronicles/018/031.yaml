- from: தேர்ப்படைத் தளபதிகள் யோசபாத்தைக் கண்டபோது, “இவன்தான் இஸ்ரவேலின் அரசன்” என்று சொல்லி, அவரோடு போரிடுவதற்காக அவருக்கு எதிராகத் திரும்பினார்கள்.[a] யோசபாத் கூக்குரலிட்டார்; யாவே அவருக்கு உதவினார். கடவுள் அவர்களை அவரிடமிருந்து விலகச் செய்தார்.[b]
  to: தேர்ப்படைத் தளபதிகள் யோசபாத்தைக் கண்டபோது, “இவரே இஸ்ரவேலின் அரசன்” என்றார்கள்.[a] அவரோடு போரிடுவதற்காக அவர்கள் அவருக்கு எதிராகத் திரும்பினார்கள். யோசபாத் கூக்குரலிட்டார்; யாவே அவருக்கு உதவினார், கடவுள் அவர்களை அவரிடமிருந்து விலகச் செய்தார்.[b]
  rationale: மூலத்தின் நிகழ்வுவரிசை, போர் நோக்கம், யோசபாத்தின் முகவரியற்ற கூக்குரல், மற்றும் யாவே/கடவுள் என்ற இரு இறைப்பெயர்களின் வேறுபாடு ஆகியவை மாற்றமின்றிப் பாதுகாக்கப்பட்டுள்ளன. அரசரைச் சுட்டும் தமிழ்ப் பதிவைச் சரிசெய்து, ஆங்கில POB ஆய்வுத் தடத்துடன் பொருந்துமாறு a அடிக்குறிப்பை அடையாள வாக்கியத்தில் அமைத்துள்ளேன். சபவ் வினையின் ‘சுற்றிவளைத்தல்’ வாய்ப்பு சாத்தியமானது என்றாலும், இச்சூழலில் முதன்மை உரை காட்டும் ‘எதிராகத் திரும்புதல்’ போதுமானது; அதை அடிக்குறிப்பில் முன்னிறுத்தத் தேவையில்லை.
