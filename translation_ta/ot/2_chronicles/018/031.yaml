  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
translation:
  language: ta
  text: தேர்ப்படைத் தளபதிகள் யோசபாத்தைக் கண்டபோது, “இவரே இஸ்ரவேலின் அரசன்” என்றார்கள்.[a] அவரோடு போரிடுவதற்காக அவர்கள் அவருக்கு எதிராகத் திரும்பினார்கள். யோசபாத் கூக்குரலிட்டார்; யாவே அவருக்கு உதவினார், கடவுள் அவர்களை அவரிடமிருந்து விலகச் செய்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவர்தான் இஸ்ரவேலின் அரசன்.”
    reason: எபிரேய அடையாள வாக்கியத்தின் சொல்லமைப்பைத் தமிழில் வேறொரு இயல்பான முறையில் வெளிப்படுத்தலாம்.
  - marker: b
    text: அல்லது, “கடவுள் அவர்களை அவரிடமிருந்து திருப்பிவிட்டார்.”
    reason: סות என்ற எபிரேய வினைச்சொல் ஒருவரை ஓர் இலக்கிலிருந்து திருப்புதல் அல்லது விலக்குதல் என்று பொருள்படலாம்.
lexical_decisions:
- source_word: שָׂרֵי הָרֶכֶב
  choice: தேர்ப்படைத் தளபதிகள்
  rationale: שָׂרֵי என்பது படைத்துறைத் தலைவர்களையும் הָרֶכֶב என்பது தேர்ப்படையையும் குறிக்கிறது. ‘தேர்ப்படைத் தளபதிகள்’ என்பது சுருக்கமாகவும் இயல்பாகவும் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: இவன்தான் இஸ்ரவேலின் அரசன்
  rationale: எழுவாய் வலியுறுத்தப்படும் எபிரேய அடையாள வாக்கியத்தை இயல்பான தமிழில் ‘இவன்தான்’ தெளிவாகக் காட்டுகிறது.
- source_word: וַיָּסֹבּוּ עָלָיו לְהִלָּחֵם
  choice: அவரோடு போரிடுவதற்காக அவருக்கு எதிராகத் திரும்பினார்கள்
  rationale: סבב என்பது திரும்புவதையோ சுற்றிவளைப்பதையோ குறிக்கலாம். இங்கு யோசபாத்தைத் தாக்கும் இலக்காகக் கொண்டு அவருக்கு எதிராகத் திரும்பிய இயக்கத்தை முதன்மை மொழிபெயர்ப்பு காட்டுகிறது; சுற்றிவளைத்தல் என்பது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּזְעַק
  choice: கூக்குரலிட்டார்
  rationale: זעק துயரத்திலோ ஆபத்திலோ எழுப்பப்படும் உரத்த அழுகுரலைக் குறிக்கிறது. யாரை நோக்கி அழைத்தார் என்பதை வசனம் சொல்லாததால், கூடுதல் செயப்படுபொருள் சேர்க்கப்படவில்லை.
- source_word: וַיהוָה עֲזָרוֹ
  choice: யாவே அவருக்கு உதவினார்
  rationale: עזר என்பதன் நேரடியான பொருள் ‘உதவுதல்’. יהוה என்ற தனிப்பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  choice: கடவுள் அவர்களை அவரிடமிருந்து விலகச் செய்தார்
  rationale: இச்சூழலில் סות என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஓர் இலக்கிலிருந்து விலக்குதல் அல்லது திருப்புதல் என்ற பொருளைத் தருகிறது. ‘விலகச் செய்தார்’ என்பது இறைச் செயல்பாட்டையும் அதன் விளைவையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: וַיְהִי כִּרְאוֹת
  choice: கண்டபோது
  rationale: இது எபிரேயக் கதைநடையின் வழக்கமான தொடர் அமைப்பு. தமிழில் தேவையற்ற சொற்சுமையைத் தவிர்த்து, காலத் தொடர்பை ‘கண்டபோது’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஒரே வசனத்தில் יהוה மற்றும் אֱלֹהִים ஆகிய இறைப்பெயர்களை வேறுபடுத்திக் காட்டுதல்
  choice: யாவே … கடவுள்
  alternative: ஆண்டவர் … கடவுள்
  rationale: மூலத்தில் உள்ள יהוה என்ற தனிப்பெயரையும் אֱלֹהִים என்ற பொதுப் பெயரையும் ஒன்றாக்காமல், அவற்றின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: யோசபாத்தின் கூக்குரலை வெளிப்படையான ஜெபமாகக் கூறலாமா என்பது
  choice: யோசபாத் கூக்குரலிட்டார்
  alternative: யோசபாத் யாவேயை நோக்கிக் கூப்பிட்டார்
  rationale: அடுத்த கூற்று யாவே உதவியதாகச் சொன்னாலும், இந்த வசனத்தின் எபிரேய உரை கூக்குரலின் முகவரியை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே ஜெபம் என்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தேர்ப்படைத் தளபதிகள்’, ‘கூக்குரலிட்டார்’, ‘விலகச் செய்தார்’ ஆகியவை படைத்துறைச் சூழல், உணர்ச்சித் தீவிரம், இறைச் செயல்பாடு ஆகியவற்றைத் தெளிவாக வைத்திருக்கின்றன; எபிரேயக் கதைநடையின் தேவையற்ற சொற்படி அமைப்பு தமிழில் இயல்பாக்கப்பட்டுள்ளது.
