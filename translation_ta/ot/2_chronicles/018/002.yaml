base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
translation:
  language: ta
  text: சில ஆண்டுகளுக்குப் பிறகு, அவன் சமாரியாவில் இருந்த ஆகாபிடம் இறங்கிச் சென்றான். ஆகாப் அவனுக்காகவும் அவனுடன் இருந்த மக்களுக்காகவும் ஏராளமான ஆடுகளையும் மாடுகளையும் அறுத்தான். பின்பு, ராமோத்-கிலேயாத்துக்கு எதிராகப் படையெடுத்துச் செல்லும்படி அவனைத் தூண்டினான்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூண்டினான்” என்பதற்கு “ஆசைகாட்டி இணங்கச் செய்தான்” அல்லது “கிளர்த்தினான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “ராமோத்-கிலேயாத்துக்குச் செல்லும்படி.” சூழலில் இது அந்த நகருக்கு எதிரான படைநடவடிக்கையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: இறங்கிச் சென்றான்
  rationale: ‘இறங்கு’ என்ற திசை மற்றும் நிலவியல் பொருளைப் பாதுகாத்து, இயல்பான தமிழில் தருகிறது.
- source_word: לְקֵץ שָׁנִים
  choice: சில ஆண்டுகளுக்குப் பிறகு
  rationale: சொல்லுக்கு சொல் ‘ஆண்டுகளின் முடிவில்’ என்றாலும், குறிப்பிட்ட எண்ணிக்கையைக் கூறாமல் காலம் கடந்ததை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: אֶל אַחְאָב לְשֹׁמְרוֹן
  choice: சமாரியாவில் இருந்த ஆகாபிடம்
  rationale: ஆகாப் இருந்த இடத்திற்கே அவன் சென்றான் என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּזְבַּח לוֹ אַחְאָב
  choice: ஆகாப் அவனுக்காக ... வெட்டினான்
  rationale: இங்கு வெளிப்படையான வழிபாட்டுப் பலியைவிட அரச விருந்தோம்பலுக்காக விலங்குகள் கொல்லப்பட்ட சூழல் இருப்பதால் ‘வெட்டினான்’ எனத் தரப்பட்டுள்ளது.
- source_word: צֹאן וּבָקָר
  choice: ஆடுமாடுகள்
  rationale: சிறிய கால்நடைகளையும் மாடுகளையும் இயல்பாகவும் சுருக்கமாகவும் குறிக்கும் பொதுவழக்குச் சொல்.
- source_word: לָרֹב
  choice: ஏராளமான
  rationale: வெட்டப்பட்ட கால்நடைகளின் மிகுதியைத் தெளிவாக உணர்த்துகிறது.
- source_word: וְלָעָם אֲשֶׁר עִמּוֹ
  choice: அவனுடன் இருந்த மக்களுக்காகவும்
  rationale: עָם என்பதைப் படைவீரர்கள் என்று குறுக்காமல், எபிரெயத்தின் பரந்த ‘மக்கள்’ என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: וַיְסִיתֵהוּ
  choice: அவனைத் தூண்டினான்
  rationale: סות என்பதிலுள்ள தீவிரமான தூண்டுதல் அல்லது இணங்கச் செய்தல் என்ற நிழற்பொருளைக் காட்டுகிறது; வெறும் வேண்டுகோளாக மெலிதாக்கவில்லை.
- source_word: לַעֲלוֹת אֶל רָמוֹת גִּלְעָד
  choice: ராமோத்-கிலேயாத்துக்கு எதிராகப் படையெடுத்துச் செல்லும்படி
  rationale: ‘மேலே செல்ல’ என்பது அடிப்படைப் பொருள்; போர்ச் சூழலில் நகருக்கு எதிரான படைநடவடிக்கையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
