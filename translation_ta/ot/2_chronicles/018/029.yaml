base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
translation:
  language: ta
  text: இஸ்ரயேலின் அரசன் யோசபாத்திடம், “நான் மாறுவேடமிட்டுப் போருக்குச் செல்வேன்[a]; ஆனால் நீர் உமது அரச உடைகளை அணிந்துகொள்ளுங்கள்” என்றான். பிறகு இஸ்ரயேலின் அரசன் மாறுவேடமிட்டான்; அவர்கள் போருக்குச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை மிக நேரடியாக, “மாறுவேடமிட்டு போருக்குச் செல்” என்றும் வாசிக்கலாம். ஆனால் அடுத்த வாக்கியப் பகுதியும் தொடர்ந்து நிகழ்வதும், இஸ்ரயேலின் அரசன் தன்னைப் பற்றிப் பேசுவதாகக் காட்டுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַפֵּשׂ וָבוֹא
  choice: நான் மாறுவேடமிட்டுப் போருக்குச் செல்வேன்
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானதும் இலக்கண ரீதியாகத் தெளிவற்றதுமாக உள்ளது. அடுத்துள்ள ‘ஆனால் நீர் உமது அரச உடைகளை அணிந்துகொள்ளும்’ என்ற மாறுபாடும், பின்னர் இஸ்ரயேலின் அரசனே மாறுவேடமிட்டான் என்ற நிகழ்வும், இங்கு அரசன் தன்னைப் பற்றிப் பேசுகிறான் என்பதைக் காட்டுகின்றன. எனவே இயல்பான தமிழில் முதலாம் நபராக மொழிபெயர்க்கப்பட்டுள்ளது; நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בַמִּלְחָמָה
  choice: போருக்குச்
  rationale: בוא என்ற இயக்க வினையோடு வருவதால், போருக்குள் செல்வதை இயல்பான தமிழில் ‘போருக்குச் செல்வேன்’ எனத் தருகிறது.
- source_word: וְאַתָּה
  choice: ஆனால் நீர்
  rationale: இஸ்ரயேலின் அரசனுடைய மாறுவேடத்துக்கும் யோசபாத்தின் வெளிப்படையான அரச ஆடைக்கும் இடையிலான வேறுபாட்டை ‘ஆனால்’ தெளிவாக்குகிறது. அரசர்களுக்கிடையிலான உரையாடலுக்கு ஏற்ற மரியாதை ஒருமையாக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: உமது அரச உடைகளை அணிந்துகொள்ளும்
  rationale: בְּגָדִים பொதுவாக ‘உடைகள்’ என்றாலும், இச்சூழலில் யோசபாத்தை அரசனாக அடையாளப்படுத்தும் உடைகளே குறிக்கப்படுகின்றன. ஆகவே சூழலைத் தெளிவுபடுத்த ‘அரச உடைகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיָּבֹאוּ
  choice: அவர்கள் போருக்குச் சென்றார்கள்
  rationale: பன்மை வினைச்சொல் இரு அரசர்களும் போருக்குச் சென்றதைக் குறிக்கிறது; தமிழில் இயல்பான இயக்கச் சொல்லாக ‘சென்றார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரயேலின் அரசன்
  rationale: பட்டத்தை நேரடியாகவும் தொடர்ச்சியாகவும் தரும் இயல்பான தமிழ் வடிவம்.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: எபிரெயப் பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
