  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֵ֖ר מיכהו בֶן יִמְלָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/008.yaml
  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் அரசன் ஓர் அதிகாரியை[a] அழைத்து, “இம்லாவின் மகன் மீகாயாவை விரைவாக அழைத்து வா” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓர் அண்ணகனை” அல்லது “ஓர் அரசவை அதிகாரியை”; இதற்கான எபிரெயச் சொல் உண்மையில் அண்ணகனாக இருந்த ஒருவரையோ, பொதுவாக ஓர் அரச அதிகாரியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: அழைத்து
  rationale: இங்கு קרא என்பது அரசன் தன் கட்டளையைத் தெரிவிக்க ஓர் அதிகாரியை அழைப்பதைக் குறிக்கிறது; “அழைத்து” என்பது இயல்பான தமிழ் கதைநடைச் சொல்.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்தும் நேரடியான மொழிபெயர்ப்பு.
- source_word: אֶל סָרִיס אֶחָד
  choice: ஓர் அதிகாரியை[a]
  rationale: סָרִיס என்பது உடல்நிலையில் அண்ணகனைக் குறிக்கலாம்; அரசவையில் பணிபுரியும் அதிகாரியையும் பொதுவாகக் குறிக்கலாம். இச்சூழலில் அவன் அரசனின் கட்டளையை நிறைவேற்றுபவனாகத் தோன்றுவதால், நடுநிலையான “அதிகாரி” முதன்மை உரையில் வைக்கப்பட்டு, சொல்லின் பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וַיֹּאמֶר
  choice: என்றான்
  rationale: நேரடிக் கூற்றுக்குப் பின் வரும் இயல்பான தமிழ் கதைநடை வடிவம்; அரசனைக் குறிக்கும் ஆண்பால் ஒருமையும் தெளிவாகிறது.
- source_word: מַהֵר
  choice: விரைவாக அழைத்து வா
  rationale: מהר வெளிப்படுத்தும் அவசரத்தை “விரைவாக” காட்டுகிறது. எபிரெய உரையில் வருதல் அல்லது அழைத்து வருதல் சார்ந்த வினை சூழலால் புரிந்துகொள்ளப்படுவதால், தமிழில் கட்டளையை முழுமையாகவும் இயல்பாகவும் அமைக்க “அழைத்து வா” சேர்க்கப்பட்டுள்ளது.
- source_word: מיכהו
  choice: மிகாயா
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற, வாசிக்க எளிய ஒலிபெயர்ப்பு.
- source_word: בֶן יִמְלָא
  choice: இம்லாவின் மகன்
  rationale: தந்தை வழி அடையாளத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
