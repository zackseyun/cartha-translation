source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ הִנְּ/ךָ֥ רֹאֶ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא אֲשֶׁ֥ר תָּב֛וֹא חֶ֥דֶר בְּ/חֶ֖דֶר לְ/הֵחָבֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/024.yaml
  text: Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide yourself.”
translation:
  language: ta
  text: மீகாயா, “இதோ, நீ ஒளிந்துகொள்வதற்காக உள்ளறைக்குள்[a] செல்லும் அந்த நாளில் காண்பாய்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அறைக்குள் அறை”; இதை “அறையிலிருந்து அறைக்குச் சென்று” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְּךָ
  choice: இதோ, நீ
  rationale: கவனத்தை ஈர்த்து, முன்னறிவிப்பின் உறுதியை வலியுறுத்தும் எபிரெயச் சொல்லமைப்பை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: רֹאֶה
  choice: காண்பாய்
  rationale: இது வடிவத்தில் நிகழ்காலப் பங்கேற்புச் சொல் என்றாலும், הִנְּךָ என்பதுடன் இச்சூழலில் எதிர்கால அனுபவத்தை முன்னறிவிக்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: எபிரெயக் காலக் குறிப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר תָּבוֹא
  choice: செல்லும்
  rationale: தொடர்ந்து வரும் இடக் குறிப்புக்குள் நுழையும் சூழலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: חֶדֶר בְּחֶדֶר
  choice: உள்ளறைக்குள்
  rationale: சொல்லுக்கு சொல் ‘அறைக்குள் அறை’ எனும் உருவகத்தை இயல்பான தமிழில் தருகிறது; ‘அறையிலிருந்து அறைக்கு’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְהֵחָבֵא
  choice: ஒளிந்துகொள்வதற்காக
  rationale: நிபால் வடிவத்தின் தற்சார்புப் பொருளையும் நோக்கத்தைக் குறிக்கும் לְ முன்னொட்டையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִיכָיְהוּ
  choice: மீகாயா
  rationale: எபிரெயத் தனிப்பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தருகிறது.
