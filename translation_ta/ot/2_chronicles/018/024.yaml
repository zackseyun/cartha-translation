translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ தீர்க்கதரிசனக் கூற்றின் கவன ஈர்ப்பையும் உறுதியையும் காக்கிறது; மூலத்தில் உள்ள இடவியல் இருபொருள் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
