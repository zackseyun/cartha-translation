translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. அரசுப் பட்டங்களும் இடப்பெயர்களும் தெளிவாக வைக்கப்பட்டுள்ளன; எபிரெயின் சுருக்கமான இணை அமைப்பு முடிந்தவரை காக்கப்பட்டு, தமிழில் தேவையான இடத்தில் மட்டும் வினைச்சொல் நிரப்பப்பட்டுள்ளது.
