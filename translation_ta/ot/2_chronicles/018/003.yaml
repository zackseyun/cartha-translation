  text: וַ/יֹּ֜אמֶר אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל יְהֽוֹשָׁפָט֙ מֶ֣לֶךְ יְהוּדָ֔ה הֲ/תֵלֵ֥ךְ עִמִּ֖/י רָמֹ֣ת גִּלְעָ֑ד וַ/יֹּ֣אמֶר ל֗/וֹ כָּמ֤וֹ/נִי כָמ֨וֹ/ךָ֙ וּ/כְ/עַמְּ/ךָ֣ עַמִּ֔/י וְ/עִמְּ/ךָ֖ בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
translation:
  language: ta
  text: இஸ்ரவேலின் அரசன் ஆகாப், யூதாவின் அரசன் யோசபாத்திடம், “நீ என்னோடு கீலேயாத்திலுள்ள ராமோத்துக்கு வருவாயா?” என்று கேட்டான். அதற்கு அவன், “நான் உன்னைப்போல்; என் மக்கள் உன் மக்களைப்போல்[a]; போரில் உன்னோடு இருப்பேன்[b]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் மரபுத்தொடராக, “உன் மக்கள் என் மக்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்கள் நேரடியாக, “உன் மக்களைப்போல் என் மக்கள்” என்ற ஒப்புமை அமைப்பில் உள்ளன.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் இந்த இறுதிக் கூறு வினைச்சொல் இல்லாமல், நேரடியாக “போரில் உன்னோடு” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ עִמִּי
  choice: நீ என்னோடு ... வருவாயா?
  rationale: கேள்வியைக் குறிக்கும் הֲ உடன் வரும் הלך மற்றும் עִם, ஆகாபோடு யோசபாத் செல்வாரா எனக் கேட்கிறது. இலக்கிடத்தை நோக்கி அழைக்கும் இயல்பான தமிழில் ‘வருவாயா?’ என வழங்கப்பட்டது.
- source_word: רָמֹת גִּלְעָד
  choice: கீலேயாத்திலுள்ள ராமோத்
  rationale: இது இடப்பெயர். எபிரெயச் சொற்றொடரின் உறவைத் தெளிவாக்கவும், நவீன தமிழில் இயல்பாகவும் ‘கீலேயாத்திலுள்ள ராமோத்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: நான் உன்னைப்போல்
  rationale: வினைச்சொல் இல்லாத சுருக்கமான எபிரெய ஒப்புமையைப் பாதுகாத்து, இருவருக்கிடையேயான ஒருமைப்பாட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּכְעַמְּךָ עַמִּי
  choice: என் மக்கள் உன் மக்களைப்போல்
  rationale: எபிரெயில் வினைச்சொல் இல்லாத ஒப்புமையும் சொல் வரிசையும் உள்ளன. அடையாளப்படுத்தலாக மாற்றாமல் ஒப்புமையின் நுணுக்கத்தைப் பேணுகிறது.
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  choice: போரில் உன்னோடு இருப்பேன்
  rationale: மூலத்தில் வினைச்சொல் வெளிப்படையாக இல்லை. சூழலில் இது போருக்கான ஆதரவு உறுதிமொழி என்பதால், இயல்பான தமிழுக்காக ‘இருப்பேன்’ சேர்க்கப்பட்டது; இதன் நீள்வட்ட அமைப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: என்று கேட்டான் ... என்றான்
  rationale: இரு இடங்களிலும் எபிரெயில் பொதுவான אמר வந்தாலும், முதல் கூற்று கேள்வி என்பதால் தமிழில் ‘கேட்டான்’ என்றும், பதில் ‘என்றான்’ என்றும் இயல்பாக வேறுபடுத்தப்பட்டது.
