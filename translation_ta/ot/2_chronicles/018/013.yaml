base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/013.yaml
  text: But Micaiah said[a], “As Yahweh lives, whatever my God says, that I will speak.”
translation:
  language: ta
  text: ஆனால் மிகாயா, “யாவே உயிருடன் இருக்கிறார் என்பதன்மேல் ஆணையாக, என் கடவுள் எதைச் சொல்கிறாரோ அதையே நான் பேசுவேன்” என்றார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே உயிருடன் இருக்கிறார்; என் கடவுள் சொல்வதை நான் பேசுவேன்.”
    reason: חַי יְהוָה என்ற எபிரெயச் சொற்றொடர் வழக்கமாக ஆணைச் சூத்திரமாகும்; அதனை நேரடியான அறிவிப்பாகவும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... என்றார்
  rationale: வாவ்-தொடர்நிலை கதைநடையை முன்னெடுத்தாலும், முந்தைய வசனத்தில் தூதன் வற்புறுத்தியதற்கு மிகாயா எதிர்மறையாகப் பதிலளிப்பதால், தமிழில் ‘ஆனால்’ என்பது சூழலின் முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִיכָיְהוּ
  choice: மிகாயா
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீன தமிழில் தெளிவாகக் காட்டும் எழுத்துப்பெயர்ப்பு.
- source_word: חַי יְהוָה
  choice: யாவே உயிருடன் இருப்பது உறுதி!
  rationale: இது எபிரெய மொழியின் வழக்கமான ஆணைச் சூத்திரம். சொற்சொல்லான வடிவத்தைவிட, தமிழில் அதன் ஆணையுறுதி இயல்பாகவும் கண்ணியமாகவும் வெளிப்பட இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தான இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֵת אֲשֶׁר
  choice: எதை ... அதையே
  rationale: உறவுப்பெயரும் மீள்சுட்டும் பொருட்பெயரும் கொண்ட எபிரெய அமைப்பை இயல்பான தமிழில் முழுமையான பொருளுடன் வெளிப்படுத்துகிறது.
- source_word: יֹאמַר
  choice: சொல்கிறாரோ
  rationale: உடனடியான சூழலில் கடவுள் தெரிவிக்கக்கூடிய எதையும் குறிக்கும் எபிரெய நிறைவுறா வினையைத் தமிழ் நிபந்தனை-உறவு அமைப்பில் இயல்பாகக் காட்டுகிறது.
- source_word: אֱלֹהַי
  choice: என் கடவுள்
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֹתוֹ
  choice: அதையே
  rationale: கடவுள் சொல்லும் செய்தியை மீண்டும் சுட்டும் பொருட்பெயரையும் அதன் வலியுறுத்தலையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲדַבֵּר
  choice: நான் பேசுவேன்
  rationale: தீர்க்கதரிசி அறிவிக்கும் உரையின் தன்மையையும் solemn உறுதியையும் காக்கிறது.
theological_decisions:
- issue: ஆணைச் சூத்திரத்தில் יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் தனிப்பட்ட உடன்படிக்கைப் பெயரான திருநான்கெழுத்தை நேரடியாகப் பயன்படுத்துகிறது; எனவே அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: חַי יְהוָה என்பதன் ஆணையுறுதியும் இலக்கண வடிவும்
  choice: யாவே உயிருடன் இருப்பது உறுதி!
  alternative: யாவே உயிருடன் இருக்கிறார்;
  rationale: முதன்மை உரை இதை வழக்கமான எபிரெய ஆணைச் சூத்திரமாக வெளிப்படுத்துகிறது; அதே சொற்றொடரை நேரடி அறிவிப்பாகப் புரிந்துகொள்ளும் சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தீர்க்கதரிசன உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘யாவே’ இறைப்பெயராகவும், ‘என் கடவுள்’ மூலத்தின் தனிப்பட்ட உடைமையுறவாகவும் பாதுகாக்கப்பட்டுள்ளன.
