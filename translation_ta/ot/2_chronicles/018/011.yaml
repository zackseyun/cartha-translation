id: 2CH.18.11
reference: 2 Chronicles 18:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/כָל הַ֨/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/011.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: ta
  text: எல்லாத் தீர்க்கதரிசிகளும் அவ்வாறே தீர்க்கதரிசனம் உரைத்துக்கொண்டு, “ராமோத்-கிலேயாத்துக்குப் படையெடுத்துச் செல்; வெற்றிபெறு; யாவே அதை அரசனின் கையில் ஒப்புக்கொடுப்பார்[a]” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே அதை அரசனின் கையில் ஒப்புக்கொடுத்துவிட்டார்.” தீர்க்கதரிசனச் சூழலில் எபிரெய வினைவடிவம் உறுதிப்படுத்தப்பட்ட எதிர்காலமாகவும், ஏற்கெனவே நிறைவேறியதுபோல் கூறப்படும் உறுதிமொழியாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כָל הַנְּבִאִים
  choice: எல்லாத் தீர்க்கதரிசிகளும்
  rationale: இணைப்புச் சொல்லைத் தமிழின் இயல்பான வாக்கியத் தொடக்கத்தில் தனியாக வெளிப்படுத்தாமல், ‘எல்லா’ என்ற முழுமையைக் குறிக்கும் சொல்லுடன் கூடிய கூட்டுப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: נִבְּאִים
  choice: தீர்க்கதரிசனம் உரைத்துக்கொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினையின் நீடித்துக்கொண்டிருந்த செயலை ‘உரைத்துக்கொண்டிருந்தார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כֵּן
  choice: அவ்வாறே
  rationale: அவர்கள் அனைவரும் ஒரே விதமாகப் பேசிய முறைப்பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: לֵאמֹר
  choice: … என்றார்கள்
  rationale: நேர்கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவத்தைத் தமிழில் இயல்பான மேற்கோள் முடிவாக மாற்றுகிறது.
- source_word: עֲלֵה
  choice: படையெடுத்துச் செல்லுங்கள்
  rationale: அடிப்படைப் பொருள் ‘மேலே செல்’ என்றாலும், இங்கு ராமோத்-கிலேயாத்துக்கு எதிரான போர்ச் சூழலைத் தெளிவாகக் கூறுகிறது; வெறும் ‘செல்லுங்கள்’ என்பதைக் காட்டிலும் சூழற்பொருளை இயல்பாக வழங்குகிறது.
- source_word: רָמֹת גִּלְעָד
  choice: ராமோத்-கிலேயாத்
  rationale: எபிரெய இடப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: וְ/הַצְלַח
  choice: வெற்றி பெறுங்கள்
  rationale: போர்ச் சூழலில் ‘வெற்றியடையுங்கள்/சித்தியடையுங்கள்’ என்ற பொருளை நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றீடாக இடாமல், திருநாமமாகிய நான்கு எழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְ/נָתַן
  choice: ஒப்புக்கொடுப்பார்
  rationale: கட்டளைகளுக்குப் பின் வரும் இவ்வடிவம் தீர்க்கதரிசனச் சூழலில் உறுதியாக எதிர்பார்க்கப்படும் எதிர்காலத்தைத் தெரிவிக்க முடியும்; தமிழில் எதிர்கால வினை அதை இயல்பாகக் காட்டுகிறது.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: அரசனின் கையில்
  rationale: ஒருவரின் அதிகாரத்துக்குள் ஒப்புக்கொடுத்தல் என்ற எபிரெய உருவகத்தைப் புரியத்தக்க தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்லாமல் தனிப்பட்ட இறைநாமம் இருப்பதால், அதை ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וְנָתַן என்பதன் காலம்/கோணம்
  choice: ஒப்புக்கொடுப்பார்
  alternative: ஒப்புக்கொடுத்துவிட்டார்
  rationale: முன்னுள்ள கட்டளைகளுக்குப் பின் வரும் qatal வடிவம் இங்கு உறுதியான தீர்க்கதரிசன எதிர்காலத்தைக் குறிக்கலாம். நிறைவேறியதாகக் கூறும் மாற்றும் இலக்கணரீதியாகச் சாத்தியமானதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகருக்குப் புரியும் நடை. ‘தீர்க்கதரிசனம் உரைத்துக்கொண்டிருந்தார்கள்’ நீடித்த செயலைக் காட்டுகிறது. போர்ச் சூழலைத் தெளிவாக்க ‘படையெடுத்துச் செல்லுங்கள்’ பயன்படுத்தப்பட்டது; இறைநாமம் ‘யாவே’ எனத் தக்கவைக்கப்பட்டது.
