base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
translation:
  language: ta
  text: அன்று போர் தீவிரமடைந்தது. இஸ்ரவேலின் அரசன் அராமை எதிர்நோக்கித் தேரில் தன்னை நிலைநிறுத்தியபடி மாலைவரை இருந்தான்; சூரியன் மறையும் வேளையில்[a] அவன் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூரியன் மறைந்தபோது” அல்லது “சூரிய அஸ்தமனத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  choice: போர் கடுமையடைந்தது
  rationale: עלה என்பதன் அடிப்படைப் பொருள் ‘மேலே போதல்’; ஆனால் ‘போர்’ எழுவாயாக வரும்போது, போர் தீவிரமடைந்ததைச் சுட்டும் மரபுத்தொடராக உள்ளது. ‘கடுமையடைந்தது’ என்பது இயல்பான நவீனத் தமிழில் அந்த உயர்வைத் தெரிவிக்கிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அன்று
  rationale: ‘அந்த நாளில்’ என்பதன் இயல்பான, சுருக்கமான தமிழாக்கம்; கதைநடையின் காலத் தொடர்பைத் தெளிவாக வைத்திருக்கிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
