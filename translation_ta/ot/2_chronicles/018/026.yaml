  text: וַ/אֲמַרְתֶּ֗ם כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ שִׂ֥ימוּ זֶ֖ה בֵּ֣ית הַ/כֶּ֑לֶא וְ/הַאֲכִלֻ֜/הוּ לֶ֤חֶם לַ֨חַץ֙ וּ/מַ֣יִם לַ֔חַץ עַ֖ד שׁוּבִ֥/י בְ/שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/026.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I return in peace.’'
translation:
  language: ta
  text: 'மேலும், நீங்கள், ‘அரசர் கூறுவது இதுவே: இந்த மனிதனைச் சிறையில் அடைத்து, நான் பாதுகாப்பாகத் திரும்பிவரும்வரை அவனுக்குத் துன்பத்தின் அப்பத்தையும் துன்பத்தின் தண்ணீரையும்[a] கொடுங்கள்’ என்று சொல்லுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நெருக்கடியின் அப்பமும் நெருக்கடியின் தண்ணீரும்” என்றும் மொழிபெயர்க்கலாம்; சிறைவாசத்தோடும் துன்பத்தோடும் தொடர்புடைய குறைந்த அளவு உணவையும் தண்ணீரையும் இது குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: மேலும் நீங்கள் ... என்று சொல்லுங்கள்
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மை வடிவம், முந்தைய அரச கட்டளையின் தொடர்ச்சியாகக் கட்டளைப் பொருளில் வருகிறது; தமிழில் இதை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: அரசர் கூறுவது இதுவே
  rationale: அதிகாரப்பூர்வ தூதுச் செய்திக்கான எபிரெய வழக்கை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: שִׂימוּ זֶה בֵּית הַכֶּלֶא
  choice: இந்த மனிதனைச் சிறையில் அடைத்து
  rationale: זֶה மிகாயாவைச் சுட்டும் சொல்லாக உள்ளது; ‘இந்த மனிதன்’ என்பது தேவையற்ற இழிவைச் சேர்க்காமல் சுட்டுப் பொருளைத் தெளிவாக்குகிறது. ‘சிறையில் அடைத்து’ என்பது தமிழ் வழக்கில் இயல்பான சமமான சொற்றொடர்.
- source_word: וְהַאֲכִלֻהוּ
  choice: அவனுக்குக் ... கொடுங்கள்
  rationale: ‘அவனை உண்ணச் செய்/அவனுக்கு உணவளி’ என்ற காரணவினைப் பொருளை, அப்பமும் தண்ணீரும் இணைந்த பொருளாக வருவதால் ‘கொடுங்கள்’ என இயல்பாக வழங்குகிறது.
- source_word: לֶחֶם לַחַץ וּמַיִם לַחַץ
  choice: துன்பத்தின் அப்பத்தையும் துன்பத்தின் தண்ணீரையும்
  rationale: לַחַץ என்பதிலுள்ள நெருக்கடி, ஒடுக்கம், பற்றாக்குறை ஆகிய பொருள் நிழல்களையும் எபிரெய இணைநிலையையும் காக்கும் சொற்படிம மொழிபெயர்ப்பு; நடைமுறைப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  choice: நான் பாதுகாப்பாகத் திரும்பிவரும்வரை
  rationale: போரிலிருந்து நலமாகத் திரும்புதல் என்ற בְשָׁלוֹם-இன் சூழல் பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது; பின்னணியிலுள்ள நையாண்டித் திருப்பத்தையும் தீர்மானித்து விடவில்லை.
