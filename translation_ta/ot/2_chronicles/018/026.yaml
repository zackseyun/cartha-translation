translation_notes:
  register: நவீன நிலையான தமிழில், அரசாணைக்குரிய கண்ணியமான தொனியுடன் மொழிபெயர்க்கப்பட்டது. எபிரெய மொழியின் இணைநிலைச் சொற்படிமம் முதன்மை உரையில் காக்கப்பட்டு, அதன் சாத்தியமான நடைமுறைப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
