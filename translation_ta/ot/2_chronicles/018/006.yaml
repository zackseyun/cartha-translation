id: 2CH.18.6
reference: 2 Chronicles 18:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
translation:
  language: ta
  text: ஆனால் யோசபாத், “யாவேக்குரிய வேறொரு தீர்க்கதரிசி இன்னும் இங்கே இல்லையா? அவரிடம் நாம் விசாரிப்போமே” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆனால் ... கேட்டார்
  rationale: வாவ் தொடர்கதை நிகழ்வை முன்னெடுத்தாலும், முந்தைய தீர்க்கதரிசிகளின் ஒருமித்த கூற்றுக்கு யோசபாத் காட்டும் எதிர்வினையைச் சூழல் வெளிப்படுத்துவதால் ‘ஆனால்’ இயல்பானது. தமிழில் நேரடிக் கேள்வியைத் தொடர்ந்து ‘கேட்டார்’ என்பது இயல்பாக உள்ளது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: הַאֵין
  choice: இல்லையா?
  rationale: உறுதிப்படுத்தலை அல்லது மேலும் ஒருவரைக் கண்டுபிடிப்பதை எதிர்பார்க்கும் எதிர்மறை வினாவின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: פֹּה
  choice: இங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை.
- source_word: נָבִיא
  choice: தீர்க்கதரிசி
  rationale: נָבִיא என்பதற்கான நிலையான தமிழ் வேதாகமச் சொல்; எபிரெய ஒருமை தக்கவைக்கப்படுகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவின்
  rationale: லாமேத் இங்கு யெகோவாவுடன் உள்ள தொடர்பை—அவருக்குரிய அல்லது அவர் சார்பாகப் பேசும் தீர்க்கதரிசியை—குறிக்கிறது. தெய்வீகப் பெயரை பட்டப்பெயராக மாற்றாமல் தனிப்பெயராக வழங்குகிறது.
- source_word: עוֹד
  choice: வேறு யாராவது
  rationale: ஏற்கெனவே கேட்டவர்களுக்கு அப்பால் கூடுதலாக ஒரு தீர்க்கதரிசி இருக்கிறாரா என்பதே சூழல்சார் பொருள். தமிழில் ‘வேறு யாராவது’ அதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְנִדְרְשָׁה
  choice: நாம் ... விசாரிப்பதற்கு
  rationale: முதல் நபர் பன்மை cohortative முன்மொழியும் செயலைக் குறிக்கிறது; இங்கு தீர்க்கதரிசியின் வாயிலாக இறைவனுடைய பதிலை நாடுவதே கருத்து.
- source_word: מֵאֹתוֹ
  choice: அவரிடம்
  rationale: விசாரணை செய்யப்படும் நபரைக் குறிக்கும் מן + சுட்டுப்பெயரின் இயல்பான தமிழ் இணை.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டப்பெயராக மாற்றாமல் பெயராகத் தக்கவைக்கப்படுகிறது. தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ வடிவம் பயன்படுத்தப்படுகிறது; மூல உச்சரிப்பு உறுதியாக இல்லாததால் மாற்று வடிவத்தை அடிக்குறிப்பில் கட்டாயப்படுத்தவில்லை.
- issue: தீர்க்கதரிசியிடம் விசாரித்தல்
  choice: அவரிடம் விசாரிப்பதற்கு
  alternative: அவர் மூலமாக விசாரிப்பதற்கு
  rationale: מֵאֹתוֹ என்பதன் நேரடியான உறவைத் தக்கவைக்கிறது; தீர்க்கதரிசி இடைத்தரகராகச் செயல்படுவதை வெளிப்படையாகச் சேர்த்து இறையியல் விளக்கம் புகுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘தீர்க்கதரிசி’ போன்ற அறியப்பட்ட வேதாகமச் சொல்லைத் தக்கவைத்து, வாக்கிய அமைப்பு இன்றைய வாசகருக்கு இயல்பாக அமைக்கப்பட்டது.
