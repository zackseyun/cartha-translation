revisions:
- from: ஆனால் யோசபாத், “நாம் அவரிடம் விசாரிப்பதற்கு, யெகோவாவின் தீர்க்கதரிசி வேறு யாராவது இங்கே இல்லையா?” என்று கேட்டார்.
  to: ஆனால் யோசபாத், “யாவேக்குரிய வேறொரு தீர்க்கதரிசி இன்னும் இங்கே இல்லையா? அவரிடம் நாம் விசாரிப்போமே” என்றார்.
  rationale: The revision retains the discourse contrast, the rhetorical negative question, the singular prophetic referent, and the cohortative proposal. «வேறொரு» reflects the contextual implication of עוד without obscuring that the Hebrew explicitly names one prophet; «யாவே» follows the supplied project policy for the Tetragrammaton.
