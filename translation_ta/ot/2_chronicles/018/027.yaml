base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
translation:
  language: ta
  text: 'மிகாயா, “நீர் உண்மையாகவே நலமுடன் திரும்பிவந்தால், யாவே என் மூலமாகப் பேசியிருக்கவில்லை[a]” என்றான். பின்பு அவன், “மக்களினங்களே, நீங்கள் அனைவரும் கேளுங்கள்![b]” என்றான்.


    [a] வேறு வகையில்: “யாவே என்னைக் கொண்டு பேசியிருக்கவில்லை.”

    [b] எபிரெய மொழியில் “மக்களினங்கள்” என்பது பன்மையில் உள்ளது; இது அங்கிருந்த ஒரு கூட்டத்தாரை மட்டும் அல்லாமல் விரிவாக அழைக்கும் தீர்க்கதரிசனச் சொல்லாட்சி.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “யாவே என்னைக் கொண்டு பேசியிருக்கவில்லை.”'
    reason: בִּי என்பதன் கருவிப் பொருளுக்கான இயல்பான மாற்று மொழிபெயர்ப்பை அளிக்கிறது.
  - marker: b
    text: எபிரெய மொழியில் “மக்களினங்கள்” என்பது பன்மையில் உள்ளது; இது அங்கிருந்த ஒரு கூட்டத்தாரை மட்டும் அல்லாமல் விரிவாக அழைக்கும் தீர்க்கதரிசனச் சொல்லாட்சி.
    reason: עַמִּים என்ற பன்மை வடிவத்தின் பரந்த தீர்க்கதரிசன அழைப்பை விளக்குகிறது.
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: மிகாயா
  rationale: தனிப்பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: நீர் உண்மையாகவே ... திரும்பிவந்தால்
  rationale: வினையெச்சப் பெயருடன் அதே வேருடைய வினை இணைந்து தரும் வலியுறுத்தப்பட்ட நிபந்தனையை இயல்பான தமிழில் காக்கிறது.
- source_word: בְּשָׁלוֹם
  choice: நலமுடன்
  rationale: இச்சூழலில் போரிலிருந்து சேதமின்றிப் பாதுகாப்பாகத் திரும்புவதை குறிக்கும் שָׁלוֹם என்பதன் பொருளைத் தெளிவாகத் தருகிறது; சொல்லுக்கு சொல் 'சமாதானத்துடன்' என்பது தமிழில் வேறு பொருள் நிழலை ஏற்படுத்தலாம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயராகிய நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: யாவே என் மூலமாகப் பேசியிருக்கவில்லை
  rationale: בִּי என்பதன் கருவிப் பொருளை இயல்பான தமிழில் வெளிப்படுத்தி, ஆகாப் நலமுடன் திரும்பினால் மிகாயாவின் தீர்க்கதரிசனம் இறைவனிடமிருந்து வந்ததல்ல என்ற சோதனையைப் பாதுகாக்கிறது.
- source_word: שִׁמְעוּ
  choice: கேளுங்கள்
  rationale: பன்மை ஏவல் வடிவையும் தீர்க்கதரிசன அழைப்பின் மாண்பான தொனியையும் காக்கிறது.
- source_word: עַמִּים כֻּלָּם
  choice: மக்களினங்களே, நீங்கள் அனைவரும்
  rationale: עַמִּים என்பதன் பன்மையையும் כֻּלָּם என்பதன் முழுமைப்படுத்தும் வலியுறுத்தலையும் வெளிப்படையாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது; ஆகவே அதனைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: இறுதி சொல்லின் பேச்சாளர்
  choice: “பின்பு அவன் ... என்றான்” என்று மிகாயாவையே பேச்சாளராக வைத்தல்
  alternative: பேச்சாளரை வெளிப்படையாகப் பெயரிட்டு விளக்குதல்
  rationale: எபிரெய உரை 'அவன் சொன்னான்' என்று மட்டுமே கூறுகிறது; அருகிலுள்ள வெளிப்படையான பேச்சாளர் மிகாயா. மூலத்தின் மறைமுகச் சுட்டைத் தீர்த்து எழுதாமல் காக்கிறது.
- issue: ஆகாப் நலமுடன் திரும்புவது தீர்க்கதரிசனத்தின் சோதனையாக அமைதல்
  choice: “பேசியிருக்கவில்லை” என்ற நிபந்தனை சார்ந்த கூற்று
  alternative: “என் மூலம் பேசவில்லை”
  rationale: ஆகாப் திரும்பினால் மிகாயா கூறிய செய்தி யாவேயிடமிருந்து வந்ததல்ல என்பது வெளிப்படும் என்ற உரையின் இறையியல் பதற்றத்தை மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மாண்பும் தீர்க்கதரிசனத் தொனியும் காக்கப்பட்டுள்ளன. அரசனை நோக்கிய ஒருமை மரியாதைக்காக “நீர்” பயன்படுத்தப்பட்டுள்ளது. கடினமான சொல்லுக்குச் சொல் அமைப்பைத் தவிர்த்து, எபிரெய வலியுறுத்தல் மற்றும் பன்மை போன்ற முக்கிய வடிவங்கள் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
