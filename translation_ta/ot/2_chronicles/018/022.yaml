language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/022.yaml
  text: And now, look, the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has spoken disaster against you.
translation:
  language: ta
  text: இப்போது, இதோ, உன்னுடைய இந்தத் தீர்க்கதரிசிகளின் வாயில் பொய் சொல்லும் ஒரு ஆவியை யெகோவா வைத்திருக்கிறார்; யெகோவா உனக்கு எதிராகப் பேரிடரை அறிவித்திருக்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: இப்போது பார்!
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொற்றொடரின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரைப் பெயராகவே வெளிப்படுத்துகிறது; பொதுப்பட்டமான ‘கர்த்தர்’ என்பதுடன் கலக்கவில்லை.
- source_word: רוּחַ שֶׁקֶר
  choice: பொய்யுரைக்கும் ஓர் ஆவி
  rationale: ‘பொய்யின் ஆவி’ என்ற சொல்லுக்கு சொல் அமைப்பைவிட, பொய் பேசச் செய்கிற ஆவி என்ற சூழல்சார் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּפִי נְבִיאֶיךָ אֵלֶּה
  choice: உன்னுடைய இந்தத் தீர்க்கதரிசிகளின் வாயில்
  rationale: ‘வாயில்’ என்ற மூல உருவகத்தையும், இரண்டாம் நபர் உடைமையையும், சுட்டுப்பெயரையும் பாதுகாக்கிறது.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: உனக்குத் தீங்கு நேரிடும் என்று உரைத்திருக்கிறார்
  rationale: רָעָה என்பதன் இச்சூழலிலான ‘தீங்கு/பேரிடர்’ பொருளைத் தருகிறது; யெகோவா தீமையான வார்த்தை பேசினார் என்ற தவறான புரிதலைத் தவிர்க்கிறது.
theological_decisions:
- issue: யெகோவா பொய்யுரைக்கும் ஆவியை வைத்தார் என்ற தெய்வச் செயலாண்மை
  choice: மூலத்தின் நேரடியான கூற்றைத் தணிக்காமல் மொழிபெயர்த்தல்
  alternative: யெகோவா அந்த ஆவியை அனுமதித்தார்
  rationale: נָתַן என்பது இங்கு ‘வைத்தார்/கொடுத்தார்’ என்று நேரடியாகக் கூறுகிறது. ‘அனுமதித்தார்’ என்பது இறையியல் பதற்றத்தை விளக்கி முடிக்கும் சேர்க்கையாகிவிடும்.
- issue: רָעָה என்பதன் பொருள்
  choice: தீங்கு
  alternative: தீமை
  rationale: இங்கு ஆகாபுக்கு எதிராக அறிவிக்கப்பட்ட பாதிப்பு அல்லது பேரிடரைக் குறிக்கிறது; ஒழுக்கத் தீமையை யெகோவாவுக்குச் சுமத்தும் பொருளை உருவாக்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; அரசவையில் வழங்கப்படும் தீர்க்கதரிசனக் கண்டனத்துக்கேற்ற கண்ணியமும் நேரடியான வலிமையும் காக்கப்பட்டுள்ளன. தேவையற்ற வடமொழிச் சிக்கல் தவிர்க்கப்பட்டாலும், ‘தீர்க்கதரிசிகள்’ போன்ற பரவலாக நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது.
