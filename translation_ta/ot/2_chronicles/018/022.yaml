revisions:
- from: இப்போது பார்! உன்னுடைய இந்தத் தீர்க்கதரிசிகளின் வாயில் பொய்யுரைக்கும் ஓர் ஆவியை யெகோவா வைத்திருக்கிறார். யெகோவா உனக்குத் தீங்கு நேரிடும் என்று உரைத்திருக்கிறார்.
  to: இப்போது, இதோ, உன்னுடைய இந்தத் தீர்க்கதரிசிகளின் வாயில் பொய் சொல்லும் ஒரு ஆவியை யெகோவா வைத்திருக்கிறார்; யெகோவா உனக்கு எதிராகப் பேரிடரை அறிவித்திருக்கிறார்.
  rationale: The revision preserves the Hebrew’s direct divine agency, the false-speaking spirit, the demonstrative ‘these,’ and the announced רָעָה. It improves the opening discourse marker, idiomatic expression, and contextual precision while retaining the established divine-name rendering.
