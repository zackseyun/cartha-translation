source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥הוּ בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלּוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
translation:
  language: ta
  text: 'அப்போது கெனானாவின் மகன் சிதேக்கியா தனக்காக இரும்புக் கொம்புகளைச் செய்து, “யாவே இவ்வாறு கூறுகிறார்: இவற்றால் நீ அராமை[b] முற்றிலும் அழிந்துபோகும்வரை முட்டித் தாக்குவாய்[a]” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தள்ளுவாய்”; எபிரெய வினை, கொம்புள்ள விலங்கு கொம்பால் முட்டும் அல்லது குத்தும் செயலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “அராம்” என்பதை “அராமியர்கள்” என்றும் வழங்கலாம்; குறைந்த துல்லியத்துடன், பிற்காலப் பயன்பாட்டில் “சிரியா” என்றும் கூறப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: தனக்காக ... செய்து
  rationale: לּוֹ இச்சூழலில் சிதேக்கியா தனது அடையாளச் செயலுக்காகக் கொம்புகளைச் செய்தான் என்ற இயல்பான தன்முகப் பொருளைத் தருகிறது.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: கெனானாவின் மகன் சிதேக்கியா
  rationale: எபிரெயப் பெயர்களையும் தந்தை–மகன் உறவையும் நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: קַרְנֵי בַרְזֶל
  choice: இரும்புக் கொம்புகள்
  rationale: மூலத்தின் கொம்பு உருவகத்தையும் இரும்பால் செய்யப்பட்ட பொருட்கள் என்ற நேரடிப் பொருளையும் காக்கிறது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே சொல்வது இதுதான்
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தை இயல்பான நவீன தமிழில் தருகிறது; יהוה என்பது பட்டமாக மாற்றப்படாமல் இறைப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: בְּאֵלֶּה
  choice: இவற்றால்
  rationale: பன்மையான இரும்புக் கொம்புகளைச் செயலின் கருவிகளாகக் குறிக்கும் ב முன்னிடைச்சொல்லின் கருவிப் பொருளைத் தருகிறது.
- source_word: תְּנַגַּח
  choice: முட்டித் தாக்குவாய்
  rationale: கொம்புள்ள விலங்கு கொம்பால் முட்டித் தாக்குவதைக் குறிக்கும் נגח வினையின் தெளிவான உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: אֶת אֲרָם
  choice: அராமை
  rationale: பிற்காலப் பெயரான ‘சிரியா’ என்பதைப் பயன்படுத்தாமல், மூலத்தின் வரலாற்றுப் பெயரான அராமை நேரடியாகக் காக்கிறது.
- source_word: עַד כַּלּוֹתָם
  choice: அவர்கள் முற்றிலும் அழிக்கப்படும்வரை
  rationale: כלה என்பதிலுள்ள முழுமை/அழிவு கருத்தையும், 3ஆம் நபர் ஆண்பால் பன்மை பின்னொட்டையும் காக்கிறது; அழிப்பவரை மூலத்தைவிட வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: சிதேக்கியாவின் கூற்றின் தீர்க்கதரிசன அதிகாரம்
  choice: ‘யாவே சொல்வது இதுதான்’ என்ற கூற்றை விளக்கமின்றி அப்படியே வைத்தல்
  alternative: அவன் பொய்யாக, ‘யாவே சொல்வது இதுதான்’ என்றான்
  rationale: இவ்வசனம் சிதேக்கியாவின் கூற்றை மட்டும் பதிவு செய்கிறது; அதன் உண்மைத்தன்மை குறித்த சூழல் தீர்ப்பை வசனத்துக்குள் சேர்க்காமல் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முட்டித் தாக்குவாய்’ என்பது கொம்புகளால் நிகழ்த்தப்படும் அடையாளச் செயலின் உயிரோட்டமான உருவகத்தைத் தக்கவைக்கிறது; ‘அராம்’ என்ற ஒருமை நாட்டுப்பெயருக்கும் தொடர்ந்து வரும் பன்மைச் சுட்டுக்கும் இடையிலான மூலத்தின் கூட்டு-மக்கள் சார்ந்த பதற்றம் விளக்கி நீக்கப்படவில்லை.
