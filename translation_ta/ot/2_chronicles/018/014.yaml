base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
translation:
  language: ta
  text: அவன் அரசனிடம் வந்தான். அரசன் அவனிடம், “மிகாயாவே, நாம் போரிடுவதற்காக ராமோத்-கிலேயாத்துக்குப் போகலாமா, அல்லது நான் போகாமல் இருக்கலாமா?” என்று கேட்டான். அதற்கு அவன், “போங்கள், வெற்றி பெறுங்கள்; அவர்கள் உங்கள் கையில் ஒப்புக்கொடுக்கப்படுவார்கள்” என்றான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சுற்றியுள்ள கதைச்சூழலைக் கருத்தில் கொண்டால், மிகாயாவின் பதில் ஏளனமாகவோ கிண்டலாகவோ சொல்லப்பட்டிருக்கலாம்; ஆனால் எபிரெய உரை அந்த ஏளனத் தொனியை வெளிப்படையாகக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: அவன் வந்தான்
  rationale: தொடர்ச்சியாக நிகழும் அடுத்த சம்பவத்தை இயல்பான தமிழ் கதைநடையில் தருகிறது.
- source_word: מִיכָה
  choice: மிகாயா
  rationale: இச்சூழலில் இம்லாவின் மகனான தீர்க்கதரிசியைக் குறிக்கும் பெயரின் தமிழாக்கம்; வேறு தீர்க்கதரிசியான மீகாவுடன் குழப்பம் ஏற்படாமல் உதவுகிறது.
- source_word: הֲנֵלֵךְ
  choice: நாம் ... போகலாமா
  rationale: முதலாம் நபர் பன்மை வினாவையும் ஆலோசனை கேட்கும் நுணுக்கத்தையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: רָמֹת גִּלְעָד
  choice: கிலேயாத்திலுள்ள ராமோத்
  rationale: இடப்பெயரைத் தெளிவாக அடையாளப்படுத்தி, ராமோத் கிலேயாத் என்ற எபிரெயப் பெயரின் உறவையும் காட்டுகிறது.
- source_word: לַמִּלְחָמָה
  choice: போரிடுவதற்காக
  rationale: ל முன்னொட்டின் நோக்கப் பொருளையும் מלחמה என்பதன் போர் சார்ந்த பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִם אֶחְדָּל
  choice: அல்லது நான் போகாமல் இருக்க வேண்டுமா
  rationale: முன்னிருந்த பன்மையான ‘நாம்’ என்பதிலிருந்து எபிரெயத்தில் வரும் ஒருமையான ‘நான்’ என்ற மாற்றத்தைக் காக்கிறது; חדל என்பதன் செயலிலிருந்து விலகியிருத்தல் என்ற பொருளை இச்சூழலில் தெளிவாக்குகிறது.
- source_word: עֲלוּ
  choice: போங்கள்
  rationale: עלה என்பதன் சொற்பொருள் ‘மேலே செல்லுங்கள்’ என்றாலும், ஒரு இடத்தை நோக்கிய படைநகர்வைக் குறிக்கும் இச்சூழலில் ‘போங்கள்’ என்பது இயல்பான தமிழ்.
- source_word: וְהַצְלִיחוּ
  choice: வெற்றி பெறுங்கள்
  rationale: படையெடுப்பில் வெற்றியடைவது என்ற צלח வினையின் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  choice: அவர்கள் உங்கள் கையில் கொடுக்கப்படுவார்கள்
  rationale: எபிரெயத்தின் பன்மை வினையையும் செயப்பாட்டு வடிவையும் காக்கிறது. ‘உங்கள் கையில்’ என்பது ஒருவரது அதிகாரத்திற்குள் ஒப்புக்கொடுக்கப்படுவதைக் குறிக்கும் மூலமொழி உருவகத்தைத் தக்கவைக்கிறது; ‘அவர்கள்’ யார் என்பதை உரை வெளிப்படையாகக் கூறாததால் அதை விளக்கிச் சேர்க்கவில்லை.
theological_decisions:
- issue: மிகாயாவின் பதில் உண்மையான வாழ்த்தா அல்லது ஏளனமான பதிலா
  choice: முதன்மை உரையில் நேர்மறையாகத் தோன்றும் மூலமொழி வாசகத்தை அப்படியே காத்து, ஏளனம் என்பதை வெளிப்படையாகச் சேர்க்கவில்லை
  alternative: ‘ஏளனமாக’ போன்ற சொல்லைச் சேர்த்து பதிலின் தொனியைத் தெளிவுபடுத்துதல்
  rationale: சுற்றியுள்ள கதைச்சூழல் இந்தப் பதில் ஏளனமாக அல்லது கிண்டலாக இருக்கலாம் என்பதை வலுவாக உணர்த்துகிறது; ஆனால் எபிரெய வாசகம் அதனை இலக்கண ரீதியாக வெளிப்படையாகக் குறிக்கவில்லை. எனவே அந்தத் தெளிவின்மையும் கதைத் தளர்ச்சியும் முதன்மை உரையில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கேள்வியில் வரும் ‘நாம்’ என்பதிலிருந்து ‘நான்’ என்பதற்கான மாற்றமும், பதிலில் வரும் பன்மை கட்டளைகளும் பன்மை உடைமை வடிவமும் காக்கப்பட்டுள்ளன. மூலத்தில் குறிப்பிடப்படாத பன்மை எழுவாயை ‘அவர்கள்’ எனத் தெளிவில்லாமலேயே வைத்துள்ளது.
