source:
  edition: WLC
  text: וַ֠/יָּשָׁב יְהוֹשָׁפָ֨ט מֶֽלֶךְ יְהוּדָ֧ה אֶל בֵּית֛/וֹ בְּ/שָׁל֖וֹם לִֽ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/001.yaml
  text: And Jehoshaphat king of Judah returned in peace to his house in Jerusalem[a].
translation:
  language: ta
  text: யூதாவின் அரசனாகிய யோசபாத் எருசலேமிலுள்ள தன் வீட்டுக்குச் சமாதானத்துடன்[a] திரும்பினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாதுகாப்பாக.” “சமாதானத்துடன்” என்ற எபிரெயச் சொற்றொடர் அவர் நலமாகவும் பாதுகாப்பாகவும் திரும்பியதையும் வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பினார்
  rationale: שׁוב என்பதன் கதைநடை வடிவம் மீண்டும் வருதல் அல்லது திரும்பிச் செல்லுதல் என்பதைக் குறிக்கிறது; இச்சூழலில் ‘திரும்பினார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: தமிழ் வேதாகமப் பெயர் மரபில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனாகிய
  rationale: யோசபாத்தின் அரச பதவியைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் இணைப்புத் தொடர்.
- source_word: אֶל בֵּיתוֹ
  choice: தன் வீட்டுக்கு
  rationale: בַּיִת இங்கு சென்றடைந்த இடமான சொந்த வீட்டைக் குறிக்கிறது; எழுவாயையே சுட்டுவதால் ‘தன்’ என்பது தமிழில் இயல்பானது.
- source_word: בְּשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: שָׁלוֹם என்பதில் சமாதானம், நலநிலை, பாதுகாப்பு ஆகிய அர்த்தநிழல்கள் உள்ளன; ‘சமாதானத்துடன்’ மூலமொழியின் நேரடி உருவகத்தைப் பேணுகிறது.
- source_word: לִירוּשָׁלִָם
  choice: எருசலேமிலுள்ள
  rationale: எபிரெய முன்னிடைச்சொல் இலக்கணப்படி ‘எருசலேமுக்கு’ என இருந்தாலும், ‘தன் வீட்டுக்கு’ என்பதுடன் தமிழில் இயல்பாக இணைக்க, வீடு எருசலேமில் இருப்பதை ‘எருசலேமிலுள்ள’ என வெளிப்படுத்துகிறது.
