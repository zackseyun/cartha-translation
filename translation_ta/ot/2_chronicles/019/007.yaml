source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהִ֥י פַֽחַד יְהוָ֖ה עֲלֵי/כֶ֑ם שִׁמְר֣וּ וַ/עֲשׂ֔וּ כִּֽי אֵ֞ין עִם יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַוְלָ֛ה וּ/מַשֹּׂ֥א פָנִ֖ים וּ/מִקַּח שֹֽׁחַד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/007.yaml
  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
translation:
  language: ta
  text: இப்போது ஆகையால், யாவே பற்றிய பயம் உங்கள்மேல் இருக்கட்டும். கவனமாக இருங்கள்; செயல்படுங்கள். ஏனெனில் நம் கடவுளான யாவேயிடம் அநீதியோ, பாரபட்சமோ[a], கையூட்டு வாங்குதலோ இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லர்த்தமாக, “முகங்களை உயர்த்துதல்”; இது ஒருவரைப் பார்த்துப் பாரபட்சம் அல்லது தனிச்சலுகை காட்டுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: இந்தச் சொல் முந்தைய அறிவுறுத்தலிலிருந்து இப்போதைய முடிவான அறிவுரைக்கு நகர்த்துகிறது; தமிழில் ‘இப்போது’ இயல்பாக அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  choice: யாவே குறித்த பயம் உங்கள்மேல் இருப்பதாக
  rationale: יְהִי என்பதன் அறிவுறுத்தல்/விருப்பப் பொருளை ‘இருப்பதாக’ காக்கிறது. פַחַד என்பதைக் ‘பயம்’ என்று நேரடியாக மொழிபெயர்த்து, அது வெறும் திகிலா அல்லது பயபக்தியுடன் கூடிய அச்சமா என்பதைக் கருத்துரையாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: שִׁמְרוּ וַעֲשׂוּ
  choice: கவனமாயிருந்து செயல்படுங்கள்
  rationale: நீதிபதிகளுக்கான சூழலில் שִׁמְרוּ விழிப்பான கவனத்தையும், וַעֲשׂוּ அதற்கேற்ற நடைமுறைச் செயலையும் வலியுறுத்துகின்றன.
- source_word: כִּי אֵין עִם יְהוָה אֱלֹהֵינוּ
  choice: ஏனெனில் நம் கடவுளாகிய யாவேயிடம் ... இல்லை
  rationale: עִם என்பதன் ‘உடன்/இடம்’ சார்ந்த எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் ‘யாவேயிடம்’ எனத் தருகிறது; இவை அவரில் காணப்படுவதில்லை என்ற கருத்தும் காக்கப்படுகிறது.
- source_word: עַוְלָה
  choice: அநீதி
  rationale: நீதித்துறைச் சூழலில் ஒழுக்க மற்றும் நீதி மீறலைத் துல்லியமாகக் குறிக்கிறது.
- source_word: מַשֹּׂא פָנִים
  choice: பாரபட்சம்
  rationale: சொல்லர்த்தத்தில் ‘முகத்தை உயர்த்துதல்’ என்ற இந்த மரபுத்தொடர், ஒருவரின் நிலை அல்லது அடையாளத்தைப் பார்த்துச் சலுகை காட்டுவதைக் குறிக்கிறது; ‘பாரபட்சம்’ நவீனத் தமிழில் தெளிவான இணைச்சொல்.
- source_word: מִקַּח שֹׁחַד
  choice: கையூட்டு வாங்குதல்
  rationale: கையூட்டைப் பெற்றுக்கொள்ளும் செயலைக் குறிக்கும் பெயர்ச்சொல் கட்டமைப்பைத் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைநாமத்தை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் அதன் பெயரொலிப்பாக வழங்குகிறது.
theological_decisions:
- issue: இறைநாமமான יְהוָה-ஐ மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைநாமத்தை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டமாக மாற்றாமல் பெயராகக் காக்கும் பரவலான ஒலிபெயர்ப்பு.
- issue: פַחַד יְהוָה என்பதன் உணர்வுநிலை
  choice: யாவே குறித்த பயம்
  alternative: யாவேமீதான பயபக்தி
  rationale: சூழலில் பயபக்தி உட்பொருளாக இருக்கலாம்; எனினும் פַחַד என்பதன் வலுவான ‘பயம்/அச்சம்’ கூறை மென்மையாக்காமல், மூலத்தின் இறையியல் அழுத்தத்தையும் பொருள் அகலத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீதித்துறைச் சூழலுக்கேற்ற ‘அநீதி’, ‘பாரபட்சம்’, ‘கையூட்டு’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் மூன்று மறுப்புகளும் இணையான அமைப்பில் காக்கப்பட்டுள்ளன.
