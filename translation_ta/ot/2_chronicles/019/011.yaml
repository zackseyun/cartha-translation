  revised_text: இதோ, தலைமை ஆசாரியரான அமரியா[a], யாவேக்குரிய ஒவ்வொரு காரியத்திலும் உங்கள்மேல் பொறுப்பாக இருப்பார்; இஸ்மவேலின் மகனும் யூதா வீட்டாரின் தலைவருமான செபதியா, அரசனுக்குரிய ஒவ்வொரு காரியத்திற்கும் பொறுப்பாக இருப்பார். லேவியர்கள் உங்கள் முன்னிலையில் அலுவலர்களாக இருப்பார்கள். திடன்கொண்டு செயல்படுங்கள்; நல்லவருடன் யாவே இருப்பாராக[b].
