  terminology: யாவே, அமரியா, செபதியா, லேவியர்கள் ஆகிய பெயர்களும் முக்கியச் சொற்களும் ஏற்றவையே. כֹהֵן הָרֹאשׁ-க்கு ‘தலைமை ஆசாரியர்’ பொருத்தமானது; ‘பிரதான ஆசாரியர்’ என்பதை மாற்றாக அடிக்குறிப்பில் வைப்பது சரியானது. இறுதி וִיהִי-யின் வாழ்த்துரை வலிமையை ‘இருப்பாராக’ காக்கிறது.
