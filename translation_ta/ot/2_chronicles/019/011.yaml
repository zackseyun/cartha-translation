base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
translation:
  language: ta
  text: இதோ, தலைமை ஆசாரியரான அமரியா[a], யாவேக்குரிய ஒவ்வொரு காரியத்திலும் உங்கள்மேல் பொறுப்பாக இருப்பார்; இஸ்மவேலின் மகனும் யூதா வீட்டாரின் தலைவருமான செபதியா, அரசனுக்குரிய ஒவ்வொரு காரியத்திற்கும் பொறுப்பாக இருப்பார். லேவியர்கள் உங்கள் முன்னிலையில் அலுவலர்களாக இருப்பார்கள். திடன்கொண்டு செயல்படுங்கள்; நல்லவருடன் யாவே இருப்பாராக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிரதான ஆசாரியர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நன்மை செய்பவருடன் யாவே இருப்பாராக’ அல்லது ‘நல்லவருடன் யாவே இருப்பார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியீட்டின் வலிமையை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
- source_word: כֹהֵן הָרֹאשׁ
  choice: தலைமை ஆசாரியர்
  rationale: சொல்லுக்குச் சொல் பொருளான ‘தலையான ஆசாரியர்’ என்பதையும் நிர்வாகச் சூழலிலுள்ள முதன்மைப் பொறுப்பையும் தருகிறது; அதிக தொழில்நுட்பப் பதவிச் சாயலைத் தவிர்க்கிறது.
- source_word: עֲלֵיכֶם
  choice: உங்களுக்கு மேற்பார்வையாளராக இருப்பார்
  rationale: நீதித்துறை மற்றும் நிர்வாகச் சூழலில் உள்ள அதிகாரத்தையும் பொறுப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְכֹל דְּבַר יְהוָה
  choice: யாவேக்குரிய ஒவ்வொரு காரியத்திலும்
  rationale: דָּבָר என்பதன் பரந்த ‘காரியம்/வழக்கு’ பொருளைத் தக்கவைத்து, மதச் சார்ந்த வழக்குகள் என்று அளவுக்கு மீறிக் குறுக்கவில்லை.
- source_word: הַנָּגִיד לְבֵית יְהוּדָה
  choice: யூதா வம்சத்தின் தலைவர்
  rationale: נָגִיד என்பதன் தலைமைப் பொருளையும் בֵּית יְהוּדָה என்பதிலுள்ள வம்ச/குடும்பக் கருத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  choice: லேவியர்கள் உங்கள் முன்னிலையில் அலுவலர்களாக இருப்பார்கள்
  rationale: שֹׁטְרִים என்பதன் நிர்வாக அலுவலர் பொருளையும், நீதிபதிகளுக்கு முன்பாக இருந்து உதவும் பணியையும் தக்கவைக்கிறது.
- source_word: חִזְקוּ וַעֲשׂוּ
  choice: திடன்கொண்டு செயல்படுங்கள்
  rationale: ஒப்படைக்கப்பட்ட கடமையைத் துணிவுடன் நிறைவேற்றும்படி கூறும் சுருக்கமான கட்டளையை இயல்பாக வழங்குகிறது.
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  choice: நல்லவருடன் யாவே இருப்பாராக
  rationale: וִיהִי என்பதன் வாழ்த்துரை/விருப்ப வினை வலிமையையும் הַטּוֹב என்பதன் சுருக்கமான substantival பயன்பாட்டையும் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்திலுள்ள உடன்படிக்கைப் பெயரை பொதுவாக ஏற்றுக்கொள்ளப்படும் தமிழ் ஒலிபெயர்ப்பில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: כֹהֵן הָרֹאשׁ என்பது தொழில்நுட்பப் பதவியான ‘பிரதான ஆசாரியர்’ என மொழிபெயர்க்கப்பட வேண்டுமா?
  choice: தலைமை ஆசாரியர்
  alternative: பிரதான ஆசாரியர்
  rationale: எபிரெய சொற்றொடர் நேரடியாக ‘தலையான/தலைமை ஆசாரியர்’ என்று பொருள்படுகிறது. இங்கு வலியுறுத்தப்படுவது நிர்வாக மேற்பார்வை என்பதால், தொழில்நுட்பப் பதவியை அவசியமின்றி முன்வைக்கவில்லை.
- issue: הַטּוֹב என்பது ‘நல்லது’ என்பதையா அல்லது ‘நல்லவர்’ என்பதையா குறிக்கிறது?
  choice: நல்லவருடன்
  alternative: நன்மை செய்பவருடன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஒருமை அடைமொழி சூழலில் நல்ல மனிதரைச் சுட்டுவது இயல்பு. ஆனால் அது நன்மை செய்கிறவரைக் குறிக்கும் பொதுவான சொல்லாகவும் புரியலாம்; மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: וִיהִי என்பது வாழ்த்துரையா அல்லது எதிர்கால உறுதியுரையா?
  choice: யாவே இருப்பாராக
  alternative: யாவே இருப்பார்
  rationale: இறுதி ஊக்கவுரையின் சூழலில் jussive வாழ்த்துரை இயல்பானது; இருப்பினும் எபிரெய வடிவத்தை எதிர்கால உறுதியாகவும் புரிந்துகொள்ள முடியும் என்பதால் அடிக்குறிப்பில் மாற்று தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. நிர்வாகச் சூழலைத் தெளிவுபடுத்த ‘மேற்பார்வையாளர்’, ‘அலுவலர்’ ஆகிய தற்போதைய சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் இணையான இரண்டு அதிகாரத் துறைகளும் வாக்கிய அமைப்பில் பாதுகாக்கப்பட்டுள்ளன.
