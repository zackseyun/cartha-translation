id: 2CH.19.9
reference: 2 Chronicles 19:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְצַ֥ו עֲלֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּ֤ה תַעֲשׂוּ/ן֙ בְּ/יִרְאַ֣ת יְהוָ֔ה בֶּ/אֱמוּנָ֖ה וּ/בְ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/009.yaml
  text: And he commanded them[a], saying, “Thus you shall act in the fear of Yahweh[d][c][b], in faithfulness and with a whole heart.”
translation:
  language: ta
  text: அவர் அவர்களுக்குக் கட்டளையிட்டு, “யாவேக்குப் பயந்து[a], உண்மையுடனும் முழு இருதயத்துடனும்[b] இவ்வாறு செயல்படுங்கள்” என்று சொன்னார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேக்குப் பயந்து” என்பதை “யாவேமீது பயபக்தியுடன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “பிளவுபடாத இருதயத்துடன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם לֵאמֹר
  choice: அவர் அவர்களுக்குக் கட்டளையிட்டுச் சொன்னது
  rationale: צוה என்பதன் கட்டளையிடுதல் என்ற நேரடியான பொருளையும், לֵאמֹר அறிமுகப்படுத்தும் நேர்க் கூற்றையும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: כֹּה תַעֲשׂוּן
  choice: இவ்வாறு செயல்படுங்கள்
  rationale: עשה என்பதன் பரந்த ‘செய்/செயல்படு’ பொருளில், நீதிபதிகளுக்கான ஒழுக்க மற்றும் பணிசார் அறிவுறுத்தலுக்கு ‘செயல்படுங்கள்’ பொருத்தமானது; כֹּה என்பது ‘இவ்வாறு’ எனப் பாதுகாக்கப்படுகிறது.
- source_word: בְּיִרְאַת יְהוָה
  choice: யாவேக்குப் பயந்து
  rationale: יראה குறிக்கும் பயபக்தியுள்ள அச்சத்தைத் தக்கவைத்தபடி, தமிழில் இயல்பான வினையெச்ச வடிவில் வழங்குகிறது. יְהוָה தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: בֶּאֱמוּנָה
  choice: உண்மையோடு
  rationale: இந்த நீதித்துறைச் சூழலில் אֱמוּנָה என்பது உள்ளார்ந்த நம்பிக்கையைவிட நம்பகத்தன்மை, நேர்மை, கடமைத் தவறாமை ஆகியவற்றைச் சுட்டுகிறது; ‘உண்மையோடு’ அந்தச் செயற்பாட்டு நெறியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: முழு இருதயத்தோடு
  rationale: לֵבָב שָׁלֵם என்பதன் முழுமையான, பிளவுபடாத உள்ளார்ந்த ஈடுபாடு என்ற உருவகத்தைச் சுருக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய உரையில் உள்ள நான்கெழுத்து இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- issue: אֱמוּנָה என்பதன் சூழல்சார் பொருள்
  choice: உண்மையோடு
  alternative: விசுவாசத்தோடு / நேர்மையோடு
  rationale: நீதிபதிகள் தங்கள் கடமையை எவ்வாறு நிறைவேற்ற வேண்டும் என்பதே சூழல்; ஆகவே கோட்பாட்டுச் சார்ந்த ‘விசுவாசம்’ என்பதைவிட உண்மைத்தன்மையும் நம்பகமான நடத்தையும் முன்னிறுத்தப்படுகிறது.
- issue: לֵבָב שָׁלֵם என்பதன் கருத்து
  choice: முழு இருதயத்தோடு
  alternative: பிளவுபடாத இருதயத்தோடு
  rationale: ‘முழு’ என்பது எபிரெய உருவகத்தையும் அதன் முழுமை/ஒருமுக ஈடுபாடு என்ற விரிவையும் தக்கவைக்கிறது; மாற்று அதன் ஒரு சாத்தியமான விளக்கத்தை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைக்குரிய தமிழ் நடை. நீதித்துறைச் சூழலுக்கேற்ற கட்டளைத் தொனி தக்கவைக்கப்பட்டுள்ளது; ‘பயம்’ என்பதன் வேதாகமத் தீவிரம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, ‘பயபக்தி’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
