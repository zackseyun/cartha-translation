revisions:
- from: அவர் தேசத்தில்[a], யூதாவின் அரண்செய்யப்பட்ட நகரங்கள் அனைத்திலும், ஒவ்வொரு நகரமாக நீதிபதிகளை நியமித்தார்.
  to: அவர் நாட்டில்[a], யூதாவின் அரண்களால் பாதுகாக்கப்பட்ட எல்லா நகரங்களிலும், நகரந்தோறும் நீதிபதிகளை நியமித்தார்.
  rationale: The revision retains every source element and the English audit trail’s lexical alternative. It replaces an unnatural distributive construction with ‘நகரந்தோறும்’ and uses clearer modern Tamil for ‘fortified,’ without altering the scope or meaning of the appointments.
