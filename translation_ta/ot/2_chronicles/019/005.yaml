  text: וַ/יַּעֲמֵ֨ד שֹֽׁפְטִ֜ים בָּ/אָ֗רֶץ בְּ/כָל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת לְ/עִ֥יר וָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/005.yaml
  text: And he appointed judges in the land[a], in all the fortified cities of Judah, city by city.
translation:
  language: ta
  text: அவர் நாட்டில்[a], யூதாவின் அரண்களால் பாதுகாக்கப்பட்ட எல்லா நகரங்களிலும், நகரந்தோறும் நீதிபதிகளை நியமித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாடு முழுவதிலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: நியமித்தார்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் ஒருவரைப் பதவியில் அமர்த்துவதைக் குறிக்கிறது; உடலளவில் நிற்கச் செய்வதை அல்ல.
- source_word: שֹׁפְטִים
  choice: நீதிபதிகளை
  rationale: இச்சொல் நீதி விசாரணை செய்யும் அதிகாரிகளைக் குறிக்கிறது; நவீனத் தமிழில் ‘நீதிபதிகள்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: בָּאָרֶץ
  choice: தேசத்தில்
  rationale: இந்தச் சொற்றொடர் நியமனங்கள் நடைபெற்ற நிலப்பரப்பைக் குறிப்பிடுகிறது. அடுத்த சொற்றொடர் அதன் பரவலை விளக்குவதால், எபிரெய அமைப்புக்கு நெருக்கமான ‘தேசத்தில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: யூதாவின் ... நகரங்கள் அனைத்திலும்
  rationale: யூதாவிலுள்ள எல்லா நகரங்களையும் உள்ளடக்கிய பரப்பைத் தமிழில் இயல்பாகவும் முழுமையாகவும் தெரிவிக்கிறது.
- source_word: הַבְּצֻרוֹת
  choice: அரண்செய்யப்பட்ட
  rationale: நகரங்கள் பாதுகாப்பு அரண்களால் வலுப்படுத்தப்பட்டிருந்ததைக் குறிக்கிறது; ‘அரண்செய்யப்பட்ட நகரங்கள்’ துல்லியமான, கண்ணியமான தமிழ் வழக்கு.
- source_word: לְעִיר וָעִיר
  choice: ஒவ்வொரு நகரமாக
  rationale: மூலத்தின் பகிர்வுப் பொருளையும், நகரந்தோறும் தனித்தனியாக நடந்த நியமனத்தையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நிர்வாக மற்றும் நீதித்துறைச் சூழலைத் தெளிவாக வைத்தபடியே எபிரெய வசனத்தின் சொற்றொடர் வரிசையும் பகிர்வுப் பொருளும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
