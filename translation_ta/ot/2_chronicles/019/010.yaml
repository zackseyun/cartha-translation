base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
translation:
  language: ta
  text: தங்கள் நகரங்களில் வாழும் உங்கள் சகோதரர்களிடமிருந்து எந்த வழக்கு உங்கள்முன் வந்தாலும்—அது இரத்தத்துக்கும் இரத்தத்துக்கும் இடையிலானதாயினும்[a], சட்டத்துக்கும் கட்டளைக்கும், சட்டதிட்டங்களுக்கும் நீதிநியமங்களுக்கும் இடையிலானதாயினும்—யாவேக்கு முன்பாக அவர்கள் குற்றவாளிகளாகாதபடி அவர்களை எச்சரியுங்கள். இல்லையெனில் உங்கள்மேலும் உங்கள் சகோதரர்கள்மேலும் கடுங்கோபம் வரும். இவ்வாறு செய்யுங்கள்; அப்போது நீங்கள் குற்றவாளிகளாக மாட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “இரத்தத்துக்கும் இரத்தத்துக்கும் இடையில்.” இது இரத்தம் சிந்துதல் அல்லது கொலை தொடர்பான வழக்குகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: வழக்கு
  rationale: நீதித்துறைச் சூழலில் சட்டரீதியாக விசாரிக்கப்படும் சர்ச்சை அல்லது வழக்கை இயல்பான தமிழில் குறிக்கிறது.
- source_word: יָבוֹא עֲלֵיכֶם
  choice: உங்கள்முன் வந்தாலும்
  rationale: ஒரு வழக்கு நீதிபதிகளின் விசாரணைக்கு வருவதைத் தெரிவிக்கும் நீதித்துறை வழக்குச்சொல்.
- source_word: מֵאֲחֵיכֶם
  choice: உங்கள் சகோதரர்களிடமிருந்து
  rationale: உடன்படிக்கைச் சமூகத்தினரைக் குறிக்கும் மூலமொழியின் உறவுமுறைச் சொல்லைத் தக்கவைக்கிறது.
- source_word: הַיֹּשְׁבִים בְּעָרֵיהֶם
  choice: தங்கள் நகரங்களில் வாழ்கிற
  rationale: பங்கேற்பு வினைச்சொல் தொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: בֵּין דָּם לְדָם
  choice: இரத்தத்துக்கும் இரத்தத்துக்கும் இடையிலான
  rationale: தெளிவாகத் தீர்க்க முடியாத சுருக்கமான எபிரெயச் சட்டத் தொடரை முதன்மை உரையில் அப்படியே காக்கிறது; சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֵּין תּוֹרָה לְמִצְוָה לְחֻקִּים וּלְמִשְׁפָּטִים
  choice: சட்டத்துக்கும் கட்டளைக்கும், சட்டதிட்டங்களுக்கும் நீதிநியமங்களுக்கும் இடையிலான
  rationale: சட்டப் போதனையின் வெவ்வேறு வகைகளை ஒரே பொதுச்சொல்லாகத் தட்டையாக்காமல் தமிழில் வேறுபடுத்துகிறது.
- source_word: וְהִזְהַרְתֶּם אֹתָם
  choice: அவர்களை எச்சரியுங்கள்
  rationale: தவறையும் அதனால் வரும் குற்றப்பொறுப்பையும் தவிர்க்கச் செய்யும் எச்சரிப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: יֶאְשְׁמוּ לַיהוָה
  choice: யாவேக்கு முன்பாகக் குற்றவாளிகள் ஆகாதபடி
  rationale: אשׁם என்பதிலுள்ள குற்றப்பொறுப்பையும் யாவேக்கு முன்பான கணக்கொப்புவிப்பையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல் எபிரெயத் திருப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: קֶצֶף
  choice: கடுங்கோபம்
  rationale: உடன்படிக்கை மீறுதலுக்கான இறைத் தீர்ப்பின் தீவிரத்தைக் காட்டும் இயல்பான தமிழ்ச் சொல்.
- source_word: כֹּה תַעֲשׂוּן
  choice: இவ்வாறு செய்யுங்கள்
  rationale: முந்தைய நீதித்துறை அறிவுறுத்தலைச் சுருக்கிக் குறிப்பிடும் கட்டளையை இயல்பாக வழங்குகிறது.
- source_word: וְלֹא תֶאְשָׁמוּ
  choice: நீங்கள் குற்றவாளிகள் ஆகமாட்டீர்கள்
  rationale: முன்னர் வந்த אשׁם என்பதுடன் சொல்லிணக்கத்தைத் தக்கவைத்து விளைவைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: אֲחֵיכֶם என்ற உடன்படிக்கைச் சமூக உறவுமுறை மொழி
  choice: உங்கள் சகோதரர்களிடமிருந்து
  alternative: உங்கள் சக இஸ்ரயேலரிடமிருந்து
  rationale: மூலத்தின் ஆண்பால் பன்மை உறவுமுறை உருவகத்தைத் தக்கவைக்கிறது; அதை விளக்கமாக விரிவுபடுத்தவில்லை.
- issue: יְהוָה என்ற இறைப்பெயர்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையிலுள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் பதிலிடாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בֵּין דָּם לְדָם என்ற தெளிவற்ற சட்டத் தொடர்
  choice: இரத்தத்துக்கும் இரத்தத்துக்கும் இடையிலான
  alternative: இரத்தம் சிந்துதல் தொடர்பான வழக்குகள்
  rationale: உரையின் உண்மையான சுருக்கத்தையும் பொருள் தெளிவின்மையையும் முதன்மை உரையில் காத்து, சாத்தியமான விளக்கத்தை அடிக்குறிப்பில் மட்டும் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நீதித்துறைச் சூழலுக்கேற்ற கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நீண்ட நிபந்தனை அமைப்பு வாசிப்புத் தெளிவுக்காக நிறுத்தக்குறிகளாலும் இரண்டு வாக்கியங்களாலும் ஒழுங்குபடுத்தப்பட்டுள்ளது; சட்டப் பதங்களின் வேறுபாடும் இறையியல் பதற்றமும் காக்கப்பட்டுள்ளன.
