- from: 'தங்கள் நகரங்களில் வாழ்கிற உங்கள் சகோதரர்களிடமிருந்து எந்த வழக்கு உங்கள்முன் வந்தாலும்—அது இரத்தத்துக்கும் இரத்தத்துக்கும் இடையிலானதாயினும்[a], சட்டத்துக்கும் கட்டளைக்கும், சட்டதிட்டங்களுக்கும் நீதிநியமங்களுக்கும் இடையிலானதாயினும்—அவர்கள் யாவேக்கு முன்பாகக் குற்றவாளிகள் ஆகாதபடி அவர்களை எச்சரியுங்கள். இல்லையெனில் உங்கள்மேலும் உங்கள் சகோதரர்கள்மேலும் கடுங்கோபம் வரும். இவ்வாறு செய்யுங்கள்; அப்போது நீங்கள் குற்றவாளிகள் ஆகமாட்டீர்கள்.


