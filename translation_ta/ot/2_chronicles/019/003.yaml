source:
  edition: WLC
  text: אֲבָ֕ל דְּבָרִ֥ים טוֹבִ֖ים נִמְצְא֣וּ עִמָּ֑/ךְ כִּֽי בִעַ֤רְתָּ הָ/אֲשֵׁרוֹת֙ מִן הָ/אָ֔רֶץ וַ/הֲכִינ֥וֹתָ לְבָבְ/ךָ֖ לִ/דְרֹ֥שׁ הָֽ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
translation:
  language: ta
  text: ஆனாலும், உன்னிடம் நல்லவை காணப்பட்டுள்ளன. ஏனெனில், நீ நாட்டிலிருந்து அசேரா சின்னங்களை[a] ஒழித்து, கடவுளைத் தேடுவதற்கு உன் உள்ளத்தை ஆயத்தப்படுத்தினாய்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “அசேரோத்”; அசேரா என்னும் தேவியுடன் தொடர்புடைய வழிபாட்டுச் சின்னங்கள் அல்லது பொருட்கள்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “கடவுளைத் தேட உன் உள்ளத்தை உறுதிப்படுத்தினாய்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: ஆனாலும்
  rationale: முந்தைய கண்டிப்புக்கு எதிராக இப்போது வரும் பாராட்டைச் சலுகைமிகு முரண்பாடாக இயல்பாகக் குறிக்கிறது.
- source_word: דְּבָרִים טוֹבִים
  choice: நல்லவை
  rationale: சொற்றொடரின் பரந்த பொருளைத் தக்கவைத்து, அதைச் செயல்களுக்கு மட்டும் சுருக்காமல் உள்ளது.
- source_word: נִמְצְאוּ עִמָּךְ
  choice: உன்னிடம் ... காணப்பட்டுள்ளன
  rationale: எபிரெயப் பயனிலையைத் தமிழில் இயல்பாகப் பிரதிபலித்து, யோசபாத்திடம் பாராட்டத்தக்கவை இருப்பது கண்டறியப்பட்டதைக் குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பாராட்டுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: בִעַרְתָּ
  choice: ஒழித்து
  rationale: எரித்தல் என்ற முறையைத் தேவையின்றி நிர்ணயிக்காமல், வழிபாட்டுச் சின்னங்களைத் தீர்மானமாக அகற்றிய பொருளை வெளிப்படுத்துகிறது.
- source_word: הָאֲשֵׁרוֹת
  choice: அசேரா சின்னங்கள்
  rationale: அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; அவை எப்போதும் குறிப்பாகத் தூண்களே என்று மிகையாக நிர்ணயிப்பதைத் தவிர்க்கிறது.
- source_word: מִן הָאָרֶץ
  choice: நாட்டிலிருந்து
  rationale: அந்த நிலப்பரப்பிலிருந்து அவை அகற்றப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַהֲכִינוֹתָ לְבָבְךָ
  choice: உன் உள்ளத்தை ஆயத்தப்படுத்தினாய்
  rationale: இதயம் அல்லது உள்ளத்தைத் தயாராக்குதல் என்ற உருவகத்தையும், நோக்கமுள்ள உள்ளார்ந்த தீர்மானத்தையும் தக்கவைக்கிறது.
- source_word: לִדְרֹשׁ הָאֱלֹהִים
  choice: கடவுளைத் தேடுவதற்கு
  rationale: வெறும் தகவல் விசாரிப்பை விட, கடவுளை நாடி அவர்பால் திரும்பும் நாளாகமத்தின் பரந்த இறையியல் கருத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: הָאֲשֵׁרוֹת என்பதன் பொருள்
  choice: அசேரா சின்னங்கள்
  alternative: அசேரா தூண்கள் / அசேரோத்
  rationale: இவை அசேரா வழிபாட்டுடன் தொடர்புடைய வழிபாட்டுப் பொருட்கள் என்பதை வாசகர் புரிந்துகொள்ள உதவுகிறது; அவற்றின் துல்லியமான வடிவத்தை மூலமொழி உறுதியாகக் குறிப்பிடாததால் ‘தூண்கள்’ என்று மட்டும் குறுக்கவில்லை.
- issue: לִדְרֹשׁ הָאֱלֹהִים என்பதன் பொருள்
  choice: கடவுளைத் தேடுதல்
  alternative: கடவுளிடம் விசாரித்தல்
  rationale: நாளாகமத்தில் இச்சொற்றொடர் தகவல் கேட்பதை மட்டும் அல்லாமல், கடவுளை நாடும் முழுமையான மனநிலையையும் பக்திசார் நோக்கத்தையும் குறிக்கிறது.
- issue: לְבָבְךָ என்பதன் உருவகம்
  choice: உன் உள்ளம்
  alternative: உன் இதயம் / உன் மனம்
  rationale: உடல் உறுப்பை மட்டும் சுட்டாமல், சிந்தனை, விருப்பம், தீர்மானம் ஆகியவற்றின் மையத்தைக் குறிக்கும் எபிரெய உருவகத்தின் பரப்பை இயல்பான தமிழில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் மதிப்புமிக்க நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நல்லவை’ என்பது மூலத்தின் பரந்த பொருளைக் காக்கிறது; ‘அசேரா சின்னங்கள்’ பண்பாட்டுச் சூழலை அடிக்குறிப்புடன் விளக்குகிறது. கொடுக்கப்பட்ட ஆங்கில ஆலோசனை உரையில் அடிக்குறிப்பு குறியீடுகள் தவறான இடங்களில் இருந்ததால், தமிழில் அவை தொடர்புடைய சொற்றொடர்களுக்குப் பின் சரியாக வைக்கப்பட்டுள்ளன.
