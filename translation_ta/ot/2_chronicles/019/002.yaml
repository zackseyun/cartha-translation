revisions:
- from: அனானியின் மகனான தரிசனக்காரர் யெகூ அவரைச் சந்திக்கப் புறப்பட்டுச் சென்று, யோசபாத் அரசனிடம், “தீயவனுக்கு நீர் உதவுவதும், யெகோவாவை வெறுப்பவர்கள்மேல் அன்புகூருவதும் தகுமா? இதனால் யெகோவாவின் சந்நிதியிலிருந்து உம்மேல் கடுங்கோபம் வந்திருக்கிறது” என்றார்.
