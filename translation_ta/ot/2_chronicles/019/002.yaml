source:
  edition: WLC
  text: וַ/יֵּצֵ֣א אֶל פָּנָ֗י/ו יֵה֣וּא בֶן חֲנָ֘נִי֮ הַ/חֹזֶה֒ וַ/יֹּ֨אמֶר֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹשָׁפָ֔ט הֲ/לָ/רָשָׁ֣ע לַ/עְזֹ֔ר וּ/לְ/שֹׂנְאֵ֥י יְהוָ֖ה תֶּאֱהָ֑ב וּ/בָ/זֹאת֙ עָלֶ֣י/ךָ קֶּ֔צֶף מִ/לִּ/פְנֵ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
translation:
  language: ta
  text: அனானியின் மகனான தரிசனக்காரர் யெகூ அவரைச் சந்திக்கப் புறப்பட்டுச் சென்று, யோசபாத் அரசனிடம், “தீயவனுக்கு நீர் உதவி செய்து, யாவேவை வெறுப்பவர்களை நேசிப்பது தகுமா? இதனால், யாவேயின் சந்நிதியிலிருந்து கோபம் உம்மேல் இருக்கிறது” என்றார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא אֶל־פָּנָיו
  choice: அவரைச் சந்திக்கப் புறப்பட்டுச் சென்று
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘அவருடைய முகத்திற்கு/முன்னிலைக்கு வெளியே சென்றார்’ என்பதாக இருந்தாலும், சூழலில் ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கிறது. இயல்பான தமிழில் இந்த நிகழ்ச்சிச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַחֹזֶה
  choice: தரிசனக்காரர்
  rationale: חֹזֶה என்பது தீர்க்கதரிசனப் பணியுடன் தொடர்புடைய தனிப்பட்ட பட்டம். பொதுவான ‘தீர்க்கதரிசி’ என்பதைக் காட்டிலும் ‘தரிசனக்காரர்’ அதன் காணுதல் சார்ந்த சொற்பொருள் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: הֲלָרָשָׁע לַעְזֹר
  choice: தீயவனுக்கு நீர் உதவுவதும் ... தகுமா?
  rationale: கேள்வித்துகள் மற்றும் தொழிற்பெயர் இணைந்து கண்டனக் கேள்வியை உருவாக்குகின்றன. பெயரடையுடன் வரும் உருபு இங்கு ஒரு குறிப்பிட்ட தீய மனிதனைக் குறிப்பதோடு, அவனை ‘தீயவன்’ என்ற ஒழுக்க வகையின்கீழ் சுட்டுகிறது; சூழலை மீறி ஆகாபின் பெயரைச் சேர்க்கவில்லை.
- source_word: וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב
  choice: யெகோவாவை வெறுப்பவர்கள்மேல் அன்புகூருவதும்
  rationale: שֹׂנְאֵי என்பதன் வினைத் தன்மையை ‘வெறுப்பவர்கள்’ என்று நேரடியாகப் பாதுகாக்கிறது; ‘பகைவர்கள்’ என்ற விளக்கமிகு பெயர்ச்சொல்லைத் தவிர்க்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ஒரு பட்டமாக மாற்றாமல் தமிழில் நிலைபெற்றுள்ள தனிப்பெயர் வடிவில் தருகிறது.
- source_word: וּבָזֹאת
  choice: இதனால்
  rationale: முந்தைய செயலே தொடர்ந்து கூறப்படும் தெய்வீகக் கோபத்திற்கான காரணம் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: עָלֶיךָ קֶּצֶף
  choice: உம்மேல் கடுங்கோபம் வந்திருக்கிறது
  rationale: קֶצֶף குறிக்கும் தீவிரமான தெய்வீகக் கோபத்தையும் עָלֶיךָ என்ற ‘உம்மேல்’ அமைப்பையும் காக்கிறது. தமிழில் நிலைபெற்ற விளைவைக் காட்ட ‘வந்திருக்கிறது’ இயல்பாக உள்ளது.
- source_word: מִלִּפְנֵי יְהוָה
  choice: யெகோவாவின் சந்நிதியிலிருந்து
  rationale: ‘யெகோவாவின் முன்னிலையிலிருந்து’ என்ற எபிரெய உருவகத்தை இயல்பான, கண்ணியமான தமிழில் ‘சந்நிதியிலிருந்து’ எனக் காக்கிறது; கோபத்தின் மூலம் யெகோவா என்பதைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் திருநாமத்தைப் பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது. ‘யெகோவா’ சாதாரண தமிழ் வேதாகம வாசகர்களிடையே பரவலாக அறியப்படும் வடிவம்.
- issue: הָרָשָׁע என்பதன் குறிப்பெல்லை
  choice: தீயவன் என்ற ஒழுக்க வகையைக் காத்து, ஆகாபின் பெயரை உரையில் சேர்க்கவில்லை
  alternative: ஆகாப்; தீயவர்கள்
  rationale: வரலாற்றுச் சூழல் ஆகாபைக் குறிப்பதாக இருந்தாலும், மூல உரை பெயரைச் சொல்லாமல் ஒழுக்க மதிப்பீட்டையே முன்வைக்கிறது. ஒருமை வடிவையும் அதன் சூழல்சார் குறிப்பையும் காக்கிறது.
- issue: ‘வெறுப்பவர்கள்’ மற்றும் யோசபாத்தின் ‘அன்பு’
  choice: மூலத்தின் கூர்மையான எதிர்மறை இணைப்பை அப்படியே வைத்தல்
  alternative: யெகோவாவின் பகைவர்களுடன் நட்புகொள்ளுதல்
  rationale: ‘அன்புகூருதல்’ என்பது கூட்டணி அல்லது ஆதரவு என்பதை விளக்கிப் பரப்பாமல், אהב என்ற மூல வினையின் வலிமையையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
- issue: கோபத்தின் தற்போதைய நிலை
  choice: உம்மேல் கடுங்கோபம் வந்திருக்கிறது
  alternative: உம்மேல் கடுங்கோபம் வரும்
  rationale: எபிரெய உரையில் வெளிப்படையான எதிர்கால வினை இல்லை; ‘உம்மேல் கோபம்’ என்ற நிலைமொழி அமைப்பு உள்ளது. எனவே இதை வெறும் எதிர்கால அச்சுறுத்தலாக மாற்றாமல் தற்போதைய விளைவு/நிலையாக மொழிபெயர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான அரசவைக் கூற்று. அரசனை நோக்கி ‘நீர்/உம்மேல்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ‘தரிசனக்காரர்’ என்ற சிறப்பு தீர்க்கதரிசனப் பட்டமும் ‘சந்நிதி’ என்ற பரவலாகப் புரியக்கூடிய சமயச் சொல்லும் வைக்கப்பட்டுள்ளன. அடிக்குறிப்புகள் தேவையில்லை; ஆகவே பிரதான உரையில் குறியீடுகள் இல்லை.
