base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
translation:
  language: ta
  text: அவர் நீதிபதிகளிடம், “நீங்கள் செய்வதைக் கவனியுங்கள். ஏனெனில் நீங்கள் மனிதனுக்காக[a] அல்ல, யாவேக்காகவே தீர்ப்பு வழங்குகிறீர்கள்; நீதித்தீர்ப்பு தொடர்பான விஷயத்தில்[b] அவர் உங்களுடன் இருக்கிறார்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனிதகுலத்திற்காக.’ எபிரெயத்தில் ‘மனிதன்’ என்ற ஒருமைச் சொல், யாவேக்கு எதிராக மனிதரைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீதி தொடர்பான விஷயத்தில்.’ எபிரெயச் சொற்றொடர் தீர்ப்பு வழங்கும் செயலையோ, பொதுவாக நீதித்துறை விவகாரங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  choice: நீதிபதிகள்
  rationale: שׁפט என்பதன் பெயர்ச்சொல் தன்மையில் பயன்படுத்தப்பட்ட பங்கேற்புவினை வடிவம், நியமிக்கப்பட்ட நீதித்துறை அதிகாரிகளைக் குறிக்கிறது.
- source_word: רְאוּ מָה אַתֶּם עֹשִׂים
  choice: நீங்கள் என்ன செய்கிறீர்கள் என்பதைக் கவனியுங்கள்
  rationale: சொல்லுக்குச் சொல் ‘பாருங்கள்’ என இருந்தாலும், இங்கு கட்டளை அவர்களின் நீதித்துறை நடத்தையைச் சிந்தித்து எச்சரிக்கையுடன் செயல்படுமாறு வலியுறுத்துகிறது; ‘கவனியுங்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: לְאָדָם
  choice: மனிதருக்காக
  rationale: אָדָם ஒருமையில் மனிதனைப் பொதுவாகக் குறிக்கிறது. ‘மனிதருக்காக’ என்பது ஒருமை வடிவத்தையும் யெகோவாவுடனான சொல்லாட்சிசார் எதிர்மறை ஒப்பீட்டையும் காக்கிறது.
- source_word: תִּשְׁפְּטוּ
  choice: தீர்ப்பு வழங்குகிறீர்கள்
  rationale: இவ்வினை நீதித்துறைத் தீர்ப்பளிக்கும் பணியைக் குறிக்கிறது; தமிழில் ‘தீர்ப்பு வழங்குதல்’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: לַיהוָה
  choice: யெகோவாவுக்காகவே
  rationale: יהוה என்ற உடன்படிக்கைப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. לְ முன்னொட்டு தீர்ப்பளித்தல் அவருக்காக அல்லது அவர் சார்பில் நடைபெறுவதை உணர்த்துகிறது; ‘வே’ மனிதருக்காக அல்ல என்ற எதிர்மறை ஒப்பீட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְעִמָּכֶם
  choice: அவர் உங்களுடன் இருக்கிறார்
  rationale: எபிரெயத்தில் வினைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய יהוה என்பதே இயல்பான எழுவாய்; தமிழில் முழுமையான வாக்கியத்திற்காக ‘இருக்கிறார்’ சேர்க்கப்படுகிறது.
- source_word: בִּדְבַר מִשְׁפָּט
  choice: தீர்ப்பு வழங்கும் காரியத்தில்
  rationale: דבר என்பது ‘காரியம்/விவகாரம்’ என்றும் משפט என்பது ‘தீர்ப்பு/நீதி’ என்றும் பொருள்படலாம். இத்தேர்வு நீதித்துறைச் செயலைத் தெளிவாகக் காட்டுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ பயன்படுத்தப்பட்டு, பொதுப்பட்டமான ‘கர்த்தர்’ என மாற்றப்படவில்லை.
- issue: אָדָם என்ற பொதுமைப் பொருளுள்ள ஒருமை
  choice: மனிதர்
  alternative: மனிதகுலம்
  rationale: இது குறிப்பிட்ட ஓர் ஆணை அல்லாமல் மனிதரைப் பொதுவாகக் குறிக்கிறது. ஒருமைச் சொல்லாட்சியையும் இறைவனுடனான எதிர்மறை ஒப்பீட்டையும் ‘மனிதர்’ காக்கிறது.
- issue: நீதித்தீர்ப்பில் இறைவன் உடனிருப்பதன் பொருள்
  choice: அவர் உங்களுடன் இருக்கிறார்
  alternative: அவர் உங்கள் தீர்ப்பில் பங்கேற்கிறார்
  rationale: மூலம் உடனிருப்பை மட்டும் வெளிப்படையாகக் கூறுகிறது; அந்த உடனிருப்பின் துல்லியமான இறையியல் செயல்பாட்டை விளக்கிச் சேர்க்காமல் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நீதித்துறை நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் நேரடி எச்சரிக்கையும் மனிதர்–யெகோவா எதிர்மறை ஒப்பீடும் பாதுகாக்கப்பட்டுள்ளன.
