source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב יְהוֹשָׁפָ֖ט בִּ/ירוּשָׁלִָ֑ם וַ/יָּ֜שָׁב וַ/יֵּצֵ֣א בָ/עָ֗ם מִ/בְּאֵ֥ר שֶׁ֨בַע֙ עַד הַ֣ר אֶפְרַ֔יִם וַ/יְשִׁיבֵ֕/ם אֶל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽםס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
translation:
  language: ta
  text: யோசபாத் எருசலேமில் குடியிருந்தான். பின்பு அவன் மீண்டும் மக்களிடையே புறப்பட்டுச் சென்று[a], பெயெர்செபாவிலிருந்து எப்பிராயீம் மலைநாடு வரை அவர்களை அவர்களுடைய முன்னோர்களின் கடவுளாகிய யாவேவிடம்[b] திரும்பச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மீண்டும் மக்களிடையே புறப்பட்டுச் சென்று” என்பதற்கான எபிரெயச் சொற்றொடரை “அவன் திரும்பி, மக்களிடையே புறப்பட்டுச் சென்றான்” என்றும் நேரடியாக மொழிபெயர்க்கலாம். எருசலேமுக்குத் திரும்பியபின் இந்தப் பணியை அவன் மீண்டும் தொடங்கினான் என்பதே கருத்தாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யாவே” என்பது எபிரெய மொழியில் יהוה (YHWH) என எழுதப்படும் இறைப்பெயரின் ஒலிபெயர்ப்பு. அதன் பழங்கால உச்சரிப்பு உறுதியாகத் தெரியவில்லை; பல மொழிபெயர்ப்புகள் இதை “ஆண்டவர்” என்று வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: குடியிருந்தான்
  rationale: ישׁב என்ற வினை இங்கு வெறுமனே ‘உட்கார்ந்தான்’ என்பதைக் குறிக்காமல், எருசலேமில் நிலையாக வாழ்ந்ததைக் குறிக்கிறது.
- source_word: וַיָּשָׁב וַיֵּצֵא בָעָם
  choice: மீண்டும் மக்களிடையே புறப்பட்டுச் சென்று
  rationale: שׁוב + יצא என்ற தொடரில், யோசபாத் ஏற்கெனவே செய்த பணியை மீண்டும் மேற்கொண்ட கருத்து உள்ளது. בָעָם என்பது மக்களை நோக்கி மட்டும் அல்ல, அவர்களிடையே சென்று செயல்பட்டதைக் காட்டுகிறது.
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  choice: பெயெர்செபா முதல் எப்பிராயீம் மலைநாடு வரை
  rationale: מִן ... עַד என்பது பயணத்தின் பரப்பைச் சுட்டுகிறது; הַר אֶפְרַיִם என்பது ஓர் ஒற்றை மலையைவிட எப்பிராயீமின் மலைப்பாங்கான பிரதேசத்தைக் குறிக்கிறது.
- source_word: וַיְשִׁיבֵם
  choice: அவர்களைத் திரும்பிவரச் செய்தான்
  rationale: שׁוב என்பதன் ஹிப்ஈல் வடிவம் ‘திரும்பச் செய்தான்’ என்ற காரணவினைப் பொருளைக் கொண்டது. இது மனந்திரும்புதல் என்ற குறிப்பிட்ட இறையியல் சொல்லை மூலத்தில் இல்லாமல் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: அவர்களுடைய முன்னோர்களின் கடவுள்
  rationale: אבותיהם என்பது ஆண் முன்னோர்களைச் சொற்படியாகக் குறித்தாலும், இங்கு தலைமுறை மரபைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்லாக ‘முன்னோர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தனிப்பட்ட இறைப்பெயர் YHWH-ஐ ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ‘யாவே’ என்ற ஒலிபெயர்ப்பில் வழங்குகிறது.
theological_decisions:
- issue: וַיְשִׁיבֵם אֶל־יְהוָה என்பதன் ஆன்மிகச் செயல்
  choice: யாவேவிடம் அவர்களைத் திரும்பிவரச் செய்தான்
  alternative: அவர்களை மனந்திரும்பச் செய்தான் / மதம் மாற்றினான்
  rationale: மூலம் ‘திரும்பச் செய்தான்’ என்று கூறுகிறது; மனந்திரும்புதல், வழிபாடு, உடன்படிக்கை விசுவாசம் ஆகியவை சூழலில் உட்பொருளாக இருக்கலாம் என்றாலும், அவற்றில் ஒன்றை மட்டும் வெளிப்படையாகத் தேர்ந்தெடுப்பது மூலத்தின் பரப்பைக் குறைக்கும்.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது; அதன் பழங்காலத் துல்லிய உச்சரிப்பு முழுமையாக உறுதிப்படுத்தப்படவில்லை என்பதையும் அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘மலைநாடு’, ‘முன்னோர்கள்’, ‘திரும்பிவரச் செய்தான்’ ஆகியவை இயல்பான தமிழையும் மூலத்தின் கருத்துத் துல்லியத்தையும் இணைக்கின்றன.
