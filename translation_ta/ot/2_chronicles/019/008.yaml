source:
  edition: WLC
  text: וְ/גַ֣ם בִּ֠/ירוּשָׁלִַם הֶעֱמִ֨יד יְהוֹשָׁפָ֜ט מִן הַ/לְוִיִּ֣ם וְ/הַ/כֹּהֲנִ֗ים וּ/מֵ/רָאשֵׁ֤י הָ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לְ/מִשְׁפַּ֥ט יְהוָ֖ה וְ/לָ/רִ֑יב וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
translation:
  language: ta
  text: எருசலேமிலும் யோசபாத், லேவியர்களிலும் ஆசாரியர்களிலும் இஸ்ரவேலரின் முன்னோர் குடும்பங்களின் தலைவர்களிலும் சிலரை, யாவேயின் நியாயத்தீர்ப்புக்காகவும்[a] வழக்குகளுக்காகவும் நியமித்தான். அவர்கள் எருசலேமுக்குத் திரும்பினார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “யாவேக்குரிய நியாயத்தீர்ப்புக்காக”; அதாவது, யாவேயின் சட்டத்தால் நிர்வகிக்கப்படும் வழக்குகளுக்காக.'
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரையில், “அவர்கள் எருசலேமுக்குத் திரும்பினார்கள்.” இந்தச் சொற்றொடர் சூழலில் சற்றுத் திடீரென இருப்பதால், சிலர் இதை “அவர்கள் எருசலேமில் அமர்ந்தார்கள்” அல்லது “குடியிருந்தார்கள்” என்று வேறுவிதமாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם בִּירוּשָׁלִַם
  choice: எருசலேமிலும்
  rationale: וְגַם என்பதன் கூடுதல் செயலைச் சுட்டும் பொருளையும், בְּ என்பதன் இடப்பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: הֶעֱמִיד
  choice: நியமித்தான்
  rationale: நீதித்துறை சார்ந்த பொறுப்பில் சிலரை நிறுத்திய நிர்வாகச் செயலை இச்சூழலில் தெளிவாகக் காட்டுகிறது.
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: லேவியர்களிலும் ஆசாரியர்களிலும் சிலரையும், இஸ்ரவேலின் மூதாதையர் குடும்பத் தலைவர்களில் சிலரையும்
  rationale: מִן/מֵ என்பவற்றின் பகுதிப்பொருளை ‘சிலர்’ என்று வெளிப்படுத்துகிறது. רָאשֵׁי הָאָבוֹת என்பதை பழங்காலக் குடும்ப அமைப்பை முற்றிலும் தட்டையாக்காமல், புரிந்துகொள்ளத்தக்க தமிழில் தருகிறது.
- source_word: לְמִשְׁפַּט יְהוָה
  choice: யாவேயின் நியாயத்தீர்ப்புக்காக
  rationale: இறைச் சட்டத்துக்குட்பட்ட தீர்ப்பு, யாவேக்குரிய தீர்ப்பு, அல்லது அவரது அதிகாரத்தின்கீழ் வழங்கப்படும் தீர்ப்பு ஆகிய சாத்தியங்களைச் சுருக்காமல் எபிரெய மரபுத்தொடரின் விரிவைத் தக்கவைக்கிறது.
- source_word: וְלָרִיב
  choice: வழக்குகளைத் தீர்ப்பதற்காக
  rationale: רִיב என்பதன் நீதிமன்றச் சூழலிலான தகராறு அல்லது வழக்கு என்ற பொருளை இயல்பான தமிழில் கூறுகிறது; நியமனத்தின் நோக்கமும் தெளிவாகிறது.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: அவர்கள் எருசலேமுக்குத் திரும்பினார்கள்
  rationale: பெறப்பட்ட எபிரெய உரையிலுள்ள שׁוב வினையின் நேரடியான பொருளை, சூழலில் சற்றுத் திடீரெனத் தோன்றினாலும், முதன்மை உரையில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: நான்கு எழுத்து இறைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், அதன் பெயர்த்தன்மையைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- issue: לְמִשְׁפַּט יְהוָה என்பதன் உறவுப்பொருள்
  choice: யாவேயின் நியாயத்தீர்ப்புக்காக
  alternative: யாவேக்காகத் தீர்ப்பு வழங்குவதற்கு / யாவேயின் சட்டத்துக்குட்பட்ட வழக்குகளுக்காக
  rationale: இந்தத் தொடர் இறைச் சட்டத்துக்குரிய வழக்குகளையோ, இறை அதிகாரத்தின்கீழ் வழங்கப்படும் தீர்ப்பையோ குறிக்கலாம். முதன்மை மொழிபெயர்ப்பு அந்த இலக்கண மற்றும் இறையியல் விரிவைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மூதாதையர் குடும்பத் தலைவர்கள்’ பழங்கால சமூக அமைப்பை ஓரளவு பாதுகாக்கிறது; ‘வழக்குகளைத் தீர்ப்பதற்காக’ நீதித்துறைச் சூழலை இயல்பாக வெளிப்படுத்துகிறது. பெறப்பட்ட எபிரெய உரையின் சற்றுக் கடினமான இறுதித் தொடர் முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
