reference: 2 Chronicles 26:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּעְזְרֵ֨/הוּ הָֽ/אֱלֹהִ֜ים עַל פְּלִשְׁתִּ֧ים וְ/עַל ה/ערביים הַ/יֹּשְׁבִ֥ים בְּ/גוּר בָּ֖עַל וְ/הַ/מְּעוּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/007.yaml
  text: God helped him against the Philistines[a], against the Arabians who lived in Gur-baal, and against the Meunites.
translation:
  language: ta
  text: தேவன் பெலிஸ்தியருக்கு எதிராகவும், கூர்-பாகாலில் குடியிருந்த அரேபியருக்கு எதிராகவும், மெயூனியருக்கு[a] எதிராகவும் அவனுக்கு உதவினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாவோனியர்.” இந்த எபிரெய இனப்பெயர் தொடர்புடைய இனப்பெயரையோ அதன் மாற்று வடிவையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  choice: அவனுக்கு உதவினார்
  rationale: עזר என்பதன் தொடர்கதை வடிவமும் மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டும், தேவன் அவனுக்கு உதவினார் என்ற நேரடியான பொருளைத் தருகின்றன.
- source_word: הָאֱלֹהִים
  choice: தேவன்
  rationale: எபிரெயத்தில் சுட்டுருபுடன் இருந்தாலும், இங்கு இது இஸ்ரவேலின் தேவனைக் குறிக்கும் வழக்கமான கதைநடைப் பெயராக உள்ளது; தமிழில் இயல்பாக ‘தேவன்’ என வழங்கப்படுகிறது.
- source_word: עַל
  choice: எதிராக
  rationale: போர்ச் சூழலில் ‘உதவி செய்’ என்ற வினையுடன் வரும் עַל, எதிர்த்து நிற்கும் பகைவர்களைச் சுட்டுகிறது.
- source_word: פְּלִשְׁתִּים
  choice: பெலிஸ்தியர்
  rationale: இந்த இனப்பெயருக்கான தெளிவான, வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: הערביים
  choice: அரேபியர்
  rationale: வரலாற்றுக் கதைநடையில் அரேபியப் பகுதி மக்களைக் குறிக்கும் இனப்பெயரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַיֹּשְׁבִים
  choice: குடியிருந்த
  rationale: ישב என்ற வினையின் பங்கேற்பு வடிவம் ஓர் இடத்தில் வசித்தல் அல்லது குடியிருத்தல் என்பதைக் குறிக்கிறது.
- source_word: בְּגוּר בָּעַל
  choice: கூர்-பாகாலில்
  rationale: இது ஓர் இடப்பெயர் என்பதால் ஒலிபெயர்க்கப்பட்டுள்ளது; בְּ இங்கு வசிக்கும் இடத்தைக் குறிக்கும் ‘-இல்’ என வழங்கப்பட்டுள்ளது.
- source_word: הַמְּעוּנִים
  choice: மெயூனியர்
  rationale: மெய்யெழுத்து வடிவமான מעונים அடிப்படையில் இனப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; அதன் துல்லியமான அடையாளம் உறுதியல்லாததால் மாற்றுப் பெயர் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
