translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூன்று எதிரிக் குழுக்களையும் இணைக்கும் எபிரெய இணை அமைப்பு ‘எதிராகவும்’ என்ற மறுமொழியால் பாதுகாக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி, அது விளக்கும் ‘மெயூனியர்’ என்ற சொல்லோடு நேரடியாக இணைக்கப்பட்டுள்ளது.
