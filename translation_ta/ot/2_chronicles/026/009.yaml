  register: நவீன நிலையான தமிழில், இயல்பானதும் கண்ணியமானதுமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. வாசல்களின் பெயர்கள் பெயர்ச்சொல் வடிவில் வைக்கப்பட்டுள்ளன; הַמִּקְצוֹעַ என்பதிலுள்ள உண்மையான இடவியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
