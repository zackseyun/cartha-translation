source:
  edition: WLC
  text: וַ/יִּ֨בֶן עֻזִּיָּ֤הוּ מִגְדָּלִים֙ בִּ/יר֣וּשָׁלִַ֔ם עַל שַׁ֧עַר הַ/פִּנָּ֛ה וְ/עַל שַׁ֥עַר הַ/גַּ֖יְא וְ/עַל הַ/מִּקְצ֑וֹעַ וַֽ/יְחַזְּקֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/009.yaml
  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
translation:
  language: ta
  text: உசியா எருசலேமில் மூலை வாசலிலும், பள்ளத்தாக்கு வாசலிலும், திருப்புமிடத்திலும்[a] கோபுரங்களைக் கட்டி, அவற்றை வலுப்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூலையிலும்.” எபிரெயச் சொல் ஒரு கட்டமைப்பின் கோணம், மூலை, அல்லது திரும்பும் இடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: கட்டினார்
  rationale: בנה என்பதன் நேரான பொருள் ‘கட்டு’; தமிழில் இயல்பான இறந்தகால மரியாதை ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עֻזִּיָּהוּ
  choice: உசியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர்வடிவம்.
- source_word: מִגְדָּלִים
  choice: கோபுரங்கள்
  rationale: מִגְדָּלִים என்பதன் பன்மைப் பொருளை நேரடியாகத் தருகிறது; ‘அரணான’ என்ற கருத்து இச்சொல்லில் தனியே இல்லை.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: ב முன்னொட்டின் இடப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַל
  choice: அருகில் / இடத்தில்
  rationale: வாசல்களையும் மதில் அமைப்பையும் குறிக்கும் இச்சூழலில் עַל இடத்தைக் குறிக்கிறது; தமிழில் வாசல்களுக்கு ‘அருகில்’ என்றும் மதிலின் திருப்பத்திற்கு இடவேற்றுமையாலும் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: שַׁעַר הַפִּנָּה
  choice: மூலை வாசல்
  rationale: நகர வாசலின் பெயராகிய எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: שַׁעַר הַגַּיְא
  choice: பள்ளத்தாக்கு வாசல்
  rationale: גַּיְא என்பதன் ‘பள்ளத்தாக்கு’ என்ற பொருளையும் வாசலின் பெயரையும் இயல்பாகத் தருகிறது.
- source_word: הַמִּקְצוֹעַ
  choice: மதிலின் திருப்பம்
  rationale: இச்சொல் ஒரு கட்டமைப்பின் மூலை, கோணம் அல்லது திரும்பும் இடத்தைக் குறிக்கலாம். முன்பே ‘மூலை வாசல்’ வந்திருப்பதால் குழப்பத்தைத் தவிர்த்து, கோட்டைக் கட்டமைப்பின் இடவியல் பொருளை ‘மதிலின் திருப்பம்’ எனத் தருகிறது.
- source_word: וַיְחַזְּקֵם
  choice: அவற்றை வலுப்படுத்தினார்
  rationale: פיעל வடிவிலுள்ள חזק ‘வலுப்படுத்து/அரணாக்கு’ எனப் பொருள்படும். பின்னொட்டு கோபுரங்களைக் குறிப்பதாக இயல்பாக எடுத்துக்கொள்ளப்படுகிறது; ‘வலுப்படுத்தினார்’ மூலத்தின் அகன்ற பொருளைத் தக்கவைக்கிறது.
