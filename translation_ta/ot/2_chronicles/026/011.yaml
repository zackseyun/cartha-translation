source:
  edition: WLC
  text: וַ/יְהִ֣י לְ/עֻזִּיָּ֡הוּ חַיִל֩ עֹשֵׂ֨ה מִלְחָמָ֜ה יוֹצְאֵ֧י צָבָ֣א לִ/גְד֗וּד בְּ/מִסְפַּר֙ פְּקֻדָּתָ֔/ם בְּ/יַד֙ יעואל הַ/סּוֹפֵ֔ר וּ/מַעֲשֵׂיָ֖הוּ הַ/שּׁוֹטֵ֑ר עַ֚ל יַד חֲנַנְיָ֔הוּ מִ/שָּׂרֵ֖י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/011.yaml
  text: And Uzziah had an army fit for war[a], going out to battle by divisions, according to the number of their enrollment, under the direction of Jeiel the scribe and Maaseiah the officer, under the authority of Hananiah[b], one of the king’s commanders.
translation:
  language: ta
  text: உசியாவுக்குப் போரிடத் தகுதியான ஒரு படை இருந்தது. படைவீரர்கள் தங்கள் பதிவெண்ணிக்கையின்படி[a] படைப்பிரிவுகளாகப் படைப்பணிக்காகப் புறப்பட்டார்கள். எழுத்தரான யெயியேலும்[b] அதிகாரியான மாசெயாவும் அவர்களை வழிநடத்தினர்; இவர்கள் மன்னரின் படைத்தலைவர்களில் ஒருவரான அனனியாவின் மேற்பார்வையில் செயல்பட்டனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் படைக்கணக்கின்படி.” எபிரெயச் சொல் படைவீரர்களின் அதிகாரப்பூர்வக் கணக்கெடுப்பு அல்லது பதிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு எபிரெய உரையில் இந்தப் பெயர் יעואל என்று எழுதப்பட்டுள்ளது; இதை “யெயுவேல்” என்றும் ஒலிபெயர்க்கலாம்.
    reason: textual_name_form
lexical_decisions:
- source_word: חַיִל
  choice: படை
  rationale: இராணுவச் சூழலில் இது செல்வத்தையோ பொதுவான வலிமையையோ அல்ல, ஒழுங்கமைக்கப்பட்ட இராணுவப் படையைக் குறிக்கிறது.
- source_word: עֹשֵׂה מִלְחָמָה
  choice: போரிடத் தகுதியான
  rationale: சொல்லுக்கு சொல் ‘போர் செய்கிற’ என்பதற்குப் பதிலாக, போரிடும் திறனும் ஆயத்தமும் கொண்ட படை என்ற எபிரெயப் பங்கேற்புச் சொல்லின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יוֹצְאֵי צָבָא
  choice: போருக்குப் புறப்பட்டார்கள்
  rationale: இராணுவப் பணிக்காக அல்லது போருக்காகப் புறப்படுவோரைக் குறிக்கும் வழக்குச் சொற்றொடரை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִגְדוּד
  choice: படைப்பிரிவுகளாக
  rationale: இங்கு படைகள் எண்ணப்பட்டு ஒழுங்கமைக்கப்படுவதால், கொள்ளைக் கூட்டங்கள் என்பதைக் காட்டிலும் இராணுவப் பிரிவுகள் என்பதே பொருத்தம்.
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  choice: தங்கள் பதிவெண்ணிக்கையின்படி
  rationale: படைவீரர்களின் அதிகாரப்பூர்வப் பதிவு மற்றும் கணக்கெடுப்பு ஆகிய இரு நிர்வாக நுணுக்கங்களையும் சுருக்கமாகக் காக்கிறது.
- source_word: בְּיַד
  choice: வழிநடத்தினர்
  rationale: ‘கையினால்’ என்ற சொற்பொருளைவிட, யெயியேல் மற்றும் மாசெயாவின் நேரடி நிர்வாகப் பொறுப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַסּוֹפֵר
  choice: எழுத்தர்
  rationale: அரசு அல்லது இராணுவ நிர்வாகத்தில் பதிவுகளை மேற்கொண்ட அதிகாரப்பூர்வ எழுத்தரைக் குறிக்கிறது.
- source_word: הַשּׁוֹטֵר
  choice: அதிகாரி
  rationale: நிர்வாக அல்லது இராணுவப் பொறுப்புடைய அலுவலர் என்ற பரந்த பொருளைச் சூழலுக்கேற்றவாறு காக்கிறது.
- source_word: עַל יַד
  choice: மேற்பார்வையில்
  rationale: முந்தைய இரு அலுவலர்களுக்கு மேலான கட்டளை அல்லது கண்காணிப்பு நிலையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִשָּׂרֵי הַמֶּלֶךְ
  choice: மன்னரின் படைத்தலைவர்களில் ஒருவர்
  rationale: שַׂר என்பதன் தலைவன் அல்லது அதிகாரி என்ற பொருளை இராணுவச் சூழலுக்கேற்ப ‘படைத்தலைவர்’ என வழங்குகிறது; מִן அமைப்பு குழுவில் ஒருவரைக் குறிக்கிறது.
