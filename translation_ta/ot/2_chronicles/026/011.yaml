translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; கட்டளைப் படிநிலையும் அதிகாரப்பூர்வப் படைப்பதிவின் கருத்தும் காக்கப்பட்டுள்ளன.
