  revised_text: தலைமைக்குருவான அசரியாவும் எல்லாக் குருமார்களும் அவனை நோக்கித் திரும்பினார்கள். இதோ, அவனுடைய நெற்றியில் தோல் நோய் காணப்பட்டது[c]. எனவே அவர்கள் அவனை அங்கிருந்து அவசரமாக வெளியேற்றினார்கள்[a]. யாவே அவனைத் தாக்கியிருந்ததால், அவனும் வெளியேற விரைந்தான்[b].
