base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
translation:
  language: ta
  text: தலைமைக்குருவான அசரியாவும் எல்லாக் குருமார்களும் அவனை நோக்கித் திரும்பினார்கள். இதோ, அவனுடைய நெற்றியில் தோல் நோய் காணப்பட்டது[c]. எனவே அவர்கள் அவனை அங்கிருந்து அவசரமாக வெளியேற்றினார்கள்[a]. யாவே அவனைத் தாக்கியிருந்ததால், அவனும் வெளியேற விரைந்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அவனை அங்கிருந்து விரட்டிவிட்டார்கள்.” எபிரெய வினை அவசரமாக அகற்றுவதைக் குறிக்கலாம்; குருமார்கள் வலுக்கட்டாயமாகச் செயல்பட்டார்களா, அல்லது அந்தத் தருணத்தின் அவசரமே வலியுறுத்தப்படுகிறதா என்பது முழுமையாகத் தெளிவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனும் வெளியேறும்படி உந்தப்பட்டான்.” எபிரெயச் செயப்பாட்டு வடிவம் அவன் வெளியே தள்ளப்பட்டான் அல்லது உந்தப்பட்டான் என்பதை வலியுறுத்தலாம்; சூழலில் அவனே அவசரமாக வெளியேறினான் என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: “தோல் நோய்” என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ஆசாரத் தீட்டு விதிகளில் வரும் ஒரு தோல் பாதிப்பைக் குறிக்கிறது; அது நவீன மருத்துவம் குறிப்பிடும் தொழுநோயுடன் எல்லாச் சந்தர்ப்பங்களிலும் துல்லியமாக ஒத்திருக்க வேண்டியதில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: அவனை நோக்கித் திரும்பினார்கள்
  rationale: פנה உடல் அல்லது பார்வையின் திசையை ஒருவரை நோக்கித் திருப்புவதைக் குறிக்கிறது. எபிரெய வாக்கியத்தில் ஒருமை வினை முதலில் அசரியாவோடு பொருந்தினாலும், தொடர்ந்து எல்லாக் குருமார்களும் இணைக்கப்படுவதால் தமிழில் இயல்பாகப் பன்மை பயன்படுத்தப்பட்டது.
- source_word: עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ
  choice: தலைமைக் குருவான அசரியா
  rationale: כֹהֵן הָרֹאשׁ என்பதன் நேர்ப்பொருள் ‘தலைமை/முதன்மைக் குரு.’ மூலத்தில் இல்லாத கூடுதல் தொழில்நுட்பப் பதவிப்பொருளை ஏற்றாமல் ‘தலைமைக் குரு’ என வழங்கப்பட்டது.
- source_word: וְכָל הַכֹּהֲנִים
  choice: மற்ற எல்லாக் குருமார்களும்
  rationale: அசரியாவுடன் ஏனைய குருமார்களையும் சேர்க்கும் இணைப்புப் பொருளைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה திடீரெனக் கண்ணுக்குப் புலப்பட்டதைச் சுட்டும் கதைநடைச் சொல்லாக இருப்பதால் அதன் உயிரோட்டம் காக்கப்பட்டது.
- source_word: מְצֹרָע
  choice: கடுமையான தோல் நோய் இருந்தது
  rationale: இந்தச் சொல் ஆசாரத் தூய்மை விதிகளில் வரும் தோல் பாதிப்பைக் குறிக்கிறது; அதை நவீன மருத்துவத் தொழுநோயுடன் தவறாகச் சமமாக்காமல், வாசகருக்குப் புரியும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: בְּמִצְחוֹ
  choice: அவனுடைய நெற்றியில்
  rationale: பாதிப்பு வெளிப்பட்ட உடல் இடத்தை இயல்பான தமிழில் துல்லியமாகக் குறிக்கிறது.
- source_word: וַיַּבְהִלֻהוּ מִשָּׁם
  choice: அவர்கள் அவனை அங்கிருந்து அவசரமாக வெளியேற்றினார்கள்
  rationale: בהל என்பதன் Hiphil வடிவம் ஒருவரை அவசரப்படுத்துதல் அல்லது பதற்றத்துடன் அகற்றுதல் என்ற பொருளைக் கொண்டது. இங்கு குருமார்களின் அவசர நடவடிக்கை தெளிவாக வெளிப்படுகிறது; வன்முறை இருந்ததாகத் தீர்மானிக்கவில்லை.
- source_word: וְגַם הוּא נִדְחַף לָצֵאת
  choice: அவனும் வெளியேற விரைந்தான்
  rationale: דחף என்பதன் Niphal வடிவத்தில் ‘உந்தப்பட்டான்/தள்ளப்பட்டான்’ என்ற நிழற்பொருள் உள்ளது. சூழலில் அரசனும் உடனே வெளியேறியதை இயல்பான தமிழில் கூறி, செயப்பாட்டு நிழற்பொருளை அடிக்குறிப்பில் காத்திருக்கிறது.
- source_word: כִּי נִגְּעוֹ יְהוָה
  choice: யாவே அவனைத் தாக்கியிருந்ததால்
  rationale: இந்தத் தண்டனைச் சூழலில் נגע ஒரு நடுநிலையான தொடுதலை அல்ல, தெய்வீகத் தாக்குதலை அல்லது வாதிப்பைச் சுட்டுகிறது. முன்நிகழ்வைக் காட்ட ‘தாக்கியிருந்ததால்’ பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட தெய்வீகப் பெயரையே பயன்படுத்துகிறது. ஆகவே ஒரு பட்டத்தைப் பதிலீடு செய்யாமல் பெயர் ஒலிபெயர்க்கப்பட்டது.
- issue: כֹהֵן הָרֹאשׁ ஒரு குறிப்பிட்ட தொழில்நுட்பப் பதவியா என்பது
  choice: தலைமைக் குரு
  alternative: பிரதான ஆசாரியன் / தலைமை ஆசாரியன்
  rationale: எபிரெயச் சொற்றொடரின் ‘தலைமை வகிக்கும் குரு’ என்ற நேர்ப்பொருளைத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத பிற்கால சமயப் பதவிநுட்பத்தைச் சேர்ப்பதில்லை.
- issue: מְצֹרָע என்பதைக் குறிப்பிட்ட நவீன நோயாக அடையாளப்படுத்துவது
  choice: கடுமையான தோல் நோய்
  alternative: தொழுநோய் / குஷ்டரோகம்
  rationale: ஆசாரத் தீட்டு விதிகளில் வரும் எபிரெயச் சொல் நவீன ஹான்சன் நோயை மட்டும் துல்லியமாகக் குறிக்க வேண்டியதில்லை. எனவே மருத்துவ அடையாளத்தைத் தீர்மானிக்காமல் உரையின் முக்கியமான உடல் பாதிப்பை வெளிப்படுத்துகிறது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமக் கதைநடைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘இதோ’ என்பது மூலத்தின் திடீர் காட்சியுணர்வைக் காக்கிறது. ‘குரு’ என்பது כֹהֵן என்பதற்கான சுருக்கமான, தற்போதைய தமிழ்; மருத்துவ ரீதியாகத் தவறாகப் புரிந்துகொள்ளக்கூடிய மரபுச் சொல்லுக்கு மாற்றாக விளக்கமான ‘கடுமையான தோல் நோய்’ தேர்ந்தெடுக்கப்பட்டது.
