  source_fidelity: முதன்மைச் சிக்கல், எபிரெய வினை ஒருமையில் இருப்பினும் அசரியாவையும் எல்லாக் குருமார்களையும் ஒரே பன்மைப் பொருளாகக் கொண்டு மொழிபெயர்த்திருப்பதே அல்ல; ‘மற்ற’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத சேர்க்கை. மேலும் מְצֹרָע என்பதற்கான ‘கடுமையான’ என்பது அளவைத் தீர்மானிப்பதால், நடுநிலையான மொழியாக்கம் சிறந்தது.
  naturalness: உரை நவீனத் தரத் தமிழில் இயல்பாக உள்ளது. ‘தலைமைக்குரு’ என்பதைச் சேர்த்தெழுதுவதும், ‘தோல் நோயால் பாதிக்கப்பட்டிருந்தான்’ என்பதும் வாசிப்பைச் சீராக்குகின்றன.
  terminology: ‘யாவே’ என்பது யְהוָה-வுக்கு ஒத்திசைவான ஒலிபெயர்ப்பு. ‘தலைமைக்குரு’ כֹהֵן הָרֹאשׁ-க்கு பொருத்தமானது. מְצֹרָע-வை நவீன மருத்துவத் தொழுநோயாக நிர்ணயிக்காமல் ‘தோல் நோயால் பாதிக்கப்பட்டிருந்தான்’ என வழங்கி, அடிக்குறிப்பில் அதன் ஆசாரத் தீட்டு-சூழலை விளக்க வேண்டும்.
