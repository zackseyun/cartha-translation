base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
translation:
  language: ta
  text: அரசன் உசியா தனது மரண நாள்வரை தொழுநோயால் பாதிக்கப்பட்டவனாக[a] இருந்தான். அவன் தொழுநோயால் பாதிக்கப்பட்டவனாகவே தனி வீட்டில்[b] வாழ்ந்தான்; ஏனெனில், அவன் யாவேயின் ஆலயத்திலிருந்து பிரித்துவைக்கப்பட்டிருந்தான். அவன் மகன் யோதாம் அரசனின் இல்லப் பொறுப்பை ஏற்று, நாட்டு மக்களுக்கு நீதி வழங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் இன்றைய மருத்துவ வரையறையிலுள்ள தொழுநோயை மட்டும் அல்லாமல், பலவகைத் தீவிரமான தோல் பாதிப்புகளையும் குறிக்கலாம்.
    reason: lexical_scope
  - marker: b
    text: எபிரெயச் சொற்றொடர் தெளிவற்றது; சொற்படி, ‘விடுதலையின் வீடு’ என்றும் மொழிபெயர்க்கலாம். இங்கு நோயின் காரணமாகத் தனியே வாழ்ந்த குடியிருப்பைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצֹרָע
  choice: தொழுநோயால் பாதிக்கப்பட்டவன்
  rationale: צרעת என்பது இன்றைய மருத்துவ வரையறையிலுள்ள தொழுநோயை மட்டும் குறிக்காமல் பலவகைத் தோல் பாதிப்புகளையும் உள்ளடக்கலாம். தமிழில் பரவலாக அறியப்பட்ட வேதாகமச் சொல்லை வைத்துக்கொண்டு, அடிக்குறிப்பில் அதன் பரந்த பொருள் தெளிவுபடுத்தப்படுகிறது.
- source_word: בֵּית הַחפשות
  choice: தனி வீடு
  rationale: இந்த அரிய எபிரெயச் சொற்றொடர் தெளிவற்றது; சூழலில் உசியா பிறரிடமிருந்து பிரித்து வைக்கப்பட்டிருந்த குடியிருப்பைக் குறிக்கலாம். இயல்பான தமிழில் நடைமுறைப் பொருளைத் தரும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டு, நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נִגְזַר מִבֵּית יְהוָה
  choice: யாவேயின் ஆலயத்திலிருந்து விலக்கப்பட்டிருந்தான்
  rationale: נִגְזַר என்பது வெட்டிப் பிரிக்கப்படுதல் அல்லது ஒதுக்கப்படுதல் என்ற வலிமையான கருத்தைக் கொண்டது. இங்கு ஆலய நுழைவிலிருந்து விலக்கப்பட்ட நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: எபிரெயத்தில் நேரடியாக ‘யாவேயின் வீடு’ என்றாலும், இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது; ‘ஆலயம்’ என்பது சாதாரண வாசகருக்கு உடனடியாகத் தெளிவாகிறது.
- source_word: עַל בֵּית הַמֶּלֶךְ
  choice: அரச அரண்மனைக்குப் பொறுப்பாக இருந்து
  rationale: இந்தச் சொற்றொடர் அரசரின் வீடு, அரண்மனை அல்லது அரசக் குடும்ப நிர்வாகத்தின் மேற்பார்வையைக் குறிக்கிறது. குறிப்பிட்ட பதவியை ஊகிக்காமல் நிர்வாகப் பொறுப்பைத் தெளிவாகக் கூறுகிறது.
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  choice: நாட்டு மக்களுக்கு நீதி வழங்கினான்
  rationale: שׁוֹפֵט என்பது நீதித்தீர்ப்பையும் பரந்த ஆட்சிப் பொறுப்பையும் குறிக்கக்கூடும். ‘நீதி வழங்கினான்’ என்பது அடிப்படை நீதித்துறைப் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עַם הָאָרֶץ
  choice: நாட்டு மக்கள்
  rationale: சமூக அல்லது அரசியல் தொழில்நுட்பப் பொருளைத் தேவையின்றி இறக்காமல், எபிரெயச் சொற்றொடரின் பொதுவான பொருளைத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கையின் தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- issue: உசியாவின் צרעת நிலையை நவீன மருத்துவ நோயாக அடையாளப்படுத்துதல்
  choice: பாரம்பரியமான ‘தொழுநோய்’ சொல்லை விளக்க அடிக்குறிப்புடன் பயன்படுத்துதல்
  alternative: தோல் நோய்
  rationale: மூலச்சொல்லின் வரலாற்று-சடங்கு சார்ந்த பரந்த பொருளை நவீன ஹான்சன் நோயுடன் முழுமையாக ஒப்பிடாமல், வாசகர்களுக்குத் தெரிந்த சொல்லையும் அதன் வரம்பைக் கூறும் குறிப்பையும் இணைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘தனி வீடு’, ‘அரண்மனைக்குப் பொறுப்பு’, ‘நீதி வழங்குதல்’ ஆகியவை மிகப் பழமையான நடையைத் தவிர்த்து, மூலத்தின் நிர்வாக மற்றும் சமூகக் கருத்துகளைத் தெளிவாகத் தருகின்றன.
