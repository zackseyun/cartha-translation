source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י עֻזִּיָּ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרֹנִ֑ים כָּתַ֛ב יְשַֽׁעְיָ֥הוּ בֶן אָמ֖וֹץ הַ/נָּבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/022.yaml
  text: The rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
translation:
  language: ta
  text: உசியாவின் மற்ற செயல்களை[a]—தொடக்கம் முதல் முடிவு வரை—ஆமோத்சின் மகனான ஏசாயா தீர்க்கதரிசி எழுதினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “உசியாவின் மீதமுள்ள வார்த்தைகள்.” இங்கு “வார்த்தைகள்” என்பது அவரது ஆட்சிக்கால நிகழ்வுகள் அல்லது செயல்களைக் குறிக்கும் எபிரெய வரலாற்று நாளேட்டு வழக்கு.
    reason: ‘செயல்கள்’ என்பதற்குப் பின்னுள்ள דִּבְרֵי என்ற சொல்லின் நேரடி மாற்றையும், יֶתֶר என்பதன் ‘மீதமுள்ள’ பொருளையும் துல்லியமாகக் காட்டுகிறது.
lexical_decisions:
- source_word: וְיֶתֶר
  choice: மற்ற
  rationale: יֶתֶר என்பது எஞ்சியவற்றைக் குறிக்கிறது. அரசரின் ஆட்சிச் சுருக்கத்தைத் தொடரும் இச்சூழலில் ‘மற்ற’ என்பது இயல்பான நவீனத் தமிழ். தொடக்க ו தனியாக மொழிபெயர்க்கப்படவில்லை; தமிழில் வாக்கியத் தொடர்பு சூழலிலேயே தெளிவாகிறது.
- source_word: דִּבְרֵי
  choice: செயல்களை
  rationale: இதன் நேரடிப் பொருள் ‘சொற்கள்/விஷயங்கள்’ என்றாலும், அரசர்களைப் பற்றிய வரலாற்றுச் சுருக்க மரபில் அவர்களுடைய செயல்களையும் ஆட்சிக்கால நிகழ்வுகளையும் குறிக்கிறது.
- source_word: עֻזִּיָּהוּ
  choice: உசியா
  rationale: இவ்வசனத்தில் உள்ள எபிரெயப் பெயரான עֻזִּיָּהוּ என்பதற்கான வழக்கமான தமிழ் வடிவம்.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: தொடக்கம்முதல் முடிவுவரை
  rationale: ‘முந்தினவையும் பிந்தினவையும்’ என்ற நேரடிக் கட்டமைப்பு, அரசனுடைய செயல்களின் முழுக் காலவிரிவைக் குறிக்கிறது. அந்தப் பொருளை இயல்பான தமிழில் இவ்வாறு வழங்குகிறது.
- source_word: כָּתַב
  choice: எழுதினார்
  rationale: வினையின் நேரடியான பொருளைத் தக்கவைக்கிறது; ‘பதிவுசெய்தார்’ என்ற விளக்கமான பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: ஆமோத்சின் மகனான ஏசாயா
  rationale: தீர்க்கதரிசியின் பெயரையும் தந்தைவழி அடையாளத்தையும் தெளிவாகக் கொடுக்கிறது; ஆமோத்சை ஆமோஸ் தீர்க்கதரிசியுடன் குழப்பாமல் பெயரை வேறுபடுத்துகிறது.
- source_word: הַנָּבִיא
  choice: தீர்க்கதரிசி
  rationale: ஏசாயாவின் அங்கீகரிக்கப்பட்ட தீர்க்கதரிசனப் பணியைக் குறிக்கும் திட்டவட்டமான பட்டத்தை மொழிபெயர்க்கிறது.
theological_decisions:
- issue: அரச வரலாற்றுச் சூத்திரத்தில் דִּבְרֵי என்பதன் இயல்பு
  choice: ‘செயல்கள்’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘சொற்கள்’ அல்லது ‘விஷயங்கள்’
  rationale: இது கோட்பாட்டை நிர்ணயிக்கும் முடிவு அல்ல. நாளேட்டு நடையில் இச்சொல் அரசனுடைய ஆட்சிக்காலச் செயல்களையும் நிகழ்வுகளையும் குறிக்கிறது; நேரடி சொல்லாட்சியை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים என்ற இணையின் காலவிரிவு
  choice: ‘தொடக்கம்முதல் முடிவுவரை’
  alternative: ‘முந்தினவையும் பிந்தினவையும்’
  rationale: எபிரெய இணை செயல்களின் முந்திய மற்றும் பிந்திய பகுதிகளை உள்ளடக்குகிறது. தமிழ் வாசகருக்கு இயல்பாக முழுக் காலவிரிவைத் தெரிவிக்கிறது; எந்தத் தனிப்பட்ட நிகழ்வுகளையும் உரையில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகம வழக்கிற்கு ஏற்றவாறு வழங்கப்பட்டுள்ளன. ‘தீர்க்கதரிசி’ என்பது பரவலாகப் புரியும் பதவிப்பெயர். வாக்கியத்தின் செயல்பாட்டாளரான ஏசாயாவை இறுதியில் தெளிவாக வைத்து, எபிரெய உரையின் வலியுறுத்தலை இயன்றவரை பாதுகாக்கிறது.
