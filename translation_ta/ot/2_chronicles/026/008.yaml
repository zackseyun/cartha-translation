  source_fidelity: மூல எபிரேயத்தின் அரசியல் பொருளில் מִנְחָה என்பதைக் ‘கப்பம்’ எனத் துல்லியமாகத் தருகிறது. ‘அவருடைய புகழ் ... பரவியது’ என்பது וַיֵּלֶךְ שְׁמוֹ என்ற மரபுத்தொடரின் பொருளை இயல்பாகக் கூறுகிறது. எகிப்தின் ‘நுழைவிடம்’ என்ற இடவியல் குறிப்பு அடிக்குறிப்புடன் உரிய அளவு திறந்தநிலையிலே வைக்கப்பட்டுள்ளது. ‘மிகவும் வலிமைபெற்றிருந்தார்’ என்பது הֶחֱזִיק עַד לְמַעְלָה என்பதன் வலிமை மிகுதியையும் காரணத் தொடர்பையும் காக்கிறது.
