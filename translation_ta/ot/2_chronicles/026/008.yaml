source:
  edition: WLC
  text: וַ/יִּתְּנ֧וּ הָֽ/עַמּוֹנִ֛ים מִנְחָ֖ה לְ/עֻזִּיָּ֑הוּ וַ/יֵּ֤לֶךְ שְׁמ/וֹ֙ עַד לְ/ב֣וֹא מִצְרַ֔יִם כִּ֥י הֶחֱזִ֖יק עַד לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
translation:
  language: ta
  text: அம்மோனியர்கள் உசியாவுக்குக் கப்பம் செலுத்தினார்கள். அவருடைய புகழ் எகிப்தின் நுழைவிடம்[a] வரைக்கும் பரவியது; ஏனெனில் அவர் மிகவும் வலிமைபெற்றிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எகிப்தின் நுழைவிடம்” என்பது எகிப்தை அணுகும் பகுதியையோ அதன் எல்லைப்பகுதியையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  choice: அம்மோனியர்கள்
  rationale: அம்மோன் மக்களைக் குறிக்கும் இன/தேசியப் பெயருக்கான தெளிவான, வழக்கமான தமிழ் வடிவம்.
- source_word: מִנְחָה
  choice: கப்பம்
  rationale: ஒரு வெளிநாட்டு மக்கள் அரசனுக்குச் செலுத்தும் அரசியல் சூழலில், பொதுவான பரிசு அல்லது வழிபாட்டுக் காணிக்கையைவிட ‘கப்பம்’ என்பதே பொருத்தமானது.
- source_word: וַיֵּלֶךְ שְׁמוֹ
  choice: அவருடைய புகழ் ... பரவியது
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய பெயர் சென்றது’; இங்கு ‘பெயர்’ என்பது புகழ் அல்லது நற்பெயரைக் குறிக்கும் எபிரேய மரபுத்தொடர். இயல்பான தமிழில் அதன் பொருளைத் தருகிறது.
- source_word: עַד לְבוֹא מִצְרַיִם
  choice: எகிப்தின் நுழைவிடம் வரைக்கும்
  rationale: ‘எகிப்துக்குள் வரும் இடம் வரைக்கும்’ என்ற எபிரேய உருவகத்தைப் பாதுகாக்கிறது; இது எகிப்தை அணுகும் பகுதி அல்லது அதன் எல்லைப்பகுதியைக் குறிக்கக்கூடும்.
- source_word: הֶחֱזִיק
  choice: வலிமைபெற்றிருந்தார்
  rationale: இங்கு வலிமையடைதல் அல்லது வல்லமை மிக்கவராதல் என்ற காரண விளக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַד לְמַעְלָה
  choice: மிகவும்
  rationale: முந்தைய வினையின் அளவை மிகுதியாக்கும் எபிரேய மரபுத்தொடரை தெளிவான நவீன தமிழில் தருகிறது.
