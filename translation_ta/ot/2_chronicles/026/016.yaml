source:
  edition: WLC
  text: וּ/כְ/חֶזְקָת֗/וֹ גָּבַ֤הּ לִבּ/וֹ֙ עַד לְ/הַשְׁחִ֔ית וַ/יִּמְעַ֖ל בַּ/יהוָ֣ה אֱלֹהָ֑י/ו וַ/יָּבֹא֙ אֶל הֵיכַ֣ל יְהוָ֔ה לְ/הַקְטִ֖יר עַל מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: ta
  text: ஆனால், அவன் வலிமையடைந்தபோது, அவனுடைய இதயம் அகந்தையடைந்து, அவன் அழிவுக்கு ஆளானான். அவன் தன் கடவுளாகிய யாவேக்கு உண்மையற்றவனாக நடந்துகொண்டு, தூபப் பீடத்தின்மேல் தூபம் காட்டுவதற்காக யாவேயின் ஆலயத்துக்குள் சென்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  choice: ஆனால் அவன் வலிமை அடைந்தபோது
  rationale: כְּ உடன் வரும் ‘அவனுடைய வலிமை’ என்ற பெயர்ச்சொல் இங்கு காலச் சூழலைக் குறிக்கிறது; வலிமை பெற்றதற்குப் பிந்தைய திருப்பத்தையும் וּ இயல்பாக ‘ஆனால்’ எனக் காட்டுகிறது.
- source_word: גָּבַהּ לִבּוֹ
  choice: அவனுடைய உள்ளம் கர்வமடைந்து
  rationale: எபிரெய மொழிவழக்கின் சொற்பொருள் ‘அவனுடைய இதயம் உயர்ந்தது.’ நவீன தமிழில் அதன் ஒழுக்கப் பொருளை இயல்பாகத் தெரிவிக்க ‘உள்ளம் கர்வமடைந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַד לְהַשְׁחִית
  choice: அவனை அழிவுக்கு இட்டுச் சென்றது
  rationale: இந்தத் தொடர் கர்வத்தின் அழிவூட்டும் விளைவைச் சுட்டுகிறது. ‘அழிவுக்கு இட்டுச் சென்றது’ என்பது விளைவுப் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיִּמְעַל
  choice: உண்மையற்றவனாக நடந்துகொண்டு
  rationale: מעל என்பது உடன்படிக்கை அல்லது பரிசுத்தக் கடமை சார்ந்த நம்பிக்கைத் துரோகத்தைச் சுட்டுகிறது; பொதுவான ‘பாவம் செய்தான்’ என்பதைவிட இந்தத் தேர்வு மூலத்தின் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: தன் கடவுளாகிய யாவேக்கு
  rationale: מעל உடன் בְּ எதிரான நம்பிக்கைத் துரோகத்தின் இலக்கைக் குறிக்கிறது; தமிழில் ‘யாவேக்கு உண்மையற்றவனாக’ என்பது இயல்பான அமைப்பு.
- source_word: הֵיכַל יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: הֵיכָל இச்சூழலில் ஆலயக் கட்டிடத்தைக் குறிக்கிறது; ‘ஆலயம்’ நவீனத் தமிழில் தெளிவான வழிபாட்டுச் சொல்.
- source_word: לְהַקְטִיר
  choice: தூபம் காட்டுவதற்காக
  rationale: கிப்ஈல் வடிவிலுள்ள קטר வழிபாட்டுச் சூழலில் தூபத்தை எரித்துப் படைப்பதைக் குறிக்கிறது; ‘தூபம் காட்டுதல்’ தமிழில் நிலைபெற்ற, இயல்பான வழிபாட்டுச் சொற்றொடர்.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: தூபப் பீடம்
  rationale: தூபம் செலுத்துவதற்கென அமைந்த பலிபீடத்தைச் சுருக்கமாகவும் தெளிவாகவும் குறிக்கும் நிலையான தமிழ்ச் சொல்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக இடம்பெறுவதால், பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: עַד לְהַשְׁחִית என்பதன் பொருள்
  choice: கர்வம் அவனை அழிவுக்கு இட்டுச் சென்றது
  alternative: அவன் கெட்டுப்போகும் அளவுக்கு கர்வமடைந்தான்
  rationale: இந்தச் சூழலில் அழிவு அல்லது நாசம் என்ற விளைவுப் பொருள் வலுவாக உள்ளது; இருப்பினும் ‘கெட்டுப்போதல்/சீர்கெடுதல்’ என்ற செயல்முறைப் பொருளும் இலக்கண ரீதியாக சாத்தியம்.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான வேதாகம நடையுடன் சாதாரண வாசகருக்கும் புரியும் வாக்கிய அமைப்பு பயன்படுத்தப்பட்டது. எபிரெய மொழிவழக்கை அப்படியே செயற்கையாகக் கடத்தாமல் அதன் கர்வப் பொருள் தெளிவாக்கப்பட்டது; அதே நேரத்தில் உடன்படிக்கை நம்பிக்கைத் துரோகத்தின் நுணுக்கம் பாதுகாக்கப்பட்டது.
