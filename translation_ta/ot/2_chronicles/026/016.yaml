revisions:
- from: ஆனால் அவன் வலிமை அடைந்தபோது, அவனுடைய உள்ளம் கர்வமடைந்து அவனை அழிவுக்கு இட்டுச் சென்றது. அவன் தன் கடவுளாகிய யாவேக்கு உண்மையற்றவனாக நடந்துகொண்டு, தூபப் பீடத்தின்மேல் தூபம் காட்டுவதற்காக யாவேயின் ஆலயத்திற்குள் நுழைந்தான்.
  to: ஆனால், அவன் வலிமையடைந்தபோது, அவனுடைய இதயம் அகந்தையடைந்து, அவன் அழிவுக்கு ஆளானான். அவன் தன் கடவுளாகிய யாவேக்கு உண்மையற்றவனாக நடந்துகொண்டு, தூபப் பீடத்தின்மேல் தூபம் காட்டுவதற்காக யாவேயின் ஆலயத்துக்குள் சென்றான்.
  rationale: The revision keeps the temporal contrast, the Hebrew ‘heart’ idiom, and the result expressed by עַד לְהַשְׁחִית, while avoiding the added formulation that the heart actively ‘led’ him to destruction. It preserves the divine name, covenantal unfaithfulness, temple terminology, and cultic action in idiomatic modern standard Tamil.
  reviewer_model: gpt-5.6-terra
