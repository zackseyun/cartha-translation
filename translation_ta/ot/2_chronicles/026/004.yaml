source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/004.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that Amaziah his father had done.
translation:
  language: ta
  text: அவன், தன் தந்தையான அமத்சியா செய்த எல்லாவற்றின்படியும், யாவேயின் பார்வையில் சரியானதைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: தொடர்ச்சியான இறந்தகாலக் கதைநடையை இயல்பான நவீனத் தமிழில் தருகிறது; எபிரெய இணைப்பைத் தனியே ‘மேலும்’ என்று மொழிபெயர்க்கத் தேவையில்லை.
- source_word: הַיָּשָׁר
  choice: நேர்மையானதை
  rationale: עשה உடன் வரும் יָשָׁר, ஒழுக்கரீதியில் சரியான அல்லது நேர்மையான செயலைக் குறிக்கும் வழக்குச் சொற்றொடர்; ‘நேர்மையானதைச் செய்தான்’ என்பது இயல்பாகவும் மதிப்பீட்டைத் தெளிவாகவும் தருகிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: சொல்லுக்கு சொல் ‘கண்களில்’ என்ற உருவகத்தைவிட, ஒருவரது மதிப்பீட்டின்படி என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: כְּכֹל אֲשֶׁר
  choice: செய்த எல்லாவற்றின்படியும்
  rationale: כְּ-இன் ஒப்புமை அல்லது இணக்கத்தையும் כֹל-இன் முழுமையையும் ஒருங்கே பாதுகாக்கிறது.
- source_word: עָשָׂה
  choice: செய்த
  rationale: அமத்சியாவின் முந்தைய செயல்களைத் தமிழ் சார்பெச்ச வடிவில் இயல்பாகக் குறிக்கிறது.
- source_word: אֲמַצְיָהוּ
  choice: அமத்சியா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: אָבִיו
  choice: தன் தந்தை
  rationale: இச்சூழலில் அமத்சியா உசியாவின் நேரடியான தந்தை; ‘தன்’ என்பது எழுவாயுடனான உறவைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரெய உரையில் பட்டமல்ல, தனிப்பட்ட தெய்வீகப் பெயரே உள்ளது. ஆகவே பெயரைப் பாதுகாக்கும் ‘யாவே’ முதன்மை உரையில் வைக்கப்பட்டு, தமிழில் மரபான பட்டப்பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயினும் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பார்வையில்’ என்பது எபிரெய மதிப்பீட்டு மரபுத்தொடரை இயல்பாகத் தருகிறது; வாக்கியத்தின் ஒப்புமைக் கூறு முதலில் வைக்கப்பட்டு தமிழ் ஓட்டம் மேம்படுத்தப்பட்டுள்ளது.
