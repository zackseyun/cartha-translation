base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
translation:
  language: ta
  text: அவன் புறப்பட்டுச் சென்று பெலிஸ்தியர்களுக்கு எதிராகப் போரிட்டான். காத் நகரத்தின் மதிலையும், யப்னே நகரத்தின் மதிலையும், அஸ்தோத் நகரத்தின் மதிலையும் உடைத்தான்.[a] பின்பு அஸ்தோத் பகுதியிலும் பெலிஸ்தியர்களின் நடுவிலும் நகரங்களைக் கட்டினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உடைத்தான்” என்பதை “மதில்களில் உடைப்பு ஏற்படுத்தினான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அஸ்தோத்தில், பெலிஸ்தியர்களின் நடுவில்” என்று உள்ளது. இங்கே “அஸ்தோத்” என்பது நகரத்தையோ அதைச் சுற்றிய பகுதியையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுப் போய்
  rationale: יצא என்பதன் அடிப்படைப் பொருளான ‘வெளியே செல்லுதல்/புறப்படுதல்’ என்பதைக் காக்கிறது; அடுத்த வினையே போரைத் தெளிவாகக் கூறுவதால் கூடுதல் இராணுவ நுட்பம் சேர்க்கப்படவில்லை.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களுக்கு எதிராகப் போரிட்டான்
  rationale: Niphal வடிவிலுள்ள לחם இங்கு போர் செய்வதைக் குறிக்கிறது; בְּ முன்னொட்டின் எதிர்ப்புப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיִּפְרֹץ
  choice: உடைத்துத் தகர்த்தான்
  rationale: פרץ என்பது மதிலில் உடைப்பு ஏற்படுத்துதல் அல்லது அதைத் தகர்த்தல் எனப் பொருள்படலாம். நகர மதில்களுடன் வரும் இச்சூழலில் இரு நுணுக்கங்களையும் புரியக்கூடிய தமிழில் எடுத்துரைக்கிறது.
- source_word: חוֹמַת
  choice: நகரத்தின் மதில்
  rationale: ஒவ்வொரு இடப்பெயருடனும் எபிரெயத்தில் ஒருமை அமைப்பு தனித்தனியாக வருவதால், மூன்று நகரங்களுக்கும் ‘மதில்’ ஒருமையாக மீண்டும் கூறப்பட்டுள்ளது.
- source_word: גַּת / יַבְנֵה / אַשְׁדּוֹד
  choice: காத் / யப்னே / அஸ்தோத்
  rationale: எபிரெய ஒலிப்புக்கு நெருக்கமான, தமிழில் வாசிக்கத்தக்க இடப்பெயர் வடிவங்கள்.
- source_word: וַיִּבְנֶה עָרִים
  choice: நகரங்களைக் கட்டினான்
  rationale: בנה என்பதற்கு நேரடியாக ‘கட்டு’ என்றும் עָרִים என்பதற்கு ‘நகரங்கள்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத ‘மீண்டும் கட்டினான்’ என்ற கருத்து சேர்க்கப்படவில்லை.
- source_word: בְּאַשְׁדּוֹד
  choice: அஸ்தோத் பகுதியில்
  rationale: ஒரே நகருக்குள் பல நகரங்கள் கட்டப்பட்டன என்ற சிக்கலைத் தவிர்க்க, அஸ்தோத் சார்ந்த சுற்றுப்பகுதியைக் குறிக்கக்கூடிய இடவியல் பொருள் முதன்மை உரையில் தரப்படுகிறது; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וּבַפְּלִשְׁתִּים
  choice: பெலிஸ்தியர்களின் நடுவில்
  rationale: மூலத்தில் நிலப்பெயர் அல்ல, மக்கள் குழுவே இருப்பதால் ‘பெலிஸ்தியா நாட்டில்’ என்று மாற்றாமல் மக்கள் நடுவிலான இடத்தைக் காட்டுகிறது.
