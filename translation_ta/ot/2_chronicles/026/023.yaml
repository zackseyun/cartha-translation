  text: וַ/יִּשְׁכַּ֨ב עֻזִּיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַ/יִּקְבְּר֨וּ אֹת֤/וֹ עִם אֲבֹתָי/ו֙ בִּ/שְׂדֵ֤ה הַ/קְּבוּרָה֙ אֲשֶׁ֣ר לַ/מְּלָכִ֔ים כִּ֥י אָמְר֖וּ מְצוֹרָ֣ע ה֑וּא וַ/יִּמְלֹ֛ךְ יוֹתָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
translation:
  language: ta
  text: உசியா தன் முன்னோர்களோடு துயிலடைந்தான். அரசர்களுக்குரிய அடக்க வயலில் அவனை அவனுடைய முன்னோர்களோடு அடக்கம் செய்தார்கள்; ஏனெனில், “அவன் ஒரு தொழுநோயாளி[a]” என்று அவர்கள் சொன்னார்கள். அவனுடைய மகன் யோதாம் அவனுக்குப் பதிலாக அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்குத் தோல் நோய் இருந்தது.” எபிரெயச் சொல் צָרַעַת எனப்படும் பாதிப்புக்குள்ளான ஒருவரைக் குறிக்கிறது; அது நவீன தொழுநோயைவிட விரிந்த தோல் பாதிப்பு வகையாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தான்
  rationale: அரச மரண அறிவிப்புகளில் இச்சொல் ‘தன் முன்னோர்களோடு’ என்பதுடன் சேர்ந்து மரணத்தைக் குறிக்கும் மரபுத்தொடராக வருகிறது. ‘இறந்தான்’ என்று பொருளை மட்டும் கூறாமல், எபிரெய உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: אָבוֹת என்பது இங்கு வம்ச முன்னோர்களைக் குறிக்கிறது. நவீன தமிழில் ‘பிதாக்கள்’ என்பதைவிட ‘முன்னோர்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; மரணம் மற்றும் அடக்கம் ஆகிய இரு இடங்களிலும் மூலத்தின் மீளுருவாக்கம் காக்கப்பட்டுள்ளது.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவனை ... அடக்கம் செய்தார்கள்
  rationale: எபிரெய வினை பன்மைச் செயப்பாட்டு வடிவில் உள்ளது; செய்பவர்கள் குறிப்பிடப்படாத நிலையையும் தமிழ் மொழிபெயர்ப்பு காக்கிறது.
- source_word: בִּשְׂדֵה הַקְּבוּרָה
  choice: அடக்க வயலில்
  rationale: שָׂדֶה என்பதன் நேர்ப்பொருளான ‘வயல்’ என்ற concrete image காக்கப்படுகிறது; இது வெறும் ‘கல்லறை’ என்று சுருக்கப்படவில்லை.
- source_word: אֲשֶׁר לַמְּלָכִים
  choice: அரசர்களுக்குரிய
  rationale: லாமேத் உரிமையையோ ஒதுக்கீட்டையையோ குறிக்கலாம். ‘அரசர்களுக்குரிய’ என்பது அந்த உறவை இயல்பாகக் கூறுவதோடு, தனிச்சொத்தா அல்லது பயன்பாட்டுக்காக ஒதுக்கப்பட்டதா என்பதைத் தேவையின்றி தீர்மானிக்காது.
- source_word: כִּי אָמְרוּ
  choice: ஏனெனில் ... என்று அவர்கள் சொன்னார்கள்
  rationale: כִּי இங்கு அந்த அடக்க இடத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது; நேரடிக் கூற்றும் மூலத்தின்படி காக்கப்படுகிறது.
- source_word: מְצוֹרָע
  choice: தொழுநோயாளி
  rationale: மரபாக அறியப்பட்ட சுருக்கமான சொல்லாட்சி பிரதான உரையில் வைக்கப்பட்டுள்ளது. ஆனால் எபிரெய צָרַעַת நவீன ஹான்சன் நோயைவிட விரிந்த தோல் பாதிப்பு வகையைக் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: அரச வாரிசுரிமை அறிவிப்பில் מלך என்பதற்கான இயல்பான, சுருக்கமான தமிழ் இணை.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: இது காலவரிசையை மட்டும் அல்லாமல் அரசப் பதவியில் ஏற்பட்ட மாற்றீட்டைக் குறிக்கிறது; ‘அவனுக்குப் பிறகு’ என்பதைக் காட்டிலும் மூலத்திற்கு நெருக்கமானது.
theological_decisions:
- issue: מְצוֹרָע என்பதின் சடங்கு/மருத்துவப் பொருள்
  choice: அவன் ஒரு தொழுநோயாளி
  alternative: அவனுக்குத் தோல் நோய் இருந்தது / அவன் ஒரு தோல் நோயால் பாதிக்கப்பட்டவன்
  rationale: எபிரெயச் சொல் צָרַעַת பாதிப்புக்குள்ளான ஒருவரைக் குறிக்கிறது; அது நவீன மருத்துவத்தில் ‘தொழுநோய்’ எனப்படும் ஹான்சன் நோயுடன் முற்றிலும் ஒத்ததாக இருக்க வேண்டியதில்லை. பரிச்சயமான மரபுச் சொல்லை பிரதான உரையில் வைத்து, மூலத்தின் விரிந்த பொருள் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மரணத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர் ‘துயிலடைந்தான்’ என்று பாதுகாக்கப்பட்டுள்ளது; பழமையான ‘பிதாக்கள்’ என்பதற்குப் பதிலாக ‘முன்னோர்கள்’ பயன்படுத்தப்பட்டுள்ளது. வசனத்தின் காரணவியல் தொடர்பும் நேரடிக் கூற்றும் தெளிவாக வைக்கப்பட்டுள்ளன.
