translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று நடையைக் கையாள்கிறது. எபிரேய மரண மரபுத்தொடரின் உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; அரசியல் மீட்பு சார்ந்த வினைக்கு நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
