base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/002.yaml
  text: He built Eloth and restored it to Judah after the king slept with his fathers[a][b].
translation:
  language: ta
  text: அவன் ஏலோத்தை கட்டி, அரசன் தன் முன்னோர்களோடு துயிலடைந்த பிறகு[b] அதை யூதாவுக்குத் திரும்பக் கொண்டுவந்தான்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதை யூதாவுக்கு மீட்டுக் கொடுத்தான்.”
    reason: lexical_alternative
  - marker: b
    text: “தன் முன்னோர்களோடு துயிலடைந்தான்” என்பது இறந்ததைக் குறிக்கும் எபிரேய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: הוּא
  choice: அவனே
  rationale: தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּנָה
  choice: கட்டி
  rationale: வினைச்சொல்லின் நேரடிப் பொருள் ‘கட்டுதல்’; ஏற்கெனவே இருந்த இடத்தை ‘மீண்டும் கட்டினான்’ என்ற சூழல் சார்ந்த நுணுக்கம் மூலத்தில் வெளிப்படையாக இல்லை.
- source_word: אֵילוֹת
  choice: ஏலோத்தை
  rationale: இது இடப்பெயர் என்பதால் எபிரேய வடிவத்துக்கு அண்மையாக ஒலிபெயர்க்கப்பட்டுள்ளது; தமிழ் வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: וַיְשִׁיבֶהָ
  choice: அதை ... திரும்பக் கொண்டுவந்தான்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளைக் கொண்டது; பெண்பால் ஒருமை பின்னொட்டு ஏலோத்தைக் குறிக்கிறது. யூதாவின் கட்டுப்பாட்டுக்கு மீண்டும் கொண்டுவருதலை இயல்பாகச் சொல்கிறது.
- source_word: לִיהוּדָה
  choice: யூதாவுக்கு
  rationale: ל குறிக்கும் இலக்கு அல்லது பெறுநர் சார்ந்த திசைப்பொருளைத் தக்கவைக்கிறது.
- source_word: אַחֲרֵי שְׁכַב
  choice: துயிலடைந்த பிறகு
  rationale: மரணத்தைக் குறிக்கும் எபிரேய மரபுத்தொடரின் உருவகத்தைத் தக்கவைத்தபடி, நவீனத் தமிழில் கண்ணியமாகவும் புரியும்படியும் உள்ளது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: மூலத்தில் தனிப்பெயர் அல்ல, ‘அரசன்’ என்றே உள்ளது; சூழலிலிருந்து அமத்சியா குறிக்கப்படுகிறார் என்றாலும் பெயர் சேர்க்கப்படவில்லை.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: சொல்லுக்கு சொல் ‘தன் தந்தையரோடு’ எனலாம்; இம்மரண மரபுத்தொடரில் אבות என்பது முந்தைய தலைமுறையினரை, அதாவது முன்னோர்களைக் குறிக்கிறது.
