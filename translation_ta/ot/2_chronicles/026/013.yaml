  register: நவீனச் செந்தமிழும் பொதுப் பயன்பாட்டுத் தமிழும் கலந்த, கண்ணியமான மற்றும் எளிதில் புரியும் நடை. ‘கட்டுப்பாட்டில்’, ‘படை’, ‘பகைவர்’ ஆகிய சொற்கள் இராணுவ-அரச சூழலைத் தெளிவாகத் தருகின்றன; இலக்கணம் இயல்பாக அமைய ஒரே நீண்ட தொடரை இரண்டு வாக்கியங்களாக அமைத்துள்ளது.
