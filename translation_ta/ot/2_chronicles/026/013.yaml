  text: Under their command was an army of 307,500[a], making war with mighty power, to help the king against the enemy.
translation:
  language: ta
  text: அவர்களுடைய தலைமையின்கீழ், மிகுந்த வலிமையுடன் போர் செய்யும் 3,07,500 வீரர்களைக் கொண்ட ஒரு படை, பகைவருக்கு எதிராக அரசனுக்கு உதவுவதற்காக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நெருக்கமாக: “அவர்களுடைய கையின்கீழ் 3,07,500 பேரைக் கொண்ட ஒரு இராணுவப் படை இருந்தது; அவர்கள் வல்லமையின் ஆற்றலோடு போர் செய்பவர்கள், பகைவருக்கு எதிராக அரசனுக்கு உதவுவதற்காக இருந்தனர்.”'
    reason: וְעַל־יָדָם என்ற நிர்வாக மரபுத்தொடரின் நேரடியான வடிவத்தையும், עוֹשֵׂי מִלְחָמָה மற்றும் לַעְזֹר ஆகியவற்றின் சொல்லுக்கு நெருக்கமான மாற்றையும் வழங்குகிறது.
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: அவர்களுடைய கட்டுப்பாட்டில்
  rationale: עַל־יָדָם என்பது இங்கு நேரடியான ‘அவர்களுடைய கையால்’ என்பதல்ல; முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தலைவர்களின் மேற்பார்வை அல்லது அதிகாரத்தைக் குறிக்கும் இராணுவ நிர்வாக மரபுத்தொடர்.
- source_word: חֵיל צָבָא
  choice: வீரர்களைக் கொண்ட படை
  rationale: இரு எபிரெயச் சொற்களும் சேர்ந்து ஓர் இராணுவப் படையைக் குறிக்கின்றன. எண்ணிக்கை படைவீரர்களின் எண்ணிக்கையாக இயல்பாகப் புரியும்படி தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 3,07,500
  rationale: எபிரெய எண்ணிக்கையின் நேரடியான கூட்டுத்தொகை; தமிழ் வாசகர்களுக்கு வழக்கமான இந்திய இலக்கப் பிரிப்பில் தரப்பட்டுள்ளது.
- source_word: עוֹשֵׂי מִלְחָמָה
  choice: போரிட்டு
  rationale: சொல்லுக்கு நெருக்கமாக ‘போர் செய்பவர்கள்’ என்று பொருள். சூழலில் படைவீரர்களின் போர்செய்யும் பணியைக் குறிக்கிறது; பயிற்சி பெற்றவர்கள் என்று மூலத்தில் இல்லாத கருத்தைச் சேர்க்காமல் இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: בְּכֹחַ חָיִל
  choice: வலிமையோடு
  rationale: כֹּחַ மற்றும் חַיִל ஆகிய இரண்டும் வலிமை, ஆற்றல், வீரத்திறன் போன்ற கருத்துகளை வலியுறுத்துகின்றன. ‘வலிமையோடு’ அவற்றின் கூட்டு இராணுவப் பொருளை இயல்பாகச் சுருக்குகிறது.
- source_word: לַעְזֹר לַמֶּלֶךְ
  choice: அரசனுக்கு உதவத் தயாராயிருந்தார்கள்
  rationale: நோக்கத்தைக் குறிக்கும் ל־ உடன் עזר ‘அரசனுக்கு உதவுவதற்காக’ எனப் பொருள்படும். தமிழில் படையின் நிலை மற்றும் நோக்கம் தெளிவாக இணைய ‘தயாராயிருந்தார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל הָאוֹיֵב
  choice: பகைவருக்கு எதிராக
  rationale: இராணுவச் சூழலில் עַל எதிர்ப்பைக் குறிக்கிறது; பகைவருக்கு எதிராக அரசனுக்கு உதவுதல் என்பது இயல்பான தமிழ் வெளிப்பாடு.
