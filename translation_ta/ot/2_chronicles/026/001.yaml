  register: மொழிநடை நவீன பொதுத்தமிழாகவும், வாசிக்க எளிதாகவும், வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியத்துடனும் வைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத் தொடரை தமிழின் தெளிவுக்காக மூன்று குறும் வாக்கியங்களாகப் பிரித்துள்ளோம்; இளம் வயதைக் குறிக்கும் இணைப்பில் தேவையற்ற விட்டுக்கொடுப்பு நுணுக்கத்தை முதன்மை உரையில் திணிக்கவில்லை.
