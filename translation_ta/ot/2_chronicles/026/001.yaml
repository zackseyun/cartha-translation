base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
translation:
  language: ta
  text: யூதாவின் மக்கள் அனைவரும் பதினாறு வயதான உசியாவை எடுத்துக்கொண்டு, அவனுடைய தந்தை அமத்சியாவுக்குப் பதிலாக அரசனாக்கினர்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: “உசியாவை எடுத்தார்கள்.” இச்சூழலில், அவரை அரியணைக்கு உயர்த்துவதற்காக மக்கள் மேற்கொண்ட செயலை இது குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் நேரடியாக: “அவன் பதினாறு ஆண்டுகளின் மகனாக இருந்தான்.” தொடக்க இணைப்புச் சொல்லை “மேலும்” என்றும், சூழல்சார்ந்து “அவனுக்குப் பதினாறு வயதே இருந்தபோதிலும்” என்றும் புரிந்துகொள்ளலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: தேர்ந்தெடுத்தார்கள்
  rationale: לקח என்பதன் நேரடிப் பொருள் ‘எடுத்தார்கள்.’ ஆனால் இங்கு மக்களால் உசியா அரியணைக்கு உயர்த்தப்படுவதைச் சூழல் குறிப்பதால், இயல்பான நவீன தமிழில் ‘தேர்ந்தெடுத்தார்கள்’ என்று மொழிபெயர்க்கப்பட்டது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כָּל עַם יְהוּדָה
  choice: யூதாவின் மக்கள் அனைவரும்
  rationale: ‘யூதாவின் மக்கள் அனைவரும்’ என்பது עַם என்ற கூட்டுமக்கள் குறிப்பையும் כָּל என்ற முழுமையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עֻזִּיָּהוּ
  choice: உசியா
  rationale: இவ்வசனத்தில் உள்ள עֻזִּיָּהוּ என்ற பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; தொடர்புடைய வேறு பகுதிகளில் காணப்படும் ‘அசரியா’ என்ற மாற்றுப் பெயர் இங்கு மூலத்தில் இல்லை.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: அப்போது அவனுக்குப் பதினாறு வயது
  rationale: ‘அவன் பதினாறு ஆண்டுகளின் மகன்’ என்ற எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வயதைக் குறிக்கும் வகையில் அளிக்கிறது. וְ என்ற இணைப்பை காரணமின்றி ‘இருந்தபோதிலும்’ என வலியுறுத்தாமல், நடுநிலையான தொடர்ச்சியாக வைத்துள்ளது.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: அவனை அரசனாக்கினார்கள்
  rationale: מלך என்பதன் ஹிஃபில் வடிவம் ‘ஒருவரை அரசனாக்குதல்’ அல்லது ‘ஆளச் செய்தல்’ என்று பொருள்படும். ‘முடிசூட்டினார்கள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத சடங்கைச் சேர்க்கக்கூடும்.
- source_word: תַּחַת
  choice: பதிலாக
  rationale: அரச வாரிசுரிமைச் சூழலில் תַּחַת என்பது முன்னிருந்தவரின் இடத்தை ஏற்றுக்கொள்வதை, அதாவது ‘பதிலாக’ என்பதைக் குறிக்கிறது.
- source_word: אָבִיו אֲמַצְיָהוּ
  choice: அவனுடைய தந்தை அமத்சியா
  rationale: தந்தை–மகன் உறவையும் அֲמַצְיָהוּ என்ற பெயரையும் நேரடியாகவும் தெளிவாகவும் வழங்குகிறது.
