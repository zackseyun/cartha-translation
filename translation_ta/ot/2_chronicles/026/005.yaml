  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִי֙ לִ/דְרֹ֣שׁ אֱלֹהִ֔ים בִּ/ימֵ֣י זְכַרְיָ֔הוּ הַ/מֵּבִ֖ין בִּ/רְאֹ֣ת הָ/אֱלֹהִ֑ים וּ/בִ/ימֵי֙ דָּרְשׁ֣/וֹ אֶת יְהוָ֔ה הִצְלִיח֖/וֹ הָ/אֱלֹהִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
translation:
  language: ta
  text: கடவுளின் தரிசனங்களைப் புரிந்தவரான சகரியாவின் நாட்களில்[a], அவர் கடவுளைத் தொடர்ந்து தேடிவந்தார். அவர் யாவேயை[b] தேடிய காலமெல்லாம், கடவுள் அவரைச் செழிக்கச் செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுக்குப் பயப்படக் கற்பித்தவரான சகரியாவின் நாட்களில்.” எபிரெயச் சொற்றொடர் புரிந்துகொள்வதற்குக் கடினமானது; மசோரா உரையை இன்னும் சொல் நெருக்கமாக மொழிபெயர்த்தால், “கடவுளின் தரிசனங்களில் புரிதலுள்ளவர்” என்று வரும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “அவர் யாவேயைத் தேடிய நாட்களில்.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי לִדְרֹשׁ אֱלֹהִים
  choice: அவர் கடவுளைத் தொடர்ந்து தேடிவந்தார்
  rationale: היה + infinitive construction indicates an ongoing practice. ‘தொடர்ந்து தேடிவந்தார்’ naturally conveys this durative sense in modern Tamil, while ‘கடவுளைத் தேடுதல்’ preserves the broader devotional and dependence-oriented force of דרש.
- source_word: בִּימֵי זְכַרְיָהוּ
  choice: சகரியாவின் நாட்களில்
  rationale: This directly preserves the Hebrew temporal expression and is natural in dignified Tamil.
- source_word: הַמֵּבִין בִּרְאֹת הָאֱלֹהִים
  choice: கடவுளின் தரிசனங்களைப் புரிந்துகொண்ட
  rationale: The Masoretic pointing relates the difficult phrase to seeing or visions. ‘தரிசனங்கள்’ communicates revelatory visions, while ‘புரிந்துகொண்ட’ reflects the participle הַמֵּבִין without turning Zechariah into an instructor.
- source_word: וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה
  choice: அவர் யாவேயை தேடிய காலமெல்லாம்
  rationale: '‘காலமெல்லாம்’ idiomatically conveys the durative temporal force and resulting connection: throughout the period in which he sought Yahweh.'
- source_word: יְהוָה
  choice: யாவே
  rationale: This Tamil transliteration represents the personal divine name Yahweh rather than replacing it with the title ‘கர்த்தர்’.
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  choice: கடவுள் அவரைச் செழிக்கச் செய்தார்
  rationale: 'The causative Hiphil is retained: God caused him to prosper. ‘செழிக்கச் செய்தார்’ is concise and natural in Tamil.'
theological_decisions:
- issue: Meaning of בִּרְאֹת הָאֱלֹהִים
  choice: சகரியா கடவுளின் தரிசனங்களைப் புரிந்துகொண்டவர்
  alternative: சகரியா கடவுளுக்குப் பயப்படுவதில் அறிவுறுத்தியவர்
  rationale: The main text follows the Masoretic pointing and preserves the sight/vision sense. Because the Hebrew phrase is difficult and a fear/instruction reading has substantial translation history, that alternative is retained in a footnote rather than silently preferred.
- issue: Temporal force of וּבִימֵי דָּרְשׁוֹ
  choice: அவர் யாவேயை தேடிய காலமெல்லாம்
  alternative: அவர் யாவேயைத் தேடிய நாட்களில்
  rationale: The main rendering naturally expresses the duration and the connection with God-given prosperity, while the more formally literal temporal wording remains in a footnote.
translation_notes:
  register: Modern standard Tamil in a dignified but broadly understandable register. The verbal flow is natural rather than mechanically mirroring Hebrew order. ‘தரிசனம்’ is retained because it is current religious Tamil and best preserves the source’s vision-related ambiguity; the difficult alternative is explicitly documented.
