source:
  edition: WLC
  text: וַ/יִּ֨בֶן מִגְדָּלִ֜ים בַּ/מִּדְבָּ֗ר וַ/יַּחְצֹב֙ בֹּר֣וֹת רַבִּ֔ים כִּ֤י מִקְנֶה רַּב֙ הָ֣יָה ל֔/וֹ וּ/בַ/שְּׁפֵלָ֖ה וּ/בַ/מִּישׁ֑וֹר אִכָּרִ֣ים וְ/כֹֽרְמִ֗ים בֶּ/הָרִים֙ וּ/בַ/כַּרְמֶ֔ל כִּֽי אֹהֵ֥ב אֲדָמָ֖ה הָיָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
translation:
  language: ta
  text: அவர் வனாந்தரத்தில் கோபுரங்களைக் கட்டி, பல நீர்த்தேக்கத் தொட்டிகளை வெட்டியெடுத்தார்[a]; ஏனெனில் தாழ்நிலத்திலும்[b] சமவெளியிலும் அவருக்கு மிகுந்த கால்நடைகள் இருந்தன. மலைப்பகுதிகளிலும் செழிப்பான நிலத்திலும்[c] உழவர்களும் திராட்சைத்தோட்டப் பணியாளர்களும் இருந்தனர்; ஏனெனில் அவர் மண்ணை நேசித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காவற்கோபுரங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஷெஃபெலா” என்றும் மொழிபெயர்க்கலாம்; இது யூதேயாவின் தாழ்வான அடிவாரப் பகுதி.
    reason: cultural_note
  - marker: c
    text: இதனைப் பொதுப்பெயராக அல்லாமல் இடப்பெயராக எடுத்தால், “கார்மேலில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  choice: கோபுரங்கள்
  rationale: எபிரெயச் சொல் பொதுவாகக் கோபுரங்களைக் குறிக்கிறது. சூழலில் காவற்கோபுரங்கள் எனப் பொருள்கொள்ள முடிந்தாலும், அவற்றின் பணியை மூலவாசகம் வெளிப்படையாகக் குறிப்பிடாததால் பொதுவான சொல்லே முதன்மை உரையில் வைக்கப்பட்டது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது வனாந்தரம், திறந்த புல்வெளி அல்லது மேய்ச்சல் நிலத்தைக் குறிக்கலாம். வறட்சியை மிகையாக வலியுறுத்தாமல் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: וַיַּחְצֹב בֹּרוֹת רַבִּים
  choice: ஏராளமான நீர்த்தொட்டிகளைப் பாறையில் வெட்டினார்
  rationale: חצב என்பதன் அடிப்படை உணர்வு வெட்டுதல் அல்லது பாறையைக் குடைதல்; בורות இங்கு கால்நடைகளுக்கான நீரைச் சேமிக்கும் தொட்டிகளைக் குறிக்கிறது. 'பாறையில்' என்பது வினையின் இயல்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: מִקְנֶה רַב
  choice: ஏராளமான கால்நடைகள்
  rationale: מִקְנֶה என்பது ஒரு குறிப்பிட்ட இனத்தை அல்லாமல் மொத்த கால்நடைச் செல்வத்தைக் குறிக்கும் கூட்டுப்பெயர்.
- source_word: שְׁפֵלָה
  choice: தாழ்நிலம்
  rationale: இது யூதேயாவின் மலைநாட்டுக்கும் கடற்கரைச் சமவெளிக்கும் இடைப்பட்ட தாழ்வான அடிவாரப் பகுதியைக் குறிக்கும் புவியியல் சொல்; தமிழில் பொருளை அணுகத்தக்கவாறு மொழிபெயர்க்கப்பட்டது.
- source_word: מִישׁוֹר
  choice: சமவெளி
  rationale: சமமான அல்லது மேடான நிலப்பரப்பைக் குறிக்கும் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: אִכָּרִים
  choice: உழவர்கள்
  rationale: நிலத்தை உழுது பயிரிடுவோரைத் துல்லியமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: כֹרְמִים
  choice: திராட்சைத்தோட்டப் பணியாளர்கள்
  rationale: திராட்சைத்தோட்டங்களைப் பயிரிட்டு பராமரிப்பவர்களைச் சொல் குறிப்பாகக் குறிக்கிறது; பொதுவான 'தோட்டக்காரர்கள்' என்பதைவிடத் துல்லியமானது.
- source_word: בֶּהָרִים
  choice: மலைப்பகுதிகளில்
  rationale: הרים என்பது மலைகள் அல்லது குன்றுப் பகுதிகளைக் குறிக்கலாம்; விவசாயச் சூழலில் 'மலைப்பகுதிகள்' இயல்பாகவும் அளவுக்கு மீறாததாகவும் உள்ளது.
- source_word: בַּכַּרְמֶל
  choice: செழிப்பான நிலத்தில்
  rationale: כַּרְמֶל என்பதைக் கார்மேல் என்ற இடப்பெயராகவும், செழிப்பான பயிர்நிலம் என்ற பொதுப்பெயராகவும் கொள்ளலாம். இணையாக வரிசைப்படுத்தப்பட்ட நிலவகைகளும் விவசாயச் சூழலும் பொதுப்பெயர்ப் பொருளை ஆதரிக்கின்றன; வேறுபொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֹהֵב אֲדָמָה
  choice: அவர் மண்ணை நேசித்தார்
  rationale: אֲדָמָה என்பதன் மண்/நிலம் என்ற நேரடியான, உருவகமிக்க பொருளைப் பாதுகாக்கிறது; 'விவசாயத்தை விரும்பினார்' என்று விளக்கவுரையாக்கவில்லை.
