translation_notes:
  register: நவீன தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. எபிரெய வாக்கியத்தின் காரணத் தொடர்புகளும் விவசாயப் படிமமும் காக்கப்பட்டுள்ளன. நிலப்பகுதிகளுக்கும் அவற்றில் பணியாற்றியவர்களுக்கும் இடையிலான இணைப்பு தமிழில் தெளிவாக இருக்க, இரண்டாம் அரைப்பகுதி இயல்பான தொடராக அமைக்கப்பட்டது.
