source:
  edition: WLC
  text: וַ/יָּבֹ֥א אַחֲרָ֖י/ו עֲזַרְיָ֣הוּ הַ/כֹּהֵ֑ן וְ/עִמּ֞/וֹ כֹּהֲנִ֧ים לַ/יהוָ֛ה שְׁמוֹנִ֖ים בְּנֵי חָֽיִל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/017.yaml
  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
translation:
  language: ta
  text: ஆசாரியரான அசரியா அவருக்குப் பின்னால் உள்ளே சென்றார்; அவருடன் யாவேயின் ஆசாரியர்கள் எண்பது பேர் இருந்தனர். அவர்கள் வீரமிக்க ஆண்களாயிருந்தனர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலிமைமிக்க ஆண்கள்.” בְּנֵי חָיִל என்ற எபிரேய மரபுத்தொடர் வலிமை, துணிவு அல்லது வீரம் கொண்ட ஆண்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אַחֲרָיו
  choice: அவனைப் பின்தொடர்ந்து உள்ளே சென்றார்
  rationale: בוא என்பது வருதல், செல்லுதல், நுழைதல் ஆகிய பொருள்களைக் கொள்ளும். இச்சூழலில் அசரியா அரசனைத் தொடர்ந்து உள்ளே நுழைவதால், இயக்கத்தையும் אַחֲרָיו என்பதன் ‘அவனுக்குப் பின்னால்/அவனைத் தொடர்ந்து’ என்ற உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲזַרְיָהוּ הַכֹּהֵן
  choice: ஆசாரியரான அசரியா
  rationale: பெயர் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டு, definite appositional title இயல்பான தமிழில் பெயருக்கு முன் பெயரடைத்தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: וְעִמּוֹ
  choice: அவருடன் ... இருந்தனர்
  rationale: எபிரெயில் வினையில்லாத உடனிருப்புத் தொடர் உள்ளது. தெளிவான நவீன தமிழுக்காக ‘இருந்தனர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: כֹּהֲנִים לַיהוָה
  choice: யாவேயின் ஆசாரியர்கள்
  rationale: לְ இங்கு யாவேக்கு உரியவர்கள் அல்லது அவருக்குப் பணிபுரிபவர்கள் என்ற உறவைக் குறிக்கிறது; உடைமை வேற்றுமை தமிழ் நடையில் இதைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: שְׁמוֹנִים
  choice: எண்பது பேர்
  rationale: எண்ணிக்கை நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது; மனிதர்களைக் கணிக்கும் இயல்பான தமிழ் வடிவமாக ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְּנֵי חָיִל
  choice: வீரமிக்க ஆண்கள்
  rationale: சொல்லுக்கு சொல் ‘வலிமை/வீரத்தின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடர், வலிமை, துணிவு அல்லது வீரத்தால் சிறந்த ஆண்களைக் குறிக்கிறது. அரசனை எதிர்கொள்ளும் இச்சூழலில் ‘வீரமிக்க ஆண்கள்’ இயல்பாக அதன் வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைபெயர் நேரடியாக வருகிறது. அதை ஒரு பட்டமாக மாற்றாமல், உடன்படிக்கையின் தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בְּנֵי חָיִל என்பதிலுள்ள ஆண்பால் குறிப்பு
  choice: வீரமிக்க ஆண்கள்
  alternative: வீரமிக்கவர்கள்; வலிமைமிக்க ஆண்கள்
  rationale: இலக்கண வடிவமும் சூழலில் குறிப்பிடப்படும் ஆசாரியர்களும் ஆண்களைக் குறிக்கின்றன; எனவே பாலைக் குறிப்பிடாத வகையில் பொதுமைப்படுத்தாமல் மூலத்தின் குறிப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் மரியாதையான உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ வடிவங்கள் தமிழ் வாசிப்பில் இயல்பான மரியாதையை வழங்குகின்றன; மூலத்தின் நிகழ்வுகளோ பதவிநிலைகளோ இதனால் மாற்றப்படவில்லை. அடிக்குறிப்பு குறி அது விளக்கும் ‘வீரமிக்க ஆண்கள்’ என்ற தொடரிலேயே வைக்கப்பட்டுள்ளது.
