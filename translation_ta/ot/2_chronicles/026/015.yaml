  text: וַ/יַּ֣עַשׂ בִּ/ירוּשָׁלִַ֨ם חִשְּׁבֹנ֜וֹת מַחֲשֶׁ֣בֶת חוֹשֵׁ֗ב לִ/הְי֤וֹת עַל הַ/מִּגְדָּלִים֙ וְ/עַל הַ/פִּנּ֔וֹת לִ/ירוֹא֙ בַּֽ/חִצִּ֔ים וּ/בָ/אֲבָנִ֖ים גְּדֹל֑וֹת וַ/יֵּצֵ֤א שְׁמ/וֹ֙ עַד לְ/מֵ֣/רָח֔וֹק כִּֽי הִפְלִ֥יא לְ/הֵעָזֵ֖ר עַ֥ד כִּֽי חָזָֽק׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
translation:
  language: ta
  text: எருசலேமில், கோபுரங்களின்மேலும் மூலைகளின்மேலும் வைக்கப்படுவதற்காக, திறமையான கைவினைஞர்களின் வடிவமைப்பின்படி அம்புகளை எய்யவும் பெரிய கற்களை எறியவும் கருவிகளை[a] அவன் செய்தான். அவனுடைய புகழ் வெகுதூரம் பரவியது[b]; ஏனெனில் அவன் வலிமை அடையும்வரை வியக்கத்தக்க விதத்தில் உதவி பெற்றான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கருவிகள்’ என்பதற்கு ‘இயந்திரங்கள்’ அல்லது ‘நுட்பச் சாதனங்கள்’ என்றும் மொழிபெயர்க்கலாம். இவை கோபுரங்களிலும் கோட்டை மூலைகளிலும் பயன்படுத்த வடிவமைக்கப்பட்ட போர்க் கருவிகள்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அவனுடைய பெயர் வெகுதூரம் சென்றது.’'
    reason: lexical_alternative
  - marker: c
    text: அவனுக்கு உதவியவர் யார் என்று இவ்வாக்கியம் வெளிப்படையாகக் கூறவில்லை; சூழல் அது கடவுளின் உதவி என உணர்த்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת
  choice: கருவிகள்
  rationale: இச்சொல் திட்டமிட்டுக் கண்டுபிடிக்கப்பட்ட இயந்திர அமைப்புகள் அல்லது சாதனங்களைக் குறிக்கிறது. கோட்டைத் தற்காப்புக்கான பயன்பாட்டைச் சூழல் காட்டினாலும், பழங்காலத் தொழில்நுட்பத்தை அளவுக்கு மீறிக் குறிப்பாக்காமல் ‘கருவிகள்’ இயல்பாகப் பொருளைத் தருகிறது.
- source_word: מַחֲשֶׁבֶת חוֹשֵׁב
  choice: திறமைமிக்க கைவினைஞர்கள் வடிவமைக்கும்படி
  rationale: ஒரே சொல்ல்வேருடன் தொடர்புடைய இச்சொற்றொடர் திட்டமிடும் திறனையும் செய்நேர்த்தியையும் வலியுறுத்துகிறது. எபிரெயில் ஒருமை வடிவம் இருந்தாலும், இது தொழில்வகை அல்லது நிபுணத்துவப் பங்கைக் குறிக்கலாம்; தமிழில் இயல்பான கூட்டுப்பொருளுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל הַמִּגְדָּלִים וְעַל הַפִּנּוֹת
  choice: கோபுரங்களின்மேலும் மூலைகளின்மேலும்
  rationale: מִגְדָּלִים என்பதற்கு ‘கோபுரங்கள்’ நேரான பொருள். פִּנּוֹת என்பது சொற்பொருளில் ‘மூலைகள்’; கோட்டைச் சூழலில் அது மூலைப் பாதுகாப்பிடங்களைக் குறிக்கக்கூடும் என்றாலும், மூலத்தின் உருவகம் பாதுகாக்கப்படுகிறது.
- source_word: לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת
  choice: அம்புகளையும் பெரிய கற்களையும் எறியும்
  rationale: יָרָה அம்புகளை எய்வதையும் கற்களை வீசுவதையும் குறிக்கலாம். இரண்டிற்கும் பொருந்தும் இயல்பான தமிழ்ச் சொல்லாக ‘எறியும்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; கருவிகளின் இயந்திரச் செயலைச் சூழல் தெளிவாக்குகிறது.
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  choice: அவனுடைய புகழ் வெகுதூரம் பரவியது
  rationale: ‘அவனுடைய பெயர் வெகுதூரம் சென்றது’ என்ற எபிரெய மொழிமரபின் இயல்பான தமிழ்ப் பொருள் இது; புகழும் பெயர்பரவலும் தெரிவிக்கப்படுகின்றன.
- source_word: הִפְלִיא לְהֵעָזֵר
  choice: வியக்கத்தக்க விதத்தில் உதவி பெற்றான்
  rationale: פלא வியப்புக்குரிய அல்லது அசாதாரணமான தன்மையைச் சுட்டுகிறது; עזר இங்கு உதவி பெறுதலைக் காட்டுகிறது. செய்பவர் குறிப்பிடப்படாத மூலத்தின் செயல்பாட்டு அமைப்பு தமிழிலும் காக்கப்படுகிறது.
- source_word: עַד כִּי חָזָק
  choice: அவன் வலிமை அடையும்வரை
  rationale: உதவியின் விளைவாக அடைந்த நிலையை இச்சொற்றொடர் காட்டுகிறது. ‘வலிமை அடையும்வரை’ என்பது முன்னேற்றத்தையும் இறுதி நிலையையும் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: உதவி செய்தவர் யார் என்பது மறைமுகமாக இருப்பது
  choice: முதன்மை உரையில் உதவி செய்தவர் பெயரிடப்படாமல், ‘உதவி பெற்றான்’ என்று வினைச்செயப்பாட்டு வடிவம் காக்கப்பட்டது.
  alternative: ‘கர்த்தர் அவனுக்கு வியக்கத்தக்க விதத்தில் உதவினார்’ என்று கடவுளை வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: இவ்வசனத்தின் எபிரெய உரை உதவி செய்தவரை வெளிப்படையாகப் பெயரிடவில்லை. பரந்த சூழல் தெய்வீக உதவியை உணர்த்தினாலும், வசனம் கூறாததை முதன்மை உரையில் சேர்க்காமல் அதன் தெளிவின்மையும் இறையியல் இழுப்பும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கோட்டைத் தொழில்நுட்பத்தை நவீன ஆயுதப் பெயர்களால் அளவுக்கு மீறிக் குறிப்பாக்காமல், மூலத்தின் உருவகமும் செய்பவர் குறிப்பிடப்படாத இறுதி வாக்கியமும் பாதுகாக்கப்பட்டுள்ளன.
