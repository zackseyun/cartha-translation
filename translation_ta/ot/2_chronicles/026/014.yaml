  yaml_path: translation/ot/2_chronicles/026/014.yaml
  text: And Uzziah prepared for them[a], for the whole army, shields and spears and helmets and coats of armor and bows and slingstones.
translation:
  language: ta
  text: உசியா அவர்களுக்கு—படை முழுவதற்கும்—கேடயங்களையும் ஈட்டிகளையும் தலைக்கவசங்களையும் உடற்கவசங்களையும் வில்களையும் கவண்கற்களையும்[a] ஆயத்தப்படுத்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கவண்களுக்கான கற்கள்.’ எபிரெயத்தில் சொல்லுக்குச் சொல், ‘கவண்களின் கற்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: ஆயத்தப்படுத்தினான்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் இங்கு படைக்குத் தேவையான பொருட்களைத் தயாராகக் கிடைக்கச் செய்ததைக் குறிக்கிறது; அவற்றை உசியாவே உற்பத்தி செய்தான் என்று மிகைப்படுத்தாமல் இதை வெளிப்படுத்துகிறது.
- source_word: לָהֶם ... לְכָל הַצָּבָא
  choice: அவர்களுக்கு—படை முழுவதற்கும்—
  rationale: எபிரெய உரையிலுள்ள பன்மைச் சுட்டுப்பெயரையும், அதன் குறிப்பைத் தெளிவாக்கும் ‘படை முழுவதற்கும்’ என்ற தொடரையும் காக்கிறது; இடைக்கோடுகள் தமிழில் விளக்க இணைப்பை இயல்பாகக் காட்டுகின்றன.
- source_word: מָגִנִּים
  choice: கேடயங்கள்
  rationale: போர்ச் சூழலில் வழக்கமான, தெளிவான இணைச்சொல்.
- source_word: רְמָחִים
  choice: ஈட்டிகள்
  rationale: רֹמַח குறிக்கும் குத்துப் போராயுதத்திற்கான இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: כּוֹבָעִים
  choice: தலைக்கவசங்கள்
  rationale: இங்கு பாதுகாப்புக்கான போர்த் தலைக்கவசங்களைக் குறிக்கிறது.
- source_word: שִׁרְיֹנוֹת
  choice: உடற்கவசங்கள்
  rationale: உடலின், குறிப்பாக உடற்பகுதியின், பாதுகாப்புக் கவசத்தைக் குறிக்கிறது; குறிப்பிட்ட உலோகப் பின்னல் வகையை ஆதாரமின்றி சேர்ப்பதில்லை.
- source_word: קְשָׁתוֹת
  choice: வில்கள்
  rationale: வில் என்ற போராயுதத்தின் பன்மையை நேரடியாகவும் நவீனத் தமிழிலும் தருகிறது.
- source_word: אַבְנֵי קְלָעִים
  choice: கவண்கற்கள்
  rationale: ‘கவண்களின் கற்கள்’ என்ற எபிரெயச் சொல்லமைப்பைச் சுருக்கமாகவும் புரியத்தக்க வகையிலும் தருகிறது.
