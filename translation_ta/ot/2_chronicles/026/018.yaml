  revised_text: அவர்கள் அரசன் உசியாவை எதிர்த்து நின்று, அவனிடம்[a], “உசியாவே, ஆண்டவருக்குத் தூபம் காட்டுவது உனக்குரியதல்ல; தூபம் காட்டுவதற்காகப் பரிசுத்தப்படுத்தப்பட்ட ஆரோனின் மக்களான ஆசாரியர்களுக்கே அது உரியது. பரிசுத்தஸ்தலத்திலிருந்து வெளியேறு; ஏனெனில் நீ துரோகமாக நடந்துகொண்டாய்[b]. இதனால் ஆண்டவராகிய கடவுளிடமிருந்து உனக்கு மேன்மை கிடைக்காது[c]” என்றார்கள்.
