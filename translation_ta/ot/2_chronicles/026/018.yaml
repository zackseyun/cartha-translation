base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
translation:
  language: ta
  text: அவர்கள் அரசன் உசியாவை எதிர்த்து நின்று, அவனிடம்[a], “உசியாவே, ஆண்டவருக்குத் தூபம் காட்டுவது உனக்குரியதல்ல; தூபம் காட்டுவதற்காகப் பரிசுத்தப்படுத்தப்பட்ட ஆரோனின் மக்களான ஆசாரியர்களுக்கே அது உரியது. பரிசுத்தஸ்தலத்திலிருந்து வெளியேறு; ஏனெனில் நீ துரோகமாக நடந்துகொண்டாய்[b]. இதனால் ஆண்டவராகிய கடவுளிடமிருந்து உனக்கு மேன்மை கிடைக்காது[c]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனைத் தடுத்து எதிர்கொண்டு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நீ புனிதத்தை மீறினாய்” என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல், குறிப்பாகக் கடவுளுக்கும் புனித ஒழுங்குக்கும் எதிராக உண்மையற்றுத் துரோகமாகச் செயல்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “ஆண்டவராகிய கடவுளிடமிருந்து உனக்கு மேன்மைக்காக அல்ல.” இது, உசியாவின் செயல் கடவுளிடமிருந்து அவனுக்கு மேன்மையைக் கொண்டுவராது என்று பொருள்படும் சுருக்கமான எபிரேயத் தொடர்.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  choice: எதிர்த்து நின்று
  rationale: இந்த எபிரேய மரபுத்தொடர் வெறுமனே அருகில் நிற்பதை அல்ல, ஒருவரைத் தடுத்து எதிர்த்து நிற்பதைக் குறிக்கிறது.
- source_word: לֹא לְךָ ... לְהַקְטִיר
  choice: தூபம் காட்டுவது உனக்குரியதல்ல
  rationale: இச்செயலைச் செய்வதற்கான உரிமை அல்லது தகுந்த அதிகாரம் உசியாவுக்கு இல்லை என்ற கட்டமைப்பின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְהַקְטִיר
  choice: தூபம் காட்டுவது
  rationale: இச்சூழலில் קטר என்பதன் ஹிஃபில் வடிவம் தூபப் பலியை எரித்துச் செலுத்துவதைக் குறிக்கிறது; தமிழில் ‘தூபம் காட்டுதல்’ வழிபாட்டுச் சூழலுக்கு இயல்பானது.
- source_word: לַיהוָה
  choice: ஆண்டவருக்கு
  rationale: தெய்வீகப் பெயரான יהוה என்பதற்கான மரியாதைமிக்க, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் மரபுருவம்.
- source_word: כִּי לַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மக்களாகிய ஆசாரியர்களுக்கே அது உரியது
  rationale: தூபம் காட்டும் பணி ஆரோனிய ஆசாரியர்களுக்கு மட்டும் உரியது என்ற வலியுறுத்தலை ‘-க்கே’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַמְקֻדָּשִׁים
  choice: அர்ப்பணிக்கப்பட்ட
  rationale: புனிதப் பணிக்காகத் தனியே ஒதுக்கி நியமிக்கப்பட்ட நிலையைக் குறிக்கிறது; ஆசாரியப் பின்னணியில் இயல்பான தமிழாக உள்ளது.
- source_word: צֵא מִן הַמִּקְדָּשׁ
  choice: பரிசுத்த இடத்திலிருந்து வெளியேறு
  rationale: מקדש என்பதை தேவாலயத்தின் புனித வளாகம் அல்லது சரணாலயம் என்ற அளவில் வைத்திருக்கிறது; மிகக் குறுகிய உள் அறையை மட்டும் குறிப்பதாக ஆக்கவில்லை.
- source_word: מָעַלְתָּ
  choice: நம்பிக்கைத் துரோகம் செய்தாய்
  rationale: מעל என்பது குறிப்பாகக் கடவுளுக்கும் புனித ஒழுங்குக்கும் எதிரான விசுவாசமின்மை அல்லது புனித மீறலைக் குறிக்கிறது; சாதாரண நடைமுறைத் தவறாகச் சுருக்கவில்லை.
- source_word: וְלֹא לְךָ לְכָבוֹד מֵיְהוָה אֱלֹהִים
  choice: இதனால் ஆண்டவராகிய கடவுளிடமிருந்து உனக்கு மேன்மை கிடைக்காது
  rationale: எபிரேய மொழியின் சுருக்கமான, விடுபட்ட அமைப்பை வாசிக்கத்தக்க தமிழில் வெளிப்படுத்தி, அந்தச் செயல் கடவுளிடமிருந்து மேன்மையைக் கொண்டுவராது என்ற கருத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தூபம் செலுத்துவதில் ஆசாரியர்களுக்குரிய தனியுரிமை
  choice: தூபம் காட்டும் பணி அதற்காக அர்ப்பணிக்கப்பட்ட ஆரோனின் மக்களாகிய ஆசாரியர்களுக்கே உரியது.
  alternative: இதை அரசாட்சி மற்றும் ஆசாரியத்துவம் குறித்த பொதுவான கருத்தாக மட்டும் மொழிபெயர்த்தல்.
  rationale: மூலவசனம் பொதுவான வழிபாட்டுத் தலைமையைப் பற்றிப் பேசாமல், ஆலயத்தில் தூபம் செலுத்தும் குறிப்பிட்ட பணியை ஆரோனிய ஆசாரியர்களுக்கு ஒதுக்குகிறது.
- issue: מָעַלְתָּ என்பதன் இறையியல் தீவிரம்
  choice: நம்பிக்கைத் துரோகம் செய்தாய்
  alternative: விதிமீறினாய்
  rationale: இது வெறும் நடைமுறைத் தவறு அல்ல; கடவுள் ஏற்படுத்திய புனித ஒழுங்கிற்கு எதிரான தீவிரமான விசுவாச மீறல். இருப்பினும் பின்னாளைய தனிப்பிரிவு சார்ந்த கோட்பாட்டு சொற்கள் சேர்க்கப்படவில்லை.
- issue: இறுதிக் கூறின் சுருக்கமான எபிரேய அமைப்பு
  choice: இந்தச் செயலால் ஆண்டவராகிய கடவுளிடமிருந்து உசியாவுக்கு மேன்மை கிடைக்காது எனப் பொருள்பட மொழிபெயர்த்தல்.
  alternative: “உனக்கு மேன்மைக்காக அல்ல” என்று சொற்சொல்லாகவும் தெளிவின்றியும் மொழிபெயர்த்தல்.
  rationale: மூலத்தின் இலக்கணச் சுருக்கத்தை ஒப்புக்கொண்டபடியே அதன் இயல்பான பொருளைத் தமிழில் தெரிவிக்கிறது; ‘அவமானம் வரும்’ போன்ற கூடுதல் எதிர்மறை விளைவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க வேதாகம நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியர்’, ‘தூபம் காட்டுதல்’, ‘பரிசுத்த இடம்’ ஆகியவை வழிபாட்டுச் சூழலைத் தெளிவாக வைத்திருக்கின்றன. இறுதிக் கூறின் எபிரேயச் சுருக்கமும் מעל என்பதன் புனித உடன்படிக்கை சார்ந்த தீவிரமும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
