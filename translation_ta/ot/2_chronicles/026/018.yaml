  source_fidelity: மொத்தத்தில் மூலத்திற்கு உண்மையான மொழிபெயர்ப்பு. எதிர்த்து நிற்றல், தூபம் செலுத்தும் ஆரோனிய ஆசாரியரின் தனியுரிமை, ஆலயத்திலிருந்து வெளியேறுமாறு கட்டளையிடுதல், மற்றும் இறுதிக் கூறின் விளைவு ஆகியவை சரியாக உள்ளன. ஆனால் מָעַלְתָּ என்பதற்கான “நம்பிக்கைத் துரோகம் செய்தாய்” என்பது தமிழில் பொதுவாக ஒருவருடைய நம்பிக்கையைத் துரோகம் செய்தல் என்ற குறுகிய பொருளைத் தரலாம்; புனித ஒழுங்குக்கு எதிரான கடுமையான உண்மையின்மையை நேரடியாகத் தரும் சொல் தேவைப்படுகிறது.
  naturalness: நடை தெளிவாகவும் நவீன தரத் தமிழுக்கு ஏற்றதாகவும் உள்ளது. எனினும் “தூபம் காட்டுவதற்காக அர்ப்பணிக்கப்பட்ட” என்பதற்குப் பதிலாக, ஆசாரியப் புனித நியமனத்தைத் துல்லியமாகக் குறிக்கும் “தூபம் காட்டுவதற்காகப் பரிசுத்தப்படுத்தப்பட்ட” இயல்பாகவும் துல்லியமாகவும் அமையும். “பரிசுத்த இடம்” என்பதையும் வழக்கமான வேதாகமப் பயன்பாடான “பரிசுத்தஸ்தலம்” எனச் சீராக்கலாம்.
  terminology: “ஆசாரியர்கள்,” “தூபம் காட்டுதல்,” “ஆண்டவர்,” மற்றும் “ஆண்டவராகிய கடவுள்” ஆகியவை பொருத்தமானவை. הַמְקֻדָּשִׁים என்பதற்குப் “பரிசுத்தப்படுத்தப்பட்ட” என்பது ‘அர்ப்பணிக்கப்பட்ட’ என்பதைவிடச் சடங்குமுறை சார்ந்த consecration பொருளைச் சிறப்பாகக் காக்கிறது.
