    rationale: இச்சொற்றொடர் தமிழில் தனிப்பட்ட நம்பிக்கையைச் சிதைத்தல் என்ற பொருளுக்கு எளிதில் நகரக்கூடும். இங்கு எபிரேய வினைச்சொல் கடவுளின் புனித ஒழுங்கிற்கு எதிரான துரோகமான/உண்மையற்ற செயலையே குறிக்கிறது. “துரோகமாக நடந்துகொண்டாய்” என்பது அந்தத் தீவிரத்தை இயல்பாகக் காக்கிறது.
