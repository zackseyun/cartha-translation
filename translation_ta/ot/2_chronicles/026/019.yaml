  text: וַ/יִּזְעַף֙ עֻזִּיָּ֔הוּ וּ/בְ/יָד֥/וֹ מִקְטֶ֖רֶת לְ/הַקְטִ֑יר וּ/בְ/זַעְפּ֣/וֹ עִם הַ/כֹּהֲנִ֗ים וְ֠/הַ/צָּרַעַת זָרְחָ֨ה בְ/מִצְח֜/וֹ לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ בְּ/בֵ֣ית יְהוָ֔ה מֵ/עַ֖ל לְ/מִזְבַּ֥ח הַ/קְּטֹֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/019.yaml
  text: Then Uzziah became angry[a], with a censer in his hand to burn incense; and while he was angry with the priests, leprosy broke out on his forehead before the priests in the house of Yahweh, beside the altar of incense.
translation:
  language: ta
  text: அப்போது உசியா கோபமடைந்தான். தூபம் எரிக்கத் தூபக்கலசம் அவன் கையில் இருந்தது. அவன் ஆசாரியர்கள்மேல் கோபம் கொண்டிருந்தபோது, யாவேயின் ஆலயத்தில், தூபபீடத்தின் அருகே, ஆசாரியர்களின் கண்முன்னே அவன் நெற்றியில் தோல் நோய்[a] தோன்றியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் צָרַעַת பாரம்பரியமாக “தொழுநோய்” என மொழிபெயர்க்கப்படுகிறது. ஆனால் அது நவீன ஹான்சன் நோயை மட்டும் குறிக்காமல், தீட்டுண்டாக்கும் பலவகை தோல் பாதிப்புகளையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעַף
  choice: கோபமடைந்தான்
  rationale: வினைச்சொல் கோபம் அல்லது சினம்கொள்வதைக் குறிக்கிறது; நிகழ்ந்த மாற்றத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது, ஆனால் அதன் தீவிரத்தை தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: עֻזִּיָּהוּ
  choice: உசியா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: מִקְטֶרֶת
  choice: தூபக்கலசம்
  rationale: தூபம் எரித்துச் செலுத்தப் பயன்படுத்தப்பட்ட சடங்குப் பாத்திரத்தைக் குறிக்கும் தெளிவான, வழக்கிலுள்ள தமிழ்ச் சொல்.
- source_word: לְהַקְטִיר
  choice: தூபம் எரிப்பதற்கான
  rationale: நோக்கத்தைக் குறிக்கும் எபிரெய முடிவிலா வினையைப் பாதுகாத்து, சடங்குச் செயலை நேரடியாகத் தெரிவிக்கிறது.
- source_word: וּבְזַעְפּוֹ עִם הַכֹּהֲנִים
  choice: அவன் ஆசாரியர்கள்மேல் கோபங்கொண்டிருந்தபோது
  rationale: அடுத்த நிகழ்வு நடந்த காலச்சூழலையும் ஆசாரியர்களுக்கு எதிரான கோபத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַצָּרַעַת
  choice: கடுமையான தோல் நோய்[a]
  rationale: צָרַעַת என்பது நவீன ஹான்சன் நோயை மட்டும் துல்லியமாகக் குறிப்பதில்லை; தீட்டுண்டாக்கும் பலவகைக் கடுமையான தோல் பாதிப்புகளைக் குறிக்கக்கூடும். 'கடுமையான' என்பது அதன் தீவிரத்தைத் தெரிவிக்கிறது; அடிக்குறிப்பு பாரம்பரிய மாற்றுச் சொல்லைக் கொடுக்கிறது.
- source_word: זָרְחָה
  choice: திடீரெனத் தோன்றியது
  rationale: சொல்லின் அடிப்படைப் பொருள் 'ஒளிர்ந்தது/வெளிப்பட்டது'; இச்சூழலில் நெற்றியில் நோய் திடீரெனக் காணப்பட்டதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְמִצְחוֹ
  choice: அவன் நெற்றியில்
  rationale: உடலில் நோய் வெளிப்பட்ட இடத்தை நேரடியாகக் குறிக்கிறது.
- source_word: לִפְנֵי הַכֹּהֲנִים
  choice: ஆசாரியர்களின் கண்முன்னே
  rationale: அது ஆசாரியர்கள் முன்னிலையில், அவர்கள் காணும்படி நிகழ்ந்தது என்ற பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: בְּבֵית יְהוָה
  choice: யாவேயின் ஆலயத்தில்
  rationale: இச்சூழலில் בַּיִת என்பது தேவாலயத்தைக் குறிக்கிறது; நவீனத் தமிழில் 'ஆலயம்' இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதத்தில் உள்ள இறைபெயரை ஒரு பொதுப்பட்டத்தால் மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: தூபபீடத்தின் அருகே
  rationale: சுருக்கமான எபிரெய முன்னிடைச்சொல் அமைப்பு நிகழ்வைத் தூபபீடத்தோடு இடவியல் ரீதியில் தொடர்புபடுத்துகிறது; ஆதாரம் தெளிவாகக் கூறாத திசையைச் சேர்க்காமல் 'அருகே' அந்தத் தொடர்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: צָרַעַת என்பதன் மொழிபெயர்ப்பு
  choice: கடுமையான தோல் நோய்
  alternative: தொழுநோய்
  rationale: எபிரெயச் சொல் நவீன மருத்துவத்தில் ஹான்சன் நோய் எனப்படும் தொழுநோயைவிட விரிந்த பொருளைக் கொண்டிருக்கலாம். ஆகவே குறிப்பிட்ட நவீன நோயறிதலைத் திணிக்காமல், உரையின் கடுமையான தோல் பாதிப்பை முதன்மை உரையில் வெளிப்படுத்தி, பாரம்பரிய மொழிபெயர்ப்பை அடிக்குறிப்பில் தருகிறது.
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையிலுள்ள தனிப்பட்ட இறைபெயரை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலமொழிச் சான்றை வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: நோய் தோன்றியதன் காரணவியல் விளக்கம்
  choice: நிகழ்வை வரிசையாக மட்டும் கூறுதல்
  alternative: இது தேவனுடைய தண்டனை என்று மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: வசனத்தின் கதைச்சூழல் தீர்ப்பை உணர்த்தினாலும், இவ்வசனம் காரணத்தைத் தனியாக விளக்கும் சொற்றொடரை கொண்டிருக்கவில்லை. எனவே மொழிபெயர்ப்பு நிகழ்வுகளின் தொடர்பையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது; விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. சடங்கு சார்ந்த துல்லியத்திற்காக 'தூபக்கலசம்', 'தூபபீடம்', 'ஆசாரியர்கள்' ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், நிகழ்வுகளின் வரிசையும் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
