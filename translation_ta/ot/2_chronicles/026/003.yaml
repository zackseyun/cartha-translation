base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/003.yaml
  text: Uzziah was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah[b], from Jerusalem.
translation:
  language: ta
  text: உசியா அரசனானபோது[a] அவனுக்கு பதினாறு வயது. அவன் எருசலேமில் ஐம்பத்திரண்டு ஆண்டுகள் ஆட்சி செய்தான். எருசலேமைச் சேர்ந்த அவனுடைய தாயின் பெயர் எக்கொலியா[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “அவன் ஆட்சி செய்யத் தொடங்கியபோது” அல்லது “அவன் அரசனான சமயத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: இப்பெயரை “எக்கீலியா” என்றும் ஒலிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
