- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பொருளைக் குறிக்கும் முன்னொட்டை இயல்பான தமிழ் வேற்றுமை உருபால் வெளிப்படுத்துகிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: வம்சக் குறிப்புக்குரிய எபிரேய வாய்பாட்டை இயல்பான தமிழ் தொடரமைப்பில் தருகிறது.
- source_word: יכיליה
  choice: எக்கொலியா
  rationale: எபிரேயப் பெயரின் மெய்யெழுத்து அமைப்பையும் ஏற்றுக்கொள்ளப்பட்ட பெயர் வடிவத்தையும் தமிழில் ஒலிபெயர்க்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִן יְרוּשָׁלִָם
  choice: எருசலேமைச் சேர்ந்த
  rationale: מִן இங்கு தாயின் பிறப்பிடம் அல்லது சொந்த ஊரைக் குறிக்கிறது; தமிழில் ஒருவரின் ஊர்ச் சார்பைக் கூறும் இயல்பான வடிவம் இது.
