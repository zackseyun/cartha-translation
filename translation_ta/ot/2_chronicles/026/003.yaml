  register: நவீன நிலையான தமிழில், வரலாற்றுக் காலக்குறிப்புக்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிவடிவில் தரப்பட்டுள்ளன; மூலத்திலுள்ள மாற்று ஒலிபெயர்ப்பு வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
