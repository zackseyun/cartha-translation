id: 2CH.14.4
reference: 2 Chronicles 14:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֨סַר֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה אֶת הַ/בָּמ֖וֹת וְ/אֶת הַֽ/חַמָּנִ֑ים וַ/תִּשְׁקֹ֥ט הַ/מַּמְלָכָ֖ה לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
translation:
  language: ta
  text: அவர் யூதாவின் எல்லா நகரங்களிலிருந்தும் உயர்ந்த வழிபாட்டு இடங்களையும் தூபப் பீடங்களையும்[a] அகற்றினார்; அவருடைய ஆட்சிக்காலத்தில் அரசாட்சி அமைதியாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூரியத் தூண்கள்.” இதற்கான எபிரெயச் சொல் வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; சில சூழல்களில் அது சூரிய வழிபாட்டுடன் தொடர்புடையதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: அகற்றினார்
  rationale: சוּר என்பதன் ஹிஃபில் வடிவம் ஒன்றை நீக்கச் செய்வதைக் குறிக்கிறது; ‘அகற்றினார்’ என்பது செயலை மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: யூதாவின் எல்லா நகரங்களிலிருந்தும்
  rationale: מִן உடன் வரும் இந்தத் தொடர் ஆசாவின் சீர்திருத்தம் நடைபெற்ற புவியியல் பரப்பை நேரடியாகக் காட்டுகிறது.
- source_word: הַבָּמוֹת
  choice: மேடைகள்
  rationale: בָּמוֹת என்பது வழிபாட்டுக்குரிய உயர்ந்த இடங்கள் அல்லது வழிபாட்டு மேடைகளைக் குறிக்கிறது. ‘மேடைகள்’ என்பது வரலாற்று-வழிபாட்டுச் சார்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: הַחַמָּנִים
  choice: தூபபீடங்கள்
  rationale: חַמָּנִים என்பதன் துல்லியமான வடிவமும் பயன்பாடும் உறுதியற்றவை; அது தூபத்துடனோ சூரிய வழிபாட்டுடனோ தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கலாம். வாசிக்க இயல்பான ‘தூபபீடங்கள்’ முதன்மை உரையில் தரப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַתִּשְׁקֹט
  choice: அமைதி நிலவியது
  rationale: שקט என்பது தொந்தரவின்றி அமைதியாக அல்லது ஓய்வாக இருப்பதைக் குறிக்கிறது; அரசை எழுவாயாகக் கொண்ட தமிழ்ச் சொல்லாக்கத்தில் ‘அமைதி நிலவியது’ இயல்பாக உள்ளது.
- source_word: הַמַּמְלָכָה
  choice: அரசு
  rationale: מַמְלָכָה என்பது அரசையோ அரசாட்சிப் பகுதியையோ குறிக்கும்; இங்கு ‘அரசு’ தெளிவான நவீனத் தமிழாக உள்ளது.
- source_word: לְפָנָיו
  choice: அவர் ஆட்சியில்
  rationale: எழுத்துப்படி ‘அவருக்கு முன்பாக’ என்றாலும், இச்சூழலில் அது அவரது முன்னிலையில் அல்லது ஆட்சிக்காலத்தில் எனப் பொருள்படுகிறது. நவீனத் தமிழில் தவறாகப் புரிந்துகொள்ளப்படாமல் இருக்கச் சூழல்சார் பொருள் வெளிப்படுத்தப்படுகிறது.
theological_decisions:
- issue: ஆசா அகற்றிய வழிபாட்டுப் பொருட்களின் இயல்பு
  choice: בָּמוֹת மற்றும் חַמָּנִים ஆகியவற்றை ஆசா அகற்றிய உறுதியான வழிபாட்டு அமைப்புகளாகக் காட்டுதல்; חַמָּנִים என்பதை முதன்மை உரையில் ‘தூபபீடங்கள்’ என வழங்குதல்.
  alternative: חַמָּנִים என்பதை குறிப்பாக ‘சூரியத் தூண்கள்’ அல்லது சூரிய வழிபாட்டுப் பொருட்கள் எனக் கொள்ளுதல்.
  rationale: இந்த வசனம் முறையற்ற வழிபாட்டுடன் தொடர்புடைய இடங்களையும் பொருட்களையும் அகற்றிய சீர்திருத்தத்தைச் சொல்கிறது. ஆனால் חַמָּנִים என்பதன் சரியான வழிபாட்டுச் சிறப்பு விவாதத்திற்குரியது; ஆகவே குறிப்பிட்ட சூரிய வழிபாட்டு விளக்கத்தை முதன்மை உரையில் திணிக்காமல் மாற்றுப் பொருளை அடிக்குறிப்பில் தருவது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அவருக்கு முன்பாக’ என்ற எபிரெய மரபுத்தொடர் தமிழில் கால அல்லது இட அர்த்தக் குழப்பத்தை ஏற்படுத்தக்கூடும் என்பதால் ‘அவர் ஆட்சியில்’ எனச் சூழலுக்கேற்றவாறு வழங்கப்பட்டது. חַמָּנִים என்பதிலுள்ள உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
