source:
  edition: WLC
  text: וַ/יְהִ֣י לְ/אָסָ֗א חַיִל֮ נֹשֵׂ֣א צִנָּ֣ה וָ/רֹמַח֒ מִֽ/יהוּדָה֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וּ/מִ/בִּנְיָמִ֗ן נֹשְׂאֵ֤י מָגֵן֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת מָאתַ֥יִם וּ/שְׁמוֹנִ֖ים אָ֑לֶף כָּל אֵ֖לֶּה גִּבּ֥וֹרֵי חָֽיִלס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
translation:
  language: ta
  text: ஆசாவிடம், யூதாவைச் சேர்ந்த பெரிய கேடயங்களையும் ஈட்டிகளையும் ஏந்திய மூன்று இலட்சம் வீரர்களும், பென்யமீனைச் சேர்ந்த கேடயங்களை ஏந்தி வில்களை இழுத்துப் பயன்படுத்திய இரண்டு இலட்சத்து எண்பதாயிரம் வீரர்களும் இருந்தனர். இவர்கள் அனைவரும் வலிமைமிக்க போர்வீரர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வீரமிக்க ஆண்கள்” அல்லது “வல்லமைமிக்க வீரர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் גִּבּוֹרֵי חָיִל என்பது வலிமையும் வீரமும் கொண்ட போர்வீரர்களைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִל
  choice: படை / வீரர்கள்
  rationale: இராணுவக் கணக்கெடுப்புச் சூழலில் இச்சொல் ஆசாவிடம் இருந்த படைபலத்தை, அதாவது வீரர்களின் தொகுதியைக் குறிக்கிறது. தமிழில் எண்ணிக்கைகளோடு இயல்பாக அமைய ‘வீரர்கள்’ என்று வாக்கியத்தில் வெளிப்படுத்தப்பட்டது.
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  choice: பெரிய கேடயங்களையும் ஈட்டிகளையும் ஏந்திய
  rationale: נֹשֵׂא என்பது ஆயுதங்களை ஏந்திய அல்லது அவற்றால் ஆயத்தப்படுத்தப்பட்ட வீரர்களைக் குறிக்கிறது. צִנָּה என்பது உடலை அதிகமாக மறைக்கும் பெரிய கேடயம்; பின்னர் வரும் מָגֵן என்பதிலிருந்து வேறுபடுத்த ‘பெரிய கேடயம்’ என மொழிபெயர்க்கப்பட்டது. רֹמַח என்பதற்கு பொதுவாகப் புரியும் ‘ஈட்டி’ பயன்படுத்தப்பட்டது.
- source_word: מִיהוּדָה / מִבִּנְיָמִן
  choice: யூதாவைச் சேர்ந்த / பென்யமீனைச் சேர்ந்த
  rationale: מִן இங்கு வீரர்களின் கோத்திர அல்லது பிரதேசப் பிறப்பிடத்தைச் சுட்டுகிறது. ‘சேர்ந்த’ என்பது நவீனத் தமிழில் இயல்பாக அந்த உறவைத் தெரிவிக்கிறது.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: மூன்று இலட்சம்
  rationale: 300,000 என்ற எண்ணைத் தமிழின் வழக்கமான எண்ணுப்பெயர் முறையில் நேரடியாகக் கொடுக்கிறது.
- source_word: נֹשְׂאֵי מָגֵן
  choice: கேடயங்களை ஏந்தி
  rationale: מָגֵן என்பது கேடயம்; முன் வரும் பெரிய צִנָּה-விலிருந்து அதன் வேறுபாடு, இங்கு ‘பெரிய’ என்ற அடைமொழியைச் சேர்க்காமல் விடுவதால் ஓரளவு காக்கப்படுகிறது.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: வில்களை வளைத்துப் பயன்படுத்திய
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக வில்லை மிதித்து அல்லது வளைத்து ஆயத்தப்படுத்துவதைக் குறிக்கலாம்; சூழலில் வில்லாளர்களாகச் செயல்படுவதைச் சுட்டுகிறது. ‘வளைத்துப் பயன்படுத்திய’ என்பது மூலப்படிமத்தையும் நடைமுறைப் பொருளையும் காக்கிறது.
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: இரண்டு இலட்சத்து எண்பதாயிரம்
  rationale: 280,000 என்ற எண்ணின் இயல்பான தமிழாக்கம்.
- source_word: גִּבּוֹרֵי חָיִל
  choice: வலிமைமிக்க போர்வீரர்கள்
  rationale: இது வலிமையும் போர்த்திறனும் வீரமும் கொண்ட போராடும் ஆண்களைக் குறிக்கும் நிலையான இராணுவச் சொற்றொடர். ‘வலிமைமிக்க போர்வீரர்கள்’ என்பது நவீன வாசகர்களுக்குத் தெளிவாகவும் மரியாதையான நடையிலும் உள்ளது.
theological_decisions:
- issue: גִּבּוֹרֵי חָיִל என்ற பாலினம் குறிக்கப்பட்ட இராணுவச் சொற்றொடர்
  choice: வலிமைமிக்க போர்வீரர்கள்
  alternative: வீரமிக்க ஆண்கள் / வல்லமைமிக்க வீரர்கள்
  rationale: பண்டைய இராணுவக் கணக்கெடுப்பில் ஆண் வீரர்களே குறிக்கப்படுகின்றனர். தமிழில் ‘போர்வீரர்கள்’ சூழலால் இதை இயல்பாகத் தெரிவிக்கிறது; தேவையின்றி ‘ஆண்கள்’ என்பதைச் சேர்க்காமல், மூலத்தின் இராணுவப் பொருளையும் வீரத்தின் நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று-இராணுவ நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெரிய கேடயம்’ மற்றும் ‘கேடயம்’ என்ற வேறுபாடு மூலத்தில் உள்ள צִנָּה / מָגֵן வேறுபாட்டைக் காக்கிறது. எண்ணிக்கைகள் தமிழில் வழக்கமான ‘இலட்சம்’ முறையில் வழங்கப்பட்டுள்ளன.
