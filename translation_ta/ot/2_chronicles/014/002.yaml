source:
  edition: WLC
  text: וַ/יָּ֛סַר אֶת מִזְבְּח֥וֹת הַ/נֵּכָ֖ר וְ/הַ/בָּמ֑וֹת וַ/יְשַׁבֵּר֙ אֶת הַ/מַּצֵּב֔וֹת וַ/יְגַדַּ֖ע אֶת הָ/אֲשֵׁרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/002.yaml
  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
translation:
  language: ta
  text: அவர் அந்நிய வழிபாட்டுக்குரிய பலிபீடங்களையும் உயர்ந்த வழிபாட்டிடங்களையும் அகற்றி, வழிபாட்டுத் தூண்களை உடைத்து, அசேரா வழிபாட்டுச் சின்னங்களை[a] வெட்டிச் சாய்த்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசேரா கம்பங்களை.” எபிரெயச் சொல் அசேரா வழிபாட்டுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: அகற்றி
  rationale: הסיר என்பதன் காரணவினை வடிவம் இங்கு நீக்குதல் அல்லது அகற்றுதல் எனப் பொருள்படுகிறது; சீர்திருத்த நடவடிக்கையை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: מִזְבְּחוֹת הַנֵּכָר
  choice: அந்நிய வழிபாட்டுக்குரிய பலிபீடங்கள்
  rationale: נֵכָר என்பது அந்நியமான அல்லது இஸ்ரயேலரல்லாத வழிபாட்டுடன் தொடர்புடையதைச் சுட்டுகிறது. வெறும் அந்நியர்களுக்குச் சொந்தமான பலிபீடங்கள் என்ற தவறான புரிதலைத் தவிர்க்க, அதன் வழிபாட்டுச் சூழல் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הַבָּמוֹת
  choice: மேட்டிடங்கள்
  rationale: בָּמוֹת என்பது உயர்ந்த இடங்களில் அமைந்த வழிபாட்டுத் தலங்களுக்கான வழக்கமான எபிரெயச் சொல். 'மேட்டிடங்கள்' அதன் நிலவியல் உருவகத்தையும் வழிபாட்டுச் சூழலையும் சுருக்கமாகப் பேணுகிறது.
- source_word: וַיְשַׁבֵּר
  choice: உடைத்து
  rationale: שׁבר இங்கு வலுவாக உடைத்து அழித்தலைக் குறிக்கிறது; தமிழில் 'உடைத்து' இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַמַּצֵּבוֹת
  choice: வழிபாட்டுத் தூண்கள்
  rationale: מַצֵּבוֹת என்பது வழிபாட்டில் பயன்படுத்தப்பட்ட நட்ட கற்கள் அல்லது தூண்களைக் குறிக்கிறது. 'வழிபாட்டுத் தூண்கள்' அவற்றின் சமயச் செயல்பாட்டைத் தெளிவாக்குகிறது; அவை அனைத்தும் பொதுவாகப் புனிதமானவை என்று கூறுவதைத் தவிர்க்கிறது.
- source_word: וַיְגַדַּע
  choice: வெட்டிச் சாய்த்தார்
  rationale: גדע என்பது மரம் அல்லது மரத்தாலான பொருளை வெட்டி வீழ்த்துவதைச் சுட்டுகிறது. 'வெட்டிச் சாய்த்தார்' அந்தச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאֲשֵׁרִים
  choice: அசேரா வழிபாட்டுச் சின்னங்கள்
  rationale: אֲשֵׁרִים என்பது அசேரா வழிபாட்டுடன் தொடர்புடைய பொருட்களைக் குறிக்கலாம்; அவை துல்லியமாகக் கம்பங்களா, மரங்களா, வேறு சின்னங்களா என்பது உறுதியில்லை. இந்தத் தேர்வு தொடர்பைத் தெரிவிக்கிறது, ஆனால் பொருளின் வடிவத்தைத் தேவையின்றி வரையறுப்பதில்லை.
theological_decisions:
- issue: அசேரிம் (הָאֲשֵׁרִים) என்ற வழிபாட்டுச் சொல்லின் பொருள்
  choice: அசேரா வழிபாட்டுச் சின்னங்கள்
  alternative: அசேரா கம்பங்கள்
  rationale: இச்சொல் அசேராவுடன் தொடர்புடைய தடைசெய்யப்பட்ட வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; ஆனால் அவை குறிப்பாக மரக்கம்பங்களா, வடிவமைக்கப்பட்ட மரங்களா, அல்லது பரந்த வகையான வழிபாட்டுச் சின்னங்களா என்பதில் தெளிவில்லை. முதன்மை உரை அந்தத் தெளிவின்மையைப் பேணுகிறது; பொதுவான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் வழிபாட்டுச் சொற்கள் தெளிவாக்கப்பட்டுள்ளன. வாக்கியம் கண்ணியமான வேதாகம நடையைக் காக்கிறது; அசேரிம் என்பதன் சரியான பொருள் குறித்த மூலமொழியின் தெளிவின்மை அடிக்குறிப்புடன் பேணப்பட்டுள்ளது.
