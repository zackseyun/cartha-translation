  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
translation:
  language: ta
  text: கூஷியனாகிய சேரா[b] அவர்களுக்கு எதிராக, ஆயிரம் ஆயிரம்[a] படைவீரர்களைக் கொண்ட படையுடனும் முந்நூறு தேர்களுடனும் புறப்பட்டான்; அவன் மாரேஷாவரை வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆயிரம் ஆயிரம்” என்பது எபிரெய உரையின் நேரடியான சொற்றொடர்; இதை “பத்து இலட்சம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கூஷியன்” என்பது எபிரெய இன-புவியியல் சொல்; மரபாக இது “எத்தியோப்பியன்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: அவர்களுக்கு எதிராகப் புறப்பட்டு வந்து
  rationale: יצא என்பதன் அடிப்படை இயக்கப் பொருளையும், אֲלֵיהֶם என்பதன் போர்ச் சூழலிலான பகைமை நோக்கையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: זֶרַח הַכּוּשִׁי
  choice: கூஷியனான செராகு
  rationale: כּוּשִׁי என்ற எபிரெய இன-புவியியல் சொல்லை ‘எத்தியோப்பியன்’ என்று விளக்கமாக மாற்றாமல் ‘கூஷியன்’ எனப் பாதுகாக்கிறது; זֶרַח என்பதை தமிழில் ‘செராகு’ என ஒலிபெயர்க்கிறது.
- source_word: בְּחַיִל
  choice: வீரர்களைக் கொண்ட படையுடன்
  rationale: இங்கு חַיִל செல்வம் அல்லது வல்லமை அல்ல, ஒரு போர்ப்படையைக் குறிக்கிறது; தொடர்ந்து வரும் எண்ணிக்கை படையின் வீரர் எண்ணிக்கையென தமிழில் தெளிவாகிறது.
- source_word: אֶלֶף אֲלָפִים
  choice: ஆயிரம் ஆயிரம்
  rationale: மூலத்தின் சொல்லமைப்பைத் தக்கவைத்து, இதைத் துல்லியமான ‘பத்து இலட்சம்’ என மட்டும் தீர்மானிக்காமல் அதன் சாத்தியமான பெரும்-எண் மரபுத்தன்மையையும் திறந்துவைக்கிறது.
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  choice: முந்நூறு தேர்கள்
  rationale: எண்ணிக்கையையும் போர்த் தேர்களையும் இயல்பான தமிழ்ச் சொல் வரிசையில் நேரடியாக வழங்குகிறது.
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  choice: மாரேஷாவரை வந்தான்
  rationale: עַד குறிக்கும் ‘அந்த இடம்வரை’ என்ற எல்லை நுணுக்கத்தைத் தக்கவைக்கிறது.
