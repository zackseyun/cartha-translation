  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/לַ/עֲשׂ֖וֹת הַ/תּוֹרָ֥ה וְ/הַ/מִּצְוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/003.yaml
  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: ta
  text: அவன் யூதா மக்களிடம், அவர்களுடைய முன்னோர்களின் இறைவனாகிய ஆண்டவரை நாடவும், சட்டத்தையும் கட்டளையையும் கடைப்பிடிக்கவும் சொன்னான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִדְרוֹשׁ
  choice: நாடவும்
  rationale: தேடுதல், விசாரித்தல், இறைவனிடம் திரும்பி அவரை விரும்புதல் ஆகிய நுணுக்கங்களை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: எபிரெய இறைப்பெயரைக் குறிக்கும் மரியாதைமிக்க, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் வழக்கு.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: அவர்களுடைய முன்னோர்களின் இறைவன்
  rationale: אבות என்பதன் தலைமுறை சார்ந்த பொருளை உள்ளடக்கிய முறையில் தெரிவிக்கிறது; 'இறைவன்' என்பது இயல்பான நவீனத் தமிழ்.
- source_word: לַעֲשׂוֹת
  choice: கடைப்பிடிக்கவும்
  rationale: சட்டத்தையும் கட்டளையையும் நடைமுறையில் செயல்படுத்துதல் என்ற சூழல்சார் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: הַתּוֹרָה וְהַמִּצְוָה
  choice: சட்டத்தையும் கட்டளையையும்
  rationale: மூலத்தில் உள்ள ஒருமை வடிவங்களையும் இரு தனித்த சொற்களையும் ஒன்றிணைக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் இருப்பதை உணர்ந்தபோதும், பொது வாசிப்புக்கு ஏற்ற மரியாதைமிக்க வழக்கைத் தேர்ந்தெடுக்கிறது; குறிப்பிட்ட சமயப்பிரிவு சார்ந்த வடிவைத் தவிர்க்கிறது.
- issue: תורה என்பதன் வரம்பு
  choice: சட்டம்
  alternative: போதனை
  rationale: இந்தச் சூழலில் 'கட்டளை' என்பதுடன் இணைந்து கீழ்ப்படிதலைக் குறிப்பதால் 'சட்டம்' பொருத்தமானது; இருப்பினும் சொல்லை முழு வேதாகமத் தொகுப்பு அல்லது பிற்கால கருத்தாக விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளது. 'யூதா' என்பது இங்கு நிலப்பகுதியைவிட மக்களைக் குறிக்கும் என்பதால் 'யூதா மக்கள்' எனத் தெளிவாக்கப்பட்டுள்ளது. மூலத்தின் இணையான இரண்டு நோக்கங்கள்—ஆண்டவரை நாடுதல், சட்டத்தையும் கட்டளையையும் கடைப்பிடித்தல்—தக்கவைக்கப்பட்டுள்ளன.
