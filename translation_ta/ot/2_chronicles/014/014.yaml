base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/014.yaml
  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
translation:
  language: ta
  text: அவர்களும் கால்நடை முகாம்களையும்[a] தாக்கி, ஆடுமந்தைகளை ஏராளமாகவும்[b] ஒட்டகங்களையும் கைப்பற்றினார்கள்[c]. பின்னர் அவர்கள் எருசலேமுக்குத் திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “கால்நடைகளின் கூடாரங்கள்.” இது கால்நடைகளோடு தொடர்புடைய மேய்ச்சல் முகாம்களையோ, மேய்ப்போரின் முகாம்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஆடுமந்தைகள்” என்பதற்கான எபிரெயச் சொல் செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கிய சிறு கால்நடைகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இந்த எபிரெய வினை “சிறைபிடித்தார்கள்” என்றும் பொருள்படும்; இங்கு விலங்குகள் செயப்படுபொருளாக இருப்பதால், அவற்றைக் கொள்ளையாகக் கைப்பற்றினார்கள் என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: அவர்களும் / ...யும்
  rationale: முந்தைய நிகழ்வுடன் இந்தச் செயலை இணைக்கும் சேர்க்கைப் பொருளைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָהֳלֵי מִקְנֶה
  choice: கால்நடை மேய்ப்போரின் கூடாரங்கள்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘கால்நடைகளின் கூடாரங்கள்’; சூழலில் இது கால்நடைகளைப் பராமரித்த மேய்ப்போரின் முகாம்களைக் குறிப்பதாக இயல்பாகப் புரிகிறது. அடிக்குறிப்பில் நேரடி பொருள் தரப்பட்டுள்ளது.
- source_word: הִכּוּ
  choice: தாக்கி
  rationale: נכה என்ற வினையின் இராணுவச் சூழலிலான ‘தாக்குதல்’ பொருளை நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: וַיִּשְׁבּוּ
  choice: கைப்பற்றிக்கொண்டு
  rationale: שבה அடிப்படையில் ‘சிறைபிடித்தல்’ எனப் பொருள்படும்; விலங்குகள் செயப்படுபொருளாக இருப்பதால், கொள்ளைப் பொருளாகக் கைப்பற்றியதைக் காட்டும் இந்தச் சொல் தமிழில் இயல்பானது.
- source_word: צֹאן
  choice: ஆடுமந்தைகள்
  rationale: צֹאן என்பது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கக்கூடிய சிறு கால்நடைகளின் கூட்டுப்பெயர்; ‘ஆடுமந்தைகள்’ அந்தக் கூட்டுப் பொருளையும் எண்ணிக்கையின் பெருக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָרֹב
  choice: ஏராளமான
  rationale: மிகப் பெரிய எண்ணிக்கையைச் சுட்டும் எபிரெயச் சொற்றொடரின் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּגְמַלִּים
  choice: ஒட்டகங்களையும்
  rationale: நேரடியான பெயர்ச்சொல் மொழிபெயர்ப்பு; இணைப்பைத் தமிழ் வேற்றுமை உருபுடன் காட்டுகிறது.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: எருசலேமுக்குத் திரும்பினார்கள்
  rationale: தொடர்ந்து நிகழ்ந்த கதைக்களச் செயலை இயல்பான தமிழில் தருகிறது; ‘பின்பு’ என்பது அவசியமில்லாததால் சேர்க்கப்படவில்லை.
