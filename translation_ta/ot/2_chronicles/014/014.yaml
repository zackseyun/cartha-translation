  source_fidelity: ‘கால்நடை மேய்ப்போரின் கூடாரங்கள்’ என்பது எபிரெயத்தின் ‘கால்நடைகளின் கூடாரங்கள்’ என்ற திறந்த கட்டமைப்பை மேய்ப்போர் எனக் குறிப்பாக்குகிறது. மூலத்தின் தெளிவின்மையைப் பாதுகாக்க ‘கால்நடை முகாம்கள்’ எனத் திருத்துவது பாதுகாப்பானது. மேலும், கொள்ளையைக் கைப்பற்றிய செயலும் எருசலேமுக்குத் திரும்பிய செயலும் மூலத்தில் தொடர்ச்சியான தனித்த வினைகளாக உள்ளன; அவை தனித்த வாக்கியங்களாகத் தரப்படுகின்றன.
  naturalness: திருத்தப்பட்ட உரை நவீன நிலையான தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது. ‘ஆடுமந்தைகளை ஏராளமாகவும், ஒட்டகங்களையும்’ என்பது மிகுதியைக் குறிப்பாக ஆடுமந்தைகளோடு இணைக்கிறது; அதேவேளை ஒட்டகங்களும் கைப்பற்றப்பட்டன என்பதைத் தெளிவாக்குகிறது.
  terminology: ‘கால்நடை முகாம்கள்’ என்பது மேய்ப்போர், விலங்குகள், அல்லது அவற்றுடன் தொடர்புடைய மேய்ச்சல் முகாம்கள் என்ற எந்த ஒரு விளக்கத்தையும் கட்டாயப்படுத்தாமல் אָהֳלֵי מִקְנֶה என்பதற்குப் பொருத்தமாக உள்ளது. ‘ஆடுமந்தைகள்’ மற்றும் ‘ஒட்டகங்கள்’ பொருத்தமானவை; צֹאן-இன் விரிவான பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
