source:
  edition: WLC
  text: וַ/יִּגֹּ֤ף יְהוָה֙ אֶת הַ/כּוּשִׁ֔ים לִ/פְנֵ֥י אָסָ֖א וְ/לִ/פְנֵ֣י יְהוּדָ֑ה וַ/יָּנֻ֖סוּ הַ/כּוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/011.yaml
  text: And Yahweh struck down the Cushites before Asa and before Judah[a], and the Cushites fled.
translation:
  language: ta
  text: யாவே கூஷியரை[a] ஆசாவுக்கும் யூதாவுக்கும் முன்பாக முறியடித்தார்; கூஷியர் தப்பியோடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எத்தியோப்பியரை.’ எபிரெய மொழியில் உள்ள இனப்பெயர் ‘கூஷியர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: முறியடித்தார்
  rationale: போர்ச் சூழலில் נָגַף என்பது தாக்கித் தோற்கடிப்பதைக் குறிக்கிறது. ‘முறியடித்தார்’ தெய்வீகச் செயலின் வலிமையையும் இராணுவ வெற்றியையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַכּוּשִׁים
  choice: கூஷியர்
  rationale: எபிரெய இனப்பெயரான כּוּשִׁים-ஐ நேரடியாகப் பாதுகாக்கிறது; பிற்கால புவியியல் அடையாளமான ‘எத்தியோப்பியர்’ என்பதை உடனடியாகத் திணிப்பதைத் தவிர்க்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இப்போர்ச் செய்தியில் ஆசாவும் யூதாவும் முன்னேறியபோது அல்லது அவர்கள் முன்னிலையில் எதிரிகள் தோற்கடிக்கப்பட்டார்கள் என்ற எபிரெயச் சொல்லமைப்பைப் பாதுகாக்கிறது.
- source_word: אָסָא
  choice: ஆசா
  rationale: தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: இங்கு யூதா அரசையோ மக்களையோ கூட்டாகக் குறிக்கும் பெயரைச் சூழல் தீர்மானிக்கும்படி அப்படியே வைத்திருக்கிறது.
- source_word: וַיָּנֻסוּ
  choice: தப்பியோடினார்கள்
  rationale: נוּס என்பதன் ‘பயந்து அல்லது தோல்வியுற்று ஓடுதல்’ என்ற பொருளை இயல்பான தமிழில் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, நான்கெழுத்துத் தெய்வீகப் பெயரே உள்ளது. ஆகவே அதை ‘கர்த்தர்’ என மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தெய்வீகச் செயல், ஆசா–யூதா முன்னிலை, பின்னர் கூஷியர் தப்பியோடுதல் ஆகிய தொடர் பாதுகாக்கப்பட்டுள்ளது.
