translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயச் சொற்றொடரின் இராணுவப் பொருள் இயல்பான தமிழில் தரப்பட்டு, לְפָנָיו என்பதிலுள்ள நேரடிப் பொருளும் சூழற்பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
