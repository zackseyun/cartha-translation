base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/009.yaml
  text: And Asa went out before him[b][a], and they drew up for battle in the Valley of Zephathah at Mareshah.
translation:
  language: ta
  text: ஆசா அவனை எதிர்கொள்ளப் புறப்பட்டான்[a]. அவர்கள் மாரேஷாவுக்கு அருகிலுள்ள செபாத்தா பள்ளத்தாக்கில் போருக்கு அணிவகுத்து நின்றார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘அவனுக்கு முன்பாக’; சூழலுக்கு ஏற்ப, ‘அவனைச் சந்திக்க’ அல்லது ‘அவனுக்கு எதிராக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்கள் போருக்காகப் படைகளை அணிவகுத்தார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: புறப்பட்டுச் சென்றான்
  rationale: יצא என்பதன் அடிப்படைப் பொருளான ‘வெளியே செல்/புறப்படு’ என்பதை இயல்பான தமிழில் தருகிறது; இராணுவச் சூழலையும் அளவுக்கு மீறி விளக்காமல் உணர்த்துகிறது.
- source_word: לְפָנָיו
  choice: அவனுக்கு எதிராக
  rationale: சொல்லுக்கு சொல் ‘அவனுக்கு முன்பாக’ என்றாலும், இச்சூழலில் எதிரிப்படையைச் சந்திக்க ஆசா புறப்பட்டதைக் குறிக்கிறது. ‘எதிராக’ என்பது அந்தச் சூழற்பொருளை இயல்பாகத் தருகிறது; நேரடியான மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: போருக்கு அணிவகுத்து நின்றார்கள்
  rationale: ערך + מלחמה என்பது போரிடுவதற்காகப் படைகளை ஒழுங்குபடுத்தி நிறுத்துவதைக் குறிக்கும் இராணுவ மரபுத்தொடர். இந்தத் தமிழ் வடிவம் அணிவகுப்பையும் போருக்கான ஆயத்த நிலையையும் தெளிவாகக் காட்டுகிறது.
- source_word: בְּגֵיא
  choice: பள்ளத்தாக்கில்
  rationale: גיא என்பது பள்ளத்தாக்கு அல்லது மலை இடுக்கு; இடப்பெயர்ச் சூழலில் ‘பள்ளத்தாக்கு’ பொதுவாகவும் எளிதாகவும் புரிகிறது.
- source_word: צְפַתָה
  choice: செபத்தா
  rationale: எபிரேய இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְמָרֵשָׁה
  choice: மாரேஷாவிலுள்ள
  rationale: இங்குள்ள לְ முன்னிடைச்சொல் செபத்தா பள்ளத்தாக்குக்கும் மாரேஷாவுக்கும் உள்ள இடத் தொடர்பைக் குறிக்கிறது. ‘மாரேஷாவிலுள்ள’ என்பது அந்தத் தொடர்பை இயல்பான தமிழில் தருகிறது; ‘அருகிலுள்ள’ என்பதும் சாத்தியம்.
