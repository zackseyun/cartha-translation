  to: ஆசா அவனை எதிர்கொள்ளப் புறப்பட்டான்[a]. அவர்கள் மாரேஷாவுக்கு அருகிலுள்ள செபாத்தா பள்ளத்தாக்கில் போருக்கு அணிவகுத்து நின்றார்கள்[b].
