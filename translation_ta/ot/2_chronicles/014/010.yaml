base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
translation:
  language: ta
  text: ஆசா தன் கடவுளாகிய யாவேயை நோக்கிக் கூப்பிட்டு[a], “யாவே, வலிமைமிக்கவருக்கும் வலிமையற்றவருக்கும் உதவ உம்மைத் தவிர வேறு யாரும் இல்லை. எங்கள் கடவுளாகிய யாவே, எங்களுக்கு உதவுவீராக; ஏனெனில் நாங்கள் உம்மையே சார்ந்திருக்கிறோம்; உமது பெயரில் இந்தப் பெருந்திரளுக்கு எதிராக வந்திருக்கிறோம். எங்கள் கடவுளாகிய யாவே, நீரே எங்கள் கடவுள்; சாகும் மனிதன் உமக்கு எதிராக மேலோங்காதிருக்கட்டும்[b],” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே, பலரைக் கொண்டோ வலிமையற்றோரைக் கொண்டோ உதவுவது உமக்கு வேறுபாடல்ல.” இந்த எபிரெயச் சொற்றொடர் சுருக்கமானதும் பொருள் தெளிவற்றதுமாக உள்ளது; அது எண்ணிக்கையையோ வலிமையையோ வலியுறுத்தலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “சாகும் மனிதன் உம்மை எதிர்த்து நிற்காதபடி செய்யும்”; அல்லது, “சாகும் மனிதன் உமக்கு எதிராக வலிமையைத் தக்கவைக்க விடாதேயும்.” இங்குள்ள எபிரெய வினையின் பொருள் உறுதியானதல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: கூப்பிட்டு
  rationale: இறைவனை நோக்கிய அவசரமான மன்றாட்டைக் குறிக்கும் קרא אל என்பதன் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெய வேதமூலத்திலுள்ள இறைப்பெயரை ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהָיו / אֱלֹהֵינוּ
  choice: தன் கடவுள் / எங்கள் கடவுள்
  rationale: உடைமைத் தொடர்பையும் உடன்படிக்கை சார்ந்த மன்றாட்டு மொழியையும் நேராகப் பாதுகாக்கிறது.
- source_word: אֵין עִמְּךָ לַעְזוֹר
  choice: உம்மைத் தவிர வேறு யாரும் இல்லை
  rationale: கடினமான எபிரெயச் சொற்றொடரைத் தெய்வ உதவியின் தனித்தன்மையை வெளிப்படுத்தும் இயல்பான தமிழில் தருகிறது; வேறு இலக்கணப் புரிதல் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: בֵּין רַב לְאֵין כֹּחַ
  choice: வலிமைமிக்கவனுக்கும் வலிமையற்றவனுக்கும் இடையில்
  rationale: רב என்பது எண்ணிக்கையையோ வலிமையையோ குறிக்கக்கூடியதால், முதன்மை உரையில் வலிமை சார்ந்த எதிர்மறை இணையைப் பாதுகாத்து, எண்ணிக்கை சார்ந்த மாற்றைப் அடிக்குறிப்பில் தருகிறது.
- source_word: עָזְרֵנוּ
  choice: எங்களுக்கு உதவும்
  rationale: முதலாம் நபர் பன்மை பின்னொட்டுள்ள நேரடி கட்டளையை மரியாதைமிக்க மன்றாட்டு நடையில் தருகிறது.
- source_word: כִּי עָלֶיךָ נִשְׁעַנּוּ
  choice: ஏனெனில் நாங்கள் உம்மையே சார்ந்திருக்கிறோம்
  rationale: ‘சாய்ந்திருக்கிறோம்’ என்ற உருவகத்தின் நம்பிக்கைப் பொருளை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וּבְשִׁמְךָ בָאנוּ
  choice: உமது பெயரில் ... வந்திருக்கிறோம்
  rationale: இறைவனுடைய அதிகாரத்தையும் அவர்மீதான சார்பையும் குறிக்கும் வேதாகம வழக்கைத் தக்கவைக்கிறது.
- source_word: הֶהָמוֹן הַזֶּה
  choice: இந்தத் திரளான படை
  rationale: הָמוֹן என்பதன் பெருந்திரள் பொருளை போர்ச் சூழலுக்கு ஏற்ப தெளிவுபடுத்துகிறது; வெறும் ‘திரள்’ என்பதைவிட தமிழில் இயல்பாக உள்ளது.
- source_word: אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: சாகும் மனிதன் உமக்கு எதிராக வெற்றிபெற விட்டுவிடாதேயும்
  rationale: אֱנוֹשׁ என்பதிலுள்ள மனித மரணத்தன்மையையும், கடினமான עצר வினையின் சூழல்சார் ‘எதிர்த்து நிற்றல்/மேற்கொள்ளுதல்’ பொருளையும் வெளிப்படுத்துகிறது; மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து பாதுகாக்கிறது.
- issue: אֵין עִמְּךָ לַעְזוֹר என்ற கடினமான சொற்றொடர்
  choice: உம்மைத் தவிர வேறு யாரும் இல்லை
  alternative: பலரைக் கொண்டோ வலிமையற்றோரைக் கொண்டோ உதவுவது உமக்கு வேறுபாடல்ல
  rationale: முதன்மை வாசிப்பு தெய்வ உதவியின் ஒப்பற்ற தன்மையை எடுத்துரைக்கிறது; ஆனால் எபிரெய இலக்கணம் வேறு புரிதலுக்கும் இடமளிப்பதால் அதை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: אֱנוֹשׁ என்ற ஒருமை மனிதக் குறிப்பு
  choice: சாகும் மனிதன்
  alternative: மனிதர் / எவரும்
  rationale: மூலத்தின் ஒருமையையும் மனிதனின் பலவீனமான, மரணத்துக்குட்பட்ட நிலையையும் காக்கிறது; குறிப்பிட்ட பாலினக் கொள்கையைத் திணிக்காமல் இங்கு மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்தும் சொல்லாகப் பயன்படுத்துகிறது.
- issue: עצר עם என்ற இறுதிக் கூறின் பொருள்
  choice: உமக்கு எதிராக வெற்றிபெற
  alternative: உம்மை எதிர்த்து நிற்க / உமக்கு எதிராக வலிமையைத் தக்கவைக்க
  rationale: போர்ச் சூழலில் வேண்டுதலின் நோக்கத்தைத் தெளிவாகத் தருகிறது; வினையின் உண்மையான சொற்பொருள் நிச்சயமின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க, செறிவான ஜெபநடை. இறைவனை நோக்கும் இடங்களில் ‘உம்/நீர்’ மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் கடினமான இரு கூறுகளும் முதன்மை உரையில் மிகையாகத் தீர்மானிக்கப்படாமல், மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
