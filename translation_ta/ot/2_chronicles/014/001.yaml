  source_fidelity: 'மூல எபிரெய வாக்கியத்தின் கூறுகள் அனைத்தும் மொழிபெயர்ப்பில் உள்ளன: ஆசா, அவன் செய்த செயல், ‘நல்லது’ மற்றும் ‘நேரானது/சரியானது’ என்ற இணை ஒழுக்க மதிப்பீடு, யாவே, மற்றும் ‘அவனுடைய கடவுள்’ என்ற தொடர்பு. இருப்பினும் יָשָׁר என்பதற்கான ‘நேர்மையானது’ தமிழில் பெரும்பாலும் தனிப்பட்ட நேர்மை அல்லது சத்தியத்தன்மையைச் சுட்டலாம்; இச்சூழலில் ‘சரியானது’ என்பது மூலத்தின் பரந்த ஒழுக்க மதிப்பீட்டைத் தெளிவாகக் காக்கிறது.'
  naturalness: ‘நன்மையானதையும் நேர்மையானதையும்’ புரியத்தக்கதாக இருந்தாலும் ஓரளவு கனமாகவும் குறுகிய பொருளுடையதாகவும் உள்ளது. ‘நல்லதையும் சரியானதையும்’ நவீன நிலையான தமிழில் இயல்பாகவும் மூலத்தின் இணைச்சொல் அமைப்பிற்கு நெருக்கமாகவும் உள்ளது. ‘தன் கடவுளாகிய யாவேவின் பார்வையில்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
  terminology: ‘யாவே’ என்பது யְהוָה என்ற தனிப்பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது. ‘கடவுளாகிய’ என்பது אֱלֹהָיו-வின் ஒருமைச் சுட்டுதலையும் ஆசாவுடனான தொடர்பையும் சரியாகத் தருகிறது. அடிக்குறிப்பில் உள்ள ‘கண்களில்’ என்ற நேரடி உருவகமும் ‘பார்வையில் அல்லது மதிப்பீட்டின்படி’ என்ற பொருளுரையும் பொருத்தமானவை.
