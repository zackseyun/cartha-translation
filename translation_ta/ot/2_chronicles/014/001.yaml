  text: וַ/יַּ֤עַשׂ אָסָא֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/001.yaml
  text: Asa did what was good and right in the eyes of Yahweh his God[a].
translation:
  language: ta
  text: ஆசா தன் கடவுளாகிய யாவேவின் பார்வையில் நல்லதையும் சரியானதையும் செய்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “யாவேவின் கண்களில்”; அதாவது, யாவேவின் பார்வையில் அல்லது மதிப்பீட்டின்படி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்ற வினை இங்குள்ள ஒழுக்க மதிப்பீட்டுச் சூழலில் ஒருவரின் நடத்தையைக் குறிக்கிறது; தமிழில் ‘செய்தான்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: אָסָא
  choice: ஆசா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: הַטּוֹב
  choice: நன்மையானதை
  rationale: குறிப்பிட்ட பெயரடையாகவும் עשה என்பதன் செயப்படுபொருளாகவும் வரும் இச்சொல், ஒழுக்க ரீதியில் நல்லதைச் செய்தல் என்ற பொருளைத் தருகிறது.
- source_word: וְהַיָּשָׁר
  choice: நேர்மையானதையும்
  rationale: יָשָׁר இங்கு நேரானது என்ற உருவகத்திலிருந்து ஒழுக்க ரீதியில் சரியான அல்லது நேர்மையான நடத்தையைக் குறிக்கிறது; ‘நேர்மையானது’ அந்த நெறிசார் மதிப்பை இயல்பான தமிழில் தருகிறது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: சொல்லுக்கு நேர் உருவகம் ‘கண்களில்’ என்றாலும், இச்சொற்றொடர் ஒருவரின் மதிப்பீட்டின்படி அல்லது கண்ணோட்டத்தில் என்பதைக் குறிக்கிறது; ‘பார்வையில்’ உருவகத்தையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துத் திருப்பெயர்; தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֱלֹהָיו
  choice: தன் கடவுளாகிய
  rationale: வடிவத்தில் பன்மைத் தோற்றம் இருந்தாலும் இங்கு ஒருமையான இஸ்ரவேலின் கடவுளையே குறிக்கிறது. மூன்றாம் நபர் எழுவாயைத் திரும்பச் சுட்டுவதால் தமிழ் இயல்புக்கேற்ப ‘தன்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, கடவுளின் தனிப்பெயரே நேரடியாக உள்ளது. ஆகவே பட்டத்தால் மாற்றாமல் தனிப்பெயரை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை. ‘நன்மையானதையும் நேர்மையானதையும்’ என்ற இணைப்பு மூலத்தின் இரட்டை ஒழுக்க மதிப்பீட்டைப் பாதுகாக்கிறது; ‘பார்வையில்’ என்பது எபிரெய உருவகத்தை அதிகச் சொற்சார்பின்றி இயல்பாக வெளிப்படுத்துகிறது.
