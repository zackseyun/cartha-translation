id: 2CH.14.13
reference: 2 Chronicles 14:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּכּ֗וּ אֵ֤ת כָּל הֶֽ/עָרִים֙ סְבִיב֣וֹת גְּרָ֔ר כִּי הָיָ֥ה פַֽחַד יְהוָ֖ה עֲלֵי/הֶ֑ם וַ/יָּבֹ֨זּוּ֙ אֶת כָּל הֶ֣/עָרִ֔ים כִּֽי בִזָּ֥ה רַבָּ֖ה הָיְתָ֥ה בָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/013.yaml
  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: ta
  text: அவர்கள் கேராரைச் சுற்றியிருந்த எல்லாப் பட்டணங்களையும் தாக்கினார்கள்; ஏனெனில் யாவேயின் திகில் அவர்கள்மேல் இருந்தது. அவர்கள் அந்தப் பட்டணங்கள் அனைத்தையும் கொள்ளையிட்டார்கள்; ஏனெனில் அவற்றில் ஏராளமான கொள்ளைப்பொருள் இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: தாக்கி வீழ்த்தினார்கள்
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் போர்ச் சூழலில் வெறும் தாக்குதலை அல்ல, வலுவாகத் தாக்கித் தோற்கடிப்பதைக் குறிக்கிறது. நகரங்களே கொல்லப்பட்டன என்று தவறாகப் புரியாமல், தீர்க்கமான இராணுவத் தோல்வியையும் இந்தத் தொடர் தெரிவிக்கிறது.
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  choice: கேராரைச் சுற்றியிருந்த எல்லாப் பட்டணங்களையும்
  rationale: עָרִים என்பதற்கு இச்சூழலில் இயல்பான தமிழ்ச் சொல் ‘பட்டணங்கள்’; סְבִיבוֹת என்பதன் இடவியல் பொருளை ‘சுற்றியிருந்த’ தெளிவாக வழங்குகிறது.
- source_word: פַּחַד יְהוָה
  choice: யெகோவாவிடமிருந்து வந்த திகில்
  rationale: இது யெகோவாவிடம் கொண்ட பக்தியுடனான பயத்தை அல்ல, அவரால் உண்டான அல்லது அவரோடு தொடர்புடைய பீதியைச் சுட்டுகிறது. எபிரெயக் கட்டமைப்பு அதன் மூலத்தைத் துல்லியமாக வரையறுக்காமல் விடுவதால் ‘இடமிருந்து வந்த’ என்பது இயல்பான காரணமூலப் பொருளை வழங்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெயத் திருப்பெயரின் தமிழில் நிலைபெற்ற நேரடி பெயர்வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: עֲלֵיהֶם
  choice: அவற்றின்மேல் படிந்திருந்தது
  rationale: היה ... על என்ற அமைப்பு அவர்களை ஆட்கொண்டிருந்த நிலையை உணர்த்துகிறது. அருகிலுள்ள பன்மைச் சொல் பட்டணங்கள் என்பதால், தமிழில் அவற்றைக் குறிக்கும் அஃறிணைப் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: וַיָּבֹזּוּ
  choice: கொள்ளையிட்டார்கள்
  rationale: בזז என்பது போரில் பொருட்களைக் கொள்ளையாக எடுத்தலைக் குறிக்கிறது; ‘கொள்ளையிட்டார்கள்’ தற்போதைய தமிழில் நேரடியும் இயல்புமான வினைச்சொல்.
- source_word: בִּזָּה רַבָּה
  choice: ஏராளமான கொள்ளைப்பொருள்
  rationale: בִּזָּה என்பது போரில் கைப்பற்றப்படும் பொருட்களைக் குறிக்கிறது. ‘கொள்ளைப்பொருள்’ வினைச்சொல்லிலிருந்து பெயர்ச்சொல் பொருளைத் தெளிவாக வேறுபடுத்துகிறது; רַבָּה அளவின் மிகுதியைச் சுட்டுவதால் ‘ஏராளமான’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בָהֶם
  choice: அவற்றில்
  rationale: பின்னொட்டு முன் குறிப்பிடப்பட்ட பட்டணங்களைக் குறிக்கிறது; தமிழில் ‘அவற்றில்’ அந்தத் தொடர்பைத் தெளிவாக வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற பெயர்வடிவமாக வழங்குவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: פַּחַד יְהוָה என்பதில் உள்ள உறவின் பொருள்
  choice: யெகோவாவிடமிருந்து வந்த திகில்
  alternative: யெகோவாவைப் பற்றிய திகில்
  rationale: சூழல் நகரவாசிகளை ஆட்கொண்ட தெய்வீகமாக உண்டாக்கப்பட்ட பீதியை ஆதரிக்கிறது. எனினும் எபிரெயச் சார்பு அமைப்பு மூலத்தையோ தொடர்பையோ மட்டும் குறிக்கலாம்; ஆகவே விளக்கத்தை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் காரணமூலப் பொருள் இயல்பாகத் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; போர்வரலாற்றின் தீவிரத்தைக் காக்கும் கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் நடை. எபிரெய வசனத்தின் இரண்டு காரணவாக்கியங்களும் இணையான அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
