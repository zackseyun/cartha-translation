source:
  edition: WLC
  text: וַ/יִּ֛בֶן עָרֵ֥י מְצוּרָ֖ה בִּ/יהוּדָ֑ה כִּֽי שָׁקְטָ֣ה הָ/אָ֗רֶץ וְ/אֵין עִמּ֤/וֹ מִלְחָמָה֙ בַּ/שָּׁנִ֣ים הָ/אֵ֔לֶּה כִּֽי הֵנִ֥יחַ יְהוָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
translation:
  language: ta
  text: அவன் யூதாவில் அரணமைக்கப்பட்ட நகரங்களைக் கட்டினான். ஏனெனில் அந்த ஆண்டுகளில் நாடு அமைதியாக இருந்தது; அவனோடு போர் எதுவும் இல்லை[a]. ஏனெனில் யாவே அவனுக்கு ஓய்வளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுக்கு எதிராகப் போர் எதுவும் இல்லை.” இங்குள்ள எபிரேய மரபுத்தொடர், ஆசாவைச் சார்ந்த போர் எதுவும் இல்லாத நிலையை இன்னும் பொதுவாகவும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: அவன் கட்டினான்
  rationale: בנה என்பதன் தொடர்கதை வடிவம் ஆசாவின் செயலைக் கடந்தகாலத்தில் விவரிக்கிறது; தமிழ் வரலாற்று நடையில் தொடக்க இணைப்புச்சொல் இல்லாமலேயே இயல்பாக உள்ளது.
- source_word: עָרֵי מְצוּרָה
  choice: அரண்சூழ்ந்த நகரங்கள்
  rationale: பாதுகாப்பு அரண்களால் வலுப்படுத்தப்பட்ட நகரங்களைக் குறிக்கும் இணைப்புத்தொடர்; நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בִּיהוּדָה
  choice: யூதாவில்
  rationale: இடத்தைக் குறிக்கும் בְּ முன்னொட்டையும் யூதா என்ற இடப்பெயரையும் நேரடியாகக் காட்டுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: கட்டுமானப் பணிக்கும் பின்னர் கிடைத்த அமைதிக்கும் காரணத்தை அறிமுகப்படுத்தும் இரு பயன்பாடுகளையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: שָׁקְטָה הָאָרֶץ
  choice: நாடு அமைதியாக இருந்தது
  rationale: שׁקט குறிக்கும் தொந்தரவின்மை மற்றும் அமைதியான நிலையை இயல்பான தமிழில் தருகிறது; பின்னர் வரும் ‘ஓய்வு’ என்ற கருத்தோடும் தொடர்பைத் தக்கவைக்கிறது.
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  choice: அவனை எதிர்த்துப் போர் எதுவும் நடக்கவில்லை
  rationale: ஆசாவை எதிர்கொண்ட அல்லது அவரைச் சார்ந்த போர் இல்லாத நிலையைச் சூழலுக்கேற்ற தமிழில் தருகிறது; עִם என்பதிலுள்ள பரந்த இடைச்சொல் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּשָּׁנִים הָאֵלֶּה
  choice: அந்த ஆண்டுகளில்
  rationale: விவரிக்கப்படும் காலப்பகுதியைக் குறிக்கும் இயல்பான தமிழ் வரலாற்று நடை.
- source_word: הֵנִיחַ
  choice: ஓய்வளித்தார்
  rationale: נוּחַ என்பதன் causative வடிவம் மோதலிலிருந்து ஓய்வையும் நிம்மதியையும் ஒருவருக்குக் கொடுப்பதைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப்பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: הֵנִיחַ என்ற வினையின் மறைமுகச் செயப்படுபொருளைத் தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, கடவுளின் தனிப்பெயரான நான்கெழுத்துப் பெயரே உள்ளது; ஆகவே பெயரை ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: הֵנִיחַ என்பதில் கடவுள் அளிக்கும் அமைதி
  choice: யாவே அவனுக்கு ஓய்வளித்தார்
  alternative: யாவே அவனுக்கு நிம்மதி கொடுத்தார்
  rationale: ‘ஓய்வு’ என்பது போர் இல்லாத நிலையை மட்டுமல்லாமல் தெய்வத்தால் அருளப்பட்ட விடுதலை/அமைதி என்ற வேதாகமக் கருத்தையும் பாதுகாக்கிறது; அதைக் குறிப்பிட்ட சமயக் கோட்பாடாக விரிவுபடுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரு כִּי காரணத் தொடர்களும் ‘ஏனெனில்’ எனத் தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் போர் தொடர்பான சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
