base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
translation:
  language: ta
  text: ஆசாவும் அவனோடு இருந்த மக்களும் கேரார் வரையிலும் அவர்களைத் துரத்திச் சென்றார்கள். உயிரோடு எவரும் எஞ்சாதபடி கூஷியர்கள்[a] வீழ்ந்தார்கள்; ஏனெனில் அவர்கள் யாவேயின் முன்னிலையிலும் அவருடைய படைக்கு முன்பாகவும்[b] முறியடிக்கப்பட்டார்கள். பின்பு அவர்கள் மிகுந்த கொள்ளைப்பொருளை எடுத்துச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எத்தியோப்பியர்கள்.” எபிரெய மொழியில் “கூஷியர்கள்,” அதாவது கூஷ் நாட்டைச் சேர்ந்த மக்கள் என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய பாளயத்திற்கு முன்பாக.” எபிரெயச் சொல் “பாளயம்” அல்லது “படை” என்று பொருள்படலாம். “அவருடைய” என்பது ஆசாவையோ யாவேயையோ குறிப்பதாகப் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  choice: அவர்களைத் துரத்திச் சென்றார்கள்
  rationale: רדף என்பது போர்ச் சூழலில் பின்தொடர்ந்து துரத்துவதைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் செயற்பாட்டின் தொடர்ச்சியையும் இது வெளிப்படுத்துகிறது.
- source_word: עַד לִגְרָר
  choice: கேரார் வரைக்கும்
  rationale: עַד இடப்பெயருடன் வரும்போது துரத்திச் சென்ற எல்லையைச் சுட்டுகிறது.
- source_word: מִכּוּשִׁים
  choice: கூஷியர்கள்
  rationale: כּוּשִׁים என்பதைப் பிற்கால எத்தியோப்பியாவுடன் நேரடியாக ஒப்பிடாமல், கூஷ் மக்களைக் குறிக்கும் மூல இன-புவியியல் பெயராகப் பாதுகாக்கிறது.
- source_word: לְאֵין לָהֶם מִחְיָה
  choice: உயிரோடு எவரும் எஞ்சாதபடி
  rationale: அவர்களிடையே உயிர்பிழைத்தவர் இல்லாத முழுமையான தோல்வியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נִשְׁבְּרוּ
  choice: முறியடிக்கப்பட்டார்கள்
  rationale: שבר என்பதன் ‘உடைக்கப்படுதல்’ என்ற உருவகத்தை, இப்போர்ச் சூழலில் தீர்மானமான தோல்வி எனத் தெளிவாகக் கொடுக்கிறது.
- source_word: לִפְנֵי יְהוָה
  choice: யாவேயின் முன்னிலையில்
  rationale: לִפְנֵי என்பதன் ‘முன்பாக/முன்னிலையில்’ என்ற இட-இறையியல் மொழிநடையைப் பாதுகாத்து, יהוה என்ற திருப்பெயரை யாவே என ஒலிபெயர்க்கிறது.
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  choice: ஆசாவின் படைக்கு முன்பாக
  rationale: מַחֲנֶה என்பதற்கு ‘பாளயம்’ அல்லது ‘படை’ எனப் பொருள் உண்டு; நடைபெறும் போரிலும் துரத்தலிலும் செயலில் உள்ள படை என்பது இயல்பான முதன்மை வாசிப்பு. பின்னொட்டு ஆசாவைக் குறிக்கிறது என்ற வாசிப்பு முதன்மை உரையில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד
  choice: மிக ஏராளமான கொள்ளைப்பொருளை எடுத்துச் சென்றார்கள்
  rationale: נשא + שׁלל என்பது கைப்பற்றிய கொள்ளையை எடுத்துச் செல்வதைக் குறிக்கிறது; הַרְבֵּה מְאֹד தரும் மிகுதியும் முழுமையாகத் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத்திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் திருப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல், வழக்கமான தமிழ்ச் சொலிப்புக்கு ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: מַחֲנֵהוּ என்பதிலுள்ள பின்னொட்டின் குறிப்பு
  choice: ஆசாவின் படை
  alternative: யாவேயின் படை; அவரது பாளயம்
  rationale: கதைநடையில் ஆசாவும் அவனோடு இருந்த மனிதப் படையும் துரத்திச் செல்வதால் ஆசாவின் படை என்பது இயல்பான வாசிப்பு. எனினும் எபிரெயப் பின்னொட்டு தனியாக அதன் குறிப்பைத் தீர்மானிக்காததால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் மரியாதையான வரலாற்று-கதைநடை பயன்படுத்தப்பட்டுள்ளது. போரின் தீவிரத்தையும் மூலத்தின் ‘முன்னிலையில்’ என்ற மொழிநடையையும் காத்து, தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
