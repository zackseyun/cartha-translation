base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
translation:
  language: ta
  text: அவன் யூதா மக்களிடம், “இந்த நகரங்களைக் கட்டி, அவற்றைச் சுற்றிலும் மதில்களையும் கோபுரங்களையும், வாசல்களையும் தாழ்ப்பாள்களையும் அமைப்போம். நாடு இன்னும் நம் முன்னே இருக்கிறது[a]; ஏனெனில் நம் கடவுளாகிய யாவேவைத் தேடினோம். அவரைத் தேடினோம்; அவர் நமக்கு எல்லாப் பக்கங்களிலும் இளைப்பாறுதலை அளித்தார்” என்றான். ஆகவே அவர்கள் கட்டினார்கள்; செழித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில் நாடு இன்னும் நம் முன்னே இருக்கிறது.” இந்தச் சொற்றொடர் வாய்ப்பு இன்னும் திறந்திருக்கிறது அல்லது நாடு தடையின்றி அவர்கள் வசம் இருக்கிறது என்பதைக் குறிக்கலாம்.
    reason: இணைப்புச் சொல்லின் காரண/கால நுட்பமும் ‘நம் முன்னே’ என்ற எபிரெய மரபுத்தொடரின் பொருளும் ஒன்றுக்கு மேற்பட்ட இயல்பான விளக்கங்களுக்கு இடமளிக்கின்றன.
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: அவன் யூதா மக்களிடம் … என்றான்
  rationale: ‘யூதா’ என்பது இங்கு நாட்டின் மக்களைக் குறிக்கும் ஆகுபெயராக இருப்பதால், நவீனத் தமிழில் பொருள் தெளிவாக இருக்க ‘யூதா மக்களிடம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נִבְנֶה
  choice: கட்டுவோம் / அமைப்போம்
  rationale: முதல் நபர் பன்மை cohortative வடிவத்தின் ஊக்குவிப்பு அல்லது கூட்டு உறுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மறுபடியும் கட்டுதல் என்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: இந்த நகரங்கள்
  rationale: கோட்டை அமைப்புகளின் சூழலில் עָרִים என்பதற்கு ‘நகரங்கள்’ இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: וְנָסֵב חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  choice: அவற்றைச் சுற்றிலும் மதில்களையும் கோபுரங்களையும், வாசல்களையும் தாழ்ப்பாள்களையும் அமைப்போம்
  rationale: סבב என்பதன் சுற்றி அமைத்தல் என்ற பொருளையும், நகரப் பாதுகாப்புக்குரிய மதில், கோபுரம், வாசல், அவற்றைப் பூட்டும் தாழ்ப்பாள் ஆகிய கூறுகளையும் இயல்பான தமிழில் தருகிறது.
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  choice: நாடு இன்னும் நம் முன்னே இருக்கிறது
  rationale: வாய்ப்பு இன்னும் திறந்திருக்கிறது அல்லது நாடு தடையின்றி அவர்கள் வசம் இருக்கிறது என்ற சாத்தியமான நுட்பங்களைத் தீர்மானித்துவிடாமல் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: כִּי דָרַשְׁנוּ אֶת יְהוָה אֱלֹהֵינוּ דָּרַשְׁנוּ
  choice: ஏனெனில் நம் கடவுளாகிய யெகோவாவைத் தேடினோம். அவரைத் தேடினோம்
  rationale: דרשׁ என்பதன் இறைவனை நாடுதல், அவரைச் சார்ந்திருத்தல் என்ற விரிந்த பொருளை ‘தேடினோம்’ காக்கிறது; மூலத்திலுள்ள வலியுறுத்தும் மறுபடியுரைத்தலும் தக்கவைக்கப்படுகிறது.
- source_word: וַיָּנַח לָנוּ מִסָּבִיב
  choice: அவர் நமக்கு எல்லாப் பக்கங்களிலும் அமைதியைக் கொடுத்திருக்கிறார்
  rationale: ‘சுற்றிலும் ஓய்வு அளித்தார்’ என்ற சொற்றொடரை தமிழில் இயல்பாக ‘எல்லாப் பக்கங்களிலும் அமைதி’ என வழங்குகிறது; மூலத்தில் வெளிப்படையாக இல்லாத எதிரிகளைச் சேர்ப்பதில்லை.
- source_word: וַיִּבְנוּ וַיַּצְלִיחוּ
  choice: ஆகவே அவர்கள் கட்டினார்கள்; வெற்றியும் பெற்றார்கள்
  rationale: இறுதி வினைச்சொற்களின் விளைவுத் தொடர்பையும், צלח என்பதன் வெற்றிகரமாகச் செயல்பட்டார்கள் என்ற பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் தெய்வீகப் பெயர் வடிவத்தைப் பயன்படுத்தி, பட்டப்பெயரால் மாற்றாமல் தனிப்பெயரைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் நான்கு எழுத்துத் தெய்வீகப் பெயரை ‘கர்த்தர்’ போன்ற பட்டப்பெயராக மாற்றாமல் தனிப்பெயராக வைத்துள்ளது. ‘யாவே’ என்பது மறுகட்டமைக்கப்பட்ட உச்சரிப்புக்கு நெருக்கமான மாற்று; ‘யெகோவா’ தமிழில் நீண்டகாலமாக அறியப்பட்ட பெயர் வடிவம்.
- issue: וַיָּנַח என்பதில் உள்ள ‘ஓய்வு’ கருத்து
  choice: அமைதியைக் கொடுத்திருக்கிறார்
  alternative: இளைப்பாறுதலைக் கொடுத்திருக்கிறார்
  rationale: சுற்றியுள்ள போர் அல்லது தொந்தரவிலிருந்து கிடைத்த நிம்மதியை இச்சூழலில் ‘அமைதி’ இயல்பாகத் தெரிவிக்கிறது; இருப்பினும் இறையியல் சார்ந்த ‘ஓய்வு’ என்ற விரிந்த கருத்தைத் தேவையின்றி எதிரிகளுடன் மட்டும் கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நேரடி உரையின் மறுபடியுரைத்தலும் மூலத்தின் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன; கோட்டை அமைப்புக்குரிய சொற்கள் தற்போதைய இயல்பான தமிழில் வழங்கப்பட்டுள்ளன.
