  to: அவன் யூதா மக்களிடம், “இந்த நகரங்களைக் கட்டி, அவற்றைச் சுற்றிலும் மதில்களையும் கோபுரங்களையும், வாசல்களையும் தாழ்ப்பாள்களையும் அமைப்போம். நாடு இன்னும் நம் முன்னே இருக்கிறது[a]; ஏனெனில் நம் கடவுளாகிய யாவேவைத் தேடினோம். அவரைத் தேடினோம்; அவர் நமக்கு எல்லாப் பக்கங்களிலும் இளைப்பாறுதலை அளித்தார்” என்றான். ஆகவே அவர்கள் கட்டினார்கள்; செழித்தார்கள்.
  rationale: The revision aligns the divine name with the POB Yahweh policy and restores the explicit ‘rest’ sense of וַיָּנַח. The Hebrew’s exhortation, fortification terminology, repeated seeking of God, and ambiguity in the ‘land before us’ clause are retained. ‘செழித்தார்கள்’ idiomatically renders the successful/prosperous outcome of וַיַּצְלִיחוּ.
