source:
  edition: WLC
  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣יד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/007.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[b][a], the God of Israel.
translation:
  language: ta
  text: இஸ்ரவேலின் கடவுளாகிய யாவேவின் பெயருக்காக ஓர் இல்லத்தைக் கட்ட வேண்டும் என்பது என் தந்தை தாவீதின் உள்ளத்தில் இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவேவின் பெயருக்காக ஓர் இல்லம்” என்பது, கடவுளுடைய பெயருடன் தொடர்புடைய இடமாகிய ஆலயத்தைக் குறிக்கும் வழக்கமான எபிரேய சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: இருந்தது
  rationale: இறந்தகால நிலையைத் தெரிவிக்கும் எளிய, இயல்பான தமிழ் வடிவம்; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற காலக் குறிப்பைச் சேர்க்கவில்லை.
- source_word: עִם לְבַב
  choice: உள்ளத்தில் இருந்தது
  rationale: ஒருவருக்குள் இருந்த நோக்கம் அல்லது விருப்பம் என்ற எபிரேய மொழிவழக்கைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; ‘மனம்’ என்று மட்டும் மாற்றாமல் ‘உள்ளம்’ என்ற உருவகத்தைப் பேணுகிறது.
- source_word: דָּוִיד אָבִי
  choice: என் தந்தை தாவீது
  rationale: உறவையும் பெயரையும் தெளிவாகவும் இயல்பான தமிழ்ச் சொல் வரிசையிலும் தருகிறது.
- source_word: לִבְנוֹת
  choice: கட்ட வேண்டும் என்பது
  rationale: கட்டும் நோக்கம் உள்ளத்தில் இருந்தது என்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּיִת
  choice: ஓர் இல்லம்
  rationale: இங்கு குறிக்கப்படுவது ஆலயம் என்றாலும், மூலத்தின் ‘வீடு/இல்லம்’ என்ற சொல்லையும் ஆலயத்தைச் சார்ந்த வேதாகம மொழிவழக்கையும் பேணுகிறது.
- source_word: לְשֵׁם
  choice: பெயருக்காக
  rationale: இறைவனுடைய பெயருடன் ஆலயம் கொண்டுள்ள தொடர்பைச் சுட்டும் முக்கியமான எபிரேய சொற்றொடரை விளக்கவுரையாக மாற்றாமல் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துத் தருகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரேய இணைப்புத் தொடரைத் தெளிவான, வழக்கமான தமிழில் தருகிறது.
theological_decisions:
- issue: בַּיִת לְשֵׁם יְהוָה என்ற ஆலயச் சொற்றொடரின் மொழிபெயர்ப்பு
  choice: யாவேவின் பெயருக்காக ஓர் இல்லம்
  alternative: யாவேவுக்காக ஓர் ஆலயம்
  rationale: ‘இல்லம்’ மற்றும் ‘பெயர்’ ஆகிய மூலச் சொற்களைப் பேணுவதால், இறைவனுடைய பெயருக்கும் ஆலயத்துக்கும் உள்ள தொடர்பை உரையே கூறும் விதத்தில் வைத்திருக்கிறது; அதை வெறுமனே ‘ஆலயம்’ என்று சுருக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. ‘உள்ளத்தில் இருந்தது’ என்ற எபிரேய உருவகமும் ‘பெயருக்காக ஓர் இல்லம்’ என்ற ஆலயச் சொற்றொடரும் இயன்றவரை பேணப்பட்டுள்ளன.
