  yaml_path: translation/ot/2_chronicles/006/003.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: ta
  text: பின்பு அரசன் திரும்பி, இஸ்ரயேலின் முழுச் சபையையும் ஆசீர்வதித்தான்[a]; இஸ்ரயேலின் முழுச் சபையும் நின்றுகொண்டிருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொல்லுக்கு சொல், “தன் முகத்தைத் திருப்பி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב ... אֶת־פָּנָיו
  choice: தன் முகத்தைத் திருப்பி
  rationale: எபிரேய மொழியின் நேரடியான, உருவகத் தெளிவுள்ள சொல்லாட்சியை இயல்பான தமிழில் தக்கவைக்கிறது; சூழலில் அரசன் மக்களை நோக்கித் திரும்பியதைக் குறிக்கிறது.
- source_word: וַיְבָרֶךְ
  choice: ஆசீர்வதித்தான்
  rationale: ברך என்பதன் வழக்கமான பொருளைச் சுருக்கமாகவும் மரியாதையான நடையிலும் தருகிறது.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: இஸ்ரயேலின் சபையார் அனைவரும்
  rationale: קהל என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபையார்’ என்பது இங்கு கூடியிருந்த மக்களை இயல்பான தமிழில் குறிக்கிறது; ‘அனைவரும்’ כָּל என்பதையும் வெளிப்படுத்துகிறது.
- source_word: עוֹמֵד
  choice: நின்றுகொண்டிருந்தார்கள்
  rationale: எபிரேய வினையெச்சம் அச்சமயத்தில் தொடர்ந்திருந்த உடல் நிலையைக் காட்டுவதால், தமிழின் தொடர்நிலை வடிவம் பொருத்தமானது.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עוֹמֵד
  choice: அப்போது இஸ்ரயேலின் சபையார் அனைவரும் நின்றுகொண்டிருந்தார்கள்
  rationale: וְ இணைக்கும் சூழ்நிலைக் கிளவியை தமிழில் இயல்பாகத் தெரிவிக்க ‘அப்போது’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் உள்ள திரும்பக்கூறுதலும் காக்கப்பட்டுள்ளது.
