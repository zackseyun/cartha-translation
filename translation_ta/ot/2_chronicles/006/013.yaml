base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
translation:
  language: ta
  text: சாலொமோன் ஒரு வெண்கல மேடையை[a] செய்து, அதை ஆலய முற்றத்தின் நடுவில் வைத்திருந்தான். அது ஐந்து முழம் நீளமும், ஐந்து முழம் அகலமும், மூன்று முழம் உயரமும் கொண்டது. அவன் அதன்மேல் நின்று, இஸ்ரவேலின் முழுச் சபைக்கும் முன்பாக முழங்காலிட்டு, வானத்தை நோக்கித் தன் கைகளை விரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயச் சொல் பொதுவாக ‘தொட்டி’ அல்லது ‘கழுவும் கலம்’ என்று பொருள்படும். ஆனால் இங்கு சாலொமோன் அதன்மேல் நின்றதும் அதன் அளவுகளும், உயர்த்தப்பட்ட ஒரு மேடையைக் குறிப்பதாகக் காட்டுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: சாலொமோன் ... வைத்திருந்தான்
  rationale: இந்த இணைப்புச்சொல் முந்தைய வசனத்தில் கூறப்பட்ட சாலொமோனின் நிலையை விளக்கும் பின்னணியை அறிமுகப்படுத்துகிறது. தமிழில் தனியே ‘ஏனெனில்’ என்று தொடங்குவதைவிட, இறந்தகால நிறைவு வடிவம் அதன் விளக்கத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּיּוֹר נְחֹשֶׁת
  choice: ஒரு வெண்கல மேடை
  rationale: כִּיּוֹר பொதுவாகத் தொட்டி அல்லது கழுவும் கலம் எனப் பொருள்படும். ஆனால் இதன் அளவுகளும், சாலொமோன் அதன்மேல் நின்றதும், இங்கு உயர்த்தப்பட்ட மேடையைக் குறிப்பதாகக் காட்டுகின்றன; சொற்பொருள் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּתוֹךְ הָעֲזָרָה
  choice: ஆலய முற்றத்தின் நடுவில்
  rationale: עֲזָרָה இங்கு ஆலய முற்றத்தைக் குறிக்கிறது; בְּתוֹךְ என்பதன் இடம்சார்ந்த பொருளை ‘நடுவில்’ தெளிவாகத் தருகிறது.
- source_word: חָמֵשׁ אַמּוֹת ... וְאַמּוֹת שָׁלֹשׁ
  choice: ஐந்து முழம் நீளமும், ஐந்து முழம் அகலமும், மூன்று முழம் உயரமும்
  rationale: பண்டைய அளவான ‘முழம்’ என்பதைக் காத்து, பரிமாணங்களை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיַּעֲמֹד עָלָיו
  choice: அவன் அதன்மேல் நின்று
  rationale: எளிய கதைத் தொடரை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  choice: முழங்கால்படியிட்டு
  rationale: இந்தச் சூழலில் ברך என்பது ‘ஆசீர்வதித்தல்’ அல்ல, ‘முழங்காலிடுதல்’ என்று பொருள்படும். தமிழ் வழக்கில் உடல் நிலையைத் தெளிவாகச் சொல்கிறது.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் சபையார் அனைவருக்கும் முன்பாக
  rationale: קָהָל என்பதன் பொதுக் கூடுகை சார்ந்த பொருளையும் נֶגֶד என்பதன் ‘முன்பாக’ என்ற இடப்பொருளையும் காக்கிறது.
- source_word: וַיִּפְרֹשׂ כַּפָּיו הַשָּׁמָיְמָה
  choice: வானத்தை நோக்கித் தன் கைகளை விரித்தான்
  rationale: ஜெபத்திற்குரிய கை விரிக்கும் செய்கையையும், திசையைக் குறிக்கும் எபிரெய இறுதியின் ‘வானத்தை நோக்கி’ என்ற நுணுக்கத்தையும் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: כִּיּוֹר என்பதன் சூழல்சார்ந்த பொருள்
  choice: மேடை
  alternative: வெண்கலத் தொட்டி / வெண்கலக் கழுவும் கலம் / தாங்கி
  rationale: சாலொமோன் அதன்மேல் நின்றதாகக் கூறப்படுவதும் கொடுக்கப்பட்ட அளவுகளும், இது ஒரு பாத்திரத்தைவிட மேடையைப் போன்ற அமைப்பு என்பதைச் சுட்டுகின்றன. எனினும் வழக்கமான சொற்பொருள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ஆலயச் சூழலைத் தெளிவாக்க ‘ஆலய முற்றம்’ பயன்படுத்தப்பட்டுள்ளது. பண்டைய அளவான ‘முழம்’ மாற்றமின்றி வைக்கப்பட்டுள்ளது.
