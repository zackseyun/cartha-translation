  register: நவீனத் தரமான, கண்ணியமான தமிழ். தேவனை நோக்கி ஒருமை மரியாதை வடிவங்களான ‘உமது/உமக்கு’ பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் இரண்டாம் நபர் ஒருமைத் தன்மையைத் தெளிவாக்க வினைச்சொல்லில் ‘நீ’ வைக்கப்பட்டுள்ளது. ‘தேசம்’ உடன்படிக்கை நிலச் சூழலைத் தெளிவாகக் காட்டுகிறது.
