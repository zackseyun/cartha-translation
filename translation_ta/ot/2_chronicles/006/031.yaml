  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
translation:
  language: ta
  text: அவர்கள் நீ எங்கள் முன்னோர்களுக்குக் கொடுத்த தேசத்தில் உயிரோடிருக்கும் நாட்களெல்லாம் உமக்குப் பயந்து[a], உமது வழிகளில் நடக்கும்படி[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பயந்து” என்பது இங்கு வெறும் அச்சத்தை மட்டுமல்ல; பயபக்தியையும் கீழ்ப்படிதலையும் உள்ளடக்குகிறது. “உம்மைப் பயபக்தியுடன் மதித்து” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவர்கள் உமக்குப் பயந்து, உமது வழிகளில் நடப்பதன் மூலம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: grammatical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: அவர்கள் … நடப்பதற்காக
  rationale: நோக்கம் அல்லது விளைவை அறிமுகப்படுத்தும் சொல்லின் வலிமையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: יִירָאוּךָ
  choice: அவர்கள் உமக்குப் பயந்து
  rationale: יִרא என்பதன் தேவனை நோக்கிய பயபக்தி, அச்சம், கீழ்ப்படிதல் ஆகிய பரப்பைச் சுருக்காமல் காக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָלֶכֶת בִּדְרָכֶיךָ
  choice: உமது வழிகளில் நடப்பதற்காக
  rationale: ‘வழிகளில் நட’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, வாழ்க்கை நடத்தையைக் குறிக்கும் அதன் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: அவர்கள் உயிரோடிருக்கும் நாட்களெல்லாம்
  rationale: கால அளவைக் குறிக்கும் முழுச் சொற்றொடரைச் சுருக்காமல், தெளிவான நவீன தமிழில் அளிக்கிறது.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: தேசத்தில்
  rationale: சொல்லுக்கு சொல் ‘தேசத்தின் மேற்பரப்பில்’ என்பது தமிழில் செயற்கையாக அமையும்; அடுத்த உறவுச்சொற்றொடர் வாக்குத்தத்த தேசத்தைக் குறிப்பதால் ‘தேசத்தில்’ என்பது சூழலுக்குத் துல்லியமானது.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: நீ எங்கள் முன்னோர்களுக்குக் கொடுத்த
  rationale: முடிந்த இறைச் செயலைவும் உடன்படிக்கை முன்னோர்களைச் சுட்டுவதையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: தேவனை ‘பயப்படுதல்’ மற்றும் கீழ்ப்படிதலின் உறவு
  choice: ‘உமக்குப் பயந்து’ என்பதை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘உம்மை மதித்து’ அல்லது ‘உம்மிடம் பயபக்தியுடன் இருந்து’
  rationale: எபிரெயச் சொல் வெறும் திகிலை மட்டும் அல்லாமல் பயபக்தியையும் உள்ளடக்குகிறது. ‘உமது வழிகளில் நடப்பது’ என்ற தொடர்ச்சி அதன் கீழ்ப்படிதல் சார்ந்த பொருளைத் தெளிவாக்குகிறது; ஒரே விளக்கப் பொருளுக்குள் அதைச் சுருக்கவில்லை.
- issue: הָאֲדָמָה என்பதன் பரப்பு
  choice: ‘தேசம்’
  alternative: ‘பூமி’ அல்லது ‘நிலம்’
  rationale: அது ‘எங்கள் முன்னோர்களுக்குக் கொடுத்த’ இடம் என்று வரையறுக்கப்படுவதால், இங்கு பொதுவான முழுப் பூமியைவிட இஸ்ரவேலருக்குக் கொடுக்கப்பட்ட தேசமே குறிக்கப்படுகிறது.
- issue: לָלֶכֶת என்பதன் இலக்கண உறவு
  choice: ‘நடப்பதற்காக’ என்று நோக்கத்தோடு இணைத்தல்
  alternative: ‘நடந்து’ அல்லது ‘நடப்பதன் மூலம்’
  rationale: எபிரெய இறந்தொழிற்பெயர் பயப்படுதலோடு தொடர்புடைய நோக்கம்/விளைவைக் குறிக்கலாம். உரையின் தெளிவுக்காக நோக்கத் தொடர்பு முதன்மை உரையில் கொள்ளப்பட்டாலும், முறை/வெளிப்பாடு என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
