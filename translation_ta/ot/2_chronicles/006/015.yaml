source:
  edition: WLC
  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣יד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: ta
  text: உமது அடியவனாகிய என் தந்தை தாவீதுக்கு, நீர் அவனுக்கு உரைத்ததை காத்து நிறைவேற்றினீர்; உமது வாயால் உரைத்தீர், உமது கையால் அதை இந்நாளில் காணப்படுகிறபடி நிறைவேற்றினீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: காத்து நிறைவேற்றினீர்
  rationale: வாக்குறுதி சார்ந்த இச்சூழலில் שׁמר என்பது வெறுமனே பாதுகாப்பதை அல்ல, சொன்னதை உண்மையுடன் காத்து நிறைவேற்றுவதைக் குறிக்கிறது. நவீன தமிழில் பொருளைத் தெளிவாகத் தர இவ்விணைச்சொல் பயன்படுத்தப்பட்டது.
- source_word: לְעַבְדְּךָ
  choice: உமது அடியவனும் ... அவனுக்காக
  rationale: עבד என்பதற்கு அரச ஜெப மொழிநடையில் மரியாதையும் கீழ்ப்படிதலும் காட்டும் ‘அடியவன்’ இயல்பானது; ל என்பதன் பயனாளிப் பொருள் ‘அவனுக்காக’ எனத் தனியே வெளிப்படுத்தப்பட்டது.
- source_word: דָּוִיד אָבִי
  choice: என் தந்தையுமான தாவீது
  rationale: தமிழில் இயல்பான சொல்வரிசையைப் பின்பற்றுவதோடு, தாவீது சாலொமோனின் தந்தை என்ற உறவையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: தாவீதுக்கு உரைத்ததை
  rationale: எபிரெய உரை நேரடியாக ‘உரைத்தது’ என்கிறது. பின்வரும் நிறைவேற்றல் சூழல் அதற்கு வாக்குறுதியின் பொருளை அளிக்கிறது; அந்தப் பொருள் முதன்மை உரையில் கட்டாயமாக்கப்படவில்லை.
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: உமது வாயால் உரைத்தீர்
  rationale: இறைவனின் சொல் மற்றும் செயலை இணைக்கும் மூலமொழியின் உருவக இணைநிலையைப் பாதுகாக்கிறது.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: உமது கையால் அதை நிறைவேற்றினீர்
  rationale: מלא இச்சொற்றொடரில் நிறைவேற்றுதல் அல்லது முழுமைப்படுத்துதல் என்று பொருள்படும். ‘கையால்’ என்பது பயனுள்ள செயலைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: כַּיּוֹם הַזֶּה
  choice: இன்று அது நிறைவேறியிருப்பது இதற்குச் சாட்சி
  rationale: இந்த எபிரெய மரபுத்தொடர் அந்நாளில் காணப்பட்ட நிறைவேற்றத்தைச் சுட்டுகிறது. சொற்சொல்லான, தமிழில் செயற்கையாக ஒலிக்கும் வடிவுக்கு மாற்றாக அதன் நிகழ்காலச் சான்றுப் பொருள் இயல்பாக வழங்கப்பட்டது.
theological_decisions:
- issue: கடவுளைக் குறித்து வரும் மனித உறுப்புருவ மொழி (‘வாய்’, ‘கை’)
  choice: ‘உமது வாயால்’, ‘உமது கையால்’ என்ற உருவகங்களை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘நீர் சொன்னீர்; அதைச் செய்து முடித்தீர்’ என்று இயக்கநிகராக்கம் செய்தல்
  rationale: இவ்வசனம் கடவுளின் உரைத்த சொல்லையும் செயலாற்றும் வல்லமையையும் நோக்கமுடன் இணைக்கிறது. மூலவுரையின் உருவகங்களைப் பாதுகாப்பது அதன் சொல்லாட்சியையும் இறையியல் அழுத்தத்தையும் காக்கிறது; இதனால் கடவுளுக்கு உடல் உண்டு என்ற கருத்து கட்டாயப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்குரிய கண்ணியமான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘வாய்/கை’ இணைநிலை பாதுகாக்கப்பட்டது; கடைசி மரபுத்தொடர் சாதாரண வாசகருக்குத் தெளிவாக இருக்க இயல்பான தமிழில் பொருள்நிகராக வழங்கப்பட்டது.
