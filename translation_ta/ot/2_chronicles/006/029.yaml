  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר יִהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם וּ/לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ אִ֤ישׁ נִגְע/וֹ֙ וּ/מַכְאֹב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
translation:
  language: ta
  text: எந்த மனிதனாலோ உமது மக்களாகிய இஸ்ரவேலர் அனைவராலோ ஏறெடுக்கப்படும் எந்த மன்றாட்டாயினும், எந்த வேண்டுதலாயினும், அவர்கள் ஒவ்வொருவரும் தம் தம் வாதையையும் வேதனையையும் அறிந்து, இந்த ஆலயத்தை நோக்கிக் கைகளை விரிக்கும்போது—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל תְּפִלָּה
  choice: எந்த மன்றாட்டோ
  rationale: כָּל இங்கு வரையறையற்ற முழுமையைச் சுட்டுகிறது. ‘எந்த ... ஓ’ என்ற அமைப்பு தமிழில் ‘whatever’ என்ற விரிவான பொருளை இயல்பாகத் தருகிறது; תְּפִלָּה என்பதற்கு ‘மன்றாட்டு’ வழிபாட்டுச் சூழலுக்கு ஏற்ற dignified modern Tamil.
- source_word: כָל תְּחִנָּה
  choice: எந்த வேண்டுதலோ
  rationale: תְּחִנָּה அருள் அல்லது இரக்கம் நாடும் உருக்கமான விண்ணப்பத்தைக் குறிக்கிறது. ‘வேண்டுதல்’ தெளிவான நவீனத் தமிழ்; முதல் כָּל உடன் உள்ள எபிரெய மறுபதிப்பையும் இணையான அமைப்பால் காக்கிறது.
- source_word: אֲשֶׁר יִהְיֶה
  choice: ஏறெடுக்கப்படும்போது
  rationale: היה என்பதன் நேரடி ‘இருத்தல்’ இங்கு மன்றாட்டு நிகழ்வதை அல்லது செலுத்தப்படுவதைச் சுட்டுகிறது. தமிழில் ‘ஏறெடுக்கப்படும்போது’ என்பது ஜெபம் செய்யப்படுவதை இயல்பாக வெளிப்படுத்தி, அடுத்த வசனத்தில் தொடரும் நிபந்தனைச் சார்பையும் காக்கிறது.
- source_word: לְכָל הָאָדָם
  choice: தனி மனிதன் ஒருவனாலோ
  rationale: אָדָם இங்கு பொதுப்பொருளுடைய ஒருமை; தனிநபரிலிருந்து மக்கள் முழுமைக்கு விரியும் எதிரிணையைத் தெளிவாக்க ‘தனி மனிதன் ஒருவன்’ பயன்படுத்தப்பட்டது. לְ மன்றாட்டைச் செய்பவரைக் குறிக்கும் வகையில் ‘ஆலோ’ என வழங்கப்பட்டது.
- source_word: וּלְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேலர் அனைவராலோ
  rationale: தனிநபர் அல்லது உடன்படிக்கை மக்களின் மொத்தம் என்ற பகிர்வுப் பொருளை ‘ஆலோ ... அனைவராலோ’ இயல்பாகக் காட்டுகிறது. ‘உமது மக்களாகிய இஸ்ரவேலர்’ என்பதில் இரண்டாம் நபர் உறவும் அடையாளமும் காக்கப்படுகின்றன.
- source_word: אֲשֶׁר יֵדְעוּ אִישׁ
  choice: அவரவர் ... அறிந்து
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் ‘ஒவ்வொருவரும்’ என உள்ளது. ‘அவரவர்’ அதனைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: נִגְעוֹ
  choice: தமது வாதையை
  rationale: נֶגַע அடி, பீடை, தொற்று அல்லது பொதுவான துன்பம் எனப் பலவகை அர்த்தமுடையது. ‘வாதை’ அதன் தீவிரத்தையும் பரந்த பொருளையும் காத்து, அதை ஒரு குறிப்பிட்ட நோயாக மட்டும் சுருக்காது.
- source_word: וּמַכְאֹבוֹ
  choice: தமது வேதனையையும்
  rationale: מַכְאוֹב உடல் அல்லது உள்ளார்ந்த வலி, துன்பம் ஆகியவற்றைக் குறிக்கலாம். ‘வேதனை’ வாதையிலிருந்து வேறுபட்ட அனுபவ வலியை வெளிப்படுத்துகிறது.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: தம் கைகளை விரித்தால்
  rationale: כפים சொற்பட ‘உள்ளங்கைகள்’ என்றாலும், தமிழில் ஜெபச் செய்கைக்கு ‘கைகளை விரித்தல்’ இயல்பானது. வினைத் தொடரை அடுத்த வசனத்தின் பதிலுடன் இணைக்கும் நிபந்தனை வடிவில் வழங்கியது.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: இந்த ஆலயத்தை நோக்கி
  rationale: אֶל இங்கு திசைநோக்கைச் சுட்டுகிறது. הַבַּיִת சூழலில் ஆலயத்தைக் குறிப்பதால் ‘இந்த ஆலயம்’ தெளிவும் இயல்பும் தருகிறது.
theological_decisions:
- issue: הָאָדָם என்ற பொதுப்பொருள் ஒருமையின் பாலினமும் பரப்பும்
  choice: தனி மனிதன் ஒருவன்
  alternative: எந்த மனிதரும் / எந்த நபரும்
  rationale: இங்கு ஆண் ஒருவரை மட்டும் வரையறுப்பது நோக்கம் அல்ல; ஆண்பால் இலக்கண வடிவிலுள்ள אָדָם மனித தனிநபரைப் பொதுவாகக் குறிக்கிறது. ‘மனிதன்’ மூலச்சொல்லின் வடிவத்தையும் பிரதிநிதித்துவப் பொருளையும் காக்கிறது; ‘தனி’ என்பது அடுத்து வரும் மக்கள் அனைவருடனான எதிரிணையை வெளிப்படுத்துகிறது.
- issue: נֶגַע என்பதன் குறிப்பான அல்லது பொதுவான பொருள்
  choice: வாதை
  alternative: பீடை / நோய் / அடி
  rationale: சொல் நோய் அல்லது தெய்வீக அடி என்ற குறிப்பான பொருளையும் கொள்ளக்கூடும்; ஆனால் இச்சூழல் ஒவ்வொருவரும் அறியும் தனிப்பட்ட துன்பத்தை விரிவாகக் கூறுகிறது. ஆகவே குறிப்பிட்ட காரணத்தைத் தீர்மானிக்காமல் ‘வாதை’ என வைத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் சாதாரண வாசகருக்கும் புரியும் நடை பயன்படுத்தப்பட்டது. வசனம் அடுத்த வசனத்தில் நிறைவடைவதால் இறுதியில் நீண்ட கோடு வைக்கப்பட்டது. ‘மன்றாட்டு/வேண்டுதல்’ மற்றும் ‘வாதை/வேதனை’ என்ற இணைச்சொற்கள் எபிரெயச் சொல் வேறுபாடுகளை ஒன்றாக்காமல் காக்கின்றன.
