revisions:
- from: எந்த மன்றாட்டோ, எந்த வேண்டுதலோ, தனி மனிதன் ஒருவனாலோ உமது மக்களாகிய இஸ்ரவேலர் அனைவராலோ ஏறெடுக்கப்படும்போது, அவரவர் தமது வாதையையும் தமது வேதனையையும் அறிந்து, இந்த ஆலயத்தை நோக்கித் தம் கைகளை விரித்தால்—
  to: எந்த மனிதனாலோ உமது மக்களாகிய இஸ்ரவேலர் அனைவராலோ ஏறெடுக்கப்படும் எந்த மன்றாட்டாயினும், எந்த வேண்டுதலாயினும், அவர்கள் ஒவ்வொருவரும் தம் தம் வாதையையும் வேதனையையும் அறிந்து, இந்த ஆலயத்தை நோக்கிக் கைகளை விரிக்கும்போது—
  rationale: The revision resolves the conditional mismatch, retains the Hebrew’s comprehensive paired expression for prayer and plea, preserves the individual-to-corporate scope, and expresses the distributive knowledge and prayer gesture in idiomatic modern Tamil. The em dash is retained because the sentence continues into verse 30.
