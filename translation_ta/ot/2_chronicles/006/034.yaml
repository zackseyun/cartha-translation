  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּֽי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל א֣וֹיְבָ֔י/ו בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֣רֶךְ הָ/עִ֤יר הַ/זֹּאת֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
translation:
  language: ta
  text: உமது மக்கள், நீர் அவர்களை அனுப்பும் வழியில் தங்கள் பகைவர்களுக்கு எதிராகப் போருக்குப் புறப்பட்டுச் சென்று, நீர் தேர்ந்தெடுத்த இந்த நகரத்தையும் உமது பெயருக்காக நான் கட்டிய ஆலயத்தையும் நோக்கி உம்மிடம் மன்றாடினால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: '-ஆல் (நிபந்தனை: “மன்றாடினால்”)'
  rationale: சாலொமோனின் விண்ணப்பத்தில் ஒரு சாத்தியமான சூழ்நிலையை அறிமுகப்படுத்துவதால், தமிழில் இயல்பான நிபந்தனை வாக்கிய முடிவாக மொழிபெயர்க்கப்பட்டது.
- source_word: יֵצֵא ... לַמִּלְחָמָה
  choice: போருக்குப் புறப்பட்டுச் சென்று
  rationale: இராணுவச் சூழலில் ‘போருக்குப் புறப்படுதல்’ என்ற எபிரெய மரபுத்தொடரின் பொருளையும் இயக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: עַמְּךָ ... עַל אֹיְבָיו
  choice: உமது மக்கள் ... தங்கள் பகைவர்களுக்கு எதிராக
  rationale: עַם என்பது இலக்கணப்படி ஒருமைத் தொகுப்புப்பெயர்; அதன் ஒருமை பின்னொட்டைத் தமிழில் பொருளுக்கேற்ற பன்மைத் தற்சுட்டான ‘தங்கள்’ என வழங்குவது இயல்பானது.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: நீர் அவர்களை அனுப்பும் வழியில்
  rationale: דֶּרֶךְ என்பதன் வழி/பாதை என்ற நேரடியான உணர்வையும், அனுப்புபவர் இறைவன் என்பதையும் பாதுகாக்கிறது.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: உம்மிடம் மன்றாடினால்
  rationale: אֶל உடன் வரும் வினை மன்றாட்டு இறைவனை நோக்கிச் செலுத்தப்படுவதைச் சுட்டுகிறது; ‘மன்றாடு’ ஜெபத்தின் விண்ணப்பத் தன்மையை கண்ணியமான நவீன தமிழில் தருகிறது.
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  choice: இந்த நகரத்தை ... நோக்கி
  rationale: ஜெபிக்கும்போது நகரத்தின் திசையை நோக்கியிருப்பது என்ற இடம்சார் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: நீர் தேர்ந்தெடுத்த
  rationale: எருசலேமைக் குறித்த இறைத் தேர்வை கூடுதல் விளக்கமின்றி நேரடியாக வழங்குகிறது.
- source_word: וְהַבַּיִת
  choice: இந்த ஆலயத்தையும்
  rationale: בַּיִת நேரடியாக ‘வீடு’ என்றாலும், இச்சூழலில் சாலொமோன் கட்டிய ஆலயத்தையே தெளிவாகக் குறிக்கிறது. தமிழில் ‘இந்த ஆலயம்’ இயல்பாகவும் குழப்பமின்றியும் உள்ளது.
- source_word: אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: உமது பெயருக்காக நான் கட்டிய
  rationale: சாலொமோன் கட்டிய செயலும், கட்டிடம் இறைவனுடைய பெயருக்காக அர்ப்பணிக்கப்பட்டது என்ற ஆலயச் சூத்திரமும் நேரடியாகப் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: எருசலேமையும் ஆலயத்தையும் நோக்கிய திசைசார் மன்றாட்டு
  choice: ‘இந்த நகரத்தையும் ... இந்த ஆலயத்தையும் நோக்கி’ என்ற உறுதியான இடம்சார் மொழி தக்கவைக்கப்பட்டது.
  alternative: ‘இந்த நகரத்தை நினைத்து’ அல்லது ‘இந்த நகரத்துடன் தொடர்புபடுத்தி’ என்று கருத்தாக்கமாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை ஜெபத்தின் உண்மையான திசைநோக்கை வலியுறுத்துகிறது. பிற்கால இறையியல் முடிவுகளைச் சேர்க்காமல், சாலொமோனின் ஆலய மன்றாட்டின் வரலாற்று-இறையியல் சூழல் காக்கப்படுகிறது.
- issue: בַּיִת என்பதன் மொழிபெயர்ப்பு
  choice: சூழலுக்கேற்றவாறு ‘ஆலயம்’ எனத் தெளிவுபடுத்தப்பட்டது.
  alternative: மூலச் சொல்லின் உருவை நெருக்கமாகப் பாதுகாக்க ‘வீடு’ அல்லது ‘இல்லம்’ என வழங்குதல்.
  rationale: இங்கு குறிப்பிடப்படுவது சாலொமோன் இறைவனுடைய பெயருக்காகக் கட்டிய ஆலயம் என்பது சூழலால் உறுதி. ‘ஆலயம்’ என்பது தமிழில் தவறான கட்டிடப் பொருள் தோன்றுவதைத் தவிர்க்கிறது; தனிப்பட்ட சமயக் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய உரையில் ‘நீர்/உமது/உம்மிடம்’ என்ற மரியாதை ஒருமை சீராகப் பேணப்பட்டுள்ளது. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியமாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
