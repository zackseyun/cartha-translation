  terminology: ‘சுதந்தரமாக’, ‘பரலோகம்’, ‘இஸ்ரவேல்’, ‘பாவம்’ ஆகியவை பொருத்தமானவை. ‘ஊழியர்கள்’ என்பதற்குப் பதிலாக ‘அடியார்கள்’ பயன்படுத்தப்பட வேண்டும்; இது தேவனுக்குரிய பணிவான அடியார்/ஊழியர் என்ற மூலத்தின் சூழல்சார் பொருளைத் தக்கவைக்கிறது.
