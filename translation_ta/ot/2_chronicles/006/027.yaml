base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
translation:
  language: ta
  text: அப்போது நீர் பரலோகத்தில் கேட்டு[a], உமது அடியார்களும் உமது மக்களாகிய இஸ்ரவேலும் செய்த பாவத்தை மன்னித்து, அவர்கள் நடக்க வேண்டிய நல்ல வழியை நீர் அவர்களுக்குக் கற்பிக்கும்போது[b], உமது மக்களுக்குச் சுதந்தரமாக நீர் கொடுத்த உமது நாட்டின்மேல் மழையைத் தாரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “வானங்களை/வானத்தைக் கேட்டு.” இது தேவன் தமது பரலோக வாசஸ்தலத்தில் இருந்து கேட்பதைக் குறிக்கும் வழக்குச் சொற்றொடர்; “பரலோகத்திலிருந்து கேட்டு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏனெனில், அவர்கள் நடக்க வேண்டிய நல்ல வழியை நீர் அவர்களுக்குக் கற்பிப்பதால்.”
    reason: ambiguity
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: பரலோகத்தில் கேட்டு
  rationale: எபிரெயச் சொற்றொடரில் முன்னிடைச்சொல் இல்லாமல் ‘வானங்களை/வானத்தை கேள்’ என்று இருந்தாலும், இங்கு தேவன் தமது பரலோக வாசஸ்தலத்தில் இருந்து வேண்டுதலைக் கேட்பதைக் குறிக்கும் வழக்குச் சொற்றொடர். ‘பரலோகத்தில் கேட்டு’ என்பது மூலத்தின் வடிவத்துக்கு நெருக்கமாகவும் தமிழில் புரியத்தக்கதாகவும் உள்ளது.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: பாவத்தை மன்னியும்
  rationale: חטאת இங்கு பாவம் அல்லது குற்றத்தைக் குறிக்கிறது. வேண்டுதல் நடையில் ‘மன்னியும்’ என்பது கண்ணியமான, இயல்பான தமிழ்.
- source_word: עֲבָדֶיךָ
  choice: உமது ஊழியர்கள்
  rationale: עבד என்பதற்கு அடிமை என்றும் ஊழியர் என்றும் பொருள் உண்டு; உடன்படிக்கை வேண்டுதலின் சூழலில் தேவனுக்குப் பணிபுரியும் மக்களைக் குறிக்க ‘ஊழியர்கள்’ பொருத்தமானது.
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேல்
  rationale: இஸ்ரவேல் என்பது ‘உமது மக்கள்’ என்பதை விளக்கும் பெயராகத் தெளிவாகத் தரப்பட்டுள்ளது; முந்தைய ‘ஊழியர்களும்’ என்பதுடன் இணைந்து ஒரே ‘பாவத்தை’ ஆள்கிறது.
- source_word: כִּי
  choice: கற்பிக்கும்போது
  rationale: כִּי என்பதற்கு ‘ஏனெனில்’ என்ற காரணப் பொருளும், இச்சூழலில் ‘எப்போது/அப்போது’ என்ற சூழ்நிலைப் பொருளும் சாத்தியம். முதன்மை உரை வேண்டுதலின் தொடர்ச்சிக்கு இயல்பான கால/சூழ்நிலை நுணுக்கத்தைத் தருகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: תוֹרֵם
  choice: நீர் அவர்களுக்குக் கற்பிக்கும்போது
  rationale: ירה என்பதன் Hiphil வடிவம் இங்கு போதித்தல் அல்லது வழிகாட்டுதல் என்ற பொருளைத் தருகிறது. ‘கற்பிக்கும்போது’ அதன் போதனை சார்ந்த பொருளைக் காக்கிறது.
- source_word: אֶל הַדֶּרֶךְ הַטּוֹבָה
  choice: நல்ல வழியை
  rationale: மூலத்தின் ‘நல்ல வழி’ என்ற அறநெறிச் சித்திரத்தை மேலதிக விளக்கமின்றி நேரடியாகக் காக்கிறது.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: அவர்கள் நடக்க வேண்டிய
  rationale: ‘நடத்தல்’ என்ற வேதாகம உருவகத்தைத் தக்கவைத்தும், எதிர்பார்க்கப்படும் வாழ்க்கை முறையை ‘வேண்டிய’ என்பதன் மூலம் இயல்பான தமிழில் வெளிப்படுத்தியும் உள்ளது.
- source_word: וְנָתַתָּה מָטָר
  choice: மழையைத் தாரும்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’. தமிழில் வேண்டுதல் நடைக்கு ‘மழையைத் தாரும்’ இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: עַל אַרְצְךָ
  choice: உமது நாட்டின்மேல்
  rationale: மூலத்தில் உள்ள இரண்டாம் நபர் உடைமைப் பின்னொட்டைத் தக்கவைக்கிறது. ‘நாடு’ என்பது இங்கு இஸ்ரவேலுக்குக் கொடுக்கப்பட்ட நிலப்பரப்பை இயல்பான தமிழில் குறிக்கிறது.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: உமது மக்களுக்குச் சுதந்தரமாக நீர் கொடுத்த
  rationale: נחלה என்பது வழங்கப்பட்ட நில உரிமை அல்லது சுதந்தரப் பங்கைக் குறிக்கிறது. ‘சுதந்தரமாக’ உடன்படிக்கை சார்ந்த நிலக்கொடையின் கருத்தைக் காக்கிறது.
theological_decisions:
- issue: சாலொமோனின் வேண்டுதலில் தேவ பதிலின் தொடர்பும் வரிசையும்
  choice: தேவன் கேட்டு, மன்னித்து, நல்ல வழியைக் கற்பித்து, மழை தர வேண்டும் என்ற வேண்டுதலின் ஓட்டமாக மொழிபெயர்க்கப்பட்டது.
  alternative: כִּי என்பதை ‘ஏனெனில் நீர் அவர்களுக்குக் கற்பிக்கிறீர்’ என்று கண்டிப்பான காரணவாக்கியமாகப் படிக்கலாம்.
  rationale: சூழல் மனந்திரும்பிய மக்களுக்கான உடன்படிக்கை மீட்பை வேண்டுகிறது. ‘கற்பிக்கும்போது’ என்பது காரண உறவைத் தீர்மானமாக்காமல் கால/சூழ்நிலைத் தொடர்பைத் தருகிறது; காரண வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்/உமது/தாரும்/மன்னியும்’ வடிவங்கள் ஆராதனைச் சூழலின் மரியாதையைத் தக்கவைக்கின்றன; மிகப் பழமையான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
