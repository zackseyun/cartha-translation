source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ אֲשֶׁ֥ר דִּבַּ֖רְתָּ לְ/עַבְדְּ/ךָ֥ לְ/דָוִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/017.yaml
  text: Now[a], Yahweh, God of Israel, let your word that you spoke to your servant David be confirmed.
translation:
  language: ta
  text: இப்போது, இஸ்ரவேலின் கடவுளாகிய யாவே, உமது ஊழியனாகிய தாவீதிடம் நீர் உரைத்த உமது வார்த்தை உறுதிப்படுவதாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது வாக்குறுதி நிலைநாட்டப்படுவதாக”; அல்லது, “உமது வார்த்தை உண்மையென விளங்குவதாக.”
    reason: יֵאָמֵן மற்றும் சூழலில் வாக்குறுதியைக் குறிக்கும் דְּבָרְךָ ஆகியவற்றின் செல்லத்தக்க பொருள் மாற்றுகளைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: தொடர்ந்து வரும் வேண்டுதலை அறிமுகப்படுத்தும் கால/உரையாடல் குறியீடு. எபிரெய மொழியின் וְ கூறும் தொடர்ச்சியைத் தமிழில் சூழலும் வாக்கிய ஓட்டமும் இயல்பாக உணர்த்துவதால் தனியே ‘மேலும்’ என மொழிபெயர்க்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பட்ட உடன்படிக்கைப் பெயர்; அதன் ஒலிபெயர்ப்பு தமிழில் ‘யாவே’ என வழங்கப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: யாவேயை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்தும் இணைப்புத் தொடரை இயல்பான தமிழில் தெளிவாக வழங்குகிறது.
- source_word: יֵאָמֵן
  choice: உறுதிப்படுவதாக
  rationale: אמן என்பதன் நிஃபால் வடிவம், கடவுள் உரைத்த வார்த்தை நிறைவேறுவதன் மூலம் உறுதியானதாக நிலைபெற வேண்டும் என்ற வேண்டுதலைக் குறிக்கிறது. செயல்படு/விளைவு நுணுக்கத்தை ‘உறுதிப்படுவதாக’ காக்கிறது.
- source_word: דְּבָרְךָ
  choice: உமது வார்த்தை
  rationale: சொல்லுக்குச் சொல் பொருளைத் தக்கவைக்கிறது. சூழலில் இது வாக்குறுதியைக் குறித்தாலும், அந்த விளக்கத்தைப் பெயர்ச்சொல்லுக்குள் கட்டாயமாகச் சேர்க்கவில்லை.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: நீர் உரைத்த
  rationale: ‘வார்த்தை’ என்பதோடு உள்ள மூலமொழிச் சொல் தொடர்பைத் தக்கவைத்து, மரியாதையான இயல்பான தமிழில் வழங்குகிறது.
- source_word: לְעַבְדְּךָ
  choice: உமது ஊழியனாகிய ... இடம்
  rationale: דבר உடன் வரும் ל உரை யாரிடம் சொல்லப்பட்டது என்பதைக் குறிக்கிறது; ‘ஊழியன்’ இங்கு அரச-உடன்படிக்கைச் சூழலுக்கு ஏற்றது.
- source_word: לְדָוִיד
  choice: தாவீது
  rationale: தனிப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபின்படி வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டத்துக்குப் பதிலாக நான்கெழுத்து இறைப் பெயரே நேரடியாக உள்ளது. ‘யாவே’ அதன் தனிப்பட்ட உடன்படிக்கைப் பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: דְּבָרְךָ என்பதை விளக்கமாக ‘வாக்குறுதி’ என வழங்கலாமா
  choice: உமது வார்த்தை
  alternative: உமது வாக்குறுதி
  rationale: தாவீதுக்கு உரைக்கப்பட்டது சூழலில் வாக்குறுதியே என்றாலும், ‘வார்த்தை’ மூலச்சொல்லை நேரடியாகக் காத்து, அதன் வாக்குறுதித் தன்மையைச் சூழல் வெளிப்படுத்த இடமளிக்கிறது.
- issue: יֵאָמֵן என்பதன் வேண்டுதல் நுணுக்கம்
  choice: உறுதிப்படுவதாக
  alternative: நிலைநாட்டப்படுவதாக / உண்மையென விளங்குவதாக
  rationale: இச்சொல் உரைக்கப்பட்ட வார்த்தை உறுதியானதாக நிறுவப்படுதல் அல்லது நிறைவேற்றத்தில் உண்மையென நிரூபிக்கப்படுதல் ஆகிய இரு நுணுக்கங்களையும் தாங்குகிறது; முதன்மை உரை அவற்றை ஒருபக்கம் மட்டுமே தீர்மானிக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான, மரியாதையும் கண்ணியமும் கொண்ட தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறைவனை நேரடியாக அழைக்கும் இடத்தில் ‘உமது’, ‘நீர்’ என மரியாதைப் பன்மை கையாளப்பட்டுள்ளது; வாக்கியம் சாதாரண வாசகருக்கும் புரியும் வகையில் இயல்பாக அமைக்கப்பட்டுள்ளது.
