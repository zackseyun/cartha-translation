  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֧ב אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם עַל הָ/אָ֑רֶץ הִ֠נֵּה שָׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
translation:
  language: ta
  text: ஆனால், கடவுள் உண்மையிலேயே மனிதனுடன்[a] பூமியில் குடியிருப்பாரா? இதோ, வானமும் வானங்களுக்கெல்லாம் மேலான வானமும்கூட உம்மைத் தம்முள் கொள்ள முடியாது; அப்படியானால், நான் கட்டிய இந்த வீடு உம்மை எப்படித் தன்னுள் கொள்ள முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதன்” என்பது இங்கு ஓர் ஆண் தனிநபரை மட்டும் அல்ல, மனிதகுலம் முழுவதையும் பொதுவாகக் குறிக்கிறது; “மனிதகுலத்துடன்” அல்லது “மனிதர்களுடன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: உண்மையிலேயே
  rationale: வியப்பையும் நம்புவதற்கரிய தன்மையையும் வெளிப்படுத்தும் சொல்லாட்சியை இயல்பான, மேன்மையான தமிழில் தருகிறது.
- source_word: יֵשֵׁב
  choice: குடியிருப்பாரா
  rationale: இங்கு உட்காருதல் அல்ல, மனிதரிடையே நிலையாகத் தங்கியிருத்தல் அல்லது பிரசன்னமாயிருத்தல் என்பதே சூழல்சார் பொருள்.
- source_word: אֶת הָאָדָם
  choice: மனிதனுடன்[a]
  rationale: எபிரெய பிரதிநிதித்துவ ஒருமையைத் தக்கவைத்து, அது மனிதகுலம் முழுவதையும் குறிக்கும் என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: עַל הָאָרֶץ
  choice: பூமியில்
  rationale: இடப்பொருளை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் வலிமையையும் ஜெபத்தின் மேன்மையான நடையையும் காக்கிறது.
- source_word: שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: வானமும் வானங்களுக்கெல்லாம் மேலான வானமும்
  rationale: ‘வானங்களின் வானம்’ என்ற எபிரெய உயர்நிலைச் சொல்லாட்சியின் பொருளைத் தெளிவான தற்போதைய தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: உம்மைத் தம்முள் கொள்ள முடியாது
  rationale: கடவுளை எந்தப் படைக்கப்பட்ட வெளியும் தனக்குள் அடக்கவோ கொண்டிருக்கவோ இயலாது என்ற கொள்ளளவுச் சிந்தனையைத் தருகிறது.
- source_word: אַף כִּי
  choice: அப்படியிருக்க ... எம்மாத்திரம்
  rationale: வானமே கடவுளைக் கொள்ள முடியாவிட்டால் இந்த வீடு அதைவிட எவ்வளவோ குறைவு என்ற வலுவிலிருந்து வலுவுக்குச் செல்லும் ஒப்பீட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: הַבַּיִת הַזֶּה
  choice: இந்த வீடு
  rationale: சூழலில் ஆலயத்தைக் குறித்தாலும், மூலத்தில் உள்ள ‘வீடு’ என்ற உருவகத்தையும் ஆலயம்–வீடு தொடர்பையும் மாற்றாமல் காக்கிறது.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: நான் கட்டிய
  rationale: முடிக்கப்பட்ட கட்டுமானச் செயலை இயல்பாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: אָדָם என்ற பிரதிநிதித்துவ ஒருமையை மொழிபெயர்த்தல்
  choice: மனிதனுடன்
  alternative: மனிதகுலத்துடன் / மனிதர்களுடன்
  rationale: மூலத்தின் ஒருமை வடிவத்தைத் தக்கவைக்கிறது; அதே நேரம் அது ஓர் ஆண் தனிநபரை மட்டும் அல்ல, மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது என்பதை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: ஆலயம் கடவுளைக் கொண்டிருக்குமா என்ற சொல்லாட்சியின் நீள்வட்ட அமைப்பு
  choice: அப்படியிருக்க, நான் கட்டிய இந்த வீடு எம்மாத்திரம்!
  alternative: அப்படியிருக்க, நான் கட்டிய இந்த வீடு உம்மை எப்படித் தன்னுள் கொள்ள முடியும்?
  rationale: மூலத்தில் இரண்டாம் கூறில் வினைச்சொல் வெளிப்படையாக மீண்டும் வராத நீள்வட்ட அமைப்பையும், கடவுளின் எல்லையற்ற தன்மைக்கும் கட்டப்பட்ட வீட்டின் வரம்புக்கும் இடையிலான இறையியல் பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்துக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நேரடியாகச் சுட்டும் இடத்தில் மரியாதைப் பன்மையான “உம்மை” பயன்படுத்தப்பட்டுள்ளது. பாரம்பரியமான ஆனால் பலருக்குத் தெளிவில்லாத “வானாதி வானம்” என்பதற்குப் பதிலாக அதன் உயர்நிலைப் பொருள் வெளிப்படையாகத் தரப்பட்டுள்ளது.
