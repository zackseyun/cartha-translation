  text: וְ/שָׁמַעְתָּ֨ מִן הַ/שָּׁמַ֜יִם מִ/מְּכ֣וֹן שִׁבְתְּ/ךָ֗ אֶת תְּפִלָּתָ/ם֙ וְ/אֶת תְּחִנֹּ֣תֵי/הֶ֔ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָ֑/ם וְ/סָלַחְתָּ֥ לְ/עַמְּ/ךָ֖ אֲשֶׁ֥ר חָֽטְאוּ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/039.yaml
  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
translation:
  language: ta
  text: அப்போது வானத்திலிருந்து, நீர் குடியிருக்கும் இடத்திலிருந்து, அவர்களுடைய ஜெபத்தையும் மன்றாட்டுகளையும் கேட்பீராக; அவர்களுடைய வழக்கில் நீதி செய்வீராக[a]; உமக்கு எதிராகப் பாவம் செய்த உமது மக்களை மன்னிப்பீராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு நீதி வழங்குவீராக” அல்லது “அவர்களுக்காக நீதி செய்வீராக.” எபிரெயத்தில் சொல்லுக்குச் சொல், “அவர்களுடைய நியாயத்தை/வழக்கைச் செய்வீராக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: அப்போது … கேட்பீராக
  rationale: முந்தைய நிபந்தனைச் சூழலின் தொடர்ச்சியை ‘அப்போது’ காட்டுகிறது. இறைவனை நோக்கிய ஜெப வேண்டுதலாக உள்ள எபிரெய நிறைவுற்ற வினை, தமிழில் மரியாதையான வேண்டுகோள் வடிவில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִן הַשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: எபிரெயத்தில் வடிவளவில் பன்மையாக இருந்தாலும், இறைவன் கேட்கும் விண்ணக இடத்தைக் குறிக்கும் இந்த மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் இணை இது.
- source_word: מִמְּכוֹן שִׁבְתְּךָ
  choice: நீர் குடியிருக்கும் இடத்திலிருந்து
  rationale: מָכוֹן என்பதின் நிலையான இடம் என்ற கருத்தையும், שִׁבְתְּךָ என்பதின் குடியிருப்புக் கருத்தையும் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תְּפִלָּתָם
  choice: அவர்களுடைய ஜெபம்
  rationale: ஒருமை கூட்டுப்பொருளைத் தக்கவைத்து, சாதாரண நவீனத் தமிழில் புரியக்கூடிய வழிபாட்டு மொழியைப் பயன்படுத்துகிறது.
- source_word: תְּחִנֹּתֵיהֶם
  choice: அவர்களுடைய மன்றாட்டுகள்
  rationale: இரக்கத்தை நாடும் தீவிரமான வேண்டுதல்களைச் சுட்டுகிறது; ‘ஜெபம்’ என்பதிலிருந்து சொற்பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: அவர்களுடைய வழக்கில் நீதி செய்வீராக
  rationale: சொற்றொடரின் நீதித்துறை சார்ந்த பொருளைத் தக்கவைத்து, அவர்களுடைய விவகாரத்தில் இறைவன் நியாயமாகச் செயல்பட வேண்டும் என்ற வேண்டுதலை இயல்பான தமிழில் தருகிறது.
- source_word: וְסָלַחְתָּ
  choice: மன்னிப்பீராக
  rationale: இறைவன் பாவத்தை மன்னிப்பதைக் குறிக்கும் סלח என்பதற்கான தெளிவான, வழக்கமான தமிழ் இணை.
- source_word: לְעַמְּךָ
  choice: உமது மக்களை
  rationale: தமிழ் வினை அமைப்பில் ‘மன்னி’ என்பதன் நேர்ச்செயப்படுபொருளாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר חָטְאוּ לָךְ
  choice: உமக்கு எதிராகப் பாவம் செய்த
  rationale: חטא உடன் வரும் לְ இங்கு இறைவனுக்கு எதிரான குற்றத்தைச் சுட்டுவதால், அந்தத் திசைப்பட்ட பொருள் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: מִשְׁפָּטָם என்பதிலுள்ள நீதித்துறை மொழி
  choice: அவர்களுடைய வழக்கில் நீதி செய்வீராக
  alternative: அவர்களுடைய நியாயத்தைச் செய்வீராக; அவர்களுக்கு நீதி வழங்குவீராக
  rationale: இது மனுதாரர்களைக் கண்டனம் செய்வதாக முன்கூட்டியே தீர்மானிக்காமல், அவர்களுடைய வழக்கில் இறைவன் நீதியாகச் செயல்பட வேண்டும் என்ற கருத்தைத் தருகிறது. ‘வழக்கு’ என்பது சட்டச் சார்பைத் தக்கவைக்கிறது; ‘நீதி செய்வீராக’ என்பது எபிரெயச் சொற்றொடரின் திறந்த பொருளை இயல்பான தமிழில் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை நோக்கிய கண்ணியமான ‘நீர்/உமது’ நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான எபிரெய நிறைவுற்ற வினைகள் ஜெப வேண்டுதல்களாகத் தெளிவுபடுத்தப்பட்டுள்ளன. நீதித்துறைச் சொற்றொடரின் உண்மையான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
