theological_decisions:
- issue: ஆலயத்தைக் குறிக்கும் ‘வீடு’
  choice: ஆலயம்
  alternative: வீடு
  rationale: மூலத்தில் ‘வீடு’ என்ற சொல் இருந்தாலும், இங்கு அது ஆலயத்துக்கான நிலையான குறிப்பாக வருகிறது. ‘ஆலயம்’ தமிழில் தெளிவைத் தருகிறது; மூலச்சொல்லின் உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: உடல்வழிச் சந்ததி மரபுத்தொடர்
  choice: உன் உடலிலிருந்து பிறக்கப்போகும்
  alternative: உன் இடுப்பிலிருந்து வரப்போகும்
  rationale: நேரடியான உயிரியல் சந்ததி என்ற பொருளைத் தெளிவாகத் தருகிறது; கூடுதல் இறையியல் கருத்து எதையும் சேர்க்கவில்லை.
- issue: மகனை வலியுறுத்துதல்
  choice: உன் மகனே
  alternative: அவனே
  rationale: הוּא என்பதன் வலியுறுத்தலைப் பாதுகாத்தபடி, தமிழில் தேவையற்ற சுட்டுப்பெயர் மீளுரைப்பைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆனாலும்’ எதிர்மறைத் திருப்பத்தையும், ‘மகனே’ மூலத்தின் வலியுறுத்தலையும் இயல்பாகக் காக்கின்றன. ‘என் பெயருக்கென’ ஆலய அர்ப்பணிப்பின் நோக்கத்தைச் சுருக்கமாகத் தெரிவிக்கிறது.
