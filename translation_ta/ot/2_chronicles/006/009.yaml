  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י בִנְ/ךָ֙ הַ/יּוֹצֵ֣א מֵֽ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
translation:
  language: ta
  text: ஆனாலும், நீ அந்த ஆலயத்தைக்[a] கட்டமாட்டாய்; மாறாக, உன் உடலிலிருந்து பிறக்கப்போகும் உன் மகனே[b] என் பெயருக்கென அந்த ஆலயத்தைக் கட்டுவான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “வீடு”; இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, “உன் இடுப்புகளிலிருந்து புறப்படுகிற”; இது ஒருவரின் நேரடியான உடல்வழிச் சந்ததியைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ஆனாலும்
  rationale: முந்தைய கூற்றை வரையறுக்கும் எதிர்மறைத் திருப்பத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִבְנֶה הַבָּיִת / יִבְנֶה הַבַּיִת
  choice: அந்த ஆலயத்தைக் கட்டு / அந்த ஆலயத்தைக் கட்டுவான்
  rationale: எபிரெயச் சொல் நேரடியாக ‘வீடு’ என்றாலும், இச்சூழலில் அது இறைவனுக்கான ஆலயத்தைக் குறிக்கிறது. தமிழில் ‘ஆலயம்’ பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; மூல வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: כִּי
  choice: ;
  rationale: மறுப்புக்குப் பின் வரும் மாறுபட்ட உறுதிப்பாட்டைத் தமிழில் அரைப்புள்ளியும் அடுத்த வாக்கிய அமைப்பும் இயல்பாக வெளிப்படுத்துகின்றன; தனியே காரணவியல் இணைப்புச் சொல் சேர்க்கப்படவில்லை.
- source_word: בִנְךָ
  choice: உன் மகன்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் நேரடியான மகன் குறிப்பு.
- source_word: הַיּוֹצֵא מֵחֲלָצֶיךָ
  choice: உன் உடலிலிருந்து பிறக்கப்போகும்
  rationale: ‘உன் இடுப்புகளிலிருந்து புறப்படுகிறவன்’ என்ற மூல மரபுத்தொடர் நேரடியான உடல்வழிச் சந்ததியைக் குறிக்கிறது; தேர்ந்தெடுத்த வடிவம் நவீனத் தமிழில் அதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הוּא
  choice: உன் மகனே
  rationale: தனி ஆண்பால் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழின் ‘-ஏ’ வலியுறுத்தல் உருபு இயல்பாகப் பாதுகாக்கிறது.
- source_word: לִשְׁמִי
