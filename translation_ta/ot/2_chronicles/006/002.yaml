  text: וַֽ/אֲנִ֛י בָּנִ֥יתִי בֵית זְבֻ֖ל לָ֑/ךְ וּ/מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/002.yaml
  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: ta
  text: ஆனால், உமக்காக ஓர் உயர்ந்த இல்லத்தையும், நீர் என்றென்றும் குடியிருப்பதற்கான ஓர் நிலையான இடத்தையும் நான் கட்டியிருக்கிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵית זְבֻל
  choice: ஓர் உயர்ந்த இல்லம்
  rationale: זְבֻל என்பது உயர்ந்த அல்லது மேன்மையான வாசஸ்தலத்தைக் குறிக்கலாம். சூழலில் ஆலயத்தைச் சுட்டுவதால், மூலத்தின் உயர்வு சார்ந்த பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: מָכוֹן
  choice: ஓர் இடம்
  rationale: நிறுவப்பட்ட அல்லது ஆயத்தமான இடம் என்ற பொருளுடைய சொல்லை, அடுத்துவரும் குடியிருத்தல் என்ற கருத்துடன் இயல்பாக இணைக்கிறது.
- source_word: לְשִׁבְתְּךָ
  choice: நீர் குடியிருப்பதற்கான
  rationale: இறைவனை நோக்கிய ஒருமை இரண்டாம் நபர் வடிவத்தை மரியாதை ஒருமையான ‘நீர்/உமக்கு’ மூலம் வெளிப்படுத்துகிறது.
- source_word: עוֹלָמִים
  choice: என்றென்றும்
  rationale: பன்மை வடிவிலுள்ள நீடித்த காலக் கருத்தை தமிழில் வழக்கமான முடிவற்ற கால வெளிப்பாடாகத் தருகிறது.
theological_decisions:
- issue: இறைவன் ஆலயத்தில் ‘என்றென்றும் குடியிருப்பது’ என்ற கூற்றின் வலிமை
  choice: மூலத்தில் உள்ள நேரடியான கூற்றை அப்படியே காத்தல்
  alternative: ‘தமது பெயரை நிலைநிறுத்துவதற்கான இடம்’ என விளக்கமாக மாற்றுதல்
  rationale: இந்த வசனம் இறைவனின் மறைவையும் ஆலய வாசத்தையும் இடையிலான பதற்றத்தைத் தானாக விளக்கித் தீர்க்கவில்லை; ஆகவே அதன் தெய்வவியல் பதற்றத்தை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், அரசனின் அர்ப்பணிப்பு உரைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனை நோக்கி ‘உமக்கு/நீர்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
