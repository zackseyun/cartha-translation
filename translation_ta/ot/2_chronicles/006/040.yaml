source:
  edition: WLC
  text: עַתָּ֣ה אֱלֹהַ֗/י יִֽהְיוּ נָ֤א עֵינֶ֨י/ךָ֙ פְּתֻח֔וֹת וְ/אָזְנֶ֖י/ךָ קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
translation:
  language: ta
  text: இப்போது[a], என் தேவனே, தயவுசெய்து உமது கண்கள் திறந்திருக்கட்டும்; உமது செவிகள் இந்த இடத்தின் ஜெபத்திற்குக் கவனமாயிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் இப்போது.” “இப்போது” என்பது சாலொமோனின் நிறைவு வேண்டுதலுக்கான மாற்றத்தைக் குறிக்கிறது. “இந்த இடத்தின் ஜெபம்” என்பதை “இந்த இடத்தில் ஏறெடுக்கப்படும் ஜெபம்” அல்லது “இந்த இடத்திலிருந்து வரும் ஜெபம்” என்றும் பொருள்கொள்ளலாம்; எபிரெயத்தில் சொற்பொருளாக, “இந்த இடத்தின் ஜெபம்” என்று உள்ளது.
    reason: சொல் மற்றும் தொடரியல் மாற்றுப் பொருள்
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: சாலொமோனின் நிறைவு வேண்டுதலை அறிமுகப்படுத்தும் கால/உரையாடல் குறியீடு; நவீன தமிழில் இயல்பாக மாற்றப்பட்டுள்ளது.
- source_word: אֱלֹהַי
  choice: என் தேவனே
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் நேரடி விளிப்பைத் தமிழின் விளிவேற்றுமை வடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: יִהְיוּ נָא
  choice: '... இருக்கவும் ... வேண்டுகிறேன்'
  rationale: வேண்டுகோள் நயமுள்ள jussive வடிவத்தையும் נָא தரும் பணிவான மன்றாட்டையும் இயல்பான தமிழ் வேண்டுதல் அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: עֵינֶיךָ פְּתֻחוֹת
  choice: உமது கண்கள் திறந்திருக்கவும்
  rationale: தேவனுடைய கவனத்தைக் குறிக்கும் உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே பாதுகாக்கிறது.
- source_word: וְאָזְנֶיךָ קַשֻּׁבוֹת
  choice: உமது செவிகள் ... கவனமாயிருக்கவும்
  rationale: קַשֻּׁבוֹת என்பதன் செவிசாய்த்துக் கேட்கத் தயாராயிருக்கும் பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: לִתְפִלַּת
  choice: ஜெபத்திற்குக்
  rationale: தேவனுடைய கவனம் எதை நோக்கியிருக்க வேண்டும் என்பதைக் குறிக்கும் ל முன்னொட்டின் திசை/பொருள் உறவைத் தக்கவைக்கிறது.
- source_word: הַמָּקוֹם הַזֶּה
  choice: இந்த இடத்தின்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான உரிமைத் தொடர்பைத் தக்கவைத்து, ‘இங்கு ஏறெடுக்கப்படும்’ அல்லது ‘இங்கிருந்து வரும்’ என்று மறைபொருளை முதன்மை உரையில் தீர்மானிக்கவில்லை.
theological_decisions:
- issue: தேவனுடைய கண்களையும் செவிகளையும் குறிக்கும் மனிதவுருவ மொழி
  choice: ‘கண்கள் திறந்திருக்கவும், செவிகள் ... கவனமாயிருக்கவும்’ என்ற தெளிவான உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘கவனித்து ஜெபத்தைக் கேளும்’ போன்ற விளக்கவுரை
  rationale: மூல எபிரெயம் தேவன் ஜெபத்தைக் கவனிப்பதை உடலுறுப்பு உருவகங்களால் கூறுகிறது. அதை அப்படியே வைத்திருப்பது இலக்கிய மற்றும் இறையியல் நயத்தைப் பாதுகாக்கிறது; தேவனுக்கு மனித உடல் உண்டு என்று தனியாக வலியுறுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; நேரடி தேவவிளிப்புக்கேற்ற கண்ணியமான ‘உமது’ நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இணை அமைப்பும் பணிவான மன்றாட்டு நயமும் பாதுகாக்கப்பட்டுள்ளன.
