source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “இஸ்ரவேலின் கடவுளாகிய யாவே, வானத்திலோ பூமியிலோ உமக்கு ஒப்பான கடவுள் இல்லை; உமது முன்னிலையில் முழு இதயத்தோடு நடக்கிற உமது ஊழியர்களுக்காக உடன்படிக்கையையும் மாறாத அன்பையும்[a] காக்கிறவராகிய நீரே.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடன்படிக்கையையும் உடன்படிக்கைப் பற்றுறுதியையும்.”
    reason: חֶסֶד என்ற சொல்லின் உடன்படிக்கை சார்ந்த பற்றுறுதி நுண்பொருளை மாற்று மொழிபெயர்ப்பாகப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: அவர் சொன்னது
  rationale: வழக்கமான எபிரெயக் கதைத் தொடர் வினை வடிவை இயல்பான நவீன தமிழில் தருகிறது; காலத் தொடரை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெயத் தனிப்பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: யாவேவை இஸ்ரவேலின் கடவுளாக அடையாளப்படுத்தும் சார்பு அமைப்பை இயல்பான தமிழ் விளியாகத் தருகிறது.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: உமக்கு ஒப்பான கடவுள் இல்லை
  rationale: யாவேயின் ஒப்பற்ற தன்மையைத் தெளிவாகத் தருகிறது; ‘தெய்வங்களுக்குள்’ என்ற சர்ச்சைக்குரிய விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: வானத்திலோ பூமியிலோ
  rationale: எதிர்மறை ஒப்பீட்டில் மொத்தத்தையும் குறிக்கும் இரட்டைப் பரப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֹׁמֵר
  choice: காத்துவருகிறவர்
  rationale: இறைவனின் தொடர்ச்சியான, பண்புரீதியான செயலைக் காட்டும் எபிரெயப் பங்கேற்பு வடிவின் நீடித்த பொருளைப் பேணுகிறது.
- source_word: הַבְּרִית
  choice: உடன்படிக்கையை
  rationale: கடவுளின் கட்டுப்படுத்தும் உறுதியைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ் இறையியல் சொல்.
- source_word: וְהַחֶסֶד
  choice: மாறாத அன்பை
  rationale: חֶסֶד என்பதிலுள்ள அன்பு, நிலைத்தன்மை, உறவுசார் பற்றுறுதி ஆகியவற்றை வாசிக்க எளிய தமிழில் ஒருங்கிணைக்கிறது.
- source_word: לַעֲבָדֶיךָ
  choice: உமது ஊழியர்களுக்கு
  rationale: இங்கு அடிமைத்தனத்தைவிட கடவுளுக்குச் சேவைசெய்யும் உறவுநிலையே முன்னிலையில் இருப்பதால் ‘ஊழியர்கள்’ பொருத்தமானது.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: உமது முன்னிலையில் ... நடக்கிற
  rationale: வாழ்க்கை நடத்தையைச் சுட்டும் ‘நடத்தல்’ உருவகத்தையும், கடவுளின் சந்நிதியில் வாழும் கருத்தையும் பேணுகிறது.
- source_word: בְּכָל לִבָּם
  choice: முழு இதயத்தோடு
  rationale: பிளவுபடாத முழுமையான அர்ப்பணிப்பைக் குறிக்கும் கூட்டு/பகிர்ந்த எபிரெயப் பயன்பாட்டை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், ஒரு பட்டப்பெயரால் மாற்றாமல் ஏற்ற தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- issue: חֶסֶד என்பதன் உடன்படிக்கைச் சூழல் நுண்பொருள்
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கைப் பற்றுறுதி; இரக்கம்; பேரன்பு
  rationale: இச்சொல் உடன்படிக்கையோடு இணைக்கப்பட்டுள்ளதால் நிலைத்த அன்பையும் பற்றுறுதியையும் உணர்த்த வேண்டும்; முதன்மை உரை நவீன வாசகருக்கு இயல்பாக இருக்க ‘மாறாத அன்பு’ தேர்ந்தெடுக்கப்பட்டு, உடன்படிக்கைப் பற்றுறுதி அடிக்குறிப்பில் தரப்பட்டது.
- issue: אֵין כָּמוֹךָ אֱלֹהִים என்பதன் ஒப்பீட்டு எல்லை
  choice: உமக்கு ஒப்பான கடவுள் இல்லை
  alternative: தெய்வங்களுக்குள் உமக்கு ஒப்பானவர் இல்லை
  rationale: எபிரெயச் சொற்றொடர் ஒப்பற்ற தன்மையை உறுதிப்படுத்துகிறது; ‘தெய்வங்களுக்குள்’ என்று வெளிப்படையாகச் சேர்ப்பது மூலத்தின் இலக்கணத் தெளிவின்மையை தேவையின்றித் தீர்மானித்துவிடும்.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதையான இறை விளியில் ‘உமது/உமக்கு/நீரே’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘நடத்தல்’ உருவகம் பேணப்பட்டு, வாக்கிய ஓட்டம் சாதாரண வாசகருக்குத் தெளிவாக அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
