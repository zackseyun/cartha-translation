base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
translation:
  language: ta
  text: உமது கண்கள் இரவும் பகலும் இந்த ஆலயத்தை நோக்கி, உமது பெயரை அங்கே வைப்பதாக நீர் சொன்ன அந்த இடத்தை நோக்கித் திறந்திருக்கட்டும்[a][b]; உமது அடியான் இந்த இடத்தை நோக்கிச் செய்யும் ஜெபத்தைக் கேட்பதற்காக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த ஆலயத்தின்மேல் உமது கவனம் இருக்கட்டும்.” எபிரேய மொழியில் சொல்லர்த்தமாக, “உமது கண்கள் திறந்திருக்கட்டும்” என்று உள்ளது; இது விழிப்பான கவனத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “உமது பெயரை அங்கே வைப்பது” என்பது ஆலயத்தைச் சார்ந்த ஒரு மரபுத்தொடர். இறைவன் அந்த இடத்தோடு தாம் தேர்ந்தெடுத்த சிறப்பான உறவை ஏற்படுத்துவதைக் குறிக்கிறது; இறைவன் அந்த இடத்துக்குள் அடங்கியிருக்கிறார் என்று பொருளல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת
  choice: உமது கண்கள் ... திறந்திருக்கட்டும்
  rationale: வேண்டுதலின் தன்மையையும், இறைவனின் கவனத்தைக் குறிக்கும் எபிரேய உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: இந்த ஆலயத்தை நோக்கி
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளைத் தருகிறது; இச்சூழலில் בַּיִת என்பது சாதாரண வீடு அல்ல, ஆலயம்.
- source_word: יוֹמָם וָלַיְלָה
  choice: இரவும் பகலும்
  rationale: முழு நேரத்தையும் குறிக்கும் இணைச்சொல்லை இயல்பான தமிழ் வரிசையில் வழங்குகிறது.
- source_word: לָשׂוּם שִׁמְךָ שָׁם
  choice: உமது பெயரை அங்கே வைப்பதாக
  rationale: ஆலயம் சார்ந்த முக்கியமான எபிரேய மரபுத்தொடரை விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- source_word: לִשְׁמֹעַ אֶל הַתְּפִלָּה
  choice: விண்ணப்பத்தைக் கேளும்
  rationale: இறைவனை நோக்கிய வேண்டுதலின் சூழலில் תְּפִלָּה என்பதன் பொருளை இயல்பாகத் தருகிறது; לִשְׁמֹעַ என்பதையும் நேரடியாகக் காக்கிறது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: இறைவனை நோக்கிப் பேசும் தாழ்மையான அரசரின் சுயக்குறிப்புக்கு நவீன வேதாகமத் தமிழில் இயல்பான சொல்.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: இந்த இடத்தை நோக்கி
  rationale: செபத்தின் திசையைக் குறிக்கும் எபிரேயச் சொல்லமைப்பைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: 'இறைவனைப் பற்றிய மனித உருவக மொழி: ‘உமது கண்கள் திறந்திருக்கட்டும்’'
  choice: உருவகத்தை முதன்மை உரையில் அப்படியே காத்தல்
  alternative: ‘நீர் இந்த ஆலயத்தைக் கவனித்தருளும்’ என்று பொருள்விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூல எபிரேயம் உடல் உறுப்பைச் சார்ந்த தெளிவான உருவகத்தைப் பயன்படுத்துகிறது; அதை அப்படியே வைத்தல் உரையின் இலக்கிய மற்றும் இறையியல் செறிவைக் காக்கிறது.
- issue: ‘உமது பெயரை அங்கே வைப்பது’ என்ற ஆலய இறையியல் மரபுத்தொடர்
  choice: ‘உமது பெயரை அங்கே வைப்பதாக’ என்று மரபுத்தொடரைத் தக்கவைத்தல்
  alternative: ‘உமது பிரசன்னத்தை அங்கே நிலைநிறுத்துவதாக’ என்று விளக்குதல்
  rationale: இந்தச் சுருக்கமான மரபுத்தொடர் இறைவனுக்கும் அவர் தேர்ந்தெடுத்த இடத்துக்கும் உள்ள தொடர்பைக் குறிக்கிறது; அதை ‘பிரசன்னம்’ என விரிவாக்குவது மூலத்தில் உள்ள பொருள் அகலத்தைச் சுருக்கக்கூடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கி ‘நீர்/உமது’ என்ற மரியாதை ஒருமை காக்கப்பட்டுள்ளது. ‘ஆலயம்,’ ‘அடியான்,’ ‘விண்ணப்பம்’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் உயர்நடைச் சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் மீளுரைப்பைத் தெளிவுக்காகத் தக்கவைத்துள்ளோம்.
