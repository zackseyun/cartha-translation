source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: ta
  text: யாவே தாம் சொன்ன வார்த்தையை நிறைவேற்றியிருக்கிறார்[a]; நான் என் தந்தையான தாவீதின் இடத்தில் எழுந்து, யாவே சொன்னபடியே இஸ்ரவேலின் அரியணையில் அமர்ந்திருக்கிறேன்; இஸ்ரவேலின் கடவுளாகிய யாவேயின் பெயருக்காக அந்த வீட்டைக் கட்டியிருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நிறைவேற்றியிருக்கிறார்” என்பதை “தமது வார்த்தையை நிலைநிறுத்தியிருக்கிறார்” அல்லது “தமது வார்த்தையைச் செயலாக்கியிருக்கிறார்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் சொல்லர்த்தமாக, தமது வார்த்தையை ‘நிற்கச் செய்தார்’ என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “வீடு” என்பது இங்கு ஆலயத்தைக் குறிக்கிறது. எபிரெய மூலத்தில் “யாவேயின் பெயருக்காக வீடு” என்ற உடன்படிக்கை சார்ந்த சொல்லாட்சி உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: நிறைவேற்றியிருக்கிறார்
  rationale: ஹிபில் வடிவில் ‘தமது வார்த்தையை நிலைநிறுத்துதல்/செயலாக்குதல்’ என்ற பொருள் தருகிறது; வாக்குறுதி சார்ந்த சூழலில் இயல்பான நவீனத் தமிழ் ‘நிறைவேற்றியிருக்கிறார்’.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயரொலிப்பாக வழங்குகிறது.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: தாம் சொன்ன வார்த்தையை
  rationale: דבר என்பதன் ‘வார்த்தை’ என்ற வடிவத்தையும் ‘சொன்ன’ என்ற வினைத் தொடர்பையும் காக்கிறது; மரியாதைக்குரிய ஒருமைச் சுட்டாக ‘தாம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וָאָקוּם תַּחַת דָּוִיד אָבִי
  choice: நான் என் தந்தை தாவீதுக்குப் பதிலாக எழுந்து
  rationale: קום என்ற முந்தைய வேர்ச்சொல்லுடனான எதிரொலியை ‘எழுந்து’ காக்கிறது; תחת என்பது அரச மரபுரிமைச் சூழலில் ‘இடத்தில்/பதிலாக’ என்பதால் ‘பதிலாக’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரியணையில் அமர்ந்திருக்கிறேன்
  rationale: முடிசூட்டப்பட்டு தற்போது ஆளும் நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; כִּסֵּא என்பதற்கு அரசச் சூழலுக்கேற்ற ‘அரியணை’.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: இந்த ஆலயத்தைக் கட்டியிருக்கிறேன்
  rationale: הַבַּיִת என்பதன் நேர்ப்பொருள் ‘அந்த வீடு’ என்றாலும் இங்கு அது ஆலயத்தைக் குறிக்கிறது; சாதாரண வாசகருக்குத் தெளிவாக ‘இந்த ஆலயம்’ என வழங்கப்பட்டுள்ளது.
- source_word: לְשֵׁם יְהוָה
  choice: யெகோவாவின் பெயருக்காக
  rationale: ஆலயம் தேவனை அடைத்து வைக்கும் இடம் என்ற எண்ணத்தைத் தவிர்த்து, ‘பெயருக்காக’ என்ற உடன்படிக்கைச் சொல்லாட்சியை அப்படியே காக்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இணைப்புச் சொல்லமைப்பை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: தெய்வீகப் பெயர் יְהוָה-வை வழங்குதல்
  choice: யெகோவா
  alternative: கர்த்தர் / யாவே
  rationale: மூலத்தில் வரும் தனிப்பெயரை பொதுப் பட்டமாக மாற்றாமல் பெயராகவே தருகிறது; ‘யெகோவா’ நவீன தமிழ் வேதாகமப் பயன்பாட்டில் அறிமுகமான வடிவம்.
- issue: לְשֵׁם יְהוָה என்ற ஆலயச் சொல்லாட்சி
  choice: யெகோவாவின் பெயருக்காக
  alternative: யெகோவாவைக் கனப்படுத்துவதற்காக
  rationale: ‘பெயர்’ என்ற முக்கியமான வேதாகம இறையியல் சொல்லை விளக்கமாக மாற்றாமல் காக்கிறது.
- issue: הַבַּיִת என்பதன் சூழல்சார் குறிப்பு
  choice: இந்த ஆலயம்
  alternative: இந்த வீடு
  rationale: இங்கு சாலொமோன் அர்ப்பணிக்கும் கட்டிடம் ஆலயம் என்பதைக் கருத்துப்பொருள் தெளிவாகச் சொல்கிறது; அடிப்படை உருவகத்தை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகருக்குப் புரியும் வகையில் இயல்பான, கண்ணியமான நடை. வாக்கிய நீளம் கட்டுப்படுத்தப்பட்டாலும், கום வேரின் எதிரொலி, அரச வாரிசுரிமை, ‘பெயருக்காக’ என்ற இறையியல் சொல்லாட்சி ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
