  text: יְהוָ֣ה אֱלֹהִ֔ים אַל תָּשֵׁ֖ב פְּנֵ֣י מְשִׁיחֶ֑י/ךָ זָכְרָ֕/ה לְ/חַֽסְדֵ֖י דָּוִ֥יד עַבְדֶּֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
translation:
  language: ta
  text: யாவே தேவனே, உம்மால் அபிஷேகம் செய்யப்பட்டவரின் முகத்திலிருந்து திரும்பாதீர்[a][b]; உமது சேவகனாகிய தாவீதுக்குக் காட்டிய உமது நிலையான அன்பை நினைவுகூரும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மால் அபிஷேகம் செய்யப்பட்டவரை நிராகரிக்காதீர்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “உம்மால் அபிஷேகம் செய்யப்பட்டவரின் முகத்தைத் திருப்பாதீர்.”
    reason: lexical_alternative
  - marker: b
    text: “உம்மால் அபிஷேகம் செய்யப்பட்டவர்” என்பதை “உமது மேசியா” என்றும், இச்சூழலில் “உமது அரசர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “உமது சேவகனாகிய தாவீதுக்குக் காட்டிய இரக்கங்களை நினைவுகூரும்” அல்லது “தாவீதுக்கான உமது உடன்படிக்கை உண்மைத்தன்மையை நினைவுகூரும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவனே
  rationale: உடன்படிக்கையின் இறைப்பெயரான יהוה என்பதை ‘யாவே’ என்று ஒலிபெயர்த்து, அதைத் தொடரும் பொதுவான இறைப் பட்டமான אֱלֹהִים என்பதை ‘தேவன்’ என்று நேரடி அழைப்பில் இயல்பாக வழங்குகிறது.
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: முகத்தைத் திருப்பிவிடாதீர்
  rationale: שוב என்பதன் காரணவினை வடிவத்தையும் ‘முகம்’ என்ற எபிரெய உருவகத்தையும் காக்கிறது. சூழலில் இதன் பொருள் ‘நிராகரிக்காதீர்’ என்பதாக இருக்கலாம்; அதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: מְשִׁיחֶךָ
  choice: உம்மால் அபிஷேகம் செய்யப்பட்டவர்
  rationale: இந்த அரச வேண்டுதலில் சொல் முதன்மையாக இறைவனால் அபிஷேகம் செய்யப்பட்ட அரசரைக் குறிக்கிறது. ‘மேசியா’ என்று நேரடியாகத் தலைப்பாக்காமல், மூலச் சொல்லின் பொருளையும் அதன் பரந்த இறையியல் எதிரொலியையும் காக்கிறது.
- source_word: זָכְרָה
  choice: நினைவுகூரும்
  rationale: உயர்மரியாதையுடன் இறைவனை நோக்கிச் சொல்லப்படும் வேண்டுதல் ஏவல் வடிவமாகவும், உடன்படிக்கை வேண்டுதலின் கண்ணியமான நடையுடனும் வழங்கப்பட்டுள்ளது.
- source_word: לְחַסְדֵי דָּוִיד
  choice: தாவீதுக்குக் காட்டிய உடன்படிக்கைப் பேரன்பை
  rationale: חֶסֶד என்பதன் நிலையான அன்பு, விசுவாசம், இரக்கம் ஆகிய உடன்படிக்கை சார்ந்த பொருள் வளத்தை ‘உடன்படிக்கைப் பேரன்பு’ வெளிப்படுத்துகிறது. לְ இங்கு தாவீதைப் பயனாளியாகப் புரிந்துகொள்ளும் வாசிப்பை முதன்மை உரை ஏற்கிறது; மூலத்தின் சுருக்கமான அமைப்பிலுள்ள வேறு சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: דָּוִיד עַבְדֶּךָ
  choice: உமது பணியாளனாகிய தாவீது
  rationale: עֶבֶד இங்கு இறைவனுக்கு முன்பாகத் தாவீதின் கீழ்ப்படிதலான நிலையைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பாகவும் தவறான சமூகப் பொருள் வராமலும் ‘பணியாளர்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: מְשִׁיחֶךָ என்பதன் அரச மற்றும் மேசிய எதிரொலி
  choice: உம்மால் அபிஷேகம் செய்யப்பட்டவர்
  alternative: உமது மேசியா; உமது அரசர்
  rationale: உடனடிச் சூழல் தாவீதிய அரசரைச் சுட்டினாலும், இந்தச் சொல் பின்னாளில் ‘மேசியா’ என்ற தலைப்பாகவும் பயன்படுகிறது. முதன்மை மொழிபெயர்ப்பு உடனடிச் சூழலை மீறி கிறிஸ்தியல் அடையாளத்தைத் திணிக்காமல் இரு நிலைகளுக்கும் இடமளிக்கிறது.
- issue: חַסְדֵי דָּוִיד என்பதன் தொடர்பு
  choice: தாவீதுக்குக் காட்டிய உடன்படிக்கைப் பேரன்பு
  alternative: தாவீதின்மேல் காட்டிய இரக்கங்கள்; தாவீதின் உண்மையுள்ள செயல்கள்
  rationale: இந்த எபிரெயத் தொடர் சுருக்கமானதும் இலக்கண ரீதியாக ஒன்றுக்கு மேற்பட்ட புரிதல்களுக்கு இடமளிப்பதும் ஆகும். சூழலில் கடவுள் தாவீதிடம் காட்டிய உடன்படிக்கை விசுவாசத்தை நினைவுகூர வேண்டுவது இயல்பான வாசிப்பு; ஆயினும் ‘தாவீதின் உண்மையுள்ள செயல்கள்’ என்ற சாத்தியத்தை அடிக்குறிப்பு மறைக்கவில்லை.
translation_notes:
  register: நடை நவீனத் தரத் தமிழில் கண்ணியமான ஜெப மொழியாக அமைக்கப்பட்டுள்ளது. இறைவனை நோக்கிய மரியாதைப் பன்மை ஒருமுறையாகப் பேணப்பட்டுள்ளது. ‘முகத்தைத் திருப்புதல்’ என்ற எபிரெயக் கவித்துவ உருவகம் முதன்மை உரையில் காக்கப்பட்டு, அதன் கருத்துசார் மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
