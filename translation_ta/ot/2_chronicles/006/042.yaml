revisions:
- from: யாவே தேவனே, உம்மால் அபிஷேகம் செய்யப்பட்டவரின் முகத்தைத் திருப்பிவிடாதீர்[a][b]; உமது பணியாளனாகிய தாவீதுக்குக் காட்டிய உடன்படிக்கைப் பேரன்பை நினைவுகூரும்[c].
  to: யாவே தேவனே, உம்மால் அபிஷேகம் செய்யப்பட்டவரின் முகத்திலிருந்து திரும்பாதீர்[a][b]; உமது சேவகனாகிய தாவீதுக்குக் காட்டிய உமது நிலையான அன்பை நினைவுகூரும்[c].
  rationale: The revision removes a syntactic ambiguity in the first petition, retains the Hebrew image of the anointed one’s ‘face,’ and gives ‘reject’ as an interpretive alternative. It renders חֶסֶד with a direct, natural equivalent in the text and confines the covenantal nuance to a valid alternative note. It also replaces an implausible footnote alternative with readings that reflect the Hebrew expression and its prayer context.
