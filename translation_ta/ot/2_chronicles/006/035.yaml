review_pass:
  verdict: revise
  source_fidelity: The main rendering faithfully conveys the petitionary force of וְשָׁמַעְתָּ, the heavenly source, the paired nouns for prayer and plea, and the judicial outcome expressed by וְעָשִׂיתָ מִשְׁפָּטָם. However, the footnote's final literal quotation uses the singular imperative “செய்,” which is inconsistent with the respectful second-person form used in the verse and is needlessly abrupt in a note about prayer addressed to God.
  naturalness: The verse is natural modern standard Tamil and suitably dignified. “விண்ணப்பம்” and “இரக்கத்திற்கான வேண்டுதல்” clearly distinguish the two Hebrew terms. “நீதி வழங்கும்” is idiomatic, though it slightly selects the justice sense within the semantic range of מִשְׁפָּט; the alternatives preserve the broader legal/cause nuance.
  terminology: “பரலோகம்,” “விண்ணப்பம்,” and “நீதி” are appropriate in this register. The respectful imperative should be maintained consistently in the footnote. “நியாயத்தைச் செயல்படுத்தும்” is understandable but somewhat less idiomatic than “நியாயத்தை நிறைவேற்றும்.”
  issues:
  - severity: low
    issue: Footnote literal rendering has an informal singular imperative.
    rationale: The source verb is 2ms, but Tamil prayer register requires respectful address. The main text uses “வழங்கும்”; the footnote should likewise read “செய்யும்” (or another respectful equivalent), not “செய்.”
  - severity: low
    issue: One footnote alternative is stylistically stiff.
    rationale: “அவர்களுடைய நியாயத்தைச் செயல்படுத்தும்” is intelligible but less natural Tamil for the judicial sense. “அவர்களுடைய நியாயத்தை நிறைவேற்றும்” is clearer while retaining the lexical alternative.
