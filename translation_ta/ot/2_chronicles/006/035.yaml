  text: וְ/שָׁמַעְתָּ֙ מִן הַ/שָּׁמַ֔יִם אֶת תְּפִלָּתָ֖/ם וְ/אֶת תְּחִנָּתָ֑/ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/035.yaml
  text: then hear from heaven their prayer and their plea for favor[a], and maintain their cause.
translation:
  language: ta
  text: அப்போது பரலோகத்திலிருந்து அவர்களுடைய விண்ணப்பத்தையும் இரக்கத்திற்கான வேண்டுதலையும் கேட்டு, அவர்களுக்கு நீதி வழங்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய வழக்கை ஆதரித்தருளும்” அல்லது “அவர்களுடைய நியாயத்தை நிறைவேற்றும்.” எபிரெயத்தில் சொல்லுக்கு சொல், “அவர்களுடைய நீதி/நியாயத்தைச் செய்யும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: அப்போது ... கேட்டு
  rationale: இது வடிவில் இறந்தகால வினையாக இருந்தாலும், சாலொமோன் தேவனிடம் ஏறெடுக்கும் வேண்டுதலின் தொடரில் வேண்டுகோள் பொருளைக் கொண்டுள்ளது. முந்தைய நிபந்தனைச் சூழலுடனான தொடர்பை ‘அப்போது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִן הַשָּׁמַיִם
  choice: பரலோகத்திலிருந்து
  rationale: எபிரெயச் சொல் வடிவில் பன்மையாக இருந்தாலும், தேவன் கேட்கும் இடத்தைக் குறிக்கும் இவ்வழக்கில் நவீனத் தமிழில் ‘பரலோகம்’ இயல்பான ஒருமைச் சமமானது.
- source_word: תְּפִלָּתָם
  choice: அவர்களுடைய விண்ணப்பம்
  rationale: תְּפִלָּה என்பது பொதுவாக ஜெபம் அல்லது விண்ணப்பத்தைக் குறிக்கிறது. தேவனிடம் முன்வைக்கப்படும் கோரிக்கை என்ற இச்சூழலில் ‘விண்ணப்பம்’ தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: תְּחִנָּתָם
  choice: அவர்களுடைய இரக்கத்திற்கான வேண்டுதல்
  rationale: תְּחִנָּה என்பது இரக்கம் அல்லது தயவு நாடும் தீவிர வேண்டுதலைக் குறிக்கிறது. ‘இரக்கத்திற்கான வேண்டுதல்’ அந்த நுணுக்கத்தை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: அவர்களுக்கு நீதி வழங்கும்
  rationale: சொல்லுக்கு சொல் ‘அவர்களுடைய நீதி/நியாயத்தைச் செய்’ என்பதாகும். இங்கு தேவன் அவர்கள் சார்பாக நீதியுடன் செயல்பட வேண்டும் என்னும் நீதித்துறை சார்ந்த கருத்தை ‘அவர்களுக்கு நீதி வழங்கும்’ இயல்பாகத் தெரிவிக்கிறது; மாற்று வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: ஜெபத்திற்கான இறைப் பதிலை நீதித்துறை மொழியில் மொழிபெயர்த்தல்
  choice: அவர்களுக்கு நீதி வழங்கும்
  alternative: அவர்களுடைய வழக்கை ஆதரித்தருளும்; அவர்களுடைய நியாயத்தைச் செயல்படுத்தும்
  rationale: מִשְׁפָּט என்பது நீதி, தீர்ப்பு, உரிமை அல்லது வழக்கு எனப் பலவாறு பொருள்படலாம். தேவன் வெறுமனே கேட்பதல்ல, அவர்கள் சார்பாக நீதியுடன் செயல்படுவதும் இங்கு வேண்டப்படுகிறது. முதன்மை உரை இயல்பான தமிழைத் தருகிறது; எபிரெயத்தின் உண்மையான பொருள் விரிவை அடிக்குறிப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனை நோக்கிய வேண்டுகோள் என்பதால் மரியாதை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது; அரிதான சமயச் சொற்களைத் தவிர்த்து, எபிரெய நீதித்துறைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
