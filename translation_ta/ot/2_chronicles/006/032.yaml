source:
  edition: WLC
  text: וְ/גַ֣ם אֶל הַ/נָּכְרִ֗י אֲ֠שֶׁר לֹ֥א מֵ/עַמְּ/ךָ֣ יִשְׂרָאֵל֮ הוּא֒ וּ/בָ֣א מֵ/אֶ֣רֶץ רְחוֹקָ֗ה לְמַ֨עַן שִׁמְ/ךָ֤ הַ/גָּדוֹל֙ וְ/יָדְ/ךָ֣ הַ/חֲזָקָ֔ה וּֽ/זְרֽוֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥אוּ וְ/הִֽתְפַּלְל֖וּ אֶל הַ/בַּ֥יִת הַ/זֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
translation:
  language: ta
  text: மேலும், உமது மக்களாகிய இஸ்ரவேலைச் சேர்ந்தவனல்லாத ஓர் அந்நியன், உமது மகத்தான பெயர், உமது வலிமைமிக்க கரம், நீட்டப்பட்ட உமது புயம் ஆகியவற்றின் காரணமாகத் தொலைதூர நாட்டிலிருந்து வரும்போது, அவர்கள் வந்து[a] இந்த இல்லத்தை நோக்கி[b] மன்றாடினால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘அந்நியன் ... வருகிறான்’ என்ற ஒருமையிலிருந்து ‘அவர்கள் வந்து மன்றாடுகிறார்கள்’ என்ற பன்மைக்கு மாறுகிறது. ஓர் அந்நியனைப் பிரதிநிதியாகக் கொண்டு அத்தகைய அனைவரையும் பொதுவாகச் சுட்டுவதாக இது இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘இந்த இல்லத்துக்கு’. இங்கு பயன்படுத்தப்பட்டுள்ள எபிரெய முன்னிடைச்சொல்லை அவ்வாறு நேரடியாகவும் மொழிபெயர்க்கலாம்; ஆனால் இந்த ஜெபச் சூழலில் ‘இந்த இல்லத்தை நோக்கி’ என்ற திசைப் பொருளே பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: ஓர் அந்நியன்
  rationale: இச்சொல் வெறுமனே அறிமுகமில்லாத ஒருவரை அல்ல, இஸ்ரவேல் மக்களைச் சேராத வேறு இனத்தவரைக் குறிக்கிறது. ‘அந்நியன்’ அந்த வேறுபாட்டைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: உமது மக்களாகிய இஸ்ரவேலைச் சேர்ந்தவனல்லாத
  rationale: அந்நியன் தேவனுடைய மக்களாகிய இஸ்ரவேலைச் சேர்ந்தவன் அல்ல என்ற உறவுசார் வேறுபாட்டைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: தொலைதூர நாட்டிலிருந்து வரும்போது
  rationale: אֶרֶץ רְחוֹקָה என்பதன் இடவியல் பொருளை இயல்பான நவீன தமிழில் தருகிறது; தொடரும் வேண்டுதலோடு இணைவதற்காக வினை நிபந்தனைச் சூழலில் அமைக்கப்பட்டுள்ளது.
- source_word: לְמַעַן שִׁמְךָ הַגָּדוֹל
  choice: உமது மகத்தான பெயர் ... ஆகியவற்றின் காரணமாக
  rationale: לְמַעַן இங்கு அந்நியன் வருவதற்கான காரணம் அல்லது தூண்டுதலைக் குறிக்கிறது. ‘பெயர்’ என்பது தேவனுடைய புகழையும் வெளிப்படுத்தப்பட்ட அடையாளத்தையும் உள்ளடக்கும் வேதாகமச் சொல்லாட்சியாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְיָדְךָ הַחֲזָקָה
  choice: உமது வலிமைமிக்க கரம்
  rationale: தேவனுடைய வல்லமையான செயலைச் சித்தரிக்கும் மூலமொழியின் உருவகத்தைச் சுருக்காமல் தக்கவைக்கிறது.
- source_word: וּזְרֹעֲךָ הַנְּטוּיָה
  choice: நீட்டப்பட்ட உமது புயம்
  rationale: தேவ வல்லமை செயல்படுவதைச் சித்தரிக்கும் தெளிவான மனிதவுருவ மொழியை அப்படியே பாதுகாக்கிறது.
- source_word: וּבָאוּ וְהִתְפַּלְלוּ
  choice: அவர்கள் வந்து ... மன்றாடினால்
  rationale: ‘மன்றாடு’ என்பது தேவனை நோக்கிச் செய்யப்படும் விண்ணப்ப ஜெபத்தை இயல்பாக வெளிப்படுத்துகிறது. எபிரெயத்தில் ஒருமையிலிருந்து பன்மைக்கு ஏற்படும் மாற்றமும் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: இந்த இல்லத்தை நோக்கி
  rationale: אֶל என்பதன் திசைநோக்குப் பொருளை ‘நோக்கி’ தெரிவிக்கிறது. בַּיִת என்பதன் அடிப்படைப் பொருளையும் தேவனுடைய இல்லம் என்ற வேதாகமப் பின்னணியையும் ‘இல்லம்’ பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அந்நியன் ... வரும்போது’ என்ற ஒருமையிலிருந்து ‘அவர்கள் வந்து’ என்ற பன்மைக்கு மாறுதல்
  choice: மூல எபிரெயத்தின் ஒருமை–பன்மை மாற்றத்தைத் தமிழிலும் வெளிப்படையாகப் பாதுகாத்தல்
  alternative: ‘அவன் வந்து மன்றாடினால்’ அல்லது ‘அந்நியர்கள் வந்து மன்றாடினால்’ என்று முழுவதையும் ஒரே எண்ணில் அமைத்தல்
  rationale: மூலத்தில் הַנָּכְרִי மற்றும் וּבָא ஒருமையிலும், וּבָאוּ மற்றும் וְהִתְפַּלְלוּ பன்மையிலும் உள்ளன. இது ஓர் அந்நியனைப் பிரதிநிதி நிகழ்வாக முன்வைத்து, பின்னர் அத்தகையவர்களைப் பொதுவாகக் குறிப்பிடக்கூடும்; இதை அமைதியாக ஒரே எண்ணாக மாற்றாமல் பாதுகாக்கப்பட்டுள்ளது.
- issue: தேவனுடைய வல்லமையை விவரிக்கும் மனிதவுருவ மொழி
  choice: ‘வலிமைமிக்க கரம், நீட்டப்பட்ட புயம்’ என உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உமது மகா வல்லமை’ என்று கருத்தை மட்டும் சுருக்கிக் கூறுதல்
  rationale: மூலத்தின் கரம்–புயம் உருவகங்கள் யாத்திராகமத்தையும் தேவனுடைய வல்லமையான செயல்களையும் நினைவூட்டும் முக்கிய வேதாகம மொழியாக இருப்பதால் அவை அபாயப்படுத்தப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும் அதேவேளையில் ஜெபத்திற்குரிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’, ‘மகத்தான’, ‘மன்றாடினால்’ ஆகிய சொற்கள் உயர்ந்த ஆனால் வழக்கிழக்காத பதிவை வழங்குகின்றன. வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியமாக இருப்பதால் இறுதியில் நிறைவுறாத தொடரமைப்பு வைக்கப்பட்டுள்ளது.
