base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
translation:
  language: ta
  text: ஒருவன் தன் அயலானுக்கு எதிராகப் பாவம் செய்தால், அவனைச் சத்தியம் செய்ய வைப்பதற்காக அவன்மேல் ஒரு சத்தியம்[a] சுமத்தப்பட்டு, அவன் இந்த இல்லத்திலுள்ள உமது பலிபீடத்தின் முன் வந்து சத்தியம் செய்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாபநிபந்தனையுள்ள சத்தியம்.” பொய்யாகச் சத்தியம் செய்தால் சாபம் நேரும் என்ற நிபந்தனையுடன் கூடிய சத்தியத்தை எபிரேயச் சொல் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֶחֱטָא אִישׁ
  choice: ஒருவன் … பாவம் செய்து … வந்தால்
  rationale: எபிரேய நிபந்தனைத் தொடரை இயல்பான தமிழ் நிபந்தனை அமைப்பில் வழங்குகிறது; חטא என்பதன் அறநெறி மற்றும் இறைநெறி சார்ந்த வலிமையை ‘பாவம்’ காக்கிறது.
- source_word: לְרֵעֵהוּ
  choice: தன் அயலானுக்கு எதிராக
  rationale: רֵעַ என்பது அயலான், சக மனிதன் அல்லது தோழன் எனப் பொருள்படலாம்; இங்கு சமூக உறவில் செய்யப்படும் குற்றத்தை ‘அயலான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: அவன்மேல் ஓர் ஆணை சுமத்தப்பட்டு
  rationale: நீதிசார் சூழலில் ஒருவர்மேல் ஆணை அல்லது சாபத்துடன் கூடிய ஆணையைச் சுமத்தும் எபிரேய மரபுத்தொடரைப் பிரதிபலிக்கிறது.
- source_word: לְהַאֲלֹתוֹ
  choice: அவனை ஆணையிடச் செய்வதற்காக
  rationale: אלה வினையின் காரணவினை வடிவத்தைத் தனியாகக் காத்து, அவனை ஆணை கூறச் செய்வதைக் குறிப்பிடுகிறது.
- source_word: וּבָא אָלָה
  choice: அந்த ஆணை … முன் வந்தால்
  rationale: எபிரேயத்தில் ‘ஆணை’ என்பதே בוא வினையின் வெளிப்படையான எழுவாய்; ஆகவே ஒருவன் வருகிறான் என்று மாற்றாமல் அதன் இலக்கண அமைப்பைக் காக்கிறது.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: உமது பலிபீடத்திற்கு முன்
  rationale: தேவனுடைய பலிபீடத்தின் முன்னிலையில் நடைபெறும் நீதிசார் செயலை நேரடியாக வழங்குகிறது.
- source_word: בַּבַּיִת הַזֶּה
  choice: இந்த இல்லத்தில்
  rationale: בַּיִת என்பதன் ‘வீடு/இல்லம்’ என்ற உருவக மற்றும் இறையியல் ஒலியை காக்கிறது; ஆலயச் சூழலில் ‘இல்லம்’ கண்ணியமாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: אָלָה என்பதன் நீதிசார் பொருள்
  choice: முதன்மை உரையில் ‘ஆணை’ என்று வழங்கி, சாப நிபந்தனை சார்ந்த பொருளை அடிக்குறிப்பில் காத்தல்
  alternative: சாபம்; சாப ஆணை
  rationale: இச்சொல் பொய்யாணை கூறினால் சாபத்தை வரவழைக்கும் நீதிசார் ஆணையைக் குறிக்கக்கூடும். ‘சாபம்’ மட்டும் என்றால் ஆணையிடும் நடைமுறை மறையும்; ‘ஆணை’ மட்டும் என்றால் சாப நிபந்தனை மங்கும். ஆகவே இரு கூறுகளும் உரை மற்றும் அடிக்குறிப்பின் வழியாகக் காக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேயத்தின் இரண்டு தனித்தனி ஆணைச் சொற்றொடர்களும் சுருக்கப்படாமல் காக்கப்பட்டுள்ளன; வசனம் அடுத்த வசனத்தில் நிறைவடைவதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
