  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣יד אָבִ֑/י וּ/בְ/יָדָ֥י/ו מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
translation:
  language: ta
  text: 'அவர் கூறினார்: “இஸ்ரவேலின் கடவுளாகிய யாவே போற்றப்படுவாராக! அவர் என் தந்தை தாவீதிடம் தம் வாயால் சொன்னதைத் தம் கையால் நிறைவேற்றி, இவ்வாறு கூறினார்:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் கூறியது
  rationale: சாலொமோனின் உரையை அறிமுகப்படுத்தும் எபிரெய வழக்கமான தொடர் வினை வடிவத்தை இயல்பான தமிழ் கதைநடையில் தருகிறது.
- source_word: בָּרוּךְ
  choice: வாழ்த்தப்படுவாராக
  rationale: கடவுளை நோக்கிய உயரிய வாழ்த்துரை. எபிரெய செயல்பாட்டு எச்சத்தின் வாழ்த்துப் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இஸ்ரவேலுடன் யாவே கொண்டுள்ள உறவைச் சுட்டும் இணைப்புத் தொடரை நேரடியாகத் தருகிறது.
- source_word: דִּבֶּר בְּפִיו
  choice: தம் வாயால் சொன்னதை
  rationale: ‘வாய்’ என்ற உடலுருவகத்தை விடாமல் வைத்து, அடுத்து வரும் ‘கை’ என்பதுடனான திட்டமிட்ட இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: אֵת דָּוִיד אָבִי
  choice: என் தந்தை தாவீதிடம்
  rationale: இங்கு தாவீது இறைவாக்கைப் பெற்றவராக இருப்பதால், தமிழில் முகவரைக் குறிக்கும் ‘-இடம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: தம் கையால் நிறைவேற்றி
  rationale: சொல்லுக்கும் செயலுக்கும் இடையிலான இணை அமைப்பைத் தக்கவைக்கிறது; மறைந்திருக்கும் செயப்படுபொருள் தமிழில் முந்தைய ‘சொன்னதை’ என்பதுடன் இணைக்கப்படுகிறது.
- source_word: לֵאמֹר
  choice: இவ்வாறு கூறினார்
  rationale: அடுத்த வசனத்தில் வரும் இறைவாக்கை அறிமுகப்படுத்தும் மேற்கோள் வடிவத்தை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: கடவுளின் ‘வாய்’ மற்றும் ‘கை’ பற்றிய மனித உருவக மொழி
  choice: தம் வாயால்… தம் கையால்
  alternative: சொன்னதை… செயல்படுத்தி
  rationale: மூலத்தின் உருவகத்தையும், கடவுள் சொன்னதற்கும் அதைச் செய்ததற்கும் இடையிலான திட்டமிட்ட இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘தம்’ என்ற மரியாதைத் தற்சுட்டுப் பெயர் கடவுளைக் குறிக்கிறது; ‘வாய்—கை’ இணைப்பு செயற்கையாகத் தோன்றினாலும் மூலத்தின் முக்கியமான கவித்துவ மற்றும் இறையியல் அமைப்பைப் பாதுகாப்பதற்காக வைக்கப்பட்டுள்ளது.
