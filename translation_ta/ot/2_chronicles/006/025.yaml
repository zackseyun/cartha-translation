source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵׁיבוֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לָ/הֶ֖ם וְ/לַ/אֲבֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
translation:
  language: ta
  text: அப்போது நீர் வானத்திலிருந்து கேட்டு, உமது மக்கள் இஸ்ரவேலின் பாவத்தை மன்னித்து, அவர்களுக்கும் அவர்களுடைய தந்தையருக்கும் நீர் கொடுத்த நாட்டிற்கு அவர்களைத் திரும்பக் கொண்டுவருவீராக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: கேட்பீராக
  rationale: שׁמע என்பதன் அடிப்படைப் பொருளான ‘கேள்’ என்பதைத் தக்கவைக்கிறது. ஜெபச் சூழலில் கவனித்துக் கேட்டு மறுமொழி அளிப்பது உட்பொருளாக இருந்தாலும், அதை வெளிப்படையாகச் சேர்க்கவில்லை. எபிரெய இறந்தகாலமல்லாத வினைவடிவின் வேண்டுதல்/எதிர்கால நுட்பத்தை ‘கேட்பீராக’ வெளிப்படுத்துகிறது.
- source_word: מִן הַשָּׁמַיִם
  choice: பரலோகத்திலிருந்து
  rationale: எபிரெயத்தில் வடிவம் பன்மையாக இருந்தாலும், கடவுளின் உறைவிடத்தைக் குறிக்கும் இச்சூழலில் நவீன தமிழின் இயல்பான ஒருமைச் சொல் ‘பரலோகம்’ ஆகும்.
- source_word: סָלַחְתָּ
  choice: மன்னித்து
  rationale: סלח என்பது கடவுள் பாவத்தை மன்னிப்பதற்கான வழக்கமான வினைச்சொல்; ‘மன்னி’ என்பது தெளிவான நவீனத் தமிழ் இணைச்சொல்.
- source_word: לְחַטַּאת
  choice: பாவத்தை
  rationale: மூலத்தில் ஒருமையாக உள்ள חַטָּאת இங்கு இஸ்ரவேலின் குற்றத்தை ஒட்டுமொத்தமாகக் குறிக்கிறது. ‘பாவத்தை’ ஒருமையையும் சமயச் சூழலையும் தக்கவைக்கிறது.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேல்
  rationale: உடன்படிக்கை உறவைக் குறிக்கும் ‘உமது மக்கள்’ என்பதையும் ‘இஸ்ரவேல்’ என்ற பெயரையும் இயல்பான தமிழ் தொடரில் தக்கவைக்கிறது.
- source_word: וַהֲשֵׁיבוֹתָם
  choice: அவர்களைத் திரும்பக் கொண்டுவருவீராக
  rationale: 'שׁוב என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருள் உடையது: கடவுள் அவர்களைத் திரும்பச் செய்கிறார். ‘திரும்பக் கொண்டுவரு’ அந்தக் காரணவினைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.'
- source_word: אֶל הָאֲדָמָה
  choice: நாட்டுக்கு
  rationale: உடன்படிக்கை மற்றும் தேசியச் சூழலில் אֲדָמָה வெறும் மண்ணையல்ல, இஸ்ரவேலுக்குக் கொடுக்கப்பட்ட நாட்டைக் குறிக்கிறது.
- source_word: אֲשֶׁר נָתַתָּה לָהֶם וְלַאֲבֹתֵיהֶם
  choice: நீர் அவர்களுக்கும் அவர்களுடைய தந்தையருக்கும் கொடுத்த
  rationale: ‘அவர்களுக்கு’ மற்றும் ‘அவர்களுடைய தந்தையருக்கு’ என்ற இரண்டு பெறுநர்களையும் மூலத்தின் அமைப்புப்படி வெளிப்படுத்துகிறது; தற்போதைய தலைமுறைக்கும் முந்தைய தந்தையருக்கும் இடையிலான உடன்படிக்கைத் தொடர்ச்சியையும் தக்கவைக்கிறது.
theological_decisions:
- issue: தִּשְׁמַע மற்றும் தொடரும் வினைகளின் வேண்டுதல்/எதிர்கால நுட்பம்
  choice: கேட்பீராக … மன்னித்து … திரும்பக் கொண்டுவருவீராக
  alternative: கேட்பீர் … மன்னிப்பீர் … திரும்பக் கொண்டுவருவீர்
  rationale: இது சாலொமோனின் ஜெபத்தில் வரும் வேண்டுகோள் என்பதால், ‘-வீராக’ வடிவம் வேண்டுதலின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது. அதேவேளையில், எபிரெய வடிவம் எதிர்கால உறுதிப்பாடாகவும் புரிந்துகொள்ளப்படக்கூடும் என்பதால் அந்த மாற்று அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- issue: אֲבֹתֵיהֶם என்பதன் மொழிபெயர்ப்பு
  choice: அவர்களுடைய தந்தையர்
  alternative: அவர்களுடைய முன்னோர்
  rationale: எபிரெயச் சொல் நேரடியாக ‘தந்தையர்’ என்று கூறுகிறது. உடன்படிக்கைத் தலைமுறைத் தொடரை மூலத்திற்கு நெருக்கமாக வைத்திருக்க முதன்மைப் பாடத்தில் அதையே பயன்படுத்தி, விரிவான பொருளான ‘முன்னோர்’ என்பதை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீன செந்தமிழில், பொதுமக்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் ஜெபத்திற்குரிய கண்ணியமான நடையைப் பயன்படுத்துகிறது. கடவுளை நோக்கி மரியாதைப் பன்மையான ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; பழமையான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
