base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: ta
  text: “இப்போது, இஸ்ரயேலின் கடவுளாகிய ஆண்டவரே[a], உமது அடியானான என் தந்தை தாவீதுக்காக, அவனிடம் நீர் சொன்னதை நிறைவேற்றும். நீர் அவனிடம், ‘உன் மகன்கள் தங்கள் வழியைக் காத்து, நீ என் முன்னிலையில் நடந்ததுபோல என் திருச்சட்டத்தின்படி நடந்தால் மட்டுமே, என் முன்னிலையில் இஸ்ரயேலின் அரியணையில் அமர உன் வம்சத்தில் ஓர் ஆண் இல்லாமல் போகமாட்டான்[b]’ என்று சொன்னீர்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆண்டவர்” என்பதற்கான எபிரேயச் சொல் יהוה (YHWH); இது இஸ்ரயேலின் கடவுளுடைய தனிப்பெயர்.
    reason: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயர் இடம்பெறுவதை வெளிப்படுத்துகிறது.
  - marker: b
    text: 'எபிரேயத்தில் சொல்லுக்குச் சொல்: “உன்னிடமிருந்து ஓர் ஆண் துண்டிக்கப்படமாட்டான்.” இது தாவீதின் அரசவழித் தொடர்ச்சி நின்றுபோகாததைக் குறிக்கும் மரபுத்தொடர்.'
    reason: எபிரேய மரபுத்தொடரின் செயலற்ற உருவகத்தையும் தமிழாக்கத்தின் பொருள் விளக்கத்தையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: יהוה
  choice: ஆண்டவர்
  rationale: தமிழில் இயல்பாகவும் கண்ணியமாகவும் பயன்படும் மரபான இறைப் பெயராக்கம்; இது எபிரேயத் தனிப்பெயர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: שְׁמֹר ... אֵת אֲשֶׁר דִּבַּרְתָּ
  choice: நீர் சொன்னதை நிறைவேற்றும்
  rationale: சொல்லுக்குச் சொல் ‘நீர் சொன்னதைக் காத்தருளும்’; இங்கு வாக்குறுதியை உண்மையாக்குதல் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: உன் வம்சத்தில் ஓர் ஆண் இல்லாமல் போகமாட்டான்
  rationale: ‘உனக்கு ஓர் ஆண் அறுபடமாட்டான்’ என்ற எபிரேய மரபுத்தொடர், தாவீதின் அரசவழித் தொடர்ச்சி நின்றுபோகாது என்பதைக் குறிக்கிறது; ‘ஓர் ஆண்’ என்பதன் பாலினக் குறிப்பும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: תּוֹרָתִי
  choice: என் திருச்சட்டம்
  rationale: תורה இங்கு கடவுள் அளித்த கட்டளையும் போதனையும் கொண்ட நியமத்தைக் குறிக்கிறது; ‘திருச்சட்டம்’ சாதாரண சட்டத்திலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: רַק אִם
  choice: நடந்தால் மட்டுமே
  rationale: வாக்குறுதியோடு இணைந்துள்ள வெளிப்படையான நிபந்தனையைத் தளர்த்தாமல் காட்டுகிறது.
theological_decisions:
- issue: தாவீதுக்கான வாக்குறுதியும் மகன்களின் கீழ்ப்படிதலும் இடையிலான உறவு
  choice: ‘நடந்தால் மட்டுமே’ என்ற நிபந்தனை வெளிப்படையாக வைக்கப்பட்டது.
  alternative: நிபந்தனையை மென்மைப்படுத்தி, வாக்குறுதியை நிபந்தனையற்றதாக ஒலிக்கச் செய்தல்.
  rationale: רַק אִם தெளிவான நிபந்தனையை அறிமுகப்படுத்துகிறது; வசனத்தின் இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு தீர்த்துவிடக் கூடாது.
- issue: ‘என் முன்னிலையில்’ என்பதன் தொடர்பு
  choice: அரியணையில் அமர்வதோடு இணைந்த நிலைப்பாட்டில் வைக்கப்பட்டது.
  alternative: ‘உன் வம்சத்தில் என் முன்னிலையிலிருந்து ஓர் ஆண் இல்லாமல் போகமாட்டான்’ என ‘இல்லாமல் போதல்’ என்பதோடு இணைத்தல்.
  rationale: எபிரேயச் சொல் வரிசையில் தொடர்பு ஓரளவு திறந்திருந்தாலும், இணை அரசவாக்குறுதி மொழிநடையும் இயல்பான பொருளும் அதை இஸ்ரயேலின் அரியணையில் கடவுள்முன் ஆட்சி செய்வதோடு இணைக்க ஆதரிக்கின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்குரிய கண்ணியமான நடையும் பொதுவாசகருக்குப் புரியும் இயல்பான சொற்றொடர்களும் பயன்படுத்தப்பட்டுள்ளன. கடவுளை நோக்கி ‘நீர்/உமது’ என்ற மரியாதை ஒருமையும், மேற்கோளிலுள்ள கடவுளின் நேரடி உரையில் தாவீதைக் குறிக்க ‘நீ/உன்’ என்பதும் வேறுபடுத்தப்பட்டுள்ளன.
