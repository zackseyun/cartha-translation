  text: בְּ/הֵעָצֵ֧ר הַ/שָּׁמַ֛יִם וְ/לֹֽא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
translation:
  language: ta
  text: வானம் அடைக்கப்பட்டு, அவர்கள் உமக்கு எதிராகப் பாவம் செய்ததால் மழை இல்லாமல் போகும்போது, அவர்கள் இந்த இடத்தை நோக்கி மன்றாடி, உமது பெயரை அறிக்கையிட்டு, நீர் அவர்களுக்குப் பதிலளிப்பதால்[a] தங்கள் பாவத்தை விட்டு விலகினால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் அவர்களைத் துன்புறுத்துவதால்” அல்லது “நீர் அவர்களைத் தாழ்த்துவதால்.” சூழலைப் பொறுத்து எபிரெயச் சொல் இவ்வாறும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  choice: வானம் அடைக்கப்பட்டு ... போகும்போது
  rationale: நிபால் வினையெச்சமும் בְ முன்னொட்டும் காலச் சூழலைக் குறிக்கின்றன. ‘வானம் அடைக்கப்படுதல்’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: மழை இல்லாமல் போகும்போது
  rationale: மழை பெய்யாத நிலையை இயல்பான தமிழில் தெரிவிக்கிறது; முந்திய காலத் துணைவாக்கியத்தோடு இணைக்கப்பட்டுள்ளது.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: அவர்கள் உமக்கு எதிராகப் பாவம் செய்ததால்
  rationale: כִּי இங்கு காரணத்தைக் குறிக்கிறது; לָךְ பாவம் தேவனுக்கு எதிரானது என்பதைத் தெரிவிக்கிறது.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: அவர்கள் இந்த இடத்தை நோக்கி மன்றாடி
  rationale: אֶל என்பது இங்கு மன்றாட்டின் திசையைக் குறிக்கிறது; அந்த இடத்தையே நோக்கி மன்றாடுவதாகக் காட்டுகிறது, அதனிடமே மன்றாடுவதாக அல்ல.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: உமது பெயரை அறிக்கையிட்டு
  rationale: ידה என்பதற்கு அறிக்கையிடுதல், போற்றுதல், நன்றி செலுத்துதல் ஆகிய பொருள் நிழல்கள் உண்டு. மனந்திரும்புதல் சார்ந்த இச்சூழலில் ‘பெயரை அறிக்கையிடுதல்’ பொருத்தமானது; மூலத்தின் ‘பெயர்’ அப்படியே தக்கவைக்கப்படுகிறது.
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  choice: தங்கள் பாவத்தைவிட்டு விலகினால்
  rationale: שוב + מן என்பதன் ‘விட்டு விலகுதல்/திரும்புதல்’ உருவகத்தைத் தக்கவைத்து, மனந்திரும்புதலை விளக்கவுரையாக்காமல் தெரிவிக்கிறது.
- source_word: כִּי תַעֲנֵם
  choice: நீர் அவர்களுக்குப் பதிலளிப்பதால்
  rationale: மசோரா உயிர்க்குறியீடு செய்யப்பட்ட வடிவம் ‘பதிலளி’ என்ற வாசிப்பை ஆதரிக்கிறது. כִּי காரண உறவாக மொழிபெயர்க்கப்பட்டுள்ளது; வேறு சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள ענה என்பதன் பொருள்
  choice: நீர் அவர்களுக்குப் பதிலளிப்பதால்
  alternative: நீர் அவர்களைத் துன்புறுத்துவதால் / தாழ்த்துவதால்
  rationale: மசோரா உயிர்க்குறியீடும் மன்றாட்டைத் தொடர்ந்து வரும் சூழலும் ‘பதிலளித்தல்’ என்ற வாசிப்பை ஆதரிக்கின்றன. ஆயினும், அதே மெய்யெழுத்து வடிவத்துடன் தொடர்புடைய ‘துன்புறுத்துதல்/தாழ்த்துதல்’ என்ற வாசிப்பு மனந்திரும்புதலுக்கான காரணமாகப் புரிந்துகொள்ளப்படலாம்; எனவே அந்தத் தத்துவார்த்த பதற்றம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்துக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனை நோக்கிய மரியாதை ஒருமை (‘உமக்கு’, ‘உமது’, ‘நீர்’) பயன்படுத்தப்பட்டுள்ளது. இவ்வசனம் அடுத்த வசனத்தில் தொடரும் நிபந்தனை வாக்கியம் என்பதால் முடிவில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
