source:
  edition: WLC
  text: כִּ֣י יֶחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֧וּ/ם שׁוֹבֵי/הֶ֛ם אֶל אֶ֥רֶץ רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
translation:
  language: ta
  text: அவர்கள் உமக்கு எதிராகப் பாவம் செய்யும்போது[a]—பாவம் செய்யாத மனிதர் எவரும் இல்லை—நீர் அவர்கள்மேல் கோபங்கொண்டு, அவர்களை ஓர் எதிரியின் கையில் ஒப்புக்கொடுத்து, அவர்களைச் சிறைப்பிடித்தவர்கள் அவர்களைத் தொலைவிலோ அருகிலோ உள்ள ஒரு நாட்டுக்குக் கொண்டுபோனால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் உமக்கு எதிராகப் பாவம் செய்தால்.”
    reason: தொடக்க எபிரெயச் சொல் காலச்சூழலாகவும் நிபந்தனையாகவும் புரிந்துகொள்ளப்படலாம்.
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: அவர்கள் உமக்கு எதிராகப் பாவம் செய்யும்போது
  rationale: தொடக்க כִּי இங்கு நிபந்தனைச் சூழலை அறிமுகப்படுத்துகிறது; அடுத்துவரும் மனிதப் பாவத்தன்மை குறித்த கூற்று இதை நிகழக்கூடிய உண்மை நிலையாகக் காட்டுவதால், தமிழில் ‘செய்யும்போது’ இயல்பாக உள்ளது. לָךְ உறவுசார் குற்றத்தைச் சுட்டுவதால் ‘உமக்கு எதிராக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: பாவம் செய்யாத மனிதர் எவரும் இல்லை
  rationale: אָדָם இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. ‘மனிதர் எவரும்’ என்பது பாலினத்தைக் குறிப்பாக்காமல் மூலத்தின் பொதுப்பொருளையும் தனிநபர் வடிவத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: וְאָנַפְתָּ בָם
  choice: நீர் அவர்கள்மேல் கோபங்கொண்டு
  rationale: אנף கோபத்தைக் குறிக்கிறது. ‘கோபங்கொண்டு’ என்பது தீவிரத்தை மிகைப்படுத்தாமல் நிபந்தனைத் தொடரைத் தக்கவைக்கிறது.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: அவர்களை ஓர் எதிரியின் கையில் ஒப்புக்கொடுத்து
  rationale: נתן + לפני אויב என்பது ஒருவரை எதிரியின் அதிகாரத்துக்கு உட்படுத்துவதைக் குறிக்கிறது. தமிழில் ‘கையில் ஒப்புக்கொடுத்து’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது; எதிரியைக் குறிக்கும் எபிரெயச் சொல் ஒருமையில் வருவதால் ‘ஓர் எதிரி’ என அமைக்கப்பட்டது.
- source_word: וְשָׁבוּם שׁוֹבֵיהֶם
  choice: அவர்களைச் சிறைப்பிடித்தவர்கள் அவர்களைக் கொண்டுபோனால்
  rationale: வினைச்சொல்லும் அதே வேரிலான பெயரெச்சமும் சேர்ந்து சிறைப்பிடித்துச் செல்லுதலைக் குறிக்கின்றன. தமிழில் தேவையற்ற சொல் மீளுருவாக்கத்தைத் தவிர்த்து செயலும் செய்பவர்களும் வெளிப்படையாகத் தரப்பட்டுள்ளன.
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  choice: தொலைவிலோ அருகிலோ உள்ள ஒரு நாட்டுக்கு
  rationale: மூலத்தின் தொலைவு–அருகு முரணிணை நேரடியாகவும் இயல்பாகவும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: אָדָם என்ற பொதுமை ஒருமையும் மனிதரின் உலகளாவிய பாவத்தன்மையும்
  choice: பாவம் செய்யாத மனிதர் எவரும் இல்லை
  alternative: பாவம் செய்யாத ஆண் எவனும் இல்லை
  rationale: இங்கு אָדָם ஆண் பாலினத்தை மட்டும் குறிக்காமல் மனிதரைப் பொதுவாகக் குறிக்கிறது. ‘மனிதர் எவரும்’ மூலத்தின் உலகளாவிய கூற்றைத் துல்லியமாகத் தருகிறது; எந்தச் சமயப் பிரிவின் தனிப்பட்ட விளக்கத்தையும் சேர்ப்பதில்லை.
- issue: தொடக்க כִּי-யின் கால/நிபந்தனை நுணுக்கம்
  choice: பாவம் செய்யும்போது
  alternative: பாவம் செய்தால்
  rationale: சூழல் மனிதர்கள் பாவம் செய்வதை உண்மைச் சாத்தியமாக முன்வைப்பதால் ‘போது’ முதன்மை வாசகமாகத் தேர்ந்தெடுக்கப்பட்டது; இருப்பினும் எபிரெயத்தில் நிபந்தனைப் பொருளும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுமக்கள் எளிதில் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய உரையில் ‘நீர்/உமக்கு’ என்ற மதிப்புமிகு ஒருமை நிலை காக்கப்பட்டுள்ளது. வசனம் அடுத்த வசனத்துடன் தொடரும் நிபந்தனை அமைப்பாக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
