base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
translation:
  language: ta
  text: நாட்டில் பஞ்சமோ கொள்ளைநோயோ ஏற்பட்டால், பயிர்கள் கருகினாலோ மஞ்சளாகிப் பாழானாலோ, வெட்டுக்கிளிகளோ பயிரைத் தின்றழிக்கும் பூச்சிகளோ[a] வந்தால், அவனுடைய பகைவர்கள் அவனுடைய நகரங்கள் உள்ள நாட்டில் அவனை முற்றுகையிட்டால், எந்த வாதையோ எந்த நோயோ ஏற்பட்டாலும்—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் பயிரைத் தின்றழிக்கும் ஒரு பூச்சியைக் குறிக்கிறது; அது எந்த வகைப் பூச்சி என்பது உறுதியாகத் தெரியவில்லை. இதை ‘தின்றழிக்கும் வெட்டுக்கிளி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: பஞ்சம்
  rationale: நாடு முழுவதையும் தாக்கும் உணவுப் பற்றாக்குறையைக் குறிக்கும் பேரிடர் பட்டியலுக்குப் பொருத்தமான வழக்குச் சொல்.
- source_word: דֶּבֶר
  choice: கொள்ளைநோய்
  rationale: வேகமாகப் பரவி பலரைப் பாதிக்கும் கடுமையான தொற்றுநோயை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: שִׁדָּפוֹן
  choice: பயிர்கள் கருகுதல்
  rationale: வெப்பம் அல்லது அழிவுண்டாக்கும் காற்றால் நேரும் பயிர்ச்சேதம் என்ற மூலச்சொல்லின் வேளாண் பொருளைத் தெளிவாக்குகிறது.
- source_word: יֵרָקוֹן
  choice: பயிர்கள் மஞ்சளாகிப் பாழாதல்
  rationale: தாவரங்கள் வெளிறி அல்லது மஞ்சளாகி அழியும் நோய்நிலையை வெளிப்படுத்துகிறது; குறிப்பிட்ட பூஞ்சை நோயாக அளவுக்கு மீறி வரையறுக்கவில்லை.
- source_word: אַרְבֶּה
  choice: வெட்டுக்கிளிகள்
  rationale: திரளாக வந்து பயிர்களை அழிக்கும் locust வகைக்கு நிலையான, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: חָסִיל
  choice: பயிரைத் தின்றழிக்கும் பூச்சிகள்
  rationale: துல்லியமான உயிரின வகை உறுதியில்லாததால், அதன் அழிவூட்டும் செயலைக் காட்டும் பொதுவான மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי יָצַר לוֹ אֹיְבָיו
  choice: ஒருவனுடைய பகைவர்கள் அவனை முற்றுகையிட்டால்
  rationale: צור என்பதன் இச்சூழலிலுள்ள நெருக்குதல் அல்லது சுற்றிவளைத்தல் என்ற இராணுவப் பொருளைத் தருகிறது; எபிரெயச் சொற்றொடரின் ஒருமையையும் காக்கிறது.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: அவனது நாட்டின் வாசல்களில்
  rationale: மூலத்தின் ‘வாசல்கள்’ என்ற உருவகத்தை முதன்மை உரையில் காத்து, அது நகரங்களைக் குறிக்கும் ஆகுபெயர் என்பதை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: כָּל נֶגַע
  choice: எந்த வாதை
  rationale: அடி, பீடை, பேரிடர் போன்ற பரந்த பொருளுடைய נֶגַע என்பதற்கு, நோயுடன் இணைந்து வரக்கூடிய பரந்த தமிழ்ச் சொல்.
- source_word: כָל מַחֲלָה
  choice: எந்த நோய்
  rationale: מַחֲלָה குறிக்கும் உடல்நலக் கேட்டை எளிய நவீன தமிழில் நேரடியாகத் தருகிறது.
