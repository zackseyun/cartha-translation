  to: அப்போது பரலோகத்திலிருந்து கேட்டு, செயல்பட்டு, உமது பணியாளர்களை நியாயந்தீர்ப்பீராக. தீயவனுக்குப் பதிலளித்து, அவனுடைய நடத்தையை அவன் தலைமேல் வரச்செய்து[a], நீதிமானை நீதியுள்ளவன் எனத் தீர்ப்பளித்து[b], அவனுடைய நீதிக்குத் தக்கபடி அவனுக்குக் கொடுப்பீராக.
