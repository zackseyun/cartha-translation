  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הָשִׁ֣יב לְ/רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/023.yaml
  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
translation:
  language: ta
  text: அப்போது பரலோகத்திலிருந்து கேட்டு, செயல்பட்டு, உமது பணியாளர்களை நியாயந்தீர்ப்பீராக. தீயவனுக்குப் பதிலளித்து, அவனுடைய நடத்தையை அவன் தலைமேல் வரச்செய்து[a], நீதிமானை நீதியுள்ளவன் எனத் தீர்ப்பளித்து[b], அவனுடைய நீதிக்குத் தக்கபடி அவனுக்குக் கொடுப்பீராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “அவனுடைய வழியை அவனுடைய தலைமேல் கொடுத்து.” ஒருவருடைய நடத்தையின் விளைவு தீர்ப்பாக அவரிடமே திரும்புவதைச் சுட்டும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “நீதிமானை விடுவித்து.” இதற்கான எபிரெயச் சொல், நீதிமன்றச் சூழலில் ஒருவரைச் சரியான தரப்பில் உள்ளவர் என்று அறிவிப்பதையோ நடத்துவதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  choice: பரலோகத்திலிருந்து கேட்டு
  rationale: இறைவனை நோக்கிய மன்றாட்டில் שׁמע என்பது வெறுமனே ஒலியைக் கேட்பதல்ல, கவனித்து மறுமொழி அளிப்பதையும் உணர்த்துகிறது. மூலமொழியின் இடவுருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: וְעָשִׂיתָ
  choice: செயல்பட்டு
  rationale: பொதுவான ‘செய்’ என்ற பொருளை, இந்த நீதித்துறைச் சூழலில் தீர்மானமான இறைத் தலையீடாக இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: உமது பணியாளர்களுக்கு நீதி வழங்கும்
  rationale: שׁפט என்பதன் நீதித்துறைப் பொருளையும், இறைவனுக்குக் கீழ்ப்பட்டவர்களைக் குறிக்கும் עֲבָדֶיךָ என்பதையும் இயல்பான நவீன தமிழில் தருகிறது. ‘அடிமைகள்’ என்பது இங்கு தேவையில்லாமல் சமூக அடிமை நிலையைக் கூர்மைப்படுத்தும்.
- source_word: לְהָשִׁיב לְרָשָׁע
  choice: தீயவனுக்கு அவனுக்குத் தக்க பதிலளியும்
  rationale: שוב என்பதிலுள்ள திருப்பிச் செலுத்துதல் அல்லது கைம்மாறு செய்தல் என்ற நீதித்துறை எண்ணத்தைத் தமிழில் தெளிவாக்குகிறது; அடுத்த சொற்றொடர் மூல உருவகத்தை வெளிப்படுத்துகிறது.
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: தீயவனுடைய நடத்தையை அவனுடைய தலைமேலேயே வரச்செய்து
  rationale: דֶּרֶךְ இங்கு வாழ்க்கை நடத்தை அல்லது செயல்முறையைக் குறிக்கிறது. ‘தலைமேல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, அதன் விளைவு அவனிடமே திரும்புகிறது என்பதை உணர்த்துகிறது.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: நீதிமானை நீதியுள்ளவன் என்று தீர்ப்பளித்து
  rationale: Hiphil வடிவிலுள்ள הצדיק என்பதன் நீதிமன்றப் பொருள்—ஒருவரைச் சரியான தரப்பில் உள்ளவர் என்று அறிவித்தல்—தெளிவாகத் தரப்படுகிறது; பின்னாளைய கோட்பாட்டுச் சிறப்புப் பொருளைத் தேவையின்றி இறக்குமதி செய்யவில்லை.
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: அவனுடைய நீதிக்குத் தக்கபடி அவனுக்குக் கொடும்
  rationale: நீதிமானின் நேர்மைக்கு ஏற்ப வழங்கப்படுவதை நேரடியாகக் காக்கிறது; ‘வெகுமதி அளியும்’ என்பது சாத்தியமானாலும் சற்றே விளக்கவுரையானது.
theological_decisions:
- issue: இறைத் தீர்ப்பின் நீதிமன்றச் சார்பு
  choice: இறைவன் பணியாளர்களுக்கு நீதி வழங்கி, தீயவனுக்குப் பதிலளித்து, நீதிமானை நீதியுள்ளவன் என்று தீர்ப்பளிப்பதாக மொழிபெயர்த்தல்
  alternative: பொதுவாக ஆளுதல் அல்லது தலையிடுதல் என்று மொழிபெயர்த்தல்
  rationale: שׁפט, הצדיק ஆகிய சொற்களும் தீயவன்/நீதிமான் என்ற இணைமுரணும் தெளிவான நீதித்துறைச் சூழலைக் காட்டுகின்றன.
- issue: הצדיק என்பதன் பொருள்
  choice: நீதியுள்ளவன் என்று தீர்ப்பளித்து
  alternative: நீதிமானாக்கி அல்லது நியாயப்படுத்தி
  rationale: இங்கு சொல் ஒருவரை ஒழுக்கரீதியாக மாற்றுவதைவிட, நீதிமன்றத்தில் சரியான தரப்பில் உள்ளவர் என அறிவிப்பதைக் குறிக்கிறது. தேர்ந்த மொழிபெயர்ப்பு அந்தச் சட்டப்பொருளைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மன்றாட்டுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’, ‘கொடும்’, ‘பதிலளியும்’ ஆகிய மரியாதைமிக்க ஏவல் வடிவங்கள் இறைவனை நேரடியாக நோக்கும் சூழலைக் காக்கின்றன. நீதித்துறைத் தன்மை தெளிவாக இருந்தாலும், குறிப்பிட்ட சமயப்பிரிவின் கோட்பாட்டுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
