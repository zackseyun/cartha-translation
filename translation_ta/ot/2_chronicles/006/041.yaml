  text: וְ/עַתָּ֗ה קוּמָ֞/ה יְהוָ֤ה אֱלֹהִים֙ לְֽ/נוּחֶ֔/ךָ אַתָּ֖ה וַ/אֲר֣וֹן עֻזֶּ֑/ךָ כֹּהֲנֶ֜י/ךָ יְהוָ֤ה אֱלֹהִים֙ יִלְבְּשׁ֣וּ תְשׁוּעָ֔ה וַ/חֲסִידֶ֖י/ךָ יִשְׂמְח֥וּ בַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
translation:
  language: ta
  text: இப்போது, யாவே தேவனே, நீரும் உமது வல்லமையின் பேழையும்[a] உமது இளைப்பாறும் இடத்திற்கு எழுந்தருளும். யாவே தேவனே, உமது ஆசாரியர்கள் மீட்பை ஆடையாக அணிந்துகொள்ளட்டும்; உமக்கு உண்மையுள்ளவர்கள்[b] நன்மையில்[c] மகிழட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது ஆற்றலின் பேழை” அல்லது “உமது வலிமையின் பேழை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது பக்தர்கள்” அல்லது “உமக்குப் பற்றுறுதியுள்ளவர்கள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “நல்லதில்” அல்லது “உமது நன்மையில்.” எபிரெயத்தில் உடைமைச் சுட்டு வெளிப்படையாக இல்லை; அது ‘நன்மையில்/நல்லதில்’ என்று மட்டுமே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: உச்சக்கட்ட வேண்டுதலை அறிமுகப்படுத்தும் காலக் குறியீட்டை இயல்பான நவீனத் தமிழில் தருகிறது; வாவ் இணைப்பின் உரையாடல் தொடர்ச்சி தமிழில் தனியே ‘மேலும்’ என்று கூறாமலேயே வெளிப்படுகிறது.
- source_word: קוּמָה
  choice: எழுந்தருளும்
  rationale: தேவனை நோக்கிய ஒருமை ஏவல் வடிவத்தின் ‘எழும்’ என்ற பொருளைப் பேணுகிறது; ‘அருளும்’ இணைப்பு தமிழில் மரியாதையான வேண்டுதல் நடைக்கு ஏற்றது.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவனே
  rationale: יהוה என்ற தனிப்பெயரை ‘யாவே’ என ஒலிபெயர்த்து, אֱלֹהִים என்பதையும் நேரடி அழைப்பையும் ‘தேவனே’ எனக் காட்டுகிறது.
- source_word: לְנוּחֶךָ
  choice: உமது இளைப்பாறும் இடத்திற்கு
  rationale: இங்கு ‘இளைப்பாறுதல்’ மட்டுமன்றி சென்றடைந்து நிலைகொள்ளும் இடம் குறிக்கப்படுவதால், இடப்பொருளைத் தெளிவாகவும் நெருக்கமாகவும் தருகிறது.
- source_word: אַתָּה וַאֲרוֹן עֻזֶּךָ
  choice: நீரும் உமது வல்லமையின் பெட்டியும்
  rationale: தேவனையும் பெட்டியையும் இணை எழுவாய்களாக வைத்துப், עֹז என்பதன் வல்லமை/ஆற்றல் பொருளை ‘வல்லமை’ எனப் பேணுகிறது.
- source_word: כֹּהֲנֶיךָ
  choice: உமது ஆசாரியர்கள்
  rationale: ஆலய வழிபாட்டுச் சூழலில் כהן என்பதற்கான வழக்கமான, தெளிவான தமிழ்ச் சொல்.
- source_word: יִלְבְּשׁוּ תְשׁוּעָה
  choice: மீட்பை ஆடையாக அணிந்துகொள்ளட்டும்
  rationale: ‘அணிதல்’ என்ற எபிரெய உருவகத்தை வெளிப்படையாகப் பேணி, תְּשׁוּעָה என்பதன் மீட்பு/விடுதலைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: חֲסִידֶיךָ
  choice: உமக்கு உண்மையுள்ளவர்கள்
  rationale: חסיד குறிக்கும் பற்றுறுதியும் இறைநம்பிக்கையும் கொண்டவர்களை உறவுசார் வகையில் தெரிவிக்கிறது; பிற்கால சமயத் தொழில்நுட்பப் பொருளைத் திணிப்பதைத் தவிர்க்கிறது.
- source_word: יִשְׂמְחוּ בַטּוֹב
  choice: நன்மையில் மகிழட்டும்
  rationale: בַטּוֹב என்பதிலுள்ள ‘நன்மை/நல்லது’ என்ற சுருக்கத்தையும், உடைமைச் சுட்டுப்பெயர் இல்லாத தெளிவின்மையையும் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: בַטּוֹב என்பதற்கு ‘உமது நன்மையில்’ என உடைமைப் பொருள் சேர்க்க வேண்டுமா
  choice: நன்மையில்
  alternative: உமது நன்மையில்
  rationale: சூழல் தேவனுடைய நன்மையைக் குறிக்கக்கூடும்; ஆயினும் எபிரெயத்தில் உடைமை விகுதி இல்லை. எனவே மூலத்தின் திறந்த பொருளை முதன்மை உரையில் பேணி, சூழல்சார் வாசிப்பை அடிக்குறிப்பில் தருகிறது.
- issue: תְשׁוּעָה என்பதன் பொருள்
  choice: மீட்பு
  alternative: விடுதலை அல்லது வெற்றி
  rationale: சொல் மீட்பு, விடுதலை, வெற்றி ஆகிய பொருட்களை ஏற்கக்கூடும். இவ்வேண்டுதலில் ‘மீட்பு’ பரந்த பொருளைத் தருகிறது; குறிப்பிட்ட அரசியல் அல்லது போர்வெற்றிப் பொருளைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான ஜெப நடையைக் கடைப்பிடிக்கிறது. தேவனை நோக்கி ‘நீர்/உமது’ மற்றும் ‘எழுந்தருளும்’ பயன்படுத்தப்பட்டுள்ளன. எபிரெயக் கவிதையின் ஆடை உருவகமும், ‘நன்மை’ குறித்த நோக்கமுள்ள தெளிவின்மையும் பேணப்பட்டுள்ளன.
