source:
  edition: WLC
  text: וָ/אֶבְחַר֙ בִּ/יר֣וּשָׁלִַ֔ם לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔יד לִ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
translation:
  language: ta
  text: ஆனால் என் பெயர் அங்கே இருப்பதற்காக எருசலேமைத் தேர்ந்தெடுத்திருக்கிறேன்[a]; என் மக்களான இஸ்ரவேலின்மேல் இருக்கும்படி தாவீதையும் தேர்ந்தெடுத்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமைத் தேர்ந்தெடுத்தேன் ... தாவீதையும் தேர்ந்தெடுத்தேன்.” எபிரெய வினைவடிவங்களை எளிய இறந்தகாலத்திலும் மொழிபெயர்க்கலாம்; முதன்மை உரையிலுள்ள “தேர்ந்தெடுத்திருக்கிறேன்” என்பது, சூழலில் கடவுள் நிறுவிய தேர்வு தொடர்ந்து பொருந்துவதை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְחַר
  choice: தேர்ந்தெடுத்திருக்கிறேன்
  rationale: בחר என்பது தேர்ந்தெடுத்தலைக் குறிக்கிறது. சூழலில் கடவுளுடைய தேர்வு நிறுவப்பட்டு தொடர்ந்து பொருந்துவதைத் தமிழ் நிறைவேற்ற நிகழ்கால வடிவம் இயல்பாக வெளிப்படுத்துகிறது; எளிய இறந்தகாலமும் சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேம்
  rationale: இடப்பெயர் நவீனத் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற வழக்கமான வடிவில் தரப்பட்டுள்ளது.
- source_word: לִהְיוֹת
  choice: இருப்பதற்காக / இருக்கும்படி
  rationale: היה வினையின் பெயரெச்ச வடிவம் நோக்கம் அல்லது விளைவைத் தெரிவிக்கிறது. இரண்டு வாக்கிய உறுப்புகளிலும் இயல்பான தமிழுக்கு ஏற்றவாறு நெருக்கமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁמִי
  choice: என் பெயர்
  rationale: எபிரெயச் சொல்லாட்சியை நேரடியாகப் பாதுகாக்கிறது. இது தேவனுடைய பிரசன்னம், புகழ், உடன்படிக்கை உரிமை ஆகியவற்றோடு தொடர்புடையதாயினும், அவற்றில் ஒன்றை மட்டும் விளக்கவுரையாக முதன்மை உரையில் புகுத்தவில்லை.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தை வலியுறுத்தும் எளிய இடவினையடை வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּדָוִיד
  choice: தாவீதை
  rationale: בחר என்பதற்குப் பின் வரும் ב தேர்ந்தெடுக்கப்பட்ட நபரைக் குறிக்கிறது; தமிழில் செயப்படுபொருள் வேற்றுமையுடன் இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: עַל
  choice: இஸ்ரவேலின்மேல் இருக்கும்படி
  rationale: עַל மக்கள்மீதான அதிகார உறவைக் குறிக்கிறது. மூலத்தில் இல்லாத ‘அரசனாக’ அல்லது ‘ஆளும்படி’ என்பவற்றைச் சேர்க்காமல் ‘மேல் இருக்க’ என்ற நெருக்கமான சொல்லாட்சி பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: என் மக்களான இஸ்ரவேல்
  rationale: இஸ்ரவேல் என்பது ‘என் மக்கள்’ என்பதற்கு விளக்கப்பெயராக வருவதைக் காட்டவும், உடன்படிக்கை சார்ந்த ‘என் மக்கள்’ என்ற மொழியைப் பாதுகாக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְ
  choice: ஆனால்
  rationale: முந்தைய வசனத்திலுள்ள தேர்ந்தெடுக்கவில்லை என்ற மறுப்புக்கும் இங்குள்ள நேர்மறை அறிவிப்புக்கும் இடையிலான மாறுபாட்டை இணைப்புச்சொல் காட்டுகிறது.
theological_decisions:
- issue: ‘என் பெயர் அங்கே இருப்பதற்காக’ என்ற ஆலய இறையியல் சொல்லாட்சி
  choice: ‘என் பெயர் அங்கே இருப்பதற்காக’ என்ற எபிரெய மரபுத்தொடரைப் பாதுகாத்தல்
  alternative: ‘என் பிரசன்னம் அங்கே இருப்பதற்காக’ அல்லது ‘நான் வழிபடப்படும் இடமாக’
  rationale: மூல எபிரெயம் கடவுளுடைய ‘பெயர்’ அங்கே இருப்பதாகவே கூறுகிறது. அதன் உடன்படிக்கை மற்றும் ஆலயப் பொருளை விளக்கவுரையால் குறுக்காமல், உண்மையான வேதாகமச் சொல்லாட்சியே முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
- issue: ‘என் மக்களான இஸ்ரவேலின்மேல் இருக்கும்படி’ என்பதில் தாவீதின் பங்கு
  choice: இஸ்ரவேலின்மீதான அதிகாரத்தைப் பொதுவாகக் காட்டும் ‘மேல் இருக்கும்படி’
  alternative: ‘என் மக்களான இஸ்ரவேலுக்கு அரசனாக இருக்கும்படி’ அல்லது ‘இஸ்ரவேலை ஆளும்படி’
  rationale: சூழல் அரசாட்சியைப் பற்றியது என்றாலும், இவ்வசனத்தின் எபிரெய உரை ‘மேல் இருக்க’ என்றே கூறுகிறது. ‘அரசன்’ என்பதைச் சேர்ப்பது உடனடி மூலச்சொற்களைத் தாண்டிய விளக்க விரிவாக்கமாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய புரிதலும் இணையும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘என் பெயர் அங்கே இருப்பதற்காக’ மற்றும் ‘இஸ்ரவேலின்மேல் இருக்கும்படி’ ஆகிய மூலமொழிச் சொல்லாட்சிகள் விளக்க விரிவாக்கமின்றிப் பாதுகாக்கப்பட்டுள்ளன.
