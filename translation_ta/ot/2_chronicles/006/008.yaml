  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣יד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱֽטִיב֔וֹתָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
translation:
  language: ta
  text: ஆனால் யாவே என் தந்தையான தாவீதிடம், “என் பெயருக்காக ஒரு வீட்டைக்[a] கட்ட வேண்டும் என்ற எண்ணம் உன் உள்ளத்தில் இருந்ததால், நீ நல்லது செய்தாய்; உன் உள்ளத்தில் அந்த எண்ணம் இருந்தது நல்லதே.[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆலயத்தைக்.” எபிரெயத்தில் எழுத்துப்படி, “ஒரு வீட்டைக்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த எண்ணம் உன் உள்ளத்தில் இருந்ததால் நீ நல்லது செய்தாய்.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: אמר என்பதன் வழக்கமான கதைநடைப் பயன்பாட்டை இயல்பான தமிழ் நேர்கூற்றின் முடிவில் வழங்குகிறது.
- source_word: אָבִי
  choice: என் தந்தை
  rationale: சாலொமோன் தாவீதைக் குறிக்கும் நேரடியான உறவுமுறைச் சொல்லைப் பாதுகாக்கிறது.
- source_word: יַעַן אֲשֶׁר
  choice: இருந்ததால்
  rationale: காரணத்தைக் காட்டும் இணைந்த எபிரெயத் துகள்களின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָיָה עִם לְבָבְךָ
  choice: உன் உள்ளத்தில் இருந்தது
  rationale: உள்நோக்கம் அல்லது உறுதியைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  choice: என் பெயருக்காக ஒரு வீட்டைக் கட்டுவது
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருளான ‘வீடு’ என்பதையும், ‘என் பெயருக்காக’ என்ற இறையியல் முக்கியத்துவமுள்ள சொற்றொடரையும் பாதுகாக்கிறது.
- source_word: הֱטִיבוֹתָ
  choice: நீ நல்லது செய்தாய்
  rationale: יטב என்பதன் ஹிஃபில் வடிவம் இங்கு தாவீதின் நோக்கத்திற்குக் கிடைக்கும் பாராட்டைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அதைப் நேரடியாகத் தெரிவிக்கிறது.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: அது உன் உள்ளத்தில் இருந்ததே நல்லது
  rationale: மூலத்தில் மீண்டும் வரும் ‘உன் உள்ளத்தில் இருந்தது’ என்ற மொழியைப் பாதுகாத்து, כִּי இங்கு பாராட்டின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாகப் புரிந்துகொள்கிறது.
theological_decisions:
- issue: בַּיִת לִשְׁמִי என்ற ஆலயச் சொற்றொடர்
  choice: என் பெயருக்காக ஒரு வீடு
  alternative: என் பெயருக்காக ஓர் ஆலயம்
  rationale: மூல எபிரெயம் ‘வீடு’ என்று கூறுகிறது. இது ஆலயத்தைக் குறிப்பது உண்மையானாலும், ‘வீடு’ மற்றும் ‘என் பெயருக்காக’ ஆகிய சொற்கள் கடவுள் அந்தக் கட்டடத்திற்குள் அடங்குபவர் என்ற எண்ணத்தைத் தவிர்க்கும் மூலநூலின் இறையியல் நுட்பத்தைப் பாதுகாக்கின்றன.
- issue: இறுதி כִּי உட்பிரிவின் தொடர்பு
  choice: 'பாராட்டின் உள்ளடக்கம்: ‘அது உன் உள்ளத்தில் இருந்ததே நல்லது’'
  alternative: 'காரணம்: ‘அது உன் உள்ளத்தில் இருந்ததால் நீ நல்லது செய்தாய்’'
  rationale: כִּי என்பது இங்கு ‘என்பது/அதாவது’ என்றும் ‘ஏனெனில்’ என்றும் புரிந்துகொள்ளப்படலாம். முதன்மை மொழிபெயர்ப்பு எபிரெய மறுபடியுரைத்தலைத் தக்கவைத்து இயல்பான தமிழை நாடுகிறது; காரணப் பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அருகான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளம்’ என்ற உருவகம் மூலத்தின் மறுபடியுரைத்தலோடு பாதுகாக்கப்பட்டுள்ளது; ‘வீடு’ என்பதன் சூழற்பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
