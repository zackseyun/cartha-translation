source:
  edition: WLC
  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תַּחֲנוּנֵ֤י עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע מִ/מְּק֤וֹם שִׁבְתְּ/ךָ֙ מִן הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
translation:
  language: ta
  text: உமது அடியானும் உமது மக்களாகிய இஸ்ரவேலும் இந்த இடத்தை நோக்கி வேண்டிக்கொள்ளும்போது, அவர்களுடைய மன்றாட்டுகளைக் கேட்டருளும். உமது உறைவிடமாகிய பரலோகத்திலிருந்து நீர் கேட்பீராக; கேட்டு மன்னித்தருளும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ
  choice: கேட்டருளும் / கேட்பீராக / கேட்டு
  rationale: மூலத்தில் மூன்றுமுறை வரும் שׁמע என்ற வினையின் மீளுருவை முடிந்தவரை காக்கிறது. வேண்டுதல் சூழலில் முதல் இரு இடங்களிலும் மரியாதையுடனான விண்ணப்பத் தொனி தரப்பட்டுள்ளது; இறுதி இடம் ‘கேட்டு மன்னித்தருளும்’ என்ற இயல்பான தொடராக அமைக்கப்பட்டுள்ளது.
- source_word: תַּחֲנוּנֵי
  choice: மன்றாட்டுகள்
  rationale: இரக்கம் அல்லது தயவை நாடும் உருக்கமான வேண்டுதல்களைச் சுட்டுகிறது; நவீனத் தமிழில் கண்ணியமும் உணர்வுவலிமையும் கொண்ட சொல்.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: தேவனை நோக்கி அரசன் பேசும் பணிவும் உறவுசார் மரியாதையும் வெளிப்படுவதால் ‘அடியான்’ பொருத்தமானது; இங்கு ‘அடிமை’ தேவையற்ற சமூகப் பொருளை முன்னிறுத்தும்.
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேல்
  rationale: இஸ்ரவேல் என்பதே ‘உமது மக்கள்’ என்பதைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: יִתְפַּלְלוּ
  choice: வேண்டிக்கொள்ளும்போது
  rationale: வினை ‘ஜெபித்தல்/வேண்டுதல்’ என்பதைக் குறிக்கிறது. இங்கு மன்றாட்டுகளோடு இணைந்த சூழலால் ‘வேண்டிக்கொள்ளுதல்’ இயல்பாக உள்ளது; காலச்சூழல் தமிழில் ‘-ம்போது’ மூலம் வெளிப்படுத்தப்படுகிறது.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: இந்த இடத்தை நோக்கி
  rationale: ஆலயத்தைக் குறித்துத் திசைநோக்கி வேண்டுதல் செய்வதை אֶל தெரிவிப்பதால், வெறும் ‘இந்த இடத்தில்’ என்று மொழிபெயர்க்காமல் திசைப்பொருள் காக்கப்பட்டுள்ளது.
- source_word: מִמְּקוֹם שִׁבְתְּךָ מִן הַשָּׁמַיִם
  choice: உமது உறைவிடமாகிய பரலோகத்திலிருந்து
  rationale: ‘உமது உறைவிடம்’ மற்றும் ‘பரலோகம்’ ஆகியவற்றின் விளக்கவுரைத் தொடர்பை இயல்பான தமிழில் ஒருங்கிணைக்கிறது; தேவனுடைய கேட்பு பரலோகத்திலிருந்து வருகிறது என்பதும் தெளிவாகிறது.
- source_word: סָלָחְתָּ
  choice: மன்னித்தருளும்
  rationale: பாவம் அல்லது குற்றத்தை மன்னிப்பதைக் குறிக்கும் வினைக்கு தெளிவான சமமான சொல்; வேண்டுதலின் மரியாதைத் தொனிக்காக ‘அருளும்’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: தேவனுடைய பரத்துவமும் ஆலயத்தின் இடமும்
  choice: மக்கள் ‘இந்த இடத்தை நோக்கி’ வேண்டுகின்றனர்; தேவன் தமது உறைவிடமாகிய பரலோகத்திலிருந்து கேட்கிறார் என்ற இரு கூறுகளும் காக்கப்பட்டுள்ளன.
  alternative: தேவன் ஆலயத்திலேயே உறைகிறார் என்று வலுப்படுத்துதல், அல்லது ஆலயத்தைக் குறிப்பது முற்றிலும் அடையாளப் பொருள் மட்டுமே என்று விளக்குதல்.
  rationale: எபிரெய உரை ஆலயத்தை நோக்கிய வேண்டுதலையும் தேவனுடைய பரலோக உறைவிடத்தையும் ஒன்றோடொன்று இணைத்தே வைத்துள்ளது. மொழிபெயர்ப்பு இந்த இறையியல் இழுவையைத் தீர்த்துவிடாமல் அப்படியே பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’, ‘நீர்’, ‘கேட்டருளும்’, ‘மன்னித்தருளும்’ ஆகிய வடிவங்கள் தேவனை நோக்கிய மரியாதையைக் காட்டுகின்றன; அளவுக்கு மீறிய பழந்தமிழ் நடை தவிர்க்கப்பட்டுள்ளது.
