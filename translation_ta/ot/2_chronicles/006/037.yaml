id: 2CH.6.37
reference: 2 Chronicles 6:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שִׁבְיָ/ם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ הֶעֱוִ֖ינוּ וְ/רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
translation:
  language: ta
  text: அவர்கள் சிறைபிடிக்கப்பட்ட நாட்டில் உள்ளத்தில் சிந்தித்து உணர்ந்து, திரும்பி, தங்கள் சிறைவாச நாட்டில் உம்மிடம் மன்றாடி, ‘நாங்கள் பாவம் செய்தோம்; நெறிபிறழ்ந்து நடந்தோம்; தீமை செய்தோம்’ என்று சொன்னால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לְבָבָם
  choice: தங்கள் உள்ளத்தில் உணர்ந்து
  rationale: எபிரெய மொழிப்படிமம் சொற்சொல்லாக ‘தங்கள் இதயத்திற்குத் திரும்பக் கொண்டுவந்து’ என்பதாகும்; அது ஆழ்ந்து சிந்தித்து உணர்வதைச் சுட்டுகிறது. இயல்பான தமிழுக்காக ‘உள்ளத்தில் உணர்ந்து’ என மொழிபெயர்த்து, மூலப்படிமத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: தாங்கள் சிறைபிடிக்கப்பட்ட நாட்டில்
  rationale: נשבה என்ற நிபால் வடிவம் சிறைபிடிக்கப்படுதலைக் குறிக்கிறது. இத்தேர்வு நாடுகடத்தல் சூழலையும் செயப்படுபொருள் தன்மையையும் தெளிவாகத் தருகிறது.
- source_word: וְשָׁבוּ
  choice: திரும்பி
  rationale: שׁוּב என்பது இடரீதியான திரும்புதலையோ கடவுளை நோக்கிய மனமாற்றத்தையோ குறிக்கலாம். ‘திரும்பி’ என்ற சொல் இரு சாத்தியங்களையும் திறந்தவையாக வைத்திருக்கிறது.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: உம்மிடம் மன்றாடி
  rationale: חנן என்பதன் ஹித்பாயேல் வடிவம் அருளை வேண்டி உருக்கமாக விண்ணப்பிப்பதைக் குறிக்கிறது. ‘மன்றாடி’ என்பது அதன் தீவிரத்தையும் வேண்டுதல் தன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: தங்கள் சிறையிருப்பின் நாட்டில்
  rationale: שְׁבִי என்பது சிறையிருப்பு அல்லது சிறைப்பட்ட நிலையைக் குறிக்கிறது. ‘சிறையிருப்பின் நாடு’ மூலத்தின் உறுதியான கருத்தை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: לֵאמֹר
  choice: என்று சொன்னால்
  rationale: ஒப்புரவின் நேரடி கூற்றை அறிமுகப்படுத்தும் வழக்கமான மேற்கோள் வடிவம்; வசனத்தின் நிபந்தனை வாக்கிய அமைப்புடன் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: חָטָאנוּ
  choice: நாங்கள் பாவம் செய்தோம்
  rationale: பாவத்தை ஒப்புக்கொள்ளும் நேரடியான, நிலையான மொழிபெயர்ப்பு.
- source_word: הֶעֱוִינוּ
  choice: நெறிபிறழ்ந்து நடந்தோம்
  rationale: עוה என்பதன் ஹிபீல் வடிவம் கோணலாக அல்லது முறைகேடாக நடப்பதைச் சுட்டுகிறது. ‘நெறிபிறழ்ந்து நடந்தோம்’ அதன் ஒழுக்கச் சிதைவு உருவகத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְרָשָׁעְנוּ
  choice: பொல்லாப்பு செய்தோம்
  rationale: רשע குற்றமுள்ள பொல்லாத நடத்தையைக் குறிக்கிறது. இத்தேர்வு வினைச்செயல் தன்மையையும் ஒப்புரவின் உச்சத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: சிறையிருப்புச் சூழலில் שׁוּב என்ற சொல்லின் மனந்திரும்புதல் சார்ந்த பொருள்
  choice: ‘மனந்திரும்பி’ என்று விளக்கமாக்காமல் ‘திரும்பி’ என மொழிபெயர்த்தல்
  alternative: மனந்திரும்பி; திரும்பி வந்து
  rationale: இவ்வசனம் உள்ளத்தில் உணர்தல், திரும்புதல், மன்றாடுதல், பாவ ஒப்புரவு ஆகியவற்றை இணைக்கிறது. ‘திரும்பி’ என்பது உடல்ரீதியான திரும்புதலுக்கும் ஆன்மீக மனமாற்றத்திற்கும் இடையிலுள்ள மூலத்தின் பொருள் இழுப்பைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; ஜெபத்தில் கடவுளை நோக்கும் மரியாதை ஒருமைக்காக ‘உம்மிடம்’ பயன்படுத்தப்பட்டுள்ளது. மூன்று ஒப்புரவு வினைகளும் படிப்படியாக வலுப்படும் வகையில் ‘பாவம் செய்தோம்; நெறிபிறழ்ந்து நடந்தோம்; பொல்லாப்பு செய்தோம்’ என அமைக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்துடன் தொடரும் நிபந்தனைத் தொடராக இருப்பதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
