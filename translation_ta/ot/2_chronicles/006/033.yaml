  terminology: “பரலோகம்,” “உறைவிடம்,” “அந்நியன்,” “இஸ்ரவேலர்,” “ஆலயம்,” “பெயர்,” மற்றும் “பயப்படுதல்” ஆகிய சொற்கள் சூழலுக்கும் வேதாகமப் பதிவுக்கும் பொருத்தமானவை. “இந்த ஆலயம் உமது பெயரைத் தாங்குகிறது” என்பது எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் வெளிப்பாடு; நேரடியான சொல்லமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
