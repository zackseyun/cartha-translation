  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
translation:
  language: ta
  text: அப்போது நீர் பரலோகத்திலிருந்து, உமது உறைவிடத்திலிருந்து கேட்டு, அந்த அந்நியன் உம்மிடம் எதற்காக வேண்டிக்கொள்கிறானோ, அதையெல்லாம் செய்யும். அப்பொழுது பூமியிலுள்ள எல்லா மக்களினங்களும் உமது பெயரை அறிந்து, உமது மக்களாகிய இஸ்ரவேலரைப்போல் உமக்குப் பயப்படுவார்கள்; மேலும், நான் கட்டிய இந்த ஆலயம் உமது பெயரைத் தாங்குகிறது[a] என்பதையும் அறிந்துகொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: “உமது பெயர் இந்த ஆலயத்தின்மேல் அழைக்கப்பட்டுள்ளது.” அதாவது, இந்த ஆலயம் உமக்குரியதாகவும் உமது பெயரோடு இணைக்கப்பட்டதாகவும் உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: கேட்டு
  rationale: செபத்தின் சூழலில் வெறுமனே ஒலியைக் கேட்பதை மட்டுமல்லாமல், கவனித்து பதிலளிப்பதையும் குறிக்கிறது; தொடர்ந்து வரும் இறைச்செயலுடன் இயல்பாக இணைகிறது.
- source_word: מִן הַשָּׁמַיִם
  choice: பரலோகத்திலிருந்து
  rationale: எபிரெய வடிவம் பன்மையாக இருந்தாலும், தேவனுடைய வானக உறைவிடத்தைக் குறிக்கும் வழக்கமான தமிழ் ஒருமைச் சொல் இயல்பாக உள்ளது.
- source_word: מִמְּכוֹן שִׁבְתֶּךָ
  choice: உமது உறைவிடத்திலிருந்து
  rationale: מכון என்பது நிலைபெற்ற இடத்தையும் שׁבת என்பது தங்கியிருத்தலையும் சுட்டுகிறது; இந்தத் தேர்வு இடம்சார்ந்த பொருளைப் பாதுகாக்கிறது.
- source_word: וְעָשִׂיתָ
  choice: செய்யும்
  rationale: עשה என்ற பரந்த வினையை குறிப்பிட்ட வகையான பதிலாகக் குறுக்காமல், மரியாதைமிக்க வேண்டுதல் நடையில் வழங்குகிறது.
- source_word: כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ
  choice: உம்மிடம் எதற்காக வேண்டிக்கொள்கிறானோ, அதையெல்லாம்
  rationale: קרא אל என்பதன் அழைத்தல் அல்லது விண்ணப்பித்தல் என்ற பொருளை, செபச் சூழலுக்கேற்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַנָּכְרִי
  choice: அந்த அந்நியன்
  rationale: இஸ்ரவேல் மக்களைச் சேராத வேறு மக்களினத்தைச் சேர்ந்த ஒருவரைக் குறிக்கிறது; சூழலில் முன்பே குறிப்பிடப்பட்ட நபரைத் திட்டவட்டமாகச் சுட்டுகிறது.
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: பூமியிலுள்ள எல்லா மக்களினங்களும்
  rationale: இங்கு הארץ ஒரு குறிப்பிட்ட நாட்டை அல்ல, உலகளாவிய பரப்பைக் குறிக்கிறது; עמים என்பதன் பன்மைத் தனித்துவத்தையும் ‘மக்களினங்கள்’ காக்கிறது.
- source_word: אֶת שְׁמֶךָ
  choice: உமது பெயரை
  rationale: ‘பெயர்’ என்பது தேவனுடைய வெளிப்படுத்தப்பட்ட அடையாளம், புகழ், அதிகாரம் ஆகியவற்றையும் உள்ளடக்கக்கூடிய வேதாகமச் சொல்லாட்சி; அதை விளக்கவுரையாகச் சுருக்கவில்லை.
- source_word: וּלְיִרְאָה אֹתְךָ
  choice: உமக்குப் பயப்படுவார்கள்
  rationale: தேவனை நோக்கிய பயபக்தியை உள்ளடக்கும் ירא என்பதன் வலிமையை ‘பயப்படுதல்’ பாதுகாக்கிறது.
- source_word: כְּעַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களாகிய இஸ்ரவேலரைப்போல்
  rationale: மக்களினங்கள் தேவனுக்குப் பயப்படுவதையும் இஸ்ரவேலின் பயத்தையும் ஒப்பிடும் அமைப்பைத் தெளிவாகக் காக்கிறது.
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: இந்த ஆலயம் உமது பெயரைத் தாங்குகிறது
  rationale: சொல்லுக்குச் சொல் மொழிபெயர்த்தால் தமிழில் தெளிவற்றதாகும் ‘பெயர் இந்த வீட்டின்மேல் அழைக்கப்படுகிறது’ என்ற எபிரெய மரபுத்தொடரை, ஆலயம் தேவனுக்குரியது என்றும் அவருடைய பெயரோடு தொடர்புடையது என்றும் உணர்த்தும் இயல்பான தமிழில் வழங்குகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தேவனுடைய உறைவிடத்தையும் ஆலயத்தையும் குறிக்கும் மொழி
  choice: தேவன் பரலோகத்திலுள்ள தமது உறைவிடத்திலிருந்து கேட்கிறார் என்றும், பூமியிலுள்ள ஆலயம் அவருடைய பெயரைத் தாங்குகிறது என்றும் வேறுபடுத்திக் கூறுதல்
  alternative: இடம்சார்ந்த எல்லா மொழியையும் ‘உமது பிரசன்னத்திலிருந்து’ எனப் பொருள்விரித்து வழங்குதல்
  rationale: மூலவசனம் பரலோகத்தை தேவனுடைய உறைவிடமாகக் கூறி, ஆலயத்தோடு அவருடைய பெயரை இணைக்கிறது. இந்த வேறுபாட்டைக் காப்பது, தேவன் ஆலயத்திற்குள் கட்டுப்பட்டவர் என்றோ அதற்கு எதிரான பிற்கால விளக்கமொன்றையோ மொழிபெயர்ப்பில் புகுத்தாமல் உரையின் சொந்த இறையியல் அழுத்தத்தை நிலைநிறுத்துகிறது.
- issue: தேவனைப் பற்றிய ירא என்ற சொல்லின் வலிமை
  choice: உமக்குப் பயப்படுவார்கள்
  alternative: உம்மை மதிப்பார்கள் / பயபக்தியுடன் போற்றுவார்கள்
  rationale: இச்சொல் பயபக்தியை உள்ளடக்கியிருந்தாலும், ‘பயம்’ என்ற வேதாகமத் தன்மையையும் தீவிரத்தையும் மென்மையாக்காமல் காக்கிறது.
- issue: தேவனுடைய பெயர் ஆலயத்தின்மேல் அழைக்கப்படுதல் என்ற எபிரெய மரபுத்தொடர்
  choice: ஆலயம் உமது பெயரைத் தாங்குகிறது
  alternative: உமது பெயர் இந்த ஆலயத்தின்மேல் அழைக்கப்பட்டுள்ளது
  rationale: மாற்றுத் தேர்வு எபிரெய வடிவுக்கு நெருக்கமானது, ஆனால் நவீன தமிழில் தெளிவற்றது. முதன்மைத் தேர்வு ஆலயம் தேவனுக்குரியது மற்றும் அவருடைய பெயரோடு அடையாளப்படுத்தப்பட்டது என்ற கருத்தை இயல்பாகக் காக்கிறது; சொற்றொடரின் நேரடி அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க செப நடையைப் பயன்படுத்துகிறது. ‘நீர்/உமது/உமக்கு’ என்ற உயர்திணை மரியாதை வடிவங்கள் தொடர்ச்சியாக உள்ளன. ‘செய்யும்’ என்பது இங்கு மரியாதைமிக்க வேண்டுதல் வினையாகப் பயன்படுத்தப்பட்டுள்ளது; ‘செய்தருளும்’ என மொழிபெயர்த்து மூலத்தில் வெளிப்படையாக இல்லாத அருள் சார்ந்த கூறைச் சேர்ப்பது தவிர்க்கப்பட்டது.
