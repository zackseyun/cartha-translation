  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
translation:
  language: ta
  text: “என் மக்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்த நாள் முதல்[a], என் பெயர் அங்கே இருப்பதற்காக ஒரு வீட்டைக்[b] கட்டுவதற்காக இஸ்ரவேலின் எந்தக் கோத்திரத்திலிருந்தும் ஒரு நகரத்தை நான் தேர்ந்தெடுக்கவில்லை; என் மக்களான இஸ்ரவேலின்மேல் ஆட்சியாளனாக[c] இருக்க ஓர் ஆணையும் நான் தேர்ந்தெடுக்கவில்லை.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் மக்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்த நாளிலிருந்து நான் ஒரு நகரத்தைத் தேர்ந்தெடுக்கவில்லை…” என்றும் மொழிபெயர்க்கலாம். எபிரெய இறந்தகால வினைகள் கடந்தகால நிகழ்வாக மொழிபெயர்க்கப்படலாம்; ஆனால் “நாள் முதல்” என்ற தொடர், அந்தக் கடந்தகாலப் புள்ளியிலிருந்து தொடரும் பொருளையும் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: “வீடு” என்பது இங்கே ஆலயத்தைக் குறிக்கிறது. எனினும், எபிரெயம் விளக்கமான “ஆலயம்” என்ற சொல்லுக்குப் பதிலாக “வீடு” என்றே கூறுகிறது.
    reason: lexical_alternative
  - marker: c
    text: “ஆட்சியாளன்” என்பதற்கு “தலைவன்” அல்லது “அதிபதி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: …நாள் முதல்
  rationale: தொடர்ந்து வரும் மறுப்பு வினைகளுக்கான கடந்தகாலத் தொடக்கப் புள்ளியை இயல்பான தமிழில் குறிக்கிறது.
- source_word: הוֹצֵאתִי אֶת עַמִּי מֵאֶרֶץ מִצְרַיִם
  choice: என் மக்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்த
  rationale: ஹிப்ஃபில் வடிவின் காரணவினைப் பொருளையும், எகிப்திலிருந்து நிகழ்ந்த வெளியேற்றத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לֹא בָחַרְתִּי בְעִיר
  choice: ஒரு நகரத்தை நான் தேர்ந்தெடுக்கவில்லை
  rationale: בחר என்பதுடன் வரும் ב தேர்ந்தெடுக்கப்படும் பொருளைக் குறிக்கிறது; தமிழில் நேரடி செயப்படுபொருள் அமைப்பு இயல்பானது.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எந்தக் கோத்திரத்திலிருந்தும்
  rationale: மறுப்பு வாக்கியத்தில் כֹּל என்பதன் பகிர்வு வலிமையை ‘எந்த…இருந்தும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לִבְנוֹת בַּיִת
  choice: ஒரு வீட்டைக் கட்டும்படி
  rationale: בַּיִת என்பதன் நேரடிப் பொருளான ‘வீடு’ என்பதைப் பாதுகாக்கிறது; ‘ஆலயம்’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: என் பெயர் அங்கே இருப்பதற்காக
  rationale: ‘என் பெயர் அங்கே இருக்க’ என்ற எபிரெயச் சொல்லமைப்பைப் பாதுகாத்து, ‘வாசம்பண்ண’ போன்ற உரையில் இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: וְלֹא בָחַרְתִּי בְאִישׁ
  choice: ஓர் ஆணையும் நான் தேர்ந்தெடுக்கவில்லை
  rationale: אִישׁ இங்கு இஸ்ரவேலின் வரலாற்றில் ஆட்சிக்கு நியமிக்கப்படும் ஆண் ஒருவரைக் குறிப்பதால் அதன் ஆண்பால் தன்மை பாதுகாக்கப்படுகிறது.
- source_word: נָגִיד
  choice: ஆட்சியாளன்
  rationale: அதிகாரத்தில் வைக்கப்பட்ட ஒருவரைக் குறிக்கும் சொல்லின் வலிமையை நவீன தமிழில் தெளிவாக வழங்குகிறது.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: என் மக்களாகிய இஸ்ரவேலின்மேல்
  rationale: ‘மேல்’ என்ற அதிகார உறவையும் ‘என் மக்கள் இஸ்ரவேல்’ என்ற உடன்படிக்கைச் சார்ந்த அடையாளத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: ஆலயச் சொற்பயன்பாடும் தெய்வீகப் பெயரின் இருப்பும்
  choice: ‘வீடு’ என்றும் ‘என் பெயர் அங்கே இருப்பதற்காக’ என்றும் உரையின் சொந்த வகைப்பாடுகளைத் தக்கவைத்தல்
  alternative: ‘ஆலயத்தைக் கட்டி, என் பிரசன்னம் அங்கே வாசம்பண்ணுவதற்காக’
  rationale: எபிரெயம் சாதாரணமாக ‘வீடு’ என்றும், தேவனுடைய ‘பெயர் அங்கே இருக்க’ என்றும் கூறுகிறது. விளக்கமான மாற்று, பெயருக்கும் தேவனுடைய பிரசன்னத்துக்கும் இடையிலான நுணுக்கத்தை முன்கூட்டியே தீர்மானித்துவிடும்.
- issue: אִישׁ என்பதன் பாலினக் குறிப்பு
  choice: ஓர் ஆண்
  alternative: ஒருவர் / ஒரு நபர்
  rationale: இந்தச் சூழலில் ஒரே ஆண் ஆட்சியாளரை உரை நோக்குவதால், மூலத்தின் ஆண்பால் ஒருமை பொதுப்பாலாக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியத்தின் இணை மறுப்பு அமைப்பு அரைப்புள்ளியால் தெளிவாக்கப்பட்டுள்ளது; ‘என் பெயர் அங்கே இருப்பது’ என்ற திட்டமிட்ட இறையியல் நுணுக்கம் விளக்கமின்றித் தக்கவைக்கப்பட்டுள்ளது.
