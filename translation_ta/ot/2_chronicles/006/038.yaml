source:
  edition: WLC
  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
translation:
  language: ta
  text: அவர்கள் சிறைபிடித்துச் செல்லப்பட்ட நாட்டில், தங்கள் முழு இதயத்தோடும் முழு உயிரோடும் உம்மிடம் திரும்பி[a], நீர் அவர்களுடைய முன்னோர்களுக்குக் கொடுத்த தங்கள் நாட்டை நோக்கியும், நீர் தேர்ந்தெடுத்த நகரத்தை நோக்கியும், உமது பெயருக்காக நான் கட்டிய ஆலயத்தை நோக்கியும் ஜெபித்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உம்மிடம் மனந்திரும்பி’; உடன்படிக்கைச் சூழலில் இந்தச் சொற்றொடர் மனந்திரும்புதலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: உம்மிடம் திரும்பி
  rationale: שׁוּב אֶל என்பதன் அடிப்படைப் பொருளான ஒருவரிடம் திரும்புதலை நேரடியாகக் காக்கிறது; இந்தச் சூழலில் உள்ள மனந்திரும்புதலின் உடன்படிக்கைச் சார்பை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்காமல் விடுகிறது.
- source_word: בְּכָל לִבָּם וּבְכָל נַפְשָׁם
  choice: தங்கள் முழு இதயத்தோடும் முழு உயிரோடும்
  rationale: לֵב மற்றும் נֶפֶשׁ ஆகியவற்றின் இணைப்பு முழுமையான உள்ளார்ந்த ஈடுபாட்டையும் முழு வாழ்வையும் குறிக்கிறது. ‘உயிர்’ என்பது נֶפֶשׁ என்பதன் முழு நபர்/வாழ்வு சார்ந்த பரப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: בְּאֶרֶץ שִׁבְיָם אֲשֶׁר שָׁבוּ אֹתָם
  choice: அவர்கள் சிறைபிடித்துச் செல்லப்பட்ட சிறையிருப்பு நாட்டில்
  rationale: சிறையிருப்புடன் தொடர்புடைய நாட்டையும், அவர்கள் அங்கே சிறைபிடித்துச் செல்லப்பட்டதையும் சுருக்கமான இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: וְהִתְפַּלְלוּ
  choice: மன்றாடினால்
  rationale: இவ்வசனம் முந்தைய நிபந்தனைத் தொடரின் ஒரு பகுதியாக இருப்பதால் ‘-னால்’ வடிவம் தமிழில் வாக்கியத் தொடர்பைத் தெளிவாக்குகிறது; ‘மன்றாடு’ சாலொமோனின் விண்ணப்பச் சூழலுக்கு ஏற்றது.
- source_word: דֶּרֶךְ אַרְצָם
  choice: அவர்களுடைய நாட்டை நோக்கியும்
  rationale: ஜெபத்தின் திசையைக் குறிக்கும் דֶּרֶךְ என்பதற்கு ‘நோக்கி’ இயல்பான தமிழ் இணை.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: நீர் அவர்களுடைய முன்னோர்களுக்குக் கொடுத்த
  rationale: אָבוֹתָם இங்கு வம்ச முன்னோர்களைக் குறிப்பதால், நவீன வாசகர்களுக்குத் தெளிவான ‘முன்னோர்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְהָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: நீர் தேர்ந்தெடுத்த நகரத்தை நோக்கியும்
  rationale: தெய்வீகத் தேர்வை எளிய, நேரடியான தமிழில் காக்கிறது.
- source_word: וְלַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: உமது பெயருக்காக நான் கட்டிய ஆலயத்தை நோக்கியும்
  rationale: בַּיִת இச்சூழலில் ஆலயத்தைக் குறிப்பதால் ‘ஆலயம்’ நவீன தமிழில் தெளிவாக உள்ளது; ‘உமது பெயருக்காக’ என்பது பெயருக்கான அர்ப்பணிப்பு என்ற எபிரேய இறையியல் மொழிநடையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: שׁוּב אֵלֶיךָ என்பதில் மனந்திரும்புதல் சார்ந்த பொருள்
  choice: ‘உம்மிடம் திரும்பி’ என்று மொழிபெயர்த்தல்
  alternative: ‘உம்மிடம் மனந்திரும்பி’
  rationale: எபிரேய வினையின் அடிப்படைப் பொருள் ‘திரும்புதல்.’ இவ்விண்ணப்பத்தில் மனந்திரும்புதல் உட்பொருளாக இருந்தாலும், அதை மட்டும் வெளிப்படையான பொருளாக நிர்ணயிக்காமல் உடல், உறவு, உடன்படிக்கை சார்ந்த திரும்புதலுக்கிடையிலான பொருள் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய உரையில் ‘நீர்/உமது/உம்மிடம்’ என்ற உயர்திணை மரியாதை வடிவங்கள் காக்கப்பட்டுள்ளன. வசனம் முந்தைய நிபந்தனைத் தொடரை நிறைவு செய்யாததால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
