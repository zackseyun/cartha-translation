id: 2CH.6.12
reference: 2 Chronicles 6:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַֽ/יַּעֲמֹ֗ד לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֖שׂ כַּפָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/012.yaml
  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
translation:
  language: ta
  text: பின்பு அவர் இஸ்ரவேலின் முழுச் சபைக்கும் முன்பாக யாவேவின் பலிபீடத்தின் முன்னே நின்று, தம் கைகளை விரித்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘தம் உள்ளங்கைகளை விரித்தார்’; இது ஜெபிக்கும்போது கைகளை நீட்டி விரிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: பின்பு அவர் ... நின்று
  rationale: வய்யிக்தோல் வடிவம் நிகழ்ச்சித் தொடரை முன்னெடுக்கிறது; ‘பின்பு’ இயல்பான தமிழ் வரிசையைக் காட்டுகிறது.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: யாவேவின் பலிபீடத்தின் முன்னே
  rationale: לִפְנֵי குறிக்கும் இடவுறவைத் தெளிவாகக் காட்டி, יהוה என்பதைத் தனிப்பெயரான ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் முழுச் சபைக்கும் முன்பாக
  rationale: נֶגֶד என்பது கூடியிருந்த மக்களுக்கு எதிரே அல்லது அவர்கள்முன் இருந்த நிலையைச் சுட்டுகிறது; קהל என்பதற்கு இங்கு ‘சபை’ இயல்பான கூட்டுச் சமூகச் சொல்.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: தம் கைகளை விரித்தார்
  rationale: சொல்லளவில் ‘தம் உள்ளங்கைகளை விரித்தார்’ என்றாலும், இது ஜெபத்தில் கைகளை நீட்டி விரிக்கும் செய்கையைக் குறிக்கும் இயல்பான தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய மூலத்தில் பட்டத்துக்குப் பதிலாக நான்கெழுத்துத் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் இயல்பைப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘முன்பாக’ மற்றும் ‘முன்னே’ என்பவை נגד, לפני ஆகிய இரு வேறு இடவுறவுகளைக் காட்டுகின்றன. ‘முழுச் சபை’ என்பது כָּל קְהַל என்பதன் கூட்டுமுழுமையை இயல்பாக வெளிப்படுத்துகிறது.
