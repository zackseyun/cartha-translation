base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
translation:
  language: ta
  text: இருப்பினும், யாவே, என் கடவுளே, உமது அடியானின் ஜெபத்தையும் அருள் வேண்டிய அவனது மன்றாட்டையும்[a] நோக்கியருளும்; உமது அடியான் உமக்கு முன்பாகச் செலுத்தும் கூக்குரலையும்[b] ஜெபத்தையும் கேட்டருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனது மன்றாட்டையும்.’ எபிரெயச் சொல் இரக்கம் அல்லது அருளை நாடும் ஆழ்ந்த வேண்டுகோளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உரத்த கூக்குரலையும்.’ இங்குள்ள எபிரெயச் சொல் உதவி கேட்டு எழுப்பப்படும் ஒலிக்கும் உரத்த குரலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: இருப்பினும் ... நோக்கியருளும்
  rationale: פנה என்பதன் அடிப்படைப் படிமமான ‘நோக்கித் திரும்புதல்’ என்பதைக் காத்து, ஜெபச் சூழலில் கவனித்தருளும்படி வேண்டுவதை இயல்பான தமிழில் தெரிவிக்கிறது. இணைப்புச்சொல் முந்தைய வசனத்துக்கு எதிர்நிலையான வேண்டுகோளை அறிமுகப்படுத்துவதால் ‘இருப்பினும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: תְּפִלַּת / הַתְּפִלָּה
  choice: ஜெபம்
  rationale: תפלה என்பதற்கான வழக்கமான, தெளிவான தமிழ் இணை. எபிரெயச் சொல் இருமுறை வருவதால் இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி மீளுரையையும் இணை அமைப்பையும் காத்துள்ளது.
- source_word: עַבְדְּךָ
  choice: உமது அடியான்
  rationale: தேவனை நோக்கி அரசன் தன்னைத் தாழ்த்திப் பேசும் ஜெப மொழியில் עבד என்பதற்கு ‘அடியான்’ இயல்பாகவும் மரியாதையுடனும் பொருந்துகிறது.
- source_word: תְּחִנָּתוֹ
  choice: அருள் வேண்டிய அவனது மன்றாட்டு
  rationale: תחנה என்பது இரக்கம் அல்லது அருள் கோரும் ஆழ்ந்த வேண்டுகோள். ‘மன்றாட்டு’ அதன் தீவிரத்தைத் தெரிவிக்கிறது; ‘அருள் வேண்டிய’ என்பது சொல்லின் கருணை கோரும் நுட்பத்தை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: אֱלֹהָי
  choice: என் கடவுளாகிய
  rationale: முதலாம் நபர் உடைமைத் தொடர்பையும், யாவேயை நேரடியாக அழைக்கும் தொடரையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: לִשְׁמֹעַ
  choice: கேட்டருளும்
  rationale: שמע என்பதன் ‘கேட்பது’ என்ற பொருளைக் காத்து, வேண்டுதல் நிறைந்த தமிழ்ச் சொற்றொடரில் மரியாதை விகுதியுடன் வழங்குகிறது.
- source_word: הָרִנָּה
  choice: கூக்குரல்
  rationale: רנה இங்கு ஜெபத்தில் எழுப்பப்படும் உரத்த உதவிக் குரலைக் குறிக்கிறது. மகிழ்ச்சி ஆரவாரம் என்ற சாத்தியப் பொருளைச் சூழல் ஆதரிக்காததால் ‘கூக்குரல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִתְפַּלֵּל
  choice: ஏறெடுக்கும்
  rationale: நிகழ்ந்துகொண்டிருக்கும் ஜெபச் செயலைத் தமிழில் இயல்பாகக் காட்ட, ‘ஜெபத்தையும்’ என்பதுடன் சேர்ந்து ‘ஏறெடுக்கும்’ என வழங்கப்பட்டது.
- source_word: לְפָנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: தேவனுடைய முன்னிலையில் என்ற எபிரெய மரபுத்தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலவசனம் நான்கெழுத்துத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைக் காக்கிறது.
- issue: תחנה என்பதில் உள்ள அருள் அல்லது இரக்கக் கோரிக்கை
  choice: அருள் வேண்டிய ... மன்றாட்டு
  alternative: மன்றாட்டு மட்டும்
  rationale: சொல் வெறும் வேண்டுகோளை விட கருணை அல்லது சாதகமான அருளை நாடும் வேண்டுதலைக் குறிக்கலாம். அந்த நுட்பத்தை உரையில் வெளிப்படுத்தியபோதும், அடிக்குறிப்பில் சுருக்கமான மாற்றையும் தருகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் ஜெபத்திற்குரிய கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘உமது,’ ‘அடியான்,’ ‘அருளும்’ ஆகிய மரியாதை வடிவங்கள் சூழலுக்கேற்றவை; மிகப் பழமையான சொற்றொடர்கள் தவிர்க்கப்பட்டுள்ளன. எபிரெய இணை அமைப்பையும் ‘ஜெபம்’ என்ற சொல்லின் மீளுரையையும் காக்கும்போது, நீண்ட மூல வாக்கியம் தமிழில் தெளிவாக இருக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
