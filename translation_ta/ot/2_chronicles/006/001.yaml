source:
  edition: WLC
  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכּ֖וֹן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/001.yaml
  text: Then Solomon said[a], “Yahweh has said that he would dwell in the thick darkness.”
translation:
  language: ta
  text: அப்போது சாலொமோன், “யாவே காரிருளில் வாசமிருப்பார் என்று கூறினார்[a]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இருண்ட மேகத்தில்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அடர்ந்த மேகம், இருள், அல்லது காரிருள் என்பவற்றைக் குறிக்கலாம்; குறிப்பாக இறைவன் தம்மை வெளிப்படுத்தும் சூழல்களில் இவ்வாறு வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: நிகழ்வுகளின் தொடர்ச்சியில் சாலொமோனின் கூற்றை அறிமுகப்படுத்தும் இயல்பான காலச் சுட்டு.
- source_word: אָמַר ... שְׁלֹמֹה
  choice: சாலொமோன் ... என்றார்
  rationale: எபிரெய உரையறிமுகத்தின் நேரடியான, இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பில் தருகிறது.
- source_word: אָמַר
  choice: சொல்லியிருக்கிறார்
  rationale: இங்கு முன்பு கூறப்பட்ட இறைவாக்கு தற்போதைய ஆலய அர்ப்பணிப்பு நிகழ்வுடன் தொடர்புடையதாக மேற்கோள் கொள்ளப்படுவதால், எபிரெய நிறைவுவினையை தமிழில் நிகழ்காலத் தொடர்புடைய நிறைவாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִשְׁכּוֹן
  choice: குடியிருப்பதாக
  rationale: לְ உடன் வரும் வினையெச்சம் கூறப்பட்ட செய்தியின் உள்ளடக்கத்தைத் தருகிறது; ‘குடியிரு’ தெய்வீக வாசஸ்தலத்தின் பொருளையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: בָּעֲרָפֶל
  choice: காரிருளில்
  rationale: עֲרָפֶל என்பதிலுள்ள அடர்ந்த மேகம், மந்தாரம், ஆழ்ந்த இருள் ஆகிய பொருட்களில் இச்சூழலின் மறைந்த தெய்வீக வெளிப்பாட்டைச் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக உள்ள இறைவனின் தனிப்பெயரை ஒரு பட்டமாக மாற்றாமல் பாதுகாக்கிறது; தமிழ் வாசகர்களிடையே நிலைபெற்ற ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- issue: עֲרָפֶל-இல் தெய்வீகப் பிரசன்னத்தின் தன்மை
  choice: காரிருளில்
  alternative: இருண்ட மேகத்தில்
  rationale: இறைவனின் அண்மையும் மறைவுமாகிய பதற்றத்தை விளக்கி நீக்காமல் பாதுகாக்கிறது; மேகம் என்ற சாத்தியமான பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், ஆலய அர்ப்பணிப்புச் சூழலுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. நேரடி உரையின் ஓட்டத்தைக் காக்க தமிழுக்குரிய சொல்வரிசை பயன்படுத்தப்பட்டது.
