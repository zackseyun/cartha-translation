id: 2CH.6.30
reference: 2 Chronicles 6:30
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע מִן הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָ֣לַחְתָּ֔ וְ/נָתַתָּ֤ה לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּ֤י אַתָּה֙ לְ/בַדְּ/ךָ֣ יָדַ֔עְתָּ אֶת לְבַ֖ב בְּנֵ֥י הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
translation:
  language: ta
  text: அப்பொழுது நீர் உமது வாசஸ்தலமாகிய பரலோகத்திலிருந்து கேட்டு, மன்னித்து, ஒவ்வொருவருடைய இருதயத்தையும் நீர் அறிந்தவராய், அவரவருடைய எல்லா வழிகளுக்கும் ஏற்ப அவரவருக்குக் கொடுப்பீராக; ஏனெனில் மனிதர்களின் இருதயங்களை அறிந்தவர் நீர் ஒருவரே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: கேட்டு
  rationale: சாலொமோனின் வேண்டுதல் தொடரில் இது வேண்டுகோள் பொருளுடைய வினையாக வருகிறது; தொடர்ந்து வரும் வினைகளோடு இயல்பான தமிழில் இணைக்கப்பட்டுள்ளது.
- source_word: מִן הַשָּׁמַיִם מְכוֹן שִׁבְתֶּךָ
  choice: உமது வாசஸ்தலமாகிய பரலோகத்திலிருந்து
  rationale: ‘வானங்களிலிருந்து, உமது வாசஸ்தலத்தின் இடம்’ என்ற எபிரெய அமைப்பின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְסָלַחְתָּ
  choice: மன்னித்து
  rationale: வேண்டுதலின் தொடர்ச்சியான செயலைக் குறிக்கிறது.
- source_word: וְנָתַתָּה לָאִישׁ כְּכָל דְּרָכָיו
  choice: அவரவருடைய வழிகளுக்கெல்லாம் ஏற்றபடி அவர்களுக்குக் கொடுப்பீராக
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடு’ என்பதையும், דְּרָכִים குறிக்கும் வாழ்க்கை நடத்தை என்ற உருவகத்தையும் தக்கவைக்கிறது; לָאִישׁ இங்கு பகிர்வுப் பொருளில் ஒவ்வொருவரையும் குறிக்கிறது.
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: ஒவ்வொருவருடைய இருதயத்தையும் நீர் அறிந்திருக்கிறபடியால்
  rationale: தீர்ப்பின் அடிப்படையாக உள்ள தனிநபரின் உள்ளார்ந்த நிலையை தேவன் அறிவதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְבָב
  choice: இருதயம்
  rationale: சிந்தனை, நோக்கம், சித்தம் உள்ளிட்ட உள்ளார்ந்த மனிதனைச் சுட்டும் வழக்கமான வேதாகமச் சொல்லைத் தக்கவைக்கிறது.
- source_word: כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ
  choice: ஏனெனில் ... அறிந்தவர் நீர் ஒருவரே
  rationale: காரண உறவையும் தேவனுடைய தனித்துவமான இருதய அறிவையும் வலியுறுத்துகிறது.
- source_word: בְּנֵי הָאָדָם
  choice: மனிதர்களின்
  rationale: எபிரெய மொழியின் சொற்படியான ‘மனிதனின் மகன்கள்’ என்பது மனிதகுலத்தினரைப் பொதுவாகக் குறிக்கும் மரபுத்தொடர்; நவீனத் தமிழில் ‘மனிதர்கள்’ அதன் உள்ளடக்கிய பொருளை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: בְּנֵי הָאָדָם என்ற மனிதவியல் மரபுத்தொடர்
  choice: மனிதர்களின்
  alternative: மனிதனின் மகன்களுடைய
  rationale: இந்தச் சூழலில் சொற்றொடர் ஆண் பிள்ளைகளை மட்டும் அல்லாமல் எல்லா மனிதர்களையும் குறிக்கிறது. தமிழில் சொற்படியான மாற்று தவறான குறுகிய பொருளைத் தரக்கூடும் என்பதால் பொதுமனிதப் பொருள் பயன்படுத்தப்பட்டது.
- issue: தனிநபருக்கேற்ற தெய்வீக மறுமொழி
  choice: அவரவருடைய வழிகளுக்கெல்லாம் ஏற்றபடி அவர்களுக்குக் கொடுப்பீராக
  alternative: அவரவருடைய செயல்களுக்கு ஏற்றபடி பலனளிப்பீராக
  rationale: நீதித்தீர்ப்பு அல்லது பலன் என்ற கருத்தை அளவுக்கு மீறித் தெளிவுபடுத்தாமல், மூலத்தின் ‘கொடு’ மற்றும் ‘வழிகள்’ என்ற சொற்களிலுள்ள பரப்பையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; ஜெபத்திற்குரிய மரியாதை நடையும் பொதுவாசகர்களுக்குப் புரியும் சொற்றொடர்களும் பயன்படுத்தப்பட்டுள்ளன. ‘நீர்/உமது’ வடிவங்கள் தெய்வத்தை நோக்கிய மரியாதையைக் காட்டுகின்றன. வசன முடிவிலுள்ள எபிரெயத் தொடரின் நிறைவற்ற ஓட்டம் தமிழில் முழுமையான காரண வாக்கியமாக இயல்புபடுத்தப்பட்டுள்ளது.
