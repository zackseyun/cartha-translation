lexical_decisions:
- source_word: יִנָּגֵף
  choice: தோற்கடிக்கப்பட்டாலும்
  rationale: நிஃபால் வடிவம் போரில் பகைவரிடம் தோல்வியடைவதைக் குறிக்கிறது. ‘தோற்கடிக்கப்படுதல்’ அதன் செயப்பாட்டு மற்றும் இராணுவச் சூழலை இயல்பான தமிழில் தருகிறது.
- source_word: לִפְנֵי אוֹיֵב
  choice: பகைவரின் முன்
  rationale: எபிரெயச் சொல்லாட்சியை நெருக்கமாகப் பேணுவதோடு, பகைவரின் முன்னிலையில் அல்லது அதிகாரத்தின்கீழ் தோல்வியுறும் கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: உமக்கு எதிராகப் பாவம் செய்ததால்
  rationale: כִּי இங்கு தோல்விக்கான காரணத்தைத் தருகிறது; לָךְ என்பது பாவம் தேவனுக்கு எதிரானது என்பதைச் சுட்டுகிறது.
- source_word: וְשָׁבוּ
  choice: மனந்திரும்பி
  rationale: שׁוב என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்’; இந்த உடன்படிக்கைச் சூழலில் அது பாவத்திலிருந்து தேவனிடம் திரும்புவதைச் சுட்டுவதால், இயல்பான தமிழில் ‘மனந்திரும்பி’ என வழங்கப்பட்டுள்ளது.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: உமது பெயரை அறிக்கையிட்டு
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் அறிக்கையிடுதல், துதித்தல் அல்லது நன்றி செலுத்துதல் என்று பொருள்படலாம். பாவத்திற்குப் பின் திரும்பும் இச்சூழலில் ‘பெயரை அறிக்கையிடுதல்’ மூலத்தின் திட்டமிட்ட தெளிவின்மையை அடிக்குறிப்புடன் பேணுகிறது.
- source_word: וְהִתְפַּלְלוּ
  choice: மன்றாடி
  rationale: தேவனை நோக்கிச் செய்யப்படும் விண்ணப்ப ஜெபத்தை நவீன, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: וְהִתְחַנְּנוּ
  choice: உமது அருளை வேண்டினால்
  rationale: חנן வேர்ச்சொல்லின் ஹித்பயேல் வடிவம் அருள் அல்லது தயவை ஆவலுடன் கோருவதைக் குறிக்கிறது; ‘அருளை வேண்டுதல்’ அந்த நுட்பத்தைத் தெளிவாகத் தருகிறது.
- source_word: לְפָנֶיךָ
  choice: உமது முன்னிலையில்
  rationale: தேவனுடைய சந்நிதியில் நேரடியாக விண்ணப்பிப்பதைக் குறிக்கும் எபிரெய வழக்கை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: בַּבַּיִת הַזֶּה
  choice: இந்த ஆலயத்தில்
  rationale: בית என்பதன் நேரடிப் பொருள் ‘வீடு’ என்றாலும், சாலொமோனின் அர்ப்பணிப்பு ஜெபச் சூழலில் இது ஆலயத்தைக் குறிக்கிறது; நவீன வாசகருக்குத் தெளிவாக ‘இந்த ஆலயம்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: וְשָׁבוּ என்பதில் திரும்புதல் மற்றும் மனந்திரும்புதல்
  choice: மனந்திரும்பி
  alternative: திரும்பி
  rationale: இது பாவத்தாலும் தோல்வியாலும் ஏற்பட்ட நிலையிலிருந்து தேவனை நோக்கித் திரும்பும் உடன்படிக்கைச் சூழல். ஆகவே ‘மனந்திரும்பி’ இயல்பாக இருந்தாலும், அதை ஒரு குறிப்பிட்ட சமயக் கோட்பாட்டுச் சொலாக மேலும் விரிவுபடுத்தவில்லை.
- issue: וְהוֹדוּ אֶת שְׁמֶךָ என்பதின் பொருள் வரம்பு
  choice: உமது பெயரை அறிக்கையிட்டு
  alternative: உமது பெயரைத் துதித்து / உமது பெயருக்கு நன்றி செலுத்தி
  rationale: ידה அறிக்கை, துதி, நன்றி ஆகிய பொருள் நிழல்களைக் கொண்டுள்ளது. மனந்திரும்புதலின் சூழல் ‘அறிக்கையிட்டு’ என்பதற்கு ஆதரவளிக்கிறது; பிற சாத்தியங்களை அடிக்குறிப்பு வெளிப்படையாகப் பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், தேவனை நோக்கிய கண்ணியமான ‘உமது/உமக்கு’ நடை பயன்படுத்தப்பட்டுள்ளது. தொடரும் வாக்கியத்தின் நிபந்தனைத் துணைப்பகுதி என்பதால் வசனம் காற்புள்ளியுடன் முடிகிறது. ‘இந்த ஆலயம்’ என்பது சூழலால் தெளிவாக்கப்பட்ட בית; சொற்சொல்லான ‘இந்த வீடு’ தவிர்க்கப்பட்டுள்ளது.
