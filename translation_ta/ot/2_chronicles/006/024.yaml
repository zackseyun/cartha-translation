  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
translation:
  language: ta
  text: உமது மக்களாகிய இஸ்ரவேலர் உமக்கு எதிராகப் பாவம் செய்ததினால் பகைவரின் முன் தோற்கடிக்கப்படும்போது, அவர்கள் திரும்பி, உமது பெயரை அறிக்கையிட்டு[a], இந்த ஆலயத்தில் உமது முன்னிலையில் ஜெபித்து, உமது அருளுக்காக மன்றாடினால்[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பெயரைத் துதித்து” அல்லது “உமது பெயருக்கு நன்றி செலுத்தி.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது இரக்கத்தை நாடினால்.”
