source:
  edition: WLC
  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
translation:
  language: ta
  text: அங்கே நான் பேழையை வைத்தேன். யாவே இஸ்ரவேலின் மக்களோடு[a] செய்த உடன்படிக்கை அதில் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “இஸ்ரவேலின் மகன்களோடு”; இது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கும் வழக்கமான பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: நான் வைத்தேன்
  rationale: שׂוּם என்பதன் அடிப்படைப் பொருள் ‘வை/நிறுத்து’. சூழலில் ஏற்கெனவே முடிந்த செயலை இயல்பான தமிழில் இறந்தகாலமாகத் தருகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட ஆலய இடத்தைக் குறிக்கும் இடவினையடை.
- source_word: הָאָרוֹן
  choice: பேழை
  rationale: உடன்படிக்கைப் பேழையைக் குறிக்கும் வழக்கமான, வழிபாட்டுச் சூழலுக்கு ஏற்ற தமிழ்ச் சொல்.
- source_word: אֲשֶׁר שָׁם
  choice: அதில் இருக்கிறது
  rationale: உடன்படிக்கை பேழையோடு உள்ள இடத்தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ‘உடன்படிக்கை’ என்பது அதற்குரிய பலகைகளைக் குறிக்கக்கூடிய ஆகுபெயர் என்பதை உரையில் விளக்கிச் சேர்க்கவில்லை.
- source_word: בְּרִית יְהוָה
  choice: யாவே ... செய்த உடன்படிக்கை
  rationale: בְּרִית என்பதற்கு ‘உடன்படிக்கை’ என்று மொழிபெயர்த்து, எபிரெயச் சொற்றொடரை அடுத்த உறவுவாக்கியோடு இயல்பான தமிழில் இணைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲשֶׁר כָּרַת
  choice: செய்த
  rationale: ‘உடன்படிக்கையை வெட்டுதல்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இன்றைய இயல்பான தமிழில் ‘உடன்படிக்கை செய்தல்’ எனத் தருகிறது.
- source_word: עִם
  choice: -ஓடு
  rationale: உடன்படிக்கை யாருடன் செய்யப்பட்டது என்பதைக் குறிக்கும் உடனிகழ்ச்சிப் பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுருவில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இது இஸ்ரவேல் சமூகமெங்கையும் குறிக்கும் நிலையான இனக்குழுப் பெயர்; ‘மக்கள்’ என்பது நவீன தமிழில் அதன் கூட்டுப்பொருளை இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதால் அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பு பாதுகாக்கப்படுகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்பதன் கூட்டுப்பொருள்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இத்தொடர் ஆண்களை மட்டும் குறிக்காமல் உடன்படிக்கையில் பங்குபெறும் இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது; அட்சரப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: உடன்படிக்கை பேழைக்குள் இருப்பதாகக் கூறப்படுதல்
  choice: உடன்படிக்கை அதில் இருக்கிறது
  alternative: உடன்படிக்கையின் பலகைகள் அதில் இருக்கின்றன
  rationale: மூல உரை ‘பலகைகள்’ என்று வெளிப்படையாகச் சொல்லாததால், அதன் ஆகுபெயர்ச் சுருக்கத்தையும் இறையியல் நுணுக்கத்தையும் விளக்கிச் சேர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் உறவுவாக்கியம் தமிழில் தெளிவாக அமைய இரண்டு வாக்கியங்களாக வழங்கப்பட்டுள்ளது; மூலத்தின் பொருள் மற்றும் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளன.
