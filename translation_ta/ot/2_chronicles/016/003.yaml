  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அரசதந்திர நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய இணை அமைப்பு இயன்றவரை பாதுகாக்கப்பட்டாலும், இறுதி மொழிவழக்கு தமிழில் இயல்பாக இருக்கிறது. மேற்கோள் குறிகள் இந்த வசனம் ஒரு தூதுச் செய்தியின் நேரடி உரை என்பதை வெளிப்படுத்துகின்றன.
