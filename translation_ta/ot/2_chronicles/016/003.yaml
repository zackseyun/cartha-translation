base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
translation:
  language: ta
  text: “எனக்கும் உனக்கும் இடையே, என் தந்தைக்கும் உன் தந்தைக்கும் இடையே ஓர் உடன்படிக்கை இருக்கிறது.[a] இதோ, நான் உனக்கு வெள்ளியையும் தங்கத்தையும் அனுப்பியிருக்கிறேன். நீ போய், இஸ்ரயேலின் அரசனான பாசாவுடனான உன் உடன்படிக்கையை முறித்துவிடு; அவன் என்னிடமிருந்து விலகிச் செல்லும்படி செய்.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“உடன்படிக்கை” என்பதற்கு “ஒப்பந்தம்” அல்லது “கூட்டணி” என்றும் மொழிபெயர்க்கலாம் (எபிரெயம்: בְּרִית). இங்கு அரசர்களுக்கிடையிலான அரசியல் ஒப்பந்தமே சூழல்.'
    reason: lexical_alternative
  - marker: b
    text: சொல்லாட்சிப்படி, “அவன் என்மேலிருந்து ஏறிச் செல்லும்படி.” பாசா ஆசாவுக்கு எதிராகக் கொடுத்துவந்த அழுத்தத்தை அல்லது இராணுவ நடவடிக்கையை நிறுத்தி விலக வேண்டும் என்பதே இங்கு பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: அரசர்களுக்கிடையிலான அரசியல் ஒப்பந்தத்தை இச்சூழலில் குறிக்கிறது. ‘உடன்படிக்கை’ என்பது எபிரெயச் சொல்லின் பரந்த பொருளையும், இங்கு அதன் அரசியல் பயன்பாட்டையும் இயல்பாகத் தக்கவைக்கிறது.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  choice: எனக்கும் உனக்கும் இடையிலும், என் தந்தைக்கும் உன் தந்தைக்கும் இடையிலும்
  rationale: மூலத்தில் ‘இடையில்’ என்ற உறவுமுறை மீண்டும் கூறப்படுவதால், அரசதந்திரச் சூத்திரத்தின் இணை அமைப்பு தமிழிலும் பாதுகாக்கப்படுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: அனுப்பப்பட்ட வெள்ளி மற்றும் தங்கத்தின் மீது கவனத்தை ஈர்க்கும் இயல்பான, கண்ணியமான நவீனத் தமிழ் சொல்.
- source_word: שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב
  choice: நான் உனக்கு வெள்ளியையும் தங்கத்தையும் அனுப்பியிருக்கிறேன்
  rationale: நிறைவேறிய செயல் தற்போதைய பேச்சுவார்த்தைக்குப் பொருத்தமுடையதாக இருப்பதை தமிழ் நிகழ்கால நிறைவுவடிவம் தெளிவாகக் காட்டுகிறது.
- source_word: לֵךְ
  choice: நீ போய்
  rationale: அடுத்த கட்டளையுடன் இயல்பாக இணையும் நேரடி கட்டளை வடிவம்.
- source_word: הָפֵר
  choice: முறித்துவிடு
  rationale: ஹிபீல் வடிவம் உடன்படிக்கையை ரத்துசெய்தல் அல்லது செல்லாததாக்குதல் என்னும் வலிமையான பொருளைக் கொண்டது; அரசியல் உடன்படிக்கைக்கு ‘முறித்துவிடு’ இயல்பான தமிழ்.
- source_word: בְּרִיתְךָ אֶת־בַּעְשָׁא
  choice: பாசாவுடன் செய்துள்ள உன் உடன்படிக்கை
  rationale: பாசாவைச் சார்ந்த உடன்படிக்கை உறவை தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரயேலின் அரசன்
  rationale: அரச பட்டத்தின் நேரடியான, நவீனத் தமிழ் வடிவம்.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: அப்போது அவன் என்னைவிட்டு விலகிச் செல்வான்
  rationale: சொல்லாட்சிப்படி ‘என்மேலிருந்து ஏறிச் செல்வான்’ என்றாலும், சூழலில் பாசா தனது இராணுவ அழுத்தத்தை நீக்கி விலகுவதை இந்தத் தமிழ் தெளிவாகக் கூறுகிறது; அடிப்படை மொழிப்படிமம் அடிக்குறிப்பில் தரப்படுகிறது.
