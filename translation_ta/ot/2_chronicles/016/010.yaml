  source_fidelity: 'முதன்மை உரை எபிரெய மூலத்தின் கருத்தை நன்றாகக் காக்கிறது: ஆசாவின் கோபம், தரிசனக்காரரை அடைத்தல், அதற்கான சீற்றம், மக்களில் சிலரை வன்மையாக ஒடுக்குதல் ஆகியவை சரியாக உள்ளன. ஆனால் அடிக்குறிப்பு a-இல் உள்ள “தொழுமரங்களின் வீடு” என்பது בֵּית הַמַּהְפֶּכֶת என்பதற்கான ஏற்ற மாற்றுமொழிபெயர்ப்பு அல்ல; ‘stocks’ என்பது உடலை நிலைநிறுத்தும்/விலங்கிடும் கருவியைக் குறிக்கிறது.'
