translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ஆசாவுக்கு ஒருமை ஆண்பால் வடிவமும், தரிசனக்காரருக்கு மரியாதைப் பன்மை வடிவமும் பயன்படுத்தப்பட்டுள்ளன. அரிய சிறைச்சொற்றொடரும் வன்மையான רצץ வினையும் பிரதான உரையில் தெளிவாக மொழிபெயர்க்கப்பட்டு, அவற்றின் உண்மையான சொற்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
