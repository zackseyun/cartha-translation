source:
  edition: WLC
  text: וַ/יִּכְעַ֨ס אָסָ֜א אֶל הָ/רֹאֶ֗ה וַֽ/יִּתְּנֵ֨/הוּ֙ בֵּ֣ית הַ/מַּהְפֶּ֔כֶת כִּֽי בְ/זַ֥עַף עִמּ֖/וֹ עַל זֹ֑את וַ/יְרַצֵּ֥ץ אָסָ֛א מִן הָ/עָ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/010.yaml
  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
translation:
  language: ta
  text: அப்போது ஆசா அந்தத் தரிசனக்காரர்மீது கோபமடைந்து, அவரைச் சிறையிடத்தில்[a] அடைத்தான்; ஏனெனில், இதற்காக அவன் அவர்மீது கடும் சீற்றம் கொண்டிருந்தான். அந்தக் காலத்தில் ஆசா மக்களில் சிலரைக் கொடுமையாக ஒடுக்கினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விலங்கிடும் மரக்கருவிகளின் வீடு”; எபிரெயச் சொற்றொடர் உடலைக் கட்டுப்படுத்தும் கருவிகளுடன் தொடர்புடைய சிறையிடத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஒடுக்கினான்” என்பதற்கான எபிரெய வினைச்சொல் சொற்படியாக “நசுக்கினான்” என்றும், சூழலில் “கடுமையாகத் துன்புறுத்தினான்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְעַס
  choice: கோபமடைந்து
  rationale: כעס கோபம் அல்லது மனக்கசப்பைக் குறிக்கிறது; கதைநடையின் தொடர்ச்சிக்கு ‘கோபமடைந்து’ இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: הָרֹאֶה
  choice: தரிசனக்காரர்
  rationale: רֹאֶה என்பது பழைய தீர்க்கதரிசனப் பதவிப்பெயராகிய ‘காண்பவர்/தரிசனக்காரர்’ என்பதைக் குறிக்கிறது; பொதுவான ‘தீர்க்கதரிசி’ என்பதைவிட மூலச்சொல்லின் தனித்தன்மையை இது காக்கிறது.
- source_word: וַיִּתְּנֵהוּ
  choice: அவரை ... அடைத்தான்
  rationale: נתן இங்கு ஒருவரை ஒரு காவல் இடத்தில் வைப்பதைக் குறிக்கிறது; தமிழில் சூழலுக்கேற்ற இயல்பான வடிவம் ‘அடைத்தான்’.
- source_word: בֵּית הַמַּהְפֶּכֶת
  choice: காவல் வீடு
  rationale: இந்த அரிய சொற்றொடர் கட்டுப்படுத்தும் கருவிகளோடு தொடர்புடைய சிறையிடத்தைக் குறிக்கக்கூடும். ‘காவல் வீடு’ இடம்/வீடு என்ற கூறையும் சிறையிடும் செயலையும் காக்கிறது; குறிப்பான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְזַעַף עִמּוֹ
  choice: அவர்மீது கடும் சீற்றம் கொண்டிருந்தான்
  rationale: זַעַף தீவிரமான சினம் அல்லது சீற்றத்தைக் குறிக்கிறது; இந்தத் தமிழ் சொற்றொடர் அதன் வலிமையையும் עִמּוֹ காட்டும் நபர்நோக்கிய உணர்வையும் வெளிப்படுத்துகிறது.
- source_word: עַל זֹאת
  choice: இதனால்
  rationale: முன்பு கூறப்பட்ட கண்டிப்பே ஆசாவின் சீற்றத்திற்குக் காரணம் என்பதைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: וַיְרַצֵּץ
  choice: கொடுமையாக ஒடுக்கினான்
  rationale: רצץ என்பதன் பியேல் வடிவம் நசுக்குதல் அல்லது கடுமையாகத் துன்புறுத்துதல் என்ற வன்மையான கருத்தைக் கொண்டுள்ளது. மனிதர்களைப் பொருளாகக் கொண்ட இச்சூழலில் ‘கொடுமையாக ஒடுக்கினான்’ அந்த வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מִן הָעָם
  choice: மக்களில் சிலரை
  rationale: מן இங்கு பகுதியைக் குறிக்கிறது; மக்கள் அனைவரையும் அல்ல, அவர்களில் சிலரைச் சுட்டுகிறது.
- source_word: בָּעֵת הַהִיא
  choice: அந்தக் காலத்தில்
  rationale: எபிரெயத் காலக்குறிப்பிற்கான இயல்பான நவீனத் தமிழ் வடிவம்.
