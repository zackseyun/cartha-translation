base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: ta
  text: ஆசாவின் ஆட்சியின் முப்பத்தாறாம் ஆண்டில்[a], இஸ்ரவேலின் அரசனான பாசா யூதாவுக்கு எதிராகப் படையெடுத்து வந்து, யூதாவின் அரசனான ஆசாவிடம் யாரும் செல்லவோ அவரிடமிருந்து வரவோ முடியாதபடி ராமாவைக் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய உரை: “ஆசாவின் ஆட்சியின் முப்பத்தாறாம் ஆண்டில்.” இது பாசாவின் காலத்தைப் பற்றி 1 அரசர்கள் தரும் காலவரிசையுடன் ஒரு காலவரிசைச் சிக்கலை ஏற்படுத்துகிறது. சிலர் இதை அரசாட்சி பிரிந்ததிலிருந்து கணக்கிடப்பட்ட ஆண்டாகப் புரிந்துகொள்கிறார்கள்; வேறு சிலர் காலவரிசையை ஒத்திசைக்க மூல உரையில் ஓர் எண்ணியல் திருத்தத்தை முன்மொழிகிறார்கள்.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וָ/שֵׁשׁ
  choice: முப்பத்தாறாம் ஆண்டில்
  rationale: காலத்தைக் குறிக்கும் ב முன்னொட்டுடன் வந்த எபிரெயக் கட்டமைப்பை இயல்பான நவீனத் தமிழில் வரிசை எண்ணாகத் தருகிறது.
- source_word: לְ/מַלְכ֣וּת אָסָא
  choice: ஆசாவின் ஆட்சியின்
  rationale: מַלְכוּת இங்கு அரசனாக ஆட்சி செய்த காலத்தைக் குறிக்கிறது; ‘ஆட்சி’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: עָלָה ... עַל יְהוּדָה
  choice: யூதாவுக்கு எதிராகப் படையெடுத்து வந்து
  rationale: இராணுவச் சூழலில் עלה ... על என்பது எதிராக முன்னேறுவதைக் குறிக்கிறது. ‘படையெடுத்து வந்து’ சூழலைத் தெளிவாக்குகிறது; வெற்றி அல்லது முற்றுகை போன்ற கூடுதல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: וַ/יִּבֶן אֶת הָ/רָמָה
  choice: ராமாவைக் கட்டினான்
  rationale: בנה என்பதன் அடிப்படைப் பொருளான ‘கட்டு’ என்பதையே தக்கவைக்கிறது. சூழல் அரணமைத்தலைக் குறிப்பதாக இருக்கலாம்; ஆனால் அந்தக் கருத்தை வினைச்சொல்லுக்குள் கட்டாயமாகச் சேர்க்கவில்லை.
- source_word: הָ/רָמָה
  choice: ராமா
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְ/בִלְתִּי תֵּת
  choice: முடியாதபடி
  rationale: நோக்கம் அல்லது தடுத்தலைக் குறிக்கும் இக்கட்டமைப்பைச் சுருக்கமான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יוֹצֵא וָ/בָא
  choice: வெளியே செல்லவோ உள்ளே வரவோ
  rationale: இயக்கத்தையும் அணுகலையும் குறிக்கும் எபிரெய இணைச்சொல் அமைப்பின் இரு கூறுகளையும் தக்கவைக்கிறது.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசனான ஆசாவிடம்
  rationale: ל முன்னிடைச்சொல் இங்கு ஆசாவை நோக்கிய அல்லது அவருடன் தொடர்புடைய அணுகலைக் குறிக்கிறது. ‘ஆசாவிடம்’ மூலத்தின் திசை/தொடர்பு உணர்வை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: அரசர்கள் நூலில் பாசாவின் ஆட்சிக்காலத்துடன் தோன்றும் காலக்கணக்குப் பதற்றம்
  choice: மசோரெட்டிக் எபிரெய உரையிலுள்ள ‘ஆசாவின் ஆட்சியின் முப்பத்தாறாம் ஆண்டு’ என்பதையே முதன்மை உரையில் வைத்தல்
  alternative: பிரிந்த அரசாட்சி தொடங்கியதிலிருந்து முப்பத்தாறாம் ஆண்டு என்று கணித்தல்; அல்லது ஆசாவின் இருபத்தாறாம் ஆண்டு என உரையைத் திருத்துதல்
  rationale: எபிரெய உரை தெளிவாக ‘ஆசாவின் ஆட்சியின் முப்பத்தாறாம் ஆண்டு’ என்று வாசிக்கிறது. காலக்கணக்குச் சிக்கலை மொழிபெயர்ப்பில் மறைவாகத் திருத்தாமல், பதற்றத்தை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுவது மூல உரைக்கு உண்மையாகும்.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, கண்ணியமான வரலாற்று உரைநடை. ‘படையெடுத்து வந்து’ இராணுவச் சூழலை இயல்பாகத் தருகிறது. ‘ராமாவைக் கட்டினான்’ என்பது அரணமைத்தான் என்று அதிகமாக விளக்காமல் בנה என்பதன் நேரடிப் பொருளைத் தக்கவைக்கிறது. முதன்மை உரையிலுள்ள [a] குறியீடு அடிக்குறிப்புடன் பொருந்துகிறது.
