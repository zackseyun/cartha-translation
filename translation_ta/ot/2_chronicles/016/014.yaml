  text: וַ/יִּקְבְּרֻ֣/הוּ בְ/קִבְרֹתָ֗י/ו אֲשֶׁ֣ר כָּֽרָה ל/וֹ֮ בְּ/עִ֣יר דָּוִיד֒ וַ/יַּשְׁכִּיבֻ֗/הוּ בַּ/מִּשְׁכָּב֙ אֲשֶׁ֤ר מִלֵּא֙ בְּשָׂמִ֣ים וּ/זְנִ֔ים מְרֻקָּחִ֖ים בְּ/מִרְקַ֣חַת מַעֲשֶׂ֑ה וַ/יִּשְׂרְפוּ ל֥/וֹ שְׂרֵפָ֖ה גְּדוֹלָ֥ה עַד לִ/מְאֹֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
translation:
  language: ta
  text: அவரைத் தாவீதின் நகரத்தில் அவர் தனக்காக வெட்டி அமைத்திருந்த கல்லறையில்[a] அடக்கம் செய்தார்கள். நறுமணப் பொருள்களாலும், நறுமணக் கலவை செய்பவரின் திறமையால் செய்யப்பட்ட பலவகைக் கலவைகளாலும் நிரப்பப்பட்டிருந்த படுக்கையில்[b] அவரைக் கிடத்தினார்கள். மேலும், அவருக்காக மிகப் பெரிய எரிப்பை நடத்தினார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இச்சொல் இலக்கணப்படி பன்மையில், ‘அவருடைய கல்லறைகளில்’ என்று உள்ளது; அது ஓர் அரச கல்லறை வளாகத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘படுக்கை’ என்பதற்கான எபிரெயச் சொல் ‘படுக்கும் இடம்’, ‘மஞ்சம்’ அல்லது இறுதிச்சடங்கில் உடலை வைக்கும் ‘பாடை’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: எரிக்கப்பட்டது எது என்று எபிரெய உரை குறிப்பிடவில்லை. இது உடலைத் தகனம் செய்ததைக் காட்டிலும், இறுதிச்சடங்கில் மரியாதைக்காக நறுமணப் பொருள்களை எரித்ததைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவரை ... அடக்கம் செய்தார்கள்
  rationale: קבר என்பதன் நேரடியான அடக்கச் சூழலை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בְקִבְרֹתָיו
  choice: அவருடைய கல்லறையில்
  rationale: எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், சூழலில் அது அவருக்குரிய ஒரே அரச கல்லறை அல்லது கல்லறை வளாகத்தைக் குறிக்கலாம்; இயல்பான தமிழுக்காக ஒருமை பயன்படுத்தப்பட்டு, வடிவ வேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்பட்டது.
- source_word: אֲשֶׁר כָּרָה לוֹ
  choice: அவர் தனக்காக வெட்டி அமைத்திருந்த
  rationale: כרה என்பது தோண்டுதல் அல்லது வெட்டி உருவாக்குதல் என்று பொருள்படும்; பாறைக் கல்லறைச் சூழலுக்கு ‘வெட்டி அமைத்திருந்த’ பொருத்தமானதும் இயல்பானதும்.
- source_word: בְּעִיר דָּוִיד
  choice: தாவீதின் நகரத்தில்
  rationale: இடப்பெயரின் தெளிவான, வழக்கமான தமிழ் வடிவம்.
- source_word: וַיַּשְׁכִּיבֻהוּ
  choice: அவரைக் கிடத்தினார்கள்
  rationale: שׁכב என்பதன் ஹிஃபில் வடிவம் உடலைப் படுக்கச் செய்ததை அல்லது கிடத்தியதைச் சுட்டுகிறது.
- source_word: בַּמִּשְׁכָּב
  choice: படுக்கையில்
  rationale: מִשְׁכָּב அடிப்படையில் படுக்கை அல்லது படுக்கும் இடம்; இறுதிச்சடங்குச் சூழலில் உடலை வைக்கும் பாடை அல்லது மஞ்சத்தையும் குறிக்கலாம். முதன்மைச் சொற்பொருளைத் தக்கவைத்து மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டன.
- source_word: בְּשָׂמִים
  choice: நறுமணப் பொருள்களால்
  rationale: அடக்கச் சடங்கில் பயன்படுத்தப்பட்ட வாசனைமிக்க மசாலா அல்லது நறுமணப் பொருள்களைக் குறிக்கும் அணுகத்தக்க பொதுப்பெயர்.
- source_word: וּזְנִים
  choice: பலவகைக் கலவைகள்
  rationale: அரிதான இச்சொல் பல வகைகள் அல்லது நறுமணக் கூட்டுப்பொருள்கள் எனப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது; அதன் உறுதியின்மையை மிகத் துல்லியமாக்காமல் மொழிபெயர்க்கிறது.
- source_word: מְרֻקָּחִים בְּמִרְקַחַת מַעֲשֶׂה
  choice: நறுமணக் கலவை தயாரிப்பவரின் கைவினைப்படி தயாரிக்கப்பட்ட
  rationale: רקח வேரின் கலத்தல் அல்லது வாசனைக்கலவை செய்தல் என்ற பொருளையும், திறமைமிக்க கைவினை என்ற தொடரின் கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְדוֹלָה עַד־לִמְאֹד
  choice: அவருக்காக மிகப் பெரிய எரிப்பை நடத்தினார்கள்
  rationale: எபிரெயச் சொல்லாடலின் ‘எரிப்பு’ என்பதைத் தக்கவைத்து, உடல் தகனம் என்று தீர்மானித்துக் கூறாமல் சடங்குச் செயலைக் குறிக்கிறது.
theological_decisions:
- issue: இறுதிச்சடங்கு எரிப்பின் பொருள்
  choice: ஆசாவின் உடல் தகனம் செய்யப்பட்டதாகக் கூறாமல், அவருக்காக நடத்தப்பட்ட மிகப் பெரிய சடங்கு எரிப்பு என மொழிபெயர்க்கப்பட்டது.
  alternative: அவருடைய உடலைத் தகனம் செய்தார்கள்; அல்லது அவருடைய மரியாதைக்காக நறுமணப் பொருள்களை எரித்தார்கள்.
  rationale: வசனம் முதலில் அவர் அடக்கம் செய்யப்பட்டதையும் கிடத்தப்பட்டதையும் கூறுகிறது; பின்னர் ‘அவருக்காக’ எரிப்பு நடத்தப்பட்டதாகச் சொல்கிறது. எரிக்கப்பட்ட பொருள் மூலத்தில் வெளிப்படையாகக் கூறப்படாததால், மொழிபெயர்ப்பு அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘படுக்கை’ மற்றும் ‘எரிப்பு’ போன்ற மூலத்தின் தெளிவின்மையைத் தக்கவைத்து, தேவையான விளக்கங்கள் அடிக்குறிப்புகளில் வழங்கப்பட்டன.
