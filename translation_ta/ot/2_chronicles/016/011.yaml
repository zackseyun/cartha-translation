reference: 2 Chronicles 16:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הִנֵּה֙ דִּבְרֵ֣י אָסָ֔א הָ/רִאשׁוֹנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הִנָּ֤/ם כְּתוּבִים֙ עַל סֵ֣פֶר הַ/מְּלָכִ֔ים לִ/יהוּדָ֖ה וְ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/011.yaml
  text: Behold[a], the acts of Asa, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: ta
  text: இதோ, ஆசாவின் தொடக்ககாலச் செயல்களும் பிற்காலச் செயல்களும்[a] யூதா மற்றும் இஸ்ரவேல் அரசர்களின் நூலில் எழுதப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்ல, “ஆசாவின் காரியங்கள்—முந்தினவையும் பிந்தினவையும்” என்று மொழிபெயர்க்கலாம்.
    reason: ‘செயல்கள்’ என்பது வரலாற்றுச் சூழலுக்கேற்ற பொருளையும், ‘தொடக்ககாலம்… பிற்காலம்’ என்பது எபிரெய மரபுத்தொடரின் இயல்பான பொருளையும் தருகின்றன; சொற்சார்ந்த மாற்றை இக்குறிப்பு பாதுகாக்கிறது.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: முடிவுரைக் குறிப்பின்மீது கவனத்தை ஈர்க்கும் எபிரெயச் சுட்டிடைச்சொல்லின் வலிமையை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: דִּבְרֵי
  choice: செயல்கள்
  rationale: அரசர்களைப் பற்றிய வரலாற்றுச் சுருக்கங்களில் இச்சொல் வெறும் பேச்சுகளைக் குறிக்காமல், அவர்களின் செயல்களையும் அவர்களைப் பற்றிய நிகழ்வுகளையும் பரந்த வகையில் குறிக்கிறது.
- source_word: הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים
  choice: தொடக்ககாலச் செயல்களும் பிற்காலச் செயல்களும்
  rationale: ‘முந்தினவையும் பிந்தினவையும்’ என்ற எபிரெய இணையை இயல்பான நவீன தமிழில் வெளிப்படுத்தி, ஆசாவின் ஆட்சிக்காலத்தின் முழுப் பரப்பையும் உணர்த்துகிறது.
- source_word: הִנָּם כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: அந்தச் செயல்கள் ஒரு நூலில் பதிவாகி இருப்பதைத் தெளிவாகவும் மூலத்தின் நிறைவேற்றப்பட்ட நிலையைத் தக்கவைத்தும் கூறுகிறது; தமிழில் எழுவாயின் அமைப்பும் தொடக்கத்திலுள்ள ‘இதோ’வும் சுட்டும் வலிமையைப் போதுமான அளவு ஏந்துகின்றன.
- source_word: עַל סֵפֶר
  choice: நூலில்
  rationale: சொல்லுக்குச் சொல் ‘நூலின்மேல்’ என இருந்தாலும், எழுதப்பட்ட ஆதாரத்தைக் குறிப்பிடும் இச்சூழலில் ‘நூலில்’ என்பதே இயல்பான தமிழ்.
- source_word: הַמְּלָכִים לִיהוּדָה וְיִשְׂרָאֵל
  choice: யூதா மற்றும் இஸ்ரவேல் அரசர்களின் நூல்
  rationale: எழுத்தில் வெளிப்படையாக உள்ள ‘அரசர்கள்’ மற்றும் இரு நாடுகளுடனான தொடர்பைத் தக்கவைக்கிறது; ‘வரலாற்றுப் பதிவுகள்’ போன்ற விளக்க விரிவாக்கத்தைச் சேர்க்கவில்லை.
