translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையானதும் கண்ணியமானதுமான வரலாற்று நடையைப் பயன்படுத்துகிறது. ‘ராஜா/புத்தகம்’ என்பவற்றுக்கு மாற்றாகத் தற்போதைய பொதுநடைக்கேற்ற ‘அரசர்/நூல்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் இருமுறை வரும் சுட்டும் வலிமை தமிழில் செயற்கையாக ஒலிக்காதபடி தொடக்க ‘இதோ’ மற்றும் வாக்கிய அமைப்பின் மூலம் வெளிப்படுத்தப்பட்டுள்ளது.
