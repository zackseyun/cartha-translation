  edition: WLC
  text: וַ/יִּשְׁכַּ֥ב אָסָ֖א עִם אֲבֹתָ֑י/ו וַ/יָּ֕מָת בִּ/שְׁנַ֛ת אַרְבָּעִ֥ים וְ/אַחַ֖ת לְ/מָלְכֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/013.yaml
  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
translation:
  language: ta
  text: ஆசா தன் முன்னோர்களோடு துயிலடைந்தான்[a]; அவன் தன் ஆட்சியின் நாற்பத்தொன்றாம் ஆண்டில் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “தன் முன்னோர்களோடு துயிலடைந்தான்.” இது மரணத்தையும், சூழலைப் பொறுத்து முன்னோர்களுடன் அடக்கம் செய்யப்படுவதையும் குறிக்கும் வழக்கமான மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தான்
  rationale: இது அரசர்களைப் பற்றிய எபிரெய வரலாற்று நூல்களில் மரணத்தைக் குறிக்கும் வழக்கமான மரபுத்தொடரின் ஒரு பகுதி. அடுத்த வினைச்சொல் மரணத்தை வெளிப்படையாகக் கூறுவதால், இதை வெறுமனே ‘இறந்தான்’ என்று மாற்றாமல் மூலத்தின் உருவகத்தைப் பேணுகிறது.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: சொல்லுக்குச் சொல் ‘தன் தந்தையரோடு’ என இருந்தாலும், இங்கு அது ஆசாவின் தந்தையை மட்டும் அல்லாமல் முந்தைய தலைமுறையினரையும் குறிக்கும். ‘முன்னோர்கள்’ என்பது இயல்பான நவீனத் தமிழில் குடும்ப மற்றும் வம்சத் தொடர்பைப் பேணுகிறது.
- source_word: וַיָּמָת
  choice: இறந்தான்
  rationale: מות என்ற வினைச்சொல்லின் நேரடியான பொருள். முன்னுள்ள மரபுத்தொடருடன் சேர்த்து எபிரெயம் இதையும் தனியாகக் கூறுவதால், மொழிபெயர்ப்பிலும் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  choice: நாற்பத்தொன்றாம் ஆண்டில்
  rationale: அரசாட்சிக் காலத்தைக் கணக்கிடும் இச்சூழலில் எபிரெய எண்ணிக்கை வரிசை எண்ணின் பொருளைத் தருகிறது; தமிழில் ‘நாற்பத்தொன்றாம் ஆண்டு’ இயல்பான வடிவம்.
- source_word: לְמָלְכוֹ
  choice: தன் ஆட்சியின்
  rationale: ஆசா அரசனாக ஆட்சி செய்த காலத்தைச் சுட்டும் காலக்கணிப்பு. ‘ஆட்சி’ என்பது நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אָסָא
  choice: ஆசா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ‘தன் முன்னோர்களோடு துயிலடைந்தான்’ என்ற மரபுத்தொடர் மரணத்தை மட்டுமா, அடக்கத்தையும் குறிக்கிறதா?
  choice: மரபுத்தொடரை அப்படியே உருவகமாகப் பேணி, முதன்மை உரையில் அடக்கம் என்று வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: ‘முன்னோர்களுடன் அடக்கம் செய்யப்பட்டான்’ அல்லது வெறுமனே ‘இறந்தான்’ என்று மொழிபெயர்த்தல்.
  rationale: இத்தொடர் மரணம் மற்றும் முன்னோர்களோடு சேர்தல் பற்றிய அரசவழக்குச் சொல்லாகும்; ஆனால் இவ்வசனத்தில் அடக்கம் தனி வினைச்சொல்லால் வெளிப்படையாகக் கூறப்படவில்லை. எனவே சாத்தியமான அடக்கப் பொருளை உரையில் கட்டாயப்படுத்தாமல், மூலத்தின் தெளிவின்மையையும் அடுத்துள்ள ‘இறந்தான்’ என்பதையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதே நேரத்தில் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயத்தில் உள்ள இரண்டு தனித்த கூற்றுகளையும் காட்ட அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற பழந்தமிழ் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
