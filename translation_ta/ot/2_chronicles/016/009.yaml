source:
  edition: WLC
  text: כִּ֣י יְהוָ֗ה עֵינָ֞י/ו מְשֹׁטְט֤וֹת בְּ/כָל הָ/אָ֨רֶץ֙ לְ֠/הִתְחַזֵּק עִם לְבָבָ֥/ם שָׁלֵ֛ם אֵלָ֖י/ו נִסְכַּ֣לְתָּ עַל זֹ֑את כִּ֣י מֵ/עַ֔תָּה יֵ֥שׁ עִמְּ/ךָ֖ מִלְחָמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
translation:
  language: ta
  text: ஏனெனில், யாவேக்கு முழு இதயத்தோடு உண்மையாயிருப்பவர்களை வலுப்படுத்துவதற்காக[a] யாவேயின் கண்கள் பூமியெங்கும் சுற்றித் திரிகின்றன. இதில் நீ மதியீனமாக நடந்துகொண்டாய்; இப்போதுமுதல் உனக்குப் போர்கள் இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கு முழு இதயத்தோடு உண்மையாயிருப்பவர்களுக்காகத் தமது வல்லமையைக் வெளிப்படுத்துவதற்கு.”
    reason: לְהִתְחַזֵּק என்பதற்கு இச்சூழலில் ‘வலுப்படுத்துதல்’ என்பதோடு ‘தம் வல்லமையைக் காட்டுதல்/வெளிப்படுத்துதல்’ என்ற பொருளும் சாத்தியம்; மூலத்தின் பொருள் நிழலைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப் பெயரைப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: עֵינָיו מְשֹׁטְטוֹת
  choice: யெகோவாவின் கண்கள் ... உலாவுகின்றன
  rationale: இறைவனின் பார்வையையும் அக்கறையையும் குறிக்கும் மனித உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது; எபிரெயப் பன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּכָל הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: இக்கூற்றின் உலகளாவிய தொனியைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לְהִתְחַזֵּק עִם
  choice: வலுப்படுத்துவதற்காக
  rationale: இங்கு வினை, யெகோவா முழு இதயத்தோடு தம்மைச் சார்ந்திருப்பவர்களுக்கு வலிமையான ஆதரவு அளிப்பதைக் குறிக்கிறது; சாத்தியமான தற்சுட்டுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְבָבָם שָׁלֵם אֵלָיו
  choice: தம்மை முழு இதயத்துடன் சார்ந்திருப்பவர்களை
  rationale: שָׁלֵם என்பதைக் குறையற்ற பாவமின்மையாக அல்லாமல், பிளவுபடாத முழுமையான நம்பிக்கையும் பற்றுறுதியுமாகச் சொல்கிறது; சூழலில் ஆசா யெகோவாவைச் சாராமல் மனித உதவியைச் சார்ந்ததற்கான கண்டனத்தோடும் பொருந்துகிறது.
- source_word: נִסְכַּלְתָּ עַל זֹאת
  choice: இந்தக் காரியத்தில் நீ மதியீனமாக நடந்துகொண்டாய்
  rationale: தீர்க்கதரிசனக் கண்டனத்தின் வலிமையைப் பாதுகாத்து, நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: מֵעַתָּה יֵשׁ עִמְּךָ מִלְחָמוֹת
  choice: இப்போதுமுதல் உனக்குப் போர்கள் இருக்கும்
  rationale: எபிரெய இருப்புக் கட்டமைப்பின் எதிர்கால விளைவைத் தெளிவாகக் கூறி, தொடரும் போர்களைக் குறிக்கிறது.
theological_decisions:
- issue: שָׁלֵם என்ற சொல் இதயத்தை விவரிக்கும் விதம்
  choice: பிளவுபடாத முழு இதயச் சார்பு
  alternative: அவருக்கு முன்பாகக் குறையற்ற இதயம்
  rationale: சூழல் பாவமற்ற பரிபூரணத்தைப் பற்றியதல்ல; யெகோவாவை முழுமையாக நம்பிச் சாரும் உடன்படிக்கைப் பற்றுறுதியைப் பற்றியது.
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: பூமியெங்கும்
  alternative: நாடெங்கும்
  rationale: இக்கூற்று யூதாவுக்கு மட்டும் கட்டுப்படாமல், யெகோவாவின் எங்குமுள்ள தேடிப் பார்க்கும் கண்காணிப்பை உலகளாவிய தொனியில் உரைக்கிறது.
- issue: לְהִתְחַזֵּק என்பதன் செயற்பாடு
  choice: அவர்களை வலுப்படுத்துதல்
  alternative: அவர்களுக்காகத் தம்முடைய வல்லமையைக் காட்டுதல்
  rationale: இரு பொருள்களும் எபிரெய வடிவத்துடன் சாத்தியம். முதன்மை உரை பயனாளிகளுக்கு ஆதரவளிக்கும் பொருளை இயல்பான தமிழில் தருகிறது; தற்சுட்டு/செயற்பாட்டு நிழற்பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையில் மரியாதையும் தீர்க்கதரிசனக் கண்டனத்தின் நேர்த்தியும் காக்கப்பட்டுள்ளன. ‘முழு இதயத்துடன் சார்ந்திருப்பவர்கள்’ என்பது பாவமின்மையை அல்ல, பிளவுபடாத நம்பிக்கையைச் சுட்டுகிறது.
