source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ אֶל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכּוּ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל מָ֑יִם וְ/אֵ֥ת כָּֽל מִסְכְּנ֖וֹת עָרֵ֥י נַפְתָּלִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
translation:
  language: ta
  text: பெனாதாத் ஆசா அரசனுக்குச் செவிகொடுத்து, தன் படைகளின் தளபதிகளை இஸ்ரயேலின் நகரங்களுக்கு எதிராக அனுப்பினான். அவர்கள் ஈயோன், தாண், ஆபேல்-மாயிம்[a], நப்தலியின் எல்லாக் களஞ்சிய நகரங்கள் ஆகியவற்றைத் தாக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு எபிரேய மூலப்பாடத்தில் “ஆபேல்-மாயிம்” என்று உள்ளது; இணை நிகழ்ச்சிகளைச் சொல்லும் பகுதிகளில் காணப்படும் “ஆபேல்-பெத்-மாக்கா” என்ற இடத்துடன் இதைச் சிலர் அடையாளப்படுத்துகின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: செவிகொடுத்து
  rationale: ஆசாவின் வேண்டுகோளை பெனாதாத் கேட்டு அதன்படி செயல்பட்டதை இது இயல்பாகக் காட்டுகிறது; ‘கீழ்ப்படிந்தான்’ என்று பொருளை மிகைப்படுத்தவில்லை.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: தன் படைகளின் தளபதிகளை
  rationale: שָׂרֵי என்பது இராணுவத் தலைவர்களையும், הַחֲיָלִים என்பது படைகளையும் குறிக்கிறது; אֲשֶׁר לוֹ தரும் உடைமைப் பொருளை ‘தன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל עָרֵי יִשְׂרָאֵל
  choice: இஸ்ரயேலின் நகரங்களுக்கு எதிராக
  rationale: இராணுவ நடவடிக்கையின் இலக்கை אֶל குறிக்கும் சூழலில், ‘எதிராக’ என்பது தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: וַיַּכּוּ
  choice: தாக்கினார்கள்
  rationale: נכה என்ற வினை இராணுவச் சூழலில் தாக்குதல் அல்லது முறியடித்தலைக் குறிக்கலாம். விளைவைத் தேவையின்றி நிர்ணயிக்காமல் செயலைத் தெளிவாகக் கூற ‘தாக்கினார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עִיּוֹן
  choice: ஈயோன்
  rationale: எபிரேய இடப்பெயரின் ஒலிப்பைத் தமிழில் அண்மையாகப் பெயர்த்தெழுதுகிறது.
- source_word: דָּן
  choice: தாண்
  rationale: எபிரேய இடப்பெயரைத் தமிழில் வழக்கமான வேதாகமப் பெயர்வடிவில் தருகிறது.
- source_word: אָבֵל מָיִם
  choice: ஆபேல்-மாயிம்
  rationale: இணை வசனத்துடன் ஒத்திசைக்காமல், இங்குள்ள எபிரேய மூலப்பாடத்தின் இடப்பெயரை நேரடியாகப் பெயர்த்தெழுதுகிறது.
- source_word: מִסְכְּנוֹת עָרֵי נַפְתָּלִי
  choice: நப்தலியின் எல்லாக் களஞ்சிய நகரங்கள்
  rationale: מִסְכְּנוֹת என்பது பொருட்கள் அல்லது வழங்கல்களைச் சேமிக்கும் இடங்களைக் குறிக்கிறது; ‘களஞ்சிய நகரங்கள்’ பொருளையும் நகரங்களின் செயல்பாட்டையும் தெளிவாகத் தருகிறது.
