- from: கூஷியர்களும் லூபியர்களும் மிகப் பெரும் படையாகவும், ஏராளமான தேர்களையும் குதிரைவீரர்களையும் உடையவர்களாகவும் இருந்தார்கள் அல்லவா?[a] ஆனாலும் நீ யெகோவாவைச் சார்ந்தபோது, அவர் அவர்களை உன் கையில் ஒப்புக்கொடுத்தார்.
