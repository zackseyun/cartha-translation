base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
translation:
  language: ta
  text: கூஷியர்களும் லூபியர்களும் மிகப் பெரிய படையாக இருந்தார்கள் அல்லவா? அவர்களிடம் தேர்களும் குதிரைவீரர்களும் மிக அதிகமாக இருந்தன அல்லவா?[a] ஆனாலும், நீ யாவேவைச் சார்ந்தபோது, அவர் அவர்களை உன் கையில் ஒப்புக்கொடுத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எத்தியோப்பியர்களும் லிபியர்களும்.” மூல எபிரேய இனப்பெயர்களுக்கு நெருக்கமாக இருக்க இங்கே “கூஷியர்கள்,” “லூபியர்கள்” என்று கொடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: இருந்தார்கள் அல்லவா?
  rationale: உறுதியான ‘ஆம்’ என்ற பதிலை எதிர்பார்க்கும் எபிரேய வினாவியல் அமைப்பின் சொல்லாட்சியையும் வலிமையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: הַכּוּשִׁים וְהַלּוּבִים
  choice: கூஷியர்களும் லூபியர்களும்
  rationale: பிற்கால நாடுகளுடன் மிகையாக அடையாளப்படுத்தாமல், மூலத்திலுள்ள இனப்பெயர்களை ஒலிபெயர்த்து வழங்குகிறது.
- source_word: הָיוּ לְחַיִל לָרֹב
  choice: மிகப் பெரும் படையாக
  rationale: חַיִל இச்சூழலில் செல்வத்தையோ தனிப்பட்ட வீரத்தையோ அல்ல, போர்ப்படையைக் குறிக்கிறது; לָרֹב அதன் பெரும் அளவை வலியுறுத்துகிறது.
- source_word: לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד
  choice: ஏராளமான தேர்களையும் குதிரைவீரர்களையும் உடையவர்களாக
  rationale: இராணுவ வளங்களைச் சுட்டும் இயல்பான தமிழ்; מְאֹד தரும் மிகுதியான வலியுறுத்தலையும் ‘ஏராளமான’ என்பதில் வெளிப்படுத்துகிறது.
- source_word: וּבְהִשָּׁעֶנְךָ עַל
  choice: ஆனாலும் நீ ... சார்ந்தபோது
  rationale: נשען என்பதன் உருவகப் பொருளான நம்பிச் சார்ந்திருத்தலைத் தெரிவிக்கிறது; சூழலிலுள்ள முரண்பாட்டை ‘ஆனாலும்’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநாமத்தை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் தமிழில் நிலைபெற்ற நேரடி பெயர்வடிவத்தில் வழங்குகிறது.
- source_word: נְתָנָם בְּיָדֶךָ
  choice: அவர்களை உன் கையில் ஒப்புக்கொடுத்தார்
  rationale: எதிரிகள்மேல் வெற்றி அளித்தல் என்ற எபிரேய மரபுத்தொடரின் கை உருவகத்தைத் தக்கவைத்தபடி தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைநாமமே இருப்பதால் பட்டப்பெயரைப் பதிலிடாமல் பெயராகவே வழங்கப்படுகிறது. ‘யெகோவா’ என்பது நவீன தமிழ் வாசகர்களிடையே நிலைபெற்று, எளிதில் அடையாளம் காணப்படும் வடிவம்; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டமைக்கும் மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. வினாவியல் வலிமை, படையின் அளவு, சார்ந்திருத்தல், ‘கையில்’ என்ற வெற்றி உருவகம் ஆகியவை தக்கவைக்கப்பட்டுள்ளன.
