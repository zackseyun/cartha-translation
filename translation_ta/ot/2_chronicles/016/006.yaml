base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
translation:
  language: ta
  text: பின்பு ஆசா அரசன் யூதா மக்கள் அனைவரையும் பணிக்காகத் திரட்டினான்[a]. அவர்கள் ராமாவின் கற்களையும் அதன் மரப்பொருட்களையும்—பாஷா ராமாவைக் கட்டுவதற்குப் பயன்படுத்தியவற்றை[b]—எடுத்துச் சென்றார்கள். ஆசா அவற்றைக் கொண்டு கேபாவையும் மிஸ்பாவையும் கட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், ‘யூதா முழுவதையும் எடுத்தான்’; இங்கு யூதா மக்களைப் பணிக்காகத் திரட்டினான் என்பது பொருள்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ராமாவைக் கட்டுவதற்குப் பாஷா பயன்படுத்திய கற்களும் மரப்பொருட்களும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  choice: யூதா மக்கள் அனைவரையும் பணிக்கு அழைத்தான்
  rationale: சொல்லுக்கு சொல் ‘யூதா முழுவதையும் எடுத்தான்.’ சூழலில், கட்டுமானப் பணிக்காக யூதா மக்களை அரசன் திரட்டியதைக் குறிக்கும் இயல்பான தமிழ் வழக்கு தேர்ந்தெடுக்கப்பட்டது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּשְׂאוּ
  choice: எடுத்துச் சென்றார்கள்
  rationale: נשׂא இங்கு கட்டுமானப் பொருட்களைத் தூக்கி வேறு இடத்திற்குக் கொண்டு செல்வதைக் குறிக்கிறது.
- source_word: אַבְנֵי הָרָמָה
  choice: ராமாவின் கற்கள்
  rationale: இடப்பெயருடன் அமைந்த எபிரெயக் கட்டமைப்பு நெருக்கமாகப் பாதுகாக்கப்படுகிறது; இவை ராமாவின் கட்டுமானத்தில் இருந்த கற்கள்.
- source_word: עֵצֶיהָ
  choice: அதன் மரங்கள்
  rationale: பெண்பால் பின்னொட்டு ராமாவைக் குறிக்கிறது. עֵץ என்பதன் பொதுவான ‘மரம்/மரப்பொருள்’ பொருளைத் தக்கவைத்து, கட்டுமானப் பொருட்கள் என்ற சூழல் வாசகத்தால் தெளிவாகிறது.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: பாஷா கட்டுவதற்குப் பயன்படுத்தியவற்றை
  rationale: சார்பு வாக்கியம் கற்களையும் மரங்களையும் குறித்து, அவற்றைப் பாஷா கட்டுமானத்திற்குப் பயன்படுத்தினான் என்பதை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: וַיִּבֶן בָּהֶם
  choice: ஆசா அவற்றைக் கொண்டு ... கட்டினான்
  rationale: ஒருமை வினையின் எழுவாய் ஆசா; பன்மைச் சுட்டுப்பெயர் முன்கூறிய கற்களையும் மரங்களையும் குறிக்கிறது. ‘அரணாக்கினான்’ என்ற சூழல்சார் கருத்தை மூலத்தில் இல்லாததால் சேர்க்கவில்லை.
- source_word: גֶּבַע
  choice: கேபா
  rationale: எபிரெய இடப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: הַמִּצְפָּה
  choice: மிஸ்பா
  rationale: எபிரெய இடப்பெயரின் வழக்கமான தமிழாக்க ஒலிபெயர்ப்பு; எபிரெயச் சுட்டு உறுப்பை இடப்பெயரில் தனியே மொழிபெயர்க்கவில்லை.
