translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் வரலாற்று உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டது. ‘பணிக்கு அழைத்தான்’ என்பது சூழல்சார் பொருளை இயல்பாகத் தருகிறது; எபிரெயின் நேரடி சொற்றொடர் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
