source:
  edition: WLC
  text: וַ/יֶּחֱלֶ֣א אָסָ֡א בִּ/שְׁנַת֩ שְׁלוֹשִׁ֨ים וָ/תֵ֤שַׁע לְ/מַלְכוּת/וֹ֙ בְּ/רַגְלָ֔י/ו עַד לְ/מַ֖עְלָ/ה חָלְי֑/וֹ וְ/גַם בְּ/חָלְי/וֹ֙ לֹא דָרַ֣שׁ אֶת יְהוָ֔ה כִּ֖י בָּ/רֹפְאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
translation:
  language: ta
  text: ஆசா தனது ஆட்சியின் முப்பத்தொன்பதாம் ஆண்டில் கால்களில் நோயுற்றான்; அவனுடைய நோய் மிகவும் கடுமையாயிற்று. ஆனாலும், நோயுற்றிருந்தபோதுகூட அவன் யாவேயை நாடாமல், மருத்துவர்களையே நாடினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் யாவேயிடம் விசாரிக்காமல், மருத்துவர்களிடம் விசாரித்தான்.” எபிரெய வாசகம் சுருக்கமாக இருந்து, யாவேயை நாடுவதையும் மருத்துவர்களிடம் திரும்புவதையும் எதிர்மறையாக ஒப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  choice: நோயுற்றான்
  rationale: חלה என்பது நோயுறுதல் அல்லது பலவீனமடைதலைக் குறிக்கிறது. இங்கு கால்களைப் பாதித்த உடல்நோயே சூழலுக்கு ஏற்ற பொருள்.
- source_word: בְּרַגְלָיו
  choice: கால்களில்
  rationale: רֶגֶל என்பதற்கு கால் அல்லது பாதம் எனப் பொருள் வரலாம். நோய் தாக்கிய கீழ் உறுப்புகளை இயல்பாகக் குறிப்பிட ‘கால்களில்’ பயன்படுத்தப்பட்டது; குறிப்பாகப் பாதங்கள் மட்டுமே என்று தேவையின்றிக் குறுக்கப்படவில்லை.
- source_word: עַד לְמַעְלָה
  choice: மிகவும் கடுமையாயிற்று
  rationale: இச்சொற்றொடர் இங்கு இடத்தின் மேல்நோக்கிய திசையை அல்ல, நோயின் மிகுதியை வலியுறுத்தும் மொழிவழக்காகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: חָלְיוֹ / בְּחָלְיוֹ
  choice: அவனுடைய நோய் / நோயுற்றிருந்தபோது
  rationale: முதல் இடத்தில் பெயர்ச்சொல்லை நேரடியாகக் காத்து, இரண்டாம் இடத்தில் இயல்பான நவீனத் தமிழுக்காக அதே கருத்து வினைநிலை வடிவில் தரப்பட்டது.
- source_word: דָרַשׁ אֶת יְהוָה
  choice: யாவேயை நாடாமல்
  rationale: דרש என்பது தேவனைத் தேடுதல், நாடுதல் அல்லது அவரிடம் விசாரித்தல் ஆகிய பொருள்களைத் தாங்குகிறது. ‘நாடுதல்’ உதவிக்காக அவரைச் சார்வதையும் அவரிடம் விசாரிப்பதையும் உள்ளடக்கிய பரந்த பொருளைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமம் ஒரு பட்டத்தால் மாற்றப்படாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பில் தரப்பட்டது.
- source_word: כִּי בָּרֹפְאִים
  choice: மருத்துவர்களையே நாடினான்
  rationale: எபிரெய வாசகம் ‘ஆனால்/மாறாக மருத்துவர்களிடம்’ எனச் சுருக்கமாக உள்ளது. முன் வரும் ‘நாடுதல்’ என்ற வினையை இங்கும் பொருளால் நிரப்பி, யாவேயை நாடாததற்கும் மருத்துவர்களை நாடியதற்கும் உள்ள எதிர்மறை ஒப்பீட்டைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: இந்த வசனம் மருத்துவச் சிகிச்சையையே கண்டிக்கிறதா, அல்லது ஆசா தேவனை நாடாததைச் சுட்டிக்காட்டுகிறதா?
  choice: ஆசா யாவேயை நாடாமல் மருத்துவர்களையே நாடினான் என்ற எதிர்மறை ஒப்பீடு காக்கப்பட்டது; மருத்துவர்கள் அல்லது மருத்துவச் சிகிச்சை இயல்பாகவே தவறானவை என்று கூறப்படவில்லை.
  alternative: மருத்துவர்களைப் பயன்படுத்தும் எந்தச் செயலையும் வசனம் கண்டிக்கிறது என்று மொழிபெயர்த்தல்.
  rationale: எபிரெய உரையின் குற்றச்சாட்டு ஆசா யாவேயை நாடாததையே மையப்படுத்துகிறது. மருத்துவத்தைப் பொதுவாக மறுக்கும் ஒரு கோட்பாட்டை உரைக்குள் சேர்க்காமல், அவன் யாரை நாடினான் என்ற எதிர்மறை ஒப்பீடு காக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க நடையிலும் அமைக்கப்பட்டது. ‘யாவே’ என்ற திருநாமம் ஒலிபெயர்க்கப்பட்டது. இறுதிக் கூறின் எபிரெய சுருக்கத்தன்மை முதன்மை உரையில் தெளிவாக்கப்பட்டு, அதன் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
