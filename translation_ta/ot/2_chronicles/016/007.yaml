source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִ֗יא בָּ֚א חֲנָ֣נִי הָ/רֹאֶ֔ה אֶל אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו בְּ/הִשָּׁ֨עֶנְ/ךָ֜ עַל מֶ֤לֶךְ אֲרָם֙ וְ/לֹ֤א נִשְׁעַ֨נְתָּ֙ עַל יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל כֵּ֗ן נִמְלַ֛ט חֵ֥יל מֶֽלֶךְ אֲרָ֖ם מִ/יָּדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
translation:
  language: ta
  text: அந்தக் காலத்தில் தரிசனக்காரரான ஹனானி யூதாவின் அரசன் ஆசாவிடம் வந்து, “நீ அராமின்[a] அரசனைச் சார்ந்ததாலும், உன் கடவுளாகிய யாவேயைச் சார்ந்திராததாலும், அராம் அரசனின் படை உன் கையிலிருந்து தப்பிவிட்டது” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீரியாவின் அரசன்.” எபிரெய மூலத்தில் “அராம்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  choice: அந்தக் காலத்தில்
  rationale: கதையின் காலச் சூழலை இயல்பான நவீனத் தமிழில் குறிக்கிறது; தொடக்க இணைப்பைத் தனியாக மொழிபெயர்க்க வேண்டியதில்லை.
- source_word: חֲנָנִי
  choice: ஹனானி
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பைத் தமிழில் நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: הָרֹאֶה
  choice: தரிசனக்காரர்
  rationale: ‘தீர்க்கதரிசி’ என்ற பொதுப்பட்டத்துடன் முற்றிலும் ஒன்றாக்காமல், רֹאֶה என்ற குறிப்பான ‘seer’ பட்டத்தைப் பாதுகாக்கிறது.
- source_word: אָסָא מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் ஆசா
  rationale: பெயரையும் அரசப் பட்டத்தையும் தெளிவான இயல்பான தமிழ்ச் சொல்லமைப்பில் தருகிறது.
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  choice: சார்ந்ததால் ... சார்ந்திராமல்
  rationale: அரசியல் மற்றும் இறையியல் நம்பிக்கையைச் சுட்டும் שׁען வினையின் இரு நிகழ்வுகளையும் ஒரே தமிழ் வினையால் மொழிபெயர்த்து மூலத்தின் மீளுரையைப் பாதுகாக்கிறது.
- source_word: מֶלֶךְ אֲרָם
  choice: அராமின் அரசன்
  rationale: பிற்காலப் பெயரான ‘சீரியா’ என்பதற்குப் பதிலாக எபிரெய மூலத்திலுள்ள ‘அராம்’ என்ற பெயரையே வைத்திருக்கிறது.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: உன் கடவுளாகிய யாவே
  rationale: உடன்படிக்கைப் பெயரான יהוה என்பதைப் பட்டமாக மாற்றாமல் ‘யாவே’ என்று எழுத்துப்பெயர்த்து, ‘உன் கடவுள்’ என்ற உறவுமுறையையும் பாதுகாக்கிறது.
- source_word: עַל כֵּן
  choice: அதனால்
  rationale: முந்தைய செயலுக்கும் அதன் விளைவுக்கும் இடையிலான காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: נִמְלַט
  choice: தப்பிவிட்டது
  rationale: நிறைவுற்ற செயலின் தற்போதைய விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חֵיל מֶלֶךְ אֲרָם
  choice: அராம் அரசனின் படை
  rationale: இச்சூழலில் חֵיל குறிக்கும் இராணுவப் படையைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: מִיָּדֶךָ
  choice: உன் கையிலிருந்து
  rationale: அதிகாரம் அல்லது பிடியிலிருந்து தப்புதல் என்ற பொருளுடைய மூல உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் நேரடியாக வரும் நான்கு எழுத்து உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல் தமிழில் எழுத்துப்பெயர்க்கிறது.
- issue: רֹאֶה என்ற தீர்க்கதரிசனப் பட்டம்
  choice: தரிசனக்காரர்
  alternative: தீர்க்கதரிசி
  rationale: இவ்விரு பட்டங்களும் தொடர்புடையவை என்றாலும், மூலத்தில் உள்ள குறிப்பான சொல்லின் வேறுபாட்டை அழிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. அரசர் ஆசாவை ஒருமையில் மரியாதையற்ற இரண்டாம் நபராக அழைக்கும் எபிரெய நேரடிப் பேச்சின் தீவிரம் ‘நீ/உன்’ என்பதால் பாதுகாக்கப்பட்டுள்ளது.
