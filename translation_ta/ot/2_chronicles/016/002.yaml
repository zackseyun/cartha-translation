source:
  edition: WLC
  text: וַ/יֹּצֵ֨א אָסָ֜א כֶּ֣סֶף וְ/זָהָ֗ב מֵ/אֹֽצְר֛וֹת בֵּ֥ית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח אֶל בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יּוֹשֵׁ֥ב בְּ/דַרְמֶ֖שֶׂק לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
translation:
  language: ta
  text: 'அப்போது ஆசா, யாவேயின் ஆலயக் கருவூலங்களிலிருந்தும் அரச அரண்மனைக் கருவூலங்களிலிருந்தும் வெள்ளியையும் பொன்னையும் வெளியே எடுத்து, தமஸ்குவில் குடியிருந்த ஆராமின் அரசன் பென்-அதாதிடம் அவற்றை அனுப்பி, இவ்வாறு கூறினான்:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: வெளியே எடுத்து
  rationale: יצא என்பதன் ஹிஃபீல் வடிவம் சேமிப்பிடத்திலிருந்து வெளியே கொண்டுவருவதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் செயலைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: כֶּסֶף וְזָהָב
  choice: வெள்ளியையும் பொன்னையும்
  rationale: எபிரெயத்தில் குறிப்பிடப்பட்டுள்ள இரு உலோகங்களையும் பொதுமைப்படுத்தாமல் நேரடியாகப் பெயரிடுகிறது.
- source_word: מֵאֹצְרוֹת
  choice: கருவூலங்களிலிருந்தும்
  rationale: எபிரெய மூலத்தின் பன்மையைப் பேணுகிறது; ஆலயம் மற்றும் அரண்மனையில் சேமிக்கப்பட்டிருந்த செல்வத்தைக் குறிக்க ‘கருவூலம்’ பொருத்தமானது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בֵּית என்பதன் சொற்பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் யாவேயின் ஆலயத்தையே குறிக்கிறது; יְהוָה என்பது ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: וּבֵית הַמֶּלֶךְ
  choice: அரச அரண்மனை
  rationale: சொல்லுக்கு சொல் ‘அரசனின் வீடு’; நவீனத் தமிழில் அதன் சூழல்சார் பொருளை ‘அரச அரண்மனை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁלַח
  choice: அவற்றை அனுப்பி
  rationale: வினையின் பொருள் மூலத்தில் வெளிப்படையாக இல்லாவிட்டாலும், முன்பு கூறப்பட்ட வெள்ளியையும் பொன்னையும் குறிக்கும் ‘அவற்றை’ தமிழின் தெளிவுக்காகச் சேர்க்கப்பட்டுள்ளது.
- source_word: אֶל בֶּן הֲדַד
  choice: பென்-அதாதிடம்
  rationale: எபிரெயத் தனிப்பெயரின் கூறுகளையும் உச்சரிப்பையும் தெளிவாகப் பேணும் ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ אֲרָם
  choice: ஆராம் அரசன்
  rationale: אֲרָם என்ற மூல இடப்பெயரைப் பேணுகிறது; பிற்காலப் புவியியல் பெயரான ‘சீரியா’ என்று மாற்றவில்லை.
- source_word: הַיּוֹשֵׁב בְּדַרְמֶשֶׂק
  choice: தமஸ்குவில் குடியிருந்த
  rationale: இடைநிலை வினையெச்சத்தின் தொடர்ச்சியான வசிப்பிடப் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: לֵאמֹר
  choice: 'இவ்வாறு கூறினான்:'
  rationale: அடுத்த வசனத்தின் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெயக் கதைநடை அமைப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உடன்படிக்கைக்குரிய தனிப்பெயரான நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது; அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’ மற்றும் ‘அரண்மனை’ ஆகியவை בֵּית என்பதன் சூழல்சார் வேறுபாட்டைத் தெளிவுபடுத்துகின்றன; மூலத்தின் இரு கருவூலங்களைக் குறிக்கும் அமைப்பு பன்மையால் பேணப்பட்டுள்ளது.
