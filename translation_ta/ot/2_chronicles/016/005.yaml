base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/005.yaml
  text: And when Baasha heard it[a], he stopped building Ramah and ceased his work.
translation:
  language: ta
  text: பாஷா இதைக் கேள்விப்பட்டபோது, ராமாவைக் கட்டுவதை[a] நிறுத்தி, தன் வேலையையும் நிறுத்திவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ராமாவை அரணாக்குவதை.” எபிரெயச் சொற்றொடர் ராமாவில் நடைபெற்ற கட்டுமானப் பணியையோ அரண் அமைக்கும் பணியையோ நிறுத்தியதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: இதைக் கேள்விப்பட்டபோது
  rationale: இது ஒரு காலத் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது. எபிரெய மொழியின் ‘அது நிகழ்ந்தது’ என்ற தொடக்கத்தைச் சொல்லுக்குச் சொல் தராமல், முந்தைய நிகழ்வைக் குறிக்கும் ‘இதை’ சேர்த்து இயல்பான நவீனத் தமிழில் தரப்பட்டுள்ளது.
- source_word: בַּעְשָׁא
  choice: பாஷா
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: கட்டுவதை நிறுத்தி
  rationale: חדל உடன் מן மற்றும் வினையெச்சப் பெயர் சேர்ந்து, நடந்துகொண்டிருந்த ஒரு செயலை நிறுத்துவதைக் குறிக்கின்றன.
- source_word: אֶת הָרָמָה
  choice: ராமாவைக்
  rationale: இது ராமா என்னும் இடப்பெயர். இங்கு ‘கட்டுதல்’ என்பது அந்த நகரில் கட்டுமானம் செய்வதையோ அதை அரணாக்குவதையோ குறிக்கலாம்.
- source_word: וַיַּשְׁבֵּת
  choice: நிறுத்திவிட்டான்
  rationale: שבת என்பதன் ஹிஃபில் வடிவம் ஒரு செயலை முடிவுக்குக் கொண்டுவருதல் அல்லது நிறுத்துதல் என்ற பொருளைத் தருகிறது. தமிழ் வாக்கியத்தில் செயல் முற்றாக நின்றதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְלַאכְתּוֹ
  choice: தன் வேலையையும்
  rationale: מלאכה என்பது வேலை அல்லது பணியைக் குறிக்கும். உடைமையாளன் வாக்கிய எழுவாயே என்பதால் ‘தன்’ இயல்பானது; ‘-யும்’ அடுத்த இணைச் செயலைத் தெளிவாக்குகிறது.
