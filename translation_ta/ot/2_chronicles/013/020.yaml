source:
  edition: WLC
  text: וְ/לֹֽא עָצַ֧ר כֹּֽחַ יָרָבְעָ֛ם ע֖וֹד בִּ/ימֵ֣י אֲבִיָּ֑הוּ וַ/יִּגְּפֵ֥/הוּ יְהוָ֖ה וַ/יָּמֹֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
translation:
  language: ta
  text: அபியாவின் நாட்களில் யெரொபெயாம் இனி தன் வலிமையைத் தக்கவைத்துக்கொள்ளவில்லை. யாவே அவனை அடித்தார்[a]; அவன் இறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே அவனைத் துன்புறுத்தினார்” அல்லது “யாவே அவனை வாதையால் தாக்கினார்.” யாவே யெரொபெயாமை “அடித்தார்” என்று மட்டுமே எபிரெய உரை கூறுகிறது; அவர் எந்த வழியில் அடித்தார் என்பதை அது குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  choice: தன் வலிமையைத் தக்கவைத்துக்கொள்ளவில்லை
  rationale: עָצַר என்பதன் ‘தடுத்து வைத்தல்/தக்கவைத்தல்’ என்ற அடிப்படைப் பொருளையும் כֹּחַ என்பதன் ‘வலிமை’ என்ற பொருளையும் காக்கிறது; இதை இராணுவ வெற்றி என்று மட்டும் குறுக்காமல், யெரொபெயாம் தொடர்ந்து வலிமை பெற்றிருக்கவில்லை என்பதைக் காட்டுகிறது.
- source_word: לֹא ... עוֹד
  choice: இனி ... இல்லை
  rationale: எதிர்மறை அமைப்பில் עוֹד என்பது ‘இனிமேலும் இல்லை/இனி இல்லை’ என்ற இயல்பான பொருளைத் தருகிறது.
- source_word: בִּימֵי אֲבִיָּהוּ
  choice: அபியாவின் நாட்களில்
  rationale: அபியாவின் வாழ்நாள் அல்லது ஆட்சிக்காலத்தின்போது என்ற காலக் குறிப்பை, எபிரெய மரபுத்தொடருக்கு நெருக்கமாகவும் தமிழில் தெளிவாகவும் வழங்குகிறது.
- source_word: וַיִּגְּפֵהוּ
  choice: அவனை அடித்தார்
  rationale: נגף குறிக்கும் தெய்வீக அடி, வாதை அல்லது தாக்குதல் ஆகிய சாத்தியங்களைச் சுருக்கிவிடாமல், செயல் எவ்வாறு நிகழ்ந்தது என்பதைத் தீர்மானிக்காத பொதுவான சொல்லைத் தேர்ந்தெடுக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் தனிப்பெயர் வடிவமாக ஒலிபெயர்க்கிறது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்துபோனான்
  rationale: எளிய எபிரெய கதைத் தொடரை இயல்பான நவீன தமிழில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: וַיִּגְּפֵהוּ יְהוָה என்பதில் தெய்வீகச் செயலின் தன்மை
  choice: யாவே யெரொபெயாமை அடித்தார்; பின்னர் அவன் இறந்தான் என்று நேரடியாகக் கூறி, அந்த அடி எந்த வழியில் வந்தது என்பதைத் தீர்மானிக்காமல் விடுதல்
  alternative: யாவே அவனை நோயால் வாதித்தார் அல்லது போரில் உடனடியாக வீழ்த்தினார் என்று குறிப்பாக்குதல்
  rationale: யெரொபெயாமின் வீழ்ச்சியையும் மரணத்தையும் உரை யாவேயின் செயலுடன் தொடர்புபடுத்துகிறது; ஆனால் அது நோயா, போர்க்காயமா, வேறு வழியா என்று கூறுவதில்லை. மொழிபெயர்ப்பு அந்த இறையியல் வலியுறுத்தலையும் அதன் தீர்க்கப்படாத பதற்றத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், கண்ணியமானதும் சாதாரண வாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடையைப் பயன்படுத்தியது. ‘தக்கவைத்துக்கொள்ளவில்லை’ என்பது மூலத்தின் சொற்பொருளை இயல்பான தமிழில் காக்கிறது; ‘அடித்தார்’ என்பது செயல் நடந்த வழியைத் தேவையின்றி குறிப்பாக்காமல் விடுகிறது.
