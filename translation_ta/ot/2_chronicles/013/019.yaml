base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: ta
  text: 'அபியா யெரொபெயாமைத் துரத்திச் சென்று, அவனிடமிருந்து நகரங்களைக் கைப்பற்றினார்: பெத்தேலும் அதைச் சேர்ந்த ஊர்களும், யெஷானாவும் அதைச் சேர்ந்த ஊர்களும், எப்ரோனும் அதைச் சேர்ந்த ஊர்களும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף ... אַחֲרֵי
  choice: பின்தொடர்ந்து சென்று
  rationale: எபிரேயச் சொற்றொடரின் ‘பின்னால் துரத்திச் செல்லுதல்’ என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיִּלְכֹּד מִמֶּנּוּ עָרִים
  choice: அவனிடமிருந்து நகரங்களைக் கைப்பற்றினார்
  rationale: לכד என்பதன் இராணுவச் சூழலுக்குரிய ‘கைப்பற்று’ என்ற பொருளையும், מִמֶּנּוּ என்பதையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: בְּנוֹתֶיהָ
  choice: அதைச் சேர்ந்த ஊர்கள்
  rationale: சொல்லுக்குச் சொல் ‘அதன் மகள்கள்’ என்பது தமிழில் இடப்பெயரியல் உறவைத் தெளிவாகச் சொல்லாது; இங்கு முதன்மை நகரத்தைச் சார்ந்த துணை ஊர்களைக் குறிக்கிறது.
- source_word: עפרון
  choice: எப்ரோன்
  rationale: மசோரா உரையின் மெய்யெழுத்து வடிவத்தையும் வழக்கமான பெயரொலிப்பையும் பின்பற்றுகிறது.
