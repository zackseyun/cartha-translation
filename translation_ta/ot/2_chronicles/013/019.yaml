  source_fidelity: 'மொத்தத்தில் எபிரேய வாக்கிய அமைப்பும் பொருளும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன: அபியா யெரொபெயாமைத் துரத்தினார்; அவனிடமிருந்து நகரங்களைக் கைப்பற்றினார்; பின்னர் மூன்று நகரங்களும் அவற்றைச் சார்ந்த குடியிருப்புகளும் பட்டியலிடப்படுகின்றன. ஆனால் יְשָׁנָה என்ற இடப்பெயர் ‘எசானா’ என வருவது தொடக்க ய் ஒலியை விடுத்துவிடுகிறது. இதை ‘யெஷானா’ எனத் திருத்த வேண்டும்.'
  naturalness: ‘அதைச் சேர்ந்த ஊர்கள்’ என்பது בְּנוֹתֶיהָ (‘அதன் துணை/சார்பு ஊர்கள்’) என்பதற்கு நவீனத் தமிழில் இயல்பான விளக்கமாக உள்ளது. ‘பின்தொடர்ந்து சென்று’ புரிந்துகொள்ளத்தக்கது; ஆயினும் போர்ச்சூழலிலுள்ள וַיִּרְדֹּף אַחֲרֵי என்பதன் நேரடியான இயக்கத்தை ‘துரத்திச் சென்று’ சிறப்பாகத் தருகிறது.
  terminology: ‘நகரங்கள்’, ‘கைப்பற்றினார்’, மற்றும் ‘அதைச் சேர்ந்த ஊர்கள்’ ஆகியவை பொருத்தமானவை. அபியா, யெரொபெயாம், பெத்தேல், எப்ரோன் ஆகிய பெயர்கள் ஏற்கத்தக்கவை. יְשָׁנָה-வின் ய் ஒலியைத் தக்கவைக்க ‘யெஷானா’ பயன்படுத்தப்பட்டுள்ளது. மசோரா உரையில் உள்ள עֶפְרוֹן/עפרון அடிப்படையிலான ‘எப்ரோன்’ வடிவம் பாதுகாக்கப்படுகிறது.
