translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தில் பெயர்ப்பட்டியலுக்கு முன் உள்ள ‘நகரங்கள்’ என்பதும், ஒவ்வொரு நகரத்திற்கும் உட்பட்ட குடியிருப்புகளைக் குறிக்கும் உறவும் பாதுகாக்கப்பட்டுள்ளன.
