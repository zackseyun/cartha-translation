    rationale: எபிரேய יְשָׁנָה-வின் தொடக்க ய் மெய்யொலி தமிழாக்கத்தில் விடுபட்டுள்ளது. பெயரின் அடையாளத்தைத் துல்லியமாகப் பாதுகாக்க ‘யெஷானா’ என வர வேண்டும்.
