  register: நவீன நிலையான தமிழில், எளிதில் புரியும் கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. மரணத்தைக் குறிக்கும் எபிரெய உருவகம் பாதுகாக்கப்பட்டுள்ளது; அரசியல் அமைதியைக் குறிக்கும் சொல்லின் பொருள் பரப்பும் அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
