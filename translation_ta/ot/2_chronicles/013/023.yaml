base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
translation:
  language: ta
  text: அபியா தன் முன்னோர்களோடு துயிலடைந்தான்; அவனைத் தாவீதின் நகரத்தில் அடக்கம் செய்தார்கள். அவனுக்குப் பதிலாக அவன் மகன் ஆசா அரசாண்டான். அவனுடைய நாட்களில் நாடு பத்து ஆண்டுகள் அமைதியாக இருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடு பத்து ஆண்டுகள் ஓய்வுபெற்றிருந்தது.”
    reason: שָׁקְטָה என்ற எபிரெய வினை ‘அமைதியாக இருந்தது’ என்றும் ‘ஓய்வு பெற்றது’ என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு துயிலடைந்தான்
  rationale: இது மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய அரச மரணச் சொற்றொடர். ‘இறந்தான்’ என்று பொருளை மட்டும் கூறாமல், மூலத்தின் உருவகத்தையும் கண்ணியமான வேதாகம நடையையும் தக்கவைக்கிறது; אֲבֹתָיו இங்கு குடும்ப முன்னோர்களைக் குறிக்கிறது.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவனை ... அடக்கம் செய்தார்கள்
  rationale: எபிரெய வினை செயப்பாட்டு பன்மையில் இருந்து, செய்பவர்கள் குறிப்பிடப்படாத தன்மையைத் தமிழிலும் தக்கவைக்கிறது.
- source_word: בְּעִיר דָּוִיד
  choice: தாவீதின் நகரத்தில்
  rationale: இடப்பெயரான ‘தாவீதின் நகரம்’ என்பதைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: וַיִּמְלֹךְ אָסָא בְנוֹ תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக அவன் மகன் ஆசா அரசாண்டான்
  rationale: תַּחְתָּיו குறிக்கும் அரச வாரிசுரிமையையும், וַיִּמְלֹךְ என்பதன் ‘அரசாண்டான்’ என்ற நேரடியான பொருளையும் பாதுகாக்கிறது.
- source_word: בְּיָמָיו
  choice: அவனுடைய நாட்களில்
  rationale: ‘அவனுடைய ஆட்சிக்காலத்தில்’ என்பது சூழலுக்குப் பொருந்தினாலும், மூலத்தில் உள்ள விரிவான காலக் குறிப்பைத் தீர்மானமாகச் சுருக்காமல் தக்கவைக்கிறது.
- source_word: שָׁקְטָה הָאָרֶץ
  choice: நாடு ... அமைதியாக இருந்தது
  rationale: שׁקט என்பது தொந்தரவு அல்லது போர் இல்லாத அமைதி, ஓய்வு ஆகியவற்றைக் குறிக்கலாம். நவீன தமிழில் ‘நாடு அமைதியாக இருந்தது’ இயல்பாக அந்த நிலையை வெளிப்படுத்துகிறது; ‘ஓய்வுபெற்றிருந்தது’ என்ற நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֶשֶׂר שָׁנִים
  choice: பத்து ஆண்டுகள்
  rationale: அமைதி நீடித்த கால அளவைத் தமிழில் இயல்பாகக் குறிப்பிடுகிறது.
