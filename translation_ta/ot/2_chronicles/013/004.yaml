base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
translation:
  language: ta
  text: அபியா எப்பிராயீமின் மலைநாட்டில் உள்ள[a] செமராயீம் மலையின்மேல் நின்று, “யெரொபெயாமே, இஸ்ரவேலர் அனைவரே, எனக்குச் செவிகொடுங்கள்!” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எப்பிராயீமின் மலைப்பகுதியில் உள்ள” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் எப்பிராயீமின் மலைநாட்டையோ மலைப்பாங்கான பிரதேசத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து நின்று
  rationale: קום என்பதன் ‘எழுதல்/நிற்றல்’ ஆகிய இரு நெருங்கிய நுணுக்கங்களையும் இயல்பான தமிழில் தக்கவைக்கிறது; முறையான படைநிலை எடுத்தார் என மிகையாக விளக்கவில்லை.
- source_word: מֵעַל לְהַר
  choice: மலையின்மேல்
  rationale: எபிரெய முன்சொல் தொடரின் இடத்தைக் குறிக்கும் கருத்தை, மரபுசாராத இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צְמָרַיִם
  choice: செமராயீம்
  rationale: இடப்பெயர் எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: எப்பிராயீமின் மலைநாட்டிலுள்ள
  rationale: הַר இங்கு ஒரு தனி மலையையும் அல்லாமல் மலைப்பாங்கான பிரதேசத்தையும் குறிக்கக்கூடும்; சூழலில் பிரதேசப் பொருள் இயல்பானது.
- source_word: וַיֹּאמֶר
  choice: என்றார்
  rationale: நேரடி உரையை அறிமுகப்படுத்தும் வழக்கமான எபிரெய கதைநடைச் சொல்லை இயல்பான தமிழ் மேற்கோள் முடிவாக வழங்குகிறது.
- source_word: שְׁמָעוּנִי
  choice: எனக்குச் செவிகொடுங்கள்
  rationale: கட்டளை வடிவத்தின் நேரடியான, முறையான பொதுப்பேச்சுத் தொனியைப் பாதுகாக்கிறது.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: யெரொபெயாமே, இஸ்ரவேல் அனைவரே
  rationale: இருவரும் விளி வேற்றுமையில் நேரடியாக அழைக்கப்படுவதைத் தமிழில் தெளிவாக்கி, ‘இஸ்ரவேல்’ என்ற தேசிய-உடன்படிக்கைப் பெயரை அப்படியே தக்கவைக்கிறது.
theological_decisions:
- issue: பிரிந்த அரசாட்சிச் சூழலில் יִשְׂרָאֵל என்பதன் மொழிபெயர்ப்பு
  choice: இஸ்ரவேல் அனைவரே
  alternative: இஸ்ரவேலர் அனைவரே
  rationale: மூலம் தேசிய-உடன்படிக்கைப் பெயரான ‘இஸ்ரவேல்’ என்பதையே நேரடியாகப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது, வடக்கு அரசைக் குறித்த நாளாகம ஆசிரியரின் அரசியல்-இறையியல் பதற்றத்தை இன அடையாளமாக மட்டும் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுமக்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான வரலாற்றுக் கதைநடை. அரசரின் பொதுப்பேச்சுக்கேற்ற நேரடியான விளி வடிவமும் கட்டளைத் தொனியும் பயன்படுத்தப்பட்டுள்ளன. அடிக்குறிப்பு குறி முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
