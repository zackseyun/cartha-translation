revisions:
- from: இஸ்ரவேலின் மகன்கள் யூதாவுக்கு முன்பாகத் தப்பியோடினார்கள்; கடவுள் அவர்களை யூதாவின் கையில் ஒப்புக்கொடுத்தார்.[a]
  to: இஸ்ரவேலின் மகன்கள் யூதாவின் முன்னிலையிலிருந்து தப்பியோடினார்கள்; கடவுள் அவர்களை யூதாவின் கையில் ஒப்புக்கொடுத்தார்.[a]
  rationale: The revision improves the natural Tamil expression of fleeing in the face of Judah and makes the footnote's antecedent explanation precise. It preserves the Hebrew's direct attribution of the outcome to God, its literal “sons of Israel” expression, and the idiom of being given into an opponent's hand.
