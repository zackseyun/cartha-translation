reference: 2 Chronicles 13:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּנ֥וּסוּ בְנֵי יִשְׂרָאֵ֖ל מִ/פְּנֵ֣י יְהוּדָ֑ה וַ/יִּתְּנֵ֥/ם אֱלֹהִ֖ים בְּ/יָדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/016.yaml
  text: And the sons of Israel fled before Judah[c][b][a], and God gave them into their hand.
translation:
  language: ta
  text: இஸ்ரவேலின் மகன்கள் யூதாவின் முன்னிலையிலிருந்து தப்பியோடினார்கள்; கடவுள் அவர்களை யூதாவின் கையில் ஒப்புக்கொடுத்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களுடைய கையில்”; இங்கு அது யூதாவின் மக்களை அல்லது படையினரைக் குறிக்கிறது. “கையில்” என்பது அதிகாரம் அல்லது கட்டுப்பாடு என்று பொருள்படும் மொழிவழக்கு.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  choice: தப்பியோடினார்கள்
  rationale: נוּס என்பது போரிலோ ஆபத்திலோ எதிரியின் முன்னிலையிலிருந்து ஓடித் தப்புவதைக் குறிக்கிறது; போர்ச் சூழலில் ‘தப்பியோடினார்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடரின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவத்தைப் பாதுகாக்கிறது; சூழலில் இது வடக்கு அரசின் இஸ்ரவேலரைக் குறிக்கிறது.
- source_word: מִפְּנֵי יְהוּדָה
  choice: யூதாவுக்கு முன்பாக
  rationale: מִפְּנֵי என்பதன் நேரடி இடவியல் வடிவத்தையும், யூதாவின் தாக்குதலை எதிர்கொள்ள முடியாமல் பின்வாங்கிய போர்ச் சூழலையும் பாதுகாக்கிறது.
- source_word: וַיִּתְּנֵם
  choice: அவர்களை ... ஒப்புக்கொடுத்தார்
  rationale: נתן என்பதற்கு அடிப்படையில் ‘கொடுத்தார்’ என்று பொருள்; ‘கையில்’ என்ற அதிகாரத்தைக் குறிக்கும் மொழிவழக்குடன் சேரும்போது, போரில் எதிரியின் அதிகாரத்துக்கு ஒப்புக்கொடுத்தார் என்பது இயல்பான தமிழ்.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: மூலத்தில் தெய்வீகப் பெயர் அல்ல, אֱלֹהִים என்பதே உள்ளது; ஆகவே ‘கடவுள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: בְּיָדָם
  choice: யூதாவின் கையில்
  rationale: எபிரெயத்தில் ‘அவர்களுடைய கையில்’ என்று பன்மைச் சுட்டுப்பெயர் இருந்தாலும், அதன் முன்னிலைச் சொல் கூட்டுப்பெயரான ‘யூதா’; தமிழில் தவறான தொடர்பைத் தவிர்க்க முன்னிலைச் சொல் வெளிப்படுத்தப்படுகிறது. ‘கையில்’ என்பது அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் மொழிவழக்கு.
theological_decisions:
- issue: போரின் முடிவில் கடவுளின் செயற்பாடு
  choice: கடவுள் அவர்களை யூதாவின் கையில் ஒப்புக்கொடுத்தார்
  alternative: கடவுள் அவர்கள் யூதாவின் கையில் விழ அனுமதித்தார்
  rationale: கடவுளை எழுவாயாகக் கொண்ட נתן என்ற வினை, வெறும் அனுமதியைவிட நேரடியான தெய்வீகச் செயற்பாட்டைக் கூறுகிறது; இதை மென்மைப்படுத்தாமல் மொழிபெயர்க்கப்படுகிறது.
- issue: உடன்படிக்கை மக்களைக் குறிக்கும் சொற்றொடர்
  choice: இஸ்ரவேலின் மகன்கள்
  alternative: இஸ்ரவேலர்கள்
  rationale: மூலத்தின் בְנֵי יִשְׂרָאֵל என்ற ஆண்பால் வடிவத்தைப் பாதுகாக்கும் அதேவேளையில், வரலாற்றுச் சூழலில் குறிக்கப்படும் குழுவையும் தெளிவாக விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் ‘இஸ்ரவேலின் மகன்கள்’ என்ற வடிவமும் கடவுளின் நேரடிச் செயற்பாடும் பாதுகாக்கப்பட்டுள்ளன; சுட்டுப்பெயரின் குழப்பம் மட்டும்正文த்தில் ‘யூதாவின்’ என்று தெளிவாக்கப்பட்டு அடிக்குறிப்பில் நேரடி எபிரெய வடிவம் தரப்பட்டுள்ளது.
