base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/015.yaml
  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: ta
  text: அப்போது யூதாவைச் சேர்ந்தவர்கள் போர்முழக்கம் எழுப்பினார்கள். யூதாவைச் சேர்ந்தவர்கள் போர்முழக்கம் எழுப்பியபோது, கடவுள் அபியாவுக்கும் யூதாவுக்கும் முன்னிலையில் எரொபெயாமையும் இஸ்ரவேலர் அனைவரையும் தாக்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ / בְּהָרִיעַ
  choice: ஆரவாரம் எழுப்பினார்கள் / ஆரவாரம் எழுப்பியபோது
  rationale: רוע என்பதன் இச்சூழலிலான போர்முழக்கத்தையும் உரத்த ஆரவாரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தில் உள்ள வினைச்சொல் மீளுரைப்பும் பாதுகாக்கப்படுகிறது.
- source_word: אִישׁ יְהוּדָה
  choice: யூதாவின் ஆட்கள்
  rationale: கூட்டுப் பொருளில் வரும் ஒருமை אִישׁ-ஐ இயல்பான தமிழ்ப் பன்மையாக வழங்குகிறது.
- source_word: נָגַף
  choice: முறியடித்தார்
  rationale: போர்ச் சூழலில் எதிரியைத் தோற்கடித்தல் அல்லது கடுமையாகத் தாக்குதல் என்ற பொருளைத் தருகிறது; இவ்வசனம் மட்டும் நேரடியாகக் கொல்லப்பட்டதாகக் கூறுவதைத் தவிர்க்கிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: அபியாவும் யூதாவும் எதிர்கொண்ட போர்க்களத்தில் அவர்கள் முன்னிலையில் இஸ்ரவேல் முறியடிக்கப்பட்டது என்ற மூலத்தின் இடைமுகத் தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வெற்றியில் கடவுளின் செயல்பாடு
  choice: கடவுள் ... முறியடித்தார்
  alternative: அவர்கள் ... முறியடித்தார்கள்
  rationale: மூல எபிரெய உரை கடவுளையே நேரடியான வினைச்செய்பவராகக் குறிப்பிடுகிறது; மனிதப் படையின் செயலாக மாற்றப்படவில்லை.
- issue: ஆரவாரத்துக்கும் கடவுளின் தாக்குதலுக்கும் உள்ள தொடர்பு
  choice: ஆரவாரம் எழுப்பியபோது
  alternative: ஆரவாரம் எழுப்பியதால்
  rationale: בְּ + infinitive construct காலத் தொடர்பைத் தெளிவாகக் காட்டுகிறது; ஆரவாரமே காரணம் என்று மூலத்தை விட அதிகமாகக் கூறவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை. எபிரெய மூலத்தின் இருமுறை வரும் ‘ஆரவாரம்’ கட்டமைப்பும் கடவுளின் நேரடி செயல்பாடும் பாதுகாக்கப்பட்டுள்ளன.
