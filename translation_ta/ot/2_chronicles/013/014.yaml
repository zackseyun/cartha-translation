source:
  edition: WLC
  text: וַ/יִּפְנ֣וּ יְהוּדָ֗ה וְ/הִנֵּ֨ה לָ/הֶ֤ם הַ/מִּלְחָמָה֙ פָּנִ֣ים וְ/אָח֔וֹר וַֽ/יִּצְעֲק֖וּ לַ/יהוָ֑ה וְ/הַ/כֹּ֣הֲנִ֔ים מחצצרים בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/014.yaml
  text: When Judah turned around, behold, the battle was before them and behind them; and they cried out to Yahweh, and the priests were blowing the trumpets.
translation:
  language: ta
  text: யூதா மக்கள் திரும்பியபோது, இதோ, போர் அவர்களுக்கு முன்னும் பின்னும் இருந்தது. அவர்கள் யாவேயை நோக்கிக் கூக்குரலிட்டார்கள்; ஆசாரியர்கள் எக்காளங்களை ஊதிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: திரும்பிப் பார்த்தபோது
  rationale: פנה என்பதன் திரும்புதல் என்ற பொருளையும், முன்னும் பின்னும் எதிரிகள் இருப்பதை உணரும் சூழலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוּדָה
  choice: யூதா மக்கள்
  rationale: இங்கு யூதா என்பது தனிநபரை அல்ல, மக்களையோ படையையோ குறிக்கும் கூட்டுப்பெயர். ‘மக்கள்’ என்பதைச் சேர்ப்பது அந்தக் கூட்டுப்பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: திடீரென கவனத்தை ஈர்க்கும் எபிரெய உரையாடல் குறியின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: הַמִּלְחָמָה
  choice: போர்
  rationale: இங்கு நீண்டகாலப் போரை விட உடனடி போர்மோதலே குறிக்கப்படுகிறது; தமிழில் ‘போர்’ சூழலுக்கு இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: פָּנִים וְאָחוֹר
  choice: முன்னும் பின்னும்
  rationale: இரு திசைகளிலிருந்தும் அவர்கள் தாக்குதலை எதிர்கொண்ட நிலையை எபிரெயச் சொல்லமைப்புக்கு நெருக்கமாகக் காட்டுகிறது.
- source_word: וַיִּצְעֲקוּ
  choice: கூக்குரலிட்டார்கள்
  rationale: யாவேயை நோக்கிய அவசரமான, தீவிரமான வேண்டுதலை வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேயை நோக்கி
  rationale: לְ முன்னிடைச்சொல்லின் திசைநோக்குப் பொருளையும், יהוה என்ற திருப்பெயரின் ஒலிபெயர்ப்பையும் தக்கவைக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: வழிபாட்டுப் பணியில் உள்ள குருக்களைக் குறிக்கும் தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் வேதாகமச் சொல்.
- source_word: מחצצרים
  choice: ஊதிக்கொண்டிருந்தார்கள்
  rationale: பங்கேற்பெச்ச வடிவம் காட்டும் தொடர்ச்சியான அல்லது உடனிகழும் செயலை வெளிப்படுத்துகிறது.
- source_word: בַּחֲצֹצְרוֹת
  choice: எக்காளங்களை
  rationale: வழிபாடு மற்றும் போரில் பயன்படுத்தப்பட்ட நேரான உலோக ஊதுகருவிகளுக்கான தெளிவான, வழக்கமான தமிழ் சொல்; இவ்வசனத்தில் இல்லாத ‘வெள்ளி’ என்ற விவரம் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரை மறைக்காமல் ஒலிபெயர்த்து, ‘ஆண்டவர்’ போன்ற பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. ‘இதோ’ மூலத்தின் திடீர் கவன ஈர்ப்பைத் தக்கவைக்கிறது; வினைத் தொடர்ச்சியை ‘நடந்துகொண்டிருந்தது’, ‘ஊதிக்கொண்டிருந்தார்கள்’ என்பவை வெளிப்படுத்துகின்றன.
