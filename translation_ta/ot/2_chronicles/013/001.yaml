lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: பதினெட்டாம் ஆண்டில்
  rationale: எபிரெய அரசாட்சி ஆண்டுக் கணிப்பு முறையை இயல்பான நவீன தமிழில் வரிசை எண்ணுடன் தருகிறது.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם
  choice: யெரொபெயாம் அரசனுடைய
  rationale: ל முன்னொட்டு இங்கு யெரொபெயாமின் ஆட்சியின் எந்த ஆண்டு கணிக்கப்படுகிறது என்பதைக் குறிக்கிறது; உடைமைத் தொடர் தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַ/יִּמְלֹךְ
  choice: அரசனானான்
  rationale: מלך வினையின் இங்கு காணப்படும் ஆட்சியேற்பு நுணுக்கத்தை, வெறுமனே ‘ஆட்சி செய்தான்’ என்று மங்கச் செய்யாமல் தெரிவிக்கிறது.
- source_word: אֲבִיָּה
  choice: அபியா
  rationale: நாளாகமத்தின் எபிரெய வடிவமான אֲבִיָּה என்பதன் தமிழ் ஒலிபெயர்ப்பு.
- source_word: עַל יְהוּדָה
  choice: யூதாவின்மேல்
  rationale: מלך உடன் வரும் עַל, ஓர் ஆட்சிப்பரப்பின்மேல் ஆளுகை செய்வதைக் குறிக்கிறது; மூலத்தின் கட்டமைப்பையும் பொருளையும் தக்கவைக்கிறது.
