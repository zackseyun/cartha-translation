base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
translation:
  language: ta
  text: நாங்கள் யாவேக்குக் காலைய்தோறும் மாலைத்தோறும் தகனபலிகளைச் செலுத்துகிறோம்; நறுமணத் தூபத்தையும் செலுத்துகிறோம்; தூய மேசையின்மேல் அப்பங்களின் வரிசையையும் அமைக்கிறோம்[a]; பொன் விளக்குத்தண்டிலுள்ள விளக்குகள் மாலைத்தோறும் எரியும்படி செய்கிறோம். ஏனெனில், யாவே, எங்கள் கடவுளின் கட்டளையை நாங்கள் கைக்கொள்கிறோம்; ஆனால் நீங்களோ அவரைக் கைவிட்டுவிட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமுகத்து அப்பம்.” சொல்லுக்குச்சொல், “அப்பங்களின் வரிசை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַקְטִרִים
  choice: செலுத்துகிறோம்
