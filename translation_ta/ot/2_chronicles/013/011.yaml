  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ஆலய வழிபாட்டின் தொழில்நுட்பச் சொற்கள் தேவையான இடங்களில் காக்கப்பட்டுள்ளன; எபிரெய மறுமொழிகள் ‘-தோறும்’ வடிவில் இயல்பாக்கப்பட்டுள்ளன.
