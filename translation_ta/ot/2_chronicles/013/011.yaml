  rationale: ஆலயப் பொருளையும் விளக்குகளின் நோக்கம் அல்லது பராமரிப்புச் செயலையும் தெளிவான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֹׁמְרִים אֲנַחְנוּ אֶת מִשְׁמֶרֶת יְהוָה
  choice: நாங்கள் ... யாவே இட்ட பணியை உண்மையுடன் நிறைவேற்றுகிறோம்
  rationale: שמר மற்றும் משמרת இணைப்பு கட்டளையிடப்பட்ட ஆசாரப் பொறுப்பைக் கவனமாகக் கடைப்பிடிப்பதைக் குறிக்கிறது; சொற்சொல்லான மறுமொழியைத் தவிர்த்து அதன் வலிமையைத் தருகிறது.
- source_word: וְאַתֶּם עֲזַבְתֶּם אֹתוֹ
  choice: ஆனால் நீங்களோ அவரைக் கைவிட்டுவிட்டீர்கள்
  rationale: எதிர்மறை ஒப்பீட்டையும் நிறைவுற்ற கைவிடுதலையும் வலியுறுத்துகிறது.
