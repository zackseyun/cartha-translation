  rationale: טָהוֹר என்பதன் ஆசாரத் தூய்மை நுணுக்கத்தை ‘தூய’ காக்கிறது.
- source_word: וּמְנוֹרַת הַזָּהָב וְנֵרֹתֶיהָ לְבָעֵר
