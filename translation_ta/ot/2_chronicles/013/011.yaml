  alternative: யாவேயின் காவலைக் காக்கிறோம்; யாவேயின் கட்டளையைக் கடைப்பிடிக்கிறோம்
  rationale: இச்சூழலில் ஆசாரியர்களுக்கு ஒப்படைக்கப்பட்ட வழிபாட்டுப் பொறுப்பை விழிப்புடன் கடைப்பிடிப்பதே கருத்து; ஒரு கட்டளைக்கு மட்டும் பொருளைச் சுருக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
