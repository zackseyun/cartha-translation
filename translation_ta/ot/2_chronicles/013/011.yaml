  rationale: எபிரெய மறுமொழியின் பகிர்வுத் தன்மையையும் அன்றாட ஒழுங்கையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: וּקְטֹרֶת סַמִּים
  choice: நறுமணத் தூபம்
  rationale: சுகந்தப் பொருள்களால் செய்யப்பட்ட ஆசாரத் தூபம் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּמַעֲרֶכֶת לֶחֶם
  choice: அப்பத்தை வரிசையாக வைக்கிறோம்
  rationale: ‘அப்பத்தின் ஒழுங்கமைப்பு’ என்ற எபிரெயச் சொல்லாட்சியை செயல்வடிவில் இயல்பான தமிழாகத் தருகிறது; மரபுவழிச் சிறப்புப்பெயரை முதன்மை உரைக்குள் இறக்குமதி செய்யவில்லை.
