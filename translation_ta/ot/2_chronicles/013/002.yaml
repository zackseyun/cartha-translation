revisions:
- from: அவர் எருசலேமில் மூன்று ஆண்டுகள் அரசாண்டார்.[a] அவருடைய தாயின் பெயர் மிகாயா; அவர் கிபியாவைச் சேர்ந்த ஊரியேலின் மகள். அபியாவுக்கும் யெரொபெயாமுக்கும் இடையே போர் நடந்தது.
  to: அவர் எருசலேமில் மூன்று ஆண்டுகள் அரசாண்டார். அவருடைய தாயின் பெயர் கிபியாவைச் சேர்ந்த ஊரியேலின் மகளான மீகாயா[a]. அபியாவுக்கும் யெரொபெயாமுக்கும் இடையே போர் நடந்தது.
  rationale: 'திருத்தம் பொருளை மாற்றாமல் இரண்டு அம்சங்களைச் சரிசெய்கிறது: மிகாயா என்ற பெயருடனேயே அடிக்குறிப்பு அடையாளம் இணைக்கப்பட்டுள்ளது; தாயின் அடையாளம் பெயருடன் நேரடியாக அமைக்கப்பட்டதால் சுட்டுப்பெயரால் ஏற்படக்கூடிய தெளிவின்மை நீங்குகிறது. மூலத்தின் ‘மகள்’ என்ற சொல்லும், கிபியாவுடனான ஊரியேலின் தொடர்பும், போரைக் குறிக்கும் எளிய இருப்புநிலைக் கூற்றும் பாதுகாக்கப்பட்டுள்ளன.'
