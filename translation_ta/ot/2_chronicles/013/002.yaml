source:
  edition: WLC
  text: שָׁל֣וֹשׁ שָׁנִ֗ים מָלַךְ֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ מִיכָיָ֥הוּ בַת אוּרִיאֵ֖ל מִן גִּבְעָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ה וּ/בֵ֥ין יָרָבְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
translation:
  language: ta
  text: அவர் எருசலேமில் மூன்று ஆண்டுகள் அரசாண்டார். அவருடைய தாயின் பெயர் கிபியாவைச் சேர்ந்த ஊரியேலின் மகளான மீகாயா[a]. அபியாவுக்கும் யெரொபெயாமுக்கும் இடையே போர் நடந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இணை வசனமான 1 அரசர்கள் 15:2 அபியாவின் தாயின் பெயரை ‘மாக்கா’ என்று கூறுகிறது. எபிரெயத்தில் ‘மகள்’ என்பது சில வேளைகளில் பெண் சந்ததியினருள் ஒருவரையும் குறிக்கலாம்; ஆகவே இரு பதிவுகளும் வெவ்வேறு பெயரிடும் அல்லது வம்சாவளி மரபுகளைப் பிரதிபலிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: அரசாண்டார்
  rationale: அரசராக ஆட்சி செய்ததைக் குறிக்கும் எபிரெய வினைச்சொல்லை, அரசர்களின் ஆட்சிக்காலப் பதிவுக்கேற்ற இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவருடைய தாயின் பெயர்
  rationale: எபிரெய மரபுவழிப் பதிவுச் சூத்திரத்தின் பொருளையும் அமைப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מִיכָיָהוּ
  choice: மிகாயா
  rationale: இந்த வசனத்திலுள்ள எபிரெயப் பெயர் வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; அரசர்கள் நூலிலுள்ள வேறுபட்ட பெயர் வடிவத்தை இங்கே புகுத்தவில்லை.
- source_word: בַת אוּרִיאֵל
  choice: ஊரியேலின் மகள்
  rationale: வாசகம் நேரடியாகக் கூறும் உறவுமுறையைத் தெளிவாகத் தருகிறது; ‘மகள்’ என்பதைக் ‘பேத்தி’ அல்லது ‘வழித்தோன்றல்’ என முதன்மை உரையில் விரிவுபடுத்தவில்லை.
- source_word: מִן גִּבְעָה
  choice: கிபியாவைச் சேர்ந்த
  rationale: מִן குறிக்கும் பிறப்பிடம் அல்லது ஊர்ச் சார்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; தொடரமைப்பின்படி இது ஊரியேலைக் குறிப்பதாகத் தரப்பட்டுள்ளது.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: போர் நடந்தது
  rationale: ‘போர் இருந்தது’ என்ற எபிரெய இருப்புநிலைக் கூற்றை, தொடர்ந்ததா அல்லது புதிதாக மூண்டதா என்று கூடுதல் காலநிலையைச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: בֵּין ... וּבֵין
  choice: '...க்கும் ...க்கும் இடையே'
  rationale: இரு தரப்பினருக்கிடையிலான எதிர்நிலையைத் தமிழில் வழக்கமான இணை அமைப்புடன் வெளிப்படுத்துகிறது.
- source_word: אֲבִיָּה
  choice: அபியா
  rationale: நாளாகமம் பயன்படுத்தும் பெயர் வடிவத்தைத் தமிழில் ஒலிபெயர்க்கிறது; அரசர்கள் நூலின் மாற்றுப் பெயரை இங்கே இறக்குமதி செய்யவில்லை.
theological_decisions:
- issue: அபியாவின் தாயின் பெயர் நாளாகமத்திலும் 1 அரசர்கள் 15:2-லும் வேறுபடுவது
  choice: முதன்மை உரையில் நாளாகமத்தின் ‘கிபியாவைச் சேர்ந்த ஊரியேலின் மகள் மிகாயா’ என்ற வாசகத்தை அப்படியே வைத்தல்
  alternative: 1 அரசர்கள் 15:2-க்கு இசைவாக ‘மாக்கா’ என்று மாற்றுதல், அல்லது ‘மகள்’ என்பதை ‘பேத்தி/பெண் வழித்தோன்றல்’ என்று விளக்கி மொழிபெயர்த்தல்
  rationale: மசோரெட்டிக் எபிரெய உரையிலுள்ள பெயரையும் உறவுச் சொல்லையும் மொழிபெயர்ப்பு காக்க வேண்டும். இணை வசனத்துடனான வரலாற்று அல்லது வம்சாவளி இழுபறியை முதன்மை உரையில் மறைமுகமாகத் தீர்க்காமல், தேவையான தகவலை அடிக்குறிப்பில் தருவது உரைநேர்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும், கண்ணியமான வேதாகம நடையில் அமைக்கப்பட்டது. ‘அரசாண்டார்’, ‘ஊரியேலின் மகள்’, ‘இடையே போர் நடந்தது’ ஆகியவை மூலத்தின் சுருக்கத்தையும் இயல்பான தமிழையும் சமநிலைப்படுத்துகின்றன. எல்லா பெயர்களும் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிவடிவங்களில் தரப்பட்டுள்ளன.
