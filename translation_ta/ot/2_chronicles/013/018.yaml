revisions:
- from: அந்த நேரத்தில் இஸ்ரவேல் மக்கள் அடக்கப்பட்டார்கள்; யூதா மக்கள் வலிமைபெற்றார்கள். ஏனெனில் அவர்கள் தங்கள் தந்தையரின் கடவுளாகிய யாவேவைச் சார்ந்திருந்தார்கள்.
  to: அந்த நேரத்தில் இஸ்ரவேல் மக்கள் கீழ்ப்படுத்தப்பட்டார்கள்; யூதா மக்கள் மேலோங்கினார்கள். ஏனெனில் அவர்கள் தங்கள் தந்தையரின் கடவுளாகிய யாவேவைச் சார்ந்திருந்தார்கள்.
