id: 2CH.13.18
reference: 2 Chronicles 13:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: ta
  text: அந்த நேரத்தில் இஸ்ரவேல் மக்கள் கீழ்ப்படுத்தப்பட்டார்கள்; யூதா மக்கள் மேலோங்கினார்கள். ஏனெனில் அவர்கள் தங்கள் தந்தையரின் கடவுளாகிய யாவேவைச் சார்ந்திருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: அடக்கப்பட்டார்கள்
  rationale: כנע என்பதன் நிபால் வடிவம் அடக்கப்படுதல் அல்லது கீழ்ப்படுத்தப்படுதல் என்ற விளைவுநிலையைத் தருகிறது. போர்ச் சூழலில், முழுமையான அழிவை மிகைப்படுத்தாமல் இந்தச் செயலற்ற பொருளைத் தக்கவைக்கிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லாட்சியில் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு வடக்கு அரசின் மக்களையோ படையினரையோ குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் யூதாவுடனான வேறுபாட்டைத் தெளிவாகவும் காட்ட ‘இஸ்ரவேல் மக்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בָּעֵת הַהִיא
  choice: அந்த நேரத்தில்
  rationale: எபிரெய காலக் குறிப்பைத் தெளிவான, இயல்பான தமிழில் நேரடியாகக் கொடுக்கிறது.
- source_word: וַיֶּאֶמְצוּ
  choice: வலிமைபெற்றார்கள்
  rationale: אמץ என்பது வலிமையடைதல் அல்லது வலுவாக இருத்தல் என்பதைக் குறிக்கிறது. ‘வெற்றி பெற்றார்கள்’ என்பது போரின் முடிவை அதிகமாக விளக்கிவிடக்கூடும்; ‘வலிமைபெற்றார்கள்’ மூலத்தின் சொற்பொருளையும் சூழலிலுள்ள மேலோங்குதலையும் காக்கிறது.
- source_word: בְנֵי יְהוּדָה
  choice: யூதா மக்கள்
  rationale: ‘இஸ்ரவேல் மக்கள்’ என்பதற்கு இணையான அமைப்பில் யூதா தரப்பினரைக் குறிக்கிறது; ‘யூதாவின் மகன்கள்’ என்பதைவிட நவீன தமிழில் இயல்பானது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யூதா மக்கள் வலிமைபெற்றதற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: נִשְׁעֲנוּ עַל
  choice: சார்ந்திருந்தார்கள்
  rationale: שען על என்பதன் அடிப்படை உருவகம் ‘மேல் சாய்தல்’; இங்கு உருவகமாக நம்பி ஆதரவு கொள்ளுதல். ‘சார்ந்திருந்தார்கள்’ அந்தப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: தங்கள் தந்தையரின் கடவுள்
  rationale: மூலத்திலுள்ள ஆண்பால் பன்மையான ‘தந்தையர்’ என்பதையும் உடன்படிக்கை வரலாற்றுச் சாயலையும் காக்கிறது. தமிழ்ச் சொற்றொடரில் இயல்பிற்காக ‘கடவுளாகிய’ என்ற இணைப்பு பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: யூதாவின் வலிமைக்கும் யாவேவைச் சார்ந்திருப்பதற்கும் உள்ள தொடர்பு
  choice: ‘ஏனெனில்’ மூலம் நேரடியான காரணத் தொடர்பு
  alternative: தளர்வான விளக்க அல்லது காலத் தொடர்பு
  rationale: כִּי இங்கு முந்தைய கூற்றுக்கான காரணத்தை இயல்பாக அறிமுகப்படுத்துகிறது; ஆகவே இறையியல் காரணத் தொடர்பை மங்கச் செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. எபிரெய இணை அமைப்பை இரண்டு சுயாதீன வாக்கியங்களாகத் தெளிவாக வைத்துள்ளது. ‘மகன்கள்’ என்ற சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்து, குழுவைக் குறிக்கும் இயல்பான ‘மக்கள்’ பயன்படுத்தப்பட்டுள்ளது.
