source:
  edition: WLC
  text: וַ/אֲנַ֛חְנוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ וְ/לֹ֣א עֲזַבְנֻ֑/הוּ וְ/כֹ֨הֲנִ֜ים מְשָׁרְתִ֤ים לַֽ/יהוָה֙ בְּנֵ֣י אַהֲרֹ֔ן וְ/הַ/לְוִיִּ֖ם בַּ/מְלָֽאכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
translation:
  language: ta
  text: ஆனால் நாங்களோ, யாவே எங்கள் கடவுள்; நாங்கள் அவரைக் கைவிடவில்லை.[a] யாவேவுக்குப் பணிவிடை செய்கிற ஆசாரியர்கள் ஆரோனின் மகன்கள்; லேவியர்கள் பணியில் இருக்கிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாங்கள் அவரை விட்டுவிடவில்லை.”
    reason: עזב என்பதற்கு ‘கைவிடு’, ‘விட்டுவிடு’ ஆகிய நெருக்கமான பொருள்கள் உண்டு.
  - marker: b
    text: நேர்மொழியாக, “லேவியர்கள் பணியில்.” எபிரெயத்தில் இங்கு வெளிப்படையான வினைச்சொல் இல்லை; லேவியர்கள் தங்களுக்கு ஒதுக்கப்பட்ட சேவையைச் செய்கிறார்கள் என்பது சூழலிலிருந்து விளங்குகிறது.
    reason: The source is a verbless phrase; the note identifies that form and gives only the contextual sense, without adding tense.
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: ஆனால் நாங்களோ
  rationale: இணைப்புச்சொல்லும் தனித்த சுட்டுப்பெயரும் சூழலில் யூதாவை வடக்கு அரசுடன் வேறுபடுத்திக் காட்டுகின்றன; ‘ஆனால் நாங்களோ’ அந்த எதிர்மறை ஒப்பீட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵינוּ
  choice: எங்கள் கடவுள்
  rationale: இங்கு ஒருமைச் சுட்டான யாவேயைக் குறிக்கும் உடன்படிக்கைச் சூழலில், இயல்பான ஒருமைப் பொருளைத் தருகிறது.
- source_word: וְלֹא עֲזַבְנֻהוּ
  choice: நாங்கள் அவரைக் கைவிடவில்லை
  rationale: עזב என்பதன் ‘கைவிடு/விட்டுவிடு’ என்ற பொருளையும், கடந்தகாலத்திலிருந்து தொடரும் உண்மைத்தன்மை குறித்த அபியாவின் வலியுறுத்தலையும் இயல்பாகக் காட்டுகிறது.
- source_word: מְשָׁרְתִים לַיהוָה
  choice: யாவேக்குப் பணிவிடை செய்கிற
  rationale: தொடர்ந்து நடைபெறும் ஆலய வழிபாட்டுச் சேவையைப் பொதுவான ‘சேவை’ என்பதைக் காட்டிலும் தெளிவாகக் குறிக்கிறது.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மகன்கள்
  rationale: ஆரோனின் வழிவந்த ஆசாரிய மரபைக் குறிக்கும் எபிரெய வடிவத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְהַלְוִיִּם בַּמְלָאכֶת
  choice: லேவியர்கள் தங்கள் பணியில் ஈடுபட்டிருக்கிறார்கள்
  rationale: எபிரெயில் வினைச்சொல் வெளிப்படையாக இல்லாவிட்டாலும், லேவியர்கள் தங்களுக்கு ஒதுக்கப்பட்ட ஆலயப் பணியைச் செய்துகொண்டிருப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: עֲזַבְנֻהוּ என்பதன் கால மற்றும் உடன்படிக்கைச் சார்பு
  choice: நாங்கள் அவரைக் கைவிடவில்லை
  alternative: நாங்கள் அவரைக் கைவிடவில்லை என்பதே கடந்த நிகழ்வை மட்டும் குறிக்கும் வாசிப்பு; நாங்கள் அவரை விட்டுவிடவில்லை
  rationale: எபிரெய நிறைவுவினை இவ்வுரையாடல் சூழலில் தொடர்ந்து நிலவும் விசுவாசத்தை வலியுறுத்தலாம்; தமிழ் வடிவம் கடந்த செயலும் தற்போதைய விளைவும் இடையிலான இயல்பான தெளிவின்மையைத் தக்கவைக்கிறது.
- issue: ஆரோனின் ‘மகன்கள்’ என்பதன் மரபுரிமைப் பொருள்
  choice: ஆரோனின் மகன்கள்
  alternative: ஆரோனின் வழித்தோன்றல்கள்
  rationale: மூலத்தின் முறையான சொற்றொடரைப் பாதுகாக்கிறது; சூழலில் அது உயிரியல் மகன்களை மட்டும் அல்லாமல் ஆசாரிய வழிமரபையும் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் மரியாதையும் வழிபாட்டுச் சூழலுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘ஆசாரியர்கள்’, ‘பணிவிடை’, ‘லேவியர்கள்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
