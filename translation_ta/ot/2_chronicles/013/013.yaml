  yaml_path: translation/ot/2_chronicles/013/013.yaml
  text: But Yarobam had turned the ambush around to come behind them, so they were in front of Judah, and the ambush was behind them.
translation:
  language: ta
  text: ஆனால் யெரொபெயாம் பதுங்கிப் தாக்கும் படையை யூதாவுக்குப் பின்னால் வருமாறு சுற்றிவரச் செய்திருந்தான். இதோ, அவர்கள் யூதாவுக்கு முன்பாக இருந்தனர்; பதுங்கிப் தாக்கும் படை யூதாவுக்குப் பின்னால் இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרָבְעָם
  choice: யெரொபெயாம்
  rationale: தமிழில் நிலைபெற்றுள்ள வேதாகமப் பெயர் வடிவம்; எபிரெயப் பெயரை அடையாளம் காண உதவுகிறது.
- source_word: הַמַּאְרָב
  choice: பதுங்கியிருந்த படை
  rationale: இங்கு சொல் பதுங்கித் தாக்க வைக்கப்பட்ட படைப்பிரிவைக் குறிக்கிறது; வெறும் ‘பதுங்குதல்’ என்பதைக் காட்டிலும் சூழலைத் தெளிவாகத் தருகிறது.
- source_word: הֵסֵב
  choice: சுற்றிவரச் செய்து
  rationale: படையைத் திருப்பி எதிரியின் பின்புறம் கொண்டு சென்ற போர்தந்திரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי יְהוּדָה
  choice: யூதாவின் முன்னால்
  rationale: எபிரெய உரையின் இடவியல் எதிரெதிர் அமைப்பை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், போர்க்கள நிலையைத் தெளிவாகவும் கண்ணியமாகவும் கூறப்பட்டுள்ளது. இரண்டாவது வாக்கியத்தில் உள்ள ‘பிரதான படை’ என்பது எபிரெய உரையில் வெளிப்படையாக இல்லாவிட்டாலும், ‘அவர்கள்’ என்பது யெரொபெயாமின் முன்னணி படையைக் குறிப்பதைத் தமிழில் தெளிவுபடுத்துகிறது.
