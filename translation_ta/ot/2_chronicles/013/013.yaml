revisions:
- from: ஆனால் யெரொபெயாம் பதுங்கியிருந்த படையைச் சுற்றிவரச் செய்து, அவர்களுக்குப் பின்னால் வரும்படி செய்திருந்தான். இவ்வாறு, யூதாவின் முன்னால் பிரதான படையும், அவர்களுக்குப் பின்னால் பதுங்கியிருந்த படையும் இருந்தன.
  to: ஆனால் யெரொபெயாம் பதுங்கிப் தாக்கும் படையை யூதாவுக்குப் பின்னால் வருமாறு சுற்றிவரச் செய்திருந்தான். இதோ, அவர்கள் யூதாவுக்கு முன்பாக இருந்தனர்; பதுங்கிப் தாக்கும் படை யூதாவுக்குப் பின்னால் இருந்தது.
  rationale: 'The revision removes the unsupported “main army,” streamlines the causative movement, and makes the two spatial positions explicit: Jeroboam''s forces were before Judah, and the ambush was behind Judah. It retains the established Tamil name and the tactical sense of the Hebrew term for ambush.'
