translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. பெரும் எண்ணிக்கைகள் தமிழ் வாசிப்பு மரபின்படி ‘நான்கு இலட்சம்’, ‘எட்டு இலட்சம்’ என வழங்கப்பட்டுள்ளன. இரு படைகளையும் விவரிக்கும் எபிரெயச் சொற்றொடர்களின் சிறிய வேறுபாடு ‘வீரர்கள்’ மற்றும் ‘வலிமைமிக்க வீரர்கள்’ என்று தக்கவைக்கப்பட்டுள்ளது.
