  text: וַ/יֶּאְסֹ֨ר אֲבִיָּ֜ה אֶת הַ/מִּלְחָמָ֗ה בְּ/חַ֨יִל֙ גִּבּוֹרֵ֣י מִלְחָמָ֔ה אַרְבַּע מֵא֥וֹת אֶ֖לֶף אִ֣ישׁ בָּח֑וּר וְ/יָרָבְעָ֗ם עָרַ֤ךְ עִמּ/וֹ֙ מִלְחָמָ֔ה בִּ/שְׁמוֹנֶ֨ה מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ בָּח֖וּר גִּבּ֥וֹר חָֽיִל־־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
translation:
  language: ta
  text: அபியா, தேர்ந்தெடுக்கப்பட்ட நான்கு இலட்சம் வீரமிக்க போர்வீரர்களைக் கொண்ட படையுடன் போரில் ஈடுபட்டான்[a]. யெரொபெயாம், தேர்ந்தெடுக்கப்பட்ட எட்டு இலட்சம் வலிமைமிக்க வீரர்களுடன் அவனை எதிர்த்துப் போரிட அணிவகுத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “போரில் ஈடுபட்டான்” என்பதற்கான எபிரெய மரபுத்தொடர் சொற்சொல்லாக “போரைக் கட்டினான்” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר אֶת־הַמִּלְחָמָה
  choice: போரில் ஈடுபட்டான்
  rationale: אָסַר என்பதன் அடிப்படைப் பொருள் ‘கட்டு’ என்றாலும், இங்குள்ள இராணுவ மரபுத்தொடர் ஒரு குறிப்பிட்ட போரில் இறங்குவதைக் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘போரில் ஈடுபட்டான்’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בְּחַיִל
  choice: படையுடன்
  rationale: חַיִל என்பதற்கு வலிமை, படை, செல்வம் போன்ற பொருள்கள் உண்டு; இங்கு படைவீரர்களின் எண்ணிக்கை தொடர்ந்து வருவதால் ‘படை’ பொருத்தமானது.
- source_word: גִּבּוֹרֵי מִלְחָמָה
  choice: வீரர்கள்
  rationale: இச்சொற்றொடர் வல்லமையும் போர் அனுபவமும் கொண்ட போர்வீரர்களைக் குறிக்கிறது. தமிழில் ‘வீரர்கள்’ என்பது இச்சூழலில் இயல்பாக அந்த இராணுவத் தன்மையைத் தெரிவிக்கிறது.
- source_word: בָּחוּר
  choice: தேர்ந்தெடுக்கப்பட்ட
  rationale: இங்கு בָּחוּר என்பது போருக்காகத் தெரிந்தெடுக்கப்பட்ட சிறந்த வீரர்களைக் குறிக்கிறது; வயதை மட்டும் குறிக்கும் ‘இளைஞர்’ என்பதைக் காட்டிலும் ‘தேர்ந்தெடுக்கப்பட்ட’ சூழலுக்கு ஏற்றது.
- source_word: עָרַךְ עִמּוֹ מִלְחָמָה
  choice: அவனை எதிர்த்துப் போரிட அணிவகுத்தான்
  rationale: עָרַךְ என்ற வினை இராணுவச் சூழலில் படைகளைப் போர் அணியில் நிறுத்துவதைக் குறிக்கிறது; ‘அணிவகுத்தான்’ அதன் தந்திரப் பொருளைத் தக்கவைக்கிறது.
- source_word: גִּבּוֹר חָיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: இந்த இராணுவச் சொற்றொடர் வலிமையும் திறமையும் துணிவும் கொண்ட போர்வீரர்களைக் குறிக்கிறது. ‘வலிமைமிக்க வீரர்கள்’ நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
