id: 2CH.13.5
reference: 2 Chronicles 13:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הֲ/לֹ֤א לָ/כֶם֙ לָ/דַ֔עַת כִּ֞י יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נָתַ֨ן מַמְלָכָ֧ה לְ/דָוִ֛יד עַל יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם ל֥/וֹ וּ/לְ/בָנָ֖י/ו בְּרִ֥ית מֶֽלַח׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
translation:
  language: ta
  text: இஸ்ரவேலின் கடவுளாகிய யாவே, இஸ்ரவேல்மீதான அரசாட்சியைத் தாவீதுக்கும் அவனுடைய மகன்களுக்கும்[b] என்றென்றும் உப்பின் உடன்படிக்கையால்[a] கொடுத்தார் என்பது உங்களுக்குத் தெரியாதா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உப்பின் உடன்படிக்கையோடு” என்றும் மொழிபெயர்க்கலாம். இச்சொற்றொடர் கட்டுப்படுத்தும், நீடித்த உடன்படிக்கையைக் குறிப்பதாக இருக்கலாம்; எண்ணாகமம் 18:19-ஐ ஒப்பிடுக.
    reason: lexical_alternative
  - marker: b
    text: “அவனுடைய மகன்கள்” என்பது தாவீதின் அரச வழியினரை, அதாவது அவனுடைய வம்சத்தை, குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא לָכֶם לָדַעַת
  choice: என்பது உங்களுக்குத் தெரியாதா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் வலியுறுத்தலான வினாவை இயல்பான நவீனத் தமிழில் காக்கிறது; அறிந்திருக்க வேண்டிய செய்தி என்பதையும் உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தைப் பதிலாக இடாமல், எபிரெயத் திருப்பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இது இயல்பான தமிழ் இணைப்புத்தொடராக இருந்து, யாவே இஸ்ரவேலின் கடவுள் என்பதைத் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: נָתַן מַמְלָכָה ... עַל יִשְׂרָאֵל
  choice: இஸ்ரவேல்மீதான அரசாட்சியைக் ... கொடுத்தார்
  rationale: מַמְלָכָה என்பதிலுள்ள அரசாளும் ஆட்சி அல்லது உரிமை என்ற சூழல்சார் பொருளையும், עַל குறிக்கும் ‘மீது’ என்ற ஆளுகை உறவையும் காக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: உடன்படிக்கையின் நீடித்த தன்மையை வலுவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לוֹ וּלְבָנָיו
  choice: தாவீதுக்கும் அவனுடைய மகன்களுக்கும்
  rationale: ‘அவனுக்கும்’ என்ற சுட்டுப்பெயர் தமிழில் தெளிவின்மையை உண்டாக்கக்கூடும் என்பதால் தாவீதின் பெயரை மீண்டும் கூறுகிறது; בָנָיו என்பதன் நேரடியான ‘அவனுடைய மகன்கள்’ என்ற வடிவத்தைக் காக்கிறது.
- source_word: בְּרִית מֶלַח
  choice: உப்பின் உடன்படிக்கையால்
  rationale: எபிரெய உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே காக்கிறது; בְּ முன்னிடைச்சொல்லின் கருவி அல்லது அடிப்படை சார்ந்த பொருளை ‘ஆல்’ தெரிவிக்கிறது.
theological_decisions:
- issue: தாவீதுக்குக் கொடுக்கப்பட்ட அரசாட்சியின் நிரந்தரத் தன்மை
  choice: ‘என்றென்றும்’ மற்றும் ‘உப்பின் உடன்படிக்கை’ ஆகிய இரு வெளிப்பாடுகளையும் உரையில் காத்தல்
  alternative: ‘நிரந்தரமான உடன்படிக்கை’ என்று உருவகத்தை விளக்கிப் பெயர்த்தல்
  rationale: மூல எபிரெயம் לְעוֹלָם என்பதையும் בְּרִית מֶלַח என்பதையும் தனித்தனியாகப் பயன்படுத்துகிறது. இரண்டையும் காப்பது உடன்படிக்கையின் வலிமையைக் குறைக்காமலும், பிற்கால இறையியல் முடிவுகளை மொழிபெயர்ப்புக்குள் சேர்க்காமலும் இருக்கிறது.
- issue: ‘மகன்கள்’ என்பதன் வம்சத் தொடர்பு
  choice: முதன்மை உரையில் ‘அவனுடைய மகன்கள்’ என்று நேரடியாக மொழிபெயர்த்து, அரச வம்சப் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: முதன்மை உரையிலேயே ‘அவனுடைய வம்சத்தார்’ என்று மொழிபெயர்த்தல்
  rationale: மூலத்தின் குடும்பச் சொல்லாட்சியைக் காக்கிறது; அதேவேளையில் அரச வாரிசுரிமைச் சூழலை வாசகர் அறிய உதவுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய அதே நேரத்தில் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. வலியுறுத்தலான வினா இறுதியில் இயல்பாக வைக்கப்பட்டுள்ளது. ‘யாவே’ எனத் திருப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; ‘உப்பின் உடன்படிக்கை’ என்ற பண்பாட்டு உருவகம் உரையிலேயே காக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
