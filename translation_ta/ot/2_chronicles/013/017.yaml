base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
translation:
  language: ta
  text: அபியாவும் அவனுடைய மக்களும் அவர்களைப் பெரும் அடியால் தாக்கினார்கள்[a]. இஸ்ரவேலருள் தேர்ந்தெடுக்கப்பட்ட ஐந்நூறாயிரம் பேர் கொல்லப்பட்டு விழுந்தார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு கடுமையான அடி.” எபிரெயத்தில், “ஒரு பெரும் அடி”; “பெரும் படுகொலை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இஸ்ரவேலருள் தேர்வான ஐந்நூறாயிரம் பேர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ בָהֶם
  choice: அவர்களைக் கடுமையாகத் தாக்கினார்கள்
  rationale: נכה என்பது போர்ச் சூழலில் தாக்குவதைக் குறிக்கிறது. பின்வரும் சொற்றொடரான מַכָּה רַבָּה-வின் தீவிரத்தையும் சேர்த்து, இயல்பான நவீனத் தமிழில் இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: אֲבִיָּה וְעַמּוֹ
  choice: அபியாவும் அவனுடைய மக்களும்
  rationale: עַם என்பதன் அடிப்படைப் பொருள் ‘மக்கள்.’ இங்கு அது அவனுடன் போரிட்டவர்களைக் குறித்தாலும், ‘படை’ என்று பொருளைக் குறுக்காமல் எபிரெய வடிவை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: מַכָּה רַבָּה
  choice: கடுமையாக
  rationale: சொல்லுக்கு சொல் ‘ஒரு பெரும் அடி/தாக்குதல்.’ தமிழில் தேவையற்ற மறுகூறலைத் தவிர்த்து அதன் தீவிரத்தை வினையடையாக இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: கொல்லப்பட்டு விழுந்தார்கள்
  rationale: נפל என்பதன் ‘விழுதல்’ என்ற படிமத்தையும், חֲלָלִים குறிக்கும் போரில் கொல்லப்பட்ட நிலைமையையும் இரண்டையும் காக்கிறது.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலைச் சேர்ந்த
  rationale: உயிரிழந்தவர்கள் இஸ்ரவேல் தரப்பைச் சேர்ந்தவர்கள் என்பதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: ஐந்நூறாயிரம்
  rationale: மசோரா எபிரெய உரையிலுள்ள எண்ணிக்கையை மாற்றமோ குறைப்போ இன்றி நேரடியாக வழங்குகிறது.
- source_word: אִישׁ בָּחוּר
  choice: தேர்ந்தெடுக்கப்பட்ட ஆண்கள்
  rationale: בָּחוּר இங்கு தேர்ந்தெடுக்கப்பட்ட அல்லது சிறப்பாகத் தெரிவுசெய்யப்பட்ட போர்வீரர்களைக் குறிக்கிறது. ‘ஆண்கள்’ என்பது אִישׁ-ஐ வெளிப்படையாகப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: போரில் உயிரிழந்தவர்களின் மிகப் பெரிய எண்ணிக்கை
  choice: எபிரெய உரை கூறும் ஐந்நூறாயிரம் என்ற எண்ணிக்கையை அப்படியே வைத்தல்
  alternative: அதை மிகைப்படுத்தப்பட்ட போர்மொழியாகக் கருதுதல் அல்லது எண்ணை/அலகைத் திருத்திப் புரிந்துகொள்ளுதல்
  rationale: இந்த எண்ணை அடையாளப்பூர்வமாகவோ குறைந்த எண்ணாகவோ வாசிக்க வேண்டும் என்று வசனத்திலேயே எந்தக் குறியும் இல்லை. வரலாற்று விமர்சனக் கேள்வியை மொழிபெயர்ப்பில் தீர்மானிக்காமல் மூல உரையைப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் போர்ச் செயலும் அதன் விளைவான உயிரிழப்பும் தனித்தனி வாக்கியங்களாகத் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
