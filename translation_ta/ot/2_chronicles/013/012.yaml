  edition: WLC
  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
translation:
  language: ta
  text: இதோ, கடவுள் எங்கள் தலைமையில் எங்களோடு இருக்கிறார்; அவருடைய ஆசாரியர்களும் உங்களுக்கு எதிராகப் போர்முழக்கம் எழுப்புவதற்கான எக்காளங்களோடு இருக்கிறார்கள். இஸ்ரவேலின் மகன்களே[a], உங்கள் தந்தையரின் கடவுளாகிய யாவேக்கு எதிராகப் போரிடாதீர்கள்; ஏனெனில் நீங்கள் வெற்றியடைய மாட்டீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் மக்களே.” எபிரெய மூலத்தில் நேரடியாக “இஸ்ரவேலின் மகன்களே” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: தொடர்ந்து வருவதைக் கவனத்திற்குக் கொண்டுவரும் வலியுறுத்தலை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים
  choice: கடவுள் எங்களுக்குத் தலைவராக எங்களோடு இருக்கிறார்
  rationale: ‘எங்களோடு’ என்ற தெய்வீக உடனிருப்பையும், ‘தலையில்/தலைமையில்’ என்ற தலைமை உருவகத்தின் பொருளையும் தெளிவான தமிழில் தருகிறது.
- source_word: וְכֹהֲנָיו
  choice: அவருடைய ஆசாரியர்களும்
  rationale: மூன்றாம் நபர் ஒருமை உடைமை விகுதி கடவுளைக் குறிப்பதைப் பாதுகாக்கிறது.
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה לְהָרִיעַ עֲלֵיכֶם
  choice: போர்முழக்கத்திற்கான எக்காளங்களை உங்களுக்கு எதிராக முழக்குவதற்கு
  rationale: எக்காளங்களைக் குறிக்கும் பெயர்ச்சொல் தொடரையும், அவற்றை எதிரிகளுக்கு எதிராக முழக்குவதைக் குறிக்கும் நோக்க வினையையும் தனித்தனியாகப் பாதுகாக்கிறது; போர்ச் சூழலையும் தெளிவாக்குகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மகன்களே
  rationale: நேரடி அழைப்பையும் எபிரெய மொழியின் ஆண்பால் பன்மை வடிவத்தையும் காக்கிறது; பரிச்சயமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַל תִּלָּחֲמוּ עִם יְהוָה
  choice: யாவேக்கு எதிராகப் போரிடாதீர்கள்
  rationale: לָחַם உடன் עִם பகைமைப் பொருளில் வருவதால் ‘எதிராக’ என்று தெளிவாக மொழிபெயர்க்கப்படுகிறது; தெய்வீகப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: உங்கள் தந்தையரின் கடவுள்
  rationale: உடன்படிக்கை சார்ந்த மூலத் தொடரின் குடும்ப மற்றும் தலைமுறைச் சுட்டலை நேரடியாகக் காக்கிறது.
- source_word: כִּי לֹא תַצְלִיחוּ
  choice: ஏனெனில் நீங்கள் வெற்றியடைய மாட்டீர்கள்
  rationale: צָלַח என்பதன் ‘வெற்றிபெறு/சித்தியடை’ என்ற பொருளை இப்போர்ச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் அறியத்தக்க முறையில் ஒலிபெயர்க்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினம் குறிக்கப்பட்ட நேரடி அழைப்பு
  choice: இஸ்ரவேலின் மகன்களே
  alternative: இஸ்ரவேல் மக்களே
  rationale: மூலத்தின் ஆண்பால் பன்மை வடிவத்தையும் நேரடி அழைப்பையும் பிரதான உரையில் காக்கிறது; இனக்குழுவை பொதுவாகக் குறிக்கும் மாற்றை அடிக்குறிப்பில் பதிவு செய்கிறது.
- issue: בָרֹאשׁ என்ற தலைமை உருவகம்
  choice: எங்களுக்குத் தலைவராக
  alternative: எங்கள் முன்னணியில்
  rationale: இச்சொல் தலைமை அல்லது படையின் முன்நிலை என்ற இரு நுணுக்கங்களையும் கொண்டிருக்கலாம்; தமிழில் தலைமைப் பொருளைத் தேர்ந்தெடுத்தாலும், தெய்வீக வழிநடத்தலை அளவுக்கு மீறி விளக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘ஆசாரியர்கள்,’ ‘எக்காளங்கள்,’ ‘போர்முழக்கம்’ போன்ற வேதாகம மற்றும் போரியல் சொற்கள் சூழலுக்கேற்றவாறு தக்கவைக்கப்பட்டுள்ளன.
