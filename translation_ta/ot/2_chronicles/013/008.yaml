  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
translation:
  language: ta
  text: இப்போதோ, தாவீதின் மகன்களின் கையில் இருக்கும் யாவேயின் அரசாட்சிக்கு எதிராக வலிமை காட்ட நீங்கள் சொல்கிறீர்கள்[a][b]. நீங்கள் பெருந்திரளாக இருக்கிறீர்கள்; யெரொபெயாம் உங்களுக்காகத் தெய்வங்களாகச் செய்த தங்கக் கன்றுகளும் உங்களோடு இருக்கின்றன[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் அரசாட்சிக்கு முன்பாக உங்களை வலுப்படுத்திக்கொள்ள நீங்கள் சொல்கிறீர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “தாவீதின் மகன்களின் கையில்” என்பது எபிரெயச் சொற்றொடர்; தாவீதின் வம்சத்தார் மூலம் நடைபெறும் ஆட்சி அல்லது நிர்வாகத்தை இது குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “தெய்வங்களுக்காக.” எபிரெயச் சொல் பன்மையில் உள்ளது; யெரொபெயாம் செய்த கன்றுச் சிலைகளை இது விமர்சனத் தொனியில் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: நீங்கள் சொல்கிறீர்கள்
  rationale: எபிரெயப் பங்கேற்புவினையின் நிகழ்கால அல்லது உடனடி நோக்க நுணுக்கத்தைப் பாதுகாத்து, அபியாவின் நேரடி குற்றச்சாட்டின் வலிமையையும் தக்கவைக்கிறது.
- source_word: לְהִתְחַזֵּק ... לִפְנֵי
  choice: எதிர்த்து வலிமையுடன் நிற்கலாம்
  rationale: חזק என்பதன் தன்னிலை வடிவிலுள்ள ‘தம்மை வலுப்படுத்துதல்/வலிமைகாட்டுதல்’ என்ற கருத்தையும், இப்போர்ச் சூழலில் לִפְנֵי குறிக்கும் எதிர்நிற்றலையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: מַמְלֶכֶת יְהוָה
  choice: யாவேயின் அரசு
  rationale: அரசு யாவேக்கு உரியது என்ற நாளாகமத்தின் முக்கிய இறையியல் கூற்றை நேரடியாகப் பாதுகாக்கிறது; יהוה என்பது தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּיַד בְּנֵי דָוִיד
  choice: தாவீதின் மகன்களின் கையில் உள்ள
  rationale: ஆட்சி அல்லது நிர்வாகத்தைக் குறிக்கும் ‘கையில்’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, யாவேயின் அரசு தாவீதின் வழியினர் மூலம் நடத்தப்படுகிறது என்ற பதற்றமிக்க இரு கூறுகளையும் தக்கவைக்கிறது.
- source_word: הָמוֹן רָב
  choice: பெருந்திரளாக
  rationale: எண்ணிக்கையிலான மிகுதியைச் சுட்டும் படைத்துறைச் சூழலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עֶגְלֵי זָהָב
  choice: தங்கக் கன்றுகள்
  rationale: யெரொபெயாம் நிறுவிய நன்கு அறியப்பட்ட வழிபாட்டுச் சிலைகளைத் தெளிவாகக் குறிக்கிறது.
- source_word: לֵאלֹהִים
  choice: தெய்வங்களாக
  rationale: பன்மை வடிவையும், அந்தக் கன்றுகள் வழிபாட்டுப் பொருள்களாக ஆக்கப்பட்டன என்ற வசனத்தின் விமர்சனத் தொனியையும் மென்மையாக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைத் தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: தாவீதின் வம்சத்துக்கும் யாவேயின் அரசுக்கும் உள்ள உறவு
  choice: தாவீதின் மகன்களின் கையில் உள்ள யாவேயின் அரசு
  alternative: தாவீதின் மகன்கள் ஆளும் யாவேயின் அரசு
  rationale: அரசு யாவேக்கு உரியது என்பதையும் அது தாவீதின் வம்சத்தாரின் ‘கையில்’ இருப்பதையும் ஒன்றாக வைத்திருந்து, மூலத்தின் இறையியல் பதற்றத்தை விளக்கிச் சுருக்காமல் பாதுகாக்கிறது.
- issue: தங்கக் கன்றுகளைக் குறிக்கும் אֱלֹהִים என்பதன் பன்மை
  choice: தெய்வங்களாக
  alternative: தெய்வமாக
  rationale: எபிரெயப் பன்மையையும் சிலைவழிபாட்டுக்கு எதிரான விவாதத் தொனியையும் அப்படியே தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் அபியாவின் மோதல்மிக்க உரைக்கேற்ற கண்ணியமான தொனியிலும் அமைக்கப்பட்டுள்ளது. ‘கையில்’ என்ற மூல உருவகம் திட்டமிட்டு வைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; வாக்கியத் தொடர்பை வெளிப்படுத்த மூலத்தில் இல்லாத ‘ஏனெனில்’ சேர்க்கப்படவில்லை.
