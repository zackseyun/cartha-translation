  to: இப்போதோ, தாவீதின் மகன்களின் கையில் இருக்கும் யாவேயின் அரசாட்சிக்கு எதிராக வலிமை காட்ட நீங்கள் சொல்கிறீர்கள்[a][b]. நீங்கள் பெருந்திரளாக இருக்கிறீர்கள்; யெரொபெயாம் உங்களுக்காகத் தெய்வங்களாகச் செய்த தங்கக் கன்றுகளும் உங்களோடு இருக்கின்றன[c].
  rationale: The revision removes the unwarranted modal implication in ‘நிற்கலாம்,’ rendering the infinitive with ‘வலிமை காட்ட.’ It retains the Hebrew image that Yahweh’s kingdom is in the hand of David’s sons, while using ‘அரசாட்சி’ for a natural and accurate rendering of ‘kingdom.’ Footnote anchors are placed with the expressions they annotate, and the alternative for לֵאלֹהִים is aligned with the source’s ‘for gods’ possibility.
