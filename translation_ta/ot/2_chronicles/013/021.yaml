base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
translation:
  language: ta
  text: அபியா வலிமை பெற்றான்[a]. அவன் தனக்காகப் பதினான்கு மனைவிகளை எடுத்துக்கொண்டு[b], இருபத்திரண்டு மகன்களையும் பதினாறு மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வல்லமை அடைந்தான்”; அல்லது, “தன்னை வலுப்படுத்திக்கொண்டான்.”
    reason: lexical_alternative
  - marker: b
    text: “மனைவிகளை எடுத்துக்கொண்டான்” என்பது அவர்களை மணந்துகொண்டான் என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: வலிமை பெற்றான்
  rationale: חזק என்பதன் ஹித்பயேல் வடிவம் இங்கு வலிமையோ நிலைப்பாடோ அதிகரித்ததைக் குறிக்கிறது. ‘வலிமை பெற்றான்’ என்பது அரசியல் அல்லது இராணுவ வல்லமையை மட்டும் குறிப்பதாகச் சுருக்காமல் எபிரெயச் சொல்லின் பரப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: אֲבִיָּהוּ
  choice: அபியா
  rationale: வேதாகமப் பெயரின் தமிழில் நிலைபெற்ற, எளிதில் அறியக்கூடிய வடிவம்.
- source_word: וַיִּשָּׂא לוֹ נָשִׁים אַרְבַּע עֶשְׂרֵה
  choice: அவன் தனக்காகப் பதினான்கு மனைவிகளை எடுத்துக்கொண்டு
  rationale: נשא ... נשים என்பது திருமணம் செய்துகொள்வதைக் குறிக்கும் மரபுத்தொடர். அதேவேளை לוֹ என்பதிலுள்ள ‘தனக்காக’ என்ற நுணுக்கத்தையும் மூலத்தின் உருவகத்தையும் இவ்வடிவம் காக்கிறது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: ஆண் எழுவாயுடன் வரும் ילד என்பதன் ஹிஃபில் வடிவம் பிள்ளைகளுக்குத் தந்தையானதைக் குறிக்கிறது. ‘பெற்றான்’ என்பது சூழலில் தெளிவானதும் இயல்பான நவீனத் தமிழுமாகும்.
- source_word: עֶשְׂרִים וּשְׁנַיִם בָּנִים
  choice: இருபத்திரண்டு மகன்கள்
  rationale: எண்ணையும் பாலினத்தைக் குறிக்கும் ‘மகன்கள்’ என்பதையும் மூலத்தின்படி நேரடியாகக் காக்கிறது.
- source_word: וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת
  choice: பதினாறு மகள்கள்
  rationale: எண்ணையும் பாலினத்தைக் குறிக்கும் ‘மகள்கள்’ என்பதையும் மூலத்தின்படி நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: பல மனைவிகளை மணந்ததாக வரும் வரலாற்று விவரிப்பு
  choice: ‘தனக்காகப் பதினான்கு மனைவிகளை எடுத்துக்கொண்டு’ என்று மதிப்பீடு சேர்க்காமல் நிகழ்வை விவரித்தல்
  alternative: ‘பதினான்கு பெண்களை மணந்துகொண்டான்’ என்று மரபுத்தொடரை முழுமையாகப் பொருளாக்குதல் அல்லது ஒழுக்கத் தீர்ப்பைச் சேர்த்தல்
  rationale: இவ்வசனம் அபியாவின் செயலைப் பாராட்டவோ கண்டிக்கவோ இல்லை. ஆகவே மூலத்தில் இல்லாத அறநெறி அல்லது கோட்பாட்டுத் தீர்ப்பை மொழிபெயர்ப்பு சேர்க்காமல், உரையின் இறையியல் இழுபறியை அப்படியே விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் தொடர்ச்சியை இயல்பான தமிழுக்காக இரண்டு வாக்கியங்களாகப் பிரித்துள்ளோம்; எண்ணிக்கைகளும் பாலினக் குறிப்புகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன.
