revisions:
- from: தாவீதின் மகன் சாலொமோனுடைய பணியாளனான நேபாத்தின் மகன் யெரொபெயாம் எழுந்து, தன் எஜமானனுக்கு எதிராக[a] கலகம் செய்தான்.
  to: நேபாத்தின் மகனும், தாவீதின் மகன் சாலொமோனின் பணியாளனுமான யெரொபெயாம் எழுந்து, தன் தலைவனுக்கு[a] எதிராகக் கிளர்ச்சி செய்தான்.
  rationale: The revision retains the source’s appositional identifications and narrative sequence while using smoother modern Tamil. “தலைவன்” represents the human superior denoted by אֲדֹנָיו; the possible alternative “எஜமானன்” is retained in a precisely anchored footnote. “எதிராகக் கிளர்ச்சி செய்தான்” clearly renders the political rebellion of וַיִּמְרֹד.
