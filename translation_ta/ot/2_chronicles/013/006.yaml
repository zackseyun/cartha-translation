reference: 2 Chronicles 13:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט עֶ֖בֶד שְׁלֹמֹ֣ה בֶן דָּוִ֑יד וַ/יִּמְרֹ֖ד עַל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
translation:
  language: ta
  text: நேபாத்தின் மகனும், தாவீதின் மகன் சாலொமோனின் பணியாளனுமான யெரொபெயாம் எழுந்து, தன் தலைவனுக்கு[a] எதிராகக் கிளர்ச்சி செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் எஜமானனுக்கு.” இங்கு சாலொமோன் என்ற மனித அதிகாரியே குறிப்பிடப்படுகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: எழுந்து
  rationale: קום என்பதன் கதைநடைச் செயற்பாட்டை இயல்பாகத் தருகிறது; இது இராணுவ நடவடிக்கை மட்டுமே என்று மிகையாகக் குறிப்பதில்லை.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: தனிப்பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டு, தந்தை-மகன் உறவு இயல்பான தமிழில் நேரடியாகத் தரப்பட்டுள்ளது.
- source_word: עֶבֶד
  choice: பணியாளன்
  rationale: இந்த அரச நிர்வாகச் சூழலில் சாலொமோனுக்குக் கீழ்ப்பட்ட சேவையாளரைக் குறிக்கிறது. ‘அடிமை’ என்பது சாத்தியமான பொருளாயினும், இங்கு தேவையற்ற உடைமை அடிமைத்தனக் கருத்தை முன்னிறுத்தக்கூடும்.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: தாவீதின் மகன் சாலொமோன்
  rationale: பெயர்கள் ஒலிபெயர்க்கப்பட்டு, வம்ச உறவின் வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיִּמְרֹד
  choice: கலகம் செய்தான்
  rationale: מרד அதிகாரத்துக்கு எதிரான கிளர்ச்சி அல்லது கலகத்தைக் குறிக்கிறது; அரசியல் சூழலில் ‘கலகம் செய்தான்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עַל אֲדֹנָיו
  choice: தன் எஜமானனுக்கு எதிராக
  rationale: இங்கு 3ஆம் நபர் ஆண்பால் ஒருமை பின்னொட்டுடன் வரும் אָדוֹן, யெரொபெயாமின் மனித அதிகாரியான சாலொமோனைக் குறிக்கிறது. ‘எஜமானன்’ கீழ்ப்படிதல் மற்றும் அதிகார உறவைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: மனித அதிகாரியைக் குறிக்கும் אֲדֹנָיו என்பதன் மொழிபெயர்ப்பு
  choice: தன் எஜமானனுக்கு
  alternative: தன் ஆண்டவனுக்கு
  rationale: இது இறைவனைக் குறிக்கும் பெயரோ பட்டமோ அல்ல; சாலொமோன் என்ற மனித அதிகாரியைக் குறிக்கிறது. ‘எஜமானன்’ என்பது தமிழில் இந்த வேறுபாட்டைத் தெளிவாக வைத்திருக்கிறது; ‘ஆண்டவன்’ என்ற மாற்றும் சொற்பொருளில் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் வம்ச மற்றும் அதிகார உறவுகள் பாதுகாக்கப்பட்டுள்ளன; ‘ஆண்டவன்’ இறைவனைக் குறிக்கிறது என்ற தவறான புரிதலைத் தவிர்க்க முதன்மை உரையில் ‘எஜமானன்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
