base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: The rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
translation:
  language: ta
  text: அபியாவின் எஞ்சிய செயல்களும், அவரது வழிகளும் சொற்களும், இறைவாக்கினர் இத்தோவின் மித்ராஷில்[a] எழுதப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விளக்கவுரை,’ ‘விரிவுரை’ அல்லது பொதுவாக ‘பதிவு’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல்லான ‘மித்ராஷ்,’ எழுதப்பட்ட ஒரு விளக்க அல்லது ஆய்வுப் படைப்பைக் குறிக்கிறது; பிற்காலத்தில் வளர்ச்சியடைந்த ரபீக்களின் மித்ராஷ் இலக்கிய வகையையே இது அவசியமாகக் குறிப்பதில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲבִיָּה
  choice: அபியாவின் எஞ்சிய செயல்கள்
  rationale: அரசர்களைப் பற்றிய வரலாற்றுச் சுருக்கங்களில் דִּבְרֵי என்பது வெறும் ‘சொற்கள்’ என்பதைக் காட்டிலும் அவருடைய செயல்கள் அல்லது நிகழ்வுகளை விரிவாகக் குறிக்கிறது; וְיֶתֶר என்பதன் மீதமுள்ளவற்றைக் குறிக்கும் பொருள் ‘எஞ்சிய’ என இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: וּדְרָכָיו
  choice: அவரது வாழ்க்கை வழிகள்
  rationale: דֶּרֶךְ என்பதன் ‘வழி’ என்ற உருவகத்தைத் தக்கவைத்தபடியே, இங்கு அது வாழ்க்கை முறை அல்லது நடத்தை குறிக்கிறது என்பதை ‘வாழ்க்கை வழிகள்’ தெளிவுபடுத்துகிறது.
- source_word: וּדְבָרָיו
  choice: அவரது சொற்கள்
  rationale: முன்னுள்ள דִּבְרֵי என்பதிலிருந்து வேறுபட்டு, இங்கு அபியா பேசிய அல்லது பதிவான சொற்களைக் குறிக்கும் சாத்தியத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: כתב என்ற வேரிலுள்ள எழுதப்பட்ட பதிவு என்னும் நேரடிப் பொருளைத் தக்கவைக்கிறது.
- source_word: בְּמִדְרַשׁ
  choice: மித்ராஷில்
  rationale: மூல எபிரெயச் சொல்லின் தனித்துவத்தைத் தக்கவைக்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது; அதன் பண்டைய சூழலுக்குரிய பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: הַנָּבִיא עִדּוֹ
  choice: இறைவாக்கினர் இத்தோவின்
  rationale: தீர்க்கதரிசியாகிய இத்தோவுக்குரிய அல்லது அவரால் இயற்றப்பட்ட படைப்பு என்பதைக் கட்டமைப்பு காட்டுகிறது; தமிழில் இயல்பான உடைமைத் தொடராக மொழிபெயர்க்கப்பட்டது.
