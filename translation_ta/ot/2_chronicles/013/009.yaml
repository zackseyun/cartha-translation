base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
translation:
  language: ta
  text: நீங்கள் யாவேயின் ஆசாரியர்களான ஆரோனின் மகன்களையும் லேவியர்களையும் துரத்திவிட்டு, தேசங்களின் மக்களைப் போல உங்களுக்கென்று ஆசாரியர்களை ஏற்படுத்திக்கொள்ளவில்லையா? ஒரு இளம் காளையையும் ஏழு செம்மறியாட்டுக் கடாக்களையும் கொண்டு ஆசாரியப் பணிக்கு நிறுவப்பட வருகிற எவனும் கடவுள்கள் அல்லாதவற்றின் ஆசாரியனாகிறான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, “தன் கையை நிரப்ப.” இது ஆசாரியப் பணியில் ஒருவரை நிறுவுதல் அல்லது பதவியேற்பிக்குதல் என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: “கடவுள்கள் அல்லாதவற்றுக்கு ஆசாரியன்” என்றும் மொழிபெயர்க்கலாம். இவ்வழிபாட்டுப் பொருட்கள் உண்மையில் கடவுள்கள் அல்ல என்பதை எபிரேய வாசகம் வலியுறுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: ஏற்படுத்திக்கொள்ளவில்லையா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் கண்டனத் தொனியுள்ள வினாவை இயல்பான தமிழ் எதிர்மறை வினாவாகக் காட்டுகிறது.
- source_word: הִדַּחְתֶּם
  choice: துரத்திவிட்டு
  rationale: Hiphil வடிவம் வலுக்கட்டாயமாக நீக்குதல் அல்லது வெளியேற்றுதல் என்ற பொருளைத் தருகிறது.
- source_word: כֹּהֲנֵי יְהוָה
  choice: யாவேயின் ஆசாரியர்கள்
  rationale: இறைப்பெயரைப் பெயராகவே வைத்து, construct உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மக்கள்
  rationale: இங்கு வழித்தோன்றல் ஆசாரியக் குலத்தைக் குறிக்கும் மொழிவழக்கை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: וְהַלְוִיִּם
  choice: லேவியர்கள்
  rationale: ஆரோனிய ஆசாரியர்களுடன் தனியே குறிப்பிடப்பட்ட லேவியர்களைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים
  choice: உங்களுக்கென்று ஆசாரியர்களை ஏற்படுத்திக்கொண்டு
  rationale: עשה இங்கு நியமித்தல் அல்லது உருவாக்குதல் என்ற செயலையும் לָכֶם என்பதன் தங்களுக்கான என்ற நுணுக்கத்தையும் தருகிறது.
- source_word: כְּעַמֵּי הָאֲרָצוֹת
  choice: மற்ற தேசங்களின் மக்களைப் போல
  rationale: சுற்றியுள்ள பிற தேச மக்களுடனான ஒப்பீட்டை இயல்பான தமிழில் தருகிறது; 'புறமதத்தார்' போன்ற கூடுதல் சமய வகைப்பாட்டைச் சேர்க்கவில்லை.
- source_word: כָּל הַבָּא
  choice: எவனும்
  rationale: தடையற்ற பொதுமைச் சுட்டைச் சுருக்கமான தமிழ் வடிவில் தருகிறது.
- source_word: לְמַלֵּא יָדוֹ
  choice: தன்னை ஆசாரியப் பணிக்கென அர்ப்பணிக்கிற
  rationale: சொல்லெழுத்தாக 'தன் கையை நிரப்புதல்' என்ற ஆசாரிய நிறுவல் மரபுத்தொடரின் செயல்பாட்டு பொருளை வாசிக்கத்தக்க தமிழில் தருகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּפַר בֶּן בָּקָר
  choice: இளங்காளை ஒன்றையும்
  rationale: பலிக்குரிய இளம் காளையைச் சுட்டும் வழக்கமான எபிரேயச் சொல்லாக்கத்தை இயல்பாகத் தருகிறது.
- source_word: וְאֵילִם שִׁבְעָה
  choice: ஏழு செம்மறியாட்டுக் கடாக்களையும்
  rationale: אֵילִם என்பதன் ஆண் செம்மறியாடுகள் என்ற குறிப்பைத் துல்லியமாக்குகிறது.
- source_word: וְהָיָה כֹהֵן
  choice: ஆசாரியனாகிவிடுகிறான்
  rationale: முன்னுள்ள செய்முறையின் விளைவாகப் பெறும் நிலையைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְלֹא אֱלֹהִים
  choice: கடவுள்கள் அல்லாதவற்றுக்கு
  rationale: வணக்கப் பொருட்கள் உண்மையில் கடவுள்கள் அல்ல என்ற எபிரேயத்தின் மறுப்பை மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது.
- issue: לְלֹא אֱלֹהִים என்பதன் கண்டனத் தன்மை
  choice: கடவுள்கள் அல்லாதவற்றுக்கு
  alternative: பொய்த் தெய்வங்களுக்கு / கடவுளல்லாதவைகளின்
  rationale: இவை வெறுமனே தவறான வகையைச் சேர்ந்த தெய்வங்கள் என்று அல்ல, உண்மையில் கடவுள்களே அல்ல என்று மூலவாக்கியம் மறுப்பதைப் பாதுகாக்கிறது. לְ என்ற முன்னிடைச்சொல் நோக்கம் அல்லது தொடர்பு ஆகிய இரண்டையும் அனுமதிப்பதால் 'க்கு' பயன்படுத்தப்பட்டுள்ளது.
- issue: לְמַלֵּא יָדוֹ என்ற ஆசாரிய நிறுவல் மரபுத்தொடர்
  choice: தன்னை ஆசாரியப் பணிக்கென அர்ப்பணிக்கிற
  alternative: தன் கையை நிரப்புகிற / தன்னை ஆசாரியனாக நிறுவிக்கொள்கிற
  rationale: மரபுத்தொடரின் சடங்குசார் பொருளை முதன்மை உரையில் தெளிவாக்கி, அதன் நேரடி வடிவத்தையும் பொருள் எல்லையையும் அடிக்குறிப்பில் தருகிறது; யார் நிறுவுகிறார் என்பதைக் குறித்து தேவையற்ற கோட்பாட்டுச் சிறப்பாக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. வரலாற்று-வழிபாட்டு சூழலுக்கேற்ற 'ஆசாரியர்' நிலைநிறுத்தப்பட்டுள்ளது. வாக்கியத்தின் கண்டன வினாவும், கடவுளல்லாதவற்றைப் பற்றிய இறையியல் கூர்மையும், ஆசாரிய நிறுவல் மரபுத்தொடரின் தன்மையும் பாதுகாக்கப்பட்டுள்ளன.
