  naturalness: '''ஆரோனின் மக்கள்'' என்பதற்குப் பதில் ''ஆரோனின் மகன்கள்'' என்பது மூலத்தின் நிலையான குல-ஆசாரியச் சொல்லாக்கத்தைத் தெளிவாகக் காக்கிறது. ''கடவுள்கள் அல்லாதவற்றுக்கு ஆசாரியன்'' தமிழில் இயல்பற்றது; உடைமை/தொடர்பு வடிவம் இயல்பானது.'
  terminology: யாவே, ஆசாரியர், லேவியர் ஆகியவை நிலையான கண்ணியமான நடையில் பொருத்தமானவை. אֵילִם என்பதற்கான 'செம்மறியாட்டுக் கடாக்கள்' துல்லியமானது.
