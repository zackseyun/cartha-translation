id: 2CH.13.7
reference: 2 Chronicles 13:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ עָלָ֗י/ו אֲנָשִׁ֤ים רֵקִים֙ בְּנֵ֣י בְלִיַּ֔עַל וַ/יִּֽתְאַמְּצ֖וּ עַל רְחַבְעָ֣ם בֶּן שְׁלֹמֹ֑ה וּ/רְחַבְעָ֗ם הָ֤יָה נַ֨עַר֙ וְ/רַךְ לֵבָ֔ב וְ/לֹ֥א הִתְחַזַּ֖ק לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
translation:
  language: ta
  text: பயனற்ற மனிதர்கள், பெலியாலின் மகன்கள்[a], அவனைச் சுற்றித் திரண்டு, சாலொமோனின் மகன் ரெகொபெயாமைவிட வலிமை மிக்கவர்களாகத் தங்களைக் காட்டினர். ரெகொபெயாம் இளமையானவனாகவும் மனவுறுதி குன்றியவனாகவும் இருந்தான்; அவர்களுக்கு எதிராகத் தன்னைத் திடப்படுத்திக்கொள்ளவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெலியாலின் மகன்கள்” என்பது “கயவர்கள்” அல்லது “கேடுகெட்டவர்கள்” என்று பொருள்படும் எபிரெயச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עָלָיו
  choice: அவனைச் சுற்றித் திரண்டு
  rationale: קבץ உடன் עַל என்பது ஒருவரைச் சுற்றித் திரள்வதையோ அவருக்கு எதிராகத் திரள்வதையோ குறிக்கலாம். இங்கு யெரொபெயாமைச் சுற்றி ஆதரவாளர்கள் திரண்டதையும் அதன் எதிர்ப்புத் தன்மையையும் சூழல் வெளிப்படுத்துகிறது.
- source_word: אֲנָשִׁים רֵקִים
  choice: பயனற்ற மனிதர்கள்
  rationale: רֵקִים என்பதன் அடிப்படைப் பொருள் ‘வெறுமையானவர்கள்’; இங்கு அது மதிப்பும் நற்பண்பும் அற்றவர்களைக் குறிக்கும் இகழ்ச்சிச் சொல். ‘பயனற்ற மனிதர்கள்’ அந்த மதிப்பீட்டைத் தெளிவாகத் தருகிறது.
- source_word: בְּנֵי בְלִיַּעַל
  choice: பெலியாலின் மகன்கள்
  rationale: சொற்றொடரின் உருவக வடிவத்தையும் ‘பெலியால்’ என்பது பெயரா அல்லது கேடின்மையைக் குறிக்கும் சொல்லா என்ற தெளிவின்மையையும் காக்கும் பொருட்டு சொற்படையான வடிவம் வைக்கப்பட்டுள்ளது; இயல்பான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּתְאַמְּצוּ עַל
  choice: எதிராக வலுப்பெற்றார்கள்
  rationale: התפעל வடிவம் எதிர்ப்பில் தங்களை வலிமைப்படுத்திக்கொண்டதையோ மேலோங்கியதையோ குறிக்கிறது. ‘எதிராக வலுப்பெற்றார்கள்’ மூலத்தின் வலிமை சார்ந்த உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: נַעַר
  choice: இளமையானவன்
  rationale: נַעַר என்பது இளைஞன் அல்லது ஒப்பீட்டளவில் முதிர்ச்சியற்றவன் என்று பொருள்படலாம். உரையின் சொல்லாட்சியைத் தாண்டி ‘அனுபவமற்றவன்’ என்று மட்டும் விளக்காமல், ‘இளமையானவன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: רַךְ לֵבָב
  choice: மனவுறுதி குன்றியவன்
  rationale: சொற்பட ‘மென்மையான இருதயம் உடையவன்’ என்றாலும், அரசியல் மோதலின் சூழலில் இரக்கம் அல்ல, உறுதியின்மையே குறிக்கப்படுகிறது.
- source_word: לֹא הִתְחַזַּק לִפְנֵיהֶם
  choice: அவர்களுக்கு எதிராகத் தன்னைத் திடப்படுத்திக்கொள்ளவில்லை
  rationale: இந்தச் சொற்றொடர் அவர்களது முன்னிலையில் தன்னை வலிமைப்படுத்தி உறுதியாக நிற்காததைக் குறிக்கிறது. தமிழ் வடிவம் செயற்பாட்டு நுணுக்கத்தையும் முன் வரும் வலிமை சார்ந்த சொல்லாட்சியையும் காக்கிறது.
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל என்பதன் பொருள்
  choice: பெலியாலின் மகன்கள்
  alternative: கயவர்கள்; கேடுகெட்டவர்கள்
  rationale: ‘பெலியால்’ என்பதை தனிப்பட்ட பெயராகவோ கேடின்மை/பயனின்மையைக் குறிக்கும் சொல்லாகவோ வாசிக்க முடியும். மூலத்தில் உள்ள இந்தத் தெளிவின்மையை முதன்மை உரை காக்கிறது; வழக்குப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியும், ஆனால் வரலாற்று உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பெலியாலின் மகன்கள்’ என்ற மூல உருவகம் விளக்கமின்றி நீக்கப்படாமல் அடிக்குறிப்புடன் வைக்கப்பட்டுள்ளது.
