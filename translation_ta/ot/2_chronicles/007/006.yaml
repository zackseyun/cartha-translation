base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
translation:
  language: ta
  text: 'ஆசாரியர்கள் தங்கள் பணிநிலைகளில் நின்றுகொண்டிருந்தார்கள்; லேவியர்கள், தாவீது அரசன் யாவேக்கு நன்றி செலுத்துவதற்காகச் செய்த யாவேக்குரிய பாடலின் இசைக்கருவிகளுடன் இருந்தார்கள்[a]—“ஏனெனில், அவருடைய மாறாத அன்பு என்றென்றும் நிலைத்திருக்கிறது”[b] என்று தாவீது அவர்கள்மூலம் புகழ்ந்தபோது[c]. ஆசாரியர்கள் அவர்களுக்கு எதிரே எக்காளங்களை ஊதிக்கொண்டிருந்தார்கள்; இஸ்ரவேலர் அனைவரும் நின்றுகொண்டிருந்தார்கள்.


    [a] அல்லது, “யாவேக்குரிய இசைக்கருவிகளுடன்.” எபிரெயச் சொற்றொடர், யாவேக்காக அர்ப்பணிக்கப்பட்ட இசைக்கருவிகளையோ யாவேக்குரிய பாடலுக்குப் பயன்படுத்தப்பட்ட இசைக்கருவிகளையோ குறிக்கலாம்.


    [b] எபிரெய மொழியில், “ஏனெனில், அவருடைய மாறாத அன்பு என்றென்றும் உள்ளது.” தமிழில் இயல்பாக இருக்க, “நிலைத்திருக்கிறது” என்று மொழிபெயர்க்கப்பட்டுள்ளது.


    [c] அல்லது, “தாவீதின் புகழ்ச்சியை அவர்கள் வழங்கியபோது.” எபிரெய வாக்கியம் சுருக்கமாக உள்ளது; லேவியர்கள் தாவீதின் புகழ்ச்சியை அவரது சார்பில் வழங்கினார்கள் என்பது இதன் பொருளாக இருக்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்குரிய இசைக்கருவிகளுடன்.” எபிரெயச் சொற்றொடர், யாவேக்காக அர்ப்பணிக்கப்பட்ட இசைக்கருவிகளையோ யாவேக்குரிய பாடலுக்குப் பயன்படுத்தப்பட்ட இசைக்கருவிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில், “ஏனெனில், அவருடைய மாறாத அன்பு என்றென்றும் உள்ளது.” தமிழில் இயல்பாக இருக்க, “நிலைத்திருக்கிறது” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தாவீதின் புகழ்ச்சியை அவர்கள் வழங்கியபோது.” எபிரெய வாக்கியம் சுருக்கமாக உள்ளது; லேவியர்கள் தாவீதின் புகழ்ச்சியை அவரது சார்பில் வழங்கினார்கள் என்பது இதன் பொருளாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  choice: தங்களுக்கு நியமிக்கப்பட்ட இடங்களில்
  rationale: ஆலயப் பணியில் ஒழுங்காக ஒதுக்கப்பட்ட நிலைகளையோ பணியிடங்களையோ குறிக்கிறது; வெறும் கடமைகள் என்ற கருத்தைவிட இடம் மற்றும் பணி இரண்டையும் இயல்பாக உணர்த்துகிறது.
- source_word: בִּכְלֵי שִׁיר יְהוָה
  choice: யாவேக்குரிய பாடலுக்கான இசைக்கருவிகளுடன்
  rationale: כְּלֵי என்பது கருவிகளையும் שִׁיר என்பது பாடல் அல்லது இசையையும் குறிக்கிறது. பாடலை யாவேயுடன் இணைக்கும் எபிரெயச் சொற்றொடரின் உறவைத் தக்கவைத்துள்ளது.
- source_word: לְהוֹדוֹת לַיהוָה
  choice: யாவேக்கு ... நன்றி செலுத்துவதற்காக
  rationale: ידה என்ற வினை புகழ்தல் அல்லது நன்றி செலுத்துதல் எனப் பொருள்படலாம்; அதைத் தொடரும் நன்றிப் பல்லவி காரணமாக இங்கு ‘நன்றி செலுத்துதல்’ பொருத்தமானது.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: ஏனெனில், அவருடைய மாறாத அன்பு என்றென்றும் நிலைத்திருக்கிறது
  rationale: חֶסֶד என்பதில் அன்பு, இரக்கம், உறுதியான பற்றுறுதி ஆகிய கருத்துகள் அடங்குகின்றன. ‘மாறாத அன்பு’ அதன் நீடித்த உறவுப்பற்றை இயல்பான தமிழில் எடுத்துரைக்கிறது; எபிரெயில் மறைமுகமாக உள்ள வினை தமிழில் ‘நிலைத்திருக்கிறது’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בְּהַלֵּל דָּוִיד בְּיָדָם
  choice: தாவீது அவர்கள்மூலம் புகழ்ந்தபோது
  rationale: சுருக்கமான எபிரெய அமைப்பில் தாவீது எழுவாயாகவும் லேவியர்கள் அவரது புகழ்ச்சியை வழங்கும் கருவிகளாகவும் காணப்படுகின்றனர். ‘அவர்கள்மூலம்’ என்பது அந்த முகமை உறவைத் தக்கவைக்கிறது.
- source_word: מחצצרים
  choice: எக்காளங்களை ஊதிக்கொண்டிருந்தார்கள்
  rationale: חצצר என்பது குறிப்பாக எக்காளம் முழங்குவதைக் குறிக்கிறது; தொடர்ச்சியான நிகழ்வைக் காட்டும் பங்கேற்பு வடிவத்தை ‘ஊதிக்கொண்டிருந்தார்கள்’ வெளிப்படுத்துகிறது.
- source_word: נֶגְדָּם
  choice: அவர்களுக்கு எதிரே
  rationale: முன்பாக அல்லது எதிர்ப்புறமாக இருந்த இடவுறவை, கூடுதல் சடங்கு விளக்கம் சேர்க்காமல் தக்கவைக்கிறது.
- source_word: עֹמְדִים
  choice: நின்றுகொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்பு வடிவத்தின் தொடர்ச்சியான காட்சியமைப்பை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- issue: חֶסֶד என்பதன் பலபொருள் தன்மை
  choice: மாறாத அன்பு
  alternative: இரக்கம் / உடன்படிக்கைப் பற்றுறுதி
  rationale: இந்தச் சொல் அன்பு, இரக்கம், நிலையான பற்றுறுதி ஆகியவற்றை ஒருங்கே சுமக்கிறது. குறிப்பிட்ட ஓர் இறையியல் அமைப்புக்குள் அதைச் சுருக்காமல், நீடித்த அன்பின் மையக் கருத்தைத் தேர்ந்தெடுத்துள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளை வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பங்கேற்புகளின் தொடர்ச்சியான காட்சி தமிழில் ‘நின்றுகொண்டிருந்தார்கள்’, ‘ஊதிக்கொண்டிருந்தார்கள்’ என வெளிப்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டாலும் அதன் நிகழ்வுவரிசையும் தொடர்புகளும் பாதுகாக்கப்பட்டுள்ளன.
