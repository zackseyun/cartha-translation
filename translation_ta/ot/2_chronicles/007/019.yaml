id: 2CH.7.19
reference: 2 Chronicles 7:19
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אִם תְּשׁוּב֣וּ/ן אַתֶּ֔ם וַ/עֲזַבְתֶּם֙ חֻקּוֹתַ֣/י וּ/מִצְוֺתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: ta
  text: ஆனால் நீங்கள் விலகி, நான் உங்கள் முன் வைத்த என் நியமங்களையும் என் கட்டளைகளையும் கைவிட்டு, வேறு தெய்வங்களைச் சேவித்து, அவற்றுக்குத் தலைவணங்கினால்,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשׁוּבוּן
  choice: என்னைவிட்டு விலகி
  rationale: இங்கு வினைச்சொல் சூழலில் கடவுளிடமிருந்து திரும்பிச் செல்வதைக் குறிக்கிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்தப்பட்டது.
- source_word: וַעֲזַבְתֶּם
  choice: கைவிட்டு
  rationale: நியமங்களையும் கட்டளைகளையும் விட்டொழித்தல் அல்லது புறக்கணித்தல் என்ற வலுவான பொருளைத் தருகிறது.
- source_word: חֻקּוֹתַי וּמִצְוֺתַי
  choice: என் நியமங்களையும் கட்டளைகளையும்
  rationale: இரு எபிரெயச் சட்டச் சொற்களின் வேறுபாட்டை இயன்றவரை காக்கும் வழக்கமான, புரிந்துகொள்ளக்கூடிய இணைச்சொற்கள்.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: நான் உங்கள் முன் வைத்த
  rationale: மூலத்தின் உருவகத்தையும் அதிகாரபூர்வமாக முன்வைத்தல் என்ற கருத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וַעֲבַדְתֶּם
  choice: சேவித்து
  rationale: வேறு தெய்வங்களுக்குச் செய்யப்படும் மதச்சார்ந்த ஊழியம்/வழிபாட்டைக் குறிக்கும் மூலச் சொல்லின் பரப்பை காக்கிறது.
- source_word: וְהִשְׁתַּחֲוִיתֶם
  choice: பணிந்துகொண்டால்
  rationale: உடலைத் தாழ்த்திப் பணிதல் மற்றும் வழிபடுதல் ஆகிய இரு நிழற்பொருள்களையும் தாங்கக்கூடிய இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: தெய்வங்களின் குறிப்பிடல்
  choice: வேறு தெய்வங்கள்
  alternative: அந்நிய தெய்வங்கள்
  rationale: אֱלֹהִים אֲחֵרִים என்பதன் நேரடியான பொருளைத் தக்கவைத்து, அவற்றின் இருப்பு அல்லது இல்லாமை குறித்த விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
- issue: நிபந்தனை வாக்கியத்தின் தொடர்ச்சி
  choice: வசனத்தை ‘கொண்டால்’ என்று முடித்தல்
  alternative: தனி முழு வாக்கியமாக மாற்றுதல்
  rationale: எபிரெய மூலத்தில் இது அடுத்த வசனத்தில் வரும் விளைவுடன் இணையும் நிபந்தனைத் துணைவாக்கியம்; அந்த இலக்கணத் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாய் இருந்தும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை. மூலத்தின் பன்மை ‘நீங்கள்’ காக்கப்பட்டுள்ளது.
