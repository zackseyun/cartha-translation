base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
translation:
  language: ta
  text: என் பெயரால் அழைக்கப்படும் என் மக்கள்[a] தங்களைத் தாழ்த்திக்கொண்டு, ஜெபித்து, என் முகத்தைத் தேடி, தங்கள் தீய வழிகளை விட்டு திரும்பினால், அப்போது நான் பரலோகத்திலிருந்து கேட்டு, அவர்களுடைய பாவத்தை மன்னித்து, அவர்களுடைய நாட்டைக் குணமாக்குவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “என் பெயர் அவர்கள்மேல் அழைக்கப்படுகிறது.” இந்த எபிரெய மரபுத்தொடர் அவர்கள் கடவுளுக்குரியவர்கள் அல்லது அவருடைய பெயரைத் தாங்குகிறவர்கள் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  choice: தங்களைத் தாழ்த்தி
  rationale: כנע என்பதன் நிஃபால் வடிவம் இங்கு மக்களின் மனமுவந்த பதிலைச் சுட்டுகிறது. ‘தங்களைத் தாழ்த்தி’ என்பது செயப்பாட்டு நிழலைத் தவிர்த்து, தன்னடக்கத்தையும் பணிவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַמִּי
  choice: என் மக்கள்
  rationale: உடன்படிக்கை சார்ந்த கூட்டுப்பெயரை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: என் பெயர் சூட்டப்பட்ட
  rationale: சொல்லுக்குச் சொல் ‘என் பெயர் அவர்கள்மேல் அழைக்கப்பட்டிருக்கிறது’ என்ற எபிரெய மரபுத்தொடர், அவர்கள் கடவுளுக்குரியவர்கள் என்றும் அவருடைய பெயரைத் தாங்குகிறவர்கள் என்றும் குறிக்கிறது. ‘பெயர் சூட்டப்பட்ட’ என்பது அந்த அடையாளத்தையும் சொந்தத்தையும் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיִתְפַּלְלוּ
  choice: விண்ணப்பம் செய்து
  rationale: פלל என்பதன் ஹித்பயேல் வடிவம் ‘மன்றாடுதல்/விண்ணப்பித்தல்’ என்ற பொருளைத் தருகிறது. இவ்வசனத்தின் அரசர் ஆலய அர்ப்பணிப்பு விண்ணப்பச் சூழலில் ‘விண்ணப்பம் செய்து’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וִיבַקְשׁוּ פָנַי
  choice: என் முகத்தைத் தேடி
  rationale: ‘என் முகம்’ என்ற மூல உருவகத்தைத் தக்கவைத்து, கடவுளுடைய சமுகத்தையும் தயவையும் நாடும் பொருளை விளக்கவுரை இன்றி பாதுகாக்கிறது.
- source_word: וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים
  choice: தங்கள் தீய வழிகளைவிட்டுத் திரும்பினால்
  rationale: שׁוב குறிக்கும் ஒழுக்கத் திருப்பத்தையும், ‘வழிகள்’ குறிக்கும் தொடர் நடத்தையையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַאֲנִי אֶשְׁמַע מִן הַשָּׁמַיִם
  choice: அப்போது நான் பரலோகத்திலிருந்து கேட்டு
  rationale: எபிரெய இணைப்புச் சொல் இங்கு நிபந்தனையின் விளைவைத் தொடங்குகிறது; ‘அப்போது’ அதைத் தமிழில் தெளிவாக்குகிறது. מן என்பதற்கு ‘பரலோகத்திலிருந்து’ என்று தரப்பட்டுள்ளது.
- source_word: וְאֶסְלַח לְחַטָּאתָם
  choice: அவர்களுடைய பாவத்தை மன்னித்து
  rationale: மூலத்தின் ஒருமை வடிவமான חטאתם-ஐ கூட்டுப்பொருளுடன் ‘பாவத்தை’ எனப் பாதுகாக்கிறது.
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  choice: அவர்களுடைய நாட்டைக் குணமாக்குவேன்
  rationale: רפא என்பதன் ‘குணமாக்குதல்’ உருவகத்தைத் தக்கவைத்து, பாதிக்கப்பட்ட நாட்டை கடவுள் மீட்டமைக்கும் செயலை அளவுக்கு மீறி விளக்காமல் தெரிவிக்கிறது.
theological_decisions:
- issue: தெய்வீகப் பதிலின் நிபந்தனை அமைப்பு
  choice: மக்கள் செய்ய வேண்டியவற்றை ‘திரும்பினால்’ என்பதில் முடித்து, விளைவை ‘அப்போது’ என்று தொடங்குதல்
  alternative: எல்லா வாக்கிய உறுப்புகளையும் ‘மற்றும்’ என்று மட்டும் இணைத்தல்
  rationale: எபிரெயத்தில் தொடர்ச்சியான வாவ் இணைப்புகள் இருந்தாலும், உரையாடல் அமைப்பு நிபந்தனை–விளைவு உறவைத் தெளிவாகக் காட்டுகிறது. தமிழ் இலக்கணத்திற்கேற்ப நிபந்தனை இறுதி வினையில் குறிக்கப்பட்டுள்ளது.
- issue: தெய்வீகப் பெயரின் உடன்படிக்கை மரபுத்தொடர்
  choice: ‘என் பெயர் சூட்டப்பட்ட’ என்று மொழிபெயர்த்து, சொந்தம் மற்றும் அடையாளம் ஆகிய இரண்டையும் உணர்த்துதல்
  alternative: ‘என் பெயர் அவர்கள்மேல் அழைக்கப்பட்டிருக்கிற’ என்ற சொல்லுக்குச் சொல் வடிவம்
  rationale: இது வெறுமனே பெயரை உச்சரிப்பதை அல்ல, கடவுளுக்குரியவர்களாக அடையாளப்படுத்தப்படுவதைச் சுட்டுகிறது. இயல்பான வாசிப்பை முதன்மை உரையில் தந்து, உண்மையான எபிரெய வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: ‘நாட்டைக் குணமாக்குதல்’ என்ற உருவகத்தின் பரப்பு
  choice: உருவகத்தை விளக்கவுரை இன்றி அப்படியே வைத்தல்
  alternative: ‘நாட்டைச் செழிக்கச் செய்வேன்’ அல்லது ‘மீட்டமைப்பேன்’ என்று குறிப்பாக்குதல்
  rationale: சூழல் நிலத்தின் பேரிடர் நீக்கத்தை உள்ளடக்கினாலும், רפא என்ற சொல் தரும் விரிவான மீட்பு உருவகத்தை ஒரு குறிப்பிட்ட விளைவாக மட்டும் சுருக்கக்கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘என் முகத்தைத் தேடி’ மற்றும் ‘நாட்டைக் குணமாக்குவேன்’ ஆகிய மூல உருவகங்கள் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன; நிபந்தனை அமைப்பு தமிழ் வாக்கிய வரிசைக்கேற்ப இயல்பாக்கப்பட்டுள்ளது.
