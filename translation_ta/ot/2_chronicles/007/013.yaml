  text: הֵ֣ן אֶֽעֱצֹ֤ר הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הֵן אֲצַוֶּ֥ה עַל חָגָ֖ב לֶ/אֱכ֣וֹל הָ/אָ֑רֶץ וְ/אִם אֲשַׁלַּ֥ח דֶּ֖בֶר בְּ/עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
translation:
  language: ta
  text: நான் மழை பெய்யாதபடி வானத்தை அடைக்கும்போதோ[a], நாட்டைத் தின்றழிக்க வெட்டுக்கிளிகளுக்குக் கட்டளையிடும்போதோ, என் மக்களிடையே கொள்ளைநோயை அனுப்பும்போதோ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் மழை பெய்யாதபடி வானத்தை அடைத்தால்.” எபிரெயத் தொடக்கத் துகளை இன்னும் சொல்லுக்குச் சொல்லாக “ஒருவேளை” அல்லது “இதோ, ... என்றால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “கொள்ளைநோய்” என்பதற்குப் பதிலாக “பெருந்தொற்று” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: செய்யும்போதோ
  rationale: தொடக்கத் துகள் இங்கு அடுத்த வசனத்துடன் இணையும் நிபந்தனைச் சூழலை அறிமுகப்படுத்துகிறது. இயல்பான தமிழில் ‘போது’ வடிவம் இதைத் தருகிறது; ‘ஒருவேளை/இதோ, என்றால்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  choice: வானத்தை அடைத்து
  rationale: மழையைத் தடுத்து நிறுத்துவதைக் குறிக்கும் எபிரெய உருவகத்தை நேரடியாகவும் புரியத்தக்கவாறும் காக்கிறது.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: மழை இல்லாமல் செய்ய
  rationale: வானத்தை அடைப்பதன் விளைவைத் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲצַוֶּה עַל חָגָב
  choice: வெட்டுக்கிளிகளுக்குக் கட்டளையிடும்போதோ
  rationale: எபிரெய ஒருமை கூட்டுப்பொருளில் வருவதால், தமிழில் இயல்பான கூட்டுப் பன்மையான ‘வெட்டுக்கிளிகள்’ பயன்படுத்தப்பட்டுள்ளது; இறைச் செயலாண்மை காக்கப்படுகிறது.
- source_word: לֶאֱכֹל הָאָרֶץ
  choice: நாட்டைத் தின்றழிக்க
  rationale: இங்கு אָרֶץ என்பது உடன்படிக்கைச் சூழலிலுள்ள நாட்டைக் குறிக்கிறது. வெட்டுக்கிளிகளின் அழிவூட்டும் உண்ணுதலை ‘தின்றழிக்க’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דֶּבֶר
  choice: கொள்ளைநோய்
  rationale: பரவலாக உயிரிழப்பை உண்டாக்கும் தொற்றுநோயைக் குறிக்கும் எபிரெயச் சொல்லின் கனத்தையும் வேதாகம நடையையும் காக்கிறது.
- source_word: בְּעַמִּי
  choice: என் மக்களிடையே
  rationale: நோய் மக்களின் நடுவில் பரவுவதை இயல்பாகக் குறிக்கிறது; வெளிப்புறத் தாக்குதல் என்ற தவறான எண்ணத்தைத் தவிர்க்கிறது.
theological_decisions:
- issue: இறைத் தீர்ப்புச் செயல்களை நிபந்தனைச் சூழல்களாக மொழிபெயர்த்தல்
  choice: ‘...செய்யும்போதோ ... கட்டளையிடும்போதோ ... அனுப்பும்போதோ’ என்று நேரடியான இறைச் செயலாண்மையுடன் வழங்குதல்
  alternative: ‘நான் வானத்தை அடைத்தால் ...’ அல்லது ‘இதோ, நான் ... அடைத்தால் ...’
  rationale: הֵן, וְהֵן, וְאִם ஆகியவை சாத்தியமான இறைத் தண்டனைச் சூழல்களின் தொடரை அமைக்கின்றன. தமிழ் ‘போதோ’ தொடர் அடுத்த வசனத்தின் பதில் நிபந்தனையுடன் இயல்பாக இணைகிறது; மூலத்தின் மாற்று நிபந்தனை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடை பயன்படுத்தப்பட்டுள்ளது. வசனம் 14-இல் தொடரும் இலக்கண அமைப்பைக் கருத்தில் கொண்டு இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது. ‘வானத்தை அடைத்து’ என்ற மூல உருவகமும், தீர்ப்பில் தேவனுடைய நேரடி செயலாண்மையும் பாதுகாக்கப்பட்டுள்ளன.
