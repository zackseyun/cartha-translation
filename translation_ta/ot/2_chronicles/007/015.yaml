base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/015.yaml
  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
translation:
  language: ta
  text: இப்போது என் கண்கள் திறந்திருக்கும்; என் செவிகள் இந்த இடத்தின் ஜெபத்தைக் கவனித்துக் கேட்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்த இடத்தில் ஏறெடுக்கப்படும் ஜெபத்தைக்’ அல்லது ‘இந்த இடத்திலிருந்து எழும் ஜெபத்தைக்’ என்றும் பொருள் கொள்ளலாம். எபிரெயத்தில் இன்னும் சொற்சார்ந்து, ‘இந்த இடத்தின் ஜெபத்தைக்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: முந்தைய அர்ப்பணிப்பு நிகழ்வைத் தொடர்ந்து வரும் தற்போதைய விளைவைச் சுட்டும் காலவினையடை. ‘இப்போதுமுதல்’ என்பதும் சாத்தியம்; ஆனால் அது சற்றுக் கூடுதல் விளக்கத்தைச் சேர்க்கும்.
- source_word: עֵינַי יִהְיוּ פְתֻחוֹת
  choice: என் கண்கள் திறந்திருக்கும்
  rationale: தெய்வீகக் கவனத்தை உடல் உறுப்புகளின் உருவகத்தால் கூறும் எபிரெய வெளிப்பாட்டை மறுபொருளாக்காமல் காக்கிறது; நிலைத்த எதிர்கால நிலையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְאָזְנַי קַשֻּׁבוֹת
  choice: என் செவிகள் ... கவனித்துக் கேட்கும்
  rationale: קַשֻּׁבוֹת என்பது செவிசாய்த்து, கவனத்துடன் கேட்பதைக் குறிக்கிறது. ‘கவனமாயிருக்கும்’ என்பதைவிட ‘கவனித்துக் கேட்கும்’ என்பது நவீன தமிழில் இயல்பாகவும் செவிகளோடு பொருந்துமாறும் உள்ளது.
- source_word: לִתְפִלַּת
  choice: ஜெபத்தைக்
  rationale: לְ முன்னொட்டு கவனம் எதை நோக்கியுள்ளது என்பதைக் காட்டுகிறது; ஒருமை வடிவம் காக்கப்பட்டுள்ளது.
- source_word: הַמָּקוֹם הַזֶּה
  choice: இந்த இடத்தின்
  rationale: எபிரெயக் கட்டமைப்பு சொற்சார்ந்து ‘இந்த இடத்தின் ஜெபம்’ என உள்ளது. இடத்தில் செய்யப்படும் அல்லது இடத்திலிருந்து எழும் ஜெபம் என்ற சூழல்சார் பொருளைத் தீர்மானித்து விடாமல் மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காக்கிறது.
theological_decisions:
- issue: தேவன் காண்பதையும் கேட்பதையும் மனித உடல் உறுப்புகளால் கூறும் உருவகம்
  choice: ‘என் கண்கள்’, ‘என் செவிகள்’ என்ற உருவகத்தை அப்படியே காத்தல்
  alternative: ‘நான் பார்த்துக் கேட்பேன்’ என்று கருத்துரைத்தல்
  rationale: மூல எபிரெயம் தெய்வீகக் கவனத்தை உடல் சார்ந்த உருவகத்தின் வழியாக வெளிப்படுத்துகிறது. அதைத் தக்கவைப்பது உறவு மற்றும் உடன்படிக்கை சார்ந்த வலிமையை மங்கச் செய்யாது.
- issue: ‘இந்த இடத்தின் ஜெபம்’ என்பதன் தொடர்பு
  choice: உடைமைத் தொடர்பைக் காட்டும் ‘இந்த இடத்தின் ஜெபம்’
  alternative: ‘இந்த இடத்தில் ஏறெடுக்கப்படும் ஜெபம்’ அல்லது ‘இந்த இடத்திலிருந்து எழும் ஜெபம்’
  rationale: மூலத்தில் இடத்துக்குள் அல்லது இடத்திலிருந்து என்று வெளிப்படையாகக் குறிக்கும் முன்னிடைச்சொல் இல்லை. ஆகவே உண்மையான பொருள் நுணுக்கத்தை முதன்மை உரையில் காத்து, இயல்பான விளக்கங்களை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வேதாகமத்திற்குரிய கண்ணியமும் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘காது’ என்பதற்குப் பதில் இணைநடை மற்றும் கண்ணியத்திற்காக ‘செவி’ பயன்படுத்தப்பட்டது; மூலத்தின் மனிதஉருவக மொழியும் இடத் தொடர்பிலுள்ள தெளிவின்மையும் காக்கப்பட்டன.
