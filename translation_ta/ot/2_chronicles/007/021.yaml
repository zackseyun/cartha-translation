id: 2CH.7.21
reference: 2 Chronicles 7:21
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הָיָ֣ה עֶלְי֔וֹן לְ/כָל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֑ם וְ/אָמַ֗ר בַּ/מֶּ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
translation:
  language: ta
  text: உயர்ந்த நிலையில் இருந்த இந்த ஆலயத்தை[b]க் கடந்து செல்கிற ஒவ்வொருவரும் திகைத்துப்போய்[a], “யாவே இந்த நிலத்துக்கும் இந்த ஆலயத்துக்கும் ஏன் இப்படிச் செய்தார்?” என்று கேட்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்த ஆலயம் பாழாகி, அதைக் கடந்து செல்கிற ஒவ்வொருவருக்கும் திகிலூட்டும் ஒன்றாகும்.” எபிரெயச் சொல் பாழ்நிலையையும் அதைக் காண்போரின் திகைப்பையும் குறிக்கலாம்; வாக்கியத் தொடர்பையும் இவ்வாறு புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: எபிரெயத்தில், “வீடு”; இங்கே ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: இந்த ஆலயம்
  rationale: בַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு/இல்லம்’; இச்சூழலில் அது எருசலேம் ஆலயத்தைக் குறிக்கிறது. சாதாரண நவீனத் தமிழில் தவறான புரிதலைத் தவிர்க்க ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது; நேர்ப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  choice: உயர்ந்த நிலையில் இருந்த
  rationale: עֶלְיוֹן என்பது உயரம், மேன்மை, சிறப்பு ஆகிய நிழற்பொருள்களைக் கொண்டது. ஆலயத்தின் முந்தைய உயரிய நிலையையும் பெருமையையும் குறுகாமல் தெரிவிக்கிறது.
- source_word: לְכָל עֹבֵר עָלָיו יִשֹּׁם
  choice: அதைக் கடந்து செல்கிற ஒவ்வொருவரும் திகைத்துப்போய்
  rationale: வாக்கிய அமைப்பின்படி கடந்து செல்பவரே יִשֹּׁם வினையின் பகிர்வுநிலை ஒருமை எழுவாயாக இருப்பது இயல்பான வாசிப்பு. שמם இங்கு பேரழிவைக் கண்டு திகைத்தல் அல்லது அதிர்ச்சியடைதல் என்பதைக் குறிக்கிறது; ஆலயமே பாழாகும்/திகிலுக்குரியதாகும் என்ற மாற்று தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְאָמַר
  choice: என்று கேட்பார்கள்
  rationale: எபிரெயத்தில் வினை ஒருமையில் இருந்தாலும் ‘கடந்து செல்கிற ஒவ்வொருவரும்’ என்ற பகிர்வுநிலை எழுவாயுடன் வருகிறது. தமிழில் பன்மை வினை இயல்பானது; தொடர்ந்து வரும் நேரடிக் கேள்வியால் ‘சொல்வார்கள்’ என்பதற்குப் பதில் ‘கேட்பார்கள்’ தெளிவாக உள்ளது.
- source_word: בַּמֶּה
  choice: ஏன்
  rationale: நேரடியாக ‘எதனால்/எதற்காக’ என்றாலும், காரணத்தை விசாரிக்கும் இக்கேள்வியில் ‘ஏன்’ இயல்பான நவீனத் தமிழ்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல் எபிரெயத் திருமறைப் பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כָּכָה
  choice: இப்படிச்
  rationale: ‘இவ்வாறு’ என்ற பொருளை உரையாடலுக்குள் இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: இந்த நிலத்துக்கும் இந்த ஆலயத்துக்கும்
  rationale: אֶרֶץ என்பதன் ‘நிலம்’ என்ற அடிப்படைப் பொருளையும், בַּיִת இச்சூழலில் ஆலயத்தைக் குறிக்கும் பொருளையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால் அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: יִשֹּׁם என்பதன் எழுவாயும் பொருளும்
  choice: கடந்து செல்கிற ஒவ்வொருவரும் திகைத்துப்போவார்கள்
  alternative: இந்த ஆலயம் பாழாகும் / அனைவருக்கும் திகிலூட்டும் ஒன்றாகும்
  rationale: எபிரெய வாக்கியத் தொடரில் ‘கடந்து செல்கிற ஒவ்வொருவரும்’ வினையின் பகிர்வுநிலை எழுவாயாக வாசிக்க முடிகிறது; שמם பேரழிவைக் கண்டு ஏற்படும் திகைப்பையும் பாழ்நிலையையும் இணைக்கக்கூடியதால் மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- issue: בַּיִת என்பதன் சூழல்சார் குறிப்பு
  choice: ஆலயம்
  alternative: வீடு / இல்லம்
  rationale: இது யாவேக்கென அர்ப்பணிக்கப்பட்ட ஆலயத்தைச் சுட்டுகிறது. ‘ஆலயம்’ வாசகருக்கு உடனடி சூழல்தெளிவை அளிக்கிறது; நேர்ப்பொருள் மறைக்கப்படாமல் அடிக்குறிப்பில் உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உயர்ந்த நிலையில் இருந்த’ என்பது ஆலயத்தின் முந்தைய மேன்மையைத் தருகிறது; ‘திகைத்துப்போய்’ என்பது அழிவைக் காண்போரின் அதிர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது. நேரடிக் கேள்வி தமிழின் இயல்பான சொல் வரிசையில் அமைக்கப்பட்டுள்ளது.
