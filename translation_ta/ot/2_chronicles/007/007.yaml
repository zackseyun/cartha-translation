  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
translation:
  language: ta
  text: பின்பு சாலொமோன், யாவேயின் ஆலயத்துக்கு முன்னிருந்த முற்றத்தின் நடுப்பகுதியைப்[a] புனிதப் பயன்பாட்டுக்காக ஒதுக்கிவைத்தார். ஏனெனில் அங்கே அவர் தகனபலிகளையும் சமாதானப் பலிகளின்[b] கொழுப்புப் பகுதிகளையும் செலுத்தினார்.[c] சாலொமோன் செய்திருந்த வெண்கலப் பலிபீடத்தால் தகனபலியையும் தானியபலியையும் கொழுப்புப் பகுதிகளையும் கொள்ள முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘முற்றத்தின் உள்பகுதியை.’
    reason: תּוֹךְ என்பது ‘நடுப்பகுதி’ என்றும் ‘உள்பகுதி’ என்றும் புரிந்துகொள்ளப்படலாம்.
  - marker: b
    text: அல்லது, ‘ஐக்கியப் பலிகளின்.’
    reason: שְׁלָמִים என்ற பலிவகைப் பெயர் சமாதானத்தையும் பகிர்ந்துறவையும் சுட்டலாம்.
  - marker: c
    text: எபிரெயத்தில், ‘அங்கே அவர் செய்தார்’; பலியிடும் வழக்கில் இதன் பொருள் ‘செலுத்தினார்.’
    reason: עשה என்பதன் சொற்பொருளுக்கும் இங்குள்ள பலிசார் மரபுப்பொருளுக்கும் இடையிலான வேறுபாட்டை விளக்குகிறது.
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  choice: புனிதப் பயன்பாட்டுக்காக ஒதுக்கிவைத்தார்
  rationale: קדשׁ என்பதன் ஹிஃபில் வடிவம் இங்கு ஓர் இடத்தை வழிபாட்டுக்குரிய புனிதப் பயன்பாட்டுக்காகப் பிரித்துவைப்பதைக் குறிக்கிறது. இச்சொற்றொடர் பொருளை இயல்பான நவீனத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: תּוֹךְ הֶחָצֵר
  choice: முற்றத்தின் நடுப்பகுதி
  rationale: תּוֹךְ பொதுவாக ‘நடு, மத்தி’ என்று பொருள்படும். பலிபீடத்தில் இடம் போதாததால் முற்றத்தின் மையப்பகுதி கூடுதல் பலியிடமாகப் பயன்படுத்தப்பட்ட சூழலுக்கு இது பொருந்துகிறது.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: யாவேயின் ஆலயத்துக்கு முன்னிருந்த
  rationale: לִפְנֵי இங்கு இடத்தைக் குறிக்கிறது; בֵית என்பது இச்சூழலில் ஆலயக் கட்டடத்தைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עָשָׂה שָׁם
  choice: அங்கே அவர் ... செலுத்தினார்
  rationale: עשה என்பதன் சொற்பொருள் ‘செய்தார்’ என்றாலும், பலியிடும் சூழலில் அது பலிகளைச் செலுத்துவதைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: הָעֹלוֹת / הָעֹלָה
  choice: தகனபலிகள் / தகனபலி
  rationale: עלה என்பது பலிசார் பயன்பாட்டில் முழுவதும் எரித்துச் செலுத்தப்படும் தகனபலியைக் குறிக்கும் நிலையான சொல். முதல் வடிவத்தின் பன்மையும் இரண்டாவது வடிவத்தின் வகைப்பாட்டுச் சார்ந்த ஒருமையும் தமிழில் பிரதிபலிக்கப்படுகின்றன.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: சமாதானப் பலிகளின் கொழுப்புப் பகுதிகள்
  rationale: חלב இங்கு உருவகமாக ‘சிறந்த பகுதி’ என்பதல்ல; பலியாக எரிக்க ஒதுக்கப்பட்ட குறிப்பிட்ட கொழுப்புப் பகுதிகளைக் குறிக்கிறது. שְׁלָמִים என்பதற்கு மரபான பலிசார் பெயராக ‘சமாதானப் பலிகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: வெண்கலப் பலிபீடம்
  rationale: נחשת என்பது ஆலயப் பொருட்களின் சூழலில் வெண்கலத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: לֹא יָכוֹל לְהָכִיל
  choice: கொள்ள முடியவில்லை
  rationale: הכיל என்பதன் ‘கொள்ளுதல், உள்ளடக்குதல்’ என்ற பொருளையும் பலிபீடத்தின் போதாத கொள்ளளவையும் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: הַמִּנְחָה
  choice: தானியபலி
  rationale: מִנְחָה பொதுவாகக் காணிக்கை அல்லது பரிசு எனப் பொருள்படலாம்; ஆனால் பலிசார் சூழலில் இது தானியபலிக்கான தொழில்நுட்பச் சொல்.
- source_word: הַחֲלָבִים
  choice: கொழுப்புப் பகுதிகள்
  rationale: பன்மை வடிவம் பலியாக எரிக்கப்பட்ட கொழுப்புத் துண்டுகளைக் குறிக்கிறது; ‘கொழுப்புகள்’ என்பதைவிட இத்தேர்வு தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயரான YHWH நேரடியாக உள்ளது. பட்டப்பெயரைப் பதிலிடாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது அந்தப் பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: שְׁלָמִים என்ற பலிவகையின் பெயர்
  choice: சமாதானப் பலிகள்
  alternative: ஐக்கியப் பலிகள்
  rationale: இச்சொல் சமாதானம், முழுமை, பகிர்ந்துண்ணும் ஐக்கியம் ஆகியவற்றுடன் தொடர்புடைய பலிவகையைக் குறிக்கிறது. தமிழில் பரவலாக அறியப்பட்ட ‘சமாதானப் பலிகள்’ முதன்மை உரையில் வைக்கப்பட்டு, பொருளின் மற்றொரு கூறு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகமச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘பலிபீடம்,’ ‘தகனபலி,’ ‘தானியபலி’ போன்ற நிலையான பலிசார் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; அரிதான அல்லது பழமையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன.
