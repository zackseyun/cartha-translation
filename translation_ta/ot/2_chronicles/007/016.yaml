  text: וְ/עַתָּ֗ה בָּחַ֤רְתִּי וְ/הִקְדַּ֨שְׁתִּי֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה לִ/הְיוֹת שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
translation:
  language: ta
  text: இப்போது, என் பெயர் என்றென்றும் அங்கே இருக்கும்படி நான் இந்த வீட்டை[a] தேர்ந்தெடுத்துப் புனிதமாக ஒதுக்கிவைத்திருக்கிறேன்[b]; என் கண்களும் என் இதயமும் எல்லா நாட்களிலும் அங்கே இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இந்த வீடு’ என்பது இங்கே ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அதாவது, புனித நோக்கத்திற்காகத் தனியே ஒதுக்கிவைத்திருக்கிறேன்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: இறைவனின் உரையில் புதிய கட்டத்துக்கு மாறுவதைக் குறிக்கிறது. தமிழில் தனியான இணைப்புச்சொல் இல்லாமலேயே இந்த உரைநடைத் தொடர்ச்சி இயல்பாக வெளிப்படுகிறது.
- source_word: בָּחַרְתִּי
  choice: தேர்ந்தெடுத்து ... ஒதுக்கிவைத்திருக்கிறேன்
  rationale: நிறைவேறிய செயலின் தற்போதைய விளைவைத் தமிழ் நிறைவு வடிவம் இயல்பாக எடுத்துரைக்கிறது.
- source_word: וְהִקְדַּשְׁתִּי
  choice: புனிதமாக ஒதுக்கிவைத்திருக்கிறேன்
  rationale: הקדישׁ என்பதன் இச்சூழலிலான பொருள், புனித நோக்கத்திற்காகத் தனியே ஒதுக்கிவைப்பதாகும். வெறுமனே ‘புனிதமாக்கினேன்’ என்பதைக் காட்டிலும் இந்தத் தேர்வு செயற்பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַבַּיִת הַזֶּה
  choice: இந்த வீடு
  rationale: எபிரேயத்தின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது; சூழலில் இது ஆலயத்தைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: என் பெயர் ... அங்கே இருக்கும்படி
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் முடிவில்லா வினை அமைப்பையும், ஆலய இறையியலில் முக்கியமான ‘என் பெயர்’ என்ற சொல்லாட்சியையும் விளக்கிப் பொருளாக்காமல் பாதுகாக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கும் நவீனத் தமிழ் வழக்கு.
- source_word: וְהָיוּ עֵינַי וְלִבִּי שָׁם
  choice: என் கண்களும் என் இதயமும் ... அங்கே இருக்கும்
  rationale: இறைவனின் கவனத்தையும் உடன்படிக்கை சார்ந்த அக்கறையையும் எடுத்துரைக்கும் மனித உடலுறுப்பு உருவகங்களை உரைபோலவே பாதுகாக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: எல்லா நாட்களிலும்
  rationale: ‘எல்லா நாட்களும்’ என்ற எபிரேயச் சொல்லமைப்பைத் தெளிவான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது; அதை வெறுமனே ‘எப்போதும்’ என்று சுருக்கவில்லை.
theological_decisions:
- issue: இறைவனைப் பற்றிய ‘என் கண்களும் என் இதயமும்’ என்ற மனித உருவக மொழி
  choice: உருவகத்தை நேரடியாகப் பாதுகாத்தல்
  alternative: ‘என் கவனமும் அக்கறையும் அங்கே இருக்கும்’ என்று பொருளுரைத்தல்
  rationale: மூல உரை இறைவனின் விழிப்பான கவனத்தையும் உறுதியான அக்கறையையும் உடலுறுப்பு உருவகங்களால் வெளிப்படுத்துகிறது. அவற்றைப் பாதுகாப்பது உரையின் இறையியல் செறிவைத் தக்கவைக்கிறது.
- issue: ‘என் பெயர் அங்கே இருக்கும்படி’ என்பதிலுள்ள ஆலய இறையியல்
  choice: ‘என் பெயர்’ என்பதை அப்படியே வைத்தல்
  alternative: ‘நான் அங்கே இருக்கும்படி’ அல்லது ‘என் பிரசன்னம் அங்கே இருக்கும்படி’
  rationale: ‘பெயர்’ என்பது இறைவனின் சுயவெளிப்பாட்டையும் உடன்படிக்கை சார்ந்த உறவையும் சுட்டும் பழைய ஏற்பாட்டுச் சொல்லாட்சி. அதை முழுப் பிரசன்னமாகவோ வெறும் புகழாகவோ விளக்கித் தீர்மானிக்காமல் மூலத்தின் இறையியல் நுட்பம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் இயல்பானதாயும் மரியாதைமிக்கதாயும் வடிவமைக்கப்பட்டது. ‘வீடு,’ ‘பெயர்,’ ‘கண்கள்,’ ‘இதயம்,’ ‘எல்லா நாட்களிலும்’ ஆகிய மூல உருவகங்களும் சொல்லாட்சிகளும் பாதுகாக்கப்பட்டுள்ளன; தேவையான விளக்கம் அடிக்குறிப்புகளில் மட்டும் வழங்கப்பட்டுள்ளது.
