revisions:
- from: 'நெருப்பு இறங்கி வந்ததையும், யாவேயின் மகிமை ஆலயத்தின்மேல் தங்கியதையும் இஸ்ரவேல் மக்கள் அனைவரும் கண்டபோது, அவர்கள் தளவரிசையின்மேல் முகங்குப்புறத் தரைமட்டும் குனிந்து, யாவேயை வழிபட்டு அவருக்கு நன்றி செலுத்தினார்கள்: “அவர் நல்லவர்; அவரது மாறாத அன்பு என்றென்றும் நிலைத்திருக்கும்.”'
  to: 'நெருப்பு இறங்கி வருவதையும், யாவேயின் மகிமை ஆலயத்தின்மேல் இருந்ததையும் இஸ்ரவேல் மக்கள் அனைவரும் கண்டபோது, அவர்கள் கற்கள் பதித்த தளத்தில் முகங்குப்புற விழுந்து, யாவேயை வணங்கி அவருக்கு நன்றி செலுத்தினார்கள்: “அவர் நல்லவர்; அவரது மாறாத அன்பு என்றென்றும் நிலைத்திருக்கும்.”'
  rationale: The revision removes an unsupported specification concerning the glory, replaces an unclear architectural/postural expression with natural Tamil that faithfully represents the paved surface and prostration, and otherwise retains the draft’s sound renderings and liturgical register.
