source:
  edition: WLC
  text: וְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל רֹאִים֙ בְּ/רֶ֣דֶת הָ/אֵ֔שׁ וּ/כְב֥וֹד יְהוָ֖ה עַל הַ/בָּ֑יִת וַ/יִּכְרְעוּ֩ אַפַּ֨יִם אַ֤רְצָ/ה עַל הָ/רִֽצְפָה֙ וַ/יִּֽשְׁתַּֽחֲו֔וּ וְ/הוֹד֤וֹת לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
translation:
  language: ta
  text: 'நெருப்பு இறங்கி வருவதையும், யாவேயின் மகிமை ஆலயத்தின்மேல் இருந்ததையும் இஸ்ரவேல் மக்கள் அனைவரும் கண்டபோது, அவர்கள் கற்கள் பதித்த தளத்தில் முகங்குப்புற விழுந்து, யாவேயை வணங்கி அவருக்கு நன்றி செலுத்தினார்கள்: “அவர் நல்லவர்; அவரது மாறாத அன்பு என்றென்றும் நிலைத்திருக்கும்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள் அனைவரும்
  rationale: எபிரெய மொழியில் சொற்பட ‘இஸ்ரவேலின் மகன்கள் அனைவரும்’ என்றாலும், இது ஆண்களை மட்டும் குறிக்காமல் இஸ்ரவேல் மக்களை மொத்தமாகக் குறிக்கும் வழக்கமான கூட்டுப்பெயர். நவீன தமிழில் பொருளைத் தெளிவாகக் கூறுகிறது.
- source_word: רֹאִים בְּרֶדֶת הָאֵשׁ
  choice: நெருப்பு இறங்கி வந்ததையும் ... கண்டபோது
  rationale: பங்கேற்புப் பெயரெச்சமும் ב இணைந்த infinitive construct-உம் நிகழ்வைக் கண்ட அதே நேரச் சூழலைக் காட்டுகின்றன. தமிழில் ‘கண்டபோது’ இயல்பாக அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: யாவேயின் மகிமை ஆலயத்தின்மேல் தங்கியதையும்
  rationale: כָּבוֹד என்பது வெளிப்பட்ட இறைமகிமையைக் குறிக்கிறது. עַל என்பது ‘மேல்’ என மொழிபெயர்க்கப்பட்டது; தமிழில் வாக்கியம் முழுமையடைய ‘தங்கியதையும்’ சூழலிலிருந்து இயல்பாக வழங்கப்பட்டது. הַבַּיִת இங்கு ஆலயத்தையே குறிக்கிறது.
- source_word: וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל הָרִצְפָה
  choice: அவர்கள் தளவரிசையின்மேல் முகங்குப்புறத் தரைமட்டும் குனிந்து
  rationale: כרע மற்றும் ‘முகங்கள் தரையை நோக்கி’ என்ற சொற்றொடர் ஆழ்ந்து பணியும் உடல்நிலையைச் சித்தரிக்கின்றன. רִצְפָה என்பது கற்கள் பதிக்கப்பட்ட தளம் அல்லது தளவரிசை.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: வழிபட்டு
  rationale: உடலால் பணிந்த செயல் ஏற்கெனவே கூறப்பட்டுள்ளதால், இங்கு வினையின் பக்திசார் பொருளான ‘வழிபட்டனர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְהוֹדוֹת לַיהוָה
  choice: அவருக்கு நன்றி செலுத்தினார்கள்
  rationale: ידה என்ற வினை இந்த வழிபாட்டு முழக்கச் சூழலில் நன்றி செலுத்துதல் அல்லது புகழ்தலைக் குறிக்கும். தொடர்ந்து வரும் ‘அவர் நல்லவர்’ என்பதோடு ‘நன்றி செலுத்துதல்’ சிறப்பாகப் பொருந்துகிறது.
- source_word: כִּי טוֹב
  choice: அவர் நல்லவர்
  rationale: இது வழிபாட்டில் பயன்படும் நிலையான அறிக்கை. முதல் כִּי-யின் விளக்கத் தொடர்பை தமிழில் மேற்கோளின் அமைப்பே இயல்பாக உணர்த்துவதால் தனியே ‘ஏனெனில்’ சேர்க்கப்படவில்லை.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: அவரது மாறாத அன்பு என்றென்றும் நிலைத்திருக்கும்
  rationale: חֶסֶד அன்பு, விசுவாசம், உடன்படிக்கைச் சார்ந்த பற்றுறுதி ஆகியவற்றை உள்ளடக்கும் செறிவான சொல். ‘மாறாத அன்பு’ அதன் நிலைத்த, பற்றுறுதியுள்ள தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெயில் வெளிப்படையாக இல்லாத வினை தமிழுக்காக ‘நிலைத்திருக்கும்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நான்கெழுத்து இறைப்பெயர் நேரடியாக வருகிறது. அதை பொதுப்பட்டப் பெயராக மாற்றாமல், உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து ‘யாவே’ எனத் தருவது மூலத்துக்கு நெருக்கமானது.
- issue: חַסְדּוֹ என்ற சொல்லின் வழிபாட்டுச் சூழல் பொருள்
  choice: அவரது மாறாத அன்பு
  alternative: அவரது இரக்கம் / அவரது உடன்படிக்கைப் பற்றுறுதி
  rationale: இச்சொல் இரக்கத்தை மட்டும் அல்லாமல் அன்பும் நீடித்த பற்றுறுதியும் உடன்படிக்கை விசுவாசமும் கொண்ட பரந்த கருத்தைத் தருகிறது. ‘மாறாத அன்பு’ அந்த அகலத்தைப் பெரிதும் காக்கிறது; மாற்று நுணுக்கங்களை மறுக்கவில்லை.
- issue: הַבַּיִת என்பதன் சூழல்சார் அடையாளம்
  choice: ஆலயம்
  alternative: வீடு
  rationale: சொற்பொருள் ‘வீடு’ என்றாலும், இவ்வதிகாரத்தின் சூழலில் அது யாவேயின் ஆலயத்தைக் குறிக்கிறது. நவீன வாசகருக்குத் தெளிவாக ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையில் வடிவமைக்கப்பட்டது. ‘இஸ்ரவேலின் மகன்கள்’ என்ற எபிரெய மரபுத்தொடர் பாலின வரம்பு தோன்றாதபடி ‘இஸ்ரவேல் மக்கள்’ எனப் பொருளோடு மொழிபெயர்க்கப்பட்டது. தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டன.
