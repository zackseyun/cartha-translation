translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் மரியாதைமிக்க நடையிலும் வடிவமைக்கப்பட்டது. நீண்ட எபிரெய வாக்கியம் தெளிவுக்காக இரண்டு உட்பிரிவுகளாக அமைக்கப்பட்டாலும், சாலொமோன், இஸ்ரவேலர் அனைவரும், மிகப் பெரிய கூட்டம், வட–தென் எல்லைகள் ஆகிய தொடர்புகள் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
