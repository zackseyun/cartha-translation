source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה אֶת הֶ֠/חָג בָּ/עֵ֨ת הַ/הִ֜יא שִׁבְעַ֤ת יָמִים֙ וְ/כָל יִשְׂרָאֵ֣ל עִמּ֔/וֹ קָהָ֖ל גָּד֣וֹל מְאֹ֑ד מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
translation:
  language: ta
  text: அந்தக் காலத்தில் சாலொமோன் ஏழு நாட்கள் பண்டிகையைக் கொண்டாடினார். அவருடன் இஸ்ரவேலர் அனைவரும் இருந்தனர்; லெபோ-ஆமாத்[a] முதல் எகிப்தின் ஓடை[b] வரை பரவியிருந்த பகுதிகளிலிருந்து கூடிய மிகப் பெரிய மக்கள் கூட்டம் அது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆமாத்தின் நுழைவிடம்.’ எபிரெயச் சொற்றொடரை ‘லெபோ-ஆமாத்’ என்ற இடப்பெயராகவோ, எல்லையைக் குறிக்கும் விளக்கச் சொற்றொடராகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘எகிப்தின் வாடி.’ எபிரெயச் சொல் பெரிய ஆற்றை அல்லாமல், பருவகாலத்தில் மட்டும் நீர் ஓடும் பள்ளத்தையோ ஓடையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: பண்டிகையைக் கொண்டாடினார்
  rationale: וַיַּעַשׂ என்பதன் அடிப்படைப் பொருள் ‘செய்தார்’ என்றாலும், חָג என்பதுடன் வரும்போது பண்டிகையைக் கொண்டாடுதல் அல்லது கடைப்பிடித்தல் என்பதே இயல்பான பொருள்.
- source_word: בָּעֵת הַהִיא
  choice: அந்தக் காலத்தில்
  rationale: குறிப்பிடப்பட்ட காலத்தை இயல்பான நவீனத் தமிழில் நேரடியாகத் தெரிவிக்கிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: பண்டிகை கொண்டாடப்பட்ட கால அளவை எளிமையாகவும் நேரடியாகவும் தருகிறது.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: அவருடன் இஸ்ரவேலர் அனைவரும் இருந்தார்கள்
  rationale: இஸ்ரவேல் மக்கள் முழுவதையும் குறிக்கும் கூட்டு உணர்வையும், அவர்கள் சாலொமோனுடன் இருந்ததையும் தெளிவாகக் காக்கிறது.
- source_word: קָהָל גָּדוֹל מְאֹד
  choice: மிகப் பெரிய மக்கள் கூட்டம்
  rationale: קָהָל என்பது இங்கு கூடிவந்த மக்களைக் குறிக்கிறது; ‘மக்கள் கூட்டம்’ என்பது தேவையற்ற திருச்சபைச் சார்பைத் தவிர்த்து நவீன வாசகருக்கு இயல்பாக உள்ளது.
- source_word: מִלְּבוֹא חֲמָת
  choice: லெபோ-ஆமாத் முதல்
  rationale: இதை வட எல்லையைக் குறிக்கும் இடப்பெயராக முதன்மை உரையில் ஒலிபெயர்த்துள்ளது; விளக்கவுரை என்ற மாற்று சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: עַד נַחַל מִצְרָיִם
  choice: எகிப்தின் ஓடை வரை
  rationale: נַחַל என்பது பெரிய ஆற்றைக் காட்டிலும் ஓடை, வெள்ளநீர் ஓடும் பள்ளம் அல்லது வாடியைக் குறிக்கலாம்; ‘ஓடை’ வாசிக்க இயல்பானதோடு மூலச்சொல்லின் பரப்பையும் ஓரளவு காக்கிறது.
