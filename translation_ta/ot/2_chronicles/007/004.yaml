base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/004.yaml
  text: Then the king and all the people offered sacrifices before Yahweh[a].
translation:
  language: ta
  text: பின்பு அரசனும் மக்கள் அனைவரும் யாவேக்கு முன்பாகப் பலிகளைச் செலுத்திக்கொண்டிருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், “ஒரு பலியைப் பலியிட்டுக்கொண்டிருந்தார்கள்”; ஒரே வேரைச் சேர்ந்த வினைச்சொல்லும் பெயர்ச்சொல்லும் இணைந்த இச்சொற்றொடர், அவர்கள் பலிகளைச் செலுத்திக்கொண்டிருந்தார்கள் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: பின்பு அரசனும்
  rationale: וְ கதைநிகழ்வின் தொடர்ச்சியைக் குறிக்கிறது; நவீன தமிழில் ‘பின்பு’ என்பது அந்த வரிசையை இயல்பாக வெளிப்படுத்துகிறது. இணைப்பைத் தொடர ‘அரசனும்’ என வழங்கப்பட்டது.
- source_word: וְכָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: עָם என்பதன் பொதுவான பொருள் ‘மக்கள்’; இங்கு திரண்டிருந்த மக்கள் முழுவதையும் குறிக்கிறது.
- source_word: זֹבְחִים זֶבַח
  choice: பலிகளைச் செலுத்திக்கொண்டிருந்தார்கள்
  rationale: ஒரே வேரிலிருந்து உருவான வினை–பெயர் சேர்க்கையான ‘பலியைப் பலியிடுதல்’ என்ற எபிரெயச் சொற்றொடரை இயல்பான தமிழில் ‘பலிகளைச் செலுத்துதல்’ என்று வழங்கி, பங்கேற்புச் சொல்லின் தொடர்நிலை அம்சத்தை ‘கொண்டிருந்தார்கள்’ மூலம் காத்துள்ளது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இறைவனின் முன்னிலையில் செய்யப்படும் வழிபாட்டுச் செயல் என்ற பொருளைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது எபிரெயத் தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூல வடிவைத் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தொடர்ச்சியான செயலைக் காட்டும் எபிரெயப் பங்கேற்புச் சொல்லின் அம்சம் காக்கப்பட்டுள்ளது; தமிழில் இயல்பில்லாத ஒரேவேர் மீளுரைத்தல் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
