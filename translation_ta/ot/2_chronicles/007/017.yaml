id: 2CH.7.17
reference: 2 Chronicles 7:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֤ר הָלַךְ֙ דָּוִ֣יד אָבִ֔י/ךָ וְ/לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ וְ/חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
translation:
  language: ta
  text: நீயோ, உன் தந்தை தாவீது எனக்கு முன்பாக நடந்ததுபோல் எனக்கு முன்பாக நடந்து, நான் உனக்குக் கட்டளையிட்ட அனைத்தையும் செய்து, என் சட்டங்களையும் என் நீதிநியமங்களையும்[a] கடைப்பிடித்தால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஒழுங்குமுறைகளையும்.”
    reason: מִשְׁפָּטַי என்பது சூழலுக்கு ஏற்ப ‘நீதிநியமங்கள்’ என்றும் ‘ஒழுங்குமுறைகள்’ என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: וְאַתָּה
  choice: நீயோ
  rationale: முன்னிலைப்படுத்தப்பட்ட தனிப்பெயர்ச்சொல்லின் வலியுறுத்தலையும் சாலொமோனை நோக்கிய நேரடி உரைமாற்றத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: תֵּלֵךְ לְפָנַי
  choice: எனக்கு முன்பாக நடந்து
  rationale: தேவனுடைய முன்னிலையில் ஒருவர் தம் வாழ்க்கையை நடத்துவதைக் குறிக்கும் எபிரெய உடன்படிக்கைச் சொல்லாட்சியின் ‘நடத்தல்’ உருவகத்தைப் பாதுகாக்கிறது.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: உன் தந்தை தாவீது எனக்கு முன்பாக நடந்ததுபோல்
  rationale: ஒப்பீட்டையும் ஒரே ‘நடத்தல்’ உருவகத்தின் தொடர்ச்சியையும் தெளிவாகப் பாதுகாக்கிறது; ‘எனக்கு முன்பாக’ என்பது சூழலிலிருந்து இயல்பாக நிறைவு செய்யப்படுகிறது.
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: நான் உனக்குக் கட்டளையிட்ட அனைத்தையும் செய்து
  rationale: וְלַעֲשׂוֹת என்ற infinitive construct-ஐ சார்பு வினையெச்சமாகக் காட்டி, ஒரே நிபந்தனைக்குள் வரும் உடன்நிகழ் கீழ்ப்படிதலை வெளிப்படுத்துகிறது; כְּכֹל என்பதன் முழுமையையும் ‘அனைத்தையும்’ பாதுகாக்கிறது.
- source_word: חֻקַּי
  choice: என் சட்டங்கள்
  rationale: உடன்படிக்கை மற்றும் சட்டச் சூழலில் நிலைநிறுத்தப்பட்ட விதிகளைச் சுட்டுகிறது; அடுத்து வரும் מִשְׁפָּטַי என்பதிலிருந்து சொல்லியல் வேறுபாட்டை வைத்திருக்கிறது.
- source_word: וּמִשְׁפָּטַי
  choice: என் நீதிநியமங்கள்
  rationale: நீதித்தீர்ப்பு சார்ந்த சட்ட விதிகள் அல்லது ஒழுங்குமுறைகள் என்ற பொருளைத் தாங்கி, חֻקַּי என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: תִּשְׁמֹר
  choice: கடைப்பிடித்தால்
  rationale: கட்டளைகளைப் பாதுகாத்து அனுசரித்தல் என்ற உடன்படிக்கைச் சார்ந்த பொருளை இயல்பான நவீன தமிழில் தருகிறது; אִם தொடங்கும் நிபந்தனையின் ஆட்சியை வசன முடிவுவரை தெளிவாக்குகிறது.
theological_decisions:
- issue: உடன்படிக்கைக் கீழ்ப்படிதலைத் தகுதிப்பேறு கோட்பாடாக மாற்றாமல் மொழிபெயர்த்தல்
  choice: ‘நடந்து... அனைத்தையும் செய்து... கடைப்பிடித்தால்’ என்று உண்மையான நிபந்தனை அமைப்பையும் கீழ்ப்படிதல் மொழியையும் நேரடியாகப் பாதுகாத்தல்
  alternative: இதனைப் பொதுவான ‘உண்மையாயிருத்தல்’ என்று தளர்த்திப் பொழிப்புரை செய்தல்
  rationale: இந்த வசனம் சாலொமோனுக்குச் சொல்லப்படும் உண்மையான உடன்படிக்கை நிபந்தனையை முன்வைக்கிறது. உரையில் இல்லாத கோட்பாட்டு முடிவைச் சேர்க்காமலும் நிபந்தனையின் வலிமையைக் குறைக்காமலும் அதன் பதற்றம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘நடத்தல்’ உருவகம், தாவீதுடனான ஒப்பீடு, ஒரே நிபந்தனை வாக்கிய அமைப்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன. அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனைத் தொடரைக் காட்ட வசனம் காற்புள்ளியுடன் முடிகிறது.
