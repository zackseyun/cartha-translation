  text: וַ/יִּזְבַּ֞ח הַ/מֶּ֣לֶךְ שְׁלֹמֹה֮ אֶת זֶ֣בַח הַ/בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית הָֽ/אֱלֹהִ֔ים הַ/מֶּ֖לֶךְ וְ/כָל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/005.yaml
  text: And King Solomon sacrificed twenty-two thousand cattle and one hundred twenty thousand sheep[a], and the king and all the people dedicated the house of God.
translation:
  language: ta
  text: சாலொமோன் அரசன் இருபத்திரண்டாயிரம் மாடுகளையும் நூற்று இருபதாயிரம் செம்மறியாடுகளையும்[a] பலியிட்டான். அரசனும் மக்கள் அனைவரும் கடவுளின் இல்லத்தை அர்ப்பணித்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சிறு கால்நடைகள்’; எபிரெயச் சொல் செம்மறியாடுகளையும் வெள்ளாடுகளையும் சேர்த்துக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: பலியிட்டான்
  rationale: זבח என்பது இப்பலிச் சூழலில் விலங்குகளைப் பலியாகக் கொடுத்ததைக் குறிக்கிறது; ‘பலியிட்டான்’ என்பது சுருக்கமாகவும் இயல்பாகவும் வழிபாட்டுச் சார்ந்த பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: זֶבַח הַבָּקָר
  choice: மாடுகளையும்
  rationale: בקר என்பது மாட்டு இனத்தைச் சேர்ந்த கால்நடைகளைத் தொகுப்பாகக் குறிக்கிறது; பெரும் எண்ணிக்கையுடன் ‘மாடுகள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: இருபத்திரண்டாயிரம்
  rationale: எபிரெய எண்ணை இயல்பான நவீனத் தமிழ் எண்ணமைப்பில் வழங்குகிறது.
- source_word: וְצֹאן
  choice: செம்மறியாடுகளையும்[a]
  rationale: צֹאן பொதுவாகச் சிறு கால்நடைகளைக் கூட்டாகக் குறிக்கலாம். முதன்மை உரையில் பலிப்பட்டியலுக்கு இயல்பான ‘செம்மறியாடுகள்’ பயன்படுத்தப்பட்டு, அதன் விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: நூற்று இருபதாயிரம்
  rationale: எபிரெய எண்ணைத் தெளிவான, வழக்கமான தமிழ் வடிவில் தருகிறது.
- source_word: וַיַּחְנְכוּ
  choice: அர்ப்பணித்தனர்
  rationale: חנך இங்கு கடவுளின் இல்லத்தை முறையாகப் பயன்பாட்டுக்கு அர்ப்பணித்தல் அல்லது தொடங்கிவைத்தலைக் குறிக்கிறது; ‘அர்ப்பணித்தனர்’ வழிபாட்டுச் சூழலிலும் நவீனத் தமிழிலும் இயல்பானது.
- source_word: בֵּית הָאֱלֹהִים
  choice: கடவுளின் இல்லத்தை
  rationale: ‘கடவுளின் இல்லம்’ என்ற எபிரெய உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; ‘ஆலயம்’ என்று விளக்கமாக மாற்றுவதைத் தவிர்க்கிறது.
- source_word: הַמֶּלֶךְ וְכָל הָעָם
  choice: அரசனும் மக்கள் அனைவரும்
  rationale: சாலொமோன் ஏற்கெனவே பெயரிடப்பட்டபின் எபிரெய உரை மீண்டும் ‘அரசன்’ என்று குறிப்பிடும் உரையோட்டத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: בֵּית הָאֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: கடவுளின் இல்லம்
  alternative: கடவுளின் ஆலயம்
  rationale: ஆலயமே சூழலில் குறிக்கப்பட்டாலும், மூலத்தின் ‘இல்லம்’ என்ற சொல்லுருவைத் தக்கவைத்து, அதன் உருவகத்தையும் இறையியல் நுணுக்கத்தையும் முன்கூட்டியே விளக்கித் தீர்க்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வாக்கியத்தின் தொடர்ச்சியைப் பேணியபோதும், தமிழில் நீண்ட எண்ணிக்கைப் பட்டியல் தெளிவாக வாசிக்க இரு வாக்கியங்களாக அமைக்கப்பட்டது.
