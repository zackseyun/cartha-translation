  edition: WLC
  text: וְ/לֹ֤א יָֽכְלוּ֙ הַ/כֹּ֣הֲנִ֔ים לָ/ב֖וֹא אֶל בֵּ֣ית יְהוָ֑ה כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
translation:
  language: ta
  text: மேலும், ஆசாரியர்கள் யாவேவின் ஆலயத்துக்குள் நுழைய முடியவில்லை; ஏனெனில் யாவேவின் மகிமை யாவேவின் ஆலயத்தை நிரப்பியிருந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவேவின் வீடு”; அதாவது, ஆலயம். எபிரெய மூலத்தில் இந்தத் தொடர் இருமுறை வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  choice: முடியவில்லை
  rationale: יכל திறன் அல்லது இயலாமையைக் குறிக்கிறது. தமிழில் எதிர்மறை வினைமுற்றாக இயல்பாகவும் தெளிவாகவும் தரப்பட்டுள்ளது; இயலாமையின் தன்மை மேலதிகமாக விளக்கப்படவில்லை.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயப் பணியுடன் தொடர்புடைய כהנים என்பதற்கான தமிழில் பரவலாக அறியப்பட்ட வேதாகமச் சொல்.
- source_word: לָבוֹא אֶל
  choice: அதற்குள் நுழைய
  rationale: בוא + אֶל இச்சூழலில் ஓர் இடத்திற்குள் செல்வதைக் குறிக்கிறது. முன் குறிப்பிடப்பட்ட ஆலயத்தைச் சுட்டும் ‘அதற்குள்’ தமிழ் மீளுரையைத் தவிர்க்கிறது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: בַּיִת என்பதன் நேர்ப்பொருள் ‘வீடு’ என்றாலும், இங்கு அது அர்ப்பணிக்கப்பட்ட ஆலயத்தைக் குறிக்கிறது. நவீன தமிழில் ‘ஆலயம்’ சூழற்பொருளைத் தெளிவாகத் தருகிறது; எபிரெய நேர்ச்சொல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்ற ‘யெகோவா’ என்ற ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: כִּי
  choice: -தால்
  rationale: ஆசாரியர்கள் நுழைய முடியாததற்கான காரணத்தை வெளிப்படுத்தும் காரண விகுதியாக இயல்பான தமிழில் தரப்பட்டுள்ளது.
- source_word: מָלֵא
  choice: நிரப்பியிருந்ததால்
  rationale: மகிமை ஆலயத்தை நிரப்பிய நிலையே ஆசாரியர்களின் இயலாமைக்குக் காரணம் என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; செயப்பாட்டு ‘நிரப்பியது’ என்ற எபிரெய அமைப்பும் காக்கப்படுகிறது.
- source_word: כְבוֹד יְהוָה
  choice: யெகோவாவின் மகிமை
  rationale: எபிரெய சார்புநிலைத் தொடரை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயரான நான்கு எழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் தமிழில் பரவலாக நிலைபெற்ற ஒலிபெயர்ப்பால் தரப்பட்டுள்ளது; ‘யாவே’ என்பதும் சாத்தியமான ஒலிபெயர்ப்பு.
- issue: בֵּית יְהוָה என்பதன் மொழியாக்கம்
  choice: யெகோவாவின் ஆலயம்
  alternative: யெகோவாவின் வீடு
  rationale: ‘வீடு’ என்பது வடிவரீதியான நேரடி மொழியாக்கம்; ஆனால் இந்த அர்ப்பணிப்பு நிகழ்வில் குறிக்கப்படுவது ஆலயம். பிரதான உரையில் தெளிவுக்காக ‘ஆலயம்’ பயன்படுத்தப்பட்டு, எபிரெய உருவகம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. எபிரெயில் இருமுறை வரும் ‘யெகோவாவின் வீடு’ என்ற தொடரின் இரண்டாவது இடம் தமிழில் ‘அதற்குள்’ எனச் சுட்டப்பட்டுள்ளது; பொருள் மாறாமல் தேவையற்ற கனமான மீளுரை தவிர்க்கப்பட்டுள்ளது.
