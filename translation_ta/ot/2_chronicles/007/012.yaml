base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
translation:
  language: ta
  text: பின்பு யாவே இரவில்[a] சாலொமோனுக்குத் தோன்றி, அவரிடம், “நான் உன் ஜெபத்தைக் கேட்டேன்; இந்த இடத்தை எனக்காகப் பலி செலுத்தும் இல்லமாக[b] தேர்ந்துகொண்டேன்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரவு நேரத்தில்.”
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “பலியின் இல்லமாக”; அதாவது, பலி வழிபாட்டுக்கென ஒதுக்கப்பட்ட இடமாக.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: தோன்றி
  rationale: ראה என்பதன் நிஃபால் வடிவம் இங்கு சாலொமோனுக்கு யாவே தம்மைக் காணத்தக்க விதத்தில் வெளிப்படுத்தியதைக் குறிக்கிறது. ‘தோன்றி’ என்பது வெளிப்பாட்டின் விதத்தைத் தேவையின்றி விளக்காமல் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலின் தேவனுடைய தனிப்பெயராகிய நான்கெழுத்துப் பெயர். அதை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் ஏற்ற ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
- source_word: בַּלָּיְלָה
  choice: இரவில்
  rationale: בְּ முன்னொட்டுடன் வரும் ‘இரவு’ என்ற சொல் நிகழ்வு நடந்த காலத்தைக் குறிக்கிறது. ‘இரவில்’ என்பது நேரடியும் இயல்புமான தமிழ்.
- source_word: שָׁמַעְתִּי אֶת־תְּפִלָּתֶךָ
  choice: நான் உன் விண்ணப்பத்தைக் கேட்டேன்
  rationale: எபிரெயப் பூர்த்திவினை முடிவுற்ற செயலைக் குறிக்கிறது; அந்தச் செயலின் விளைவு இப்பதில் தொடர்கிறது. ‘விண்ணப்பம்’ என்பது ஆலய அர்ப்பணிப்பின்போது சாலொமோன் ஏறெடுத்த வேண்டுதலின் தன்மையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבָחַרְתִּי
  choice: தேர்ந்துகொண்டேன்
  rationale: தேவனுடைய முடிவுற்றதும் தொடர்ந்து பொருந்துவதுமான தெரிவை இச்சொல் குறிக்கிறது. ‘தேர்ந்துகொண்டேன்’ அதன் தனிப்பட்ட, நோக்கமுள்ள செயலைத் தெளிவாகத் தருகிறது.
- source_word: בַּמָּקוֹם הַזֶּה לִי
  choice: இந்த இடத்தை எனக்காக
  rationale: ஆலயம் அமைந்துள்ள குறிப்பிட்ட இடத்தையும் அது யாவேக்கெனத் தேர்ந்தெடுக்கப்பட்டதையும் இவ்வாக்கியம் வெளிப்படுத்துகிறது.
- source_word: לְבֵית זָבַח
  choice: பலி செலுத்தும் இல்லமாக
  rationale: சொல்லாட்சியில் இது ‘பலியின் இல்லம்’ எனினும், பலி வழிபாட்டுக்கென ஒதுக்கப்பட்ட இல்லம் என்ற செயல்பாட்டுப் பொருளை ‘பலி செலுத்தும் இல்லம்’ நவீன தமிழில் தெளிவாகத் தருகிறது; ‘ஆலயம்’ என்று மட்டும் மொழிபெயர்த்து மூல உருவகத்தை மறைக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்ல, நான்கெழுத்துத் தனிப்பெயரே உள்ளது. ஆகவே அந்த உடன்படிக்கைப் பெயரைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: לְבֵית זָבַח என்பதன் பொருள்
  choice: பலி செலுத்தும் இல்லமாக
  alternative: பலியின் இல்லமாக; பலிக்கான இல்லமாக
  rationale: இந்தத் தொடர் ஆலயத்தைப் பலி வழிபாட்டுக்குரிய இடமாக விவரிக்கிறது. முதன்மை உரை இயல்பான தமிழில் செயல்பாட்டுப் பொருளைத் தருகிறது; அடிக்குறிப்பு அதன் நேரடியான வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. சாலொமோனைச் சுட்டும் மரியாதை ஒருமை ‘அவரிடம்’ பயன்படுத்தப்பட்டுள்ளது; நேரடிப் பேச்சில் யாவே சாலொமோனை ‘உன்’ என்று ஒருமையில் அழைப்பது மூலத்தின் நெருக்கத்தையும் இலக்கண எண்ணையும் பாதுகாக்கிறது.
