base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
translation:
  language: ta
  text: ஏழாம் மாதத்தின் இருபத்துமூன்றாம் நாளில் அவன் மக்களை அவர்களுடைய கூடாரங்களுக்கு[a] அனுப்பிவிட்டான்; அவர்கள் யாவே தாவீதுக்கும் சாலொமோனுக்கும் தம் மக்களான இஸ்ரவேலுக்கும் செய்த நன்மையினால் மகிழ்ச்சியுடனும் மனமகிழ்வுடனும் இருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘அவர்களுடைய வீடுகளுக்கு’ என்றும் பொருள் கொள்ளலாம்; சொல்லுக்குச் சொல்: ‘அவர்களுடைய கூடாரங்களுக்கு.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: ஏழாம் மாதத்தின் இருபத்துமூன்றாம் நாளில்
  rationale: எபிரெயத் தேதிக் குறிப்பை இயல்பான நவீன தமிழ்ச் சொல்லமைப்பில் வழங்குகிறது; தொடக்க வாவ் தொடர்ச்சியைத் தமிழில் கட்டாயமாக ‘மேலும்’ என்று மொழிபெயர்க்காமல் கதைநடையில் விட்டுள்ளது.
- source_word: שִׁלַּח
  choice: அனுப்பிவிட்டான்
  rationale: கூடியிருந்த மக்களைத் தங்கள் இருப்பிடங்களுக்குத் திருப்பி அனுப்பிய நிறைவுற்ற செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאָהֳלֵיהֶם
  choice: அவர்களுடைய கூடாரங்களுக்கு
  rationale: ‘அவர்களுடைய கூடாரங்களுக்கு’ என்ற மூலத்தின் நேரடியான உருவகத்தைப் பாதுகாக்கிறது; சூழலில் இது வீடுகள் அல்லது இருப்பிடங்களைக் குறிக்கலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: மகிழ்ச்சியும் மனக்களிப்பும் கொண்டவர்களாக
  rationale: மக்களின் வெளிப்படையான மகிழ்ச்சியையும் உள்ளார்ந்த களிப்பையும் குறிக்கும் இணைச் சொற்றொடரைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: עַל הַטּוֹבָה אֲשֶׁר עָשָׂה
  choice: செய்த நன்மையினால்
  rationale: ‘செய்த நன்மை’ என்று எபிரெய வினைச்சொல்லையும் பெயர்ச்சொல்லையும் நேரடியாகவும் தமிழில் இயல்பாகவும் வழங்குகிறது; மகிழ்ச்சிக்கான காரணத்தையும் ‘-இனால்’ தெளிவுபடுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  choice: தாவீதுக்கும் சாலொமோனுக்கும் தமது மக்களான இஸ்ரவேலுக்கும்
  rationale: மூவரும் நன்மையின் பயனாளிகள் என்பதை ‘-க்கும்’ மூலம் காக்கிறது; ‘தமது மக்களான’ என்பது இஸ்ரவேல் யாவேயின் மக்கள் என்ற சார்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டமல்ல, தனிப்பட்ட இறைப் பெயரே உள்ளது. ஆகவே அதன் பெயர்த்தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: ‘தமது மக்கள்’ என்பதன் சார்பு
  choice: இஸ்ரவேல் யாவேயின் மக்கள்
  alternative: இஸ்ரவேல் தாவீது அல்லது சாலொமோனின் மக்கள்
  rationale: עַמּוֹ என்ற ஒருமை ஆண்பால் உடைமைப் பின்னொட்டு வாக்கியத்தின் செய்பவரான யாவேயையே இயல்பாகச் சுட்டுகிறது; உடன்படிக்கைச் சார்பையும் மூலத்தின்படி காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் நீண்ட தொடரைத் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரித்தாலும், செயல் வரிசையும் காரணத் தொடர்பும் பாதுகாக்கப்பட்டுள்ளன.
