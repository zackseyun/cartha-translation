  text: וּ/נְתַשְׁתִּ֗י/ם מֵ/עַ֤ל אַדְמָתִ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אַשְׁלִ֖יךְ מֵ/עַ֣ל פָּנָ֑/י וְ/אֶתְּנֶ֛/נּוּ לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
translation:
  language: ta
  text: அப்போது, நான் அவர்களுக்குக் கொடுத்த என் நிலத்திலிருந்து அவர்களை வேரோடு பிடுங்கிப்போடுவேன். என் பெயருக்கென்று நான் புனிதப்படுத்திய இந்த இல்லத்தை[a] என் பார்வையிலிருந்து அகற்றி எறிவேன்[b]. அதை எல்லா மக்களினங்களிடையிலும் பழமொழியாகவும் வசைச்சொல்லாகவும்[c] ஆக்குவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இல்லம்’ என்பது இங்கு ஆலயத்தைக் குறிக்கிறது. எபிரெயத்தில், ‘இந்த இல்லம்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘என் முகத்திற்கு முன்பிருந்து.’
    reason: lexical_alternative
  - marker: c
    text: ‘பழமொழியாகவும் வசைச்சொல்லாகவும்’ என்பதற்கு, ‘எடுத்துக்காட்டாகவும் கேலிப்பொருளாகவும்’ அல்லது ‘ஏளனச் சொல்லாகவும் வசைச்சொல்லாகவும்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  choice: அப்போது ... அவர்களை வேரோடு பிடுங்கிப்போடுவேன்
  rationale: נתשׁ என்பது நிலத்திலிருந்து பிடுங்குதல் அல்லது வேரோடு அகற்றுதல் என்ற உருவகத்தைத் தருகிறது. முந்தைய வசனத்தின் நிபந்தனைத் தொடரை முன்னிட்டு וּ־ என்பது இயல்பான தமிழில் ‘அப்போது’ எனத் தரப்பட்டுள்ளது.
- source_word: מֵעַל אַדְמָתִי אֲשֶׁר נָתַתִּי לָהֶם
  choice: நான் அவர்களுக்குக் கொடுத்த என் நிலத்திலிருந்து
  rationale: אֲדָמָה இச்சூழலில் ‘நிலம்’ எனப் பொருள்படும்; ‘என்’ என்பது இறை உரிமையையும், ‘அவர்களுக்குக் கொடுத்த’ என்பது அந்த நிலம் அருளப்பட்டதையும் காக்கிறது.
- source_word: הַבַּיִת הַזֶּה
  choice: இந்த இல்லத்தை
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருள் ‘வீடு/இல்லம்.’ இங்கு அது ஆலயத்தைக் குறித்தாலும், மூலமொழியின் ‘இல்லம்’ என்ற இறையியல் உருவகத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு சூழற்பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: என் பெயருக்கென்று நான் புனிதப்படுத்திய
  rationale: קדשׁ என்ற ஹிஃபீல் வடிவம் புனித நோக்கத்திற்காக ஒதுக்கிவைப்பதைக் குறிக்கிறது. ‘என் பெயருக்கென்று’ என்பது இறைப் பெயருடன் தொடர்புடைய மூலமொழிக் கருத்தை விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- source_word: אַשְׁלִיךְ מֵעַל פָּנַי
  choice: என் பார்வையிலிருந்து அகற்றி எறிவேன்
  rationale: சொல்லுக்கு சொல் ‘என் முகத்திற்கு முன்பிருந்து எறிவேன்’ எனும் எபிரெய மரபுத்தொடர் இறை நிராகரிப்பைக் குறிக்கிறது. தமிழில் இயல்பாகவும் அதன் வலிமையுடனும் ‘என் பார்வையிலிருந்து அகற்றி எறிவேன்’ எனத் தரப்பட்டுள்ளது.
- source_word: וְאֶתְּנֶנּוּ
  choice: அதை ... ஆக்குவேன்
  rationale: נתן உடன் வரும் பயனிலைப் பெயர்கள் இங்கு ஒன்றை ஒரு குறிப்பிட்ட நிலைக்கு ஆக்குவதைக் குறிக்கின்றன.
- source_word: לְמָשָׁל
  choice: பழமொழியாக
  rationale: מָשָׁל என்பதற்கு பழமொழி, எடுத்துக்காட்டுச் சொல், ஏளனச் சொல் ஆகிய பொருட்கள் உண்டு. இணையாக வரும் שְׁנִינָה வசைநயத்தைத் தெளிவாக்குவதால், முதல்சொல் ‘பழமொழி’ எனத் தரப்பட்டுள்ளது.
- source_word: לִשְׁנִינָה
  choice: வசைச்சொல்லாக
  rationale: שְׁנִינָה என்பது பிறர் ஏளனமாகத் திரும்பத் திரும்பச் சொல்லும் சொல்லையோ கேலிக்குரிய பொருளையோ குறிக்கிறது. ‘வசைச்சொல்’ பொதுமக்கள் புரிந்துகொள்ளும் இயல்பான தமிழ் இணை.
- source_word: בְּכָל הָעַמִּים
  choice: எல்லா மக்களினங்களிடையிலும்
  rationale: עַמִּים என்பது பன்மையில் ‘மக்களினங்கள்’; அரசியல் நாடுகள் என்ற பொருளைத் தேவையின்றி புகுத்தாமல் பன்மையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ஆலயத்தைக் குறிக்கும் בַּיִת என்பதன் மொழிபெயர்ப்பு
  choice: இந்த இல்லத்தை
  alternative: இந்த ஆலயத்தை
  rationale: இங்கு குறிப்பது ஆலயமே என்றாலும், எபிரெயம் நேரடியாக ‘இல்லம்’ என்கிறது. அதைப் பேணுவது தேவனுடைய இல்லம் என்ற வேதாகம உருவகத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு பொருளைத் தெளிவாக்குகிறது.
- issue: இறை நிராகரிப்பைக் குறிக்கும் ‘என் முகத்திற்கு முன்பிருந்து’ என்ற மரபுத்தொடர்
  choice: என் பார்வையிலிருந்து அகற்றி எறிவேன்
  alternative: என் முகத்திற்கு முன்பிருந்து எறிவேன்
  rationale: இயல்பான தமிழ் நடை இறை நிராகரிப்பைத் தெளிவாக வெளிப்படுத்துகிறது; அதேவேளை ‘பார்வை’ என்பது மூலத்தின் முகம்/முன்னிலை உருவகத்துக்கு அருகிலேயே உள்ளது. சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: מָשָׁל மற்றும் שְׁנִינָה ஆகிய இணைச்சொற்களின் வசைநயம்
  choice: பழமொழியாகவும் வசைச்சொல்லாகவும்
  alternative: எடுத்துக்காட்டாகவும் கேலிப்பொருளாகவும்
  rationale: இரு சொற்களின் பொருள் வரம்புகளை ஒன்றாகக் கலக்காமல், முதல்சொல்லின் சொல்லாடல் இயல்பையும் இரண்டாம்சொல்லின் இகழ்ச்சி நயத்தையும் தனித்தனியாகக் காக்கிறது.
translation_notes:
  register: நடை நவீனத் தரத் தமிழாகவும், வழிபாட்டு மரியாதையைத் தக்கவைக்கும் வகையிலும் அமைக்கப்பட்டுள்ளது. ‘இல்லம்’ மூலமொழியின் உருவகத்தைப் பேணுகிறது; ‘வேரோடு பிடுங்கிப்போடுவேன்’ தீர்ப்பின் நில-உருவக வலிமையை வெளிப்படுத்துகிறது. குறியீடுகள் [a], [b], [c] அனைத்தும் தொடர்புடைய சொற்றொடர்களின் அருகில் முதன்மை உரையில் இடப்பட்டுள்ளன.
