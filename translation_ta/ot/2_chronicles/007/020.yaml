  source_fidelity: மூல எபிரெயத்தின் நிபந்தனைத் தொடரைச் சார்ந்த எதிர்காலத் தீர்ப்புச் செயல்கள் துல்லியமாகத் தரப்பட்டுள்ளன. ‘வேரோடு பிடுங்கிப்போடுவேன்’ נתשׁ-இன் நில/வேரறுக்கும் உருவகத்தைப் பாதுகாக்கிறது; ‘என் நிலம்,’ ‘அவர்களுக்குக் கொடுத்த,’ ‘என் பெயருக்கென்று புனிதப்படுத்திய இந்த இல்லம்,’ மற்றும் ‘என் பார்வையிலிருந்து அகற்றி எறிவேன்’ ஆகியவை மூலத்தின் உரிமை, அருளளிப்பு, அர்ப்பணிப்பு, நிராகரிப்பு ஆகிய கூறுகளைப் போதிய நம்பகத்தன்மையுடன் வெளிப்படுத்துகின்றன. ‘பழமொழியாகவும் வசைச்சொல்லாகவும்’ என்பது מָשָׁל / שְׁנִינָה இணைப்பின் பொது இகழ்ச்சிப் பொருளைச் சரியாகக் காக்கிறது.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் வாசிப்புக்கு இயல்பாகவும் உள்ளது. ‘இல்லம்’ ஆலயச் சூழலில் ஓரளவு உயர்நடைச் சாயலைக் கொண்டிருந்தாலும், மூலத்தின் ‘house’ உருவகத்தைப் பாதுகாக்கும் பொருத்தமான தேர்வாக உள்ளது; இணைக்கப்பட்ட அடிக்குறிப்பு புரிதலுக்குப் போதுமான உதவியை அளிக்கிறது.
