  source_fidelity: 'திருத்தம் தேவை. எபிரெய மூலத்தில் בֵּית (‘வீடு/இல்லம்’) இருமுறையும் வருகிறது: முதலில் ‘அரசனின் வீடு,’ பின்னர் சாலொமோனின் ‘தன் வீடு.’ வரைவு இரண்டையும் ‘அரண்மனை’ என மாற்றுவதால் அந்தச் சொல் மீளுரைப்பும், இரண்டாம் குறிப்பின் நேரடியான சுட்டலும் மறைகின்றன. குறிப்பாக இரண்டாம் இடம் ‘முன் குறிப்பிட்ட அதே அரண்மனை’ எனக் கூறுவது மூலத்தின் சொல்லாட்சியால் நேரடியாக நிறுவப்படாத விளக்கமாகும்.'
  naturalness: ‘யாவேவின் ஆலயம்,’ ‘அரசனின் மாளிகை’ ஆகியவை நவீனத் தமிழில் இயல்பானவை. ஆனால் இரண்டாம் இடத்தில் ‘தன் வீட்டிலும்’ என்பது இயல்பாக இருந்து, மூலத்தின் வேறுபட்ட சுட்டுதலையும் காக்கிறது. ‘தன் உள்ளத்தில் எண்ணியிருந்த’ என்பது எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
