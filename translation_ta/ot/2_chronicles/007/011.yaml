base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
translation:
  language: ta
  text: இவ்வாறு சாலொமோன் யாவேவின் ஆலயத்தையும் அரசனின் மாளிகையையும் முடித்தான். யாவேவின் ஆலயத்திலும் தன் வீட்டிலும் செய்யச் சாலொமோன் தன் உள்ளத்தில் எண்ணியிருந்த அனைத்தையும் அவன் வெற்றிகரமாக நிறைவேற்றினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெற்றிகரமாக நிறைவேற்றினான்” என்பதற்கான எபிரெய வினையை “அவன் வெற்றிபெற்றான்” அல்லது “அவற்றை வெற்றியடையச் செய்தான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: முடித்தான்
  rationale: כלה என்பதன் தொடர்கதை வடிவம் ஒரு பணியை நிறைவுக்குக் கொண்டுவருவதைக் குறிக்கிறது; ‘முடித்தான்’ இயல்பான, நேரடியான தமிழ்.
- source_word: בֵּית יְהוָה
  choice: யாவேவின் ஆலயம்
  rationale: எபிரெயத்தில் சொற்பொருளாக ‘யாவேவின் வீடு’; இச்சூழலில் அது ஆலயத்தைக் குறிப்பதால், நவீன தமிழில் தெளிவான ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரசனின் அரண்மனை
  rationale: சொற்பொருள் ‘அரசனின் வீடு’ என்றாலும், இங்கு அரச மாளிகைத் தொகுதியே குறிக்கப்படுகிறது; ‘அரண்மனை’ தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  choice: சாலொமோன் தன் உள்ளத்தில் எண்ணியிருந்த அனைத்தையும்
  rationale: ‘சாலொமோனின் இதயத்தின்மேல் வந்த அனைத்தும்’ என்ற எபிரெய மரபுத்தொடர் அவன் எண்ணிய அல்லது செய்யத் தீர்மானித்தவற்றைக் குறிக்கிறது; தமிழ் வழக்கில் பொருளைத் தெளிவாகச் சொல்கிறது.
- source_word: לַעֲשׂוֹת
  choice: செய்ய
  rationale: עשה என்ற பரந்த வினையின் நோக்கப் பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּבְבֵיתוֹ
  choice: தனது அரண்மனையில்
  rationale: பின்னொட்டு சாலொமோனைச் சுட்டுகிறது; முன் குறிப்பிடப்பட்ட அரசனின் அரண்மனையே இங்கும் குறிக்கப்படுவதைத் தெளிவாக்குகிறது.
- source_word: הִצְלִיחַ
  choice: வெற்றிகரமாக நிறைவேற்றினான்
  rationale: Hiphil வடிவம் ‘வெற்றிபெறு’ அல்லது ‘வெற்றியடையச் செய்’ என்ற இரு நிழற்பொருள்களையும் கொள்ளலாம்; கட்டுமானச் செயல்களின் சூழலில் வெற்றிகரமான நிறைவேற்றத்தை இச்சொற்றொடர் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது; ‘யாவே’ என்பது அந்த உடன்படிக்கைப் பெயரைப் பெயராகவே காக்கிறது.
- issue: הִצְלִיחַ என்பதிலுள்ள செயப்படுத்தும்/தன்வினை நுணுக்கம்
  choice: முதன்மை உரையில் ‘வெற்றிகரமாக நிறைவேற்றினான்’; அடிக்குறிப்பில் மாற்றுப் பொருள்கள்
  alternative: அவன் வெற்றிபெற்றான் / அவற்றை வெற்றியடையச் செய்தான்
  rationale: வினை வெற்றிபெறுதல் அல்லது ஒன்றை வெற்றியடையச் செய்தல் எனப் புரியக்கூடியதால், சூழலுக்கேற்ற வாசிப்பு முதன்மை உரையில் தரப்பட்டு, உண்மையான சொற்பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வீடு’ என்ற எபிரெய மீளுரைப்பைச் சொற்சொல்லாக வைத்திருக்காமல், சூழலின்படி ‘ஆலயம்’ மற்றும் ‘அரண்மனை’ என இயல்பாக்கப்பட்டுள்ளது; இதயத்தைச் சார்ந்த எபிரெய மரபுத்தொடர் ‘தன் உள்ளத்தில் எண்ணியிருந்த’ எனத் தெளிவாக்கப்பட்டுள்ளது.
