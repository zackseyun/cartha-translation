  text: וַ/הֲקִ֣ימוֹתִ֔י אֵ֖ת כִּסֵּ֣א מַלְכוּתֶ֑/ךָ כַּ/אֲשֶׁ֣ר כָּרַ֗תִּי לְ/דָוִ֤יד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
translation:
  language: ta
  text: அப்போது நான் உன் அரசாட்சியின் அரியணையை நிலைநிறுத்துவேன்; உன் தந்தையாகிய தாவீதுடன் நான் உடன்படிக்கை செய்து, ‘இஸ்ரவேலை ஆளும் ஒருவன் உன்னிடமிருந்து துண்டிக்கப்பட மாட்டான்’ என்று கூறியபடியே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: அப்போது நான் ... நிலைநிறுத்துவேன்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் ‘நிற்கச் செய்தல், நிலைநிறுத்துதல்’ என்று பொருள்படும். முந்தைய வசனத்தின் நிபந்தனைக்கு வரும் விளைவைக் காட்டுவதால் וַ என்பதற்கு இங்கு ‘அப்போது’ இயல்பானது.
- source_word: כִּסֵּא מַלְכוּתֶךָ
  choice: உன் அரசாட்சியின் அரியணை
  rationale: ‘அரியணை’ மற்றும் ‘அரசாட்சி’ என்ற இரு பெயர்ச்சொற்களையும் தக்கவைத்து எபிரெயக் கூட்டமைப்பை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: כָּרַתִּי
  choice: நான் உடன்படிக்கை செய்தேன்
  rationale: כרת என்பது இச்சூழலில் உடன்படிக்கை செய்வதற்கான எபிரெய மரபுத்தொடர். தமிழில் அதன் உடன்படிக்கை சார்ந்த பொருளை வெளிப்படையாகக் கூறுவது இயல்பானது.
- source_word: לְדָוִיד אָבִיךָ
  choice: உன் தந்தையாகிய தாவீதுடன்
  rationale: தாவீதுடன் செய்யப்பட்ட உடன்படிக்கையைக் குறிக்க ‘உடன்’ பொருத்தமானது. ‘தந்தை’ என்பது இங்கு வம்ச முன்னோரைக் குறித்தாலும் மூல உருவகம் தக்கவைக்கப்படுகிறது.
- source_word: לֹא יִכָּרֵת לְךָ
  choice: உன்னிடமிருந்து அறுப்புண்டுபோக மாட்டான்
  rationale: כרת என்பதன் நிஃபால் வடிவத்திலுள்ள ‘அறுக்கப்படுதல்/துண்டிக்கப்படுதல்’ என்ற வம்ச உருவகத்தைத் தக்கவைக்கிறது; தமிழில் ‘அறுப்புண்டுபோதல்’ அந்த வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִישׁ מוֹשֵׁל
  choice: ஆளும் ஒரு மனிதன்
  rationale: אִישׁ ஆண்பால் ஒருமையையும், מוֹשֵׁל ஆட்சி செய்பவரைக் குறிக்கும் செயப்பெயர் வடிவத்தையும் பிரதிபலிக்கிறது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலை
  rationale: משל உடன் வரும் בְּ ஆளுகைக்கு உட்பட்ட மக்களைக் குறிக்கிறது; தமிழில் ‘இஸ்ரவேலை ஆளும்’ என்பது இயல்பான ஆட்சித் தொடர்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: வம்ச ஆட்சியைப் பற்றிய வாக்குறுதியின் சொல்வடிவம்
  choice: ‘இஸ்ரவேலை ஆளும் ஒரு மனிதன் உன்னிடமிருந்து அறுப்புண்டுபோக மாட்டான்’
  alternative: ‘இஸ்ரவேலை ஆள உனக்கு ஒரு மனிதன் இல்லாமல் போக மாட்டான்’
  rationale: முதன்மை வாசகம் எபிரெயத்தின் ‘அறுக்கப்படுதல்’ என்ற வம்சத் தொடர்ச்சி உருவகத்தையும் அதன் சிறு தெளிவின்மையையும் காக்கிறது. மாற்று வாசகம் கருத்தை இயல்பான தமிழில் விளக்கினாலும், மூல உருவகத்தை வெளிப்படையாகத் தீர்த்துவிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியக்கூடிய, மதிப்புமிக்க நடையில் அமைக்கப்பட்டுள்ளது. ‘அரசாட்சியின் அரியணை,’ ‘உடன்படிக்கை,’ ‘அறுப்புண்டுபோதல்’ ஆகியவை மூலத்தின் அரசவம்ச மற்றும் உடன்படிக்கைச் சொற்படிமங்களைத் தக்கவைக்கின்றன.
