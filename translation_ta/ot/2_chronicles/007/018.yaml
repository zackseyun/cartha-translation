revisions:
- from: அப்போது நான் உன் அரசாட்சியின் அரியணையை நிலைநிறுத்துவேன். உன் தந்தையாகிய தாவீதுடன் நான் உடன்படிக்கை செய்தபோது, ‘இஸ்ரவேலை ஆளும் ஒரு மனிதன் உன்னிடமிருந்து அறுப்புண்டுபோக மாட்டான்[a]’ என்று சொன்னபடியே செய்வேன்.
  to: அப்போது நான் உன் அரசாட்சியின் அரியணையை நிலைநிறுத்துவேன்; உன் தந்தையாகிய தாவீதுடன் நான் உடன்படிக்கை செய்து, ‘இஸ்ரவேலை ஆளும் ஒருவன் உன்னிடமிருந்து துண்டிக்கப்பட மாட்டான்’ என்று கூறியபடியே.
  rationale: The revision removes the added future verb, restores the source’s covenant-comparison syntax, and replaces an awkward passive expression with natural modern Tamil that still preserves the Hebrew “cut off” imagery. The footnote retains the more idiomatic interpretation of the dynastic promise.
