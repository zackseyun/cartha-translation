revisions:
- from: சாலொமோன் வேண்டுதல் செய்து முடித்தபோது, நெருப்பு வானத்திலிருந்து இறங்கி வந்து, தகனபலியையும் மற்ற பலிகளையும் எரித்து உண்டது. யாவேயின் மகிமை அந்த வீட்டை[a] நிரப்பியது.
  to: சாலொமோன் வேண்டுதல் செய்து முடித்தபோது, நெருப்பு வானத்திலிருந்து இறங்கி வந்து, தகனபலியையும் பலிகளையும் சுட்டெரித்தது; யாவேயின் மகிமை வீட்டை[a] நிரப்பியது.
