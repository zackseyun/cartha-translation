source:
  edition: WLC
  text: וּ/כְ/כַלּ֤וֹת שְׁלֹמֹה֙ לְ/הִתְפַּלֵּ֔ל וְ/הָ/אֵ֗שׁ יָֽרְדָה֙ מֵֽ/הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל הָ/עֹלָ֖ה וְ/הַ/זְּבָחִ֑ים וּ/כְב֥וֹד יְהוָ֖ה מָלֵ֥א אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
translation:
  language: ta
  text: சாலொமோன் வேண்டுதல் செய்து முடித்தபோது, நெருப்பு வானத்திலிருந்து இறங்கி வந்து, தகனபலியையும் பலிகளையும் சுட்டெரித்தது; யாவேயின் மகிமை வீட்டை[a] நிரப்பியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, ஆலயம்; எபிரெயத்தில் ‘வீடு.’
    reason: cultural_note
lexical_decisions:
- source_word: וּכְכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל
  choice: சாலொமோன் வேண்டுதல் செய்து முடித்தபோது
  rationale: כְּ + infinitive construct காலத் தொடர்பைக் குறிக்கிறது. ‘முடித்தபோது’ என்பது நிகழ்வுகளின் வரிசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; உடனடித்தன்மையை தேவையின்றி மிகைப்படுத்துவதில்லை.
- source_word: וְהָאֵשׁ
  choice: நெருப்பு
  rationale: எபிரெயத்தில் குறிப்பிட்ட நெருப்பைக் குறிக்கும் சுட்டுத்தன்மை இருந்தாலும், தமிழில் இங்கு ‘நெருப்பு’ என்றே சொல்வது இயல்பானது; அடுத்துள்ள ‘வானத்திலிருந்து’ என்ற சொற்றொடர் அதன் தெய்வீகத் தோற்றத்தைத் தெளிவாக்குகிறது.
- source_word: יָרְדָה מֵהַשָּׁמַיִם
  choice: வானத்திலிருந்து இறங்கி வந்து
  rationale: செங்குத்தான இறக்கத்தையும் அது வானத்திலிருந்து வந்ததையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וַתֹּאכַל
  choice: எரித்து உண்டது
  rationale: வினைச்சொல்லின் அடிப்படைப் படிமம் ‘உண்டது’ என்பதாகும். நெருப்பு எழுவாயாக இருப்பதால் ‘எரித்து உண்டது’ என்பது அந்த எபிரெயப் படிமத்தையும் தமிழில் தெளிவான பொருளையும் சேர்த்துக் காக்கிறது.
- source_word: הָעֹלָה
  choice: தகனபலி
  rationale: עלה என்பது பலியிடப்பட்ட பொருள் முழுவதும் எரிக்கப்படும் குறிப்பிட்ட பலிவகையைக் குறிக்கும் வழக்கமான பலியியல் சொல்.
- source_word: וְהַזְּבָחִים
  choice: மற்ற பலிகள்
  rationale: זבחים என்பது தகனபலியிலிருந்து வேறுபட்ட, பொதுவான பலிகளைக் குறிக்கிறது. ‘மற்ற’ என்பது அந்த வேறுபாட்டைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וּכְבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: כבוד இங்கு வெளிப்படும் தெய்வீக மகிமையைக் குறிக்கிறது. יהוה என்ற தனிப்பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: מָלֵא אֶת־הַבָּיִת
  choice: அந்த வீட்டை நிரப்பியது
  rationale: בית என்பதன் நேரடிப் பொருள் ‘வீடு.’ சூழலில் அது ஆலயத்தைக் குறித்தாலும், மூலத்தின் சொல் உருவத்தை முதன்மை உரையில் காத்து, பொருளை அடிக்குறிப்பில் தெளிவாக்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயர் நேரடியாக உள்ளது. ‘யாவே’ என்பது அதை ஒரு பட்டப்பெயரால் மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பின் அடிப்படையில் தமிழில் ஒலிபெயர்க்கிறது.
- issue: הַבָּיִת என்பதன் குறிப்பு
  choice: அந்த வீடு
  alternative: ஆலயம்
  rationale: மூலம் ‘வீடு’ என்கிறது; நாளாகமச் சூழலில் அது ஆலயத்தைக் குறிக்கிறது. முதன்மை உரை மூலச் சொல்லைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் சூழற்பொருளை விளக்குகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியக்கூடிய, அதேவேளை வழிபாட்டு நிகழ்வின் கண்ணியத்தைத் தக்கவைக்கும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அக்கினி’ என்பதற்குப் பதில் இயல்பான ‘நெருப்பு’ தேர்ந்தெடுக்கப்பட்டது; பலியியல் துல்லியத்திற்காக ‘தகனபலி’ தக்கவைக்கப்பட்டது.
