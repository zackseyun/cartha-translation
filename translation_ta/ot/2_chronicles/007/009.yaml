base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
translation:
  language: ta
  text: எட்டாம் நாளில் அவர்கள் ஒரு நிறைவுத் திருக்கூட்டத்தைக்[a] நடத்தினார்கள். ஏனெனில், அவர்கள் பலிபீட அர்ப்பணிப்பை[b] ஏழு நாட்களும் பண்டிகையை ஏழு நாட்களும் கொண்டாடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருக்கூட்டம்,” “சிறப்புத் திருக்கூட்டம்.” எபிரெயச் சொல் புனிதப் பண்டிகைச் சூழலில் நடைபெறும் சிறப்பான நிறைவுக் கூடுகையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “நடத்தினார்கள்” அல்லது, நேரடியாக, “செய்தார்கள்.” எபிரெய வினைச்சொல் பலிபீட அர்ப்பணிப்பை நடத்தினர்/கொண்டாடினர் என்ற பொருளில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: எட்டாம் நாளில்
  rationale: எபிரெய உரையில் உள்ள காலக் குறிப்பை, சூழலிலிருந்து கூடுதல் சொற்களைச் சேர்க்காமல் இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: עֲצָרֶת
  choice: சிறப்புத் திருக்கூட்டம்
  rationale: புனிதப் பண்டிகைச் சூழலில் நடைபெறும் சிறப்பான, பொதுவாக நிறைவுக் கூட்டத்தைக் குறிக்கிறது. வெறும் ‘கூட்டம்’ என்பதைவிட சமயச் சூழலைத் தெளிவாகக் காக்கிறது; ‘நிறைவுக் கூட்டம்’ என்ற பொருள்வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: எட்டாம் நாளின் கூட்டத்துக்கான விளக்கத்தை அல்லது காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: பலிபீடத்தின் அர்ப்பணிப்பு விழா
  rationale: பலிபீடத்தை வழிபாட்டுப் பயன்பாட்டிற்காகத் தொடங்கி அர்ப்பணிக்கும் சடங்கு நிகழ்வைத் தெளிவாகக் குறிக்கிறது.
- source_word: עָשׂוּ
  choice: கொண்டாடினார்கள்
  rationale: சொல்லுக்கு நேரடியாக ‘செய்தார்கள்’ என்றாலும், அர்ப்பணிப்பு விழாவையும் பண்டிகையையும் அனுசரித்ததைக் குறிக்கும் இச்சூழலில் ‘கொண்டாடினார்கள்’ இயல்பாக உள்ளது. நேரடி சொல்லாக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהֶחָג
  choice: பண்டிகையை
  rationale: குறிப்பிட்ட சமய விழாவைக் குறிக்கும் எபிரெயச் சொல்லையும் அதன் திட்டவட்ட நிலையையும் இயல்பான தமிழில் தருகிறது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்களும்
  rationale: இரு நிகழ்வுகளின் காலநீட்சி தலா ஏழு நாட்கள் என்பதைத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
