  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָֽזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבֹתֵי/הֶ֗ם אֲשֶׁ֣ר הוֹצִיאָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨יקוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּשְׁתַּחֲו֥וּ לָ/הֶ֖ם וַ/יַּֽעַבְד֑וּ/ם עַל כֵּן֙ הֵבִ֣יא עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
translation:
  language: ta
  text: அப்போது அவர்கள், “அவர்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்த தங்கள் முன்னோர்களின் கடவுளாகிய யாவேவை அவர்கள் கைவிட்டு, வேறு தெய்வங்களைப் பற்றிக்கொண்டு[a], அவற்றின் முன் பணிந்து, அவற்றைச் சேவித்தார்கள்; அதனால்தான் அவர் இந்த எல்லாப் பேரழிவையும் அவர்கள்மேல் வரச்செய்தார்” என்று சொல்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பற்றிக்கொண்டு” என்பதற்கு “உறுதியாகப் பிடித்துக்கொண்டு” அல்லது “ஒட்டிக்கொண்டு” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை சொற்படியாக ‘பிடித்துக்கொள்’ என்று பொருள்பட்டு, வேறு தெய்வங்களுடன் வேண்டுமென்றே ஏற்படுத்திக்கொண்ட உறுதியான பற்றை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: அப்போது அவர்கள் … என்று சொல்வார்கள்
  rationale: முந்தைய வசனத்தின் எதிர்கால முன்னறிவிப்பைத் தொடர்ந்து வரும் கூற்றாக இருப்பதால் எதிர்கால வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது; இணைப்பும் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: עַל אֲשֶׁר
  choice: … கைவிட்டு … அதனால்தான்
  rationale: எபிரெயச் சொற்றொடர் அழிவுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணம்–விளைவு உறவு தெளிவாகத் தொடரும்படி அமைக்கப்பட்டுள்ளது.
- source_word: עָזְבוּ
  choice: கைவிட்டு
  rationale: சாதாரணமாக இடத்தைவிட்டு நீங்குதல் அல்ல, கடவுளுடனான உறவைத் தெரிந்தே துறத்தல் என்ற கடுமையான பொருளை இது தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய மூலத்தில் உள்ள கடவுளின் தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: தங்கள் முன்னோர்களின் கடவுள்
  rationale: உடன்படிக்கைத் தொடர்ச்சியை உணர்த்தும் உறவுமுறை தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்கப்பட்டுள்ளது.
- source_word: הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  choice: தங்களை எகிப்து நாட்டிலிருந்து வெளியே கொண்டுவந்தவர்
  rationale: எகிப்திலிருந்து விடுவித்த வரலாற்றுச் செயலைக் குறிக்கும் வழக்கமான எபிரெயச் சொல்லமைப்பை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களைப் பற்றிக்கொண்டு
  rationale: חזק என்ற வினையின் ‘உறுதியாகப் பிடித்துக்கொள்’ என்னும் உருவகத்தையும், வேறு தெய்வங்களுடன் வேண்டுமென்றே இணைந்துகொண்டதையும் காக்கிறது.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: அவற்றுக்கு முன்பாகப் பணிந்து
  rationale: உடலைத் தாழ்த்திப் பணியும் செயலைக் காக்கிறது; அடுத்துவரும் ‘பணிசெய்தார்கள்’ என்பதோடு ஒன்றாக்கப்படவில்லை.
- source_word: וַיַּעַבְדוּם
  choice: அவற்றுக்குப் பணிசெய்தார்கள்
  rationale: தெய்வங்களுக்கு ஆற்றும் வழிபாட்டுச் சேவையைக் குறிக்கிறது; முந்தைய பணிதல் செயலில் இருந்து சொற்பொருள் வேறுபாட்டைப் பேணுகிறது.
- source_word: עַל כֵּן
  choice: அதனால்தான்
  rationale: மக்களின் துரோகத்துக்கும் தீர்ப்பாக வந்த அழிவுக்கும் இடையிலான விளைவு உறவை இயல்பான நவீன தமிழில் வலியுறுத்துகிறது.
- source_word: הֵבִיא עֲלֵיהֶם
  choice: அவர்கள்மேல் வரச்செய்தார்
  rationale: ஒரு பேரழிவை அவர்கள்மீது கடவுள் கொண்டுவந்தார் என்ற causative பொருளைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: இந்தப் பேரழிவு அனைத்தையும்
  rationale: רָעָה இங்கு ஒழுக்கத் தீமையை அல்ல, அழிவையும் தண்டனைத் துயரையும் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் கடவுளின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பேணுகிறது.
- issue: רָעָה என்பதன் பொருள்
  choice: பேரழிவு
  alternative: தீமை
  rationale: இச்சூழலில் இந்தச் சொல் ஒழுக்கரீதியான தீமையை அல்ல, தீர்ப்பாக வந்த துன்பகரமான அழிவைக் குறிக்கிறது; கடவுள் ஒழுக்கத் தீமையைச் செய்தார் என்ற தவறான கருத்தைத் தவிர்க்காமல், மூலச் சூழலின் பேரிடர் பொருளையே தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘பணிந்து’ மற்றும் ‘பணிசெய்தார்கள்’ என்பவை மூலத்தில் உள்ள இரு தனித்த வழிபாட்டுச் செயல்களைப் பேணுகின்றன; ‘யாவே’ என்பது இறைப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
