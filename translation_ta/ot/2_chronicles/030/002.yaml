  text: Then the king and his officials and all the assembly in Jerusalem decided to keep the Passover in the second month[a].
translation:
  language: ta
  text: அப்போது அரசரும் அவருடைய அதிகாரிகளும் எருசலேமிலிருந்த மக்கள் கூட்டம் முழுவதும் ஆலோசித்து, இரண்டாம் மாதத்தில் பஸ்காவைக் கடைப்பிடிக்க முடிவு செய்தனர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: ஆலோசித்து முடிவுசெய்தனர்
  rationale: יעץ என்பதன் நிஃபால் வடிவம் இங்கு கூட்டாக ஆலோசித்து ஒரு தீர்மானத்துக்கு வந்ததைக் குறிக்கிறது. ‘முடிவுசெய்தனர்’ என்பது விளைவைத் தெளிவுபடுத்துகிறது; ‘ஆலோசித்து’ என்பது எபிரெயச் சொல்லிலுள்ள கலந்தாலோசனையின் நிழற்பொருளையும் காக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசர்
  rationale: சூழலில் எசேக்கியாவைக் குறித்தாலும், எபிரெய உரை பெயரை அல்ல, பதவிப்பெயரையே பயன்படுத்துவதால் அதையே மொழிபெயர்க்கிறது.
- source_word: וְשָׂרָיו
  choice: அவருடைய அதிகாரிகளும்
  rationale: שׂרים என்பது ஆட்சித் தலைவர்களையோ உயர் அதிகாரிகளையோ குறிக்கிறது. ‘அதிகாரிகள்’ என்பது இன்றைய தமிழில் தெளிவாகவும் நிர்வாகச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: וְכָל הַקָּהָל
  choice: மக்கள் சபை முழுவதும்
  rationale: קהל என்பது கூடிவந்த சமூகத்தைக் குறிக்கிறது. ‘மக்கள் சபை’ அதன் பொதுமக்கள் சார்ந்த கூட்டுப் பொருளைக் காக்கிறது; ‘முழுவதும்’ כָּל என்பதைக் காட்டுகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமிலிருந்த
  rationale: எருசலேமில் இருந்த மக்கள் சபை என்ற இடப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: பஸ்காவைக் கடைப்பிடிக்க
  rationale: நேரடியாக ‘பஸ்காவைச் செய்ய’ என்றாலும், இது பஸ்கா அனுசரிப்பை நிறைவேற்றுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘கடைப்பிடிக்க’ என்பது அதன் சடங்கு மற்றும் உடன்படிக்கை சார்ந்த கருத்தை இயல்பாகத் தருகிறது.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதத்தில்
  rationale: காலத்தைக் குறிக்கும் சொற்றொடரின் நேரடியான மொழிபெயர்ப்பு; வழக்கமாக பஸ்கா முதல் மாதத்தில் நிகழ்ந்தது என்ற சூழல் விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை.
theological_decisions:
- issue: பஸ்கா அனுசரிப்பைக் குறிக்கும் எபிரெய மரபுத்தொடரை விளக்கவுரை சேர்க்காமல் மொழிபெயர்த்தல்
  choice: பஸ்காவைக் கடைப்பிடிக்க
  alternative: பஸ்காவைக் கொண்டாட / பஸ்காவை அனுசரிக்க / பஸ்காவைச் செய்ய
  rationale: ‘கடைப்பிடிக்க’ என்பது எபிரெய மரபுத்தொடரின் நடைமுறை அனுசரிப்பு மற்றும் உடன்படிக்கை சார்ந்த விழாப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; ‘செய்ய’ என்ற நேரடி வடிவத்தின் அசாதாரணத்தையும் அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள் சபை’ என்பது கிறிஸ்தவத் திருச்சபை என்ற பிற்காலப் பொருளைத் தவிர்த்து, எருசலேமில் கூடியிருந்த சமூகத்தைக் குறிக்கிறது. வசனத்தின் கூட்டு ஆலோசனையும் அதனால் ஏற்பட்ட தீர்மானமும் ‘ஆலோசித்து முடிவுசெய்தனர்’ என்று வெளிப்படுத்தப்பட்டுள்ளன.
