  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியக்கூடிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்தம்’ மற்றும் ‘தூய்மை’ வேறுபடுத்தப்பட்டுள்ளன; தேவையற்ற தொழில்நுட்பச் சொற்கள் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளன.
