  text: כִּי רַבַּ֥ת בַּ/קָּהָ֖ל אֲשֶׁ֣ר לֹא הִתְקַדָּ֑שׁוּ וְ/הַ/לְוִיִּ֞ם עַל שְׁחִיטַ֣ת הַ/פְּסָחִ֗ים לְ/כֹל֙ לֹ֣א טָה֔וֹר לְ/הַקְדִּ֖ישׁ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
translation:
  language: ta
  text: ஏனெனில், சபையில் இருந்த பலர் தங்களைப் பரிசுத்தப்படுத்திக்கொள்ளவில்லை[a]; யாவேக்கெனப் பரிசுத்தப்படுத்துவதற்காக[c], தூய்மையில்லாத ஒவ்வொருவருக்காகவும் பஸ்கா பலிகளை[b] அறுக்கும் பொறுப்பை லேவியர்கள் ஏற்றிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்களை அர்ப்பணிக்கவில்லை.” இங்கு எபிரேயம் பரிசுத்தப்படுத்துதலைக் குறிக்கும் சொல்லைப் பயன்படுத்துகிறது; உடனடிச் சூழல் சடங்குமுறைத் தூய்மையைப் பற்றியது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “பஸ்காக்களை”; அதாவது, பஸ்கா பலிவிலங்குகளை.
    reason: lexical_alternative
  - marker: c
    text: எபிரேயில் எது பரிசுத்தமாக அர்ப்பணிக்கப்படுகிறது என்பது வெளிப்படையாகக் கூறப்படவில்லை. அருகிலுள்ள பஸ்கா பலிகளைக் குறிப்பதாகப் புரிந்துகொள்வது இயல்பு; மக்களைக் குறிப்பதாகவும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: ambiguity
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  choice: சபையில் பலர்
  rationale: கூடி வழிபட்ட சமூகத்தினுள் பெரும் எண்ணிக்கையினரைக் குறிக்கிறது; ‘சபை’ என்பது קָהָל என்பதற்குத் தெளிவான, இயல்பான நவீனத் தமிழ்.
- source_word: הִתְקַדָּשׁוּ
  choice: தங்களைப் பரிசுத்தப்படுத்திக்கொள்ளவில்லை
  rationale: קדשׁ வேரின் வழிபாட்டு மற்றும் பரிசுத்தத்துக்குரிய பொருளைப் பேணுகிறது; உடனடிச் சூழலில் சடங்குமுறைத் தூய்மை தொடர்புடையதாக இருந்தாலும், இதை வெறும் ‘தூய்மைப்படுத்திக்கொள்ளுதல்’ என்று குறுக்கவில்லை.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: இஸ்ரவேலின் வழிபாட்டுப் பணிக்குரிய குழுவின் வழக்கமான தமிழ்ப் பெயர்.
- source_word: עַל שְׁחִיטַת
  choice: வெட்டும் பொறுப்பை ... ஏற்றிருந்தார்கள்
  rationale: இங்கு עַל பொறுப்பு அல்லது மேற்பார்வையைக் குறிக்கிறது; சடங்குமுறைப் பலியிடுதலைக் குறிக்கும் שְׁחִיטָה என்பதற்கு ‘வெட்டுதல்’ இயல்பான தமிழ்.
- source_word: הַפְּסָחִים
  choice: பஸ்காப் பலிகளை
  rationale: சொல்லுக்கு சொல் ‘பஸ்காக்கள்’ என்ற பன்மை வந்தாலும், சூழலில் பஸ்காவுக்காகப் பலியிடப்பட்ட விலங்குகளைக் குறிக்கிறது. எபிரேயில் ‘ஆட்டுக்குட்டிகள்’ என்று குறிப்பாக இல்லாததால் அந்தச் சுருக்கம் சேர்க்கப்படவில்லை.
- source_word: לְכֹל לֹא טָהוֹר
  choice: தூய்மையில்லாத ஒவ்வொருவருக்காகவும்
  rationale: வழிபாட்டுச் சூழலில் טָהוֹר சடங்குமுறைத் தூய்மையைக் குறிக்கிறது; முதன்மை உரையில் இயல்பான மொழியைப் பயன்படுத்தி, அதன் சடங்குமுறைப் பொருளை அடிக்குறிப்பில் தெளிவாக்குகிறது.
- source_word: לְהַקְדִּישׁ לַיהוָה
  choice: யாவேக்குப் பரிசுத்தமாக அர்ப்பணிப்பதற்காக
  rationale: קדשׁ வேரின் பரிசுத்த அர்ப்பணிப்பு சார்ந்த பொருளைப் பேணுகிறது. எபிரேயில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால், முதன்மை உரையிலும் அதைச் சேர்க்காமல் உண்மையான இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: பஸ்கா சூழலில் קדשׁ என்பதன் வழிபாட்டு-பரிசுத்தப் பொருள்
  choice: ‘பரிசுத்தப்படுத்திக்கொள்ளுதல்’ மற்றும் ‘பரிசுத்தமாக அர்ப்பணித்தல்’ என்ற மொழியைப் பயன்படுத்துதல்
  alternative: இரண்டு இடங்களையும் ‘சடங்குமுறைப்படி தூய்மைப்படுத்துதல்’ என்று மொழிபெயர்த்தல்
  rationale: சடங்குமுறைத் தூய்மை உடனடிச் சூழலாக இருந்தாலும், קדשׁ என்பது தூய்மையை மட்டும் அல்லாமல் பரிசுத்த ஒதுக்கீடு மற்றும் அர்ப்பணிப்பையும் சுமக்கிறது.
- issue: לְהַקְדִּישׁ என்பதன் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள்
  choice: முதன்மை உரையில் செயப்படுபொருளைச் சேர்க்காமல் விடுதல்
  alternative: ‘அவற்றை’ என்று சேர்த்து, பஸ்காப் பலிகளையே செயப்படுபொருளாகத் தெளிவுபடுத்துதல்
  rationale: எபிரேயில் செயப்படுபொருள் இல்லை. அருகிலுள்ள பஸ்காப் பலிகளே இயல்பான தொடர்பாகத் தோன்றினாலும், மக்களைக் குறிக்கும் வாசிப்பை இலக்கணம் முற்றிலும் வெளிப்படையாக நீக்கவில்லை; ஆகவே தெளிவின்மை பாதுகாக்கப்படுகிறது.
- issue: தூய்மை மற்றும் பரிசுத்தம் ஆகியவற்றின் வேறுபாடு
  choice: טָהוֹר என்பதற்கு ‘தூய்மை’, קדשׁ என்பதற்கு ‘பரிசுத்தம்’ சார்ந்த சொற்கள்
  alternative: இரண்டையும் ஒரே தமிழ்ச் சொல்லால் மொழிபெயர்த்தல்
  rationale: எபிரேய உரையில் உள்ள வழிபாட்டுத் தூய்மை மற்றும் பரிசுத்த ஒதுக்கீடு ஆகிய கருத்துகளின் வேறுபாட்டை இது பேணுகிறது.
