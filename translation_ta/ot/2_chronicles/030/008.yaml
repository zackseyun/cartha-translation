base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
translation:
  language: ta
  text: இப்போது, உங்கள் முன்னோர்களைப் போல உங்கள் கழுத்தை விறைப்பாக்காதீர்கள். யாவேக்கு உங்கள் கையைக் கொடுங்கள்[a]; அவர் என்றென்றும் பரிசுத்தமாக ஒதுக்கியுள்ள தமது பரிசுத்த இடத்துக்கு வந்து, உங்கள் கடவுளாகிய யாவேக்குப் பணியாற்றுங்கள். அப்போது அவரது கொழுந்துவிட்டெரியும் கோபம் உங்களைவிட்டு விலகக்கூடும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “யாவேக்குக் கீழ்ப்படியுங்கள்” அல்லது “உங்களை யாவேக்கு ஒப்புக்கொடுங்கள்.” எபிரெய மொழியில், “யாவேக்கு உங்கள் கையைக் கொடுங்கள்” என்று சொல்லப்பட்டுள்ளது; இது கீழ்ப்படிதல் அல்லது விசுவாச உறுதி அளித்தலைக் குறிக்கும் மொழிமரபாகும்.
    reason: lexical_alternative
  - marker: b
    text: “அவரது கொழுந்துவிட்டெரியும் கோபம் உங்களைவிட்டு விலகும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: மூல எபிரெய உரையில் வெளிப்படையாக உள்ள காலக் குறிப்பு; ஆகவே அதைத் தமிழில் விடாமல் மொழிபெயர்க்கப்படுகிறது.
- source_word: תַּקְשׁוּ עָרְפְּכֶם
  choice: உங்கள் கழுத்தை விறைப்பாக்காதீர்கள்
  rationale: பிடிவாதமான எதிர்ப்பைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: כַּאֲבוֹתֵיכֶם
  choice: உங்கள் முன்னோர்களைப் போல
  rationale: இங்கு முந்தைய தலைமுறையினரைச் சுட்டுவதால், பாலினத்தைத் தேவையின்றிக் குறுக்காமல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: תְּנוּ יָד לַיהוָה
  choice: யாவேக்கு உங்கள் கையைக் கொடுங்கள்
  rationale: கீழ்ப்படிதல் அல்லது தன்னை ஒப்புக்கொடுத்தலைக் குறிக்கும் மூல உருவகத்தை பிரதான உரையில் பாதுகாக்கிறது; அதன் கருத்து அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לַיהוָה / יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப் பெயரை பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: מִקְדָּשׁוֹ
  choice: அவரது பரிசுத்த இடம்
  rationale: מִקְדָּשׁ என்பதன் பரந்த பொருளைத் தக்கவைத்து, கட்டடத்தை மட்டும் குறிக்கும் வகையில் தேவையின்றி சுருக்குவதில்லை.
- source_word: הִקְדִּישׁ לְעוֹלָם
  choice: என்றென்றைக்கும் பரிசுத்தமாக்கியுள்ளார்
  rationale: அதைத் தனக்கெனப் பரிசுத்தமாக ஒதுக்கிய செயலும் לְעוֹלָם என்பதன் நீடித்த காலப் பொருளும் வெளிப்படுகின்றன.
- source_word: וְעִבְדוּ
  choice: பணியாற்றுங்கள்
  rationale: தேவனுக்குச் செய்யும் வழிபாடு உட்பட்ட முழுமையான சேவையை குறுகலாக்காமல் עבד என்பதன் நேரடிப் பொருளைத் தருகிறது.
- source_word: חֲרוֹן אַפּוֹ
  choice: அவரது கொழுந்துவிட்டெரியும் கோபம்
  rationale: கடும் சினத்தைக் குறிக்கும் வெப்ப உருவகத்தைத் தமிழில் இயல்பாகவும் வலிமையாகவும் பாதுகாக்கிறது.
- source_word: וְיָשֹׁב מִכֶּם
  choice: உங்களைவிட்டு விலகக்கூடும்
  rationale: கட்டளைகளுக்குப் பின்வரும் விரும்பப்படும் அல்லது எதிர்பார்க்கப்படும் விளைவைத் தருகிறது; நிபந்தனையற்ற இயந்திர உத்தரவாதமாக மாற்றுவதில்லை.
