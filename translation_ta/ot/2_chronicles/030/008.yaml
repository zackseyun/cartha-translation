translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தில் உள்ள עַתָּה வெளிப்படையாக “இப்போது” என மொழிபெயர்க்கப்பட்டது. எபிரெய உருவகங்களான கழுத்தை விறைப்பாக்குதல், கையைக் கொடுத்தல், எரியும் கோபம் ஆகியவை முடிந்தவரை பாதுகாக்கப்பட்டுள்ளன; தெளிவிற்காக அடிக்குறிப்புகள் சேர்க்கப்பட்டுள்ளன.
