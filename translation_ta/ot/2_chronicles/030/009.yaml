  text: כִּ֣י בְ/שׁוּבְ/כֶ֞ם עַל יְהוָ֗ה אֲחֵי/כֶ֨ם וּ/בְנֵי/כֶ֤ם לְ/רַחֲמִים֙ לִ/פְנֵ֣י שֽׁוֹבֵי/הֶ֔ם וְ/לָ/שׁ֖וּב לָ/אָ֣רֶץ הַ/זֹּ֑את כִּֽי חַנּ֤וּן וְ/רַחוּם֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/לֹא יָסִ֤יר פָּנִים֙ מִ/כֶּ֔ם אִם תָּשׁ֖וּבוּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
translation:
  language: ta
  text: நீங்கள் யாவேவிடம் திரும்பினால், உங்கள் சகோதரர்களும் உங்கள் மகன்களும் தங்களைச் சிறைப்பிடித்தவர்களிடத்தில் இரக்கம் பெறுவார்கள்; இந்த நாட்டிற்குத் திரும்பிவருவார்கள். ஏனெனில் உங்கள் கடவுளாகிய யாவே அருளும் இரக்கமும் உள்ளவர்; நீங்கள் அவரிடம் திரும்பினால், அவர் தமது முகத்தை உங்களிடமிருந்து திருப்பிக்கொள்ளமாட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “அவர் தமது முகத்தை உங்களிடமிருந்து அகற்றமாட்டார்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּבְכֶם עַל יְהוָה
  choice: நீங்கள் யாவேவிடம் திரும்பினால்
  rationale: שׁוּב என்பதன் திரும்புதல், உடன்படிக்கை உறவுக்குத் திரும்புதல் ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  choice: உங்கள் சகோதரர்களும் உங்கள் மகன்களும்
  rationale: மூலத்தின் ஆண்பால் உறவுமுறைச் சொற்களைத் துல்லியமாகத் தக்கவைக்கிறது.
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  choice: தங்களைச் சிறைப்பிடித்தவர்களிடத்தில் இரக்கம் பெறுவார்கள்
  rationale: சிறைப்பிடித்தவர்களின் முன்னிலையில் இரக்கத்திற்குரியவர்களாவார்கள் என்ற எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלָשׁוּב לָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டிற்குத் திரும்பிவருவார்கள்
  rationale: இரக்கம் பெறுவதன் விளைவாக அவர்கள் நாட்டிற்குத் திரும்புவதைத் தெளிவாகவும், செயற்படுத்துபவர் யார் என்பதைச் சேர்க்காமலும் கூறுகிறது.
- source_word: חַנּוּן וְרַחוּם
  choice: அருளும் இரக்கமும் உள்ளவர்
  rationale: தெய்வீக அருளையும் ஆழ்ந்த இரக்கத்தையும் குறிக்கும் இணைச்சொற்களின் வேறுபாட்டைக் காக்கிறது.
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  choice: தமது முகத்தை உங்களிடமிருந்து திருப்பிக்கொள்ளமாட்டார்
  rationale: முகம் என்ற மூல உருவகத்தையும் உறவுசார் பொருளையும் பாதுகாக்கிறது.
- source_word: אִם תָּשׁוּבוּ אֵלָיו
  choice: நீங்கள் அவரிடம் திரும்பினால்
  rationale: வசனத்தின் தொடக்கத்தில் வந்த שׁוּב என்ற வேர்ச்சொல்லின் மீளுரைப்பையும் மனந்திரும்பி உறவுக்குத் திரும்பும் கருத்தையும் காக்கிறது.
theological_decisions:
- issue: שׁוּב என்பதிலுள்ள மனந்திரும்புதல் சார்ந்த மொழி
  choice: யாவேவிடம் திரும்புதல் / அவரிடம் திரும்புதல்
  alternative: யாவேவின் பக்கம் திரும்புதல்
  rationale: பிற்கால இறையியல் சொல்லாடலைச் சேர்க்காமல், உடன்படிக்கை உறவுக்குத் திரும்பும் மீட்பு நுணுக்கத்தையும் ஒரே எபிரெய வேரின் மீளுரைப்பையும் பாதுகாக்கிறது.
- issue: ஆண்பால் குடும்ப உறவுச் சொற்கள்
  choice: சகோதரர்கள் மற்றும் மகன்கள்
  alternative: சகோதரர்கள் மற்றும் பிள்ளைகள்
  rationale: மூல எபிரெயம் குறிப்பாக ஆண்பால் சொற்களைப் பயன்படுத்துவதால் அவற்றை முதன்மை உரையில் பொதுப்பாலாக்கவில்லை.
- issue: கடவுளின் முகம் பற்றிய உருவகம்
  choice: தமது முகத்தை உங்களிடமிருந்து திருப்பிக்கொள்ளமாட்டார்
  alternative: உங்களைப் புறக்கணிக்கமாட்டார்
  rationale: தெய்வீக ஏற்றுக்கொள்ளுதலைக் குறிக்கும் உறவுசார் உருவகத்தை விளக்கவுரையாகத் தட்டையாக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘யாவே’ எனத் தெய்வீகப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; மூலத்தின் உறவுசார் ‘முகம்’ உருவகமும் ஆண்பால் உறவுமுறைச் சொற்களும் தக்கவைக்கப்பட்டுள்ளன.
