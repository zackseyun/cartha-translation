  source_fidelity: மூல எபிரெயத்தின் மீளும் שׁוּב கருத்து ‘திரும்புதல்’ என இரு இடங்களிலும் ஒத்திசைவாகக் கொடுக்கப்பட்டுள்ளது. ‘உங்கள் சகோதரர்களும் உங்கள் மகன்களும்’, சிறைப்பிடித்தவர்கள் முன்னிலையில் இரக்கம் பெறுதல், இந்த நாட்டிற்குத் திரும்புதல், மற்றும் முகத்தைத் திருப்பிக்கொள்ளாதிருத்தல் ஆகியவை மூலத்தின் பொருளையும் உருவகத்தையும் துல்லியமாகக் காக்கின்றன.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘தங்களைச் சிறைப்பிடித்தவர்களிடத்தில் இரக்கம் பெறுவார்கள்’ என்பது இயல்பானது; சிறையிருப்பிலிருந்து மீளும் சூழலையும் போதிய அளவு வெளிப்படுத்துகிறது.
  terminology: ‘யாவே’ என்பது வழங்கப்பட்ட பெயரியல் கொள்கையோடு ஒத்துள்ளது. ‘சகோதரர்கள்’, ‘மகன்கள்’, ‘அருள்’, ‘இரக்கம்’, ‘முகம்’ ஆகிய சொற்கள் மூலத்தின் குடும்ப, தெய்வீகப் பண்பு, மற்றும் உறவுசார் உருவகங்களைச் சரியாகத் தக்கவைக்கின்றன. அடிக்குறிப்பு முகம் அகற்றப்படுதல் என்ற சொல்லடிப்படையான மாற்றைச் சரியாகக் குறிக்கிறது.
