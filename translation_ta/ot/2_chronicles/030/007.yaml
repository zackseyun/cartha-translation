revisions:
- from: உங்கள் தந்தையரைப் போலவும் உங்கள் சகோதரரைப் போலவும் இருக்காதீர்கள். அவர்கள் தங்கள் தந்தையரின் கடவுளாகிய யாவேக்கு உண்மையற்றவர்களாய் நடந்தார்கள்; அவர் அவர்களைப் பாழாக்கினார்[a]. இதை நீங்களே காண்கிறீர்கள்.
  to: யாவேக்கு, தங்கள் முன்னோர்களின் கடவுளாகிய அவருக்கு, உண்மையற்றவர்களாய் நடந்த உங்கள் முன்னோர்களையும் உங்கள் சகோதரர்களையும் போல இருக்காதீர்கள். அவர் அவர்களைப் பாழ்நிலைக்கு ஆளாக்கினார்; நீங்கள் காண்கிறபடியே.
  rationale: The revision replaces the verbal “பாழாக்கினார்” with “பாழ்நிலைக்கு ஆளாக்கினார்” to reflect the Hebrew resultative expression “made/gave them into a desolation.” It also makes the shared description of the ancestors and brothers syntactically explicit in Tamil. The lexical-alternative footnote is retained, though no footnote marker is needed in the verse because the primary rendering itself is sufficiently clear and the supplied footnote is optional rather than required by the source text.
