source:
  edition: WLC
  text: וְ/אַל תִּֽהְי֗וּ כַּ/אֲבֽוֹתֵי/כֶם֙ וְ/כַ֣/אֲחֵי/כֶ֔ם אֲשֶׁ֣ר מָעֲל֔וּ בַּ/יהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וַ/יִּתְּנֵ֣/ם לְ/שַׁמָּ֔ה כַּ/אֲשֶׁ֖ר אַתֶּ֥ם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
translation:
  language: ta
  text: யாவேக்கு, தங்கள் முன்னோர்களின் கடவுளாகிய அவருக்கு, உண்மையற்றவர்களாய் நடந்த உங்கள் முன்னோர்களையும் உங்கள் சகோதரர்களையும் போல இருக்காதீர்கள். அவர் அவர்களைப் பாழ்நிலைக்கு ஆளாக்கினார்; நீங்கள் காண்கிறபடியே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  choice: இருக்காதீர்கள்
  rationale: אַל உடன் வரும் imperfect தடைப் பொருளைத் தருகிறது. தொடரும் ஒப்புமைக்கு ஏற்ப, நவீனத் தமிழில் இயல்பான நிலைசார் தடையாக மொழிபெயர்க்கப்பட்டது.
- source_word: כַאֲבוֹתֵיכֶם
  choice: உங்கள் தந்தையரைப் போல
  rationale: אָבוֹת என்பது தந்தையரையும் முற்பிதாக்களையும் குறிக்கலாம். மூலத்தின் குடும்பச் சொல்லாட்சியையும் அடுத்துள்ள ‘சகோதரர்’ என்ற இணைப்பையும் காக்க ‘தந்தையர்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְכַאֲחֵיכֶם
  choice: உங்கள் சகோதரரைப் போலவும்
  rationale: אָח என்பது உடன்பிறந்தோரையோ விரிந்த உறவினரையோ குறிக்கலாம். இங்கு வடக்கத்திய இஸ்ரவேலருடனான உடன்படிக்கைச் சகோதரத்துவத்தை வெளிப்படுத்தும் குடும்ப உருவகம் தக்கவைக்கப்பட்டது.
- source_word: מָעֲלוּ
  choice: உண்மையற்றவர்களாய் நடந்தார்கள்
  rationale: מעל என்பது கடவுளுடனான உடன்படிக்கை உறவில் நம்பிக்கைத் துரோகம் அல்லது உண்மைத்தவறுதலைக் குறிக்கிறது. தொழில்நுட்பச் சொல்லாகாமல் அதன் உறவுசார் வலிமையை இச்சொற்றொடர் தெரிவிக்கிறது.
- source_word: בַּיהוָה
  choice: யாவேக்கு
  rationale: מעל உடன் வரும் בְ எதிராகச் செய்த துரோகத்தையோ ஒருவருக்கு உண்மையற்றிருப்பதையோ குறிக்கிறது. தமிழில் ‘யாவேக்கு உண்மையற்றவர்களாய்’ என்பது இயல்பாக அமைகிறது.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: தங்கள் தந்தையரின் கடவுளாகிய
  rationale: உடன்படிக்கைச் சூத்திரத்தை மூலத்திற்கு நெருக்கமாகக் காத்து, முன்பு வந்த ‘தந்தையர்’ என்பதுடனான எதிரொலியும் பேணப்பட்டது.
- source_word: וַיִּתְּנֵם
  choice: அவர் அவர்களைப் ... ஆக்கினார்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்தார்’ என்றாலும், לְשַׁמָּה உடன் இது ஒரு நிலைக்கு ஆளாக்கியதைத் தெரிவிக்கிறது. தன்மை ஒருமை எழுவாய் கடவுளைக் குறிக்கும் என்பதால் ‘அவர்’ பயன்படுத்தப்பட்டது.
- source_word: לְשַׁמָּה
  choice: பாழாக்கினார்
  rationale: שַׁמָּה அழிவையும், அதைக் காண்போருக்கு உண்டாகும் திகிலூட்டும் காட்சியையும் குறிக்கக்கூடும். முதன்மை உரையில் அழிவு வலியுறுத்தப்பட்டு, மற்ற நுண்பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים
  choice: இதை நீங்களே காண்கிறீர்கள்
  rationale: கண்ணுக்குத் தெரியும் வரலாற்று விளைவை நேரடியாகச் சுட்டுகிறது. வெளிப்படையான ‘நீங்கள்’ காரணமாக தமிழில் ‘நீங்களே’ என்று சிறிது வலியுறுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளாலான உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஒரு பொதுப்பட்டப் பெயரால் மாற்றாமல், தனிப்பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: விசுவாசத் தவறும் தெய்வத் தீர்ப்பும் இடையிலான தொடர்பு
  choice: இரு நிகழ்வுகளையும் தொடர்ச்சியாகக் கூறுதல்
  alternative: ‘அதனால் அவர்...’ என்று வெளிப்படையான காரணவிளைவு இணைப்பைச் சேர்த்தல்
  rationale: எபிரெய உரை waw மூலம் அடுத்த நிகழ்வைத் தொடர்கிறது; நோக்கம் அல்லது காரணவிளைவை மூலத்தைவிட வெளிப்படையாகத் தீர்மானிக்காமல் ‘அவர்’ எனத் தனி வாக்கியத் தொடராக வழங்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘தந்தையர்’, ‘சகோதரர்’ ஆகிய குடும்பச் சொற்கள் மூலத்தின் உடன்படிக்கை ஒற்றுமையைப் பேணுகின்றன. நீளமான எபிரெய வாக்கியம் தமிழில் தெளிவுக்காக மூன்று குறுவாக்கியங்களாகப் பிரிக்கப்பட்டாலும், நிகழ்வுகளின் வரிசை மாற்றப்படவில்லை.
