  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶל יְחִזְקִיָּ֔הוּ וַ/יִּרְפָּ֖א אֶת הָ/עָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/020.yaml
  text: And Yahweh listened to Hezekiah and healed the people[a][b].
translation:
  language: ta
  text: யாவே எசேக்கியாவுக்குச் செவிகொடுத்து[a], மக்களைக் குணமாக்கினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எசேக்கியாவைக் கேட்டார்.” எபிரெய வினைச்சொல் இவ்வமைப்பில் ‘கேட்டார்’ அல்லது ‘செவிகொடுத்துச் சாதகமாகப் பதிலளித்தார்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “குணமாக்கினார்” என்பது உடல் நோயை மட்டுமே குறிக்க வேண்டியதில்லை; மக்களின் முறையற்ற சடங்கு நிலையுடன் தொடர்புடைய துன்பத்தையோ தீர்ப்பையோ யாவே அகற்றியதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: வேண்டுதலுக்குச் செவிகொடுத்து
  rationale: שׁמע உடன் אֶל இங்கு வெறுமனே ஒலியைக் கேட்டதைக் காட்டாமல், முந்தைய வசனங்களில் எசேக்கியா செய்த வேண்டுதலை ஏற்று சாதகமாகப் பதிலளித்ததைக் குறிக்கிறது. இயல்பான தமிழில் அந்தப் பொருளைத் தெளிவாகத் தருகிறது; மூலத்தின் 'கேட்டார்' என்ற சாத்தியத்தைக் குறிப்பில் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இது பட்டப்பெயர் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர். தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் 'யெகோவா' என்ற வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: יְחִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் அறியப்படும் பெயர் வடிவம்.
- source_word: וַיִּרְפָּא
  choice: குணமாக்கினார்
  rationale: רפא என்பதன் நேரடியான உருவகத்தையும் பரந்த பொருள் வாய்ப்பையும் காக்கிறது. சூழலில் இது முறையற்ற சடங்கு நிலையுடன் தொடர்புடைய துன்பம் அல்லது தண்டனையை நீக்கியதையும் குறிக்கலாம்; அதைக் 'மன்னித்தார்' அல்லது 'காப்பாற்றினார்' என்று குறுக்கவில்லை.
- source_word: הָעָם
  choice: மக்களை
  rationale: கூடியிருந்த இஸ்ரவேல் சமூகத்தைக் குறிக்கும் இயல்பான, பரந்த தமிழ்ச் சொல்.
theological_decisions:
- issue: '''மக்களைக் குணமாக்கினார்'' என்பதில் கடவுளுடைய செயலின் இயல்பு'
  choice: மூலத்திலுள்ள குணமாக்கும் மொழியை அப்படியே தக்கவைத்தல்
  alternative: மக்களை மன்னித்தார் / தண்டனையிலிருந்து காப்பாற்றினார் / மீட்டெடுத்தார்
  rationale: முந்தைய சூழல் சடங்குத் தூய்மையின்றிப் பஸ்காவை உண்டவர்களுக்காக எசேக்கியா மன்னிப்பை வேண்டியதைக் கூறுகிறது. இருப்பினும் எபிரெய உரை רפא ('குணமாக்கு') என்பதையே பயன்படுத்துகிறது. அது உடல் நோயை மட்டும் குறிக்கிறதா, துன்பம் அல்லது தீர்ப்பை அகற்றுவதையும் உள்ளடக்குகிறதா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. 'வேண்டுதலுக்குச் செவிகொடுத்து' என்பது சூழலால் தெளிவாக இருக்கும் சாதகமான பதிலை இயல்பாக வெளிப்படுத்துகிறது; அடிக்குறிப்பு மூல வினையின் பரப்பைத் தக்கவைக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
