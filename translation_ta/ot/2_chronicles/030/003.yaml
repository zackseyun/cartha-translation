base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/003.yaml
  text: For they could not do it at that time[a], because the priests had not consecrated themselves sufficiently[b], and the people had not gathered to Jerusalem.
translation:
  language: ta
  text: ஏனெனில், அந்த நேரத்தில்[a] அவர்களால் அதைக் கடைப்பிடிக்க முடியவில்லை. ஆசாரியர்கள் போதுமான அளவுக்குத் தங்களைப் புனிதப்படுத்திக்கொள்ளவில்லை[b]; மக்களும் எருசலேமுக்குக் கூடிவந்திருக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அந்தக் குறிப்பிட்ட காலத்தில்’ அல்லது ‘அப்போது’ என்றும் மொழிபெயர்க்கலாம்; இங்கு பஸ்கா கடைப்பிடிக்கப்பட வேண்டிய நேரம் குறிக்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘போதுமான எண்ணிக்கையிலான ஆசாரியர்கள் தங்களைப் புனிதப்படுத்திக்கொள்ளவில்லை’ என்றும் பொருள் கொள்ளலாம். எபிரெயச் சொற்றொடர், புனிதப்படுத்துதலின் போதிய அளவையோ புனிதப்பட்ட ஆசாரியர்களின் போதிய எண்ணிக்கையையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: அவர்களால் … முடியவில்லை
  rationale: இந்த வினை திறன் அல்லது இயலாமையைக் குறிக்கிறது. தமிழில் ‘அவர்களால் … முடியவில்லை’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לַעֲשֹׂתוֹ
  choice: அதைக் கடைப்பிடிக்க
  rationale: பின்னணியில் பஸ்கா ஆசரிப்பைக் குறிக்கிறது. எபிரெயச் சொற்றொடர் சொற்பட ‘அதைச் செய்ய’ என்றாலும், ஒரு விழாவைக் குறிக்கும் தமிழில் ‘அதைக் கடைப்பிடிக்க’ என்பது இயல்பானது; பொருளையும் மிகையாக விரிவாக்கவில்லை.
- source_word: בָּעֵת הַהִיא
  choice: அந்த நேரத்தில்
  rationale: பஸ்கா கடைப்பிடிக்கப்பட வேண்டிய குறிப்பிட்ட நேரத்தைச் சுட்டுகிறது. ‘அந்த நேரத்தில்’ என்பது மூலத்தின் பொதுவான வடிவத்தைப் பேணுகிறது.
- source_word: הִתְקַדְּשׁוּ
  choice: தங்களைப் புனிதப்படுத்திக்கொள்ளவில்லை
  rationale: ஆசாரியச் சூழலில் சடங்குக்குரிய ஆயத்தம் அல்லது தன்னையே புனிதப்படுத்துதலைக் குறிக்கிறது. இத்தமிழாக்கம் reflexive வடிவத்தையும் வழிபாட்டுச் சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: לְמַדַּי
  choice: போதுமான அளவுக்கு
  rationale: ‘போதிய அளவு/எண்ணிக்கை’ எனும் சுருக்கமான எபிரெய வெளிப்பாட்டை இது பேணுகிறது. முதன்மை உரையில் ஆசாரியர்களின் புனித ஆயத்தத்தின் அளவைக் குறிக்கும் வாசிப்பு தரப்பட்டுள்ளது; எண்ணிக்கை சார்ந்த வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: נֶאֶסְפוּ
  choice: கூடிவந்திருக்கவில்லை
  rationale: மக்கள் ஒன்றுகூடுவதையும் ஓர் இடத்தை நோக்கி வந்து சேர்வதையும் இவ்விடத்தில் குறிக்கிறது. ‘கூடிவந்திருக்கவில்லை’ என்பது தமிழில் இயல்பாகவும் திசை உணர்வுடனும் உள்ளது.
- source_word: לִירוּשָׁלִָם
  choice: எருசலேமுக்கு
  rationale: לְ என்ற முன்னொட்டு இங்கு எருசலேமை நோக்கிய வருகையைச் சுட்டுகிறது. ‘கூடிவருதல்’ என்பதுடன் ‘எருசலேமுக்கு’ என்பது இயல்பான தமிழ்.
theological_decisions:
- issue: לְמַדַּי என்பது புனிதப்படுத்துதலின் போதிய அளவையா அல்லது புனிதப்பட்ட ஆசாரியர்களின் போதிய எண்ணிக்கையையா குறிக்கிறது?
  choice: முதன்மை உரையில் ‘ஆசாரியர்கள் போதுமான அளவுக்குத் தங்களைப் புனிதப்படுத்திக்கொள்ளவில்லை’
  alternative: ‘போதுமான எண்ணிக்கையிலான ஆசாரியர்கள் தங்களைப் புனிதப்படுத்திக்கொள்ளவில்லை’
  rationale: எபிரெயச் சொற்றொடர் இரு வாசிப்புகளுக்கும் இடமளிக்கிறது. இலக்கண ரீதியாக நேரடியான வினையடை வாசிப்பு முதன்மை உரையில் வைக்கப்பட்டு, எண்ணிக்கை சார்ந்த சாத்தியம் அடிக்குறிப்பில் வெளிப்படையாகப் பேணப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க வேதாகம நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கடைப்பிடிக்க’ என்பது பஸ்கா ஆசரிப்பைத் தெளிவுபடுத்துகிறது; ‘புனிதப்படுத்திக்கொள்ள’ என்பது ஆசாரியர்களின் சடங்குசார் தன்னாயத்தத்தைப் பேணுகிறது. மூலத்தின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் விடப்பட்டுள்ளது.
