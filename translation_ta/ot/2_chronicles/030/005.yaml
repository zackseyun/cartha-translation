  text: וַ/יַּֽעֲמִ֣ידוּ דָבָ֗ר לְ/הַעֲבִ֨יר ק֤וֹל בְּ/כָל יִשְׂרָאֵל֙ מִ/בְּאֵֽר שֶׁ֣בַע וְ/עַד דָּ֔ן לָ/ב֞וֹא לַ/עֲשׂ֥וֹת פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם כִּ֣י לֹ֥א לָ/רֹ֛ב עָשׂ֖וּ כַּ/כָּתֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
translation:
  language: ta
  text: 'ஆகவே, அவர்கள் ஒரு தீர்மானம் செய்து, பெயெர்செபா முதல் தாண் வரை இஸ்ரயேல் முழுவதிலும் ஒரு அறிவிப்பை வெளியிட்டார்கள்: மக்கள் எருசலேமுக்கு வந்து, இஸ்ரயேலின் கடவுளான யாவேவுக்குப் பஸ்காவைக் கடைப்பிடிக்க வேண்டும் என்பதே அந்த அறிவிப்பு. ஏனெனில், எழுதப்பட்டுள்ளபடி அதை அநேகர் கடைப்பிடித்திருக்கவில்லை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாசகம் சுருக்கமாக உள்ளது. இதை, “எழுதப்பட்டுள்ளபடி அதைக் கடைப்பிடித்தவர்கள் அநேகர் இல்லை” என்றும், “அதை அநேகர் எழுதப்பட்டுள்ள முறைப்படி கடைப்பிடிக்கவில்லை” என்றும் புரிந்துகொள்ளலாம். முதல் வாசிப்பு பங்கேற்றோரின் குறைந்த எண்ணிக்கையை வலியுறுத்துகிறது; இரண்டாவது வாசிப்பு விதிக்கப்பட்ட முறையின்படி கடைப்பிடிக்கப்படாததை வலியுறுத்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
  choice: அவர்கள் ஒரு தீர்மானத்தை ஏற்படுத்தி
  rationale: ‘ஒரு காரியத்தை நிலைநிறுத்துதல்’ என்ற எபிரெய மரபுத்தொடர் இச்சூழலில் அதிகாரப்பூர்வமான முடிவை எடுப்பதைக் குறிக்கிறது; தமிழ் நடையில் அதன் முறையான தன்மையை இச்சொற்றொடர் காக்கிறது.
- source_word: לְהַעֲבִיר קוֹל
  choice: ஓர் அறிவிப்பை வெளியிடச் செய்தார்கள்
  rationale: சொல்லுக்குச் சொல் ‘ஒரு குரலைக் கடந்து செல்லச் செய்தல்’; நிர்வாகச் சூழலில் நாடெங்கும் செய்தியைப் பொதுவாக அறிவிப்பதே பொருள்.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: இஸ்ரயேல் முழுவதிலும்
  rationale: அறிவிப்பு நாடு முழுவதும் பரவிய விரிவைக் காட்டுகிறது.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: பெயெர்செபா முதல் தாண் வரை
  rationale: தெற்கிலிருந்து வடக்குவரையான முழு நாட்டைக் குறிக்கும் புவியியல் இணைச்சொல்; இடப்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: לָבוֹא
  choice: மக்கள் எருசலேமுக்கு வந்து
  rationale: அறிவிப்பின் நோக்கத்தையும் உள்ளடக்கத்தையும் இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: பஸ்காவைக் கொண்டாட
  rationale: சொல்லுக்குச் சொல் ‘பஸ்காவைச் செய்தல்’; ஒரு திருவிழாவைக் கடைப்பிடிப்பதைத் தமிழில் இயல்பாக ‘கொண்டாடுதல்’ என வழங்குகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: திருவிழா யாருக்காகவும் யாரை நோக்கியும் அனுசரிக்கப்படுகிறது என்பதை வேற்றுமை உருபு காட்டுகிறது; திருப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரயேலின் கடவுளாகிய
  rationale: எபிரெய சார்புநிலைத் தொடரை தெளிவான, இயல்பான தமிழில் வழங்குகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமுக்கு
  rationale: לָבוֹא என்பதுடன் இடத்தை இலக்காகக் காட்டுவதால், தமிழில் திசைவேற்றுமை இயல்பானது.
- source_word: כִּי לֹא לָרֹב עָשׂוּ כַּכָּתוּב
  choice: ஏனெனில், எழுதப்பட்டுள்ளபடி அதை அநேகர் கொண்டாடியிருக்கவில்லை
  rationale: לָרֹב என்பதன் முதன்மையான எண்ணிக்கை சார்ந்த பொருளை ‘அநேகர்’ எனக் காக்கிறது. சுருக்கமான எபிரெய தொடரில் ‘எழுதப்பட்டுள்ளபடி’ எதனுடன் இணைகிறது என்பது ஓரளவு தெளிவற்றதால் குறிப்பும் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் உடன்படிக்கைக்குரிய தனிப்பெயரான நான்கு எழுத்து இறைப்பெயர் நேரடியாக வருகிறது; அதை பொதுப்பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: כִּי לֹא לָרֹב עָשׂוּ כַּכָּתוּב என்ற இறுதித் தொடரின் பொருள்
  choice: எழுதப்பட்டுள்ளபடி அதை அநேகர் கொண்டாடியிருக்கவில்லை
  alternative: அதை அநேகர் எழுதப்பட்டுள்ள முறைப்படி கொண்டாடவில்லை
  rationale: இரு வாசிப்புகளும் எண்ணிக்கை குறைவையும் விதிப்படி அனுசரித்தலையும் தொடர்புபடுத்துகின்றன; மூலத்தின் சுருக்கத்தால் எதற்கு வலியுறுத்தல் விழுகிறது என்பது தெளிவாக இல்லை. முதன்மை உரை பங்கேற்பாளர்களின் குறைந்த எண்ணிக்கையை முன்னிறுத்துகிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான நடையைப் பயன்படுத்துகிறது. நீண்ட எபிரெய வாக்கியம் தெளிவுக்காக அறிவிப்பின் உள்ளடக்கத்தை விளக்கும் இரு வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; மூலத்தின் காரணத் தொடர்பும் புவியியல் விரிவும் காக்கப்பட்டுள்ளன.
