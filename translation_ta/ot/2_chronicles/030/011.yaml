id: 2CH.30.11
reference: 2 Chronicles 30:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַךְ אֲנָשִׁ֛ים מֵ/אָשֵׁ֥ר וּ/מְנַשֶּׁ֖ה וּ/מִ/זְּבֻל֑וּן נִֽכְנְע֔וּ וַ/יָּבֹ֖אוּ לִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/011.yaml
  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: ta
  text: ஆயினும், ஆசேர், மனாசே, செபுலோன் கோத்திரங்களைச் சேர்ந்த சில ஆண்கள் தங்களைத் தாழ்த்திக்கொண்டு எருசலேமுக்கு வந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: ஆயினும்
  rationale: முந்தைய வசனத்தில் பலர் அழைப்பை ஏளனம் செய்ததற்கு மாறாக இவர்கள் நடந்துகொண்டதைச் சுட்டும் எதிர்மறை இணைப்பாக வருகிறது; கட்டுப்படுத்தும் ‘மட்டுமே’ என்ற பொருளைவிட ‘ஆயினும்’ சூழலுக்குப் பொருந்துகிறது.
- source_word: אֲנָשִׁים
  choice: சில ஆண்கள்
  rationale: ஆண்பால் பன்மைப் பெயர்ச்சொல், குறிப்பிடப்பட்ட கோத்திரங்களைச் சேர்ந்த ஒரு பகுதியினரைக் குறிக்கிறது; ‘சில ஆண்கள்’ என்பதால் பாலினமும் வரையறுக்கப்படாத உட்பிரிவும் வெளிப்படுகின்றன.
- source_word: מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן
  choice: ஆசேர், மனாசே, செபுலோன் கோத்திரங்களைச் சேர்ந்த
  rationale: מִן முன்னொட்டு அவர்களின் தோற்றுவாயை அல்லது கோத்திரச் சார்பைச் சுட்டுகிறது. தமிழில் பெயர்களை மட்டும் வரிசைப்படுத்துவதைவிட ‘கோத்திரங்களைச் சேர்ந்த’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: נִכְנְעוּ
  choice: தங்களைத் தாழ்த்திக்கொண்டு
  rationale: כנע என்பதன் நிஃபால் வடிவம் இச்சூழலில் தாமாகத் தாழ்மைப்படுதல் என்ற மறுமை நுணுக்கத்தைத் தருகிறது; அடுத்து அவர்கள் எருசலேமுக்கு வந்தது அவர்களின் மனப்பூர்வமான பதிலை வெளிப்படுத்துகிறது.
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: தொடர்ச்சியான கதைநடையில் בוא, எருசலேமை இலக்காகக் கொண்டு ‘வந்தார்கள்’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: לִירוּשָׁלִָם
  choice: எருசலேமுக்கு
  rationale: לְ முன்னொட்டு செல்லும் இலக்கைச் சுட்டுகிறது; இடப்பெயரின் நிலையான தமிழ் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: நִכְנְעוּ என்பதன் செயப்பாட்டு அல்லது மறுமைப் பொருள்
  choice: தங்களைத் தாழ்த்திக்கொண்டு
  alternative: தாழ்த்தப்பட்டு
  rationale: நிஃபால் வடிவம் இரு நுணுக்கங்களையும் ஏற்கக்கூடியதாக இருந்தாலும், அழைப்பை ஏற்று எருசலேமுக்கு வந்த மனிதர்களின் பதிலைச் சொல்லும் சூழல் மறுமைப் பொருளை ஆதரிக்கிறது; இதனால் எந்தச் சிறப்புச் சமயக் கோட்பாடும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான உரை. ‘ஆயினும்’ வசனத்தின் முரண்பாட்டைத் தெளிவாக்குகிறது; ‘கோத்திரங்களைச் சேர்ந்த’ என்பது இஸ்ரவேலின் கோத்திரப் பெயர்களை சாதாரண வாசகருக்குத் தெளிவுபடுத்துகிறது.
