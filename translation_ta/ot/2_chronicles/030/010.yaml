revisions:
- from: அதனால் தூதர்கள் எப்பிராயீம், மனாசே நாடுகளில் நகரம் நகரமாகச் சென்று, செபுலோன்வரை போனார்கள்; ஆனால் மக்கள் அவர்களைப் பார்த்துச் சிரித்துக்கொண்டும் அவர்களை ஏளனம் செய்துகொண்டும் இருந்தார்கள்.
  to: தூதர்கள் எப்பிராயீம், மனாசே நாடுகளில் நகரம் நகரமாகச் சென்று, செபுலோன்வரை போனார்கள்; ஆனால் மக்கள் அவர்களைப் பரிகசித்துக்கொண்டும் ஏளனம் செய்துகொண்டும் இருந்தார்கள்.
  rationale: The revision removes an unsupported action (“பார்த்துச்,” ‘looking at’) and renders the first contempt verb as “பரிகசித்துக்கொண்டும்” (‘ridiculing/deriding continually’). The paired, ongoing scorn in the Hebrew remains explicit through “பரிகசித்துக்கொண்டும் ஏளனம் செய்துகொண்டும் இருந்தார்கள்.” No footnotes are required for this verse in Tamil.
