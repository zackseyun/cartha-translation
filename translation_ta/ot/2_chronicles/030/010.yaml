translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மூலத்தின் தொடர்ச்சியான இகழ்ச்சி ‘சிரித்துக்கொண்டும் ... ஏளனம் செய்துகொண்டும் இருந்தார்கள்’ என்று பாதுகாக்கப்பட்டுள்ளது.
