  text: וַ/יִּֽהְי֨וּ הָ/רָצִ֜ים עֹבְרִ֨ים מֵ/עִ֧יר לָ/עִ֛יר בְּ/אֶֽרֶץ אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וְ/עַד זְבֻל֑וּן וַ/יִּֽהְיוּ֙ מַשְׂחִיקִ֣ים עֲלֵי/הֶ֔ם וּ/מַלְעִגִ֖ים בָּֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
translation:
  language: ta
  text: தூதர்கள் எப்பிராயீம், மனாசே நாடுகளில் நகரம் நகரமாகச் சென்று, செபுலோன்வரை போனார்கள்; ஆனால் மக்கள் அவர்களைப் பரிகசித்துக்கொண்டும் ஏளனம் செய்துகொண்டும் இருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרָצִים
  choice: தூதர்கள்
  rationale: רוץ (‘ஓடு’) என்ற வேரிலிருந்து வந்த இச்சொல், செய்தியை விரைவாக எடுத்துச் செல்லும் அதிகாரப்பூர்வ நபர்களைக் குறிக்கிறது. தமிழில் ‘தூதர்கள்’ என்பது அவர்களுடைய பணியை இயல்பாகத் தெரிவிக்கிறது; வேகமாகச் சென்றனர் என்ற நுணுக்கம் சூழலிலேயே உள்ளது.
- source_word: עֹבְרִים
  choice: சென்று
  rationale: சொல்லுக்குச் சொல் ‘கடந்து சென்றுகொண்டிருந்தனர்’ என்ற பொருள் இருந்தாலும், நகரம் நகரமாகப் பயணித்ததை நவீன தமிழில் இயல்பாக ‘சென்று’ எனக் கூறலாம்.
- source_word: מֵעִיר לָעִיר
  choice: நகரம் நகரமாக
  rationale: ஒவ்வொரு நகரமாகத் தொடர்ந்து சென்றனர் என்ற பகிர்வுப் பொருளை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: בְּאֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְעַד זְבֻלוּן
  choice: எப்பிராயீம், மனாசே நாடுகளில் ... செபுலோன்வரை
  rationale: அவர்கள் சென்ற புவியியல் பரப்பையும் וְעַד என்பதன் ‘வரை’ என்ற எல்லைப் பொருளையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מַשְׂחִיקִים עֲלֵיהֶם
  choice: அவர்களைப் பார்த்துச் சிரித்துக்கொண்டும்
  rationale: இங்கு சாதாரண மகிழ்ச்சிச் சிரிப்பு அல்ல, ஒருவரை இகழ்ந்து சிரிப்பதே பொருள். ‘பார்த்துச் சிரித்தல்’ என்பது அந்த அவமதிப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּמַלְעִגִים בָּם
  choice: அவர்களை ஏளனம் செய்துகொண்டும்
  rationale: לעג குறிக்கும் இகழ்ச்சியும் கேலியும் ‘ஏளனம் செய்தல்’ என்பதில் தெளிவாக வெளிப்படுகின்றன; முந்தைய வினையுடன் சேர்ந்து அவமதிப்பின் தீவிரத்தையும் காட்டுகிறது.
- source_word: וַיִּהְיוּ ... וַיִּהְיוּ
  choice: அதனால் ... ஆனால் ... இருந்தார்கள்
  rationale: முதல் தொடரை நிகழ்வின் விளைவாகவும், இரண்டாவதை எதிர்மறையான மக்கள் எதிர்வினையாகவும் இயல்பான தமிழில் அமைக்கிறது. வினையெச்சங்களோடு ‘இருந்தார்கள்’ பயன்படுத்தப்பட்டதால் தொடர்ச்சியான கேலி என்ற எபிரெய அம்சமும் காக்கப்படுகிறது.
