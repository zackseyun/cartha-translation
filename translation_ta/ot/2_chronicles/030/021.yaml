  text: וַ/יַּעֲשׂ֣וּ בְנֵֽי יִ֠שְׂרָאֵל הַ/נִּמְצְאִ֨ים בִּ/ירוּשָׁלִַ֜ם אֶת חַ֧ג הַ/מַּצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וּֽ/מְהַלְלִ֣ים לַ֠/יהוָה י֣וֹם בְּ/י֞וֹם הַ/לְוִיִּ֧ם וְ/הַ/כֹּהֲנִ֛ים בִּ/כְלֵי עֹ֖ז לַ/יהוָֽה־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
translation:
  language: ta
  text: எருசலேமில் இருந்த இஸ்ரவேல் மக்கள் புளிப்பில்லா அப்பத் திருவிழாவை ஏழு நாட்கள் மிகுந்த மகிழ்ச்சியுடன் கொண்டாடினார்கள். லேவியர்களும் ஆசாரியர்களும் யாவேவுக்காக வலிமைமிக்க இசைக்கருவிகளால்[a] நாள்தோறும் யாவேவைப் புகழ்ந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, ‘வலிமையின் கருவிகளால்’; ‘வலிமையான இசைக்கருவிகளால்’ அல்லது ‘முழக்கமிடும் இசைக்கருவிகளால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: בִּכְלֵי עֹז என்பது அரிதானதும் பொருள் தெளிவாக முடிவுசெய்ய முடியாததுமான சொற்றொடர்; கருவிகளின் வலிமையையோ அவற்றின் உரத்த ஒலியையோ குறிக்கலாம்.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... אֶת חַג הַמַּצּוֹת
  choice: புளிப்பில்லா அப்பத் திருவிழாவைக் ... கொண்டாடினார்கள்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’ என்றாலும், חג என்பதுடன் வரும்போது ஒரு திருவிழாவைக் கடைப்பிடித்தல் அல்லது கொண்டாடுதல் என்று பொருள். நவீன தமிழில் ‘கொண்டாடினார்கள்’ இயல்பாக உள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இவ்வரலாற்றுச் சூழலில் அது இஸ்ரவேல் மக்களைக் கூட்டாகக் குறிக்கிறது. ‘இஸ்ரவேல் மக்கள்’ இயல்பான, உள்ளடக்கத்துக்கு உண்மையான தமிழ்.
- source_word: הַנִּמְצְאִים בִּירוּשָׁלִַם
  choice: எருசலேமில் இருந்த
  rationale: מצא என்னும் வினையின் வடிவம் சொற்படியாக ‘காணப்பட்ட’ எனினும், இங்கு எருசலேமில் அப்போது இருந்தவர்களைக் குறிக்கிறது. ‘இருந்த’ என்பது இயல்பான தமிழில் அந்தச் சூழ்நிலைப் பொருளைத் தருகிறது.
- source_word: חַג הַמַּצּוֹת
  choice: புளிப்பில்லா அப்பத் திருவிழா
  rationale: நிறுவப்பட்ட திருவிழாவின் பெயரைத் தெளிவாகக் காட்டுகிறது; מצות என்பதிலுள்ள புளிப்பூட்டப்படாத அப்பம் என்ற பொருளையும் வெளிப்படுத்துகிறது.
- source_word: בְשִׂמְחָה גְדוֹלָה
  choice: மிகுந்த மகிழ்ச்சியுடன்
  rationale: எபிரெயச் சொற்றொடரின் தீவிரத்தையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: יוֹם בְּיוֹם
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் தொடர்ந்து நடந்த செயலைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בִּכְלֵי עֹז
  choice: வலிமைமிக்க இசைக்கருவிகளால்
  rationale: כלי என்பதைச் சூழலுக்கேற்ப இசைக்கருவிகள் என்றும் עז என்பதை வலிமைமிக்க என்றும் மொழிபெயர்க்கிறது. சொற்றொடர் அரிதானது என்பதால் அதன் சொற்படியான வடிவமும் வேறு சாத்தியங்களும் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, கடவுளின் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே பெயரே ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: இறுதியில் வரும் לַיהוָה என்பதன் தொடர்பு
  choice: யாவேவுக்காக வலிமைமிக்க இசைக்கருவிகளால்
  alternative: யாவேவுக்கு வலிமைமிக்க இசைக்கருவிகளால்
  rationale: לְ என்னும் முன்னிடைச்சொல் இங்கு நோக்கம் அல்லது அர்ப்பணிப்பைக் குறிக்கலாம். அதை ‘யாவேவுக்காக’ என்று கொடுத்து, யாவேவைப் புகழ்வதற்கான கருவிகள் என்ற சாத்தியமான தொடர்பைத் தக்கவைத்துள்ளோம்; வாக்கியத்தில் இருமுறை வரும் தெய்வீகப் பெயரும் நீக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, பொதுமக்களுக்கு விளங்கும் மரியாதையான தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’, ‘புளிப்பில்லா அப்பத் திருவிழா’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன. அரிதான எபிரெயச் சொற்றொடரின் அசாதாரண தன்மை முற்றிலும் மென்மையாக்கப்படாமல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
