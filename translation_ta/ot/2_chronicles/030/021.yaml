  source_fidelity: 'மொழிபெயர்ப்பு வசனத்தின் முக்கியக் கூறுகளை உண்மையாகக் கொண்டுள்ளது: எருசலேமில் இருந்த இஸ்ரவேலர், புளிப்பில்லா அப்பத் திருவிழா, ஏழு நாட்கள், மிகுந்த மகிழ்ச்சி, லேவியரும் ஆசாரியரும் நாள்தோறும் செய்த புகழ்ச்சி ஆகியவை சரியாக உள்ளன. בִּכְלֵי עֹז என்ற கடினமான சொற்றொடருக்கான முதன்மை மொழிபெயர்ப்பும் அடிக்குறிப்பும் அதன் உறுதியற்ற தன்மையைப் பாதுகாக்கின்றன. இறுதியில் לַיהוָה-வின் தொடர்பை ‘யாவேவுக்காக’ எனக் கொடுப்பது சாத்தியமான வாசிப்பு. ஆனால் தற்போதைய சொல் வரிசையில் ‘யாவேவை, யாவேவுக்காக...’ என்ற அமைப்பு தமிழில் தேவையற்ற இடைநிறுத்தத்தையும் தொடர்பு மயக்கத்தையும் உண்டாக்குகிறது.'
