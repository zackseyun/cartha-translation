  revised_text: 'அரசரும் அவருடைய அதிகாரிகளும் கொடுத்த கடிதங்களை எடுத்துக்கொண்டு, அரசரின் கட்டளைப்படி தூதர்கள் இஸ்ரவேல், யூதா நாடுகள் முழுவதும் சென்று இவ்வாறு அறிவித்தார்கள்: “இஸ்ரவேலின் மக்களே, ஆபிரகாம், ஈசாக்கு, இஸ்ரவேல்[a] ஆகியோரின் கடவுளாகிய யாவேவிடம் திரும்புங்கள். அப்போது அசீரிய அரசர்களின் கையிலிருந்து தப்பிப் பிழைத்து உங்களிடம் எஞ்சியிருப்போரிடம் அவரும் திரும்புவார்[b].”'
