  text: וַ/יֵּלְכוּ֩ הָ/רָצִ֨ים בָּֽ/אִגְּר֜וֹת מִ/יַּ֧ד הַ/מֶּ֣לֶךְ וְ/שָׂרָ֗י/ו בְּ/כָל יִשְׂרָאֵל֙ וִֽ/יהוּדָ֔ה וּ/כְ/מִצְוַ֥ת הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר בְּנֵ֣י יִשְׂרָאֵ֗ל שׁ֚וּבוּ אֶל יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל וְ/יָשֹׁב֙ אֶל הַ/פְּלֵיטָ֔ה הַ/נִּשְׁאֶ֣רֶת לָ/כֶ֔ם מִ/כַּ֖ף מַלְכֵ֥י אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
translation:
  language: ta
  text: 'அரசரும் அவருடைய அதிகாரிகளும் கொடுத்த கடிதங்களை எடுத்துக்கொண்டு, அரசரின் கட்டளைப்படி தூதர்கள் இஸ்ரவேல், யூதா நாடுகள் முழுவதும் சென்று இவ்வாறு அறிவித்தார்கள்: “இஸ்ரவேலின் மக்களே, ஆபிரகாம், ஈசாக்கு, இஸ்ரவேல்[a] ஆகியோரின் கடவுளாகிய யாவேவிடம் திரும்புங்கள். அப்போது அசீரிய அரசர்களின் கையிலிருந்து தப்பிப் பிழைத்து உங்களிடம் எஞ்சியிருப்போரிடம் அவரும் திரும்புவார்[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் இங்கு பழக்கமான ‘யாக்கோபு’ என்பதற்குப் பதிலாக ‘இஸ்ரவேல்’ என்றே உள்ளது.
    reason: alternative_reading
  - marker: b
    text: எபிரெய வினை வடிவம், அவர்கள் யாவேவிடம் திரும்பினால் அவர் எஞ்சியிருப்போரிடம் திரும்புவார் என்ற விளைவாகவும், அவர் திரும்பும்படியாக என்ற நோக்கமாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: genuine_ambiguity
lexical_decisions:
- source_word: הָרָצִים
  choice: தூதர்கள்
  rationale: சொல்லின் நேர்ப்பொருள் ‘ஓடுபவர்கள்’ என்றாலும், அரச கடிதங்களை எடுத்துச் செல்லும் நிர்வாகச் சூழலில் ‘தூதர்கள்’ என்பது இயல்பாகவும் செயல்பாட்டுப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: בָּאִגְּרוֹת מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  choice: அரசரும் அவருடைய அதிகாரிகளும் கொடுத்த கடிதங்களை எடுத்துக்கொண்டு
  rationale: ‘கையிலிருந்து’ என்ற எபிரெய மரபுத்தொடர் நேரடி அரச அங்கீகாரம்/வழங்கலைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகப் பொருள் வெளிப்படுமாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּכָל יִשְׂרָאֵל וִיהוּדָה
  choice: இஸ்ரவேல், யூதா நாடுகள் முழுவதும்
  rationale: தூதர்கள் சென்ற பரப்பளவை ‘முழுவதும்’ தெளிவாகக் காட்டுகிறது; ‘நாடுகள்’ என்பது இரு நிலப்பரப்புகளையும் இயல்பான தமிழில் உணர்த்த சேர்க்கப்பட்டது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்களே
  rationale: நேரடி ‘மகன்களே’ என்பதைவிட அழைக்கப்படும் இஸ்ரவேல் சமூகமெங்கும் உள்ளடங்கும் இயல்பான நவீனத் தமிழ்; பாலினத்தைத் தேவையின்றிக் குறுக்குவதில்லை.
- source_word: שׁוּבוּ אֶל יְהוָה
  choice: யாவேவிடம் திரும்புங்கள்
  rationale: שׁוב என்பதன் திரும்புதல்/மனந்திரும்புதல் சார்ந்த உடன்படிக்கைச் சாயலைப் பாதுகாக்கிறது; பின்னர் வரும் கடவுளின் ‘திரும்புதல்’ என்பதுடனான சொல் ஒற்றுமையும் காக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: ஆபிரகாம், ஈசாக்கு, இஸ்ரவேல் ஆகியோரின் கடவுள்
  rationale: மூலத்தில் உள்ள ‘இஸ்ரவேல்’ என்பதையே காக்கிறது; பழக்கமான சூத்திரத்திற்காக ‘யாக்கோபு’ என்று ஒத்திசைக்கவில்லை.
- source_word: וְיָשֹׁב
  choice: அப்போது ... அவரும் திரும்புவார்
  rationale: கட்டளைக்குப் பின் வரும் வினையை நிபந்தனை சார்ந்த விளைவு/எதிர்வினையாக எடுத்துக்கொள்கிறது; யாவே அவர்களிடம் மீண்டும் அருளோடு திரும்புவார் என்ற தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם
  choice: தப்பி உங்களுக்கென எஞ்சியிருப்போர்
  rationale: פלט என்பதன் ‘தப்பியவர்கள்’ மற்றும் שׁאר என்பதன் ‘எஞ்சியவர்கள்’ ஆகிய இரு கூறுகளையும் ஒருங்கிணைத்து, לָכֶם என்பதைக் ‘உங்களுக்கென’ என்று காக்கிறது.
- source_word: מִכַּף מַלְכֵי אַשּׁוּר
  choice: அசீரிய அரசர்களின் கைக்குத் தப்பி
  rationale: ‘கை’ என்ற மூல உருவகத்தைப் பாதுகாத்து, ஆட்சி/அதிகாரத்திலிருந்து உயிர்தப்பிய பொருளைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றை நெருக்கமாகப் பாதுகாக்கிறது.
- issue: முற்பிதாக்களின் பட்டியலில் ‘இஸ்ரவேல்’ என்பதைக் காப்பதா
  choice: ஆபிரகாம், ஈசாக்கு, இஸ்ரவேல்
  alternative: ஆபிரகாம், ஈசாக்கு, யாக்கோபு
  rationale: இந்த வசனத்தின் எபிரெய உரை יִשְׂרָאֵל என்கிறது. பழக்கமான சொற்றொடருடன் ஒத்திசைக்காமல் உரையின் தனித்த வடிவம் பாதுகாக்கப்படுகிறது.
- issue: וְיָשֹׁב என்பதன் இலக்கண வலிமை
  choice: அப்போது ... அவரும் திரும்புவார்
  alternative: அவர் திரும்பும்படியாக / அவர் திரும்பக்கூடும்
  rationale: கட்டளைக்குப் பின்வரும் வடிவம் நோக்கம் அல்லது விளைவு எனப் புரியக்கூடியது. தமிழில் நிபந்தனை சார்ந்த விளைவாக வழங்கப்பட்டுள்ளது; இது மனிதர் திரும்புதல் மற்றும் கடவுள் திரும்புதல் ஆகியவற்றின் பரஸ்பர மொழிநயத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. அரச நிர்வாகச் சொற்களுக்கு ‘தூதர்கள்’, ‘அதிகாரிகள்’, ‘கட்டளை’ பயன்படுத்தப்பட்டன. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டை ஒட்டிய வடிவங்களில் தரப்பட்டாலும், יְהוָה மட்டும் மூலப் பெயரைப் பாதுகாக்க ‘யாவே’ என வழங்கப்பட்டது.
