translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எருசலேம் என்ற இடப்பெயரின் மறுபயன்பாடு மூலத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் சேர்க்கப்படவில்லை.
