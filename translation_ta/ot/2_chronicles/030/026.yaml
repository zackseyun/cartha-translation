source:
  edition: WLC
  text: וַ/תְּהִ֥י שִׂמְחָֽה גְדוֹלָ֖ה בִּֽ/ירוּשָׁלִָ֑ם כִּ֠י מִ/ימֵ֞י שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל לֹ֥א כָ/זֹ֖את בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/026.yaml
  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: ta
  text: எனவே எருசலேமில் மிகுந்த மகிழ்ச்சி உண்டாயிற்று. ஏனெனில், இஸ்ரவேலின் அரசனான தாவீதின் மகன் சாலொமோனின் நாட்களிலிருந்து எருசலேமில் இதுபோல் நிகழ்ந்ததில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: எனவே ... உண்டாயிற்று
  rationale: தொடர்கதை அமைப்பிலுள்ள வாவ்-தொடர்வினை முந்தைய நிகழ்வுகளின் விளைவையும் அடுத்த நிகழ்நிலையையும் சுட்டுகிறது; இயல்பான தமிழில் ‘எனவே’ அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: שִׂמְחָה גְדוֹלָה
  choice: மிகுந்த மகிழ்ச்சி
  rationale: பெயர்ச்சொல்–பெயரடை இணைப்பின் தீவிரமான, சமூகமுழுவதற்குமான மகிழ்ச்சியைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: בִּירוּשָׁלָם
  choice: எருசலேமில்
  rationale: בְּ முன்னிடைச்சொல்லின் இடப்பொருளை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது; எபிரெய உரையிலுள்ள இருமுறை பயன்பாடும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மிகுந்த மகிழ்ச்சி உண்டானது என்ற கூற்றுக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: מִימֵי
  choice: நாட்களிலிருந்து
  rationale: முந்தைய காலகட்டத்திலிருந்து இந்நிகழ்வுவரையிலான கால ஒப்பீட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: தாவீதின் மகன் சாலொமோன்
  rationale: எபிரெய உறவுநிலையைத் தெளிவான தமிழ் உடைமைத் தொடராக அளிக்கிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனான
  rationale: சாலொமோனை அடையாளப்படுத்தும் இணைப்புப் பட்டத்தை இயல்பான தமிழ் பெயரெச்சத் தொடராக வழங்குகிறது.
- source_word: לֹא כָזֹאת
  choice: இதுபோல் நிகழ்ந்ததில்லை
  rationale: சொல்லுக்குச் சொல் ‘இதைப்போல் இல்லை’ என்பதில் சூழலால் உணரப்படும் நிகழ்வைத் தமிழில் தேவையான அளவு வெளிப்படுத்தி, ஒப்பீட்டு வலிமையைப் பாதுகாக்கிறது.
