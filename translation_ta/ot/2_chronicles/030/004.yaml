  text: The matter seemed right in the eyes of the king and in the eyes of all the assembly[a].
translation:
  language: ta
  text: அந்தக் காரியம் அரசனின் பார்வையிலும் முழுச் சபையின் பார்வையிலும் சரியானதாகத் தோன்றியது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்தக் காரியம் அரசனின் பார்வையிலும் முழுச் சபையின் பார்வையிலும் சரியானதாக இருந்தது.”
    reason: וַיִּישַׁר என்பதை ‘சரியானதாகத் தோன்றியது’ என்றும் ‘சரியானதாக இருந்தது’ என்றும் மொழிபெயர்க்கலாம்; இந்த மாற்று வாசகம் மூலத்தில் உள்ள மதிப்பீட்டு நுணுக்கத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: சரியானதாகத் தோன்றியது
  rationale: ישׁר என்பதன் இந்த வடிவம், முன்வைக்கப்பட்ட காரியம் சரியானது அல்லது ஏற்றது என்று கருதப்பட்டதைக் குறிக்கிறது. எபிரெய மொழியின் மதிப்பீட்டு நுணுக்கத்தைத் தீர்மானமாக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: הַדָּבָר
  choice: அந்தக் காரியம்
  rationale: דבר என்பது ‘சொல், காரியம், விஷயம்’ எனப் பரந்த பொருளுடையது. முந்தைய வசனங்களில் ஆலோசிக்கப்பட்ட செயல்திட்டத்தைச் சுட்டுவதால் ‘அந்தக் காரியம்’ நேரடியானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ‘கண்களில்’ என்ற எபிரெய மரபுத்தொடர் ஒருவரின் மதிப்பீடு அல்லது கண்ணோட்டத்தைக் குறிக்கிறது. ‘பார்வையில்’ அதன் உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: குறிப்பிட்ட அரசனைச் சுட்டும் பெயர்ச்சொல்லின் நேரடியான தமிழ் மொழிபெயர்ப்பு.
- source_word: וּבְעֵינֵי
  choice: பார்வையிலும்
  rationale: மூலத்தில் மீண்டும் வரும் மரபுத்தொடரின் இணைப்பையும் இணையான அமைப்பையும் பாதுகாக்கிறது.
- source_word: כָּל
  choice: அனைவரின்
  rationale: சபையில் இருந்த முழுக் குழுவையும் உள்ளடக்கும் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַקָּהָל
  choice: சபையார்
  rationale: קהל என்பது கூடியிருந்த சமூகத்தைக் குறிக்கிறது. ‘சபையார்’ என்பது இங்கு கூடியிருந்த மக்களைக் குறிக்கும் சுருக்கமான, கண்ணியமான நவீனத் தமிழ் சொல்.
