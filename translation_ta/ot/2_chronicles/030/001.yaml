  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
translation:
  language: ta
  text: எசேக்கியா இஸ்ரவேல், யூதா மக்கள் அனைவருக்கும் செய்தி அனுப்பினார்[a]. மேலும், எருசலேமிலுள்ள யாவேயின் ஆலயத்திற்கு வந்து, இஸ்ரவேலின் கடவுளாகிய யாவேக்குப் பஸ்காவைக் கடைப்பிடிக்கும்படி, எப்பிராயீமுக்கும் மனாசேக்கும் கடிதங்கள் எழுதினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல், யூதா நாடெங்கும் செய்தி அனுப்பினார்.” எபிரேய முன்னிடைச்சொல், செய்தி மக்களிடம் அனுப்பப்பட்டதையும் நாடு முழுவதும் அனுப்பப்பட்டதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: சொற்பட, “பஸ்காவைச் செய்யும்படி.” இது பஸ்காவை அனுசரிப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர். “யாவேக்காகப் பஸ்காவைக் கொண்டாடும்படி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: இஸ்ரவேல், யூதா முழுவதற்கும் செய்தி அனுப்பினார்
  rationale: שׁלח என்பதன் அடிப்படைப் பொருள் ‘அனுப்புதல்’; மக்களைக் குறிக்கும் עַל உடன் இங்கு செய்தி அல்லது அழைப்பு அனுப்பியதைக் குறிக்கிறது. ‘செய்தி அனுப்பினார்’ என்பது தூதர்களை உரையில் இல்லாமல் சேர்க்காமல், பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது. ‘முழுவதற்கும்’ அனுப்புதலின் பரந்த எல்லையையும் பெறுநர்களையும் வெளிப்படுத்துகிறது.
- source_word: וְגַם אִגְּרוֹת כָּתַב עַל אֶפְרַיִם וּמְנַשֶּׁה
  choice: எப்பிராயீமுக்கும் மனாசேக்கும் கடிதங்களையும் எழுதினார்
  rationale: אִגְּרוֹת என்பது எழுத்துவழித் தொடர்புகளான ‘கடிதங்கள்.’ עַל இங்கு கடிதங்களின் பெறுநர்களை அல்லது இலக்குப் பகுதிகளைச் சுட்டுகிறது; தமிழில் ‘-க்கும்’ இயல்பான சமமான வடிவம்.
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: யாவேயின் ஆலயத்திற்கு வந்து
  rationale: בֵית יְהוָה என்பதன் சொற்பொருள் ‘யாவேயின் வீடு.’ இச்சூழலில் அது எருசலேம் ஆலயத்தைக் குறிக்கிறது; நவீனத் தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரான יהוה-ஐ ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: பஸ்காவைக் கடைப்பிடிக்கும்படி
  rationale: சொற்பட ‘பஸ்காவைச் செய்ய’ என்றாலும், இது பண்டிகையை அனுசரிப்பதைக் குறிக்கும் எபிரேய மரபுத்தொடர். ‘கடைப்பிடிக்க’ என்பது அதன் கடமை மற்றும் அனுசரிப்பு உணர்வை இயல்பாகக் காக்கிறது.
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய யாவேக்கு
  rationale: לְ என்பதன் இலக்கை அல்லது அர்ப்பணிப்பை ‘யாவேக்கு’ என நெருக்கமாகக் காக்கிறது; אֱלֹהֵי יִשְׂרָאֵל என்பது யாவேயை ‘இஸ்ரவேலின் கடவுள்’ என்று அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה-ஐப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அந்தப் பெயரைப் பட்டப்பெயரால் மாற்றாமல் பாதுகாக்கிறது.
- issue: לַיהוָה என்பதில் לְ-இன் உறவு
  choice: யாவேக்கு
  alternative: யாவேக்காக
  rationale: ‘யாவேக்கு’ என்பது எபிரேய திசை/அர்ப்பணிப்பு அமைப்பை நெருக்கமாகக் காத்து, பஸ்கா யாவேயை நோக்கிக் கடைப்பிடிக்கப்படுவதைச் சொல்கிறது. ‘யாவேக்காக’ என்பதும் சூழலில் சாத்தியம்; ஆனால் அது பயன் அல்லது நோக்கத்தைச் சற்றுக் கூடுதலாக விளக்கிவிடலாம்.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியுமாறும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆலயம்,’ ‘கடிதங்கள்,’ ‘கடைப்பிடிக்க’ ஆகியவை இயல்பான தமிழுக்காகத் தேர்ந்தெடுக்கப்பட்டன; இறைப்பெயர் ‘யாவே’ எனத் தக்கவைக்கப்பட்டது.
