revisions:
- from: தன் இதயத்தைத் தேவனைத் தேடுவதில் உறுதியாக வைத்த ஒவ்வொருவரையும்—அதாவது, தன் முன்னோர்களின் தேவனாகிய யாவே தேவனைத் தேடுகிற ஒவ்வொருவரையும்—பரிசுத்த இடத்திற்குரிய தூய்மைமுறைப்படி அவர் தூய்மையடைந்திராவிட்டாலும் மன்னிப்பாராக.[a]
  to: தன் இதயத்தைத் தன் முன்னோர்களின் தேவனாகிய யாவே தேவனைத் தேடுவதற்கு உறுதிப்படுத்திய ஒவ்வொருவரையும், பரிசுத்த இடத்திற்குரிய தூய்மைமுறைப்படி அவர் தூய்மையடைந்திருக்காவிட்டாலும், மன்னிப்பாராக.[a]
  rationale: தேவனைத் தேடுதலை ஒரே முறை கூறி, எபிரெயத்தின் ‘இதயத்தை ... தேடுவதற்கு ஆயத்தப்படுத்துதல்/நிலைநிறுத்துதல்’ என்ற உறவை நேரடியாகத் தமிழில் அமைத்துள்ளேன். சடங்குத் தூய்மைத் தரத்திற்கு ஒத்துப்போகாத நிலையும் முந்தைய வசனத்திலிருந்து தொடரும் மன்னிப்பு வேண்டுதலும் காக்கப்பட்டுள்ளன; இறையியல் விளக்கம் எதுவும் சேர்க்கப்படவில்லை.
