  text: כָּל לְבָב֣/וֹ הֵכִ֔ין לִ/דְר֛וֹשׁ הָ/אֱלֹהִ֥ים יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתָ֑י/ו וְ/לֹ֖א כְּ/טָהֳרַ֥ת הַ/קֹּֽדֶשׁ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/019.yaml
  text: everyone whose heart was set to seek God[a], Yahweh, the God of his fathers, though not according to the purification required for the holy place.
translation:
  language: ta
  text: தன் இதயத்தைத் தன் முன்னோர்களின் தேவனாகிய யாவே தேவனைத் தேடுவதற்கு உறுதிப்படுத்திய ஒவ்வொருவரையும், பரிசுத்த இடத்திற்குரிய தூய்மைமுறைப்படி அவர் தூய்மையடைந்திருக்காவிட்டாலும், மன்னிப்பாராக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரிசுத்த ஸ்தலத்தின் தூய்மைமுறைப்படி” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள קֹדֶשׁ (கோதேஷ்) என்பது வழிபாட்டுச் சூழலில் பரிசுத்த இடத்தையோ பரிசுத்த ஸ்தலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  choice: தன் இதயத்தை … ஒவ்வொருவரையும்
  rationale: தொடர்புடைய முந்தைய வசனத்தின் வேண்டுதலுக்கு ஏற்றவாறு, ஒருமை வடிவிலுள்ள எபிரெயச் சொற்றொடரின் பகிர்ந்தளிக்கும் பொருளை இயல்பான தமிழில் ‘ஒவ்வொருவரையும்’ எனக் கொடுக்கிறது.
- source_word: הֵכִין
  choice: உறுதியாக வைத்த
  rationale: כון என்பதன் ஹிஃபில் வடிவம் ஆயத்தப்படுத்துதல், நிலைநிறுத்துதல், ஒரு திசையில் செலுத்துதல் ஆகிய பொருள்களை உடையது. இங்கு இதயத்தின் நோக்கமுள்ள உள்ளார்ந்த மனநிலையை ‘உறுதியாக வைத்த’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִדְרוֹשׁ
  choice: தேடுவதில் / தேடுகிற
  rationale: தேவனை வழிபாட்டுடனும் பற்றுறுதியுடனும் நாடுதல் என்ற רחבமான பொருளை ‘தேடுதல்’ காக்கிறது.
- source_word: הָאֱלֹהִים יְהוָה
  choice: யாவே தேவனை
  rationale: தேடப்படுகிற தேவன் யாவே என்று இணைப்புச் சொற்றொடர் அடையாளப்படுத்துகிறது; தேவனுடைய உடன்படிக்கைப் பெயரை ஒலிபெயர்த்து வழங்குகிறது.
- source_word: אֱלֹהֵי אֲבוֹתָיו
  choice: தன் முன்னோர்களின் தேவனாகிய
  rationale: பகிர்ந்தளிக்கும் ஒருமை விகுதியையும் உடன்படிக்கை சார்ந்த மூதாதையர் குறிப்பையும் காக்கிறது; இன்றைய தமிழில் ‘முன்னோர்கள்’ இயல்பானது.
- source_word: וְלֹא כְּטָהֳרַת
  choice: தூய்மைமுறைப்படி அவர் தூய்மையடைந்திராவிட்டாலும்
  rationale: வாவ் இணைப்பின் விட்டுக்கொடுக்கும் உறவையும், כְּ குறிக்கும் தரநிலைக்கேற்ப என்ற பொருளையும், טָהֳרָה குறிக்கும் சடங்குமுறைத் தூய்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்திற்குரிய
  rationale: வழிபாட்டுச் சூழலில் ‘பரிசுத்த இடம்’ அல்லது ‘பரிசுத்த ஸ்தலம்’ என்ற சாத்தியத்தைத் தெளிவாகக் கொடுக்கிறது; சுருக்கமான மூலச்சொல்லின் பொருள் எல்லையை அடிக்குறிப்பு பதிவு செய்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயர்
  choice: யாவே
  alternative: யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் நான்கெழுத்துத் தேவப்பெயரை ஒரு பட்டமாக மாற்றாமல், அதன் பொதுவாக ஏற்கப்படும் ஒலிப்புக்கு நெருக்கமாகத் தமிழில் வழங்குகிறது.
- issue: இதயத்தின் நேர்மையும் சடங்குமுறைத் தூய்மையின்மையும்
  choice: தேவனைத் தேடும் உறுதியையும் தூய்மைமுறைப்படி தூய்மையடையாத நிலையையும் ஒன்றாக வைத்தல்
  alternative: இரண்டில் ஒன்றைத் தாழ்த்திக் காட்டும் விளக்கவுரை
  rationale: மூலம் உள்ளார்ந்த நோக்கத்தையும் வழிபாட்டுத் தூய்மைத் தரநிலைக்கு இணங்காத நிலையையும் அருகருகே வைக்கிறது; அவற்றின் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: முந்தைய வசனத்திலிருந்து தொடரும் வேண்டுதல்
  choice: ‘மன்னிப்பாராக’ என்பதைச் சேர்த்து முழு தமிழ் வாக்கியமாக வழங்குதல்
  alternative: ‘ஒவ்வொருவரையும்…’ என்ற வாக்கியத் துணுக்காக மட்டும் வழங்குதல்
  rationale: எபிரெய வசனப் பிரிப்பு 30:18-இல் தொடங்கிய வேண்டுதலை 30:19-இல் தொடர்கிறது. தமிழ் வாசிப்பில் பொருள் நிறைவடைய முந்தைய வசனத்தின் ஆளும் வினை மீட்டுரைக்கப்படுகிறது; புதிய இறையியல் கூற்று சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘இதயம்’, ‘முன்னோர்கள்’, ‘தூய்மைமுறை’ ஆகியவை பொதுவாசகருக்குப் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டுள்ளன. வசனம் முந்தைய வசனத்தின் வேண்டுதலைத் தொடர்வதால், தனித்து வாசிக்கக்கூடிய தமிழுக்காக ‘மன்னிப்பாராக’ மீட்டுரைக்கப்பட்டுள்ளது.
