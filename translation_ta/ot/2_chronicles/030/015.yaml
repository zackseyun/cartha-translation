source:
  edition: WLC
  text: וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם נִכְלְמוּ֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבִ֥יאוּ עֹל֖וֹת בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
translation:
  language: ta
  text: இரண்டாம் மாதத்தின் பதினான்காம் நாளில் அவர்கள் பஸ்காப் பலியை[a] அறுத்தார்கள். அப்போது ஆசாரியர்களும் லேவியர்களும் வெட்கமடைந்தார்கள்; தங்களைப் பரிசுத்தப்படுத்திக்கொண்டார்கள்; தகனபலிகளை யாவேயின் ஆலயத்துக்குக் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, ‘பஸ்கா’; இங்கு பஸ்காவுக்காக அறுக்கப்பட்ட பலிமிருகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: அறுத்தார்கள்
  rationale: שׁחט என்பது பலிக்குரிய மிருகத்தை அறுப்பதைக் குறிக்கிறது; தமிழில் ‘அறுத்தார்கள்’ என்பது சடங்குசார் சூழலை மிகைப்படுத்தாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַפֶּסַח
  choice: பஸ்காப் பலியை
  rationale: எபிரெயச் சொல் எழுத்துப்படி ‘பஸ்கா’ என்றாலும், இங்கு அறுக்கப்படும் பஸ்கா பலிமிருகத்தைக் குறிக்கிறது. ‘பஸ்காப் பலி’ என்பது ஆட்டுக்குட்டி என்ற ஒரே வகைக்குள் தேவையின்றி சுருக்காமல் பொருளைத் தெளிவாக்குகிறது.
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதத்தின் பதினான்காம் நாளில்
  rationale: எபிரெய நாட்காட்டிக் கூற்றை இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயப் பணியிலுள்ள כֹּהֲנִים என்பதற்கான பரவலாக அறியப்பட்ட தமிழ்ச் சொல்.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: ஆசாரியர்களிலிருந்து தனியே குறிப்பிடப்படும் லேவி குல ஆலயப் பணியாளர்களைக் குறிக்கிறது.
- source_word: נִכְלְמוּ
  choice: வெட்கமடைந்து
  rationale: நிபால் வடிவம் அடைந்த அவமானம் அல்லது வெட்கத்தைக் குறிக்கிறது; தொடரும் செயல்களோடு இணையும் இயல்பான தமிழ் வடிவம் இது.
- source_word: וַיִּתְקַדְּשׁוּ
  choice: தங்களைத் தூய்மைப்படுத்திக்கொண்டு
  rationale: ஆலயப் பணிக்கான சடங்குசார் தன்னிலைத் தூய்மைப்படுத்துதலைத் தெளிவாகவும் தற்போதைய தமிழிலும் தெரிவிக்கிறது.
- source_word: וַיָּבִיאוּ עֹלוֹת
  choice: தகனபலிகளைக் கொண்டுவந்தார்கள்
  rationale: עֹלוֹת என்பது முழுமையாக எரிக்கப்படும் பலிகளுக்கான வழக்கமான வேதாகமச் சொல்; ‘கொண்டுவந்தார்கள்’ என்பது בוא வினையின் பொருளை இயல்பாகத் தருகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயத்துக்கு
  rationale: எழுத்துப்படி ‘யாவேயின் வீடு’; இச்சூழலில் அது ஆலயத்தைக் குறிப்பதால் நவீன தமிழில் ‘ஆலயம்’ எனத் தெளிவாக வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: הַפֶּסַח என்பதன் குறிப்பிட்ட பலிமிருகம்
  choice: பஸ்காப் பலி
  alternative: பஸ்கா ஆட்டுக்குட்டி
  rationale: இங்கு சொல் அறுக்கப்படும் பலிமிருகத்தைக் குறித்தாலும், இவ்வசனமே அதை ஆட்டுக்குட்டி என்று குறிப்பாகச் சொல்லவில்லை. ஆகவே தேவையற்ற வகைநிர்ணயத்தைத் தவிர்த்து மூலத்தின் பரப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘பஸ்கா’, ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’, ‘தகனபலி’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தெளிவுக்காகத் தக்கவைக்கப்பட்டுள்ளன; இறைப்பெயர் ‘யாவே’ என நேரடியாக வழங்கப்பட்டுள்ளது.
