base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
translation:
  language: ta
  text: மக்களில் பெருந்திரளானோர், அதாவது எப்பிராயீம், மனாசே, இசக்கார், செபுலோன் கோத்திரங்களைச் சேர்ந்த பலர், தங்களைத் தூய்மைப்படுத்திக்கொள்ளவில்லை. இருந்தபோதிலும், எழுதப்பட்டிருக்கிறபடி அல்லாமல் அவர்கள் பஸ்கா உணவை உண்டார்கள். ஆனால் எசேக்கியா அவர்களுக்காக வேண்டிக்கொண்டு, “நல்லவராகிய யாவே பாவநிவிர்த்தி செய்வாராக—[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த வேண்டுதல் 19ஆம் வசனத்தில் தொடர்கிறது; எபிரெய மொழியில் இந்த வசனத்தின் இறுதியில் வாக்கியம் நிறைவுபெறாமல் நிற்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: מַרְבִּית הָעָם ... רַבַּת
  choice: மக்களில் பெருந்திரளானோர் ... பலர்
  rationale: மக்களுள் ஒரு பெரிய பகுதியைக் குறிக்கும் பங்கீட்டுப் பொருளையும், எபிரெய உரையின் எண்ணிக்கை வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது; ‘பெரும்பான்மையினர்’ என்று அளவுக்கு மீறித் தீர்மானிப்பதைத் தவிர்க்கிறது.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן
  choice: எப்பிராயீம், மனாசே, இசக்கார், செபுலோன் கோத்திரங்களைச் சேர்ந்த
  rationale: இவை இஸ்ரவேலின் கோத்திரப் பெயர்கள் என்பதை சாதாரண வாசகர் தெளிவாகப் புரிந்துகொள்ள ‘கோத்திரங்களைச் சேர்ந்த’ என்பது வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לֹא הִטֶּהָרוּ
  choice: தங்களைத் தூய்மைப்படுத்திக்கொள்ளவில்லை
  rationale: התפעל வினையின் தற்சார்புப் பொருளையும் சடங்குசார் தூய்மையையும் காக்கிறது.
- source_word: אָכְלוּ אֶת הַפֶּסַח
  choice: பஸ்கா உணவை உண்டார்கள்
  rationale: ‘பஸ்காவை உண்டார்கள்’ என்ற எபிரெய சொற்றொடரின் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘ஆட்டுக்குட்டி’ என்பதைச் சேர்க்கவில்லை.
- source_word: בְּלֹא כַכָּתוּב
  choice: எழுதப்பட்டிருக்கிறபடி அல்லாமல்
  rationale: எழுத்தில் கொடுக்கப்பட்ட நியமத்துக்கு ஒவ்வாத செயலை மூலத்திற்கு நெருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: הִתְפַּלֵּל ... עֲלֵיהֶם
  choice: அவர்களுக்காக வேண்டிக்கொண்டு
  rationale: மற்றவர்களின் சார்பாகச் செய்யப்பட்ட ஜெபத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַטּוֹב
  choice: நல்லவராகிய
  rationale: பெயரடை யாவேக்கு விளக்கமாக அமைந்திருப்பதை இயல்பான தமிழில் காக்கிறது.
- source_word: יְכַפֵּר בְּעַד
  choice: இவர்களுக்காகப் பாவநிவிர்த்தி செய்வாராக—
  rationale: பஸ்கா மற்றும் சடங்குத் தூய்மைச் சூழலில் כפר என்பதன் நிவிர்த்திசார் பொருளைக் காக்கிறது. வசன முடிவில் எபிரெய வாக்கியம் நிறைவடையாததை நீண்ட கோடு காட்டுகிறது; ‘இவர்களுக்காக’ என்பது முன் குறிப்பிடப்பட்டவர்களைத் தெளிவாகச் சுட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்னும் இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது பொருத்தமானது.
- issue: כפר என்பதன் சடங்குசார் பொருள்
  choice: பாவநிவிர்த்தி செய்வாராக
  alternative: மன்னிப்பாராக
  rationale: ‘மன்னிப்பு’ என்று மட்டும் பொருளைக் குறுக்காமல், பஸ்கா மற்றும் தூய்மைப்படுத்தல் சூழலிலுள்ள நிவிர்த்திசார் இறையியல் நுணுக்கத்தைப் பாதுகாக்கிறது.
- issue: வசனத்தின் முடிவிலுள்ள நிறைவுபெறாத வேண்டுதல்
  choice: நீண்ட கோட்டுடன் வாக்கியத்தைத் திறந்த நிலையில் வைத்தல்
  alternative: ‘இவர்களை மன்னிப்பாராக’ என்று வாக்கியத்தை நிறைவு செய்தல்
  rationale: எபிரெய வேண்டுதல் 19ஆம் வசனத்துக்குள் தொடர்கிறது; இந்த வசனத்திலேயே அதன் கருத்தைச் செயற்கையாக நிறைவு செய்யாமல் மூலத்தின் தொடர்ச்சியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தூய்மைப்படுத்திக்கொள்ளவில்லை’, ‘பஸ்கா உணவு’, ‘பாவநிவிர்த்தி’ ஆகியவை சடங்குசார் சூழலைத் தெளிவாக வைத்திருக்கின்றன; கோத்திரப் பட்டியல் அடைப்புக்கோட்டுப் பகுதியாக அமைக்கப்பட்டதால் நீண்ட வாக்கியம் வாசிக்க எளிதாகிறது.
