revisions:
- from: மக்களில் பெருந்திரளானோர்—எப்பிராயீம், மனாசே, இசக்கார், செபுலோன் கோத்திரங்களைச் சேர்ந்த பலர்—தங்களைத் தூய்மைப்படுத்திக்கொள்ளவில்லை. இருந்தபோதிலும், எழுதப்பட்டிருக்கிறபடி அல்லாமல் அவர்கள் பஸ்கா உணவை உண்டார்கள். ஆனால் எசேக்கியா அவர்களுக்காக வேண்டிக்கொண்டு, “நல்லவராகிய யாவே இவர்களுக்காகப் பாவநிவிர்த்தி செய்வாராக—” என்றான்.[a]
  to: மக்களில் பெருந்திரளானோர், அதாவது எப்பிராயீம், மனாசே, இசக்கார், செபுலோன் கோத்திரங்களைச் சேர்ந்த பலர், தங்களைத் தூய்மைப்படுத்திக்கொள்ளவில்லை. இருந்தபோதிலும், எழுதப்பட்டிருக்கிறபடி அல்லாமல் அவர்கள் பஸ்கா உணவை உண்டார்கள். ஆனால் எசேக்கியா அவர்களுக்காக வேண்டிக்கொண்டு, “நல்லவராகிய யாவே பாவநிவிர்த்தி செய்வாராக—[a]” என்றான்.
