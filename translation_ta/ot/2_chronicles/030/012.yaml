reference: 2 Chronicles 30:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: גַּ֣ם בִּ/יהוּדָ֗ה הָֽיְתָה֙ יַ֣ד הָ/אֱלֹהִ֔ים לָ/תֵ֥ת לָ/הֶ֖ם לֵ֣ב אֶחָ֑ד לַ/עֲשׂ֞וֹת מִצְוַ֥ת הַ/מֶּ֛לֶךְ וְ/הַ/שָּׂרִ֖ים בִּ/דְבַ֥ר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
translation:
  language: ta
  text: யூதாவிலும், அரசனும் அதிகாரிகளும் இட்ட கட்டளையை யாவேயின் வார்த்தையின்படி நிறைவேற்றுவதற்காக அவர்களுக்கு ஒரே இதயத்தை[a] அளிக்கக் கடவுளின் கை அவர்கள்மேல் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒன்றுபட்ட இதயத்தை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  choice: யூதாவிலும்
  rationale: גַּם என்பதன் சேர்க்கைப் பொருளையும், בִּיהוּדָה என்பதன் இடப்பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: הָיְתָה יַד הָאֱלֹהִים
  choice: கடவுளின் கை அவர்கள்மேல் இருந்தது
  rationale: தெய்வீக வல்லமை அல்லது செயல்பாட்டைக் குறிக்கும் எபிரேய உருவகத்தை விளக்கவுரையாக்காமல் பாதுகாக்கிறது; 'அவர்கள்மேல்' என்பது சூழலால் உணரப்படும் மறைமுகப் பொருளைத் தெளிவாக்குகிறது.
- source_word: לָתֵת לָהֶם לֵב אֶחָד
  choice: அவர்களுக்கு ஒரே இருதயத்தை அளிக்கும்படி
  rationale: நோக்கத்தைக் குறிக்கும் לָתֵת என்பதையும், 'ஒரே இருதயம்' என்ற மூல உருவகத்தையும் பாதுகாக்கிறது.
- source_word: לַעֲשׂוֹת מִצְוַת
  choice: கட்டளையை நிறைவேற்றுவதற்கு
  rationale: கட்டளைக்குக் கீழ்ப்படிந்து அதைச் செயல்படுத்துதல் என்ற சூழல் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: அரசனும் அதிகாரிகளும்
  rationale: שָּׂרִים என்பதன் ஆட்சி மற்றும் நிர்வாகப் பொறுப்புடையோர் என்ற பொருளுக்கு 'அதிகாரிகள்' இயல்பாகப் பொருந்துகிறது.
- source_word: בִּדְבַר יְהוָה
  choice: யெகோவாவின் வார்த்தையின்படி
  rationale: அரசனும் அதிகாரிகளும் கொடுத்த கட்டளை யெகோவாவின் வார்த்தைக்கு இசைந்திருந்தது என்ற தொடர்பைப் பாதுகாக்கிறது; בְּ இங்கு ஒத்திசைவு அல்லது நியமத்தைச் சுட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
theological_decisions:
- issue: “கடவுளின் கை அவர்கள்மேல் இருந்தது” என்பதில் தெய்வீகச் செயலின் தன்மை
  choice: மக்களிடம் ஒன்றுபட்ட மனவுறுதியை உண்டாக்கிய கடவுளின் செயலை வலுவாகக் கூறி, அதன் செயல்முறையை மேலதிகக் கோட்பாட்டு மொழியில் வரையறுக்காமல் வைத்தல்
  alternative: “கடவுள் அவர்களுக்கு உதவினார்” என வலிமையைக் குறைத்தல் அல்லது “கடவுள் அவர்களை எதிர்க்க முடியாதபடி கட்டாயப்படுத்தினார்” என விரிவுபடுத்தல்
  rationale: எபிரேய சொற்றொடர் மக்களின் ஒன்றுபட்ட கீழ்ப்படிதலைக் கடவுளின் செயலுடன் நேரடியாக இணைக்கிறது; ஆனால் அதன் துல்லியமான உளவியல் அல்லது கோட்பாட்டு செயல்முறையை வசனம் விளக்கவில்லை.
- issue: בִּדְבַר יְהוָה என்பதன் தொடர்பு
  choice: அரசனும் அதிகாரிகளும் கொடுத்த கட்டளை யெகோவாவின் வார்த்தையின்படி இருந்ததாக மொழிபெயர்த்தல்
  alternative: யெகோவாவின் வார்த்தை வெறும் கருவியாக இருந்தது என “வார்த்தையால்” என்று மொழிபெயர்த்தல்
  rationale: இங்கு בְּ என்பது கட்டளை தெய்வீக வார்த்தைக்கு ஒத்திருந்ததைச் சுட்டுவதாகச் சூழல் ஆதரிக்கிறது; ஆயினும் சொற்றொடரின் சுருக்கமான அமைப்பு அப்படியே பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட நடை. 'ஒரே இருதயம்' என்ற எபிரேய உருவகம் முதன்மை உரையில் வைக்கப்பட்டு, அதன் ஒன்றுபட்ட மனவுறுதி என்ற பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
