revisions:
- from: அப்போது லேவிய ஆசாரியர்கள்[a] எழுந்து மக்களை ஆசீர்வதித்தார்கள். அவர்களுடைய குரல் கேட்கப்பட்டது[b]; அவர்களுடைய விண்ணப்பம் அவருடைய பரிசுத்த வாசஸ்தலத்திற்கு, பரலோகத்திற்கு, சென்றடைந்தது[c].
  to: அப்போது ஆசாரியர்களான லேவியர்கள்[a] எழுந்து மக்களை ஆசீர்வதித்தார்கள். அவர்களுடைய குரல் கேட்கப்பட்டது[b]; அவர்களுடைய ஜெபம் அவருடைய பரிசுத்த வாசஸ்தலமாகிய பரலோகத்திற்குச் சென்றடைந்தது[c].
  rationale: திருத்தம் மூலத்தின் விளக்க இணைப்பைத் தெளிவாக்கி, תְּפִלָּה-க்கு நேரடியான தமிழ்ச் சொல்லைத் தேர்ந்தெடுத்து, ‘பரிசுத்த வாசஸ்தலம்’ மற்றும் ‘பரலோகம்’ ஒரே இடத்தை விளக்கும் இறுதி இணைநிலையை நவீன தமிழில் இயல்பாக அமைக்கிறது. கடவுளை வெளிப்படையான செய்பவராகச் சேர்க்காமல் செயப்பாட்டு வடிவம் தக்கவைக்கப்பட்டுள்ளது.
