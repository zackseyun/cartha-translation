base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
translation:
  language: ta
  text: அப்போது ஆசாரியர்களான லேவியர்கள்[a] எழுந்து மக்களை ஆசீர்வதித்தார்கள். அவர்களுடைய குரல் கேட்கப்பட்டது[b]; அவர்களுடைய ஜெபம் அவருடைய பரிசுத்த வாசஸ்தலமாகிய பரலோகத்திற்குச் சென்றடைந்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லேவிய ஆசாரியர்கள்.” எபிரெயத் தொடரை “ஆசாரியர்கள், லேவியர்கள்” என்று விளக்க இணைப்பாகவும் வாசிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய குரலுக்குச் செவிசாய்க்கப்பட்டது.” செயப்பாட்டு வடிவம் கடவுள் அவர்களுடைய குரலைக் கேட்டார் என்பதை மறைமுகமாக உணர்த்தலாம்.
    reason: alternative_reading
  - marker: c
    text: அல்லது, “அவருடைய பரிசுத்த வாசஸ்தலத்திற்கு, வானங்களுக்கு.” எபிரெயத்தில் ‘வானங்கள்’ என்பது பன்மை வடிவத்தில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: எழுந்து
  rationale: קום என்பதன் இச்சூழலுக்குரிய நேரடியான பொருளான எழுதல் அல்லது எழுந்து நிற்றலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: லேவிய ஆசாரியர்கள்
  rationale: இரு பெயர்ச்சொற்களையும் ஒரே குழுவைக் குறிக்கும் விளக்கத் தொடராகப் புரிந்துகொண்டு, இரண்டு தனித்தனி குழுக்கள் என்ற எண்ணத்தைத் தவிர்க்கிறது.
- source_word: וַיְבָרֲכוּ אֶת־הָעָם
  choice: மக்களை ஆசீர்வதித்தார்கள்
  rationale: ברך என்பது இங்கு மக்கள்மேல் ஆசீர்வாதம் உரைப்பதைக் குறிக்கிறது; வழக்கமான தெளிவான தமிழ் சொற்றொடர் பயன்படுத்தப்பட்டது.
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  choice: அவர்களுடைய குரல் கேட்கப்பட்டது
  rationale: எபிரெய வினையின் செயப்பாட்டு வடிவத்தைப் பாதுகாத்து, கேட்பவராகக் கடவுளை மூலத்தில் இல்லாத விதத்தில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: תְפִלָּתָם
  choice: அவர்களுடைய விண்ணப்பம்
  rationale: תְּפִלָּה என்பது கடவுளை நோக்கிய மன்றாட்டு அல்லது விண்ணப்பத்தைக் குறிக்கிறது; ஒருமை வடிவத்தின் கூட்டுப் பொருளும் பாதுகாக்கப்படுகிறது.
- source_word: לִמְעוֹן קָדְשׁוֹ
  choice: அவருடைய பரிசுத்த வாசஸ்தலத்திற்கு
  rationale: מָעוֹן என்பதிலுள்ள வசிப்பிட உருவகத்தை dignified, current Tamil-இல் இயல்பாகத் தருகிறது.
- source_word: לַשָּׁמָיִם
  choice: பரலோகத்திற்கு
  rationale: முந்தைய வாசஸ்தலத்தை விளக்கும் இணைநிலைத் தொடராகவும், ל முன்னொட்டின் திசைநோக்கையும் காத்தும் மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: ‘குரல் கேட்கப்பட்டது’ என்பதில் கடவுளை வெளிப்படையான செய்பவராகச் சேர்ப்பதா
  choice: செயப்பாட்டு வடிவமான ‘அவர்களுடைய குரல் கேட்கப்பட்டது’ என்பதைத் தக்கவைத்தல்
  alternative: ‘கடவுள் அவர்களுடைய குரலைக் கேட்டார்’
  rationale: சூழல் கடவுளுடைய கேட்பை உணர்த்தினாலும், எபிரெய உரை இவ்வாக்கியத்தில் அவரை வெளிப்படையான எழுவாயாகக் குறிப்பிடவில்லை.
- issue: ‘ஆசாரியர்கள், லேவியர்கள்’ என்ற தொடரின் உறவு
  choice: ஒரே குழுவை அடையாளப்படுத்தும் ‘லேவிய ஆசாரியர்கள்’
  alternative: ‘ஆசாரியர்களும் லேவியர்களும்’
  rationale: எபிரெய சொற்றொடர் பெரும்பாலும் விளக்க இணைப்பாக இருந்து, ஆசாரியர்களை லேவியர்கள் என்று அடையாளப்படுத்துகிறது; மாற்று வாசிப்பு இரண்டு குழுக்களைக் குறிக்கலாம்.
- issue: பரிசுத்த வாசஸ்தலமும் பரலோகமும் இடையிலான உறவு
  choice: ‘அவருடைய பரிசுத்த வாசஸ்தலத்திற்கு, பரலோகத்திற்கு’ என்று இரு கூறுகளையும் வைத்தல்
  alternative: ‘பரலோகத்திலுள்ள அவருடைய பரிசுத்த வாசஸ்தலத்திற்கு’
  rationale: மூலத்தின் இணைநிலை அமைப்பையும் திசைநோக்கையும் காத்து, இரண்டாம் கூறை வெறும் இடக்குறிப்பாக மட்டும் மாற்றாமல் விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், அதேவேளையில் வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘வாசஸ்தலம்’, ‘பரிசுத்தம்’, ‘ஆசீர்வதித்தார்கள்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தெளிவுக்காகத் தக்கவைக்கப்பட்டன; எபிரெயத்தின் செயப்பாட்டு வடிவமும் இறுதி இணைநிலைத் தொடரும் சாத்தியமான அளவு பாதுகாக்கப்பட்டன.
