translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான செயல்களும் ‘அகற்றினார்கள்’ என்ற மீளுரைப்பும் காக்கப்பட்டுள்ளன. தெளிவில்லாத வழிபாட்டு அமைப்புச் சொல்லும் נחל என்பதன் புவியியல் பரப்பும் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
