base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
translation:
  language: ta
  text: அவர்கள் எழுந்து, எருசலேமிலிருந்த பலிபீடங்களை அகற்றினார்கள். தூபம் காட்டும் மேடைகள்[a] அனைத்தையும் அகற்றி, அவற்றைக் கீதரோன் பள்ளத்தாக்கில்[b] எறிந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தூபம் காட்டும் இடங்கள்,” அல்லது “தூப மேடைகள்.” எபிரெயச் சொல் தூபம் எரிப்பதுடன் தொடர்புடைய வழிபாட்டு அமைப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “கீதரோன் வாடி/ஓடை/பள்ளத்தாக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: அவர்கள் எழுந்து
  rationale: קום என்பதன் கதைநடை வடிவம் அடுத்த தீர்மானமான செயலுக்கு முன்னுரையாக வருகிறது; ‘எழுந்து’ என்பது அந்த நகர்வை இயல்பாகத் தக்கவைக்கிறது.
- source_word: וַיָּסִירוּ / הֵסִירוּ
  choice: அகற்றினார்கள்
  rationale: இரு இடங்களிலும் causative வடிவில் ‘அகற்று/அப்புறப்படுத்து’ என்று பொருள்; ஒரே தமிழ்ச் சொல்லைப் பயன்படுத்துவது மூலத்தின் மீளுரைப்பைக் காக்கிறது.
- source_word: הַמִּזְבְּחוֹת
  choice: பலிபீடங்களை
  rationale: מזבח என்பதற்கான வழக்கமான, தெளிவான தமிழாக்கம் ‘பலிபீடம்’; இங்கு பன்மை வடிவம் காக்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: எருசலேமிலிருந்த
  rationale: ‘எருசலேமில் இருந்த’ என்ற தொடர்புத் தொடரை இயல்பான நவீனத் தமிழில் பெயரெச்சமாக வழங்குகிறது.
- source_word: הַמְקַטְּרוֹת
  choice: தூபங்காட்டும் மேடைகள்
  rationale: קטר வேருடன் தொடர்புடைய இச்சொல் தூபம் எரிக்கும் வழிபாட்டு அமைப்புகளைக் குறிக்கிறது. அது குறிப்பாகப் பலிபீடங்களா, மேடைகளா, இடங்களா என்பது உறுதியில்லாததால், ‘மேடைகள்’ என வழங்கி மாற்றுப் பொருள்களை அடிக்குறிப்பில் வைத்துள்ளோம்.
- source_word: וַיַּשְׁלִיכוּ
  choice: எறிந்தார்கள்
  rationale: שׁלך என்பதன் வலுவான அப்புறப்படுத்தும் செயலை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לְנַחַל קִדְרוֹן
  choice: கீதரோன் பள்ளத்தாக்கில்
  rationale: נחל என்பது ஓடை, நீரோடைப் பள்ளம் அல்லது பருவகால நீரோட்டமுள்ள பள்ளத்தாக்கைக் குறிக்கலாம். பொதுவாசகருக்குத் தெளிவான ‘பள்ளத்தாக்கு’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, சொற்பொருள் விரிவு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
