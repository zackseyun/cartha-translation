base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
translation:
  language: ta
  text: யூதாவின் முழுச் சபையும், ஆசாரியர்களும் லேவியர்களும், இஸ்ரவேலிலிருந்து வந்திருந்த முழுச் சபையும், இஸ்ரவேல் நாட்டிலிருந்து வந்திருந்த குடியேறி வாழும் அந்நியர்களும்[a], யூதாவில் வாழ்ந்தவர்களும் மகிழ்ந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அந்நியக் குடியிருப்பாளர்களும்.” எபிரெயச் சொல் גֵּרִים, இஸ்ரவேலரிடையே குடியேறி வாழ்ந்த அந்நியர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: மகிழ்ந்தார்கள்
  rationale: שׂמח என்பது மகிழ்ச்சி அடைதல் அல்லது மகிழ்ந்திருத்தலைக் குறிக்கிறது. “மகிழ்ந்தார்கள்” என்பது கொண்டாட்டத்தின் முறையைத் தேவையின்றி குறிப்பாக்காமல் இயல்பான தமிழில் வினைச்சொல் பொருளைப் பாதுகாக்கிறது.
- source_word: כָּל קְהַל יְהוּדָה
  choice: யூதாவின் சபையார் அனைவரும்
  rationale: קהל என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. “சபையார்” என்பது இங்கு கூடியிருந்த மக்களை இயல்பாகக் குறிக்கிறது; பிற்காலத் திருச்சபை சார்ந்த தனிப்பொருளைத் திணிக்கவில்லை.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: இஸ்ரவேலின் வழிபாட்டுப் பணியாளர்களைக் குறிக்கும் כֹּהֲנִים என்பதற்கான நிலையான, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் சொல்.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: ஆசாரியர்களிலிருந்து தனியே குறிப்பிடப்படும் லேவி குலத்தாரைத் துல்லியமாகக் குறிக்கிறது.
- source_word: כָל הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து வந்திருந்த சபையார் அனைவரும்
  rationale: הַבָּאִים என்ற பங்கேற்புவினை வடிவம் இஸ்ரவேலிலிருந்து வந்தவர்களை அடையாளப்படுத்துகிறது. கதை நிகழ்ந்த காலத்திற்கு முன்பே அவர்கள் வந்திருந்ததை “வந்திருந்த” இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַגֵּרִים
  choice: அந்நியக் குடியிருப்பாளர்கள்
  rationale: גֵּרִים என்பது இஸ்ரவேலரிடையே வாழ்ந்த, அந்நாட்டைப் பிறப்பிடமாகக் கொள்ளாத குடியிருப்பாளர்களைக் குறிக்கிறது. “அந்நியக் குடியிருப்பாளர்கள்” அவர்களுடைய அந்நியப் பின்னணியையும் அங்கே தங்கியிருக்கும் சமூக நிலையையும் சேர்த்துப் பாதுகாக்கிறது.
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  choice: இஸ்ரவேல் நாட்டிலிருந்து வந்திருந்த
  rationale: אֶרֶץ יִשְׂרָאֵל என்பதன் புவியியல் பொருளை “இஸ்ரவேல் நாடு” தெளிவாக வெளிப்படுத்துகிறது; யூதாவிலிருந்து வேறுபட்ட அவர்களுடைய வருகையிடத்தையும் காக்கிறது.
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  choice: யூதாவில் குடியிருந்தவர்கள்
  rationale: ישׁב என்பதன் பங்கேற்புவினை வடிவம் ஓர் இடத்தில் வசிப்பதைக் குறிக்கிறது. “குடியிருந்தவர்கள்” அந்த நீடித்த வசிப்பை இயல்பான தமிழில் தருகிறது.
