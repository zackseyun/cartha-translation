translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம வரலாற்றுச் சூழலுக்கேற்ற கண்ணியமும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெயப் பட்டியல் அமைப்பு தமிழில் தெளிவாக இருக்க இணைப்பு தொடர்கள் பாதுகாக்கப்பட்டுள்ளன. வழங்கப்பட்ட ஆங்கில உரையில் அடிக்குறிக் குறி “rejoiced” என்பதற்குப் பின் இருந்தாலும், அதன் உள்ளடக்கம் הַגֵּרִים என்பதைக் குறிக்கும் என்பதால் தமிழில் தொடர்புடைய “அந்நியக் குடியிருப்பாளர்களும்” என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
