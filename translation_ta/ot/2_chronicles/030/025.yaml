- from: யூதாவின் சபையார் அனைவரும், ஆசாரியர்களும் லேவியர்களும், இஸ்ரவேலிலிருந்து வந்திருந்த சபையார் அனைவரும், இஸ்ரவேல் நாட்டிலிருந்து வந்திருந்த அந்நியக் குடியிருப்பாளர்களும்[a], யூதாவில் குடியிருந்தவர்களும் மகிழ்ந்தார்கள்.
