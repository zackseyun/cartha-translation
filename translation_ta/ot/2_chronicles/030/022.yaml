  text: וַ/יְדַבֵּ֣ר יְחִזְקִיָּ֗הוּ עַל לֵב֙ כָּל הַ/לְוִיִּ֔ם הַ/מַּשְׂכִּילִ֥ים שֵֽׂכֶל ט֖וֹב לַ/יהוָ֑ה וַ/יֹּאכְל֤וּ אֶת הַ/מּוֹעֵד֙ שִׁבְעַ֣ת הַ/יָּמִ֔ים מְזַבְּחִים֙ זִבְחֵ֣י שְׁלָמִ֔ים וּ/מִ֨תְוַדִּ֔ים לַ/יהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
translation:
  language: ta
  text: எசேக்கியா, யாவேக்குரிய பணியில் நல்ல அறிவுத்திறன் கொண்டிருந்த லேவியர் அனைவரிடமும் ஊக்கமளிக்கும் விதத்தில் பேசினார்[a][b]. அவர்கள் ஏழு நாட்களும் பண்டிகை விருந்தை உண்டு, சமாதானப் பலிகளைச் செலுத்தி[c], தங்கள் தந்தையரின் தேவனாகிய யாவேக்கு நன்றி செலுத்தினார்கள்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “லேவியர் அனைவரின் இதயத்திடமும் பேசினார்”; இது அன்பாக, ஆறுதலாக அல்லது ஊக்கமளிக்கும் விதத்தில் பேசுவதைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: b
    text: “யாவே குறித்து நல்ல புரிந்துணர்வு கொண்டிருந்த” அல்லது “யாவேக்குரியவற்றில் திறமை வாய்ந்திருந்த” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “சமாதானப் பலிகள்” என்பதை “உறவுப் பலிகள்” அல்லது “நலவாழ்வுப் பலிகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: இந்த வினைச்சொல் “அறிக்கையிடுதல்,” “பாவங்களை ஒப்புக்கொள்ளுதல்” அல்லது “துதித்தல்” என்றும் பொருள்படலாம்; இங்கு வழிபாட்டில் நன்றி செலுத்துதல் என்ற பொருள் பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  choice: ஊக்கமளிக்கும் விதத்தில் பேசினார்
  rationale: ‘இதயத்திடம் பேசுதல்’ என்ற எபிரெய மரபுத்தொடர், இச்சூழலில் மனத்தைத் தேற்றும் அல்லது ஊக்கப்படுத்தும் பேச்சைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் அதன் பொருள் தரப்பட்டுள்ளது.
- source_word: הַלְוִיִּם
  choice: லேவியர்
  rationale: ஆலயப் பணியுடன் தொடர்புடைய குலத்தாரைக் குறிக்கும் வழக்கமான தமிழ்ப் பெயர்.
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב
  choice: நல்ல புரிந்துணர்வை வெளிப்படுத்திய
  rationale: שׂכל என்ற வேர்ச்சொல்லின் வினையெச்சமும் அதே வேரின் பெயர்ச்சொல்லும் சேர்ந்து அறிவு, விவேகம், திறமை ஆகியவற்றை வலியுறுத்துகின்றன. செயற்பாட்டுத் தன்மையை ‘வெளிப்படுத்திய’ என்பது காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்குரிய பணியில்
  rationale: ל என்ற முன்னொட்டு இங்கு யாவேக்கு உரிய வழிபாட்டு அல்லது பணிசார் உறவைக் குறிக்க வாய்ப்புள்ளது; சூழலுக்கேற்ற பொருள் இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וַיֹּאכְלוּ אֶת־הַמּוֹעֵד
  choice: பண்டிகை விருந்தை உண்டு
  rationale: மூலத்தில் ‘பண்டிகை/குறிக்கப்பட்ட காலத்தை உண்டார்கள்’ என்று நேரடியாக உள்ளது. தமிழில் உண்ணப்படும் பொருளைக் குறிக்க ‘பண்டிகை விருந்து’ என்று இயல்பாகத் தரப்பட்டுள்ளது; கொண்டாடுதல் என்று மட்டும் மாற்றப்படவில்லை.
- source_word: שִׁבְעַת הַיָּמִים
  choice: ஏழு நாட்களும்
  rationale: கால நீட்சியை இயல்பான தமிழில் குறிக்கிறது.
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  choice: சமாதானப் பலிகளைச் செலுத்தி
  rationale: זִבְחֵי שְׁלָמִים என்ற குறிப்பிட்ட பலிவகையின் வழக்கமான, அடையாளம் காணத்தக்க தமிழாக்கம்.
- source_word: וּמִתְוַדִּים
  choice: நன்றி செலுத்தினார்கள்
  rationale: ידה என்பதன் ஹித்பயேல் வடிவம் அறிக்கையிடுதல், பாவத்தை ஒப்புக்கொள்ளுதல், துதித்தல் அல்லது நன்றி செலுத்துதல் எனப் பொருள்படலாம். மகிழ்ச்சியான பண்டிகை வழிபாட்டுச் சூழலில் ‘நன்றி செலுத்துதல்’ பொருத்தமானது; வேறு சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: தங்கள் தந்தையரின் தேவன்
  rationale: மூலத்தின் ஆண்பால் மூதாதையர் குறிப்பையும் உடன்படிக்கை சார்ந்த வழக்குச் சொல்லையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பாக ‘யாவே’ என்று தருவது உடன்படிக்கைப் பெயரை வெளிப்படையாகக் காக்கிறது.
- issue: וּמִתְוַדִּים என்பதன் வழிபாட்டுச் செயல்
  choice: நன்றி செலுத்தினார்கள்
  alternative: அறிக்கையிட்டார்கள்; துதித்தார்கள்; பாவங்களை ஒப்புக்கொண்டார்கள்
  rationale: பலிகளோடு கூடிய பண்டிகை வழிபாட்டுச் சூழல் நன்றி அல்லது துதி என்ற பொருளை ஆதரிக்கிறது; இருப்பினும் வினையின் உண்மையான பொருள் விரிவு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘லேவியர்,’ ‘பலி,’ ‘தேவன்’ போன்ற நிலைபெற்ற சமயச் சொற்கள் தேவையான இடங்களில் காக்கப்பட்டுள்ளன. மூலத்தின் ஐயப்பாடுகள் அடிக்குறிப்புகளில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
