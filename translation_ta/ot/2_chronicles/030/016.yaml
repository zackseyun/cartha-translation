revisions:
- from: அவர்கள் தங்களுக்குரிய இடங்களில், தங்களுக்காக விதிக்கப்பட்ட முறைப்படியும், இறைவனின் மனிதரான மோசேயின் திருச்சட்டத்தின்படியும் நின்றார்கள். லேவியர்களிடமிருந்து பெற்ற இரத்தத்தை[a] ஆசாரியர்கள் தெளித்துக்கொண்டிருந்தார்கள்.
  to: அவர்கள் தங்கள் இடத்தில், தங்களுக்காக விதிக்கப்பட்ட முறைப்படி, இறைவனுடைய மனிதரான மோசேயின் சட்டத்தின்படி நின்றார்கள். ஆசாரியர்கள் லேவியர்களிடமிருந்து பெற்ற இரத்தத்தை[a] தெளித்தார்கள்.
