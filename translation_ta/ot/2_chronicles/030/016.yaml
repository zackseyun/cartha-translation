  text: וַ/יַּֽעַמְד֤וּ עַל עָמְדָ/ם֙ כְּ/מִשְׁפָּטָ֔/ם כְּ/תוֹרַ֖ת מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֑ים הַ/כֹּֽהֲנִים֙ זֹרְקִ֣ים אֶת הַ/דָּ֔ם מִ/יַּ֖ד הַ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/016.yaml
  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
translation:
  language: ta
  text: அவர்கள் தங்கள் இடத்தில், தங்களுக்காக விதிக்கப்பட்ட முறைப்படி, இறைவனுடைய மனிதரான மோசேயின் சட்டத்தின்படி நின்றார்கள். ஆசாரியர்கள் லேவியர்களிடமிருந்து பெற்ற இரத்தத்தை[a] தெளித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “லேவியர்களின் கையிலிருந்து இரத்தத்தை.”
    reason: ‘லேவியர்களிடமிருந்து பெற்ற’ என்பது மூலத்தின் சுருக்கமான ‘லேவியர்களின் கையிலிருந்து’ என்ற சொல்லமைப்பை விளக்கும் வகையில் தரப்பட்டுள்ளது.
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל עָמְדָם
  choice: அவர்கள் தங்களுக்குரிய இடங்களில் ... நின்றார்கள்
  rationale: עמד என்பதன் ‘நின்றார்கள்’ என்ற உடல்சார் பொருளையும், עַל עָמְדָם குறிக்கும் அவரவருக்குரிய சடங்கு நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּמִשְׁפָּטָם
  choice: தங்களுக்காக விதிக்கப்பட்ட முறைப்படி
  rationale: வழக்கமான பழக்கம் என்பதைவிட, இச்சடங்கில் அவர்களுக்கென வரையறுக்கப்பட்ட நடைமுறை என்ற מִשְׁפָּטின் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: כְּתוֹרַת מֹשֶׁה
  choice: மோசேயின் திருச்சட்டத்தின்படி
  rationale: תוֹרָה இங்கு பஸ்கா வழிபாட்டை ஒழுங்குபடுத்தும் மோசேயின் சட்டபூர்வ போதனையைக் குறிக்கிறது; ‘திருச்சட்டம்’ அதன் சமயச் சூழலையும் மரியாதைத் தொனியையும் காக்கிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதரான
  rationale: மோசேக்கு வழங்கப்படும் நிலையான வேதாகமப் பட்டத்தை நேரடியாகவும் புரிந்துகொள்ளத்தக்க வகையிலும் தருகிறது.
- source_word: הַכֹּהֲנִים זֹרְקִים אֶת הַדָּם
  choice: இரத்தத்தை ஆசாரியர்கள் தெளித்துக்கொண்டிருந்தார்கள்
  rationale: பலிச் சடங்கில் זרק என்பது இரத்தத்தைச் சடங்குமுறையில் பயன்படுத்துவதைச் சுட்டுகிறது. ‘தெளித்துக்கொண்டிருந்தார்கள்’ என்பது செயல் நடைபெற்றுக்கொண்டிருந்த தன்மையையும் தமிழில் இயல்பாகத் தருகிறது.
- source_word: מִיַּד הַלְוִיִּם
  choice: லேவியர்களிடமிருந்து பெற்ற
  rationale: சொல்லுக்குச் சொல் ‘லேவியர்களின் கையிலிருந்து’ என்றாலும், இரத்தம் அவர்களிடமிருந்து ஆசாரியர்களுக்குக் கொடுக்கப்பட்டது என்ற உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: பலிச் சடங்கில் இரத்தத்தைப் பயன்படுத்திய செயலைக் குறிக்கும் சொல்
  choice: தெளித்துக்கொண்டிருந்தார்கள்
  alternative: வீசிக்கொண்டிருந்தார்கள் / எறிந்துகொண்டிருந்தார்கள்
  rationale: זרק என்பதன் அடிப்படைப் பொருள் ‘எறிதல்’ அல்லது ‘வீசுதல்’ ஆக இருக்கலாம். ஆனால் பலிச் சடங்குச் சூழலில் ‘தெளித்தல்’ அந்தச் செயலைத் தவறான சாதாரண அர்த்தமின்றி விளக்குகிறது; வசனத்தில் வெளிப்படையாக இல்லாத பிற்கால இறையியல் கருத்தையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘தங்களுக்காக விதிக்கப்பட்ட முறை’ என்பது வெறும் பழக்கத்தை அல்ல, ஒழுங்குபடுத்தப்பட்ட சடங்கு நடைமுறையைச் சுட்டுகிறது. மூலத்தில் இல்லாத ‘பலிபீடம்’ போன்ற விவரம் சேர்க்கப்படவில்லை.
