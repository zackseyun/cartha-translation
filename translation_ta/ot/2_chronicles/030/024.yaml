source:
  edition: WLC
  text: כִּ֣י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְ֠הוּדָה הֵרִ֨ים לַ/קָּהָ֜ל אֶ֣לֶף פָּרִים֮ וְ/שִׁבְעַ֣ת אֲלָפִ֣ים צֹאן֒ וְ/הַ/שָּׂרִ֞ים הֵרִ֤ימוּ לַ/קָּהָל֙ פָּרִ֣ים אֶ֔לֶף וְ/צֹ֖אן עֲשֶׂ֣רֶת אֲלָפִ֑ים וַ/יִּֽתְקַדְּשׁ֥וּ כֹהֲנִ֖ים לָ/רֹֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
translation:
  language: ta
  text: ஏனெனில், யூதாவின் அரசன் எசேக்கியா சபையாருக்கு ஆயிரம் காளைகளையும் ஏழாயிரம் மந்தை விலங்குகளையும்[a] கொடுத்தான்; அதிகாரிகளும் சபையாருக்கு ஆயிரம் காளைகளையும் பத்தாயிரம் மந்தை விலங்குகளையும் கொடுத்தார்கள். ஏராளமான ஆசாரியர்கள் தங்களைப் பரிசுத்தப்படுத்திக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மந்தை விலங்குகள்” என்பது எபிரெயச் சொல்லான צֹאן-ஐ மொழிபெயர்க்கிறது. இது செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கலாம்; பெரிய கால்நடைகளை அல்ல.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: (தனி இணைப்புச் சொல் விடப்பட்டுள்ளது)
  rationale: இவ்வசனம் முந்தைய கூற்றை விளக்குகிறது. தமிழில் தனி வசனமாகவும் இயல்பாக வாசிக்க, காரண இணைப்பு வாக்கிய ஒழுங்கிலேயே உணர்த்தப்படுகிறது; ‘ஏனெனில்’ எனத் தொடங்குவது இங்கு கனமாக அமையும்.
- source_word: הֵרִים / הֵרִימוּ
  choice: கொடுத்தான் / கொடுத்தார்கள்
  rationale: இங்கு ரום என்பதன் ஹிஃபில் வடிவம், கூடியிருந்த மக்களின் வழிபாட்டுப் பயன்பாட்டுக்காக விலங்குகளை வழங்குவதைக் குறிக்கிறது; சொல்லுக்குச் சொல் ‘உயர்த்தினார்’ என்பது பொருத்தமல்ல.
- source_word: לַקָּהָל
  choice: சபையாருக்கு
  rationale: קהל என்பது பண்டிகைக்காகக் கூடியிருந்த சமூகத்தைக் குறிக்கிறது. לְ முன்னிடைச்சொல்லின் பெறுநர் பொருளை ‘-க்கு’ இயல்பாகக் காக்கிறது.
- source_word: אֶלֶף פָּרִים
  choice: ஆயிரம் காளைகள்
  rationale: פָּרִים என்பது பலிக்குரிய ஆண் மாடுகளைக் குறிக்கும் நேரடியான சொல்; ‘காளைகள்’ தெளிவான நவீனத் தமிழ்.
- source_word: שִׁבְעַת אֲלָפִים צֹאן / צֹאן עֲשֶׂרֶת אֲלָפִים
  choice: ஏழாயிரம் / பத்தாயிரம் ஆடுமாடுகள்
  rationale: צֹאן என்பது செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் உள்ளிட்ட சிறு கால்நடை மந்தையைப் பொதுவாகக் குறிக்கலாம். ‘ஆடுமாடுகள்’ என்ற வழக்குச் சொல் பரந்த கூட்டுப்பொருளை வாசிக்க எளிதாகத் தருகிறது; இங்கு ‘மாடு’ பெரிய கால்நடையைக் குறிப்பதாகத் தவறாகப் புரியக்கூடும் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: הַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: שׂרים என்பது உயர்நிலை ஆட்சித் தலைவர்களைக் குறிக்கிறது; ‘அதிகாரிகள்’ மரபுரிமை இளவரசர்கள் என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים
  choice: ஆசாரியர்கள் தங்களைப் பரிசுத்தப்படுத்திக்கொண்டார்கள்
  rationale: קדשׁ என்பதன் ஹித்பயேல் வடிவிலுள்ள தற்சுட்டுப் பொருளையும், வழிபாட்டுப் பணிக்காகத் தங்களை ஆயத்தமாகப் பிரித்துவைத்த சடங்குசார் கருத்தையும் காக்கிறது.
- source_word: לָרֹב
  choice: ஏராளமான
  rationale: ஆசாரியர்கள் பெரும் எண்ணிக்கையில் ஆயத்தமானார்கள் என்ற அளவுப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ஆசாரியர்களின் சடங்குசார் ஆயத்தம்
  choice: தங்களைப் பரிசுத்தப்படுத்திக்கொண்டார்கள்
  alternative: தங்களைத் தூய்மைப்படுத்திக்கொண்டார்கள்
  rationale: மூலச்சொல் வெறும் அசுத்தநீக்கத்தை மட்டும் அல்லாமல், புனிதப் பணிக்காகத் தங்களை ஒதுக்கி ஆயத்தப்படுத்துவதையும் குறிக்கிறது. ‘பரிசுத்தப்படுத்திக்கொண்டார்கள்’ அந்த வழிபாட்டுச் சார்ந்த அழுத்தத்தைப் பாதுகாக்கிறது; எந்தப் பிரிவுசார் கோட்பாட்டையும் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டு வரலாற்றுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘சபையார்’, ‘ஆசாரியர்கள்’, ‘பரிசுத்தப்படுத்திக்கொண்டார்கள்’ ஆகியவை வேதாகமச் சூழலைத் தக்கவைத்தபடியே இயல்பாக உள்ளன. அடிக்குறிப்பு குறியீடு உரையில் இடம்பெற்றுள்ளது.
