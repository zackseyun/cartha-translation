base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/013.yaml
  text: A great many people gathered in Jerusalem to keep the Festival of Unleavened Bread in the second month[b][a], a very great assembly.
translation:
  language: ta
  text: 'இரண்டாம் மாதத்தில் புளிப்பில்லா அப்பத் திருவிழாவை[b] கொண்டாடுவதற்காக[a] ஏராளமான மக்கள் எருசலேமில் கூடினார்கள்; அது மிகப் பெரிய கூட்டமாக இருந்தது.


    [a] “கடைப்பிடிப்பதற்காக” என்றும் மொழிபெயர்க்கலாம்; எபிரெய மொழியில் சொல்லுக்குச் சொல், “திருவிழாவைச் செய்வதற்காக.”

    [b] “புளிப்பில்லா அப்பப் பண்டிகை” என்றும் மொழிபெயர்க்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கடைப்பிடிப்பதற்காக” என்றும் மொழிபெயர்க்கலாம்; எபிரெய மொழியில் சொல்லுக்குச் சொல், “திருவிழாவைச் செய்வதற்காக.”
    reason: lexical_alternative
  - marker: b
    text: “புளிப்பில்லா அப்பப் பண்டிகை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: கூடினார்கள்
  rationale: நிபால் வடிவிலுள்ள אסף மக்கள் ஒன்றாகத் திரண்டதைக் குறிக்கிறது. “கூடினார்கள்” என்பது இயல்பான நவீனத் தமிழில் நிகழ்வின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יְרוּשָׁלִַם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட இடப்பெயர் வடிவம்.
- source_word: עַם רָב
  choice: ஏராளமான மக்கள்
  rationale: மக்கள் மிகுந்த எண்ணிக்கையில் இருந்தனர் என்ற அளவுசார் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַעֲשׂוֹת
  choice: கொண்டாடுவதற்காக
  rationale: இதன் அடிப்படைப் பொருள் “செய்தல்” என்றாலும், திருவிழாவைச் செயப்படுபொருளாகக் கொண்ட இச்சூழலில் அதைக் கொண்டாடுதல் அல்லது கடைப்பிடித்தல் என்று பொருள். “கொண்டாடுதல்” இயல்பான தமிழ்ச் சொல்லாகும்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: חַג הַמַּצּוֹת
  choice: புளிப்பில்லா அப்பத் திருவிழா
  rationale: חַג ஒரு சமயத் திருவிழாவைக் குறிக்கிறது; מַצּוֹת புளிப்பூட்டப்படாத அப்பங்களைக் குறிக்கிறது. “திருவிழா” நவீன வாசகர்களுக்குத் தெளிவானது; “பண்டிகை” மாற்றாகக் குறிப்பிடப்பட்டுள்ளது.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதத்தில்
  rationale: காலக்குறிப்பை நேரடியாகவும் முறையாகவும் காக்கிறது; சூழலில் இந்தக் காலவரிசை முக்கியமானது.
- source_word: קָהָל
  choice: கூட்டம்
  rationale: ஒன்றுகூடிய மக்கள் சமூகத்தை இங்கு குறிக்கிறது. “கூட்டம்” தேவையற்ற திருச்சபை சார்ந்த நுண்பொருளைச் சேர்க்காமல் இயல்பாக உள்ளது.
- source_word: לָרֹב מְאֹד
  choice: மிகப் பெரிய
  rationale: கூட்டத்தின் அளவை மிகவும் வலியுறுத்தும் எபிரெயச் சொற்றொடரின் தாக்கத்தை இயல்பான தமிழில் காக்கிறது.
