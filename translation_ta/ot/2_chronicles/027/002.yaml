source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/יָּשָׁ֜ר בְּ/עֵינֵ֣י יְהוָ֗ה כְּ/כֹ֤ל אֲשֶׁר עָשָׂה֙ עֻזִּיָּ֣הוּ אָבִ֔י/ו רַ֕ק לֹא בָ֖א אֶל הֵיכַ֣ל יְהוָ֑ה וְ/ע֥וֹד הָ/עָ֖ם מַשְׁחִיתִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done—except that he did not enter the temple of Yahweh[b]. But the people still acted corruptly.
translation:
  language: ta
  text: அவன் தன் தந்தை உசியா செய்த அனைத்தையும் போலவே, யாவேவின் பார்வையில் சரியானதைச் செய்தான். ஆனால், அவன் யாவேவின் ஆலயத்திற்குள் நுழையவில்லை.[a] ஆனால் மக்கள் இன்னும் சீர்கேடாக நடந்துகொண்டே இருந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் யாவேவின் ஆலயத்திற்குள் செல்லவில்லை.” இந்தக் கூற்று, முறைகேடாக ஆலயத்திற்குள் நுழைந்த உசியாவிலிருந்து யோதாமை வேறுபடுத்துவதாகத் தெரிகிறது (2 நாளாகமம் 26:16–21 பார்க்கவும்).
    reason: cross_reference
  - marker: b
    text: அல்லது, “மக்கள் தொடர்ந்து தங்களையே சீரழித்துக்கொண்டிருந்தார்கள்”; “மக்கள் தொடர்ந்து சீர்கேடாக நடந்துகொண்டிருந்தார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: நேர்மையானதைச் செய்தான்
  rationale: கட்டுரையுடன் வரும் பெயரடை இங்கு பெயர்ச்சொல் தன்மையில் ‘நேர்மையானது/சரியானது’ என்பதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் அறநெறி மதிப்பீட்டைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: எபிரேய மொழியின் ‘கண்களில்’ என்ற மதிப்பீட்டு மரபுத்தொடரின் பொருளையும் அதன் உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் தனிப்பெயர் தன்மையைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה עֻזִּיָּהוּ אָבִיו
  choice: தன் தந்தை உசியா செய்த அனைத்தையும் போலவே
  rationale: யோதாம் தன் தந்தையின் செயல்முறையை முழுமையாகப் பின்பற்றியதாகக் கூறும் ஒப்பீட்டை இயல்பான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய முழுமையான ஒப்பீட்டுக்கு அடுத்த வாக்கியம் ஒரு முக்கிய வரம்பை விதிக்கிறது. ‘ஆனால்’ அந்த முரண்பாட்டைத் தெளிவாகக் காட்டுகிறது; அதன் குறிப்பான தொடர்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: לֹא בָא אֶל הֵיכַל יְהוָה
  choice: அவன் யாவேவின் ஆலயத்திற்குள் நுழையவில்லை
  rationale: בוא + אֶל இங்கு உள்ளே செல்லுதல் அல்லது நுழைதலைக் குறிக்கிறது; הֵיכָל இந்தச் சூழலில் ஆலயத்தைக் குறிக்கிறது.
- source_word: וְעוֹד הָעָם מַשְׁחִיתִים
  choice: இருந்தபோதிலும், மக்கள் தொடர்ந்து சீர்கெட்டு நடந்தார்கள்
  rationale: וְעוֹד தொடரும் நிலையையும் சூழலிலுள்ள முரண்பாட்டையும் குறிக்கிறது. שׁחת என்பதன் ஹிஃபில் பங்கேற்புச் சொல் மக்களின் தொடர்ச்சியான சீர்கேடான நடத்தையைச் சுட்டுகிறது; செயப்படுபொருளை தேவையின்றி நிர்ணயிக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயரான திருநான்கெழுத்து நேரடியாக உள்ளது. ‘யாவே’ என்பது அதை பட்டமாக மாற்றாமல் அதன் உடன்படிக்கைப் பெயர் தன்மையைப் பாதுகாக்கும் ஒலிபெயர்ப்பு.
- issue: யோதாமுக்கும் உசியாவுக்கும் இடையிலான ஒப்பீட்டின் வரம்பு
  choice: ஆலயத்திற்குள் நுழையாதது உசியாவின் செயலில் இருந்து யோதாமை வேறுபடுத்துகிறது
  alternative: ஆலயத்திற்குச் செல்லாதது என்ற பொதுவான கூற்று
  rationale: רַק முந்தைய ஒப்பீட்டை வரையறுக்கிறது; 2 நாளாகமம் 26:16–21 இல் உசியா முறைகேடாக ஆலயத்திற்குள் நுழைந்த நிகழ்வு இந்த எதிர்மறை வேறுபாட்டுக்கான இலக்கியச் சூழலை வழங்குகிறது. எனினும் இந்த விளக்கம் முதன்மை உரையில் சேர்க்கப்படாமல் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- issue: מַשְׁחִיתִים என்பதன் செயப்படுபொருள் மற்றும் குரல்
  choice: சீர்கெட்டு நடந்தார்கள்
  alternative: தங்களையே சீரழித்துக்கொண்டிருந்தார்கள் / சீரழிவை ஏற்படுத்திக்கொண்டிருந்தார்கள்
  rationale: ஹிஃபில் வடிவம் சீரழித்தல் அல்லது சீர்கேடாக நடத்தல் ஆகிய நிழற்பொருள்களை அனுமதிக்கிறது. சூழல் மக்களின் அற மற்றும் சமயச் சீர்கேட்டைச் சுட்டினாலும், வெளிப்படையாக இல்லாத செயப்படுபொருளை முதன்மை உரை நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடை; பொதுவாசகர்களுக்குத் தெளிவான, கண்ணியமான மொழி. ‘நேர்மையானதைச் செய்தான்’, ‘ஆலயத்திற்குள் நுழையவில்லை’, ‘தொடர்ந்து சீர்கெட்டு நடந்தார்கள்’ ஆகியவை மூலத்தின் மதிப்பீடு, இயக்கம், தொடர்நிலை ஆகியவற்றை இயல்பாகக் காக்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
