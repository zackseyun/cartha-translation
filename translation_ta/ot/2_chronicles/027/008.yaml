lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: அவனுக்கு இருபத்தைந்து வயது
  rationale: எபிரேய வயதைக் குறிக்கும் வழக்குச் சொற்றொடரை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: הָיָה בְמָלְכוֹ
  choice: அவன் அரசனானபோது
  rationale: அரசாட்சியைத் தொடங்கிய சமயத்தில் இருந்த வயதைக் குறிக்கும் எபிரேய அரசர் குறிப்புச் சூத்திரத்தின் காலப்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: பதினாறு ஆண்டுகள்
  rationale: எண்ணிக்கையையும் கால அளவையும் நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: அரசனாக ஆளுதல் என்ற வினையின் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: ב முன்னிடைச்சொல் குறிக்கும் இடப்பொருளைத் தமிழின் வேற்றுமை உருபால் நேரடியாகத் தருகிறது.
