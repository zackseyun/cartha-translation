  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּתְחַזֵּ֖ק יוֹתָ֑ם כִּ֚י הֵכִ֣ין דְּרָכָ֔י/ו לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/006.yaml
  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: ta
  text: யோதாம் தன் வழிகளைத் தன் கடவுளாகிய ஆண்டவருக்கு முன்பாக ஒழுங்குபடுத்தியதால் வலிமை அடைந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: வலிமை அடைந்தான்
  rationale: ஹித்பயேல் வடிவம் இங்கு யோதாம் படிப்படியாக வலிமை பெற்றதைக் குறிக்கிறது; இயல்பான தமிழில் இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הֵכִין דְּרָכָיו
  choice: தன் வழிகளை ... ஒழுங்குபடுத்தியதால்
  rationale: הכין என்பது நிலைநிறுத்துதல், ஆயத்தப்படுத்துதல், ஒழுங்குபடுத்துதல் ஆகிய பொருள் பரப்பைக் கொண்டது. மனிதனின் நடத்தை அல்லது வாழ்க்கைநெறியைக் குறிக்கும் דְּרָכָיו உடன், ‘தன் வழிகளை ஒழுங்குபடுத்தினான்’ என்பது உருவகத்தையும் நோக்கமுள்ள செயற்பாட்டையும் காக்கிறது.
- source_word: לִפְנֵי יְהוָה אֱלֹהָיו
  choice: தன் கடவுளாகிய ஆண்டவருக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் ‘முன்பாக’ என்ற உறவைக் காக்கிறது; יהוה என்பதற்கு தமிழ் வேதாகம மரபில் பரவலாகப் புரிந்துகொள்ளப்படும் ‘ஆண்டவர்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: யோதாமின் வலிமைக்கும் அவன் வாழ்க்கைநெறிக்கும் இடையிலான காரணத் தொடர்பு
  choice: ‘...ஒழுங்குபடுத்தியதால் வலிமை அடைந்தான்’ என்று நேரடியான காரணத் தொடர்பு வைக்கப்பட்டது.
  alternative: இரண்டு நிகழ்வுகளையும் தளர்வாக இணைத்தல் அல்லது கடவுள் அவனை வலிமைப்படுத்தினார் என்று வெளிப்படையாகச் சேர்த்தல்.
  rationale: כִּי இங்கு காரணத்தைக் குறிக்கிறது. கடவுளின் செயலை இறையியல் விளக்கமாகச் சேர்க்காமல், எபிரெய உரையின் சொற்படுத்தப்படாத பதற்றமும் காரண அமைப்பும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. ‘வழிகள்’ என்ற வேதாகம உருவகம் காக்கப்பட்டு, ‘ஒழுங்குபடுத்தினான்’ மூலம் அதன் வாழ்க்கைநெறி சார்ந்த பொருள் இயல்பாகத் தரப்பட்டுள்ளது.
