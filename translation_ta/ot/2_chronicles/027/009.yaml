  text: וַ/יִּשְׁכַּ֤ב יוֹתָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/עִ֣יר דָּוִ֑יד וַ/יִּמְלֹ֛ךְ אָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/009.yaml
  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
translation:
  language: ta
  text: யோதாம் தன் முன்னோர்களோடு துயிலடைந்தான்[a]. அவனைத் தாவீதின் நகரத்தில் அடக்கம் செய்தார்கள். அவனுக்குப் பதிலாக அவன் மகன் ஆகாஸ் அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, பொருள் விளக்கமாக, ‘இறந்தான்.’ எபிரெயத்தில் ‘தன் தந்தையரோடு துயிலடைந்தான்’ என்று உள்ளது; இது அரசர்களின் இறப்பைக் குறிக்கும் வழக்கமான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: துயிலடைந்தான்
  rationale: இறப்பைக் குறிக்கும் அரச மரணக் குறிப்பின் உருவக மொழியைப் பாதுகாக்கிறது; நேரடியாக ‘இறந்தான்’ என்று பொருள் விளக்கி விடாமல், எபிரெயச் சொற்றொடரின் தன்மையைத் தக்கவைக்கிறது.
- source_word: עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு
  rationale: சொல்லாட்சியில் ‘அவனுடைய தந்தையரோடு’ என்றாலும், இங்கு வம்ச முன்னோர்களைக் குறிக்கிறது. நவீனத் தமிழில் ‘முன்னோர்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அவனை ... அடக்கம் செய்தார்கள்
  rationale: எபிரெய மூலத்திலுள்ள செயப்பாட்டு அல்லாத பன்மை வினை வடிவத்தைப் பாதுகாக்கிறது; குறிப்பிடப்படாத செய்பவர்களைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּעִיר דָּוִיד
  choice: தாவீதின் நகரத்தில்
  rationale: இடப்பெயரின் எபிரெய உரிமைத் தொடர்பைத் தெளிவாகவும் வழக்கமான தமிழிலும் தருகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: מלך என்ற வினையின் அரசாட்சி செலுத்துதல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரசுரிமைத் தொடர்ச்சியில் ஒருவரின் இடத்தை மற்றொருவர் ஏற்றுக்கொள்வதைத் துல்லியமாகக் காட்டுகிறது.
- source_word: יוֹתָם
  choice: யோதாம்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் நிலையான வேதாகமப் பெயர் வடிவத்துக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
- source_word: אָחָז
  choice: ஆகாஸ்
  rationale: எபிரெயப் பெயரின் ஒலிப்பைத் தமிழில் நிலையான வேதாகமப் பெயர் வடிவத்துக்கு ஏற்றவாறு எழுத்துப்பெயர்த்துள்ளது.
- source_word: בְּנוֹ
  choice: அவன் மகன்
  rationale: தந்தை–மகன் உறவையும் அரசுரிமைத் தொடர்ச்சியையும் மூலத்தைப் போல வெளிப்படையாக வைத்திருக்கிறது.
theological_decisions:
- issue: ‘துயிலடைந்தான்’ என்ற மரண உருவகத்தை எவ்வாறு கையாளுவது
  choice: உருவகத்தை முதன்மை உரையில் வைத்துப் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘இறந்தான்’ என்று நேரடியாக மொழிபெயர்த்தல்
  rationale: இது அரசர்களின் மரணத்தைக் குறிக்கும் மரபுச் சொற்றொடர். ‘இறந்தான்’ என்பது பொருளில் சரியானதாயினும், மூலத்தின் உருவகத்தையும் அதன் இலக்கியத் தொனியையும் அகற்றிவிடும்; ‘துயிலடைந்தான்’ எந்தக் குறிப்பிட்ட மறுமைநிலைக் கோட்பாட்டையும் உரையில் சேர்க்காமல் மூல உருவகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘துயிலடைந்தான்’ என்ற மரபுருவகம் தக்கவைக்கப்பட்டு, ‘அடக்கம் செய்தார்கள்’ மற்றும் ‘அரசாண்டான்’ போன்ற இயல்பான தற்போதைய சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
