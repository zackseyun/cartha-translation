  text: He built cities in the hill country of Judah[b][a], and in the forests he built fortresses and towers.
translation:
  language: ta
  text: அவன் யூதாவின் மலைநாட்டில் நகரங்களைக் கட்டினான்; காடுகளில்[a] அரண்களையும்[b] கோபுரங்களையும் கட்டினான்.
  philosophy: optimal-equivalence
