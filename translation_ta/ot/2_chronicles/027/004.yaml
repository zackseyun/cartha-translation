    text: ‘காடுகள்’ என்பதற்கு ‘மரங்கள் நிறைந்த பகுதிகள்’ அல்லது ‘புதர்க்காடுகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அரண்கள்’ என்பதற்கு ‘கோட்டைகள்’ அல்லது ‘பாதுகாப்பு அரண்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרִים
  choice: நகரங்கள்
  rationale: மக்கள் குடியிருக்கும் நகர்ப்புற இடங்களைக் குறிக்கும் வழக்கமான பன்மை; அரச கட்டுமானச் சூழலுக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: בָּנָה
  choice: கட்டினான்
  rationale: கட்டுதல் என்ற நேரடியான பொருளைச் சுருக்கமான வரலாற்று நடையில் தருகிறது.
- source_word: בְּהַר יְהוּדָה
  choice: யூதாவின் மலைநாட்டில்
  rationale: இங்கு הַר ஒரு தனி மலையைவிட மலைப்பாங்கான புவியியல் பகுதியைக் குறிப்பதால், ‘மலைநாடு’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: חֳרָשִׁים
  choice: காடுகளில்
  rationale: மரங்கள் அடர்ந்த அல்லது புதர்கள் நிறைந்த பகுதிகளைக் குறிக்கலாம்; முதன்மை உரையில் சுருக்கமாகவும் இயல்பாகவும் ‘காடுகளில்’ என வழங்கப்படுகிறது.
- source_word: בִּירָנִיּוֹת
  choice: அரண்கள்
  rationale: பாதுகாப்புக்காக வலுப்படுத்தப்பட்ட கட்டமைப்புகளைக் குறிக்கும்; காலத்திற்குப் பொருந்தாத ‘கோட்டைகள்’ சார்ந்த சில நுணுக்கங்களைத் தவிர்த்து, செறிவான தமிழ்ச் சொல்லாக உள்ளது.
- source_word: מִגְדָּלִים
  choice: கோபுரங்கள்
  rationale: உயரமான, இச்சூழலில் பெரும்பாலும் பாதுகாப்புப் பயன்பாடுடைய கோபுரங்களைக் குறிக்கும் வழக்கமான தமிழ் வடிவம்.
