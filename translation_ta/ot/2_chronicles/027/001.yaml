translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அரசருக்கான மரியாதைப் பன்மை முழு வசனத்திலும் ஒருமையாகப் பேணப்பட்டுள்ளது. பெயர்கள் எபிரேய மூல ஒலிப்புக்கு அண்மையாகத் தமிழாக்கப்பட்டுள்ளன.
