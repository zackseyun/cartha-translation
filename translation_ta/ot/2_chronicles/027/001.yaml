base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/001.yaml
  text: Jotham was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem. His mother’s name was Jerushah daughter of Zadok.
translation:
  language: ta
  text: யோதாம் அரசனானபோது, அவர் இருபத்தைந்து வயதுடையவராக இருந்தார். அவர் எருசலேமில் பதினாறு ஆண்டுகள் ஆட்சி செய்தார். அவருடைய தாயின் பெயர் யெரூஷா; அவர் சாதோக்கின் மகள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: இருபத்தைந்து வயதுடையவராக இருந்தார்
  rationale: எபிரேய வயதுக் குறிப்பின் இயல்பான பொருளைத் தெளிவான நவீனத் தமிழில் தருகிறது; சொற்குச் சொல் மொழிபெயர்ப்பைத் தவிர்க்கிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: בְּ முன்னொட்டுடன் வரும் இவ்வடிவம் யோதாம் அரசாட்சியை ஏற்ற காலத்தைக் குறிக்கிறது; தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தார்
  rationale: அரசர் என்ற பட்டத்தை மட்டும் அல்லாமல் அரசாட்சியை நடத்தியதைக் குறிக்கும் வினையின் பொருளைப் பாதுகாக்கிறது.
- source_word: בִּירוּשָׁלָם
  choice: எருசலேமில்
  rationale: இடப்பொருளைக் குறிக்கும் בְּ முன்னொட்டின் நேரான தமிழ் வடிவம்.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவருடைய தாயின் பெயர்
  rationale: வம்சக் குறிப்புச் சூத்திரத்தை இயல்பான தமிழ் வாக்கிய அமைப்பில் தருகிறது.
- source_word: יְרוּשָׁה
  choice: எரூசாள்
  rationale: எபிரேயப் பெயரின் ஒலிப்பைத் தமிழ் எழுத்தில் அண்மையாகப் பெயர்த்தெழுதுகிறது; இறுதி ה இங்கே மெய்யான h ஒலியாக உச்சரிக்கப்படாததையும் பிரதிபலிக்கிறது.
- source_word: בַּת צָדוֹק
  choice: சாதோக்கின் மகள்
  rationale: தாய்வழி அடையாளத்தைக் குறிக்கும் எபிரேய உறவுமுறைச் சொல்லை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
