source:
  edition: WLC
  text: ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְי֑וֹן וּ/בְ/חוֹמַ֥ת הָ/עֹ֛פֶל בָּנָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/003.yaml
  text: He built the upper gate of the house of Yahweh[a], and on the wall of the Ophel he built much.
translation:
  language: ta
  text: அவன் யாவேயின் ஆலயத்தின் மேல் வாயிலைக் கட்டினான்; ஓபேலின் மதிலில் பெருமளவில் கட்டினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஓபேலின் மதிலில் மிகுதியாகக் கட்டினான்” அல்லது “நிறையக் கட்டினான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: לָרֹב என்பதன் அளவுக் குறிப்புக்கான சொற்பொருள் மாற்றுகளை வழங்குகிறது.
lexical_decisions:
- source_word: בָּנָה
  choice: கட்டினான் / கட்டுமானப் பணிகளைச் செய்தான்
  rationale: வினையின் அடிப்படைப் பொருள் ‘கட்டு’ என்பதாகும். முதல் இடத்தில் நேரடியாக ‘கட்டினான்’ என்றும், இரண்டாம் இடத்தில் தமிழில் இயல்பாகவும் לָרֹב குறிக்கும் பணியின் அளவு தெளிவாகவும் இருக்க ‘கட்டுமானப் பணிகளைச் செய்தான்’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: שַׁעַר
  choice: வாசல்
  rationale: ஆலய வளாகத்தின் நுழைவாயிலைக் குறிக்கும் கட்டடக்கலைச் சூழலுக்கு ‘வாசல்’ இயல்பான நவீனத் தமிழ் இணைச்சொல்.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லடியாக ‘யாவேயின் வீடு’ என்றாலும், இங்கு எருசலேம் ஆலயத்தைக் குறிப்பது தெளிவாக இருப்பதால் சாதாரண வாசகருக்குப் புரியும் இயல்பான ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருநாமத்தின் பொதுவான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָעֶלְיוֹן
  choice: மேல்வாசல்
  rationale: வாசலின் உயர்ந்த அல்லது மேல்புற அமைவிடத்தைக் குறிக்கிறது; தமிழில் பெயரடைத் தொகையாக ‘மேல்வாசல்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וּבְחוֹמַת הָעֹפֶל
  choice: ஓபேலின் மதிலின்மேலும்
  rationale: בְּ இங்கு மதிலுடன் தொடர்புடைய கட்டுமானப் பணியைக் குறிக்கிறது. ஓபேல் இடப்பெயராக ஒலிபெயர்க்கப்பட்டு, חוֹמָה ‘மதில்’ என வழங்கப்பட்டுள்ளது.
- source_word: לָרֹב
  choice: பெருமளவில்
  rationale: கட்டுமானப் பணியின் மிகுந்த அளவை அல்லது விரிவைக் குறிக்கிறது. ‘பெருமளவில்’ என்பது பொருளை இயல்பான தமிழில் தருகிறது; மூலத்தின் சுருக்கமான மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பட்ட திருநாமமான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை மறைக்காமல் தமிழ் ஒலிபெயர்ப்பில் வழங்குவது மூலத்துக்கு நெருக்கமானது.
- issue: בֵּית יְהוָה என்பதன் மொழிபெயர்ப்பு
  choice: யாவேயின் ஆலயம்
  alternative: யாவேயின் வீடு
  rationale: ‘வீடு’ என்பது சொல்லடியான வடிவம்; ஆனால் இச்சூழலில் குறிப்பது ஆலயத்தையே என்பதால், எந்தச் சமயப்பிரிவு சார்ந்த கூடுதல் கருத்தையும் புகுத்தாமல் தெளிவுக்காக ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமான, எளிதில் புரியும் வரலாற்று நடையுடன் வடிவமைக்கப்பட்டது. ‘பெருமளவில் கட்டுமானப் பணிகளைச் செய்தான்’ என்பது எபிரெயச் சுருக்கத்தை இயல்பான தமிழாக்கமாக்குகிறது; சொல்லடியான மாற்றுகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
