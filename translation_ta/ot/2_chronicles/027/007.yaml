  source_fidelity: 'மூல எபிரெயத்தின் அரச-வரலாற்றுச் சுருக்கச் சூத்திரம் துல்லியமாகக் காக்கப்பட்டுள்ளது: וְיֶתֶר דִּבְרֵי ‘மற்ற செயல்கள்,’ எல்லாப் போர்கள், ‘வழிகள்,’ הִנָּם என்பதன் சுட்டிக்காட்டும் வலியுறுத்தலான ‘இதோ, அவை,’ மற்றும் ஆவணக் குறிப்பு அனைத்தும் இடம்பெற்றுள்ளன. ‘நூலில் எழுதப்பட்டுள்ளன’ என்பது עַל־סֵפֶר என்பதற்கான இயல்பான தமிழ் வழங்கல்.'
