translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்று நூலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் பட்டியல் அமைப்பும் ‘இதோ’ என்ற வலியுறுத்தலும் காக்கப்பட்டுள்ளன; ‘வழிகள்’ என்பதிலுள்ள உருவகமும் பொருள் அகலமும் அடிக்குறிப்புடன் தக்கவைக்கப்பட்டுள்ளன.
