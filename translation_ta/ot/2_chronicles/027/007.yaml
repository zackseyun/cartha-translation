reference: 2 Chronicles 27:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/יֶתֶר֙ דִּבְרֵ֣י יוֹתָ֔ם וְ/כָל מִלְחֲמֹתָ֖י/ו וּ/דְרָכָ֑י/ו הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/007.yaml
  text: The rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: ta
  text: யோதாமின் மற்ற செயல்களும்[a], அவருடைய எல்லாப் போர்களும், அவருடைய வழிகளும்[b]—இதோ, அவை இஸ்ரவேல் மற்றும் யூதாவின் அரசர்களின் நூலில் எழுதப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யோதாமைப் பற்றிய மற்ற செய்திகள்/விவகாரங்கள்’; இங்குள்ள எபிரெய மரபுத்தொடர் அவரது செயல்கள் அல்லது ஆட்சிக்குரிய நிகழ்வுகளின் பதிவைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவருடைய வழிகள்’ என்பது ‘அவருடைய நடத்தை’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: யோதாமின் மற்ற செயல்களும்
  rationale: அரசர்களைப் பற்றிய வரலாற்றுச் சுருக்கங்களில் דִּבְרֵי என்பது சொற்களை மட்டும் அல்லாமல் செயல்கள் அல்லது விவகாரங்களைக் குறிக்கும் மரபுத்தொடர். ஆகவே இயல்பான தமிழில் ‘மற்ற செயல்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: וְכָל מִלְחֲמֹתָיו
  choice: அவருடைய எல்லாப் போர்களும்
  rationale: מִלְחָמָה என்பதன் பன்மை இங்கு போர்களையும் ஆயுத மோதல்களையும் நேரடியாகக் குறிக்கிறது.
- source_word: וּדְרָכָיו
  choice: அவருடைய வழிகளும்
  rationale: எபிரெய உருவகத்தைப் பாதுகாக்க ‘வழிகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது; இச்சூழலில் அது அவரது நடத்தை அல்லது வாழ்க்கை முறையையும் குறிக்கலாம்.
- source_word: הִנָּם
  choice: இதோ, அவை
  rationale: הִנֵּה வடிவத்தின் சுட்டிக்காட்டும், வலியுறுத்தும் தன்மையை ‘இதோ’ தக்கவைக்கிறது; பன்மைத் துணைமொழி ‘அவை’ என்பதும் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: כְּתוּבִים עַל סֵפֶר
  choice: நூலில் எழுதப்பட்டுள்ளன
  rationale: சொல்லுக்குச் சொல் ‘நூலின்மேல் எழுதப்பட்டுள்ளன’ என்பதற்குப் பதிலாக, ஆவணக் குறிப்பைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்லாக்கம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: இஸ்ரவேல் மற்றும் யூதாவின் அரசர்கள்
  rationale: இது மேற்கோள் காட்டப்படும் ஆவணத்தின் பெயர்சார் விளக்கமாகும்; இரு அரசாட்சிகளின் அரசர்களையும் குறிக்கும் மூலமொழி அமைப்பு தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
