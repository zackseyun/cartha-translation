  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
translation:
  language: ta
  text: அவன் அம்மோனியரின் அரசனோடு போரிட்டு, அவர்களை வென்றான். அந்த ஆண்டில் அம்மோனியர் அவனுக்கு நூறு தாலந்து வெள்ளியையும், பத்தாயிரம் கோர் கோதுமையையும், பத்தாயிரம் கோர் வாற்கோதுமையையும்[a] கொடுத்தார்கள். இதே அளவை இரண்டாம் ஆண்டிலும் மூன்றாம் ஆண்டிலும் அம்மோனியர் அவனுக்குச் செலுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘பத்தாயிரம் கோர் கோதுமையும், வாற்கோதுமை பத்தாயிரமும்’ என்று உள்ளது; வாற்கோதுமைக்கும் ‘கோர்’ என்ற அளவலகு பொருந்துவதாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִלְחַם עִם
  choice: அரசனோடு போரிட்டு
  rationale: עִם என்பது வடிவில் ‘உடன்/ஓடு’ என்றாலும், இங்குள்ள போர் சூழலில் எதிர்த்துப் போரிடுதலைக் குறிக்கிறது. ‘அரசனோடு போரிட்டு’ என்பது தமிழில் இயல்பாக அந்த மோதலை வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: அம்மோனியரின் அரசன்
  rationale: בְּנֵי עַמּוֹן என்பது அம்மோன் மக்களைக் குறிக்கும் வழக்கமான இனப்பெயர்; ‘அம்மோனியர்’ என்பது நவீன தமிழில் தெளிவான வடிவம்.
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  choice: அவர்களை வென்றான்
  rationale: חזק + עַל என்ற அமைப்பு இப்போர் சூழலில் அவர்கள்மேல் மேலோங்கி வெற்றி பெற்றதைக் குறிக்கிறது; வெறும் உடல் வலிமையை அல்ல.
- source_word: וַיִּתְּנוּ לוֹ
  choice: அவனுக்குக் கொடுத்தார்கள்
  rationale: נתן என்பதன் அடிப்படைப் பொருளான ‘கொடுத்தல்’ முதல் நிகழ்வில் தக்கவைக்கப்பட்டுள்ளது; சூழல் இதை கப்பம் போன்ற செலுத்துதலாகக் காட்டினாலும் அந்த விளக்கம் வினைக்குள் சேர்க்கப்படவில்லை.
- source_word: מֵאָה כִּכַּר כֶּסֶף
  choice: நூறு தாலந்து வெள்ளி
  rationale: כִּכָּר என்பது பழங்கால எடை அலகு. வழக்கமான வேதாகமத் தமிழ்ச் சொல்லான ‘தாலந்து’ அலகின் வரலாற்றுத் தன்மையைப் பாதுகாக்கிறது.
- source_word: כֹּרִים
  choice: கோர்
  rationale: כֹּר என்பது உலர் பொருட்களுக்கான பழங்கால கொள்ளளவு அலகு; பொதுவான ‘அளவு’ என்பதற்குப் பதிலாக ஒலிபெயர்ப்பு துல்லியத்தைப் பாதுகாக்கிறது.
- source_word: חִטִּים
  choice: கோதுமை
  rationale: இச்சொல்லின் நேரான, வழக்கமான தமிழ்ப் பொருள்.
- source_word: שְׂעוֹרִים
  choice: வாற்கோதுமை
  rationale: இது barley-ஐக் குறிக்கும் நிலையான தமிழ்ச் சொல்; கோதுமையிலிருந்து வேறுபட்ட தானியம் என்பது தெளிவாகிறது.
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  choice: இதே அளவை ... அவனுக்குச் செலுத்தினார்கள்
  rationale: הֵשִׁיבוּ என்பதன் அடிப்படை எண்ணம் திருப்பித் தருதல் என்றாலும், இங்கு அடுத்த ஆண்டுகளிலும் அதே கொடையை வழங்கியதைக் குறிக்கிறது. ‘செலுத்தினார்கள்’ கப்பம்/கட்டணம் சார்ந்த சூழலை இயல்பாகத் தெரிவிக்கிறது; זֹאת என்பதை ‘இதே அளவை’ எனத் தெளிவுபடுத்துகிறது.
- source_word: וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית
  choice: இரண்டாம் ஆண்டிலும் மூன்றாம் ஆண்டிலும்
  rationale: அதே செலுத்துதல் அடுத்த இரண்டு ஆண்டுகள் ஒவ்வொன்றிலும் தொடர்ந்தது என்பதை தமிழின் ‘-இலும்’ அமைப்பு இயல்பாக வெளிப்படுத்துகிறது.
