translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. பழங்கால அளவுகளான ‘தாலந்து’, ‘கோர்’ ஒலிபெயர்ப்பாகத் தக்கவைக்கப்பட்டுள்ளன; மூலத்தில் வாற்கோதுமைக்கு முன் மீண்டும் சொல்லப்படாத ‘கோர்’ வாசிப்புத் தெளிவுக்காக உரையில் நிரப்பப்பட்டு, அந்த விடுபாடு அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
