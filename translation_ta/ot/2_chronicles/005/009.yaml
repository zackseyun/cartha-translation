  text: וַֽ/יַּאֲרִיכוּ֮ הַ/בַּדִּים֒ וַ/יֵּרָאוּ֩ רָאשֵׁ֨י הַ/בַּדִּ֤ים מִן הָ/אָרוֹן֙ עַל פְּנֵ֣י הַ/דְּבִ֔יר וְ/לֹ֥א יֵרָא֖וּ הַ/ח֑וּצָ/ה וַֽ/יְהִי שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: ta
  text: அவர்கள் தண்டுகளை நீட்டினார்கள்; அவற்றின் முனைகள் உடன்படிக்கைப் பெட்டியிலிருந்து உள் திருத்தலத்தின் முன்பாகத் தெரிந்தன[a]. ஆனால் வெளியிலிருந்து அவை தெரியவில்லை. அவை இந்நாள்வரை அங்கே இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகா பரிசுத்த இடத்தின் முன்பாக.”
    reason: דְּבִיר என்பதற்கு ஆலயத்தின் மிகப் பரிசுத்தமான உள்ளறையைக் குறிக்கும் இந்த மாற்று மொழிபெயர்ப்பும் சாத்தியம்.
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ הַבַּדִּים
  choice: தண்டுகள் நீளமாக்கப்பட்டிருந்ததால்
  rationale: האריך என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தக்கவைத்து, தண்டுகள் நீட்டிக்கப்பட்டிருந்த நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: רָאשֵׁי הַבַּדִּים
  choice: அவற்றின் முனைகள்
  rationale: רָאשֵׁי என்பதன் சொற்பொருள் ‘தலைகள்’ என்றாலும், தண்டுகளின் நுனிப்பகுதிகளைக் குறிக்கும் இடவியல் சூழலில் ‘முனைகள்’ தெளிவான இயல்பான தமிழ்.
- source_word: מִן הָאָרוֹן
  choice: உடன்படிக்கைப் பெட்டியிலிருந்து
  rationale: מִן குறிக்கும் தொடக்க இடத்தை ‘இலிருந்து’ துல்லியமாகக் காட்டுகிறது; சூழலில் אָרוֹן உடன்படிக்கைப் பெட்டியையே குறிக்கிறது.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: உள் திருத்தலத்தின் முன்பாக
  rationale: דְּבִיר ஆலயத்தின் உள்ளார்ந்த திருத்தலத்தைக் குறிக்கிறது; עַל־פְּנֵי இங்கு இடவியல் பொருளில் ‘முன்பாக’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: ஆனால் வெளியிலிருந்து அவை தெரியவில்லை
  rationale: முந்தைய தெரிவுநிலையுடன் உள்ள முரண்பாட்டைப் பேணி, வெளிப்புறத்திலிருந்து தண்டுகளின் முனைகள் காணப்படவில்லை என்பதை இயல்பாகச் சொல்கிறது.
- source_word: וַיְהִי שָׁם עַד הַיּוֹם הַזֶּה
  choice: அவை இந்நாள்வரை அங்கே இருக்கின்றன
  rationale: ‘இந்நாள்வரை’ என்ற எபிரெய வழக்குச் சொல்லின் தொடர்நிலையையும், எழுத்தாளரின் காலப்பார்வையையும் நிகழ்காலத் தமிழில் தக்கவைக்கிறது.
