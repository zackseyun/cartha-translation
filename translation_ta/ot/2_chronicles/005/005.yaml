source:
  edition: WLC
  text: וַ/יַּעֲל֤וּ אֶת הָ/אָרוֹן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל הֶעֱל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/005.yaml
  text: And they brought up the ark[a], the tent of meeting, and all the holy vessels that were in the tent; the Levitical priests brought them up.
translation:
  language: ta
  text: அவர்கள் பெட்டியையும், சந்திப்புக் கூடாரத்தையும், கூடாரத்திலிருந்த பரிசுத்தப் பொருள்கள் அனைத்தையும் மேலே கொண்டுவந்தார்கள்; லேவியரான ஆசாரியர்கள்[a] அவற்றை மேலே கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்லாக: “ஆசாரியர்கள், லேவியர்கள்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  choice: மேலே கொண்டுவந்தார்கள்
  rationale: ஹிபில் வடிவிலுள்ள עלה இங்கு பரிசுத்தப் பொருள்களைக் கோவிலுக்கு உயரமான இடத்திற்குக் கொண்டுசெல்வதைக் குறிக்கிறது. இரு இடங்களிலும் ஒரே சொல்லாட்சியைப் பயன்படுத்துவது எபிரெய மறுபடியுரையைப் பாதுகாக்கிறது.
- source_word: הָאָרוֹן
  choice: பெட்டி
  rationale: மூலத்தில் ‘உடன்படிக்கைப் பெட்டி’ என்ற விரிவான பெயர் இல்லாமல் ‘பெட்டி’ என்றே உள்ளது; சூழலில் அது தெளிவாக அடையாளம் காணப்படுகிறது.
- source_word: אֹהֶל מוֹעֵד
  choice: சந்திப்புக் கூடாரம்
  rationale: இந்தச் சொற்றொடர் கடவுள் தமது மக்களைச் சந்திக்கும் கூடாரத்தைக் குறிக்கிறது; ‘சந்திப்புக் கூடாரம்’ எபிரெய வடிவத்தையும் பொருளையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: பரிசுத்தப் பொருள்கள் அனைத்தும்
  rationale: כְּלִים என்பது பாத்திரங்கள் மட்டுமல்லாமல் கருவிகள், உபகரணங்கள் உள்ளிட்ட விரிவான பொருள்களைக் குறிக்கலாம். ‘பொருள்கள்’ அந்த விரிவைத் தக்கவைக்கிறது; הַקֹּדֶשׁ என்பதற்கு ‘பரிசுத்த’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: கூடாரத்திலிருந்த
  rationale: இது பரிசுத்தப் பொருள்கள் இருந்த இடத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிப்பிடுகிறது; முந்தைய ‘சந்திப்புக் கூடாரம்’ என்பதுடன் சொல்லிணக்கம் உள்ளது.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: லேவியரான ஆசாரியர்கள்
  rationale: எபிரெய இணைப்புச் சொற்றொடரான ‘ஆசாரியர்கள், லேவியர்கள்’ என்பதைக் குறிப்புத் தொடர்பாகப் புரிந்துகொண்டு, எல்லா லேவியர்களும் ஆசாரியர்கள் என்று தவறாக உணர்த்தாமல் இயல்பான தமிழில் வழங்குகிறது. நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: הַכֹּהֲנִים הַלְוִיִּם என்பதன் தொடர்பு
  choice: லேவியரான ஆசாரியர்கள்
  alternative: ஆசாரியர்கள், லேவியர்கள்
  rationale: முதன்மை வாசகம் ஆசாரியர்களை லேவியர்களாக அடையாளப்படுத்தும் இயல்பான குறிப்புத் தொடர்பை வெளிப்படுத்துகிறது; அதேவேளையில் மூலத்தின் இலக்கண நெருக்கத்தையும் சாத்தியமான வேறுபட்ட வாசிப்பையும் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘பெட்டி’, ‘சந்திப்புக் கூடாரம்’, ‘பரிசுத்தப் பொருள்கள்’, ‘ஆசாரியர்கள்’ ஆகிய சொற்கள் மூலத்தின் சுருக்கத்தையும் வழிபாட்டுச் சூழலையும் தக்கவைக்கின்றன; எபிரெய வினைச்சொல் மறுபடியுரை தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
