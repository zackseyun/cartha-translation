base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
translation:
  language: ta
  text: 'அப்போது இவ்வாறு நிகழ்ந்தது: எக்காளம் ஊதுகிறவர்களும் பாடகர்களும் ஒருமித்து, யாவேவைப் புகழவும் நன்றி செலுத்தவும் ஒரே ஒலியை எழுப்பினர். அவர்கள் எக்காளங்கள், தாளங்கள், பாடலுக்கான இசைக்கருவிகளுடன் தங்கள் குரலை உயர்த்தி, யாவேவைப் புகழ்ந்து, “அவர் நல்லவர்; அவருடைய நிலைத்த அன்பு என்றென்றும் உள்ளது” என்று புகழ்ந்தபோது, ஆலயம்—யாவேவின் ஆலயம்—மேகத்தால் நிறைந்தது.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְאֶחָד
  choice: ஒருவரைப்போல் ஒன்றிணைந்து
  rationale: ‘ஒருவரைப்போல்’ என்ற உருவகத்தையும், ஒருமித்த செயல் என்ற பொருளையும் காக்கிறது; அடுத்து வரும் ‘ஒரே ஒலி’ என்பதுடனும் இயல்பாக இணைகிறது.
- source_word: למחצצרים וְלַמְשֹׁרֲרִים
  choice: எக்காளம் ஊதுகிறவர்களும் பாடகர்களும்
  rationale: இரு தனித்த இசைக் குழுக்களையும் தெளிவாகவும் இன்றைய தமிழில் இயல்பாகவும் குறிப்பிடுகிறது.
- source_word: לְהַשְׁמִיעַ קוֹל אֶחָד
  choice: ஒரே ஒலியை எழுப்பினார்கள்
  rationale: קוֹל என்பதன் கேட்கத்தக்க ஒலி என்ற நேரடியான கருத்தையும், இசைக்குழுவின் ஒருமைப்பாட்டையும் காக்கிறது.
- source_word: לְהַלֵּל וּלְהוֹדוֹת
  choice: புகழ்ந்து நன்றி செலுத்த
  rationale: புகழ்தல், நன்றி கூறுதல் ஆகிய இரு செயல்களையும் தனித்தனியாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் இறைபெயரை பொதுப்பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: וּכְהָרִים קוֹל
  choice: தங்கள் குரலை உயர்த்தி
  rationale: எபிரெய மொழிவழக்கின் பொருளை இயல்பான தமிழில் தருகிறது; ஒருமை வடிவிலுள்ள ‘குரல்’ குழுவினரின் கூட்டு ஒலியாகப் புரிகிறது.
- source_word: בַּחֲצֹצְרוֹת וּבִמְצִלְתַּיִם וּבִכְלֵי הַשִּׁיר
  choice: எக்காளங்களோடும் கைத்தாளங்களோடும் பாடலுக்குரிய இசைக்கருவிகளோடும்
  rationale: கருவிகளின் மூன்று வகைகளையும் காக்கிறது; כְלֵי הַשִּׁיר என்பதன் ‘பாடல்/இசைக்கான கருவிகள்’ என்ற நோக்குப் பொருளை வெளிப்படுத்துகிறது.
- source_word: כִּי טוֹב כִּי לְעוֹלָם חַסְדּוֹ
  choice: அவர் நல்லவர்; அவருடைய மாறாத அன்பு என்றென்றும் நிலைத்திருக்கும்
  rationale: வழிபாட்டு மறுமொழியின் இணை அமைப்பைக் காக்கிறது; חֶסֶד என்பதன் நிலைத்த, உண்மையுள்ள அன்பை எளிய நவீன தமிழில் வழங்குகிறது.
- source_word: וְהַבַּיִת מָלֵא עָנָן בֵּית יְהוָה
  choice: அந்த ஆலயம்—யாவேவின் ஆலயம்—மேகத்தால் நிறைந்தது
  rationale: ‘வீடு/ஆலயம்’ என்ற சொல்லின் வலியுறுத்தும் மறுபயன்பாட்டை அடைப்புக்கோட்டு அமைப்பில் காக்கிறது; சூழலில் ‘ஆலயம்’ இயல்பானது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுவான பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: חַסְדּוֹ என்பதன் பொருள்
  choice: அவருடைய மாறாத அன்பு
  alternative: அவருடைய இரக்கம் / அவருடைய உடன்படிக்கை அன்பு
  rationale: இச்சொல்லின் நிலைத்தன்மை மற்றும் உண்மைத்தன்மையைத் தெரிவிக்கிறது; ‘உடன்படிக்கை’ என்பதை வசனத்தில் வெளிப்படையாகச் சேர்த்து பொருளை மிகையாகக் குறுக்காமல் இருக்கிறது.
- issue: וּבְהַלֵּל לַיהוָה என்பதற்குப் பின் வரும் மேற்கோளின் தொடர்பு
  choice: யாவேவைப் புகழ்ந்து … “…” என்று பாடியபோது
  alternative: யாவேவைப் புகழ்ந்து, “…” என்று கூறியபோது
  rationale: எபிரெயத்தில் ‘கூறி’ என்பதற்கான தனி வினை இல்லை. இசைச் சூழலில் தமிழ் வாக்கியம் இயல்பாக அமைய ‘என்று பாடியபோது’ பயன்படுத்தப்பட்டாலும், அடிக்குறிப்பு மூலத்தின் சுருக்கமான அமைப்பைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; நிகழ்வுகளின் காலத் தொடர்பு இரண்டாவது வாக்கியத்தின் ‘பாடியபோது’ மூலம் பாதுகாக்கப்பட்டுள்ளது. ‘ஆலயம்’ சூழலுக்கேற்ற சொல்லாகவும், ‘யாவே’ இறைபெயரின் ஒலிபெயர்ப்பாகவும் பயன்படுத்தப்பட்டுள்ளது.
