  text: וַ/יִּהְי֤וּ הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם עַל מְק֖וֹם הָ/אָר֑וֹן וַ/יְכַסּ֧וּ הַ/כְּרוּבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/008.yaml
  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
translation:
  language: ta
  text: கேருபீன்கள் தங்கள் சிறகுகளை உடன்படிக்கைப் பெட்டியின் இடத்தின்மேல்[a] விரித்தபடி இருந்தனர்; கேருபீன்கள் மேலிருந்து உடன்படிக்கைப் பெட்டியையும் அதன் தண்டுகளையும் மூடினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடன்படிக்கைப் பெட்டி இருந்த இடத்தின்மேல்.”
    reason: מְקוֹם הָאָרוֹן என்பதன் நேரடியான உடைமைத் தொடர், பெட்டிக்குரிய/பெட்டி அமைந்த இடம் என்ற இயல்பான பொருளையும் தரலாம்.
lexical_decisions:
- source_word: וַיִּהְיוּ ... פֹּרְשִׂים
  choice: விரித்திருந்தார்கள்
  rationale: היה உடன் நிகழ்காலப் பங்கேற்புவினை சேர்ந்த இவ்வமைப்பு, தொடர்ந்து நிலவிய உடல்நிலையைச் சுட்டுகிறது; இயல்பான தமிழில் ‘விரித்திருந்தார்கள்’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַכְּרוּבִים
  choice: கேருபீன்கள்
  rationale: ஆலயச் சூழலிலுள்ள இவ்விண்ணுலகக் காவல் உருவங்களுக்கான மரபான ஒலிபெயர்ப்பைப் பேணுகிறது; சாதாரண ‘தேவதூதர்கள்’ என்று மொழிபெயர்ப்பது மூலச்சொல்லின் தனித்துவத்தை இழக்கச் செய்யும்.
- source_word: כְּנָפַיִם
  choice: தங்கள் சிறகுகளை
  rationale: எபிரெயில் உடைமைச் சுட்டுப்பெயர் வெளிப்படையாக இல்லாவிட்டாலும், சிறகுகள் கேருபீன்களுடையவை என்பது சூழலால் தெளிவு; தமிழில் இயல்பாக இருக்க ‘தங்கள்’ சேர்க்கப்பட்டது.
- source_word: עַל מְקוֹם הָאָרוֹן
  choice: உடன்படிக்கைப் பெட்டியின் இடத்தின்மேல்
  rationale: מָקוֹם என்பதன் ‘இடம்’ என்ற பொருளைப் பேணி, அடுத்த கூற்றில் பெட்டியே தனியாகக் குறிப்பிடப்படுவதையும் பிரதிபலிக்கிறது.
- source_word: וַיְכַסּוּ
  choice: மூடியிருந்தார்கள்
  rationale: כסה என்பதன் நேரடியான ‘மூடு’ என்ற பொருளைத் தருகிறது; ‘நிழலிட்டார்கள்’ போன்ற விளக்கம்சார்ந்த மொழியைத் தவிர்க்கிறது.
- source_word: הָאָרוֹן וְעַל בַּדָּיו
  choice: உடன்படிக்கைப் பெட்டியையும் அதன் தண்டுகளையும்
  rationale: בַּדִּים என்பது பெட்டியைச் சுமப்பதற்கான நீண்ட தண்டுகள்; ‘தண்டுகள்’ நவீன தமிழில் தெளிவாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: מִלְמָעְלָה
  choice: மேலிருந்து
  rationale: מִן முன்னொட்டுடன் வரும் இச்சொல்லின் திசை/நிலையைக் குறிக்கும் பொருளை நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: הָאָרוֹן என்பதன் சூழல்சார் அடையாளம்
  choice: உடன்படிக்கைப் பெட்டி
  alternative: பெட்டி
  rationale: ஆலயச் சூழலில் இது உடன்படிக்கைப் பெட்டியைக் குறிக்கிறது. வெறும் ‘பெட்டி’ தமிழில் தெளிவற்றதாக இருப்பதால், வழக்கமான முழுப்பெயர் பயன்படுத்தப்பட்டது; மூலத்தில் இல்லாத தனிப்பிரிவுக் கொள்கை எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆலய விவரணைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் இரு இணையான கூற்றுகளும் ‘இடம்’ மற்றும் ‘பெட்டி’ என்ற வேறுபாடும் பேணப்பட்டுள்ளன.
