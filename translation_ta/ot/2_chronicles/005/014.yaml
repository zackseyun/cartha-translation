  text: וְ/לֹא יָֽכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמ֥וֹד לְ/שָׁרֵ֖ת מִ/פְּנֵ֣י הֶ/עָנָ֑ן כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית הָ/אֱלֹהִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/014.yaml
  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
translation:
  language: ta
  text: மேகத்தின் காரணமாக ஆசாரியர்கள் பணிவிடை செய்வதற்காக நிற்க முடியவில்லை; ஏனெனில் யாவேயின் மகிமை தேவனுடைய இல்லத்தை[a] நிரப்பியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேவனுடைய ஆலயம்.’ எபிரெயத்தில் சொல்லுக்குச் சொல், ‘தேவனுடைய இல்லம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: முடியவில்லை
  rationale: இந்த வினை திறன் அல்லது இயலுமையைக் குறிக்கிறது; எதிர்மறையுடன் ‘முடியவில்லை’ என்பது தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயத்தில் வழிபாட்டுப் பணி செய்த நியமிக்கப்பட்ட குருக்களைக் குறிக்கும் மரபான, தெளிவான தமிழ் சொல்.
- source_word: לַעֲמוֹד
  choice: நின்று
  rationale: ‘நிற்க’ என்ற நேரடியான உடல் நிலையைக் காக்கிறது; அவர்கள் பணியைத் தொடர முடியவில்லை என்ற பொருளை மட்டும் ஊகித்து விரிவுபடுத்தவில்லை.
- source_word: לְשָׁרֵת
  choice: பணிவிடை செய்ய
  rationale: ஆசாரியர்களின் வழிபாட்டு அல்லது ஆலயப் பணியைச் சூழலுக்கேற்ற வகையில் வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵי הֶעָנָן
  choice: மேகம் காரணமாக
  rationale: இங்கு முன்னிடைச்சொல் காரணத்தைக் குறிக்கிறது; தமிழ் நடையில் காரண உறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ஆசாரியர்கள் ஏன் பணிவிடை செய்ய முடியவில்லை என்பதற்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: מָלֵא
  choice: நிரப்பியது
  rationale: எபிரெய உரையின் நிறைவு பெற்ற நிகழ்வை எளிய இறந்தகாலத்தில் தெளிவாகக் காட்டுகிறது.
- source_word: כְבוֹד יְהוָה
  choice: யாவேயின் மகிமை
  rationale: இறைப்பெயரையும் ‘மகிமை’ என்ற கருத்தையும் இயல்பான தமிழ் உடைமைத் தொடரில் நேரடியாகக் காக்கிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய இல்லம்
  rationale: எபிரெய மொழியின் ‘தேவனுடைய வீடு/இல்லம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; சூழலில் அது ஆலயத்தைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בֵּית הָאֱלֹהִים என்பதன் உருவகமும் குறிப்பிட்ட இடமும்
  choice: தேவனுடைய இல்லம்
  alternative: தேவனுடைய ஆலயம்
  rationale: மூலத்தின் ‘இல்லம்’ என்ற சொல்லாட்சியை முதன்மை உரையில் காத்து, அது ஆலயத்தைக் குறிப்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘பணிவிடை செய்ய’ என்பது ஆலய வழிபாட்டுச் சேவையை உணர்த்துகிறது; ‘நின்று’ என்ற மூலப் படிமமும் இறைப்பெயரான ‘யாவே’ என்பதும் பாதுகாக்கப்பட்டுள்ளன.
