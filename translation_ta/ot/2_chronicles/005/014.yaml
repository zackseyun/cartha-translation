  source_fidelity: 'மூல எபிரெய உரையின் முக்கிய கூறுகள் அனைத்தும் சரியாக உள்ளன: ஆசாரியர்களின் இயலாமை, மேகம் காரணமாக இருப்பது, யாவேயின் மகிமை தேவனுடைய இல்லத்தை நிரப்பியது ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் ‘நின்று பணிவிடை செய்ய முடியவில்லை’ என்பதை ‘பணிவிடை செய்வதற்காக நிற்க முடியவில்லை’ என மாற்றுவது לַעֲמֹד לְשָׁרֵת என்ற நோக்க/சேவைத் தொடரைத் தெளிவாகவும் நேரடியாகவும் தருகிறது.'
