  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ כִּ֠י כָּל הַ/כֹּהֲנִ֤ים הַֽ/נִּמְצְאִים֙ הִתְקַדָּ֔שׁוּ אֵ֖ין לִ/שְׁמ֥וֹר לְ/מַחְלְקֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/011.yaml
  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
translation:
  language: ta
  text: ஆசாரியர்கள் பரிசுத்த இடத்திலிருந்து வெளியே வந்தபோது—அங்கு இருந்த ஆசாரியர்கள் அனைவரும் தங்களை அர்ப்பணித்துக் கொண்டிருந்தனர்; ஆசாரியப் பிரிவுகளைக் கடைப்பிடிக்காமல்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: வெளியே வந்தபோது
  rationale: וַיְהִי உடன் வரும் בְּ + infinitive construct அடுத்த நிகழ்வுக்கான காலச் சூழலை அறிமுகப்படுத்துகிறது. தமிழில் இயல்பான காலத் துணைவாக்கியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயச் சூழலில் כהנים என்பதற்கான தெளிவான, வழக்கமான தமிழ் சொல்.
- source_word: מִן הַקֹּדֶשׁ
  choice: பரிசுத்த இடத்திலிருந்து
  rationale: இங்கு הַקֹּדֶשׁ என்பது பொதுவான பரிசுத்தத்தைக் குறிக்காமல் ஆலயத்தின் புனிதப் பகுதியைக் குறிக்கிறது.
- source_word: כָּל הַכֹּהֲנִים הַנִּמְצְאִים
  choice: அங்கு இருந்த ஆசாரியர்கள் அனைவரும்
  rationale: מצא வினையின் participle இச்சூழலில் அங்கே இருந்தவர்கள் அல்லது வந்திருந்தவர்கள் என்ற பொருளைக் கொடுக்கிறது.
- source_word: הִתְקַדָּשׁוּ
  choice: தங்களைப் புனிதப்படுத்தியிருந்தனர்
  rationale: קדש என்பதன் Hitpael வடிவம் ஆலயப் பணிக்கு வேண்டிய சடங்குசார் தற்காத்த ஆயத்தத்தைக் குறிக்கிறது. ‘புனிதப்படுத்தியிருந்தனர்’ அந்தச் சாரத்தைப் பாதுகாக்கிறது; past perfect சூழ்நிலைக்கு ஏற்றபடி முன்நிகழ்வையும் காட்டுகிறது.
- source_word: אֵין לִשְׁמֹר לְמַחְלְקוֹת
  choice: அப்போது பணிப்பிரிவுமுறை பின்பற்றப்படவில்லை
  rationale: எழுத்துப்படியான ‘பிரிவுகளின்படி கடைப்பிடித்தல் இல்லை’ என்ற அமைப்பை இயல்பான தமிழில் தருகிறது. வழக்கமான ஆசாரியப் பணிக்குழு முறை அந்த நிகழ்வில் கடைப்பிடிக்கப்படவில்லை என்பதே சூழல்சார் பொருள்.
theological_decisions:
- issue: ஆசாரியர்களின் சடங்குசார் ஆயத்தத்திற்கான சொல்
  choice: தங்களைப் புனிதப்படுத்தியிருந்தனர்
  alternative: தங்களைத் தூய்மைப்படுத்தியிருந்தனர்
  rationale: இது ஒழுக்கரீதியான பாவமற்ற நிலையைப் பற்றிய கோட்பாட்டுக் கூற்றாக அல்லாமல், ஆலயச் சேவைக்கான சடங்குசார் ஆயத்தமாக உள்ளது. ‘புனிதப்படுத்துதல்’ קדש என்பதன் அடிப்படைச் சாரத்தைப் பாதுகாக்கிறது; ‘தூய்மைப்படுத்துதல்’ சுத்திகரிப்பை மட்டும் முன்னிறுத்தக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், ஆலயச் சூழலுக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. மூல வசனம் அடுத்த வசனத்தோடு தொடரும் வாக்கிய அமைப்பைக் கொண்டிருப்பதால் இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது.
