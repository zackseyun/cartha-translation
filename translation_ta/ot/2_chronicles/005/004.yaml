revisions:
- from: இஸ்ரவேலின் மூப்பர்கள் அனைவரும் வந்தார்கள்; லேவியர்கள் அந்தப் பெட்டியைச் சுமந்தார்கள்.[a]
  to: இஸ்ரவேலின் எல்லா மூப்பர்களும் வந்தனர்; லேவியர்கள் பேழையைச் சுமந்தனர்.[a]
  rationale: The revision preserves the Hebrew's simple definite expression, 'the ark,' in the main text while using the established Tamil biblical term «பேழை». The footnote alone supplies the contextual identification as the ark of the covenant. The verbs retain the narrative sequence and the term «லேவியர்கள்» accurately renders the Levites.
