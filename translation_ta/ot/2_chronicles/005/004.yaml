  text: וַ/יָּבֹ֕אוּ כֹּ֖ל זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הַ/לְוִיִּ֖ם אֶת הָ/אָרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/004.yaml
  text: And all the elders of Israel came[a], and the Levites carried the ark.
translation:
  language: ta
  text: இஸ்ரவேலின் எல்லா மூப்பர்களும் வந்தனர்; லேவியர்கள் பேழையைச் சுமந்தனர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, உடன்படிக்கைப் பேழை; சுற்றியுள்ள சூழலிலிருந்து இது தெளிவாகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא வினையின் தொடர்நிகழ்வு வடிவம் கதையின் அடுத்த நிகழ்வைக் குறிக்கிறது; ‘வந்தார்கள்’ என்பது இயல்பான நவீனத் தமிழ் நடை.
- source_word: כֹּל
  choice: அனைவரும்
  rationale: இஸ்ரவேலின் மூப்பர்கள் அனைவரையும் உள்ளடக்குவதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள்
  rationale: இஸ்ரவேலின் அங்கீகரிக்கப்பட்ட தலைவர்களைக் குறிக்கும் இணைப்புத் தொடரைத் துல்லியமாக வழங்குகிறது.
- source_word: וַיִּשְׂאוּ
  choice: சுமந்தார்கள்
  rationale: נשׂא இச்சூழலில் பெட்டியைத் தூக்கிச் செல்வதைக் குறிக்கிறது; ‘சுமந்தார்கள்’ செயலைத் தெளிவாகச் சொல்கிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தைச் சேர்ந்த ஆலயப் பணியாளர்களுக்கான வழக்கமான, புரிந்துகொள்ளத்தக்க தமிழ்ப் பெயர்.
- source_word: אֶת הָאָרוֹן
  choice: அந்தப் பெட்டியை
  rationale: ஆரோன் என்பது அடிப்படையில் ‘பெட்டி’ எனப் பொருள்படும்; எபிரெய உரையில் ‘உடன்படிக்கையின்’ என்ற விரிவாக்கம் இல்லாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை. குறிப்பிட்ட, ஏற்கெனவே அறியப்பட்ட பெட்டி என்பதை எபிரெயத் திட்டவட்ட உருபுக்கு ஏற்ப ‘அந்த’ உணர்த்துகிறது.
theological_decisions:
- issue: ‘பெட்டி’ எதைக் குறிக்கிறது?
  choice: முதன்மை உரையில் ‘அந்தப் பெட்டி’ என்று மட்டும் மொழிபெயர்த்தல்
  alternative: ‘உடன்படிக்கைப் பெட்டி’ என்று விரிவாக மொழிபெயர்த்தல்
  rationale: எபிரெய மூலத்தில் הָאָרוֹן (‘அந்தப் பெட்டி’) என்று மட்டுமே உள்ளது. சூழலால் அது உடன்படிக்கைப் பெட்டி என்பது தெளிவானாலும், மூலத்தில் இல்லாத சொற்களை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் விளக்குவது மூலமொழிக்கு முன்னுரிமை அளிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு தொடர்நிகழ்வுகளும் அரைப்புள்ளியால் இயல்பாக இணைக்கப்பட்டுள்ளன; ‘பேழை’ என்ற இலக்கியச் சொல்லுக்கு மாற்றாகத் தெளிவான ‘பெட்டி’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
