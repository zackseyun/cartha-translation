revisions:
- from: அப்போது சாலொமோன், இஸ்ரவேலின் மூப்பர்களையும், கோத்திரங்களின் தலைவர்கள் அனைவரையும், இஸ்ரவேல் மக்களின்[a] தந்தைவழிக் குடும்பத் தலைவர்களையும் எருசலேமில் ஒன்றுகூட்டினார். யாவேயின் உடன்படிக்கைப் பெட்டியைத் தாவீதின் நகரத்திலிருந்து[b], அதாவது சீயோனிலிருந்து, மேலே கொண்டுவருவதற்காக அவர்களை ஒன்றுகூட்டினார்.
  to: அப்போது சாலொமோன், இஸ்ரவேலின் மூப்பர்களையும், கோத்திரங்களின் தலைவர்கள் அனைவரையும், இஸ்ரவேல் புதல்வருக்குரிய பிதாமரபுக் குடும்பங்களின் தலைவர்களையும் எருசலேமில் ஒன்றுகூட்டினார்; யாவேயின் உடன்படிக்கைப் பெட்டியைத் தாவீதின் நகரமாகிய சீயோனிலிருந்து மேலே கொண்டுவருவதற்காகவே அவர் இவ்வாறு செய்தார்.[a][b]
  rationale: The revision retains the Hebrew sequence and purpose relationship in one sentence, restores the explicit “sons of Israel” genealogical reference in a readable modern Tamil form, and renders the final apposition so that Zion identifies the city of David rather than functioning as an additional origin. Footnote anchors are retained and placed at the relevant expressions.
