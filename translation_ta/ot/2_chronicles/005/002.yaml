source:
  edition: WLC
  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
translation:
  language: ta
  text: அப்போது சாலொமோன், இஸ்ரவேலின் மூப்பர்களையும், கோத்திரங்களின் தலைவர்கள் அனைவரையும், இஸ்ரவேல் புதல்வருக்குரிய பிதாமரபுக் குடும்பங்களின் தலைவர்களையும் எருசலேமில் ஒன்றுகூட்டினார்; யாவேயின் உடன்படிக்கைப் பெட்டியைத் தாவீதின் நகரமாகிய சீயோனிலிருந்து மேலே கொண்டுவருவதற்காகவே அவர் இவ்வாறு செய்தார்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “இஸ்ரவேலின் புதல்வர்கள்”; அல்லது, “இஸ்ரவேலர்.” இந்த எபிரெயச் சொல்லாட்சி இஸ்ரவேலின் வம்ச மற்றும் உடன்படிக்கை அடையாளத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தாவீதின் நகரத்திலிருந்து; அதுவே சீயோன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: தொடர்ந்து நிகழும் அடுத்த சம்பவத்தை அறிமுகப்படுத்தும் காலக் குறிப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יַקְהֵיל
  choice: ஒன்றுகூட்டினார்
  rationale: קהל என்பதன் Hiphil வடிவம் பிறரை ஒன்றாகக் கூட்டுவதைக் குறிக்கிறது; சாலொமோன் முன்னெடுத்த அதிகாரபூர்வக் கூட்டத்திற்குப் பொருத்தமானது.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மூப்பர்கள்
  rationale: அங்கீகரிக்கப்பட்ட மூத்த தலைவர்களைக் குறிக்கும் எபிரெயச் சொல்லை நேரடியாகவும் வழக்கமாகவும் வழங்குகிறது.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: கோத்திரங்களின் தலைவர்கள் அனைவரும்
  rationale: מַטּוֹת இச்சூழலில் கோத்திரப் பிரிவுகளைக் குறிக்கிறது; רָאשֵׁי என்பதன் தலைமை உருவகத்தையும் ‘தலைவர்கள்’ காக்கிறது.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: தந்தைவழிக் குடும்பத் தலைவர்கள்
  rationale: பிதாமரபை அடிப்படையாகக் கொண்ட சமூகக் குடும்ப அமைப்பைத் தெளிவாக்குகிறது; ‘தந்தையரின் வீடுகள்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட நவீன தமிழில் இயல்பானது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சூழலில் இஸ்ரவேல் சமூகத்தைக் குறிக்கும் இயல்பான தமிழாக்கம்; ‘இஸ்ரவேலின் புதல்வர்கள்’ என்ற மரபுவழிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶל יְרוּשָׁלָם
  choice: எருசலேமில்
  rationale: ஒன்றுகூடுதல் நிகழ்ந்த இடத்தைத் தமிழில் இயல்பாகக் குறிக்கிறது; எபிரெய முன்னிடைச்சொல் இலக்கு அல்லது கூடும் இடத்தைச் சுட்டுகிறது.
- source_word: לְהַעֲלוֹת
  choice: மேலே கொண்டுவருவதற்காக
  rationale: பெட்டியை உயரமான இடத்துக்குக் கொண்டுசெல்லும் திசைநுட்பத்தையும் செயல் நோக்கத்தையும் காக்கிறது.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெய இணைப்புத் தொடரைத் தமிழில் இயல்பான உடைமைத் தொடராக வழங்கி, பெட்டியின் உடன்படிக்கை சார்ந்த முக்கியத்துவத்தைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் நேரடியாக உள்ள இறைத் திருப்பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: מֵעִיר דָּוִיד
  choice: தாவீதின் நகரத்திலிருந்து
  rationale: புறப்படும் இடத்தை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: הִיא צִיּוֹן
  choice: அதாவது சீயோன்
  rationale: தாவீதின் நகரத்தை சீயோனுடன் அடையாளப்படுத்தும் மூலத்தின் விளக்க இணைப்பை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனத்தில் நான்கெழுத்துத் திருப்பெயர் நேரடியாக உள்ளது; அதை ஒரு பொதுப்பட்டமாக மாற்றாமல் பெயராகப் பாதுகாக்கிறது.
- issue: לִבְנֵי יִשְׂרָאֵל மற்றும் הָאָבוֹת ஆகியவற்றில் உள்ள வம்ச மற்றும் குடும்ப அமைப்பு
  choice: முதன்மை உரையில் ‘இஸ்ரவேல் மக்கள்’ என்றும் ‘தந்தைவழிக் குடும்பங்கள்’ என்றும் வழங்கி, ‘இஸ்ரவேலின் புதல்வர்கள்’ என்பதை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: இஸ்ரவேலின் புதல்வர்களுடைய தந்தையர் வீடுகள்
  rationale: தந்தைவழி அமைப்பை மறைக்காமல் வைத்தபடியே, சாதாரண நவீன தமிழ் வாசகருக்குப் புரியும் மொழிநடையைப் பேணுகிறது; בְנֵי என்பதிலுள்ள வம்சவழிச் சொல்லாட்சி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: הִיא צִיּוֹן என்பதன் இலக்கணத் தொடர்பு
  choice: தாவீதின் நகரத்தை விளக்கும் ‘அதாவது சீயோன்’
  alternative: ‘அதுவே சீயோன்’
  rationale: இது தாவீதின் நகரத்தையும் சீயோனையும் அடையாளப்படுத்தும் இடைச்செருகிய விளக்கம்; இரு தமிழ் வடிவங்களும் சாத்தியமானதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; நோக்கத் தொடர்பு மீண்டும் வரும் ‘அவர்களை ஒன்றுகூட்டினார்’ என்பதன் மூலம் வெளிப்படையாகப் பேணப்பட்டுள்ளது. ‘கோத்திரம்’, ‘உடன்படிக்கைப் பெட்டி’, ‘சீயோன்’ போன்ற நிலைபெற்ற வேதாகமச் சொற்கள் தொடர்ச்சிக்காக வைக்கப்பட்டுள்ளன.
