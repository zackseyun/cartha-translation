  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֚ק שְׁנֵ֣י הַ/לֻּח֔וֹת אֲשֶׁר נָתַ֥ן מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/010.yaml
  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
translation:
  language: ta
  text: பெட்டிக்குள், ஓரேபில் மோசே வைத்த[a] இரண்டு பலகைகளைத் தவிர வேறொன்றும் இல்லை; இஸ்ரவேல் மக்கள் எகிப்திலிருந்து புறப்பட்டபோது, அங்கே யாவே அவர்களுடன் உடன்படிக்கை செய்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல் நேரடியாக ‘கொடுத்த’ என்று பொருள்படும்; இச்சூழலில் பலகைகளைப் பெட்டிக்குள் வைத்ததை அது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: பெட்டிக்குள் ... தவிர வேறொன்றும் இல்லை
  rationale: எபிரெய எதிர்மறை இருப்புச் சொல்லையும் கட்டுப்படுத்தும் உருபையும் இயல்பான தமிழில் ‘தவிர வேறொன்றும் இல்லை’ என்று வழங்குகிறது.
- source_word: שְׁנֵי הַלֻּחוֹת
  choice: இரண்டு பலகைகள்
  rationale: ‘கல்’ என்பது இவ்வசனத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை; לֻחוֹת என்பதன் நேரடியான பொருள் காக்கப்படுகிறது.
- source_word: אֲשֶׁר נָתַן מֹשֶׁה
  choice: மோசே வைத்த
  rationale: נָתַן என்பதன் அடிப்படைப் பொருள் ‘கொடுத்த’ என்றாலும், பெட்டிக்குள் பலகைகள் இருப்பதைச் சொல்லும் இச்சூழலில் ‘வைத்த’ என்பதே இயல்பான இடவியல் பொருளைத் தருகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּחֹרֵב
  choice: ஓரேபில்
  rationale: எபிரெய இடப்பெயரான Horeb தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது; அதை ‘சீனாய்’ என்று ஒத்திசைக்கவில்லை.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: அங்கே யாவே அவர்களுடன் உடன்படிக்கை செய்தார்
  rationale: כרת என்பதன் நேரடிப் பொருள் ‘வெட்டினார்’; ஆனால் உடன்படிக்கைச் சூழலில் அது ‘உடன்படிக்கை செய்தார்’ என்ற நிலையான எபிரெய மரபுத்தொடர். மூலத்தில் ‘உடன்படிக்கை’ என்ற பெயர்ச்சொல் விடுபட்டிருந்தாலும், தமிழில் பொருள் தெளிவதற்காக வழங்கப்பட்டுள்ளது. ‘அங்கே’ என்பது அருகிலுள்ள இடப்பெயரான ஓரேபைச் சுட்டுகிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: நேரடியாக ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு மக்களினத்தையும் குறிக்கும் கூட்டுப்பொருளை நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: எகிப்திலிருந்து புறப்பட்டபோது
  rationale: בְּ உடன் வரும் வினைப்பெயரின் காலப்பொருளை ‘போது’ என்றும், יצא என்பதைக் ‘புறப்பட்ட’ என்றும் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள நான்கு எழுத்து இறைப் பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், அதன் வழக்கமான தமிழாக்க ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- issue: כרת உடன் வெளிப்படையாக இல்லாத ‘உடன்படிக்கை’ என்ற கருத்து
  choice: உடன்படிக்கை செய்தார்
  alternative: அவர்களுடன் வெட்டினார்
  rationale: இது எபிரெயத்தில் உடன்படிக்கை ஏற்படுத்துவதைச் சுட்டும் மரபுத்தொடர். நேரடி வடிவம் தமிழில் பொருளற்றதாக இருப்பதால், உட்கிடையாக உள்ள ‘உடன்படிக்கை’ தெளிவாக்கப்பட்டுள்ளது; எந்தச் சமயப் பிரிவின் தனிப்பட்ட விளக்கமும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் ஒரே வாக்கிய அமைப்பையும் ஓரேபைச் சுட்டும் தொடர்பையும் அரைப்புள்ளி மற்றும் ‘அங்கே’ என்பதன் மூலம் காத்துள்ளது. ‘கற்பலகைகள்’ என்று மூலத்தில் இல்லாத தகவல் சேர்க்கப்படவில்லை.
