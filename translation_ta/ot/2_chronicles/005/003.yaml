  text: וַ/יִּקָּהֲל֧וּ אֶל הַ/מֶּ֛לֶךְ כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל בֶּ/חָ֑ג ה֖וּא הַ/חֹ֥דֶשׁ הַ/שְּׁבִעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/003.yaml
  text: And all the men of Israel assembled before the king at the feast, that is, in the seventh month.
translation:
  language: ta
  text: பண்டிகையின்போது, அதாவது ஏழாம் மாதத்தில், இஸ்ரவேலின் ஆண்கள் அனைவரும் அரசனிடம் ஒன்றுகூடினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஆண்கள் அனைவரும்
  rationale: אִישׁ என்பதன் ஆண்பால் குறிப்பைத் தெளிவாகப் பாதுகாத்து, இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: אֶל הַמֶּלֶךְ
  choice: அரசனிடம்
  rationale: אֶל என்பதன் திசை/அணுகல் பொருளை இயல்பாக வெளிப்படுத்துகிறது; ‘அரசனுக்கு முன்பாக’ என்ற இடப்பொருளைத் தேவையின்றி இறுக்கமாக்கவில்லை.
- source_word: בֶּחָג
  choice: பண்டிகையின்போது
  rationale: בְּ முன்னொட்டின் காலச்சூழல் பொருளையும் חָג என்பதன் பண்டிகைப் பொருளையும் இயல்பாகக் காட்டுகிறது.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: அதாவது ஏழாம் மாதத்தில்
  rationale: சொற்சொல் அமைப்பு கடினமாக இருப்பதால், ஏழாம் மாதமே குறிப்பிடப்பட்ட பண்டிகையின் காலம் என்பதை விளக்கும் இணைப்பாக ‘அதாவது’ பயன்படுத்தப்படுகிறது; ஆங்கில ஆலோசனை உரையின் தேர்வுடனும் ஒத்துள்ளது.
theological_decisions: []
translation_notes:
  register: முறைசார்ந்ததாயும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதாயும் உள்ள நவீன நிலையான தமிழ். ‘அரசன்’, ‘ஒன்றுகூடினார்கள்’ ஆகியவை வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமான சொற்கள்.
