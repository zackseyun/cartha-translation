revisions:
- from: பின்பு ஆசாரியர்கள் யாவேயின் உடன்படிக்கைப் பெட்டியை அதன் இடத்துக்கு—ஆலயத்தின் உட்புறத் திருவிடமாகிய மகா பரிசுத்த இடத்துக்கு[a]—கேருபீன்களின் சிறகுகளுக்குக் கீழே கொண்டுவந்தார்கள்.
  to: பின்பு ஆசாரியர்கள் யாவேயின் உடன்படிக்கைப் பெட்டியை அதற்குரிய இடத்துக்கு, அதாவது ஆலயத்தின் உள்ளறையான மகா பரிசுத்த இடத்துக்கு[a], கேருபீன்களின் சிறகுகளின்கீழ் கொண்டுவந்தார்கள்.
