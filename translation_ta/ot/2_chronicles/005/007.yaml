source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קְּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
translation:
  language: ta
  text: பின்பு ஆசாரியர்கள் யாவேயின் உடன்படிக்கைப் பெட்டியை அதற்குரிய இடத்துக்கு, அதாவது ஆலயத்தின் உள்ளறையான மகா பரிசுத்த இடத்துக்கு[a], கேருபீன்களின் சிறகுகளின்கீழ் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகா பரிசுத்த ஸ்தலம்.”
    reason: கֹדֶשׁ הַקְּדָשִׁים என்பதற்கான மரபுவழி மாற்றுச் சொல்லை வழங்குகிறது; ஆங்கில POB அடிக்குறிப்பில் உள்ள “Holy of Holies” என்பதற்கு ஒத்ததாகும்.
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: கொண்டுவந்தார்கள்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் ‘கொண்டுவருதல்’ என்று பொருள்படும்; நிகழ்வின் தொடரையும் பொருளையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலய வழிபாட்டுப் பணியில் இருந்த குறிப்பிட்ட குருத்துவப் பணியாளர்களைக் குறிக்கும் தமிழ்வேதாகம மரபில் நன்கு அறியப்பட்ட சொல்.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: யாவேயின் உடன்படிக்கைப் பெட்டி
  rationale: எபிரெயக் கூட்டுச்சொல் அமைப்பின் உறவைத் தெளிவாக வைத்துக்கொண்டு, யாவேயின் உடன்படிக்கையோடு தொடர்புடைய பெட்டி என்பதை இயல்பான தமிழில் கூறுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைத் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מְקוֹמוֹ
  choice: அதன் இடம்
  rationale: பின்னொட்டு உடன்படிக்கைப் பெட்டியைக் குறிப்பதால், கூடுதல் விளக்கத்தைச் சேர்க்காமல் மூலத்தின் சுருக்கத்தைப் பேணுகிறது.
- source_word: דְּבִיר הַבַּיִת
  choice: ஆலயத்தின் உட்புறத் திருவிடம்
  rationale: דְּבִיר என்பது ஆலயத்தின் மிக உட்புறமான புனித அறையைக் குறிக்கிறது; ‘உட்புறத் திருவிடம்’ அதன் இருப்பிடத்தையும் வழிபாட்டுச் சிறப்பையும் தெளிவாகக் காட்டுகிறது.
- source_word: קֹדֶשׁ הַקְּדָשִׁים
  choice: மகா பரிசுத்த இடம்
  rationale: எபிரெய உயர்நிலைப் பொருளை நவீன வாசகர்களுக்குப் புரியும் சுருக்கமான, மரியாதைமிக்க தமிழில் தருகிறது.
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: கேருபீன்களின் சிறகுகளுக்குக் கீழே
  rationale: இடவுறவையும் பன்மை வடிவத்தையும் நேரடியாகப் பேணுகிறது; ‘கேருபீன்கள்’ என்பது இவ்வானுலக உயிரினங்களுக்கான வழக்கமான ஒலிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைத் தனிப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது; ‘யாவே’ என்பது அதை பட்டப்பெயராக மாற்றாமல் காக்கிறது.
- issue: קֹדֶשׁ הַקְּדָשִׁים என்ற உயர்நிலை புனிதச் சொற்றொடர்
  choice: மகா பரிசுத்த இடம்
  alternative: பரிசுத்தத்திலும் பரிசுத்தமான இடம்
  rationale: இரண்டு வடிவங்களும் எபிரெய உயர்நிலைக் கட்டமைப்பை வெளிப்படுத்துகின்றன; முதன்மைத் தேர்வு இயல்பான தமிழில் ஆலயத்தின் மிகப் புனிதமான உட்பகுதியைக் குறிக்கிறது, மாற்று வடிவம் மூல அமைப்பை இன்னும் வெளிப்படையாகக் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ஆலயச் சூழலைத் தெளிவுபடுத்த ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் தொடர்ச்சியாக வரும் இலக்கு இடங்கள் கோடுகளுக்குள் விளக்க அமைப்பாக இணைக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையில் [a] குறியீடு ‘its place’ என்பதற்குப் பின் இருந்தாலும், அதன் அடிக்குறிப்பு உண்மையில் קֹדֶשׁ הַקְּדָשִׁים என்பதற்கான மாற்று என்பதால் தமிழில் உரிய சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
