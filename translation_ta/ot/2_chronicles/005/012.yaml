base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
translation:
  language: ta
  text: பாடகர்களான லேவியர்கள் அனைவரும்—ஆசாப், ஏமான், எதுத்தூன், அவர்களுடைய மகன்கள், சகோதரர்கள் ஆகியோர்—மெல்லிய லினன் ஆடைகளை அணிந்து, கைத்தாளங்கள், யாழ்கள்[a], கின்னரங்கள் ஆகியவற்றோடு பலிபீடத்துக்குக் கிழக்கே[b] நின்றார்கள். அவர்களோடு நூற்றிருபது ஆசாரியர்கள் எக்காளங்களை ஊதிக்கொண்டிருந்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாழ் போன்ற இசைக்கருவிகள்’ என்றும் மொழிபெயர்க்கலாம். இங்கு குறிப்பிடப்படும் இரண்டு பண்டைய நரம்பிசைக் கருவிகளுக்கிடையிலான துல்லியமான வேறுபாடு உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பலிபீடத்தின் கிழக்குப் பக்கத்தில்.’
    reason: lexical_alternative
