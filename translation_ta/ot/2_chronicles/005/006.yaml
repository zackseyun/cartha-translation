  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֧ת יִשְׂרָאֵ֛ל הַ/נּוֹעָדִ֥ים עָלָ֖י/ו לִ/פְנֵ֣י הָ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: ta
  text: சாலொமோன் அரசனும், அவரிடம் கூடிவந்திருந்த[a] இஸ்ரவேலின் முழுச் சபையும், உடன்படிக்கைப் பெட்டியின் முன்பாக, அவற்றின் பெருந்தொகையினால் எண்ணவும் கணக்கிடவும் முடியாத சிறுகால்நடைகளையும்[b] மாடுகளையும் பலியாகச் செலுத்திக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடன் கூடிவந்திருந்த’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் மக்கள் சாலொமோனின் முன்னிலையில் கூடிவந்ததையோ அவருடன் ஒன்றுகூடியிருந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சிறுகால்நடைகள்’ என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் செம்மறியாடுகளையும் வெள்ளாடுகளையும் போன்றவற்றை உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: இஸ்ரவேலின் சபையார் அனைவரும்
  rationale: עֵדָה என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபையார்’ அதன் கூட்டுத் தன்மையை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; כָל என்பதற்காக ‘அனைவரும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: அவரிடம் கூடிவந்திருந்த
  rationale: נעד என்ற நிபால் வடிவம் கூடிவருதல் அல்லது ஒன்றுகூடுதல் என்ற பொருளைக் கொண்டது. עָלָיו இங்கு சாலொமோனை நோக்கி அல்லது அவருடன் கூடிவந்ததைக் குறிக்கலாம்; முதன்மை உரை ‘அவரிடம்’ என்று தருகிறது, மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִפְנֵי הָאָרוֹן
  choice: பெட்டிக்கு முன்பாக
  rationale: இது பெட்டியின் முன்னிலையைக் குறிக்கும் நேரடியான இடவியல் சொற்றொடர். சூழலில் இது உடன்படிக்கைப் பெட்டி என்பது தெளிவாக இருப்பதால், எபிரெய உரையில் உள்ள எளிய ‘பெட்டி’ என்ற வடிவமே காக்கப்படுகிறது.
- source_word: מְזַבְּחִים
  choice: பலியிட்டுக் கொண்டிருந்தார்கள்
  rationale: பங்கேற்புவினை காட்சியில் நடந்துகொண்டிருந்த செயலைக் காட்டுகிறது; தொடர்நிலைத் தமிழ் வடிவம் அந்த அம்சத்தைப் பாதுகாக்கிறது.
- source_word: צֹאן וּבָקָר
  choice: செம்மறியாடுகளையும் மாடுகளையும்
  rationale: בָּקָר தெளிவாக மாடுகளைக் குறிக்கிறது. צֹאן சிறுகால்நடைகளை, குறிப்பாக செம்மறியாடுகளையும் வெள்ளாடுகளையும், உள்ளடக்கக்கூடிய விரிவான சொல்; வாசிப்பின் இயல்புக்காக ‘செம்மறியாடுகள்’ முதன்மை உரையில் தரப்பட்டு அதன் பரந்த பொருள் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ מֵרֹב
  choice: அவற்றின் பெருந்தொகையால் எண்ணவும் கணக்கிடவும் முடியாத
  rationale: இரு நெருங்கிய பொருளுடைய வினைகளையும் தனித்தனியாக வைத்திருப்பது எபிரெயத்தின் வலியுறுத்தலைப் பாதுகாக்கிறது; מֵרֹב தரும் காரணப் பொருள் ‘பெருந்தொகையால்’ என வெளிப்படுத்தப்படுகிறது.
