base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
translation:
  language: ta
  text: இவ்வாறு, சாலொமோன் யாவேவின் ஆலயத்திற்காகச் செய்த வேலை அனைத்தும் நிறைவடைந்தது. பின்பு சாலொமோன் தன் தந்தை தாவீதின் பரிசுத்தப் பொருள்களையும்[a], வெள்ளியையும், பொன்னையும், எல்லாப் பாத்திரங்களையும் கொண்டுவந்து, தேவனுடைய ஆலயத்தின் கருவூலங்களில் வைத்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் தந்தை தாவீது அர்ப்பணித்த பொருள்களையும்” அல்லது “தன் தந்தை தாவீதின் அர்ப்பணிக்கப்பட்ட பொருள்களையும்.”
    reason: קָדְשֵׁי என்பது பரிசுத்தப் பொருள்கள் என்றும் பரிசுத்தப் பயன்பாட்டுக்காக அர்ப்பணிக்கப்பட்ட பொருள்கள் என்றும் பொருள்படக்கூடும்.
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: நிறைவடைந்தது
  rationale: שלם என்பதன் இச்சூழலிலான முடிவுற்ற நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: כָּל הַמְּלָאכָה
  choice: வேலை அனைத்தும்
  rationale: ஆலயக் கட்டுமானம் மற்றும் அதனுடன் தொடர்புடைய முழுப் பணித்திட்டத்தையும் குறிக்கும் מְלָאכָה என்பதன் பரந்த பொருளைப் பேணுகிறது.
- source_word: לְבֵית יְהוָה
  choice: யாவேவின் ஆலயத்திற்காக
  rationale: לְ என்பதன் நோக்கப் பொருளை ‘ஆலயத்திற்காக’ வெளிப்படுத்துகிறது; בַּיִת இங்கு வழிபாட்டு ஆலயத்தைக் குறைப்பதால் இயல்பான தமிழுக்காக ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது; தெய்வீகப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיָּבֵא
  choice: கொண்டுவந்து
  rationale: Hiphil வடிவின் ‘உள்ளே கொண்டுவருதல்’ என்ற திசைசார் பொருளைச் சூழலில் இயல்பாகத் தருகிறது.
- source_word: קָדְשֵׁי דָּוִיד אָבִיו
  choice: தன் தந்தை தாவீதின் பரிசுத்தப் பொருள்கள்
  rationale: קדשׁ என்பதன் பரிசுத்தமான அல்லது அர்ப்பணிக்கப்பட்ட பொருள்கள் என்ற பொருளை நேரடியாக வைத்துக்கொண்டு, மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: வெள்ளியையும், பொன்னையும்
  rationale: தனி நேரடி செயப்படுபொருள்களாக வரும் பட்டியல் அமைப்பைத் தமிழின் ‘-ஐயும்’ வடிவால் பேணுகிறது.
- source_word: כָּל הַכֵּלִים
  choice: மற்ற எல்லாப் பாத்திரங்களையும்
  rationale: ஆலயச் சூழலில் כֵּלִים என்பதற்கு மரியாதைமிக்க பொதுச் சொல்லான ‘பாத்திரங்கள்’ பொருந்துகிறது; ‘மற்ற’ என்பது முந்தைய வெள்ளி, பொன்னுக்குப் பின்வரும் பட்டியலை இயல்பாக்குகிறது.
- source_word: נָתַן
  choice: வைத்தான்
  rationale: கருவூலங்களில் பொருள்களை இடுதல் என்ற சூழலுக்கு נתן என்பதன் எளிய, துல்லியமான தமிழ் இணை.
- source_word: בְּאֹצְרוֹת
  choice: கருவூலங்களில்
  rationale: אֹצָר என்பதன் செல்வங்களுக்கான களஞ்சியம்/கருவூலம் என்ற பொருளையும் எபிரெயப் பன்மையையும் பேணுகிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயம்
  rationale: முதல் தொடரிலுள்ள யாவே என்ற தனிப்பெயருக்கு மாறாக இங்கு வரும் אֱלֹהִים என்பதை ‘தேவன்’ என்று வேறுபடுத்திப் பேணுகிறது; இயல்பான தமிழுக்காக ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בֵּית יְהוָה மற்றும் בֵּית הָאֱלֹהִים ஆகிய இரு சொற்றொடர்களின் வேறுபாடு
  choice: ‘யாவேவின் ஆலயம்’ மற்றும் ‘தேவனுடைய ஆலயம்’ என வேறுபாட்டைப் பேணுதல்
  alternative: இரண்டையும் ஒரே மாதிரியாக ‘தேவாலயம்’ என்று வழங்குதல்
  rationale: ஒரே வசனத்தில் மூல எபிரெயம் பயன்படுத்தும் யாவே/தேவன் என்ற மாறுபாட்டை மறைக்காமல் பாதுகாக்கிறது.
- issue: קָדְשֵׁי என்பதன் அர்த்த நுணுக்கம்
  choice: முதன்மை உரையில் ‘பரிசுத்தப் பொருள்கள்’; அடிக்குறிப்பில் ‘அர்ப்பணித்த பொருள்கள்’
  alternative: முதன்மை உரையிலேயே ‘அர்ப்பணித்த பொருள்கள்’
  rationale: சொல்லின் பரிசுத்தம் மற்றும் அர்ப்பணிப்பு ஆகிய இரு நெருங்கிய நுணுக்கங்களையும் ஒன்றை மட்டும் தீர்மானித்து மறைக்காமல் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. சாதாரண வாசகர்களுக்குத் தெளிவாக இருக்க ‘வீடு’ என்பதற்குப் பதில் ஆலயச் சூழலை வெளிப்படுத்தும் ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; அதேவேளை யாவே/தேவன் என்ற மூலத்தின் பெயர்வழி வேறுபாடு பேணப்பட்டுள்ளது.
