source:
  edition: WLC
  text: וַ/יָּבֹ֣א עָלָ֔י/ו תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּ֥צַר ל֖/וֹ וְ/לֹ֥א חֲזָקֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
translation:
  language: ta
  text: அப்பொழுது அசீரியாவின் அரசனான திக்லாத்-பிலேசர் அவனுக்கு எதிராக வந்து, அவனை நெருக்கினான்[a]; ஆனால் அவனைப் பலப்படுத்தவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனைத் துன்புறுத்தினான்.” எபிரெயச் சொல் அவனை அழுத்தத்திற்கும் துயரத்திற்கும் உள்ளாக்கியதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  choice: அவனுக்கு எதிராக வந்து
  rationale: இராணுவ-அரசியல் சூழலில் בוא על பகைமையுடன் ஒருவருக்கு எதிராக வருவதைக் குறிக்கக்கூடும்; ஆகவே நடுநிலையான ‘அவனிடம் வந்து’ என்பதைவிட இத்தேர்வு சூழலுக்குப் பொருந்துகிறது.
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  choice: திக்லாத்-பிலேசர்
  rationale: அசீரிய அரசனின் பெயருக்குத் தமிழில் புரிந்துகொள்ளத்தக்க, மூல வடிவுக்கு நெருக்கமான ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரியாவின் அரசன்
  rationale: இங்கு אַשּׁוּר புவிசார் அரசைக் குறிப்பதால், தமிழில் வழக்கமான ‘அசீரியா’ என்ற பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּצַר לוֹ
  choice: அவனை நெருக்கினான்
  rationale: צרר என்பதன் அழுத்துதல், தொல்லைப்படுத்துதல், துன்பத்திற்கு உள்ளாக்குதல் ஆகிய பரந்த பொருளை இது இயல்பாகத் தருகிறது; ‘முற்றுகையிட்டான்’ என்பது மூலத்தைவிட குறுகிய இராணுவப் பொருளாகிவிடும்.
- source_word: וְלֹא חֲזָקוֹ
  choice: ஆனால் அவனைப் பலப்படுத்தவில்லை
  rationale: חזק என்பதன் ‘பலப்படுத்து/வலுப்படுத்து’ என்ற பொருளைப் பாதுகாக்கிறது. சூழலிலுள்ள எதிர்மறை மாறுபாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது; பொதுவான ‘உதவவில்லை’ என்பதைக் காட்டிலும் மூலச் சொல்லுக்கு நெருக்கமானது.
