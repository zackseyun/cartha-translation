translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. எபிரெய வாக்கியத்தின் இரண்டு செயல்களையும் தனித்தனியாகப் பாதுகாத்து, எதிர்மறை தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
