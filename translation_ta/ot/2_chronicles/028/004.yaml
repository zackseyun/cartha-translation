revisions:
- from: அவன் மேடைகளிலும்[a] குன்றுகளின்மேலும், பசுமையான ஒவ்வொரு மரத்தின் கீழும் பலியிட்டுத் தூபம் எரித்தான்.
  to: அவன் பலியிட்டு, உயர்ந்த வழிபாட்டு இடங்களிலும்[a], குன்றுகளின்மேலும், பசுமையான ஒவ்வொரு மரத்தின் கீழும் தூபம் எரித்தான்.
  rationale: ‘High places’ என்பதன் தொழில்நுட்ப வழிபாட்டு-இடப் பொருளை நவீன தமிழில் தெளிவாக்கி, மூலத்தில் குறிப்பிடப்படாத பலிப்பொருள்களை அடிக்குறிப்பிலிருந்து நீக்கியுள்ளோம். இடங்களின் பட்டியலும் இரு வழிபாட்டுச் செயல்களும் மூலத்தின் பொருளுக்கு ஏற்பத் தக்கவைக்கப்பட்டுள்ளன.
