source:
  edition: WLC
  text: וַ/יְזַבֵּ֧חַ וַ/יְקַטֵּ֛ר בַּ/בָּמ֖וֹת וְ/עַל הַ/גְּבָע֑וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: ta
  text: அவன் பலியிட்டு, உயர்ந்த வழிபாட்டு இடங்களிலும்[a], குன்றுகளின்மேலும், பசுமையான ஒவ்வொரு மரத்தின் கீழும் தூபம் எரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உயர்ந்த வழிபாட்டு இடங்களிலும், குன்றுகளின்மேலும், இலைகள் அடர்ந்த ஒவ்வொரு மரத்தின் கீழும் பலிகளைச் செலுத்தி, புகை எழச்செய்தான்.’
    reason: זבח, קטר, במות, רענן ஆகியவற்றுக்கான சாத்தியமான விரிவான அல்லது மாற்று மொழிபெயர்ப்புகளைப் பாதுகாக்கிறது; קטר-க்கு மூலத்தில் குறிப்பிடப்படாத பொருளைச் சேர்ப்பதில்லை.
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: பலியிட்டான்
  rationale: זבח என்பதன் பியேல் வடிவம் பலி செலுத்தும் செயலைக் குறிக்கிறது. ‘பலியிட்டான்’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַיְקַטֵּר
  choice: தூபம் எரித்தான்
  rationale: קטר என்பதன் பியேல் வடிவம் தூபத்தை எரிப்பதையோ பலிப்பொருளைப் புகையாக எழச்செய்வதையோ குறிக்கலாம். இச்சூழலில் ‘தூபம் எரித்தான்’ இயல்பான சாத்தியமான பொருளைத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּבָּמוֹת
  choice: மேடைகளிலும்
  rationale: במות என்பது வழிபாட்டுக்குரிய உயர்ந்த இடங்கள் அல்லது வழிபாட்டு மேடைகள் என்ற தொழில்நுட்பப் பொருளைக் கொண்டது. ‘மேடைகள்’ பழைய ஏற்பாட்டு வழிபாட்டுச் சூழலின் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: וְעַל הַגְּבָעוֹת
  choice: குன்றுகளின்மேலும்
  rationale: גבעות என்பதன் சாதாரண பொருள் ‘குன்றுகள்’. இடத்தைக் குறிக்கும் על என்பதற்கு ‘மேல்’ இயல்பாகப் பொருந்துகிறது.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: பசுமையான ஒவ்வொரு மரத்தின் கீழும்
  rationale: רענן செழிப்பான, புத்துணர்ச்சியுள்ள, பசுமையான தாவரத்தைக் குறிக்கிறது. ‘பசுமையான’ என்பது மூல உருவகத்தையும் பழைய ஏற்பாட்டில் திரும்பத் திரும்ப வரும் சொற்றொடரையும் காக்கிறது.
theological_decisions:
- issue: முறைகேடான அல்லது விக்கிரக வழிபாட்டுடன் தொடர்புடைய இடங்களைக் குறிக்கும் மரபுச் சொல்லாட்சி
  choice: ‘மேடைகள்’ என்றும் ‘பசுமையான ஒவ்வொரு மரத்தின் கீழும்’ என்றும் மூலத்தின் வழிபாட்டு இடச் சொல்லாட்சியைப் பாதுகாத்தல்
  alternative: ‘புறமதக் கோயில்கள்’ அல்லது ‘இலைகள் அடர்ந்த ஒவ்வொரு மரத்தின் கீழும்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை வழிபாட்டுச் சூழலில் நிலைபெற்ற சொற்களைப் பயன்படுத்துகிறது. அவற்றை வெளிப்படையான விளக்கமாக மாற்றாமல் வைத்திருப்பது வேதாகமத்தின் பிற பகுதிகளுடனான தொடர்பையும் மூலத்தின் மறைமுகக் கண்டனத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ஒருமை ஆண்பால் வினைமுற்றுகள் மூலத்தின் கர்த்தாவைத் தெளிவாகக் காட்டுகின்றன. ‘மேடைகள்’ என்ற மரபுச் சொல் அடிக்குறிப்பின் உதவியுடன் வழிபாட்டு இடம் என்ற தொழில்நுட்பப் பொருளில் பயன்படுத்தப்பட்டுள்ளது.
