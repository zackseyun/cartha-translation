source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
translation:
  language: ta
  text: ஆகாஸ் அரசனானபோது அவனுக்கு இருபது வயது. அவன் எருசலேமில் பதினாறு ஆண்டுகள் ஆட்சி செய்தான். தன் தந்தையான தாவீதைப்போல்[a] அவன் யாவேயின் பார்வையில் சரியானதைச் செய்யவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘தந்தை’ என்பது ஆகாஸின் உடனடித் தந்தையை அல்ல, அவனுடைய அரச வம்சத்தின் முன்னோரான தாவீதைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: இருபது வயதுடையவனாக இருந்தான்
  rationale: இது வயதைக் குறிப்பிடும் வழக்கமான எபிரேயச் சொற்றொடர். சொற்சொல்லான ‘இருபது ஆண்டுகளின் மகன்’ என்பதற்குப் பதிலாக, இயல்பான நவீனத் தமிழில் அதன் பொருள் தரப்பட்டுள்ளது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: அரசாட்சியை ஏற்ற காலத்தைச் சுட்டும் எபிரேய வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: அரசர் என்ற பட்டத்தை மட்டும் அல்லாமல், அரசாட்சியை நடத்தியதையும் இந்த வினைச்சொல் குறிக்கிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: ஆட்சி நடைபெற்ற இடத்தைக் குறிக்கும் நேரடியான இடவெற்றுமைத் தொடர்.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: நேர்மையானதைச் செய்யவில்லை
  rationale: நாளாகமம் மற்றும் அரசர்கள் நூல்களில் காணப்படும் அறநெறி மதிப்பீட்டுச் சூத்திரத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: ‘கண்களில்’ என்ற எபிரேய உருவகத்தின் பொருளான தெய்வீக மதிப்பீட்டை இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துத் தருகிறது.
- source_word: כְּדָוִיד אָבִיו
  choice: தன் தந்தையான தாவீதைப்போல்
  rationale: ‘தந்தை’ என்ற எபிரேய உறவுமுறைச் சொல்லை முதன்மை உரையில் காக்கிறது; இங்கு அது உடனடித் தந்தையை அல்ல, அரச வம்ச முன்னோரைச் சுட்டுவதை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: தாவீதை ‘தந்தை’ என்று அழைத்தல்
  choice: மூலத்தின் உறவுமுறைச் சொல்லை உரையில் காத்து, அடிக்குறிப்பில் ‘அரச வம்ச முன்னோர்’ என்று விளக்குதல்
  alternative: தன் முன்னோரான தாவீதைப்போல்
  rationale: אָבִיו என்பதன் சொற்படிவத்தையும் அரச வம்சப் பயன்பாட்டையும் ஒருசேர காக்கிறது; தாவீது ஆகாஸின் உடனடித் தந்தை என்ற தவறான புரிதலை அடிக்குறிப்பு தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேய அரசாட்சி அறிமுகச் சூத்திரமும் தெய்வீக மதிப்பீட்டுத் தொடரும் இயல்பான தமிழில் காக்கப்பட்டுள்ளன.
