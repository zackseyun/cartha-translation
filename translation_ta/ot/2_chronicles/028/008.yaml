base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
translation:
  language: ta
  text: இஸ்ரவேல் மக்கள் தங்கள் சகோதரர்களிடமிருந்து[a] பெண்கள், மகன்கள், மகள்கள் என இருநூறாயிரம் பேரைச் சிறைப்பிடித்தார்கள். மேலும், அவர்களிடமிருந்து ஏராளமான கொள்ளைப்பொருளைக் கொள்ளையிட்டார்கள்; அந்தக் கொள்ளைப்பொருளைச் சமாரியாவுக்குக் கொண்டுவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் உறவினர்களிடமிருந்து’ அல்லது ‘சக இஸ்ரவேலர்களிடமிருந்து.’ எபிரெயத்தில் ‘தங்கள் சகோதரர்களிடமிருந்து’ என்று உள்ளது; இது அவர்களுக்குள்ள பொதுவான உறவுமுறையை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: சிறைப்பிடித்தார்கள்
  rationale: שבה என்பது போரில் மனிதர்களைச் சிறைபிடிப்பதைக் குறிக்கிறது; தமிழில் ‘சிறைப்பிடித்தார்கள்’ என்பது இயல்பாகவும் துல்லியமாகவும் அந்தப் பொருளைத் தருகிறது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருள் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், நவீன தமிழில் அது இயல்பற்றதாக இருக்கும். ‘இஸ்ரவேல் மக்கள்’ அதன் மக்களினப் பொருளைத் தெளிவாக வழங்குகிறது; உறவுமுறை வலியுறுத்தல் அடுத்துள்ள ‘சகோதரர்கள்’ என்பதில் பாதுகாக்கப்படுகிறது.
- source_word: מֵאֲחֵיהֶם
  choice: தங்கள் சகோதரர்களிடமிருந்து
  rationale: אָח என்பது இங்கு உறவினர் அல்லது சக இஸ்ரவேலரையும் குறிக்கக்கூடும். ‘சகோதரர்கள்’ என்ற நேரடியான வடிவம், உடன்பிறப்பின மக்களுக்கிடையிலான போரின் அற மற்றும் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- source_word: מָאתַיִם אֶלֶף
  choice: இருநூறாயிரம் பேர்
  rationale: எண்ணிக்கையை நேரடியாகத் தருகிறது; மனிதர்களின் மொத்த எண்ணிக்கை என்பதால் ‘பேர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: נָשִׁים בָּנִים וּבָנוֹת
  choice: பெண்கள், மகன்கள், மகள்கள்
  rationale: மூலத்தில் தனித்தனியாகக் குறிப்பிடப்பட்டுள்ள மூன்று குழுக்களையும் ஒன்றாக ‘குழந்தைகள்’ என்று சுருக்காமல் பாதுகாக்கிறது.
- source_word: שָׁלָל רָב בָּזְזוּ
  choice: ஏராளமான கொள்ளைப்பொருளைக் கொள்ளையிட்டு
  rationale: שָׁלָל என்பது போரில் கைப்பற்றப்படும் கொள்ளைப்பொருள்; בָּזְזוּ என்பது கொள்ளையிடுதலைக் குறிக்கிறது. பெயர்ச்சொல்–வினைச்சொல் தொடர்பைத் தமிழ் இயல்புக்கு ஏற்றவாறு வைத்திருக்கிறது.
- source_word: וַיָּבִיאוּ אֶת־הַשָּׁלָל לְשֹׁמְרוֹן
  choice: அதைச் சமாரியாவுக்குக் கொண்டுவந்தார்கள்
  rationale: முந்தைய ‘கொள்ளைப்பொருள்’ என்பதை ‘அதை’ என்று இயல்பாகச் சுட்டி, சமாரியா என்ற நிலையான தமிழ் இடப்பெயரைப் பயன்படுத்துகிறது.
theological_decisions:
- issue: இஸ்ரவேலருக்குள் நடந்த மோதலில் உறவுமுறை மொழி
  choice: தங்கள் சகோதரர்களிடமிருந்து
  alternative: தங்கள் உறவினர்களிடமிருந்து / சக இஸ்ரவேலர்களிடமிருந்து
  rationale: சிறைப்பட்டவர்கள் அந்நிய எதிரிகள் அல்ல, ஒரே மக்களினத்தைச் சேர்ந்தவர்கள் என்ற மூலத்தின் அற மற்றும் உடன்படிக்கை சார்ந்த பதற்றத்தை ‘சகோதரர்கள்’ பாதுகாக்கிறது; விரிவான சாத்தியப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டுள்ளது. மூலத்தின் உறவுமுறை மொழியும் மூன்று வகையினரின் பட்டியலும் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற பிரிவுசார் விளக்கம் சேர்க்கப்படவில்லை.
