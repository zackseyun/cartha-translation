source:
  edition: WLC
  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
translation:
  language: ta
  text: ஏனெனில் ஆகாஸ் யாவேயின் ஆலயத்திலிருந்தும்[a], அரச அரண்மனையிலிருந்தும், உயரதிகாரிகளிடமிருந்தும் செல்வங்களைப் பறித்து அசீரியாவின் அரசனுக்குக் கொடுத்தான்; ஆனால் அது அவனுக்கு உதவவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பறித்து” என மொழிபெயர்க்கப்பட்ட மூலச்சொல் அடிப்படையில் “பிரித்து” அல்லது “பங்கிட்டான்” என்றும் பொருள்படலாம். இங்கு ஆலயம், அரண்மனை, உயரதிகாரிகள் ஆகியோரிடமிருந்து செல்வங்களை எடுத்து அசீரிய அரசனுக்குக் கொடுத்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் எபிரெய இணைப்பின் வலிமையைப் பேணுகிறது.
- source_word: חָלַק
  choice: கொள்ளையிட்டு
  rationale: அடிப்படைப் பொருள் ‘பங்கிட்டான்’ என்றாலும், இச்சூழலில் ஆலயம், அரண்மனை, தலைவர்கள் ஆகியோரிடமிருந்து செல்வங்களைப் பறித்து அசீரிய அரசனுக்குக் கொடுத்த செயலைக் குறிக்கிறது; எனவே சூழல்சார் பொருளை இயல்பாகத் தருகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: ‘யாவேயின் வீடு’ என்பதன் வரலாற்றுச் சூழலிலான தெளிவான நவீனத் தமிழ் வடிவம்; இது எருசலேம் ஆலயத்தைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பட்ட இறைபெயரைப் பெயராகவே ஒலிபெயர்க்கிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரச அரண்மனை
  rationale: சொல்லுக்குச் சொல் ‘அரசனின் வீடு’; இங்கு அரசனுடைய அரண்மனையைக் குறிக்கும் என்பதால் நவீனத் தமிழில் தெளிவாக வழங்கப்படுகிறது.
- source_word: הַשָּׂרִים
  choice: தலைவர்கள்
  rationale: அரசவையின் உயர்நிலை அதிகாரிகள் அல்லது பிரபுக்களைக் குறிக்கும் விரிவுடைய சொல்லை மிகக் குறுகலாக வரையறுக்காமல் வழங்குகிறது.
- source_word: וַיִּתֵּן
  choice: கொடுத்தான்
  rationale: எளிய தொடர்ச்சியான இறந்தகாலச் செயலை இயல்பான தமிழில் தருகிறது.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசனுக்கு
  rationale: பெறுநரைத் தெளிவாகக் குறிக்கும் நேரடியான தமிழ் வடிவம்.
- source_word: וְלֹא לְעֶזְרָה לוֹ
  choice: ஆனாலும் அது அவனுக்கு உதவவில்லை
  rationale: கொடுக்கப்பட்ட செல்வம் அல்லது காணிக்கை கூட்டாக எடுத்துக்கொள்ளப்பட்டு, எதிர்பார்த்த உதவியைப் பெற்றுத் தரவில்லை என்ற விளைவை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப்பட்டத்தை அல்ல, நான்கு எழுத்துகளாலான தனிப்பட்ட இறைபெயரையே பயன்படுத்துகிறது; ஆகவே அந்தப் பெயர் ஒலிபெயர்க்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடை. மூலத்தின் மூன்று தனித்தனி பொருட்கள் தெளிவாகப் பட்டியலிடப்பட்டுள்ளன; இறுதிக் கூறின் ‘அது’ கொடுக்கப்பட்ட செல்வத்தை அல்லது காணிக்கையைத் தொகுப்பாகக் குறிக்கிறது.
