translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் மரத்தன்மையைத் தவிர்த்து, தலைவர்களின் குழுவில் சிலர் செயல்பட்டனர் என்ற பொருள் தெளிவாக வைக்கப்பட்டுள்ளது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றவாறு ஒலிபெயர்க்கப்பட்டுள்ளன.
