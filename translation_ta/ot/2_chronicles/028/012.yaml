revisions:
- from: 'அப்போது எபிராயீம் மக்களின் தலைவர்களில் சிலர், படையிலிருந்து திரும்பிவந்தவர்களை எதிர்த்து நின்றார்கள்: யோகனானின் மகன் அசரியா, மெசில்லேமோத்தின் மகன் பெரெகியா, சல்லூமின் மகன் எசேக்கியா, அத்லாயின் மகன் அமாசா ஆகியோரே அவர்கள்.'
  to: 'அப்போது, எபிராயீமின் தலைவர்களில் சிலர் படையிலிருந்து வந்தவர்களை எதிர்த்து நின்றனர்: யெகோகனானின் மகன் அசரியா, மெஷில்லேமோத்தின் மகன் பெரெக்கியா, சல்லூமின் மகன் எசேக்கியா, அத்லாயின் மகன் அமாசா.[a]'
