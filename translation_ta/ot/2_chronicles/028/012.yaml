base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
translation:
  language: ta
  text: 'அப்போது, எபிராயீமின் தலைவர்களில் சிலர் படையிலிருந்து வந்தவர்களை எதிர்த்து நின்றனர்: யெகோகனானின் மகன் அசரியா, மெஷில்லேமோத்தின் மகன் பெரெக்கியா, சல்லூமின் மகன் எசேக்கியா, அத்லாயின் மகன் அமாசா.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எபிராயீமின் புதல்வரின் தலைவர்களில் சிலர்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “எபிராயீமின் புதல்வரின் தலைவர்களிலிருந்து” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: எதிர்த்து நின்றார்கள்
  rationale: קום உடன் עַל சேர்ந்திருப்பதால், கதைச்சூழலில் தீர்மானமாக எழுந்து எதிர்கொண்ட செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲנָשִׁים מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  choice: எபிராயீம் மக்களின் தலைவர்களில் சிலர்
  rationale: எபிராயீமின் மகன்கள் என்ற எபிரெய இனக்குழுக் கட்டமைப்பை நவீன தமிழில் இயல்பாகவும், רָאשֵׁי என்பதன் அங்கீகரிக்கப்பட்ட தலைமைப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: עַל
  choice: எதிர்த்து
  rationale: קום என்பதோடு வரும் עַל இங்கு எதிர்ப்பு அல்லது நேரடி எதிர்கொள்ளுதலைக் குறிக்கிறது.
- source_word: הַבָּאִים מִן הַצָּבָא
  choice: படையிலிருந்து திரும்பிவந்தவர்களை
  rationale: בוא என்ற பங்கேற்புவினையின் வருகைப் பொருளையும், போர்ப்படையிலிருந்து வந்துகொண்டிருந்த சூழலையும் இயல்பான தமிழில் காட்டுகிறது; 'திரும்பி' என்பது உடனடி சூழலால் விளங்கும் கருத்து.
- source_word: עֲזַרְיָהוּ ... בֶּרֶכְיָהוּ ... יְחִזְקִיָּהוּ ... עֲמָשָׂא
  choice: அசரியா ... பெரெகியா ... எசேக்கியா ... அமாசா
  rationale: தனிப்பெயர்கள் தமிழில் நிலைபெற்ற வேதாகம ஒலிபெயர்ப்பு மரபுக்கேற்ப தரப்பட்டுள்ளன.
- source_word: בֶן
  choice: மகன்
  rationale: தந்தைவழி அடையாளத்தைக் குறிக்கும் எபிரெய சொல்லின் நேரான, இயல்பான தமிழ் இணை.
