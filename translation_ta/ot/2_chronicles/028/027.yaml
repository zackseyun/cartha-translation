source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ב אָחָ֜ז עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ֤/הוּ בָ/עִיר֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֚י לֹ֣א הֱבִיאֻ֔/הוּ לְ/קִבְרֵ֖י מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ יְחִזְקִיָּ֥הֽוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
translation:
  language: ta
  text: ஆகாஸ் தன் முன்னோர்களோடு துயிலடைந்தான். அவர்கள் அவனை எருசலேம் நகரத்தில் அடக்கம் செய்தார்கள்; ஏனெனில் அவனை இஸ்ரவேல் அரசர்களின் கல்லறைகளுக்குள்[a] கொண்டுபோகவில்லை. அவனுக்குப் பதிலாக அவன் மகன் எசேக்கியா அரசனானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில், “இஸ்ரவேல் அரசர்களின் கல்லறைகள்” என்று உள்ளது. ஆகாஸ் யூதாவின் அரசனாக இருந்ததால், இது தாவீதின் வம்சத்து அரசர்களின் கல்லறைகளைக் குறிப்பதாகச் சிலர் புரிந்துகொள்கிறார்கள்; சிலர் இங்கு “யூதா அரசர்கள்” என்று எதிர்பார்க்கலாம் என்றும் கருதுகிறார்கள்.
    reason: மசோரா உரையின் ‘இஸ்ரவேல்’ வாசிப்பை மாற்றாமல், வரலாற்றுச் சூழலால் எழும் மாற்று விளக்கத்தையும் எதிர்பார்ப்பையும் எச்சரிக்கையான மொழியில் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு துயிலடைந்தான்
  rationale: அரசர்களின் மரண அறிவிப்புகளில் வரும் எபிரெய மரபுத்தொடரின் மரணப் பொருளையும் அதன் உருவகத்தையும் காக்கிறது. ‘தந்தையரோடு’ என்பதைவிட ‘முன்னோர்களோடு’ என்பது இன்றைய தமிழில் வம்சாவளிப் பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவர்கள் அவனை ... அடக்கம் செய்தார்கள்
  rationale: மூன்றாம் நபர் பன்மைச் செயப்பாட்டு வினையையும் நேரடி செயப்படுபொருளையும் அப்படியே பிரதிபலிக்கிறது.
- source_word: בָעִיר בִּירוּשָׁלִַם
  choice: எருசலேம் நகரத்தில்
  rationale: ‘நகரத்தில், எருசலேமில்’ என்ற இரு கூறுகளையும் இயல்பான நவீனத் தமிழில் ஒருங்கிணைக்கிறது; நகருக்குள் அடக்கம் செய்யப்பட்டான் என்ற இடப்பொருளைத் தக்கவைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன் கூறப்பட்ட அடக்க இடத்திற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: לֹא הֱבִיאֻהוּ
  choice: அவனை ... கொண்டுபோகவில்லை
  rationale: ‘அடக்கம் செய்யவில்லை’ என்று விளைவுப் பொருளாக மாற்றாமல், எபிரெய மூலத்திலுள்ள ‘கொண்டுவருதல்/கொண்டுபோதல்’ என்ற இயக்க மொழியைப் பாதுகாக்கிறது.
- source_word: לְקִבְרֵי
  choice: கல்லறைகளுக்குள்
  rationale: அரச வம்சத்தாருக்குரிய முறையான அடக்க இடங்களைக் குறிக்கும் சூழலுக்கு ‘கல்லறைகள்’ பொருத்தமானது; முன்னொட்டின் உட்புகும் திசைப்பொருளை ‘-க்குள்’ காட்டுகிறது.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின்
  rationale: சூழலில் ‘யூதா அரசர்கள்’ என எதிர்பார்க்கப்படலாம் என்றாலும், மசோரா எபிரெய உரை வெளிப்படையாக ‘இஸ்ரவேல்’ எனக் கூறுவதால் அதைத் திருத்தாமல் வைத்திருக்கிறது.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக ... அரசனானான்
  rationale: அரியணை வாரிசாக அவனுடைய இடத்தை மகன் ஏற்றான் என்ற தொடர்ச்சிப் பொருளை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: ‘இஸ்ரவேல் அரசர்கள்’ என்பதை வரலாற்றுச் சூழலுக்கேற்ப ‘யூதா அரசர்கள்’ என்று சீராக்குவதா?
  choice: முதன்மை உரையில் ‘இஸ்ரவேல் அரசர்கள்’ என்பதையே வைத்தல்
  alternative: ‘யூதா அரசர்கள்’ அல்லது ‘தாவீதின் வம்சத்து அரசர்கள்’
  rationale: மசோரா உரை ‘இஸ்ரவேல்’ என்றே வாசிக்கிறது. ஆகாஸ் யூதாவின் அரசனாக இருந்ததால் எழும் பதற்றத்தை மொழிபெயர்ப்பில் மறைக்காமல், மாற்று விளக்கத்தை அடிக்குறிப்பில் தருவது மூலமொழி முன்னுரிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. மரண அறிவிப்பின் எபிரெய மரபுத்தொடர் ‘துயிலடைந்தான்’ என்று பாதுகாக்கப்பட்டாலும், சூழல் அதன் மரணப் பொருளைத் தெளிவாக்குகிறது. ‘இஸ்ரவேல்’ என்ற சிக்கலான மூல வாசிப்பு சீராக்கப்படவில்லை.
