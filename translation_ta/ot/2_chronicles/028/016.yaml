source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא שָׁלַ֞ח הַ/מֶּ֧לֶךְ אָחָ֛ז עַל מַלְכֵ֥י אַשּׁ֖וּר לַ/עְזֹ֥ר לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/016.yaml
  text: At that time King Ahaz sent to the kings of Assyria for help[a].
translation:
  language: ta
  text: அந்தக் காலத்தில், அகாஸ் அரசன் தனக்கு உதவி செய்யும்படி வேண்டி அசீரிய அரசர்களிடம்[a] அனுப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அசீரிய அரசர்கள்”; வரலாற்றுச் சூழலுடன் ஒத்திசைப்பதற்காகச் சில மொழிபெயர்ப்புகள் “அசீரிய அரசன்” என்று தருகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: அந்தக் காலத்தில்
  rationale: இது எபிரெய மொழியின் வழக்கமான காலக் குறிப்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: שָׁלַח
  choice: ஆள் அனுப்பினான்
  rationale: எபிரெய வினைச்சொல் பொதுவாக ‘அனுப்பினான்’ என்று மட்டுமே கூறுகிறது; யாரை அனுப்பினான் என்பது வெளிப்படையாக இல்லை. தமிழில் வாக்கியம் இயல்பாகவும் பொருள் தெளிவாகவும் இருக்கத் தேவையான குறைந்தபட்ச உட்பொருளாக ‘ஆள்’ சேர்க்கப்பட்டுள்ளது; ‘தூதர்களை’ என்று குறிப்பாக்கப்படவில்லை.
- source_word: הַמֶּלֶךְ אָחָז
  choice: அகாஸ் அரசன்
  rationale: பெயரையும் அரச பட்டத்தையும் நவீன தமிழின் இயல்பான வரிசையில் வழங்குகிறது.
- source_word: עַל
  choice: அசீரிய அரசர்களிடம்
  rationale: שׁלח என்ற வினையுடன் இங்கு இது ஒருவரை நோக்கி அனுப்புவதைக் குறிக்கிறது; ‘அரசர்களுக்கு எதிராக’ என்ற பொருள் சூழலுக்குப் பொருந்தாது.
- source_word: מַלְכֵי אַשּׁוּר
  choice: அசீரிய அரசர்கள்
  rationale: மசோரெட்டிக் எபிரெய உரையில் உள்ள பன்மையைத் திருத்தாமலும் வரலாற்றுச் சூழலுடன் ஒத்திசைக்காமலும் அப்படியே காக்கிறது.
- source_word: לַעְזֹר לוֹ
  choice: தனக்கு உதவும்படி
  rationale: இறுதி நோக்கத்தை வெளிப்படுத்தும் எபிரெய infinitive அமைப்பையும், உதவி அகாஸுக்கே வேண்டப்பட்டது என்பதையும் இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: வரலாற்றுச் சூழலில் எதிர்பார்க்கப்படும் ஒருமையுடன் ஒத்திசைக்க மசோரெட்டிக் உரையின் ‘அசீரிய அரசர்கள்’ என்ற பன்மையை மாற்ற வேண்டுமா?
  choice: மூல உரையிலுள்ள ‘அசீரிய அரசர்கள்’ என்ற பன்மையை முதன்மைப் பாடத்தில் வைத்தல்
  alternative: அசீரிய அரசன்
  rationale: இது கோட்பாட்டுச் சிக்கல் அல்ல; ஆயினும் மூல உரைக்கான வெளிப்படைத்தன்மை முக்கியம். எபிரெய வடிவம் பன்மையில் இருப்பதால் அது முதன்மைப் பாடத்தில் காக்கப்பட்டு, வரலாற்று ஒத்திசைவுக்காக வழங்கப்படும் ஒருமை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆள் அனுப்பினான்’ என்பது தமிழில் தேவையான இயல்பை வழங்குகிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘தூதர்கள்’ அல்லது ‘செய்தி’ போன்ற விவரங்கள் தவிர்க்கப்பட்டுள்ளன.
