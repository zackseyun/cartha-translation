translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூலத்தின் சுருக்கமான இராணுவ நிகழ்வுத் தொடர் பாதுகாக்கப்பட்டுள்ளது; இயல்பான தமிழுக்காக வினையெச்சத் தொடர் பயன்படுத்தப்பட்டுள்ளது.
