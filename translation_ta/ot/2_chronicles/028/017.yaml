  text: The Edomites had also come and attacked Judah and carried away captives[a].
translation:
  language: ta
  text: மேலும், ஏதோமியர்கள் வந்து யூதாவைத் தாக்கி, மக்களைச் சிறைபிடித்துக் கொண்டுபோனார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவை அடித்து, சிறைவர்களைப் பிடித்தார்கள்.” எபிரெயத்தில் பொதுவான இராணுவ வினையான “அடி” என்பதும், “சிறைபிடி” என்ற வினையும் அதே சொல்ல்வேரைச் சேர்ந்த “சிறைவர்கள்” என்ற பெயரும் இணைந்து வருகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: மேலும்
  rationale: சூழலில் யூதாவுக்கு எதிரான மற்றொரு பகைமைச் செயலை இது சேர்த்துக் கூறுகிறது; நவீன தமிழில் ‘மேலும்’ இயல்பாக உள்ளது.
- source_word: אֲדוֹמִים
  choice: ஏதோமியர்கள்
  rationale: இது ஏதோம் நிலப்பகுதியை அல்ல, ஏதோம் மக்களைக் குறிக்கும் பன்மை இனப்பெயர்.
- source_word: בָּאוּ
  choice: வந்து
  rationale: முடிவுற்ற வருகையைத் தொடர்ந்து நிகழ்ந்த தாக்குதலுடன் இயல்பான தமிழ் வினையெச்சத் தொடராக இணைக்கிறது.
- source_word: וַיַּכּוּ
  choice: தாக்கி
  rationale: נכה என்பதன் அடிப்படைப் பொருள் ‘அடி/தாக்கு’; இராணுவச் சூழலில் ‘தாக்கி’ தெளிவானது, மேலும் முழுத் தோல்வியை உரையில் இல்லாமல் சேர்ப்பதில்லை.
- source_word: בִיהוּדָה
  choice: யூதாவை
  rationale: இராணுவத் தாக்குதலைக் குறிக்கும் வினையுடன் ב என்பதைக் குறித்த இயல்பான தமிழாக்கம்; ‘யூதாவில்’ என்பதைக் காட்டிலும் யூதாவே தாக்குதலின் இலக்கு என்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  choice: சிறைபிடிக்கப்பட்டவர்களைக் கொண்டுபோனார்கள்
  rationale: ஒரே வேர் சார்ந்த வினை-பெயர்ச்சொல் தொடரை இயல்பான தமிழில் வெளிப்படுத்தி, மக்களைச் சிறைபிடித்துக் கொண்டுசென்ற இராணுவப் பொருளைப் பாதுகாக்கிறது.
