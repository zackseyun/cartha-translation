base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: ta
  text: ஆகாஸ் தேவனுடைய ஆலயப் பொருட்களை ஒன்றுசேர்த்து, அவற்றைத் துண்டுதுண்டாக வெட்டினான். பின்பு யெகோவாவின் ஆலயக் கதவுகளை அடைத்து, எருசலேமின் ஒவ்வொரு மூலையிலும் தனக்காகப் பலிபீடங்களை அமைத்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלֵי
  choice: பொருட்கள்
  rationale: ஆலயத்தில் பயன்பட்ட பாத்திரங்கள் மற்றும் பிற உபகரணங்கள் அனைத்தையும் உள்ளடக்கக்கூடிய இயல்பான பொதுச்சொல்.
- source_word: וַיְקַצֵּץ
  choice: துண்டுதுண்டாக வெட்டினான்
  rationale: פיעל வடிவம் பொருட்களை வெட்டி அழித்த அல்லது சிதைத்த தீவிரச் செயலைக் குறிக்கிறது.
- source_word: דַּלְתוֹת
  choice: கதவுகள்
  rationale: ஆலயத்தின் நுழைவுக் கதவுகளைக் குறிக்கும் நேரடியான பொருள்.
- source_word: בְּכָל־פִּנָּה
  choice: ஒவ்வொரு மூலையிலும்
  rationale: எருசலேம் நகரமெங்கும் பல இடங்களில் என்பதைக் காட்சியுடன் தரும் எபிரெயச் சொற்றொடரின் நேரடி வடிவம்.
- source_word: מִזְבְּחוֹת
  choice: பலிபீடங்கள்
  rationale: பலிகள் அல்லது தூபம் செலுத்துவதற்கான மத வழிபாட்டுக் கட்டமைப்புகளைக் குறிக்கும் வழக்கமான வேதாகமத் தமிழ்ச்சொல்.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை, பொதுப்பட்டமான ‘கர்த்தர்’ என்பதிலிருந்து வேறுபடுத்திக் காட்டுகிறது.
- issue: לֹו என்பதன் நோக்கம்/பயன்
  choice: தனக்காக
  alternative: அவனுக்காக
  rationale: பலிபீடங்கள் ஆகாஸின் சொந்த வழிபாட்டு நோக்கத்திற்காக அமைக்கப்பட்டன என்ற மூலத்தின் இயல்பான பிரதிபலிப்பைத் தக்கவைக்கிறது; அவை அவனுக்கே பலி செலுத்தப்பட்டன என்று கூறவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. எபிரெய மூலத்தில் ‘தேவனுடைய ஆலயம்’ என்றும் பின்னர் ‘யெகோவாவின் ஆலயம்’ என்றும் வரும் வேறுபாடு பாதுகாக்கப்பட்டது. முதல் இரண்டு இணை வாக்கியங்கள் தமிழில் இயல்பாக அமைய, மீளும் பெயர்ச்சொல் இரண்டாவது இடத்தில் ‘அவற்றை’ எனக் குறிப்பிடப்பட்டது.
