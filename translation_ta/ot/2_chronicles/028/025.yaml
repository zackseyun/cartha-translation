base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
translation:
  language: ta
  text: யூதாவிலுள்ள ஒவ்வொரு நகரத்திலும்[a] வேறு தெய்வங்களுக்குத் தூபம் காட்டுவதற்காக உயர்ந்த வழிபாட்டு இடங்களை அமைத்தான்; தன் முன்னோர்களின் கடவுளாகிய யாவேக்குக் கோபமூட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யூதாவின் ஒவ்வொரு நகரமும் நகரமும்” என்று பகிர்ந்தளிக்கும் மீளுரை உள்ளது; இது யூதாவின் எல்லா நகரங்களையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  choice: யூதாவிலுள்ள ஒவ்வொரு நகரத்திலும்
  rationale: עִיר וָעִיר என்பது பகிர்ந்தளிக்கும் வலியுறுத்தல்; தமிழில் இயல்பாகவும் முழுமையைக் காட்டவும் ‘ஒவ்வொரு நகரத்திலும்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: עָשָׂה בָמוֹת
  choice: மேடைகளை அமைத்தான்
  rationale: עָשָׂה என்பது பொதுவாக ‘செய்தான்’; வழிபாட்டுத் தலங்களைக் குறிக்கும் בָּמוֹת உடன் தமிழில் ‘அமைத்தான்’ என்பது இயல்பானது. ‘மேடைகள்’ என்ற சொல் இங்கு வழிபாட்டுக்குரிய உயர்ந்த இடங்களைச் சுட்டுகிறது.
- source_word: לְקַטֵּר
  choice: தூபம் காட்டுவதற்காக
  rationale: பியேல் வடிவிலுள்ள קטר தூபத்தை எரித்து அதன் புகையை எழும்பச் செய்வதைக் குறிக்கிறது; வழிபாட்டுச் சூழலில் ‘தூபம் காட்டுதல்’ இயல்பான நவீனத் தமிழ்.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: வேறு தெய்வங்களுக்கு
  rationale: אֲחֵרִים என்பது ‘வேறு’ என்பதே; மூலத்தில் இல்லாத ‘அந்நிய’ என்ற நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: וַיַּכְעֵס אֶת
  choice: கோபமூட்டினான்
  rationale: כעס என்பதன் ஹிஃபில் வடிவம் ஒருவரைக் கோபப்படுத்துதல் அல்லது கோபத்துக்குத் தூண்டுதல் என்று பொருள்; தமிழில் ‘கோபமூட்டினான்’ நேரடியும் இயல்புமாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயர் ஒரு பட்டத்தால் மாற்றப்படாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்கப்பட்டது.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: தன் முன்னோர்களின் கடவுள்
  rationale: אָבוֹתָיו என்ற சொல் தந்தையர் அல்லது மூதாதையரைக் குறிக்கலாம்; நவீனத் தமிழில் பாலினத்தைக் கடந்து வம்சத் தொடரைத் தெளிவாகக் குறிக்க ‘முன்னோர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: இங்கு மூல எபிரெய உரை தனிப்பட்ட இறைப் பெயரைப் பயன்படுத்துகிறது; அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: אֱלֹהֵי אֲבֹתָיו என்பதிலுள்ள உடன்படிக்கை மற்றும் வம்சத் தொடர்பு
  choice: தன் முன்னோர்களின் கடவுளாகிய
  alternative: தன் தந்தையரின் கடவுளாகிய
  rationale: ‘முன்னோர்கள்’ என்பது நவீன வாசகருக்கு இயல்பாக இருந்து, ஆகாசின் இஸ்ரவேலிய வம்சத்தோடு தொடர்புடைய கடவுளைச் சுட்டும் மூலப் பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான வேதாகம நடை. எபிரெய பகிர்ந்தளிப்பு மீளுரையை சொற்சொல்லாக நகலெடுக்காமல் அதன் முழுமையான பொருள் இயல்பான தமிழில் தரப்பட்டுள்ளது.
