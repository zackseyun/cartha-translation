base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/013.yaml
  text: And they said to them[a], “Do not bring the captives here, for you are proposing to add to our sins and to our guilt, bringing guilt from Yahweh upon us, because our guilt is already great[b], and there is fierce anger against Israel.”
translation:
  language: ta
  text: அவர்கள் அவர்களிடம்[a], “சிறைபிடிக்கப்பட்டவர்களை இங்கே கொண்டுவராதீர்கள். ஏனெனில், யாவேக்கு முன்பாக நம்மேல் குற்றப்பழி வருமாறு, நீங்கள் நம் பாவங்களுக்கும் நம் குற்றப்பழிக்கும் மேலும் சேர்க்க எண்ணுகிறீர்கள். நம் குற்றப்பழி மிகப் பெரிது; இஸ்ரவேலுக்கு எதிராகக் கடுங்கோபம் மூண்டிருக்கிறது[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களிடம்” என்பது சிறைப்பட்டவர்களைக் கொண்டுவந்த படைத்தலைவர்களையும் வீரர்களையும் குறிக்கிறது.
    reason: referent_clarification
  - marker: b
    text: “கடுங்கோபம்” என்பதற்கான எபிரெயச் சொற்றொடர் சொல்லர்த்தமாக “கோபத்தின் எரிதல்”; அது மிகத் தீவிரமான சினத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁבְיָה
  choice: சிறைபிடிக்கப்பட்டவர்கள்
  rationale: இச்சூழலில் இது சிறையிருப்பு என்ற நிலையைக் குறிக்காமல், அங்கே கொண்டுவரப்படவிருந்த சிறைப்பட்ட மக்களைக் குறிக்கிறது.
- source_word: הֵנָּה
  choice: இங்கே
  rationale: பேசுகிறவர்களின் இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: யாவேக்கு முன்பாக நம்மேல் குற்றப்பழி இருக்கையில்
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானதும் பொருள் ஐயமுடையதும் ஆகும். யாவே தொடர்பான குற்றப்பழி அல்லது அவரது தீர்ப்பினால் ஏற்பட்ட குற்றப்பொறுப்பு நம்மேல் இருப்பதை இவ்வடிவம் வெளிப்படுத்துகிறது; காரணவாக்கிய அமைப்பையும் காக்கிறது.
- source_word: אַתֶּם אֹמְרִים
  choice: நீங்கள் ... எண்ணுகிறீர்கள்
  rationale: சொல்லர்த்தமாக ‘நீங்கள் சொல்கிறீர்கள்’; இங்கு வெறும் பேச்சை அல்ல, செய்யத் திட்டமிடும் நோக்கத்தைக் குறிக்கிறது.
- source_word: לְהֹסִיף עַל
  choice: மேலும் சேர்க்க
  rationale: ஏற்கெனவே உள்ள பாவத்தையும் குற்றப்பழியையும் அதிகரிப்பதாகிய கூட்டுப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: חַטֹּאתֵינוּ
  choice: நம் பாவங்கள்
  rationale: செய்யப்பட்ட தவறுகள் அல்லது பாவங்களைச் சுட்டும் பன்மை வடிவம் காக்கப்படுகிறது.
- source_word: אַשְׁמָתֵינוּ / אַשְׁמָה
  choice: நம் குற்றப்பழி
  rationale: ‘பாவங்கள்’ என்பதிலிருந்து வேறுபட்டு, அவற்றால் உண்டாகும் குற்றநிலையையும் பொறுப்பையும் குறிக்க ‘குற்றப்பழி’ பயன்படுத்தப்படுகிறது.
- source_word: רַבָּה
  choice: மிகப் பெரிது
  rationale: குற்றப்பழியின் மிகுதியை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘ஏற்கெனவே’ சேர்க்கப்படவில்லை.
- source_word: וַחֲרוֹן אָף
  choice: கடுங்கோபம் மூண்டிருக்கிறது
  rationale: சொல்லர்த்தமான ‘மூக்கின் எரிச்சல்/கோபத்தின் எரிதல்’ என்ற எபிரெய மரபுத்தொடரின் தீவிரத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு எதிராக
  rationale: தெய்வீகக் கோபத்தின் இலக்கை על இங்கு குறிக்கிறது; ‘இஸ்ரவேல்’ என்ற மூலப் பெயர் விளக்கமாகக் குறுக்கப்படாமல் காக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராகக் காக்க ‘யாவே’ பயன்படுத்தப்படுகிறது.
- issue: לְאַשְׁמַת יְהוָה עָלֵינוּ என்பதன் தொடர்பு
  choice: யாவேக்கு முன்பாக நம்மேல் குற்றப்பழி இருக்கையில்
  alternative: யாவேயிடமிருந்து நம்மேல் குற்றப்பழியைக் கொண்டுவரும்படி
  rationale: சொற்றொடரின் இலக்கணத் தொடர்பு நெருக்கமானதும் ஐயமுடையதும் ஆகும். முதன்மை உரை யாவே தொடர்பாக நம்மேல் உள்ள குற்றப்பொறுப்பை வெளிப்படுத்துகிறது; தெய்வீகத் தீர்ப்பிலிருந்து வரும் குற்றப்பொறுப்பு என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: இஸ்ரவேல் என்ற பெயரின் வரலாற்று-இறையியல் சுட்டு
  choice: இஸ்ரவேல்
  alternative: வடக்கு ராஜ்யம் / எப்பிராயீம்
  rationale: மூல உரை ‘இஸ்ரவேல்’ என்றே கூறுவதால், உடனடி வரலாற்றுச் சுட்டை விளக்கமாகக் குறுக்காமல் மூலப் பெயர் காக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியுமாறு கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பாவங்கள்’ மற்றும் ‘குற்றப்பழி’ என்ற மூலத்தின் வேறுபாடு காக்கப்பட்டுள்ளது. அடிக்குறிப்புகள் அனைத்திற்குமான குறியீடுகள் முதன்மை உரையில் இடம்பெற வேண்டும்; ஆகவே சிக்கலான எபிரெயச் சொற்றொடருக்கான [c] குறியீட்டை ‘இருக்கையில்’ என்பதன் பின் இடுவது வெளியீட்டில் அவசியம்.
