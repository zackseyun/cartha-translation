  rationale: A safe, necessary correction changes the comitative “-ஓடும்” to the dative “-க்கும்,” so that the proposed action adds to—not merely alongside—their sins and guilt. The difficult Yahweh-related guilt phrase remains cautiously expressed as guilt coming upon them before Yahweh, without imposing a disputed causal interpretation. The footnotes are retained with their existing anchors; the unimplemented [c] mentioned only in the draft notes is not introduced.
