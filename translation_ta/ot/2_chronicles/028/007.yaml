translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. மூன்று கொலைச் செயப்படுபொருள்களும் தமிழில் ‘-ஐயும்’ இணைப்பால் தெளிவாக ஒருங்கிணைக்கப்பட்டுள்ளன; பதவிப் பெயர்களில் மூலத்தின் தெளிவின்மை அடிக்குறிப்புகள் மூலம் பாதுகாக்கப்பட்டுள்ளது.
