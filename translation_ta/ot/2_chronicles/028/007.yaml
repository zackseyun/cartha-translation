  text: וַֽ/יַּהֲרֹ֞ג זִכְרִ֣י גִּבּ֣וֹר אֶפְרַ֗יִם אֶת מַעֲשֵׂיָ֨הוּ֙ בֶּן הַ/מֶּ֔לֶךְ וְ/אֶת עַזְרִיקָ֖ם נְגִ֣יד הַ/בָּ֑יִת וְ/אֶת אֶלְקָנָ֖ה מִשְׁנֵ֥ה הַ/מֶּֽלֶךְ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/007.yaml
  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
translation:
  language: ta
  text: எப்பிராயீமைச் சேர்ந்த மாவீரனான சிக்ரி[a], அரசனின் மகன் மாசெயாவையும், அரச இல்லத்தின் தலைமை அதிகாரியான அஸ்ரிக்காமையும்[b], அரசனுக்கு அடுத்த நிலையில் இருந்த எல்க்கானாவையும்[c] கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எப்பிராயீமைச் சேர்ந்த போர்வீரனான சிக்ரி”; அல்லது, “எப்பிராயீமிய வீரனான சிக்ரி.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “வீட்டின் தலைமை அதிகாரி”; இங்கு ‘வீடு’ என்பது அரச அரண்மனையையோ அரச குடும்ப இல்லத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அரசனின் இரண்டாம் நிலை அதிகாரியாக இருந்த எல்க்கானா.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: கொன்றான்
  rationale: הרג என்பதன் நேரடியான பொருள் ‘கொல்லுதல்’; நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: זִכְרִי
  choice: சிக்ரி
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: גִּבּוֹר אֶפְרַיִם
  choice: எப்பிராயீமின் மாவீரன்
  rationale: גִּבּוֹר என்பதில் வலிமைமிக்கவர், போர்வீரர், மாவீரர் ஆகிய பொருள் வாய்ப்புகள் உள்ளன; ‘மாவீரன்’ இங்கு சுருக்கமாகவும் இயல்பாகவும் வீரத்தைக் குறிக்கிறது. அச்சொல்லின் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מַעֲשֵׂיָהוּ
  choice: மாசெயா
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: בֶּן הַמֶּלֶךְ
  choice: அரசனின் மகன்
  rationale: எபிரெய உறவுநிலைத் தொடரை இயல்பான தமிழில் நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: עַזְרִיקָם
  choice: அஸ்ரிக்காம்
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: נְגִיד הַבָּיִת
  choice: அரண்மனைப் பொறுப்பாளர்
  rationale: נְגִיד என்பது தலைமை அல்லது மேற்பார்வை வகிக்கும் அதிகாரியைக் குறிக்கிறது; அரசவைக் சூழலில் הַבָּיִת என்பது அரண்மனை அல்லது அரச குடும்ப நிர்வாகத்தைக் குறிக்கக்கூடும். தமிழில் பதவியின் பொதுவான தன்மையை ‘பொறுப்பாளர்’ பாதுகாக்கிறது.
- source_word: אֶלְקָנָה
  choice: எல்க்கானா
  rationale: எபிரெய தனிப்பெயரின் ஒலிபெயர்ப்பு.
- source_word: מִשְׁנֵה הַמֶּלֶךְ
  choice: அரசனுக்கு அடுத்த நிலையில் இருந்தவர்
  rationale: מִשְׁנֶה என்பது தரவரிசையில் இரண்டாம் நிலையைச் சுட்டுகிறது; குறிப்பிட்ட பிற்கால நிர்வாகப் பட்டத்தைத் திணிக்காமல் படிநிலையைத் தெளிவாகக் காட்டுகிறது.
