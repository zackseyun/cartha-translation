source:
  edition: WLC
  text: כִּֽי הִכְנִ֤יעַ יְהוָה֙ אֶת יְהוּדָ֔ה בַּ/עֲב֖וּר אָחָ֣ז מֶֽלֶךְ יִשְׂרָאֵ֑ל כִּ֤י הִפְרִ֨יעַ֙ בִּֽ/יהוּדָ֔ה וּ/מָע֥וֹל מַ֖עַל בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
translation:
  language: ta
  text: ஏனெனில், இஸ்ரவேலின் அரசனான ஆகாஸின் காரணமாக யாவே யூதாவைத் தாழ்த்தினார்; ஆகாஸ் யூதாவில் கட்டுப்பாடற்ற நிலையை ஏற்படுத்தினான்[a]; யாவேக்கு எதிராக மிகவும் உண்மையற்றவனாக நடந்துகொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதாவில் கட்டுப்பாடற்ற நிலையை ஏற்படுத்தினான்’ என்பதற்கு ‘யூதாவில் பொறுப்பற்ற விதத்தில் நடந்துகொண்டான்’ அல்லது ‘யூதாவில் ஒழுங்கைக் குலைத்தான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய உரை ஆகாஸை ‘இஸ்ரவேலின் அரசன்’ என்றே அழைக்கிறது; வரலாற்றில் அவன் யூதாவின் அரசன். மூல வாசகம் இசைவாக்கப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: הִכְנִיעַ
  choice: தாழ்த்தினார்
  rationale: כּנע என்பதன் ஹிஃபில் வடிவம் யூதாவைத் தாழ்ந்த நிலைக்குக் கொண்டுவந்த யெகோவாவின் செயலைக் குறிக்கிறது; ‘தாழ்த்தினார்’ அதன் காரணவினைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் தருகிறது.
- source_word: בַּעֲבוּר
  choice: காரணமாக
  rationale: இங்கு நன்மைக்கான நோக்கத்தை அல்ல, காரணத்தைச் சுட்டுவதால் ‘காரணமாக’ பொருத்தமானது.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: எபிரெய மூலத்தில் உள்ள ‘இஸ்ரவேலின் அரசன்’ என்ற வாசகத்தை ‘யூதாவின் அரசன்’ என்று வரலாற்றோடு இசைவாக்காமல் அப்படியே தக்கவைக்கிறது.
- source_word: הִפְרִיעַ
  choice: கட்டுப்பாட்டை அகற்றிவிட்டு
  rationale: பாதுகாப்புக் கட்டுப்பாட்டைக் கைவிடச் செய்தல், ஒழுங்கைக் குலைத்தல், பொறுப்பற்றவாறு நடத்தல் ஆகிய பொருட்களின் திறந்த தன்மையை ஓரளவு தக்கவைக்கும் இயல்பான தமிழ்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בִּיהוּדָה
  choice: யூதாவில்
  rationale: ஆகாசின் செயல் நிகழ்ந்த களத்தைச் சுட்டும் ב முன்னிடைச்சொல்லை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמָעוֹל מַעַל
  choice: மிகுந்த துரோகம் செய்திருந்தான்
  rationale: மעל வேரின் பெயரெச்ச-வினைச்சொல் சேர்க்கை வலியுறுத்தும் உடன்படிக்கைச் சார்ந்த நம்பிக்கைத் துரோகத்தைத் தமிழில் வலிமையாக வெளிப்படுத்துகிறது.
- source_word: בַּיהוָה
  choice: யெகோவாவுக்கு எதிராக
  rationale: מעל உடன் வரும் ב, கடவுளுக்கு எதிரான நம்பிக்கைத் துரோகத்தை இங்கு குறிக்கிறது.
theological_decisions:
- issue: ஆகாஸ் ‘இஸ்ரவேலின் அரசன்’ என அழைக்கப்படுதல்
  choice: ‘இஸ்ரவேலின் அரசன்’ என்ற மசோரா மூல வாசகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: வரலாற்றுத் தகவலோடு இசைவாக்கி ‘யூதாவின் அரசன்’ என்று மொழிபெயர்த்தல்
  rationale: ஆகாஸ் வரலாற்றில் யூதாவின் அரசனாக இருந்தாலும், எபிரெய உரை வெளிப்படையாக ‘இஸ்ரவேலின் அரசன்’ என்கிறது. நாளாகம ஆசிரியரின் இறையியல் அல்லது சொல்லாட்சித் தீவிரத்தை மொழிபெயர்ப்பு அமைதியாக நீக்கக்கூடாது; வரலாற்றுத் தெளிவு அடிக்குறிப்பில் வழங்கப்படுகிறது.
- issue: הִפְרִיעַ என்பதன் பொருள் பரப்பு
  choice: ‘கட்டுப்பாட்டை அகற்றிவிட்டு’ என மொழிபெயர்த்து மாற்றுப் பொருட்களை அடிக்குறிப்பில் காட்டுதல்
  alternative: ‘யூதாவில் பொறுப்பற்ற விதத்தில் நடந்துகொண்டு’ அல்லது ‘யூதாவில் ஒழுங்கைக் குலைத்து’
  rationale: வினைச்சொல் கட்டுப்பாட்டைத் தளர்த்துதல், ஒழுங்கைக் குலைத்தல், பொறுப்பற்ற நடத்தை ஆகிய தொடர்புடைய நுணுக்கங்களை அனுமதிக்கிறது; ஒரு விளக்கத்தை மட்டுமே உறுதிப்படுத்தாமல் அடிக்குறிப்பு உண்மையான சொற்பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் வேதாகம உரைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘அரசன்’, ‘தாழ்த்தினார்’, ‘துரோகம்’ போன்ற பொதுவாக விளங்கும் சொற்கள் தேர்ந்தெடுக்கப்பட்டன; மூலத்தின் காரணத் தொடர்பும் வலியுறுத்தலும் பாதுகாக்கப்பட்டன.
