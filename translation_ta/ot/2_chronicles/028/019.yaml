  to: ஏனெனில், இஸ்ரவேலின் அரசனான ஆகாஸின் காரணமாக யாவே யூதாவைத் தாழ்த்தினார்; ஆகாஸ் யூதாவில் கட்டுப்பாடற்ற நிலையை ஏற்படுத்தினான்[a]; யாவேக்கு எதிராக மிகவும் உண்மையற்றவனாக நடந்துகொண்டான்.
