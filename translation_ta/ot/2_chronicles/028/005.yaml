base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
translation:
  language: ta
  text: ஆகையால், அவனுடைய கடவுளாகிய யாவே அவனை அராம் அரசனின் கையில் ஒப்புக்கொடுத்தார்.[a] அவர்கள் அவனைத் தாக்கி, அவனிடமிருந்து ஏராளமானவர்களைச் சிறைப்பிடித்து, அவர்களைத் தமஸ்குவுக்குக் கொண்டுபோனார்கள்.[b] அவன் இஸ்ரயேல் அரசனின் கையிலும் ஒப்புக்கொடுக்கப்பட்டான்; அந்த அரசன் அவனைப் பெரும் அடியால் தாக்கினான்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிரியா அரசன்”; எபிரேயத்தில் “அராம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனிடமிருந்து பெரும் சிறைக்கூட்டத்தைக் கைப்பற்றினார்கள்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அவனுக்கு ஒரு பெரும் தோல்வியை ஏற்படுத்தினான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... בְּיַד
  choice: அவனை ... கையில் ஒப்புக்கொடுத்தார்
  rationale: נתן + בְּיַד என்பது ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுப்பதைக் குறிக்கும் வழக்குச்சொல். ‘கையில் ஒப்புக்கொடுத்தார்’ எபிரேய உருவகத்தையும் தெய்வீகச் செயலாண்மையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமமான יהוה ஒரு பட்டமாக மாற்றப்படாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: אֱלֹהָיו
  choice: அவனுடைய கடவுளாகிய
  rationale: உடைமைத் தொடர்பைத் தெளிவாகக் காத்து, நியாயத்தீர்ப்பின் சூழலிலும் உரையிலுள்ள உறவைக் குறிக்கிறது.
- source_word: מֶלֶךְ אֲרָם
  choice: அராம் அரசன்
  rationale: மூலத்தின் நிலப்பெயரான ‘அராம்’ அப்படியே ஒலிபெயர்க்கப்படுகிறது; ‘சிரியா’ அடிக்குறிப்பில் மாற்றாகத் தரப்படுகிறது.
- source_word: וַיַּכּוּ בוֹ
  choice: அராமியர்கள் அவனைத் தாக்கி
  rationale: பன்மை வினையின் எழுவாய் சூழலிலிருந்து அராம் அரசனின் படையினரைச் சுட்டுகிறது. தமிழில் இயல்பாக இருக்க ‘அராமியர்கள்’ வெளிப்படுத்தப்பட்டுள்ளது; נכה என்பதன் பரந்த இராணுவப் பொருளுக்கு ‘தாக்கி’ பொருந்துகிறது.
- source_word: וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה
  choice: அவனிடமிருந்து ஏராளமானவர்களைச் சிறைப்பிடித்து
  rationale: שִׁבְיָה concretaகச் சிறைபிடிக்கப்பட்ட மக்களையோ கூட்டுச் சிறைப்பிடிப்பையோ குறிக்கலாம். தமிழில் இயல்பான வாசிப்புக்காகப் பெரும் எண்ணிக்கையிலான சிறைக்கைதிகள் என்ற பொருள் வழங்கப்படுகிறது; மாற்று அடிக்குறிப்பில் குறிக்கப்படுகிறது.
- source_word: וַיָּבִיאוּ דַּרְמָשֶׂק
  choice: அவர்களைத் தமஸ்குவுக்குக் கொண்டுபோனார்கள்
  rationale: எபிரேயத்தில் விடுபட்டுள்ள செயப்படுபொருள் முந்தைய ‘சிறைப்பிடிக்கப்பட்டவர்கள்’ என்பதிலிருந்து தெளிவாக இருப்பதால் தமிழில் ‘அவர்களை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְגַם ... נִתָּן
  choice: அவன் ... கையிலும் ஒப்புக்கொடுக்கப்பட்டான்
  rationale: முந்தைய נתן வினையுடனான ஒலிப்பைத் தக்கவைத்து, கூடுதலான நியாயத்தீர்ப்பைக் குறிக்கும் וְגַם என்பதற்கு ‘கையிலும்’ இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  choice: அந்த அரசன் அவனுக்குப் பெரும் தோல்வியை ஏற்படுத்தினான்
  rationale: מַכָּה גְדוֹלָה சொற்படியாக ‘பெரும் அடி’ என்றாலும் இங்கு இராணுவச் சூழலில் கடுமையான தோல்வியைக் குறிக்கிறது. தமிழ் நடையில் தெளிவுக்காக பொருள் சார்ந்த மொழிபெயர்ப்பு பயன்படுத்தப்பட்டு, சொற்படியான உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: யூதாவின் தோல்வியில் கடவுளின் செயலாண்மை
  choice: யாவே அவனை அந்நிய அரசனின் கையில் ஒப்புக்கொடுத்தார் என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
  alternative: தோல்வியை அரசியல் அல்லது இராணுவ நிகழ்வாக மட்டும் விவரித்தல்.
  rationale: மூலத்தில் נתן முதலில் செய்பாட்டு வடிவிலும் பின்னர் செயப்பாட்டு வடிவிலும் வந்து, இராணுவத் தோல்விகளைத் தெய்வீக நியாயத்தீர்ப்பாகச் சட்டகப்படுத்துகிறது; இதை மொழிபெயர்ப்பு மெலிதாக்கவில்லை.
- issue: திருநாமத்தை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலத்தில் יהוה என்ற தனிப்பட்ட திருநாமம் இருப்பதால், அதைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பாக வழங்குவது மூல வேறுபாட்டைக் காக்கிறது.
- issue: ஒருமை ‘அவனை’ குறிக்கும் நபரும் மக்களும்
  choice: எபிரேயத்தின் ஒருமை ஆண்பால் சுட்டுப்பெயரை ‘அவன்’ எனக் காத்தல்.
  alternative: ஒவ்வொரு இடத்திலும் ‘ஆகாசும் யூதாவும்’ என விரிவாக்குதல்.
  rationale: சூழலில் அரசன் பிரதிநிதித்துவ முறையில் நாட்டையும் குறிக்கக்கூடும்; ஆனால் வசனம் இலக்கண ரீதியாக ஒருமையைப் பயன்படுத்துகிறது. அந்தத் திறந்த பொருளை மொழிபெயர்ப்பு தீர்மானித்து விடவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘கையில் ஒப்புக்கொடுத்தார்’ என்ற வேதாகம உருவகம் புரிந்துகொள்ளத்தக்கதால் காக்கப்பட்டது. இடப்பெயர்கள் ‘அராம்’, ‘தமஸ்கு’, தேசியப் பெயர் ‘இஸ்ரயேல்’ என ஒலிபெயர்க்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் உரையில் இணைக்கப்பட்டுள்ளன.
