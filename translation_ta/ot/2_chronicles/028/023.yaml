  text: וַ/יִּזְבַּ֗ח לֵֽ/אלֹהֵ֣י דַרְמֶשֶׂק֮ הַ/מַּכִּ֣ים בּ/וֹ֒ וַ/יֹּ֗אמֶר כִּ֠י אֱלֹהֵ֤י מַלְכֵֽי אֲרָם֙ הֵ֚ם מַעְזְרִ֣ים אוֹתָ֔/ם לָ/הֶ֥ם אֲזַבֵּ֖חַ וְ/יַעְזְר֑וּ/נִי וְ/הֵ֛ם הָֽיוּ ל֥/וֹ לְ/הַכְשִׁיל֖/וֹ וּ/לְ/כָל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
translation:
  language: ta
  text: அவன் தன்னைத் தாக்கிய[a] தமஸ்குவின் தெய்வங்களுக்குப் பலியிட்டான். அவன், “அராமின் அரசர்களுடைய[b] தெய்வங்கள் அவர்களுக்கு உதவுகின்றன. ஆகவே, அவை எனக்கு உதவும்படி நான் அவற்றுக்குப் பலியிடுவேன்” என்றான். ஆனால் அவையே அவனுக்கும் இஸ்ரவேல் முழுவதற்கும் வீழ்ச்சிக்குக் காரணமாயின[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தன்னைத் தோற்கடித்த’ அல்லது ‘தன்னைத் தாக்கிக்கொண்டிருந்த’ என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பெயரெச்சம் தொடரும் செயலையோ பண்பியலான செயலையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அராமின் அரசர்களுடைய தெய்வங்கள்’; ‘அரசர்கள்’ என்பது பன்மை.
    reason: lexical_alternative
  - marker: c
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘அவை அவனுக்கு அவனை இடறச் செய்வதற்காகவும் இஸ்ரவேல் முழுவதற்கும் இருந்தன.’ இச்சொற்றொடர் அவனுக்கும் இஸ்ரவேல் முழுவதற்கும் அவை அழிவுக்குக் காரணமானதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: பலியிட்டான்
  rationale: זבח என்பது வழிபாட்டுச் சூழலில் பலி செலுத்துவதைக் குறிக்கிறது; ‘பலியிட்டான்’ சுருக்கமாகவும் இயல்பாகவும் அந்தச் செயலைத் தெரிவிக்கிறது.
- source_word: לֵאלֹהֵי דַרְמֶשֶׂק
  choice: தமஸ்குவின் தெய்வங்களுக்கு
  rationale: אֱלֹהֵי என்பது இவ்விக்கிரக வழிபாட்டுச் சூழலில் பன்மை; எனவே ‘தெய்வங்கள்’ என்று மொழிபெயர்க்கப்பட்டது. דַרְמֶשֶׂק என்பதற்கு தமிழில் வழக்கமான ‘தமஸ்கு’ பயன்படுத்தப்பட்டது.
- source_word: הַמַּכִּים בּוֹ
  choice: தன்னைத் தாக்கிய
  rationale: குறிப்பிட்ட தெய்வங்களை அடையாளப்படுத்தும் எபிரெயப் பெயரெச்சத்தின் பொருளை இது காக்கிறது. சூழலில் ஏற்கெனவே நிகழ்ந்த தாக்குதலை இயல்பான தமிழில் குறிக்கிறது; தொடரும் அல்லது பண்பியலான செயற்பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: כִּי
  choice: (முந்தைய கூற்றிற்கான காரணமாக) … உதவுகின்றன. ஆகவே
  rationale: כִּי ஆகாசின் செயலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் மேற்கோளை இரண்டு வாக்கியங்களாக அமைத்து ‘ஆகவே’ என்பதன் மூலம் அவனுடைய காரணவாதமும் முடிவும் தெளிவாக்கப்பட்டன.
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  choice: அராமின் அரசர்களுடைய தெய்வங்கள்
  rationale: מַלְכֵי என்பது பன்மை; அதை ஒருமையாகச் சீராக்காமல் ‘அரசர்கள்’ என்று பாதுகாக்கிறது.
- source_word: מַעְזְרִים אוֹתָם
  choice: அவர்களுக்கு உதவுகின்றன
  rationale: எபிரெயப் பெயரெச்சம் தொடரும் அல்லது வழக்கமான செயலைக் குறிக்கலாம்; நிகழ்காலத் தமிழ் ஆகாசின் எண்ணத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָהֶם אֲזַבֵּחַ
  choice: நான் அவற்றுக்குப் பலியிடுவேன்
  rationale: முதலாம் நபர் வினையின் நோக்கம் அல்லது எதிர்காலத் தீர்மானத்தையும், தெய்வங்களைக் குறிக்கும் பன்மைப் பதிலிடுபெயரையும் வெளிப்படையாகக் காக்கிறது.
- source_word: וְיַעְזְרוּנִי
  choice: அவை எனக்கு உதவும்படி
  rationale: இந்த இணைப்பில் வினை ஆகாசின் நோக்கத்தை வெளிப்படுத்துகிறது; ‘உதவும்படி’ என்பது உறுதியான முன்னறிவிப்பாக மாற்றாமல் நோக்கப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ
  choice: ஆனால் அவையே அவனுக்கு … வீழ்ச்சிக்குக் காரணமாயின
  rationale: כשׁל என்பதன் Hiphil வடிவம் இடறச் செய்தல் அல்லது அழிவுக்கு இட்டுச் செல்லுதல் என்ற பொருளுடையது. ‘ஆனால்’ சூழலிலுள்ள முரண்பாட்டை வெளிப்படுத்துகிறது; ‘வீழ்ச்சிக்குக் காரணமாயின’ முடிவை தெளிவாகக் கூறுகிறது.
- source_word: וּלְכָל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதற்கும்
  rationale: இது முந்தைய ‘அவனுக்கும்’ என்பதோடு இணையான அமைப்பில் வைக்கப்பட்டு, விளைவு இஸ்ரவேல் அனைத்தையும் எட்டியதைத் தெரிவிக்கிறது.
theological_decisions:
- issue: தமஸ்குவின் தெய்வங்கள் ஆகாசைத் தாக்கின என்ற கூற்றின் கண்ணோட்டம்
  choice: ஆகாசின் புறமத விளக்கத்தை உரை அப்படியே அறிவிக்கிறது; அந்தத் தெய்வங்கள் உண்மையான தெய்வீகச் செயற்பாட்டாளர்கள் என்று மொழிபெயர்ப்பு உறுதிப்படுத்தவில்லை.
  alternative: வாக்கியத்தைத் தெய்வங்கள் உண்மையிலேயே அவனைத் தாக்கின என்ற விவரிப்பாக வெளிப்படையாக எடுத்துரைக்கலாம்; அல்லது ‘அவன் நினைத்தபடி’ என்று விளக்கச் சொற்களைச் சேர்க்கலாம்.
  rationale: மூல உரை ஆகாசின் எண்ணத்தைப் பதிவு செய்து, இறுதியில் அவை உதவாமல் வீழ்ச்சிக்குக் காரணமானதாகக் காட்டுகிறது. கண்ணோட்டத்தை விளக்கும் சொற்களை முதன்மை உரையில் சேர்க்காமல் அதன் நையாண்டியையும் இறையியல் பதற்றத்தையும் காக்கிறது.
- issue: וְיַעְזְרוּנִי என்பதன் நோக்கமா அல்லது எதிர்பார்க்கப்பட்ட விளைவா
  choice: ‘அவை எனக்கு உதவும்படி’ என்று நோக்கப் பொருளாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவை எனக்கு உதவும்’ என்று ஆகாசின் எதிர்பார்ப்பை நேரடி எதிர்காலக் கூற்றாகத் தரலாம்.
  rationale: முந்தைய ‘நான் பலியிடுவேன்’ என்பதுடன் வரும் தொடரமைப்பு பலியிடுவதன் நோக்கத்தை இயல்பாகக் காட்டுகிறது; அதேவேளை ஆகாசின் தவறான எதிர்பார்ப்பை இறையியல் உண்மையாக மாற்றுவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டது. ‘பலியிட்டான்’, ‘தெய்வங்கள்’, ‘வீழ்ச்சி’ போன்ற பொதுவாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டன. நேரடி மேற்கோளில் ஆகாசின் காரணவாதம் தெளிவாக இருக்க இரண்டு வாக்கியங்கள் பயன்படுத்தப்பட்டன; மூலத்தின் பன்மைகள், நோக்கப் பொருள், இறுதி முரண்பாடு ஆகியவை பாதுகாக்கப்பட்டன.
