  text: וּ/פְלִשְׁתִּ֣ים פָּשְׁט֗וּ בְּ/עָרֵ֨י הַ/שְּׁפֵלָ֣ה וְ/הַ/נֶּגֶב֮ לִֽ/יהוּדָה֒ וַֽ֠/יִּלְכְּדוּ אֶת בֵּֽית שֶׁ֨מֶשׁ וְ/אֶת אַיָּל֜וֹן וְ/אֶת הַ/גְּדֵר֗וֹת וְ/אֶת שׂוֹכ֤וֹ וּ/בְנוֹתֶ֨י/הָ֙ וְ/אֶת תִּמְנָ֣ה וּ/בְנוֹתֶ֔י/הָ וְ/אֶת גִּמְז֖וֹ וְ/אֶת בְּנֹתֶ֑י/הָ וַ/יֵּשְׁב֖וּ שָֽׁם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
translation:
  language: ta
  text: பெலிஸ்தியர்கள் யூதாவிலுள்ள தாழ்நிலப் பகுதியின் நகரங்களிலும் நெகேப் பகுதியின் நகரங்களிலும் படையெடுத்தனர். அவர்கள் பெத்-ஷெமேஷையும், அயலோனையும், கெதெரோத்தையும், சோகோவையும் அதன் சிற்றூர்களையும், திம்னாவையும் அதன் சிற்றூர்களையும், கிம்சோவையும் அதன் சிற்றூர்களையும் கைப்பற்றி, அங்கே குடியேறினர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: பெலிஸ்தியர்கள்
  rationale: பெலிஸ்திய மக்களைக் குறிக்கும் இனப்பெயர். வசனத் தொடக்கத்தில் உள்ள ו தமிழ் உரைநடையில் தனியே ‘மேலும்’ என மொழிபெயர்க்கப்படாமல் இயல்பான தொடர்ச்சியாக விடப்பட்டுள்ளது.
- source_word: פָּשְׁטוּ
  choice: படையெடுத்தனர்
  rationale: இராணுவச் சூழலில் தாக்குதல் அல்லது ஊடுருவல் நடத்துவதைச் சுட்டுகிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  choice: யூதாவிலுள்ள அடிவாரப் பகுதியின் நகரங்களிலும் நெகேப் பகுதியின் நகரங்களிலும்
  rationale: שְׁפֵלָה யூதாவின் மேற்குப் பக்கத் தாழ்வான அடிவார நிலப்பகுதியைக் குறிக்கிறது. נֶגֶב வெறும் ‘தெற்கு’ அல்லாமல் குறிப்பிட்ட புவியியல் பகுதியின் பெயராக இருப்பதால் ‘நெகேப்’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיִּלְכְּדוּ
  choice: கைப்பற்றி
  rationale: போரில் நகரங்களைக் கைப்பற்றுவதைக் குறிக்கும் வினைக்கு துல்லியமான, இயல்பான தமிழ் இணை.
- source_word: בֵּית שֶׁמֶשׁ
  choice: பெத்-ஷெமேஸ்
  rationale: இடப்பெயர் மூல எபிரெய ஒலிப்புக்கு நெருக்கமாகத் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַיָּלוֹן
  choice: அயலோன்
  rationale: இடப்பெயர் தமிழில் நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַגְּדֵרוֹת
  choice: கெதெரோத்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שׂוֹכוֹ
  choice: சோகோ
  rationale: இடப்பெயரின் எபிரெய வடிவத்துக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  choice: அதன் சிற்றூர்கள்
  rationale: சொல்லர்த்தமாக ‘அதன் மகள்கள்’; இங்கு முதன்மை நகரத்தைச் சார்ந்த துணைக் குடியிருப்புகளைக் குறிக்கும் மரபுத்தொடர். ‘சிற்றூர்கள்’ அதன் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תִּמְנָה
  choice: திம்னா
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: גִּמְזוֹ
  choice: கிம்சோ
  rationale: இடப்பெயர் எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: அங்கே குடியேறினர்
  rationale: வெற்றிக்குப் பிறகு அங்கு தங்கி வாழத் தொடங்கியதைக் குறிக்கிறது; ‘குடியேறினர்’ ஆக்கிரமிப்பையும் நிலையான வசிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
