base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female servants for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
translation:
  language: ta
  text: இப்போதோ, யூதா மற்றும் எருசலேம் மக்களை உங்களுக்கே ஆண் அடிமைகளாகவும் பெண் அடிமைகளாகவும் அடக்கிக் கொள்ள நீங்கள் எண்ணுகிறீர்கள். ஆனால், உங்கள் கடவுளாகிய யாவேக்கு எதிரான குற்றங்கள் உங்களிடமே இருக்கின்றன அல்லவா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதி வினா எபிரெயில் சுருக்கமாக உள்ளது; சொல்லுக்கு நெருக்கமாக, “யாவே உங்கள் கடவுளுக்கு எதிரான குற்றங்கள் உங்களிடமே இல்லையா?” எனலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதோ
  rationale: முந்தைய உரையுடன் இணைத்து, தற்போதைய கண்டனத்துக்கு மாறும் உரையாடல் குறியீட்டின் வலிமையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלִַם
  choice: யூதா மற்றும் எருசலேம் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘மகன்கள்’ என்றாலும், இங்கு இரு இடங்களின் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது; பாலின வரம்பு தோன்றாத இயல்பான தமிழ் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַתֶּם אֹמְרִים
  choice: நீங்கள் எண்ணுகிறீர்கள்
  rationale: இச்சூழலில் நிகழ்காலப் பங்கேற்பு அவர்கள் கூறும் திட்டம் அல்லது நோக்கத்தைக் குறிக்கிறது; ‘எண்ணுகிறீர்கள்’ அந்த உடனடி நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: לִכְבֹּשׁ
  choice: அடக்கிவைக்க
  rationale: כָּבַשׁ என்பதன் அடிப்படை வலிமையான அடக்குதல் அல்லது கட்டுப்பாட்டுக்குள் கொண்டுவருதல். அடுத்துவரும் அடிமைநிலையுடன் இணைந்தாலும், வினையைத் தனியாக ‘அடிமைப்படுத்த’ என்று மிகையாக மொழிபெயர்க்கவில்லை.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: ஆண் அடிமைகளாகவும் பெண் அடிமைகளாகவும்
  rationale: போரில் பிடிக்கப்பட்டவர்களை வலுக்கட்டாய அடிமைநிலைக்கு உட்படுத்தும் சூழல் என்பதால் ‘வேலையாட்கள்’ என்பதைக் காட்டிலும் ‘அடிமைகள்’ துல்லியமானது; இரு பாலினச் சொற்களும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
- source_word: לָכֶם
  choice: உங்களுக்காக
  rationale: அவர்களைத் தங்களுடைய பயன்பாட்டுக்கும் உடைமைக்கும் கொண்டுவரும் நலன்/உடைமைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הֲלֹא רַק ... עִמָּכֶם אֲשָׁמוֹת
  choice: ஆனால் ... குற்றங்கள் உங்களிடமும் இல்லையா?
  rationale: எபிரெயின் சுருக்கமான வினாவையும், குற்றம் சாட்டுவோருக்கே குற்றம் இருப்பதை வலியுறுத்தும் எதிர்மறை வினாவின் அழுத்தத்தையும் பாதுகாக்கிறது. ‘குற்றங்கள்’ என்ற பன்மை אֲשָׁמוֹת என்பதைக் காட்டுகிறது.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யெகோவாவுக்கு எதிரான
  rationale: לְ இங்கு கடவுளுக்கு எதிரான குற்றப்பொறுப்பைச் சுட்டுகிறது; ‘எதிரான’ என்பது அந்த உறவைத் தெளிவாகக் காட்டுகிறது. יהוה என்பது தனிப்பெயராக ‘யெகோவா’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக இருப்பதால், பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாகத் தனிப்பெயர் ஒலிபெயர்க்கப்படுகிறது. தமிழில் பரவலாக அறியப்படும் வடிவம் ‘யெகோவா’.
- issue: עֲבָדִים / שְׁפָחוֹת குறிக்கும் சமூக நிலை
  choice: ஆண் அடிமைகள் / பெண் அடிமைகள்
  alternative: வேலையாட்கள் / வேலைக்காரிகள்
  rationale: இது போருக்குப் பிந்தைய வலுக்கட்டாய அடக்குமுறையைப் பற்றிய சூழல்; ஆகவே சுதந்திரமான பணிசெயலை உணர்த்தக்கூடிய மாற்றுச் சொற்களை விட ‘அடிமைகள்’ பொருத்தமானது.
- issue: இறுதி வினாவில் உள்ள אֲשָׁמוֹת என்ற பன்மை
  choice: குற்றங்கள்
  alternative: குற்றம்
  rationale: மூலத்தின் பன்மையையும் அவர்களிடம் உள்ள பல குற்றச்செயல்கள்/குற்றப்பொறுப்புகளையும் பாதுகாக்கிறது; அவற்றின் சரியான தன்மையை விளக்கி உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கண்டன நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அடக்கிவைக்க’ என்பது வலுக்கட்டாயக் கட்டுப்பாட்டையும், ‘அடிமைகள்’ என்பது அதன் விளைவான நிலையையும் வேறுபடுத்திக் காட்டுகிறது. இறுதி எதிர்மறை வினாவின் இறையியல் அழுத்தமும் மூலத்தின் பன்மையான ‘குற்றங்கள்’ என்பதும் பாதுகாக்கப்பட்டுள்ளன.
