source:
  edition: WLC
  text: וְ/ה֥וּא הִקְטִ֖יר בְּ/גֵ֣יא בֶן הִנֹּ֑ם וַ/יַּבְעֵ֤ר אֶת בָּנָי/ו֙ בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: ta
  text: அவன் பென்-இன்னோம் பள்ளத்தாக்கில் தூபம் எரித்தான்; யாவே இஸ்ரவேல் மக்களின் முன்னிலையிலிருந்து துரத்தியிருந்த பிறநாட்டினரின் அருவருப்பான செயல்களின்படி, தன் மகன்களை நெருப்பில் எரித்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் மகன்களை நெருப்பைக் கடக்கச் செய்தான்.” இங்குள்ள எபிரெய வாசகம் இன்னும் நேரடியாக, “தன் மகன்களை நெருப்பில் எரித்தான்” என்று கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הִקְטִיר
  choice: தூபம் எரித்தான்
  rationale: הקטיר என்ற வினையின் ஹிஃபில் வடிவம் பலியினால் புகை எழச்செய்வதைக் குறிக்கலாம்; வழிபாட்டுச் சூழலில் இயல்பாகவும் சுருக்கமாகவும் உள்ள ‘தூபம் எரித்தான்’ என்பது பொருத்தமானது.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: பென்-இன்னோம் பள்ளத்தாக்கில்
  rationale: இது ஓர் இடப்பெயர். பிற்கால ‘கெஹென்னா’ தொடர்புகளை இங்கு புகுத்தாமல், எபிரெயப் பெயரை ஒலிபெயர்த்து வழங்குகிறது.
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  choice: தன் மகன்களை நெருப்பில் எரித்தான்
  rationale: בער என்பதன் ஹிஃபில் வடிவமும் ‘நெருப்பில்’ என்ற தொடரும் உண்மையான எரித்தலை நேரடியாகக் குறிக்கின்றன. בָּנָיו என்பதற்கேற்ப ‘மகன்கள்’ தக்கவைக்கப்பட்டுள்ளது.
- source_word: כְּתוֹעֲבוֹת
  choice: அருவருப்பான பழக்கங்களின்படி
  rationale: תועבות என்பதன் கடுமையான ஒழுக்க மதிப்பீட்டை ‘அருவருப்பான’ காக்கிறது; இச்சூழலில் பின்பற்றப்பட்ட செயல்களைத் தெளிவாக்க ‘பழக்கங்கள்’ இயல்பான தமிழை வழங்குகிறது.
- source_word: הַגּוֹיִם
  choice: பிற இனத்தார்
  rationale: இங்கு நாட்டிலிருந்து அகற்றப்பட்ட இஸ்ரவேலரல்லாத மக்களைக் குறிக்கிறது; ‘புறஜாதியார்’ என்ற சமயச் சாயலைத் தவிர்த்து, இயல்பான தமிழில் வழங்கப்பட்டுள்ளது.
- source_word: הֹרִישׁ
  choice: துரத்தியிருந்த
  rationale: ירש என்பதன் ஹிஃபில் வடிவம் முந்தைய குடிகளை நாட்டிலிருந்து வெளியேற்றி உடைமையை இழக்கச் செய்வதைக் குறிக்கிறது; ‘துரத்தியிருந்த’ முன் நிகழ்ந்த வெளியேற்றத்தைத் தெளிவாகச் சொல்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கு முன்பாக
  rationale: מִפְּנֵי என்ற சொற்றொடரின் ‘அவர்களுக்கு முன்பிருந்து அகற்றுதல்’ என்ற இடவியல் கருத்தைக் காக்கிறது; בְּנֵי יִשְׂרָאֵל என்பதை இயல்பான நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ என வழங்குகிறது.
theological_decisions:
- issue: குழந்தைப் பலியை மென்மையாக்க வேண்டுமா என்பது
  choice: முதன்மை உரையில் ‘தன் மகன்களை நெருப்பில் எரித்தான்’ என்று நேரடியாகக் கூறுதல்
  alternative: ‘தன் மகன்களை நெருப்பைக் கடக்கச் செய்தான்’
  rationale: இங்கு எபிரெயம் ‘நெருப்பைக் கடக்கச் செய்தான்’ என்ற வழக்கமான சூத்திரத்தைப் பயன்படுத்தாமல், בער என்ற வலுவான வினையைப் பயன்படுத்துகிறது. ஆகவே உரையின் கடுமை தக்கவைக்கப்பட்டு, பரவலான மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இயல்பும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; செயற்கையான சொற்சொல் மொழிபெயர்ப்பு தவிர்க்கப்பட்டாலும், குழந்தைப் பலியை விவரிக்கும் மூலத்தின் கடுமை மென்மையாக்கப்படவில்லை.
