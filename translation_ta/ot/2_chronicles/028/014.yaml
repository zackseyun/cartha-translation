source:
  edition: WLC
  text: וַ/יַּעֲזֹ֣ב הֶֽ/חָל֗וּץ אֶת הַ/שִּׁבְיָה֙ וְ/אֶת הַ/בִּזָּ֔ה לִ/פְנֵ֥י הַ/שָּׂרִ֖ים וְ/כָל הַ/קָּהָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/014.yaml
  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
translation:
  language: ta
  text: ஆகவே, ஆயுதமேந்திய வீரர்கள் சிறைபிடிக்கப்பட்டவர்களையும் கொள்ளைப்பொருளையும் அதிகாரிகள் மற்றும் சபையினர் அனைவரின் முன்பாக விட்டுவிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: விட்டுவிட்டார்கள்
  rationale: עזב என்பதன் அடிப்படைப் பொருள் ‘விடுதல்’. இச்சூழலில் சிறைபிடிக்கப்பட்டவர்களையும் கொள்ளைப்பொருளையும் தங்கள் கட்டுப்பாட்டிலிருந்து ஒப்படைத்துவிடும் செயலை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: הֶחָלוּץ
  choice: ஆயுதமேந்திய வீரர்கள்
  rationale: போருக்காக ஆயத்தமாகி ஆயுதம் தரித்தவர்களை இச்சொல் குறிக்கிறது. ‘வீரர்கள்’ என்பது சூழலுக்கேற்ற இயல்பான பன்மை; ‘ஆயுதமேந்திய’ என்பது மூலத்தின் இராணுவக் குறிப்பைத் தெளிவாக்குகிறது.
- source_word: הַשִּׁבְיָה
  choice: சிறைபிடிக்கப்பட்டவர்கள்
  rationale: பெயர்ச்சொல் ‘சிறையிருப்பு’ என்ற கருத்தையும் குறிக்கலாம்; இங்கு போரில் பிடித்துச் செல்லப்பட்ட மக்களைக் குறிப்பதால் மனிதர்களைக் குறிக்கும் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: הַבִּזָּה
  choice: கொள்ளைப்பொருள்
  rationale: போரில் கைப்பற்றப்பட்ட பொருட்களை குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் தெளிவான, கண்ணியமான இணை இது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: அதிகாரிகளும் கூடியிருந்த மக்களும் காணும் இடத்தில் அல்லது அவர்களுடைய முன்னிலையில் விடப்பட்டதைச் சுருக்கமாகக் காக்கிறது.
- source_word: הַשָּׂרִים
  choice: அதிகாரிகள்
  rationale: שׂרים என்பது தலைவர்கள், அதிகாரிகள், பிரபுக்கள் எனப் பொருள்படலாம். இங்கு நடவடிக்கையை மேற்பார்வையிடும் அங்கீகரிக்கப்பட்ட தலைமைப்பொறுப்பாளர்களைக் குறிக்க ‘அதிகாரிகள்’ பொருத்தமானது.
- source_word: כָל הַקָּהָל
  choice: கூடியிருந்த மக்கள் அனைவரும்
  rationale: קהל என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. ‘சபை’ என்பதன் சமய அல்லது நிர்வாக நிழற்பொருளைத் தவிர்த்து, இச்சூழலின் மக்கள் கூட்டத்தை இயல்பாக வெளிப்படுத்துகிறது.
