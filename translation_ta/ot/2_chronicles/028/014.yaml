translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான எளிய நடையில் மொழிபெயர்க்கப்பட்டது. எபிரேய வாக்கியத்தின் சொல்வரிசையை இறுக்கமாகப் பின்பற்றாமல், செய்பவர், விடப்பட்டவர்கள் மற்றும் பொருட்கள், சாட்சிகளாக இருந்த அதிகாரிகளும் மக்கள் கூட்டமும் ஆகிய உறவுகள் தெளிவாக இருக்குமாறு அமைக்கப்பட்டுள்ளது.
