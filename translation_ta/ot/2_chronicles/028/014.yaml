revisions:
- from: ஆகவே, ஆயுதமேந்திய வீரர்கள் சிறைபிடிக்கப்பட்டவர்களையும் கொள்ளைப்பொருளையும் அதிகாரிகளுக்கும் கூடியிருந்த மக்கள் அனைவருக்கும் முன்பாக விட்டுவிட்டார்கள்.
  to: ஆகவே, ஆயுதமேந்திய வீரர்கள் சிறைபிடிக்கப்பட்டவர்களையும் கொள்ளைப்பொருளையும் அதிகாரிகள் மற்றும் சபையினர் அனைவரின் முன்பாக விட்டுவிட்டார்கள்.
  rationale: 'The revision retains the draft’s faithful lexical choices while correcting the case construction so that both “officials” and “the whole assembly” are unmistakably the parties before whom the captives and plunder were left. No footnote is needed: the source’s lexical alternatives do not create an unresolved ambiguity in this Tamil rendering.'
