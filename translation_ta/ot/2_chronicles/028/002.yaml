source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דַרְכֵ֖י מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֧ם מַסֵּכ֛וֹת עָשָׂ֖ה לַ/בְּעָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/002.yaml
  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
translation:
  language: ta
  text: அவன் இஸ்ரவேல் அரசர்களின் வழிகளில் நடந்தான்; பாகால்களுக்காக வார்ப்புச் சிலைகளையும்[a] செய்தான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உலோகத்தை உருக்கி வார்த்த சிலைகள்.’ எபிரெயச் சொல் அச்சில் வார்த்து உருவாக்கப்பட்ட சிலைகளைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பாகால்கள்’ என்பது எபிரெயிலும் பன்மை; இது பாகால் வழிபாட்டுடன் தொடர்புடைய பல உள்ளூர் வடிவங்களையோ பிரதிநிதித்துவங்களையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: வழிகளில் நடந்தான்
  rationale: எபிரெய மொழியின் ‘வழிகளில் நடத்தல்’ என்ற வாழ்க்கைநடத்தைச் சுட்டும் உருவகத்தைத் தமிழிலும் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்கள்
  rationale: வரலாற்றுச் சுட்டுதலை நேரடியாகக் காக்கும் இயல்பான தமிழ் இணைப்பு.
- source_word: וְגַם
  choice: -களையும்
  rationale: இது முன் கூறப்பட்ட குற்றத்தோடு சேர்ந்த கூடுதல் செயல் என்பதைத் தமிழின் ‘உம்’ விகுதி இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַסֵּכוֹת
  choice: வார்ப்புச் சிலைகள்
  rationale: உருக்கிய பொருளை அச்சில் வார்த்து உருவாக்கப்பட்ட சிலைகள் என்ற குறிப்பான தயாரிப்பு முறையை ‘சிலைகள்’ என்று பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: עָשָׂה
  choice: செய்தான்
  rationale: எபிரெய பொதுவினைக்குச் சமமான, இச்சூழலில் இயல்பான தமிழ் வினை.
- source_word: לַבְּעָלִים
  choice: பாகால்களுக்காக
  rationale: எபிரெயச் சொல்லின் பன்மையை அழிக்காமல், பாகால் வழிபாட்டுடன் தொடர்புடைய பல உள்ளூர் வடிவங்கள் அல்லது வழிபாட்டு வெளிப்பாடுகள் இருக்கக்கூடிய தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: בְּעָלִים என்பதன் பன்மை
  choice: பாகால்கள்
  alternative: பாகால்; பாகால் சிலைகள்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள பன்மையை ஒருமையாக்காமல் காக்கிறது; இது பல உள்ளூர் வடிவங்களையோ வழிபாட்டு வெளிப்பாடுகளையோ குறிக்கலாம், ஆனால் வசனம் அதனைத் தீர்மானமாக விளக்கவில்லை.
- issue: வாழ்க்கை நடத்தைக்கான ‘நடத்தல்’ உருவகம்
  choice: அரசர்களின் வழிகளில் நடந்தான்
  alternative: அரசர்களின் பழக்கங்களைப் பின்பற்றினான்
  rationale: மூல எபிரெய உருவகத்தைத் தக்கவைத்தபடியே நவீனத் தமிழில் புரிந்துகொள்ளக்கூடியதாக உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், ஆனால் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடை. ‘வழிகளில் நடந்தான்’ என்ற செமித்திய உருவகம் தமிழிலும் விளங்குவதால் பாதுகாக்கப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
