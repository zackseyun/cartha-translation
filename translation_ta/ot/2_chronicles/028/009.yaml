  source_fidelity: முக்கிய பொருள் துல்லியமாக உள்ளது. ஆனால் הַצָּבָא הַבָּא לְשֹׁמְרוֹן என்பது ‘சமாரியாவுக்கு வந்த படை’ (அல்லது வந்துகொண்டிருந்த படை) எனும் படையின் இயக்கத்தைச் சுட்டுகிறது; வரைவு ‘சமாரியாவுக்கு வந்துகொண்டிருந்த படையை எதிர்கொண்டு போய்’ என்று கூறுவதால் தீர்க்கதரிசி படையை எதிர்கொள்ளச் சென்றார் என்ற கூடுதல் நுணுக்கம் சேர்கிறது. לִפְנֵי என்பதன் ‘முன்னால்/எதிரில்’ பொருளை நடுநிலையாகக் காக்க வேண்டும். மேலும் בְזַעַף עַד לַשָּׁמַיִם הִגִּיעַ என்பது ‘வானம் வரை எட்டிய சீற்றத்துடன்’ என்றபடி சீற்றம் எட்டியதைக் குறிக்கிறது; ‘வானம்வரை எட்டிய சீற்றத்தோடு’ ஏற்றதே, ஆனால் வினையடைத் தொடரை மேலும் தெளிவாக அமைக்கலாம்.
  naturalness: நடை நவீனத் தரத் தமிழிலும் வாசிக்க இயல்பாகவும் உள்ளது. ‘உங்கள் மூதாதையரின் கடவுளாகிய ஆண்டவர்’ மற்றும் ‘உங்கள் கையில் ஒப்புக்கொடுத்தார்’ பொருத்தமானவை. ‘படையை எதிர்கொண்டு போய்’ மட்டும் தேவையற்ற விளக்கத்தைத் தருகிறது; ‘படையின் முன்னால் சென்று’ மூலத்திற்கும் தமிழுக்கும் பொருத்தமானது.
  terminology: ‘ஆண்டவர்’ என்ற மரியாதைமிக்க வடிவமும், יהוה என்ற தனிப்பட்ட பெயரைக் குறிக்கும் அடிக்குறிப்பும் ஒருமையாக உள்ளன. ‘தீர்க்கதரிசி,’ ‘ஒப்புக்கொடுத்தார்,’ ‘சீற்றம்’ ஆகிய சொற்கள் பொருளுக்கும் பதிவுக்கும் ஏற்றவை. ஓதேத் என்ற பெயர்ப்பெயர்ப்பு ஏற்கத்தக்கது.
