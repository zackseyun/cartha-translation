base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: There was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: ta
  text: அங்கே ஆண்டவருடைய[a] தீர்க்கதரிசி ஒருவர் இருந்தார்; அவர் பெயர் ஓதேத். அவர் சமாரியாவுக்கு வந்த படையின் முன்னால் சென்று அவர்களிடம், “இதோ, உங்கள் மூதாதையரின் கடவுளாகிய ஆண்டவர் யூதாவின்மீது கோபங்கொண்டதால் அவர்களை உங்கள் கையில் ஒப்புக்கொடுத்தார். ஆனால் நீங்களோ, வானம் வரை எட்டிய சீற்றத்துடன் அவர்களைக் கொன்றீர்கள்,” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் இங்கு கடவுளின் தனிப்பட்ட பெயரான יהוה (YHWH) உள்ளது.
    reason: ‘ஆண்டவர்’ என்று மொழிபெயர்க்கப்பட்ட இடத்தில் மூலத்தின் தனிப்பட்ட இறைப் பெயரை வாசகர் அறியச் செய்கிறது.
lexical_decisions:
- source_word: וְשָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் שָׁם என்பதைக் இயல்பான தமிழில் நேரடியாகக் கொடுக்கிறது; வாவ் தொடர்ச்சியைத் தேவையற்ற ‘இப்போது’ என மாற்றவில்லை.
- source_word: נָבִיא לַיהוָה
  choice: ஆண்டவருடைய தீர்க்கதரிசி
  rationale: לַיהוָה இங்குக் குறிக்கும் உரிமை/சார்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּצֵא לִפְנֵי הַצָּבָא
  choice: படையை எதிர்கொண்டு போய்
  rationale: சொல்லுக்கு சொல் ‘படைக்கு முன்பாகப் புறப்பட்டார்’ என்பதைக் காட்டிலும், வருகிற படையைச் சந்திக்க வெளியே சென்ற செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: தீர்க்கதரிசியின் கவன ஈர்ப்பு மற்றும் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: נְתָנָם בְּיֶדְכֶם
  choice: அவர்களை உங்கள் கையில் ஒப்புக்கொடுத்தார்
  rationale: வெற்றிக்காக ஒருவரை மற்றொருவரின் அதிகாரத்தில் விடும் எபிரேய மரபுத்தொடரின் பொருளைத் தருகிறது.
- source_word: בְזַעַף עַד לַשָּׁמַיִם הִגִּיעַ
  choice: வானம்வரை எட்டிய சீற்றத்தோடு
  rationale: சீற்றத்தின் மிகுதியை உருவகமாகச் சொல்லும் மூலத்தின் வலிமையையும் வானத்தை நோக்கிய அளவுருவையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்[a]
  alternative: யாவே
  rationale: தமிழ் வேதாகம நடையில் பரவலாகப் புரியக்கூடிய மரியாதைமிக்க வடிவை முதன்மை உரையில் பயன்படுத்தி, மூலத்தில் தனிப்பட்ட இறைப் பெயர் இருப்பதை அடிக்குறிப்பில் வெளிப்படுத்துகிறது.
- issue: வெற்றி கிடைத்ததற்கும் படுகொலையின் குற்றத்திற்கும் இடையிலான பதற்றம்
  choice: ‘ஒப்புக்கொடுத்தார். ஆனால் நீங்களோ ... கொன்றீர்கள்’
  alternative: ‘ஒப்புக்கொடுத்தார்; மேலும் நீங்கள் ... கொன்றீர்கள்’
  rationale: வாவ் பலவகை உறவுகளைத் தாங்கினாலும், இங்கு கடவுள் யூதாவை அவர்களிடம் ஒப்புக்கொடுத்தது கட்டுப்பாடற்ற சீற்றக் கொலைக்கு அனுமதி அல்ல என்பதே தீர்க்கதரிசனக் கண்டனத்தின் தெளிவான முரண்; ‘ஆனால்’ அந்தப் பதற்றத்தை இயல்பான தமிழில் காட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க தீர்க்கதரிசன நடையைப் பயன்படுத்துகிறது. ‘கோபங்கொண்டதால்’, ‘ஒப்புக்கொடுத்தார்’, ‘சீற்றத்தோடு’ ஆகியவை உரையின் தீவிரத்தைத் தக்கவைத்தும் பழமையான அல்லது செயற்கையான நடையைத் தவிர்த்தும் உள்ளன.
