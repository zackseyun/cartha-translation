translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரசர்களின் நூல்’ என்பது மேற்கோள் ஆவணத்தின் பெயராகப் புரியுமாறு அமைக்கப்பட்டுள்ளது; தமிழில் பெரிய எழுத்து வேறுபாடு இல்லாததால் கூடுதல் குறியீடு சேர்க்கப்படவில்லை.
