  yaml_path: translation/ot/2_chronicles/028/026.yaml
  text: The rest of his acts and all his ways, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: ta
  text: அவனுடைய மற்ற செயல்களும், அவனுடைய நடத்தை முழுவதும்—முந்தையவை முதல் பிந்தையவை வரை—இதோ, யூதா மற்றும் இஸ்ரவேல் அரசர்களின் நூலில் எழுதப்பட்டுள்ளன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  choice: அவனுடைய மற்ற செயல்களும்
  rationale: அரசர் வரலாற்றுச் சுருக்கங்களில் דְּבָרִים என்பது சொற்களை அல்ல, அரசனின் செயல்களையும் விவகாரங்களையும் குறிக்கிறது. וְ என்ற இணைப்பைத் தமிழில் ‘-உம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְכָל דְּרָכָיו
  choice: அவனுடைய ... நடத்தை முழுவதும்
  rationale: דֶּרֶךְ என்பதன் அடிப்படைப் பொருள் ‘வழி’; இங்கு அது ஆகாசின் வாழ்க்கை நடத்தை அல்லது செயல்போக்கைக் குறிக்கிறது. ‘நடத்தை’ நவீனத் தமிழில் தெளிவான சூழற்பொருளை வழங்குகிறது.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: முந்தையதும் பிந்தையதுமான
  rationale: இந்த இணைச்சொற்கள் அவனுடைய ஆட்சியின் முற்பகுதியையும் பிற்பகுதியையும் உள்ளடக்குகின்றன. ‘முந்தையதும் பிந்தையதுமான’ என்பது எபிரெய காலவரிசை வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: הִנָּם כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: כְּתוּבִים என்பதன் எழுத்துப்பொருளை இயல்பான தமிழில் தருகிறது. הִנָּם வலியுறுத்தும் சுட்டுக் கூறல் தமிழில் தனியே ‘இதோ’ என மொழிபெயர்க்கப்பட்டால் செயற்கையாக இருக்கும்; உறுதியான அறிவிப்பு அமைப்பிலேயே அதன் தாக்கம் வெளிப்படுகிறது.
- source_word: עַל סֵפֶר
  choice: நூலில்
  rationale: நூல் சார்ந்த மேற்கோள் வழக்கில் עַל என்பதைத் தமிழில் ‘நூலில்’ என்று வழங்குவது இயல்பானது. סֵפֶר சுருள் அல்லது நூலைக் குறிக்கலாம்; இங்கு ‘நூல்’ பொருத்தமானது.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: யூதா மற்றும் இஸ்ரவேல் அரசர்களின்
  rationale: மேற்கோள் காட்டப்படும் ஆவணத்தின் பெயரை எபிரெய உரையின் உறவுநிலை அமைப்புக்கு நெருக்கமாக வழங்குகிறது.
