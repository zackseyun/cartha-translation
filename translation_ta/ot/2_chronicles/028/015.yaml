  text: וַ/יָּקֻ֣מוּ הָ/אֲנָשִׁים֩ אֲשֶׁר נִקְּב֨וּ בְ/שֵׁמ֜וֹת וַ/יַּחֲזִ֣יקוּ בַ/שִּׁבְיָ֗ה וְ/כָֽל מַעֲרֻמֵּי/הֶם֮ הִלְבִּ֣ישׁוּ מִן הַ/שָּׁלָל֒ וַ/יַּלְבִּשׁ֣וּ/ם וַ֠/יַּנְעִלוּ/ם וַ/יַּאֲכִל֨וּ/ם וַ/יַּשְׁק֜וּ/ם וַ/יְסֻכ֗וּ/ם וַ/יְנַהֲל֤וּ/ם בַּ/חֲמֹרִים֙ לְ/כָל כּוֹשֵׁ֔ל וַ/יְבִיא֛וּ/ם יְרֵח֥וֹ עִיר הַ/תְּמָרִ֖ים אֵ֣צֶל אֲחֵי/הֶ֑ם וַ/יָּשׁ֖וּבוּ שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
translation:
  language: ta
  text: பெயர் குறிப்பிட்டு நியமிக்கப்பட்டிருந்த அந்த மனிதர்கள் எழுந்து, சிறைபிடிக்கப்பட்டவர்களைத் தங்கள் பொறுப்பில் எடுத்துக்கொண்டார்கள். அவர்களுள் உடையில்லாமல் இருந்த அனைவருக்கும் கொள்ளைப்பொருள்களிலிருந்து உடை கொடுத்தார்கள். அவர்களுக்கு உடை உடுத்தி, காலணிகளை அணிவித்து, உணவும் பானமும் கொடுத்து, எண்ணெய் பூசினார்கள். தளர்ந்து தடுமாறிய அனைவரையும் கழுதைகள்மேல் ஏற்றி அழைத்துச் சென்றார்கள். பிறகு அவர்களைப் பேரீச்சமரங்களின் நகரமான எரிகோவுக்கு, அவர்களுடைய சகோதரர்களிடம்[a] கொண்டுபோய்விட்டு, சமாரியாவுக்குத் திரும்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய உறவினர்களிடம்”; அல்லது, “அவர்களுடைய சக இஸ்ரவேலர்களிடம்.”
    reason: אֲחֵיהֶם என்பதன் நேரடிப் பொருள் ‘அவர்களுடைய சகோதரர்கள்’; இச்சூழலில் அது ஒரே மக்களினத்தைச் சேர்ந்த உறவினர்களையோ சக இஸ்ரவேலர்களையோ பரந்த முறையில் குறிக்கலாம்.
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: பெயர் குறிப்பிட்டு நியமிக்கப்பட்டிருந்த
  rationale: நிஃபால் வடிவமும் ‘பெயர்களால்’ என்ற சொற்றொடரும், இவர்கள் குறிப்பாகப் பெயரிடப்பட்டு இந்தப் பொறுப்புக்காக நியமிக்கப்பட்டவர்கள் என்பதைக் காட்டுகின்றன. ‘பெயர் குறிப்பிட்டு நியமிக்கப்பட்டிருந்த’ என்பது அந்த முறையான குறிப்பையும் இயல்பான தமிழையும் தக்கவைக்கிறது.
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  choice: சிறைபிடிக்கப்பட்டவர்களைத் தங்கள் பொறுப்பில் எடுத்துக்கொண்டார்கள்
  rationale: החזיק ב என்பதற்கு பிடித்துக்கொள்ளுதல், ஆதரித்தல், பொறுப்பேற்றல் ஆகிய பொருள்கள் உண்டு. இங்குள்ள இரக்கச் செயல்களின் சூழலில் பகைமையான பிடித்தல் அல்ல, பராமரிப்புப் பொறுப்பை ஏற்றுக்கொள்ளுதலே பொருத்தமானது.
- source_word: מַעֲרֻמֵּיהֶם
  choice: அவர்களுள் உடையில்லாமல் இருந்த அனைவருக்கும்
  rationale: இந்தச் சொல் சிறைக் கூட்டத்தாருள் உரிக்கப்பட்டோ உடையின்றியோ இருந்தவர்களைக் குறிக்கிறது. தமிழில் மனித மரியாதையுடனும் தெளிவாகவும் இவ்வாறு வழங்கப்பட்டது.
- source_word: הִלְבִּישׁוּ מִן הַשָּׁלָל
  choice: கொள்ளைப்பொருள்களிலிருந்து உடை கொடுத்தார்கள்
  rationale: உடைகள் போரில் கைப்பற்றப்பட்ட பொருள்களிலிருந்து எடுக்கப்பட்டன என்ற மூலத்தின் குறிப்பைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: וַיַּלְבִּשׁוּם וַיַּנְעִלוּם
  choice: அவர்களுக்கு உடை உடுத்தி, காலணிகளை அணிவித்து
  rationale: எபிரெய உரையின் தொடர்ச்சியான பராமரிப்புச் செயல்களையும், உடை உடுத்துதல் மற்றும் பாதரட்சை அணிவித்தல் என்ற இரு தனிச் செயல்களையும் நேரடியாகக் காட்டுகிறது.
- source_word: וַיַּאֲכִלוּם וַיַּשְׁקוּם
  choice: உணவும் பானமும் கொடுத்து
  rationale: உண்ணவும் குடிக்கவும் கொடுத்தார்கள் என்ற இரு causative வினைகளையும் இயல்பான தமிழில் இணையாக வழங்குகிறது; குடித்தது தண்ணீர்தான் என்று மூலத்தில் இல்லாத விவரம் சேர்க்கப்படவில்லை.
- source_word: וַיְסֻכוּם
  choice: எண்ணெய் பூசினார்கள்
  rationale: סוך இங்கு உடலில் எண்ணெய் பூசுவதைச் சுட்டுகிறது. ‘அபிஷேகம் செய்தார்கள்’ என்பது சடங்குசார் பொருளைத் தேவையின்றி எழுப்பக்கூடும்; ‘எண்ணெய் பூசினார்கள்’ பராமரிப்பு மற்றும் உடல் புத்துணர்ச்சி சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל כּוֹשֵׁל
  choice: தளர்ந்து தடுமாறிய அனைவரையும் கழுதைகள்மேல் ஏற்றி அழைத்துச் சென்றார்கள்
  rationale: כושל என்பது தள்ளாடுகிற அல்லது தடுமாறுகிறவரைக் குறிக்கிறது; இங்கு உடல் தளர்ச்சி காரணமான நிலை. கழுதைகளுடன் மெதுவாக வழிநடத்திய பொருளை, தமிழில் சூழலுக்கு ஏற்றவாறு ‘ஏற்றி அழைத்துச் சென்றார்கள்’ எனத் தெளிவுபடுத்துகிறது.
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  choice: பேரீச்சமரங்களின் நகரமான எரிகோ
  rationale: எரிகோவுக்கான மூல உரையின் அடைமொழியை இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: אֲחֵיהֶם என்ற உறவுமுறைச் சொல்லின் பொருள்
  choice: அவர்களுடைய சகோதரர்களிடம்
  alternative: அவர்களுடைய உறவினர்களிடம்; அவர்களுடைய சக இஸ்ரவேலர்களிடம்
  rationale: எபிரெயச் சொல் இலக்கணப்படி ஆண்பால் பன்மை ‘அவர்களுடைய சகோதரர்கள்’ என்பதாகும். சூழலில் அது யூதாவைச் சேர்ந்த உடன்படிக்கை மக்களாகிய பரந்த உறவுக் குழுவைக் குறிக்கக்கூடும். பிரதான உரை நேரடியான உறவுமுறைச் சொல்லைத் தக்கவைத்து, அதன் பரந்த சூழல்சார் பொருளை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் அடுக்கான இரக்கச் செயல்கள் பாதுகாக்கப்பட்டுள்ளன; ஆனால் தமிழில் இயல்பாக வாசிக்க வினைத்தொடர்கள் ஒழுங்குபடுத்தப்பட்டுள்ளன. ‘அபிஷேகம்’ போன்ற சடங்குசார் ஒலிப்பைத் தவிர்த்து, இச்சூழலின் உடல் பராமரிப்புப் பொருளுக்காக ‘எண்ணெய் பூசினார்கள்’ பயன்படுத்தப்பட்டது.
