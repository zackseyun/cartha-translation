revisions:
- from: அவன் நெருக்கடியில் இருந்த காலத்திலும், யாவேக்கு எதிராகத் தொடர்ந்து[a] நம்பிக்கைத் துரோகம் செய்தான்—அவன்தான் ஆகாஸ் அரசன்.
  to: அவன் நெருக்கடியில் இருந்த காலத்தில், யாவேக்கு எதிராகத் துரோகம் செய்வதைத் தொடர்ந்தான்—அவனே அரசன் ஆகாஸ்.
  rationale: The revision removes the added concessive implication, uses idiomatic Tamil for the Hebrew idiom ‘added to act unfaithfully,’ and retains the verse’s emphatic closing identification. The footnote is retained and adjusted to match the revised wording.
