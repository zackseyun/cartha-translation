  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בְ/עֵת֙ הָצֵ֣ר ל֔/וֹ וַ/יּ֖וֹסֶף לִ/מְע֣וֹל בַּ/יהוָ֑ה ה֖וּא הַ/מֶּ֥לֶךְ אָחָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/022.yaml
  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
translation:
  language: ta
  text: அவன் நெருக்கடியில் இருந்த காலத்தில், யாவேக்கு எதிராகத் துரோகம் செய்வதைத் தொடர்ந்தான்—அவனே அரசன் ஆகாஸ்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְעֵת הָצֵר לוֹ
  choice: அவன் நெருக்கடியில் இருந்த காலத்திலும்
  rationale: இந்தத் தொடர் அவன் நெருக்குதலுக்கு உள்ளான காலத்தைச் சுட்டுகிறது. சூழலில் எதிர்மறை வலியுறுத்தல் இருப்பதால், ‘காலத்திலும்’ என்பது நெருக்கடி அவனை மாற்றவில்லை என்ற கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיּוֹסֶף
  choice: தொடர்ந்து
  rationale: יסף + வினையெச்சம் என்பது ஒரு செயலை மேலும் செய்வதை அல்லது தொடர்வதை குறிக்கும் எபிரெய மொழிவழக்கு. ‘தொடர்ந்து’ என்பது அதன் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לִמְעוֹל
  choice: நம்பிக்கைத் துரோகம் செய்தான்
  rationale: מעל என்பது நம்பிக்கையையும் உடன்படிக்கை சார்ந்த விசுவாசத்தையும் மீறுவதைக் குறிக்கிறது. ‘நம்பிக்கைத் துரோகம்’ அதன் ஒழுக்க மற்றும் இறைஉறவு சார்ந்த வலிமையைப் பாதுகாக்கிறது.
- source_word: בַּיהוָה
  choice: யாவேக்கு எதிராக
  rationale: מעל உடன் வரும் בְּ, துரோகம் யாருக்கு எதிராகச் செய்யப்பட்டது என்பதைச் சுட்டுகிறது. יהוה என்ற இறைப்பெயர் ஒலிப்பெயர்ப்பாக ‘யாவே’ என்று வழங்கப்படுகிறது.
- source_word: הוּא הַמֶּלֶךְ אָחָז
  choice: அவன்தான் ஆகாஸ் அரசன்
  rationale: தனித்த הוּא வலியுறுத்தலுடையது. ‘அவன்தான்’ என்பதும் முன் வரும் நீள்கோடும், இவ்வாறு நடந்தவன் அரசன் ஆகாஸே என்ற எபிரெய வலியுறுத்தலைக் காக்கின்றன.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான יהוה நேரடியாக உள்ளது. பட்டப்பெயராக மாற்றாமல், அதனை ‘யாவே’ என்று ஒலிப்பெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: מעל என்பதின் இறைஉறவு சார்ந்த பொருள்
  choice: யாவேக்கு எதிராக நம்பிக்கைத் துரோகம் செய்தான்
  alternative: யாவேக்கு எதிராகக் குற்றம் செய்தான்
  rationale: பொதுவான ‘குற்றம்’ என்பதைக் காட்டிலும், מעל குறிக்கும் விசுவாச மீறலையும் உறவுத் துரோகத்தையும் ‘நம்பிக்கைத் துரோகம்’ தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவன்தான்’ என்ற வடிவம் மூலத்தின் கடுமையான வலியுறுத்தலைப் பாதுகாக்கிறது.
