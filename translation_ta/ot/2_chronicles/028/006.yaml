source:
  edition: WLC
  text: וַ/יַּהֲרֹג֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ בִּֽ/יהוּדָ֗ה מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף בְּ/י֥וֹם אֶחָ֖ד הַ/כֹּ֣ל בְּנֵי חָ֑יִל בְּ/עָזְבָ֕/ם אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
translation:
  language: ta
  text: ரெமலியாவின் மகன் பெக்கா யூதாவில் ஒரே நாளில்[a] ஒரு இலட்சத்து இருபதாயிரம் பேரைக் கொன்றான். அவர்கள் அனைவரும் வீரமிக்க ஆண்கள்[b]; ஏனெனில் அவர்கள் தங்கள் மூதாதையரின் கடவுளாகிய யாவேயைக் கைவிட்டிருந்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு நாளில்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘வீரத்தின் மகன்கள்’; அதாவது, வீரமிக்க, போரிடும் திறனுள்ள ஆண்கள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘யாவேயைக் கைவிட்டபோது.’ எபிரெயச் சொற்றொடர் காரணத்தையோ காலச்சூழலையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: கொன்றான்
  rationale: הרג என்பதன் நேரடியான பொருள் ‘கொல்லுதல்.’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் இருப்பதால் ‘கொன்றான்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בִּיהוּדָה
  choice: யூதாவில்
  rationale: ב இங்கு நிகழ்வின் இடத்தைக் குறிக்கிறது; வரலாற்றுச் சூழலில் அரசையும் அதன் நிலப்பரப்பையும் குறிக்கும் பெயராக ‘யூதா’ பயன்படுத்தப்படுகிறது.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: ஒரு இலட்சத்து இருபதாயிரம்
  rationale: எபிரெய எண்ணிக்கையின் நேரடியான, தமிழில் வழக்கமான வடிவம்.
- source_word: בְּיוֹם אֶחָד
  choice: ஒரே நாளில்
  rationale: சொல்லர்த்தமாக ‘ஒரு நாளில்’; படுகொலையின் அளவை வலியுறுத்தும் இயல்பான தமிழ் வடிவம் ‘ஒரே நாளில்.’
- source_word: הַכֹּל
  choice: அவர்கள் அனைவரும்
  rationale: முன்னர் குறிப்பிடப்பட்ட கொல்லப்பட்டவர்களின் முழு எண்ணிக்கையையும் הַכֹּל தொகுத்துக் கூறுகிறது.
- source_word: בְּנֵי חָיִל
  choice: வீரமிக்க ஆண்கள்
  rationale: சொல்லர்த்தமாக ‘வலிமை/வீரத்தின் மகன்கள்’; திறனும் வீரமும் கொண்ட போரிடத்தக்க ஆண்களைக் குறிக்கும். ‘வீரமிக்க ஆண்கள்’ பாலினக் குறிப்பையும் பரந்த பொருளையும் காக்கிறது.
- source_word: בְּעָזְבָם
  choice: கைவிட்டதால்
  rationale: ב உடன் வரும் infinitive construct சூழ்நிலையையோ காரணத்தையோ குறிக்கலாம். இங்கு உடன்படிக்கை மீறலுக்கும் பேரழிவுக்கும் உள்ள காரணத் தொடர்பை ‘கைவிட்டதால்’ இயல்பாக வெளிப்படுத்துகிறது; காலப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக ‘யாவே’ தரப்படுகிறது.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: தங்கள் மூதாதையரின் கடவுள்
  rationale: உடன்படிக்கைச் சூழலிலுள்ள தலைமுறைத் தொடர்பை இயல்பான நவீனத் தமிழில் ‘மூதாதையரின் கடவுள்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: בְּעָזְבָם என்பதற்கும் படுகொலைக்கும் இடையிலான தொடர்பு
  choice: 'காரணப்பொருள்: ‘கைவிட்டதால்’'
  alternative: 'காலப்பொருள்: ‘கைவிட்டபோது’'
  rationale: இந்த எபிரெய அமைப்பு காரணம் அல்லது காலச்சூழல் ஆகிய இரண்டையும் குறிக்கக்கூடும். நாளாகம ஆசிரியரின் உடன்படிக்கை-நியாயத்தீர்ப்புச் சூழலில் காரணப்பொருள் பொருத்தமானது; எனினும் உண்மையான இலக்கண மாற்றுவாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் தெளிவான, கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. ‘ஒரு இலட்சத்து இருபதாயிரம்’ என்பது தமிழ் வாசகர்களுக்கு இயல்பான எண்ணிக்கை வடிவம். மூலத்தின் ஆண்பால் குறிப்பை ‘ஆண்கள்’ பாதுகாக்கிறது. காரணப்பொருள் முதன்மை உரையில் வைக்கப்பட்டாலும், இலக்கண ரீதியான காலப்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
