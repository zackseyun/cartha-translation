base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
translation:
  language: ta
  text: இப்போது எனக்குச் செவிகொடுங்கள். உங்கள் சகோதரர்களிடமிருந்து[a] நீங்கள் சிறைப்பிடித்தவர்களைத் திருப்பி அனுப்புங்கள்; ஏனெனில் யாவேயின் எரியும் கோபம் உங்கள்மேல் இருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் சக இஸ்ரவேலர்களிடமிருந்து.” எபிரெயத்தில் “உங்கள் சகோதரர்களிடமிருந்து” என்று உள்ளது; ஒரே உடன்படிக்கை மக்களைச் சேர்ந்தவர்களை உறவுமுறைச் சொல்லால் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: அவசரமான அறிவுறுத்தலுக்கான மாற்றத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; தொடக்க இணைப்புச் சொல்லைத் தனியே மொழிபெயர்க்க வேண்டிய அவசியமில்லை.
- source_word: שְׁמָעוּנִי
  choice: எனக்குச் செவிகொடுங்கள்
  rationale: שׁמע என்பதன் கட்டளை வடிவம் வெறுமனே ஒலியைக் கேட்பதை அல்ல, கவனித்துக் கீழ்ப்படிவதற்குரிய செவிமடுத்தலைக் கோருகிறது.
- source_word: וְהָשִׁיבוּ
  choice: திருப்பி அனுப்புங்கள்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் ‘திரும்பும்படி செய்யுங்கள்’ என்று பொருள்படுகிறது; சிறைப்பிடிக்கப்பட்ட மக்களை அவர்களுடைய இடத்திற்குத் திரும்ப அனுப்புவதைக் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַשִּׁבְיָה אֲשֶׁר שְׁבִיתֶם
  choice: நீங்கள் சிறைப்பிடித்தவர்களை
  rationale: הַשִּׁבְיָה என்பது இங்கு சிறைப்பிடிக்கப்பட்ட மக்கள் கூட்டத்தைக் குறிக்கிறது. தமிழில் நபர்களை நேரடியாகக் குறிப்பிடுவது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מֵאֲחֵיכֶם
  choice: உங்கள் சகோதரர்களிடமிருந்து
  rationale: மூலத்தின் உறவுமுறைச் சொல்லான אָח என்பதைக் காக்கிறது; உடன்படிக்கை மக்களாகிய சக இஸ்ரவேலர்களைக் குறிக்கும் விரிவான பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חֲרוֹן אַף
  choice: எரியும் கோபம்
  rationale: எபிரெயச் சொற்றொடரிலுள்ள வெம்மை அல்லது எரிதல் உருவகத்தையும் கோபத்தின் தீவிரத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: பட்டத்தைப் பதிலாக வைக்காமல், எபிரெய வேதத்தில் நேரடியாக இடம்பெறும் இறைபெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עֲלֵיכֶם
  choice: உங்கள்மேல் இருக்கிறது
  rationale: கோபம் அவர்கள்மீது இருப்பதாகக் கூறும் על என்ற முன்னிடைச்சொல்லின் உருவகத்தை நெருக்கமாகக் காக்கிறது; ‘உங்களுக்கு எதிராக’ என்று விளக்கமாக வலுப்படுத்தவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் நான்கெழுத்து இறைபெயர் நேரடியாக உள்ளது. எனவே ஒரு பட்டத்தை மாற்றீடாக இடாமல் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒலிபெயர்க்கிறது.
- issue: ‘சகோதரர்கள்’ என்பதன் சமூகப் பரப்பு
  choice: மூலத்தின் உறவுமுறை மொழியை முதன்மை உரையில் வைத்தல்
  alternative: சக இஸ்ரவேலர்கள்
  rationale: אָחִים என்ற சொல் சொற்படியாக ‘சகோதரர்கள்’ என்றாலும், இச்சூழலில் அதே உடன்படிக்கை மக்களைச் சேர்ந்தவர்களைக் குறிக்கலாம். இந்த விரிவான பொருளை முதன்மை உரையில் தீர்மானமாகப் பதியாமல் அடிக்குறிப்பில் விளக்குவது மூலத்தின் மொழியையும் பொருட்பரப்பையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் தீர்க்கதரிசன எச்சரிக்கையின் தீவிரமும் காக்கப்பட்டுள்ளன. ‘செவிகொடுங்கள்,’ ‘திருப்பி அனுப்புங்கள்’ ஆகியவை இயல்பான கட்டளை வடிவங்கள்; ‘எரியும் கோபம்’ மூல உருவகத்தைத் தெளிவாக வைத்திருக்கிறது.
