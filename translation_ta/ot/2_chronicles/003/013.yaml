- from: இந்தக் கேருபீன்களின் இறக்கைகள் இருபது முழம் விரிந்திருந்தன; அவை தங்கள் கால்களின்மேல் நின்றன; அவற்றின் முகங்கள் ஆலயத்தை நோக்கியிருந்தன.[a]
  to: இந்தக் கேருபீன்களின் இறக்கைகள் இருபது முழம் விரிந்திருந்தன; கேருபீன்கள் தங்கள் கால்களின்மேல் நின்றனர்; அவர்களுடைய முகங்கள் ஆலயத்தை நோக்கியிருந்தன.[a]
