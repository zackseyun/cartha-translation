source:
  edition: WLC
  text: כַּנְפֵי֙ הַ/כְּרוּבִ֣ים הָ/אֵ֔לֶּה פֹּֽרְשִׂ֖ים אַמּ֣וֹת עֶשְׂרִ֑ים וְ/הֵ֛ם עֹמְדִ֥ים עַל רַגְלֵי/הֶ֖ם וּ/פְנֵי/הֶ֥ם לַ/בָּֽיִת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/013.yaml
  text: The wings of these cherubim spread twenty cubits[a], and they stood on their feet, with their faces toward the house.
translation:
  language: ta
  text: இந்தக் கேருபீன்களின் இறக்கைகள் இருபது முழம் விரிந்திருந்தன; கேருபீன்கள் தங்கள் கால்களின்மேல் நின்றனர்; அவர்களுடைய முகங்கள் ஆலயத்தை நோக்கியிருந்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “வீட்டை நோக்கி”; இங்கு “வீடு” என்பது ஆலயக் கட்டடத்தைக் குறிக்கும் வழக்கமான பெயர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּנְפֵי הַכְּרוּבִים הָאֵלֶּה
  choice: இந்தக் கேருபீன்களின் இறக்கைகள்
  rationale: எபிரேயக் கட்டமைப்பிலுள்ள உடைமைத் தொடர்பையும் ‘இந்த’ என்ற சுட்டுச் சொல்லின் வலியுறுத்தலையும் காக்கிறது. ‘கேருபீன்கள்’ என்பது வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பன்மைப் பெயர்.
- source_word: פֹּרְשִׂים
  choice: விரிந்திருந்தன
  rationale: இறக்கைகளின் தொடர்ந்த நிலை அல்லது அமைப்பைச் சுட்டும் வினையெச்சத்தின் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: இருபது முழம்
  rationale: மூலத்தின் அளவீட்டை அப்படியே வைத்திருக்கிறது; மூலத்தில் இல்லாத ‘அகலம்’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: וְהֵם עֹמְדִים עַל רַגְלֵיהֶם
  choice: அவை தங்கள் கால்களின்மேல் நின்றன
  rationale: இறக்கைகளிலிருந்து கேருபீன் உருவங்களுக்குத் திரும்பும் எபிரேயப் பன்மைப் பிரதிப்பெயரைத் தெளிவாகக் காட்டுகிறது; அவை நிமிர்ந்து நின்ற நிலையையும் காக்கிறது.
- source_word: וּפְנֵיהֶם לַבָּיִת
  choice: அவற்றின் முகங்கள் ஆலயத்தை நோக்கியிருந்தன
  rationale: בַּיִת என்பதன் சொற்பொருள் ‘வீடு’ என்றாலும், இவ்வாலயக் கட்டுமானச் சூழலில் அது ஆலயக் கட்டடத்தையே குறிக்கிறது; ‘ஆலயம்’ என்பது சாதாரண தமிழ் வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: ஆலயக் கட்டுமானச் சூழலில் בַּיִת என்பதன் மொழிபெயர்ப்பு
  choice: ஆலயம்
  alternative: வீடு
  rationale: எபிரேயத்தில் ‘வீடு’ என்ற பொதுச்சொல் ஆலயத்தைக் குறிக்கும் வழக்குப் பெயராகப் பயன்படுத்தப்பட்டுள்ளது. தமிழில் ‘வீடு’ என்று மட்டும் சொல்வது இச்சூழலில் தெளிவைக் குறைக்கக்கூடும்; ஆகவே குறிப்பிட்ட பொருளை முதன்மை உரையில் தருவதோடு சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்கவும் எளிதில் புரிந்துகொள்ளத்தக்கவுமான நடை. உயிரற்ற சிற்ப உருவங்களுக்கு இயல்பான ‘அவை/அவற்றின்’ பயன்படுத்தப்பட்டுள்ளது. இணை விளக்கக் கூறுகளின் ஒழுங்கை அரைப்புள்ளிகள் காக்கின்றன.
