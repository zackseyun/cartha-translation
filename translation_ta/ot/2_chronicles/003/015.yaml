base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/015.yaml
  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
translation:
  language: ta
  text: அவர் ஆலயத்தின் முன்பாக முப்பத்தைந்து முழம் நீளமுள்ள[b] இரண்டு தூண்களைச் செய்தார். ஒவ்வொரு தூணின்[a] உச்சியிலிருந்த மகுடம் ஐந்து முழம் அளவுடையதாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அதன் உச்சியில்” என்று ஒருமையில் உள்ளது. அந்த ஒருமை விகுதி இரண்டு தூண்களில் ஒவ்வொன்றையும் தனித்தனியாகக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய உரை எழுத்துப்படியாக, “முப்பத்தைந்து முழம் நீளம்” என்கிறது. 1 இராஜாக்கள் 7:15-ல் ஒவ்வொரு தூணின் உயரமும் பதினெட்டு முழம் எனக் கொடுக்கப்பட்டுள்ளது. எனவே, நாளாகமம் இரு தூண்களின் கூட்டிய உயரத்தைக் கூறுவதாகச் சிலர் புரிந்துகொள்கிறார்கள்; வேறு சிலர் இங்கு உரைச்சிக்கல் இருப்பதாகக் கருதுகிறார்கள்.
    reason: cross_reference
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  choice: ஆலயத்தின் முன்பாக
  rationale: לִפְנֵי என்பது ‘முன்பாக’ என்ற இடத்தைக் குறிக்கிறது. இங்கு הַבַּיִת ஆலயக் கட்டடத்தைக் குறிப்பதால், நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் ‘ஆலயம்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: עַמּוּדִים שְׁנַיִם
  choice: இரண்டு தூண்கள்
  rationale: עַמּוּדִים என்பது இச்சூழலில் கட்டடத் தூண்களைக் குறிக்கிறது; ‘தூண்கள்’ என்பது பொதுவாகப் புரியும் இயல்பான தமிழ் சொல்.
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  choice: முப்பத்தைந்து முழம் உயரமுள்ள
  rationale: எபிரெயச் சொற்றொடர் எழுத்துப்படியாக ‘முப்பத்தைந்து முழம் நீளம்’ என்கிறது. நிறுத்தப்பட்ட தூண்களைப் பற்றிய கட்டடச் சூழலில் அந்த அளவு அவற்றின் உயரத்தைக் குறிப்பதால் முதன்மை உரையில் ‘உயரம்’ பயன்படுத்தப்பட்டது; ‘நீளம்’ என்ற மூலச் சொல்லும் இணைவசனத்தால் எழும் சிக்கலும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: הַצֶּפֶת
  choice: மகுடம்
  rationale: இச்சொல் தூணின் உச்சியிலுள்ள அலங்கார மேற்பகுதியைக் குறிக்கிறது. கட்டடக்கலைச் சொல்லாக ‘மகுடம்’ துல்லியமாகவும் வாசகர்களுக்குப் புரியத்தக்கதாகவும் உள்ளது.
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  choice: ஒவ்வொரு தூணின் உச்சியிலிருந்த
  rationale: רֹאשׁ என்பதன் அடிப்படைப் பொருள் ‘தலை’; உயிரற்ற தூணைப் பற்றிய தமிழில் ‘உச்சி’ இயல்பானது. எபிரெயத்தில் ஒருமை விகுதி இருந்தாலும், இரண்டு தூண்களில் ஒவ்வொன்றையும் பகிர்வுறக் குறிப்பதாகப் பொருள் கொள்ளப்பட்டு ‘ஒவ்வொரு தூணின்’ என மொழிபெயர்க்கப்பட்டது; மூலத்தின் ஒருமை வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
- source_word: אַמּוֹת חָמֵשׁ
  choice: ஐந்து முழ அளவுடையதாக
  rationale: அளவின் திசையை எபிரெய உரை வெளிப்படையாகக் குறிப்பிடவில்லை. ஆகவே ‘உயரம்’ அல்லது ‘அகலம்’ என்று கூட்டாமல், பழங்கால அளவான ‘முழம்’ அப்படியே வைக்கப்பட்டு பொதுவாக ‘அளவுடையதாக’ என வழங்கப்பட்டது.
