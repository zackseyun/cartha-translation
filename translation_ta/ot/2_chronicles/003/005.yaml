base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/005.yaml
  text: He paneled the great house with cypress wood[a], overlaid it with fine gold[b], and put palm trees and chains on it.
translation:
  language: ta
  text: அவர் பெரிய மண்டபத்தைச் சைப்பிரஸ் மரத்தால்[a] மூடி, அதன்மேல் உயர்தரத் தங்கத்தைப் பதித்து, அதில் பேரீச்சமரங்களையும் சங்கிலிகளையும்[b] அமைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரெய மரப்பெயரின் துல்லியமான அடையாளம் விவாதத்திற்குரியது; இதை ‘ஜூனிப்பர்’ அல்லது ‘ஃபர்’ மரம் என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘பேரீச்சமரங்களையும் சங்கிலிகளையும்’; இவை மண்டபத்தில் அமைக்கப்பட்ட அலங்கார வடிவங்களையோ வேலைப்பாடுகளையோ குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  choice: பெரிய மண்டபம்
  rationale: בַּיִת என்பதன் நேரடிப் பொருள் ‘வீடு’; ஆலயக் கட்டுமானச் சூழலில் இது முதன்மையான பெரிய அறையையோ மண்டபத்தையோ குறிக்கிறது. இயல்பான நவீனத் தமிழில் கட்டடச் சூழலைத் தெளிவாகச் சொல்ல ‘பெரிய மண்டபம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חִפָּה עֵץ בְּרוֹשִׁים
  choice: தேவதாரு மரப்பலகைகளால் மூடி
  rationale: חפה என்பது மூடுதல் அல்லது மேல்பூச்சிடுதலைக் குறிக்கிறது. இங்கு மரம் பொருளாக இருப்பதால், சுவர்களை மரப்பலகைகளால் மூடிய கட்டுமானச் செயலை ‘மரப்பலகைகளால் மூடி’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֵץ בְּרוֹשִׁים
  choice: தேவதாரு மரம்
  rationale: בְּרוֹשׁ என்ற மரத்தின் துல்லியமான இன அடையாளம் விவாதத்திற்குரியது; சைப்பிரஸ், ஜூனிப்பர், ஃபர் போன்ற அடையாளங்கள் முன்வைக்கப்படுகின்றன. தமிழில் வேதாகம மற்றும் கட்டுமானப் பயன்பாட்டில் அறிமுகமான ‘தேவதாரு’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיְחַפֵּהוּ זָהָב טוֹב
  choice: அதன்மேல் தரமான தங்கத்தைப் பதித்து
  rationale: மீண்டும் வரும் חפה இங்கு தங்கத்தால் மேல்பூச்சிடுவதைக் குறிக்கிறது. זָהָב טוֹב என்பது நேரடியாக ‘நல்ல தங்கம்’; நவீனத் தமிழில் அதன் உயர்தரத் தன்மையை ‘தரமான தங்கம்’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: תִּמֹרִים
  choice: பேரீச்சமர வடிவங்கள்
  rationale: இந்த அலங்காரச் சூழலில் சொல் உண்மையான மரங்களைவிட பேரீச்சமர உருவ அலங்காரங்களைக் குறிக்கிறது. ‘வடிவங்கள்’ என்பது சூழலில் மறைமுகமாக உள்ள பொருளைத் தெளிவுபடுத்துகிறது.
- source_word: שַׁרְשְׁרוֹת
  choice: சங்கிலிகள்
  rationale: இந்தப் பெயர்ச்சொல் சங்கிலிகளையோ சங்கிலி போன்ற அலங்கார வேலைப்பாட்டையோ குறிக்கலாம். நேரடியான ‘சங்கிலிகள்’ தேர்வு செய்யப்பட்டு, அலங்காரச் சூழல் அடிக்குறிப்பில் விளக்கப்படுகிறது.
