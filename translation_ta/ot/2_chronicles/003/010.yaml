base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/010.yaml
  text: In the Most Holy Place he made two cherubim[a], the work of an image-maker[b], and overlaid them with gold.
translation:
  language: ta
  text: மிகப் பரிசுத்தமான இடத்தில் அவர் சிற்ப வேலைப்பாடாகிய இரண்டு கேருபீன்களைச் செய்தார்; அவற்றைத் தங்கத்தால் மேல்மூடினார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: எபிரெய மூலத்தில் இங்குள்ள வினை பன்மையில், “மேல்மூடினார்கள்” என்று உள்ளது. சில மொழிபெயர்ப்புகள் இதை ஒருமையில், “அவர் மேல்மூடினார்” என்று வழங்குகின்றன.
    reason: source_grammar
lexical_decisions:
- source_word: בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்த இடத்தில்
  rationale: எபிரெயச் சொற்றொடர் உள் திருத்தலத்தின் மிகப் பரிசுத்தமான பகுதியைக் குறிக்கும் உயர்நிலைச் சொல்லாட்சி. தமிழில் தெளிவாகவும் வழிபாட்டுக் கட்டிடச் சூழலுக்கு ஏற்றவாறும் இதை வழங்குகிறது.
- source_word: כְּרוּבִים שְׁנַיִם
  choice: இரண்டு கேருபீன்களை
  rationale: கேருபீன்கள் என்பது எபிரெயப் பன்மை வடிவத்தையும் திருத்தலச் சூழலில் உள்ள வானுலக உருவங்களையும் அடையாளப்படுத்தும் நிலைபெற்ற தமிழ் வேதாகமச் சொல்.
- source_word: מַעֲשֵׂה צַעֲצֻעִים
  choice: சிற்ப வேலைப்பாடாக
  rationale: மிக அரிதான צַעֲצֻעִים என்ற சொல் கலைஞனைவிட உருவாக்கப்பட்ட சிற்பப் பணியின் வகையைச் சுட்டுவது சூழலுக்கு ஏற்றது. அதன் உறுதியற்ற தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיְצַפּוּ אֹתָם זָהָב
  choice: அவற்றின்மேல் தங்கத் தகடு பதித்தார்கள்
  rationale: צפה என்ற வினை உலோகத்தால் மேற்பூச்சு இடுதல் அல்லது தகடு பதித்தலைக் குறிக்கிறது. எபிரெய மூலத்தில் வினை பன்மையில் இருப்பதையும் தமிழ் மொழிபெயர்ப்பு வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதையும் வேதாகமக் கட்டிடச் சூழலுக்குரிய செறிவும் காக்கப்பட்டுள்ளன. அரிதான கைவினைச் சொல்லின் பொருள் பிரதான உரையில் இயல்பாகத் தரப்பட்டு, அதன் உண்மையான நிச்சயமின்மை அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
