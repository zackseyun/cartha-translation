- from: கேருபீன்களின் இறக்கைகளுடைய மொத்த நீளம் இருபது முழம். ஒரு இறக்கை ஐந்து முழம் நீண்டு ஆலயத்தின் சுவரைத் தொட்டது[a]; மற்ற இறக்கையும் ஐந்து முழம் நீண்டு மற்ற கேருபின் இறக்கையைத் தொட்டது.
