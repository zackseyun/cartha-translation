  text: וְ/כַנְפֵי֙ הַ/כְּרוּבִ֔ים אָרְכָּ֖/ם אַמּ֣וֹת עֶשְׂרִ֑ים כְּנַ֨ף הָ/אֶחָ֜ד לְ/אַמּ֣וֹת חָמֵ֗שׁ מַגַּ֨עַת֙ לְ/קִ֣יר הַ/בַּ֔יִת וְ/הַ/כָּנָ֤ף הָ/אַחֶ֨רֶת֙ אַמּ֣וֹת חָמֵ֔שׁ מַגִּ֕יעַ לִ/כְנַ֖ף הַ/כְּר֥וּב הָ/אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/011.yaml
  text: 'The wings of the cherubim were twenty cubits long: one wing was five cubits[a], reaching to the wall of the house, and the other wing was five cubits[b], reaching to the wing of the other cherub.'
translation:
  language: ta
  text: கேரூபீன்களின் இறக்கைகளின் மொத்த நீளம் இருபது முழம். ஒரு இறக்கை ஐந்து முழம் நீண்டு ஆலயத்தின் சுவரைத் தொட்டது[a]; மற்ற இறக்கையும் ஐந்து முழம் நீண்டு மற்ற கேரூபின் இறக்கையைத் தொட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தொட்டது” என்பதற்குப் பதிலாக “எட்டியது” என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பங்கேற்புவினைகள் ஓர் இடம்வரை நீண்டதையோ அதனுடன் நேரடியாகத் தொடர்புற்றதையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַנְפֵי הַכְּרוּבִים
  choice: கேருபீன்களின் இறக்கைகள்
  rationale: எபிரெயச் சொல்லின் பன்மையையும் வானுலக உயிர்களைக் குறிக்கும் மரபான ஒலிபெயர்ப்பையும் தக்கவைக்கிறது. தொடக்க இணைப்புச்சொல் இயல்பான தமிழ் நடைக்காக வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: אָרְכָּם אַמּוֹת עֶשְׂרִים
  choice: இறக்கைகளுடைய மொத்த நீளம் இருபது முழம்
  rationale: ‘அவற்றின் நீளம் இருபது முழம்’ என்ற வடிவத்தைச் சூழலுக்கேற்ப தெளிவுபடுத்துகிறது; அடுத்ததாக ஒவ்வொரு இறக்கையும் ஐந்து முழம் எனக் கூறப்படுவதால், இரு கேருபீன்களின் விரிந்த இறக்கைகளின் மொத்த அளவு குறிக்கப்படுகிறது.
- source_word: אַמּוֹת
  choice: முழம்
  rationale: பண்டைய அளவீட்டுச் சொல்லை நவீன அலகாக மாற்றாமல், தமிழில் வழக்கமான வேதாகம அளவுப்பெயராக வழங்குகிறது.
- source_word: מַגַּעַת / מַגִּיעַ
  choice: தொட்டது
  rationale: נגע என்பதன் அடிப்படைத் தொடர்பு/தொடுதல் பொருளை வெளிப்படுத்துகிறது; கட்டட அமைப்பில் ‘எட்டியது’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: לְקִיר הַבַּיִת
  choice: ஆலயத்தின் சுவரை
  rationale: בַּיִת என்பதன் சொற்பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் அது ஆலயக் கட்டடத்தையே குறிப்பதால் நவீன வாசகருக்குத் தெளிவாக ‘ஆலயம்’ என வழங்கப்படுகிறது.
- source_word: לִכְנַף הַכְּרוּב הָאַחֵר
  choice: மற்ற கேருபின் இறக்கையை
  rationale: ‘மற்ற’ என்ற எபிரெயச் சொல்லின் வேறுபாட்டைக் காத்து, ஒருமையான ‘கேருபு’ என்பதையும் பிரதிபலிக்கிறது.
