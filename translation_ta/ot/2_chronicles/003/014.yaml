source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ֙ אֶת הַ/פָּרֹ֔כֶת תְּכֵ֥לֶת וְ/אַרְגָּמָ֖ן וְ/כַרְמִ֣יל וּ/ב֑וּץ וַ/יַּ֥עַל עָלָ֖י/ו כְּרוּבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
translation:
  language: ta
  text: அவர் நீல, ஊதா, கருஞ்சிவப்பு நிற நூல்களாலும் நுண்ணிய ஆளிநார்த் துணியாலும் திரைச்சீலையை[a] செய்து, அதன்மேல் கேருபீன்களை அமைத்தார்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மறைப்புத்திரை.’
    reason: lexical_alternative
  - marker: c
    text: சொல்லாட்சிப்படி, ‘அதன்மேல் கேருபீன்களை ஏறச்செய்தார்’; அதாவது, கேருபீன் உருவங்களால் அதை அலங்கரித்தார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: திரைச்சீலை
  rationale: பரிசுத்த இடத்தின் உட்பகுதியைப் பிரிக்கும் தொங்குதிரையை இச்சொல் குறிக்கிறது. நவீன தமிழில் ‘திரைச்சீலை’ இயல்பாகவும் தெளிவாகவும் உள்ளது; ‘மறைப்புத்திரை’ என்பது மாற்று மொழிபெயர்ப்பு.
- source_word: תְּכֵלֶת
  choice: நீலநிற நூல்
  rationale: நீலம் அல்லது நீல-ஊதா சாயம் ஏற்றப்பட்ட விலையுயர்ந்த நூல் அல்லது துணிப்பொருளைக் குறிக்கிறது; இங்கு மற்ற நெசவுப் பொருட்களோடு வருவதால் ‘நூல்’ என்று வெளிப்படுத்தப்பட்டது.
- source_word: אַרְגָּמָן
  choice: ஊதாநிற நூல்
  rationale: மதிப்புமிக்க ஊதாச் சாயம் ஏற்றப்பட்ட நெசவுப் பொருளைக் குறிக்கும் வழக்கமான பொருள்.
- source_word: כַרְמִיל
  choice: கருஞ்சிவப்பு நிற நூல்
  rationale: ஆழமான சிவப்புச் சாயம் கொண்ட பொருளைக் குறிக்கிறது. ‘செந்நிறம்’ என்பதும் சாத்தியமான மாற்று என்பதால் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: בּוּץ
  choice: மெல்லிய சணல் நூல்
  rationale: பொதுவான துணியை அல்ல, நுண்மையும் உயர்தரமும் கொண்ட சணல் நார்த் துணிப்பொருளைக் குறிக்கிறது.
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  choice: அதன்மேல் கேருபீன்களின் உருவங்களைப் பதித்தார்
  rationale: சொல்லாட்சிப்படி ‘அதன்மேல் கேருபீன்களை ஏறச்செய்தார்’ என்று இருந்தாலும், சூழலில் திரைச்சீலையில் கேருபீன் உருவங்களை அலங்காரமாக அமைத்ததைக் குறிக்கிறது. ‘பதித்தார்’ என்பது நெசவு அல்லது தையல் போன்ற குறிப்பிட்ட தொழில்நுட்பத்தைத் தேவையின்றி நிர்ணயிக்காமல் பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: כְּרוּבִים
  choice: கேருபீன்கள்
  rationale: ஆலயம் மற்றும் திருவாசஸ்தலச் சூழலில் வரும் தனித்துவமான விண்ணுலக உயிரினங்களுக்கான மரபான வேதாகமப் பெயரைப் பாதுகாக்கிறது.
