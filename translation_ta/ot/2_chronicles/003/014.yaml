translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. நெசவுப் பொருட்களின் பட்டியல் தமிழில் இயல்பாக அமைய ‘நூல்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது. செய்முறை நெசவா, பூவேலையா என்பது எபிரெய உரையில் தெளிவாக இல்லாததால் ‘பதித்தார்’ எனப் பொதுவாக மொழிபெயர்க்கப்பட்டது.
