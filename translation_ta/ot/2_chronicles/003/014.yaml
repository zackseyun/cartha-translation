revisions:
- from: அவர் நீலநிற, ஊதாநிற, கருஞ்சிவப்பு நிற[b] நூல்களையும் மெல்லிய சணல் நூலையும் கொண்டு திரைச்சீலையை[a] செய்து, அதன்மேல் கேருபீன்களின் உருவங்களைப் பதித்தார்[c].
  to: அவர் நீல, ஊதா, கருஞ்சிவப்பு நிற நூல்களாலும் நுண்ணிய ஆளிநார்த் துணியாலும் திரைச்சீலையை[a] செய்து, அதன்மேல் கேருபீன்களை அமைத்தார்[c].
  rationale: The sole substantive correction replaces ‘சணல்’ (jute) with ‘ஆளிநார்’ (flax) so that the textile remains fine linen. The color-list phrasing is streamlined for modern Tamil. ‘கேருபீன்களை அமைத்தார்’ retains the source’s general decorative sense without specifying embroidery or another production technique. Footnote b is retained as an anchored lexical alternative for ‘கருஞ்சிவப்பு,’ and its anchor is placed after that term.
