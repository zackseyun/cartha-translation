  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயின் சுருக்கமான தேதிக் குறிப்பிலுள்ள தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
