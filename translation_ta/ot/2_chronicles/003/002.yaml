  text: וַ֠/יָּחֶל לִ/בְנ֞וֹת בַּ/חֹ֤דֶשׁ הַ/שֵּׁנִי֙ בַּ/שֵּׁנִ֔י בִּ/שְׁנַ֥ת אַרְבַּ֖ע לְ/מַלְכוּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/002.yaml
  text: He began to build in the second month[a], on the second day, in the fourth year of his reign.
translation:
  language: ta
  text: அவன் தனது ஆட்சியின் நான்காம் ஆண்டில், இரண்டாம் மாதத்தின் இரண்டாம் நாளில்[a] கட்டத் தொடங்கினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், “இரண்டாம் மாதத்தில், இரண்டாமதில்”; இறுதிச் சொற்றொடர் பொதுவாக “இரண்டாம் நாளில்” என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: தொடங்கினான்
  rationale: ஹிஃபில் வடிவில் வரும் இந்த வினை, செயல் தொடங்கியதைக் குறிக்கிறது. தொடர்கதை இணைப்பைத் தமிழில் தனியாகச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: לִבְנוֹת
  choice: கட்ட
  rationale: בנה என்பதன் infinitive construct; கட்டடம் எழுப்புவதற்கான நேரடியான, இயல்பான தமிழ் வினை.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: இரண்டாம் மாதத்தின்
  rationale: வேலை தொடங்கிய மாதத்தைக் குறிக்கும் காலச்சொற்றொடர்; அடுத்துள்ள நாளுடன் இயல்பாக இணைக்கப்பட்டது.
- source_word: בַּשֵּׁנִי
  choice: இரண்டாம் நாளில்
  rationale: எபிரெயில் மீண்டும் வரும் வரிசை எண் சுருக்கமாக உள்ளது; சூழலின்படி அது மாதத்தின் இரண்டாம் நாளைக் குறிப்பதாகத் தமிழில் வெளிப்படுத்தப்பட்டது.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: நான்காம் ஆண்டில்
  rationale: அரசாட்சிக் காலத்தைக் கணக்கிடும் வழக்கமான காலக்குறிப்பு.
- source_word: לְמַלְכוּתוֹ
  choice: தனது ஆட்சியின்
  rationale: அரசனுடைய ஆட்சிக்காலமே காலக்கணக்கின் அடிப்படை; ‘ஆட்சி’ என்பது நவீனத் தமிழில் இயல்பான சொல்.
