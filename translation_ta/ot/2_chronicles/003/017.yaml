  text: וַ/יָּ֤קֶם אֶת הָֽ/עַמּוּדִים֙ עַל פְּנֵ֣י הַ/הֵיכָ֔ל אֶחָ֥ד מִ/יָּמִ֖ין וְ/אֶחָ֣ד מֵֽ/הַ/שְּׂמֹ֑אול וַ/יִּקְרָ֤א שֵׁם ה/ימיני יָכִ֔ין וְ/שֵׁ֥ם הַ/שְּׂמָאלִ֖י בֹּֽעַז־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
translation:
  language: ta
  text: அவர் ஆலய மண்டபத்தின்[a] முன்பாகத் தூண்களை நிறுவினார்; ஒன்று வலப்புறத்திலும் மற்றொன்று இடப்புறத்திலும் இருந்தது. வலப்புறத் தூணுக்கு யாக்கீன் என்றும், இடப்புறத் தூணுக்குப் போவாஸ் என்றும் பெயரிட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆலயத்தின் பிரதான மண்டபம்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரேயச் சொல் ஹேகால், ஆலய வளாகம் முழுவதையும் அல்ல, ஆலயக் கட்டடத்தின் பிரதான மண்டபத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: நிறுவினார்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு தூண்களை அவற்றின் இடத்தில் நிற்கச் செய்ததைக் குறிக்கிறது. ‘நிறுவினார்’ என்பது கட்டுமானச் சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: הָעַמּוּדִים
  choice: தூண்களை
  rationale: עַמּוּדִים என்பது கட்டடத் தூண்களைக் குறிக்கிறது; நவீனத் தமிழில் ‘தூண்கள்’ தெளிவாகவும் வழக்கமாகவும் உள்ளது.
- source_word: עַל־פְּנֵי הַהֵיכָל
  choice: ஆலய மண்டபத்தின் முன்பாக
  rationale: הֵיכָל இங்கு ஆலய வளாகம் முழுவதையும் அல்ல, ஆலயக் கட்டடத்தின் பிரதான மண்டபத்தைக் குறிக்கிறது. עַל־פְּנֵי என்பதன் இடவியல் பொருளை ‘முன்பாக’ தக்கவைக்கிறது.
- source_word: אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול
  choice: ஒன்றை வலப்புறத்திலும் மற்றொன்றை இடப்புறத்திலும்
  rationale: எபிரெய உரை திசைக்குறிப்புகளை வெளிப்படையாகச் சொல்லாமல் வலம், இடம் என்றே கூறுகிறது; தமிழிலும் அந்த மறைபொருள் தீர்மானிக்கப்படாமல் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּקְרָא שֵׁם
  choice: பெயரிட்டார்
  rationale: ‘பெயரை அழைத்தார்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் வடிவம் ‘பெயரிட்டார்’.
- source_word: הַיְמִינִי
  choice: வலப்புறத் தூணுக்கு
  rationale: பெயரிடப்படுவது தூண் என்பதைத் தமிழில் வெளிப்படையாகச் சொல்வது தெளிவையும் இணை அமைப்பையும் தருகிறது.
- source_word: יָכִין
  choice: யாகீன்
  rationale: எபிரெய ஒலிப்பான Yāḵîn-ஐ அண்மையாகத் தமிழில் எழுத்துப்பெயர்க்கிறது; இறுதி நீண்ட உயிரையும் மெய்யையும் பிரதிபலிக்கிறது.
- source_word: הַשְּׂמָאלִי
  choice: இடப்புறத் தூணுக்கு
  rationale: முன்னைய வலப்புறத் தூண் என்ற அமைப்புக்கு இணையாகவும் தெளிவாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֹּעַז
  choice: போவாஸ்
  rationale: எபிரெய Bōʿaz என்ற பெயரைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது; நடுவிலுள்ள குரல்வளை மெய்க்கு நேரான வழக்கமான தமிழ் குறியீடு இல்லாததால் இயல்பான ‘வா’ இணைப்பு பயன்படுத்தப்படுகிறது.
