  source_fidelity: 'பொருள் பெரும்பாலும் மூல எபிரெய உரைக்கு உண்மையாக உள்ளது: தூண்கள் ஆலய மண்டபத்தின் முன்பாக அமைக்கப்பட்டதும், வலது/இடது என்ற தொடர்புநிலை காக்கப்பட்டதும், இரு பெயர்களும் சரியாகத் தரப்பட்டதும் தெளிவாக உள்ளன. ஆனால் முதல் வாக்கியத்தில் ‘நிறுவினார்’ இருமுறை வருவது மூலத்தில் உள்ள ஒரே செயலைத் தேவையின்றி மீளுரைப்பதாக உள்ளது. யָכִין பெயரில் உள்ள /k/ ஒலி ‘யாகீன்’ என்பதில் விடுபடுகிறது.'
