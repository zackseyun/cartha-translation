  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் வலம்–இடம் என்ற இடவியல் மொழி திசைகளாக விளக்கப்படவில்லை. தூண்களின் பெயர்கள் மூல எபிரெய ஒலிக்கு அண்மையாக எழுத்துப்பெயர்க்கப்பட்டுள்ளன.
