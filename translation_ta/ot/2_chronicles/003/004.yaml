base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
translation:
  language: ta
  text: ஆலயத்தின் முன்புறத்தில் இருந்த முகமண்டபம், ஆலயத்தின் அகலத்துக்கு இணையாக இருபது முழம் நீளமாயிருந்தது. அதன் உயரம் நூற்றிருபது முழம்[a]. அதன் உட்புறத்தைத் தூய தங்கத்தால் அவன் மூடினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: முகமண்டபத்தின் உயரம் “நூற்றிருபது” முழம் என்று எபிரெய உரை கூறுகிறது. இணையான விவரிப்பான 1 இராஜாக்கள் 6:3 முகமண்டபத்தின் நீளத்தையும் அகலத்தையும் குறிப்பிடுகிறது; ஆனால் இந்த உயரத்தைக் குறிப்பிடவில்லை. ஆகவே இங்கு மூல உரையில் சிக்கல் இருக்கலாம் என்று சிலர் கருதுகின்றனர். இந்த மொழிபெயர்ப்பு பாதுகாக்கப்பட்டுள்ள மசோரெட்டிக் உரையைப் பின்பற்றுகிறது.
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  choice: முகமண்டபம்
  rationale: ஆலயத்தின் பிரதான கட்டடத்துக்கு முன்னால் அமைந்த நுழைவு மண்டபத்தை குறிக்கும் இயல்பான, கட்டடக்கலைச் சூழலுக்கு ஏற்ற தமிழ் சொல்.
- source_word: אֲשֶׁר עַל־פְּנֵי
  choice: முன்புறத்தில் இருந்த
  rationale: கட்டடத்தின் முன்னால் அமைந்திருந்த இடநிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הָאֹרֶךְ עַל־פְּנֵי רֹחַב הַבַּיִת אַמּוֹת עֶשְׂרִים
  choice: ஆலயத்தின் அகலத்துக்கு இணையாக இருபது முழம் நீளமாயிருந்தது
  rationale: சுருக்கமான எபிரெய அமைப்பில் முகமண்டபத்தின் நீளத்துக்கும் ஆலயத்தின் அகலத்துக்கும் உள்ள தொடர்பைத் தெளிவாகவும் மிகைப்படுத்தாமலும் வெளிப்படுத்துகிறது.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: இருபது முழம்
  rationale: பண்டைய அளவலகை நவீன அலகாக மாற்றாமல், தமிழில் வழக்கமான வேதாகம அளவுச் சொல்லால் தருகிறது.
- source_word: וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים
  choice: அதன் உயரம் நூற்றிருபது முழம்
  rationale: மசோரா உரையின் எண்ணிக்கையை அப்படியே பின்பற்றுகிறது; சூழலில் புரிந்துகொள்ளப்படும் அளவலகைத் தெளிவுக்காக மீண்டும் குறிப்பிடுகிறது.
- source_word: וַיְצַפֵּהוּ מִפְּנִימָה
  choice: அதன் உட்புறத்தை ... அவன் பொதிந்தான்
  rationale: צפה என்பதன் மேற்பூச்சிடுதல் அல்லது தகடால் மூடுதல் என்ற கட்டடக்கலைப் பொருளையும், מִפְּנִימָה என்பதன் உள்புறக் குறிப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: זָהָב טָהוֹר
  choice: தூய தங்கம்
  rationale: பொருளை நேரடியாகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
