translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்குப் புரியக்கூடியதுமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’ சூழலில் இயல்பாக இருப்பதால் ‘வீடு’ என்ற சொற்பொருளுக்குப் பதிலாக பயன்படுத்தப்பட்டது. உரைத் தெளிவுக்காக நீண்ட எபிரெய வாக்கியம் மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டது.
