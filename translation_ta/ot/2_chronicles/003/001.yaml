  edition: WLC
  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
translation:
  language: ta
  text: அப்போது சாலொமோன் எருசலேமில், மோரியா மலையில்[a], யாவேயின் இல்லத்தைக் கட்டத் தொடங்கினான்; அங்கே யாவே அவன் தந்தையான தாவீதுக்குத் தோன்றியிருந்தார். தாவீது ஏற்பாடு செய்த இடத்தில், அதாவது எபூசியனான ஒர்னானின் போரடிக்கும் களத்தில், அவன் அதைக் கட்டத் தொடங்கினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, “யாவே அவன் தந்தையான தாவீதுக்குத் தோன்றிய மோரியா மலையில்.”
    reason: alternative_reading
  - marker: b
    text: 'எபிரெயத்தில் இத்தொடர் சுருக்கமாக உள்ளது: “தாவீதின் இடத்தில் அவர் ஏற்பாடு செய்தது, எபூசியனான ஒர்னானின் போரடிக்கும் களத்தில்.” சூழலில் இது தாவீது ஏற்பாடு செய்த ஆலய இடத்தைக் குறிக்கிறது. நாளாகமத்தில் பெயர் “ஒர்னான்”; 2 சாமுவேல் 24:16, 18-ல் “அரௌனா” என்ற வடிவம் வருகிறது.'
    reason: cross_reference_and_textual_clarity
lexical_decisions:
- source_word: וַיָּחֶל ... לִבְנוֹת
  choice: கட்டத் தொடங்கினான்
  rationale: தொடர்நிகழ்வைக் குறிக்கும் வினை வடிவத்தையும், ‘தொடங்கி கட்டுதல்’ என்ற இயல்பான பொருளையும் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லம்
  rationale: ஆலயத்தைக் குறித்தாலும், எபிரெயச் சொல்லிலுள்ள ‘இல்லம்/வீடு’ என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக உள்ள இறைபெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּהַר הַמּוֹרִיָּה
  choice: மோரியா மலையில்
  rationale: குறிப்பிட்ட மலையைக் குறிக்கும் இயல்பான தமிழ் இடவியல் சொற்றொடர்.
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  choice: அங்கே யாவே அவனுடைய தந்தையான தாவீதுக்குத் தோன்றியிருந்தார்
  rationale: נראה என்பதன் இறைத்தோற்றச் சூழலுக்குரிய ‘தோன்றினார்’ என்ற பொருளைத் தேர்ந்தெடுத்து, தமிழில் குழப்பம் தவிர்க்க மறைந்துள்ள எழுவாயை வெளிப்படுத்துகிறது; காலத்துக்கு முந்திய நிகழ்வை ‘தோன்றியிருந்தார்’ காட்டுகிறது.
- source_word: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד
  choice: தாவீது ஆயத்தப்படுத்திய அந்த இடம்
  rationale: சுருக்கமான எபிரெயத் தொடரின் சூழல்சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; தாவீது ஆலயத்துக்குரிய இடத்தை ஆயத்தப்படுத்தியதைக் குறிக்கிறது.
- source_word: בְּגֹרֶן
  choice: போரடிக்கும் களத்தில்
  rationale: தானியத்திலிருந்து பதரைப் பிரிக்கப் பயன்படுத்தப்பட்ட திறந்த களத்தை சாதாரண வாசகருக்குப் புரியும் தமிழில் குறிக்கிறது.
- source_word: אָרְנָן הַיְבוּסִי
  choice: எபூசியனான ஒர்னான்
  rationale: நாளாகமத்தில் காணப்படும் ஒர்னான் என்ற பெயர் வடிவத்தையும், அவரது இன அடையாளத்தையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டமல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைபெயர் உள்ளது; ‘யாவே’ அதனை நவீனத் தமிழில் நெருக்கமாக ஒலிபெயர்க்கிறது.
- issue: נִרְאָה என்பதன் எழுவாயும் பொருளும்
  choice: யாவே தாவீதுக்குத் தோன்றினார்
  alternative: அந்த இடம் தாவீதுக்குக் காண்பிக்கப்பட்டது
  rationale: இறைத்தோற்றச் சூழலில் நிபால் வடிவுக்கு ‘தோன்றினார்’ என்பது இயல்பான வாசிப்பு. ஆயினும் எபிரெயத் தொடரின் இலக்கணச் சுருக்கம் காரணமாகச் செயப்பாட்டு வாசிப்பும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד என்ற சுருக்கமான தொடரின் தொடர்பு
  choice: தாவீது ஆயத்தப்படுத்திய அந்த இடம்
  alternative: தாவீதின் இடத்தில் அவர் ஆயத்தப்படுத்தியது
  rationale: மசோரா உரை இலக்கண ரீதியாகச் சுருக்கமாகவும் தொடர்பு தெளிவில்லாமலும் உள்ளது. சூழலில் தாவீது ஆலய இடத்தை ஆயத்தப்படுத்தியதாகப் புரிவது தெளிவான முதன்மை வாசிப்பு; சொற்சார்ந்த அமைப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘ஆலயம்’ என்பதற்குப் பதிலாக ‘இல்லம்’ பயன்படுத்தப்பட்டதால் மூலத்தின் உருவகம் பாதுகாக்கப்படுகிறது; ‘போரடிக்கும் களம்’ வேளாண் இடத்தைத் தெளிவாக விளக்குகிறது.
