revisions:
- from: சாலொமோன் எருசலேமிலுள்ள மோரியா மலையில்[a] யாவேயின் இல்லத்தைக் கட்டத் தொடங்கினான். அங்கே யாவே அவனுடைய தந்தையான தாவீதுக்குத் தோன்றியிருந்தார். தாவீது ஆயத்தப்படுத்திய அந்த இடம், எபூசியனான ஒர்னானின் போரடிக்கும் களத்தில்[b] இருந்தது.
  to: அப்போது சாலொமோன் எருசலேமில், மோரியா மலையில்[a], யாவேயின் இல்லத்தைக் கட்டத் தொடங்கினான்; அங்கே யாவே அவன் தந்தையான தாவீதுக்குத் தோன்றியிருந்தார். தாவீது ஏற்பாடு செய்த இடத்தில், அதாவது எபூசியனான ஒர்னானின் போரடிக்கும் களத்தில், அவன் அதைக் கட்டத் தொடங்கினான்.[b]
  rationale: காலவரிசையைச் சுட்ட ‘அப்போது’ சேர்க்கப்பட்டது. யாவே தாவீதுக்குத் தோன்றியதாக உள்ள சூழல்சார்ந்த வாசிப்பு முதன்மை உரையில் தக்கவைக்கப்பட்டது; பொருந்தாத செயப்பாட்டு அடிக்குறிப்பு நீக்கப்பட்டது. தாவீது ஏற்பாடு செய்த இடமும் ஒர்னானின் போரடிக்கும் களமும் ஒரே இடத்தைக் குறிக்கின்றன என்பதைத் தமிழில் வெளிப்படுத்தி, மூலத்தின் சுருக்கமான மற்றும் ஓரளவு கடினமான தொடருக்கான விளக்கம் அடிக்குறிப்பில் வைக்கப்பட்டது.
