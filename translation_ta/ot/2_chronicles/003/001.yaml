  source_fidelity: 'முதன்மைக் கருத்துகள் சரியாக உள்ளன: சாலொமோன், எருசலேம், மோரியா மலை, யாவே தாவீதுக்குத் தோன்றுதல், ஒர்னானின் போரடிக்கும் களம் ஆகியவை மூலத்தோடு பொருந்துகின்றன. ஆனால் எபிரெயத்தின் சுருக்கமான இறுதித் தொடரான אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד בְּגֹרֶן... என்பதைத் தற்போதைய மூன்று வாக்கிய அமைப்பு ஓரளவு தளர்த்துகிறது. ‘தாவீது ஏற்பாடு செய்த இடத்தில்’ என இடவியல் தொடர்பைத் தெளிவாக வைத்திருப்பது பாதுகாப்பானது.'
