source:
  edition: WLC
  text: וַ/יְצַ֧ף אֶת הַ/בַּ֛יִת אֶ֥בֶן יְקָרָ֖ה לְ/תִפְאָ֑רֶת וְ/הַ/זָּהָ֖ב זְהַ֥ב פַּרְוָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/006.yaml
  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
translation:
  language: ta
  text: அவர் அந்த ஆலயத்தை அழகுக்காக விலையுயர்ந்த கற்களால் மூடினார்.[a] தங்கமோ பர்வாயீமின் தங்கமாக இருந்தது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘வீடு’ என்று உள்ளது; நாளாகமத்தில் இது ஆலயத்தைக் குறிக்கும் வழக்கமான பெயர்.
    reason: lexical_alternative
  - marker: b
    text: பர்வாயீம் எங்கிருந்தது என்பது உறுதியாகத் தெரியவில்லை. இச்சொற்றொடரை ‘பர்வாயீமிலிருந்து வந்த தங்கம்’ அல்லது ‘பர்வாயீம் தங்கம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: பதித்தார்
  rationale: צפה என்பது ஒரு கட்டடத்தின் மேற்பரப்பை அலங்காரப் பொருளால் மூடுவதைக் குறிக்கிறது. கற்களைக் குறித்த தமிழ்ச் சூழலில் ‘பதித்தார்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: הַבַּיִת
  choice: அந்த ஆலயத்தை
  rationale: எபிரெயச் சொல் நேரடியாக ‘வீடு’ என்றாலும், நாளாகமத்தில் இச்சூழலில் அது கர்த்தருடைய ஆலயத்தைக் குறிக்கிறது. நவீனத் தமிழில் ‘ஆலயம்’ தெளிவாக உள்ளது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶבֶן יְקָרָה
  choice: விலையுயர்ந்த கற்களால்
  rationale: ஒருமை வடிவம் இங்கு கூட்டுப்பொருளில் பயன்படுத்தப்பட்டுள்ளது. ‘விலையுயர்ந்த கற்கள்’ என்பது மதிப்புமிக்க அலங்காரக் கற்களை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְתִפְאָרֶת
  choice: அழகுபடுத்த
  rationale: 'இச்சொல் நோக்கத்தைக் காட்டுகிறது: கற்கள் கட்டடத்திற்கு அழகும் சிறப்பும் சேர்க்கப் பயன்படுத்தப்பட்டன. ‘அழகுபடுத்த’ என்பது நோக்கத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.'
- source_word: וְהַזָּהָב
  choice: பயன்படுத்தப்பட்ட தங்கம்
  rationale: எபிரெய வாக்கியம் தங்கத்தின் வகையைத் தனியே குறிப்பிடுவதற்கு மாறுகிறது. தமிழில் கருத்துத் தொடர்பைத் தெளிவாக்க ‘பயன்படுத்தப்பட்ட’ என்பது சூழலிலிருந்து வெளிப்படையாகச் சேர்க்கப்பட்டது.
- source_word: זְהַב פַּרְוָיִם
  choice: பர்வாயீமின் தங்கம்
  rationale: இணைப்புச் சொற்றொடர் பர்வாயீமுடன் தொடர்புடைய அல்லது அங்கிருந்து வந்த தங்கத்தைக் குறிக்கிறது. இடத்தின் அடையாளம் உறுதியற்றதால், ‘பர்வாயீமின் தங்கம்’ மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
