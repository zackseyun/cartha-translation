base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
translation:
  language: ta
  text: அவர் உட்பரிசுத்த இடத்தில்[a] சங்கிலி அலங்காரங்களை[b] செய்து, அவற்றைத் தூண்களின் உச்சிகளில் வைத்தார். மேலும், நூறு மாதுளம்பழ வடிவ அலங்காரங்களைச் செய்து, அவற்றைச் சங்கிலிகளில் பொருத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உள்ளறையில்’ என்றும் மொழிபெயர்க்கலாம்; பாரம்பரியமாக, ‘மகா பரிசுத்த ஸ்தலத்தில்’ எனப்படுகிறது. எபிரெயச் சொல் ஆலயத்தின் உட்பரிசுத்த இடத்தைக் குறிக்கிறது; ஆனால் இங்கு அது அலங்கார வேலை செய்யப்பட்ட இடத்தைச் சற்று விரிவாகக் குறிப்பதாகவும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: ‘சங்கிலி வேலைப்பாடுகளை’ அல்லது ‘மாலை வடிவ அலங்காரங்களை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁרְשְׁרוֹת
  choice: சங்கிலி அலங்காரங்கள்
  rationale: இச்சொல் சங்கிலி போன்ற அலங்கார வேலைப்பாட்டைக் குறிக்கிறது. வெறும் ‘சங்கிலிகள்’ என்பதைக் காட்டிலும் கட்டட அலங்காரச் சூழலைத் தெளிவாக வெளிப்படுத்துகிறது; அதே நேரத்தில் அதன் உருவகமான வடிவத்தையும் காக்கிறது.
- source_word: בַּדְּבִיר
  choice: உட்பரிசுத்த இடத்தில்
  rationale: דְּבִיר ஆலயத்தின் உள்ளார்ந்த பரிசுத்த பகுதியைக் குறிக்கிறது. ‘மகா பரிசுத்த ஸ்தலம்’ என்ற பாரம்பரிய வழிபாட்டுச் சொல்லை நேரடியாகத் திணிக்காமல், இடத்தின் தன்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: רֹאשׁ הָעַמֻּדִים
  choice: தூண்களின் உச்சிகளில்
  rationale: ‘தூண்களின் தலைகள்’ என்பது தமிழில் இயல்பற்றது; கட்டடப் பொருளில் רֹאשׁ என்பதன் இடவியல் பொருளை ‘உச்சிகள்’ துல்லியமாக வழங்குகிறது.
- source_word: רִמּוֹנִים
  choice: மாதுளம்பழ வடிவ அலங்காரங்கள்
  rationale: இவை உண்மையான பழங்கள் அல்ல, ஆலய அலங்காரத்தில் பயன்படுத்தப்பட்ட மாதுளம்பழ வடிவங்கள். மூல உருவத்தையும் சூழலையும் தெளிவாகக் காக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: מֵאָה
  choice: நூறு
  rationale: எண்ணிக்கை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּתֵּן בַּשַּׁרְשְׁרוֹת
  choice: அவற்றைச் சங்கிலிகளில் பொருத்தினார்
  rationale: בְּ என்ற முன்னிடைச்சொல் இங்கு அலங்கார வடிவங்கள் சங்கிலி வேலைப்பாட்டுடன் இணைக்கப்பட்டதைக் குறிக்கலாம். ‘பொருத்தினார்’ என்பது கட்டட அலங்காரச் சூழலில் இயல்பானது; ‘வைத்தார்’ என்ற மாற்றுப் பொருளும் சாத்தியம்.
