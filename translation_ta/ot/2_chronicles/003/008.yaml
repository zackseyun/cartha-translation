base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
translation:
  language: ta
  text: அவர் மிகப் பரிசுத்தமான இடத்தை[a] அமைத்தார்; அதன் நீளம் ஆலயத்தின் அகலத்துக்கு ஒத்ததாக இருபது முழம், அதன் அகலமும் இருபது முழம். அதை அறுநூறு தாலந்து எடையுள்ள உயர்தரத் தங்கத்தால் மூடினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பரிசுத்தங்களின் பரிசுத்தம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  choice: மகா பரிசுத்த இடம்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘பரிசுத்தங்களின் பரிசுத்தத்தின் அறை/இடம்’ என இருந்தாலும், மிக உயர்ந்த பரிசுத்தத்தைக் குறிக்கும் எபிரெய வழக்கு இது. ‘மகா பரிசுத்த இடம்’ என்பது உட்புறத் திருத்தலத்தைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אָרְכּוֹ עַל פְּנֵי רֹחַב הַבַּיִת
  choice: அதன் நீளம் ஆலயத்தின் அகலத்துக்கு நேராக
  rationale: עַל־פְּנֵי இங்கு இடஞ்சார்ந்த ஒழுங்கமைவை அல்லது ஒரே அளவாக அமைந்திருப்பதைச் சுட்டுகிறது. ஆலயத்தின் அகலத்துடன் இந்த அறையின் நீளம் பொருந்தியதை ‘அகலத்துக்கு நேராக’ இயல்பாகத் தெரிவிக்கிறது; மூலத்தின் இடஞ்சார்ந்த நுணுக்கத்தையும் காக்கிறது.
- source_word: אַמּוֹת עֶשְׂרִים
  choice: இருபது முழம்
  rationale: אַמָּה என்ற பழங்கால நீள அலகுக்கு வழக்கமான தமிழ் வேதாகமச் சொல் ‘முழம்’; நவீன அலகாக மாற்றாமல் மூலத்தின் அளவீட்டைத் தக்கவைக்கிறது.
- source_word: וְרָחְבּוֹ אַמּוֹת עֶשְׂרִים
  choice: அதன் அகலம் இருபது முழமுமாக இருந்தது
  rationale: எபிரெய மொழியின் சுருக்கமான அளவுக் கூற்றைத் தெளிவான நவீனத் தமிழில் தருகிறது.
- source_word: וַיְחַפֵּהוּ
  choice: அதை ... தங்கத்தால் மூடினார்
  rationale: חפה என்பது கட்டடத்தின் மேற்பரப்பில் தங்கத் தகடு பதித்தல் அல்லது மேல்பூச்சாக மூடுதல் என்பதைக் குறிக்கிறது. ‘மூடினார்’ என்பது சாதாரண வாசகருக்குப் புரியும் இயல்பான கட்டடச் சூழல் மொழி.
- source_word: זָהָב טוֹב
  choice: உயர்தரத் தங்கம்
  rationale: טוֹב இங்கு தங்கத்தின் தரத்தைக் குறிக்கிறது. ‘உயர்தரத் தங்கம்’ அதைப் பிரதிபலிக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத உலோகவியல் முழுத் தூய்மையை ‘சுத்தத் தங்கம்’ எனக் கூறி மிகைப்படுத்துவதைத் தவிர்க்கிறது.
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  choice: அறுநூறு தாலந்து எடையுள்ள
  rationale: לְ இங்கு பயன்படுத்தப்பட்ட தங்கத்தின் மொத்த அளவு அல்லது எடையைச் சுட்டுகிறது. ‘எடையுள்ள’ என்பது இது மதிப்பல்ல, அளவு/எடை என்பதைத் தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: உட்புறத் திருத்தலத்தின் பெயரில் உள்ள எபிரெய மிகைநிலை வழக்கு
  choice: மகா பரிசுத்த இடம்
  alternative: பரிசுத்தங்களின் பரிசுத்த இடம்
  rationale: மூலத்தின் மிகைநிலைப் பொருளைத் தக்கவைத்தபடி, குறிப்பிட்ட மரபுசார் விளக்கத்தைச் சேர்க்காமல் இயல்பான தமிழில் தரப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’, ‘முழம்’, ‘தாலந்து’ ஆகியவை வேதாகமக் கட்டடம் மற்றும் பழங்கால அளவீட்டுச் சூழலைக் காக்கின்றன. நீளம் ஆலய அகலத்துடன் கொண்ட உறவு மூலத்திலுள்ள இடஞ்சார்ந்த மொழிக்கு ஏற்ப ‘அகலத்துக்கு நேராக’ எனத் தரப்பட்டுள்ளது.
