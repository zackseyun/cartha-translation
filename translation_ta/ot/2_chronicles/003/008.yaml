revisions:
- from: அவர் மகா பரிசுத்த இடத்தை[a] அமைத்தார். அதன் நீளம் ஆலயத்தின் அகலத்துக்கு நேராக இருபது முழமும், அதன் அகலம் இருபது முழமுமாக இருந்தது. அதை அறுநூறு தாலந்து எடையுள்ள உயர்தரத் தங்கத்தால் மூடினார்.
  to: அவர் மிகப் பரிசுத்தமான இடத்தை[a] அமைத்தார்; அதன் நீளம் ஆலயத்தின் அகலத்துக்கு ஒத்ததாக இருபது முழம், அதன் அகலமும் இருபது முழம். அதை அறுநூறு தாலந்து எடையுள்ள உயர்தரத் தங்கத்தால் மூடினார்.
  rationale: The revision preserves the source text’s dimensions and its deliberately compact spatial expression while replacing a potentially misleading Tamil idiom. It also makes the designation of the inner sanctuary natural in modern standard Tamil. No additional footnote is required for the gold quantity, since the Tamil wording directly states the weight represented by the Hebrew phrase.
