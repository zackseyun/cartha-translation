translation_notes:
  register: நவீனத் தரத் தமிழில், கட்டிட விவரணைக்கேற்ற தெளிவான மற்றும் கண்ணியமான நடை. ‘ஆலயம்’ சூழல்சார் தெளிவுக்காகப் பயன்படுத்தப்பட்டது; அளவீட்டின் பண்டைய அலகான ‘முழம்’ தக்கவைக்கப்பட்டது. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்புகள் அவற்றின் குறியீடுகளுடன் பொருந்தாததாகவும் எபிரெய மூலத்தின் உண்மையான மாற்றுப் பொருள்களைச் சுட்டாததாகவும் இருப்பதால் சேர்க்கப்படவில்லை.
