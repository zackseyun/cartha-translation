  text: וּ/כְנַ֨ף הַ/כְּר֤וּב הָ/אֶחָד֙ אַמּ֣וֹת חָמֵ֔שׁ מַגִּ֖יעַ לְ/קִ֣יר הַ/בָּ֑יִת וְ/הַ/כָּנָ֤ף הָ/אַחֶ֨רֶת֙ אַמּ֣וֹת חָמֵ֔שׁ דְּבֵקָ֕ה לִ/כְנַ֖ף הַ/כְּר֥וּב הָ/אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
translation:
  language: ta
  text: ஒரு கேருபின் இறக்கை ஐந்து முழம் நீளமாயிருந்து ஆலயத்தின் சுவரை எட்டியது; அதன் மற்ற இறக்கையும் ஐந்து முழம் நீளமாயிருந்து மற்ற கேருபின் இறக்கையைத் தொட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְנַף
  choice: இறக்கை
  rationale: ஆலயக் கேருபின் உருவத்தை விவரிக்கும் இச்சூழலில், இச்சொல்லின் நேரடியான பொருளான ‘இறக்கை’ என்பதே பொருத்தமானது.
- source_word: כְּרוּב
  choice: கேருபு
  rationale: எபிரெயச் சொல் இங்கு ஒருமையில் இருப்பதால், தனித்த உருவைக் குறிக்கும் ‘கேருபு’ பயன்படுத்தப்பட்டது.
- source_word: אַמּוֹת חָמֵשׁ
  choice: ஐந்து முழம்
  rationale: பண்டைய அளவை நவீன அளவாகத் தோராயமாக மாற்றாமல், வேதாகமக் கட்டிட அளவீடுகளில் வழக்கமான ‘முழம்’ என்ற அலகு தக்கவைக்கப்பட்டது.
- source_word: מַגִּיעַ
  choice: எட்டியது
  rationale: இறக்கை நீண்டு சுவரை அடைந்ததை இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: קִיר הַבָּיִת
  choice: ஆலயத்தின் சுவர்
  rationale: בַּיִת என்பதன் நேரடிப் பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் அது ஆலயக் கட்டிடத்தையே தெளிவாகக் குறிக்கிறது; தமிழில் ‘ஆலயம்’ தெளிவும் இயல்பும் தருகிறது.
- source_word: הַכָּנָף הָאַחֶרֶת
  choice: அதன் மற்ற இறக்கை
  rationale: இரண்டு இறக்கைகளில் எஞ்சிய ஒன்றைக் குறிக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: דְּבֵקָה
  choice: தொட்டது
  rationale: இரு இறக்கைகளும் நெருக்கமாகச் சந்தித்ததைக் காட்டுகிறது; ‘இணைக்கப்பட்டிருந்தது’ என்பது உரையில் இல்லாத கட்டுமான முறையை உணர்த்தக்கூடும்.
- source_word: הַכְּרוּב הָאַחֵר
  choice: மற்ற கேருபு
  rationale: இரண்டு கேருபுகளில் இன்னொன்றைக் குறிக்கும் எபிரெயச் சொல்லமைப்பை இயல்பாகப் பாதுகாக்கிறது.
