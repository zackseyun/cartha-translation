  text: וּ/מִשְׁקָ֛ל לְ/מִסְמְר֥וֹת לִ/שְׁקָלִ֖ים חֲמִשִּׁ֣ים זָהָ֑ב וְ/הָ/עֲלִיּ֖וֹת חִפָּ֥ה זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/009.yaml
  text: And the weight of the nails was fifty shekels of gold[a], and he overlaid the upper rooms with gold.
translation:
  language: ta
  text: ஆணிகளின் எடை ஐம்பது சேக்கல் தங்கம் இருந்தது. அவன் மேலறைகளையும்[a] தங்கத்தால் மூடினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேல் கட்டமைப்புகளையும்”; இந்த எபிரெயச் சொல் ஆலயத்தின் மேலே அமைந்த அறைகளையோ, பொதுவாக மேலுள்ள கட்டமைப்புகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁקָל לְמִסְמְרוֹת
  choice: ஆணிகளின் எடை
  rationale: מִשְׁקָל என்பது ‘எடை’ என்றும் מִסְמְרוֹת என்பது கட்டுமானத்தில் பயன்படுத்தப்படும் ‘ஆணிகள்’ என்றும் பொருள்படும். לְ என்னும் முன்னொட்டு இத்தொடரில் இயல்பான தமிழில் உடைமைத் தொடர்பாக வழங்கப்பட்டுள்ளது.
- source_word: לִשְׁקָלִים חֲמִשִּׁים זָהָב
  choice: ஐம்பது சேக்கல் தங்கமாக இருந்தது
  rationale: எபிரெய அளவையும் தங்கத்தின் மதிப்பு/எடை சார்ந்த பொருளையும் தெளிவாகக் காட்டுகிறது; ‘சேக்கல்’ என்ற பண்டைய எடை அலகு ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהָעֲלִיּוֹת
  choice: மேலறைகளையும்
  rationale: עֲלִיּוֹת பொதுவாக மேலே அமைந்த அறைகள் அல்லது கூடங்களைக் குறிக்கிறது. ‘மேலறைகள்’ spatial sense-ஐப் பாதுகாக்கும் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: חִפָּה זָהָב
  choice: தங்கத்தால் மூடினான்
  rationale: חפה என்பது ஒரு பொருளால் மேற்பரப்பை மூடுதல் அல்லது மேல்பூச்சிடுதல் எனப் பொருள்படும். தங்கத் தகடுகள் பயன்படுத்தப்பட்டதாக உரையில் நேரடியாகக் கூறப்படாததால், ‘தங்கத்தால் மூடினான்’ என வழங்கப்பட்டுள்ளது.
theological_decisions: []
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆலயக் கட்டுமான விவரத்தைத் தெளிவாகவும் கண்ணியமாகவும் வழங்குகிறது. எபிரெய மூலத்தில் உள்ள கட்டடவியல் தெளிவின்மையை [a] அடிக்குறிப்பு பாதுகாக்கிறது.
