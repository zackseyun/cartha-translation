base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/007.yaml
  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
translation:
  language: ta
  text: அவர் ஆலயத்தையும்[a], அதன் உத்தரங்களையும்[b], வாயில்நிலைகளையும்[c], சுவர்களையும் கதவுகளையும் தங்கத்தால் மூடினார்; சுவர்களில் கேருபீன்களைப் பொறித்தார்[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்பொருளாக ‘வீடு’; இங்கு ஆலயக் கட்டடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கூரை விட்டங்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயச் சொல் ‘நிலைப்படிகள்,’ ‘கதவுநிலைகள்’ அல்லது வாசலின் அடிப்பகுதிகளைக் குறிக்கலாம்.
    reason: lexical_ambiguity
  - marker: d
    text: ‘செதுக்கினார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַף
  choice: பொதிந்தார்
  rationale: ஒரு கட்டடத்தின் மேற்பரப்பைத் தங்கத் தகடு அல்லது அடுக்கால் மூடுவதைக் குறிக்கும் கட்டடக்கலைச் சூழலுக்கு இயல்பான தமிழ் சொல்.
- source_word: הַבַּיִת
  choice: ஆலயம்
  rationale: எபிரெயத்தில் சொற்பொருளாக ‘வீடு’ என்றாலும், இச்சூழலில் அது ஆலயக் கட்டடத்தைக் குறிக்கிறது; நவீன வாசகருக்குத் தெளிவாக ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்டது, சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: הַקֹּרוֹת
  choice: உத்தரங்கள்
  rationale: கட்டடத்தைத் தாங்கும் நீளமான மரக்கட்டைகளைச் சுட்டும் பொதுவான கட்டடக்கலைச் சொல்; ‘கூரை விட்டங்கள்’ என்பதும் சாத்தியம்.
- source_word: הַסִּפִּים
  choice: வாயில்நிலைகள்
  rationale: வாசலின் அடிப்பகுதி அல்லது வாசல் அமைப்பைச் சுட்டும் சொல்லின் கட்டடக்கலைப் பொருளைப் பாதுகாக்கிறது; நிலைப்படிகள் அல்லது கதவுநிலைகள் என்ற பொருளும் சாத்தியம்.
- source_word: קִירוֹתָיו
  choice: அதன் சுவர்கள்
  rationale: மூன்றாம் ஆண்பால் ஒருமை உடைமை விகுதி ஆலயத்தைக் குறிக்கிறது; தமிழில் பட்டியலுக்கேற்ற வகையில் ‘அதன்’ ஒருமுறை முன்வைக்கப்படுகிறது.
- source_word: דַלְתוֹתָיו
  choice: கதவுகள்
  rationale: கதவுகள் அல்லது கதவுப் பலகைகள் என்பதைக் குறிக்கும் சொல்லுக்கான தெளிவான பொதுத் தமிழ்.
- source_word: זָהָב
  choice: தங்கத்தால்
  rationale: பட்டியலிடப்பட்ட அனைத்தும் எந்தப் பொருளால் பொதியப்பட்டன என்பதைத் தமிழில் இயல்பாகக் காட்ட கருவிப்பொருள் வேற்றுமை பயன்படுத்தப்பட்டது.
- source_word: וּפִתַּח
  choice: பொறித்தார்
  rationale: சுவரில் அலங்கார உருவங்களைப் பதித்தல் அல்லது செதுக்குதல் என்ற பொருளைத் தருகிறது; செய்முறை துல்லியமாகத் தெரியாததால் மாற்று அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: כְּרוּבִים
  choice: கேருபீன்கள்
  rationale: ஆலயச் சூழலுக்குரிய எபிரெயப் பெயரின் மரபான ஒலிபெயர்ப்பைப் பாதுகாக்கிறது; இதை வேறு வகை வானதூதர்களுடன் அடையாளப்படுத்தவில்லை.
- source_word: עַל הַקִּירוֹת
  choice: சுவர்களில்
  rationale: உருவங்கள் அமைந்த இடத்தைக் குறிக்கும் இயல்பான தமிழாக்கம்.
