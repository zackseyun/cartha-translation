  register: மொழிநடை நவீன, பொதுநிலை, கண்ணியமான தமிழில் அமைக்கப்பட்டது. கட்டடக்கலைப் பட்டியலின் எபிரெய வரிசை பெரும்பாலும் பாதுகாக்கப்பட்டுள்ளது; தமிழில் உடைமைத் தொடர்பைத் தெளிவாக்க ‘அதன்’ சேர்க்கப்பட்டுள்ளது. ‘கேருபீன்கள்’ என்ற ஆலயச் சொல் விளக்கவுரை இன்றி ஒலிபெயர்க்கப்பட்டு, மூலத்தின் தனித்தன்மை காக்கப்பட்டுள்ளது.
