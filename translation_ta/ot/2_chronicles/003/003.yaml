base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'These are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
translation:
  language: ta
  text: 'தேவனுடைய ஆலயத்தைக் கட்டுவதற்காக சாலொமோன் அமைத்த அடித்தளங்கள்[a] இவையே: முந்தைய அளவுமுறையின்படி[b] அதன் நீளம் அறுபது முழமும், அகலம் இருபது முழமும் ஆகும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சாலொமோன் அமைத்த அடித்தளங்கள்” என்பதற்கான எபிரெயச் சொற்றொடர் சற்றுக் கடினமானது. இதை “தேவனுடைய ஆலயத்தைக் கட்டுவதற்காக சாலொமோன் வகுத்த அடிப்படைத் திட்டம் இதுவே” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “முந்தைய அளவுமுறை” என்பது பழைய முழ அளவுத் தரத்தைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: הוּסַד
  choice: அமைத்த அடித்தளம்
  rationale: יסד என்ற வேரிலிருந்து வந்த இவ்வடிவம் இச்சூழலில் இலக்கண மற்றும் பொருள் அடிப்படையில் சற்றுக் கடினமானது. ஆலயக் கட்டுமானத்தின் அடிப்படை அமைப்பையோ அடித்தளமிடுதலையோ குறிக்கும் வகையில், இயல்பான தமிழில் ‘அமைத்த அடித்தளம்’ என மொழிபெயர்க்கப்பட்டது; மாற்று புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִבְנוֹת
  choice: கட்டுவதற்காக
  rationale: ל முன்னொட்டுடன் வரும் வினையெச்சம் நோக்கத்தைக் குறிக்கிறது; ‘கட்டுவதற்காக’ அந்த நோக்கப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயம்
  rationale: எபிரெய மொழியில் சொற்பட ‘தேவனுடைய வீடு’ என்றாலும், இங்கு சாலொமோன் கட்டிய வழிபாட்டுக் கட்டடத்தைக் குறிப்பதால் நவீன தமிழில் ‘ஆலயம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: הָאֹרֶךְ
  choice: நீளம்
  rationale: கட்டட அளவைக் குறிக்கும் வழக்கமான தமிழ்ச் சொல்.
- source_word: אַמּוֹת
  choice: முழம்
  rationale: பழங்கால நீள அலகான cubit-க்கு வேதாகமத் தமிழில் பரவலாக அறியப்படும் ‘முழம்’ பயன்படுத்தப்பட்டது; நவீன அலகாக மாற்றப்படவில்லை.
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  choice: முந்தைய அளவுமுறையின்படி
  rationale: சொற்றொடரை முந்தைய அல்லது பழைய அளவுத் தரத்தைக் குறிப்பதாக மொழிபெயர்க்கிறது; அது எந்த வரலாற்றுத் தரத்தைக் குறிக்கிறது என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: שִׁשִּׁים
  choice: அறுபது
  rationale: ஆலயத்தின் நீளத்தைக் குறிக்கும் எண்ணிக்கை.
- source_word: וְרֹחַב
  choice: அகலம்
  rationale: நீளத்துக்கு இணையாக வரும் கட்டட அளவுச் சொல்; தமிழில் இயல்பான இணைப்புக்காக ‘அதன்’ முன்பே பகிர்ந்து கொள்ளப்படுகிறது.
- source_word: עֶשְׂרִים
  choice: இருபது
  rationale: ஆலயத்தின் அகலத்தைக் குறிக்கும் எண்ணிக்கை.
