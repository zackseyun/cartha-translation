translation_notes:
  register: நவீன, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ்நடை பயன்படுத்தப்பட்டது. ‘தேவனுடைய வீடு’ என்ற சொற்படியான வடிவுக்கு மாற்றாக சூழலுக்கேற்ற ‘தேவனுடைய ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது. மூலத்தில் ‘முழம்’ இருமுறை இடம்பெறும் அமைப்பு தமிழில் தேவையற்ற மீளுரைப்பாக இருப்பதால், அளவுகளோடு ஒருமுறை இயல்பாக அமைக்கப்பட்டது. הוּסַד என்பதிலுள்ள உண்மையான பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
