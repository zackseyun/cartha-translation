  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֨י ב֤וֹא אֲמַצְיָ֨הוּ֙ מֵֽ/הַכּ֣וֹת אֶת אֲדוֹמִ֔ים וַ/יָּבֵ֗א אֶת אֱלֹהֵי֙ בְּנֵ֣י שֵׂעִ֔יר וַ/יַּֽעֲמִידֵ֥/ם ל֖/וֹ לֵ/אלֹהִ֑ים וְ/לִ/פְנֵי/הֶ֥ם יִֽשְׁתַּחֲוֶ֖ה וְ/לָ/הֶ֥ם יְקַטֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: It happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
translation:
  language: ta
  text: அமேசியா ஏதோமியரை வீழ்த்திவிட்டுத் திரும்பி வந்தபின், சேயீரின் மக்களின் தெய்வங்களைக் கொண்டுவந்து, அவற்றைத் தனக்குத் தெய்வங்களாக நிறுவினான்; அவற்றுக்கு முன்பாகத் தலைவணங்கி,[a] அவற்றுக்குத் தூபம் எரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றுக்கு முன்பாகத் தரையில் விழுந்து வணங்கினான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי בּוֹא
  choice: வந்தபின்
  rationale: எபிரெயக் கதைத் தொடரையும் அடுத்த நிகழ்வின் காலத்தையும் தமிழில் இயல்பாக ஒருங்கிணைக்கிறது; சூழல் காரணமாக ‘திரும்பி’ என்பது முந்தைய செயலை முடித்துவந்ததைக் குறிக்கிறது.
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  choice: ஏதோமியரை வீழ்த்திவிட்டு
  rationale: נכה என்பதன் தாக்கி வீழ்த்தும் பொருளைத் தக்கவைத்தபடி, முழுமையான படுகொலை என்று மிகைப்படுத்தாமல் வெற்றியை இயல்பாகக் கூறுகிறது.
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  choice: சேயீரின் மக்களுடைய தெய்வங்கள்
  rationale: בני שׂעיר என்ற உறவுமுறைச் சொல்லை நவீன தமிழில் இயல்பான மக்களைக் குறிக்கும் தொடராக வழங்குகிறது; பன்மை אֱלֹהֵי தெளிவாக ‘தெய்வங்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  choice: அவற்றைத் தனக்குத் தெய்வங்களாக நிறுவினான்
  rationale: ஹிப்ஃபில் வடிவின் நிறுத்தி/நிலைநிறுத்தி அமைத்தல் என்ற கருத்தையும், அவற்றைத் தனது தெய்வங்களாக ஏற்றுக்கொண்ட செயலையும் காக்கிறது.
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה
  choice: அவற்றுக்கு முன்பாகப் பணிந்து வணங்கி
  rationale: השתחוה குறிக்கும் உடல் தாழ்த்துதலையும் வழிபாட்டுச் சூழலையும் சேர்த்து இயல்பான தமிழில் தெரிவிக்கிறது; அடிப்படை உடல் செயலை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וְלָהֶם יְקַטֵּר
  choice: அவற்றுக்குத் தூபம் காட்டினான்
  rationale: கடவுள் வழிபாட்டுச் சூழலில் தூபத்தை எரித்துப் படைக்கும் செயலைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொற்றொடர்.
theological_decisions:
- issue: புறவினத் தெய்வங்களுக்கு אֱלֹהֵי/אֱלֹהִים என்பதன் மொழிபெயர்ப்பு
  choice: தெய்வங்கள்
  alternative: தெய்வீக உயிர்கள்
  rationale: இங்கு சேயீரின் வழிபாட்டுத் தெய்வங்களையே குறிக்கிறது. ‘தெய்வங்கள்’ என்பது பன்மையையும் அமேசியாவின் பிறதெய்வ வழிபாட்டையும் தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ். ‘சேயீரின் மக்களுடைய’ என்பது எபிரெய ‘சேயீரின் மகன்கள்’ என்ற மரபுத்தொடரின் இயல்பான பொருள். வாக்கிய அமைப்பு கதைநடையின் காலவரிசையைத் தெளிவாக வைத்திருக்கிறது.
