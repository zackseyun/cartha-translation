base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
translation:
  language: ta
  text: ஆனால், அமத்சியா தன்னுடன் போருக்குச் செல்லவிடாமல் திருப்பி அனுப்பிய படைப்பிரிவின் வீரர்கள், சமாரியா முதல் பெத்-ஓரோன் வரை யூதாவின் நகரங்கள்மேல் திடீர்த் தாக்குதல் நடத்தி, அந்த நகரங்களில் மூவாயிரம் பேரை வீழ்த்தி[a], பெருமளவு கொள்ளைப்பொருளைக் கைப்பற்றினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, கொன்றனர் என்றும் மொழிபெயர்க்கலாம். இப்போர் சூழலில் எபிரெய வினை உயிரிழப்பைக் குறிக்கலாம்; அதன் அடிப்படைப் பொருள் ‘அடித்தல்’ அல்லது ‘வீழ்த்துதல்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  choice: படைப்பிரிவின் வீரர்கள்
  rationale: சொல்லுக்கு சொல் ‘படைக்குழுவின் மகன்கள்’ என்றாலும், எபிரெய வழக்கில் படைப்பிரிவைச் சேர்ந்த ஆட்களைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘வீரர்கள்’ பொருத்தமானது.
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  choice: அமத்சியா தன்னுடன் போருக்குச் செல்லவிடாமல் திருப்பி அனுப்பிய
  rationale: הֵשִׁיב என்பதன் காரணவினைப் பொருளான ‘திரும்பச் செய்தான்/திருப்பி அனுப்பினான்’ என்பதையும், מן உடன் வரும் வினையெச்சத் தொடரின் தடுத்தல் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיִּפְשְׁטוּ
  choice: திடீர்த் தாக்குதல் நடத்தி
  rationale: இராணுவச் சூழலில் פשט எதிர்பாராத படையெடுப்பு அல்லது கொள்ளைத் தாக்குதலைக் குறிக்கிறது; ‘திடீர்த் தாக்குதல்’ தமிழில் அதன் இயக்கத்தையும் பகைமைத் தன்மையையும் இயல்பாகக் காட்டுகிறது.
- source_word: בְּעָרֵי יְהוּדָה
  choice: யூதாவின் நகரங்கள்மேல்
  rationale: בְ இங்கு தாக்குதலின் இலக்கைக் குறிக்கிறது; עָרֵי என்பது நகரங்கள் அல்லது ஊர்கள் என வரக்கூடியது, இங்கு மரபான ‘நகரங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  choice: சமாரியா முதல் பெத்-ஓரோன் வரை
  rationale: מִן ... וְעַד கட்டமைப்பு தாக்குதல் நடந்த புவியியல் எல்லையை நேரடியாகக் குறிக்கிறது.
- source_word: וַיַּכּוּ מֵהֶם שְׁלֹשֶׁת אֲלָפִים
  choice: அங்கிருந்தவர்களில் மூவாயிரம் பேரை வீழ்த்தி
  rationale: נכה என்பது ‘அடி/வீழ்த்து’ என்ற பரந்த வினை; இப்போர் சூழலில் மரணம் வலுவாகக் குறிக்கப்பட்டாலும், மூலத்தின் சொற்பொருள் அகலத்தைப் பாதுகாக்க ‘வீழ்த்தி’ பயன்படுத்தப்பட்டது. מֵהֶם என்பதிலுள்ள சுட்டுப்பெயரின் முன்னிலைத் தொடர்பு தெளிவாக இல்லாததால் ‘அங்கிருந்தவர்களில்’ என இயல்பாக வழங்கப்பட்டது.
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  choice: பெருமளவு கொள்ளைப்பொருளைக் கைப்பற்றினார்கள்
  rationale: ஒரே வேர்ச்சொல்லை மீண்டும் பயன்படுத்தும் எபிரெய வலியுறுத்தலை, இயல்பான தமிழில் ‘பெருமளவு’ என்பதன் மூலம் வெளிப்படுத்துகிறது.
