translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், dignified narrative register பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர்கள் ‘சமாரியா’, ‘பெத்-ஓரோன்’ என ஒலிபெயர்க்கப்பட்டுள்ளன. மூல எபிரெய உரையில் ‘யூதாவின் நகரங்கள்’ என்பதற்குப் பின் குறிப்பு இல்லை; ஆகவே ஆங்கில ஆலோசனை உரையின் [a] குறிப்பு தவறான இடமாற்றமாகக் கருதி சேர்க்கப்படவில்லை. உயிரிழப்பைத் தெளிவாக்கும் மாற்று மட்டும் [a] ஆக வழங்கப்பட்டுள்ளது.
