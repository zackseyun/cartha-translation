  text: וַ/יִּשְׁלַ֞ח יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின் ராஜாவாகிய யோவாஸ், யூதாவின் ராஜாவாகிய அமத்சியாவுக்குச் செய்தி அனுப்பி, “லெபனோனில் இருந்த முட்செடி[a], லெபனோனில் இருந்த கேதுரு மரத்திடம், ‘உன் மகளை என் மகனுக்கு மனைவியாகக் கொடு’ என்று சொல்லியனுப்பியது. அப்போது லெபனோனில் இருந்த வயல்வெளியின் ஒரு காட்டு விலங்கு அவ்வழியே சென்று அந்த முட்செடியை மிதித்தது” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நெருஞ்சில்’ அல்லது ‘முட்புதர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் முட்கள் நிறைந்த ஒரு தாவரத்தைக் குறிக்கிறது; அதன் துல்லியமான இனம் உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוֹחַ
  choice: முட்செடி
  rationale: இச்சொல் முட்கள் நிறைந்த ஒரு தாவரத்தைக் குறிக்கிறது; அதன் துல்லியமான இனம் உறுதியில்லை. ‘முட்செடி’ என்பது கேதுரு மரத்துக்கு எதிராகக் காட்டப்படும் சிறிய, முட்கள் நிறைந்த தாவரத்தின் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: הָאֶרֶז
  choice: கேதுரு மரம்
  rationale: אֶרֶז என்பது கேதுரு மரத்தைக் குறிக்கிறது; அதன் உயரமும் வலிமையும் முட்செடியுடனான உருவக வேறுபாட்டைத் தெளிவாக்குகின்றன.
- source_word: בַּלְּבָנוֹן
  choice: லெபனோனில்
  rationale: தாவரங்களும் காட்டு விலங்கும் இருக்கும் நிலப்பகுதியை இயல்பான தமிழில் குறிக்கிறது.
- source_word: שָׁלַח ... לֵאמֹר
  choice: செய்தி அனுப்பி ... என்று சொல்லியனுப்பியது
  rationale: எபிரெய உரையில் வெளிப்புற நிகழ்விலும் உருவகக் கதையிலும் வரும் ‘அனுப்புதல்—சொல்லுதல்’ அமைப்பைக் காக்கும் அதேவேளையில், அனுப்பப்பட்டது செய்தி என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: உன் மகளை என் மகனுக்கு மனைவியாகக் கொடு
  rationale: திருமண உறவை வேண்டுகிற சூத்திரத்தைத் தெளிவாகவும் மூலத்தின் உறவுப்பொருளைக் காத்தும் வழங்குகிறது.
- source_word: חַיַּת הַשָּׂדֶה
  choice: ஒரு காட்டு விலங்கு
  rationale: இது குறிப்பிட்ட இனம் சொல்லப்படாத காட்டில் வாழும் நில விலங்கைக் குறிக்கிறது; நவீன தமிழில் ‘காட்டு விலங்கு’ இயல்பும் தெளிவும் உடையது.
- source_word: וַתַּעֲבֹר
  choice: அவ்வழியே சென்று
  rationale: விலங்கு வழியாகச் செல்லும்போது முட்செடியை மிதித்தது என்ற தற்செயல் இயக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַתִּרְמֹס
  choice: மிதித்துப்போட்டது
  rationale: רמס என்பதன் காலால் மிதித்து நசுக்கும் வலிமையான பொருளைச் சுருக்கமாகவும் உயிரோட்டமாகவும் தருகிறது.
