translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் வேதாகம உருவகத்தின் கண்ணியமான தொனியைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது. எபிரெயின் எளிய தொடர்ச்சிச் சொல் இரு நிகழ்வுகளிலும் ‘அப்போது’ என நடுநிலையாக வழங்கப்பட்டது. அடிக்குறிப்புக் குறியீடு அது விளக்கும் ‘முட்செடி’ என்பதற்குப் பின் வைக்கப்பட்டது.
