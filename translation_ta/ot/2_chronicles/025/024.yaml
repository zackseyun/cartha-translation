base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
translation:
  language: ta
  text: அவன் பொன்னையும் வெள்ளியையும் முழுவதுமாகவும், தேவனுடைய ஆலயத்தில் ஓபேத்-ஏதோமுடன்[a] இருந்த எல்லாப் பொருட்களையும், அரச அரண்மனையின் பொக்கிஷங்களையும், பிணைக்கைதிகளையும்[b] எடுத்துக்கொண்டு சமாரியாவுக்குத் திரும்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “ஓபேத்-ஏதோமுடன்”; இது “ஓபேத்-ஏதோமின் பொறுப்பில்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் சொல்லுக்குச் சொல், “பிணைகளின் மகன்கள்”; உத்தரவாதமாகப் பிடித்து வைக்கப்பட்ட நபர்களை, அதாவது பிணைக்கைதிகளைக் குறித்திருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: பொன், வெள்ளி அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையைக் காத்து, பொன்னையும் வெள்ளியையும் தனித்தனியாகக் குறிப்பிடுகிறது; நவீனத் தமிழில் இயல்பான சொல் வரிசை பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּל הַכֵּלִים
  choice: எல்லாப் பொருட்களையும்
  rationale: כֵּלִים என்பது பாத்திரங்கள், கருவிகள், புனிதப் பயன்பாட்டுப் பொருட்கள் ஆகியவற்றை உள்ளடக்கக்கூடிய பரந்த சொல். சூழலில் தேவையற்ற அளவு பொருளைக் குறுக்காமல் “பொருட்கள்” என வழங்கப்பட்டுள்ளது.
- source_word: הַנִּמְצְאִים
  choice: காணப்பட்ட
  rationale: இந்தப் பங்கேற்பு வடிவம் அங்கு இருந்த அல்லது கண்டெடுக்கப்பட்ட பொருட்களைக் குறிக்கிறது; “காணப்பட்ட” மூலத்தின் இரு நிழற்பொருள்களையும் இயல்பாகத் தாங்குகிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயம்
  rationale: சொல்லுக்குச் சொல் “தேவனுடைய வீடு” என்றாலும், இச்சூழலில் எருசலேம் ஆலயத்தைக் குறிக்கும் பொருளை நவீனத் தமிழில் தெளிவாகவும் மரியாதையாகவும் வழங்குகிறது.
- source_word: עִם עֹבֵד אֱדוֹם
  choice: ஓபேத்-ஏதோமிடம்
  rationale: עִם என்பதன் அடிப்படைப் பொருள் “உடன்”; இங்கு பொருட்கள் ஓபேத்-ஏதோமிடம் இருந்தன அல்லது அவரது பொறுப்பில் இருந்தன என்பதைக் குறிக்கலாம். “-இடம்” இந்தத் திட்டமிட்ட தெளிவின்மையைத் தமிழில் ஓரளவு காக்கிறது.
- source_word: אֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: அரச அரண்மனையின் பொக்கிஷங்கள்
  rationale: אֹצְרוֹת என்பது பொக்கிஷங்களையோ பொக்கிஷ அறைகளையோ குறிக்கலாம். கொள்ளையிடப்பட்ட மதிப்புள்ள உடைமைகள் இங்கு மையமாக இருப்பதால் “பொக்கிஷங்கள்” பொருத்தமானது; “அரச அரண்மனை” என்பது בֵּית הַמֶּלֶךְ என்பதன் சூழல்சார் இயல்பான தமிழ்.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: பிணைக்கைதிகள்
  rationale: சொற்றொடர் சொல்லுக்குச் சொல் “பிணைகளின் மகன்கள்” எனினும், பாதுகாப்பு அல்லது உத்தரவாதமாகப் பிடித்து வைக்கப்பட்ட நபர்களைக் குறிக்கும் வாய்ப்பு அதிகம். “பிணைக்கைதிகள்” தெளிவான நவீனத் தமிழ்; மூலத்தின் அரிய சொற்றொடர் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַיָּשָׁב שֹׁמְרוֹן
  choice: சமாரியாவுக்குத் திரும்பினான்
  rationale: வினை கதைநடையைத் தொடர்கிறது; முந்தைய சூழலிலுள்ள ஒருமை ஆண்பால் எழுவாய் தமிழில் வெளிப்படையாகக் காட்டப்பட்டுள்ளது.
