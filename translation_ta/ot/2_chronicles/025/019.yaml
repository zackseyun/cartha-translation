  text: אָמַ֗רְתָּ הִנֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּ/נְשָׂאֲ/ךָ֥ לִבְּ/ךָ֖ לְ/הַכְבִּ֑יד עַתָּה֙ שְׁבָ֣/ה בְּ/בֵיתֶ֔/ךָ לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
translation:
  language: ta
  text: நீ, ‘இதோ, நீ ஏதோமைத் தோற்கடித்துவிட்டாய்; உன் உள்ளம் உன்னை உயர்த்தி, பெருமை கொள்ளச் செய்தது.[a] இப்போது உன் வீட்டிலேயே இரு. நீயும் உன்னோடு யூதாவும் வீழும்படி, ஏன் கேட்டைத் தூண்டுகிறாய்?’ என்று சொன்னாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் உள்ளம் உன்னை மகிமை அடைய உயர்த்தியது” அல்லது “உன் உள்ளம் உன்னைப் பெருமைப்படுத்த உயர்த்தியது.” வெற்றிக்குப் பின் தன்னைத்தானே உயர்த்திக்கொள்ளும் மனநிலையை எபிரெயச் சொற்றொடர் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: நீ சொன்னாய்
  rationale: Qal இறந்தகால இரண்டாம் நபர் ஆண்பால் ஒருமையை நேரடியாகக் காட்டுகிறது; தொடரும் கூற்றை அறிமுகப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து வலியுறுத்தும் எபிரெயச் சுட்டிடைச்சொல்லின் இயல்பான நவீனத் தமிழ் இணை.
- source_word: הִכִּיתָ אֶת אֱדוֹם
  choice: நீ ஏதோமைத் தோற்கடித்துவிட்டாய்
  rationale: נכה என்பதன் Hiphil வடிவம் இப்போர்ச் சூழலில் தாக்கி வெல்வதைக் குறிக்கிறது; வெறும் உடல் தாக்குதலைவிட இராணுவ வெற்றியைத் தெளிவாகக் கூறுகிறது.
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  choice: உன் உள்ளம் உன்னை உயர்த்தி
  rationale: உள்ளம் ஒருவரை உயர்த்துகிறது என்ற மூல உருவகத்தைத் தக்கவைத்து, வெற்றியால் எழுந்த செருக்கை உணர்த்துகிறது.
- source_word: לְהַכְבִּיד
  choice: பெருமைபாராட்ட வைத்தது
  rationale: כבד என்பதன் Hiphil infinitive இங்கு தன்னை உயர்வாகக் கருதி பெருமைபாராட்டும் விளைவைத் தருகிறது; மூலத்தின் பொருள் விரிவை அடிக்குறிப்பில் தக்கவைக்கிறது.
- source_word: עַתָּה שְׁבָה בְּבֵיתֶךָ
  choice: இப்போது உன் வீட்டிலேயே இரு
  rationale: போருக்குப் புறப்படாமல் தன் இடத்திலேயே இருக்குமாறு கூறும் கட்டளையை இயல்பான தமிழில் வழங்குகிறது.
- source_word: לָמָּה תִתְגָּרֶה בְּרָעָה
  choice: ஏன் பேரழிவை வலிய வரவழைக்கிறாய்?
  rationale: Hitpael வடிவம் தீங்கைத் தூண்டும் மோதலில் வேண்டுமென்றே இறங்குவதைச் சுட்டுகிறது; רָעָה இச்சூழலில் ஒழுக்கத் தீமையை அல்ல, நேரவிருக்கும் கேடு அல்லது பேரழிவைக் குறிக்கிறது.
- source_word: וְנָפַלְתָּ אַתָּה וִיהוּדָה עִמָּךְ
  choice: நீயும் உன்னுடன் யூதாவும் வீழ்ந்துபோகும்படி
  rationale: அரசனின் வீழ்ச்சி அவனோடு யூதாவையும் இழுத்துச் செல்லும் என்ற எச்சரிக்கையின் விளைவைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
