translation_notes:
  register: நவீன தரத் தமிழில், அரசருக்குரிய எச்சரிக்கையின் கண்ணியத்தையும் கூர்மையையும் தக்கவைக்கும் நடை. ‘உள்ளம் உன்னை உயர்த்தி’ என்பதில் எபிரெய உருவகம் காக்கப்பட்டுள்ளது; ‘வலிய வரவழைக்கிறாய்’ என்பது வேண்டுமென்றே கேட்டைத் தேடும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
