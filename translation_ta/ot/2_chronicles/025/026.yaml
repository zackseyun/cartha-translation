revisions:
- from: அமத்சியாவின் மற்ற செயல்கள்[a], தொடக்கமுதல் முடிவுவரை, யூதா மற்றும் இஸ்ரவேல் அரசர்களின் புத்தகத்தில்[b] எழுதப்பட்டுள்ளன அல்லவா?
  to: அமசியாவின் மீதமுள்ள செயல்கள்[a], தொடக்கம் முதல் முடிவு வரை, யூதா மற்றும் இஸ்ரவேலின் அரசர்களின் நூலில்[b] எழுதப்பட்டுள்ளன அல்லவா?
  rationale: The revision preserves the Hebrew formula and rhetorical force while using the established Tamil form of the name, accurately rendering ‘the rest,’ and clarifying the lexical footnote. ‘நூலில்’ is a natural archival equivalent for the documentary reference.
