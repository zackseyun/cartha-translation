base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/026.yaml
  text: The rest of the acts of Amaziah[a], from first to last[b], are they not written in the Book of the Kings of Judah and Israel?
translation:
  language: ta
  text: அமசியாவின் மீதமுள்ள செயல்கள்[a], தொடக்கம் முதல் முடிவு வரை, யூதா மற்றும் இஸ்ரவேலின் அரசர்களின் நூலில்[b] எழுதப்பட்டுள்ளன அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘அமசியாவின் மீதமுள்ள காரியங்கள், முதலானவையும் கடைசியானவையும்.’ அரச வரலாற்றுச் சுருக்கங்களில் ‘காரியங்கள்’ என்பது அவருடைய செயல்களையும் ஆட்சிக்கால நிகழ்வுகளையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘புத்தகத்தின்மேல்’; ஓர் ஆவணத்தில் பதிவு செய்யப்பட்டிருப்பதைக் குறிக்கத் தமிழில் ‘நூலில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: மற்ற செயல்கள்
  rationale: அரசர்களைப் பற்றிய நிறைவுச் செய்திகளில் דִּבְרֵי என்பது வெறும் ‘சொற்கள்’ என்பதைக் காட்டிலும் அவர்களுடைய செயல்களையும் ஆட்சிக்கால நிகழ்வுகளையும் குறிக்கிறது. ‘மற்ற செயல்கள்’ என்பது தமிழில் இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: אֲמַצְיָהוּ
  choice: அமத்சியா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: தொடக்கமுதல் முடிவுவரை
  rationale: சொல்லுக்குச் சொல் ‘முந்தினவையும் பிந்தினவையும்’ என்றாலும், அரசனுடைய வாழ்வு அல்லது ஆட்சியின் முழுக் காலப்பரப்பையும் குறிக்கும் இணைச்சொற்றொடரை இயல்பான தமிழில் இது தெளிவாகத் தருகிறது.
- source_word: הֲלֹא הִנָּם כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன அல்லவா?
  rationale: நேர்மறையான பதிலை எதிர்பார்க்கும் எபிரெய வினாவமைப்பின் வலியுறுத்தலைத் தமிழின் ‘அல்லவா?’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: עַל סֵפֶר
  choice: புத்தகத்தில்
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், ஓர் ஆவணத்தில் பதிவு செய்யப்பட்டிருப்பதைக் குறிக்கும் இச்சூழலில் தமிழில் ‘புத்தகத்தில்’ என்பதே இயல்பானது.
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: யூதா மற்றும் இஸ்ரவேல் அரசர்களின்
  rationale: எபிரெய மூலத்தின் பெயர் வரிசையை அப்படியே காத்து, மேற்கோள் காட்டப்படும் நூலின் அடையாளத்தை மிகைப்படுத்தாமல் வழங்குகிறது.
