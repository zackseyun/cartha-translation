translation_notes:
  register: நவீன பொதுத்தமிழில், வேதாகம வரலாற்று நடைக்கு ஏற்ற கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இல்லாத தொடக்கக் காலக்குறிப்பு எதுவும் சேர்க்கப்படவில்லை. இறுதி வினா, மூலத்தின் சொல்லாட்சிசார் வினாவையும் அது எதிர்பார்க்கும் உறுதிப்படுத்தும் பதிலையும் காக்கிறது.
