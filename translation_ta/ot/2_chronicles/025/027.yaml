base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: From the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
translation:
  language: ta
  text: 'அமத்சியா யாவேவைப் பின்பற்றுவதிலிருந்து விலகியதுமுதல்[a], எருசலேமில் அவனுக்கு எதிராகச் சதி செய்தார்கள். அவன் லாகீசுக்குத் தப்பியோடினான்; ஆனால் அவர்கள் அவனைத் தொடர்ந்து லாகீசுக்கு அனுப்பினார்கள்; அங்கே அவனைக் கொன்றார்கள்.


    [a] எபிரெயத்தில், “யாவேவுக்குப் பின்னால் செல்வதிலிருந்து விலகினான்” என்று உள்ளது; அதாவது, அவன் யாவேவைப் பின்பற்றுவதை நிறுத்திவிட்டான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யாவேவுக்குப் பின்னால் செல்வதிலிருந்து விலகினான்” என்று உள்ளது; அதாவது, அவன் யாவேவைப் பின்பற்றுவதை நிறுத்திவிட்டான்.
    reason: எபிரெய மரபுத்தொடரின் சொல்லடிப்படையான வடிவத்தையும் அதன் சூழல் பொருளையும் துல்லியமாகக் காட்டுகிறது.
lexical_decisions:
- source_word: וּמֵעֵת אֲשֶׁר
  choice: காலமுதல்
  rationale: சதி தொடங்கிய காலப்புள்ளியைச் சுட்டும் எபிரெய காலத் தொடரை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: סָר
  choice: விலகிய
  rationale: இங்கு உடல்ரீதியான இடமாற்றம் அல்ல, யாவேவைப் பின்பற்றுவதிலிருந்து ஏற்பட்ட சமய விலகலே குறிக்கப்படுகிறது.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: யாவேவைப் பின்பற்றுவதிலிருந்து
  rationale: ‘யாவேவுக்குப் பின்னாலிருந்து’ என்ற எபிரெய மரபுத்தொடரின் பொருளைத் தெளிவாகவும் அதன் உடன்படிக்கை சார்ந்த வலிமையைத் தக்கவைத்தும் வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப்பெயரைப் பட்டப்பெயராக மாற்றாமல் பெயராக ஒலிபெயர்க்கிறது.
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: அவனுக்கு எதிராகச் சதி செய்தார்கள்
  rationale: வினைச்சொல்–பெயர்ச்சொல் இணைப்பின் சதி பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיָּנָס לָכִישָׁה
  choice: அவன் லாகீசுக்குத் தப்பியோடினான்
  rationale: ஆபத்திலிருந்து ஓடிச் செல்லும் பொருளையும் லாகீசை நோக்கிய திசையையும் தெளிவாகத் தருகிறது.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה
  choice: அவர்கள் அவனைப் பின்தொடர்ந்து லாகீசுக்கு ஆட்களை அனுப்பி
  rationale: ‘அவனுக்குப் பின்னால் அனுப்பினார்கள்’ என்ற எபிரெய அமைப்பில் மறைமுகமாக உள்ள அனுப்பப்பட்ட நபர்களைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; துரத்திச் சென்ற கருத்தையும் காக்கிறது.
- source_word: וַיְמִיתֻהוּ שָׁם
  choice: அங்கே அவனைக் கொன்றார்கள்
  rationale: வேண்டுமென்றே அவனுடைய மரணத்தை ஏற்படுத்திய செயலைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல வசனத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுவான பட்டப்பெயரால் மாற்றாமல் தக்கவைக்கிறது.
- issue: מֵאַחֲרֵי יְהוָה என்ற மரபுத்தொடரின் பொருள்
  choice: யாவேவைப் பின்பற்றுவதிலிருந்து விலகிய
  alternative: யாவேவுக்குப் பின்னாலிருந்து விலகிய
  rationale: சொல்லுக்குச் சொல் அமைப்பை அடிக்குறிப்பில் காத்து, முதன்மை உரையில் சமயப் பின்பற்றுதலை நிறுத்திய பொருளைத் தெளிவாக்குகிறது; அவனுடைய விலகலின் தன்மையை அதற்கு மேலாக விளக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியும், கண்ணியமான வரலாற்று நடையைப் பயன்படுத்துகிறது. எபிரெய வாக்கியத்தின் தொடர்ச்சியைத் தமிழில் வாசிக்க ஏற்ற இரண்டு வாக்கியங்களாக அமைத்துள்ளது; இரண்டாவது தொடரிலுள்ள எதிர்மறை நகர்வை ‘ஆனால்’ வெளிப்படுத்துகிறது. குறிப்பிடப்படாத சதியாளர்களின் அடையாளம் மூலத்தைப் போலவே குறிப்பிடப்படாமல் விடப்பட்டுள்ளது.
