base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
translation:
  language: ta
  text: அப்பொழுது இஸ்ரவேலின் அரசன் யோவாஸ் மேலே சென்றான்; அவனும் யூதாவின் அரசன் அமத்சியாவும் யூதாவுக்குச் சொந்தமான பெத்-ஷெமேசில் நேருக்கு நேர் எதிர்கொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நேருக்கு நேர் சந்தித்தார்கள்.” எபிரெய மரபுத்தொடர் சொல்லுக்குச் சொல், “முகங்களைப் பார்த்தார்கள்” என வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: மேலே சென்றான்
  rationale: עלה என்பதன் பொதுவான இயக்கப் பொருளை நேரடியாகப் பாதுகாக்கிறது; சூழலில் படையெடுத்துச் சென்ற நுண்ணுணர்வு இருந்தாலும் அதைத் தேவையின்றி வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: நேருக்கு நேர் மோதிக்கொண்டார்கள்
  rationale: ‘முகங்களைப் பார்த்தார்கள்’ என்ற எபிரெய மரபுத்தொடரின் நேருக்கு நேர் சந்தித்தல் என்ற பொருளையும், இப்போர்ச் சூழலின் எதிர்கொள்ளும் தன்மையையும் இயல்பான தமிழில் தருகிறது.
- source_word: הוּא וַאֲמַצְיָהוּ
  choice: அவனும் ... அமத்சியாவும்
  rationale: முந்தைய எழுவாயான யோவாஸைக் குறிக்கும் வலியுறுத்தப்பட்ட சுட்டுப்பெயரையும், இரு தரப்பினரையும் இணைக்கும் எபிரெய அமைப்பையும் பாதுகாக்கிறது.
- source_word: בְּבֵית שֶׁמֶשׁ
  choice: பெத்-ஷெமேசில்
  rationale: சந்திப்பு நடந்த இடத்தைத் தமிழின் இயல்பான இடவேற்றுமையுடன் குறிப்பிடுகிறது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: யூதாவுக்குச் சொந்தமான
  rationale: לִיהוּדָה என்பதிலுள்ள நிலப்பரப்பு உரிமை அல்லது சார்பு உணர்வை ‘யூதாவில் உள்ள’ என்பதைக் காட்டிலும் துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  choice: இஸ்ரவேலின் அரசன் / யூதாவின் அரசன்
  rationale: இரு அரச பட்டங்களையும் நேரடியாகவும் ஒரே சீராகவும் மொழிபெயர்க்கிறது.
