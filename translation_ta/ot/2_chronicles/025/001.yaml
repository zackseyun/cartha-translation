translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய அரசர் காலக்கணக்குச் சூத்திரத்தின் பொருள் காக்கப்பட்டு, தமிழுக்கு இயல்பில்லாத சொல்லுக்குச் சொல் அமைப்பு தவிர்க்கப்பட்டது.
