  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ אֲמַצְיָ֔הוּ וְ/עֶשְׂרִ֣ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְהוֹעַדָּ֖ן מִ/ירוּשָׁלָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
translation:
  language: ta
  text: அமத்சியா அரசனானபோது இருபத்தைந்து வயதாயிருந்தான். அவன் எருசலேமில் இருபத்தொன்பது ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் யெகோவத்தான்; அவள் எருசலேமைச் சேர்ந்தவள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: இருபத்தைந்து வயதாயிருந்தான்
  rationale: இது வயதைக் குறிக்கும் வழக்கமான எபிரெய மொழியமைப்பு; சொல்லுக்குச் சொல் வடிவத்தை விட இயல்பான நவீனத் தமிழில் பொருள் துல்லியமாக வழங்கப்படுகிறது.
- source_word: מָלַךְ
  choice: அரசனானபோது
  rationale: முதல் இடத்தில் வரும் வினைச்சொல், வயது குறிப்பிடப்படும் சூத்திரத்தில் அமத்சியா அரசாட்சியை ஏற்றதைக் குறிக்கிறது.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: இருபத்தொன்பது ஆண்டுகள் ஆட்சி செய்தான்
  rationale: இரண்டாம் இடத்தில் வரும் வினைச்சொல் ஆட்சிக்காலத்தின் நீளத்தைக் குறிக்கிறது; தமிழில் இந்த வடிவம் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டுடன் நகரத்தின் பெயர் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: எபிரெய இணைப்புத் தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְהוֹעַדָּן
  choice: யெகோவத்தான்
  rationale: எபிரெய தனிப்பெயரின் ஒலியமைப்பைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: מִירוּשָׁלָיִם
  choice: அவள் எருசலேமைச் சேர்ந்தவள்
  rationale: מִן என்னும் முன்னொட்டு இங்கு அவளுடைய ஊர் அல்லது பிறப்பிடத் தொடர்பைக் குறிக்கிறது; தமிழில் இயல்பாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
