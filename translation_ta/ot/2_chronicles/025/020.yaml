  text: וְ/לֹא שָׁמַ֣ע אֲמַצְיָ֔הוּ כִּ֤י מֵ/הָֽ/אֱלֹהִים֙ הִ֔יא לְמַ֖עַן תִּתָּ֣/ם בְּ/יָ֑ד כִּ֣י דָֽרְשׁ֔וּ אֵ֖ת אֱלֹהֵ֥י אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
translation:
  language: ta
  text: ஆனால் அமத்சியா செவிகொடுக்கவில்லை; அவர்களை எதிரிகளின் கையில்[a] ஒப்புக்கொடுப்பதற்காக இது கடவுளிடமிருந்து வந்தது; ஏனெனில், அவர்கள் ஏதோமின் தெய்வங்களை நாடியிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “கையில்” என்று உள்ளது; இது ஒருவரை மற்றொருவரின் அதிகாரத்திற்குள் ஒப்புக்கொடுப்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: செவிகொடுக்கவில்லை
  rationale: இங்கு வெறுமனே கேட்பதை அல்ல, எச்சரிக்கையை ஏற்றுக்கொண்டு அதன்படி நடப்பதைக் குறிக்கிறது.
- source_word: מֵהָאֱלֹהִים הִיא
  choice: இது கடவுளிடமிருந்து வந்தது
  rationale: பெண்பால் சுட்டுப்பெயர் முன் விவரிக்கப்பட்ட நிலைமை அல்லது நிகழ்வைக் குறிப்பதாகத் தோன்றுகிறது; தெய்வீகக் காரணத்தை அளவுக்கு மீறி விளக்காமல் இத்தொடர் காக்கிறது.
- source_word: לְמַעַן
  choice: ஒப்புக்கொடுப்பதற்காக
  rationale: நோக்கம் அல்லது விளைவைச் சுட்டும் எபிரெய இணைப்பின் நோக்கப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: תִּתָּם
  choice: அவர்களை ... ஒப்புக்கொடுப்பதற்காக
  rationale: נתן என்பதும் ‘கையில்’ என்ற தொடரும் சேர்ந்து ஒருவரை மற்றொருவரின் அதிகாரத்திற்கு ஒப்புக்கொடுப்பதைக் குறிக்கின்றன.
- source_word: בְּיָד
  choice: எதிரிகளின் கையில்
  rationale: ‘கையில்’ என்பது அதிகாரத்திற்குள் ஒப்புக்கொடுத்தல் என்ற எபிரெய மரபுத்தொடர். ‘எதிரிகள்’ என்பது உடனடி கதைச்சூழலிலிருந்து தெளிவுக்காக வழங்கப்படுகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דָרְשׁוּ
  choice: நாடியிருந்தார்கள்
  rationale: ஒரு தெய்வத்தைச் சார்ந்து தேடுதல் அல்லது வழிபாட்டு உதவியை நாடுதல் என்ற பரந்த சமயப் பொருளை, தேவையற்ற விளக்கம் இன்றி காக்கிறது.
- source_word: אֱלֹהֵי אֱדוֹם
  choice: ஏதோமின் தெய்வங்கள்
  rationale: ஏதோமியர்கள் வழிபட்ட தெய்வங்களைக் குறிக்கும் எபிரெய இணைப்பின் நேரான, இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: அமத்சியா செவிகொடுக்காததிலும் தோல்வியிலும் கடவுளின் காரணச் செயல்
  choice: அமத்சியா செவிகொடுக்காத நிலை கடவுளிடமிருந்து வந்தது என்றும், சிலைவழிபாட்டின் காரணமாக அவர்களைத் தோல்விக்கு ஒப்புக்கொடுப்பதே அதன் நோக்கம் அல்லது விளைவு என்றும் வசனம் கூறுவதைக் காத்தல்.
  alternative: இதை கடவுளின் செயற்பட்ட நோக்கமாக அல்லாமல், அவர் வெறுமனே அனுமதித்ததாக மென்மைப்படுத்துதல்.
  rationale: எபிரெய உரை வெளிப்படையாக ‘கடவுளிடமிருந்து’ என்று கூறி, לְמַעַן மூலம் நோக்கத்தை அல்லது நோக்கமுடைய விளைவைச் சுட்டுகிறது. ஆகவே தெய்வீகச் செயலாண்மையை மென்மைப்படுத்தாமலும், உரைக்கு அப்பாற்பட்ட இறையியல் விளக்கத்தைச் சேர்க்காமலும் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம வரலாற்றுரைக்கு ஏற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘செவிகொடுக்கவில்லை’ என்பது அறிவுரையை ஏற்க மறுத்த பொருளையும், ‘நாடியிருந்தார்கள்’ என்பது சமயச் சார்பின் பரந்த பொருளையும் இயல்பாகத் தருகின்றன.
