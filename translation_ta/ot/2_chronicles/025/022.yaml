revisions:
- from: யூதா இஸ்ரவேலுக்கு முன்பாகத் தோற்கடிக்கப்பட்டது; ஒவ்வொருவனும் தன் கூடாரத்துக்கு ஓடிப்போனான்.
  to: இஸ்ரவேலின் முன்னிலையில் யூதா தோற்கடிக்கப்பட்டது; ஒவ்வொருவனும் தன் கூடாரத்துக்குத் தப்பியோடினான்.[a]
