base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/022.yaml
  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: ta
  text: இஸ்ரவேலின் முன்னிலையில் யூதா தோற்கடிக்கப்பட்டது; ஒவ்வொருவனும் தன் கூடாரத்துக்குத் தப்பியோடினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், «ஒவ்வொருவனும் தன் கூடாரத்துக்கு» என்பது ஒவ்வொருவரும் தத்தம் இடங்களுக்குச் சிதறித் தப்பியோடுவதைக் குறிக்கும் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: தோற்கடிக்கப்பட்டது
  rationale: நָגַף என்பதன் நிஃபால் வடிவம் இப்போர்ச் சூழலில் உடலால் தாக்கப்படுவதை மட்டுமல்ல, போரில் தோல்வியடைவதைக் குறிக்கிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: தெற்கு அரசின் மரபான தமிழ்ப் பெயர்ப்பெயர்.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: எதிரியின் முன்னிலையில் தோற்று நிற்பதைக் குறிக்கும் எபிரெயப் போர்மொழியைத் தக்கவைக்கிறது; தமிழிலும் பொருள் புரிகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: வடக்கு அரசின் மரபான தமிழ்ப் பெயர்ப்பெயர்.
- source_word: וַיָּנֻסוּ
  choice: ஓடிப்போனான்
  rationale: נוּס என்பது ஆபத்திலிருந்து தப்பி ஓடுதலைக் குறிக்கிறது; பகிர்வுப் பொருளுள்ள ஒருமை எழுவாயோடு இயல்பான தமிழில் ஒருமையாக வழங்கப்பட்டது.
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: போர்வீரர்களைக் குறிக்கும் பகிர்வுப் பொருளுள்ள ஆண்பால் ஒருமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְאֹהָלָיו
  choice: தன் கூடாரத்துக்கு
  rationale: சொல்லாட்சியின் கூடார உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் ஒவ்வொருவரும் தத்தம் இடத்துக்குச் சிதறி ஓடியதைக் குறிக்கிறது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுக் கதைநடைக்கு ஏற்ற கண்ணியமானவும் எளிதில் புரியக்கூடியவுமான நடை. எபிரெய மொழியின் ‘இஸ்ரவேலுக்கு முன்பாக’ என்ற போர்மொழியும் ‘தன் கூடாரத்துக்கு’ என்ற உருவகமும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
