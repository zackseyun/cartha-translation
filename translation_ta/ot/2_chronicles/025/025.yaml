base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/025.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
translation:
  language: ta
  text: யூதாவின் அரசனான யோவாசின் மகன் அமத்சியா, இஸ்ரவேலின் அரசனான யெகோவாகாசின் மகன் யோவாஸ் இறந்தபின் பதினைந்து ஆண்டுகள் வாழ்ந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “யோவாஸ் இறந்தபின் பதினைந்து ஆண்டுகள் வாழ்ந்தான்.” அதாவது, அமத்சியா இஸ்ரவேலின் அரசன் யோவாஸைவிடப் பதினைந்து ஆண்டுகள் அதிகமாக வாழ்ந்தான்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: உயிரோடிருந்தான்
  rationale: חיה என்ற வினை இங்கு ஒரு குறிப்பிட்ட காலம் தொடர்ந்து வாழ்ந்ததைக் குறிக்கிறது. ‘உயிரோடிருந்தான்’ என்பது காலவரிசைக் குறிப்பை இயல்பான தமிழில் தருகிறது; ‘தப்பிப் பிழைத்தான்’ என்பது மூலத்தில் இல்லாத ஆபத்திலிருந்து மீண்டான் என்ற நிழற்பொருளைச் சேர்க்கக்கூடும்.
- source_word: אֲמַצְיָהוּ
  choice: அமத்சியா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு.
- source_word: בֶן יוֹאָשׁ
  choice: யோவாசின் மகன்
  rationale: வம்ச அடையாளத்தைக் குறிக்கும் எபிரெய அமைப்பை இயல்பான தமிழ் உடைமைத் தொடராக வழங்குகிறது.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: யூதாவை ஆளும் அரச பதவியை நேரடியாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: אַחֲרֵי מוֹת
  choice: இறந்தபின்
  rationale: ‘மரணத்திற்குப் பின்’ என்ற பெயர்ச்சொல் அமைப்பைக் காட்டிலும் இயல்பான நவீன தமிழில் அதே கால உறவைத் தெளிவாகக் கூறுகிறது.
- source_word: יְהוֹאָחָז
  choice: யெகோவாகாஸ்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் வேறுபடுத்திக் காட்டும் ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன்
  rationale: இஸ்ரவேலை ஆளும் அரச பதவியை நேரடியாகக் குறிக்கிறது.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: மேலும் பதினைந்து ஆண்டுகள்
  rationale: எண்ணிக்கையைத் துல்லியமாகத் தருகிறது. ‘மேலும்’ என்பது யோவாஸ் இறந்தபிறகும் அமத்சியாவின் வாழ்வு பதினைந்து ஆண்டுகள் தொடர்ந்தது என்பதை இயல்பாகத் தெளிவுபடுத்துகிறது.
