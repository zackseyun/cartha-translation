  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/אֲמַצְיָ֑הוּ וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ נָבִ֔יא וַ/יֹּ֣אמֶר ל֗/וֹ לָ֤/מָּה דָרַ֨שְׁתָּ֙ אֶת אֱלֹהֵ֣י הָ/עָ֔ם אֲשֶׁ֛ר לֹא הִצִּ֥ילוּ אֶת עַמָּ֖/ם מִ/יָּדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
translation:
  language: ta
  text: அப்போது யாவேயின் கோபம் அமத்சியாவுக்கு எதிராகப் பற்றியெரிந்தது. அவர் அவனிடம் ஒரு தீர்க்கதரிசியை அனுப்பினார். அந்தத் தீர்க்கதரிசி அவனிடம், “உன் கையிலிருந்து தங்கள் மக்களை விடுவிக்காத அந்த மக்களின் தெய்வங்களை நீ ஏன் நாடினாய்[a]?” என்று கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விசாரித்தாய்”; “ஆலோசனை நாடினாய்.”
    reason: דרשׁ என்ற எபிரெய வினைச்சொல் இந்த மதச்சூழலில் தேடுதல், விசாரித்தல், ஆலோசனை நாடுதல் ஆகிய பொருள்களை ஏற்கலாம்.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் பற்றியெரிந்தது
  rationale: எபிரெய மொழியின் ‘கோபம் எரிதல்’ என்ற உயிரோட்டமான மரபுத்தொடரை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய மூலத்தில் நேரடியாக வரும் நான்கெழுத்துத் திருப்பெயரைத் தமிழில் வழக்கமான தனிப்பெயர் வடிவில் தருகிறது.
- source_word: בַּאֲמַצְיָהוּ
  choice: அமத்சியாவுக்கு எதிராக
  rationale: கோபத்தைச் சுட்டும் வினைச்சூழலில் בְּ பகைமை நோக்கிய திசையை உணர்த்துவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: נָבִיא
  choice: ஒரு தீர்க்கதரிசி
  rationale: இறைச்செய்தியை அறிவிக்கும் தூதரைக் குறிக்கும் சொல்லுக்கான பொதுவான, புரிந்துகொள்ளக்கூடிய தமிழ் வடிவம்.
- source_word: דָרַשְׁתָּ
  choice: நாடினாய்
  rationale: தேடுதல், விசாரித்தல், ஆலோசனை நாடுதல் ஆகிய சாத்தியங்களை உள்ளடக்கி, வழிபட்டாய் என்று தேவையின்றி பொருளைக் குறுக்காமல் விடுகிறது.
- source_word: אֱלֹהֵי הָעָם
  choice: அந்த மக்களின் தெய்வங்கள்
  rationale: சூழலில் ஏற்கெனவே குறிப்பிடப்பட்ட தோற்கடிக்கப்பட்ட மக்களைச் சுட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: אֲשֶׁר לֹא הִצִּילוּ
  choice: விடுவிக்காத
  rationale: அந்தத் தெய்வங்கள் விடுவிக்கவில்லை என்ற மூலத்தின் கூற்றை மட்டும் தருகிறது; ‘விடுவிக்க முடியாத’ என்று திறனின்மையை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: עַמָּם
  choice: தங்கள் மக்களை
  rationale: மூலத்திலுள்ள உடைமைப் பொருளை நெருக்கமாகக் காக்கிறது; ‘சொந்த’ என்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: מִיָּדֶךָ
  choice: உன் கையிலிருந்து
  rationale: அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரெய உருவகத்தைத் தெளிவாகவும் நேரடியாகவும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத்திருப்பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, இறைவனின் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர் நேரடியாக உள்ளது; ஆகவே பட்டத்தால் மாற்றாமல் தனிப்பெயராகத் தரப்பட்டது.
- issue: தெய்வங்கள் விடுவிக்காததா அல்லது விடுவிக்க முடியாததா
  choice: விடுவிக்காத
  alternative: விடுவிக்க முடியாத
  rationale: לֹא הִצִּילוּ என்பது நிகழாத செயலைக் கூறுகிறது; அவற்றின் இயலாமையை வெளிப்படையாகக் கூறுவது சூழலுக்கு ஏற்ற கருத்தாக இருந்தாலும், மூலத்தைவிட விளக்கமாகிவிடும்.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘கோபம் பற்றியெரிந்தது’, ‘உன் கையிலிருந்து’ ஆகிய மூல உருவகங்கள் வாசகருக்குப் புரியும் வகையில் காக்கப்பட்டுள்ளன; நேரடி உரையில் ஒருமை நெருக்கத்தை வெளிப்படுத்த ‘நீ/உன்’ பயன்படுத்தப்பட்டுள்ளது.
