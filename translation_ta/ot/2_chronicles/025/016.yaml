base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
translation:
  language: ta
  text: அவன் அரசனிடம் பேசிக்கொண்டிருக்கையில், அரசன் அவனிடம், “உன்னை அரசனுக்கு ஆலோசகராக நியமித்தோமா?[a] நிறுத்து! அவர்கள் உன்னை ஏன் அடிக்க வேண்டும்?[b]” என்றான். எனவே தீர்க்கதரிசி பேசுவதை நிறுத்திவிட்டு, “நீ இதைச் செய்ததாலும் என் ஆலோசனைக்குச் செவிகொடுக்காததாலும், உன்னை அழிக்கக் கடவுள் தீர்மானித்திருக்கிறார்[c] என்பதை நான் அறிவேன்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனின் ஆலோசகராக உன்னை நியமித்தோமா?”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவர்கள் உன்னை ஏன் அடிக்க வேண்டும்?” ‘அவர்கள்’ என்று குறிப்பிடப்படுபவர்கள் யார் என்பது சொல்லப்படவில்லை; அரசனின் கட்டளைப்படி தீர்க்கதரிசியைத் தண்டிப்பவர்களை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உன்னை அழிக்கக் கடவுள் திட்டமிட்டிருக்கிறார்.” இதற்கான எபிரெய வினைச்சொல் அடிப்படையில் ஆலோசித்தல் அல்லது திட்டமிடுதலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ
  choice: உன்னை அரசனுக்கு ஆலோசகராக நியமித்தோமா?
  rationale: வினாவிடை வடிவிலான அரசனின் கடுமையான கண்டிப்பைப் பாதுகாக்கிறது. נתן இச்சூழலில் ஒருவரைப் பதவியில் ‘நியமித்தல்’ என்ற பொருளைத் தருகிறது.
- source_word: חֲדַל
  choice: நிறுத்து!
  rationale: தீர்க்கதரிசி பேசுவதை உடனடியாக நிறுத்தும்படி கூறும் சுருக்கமான, வலுவான கட்டளை.
- source_word: לָמָּה יַכּוּךָ
  choice: அவர்கள் உன்னை ஏன் அடிக்க வேண்டும்?
  rationale: எபிரெயத்தில் உள்ள குறிப்பிடப்படாத பன்மை எழுவாயை ‘அவர்கள்’ என்று வெளிப்படையாகத் தக்கவைக்கிறது; נכה என்பதன் அடித்தல் அல்லது தாக்குதல் சார்ந்த பொருளையும் மிகைப்படுத்தாமல் தருகிறது.
- source_word: יָעַץ אֱלֹהִים
  choice: கடவுள் தீர்மானித்திருக்கிறார்
  rationale: יעץ என்பதன் அடிப்படை ஆலோசித்தல் அல்லது திட்டமிடுதல் சார்ந்த பொருள் இங்கு கடவுளின் உறுதியான நோக்கத்தைக் குறிக்கிறது. இயல்பான தமிழில் ‘தீர்மானித்திருக்கிறார்’ அந்தச் சூழல் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לְהַשְׁחִיתֶךָ
  choice: உன்னை அழிக்க
  rationale: שׁחת என்பதன் காரணவினை வடிவம் அழிவை ஏற்படுத்துவதைக் குறிக்கிறது; ‘அழிக்க’ என்பது நேரடியான இயல்பான மொழிபெயர்ப்பு.
- source_word: וְלֹא שָׁמַעְתָּ לַעֲצָתִי
  choice: என் ஆலோசனைக்குச் செவிகொடுக்காததாலும்
  rationale: שׁמע என்பது கேட்பதையும் அதன்படி நடப்பதையும் உள்ளடக்கலாம். ‘செவிகொடுக்காதது’ இவ்விரு நுணுக்கங்களையும் இயல்பாகக் கொண்டுள்ளது.
theological_decisions:
- issue: יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ என்பதில் கடவுளின் நோக்கம்
  choice: உன்னை அழிக்கக் கடவுள் தீர்மானித்திருக்கிறார்
  alternative: உன்னை அழிக்கக் கடவுள் திட்டமிட்டிருக்கிறார்
  rationale: எபிரெய உரை கடவுளின் அழிவுத் தீர்ப்பை உறுதியான நோக்கமாக முன்வைக்கிறது. அதை மென்மைப்படுத்தாமலும் கூடுதல் கோட்பாட்டு விளக்கத்தைச் சேர்க்காமலும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. அரசனின் குறுகிய மிரட்டலும் தீர்க்கதரிசியின் உறுதியான பதிலும் தக்கவைக்கப்பட்டுள்ளன. ‘அவர்கள்’ என்ற குறிப்பிடப்படாத எழுவாயும் கடவுளின் அழிவுத் தீர்ப்பு குறித்த இறையியல் பதற்றமும் விளக்கிச் சமப்படுத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
