  source_fidelity: 'மூல எபிரெய உரையின் பேச்சாளர் அமைப்பு சரியாகக் காக்கப்பட்டுள்ளது: அரசனே தீர்க்கதரிசியிடம் கேள்வி எழுப்புகிறான்; தீர்க்கதரிசி அரசனின் ஆலோசகர் எனத் தவறாக அடையாளப்படுத்தப்படவில்லை. ‘நியமித்தோமா?’ என்பது נְתַנּוּךָ என்ற 1-பன்மை வினாவைத் தக்கவைக்கிறது. குறிப்பிடப்படாத பன்மை எழுவாயான ‘அவர்கள்’, தீர்க்கதரிசி பேசுவதை நிறுத்துதல், கடவுள் அழிவைத் தீர்மானித்திருப்பதாகக் கூறுதல், மற்றும் தீர்க்கதரிசியின் ஆலோசனைக்குச் செவிகொடுக்காமை அனைத்தும் பொருத்தமாக மொழிபெயர்க்கப்பட்டுள்ளன.'
