source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶ֖ם לֹ֣א הֵמִ֑ית כִּ֣י כַ/כָּת֣וּב בַּ/תּוֹרָ֡ה בְּ/סֵ֣פֶר מֹשֶׁה֩ אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יָמ֨וּתוּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יָמ֣וּתוּ עַל אָב֔וֹת כִּ֛י אִ֥ישׁ בְּ/חֶטְא֖/וֹ יָמֽוּתוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
translation:
  language: ta
  text: 'ஆனால், அவர்களுடைய மகன்களை அவன் மரணதண்டனைக்கு உட்படுத்தவில்லை. ஏனெனில், யாவே கட்டளையிட்டுள்ள மோசேயின் நூலாகிய திருச்சட்டத்தில் இவ்வாறு எழுதப்பட்டுள்ளது: “மகன்களுக்காகத் தந்தையர் கொல்லப்படக் கூடாது; தந்தையருக்காக மகன்கள் கொல்லப்படக் கூடாது; ஒவ்வொருவரும் தமது பாவத்திற்காகவே சாவார்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת בְּנֵי/הֶם לֹא הֵמִית
  choice: ஆனால், அவர்களுடைய மகன்களை அவன் கொல்லவில்லை
  rationale: முந்தைய வசனத்தில் கொலையாளிகள் கொல்லப்பட்டதற்கு மாறான செயலை וְ இங்கு அறிமுகப்படுத்துவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. הֵמִית என்பது மரணமடையச் செய்தல் என்ற causative பொருளுடையது; தமிழில் நீதித்துறைச் சூழலிலும் இயல்பாகப் புரியும் ‘கொல்லவில்லை’ பயன்படுத்தப்பட்டது.
- source_word: כִּי כַ/כָּתוּב
  choice: ஏனெனில் ... இவ்வாறு எழுதப்பட்டுள்ளது
  rationale: כִּי காரணத்தையும், כַכָּתוּב எழுதப்பட்டதற்கு ஏற்ப நடந்ததையும் சுட்டுகிறது; இரண்டையும் இயல்பான தமிழில் இந்த அமைப்பு வெளிப்படுத்துகிறது.
- source_word: בַּ/תּוֹרָה בְּ/סֵפֶר מֹשֶׁה
  choice: மோசேயின் நூலாகிய திருச்சட்டத்தில்
  rationale: இரு சொற்றொடர்களையும் ஒரே நூலைக் குறிக்கும் இயல்பான தமிழ் apposition ஆகக் கொடுக்கிறது. תּוֹרָה என்பதன் போதனை-சட்டப் பொருளை ‘திருச்சட்டம்’ தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵ/אמֹר
  choice: யாவே கட்டளையிட்டபடி இவ்வாறு
  rationale: எழுத்திலுள்ள கட்டளையின் தெய்வீக மூலத்தையும், לֵאמֹר மேற்கோளை அறிமுகப்படுத்துவதையும் தக்கவைக்கிறது.
- source_word: לֹא יָמוּתוּ אָבוֹת עַל בָּנִים וּ/בָנִים לֹא יָמוּתוּ עַל אָבוֹת
  choice: மகன்களுக்காகத் தந்தையர் கொல்லப்படக் கூடாது; தந்தையருக்காக மகன்கள் கொல்லப்படக் கூடாது
  rationale: יָמוּתוּ வடிவம் சொற்பட ‘சாவார்கள்’ என்றாலும், சட்டவியல் சூழலில் பிறருடைய குற்றத்துக்காக மரண தண்டனை விதிக்கப்படக்கூடாது என்பதே கருத்து; ‘கொல்லப்படக் கூடாது’ இதைத் தெளிவாக்குகிறது. בָּנִים என்பதற்கான குறிப்பான ‘மகன்கள்’ தக்கவைக்கப்பட்டது.
- source_word: כִּי אִישׁ בְּ/חֶטְא/וֹ יָמוּתוּ
  choice: ஒவ்வொருவரும் தத்தமது பாவத்திற்காகவே சாவார்கள்
  rationale: אִישׁ இங்கு பகிர்வுப் பொருளில் ஒவ்வொரு நபரையும் குறிக்கிறது. எபிரேயில் ஒருமை பெயருடன் பன்மை வினை இருப்பதால், இயல்பான பாலினப் பொதுமை கொண்ட தமிழ் பன்மை அமைப்பு தேர்ந்தெடுக்கப்பட்டது; ‘தத்தமது’ தனிப்பட்ட பொறுப்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைக்குரிய தனிப்பெயரான நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குகிறது.
- issue: பெற்றோர்–மகன்களின் குற்றப் பொறுப்பு
  choice: ஒவ்வொருவரும் தத்தமது பாவத்திற்காகவே சாவார்கள்
  alternative: ஒவ்வொருவரும் தத்தமது பாவத்திற்காகவே கொல்லப்படுவார்கள்
  rationale: முதல் இரு கூறுகள் சட்டப்பூர்வ மரண தண்டனையைத் தெளிவாகக் குறிக்கின்றன; இறுதிக் கூறின் יָמוּתוּ என்பதை ‘சாவார்கள்’ எனச் சற்றே சொற்பட வழங்குவது, தனிப்பட்ட குற்றப் பொறுப்பு மற்றும் மரணம் ஆகியவற்றுக்கிடையிலான மூலத்தின் பதற்றத்தை தேவையின்றி முழுவதும் நீதித்துறை மொழியாகச் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான வேதாகம நடையும் இயல்பான சொற்றொடர் வரிசையும் பயன்படுத்தப்பட்டுள்ளன. தேவையற்ற வடமொழிச் சிக்கல் தவிர்க்கப்பட்டாலும், ‘திருச்சட்டம்’ போன்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டுள்ளது.
