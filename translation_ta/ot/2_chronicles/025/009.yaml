base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
translation:
  language: ta
  text: அமத்சியா கடவுளின் மனிதரிடம், “ஆனால், இஸ்ரவேலின் படைக்குழுவுக்கு நான் கொடுத்த அந்த நூறு தாலந்துகளை[a] என்ன செய்வது?” என்று கேட்டான். கடவுளின் மனிதர் பதிலளித்து, “யாவே உனக்கு இதைவிட மிகுதியாகக் கொடுக்க வல்லவர்[b]” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அந்த நூறு தாலந்துகள்.” முந்தைய வசனம் அவை வெள்ளித் தாலந்துகள் என்று குறிப்பிடுகிறது.
    reason: cross_reference
  - marker: b
    text: அல்லது, “யாவேவிடம் உனக்கு இதைவிட மிகுதியாகக் கொடுப்பதற்குப் போதுமானது உண்டு.” எபிரெயச் சொற்றொடர் யாவேயின் வழங்கும் ஆற்றலையும் வளத்தையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: கடவுளின் மனிதர்
  rationale: தெய்வீக அதிகாரத்துடன் அனுப்பப்பட்ட ஒருவரைக் குறிக்கும் எபிரெயத் தலைப்பின் வடிவத்தைப் பாதுகாக்கிறது; ‘தீர்க்கதரிசி’ என்று பதவியை அளவுக்கு மீறிக் குறிப்பதையும் தவிர்க்கிறது.
- source_word: וּמַה לַּעֲשׂוֹת
  choice: ஆனால் ... என்ன செய்வது?
  rationale: முந்தைய கட்டளைக்கு அமத்சியா எழுப்பும் எதிர்ப்பையும், இனி எடுக்க வேண்டிய நடவடிக்கை குறித்த கேள்வியையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְאַת הַכִּכָּר
  choice: நூறு தாலந்துகள்
  rationale: כִּכָּר என்பது எடையளவான ‘தாலந்து’; ‘வெள்ளி’ என்பது முந்தைய வசனத்தில் உள்ளதே தவிர இவ்வசனத்தில் இல்லை என்பதால் முதன்மை உரையில் சேர்க்கப்படவில்லை.
- source_word: גְדוּד יִשְׂרָאֵל
  choice: இஸ்ரவேலின் படைப்பிரிவு
  rationale: கூலிக்கு அமர்த்தப்பட்ட இராணுவக் குழுவைக் குறிக்கும் சூழலில் גְּדוּד என்பதன் படை சார்ந்த பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: யெகோவா ... உனக்குக் கொடுக்க வல்லவர்
  rationale: யெகோவாவிடம் கொடுப்பதற்கான ஆற்றலும் வளமும் உள்ளன என்பதைச் சுட்டும் எபிரெய இருப்புக் கட்டமைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַרְבֵּה מִזֶּה
  choice: இதைவிட மிகுதியாக
  rationale: ஒப்பீட்டுடன் கூடிய அளவுமிகுதியைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதால் ‘கர்த்தர்’ என்ற பட்டத்தைப் பயன்படுத்தாமல் பெயரையே வழங்குகிறது; ‘யெகோவா’ மற்றும் ‘யாவே’ ஆகிய உச்சரிப்பு மரபுகளில், சாதாரண தமிழ் வாசகர்களுக்கு நன்கு அறிமுகமான ‘யெகோவா’ தேர்ந்தெடுக்கப்பட்டது.
- issue: יֵשׁ לַיהוָה என்ற கட்டமைப்பின் நுண்பொருள்
  choice: கொடுக்க வல்லவர்
  alternative: கொடுப்பதற்கு யெகோவாவிடம் போதுமானது உண்டு
  rationale: இச்சொற்றொடர் தெய்வீக ஆற்றலையோ வளமையையோ வலியுறுத்தலாம். முதன்மை உரை ஆற்றல் சார்ந்த இயல்பான வாசிப்பைத் தருகிறது; வளம் சார்ந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்பின் இயல்பும் காக்கப்பட்டுள்ளன. ‘தாலந்து’ என்ற வரலாற்று எடையளவு மாற்றப்படாமல் வைக்கப்பட்டு அடிக்குறிப்பால் விளக்கப்பட்டுள்ளது; படைச் சூழலில் ‘படைப்பிரிவு’ பயன்படுத்தப்பட்டுள்ளது.
