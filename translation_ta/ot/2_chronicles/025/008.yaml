base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
translation:
  language: ta
  text: ஆனால் நீ போகவே போவாயானால்[a], போரில் துணிவுடன் செயல்படு. கடவுள் உன்னைப் பகைவரின் முன்னிலையில் இடறச் செய்வார்[b]. ஏனெனில் உதவவும் இடறச் செய்யவும் கடவுளுக்கு வல்லமை உண்டு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீ போவாயானால், போருக்காக வலிமைகொள்” அல்லது “போரில் உன்னை வலிமையுள்ளவனாகக் காட்டு.”
    reason: lexical_alternative
  - marker: b
    text: 'எபிரேயத்தில் ஒரே வினைவேர் இருமுறை வருகிறது: கடவுள் உன்னை “இடறச் செய்வார்”; அவருக்கு “உதவவும் இடறச் செய்யவும்” வல்லமை உண்டு.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ஆனால் ... ஆனால்
  rationale: முந்தைய அறிவுறுத்தலுக்கு மாறான ஒரு நிபந்தனையை அறிமுகப்படுத்தும் எபிரேயச் சேர்க்கையின் எதிர்மறைத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בֹּא אַתָּה
  choice: நீ போகத்தான் போவாயானால்
  rationale: வினை வடிவத்தோடு வெளிப்படையான இரண்டாம் நபர் பிரதிப்பெயர் வருவதால் ஏற்படும் வலியுறுத்தலைத் தமிழின் ‘போகத்தான் போவாய்’ என்ற அமைப்பு வெளிப்படுத்துகிறது.
- source_word: עֲשֵׂה חֲזַק לַמִּלְחָמָה
  choice: போரில் துணிவுடன் செயல்படு
  rationale: ‘செய்’ மற்றும் ‘வலிமையான’ என்பவற்றின் எபிரேய மரபுத்தொடரைப் போர்ச் சூழலில் இயல்பாகவும் மிகை விளக்கமின்றியும் அளிக்கிறது.
- source_word: יַכְשִׁילְךָ
  choice: உன்னை ... இடறச் செய்வார்
  rationale: כשל என்பதன் காரணவினைப் பொருளான ‘இடறச் செய்தல்’ என்பதைப் பாதுகாப்பதுடன், வசனத்தின் இறுதியில் அதே வேர் மீண்டும் வருவதையும் தமிழில் காணச் செய்கிறது.
- source_word: לִפְנֵי אוֹיֵב
  choice: பகைவருக்கு முன்பாக
  rationale: பகைவனின் முன்னிலையில் தோல்வியுறச் செய்யப்படுதல் என்ற மூலமொழிப் படிமத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  choice: கடவுளுக்கு வல்லமை உண்டு
  rationale: வல்லமை கடவுளிடம் இருப்பதைத் தெளிவான நவீன தமிழில் கூறி, தொடர்ந்து வரும் இணையான இரண்டு வினையெச்சங்களுக்கும் இயல்பாக வழிவகுக்கிறது.
- source_word: לַעְזֹר וּלְהַכְשִׁיל
  choice: உதவவும் இடறச் செய்யவும்
  rationale: ‘உதவுதல்’ மற்றும் ‘இடறச் செய்தல்’ என்ற எதிரிணையைச் சுருக்கமாகப் பாதுகாக்கிறது; மேலும் כשל வேரின் மறுபயன்பாட்டையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: போரில் ஏற்படும் தோல்வியில் கடவுளின் நேரடி செயற்பாடு
  choice: கடவுள் உன்னை இடறச் செய்வார்; உதவவும் இடறச் செய்யவும் அவருக்கு வல்லமை உண்டு
  alternative: கடவுள் உன்னைத் தோற்க அனுமதிப்பார்
  rationale: எபிரேய உரை தோல்வியை வெறும் அனுமதியாக மென்மைப்படுத்தாமல், கடவுளின் காரணச் செயற்பாட்டை நேரடியாகக் கூறுகிறது. அந்த இறையியல் பதற்றம் தீர்த்துவைக்கப்படாமல் மொழிபெயர்ப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘இடறச் செய்’ என்ற உருவகச் சொல் மூலத்தின் வினைமீளுருவாக்கத்தைப் பாதுகாக்கிறது. ‘போரில் துணிவுடன் செயல்படு’ என்பது சொற்சொல்லான ஆனால் இயல்பற்ற வடிவத்தைத் தவிர்த்து கட்டளையின் வலிமையைத் தக்கவைக்கிறது.
