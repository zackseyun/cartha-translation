  yaml_path: translation/ot/2_chronicles/025/003.yaml
  text: When the kingdom was firmly in his hand[a], he killed his servants who had struck down the king his father.
translation:
  language: ta
  text: அரசாட்சி அவன் வசம் உறுதிப்பட்டபோது[a], அவன் தன் தந்தையாகிய அரசனை அடித்துக் கொன்ற பணியாளர்களைக் கொன்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் விளக்கமாக, ‘அரசாட்சி அவனுடைய கட்டுப்பாட்டில் நிலைபெற்றபோது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: போது
  rationale: எபிரெயக் கதைநடையின் நிகழ்வு மாற்றத்தையும் காலத் தொடர்பையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; மூலத்தில் இல்லாத ‘இப்போது’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  choice: அரசாட்சி அவன் வசம் உறுதிப்பட்டது
  rationale: இங்கு חזק என்பது உடல் வலிமையை அல்ல, அரச அதிகாரம் உறுதியாக நிலைபெற்றதைக் குறிக்கிறது. ממלכה என்பதற்கு இச்சூழலில் நாட்டுப் பரப்பைவிட அரசாட்சி பொருத்தமானது; ‘அவன் வசம்’ என்பது அவனுடைய கட்டுப்பாட்டைக் குறிக்கும் இயல்பான தமிழ் நடை.
- source_word: וַיַּהֲרֹג
  choice: அவன் கொன்றான்
  rationale: הרג என்பதன் நேரடியான, தெளிவான, நவீனத் தமிழ் மொழிபெயர்ப்பு.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்கள்
  rationale: அரசவைக் சூழலில் עבד என்பது அரசனுக்குப் பணிபுரிபவர்களைக் குறிக்கலாம். ‘அடிமைகள்’ என்பது தேவையற்ற அளவு கட்டுப்பட்ட சமூக நிலையைக் குறிப்பதால் தவிர்க்கப்பட்டது; ‘அதிகாரிகள்’ என்பது பொருளை மிகக் குறுக்கிவிடலாம்.
- source_word: הַמַּכִּים
  choice: அடித்துக் கொன்ற
  rationale: נכה என்பதிலுள்ள தாக்கும் வன்முறையைப் பாதுகாக்கிறது; இங்கு அவர்கள் அரசனைக் கொன்றவர்கள் என்பது சூழலால் தெளிவாக இருப்பதால் ‘கொன்ற’ என்பதும் சேர்க்கப்பட்டது.
- source_word: אֶת־הַמֶּלֶךְ אָבִיו
  choice: தன் தந்தையான அரசனை
  rationale: எபிரெயத்தில் உள்ள ‘அரசன்—அவனுடைய தந்தை’ என்ற இணைப்பைத் தமிழில் இயல்பாகவும் தெளிவாகவும் வழங்குகிறது.
