  text: They carried him on horses and buried him with his fathers in the city of Judah[a].
translation:
  language: ta
  text: அவர்கள் அவரைக் குதிரைகளின்மேல்[a] சுமந்துகொண்டு போய், அவருடைய முற்பிதாக்களுடன் யூதாவின் நகரத்தில் அடக்கம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “அந்தக் குதிரைகளின்மேல்.” எபிரெயத்தில் “குதிரைகள்” வெளிப்படையாகப் பன்மையில் உள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: அவர்கள் அவரைச் சுமந்துகொண்டுபோய்
  rationale: נשׂא என்பதன் இச்சூழலுக்குரிய பொருள் இறந்தவரின் உடலை எடுத்துச் செல்லுதல். நவீனத் தமிழில் ‘சுமந்துகொண்டுபோய்’ என்பது செயலும் இடமாற்றமும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל הַסּוּסִים
  choice: குதிரைகளின்மேல்
  rationale: எபிரெயச் சொற்றொடர் முறையாக ‘குதிரைகளின்மேல்’ என்றும், ‘குதிரைகள்’ என்பதைப் பன்மையிலும் குறிப்பிடுகிறது. பாடையில் அல்லது தேரில் என ஊகிக்காமல் மூலத்தின் படிமம் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: அடக்கம் செய்தார்கள்
  rationale: קבר என்பதற்கு இச்சூழலில் இயல்பான, கண்ணியமான நவீனத் தமிழ் ‘அடக்கம் செய்தார்கள்’ ஆகும்.
- source_word: עִם אֲבֹתָיו
  choice: அவருடைய முன்னோர்களுடன்
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய தந்தையர்களுடன்’ என்றாலும், இது குடும்ப அல்லது வம்ச அடக்கத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் ‘முன்னோர்களுடன்’ பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: בְּעִיר יְהוּדָה
  choice: யூதாவின் நகரத்தில்
  rationale: மசோரெட்டிக் மூலத்தில் உள்ள ‘யூதாவின் நகரத்தில்’ என்ற தனித்துவமான வாசகத்தை, ‘தாவீதின் நகரம்’ என்ற பழக்கமான வாசகத்தோடு ஒத்திசைக்காமல் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: அடக்க இடத்தின் பெயரிடல்
  choice: யூதாவின் நகரத்தில்
  alternative: தாவீதின் நகரத்தில்; அல்லது யூதாவில்
  rationale: கொடுக்கப்பட்ட மசோரெட்டிக் உரை ‘யூதாவின் நகரம்’ என்றே வாசிக்கிறது. வேறு இணை அல்லது பழக்கமான சொற்றொடருக்கு ஒத்திசைக்காமல் மூல வாசகத்தின் தனித்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் இயல்பற்றதாகத் தோன்றக்கூடிய ‘யூதாவின் நகரம்’ என்பதும் குதிரைகளின் பன்மையும் விளக்கித் திருத்தப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
