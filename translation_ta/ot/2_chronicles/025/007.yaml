source:
  edition: WLC
  text: וְ/אִ֣ישׁ הָ/אֱלֹהִ֗ים בָּ֤א אֵלָי/ו֙ לֵ/אמֹ֔ר הַ/מֶּ֕לֶךְ אַל יָבֹ֥א עִמְּ/ךָ֖ צְבָ֣א יִשְׂרָאֵ֑ל כִּ֣י אֵ֤ין יְהוָה֙ עִם יִשְׂרָאֵ֔ל כֹּ֖ל בְּנֵ֥י אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
translation:
  language: ta
  text: ஆனால் தேவனுடைய மனிதர் ஒருவர் அவனிடம் வந்து, “அரசே, இஸ்ரவேலின் படை உம்மோடு வர வேண்டாம். ஏனெனில் யாவே இஸ்ரவேலோடும், எப்பிராயீமின் மக்கள் அனைவரோடும்[a] இல்லை” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: “எப்பிராயீமின் மகன்கள் அனைவரோடும்”; அல்லது, “எப்பிராயீமியர் அனைவரோடும்.”'
    reason: எபிரெய בְּנֵי என்ற குடும்பவழிச் சொல்லமைப்பையும் அதன் இயல்பான இனக்குழுப் பொருளையும் பதிவு செய்யும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதர் ஒருவர்
  rationale: இது கடவுளால் அனுப்பப்பட்ட தூதரைக் குறிக்கும் எபிரெய மரபுத்தொடர். ஒருவரை முதன்முறையாக அறிமுகப்படுத்துவதால் ‘ஒருவர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: בָּא אֵלָיו לֵאמֹר
  choice: அவனிடம் வந்து … என்றார்
  rationale: בוא + אֶל என்பது ஒருவரை நோக்கி வருவதைக் குறிக்கிறது; தமிழில் இயல்பான உரையறிமுகமாக ‘வந்து … என்றார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַמֶּלֶךְ
  choice: அரசே
  rationale: நேரடி அழைப்பை இயல்பான தமிழ் விளிவடிவில் தருகிறது.
- source_word: אַל יָבֹא עִמְּךָ
  choice: உம்மோடு வர வேண்டாம்
  rationale: אַל உடனான வினைத் தொடர் தடையைத் தெரிவிக்கிறது; படை அரசனுடன் போர்ப்பயணத்தில் இணைவதை ‘வர வேண்டாம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צְבָא יִשְׂרָאֵל
  choice: இஸ்ரவேலின் படை
  rationale: צָבָא இங்கு போருக்கான இராணுவப் படையைக் குறிக்கிறது.
- source_word: כִּי אֵין יְהוָה עִם יִשְׂרָאֵל
  choice: ஏனெனில் யாவே இஸ்ரவேலோடும் … இல்லை
  rationale: כִּי தடைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; אֵין ... עִם என்பது உடனிராமையைத் தெரிவிக்கிறது.
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  choice: எப்பிராயீமின் மக்கள் அனைவரோடும்
  rationale: ‘எப்பிராயீமின் மகன்கள் அனைவரும்’ என்ற சொற்பொருளை, மக்களைக் கூட்டாகக் குறிக்கும் இயல்பான நவீன தமிழில் தருகிறது; ‘இஸ்ரவேல்’ என்பதன் பின்னர் வரும் எபிரெயச் சொற்றொடரின் இணைப்பையும் நிலைநிறுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது; அதை பொதுப்பட்டமாக மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது.
- issue: இஸ்ரவேலும் எப்பிராயீமின் மக்களும் இடையிலான தொடர்பு
  choice: இஸ்ரவேலோடும், எப்பிராயீமின் மக்கள் அனைவரோடும்
  alternative: இஸ்ரவேலோடு, அதாவது எப்பிராயீமியர் அனைவரோடும்
  rationale: மூலத்தில் விளக்க இணைப்புச்சொல் இல்லை. ஆகவே ‘அதாவது’ என்று வெளிப்படையாகச் சேர்த்து தொடர்பை முற்றிலும் தீர்மானிக்காமல், இரு தொடர்களையும் அடுத்தடுத்து வைத்துள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அரசனை நோக்கிய உரையில் ‘அரசே’, ‘உம்மோடு’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; தீர்க்கதரிசித் தூதருக்கான மரியாதையை ‘வந்தார்/என்றார்’ வினைமுற்றுகள் காட்டுகின்றன.
