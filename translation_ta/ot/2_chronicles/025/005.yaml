base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/005.yaml
  text: Then Amaziah gathered Judah and appointed them by fathers’ houses under commanders of thousands and commanders of hundreds[a], for all Judah and Benjamin. He mustered them from twenty years old and upward, and found them to be three hundred thousand choice men, going out to war[c][b], able to handle spear and shield.
translation:
  language: ta
  text: அப்போது அமத்சியா யூதாவை ஒன்றுகூட்டி, யூதா மற்றும் பென்யமீன் முழுவதிலும் அவர்களைத் தந்தைவழிக் குடும்பங்களின்படி ஆயிரம் பேருக்கான தலைவர்களின் கீழும் நூறு பேருக்கான தலைவர்களின் கீழும் ஒழுங்கமைத்தார். இருபது வயது முதல் அதற்கு மேற்பட்ட வயதுடையவர்களை அவர் கணக்கெடுத்தார்; போருக்குச் செல்லும்[b], ஈட்டியையும் பெரிய கேடயத்தையும்[c] ஏந்திய தேர்ந்த ஆண்கள்[a] மூன்று இலட்சம் பேர் இருப்பதைக் கண்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் בָּחוּר ‘இளைஞர்கள்’ என்றும் பொருள்படலாம்; ஆனால் இந்தப் படைத்துறைக் கணக்கெடுப்பில் அது தேர்ந்த அல்லது உடல்வலிமையுள்ள ஆண்களைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘போருக்குச் செல்லும்’; இது படைத்துறையில் பணியாற்றத் தகுதியுள்ளவர்களையோ போருக்குத் தயாரானவர்களையோ குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயச் சொல் צִנָּה குறிப்பாகப் பெரிய கேடயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ஒன்றுகூட்டி
  rationale: קבץ என்பதன் மக்களைச் சேர்த்தல் அல்லது ஒன்றுகூட்டுதல் என்ற நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּעֲמִידֵם
  choice: கீழ் நிறுத்தினார்
  rationale: ஹிஃபில் வடிவம் ‘நிற்கச் செய்தல்/அமைத்தல்’ என்பதைக் குறிக்கிறது; இங்கு படைத்துறைத் தலைமைக் கட்டமைப்பின்கீழ் அவர்களை அமைத்ததைக் காட்டுகிறது.
- source_word: לְבֵית אָבוֹת
  choice: தந்தைவழிக் குடும்பங்களின்படி
  rationale: பிதாமரபுக் குடும்ப அல்லது குலப் பிரிவுகளைக் குறிக்கும் எபிரெயச் சமூக அமைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  choice: ஆயிரத்துக்குத் தலைவர்களுக்கும் நூற்றுக்குத் தலைவர்களுக்கும் கீழ்
  rationale: படைத்துறைச் சூழலில் שׂרים என்பவர்களின் தலைமையையும் ஆயிரம், நூறு என்ற படைப்பிரிவு அமைப்பையும் பாதுகாக்கிறது.
- source_word: וַיִּפְקְדֵם
  choice: அவர்களைக் கணக்கெடுத்தபோது
  rationale: פקד இங்கு படைத்துறைப் பதிவுக்காக எண்ணுதல் அல்லது கணக்கெடுத்தல் என்ற பொருளுடையது.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: இருபது வயதும் அதற்கு மேற்பட்டவர்களுமாக
  rationale: படைத்துறைத் தகுதிக்கான வயது வரம்பை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַיִּמְצָאֵם
  choice: இருந்ததாகக் கண்டார்
  rationale: கணக்கெடுப்பின் முடிவாக வந்த எண்ணிக்கையை அறிந்தார் என்ற சூழல்சார் பொருளை வெளிப்படுத்துகிறது.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: மூன்று இலட்சம் பேர்
  rationale: எண்ணிக்கையைத் தமிழின் வழக்கமான இலட்சம் முறையில் துல்லியமாகத் தருகிறது.
- source_word: בָּחוּר
  choice: தேர்ந்த வீரர்கள்
  rationale: இந்தப் படைத்துறைச் சூழலில் இச்சொல் இளைஞர்களை மட்டும் அல்லாமல் தேர்ந்த அல்லது வலிமைமிக்க போர்வீரர்களையும் குறிக்கலாம்; ‘தேர்ந்த வீரர்கள்’ சூழலுக்கு ஏற்றது.
- source_word: יוֹצֵא צָבָא
  choice: போருக்குச் செல்லக்கூடிய
  rationale: சொல்லுக்கு நெருக்கமான ‘போருக்குப் புறப்படுகிற’ என்ற கருத்தையும் படைத்துறைச் சேவைக்கான தகுதியையும் மிகையாக விளக்காமல் தருகிறது.
- source_word: אֹחֵז רֹמַח וְצִנָּה
  choice: ஈட்டியையும் பெரிய கேடயத்தையும் ஏந்திய
  rationale: אֹחֵז என்பதன் ‘பிடித்திருத்தல்/ஏந்துதல்’ என்ற நேரடிப் பொருளையும் צִנָּה என்பதன் பெரிய கேடயம் என்ற குறிப்பையும் பாதுகாக்கிறது.
