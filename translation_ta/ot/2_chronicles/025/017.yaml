translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜா’ என்பது பொதுவாகப் புரியும் வேதாகம வரலாற்றுச் சொல்லாகவும், ‘நேருக்கு நேர் சந்திப்போம்’ என்பது மூல மரபுத்தொடரின் மோதல் நுணுக்கத்தை அளவுக்கு மீறி விளக்காமல் வெளிப்படுத்துவதாகவும் தேர்ந்தெடுக்கப்பட்டது.
