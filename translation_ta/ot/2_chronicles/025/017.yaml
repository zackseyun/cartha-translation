  text: וַ/יִּוָּעַ֗ץ אֲמַצְיָ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה וַ֠/יִּשְׁלַח אֶל יוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לך נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
translation:
  language: ta
  text: பின்னர் யூதாவின் அரசன் அமத்சியா ஆலோசித்து, இஸ்ரவேலின் அரசனான யெகோவாகாசின் மகனும் யெகூவின் பேரனுமான யோவாசுக்கு, “வா, நாம் நேருக்கு நேர் சந்திப்போம்[a]” என்று செய்தி அனுப்பினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாம் ஒருவரையொருவர் நேருக்கு நேர் பார்ப்போம்.” எபிரேய மரபுத்தொடர் சொல்லுக்குச் சொல் ஒருவருடைய முகத்தை மற்றொருவர் பார்ப்பதைக் குறிக்கிறது; இங்கு அது பெரும்பாலும் நேரடியான மோதலுக்கான சவாலைத் தெரிவிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: ஆலோசனை செய்து
  rationale: יעץ என்பதன் நிபால் வடிவம் நடவடிக்கைக்கு முன் ஆலோசித்தல் அல்லது சிந்தித்து முடிவெடுத்தலைக் குறிக்கிறது; தமிழ் கதைநடையில் இயல்பாகவும் மூலத்தின் நுணுக்கத்தைத் தக்கவைத்தும் உள்ளது.
- source_word: וַיִּשְׁלַח אֶל
  choice: யோவாசிடம் ... என்று சொல்லி அனுப்பினான்
  rationale: மூலத்தில் தூதர்கள் அல்லது செய்தி என்ற பொருட்சொல் வெளிப்படையாக இல்லை. தமிழ் மொழியில் பெறுநரையும் நேரடிக் கூற்றையும் இணைத்து இவ்வாறு கூறுவது இயல்பானது; தேவையற்ற விவரத்தையும் சேர்ப்பதில்லை.
- source_word: יוֹאָשׁ בֶּן־יְהוֹאָחָז בֶּן־יֵהוּא מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ராஜாவாகிய யெகூவின் மகன் யெகோவாகாசின் மகன் யோவாஸ்
  rationale: மூலத்தில் உள்ள முழு வம்சத் தொடர்பும் அரசப் பட்டமும் தக்கவைக்கப்பட்டுள்ளன; தமிழில் அடைமொழித் தொடர் தெளிவாக அமைய வரிசை இயல்பாக மாற்றப்பட்டுள்ளது.
- source_word: לְךָ
  choice: வா
  rationale: இச்சூழலில் இந்த ஏவல் வடிவம் நேரடியான சவால் அழைப்பாகச் செயல்படுகிறது; ‘வா’ என்பது சுருக்கமான இயல்பான தமிழ் இணை.
- source_word: נִתְרָאֶה פָנִים
  choice: நாம் நேருக்கு நேர் சந்திப்போம்
  rationale: முகங்களைப் பார்ப்பது என்ற எபிரேய மரபுத்தொடரை இயல்பான தமிழில் வழங்குகிறது; இச்சூழலிலுள்ள நேரடி மோதல் நுணுக்கத்தையும் தக்கவைக்கிறது.
