revisions:
- from: பின்னர் யூதாவின் ராஜாவாகிய அமத்சியா ஆலோசனை செய்து, இஸ்ரவேலின் ராஜாவாகிய யெகூவின் மகன் யெகோவாகாசின் மகன் யோவாசிடம், “வா, நாம் நேருக்கு நேர் சந்திப்போம்[a]” என்று சொல்லி அனுப்பினான்.
  to: பின்னர் யூதாவின் அரசன் அமத்சியா ஆலோசித்து, இஸ்ரவேலின் அரசனான யெகோவாகாசின் மகனும் யெகூவின் பேரனுமான யோவாசுக்கு, “வா, நாம் நேருக்கு நேர் சந்திப்போம்[a]” என்று செய்தி அனுப்பினான்.
  rationale: The communication verb has been clarified for Tamil syntax. The source’s genealogy is preserved in meaning as ‘son of Jehoahaz and grandson of Jehu’; this avoids an unwieldy stacked genitive while retaining every stated relationship. The footnote now states the literal face-language more accurately in idiomatic Tamil.
