translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர் வாக்கிய அமைப்பு தமிழில் தெளிவாக இருக்க இரு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; ‘அங்கே’ என்பது இடத் தொடர்பை இயல்பாக்குகிறது.
