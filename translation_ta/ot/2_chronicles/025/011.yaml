base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/011.yaml
  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
translation:
  language: ta
  text: பின்பு அமத்சியா தன்னை வலுப்படுத்திக்கொண்டு, தன் மக்களை வழிநடத்தி, உப்புப் பள்ளத்தாக்கிற்குச் சென்றான். அங்கே சேயீரின் மகன்களாகிய பத்தாயிரம் பேரை வீழ்த்தினான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְחַזַּק
  choice: தன்னை வலுப்படுத்திக்கொண்டு
  rationale: வினையின் தற்சுட்டுப் பொருளைப் பாதுகாக்கிறது; ‘துணிவுகொண்டான்’ என்று உளநிலையை மட்டும் குறிப்பதாகச் சுருக்கவில்லை.
- source_word: וַיִּנְהַג אֶת־עַמּוֹ
  choice: தன் மக்களை வழிநடத்தி
  rationale: இராணுவச் சூழலில் நடத்திச் செல்வதைக் இயல்பான தமிழில் தெரிவிக்கிறது; படை அணிவகுப்பு போன்ற கூடுதல் விவரத்தைச் சேர்க்கவில்லை.
- source_word: גֵּיא הַמֶּלַח
  choice: உப்புப் பள்ளத்தாக்கு
  rationale: இடப்பெயரின் கூறுகளை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: וַיַּךְ
  choice: வீழ்த்தினான்
  rationale: போர்ச்சூழலில் தாக்கி முறியடித்தல் அல்லது கொல்லுதல் ஆகிய பொருள் விரிவை அளவுக்கு மீறி குறுக்காமல் தெரிவிக்கிறது.
- source_word: בְּנֵי שֵׂעִיר
  choice: சேயீரின் மக்களில்
  rationale: எண்ணிக்கையோடு இயல்பாக அமையும் தமிழை வழங்குகிறது; மூலத்தின் இன-வம்சவழிச் சொல்லாட்சியை அடிக்குறிப்பு விளக்குகிறது.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: பத்தாயிரம் பேர்
  rationale: எபிரெய எண்ணிக்கைக் கூற்றின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: וַאֲמַצְיָהוּ
  choice: பின்பு அமத்சியா
  rationale: வாவ் தொடர்ச்சியால் குறிக்கப்படும் கதை நிகழ்வின் வரிசையை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
