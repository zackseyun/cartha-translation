source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה רַ֕ק לֹ֖א בְּ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/002.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not with a whole heart.
translation:
  language: ta
  text: அவன் யாவேவின் பார்வையில் சரியானதைச் செய்தான்; ஆனால் முழு இருதயத்தோடு[a] அல்ல.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிறைவான இருதயத்தோடு” அல்லது “முழுமனதோடு.” எபிரெயத்தில் “முழு/முழுமையான இருதயத்தோடு” என்று உள்ளது; இது முழுமையற்ற அர்ப்பணிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: வாவ் தொடர்ச்சியுடன் வந்த வினைச்சொல் கடந்தகாலக் கதைநடையைச் சுட்டுகிறது; தமிழில் இயல்பாகக் கடந்தகால வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: הַיָּשָׁר
  choice: சரியானதை
  rationale: பெயர்ச்சொல் போல் பயன்படும் இப்பெயரடை, ஒழுக்க ரீதியில் சரியான செயலைக் குறிக்கிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: மூலமொழியின் ‘கண்களில்’ என்ற மதிப்பீட்டு மரபுத்தொடரின் பொருளையும் உருவகத்தையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேத எழுத்துகளான יהוה குறிக்கும் தனிப்பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: רַק
  choice: ஆனால்
  rationale: முந்தைய நேர்மறை மதிப்பீட்டுக்கு வரம்பிடும் எதிர்மறைத் திருப்பத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּלֵבָב שָׁלֵם
  choice: முழு இருதயத்தோடு
  rationale: ‘முழுமையான இருதயத்துடன்’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, பக்தியின் முழுமையின்மையைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் ஒரு பட்டமல்ல, இறைவனின் தனிப்பெயரே உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: அமத்சியாவின் இருதய நிலை
  choice: முழு இருதயத்தோடு செய்யவில்லை
  alternative: முழுமனதோடு செய்யவில்லை / நிறைவான இருதயத்தோடு செய்யவில்லை
  rationale: அவனுடைய வெளிப்புறச் செயல் சரியானதாக இருந்தபோதும் உள்ளார்ந்த அர்ப்பணிப்பு முழுமையற்றதாக இருந்த பதற்றத்தைப் பாதுகாக்கிறது; இதை வெளிவேடம் அல்லது பாவமற்ற பரிபூரணம் என்று கூடுதலாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘இருதயம்’ என்ற வேதாகம உருவகம் தக்கவைக்கப்பட்டு, அதன் இயல்பான தமிழ் மாற்றான ‘முழுமனம்’ அடிக்குறிப்பில் வழங்கப்பட்டது.
