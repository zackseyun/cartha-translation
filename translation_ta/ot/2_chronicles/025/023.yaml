base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசன் யோவாஸ், யூதாவின் அரசனும் யோவாசின் மகனும் யெகோவாகாசின் பேரனுமான அமத்சியாவைப் பெத்-ஷெமேஷில் சிறைப்பிடித்து, எருசலேமுக்குக் கொண்டுவந்தான். பின்பு அவன் எருசலேமின் மதிலை எப்பிராயீம் வாசலிலிருந்து மூலை வாசல்வரை நானூறு முழம் அளவுக்கு உடைத்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּפַשׂ
  choice: சிறைப்பிடித்து
  rationale: போர்ச் சூழலில் ஒருவரைப் பிடித்துக் காவலில் வைப்பதைக் குறிக்கும் வினை; ‘சிறைப்பிடித்தான்’ என்பது பொருளை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: பெத்-ஷெமேஷில்
  rationale: בְּ இடத்தைக் குறிக்கிறது; இடப்பெயர் ஒலிபெயர்க்கப்பட்டு தமிழின் இடவேற்றுமையுடன் வழங்கப்பட்டுள்ளது.
- source_word: וַיְבִיאֵהוּ
  choice: எருசலேமுக்குக் கொண்டுவந்தான்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘கொண்டுவருதல்’ என்று பொருள்படும்; பயண முறையைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם
  choice: எருசலேமின் மதிலை … இடித்துப்போட்டான்
  rationale: פרץ இச்சூழலில் மதிலின் ஒரு பகுதியை உடைத்து அகற்றுவதைக் குறிக்கிறது; ‘இடித்துப்போட்டான்’ என்பது நவீனத் தமிழில் இயல்பாகவும் அழிவின் அளவைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: מִשַּׁעַר אֶפְרַיִם עַד שַׁעַר הַפּוֹנֶה
  choice: எப்பிராயீம் வாசலிலிருந்து மூலைவாசல் வரை
  rationale: முதல் சொற்றொடர் பெயரிடப்பட்ட நகரவாசலைக் குறிக்கிறது. இரண்டாவது வாசல் 2 இராஜாக்கள் 14:13-இன் இணை விவரத்திலுள்ள மூலைவாசலாக இருக்க வாய்ப்புள்ளதால், வாசிக்க இயல்பான அந்தப் பெயர் உரையில் தரப்பட்டு, எபிரெயச் சொல்லின் நேரடியான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: நானூறு முழம்
  rationale: அளவு மூலத்தில் உள்ளபடியே தரப்பட்டுள்ளது; אַמָּה என்பதற்கான மரபான தமிழ்ச் சமமான ‘முழம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בֶּן יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: யோவாசின் மகனும் யெகோவாகாசின் பேரனுமான
  rationale: இரு தலைமுறை வம்சத் தகவலையும் தெளிவான இயல்பான தமிழில் பாதுகாக்கிறது; இரண்டாவது בֶּן உறவை ‘பேரன்’ என வெளிப்படுத்துவது தமிழில் குழப்பத்தைத் தவிர்க்கிறது.
