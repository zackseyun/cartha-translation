base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
translation:
  language: ta
  text: அப்போது அமத்சியா, எப்பிராயீமிலிருந்து தன்னிடம் வந்திருந்த அந்தப் படையினரை அவர்களுடைய இடத்திற்குப் போகும்படி பிரித்து அனுப்பினான். அவர்கள் யூதாவின்மீது மிகவும் கோபமடைந்து, கடும் சினத்துடன் அவர்களுடைய இடத்திற்குத் திரும்பினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  choice: பிரித்து… அனுப்பிவிட்டான்
  rationale: בדל என்பதன் அடிப்படைப் பொருளான ‘பிரித்தல்’ என்பதையும், இச்சூழலில் எப்பிராயீம் படையினரைப் பணியிலிருந்து விடுவித்துத் திருப்பி அனுப்பிய செயற்பொருளையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: לְהַגְּדוּד
  choice: படையினரை
  rationale: גְּדוּד என்பது ஒரு படைக்குழுவையோ படைப்பிரிவையோ குறிக்கிறது; மனிதர்களைக் குறிக்கும் இவ்வாக்கியத்தில் ‘படையினர்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לָלֶכֶת לִמְקוֹמָם
  choice: அவர்களுடைய இடத்திற்குப் போகும்படி
  rationale: எபிரெய உரையின் நோக்கப் பொருளையும் ‘அவர்களுடைய இடம்’ என்ற சொல்லமைப்பையும் காக்கிறது; ‘வீட்டிற்குப் போகும்படி’ என்பது தேவையற்ற விளக்கத்தைச் சேர்க்கும்.
- source_word: וַיִּחַר אַפָּם מְאֹד בִּיהוּדָה
  choice: அவர்கள் யூதாவின்மீது மிகவும் கோபமடைந்து
  rationale: ‘கோபம் எரிதல்’ என்ற எபிரெய மொழிமரபை நவீன தமிழில் இயல்பாகத் தருகிறது; בִּיהוּדָה இங்கு கோபம் நோக்கிச் செலுத்தப்பட்ட இலக்காக யூதாவைக் குறிக்கிறது.
- source_word: בָּחֳרִי אָף
  choice: கடும் சினத்துடன்
  rationale: கொதிக்கும் அல்லது தீவிரமான கோபம் என்ற வலியுறுத்தலைச் சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
