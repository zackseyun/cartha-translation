translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘பிரித்தல்’ என்ற சொற்பொருளும் சூழலின் ‘திருப்பி அனுப்புதல்’ என்ற செயற்பொருளும் ஒன்றாகப் பாதுகாக்கப்பட்டுள்ளன; தேவையற்ற சமயவியல் விளக்கங்கள் சேர்க்கப்படவில்லை.
