translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தொடர்ச்சியான ‘மற்றும்’ இணைப்புகளைத் தமிழின் இயல்பான வாக்கிய ஓட்டத்துக்கு ஏற்ப வினையெச்சங்களாக அமைத்துள்ளோம்; இறுதி நிகழ்வுக்கு நோக்கம் அல்லது காரணவிளைவு சேர்க்கப்படவில்லை. சֶלַע என்பதற்கு சூழலுக்கேற்ற ‘குன்று’ தேர்ந்தெடுக்கப்பட்டது; அதன் பாறைத் தன்மை சூழலால் உணரப்படுகிறது. மூலத்தின் கடுமையான வன்முறை மென்மைப்படுத்தப்படவில்லை.
