base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
translation:
  language: ta
  text: யூதா மக்கள் பத்தாயிரம் பேரை உயிருடன் சிறைபிடித்து,[a] அவர்களைக் பாறைக்குன்றின் உச்சிக்குக் கொண்டுவந்து, பாறைக்குன்றின் உச்சியிலிருந்து அவர்களை எறிந்தார்கள்; அவர்கள் அனைவரும் பிளந்து சிதறினார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயிருடன்’ என்பதற்கு ‘உயிரோடு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பிளந்து சிதறினார்கள்’ என்பது சொற்பட ‘பிளக்கப்பட்டார்கள்’ அல்லது ‘உடைந்து பிரிந்தார்கள்’ என்றும் மொழிபெயர்க்கப்படலாம். ‘பாறைக்குன்று’ என்பதற்கு ‘பாறை’ அல்லது ‘செங்குத்துப் பாறை’ என்றும் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ
  choice: சிறைப்பிடித்து
  rationale: போர்ச் சூழலிலும் חַיִּים என்பதுடனும் சேர்ந்து, உயிருடன் கைதிகளாகப் பிடித்ததைக் குறிக்கிறது.
- source_word: חַיִּים
  choice: உயிரோடு
  rationale: அந்தப் பத்தாயிரம் பேரும் போரில் கொல்லப்படாமல் உயிருடன் பிடிக்கப்பட்டனர் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּנֵי יְהוּדָה
  choice: யூதாவின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் கூட்டுப்பொருளை நவீன தமிழில் இயல்பாகக் கொடுக்கிறது; இது ஆண்களை மட்டும் வலியுறுத்த வேண்டிய அவசியமில்லை.
- source_word: וַיְבִיאוּם
  choice: அவர்களைக் ... கொண்டுபோய்
  rationale: ஹிப்ஃபீல் வடிவின் ‘கொண்டுவருதல்/கொண்டுபோதல்’ பொருளை, இலக்கை நோக்கிய நகர்வுக்கு ஏற்ற தமிழில் தருகிறது.
- source_word: לְרֹאשׁ הַסָּלַע
  choice: குன்றின் உச்சிக்கு
  rationale: רֹאשׁ என்பது இங்கு புவியியல் அமைப்பின் உச்சியைக் குறிக்கிறது; סֶלַע என்பது பாறை, பாறைக்குன்று அல்லது செங்குத்தான குன்றைக் குறிக்கலாம்.
- source_word: וַיַּשְׁלִיכוּם מֵרֹאשׁ הַסֶּלַע
  choice: அங்கிருந்து கீழே தள்ளினார்கள்
  rationale: שלך என்பதன் எறிதல்/தள்ளுதல் பொருளையும், குன்றின் உச்சியிலிருந்து கீழ்நோக்கிய இயக்கத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அங்கிருந்து’ தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- source_word: וְכֻלָּם נִבְקָעוּ
  choice: அவர்கள் அனைவரும் பிளந்து சிதைந்தார்கள்
  rationale: כֻּלָּם என்பதன் முழுமையையும் בקע நிஃபால் வடிவின் ‘பிளக்கப்படுதல்/உடைந்து பிரிதல்’ என்ற வன்மையான விளைவையும் நேரடியாகப் பாதுகாக்கிறது.
