base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/006.yaml
  text: And he hired from Israel one hundred thousand mighty men of valor for one hundred talents of silver[a].
translation:
  language: ta
  text: அவன் இஸ்ரவேலிலிருந்து ஒரு லட்சம் வலிமைமிக்க போர்வீரர்களை[a] நூறு தாலந்து வெள்ளி கொடுத்து கூலிக்கு அமர்த்தினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வீரமிக்க போர்வீரர்கள்’ அல்லது ‘போர்த் திறனுள்ள வீரர்கள்.’ எபிரெயச் சொற்றொடர் திறனும் வலிமையும் கொண்ட போர்வீரர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  choice: கூலிக்கு அமர்த்தினான்
  rationale: שׂכר என்பதன் அடிப்படைப் பொருள் கூலி கொடுத்து ஒருவரை அமர்த்துவது. ‘கூலிப்படையினரைச் சேர்த்தான்’ என்பது சூழலுக்குப் பொருந்தினாலும், மூலத்தில் இல்லாத பெயரிடலைச் சேர்க்கும் என்பதால் தவிர்க்கப்பட்டது.
- source_word: מִיִּשְׂרָאֵל
  choice: இஸ்ரவேலிலிருந்து
  rationale: מן என்னும் முன்னொட்டு வந்த இடம் அல்லது மூலத்தைச் சுட்டுகிறது. இங்கு படைவீரர்கள் இஸ்ரவேலிலிருந்து அமர்த்தப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מֵאָה אֶלֶף
  choice: ஒரு லட்சம்
  rationale: எண்ணிக்கையைத் துல்லியமாகவும், நவீனத் தமிழில் இயல்பாகவும் வழங்குகிறது.
- source_word: גִּבּוֹר חָיִל
  choice: வலிமைமிக்க போர்வீரர்கள்
  rationale: இந்த எபிரெயச் சொற்றொடர் வலிமையும் போர்த் திறனும் கொண்ட வீரர்களைக் குறிக்கிறது. தேர்ந்தெடுக்கப்பட்ட மொழிபெயர்ப்பு அதன் இராணுவப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: בְּמֵאָה כִכַּר כָּסֶף
  choice: நூறு தாலந்து வெள்ளிக்கு
  rationale: ב இங்கு விலை அல்லது கொடுப்பனவைக் குறிக்கிறது. பழங்கால எடை மற்றும் பண மதிப்பு அலகான כִּכָּר, கணிப்பான நவீன மாற்றீடாக மாற்றப்படாமல் ‘தாலந்து’ என வைக்கப்பட்டுள்ளது.
