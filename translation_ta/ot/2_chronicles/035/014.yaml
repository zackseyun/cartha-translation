base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
translation:
  language: ta
  text: அதன்பிறகு, அவர்கள் தங்களுக்காகவும் ஆசாரியர்களுக்காகவும்[a] ஆயத்தப்படுத்தினார்கள். ஏனெனில், ஆரோனின் புதல்வர்களான ஆசாரியர்கள் இரவு வரை தகனபலியையும் கொழுப்புப் பகுதிகளையும் செலுத்துவதில் ஈடுபட்டிருந்தார்கள். எனவே, லேவியர்கள் தங்களுக்காகவும் ஆரோனின் புதல்வர்களான ஆசாரியர்களுக்காகவும் ஆயத்தப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இரு இடங்களிலும் “அவர்களுக்காகவும்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சுட்டுப்பெயர் தன்னிலையை வெளிப்படையாகக் குறிக்கவில்லை. ஆனாலும், லேவியர்கள் தங்களுக்காகவும் ஆசாரியர்களுக்காகவும் ஆயத்தப்படுத்தினார்கள் என்று சூழல் வலுவாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: அதன் பிறகு
  rationale: முந்தைய செயலுக்குப் பின்பு நிகழ்ந்ததைக் குறிக்கும் இயல்பான நவீனத் தமிழ் தொடர்.
- source_word: הֵכִינוּ
  choice: உணவை ஆயத்தப்படுத்தினார்கள்
  rationale: ஹிப்ஃபில் வடிவம் ‘ஆயத்தப்படுத்துதல்’ என்று பொருள்படும்; பஸ்கா உணவு குறித்த சூழல் ஆயத்தப்படுத்தப்பட்ட பொருளைத் தெளிவாக்குவதால், தமிழில் இயல்பாக இருக்க ‘உணவை’ வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לָהֶם
  choice: தங்களுக்காகவும்
  rationale: எபிரெயச் சுட்டுப்பெயர் இலக்கணரீதியாகத் தற்சுட்டு வடிவமல்ல; எனினும், எழுவாய் லேவியர்கள் என்பதும் பின்னர் அது வெளிப்படையாகக் கூறப்படுவதும், இங்கு அவர்களுக்கே உணவு ஆயத்தப்படுத்தியதாக வலுவாகச் சுட்டுகின்றன.
- source_word: וְלַכֹּהֲנִים
  choice: ஆசாரியர்களுக்காகவும்
  rationale: உணவு ஆயத்தப்படுத்தப்பட்ட மற்றொரு குழுவைக் குறிக்கும் நேரடியான பயனிலைத் தொடர்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: லேவியர்கள் ஏன் ஆசாரியர்களுக்காக ஆயத்தப்படுத்த வேண்டியிருந்தது என்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: ஆரோனின் மக்களான ஆசாரியர்கள்
  rationale: ஆசாரியர்களை ஆரோனின் வழிவந்தவர்களாக அடையாளப்படுத்தும் இணைப்புப் பெயர்த் தொடரைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְּהַעֲלוֹת
  choice: பலிபீடத்தில் செலுத்துவதில் ஈடுபட்டிருந்தார்கள்
  rationale: பலிச் சூழலில் עלה என்பது பலியை மேலே செலுத்துதல் அல்லது அர்ப்பணித்தல்; தொடர்ந்த பணியில் அவர்கள் ஈடுபட்டிருந்த காரணப்பொருளையும் தமிழ் வெளிப்படுத்துகிறது. ‘பலிபீடத்தில்’ என்பது சூழலிலுள்ள மறைமுக இடத்தை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: הָעוֹלָה
  choice: தகனபலியை
  rationale: முழுமையாக எரித்துச் செலுத்தப்படும் עֹלָה பலிக்கான நிலைபெற்ற, துல்லியமான தமிழ் வேதாகமச் சொல்.
- source_word: וְהַחֲלָבִים
  choice: கொழுப்புப் பகுதிகளையும்
  rationale: பலியிலிருந்து பிரித்து பலிபீடத்தில் செலுத்தப்பட்ட குறிப்பிட்ட கொழுப்புப் பகுதிகளைக் குறிக்கிறது; பொதுவான கொழுப்பு என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: עַד לָיְלָה
  choice: இரவு வரைக்கும்
  rationale: அவர்களுடைய பணி இரவு வரை நீடித்ததை நெருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְהַלְוִיִּם
  choice: ஆகவே லேவியர்கள்
  rationale: காரண விளக்கத்திற்குப் பின் முதன்மைச் செயலை மீண்டும் எடுத்துரைக்கும் இணைப்பைத் தமிழில் விளைவு உறவுடன் இயல்பாகக் காட்டுகிறது.
