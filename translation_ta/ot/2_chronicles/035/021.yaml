  text: וַ/יִּשְׁלַ֣ח אֵלָ֣י/ו מַלְאָכִ֣ים לֵ/אמֹר֩ מַה לִּ֨/י וָ/לָ֜/ךְ מֶ֣לֶךְ יְהוּדָ֗ה לֹא עָלֶ֨י/ךָ אַתָּ֤ה הַ/יּוֹם֙ כִּ֚י אֶל בֵּ֣ית מִלְחַמְתִּ֔/י וֵ/אלֹהִ֖ים אָמַ֣ר לְ/בַֽהֲלֵ֑/נִי חֲדַל לְ/ךָ֛ מֵ/אֱלֹהִ֥ים אֲשֶׁר עִמִּ֖/י וְ/אַל יַשְׁחִיתֶֽ/ךָ׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
translation:
  language: ta
  text: ஆனால் அவன் அவனிடம் தூதர்களை அனுப்பி, “யூதாவின் அரசனே, எனக்கும் உனக்கும் என்ன தொடர்பு? இன்று நான் உனக்கு எதிராக வரவில்லை; நான் போரிடும் அரசவம்சத்துக்கு எதிராகவே வருகிறேன்[a]. விரைந்து செல்லும்படி கடவுள் எனக்குக் கூறியிருக்கிறார். என்னோடு இருக்கும் கடவுளை எதிர்ப்பதை நிறுத்து; அவர் உன்னை அழிக்காதபடி” என்று சொல்லச் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் போருக்குரிய இடத்துக்கு எதிராக,” அல்லது “நான் போரிடும் அரசாட்சி/அரசவம்சத்துக்கு எதிராக.” எபிரெயச் சொற்றொடரின் துல்லியமான பொருள் உறுதியற்றது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: தூதர்கள்
  rationale: இச்சூழலில் இது நெகோ அனுப்பிய மனிதப் பிரதிநிதிகளைக் குறிக்கிறது; வானதூதர்களை அல்ல.
- source_word: מַה לִּי וָלָךְ
  choice: எனக்கும் உனக்கும் என்ன தொடர்பு?
  rationale: தலையிடாமையையும் தொடர்பின்மையையும் வெளிப்படுத்தும் எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்.
- source_word: לֹא עָלֶיךָ אַתָּה הַיּוֹם
  choice: இன்று நான் உனக்கு எதிராக வரவில்லை
  rationale: எபிரெயத்தில் வினைச்சொல் விடுபட்டிருந்தாலும், நெகோ இம்முறை யோசியாவைத் தாக்க வரவில்லை என்பதே சூழல்சார் பொருள்.
- source_word: אֶל בֵּית מִלְחַמְתִּי
  choice: நான் போரிடும் அரசவம்சத்துக்கு எதிராக
  rationale: கடினமான בֵּית என்ற சொல்லை இங்கு அரசவம்சம் அல்லது ஆட்சியதிகாரம் எனப் புரிந்துகொள்கிறது; உறுதியின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וֵאלֹהִים
  choice: கடவுள்
  rationale: אֱלֹהִים வடிவம் பன்மையாக இருக்கக்கூடியதாயினும், அதனுடன் வரும் אָמַר என்ற வினை ஒருமையில் உள்ளது; அடுத்த வசனத்தின் கதைச்சட்டகமும் ஒருமையான கடவுளைக் காட்டுகிறது.
- source_word: לְבַהֲלֵנִי
  choice: விரைந்து செல்லும்படி
  rationale: בהל இங்கு அவசரமாகச் செல்லத் தூண்டுதல் அல்லது கட்டளையிடுதல் என்ற பொருளைத் தருகிறது.
- source_word: חֲדַל לְךָ מֵאֱלֹהִים
  choice: கடவுளை எதிர்ப்பதை நிறுத்து
  rationale: கடவுளின் செயலில் குறுக்கிடுவதையோ அதை எதிர்ப்பதையோ நிறுத்துமாறு கூறும் எபிரெய மரபுத்தொடரின் தெளிவான தமிழ் வடிவம்.
- source_word: אֲשֶׁר עִמִּי
  choice: என்னோடு இருக்கும்
  rationale: தெய்வீக ஆதரவின் தன்மையை மேலதிகமாக விளக்காமல் மூலத்தின் உறவுநிலையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְאַל יַשְׁחִיתֶךָ
  choice: இல்லையெனில் அவர் உன்னை அழித்துவிடுவார்
  rationale: எச்சரிக்கையின் விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; அழிவின் கடுமையையும் காக்கிறது.
theological_decisions:
- issue: நெகோவின் உரையில் אֱלֹהִים என்பதன் குறிப்பு
  choice: ஒருமையில் “கடவுள்”
  alternative: “ஒரு தெய்வம்” அல்லது “தெய்வங்கள்”
  rationale: ஒருமை வினைச்சொல்லும் அடுத்த வசனத்தில் இவ்வார்த்தைகள் கடவுளிடமிருந்து வந்தவை எனக் கதைசொல்லி வழங்குவதும் ஒருமைப் பொருளை ஆதரிக்கின்றன; நெகோவின் தனிப்பட்ட சமயப் புரிதலை இதற்குள் இறக்குமதி செய்யவில்லை.
- issue: בֵּית מִלְחַמְתִּי என்பதன் பொருள்
  choice: “நான் போரிடும் அரசவம்சம்”
  alternative: “என் போருக்குரிய இடம்” அல்லது “நான் போரிடும் அரசாட்சி”
  rationale: בֵּית என்பதன் அடிப்படை ‘வீடு’ உருவகத்தைத் தமிழில் சொற்சொல்லாக வைத்தால் கருத்து மிக மங்கலாகிவிடும். அரசவம்சம் என்பது சாத்தியமான சூழல்சார் பொருள்; இருப்பினும் உறுதியின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
- issue: இறுதி எச்சரிக்கையின் தொடர்பு
  choice: “இல்லையெனில் அவர் உன்னை அழித்துவிடுவார்”
  alternative: “அவர் உன்னை அழிக்காதபடி”
  rationale: אַל உடன் வரும் எச்சரிக்கையின் விளைவை இயல்பான தமிழில் தருகிறது; செய்பவர் கடவுள் என்பதையும் அழிவின் சாத்தியத்தையும் மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. உரையாடல் நேரடித்தன்மையுடன் உள்ளது. “அரசவம்சம்” என்ற தேர்வு மூலத்தின் கடினமான ‘வீடு’ உருவகத்தை சூழலுக்கேற்றவாறு விளக்குகிறது; மாற்று வாய்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
