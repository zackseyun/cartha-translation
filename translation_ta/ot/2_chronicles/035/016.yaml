source:
  edition: WLC
  text: וַ֠/תִּכּוֹן כָּל עֲבוֹדַ֨ת יְהוָ֜ה בַּ/יּ֤וֹם הַ/הוּא֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/הַעֲל֣וֹת עֹל֔וֹת עַ֖ל מִזְבַּ֣ח יְהוָ֑ה כְּ/מִצְוַ֖ת הַ/מֶּ֥לֶךְ יֹאשִׁיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: ta
  text: அந்த நாளில் யாவேக்குரிய வழிபாட்டுப் பணிகள் அனைத்தும், பஸ்காவைக் கடைப்பிடிப்பதற்கும் யாவேயின் பலிபீடத்தின்மேல் தகன பலிகளைச் செலுத்துவதற்கும், அரசன் யோசியாவின் கட்டளையின்படி ஆயத்தப்படுத்தப்பட்டன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: ஒழுங்குபடுத்தப்பட்டன
  rationale: כון என்பதன் நிஃபால் வடிவம் வழிபாட்டுப் பணிகள் உரிய முறையில் ஆயத்தப்படுத்தப்பட்டு ஒழுங்கில் வைக்கப்பட்டதைக் குறிக்கிறது. தமிழில் செயலின் விளைவையும் செயப்பாட்டு நிலையையும் இயல்பாகத் தருகிறது.
- source_word: כָּל עֲבוֹדַת יְהוָה
  choice: யாவேக்குரிய வழிபாட்டுப் பணிகள் அனைத்தும்
  rationale: עֲבוֹדָה இங்கு ஆலயச் சூழலிலான பணி அல்லது சேவையைக் குறிக்கிறது. ‘வழிபாட்டுப் பணிகள்’ என்பது அதைப் பொதுவான வேலையாகக் குறுக்காமல், சடங்கு சார்ந்த பொருளைத் தெளிவாக்குகிறது; ‘யாவேக்குரிய’ என்பது எபிரேயத் தொடர்பமைப்பின் பரப்பைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய மூலத்தில் காணப்படும் இறைப்பெயரான יהוה, ஒரு பட்டப்பெயரால் மாற்றப்படாமல் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: காலத்தையும் சுட்டுத்தன்மையையும் நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: பஸ்காவைக் கடைப்பிடிப்பதற்கு
  rationale: ‘பஸ்காவைச் செய்தல்’ என்ற எபிரேய மரபுத்தொடர் பஸ்கா அனுசரிப்பைச் சுட்டுகிறது. ‘கடைப்பிடித்தல்’ அதன் சடங்கு சார்ந்த பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְהַעֲלוֹת עֹלוֹת
  choice: தகன பலிகளைச் செலுத்துவதற்கு
  rationale: עלה என்பதன் ஹிஃபில் வடிவமும் עֹלוֹת என்பதும் இணைந்து முழுமையாக எரிக்கப்படும் பலிகளைப் பலிபீடத்தில் செலுத்துவதைக் குறிக்கும் வழக்கமான பலியிடும் மரபுத்தொடராகும்.
- source_word: עַל מִזְבַּח יְהוָה
  choice: யாவேயின் பலிபீடத்தின்மேல்
  rationale: பலிகள் செலுத்தப்பட்ட இடத்தையும் அந்தப் பலிபீடம் யாவேக்கு உரியது என்பதையும் நேரடியாகக் காட்டுகிறது.
- source_word: כְּמִצְוַת הַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: அரசன் யோசியா கட்டளையிட்டபடியே
  rationale: מִצְוָה இங்கு அரசனின் குறிப்பிட்ட கட்டளையைக் குறிக்கிறது. தமிழில் வினைமயமாக்கப்பட்ட இவ்வடிவம் ஒப்புமைத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இறைப்பெயரான יהוה-ஐ மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: עֲבוֹדַת יְהוָה என்பதன் தொடர்பு
  choice: யாவேக்குரிய வழிபாட்டுப் பணிகள்
  alternative: யாவேக்குச் செய்யும் வழிபாட்டுப் பணிகள்
  rationale: எபிரேயத் தொடர்பமைப்பு பணிகள் யாவேக்கு உரியவை அல்லது அவருக்காகச் செய்யப்படுபவை என்ற இரண்டையும் உள்ளடக்கக்கூடும். ‘யாவேக்குரிய’ என்பது அந்த உறவைத் தேவையின்றி ஒரே பொருளாகக் குறுக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் ஆலய வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘பஸ்கா’, ‘தகன பலி’, ‘பலிபீடம்’ ஆகிய நிலைபெற்ற வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன.
