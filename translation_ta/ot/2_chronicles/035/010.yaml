base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
translation:
  language: ta
  text: 'இவ்வாறு, வழிபாட்டுப் பணி ஆயத்தப்படுத்தப்பட்டது[a]. ஆசாரியர்கள் தங்களுக்குரிய இடங்களில்[b] நின்றார்கள்; லேவியர்கள் தங்கள் பிரிவுகளின்படி[c] நின்றார்கள். இவை அரசனின் கட்டளையின்படி நடந்தன.


    [a] அல்லது, “ஒழுங்குபடுத்தப்பட்டது” அல்லது “நிலைநிறுத்தப்பட்டது.”


    [b] எபிரெய மொழியில், “தாங்கள் நிற்கும் இடத்தில்”; அதாவது, அவர்களுக்கு நியமிக்கப்பட்ட இடங்களில்.


    [c] அல்லது, “தங்கள் பிரிவுகளின்படி.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒழுங்குபடுத்தப்பட்டது” அல்லது “நிலைநிறுத்தப்பட்டது.”
    reason: כון வினைச்சொல்லின் சூழலுக்கேற்ற மாற்றுப் பொருள்களைப் பேணுகிறது.
  - marker: b
    text: எபிரெய மொழியில், “தாங்கள் நிற்கும் இடத்தில்”; அதாவது, அவர்களுக்கு நியமிக்கப்பட்ட இடங்களில்.
    reason: עַל עָמְדָם என்ற சொல்லாட்சியின் நேரடிப் பொருளையும் அதன் நியமிக்கப்பட்ட நிலை/இடம் என்ற பயன்பாட்டையும் விளக்குகிறது.
  - marker: c
    text: அல்லது, “தங்கள் பிரிவுகளின்படி.”
    reason: עַל מַחְלְקוֹתָם என்பதன் ‘பிரிவுகள் அல்லது ஒழுங்கமைக்கப்பட்ட குழுக்கள்’ என்ற பொருளை, மூலத்தில் இல்லாத ‘இடங்களில்’ என்பதைச் சேர்க்காமல் காட்டுகிறது.
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: ஆயத்தப்படுத்தப்பட்டது
  rationale: כון என்ற வினையின் இச்சூழலிலுள்ள ‘தயாராக்கப்படுதல், ஒழுங்குபடுத்தப்படுதல், நிலைநிறுத்தப்படுதல்’ என்ற பொருள் வரம்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָעֲבוֹדָה
  choice: வழிபாட்டுப் பணி
  rationale: ஆலயத்திலும் பஸ்கா அனுசரிப்பிலும் நடைபெறும் புனிதப் பணியைச் சுட்டுவதால், பொதுவான ‘பணி’ என்பதைவிட வழிபாட்டுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: וַיַּעַמְדוּ
  choice: நின்றார்கள்
  rationale: עמד என்பதன் நேரடியான பொருளைப் பேணுகிறது; தொடர்ந்து வரும் சொற்றொடர்கள் அவர்கள் நியமிக்கப்பட்ட இடங்களில் நின்றதை விளக்குகின்றன.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: இஸ்ரவேலின் ஆலயப் பணியாளர்களைக் குறிக்கும் כהנים என்பதற்கான பரவலாக அறியப்பட்ட தமிழ் வேதாகமச் சொல்.
- source_word: עַל עָמְדָם
  choice: தங்களுக்குரிய இடங்களில்
  rationale: சொல்லுக்கு சொல் ‘தாங்கள் நிற்கும் இடத்தில்’ என்ற எபிரெய மரபுத்தொடரை, நியமிக்கப்பட்ட பணியிடங்கள் என்ற பொருள் குலையாமல் இயல்பாகத் தருகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தைச் சேர்ந்த ஆலயப் பணியாளர்களுக்கான நிலையான பெயர்ப்பு.
- source_word: עַל מַחְלְקוֹתָם
  choice: தங்கள் பிரிவுகளின்படி
  rationale: מַחְלְקוֹת குறிக்கும் ஒழுங்கமைக்கப்பட்ட பணிக்குழுக்கள் அல்லது முறைப்பிரிவுகளைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: כְּמִצְוַת
  choice: கட்டளையின்படி
  rationale: இங்கு பொதுவான கட்டளையைக் காட்டிலும் அரசன் வழங்கிய குறிப்பிட்ட ஆணையைச் சுட்டுகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சூழலில் குறிப்பிடப்படும் ஆட்சி செய்கிற அரசனை நேரடியாகக் குறிக்கிறது.
theological_decisions:
- issue: עֲבוֹדָה என்பதன் வழிபாட்டுச் சூழல்
  choice: வழிபாட்டுப் பணி
  alternative: பணி; சடங்குப் பணி
  rationale: பஸ்காவும் ஆலய நடைமுறைகளும் பற்றிய சூழலைப் பேணுகிறது; பிற்காலச் சபை வழிபாட்டு முறைகளை உரைக்குள் இறக்குமதி செய்யவில்லை.
- issue: ஆசாரியர்களும் லேவியர்களும் நின்ற ஒழுங்கமைந்த இடங்கள்
  choice: தங்களுக்குரிய இடங்களில் ... தங்கள் பிரிவுகளின்படி
  alternative: தாங்கள் நிற்கும் இடங்களில் ... தங்கள் பணிப்பிரிவுகளுக்குரிய இடங்களில்
  rationale: எபிரெய மொழியின் இரு வேறுபட்ட அமைப்புச் சொற்றொடர்களையும் வேறுபடுத்திப் பேணுவதோடு, பணியிடங்களும் குழுப் பிரிவுகளும் குறிக்கப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் கண்ணியமானதாயும் வடிவமைக்கப்பட்டது. ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’ ஆகிய பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் பேணப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் ஒழுங்கும் இணை அமைப்பும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன.
