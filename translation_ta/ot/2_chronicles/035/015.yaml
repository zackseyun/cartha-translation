base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
translation:
  language: ta
  text: ஆசாபின் மகன்களான பாடகர்கள், தாவீது, ஆசாப், ஏமான், அரசனின் தரிசகரான எதுத்தூன்[b] ஆகியோரின் கட்டளைப்படி தங்களுக்குரிய இடங்களில் இருந்தார்கள். வாயிற்காவலர்கள் ஒவ்வொரு வாயிலிலும் இருந்தார்கள். அவர்கள் தங்கள் பணியிலிருந்து விலகிச் செல்ல வேண்டிய தேவை இருக்கவில்லை[a]; ஏனெனில், அவர்களுடைய சகோதரர்களான லேவியர்கள் அவர்களுக்காக ஆயத்தம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கள் பணியிலிருந்து விலகக் கூடாது.” எபிரெயச் சொற்றொடரை இவ்வாறு வலிமையாகவும் புரிந்துகொள்ளலாம். எனினும், லேவியர்கள் அவர்களுக்காக ஆயத்தம் செய்தார்கள் என்று தொடர்ந்து வருவது, அவர்கள் விலகிச் செல்ல வேண்டிய தேவை இருக்கவில்லை என்ற பொருளை ஆதரிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: “அரசனின் தரிசகர்” என்பது மிகவும் இயல்பாக எதுத்தூனைக் குறிக்கிறது.
    reason: syntactical_attachment
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  choice: பாடகர்கள்
  rationale: שׁיר என்பதிலிருந்து வந்த இவ்வடிவம் பாடுகிறவர்களைக் குறிக்கிறது; ஆலயச் சூழலில் ‘பாடகர்கள்’ என்பது நேரடியான, இயல்பான தமிழாக்கம்.
- source_word: בְּנֵי אָסָף
  choice: ஆசாபின் மகன்கள்
  rationale: எபிரெயில் நேரடியாக ‘ஆசாபின் மகன்கள்’ என்று உள்ளது; சூழலில் இது ஆசாபுடன் தொடர்புடைய மரபினர் அல்லது குழுவைக் குறித்தாலும், மூலத்தின் குடும்பச் சொல்லாட்சி தக்கவைக்கப்படுகிறது.
- source_word: עַל מַעֲמָדָם
  choice: தங்களுக்குரிய இடங்களில் இருந்தார்கள்
  rationale: מַעֲמָד என்பது நியமிக்கப்பட்ட நிலை அல்லது பணியிடத்தைக் குறிக்கும்; ஒழுங்குபடுத்தப்பட்ட ஆலயப் பணிச் சூழலை இச்சொற்றொடர் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְּמִצְוַת
  choice: கட்டளைப்படி
  rationale: מִצְוָה அதிகாரப்பூர்வமான கட்டளையைக் குறிக்கிறது; ‘கட்டளைப்படி’ அதன் வலிமையையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: חוֹזֵה הַמֶּלֶךְ
  choice: அரசனின் தரிசகர்
  rationale: חוֹזֶה என்பது தரிசனம் காண்பவரைக் குறிக்கும் தனித்துவமான பதவி; பொதுவான ‘தீர்க்கதரிசி’ என்பதைவிட ‘தரிசகர்’ மூலச்சொல்லின் நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: הַשֹּׁעֲרִים
  choice: வாயிற்காவலர்கள்
  rationale: ஆலயத்தின் வாயில்களில் நியமிக்கப்பட்ட காவலர்களை இச்சொல் குறிக்கிறது; ‘வாயிற்காவலர்கள்’ துல்லியமான தமிழாக்கம்.
- source_word: לְשַׁעַר וָשָׁעַר
  choice: ஒவ்வொரு வாயிலிலும்
  rationale: எபிரெயின் பகிர்வுக் கட்டமைப்பு ஒவ்வொரு வாயிலிலும் தனித்தனியாக நியமிக்கப்பட்டிருந்ததைக் காட்டுகிறது.
- source_word: אֵין לָהֶם לָסוּר
  choice: அவர்கள் விலகிச் செல்ல வேண்டிய தேவை இருக்கவில்லை
  rationale: אֵין + ל infinitive இங்கு தேவையின்மையை வெளிப்படுத்துகிறது; அடுத்த காரணவாக்கியம் இதை ஆதரிக்கிறது.
- source_word: מֵעַל עֲבֹדָתָם
  choice: தங்கள் பணியிலிருந்து
  rationale: עֲבֹדָה இங்கு ஆலயச் சேவை அல்லது ஒதுக்கப்பட்ட பணியைக் குறிக்கிறது; ‘பணி’ தெளிவான, இயல்பான தேர்வு.
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: அவர்களுடைய சகோதரர்களான லேவியர்கள்
  rationale: மூலம் வெளிப்படையாக ‘அவர்களுடைய சகோதரர்கள், லேவியர்கள்’ எனக் கூறுவதால் உறவுச் சொல் நீக்கப்படாமல் தக்கவைக்கப்படுகிறது.
- source_word: הֵכִינוּ לָהֶם
  choice: அவர்களுக்காக ஆயத்தம் செய்தார்கள்
  rationale: הכין என்பது ஆயத்தப்படுத்துதல் அல்லது தயார்செய்தலைக் குறிக்கிறது; எதை ஆயத்தம் செய்தார்கள் என்று மூலம் குறிப்பிடாததால் பொருள் மிகைப்படுத்தப்படவில்லை.
theological_decisions:
- issue: ‘அரசனின் தரிசகர்’ என்ற சொற்றொடரின் இலக்கணத் தொடர்பு
  choice: 'இது உடனடியாக முன்வரும் எதுத்தூனைக் குறிக்கும்: ‘அரசனின் தரிசகரான எதுத்தூன்.’'
  alternative: இச்சொற்றொடரை முன் குறிப்பிடப்பட்ட பெயர்களின் பட்டியலோடு பொதுவாக இணைத்துப் புரிந்துகொள்ளலாம்.
  rationale: ஒருமை வடிவிலுள்ள חוֹזֵה הַמֶּלֶךְ, உடனடியாக முன்வரும் ஒருமைப் பெயரான எதுத்தூனோடு இயல்பாக இணைகிறது.
- issue: ‘விலகிச் செல்ல வேண்டிய தேவை இருக்கவில்லை’ என்பதன் வலிமை
  choice: இவ்வாக்கியம் கடுமையான தடையை அல்ல, விலகிச் செல்ல வேண்டிய அவசியம் இல்லாததைத் தெரிவிக்கிறது.
  alternative: ‘அவர்கள் தங்கள் பணியிலிருந்து விலகக் கூடாது’ அல்லது ‘விலக வேண்டியவர்களாக இருக்கவில்லை’ என வலிமையாக மொழிபெயர்க்கலாம்.
  rationale: אֵין + ל infinitive கட்டமைப்பும், லேவியர்கள் அவர்களுக்காக ஆயத்தம் செய்தார்கள் என்ற அடுத்த காரணவாக்கியமும் தேவையின்மை என்ற வாசிப்பை ஆதரிக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தரிசகர்’, ‘வாயிற்காவலர்கள்’ போன்ற ஆலய மற்றும் வரலாற்றுச் சொற்கள் மூலத்தின் தனித்துவத்தைத் தக்கவைக்கின்றன. எபிரெயில் குறிப்பிடப்படாத ஆயத்தப் பொருள் சேர்க்கப்படவில்லை; இலக்கணத் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
