  text: וַֽ/יִּשְׁחֲט֖וּ הַ/פָּ֑סַח וַ/יִּזְרְק֤וּ הַ/כֹּהֲנִים֙ מִ/יָּדָ֔/ם וְ/הַ/לְוִיִּ֖ם מַפְשִׁיטִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
translation:
  language: ta
  text: அவர்கள் பஸ்காப் பலியை[a] அறுத்தார்கள்; ஆசாரியர்கள் அவர்களுடைய கைகளிலிருந்து இரத்தத்தை வீசித் தெளித்தார்கள்[b]. அதேவேளை, லேவியர்கள் பலியிடப்பட்ட விலங்குகளின் தோலை உரித்துக்கொண்டிருந்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பஸ்கா பலிப்பொருளை.” எபிரெயச் சொல் இங்கு அறுக்கப்பட்ட பஸ்கா பலியைக் குறிக்கிறது; அது ஆட்டுக்குட்டி என்று மட்டும் வரையறுக்கவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “இரத்தத்தை” என்பது எபிரெய உரையில் வெளிப்படையாக இல்லை; பலிச் சடங்குச் சூழலிலிருந்து அது வழங்கப்படுகிறது. “வீசித் தெளித்தார்கள்” என்பது பலிபீடத்தில் இரத்தத்தைச் செலுத்துவதற்கான வழக்கமான பலிச் சடங்குச் செயலைக் குறிக்கிறது.
    reason: lexical_and_cultural_note
  - marker: c
    text: எபிரெயத்தில் தோல் உரிக்கப்பட்ட செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை. அறுக்கப்பட்ட பலி விலங்குகளையே இது குறிக்கிறது.
    reason: clarity_note
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: அறுத்தார்கள்
  rationale: שׁחט என்பது பலிக்குரிய விலங்கைக் கொல்லுவதற்கான வழக்கமான சடங்குசார் சொல். தமிழில் ‘அறுத்தார்கள்’ என்பது வெறுமனே ‘கொன்றார்கள்’ என்பதைக் காட்டிலும் அந்தப் பலிச் சூழலை இயல்பாகத் தெரிவிக்கிறது.
- source_word: הַפָּסַח
  choice: பஸ்காப் பலி
  rationale: இங்கு פֶּסַח பண்டிகையை மட்டும் அல்ல, அறுக்கப்பட்ட பஸ்கா பலிப்பொருளைக் குறிக்கிறது. எபிரெயச் சொல் ஆட்டுக்குட்டி என்று வெளிப்படையாகக் குறிப்பிடாததால், ‘பஸ்காப் பலி’ அதன் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: וַיִּזְרְקוּ
  choice: வீசித் தெளித்தார்கள்
  rationale: זרק என்பது பலிபீடத்தில் இரத்தத்தைச் செலுத்தும் ஆசாரியச் செயலைக் குறிக்கும். ‘வீசித் தெளித்தார்கள்’ என்பது மெதுவாகத் துளிகளைத் தெளிப்பதைவிட, இரத்தத்தை வீசி அல்லது பாய்ச்சிப் பயன்படுத்திய சடங்குச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்கள்
  rationale: ஆலயப் பணிச் சூழலில் כֹּהֲנִים என்பதற்கான நிலையான, இயல்பான தமிழ் சொல்.
- source_word: מִיָּדָם
  choice: அவர்களுடைய கைகளிலிருந்து ... வாங்கி
  rationale: சொல்லுக்கு சொல் ‘அவர்களுடைய கையிலிருந்து’ என வரும் சொற்றொடர், அறுத்தவர்களிடமிருந்து ஆசாரியர்கள் இரத்தத்தைப் பெற்றுக்கொண்டதைச் சூழலில் குறிக்கிறது. ‘வாங்கி’ என்பது அந்த உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அவர்கள்’ யாரைக் குறிக்கிறது என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: וְהַלְוִיִּם מַפְשִׁיטִים
  choice: லேவியர்களோ ... தோலை உரித்துக்கொண்டிருந்தார்கள்
  rationale: פשט இச்சூழலில் அறுக்கப்பட்ட விலங்குகளின் தோலை நீக்குவதைக் குறிக்கிறது. எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் பொருள் தெளிவாக இருக்க ‘பலியிடப்பட்ட விலங்குகளின்’ என்று சூழலிலிருந்து நிரப்பப்பட்டுள்ளது. தொடர்நிலை வினை ஒரே நேரத்தில் நடந்த பணியைத் தெரிவிக்கிறது.
theological_decisions:
- issue: הַפָּסַח என்பதன் பலிப்பொருள்
  choice: பஸ்காப் பலி
  alternative: பஸ்கா ஆட்டுக்குட்டி
  rationale: எபிரெயச் சொல் இங்கு பலியிடப்பட்ட பஸ்கா விலங்கைக் குறித்தாலும் அதன் இனத்தை இந்த வசனத்தில் தனியே குறிப்பிடவில்லை. ஆகவே ‘பலி’ என்று மொழிபெயர்ப்பது தேவையற்ற குறிப்பாக்கத்தைத் தவிர்க்கிறது.
- issue: מִיָּדָם என்பதில் ‘அவர்கள்’ யார்?
  choice: பிரதிப்பெயரை ‘அவர்களுடைய’ என்று வைத்துப் பொருளை அடிக்குறிப்பில் விளக்குதல்
  alternative: ‘லேவியர்களுடைய கைகளிலிருந்து’ என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: சூழலில் லேவியர்களே மிகவும் இயல்பான முன்னிடுபவர்கள்; ஆயினும் இந்த வசனத்தின் எபிரெய உரை பெயரை மீண்டும் சொல்லாமல் மூன்றாம் நபர் பன்மைப் பிரதிப்பெயரையே பயன்படுத்துகிறது. எனவே மூலத்தின் ஓரளவு தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு நிகழ்வுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பஸ்கா,’ ‘ஆசாரியர்கள்,’ ‘லேவியர்கள்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன. எபிரெயத்தின் சுருக்கத்தைப் பாதுகாத்தபடியே, தமிழில் செயற்பாட்டின் வரிசையும் பொருளும் புரியத் தேவையான அளவு மட்டும் வெளிப்படுத்தப்பட்டுள்ளது.
