revisions:
- from: அவர்கள் பஸ்காப் பலியை[a] அறுத்தார்கள். ஆசாரியர்கள் அவர்களுடைய கைகளிலிருந்து இரத்தத்தை வாங்கி, அதை வீசித் தெளித்தார்கள்[b]; லேவியர்களோ பலியிடப்பட்ட விலங்குகளின் தோலை உரித்துக்கொண்டிருந்தார்கள்[c].
  to: அவர்கள் பஸ்காப் பலியை[a] அறுத்தார்கள்; ஆசாரியர்கள் அவர்களுடைய கைகளிலிருந்து இரத்தத்தை வீசித் தெளித்தார்கள்[b]. அதேவேளை, லேவியர்கள் பலியிடப்பட்ட விலங்குகளின் தோலை உரித்துக்கொண்டிருந்தார்கள்[c].
  rationale: The revision removes the unsupported explicit act ‘வாங்கி,’ avoids an uncalled-for contrast with ‘லேவியர்களோ,’ and retains the source's implicit objects only where Tamil requires contextual clarification. The supplied ‘இரத்தத்தை’ remains appropriately documented in a footnote.
  reviewer_model: gpt-5.6-terra
