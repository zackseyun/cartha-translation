source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ הָ/עֹלָ֜ה לְ֠/תִתָּ/ם לְ/מִפְלַגּ֤וֹת לְ/בֵית אָבוֹת֙ לִ/בְנֵ֣י הָ/עָ֔ם לְ/הַקְרִיב֙ לַ/יהוָ֔ה כַּ/כָּת֖וּב בְּ/סֵ֣פֶר מֹשֶׁ֑ה וְ/כֵ֖ן לַ/בָּקָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
translation:
  language: ta
  text: அவர்கள் தகனபலிகளைத் தனியே எடுத்துவைத்து, மக்களின் மகன்கள் யாவேக்குச் செலுத்துவதற்காக, மோசேயின் நூலில் எழுதப்பட்டிருக்கிறபடி, அவற்றைத் தந்தைவழிக் குடும்பங்களின் பிரிவுகளின்படி அவர்களுக்குக் கொடுக்க ஏற்பாடு செய்தார்கள்; மாடுகளுக்கும் அவ்வாறே செய்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: பிரித்தெடுத்து
  rationale: הסיר என்பதன் ஹிபில் வடிவம் ஒன்றை அதன் இடத்திலிருந்து அகற்றுதல் அல்லது தனியே எடுத்துவைத்தல் எனப் பொருள்படும். பலிப் பகுதிகளை வழங்குவதற்காகத் தனியே பிரித்தெடுத்த செயலை இச்சூழலில் இயல்பாகக் காட்டுகிறது.
- source_word: הָעֹלָה
  choice: தகனபலிக்குரிய பகுதிகளை
  rationale: עֹלָה இலக்கணத்தில் ஒருமையாக இருந்தாலும் இங்கு கூட்டுப்பொருளில் வருகிறது. அடுத்ததாக அவற்றை வழங்குவதைப் பற்றிக் கூறப்படுவதால், பலியாக முழுவதும் எரிக்கப்பட வேண்டிய பகுதிகள் குறிக்கப்படுகின்றன என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: לְמִפְלַגּוֹת לְבֵית אָבוֹת
  choice: அவர்களுடைய தந்தைவழிக் குடும்பப் பிரிவுகளின்படி
  rationale: מִפְלַגּוֹת என்பது ஒழுங்கமைக்கப்பட்ட பிரிவுகளையும், בֵּית אָבוֹת என்பது தந்தைவழி மூதாதைக் குடும்ப அலகுகளையும் குறிக்கிறது. தமிழில் புரியக்கூடிய வகையில் இரண்டின் சமூக-நிர்வாகப் பொருளும் பாதுகாக்கப்படுகிறது.
- source_word: לִבְנֵי הָעָם
  choice: மக்களின் மகன்களுக்கு
  rationale: எபிரெயச் சொற்றொடரின் ஆண்பால் வடிவத்தையும் பிரதிநிதித்துவப் பயன்பாட்டையும் முதன்மை உரை பாதுகாக்கிறது; இது ஆசாரியர் மற்றும் லேவியரிலிருந்து வேறுபட்ட பொதுமக்களைக் குறிக்கலாம் என்பதைக் காலடிக்குறிப்பு விளக்குகிறது.
- source_word: לְהַקְרִיב לַיהוָה
  choice: யாவேக்குச் செலுத்துவதற்காக
  rationale: הקריב பலிச் சூழலில் கடவுளிடம் கொண்டுவந்து செலுத்துதல் அல்லது பலியிடுதல் எனப் பொருள்படும். இங்கு மக்களிடம் கொடுக்கப்பட்ட பகுதிகளை அவர்கள் யாவேக்குச் செலுத்துவது நோக்கமாகத் தெரிவதால் இவ்வடிவம் இயல்பானது.
- source_word: וְכֵן לַבָּקָר
  choice: மாடுகளுக்கும் அவ்வாறே செய்தார்கள்
  rationale: எபிரெயத்தில் வினைச்சொல் விடுபட்டுள்ள சுருக்கமான தொடர், அதே நடைமுறை மாடுகளுக்கும் பின்பற்றப்பட்டது என்பதைக் குறிக்கிறது. தமிழில் பொருள் நிறைவடைய குறைந்த அளவில் வினைச்சொல் நிரப்பப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: לִבְנֵי הָעָם என்பதிலுள்ள ஆண்பால் பிரதிநிதித்துவ மொழி
  choice: மக்களின் மகன்களுக்கு
  alternative: மக்களுக்கு / பொதுமக்களுக்கு
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் வடிவத்தை முதன்மை உரையில் பாதுகாத்து, அதன் சமூகக் குழுவைக் குறிக்கும் விரிவான பொருளைக் காலடிக்குறிப்பில் தருகிறது.
- issue: לְהַקְרִיב என்ற நோக்கவினையின் மறைமுக எழுவாய்
  choice: அவர்கள் அவற்றை யாவேக்குச் செலுத்துவதற்காக
  alternative: யாவேக்குச் செலுத்தும்படி
  rationale: இங்கு செலுத்துபவர்கள் பலிப் பகுதிகளைப் பெற்ற மக்களா அல்லது செயலை ஒழுங்குபடுத்தியவர்களா என்பதில் எபிரெய வாக்கிய அமைப்பு ஓரளவு சுருக்கமாக உள்ளது. அருகிலுள்ள பெறுநரை எழுவாயாக எடுத்துக்கொள்ளும் இயல்பான வாசிப்பை உரை வழங்குகிறது; ஆனால் பலிச் செயல்முறையை அதற்கு மேலாக விவரிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெயத்தின் குடும்ப-குல நிர்வாகச் சொல்லாட்சி இயன்றவரை பாதுகாக்கப்பட்டு, சுருக்கமான இறுதி தொடரில் மட்டும் தமிழுக்குத் தேவையான வினைச்சொல் நிரப்பப்பட்டது.
