translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் வாசிப்புத் தெளிவும் பேணப்பட்டுள்ளன. எபிரெயச் சமூக அமைப்பைக் காட்ட ‘தந்தைவழிக் குடும்பங்கள்’ என்றும், வழிபாட்டுப் பணியமைப்பைக் காட்ட பொதுவாகப் புரியும் ‘பிரிவுகள்’ என்றும் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு எழுத்து/ஆவணக் குறிப்புகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
