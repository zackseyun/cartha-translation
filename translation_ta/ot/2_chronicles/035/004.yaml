revisions:
- from: உங்கள் தந்தைவழிக் குடும்பங்களின்படியும் உங்கள் பிரிவுகளின்படியும்[a][b] உங்களை ஆயத்தப்படுத்திக்கொள்ளுங்கள்; இஸ்ரவேலின் அரசனாகிய தாவீதின் எழுத்திலும், அவருடைய மகன் சாலொமோனின் எழுத்திலும் விதிக்கப்பட்டுள்ளபடி செய்யுங்கள்.
  to: இஸ்ரவேலின் அரசன் தாவீதின் எழுத்திலும் அவருடைய மகன் சாலொமோனின் எழுத்திலும் கூறப்பட்டபடி, உங்கள் தந்தைவழிக் குடும்பங்களின்படியும் உங்கள் பிரிவுகளின்படியும்[a][b] உங்களை ஆயத்தப்படுத்திக்கொள்ளுங்கள்.
