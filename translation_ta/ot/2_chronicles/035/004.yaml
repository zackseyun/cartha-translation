base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/004.yaml
  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
translation:
  language: ta
  text: இஸ்ரவேலின் அரசன் தாவீதின் எழுத்திலும் அவருடைய மகன் சாலொமோனின் எழுத்திலும் கூறப்பட்டபடி, உங்கள் தந்தைவழிக் குடும்பங்களின்படியும் உங்கள் பிரிவுகளின்படியும்[a][b] உங்களை ஆயத்தப்படுத்திக்கொள்ளுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தந்தைவழிக் குடும்பங்கள்’ என்பது இஸ்ரவேலுக்குள் இருந்த மூதாதையர் அல்லது தந்தைவழிக் குடும்பக் குழுக்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘பிரிவுகள்’ என்பதை, குறிப்பாக ஆசாரியர் அல்லது லேவியரின் ஒழுங்கமைக்கப்பட்ட பணிக்குழுக்களைக் குறிக்கும் வகையில், ‘முறைப்பணிக் குழுக்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָכִינוּ
  choice: உங்களை ஆயத்தப்படுத்திக்கொள்ளுங்கள்
  rationale: כון என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவம் செயலில் ஆயத்தப்படுத்துதல் அல்லது ஒழுங்குபடுத்துதலைக் குறிக்கிறது. வழிபாட்டு மற்றும் அமைப்புச் சூழலில் இத்தமிழ் இயல்பாக உள்ளது.
- source_word: לְבֵית אֲבוֹתֵיכֶם
  choice: உங்கள் தந்தைவழிக் குடும்பங்களின்படி
  rationale: בֵית אָבוֹת என்பது இஸ்ரவேலின் தந்தைவழி மூதாதையர் குடும்பக் குழுக்களைக் குறிக்கிறது. ‘தந்தைவழிக் குடும்பங்கள்’ வரலாற்றுச் சமூக அமைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כְּמַחְלְקוֹתֵיכֶם
  choice: உங்கள் பிரிவுகளின்படி
  rationale: מַחְלְקוֹת என்பது குறிப்பாக ஆசாரியர் அல்லது லேவியர் பணியமைப்பில் ஒதுக்கப்பட்ட பிரிவுகளைக் குறிக்கிறது. ‘பிரிவுகள்’ நவீன வாசகருக்குத் தெளிவான பொதுச் சொல்.
- source_word: בִּכְתָב
  choice: எழுத்தில் விதிக்கப்பட்டுள்ளபடி
  rationale: כְּתָב என்பது எழுத்து அல்லது ஆவணம்; இங்கு בְּ அந்த அதிகாரபூர்வமான எழுத்துக்கு இணங்கச் செயல்படுவதை உணர்த்துகிறது. ‘விதிக்கப்பட்டுள்ளபடி’ அதன் சூழல்சார் செயல்பாட்டை வெளிப்படுத்துகிறது.
- source_word: דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசனாகிய தாவீது
  rationale: அரச பட்டத்தை இயல்பான தமிழ் இணைப்புடன் நேரடியாக வழங்குகிறது.
- source_word: וּבְמִכְתַּב
  choice: அவருடைய மகன் சாலொமோனின் எழுத்திலும்
  rationale: מִכְתָּב என்பதும் எழுதப்பட்ட ஆவணத்தைக் குறிக்கிறது. முதல் கூறிலுள்ள ‘விதிக்கப்பட்டுள்ளபடி’ இரு எழுத்துகளுக்கும் பொருந்துமாறு இறுதியில் அமைக்கப்பட்டுள்ளது.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: அவருடைய மகன் சாலொமோன்
  rationale: ‘அவருடைய’ என்பது தாவீதைக் குறிக்கிறது; தந்தை-மகன் உறவைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
