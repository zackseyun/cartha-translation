- source_word: לִבְנֵי הָעָם
  choice: மக்களுக்காக
  rationale: சொல்லுக்குச் சொல் ‘மக்களின் புதல்வர்களுக்கு’ என்றாலும், இச்சொற்றொடர் பொதுமக்களைக் குறிக்கும் எபிரேய வழக்கு. நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கியதாகவும் ‘மக்களுக்காக’ என வழங்கப்பட்டுள்ளது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: צֹאן
