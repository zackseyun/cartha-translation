base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
translation:
  language: ta
  text: யோசியா மக்களுக்கு[a] மந்தையிலிருந்து ஆட்டுக்குட்டிகளையும் வெள்ளாட்டுக்குட்டிகளையும் வழங்கினார்; அவை அனைத்தும் அங்கே இருந்த அனைவருக்குமான பஸ்காப் பலிகளுக்காக[b] இருந்தன. அவற்றின் எண்ணிக்கை முப்பதாயிரம். மேலும், அவர் மூவாயிரம் மாடுகளையும் வழங்கினார். இவையெல்லாம் அரசனுடைய உடைமைகளிலிருந்து வந்தவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “மக்களின் புதல்வர்களுக்கு”; இது பொதுமக்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அனைத்தும் பஸ்காக்களுக்காக.” இங்குள்ள எபிரேயப் பன்மை பெரும்பாலும் பஸ்கா பலி விலங்குகளை மொத்தமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
