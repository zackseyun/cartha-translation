theological_decisions:
- issue: פְּסָחִים என்ற பன்மையின் குறிப்பு
  choice: பஸ்காப் பலிகளாக
  alternative: பஸ்காக்களுக்காக / பஸ்கா கொண்டாட்டங்களுக்காக
  rationale: இச்சூழலில் பன்மைச் சொல் பல பஸ்கா விழாக்களைக் காட்டுவதற்குப் பதிலாக, பங்கேற்பாளர்களுக்காக வழங்கப்பட்ட பஸ்கா பலி விலங்குகளை மொத்தமாகக் குறிக்கும் வாய்ப்பு அதிகம். இருப்பினும் எபிரேய பன்மையின் வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
