translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்று நிறைவுச் சூத்திரத்தின் கண்ணியமான தொனியைப் பேணும் வகையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இல்லாத தொடக்கக் காலச்சுட்டுச் சொல் சேர்க்கப்படவில்லை; הִנָּם என்பதன் கவன ஈர்ப்பு ‘இதோ’ என வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
