  edition: WLC
  text: וּ/דְבָרָ֕י/ו הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵֽי יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/027.yaml
  text: His acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: ta
  text: அவருடைய முந்தைய மற்றும் பிந்தைய செயல்கள்[a] இதோ, இஸ்ரவேல் மற்றும் யூதாவின் அரசர்களின் நூலில்[b] எழுதப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “செயல்கள்” என்பதற்கான எபிரெயச் சொல் “சொற்கள்,” “காரியங்கள்,” அல்லது “செயல்கள்” என்றும் பொருள்படலாம். அரச வரலாற்றைச் சுருக்கிக் கூறும் இச்சூழலில் “செயல்கள்” என்பது பொருத்தமானது.
    reason: lexical_alternative
  - marker: b
    text: வேறுவிதமாக, “இஸ்ரவேல் மற்றும் யூதாவின் அரசர்களின் சுருளில்.” எபிரெயில் சொல்லுருவாக “நூல்/சுருளின்மேல்” என்று உள்ளது; எழுத்துப் பதிவைக் குறிக்க தமிழில் “நூலில்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  choice: அவருடைய செயல்கள்
  rationale: דבר என்பது ‘சொற்கள்,’ ‘காரியங்கள்,’ அல்லது ‘செயல்கள்’ என்று பொருள்படலாம். ஓர் அரசனின் ஆட்சியைச் சுருக்கிக் கூறி வரலாற்று ஆதாரத்தைச் சுட்டும் இச்சூழலில் ‘செயல்கள்’ என்பது இயல்பாகவும் பொருத்தமாகவும் உள்ளது; மூலச்சொல்லின் விரிந்த பொருளை அடிக்குறிப்பு தெரிவிக்கிறது.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: முந்தினதும் பிந்தினதுமான
  rationale: அவருடைய வரலாற்றின் முற்பகுதியையும் பிற்பகுதியையும், அதன் முழுப் பரப்பையும் குறிக்கும் எபிரெய மரபுத்தொடரை நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: הִנָּם
  choice: இதோ
  rationale: எழுதப்பட்ட ஆதாரத்தின்மீது வாசகரின் கவனத்தைத் திருப்பும் மூலத்தின் வலியுறுத்தலைத் தெளிவாகப் பேணுகிறது.
- source_word: כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: כתב என்பதன் செயப்பாட்டு வடிவத்தை நேரடியாகவும் இயல்பான தமிழிலும் தருகிறது.
- source_word: עַל סֵפֶר
  choice: நூலில்
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்’ என்றாலும், ஒரு பதிவில் தகவல் எழுதப்பட்டிருப்பதைக் குறிக்க நவீன தமிழில் ‘நூலில்’ என்பதே இயல்பானது. ספר என்பதற்கு இங்கு ‘நூல்’ பொருத்தமானது; வரலாற்று வடிவில் அது சுருளாக இருந்திருக்கலாம்.
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: இஸ்ரவேல் மற்றும் யூதாவின் அரசர்கள்
  rationale: மேற்கோள் காட்டப்படும் வரலாற்று ஆவணத்தின் பெயரை இரு நாடுகளையும் இணைத்து தெளிவாகத் தருகிறது.
