base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
translation:
  language: ta
  text: ஆனால் யோசியா அவனைவிட்டு தன் முகத்தைத் திருப்பவில்லை[a]. மாறாக, அவனுக்கு எதிராகப் போரிடுவதற்காக மாறுவேடமிட்டான். கடவுளின் வாயிலிருந்து[b] வந்த நெகோவின் வார்த்தைகளுக்கு அவன் செவிகொடுக்கவில்லை; மெகிதோ பள்ளத்தாக்கில்[c] போரிட வந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனைவிட்டு விலகவில்லை.’
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயில் சொல்லுக்குச் சொல்: ‘கடவுளின் வாயிலிருந்து.’'
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘மெகிதோ சமவெளியில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  choice: அவனைவிட்டு தன் முகத்தைத் திருப்பவில்லை
  rationale: முகத்தைத் திருப்புதல் என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடியே, நவீனத் தமிழில் இயல்பாகப் பொருள் தருகிறது.
- source_word: כִּי
  choice: மாறாக
  rationale: இங்கு கண்டிப்பான காரணத்தைச் சுட்டுவதைவிட, யோசியா விலகாமல் அதற்கு மாறாகச் செய்ததை விளக்கும் எதிர்மறைத் தொடர்பை இது காட்டுகிறது.
- source_word: לְהִלָּחֵם בּוֹ
  choice: அவனுக்கு எதிராகப் போரிடுவதற்காக
  rationale: இறுதிநோக்கை வெளிப்படுத்தும் கட்டமைப்பையும், நெகோவுக்கு எதிரான போர் என்ற சூழலையும் தெளிவாகக் காட்டுகிறது.
- source_word: הִתְחַפֵּשׂ
  choice: மாறுவேடமிட்டான்
  rationale: தன்னை வேறொருவனாகக் காட்டும்படி வேடமிடுதல் என்ற வினையின் தன்னிலைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שָׁמַע אֶל
  choice: செவிகொடுக்காமல்
  rationale: கேட்பது, கவனிப்பது, கீழ்ப்படிவது ஆகிய பொருள் நிழல்களைத் தேவையின்றி ஒன்றாகக் குறுக்காமல், சூழலுக்கேற்ற பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: דִּבְרֵי נְכוֹ
  choice: நெகோவின் வார்த்தைகள்
  rationale: ‘செய்தி’ என்று விளக்கிப் பொருள்கூறாமல், மூலத்தின் பொதுவான ‘வார்த்தைகள்’ என்பதைக் காக்கிறது.
- source_word: מִפִּי אֱלֹהִים
  choice: கடவுளின் வாயிலிருந்து வந்த
  rationale: நெகோவின் வார்த்தைகள் கடவுளிடமிருந்து வந்தவை என வசனம் முன்வைப்பதைத் தணிக்காமல், ‘கடவுளின் வாயிலிருந்து’ என்ற மூல உருவகத்தையும் பாதுகாக்கிறது.
- source_word: וַיָּבֹא
  choice: வந்தான்
  rationale: בוא என்பதன் நேரடியான கதைநடைப் பொருளைத் தருகிறது.
- source_word: בְּבִקְעַת מְגִדּוֹ
  choice: மெகிதோ பள்ளத்தாக்கில்
  rationale: בִּקְעָה குறிக்கும் அகன்ற பள்ளத்தாக்கு அல்லது பள்ளத்தாக்குச் சமவெளி என்ற புவியியல் கருத்தைத் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: நெகோவின் வார்த்தைகள் உண்மையில் கடவுளிடமிருந்து வந்ததாக வசனம் கூறுகிறதா
  choice: ‘கடவுளின் வாயிலிருந்து வந்த நெகோவின் வார்த்தைகள்’ என்று முதன்மை உரையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘கடவுளிடமிருந்து வந்த நெகோவின் வார்த்தைகள்’ என்று உருவகத்தை எளிமைப்படுத்தலாம்; அல்லது நெகோவின் கூற்றாக மட்டும் அதை மறைமுகமாக்கலாம்.
  rationale: நாளாகம ஆசிரியர் அந்த வார்த்தைகளுக்குத் தெய்வீக மூலத்தை உரித்தாக்குவதை வசனம் நேரடியாக முன்வைக்கிறது. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தணிக்கவோ, நெகோவின் ஆதாரமற்ற கூற்றாக மாற்றவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘முகத்தைத் திருப்பவில்லை’ மற்றும் ‘கடவுளின் வாயிலிருந்து’ ஆகிய மூல உருவகங்கள் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளன; ‘மாறாக’, ‘மாறுவேடமிட்டான்’, ‘செவிகொடுக்காமல்’ ஆகியவை இயல்பான தமிழ்ச் சொற்தொடர்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன.
