base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
translation:
  language: ta
  text: அவர்கள் பஸ்கா பலியை விதிமுறைப்படி நெருப்பில் சமைத்தார்கள்[a]. பரிசுத்தப் பலிகளைப் பானைகளிலும் கொப்பரைகளிலும் கிண்ணங்களிலும் வேகவைத்து, மக்கள் அனைவருக்கும் விரைவாகக் கொண்டு சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை இன்னும் குறிப்பாக, “பஸ்கா பலியை நெருப்பில் வாட்டினார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை பொதுவாக ‘சமைத்தல்’ என்று பொருள்படலாம்; ஆனால் பஸ்கா விதி அதை வேகவைக்காமல் நெருப்பில் வாட்ட வேண்டும் என்று கூறுகிறது (யாத். 12:8–9 காண்க).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ
  choice: சமைத்தார்கள்
  rationale: בשׁל என்னும் வினை பொதுவாகச் ‘சமைத்தல்’ அல்லது குறிப்பாக ‘வேகவைத்தல்’ எனப் பொருள்படலாம். இங்கு ‘நெருப்பில்’ என்றும் ‘விதிமுறைப்படி’ என்றும் வருவதால், பஸ்காப் பலி சட்டப்படி நெருப்பில் வாட்டப்பட்டதைக் குறிக்கிறது; மூலத்தின் பரந்த வினைப்பொருளைப் பாதுகாக்க ‘சமைத்தார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַפֶּסַח
  choice: பஸ்காப் பலி
  rationale: இச்சடங்குச் சூழலில் இச்சொல் பண்டிகையை மட்டும் அல்லாமல் சமைக்கப்பட்ட பலியையே குறிக்கிறது. மூலத்தில் ‘ஆட்டுக்குட்டி’ வெளிப்படையாக இல்லாததால் அதனைச் சேர்க்காமல், குறிப்பிட்ட பொருளைத் தெளிவுபடுத்த ‘பஸ்காப் பலி’ என வழங்கப்பட்டது.
- source_word: בָּאֵשׁ
  choice: நெருப்பில்
  rationale: சமையல் முறையைக் கூறும் எபிரெய முன்சேர்க்கைத் தொடரின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: כַּמִּשְׁפָּט
  choice: விதிமுறைப்படி
  rationale: இங்கு מִשְׁפָּט என்பது நிர்ணயிக்கப்பட்ட சட்ட அல்லது சடங்கு நடைமுறையைக் குறிக்கிறது; ‘விதிமுறைப்படி’ என்பது நவீனத் தமிழில் தெளிவாகவும் மரியாதையான நடையிலும் உள்ளது.
- source_word: וְהַקֳּדָשִׁים
  choice: மற்ற பரிசுத்தப் பலிகள்
  rationale: இலக்கண அமைப்பும் வேறுபட்ட சமையல் முறைகளும் இவை பஸ்காப் பலியிலிருந்து வேறான அர்ப்பணிப்புகள் என்பதைக் காட்டுகின்றன. தமிழில் அந்த எதிர்மறை இணைப்பைத் தெளிவாக்க ‘மற்ற’ சேர்க்கப்பட்டது.
- source_word: בִּשְּׁלוּ
  choice: வேகவைத்து
  rationale: உடனே பட்டியலிடப்படும் பாத்திரங்கள் நீரில் அல்லது திரவத்தில் வேகவைக்கும் முறையைச் சுட்டுகின்றன; முதல் பலியின் நெருப்பு முறையுடனான வேறுபாட்டையும் இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּסִּירוֹת וּבַדְּוָדִים וּבַצֵּלָחוֹת
  choice: பானைகளிலும் கொப்பரைகளிலும் கிண்ணங்களிலும்
  rationale: மூன்று வகை சமையல் அல்லது பரிமாறும் பாத்திரங்களின் வேறுபாட்டை முடிந்தவரை காக்கும் இயல்பான தமிழ் இணைகள். צֵלָחוֹת என்பதன் துல்லிய வடிவம் உறுதியற்றதால் பொதுவான ‘கிண்ணங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיָּרִיצוּ
  choice: விரைவாகக் கொண்டுபோனார்கள்
  rationale: இவ்வினை இயக்கத்தோடு அவசரத்தையும் குறிக்கிறது; தமிழ் சொற்றொடர் இரண்டு கூறுகளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְכָל בְּנֵי הָעָם
  choice: மக்கள் அனைவரிடமும்
  rationale: சொல்லுக்குச் சொல் ‘மக்களின் மகன்கள்’ என்றாலும், இது பொதுமக்கள் அனைவரையும் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் இயல்பாக பிரதிநிதித்துவப் பொருளுடன் வழங்கப்பட்டது.
theological_decisions:
- issue: בשׁל என்ற வினைக்கும் பஸ்கா பலியை நெருப்பில் வாட்ட வேண்டும் என்ற சட்டத்திற்கும் இடையிலான சாத்தியமான பதற்றம்
  choice: முதல் வினையைப் பரந்த பொருளில் ‘சமைத்தார்கள்’ என வைத்து, ‘விதிமுறைப்படி நெருப்பில்’ என்பது சட்டப்பூர்வமான முறையை விளக்க அனுமதிக்கப்பட்டது.
  alternative: ‘நெருப்பில் வாட்டினார்கள்’ என்று குறிப்பாக மொழிபெயர்த்தல்; அல்லது இரண்டு வினைகளையும் ஒரேபோல் ‘வேகவைத்தார்கள்’ என வழங்குதல்.
  rationale: வசனமே பஸ்காப் பலியை நெருப்பில் தயாரித்ததையும் மற்ற பரிசுத்தப் பலிகளைப் பாத்திரங்களில் வேகவைத்ததையும் வேறுபடுத்துகிறது. ஆகவே மூல வினையின் பரந்த பொருளும் பஸ்கா சட்டத்தின் சமையல் முறையும் இரண்டும் பாதுகாக்கப்படுகின்றன.
- issue: הַקֳּדָשִׁים என்பதன் குறிப்பு
  choice: பஸ்காப் பலியிலிருந்து வேறான பரிசுத்தப் பலிகளாக எடுத்துக்கொள்ளப்பட்டது.
  alternative: பஸ்காப் பலியையும் உள்ளடக்கிய எல்லாப் பரிசுத்த உணவுகளுக்குமான பொதுக் குறிப்பாக எடுத்துக்கொள்ளுதல்.
  rationale: வாக்கிய அமைப்பு ‘பஸ்கா’ என்பதையும் ‘பரிசுத்தப் பலிகள்’ என்பதையும் எதிரெதிராக அமைக்கிறது; வேறுபட்ட தயாரிப்பு முறைகளும் இவ்வேறுபாட்டை ஆதரிக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான வேதாகம நடையில் வடிவமைக்கப்பட்டது. ‘பஸ்காப் பலி’ என்பது மூலத்தில் இல்லாத ‘ஆட்டுக்குட்டி’யைச் சேர்க்காமல் சடங்கு சார்ந்த குறிப்பைத் தெளிவாக்குகிறது. பாத்திரப் பெயர்களில் மிகப் பழமையான சொற்களைத் தவிர்த்து, வகை வேறுபாடு ஓரளவு காக்கப்பட்டது.
