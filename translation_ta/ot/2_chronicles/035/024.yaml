translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நிகழ்வுரை நடை பயன்படுத்தப்பட்டது. மூலத்தின் தொடர்ச்சியான செயல்வரிசை இயல்பான தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘இரண்டாவது தேர்’ என்பதிலுள்ள உண்மையான சொற்பொருள் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
