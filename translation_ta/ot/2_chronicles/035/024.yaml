base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
translation:
  language: ta
  text: அவனுடைய பணியாளர்கள் அவனை அந்தத் தேரிலிருந்து இறக்கி, அவனுக்குச் சொந்தமான இரண்டாவது தேரில்[a] ஏற்றி, எருசலேமுக்குக் கொண்டுவந்தார்கள். அவன் இறந்து, தன் முன்னோர்களின் கல்லறைகளில் அடக்கம் செய்யப்பட்டான். யூதாவும் எருசலேமும் முழுவதும் யோசியாவுக்காகத் துக்கம் அனுசரித்தனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லடிப்படையாக, ‘இரண்டாவதின் தேர்’; இது யோசியாவுக்குச் சொந்தமான மாற்று அல்லது கூடுதல் தேரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירֻהוּ
  choice: அவனை ... இறக்கி
  rationale: இங்கு ஹிஃபில் வடிவம் ஒருவரை ஓரிடத்திலிருந்து மற்றோர் இடத்துக்கு மாற்றுவதைக் குறிக்கிறது; காயமடைந்த யோசியா தேரிலிருந்து எடுக்கப்படுவதால், இயல்பான தமிழில் ‘இறக்கி’ என்பது சூழலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: அரசனுக்குப் போர்க்களத்தில் உதவி செய்து அவனை எடுத்துச் சென்ற உடனிருப்போரை இது குறிக்கிறது. அவர்களின் குறிப்பிட்ட பதவியை மூலவுரை கூறாததால் ‘பணியாளர்கள்’ எனப் பொதுவாக மொழிபெயர்க்கப்பட்டது.
- source_word: הַמֶּרְכָּבָה
  choice: அந்தத் தேர்
  rationale: முன்னதாகச் சூழலில் அறிமுகமான போர்த் தேரைச் சுட்டும் எபிரெய definite article-ஐ இயல்பான தமிழில் ‘அந்தத் தேர்’ என வழங்குகிறது.
- source_word: וַיַּרְכִּיבֻהוּ
  choice: ஏற்றி
  rationale: ரכב என்பதன் ஹிஃபில் வடிவம் ஒருவரை வாகனத்தில் ஏற்றுதல் அல்லது பயணிக்கச் செய்தல் என்று பொருள்படும்; காயமடைந்த அரசனின் சூழலில் ‘ஏற்றி’ இயல்பாக உள்ளது.
- source_word: רֶכֶב הַמִּשְׁנֶה
  choice: இரண்டாவது தேர்
  rationale: சொல்லடிப்படையில் ‘இரண்டாவதின் தேர்’ என்ற தெளிவற்ற அமைப்பை நெருக்கமாகப் பாதுகாக்கிறது; இது மாற்றாக வைத்திருந்த தேர் என இருக்கலாம், ஆனால் அந்த விளக்கம் முதன்மை உரையில் திணிக்கப்படவில்லை.
- source_word: אֲשֶׁר לוֹ
  choice: அவனுக்குச் சொந்தமான
  rationale: இந்த உறவுச் சொற்றொடர் அந்த இரண்டாவது தேர் யோசியாவுக்குரியது என்பதைத் தெளிவுபடுத்துகிறது.
- source_word: וַיּוֹלִיכֻהוּ
  choice: கொண்டுவந்தார்கள்
  rationale: הלך என்பதன் ஹிஃபில் வடிவம் இங்கு இலக்கான எருசலேமுக்கு ஒருவரைக் கொண்டு செல்வதைக் குறிக்கிறது; தமிழ் நிகழ்வுரையில் ‘கொண்டுவந்தார்கள்’ இயல்பானது.
- source_word: וַיָּמָת
  choice: அவன் இறந்து
  rationale: מות என்பதன் எளிய நிகழ்வுரை வடிவம்; அடுத்த இணைந்த செயலைத் தமிழில் இயல்பாகத் தொடர வினையெச்சமாக வழங்கப்பட்டது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: קבר என்பதன் நிஃபால் வடிவத்திலுள்ள செயப்பாட்டு பொருளைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: בְּקִבְרוֹת אֲבֹתָיו
  choice: தன் முன்னோர்களின் கல்லறைகளில்
  rationale: ‘அவனுடைய தந்தையர்’ என்பது இங்கு வம்சத்து முன்னோர்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்; நவீன தமிழில் ‘முன்னோர்கள்’ பொருளைத் தெளிவாகக் கொடுக்கிறது, மேலும் ‘கல்லறைகள்’ என்ற பன்மை பாதுகாக்கப்படுகிறது.
- source_word: וְכָל־יְהוּדָה וִירוּשָׁלַם
  choice: யூதா முழுவதும் எருசலேமும்
  rationale: நாடும் தலைநகரமும் அவற்றின் மக்களைப் பிரதிநிதித்துவப்படுத்தும் மூலவுரையின் உருவகப் பயன்பாட்டை, ‘மக்கள்’ என்று வெளிப்படையாகச் சேர்க்காமல் பாதுகாக்கிறது.
- source_word: מִתְאַבְּלִים
  choice: துக்கம் அனுசரித்தன
  rationale: இந்தப் பங்கேற்புவினை நடந்துகொண்டிருந்த துக்கநிலையைக் குறிக்கிறது. தமிழில் சமூகமெங்கும் கடைப்பிடித்த துக்கத்தை ‘துக்கம் அனுசரித்தன’ இயல்பாக வெளிப்படுத்துகிறது.
