- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: இங்கு பொதுப் பட்டப்பெயர் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. எனவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: בְּיַד מֹשֶׁה என்ற இடையீட்டு மரபுத்தொடர்
  choice: மோசேயின் மூலம்
  alternative: மோசேயின் கையால்
  rationale: இது வார்த்தை மோசே வழியாக அளிக்கப்பட்டதைக் குறிக்கும் எபிரெய மரபுத்தொடர். முதன்மை உரை இயல்பான தமிழ் பொருளைக் கொடுக்கிறது; அதன் உடல்சார்ந்த உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
