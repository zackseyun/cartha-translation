  text: וְ/שַׁחֲט֖וּ הַ/פָּ֑סַח וְ/הִתְקַדְּשׁוּ֙ וְ/הָכִ֣ינוּ לַ/אֲחֵי/כֶ֔ם לַ/עֲשׂ֥וֹת כִּ/דְבַר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
translation:
  language: ta
  text: பஸ்கா பலியை[a] அறுங்கள்; உங்களைப் பரிசுத்தப்படுத்திக்கொள்ளுங்கள்; உங்கள் சகோதரர்கள் மோசேயின் மூலம் அளிக்கப்பட்ட யாவேயின் வார்த்தையின்படி செய்யும்படி, அவர்களுக்காக ஆயத்தம் செய்யுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “பஸ்கா.” இங்கு அந்தச் சொல் அறுக்கப்படும் பஸ்காப் பலி விலங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  choice: அறுத்து
  rationale: שׁחט என்பது இங்கு பலிக்குரிய விலங்கைச் சடங்குமுறையில் அறுப்பதைக் குறிக்கிறது; பொதுவான ‘கொல்லுங்கள்’ என்பதைவிட ‘அறுத்து’ பலிச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַפָּסַח
  choice: பஸ்காப் பலியை
  rationale: எபிரெயச் சொல் நேரடியாக ‘பஸ்கா’ என இருந்தாலும், அறுக்கப்படுவது பண்டிகை அல்ல, அதற்குரிய பலி விலங்கு. ‘பஸ்காப் பலி’ இந்த ஆகுபெயர்ப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; விலங்கை ஆட்டுக்குட்டி என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: וְהִתְקַדְּשׁוּ
  choice: உங்களைப் பரிசுத்தப்படுத்திக்கொண்டு
  rationale: קדשׁ என்பதன் தன்னிலை வடிவம் புனிதப் பணிக்கான சடங்குமுறை ஆயத்தத்தைக் குறிக்கிறது. தமிழ் வடிவம் அதன் தன்னிலைத் தன்மையையும் புனிதச் சூழலையும் காக்கிறது.
- source_word: וְהָכִינוּ
  choice: ஆயத்தம் செய்யுங்கள்
  rationale: כון என்பதன் ஹிஃபீல் வடிவம் ‘ஆயத்தப்படுத்துதல்’ அல்லது ‘தயார் செய்தல்’ என்று பொருள்படும். மூலத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; தமிழிலும் அதைச் சேர்க்காமல் விடப்பட்டுள்ளது.
- source_word: לַאֲחֵיכֶם
  choice: உங்கள் சகோதரர்களுக்காக
  rationale: எபிரெயத்தில் ஆண்பால் பன்மையான ‘உங்கள் சகோதரர்கள்’ என்ற உறவுச் சொல் உள்ளது. இங்கு அது உடன் இருக்கும் இஸ்ரவேலர்களைக் குறிக்கக்கூடும்; இருந்தாலும் மூலத்தின் சொல்வடிவம் முதன்மை உரையில் காக்கப்படுகிறது.
- source_word: לַעֲשׂוֹת
  choice: செய்யுங்கள்
  rationale: עשה என்ற வினைச்சொல் பொதுவாக ‘செய்தல்’ எனப் பொருள்படும். தமிழில் வாக்கியத்தை இயல்பாக்க வினைமுற்றாக அமைக்கப்பட்டுள்ளது; எதைச் செய்ய வேண்டும் என்பது தொடர்ந்து வரும் யாவேயின் வார்த்தையால் வரையறுக்கப்படுகிறது.
- source_word: כִּדְבַר יְהוָה
  choice: யாவேயின் வார்த்தையின்படி
  rationale: דבר என்பது ‘வார்த்தை’, ‘காரியம்’ அல்லது சூழலின்படி ‘கட்டளை’ எனப் பொருள்படலாம். ‘வார்த்தை’ என்பது மூல உருவகத்தைப் பாதுகாத்து அதன் அதிகாரத்தையும் உணர்த்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் திருப்பெயர் தலைப்புப் பெயரால் மாற்றப்படாமல், அதன் ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பைத் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கிறது.
- source_word: בְּיַד מֹשֶׁה
  choice: மோசேயின் மூலம்
  rationale: ‘மோசேயின் கையால்’ என்ற எபிரெய மரபுத்தொடர் அவருடைய இடையீட்டின் மூலம் வார்த்தை அளிக்கப்பட்டதைக் குறிக்கிறது. ‘மோசேயின் மூலம்’ என்பது தற்போதைய தமிழில் அதன் பொருளை இயல்பாகத் தருகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
