  to: பஸ்கா பலியை[a] அறுங்கள்; உங்களைப் பரிசுத்தப்படுத்திக்கொள்ளுங்கள்; உங்கள் சகோதரர்கள் மோசேயின் மூலம் அளிக்கப்பட்ட யாவேயின் வார்த்தையின்படி செய்யும்படி, அவர்களுக்காக ஆயத்தம் செய்யுங்கள்.
