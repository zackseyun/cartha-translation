translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆட்சி’ இயல்பான அரசாண்டுக் குறிப்பை வழங்குகிறது; ‘அனுசரிக்கப்பட்டது’ வழிபாட்டு நிகழ்வின் சூழல்சார் பொருளைத் தருகிறது. அடிக்குறிப்பு குறி முதன்மை உரையில் இடம்பெற்றுள்ளது.
