  yaml_path: translation/ot/2_chronicles/035/019.yaml
  text: In the eighteenth year of Josiah’s reign[a], this Passover was kept.
translation:
  language: ta
  text: யோசியாவின் ஆட்சியின் பதினெட்டாம் ஆண்டில் இந்தப் பஸ்கா அனுசரிக்கப்பட்டது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இந்தப் பஸ்கா கடைப்பிடிக்கப்பட்டது”; இன்னும் சொல்லுக்குச் சொல்லாக, “இந்தப் பஸ்கா செய்யப்பட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: பதினெட்டாம் ஆண்டில்
  rationale: בְּ முன்னொட்டுடன் வரும் எண்ணும் שָׁנָה என்பதும் காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடராக உள்ளன; நவீனத் தமிழில் இயல்பாகப் ‘பதினெட்டாம் ஆண்டில்’ என்று தரப்படுகிறது.
- source_word: לְמַלְכוּת יֹאשִׁיָּהוּ
  choice: யோசியாவின் ஆட்சியின்
  rationale: מַלְכוּת இங்கு அரசனுடைய ஆட்சிக்காலத்தைக் குறிக்கிறது. ‘யோசியாவின் ஆட்சியின் பதினெட்டாம் ஆண்டில்’ என்பது அரசாண்டுக் கணக்கைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: נַעֲשָׂה
  choice: அனுசரிக்கப்பட்டது
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘செய்யப்பட்டது’ என்பதாக இருந்தாலும், פֶּסַח உடன் வரும்போது பஸ்காவைக் கடைப்பிடித்தல் அல்லது அனுசரித்தல் என்பதே சூழல்சார் பொருள். ‘அனுசரிக்கப்பட்டது’ தமிழில் இயல்பாகவும் சடங்கு நிகழ்த்தப்பட்டதைக் குறிக்கும் வகையிலும் உள்ளது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַפֶּסַח
  choice: பஸ்கா
  rationale: פֶּסַח என்பதற்குத் தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நிலைபெற்ற பெயர் ‘பஸ்கா’. மூலத்தில் இல்லாத ‘பண்டிகை’ என்பதை முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: הַזֶּה
  choice: இந்த
  rationale: சுட்டுப்பெயரடை முன் விவரிக்கப்பட்ட குறிப்பிட்ட பஸ்காவைச் சுட்டுகிறது; ‘இந்த’ அந்த உரையாடல் தொடர்பை நேரடியாகப் பாதுகாக்கிறது.
