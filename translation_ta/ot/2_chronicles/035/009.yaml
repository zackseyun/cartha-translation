base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
translation:
  language: ta
  text: கொனனியாவும், அவருடைய சகோதரர்களான செமாயாவும் நெதனெயேலும், லேவியர்களின் தலைவர்களான அசபியாவும் யெயியேலும் யோசபாத்தும், லேவியர்களுக்குப் பஸ்காப் பலிகளுக்காக ஐயாயிரம் ஆடுகளையும்[a] ஐந்நூறு மாடுகளையும் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “பஸ்காப் பலிகளுக்காக ஐயாயிரம்” என்று உள்ளது; விலங்கின் பெயர் குறிப்பிடப்படவில்லை. உடனடிச் சூழல் இது செம்மறியாடுகளையும் வெள்ளாடுகளையும் குறிக்கிறது என்பதைக் காட்டுகிறது.
    reason: மூல எபிரேயத்தில் விடுபட்டுள்ள விலங்குப் பெயரையும், சூழலில் இருந்து வழங்கப்படும் “ஆடுகள்” என்ற சொல்லின் அடிப்படையையும் விளக்குகிறது.
lexical_decisions:
- source_word: כונניהו
  choice: கொனனியா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயல்பாக எழுத்துப்பெயர்த்தது.
- source_word: שְׁמַעְיָהוּ
  choice: செமாயா
  rationale: எபிரெய தனிப்பெயருக்கான தெளிவான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: נְתַנְאֵל
  choice: நெதனெயேல்
  rationale: எபிரெய மெய்யொலி மற்றும் உயிரொலிகளை நெருக்கமாகப் பின்பற்றும் எழுத்துப்பெயர்ப்பு.
- source_word: אֶחָיו
  choice: அவருடைய சகோதரர்களான
  rationale: ஆண்பால் பன்மை உறவுச் சொல்லை நேரடியாகப் பாதுகாக்கிறது; வாக்கிய அமைப்பில் செமாயாவும் நெதனெயேலும் கொனனியாவின் சகோதரர்கள் என்பதை இயல்பாகக் காட்டுகிறது.
- source_word: חֲשַׁבְיָהוּ
  choice: அசபியா
  rationale: எபிரெய தனிப்பெயரைத் தமிழ் வேதாகமப் பெயர்நடைக்கு ஏற்றவாறு எழுத்துப்பெயர்த்தது.
- source_word: יעיאל
  choice: எயியேல்
  rationale: எபிரெய தனிப்பெயரின் ஒலிக்கு நெருக்கமான தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: יוֹזָבָד
  choice: யோசபாத்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் வழக்கமான வடிவில் எழுத்துப்பெயர்த்தது.
- source_word: שָׂרֵי הַלְוִיִּם
  choice: லேவியர்களின் தலைவர்கள்
  rationale: அதிகாரமும் பொறுப்பும் கொண்ட முன்னணியினரைக் குறிக்கும் שָׂרֵי என்பதைக் காலத்திற்கேற்ற தெளிவான தமிழில் தருகிறது.
- source_word: הֵרִימוּ
  choice: கொடுத்தார்கள்
  rationale: இச்சூழலில் காணிக்கை அல்லது பங்களிப்பாக வழங்குதல் என்பதே வினையின் பொருள்; நிர்வாகச் சூழலில் இயல்பான தமிழ்.
- source_word: לַלְוִיִּם
  choice: லேவியர்களுக்கு
  rationale: ל முன்னிடைச்சொல் இங்கு கொடையின் பெறுநர்களைக் குறிக்கிறது.
- source_word: לַפְּסָחִים
  choice: பஸ்காப் பலிகளுக்காக
  rationale: பன்மை வடிவம் பல பண்டிகைகளைக் காட்டாமல், பஸ்கா அனுசரிப்புக்காகப் பலியிடப்பட்ட விலங்குகளைக் குறிக்கிறது.
- source_word: חֲמֵשֶׁת אֲלָפִים וּבָקָר חֲמֵשׁ מֵאוֹת
  choice: ஐயாயிரம் ஆடுகளையும் ஐந்நூறு மாடுகளையும்
  rationale: எபிரெயில் முதல் எண்ணுக்குப் பின் விலங்கின் பெயர் விடுபட்டுள்ளது; அடுத்ததாக மாடுகள் தனியே எண்ணப்படுவதாலும் உடனடிச் சூழலாலும் முதல் எண்ணிக்கை ஆடுகளைக் குறிக்கிறது. இரண்டு எண்ணிக்கைகளையும் ஒன்றாகக் கூட்டி 5,500 மாடுகள் எனக் கூறாமல் மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
