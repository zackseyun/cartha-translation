  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וַ/חֲסָדָ֑י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'The rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
translation:
  language: ta
  text: 'யோசியாவின் மற்ற செயல்களும், அவருடைய பற்றுறுதியான செயல்களும்[a], யாவேயின் சட்டத்தில் எழுதப்பட்டுள்ளபடி:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடைய உண்மையன்புச் செயல்கள்,’ ‘அவருடைய விசுவாசமான செயல்கள்,’ அல்லது ‘அவருடைய இரக்கச் செயல்கள்’ என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொல் அன்பு, இரக்கம், பற்றுறுதி அல்லது உடன்படிக்கை விசுவாசம் ஆகியவற்றைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: மற்ற செயல்களும்
  rationale: அரசர்களைப் பற்றிய வரலாற்றுச் சுருக்கங்களில் דִּבְרֵי என்பது வெறும் ‘வார்த்தைகள்’ என்பதல்ல; அவர்களுடைய செயல்களையும் நிகழ்வுகளையும் குறிக்கிறது. וְיֶתֶר என்பதன் இணைப்புப் பொருளையும் ‘மற்ற’ என்பதும் வாக்கிய இறுதியிலுள்ள ‘-உம்’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: יֹאשִׁיָּהוּ
  choice: யோசியா
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற வடிவம்.
- source_word: וַחֲסָדָיו
  choice: அவர் செய்த பற்றுறுதிச் செயல்களும்
  rationale: חֶסֶד என்பது அன்பு, இரக்கம், விசுவாசம், உறுதியான பற்றுறுதி ஆகிய பொருள் நிழல்களைக் கொண்டது. இங்கு யோசியாவின் செயல்களைக் குறிக்கும் சூழலில் ‘பற்றுறுதிச் செயல்கள்’ என்பது அரசனின் விசுவாசமான நடத்தை என்னும் கருத்தை இயல்பாகத் தருகிறது; ‘உடன்படிக்கை’ என்பதை மூலத்தில் இல்லாத அளவுக்கு வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: כַּכָּתוּב
  choice: எழுதப்பட்டுள்ளபடி
  rationale: כְּ முன்னொட்டும் எழுதப்படுதல் குறிக்கும் செயப்படுபொருள் வினையெச்சமும் சேர்ந்து தரும் ‘எழுதப்பட்டிருக்கிறபடி’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: בְּתוֹרַת
  choice: சட்டத்தில்
  rationale: இந்த வரலாற்றுச் சூழலில் תּוֹרָה என்பது யாவேயின் அதிகாரபூர்வமான எழுத்துச் சட்டத்தைக் குறிக்கிறது. ‘சட்டம்’ என்பது நவீனத் தமிழில் தெளிவான வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கு எபிரெய மெய்யெழுத்துகளின் பெயர்வடிவத்தை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: யோசியாவைக் குறிக்கும் חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: அவர் செய்த பற்றுறுதிச் செயல்கள்
  alternative: அவருடைய இரக்கச் செயல்கள்; அவருடைய உண்மையன்புச் செயல்கள்; அவருடைய உடன்படிக்கை விசுவாசச் செயல்கள்
  rationale: இந்தச் சொல் அன்பு, இரக்கம், விசுவாசம், பற்றுறுதி ஆகியவற்றை உள்ளடக்கக்கூடும். சூழல் யோசியாவின் சட்டத்துக்கேற்ற நடத்தையைச் சுட்டினாலும், ‘உடன்படிக்கை விசுவாசம்’ என்று மட்டும் மொழிபெயர்ப்பது பொருளைத் தேவையின்றி குறுக்கிவிடலாம். ஆகவே முதன்மை உரை பற்றுறுதியை முன்னிறுத்தி, பிற உண்மையான பொருள் வாய்ப்புகளை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: יְהוָה என்ற இறைப் பெயர்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுச் சுருக்கத்திற்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. இது அடுத்த வசனத்துடன் தொடரும் முழுமையற்ற சுருக்க வாக்கியம் என்பதால் மூலத்தையும் கொடுக்கப்பட்ட பகுதியையும் பின்பற்றி இறுதியில் முக்காற்புள்ளி வைக்கப்பட்டுள்ளது.
