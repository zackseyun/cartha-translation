  yaml_path: translation/ot/2_chronicles/035/002.yaml
  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
translation:
  language: ta
  text: அவன் ஆசாரியர்களை அவரவர் பணிப்பிரிவுகளில்[a] நியமித்து, யாவேயின் ஆலயப் பணிக்காக அவர்களைப் பலப்படுத்தினான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய பணிநிலைகளில்,’ ‘அவர்களுடைய முறைப்பிரிவுகளில்’; இன்னும் சொற்சார்பாக, ‘அவர்களுடைய காவல் முறைகளின்மேல்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களை ஊக்கப்படுத்தினான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: அமர்த்தி
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் ஒருவரை நியமிக்கப்பட்ட இடத்தில் அல்லது பொறுப்பில் நிறுத்துவதைக் குறிக்கிறது. இச்சூழலில் ‘அமர்த்தி’ என்பது யோசியா ஆசாரியர்களை ஒழுங்குபடுத்திய நிர்வாகச் செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַכֹּהֲנִים
  choice: ஆசாரியர்களை
  rationale: כהנים என்பதற்கான நிலையான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் வேதாகமச் சொல்; எபிரெய மொழியிலுள்ள குறிப்பிட்ட தன்மையும் சூழலில் இயல்பாகப் புலப்படுகிறது.
- source_word: עַל מִשְׁמְרוֹתָם
  choice: அவர்களுடைய பணிப்பிரிவுகளில்
  rationale: מִשְׁמָרוֹת என்பது காவல் முறைகள், பணிநிலைகள் அல்லது ஒழுங்கமைக்கப்பட்ட சேவைப் பிரிவுகளைக் குறிக்கலாம். ஆலயச் சூழலில் ‘பணிப்பிரிவுகளில்’ என்பது அமைப்புசார் பொருளையும் சேவைப் பொறுப்பையும் காக்கிறது.
- source_word: וַיְחַזְּקֵם
  choice: அவர்களைப் பலப்படுத்தினான்
  rationale: חזק என்பதன் பியேல் வடிவம் பலப்படுத்துதல், ஆதரித்தல் அல்லது ஊக்கப்படுத்துதல் எனப் பொருள்படலாம். ‘பலப்படுத்தினான்’ மூலச்சொல்லின் மையப் பொருளைத் தக்கவைத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் காட்ட அனுமதிக்கிறது.
- source_word: לַעֲבוֹדַת
  choice: பணிக்காக
  rationale: עֲבוֹדָה என்பது வேலை அல்லது சேவையைக் குறிக்கிறது; இங்கு ஆலயத்தில் நடைபெறும் கடமையைச் சுட்டுவதால் ‘பணி’ இயல்பாகவும் பரந்த பொருளுடனும் உள்ளது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בֵּית יְהוָה என்பதன் சொற்பொருள் ‘யாவேயின் வீடு’; இச்சூழலில் அது ஆலயத்தைக் குறிப்பதால், நவீன தமிழில் தெளிவுக்காக ‘யாவேயின் ஆலயம்’ என வழங்கப்படுகிறது. יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராகக் காக்க ‘யாவே’ பயன்படுத்தப்படுகிறது.
- issue: וַיְחַזְּקֵם என்பதில் உடல் அல்லது உள்ளார்ந்த பலமா, ஊக்கமா
  choice: பலப்படுத்தினான்
  alternative: ஊக்கப்படுத்தினான்
  rationale: மூல வினை ஆதரித்தல் மற்றும் ஊக்கப்படுத்துதல் ஆகிய இரு நிழற்பொருள்களையும் தாங்குகிறது. எந்த ஒன்றையும் மட்டும் முடிவாகத் தேர்ந்து இறையியல் அல்லது உளவியல் விளக்கத்தைத் திணிக்காமல், மையப் பொருள் முதன்மை உரையில் வைக்கப்பட்டு மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியர்’ என்ற பரவலாக அறியப்பட்ட சமயச் சொல் தக்கவைக்கப்பட்டுள்ளது; ‘ஆலயம்’ தெளிவுக்காகத் தேர்ந்தெடுக்கப்பட்டது. எபிரெயச் சொற்களின் உண்மையான பொருள் விரிவுகள் [a], [b] அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
