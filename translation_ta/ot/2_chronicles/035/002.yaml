  text: וַ/יַּעֲמֵ֥ד הַ/כֹּהֲנִ֖ים עַל מִשְׁמְרוֹתָ֑/ם וַֽ/יְחַזְּקֵ֔/ם לַ/עֲבוֹדַ֖ת בֵּ֥ית יְהוָֽה־׃
base_translation:
