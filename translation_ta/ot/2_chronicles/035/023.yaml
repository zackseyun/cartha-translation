  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனின் நேர்கூற்று இயல்பாக இருக்கும்படி ‘இங்கிருந்து கொண்டுபோங்கள்’ என அமைக்கப்பட்டுள்ளது.
