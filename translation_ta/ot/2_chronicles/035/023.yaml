base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/023.yaml
  text: And the archers shot King Josiah[a], and the king said to his servants, “Take me away, for I am severely wounded.”
translation:
  language: ta
  text: வில்லாளர்கள் யோசியா அரசனை அம்பெய்தினர்; அரசன் தன் பணியாளர்களிடம், “என்னைக் கொண்டுபோங்கள்; நான் கடுமையாகக் காயமடைந்திருக்கிறேன்[a]” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினை நலிவடைதல், நோயுற்றிருத்தல் அல்லது கடுமையாகப் பாதிக்கப்படுதல் என்ற விரிவான பொருள்களையும் தரலாம்; இங்கு போர்ச் சூழல் ‘கடுமையாகக் காயமடைந்திருக்கிறேன்’ என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ / הַיֹּרִים
  choice: வில்லாளர்கள் ... அம்பால் எய்தார்கள்
  rationale: ירה என்ற வினையும் அதன் செய்பெயர் வடிவமும் போர்ச் சூழலில் அம்பெய்துவதையும் அம்பெய்பவர்களையும் குறிக்கின்றன. ‘வில்லாளர்கள்’ மற்றும் ‘அம்பால் எய்தார்கள்’ என்பது இச்சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: யோசியா அரசனை
  rationale: இங்கு ל என்பது எய்தலின் இலக்கைக் குறிக்கிறது; தமிழில் நேர்ச்செயப்படுபொருள் வடிவம் இயல்பானது.
- source_word: הַעֲבִירוּנִי
  choice: என்னை இங்கிருந்து கொண்டுபோங்கள்
  rationale: עבר என்பதன் காரணவினை வடிவம் ‘என்னை வேறிடத்திற்குக் கொண்டுசெல்லுங்கள்’ என்ற பொருளைத் தருகிறது. ‘இங்கிருந்து’ என்பது போர்க்களத்திலிருந்து அகற்றும்படி அரசன் கூறுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அவர் கட்டாயம் தூக்கிச் செல்லப்பட்டார் என்று தேவையின்றிக் குறிப்பாக்கவில்லை.
- source_word: הָחֳלֵיתִי מְאֹד
  choice: நான் மிகவும் மோசமாகக் காயமடைந்திருக்கிறேன்
  rationale: חלה என்பது பொதுவாக நலிவடைதல் அல்லது நோயுற்றிருத்தல் என்றும் பொருள்படலாம்; ஆனால் அம்பெய்யப்பட்ட உடனடியான போர்ச் சூழலில் கடுமையாகக் காயமடைந்த நிலையே நோக்கமாக உள்ளது. מְאֹד தீவிரத்தை வலியுறுத்துவதால் ‘மிகவும் மோசமாக’ என மொழிபெயர்க்கப்பட்டது.
