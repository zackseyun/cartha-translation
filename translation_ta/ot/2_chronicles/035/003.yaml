  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
translation:
  language: ta
  text: அவர், இஸ்ரவேல் அனைவருக்கும் போதித்தவர்களும்[a] யாவேக்குப் பரிசுத்தமானவர்களுமாகிய லேவியர்களிடம், “இஸ்ரவேலின் அரசனான தாவீதின் மகன் சாலொமோன் கட்டிய இல்லத்தில்[b] பரிசுத்தப் பெட்டியை வையுங்கள். இனி அதை உங்கள் தோள்களில் சுமக்க வேண்டியதில்லை[c]. இப்போது உங்கள் கடவுளாகிய யாவேக்கும் அவருடைய மக்களான இஸ்ரவேலுக்கும் பணிசெய்யுங்கள்” என்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இஸ்ரவேல் அனைவருக்கும் புரியவைத்தவர்கள்” அல்லது “இஸ்ரவேல் அனைவருக்காகவும் பயிற்றுவிக்கப்பட்டவர்கள்” என்றும் பொருள் கொள்ளலாம். எபிரெயப் பெயரெச்சம் புரிந்துகொண்டிருத்தல் அல்லது பிறருக்குப் புரியவைத்தல் ஆகிய பொருள் நிழல்களைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “இல்லத்தில்”; இங்கு சாலொமோன் கட்டிய ஆலயத்தைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: 'சொல்லுக்குச் சொல்: “தோளில் சுமை உங்களுக்கு இல்லை.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ה/מבונים
  choice: போதித்தவர்களும்
  rationale: בין என்பதன் இவ்வடிவம் புரிந்துகொண்டிருத்தல் அல்லது பிறருக்குப் புரியவைத்தல் ஆகிய இரு பொருள் நிழல்களையும் கொண்டிருக்கலாம். நாளாகமத்தில் லேவியர்கள் மக்களுக்குப் பரிசுத்த காரியங்களைப் போதிக்கும் பணியுடன் தொடர்புபடுத்தப்படுவதால், சூழலுக்கு ஏற்ற இயல்பான வாசகமாக இது தேர்ந்தெடுக்கப்பட்டது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: הַ/קְּדוֹשִׁים לַ/יהוָה
  choice: யாவேக்குப் பரிசுத்தமானவர்களுமாகிய
  rationale: இந்தச் சொற்றொடர் லேவியர்களின் பரிசுத்த நிலையும் யாவேக்கென ஒதுக்கப்பட்டிருப்பதையும் குறிக்கிறது. ‘பரிசுத்தமானவர்கள்’ என்பது மூலத்தின் வழிபாட்டுச் சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், இறைப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: תְּנוּ אֶת אֲרוֹן הַקֹּדֶשׁ בַּבַּיִת
  choice: இல்லத்தில் பரிசுத்தப் பெட்டியை வையுங்கள்
  rationale: נתן இங்கு ‘வை/நிறுத்து’ எனப் பொருள்படுகிறது. בית என்பதன் நேரடியான உருவகத்தை ‘இல்லம்’ எனப் பாதுகாத்து, அது சாலொமோன் கட்டிய ஆலயம் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: אֲרוֹן הַ/קֹּדֶשׁ
  choice: பரிசுத்தப் பெட்டி
  rationale: ארון என்பது பெட்டி அல்லது பேழையைக் குறிக்கிறது; קדשׁ அதன் பரிசுத்தத் தன்மையை வலியுறுத்துகிறது. ‘பரிசுத்தப் பெட்டி’ என்பது தெளிவாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: אֵין לָכֶם מַשָּׂא בַּכָּתֵף
  choice: இனி அதை உங்கள் தோள்களில் சுமக்க வேண்டியதில்லை
  rationale: சொல்லுக்குச் சொல் அமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்தி, உடலால் தோளில் சுமக்கும் காட்சியையும் காக்கிறது. சூழலில் ‘இனி’ என்பது நிலைமாற்றத்தைத் தெளிவாக்குகிறது.
- source_word: עַתָּה עִבְדוּ
  choice: இப்போது ... பணிசெய்யுங்கள்
  rationale: עבד வழிபாட்டு சூழலில் சேவை அல்லது திருப்பணி என்ற பொருளைக் கொள்ளலாம். இங்கு யாவேயும் அவருடைய மக்களும் இணைப் பொருட்களாக வருவதால், ‘பணிசெய்யுங்கள்’ இரண்டுக்கும் இயல்பாகப் பொருந்துகிறது.
- source_word: וְאֵת עַמּוֹ יִשְׂרָאֵל
  choice: அவருடைய மக்களான இஸ்ரவேலுக்கும்
  rationale: இஸ்ரவேல் யாவேயுடைய மக்கள் என்பதைத் தெளிவாகவும் இயல்பாகவும் அடையாளப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா அல்லது ‘ஆண்டவர்’
  rationale: மூல உரை YHWH என்ற தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ அதை ஒரு பட்டப்பெயரால் மாற்றாமல் பாதுகாக்கிறது.
- issue: ה/מבונים என்பதில் லேவியர்களின் பங்கு
  choice: இஸ்ரவேல் அனைவருக்கும் போதித்தவர்கள்
  alternative: புரிந்துகொண்டவர்கள் அல்லது இஸ்ரவேலுக்காகப் பயிற்றுவிக்கப்பட்டவர்கள்
  rationale: எபிரெய வடிவம் புரிதல், பயிற்றுவிக்கப்படுதல், பிறருக்குப் புரியவைத்தல் ஆகிய நிழல்களை அனுமதிக்கிறது. நாளாகமச் சூழலில் போதித்தல் மிகவும் சாத்தியமான செயல்பாட்டுப் பொருள்; இருப்பினும் உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பரிசுத்தப் பெட்டியை இல்லத்தில் வைக்குமாறு கூறுவதன் காலச்சூழல்
  choice: உரையில் உள்ள கட்டளையை அப்படியே வைத்தல்
  alternative: பெட்டி முன்பு இடம்பெயர்க்கப்பட்டிருந்தது அல்லது தற்காலிகமாக அகற்றப்பட்டிருந்தது என விளக்கிச் சேர்த்தல்
  rationale: பெட்டி ஏன் வைக்கப்பட வேண்டும் என்று வசனம் விளக்கவில்லை. வரலாற்றுச் சூழலை ஊகித்து உரைக்குள் சேர்க்காமல், மூலத்தின் பதற்றமும் மௌனமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இல்லம்’, ‘பரிசுத்தம்’, ‘பணிசெய்’ ஆகிய சொற்கள் மூலத்தின் வழிபாட்டு நிழலைப் பாதுகாக்கின்றன; தெளிவுக்குத் தேவையான மாற்று வாசிப்புகள் அடிக்குறிப்புகளாக வழங்கப்பட்டுள்ளன.
