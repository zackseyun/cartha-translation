source:
  edition: WLC
  text: אַחֲרֵ֣י כָל זֹ֗את אֲשֶׁ֨ר הֵכִ֤ין יֹֽאשִׁיָּ֨הוּ֙ אֶת הַ/בַּ֔יִת עָלָ֞ה נְכ֧וֹ מֶֽלֶךְ מִצְרַ֛יִם לְ/הִלָּחֵ֥ם בְּ/כַרְכְּמִ֖ישׁ עַל פְּרָ֑ת וַ/יֵּצֵ֥א לִ/קְרָאת֖/וֹ יֹאשִׁיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
translation:
  language: ta
  text: இவை அனைத்திற்கும் பின்பு, யோசியா ஆலயத்தை[a] ஆயத்தப்படுத்திய பிறகு, எகிப்தின் அரசன் நேகோ ஐப்பிராத்து ஆற்றங்கரையிலுள்ள கர்கேமிசில் போரிடச் சென்றான். யோசியா அவனைச் சந்திக்கப் புறப்பட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘வீட்டை’; இங்கு அது ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இராணுவச் சூழலில் ‘அவனை எதிர்கொள்ளப் புறப்பட்டான்’ என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵכִין
  choice: ஆயத்தப்படுத்திய
  rationale: הֵכִין என்பதன் ஹிஃபில் வடிவம் ‘ஆயத்தப்படுத்துதல், ஒழுங்குபடுத்துதல், நிலைநிறுத்துதல்’ என்ற பொருள் தருகிறது. ஆலயச் சீர்திருத்தங்களின் சூழலில், அது முறையாகச் செயல்படும்படி ஆயத்தப்படுத்தியதைக் குறிக்க ‘ஆயத்தப்படுத்திய’ என்பது மூலத்திற்கு நெருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַבַּיִת
  choice: ஆலயத்தை
  rationale: சொல்லுக்குச் சொல் பொருள் ‘வீடு’ என்றாலும், நாளாகமத்தில் இச்சூழலில் அது கர்த்தருடைய ஆலயத்தைக் குறிக்கிறது. நவீனத் தமிழில் தவறான புரிதலைத் தவிர்க்க ‘ஆலயம்’ பயன்படுத்தப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עָלָה
  choice: சென்றான்
  rationale: עָלָה என்பதன் அடிப்படைப் பொருள் ‘மேலே செல்லுதல்/செல்லுதல்.’ தமிழில் இங்கு ‘மேலே சென்றான்’ இயல்பற்றதாக இருப்பதால், படையெடுப்பைத் தேவையின்றி மிகைப்படுத்தாமல் ‘சென்றான்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְהִלָּחֵם
  choice: போரிட
  rationale: இவ்வினை வடிவம் போரில் ஈடுபடுவதைக் குறிக்கிறது; ‘போரிட’ என்பது சுருக்கமான, நேரடியான நவீனத் தமிழ்.
- source_word: בְּכַרְכְּמִישׁ עַל־פְּרָת
  choice: ஐப்பிராத்து ஆற்றங்கரையிலுள்ள கர்கேமிசில்
  rationale: בְּ இடத்தையும் עַל־פְּרָת ஐப்பிராத்து ஆற்றை ஒட்டிய அமைவிடத்தையும் குறிக்கின்றன. தமிழில் புவியியல் உறவைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க இவ்வாறு அமைக்கப்பட்டது.
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: அவனைச் சந்திக்கப் புறப்பட்டான்
  rationale: לִקְרָאתוֹ என்பது ‘அவனைச் சந்திக்க/எதிர்கொள்ள’ என இருவகை நிழற்பொருள் கொள்ளக்கூடும். முதன்மை உரையில் நடுநிலையான ‘சந்திக்க’ வைக்கப்பட்டு, இராணுவச் சூழலில் உள்ள எதிர்ப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
