  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: யோசியா ஆலயத்தை ஆயத்தப்படுத்துதல், எகிப்து அரசன் நேகோ கர்கேமிசில் ஐப்பிராத்து அருகே போரிடச் செல்லுதல், யோசியா அவனைச் சந்திக்கப் புறப்படுதல் ஆகியவை முறையாக உள்ளன. עָלָה-வின் ‘மேலே’ என்ற இடவியல் நுணுக்கம் தமிழில் இயல்புக்காக ‘சென்றான்’ என விடப்பட்டிருப்பது ஏற்கத்தக்கது. לִקְרָאתוֹ-வின் நடுநிலை ‘சந்திக்க’ மற்றும் இராணுவச் சூழலிலான ‘எதிர்கொள்ள’ என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.'
