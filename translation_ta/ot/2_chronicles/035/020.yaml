  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘ஆலயம்’ சூழல் தெளிவுக்காகப் பயன்படுத்தப்பட்டது; ‘சந்திக்க’ என்ற சொல் மூலத்தின் சாத்தியமான நடுநிலை/எதிர்ப்பு இருமையை அடிக்குறிப்புடன் பாதுகாக்கிறது.
