translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உரையின் ஆண்–பெண் பாடகர் வேறுபாடும், ‘இன்றுவரை’ என்ற தொடர்ச்சியும், இறுதி சொற்றொடரிலுள்ள குறிப்பிட்ட தொகுப்பு/பொதுவான பாடல்கள் என்ற தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
