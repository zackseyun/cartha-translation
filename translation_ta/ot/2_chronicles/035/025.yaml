  text: וַ/יְקוֹנֵ֣ן יִרְמְיָהוּ֮ עַל יֹאשִׁיָּהוּ֒ וַ/יֹּאמְר֣וּ כָֽל הַ/שָּׁרִ֣ים וְ֠/הַ/שָּׁרוֹת בְּ/קִינ֨וֹתֵי/הֶ֤ם עַל יֹאשִׁיָּ֨הוּ֙ עַד הַ/יּ֔וֹם וַ/יִּתְּנ֥וּ/ם לְ/חֹ֖ק עַל יִשְׂרָאֵ֑ל וְ/הִנָּ֥/ם כְּתוּבִ֖ים עַל הַ/קִּינֽוֹת־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
translation:
  language: ta
  text: எரேமியா யோசியாவுக்காகப் புலம்பினார். பாடகர்கள், பாடகிகள் அனைவரும் இன்றுவரை தங்கள் புலம்பல் பாடல்களில் யோசியாவைக் குறித்துப் பாடுகிறார்கள். அவற்றை இஸ்ரவேலில் கடைப்பிடிக்க வேண்டிய வழக்கமாக ஏற்படுத்தினார்கள். இதோ, அவை ‘புலம்பல் பாடல்கள்’ என்னும் தொகுப்பில் எழுதப்பட்டுள்ளன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவை புலம்பல் பாடல்களில் எழுதப்பட்டுள்ளன.” இச்சொற்றொடர் குறிப்பிட்ட ஒரு தொகுப்பின் பெயரைக் குறிக்காமல், பொதுவாகப் புலம்பல் பாடல்களைக் குறிக்கவும் வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְקוֹנֵן
  choice: புலம்பினார்
  rationale: קונן என்பது இறந்தவருக்காகப் புலம்புவதையோ புலம்பல் பாடலை உரைப்பதையோ குறிக்கிறது. ‘புலம்பினார்’ என்பது இயல்பான தமிழில் அந்தத் துயரச் செயலைக் காக்கிறது; அவர் அதை இயற்றினாரா அல்லது பாடினாரா என்பதைத் தேவையின்றி தீர்மானிப்பதில்லை.
- source_word: עַל יֹאשִׁיָּהוּ
  choice: யோசியாவுக்காக
  rationale: இறந்த ஒருவரைக் குறித்த புலம்பலின் சூழலில் עַל என்பதற்கு ‘யோசியாவுக்காக’ என்பது இயல்பான தமிழ்.
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  choice: பாடகர்கள், பாடகிகள்
  rationale: எபிரெயத்தில் ஆண் பாடகர்களும் பெண் பாடகிகளும் தனித்தனியாகக் குறிப்பிடப்படுவதால் அந்த வேறுபாடு தமிழிலும் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
- source_word: וַיֹּאמְרוּ ... עַד הַיּוֹם
  choice: இன்றுவரை ... பாடுகிறார்கள்
  rationale: אמר என்பதன் அடிப்படைப் பொருள் ‘சொல்’ என்றாலும், பாடகர்களும் புலம்பல் பாடல்களும் உள்ள இச்சூழலில் ‘பாடுகிறார்கள்’ என்பது செயலை இயல்பாக வெளிப்படுத்துகிறது. ‘இன்றுவரை’ தொடரும் வழக்கைச் சுட்டுவதால் தமிழ் நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּקִינוֹתֵיהֶם
  choice: தங்கள் புலம்பல் பாடல்களில்
  rationale: קִינוֹת என்பது இறந்தவர்களுக்கான புலம்பல் பாடல்களைக் குறிக்கிறது. ‘புலம்பல் பாடல்கள்’ என்பது இன்றைய வாசகர்களுக்குத் தெளிவானது.
- source_word: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל
  choice: அவற்றை இஸ்ரவேலில் கடைப்பிடிக்க வேண்டிய வழக்கமாக ஏற்படுத்தினார்கள்
  rationale: חֹק இங்கு சட்டம், நியமம் அல்லது நிலைபெற்ற வழக்கம் எனப் பொருள்படலாம். பாடல்களைக் குறித்த சூழலில் ‘கடைப்பிடிக்க வேண்டிய வழக்கம்’ என்பது கட்டுப்படுத்தப்பட்ட நடைமுறையின் பொருளைக் காத்து இயல்பாக உள்ளது.
- source_word: וְהִנָּם
  choice: இதோ, அவை
  rationale: הִנֵּה வடிவம் அடுத்துவரும் தகவலுக்கு கவனத்தை ஈர்க்கிறது; ‘இதோ’ அதன் சுட்டும் வலிமையைப் பாதுகாக்கிறது.
- source_word: כְּתוּבִים עַל הַקִּינוֹת
  choice: ‘புலம்பல் பாடல்கள்’ என்னும் தொகுப்பில் எழுதப்பட்டுள்ளன
  rationale: הַקִּינוֹת என்பது அறியப்பட்ட ஒரு புலம்பல் தொகுப்பைக் குறிக்க வாய்ப்புள்ளதால் தலைப்புத் தன்மையுடன் மொழிபெயர்க்கப்படுகிறது. பொதுவாகப் புலம்பல் பாடல்களையே குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
