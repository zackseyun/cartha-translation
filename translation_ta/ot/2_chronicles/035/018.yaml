  text: וְ/לֹֽא נַעֲשָׂ֨ה פֶ֤סַח כָּמֹ֨/הוּ֙ בְּ/יִשְׂרָאֵ֔ל מִ/ימֵ֖י שְׁמוּאֵ֣ל הַ/נָּבִ֑יא וְ/כָל מַלְכֵ֣י יִשְׂרָאֵ֣ל לֹֽא עָשׂ֡וּ כַּ/פֶּ֣סַח אֲשֶׁר עָשָׂ֣ה יֹֽ֠אשִׁיָּהוּ וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם וְ/כָל יְהוּדָה֙ וְ/יִשְׂרָאֵ֣ל הַ/נִּמְצָ֔א וְ/יוֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
translation:
  language: ta
  text: தீர்க்கதரிசியான சாமுவேலின் நாட்களிலிருந்து, இதைப் போன்ற பஸ்கா இஸ்ரவேலில் கடைப்பிடிக்கப்பட்டதே இல்லை.[a] யோசியா ஆசாரியர்களுடனும் லேவியர்களுடனும் யூதா முழுவதுடனும் அங்கிருந்த இஸ்ரவேல் மக்களுடனும்[b] எருசலேமில் குடியிருந்தவர்களுடனும் சேர்ந்து கடைப்பிடித்த பஸ்காவைப் போன்று, இஸ்ரவேலின் எந்த அரசரும் பஸ்கா கடைப்பிடித்ததில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீர்க்கதரிசியான சாமுவேலின் நாட்களிலிருந்து, இப்படிப்பட்ட பஸ்கா இஸ்ரவேலில் அனுசரிக்கப்பட்டதே இல்லை.”
    reason: נַעֲשָׂה என்பதற்கு இச்சூழலில் ‘கடைப்பிடிக்கப்பட்டது’ அல்லது ‘அனுசரிக்கப்பட்டது’ என மொழிபெயர்க்கலாம்; כָּמֹהוּ என்பதும் ‘இதைப் போன்ற’ அல்லது ‘இப்படிப்பட்ட’ என வரலாம்.
  - marker: b
    text: நேரடியாக, “அங்கு இருந்த இஸ்ரவேலோடும்”; அதாவது, கொண்டாட்டத்தில் அங்கிருந்த இஸ்ரவேல் மக்களோடும்.
    reason: יִשְׂרָאֵל הַנִּמְצָא என்பது கூட்டொருமையில் ‘அங்கு இருந்த/காணப்பட்ட இஸ்ரவேல்’ என்று வருகிறது. மூலத்தில் அவர்கள் அங்கு வந்ததாகக் கூறப்படவில்லை; இயல்பான தமிழுக்காக முக்கிய உரையில் ‘இஸ்ரவேல் மக்கள்’ எனத் தெளிவாக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: נַעֲשָׂה / עָשׂוּ / עָשָׂה
  choice: கொண்டாடப்பட்டது / கொண்டாடவில்லை / கொண்டாடிய
  rationale: עשה என்பதுடன் פסח வரும்போது, பஸ்காவைச் செய்தல் என்பதல்ல, அதைக் கடைப்பிடித்தல் அல்லது கொண்டாடுதல் என்பதே பொருள். நவீன தமிழில் விழாவின் முழுமையான அனுசரிப்பை இயல்பாகக் குறிக்க ‘கொண்டாடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פֶסַח
  choice: பஸ்கா
  rationale: இங்கு பலியிடப்படும் ஆட்டுக்குட்டியை மட்டும் அல்லாமல் முழுப் பஸ்கா அனுசரிப்பையும் குறிக்கிறது; தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் அறியப்பட்ட, சுருக்கமான வடிவம் ‘பஸ்கா’.
- source_word: כָּמֹהוּ
  choice: இதைப் போன்ற
  rationale: ஆண்பால் ஒருமை பின்னொட்டு முன் கூறப்பட்ட פֶסַח என்பதைக் குறிக்கிறது. தமிழில் இப்பஸ்கா நிகழ்வைச் சுட்ட ‘இதைப் போன்ற’ என்பது இயல்பானது.
- source_word: בְּיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: தேசிய அல்லது சமூக எல்லைக்குள் நிகழ்ந்ததைச் சுட்டும் எளிய இடவியல் மொழிபெயர்ப்பு.
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  choice: தீர்க்கதரிசியான சாமுவேலின் நாட்களிலிருந்து
  rationale: מן கால ஒப்பீட்டின் தொடக்கப் புள்ளியைக் குறிக்கிறது; ‘நாட்களிலிருந்து’ மூலத்தின் வரலாற்றுப் பின்னோக்குப் பார்வையைப் பாதுகாக்கிறது.
- source_word: וְכָל מַלְכֵי יִשְׂרָאֵל לֹא
  choice: இஸ்ரவேலின் அரசர்களில் ஒருவரும் ... இல்லை
  rationale: ‘எல்லா அரசர்களும் செய்யவில்லை’ என்ற எபிரெயப் பொதுமறுப்பை தமிழில் தெளிவாகவும் இயல்பாகவும் ‘ஒருவரும் ... இல்லை’ என்று வழங்குகிறது.
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: ஆசாரியர்களோடும் லேவியர்களோடும்
  rationale: இவர்கள் யோசியாவுடன் பஸ்காவில் பங்கேற்றவர்கள் என்பதை உடனிகழ்ச்சி உருபு இயல்பாகத் தெரிவிக்கிறது; பட்டியலின் இணைப்பு உறவையும் காக்கிறது.
- source_word: וְכָל יְהוּדָה
  choice: யூதா முழுவதோடும்
  rationale: முழு யூதா சமூகத்தையும் குறிக்கும் கூட்டுப் பெயரைத் தமிழில் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  choice: அங்கு வந்திருந்த இஸ்ரவேல் மக்களோடும்
  rationale: הנמצא என்பது அந்நிகழ்வில் காணப்பட்ட அல்லது இருந்த இஸ்ரவேலரைச் சுட்டுகிறது. ‘மக்கள்’ கூட்டுப் பெயரின் பொருளைத் தெளிவாக்குகிறது; ‘அங்கு வந்திருந்த’ அவர்கள் விழாவில் இருந்ததைக் குறிக்கிறது, ஆனால் இதன் நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיוֹשְׁבֵי יְרוּשָׁלִָם
  choice: எருசலேமின் குடிமக்களோடும்
  rationale: நகரத்தில் குடியிருந்தவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
theological_decisions:
- issue: முந்தைய பஸ்காக்களுடன் செய்யப்படும் வரலாற்று ஒப்பீடு
  choice: சாமுவேலின் நாட்களுக்குப் பின் யோசியாவின் பஸ்காவைப் போன்ற ஒன்று கொண்டாடப்படவில்லை என்ற ஒப்பீட்டை விளக்கமின்றி அப்படியே வைத்தல்
  alternative: இது மற்ற எல்லாப் பஸ்காக்களையும் முற்றிலும் தாழ்த்தும் முழுமையான வரலாற்றுக் கூற்று அல்லது வெறும் மிகைப்படுத்தல் என்று மொழிபெயர்ப்பிலேயே தீர்மானித்தல்
  rationale: எபிரெய உரை ‘இதைப் போன்ற’ எனத் தரநிலை அல்லது தனித்தன்மை சார்ந்த ஒப்பீட்டைச் செய்கிறது; அது எசேக்கியா போன்றோரின் முக்கியமான பஸ்காக்களுடன் எவ்வாறு பொருந்துகிறது என்பதை உரை வெளிப்படையாக விளக்கவில்லை. ஆகவே அந்த இறையியல் மற்றும் வரலாற்றுத் தளர்வை மொழிபெயர்ப்பு தீர்த்து வைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பஸ்கா’, ‘ஆசாரியர்கள்’, ‘லேவியர்கள்’, ‘தீர்க்கதரிசி’ ஆகியவை பரவலாக அறியப்பட்ட வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன. எபிரெயப் பட்டியலின் மீளும் וְ இணைப்பை தமிழின் ‘-ஓடும்’ வடிவம் மூலம் ஓட்டமுள்ள ஒரே வாக்கியமாக வழங்கியுள்ளோம்; இரு முக்கிய மொழிபெயர்ப்பு மாற்றுகளுக்கான [a], [b] குறிகள் முதன்மை உரையிலேயே இடம்பெற்றுள்ளன.
