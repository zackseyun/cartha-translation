    reason: יִשְׂרָאֵל הַנִּמְצָא என்பது கூட்டொருமையில் ‘அங்கு இருந்த/காணப்பட்ட இஸ்ரவேல்’ என்று வருகிறது. மூலத்தில் அவர்கள் அங்கு வந்ததாகக் கூறப்படவில்லை; இயல்பான தமிழுக்காக முக்கிய உரையில் ‘இஸ்ரவேல் மக்கள்’ எனத் தெளிவாக்கப்பட்டுள்ளது.
  revision_rationale: திருத்தம் மூலத்தில் இல்லாத ‘வந்திருந்த’ என்ற வருகைக் குறிப்பை நீக்கி, הַנִּמְצָא-வின் ‘அங்கிருந்த’ என்ற பொருளைத் தக்கவைக்கிறது. மேலும், குடியிருப்பவர்களைக் குறிக்கும் יוֹשְׁבֵי-க்கு ஏற்ற சொற்றொடரையும், யோசியாவின் பஸ்காவுடன் ஒப்பிடப்படும் மற்ற அரசர்களின் பஸ்கா அனுசரிப்பைத் தெளிவாக்கும் வாக்கிய அமைப்பையும் வழங்குகிறது. வரலாற்று ஒப்பீட்டின் அளவு அல்லது தன்மை குறித்து எந்த விளக்கமும் முதன்மை உரையில் சேர்க்கப்படவில்லை.
