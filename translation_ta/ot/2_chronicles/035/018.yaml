  source_fidelity: முதன்மை உரை எபிரெய மூலத்தின் பஸ்கா அனுசரிப்பு, சாமுவேலின் நாட்களிலிருந்து என்ற கால ஒப்பீடு, மற்றும் யோசியாவுடன் பங்கேற்ற குழுக்களின் பட்டியல் ஆகியவற்றைச் சரியாகப் பிரதிபலிக்கிறது. ஆனால் הַנִּמְצָא என்பதன் பொருள் ‘அங்கு இருந்த/காணப்பட்ட’ என்பதே; ‘அங்கு வந்திருந்த’ என்பது மூலத்தில் இல்லாத வருகைச் செயலைக் குறிக்கிறது.
  naturalness: நடை பொதுவாக நவீன நிலையான தமிழுக்கு ஏற்றது. எனினும், இரண்டாம் வாக்கியத்தில் ‘பஸ்காவைப் போல் ... கொண்டாடவில்லை’ என்பதற்குப் பதிலாக ‘பஸ்காவைப் போன்று ... பஸ்கா கொண்டாடவில்லை’ என்பது ஒப்பீட்டையும் வினை-பொருள் உறவையும் தெளிவாக்குகிறது. ‘எருசலேமின் குடிமக்கள்’ என்பதற்குப் பதிலாக ‘எருசலேமில் குடியிருந்தவர்கள்’ என்பது יוֹשְׁבֵי என்ற சொல்லுக்கு நெருக்கமானது; குடியுரிமை என்ற கூடுதல் நவீன கருத்தைத் தவிர்க்கிறது.
  terminology: ‘பஸ்கா,’ ‘தீர்க்கதரிசி,’ ‘ஆசாரியர்கள்,’ ‘லேவியர்கள்,’ ‘சாமுவேல்,’ ‘யோசியா’ ஆகியவை நிலையான, பொருத்தமான வேதாகமப் பயன்பாடுகள். ‘கடைப்பிடிக்கப்பட்டது/கடைப்பிடித்த’ என்பது עשה + פסח என்ற அனுசரிப்பு வழக்கைத் தெளிவாகத் தருகிறது.
