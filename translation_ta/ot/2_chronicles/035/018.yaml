  revised_text: தீர்க்கதரிசியான சாமுவேலின் நாட்களிலிருந்து, இதைப் போன்ற பஸ்கா இஸ்ரவேலில் கடைப்பிடிக்கப்பட்டதே இல்லை.[a] யோசியா ஆசாரியர்களுடனும் லேவியர்களுடனும் யூதா முழுவதுடனும் அங்கிருந்த இஸ்ரவேல் மக்களுடனும்[b] எருசலேமில் குடியிருந்தவர்களுடனும் சேர்ந்து கடைப்பிடித்த பஸ்காவைப் போன்று, இஸ்ரவேலின் எந்த அரசரும் பஸ்கா கடைப்பிடித்ததில்லை.
