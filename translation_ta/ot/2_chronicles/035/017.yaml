translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒரே எபிரெய வினைச்சொல் இரண்டு விழாப் பொருட்களுக்கும் தொடர்புடையதாக இருந்தாலும், தமிழின் இயல்புக்காக ‘கடைப்பிடித்து’ மற்றும் ‘கொண்டாடினார்கள்’ எனப் பகிர்ந்து வழங்கப்பட்டுள்ளது; புதிய கருத்து எதுவும் சேர்க்கப்படவில்லை.
