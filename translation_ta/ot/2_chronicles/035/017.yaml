source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל הַֽ/נִּמְצְאִ֛ים אֶת הַ/פֶּ֖סַח בָּ/עֵ֣ת הַ/הִ֑יא וְ/אֶת חַ֥ג הַ/מַּצּ֖וֹת שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/017.yaml
  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: ta
  text: அங்கே இருந்த இஸ்ரவேலர்கள் அந்த நேரத்தில் பஸ்காவைக் கடைப்பிடித்து, புளிப்பில்லாத அப்பத் திருவிழாவை ஏழு நாட்கள் கொண்டாடினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: கடைப்பிடித்து … கொண்டாடினார்கள்
  rationale: எபிரெய வினைச்சொல் அடிப்படையில் ‘செய்தார்கள்’ எனப் பொருள்பட்டாலும், பஸ்கா மற்றும் திருவிழா ஆகியவற்றோடு வரும்போது அவற்றை அனுசரித்தல் அல்லது கொண்டாடுதல் என்ற பொருளைத் தருகிறது. தமிழில் இயல்பாக அமைய, பஸ்காவுக்கு ‘கடைப்பிடித்து’ என்றும் திருவிழாவுக்கு ‘கொண்டாடினார்கள்’ என்றும் வழங்கப்பட்டுள்ளது.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலர்கள்
  rationale: சொல்லுக்குச் சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் மக்களைக் குறிக்கும் கூட்டு இனப்பெயர்; ‘இஸ்ரவேலர்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הַנִּמְצְאִים
  choice: அங்கே இருந்த
  rationale: מצא என்ற வேர்ச்சொல்லின் பங்கேற்பு வடிவம் இச்சூழலில் நிகழ்விடத்தில் இருந்தவர்களைக் குறிக்கிறது; ‘காணப்பட்ட’ என்பதைவிட ‘அங்கே இருந்த’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הַפֶּסַח
  choice: பஸ்கா
  rationale: இச்சூழலில் இது பலியிடப்பட்ட விலங்கை மட்டும் அல்லாமல் பஸ்கா அனுசரிப்பையே குறிக்கிறது. ‘பஸ்கா’ என்பது தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர்.
- source_word: בָּעֵת הַהִיא
  choice: அந்த நேரத்தில்
  rationale: இது நேரத்தை நேரடியாகக் குறிக்கும் சொற்றொடர். மூலத்தில் வெளிப்படையாக இல்லாத ‘நியமிக்கப்பட்ட’ என்ற கருத்தைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: חַג הַמַּצּוֹת
  choice: புளிப்பில்லாத அப்பத் திருவிழா
  rationale: חַג என்பது திருவிழாவையும், מַצּוֹת என்பது புளிப்பூட்டப்படாத அப்பங்களையும் குறிக்கிறது. தமிழில் புரியும்படி வழக்கமான விழாப் பெயராக வழங்கப்பட்டுள்ளது.
- source_word: שִׁבְעַת יָמִים
  choice: ஏழு நாட்கள்
  rationale: திருவிழா கொண்டாடப்பட்ட கால அளவை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
