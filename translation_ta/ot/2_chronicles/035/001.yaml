  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
translation:
  language: ta
  text: யோசியா எருசலேமில் யாவேக்காகப் பஸ்காவைக் கொண்டாடினார். முதல் மாதத்தின் பதினான்காம் நாளில் அவர்கள் பஸ்காப் பலியை[a] அறுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பஸ்கா.” இங்கு அந்தச் சொல் பஸ்காவுக்காக அறுக்கப்பட்ட பலிப்பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: கொண்டாடினார்
  rationale: வினைச்சொல் அடிப்படையில் ‘செய்தார்’ என்று பொருள்பட்டாலும், பஸ்காவைச் சார்ந்த இந்தச் சொற்றொடரில் வழிபாட்டு விழாவைக் கடைப்பிடித்தல் அல்லது கொண்டாடுதல் என்பதே இயல்பான பொருள்.
- source_word: פֶּסַח
  choice: பஸ்கா
  rationale: முதல் இடத்தில் இச்சொல் பஸ்கா அனுசரிப்பை முழுமையாகக் குறிக்கிறது; தமிழில் பரவலாக அறியப்படும் பெயர் ‘பஸ்கா’.
- source_word: לַיהוָה
  choice: யாவேக்காக
  rationale: ל முன்னொட்டு அர்ப்பணிப்பு அல்லது நோக்கத்தைக் குறிக்கிறது. ‘யாவேக்காக’ என்பது பஸ்கா யாவேக்கு உரியதாகக் கொண்டாடப்பட்டதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בִירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் எளிய மொழிபெயர்ப்பு; பெயர் தமிழில் நிலைபெற்ற வடிவில் தரப்பட்டுள்ளது.
- source_word: וַיִּשְׁחֲטוּ
  choice: அறுத்தார்கள்
  rationale: שׁחט என்பது பலிக்குரிய விலங்கைக் கழுத்தறுத்துக் கொல்வதைக் குறிக்கிறது. ‘அறுத்தார்கள்’ என்பது ‘கொன்றார்கள்’ என்பதைவிடத் துல்லியமாகவும், ‘பலியிட்டார்கள்’ என்பதைவிட மூல வினையின் செயலை நெருக்கமாகவும் காட்டுகிறது.
- source_word: הַפֶּסַח
  choice: பஸ்காப் பலி
  rationale: இரண்டாம் இடத்தில் பஸ்கா என்று அழைக்கப்படும் அறுக்கத்தக்க பலிப்பொருளை இச்சொல் ஆகுபெயராகக் குறிக்கிறது. விலங்கு ஆட்டுக்குட்டியா வெள்ளாட்டுக்குட்டியா என்பதைச் சொல்லாமல் ‘பலி’ என்று தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: בְּאַרְבָּעָה עָשָׂר
  choice: பதினான்காம் நாளில்
  rationale: எபிரெயச் சொல்லாக்கம் நேரடியாக ‘பதினான்கில்’ என்றாலும், தமிழில் தேதியைத் தெளிவாகக் கூற ‘பதினான்காம் நாளில்’ என்பது இயல்பான வடிவம்.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: முதல் மாதத்தின்
  rationale: பதினான்காம் நாள் எந்த மாதத்தைச் சேர்ந்தது என்பதைத் தமிழில் இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரே நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக உடன்படிக்கையின் தனிப்பெயரை ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: இரண்டாவது הַפֶּסַח என்பதன் குறிப்பு
  choice: பஸ்காப் பலி
  alternative: பஸ்கா / பஸ்கா ஆட்டுக்குட்டி
  rationale: அறுக்கப்படும் பொருள் என்பதால் இங்கு விழாவல்ல, பலிக்குரிய விலங்கே குறிக்கப்படுகிறது. ஆனால் மூலச்சொல் இந்த இடத்தில் ‘ஆட்டுக்குட்டி’ என்று வெளிப்படையாகக் கூறாததால், அந்த விவரத்தைச் சேர்க்காமல் ‘பலி’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. வழிபாட்டுச் சூழலுக்குப் பொருத்தமாக ‘பஸ்கா’, ‘பலி’, ‘அறுத்தார்கள்’ ஆகிய பரவலாகப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தில் இல்லாத ‘ஆட்டுக்குட்டி’ என்ற விவரம் சேர்க்கப்படவில்லை.
