language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/עִמְד֣וּ בַ/קֹּ֗דֶשׁ לִ/פְלֻגּוֹת֙ בֵּ֣ית הָֽ/אָב֔וֹת לַ/אֲחֵי/כֶ֖ם בְּנֵ֣י הָ/עָ֑ם וַ/חֲלֻקַּ֥ת בֵּֽית אָ֖ב לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
translation:
  language: ta
  text: பரிசுத்த இடத்தில், மக்களாகிய உங்கள் சகோதரர்களின் தந்தைவழிக் குடும்பப் பிரிவுகளுக்கு ஏற்பவும், லேவியர்களுக்கான தந்தைவழிக் குடும்பப் பிரிவுக்கு ஏற்பவும் நில்லுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעִמְדוּ
  choice: நில்லுங்கள்
  rationale: עמד என்பதன் Qal பன்மை ஏவல் வடிவம்; லேவியர்களுக்கு அளிக்கப்படும் நேரடியான கட்டளையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. தொடக்க இணைப்புச்சொல் தமிழில் வாக்கிய ஓட்டத்திற்காக வெளிப்படையாக மொழிபெயர்க்கப்படவில்லை.
- source_word: בַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டும் குறிப்புச் சுட்டும் சேர்ந்துள்ளதால், லேவியர்கள் நிற்க வேண்டிய புனிதப் பகுதியைக் குறிக்கிறது; குறிப்பிட்ட அறை ஒன்றாக மிகையாக வரையறுக்கவில்லை.
- source_word: לִפְלֻגּוֹת
  choice: பிரிவுகளின்படி
  rationale: ஒழுங்கமைக்கப்பட்ட குழுக்களையோ பிரிவுகளையோ குறிக்கும் பெயர்ச்சொல்; ל முன்னொட்டின் சூழல்சார் பொருளை ‘படி’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בֵּית הָאָבוֹת / בֵּית אָב
  choice: தந்தைவழிக் குடும்பம்
  rationale: இஸ்ரவேலின் தந்தைவழி மரபுக் குடும்ப அலகைக் குறிக்கும் வழக்குச் சொற்றொடர். சொற்சொல்லான ‘தந்தையின் வீடு’ என்பதைவிட இத்தேர்வு பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לַאֲחֵיכֶם
  choice: உங்கள் சகோதரர்களின்
  rationale: லேவியர்களோடு உடன்படிக்கை உறவில் உள்ள சக இஸ்ரவேலரைச் சுட்டும் குடும்ப உறவு மொழியைத் தக்கவைக்கிறது.
- source_word: בְּנֵי הָעָם
  choice: மக்களாகிய
  rationale: சொற்சொல்லாக ‘மக்களின் மகன்கள்’; இச்சூழலில் லேவியர் அல்லாத இஸ்ரவேலரை வேறுபடுத்திக் காட்டுகிறது. தமிழில் தேவையற்ற கடினத்தன்மையைத் தவிர்த்து, சூழல்பொருளை முதன்மை உரையில் தருகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
- source_word: וַחֲלֻקַּת ... לַלְוִיִּם
  choice: லேவியர்களின் ... பிரிவின்படியும்
  rationale: மக்களின் குடும்பப் பிரிவுகளுக்கு இணையாக லேவியரின் குடும்பப் பிரிவையும் அமைக்கும் தொடரைத் தமிழில் தெளிவான இணை அமைப்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: உறவுமுறை மற்றும் சமூகக் குழுவைக் குறிக்கும் பாலினச் சொற்கள்
  choice: ‘உங்கள் சகோதரர்கள்’ என்பதைத் தக்கவைத்து, בְּנֵי הָעָם என்பதை ‘மக்களாகிய’ என்று மொழிபெயர்த்தல்
  alternative: ‘மக்களின் மகன்களாகிய உங்கள் சகோதரர்கள்’ அல்லது ‘உங்கள் சக இஸ்ரவேலர்’
  rationale: ‘சகோதரர்கள்’ என்பது இஸ்ரவேலின் குடும்ப-உடன்படிக்கை மொழியைப் பாதுகாக்கிறது. ஆனால் ‘மக்களின் மகன்கள்’ என்ற சொற்சொல் வடிவம் தமிழில் தவறான அல்லது தெளிவற்ற பொருளைத் தரக்கூடும்; இங்கு நோக்கம் லேவியர் அல்லாத இஸ்ரவேலரைச் சுட்டுவதாக இருப்பதால் அதை அடிக்குறிப்புடன் இயல்பாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தைவழிக் குடும்பம்’ என்பது பழங்கால வம்சக் குடும்ப அலகைத் தெளிவுபடுத்துகிறது; இரு இணையான பிரிவுகளும் ‘-படியும்’ என்னும் அமைப்பால் வெளிப்படுத்தப்பட்டுள்ளன.
