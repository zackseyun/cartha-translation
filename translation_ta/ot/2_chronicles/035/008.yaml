  text: וְ/שָׂרָ֞י/ו לִ/נְדָבָ֥ה לָ/עָ֛ם לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם הֵרִ֑ימוּ חִלְקִיָּ֨ה וּ/זְכַרְיָ֜הוּ וִֽ/יחִיאֵ֗ל נְגִידֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים לַ/כֹּהֲנִ֞ים נָתְנ֣וּ לַ/פְּסָחִ֗ים אַלְפַּ֨יִם֙ וְ/שֵׁ֣שׁ מֵא֔וֹת וּ/בָקָ֖ר שְׁלֹ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
translation:
  language: ta
  text: அவருடைய அதிகாரிகளும் மக்களுக்காகவும், ஆசாரியர்களுக்காகவும், லேவியர்களுக்காகவும் தன்னார்வக் காணிக்கைகளை அளித்தார்கள். இறைவனுடைய ஆலயத்தின் தலைவர்களான இல்க்கியா, சகரியா, யெகியேல் ஆகியோர் ஆசாரியர்களுக்கு 2,600 பஸ்காப் பலிகளையும்[a] 300 மாடுகளையும் கொடுத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் எழுத்துப்படி, “பஸ்காக்கள்.” இங்குள்ள பன்மை, பஸ்கா அனுசரிப்பிற்குப் பயன்படுத்தப்பட்ட பலிவிலங்குகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרָיו
  choice: அவருடைய அதிகாரிகளும்
  rationale: שָׂרִים என்பது ஆட்சிப் பொறுப்புள்ள தலைவர்களையோ அதிகாரிகளையோ குறிக்கும்; இந்நிர்வாகச் சூழலில் ‘அதிகாரிகள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לִנְדָבָה ... הֵרִימוּ
  choice: தன்னார்வக் காணிக்கைகளை அளித்தார்கள்
  rationale: נְדָבָה தானாக முன்வந்து அளிக்கப்படும் காணிக்கையைக் குறிக்கிறது; רום என்பதன் ஹிஃபில் வடிவம் இங்கு பங்களித்தல் அல்லது காணிக்கையாக அளித்தல் என்ற பொருளைத் தருகிறது.
- source_word: לָעָם לַכֹּהֲנִים וְלַלְוִיִּם
  choice: மக்களுக்காகவும், ஆசாரியர்களுக்காகவும், லேவியர்களுக்காகவும்
  rationale: மீண்டும் வரும் לְ இம்மூன்று குழுக்களும் காணிக்கையின் பயனாளிகள் என்பதைச் சுட்டுகிறது; ‘-க்காக’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חִלְקִיָּה וּזְכַרְיָהוּ וִיחִיאֵל
  choice: இல்க்கியா, சகரியா, யெகியேல்
  rationale: எபிரெய தனிப்பெயர்களின் ஒலியை நவீன தமிழில் வாசிக்க ஏற்ற வகையில் எழுத்துப்பெயர்க்கப்பட்டுள்ளது.
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  choice: இறைவனுடைய ஆலயத்தின் தலைவர்கள்
  rationale: נָגִיד தலைமை அல்லது மேற்பார்வைப் பொறுப்புள்ளவரைக் குறிக்கிறது. ‘இறைவனுடைய வீடு’ என்பது இங்கு ஆலயத்தைக் குறிக்கும் மரபுத்தொடர் என்பதால் இயல்பான தமிழில் ‘ஆலயம்’ எனத் தரப்பட்டுள்ளது.
- source_word: לַפְּסָחִים אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: 2,600 பஸ்காப் பலிகளை
  rationale: פֶּסַח என்பதன் பன்மை இங்கு விழாக்களின் எண்ணிக்கையை அல்ல, பஸ்கா அனுசரிப்பிற்கான பலிப்பொருட்களை அல்லது பலிவிலங்குகளைக் குறிக்கிறது. எண்ணிக்கையுடன் இயல்பாக அமைய ‘பஸ்காப் பலிகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבָקָר שְׁלֹשׁ מֵאוֹת
  choice: 300 மாடுகளையும்
  rationale: בָּקָר என்பது மாட்டினத்தைக் குறிக்கும் கூட்டுப்பெயர்; ‘மாடுகள்’ என்பது காளைகள் என்று தேவையின்றிக் குறுக்காமல் அதன் பரந்த பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: לַפְּסָחִים என்ற பன்மையின் குறிப்பு
  choice: பஸ்காப் பலிகள்
  alternative: பஸ்காக்கள் / பஸ்காப் பலிக்கான விலங்குகள்
  rationale: பன்மையை பல விழாக்கள் எனப் புரிந்துகொள்வதைத் தவிர்த்து, சூழலில் கொடுக்கப்பட்ட பலிவிலங்குகளைக் குறிப்பதாக மொழிபெயர்க்கப்பட்டது; இருப்பினும் மூலத்தின் சுருக்கமான வடிவம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டுச் சூழலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இறைவனுடைய ஆலயம்’, ‘தன்னார்வக் காணிக்கைகள்’ போன்ற சொற்றொடர்கள் மூலத்தின் கருத்தை இயல்பாக வெளிப்படுத்துகின்றன; எண்கள் வாசிப்பின் தெளிவுக்காக இலக்கங்களில் தரப்பட்டுள்ளன.
