  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: ta
  text: சகரியாவின் மகனும், பெனாயாவின் மகனும், எயியேலின் மகனும், மத்தனியாவின் மகனுமான யகசியேல், ஆசாப்பின் மக்களில் ஒருவனான லேவியன்; சபையின் நடுவில் யாவேயின் ஆவி அவன்மேல் வந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יַחֲזִיאֵל
  choice: அப்போது ... யகசியேல்
  rationale: וְ என்னும் இணைப்பைத் தமிழ் கதைநடைக்கு இயல்பாக ‘அப்போது’ என வழங்கி, יַחֲזִיאֵל என்ற பெயரை எபிரெய ஒலிப்புக்கு நெருக்கமாக ‘யகசியேல்’ என ஒலிபெயர்த்துள்ளது.
- source_word: בֶּן זְכַרְיָהוּ בֶּן בְּנָיָה בֶּן יְעִיאֵל בֶּן מַתַּנְיָה
  choice: சகரியாவின் மகனும், பெனாயாவின் பேரனும், ஏயெயேலின் கொள்ளுப்பேரனும், மத்தனியாவின் வழிவந்தவருமான
  rationale: எபிரெய மொழியில் மீண்டும் மீண்டும் வரும் בֶּן வம்சத் தொடரைக் குறிக்கிறது. தமிழில் ஒவ்வொரு தலைமுறையையும் ‘மகன்’ என்று கூறுவது தவறான நேரடி உறவுகளாகப் புரியக்கூடும்; ஆகவே குறிப்பிடப்பட்ட தலைமுறை வரிசையைத் தெளிவாகவும் இயல்பாகவும் காட்டும் உறவுமுறைகள் பயன்படுத்தப்பட்டன.
- source_word: הַ/לֵּוִי מִן בְּנֵי אָסָף
  choice: ஆசாப்பின் சந்ததியைச் சேர்ந்த லேவியர்
  rationale: மூலத்தின் ஆசாப்பிய வம்ச அல்லது குழுச் சார்பையும், யகசியேல் ஒரு லேவியர் என்பதையும் இயல்பான தமிழில் பாதுகாக்கிறது. மரியாதை ஒருமை விகுதி பயன்படுத்தப்பட்டாலும் கூடுதல் பதவியோ சிறப்புப்பெயரோ சேர்க்கப்படவில்லை.
- source_word: הָיְתָה עָלָיו רוּחַ יְהוָה
  choice: யகசியேல்மேல் ... யாவேயின் ஆவி வந்தது
  rationale: הָיְתָה עָלָיו என்ற மொழிமரபின் நிகழ்வுத் தன்மையை ‘மேல் ... வந்தது’ வெளிப்படுத்துகிறது; அடுத்துவரும் தீர்க்கதரிசன உரைக்கான தெய்வீகத் தூண்டுதலைக் கூடுதல் விளக்கமின்றி தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּ/תוֹךְ הַ/קָּהָל
  choice: சபையின் நடுவில்
  rationale: בְּתוֹךְ என்பதன் இடவியல் பொருளையும், קָהָל என்பதன் கூடியிருந்த பொது மக்கள்குழு என்ற பொருளையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: רוּחַ יְהוָה என்பதன் குறிப்பு
  choice: யாவேயின் ஆவி
  alternative: யாவேயிடமிருந்து வந்த ஆவி
  rationale: இது தீர்க்கதரிசனப் பேச்சிற்காக யகசியேல்மேல் வரும் கடவுளின் ஆவியைக் குறிக்கிறது. உடைமைத் தொடர்பை மூலத்தின்படி காத்து, தனிப்பட்ட இயல்பு அல்லது செயல்முறை குறித்து வசனம் கூறாதவற்றைச் சேர்க்கவில்லை.
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக உள்ள தனிப்பெயரை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, அதன் உடன்படிக்கைப் பெயர் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையைக் கடைப்பிடிக்கிறது. நீண்ட வம்சவரிசை தமிழில் குழப்பமின்றி வாசிக்க உறவுமுறைச் சொற்களால் அமைக்கப்பட்டுள்ளது; அதேவேளை மூல வரிசை முழுவதும் காக்கப்பட்டுள்ளது.
