  text: וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וַ/יֵּצְא֖וּ לְ/מִדְבַּ֣ר תְּק֑וֹעַ וּ/בְ/צֵאתָ֞/ם עָמַ֣ד יְהוֹשָׁפָ֗ט וַ/יֹּ֨אמֶר֙ שְׁמָע֗וּ/נִי יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם הַאֲמִ֜ינוּ בַּ/יהוָ֤ה אֱלֹהֵי/כֶם֙ וְ/תֵ֣אָמֵ֔נוּ הַאֲמִ֥ינוּ בִ/נְבִיאָ֖י/ו וְ/הַצְלִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
translation:
  language: ta
  text: அவர்கள் அதிகாலையில் எழுந்து, தெக்கோவாவின் வனாந்தரத்திற்குப் புறப்பட்டுச் சென்றார்கள். அவர்கள் புறப்பட்டுச் செல்கையில், யோசபாத் நின்று, “யூதாவே, எருசலேமின் குடிமக்களே, எனக்குச் செவிகொடுங்கள்! உங்கள் கடவுளாகிய யாவே[a]மேல் நம்பிக்கை வையுங்கள்; அப்போது நீங்கள் நிலைபெறுவீர்கள்.[b] அவருடைய இறைவாக்கினர்களை நம்புங்கள்;[c] அப்போது நீங்கள் வெற்றி பெறுவீர்கள்” என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே” என்பது எபிரெயத்தில் வரும் YHWH என்ற இறைப்பெயரின் ஒலிபெயர்ப்பு.
    reason: alternative_reading
  - marker: b
    text: “நம்பிக்கை வையுங்கள் … நிலைபெறுவீர்கள்” என்ற இரு சொற்களும் எபிரெயத்தில் אמן என்ற ஒரே வேரிலிருந்து வருகின்றன. இதை, “உங்கள் கடவுளாகிய யாவேமேல் நம்பிக்கை வையுங்கள்; அப்போது நீங்கள் உறுதியாக நிற்பீர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அவருடைய இறைவாக்கினர்களை நம்புங்கள்” என்பதை, “அவருடைய இறைவாக்கினர்கள்மேல் நம்பிக்கை வையுங்கள்” என்றும் மொழிபெயர்க்கலாம். தொடர்ந்து வரும் பகுதியை, “வெற்றியடையுங்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: அவர்கள் அதிகாலையில் எழுந்து
  rationale: שׁכם என்பதன் Hiphil வடிவம் அதிகாலையில் எழுதல் அல்லது முன்கூட்டியே புறப்படுதல் என்ற பொருளைத் தருகிறது. בַבֹּקֶר உடன் வருவதால் ‘அதிகாலையில் எழுந்து’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וַיֵּצְאוּ לְמִדְבַּר תְּקוֹעַ
  choice: தெக்கோவாவின் வனாந்தரத்திற்குப் புறப்பட்டுச் சென்றார்கள்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் மக்கள் குடியிருப்பு குறைந்த வறண்ட வெளிப்பகுதியையும் குறிக்கலாம்; ‘வனாந்தரம்’ அந்தப் பரப்பைத் தக்கவைக்கிறது. יצא இங்கு பயணத்தைத் தொடங்குவதைக் குறிக்கிறது.
- source_word: וּבְצֵאתָם
  choice: அவர்கள் புறப்பட்டுச் செல்கையில்
  rationale: בְּ + infinitive construct காலநிலைத் துணைவாக்கியத்தை உருவாக்குகிறது; நடந்து கொண்டிருந்த புறப்பாட்டின்போது அரசன் பேசியதை இச்சொற்றொடர் காட்டுகிறது.
- source_word: עָמַד
  choice: நின்று
  rationale: எளிய நிகழ்வுரை வினை; தேவையற்ற நாடகத் தன்மையைச் சேர்க்காமல் மூலத்தின் நேரடியான பொருளைத் தருகிறது.
- source_word: שְׁמָעוּנִי
  choice: எனக்குச் செவிகொடுங்கள்
  rationale: שמע கட்டளை வடிவமும் முதலாம் நபர் பொருள் பின்னொட்டும் கொண்ட நேரடி அழைப்பு. ‘செவிகொடுங்கள்’ என்பது பொதுமக்களுக்கு உரைக்கும் கண்ணியமான நவீனத் தமிழ்.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: யூதாவே, எருசலேமின் குடிமக்களே
  rationale: இரண்டும் விளிவேற்றுமை அழைப்புகளாக உள்ளன. யூதா கூட்டாக மக்களைக் குறிக்கிறது; יֹשְׁבֵי என்பது அங்கு வாழ்பவர்களைக் குறிக்கிறது.
- source_word: הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளாகிய யாவேமேல் நம்பிக்கை வையுங்கள்
  rationale: אמן என்பதன் Hiphil வடிவம் ב உடன் ஒருவர்மேல் நம்பிக்கை வைப்பதைக் குறிக்கிறது. ‘நம்பிக்கை வையுங்கள்’ என்பது உறவுசார் சார்ந்திருத்தலை வெளிப்படுத்துகிறது; அடுத்த சொல்லாட்டத்துடனான தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְתֵאָמֵנוּ
  choice: அப்போது நீங்கள் நிலைபெறுவீர்கள்
  rationale: אמן என்பதன் Niphal வடிவம் உறுதியாக்கப்படுதல் அல்லது நிலைத்திருத்தல் என்ற விளைவைத் தருகிறது. ‘நிலைபெறுவீர்கள்’ என்பது நம்பிக்கை—உறுதி என்ற எபிரெயச் சொல்லாட்டத்தை ஓரளவு தக்கவைக்கிறது.
- source_word: הַאֲמִינוּ בִנְבִיאָיו
  choice: அவருடைய இறைவாக்கினர்களை நம்புங்கள்
  rationale: முந்தைய הַאֲמִינוּ மீண்டும் வருவதால் அதே நம்பிக்கை அழைப்பு தொடர்கிறது. נביא என்பது கடவுளின் செய்தியை அறிவிப்பவரைக் குறிப்பதால் ‘இறைவாக்கினர்’ இயல்பான நவீனத் தேர்வு.
- source_word: וְהַצְלִיחוּ
  choice: அப்போது நீங்கள் வெற்றி பெறுவீர்கள்
  rationale: צלח என்பதன் Hiphil வடிவம் வெற்றியடைதல் அல்லது செழித்தோங்குதல் என்ற பொருள் தரலாம். உடனடி படையெடுப்பு சூழலில் ‘வெற்றி பெறுவீர்கள்’ பொருத்தமானது; இது வெறும் பொருளாதாரச் செழிப்பாகக் குறுக்கப்படவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: אמן என்ற வேர் உருவாக்கும் நம்பிக்கை—நிலைப்பாடு சொல்லாட்டம்
  choice: நம்பிக்கை வையுங்கள் … நிலைபெறுவீர்கள்
  alternative: நம்புங்கள் … உறுதிப்படுத்தப்படுவீர்கள்
  rationale: ஒரே எபிரெய வேரின் Hiphil மற்றும் Niphal வடிவங்கள் நோக்கமுள்ள சொல்லாட்டத்தை உருவாக்குகின்றன. தேர்ந்த தமிழ் வாசகம் இயல்பாக இருக்கிறது; மூலச் சொல்லாட்டம் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது. இங்கு பிற்காலக் கோட்பாட்டு வரையறை திணிக்கப்படவில்லை.
- issue: இறைவாக்கினர்களை நம்புதல் என்பதன் வலிமை
  choice: அவருடைய இறைவாக்கினர்களை நம்புங்கள்
  alternative: அவருடைய இறைவாக்கினர்கள்மேல் நம்பிக்கை வையுங்கள்
  rationale: ב முன்னிடைச்சொல்லை மிக இயந்திரமாகத் தமிழாக்காமல் இயல்பான வினை அமைப்பு பயன்படுத்தப்பட்டுள்ளது. இது இறைவாக்கினர்களை யாவேக்கு இணையான நம்பிக்கையின் இறுதி இலக்காக அறிவிப்பதில்லை; அவர்கள் அறிவித்த செய்தியின் நம்பகத்தன்மையைச் சூழல் முன்னிறுத்துகிறது.
- issue: וְהַצְלִיחוּ என்பதன் விளைவு அல்லது கட்டளைத் தொனி
  choice: அப்போது நீங்கள் வெற்றி பெறுவீர்கள்
  alternative: வெற்றியடையுங்கள்
  rationale: வடிவம் கட்டளைத் தொனியுடன் வாசிக்கப்படலாம்; ஆயினும் இணை அமைப்பில் நம்பிக்கையின் விளைவைச் சொல்வதாகப் புரிந்துகொள்வது இயல்பானது. மாற்று வாய்ப்பு முற்றிலும் மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசிப்புக்கு ஏற்ற கண்ணியமான நிகழ்வுரை மற்றும் பொதுமக்களை நோக்கிய உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வனாந்தரம்’, ‘இறைவாக்கினர்’, ‘நிலைபெறுதல்’ ஆகியவை மரியாதைமிக்க வேதாகமப் பதிவைத் தக்கவைத்தாலும் சாதாரண வாசகருக்குப் புரியக்கூடிய சொற்களாகத் தேர்ந்தெடுக்கப்பட்டுள்ளன. எபிரெயச் சொல்லாட்டமும் இலக்கணத் தெளிவின்மையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
