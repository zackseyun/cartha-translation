  yaml_path: translation/ot/2_chronicles/020/008.yaml
  text: And they lived in it and built for you in it a sanctuary for your name[a], saying[b],
translation:
  language: ta
  text: 'அவர்கள் அதில் குடியிருந்தார்கள்[a]; உமக்காக, உமது பெயருக்கென, அதில் ஒரு பரிசுத்த இடத்தைக் கட்டினார்கள்[b]; இவ்வாறு சொன்னார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதில் வசித்தார்கள்’ அல்லது ‘அதில் குடியேறினார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘உமது பெயருக்கென ஒரு பரிசுத்த இடம்’ என்பது தேவனுடைய பெயருக்கு—அதாவது, அவருடைய வெளிப்படுத்தப்பட்ட பிரசன்னத்திற்கும் மகிமைக்கும்—அர்ப்பணிக்கப்பட்ட புனித இடத்தைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: குடியிருந்து
  rationale: ישׁב இங்கு நாட்டில் குடியேறி வாழ்ந்ததைக் குறிக்கிறது. ‘குடியிருந்து’ என்பது ஆரம்பக் குடியேற்றத்தையும் தொடர்ந்து வாழ்ந்த நிலையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָהּ
  choice: அதில்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன் குறிப்பிடப்பட்ட நாட்டைக் குறிக்கிறது; தமிழில் ‘அதில்’ இயல்பானது.
- source_word: וַיִּבְנוּ
  choice: கட்டி
  rationale: בנה என்பதன் நேரடியான, இயல்பான தமிழ் இணைச்சொல்.
- source_word: לְךָ
  choice: உமக்காக
  rationale: இங்குள்ள ל அர்ப்பணிப்பு அல்லது பயனைக் குறிக்கிறது; பரிசுத்த இடம் தேவனுக்காகக் கட்டப்பட்டது என்பதை ‘உமக்காக’ தெளிவாகக் காட்டுகிறது.
- source_word: מִקְדָּשׁ
  choice: ஒரு பரிசுத்த இடம்
  rationale: מִקְדָּשׁ என்பது புனிதமாகப் பிரித்துவைக்கப்பட்ட இடத்தைக் குறிக்கிறது. ‘ஆலயம்’ என்று குறிப்பிட்ட அமைப்பாக மட்டும் சுருக்காமல் மூலச்சொல்லின் பரந்த புனிதப் பொருளைப் பாதுகாக்கிறது.
- source_word: לְשִׁמְךָ
  choice: உமது பெயருக்கென
  rationale: தேவனுடைய பெயருக்கு அர்ப்பணிக்கப்பட்டது என்ற பொருளைத் தெரிவிக்கிறது; ‘உமது பெயரில்’ என்ற மொழிபெயர்ப்பு செயல் அதிகாரத்தின் பெயரில் நடந்தது எனத் தவறாகப் புரியப்படலாம்.
- source_word: לֵאמֹר
  choice: இவ்வாறு சொன்னார்கள்
  rationale: அடுத்த வசனத்தில் வரும் உரையை அறிமுகப்படுத்துகிறது. தமிழில் வாக்கிய முடிவோடு அடுத்த மேற்கோளை இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: ‘உமது பெயருக்கென ஒரு பரிசுத்த இடம்’ என்பதன் கருத்து
  choice: தேவனுடைய பெயருக்கு அர்ப்பணிக்கப்பட்ட பரிசுத்த இடம்
  alternative: தேவனுடைய மகிமைக்கான ஆலயம்; தேவனுடைய பெயரைத் தாங்கும் புனித இடம்
  rationale: இது தேவனுடைய வெளிப்படுத்தப்பட்ட பிரசன்னம், புகழ், அதிகாரம் ஆகியவற்றோடு ஆலயம் தொடர்புடையது என்ற பழைய ஏற்பாட்டுக் கருத்தைத் தக்கவைக்கிறது; அதேவேளையில் தேவன் அந்த இடத்துக்குள் அடங்கியவர் என்ற எண்ணத்தைப் புகுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையான தெய்வமுகப் பேச்சாக ‘உமக்கு/உமது’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு ‘அதில்’ குறிப்புகளும் நிலத்தையும் அதில் கட்டப்பட்ட பரிசுத்த இடத்தையும் தெளிவாக இணைப்பதால் தக்கவைக்கப்பட்டுள்ளன. வாக்கியம் அடுத்த வசனத்துக்குத் தொடர்வதை இரட்டைப்புள்ளி காட்டுகிறது.
