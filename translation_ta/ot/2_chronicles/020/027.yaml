revisions:
- from: பின்பு யூதா மற்றும் எருசலேமைச் சேர்ந்த ஆண்கள் அனைவரும், யோசபாத் அவர்களுக்குத் தலைமை தாங்க, மகிழ்ச்சியோடு எருசலேமுக்குத் திரும்பிச் சென்றார்கள்; ஏனெனில் யாவே அவர்களுடைய பகைவர்களைக் குறித்து அவர்களை மகிழச் செய்திருந்தார்.
  to: பின்பு யூதாவையும் எருசலேமையும் சேர்ந்த ஆண்கள் அனைவரும், யோசபாத் அவர்களுக்குத் தலைமை தாங்கி, எருசலேமுக்குத் திரும்புவதற்காக மகிழ்ச்சியோடு திரும்பிச் சென்றார்கள்; ஏனெனில் யாவே அவர்களுடைய பகைவர்களைக் குறித்து அவர்களை மகிழச் செய்திருந்தார்.
  rationale: The revision explicitly renders both occurrences of שוב as “திரும்புவதற்காக ... திரும்பிச் சென்றார்கள்,” preserving the Hebrew's finite verb and infinitival purpose without importing an interpretation. It also makes the leadership clause more idiomatic Tamil. The divine name, masculine collective expression, and deliberately broad rendering of the enemies phrase are retained.
