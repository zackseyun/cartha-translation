source:
  edition: WLC
  text: וַ֠/יָּשֻׁבוּ כָּל אִ֨ישׁ יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ וִֽ/יהוֹשָׁפָ֣ט בְּ/רֹאשָׁ֔/ם לָ/שׁ֥וּב אֶל יְרוּשָׁלִַ֖ם בְּ/שִׂמְחָ֑ה כִּֽי שִׂמְּחָ֥/ם יְהוָ֖ה מֵֽ/אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
translation:
  language: ta
  text: பின்பு யூதாவையும் எருசலேமையும் சேர்ந்த ஆண்கள் அனைவரும், யோசபாத் அவர்களுக்குத் தலைமை தாங்கி, எருசலேமுக்குத் திரும்புவதற்காக மகிழ்ச்சியோடு திரும்பிச் சென்றார்கள்; ஏனெனில் யாவே அவர்களுடைய பகைவர்களைக் குறித்து அவர்களை மகிழச் செய்திருந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ ... לָשׁוּב
  choice: திரும்பிச் சென்றார்கள்
  rationale: ஒரே שׁוב் வேர் finite verb மற்றும் infinitive வடிவங்களில் மீண்டும் வருவதைத் தமிழில் இயல்பான கூட்டு வினையால் வெளிப்படுத்துகிறது; போர்க்களத்திலிருந்து எருசலேமுக்குத் திரும்பிய இயக்கமும் காக்கப்படுகிறது.
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלַם
  choice: யூதா மற்றும் எருசலேமைச் சேர்ந்த ஆண்கள் அனைவரும்
  rationale: אִישׁ என்பதன் ஆண்பால் குறிப்பையும், ஒருமை பகிர்முறை வடிவத்தின் முழுக் குழுவைக் குறிக்கும் பொருளையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  choice: யோசபாத் அவர்களுக்குத் தலைமை தாங்க
  rationale: בְּרֹאשָׁם என்பதன் சொற்படிமம் 'அவர்களின் தலையில்' என்றாலும், இங்கு முன்னின்று வழிநடத்துதல் அல்லது தலைமை வகித்தல் என்பதே இயல்பான பொருள்.
- source_word: בְּשִׂמְחָה
  choice: மகிழ்ச்சியோடு
  rationale: שִׂמְחָה என்ற பெயர்ச்சொல்லை இயல்பான தமிழில் பெயர்ச்சொல் வடிவிலேயே வழங்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவர்களுடைய மகிழ்ச்சியான திரும்புதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: שִׂמְּחָם
  choice: அவர்களை மகிழச் செய்திருந்தார்
  rationale: שׂמח piel வடிவத்தின் காரணவினைப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: מֵאֹיְבֵיהֶם
  choice: அவர்களுடைய பகைவர்களைக் குறித்து
  rationale: מן முன்னிடைச்சொல் இங்கு மகிழ்ச்சிக்கான தொடர்பு, காரணம் அல்லது வெற்றியின் பொருளைக் குறிக்கலாம்; 'குறித்து' என்பது மூலத்தின் பரப்பைத் தேவையின்றி 'மேல் வெற்றி' என மட்டும் குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதை ஒலிபெயர்ப்பது மூல வடிவத்தைச் சிறப்பாகக் காக்கிறது.
- issue: מֵאֹיְבֵיהֶם என்பதன் உறவு
  choice: பகைவர்களைக் குறித்து
  alternative: பகைவர்கள்மேல் வெற்றிகொண்டதால் / பகைவர்களிடமிருந்து
  rationale: சூழல் வெற்றியின் மகிழ்ச்சியை உணர்த்தினாலும், מן என்பது காரணம், தொடர்பு அல்லது விடுதலை ஆகிய நுணுக்கங்களை ஏற்கக்கூடும். தேர்ந்த வடிவம் இந்த உண்மையான தெளிவின்மையைத் திறந்தவாறே வைக்கிறது.
- issue: כָּל אִישׁ என்ற பாலினமுள்ள கூட்டுச் சொற்றொடர்
  choice: ஆண்கள் அனைவரும்
  alternative: அனைவரும்
  rationale: אִישׁ என்ற வெளிப்படையான ஆண்பால் சொல்லை நீக்காமல், அதன் பகிர்முறை கூட்டுப் பொருளை இயல்பாகத் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமானதாயும் பொதுவாசகர்களுக்கு எளிதாகவும் அமைந்த நடை. எபிரெய வேர்ச்சொல் மீளுரையைச் சொல்-சொல்லாகக் கடினமாகப் பதிலிடாமல், 'திரும்பிச் சென்றார்கள்' என்ற இயல்பான கூட்டு வினையில் அதன் இயக்க வலிமை காக்கப்பட்டுள்ளது.
