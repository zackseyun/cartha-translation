source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ יְהוּדָ֔ה לְ/בַקֵּ֖שׁ מֵֽ/יְהוָ֑ה גַּ֚ם מִ/כָּל עָרֵ֣י יְהוּדָ֔ה בָּ֖אוּ לְ/בַקֵּ֥שׁ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/004.yaml
  text: And Judah gathered together to seek Yahweh[b][a]; they even came from all the cities of Judah to seek Yahweh.
translation:
  language: ta
  text: யூதா மக்கள் யாவேயிடம் நாடுவதற்காக ஒன்றுகூடினர்[a]; யூதாவின் எல்லா நகரங்களிலிருந்தும்கூட அவர்கள் யாவேவைத் தேடி வந்தனர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொற்சார்ந்த மொழிபெயர்ப்பு: “யாவேயிடமிருந்து நாடுவதற்காக.” எதை நாடினர் என்பது மூலத்தில் கூறப்படவில்லை; சூழலில் அது உதவி அல்லது விடுதலையைக் குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: முதல் கூறில் “யாவேயிடமிருந்து/யாவேயிடம் நாடுதல்” என்ற அமைப்பும், இங்கு “யாவேவைத் தேடுதல்” என்ற நேரடிச் செயப்படுபொருள் அமைப்பும் எபிரெயத்தில் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ יְהוּדָה
  choice: யூதா மக்கள் ... ஒன்றுகூடினர்
  rationale: நிஃபால் வினைச்சொல் மக்கள் தாமாகக் கூடிவந்த கூட்டுச் செயலைக் குறிக்கிறது. ஒருமை வடிவிலுள்ள ‘யூதா’ இங்கு நாட்டின் மக்களைக் கூட்டாகக் குறிப்பதால், தமிழில் பொருள் தெளிவதற்காக ‘யூதா மக்கள்’ என வழங்கப்பட்டது.
- source_word: לְבַקֵּשׁ מֵיְהוָה
  choice: யாவேவிடம் உதவி நாடுவதற்காக
  rationale: בקש என்பதற்கு ‘தேடு/நாடு’ என்றும், מן உடன் வரும் அமைப்புக்கு ‘யாவேவிடமிருந்து நாடுதல்’ என்றும் பொருள். நாடப்பட்டது என்ன என்பது எபிரெயத்தில் வெளிப்படையாகக் கூறப்படவில்லை; சூழலில் உதவி அல்லது விடுதலை என்பதால், இயல்பான தமிழுக்காக ‘உதவி’ சேர்க்கப்பட்டு அதன் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: גַּם מִכָּל עָרֵי יְהוּדָה
  choice: யூதாவின் எல்லா நகரங்களிலிருந்தும்கூட
  rationale: גם தரும் வலியுறுத்தலை ‘கூட’ என்பதும், מִכָּל עָרֵי பரந்த பங்கேற்பைக் குறிப்பதை ‘எல்லா நகரங்களிலிருந்தும்’ என்பதும் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: בָּאוּ לְבַקֵּשׁ אֶת יְהוָה
  choice: மக்கள் யாவேவைத் தேடி வந்தனர்
  rationale: באו என்பதன் எளிய இயக்கப் பொருளை ‘வந்தனர்’ என்றும், את குறிக்கும் நேரடி பொருளான யாவேவை ‘தேடி’ என்றும் வழங்கி, முதல் கூறிலிருந்து மாறுபடும் எபிரெய இலக்கண அமைப்பு பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்லாமல் தனிப்பெயர் இருப்பதால், அதனை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: இரண்டு בקש தொடர்களையும் ஒரே விதமாக மொழிபெயர்க்க வேண்டுமா?
  choice: முதல் தொடரில் ‘யாவேவிடம் உதவி நாடுதல்’; இரண்டாவது தொடரில் ‘யாவேவைத் தேடுதல்’
  alternative: இரண்டையும் ‘யாவேவைத் தேடுதல்’ என்று ஒரே விதமாக வழங்குதல்
  rationale: முதல் தொடரில் מן (‘இடமிருந்து/இடம்’) அமைப்பும், இரண்டாவது தொடரில் את குறிக்கும் நேரடி செயப்படுபொருளும் வருகின்றன. நாடப்பட்ட பொருள் முதல் தொடரில் சொல்லப்படாமல் இருந்தாலும் சூழல் உதவியைக் காட்டுகிறது; இரு கூறுகளின் வேறுபாட்டைத் தமிழிலும் பாதுகாப்பது உரையின் நுணுக்கத்தையும் தெளிவின்மையையும் மதிக்கிறது.
translation_notes:
  register: நவீன செந்தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நாடு’ மற்றும் ‘தேடு’ என்ற சொற்கள் மூலத்திலுள்ள இரு வேறுபட்ட இலக்கண அமைப்புகளை இயல்பான தமிழில் காட்டுகின்றன; ‘யூதா மக்கள்’ என்பது கூட்டுப்பொருளைத் தெளிவாக்குகிறது.
