translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. பெயர்கள் ‘தர்ஷீசு,’ ‘எசியோன்-கேபேர்’ என ஒலிபெயர்க்கப்பட்டுள்ளன. மூலத்தில் இரு ஆண் ஒருமைப் பிரதிப்பெயர்கள் அடுத்தடுத்து வருவதால் உள்ள குறிப்பு தெளிவின்மை ‘அவன் அவனோடு’ எனப் பாதுகாக்கப்பட்டுள்ளது; முந்தைய வசனச் சூழல் அவற்றின் நபர்களை அடையாளப்படுத்துகிறது.
