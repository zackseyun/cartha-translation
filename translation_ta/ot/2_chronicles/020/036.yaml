base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/036.yaml
  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
translation:
  language: ta
  text: அவன் அவனோடு கூட்டுச் சேர்ந்தான்[a]; தர்ஷீஷுக்குச் செல்வதற்காகக் கப்பல்களைக் கட்டினான்[b]. அவர்கள் எசியோன்-கேபேரில் கப்பல்களைக் கட்டினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனோடு பங்காளியானான்’ அல்லது ‘அவனோடு இணைந்துகொண்டான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் ஓர் உறவு, கூட்டு அல்லது கூட்டணி ஏற்படுத்துவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தர்ஷீஷுக்குக் கப்பலில் செல்வதற்காக’ என்றும் மொழிபெயர்க்கலாம். கப்பல் போக்குவரத்துச் சூழல்களில் ‘தர்ஷீஷ்’ தொடர்பான சொல்லாட்சியைச் சிலர் மரபுத்தொடராகப் புரிந்துகொள்கிறார்கள்; ஆனால் இங்கு எபிரெய இலக்கணம் அதைச் சேருமிடமாகப் புரிந்துகொள்வதற்கே அதிகம் இடமளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ עִמּוֹ
  choice: அவன் அவனோடு கூட்டுச் சேர்ந்தான்
  rationale: חבר என்பதன் ஹிஃபில் வடிவம் இங்கு வெறுமனே ஒன்றாக இணைவதை அல்ல, ஒரு கூட்டு முயற்சிக்காக உறவு அல்லது பங்காளித்துவம் ஏற்படுத்துவதைச் சுட்டுகிறது. ‘கூட்டுச் சேர்ந்தான்’ என்பது வணிக-அரசியல் பின்னணிக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: לַעֲשׂוֹת
  choice: கட்ட
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்/உருவாக்கு.’ கப்பல்களைப் பற்றிய தமிழ்ச் சூழலில் ‘கட்ட’ என்பதே இயல்பானதும் துல்லியமானதும் ஆகும்.
- source_word: אֳנִיּוֹת
  choice: கப்பல்கள்
  rationale: இச்சொல் கடற்பயணத்திற்குரிய பெரிய கலங்களைக் குறிக்கிறது; இவ்வணிகப் பயணச் சூழலில் ‘கப்பல்கள்’ பொருத்தமானது.
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  choice: தர்ஷீசுக்குச் செல்வதற்காக
  rationale: הלך வினையெச்சத்துடன் வரும் தர்ஷீஷ் இங்கு இயல்பாகச் சேருமிடத்தைக் குறிக்கிறது. தமிழில் நோக்கத்தையும் சேருமிடத்தையும் தெளிவாக வெளிப்படுத்த இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תַּרְשִׁישׁ
  choice: தர்ஷீசு
  rationale: இது இடப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַיַּעֲשׂוּ
  choice: அவர்கள் ... கட்டினார்கள்
  rationale: பன்மை வினைச்சொல் கூட்டுச் சேர்ந்த இரு தரப்பினரின் கூட்டு நடவடிக்கையைக் குறிக்கிறது; கப்பல்களுடன் தமிழில் ‘கட்டினார்கள்’ இயல்பானது.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: எசியோன்-கேபேரில்
  rationale: ב இங்கு கப்பல்கள் கட்டப்பட்ட இடத்தைக் குறிக்கிறது; இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
