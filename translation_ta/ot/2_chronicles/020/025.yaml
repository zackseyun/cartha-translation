  text: וַ/יָּבֹ֨א יְהוֹשָׁפָ֣ט וְ/עַמּ/וֹ֮ לָ/בֹ֣ז אֶת שְׁלָלָ/ם֒ וַ/יִּמְצְאוּ֩ בָ/הֶ֨ם לָ/רֹ֜ב וּ/רְכ֤וּשׁ וּ/פְגָרִים֙ וּ/כְלֵ֣י חֲמֻד֔וֹת וַ/יְנַצְּל֥וּ לָ/הֶ֖ם לְ/אֵ֣ין מַשָּׂ֑א וַ/יִּֽהְי֞וּ יָמִ֧ים שְׁלוֹשָׁ֛ה בֹּזְזִ֥ים אֶת הַ/שָּׁלָ֖ל כִּ֥י רַב הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
translation:
  language: ta
  text: பின்பு யோசபாத்தும் அவருடைய மக்களும் எதிரிகளின் கொள்ளைப்பொருளைச் சூறையாட வந்தார்கள். அவர்கள் எதிரிகளிடையே ஏராளமான உடைமைகள், பிணங்கள்[a], மதிப்புமிக்க பொருட்கள் ஆகியவற்றைக் கண்டார்கள். சுமந்து செல்ல முடியாத அளவுக்கு அவர்கள் கொள்ளைப்பொருட்களை எடுத்துக்கொண்டார்கள். கொள்ளைப்பொருள் மிகுதியாக இருந்ததால், அவர்கள் மூன்று நாட்கள் அதைச் சூறையாடிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மசோரா மூலபாடம்: “பிணங்கள்.” சில பழமையான உரைச்சாட்சிகளும் மொழிபெயர்ப்புகளும் “ஆடைகள்” போன்ற ஒரு வாசிப்பைப் பிரதிபலிக்கின்றன அல்லது இச்சொல்லை விடுகின்றன. மசோரா வாசகம், கொள்ளைப்பொருள் காணப்பட்ட வீழ்ந்த எதிரிகளின் உடல்களைக் குறிக்கலாம்.'
    reason: textual_variant
lexical_decisions:
- source_word: לָבֹז אֶת שְׁלָלָם
  choice: எதிரிகளின் கொள்ளைப்பொருளைச் சூறையாட
  rationale: போர் முடிந்தபின் எதிரிகளிடமிருந்து கொள்ளைப்பொருளை எடுத்துக்கொள்ளும் செயலைத் தெளிவாகக் காட்டுகிறது. எபிரெய 3ஆம் பால் பன்மை உருபின் சுட்டுப்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָהֶם לָרֹב
  choice: அவர்களிடையே ஏராளமான
  rationale: வீழ்ந்த எதிரிகளின் நடுவில் பொருட்கள் காணப்பட்டதையும் அவற்றின் மிகுதியையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: רְכוּשׁ
  choice: உடைமைகள்
  rationale: அசையும் சொத்து அல்லது பொதுவான பொருட்செல்வம் என்ற பரந்த பொருளைப் பேணுகிறது.
- source_word: פְגָרִים
  choice: பிணங்கள்
  rationale: மசோரா மூலபாடத்தின் நேரடியான வாசகம் ‘பிணங்கள்’; போர்க்களச் சூழலில் இது இயல்பானதும் துல்லியமானதுமாகும்.
- source_word: כְלֵי חֲמֻדוֹת
  choice: மதிப்புமிக்க பொருட்கள்
  rationale: ‘விரும்பத்தக்க/விலைமதிப்புள்ள பொருட்கள்’ என்ற பரந்த பொருளைக் காட்டி, பாத்திரங்கள் என்று தேவையின்றிக் குறுக்குவதில்லை.
- source_word: וַיְנַצְּלוּ לָהֶם
  choice: அவற்றைத் தங்களுக்காக எடுத்துக்கொண்டார்கள்
  rationale: பீயேல் வினையின் கொள்ளையெடுத்தல் அல்லது உரித்தெடுத்தல் சார்ந்த பொருளையும் לָהֶם காட்டும் தமக்கான பயனையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְאֵין מַשָּׂא
  choice: சுமந்து செல்ல முடியாத அளவுக்கு
  rationale: சொல்லுக்குச் சொல் அமைப்பை விட, எடுத்துச் செல்லக்கூடிய அளவை மீறிய மிகுதியைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים
  choice: அதைச் சூறையிட அவர்களுக்கு மூன்று நாட்கள் ஆயின
  rationale: மூன்று நாட்கள் நீடித்த செயலை இயல்பான தமிழ் காலவெளிப்பாட்டில் தருகிறது.
- source_word: כִּי רַב הוּא
  choice: கொள்ளைப்பொருள் மிகுதியாக இருந்ததால்
  rationale: சூறையாடல் மூன்று நாட்கள் நீடித்ததற்கான காரணத்தை வெளிப்படையாகவும் இயல்பாகவும் காட்டுகிறது.
theological_decisions:
- issue: פְגָרִים என்பதன் உரைநிலை வாசகம்
  choice: மசோரா மூலபாடத்தின்படி ‘பிணங்கள்’ என்பதை முதன்மைப் பாடத்தில் வைத்தல்
  alternative: சில பழமையான சாட்சிகளின் அடிப்படையில் ‘ஆடைகள்’ என்று மொழிபெயர்த்தல் அல்லது சொல்லை விடுதல்
  rationale: கொடுக்கப்பட்ட WLC வாசகம் தெளிவாக ‘பிணங்கள்’ என உள்ளது. பொருட்களின் பட்டியலில் இது கடினமான வாசகமாக இருந்தாலும், அந்த உரைநிலைச் சிக்கலை அமைதியாக நீக்காமல் முதன்மைப் பாடத்தில் பேணி, மாற்றுச் சாட்சியை அடிக்குறிப்பில் குறிப்பிடுவது மூல ஆதாரத்திற்கு உண்மையானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘சூறையாட’ என்பது போர்க் கொள்ளையின் நுணுக்கத்தைப் பேணுகிறது; ‘எடுத்துக்கொண்டார்கள்’ என்பது மிகக் கடினமான சொல்லுக்குச் சொல் வடிவத்தைத் தவிர்த்து செயலைத் தெளிவாக்குகிறது. மசோரா மூலபாடத்தின் கடினமான ‘பிணங்கள்’ வாசகம் முதன்மைப் பாடத்தில் பாதுகாக்கப்பட்டுள்ளது.
