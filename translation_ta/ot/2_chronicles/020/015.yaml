source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְ/הַ/מֶּ֖לֶךְ יְהוֹשָׁפָ֑ט כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/כֶ֗ם אַ֠תֶּם אַל תִּֽירְא֤וּ וְ/אַל תֵּחַ֨תּוּ֙ מִ/פְּנֵ֨י הֶ/הָמ֤וֹן הָ/רָב֙ הַ/זֶּ֔ה כִּ֣י לֹ֥א לָ/כֶ֛ם הַ/מִּלְחָמָ֖ה כִּ֥י לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
translation:
  language: ta
  text: 'அவர் கூறினார்: “யூதா மக்கள் அனைவரும், எருசலேமில் குடியிருப்பவர்களும், யோசபாத் அரசரே, கவனித்துக் கேளுங்கள்! யாவே உங்களிடம் கூறுவது இதுவே: ‘இந்தப் பெருந்திரளைக் கண்டு அஞ்சாதீர்கள்; கலங்காதீர்கள். ஏனெனில், போர் உங்களுடையது அல்ல; கடவுளுடையது.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: கவனித்துக் கேளுங்கள்
  rationale: பன்மை ஏவல் வடிவம் வெறுமனே கேட்பதை அல்ல, கவனம் செலுத்திக் கேட்பதை வலியுறுத்துகிறது.
- source_word: כָל יְהוּדָה
  choice: யூதா மக்கள் அனைவரும்
  rationale: இங்கு இடப்பெயர் அங்குள்ள மக்களைத் தொகுப்பாகக் குறிக்கிறது; நேரடி அழைப்பில் இயல்பாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: எருசலேமில் குடியிருப்பவர்களும்
  rationale: எருசலேமில் வாழ்கிறவர்களைக் குறிக்கும் எபிரெயப் பங்கேற்பு வடிவத்தின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: וְהַמֶּלֶךְ יְהוֹשָׁפָט
  choice: யோசபாத் அரசரே
  rationale: மக்களோடு அரசனும் நேரடியாக அழைக்கப்படுவதால் தமிழ் விளிவேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யாவே உங்களிடம் கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தின் அதிகாரத்தையும் இயல்பான நவீன தமிழையும் காக்கிறது; இறைபெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַל תִּירְאוּ
  choice: அஞ்சாதீர்கள்
  rationale: பன்மையிலுள்ள நேரடியான தடையைச் சுருக்கமாகவும் உயர்நடையிலும் தருகிறது.
- source_word: וְאַל תֵּחַתּוּ
  choice: கலங்காதீர்கள்
  rationale: பயத்தால் மனம் உடைதல் அல்லது நிலைகுலைதல் என்ற கருத்தை இயல்பாகக் காட்டி, முந்தைய தடையிலிருந்து தனித்த இரண்டாம் தடையாக வைத்துள்ளது.
- source_word: מִפְּנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: இந்தப் பெருந்திரளைக் கண்டு
  rationale: எதிரே நிற்கும் பெருந்திரளே அச்சத்திற்குக் காரணம் என்ற சூழல்சார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; அதைத் தனிப்படையாக ‘படை’ என்று மிகையாக வரையறுக்கவில்லை.
- source_word: כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים
  choice: ஏனெனில், இந்தப் போர் உங்களுடையது அல்ல; கடவுளுடையது
  rationale: எபிரெய மொழியின் உடைமை சார்ந்த முரண்பாட்டைச் சுருக்கமாகக் காத்து, போரின் பொறுப்பும் கட்டுப்பாடும் கடவுளுக்குரியது என்பதைச் சூழலுக்குள் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்து உடன்படிக்கைப் பெயரே நேரடியாக உள்ளது; எனவே அதை ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: போர் யாருடையது என்ற உடைமைக்கூற்று
  choice: இந்தப் போர் உங்களுடையது அல்ல; கடவுளுடையது
  alternative: இந்தப் போர் உங்களுக்குரியது அல்ல; கடவுளுக்குரியது
  rationale: குறிப்பிட்ட இப்போரின் கட்டுப்பாடு கடவுளிடம் உள்ளது என்ற உடனடிச் சூழலை மட்டும் கூறி, அதற்கு அப்பாற்பட்ட பொதுக் கோட்பாட்டைச் சேர்க்கவில்லை.
- issue: இரண்டு எதிர்மறை ஏவல்களின் தொடர்பு
  choice: அஞ்சாதீர்கள்; கலங்காதீர்கள்
  alternative: அஞ்சவோ கலங்கவோ வேண்டாம்
  rationale: וְ இணைக்கும் இரு தனித்த தடைகளையும் தனித்தனியாக வெளிப்படுத்தி, அச்சம் மற்றும் மனக்கலக்கம் என்ற பதற்றத்தை ஒன்றாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும் உயர்நடை பயன்படுத்தப்பட்டுள்ளது. மக்கள் மற்றும் அரசனை நோக்கிய நேரடி அழைப்பு தெளிவாக வைக்கப்பட்டுள்ளது; இரண்டு தடைகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன. ‘அவர் கூறினார்’ என்பது கதையுரையில் மரியாதையும் கண்ணியமும் கொண்ட பொதுவான தமிழ் நடை.
