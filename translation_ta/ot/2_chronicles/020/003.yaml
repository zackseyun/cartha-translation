  text: וַ/יִּרָ֕א וַ/יִּתֵּ֧ן יְהוֹשָׁפָ֛ט אֶת פָּנָ֖י/ו לִ/דְר֣וֹשׁ לַ/יהוָ֑ה וַ/יִּקְרָא צ֖וֹם עַל כָּל יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/003.yaml
  text: And Jehoshaphat was afraid[a], and set his face to seek Yahweh[b], and proclaimed a fast throughout all Judah.
translation:
  language: ta
  text: யோசபாத் பயந்தார்[a]. அவர் யாவேவைத் தேடத் தீர்மானித்தார்[b]; யூதா நாடெங்கும் உபவாசத்தை அறிவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பயப்படத் தொடங்கினார்” என்றும் மொழிபெயர்க்கலாம். எபிரெயக் கதைநடையில் இவ்வினை அப்போது பயம் ஏற்பட்டதைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “தன் முகத்தைச் செலுத்தினார்.” இது உறுதியான தீர்மானத்தோடும் வேண்டுமென்றே கொண்ட நோக்கத்தோடும் செயல்படுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: பயந்தார்
  rationale: இது ירא என்ற வினையின் நேரடியான உணர்ச்சிப் பொருளைப் பாதுகாக்கிறது; சூழலில் இதை வெறும் பயபக்தி என்று மென்மையாக்கவில்லை.
- source_word: וַיִּתֵּן ... אֶת־פָּנָיו
  choice: உறுதிபூண்டு
  rationale: ‘தன் முகத்தை வைத்தார்’ என்ற எபிரெய மரபுத்தொடர், ஒரு நோக்கத்தை வேண்டுமென்றே உறுதியாக மேற்கொள்வதைக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் அதன் செயல்பாட்டுப் பொருளை இச்சொல் தருகிறது.
- source_word: לִדְרוֹשׁ
  choice: தேட
  rationale: தேவனிடம் உதவி, வழிகாட்டுதல் ஆகியவற்றுக்காகத் திரும்புவதையும் அவரை நாடுவதையும் דרש இங்கு பரந்த வகையில் குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேவை
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரான יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וַיִּקְרָא צוֹם
  choice: உபவாசத்தை அறிவித்தார்
  rationale: பொதுவாகவும் அதிகாரப்பூர்வமாகவும் உபவாசத்தைப் பிரகடனம் செய்த செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל כָּל יְהוּדָה
  choice: யூதா நாடெங்கும்
  rationale: அறிவிப்பு யூதா முழுவதையும் உள்ளடக்கியது என்ற பரப்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: வசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் உடன்படிக்கைப் பெயராகப் பாதுகாக்கிறது.
- issue: யோசபாத்தின் எதிர்வினையின் தன்மை
  choice: பயந்தார்
  alternative: பயபக்தி கொண்டார்
  rationale: இங்கு ירא ஆபத்தைக் கேட்டபோது ஏற்பட்ட பயத்தைக் குறிக்கிறது; அதை வழிபாட்டுக்குரிய பயபக்தியாக விளக்குவது மூலத்தைக் காட்டிலும் அதிகமான இறையியல் பொருளைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் எளிய வாசிப்புத்தன்மையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘உறுதிபூண்டு’ என்பது எபிரெய மரபுத்தொடரின் நோக்கத்தை இயல்பாகத் தருகிறது; அதன் சொற்படிமம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
