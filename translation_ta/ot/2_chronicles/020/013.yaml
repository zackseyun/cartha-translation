source:
  edition: WLC
  text: וְ/כָ֨ל יְהוּדָ֔ה עֹמְדִ֖ים לִ/פְנֵ֣י יְהוָ֑ה גַּם טַפָּ֖/ם נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/013.yaml
  text: And all Judah was standing before Yahweh[a], even their little ones, their wives, and their children.
translation:
  language: ta
  text: யூதா மக்கள் அனைவரும், அவர்களுடைய சிறு குழந்தைகள், மனைவிகள், பிள்ளைகள்[a] உட்பட, யாவேயின் முன்னிலையில் நின்றுகொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகன்கள்.” எபிரெயச் சொல் சூழலைப் பொறுத்து குறிப்பாக மகன்களையோ, பொதுவாகப் பிள்ளைகளையோ குறிக்கலாம்.
    reason: וּבְנֵיהֶם என்பதிலுள்ள בָּנִים என்ற சொல்லின் குறிப்பான ‘மகன்கள்’ பொருளையும் விரிவான ‘பிள்ளைகள்’ பொருளையும் பாதுகாக்கும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: யூதா மக்கள் அனைவரும்
  rationale: יְהוּדָה இங்கு யூதா நாட்டின் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. தமிழில் கூட்டுப் பொருள் தெளிவாக இருக்க ‘யூதா மக்கள் அனைவரும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֹמְדִים
  choice: நின்றுகொண்டிருந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை அப்போது தொடர்ந்துகொண்டிருந்த நிலையைச் சுட்டுகிறது; ‘நின்றுகொண்டிருந்தார்கள்’ அந்த நீடித்த நிலையைக் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִ/פְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பது ஒருவரின் முன்னிலையில் இருப்பதைக் குறிக்கிறது. יהוה என்ற இறைப் பெயர் பட்டப்பெயராக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: גַּם טַפָּם
  choice: அவர்களுடைய சிறு குழந்தைகளும்
  rationale: טַף குடும்பத்தின் இளைய, சார்ந்திருக்கும் குழந்தைகளைக் குறிக்கிறது; ‘சிறு குழந்தைகள்’ என்பது கைக்குழந்தைகள் மட்டுமென பொருளைக் குறுக்காமல் வயதுச் சிறுமையை வெளிப்படுத்துகிறது. גַּם என்பதன் சேர்க்கைப் பொருள் ‘-உம்’ வழியாகக் காட்டப்படுகிறது.
- source_word: נְשֵׁיהֶם
  choice: மனைவிகளும்
  rationale: இந்தக் குடும்பப் பட்டியலில் נָשִׁים என்ற சொல் உடைமைப் பின்னொட்டுடன் வருவதால் ‘மனைவிகள்’ என்பதே சூழலுக்கு ஏற்ற பொருள்.
- source_word: וּ/בְנֵיהֶם
  choice: பிள்ளைகளும்
  rationale: בָּנִים என்பது குறிப்பாக ‘மகன்கள்’ என்றும், விரிவாக ‘பிள்ளைகள்/சந்ததி’ என்றும் பொருள்படலாம். முதன்மை உரையில் இயல்பான விரிவான பொருள் தரப்பட்டு, குறிப்பான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: எபிரெய உரையில் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப் பெயரே நேரடியாக வருகிறது. அதை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் வழக்கமான ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயரைப் பாதுகாக்கிறது.
- issue: וּבְנֵיהֶם என்பதிலுள்ள பாலின/குடும்பப் பொருள்
  choice: பிள்ளைகளும்
  alternative: மகன்களும்
  rationale: בָּנִים ஆண் பிள்ளைகளைத் தனிப்படக் குறிக்கக்கூடும்; குடும்பம் அல்லது சந்ததி குறித்த சூழல்களில் பொதுவாகப் பிள்ளைகளையும் குறிக்கலாம். சூழலை முன்னிட்டு ‘பிள்ளைகள்’ முதன்மை உரையில் வைக்கப்பட்டாலும், உண்மையான சொற்பொருள் ஐயம் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நின்றுகொண்டிருந்தார்கள்’ தொடர்நிலையை வெளிப்படுத்துகிறது. பட்டியலை தனி வாக்கியத் தொடராக அமைத்தது தமிழின் இயல்பையும், சபையில் குடும்பத்தின் அனைத்து பிரிவினரும் இருந்தனர் என்ற மூலத்தின் வலியுறுத்தலையும் காக்கிறது.
