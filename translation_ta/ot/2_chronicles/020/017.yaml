  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. நேரடி அழைப்புகளுக்கு ‘யூதாவே, எருசலேமே’ என்றும், பன்மை மரியாதை/கூட்டுக் கட்டளைகளுக்கு ‘-ங்கள்’ வடிவமும் பயன்படுத்தப்பட்டுள்ளன. எபிரெயத்தின் தொடர்ச்சியான கட்டளைகள் மற்றும் வினையற்ற இறுதி உறுதிமொழியின் ambiguity பாதுகாக்கப்பட்டுள்ளது.
