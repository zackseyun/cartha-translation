  text: לֹ֥א לָ/כֶ֖ם לְ/הִלָּחֵ֣ם בָּ/זֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּ/רְא֣וּ אֶת יְשׁוּעַת֩ יְהוָ֨ה עִמָּ/כֶ֜ם יְהוּדָ֣ה וִֽ/ירוּשָׁלִַ֗ם אַל תִּֽירְאוּ֙ וְ/אַל תֵּחַ֔תּוּ מָחָר֙ צְא֣וּ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
translation:
  language: ta
  text: இந்தப் போரில் நீங்கள் போரிட வேண்டியதில்லை. உங்கள் இடங்களில் நில்லுங்கள்; அசையாமல் நின்று, யூதாவே, எருசலேமே, உங்களோடு இருக்கும் யாவேயின் மீட்பைக் காணுங்கள்.[a] அஞ்சாதீர்கள், கலங்காதீர்கள். நாளை அவர்களுக்கு முன்பாகப் புறப்பட்டுச் செல்லுங்கள்; யாவே உங்களோடு இருக்கிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் இரட்சிப்பைக் காணுங்கள்.” எபிரெயச் சொல் இங்கு போரிலிருந்து கிடைக்கும் மீட்பையும், விரிவான பொருளில் இரட்சிப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவே உங்களோடு இருப்பார்.” எபிரெய வாக்கியத்தில் வெளிப்படையான வினைச்சொல் இல்லை; எனவே இதை நிகழ்கால அல்லது எதிர்கால உறுதிமொழியாகப் புரிந்துகொள்ளலாம்.
    reason: grammatical_ambiguity
