  choice: இந்தப் போரில் நீங்கள் போரிட வேண்டியதில்லை
  rationale: ‘இதில் போரிடுவது உங்களுக்குரியது அல்ல’ என்ற எபிரெயச் சொல்லமைப்பை, இந்தப் போரில் அவர்கள் போரிடத் தேவையில்லை என்ற சூழல்சார் பொருளுடன் இயல்பான தமிழில் தருகிறது.
- source_word: הִתְיַצְּבוּ עִמְדוּ
  choice: அணிவகுத்து நில்லுங்கள்; அசையாமல் நின்று
  rationale: முதல் கட்டளை உறுதியான இடத்தை எடுத்துக்கொள்வதையும், அடுத்தது அங்கே நிலைத்து நிற்பதையும் வலியுறுத்துகிறது; இரு தனித்த கட்டளைகளின் அழுத்தமும் காக்கப்படுகிறது.
- source_word: וּרְאוּ אֶת יְשׁוּעַת יְהוָה
  choice: யாவேயின் மீட்பைக் காணுங்கள்
  rationale: יְשׁוּעָה இச்சூழலில் போரிலிருந்து விடுவித்தலைக் குறிக்கிறது. ‘மீட்பு’ அந்த உடனடி பொருளை இயல்பாகத் தருவதோடு சொல்லின் விரிவான இரட்சிப்பு சார்ந்த பொருளையும் முற்றிலும் நீக்குவதில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עִמָּכֶם
  choice: உங்களோடு
  rationale: עם இங்கு உடனிருப்பையும் ஆதரவையும் குறிக்கிறது; இரு இடங்களிலும் நேரடியான இணைப்பைத் தக்கவைக்கிறது.
- source_word: יְהוּדָה וִירוּשָׁלִַם
  choice: யூதாவே, எருசலேமே
  rationale: இவை நேரடி அழைப்புகள் என்பதைத் தமிழ் விளிவேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: அஞ்சாதீர்கள், கலங்காதீர்கள்
  rationale: பயப்படுவதையும் மனம் உடைந்து திகைப்பதையும் தடைசெய்யும் இணையான இரு எபிரெயக் கட்டளைகளையும் சுருக்கமான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: מָחָר צְאוּ לִפְנֵיהֶם
  choice: நாளை அவர்களுக்கு முன்பாகப் புறப்பட்டுச் செல்லுங்கள்
  rationale: לִפְנֵי என்பதன் ‘முன்பாக’ என்ற இடவியல் சொல்லைத் தக்கவைத்து, போர்ச் சூழலில் எதிரிகளைச் சந்திக்கச் செல்வதை வாசகர் உணர இடமளிக்கிறது.
- source_word: וַיהוָה עִמָּכֶם
  choice: யாவே உங்களோடு இருக்கிறார்
  rationale: எபிரெயில் வெளிப்படையான வினைச்சொல் இல்லாத வாக்கியத்தை நிகழ்கால உறுதிமொழியாக இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: יְשׁוּעַת יְהוָה என்பதன் பொருள் வரம்பு
  choice: யாவேயின் மீட்பு
  alternative: யாவேயின் இரட்சிப்பு
  rationale: உடனடி சூழல் போரிலிருந்து கிடைக்கும் விடுதலையை முன்னிறுத்துகிறது; ‘மீட்பு’ அதனைத் தெளிவாகத் தருகிறது. அதேவேளை சொல்லின் விரிவான ‘இரட்சிப்பு’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: וַיהוָה עִמָּכֶם என்ற வினையற்ற வாக்கியத்தின் காலம்
  choice: யாவே உங்களோடு இருக்கிறார்
  alternative: யாவே உங்களோடு இருப்பார்
  rationale: எபிரெயில் காலத்தைக் குறிக்கும் வெளிப்படையான வினை இல்லை. நிகழ்காலம் தொடர்ந்த தெய்வீக உடனிருப்பைச் சொல்கிறது; வரவிருக்கும் போரைக் கருத்தில் கொண்ட எதிர்கால வாசிப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
