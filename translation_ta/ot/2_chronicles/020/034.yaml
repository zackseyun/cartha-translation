- from: யோசபாத்தின் தொடக்கக்காலச் செயல்களும் பிற்காலச் செயல்களும் உள்ளிட்ட மற்ற செயல்கள், இதோ, அனானியின் மகன் யெகூவின் பதிவுகளில்[a] எழுதப்பட்டுள்ளன; அந்தப் பதிவுகள் இஸ்ரவேலின் அரசர்களுடைய புத்தகத்தில் சேர்க்கப்பட்டுள்ளன.[b]
  to: யோசபாத்தின் மற்ற செயல்கள், முதல் முதல் கடைசி வரை, இதோ, அனானியின் மகன் யெகூவின் பதிவுகளில்[a] எழுதப்பட்டுள்ளன; அவற்றை அவர் இஸ்ரவேலின் அரசர்களின் புத்தகத்தில் சேர்த்தார்.[b]
  rationale: ‘முதல் முதல் கடைசி வரை’ என்பது ‘முதலானவையும் கடைசியானவையும்’ என்ற எபிரெய இணைச்சொற்றொடரின் முழுமைப் பொருளைத் தமிழில் இயல்பாகக் காக்கிறது. இறுதிப் பிரிவில் ‘அவற்றை அவர் ... சேர்த்தார்’ என்று அமைத்ததால், யெகூவைச் சுட்டும் ஒருமை வினைச்சொல் பிரதிபலிக்கிறது; அதேவேளை הֹעֲלָה עַל என்ற அரிதான சொல்லாட்சியின் துல்லியமான செயல்முறை அடிக்குறிப்பில் எச்சரிக்கையுடன் விளக்கப்படுகிறது.
