  source_fidelity: 'முதன்மை வாக்கியத்தில் ‘தொடக்கக்காலச் செயல்களும் பிற்காலச் செயல்களும் உள்ளிட்ட மற்ற செயல்கள்’ என்பது எபிரெயத்தின் ‘மற்ற செயல்கள், முதலானவையும் கடைசியானவையும்’ என்ற அமைப்பை மாற்றுகிறது: தொடக்கமும் பிற்காலமும் ‘மற்ற செயல்களில்’ சேரும் ஒரு துணைப்பிரிவாக அல்ல, யோசபாத்தின் செயல்களின் முழுமையைச் சுட்டும் இணைச்சொற்றொடராக உள்ளன. மேலும் אֲשֶׁר הֹעֲלָה என்ற ஆண்பால் ஒருமை வினை இயல்பாக யெகூவைச் சுட்டுகிறது; தமிழில் அதைத் தெளிவாகக் காட்டுவது நல்லது.'
  naturalness: திருத்தப்பட்ட உரை நவீனத் தரத் தமிழில் வரலாற்று ஆதாரக் குறிப்புக்கேற்ற இயல்பான, கண்ணியமான நடையைப் பேணுகிறது. ‘இதோ’ எபிரெய வலியுறுத்தலைக் காக்கிறது; ‘முதல் முதல் கடைசி வரை’ அதே முழுமைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
