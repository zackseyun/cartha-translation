source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י יְהוֹשָׁפָ֔ט הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֗ים בְּ/דִבְרֵי֙ יֵה֣וּא בֶן חֲנָ֔נִי אֲשֶׁ֣ר הֹֽעֲלָ֔ה עַל סֵ֖פֶר מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: The rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
translation:
  language: ta
  text: யோசபாத்தின் மற்ற செயல்கள், முதல் முதல் கடைசி வரை, இதோ, அனானியின் மகன் யெகூவின் பதிவுகளில்[a] எழுதப்பட்டுள்ளன; அவற்றை அவர் இஸ்ரவேலின் அரசர்களின் புத்தகத்தில் சேர்த்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அனானியின் மகன் யெகூவின் வார்த்தைகளில்.” இச்சூழலில் இது யெகூ எழுதிய பதிவுகள் அல்லது வரலாற்றுக் குறிப்புகளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “அவர் இஸ்ரவேலின் அரசர்களின் புத்தகத்தின்மேல் ஏற்றினார்” என்று உள்ளது. இங்கு வரும் அரிதான சொற்றொடர், யெகூவின் பதிவுகளை அந்தப் பெரிய அரச வரலாற்று நூலில் சேர்த்தார் அல்லது உள்ளடக்கினார் என்பதைக் குறிக்கும்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: யோசபாத்தின் ... மற்ற செயல்கள்
  rationale: அரசரின் ஆட்சியைச் சுருக்கிக் கூறும் சூழலில் דִּבְרֵי என்பது வெறும் சொற்களை அல்ல, செயல்களையும் ஆட்சிக்கால நிகழ்வுகளையும் குறிக்கிறது; וְיֶתֶר என்பதற்கு இயல்பான தமிழாக ‘மற்ற’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: தொடக்கக்காலச் செயல்களும் பிற்காலச் செயல்களும்
  rationale: யோசபாத்தின் ஆட்சிக்காலம் முழுவதையும் உள்ளடக்கும் இணைச்சொற்றொடரின் பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הִנָּם כְּתוּבִים
  choice: இதோ, ... எழுதப்பட்டுள்ளன
  rationale: הִנָּם என்பதன் சுட்டிக்காட்டும் வலியுறுத்தலை ‘இதோ’ காக்கிறது; כְּתוּבִים என்பதற்கு நேரான ‘எழுதப்பட்டுள்ளன’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  choice: அனானியின் மகன் யெகூவின் பதிவுகளில்
  rationale: இங்கு דִּבְרֵי ஒரு எழுத்து ஆதாரத்தைக் குறிப்பதால் ‘பதிவுகள்’ என்பது ‘வார்த்தைகள்’ என்பதைக் காட்டிலும் சூழலுக்குப் பொருத்தமானது; பெயர்கள் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: அந்தப் பதிவுகள் இஸ்ரவேலின் அரசர்களுடைய புத்தகத்தில் சேர்க்கப்பட்டுள்ளன
  rationale: சொல்லுக்கு சொல் மொழிபெயர்த்தால் தெளிவில்லாத ‘புத்தகத்தின் மேல் ஏற்றப்பட்டது’ என்ற உருவகத்தை, பெரிய அரச வரலாற்று நூலில் பதிவு இணைக்கப்பட்டிருந்ததைக் குறிக்கும் இயல்பான தமிழில் தருகிறது; மூலத்தின் செயல்பாட்டுவினை வடிவும் காக்கப்படுகிறது.
theological_decisions:
- issue: யெகூவின் பதிவு மற்றும் ‘இஸ்ரவேலின் அரசர்களுடைய புத்தகம்’ ஆகியவற்றின் தொடர்பு
  choice: யெகூவின் பதிவுகள் அந்தப் புத்தகத்தில் சேர்க்கப்பட்டுள்ளன
  alternative: யெகூ அந்தப் புத்தகத்தில் குறிப்பிடப்பட்டுள்ளார்
  rationale: הֹעֲלָה עַל என்ற அரிதான தொடர் இருவிதமாகப் புரிந்துகொள்ளப்படலாம். உடனடியான சூழல் எழுதப்பட்ட ஆதாரத்தைப் பற்றிப் பேசுவதால், பதிவுகள் பெரிய நூலில் இணைக்கப்பட்டன என்ற பொருள் முதன்மை உரையில் எடுக்கப்பட்டுள்ளது; வேறுபொருள் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வரலாற்றுச் சுருக்கத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இதோ’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; அரிதான ஆவணத் தொடர்பு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
