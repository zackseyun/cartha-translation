  source_fidelity: 'கருத்துப்படி வரைவு எபிரெய மூலத்தைச் சரியாகப் பின்பற்றுகிறது: அம்மோனும் மோவாபும் சேயீரின் குடியிருப்போருக்கு எதிராகத் திரும்புதல், חרם மற்றும் השמיד ஆகிய இரட்டை அழிப்பு மொழி, பின்னர் நிகழும் பரஸ்பர அழிவு ஆகியவை அனைத்தும் உள்ளன. ஆனால் முதல் வாக்கியத்தில் நோக்கத்தைக் குறிக்கும் சொற்றொடர்கள் ‘எழுந்தார்கள்’ என்பதற்கு முன் வருவதால், செயல் வரிசை தற்காலிகமாகத் தெளிவிழக்கிறது. அவற்றை எதிர்ப்புச் செயலுக்குப் பின் அமைப்பது மூலத்தின் தொடர்பைத் தெளிவாகக் காட்டும்.'
  naturalness: ‘சேயீர் மலைப்பகுதியில் குடியிருந்தவர்களுக்கு எதிராக எழுந்து’ மற்றும் ‘ஒருவரையொருவர் அழித்துக்கொள்ள உதவினார்கள்’ என்பவை நவீனத் தரத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளன. ‘துணைபோனார்கள்’ என்பதற்குப் பதிலாக ‘உதவினார்கள்’ பரஸ்பர உதவியை நேரடியாகக் குறிக்கிறது.
  terminology: அம்மோனியர், மோவாபியர், சேயீர் ஆகிய பெயர்கள் பொருத்தமானவை. ‘அழிவுக்கென்று அர்ப்பணித்து’ என்பது חרם-இன் தனித்துவமான அழிவுக்கான ஒதுக்கீட்டு நிழற்பொருளைத் தக்கவைக்கிறது; ‘முற்றிலும் அழித்தொழிக்க’ השמיד-இன் வலிமையையும் வேறுபாட்டையும் காக்கிறது. அடிக்குறிப்பு மாற்றுச் சொல்லைச் சற்றுத் தெளிவுபடுத்துகிறது.
