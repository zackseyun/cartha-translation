base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
translation:
  language: ta
  text: அப்போது அம்மோனியரும் மோவாபியரும் சேயீர் மலைப்பகுதியில் குடியிருந்தவர்களுக்கு எதிராக எழுந்து, அவர்களை அழிவுக்கென்று அர்ப்பணித்து முற்றிலும் அழித்தொழிக்கச் சென்றார்கள். சேயீர் மக்களை அழித்து முடித்ததும், அவர்கள் ஒருவரையொருவர் அழித்துக்கொள்ள உதவினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַמְדוּ ... עַל
  choice: அவர்களுக்கு எதிராக எழுந்தார்கள்
  rationale: עמד என்பதன் அடிப்படைப் பொருள் ‘நிற்றல்’ என்றாலும், עַל உடன் வரும் இந்தப் போர்ச் சூழலில் பகைமையுடன் எதிர்த்து எழுவதைக் குறிக்கிறது.
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  choice: அம்மோனியரும் மோவாபியரும்
  rationale: ‘அம்மோனின் புத்திரர்’ என்ற சொற்சொல்லான வடிவத்தைவிட, இங்கு குறிக்கப்படும் இனக்குழுக்களை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יֹשְׁבֵי הַר שֵׂעִיר
  choice: சேயீர் மலைப்பகுதியில் குடியிருந்தவர்கள்
  rationale: יֹשְׁבֵי என்பது அங்கு குடியிருப்பவர்களைக் குறிக்கிறது; הַר என்பது இச்சூழலில் மலை அல்லது மலைப்பகுதி எனப் பொருள்படக்கூடும். ‘மலைப்பகுதி’ இயல்பாகவும் புவியியல் பரப்பையும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: לְהַחֲרִים
  choice: அழிவுக்கென்று அர்ப்பணித்து
  rationale: חרם என்பது சாதாரணமாகக் கொல்வதை மட்டும் அல்லாமல், தடையாணைக்குட்படுத்தி அழிவுக்கென ஒதுக்கும் வழிபாட்டு மற்றும் போர் சார்ந்த கனத்த பொருளையும் கொண்டது.
- source_word: וּלְהַשְׁמִיד
  choice: முற்றிலும் அழித்தொழிப்பதற்காக
  rationale: שׁמד குறிக்கும் முழுமையான ஒழிப்பைத் தெளிவாகத் தருவதோடு, முந்தைய חרם என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: וּכְכַלּוֹתָם
  choice: அழித்து முடித்ததும்
  rationale: 'כְּ உடன் வரும் infinitive construct இங்கு காலத் தொடர்பைக் காட்டுகிறது: அவர்கள் சேயீர் மக்களைக் குறித்து செய்து முடித்ததும் அடுத்த செயல் நிகழ்ந்தது.'
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ לְמַשְׁחִית
  choice: அவர்கள் ஒருவரையொருவர் அழித்துக்கொள்ளத் துணைபோனார்கள்
  rationale: ‘ஒவ்வொருவனும் தன் தோழனோடு/தோழனுக்கு அழிப்பதற்குத் துணைசெய்தான்’ என்ற எபிரெயப் பரஸ்பர அமைப்பை இயல்பான தமிழில் தருகிறது; சூழல் அவர்களுக்குள்ளேயே ஏற்பட்ட பரஸ்பர அழிவைக் காட்டுகிறது.
theological_decisions:
- issue: போர்ச் சூழலில் חרם என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: அழிவுக்கென்று அர்ப்பணித்து
  alternative: அழிவுத் தடையின்கீழ் வைத்து; முற்றிலும் அழித்து
  rationale: இச்சொல்லில் சாதாரண அழிப்பைத் தாண்டிய, அழிவுக்கென ஒதுக்கப்படும் வழிபாட்டு-உடன்படிக்கை சார்ந்த நிழற்பொருள் உள்ளது. முதன்மை மொழிபெயர்ப்பு அந்தக் கனத்தை அணுகத்தக்க தமிழில் காக்கிறது; மேலும் சொற்சொல்லான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்றுப் போர்ச்சூழலுக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. חרם என்பதன் தனித்த இறையியல் நிழற்பொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
