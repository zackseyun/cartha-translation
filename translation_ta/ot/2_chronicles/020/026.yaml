  text: וּ/בַ/יּ֣וֹם הָ/רְבִעִ֗י נִקְהֲלוּ֙ לְ/עֵ֣מֶק בְּרָכָ֔ה כִּי שָׁ֖ם בֵּרֲכ֣וּ אֶת יְהוָ֑ה עַל כֵּ֡ן קָֽרְא֞וּ אֶת שֵׁ֨ם הַ/מָּק֥וֹם הַ/ה֛וּא עֵ֥מֶק בְּרָכָ֖ה עַד הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
translation:
  language: ta
  text: நான்காம் நாளில் அவர்கள் பெராக்கா பள்ளத்தாக்கில்[a] ஒன்றுகூடினார்கள்; ஏனெனில் அங்கே அவர்கள் யாவேவை வாழ்த்தினார்கள். ஆகையால் அந்த இடத்துக்கு “பெராக்கா பள்ளத்தாக்கு” என்று பெயரிட்டார்கள்; இன்றுவரை அதுவே அதன் பெயராக உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பெராக்கா” என்பதற்கு “ஆசீர்வாதம்” என்று பொருள். இது யாவேவை அவர்கள் “வாழ்த்தினார்கள்” என்ற சொல்லுடன் தொடர்புடையது.
    reason: בְּרָכָה என்பதன் நேரடியான பொருளைத் துல்லியமாகத் தருவதோடு, அதே எபிரெய வேர் சார்ந்த வசனத்தின் சொல்விளையாட்டையும் விளக்குகிறது.
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: நிஃபால் வடிவம் இங்கு மக்கள் தாமாக ஒரே இடத்தில் கூடிவந்ததைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் மூலத்தின் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: עֵמֶק בְּרָכָה
  choice: பெராக்கா பள்ளத்தாக்கு
  rationale: இடப்பெயரில் בְּרָכָה ஒலிபெயர்க்கப்பட்டு, עֵמֶק ‘பள்ளத்தாக்கு’ என மொழிபெயர்க்கப்படுகிறது. பெயரின் ‘வாழ்த்து/ஆசீர்வாதம்’ என்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי שָׁם בֵּרֲכוּ אֶת יְהוָה
  choice: ஏனெனில் அங்கே அவர்கள் யாவேவை வாழ்த்தினார்கள்
  rationale: כִּי என்பதன் காரணப் பொருளை ‘ஏனெனில்’ தெளிவாகக் காட்டுகிறது. בֵּרֲכוּ என்பதற்கு ‘வாழ்த்தினார்கள்’ எனத் தேர்ந்தெடுத்து, இடப்பெயரான בְּרָכָה உடனான சொல்விளையாட்டைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெயத் தனிப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: அந்த இடத்துக்கு … என்று பெயரிட்டார்கள்
  rationale: எபிரெய மொழிமரபின் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַד הַיּוֹם
  choice: இன்றுவரை அதுவே அதன் பெயராக உள்ளது
  rationale: பெயர் எழுத்தாளரின் காலம்வரை தொடர்ந்ததைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தெளிவான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயரான நான்கு எழுத்துத் திருப்பெயர் நேரடியாக உள்ளது. ஆகவே பட்டப்பெயரைப் பதிலிடாமல் அதன் பொதுவாக ஏற்கப்பட்ட ஒலிப்பைத் தமிழில் தருகிறது.
- issue: בֵּרֲכוּ என்பதன் பொருள்
  choice: வாழ்த்தினார்கள்
  alternative: ஆசீர்வதித்தார்கள்; போற்றினார்கள்
  rationale: ‘வாழ்த்தினார்கள்’ என்பது கடவுளை நோக்கிய மனிதர்களின் செயலை இயல்பாகச் சொல்வதோடு, בְּרָכָה என்ற இடப்பெயருடனான ஒரே வேர் சார்ந்த தொடர்பையும் பேணுகிறது. ‘ஆசீர்வதித்தார்கள்’ மூலச்சொல்லுக்கு வடிவரீதியாக நெருக்கமானாலும், நவீன தமிழில் கடவுள் மனிதரை ஆசீர்வதிப்பதையே முதன்மையாக உணர்த்தக்கூடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இடப்பெயர் ஒலிபெயர்க்கப்பட்டு அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; இறைத் திருப்பெயர் ‘யாவே’ என வழங்கப்பட்டுள்ளது.
