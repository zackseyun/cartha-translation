base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
translation:
  language: ta
  text: அப்போது யோசபாத் முகம் தரையை நோக்கிக் குனிந்து வணங்கினார்; யூதா மக்கள் அனைவரும் எருசலேமில் குடியிருப்போரும் யாவேக்கு முன்பாகத் தரையில் விழுந்து, யாவேவை வழிபட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “யாவேக்கு முன்பாக விழுந்து, யாவேவைப் பணிந்து வணங்கினார்கள்.”'
    reason: לְהִשְׁתַּחֲוֺת என்பது ‘வழிபடுதல்’ என்றும் உடலைத் தாழ்த்தி ‘பணிந்து வணங்குதல்’ என்றும் பொருள்படக்கூடிய சொல்; மாற்று மொழிபெயர்ப்பு அதன் உடல் சார்ந்த நுணுக்கத்தை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: וַיִּקֹּד אַפַּיִם אָרְצָה
  choice: தரைமட்டும் முகங்குனிந்து வணங்கினார்
  rationale: קָדַד என்பது மரியாதையுடன் குனிவதைக் குறிக்கிறது; אַפַּיִם אָרְצָה என்ற சொற்றொடர் முகம் தரையை நோக்கும் ஆழ்ந்த வணக்கநிலையைத் தெரிவிக்கிறது. தமிழ் வழக்கில் இயல்பாகவும் காட்சித்தன்மையுடனும் இரண்டையும் இணைக்கிறது.
- source_word: וְכָל יְהוּדָה
  choice: யூதா மக்கள் அனைவரும்
  rationale: இங்கு ‘யூதா’ என்பது நாட்டையோ கோத்திரத்தையோ மட்டும் அல்லாமல் அதன் மக்களைக் கூட்டாகக் குறிக்கிறது; தமிழில் பொருள் தெளிவாக இருக்க ‘மக்கள்’ சேர்க்கப்பட்டது.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: எருசலேமின் குடியிருப்போரும்
  rationale: יֹשְׁבֵי என்பது அங்கே வசிப்பவர்களைக் குறிக்கும்; ‘குடியிருப்போர்’ நவீன, தெளிவான தமிழாக்கம்.
- source_word: נָפְלוּ לִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாகத் தரையில் விழுந்து
  rationale: נפל என்ற வினையின் நேரடியான உடல் செயலைப் பாதுகாக்கிறது; வழிபாட்டுச் சூழலில் இது பணிந்து வீழ்வதைக் குறித்தாலும், அடுத்த வினை அதன் நோக்கத்தைத் தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְהִשְׁתַּחֲוֺת לַיהוָה
  choice: யாவேவை வழிபட்டார்கள்
  rationale: השתחוה என்பதன் உடல் சார்ந்த ‘பணிந்து வணங்குதல்’ என்ற கருத்தை முன் வரும் ‘விழுந்து’ ஏற்கெனவே வெளிப்படுத்துகிறது; இங்கு நோக்கமான வழிபாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் இருமுறை இடம்பெறுகிறது. அதைக் ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் பெயரையும் அதன் மறுபயன்பாட்டையும் பாதுகாக்கிறது.
- issue: וַיִּקֹּד மற்றும் נָפְלוּ...לְהִשְׁתַּחֲוֺת ஆகிய செயல்களின் வேறுபாடு
  choice: யோசபாத் முகங்குனிந்து வணங்கினார்; மக்கள் தரையில் விழுந்து வழிபட்டார்கள்
  alternative: அனைவரும் ஒரேபோல் சாஷ்டாங்கமாக விழுந்து வணங்கினார்கள்
  rationale: எபிரேயம் யோசபாத்தின் குனிதலுக்கும் மக்களின் விழுதலுக்கும் வெவ்வேறு வினைகளைப் பயன்படுத்துகிறது. அவற்றை ஒன்றாக்காமல் செயல்வேறுபாட்டைப் பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழ்; மரியாதையும் வேதாகமச் செறிவும் காக்கப்பட்டுள்ளன. ‘சாஷ்டாங்கம்’ போன்ற சமயமரபுச் சிறப்புச் சொற்களைத் தவிர்த்து, சாதாரண வாசகருக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டன. வசனத்தின் இரு பகுதிகளிலும் வரும் இறைப் பெயர் மீண்டும் வழங்கப்பட்டுள்ளது.
