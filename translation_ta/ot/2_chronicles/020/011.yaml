source:
  edition: WLC
  text: וְ/הִ֨נֵּה הֵ֔ם גֹּמְלִ֖ים עָלֵ֑י/נוּ לָ/בוֹא֙ לְ/גָ֣רְשֵׁ֔/נוּ מִ/יְּרֻשָּׁתְ/ךָ֖ אֲשֶׁ֥ר הֽוֹרַשְׁתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/011.yaml
  text: And behold[a], they are repaying us by coming to drive us out of your possession, which you gave us as an inheritance.
translation:
  language: ta
  text: 'இதோ, அவர்கள் எங்களுக்குச் செய்யும் கைம்மாறு இதுதான்: நீர் எங்களுக்குச் சுதந்தரமாகக் கொடுத்த உமது உடைமையிலிருந்து எங்களைத் துரத்திவிட வருகிறார்கள்!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: தற்போதைய அநீதியான சூழ்நிலையைக் கடவுளின் கவனத்திற்குக் கொண்டுவரும் வலியுறுத்தலை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: הֵם
  choice: அவர்கள்
  rationale: தனி எழுவாய்ச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தக்கவைத்து, குற்றம் செய்பவர்களையே முன்னிறுத்துகிறது.
- source_word: גֹּמְלִים עָלֵינוּ
  choice: அவர்கள் எங்களுக்குச் செய்யும் கைம்மாறு
  rationale: முன்பு இஸ்ரவேல் அவர்களைத் தாக்காமல் விட்டதற்கு அவர்கள் இப்போது தரும் நன்றியற்ற பதிலை, மூலத்தின் நையாண்டித் தொனியுடன் வெளிப்படுத்துகிறது.
- source_word: לָבוֹא לְגָרְשֵׁנוּ
  choice: எங்களைத் துரத்திவிட வருவதுதான்
  rationale: அவர்கள் செய்யும் கைம்மாற்றின் நோக்கத்தையும் செயலையும் தெளிவாக இணைக்கிறது; גרשׁ என்பதன் வெளியேற்றுதல் என்ற வலிமையையும் காக்கிறது.
- source_word: מִיְּרֻשָּׁתְךָ
  choice: உமது உடைமையிலிருந்து
  rationale: நிலம் இறுதியில் கடவுளுடைய உடைமை என்பதையும், அது இஸ்ரவேலுக்குச் சுதந்தரமாக வழங்கப்பட்டது என்பதையும் அடுத்த சொற்றொடரிலிருந்து வேறுபடுத்திக் காட்டுகிறது.
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  choice: நீர் எங்களுக்குச் சுதந்தரமாகக் கொடுத்த
  rationale: இப்ரெய வினையின் causative பொருளை இயல்பான தமிழில் வழங்கி, இஸ்ரவேலின் நிலவுரிமை கடவுளால் அளிக்கப்பட்டது என்பதைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: நிலத்தின் மீதான கடவுளின் உரிமையும் இஸ்ரவேலுக்குக் கொடுக்கப்பட்ட சுதந்தரமும்
  choice: நீர் எங்களுக்குச் சுதந்தரமாகக் கொடுத்த உமது உடைமையிலிருந்து
  alternative: நீர் எங்களை உரிமையாக்கிய உமது சுதந்தரத்திலிருந்து
  rationale: முதன்மை வாசகம் நிலம் கடவுளுடையது என்பதையும், இஸ்ரவேல் அதை அவரிடமிருந்து சுதந்தரமாகப் பெற்றது என்பதையும் வேறுபடுத்திக் காக்கிறது. அதேவேளை, יְרֻשָּׁה என்பதற்கு ‘சுதந்தரம்’ என்ற நேரடியான மாற்றும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்தின் கண்ணியத்தையும் முறையீட்டின் தீவிரத்தையும் காக்கும் நடை. “நீர்/உமது” என்பவை கடவுளை நோக்கிய மரியாதை ஒருமையைத் தொடர்கின்றன; இறுதி வியப்புக்குறி மூலத்தில் உள்ள வலியுறுத்தலையும் நையாண்டி கலந்த வேதனையையும் இயல்பாக வெளிப்படுத்துகிறது.
