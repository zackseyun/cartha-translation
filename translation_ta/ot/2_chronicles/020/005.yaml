source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד יְהוֹשָׁפָ֗ט בִּ/קְהַ֧ל יְהוּדָ֛ה וִ/ירוּשָׁלִַ֖ם בְּ/בֵ֣ית יְהוָ֑ה לִ/פְנֵ֖י הֶ/חָצֵ֥ר הַ/חֲדָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/005.yaml
  text: And Jehoshaphat stood in the assembly of Judah and Jerusalem[a], in the house of Yahweh, before the new court.
translation:
  language: ta
  text: யோசபாத், யூதா மற்றும் எருசலேம் மக்களின் சபையில், யாவேயின் ஆலயத்தில், புதிய முற்றத்திற்கு முன்பாக[a] நின்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புதிய பிராகாரத்திற்கு முன்பாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: நின்றார்
  rationale: עמד இங்கு தொடர்கதைப் பாணியில் நிகழ்ந்த எளிய இறந்தகாலச் செயலைக் குறிக்கிறது. ‘நின்றார்’ என்பது இயல்பான, சுருக்கமான தமிழாக்கம்; ‘எழுந்து நின்றார்’ என விரிவாக்குவது மூலத்தில் வெளிப்படையாக இல்லாத நுணுக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: בִּקְהַל יְהוּדָה וִירוּשָׁלַם
  choice: யூதாவையும் எருசலேமையும் சேர்ந்த மக்கள் கூடியிருந்த சபையில்
  rationale: קהל என்பது ஒன்றுகூடிய மக்கள் சபையைக் குறிக்கிறது. இடப்பெயர்களை மட்டும் இணைத்துச் சொல்வதால் தமிழில் உருவாகும் தெளிவின்மையைத் தவிர்க்க, அவை அந்தச் சபையைச் சேர்ந்த மக்களைக் குறிக்கும் பொருள் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது; ב என்பதன் ‘சபையில்’ என்ற இடப்பொருளும் காக்கப்பட்டுள்ளது.
- source_word: בְּבֵית יְהוָה
  choice: யாவேயின் ஆலயத்தில்
  rationale: எபிரெயில் சொற்பட ‘யாவேயின் வீட்டில்’ என்றாலும், இச்சூழலில் அது எருசலேம் ஆலயத்தைக் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் இருக்க ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்து இறைப்பெயர் ஒரு பட்டமாக மாற்றப்படாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இங்கு spatial relation-ஐக் குறிக்கும் לִפְנֵי, இயல்பான தமிழில் ‘முன்பாக’ என வழங்கப்பட்டுள்ளது.
- source_word: הֶחָצֵר הַחֲדָשָׁה
  choice: புதிய முற்றம்
  rationale: חָצֵר என்பது ஆலய வளாகத்திலுள்ள திறந்த முற்றம் அல்லது பிராகாரத்தைக் குறிக்கலாம். பொதுவாசகர்களுக்கு எளிதில் புரியும் ‘முற்றம்’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டு, ஆலயச் சூழலுக்குரிய ‘பிராகாரம்’ அடிக்குறிப்பில் மாற்றாகக் கொடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் பொதுப் பட்டம் அல்லாமல் நான்கு எழுத்து தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே தனிப்பெயரின் தன்மை காக்கப்பட்டு ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வழிபாட்டு நிகழ்வுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இடவமைப்புகள் அதே வரிசையில் பெருமளவு காக்கப்பட்டுள்ளன; தமிழில் இயல்புக்காக ‘யூதாவையும் எருசலேமையும் சேர்ந்த மக்கள்’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு அது விளக்கும் ‘புதிய முற்றம்’ என்பதற்குப் பின்பே இடப்பட்டுள்ளது.
