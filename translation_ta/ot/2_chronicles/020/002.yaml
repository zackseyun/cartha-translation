translation_notes:
  register: நவீன நிலையான தமிழ்; அரசனிடம் உரையாடுவதால் மரியாதைப் பன்மையான ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. செய்தி அறிவிப்பின் அவசரத்தையும் வசனத்தின் வரலாற்று-இடவியல் தன்மையையும் காக்கும் கண்ணியமான, எளிதில் புரியும் நடை.
