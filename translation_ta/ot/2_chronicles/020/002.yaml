revisions:
- from: 'அப்போது சிலர் வந்து யோசபாத்திடம் அறிவித்தார்கள்: “கடலுக்கு அப்பாலிருந்து, அராமிலிருந்து, ஒரு பெரும் கூட்டம் உமக்கு எதிராக வந்துகொண்டிருக்கிறது; இதோ, அவர்கள் அசசோன்-தாமாரில் இருக்கிறார்கள்; அதுவே என்கேதி.”'
  to: 'அப்போது அவர்கள் வந்து யோசபாத்திடம் அறிவித்தார்கள்: “கடலுக்கு அப்பாலிருந்து, அராமிலிருந்து, ஒரு பெரும் கூட்டம் உமக்கு எதிராக வந்துகொண்டிருக்கிறது; இதோ, அவர்கள் ஹட்சத்சோன்-தாமாரில் இருக்கிறார்கள்; அதாவது, ஏன்-கெதி.”'
  rationale: The revision removes an unsupported limitation on the messengers, retains the Hebrew narrative sequence and urgency, preserves the potentially geographically difficult wording 'from beyond the sea, from Aram' without harmonization, and uses clearer Hebrew-based forms for the place names. The appositional identification is rendered explicitly and naturally as 'அதாவது, ஏன்-கெதி.'
