source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ וַ/יַּגִּ֤ידוּ לִֽ/יהוֹשָׁפָט֙ לֵ/אמֹ֔ר בָּ֣א עָלֶ֜י/ךָ הָמ֥וֹן רָ֛ב מֵ/עֵ֥בֶר לַ/יָּ֖ם מֵ/אֲרָ֑ם וְ/הִנָּ/ם֙ בְּ/חַֽצְצ֣וֹן תָּמָ֔ר הִ֖יא עֵ֥ין גֶּֽדִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/002.yaml
  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
translation:
  language: ta
  text: 'அப்போது அவர்கள் வந்து யோசபாத்திடம் அறிவித்தார்கள்: “கடலுக்கு அப்பாலிருந்து, அராமிலிருந்து, ஒரு பெரும் கூட்டம் உமக்கு எதிராக வந்துகொண்டிருக்கிறது; இதோ, அவர்கள் ஹட்சத்சோன்-தாமாரில் இருக்கிறார்கள்; அதாவது, ஏன்-கெதி.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ וַיַּגִּידוּ
  choice: அப்போது சிலர் வந்து ... அறிவித்தார்கள்
  rationale: தொடர்ச்சியான நிகழ்வை இயல்பான தமிழ் நடையில் காட்டுகிறது. எபிரெயத்தில் எழுவாய் வெளிப்படையாக இல்லாததால், சூழலுக்கேற்ற பொதுவான ‘சிலர்’ பயன்படுத்தப்பட்டது.
- source_word: בָּא עָלֶיךָ הָמוֹן רָב
  choice: ஒரு பெரும் கூட்டம் உமக்கு எதிராக வந்துகொண்டிருக்கிறது
  rationale: הָמוֹן רָב என்பதைக் குறிப்பாக ‘படை’ என்று மிகைப்படுத்தாமல் ‘பெரும் கூட்டம்’ எனத் தருகிறது; பகைமைச் சூழலில் עָלֶיךָ என்பது ‘உமக்கு எதிராக’ என இயல்பாகிறது. בָּא இங்கு நெருங்கிவரும் அச்சுறுத்தலைக் குறிக்கிறது.
- source_word: מֵעֵבֶר לַיָּם
  choice: கடலுக்கு அப்பாலிருந்து
  rationale: கடலின் மறுபக்கத்திலிருந்து என்ற இடவியல் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: מֵאֲרָם
  choice: அராமிலிருந்து
  rationale: பிற்காலப் பெயரான ‘சீரியா’ என்பதற்குப் பதிலாக எபிரெய இடப்பெயரான அராமை நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: וְהִנָּם
  choice: இதோ, அவர்கள்
  rationale: הִנֵּה வடிவின் உடனடி கவன ஈர்ப்பையும் செய்தியின் அவசரத்தையும் காக்கிறது.
- source_word: בְּחַצְצוֹן תָּמָר
  choice: அசசோன்-தாமாரில்
  rationale: இடப்பெயரை எபிரெய உச்சரிப்புக்கு அண்மையாக ஒலிபெயர்த்து, בְּ என்பதன் இடவியல் பொருளை ‘-இல்’ எனத் தருகிறது.
- source_word: הִיא עֵין גֶּדִי
  choice: அதுவே என்கேதி
  rationale: இரு இடப்பெயர்களும் ஒரே இடத்தைக் குறிக்கின்றன என்ற விளக்க அடையாளப்படுத்தலைத் தெளிவாகக் காட்டுகிறது.
