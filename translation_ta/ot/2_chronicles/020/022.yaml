source:
  edition: WLC
  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
translation:
  language: ta
  text: அவர்கள் மகிழ்ச்சிப் பாடல் பாடித் துதிக்கத் தொடங்கியபோது, யாவே, யூதாவுக்கு எதிராக வந்துகொண்டிருந்த[a] அம்மோனியர், மோவாபியர், சேயீர் மலைப்பகுதியினர் ஆகியோருக்கு எதிராகப் பதுங்குத் தாக்குதல்களை ஏற்படுத்தினார்[b]; அவர்கள் தோற்கடிக்கப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யூதாவுக்கு வந்துகொண்டிருந்த.” சூழலில் அவர்கள் பகைமையுடன் வந்தது தெளிவாக இருப்பதால், முதன்மை உரையில் “எதிராக” எனக் கொடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பதுங்கியிருப்பவர்களை வைத்தார்.” எபிரெயப் பங்கேற்புச் சொல் பதுங்கியிருக்கும் நபர்களையோ, பொதுவாகப் பதுங்குத் தாக்குதலையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  choice: அவர்கள் ... தொடங்கிய நேரத்தில்
  rationale: எபிரெய உரையின் காலத் தொடர்பையும், அவர்கள் தொடங்கிய தருணத்திலேயே அடுத்த நிகழ்வு நடந்ததையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְרִנָּה וּתְהִלָּה
  choice: மகிழ்ச்சிப் பாடலையும் துதியையும்
  rationale: רִנָּה என்பது மகிழ்ச்சி முழக்கம் அல்லது மகிழ்ச்சிப் பாடல் எனப் பொருள்படலாம்; வழிபாட்டுச் சூழலில் ‘மகிழ்ச்சிப் பாடல்’ இயல்பாக உள்ளது. תְהִלָּה என்பதற்கு ‘துதி’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: נָתַן ... מְאָרְבִים
  choice: பதுங்கித் தாக்குதல்களை ஏற்படுத்தினார்
  rationale: ‘பதுங்கியிருப்போரை/பதுங்குத் தாக்குதல்களை வைத்தார்’ என்ற எபிரெயச் சொற்றொடரை இயல்பான தமிழில் தருகிறது; மனிதத் தாக்குதலாளர்களா அல்லது பதுங்குத் தாக்குதல் நிகழ்வுகளா என்பதை முதன்மை உரை அளவுக்கு மீறித் தீர்மானிப்பதில்லை.
- source_word: בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  choice: அம்மோனியர், மோவாபியர், சேயீர் மலைநாட்டினர்
  rationale: மக்கள் குழுக்களைக் குறிக்கும் பட்டியலை நவீன தமிழில் தெளிவாகத் தருகிறது; ‘சேயீர் மலை’ என்பதை அப்பகுதி மக்களைக் குறிக்கும் இயல்பான வடிவில் வழங்குகிறது.
- source_word: הַבָּאִים לִיהוּדָה
  choice: யூதாவுக்கு எதிராக வந்துகொண்டிருந்த
  rationale: לִיהוּדָה என்பது சொல்லளவில் ‘யூதாவுக்கு’ என இருக்கலாம்; படையெடுப்புச் சூழல் அதன் பகைமை நோக்கைத் தெளிவாக்குவதால் ‘எதிராக’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַיִּנָּגֵפוּ
  choice: அவர்கள் வீழ்த்தப்பட்டார்கள்
  rationale: நிபால் வினையின் செயப்பாட்டு வடிவையும், தாக்கப்பட்டு தோற்கடிக்கப்பட்ட பொருளையும் பாதுகாக்கிறது; யார் மூலம் என்பது உரையில் வெளிப்படையாகச் சொல்லப்படாததால் அதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை பொதுவான பட்டப்பெயரை அல்ல, தேவனுடைய தனிப்பெயரைப் பயன்படுத்துகிறது; ஆகவே அந்தப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: מְאָרְבִים என்பதில் மனித முகவர்களா அல்லது பதுங்குத் தாக்குதல்களா
  choice: பதுங்கித் தாக்குதல்கள்
  alternative: பதுங்கித் தாக்குபவர்கள்
  rationale: எபிரெயப் பங்கேற்புச் சொல் பதுங்கியிருக்கும் நபர்களைக் குறிக்கக்கூடும்; ஆனால் இச்சொற்றொடரில் தாக்குதல் ஏற்பாட்டையும் கூட்டாகக் குறிக்கலாம். முதன்மை உரை பரந்த வாசிப்பை வைத்திருக்கிறது; மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘மகிழ்ச்சிப் பாடல்,’ ‘துதி,’ ‘பதுங்கித் தாக்குதல்’ போன்ற சொற்கள் வழிபாட்டு மற்றும் போர்ச் சூழல்களைத் தெளிவாக இணைக்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
