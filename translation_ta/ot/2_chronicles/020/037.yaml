base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
translation:
  language: ta
  text: அப்போது மாரேஷாவைச் சேர்ந்த டோதாவாகுவின் மகன் எலியேசர், யோசபாத்துக்கு எதிராக இறைவாக்குரைத்து, “நீ அகசியாவுடன் கூட்டுச் சேர்ந்ததால், யாவே உன் முயற்சிகளைச் சிதைத்துவிட்டார்[a]” என்றார். ஆகவே கப்பல்கள் உடைந்து போயின; அவற்றால் தர்ஷீசுக்குச் செல்ல முடியவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, “உன் செயல்களை உடைத்துவிட்டார்.” இங்கு அது யோசபாத்தின் கப்பல் கட்டும் முயற்சியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “செல்ல இயலவில்லை” அல்லது “செல்வதிலிருந்து தடுக்கப்பட்டன” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  choice: இறைவாக்குரைத்து
  rationale: நבא என்பதன் ஹித்பயேல் வடிவம் தீர்க்கதரிசியாக உரைப்பதைக் குறிக்கிறது. ‘இறைவாக்குரைத்து’ என்பது இயல்பான, கண்ணியமான நவீனத் தமிழ்.
- source_word: עַל
  choice: எதிராக
  rationale: இங்கு யோசபாத்தைக் கண்டிக்கும் தீர்ப்புரையின் திசையை עַל குறிக்கிறது; ஆகவே ‘குறித்து’ என்பதைக் காட்டிலும் ‘எதிராக’ பொருத்தமானது.
- source_word: מִמָּרֵשָׁה
  choice: மாரேஷாவைச் சேர்ந்த
  rationale: מִן பிறப்பிடம் அல்லது ஊர்ச் சார்பைக் குறிக்கிறது. தமிழில் ‘மாரேஷாவைச் சேர்ந்த’ இயல்பாக உள்ளது.
- source_word: כְּהִתְחַבֶּרְךָ
  choice: நீ அகசியாவுடன் கூட்டுச் சேர்ந்ததால்
  rationale: חבר என்பதன் ஹித்பயேல் வடிவம் ஒருவருடன் தன்னை இணைத்துக்கொள்வதைக் குறிக்கிறது. இச்சூழலில் இணைந்த முயற்சியை ‘கூட்டுச் சேர்ந்ததால்’ தெளிவாக வெளிப்படுத்துகிறது; முறையான அரசியல் உடன்படிக்கை என்று தேவையின்றி மிகைப்படுத்தவில்லை.
- source_word: פָּרַץ
  choice: சிதைத்துவிட்டார்
  rationale: פרץ அடிப்படையில் உடைத்தல் அல்லது பிளத்தல் என்ற வலிமையான கருத்தைக் கொண்டது. ‘முயற்சிகள்’ என்ற செயப்படுபொருளுடன், அவற்றை முறியடித்து அழித்ததைக் ‘சிதைத்துவிட்டார்’ இயல்பாகக் காட்டுகிறது.
- source_word: מַעֲשֶׂיךָ
  choice: உன் முயற்சிகளை
  rationale: சொல்லுக்கு நேராக ‘உன் செயல்கள்’ என்று பொருள். இச்சூழலில் அது கப்பல் கட்டும் கூட்டு முயற்சியைக் குறிப்பதால் ‘முயற்சிகளை’ தெரிவுசெய்து, நேரடியான வடிவத்தை அடிக்குறிப்பில் வைத்துள்ளோம்.
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  choice: ஆகவே கப்பல்கள் உடைந்து போயின
  rationale: நிஃபால் வடிவம் கப்பல்கள் உடைந்த நிலைக்கு வந்ததைக் குறிக்கிறது. ‘உடைந்து போயின’ என்பது கப்பல்களைப் பற்றிய இயல்பான தமிழ்; முன் கூறிய தீர்ப்பின் விளைவாக இதை ‘ஆகவே’ இணைக்கிறது.
- source_word: וְלֹא עָצְרוּ לָלֶכֶת
  choice: அவற்றால் ... செல்ல முடியவில்லை
  rationale: עצר இக்கட்டமைப்பில் செல்ல இயலாமை அல்லது தடுக்கப்பட்ட நிலையைத் தெரிவிக்கிறது. கப்பல்களே இலக்கண எழுவாய் என்பதையும் நடைமுறை இயலாமையையும் இவ்வாக்கியம் காக்கிறது.
- source_word: תַּרְשִׁישׁ
  choice: தர்ஷீசு
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה ஒரு பொதுப் பட்டத்தால் மாற்றப்படாமல், தமிழில் பரவலாகப் புரியக்கூடிய ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூல வசனம் இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: யோசபாத்தின் முயற்சி அழிக்கப்பட்டதற்கும் கப்பல்கள் உடைந்ததற்கும் உள்ள தொடர்பு
  choice: ‘ஆகவே’ என விளைவுத் தொடர்பை வெளிப்படுத்துதல்
  alternative: ‘அப்போது’ அல்லது வெறும் ‘மேலும்’ என இணைத்தல்
  rationale: வாக்கியத் தொடரும் தீர்ப்புரையின் உள்ளடக்கமும் கப்பல்கள் உடைந்ததை யாவே முயற்சியைச் சிதைத்ததன் விளைவாகக் காட்டுகின்றன; ஆனால் நிகழ்வு எப்படி நடந்தது என்பதை உரை மேலும் விளக்காததால் அதைப் பற்றி எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தீர்க்கதரிசனக் கண்டனத்தின் வலிமையும், கப்பல்களே இறுதி வாக்கியத்தின் எழுவாய் என்பதும் பாதுகாக்கப்பட்டுள்ளன. பெயர்கள் எபிரெய ஒலியமைப்பை அணுகும் வகையில் தமிழாக்கப்பட்டுள்ளன.
