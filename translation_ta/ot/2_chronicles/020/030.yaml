  text: וַ/תִּשְׁקֹ֖ט מַלְכ֣וּת יְהוֹשָׁפָ֑ט וַ/יָּ֧נַֽח ל֦/וֹ אֱלֹהָ֖י/ו מִ/סָּבִֽיב׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/030.yaml
  text: So the kingdom of Jehoshaphat was at peace[a], and his God gave him rest all around.
translation:
  language: ta
  text: யோசபாத்தின் ராஜ்யம் அமைதியாக இருந்தது[a]; அவனுடைய கடவுள் அவனுக்கு எல்லாப் பக்கங்களிலும் இளைப்பாறுதல் அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யோசபாத்தின் ராஜ்யம் சலனமின்றி இருந்தது.”
    reason: שׁקט என்ற வினை ‘அமைதியாக இருத்தல்,’ ‘சலனமின்றி இருத்தல்’ ஆகிய நெருங்கிய பொருள்களைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: அமைதி நிலவியது
  rationale: שׁקט என்பது சலனமோ தொந்தரவோ இன்றி அமைதியாக இருப்பதைக் குறிக்கிறது. ‘ராஜ்யத்தில் அமைதி நிலவியது’ என்பது ராஜ்யத்தை எழுவாயாகக் கொண்ட எபிரெயச் சொல்லாட்சியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מַלְכוּת
  choice: ராஜ்யம்
  rationale: இங்கு யோசபாத்தின் ஆட்சிக்குட்பட்ட நாட்டைக் குறிக்கிறது. ‘ராஜ்யம்’ வரலாற்றுச் சூழலில் தெளிவாகவும் வழக்கமாகவும் உள்ளது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: எபிரெய தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: וַיָּנַח
  choice: இளைப்பாறுதல் அளித்தார்
  rationale: 'נוח என்பதன் ஹிஃபீல் வடிவம் காரணவினைப் பொருளைக் கொண்டது: கடவுள் அவனை இளைப்பாறச் செய்தார். ‘இளைப்பாறுதல் அளித்தார்’ அந்தப் பொருளை இயல்பாகக் காக்கிறது.'
- source_word: אֱלֹהָיו
  choice: அவனுடைய கடவுள்
  rationale: இணைந்த பின்னொட்டு ‘அவனுடைய’ எனப் பொருள்பட்டு, யோசபாத்தின் கடவுளைக் குறிக்கிறது.
- source_word: מִסָּבִיב
  choice: எல்லாப் பக்கங்களிலும்
  rationale: சுற்றியிருந்த எல்லாத் திசைகளிலிருந்தும் அச்சுறுத்தல் இல்லாத பாதுகாப்பையும் இளைப்பாறுதலையும் இச்சொல் குறிக்கிறது.
- source_word: וַ
  choice: ;
  rationale: இரு எபிரெய வாக்கியங்களையும் இணைக்கும் waw-ஐ காரணத் தொடர்பாக வெளிப்படையாக மாற்றாமல், தமிழில் இயல்பான தொடர்ச்சியை அரைப்புள்ளி மூலம் காக்கிறது.
theological_decisions:
- issue: ராஜ்யத்தின் அமைதியில் கடவுளின் செயற்பாடு
  choice: முதல் கூற்றைத் தொடர்ந்து, கடவுள் யோசபாத்துக்கு எல்லாப் பக்கங்களிலும் இளைப்பாறுதல் அளித்தார் என்று நேரடியாகக் கூறுதல்
  alternative: இரண்டாம் கூற்றை ‘ஏனெனில்’ என்று தொடங்கி, அதை முதல் கூற்றின் வெளிப்படையான காரணமாகக் காட்டுதல்
  rationale: எபிரெயம் இரண்டு கூற்றுகளையும் waw மூலம் இணைக்கிறது. கடவுளின் செயற்பாடு தெளிவாக இருந்தாலும், இலக்கணத்தில் மறைமுகமாக உள்ள காரணத் தொடர்பை மொழிபெயர்ப்பில் கட்டாயமாக வெளிப்படுத்தாமல் இருப்பது மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘இளைப்பாறுதல்’ கடவுள் அளித்த பாதுகாப்பான ஓய்வைத் தெரிவிக்கிறது; ‘எல்லாப் பக்கங்களிலும்’ מִסָּבִיב என்பதன் முழுமையான சுற்றுப்புறப் பொருளைக் காக்கிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
