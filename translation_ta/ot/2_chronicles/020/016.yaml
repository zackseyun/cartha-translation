base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
translation:
  language: ta
  text: நாளை அவர்களுக்கு எதிராக இறங்கிச் செல்லுங்கள். இதோ, அவர்கள் சீஸ் ஏற்றப்பாதையில் ஏறி வருகிறார்கள். எருவேல் வனாந்தரத்தின் முன்பாக உள்ள பள்ளத்தாக்கின்[a] முடிவில் அவர்களை நீங்கள் காண்பீர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பள்ளத்தாக்கு’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் נחל; இதை ‘பள்ளம்’ அல்லது ‘பருவகால நீரோடை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָחָר
  choice: நாளை
  rationale: கட்டளையிடப்பட்ட செயல் நடைபெறும் காலத்தை மட்டும் குறிக்கும் எளிய நேர வினையடை; எபிரெயத்தில் இல்லாத ‘காலையில்’ என்ற குறிப்பைச் சேர்க்கவில்லை.
- source_word: רְדוּ עֲלֵיהֶם
  choice: அவர்களுக்கு எதிராக இறங்கிச் செல்லுங்கள்
  rationale: רְדוּ என்பது பன்மை ஏவல் வடிவில் ‘இறங்குங்கள்’; இராணுவச் சூழலில் עֲלֵיהֶם எதிர்ப்புறச் செல்வதைக் குறிப்பதால் ‘எதிராக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הִנָּם
  choice: பாருங்கள்
  rationale: தொடர்ந்து வரும் செய்தியின்மீது கவனத்தை ஈர்க்கும் சுட்டிடைச்சொல்லின் உரையாடல் செயல்பாட்டை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: עֹלִים
  choice: ஏறி வருகிறார்கள்
  rationale: עלה என்பதன் நிகழ்காலப் பங்கேற்பு வடிவம் நடப்பு அல்லது நெருங்கிய நகர்வைக் குறிக்கிறது; பேசுபவரின் நோக்குநிலையை ‘வருகிறார்கள்’ காக்கிறது.
- source_word: בְּמַעֲלֵה הַצִּיץ
  choice: சீஸ் ஏற்றப்பாதை வழியாக
  rationale: מַעֲלֶה என்பது மேலேறும் பாதை அல்லது ஏற்றத்தைக் குறிக்கிறது; இடப்பெயரான הַצִּיץ ‘சீஸ்’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: וּמְצָאתֶם אֹתָם
  choice: அவர்களை நீங்கள் காண்பீர்கள்
  rationale: கட்டளையைத் தொடர்ந்து வரும் எதிர்கால விளைவை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּסוֹף הַנַּחַל
  choice: பள்ளத்தாக்கின் முடிவில்
  rationale: סוֹף என்பது இறுதி அல்லது ஓரப்பகுதியைக் குறிக்கிறது. נַחַל என்பது பள்ளத்தாக்கையோ பருவகால நீரோடையையோ குறிக்கக்கூடும்; தமிழில் எளிதில் புரியும் ‘பள்ளத்தாக்கு’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
- source_word: פְּנֵי מִדְבַּר יְרוּאֵל
  choice: எருவேல் வனாந்தரத்திற்கு முன்பாக
  rationale: פְּנֵי இங்கு இடஞ்சார்ந்த ‘முன்பாக’ என்ற பொருளையும், מִדְבָּר குடியிருப்பற்ற வறண்ட வனப்பகுதியையும் குறிக்கிறது; יְרוּאֵל ‘எருவேல்’ என ஒலிபெயர்க்கப்பட்டது.
