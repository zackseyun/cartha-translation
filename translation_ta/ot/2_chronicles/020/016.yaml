  register: நவீன நிலையான தமிழில், மரியாதையுள்ள ஆனால் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. நிலவியல் சொல்லான נחל-இன் பொருள் பரப்பை அடிக்குறிப்பு காக்கிறது; இடப்பெயர்கள் தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளன.
