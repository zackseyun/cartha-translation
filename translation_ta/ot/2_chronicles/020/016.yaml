revisions:
- from: நாளை அவர்களுக்கு எதிராக இறங்கிச் செல்லுங்கள். பாருங்கள், அவர்கள் சீஸ் ஏற்றப்பாதை வழியாக ஏறி வருகிறார்கள். எருவேல் வனாந்தரத்திற்கு முன்பாக, பள்ளத்தாக்கின்[a] முடிவில் அவர்களை நீங்கள் காண்பீர்கள்.
  to: நாளை அவர்களுக்கு எதிராக இறங்கிச் செல்லுங்கள். இதோ, அவர்கள் சீஸ் ஏற்றப்பாதையில் ஏறி வருகிறார்கள். எருவேல் வனாந்தரத்தின் முன்பாக உள்ள பள்ளத்தாக்கின்[a] முடிவில் அவர்களை நீங்கள் காண்பீர்கள்.
  rationale: Presentative ‘இதோ’ more directly reflects הִנָּם. The locative expression for the ascent is revised to avoid implying passage through it. The final place description is reordered for clear Tamil syntax while retaining ‘at the end of the wadi, before the wilderness of Jeruel.’
