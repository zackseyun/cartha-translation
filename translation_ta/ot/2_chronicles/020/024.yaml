  text: וִֽ/יהוּדָ֛ה בָּ֥א עַל הַ/מִּצְפֶּ֖ה לַ/מִּדְבָּ֑ר וַ/יִּפְנוּ֙ אֶל הֶ֣/הָמ֔וֹן וְ/הִנָּ֧/ם פְּגָרִ֛ים נֹפְלִ֥ים אַ֖רְצָ/ה וְ/אֵ֥ין פְּלֵיטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
translation:
  language: ta
  text: யூதா வனாந்தரத்தை நோக்கியிருந்த கண்காணிப்பு இடத்திற்கு வந்தபோது, அவர்கள் அந்தத் திரளை நோக்கித் திரும்பினார்கள். இதோ, தரையில் விழுந்துகிடந்த பிணங்கள் இருந்தன; தப்பிப்பிழைத்தவர் ஒருவரும் இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיהוּדָה
  choice: யூதா
  rationale: இங்கு இடப்பெயர், யூதாவின் படையினரையோ மக்களையோ கூட்டாகக் குறிக்கிறது; எபிரெய உரையின் சுருக்கமான கூட்டுப்பொருளைத் தக்கவைக்கப்பட்டது.
- source_word: בָּא
  choice: வந்தபோது
  rationale: בוא என்பதன் வழக்கமான இயக்கப் பொருள்; தொடர்ந்த நிகழ்வுடன் இயல்பாக இணைக்க காலத் துணைவாக்கியமாக வழங்கப்பட்டது.
- source_word: עַל הַמִּצְפֶּה לַמִּדְבָּר
  choice: வனாந்தரத்தை நோக்கியிருந்த காவலிடத்துக்கு
  rationale: מִצְפֶּה என்பது கண்காணிக்க ஏற்ற உயர்ந்த இடம் அல்லது காவலிடம்; לַמִּדְבָּר அதன் திசைநோக்கைச் சுட்டுவதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וַיִּפְנוּ אֶל הֶהָמוֹן
  choice: அவர்கள் அந்தத் திரளின் பக்கம் திரும்பிப் பார்த்தார்கள்
  rationale: פנה என்பதன் நேரடியான ‘திரும்புதல்’ பொருளையும், இச்சூழலில் உட்படும் பார்வைச் செயலையும் இயல்பான தமிழில் இணைக்கிறது; הָמוֹן என்பதற்கு இராணுவம் என அதிகமாக விளக்காமல் ‘திரள்’ பயன்படுத்தப்பட்டது.
- source_word: וְהִנָּם
  choice: இதோ
  rationale: திடீரெனக் கண்ணில் பட்ட காட்சியை வலியுறுத்தும் எபிரெயச் சுட்டிடைச்சொல்லின் உயிரோட்டத்தைப் பாதுகாக்கிறது.
- source_word: פְּגָרִים נֹפְלִים אַרְצָה
  choice: தரையில் விழுந்துகிடந்த பிணங்கள்
  rationale: פְּגָרִים என்பதன் ‘பிணங்கள்’ என்ற தெளிவான பொருளையும், נֹפְלִים אַרְצָה கூறும் விழுந்த நிலையில் கிடப்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְאֵין פְּלֵיטָה
  choice: தப்பியவர் ஒருவரும் இல்லை
  rationale: פְּלֵיטָה என்பது தப்பியவர் அல்லது தப்பிப்பிழைத்தவர் எனக் கொள்ளலாம்; சூழலில் எவரும் தப்பவில்லை என்ற கருத்தைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
