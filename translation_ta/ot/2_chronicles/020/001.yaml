translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதான அதே நேரத்தில் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. மூல எபிரெய உரையில் மீண்டும் வரும் ‘அம்மோனியர்’ என்ற வாசகம் முதன்மை உரையில் பாதுகாக்கப்பட்டு, பழங்கால மொழிபெயர்ப்புகள் சார்ந்த மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
