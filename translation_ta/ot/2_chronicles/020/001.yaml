  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֡ן בָּ֣אוּ בְנֵי מוֹאָב֩ וּ/בְנֵ֨י עַמּ֜וֹן וְ/עִמָּ/הֶ֧ם מֵֽ/הָ/עַמּוֹנִ֛ים עַל יְהוֹשָׁפָ֖ט לַ/מִּלְחָמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
translation:
  language: ta
  text: இதற்குப் பிறகு, மோவாபியரும் அம்மோனியரும், அவர்களோடு அம்மோனியரில் சிலரும்[a], யோசபாத்துக்கு எதிராகப் போரிட வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் ‘அம்மோனியரில் சிலர்’ என்று உள்ளது. ஆனால் சூழலையும் சில பழங்கால மொழிபெயர்ப்புகளையும் பின்பற்றி, இதை ‘மெயூனியரில் சிலர்’ அல்லது அதைப் போன்ற வேறொரு கூட்டணி மக்களைக் குறிக்கும் வாசகமாகப் பலர் புரிந்துகொள்கிறார்கள்.
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: இது கதையை அடுத்த நிகழ்வுக்கு நகர்த்தும் காலக் குறிப்பு. எபிரெய மொழியின் ‘அதற்குப் பிறகு நிகழ்ந்ததாவது’ என்ற சொல்லமைப்பைச் சொற்சொல்லாகப் பின்பற்றாமல், அதன் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: בָּאוּ
  choice: வந்தார்கள்
  rationale: பொதுவான நகர்வு வினை. עַל மற்றும் לַמִּלְחָמָה என்பவற்றோடு சேர்ந்து வரும் பகைமைச் சூழலைத் தொடரிலுள்ள மற்ற சொற்கள் தெளிவுபடுத்துவதால், வினையிலேயே ‘படையெடுத்தார்கள்’ என்ற கூடுதல் குறிப்பைச் சேர்க்கவில்லை.
- source_word: בְנֵי מוֹאָב
  choice: மோவாபியர்
  rationale: ‘மோவாபின் மகன்கள்’ என்பது இங்கு இனக்குழுவைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் இயல்பான இனப்பெயர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְנֵי עַמּוֹן
  choice: அம்மோனியர்
  rationale: இது அம்மோன் மக்களைக் குறிக்கும் இனப்பெயர்; சொற்சொல்லான ‘அம்மோனின் மகன்கள்’ என்பதற்குப் பதிலாக இயல்பான தமிழ்ப் பெயர் தரப்பட்டுள்ளது.
- source_word: וְעִמָּהֶם
  choice: அவர்களோடு
  rationale: கூட வந்த மற்றொரு குழுவுக்கும் முன் குறிப்பிடப்பட்ட இரு மக்களுக்கும் உள்ள தொடர்பைச் சுருக்கமாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: מֵהָעַמּוֹנִים
  choice: அம்மோனியரில் சிலர்[a]
  rationale: WLC-யின் உயிர்க்குறியிடப்பட்ட எபிரெய உரை நேரடியாக ‘அம்மோனியரில் சிலர்’ என வாசிக்கிறது. சூழலும் பழங்கால மொழிபெயர்ப்புகளும் வேறு கூட்டணி மக்களைக் குறிக்கலாம் என்பதால் அந்த மாற்று அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது; முதன்மை உரையின் சாட்சியம் அமைதியாகத் திருத்தப்படவில்லை.
- source_word: עַל יְהוֹשָׁפָט
  choice: யோசபாத்துக்கு எதிராக
  rationale: பகைமையான இராணுவ நகர்வின் சூழலில் עַל என்பதன் பொருள் ‘எதிராக’ என்பதாகும்.
- source_word: לַמִּלְחָמָה
  choice: போரிட
  rationale: அவர்கள் வந்த நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது. ‘போருக்காக’ என்பதும் சாத்தியம்; ஆனால் ‘போரிட வந்தார்கள்’ என்பது நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
