source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
translation:
  language: ta
  text: இதற்குப் பிறகு, யூதாவின் அரசன் யோசபாத் இஸ்ரவேலின் அரசன் அகசியாவுடன் கூட்டுச் சேர்ந்தான்.[a] அகசியா அவ்வாறு செய்ததில் தீய முறையில் நடந்துகொண்டான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அகசியாவுடன் இணைந்தான்.”
    reason: lexical_alternative
  - marker: b
    text: “அகசியா அவ்வாறு செய்ததில் தீய முறையில் நடந்துகொண்டான்” என்ற பகுதி எபிரெயத்தில் இன்னும் சொற்சார்ந்து, “அவன் செய்வதற்குத் தீயவனாக நடந்தான்” என உள்ளது. “அவன்” என்பது பெரும்பாலும் அகசியாவைக் குறித்தாலும், யோசபாத்தையோ அவர் கூட்டுச் சேர்ந்த செயலையோ குறிப்பதாகவும் புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: முந்தைய நிகழ்வுகளைத் தொடர்ந்து நடந்ததைச் சுட்டும் இயல்பான நவீனத் தமிழ் காலத் தொடர்.
- source_word: אֶתְחַבַּר
  choice: கூட்டுச் சேர்ந்தான்
  rationale: חבר என்பதன் Hitpael வடிவம் வெறும் உடன்சேர்தலைவிட ஓர் இணைப்பு அல்லது கூட்டுறவை ஏற்படுத்துவதைக் குறிக்கிறது; அரசியல் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: יְהוֹשָׁפָט
  choice: யோசபாத்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன்
  rationale: அரசப் பட்டத்தையும் நாட்டுடைமைத் தொடர்பையும் நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: עִם אֲחַזְיָה מֶלֶךְ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் அரசன் அகசியாவுடன்
  rationale: முன்னிடைத் தொடர்பையும் அகசியாவின் அரசப் பட்டத்தையும் தெளிவான தமிழ் சொல்வரிசையில் தருகிறது.
- source_word: הוּא
  choice: அகசியா
  rationale: அருகிலுள்ள முன்னிலையான அகசியாவையே இச்சுட்டுப்பெயர் பெரும்பாலும் குறிக்கிறது; தமிழில் குறிப்பு தெளிவாக இருக்க பெயர் மீண்டும் பயன்படுத்தப்பட்டது.
- source_word: הִרְשִׁיעַ
  choice: தீய முறையில் நடந்துகொண்டான்
  rationale: רשע என்பதன் Hiphil வடிவத்திலுள்ள ஒழுக்கத் தீர்ப்பை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: לַ/עֲשׂוֹת
  choice: அவ்வாறு செய்ததில்
  rationale: சுருக்கமான எபிரெய இறந்தகாலமற்ற வினையெச்சத் தொடரை முன் கூறப்பட்ட கூட்டுச் சேர்தலுடன் இயல்பாக இணைக்கிறது; அதன் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: הוּא என்ற சுட்டுப்பெயர் யாரைக் குறிக்கிறது?
  choice: முதன்மை உரையில் அது அகசியாவைக் குறிக்கிறது.
  alternative: அது யோசபாத்தையோ அவர் கூட்டுச் சேர்ந்த செயலையோ குறிக்கும் வகையில் புரிந்துகொள்ளலாம்.
  rationale: இலக்கணத்தில் மிக அருகிலுள்ள பெயர் அகசியா; சுற்றியுள்ள கதையிலும் அகசியா தீயவனாகச் சித்தரிக்கப்படுகிறான். இருப்பினும் எபிரெய ஆண்பால் ஒருமைச் சுட்டுப்பெயர் தனியாக நிற்பதால் தோன்றும் குறிப்புத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: לַעֲשׂוֹת என்ற தொடரின் தொடர்பு
  choice: கூட்டுச் சேர்ந்த செயலைக் குறிப்பதாக ‘அவ்வாறு செய்ததில்’ என்று வழங்கப்பட்டது.
  alternative: இதை இன்னும் சொற்சார்ந்து ‘செய்வதில்’ அல்லது பொதுவாக ‘தன் செயல்களில்’ என்று மொழிபெயர்க்கலாம்.
  rationale: எபிரெயத் தொடர் சுருக்கமானது; சூழலோடு இணைக்கும் வாசிப்பு தமிழில் இயல்பாக இருந்தாலும், மூலத்தின் இறுக்கமும் மாற்று வாய்ப்பும் அடிக்குறிப்பில் தெரிவிக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அரசன்’, ‘கூட்டுச் சேர்ந்தான்’, ‘தீய முறையில் நடந்துகொண்டான்’ ஆகியவை இயல்பான சொற்களாகத் தேர்ந்தெடுக்கப்பட்டன; மூல எபிரெயத்தின் சுட்டுப்பெயர் மற்றும் வினையெச்சத் தொடரிலுள்ள தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
