source:
  edition: WLC
  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
translation:
  language: ta
  text: “பேரிடர்—வாள், நியாயத்தீர்ப்பு, கொள்ளைநோய் அல்லது பஞ்சம்—எங்கள்மேல் வந்தால், நாங்கள் இந்த ஆலயத்துக்கு முன்பாகவும் உமக்கு முன்பாகவும் நிற்போம். ஏனெனில், உமது பெயர் இந்த ஆலயத்தில் இருக்கிறது.[a] எங்கள் நெருக்கடியிலிருந்து உம்மை நோக்கிக் கூக்குரலிடுவோம்; நீர் கேட்டு எங்களைக் காப்பாற்றுவீர்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பெயர் இந்த ஆலயத்தின்மேல் சூட்டப்பட்டுள்ளது”; அதாவது, இந்த ஆலயம் உமது பெயரைத் தாங்குகிறது.
    reason: ‘பெயர் ... இல்’ என்ற எபிரெய மரபுத்தொடருக்கான இயல்பான மாற்று மொழிபெயர்ப்பை வழங்கி, பிரதான உரையின் உண்மையான பொருள் வரம்பை விளக்குகிறது.
lexical_decisions:
- source_word: רָעָה
  choice: பேரிடர்
  rationale: இச்சூழலில் இது ஒழுக்கத் தீமையைக் குறிக்காமல், மக்கள்மேல் வரும் அழிவுதரும் பெருந்துன்பத்தைக் குறிக்கிறது; அடுத்து வரும் பட்டியலுக்கும் ‘பேரிடர்’ இயல்பாகப் பொருந்துகிறது.
- source_word: חֶרֶב
  choice: வாள்
  rationale: ‘போர்’ என்று கருத்தை விரித்துரைக்காமல், எபிரெய மூலத்தின் குறிப்பான உருவகச் சொல்லை அப்படியே தக்கவைக்கிறது.
- source_word: שְׁפוֹט
  choice: நியாயத்தீர்ப்பு
  rationale: பேரிடர்களின் பட்டியலில் வரும் தண்டனை சார்ந்த தீர்ப்பு என்ற பொருளைத் தக்கவைக்கிறது; ‘தண்டனை’ என்று மட்டும் மொழிபெயர்த்து அதன் நீதித்தீர்ப்பு நுணுக்கத்தை இழக்கவில்லை.
- source_word: דֶבֶר
  choice: கொள்ளைநோய்
  rationale: பரவலாக உயிர்களைப் பறிக்கும் தொற்றுப் பேரிடரைக் குறிக்கும் இயல்பான, மதிப்புமிக்க தமிழ் சொல்.
- source_word: רָעָב
  choice: பஞ்சம்
  rationale: தனிநபரின் பசியை அல்ல, பரவலான உணவுப் பற்றாக்குறையைக் குறிக்கிறது.
- source_word: נַעַמְדָה
  choice: நாங்கள் ... நிற்போம்
  rationale: நிபந்தனை அமைப்பில் மக்கள் மேற்கொள்ளும் உறுதியை எதிர்கால வினையாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי הַבַּיִת הַזֶּה
  choice: இந்த ஆலயத்துக்கு முன்பாக
  rationale: הַבַּיִת என்பதன் நேரடிப் பொருள் ‘வீடு’ என்றாலும், இங்கு கர்த்தரின் ஆலயம் குறிக்கப்படுவதால் நவீனத் தமிழில் தவறான புரிதலைத் தவிர்க்க ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது; ‘முன்பாக’ என்பது வழிபாட்டு நிலையைப் பாதுகாக்கிறது.
- source_word: וּלְפָנֶיךָ
  choice: உமக்கு முன்பாகவும்
  rationale: ஆலயத்துக்கு முன்பாக நிற்பதும் கடவுளுக்கு முன்பாக நிற்பதும் ஆகிய இணை அமைப்பைப் பாதுகாக்கிறது.
- source_word: כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: ஏனெனில், உமது பெயர் இந்த ஆலயத்தில் இருக்கிறது
  rationale: கடவுளின் உடன்படிக்கை உரிமை, பிரசன்னம், பெயர் ஆகிய பல நுணுக்கங்களைக் கொண்ட எபிரெய மரபுத்தொடரை ஒரே விளக்கமாகச் சுருக்காமல் பிரதான உரையில் தக்கவைக்கிறது.
- source_word: וְנִזְעַק
  choice: உம்மை நோக்கிக் கூக்குரலிடுவோம்
  rationale: சாதாரணமாக வேண்டுதல் செய்வதைவிட, துன்பத்தில் எழும் அவசரமான மன்றாட்டை வெளிப்படுத்துகிறது.
- source_word: מִצָּרָתֵנוּ
  choice: எங்கள் நெருக்கடியிலிருந்து
  rationale: மன்றாட்டு எழும் மூலநிலையைக் காட்டும் מִן முன்னிடைச்சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: וְתִשְׁמַע וְתוֹשִׁיעַ
  choice: நீர் கேட்டு எங்களைக் காப்பாற்றுவீர்
  rationale: ‘கேட்பது’ மற்றும் ‘காப்பாற்றுவது’ என்ற இரு செயல்களையும் தெளிவாக வேறுபடுத்தி, மீட்பின் முறையை தேவையின்றிக் குறிப்பாக்காமல் தருகிறது.
theological_decisions:
- issue: ‘உமது பெயர் இந்த ஆலயத்தில் இருக்கிறது’ என்ற ஆலய–பெயர் இறையியல்
  choice: எபிரெய மரபுத்தொடரை பிரதான உரையில் ‘உமது பெயர் இந்த ஆலயத்தில் இருக்கிறது’ என்று தக்கவைத்தல்.
  alternative: ‘உமது பெயர் இந்த ஆலயத்தின்மேல் சூட்டப்பட்டுள்ளது’ அல்லது ‘இந்த ஆலயம் உமது பெயரைத் தாங்குகிறது.’
  rationale: இம்மரபுத்தொடர் கடவுளின் உடன்படிக்கை உரிமை, பிரசன்னம், ஆலயத்துடனான தொடர்பு ஆகியவற்றை ஒருங்கே உணர்த்துகிறது. அவற்றில் ஒன்றை மட்டும் தீர்மானமாக்காமல் மூலத்தின் இறையியல் செறிவையும் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மதிப்புமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘உமக்கு’, ‘உம்மை’, ‘நீர்’ பயன்படுத்தப்பட்டுள்ளன. ‘வீடு’ என்பது இச்சூழலில் தவறாகப் புரியக்கூடும் என்பதால் ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது; எனினும் பெயர்–ஆலய மரபுத்தொடர் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
