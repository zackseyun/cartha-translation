id: 2CH.20.28
reference: 2 Chronicles 20:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ יְר֣וּשָׁלִַ֔ם בִּ/נְבָלִ֥ים וּ/בְ/כִנֹּר֖וֹת וּ/בַ/חֲצֹצְר֑וֹת אֶל בֵּ֖ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
translation:
  language: ta
  text: அவர்கள் வீணைகள்[a], யாழ்கள், எக்காளங்கள் ஆகியவற்றுடன் எருசலேமிலுள்ள யாவேவின் இல்லத்திற்கு[b] வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாழ் அல்லது வீணை போன்ற நரம்பிசைக் கருவிகள்’; נְבָלִים குறிக்கும் பழங்கால இசைக்கருவியின் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘யாவேவின் ஆலயத்திற்கு’; சொல்லர்த்தமாக, ‘யாவேவின் இல்லத்திற்கு.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: வந்தார்கள்
  rationale: בוא என்ற இயக்க வினை தொடரும் நிகழ்வைச் சுட்டுகிறது. தமிழில் இயல்பான கதைநடை வடிவமாக ‘வந்தார்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְרוּשָׁלִַם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் அறியப்பட்ட இடப்பெயர் வடிவம்.
- source_word: בִּנְבָלִים
  choice: வீணைகள்
  rationale: נבל என்பது யாழ் அல்லது வீணை வகையைச் சேர்ந்த பழங்கால நரம்பிசைக் கருவியைக் குறிக்கிறது. அடுத்துள்ள כִּנּוֹר என்பதிலிருந்து வேறுபடுத்தவும், நவீன வாசகர்களுக்குப் புரியவும் ‘வீணைகள்’ தேர்ந்தெடுக்கப்பட்டது; துல்லியமான கருவி வடிவம் உறுதியற்றது என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: וּבְכִנֹּרוֹת
  choice: யாழ்கள்
  rationale: כִּנּוֹר என்பது பொதுவாக lyre வகை நரம்பிசைக் கருவி. נבל என்பதுடன் ஒன்றாக்காமல் தனித்த இசைக்கருவியாக ‘யாழ்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבַחֲצֹצְרוֹת
  choice: எக்காளங்கள்
  rationale: חֲצֹצְרָה வழிபாடு மற்றும் விழாக்களில் பயன்படுத்தப்பட்ட ஊதுகருவியைக் குறிக்கிறது. தமிழில் தெளிவான வழிபாட்டுச் சூழல் சொல்லாக ‘எக்காளங்கள்’ பொருந்துகிறது; இவ்வசனத்தில் வெள்ளி என்று வெளிப்படையாக இல்லாததால் அது சேர்க்கப்படவில்லை.
- source_word: אֶל בֵּית יְהוָה
  choice: யாவேவின் இல்லத்திற்கு
  rationale: எபிரெயச் சொற்றொடரின் நேர்ப்பொருளான ‘யாவேவின் வீடு/இல்லம்’ என்பதைக் காத்து, தமிழில் கண்ணியமாக ஒலிக்க ‘இல்லம்’ பயன்படுத்தப்பட்டுள்ளது. சூழலில் இது ஆலயத்தைக் குறித்தாலும், அந்த விளக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தேவனுடைய தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் இறைவனின் தனிப்பெயரான திருநான்கெழுத்து நேரடியாக உள்ளது. அதனைப் பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் எருசலேமும் யாவேவின் இல்லமும் தொடர்ச்சியான இலக்குகளாக வருவதால், தமிழில் இயல்பாக இருக்க ‘எருசலேமிலுள்ள யாவேவின் இல்லத்திற்கு’ என அமைக்கப்பட்டுள்ளது. இசைக்கருவிகளை அவர்கள் வாசித்தார்கள் என்று மூலத்தில் வெளிப்படையாகச் சொல்லப்படாததால், ‘இசைத்துக்கொண்டு’ போன்ற சொல் சேர்க்கப்படவில்லை.
