  naturalness: முக்கிய உரை நவீன நிலையான தமிழில் தெளிவாகவும் ஜெபத்திற்குரிய கண்ணியமான நடையிலும் உள்ளது. ஆனால் அடிக்குறிப்பில் ‘மூலவடிவுக்கு’ என்பது இயல்பான சொல்லாக்கம் அல்ல; ‘மூலத்திற்கு நெருக்கமாக’ என்பது சிறந்தது. ‘கண்கள் உம்மேல் இருக்கின்றன’ என்பதற்குப் பதிலாக ‘கண்கள் உம்மீது பதிந்திருக்கின்றன’ என்பது தமிழில் இயல்பாகவும் மூல உருவகத்தைத் தக்கவைத்தும் அமைகிறது.
