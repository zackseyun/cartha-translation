  text: אֱלֹהֵ֨י/נוּ֙ הֲ/לֹ֣א תִשְׁפָּט בָּ֔/ם כִּ֣י אֵ֥ין בָּ֨/נוּ֙ כֹּ֔חַ לִ֠/פְנֵי הֶ/הָמ֥וֹן הָ/רָ֛ב הַ/זֶּ֖ה הַ/בָּ֣א עָלֵ֑י/נוּ וַ/אֲנַ֗חְנוּ לֹ֤א נֵדַע֙ מַֽה נַּעֲשֶׂ֔ה כִּ֥י עָלֶ֖י/ךָ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
translation:
  language: ta
  text: எங்கள் கடவுளே, நீர் அவர்கள்மீது தீர்ப்பளிக்கமாட்டீரா? எங்களுக்கு எதிராக வந்துகொண்டிருக்கும் இந்தப் பெருந்திரளை எதிர்கொள்ள எங்களுக்கு வலிமை இல்லை. நாங்கள் என்ன செய்வதென்று அறியவில்லை; ஆனாலும் எங்கள் கண்கள் உம்மையே நோக்கியிருக்கின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, மூலத்திற்கு நெருக்கமாக: “ஏனெனில் எங்கள் கண்கள் உம்மீது பதிந்திருக்கின்றன.”'
    reason: இறுதி כִּי-யை ‘ஆனாலும்’ என்ற முரண்பாட்டுத் தொடர்பாகவும் ‘ஏனெனில்’ என்ற காரணத் தொடர்பாகவும் புரிந்துகொள்ள முடியும்; அடிக்குறிப்பு எபிரெய உருவகத்தின் முறைசார் வடிவத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  choice: எங்கள் கடவுளே
  rationale: இது ஜெபத்தில் கடவுளை நேரடியாக அழைக்கும் விளிவேற்றுமைத் தொடர். நவீனத் தமிழில் இயல்பாகவும் உடன்படிக்கை சார்ந்த கூட்டு உறவை வெளிப்படுத்தும் வகையிலும் உள்ளது.
- source_word: הֲלֹא תִשְׁפָּט בָּם
  choice: நீர் அவர்கள்மீது தீர்ப்பளிக்கமாட்டீரா?
  rationale: שׁפט என்பது இங்கு பகைவர்களுக்கு எதிராகக் கடவுள் நீதிச் செயல் புரிவதைக் குறிக்கிறது. ‘தண்டிக்கமாட்டீரா’ என்பது பொருளைத் தண்டனைக்கு மட்டும் சுருக்கிவிடும் என்பதால் ‘தீர்ப்பளிக்கமாட்டீரா’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֵין בָּנוּ כֹּחַ
  choice: எங்களுக்கு வலிமை இல்லை
  rationale: כֹּחַ என்பது வலிமை, ஆற்றல், திறன் ஆகியவற்றைக் குறிக்கலாம். போர்ச் சூழலில் ‘வலிமை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לִפְנֵי הֶהָמוֹן הָרָב הַזֶּה
  choice: இந்தப் பெருந்திரளை எதிர்கொள்ள
  rationale: לִפְנֵי என்பதன் அடிப்படைப் படிமம் ‘முன்பாக/முகத்திற்கு முன்’ என்பதாகும். இச்சூழலில் அச்சுறுத்தும் திரளை எதிர்கொள்ள இயலாமை என்பதே இயல்பான தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: הֶהָמוֹן הָרָב הַזֶּה
  choice: இந்தப் பெருந்திரள்
  rationale: הָמוֹן ஒரு பெரிய மக்கள் அல்லது படைக் கூட்டத்தைக் குறிக்கிறது. சூழல் இராணுவமானதாக இருந்தாலும், மூலச்சொல்லைவிடக் குறிப்பாக ‘படை’ என்று வரையறுக்காமல் ‘பெருந்திரள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הַבָּא עָלֵינוּ
  choice: எங்களுக்கு எதிராக வந்துகொண்டிருக்கும்
  rationale: எபிரெயப் பெயரெச்ச வடிவம் நெருங்கிவரும் அச்சுறுத்தலைக் காட்டுகிறது; עַל இங்கு பகைமையான ‘எதிராக’ என்ற உறவைத் தருகிறது.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע מַה נַּעֲשֶׂה
  choice: நாங்கள் என்ன செய்வதென்று அறியவில்லை
  rationale: உதவியற்ற நிலையை நேரடியாகவும் அவசர உணர்வுடனும் தெரிவிக்கும் எளிய நவீனத் தமிழ் வடிவம்.
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  choice: ஆனாலும் எங்கள் கண்கள் உம்மையே நோக்கியிருக்கின்றன
  rationale: ‘எங்கள் கண்கள் உம்மேல்’ என்ற எபிரெய உருவகம் சார்ந்திருப்பதையும் எதிர்பார்ப்புடன் நம்புவதையும் குறிக்கிறது. தமிழில் ‘நோக்கியிருக்கின்றன’ அந்த உருவகத்தை இயல்பாகப் பாதுகாக்கிறது; ‘உம்மையே’ கவனத்தின் ஒருமுகத்தன்மையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதி כִּי தொடருக்கும் முந்தைய உதவியற்ற நிலை அறிக்கைக்கும் உள்ள தொடர்பு
  choice: முரண்பாட்டு நகர்வைத் தெளிவுபடுத்த ‘ஆனாலும்’ என்று மொழிபெயர்த்தல்
  alternative: முறைசார் வடிவில் ‘ஏனெனில் எங்கள் கண்கள் உம்மேல் இருக்கின்றன’ என்று மொழிபெயர்த்தல்
  rationale: כִּי வழக்கமாக ‘ஏனெனில்’ என்று பொருள்படலாம். ஆனால் இங்கு ‘என்ன செய்வதென்று அறியவில்லை’ என்பதிலிருந்து கடவுளை மட்டுமே சார்ந்திருக்கும் உச்சநிலைக்குச் ஜெபம் நகர்கிறது. ‘ஆனாலும்’ என்பது அந்த உறவை இயல்பான தமிழில் காட்டுகிறது; காரணவியல் வாசிப்பும் அடிப்படை உருவகமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நோக்கி மரியாதைப் பன்மையான ‘நீர்/உம்’ பயன்படுத்தப்பட்டுள்ளது. மிகப் பழமையான சொற்களும் இராணுவச் சூழலை மூலத்தைவிடக் குறிப்பாக்கும் சொற்களும் தவிர்க்கப்பட்டுள்ளன.
