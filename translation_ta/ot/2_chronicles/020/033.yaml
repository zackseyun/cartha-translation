source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹא סָ֑רוּ וְ/ע֤וֹד הָ/עָם֙ לֹא הֵכִ֣ינוּ לְבָבָ֔/ם לֵ/אלֹהֵ֖י אֲבֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
translation:
  language: ta
  text: ஆனால், உயர்ந்த வழிபாட்டு இடங்கள் அகற்றப்படவில்லை; மக்கள் இன்னும் தங்கள் இதயங்களைத் தங்கள் முன்னோர்களின் கடவுளை நோக்கி நிலைநிறுத்தவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்கள் இன்னும் தங்கள் இதயங்களைத் தங்கள் முன்னோர்களின் கடவுளை நோக்கி ஆயத்தப்படுத்தவில்லை.”
    reason: כון வினை ‘நிலைநிறுத்துதல்’ அல்லது ‘ஆயத்தப்படுத்துதல்’ எனப் பொருள்படக்கூடியதால் சொற்பொருள் மாற்று வழங்கப்படுகிறது.
lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: யோசபாத்தைப் பற்றிய நேர்மறையான மதிப்பீட்டிலிருந்து இன்னும் நீங்காத குறையைச் சுட்டும் மாறுபாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַבָּמוֹת
  choice: மேடைகள்
  rationale: எபிரெய வேதாகமத்தில் வழிபாட்டுக்காகப் பயன்படுத்தப்பட்ட உயர்ந்த இடங்களைக் குறிக்கும் மரபான சொல்; அவை அனைத்தும் எந்த வகையான வழிபாட்டிடங்கள் என உரையிலில்லாததைச் சேர்க்கவில்லை.
- source_word: לֹא סָרוּ
  choice: அகற்றப்படவில்லை
  rationale: எபிரெய வினை வடிவத்தில் ‘விலகவில்லை’ என்றிருந்தாலும், வழிபாட்டு மேடைகள் தொடர்ந்து இருந்தன என்பதைக் சூழலில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְעוֹד
  choice: இன்னும்
  rationale: தீராத நிலை தொடர்ந்து இருந்ததைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: மக்கள்தொகையைக் கூட்டாகக் குறிக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: לֹא הֵכִינוּ לְבָבָם
  choice: தங்கள் இதயங்களைத் திருப்பியிருக்கவில்லை
  rationale: כון என்பதன் causative வடிவம் இதயத்தை ஆயத்தப்படுத்துதல், நிலைப்படுத்துதல், அல்லது ஒரு திசையில் செலுத்துதல் எனப் பொருள்படலாம். தொடர்ந்து வரும் לְ முன்னிலைச்சொல்லுடன், கடவுளை நோக்கிய உள்ளார்ந்த மனப்போக்கை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  choice: தங்கள் முன்னோர்களின் கடவுளை நோக்கி
  rationale: לְ காட்டும் திசை அல்லது நோக்குநிலையைத் தெளிவாகக் காக்கிறது; ‘முன்னோர்களின் கடவுள்’ என்பது உடன்படிக்கை வரலாற்றுச் சுட்டுதலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: மக்களின் குறையின் தன்மை
  choice: வெளிப்புற வழிபாட்டுச் சீர்திருத்தம் நிறைவடையாததோடு, மக்களின் உள்ளார்ந்த பற்றும் அவர்களுடைய முன்னோர்களின் கடவுளை நோக்கித் திருப்பப்படாதிருந்ததாக வசனம் கூறுகிறது.
  alternative: மக்கள் தங்கள் இதயங்களை முன்னோர்களின் கடவுளுக்காக ஆயத்தப்படுத்தவில்லை.
  rationale: மூல எபிரெயம் வழிபாட்டு மேடைகள் நீக்கப்படாததையும் இதயத்தின் நிலைப்பாட்டையும் இணைக்கிறது. மொழிபெயர்ப்பு இதை வெறும் உணர்ச்சியாகவோ குறிப்பிட்ட பிற்காலக் கோட்பாடாகவோ குறுக்காமல், உள்ளார்ந்த நோக்குநிலையைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியத்தக்கதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. ‘மேடைகள்’ என்ற வரலாற்று-வழிபாட்டு சொல் காக்கப்பட்டுள்ளது; ‘இதயங்களைத் திருப்புதல்’ உள்ளார்ந்த நோக்குநிலையைத் தெரிவிக்கிறது. அடிக்குறி குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
