  text: וַ/יְהִי֙ פַּ֣חַד אֱלֹהִ֔ים עַ֖ל כָּל מַמְלְכ֣וֹת הָ/אֲרָצ֑וֹת בְּ/שָׁמְעָ֕/ם כִּ֚י נִלְחַ֣ם יְהוָ֔ה עִ֖ם אוֹיְבֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
translation:
  language: ta
  text: யாவே இஸ்ரவேலின் பகைவர்களுக்கு எதிராகப் போரிட்டார் என்று அவர்கள் கேள்விப்பட்டபோது, கடவுளின் அச்சம்[a] எல்லா நாடுகளின் அரசாட்சிகளின்மேலும் வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கடவுளிடமிருந்து வந்த பேரச்சம்.’ இந்த எபிரெயச் சொற்றொடர் கடவுளின் பிரசன்னம் அல்லது செயலோடு தொடர்புடைய அச்சத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: வந்தது
  rationale: தொடர்ந்து ஏற்பட்ட ஒரு நிலையை இச்சொல் குறிக்கிறது; ‘வந்தது’ என்பது அச்சம் பரவியதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פַּחַד אֱלֹהִים
  choice: கடவுளைப் பற்றிய அச்சம்
  rationale: எபிரெயக் கட்டமைப்பை நெருக்கமாகப் பேணுவதோடு, சூழலில் கடவுளின் செயலால் ஏற்பட்ட திகிலையும் உணர்த்துகிறது; அதன் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: எல்லா நாடுகளின் அரசுகள்மீதும்
  rationale: பன்மையில் உள்ள ‘நாடுகள்’ என்பதையும் அவற்றின் அரசாட்சிகளையும் தெளிவான நவீன தமிழில் தெரிவிக்கிறது; இது உலகம் முழுவதையும் கட்டாயமாகக் குறிக்காது.
- source_word: בְּשָׁמְעָם כִּי
  choice: என்று அவர்கள் கேள்விப்பட்டபோது
  rationale: முன்னிடைச்சொல்லுடன் கூடிய வினைப்பெயர் காலச்சூழலைக் குறிக்கிறது; כִּי கேட்ட செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது.
- source_word: נִלְחַם
  choice: போரிட்டார்
  rationale: சுற்றியுள்ள அரசுகள் கேள்விப்பட்ட, நிறைவுற்ற யாவேயின் போர்ச் செயலைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெய வேதாகமத்தில் வரும் கடவுளின் தனிப்பெயர்; அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: עִם אוֹיְבֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் பகைவர்களுக்கு எதிராக
  rationale: לחם என்பதுடன் עִם போரில் ஈடுபட்ட எதிர்த்தரப்பைக் குறிக்கிறது; ஆகவே தமிழில் ‘எதிராக’ என்பது பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: פַּחַד אֱלֹהִים என்பதன் தொடர்பு அல்லது மூலத்தைக் காட்டும் பொருள்
  choice: கடவுளைப் பற்றிய அச்சம்
  alternative: கடவுளிடமிருந்து வந்த பேரச்சம்
  rationale: முதன்மை உரை எபிரெயச் சொற்றொடரின் உறவுநிலைத் தெளிவின்மையை ஓரளவு பேணுகிறது; அது கடவுளின் பிரசன்னம் அல்லது செயலோடு தொடர்புடைய அச்சமாகவும், கடவுளால் உண்டாக்கப்பட்ட பேரச்சமாகவும் புரிந்துகொள்ளப்படலாம்.
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது; எனவே ‘ஆண்டவர்’ போன்ற பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரமான, எளிதில் புரியும், கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அச்சம்’ என்பது இச்சூழலின் திகிலைத் தெரிவிக்கிறது; ‘அரசுகள்’ என்பது ‘ராஜ்யங்கள்’ என்பதைக் காட்டிலும் இயல்பான தற்போதைய வழக்கு.
