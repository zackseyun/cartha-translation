base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
translation:
  language: ta
  text: அப்போது, கோகாத்தியர் மற்றும் கோராகியரின் சந்ததியாரைச் சேர்ந்த லேவியர்கள் எழுந்து நின்று, இஸ்ரவேலின் கடவுளாகிய யாவேவை மிகவும் உரத்த குரலில்[a] துதித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேரடியாக: “உரத்த குரலில் மேலாக.” இங்குள்ள எபிரெயச் சொல்லாட்சி அவர்களுடைய துதியின் ஒலி மிகுந்த உரத்ததாக இருந்ததை வலியுறுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: எழுந்து நின்று
  rationale: קום என்பதன் தொடர்கதை வடிவம் அவர்கள் உடலளவில் எழுந்து, பொதுவாகத் துதிக்க நின்ற செயலைக் குறிக்கிறது; தமிழில் ‘எழுந்து நின்று’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַלְוִיִּם
  choice: லேவியர்கள்
  rationale: லேவி கோத்திரத்தாரையும் ஆலயப் பணியுடன் தொடர்புடைய குழுவையும் குறிக்கும் வழக்கமான தமிழ் வடிவம்.
- source_word: מִן בְּנֵי הַקְּהָתִים וּמִן בְּנֵי הַקָּרְחִים
  choice: கோகாத்தியரின் வழிவந்தவர்களிலும் கோராகியரின் வழிவந்தவர்களிலும் இருந்த
  rationale: எபிரெய மொழியின் ‘மக்களிலிருந்து’ என்ற குலவழிச் சொல்லாட்சியை, இவர்கள் அந்த வம்சக் குழுக்களைச் சேர்ந்தவர்கள் என்பதைத் தெளிவாகச் சொல்லும் இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: לְהַלֵּל
  choice: துதித்தார்கள்
  rationale: הלל இங்கு நோக்கத்தைச் சுட்டும் வினையெச்சமாக வந்து புகழ்ந்து போற்றுதலைக் குறிக்கிறது. பாடுதல் என்று மூலத்தில் வெளிப்படையாக இல்லாத தகவலைச் சேர்க்காமல் ‘துதித்தார்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: לַיהוָה
  choice: யாவேவை
  rationale: יהוה என்ற தனிப்பட்ட இறைப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல், தமிழில் தெளிவான ‘யாவே’ என்ற ஒலிபெயர்ப்பில், வினையின் செயப்படுபொருளாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: யாவே யார் என்பதை விளக்கும் எபிரெய இணைப்புச் சொற்றொடரை இயல்பான தமிழ் அடைமொழித் தொடராக வழங்குகிறது.
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  choice: மிகவும் உரத்த குரலில்
  rationale: ‘பெரிய குரலில்’ என்பதையும் அதை வலுப்படுத்தும் לְמָעְלָה என்பதையும் சேர்த்து, ஒலியின் மிகுதியை இயல்பான தமிழில் தெரிவிக்கிறது; சொல்லாட்சியின் அபூர்வ தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல வசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் உடன்படிக்கையின் தனிப்பட்ட பெயராக ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மக்கள்’ என்ற நேரடி குலவழிச் சொல்லுக்குப் பதிலாக ‘வழிவந்தவர்கள்’ என்பது பொருள் தெளிவுக்காகத் தேர்ந்தெடுக்கப்பட்டது; துதித்தல் பாடலாக இருந்தது என்று வசனம் வெளிப்படையாகச் சொல்லாததால் ‘பாடித் துதித்தார்கள்’ என்று விரிவாக்கப்படவில்லை.
