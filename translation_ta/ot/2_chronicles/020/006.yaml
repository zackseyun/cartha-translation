  to: 'அவர் சொன்னார்: “எங்கள் தந்தையரின்[a] கடவுளாகிய யாவே, வானத்தில் இருக்கும் கடவுள் நீர்தானே? எல்லா தேசங்களின் ராஜ்யங்களையும் ஆளுகிறவர் நீர்தானே? உமது கையில் வல்லமையும் பராக்கிரமமும் உள்ளன; உம்மை எதிர்த்து நிற்க[b] யாராலும் முடியாது.”'
  rationale: திருத்தம் மூலத்தின் இரு உறுதிப்படுத்தும் வினாக்களையும், யாவே என்ற பெயரையும், தந்தையர் என்ற பாலினக் குறிப்பையும் மாற்றாமல் காக்கிறது. ‘தேசங்களின் ராஜ்யங்கள்’ என்பது எபிரெய அரசியல் சொல்லாட்சிக்கு நெருக்கமானது; வானத்தைக் குறிக்கும் அடையாளத் தொடர் இயல்பாக்கப்பட்டது; இறுதி அடிக்குறிப்பு எதிர்த்து நில்லுதல் என்ற மூலப் பொருளோடு ஒத்திசைக்கப்பட்டது.
