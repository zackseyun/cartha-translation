source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י אֲבֹתֵ֨י/נוּ֙ הֲ/לֹ֨א אַתָּֽה ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֔יִם וְ/אַתָּ֣ה מוֹשֵׁ֔ל בְּ/כֹ֖ל מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וּ/בְ/יָדְ/ךָ֙ כֹּ֣חַ וּ/גְבוּרָ֔ה וְ/אֵ֥ין עִמְּ/ךָ֖ לְ/הִתְיַצֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
translation:
  language: ta
  text: 'அவர் சொன்னார்: “எங்கள் தந்தையரின்[a] கடவுளாகிய யாவே, வானத்தில் இருக்கும் கடவுள் நீர்தானே? எல்லா தேசங்களின் ராஜ்யங்களையும் ஆளுகிறவர் நீர்தானே? உமது கையில் வல்லமையும் பராக்கிரமமும் உள்ளன; உம்மை எதிர்த்து நிற்க[b] யாராலும் முடியாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் முன்னோரின்.” எபிரெயத்தில், “எங்கள் தந்தையரின்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உம்மை எதிர்த்து யாரும் நிலைநிற்க முடியாது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: அவர் சொன்னார்
  rationale: தொடர்ந்து வரும் உரையின் பேச்சாளரைத் தமிழில் இயல்பாகக் குறிப்பதற்காக எபிரெய வினையில் உட்பொதிந்துள்ள மூன்றாம் நபர் ஒருமை வெளிப்படையாக மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது கடவுளின் தனிப்பட்ட உடன்படிக்கைப் பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர்; அதனை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் ஒலிபெயர்த்தது.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: எங்கள் தந்தையரின் கடவுள்
  rationale: எபிரெயச் சொற்றொடரின் உறவுமுறையையும் ஆண்பால் பன்மையான ‘தந்தையர்’ என்பதையும் காக்கிறது; பொதுவான பொருளில் ‘முன்னோர்’ என்றும் புரிந்துகொள்ளலாம்.
- source_word: הֲלֹא
  choice: நீர்தானே?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் வினாவின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: אֱלֹהִים בַּשָּׁמַיִם
  choice: வானத்தில் கடவுள்
  rationale: கடவுளின் பரலோக ஆட்சியைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது; எபிரெயத்தில் ‘வானங்கள்’ என்பது பன்மை வடிவில் இருந்தாலும் தமிழில் ‘வானத்தில்’ இயல்பான வழக்கு.
- source_word: מוֹשֵׁל
  choice: ஆளுகிறவர்
  rationale: தொடர்ச்சியான அரசாட்சியையும் இறையாண்மையையும் குறிக்கும் எபிரெயப் பெயரெச்ச வினையின் பொருளை வெளிப்படுத்துகிறது.
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: பிற இனத்தாரின் எல்லா அரசுகள்
  rationale: מַמְלְכוֹת என்பதற்கு ‘அரசுகள்’ என்றும் הַגּוֹיִם என்பதற்கு இச்சூழலில் யூதாவுக்கு வெளியேயுள்ள மக்கள் இனங்களைக் குறிக்கும் ‘பிற இனத்தார்’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: וּבְיָדְךָ
  choice: உமது கையில்
  rationale: செயலாற்றும் அதிகாரம் கடவுளின் கையில் உள்ளது என்ற எபிரெய உருவகத்தை அப்படியே காக்கிறது.
- source_word: כֹּחַ וּגְבוּרָה
  choice: வல்லமையும் பராக்கிரமமும்
  rationale: ஆற்றலையும் எதிர்ப்பை வெல்லும் வீர வலிமையையும் குறிக்கும் இணைச்சொற்களின் உயர்ந்த கவித்துவத் தொனியைப் பேணுகிறது.
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  choice: உம்மை எதிர்த்து நிற்க யாராலும் முடியாது
  rationale: இச்சூழலில் יצב என்பது எதிர்ப்புடன் நிலைகொள்வதைக் குறிக்கிறது; தமிழில் அதன் எதிர்மறை வல்லமைப் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: אֲבֹתֵינוּ என்பதிலுள்ள பாலினம் குறித்த உடன்படிக்கை மொழி
  choice: எங்கள் தந்தையர்
  alternative: எங்கள் முன்னோர்
  rationale: மூல எபிரெயம் ஆண்பால் பன்மையைப் பயன்படுத்துவதால் அதனை முதன்மை உரையில் காத்து, பரந்த பொருளான ‘முன்னோர்’ என்பதை அடிக்குறிப்பில் வழங்குகிறது.
- issue: הֲלֹא தொடங்கும் வினாவின் தன்மை
  choice: உறுதிப்படுத்தும் வினாவாகப் பேணுதல்
  alternative: ‘நிச்சயமாக நீரே’ என்ற நேரடி உறுதிக்கூற்று
  rationale: மூலத்தின் வினா வடிவமும் அதன் வழிபாட்டு மொழிக்குரிய அழுத்தமும் காக்கப்பட்டன; அதனை வெறும் கூற்றாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டது. ஜெபத்தில் கடவுளை நோக்கிப் பேசும் மரியாதை ஒருமைக்காக ‘நீர்/உமது/உம்மை’ வடிவங்கள் பயன்படுத்தப்பட்டன. மூலத்தின் இரு உறுதிப்படுத்தும் வினாக்களும் இறுதி வல்லமைக்கூற்றும் இயல்பான தமிழ் ஓட்டத்தில் பேணப்பட்டன.
