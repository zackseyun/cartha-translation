  naturalness: ‘வானத்தில் கடவுள் நீர்தானே?’ என்ற தொடர் நவீனத் தரமான தமிழில் சற்றே இயல்பற்றது; ‘வானத்தில் இருக்கும் கடவுள் நீர்தானே?’ இயல்பாகவும் மூலப்பொருளுக்கு நேர்மையாகவும் உள்ளது. ‘ராஜ்யங்கள்’ என்பது இவ்வரலாற்று-அரசியல் சூழலில் ‘அரசுகள்’ என்பதைக் காட்டிலும் தெளிவானது.
