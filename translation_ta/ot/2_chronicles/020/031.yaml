  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּמְלֹ֥ךְ יְהוֹשָׁפָ֖ט עַל יְהוּדָ֑ה בֶּן שְׁלֹשִׁים֩ וְ/חָמֵ֨שׁ שָׁנָ֜ה בְּ/מָלְכ֗/וֹ וְ/עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: ta
  text: யோசபாத் யூதாவின்மேல் அரசாண்டார். அவர் ஆட்சி செய்யத் தொடங்கியபோது முப்பத்தைந்து வயதுடையவராக இருந்தார்; அவர் எருசலேமில் இருபத்தைந்து ஆண்டுகள் அரசாண்டார். அவருடைய தாயின் பெயர் அசூபா; அவர் சில்கியின் மகள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: ஆட்சி செய்தார்
  rationale: מלך என்ற வினை அரசராக ஆளுவதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான அரசாட்சி அறிவிப்பாக இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: עַל יְהוּדָה
  choice: யூதாவை ஆட்சி செய்தார்
  rationale: מלך உடன் வரும் עַל ஆளப்பட்ட நாட்டைக் குறிக்கிறது; தமிழில் ‘யூதாவை ஆட்சி செய்தார்’ என்பது இயல்பான அமைப்பு.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: அவருக்கு முப்பத்தைந்து வயது
  rationale: ‘முப்பத்தைந்து ஆண்டுகளின் மகன்’ என்ற எபிரெய வயது மரபுத்தொடர், பொருளைத் துல்லியமாகத் தரும் இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּמָלְכוֹ
  choice: அவர் ஆட்சிசெய்யத் தொடங்கியபோது
  rationale: בְּ உடன் வரும் מלך வினையின் infinitive construct அரசேற்றத்தின் காலத்தைக் குறிக்கிறது.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: அவர் இருபத்தைந்து ஆண்டுகள் ஆட்சி செய்தார்
  rationale: ஆட்சிக்காலத்தின் நீளத்தை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: ஆட்சி நடைபெற்ற அரசத் தலைநகரின் இடத்தைக் குறிக்கும் நேரடி மொழிபெயர்ப்பு.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவருடைய தாயின் பெயர்
  rationale: எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழ் உடைமை அமைப்பில் வழங்குகிறது.
- source_word: עֲזוּבָה
  choice: அசூபாள்
  rationale: எபிரெயப் பெயரின் ஒலியைத் தமிழில் அண்மையாகப் பெயர்த்தெழுதி, இறுதி ה ஒலியற்றதையும் עֲזוּבָה-வின் z ஒலியையும் கருத்தில் கொண்டுள்ளது.
- source_word: בַּת שִׁלְחִי
  choice: அவர் சில்கியின் மகள்
  rationale: בַּת என்பது மகள் உறவைக் குறிக்கிறது; שִׁלְחִי என்ற பெயர் எபிரெய ஒலிப்புக்கு அண்மையாக ‘சில்கி’ எனப் பெயர்த்தெழுதப்பட்டுள்ளது.
