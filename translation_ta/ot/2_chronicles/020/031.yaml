translation_notes:
  register: நவீன நிலையான தமிழில், வேதாகம வரலாற்றுப் பதிவுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. அரசாட்சி குறித்த எபிரெய மரபுச் சூத்திரம் தமிழில் இயல்பாக அமையச் செய்யப்பட்டுள்ளது.
