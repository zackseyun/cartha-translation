  text: הֲ/לֹ֣א אַתָּ֣ה אֱלֹהֵ֗י/נוּ הוֹרַ֨שְׁתָּ֙ אֶת יֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/לִּ/פְנֵ֖י עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַֽ/תִּתְּנָ֗/הּ לְ/זֶ֛רַע אַבְרָהָ֥ם אֹֽהַבְ/ךָ֖ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
translation:
  language: ta
  text: எங்கள் கடவுளே, நீர்தாமே உமது மக்களான இஸ்ரவேலருக்கு முன்பாக இந்த நாட்டின் குடிகளை வெளியேற்றி, அதை உமது நண்பரான[a] ஆபிரகாமின் சந்ததிக்கு என்றென்றும் கொடுத்தீர் அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இன்னும் நேரடியாக, “உம்மை நேசித்தவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא אַתָּה
  choice: நீர்தாமே ... அல்லவா?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் எபிரெய மறுப்புவடிவ வினாவை இயல்பான தமிழ் வலியுறுத்தல் வினாவாகக் காட்டுகிறது.
- source_word: אֱלֹהֵינוּ
  choice: எங்கள் கடவுளே
  rationale: ஜெபத்தில் இடம்பெறும் நேரடி அழைப்பைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: הוֹרַשְׁתָּ
  choice: துரத்தி
  rationale: முந்தைய குடிகளை அவர்களுடைய உடைமையிலிருந்து அகற்றும் ירשׁ என்பதன் காரணவினைப் பொருளையும் வெற்றிகொள்ளும் சூழலையும் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: இந்த நாட்டின் குடிகளை
  rationale: ‘இந்த நாட்டில் குடியிருப்பவர்கள்’ என்ற மூலப்பொருளை வாசிப்புக்கு இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִלִּפְנֵי עַמְּךָ יִשְׂרָאֵל
  choice: உமது மக்களான இஸ்ரவேலருக்கு முன்பாக
  rationale: இஸ்ரவேலரின் முன்னேற்றத்திற்கு முன்னிருந்து மக்கள் அகற்றப்பட்டார்கள் என்ற வெற்றிகொள்ளும் சூழலின் இடவியல் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: וַתִּתְּנָהּ
  choice: அதை ... கொடுத்தீர்
  rationale: பெண்பால் ஒருமை சுட்டுப்பெயர் முன் குறிப்பிடப்பட்ட நாட்டைக் குறிக்கிறது; தமிழில் ‘அதை’ தெளிவாக உள்ளது.
- source_word: לְזֶרַע אַבְרָהָם
  choice: ஆபிரகாமின் சந்ததிக்கு
  rationale: זֶרַע என்பதன் கூட்டு ஒருமைப் பொருளை தமிழின் ‘சந்ததி’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: אֹהַבְךָ
  choice: உமது நண்பரான
  rationale: ஆபிரகாமைக் குறிக்கும் உறவுசார் அடைமொழியை இயல்பான தமிழில் தருகிறது; ‘உம்மை நேசித்தவர்’ என்ற நேரடியான வினைசார் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தைக் குறிக்கும் உடன்படிக்கைச் சூழலுக்கு ஏற்ற, தெளிவான தமிழ் சொல்.
theological_decisions:
- issue: ஆபிரகாமுக்கான אֹהַבְךָ என்ற அடைமொழி
  choice: உமது நண்பரான
  alternative: உம்மை நேசித்தவரான
  rationale: சூழலிலும் வேதாகமத்தின் பிற இடங்களிலும் இது கடவுளுடன் ஆபிரகாமுக்கு இருந்த உறவைச் சுட்டும் அடைமொழியாகப் புரிந்துகொள்ளப்படுகிறது. அதேவேளை, எபிரெய பங்கேற்புவினையின் நேரடியான ‘உம்மை நேசித்தவர்’ என்ற பொருளை அடிக்குறிப்பு காட்டி, உண்மையான மொழியியல் நுணுக்கத்தை மறைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், ஜெபத்திற்குரிய கண்ணியமான ‘நீர்/உமது’ மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் வலியுறுத்தப்பட்ட சொல்லாட்சியை ‘நீர்தாமே ... அல்லவா?’ என்ற இயல்பான தமிழ் வினாவடிவம் பிரதிபலிக்கிறது.
