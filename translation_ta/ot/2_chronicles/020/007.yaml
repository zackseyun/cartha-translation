  naturalness: மரியாதை ஒருமையுடனான ஜெப நடையும் வினாவும் இயல்பாக உள்ளன. திருத்தப்பட்ட சொற்றொடர் நவீன தரத் தமிழில் சீராக வாசிக்கப்படுகிறது. அடிக்குறிப்பிலுள்ள மேற்கோள் மட்டும் முதலில் பெயரெச்ச வடிவில் முழுமையற்றதாக இருந்தது; அதை முழுமையான பெயர்ச்சொல் வடிவமாகச் சரிசெய்துள்ளோம்.
