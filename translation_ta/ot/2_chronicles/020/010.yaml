base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
translation:
  language: ta
  text: இப்போதோ, இதோ, அம்மோன் மக்களும் மோவாபியரும் சேயீர் மலைநாட்டவர்களும்[a] இருக்கிறார்கள்; இஸ்ரவேலர் எகிப்து நாட்டிலிருந்து வந்தபோது, இவர்களுக்கு எதிராக நுழைய நீர் அவர்களை அனுமதிக்கவில்லை[b]. ஏனெனில், இஸ்ரவேலர் இவர்களைவிட்டு விலகிச் சென்று, இவர்களை அழிக்கவில்லை—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “அம்மோனின் மக்களும் மோவாபும் சேயீர் மலையும்.” இங்கு மோவாபும் சேயீர் மலையும் அந்த இடங்களைச் சேர்ந்த மக்களைக் குறிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, “இஸ்ரவேல் இவர்களுக்குள்/இவர்களுக்கு எதிராக நுழைய நீர் கொடுக்கவில்லை”; சூழலில், இவர்களைத் தாக்குவதற்கான நுழைவை தேவன் அனுமதிக்கவில்லை என்பது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போதோ
  rationale: முந்தைய வேண்டுதலோடு இணைத்து, தற்போதைய நெருக்கடியை முன்வைக்கும் இணைப்பு மற்றும் காலச் சுட்டு இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை உடனடியாகத் தற்போதைய நிலைமையின்மீது திருப்பும் எபிரேயச் சொல்லின் சுட்டும் வலியுறுத்தலும் காக்கப்படுகின்றன.
- source_word: בְנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  choice: அம்மோன் மக்களும் மோவாபியரும் சேயீர் மலைநாட்டினரும்
  rationale: בְנֵי עַמּוֹן என்பதன் இனக்குழுப் பொருளை ‘அம்மோன் மக்கள்’ என்றும், மோவாப் மற்றும் சேயீர் மலையைச் சூழலுக்கேற்ற மக்களைக் குறிக்கும் வகையிலும் இயல்பான தமிழில் தருகிறது; சொல்லாட்சியின் வேறுபாடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: אֲשֶׁר לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  choice: இவர்களுக்கு எதிராகப் படையெடுக்க நீர் அவர்களை அனுமதிக்கவில்லை
  rationale: ‘அவர்களுக்குள்/அவர்களுக்கு எதிராக நுழையக் கொடுக்கவில்லை’ என்ற எபிரேய அமைப்பு சூழலில் இராணுவ நடவடிக்கைக்கான அனுமதி மறுக்கப்பட்டதைக் குறிக்கிறது. ‘படையெடுக்க’ என்பது பொருளைத் தெளிவாக்குகிறது; நேரடி சொல்லமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּבֹאָם מֵאֶרֶץ מִצְרָיִם
  choice: இஸ்ரவேலர் எகிப்து நாட்டிலிருந்து வந்தபோது
  rationale: ‘அவர்கள்’ என்பதன் சுட்டுப்பொருள் குழப்பமடையாமல் இஸ்ரவேலரைத் தெளிவாகக் குறிப்பிடுகிறது; கால உறவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם
  choice: ஆகவே அவர்கள் இவர்களைவிட்டு விலகிச் சென்று
  rationale: இஸ்ரவேலர் தாக்காமல் தங்கள் பாதையை மாற்றிச் சென்றதைச் சூழலுக்கு ஏற்றபடி காட்டுகிறது. כִּי இங்கு முந்தைய தடை/அனுமதியின்மையின் விளைவை விளக்கும் தொடர்பாகப் புரிந்துகொள்ளப்பட்டுள்ளது.
- source_word: וְלֹא הִשְׁמִידוּם
  choice: இவர்களை அழிக்கவில்லை
  rationale: שׁמד என்பதன் போர்ச் சூழலிலான வலுவான அழித்தல் பொருளை மிகைப்படுத்தாமல் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: தேவனை நோக்கிய இரண்டாம் நபர் உரையைப் பாதுகாத்தல்
  choice: நீர் ... அனுமதிக்கவில்லை
  alternative: கர்த்தர் ... அனுமதிக்கவில்லை
  rationale: இந்த வசனம் தேவனை நோக்கிய நேரடி ஜெபத்தின் பகுதி. ஆகவே எபிரேய இரண்டாம் நபரை மூன்றாம் நபர் தெய்வப் பெயராக மாற்றாமல் வைத்துள்ளது.
- issue: இராணுவ நுழைவைக் குறிக்கும் மொழியின் வலிமை
  choice: எதிராகப் படையெடுக்க
  alternative: எதிராக நுழைய
  rationale: சூழல் தாக்குதலுக்கான நுழைவைச் சுட்டுகிறது; தமிழில் வெறும் ‘நுழைய’ என்பது நோக்கத்தை மறைக்கலாம். இருப்பினும் மூலத்தின் நேரடியான உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்குரிய கண்ணியமான நேரடி உரை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்’ என்பது தேவனை நோக்கிய மரியாதை ஒருமையைத் தக்கவைக்கிறது. மூல வசனத்தின் முடிவிலுள்ள தொடரும் வாக்கிய அமைப்பைக் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது; வாசிப்புத் தெளிவுக்காக எபிரேயத்தின் நீண்ட தொடர் மூன்று வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது.
