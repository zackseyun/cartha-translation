  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
translation:
  language: ta
  text: 'மக்களோடு ஆலோசித்த பின்பு, அவர் யாவேக்குப் பாடுகிறவர்களை நியமித்தார். அவர்கள் பரிசுத்த மகிமையைப் புகழ்ந்துகொண்டு[a], முன்செல்லும் படைப்பிரிவுக்கு முன்பாகச் சென்றபோது[b],


    “யாவேக்கு நன்றி செலுத்துங்கள்;

    ஏனெனில், அவரது மாறாத அன்பு என்றென்றும் நிலைத்திருக்கும்[c]”


    என்று கூறினார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பரிசுத்த மகிமை” என்பதை “பரிசுத்த அழகு” அல்லது “பரிசுத்தமான மகிமை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “முன்செல்லும் படைப்பிரிவு” என்பதை “முன்னணிப் படை” அல்லது “போரணியின் முன்வரிசை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “மாறாத அன்பு” என்பதை “இரக்கம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் חֶסֶד (ஹெசெத்) நிலைத்த அன்பு, பற்றுறுதி, இரக்கம் ஆகிய பொருள் நிழல்களைக் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל־הָעָם
  choice: மக்களோடு ஆலோசித்த பின்பு
  rationale: Niphal வடிவம் மக்களுடன் ஆலோசனை செய்ததைக் குறிக்கிறது; நிகழ்வுகளின் தொடரையும் மக்களின் பங்கேற்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיַּעֲמֵד מְשֹׁרֲרִים
  choice: பாடுகிறவர்களை நியமித்தார்
  rationale: Hiphil וַיַּעֲמֵד இச்சூழலில் ஒரு பணிக்காக நியமித்தல் என்ற பொருளைக் கொண்டது; מְשֹׁרֲרִים குறிப்பாகப் பாடுகிறவர்களைக் குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பொதுப் பட்டப்பெயராக மாற்றாமல், நவீன தமிழில் அடையாளம் காணக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: וּמְהַלְלִים לְהַדְרַת־קֹדֶשׁ
  choice: அவர்கள் பரிசுத்தத்தின் மகிமையைப் புகழ்ந்துகொண்டு
  rationale: பாடுகிறவர்களை விளக்கும் பங்கேற்புச் சொற்றொடராக எடுத்துக்கொண்டு, הֲדָרָה என்பதன் மகிமை/அழகு சார்ந்த பொருளையும் קֹדֶשׁ என்பதன் பரிசுத்தத்தையும் காக்கிறது. இத்தொடரின் வேறு சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּצֵאת לִפְנֵי הֶחָלוּץ
  choice: முன்னணிப் படைக்கு முன்பாகச் சென்றபோது
  rationale: בְּ + infinitive construct ஒரே நேரத்தில் நிகழும் செயலைக் குறிக்கிறது; הֶחָלוּץ முழுப் படையை அல்ல, முன்செல்லும் ஆயுதப்படைப் பிரிவைக் குறிக்கிறது.
- source_word: הוֹדוּ לַיהוָה
  choice: யாவேக்கு நன்றி செலுத்துங்கள்
  rationale: வழிபாட்டுச் சூழலில் Hiphil ידה நன்றி செலுத்துதல் அல்லது புகழ்தல் எனப் பொருள்படும்; அடுத்த காரணவாக்கியத்துடன் 'நன்றி செலுத்துங்கள்' இயல்பாகப் பொருந்துகிறது.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: ஏனெனில், அவரது மாறாத அன்பு என்றென்றும் நிலைத்திருக்கும்
  rationale: חֶסֶד என்பதில் அன்பு, இரக்கம், பற்றுறுதி ஆகிய கூறுகள் உள்ளன; 'மாறாத அன்பு' அதன் நிலைத்த, உறவுப்பற்றுள்ள தன்மையை எளிய தமிழில் வெளிப்படுத்துகிறது. வினையற்ற எபிரெய வாக்கியம் இயல்பான தமிழுக்காக 'நிலைத்திருக்கும்' என நிறைவு செய்யப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயரே பயன்படுத்தப்பட்டுள்ளது. அதனை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது, உரையின் உடன்படிக்கைப் பெயர் சார்ந்த தன்மையைப் பாதுகாக்கிறது.
- issue: חֶסֶד என்பதன் பலபொருள் தன்மை
  choice: மாறாத அன்பு
  alternative: இரக்கம்; உடன்படிக்கைப் பற்றுறுதி
  rationale: ஒரே குறிப்பிட்ட கோட்பாட்டு விளக்கத்துக்குள் சொல்லைச் சுருக்காமல், அதன் நீடித்த அன்பையும் பற்றுறுதியையும் முதன்மைப்படுத்துகிறது; மற்ற பொருள் நிழல்கள் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கவிதை மேற்கோள் தனி வரிகளாக அமைக்கப்பட்டுள்ளது. மூலத்தின் பங்கேற்புச் சொற்றொடர்களை இயல்பான தமிழாக்கத்துக்காகச் சார்பு மற்றும் காலவாக்கியங்களாக மாற்றியிருந்தாலும், செயல்களின் வரிசையும் பொருள்சார் தெளிவின்மைகளும் பாதுகாக்கப்பட்டுள்ளன.
