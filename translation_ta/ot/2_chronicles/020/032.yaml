reference: 2 Chronicles 20:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֛רֶךְ אָבִ֥י/ו אָסָ֖א וְ/לֹא סָ֣ר מִמֶּ֑/נָּה לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/032.yaml
  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: ta
  text: அவன் தன் தந்தை ஆசாவின் வழியில் நடந்து, அதைவிட்டு விலகாமல், யாவேவின் பார்வையில் சரியானதைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: நடந்து
  rationale: הלך இங்கு அரசனின் வாழ்க்கை நடத்தையைச் சுட்டும் உருவகப் பயன்பாடு. ‘நடந்து’ என்பது எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְּדֶרֶךְ
  choice: வழியில்
  rationale: דֶּרֶךְ இங்கு நடத்தை அல்லது வாழ்வுமுறையைக் குறிக்கிறது; ‘வழியில்’ என்பது அந்த உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אָבִיו אָסָא
  choice: தன் தந்தை ஆசாவின்
  rationale: ஆசா அவனுடைய தந்தை என்பதைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: וְלֹא סָר מִמֶּנָּה
  choice: அதைவிட்டு விலகாமல்
  rationale: סור מן என்பது ஒரு வழியிலிருந்து விலகுவதைக் குறிக்கிறது. இத்தேர்வு முந்தைய ‘வழி’ உருவகத்தைத் தொடர்கிறது.
- source_word: לַעֲשׂוֹת
  choice: செய்தான்
  rationale: ל prefixed infinitive இங்கு அவன் அந்த வழியில் நிலைத்திருந்ததன் செயல்பாட்டு விளைவை எடுத்துரைக்கிறது; தமிழில் முதன்மை வினையுடன் இணைப்பது இயல்பாக உள்ளது.
- source_word: הַיָּשָׁר
  choice: சரியானதை
  rationale: יָשָׁר இச்சூழலில் ஒழுக்கரீதியாக நேரான அல்லது சரியானதைச் சுட்டுகிறது. ‘சரியானதை’ என்பது சாதாரண வாசகர்களுக்குத் தெளிவான நவீனத் தமிழ்.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேவின் பார்வையில்
  rationale: ‘கண்களில்’ என்ற சொற்படிமத்தைத் தமிழில் இயல்பான தெய்வீக மதிப்பீட்டு மொழியாக ‘பார்வையில்’ வழங்குகிறது; יהוה என்ற திருப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் உடன்படிக்கைப் பெயரான நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் மதிப்புமிக்க நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வழியில் நடந்து’ என்ற எபிரெய நடத்தை உருவகம் பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற விளக்கச் சேர்க்கைகள் தவிர்க்கப்பட்டுள்ளன.
