translation_notes:
  register: நவீன பொதுத்தமிழில், உரையின் அரசவைக் கண்ணியத்துக்கு ஏற்ற மிதமான உயர்நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் ‘முன்பாக நிற்றல்’ என்ற உருவகம் முதன்மை உரையில் வைக்கப்பட்டு, அதன் அரசவைச் சேவை சார்ந்த உட்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
