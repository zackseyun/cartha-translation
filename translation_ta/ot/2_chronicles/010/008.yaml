source:
  edition: WLC
  text: וַֽ/יַּעֲזֹ֛ב אֶת עֲצַ֥ת הַ/זְּקֵנִ֖ים אֲשֶׁ֣ר יְעָצֻ֑/הוּ וַ/יִּוָּעַ֗ץ אֶת הַ/יְלָדִים֙ אֲשֶׁ֣ר גָּדְל֣וּ אִתּ֔/וֹ הָ/עֹמְדִ֖ים לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: ta
  text: ஆனால், அவன் முதியோர் தனக்கு அளித்த ஆலோசனையைக் கைவிட்டு, தன்னுடன் வளர்ந்தவர்களும் அவன் முன் நின்றவர்களுமான இளைஞர்களோடு ஆலோசனை செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: புறக்கணித்துவிட்டு
  rationale: עָזַב என்பதன் அடிப்படைப் பொருள் ‘விட்டுவிடுதல்/கைவிடுதல்.’ இங்கு அவன் அந்த ஆலோசனையை ஏற்காமல் வேறொரு குழுவை நாடுவதால், ‘புறக்கணித்துவிட்டு’ என்பது சூழலின் வலிமையையும் தொடர்ச்சியையும் இயல்பான தமிழில் தருகிறது.
- source_word: עֲצַת הַזְּקֵנִים
  choice: முதியோர் ... ஆலோசனை
  rationale: עֵצָה என்பது ‘ஆலோசனை’; זְקֵנִים என்பது வயதிலும் அனுபவத்திலும் மூத்த ஆலோசகர்களைக் குறிக்கிறது. ‘முதியோர்’ வயதையும் மதிப்புக்குரிய மூத்த நிலையையும் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: தனக்குக் கூறிய
  rationale: ‘அவர்கள் அவனுக்கு ஆலோசனை கூறினார்கள்’ என்ற பொருளை, ஏற்கெனவே ‘ஆலோசனை’ வந்திருப்பதால் தேவையற்ற சொல் மறுபடியும் வராமல் இயல்பாக வழங்குகிறது.
- source_word: וַיִּוָּעַץ אֶת
  choice: '...ஓடு ஆலோசனை செய்தான்'
  rationale: நிபால் வடிவம் மற்றவர்களுடன் கலந்தாலோசிப்பதை இங்கு குறிக்கிறது; ‘ஆலோசனை செய்தான்’ என்பது பரஸ்பரக் கலந்துரையாடல் என்ற திறந்த பொருளைப் பாதுகாக்கிறது.
- source_word: הַיְלָדִים
  choice: இளைஞர்கள்
  rationale: יְלָדִים என்பதற்கு பிள்ளைகள் அல்லது இளம் ஆண்கள் எனப் பொருள் வரலாம். அரசனுடன் வளர்ந்து அரண்மனையில் அவன் முன் நிற்பவர்கள் என்பதால் ‘இளைஞர்கள்’ சூழலுக்கு ஏற்றது.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: தன்னுடன் வளர்ந்தவர்கள்
  rationale: அரசனோடு சேர்ந்து வளர்ந்த சமவயதினரைக் குறிக்கும் எபிரெயச் சொற்றொடரை நேராகவும் இயல்பாகவும் தருகிறது.
- source_word: הָעֹמְדִים לְפָנָיו
  choice: தனக்கு முன்பாக நின்றுவந்தவர்கள்
  rationale: ‘அவனுக்கு முன் நிற்பவர்கள்’ என்ற எபிரெய உருவகத்தை முதன்மை உரையில் காக்கிறது; அரண்மனைப் பணியில் அவனிடம் ஆஜராகி சேவித்தல் என்ற மரபுத்தொடர்ப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
