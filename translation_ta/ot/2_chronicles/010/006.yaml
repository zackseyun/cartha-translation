base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: ta
  text: அப்போது அரசன் ரெகொபெயாம், தன் தந்தையான சாலொமோன் உயிரோடிருந்தபோது அவருக்கு முன்பாக நின்று பணியாற்றிய மூப்பர்களிடம் ஆலோசனை கேட்டான்.[a] அவர்களிடம், “இந்த மக்களுக்குப் பதில் சொல்வதற்கு நீங்கள் என்ன ஆலோசனை கூறுகிறீர்கள்?”[b] என்று கேட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவருக்கு முன்பாக நின்று” என்பது சாலொமோனிடம் அதிகாரபூர்வமாகப் பணியாற்றியதையோ அவருக்குப் பணிவிடை செய்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “இந்த மக்களுக்குப் பதிலாக ஒரு சொல்லைத் திருப்பிக் கொடுக்க நீங்கள் எவ்வாறு ஆலோசனை கூறுகிறீர்கள்?” எபிரெய மரபுத்தொடர் பதில் சொல்வதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: ஆலோசனை கேட்டான்
  rationale: இங்குள்ள נפעל வடிவம், தனக்குள் சிந்தித்ததை அல்லாமல் மற்றவர்களிடம் அறிவுரை கேட்டதைக் குறிக்கிறது. ‘ஆலோசனை கேட்டான்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: הַזְּקֵנִים
  choice: மூப்பர்கள்
  rationale: இந்தச் சூழலில் வயதில் மூத்தவர்களாகவும் அரசரின் அனுபவமிக்க ஆலோசகர்களாகவும் இருந்தவர்களைக் குறிக்கிறது. ‘மூப்பர்கள்’ நேரடியானதும் சூழலுக்கு ஏற்றதுமான சொல்.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  choice: அவர் முன்னிலையில் நின்று பணியாற்றியிருந்த
  rationale: ‘ஒருவரின் முன்னிலையில் நிற்பது’ என்ற எபிரெயச் சொற்றொடர், உயர்நிலையில் உள்ள ஒருவருக்குப் பணிவிடை செய்வதையோ அதிகாரபூர்வமாகப் பணியாற்றுவதையோ குறிக்கலாம். தமிழ் வாசகருக்குப் பொருள் தெளிவாக இருக்க ‘பணியாற்றியிருந்த’ சேர்க்கப்பட்டு, மூலப்படிமமும் தக்கவைக்கப்பட்டது.
- source_word: שְׁלֹמֹה אָבִיו
  choice: தன் தந்தை சாலொமோன்
  rationale: ரெகொபெயாமுக்கும் சாலொமோனுக்கும் உள்ள உறவைத் தெளிவாகவும் இயல்பான தமிழ் சொல் வரிசையிலும் தருகிறது.
- source_word: בִּהְיוֹתוֹ חַי
  choice: உயிரோடிருந்தபோது
  rationale: சாலொமோன் உயிருடன் இருந்த காலத்தைக் குறிக்கும் நேரச் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: நான் என்ன ... வேண்டும் என்று நீங்கள் ஆலோசனை கூறுகிறீர்கள்
  rationale: அவர்களுடைய ஆலோசனையை ரெகொபெயாம் கேட்கிறான். தமிழில் கேள்வியின் நோக்கத்தை இயல்பாக வெளிப்படுத்த, மூலத்தில் மறைமுகமாக உள்ள முதல் நபர் பொருள் ‘நான்’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לְהָשִׁיב לָעָם הַזֶּה דָּבָר
  choice: இந்த மக்களுக்கு ... என்ன பதில் சொல்ல
  rationale: சொல்லுக்குச் சொல் ‘இந்த மக்களுக்கு ஒரு வார்த்தையைத் திருப்பிக் கொடுக்க’ என்பதாக இருந்தாலும், இது பதிலளிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘பதில் சொல்ல’ என்பது அதன் இயல்பான தமிழ் இணை.
