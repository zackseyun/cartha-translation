translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான வேதாகம நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘அவர் முன்னிலையில் நின்று’ என்ற எபிரெயப் படிமம் தக்கவைக்கப்பட்டு, அதன் பணிசார் பொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் தெளிவாக்கப்பட்டுள்ளது. நேரடி உரை சாதாரண வாசகருக்கு இயல்பாகப் புரியும் கேள்வி வடிவில் அமைக்கப்பட்டுள்ளது.
