  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘நுகம்’ மற்றும் ‘தேள்கள்’ என்ற மூல உருவகங்கள் பாதுகாக்கப்பட்டன; ‘நானோ’ எதிர்மறை ஒப்பீட்டின் வலிமையை இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இணைக்கப்பட்டுள்ளது.
