source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֗ם כַּ/עֲצַ֤ת הַ/יְלָדִים֙ לֵ/אמֹ֔ר אַכְבִּיד֙ אֶֽת עֻלְּ/כֶ֔ם וַ/אֲנִ֖י אֹסִ֣יף עָלָ֑י/ו אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֖י בָּ/עֲקְרַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
translation:
  language: ta
  text: அவன் அந்த இளைஞர்களின் ஆலோசனைப்படி அவர்களிடம், “நான் உங்கள் நுகத்தை இன்னும் கனமாக்குவேன்; அதன் சுமையை மேலும் அதிகரிப்பேன். என் தந்தை உங்களைச் சாட்டைகளால் தண்டித்தார்; நானோ தேள்களால்[a] தண்டிப்பேன்” என்று பேசினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேள்-சாட்டைகளால்’ எனப் பொருள்கொள்ளலாம்; அதாவது கூர்முனைகள் அல்லது முட்கள் பொருத்தப்பட்ட சாட்டைகள். எபிரெய மொழியில் நேரடியாக ‘தேள்களால்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினான்
  rationale: דבר என்பதன் இயல்பான பொருள் ‘பேசுதல்’. சூழலில் இது பதிலுரையாக இருந்தாலும், எபிரெயச் சொல்லுக்கு நெருக்கமாக ‘பேசினான்’ என வழங்கப்பட்டது.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: அந்த இளைஞர்களின் ஆலோசனைப்படி
  rationale: עֵצָה என்பது ஆலோசனை; כ முன்னொட்டு ‘அதன்படி’ என்ற பொருளைத் தருகிறது. הַיְלָדִים இங்கு சிறுவர்களை அல்ல, ரெகொபெயாமுடன் வளர்ந்த இளைய ஆலோசகர்களைக் குறிக்கிறது.
- source_word: אַכְבִּיד אֶת עֻלְּכֶם
  choice: நான் உங்கள் நுகத்தை இன்னும் கனமாக்குவேன்
  rationale: כבד என்பதன் ஹிப்இல் வடிவம் ‘கனமாக்குதல்’ என்ற காரணவினைப் பொருளைத் தருகிறது. ஏற்கெனவே உள்ள நுகத்தின் சுமை அதிகரிப்பதால் ‘இன்னும்’ சேர்க்கப்பட்டது; நுகம் என்ற உருவகம் பாதுகாக்கப்பட்டது.
- source_word: וַאֲנִי אֹסִיף עָלָיו
  choice: அதனுடன் மேலும் சேர்ப்பேன்
  rationale: יסף על என்பது ஒன்றோடு மேலும் சேர்த்தல் அல்லது அதை அதிகரித்தல். ஆண்பால் ஒருமைச் சுட்டுப்பெயர் முன் வரும் ‘நுகத்தை’ இயல்பாகச் சுட்டுகிறது.
- source_word: יִסַּר
  choice: தண்டித்தார் / தண்டிப்பேன்
  rationale: יסר என்பது திருத்திப் பயிற்றுவித்தல், கண்டித்தல், தண்டித்தல் ஆகிய பொருட்களைக் கொண்டது. அரசனின் கடுமையான மிரட்டல் சூழலில் ‘தண்டித்தல்’ இயல்பாகவும் தெளிவாகவும் அமைகிறது.
- source_word: בַּשּׁוֹטִים
  choice: சாட்டைகளால்
  rationale: שׁוֹט என்பது சாட்டை அல்லது வாரைக் குறிக்கிறது. ‘சாட்டை’ என்பது இன்றைய தமிழில் தெளிவான, நேரடியான சொல்.
- source_word: בָּעֲקְרַבִּים
  choice: தேள்களால்
  rationale: עַקְרַבִּים என்பதன் நேர்ப்பொருள் ‘தேள்கள்’. இது கொடுக்குகளோ கூர்முனைகளோ பொருத்தப்பட்ட கொடிய சாட்டைகளைக் குறிக்கக்கூடும்; எனினும் மூலத்தின் உயிர்ப்பான உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டது.
