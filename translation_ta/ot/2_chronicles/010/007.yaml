base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: ta
  text: அவர்கள் அவனிடம், “நீர் இந்த மக்களுக்கு நன்மை செய்து, அவர்களுடைய விருப்பத்தைப் பெற்று[a], அவர்களிடம் நல்ல வார்த்தைகளைப் பேசினால், அவர்கள் உமக்குச் சேவை செய்பவர்களாக உமது வாழ்நாளெல்லாம் இருப்பார்கள்[b]” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குத் தயவு காட்டி.” எபிரெய வினைச்சொல் ஒருவரைப் பிரியப்படுத்துதல் அல்லது அவருக்குத் தயவாக நடந்துகொள்ளுதல் ஆகிய பொருள்களைத் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் உமக்குத் தொடர்ந்து சேவை செய்வார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶה לְטוֹב לְהָעָם הַזֶּה
  choice: இந்த மக்களுக்கு நல்லவராக இருந்து
  rationale: היה + לְטוֹב என்ற எபிரெயச் சொற்றொடர், ஒருவருக்கு நன்மையானவராக அல்லது நல்ல முறையில் இருப்பதைக் குறிக்கிறது. ‘நல்லவராக இருந்து’ என்பது ஆட்சியாளரின் நன்மை பயக்கும் அணுகுமுறையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וּרְצִיתָם
  choice: அவர்களைப் பிரியப்படுத்தி
  rationale: רצה இங்கு மக்களின் விருப்பத்தைப் பெற்று அவர்களுக்கு ஏற்ப நடந்துகொள்வதைக் குறிக்கலாம். ‘பிரியப்படுத்தி’ என்பது அந்த விளைவைத் தமிழில் நேரடியாகக் காட்டுகிறது; ‘தயவு காட்டி’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים
  choice: அவர்களிடம் நல்ல வார்த்தைகளைப் பேசினால்
  rationale: דבר / דברים மற்றும் טוב ஆகிய சொற்களின் வெளிப்படையான அமைப்பைத் தக்கவைத்து, தமிழில் புரியக்கூடிய முறையில் வழங்குகிறது.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: உமக்குப் பணியாளர்களாக இருப்பார்கள்
  rationale: עֲבָדִים இச்சூழலில் அரசனுக்குக் கீழ்ப்படிந்து சேவை செய்யும் குடிமக்களைக் குறிக்கிறது. ‘பணியாளர்கள்’ என்பது அடிமைமுறை என்ற தேவையற்ற வலுவான பொருளைத் தவிர்த்து, பெயர்ச்சொல் அமைப்பையும் காக்கிறது.
- source_word: כָּל הַיָּמִים
  choice: எல்லா நாட்களிலும்
  rationale: எபிரெயச் சொற்றொடரின் ‘எல்லா நாட்களும்’ என்ற காலநீட்சி அமைப்பை வெளிப்படையாகத் தக்கவைக்கிறது; அதன் தொடர்ச்சியான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
