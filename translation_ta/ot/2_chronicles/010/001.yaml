  yaml_path: translation/ot/2_chronicles/010/001.yaml
  text: Rehoboam went to Shechem, because all Israel had come to Shechem to make him king.
translation:
  language: ta
  text: ரெகொபெயாம் சீகேமுக்குச் சென்றான்; ஏனெனில் இஸ்ரவேலர் அனைவரும் அவனை அரசனாக்குவதற்காகச் சீகேமுக்கு வந்திருந்தார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁכֶם
  choice: சீகேம்
  rationale: இடப்பெயரைத் தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: ரெகொபெயாம் சீகேமுக்குச் சென்றதற்கான காரணத்தை இங்கு தெளிவாகக் குறிக்கிறது.
- source_word: כָל יִשְׂרָאֵל
  choice: இஸ்ரவேலர் அனைவரும்
  rationale: மக்களைக் குறிக்கும் கூட்டு அரசியல் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: அவனை அரசனாக்குவதற்காக
  rationale: ஹிப்ரு வினையின் காரணவினைப் பொருளையும் நோக்கத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בָּאוּ
  choice: வந்திருந்தார்கள்
  rationale: ரெகொபெயாம் சென்ற நிகழ்வுக்கு முன்னரே மக்கள் வந்து கூடியிருந்த சூழலைத் தமிழில் இயல்பாகக் காட்டுகிறது.
