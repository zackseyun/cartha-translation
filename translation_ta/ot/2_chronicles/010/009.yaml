  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/009.yaml
  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
translation:
  language: ta
  text: அவன் அவர்களிடம், “இந்த மக்களுக்கு நாம் பதில் அளிக்கும்படி நீங்கள் என்ன ஆலோசனை கூறுகிறீர்கள்? இவர்கள் என்னிடம், ‘உங்கள் தந்தை எங்கள்மேல் வைத்த நுகத்தை இலகுவாக்குங்கள்’ என்று சொன்னார்கள்” என்றான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: அவன் அவர்களிடம் ... என்றான்
  rationale: எபிரெயக் கதைநடையின் தொடர்ச்சியையும் பேச்சை அறிமுகப்படுத்தும் இயல்பையும் நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: நீங்கள் என்ன ஆலோசனை கூறுகிறீர்கள்?
  rationale: יעץ என்பதன் ஆலோசனை வழங்கும் பொருளை இயல்பான நேரடிப் பேச்சாகத் தருகிறது.
- source_word: וְנָשִׁיב דָּבָר
  choice: நாம் பதில் சொல்லும்படி
  rationale: சொல்லுக்குச் சொல் ‘ஒரு வார்த்தையைத் திருப்பித் தருதல்’ என்பதற்குப் பதிலாக, பதிலளித்தல் என்னும் எபிரெய மரபுத்தொடரின் பொருளையும் இங்கு காணப்படும் நோக்கத் தொடர்பையும் தருகிறது.
- source_word: הָעָם הַזֶּה
  choice: இந்த மக்களுக்கு
  rationale: ஒருமைத் தொகுப்புப் பெயரான עָם-ஐ தமிழில் இயல்பான கூட்டுப்பொருளுடன் மொழிபெயர்க்கிறது.
- source_word: דִּבְּרוּ אֵלַי לֵאמֹר
  choice: என்னிடம் ... என்று சொன்ன
  rationale: முந்தைய கோரிக்கையையும் அதன் மேற்கோள் உள்ளடக்கத்தையும் சுருக்கமின்றி இயல்பான தமிழ்ச் சார்பு வாக்கியமாக இணைக்கிறது.
- source_word: הָקֵל מִן הָעֹל
  choice: நுகத்தை இலகுவாக்குங்கள்
  rationale: கட்டாய உழைப்பு அல்லது கடுமையான ஆட்சியைக் குறிக்கும் ‘நுகம்’ என்ற மூல உருவகத்தைத் தக்கவைத்து, הָקֵל என்பதன் ‘இலகுவாக்கு’ பொருளை வெளிப்படுத்துகிறது.
- source_word: נָתַן ... עָלֵינוּ
  choice: எங்கள்மீது வைத்த
  rationale: சுமை அல்லது நுகம் வெளியில் இருந்து திணிக்கப்பட்டது என்னும் கருத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אָבִיךָ
  choice: உங்கள் தந்தை
  rationale: ரெகொபெயாமை மரியாதை ஒருமையில் நேரடியாக அழைக்கும் நவீனத் தமிழுக்கு ஏற்ற வடிவம்.
