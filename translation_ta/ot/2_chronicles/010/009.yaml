translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நேரடிப் பேச்சு பயன்படுத்தப்பட்டுள்ளது. ‘நுகம்’ என்ற வேதாகமச் சூழலில் புரிந்துகொள்ளத்தக்க உருவகம் மூலத்தின் படிமத்தைப் பாதுகாக்கிறது; அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எபிரெயத்தின் ‘நாம் பதில் சொல்ல’ என்ற முதலாம் நபர் பன்மை தீர்க்கப்படாமல் அப்படியே காக்கப்பட்டுள்ளது.
