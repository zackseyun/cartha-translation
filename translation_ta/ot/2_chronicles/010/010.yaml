  text: וַ/יְדַבְּר֣וּ אִתּ֗/וֹ הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֡ר לָ/עָם֩ אֲשֶׁר דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תֹּאמַ֣ר אֲלֵ/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
translation:
  language: ta
  text: 'அவனோடு வளர்ந்த இளைஞர்கள் அவனிடம், “உன்னிடம், ‘உன் தந்தை எங்கள் நுகத்தைப் பாரமாக்கினார்; நீயோ எங்கள் மீதுள்ள நுகத்தை இலகுவாக்கு’ என்று சொன்ன மக்களிடம் நீ இப்படிச் சொல்ல வேண்டும்: ‘என் சுண்டுவிரல்[a] என் தந்தையின் இடுப்பைவிட[b] தடிமனானது’” என்றார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, “என் சிறியது” அல்லது “என் சிறிய ஒன்று”; இச்சொற்றொடர் வழக்கில் “என் சுண்டுவிரல்” என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் தந்தையின் இடைப்பகுதியைவிட.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: இளைஞர்கள்
  rationale: சொல்லின் அடிப்படைப் பொருள் பிள்ளைகள் அல்லது இளம் வயதினர் என்றாலும், அவனோடு வளர்ந்த அரசனின் வயதொத்த ஆலோசகர்களை இச்சூழலில் குறிக்கிறது.
- source_word: גָּדְלוּ אִתּוֹ
  choice: அவனோடு வளர்ந்த
  rationale: ஒரே காலத்தில் உடனிருந்து வளர்ந்ததைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: כֹּה תֹאמַר
  choice: நீ இப்படிச் சொல்ல வேண்டும்
  rationale: எவ்வாறு பதிலளிக்க வேண்டும் என்பதை அறிவுறுத்தும் எபிரேயப் பேச்சு அறிமுகச் சூத்திரத்தின் கட்டளைத் தன்மையைத் தக்கவைக்கிறது.
- source_word: אָבִיךָ הִכְבִּיד אֶת עֻלֵּנוּ
  choice: உன் தந்தை எங்கள் நுகத்தைப் பாரமாக்கினார்
  rationale: ஆட்சிச் சுமையைக் குறிக்கும் நுகம் என்ற மூல உருவகத்தையும், அதைப் பாரமாக்குதல் என்ற வினையின் வலிமையையும் பாதுகாக்கிறது.
- source_word: הָקֵל מֵעָלֵינוּ
  choice: அதை எங்கள்மேலிருந்து இலகுவாக்கு
  rationale: முந்தைய நுகத்தையே மறைமுகச் செயப்படுபொருளாகக் கொண்டு, எங்கள்மேலிருந்து என்ற மூலத்தின் இடத்தொடர்பையும் விடுதலைக் கோரிக்கையையும் வெளிப்படுத்துகிறது.
- source_word: קָטָנִּי
  choice: என் சுண்டுவிரல்
  rationale: சொல்லுக்கு நேரடியாக என் சிறியது அல்லது என் சிறிய ஒன்று என்ற பொருள் இருந்தாலும், இணைப்பகுதியிலும் வழக்குப் பொருளிலும் சுண்டுவிரலைக் குறிக்கும் மிகைப்படுத்தல் இது.
- source_word: עָבָה
  choice: தடிமனானது
  rationale: உடல் அளவை ஒப்பிடும் தடிமை அல்லது பருமன் என்ற நேரடிப் பொருளைத் தருகிறது.
- source_word: מִמָּתְנֵי אָבִי
  choice: என் தந்தையின் இடுப்பைவிட
  rationale: מָתְנַיִם குறிக்கும் இடுப்பு அல்லது அரைப் பகுதியை நவீனத் தமிழில் தெளிவாகத் தெரிவிக்கிறது.
