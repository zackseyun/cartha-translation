source:
  edition: WLC
  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֖י בָּֽ/עֲקְרַבִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
translation:
  language: ta
  text: இப்போது, என் தந்தை உங்கள் நுகத்தைப் பாரமாக்கினார்; நானோ உங்கள் நுகத்தின்மேல் இன்னும் பாரத்தைச் சேர்ப்பேன். என் தந்தை உங்களைச் சவுக்குகளால் தண்டித்தார்; நானோ தேள்களால்[a] தண்டிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேள் சவுக்குகளால்’ எனப் பொருள்படலாம்; அதாவது, கூர்முனைகள் அல்லது கொக்கிகள் பொருத்தப்பட்ட சவுக்குகள். எபிரேய மூலத்தில் நேரடியாக ‘தேள்களால்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס
  choice: பாரமாக்கினார்
  rationale: இச்சொல்லின் causative வடிவம் ஒருவர்மேல் சுமையை ஏற்றுவதைக் குறிக்கிறது. நுகம் என்ற உருவகத்தோடு இயல்பாக இணைய ‘பாரமாக்கினார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֹל כָּבֵד
  choice: பாரமான நுகம் / நுகத்தைப் பாரமாக்கினார்
  rationale: עֹל என்பது நேரடியாக ‘நுகம்’; כָּבֵד என்பது ‘பாரமானது’. அரசியல் அல்லது கட்டாய உழைப்புச் சுமையைக் குறிக்கும் மூல உருவகம் தக்கவைக்கப்பட்டது.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: உங்கள் நுகத்தின்மேல் இன்னும் பாரத்தைச் சேர்ப்பேன்
  rationale: ‘உங்கள் நுகத்தின்மேல் சேர்ப்பேன்’ என்ற எபிரெய இணைப்பைத் தக்கவைத்து, தமிழில் பொருள் தெளிவாக இருக்க ‘இன்னும் பாரத்தை’ சேர்க்கப்பட்டது.
- source_word: יִסַּר
  choice: ஒறுத்தார் / ஒறுப்பேன்
  rationale: தண்டனையின் மூலம் கட்டுப்படுத்துதல் அல்லது கடுமையாகத் திருத்துதல் என்ற பொருளை ‘ஒறுத்தல்’ சுருக்கமாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது.
- source_word: בַּשּׁוֹטִים
  choice: சவுக்குகளால்
  rationale: שׁוֹט என்பது சவுக்கு அல்லது வாரைக் குறிக்கிறது; நவீன தமிழில் தெளிவான ‘சவுக்கு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בָּעֲקְרַבִּים
  choice: தேள்களால்
  rationale: மூல எபிரெயில் நேரடியாக ‘தேள்கள்’ என்றே உள்ளது. கூர்முனைகள் பொருத்தப்பட்ட கொடிய சவுக்குகளை இது குறிக்கக்கூடும் என்பதால், நேரடிப் பொருள் முதன்மை உரையிலும் மாற்றுப் புரிதல் அடிக்குறிப்பிலும் தரப்பட்டது.
