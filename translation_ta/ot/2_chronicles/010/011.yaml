translation_notes:
  register: நவீன தரத் தமிழில், மூலத்தின் நுக உருவகத்தையும் தந்தை–மகன் கூற்றுகளின் இணை அமைப்பையும் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒறுத்தார்’ என்பது சற்றே உயர்ந்த நடையாயினும், வெறும் அடித்தல் என்பதைக் காட்டிலும் יסר என்பதிலுள்ள தண்டித்துத் திருத்தும் நுணுக்கத்தைச் சிறப்பாகக் காக்கிறது.
