  rationale: וְ என்பது முந்தைய வசனத்தில் வடக்குக் கோத்திரங்கள் கலகம் செய்ததற்கு மாறான நிலையை இங்கு காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. בְּנֵי יִשְׂרָאֵל என்பது இங்கு இனமக்களைக் குறிக்கும் வழக்குச் சொற்றொடர்; நவீன தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: הַיֹּשְׁבִים
  choice: குடியிருந்த
  rationale: ישׁב என்ற வினையின் பங்கேற்பு வடிவம் இங்கு தொடர்ந்து வசித்து வந்ததைக் குறிக்கிறது; ‘குடியிருந்த’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְּעָרֵי יְהוּדָה
  choice: யூதாவின் நகரங்களில்
  rationale: இடத்தைக் குறிக்கும் בְּ மற்றும் சார்புறவைக் காட்டும் எபிரெயக் கட்டமைப்பு ஆகிய இரண்டையும் நேராகப் பிரதிபலிக்கிறது.
- source_word: וַיִּמְלֹךְ עֲלֵיהֶם
  choice: அவர்கள்மீது … அரசாண்டான்
  rationale: מלך உடன் வரும் על ஆட்சிக்குட்பட்ட மக்களைக் குறிக்கிறது. தமிழில் முந்தைய பெயர்ச்சொற்றொடருடன் இணைத்து ‘இஸ்ரவேல் மக்கள்மீது … அரசாண்டான்’ எனச் சொல்வது இயல்பானது.
- source_word: רְחַבְעָם
  choice: ரெகொபெயாம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்பட்ட பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
