id: 2CH.10.15
reference: 2 Chronicles 10:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה נְסִבָּה֙ מֵ/עִ֣ם הָֽ/אֱלֹהִ֔ים לְמַעַן֩ הָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֤ר דִּבֶּר֙ בְּ/יַד֙ אֲחִיָּ֣הוּ הַ/שִּֽׁלוֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: ta
  text: ஆகவே அரசன் மக்களுக்குச் செவிசாய்க்கவில்லை. ஏனெனில், நேபாத்தின் மகன் யெரொபெயாமிடம் சீலோனியரான அகியா மூலம் யாவே உரைத்த தமது வார்த்தையை நிலைநிறுத்தும்படியாக, இந்த நிகழ்வுகளின் திருப்பம் கடவுளிடமிருந்து வந்தது[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில், இதற்கான காரணம் கடவுளிடமிருந்து வந்தது.” எபிரெயப் பெயர்ச்சொல் ஒரு திருப்பம், சூழ்நிலை அல்லது ஒரு விளைவை உண்டாக்கிய நிகழ்வுப்போக்கு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל־הָעָם
  choice: மக்களுக்குச் செவிசாய்க்கவில்லை
  rationale: இங்கு வினை வெறுமனே ஒலியைக் கேட்டதைக் குறிக்காமல், மக்களின் கோரிக்கையை ஏற்று அதற்குச் செவிகொடுப்பதைக் குறிக்கிறது. ‘செவிசாய்க்கவில்லை’ என்பது கீழ்ப்படிதல் என்று அளவுக்கு மீறி விளக்காமல் அந்தப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: נְסִבָּה
  choice: நிகழ்வுகளின் திருப்பம்
  rationale: இந்தப் பெயர்ச்சொல் திருப்பம், சூழ்நிலை அல்லது ஒரு விளைவை உண்டாக்கிய நிகழ்வுப்போக்கு ஆகிய பொருள்களைக் கொள்ளலாம். ‘நிகழ்வுகளின் திருப்பம்’ என்பது இறையாட்சிக்குட்பட்ட நிகழ்வுப்போக்கை உணர்த்துவதோடு சொல்லின் பொருள் விரிவையும் காக்கிறது.
- source_word: מֵעִם הָאֱלֹהִים
  choice: கடவுளிடமிருந்து வந்தது
  rationale: இந்தச் சொற்றொடர் நிகழ்வின் இறைமூலத்தை நேரடியாகக் குறிக்கிறது. தமிழ் வாக்கியத்தில் இயல்பாக அமைய ‘வந்தது’ சேர்க்கப்பட்டுள்ளது.
- source_word: לְמַעַן
  choice: நிலைநிறுத்துவதற்காகவே
  rationale: இது நோக்கத்தைக் குறிக்கும் இணைப்புச்சொல். ‘-வதற்காகவே’ அதன் நோக்க வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָקִים
  choice: நிலைநிறுத்த
  rationale: קום என்பதன் ஹிஃபீல் வடிவம் இங்கு ‘நிற்கச் செய்தல்’, அதாவது வார்த்தையை உறுதிப்படுத்தி நடைமுறையில் நிலைபெறச் செய்தல் என்பதைக் குறிக்கிறது. ‘நிறைவேற்ற’ என்பதைக் காட்டிலும் ‘நிலைநிறுத்த’ எபிரெய உருவகத்துக்கு நெருக்கமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது எபிரெய வேதாகமத்தில் வரும் தனிப்பட்ட இறைப் பெயர்; பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: דְּבָרוֹ
  choice: தமது வார்த்தையை
  rationale: ‘வார்த்தை’ என்பது தீர்க்கதரிசன அறிவிப்பைக் குறிக்கக்கூடிய பரந்த, நேரடியான மொழிபெயர்ப்பு. மரியாதை ஒருமைக்கு ஏற்றவாறு ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּיַד
  choice: மூலம்
  rationale: ‘கையினால்’ என்ற சொற்பொருள் இங்கு முகமை அல்லது கருவியைக் குறிக்கும் எபிரெய மரபுத்தொடர். அகியாவின் இடைமுகப் பங்கை இயல்பான தமிழில் ‘மூலம்’ தெரிவிக்கிறது.
- source_word: הַשִּׁלוֹנִי
  choice: சீலோனியனான
  rationale: சீலோவுடன் தொடர்புடையவரைக் குறிக்கும் இன/இடப்பெயரடைப் பொருளை முறையான தமிழில் தக்கவைக்கிறது.
- source_word: בֶּן נְבָט
  choice: நேபாத்தின் மகன்
  rationale: எபிரெய தந்தைவழி அடையாளத்தைத் தமிழில் நேரடியாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: இறைக் காரணமும் மனிதச் செயலும்
  choice: அரசன் செவிசாய்க்காத மனிதச் செயலைத் தனியே கூறி, நிகழ்வுகளின் திருப்பம் கடவுளிடமிருந்து வந்தது என மொழிபெயர்த்தல்
  alternative: அரசன் மறுத்ததையே கடவுள் நேரடியாகச் செய்ததாக வெளிப்படையாகக் கூறுதல்
  rationale: எபிரெய உரை அரசனின் மறுப்பை உண்மையான மனிதச் செயலாக விவரிக்கிறது; அதேவேளை நிகழ்வுப்போக்கின் மூலம் கடவுள் என்று கூறுகிறது. இந்த இரண்டிற்குமிடையிலான இறையியல் இழுவிசையைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
- issue: יְהוָה என்ற இறைப் பெயர்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து தனிப்பட்ட இறைப் பெயரே இடம்பெறுகிறது; ஆகவே அது தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: தீர்க்கதரிசன வார்த்தையின் நிறைவேற்றம்
  choice: தமது வார்த்தையை நிலைநிறுத்த
  alternative: தமது வாக்குறுதியை நிறைவேற்ற
  rationale: மூலத்தின் דָּבָר என்பது ‘வார்த்தை’ அல்லது ‘அறிவிப்பு’ என்ற பரந்த பொருளுடையது; அதை ‘வாக்குறுதி’ என்று குறுக்காமல், הָקִים வினையின் ‘நிலைபெறச் செய்தல்’ என்ற உருவகத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘செவிசாய்க்கவில்லை’, ‘நிகழ்வுகளின் திருப்பம்’, ‘நிலைநிறுத்த’ ஆகியவை மூலத்தின் பொருள் நுணுக்கங்களை இயல்பான தமிழில் காக்கின்றன. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டாலும், காரணமும் நோக்கமும் இடையிலான தொடர்பு பாதுகாக்கப்பட்டுள்ளது.
