  text: And he said to them[a], “Come back to me in three days.” So the people went away.
translation:
  language: ta
  text: அவர் அவர்களிடம், “மூன்று நாட்களுக்குப் பிறகு என்னிடம் திரும்பி வாருங்கள்” என்றார்.[a] அப்பொழுது மக்கள் புறப்பட்டுச் சென்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில் சொல்லுக்குச் சொல்: “இன்னும் மூன்று நாட்கள்; என்னிடம் திரும்பி வாருங்கள்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: அவர் அவர்களிடம் … என்றார்
  rationale: எபிரேய தொடர் நிகழ்வைக் குறிக்கும் வினை வடிவத்தையும், பேச்சு யாரை நோக்கியது என்பதையும் இயல்பான தமிழ் நேரடி உரை அமைப்பில் தருகிறது.
- source_word: עוֹד שְׁלֹשֶׁת יָמִים
  choice: இன்னும் மூன்று நாட்கள் கழித்து
  rationale: சொல்லுக்குச் சொல் ‘இன்னும் மூன்று நாட்கள்’ என்றிருந்தாலும், திரும்பி வர வேண்டிய கால இடைவெளியை நவீன தமிழில் தெளிவாகக் காட்டுகிறது; עוֹד என்பதன் ‘இன்னும்’ என்ற நுணுக்கமும் தக்கவைக்கப்படுகிறது.
- source_word: וְשׁוּבוּ אֵלָי
  choice: என்னிடம் திரும்பி வாருங்கள்
  rationale: שׁוּב என்ற பன்மை ஏவல் வடிவத்தையும், אֵלַי குறிக்கும் பேச்சாளரை நோக்கிய திசையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיֵּלֶךְ הָעָם
  choice: எனவே மக்கள் சென்றுவிட்டார்கள்
  rationale: கட்டளைக்குப் பின்வந்த நிகழ்வை ‘எனவே’ இணைக்கிறது. எபிரேயத்தில் கூட்டுப்பெயருடன் ஒருமை வினை இருந்தாலும், தமிழில் ‘மக்கள்’ என்பதற்கேற்ற பன்மை வினை இயல்பானது; சூழலில் அங்கிருந்து அகன்றதை ‘சென்றுவிட்டார்கள்’ உணர்த்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைப் பன்மை ஏவல் வடிவத்துடன் dignified ஆனாலும் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி நேரடி உரைக்குப் பின் வைக்கப்பட்டுள்ளது.
