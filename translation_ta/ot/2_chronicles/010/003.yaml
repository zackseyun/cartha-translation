base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
translation:
  language: ta
  text: 'ஆகவே அவர்கள் செய்தி அனுப்பி அவனை அழைத்தார்கள்[a]. யெரொபெயாமும் இஸ்ரவேலர் அனைவரும் வந்து, ரெகொபெயாமிடம் பேசினார்கள்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அனுப்பி அவனை அழைத்தார்கள்.” எபிரெயத்தில் “அனுப்பினார்கள்” என்பதன் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: ஆளனுப்பி
  rationale: שׁלח என்பதன் செயப்படுபொருள் எபிரெயத்தில் வெளிப்படையாகக் கூறப்படவில்லை. தமிழில் இயல்பான தொடருக்காக, ஒருவரை அழைத்துவர ஆள் அனுப்பிய செயலைச் சுருக்கமாகக் காட்டுகிறது; அடிக்குறிப்பு மூலத்தின் மறைநிலையைப் பதிவு செய்கிறது.
- source_word: וַיִּקְרְאוּ לוֹ
  choice: அவனை அழைத்தார்கள்
  rationale: קרא + ל இச்சூழலில் ஒருவரை வரவழைத்தல் அல்லது அழைத்தல் என்ற பொருள் தருகிறது. நவீனத் தமிழில் தெளிவான, இயல்பான வடிவம்.
- source_word: וַיָּבֹא
  choice: வந்து
  rationale: எபிரெய வினை ஒருமையில் இருந்து யெரொபெயாமை முன்னிலைத் தலைப்பாகக் காட்டுகிறது. தமிழில் அடுத்த பன்மை வினையுடன் இணைக்க வினையெச்ச வடிவம் இயல்பாகிறது.
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: யெரொபெயாமும் இஸ்ரவேல் முழுவதும்
  rationale: தேசிய அல்லது உடன்படிக்கைச் சமூகத்தைக் குறிக்கும் ‘இஸ்ரவேல் முழுவதும்’ என்ற மூல வெளிப்பாட்டைப் பாதுகாக்கிறது; அதை வெறுமனே ‘இஸ்ரவேலர் அனைவரும்’ என்று மாற்றவில்லை.
- source_word: וַיְדַבְּרוּ אֶל
  choice: ரெகொபெயாமிடம் பேசினார்கள்
  rationale: דבר אל என்பதன் நேரடியான கருத்தான ‘ஒருவரிடம் பேசுதல்’ என்பதைக் கண்ணியமான, இயல்பான தமிழில் வழங்குகிறது.
- source_word: לֵאמֹר
  choice: 'பேசினார்கள்:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவத்தைத் தமிழில் இயல்பாகக் காட்ட இரட்டைப் புள்ளி பயன்படுத்தப்பட்டது; ‘சொல்லி’ எனச் சேர்ப்பது தமிழில் தேவையற்ற மறுபடியாக இருக்கும்.
