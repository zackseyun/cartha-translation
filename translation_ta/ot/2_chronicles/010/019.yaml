  yaml_path: translation/ot/2_chronicles/010/019.yaml
  text: So Israel has been in rebellion against the house of David to this day[a].
translation:
  language: ta
  text: இவ்வாறு, இஸ்ரவேல் தாவீதின் வம்சத்துக்கு எதிராக இந்நாள்வரை கிளர்ச்சியில் இருந்து வருகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இஸ்ரவேல் தாவீதின் வம்சத்துக்கு எதிராகக் கிளர்ந்தெழுந்தது; அந்த நிலை இந்நாள்வரை தொடர்கிறது.” எபிரெய வினைச்சொல்லை எளிய இறந்தகாலமாகவும், தொடரும் நிலையை வலியுறுத்துவதாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: கிளர்ச்சி செய்து, அதே நிலையில் இருந்து வருகிறது
  rationale: פשע என்பது அதிகாரத்துக்கு எதிரான அரசியல் கிளர்ச்சியைக் குறிக்கிறது. ‘இந்நாள்வரை’ என்பதுடன் இணைந்து, கடந்த நிகழ்வையும் அதன் தொடரும் நிலையையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: இங்கு ‘இஸ்ரவேல்’ என்பது தாவீதின் வம்ச ஆட்சியிலிருந்து வேறுபட்ட வடக்குக் கோத்திரங்களைக் கூட்டாகக் குறிக்கும் பெயர்; விளக்கமாக விரிவுபடுத்தாமல் பெயரே தக்கவைக்கப்படுகிறது.
- source_word: בְּבֵית דָּוִיד
  choice: தாவீதின் வீட்டாருக்கு எதிராக
  rationale: פשע என்பதுடன் வரும் בְ, யாருக்கு எதிராகக் கிளர்ச்சி நிகழ்ந்தது என்பதைக் குறிக்கிறது. ‘வீட்டார்’ என்பது இங்கு கட்டடத்தை அல்ல, தாவீதின் வம்சத்தையும் அரச குடும்பத்தையும் குறிக்கிறது.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: இந்நாள்வரை
  rationale: எழுத்தாளரின் காலம் வரையிலும் அந்த நிலை தொடர்ந்ததைச் சுட்டும் இயல்பான நவீனத் தமிழ் மரபுத்தொடர்.
