  register: நவீன, கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வீட்டார்’ என்பது தாவீதின் வம்ச அரச குடும்பத்தைக் குறிக்கும் வகையில் தேர்ந்தெடுக்கப்பட்டது; எபிரெய உரையிலுள்ள கடந்த கிளர்ச்சிக்கும் தொடரும் அரசியல் பிரிவுக்கும் இடையிலான நுட்பம் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
