base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
translation:
  language: ta
  text: அரசன், “மூன்றாம் நாளில் என்னிடம் திரும்பி வாருங்கள்[a]” என்று கூறியிருந்தபடியே, யெரொபெயாமும் மக்கள் அனைவரும் மூன்றாம் நாளில் ரெகொபெயாமிடம் வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூன்றாம் நாளில் மீண்டும் என்னிடம் வாருங்கள்.”
    reason: שׁוּבוּ אֵלַי என்பதனை இயக்கத்தின் கருத்தை முன்னிறுத்தி இவ்வாறும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: வந்தார்கள்
  rationale: בוא என்பது பார்வைக்கோணத்தைப் பொறுத்து ‘வருதல்’ அல்லது ‘செல்லுதல்’ என அமையலாம். இங்கு ரெகொபெயாமை நோக்கி வந்த நிகழ்வைத் தமிழில் இயல்பாகக் குறிக்க ‘வந்தார்கள்’ பயன்படுத்தப்பட்டது.
- source_word: יָרָבְעָם
  choice: யெரொபெயாம்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலிப்பை நவீனத் தமிழில் அடையாளம் காணத்தக்க வகையில் எழுத்துப்பெயர்த்தது.
- source_word: וְכָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: עָם இங்கு முறைப்படியான சபையைக் காட்டாமல், யெரொபெயாமுடன் இருந்த மக்களைப் பொதுவாகக் குறிக்கிறது.
- source_word: אֶל רְחַבְעָם
  choice: ரெகொபெயாமிடம்
  rationale: אֶל ஒருவரை நோக்கிய இயக்கத்தைச் சுட்டுகிறது; தமிழில் ‘ரெகொபெயாமிடம்’ என்பது இயல்பான திசைவேற்றுமை வடிவம்.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: மூன்றாம் நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரின் நேரான, இயல்பான தமிழ் வடிவம்.
- source_word: כַּאֲשֶׁר דִּבֶּר הַמֶּלֶךְ
  choice: அரசன் கூறியிருந்தபடியே
  rationale: மக்கள் வந்தது அரசன் முன்பு கூறிய வார்த்தைக்கு ஏற்ப நிகழ்ந்ததைக் காட்டுகிறது; முன்னர் நிகழ்ந்த பேச்சை ‘கூறியிருந்தான்’ என்ற வடிவம் தெளிவாக்குகிறது.
- source_word: לֵאמֹר
  choice: என்று
  rationale: முன்னர் கூறப்பட்ட நேரடி உரையைத் தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: שׁוּבוּ אֵלַי
  choice: என்னிடம் திரும்பி வாருங்கள்
  rationale: שׁוב என்பதன் ‘திரும்புதல்’ கருத்தையும், அரசனிடம் மீண்டும் வரவேண்டும் என்ற சூழல்சார் இயக்கத்தையும் இவ்வடிவம் தக்கவைக்கிறது.
