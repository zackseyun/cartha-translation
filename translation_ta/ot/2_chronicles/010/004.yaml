  text: אָבִ֖י/ךָ הִקְשָׁ֣ה אֶת עֻלֵּ֑/נוּ וְ/עַתָּ֡ה הָקֵל֩ מֵ/עֲבֹדַ֨ת אָבִ֜י/ךָ הַ/קָּשָׁ֗ה וּ/מֵ/עֻלּ֧/וֹ הַ/כָּבֵ֛ד אֲשֶׁר נָתַ֥ן עָלֵ֖י/נוּ וְ/נַֽעַבְדֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: ta
  text: “உங்கள் தந்தை எங்கள் நுகத்தைக் கடுமையாக்கினார்.[a] இப்போது உங்கள் தந்தையின் கடுமையான அரசுப் பணியையும், அவர் எங்கள்மேல் வைத்த பாரமான நுகத்தையும் இலகுவாக்குங்கள்; அப்போது நாங்கள் உங்களுக்குப் பணிசெய்வோம்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் நுகத்தைப் பாரமாக்கினார்” அல்லது “கடினமாக்கினார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת עֻלֵּנוּ
  choice: எங்கள் நுகத்தைக் கடினமாக்கினார்
  rationale: הִקְשָׁה என்பதன் காரணவினைத் தன்மையையும் עֹל என்பதன் நுக உருவகத்தையும் நேரடியாகக் காக்கிறது. பின்னர் வரும் הַכָּבֵד என்பதிலிருந்து வேறுபாட்டைக் காட்ட ‘பாரமாக்கினார்’ என்பதற்குப் பதில் ‘கடினமாக்கினார்’ பயன்படுத்தப்பட்டது.
- source_word: הָקֵל
  choice: இலகுவாக்குங்கள்
  rationale: சுமையைக் குறைக்கும்படி சொல்லும் கட்டளையையும் நுக உருவகத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: உங்கள் தந்தை விதித்த கடினமான பணி
  rationale: עֲבֹדָה என்பது வேலை, உழைப்பு அல்லது ஆட்சிக்குக் கீழான கட்டாயப் பணி/கடமை ஆகியவற்றைக் குறிக்கலாம். சூழலைத் தெளிவாக்க ‘விதித்த’ சேர்க்கப்பட்டாலும், ‘பணி’ அதன் பொருள் அகலத்தை ஓரளவு காக்கிறது.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: அவர் எங்கள்மேல் வைத்த பாரமான நுகம்
  rationale: עֹל என்ற நுக உருவகத்தை மீண்டும் தக்கவைத்து, כָּבֵד என்பதைக் ‘பாரமான’ என்று வேறுபடுத்திக் காட்டுகிறது.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: அவர் எங்கள்மேல் வைத்த
  rationale: எபிரெய மொழியின் ‘எங்கள்மேல் வைத்த’ என்ற சுமை உருவகத்தை விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: וְנַעַבְדֶךָּ
  choice: அப்போது நாங்கள் உங்களுக்குப் பணிசெய்வோம்
  rationale: சுமையைக் குறைத்தால் அரசருக்குச் சேவை செய்வோம் என்ற மக்களின் உறுதிமொழிசார் விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
