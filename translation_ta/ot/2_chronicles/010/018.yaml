  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמוּ ב֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַֽ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
translation:
  language: ta
  text: அப்போது அரசன் ரெகொபெயாம், கட்டாய உழைப்புக்குப் பொறுப்பாளனாக[b] இருந்த ஹதோராமை[a] அனுப்பினான். ஆனால் இஸ்ரயேல் மக்கள்[c] அவன்மேல் கல்லெறிந்தார்கள்; அவன் இறந்தான். அரசன் ரெகொபெயாம் தன்னைத் திடப்படுத்திக்கொண்டு[d] தேரில் ஏறி, எருசலேமுக்குத் தப்பியோடினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “ஹதோராம்”; இதற்கு இணையான 1 அரசர்கள் 12:18-ல் “அதோராம்” என்று உள்ளது.
    reason: alternative_reading
  - marker: b
    text: “கட்டாய உழைப்பு” என்பது மக்கள்மீது விதிக்கப்பட்ட உழைப்புச் சேவையைக் குறிக்கிறது; “உழைப்புக் கட்டாயத்தை மேற்பார்வையிட்டவன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்கு சொல்: “இஸ்ரயேலின் மகன்கள்”; இது இஸ்ரயேல் மக்களைக் குறிக்கும் மரபுத்தொடர்.'
    reason: lexical_alternative
  - marker: d
    text: “விரைந்து தேரில் ஏறினான்” என்றும் மொழிபெயர்க்கலாம். எபிரெயம் சொல்லுக்கு நெருக்கமாக, “தேரில் ஏறுவதற்காகத் தன்னைத் திடப்படுத்திக்கொண்டான்” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: அனுப்பினான்
  rationale: கதைநடையில் שׁלח என்பதன் இயல்பான, நேரடியான பொருளைத் தருகிறது.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: அரசன் ரெகொபெயாம்
  rationale: அரசப் பட்டத்தையும் பெயரையும் நவீனத் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: הֲדֹרָם
  choice: ஹதோராம்
  rationale: நாளாகமத்தின் எபிரெய வடிவிலுள்ள தொடக்க மெய்யொலியைப் பாதுகாக்கிறது; இணை வசனத்தின் வேறுபட்ட பெயர் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: கட்டாய உழைப்புக்குப் பொறுப்பாளனாக இருந்த
  rationale: מַס இங்கு வெறும் வரியையல்ல, மக்கள்மீது விதிக்கப்பட்ட உழைப்புச் சேவையைக் குறிக்கிறது; பொறுப்பு வகித்த நிலையும் தெளிவாகிறது.
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  choice: அவன்மேல் கல்லெறிந்தார்கள்
  rationale: கல்லால் தாக்கிய செயலைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது; எபிரெய வினை–பெயர் மீளுரையை செயற்கையாகப் பிரதிபலிக்கவில்லை.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: இஸ்ரயேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரயேலின் மகன்கள்’ என்றாலும், இது தேச மக்களைக் குறிக்கும் எபிரெய மரபுத்தொடர்; தமிழில் பாலின வரம்பின்றி பொருளை இயல்பாகத் தருகிறது.
- source_word: וַיָּמֹת
  choice: அவன் இறந்துபோனான்
  rationale: தொடர்ந்து நிகழ்ந்த மரணத்தை எளிய கதைநடைத் தமிழில் நேரடியாகத் தருகிறது.
- source_word: הִתְאַמֵּץ
  choice: தன்னைத் திடப்படுத்திக்கொண்டு
  rationale: אמץ என்பதன் தன்னைத்தானே உறுதிப்படுத்துதல் அல்லது வலிமையைத் திரட்டுதல் என்ற அடிப்படை நுணுக்கத்தைப் பாதுகாக்கிறது; சூழலால் வரும் அவசரத்தைக் ‘விரைந்தான்’ என்று மட்டும் மாற்றவில்லை.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: தேரில் ஏறி
  rationale: עלה என்பதன் ஏறுதல் என்ற திசைநுணுக்கத்தையும் தமிழின் இயல்பான சொல்லாட்சியையும் இணைக்கிறது.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: எருசலேமுக்குத் தப்பியோடினான்
  rationale: נוס குறிக்கும் ஆபத்திலிருந்து ஓடித் தப்புதலைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הִתְאַמֵּץ என்பதிலுள்ள தன்னை உறுதிப்படுத்துதல் மற்றும் சூழலிலுள்ள அவசரம்
  choice: தன்னைத் திடப்படுத்திக்கொண்டு
  alternative: விரைந்து
  rationale: மூல வேர்ச்சொல் வேகத்தை நேரடியாகக் குறிக்காமல், தன்னைத்தானே உறுதிப்படுத்துதல் அல்லது வலிமையைத் திரட்டுதலைக் குறிக்கிறது. சூழல் அவசரமானதாக இருந்தாலும் அந்தச் சொற்பொருள் பதற்றத்தை மைய உரையில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஹதோராம்’ என்ற நாளாகமப் பெயர் வடிவம் பாதுகாக்கப்பட்டு, இணை வசன வேறுபாடு அடிக்குறிப்பில் தரப்பட்டுள்ளது. ‘தன்னைத் திடப்படுத்திக்கொண்டு’ என்பது சிறிது முறையான சொல்லாட்சியாக இருந்தாலும், மூலத்தின் அர்த்த நுணுக்கத்தைத் தக்கவைக்கத் தேர்ந்தெடுக்கப்பட்டது.
