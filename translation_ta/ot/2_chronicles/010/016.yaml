base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/016.yaml
  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
translation:
  language: ta
  text: அரசன் தங்களுக்குச் செவிகொடுக்காததால், இஸ்ரவேலர் அனைவரும் அரசனுக்குப் பதிலளித்து, “தாவீதோடு நமக்கு என்ன பங்கு? ஈசாயின் மகனோடு நமக்கு உரிமைப்பங்கு இல்லை. இஸ்ரவேலே, ஒவ்வொருவரும் தங்கள் கூடாரங்களுக்குப் போங்கள்![a] தாவீதே, இப்போது உன் சொந்த வீட்டைப் பார்த்துக்கொள்!” என்றார்கள். அதன்பின் இஸ்ரவேலர் அனைவரும் தங்கள் கூடாரங்களுக்குப் போனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கூடாரங்களுக்குப் போங்கள்” என்பது அவரவர் இருப்பிடத்திற்குக் கலைந்து செல்லுங்கள் என்ற பொருளுடைய எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: செவிகொடுக்கவில்லை
  rationale: இங்கு வெறுமனே கேட்டல் அல்ல, மக்களின் வேண்டுகோளை ஏற்று அதன்படி செயல்படுதல் குறிக்கப்படுகிறது.
- source_word: וַיָּשִׁיבוּ
  choice: மறுமொழியாக ... என்றார்கள்
  rationale: שוב வேரிலிருந்து வந்தாலும், இச்சொற்றொடரில் அரசனுக்குப் பதிலளித்தல் என்பதே பொருள்; இயல்பான தமிழ் வாக்கிய அமைப்புக்காக இவ்வாறு வழங்கப்பட்டது.
- source_word: חֵלֶק
  choice: பங்கு
  rationale: தாவீதின் ஆட்சியிலும் வம்சத்திலும் தங்களுக்குப் பங்கில்லை என்ற அரசியல் உறவுமறுப்பின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: נַחֲלָה
  choice: உரிமைப்பங்கு
  rationale: வழிவழியாகக் கிடைக்கும் சுதந்தர அல்லது ஒதுக்கப்பட்ட பங்கு என்ற குடும்ப, உடன்படிக்கை சார்ந்த நுண்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּבֶן יִשַׁי
  choice: ஈசாயின் மகனிடம்
  rationale: தமிழில் இயல்பாகவும், தாவீதின் வம்சத்தோடு தங்களுக்கு உரிமை அல்லது தொடர்பு இல்லை என்ற கருத்தைக் காக்கும் வகையிலும் உள்ளது.
- source_word: אִישׁ
  choice: ஒவ்வொருவரும்
  rationale: ஆண்பால் ஒருமைச் சொல் பகிர்வுப் பொருளில் முழு இஸ்ரவேல் சமூகத்தையும் நோக்கிப் பயன்படுத்தப்படுகிறது; தமிழில் ‘ஒவ்வொருவரும்’ அதன் பகிர்வுச் சக்தியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאֹהָלֶיךָ
  choice: தங்கள் கூடாரங்களுக்குப் போங்கள்
  rationale: எபிரெய உருவகத்தையும் வரலாற்று நிறத்தையும் காக்கிறது; இது அவரவர் இருப்பிடத்திற்குக் கலைந்து செல்லும் அழைப்பு.
- source_word: רְאֵה בֵיתְךָ
  choice: உன் சொந்த வீட்டைப் பார்த்துக்கொள்
  rationale: தாவீது தன் வம்சத்தின் காரியத்தைத் தானே கவனித்துக்கொள்ளட்டும் என்ற இகழ்ச்சியான அரசியல் விலகலை, மிகையாக விளக்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: לְאֹהָלָיו
  choice: தங்கள் கூடாரங்களுக்குப் போனார்கள்
  rationale: எபிரெயில் கூட்டொருமையைத் தொடர்ந்து ‘அவனுடைய கூடாரங்களுக்கு’ என்ற வடிவம் இருந்தாலும், தமிழில் பகிர்வுப் பன்மை பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אִישׁ என்ற ஆண்பால் ஒருமையின் பகிர்வுப் பயன்பாடு
  choice: ஒவ்வொருவரும்
  alternative: ஒவ்வொரு ஆணும்
  rationale: இங்கு அழைப்பு இஸ்ரவேல் சமூகத்தினர் தத்தம் இடங்களுக்குச் செல்ல வேண்டும் என்பதாகும். மூலத்தின் ஒருமை பகிர்வுச் சக்தியைத் தக்கவைத்து, தமிழில் தேவையற்ற முறையில் ஆண்களுக்கு மட்டும் வரம்பிடாமல் வழங்கப்பட்டது.
- issue: தாவீது வம்சத்துடனான அரசியல் உறவுமறுப்பு
  choice: தாவீதிடம் நமக்கு என்ன பங்கு? ஈசாயின் மகனிடம் நமக்கு உரிமைப்பங்கு இல்லை.
  alternative: தாவீதோடு நமக்கு என்ன தொடர்பு? ஈசாயின் மகனோடு நமக்கு ஒன்றுமில்லை.
  rationale: ‘பங்கு’ மற்றும் ‘உரிமைப்பங்கு’ என்ற மூல உருவகங்களைப் பாதுகாப்பதால் அரசியல் பிரிவையும் வம்ச, உடன்படிக்கை சார்ந்த பதற்றத்தையும் உரை தானே வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசியல் உறவுமறுப்பின் கவிதைநடைச் சொற்றொடர்கள் தக்கவைக்கப்பட்டுள்ளன; ‘வீடு’ என்பது சூழலில் தாவீதின் குடும்பம் அல்லது வம்சத்தையும் உணர்த்தும் ambiguity விளக்கமின்றி பாதுகாக்கப்பட்டுள்ளது.
