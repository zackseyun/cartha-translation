  text: And the king answered them harshly[b][a], and King Rehoboam forsook the counsel of the elders.
translation:
  language: ta
  text: அரசன் அவர்களுக்குக் கடுமையாகப் பதிலளித்தான்[a]; அரசன் ரெகொபெயாம் மூப்பர்களின் ஆலோசனையைக் கைவிட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்குக் கடுமையுடன் பதிலளித்தான்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மூப்பர்களின் ஆலோசனையை நிராகரித்தான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנֵם
  choice: அவர்களுக்குப் பதிலளித்தான்
  rationale: ענה இங்கு ‘பதிலளித்தல்’ என்ற பொருளில் வருகிறது; இணைந்துள்ள மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டு பதில் யாருக்குக் கொடுக்கப்பட்டது என்பதை வெளிப்படையாகக் காட்டுகிறது.
- source_word: קָשָׁה
  choice: கடுமையாக
  rationale: வடிவத்தில் பெயரடையாக இருந்தாலும், இச்சூழலில் அரசன் பதிலளித்த விதத்தைக் குறிக்கும் வினையடைப் பொருளில் செயல்படுகிறது.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: அரசன் ரெகொபெயாம்
  rationale: எபிரெய மொழியின் அடைமொழி அமைப்பு அரசனைப் பெயரால் அடையாளப்படுத்துகிறது; தமிழ் உரையில் இயல்பாகவும் மூலத்தின் அமைப்புக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וַיַּעֲזֹב
  choice: கைவிட்டான்
  rationale: עזב என்பது ‘விடுதல், கைவிடுதல்’ என்று பொருள்படும். இங்கு மூப்பர்களின் ஆலோசனையை ஏற்காமல் ஒதுக்கிய திட்டமிட்ட செயலை ‘கைவிட்டான்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲצַת הַזְּקֵנִים
  choice: மூப்பர்களின் ஆலோசனை
  rationale: עצה என்பது ஆலோசனை அல்லது அறிவுரை; זקנים என்பது வெறுமனே வயதான ஆண்களை அல்ல, அங்கீகரிக்கப்பட்ட மூத்த ஆலோசகர்களைக் குறிக்கிறது.
