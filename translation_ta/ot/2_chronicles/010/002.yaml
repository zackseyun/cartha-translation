  text: וַ/יְהִ֞י כִּ/שְׁמֹ֨עַ יָרָבְעָ֤ם בֶּן נְבָט֙ וְ/ה֣וּא בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י שְׁלֹמֹ֣ה הַ/מֶּ֑לֶךְ וַ/יָּ֥שָׁב יָרָבְעָ֖ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
translation:
  language: ta
  text: நேபாத்தின் மகன் யெரொபெயாம் இதைக் கேள்விப்பட்டபோது[a]—அவன் சாலொமோன் மன்னனிடமிருந்து தப்பியோடி எகிப்தில் இருந்தான்[b]—யெரொபெயாம் எகிப்திலிருந்து திரும்பிவந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதைப் பற்றிக் கேள்விப்பட்டபோது.’ எபிரேய மூலத்தில் அவன் எதைக் கேள்விப்பட்டான் என்பது வெளிப்படையாகக் கூறப்படவில்லை; சூழலிலிருந்து அது புரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, ‘சாலொமோன் மன்னனின் முன்னிலையிலிருந்து தப்பியோடியிருந்தான்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: இதைக் கேள்விப்பட்டபோது
  rationale: היה உடன் வரும் שמע வினையெச்ச அமைப்பு காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது. எபிரேயத்தில் கேள்விப்பட்டதற்கான செயப்படுபொருள் வெளிப்படையாக இல்லை; தமிழில் இயல்பாக இருக்கச் சூழல் சுட்டும் ‘இதை’ சேர்க்கப்பட்டுள்ளது, மேலும் அடிக்குறிப்பில் மூலத்தின் மறைநிலை தெரிவிக்கப்படுகிறது.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: நேபாத்தின் மகன் யெரொபெயாம்
  rationale: தந்தைவழி அடையாளத்தை நவீனத் தமிழின் இயல்பான உடைமைத் தொடராக வழங்குகிறது; பெயர்கள் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன.
- source_word: וְהוּא בְמִצְרַיִם
  choice: அவன் எகிப்தில் இருந்தான்
  rationale: இது யெரொபெயாமின் அப்போதைய இருப்பிடத்தைப் பின்னணித் தகவலாக அளிக்கிறது. தனி விளக்கவாக்கியமாக அமைப்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  choice: சாலொமோன் அரசனிடமிருந்து தப்பியோடி அங்கே சென்றிருந்தான்
  rationale: ברח என்பது ‘தப்பியோடுதல்’; מִפְּנֵי என்பது சொற்படியாக ‘முன்னிலையிலிருந்து/சந்நிதியிலிருந்து’ என்றாலும், இச்சூழலில் சாலொமோனிடமிருந்து தப்புதல் என்று இயல்பாகப் பொருள்படுகிறது. אֲשֶׁר எகிப்தைச் சுட்டுவதால் ‘அங்கே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיָּשָׁב
  choice: திரும்பிவந்தான்
  rationale: இக்கதைச்சூழலில் שוב இடத்திற்குத் திரும்புவதைக் குறிக்கிறது; மனந்திரும்புதல் போன்ற இறையியல் பொருள் இங்கு இல்லை.
- source_word: מִמִּצְרָיִם
  choice: எகிப்திலிருந்து
  rationale: מן முன்னொட்டு திரும்பிவந்த தொடக்க இடத்தைச் சுட்டுகிறது.
