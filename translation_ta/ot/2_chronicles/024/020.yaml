base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
translation:
  language: ta
  text: 'அப்போது கடவுளின் ஆவி ஆசாரியனான யோயாதாவின் மகன் சகரியாவை ஆடையைப்போல் அணிந்துகொண்டது[a]. அவர் மக்களுக்கு மேலாக நின்று அவர்களிடம், “கடவுள் இவ்வாறு கூறுகிறார்: ‘நீங்கள் யாவேயின் கட்டளைகளை ஏன் மீறுகிறீர்கள்? நீங்கள் வெற்றி பெறமாட்டீர்கள்.[b] நீங்கள் யாவேயைக் கைவிட்டதால், அவரும் உங்களைக் கைவிட்டார்.’” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “சகரியாவின்மேல் வந்தது.” சொல்லுக்குச் சொல்: “சகரியாவை ஆடையாக அணிந்துகொண்டது.”'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீங்கள் யாவேயின் கட்டளைகளை ஏன் மீறுகிறீர்கள், அதனால் வெற்றி பெறாமல் இருக்கிறீர்கள்?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ אֱלֹהִים
  choice: கடவுளின் ஆவி
  rationale: தீர்க்கதரிசனப் பணிக்காகச் சகரியாவை வல்லமைப்படுத்தும் கடவுளின் செயற்பாட்டை இந்தச் சொற்றொடர் குறிக்கிறது; வெறும் மனநிலையாகவோ உந்துதலாகவோ அதைச் சுருக்கவில்லை.
- source_word: לָבְשָׁה אֶת
  choice: ஆடையாக அணிந்துகொண்டது
  rationale: לָבְשָׁה என்பதன் ஆடை அணிதல் உருவகத்தைத் தமிழிலும் தக்கவைக்கிறது. இங்கு ஆவியே எழுவாயாக இருந்து சகரியாவை ‘அணிந்துகொண்டது’ என்ற எபிரேயப் படிமம் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
- source_word: זְכַרְיָה בֶּן יְהוֹיָדָע הַכֹּהֵן
  choice: ஆசாரியனான யோயாதாவின் மகன் சகரியா
  rationale: הַכֹּהֵן என்பதை அருகிலுள்ள யோயாதாவுடன் இணைத்து, உறவையும் பதவியையும் இயல்பான தமிழ் வரிசையில் தருகிறது.
- source_word: וַיַּעֲמֹד מֵעַל לָעָם
  choice: அவர் மக்களுக்கு மேலே நின்று
  rationale: מֵעַל என்பதிலுள்ள செங்குத்தான இடநிலையைத் தக்கவைக்கிறது; அவர் உயர்த்தப்பட்ட மேடையில் நின்றாரா என்பதை உரை தீர்மானிப்பதில்லை.
- source_word: כֹּה אָמַר הָאֱלֹהִים
  choice: கடவுள் கூறுவது இதுவே
  rationale: தீர்க்கதரிசியின் தூதுரைச் சூத்திரத்தை நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வழங்குகிறது.
- source_word: לָמָה אַתֶּם עֹבְרִים אֶת מִצְוֹת יְהוָה
  choice: நீங்கள் யாவேயின் கட்டளைகளை மீறி ... போவது ஏன்?
  rationale: עבר என்பது கட்டளைகளின் எல்லையைத் தாண்டி அவற்றை மீறுவதைக் குறிக்கிறது; ‘மீறுதல்’ அதன் உடன்படிக்கை சார்ந்த நெறிப்பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְלֹא תַצְלִיחוּ
  choice: வெற்றி பெறாமல் போவது
  rationale: மீறுதலோடு இணைந்த தோல்வியின் விளைவை ஒரே வினாவுக்குள் இயல்பாகக் கொண்டுவருகிறது; எபிரேய வாவ் வெறும் தொடர்ச்சியாகவும் புரிந்துகொள்ளப்படலாம் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כִּי עֲזַבְתֶּם אֶת יְהוָה וַיַּעֲזֹב אֶתְכֶם
  choice: நீங்கள் யாவேயைக் கைவிட்டதால், அவரும் உங்களைக் கைவிட்டார்
  rationale: עזב என்ற ஒரே வினையை இருமுறையும் ‘கைவிடு’ என்று மொழிபெயர்த்து, மக்களின் செயலுக்கும் கடவுளின் பதிலுக்கும் இடையிலான திட்டமிட்ட ஒத்திசைவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரேய மூலத்தில் வரும் நான்கெழுத்து உடன்படிக்கைப் பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் உச்சரிப்புப் பெயர்ப்பாக வழங்குகிறது.
- issue: רוּחַ אֱלֹהִים என்பதன் ஆளுமை மற்றும் செயற்பாடு
  choice: கடவுளின் ஆவி
  alternative: கடவுளிடமிருந்து வந்த ஓர் ஆவி
  rationale: இச்சூழலில் தீர்க்கதரிசியை நேரடியாக ஆட்கொண்டு பேச வைக்கும் தெய்வீகச் செயற்பாட்டாளரையே சொற்றொடர் இயல்பாகக் குறிக்கிறது; அதேவேளை எபிரேயத்தை மீறிய திரித்துவ விளக்கத்தை வசனத்துக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, பொதுமக்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தீர்க்கதரிசன உரையின் தீவிரமும், ‘ஆடையாக அணிந்துகொண்டது’ என்ற அபூர்வமான மூலப்படிமமும் பாதுகாக்கப்பட்டுள்ளன. மேற்கோளுக்குள் உள்ள இறைவாக்கு தனி மேற்கோளால் குறிக்கப்பட்டுள்ளது; எல்லா அடிக்குறிப்பு குறிகளும் உரையில் உரிய சொற்றொடருக்குப் பின் வைக்கப்பட்டுள்ளன.
