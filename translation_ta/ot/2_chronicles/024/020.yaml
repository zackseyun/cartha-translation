  to: 'அப்போது கடவுளின் ஆவி ஆசாரியனான யோயாதாவின் மகன் சகரியாவை ஆடையைப்போல் அணிந்துகொண்டது[a]. அவர் மக்களுக்கு மேலாக நின்று அவர்களிடம், “கடவுள் இவ்வாறு கூறுகிறார்: ‘நீங்கள் யாவேயின் கட்டளைகளை ஏன் மீறுகிறீர்கள்? நீங்கள் வெற்றி பெறமாட்டீர்கள்.[b] நீங்கள் யாவேயைக் கைவிட்டதால், அவரும் உங்களைக் கைவிட்டார்.’” என்றார்.'
