base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
translation:
  language: ta
  text: வேலை செய்தவர்கள் உழைத்தார்கள்; அவர்களுடைய கைகளால் பழுதுபார்க்கும் வேலை முன்னேறியது.[a] அவர்கள் தேவனுடைய ஆலயத்தை அதன் உரிய நிலைக்கு மீட்டமைத்து,[b] அதை வலுப்படுத்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுடைய கைகளால் சீரமைப்பு வேலை செழித்தோங்கியது’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் குணமடைதல் அல்லது சீரமைத்தல் என்ற பொருளைக் கொண்டது; இங்கே அது கட்டடப் பழுதுபார்ப்பைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘தேவனுடைய ஆலயத்தை அதன் முந்தைய வடிவில் நிலைநிறுத்தி’ அல்லது ‘அதன் உரிய அடித்தளத்தில் நிலைநிறுத்தி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  choice: வேலை செய்தவர்கள் உழைத்தார்கள்
  rationale: எபிரெய மொழியின் சொற்படி மீளுரைப்பை முற்றிலும் நீக்காமல், நவீன தமிழில் இயல்பாகவும் செயலில் முனைப்பைக் காட்டுமாறும் மொழிபெயர்க்கிறது.
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  choice: பழுதுபார்க்கும் வேலை முன்னேறியது
  rationale: אֲרוּכָה என்பதன் ‘குணமடைதல், சீரமைப்பு, பழுதுபார்த்தல்’ என்ற பொருள் வரம்பில், ஆலயப் புதுப்பிப்புச் சூழலுக்கு ‘பழுதுபார்க்கும் வேலை’ பொருத்தமானது; עלה இங்கு முன்னேற்றத்தைக் குறிக்கிறது.
- source_word: בְּיָדָם
  choice: அவர்களுடைய கைகளால்
  rationale: செயற்பாட்டின் முகமையைக் குறிக்கும் எபிரெய மரபுத்தொடரின் கை உருவகத்தைத் தக்கவைக்கிறது.
- source_word: וַיַּעֲמִידוּ
  choice: மீட்டமைத்து
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் சொற்படி ‘நிற்கச் செய்தல்’; கட்டடச் சீரமைப்புச் சூழலில் மீண்டும் நிலைநிறுத்துதல் அல்லது மீட்டமைத்தல் என்ற பொருளைத் தருகிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயம்
  rationale: சொற்படி ‘தேவனுடைய வீடு’ என்றாலும், இங்கு குறிக்கப்படுவது எருசலேம் ஆலயம் என்பதால் சாதாரண தமிழ் வாசகருக்கு தெளிவாக ‘ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל מַתְכֻּנְתּוֹ
  choice: அதன் உரிய நிலைக்கு
  rationale: מַתְכֹּנֶת குறிக்கும் நிர்ணயிக்கப்பட்ட அமைப்பு, வடிவம் அல்லது தக்க நிலை என்ற பொருள் வரம்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיְאַמְּצֻהוּ
  choice: அதை வலுப்படுத்தினார்கள்
  rationale: אמץ என்பதன் பியேல் வடிவத்திலுள்ள உறுதியாக்குதல் அல்லது பலப்படுத்துதல் என்ற நேரடிப் பொருளைத் தருகிறது.
