translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. ‘கைகளால்’ என்ற எபிரெய உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘தேவனுடைய வீடு’ என்பதற்குப் பதிலாக சூழலுக்குத் தெளிவான ‘தேவனுடைய ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது.
