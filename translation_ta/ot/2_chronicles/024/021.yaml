revisions:
- from: அதனால் அவர்கள் அவருக்கு எதிராகச் சதிசெய்து, அரசனின் கட்டளையின்படி[a] யாவேயின் ஆலய முற்றத்தில் அவரைக் கல்லெறிந்து கொன்றார்கள்.[b]
  to: அவர்கள் அவருக்கு எதிராகச் சதி செய்து, அரசனின் கட்டளையின்படி[a] யாவேயின் ஆலய முற்றத்தில் அவரைக் கல்லெறிந்தார்கள்.[b]
  rationale: The revision removes an unwarranted explicit result (“killed”), retains the Hebrew action of stoning, and preserves the execution nuance in the footnote. It also avoids making the opening conjunction causally stronger than the source and improves modern Tamil orthography.
