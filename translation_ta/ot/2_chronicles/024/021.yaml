source:
  edition: WLC
  text: וַ/יִּקְשְׁר֣וּ עָלָ֔י/ו וַ/יִּרְגְּמֻ֥/הוּ אֶ֖בֶן בְּ/מִצְוַ֣ת הַ/מֶּ֑לֶךְ בַּ/חֲצַ֖ר בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
translation:
  language: ta
  text: அவர்கள் அவருக்கு எதிராகச் சதி செய்து, அரசனின் கட்டளையின்படி[a] யாவேயின் ஆலய முற்றத்தில் அவரைக் கல்லெறிந்தார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனின் ஆணையால்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவரைக் கல்லால் கல்லெறிந்தார்கள்”; இச்சொற்றொடர் கல்லெறிந்து நிறைவேற்றப்படும் மரணதண்டனையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: அவருக்கு எதிராகச் சதிசெய்து
  rationale: קשר என்பதுடன் עַל வரும்போது ஒருவருக்கு எதிராகக் கூட்டாகச் சதிசெய்தல் அல்லது சூழ்ச்சி செய்தல் என்பதே இங்கு பொருள்; இயல்பான நவீன தமிழில் ‘சதிசெய்து’ அதைத் தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  choice: அவரைக் கல்லெறிந்து கொன்றார்கள்
  rationale: רגם என்பது கல்லெறிந்து தண்டித்துக் கொல்வதைக் குறிக்கிறது; אֶבֶן கருவிப்பொருளில் ‘கல்லால்/கல்லெறிந்து’ என வருகிறது. தமிழில் ‘கல்லெறிந்தார்கள்’ மட்டும் மரணம் தெளிவாக இல்லாததால், சூழலிலுள்ள மரணதண்டனைப் பொருளை ‘கொன்றார்கள்’ வெளிப்படுத்துகிறது.
- source_word: בְּמִצְוַת הַמֶּלֶךְ
  choice: அரசனின் கட்டளையின்படி
  rationale: מִצְוָה இங்கு அதிகாரப்பூர்வமான கட்டளை; இந்த வடிவம் அரசனின் நேரடிப் பொறுப்பை இயல்பாகப் பாதுகாக்கிறது.
- source_word: בַּחֲצַר
  choice: முற்றத்தில்
  rationale: חָצֵר என்பது கட்டடத்தைச் சார்ந்த திறந்த முற்றத்தைக் குறிக்கிறது; ஆலயச் சூழலில் ‘முற்றம்’ இயல்பான தமிழ்.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בֵּית என்பது சொற்படியாக ‘வீடு’ என்றாலும், இச்சூழலில் ஆலயத்தைக் குறிக்கிறது. יְהוָה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: எபிரெய மூலத்தில் நான்கெழுத்து இறைப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயராக மாற்றாமல் உடன்படிக்கையின் தனிப்பெயரைத் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: רגם என்பதில் மரணதண்டனைப் பொருளை வெளிப்படுத்துதல்
  choice: கல்லெறிந்து கொன்றார்கள்
  alternative: கல்லெறிந்தார்கள்
  rationale: இங்கு நடந்தது வெறும் கல்லெறிதல் அல்ல, கல்லெறிந்து நிறைவேற்றப்பட்ட மரணதண்டனை. தமிழ் வாசகருக்கு அந்தச் செயல்விளைவைத் தெளிவாக்குகிறது; எவ்வாறாயினும் எபிரெயச் சொற்றொடரின் நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அதனால்’ என்பது முந்தைய நிகழ்வின் விளைவைக் காட்டும் וַ தொடரைச் சூழலோடு இணைக்கிறது. ‘ஆலய முற்றம்’ என்பது சொற்படியான ‘யாவேயின் வீட்டின் முற்றம்’ என்பதன் இயல்பான சூழல்சார் மொழிபெயர்ப்பு.
