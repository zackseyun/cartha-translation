base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: ta
  text: அப்போது அரசன் தலைவரான யோய்தாவை அழைத்து, அவரிடம், “யூதாவிலிருந்தும் எருசலேமிலிருந்தும், கர்த்தரின் ஊழியரான மோசே இஸ்ரயேல் சபைக்குச் சாட்சிக்கூடாரத்திற்காகக் கட்டளையிட்ட வரியை லேவியர்கள் கொண்டுவரச் செய்யாமல் இருந்தது ஏன்?” என்று கேட்டான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: தலைமை ஆசாரியரான
  rationale: சொல்லின் நேரடிப் பொருள் ‘தலைவர்/முதன்மையானவர்’; சூழலில் யோய்தா பிரதான ஆசாரியராக இருப்பதால் இயல்பான தமிழில் பங்கைத் தெளிவாக்குகிறது.
- source_word: דָרַשְׁתָּ עַל הַלְוִיִּם
  choice: லேவியர்களிடம் ... கோரவில்லை
  rationale: இங்கு வினைச்சொல் அதிகாரபூர்வமாக வற்புறுத்திக் கோருதல் அல்லது பொறுப்பேற்கச் செய்தல் என்ற பொருளில் வருகிறது.
- source_word: מַשְׂאַת
  choice: வரி
  rationale: இந்தச் சூழலில் கொண்டுவரப்பட வேண்டிய கட்டாய மதப் பங்களிப்பைக் குறிக்கிறது; நவீன வாசகருக்கு ‘வரி’ தெளிவானதும் ஆங்கில ஆலோசனை அடுக்குடன் ஒத்ததும் ஆகும்.
- source_word: אֹהֶל הָעֵדוּת
  choice: சாட்சிக் கூடாரம்
  rationale: உடன்படிக்கையின் சாட்சியுடன் தொடர்புடைய திருக்கூடாரத்திற்கான நிலையான, பொருள்நெருக்கமான மொழிபெயர்ப்பு.
- source_word: עֶבֶד יְהוָה
  choice: யெகோவாவின் பணியாளர்
  rationale: עבד என்பதன் சேவை மற்றும் கீழ்ப்படிதல் உணர்வை இயல்பான நவீன தமிழில் தருகிறது; தேவப்பெயர் தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: மோசேயும் இஸ்ரயேல் சபையும் வரியுடன் கொண்டுள்ள தொடர்பு
  choice: ‘மோசேயும் இஸ்ரயேல் சபையும் ... விதித்த வரி’
  alternative: ‘மோசேயின் வரியும் இஸ்ரயேல் சபையின் வரியும்’
  rationale: எபிரெய உரையின் இணைப்பமைப்பு இருவரையும் ஒரே வசூலுடன் தொடர்புபடுத்துகிறது; இரண்டு தனித்தனி வரிகள் எனத் தவறாக உணர்த்தாமல் இயல்பான தமிழில் வழங்கப்பட்டது.
- issue: தேவப்பெயர் יהוה
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் வெளிப்படையாகக் காட்டுகிறது.
translation_notes:
  register: மரியாதைமிக்க நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. அரசன் யோய்தாவை நோக்கிப் பேசுவதால் ‘நீர்’ என்ற மரியாதை ஒருமை தேர்ந்தெடுக்கப்பட்டது. கேள்வியின் கண்டிப்பு காக்கப்பட்டாலும் தேவையற்ற கடுமை சேர்க்கப்படவில்லை.
