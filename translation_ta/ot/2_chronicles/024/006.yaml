  source_fidelity: திருத்தம் தேவை. הָרֹאשׁ என்பதற்கு மூலத்தில் வெளிப்படையாக ‘ஆசாரியர்’ இல்லை; ஆகவே ‘தலைமை ஆசாரியர்’ என்பது தேவையற்ற குறிப்பாக்கம். மேலும் מַשְׂאַת מֹשֶׁה ... וְהַקָּהָל לְיִשְׂרָאֵל என்ற தொடரில் வரியை ‘மோசேயும் இஸ்ரயேல் சபையும் விதித்தது’ எனக் கூறுவது மூலத்தின் உறவை மாற்றுகிறது. மோசேயுடன் தொடர்புடைய, இஸ்ரயேல் சபைக்கான/அதனுடன் தொடர்புடைய வசூல் என்ற மூலத்தின் சற்றே செறிந்த அமைப்பைத் தக்கவைத்துள்ளேன்.
  naturalness: திருத்தப்பட்ட உரை நவீன தரமான தமிழில் இயல்பாகவும், அரசன் யோய்தாவிடம் பேசும் மரியாதைத் தொனியைத் தக்கவைத்தும் உள்ளது. ‘கொண்டுவரச் செய்யவில்லை’ என்பது לְהָבִיא உடன் דָרַשְׁתָּ עַל-இன் பொறுப்பேற்கச் செய்தல் என்ற நுணுக்கத்தைத் தெளிவாகக் காட்டுகிறது.
