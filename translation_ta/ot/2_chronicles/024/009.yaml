source:
  edition: WLC
  text: וַ/יִּתְּנוּ ק֞וֹל בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֗ם לְ/הָבִ֤יא לַֽ/יהוָה֙ מַשְׂאַ֞ת מֹשֶׁ֧ה עֶֽבֶד הָ/אֱלֹהִ֛ים עַל יִשְׂרָאֵ֖ל בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
translation:
  language: ta
  text: யூதாவிலும் எருசலேமிலும், கடவுளின் ஊழியரான மோசே வனாந்தரத்தில் இஸ்ரவேலர்மேல் விதித்த காணிக்கையை[a] யாவேக்குக் கொண்டுவர வேண்டும் என்று அவர்கள் அறிவித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பங்களிப்பை”; அல்லது, “கடவுளின் ஊழியரான மோசே இஸ்ரவேலர்மேல் விதித்த வரியை.” எபிரேயச் சொல் நிர்ணயிக்கப்பட்ட காணிக்கை அல்லது கட்டாயப் பங்களிப்பைக் குறிக்கலாம்.
    reason: מַשְׂאַת என்பதன் பொருள்வீச்சில் காணிக்கை, பங்களிப்பு, கட்டாயமாக விதிக்கப்பட்ட வரி/விதிப்பு ஆகிய நிழற்பொருள்கள் உள்ளன.
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  choice: அவர்கள் அறிவித்தார்கள்
  rationale: சொல்லுக்கு சொல் ‘குரல் கொடுத்தார்கள்’ என்ற எபிரேய மரபுத்தொடர், இச்சூழலில் பொதுமக்களுக்கான அறிவிப்பைக் குறிக்கிறது; ‘அறிவித்தார்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: בִּיהוּדָה וּבִירוּשָׁלִַם
  choice: யூதாவிலும் எருசலேமிலும்
  rationale: அறிவிப்பு செய்யப்பட்ட இரு புவியியல் பகுதிகளையும் நேரடியாகத் தருகிறது.
- source_word: לְהָבִיא לַיהוָה
  choice: யாவேக்கு கொண்டுவர வேண்டும்
  rationale: לְהָבִיא எனும் நோக்கப் பொருளைத் தமிழில் அறிவிப்பின் உள்ளடக்கமாக இயல்பாக வெளிப்படுத்துகிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: מַשְׂאַת
  choice: விதித்த காணிக்கை
  rationale: இந்தச் சொல் வெறும் தன்னார்வப் பங்களிப்பை விட நிர்ணயிக்கப்பட்ட அல்லது கடமையாக்கப்பட்ட செலுத்துதலைக் குறிக்கலாம். ‘விதித்த காணிக்கை’ அதன் கட்டாயத் தன்மையையும் வழிபாட்டுச் சூழலையும் சமநிலைப்படுத்துகிறது.
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  choice: கடவுளின் ஊழியரான மோசே
  rationale: ‘கடவுளின் ஊழியர்’ என்ற பட்டத்தைப் பாதுகாத்து, தமிழில் இயல்பான தொடர்பமைப்பை வழங்குகிறது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலருக்காக
  rationale: עַל இங்கு ‘இஸ்ரவேல்மேல் விதிக்கப்பட்டது’ அல்லது ‘இஸ்ரவேலருக்கானது’ எனப் புரியக்கூடியது. முதன்மை உரையில் இயல்பான ‘இஸ்ரவேலருக்காக’ பயன்படுத்தப்பட்டு, விதிக்கப்பட்ட தன்மை ‘விதித்த’ என்பதால் வெளிப்படுகிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: மோசேயின் காலத்தில் இஸ்ரவேலர் இருந்த பாலைநிலப் பகுதியைக் குறிக்கும் வழக்கமான, புரிந்துகொள்ளத்தக்க வேதாகமத் தமிழ் சொல்.
theological_decisions:
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் உடன்படிக்கைத் தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் அறியப்பட்ட வடிவில் ஒலிபெயர்க்கிறது.
- issue: מַשְׂאַת மற்றும் עַל יִשְׂרָאֵל ஆகியவற்றின் கட்டாயத் தன்மை
  choice: மோசே விதித்த காணிக்கை
  alternative: மோசேயின் காணிக்கை / இஸ்ரவேலர்மேல் விதிக்கப்பட்ட வரி
  rationale: இது தன்னார்வ நன்கொடை மட்டுமல்ல என்பதைக் காட்டுகிறது; அதேவேளை நவீன அரசாங்க ‘வரி’ என்ற மிகக் குறுகிய பொருளையும் தவிர்க்கிறது. ‘விதித்த’ என்பது עַל என்பதிலிருக்கக்கூடிய ‘மேல் சுமத்தப்பட்ட’ நுணுக்கத்தையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘வனாந்தரம்,’ ‘ஊழியர்,’ ‘காணிக்கை’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; மிகப் பழமையான வாக்கிய அமைப்பு தவிர்க்கப்பட்டுள்ளது.
