  source_fidelity: 'மூல எபிரெய உரையின் கூறுகள் அனைத்தும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: இறைவன் தீர்க்கதரிசிகளை அவர்களிடையே அனுப்புதல், அவர்களை யாவேவிடம் திருப்புவதற்கான நோக்கம், அவர்களுக்கு எதிரான தீர்க்கதரிசனச் சாட்சி, மற்றும் மக்கள் செவிகொடுக்காதிருத்தல். வினைச்சொல் וַיָּעִידוּ மற்றும் அதனுடன் வரும் בָם ஆகியவற்றின் நீதிமன்ற/எச்சரிக்கை நிழற்பொருளை முதன்மை உரையும் அடிக்குறிப்பும் சமநிலையுடன் காக்கின்றன.'
  naturalness: நடை நவீன நிலையான தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. “செவிகொடுக்கவில்லை,” “திரும்பக் கொண்டுவருவதற்காக,” மற்றும் “எதிராகச் சாட்சியளித்தார்கள்” ஆகியவை சூழலுக்கேற்ற இயல்பான பயன்பாடுகள். மீளுமையாக வரும் சுட்டுப்பெயர்கள் மூல உரையின் குறுகிய நடையைத் தக்கவைத்தபோதும் பொருளைத் தெளிவிழக்கச் செய்யவில்லை.
