  text: וַ/יִּשְׁלַ֤ח בָּ/הֶם֙ נְבִאִ֔ים לַ/הֲשִׁיבָ֖/ם אֶל יְהוָ֑ה וַ/יָּעִ֥ידוּ בָ֖/ם וְ/לֹ֥א הֶאֱזִֽינוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
translation:
  language: ta
  text: ஆயினும், அவர்களை யாவேவிடம் திரும்பக் கொண்டுவருவதற்காக அவர் அவர்களிடையே தீர்க்கதரிசிகளை அனுப்பினார். அவர்கள் அவர்களுக்கு எதிராகச் சாட்சியளித்தார்கள்[a]; ஆனால் அவர்களோ செவிகொடுக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை எச்சரித்தார்கள்.” எபிரெய வினை கடுமையாக எச்சரித்தல் என்ற பொருளையும் கொண்டிருக்கலாம்; இங்கு அவர்களுக்கு எதிராகச் சாட்சியளித்தல் என்ற நுட்பமும் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח בָּהֶם נְבִאִים
  choice: அவர் அவர்களிடையே தீர்க்கதரிசிகளை அனுப்பினார்
  rationale: שלח என்பதன் இயல்பான கதைநடைப் பொருளை ‘அனுப்பினார்’ என்றும், குழுவின் நடுவே அனுப்பப்பட்டதை בָּהֶם குறிக்கக்கூடும் என்பதால் ‘அவர்களிடையே’ என்றும் மொழிபெயர்க்கப்பட்டது.
- source_word: לַהֲשִׁיבָם אֶל יְהוָה
  choice: அவர்களை யாவேவிடம் திரும்பக் கொண்டுவருவதற்காக
  rationale: שוב என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளையும், யாவேவுடனான உறவுக்குத் திரும்புதலையும் ‘திரும்பக் கொண்டுவர’ வெளிப்படுத்துகிறது.
- source_word: וַיָּעִידוּ בָם
  choice: அவர்கள் அவர்களுக்கு எதிராகச் சாட்சியளித்தார்கள்[a]
  rationale: עוד என்பதன் ஹிஃபில் வடிவம் கடுமையாக எச்சரித்தல் அல்லது சாட்சியிடுதல் ஆகிய பொருள்களைக் கொண்டது. இச்சூழலில் בָם உடன் வரும் நீதிமன்றத் தன்மையை ‘எதிராகச் சாட்சியளித்தார்கள்’ பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: ஆனால் அவர்களோ செவிகொடுக்கவில்லை
  rationale: கவனமாகக் கேட்பதை மறுத்த நிலையை இயல்பான நவீனத் தமிழில் ‘செவிகொடுக்கவில்லை’ தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய மூலத்திலுள்ள தனிப்பட்ட இறைப் பெயரை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- issue: וַיָּעִידוּ என்பதன் தீர்க்கதரிசனச் செயல்பாடு
  choice: அவர்களுக்கு எதிராகச் சாட்சியளித்தார்கள்
  alternative: அவர்களை எச்சரித்தார்கள்
  rationale: உடன்படிக்கை மீறலைக் கண்டிக்கும் சூழலில் உள்ள சாட்சியத் தன்மையை முதன்மை உரை பாதுகாக்கிறது; அதே நேரத்தில் எபிரெய வினையின் எச்சரிக்கைப் பொருளும் அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையுடன் வடிவமைக்கப்பட்டது. ‘அவர்’ என்ற எழுவாய் மூலத்தின் மறைமுகக் குறிப்பைத் தக்கவைக்கிறது; விளக்கமாக ‘தேவன்’ என்பது சேர்க்கப்படவில்லை.
