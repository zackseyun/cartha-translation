source:
  edition: WLC
  text: וְ/לֹא זָכַ֞ר יוֹאָ֣שׁ הַ/מֶּ֗לֶךְ הַ/חֶ֨סֶד֙ אֲשֶׁ֨ר עָשָׂ֜ה יְהוֹיָדָ֤ע אָבִי/ו֙ עִמּ֔/וֹ וַֽ/יַּהֲרֹ֖ג אֶת בְּנ֑/וֹ וּ/כְ/מוֹת֣/וֹ אָמַ֔ר יֵ֥רֶא יְהוָ֖ה וְ/יִדְרֹֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
translation:
  language: ta
  text: ஆனால் யோவாஸ் அரசன், தன் தந்தையான யோய்தா தனக்குக் காட்டிய தயவை நினைவில் கொள்ளவில்லை[a][b]; அவருடைய மகனைக் கொன்றான். அந்த மகன் இறந்துகொண்டிருக்கும்போது, “யாவே பார்த்து விசாரிப்பாராக!”[c] என்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தயவை’ என்பதற்குப் பதிலாக, ‘அன்பை,’ ‘விசுவாசமான பற்றுறுதியை,’ அல்லது ‘உடன்படிக்கைப் பற்றுறுதியை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தன் தந்தை’ என்பது யோய்தா யோவாசின் உயிரியல் தந்தை என்பதைக் குறிக்காமல், அவரைப் பாதுகாத்து வளர்த்ததில் யோய்தா வகித்த தந்தைக்குரிய பங்கைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: ‘யாவே பார்த்து அதற்குக் கணக்குக் கேட்பாராக’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினை, அநீதியை ஆராய்ந்து அதற்குப் பொறுப்புக் கேட்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶסֶד
  choice: அன்பை
  rationale: חֶסֶד என்பது அன்பு, பரிவு, விசுவாசமான பற்றுறுதி ஆகிய பொருள்களைக் கொண்டிருக்கலாம். இங்கு யோய்தா யோவாசுக்குச் செய்த நன்மையையும் அவரிடம் காட்டிய நிலையான பரிவையும் இயல்பாகக் குறிக்க ‘அன்பு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: זָכַר
  choice: நினைவில் கொள்ளவில்லை
  rationale: எபிரெயச் சொல்லின் நேரடியான ‘நினைவுகூருதல்’ என்ற கருத்தைப் பேணுகிறது; நன்றியுடன் அதற்கேற்ப நடக்கத் தவறியதையும் சூழல் உணர்த்த அனுமதிக்கிறது.
- source_word: אָבִיו
  choice: தன் தந்தை
  rationale: மூலத்தில் உள்ள ‘அவனுடைய தந்தை’ என்ற சொல்லாட்சியைப் பேணுகிறது. இது உயிரியல் தந்தையைக் குறிக்காமல், யோவாசைப் பாதுகாத்து வளர்த்த யோய்தாவின் தந்தைக்குரிய பங்கைச் சுட்டலாம்.
- source_word: וַיַּהֲרֹג אֶת־בְּנוֹ
  choice: அவருடைய மகனைக் கொன்றான்
  rationale: யோவாஸ் யோய்தாவின் மகனைக் கொன்றான் என்ற நேரடியான பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּכְמוֹתוֹ
  choice: இறந்துகொண்டிருக்கும்போது
  rationale: அவன் சாகும் தருணத்தில் கூறிய இறுதி வேண்டுதலைக் குறிக்கும் காலநிலைப் பொருளை வெளிப்படுத்துகிறது.
- source_word: יֵרֶא יְהוָה
  choice: யாவே இதைப் பார்த்து
  rationale: வேண்டுதல் அல்லது முறையீட்டைக் குறிக்கும் எபிரெய வினை வடிவின் உணர்வைத் தொடரும் வாக்கியத்தின் ‘கேட்பாராக’ வடிவுடன் சேர்ந்து வெளிப்படுத்துகிறது; தேவனுடைய தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְיִדְרֹשׁ
  choice: இதற்குக் கணக்குக் கேட்பாராக
  rationale: דרש இங்கு அநீதியை விசாரித்து அதற்குப் பொறுப்புக் கேட்கும் நீதித்துறை சார்ந்த பொருளைக் கொண்டிருக்கலாம். ‘கணக்குக் கேட்பாராக’ என்பது பழிவாங்குதல் என்று அளவுக்கு மீறிக் குறுக்காமல் அந்தப் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: சகரியாவின் இறுதி வார்த்தைகளில் வரும் தெய்வீக முறையீடு
  choice: யாவே அநீதியைப் பார்த்து அதற்குக் கணக்குக் கேட்க வேண்டும் என்ற வேண்டுதல்
  alternative: நேரடியாகப் பழிவாங்க வேண்டும் என்ற வேண்டுதல்; அல்லது யாவே பார்க்கிறார் என்ற சாதாரண கூற்று
  rationale: יֵרֶא மற்றும் וְיִדְרֹשׁ ஆகிய வடிவங்கள் வேண்டுதல் மற்றும் நீதியான பொறுப்புக்கூறலை உணர்த்துகின்றன. மொழிபெயர்ப்பு பழிவாங்குதல் என்று பொருளைக் குறுக்காமல், நீதித்தீர்ப்பின் பதற்றத்தைப் பேணுகிறது.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; ஆண்டவர்
  rationale: மூலத்தில் வரும் நான்கு எழுத்து இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் தனிப்பெயர் வடிவமாக ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகம உரைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘மாறாக’ என்பது முந்தைய அன்பை நினைவில் கொள்ளாததற்கும் மகனைக் கொன்றதற்கும் இடையிலான கடும் எதிர்மறையை இயல்பாக வெளிப்படுத்துகிறது. ‘அந்த மகன்’ என்பது இறந்துகொண்டிருப்பவர் யோய்தாவின் மகன் என்பதைத் தமிழில் குழப்பமின்றித் தெளிவாக்குகிறது.
