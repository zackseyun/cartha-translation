  rationale: மூலத்தில் தெளிவாகச் சொல்லப்படாத சுட்டுப்பொருள்களை இறுதி முறையீட்டிலிருந்து நீக்கி, யாவே காணவும் நீதியாக விசாரிக்கவும் வேண்டும் என்ற சகரியாவின் வேண்டுதலைத் திறந்த நிலையில் பேணியுள்ளேன். חֶסֶד-இன் இச்சூழல் சார்ந்த மனிதருக்கிடையேயான நன்மை/கருணை உணர்வுக்காக ‘தயவு’ பயன்படுத்தப்பட்டுள்ளது. பெயர்கள், தந்தை-உருவகக் குறிப்பு, மற்றும் காலநிலை ஆகியவை மூலத்துக்கு ஏற்ப தக்கவைக்கப்பட்டுள்ளன.
