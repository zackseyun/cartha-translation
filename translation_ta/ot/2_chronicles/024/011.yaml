base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/011.yaml
  text: And whenever the chest was brought by the Levites to the king’s oversight[a], and when they saw that the money was abundant, the king’s scribe and the chief priest’s officer would come and empty the chest, then carry it and return it to its place. Thus they did day by day[b], and they gathered money in abundance.
translation:
  language: ta
  text: லேவியர்கள் அந்தப் பெட்டியை[a] அரசனின் அதிகாரிகளிடம் கொண்டுவந்தபோதெல்லாம், அதில் பணம்[b] மிகுதியாக இருப்பதைக் கண்டதும், அரசனின் எழுத்தரும் தலைமைக் குருவின் அலுவலரும் வந்து பெட்டியைக் காலி செய்தார்கள்; பின்னர் அதை எடுத்துக்கொண்டு மீண்டும் அதன் இடத்தில் வைத்தார்கள். நாள்தோறும் அவர்கள் இவ்வாறே செய்தார்கள்; ஏராளமான பணத்தைச் சேகரித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இதற்கான சொல் நேரடியாக ‘பேழை’ என்றும் மொழிபெயர்க்கப்படலாம்; இங்கு அது உடன்படிக்கைப் பேழையை அல்ல, காணிக்கை சேகரிக்கும் பெட்டியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘வெள்ளி’; இந்நிர்வாகச் சூழலில் சேகரிக்கப்பட்ட பணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: பெட்டி
  rationale: இங்கு காணிக்கைகளைச் சேகரிக்கப் பயன்படுத்தப்பட்ட கொள்கலனையே குறிக்கிறது; உடன்படிக்கைப் பெட்டியைக் குறிப்பதாகத் தவறாகப் புரிந்துகொள்ளாமல் இருக்க, இயல்பான நவீனத் தமிழில் ‘பெட்டி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: פְּקֻדַּת הַמֶּלֶךְ
  choice: அரசனின் மேற்பார்வை
  rationale: நிர்வாகச் சூழலில் இந்தச் சொற்றொடர் அரசனின் அதிகாரப்பூர்வ மேற்பார்வை அல்லது கண்காணிப்பைக் குறிக்கிறது; ‘மேற்பார்வை’ அந்தப் பொருளை மிகைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: בְּיַד הַלְוִיִּם
  choice: லேவியர்கள் … கொண்டுவந்த
  rationale: எபிரெயச் சொற்றொடர் செயற்பாட்டாளர்களைக் குறிக்கிறது; தமிழில் இயல்பாக லேவியர்களை எழுவாயாகக் கொண்டு மொழிபெயர்க்கப்பட்டது.
- source_word: רַב הַכֶּסֶף
  choice: பணம் மிகுதியாக இருந்தது
  rationale: כֶּסֶף என்பதற்கு ‘வெள்ளி’ அல்லது ‘பணம்’ என்று பொருள் கொள்ளலாம்; காணிக்கை வசூலிக்கும் இந்நிர்வாகச் சூழலில் ‘பணம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: סוֹפֵר הַמֶּלֶךְ
  choice: அரசனின் எழுத்தர்
  rationale: சொல் வரலாற்றுச் சிறப்புடைய அரச நிர்வாக எழுத்தர் அல்லது செயலரைக் குறிக்கிறது; ‘எழுத்தர்’ பதவியின் பொதுவான தன்மையைப் பாதுகாக்கிறது.
- source_word: פְקִיד כֹּהֵן הָרֹאשׁ
  choice: தலைமைக் குருவின் அலுவலர்
  rationale: தலைமைக் குருவின் கீழ் செயல்பட்ட அதிகாரப்பூர்வ பணியாளரைக் குறிக்கும்; குறிப்பிட்ட பதவிநிலையை ஆதாரமின்றி நிர்ணயிக்காமல் ‘அலுவலர்’ என வழங்கப்பட்டது.
- source_word: וִיעָרוּ אֶת הָאָרוֹן
  choice: பெட்டியைக் காலி செய்வார்கள்
  rationale: பெட்டிக்குள் இருந்த பணத்தை வெளியே எடுப்பதே இங்கு கருத்து; தமிழில் ‘காலி செய்வார்கள்’ என்பது தெளிவான இயல்பான நடை.
- source_word: וְיִשָּׂאֻהוּ וִישִׁיבֻהוּ אֶל מְקֹמוֹ
  choice: அதை எடுத்துச் சென்று அதன் இடத்திலேயே திரும்ப வைப்பார்கள்
  rationale: பெட்டியை எடுத்துச் சென்று மீண்டும் அதற்குரிய இடத்தில் வைக்கும் செயல்வரிசையைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: כֹּה עָשׂוּ לְיוֹם בְּיוֹם
  choice: நாள்தோறும் அவர்கள் இவ்வாறே செய்தார்கள்
  rationale: தினமும் மீண்டும் மீண்டும் நிகழ்ந்த செயலைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: וַיַּאַסְפוּ כֶסֶף לָרֹב
  choice: ஏராளமான பணத்தைச் சேகரித்தார்கள்
  rationale: தொடர்ச்சியான நடவடிக்கையின் விளைவாக மிகுந்த அளவு பணம் திரட்டப்பட்டதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
