source:
  edition: WLC
  text: וְ/אֵ֖לֶּה הַ/מִּתְקַשְּׁרִ֣ים עָלָ֑י/ו זָבָ֗ד בֶּן שִׁמְעָת֙ הָֽ/עַמּוֹנִ֔ית וִ/יה֣וֹזָבָ֔ד בֶּן שִׁמְרִ֖ית הַ/מּוֹאָבִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/026.yaml
  text: 'And these were the men who conspired against him: Zabad son of Shimeath the Ammonite woman[a], and Jehozabad son of Shimrith the Moabite woman.'
translation:
  language: ta
  text: 'அவனுக்கு எதிராகச் சதி செய்தவர்கள் இவர்களே: அம்மோனியப் பெண்ணான சிமெயாத்தின் மகன் சாபாதும், மோவாபியப் பெண்ணான சிம்ரித்தின் மகன் யெகோசாபாத்தும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: இவர்களே
  rationale: சதியில் ஈடுபட்டவர்களை அடையாளம் காட்டும் இயல்பான தமிழ் வடிவம்; இணைப்பான וְ என்பதன் தொடர்ச்சி, தமிழ் கதைநடையில் தனியே ‘மேலும்’ என்று வெளிப்படுத்தாமலேயே தெளிவாகிறது.
- source_word: הַמִּתְקַשְּׁרִים עָלָיו
  choice: அவனுக்கு எதிராகச் சதிசெய்தவர்கள்
  rationale: קשר என்பதன் ஹித்பயேல் வடிவம் கூட்டாகச் சதி செய்தலைக் குறிக்கிறது; עָלָיו சதியின் இலக்கை, ‘அவனுக்கு எதிராக’ எனக் காட்டுகிறது.
- source_word: זָבָד
  choice: சாபாத்
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்த்த வடிவம்.
- source_word: שִׁמְעָת
  choice: சிமெயாத்
  rationale: எபிரெய தனிப்பெயரைத் தமிழில் வாசிக்கத்தக்க வகையில் எழுத்துப்பெயர்த்த வடிவம்.
- source_word: הָעַמּוֹנִית
  choice: அம்மோனியப் பெண்ணான
  rationale: பெண்பால் ஒருமை வடிவத்தைத் தெளிவாகப் பாதுகாத்து, சிமெயாத் அம்மோன் இனத்தைச் சேர்ந்த பெண் என்பதைச் சொல்கிறது.
- source_word: וִיהוֹזָבָד
  choice: யெகோசாபாத்தும்
  rationale: வசனத்தின் இரண்டாவது நபரை முதல் நபருடன் இணைக்கும் וְ-ஐ தமிழ் இணைப்பு விகுதியான ‘-உம்’ மூலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁמְרִית
  choice: சிம்ரித்
  rationale: எபிரெய தனிப்பெயரின் மெய்யொலி அமைப்பை அண்மையாகப் பாதுகாக்கும் தமிழ் எழுத்துப்பெயர்ப்பு.
- source_word: הַמּוֹאָבִית
  choice: மோவாபியப் பெண்ணான
  rationale: பெண்பால் ஒருமையைத் தெளிவுபடுத்தி, சிம்ரித் மோவாப் இனத்தைச் சேர்ந்த பெண் என்பதைப் பாதுகாக்கிறது.
