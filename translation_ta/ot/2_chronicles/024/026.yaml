translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பெண்பால் இன அடையாளங்கள் இரண்டும் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையிலுள்ள [a] குறிப்பு அதன் இடத்துக்கும் உள்ளடக்கத்துக்கும் பொருந்தாததால், மூல எபிரெய உரைக்கு அவசியமில்லாத அந்தக் குறிப்பு சேர்க்கப்படவில்லை.
