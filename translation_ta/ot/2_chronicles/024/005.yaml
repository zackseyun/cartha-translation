base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
translation:
  language: ta
  text: அவன் ஆசாரியர்களையும் லேவியர்களையும் ஒன்றுகூட்டி அவர்களிடம், “யூதாவின் நகரங்களுக்குப் புறப்பட்டுச் சென்று, ஆண்டுதோறும் உங்கள் கடவுளின் இல்லத்தைப் பழுதுபார்க்க[b], இஸ்ரவேல் முழுவதிலுமிருந்து வெள்ளியை[a]ச் சேகரியுங்கள். இந்தக் காரியத்தை விரைவாகச் செய்யுங்கள்” என்றான். ஆனால் லேவியர்கள் விரைவாகச் செயல்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பணத்தை.” எபிரெய மொழியில் பண வசூலைக் குறிக்க உறுதியான பொருட்சொல்லாக “வெள்ளி” பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “வலுப்படுத்த.” இங்கு ஆலயக் கட்டிடத்தைப் பழுதுபார்த்து உறுதிப்படுத்துவது பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ஒன்றுகூட்டி
  rationale: קבץ என்பதன் பொருள் மக்களை ஒன்றாகக் கூட்டுவது; ஆசாரியர்களும் லேவியர்களும் நேரடிப் பொருளாக வருவதால் இந்தத் தேர்வு இயல்பானது.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: ஆசாரியர்களையும் லேவியர்களையும்
  rationale: ஆலயப் பணியுடன் தொடர்புடைய இரு தனித்த குழுக்களையும் எபிரெய உரையைப் போலவே வெளிப்படையாக வைத்திருக்கிறது.
- source_word: צְאוּ לְעָרֵי יְהוּדָה
  choice: யூதாவின் நகரங்களுக்குப் புறப்பட்டுச் சென்று
  rationale: יצא என்ற வினையின் வெளியே புறப்படும் திசைநயத்தையும், யூதாவின் நகரங்கள் என்ற இலக்கையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וְקִבְצוּ
  choice: சேகரியுங்கள்
  rationale: பணம் அல்லது வெள்ளி போன்றவற்றைத் திரட்டுவதற்கு நவீன தமிழில் இயல்பான கட்டளை வடிவம்.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: இஸ்ரவேல் முழுவதிலுமிருந்து
  rationale: ‘இஸ்ரவேல்’ என்பதை யூதாவுக்கு மட்டும் சுருக்காமல், மூலத்தின் பரந்த வரலாற்று மற்றும் உடன்படிக்கைச் சுட்டைத் தக்கவைக்கிறது; மக்கள் அல்லது பரப்பு என்ற நுண் தெளிவின்மையையும் தேவையின்றித் தீர்ப்பதில்லை.
- source_word: כֶּסֶף
  choice: வெள்ளி
  rationale: மூலத்தில் உள்ள உறுதியான பொருட்சொல்லைத் தக்கவைக்கிறது; அது பணத்தைக் குறிக்கவும் பயன்படுவதால் மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְחַזֵּק
  choice: பழுதுபார்க்க
  rationale: חזק என்பதன் அடிப்படைப் பொருள் ‘வலுப்படுத்த’ என்றாலும், கட்டிடச் சூழலில் அதை உறுதிப்படுத்தும் பழுதுபார்ப்பு நோக்கமே இயல்பான பொருள்.
- source_word: בֵּית אֱלֹהֵיכֶם
  choice: உங்கள் கடவுளின் ஆலயம்
  rationale: ‘வீடு’ என்ற சொற்சொல் வடிவத்தை விட, இச்சூழலில் கடவுளுக்குரிய ஆலயக் கட்டிடத்தைக் குறிக்கும் பொருளை சாதாரண வாசகருக்குத் தெளிவாக அளிக்கிறது.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: ஆண்டுதோறும்
  rationale: தொடர்ச்சியான வருடாந்திர நிகழ்வைக் குறிக்கும் எபிரெய மரபுத்தொடரின் இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: וְאַתֶּם תְּמַהֲרוּ לַדָּבָר
  choice: இந்தக் காரியத்தை விரைவாகச் செய்யுங்கள்
  rationale: கட்டளையின் அவசரத் தன்மையை தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְלֹא מִהֲרוּ הַלְוִיִּם
  choice: ஆனால் லேவியர்கள் விரைவாகச் செயல்படவில்லை
  rationale: முந்தைய கட்டளையிலுள்ள מהר என்ற வேர்ச்சொல்லின் மீளுரையை ‘விரைவாக’ என்று பிரதிபலித்து உரையின் எதிர்மறை மாறுபாட்டைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘இஸ்ரவேல் முழுவதும்’ என்பதன் வரம்பு
  choice: இஸ்ரவேல் முழுவதிலுமிருந்து
  alternative: இஸ்ரவேலர் அனைவரிடமிருந்தும்; யூதாவின் மக்கள் அனைவரிடமிருந்தும்
  rationale: நாளாகம ஆசிரியர் ‘இஸ்ரவேல்’ என்பதை யூதாவைத் தாண்டிய பரந்த உடன்படிக்கை மக்களைக் குறிக்கப் பயன்படுத்தக்கூடும். ஆகவே அதை யூதாவுக்கு மட்டும் சுருக்காமல், மூலத்தின் பரந்த வரலாற்று-இறையியல் பதற்றத்தைத் தக்கவைக்கிறது.
- issue: ‘கடவுளின் வீடு’ என்ற உருவகம்
  choice: உங்கள் கடவுளின் ஆலயம்
  alternative: உங்கள் கடவுளின் இல்லம்
  rationale: இங்கு குறிப்பது ஆலயக் கட்டிடம் என்பது சூழலால் தெளிவு. ‘ஆலயம்’ என்பது எந்தப் பிரிவுசார் கருத்தையும் சேர்க்காமல் நவீன தமிழில் நோக்கத்தைத் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கட்டளையின் அவசரமும், அதற்கு மாறாக லேவியர்கள் தாமதித்ததும் ஒரே ‘விரைவாக’ என்ற சொல்லால் இணைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களின் உடனடிப் பின்னால் வைக்கப்பட்டுள்ளன.
