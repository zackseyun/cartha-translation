base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
translation:
  language: ta
  text: 'அராமின் படை மிகச் சில வீரர்களோடு[a] வந்திருந்தபோதிலும், யாவே மிகப் பெரிய படையை அராமியரின் கையில் ஒப்புக்கொடுத்தார்[b]; ஏனெனில், யூதா மக்கள் தங்கள் மூதாதையரின் கடவுளாகிய யாவேயைக் கைவிட்டிருந்தார்கள். இவ்வாறு, அராமியர்கள் யோவாசுக்கு எதிராக நீதித்தீர்ப்புகளை நிறைவேற்றினார்கள்[c].


    [a] அல்லது, “சிறு எண்ணிக்கையிலான வீரர்களோடு.”


    [b] “அராமியரின் கையில்” என்பது “அராமியரின் அதிகாரத்திற்குள்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.


    [c] அல்லது, “அராமியர்கள் யோவாசுக்கு எதிராக நீதித்தீர்ப்பைச் செயல்படுத்தினார்கள்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறு எண்ணிக்கையிலான வீரர்களோடு.”
    reason: lexical_alternative
  - marker: b
    text: “அராமியரின் கையில்” என்பது “அராமியரின் அதிகாரத்திற்குள்” என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அராமியர்கள் யோவாசுக்கு எதிராக நீதித்தீர்ப்பைச் செயல்படுத்தினார்கள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְמִצְעַר אֲנָשִׁים
  choice: மிகச் சில வீரர்களோடு
  rationale: எண்ணிக்கையில் மிகக் குறைவாக இருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; பின்னர் வரும் மிகப் பெரிய படையுடனான முரண்பாட்டையும் காக்கிறது.
- source_word: חֵיל אֲרָם
  choice: அராமின் படை
  rationale: இச்சூழலில் חֵיל என்பது இராணுவப் படையைக் குறிக்கிறது. மூலத்தின் இடப்பெயரான ‘அராம்’ தக்கவைக்கப்படுகிறது.
- source_word: נָתַן בְּיָדָם
  choice: அவர்களுடைய கையில் ஒப்புக்கொடுத்தார்
  rationale: ஒருவரை மற்றவரின் அதிகாரத்திற்குள் ஒப்படைப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரைத் தமிழிலும் ஓரளவு காக்கிறது; பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: חַיִל לָרֹב מְאֹד
  choice: மிகப் பெரிய படை
  rationale: இங்கு חַיִל இராணுவப் படையையும், לָרֹב מְאֹד அதன் மிகுதியையும் குறிக்கிறது.
- source_word: עָזְבוּ
  choice: கைவிட்டிருந்தார்கள்
  rationale: சாதாரணமாக விலகிச் சென்றதைவிட, உடன்படிக்கைச் சார்ந்த விசுவாசமின்மையின் கனத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: தங்கள் மூதாதையரின் கடவுள்
  rationale: வம்ச மற்றும் உடன்படிக்கைத் தொடர்பை இயல்பான, உள்ளடக்கமான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: עָשׂוּ שְׁפָטִים
  choice: தண்டனைத் தீர்ப்புகளை நிறைவேற்றினார்கள்
  rationale: שְׁפָטִים என்பதன் பன்மையையும், வெறும் சட்டத் தீர்ப்பல்லாமல் தண்டனை நடவடிக்கைகள் என்ற சூழல்சார் பொருளையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: அராமிய வெற்றி தெய்வீக நீதித்தீர்ப்பாகச் சித்தரிக்கப்படுதல்
  choice: அவர்கள் யோவாசின்மீது தண்டனைத் தீர்ப்புகளை நிறைவேற்றினார்கள்
  alternative: அவர்கள் யோவாசின்மீது நீதித்தீர்ப்புகளைச் செயல்படுத்தினார்கள்
  rationale: அராமின் தாக்குதல் யோவாசுக்கு எதிரான தெய்வீகத் தண்டனையின் கருவியாக அமைந்ததாக எபிரெய வாசகம் உணர்த்துவதைப் பாதுகாக்கிறது; செயப்பொருளை ‘அவர்கள்’ என வைத்து மூலத்தின் சுட்டுப்பெயர் வடிவத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியும், ஆனால் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீரர்கள்’, ‘படை’, ‘கைவிட்டிருந்தார்கள்’, ‘தண்டனைத் தீர்ப்புகள்’ ஆகிய சொற்கள் இராணுவ மற்றும் இறையியல் கனத்தை அளவுக்கு மீறிய பழமையான நடையின்றி தெரிவிக்கின்றன.
