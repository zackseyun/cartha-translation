  rationale: 'The revision retains the Hebrew’s contrast between a small Aramean force and a very great opposing force delivered into its power. It explicitly identifies the contextual referents where Tamil pronouns would otherwise reverse or obscure the Hebrew sense: Judah had forsaken Yahweh, and the Arameans carried out judgments against Joash. Footnote anchors remain attached to their respective lexical or idiomatic features.'
