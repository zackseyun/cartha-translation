source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ יוֹאָ֛שׁ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כָּל יְמֵ֖י יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/002.yaml
  text: Joash did what was right in the eyes of Yahweh all the days of Jehoiada the priest.
translation:
  language: ta
  text: ஆசாரியனாகிய யோய்தா வாழ்ந்த காலமெல்லாம், யோவாஸ் யாவேயின் பார்வையில் சரியானதைச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பதன் அடிப்படைப் பொருள் ‘செய்’; ‘சரியானதைச் செய்தான்’ என்பது எபிரெய அரசர் மதிப்பீட்டு மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: הַיָּשָׁר
  choice: சரியானதை
  rationale: יָשָׁר என்பது ‘நேரான, சரியான, நீதியான’ எனப் பொருள்படும்; இங்கு கடவுளின் மதிப்பீட்டில் சரியான நடத்தை என்பதால் ‘சரியானதை’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּעֵינֵי
  choice: பார்வையில்
  rationale: ‘கண்களில்’ என்ற எபிரெய உருவகத்தின் மதிப்பீட்டு அர்த்தத்தை இயல்பான நவீன தமிழில் ‘பார்வையில்’ தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- source_word: כָּל יְמֵי
  choice: வாழ்ந்த காலமெல்லாம்
  rationale: சொல்லுக்குச் சொல் ‘எல்லா நாட்களிலும்’ என்றாலும், இங்கு ஒருவரின் வாழ்நாள் காலவரம்பைக் குறிக்கும் பொருளை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: יְהוֹיָדָע
  choice: யோய்தா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் அண்மையாக எழுத்துப்பெயர்க்கிறது.
- source_word: הַכֹּהֵן
  choice: ஆசாரியனாகிய
  rationale: யோய்தாவின் பணியை அடையாளப்படுத்தும் appositional பட்டத்தைத் தமிழில் இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக வருவதால், அதை ‘ஆண்டவர்’ என்ற பட்டப்பெயராக மாற்றாமல் தனிப்பெயராகவே வழங்குகிறது.
- issue: யோவாசின் நேர்மைக்கான காலவரம்பு
  choice: யோய்தா வாழ்ந்த காலமெல்லாம்
  alternative: யோய்தாவின் எல்லா நாட்களிலும்
  rationale: כָּל יְמֵי יְהוֹיָדָע என்ற சொற்றொடர் யோய்தாவின் வாழ்நாளைச் சார்ந்த காலவரம்பைக் குறிப்பிடுகிறது; யோவாசின் முழு வாழ்நாளையும் குறிப்பிடுவதாக விரிவாக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயினும் கண்ணியமான வரலாற்று நடையில் அமைந்துள்ளது. எபிரெய வாக்கியத்தின் மதிப்பீட்டு சூத்திரமும் காலவரம்பும் பாதுகாக்கப்பட்டுள்ளன.
