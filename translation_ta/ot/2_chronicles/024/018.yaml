  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
translation:
  language: ta
  text: அவர்கள் தங்கள் மூதாதையரின் கடவுளாகிய யாவேவின் ஆலயத்தைக் கைவிட்டு, அசேரா வழிபாட்டுச் சின்னங்களையும்[a] சிலைகளையும் வழிபட்டார்கள். அவர்களுடைய இந்தக் குற்றத்தினால் யூதாவின்மீதும் எருசலேமின்மீதும் கடுங்கோபம் வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அசேரா தூண்கள்.” எபிரெயச் சொல் அசேரா தேவியுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; அது அந்தத் தேவியையும் நினைவூட்டலாம்.
    reason: אֲשֵׁרִים என்பதன் பண்பாட்டு மற்றும் பொருள்சார் குறிப்பில் உள்ள உண்மையான ஐயத்தையும் பொதுவான மாற்று மொழிபெயர்ப்பையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: கைவிட்டு
  rationale: עזב என்பதன் ‘விட்டுவிடுதல்/கைவிடுதல்’ என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; உடன்படிக்கை விசுவாசமின்மையின் நிழற்பொருளையும் தக்கவைக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: எபிரெயத்தில் சொற்படி ‘யெகோவாவின் வீடு’; இச்சூழலில் அது ஆலயத்தைக் குறிப்பதால், சாதாரண தமிழ் வாசகருக்குத் தெளிவாக ‘ஆலயம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்பதாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவத்தில் தக்கவைக்கிறது.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: தங்கள் மூதாதையரின் கடவுள்
  rationale: குடும்ப மரபையும் உடன்படிக்கைத் தொடர்பையும் காக்கும் வகையில் אבותיהם என்பதற்கு இயல்பான நவீனத் தமிழ் ‘மூதாதையர்’ பயன்படுத்தப்பட்டது.
- source_word: וַיַּעַבְדוּ
  choice: வழிபட்டார்கள்
  rationale: עבד தெய்வங்களையோ வழிபாட்டுப் பொருட்களையோ கருப்பொருளாகக் கொள்ளும்போது ‘பணிசெய்தல்’ மட்டுமல்ல, மதரீதியாக வழிபடுதலையும் குறிக்கிறது; தமிழில் ‘சேவித்தார்கள்’ என்பதைவிட இங்கு ‘வழிபட்டார்கள்’ தெளிவானது.
- source_word: הָאֲשֵׁרִים
  choice: அசேரா வழிபாட்டுச் சின்னங்கள்
  rationale: இந்தப் பன்மைச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கலாம். ‘தூண்கள்’ என்று குறிப்பாக முடிவுசெய்யாமல், பண்பாட்டு குறிப்பையும் பொருள் சார்ந்த தன்மையையும் தெரிவிக்கிறது.
- source_word: הָעֲצַבִּים
  choice: சிலைகள்
  rationale: עֲצַבִּים என்பது வழிபாட்டுக்குரிய உருவங்கள் அல்லது விக்கிரகங்களைக் குறிக்கும்; இணைச்சொல் சூழலில் ‘சிலைகள்’ இயல்பானதாகவும் தெளிவானதாகவும் உள்ளது.
- source_word: וַיְהִי קֶצֶף
  choice: கடுங்கோபம் வந்தது
  rationale: எபிரெயத்தின் சுருக்கமான ‘கோபம் ஏற்பட்டது/வந்தது’ என்ற அமைப்பைத் தக்கவைத்து, தீர்ப்பைக் கொண்ட கோபத்தின் வலிமையை ‘கடுங்கோபம்’ வெளிப்படுத்துகிறது.
- source_word: עַל יְהוּדָה וִירוּשָׁלִַם
  choice: யூதாவின்மீதும் எருசலேமின்மீதும்
  rationale: עַל என்பதன் ‘மேல்/எதிராக’ என்ற தீர்ப்புச் சார்ந்த பொருளை ‘மீதும்’ என்ற இயல்பான தமிழ் வடிவில் தருகிறது.
- source_word: בְּאַשְׁמָתָם זֹאת
  choice: அவர்களுடைய இந்தக் குற்றத்தினால்
  rationale: בְּ இங்கு காரணத்தைக் குறிக்கிறது; אַשְׁמָה குற்றத்தையும் அதனால் உண்டான குற்றப்பொறுப்பையும் குறிக்கலாம். ‘இந்தக் குற்றத்தினால்’ காரணத் தொடர்பைத் தெளிவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘கடுங்கோபம்’ யாருடையது என்பது
  choice: மூலத்தைப் போலவே ‘கடுங்கோபம் வந்தது’ என்று, கடவுளுடையது என்பதை வெளிப்படையாகச் சேர்க்காமல் விடப்பட்டது.
  alternative: ‘யெகோவாவின் கடுங்கோபம் வந்தது’ அல்லது ‘கடவுளின் கோபம் வந்தது’
  rationale: சூழலில் இது யெகோவாவின் நீதித்தீர்ப்பான கோபம் என்பது தெளிவு; ஆனால் எபிரெய மூலத்தில் உடைமையைக் குறிக்கும் பெயர் வெளிப்படையாக இல்லை. ஆகவே அதைச் சேர்க்காமல் மூலத்தின் மறைமுகத் தன்மை பாதுகாக்கப்பட்டது.
- issue: אֲשֵׁרִים என்பதன் குறிப்பு
  choice: ‘அசேரா வழிபாட்டுச் சின்னங்கள்’ என்று பொதுவாக மொழிபெயர்த்து, குறிப்பிட்ட பொருள் வடிவை அடிக்குறிப்பில் வைத்தல்.
  alternative: ‘அசேரா தூண்கள்’ அல்லது ஒலிபெயர்ப்பாக ‘அசேரீம்’
  rationale: இச்சொல் அசேரா தேவியுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; அவை எப்போதும் தூண்களே என்று பிரதான உரையில் முடிவுசெய்வது உண்மையான சொற்பொருள் ஐயத்தை மறைக்கும். முற்றிலும் அறிமுகமற்ற ஒலிபெயர்ப்பைக் காட்டிலும் விளக்கமுள்ள பொதுப்பெயர் தமிழ் வாசகருக்குப் புரிதலைத் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடியதும் வழிபாட்டு வாசிப்பிற்கு ஏற்ற கண்ணியமுள்ள நடையிலும் அமைக்கப்பட்டது. ‘ஆலயம்’, ‘மூதாதையர்’, ‘கடுங்கோபம்’ போன்ற தெளிவான சொற்கள் பயன்படுத்தப்பட்டன; பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொல்வழக்குகள் தவிர்க்கப்பட்டன. அடிக்குறிப்பு குறியீடு பிரதான உரையில் [a] என இடம்பெற்றுள்ளது.
