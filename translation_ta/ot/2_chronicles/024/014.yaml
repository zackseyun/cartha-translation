base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
translation:
  language: ta
  text: அவர்கள் முடித்தபோது, மீதியிருந்த வெள்ளியை அரசனுக்கும் யோயாதாவுக்கும் முன்பாகக் கொண்டுவந்தார்கள். அதைக் கொண்டு அவன்[a] யாவேயின் ஆலயத்திற்காகத் திருப்பணிக்கான பொருட்களையும், மேலே செலுத்துவதற்கான பொருட்களையும்[b], கிண்ணங்களையும், பொன் மற்றும் வெள்ளிப் பொருட்களையும் செய்தான். யோயாதா வாழ்ந்த நாட்களெல்லாம் யாவேயின் ஆலயத்தில் தொடர்ந்து தகனபலிகளைச் செலுத்திவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவன்’ என்று எபிரேய வினை ஒருமையில் உள்ளது. இது அரசனையோ யோயாதாவையோ, அல்லது சூழலில் உணரப்படும் பொறுப்பாளரையோ குறிக்கலாம்; உறுதியாகக் கூற முடியாது. மீதியிருந்த வெள்ளியைக் குறிக்கும் செயப்படுபொருள் பின்னொட்டும் ஒருமையில் உள்ளது.
    reason: grammatical_ambiguity
  - marker: b
    text: நேரடியாக, ‘மேலே செலுத்துவதற்கான பொருட்கள்.’ எதை மேலே செலுத்துவது என்பதை எபிரேய வாசகம் இங்கே குறிப்பிடவில்லை; வசனத்தின் பிற்பகுதியில் தகனபலிகள் தனியாகக் குறிப்பிடப்படுகின்றன.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  choice: அவர்கள் வேலையை முடித்தபோது
  rationale: காலச் சூழலைக் குறிக்கும் infinitive construct. தமிழில் இயல்பாக இருக்க மறைமுகமாக உள்ள வேலையை வெளிப்படுத்துகிறது; கோவில் பழுதுபார்க்கும் முந்தைய சூழலோடு பொருந்துகிறது.
- source_word: שְׁאָר הַכֶּסֶף
  choice: மீதியிருந்த வெள்ளி
  rationale: שְׁאָר என்பது மீதியைச் சுட்டுகிறது. இங்கே உலோகப் பொருட்கள் செய்யப்படுவதால் כֶּסֶף என்பதன் பொருள்சார் அர்த்தமான ‘வெள்ளி’ பொருத்தமானது.
- source_word: וַיַּעֲשֵׂהוּ
  choice: அதைக் கொண்டு அவன் செய்தான்
  rationale: வினை ஒருமையிலும், மீதியான வெள்ளியைக் குறிக்கும் பின்னொட்டு ஒருமையிலும் உள்ளன. கைவினைஞர் அல்லது குறிப்பிட்ட நபரை ஊகிக்காமல் எபிரேய இலக்கணத்தைப் பாதுகாக்கிறது.
- source_word: כֵלִים
  choice: பொருட்கள்
  rationale: கோவில் பயன்பாட்டிற்கான பலவகைக் கருவிகளையும் பாத்திரங்களையும் உள்ளடக்கக்கூடிய அகன்ற, இயல்பான தமிழ்ச் சொல்.
- source_word: לְבֵית יְהוָה
  choice: யாவேயின் ஆலயத்திற்கான
  rationale: ‘யாவேயின் வீடு’ என்ற நேரடிப் பொருளை, இச்சூழலில் நவீனத் தமிழில் இயல்பாகப் புரியும் ‘ஆலயம்’ என வழங்குகிறது; தேவநாமம் பெயராகப் பாதுகாக்கப்படுகிறது.
- source_word: כְּלֵי שָׁרֵת
  choice: திருப்பணிக்கான பொருட்கள்
  rationale: שָׁרֵת இங்கே வழிபாட்டு அல்லது ஆலயப் பணியைச் சுட்டுகிறது. ‘திருப்பணி’ புனிதச் சேவையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
- source_word: וְהַעֲלוֹת
  choice: மேலே செலுத்துவதற்கான பொருட்கள்
  rationale: עלה என்பதன் ‘மேலே செலுத்துதல்’ என்ற செயற்பொருளைப் பாதுகாக்கிறது. எது செலுத்தப்பட்டது என்பதை மூலவாசகம் இங்கே கூறாததால் ‘பலிகள்’ என்று முன்கூட்டியே நிரப்பவில்லை.
- source_word: וְכַפּוֹת
  choice: கிண்ணங்கள்
  rationale: துல்லியமான வடிவம் உறுதியல்லாத வழிபாட்டுப் பாத்திரத்தைக் குறிக்கும் பொதுவான, புரியக்கூடிய சொல்.
- source_word: וּכְלֵי זָהָב וָכָסֶף
  choice: பொன் மற்றும் வெள்ளிப் பொருட்கள்
  rationale: பொருட்களின் உலோகத் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּהְיוּ מַעֲלִים עֹלוֹת ... תָּמִיד
  choice: தொடர்ந்து தகனபலிகளைச் செலுத்திவந்தார்கள்
  rationale: היה + participle மற்றும் תָּמִיד இணைந்து காட்டும் நீடித்த அல்லது வழக்கமான செயலைத் தமிழின் ‘செலுத்திவந்தார்கள்’ வடிவம் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரேய மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்படும் ஒலிப்புக்கு நெருக்கமான தமிழ்வடிவில் தருகிறது.
- issue: பலிசெலுத்துதல் நீடித்த நடைமுறையா அல்லது ஒருமுறை நடந்த நிகழ்வா
  choice: தொடர்ந்து ... செலுத்திவந்தார்கள்
  alternative: தகனபலிகளைச் செலுத்தினார்கள்
  rationale: பங்கேற்புவினை அமைப்பும் תָּמִיד என்பதும் யோயாதாவின் வாழ்நாளில் தொடர்ந்த வழக்கமான செயலைக் காட்டுகின்றன.
- issue: וְהַעֲלוֹת என்பதில் மறைந்துள்ள செயப்படுபொருள்
  choice: மேலே செலுத்துவதற்கான
  alternative: பலிகளைச் செலுத்துவதற்கான
  rationale: இந்த இடத்தில் எது செலுத்தப்படுகிறது என்பதை எபிரேயம் வெளிப்படையாகக் கூறவில்லை. வசனத்தின் பின்னர் தகனபலிகள் குறிப்பிடப்பட்டாலும், அந்தத் தகவலை இங்கே முன்கூட்டியே சேர்க்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் இயல்பான, கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘ஆலயம்,’ ‘திருப்பணி,’ ‘தகனபலி’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் நிலையில் மூலத்தின் வழிபாட்டுச் சூழலைப் பாதுகாக்கின்றன. பட்டியல் அமைப்பு தெளிவுக்காக இருபுள்ளியுடன் வழங்கப்பட்டுள்ளது; எபிரேயத்தின் இலக்கணத் தெளிவின்மைகள் அடிக்குறிப்புகளில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
