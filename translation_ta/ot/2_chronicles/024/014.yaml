  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் நன்றாகப் பாதுகாக்கப்பட்டுள்ளது: மீதிவெள்ளி, ஒருமை வினை, ஆலயப் பயன்பாட்டுப் பொருட்கள், மற்றும் யோயாதாவின் நாட்களில் தொடர்ந்த தகனபலி செலுத்துதல் ஆகியவை சரியாக உள்ளன. ஆனால் தற்போதைய வாக்கியத்தில் ‘செய்தான்’ இருமுறை வருவதால், மூலத்தில் உள்ள ஒரே வினை தேவையின்றி இரு செயல்களாகப் பிரிகிறது. மேலும் ‘அவன்’ யோயாதாவை மட்டுமே குறிக்கலாம் என அடிக்குறிப்பு கூறுவது மூலத்தின் தீர்மானிக்கப்படாத ஒருமை எழுவாயை அளவுக்கு மீறிக் குறுக்குகிறது.'
  naturalness: ‘மேலே செலுத்துவதற்கான பொருட்கள்’ என்ற பகுதி மூலத்தின் வெளிப்படையற்ற செயப்படுபொருளைப் பாதுகாக்க முயல்வது சரியானது; ஆனால் பட்டியலில் அதைத் தெளிவாக இணைக்க வேண்டும். ஒரே வினையைப் பட்டியலின் முடிவில் வைப்பது நவீனத் தரத்தமிழில் இயல்பாகவும் வாசிக்கத் தெளிவாகவும் இருக்கும்.
  terminology: ‘யாவே’, ‘ஆலயம்’, ‘திருப்பணி’, ‘தகனபலிகள்’, ‘கிண்ணங்கள்’ ஆகிய தெரிவுகள் பொருத்தமானவை. וְהַעֲלוֹת-இன் செயப்படுபொருளை ‘பலிகள்’ என்று முன்கூட்டியே நிரப்பாமல் வைத்திருப்பது நல்லது; அதற்கான அடிக்குறிப்பு தொடர வேண்டும்.
  issues:
  - severity: medium
    issue: ‘செய்தான்’ இருமுறை இடம்பெறுகிறது.
    rationale: וַיַּעֲשֵׂהוּ என்ற ஒரே வினை, பின்வரும் அனைத்துப் பொருட்களையும் உருவாக்கியதைக் குறிக்கிறது. தற்போதைய வடிவம் பட்டியலுக்குப் பின் மீண்டும் ‘ஆகியவற்றைச் செய்தான்’ என்பதைக் கொண்டு வந்து, வாக்கிய அமைப்பைத் தேவையின்றி மீளுருவாக்குகிறது.
  - severity: low
    issue: அடிக்குறிப்பு a ஒருமை எழுவாய் யோயாதாவாக மட்டுமே இருக்கக்கூடும் எனக் குறிக்கிறது.
    rationale: எபிரேய ஒருமை வினை ஒரு தனிப்பட்ட எழுவாயைக் காட்டினாலும், இவ்விடத்தில் அரசனையோ யோயாதாவையோ அல்லது சூழலால் உணரப்படும் பொறுப்பாளரையோ உறுதியாக அடையாளம் காண முடியாது. அடிக்குறிப்பு இந்தத் தெளிவின்மையை விரிவாகப் பாதுகாக்க வேண்டும்.
  - severity: low
    issue: ‘வேலையை’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருளைச் சேர்க்கிறது.
    rationale: முந்தைய சூழலால் பழுதுபார்க்கும் வேலை குறிக்கப்படலாம்; இருப்பினும், தமிழில் ‘அவர்கள் முடித்தபோது’ என்று கூறுவது மூலத்தின் சுருக்கத்தையும் சூழல் சார்ந்த குறிப்பையும் சிறப்பாகப் பாதுகாக்கிறது.
  revised_text: அவர்கள் முடித்தபோது, மீதியிருந்த வெள்ளியை அரசனுக்கும் யோயாதாவுக்கும் முன்பாகக் கொண்டுவந்தார்கள். அதைக் கொண்டு அவன்[a] யாவேயின் ஆலயத்திற்காகத் திருப்பணிக்கான பொருட்களையும், மேலே செலுத்துவதற்கான பொருட்களையும்[b], கிண்ணங்களையும், பொன் மற்றும் வெள்ளிப் பொருட்களையும் செய்தான். யோயாதா வாழ்ந்த நாட்களெல்லாம் யாவேயின் ஆலயத்தில் தொடர்ந்து தகனபலிகளைச் செலுத்திவந்தார்கள்.
  revised_footnotes:
  - marker: a
    text: ‘அவன்’ என்று எபிரேய வினை ஒருமையில் உள்ளது. இது அரசனையோ யோயாதாவையோ, அல்லது சூழலில் உணரப்படும் பொறுப்பாளரையோ குறிக்கலாம்; உறுதியாகக் கூற முடியாது. மீதியிருந்த வெள்ளியைக் குறிக்கும் செயப்படுபொருள் பின்னொட்டும் ஒருமையில் உள்ளது.
    reason: grammatical_ambiguity
  - marker: b
    text: நேரடியாக, ‘மேலே செலுத்துவதற்கான பொருட்கள்.’ எதை மேலே செலுத்துவது என்பதை எபிரேய வாசகம் இங்கே குறிப்பிடவில்லை; வசனத்தின் பிற்பகுதியில் தகனபலிகள் தனியாகக் குறிப்பிடப்படுகின்றன.
    reason: lexical_ambiguity
  revision_rationale: ஒரே எபிரேய வினைக்கு ஏற்ப பட்டியலை ஒரே முறை ‘செய்தான்’ என்பதோடு நிறைவு செய்துள்ளேன். காலவாக்கியத்தில் மூலத்தில் வெளிப்படையாக இல்லாத ‘வேலை’ என்பதைக் கழற்றி, சூழல் சார்ந்த குறிப்பைத் தக்கவைத்துள்ளேன். ஒருமை எழுவாயைப் பற்றிய அடிக்குறிப்பு, யோயாதா என்ற ஒரே அடையாளத்தைத் திணிக்காமல் இலக்கணத் தெளிவின்மையைப் பாதுகாக்கும்படி திருத்தப்பட்டுள்ளது.
