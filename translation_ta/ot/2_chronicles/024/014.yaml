  to: அவர்கள் முடித்தபோது, மீதியிருந்த வெள்ளியை அரசனுக்கும் யோயாதாவுக்கும் முன்பாகக் கொண்டுவந்தார்கள். அதைக் கொண்டு அவன்[a] யாவேயின் ஆலயத்திற்காகத் திருப்பணிக்கான பொருட்களையும், மேலே செலுத்துவதற்கான பொருட்களையும்[b], கிண்ணங்களையும், பொன் மற்றும் வெள்ளிப் பொருட்களையும் செய்தான். யோயாதா வாழ்ந்த நாட்களெல்லாம் யாவேயின் ஆலயத்தில் தொடர்ந்து தகனபலிகளைச் செலுத்திவந்தார்கள்.
