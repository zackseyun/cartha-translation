base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/008.yaml
  text: Then the king commanded[a], and they made one chest and placed it outside at the gate of the house of Yahweh.
translation:
  language: ta
  text: அரசன் கட்டளையிட்டான்; அவர்கள் ஒரு பெட்டியை[a] செய்து, அதை யாவேயின் ஆலய வாசலுக்கு வெளியே வைத்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “ஒரு பெட்டி.” இது காணிக்கை சேகரிப்பதற்காக நியமிக்கப்பட்ட ஒரே பெட்டி என்பதை வலியுறுத்தலாம்.'
    reason: אֶחָד என்ற எண்ணுச் சொல்லின் வெளிப்படையான பொருளையும் அதன் சாத்தியமான வலியுறுத்தலையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: கட்டளையிட்டான்
  rationale: இதன் அடிப்படைப் பொருள் ‘சொன்னான்’ என்பதாக இருந்தாலும், அரசனின் சொல்லைத் தொடர்ந்து உடனடியாகச் செயல் நடைபெறும் நிர்வாகச் சூழலில் இது கட்டளையின் வலிமையைக் கொண்டுள்ளது.
- source_word: וַיַּעֲשׂוּ
  choice: அவர்கள் ... செய்து
  rationale: பன்மை எழுவாயை எபிரெயம் குறிப்பிடாமல் விடுவதுபோலவே தமிழிலும் ‘அவர்கள்’ என்று பொதுவாக வைக்கிறது; עשה என்பதன் இயல்பான பொருள் ‘செய்தல்/உருவாக்குதல்’.
- source_word: אֲרוֹן אֶחָד
  choice: ஒரு பெட்டியை
  rationale: אֲרוֹן இங்கு உடன்படிக்கைப் பெட்டியைக் குறிக்காமல் காணிக்கை சேகரிக்கும் பெட்டியைக் குறிக்கிறது. אֶחָד என்பதைக் ‘ஒரு’ வெளிப்படுத்துகிறது; ஒரே நியமிக்கப்பட்ட பெட்டி என்ற சாத்தியமான வலியுறுத்தல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַיִּתְּנֻהוּ
  choice: அதை ... வைத்தார்கள்
  rationale: נתן என்பதன் ‘வைத்தல்’ என்ற இடச்சார்ந்த பொருள் இச்சூழலுக்கு இயல்பானது.
- source_word: בְּשַׁעַר בֵּית יְהוָה חוּצָה
  choice: யாவேயின் ஆலய வாசலுக்கு வெளியே
  rationale: חוּצָה குறிக்கும் வெளிப்புற இடத்தைத் தெளிவாகக் காட்டுகிறது. בֵּית־יְהוָה என்பதைக் கட்டிடச் சூழலில் நவீன தமிழுக்கு இயல்பாக ‘யாவேயின் ஆலயம்’ என்று வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தனிப்பட்ட தெய்வீகப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; எனவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בֵּית־יְהוָה என்பதன் வடிவம்
  choice: யாவேயின் ஆலயம்
  alternative: யாவேயின் வீடு
  rationale: ‘வீடு’ என்பது சொற்சார்ந்த மாற்றாக இருந்தாலும், இங்கு குறிக்கப்படுவது ஆலயம் என்பதால் ‘ஆலயம்’ நவீன வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. அரசாணையின் வலிமையை ‘கட்டளையிட்டான்’ என்பதும், ஆலயத்தின் வெளிப்புற இடத்தை ‘வாசலுக்கு வெளியே’ என்பதும் தெளிவாக்குகின்றன.
