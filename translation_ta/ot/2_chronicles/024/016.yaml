id: 2CH.24.16
reference: 2 Chronicles 24:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּקְבְּרֻ֥/הוּ בְ/עִיר דָּוִ֖יד עִם הַ/מְּלָכִ֑ים כִּֽי עָשָׂ֤ה טוֹבָה֙ בְּ/יִשְׂרָאֵ֔ל וְ/עִ֥ם הָ/אֱלֹהִ֖ים וּ/בֵיתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
translation:
  language: ta
  text: அவனைத் தாவீதின் நகரத்தில் அரசர்களோடு[a] அடக்கம் செய்தார்கள். ஏனெனில் அவன் இஸ்ரவேலில் நன்மை செய்திருந்தான்; கடவுளுக்கும் அவருடைய ஆலயத்துக்கும்[b] நன்மை செய்திருந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசர்களின் நடுவில்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “கடவுளுக்கும் அவருடைய வீட்டுக்கும்”; ‘வீடு’ என்பது ஆலயத்தைக் குறிக்கிறது.
    reason: clarification
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவனை ... அடக்கம் செய்தார்கள்
  rationale: எபிரெய வினைச்சொல் பன்மை எழுவாயுடன், மூன்றாம் நபர் ஆண்பால் ஒருமை செயப்படுபொருள் பின்னொட்டைக் கொண்டுள்ளது. ஆகவே, குறிப்பிடப்படாத பன்மை எழுவாயைத் தக்கவைக்கும் செயப்பாட்டு வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְעִיר דָּוִיד
  choice: தாவீதின் நகரத்தில்
  rationale: இது நிலையான இடப்பெயர்ச் சொற்றொடர்; தமிழில் இயல்பாகவும் தெளிவாகவும் இவ்வாறு அமைகிறது.
- source_word: עִם הַמְּלָכִים
  choice: அரசர்களோடு
  rationale: עִם என்பதன் நேரடிப் பொருள் ‘உடன்/ஓடு’. அடக்கச் சூழலில், அரசர்கள் அடக்கம் செய்யப்பட்ட இடத்தில் அவர்களுடன் அடக்கம் செய்யப்பட்டதைக் குறிக்கிறது; மூலத்தின் வடிவம் தக்கவைக்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அவனுக்குக் கிடைத்த மரியாதையான அடக்கத்திற்கான காரணத்தை இவ்விணைப்புச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: עָשָׂה טוֹבָה
  choice: நன்மை செய்திருந்தான்
  rationale: நல்ல அல்லது பயனுள்ள செயல்களைச் செய்தான் என்ற பொருளை இயல்பான நவீன தமிழில் வழங்குகிறது; முன் நிகழ்ந்த செயலைக் காட்ட இறந்தகால நிறைவு வடிவம் பயன்படுத்தப்பட்டது.
- source_word: בְיִשְׂרָאֵל
  choice: இஸ்ரவேலில்
  rationale: בְ என்ற முன்னொட்டின் இடம் அல்லது செயல்பரப்பைக் குறிக்கும் பொருளை நேரடியாகத் தருகிறது.
- source_word: וְעִם הָאֱלֹהִים
  choice: கடவுளுக்கும் ... நன்மை செய்திருந்தான்
  rationale: சொல்லுக்கு சொல் ‘கடவுளோடும்’ என இருந்தாலும், עָשָׂה טוֹבָה என்ற வினைத்தொடருடன் இது நன்மை செலுத்தப்பட்ட தொடர்பைச் சுட்டுகிறது. தமிழில் தவறான உடனிருப்பு உணர்வைத் தவிர்த்து இயல்பாகப் பொருளை வழங்க ‘கடவுளுக்கும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּבֵיתוֹ
  choice: அவருடைய ஆலயத்துக்கும்
  rationale: மூன்றாம் நபர் ஒருமை உடைமைப் பின்னொட்டு உடனடியான முன்னிலைச் சொல்லான ‘கடவுள்’ என்பதைக் குறிப்பதாகச் சூழல் காட்டுகிறது. ‘வீடு’ என்பதன் இங்குள்ள பொருள் தேவாலயம்; தமிழில் தெளிவுக்காக ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: וּבֵיתוֹ என்பதில் ‘அவருடைய’ என்பது யாரைக் குறிக்கிறது?
  choice: கடவுளுடைய ஆலயம்
  alternative: யோய்தாவின் சொந்தக் குடும்பம் அல்லது வீடு
  rationale: உடனடியான முன்னிலைப் பெயர்ச்சொல் ‘கடவுள்’; மேலும், சுற்றியுள்ள நிகழ்ச்சிப்பகுதி யோய்தா கடவுளுடைய ஆலயத்திற்குச் செய்த பணியை மையப்படுத்துகிறது. எனவே இது கடவுளுடைய வீட்டை, அதாவது ஆலயத்தைக் குறிப்பதே தொடரியல் மற்றும் சூழலுக்கு மிகப் பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘அடக்கம் செய்தார்கள்,’ ‘நன்மை செய்திருந்தான்’ போன்ற இயல்பான சொற்றொடர்கள் பயன்படுத்தப்பட்டன. மூலத்தின் ‘அரசர்களோடு’ என்ற நெருக்கமான வடிவம் முதன்மை உரையில் வைக்கப்பட்டு, சூழல்சார் மாற்று அடிக்குறிப்பில் தரப்பட்டது.
