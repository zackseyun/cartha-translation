base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: His sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
translation:
  language: ta
  text: அவனுடைய மகன்களும்[a], அவனுக்கு எதிரான பல இறைவாக்குகளும், தேவனுடைய ஆலயத்தின் அடித்தளமிடுதலும்—இதோ, இவை அரசர்களின் நூலின் மித்ராஷில்[b] எழுதப்பட்டுள்ளன. அவனுக்குப் பதிலாக அவனுடைய மகன் அமத்சியா அரசனாக ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது. இதை ‘அவன்மேல் இருந்த பெரும் சுமை,’ ‘அவனுக்கு எதிரான ஏராளமான அறிவிப்புகள்,’ அல்லது ‘அவன்மேல் விதிக்கப்பட்ட கனமான கப்பம்’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது. מַשָּׂא (மஸ்ஸா) என்பது ‘சுமை,’ ‘இறைவாக்கு,’ அல்லது சில சூழல்களில் சுமத்தப்பட்ட பாரம் என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மித்ராஷ்’ என்பது இங்கே அரசர்களின் நூலோடு தொடர்புடைய விளக்கப் பதிவு, விரிவுரை, அல்லது உரையைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  choice: அவனுடைய மகன்களும்
  rationale: பன்மைப் பெயர்ச்சொல்லையும் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியையும் நேரடியாகத் தருகிறது; வாவ் இணைப்பை ‘-உம்’ வெளிப்படுத்துகிறது.
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  choice: அவனுக்கு எதிரான பல இறைவாக்குகளும்
  rationale: מַשָּׂא என்பது ‘சுமை’ என்றும் தீர்க்கதரிசனச் சூழலில் ‘இறைவாக்கு’ என்றும் பொருள்படலாம். யோவாசுக்கு எதிரான தீர்ப்புச் சூழலில் ‘இறைவாக்குகள்’ பொருத்தமானது; ஆயினும் கடினமான எபிரெயச் சொற்றொடரின் வேறு சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וִיסוֹד בֵּית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயம் அடித்தளமிடப்பட்டதும்
  rationale: יסד என்பதன் அடித்தளம் இடுதல் அல்லது நிறுவுதல் என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது. அதிகாரத்தின் சூழல் ஆலயப் புதுப்பிப்பைப் பற்றியதாக இருந்தாலும், மூலத்தில் நேரடியாக இல்லாத ‘மீண்டும் கட்டுதல்’ என்பதை உரையில் சேர்க்கவில்லை.
- source_word: הִנָּם כְתוּבִים
  choice: இதோ, இவை ... எழுதப்பட்டுள்ளன
  rationale: הִנָּם தரும் சுட்டிக்காட்டும் வலியுறுத்தலை ‘இதோ’ என்றும், எழுதப்பட்ட நிலையில் உள்ளதை இயல்பான தமிழ் நிறைவேற்றுச் செயப்பாட்டு வடிவிலும் தருகிறது.
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  choice: அரசர்களின் நூலின் மித்ராஷில்
  rationale: מִדְרַשׁ என்பதைக் குறிப்பிட்ட இலக்கிய வகையாக முன்கூட்டியே வரையறுக்காமல் ஒலிபெயர்த்து, அதன் விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
- source_word: וַיִּמְלֹךְ אֲמַצְיָהוּ בְנוֹ תַחְתָּיו
  choice: அவனுக்குப் பதிலாக அவனுடைய மகன் அமத்சியா அரசனானான்
  rationale: அரச வாரிசுரிமையைக் குறிக்கும் வழக்கமான எபிரெயச் சூத்திரத்தை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: מַשָּׂא என்பதன் தீர்க்கதரிசன அல்லது பொதுப் பொருள்
  choice: முதன்மை உரையில் ‘இறைவாக்குகள்’
  alternative: ‘சுமை’, ‘அவன்மேல் விதிக்கப்பட்ட கனமான கப்பம்’, அல்லது பொதுவான ‘அறிவிப்புகள்’
  rationale: சொல் தீர்ப்பைக் கூறும் இறைவாக்கைக் குறிக்கக்கூடும்; ஆனால் ஒரே பொருளை உறுதியாக்க முடியாததால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘மித்ராஷ்’ போன்ற வரலாற்று-இலக்கியச் சொல் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; மூல எபிரெயத்தின் உண்மையான தெளிவின்மை மறைக்கப்படவில்லை.
