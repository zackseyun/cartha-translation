base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
translation:
  language: ta
  text: ஏனெனில், அந்தப் பொல்லாத பெண்ணாகிய அத்தாலியாளும் அவளுடைய மகன்களும் தேவனுடைய ஆலயத்தை உடைத்துக்குள் நுழைந்து, யெகோவாவின் ஆலயத்துக்குரிய பரிசுத்தப் பொருள்கள் அனைத்தையும் பாகால்களுக்காகச் செய்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இன்னும் சூழலுக்கு ஏற்ப, “யெகோவாவின் ஆலயத்துக்குரிய பரிசுத்தப் பொருள்கள் அனைத்தையும் பாகால் வழிபாட்டிற்காகப் பயன்படுத்தினார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் “செய்தார்கள்” என்ற வினை உள்ளது; இச்சூழலில், அந்தப் பரிசுத்தப் பொருள்களைப் பாகால் வழிபாட்டிற்காகக் கையகப்படுத்தி அல்லது பயன்படுத்தியதைக் குறிக்கலாம்.
    reason: மூலவினையின் நேரடிப் பொருளையும், சூழல் சுட்டும் பயன்பாடு/கையகப்படுத்துதல் என்ற சாத்தியமான பொருளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் விளக்க வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: עֲתַלְיָהוּ הַמִּרְשַׁעַת
  choice: அந்தப் பொல்லாத பெண்ணாகிய அத்தாலியாள்
  rationale: பெண்பால் ஒருமையையும், பெயருடன் இணைந்து அவளைச் சுட்டிக்காட்டும் எபிரெய வருணனையின் வலிமையையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: בָּנֶיהָ
  choice: அவளுடைய மகன்கள்
  rationale: எபிரெயச் சொல் பொதுவாகப் பிள்ளைகள் என்று இல்லாமல் மகன்கள் என்று குறிப்பாகக் கூறுவதால் அதையே பாதுகாக்கிறது.
- source_word: פָרְצוּ אֶת בֵּית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயத்தை உடைத்துச் சேதப்படுத்தினார்கள்
  rationale: פרץ என்பது உடைத்தல், அத்துமீறி நுழைதல் அல்லது பாழாக்குதல் ஆகிய நிழற்பொருள்களைக் கொள்ளலாம். ஆலயத்தை வன்முறையாகச் சிதைத்த சூழலை இயல்பான தமிழில் தெரிவிக்கிறது; வெறும் நுழைவை மட்டும் உறுதிப்படுத்தவில்லை.
- source_word: כָּל קָדְשֵׁי בֵית יְהוָה
  choice: யெகோவாவின் ஆலயத்துக்குரிய பரிசுத்தப் பொருள்கள் அனைத்தும்
  rationale: קָדְשֵׁי என்பதை வழிபாட்டிற்கெனப் பரிசுத்தமாக்கப்பட்ட பொருள்களாக வெளிப்படுத்துகிறது; இரண்டு இடங்களிலும் בֵּית என்பதன் ஆலயச் சூழலையும் தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரைத் தமிழில் பரவலாக அறியப்பட்ட வடிவில் நேரடியாகக் குறிப்பிடுகிறது.
- source_word: עָשׂוּ לַבְּעָלִים
  choice: பாகால்களுக்குரியவையாக ஆக்கினார்கள்
  rationale: עָשׂוּ என்பதன் அடிப்படை ‘செய்தார்கள்/ஆக்கினார்கள்’ என்ற பொருளைப் பாதுகாத்தபடியே, ஏற்கெனவே ஆலயத்துக்குரியவையாக இருந்த பரிசுத்தப் பொருள்களை பாகால் வழிபாட்டுக்கென மாற்றியமைத்த சூழலைத் தமிழில் புரியும்படி தருகிறது. בְּעָלִים என்பதன் பன்மையும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளாலான தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதை மறைக்காமல் தமிழில் பெயராக வழங்குகிறது.
- issue: בְּעָלִים என்பதன் பன்மை
  choice: பாகால்கள்
  alternative: பாகால்
  rationale: மூலத்தின் பன்மையை ஒருமையாகச் சீராக்காமல் பாதுகாக்கிறது; இது பல பாகால் உருவங்கள், வழிபாட்டு வடிவங்கள் அல்லது தெய்வங்களைக் குறிக்கக்கூடும்.
- issue: ஆலயப் பரிசுத்தப் பொருள்களைப் பற்றிய עָשׂוּ לַבְּעָלִים
  choice: பாகால்களுக்குரியவையாக ஆக்கினார்கள்
  alternative: பாகால்களுக்காகப் பயன்படுத்தினார்கள்
  rationale: ‘செய்தார்கள்/ஆக்கினார்கள்’ என்ற மூலவினையின் வெளிப்பாட்டை முதன்மை உரையில் பாதுகாக்கிறது; அதேவேளை சூழலில் அவற்றைப் பாகால் வழிபாட்டிற்காகக் கையகப்படுத்திப் பயன்படுத்தினர் என்ற சாத்தியத்தை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’, ‘பரிசுத்தப் பொருள்கள்’ போன்ற சொற்கள் வழிபாட்டுச் சூழலை சாதாரண வாசகருக்குத் தெளிவாக்குகின்றன. வாக்கியத்தின் குற்றச்சாட்டு வலிமை காக்கப்பட்டுள்ளது; பாகால் வழிபாட்டிற்காகப் பொருள்கள் எவ்வாறு மாற்றப்பட்டன என்பது தேவையின்றி விரிவாக்கப்படவில்லை.
