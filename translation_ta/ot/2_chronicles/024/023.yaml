base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
translation:
  language: ta
  text: ஆண்டு மாறும் காலத்தில்[a], ஆராமின்[b] படை அவனுக்கு எதிராகப் படையெடுத்து வந்தது. அவர்கள் யூதாவுக்கும் எருசலேமுக்கும் வந்து, மக்களிடையே இருந்த தலைவர்கள் அனைவரையும் அழித்தார்கள். அவர்களுடைய கொள்ளைப் பொருள்கள் அனைத்தையும்[c] தமஸ்கு அரசனிடம் அனுப்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆண்டின் முடிவில்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல்லாட்சி ஆண்டின் திருப்பத்தை அல்லது பருவச் சுழற்சியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “ஆராம்” என்பது பெரும்பாலும் “சிரியா” என்று மொழிபெயர்க்கப்படும் எபிரெயப் பெயர்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “அவர்களுடைய எல்லாக் கொள்ளைப் பொருள்களையும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  choice: ஆண்டு திரும்பும் காலத்தில்
  rationale: תְּקוּפָה என்பது சுற்றிவருதல் அல்லது பருவச் சுழற்சியின் திருப்பத்தைக் குறிக்கிறது. எபிரெயச் சொல்லாட்சியைத் தக்கவைத்தபடியே பருவமாற்றக் காலம் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עָלָה עָלָיו
  choice: அவனுக்கு எதிராகப் படையெடுத்து வந்தது
  rationale: עלה על என்பது படைச் சூழலில் ஒருவருக்கு எதிராகச் செல்லுதல் அல்லது தாக்க வருதல் என்பதைக் குறிக்கிறது. வெறும் ‘வந்தது’ என்பதைவிட இராணுவச் சூழலை இது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חֵיל אֲרָם
  choice: ஆராமின் படை
  rationale: חֵיל இங்கு இராணுவப் படையைக் குறிக்கிறது. பிற்காலப் புவியியல் பெயரான ‘சிரியா’ என்பதற்குப் பதிலாக எபிரெயப் பெயரான ‘ஆராம்’ தக்கவைக்கப்படுகிறது.
- source_word: וַיָּבֹאוּ אֶל יְהוּדָה וִירוּשָׁלַם
  choice: அவர்கள் யூதாவுக்கும் எருசலேமுக்கும் வந்து
  rationale: בוא என்பதன் அடிப்படைப் பொருளான வருதல் அல்லது சென்றடைதல் தக்கவைக்கப்படுகிறது; படையெடுப்பின் தன்மை சுற்றியுள்ள வாக்கியத்தால் ஏற்கெனவே தெளிவாகிறது.
- source_word: וַיַּשְׁחִיתוּ
  choice: அழித்துப்போட்டார்கள்
  rationale: שׁחת என்பதன் ஹிஃபில் வடிவம் அழித்தல் அல்லது நாசமாக்குதல் எனப் பொருள்படும். இங்கு மனிதர்கள் செயப்படுபொருளாக இருப்பதால் கடுமையான, உயிரழிவைக் குறிக்கக்கூடிய சொல்லாட்சி பயன்படுத்தப்படுகிறது.
- source_word: כָּל שָׂרֵי הָעָם מֵעָם
  choice: மக்களிடையே இருந்த தலைவர்கள் அனைவரையும்
  rationale: שָׂרִים என்பது தலைவர்கள், ஆட்சியாளர்கள் அல்லது அதிகாரிகளைக் குறிக்கலாம். מֵעָם அவர்கள் மக்களிடமிருந்து அல்லது மக்களிடையே இருந்தவர்கள் என்ற நுணுக்கத்தைத் தருவதால் அது தமிழில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: וְכָל שְׁלָלָם
  choice: தாங்கள் கொள்ளையிட்ட பொருள்கள் அனைத்தையும்
  rationale: שָׁלָל என்பது போரில் கைப்பற்றிய கொள்ளைப் பொருளைக் குறிக்கிறது. ‘தாங்கள்’ என்பது பின்னொட்டு படையெடுத்தவர்களின் கொள்ளையைச் சுட்டுவதைத் தெளிவாக்குகிறது.
- source_word: שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק
  choice: தமஸ்கு அரசனிடம் அனுப்பினார்கள்
  rationale: இந்தத் தொடர் தமஸ்குவை ஆட்சிமையமாகக் கொண்ட அரசனிடம் கொள்ளைப் பொருள்கள் அனுப்பப்பட்டதைக் குறிக்கிறது. ‘தமஸ்கு அரசன்’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
