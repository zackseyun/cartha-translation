  text: וּ/בְ/לֶכְתָּ֣/ם מִמֶּ֗/נּוּ כִּֽי עָזְב֣וּ אֹת/וֹ֮ ב/מחליים רַבִּים֒ הִתְקַשְּׁר֨וּ עָלָ֜י/ו עֲבָדָ֗י/ו בִּ/דְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַ/יַּֽהַרְגֻ֥/הוּ עַל מִטָּת֖/וֹ וַ/יָּמֹ֑ת וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֥א קְבָרֻ֖/הוּ בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
translation:
  language: ta
  text: அவர்கள் அவனைவிட்டுப் புறப்பட்டுச் சென்றபோது—அவர்கள் அவனைப் பல நோய்களோடு விட்டுச் சென்றிருந்தார்கள்—அவனுடைய பணியாளர்கள், ஆசாரியனாகிய யோய்தாவின் மகன்களுடைய இரத்தத்தினிமித்தம்[a] அவனுக்கு எதிராகச் சதிசெய்து, அவனை அவனுடைய படுக்கையில் கொன்றார்கள்; அவன் இறந்தான். அவனைத் தாவீதின் நகரத்தில் அடக்கம் செய்தார்கள்; ஆனால் அரசர்களின் கல்லறைகளில் அடக்கம் செய்யவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஆசாரியனாகிய யோய்தாவின் மகன்களுடைய இரத்தம்.” இச்சூழலில் இது குறிப்பாக யோய்தாவின் மகனாகிய சகரியாவைக் குறிக்கலாம் (24:20–22).
    reason: மசோரெட்டிக் எபிரெய உரையில் “மகன்கள்” என்ற பன்மை உள்ளது; ஆனால் உடனடியான சூழல் யோய்தாவின் மகனாகிய சகரியாவை வெளிப்படையாகக் குறிப்பிடுகிறது. இந்தக் குறிப்பு உரையிலும் சூழலிலும் உள்ள இழுபறியைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  choice: அவர்கள் அவனைவிட்டுப் புறப்பட்டுச் சென்றபோது
  rationale: ב prefixed to the infinitive construct has a temporal force, and מִמֶּנּוּ marks departure from Joash. This wording is natural Tamil while retaining both elements.
- source_word: כִּי עָזְבוּ אֹתוֹ בְּמַחֳלָיִם רַבִּים
  choice: அவர்கள் அவனைப் பல நோய்களோடு விட்டுச் சென்றிருந்தார்கள்
  rationale: Retains the plural sense of מַחֳלָיִם and presents כִּי as explanatory. The pluperfect-like Tamil form clarifies that this was his condition when the attackers departed.
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள் ... அவனுக்கு எதிராகச் சதிசெய்து
  rationale: הִתְקַשְּׁרוּ denotes conspiring, while עָלָיו marks action against him. பணியாளர்கள் directly renders royal servants without over-specifying them as officials.
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  choice: ஆசாரியனாகிய யோய்தாவின் மகன்களுடைய இரத்தத்தினிமித்தம்
  rationale: Preserves the causal force of בִּדְמֵי, the MT plural בְּנֵי, and the appositional title הַכֹּהֵן. The traditional biblical name form யோய்தா supports continuity and readability.
- source_word: וַיַּהַרְגֻהוּ עַל מִטָּתוֹ וַיָּמֹת
  choice: அவனை அவனுடைய படுக்கையிலேயே கொன்றார்கள்; அவன் இறந்துபோனான்
  rationale: Directly represents הרג as killing and preserves the explicit narrative statement of death. படுக்கையிலேயே emphasizes the specified location without adding motive.
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד
  choice: அவனைத் தாவீதின் நகரத்தில் அடக்கம் செய்தார்கள்
  rationale: A straightforward, idiomatic rendering of burial in the City of David.
- source_word: וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים
  choice: ஆனால் அரசர்களின் கல்லறைகளில் அடக்கம் செய்யவில்லை
  rationale: ஆனால் conveys the contrast between burial in David's city and exclusion from the royal tombs; கல்லறைகள் naturally renders the plural burial places.
theological_decisions:
- issue: Masoretic plural 'sons of Jehoiada' versus the contextual singular son, Zechariah, in 24:20–22
  choice: மகன்களுடைய
  alternative: மகனுடைய, அதாவது சகரியாவின் இரத்தத்தினிமித்தம்
  rationale: The main text follows the supplied Hebrew plural בְּנֵי and does not silently harmonize it with the singular figure named earlier. A footnote preserves the contextual possibility that Zechariah specifically is intended.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆசாரியன்,’ ‘தாவீதின் நகரம்,’ ‘கல்லறைகள்’ போன்ற பரவலாக அறியப்படும் வேதாகமச் சொற்கள் தொடர்ச்சிக்காகப் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மூலத்தின் விளக்க இடைச்சொற்றொடர் கோடுகளால் பிரிக்கப்பட்டு, நீண்ட வாக்கியத்தின் தெளிவு காக்கப்பட்டுள்ளது.
