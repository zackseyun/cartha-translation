revisions:
- from: யோய்தா இறந்த பிறகு, யூதாவின் தலைவர்கள்[a] வந்து அரசனுக்கு முன்பாகத் தரையில் விழுந்து பணிந்தனர். அப்போது அரசன் அவர்கள் சொன்னதைக் கேட்டான்[b].
  to: யோய்தா இறந்த பிறகு, யூதாவின் தலைவர்கள்[a] வந்து அரசனுக்கு முன்பாகப் பணிந்தனர். அப்போது அரசன் அவர்களுக்குச் செவிகொடுத்தான்[b].
  rationale: The revision removes an unwarranted explicit reference to the leaders’ words, retains the possible sense of heeding in the footnote, and avoids making the bowing gesture more specific than the Hebrew requires. The political title and the non-worshipful portrayal of homage before a human king are preserved.
