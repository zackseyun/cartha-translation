base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
translation:
  language: ta
  text: யோய்தா இறந்த பிறகு, யூதாவின் தலைவர்கள்[a] வந்து அரசனுக்கு முன்பாகப் பணிந்தனர். அப்போது அரசன் அவர்களுக்குச் செவிகொடுத்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யூதாவின் அதிகாரிகள்’ அல்லது ‘யூதாவின் பிரபுக்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களுக்குச் செவிகொடுத்தான்’ என்பதற்கு ‘அவர்கள் சொன்னபடி நடந்தான்’ என்ற பொருளும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי מוֹת יְהוֹיָדָע
  choice: யோய்தா இறந்த பிறகு
  rationale: எபிரெயத் தொடரின் காலப்பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; தொடக்க இணைப்புச்சொல் தமிழில் தனியே தேவையில்லை.
- source_word: שָׂרֵי יְהוּדָה
  choice: யூதாவின் தலைவர்கள்
  rationale: שָׂרִים என்பது ஆட்சிப் பொறுப்புடைய தலைவர்கள், அதிகாரிகள் அல்லது பிரபுக்களைக் குறிக்கலாம். ‘தலைவர்கள்’ என்பது சமூக மற்றும் அரசியல் உயர்நிலையை இயல்பாகத் தெரிவித்து, பரம்பரை இளவரசர்கள் என்ற தேவையற்ற பொருளைத் தவிர்க்கிறது.
- source_word: וַיִּשְׁתַּחֲווּ לַמֶּלֶךְ
  choice: அரசனுக்கு முன்பாகத் தரையில் விழுந்து பணிந்தனர்
  rationale: வினைச்சொல் உடலைத் தாழ்த்தி அல்லது தரையில் விழுந்து மரியாதை செலுத்தும் செயலைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு உடல் அசைவைத் தெளிவாகக் காட்டுகிறது; மனித அரசனுக்குச் செய்யப்பட்டதை தெய்வ வழிபாடாக மிகைப்படுத்தவில்லை.
- source_word: אָז
  choice: அப்போது
  rationale: நிகழ்வுகளின் தொடரில் அடுத்த கட்டத்தைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: அரசன் அவர்கள் சொன்னதைக் கேட்டான்
  rationale: שׁמע אל என்பது ஒருவருக்குச் செவிகொடுப்பது அல்லது அவருடைய வேண்டுகோளை ஏற்று நடப்பது என்ற இரு நிழற்பொருள்களையும் கொள்ளலாம். முதன்மை உரை உடனடியான ‘கேட்டான்’ என்ற பொருளை வைத்துக்கொண்டு, வலுவான பொருளை அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: தலைவர்கள் அரசனுக்குச் செய்த செயலின் தன்மை
  choice: தரையில் விழுந்து பணிந்தனர்
  alternative: வணங்கினர்; மரியாதை செலுத்தினர்
  rationale: எபிரெய வினை உடல் தாழ்த்துதலைக் குறித்தாலும், சூழலைப் பொறுத்து மரியாதை முதல் வழிபாடு வரை பல பொருள்களை ஏற்கலாம். இங்கு பெறுபவர் மனித அரசன் என்பதால், தெய்வ வழிபாட்டைக் குறிக்கும் சொல்லைத் திணிக்காமல் உடல் செயலும் பணிவும் பாதுகாக்கப்படுகின்றன.
- issue: அரசன் தலைவர்களுக்குச் செவிகொடுத்ததன் வலிமை
  choice: அவர்கள் சொன்னதைக் கேட்டான்
  alternative: அவர்களுக்குச் செவிகொடுத்தான்; அவர்கள் சொன்னபடி நடந்தான்
  rationale: மூல மொழித் தொடர் கேட்பதையும் ஏற்று இணங்குவதையும் குறிக்கக்கூடும். முதன்மை உரையில் இந்தத் தெளிவின்மையைப் பாதுகாத்து, சாத்தியமான வலுவான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் மரியாதையான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அரசன்’ என்பது இயல்பான தற்போதைய சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது; பெயர் ‘யோய்தா’ என ஒலிபெயர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களின் அருகே வைக்கப்பட்டுள்ளன.
