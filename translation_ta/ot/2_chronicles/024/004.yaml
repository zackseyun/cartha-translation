  text: After this[b][a], it was in the heart of Joash to restore the house of Yahweh.
translation:
  language: ta
  text: இதற்குப் பிறகு, யாவேயின் ஆலயத்தைப் புதுப்பிக்க வேண்டும் என்ற எண்ணம் யோவாஸின் உள்ளத்தில் எழுந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: கதையில் அடுத்த கட்டத்தை அறிமுகப்படுத்தும் காலத் தொடரை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; எபிரெய மொழியின் ‘அப்போது நிகழ்ந்தது’ என்ற தொடக்கத்தைச் சொற்சொல்லாகச் சேர்க்காமல் அதன் உரையாடல் செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  choice: என்ற எண்ணம் யோவாசின் உள்ளத்தில் எழுந்தது
  rationale: யோவாசின் உள்ளார்ந்த எண்ணம் அல்லது நோக்கத்தைச் சுட்டும் எபிரெய மொழிமரபை இயல்பான தமிழில் தருகிறது. ‘தீர்மானித்தான்’ என்பது மூலத்தில் அவசியமாக இல்லாத வலுவான முடிவெடுத்தல் நுணுக்கத்தைச் சேர்க்கக்கூடும்.
- source_word: לְחַדֵּשׁ
  choice: புதுப்பிக்க
  rationale: ஏற்கெனவே இருந்த கட்டிடத்தை மீண்டும் நல்ல நிலைக்குக் கொண்டுவருதல் என்ற ‘புதிதாக்குதல்/புதுப்பித்தல்’ பொருளைத் தக்கவைக்கிறது; ‘பழுதுபார்க்க’ என்பதைவிட இது சற்றுப் பரந்தது.
- source_word: בֵּית יְהוָה
  choice: யெகோவாவின் ஆலயம்
  rationale: בַּיִת என்பதன் சொற்சொல் பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் அது எருசலேம் ஆலயத்தைக் குறிக்கிறது. ‘ஆலயம்’ என்பது சாதாரண தமிழ் வாசகருக்கு இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் பரவலாக அறியப்பட்டுள்ள தெய்வீகப் பெயரின் வடிவத்தைப் பயன்படுத்தி, மூலத்திலுள்ள தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூல எபிரெய உரையில் நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக வருகிறது. ஆகவே ஒரு பொதுப் பட்டத்தை விட தனிப்பெயராக வழங்கப்பட்டுள்ளது. அதன் பண்டைய உச்சரிப்பு முழுமையாக உறுதியில்லை; தமிழ் வாசகர்களிடையே நிலைபெற்ற ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- issue: הָיָה עִם לֵב என்ற சொற்றொடரின் நோக்க வலிமை
  choice: எண்ணம் ... உள்ளத்தில் எழுந்தது
  alternative: யோவாஸ் உறுதிபூண்டான்
  rationale: இந்தச் சொற்றொடர் உள்ளார்ந்த நோக்கத்தைக் காட்டுகிறது; ஆனால் உறுதிமொழி போன்ற தீவிரமான தீர்மானத்தைத் தெளிவாகக் கூறவில்லை. எனவே அந்தத் திறந்த நுணுக்கம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; வாசிப்பிற்கு இயல்பான, கண்ணியமான வரலாற்று உரைநடை. ‘யெகோவாவின் வீடு’ என்ற சொற்சொல் வடிவத்திற்குப் பதிலாக சூழலுக்கேற்ற ‘யெகோவாவின் ஆலயம்’ பயன்படுத்தப்பட்டுள்ளது. ஒரே அடிக்குறி குறியீடு பிரதான உரையில் [a] என இடப்பட்டுள்ளது.
