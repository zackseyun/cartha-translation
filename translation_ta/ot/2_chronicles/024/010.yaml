source:
  edition: WLC
  text: וַ/יִּשְׂמְח֥וּ כָל הַ/שָּׂרִ֖ים וְ/כָל הָ/עָ֑ם וַ/יָּבִ֛יאוּ וַ/יַּשְׁלִ֥יכוּ לָ/אָר֖וֹן עַד לְ/כַלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/010.yaml
  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
translation:
  language: ta
  text: அப்போது அதிகாரிகள் அனைவரும், மக்கள் அனைவரும் மகிழ்ந்தார்கள்; பெட்டி நிறையும் வரை தங்கள் காணிக்கைகளைக் கொண்டுவந்து அதில் போட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் செய்து முடிக்கும்வரை.” எபிரெயச் சொற்றொடர் பொதுவாக “முடிவடையும் வரை” அல்லது “நிறைவடையும் வரை” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: மகிழ்ந்தார்கள்
  rationale: שׂמח என்பது மகிழ்ச்சி அடைவதைக் குறிக்கிறது; கூட்டு மகிழ்ச்சியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: כָל הַשָּׂרִים
  choice: அதிகாரிகள் அனைவரும்
  rationale: שׂרים இங்கு அரச நிர்வாக அல்லது தலைமைப் பொறுப்பில் இருந்தவர்களைக் குறிக்கிறது; ‘இளவரசர்கள்’ என்பது அரசரின் மகன்கள் என்ற தவறான எண்ணத்தை ஏற்படுத்தலாம்.
- source_word: וְכָל הָעָם
  choice: மக்கள் அனைவரும்
  rationale: எபிரெய உரையின் முழுமையான கூட்டுப்பொருளை நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַיָּבִיאוּ
  choice: தங்கள் காணிக்கைகளைக் கொண்டுவந்து
  rationale: வினைச்சொல் நேரடியாக ‘கொண்டுவந்தார்கள்’ என்று பொருள்படும். செயப்படுபொருள் எபிரெயத்தில் வெளிப்படையாக இல்லாவிட்டாலும், ஆலயப் பழுதுபார்ப்புக்கான வசூல் என்ற உடனடிச் சூழலில் ‘தங்கள் காணிக்கைகளை’ என இயல்பாக நிரப்பப்பட்டுள்ளது.
- source_word: וַיַּשְׁלִיכוּ
  choice: போட்டார்கள்
  rationale: שלך என்பதன் அடிப்படைப் பொருள் ‘எறிதல்/போடுதல்.’ பணத்தைப் பெட்டிக்குள் செலுத்தும் இச்சூழலில் ‘போட்டார்கள்’ என்பது இயல்பாகவும் செயல்வலிமையைத் தக்கவைத்தும் உள்ளது; ‘எறிந்தார்கள்’ தமிழில் அவமதிப்பான செயலைப் போல ஒலிக்கக்கூடும்.
- source_word: לָאָרוֹן
  choice: பெட்டிக்குள்
  rationale: אָרוֹן சூழலுக்கேற்ப பெட்டி, பேழை அல்லது உடன்படிக்கைப் பெட்டியைக் குறிக்கலாம். இங்கு காணிக்கை சேகரிக்கும் பெட்டியே குறிக்கப்படுவதால் ‘பெட்டி’ தெளிவானது.
- source_word: עַד לְכַלֵּה
  choice: அது நிறையும் வரை
  rationale: כלה என்பதன் இந்த வடிவம் முடிவு அல்லது நிறைவைச் சுட்டுகிறது. காணிக்கைப் பெட்டி நிறைவதே இச்சூழலில் மிக இயல்பான புரிதல்; எனினும் பொதுவான ‘முடிக்கும்வரை’ என்ற பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
