source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/הוּ הַ/מֶּ֜לֶךְ וִֽ/יהוֹיָדָ֗ע אֶל עוֹשֵׂה֙ מְלֶ֨אכֶת֙ עֲבוֹדַ֣ת בֵּית יְהוָ֔ה וַ/יִּֽהְי֤וּ שֹׂכְרִים֙ חֹצְבִ֣ים וְ/חָרָשִׁ֔ים לְ/חַדֵּ֖שׁ בֵּ֣ית יְהוָ֑ה וְ֠/גַם לְ/חָרָשֵׁ֤י בַרְזֶל֙ וּ/נְחֹ֔שֶׁת לְ/חַזֵּ֖ק אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
translation:
  language: ta
  text: ராஜாவும் யோயாதாவும் அதை[a] யாவேயின் ஆலயப் பணியைச் செய்தவர்களிடம் ஒப்படைத்தார்கள். அவர்கள் யாவேயின் ஆலயத்தை[b] புதுப்பிப்பதற்காகக் கல் வெட்டுபவர்களையும் கைவினைஞர்களையும் கூலிக்கு அமர்த்தினார்கள்; மேலும், யாவேயின் ஆலயத்தை வலுப்படுத்துவதற்காக இரும்பிலும் வெண்கலத்திலும் வேலை செய்யும் கைவினைஞர்களையும்[c] அமர்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அதை” என்பது முந்தைய சூழலில் சேகரிக்கப்பட்ட பணத்தைக் குறிக்கிறது. “அதைக் கொடுத்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “யாவேயின் வீடு”; அதாவது ஆலயம்.
    reason: lexical_alternative
  - marker: c
    text: “இரும்பு மற்றும் வெண்கலக் கொல்லர்களையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  choice: அதை ஒப்படைத்தார்கள்
  rationale: נתן என்பதன் நேரடிப் பொருளை இயல்பான தமிழில் தருகிறது; ஆண்பால் ஒருமை பின்னொட்டு முந்தைய சூழலில் சேகரிக்கப்பட்ட பணத்தைக் குறிக்கிறது.
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: யாவேயின் ஆலயப் பணியைச் செய்தவர்களிடம்
  rationale: எபிரெயச் சொற்றொடரின் அடுக்கான அமைப்பை வாசிக்கத்தக்க தமிழில் தருகிறது; வசனத்தில் வெளிப்படையாக இல்லாத ‘மேற்பார்வையாளர்கள்’ என்ற விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: சொல்லுக்குச் சொல் ‘யாவேயின் வீடு’ என்றாலும், இக்கட்டிடப் புதுப்பிப்புச் சூழலில் ‘ஆலயம்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וַיִּהְיוּ שֹׂכְרִים
  choice: கூலிக்கு அமர்த்தினார்கள்
  rationale: היה + பங்கேற்புவினை அமைப்பு தொடர்ச்சியான அல்லது நிகழ்ந்த செயலைக் காட்டுகிறது; தமிழில் பணியாளர்களை வேலைக்கு எடுத்ததைத் தெளிவாகக் கூறுகிறது.
- source_word: חֹצְבִים
  choice: கல் வெட்டுபவர்கள்
  rationale: ஆலயக் கட்டிடப் பழுதுபார்ப்புச் சூழலில் கல்லை வெட்டுவோரைச் சுட்டுகிறது.
- source_word: חָרָשִׁים
  choice: கைவினைஞர்கள்
  rationale: חרש என்பது தச்சர்களை மட்டும் அல்லாமல் திறமையான தொழிலாளர்களை விரிவாகக் குறிக்கக்கூடும்; எனவே பொதுவான பொருள் பாதுகாக்கப்படுகிறது.
- source_word: לְחַדֵּשׁ
  choice: புதுப்பிப்பதற்காக
  rationale: பியெல் வடிவம் ‘மீண்டும் புதிதாக்குதல்’ என்ற கருத்தைத் தருகிறது; பழுதுபார்த்தல் மற்றும் மீட்டமைத்தல் இரண்டையும் உள்ளடக்கும் இயல்பான தமிழ்.
- source_word: וְגַם לְחָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  choice: மேலும், இரும்பிலும் வெண்கலத்திலும் வேலை செய்யும் கைவினைஞர்களையும்
  rationale: உலோகங்களில் வேலை செய்யும் திறமையான பணியாளர்களைக் குறிக்கிறது; ‘கொல்லர்கள்’ என்ற சற்றுக் குறிப்பான பொருளை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: נְחֹשֶׁת
  choice: வெண்கலம்
  rationale: பண்டைய கட்டிட மற்றும் ஆலயப் பொருட்கள் பற்றிய இச்சூழலில் bronze என்பதே பொருத்தமான பொதுவான புரிதல்; ‘செம்பு’ என்பதும் சொல்லியல் வாய்ப்பு.
- source_word: לְחַזֵּק
  choice: உறுதிப்படுத்துவதற்காக
  rationale: חזק என்பதன் ‘வலிமையாக்குதல்’ என்ற நேரடிக் கருத்தை கட்டிடச் சூழலுக்கு ஏற்ற தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கெழுத்து இறைப்பெயர் நேரடியாக வருகிறது. ஆகவே அதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வாசிக்கத்தக்க ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’, ‘புதுப்பித்தல்’, ‘உறுதிப்படுத்துதல்’ ஆகியவை கட்டிடப் பணிச் சூழலைத் தெளிவாக்குகின்றன; மூலத்தின் சாத்தியமான மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
