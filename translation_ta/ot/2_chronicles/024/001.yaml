  text: בֶּן שֶׁ֤בַע שָׁנִים֙ יֹאָ֣שׁ בְּ/מָלְכ֔/וֹ וְ/אַרְבָּעִ֣ים שָׁנָ֔ה מָלַ֖ךְ בִּֽ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ צִבְיָ֖ה מִ/בְּאֵ֥ר שָֽׁבַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: ta
  text: யோவாஸ் அரசனானபோது அவனுக்கு ஏழு வயது. அவன் எருசலேமில் நாற்பது ஆண்டுகள் ஆட்சி செய்தான். அவனுடைய தாயின் பெயர் சிபியா; அவள் பெயெர்செபாவைச் சேர்ந்தவள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: அவனுக்கு ஏழு வயது
  rationale: ‘ஏழு ஆண்டுகளின் மகன்’ என்ற எபிரெய வயதுக் கூறை, அதன் பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: இங்கு בְּ முன்னொட்டுடன் வரும் வடிவம் அரசாட்சித் தொடக்கத்தின் காலத்தைக் குறிக்கிறது; ‘அரசனானபோது’ தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: ‘அரசாளுதல்/அரசனாக இருத்தல்’ என்ற வினைப் பொருளை இயல்பான தமிழ் வரலாற்று நடையில் தருகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: בְּ முன்னொட்டின் இடப்பொருளையும் இடப்பெயரையும் நேரடியாகக் காட்டுகிறது.
- source_word: וְשֵׁם אִמּוֹ
  choice: அவனுடைய தாயின் பெயர்
  rationale: எபிரெய வம்சவழி அறிமுகச் சூத்திரத்தின் தகவல் அமைப்பை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: צִבְיָה
  choice: சிபியா
  rationale: எபிரெய தனிப்பெயரான Ṣiḇyāh என்பதற்கு மூல ஒலியமைப்பை அணுகும் தமிழ் ஒலிபெயர்ப்பு.
- source_word: מִבְּאֵר שָׁבַע
  choice: பெயெர்-செபாவைச் சேர்ந்தவள்
  rationale: מִן முன்னொட்டு பிறப்பிடம் அல்லது ஊர்ச் சார்பைக் குறிக்கிறது; பெண்ணைக் குறிக்கும் சூழலில் ‘சேர்ந்தவள்’ இயல்பான தமிழ் வடிவம். கூட்டு இடப்பெயரின் அமைப்பை இணைப்புக்குறி பாதுகாக்கிறது.
