translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. அரசரின் ஆட்சித் தொடக்கம், ஆட்சிக்காலம், இடம், தாயின் பெயர் மற்றும் ஊர்ச் சார்பு ஆகிய எபிரெய தகவல்கள் அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
