translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் ‘நாட்கள் நிறைதல்’ என்ற உருவகம் முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் இயல்பான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
