  text: וַ/יִּזְקַ֧ן יְהוֹיָדָ֛ע וַ/יִּשְׂבַּ֥ע יָמִ֖ים וַ/יָּמֹ֑ת בֶּן מֵאָ֧ה וּ/שְׁלֹשִׁ֛ים שָׁנָ֖ה בְּ/מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/015.yaml
  text: And Jehoiada grew old and was full of days[a], and he died. He was one hundred and thirty years old at his death.
translation:
  language: ta
  text: யோயாதா முதுமையடைந்து, நாட்களால் நிறைவடைந்து[a], இறந்தார். அவர் இறந்தபோது அவருக்கு நூற்று முப்பது வயது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பாகக் கூறினால், ‘நிறைவான வாழ்வை வாழ்ந்தார்.’ எபிரெய மொழியில், ‘நாட்களால் நிறைவடைந்தார்’ என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְקַן
  choice: முதுமையடைந்து
  rationale: זקן என்பதன் வயது முதிரும் நிகழ்வுப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வெறுமனே ‘முதியவராக இருந்தார்’ என்று நிலைமையாக மட்டும் கூறுவதைத் தவிர்க்கிறது.
- source_word: יְהוֹיָדָע
  choice: யோயாதா
  rationale: எபிரெயப் பெயரின் ஒலியமைப்பைத் தமிழில் தெளிவாகக் காட்டும் பெயர்ப்பு.
- source_word: וַיִּשְׂבַּע יָמִים
  choice: வாழ்நாட்கள் நிறைந்தவராகி
  rationale: ‘நாட்களால் நிறைவடைதல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, அது ஒருவரின் வாழ்நாளைக் குறிக்கிறது என்பதைத் தமிழில் தெளிவாக்குகிறது.
- source_word: וַיָּמֹת
  choice: இறந்தார்
  rationale: מות என்பதற்கான இயல்பான மரியாதைமிக்க தமிழ் வினை; தொடரின் எழுவாய் யோயாதா என்பதால் உயர்திணை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  choice: அவருக்கு நூற்று முப்பது வயது
  rationale: எபிரெய மொழியின் ‘நூற்று முப்பது ஆண்டுகளின் மகன்’ என்ற வயதுக் கூறுமுறையை, பொருளை மாற்றாமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּמוֹתוֹ
  choice: அவர் இறந்தபோது
  rationale: בְּ முன்னொட்டின் காலப்பொருளையும் மூன்றாம் நபர் உரிமைத் தொடர்பையும் தெளிவான தமிழில் தருகிறது.
