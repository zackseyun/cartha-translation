source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֥/וֹ יְהוֹיָדָ֖ע נָשִׁ֣ים שְׁתָּ֑יִם וַ/יּ֖וֹלֶד בָּנִ֥ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/003.yaml
  text: Jehoiada took for him two wives[a], and he fathered sons and daughters.
translation:
  language: ta
  text: யோயாதா அவனுக்கு இரண்டு மனைவிகளை ஏற்பாடு செய்தான்[a]; அவன் மகன்களையும் மகள்களையும் பெற்றான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சாத்தியம் குறைந்த வாசிப்பாக, “யோயாதா இரண்டு மனைவிகளை மணந்துகொண்டு, மகன்களையும் மகள்களையும் பெற்றான்.” இவ்வாறு வாசிக்கும்போது, வசனம் முழுவதிலும் யோயாதாவே எழுவாயாகக் கொள்ளப்படுகிறார்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: ஏற்பாடு செய்தான்
  rationale: נשׂא என்பதன் அடிப்படைத் திருமணப் பொருள் ‘மனைவியாக எடுத்துக்கொள்ளுதல்.’ ஆனால் לּוֹ (‘அவனுக்கு’) என்பதால், இங்கு யோயாதா மற்றொருவருக்காக—சூழலில் யோவாசுக்காக—மனைவிகளைத் தேர்ந்தெடுத்து மண ஏற்பாடு செய்ததைக் காட்ட இயல்பான நவீனத் தமிழில் ‘ஏற்பாடு செய்தான்’ என வழங்கப்பட்டுள்ளது.
- source_word: לּוֹ
  choice: அவனுக்கு
  rationale: இந்த முன்னிடைச்சொல் இணைந்த சுட்டுப்பெயர் செயலின் பயனாளியைச் சுட்டுகிறது. எபிரெய உரையில் பெயர் மீண்டும் சொல்லப்படாததால், அதே சுட்டுப்பெயர் வடிவம் தமிழிலும் வைக்கப்பட்டுள்ளது.
- source_word: יְהוֹיָדָע
  choice: யோயாதா
  rationale: எபிரெய தனிப்பெயர் தமிழின் வழக்கமான வேதாகம ஒலிபெயர்ப்பு மரபுக்கு ஏற்ப வழங்கப்பட்டுள்ளது.
- source_word: נָשִׁים שְׁתָּיִם
  choice: இரண்டு மனைவிகளை
  rationale: திருமணச் சூழலில் נָשִׁים என்பது வெறும் ‘பெண்கள்’ என்பதைக் காட்டிலும் ‘மனைவிகள்’ என்று பொருள்படும்; எண்ணிக்கையும் வெளிப்படையாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: וַיּוֹלֶד
  choice: பெற்றான்
  rationale: Hiphil வடிவிலுள்ள ילד, ஆண் எழுவாயுடன் ‘பிள்ளைகளைப் பெறுதல்/தந்தையாகுதல்’ எனப் பொருள்படும். ‘பெற்றான்’ என்பது நவீனத் தமிழில் இயல்பாகவும் ஆண் எழுவாயைத் தெளிவாகவும் காட்டுகிறது.
- source_word: בָּנִים וּבָנוֹת
  choice: மகன்களையும் மகள்களையும்
  rationale: எபிரெய உரை ஆண், பெண் பிள்ளைகளைத் தனித்தனியாகக் குறிப்பிடுவதால், பொதுவான ‘பிள்ளைகள்’ என்று சுருக்காமல் அந்த வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: வசனத்திலுள்ள சுட்டுப்பெயர் மற்றும் இரண்டாம் வினைச்சொல்லின் எழுவாய்
  choice: யோயாதா யோவாசுக்காக இரண்டு மனைவிகளை ஏற்பாடு செய்தான்; யோவாஸ் மகன்களையும் மகள்களையும் பெற்றான் என்ற சூழல்சார் வாசிப்பு
  alternative: யோயாதாவே இரண்டு மனைவிகளை மணந்து, மகன்களையும் மகள்களையும் பெற்றான் என்ற வாசிப்பு
  rationale: முந்தைய கதைச்சூழல் யோவாசைப் பற்றியது; மேலும் לּוֹ (‘அவனுக்கு’) என்பது யோயாதா வேறொருவரின் சார்பாகச் செயல்பட்டதை வலுவாகக் காட்டுகிறது. ஆயினும், வெளிப்படையாகக் குறிப்பிடப்பட்ட மிக அருகிலுள்ள எழுவாய் யோயாதா என்பதால் மாற்று வாசிப்பு இலக்கண ரீதியில் முற்றிலும் இயலாததல்ல. எனவே முதன்மை உரையில் ‘அவன்’ என வைத்து மூலத்தின் சுட்டுப்பெயர் சார்ந்த பதற்றம் பாதுகாக்கப்பட்டு, மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஏற்பாடு செய்தான்’ என்பது சொற்சொல்லான ‘எடுத்தான்’ என்பதைக் காட்டிலும் திருமண ஏற்பாட்டுச் சூழலை இயல்பாக வெளிப்படுத்துகிறது; அதேவேளை சுட்டுப்பெயரின் உண்மையான தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
