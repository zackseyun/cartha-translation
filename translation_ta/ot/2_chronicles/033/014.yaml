base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
translation:
  language: ta
  text: இதற்குப் பிறகு, அவர் தாவீதின் நகரத்திற்காக ஒரு வெளிப்புற மதிலைக் கட்டினார். அது பள்ளத்தாக்கிலுள்ள கீகோனுக்கு மேற்கே, மீன் வாசலின் நுழைவிடம் வரை நீண்டு[a], ஓபேலை[b]ச் சுற்றியிருந்தது[c]; அவர் அதை மிகவும் உயரமாக்கினார். மேலும், யூதாவிலிருந்த அரண்சூழ்ந்த நகரங்கள் அனைத்திலும் படைத்தலைவர்களை நியமித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீன் வாசலின் நுழைவிடத்திற்கும்.” எபிரெயச் சொற்றொடர் அந்த வாசலை நோக்கிய மதிலின் பரப்பைக் குறிப்பதாகவும் வாசிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “ஓபேல்” என்பது எருசலேமிலுள்ள ஓர் இடப்பெயர்; இது ஆலய மேட்டுக்குத் தெற்கேயுள்ள உயர்ந்த பகுதியைக் குறித்திருக்கலாம்.
    reason: cultural_note
  - marker: c
    text: அல்லது, “அவர் ஓபேலைச் சுற்றினார்.” எபிரெய வினையின் இலக்கணக் கருத்துப்பொருளை மனாசே என வாசிக்கலாம்; ஆனால் சூழலில் அது மதிலின் பாதையை விவரிப்பதாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: கதையின் அடுத்த நிகழ்வை அறிமுகப்படுத்தும் காலத் தொடரை இயல்பான நவீன தமிழில் காட்டுகிறது.
- source_word: בָּנָה
  choice: கட்டினார்
  rationale: எபிரெய வினையின் அடிப்படைப் பொருள் ‘கட்டு’; சூழல் புதுப்பித்தலைக் குறிக்கக்கூடும் என்றாலும் ‘மீண்டும் கட்டினார்’ என்று வினையில் இல்லாத கருத்தைச் சேர்க்கவில்லை.
- source_word: חוֹמָה חִיצוֹנָה
  choice: வெளிப்புற மதில் ஒன்று
  rationale: நகரின் வெளிப்புற பாதுகாப்பு மதில் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: לְעִיר דָּוִיד
  choice: தாவீதின் நகரத்திற்காக
  rationale: לְ என்ற முன்னிடைச்சொல்லை கட்டுமானத்தின் நோக்கம் அல்லது பயன் என எடுத்துக்கொண்டு, நகரத்திற்கான மதில் என்ற உறவைப் பாதுகாக்கிறது.
- source_word: מַעְרָבָה לְגִיחוֹן בַּנַּחַל
  choice: பள்ளத்தாக்கிலுள்ள கீகோனுக்கு மேற்கே
  rationale: இடவியல் உறவைத் தெளிவாகக் காட்டுகிறது; נחל இங்கு பள்ளத்தாக்கு அல்லது ஓடைப்பள்ளத்தாக்கைக் குறிக்கலாம்.
- source_word: וְלָבוֹא בְשַׁעַר הַדָּגִים
  choice: மீன் வாசலின் நுழைவிடம் வரை சென்று
  rationale: மதிலின் பரப்பு அந்த வாசலின் அணுகுமிடம் வரை இருந்ததை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்றொடரின் கட்டமைப்பில் சிறிய தெளிவின்மை இருப்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: וְסָבַב לָעֹפֶל
  choice: ஓபேலைச் சுற்றியிருந்தது
  rationale: סבב என்பதன் ‘சுற்று/சூழ்’ பொருளைப் பாதுகாக்கிறது. தமிழ் வாக்கியத்தில் மதிலையே கருத்துப்பொருளாகக் கொள்வது இடவியல் விளக்கத்தைத் தெளிவாக்குகிறது; எபிரெய இலக்கணத் தொடரில் மனாசே கருத்துப்பொருளாக வாசிக்கவும் வாய்ப்புள்ளது.
- source_word: לָעֹפֶל
  choice: ஓபேல்
  rationale: எருசலேமிலுள்ள இடப்பெயரை மொழிபெயர்க்காமல் ஒலிபெயர்த்துள்ளது.
- source_word: וַיַּגְבִּיהֶהָ מְאֹד
  choice: அவர் அதை மிகவும் உயரமாக்கினார்
  rationale: பெண்பால் பின்னொட்டு மதிலைக் குறிக்கிறது; מְאֹד என்பதன் வலியுறுத்தலை ‘மிகவும்’ காக்கிறது.
- source_word: שָׂרֵי חַיִל
  choice: படைத்தலைவர்கள்
  rationale: இங்கு போர்வீரத் தன்மையுள்ளவர்கள் என்பதைக் காட்டிலும் படை அதிகாரிகள் அல்லது தளபதிகள் என்ற நிர்வாகப் பொருள் பொருத்தமானது.
- source_word: בְּכָל הֶעָרִים הַבְּצֻרוֹת
  choice: அரண்சூழ்ந்த நகரங்கள் அனைத்திலும்
  rationale: பாதுகாப்பு அரண்களால் உறுதிப்படுத்தப்பட்ட நகரங்கள் அனைத்திலும் அவர்கள் நியமிக்கப்பட்டதைச் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: וְסָבַב என்பதன் கருத்துப்பொருள்
  choice: தமிழில் மதில் ஓபேலைச் சுற்றியிருந்ததாக அமைத்தல்
  alternative: அவர் ஓபேலைச் சுற்றி மதிலைக் கட்டினார் / அவர் ஓபேலைச் சுற்றினார்
  rationale: எபிரெய தொடர் மனாசேயை இலக்கணக் கருத்துப்பொருளாகத் தொடரக்கூடியதாயிருந்தாலும், செயல் விவரிக்கும் பொருள் மதிலின் பாதையையே குறிக்கிறது. ஆகவே கருத்தைத் தெளிவாக்கும் வகையில் மதிலை கருத்துப்பொருளாக்கினோம்; எந்தத் தனிப்பட்ட கோட்பாட்டுச் சார்பும் இதில் இல்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் வடிவமைக்கப்பட்டது. பெயர்கள் தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்றபடி ஒலிபெயர்க்கப்பட்டுள்ளன. எபிரெயத்தின் இடவியல் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
