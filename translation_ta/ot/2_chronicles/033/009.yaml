reference: 2 Chronicles 33:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֶּ֣תַע מְנַשֶּׁ֔ה אֶת יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/009.yaml
  text: So Manasseh led Judah and the inhabitants of Jerusalem astray[a], to do more evil than the nations whom Yahweh had destroyed before the sons of Israel.
translation:
  language: ta
  text: மனாசே யூதா மக்களையும் எருசலேமில் குடியிருந்தவர்களையும், இஸ்ரவேல் மக்களுக்கு முன்பாக யாவே அழித்த தேசங்களைவிட அதிகத் தீமை செய்யும்படி வழிதவறச் செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּתַע
  choice: வழிதவறச் செய்து ... செய்ய வைத்தான்
  rationale: תעה என்பதன் ஹிஃபில் வடிவம் பிறரை வழிதவறச் செய்யும் காரணவினைப் பொருளைக் கொண்டது. தமிழில் காரணத் தொடர்பை இயல்பாகவும் தெளிவாகவும் காட்ட இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: யூதாவையும் எருசலேமின் குடியிருப்பாளர்களையும்
  rationale: யூதா என்ற கூட்டு மக்களையும், குறிப்பாக எருசலேமில் வசித்தவர்களையும் தனித்தனி செயப்படுபொருள்களாக மூலவாக்கியம் குறிப்பிடுவதைக் காக்கிறது.
- source_word: לַעֲשׂוֹת רָע
  choice: தீமை செய்ய
  rationale: எபிரெயச் சொற்றொடரின் எளிய, நேரான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: מִן הַגּוֹיִם
  choice: தேசத்தாரைவிட அதிகத் தீமை
  rationale: מן இங்கு ஒப்பீட்டைக் குறிக்கிறது; தமிழில் அந்த ஒப்பீட்டை வெளிப்படையாகத் தெரிவிக்க ‘விட அதிக’ பயன்படுத்தப்பட்டது.
- source_word: הַגּוֹיִם
  choice: தேசத்தார்
  rationale: வரலாற்றுச் சூழலில் இது சுற்றியிருந்த பிற தேச மக்களைக் குறிக்கிறது; பிற்கால மதப் பிரிவைக் குறிக்கக்கூடிய சொல்லைத் தவிர்க்கிறது.
- source_word: אֲשֶׁר הִשְׁמִיד יְהוָה
  choice: யாவே அழித்துப்போட்ட
  rationale: השמיד என்பதன் வலிமையான அழித்தல் பொருளையும், יהוה என்ற தனிப்பெயரையும் தெளிவாகக் காக்கிறது.
- source_word: מִפְּנֵי
  choice: முன்பாக
  rationale: வெற்றிகொள்ளும் சூழலில் ‘அவர்களுக்கு முன்பாக இருந்து அகற்றி அழித்தார்’ என்ற எபிரெய மரபுத்தொடரின் சுருக்கமான இயல்பான இணை.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் மகன்கள்’ என்றாலும், இங்கு முழு இஸ்ரவேல் சமூகத்தைக் குறிக்கும் பிரதிநிதித்துவப் பன்மை. ‘மக்கள்’ என்பது பாலினத்தை மாற்றித் தீர்மானிக்காமல் அதன் கூட்டுப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள உடன்படிக்கையின் தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற பாலினமுடைய கூட்டுச் சொற்றொடர்
  choice: இஸ்ரவேலின் மக்கள்
  alternative: இஸ்ரவேலின் மகன்கள்
  rationale: இங்கு ஆண்பால் பன்மை முழு சமூகத்தையும் பிரதிநிதித்துவப்படுத்துகிறது. ‘மக்கள்’ அதன் சூழல்சார் கூட்டுப் பொருளை இயல்பாகத் தருகிறது; தேவையில்லாத ஆண்-மட்டும் பொருளை உருவாக்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான வேதாகம நடையையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கிறது. மூலத்தின் காரணவினை, ஒப்பீடு, மற்றும் வரலாற்றுக் குறிப்புகள் வெளிப்படையாகக் காக்கப்பட்டுள்ளன.
