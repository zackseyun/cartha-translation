  text: וְ/הוּא֩ הֶעֱבִ֨יר אֶת בָּנָ֤י/ו בָּ/אֵשׁ֙ בְּ/גֵ֣י בֶן הִנֹּ֔ם וְ/עוֹנֵ֤ן וְ/נִחֵשׁ֙ וְֽ/כִשֵּׁ֔ף וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעוֹנִ֑י הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
translation:
  language: ta
  text: அவன் தன் மகன்களை இன்னோமின் மகனின் பள்ளத்தாக்கில் நெருப்பினூடே கடக்கச் செய்தான்[a]. அவன் நிமித்தம் பார்த்தான், சகுனம் பார்த்தான், சூனியம் செய்தான்; ஆவிகளோடு தொடர்புகொள்வோருடனும் ஆவிகளிடம் குறிகேட்போருடனும் தொடர்பு வைத்தான்[b]. யாவேயின் பார்வையில் தீமை செய்வதைப் பெரிதும் அதிகரித்து, அவருக்குக் கோபமூட்டினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் வெளிப்படையாக, “தன் மகன்களை நெருப்பில் பலியிட்டான்” எனப் பொருள் கொள்ளலாம். எபிரெய மரபுத்தொடர் சொற்சொல்லாக, “தன் மகன்களை நெருப்பினூடே கடக்கச் செய்தான்” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “ஆவிகளோடு தொடர்புகொள்வோர்” என்றும் “ஆவிகளிடம் குறிகேட்போர்” என்றும் மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொற்கள், இறந்தோர் அல்லது ஆவிகளிடம் ஆலோசனை கேட்பதோடு தொடர்புடைய நபர்களையும் நடைமுறைகளையும் குறிக்கின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  choice: தன் மகன்களை ... நெருப்பினூடே கடக்கச் செய்தான்
  rationale: குழந்தைப் பலியைக் குறிக்கும் எபிரெய மரபுத்தொடரின் வலுவான உட்பொருளை மறைக்காமல், மூலத்தின் நேரடி சொல்லமைப்பையும் அதன் உண்மையான விளக்க இடைவெளியையும் காக்கிறது.
- source_word: בְּגֵי בֶן־הִנֹּם
  choice: இன்னோமின் மகன் பள்ளத்தாக்கில்
  rationale: இடப்பெயரிலுள்ள ‘இன்னோம்’ என்பதை ஒலிபெயர்த்து, בֶן என்பதன் பொருளை வெளிப்படையாக மொழிபெயர்க்கிறது.
- source_word: וְעוֹנֵן
  choice: காலக்குறி பார்த்தான்
  rationale: காலம் அல்லது அறிகுறிகளை வைத்து பலன் கூறும் மறைமுறைச் செயலை இயல்பான தமிழில் குறிக்கிறது; அடுத்து வரும் נחשׁ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: וְנִחֵשׁ
  choice: சகுனம் பார்த்தான்
  rationale: அறிகுறிகள் அல்லது சகுனங்கள் மூலம் பலன் காணும் செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: וְכִשֵּׁף
  choice: சூனியம் செய்தான்
  rationale: மந்திரச் செயல்கள் அல்லது spell-casting என்ற பொருளை நவீனத் தமிழில் நேரடியாகவும் கடுமை குறையாமலும் தருகிறது.
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: ஆவிகளோடு தொடர்புகொள்வோருடனும் ஆவிகளிடம் குறிகேட்போருடனும் தொடர்பு வைத்தான்
  rationale: עָשָׂה உடன் வரும் அரிதான சொல்லிணைப்பை ‘ஆலோசனை கேட்டான்’ என்று தேவையின்றிக் குறுக்காமல், இத்தகைய நபர்கள் அல்லது நடைமுறைகளில் அவனுக்கிருந்த ஈடுபாட்டை பரந்த முறையில் தெரிவிக்கிறது.
- source_word: הִרְבָּה לַעֲשׂוֹת
  choice: தீமையானதை மிகுதியாகச் செய்து
  rationale: רבה என்பதன் பெருக்கம் அல்லது மிகுதியைத் தக்கவைத்து, தமிழில் இயல்பான வினையெச்சத் தொடராக அமைக்கிறது.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில் தீமையானதை
  rationale: எபிரெய மதிப்பீட்டு மரபுத்தொடரான ‘கண்களில்’ என்பதைக் கருத்துக்கு நெருக்கமான, இயல்பான ‘பார்வையில்’ என வழங்குகிறது.
- source_word: לְהַכְעִיסוֹ
  choice: அவருக்குக் கோபமூட்டினான்
  rationale: காரணவினையின் பொருளையும் செயற்பாட்டின் விளைவு அல்லது நோக்கத்தையும் சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: மகன்களை நெருப்பினூடே கடக்கச் செய்தல் என்பது குழந்தைப் பலியை வெளிப்படையாகச் சொல்கிறதா
  choice: மூல மரபுத்தொடரை முதன்மை உரையில் தக்கவைத்தல்
  alternative: தன் மகன்களை நெருப்பில் பலியிட்டான்
  rationale: இச்சொற்றொடர் பலியிடும் சடங்கை வலுவாகக் குறித்தாலும், எபிரெய உரை அதனை நேரடியாக ‘பலியிட்டான்’ என்று கூறவில்லை; ஆகவே விளக்கத்தை அடிக்குறிப்பில் தருவது மூலத்தின் பதற்றத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. மறைமுறைச் செயல்களைக் குறிக்கும் மூன்று எபிரெய வினைகளின் வேறுபாட்டை ‘காலக்குறி பார்த்தான், சகுனம் பார்த்தான், சூனியம் செய்தான்’ எனக் காக்கிறது. [b] குறி அது விளக்கும் சொற்றொடருக்குப் பின்பே வைக்கப்பட்டுள்ளது.
