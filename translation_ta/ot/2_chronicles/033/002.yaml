reference: 2 Chronicles 33:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: ta
  text: அவன் யாவேயின் பார்வையில் தீமையானதைச் செய்தான்; யாவே இஸ்ரவேல் மக்களுக்கு[a] முன்பாகத் துரத்தியிருந்த பிற தேசத்தாரின் அருவருப்பான செயல்களைப் போலவே செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்சார்ந்து, “இஸ்ரவேலின் புதல்வர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: עשה என்பதன் இறந்தகாலக் கதைநடையையும், பெயர்ச்சொல்லாகச் செயல்படும் הָרַע என்பதன் ‘தீமையானது’ என்ற ஒழுக்க மதிப்பீட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: ‘யாவேயின் கண்களில்’ என்ற எபிரெய உருவகத்தின் மதிப்பீட்டுப் பொருளைப் பாதுகாத்து, நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய வேதத்தில் உள்ள தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כְּתוֹעֲבוֹת
  choice: அருவருப்பான செயல்களைப் பின்பற்றினான்
  rationale: כְּ குறிக்கும் ஒப்புமை/ஒத்தநடத்தையையும், תּוֹעֵבָה என்பதன் வலுவான சமய-ஒழுக்க அருவருப்பு உணர்வையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַגּוֹיִם
  choice: பிற இனத்தார்
  rationale: இச்சூழலில் இஸ்ரவேலரல்லாத தேச மக்களைக் குறிக்கிறது; ‘புறஜாதியார்’ என்ற சமயச்சார்புள்ள சொல்லைத் தவிர்த்து வரலாற்றுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: הוֹרִישׁ
  choice: துரத்தியிருந்த
  rationale: Hiphil வடிவிலுள்ள ירשׁ இங்கு நிலத்திலிருந்த மக்களை அகற்றுதல் அல்லது வெளியேற்றுதல் என்று பொருள்படுகிறது; முந்திய நிகழ்வைக் காட்ட இறந்தகால நிறைவு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִפְּנֵי
  choice: முன்னிலையிலிருந்து
  rationale: வெளியேற்றும் வினையுடன் வரும் ‘அவர்களுக்கு முன்பாக இருந்து’ என்ற இடவுறவுப் பொருளைப் பாதுகாக்கிறது.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்கள்
  rationale: சொல்லுக்கு சொல் ‘இஸ்ரவேலின் புதல்வர்கள்’ என்றாலும், இங்கு அது இஸ்ரவேல் சமூகத்தாரை ஒட்டுமொத்தமாகக் குறிக்கிறது. பொதுவாசகருக்குத் தெளிவான இயல்பான தமிழை முதன்மை உரையில் கொண்டு, சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: בְּנֵי יִשְׂרָאֵל என்ற குடும்பவழிச் சொற்றொடர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் புதல்வர்கள்
  rationale: இச்சூழலில் ஆண்களை மட்டும் அல்லாமல் இஸ்ரவேல் சமூகத்தையே குறிக்கும் வழக்குச் சொற்றொடராக இருப்பதால், பொருளைத் தெளிவாகத் தரும் கூட்டுப்பெயர் முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது; எபிரெயின் சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான வரலாற்றுக் கதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வலுவான ஒழுக்க மற்றும் சமய மதிப்பீடு மென்மையாக்கப்படவில்லை.
