source:
  edition: WLC
  text: וּ/בָנָ֥ה מִזְבְּח֖וֹת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֥ם יִֽהְיֶה שְּׁמִ֖/י לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
translation:
  language: ta
  text: யாவேவின் ஆலயத்தில்[a] அவன் பலிபீடங்களைக் கட்டினான். அந்த ஆலயத்தைப் பற்றி யாவே, “எருசலேமில் என் பெயர் என்றென்றும் இருக்கும்”[b] என்று சொல்லியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “யாவேவின் வீட்டில்.” இங்கு “வீடு” என்பது ஆலயத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் சொற்படியாக, “என் பெயர் என்றென்றும் இருக்கும்.” மூலத்தில் “அங்கே” என்ற சொல் இல்லை; “என் பெயர் அங்கே என்றென்றும் இருக்கும்” என்ற பொதுவான வேதாகமச் சொல்லாட்சியுடன் ஒப்பிடலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: וּבָנָה
  choice: அவன் ... கட்டினான்
  rationale: בנה என்பதன் Qal perfect 3ms வடிவம் ‘கட்டினான்’ என்று நேரடியாகப் பொருள்படும். தொடக்க இணைப்புச் சொல் தமிழ் வரலாற்று நடையில் இயல்புக்காகத் தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: מִזְבְּחוֹת
  choice: பலிபீடங்கள்
  rationale: מִזְבֵּחַ என்பதன் பன்மை; பலி செலுத்தும் பீடங்களைக் குறிக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: בְּבֵית יְהוָה
  choice: யெகோவாவின் ஆலயத்தில்
  rationale: בַּיִת என்பதன் சொற்பொருள் ‘வீடு’; இச்சூழலில் அது ஆலயத்தைக் குறிக்கிறது. இயல்பான நவீன தமிழுக்காக ‘ஆலயம்’ முதன்மை உரையில் இடப்பட்டு, சொற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பான ‘யெகோவா’ என்று வழங்குகிறது.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: அந்த ஆலயத்தைக் குறித்து யெகோவா ... சொல்லியிருந்தார்
  rationale: אֲשֶׁר முன்வரும் ‘ஆலயம்’ என்பதோடு தொடர்புபடுத்தப்படுகிறது; இறைவாக்கு மனாசேயின் செயலுக்கு முன்னரே கூறப்பட்டது என்பதைத் தமிழில் இயல்பாகக் காட்ட ‘சொல்லியிருந்தார்’ பயன்படுத்தப்படுகிறது.
- source_word: בִּירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இடப்பொருள் முன்னொட்டுடன் வரும் நகரப்பெயரின் நேரான தமிழ் வடிவம்.
- source_word: יִהְיֶה שְּׁמִי
  choice: என் பெயர் ... இருக்கும்
  rationale: எபிரெயம் சொற்படியாக ‘என் பெயர் இருக்கும்’ என்றே கூறுகிறது; மூலத்தில் இல்லாத ‘அங்கே’ சேர்க்கப்படவில்லை.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவற்ற காலத்தைச் சுட்டும் לְעוֹלָם என்பதற்கான இயல்பான, கண்ணியமான தமிழ் இணை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப் பெயரே உள்ளது. ஆகவே அதனைப் பட்டப்பெயராக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவில் வழங்குகிறது.
- issue: ‘என் பெயர் இருக்கும்’ என்பதில் இடச்சுட்டைச் சேர்ப்பதா
  choice: என் பெயர் எருசலேமில் என்றென்றும் இருக்கும்
  alternative: என் பெயர் அங்கே என்றென்றும் இருக்கும்
  rationale: இவ்வசனத்தின் எபிரெய உரையில் שָׁם (‘அங்கே’) இல்லை. எருசலேம் என்ற இடம் வெளிப்படையாகக் கொடுக்கப்பட்டிருப்பதால், மூலத்தின் சுருக்கத்தையும் இறைநாமம்–இருப்பு சார்ந்த தத்துவ அழுத்தத்தையும் பாதுகாக்க கூடுதல் இடச்சுட்டு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வரலாற்று நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆலயம்’, ‘பலிபீடம்’, ‘என்றென்றும்’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகமச் சூழலுக்குரிய உயர்வுடனும் உள்ளன. மூலத்தின் தொடர்புச் சொற்றொடர் தமிழில் இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது; பொருள் தொடர்பு ‘அந்த ஆலயத்தைக் குறித்து’ என்பதால் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
