revisions:
- from: அவனுடைய பணியாளர்கள் அவனுக்கு எதிராகச் சதிசெய்து, அவனுடைய சொந்த வீட்டிலேயே அவனைக் கொன்றுபோட்டார்கள்.
  to: அவனுடைய பணியாளர்கள் அவனுக்கு எதிராகச் சதி செய்து, அவனை அவனுடைய வீட்டில் கொன்றார்கள்.
