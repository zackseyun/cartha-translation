translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்று உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. ‘பணியாளர்கள்’ என்பது ‘அடிமைகள்’ அல்லது ‘அதிகாரிகள்’ என்று தேவையின்றிக் குறுக்காமல் மூலச்சொல்லின் சூழல்சார் பரப்பைப் பேணுகிறது.
