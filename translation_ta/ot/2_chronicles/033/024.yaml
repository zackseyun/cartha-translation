  text: And his servants conspired against him and put him to death in his own house.
translation:
  language: ta
  text: அவனுடைய பணியாளர்கள் அவனுக்கு எதிராகச் சதி செய்து, அவனை அவனுடைய வீட்டில் கொன்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: சதிசெய்து
  rationale: קשר על என்ற எபிரேயச் சொற்றொடர், குறிப்பாக அரசரைக் கொல்லும் சூழலில், ஒருவருக்கு எதிராகச் சதிசெய்வதைக் குறிக்கிறது. ‘சதிசெய்து’ என்பது அதன் திட்டமிட்ட விரோதச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָלָיו
  choice: அவனுக்கு எதிராக
  rationale: קשר என்பதுடன் வரும் על, சதியின் இலக்கைச் சுட்டுகிறது; எனவே ‘அவனுக்கு எதிராக’ என்பது பொருளுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: அரசவைக் சூழலில் עבד என்பது அரசனுக்குப் பணிபுரிபவர்களையோ அலுவலர்களையோ குறிக்கலாம். பதவிநிலையை மிகையாகக் குறிப்பதின்றி மூலத்தின் பரந்த பொருளைப் பேண ‘பணியாளர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַיְמִיתֻהוּ
  choice: அவனைக் கொன்றுபோட்டார்கள்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் மரணமடையச் செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டது. இங்கு ‘கொன்றுபோட்டார்கள்’ திட்டமிட்ட கொலையின் தீவிரத்தையும் நிறைவுற்ற செயலையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּבֵיתוֹ
  choice: அவனுடைய சொந்த வீட்டிலேயே
  rationale: בְּ இடத்தையும், பின்னொட்டு அவனுடைய வீட்டையும் குறிக்கிறது. ‘சொந்த’ மற்றும் வலியுறுத்தும் ‘-ஏ’ ஆகியவை வேறொருவரின் வீட்டில் அல்ல, அவனுடைய வீட்டிலேயே கொலை நடந்ததைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகின்றன.
