base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
translation:
  language: ta
  text: யாவே அசீரிய அரசனுடைய படைத்தலைவர்களை அவர்களுக்கு எதிராகக் கொண்டுவந்தார். அவர்கள் மனாசேயைக் கொக்கிகளால்[a] பிடித்து, வெண்கலச் சங்கிலிகளால் கட்டி, பாபிலோனுக்குக் கொண்டுபோனார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு கொக்கியால்.’ இதற்கான எபிரெயச் சொல் கொக்கிகளையோ முட்களையோ குறிக்கலாம்; சிறைபிடிக்கப்பட்டவருக்கு இடப்பட்ட ஏதாவது ஒரு கட்டுப்பாட்டுச் சாதனத்தை இது பொதுவாகக் குறிப்பதாகவும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், நவீனத் தமிழில் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיָּבֵא ... עֲלֵיהֶם
  choice: அவர்களுக்கு எதிராக ... வரவழைத்தார்
  rationale: בוא என்பதன் ஹிஃபீல் வடிவிலுள்ள காரணவினைப் பொருளையும், עַל என்பதன் பகைமைச் சூழலுக்குரிய ‘எதிராக’ என்ற பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசனுடைய படைத்தலைவர்கள்
  rationale: இராணுவத் தலைமைப் பொறுப்பையும் அசீரிய அரசனுடனான தொடர்பையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וַיִּלְכְּדוּ
  choice: பிடித்து
  rationale: போர்ச் சூழலில் ஒருவரைக் கைப்பற்றுதல் அல்லது சிறைப்பிடித்தல் என்ற பொருளைத் தெளிவாகத் தருகிறது.
- source_word: בַּחֹחִים
  choice: கொக்கிகளால்
  rationale: சிறைப்பட்டவர்களைக் கட்டுப்படுத்தப் பயன்படுத்தப்பட்டிருக்கக்கூடிய கொக்கிகள் என்ற தெளிவான உருவகத்தைப் பாதுகாக்கிறது; எபிரெயச் சொல்லின் வேறு சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: וַיַּאַסְרֻהוּ בַּנְחֻשְׁתַּיִם
  choice: வெண்கலச் சங்கிலிகளால் கட்டி
  rationale: கட்டுதல் என்ற வினையையும் உலோகக் கட்டுப்பாடுகள் என்ற பொருளையும் எளிதில் புரியும் தமிழில் இணைக்கிறது.
- source_word: וַיּוֹלִיכֻהוּ בָּבֶלָה
  choice: பாபிலோனுக்குக் கொண்டுபோனார்கள்
  rationale: ஹிஃபீல் வடிவின் ‘செல்லச் செய்தல்/அழைத்துச் செல்லுதல்’ என்ற பொருளையும், இடத்தை நோக்கிய இயக்கத்தையும் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: அசீரியப் படைத்தலைவர்களின் தாக்குதலில் இறைவனுடைய செயலாண்மை
  choice: யாவே அவர்களை எதிராக வரவழைத்தார் என்று நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: யாவே அவர்கள் வருவதற்கு அனுமதித்தார்.
  rationale: எபிரெய மூலத்தின் காரணவினை இந்த நிகழ்வை யாவேயின் நேரடி செயலாகக் கூறுகிறது; அதை வெறும் அனுமதியாக மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘வரவழைத்தார்’ என்பது இறைச் செயலாண்மையைத் தெளிவாக வைத்திருக்கிறது; ‘கொக்கிகள்’ என்ற அரிதான சிறைப்பிடிப்பு உருவகத்தின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
