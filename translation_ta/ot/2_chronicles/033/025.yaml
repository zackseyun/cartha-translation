translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய மூலத்தின் சமூக-அரசியல் சொற்றொடரான “நாட்டின் மக்கள்” விளக்கக் குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது; மூலத்தில் உள்ள இரு செயல்களும் தெளிவான கதைத் தொடராக வழங்கப்பட்டுள்ளன.
