base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
translation:
  language: ta
  text: ஆனால், நாட்டின் மக்கள்[a] அமோன் அரசனுக்கு எதிராகச் சதி செய்த அனைவரையும் வீழ்த்தினார்கள்; பின்னர் நாட்டின் மக்கள் அவனுடைய மகன் யோசியாவை அமோனுக்குப் பதிலாக அரசனாக்கினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாட்டின் மக்கள்” என்பது நாட்டின் பொதுமக்களையோ, சமூக-அரசியல் பங்கு வகித்த ஒரு மக்கள் குழுவையோ குறிக்கக்கூடிய எபிரெயச் சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: கொன்றுபோட்டார்கள்
  rationale: נכה என்பதன் ஹிஃபில் வடிவம் கதைச் சூழலில் தாக்கி வீழ்த்துவதையும், பெரும்பாலும் கொல்வதையும் குறிக்கிறது. இங்கு சதிகாரர்களுக்கான தண்டனை உயிர்க்கொலையாக இருப்பதால், இயல்பான தமிழில் முடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַם הָאָרֶץ
  choice: நாட்டின் மக்கள்
  rationale: எபிரெயச் சொற்றொடரின் வெளிப்படையான பொருளைத் தக்கவைத்து, அது பொதுமக்களையா அல்லது குறிப்பிட்ட சமூக-அரசியல் குழுவையா குறிக்கிறது என்பதை முதன்மை உரையில் தீர்மானிக்காமல் விடுகிறது.
- source_word: כָּל הַקֹּשְׁרִים
  choice: சதிசெய்த அனைவரையும்
  rationale: קשר பங்கேற்புவினை வடிவம் அரசனுக்கு எதிரான சதியில் இணைந்தவர்களைக் குறிக்கிறது; இத்தமிழாக்கம் செயலும் சம்பந்தப்பட்ட அனைவரும் என்ற முழுமையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: அமோன் அரசனுக்கு எதிராக
  rationale: קשר உடன் வரும் עַל இங்கு ஒருவருக்கு எதிரான சதியைக் குறிக்கிறது.
- source_word: וַיַּמְלִיכוּ
  choice: அரசனாக்கினார்கள்
  rationale: מלך என்பதன் ஹிஃபில் வடிவம் ஒருவரை அரசனாக்குவதைக் குறிக்கிறது; பட்டாபிஷேகச் சடங்கு நடந்ததாக மூலத்தில் இல்லாத தகவலைச் சேர்க்கவில்லை.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: அவனுடைய மகன் யோசியாவை
  rationale: யோசியா அமோனின் மகன் என்பதைத் தெளிவாகவும் இயல்பான தமிழ் சொல்வரிசையிலும் தெரிவிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அமோனுக்குப் பின் அவனுடைய இடத்தில் யோசியா அரசனான வாரிசுரிமை/மாற்றுப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: וַ
  choice: ஆனால் / பின்னர்
  rationale: முதல் வாவ் முந்தைய வசனத்தில் அமோன் கொல்லப்பட்டதற்கு எதிரான மக்களின் நடவடிக்கையைச் சுட்டும் வேறுபாடாகவும், இரண்டாவது வாவ் நிகழ்வுகளின் தொடர்ச்சியாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
