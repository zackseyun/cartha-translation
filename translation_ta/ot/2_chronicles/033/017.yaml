reference: 2 Chronicles 33:17
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֲבָל֙ ע֣וֹד הָ/עָ֔ם זֹבְחִ֖ים בַּ/בָּמ֑וֹת רַ֖ק לַ/יהוָ֥ה אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/017.yaml
  text: Nevertheless[a], the people still sacrificed at the high places, but only to Yahweh their God.
translation:
  language: ta
  text: ஆனாலும், மக்கள் இன்னும் உயர்ந்த வழிபாட்டு இடங்களில் பலிகளைச் செலுத்திவந்தார்கள்; ஆனால், அவற்றைத் தங்கள் கடவுளான யாவேக்கே செலுத்தினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבָל
  choice: ஆனாலும்
  rationale: முந்தைய சீர்திருத்தங்களுக்கு மாறாகத் தொடர்ந்த நிலையை இயல்பான தமிழில் காட்டும் எதிர்மறை இணைப்புச்சொல்.
- source_word: עוֹד
  choice: இன்னும்
  rationale: அந்த வழக்கம் தொடர்ந்து நீடித்ததைக் குறிக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: தேச மக்களை ஒட்டுமொத்தமாகக் குறிக்கும் இயல்பான தமிழ்.
- source_word: זֹבְחִים
  choice: பலியிட்டுவந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான செயற்பொருளைச் சூழலுக்கேற்றவாறு வெளிப்படுத்துகிறது.
- source_word: בַּבָּמוֹת
  choice: மேடுகளில்
  rationale: במות என்பது உள்ளூர் உயர்ந்த வழிபாட்டிடங்களைக் குறிக்கும் மரபான வேதாகமச் சொல்; 'மேடுகள்' சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: רַק
  choice: ஆனால் ... -க்கே
  rationale: பலியின் இடத்தை அல்ல, அதைப் பெறுபவரை மட்டும் வரையறுக்கும் திருத்தும் நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கே
  rationale: לְ முன்னொட்டின் இலக்கையும் רַק என்பதன் 'மட்டுமே' என்ற வரம்பையும் வேற்றுமை உருபும் ஏகாரமும் தெளிவாக வெளிப்படுத்துகின்றன; יהוה ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהֵיהֶם
  choice: தங்கள் கடவுளாகிய
  rationale: எழுவாயான மக்களையே திரும்பச் சுட்டும் உடைமை உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: மேடுகளில் செலுத்தப்பட்ட பலிகளின் பொருள்
  choice: மக்கள் மேடுகளில் தொடர்ந்து பலியிட்டார்கள்; எனினும் யாவேக்கு மட்டுமே பலியிட்டார்கள்
  alternative: யாவேக்குரிய மேடுகளில் மட்டுமே மக்கள் பலியிட்டார்கள்
  rationale: எபிரெயச் சொல்வரிசையில் רַק לַיהוָה என்பது பலியின் பெறுபவரைக் கட்டுப்படுத்துகிறது; இடத்தைக் கட்டுப்படுத்தவில்லை. இதனால் சீர்திருத்தம் முழுமையடையாத பதற்றம் நிலைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; கண்ணியமான எளிய நடை. 'பலியிட்டுவந்தார்கள்' தொடர்ந்த பழக்கத்தையும், 'யாவேக்கே' பலியின் ஒரே பெறுபவரையும் தெளிவுபடுத்துகிறது.
