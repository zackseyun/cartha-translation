source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֣י מְנַשֶּׁה֮ וּ/תְפִלָּת֣/וֹ אֶל אֱלֹהָי/ו֒ וְ/דִבְרֵי֙ הַֽ/חֹזִ֔ים הַֽ/מְדַבְּרִ֣ים אֵלָ֔י/ו בְּ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל הִנָּ֕/ם עַל דִּבְרֵ֖י מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: The rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
translation:
  language: ta
  text: மனாசேயின் மற்ற செயல்களும், அவர் தம் இறைவனிடம் செய்த மன்றாட்டும், இஸ்ரவேலின் இறைவனாகிய யாவேயின் பெயரால் அவரிடம் பேசிய தரிசனக்காரர்களின் வார்த்தைகளும்—இதோ, அவை இஸ்ரவேல் அரசர்களின் அரசப் பதிவுகளில்[a] எழுதப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: “இஸ்ரவேல் அரசர்களின் நூலில்” அல்லது “இஸ்ரவேல் அரசர்களின் ஆண்டுக் குறிப்புகளில்.” இந்த எபிரெய மேற்கோள் நடை எழுதப்பட்ட ஓர் அரச ஆதாரத்தைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: மனாசேயின் மற்ற செயல்கள்
  rationale: அரச வரலாற்றுச் சுருக்கச் சூத்திரத்தில் דִּבְרֵי என்பது வெறும் பேச்சுச் சொற்களை அல்லாமல் செயல்களையும் நிகழ்வுகளையும் குறிக்கிறது; יֶתֶר முன்பு சொல்லப்படாத எஞ்சியவற்றைக் குறிக்கிறது.
- source_word: תְפִלָּתוֹ אֶל אֱלֹהָיו
  choice: அவர் தம் இறைவனிடம் செய்த மன்றாட்டு
  rationale: אֶל என்பதன் ‘இடம்/நோக்கி’ என்ற பொருளையும் אֱלֹהָיו என்பதிலுள்ள உடைமைத் தொடர்பையும் காக்கிறது; ‘மன்றாட்டு’ சூழலுக்கு ஏற்ற மரியாதையான நவீன தமிழ்.
- source_word: הַחֹזִים
  choice: தரிசனக்காரர்கள்
  rationale: இது பொதுவான ‘தீர்க்கதரிசிகள்’ என்பதைக் காட்டிலும் குறிப்பான ‘seers’ என்ற தீர்க்கதரிசனப் பணிப் பெயர்; மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- source_word: הַמְדַבְּרִים אֵלָיו
  choice: அவரிடம் பேசிய
  rationale: எபிரெயப் பங்கேற்புவினையை இயல்பான தமிழ் உறவெச்சத் தொடராக வழங்குகிறது.
- source_word: בְּשֵׁם יְהוָה
  choice: யாவேயின் பெயரால்
  rationale: அதிகாரப்பூர்வமாகவும் பிரதிநிதித்துவமாகவும் பேசும் கருத்தை மிகைப்படுத்தாமல் நேரடியாகக் காக்கிறது.
- source_word: הִנָּם
  choice: இதோ, அவை
  rationale: எழுத்து ஆதாரத்தின்மீது கவனம் ஈர்க்கும் சுட்டும் வலியுறுத்தலும் காக்கப்படுகின்றன.
- source_word: עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் அரசர்களின் வரலாற்றுப் பதிவுகளில் எழுதப்பட்டுள்ளன
  rationale: இது ஒரு எழுதப்பட்ட அரச வரலாற்று ஆதாரத்தைக் குறிக்கும் மேற்கோள் சூத்திரம். தமிழில் பொருள் தெளிவதற்காக ‘எழுதப்பட்டுள்ளன’ வெளிப்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: ஆதார நூலில் குறிப்பிடப்படும் ‘இஸ்ரவேல் அரசர்கள்’ யார் என்பது
  choice: இஸ்ரவேல் அரசர்கள் என்று மூலப்படியே வைத்தல்
  alternative: யூதா அரசர்கள்
  rationale: மனாசே யூதாவின் அரசன் என்பதால் ‘யூதா’ என்று ஒத்திசைக்கத் தூண்டுதல் இருந்தாலும் மசோரெட்டிக் உரை יִשְׂרָאֵל என்று வாசிக்கிறது; அந்தத் தெளிவின்மையை மொழிபெயர்ப்பு மாற்றாது.
- issue: אֱלֹהָיו என்பதிலுள்ள தனிப்பட்ட உறவு
  choice: தம் இறைவன்
  alternative: இறைவன்
  rationale: ‘அவருடைய இறைவன்’ என்ற மூலத்தின் உடைமைத் தொடர்பைக் காக்கிறது; அதிலிருந்து கூடுதல் இறையியல் முடிவை உருவாக்கவில்லை.
translation_notes:
  register: நவீன பொதுத் தமிழில் மரியாதையும் வேதாகம வரலாற்று நடையும் காக்கப்பட்டுள்ளன. ‘தரிசனக்காரர்கள்’ என்பது அரிதாகத் தோன்றினாலும் חֹזִים என்ற குறிப்பான பதவிப்பெயரை ‘தீர்க்கதரிசிகள்’ என்று பொதுமைப்படுத்தாமல் பாதுகாக்கிறது. ‘இதோ’ என்ற சொல் மூலத்தின் கவன ஈர்ப்பைத் தக்கவைக்கிறது.
