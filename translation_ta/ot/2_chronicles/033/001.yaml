  text: Manasseh was twelve years old when he began to reign, and he reigned fifty-five years in Jerusalem.
translation:
  language: ta
  text: மனாசே அரசனானபோது அவனுக்குப் பன்னிரண்டு வயது. அவன் எருசலேமில் ஐம்பத்தைந்து ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: அவனுக்குப் பன்னிரண்டு வயது
  rationale: எபிரெய மொழியின் வழக்கமான வயதுக் குறிப்பை, அதன் பொருளைத் துல்லியமாகக் காத்து இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர் வடிவம்.
- source_word: בְמָלְכוֹ
  choice: அரசனானபோது
  rationale: இந்த அரசாட்சிக் குறிப்பில் ஆட்சியேற்ற நேரத்தைக் குறிக்கிறது; இத்தமிழ் வடிவம் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: ஐம்பத்தைந்து ஆண்டுகள்
  rationale: எபிரெய இணைப்பு எண்ணின் பொருளை நவீனத் தமிழின் இயல்பான எண் வடிவில் தருகிறது.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: இச்சூழலில் מלך அரசராக ஆட்சி செய்வதைக் குறிக்கிறது; ‘ஆட்சி செய்தான்’ என்பது பொதுவாகப் புரியும் இயல்பான தமிழ்.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: ב இடத்தைக் குறிக்கிறது; ‘எருசலேமில்’ என்பது நேரடியான தமிழ் வடிவம்.
