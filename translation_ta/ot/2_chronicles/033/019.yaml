base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
translation:
  language: ta
  text: அவனுடைய ஜெபமும், அவனுடைய விண்ணப்பத்திற்குச் செவிசாய்க்கப்பட்டதும், அவனுடைய பாவம் அனைத்தும், அவனுடைய நம்பிக்கைத் துரோகமும், அவன் தன்னைத் தாழ்த்துவதற்கு முன்பு உயர்ந்த வழிபாட்டு இடங்களைக் கட்டி, அசேரா வழிபாட்டுச் சின்னங்களையும்[a] செதுக்கப்பட்ட உருவங்களையும் நிறுவிய இடங்களும்—இதோ, அவை தரிசனக்காரர்களின் பதிவுகளில்[b] எழுதப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அசேரா கம்பங்கள்.’ எபிரெயச் சொல் அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஓசாயின் வார்த்தைகளில்.’ இறுதித் தொடர் ‘தரிசனக்காரர்கள்’ என்பதற்குப் பதிலாக ‘ஓசாய்’ என்ற இயற்பெயரைப் பாதுகாத்திருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  choice: அவனுடைய ஜெபம்
  rationale: תְּפִלָּה என்பதன் வழக்கமான பொருளான ‘ஜெபம்’ என்பதைக் காத்து, இன்றைய தமிழ் வாசகர்களுக்கு இயல்பாக அமைக்கிறது.
- source_word: הֵעָתֶר לוֹ
  choice: அது கேட்கப்பட்ட விதம்
  rationale: ஜெபத்திற்குக் கிடைத்த சாதகமான பதிலை உணர்த்துகிறது; எபிரெய உரையில் இக்கூற்றில் வெளிப்படையாக இல்லாத இறைச் செய்பவரைச் சேர்க்காமல் விடுகிறது.
- source_word: כָל חַטָּאתוֹ
  choice: அவனுடைய பாவம் அனைத்தும்
  rationale: எபிரெய ஒருமையின் தொகுப்புப் பொருளைக் காத்து, அவனுடைய தீச்செயல்களின் முழுமையையும் தெரிவிக்கிறது.
- source_word: מַעְלוֹ
  choice: அவனுடைய நம்பிக்கைத் துரோகம்
  rationale: מעל என்பதில் உள்ள நம்பிக்கையை மீறுதல் அல்லது உண்மையற்ற நடத்தையின் சமய-ஒழுக்க வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בָּמוֹת
  choice: வழிபாட்டு மேடைகள்
  rationale: இவை வெறும் உயரமான இடங்கள் அல்ல, உள்ளூர் சமய வழிபாட்டுத் தலங்கள் என்பதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
- source_word: הָאֲשֵׁרִים
  choice: அசேரா வழிபாட்டுச் சின்னங்கள்
  rationale: அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களைக் குறிக்கிறது; அவற்றின் துல்லியமான வடிவத்தைத் தீர்மானிக்காமல் உண்மையான சொல்லியல் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: הַפְּסִלִים
  choice: செதுக்கப்பட்ட உருவங்கள்
  rationale: פסילים என்பதன் உறுதியான உருவாக்க முறையையும் வழிபாட்டுப் பொருள் தன்மையையும் காக்கிறது.
- source_word: לִפְנֵי הִכָּנְעוֹ
  choice: அவன் தன்னைத் தாழ்த்துவதற்கு முன்பு
  rationale: காலத்தொடர்பையும், வினையின் இயல்பான தன்வினை அல்லது தன்னடக்கப் பொருளையும் பாதுகாக்கிறது.
- source_word: הִנָּם
  choice: இதோ, அவை
  rationale: எபிரெயச் சுட்டிக்காட்டும் இலக்கிய வலிமையை, புரிந்துகொள்ளக்கூடிய உயர்நடையில் காக்கிறது.
- source_word: כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: மூலத்தின் அடிப்படைப் பொருளை நேரடியாகக் காக்கிறது; சூழல் அவை பதிவுகள் என்பதைத் தெளிவாக்குகிறது.
- source_word: דִּבְרֵי חוֹזָי
  choice: தரிசனக்காரர்களின் பதிவுகள்
  rationale: மெய்யெழுத்து மரபில் சாத்தியமான பொதுப்பெயர் வாசிப்பைப் பிரதான உரையில் தருகிறது; ‘ஓசாயின் வார்த்தைகள்’ என்ற பெயர்வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: הִכָּנְעוֹ என்பதில் மனாசேயின் தாழ்மை அல்லது மனந்திரும்புதலின் இயல்பு
  choice: அவன் தன்னைத் தாழ்த்துவதற்கு முன்பு
  alternative: அவன் தாழ்த்தப்படுவதற்கு முன்பு
  rationale: எபிரெய வடிவம் இயல்பாகத் தன்வினை அல்லது எழுவாய் சார்ந்த பொருளை ஆதரிக்கிறது. இது மனாசேயின் செயல்பாட்டைச் சொல்கிறது; ஆனால் இவ்வசனம் கூறுவதைக் கடந்து ஒரு விரிவான மனமாற்றக் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான இலக்கிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஜெபம்,’ ‘வழிபாட்டு மேடைகள்,’ ‘செதுக்கப்பட்ட உருவங்கள்’ போன்ற சொற்கள் தெளிவையும் மூலநெருக்கத்தையும் இணைக்கின்றன. உண்மையான சொல்லியல் தெளிவின்மைகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
