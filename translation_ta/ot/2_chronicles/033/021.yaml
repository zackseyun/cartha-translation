  yaml_path: translation/ot/2_chronicles/033/021.yaml
  text: Amon was twenty-two years old when he became king, and he reigned two years in Jerusalem.
translation:
  language: ta
  text: ஆமோன் அரசனானபோது அவனுக்கு இருபத்திரண்டு வயது. அவன் எருசலேமில் இரண்டு ஆண்டுகள் ஆட்சி செய்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: அவனுக்கு இருபத்திரண்டு வயது
  rationale: எபிரெய மொழியில் உள்ள ‘இருபத்திரண்டு ஆண்டுகளின் மகன்’ என்ற வயதைக் குறிக்கும் மரபுத்தொடரை, இயல்பான நவீனத் தமிழில் ‘அவனுக்கு இருபத்திரண்டு வயது’ என்று வழங்குகிறது.
- source_word: אָמ֣וֹן
  choice: ஆமோன்
  rationale: தனிப்பெயர் அதன் எபிரெய உச்சரிப்பை அணுகும் வகையில் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: ב முன்னிடைச்சொல்லுடன் வரும் מלך வினையின் infinitive construct வடிவம், அவன் அரசாட்சியை ஏற்ற காலத்தைக் குறிக்கிறது; ‘அரசனானபோது’ என்பது தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: וּשְׁתַּיִם שָׁנִים
  choice: இரண்டு ஆண்டுகள்
  rationale: அரசாட்சியின் கால அளவைக் குறிக்கும் எளிய எண்-பெயர்ச்சொல் அமைப்பு.
- source_word: מָלַךְ
  choice: ஆட்சி செய்தான்
  rationale: இச்சூழலில் מלך என்பது ஒரு காலப்பகுதியில் அரசனாக ஆட்சிபுரிந்ததைக் குறிக்கிறது; நவீனத் தமிழில் ‘ஆட்சி செய்தான்’ தெளிவான இயல்பான மொழிபெயர்ப்பு.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடத்தைக் குறிக்கும் ב முன்னிடைச்சொல்லுடன் வந்துள்ள நகரப் பெயரை, தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவில் வழங்குகிறது.
