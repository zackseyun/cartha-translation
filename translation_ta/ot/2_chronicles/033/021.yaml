translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு எளிதில் புரியும் வகையிலும் வரலாற்றுக் குறிப்புக்குரிய கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வசனத்தின் இரண்டு காலத் தகவல்களும் தனித்தனி வாக்கியங்களாகத் தெளிவாக வழங்கப்பட்டுள்ளன.
