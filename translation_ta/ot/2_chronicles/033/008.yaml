base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
translation:
  language: ta
  text: “நான் உங்கள் மூதாதையருக்காக ஏற்படுத்திய நாட்டிலிருந்து இஸ்ரவேலின் காலடியை[a] இனி அகற்றமாட்டேன்; நான் அவர்களுக்குக் கட்டளையிட்ட அனைத்தையும்—மோசேயின் மூலம் கொடுக்கப்பட்ட முழுச் சட்டத்தையும், விதிமுறைகளையும், நீதித்தீர்ப்புகளையும்—அவர்கள் கவனமாகக் கடைப்பிடித்தால் மட்டுமே.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “இஸ்ரவேலின் கால்”; இது அந்த நாட்டில் இஸ்ரவேலின் இருப்பைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
