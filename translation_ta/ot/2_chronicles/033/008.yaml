  choice: நாட்டிலிருந்து
  rationale: உடன்படிக்கைச் சூழலில் אֲדָמָה என்பது வெறும் மண்ணைவிட நாட்டைக் குறிக்கிறது; தமிழில் ‘நாட்டின் மேலிருந்து’ என்பது செயற்கையாக இருப்பதால் இயல்பான வேற்றுமை உருபு பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר הֶעֱמַדְתִּי לַאֲבֹתֵיכֶם
