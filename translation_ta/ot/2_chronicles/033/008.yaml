theological_decisions:
- issue: நாட்டில் இஸ்ரவேலர் நிலைத்திருப்பதற்கான நிபந்தனை
  choice: தொடர்ந்து நாட்டில் இருப்பது கட்டளைகளைக் கவனமாகக் கடைப்பிடிப்பதுடன் உண்மையாக நிபந்தனைப்படுத்தப்பட்டுள்ளது.
  alternative: இது நிபந்தனையற்ற நிரந்தர வாக்குறுதி; அல்லது எந்த உண்மையான சாத்தியக்கூறும் இல்லாத வெறும் வாக்குவன்மை.
  rationale: רַק אִם தெளிவான கட்டுப்படுத்தும் நிபந்தனையை அறிமுகப்படுத்துகிறது. இந்த வசனத்தின் உடன்படிக்கைச் சூழலைத் தாண்டிய கோட்பாட்டு முடிவுகளைச் சேர்க்காமல் அந்த இறையியல் பதற்றம் பாதுகாக்கப்பட்டுள்ளது.
- issue: ‘மோசேயின் கையால்’ என்ற முகமை மொழி
  choice: ‘மோசேயின் மூலம்’ என்று மொழிபெயர்த்து, மோசேயின் இடைமுகப் பங்கைப் பாதுகாத்தல்.
  alternative: ‘மோசேயின் கையால்’ என்று சொல்லுக்குச் சொல் மொழிபெயர்த்தல்.
  rationale: ביד என்பது இங்கு உடல் உறுப்பை மையப்படுத்தாமல் முகமை அல்லது இடைமுகத்தைக் குறிக்கும் மரபுத்தொடர்; மொழிபெயர்ப்பு தெய்வீகக் கட்டளையும் மோசேயின் இடைமுகமும் இரண்டையும் கலக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான வேதாகம நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய உருவகமான ‘இஸ்ரவேலின் காலடி’ தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; சட்டச் சொற்களின் வேறுபாடு ‘திருச்சட்டம், விதிமுறைகள், நீதிநியமங்கள்’ எனப் பாதுகாக்கப்பட்டுள்ளது. நிபந்தனை இயல்பாகத் தெளிவதற்காகத் தமிழில் கடைசி இடத்தில் வைக்கப்பட்டுள்ளது.
