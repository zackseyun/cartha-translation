revisions:
- from: “நான் உங்கள் மூதாதையருக்காக நிலைநிறுத்திய நாட்டிலிருந்து இஸ்ரவேலின் காலடியை[a] இனி அகற்றமாட்டேன். ஆனால், மோசேயின் மூலம்[b] கொடுக்கப்பட்ட முழுத் திருச்சட்டத்தையும் விதிமுறைகளையும் நீதிநியமங்களையும், அதாவது நான் அவர்களுக்குக் கட்டளையிட்ட அனைத்தையும், அவர்கள் கவனமாகக் கடைப்பிடித்தால் மட்டுமே இது நடக்கும்.”
  to: “நான் உங்கள் மூதாதையருக்காக ஏற்படுத்திய நாட்டிலிருந்து இஸ்ரவேலின் காலடியை[a] இனி அகற்றமாட்டேன்; நான் அவர்களுக்குக் கட்டளையிட்ட அனைத்தையும்—மோசேயின் மூலம் கொடுக்கப்பட்ட முழுச் சட்டத்தையும், விதிமுறைகளையும், நீதித்தீர்ப்புகளையும்—அவர்கள் கவனமாகக் கடைப்பிடித்தால் மட்டுமே.”
  rationale: The revision renders the restrictive conditional directly, without an adversative conjunction or an added result clause. It also presents the law, statutes, and judgments as an explanation of all that God commanded, while retaining the Hebrew image, the three legal terms, and Mosaic mediation. Footnote b is retained as part of the complete footnote set for the idiom, although the verse text has no separate b anchor; to avoid an unanchored footnote, it should be anchored after ‘மூலம்’ if the publication format requires every note marker to appear in the text.
