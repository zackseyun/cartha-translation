  choice: இனி அகற்றமாட்டேன்
  rationale: மறுபடியும் அல்லது தொடர்ந்து அகற்றுவதில்லை என்ற எதிர்கால மறுப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
