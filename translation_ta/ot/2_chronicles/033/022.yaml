  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֣ה אָבִ֑י/ו וּֽ/לְ/כָל הַ/פְּסִילִ֗ים אֲשֶׁ֤ר עָשָׂה֙ מְנַשֶּׁ֣ה אָבִ֔י/ו זִבַּ֥ח אָמ֖וֹן וַ/יַּֽעַבְדֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
translation:
  language: ta
  text: அவன் தன் தந்தை மனாசே செய்ததுபோலவே, யாவேயின் பார்வையில் தீமையானதைச் செய்தான். தன் தந்தை மனாசே செய்திருந்த செதுக்கப்பட்ட உருவங்கள்[a] அனைத்துக்கும் ஆமோன் பலியிட்டு, அவற்றுக்குப் பணிவிடை செய்தான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விக்கிரகங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் குறிப்பாகச் செதுக்கப்பட்ட அல்லது வெட்டியமைக்கப்பட்ட உருவங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவற்றை வழிபட்டான்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினையின் நேரடிப் பொருள் ‘அவற்றுக்குச் சேவை செய்தான்’; இச்சூழலில் அது சமய வழிபாட்டுப் பணியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: தீமையானதைச் செய்தான்
  rationale: ‘தீமையைச் செய்தான்’ என்பதும் சாத்தியம்; இத்தேர்வு எபிரெயச் சொற்றொடரின் மதிப்பீட்டுத் தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּעֵינֵי יְהוָה
  choice: யாவேயின் பார்வையில்
  rationale: இது கடவுளுடைய மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘பார்வையில்’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பெயரொலியைத் தமிழில் தருகிறது.
- source_word: כַּאֲשֶׁר עָשָׂה מְנַשֶּׁה אָבִיו
  choice: தன் தந்தை மனாசே செய்ததுபோலவே
  rationale: ஆமோன் தன் தந்தையின் நடத்தையைப் பின்பற்றிய ஒப்பீட்டை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: הַפְּסִילִים
  choice: செதுக்கப்பட்ட உருவங்கள்
  rationale: பொதுவான ‘சிலைகள்’ அல்லது ‘விக்கிரகங்கள்’ என்பதைவிட, செதுக்கி உருவாக்கப்பட்ட படிமங்கள் என்ற எபிரெயச் சொல்லின் குறிப்பான பொருளைப் பாதுகாக்கிறது.
- source_word: זִבַּח
  choice: பலியிட்டு
  rationale: வழிபாட்டுச் சூழலில் பலி செலுத்துவதைக் குறிக்கும் வினையைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: וַיַּעַבְדֵם
  choice: அவற்றுக்குப் பணிவிடை செய்தான்
  rationale: עבד என்பதன் அடிப்படைப் பொருளான ‘சேவை செய்தல்’ என்பதைக் காக்கிறது; இச்சூழலில் அதன் வழிபாட்டுப் பொருள் தெளிவாக உள்ளது.
- source_word: אָמֹון
  choice: ஆமோன்
  rationale: தனிநபர் பெயரின் எபிரெய உச்சரிப்பை வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்லாமல் தனிப்பட்ட தெய்வீகப் பெயர் இருப்பதால், அதை ஒலிபெயர்த்து அதன் பெயர்த்தன்மையைப் பாதுகாக்கிறது.
- issue: சிலைவழிபாட்டுச் சூழலில் עבד என்பதன் பொருள்
  choice: அவற்றுக்குப் பணிவிடை செய்தான்
  alternative: அவற்றை வழிபட்டான்
  rationale: ‘வழிபட்டான்’ என்பது சூழலின் பொருளைத் தெளிவுபடுத்தினாலும், ‘பணிவிடை செய்தான்’ என்பது மூல வினையின் விரிந்த ‘சேவை’ பொருளையும் அதன் சமயச் சார்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘செதுக்கப்பட்ட உருவங்கள்’ மற்றும் ‘பணிவிடை செய்தான்’ ஆகியவை மூலத்தின் குறிப்பான சொற்பொருளைப் பாதுகாக்கின்றன; மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
