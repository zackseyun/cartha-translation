base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: ta
  text: அவன் தான் செய்த செதுக்கப்பட்ட உருவத்தை[a]—அந்த விக்கிரகத்தை—தேவனுடைய ஆலயத்தில் வைத்தான். அந்த ஆலயத்தைக் குறித்து தேவன் தாவீதிடமும் அவன் மகன் சாலொமோனிடமும், “இந்த ஆலயத்திலும் எருசலேமிலும், இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் நான் தேர்ந்தெடுத்த இடத்தில், என் பெயரை என்றென்றும் வைப்பேன்” என்று சொல்லியிருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விக்கிரகத்தின் செதுக்கப்பட்ட உருவத்தை”; எபிரெய மொழியில் விக்கிரக உருவத்தைக் குறிக்கும் நெருங்கிய பொருளுடைய இரண்டு சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: வைத்தான்
  rationale: שׂים என்ற பொதுவான வினையின் நிகழ்வுரைக் கடந்தகாலத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: פֶּסֶל הַסֶּמֶל
  choice: செதுக்கப்பட்ட உருவத்தை—அந்தச் சிலையை—
  rationale: நெருங்கிய பொருளுடைய இரண்டு எபிரெயச் சொற்களையும் ஒன்றாகச் சுருக்காமல் வெளிப்படுத்துகிறது; முதலாவது செதுக்கப்பட்ட உருவத்தையும் இரண்டாவது வழிபாட்டுக்குரிய சிலையையும் சுட்டுகிறது.
- source_word: אֲשֶׁר עָשָׂה
  choice: தான் செய்த
  rationale: சிலையை அவனே உருவாக்கினான் என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: தேவனுடைய ஆலயத்தில்
  rationale: בַּיִת என்பதன் நேரடிப் பொருள் ‘வீடு’ என்றாலும், இச்சூழலில் தமிழில் ‘ஆலயம்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; அது தேவனுக்குரிய கட்டடத்தைக் குறிக்கிறது.
- source_word: אֲשֶׁר אָמַר אֱלֹהִים
  choice: அந்த ஆலயத்தைக் குறித்து தேவன் ... சொல்லியிருந்தார்
  rationale: தொடர்ந்து வரும் இறைவாக்கு தேவனுடைய ஆலயத்தைப் பற்றியது என்ற தொடர்பைப் பேணுகிறது; முன்பு சொல்லப்பட்டதைத் தமிழின் நிறைவுற்ற கடந்தகால வடிவில் காட்டுகிறது.
- source_word: אֶל דָּוִיד וְאֶל שְׁלֹמֹה בְנוֹ
  choice: தாவீதிடமும் அவன் மகன் சாலொமோனிடமும்
  rationale: இருவரையும் தனித்தனியாகக் குறிப்பதோடு, சாலொமோன் தாவீதின் மகன் என்பதையும் காக்கிறது.
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלִַם
  choice: எருசலேமிலும் இந்த ஆலயத்திலும்
  rationale: ஆலயமும் நகரமும் ஆகிய இரு இடங்களையும் தெளிவாகக் காக்கிறது; தமிழில் தேர்வு குறித்த உட்பிரிவை எருசலேமோடு இயல்பாக இணைக்க இந்த வரிசை பயன்படுத்தப்பட்டது.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் நான் தேர்ந்தெடுத்த
  rationale: מן என்பதன் தேர்வுச் சார்ந்த பொருளையும், தேவனுடைய தேர்வின் தொடரும் விளைவையும் பாதுகாக்கிறது.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: என் பெயரை ... வைப்பேன்
  rationale: தேவன் தமது பெயரை வைப்பார் என்ற உடன்படிக்கைச் சொல்லாட்சியை விளக்கவுரையாக மாற்றாமல் நேரடியாகப் பேணுகிறது.
- source_word: לְעֵילֹום
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தைக் குறிக்கும் לעולם என்பதற்கான இயல்பான, மரியாதைமிக்க தமிழ் இணை.
theological_decisions:
- issue: இறைபெயர்/பட்டப்பெயர் பயன்பாடு
  choice: தேவன்
  alternative: கர்த்தர்
  rationale: மூலத்தில் יהוה அல்ல, אֱלֹהִים உள்ளது; ஆகவே உடன்படிக்கைப் பெயரை இங்கே புகுத்தாமல் ‘தேவன்’ என்று மொழிபெயர்க்கப்பட்டது.
- issue: ஆலய இறையியலின் ‘பெயரை வைத்தல்’ என்ற சொல்லாட்சி
  choice: என் பெயரை என்றென்றும் வைப்பேன்
  alternative: என் பெயரை என்றென்றும் நிலைநிறுத்துவேன் / என் பெயர் என்றென்றும் தங்கும்படி செய்வேன்
  rationale: தேவன் தமது பெயரைத் தேர்ந்தெடுத்த ஆலயத்திலும் நகரத்திலும் ‘வைப்பார்’ என்ற மூல உருவகத்தை அதன் இறையியல் பொருளை விரித்துரைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதைமிக்க நடையில் வடிவமைக்கப்பட்டது. ‘ஆலயம்’, ‘கோத்திரம்’, ‘என்றென்றும்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; பழமையான வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன.
