source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מְנַשֶּׁ֥ה וְ/אֶל עַמּ֖/וֹ וְ/לֹ֥א הִקְשִֽׁיבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/010.yaml
  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
translation:
  language: ta
  text: யாவே மனாசேயிடமும் அவனுடைய மக்களிடமும் பேசினார்; ஆனால் அவர்கள் செவிகொடுக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செவிசாய்க்கவில்லை” அல்லது “கவனம் செலுத்தவில்லை.” எபிரேய வினைச்சொல், பதிலளிப்பதை உள்ளடக்கக்கூடிய கவனமான கேட்டலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: பேசினார்
  rationale: பியேல் வடிவிலுள்ள דבר, אֶל என்பதுடன் இங்கு ‘ஒருவரிடம் பேசுதல்’ என்று பொருள்படுகிறது; நவீன தமிழில் ‘பேசினார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயரெழுத்தாக்கமாகத் தருகிறது.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: எபிரேய தனிப்பெயரின் வழக்கமான தமிழ் பெயரெழுத்தாக்கம்.
- source_word: עַמּוֹ
  choice: அவனுடைய மக்கள்
  rationale: עַם என்பது இச்சூழலில் மனாசேயின் ஆட்சிக்குட்பட்ட மக்களைக் குறிக்கிறது; மூன்றாம் ஆண்பால் ஒருமை உரிமை விகுதி ‘அவனுடைய’ என்று தெளிவாகக் காட்டப்படுகிறது.
- source_word: וְלֹא
  choice: ஆனால் ... இல்லை
  rationale: முன்னைய இறைப் பேச்சுக்கும் அதற்கான மறுமொழியின்மைக்கும் இடையிலுள்ள எதிர்மறை முரணை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִקְשִׁיבוּ
  choice: செவிகொடுக்கவில்லை
  rationale: קשב என்பதன் ஹிஃபில் வடிவம் கவனத்துடன் கேட்பதையும் அதற்கேற்ப பதிலளிப்பதையும் சுட்டலாம். ‘செவிகொடுக்கவில்லை’ என்பது வெறுமனே ஒலி கேட்காததைவிட இப்பொருளை நன்றாகத் தருகிறது; ‘கீழ்ப்படியவில்லை’ என்று மிகத் தெளிவுபடுத்துவதையும் தவிர்க்கிறது.
theological_decisions:
- issue: ‘அவர்கள் செவிகொடுக்கவில்லை’ என்பதிலுள்ள பன்மை எழுவாயின் குறிப்பு
  choice: மனாசேயையும் அவனுடைய மக்களையும் ஒன்றாகக் குறிக்கும் வகையில் ‘அவர்கள்’ என்று வைத்தல்
  alternative: பன்மை எழுவாய் மக்களை மட்டும் குறிக்கிறது என்று கொள்ளுதல்
  rationale: எபிரேயத்தில் மனாசேயும் அவனுடைய மக்களும் இரு முகவர்களாகக் குறிப்பிடப்பட்ட பின் பன்மை வினை வருகிறது. இயல்பான வாசிப்பு இரு தரப்பினரையும் உள்ளடக்குகிறது; ‘அவர்கள்’ என்பது தேவையற்ற மேலதிக விளக்கமின்றி அதைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. வாக்கியத்தின் எபிரேய வரிசையும் எதிர்மறைத் திருப்பமும் இயன்றவரை காக்கப்பட்டுள்ளன.
