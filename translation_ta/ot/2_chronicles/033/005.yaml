  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: ta
  text: அவன் யாவேயின் ஆலயத்திலுள்ள இரு முற்றங்களிலும் வானத்தின் சேனை அனைத்திற்கும் பலிபீடங்களைக் கட்டினான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விண்ணுலகச் சேனை அனைத்திற்கும்.” இந்த எபிரெயத் தொடர், விண்மீன்களையோ வானுலக ஆற்றல்களையோ குறிக்கலாம்; இச்சூழலில் அவை விண்மீன் வழிபாட்டில் வணங்கப்பட்டவையாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: அவன் ... கட்டினான்
  rationale: בנה என்பதன் Qal wayyiqtol வடிவம் மனாசேயின் கடந்தகாலச் செயலைத் தொடர்ச்சியான வரலாற்று நடையில் கூறுகிறது; தமிழில் இயல்பான இறந்தகால வினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: מִזְבְּחוֹת
  choice: பலிபீடங்கள்
  rationale: מזבח என்பதன் பன்மை; பலி அல்லது தூபம் செலுத்தும் பீடங்களைக் குறிக்கும் வழக்கமான தமிழ் வேதாகமச் சொல்.
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: வானத்தின் படைகள் அனைத்திற்கும்
  rationale: צבא השמים என்ற எபிரெய மரபுத்தொடரின் உருவகத்தையும் பன்மைத் தொகுதியையும் காக்கிறது; இச்சூழலில் வழிபடப்பட்ட விண்ணுலகத் தொகுதிகளைச் சுட்டுகிறது. לְ என்பது அவற்றின் மரியாதைக்காகப் பீடங்கள் அமைக்கப்பட்டதைக் காட்டுவதால் ‘அனைத்திற்கும்’ என வழங்கப்பட்டது.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: இரண்டு முற்றங்களிலும்
  rationale: குறிப்பாக இரண்டு ஆலய முற்றங்களைக் குறிக்கிறது; ‘இரண்டு’ எண்ணிக்கையை வெளிப்படையாகக் காத்து, இரண்டிலும் நிகழ்ந்ததை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: בית என்பது சொற்பட ‘வீடு’ என்றாலும், இங்கு யாவேயின் வழிபாட்டுக் கட்டிடத்தைக் குறிப்பதால் நவீன தமிழில் தெளிவான ‘ஆலயம்’ தேர்ந்தெடுக்கப்பட்டது; יהוה தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்து இறைப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், உடன்படிக்கைப் பெயரின் தனிப்பெயர்த் தன்மையைத் தக்கவைக்க ‘யாவே’ பயன்படுத்தப்பட்டது.
- issue: צבא השמים என்பதன் அடையாளம்
  choice: வானத்தின் படைகள்
  alternative: விண்மீன்கள் அனைத்தும் / விண்ணுலகப் படை அனைத்தும்
  rationale: இத்தொடர் விண்பொருட்களையோ விண்ணுலக ஆற்றல்களையோ குறிக்கக்கூடியதால், மூலத்தின் பரப்பையும் வழிபாட்டுச் சூழலின் பதற்றத்தையும் காக்கும் நேரடியான மரபுத்தொடர் தேர்ந்தெடுக்கப்பட்டது; குறிப்பிட்ட ஒரே விளக்கமாகச் சுருக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், வேதாகம வரலாற்று நடைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘வானத்தின் படைகள்’ என்ற மரபுத்தொடர் மூலத்தின் உண்மையான பொருள் விரிவைத் தக்கவைக்கிறது; ‘ஆலயம்’ என்பது இச்சூழலில் בית என்பதன் தெளிவான இயல்பான இணை.
