base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/003.yaml
  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
translation:
  language: ta
  text: அவன் தன் தந்தையான எசேக்கியா இடித்துப்போட்டிருந்த வழிபாட்டு மேடுகளை மீண்டும் கட்டினான்[a]. பாகால்களுக்குப் பலிபீடங்களை நிறுவினான்[b]; அசேரா வழிபாட்டுக் கம்பங்களைச் செய்தான்[c]. வானத்தின் படை அனைத்தையும் தாழ்ந்து வணங்கி[d], அவற்றுக்குப் பணிவிடை செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில் சொல்லர்த்தமாக, “திரும்பி வந்து கட்டினான்”; முன்பு அகற்றப்பட்டவற்றை அவன் மறுபடியும் அமைத்தான் என்பதே பொருள்.
    reason: lexical_alternative
  - marker: b
    text: “பாகால்கள்” என்பது எபிரேய உரையிலுள்ள பன்மையைப் பாதுகாக்கிறது; இது பாகாலின் பல்வேறு உள்ளூர் வடிவங்கள் அல்லது உருவங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “அசேராக்கள்.” எபிரேயச் சொல் அசேரா தேவியுடன் தொடர்புடைய வழிபாட்டுக் கம்பங்கள் அல்லது வேறு வழிபாட்டுச் சின்னங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: இங்கு “வானத்தின் படை” என்பது வழிபாட்டுப் பொருள்களாக்கப்பட்ட சூரியன், சந்திரன், நட்சத்திரங்கள் போன்ற விண்பொருட்களைக் குறிக்கிறது; 2 இராஜாக்கள் 21:3-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  choice: மீண்டும் கட்டினான்
  rationale: שוב + בנה ஆகிய இரு வினைச்சொற்களும் முன்பு அகற்றப்பட்டவற்றைத் திரும்பக் கட்டியதை இயல்பாகக் குறிக்கின்றன; தமிழில் ‘மீண்டும் கட்டினான்’ இந்தத் தொடரின் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: הַבָּמוֹת
  choice: வழிபாட்டு மேடுகள்
  rationale: במות என்பது உயரமான இடங்களிலிருந்த அல்லது மேடுபோன்ற அமைப்புகளைக் கொண்ட வழிபாட்டுத் தலங்களைக் குறிக்கும். வெறும் ‘மேடுகள்’ என்பதைக் காட்டிலும் ‘வழிபாட்டு மேடுகள்’ சூழலைத் தெளிவுபடுத்துகிறது.
- source_word: נִתַּץ
  choice: இடித்துப்போட்டிருந்த
  rationale: இந்த வினை கட்டமைப்புகளை உடைத்து வீழ்த்துதல் அல்லது அழித்தல் என்ற வலுவான பொருளைக் கொண்டது.
- source_word: יְחִזְקִיָּהוּ אָבִיו
  choice: தன் தந்தையான எசேக்கியா
  rationale: எபிரேய இணைப்பின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיָּקֶם מִזְבְּחוֹת לַבְּעָלִים
  choice: பாகால்களுக்குப் பலிபீடங்களை நிறுவினான்
  rationale: הקים என்பதன் நிறுவுதல்/எழுப்புதல் என்ற பொருளையும், הבעלים என்பதன் பன்மையையும் பாதுகாக்கிறது.
- source_word: אֲשֵׁרוֹת
  choice: அசேரா வழிபாட்டுக் கம்பங்கள்
  rationale: அசேராவுடன் தொடர்புடைய வழிபாட்டுப் பொருட்களை அணுகத்தக்க தமிழில் குறிக்கிறது; அவற்றின் துல்லிய வடிவம் உறுதியல்ல என்பதால் அடிக்குறிப்பில் மாற்றுப் பொருள் தரப்பட்டுள்ளது.
- source_word: וַיִּשְׁתַּחוּ
  choice: முன்னும் விழுந்து வணங்கி
  rationale: வினையின் உடல்சார்ந்த தாழவிழும் செயலைப் பாதுகாத்து, இச்சூழலில் அது வழிபாட்டுச் செயல் என்பதையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: வானத்தின் படை அனைத்தின் முன்னும்
  rationale: ‘வானத்தின் படை’ என்ற உருவகத்தைப் பாதுகாக்கிறது; இச்சூழலில் அது வழிபடப்பட்ட விண்பொருட்களைக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: וַיַּעֲבֹד אֹתָם
  choice: அவற்றுக்குப் பணிவிடை செய்தான்
  rationale: עבד என்பதன் ‘சேவை செய்தல்’ என்ற தனித்துவத்தைப் பாதுகாத்து, முந்தைய ‘விழுந்து வணங்குதல்’ என்ற வினையுடன் ஒன்றாக்காமல் வைத்திருக்கிறது.
theological_decisions:
- issue: புறமத வழிபாட்டுச் சொற்களைப் பொதுமைப்படுத்தலாமா
  choice: ‘வழிபாட்டு மேடுகள்,’ ‘பாகால்கள்,’ ‘அசேரா வழிபாட்டுக் கம்பங்கள்’ என்ற குறிப்பான சொற்களை வைத்திருத்தல்
  alternative: ‘சிலைகள்’ அல்லது ‘பொய்த் தெய்வங்கள்’ போன்ற பொதுவான சொற்களைப் பயன்படுத்துதல்
  rationale: எபிரேய உரை குறிப்பிட்ட வழிபாட்டு வடிவங்களைப் பட்டியலிடுகிறது. பொதுமைப்படுத்துவது அதன் வரலாற்று மற்றும் சமய விவரங்களை இழக்கச் செய்யும்.
- issue: ‘வானத்தின் படை’ என்பதன் குறிப்பு
  choice: இச்சூழலில் வழிபாட்டுப் பொருள்களாக்கப்பட்ட விண்பொருட்களைக் குறித்தல்
  alternative: தேவதூதர்களைக் குறித்ததாகப் புரிந்துகொள்ளுதல்
  rationale: பாகால்கள் மற்றும் அசேரா பொருட்களுடன் சேர்ந்து கண்டிக்கப்படும் வழிபாட்டுச் சூழல், சூரியன், சந்திரன், நட்சத்திரங்கள் போன்ற விண்பொருட்களையே முதன்மையாகச் சுட்டுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘வழிபாட்டு மேடுகள்’ போன்ற சொற்றொடர்கள் வரலாற்றுச் சமயச் சொல்லின் தனித்தன்மையையும் சாதாரண வாசகருக்கான தெளிவையும் சமநிலைப்படுத்துகின்றன.
