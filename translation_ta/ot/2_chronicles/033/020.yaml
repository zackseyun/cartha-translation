base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
translation:
  language: ta
  text: மனாசே தன் முன்னோர்களோடு நித்திரையடைந்தான்; அவனை அவனுடைய வீட்டில்[a] அடக்கம் செய்தார்கள். அவனுடைய மகனான ஆமோன் அவனுக்குப் பதிலாக அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனுடைய அரண்மனையில்’; எபிரெய மொழியில் ‘அவனுடைய வீட்டில்’ என்றுள்ளது. அரசச் சூழலில் இது அரண்மனை வளாகத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: நித்திரையடைந்தான்
  rationale: மரணத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் ‘உறக்கம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது; வெறுமனே ‘இறந்தான்’ என்று பொருளைத் தட்டையாக்கவில்லை.
- source_word: עִם אֲבֹתָיו
  choice: தன் தந்தையரோடு
  rationale: அரசர்களின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரெயச் சூத்திரத்தை நெருக்கமாகப் பிரதிபலிக்கிறது; இங்கு பன்மை முன்னோர்களையும் குறிக்கிறது.
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவனை ... அடக்கம் செய்தார்கள்
  rationale: மூலத்தில் உள்ள செயப்பாட்டு வடிவத்தையும் பன்மை எழுவாயையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בֵּיתוֹ
  choice: அவனுடைய வீட்டில்
  rationale: בַּיִת என்பதன் முதன்மையான பொருளைத் தக்கவைக்கிறது; அரசச் சூழலில் அது அரண்மனை அல்லது அதன் வளாகத்தைக் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: அரச அதிகாரத்தை ஏற்று ஆட்சி செய்ததைச் சுருக்கமாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரச வாரிசுரிமைச் சூழலில் ‘அவனுடைய இடத்தில்’ என்ற பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
