source:
  edition: WLC
  text: וַ֠/יָּסַר אֶת אֱלֹהֵ֨י הַ/נֵּכָ֤ר וְ/אֶת הַ/סֶּ֨מֶל֙ מִ/בֵּ֣ית יְהוָ֔ה וְ/כָל הַֽ/מִּזְבְּח֗וֹת אֲשֶׁ֥ר בָּנָ֛ה בְּ/הַ֥ר בֵּית יְהוָ֖ה וּ/בִ/ירוּשָׁלִָ֑ם וַ/יַּשְׁלֵ֖ךְ ח֥וּצָ/ה לָ/עִֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
translation:
  language: ta
  text: அவன் அந்நிய தெய்வங்களையும் விக்கிரகத்தையும்[a] யாவேயின் ஆலயத்திலிருந்து அகற்றினான். யாவேயின் ஆலய மலையிலும்[b] எருசலேமிலும் தான் கட்டியிருந்த எல்லாப் பலிபீடங்களையும் அகற்றி, அவற்றை நகருக்கு வெளியே எறிந்துவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வழிபாட்டுச் சிலை.’ எபிரெயச் சொல் ஒரு உருவத்தையோ விக்கிரகத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, ஆலயம் அமைந்திருந்த மலைப்பகுதி; ‘யாவேயின் ஆலயம் இருந்த மலையில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: அகற்றினான்
  rationale: הפעיל வடிவிலுள்ள סוּר இங்கு ஒன்றை அப்புறப்படுத்துதல் அல்லது நீக்குதல் என்னும் பொருளைத் தருகிறது; ‘அகற்றினான்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: அந்நிய தெய்வங்கள்
  rationale: இச்சொற்றொடர் யாவே அல்லாத பிறநாட்டு அல்லது அந்நிய வழிபாட்டுத் தெய்வங்களைக் குறிக்கிறது; ‘அந்நிய தெய்வங்கள்’ மூலத்தின் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: הַסֶּמֶל
  choice: விக்கிரகம்
  rationale: סֶמֶל என்பது வழிபாட்டுக்குரிய உருவம் அல்லது விக்கிரகத்தைக் குறிக்கலாம். இச்சீர்திருத்தச் சூழலில் ‘விக்கிரகம்’ பொருத்தமானது; ‘வழிபாட்டுச் சிலை’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִבֵּית יְהוָה
  choice: யாவேயின் ஆலயத்திலிருந்து
  rationale: בֵּית יְהוָה என்பது சொல்லளவில் ‘யாவேயின் வீடு’ என்றாலும், இங்கு எருசலேம் ஆலயத்தைக் குறிக்கிறது. ‘ஆலயம்’ நவீனத் தமிழில் இயல்பாகவும் சூழலுக்குத் தெளிவாகவும் உள்ளது.
- source_word: וְכָל הַמִּזְבְּחוֹת
  choice: எல்லாப் பலிபீடங்களையும்
  rationale: பன்மையிலுள்ள מִזְבְּחוֹת என்பதற்கு ‘பலிபீடங்கள்’ நேரான, நிலைபெற்ற தமிழ் இணை.
- source_word: אֲשֶׁר בָּנָה
  choice: தான் கட்டியிருந்த
  rationale: பலிபீடங்கள் முன்பே கட்டப்பட்டிருந்ததைத் தமிழ் இறந்தகால நிறைவு வடிவம் இயல்பாக வெளிப்படுத்துகிறது; ‘தான்’ எழுவாயைத் தெளிவுபடுத்துகிறது.
- source_word: בְּהַר בֵּית יְהוָה
  choice: யாவேயின் ஆலய மலையில்
  rationale: הַר என்பதன் அடிப்படை மலை/குன்று என்ற பொருளையும், இங்கு குறிக்கப்படும் ஆலய வளாகத்தின் உயர்ந்த இடத்தையும் ‘ஆலய மலை’ சுருக்கமாகக் காக்கிறது; மாற்று விளக்கம் அடிக்குறிப்பில் உள்ளது.
- source_word: וּבִירוּשָׁלָם
  choice: எருசலேமிலும்
  rationale: இடத்தைக் குறிக்கும் முன்னொட்டையும் இணைப்பையும் தமிழ் ‘-இலும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיַּשְׁלֵךְ
  choice: எறிந்துவிட்டான்
  rationale: שׁלך வலுவாகத் தூக்கி எறிந்து அப்புறப்படுத்துவதைக் குறிக்கிறது. ‘எறிந்துவிட்டான்’ அதன் தீவிரமான அகற்றலைக் காட்டுகிறது.
- source_word: חוּצָה לָעִיר
  choice: நகருக்கு வெளியே
  rationale: திசையைக் குறிக்கும் חוּצָה மற்றும் לָעִיר ஆகியவை நகர எல்லைக்கு வெளியேயுள்ள இடத்தைக் குறிக்கின்றன; இத்தமிழாக்கம் இயல்பானதும் துல்லியமானதும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / கர்த்தர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத்தனிப்பெயர் நேரடியாக வருகிறது. ஆகவே பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: הַסֶּמֶל என்பதன் வழிபாட்டுச் சார்பு
  choice: விக்கிரகம்
  alternative: உருவம் / வழிபாட்டுச் சிலை
  rationale: சொல் ஒரு உருவத்தைக் குறிக்கக்கூடியதாக இருந்தாலும், அந்நிய தெய்வங்களையும் தவறான வழிபாட்டுப் பொருட்களையும் அகற்றும் இச்சூழல் அதன் வழிபாட்டுச் சார்பை வலுப்படுத்துகிறது. இருப்பினும் சொல் தரும் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் தமிழின் இயல்புக்காக இரண்டு வாக்கியங்களாகப் பிரிக்கப்பட்டது. இரண்டாம் வாக்கியத்தில் ‘அகற்றி’ என்பது முதல் வினையின் தொடர்ச்சியை வெளிப்படையாக்குகிறது; ‘அவற்றை’ என்பது முன் குறிப்பிடப்பட்ட அந்நிய தெய்வங்கள், விக்கிரகம், பலிபீடங்கள் ஆகியவற்றை ஒருங்கே சுட்டுகிறது.
