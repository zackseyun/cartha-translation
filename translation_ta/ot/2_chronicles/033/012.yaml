source:
  edition: WLC
  text: וּ/כְ/הָצֵ֣ר ל֔/וֹ חִלָּ֕ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יִּכָּנַ֣ע מְאֹ֔ד מִ/לִּ/פְנֵ֖י אֱלֹהֵ֥י אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/012.yaml
  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
translation:
  language: ta
  text: அவன் துன்பத்தில் இருந்தபோது, தன் கடவுளாகிய யாவேயின் தயவை நாடி,[a] தன் தந்தையரின் கடவுளுக்கு முன்பாகத் தன்னை மிகவும் தாழ்த்தினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் கடவுளாகிய யாவேயிடம் மன்றாடி”; எபிரேய மரபுத்தொடர் சொல்லுக்குச் சொல் “முகத்தை மென்மையாக்கினான்/சாந்தப்படுத்தினான்” என உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “தன் தந்தையரின் கடவுள்”; “தன் முன்னோர்களின் கடவுள்” என்றும் பொருள் வழங்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  choice: அவன் நெருக்கத்தில் இருந்தபோது
  rationale: הצר לוֹ என்பது அவன் துன்புறுத்தப்பட்ட அல்லது நெருக்கப்பட்ட சூழ்நிலையைக் குறிக்கிறது. ‘நெருக்கத்தில்’ என்பது அனுபவித்த இடுக்கணை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: חִלָּה אֶת־פְּנֵי
  choice: தயவை நாடி
  rationale: சொல்லுக்குச் சொல் ‘முகத்தை மென்மையாக்குதல்/சாந்தப்படுத்துதல்’ என்ற எபிரேய மரபுத்தொடர், ஒருவரிடம் மன்றாடி அவருடைய தயவை நாடுதல் என்று பொருள்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புச் சொல்லால் மாற்றாமல், எபிரேய இறைப்பெயரான יהוה-ஐ தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: אֱלֹהָיו
  choice: தன் கடவுளாகிய
  rationale: மூன்றாம் நபர் ஒருமை உடைமைப் பின்னொட்டைத் தெளிவாகக் காட்டி, மனாசேயின் கடவுள் என்ற உறவை வெளிப்படுத்துகிறது.
- source_word: וַיִּכָּנַע
  choice: தன்னைத் தாழ்த்தினான்
  rationale: Niphal வடிவம் இச்சூழலில் தன்னிலைப் பொருளுடன் மனாசேயின் மனத்தாழ்மையான செயலைக் குறிக்கிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: வினையின் அளவை வலுப்படுத்தும் מְאֹד என்பதன் இயல்பான நவீனத் தமிழ் இணை.
- source_word: מִלִּפְנֵי
  choice: முன்பாக
  rationale: சொல்லுருவில் ‘முகத்திற்கு முன்னிருந்து’ என்றாலும், இக்கட்டமைப்பில் ‘முன்பாக/சந்நிதியில்’ என்பதே இயல்பான பொருள்.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: தன் தந்தையரின் கடவுள்
  rationale: אבותיו என்பதிலுள்ள ஆண்பால் மற்றும் உடைமைப் பொருளைத் தக்கவைத்து, உடன்படிக்கை வரலாற்றுச் சொற்றொடரை நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கெழுத்து இறைப்பெயரே உள்ளது; ஆகவே தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒலிபெயர்ப்பது மூலச் சான்றைத் தெளிவாகப் பாதுகாக்கிறது.
- issue: אֱלֹהֵי אֲבֹתָיו என்பதிலுள்ள மூதாதைச் சொல்
  choice: தன் தந்தையரின் கடவுள்
  alternative: தன் முன்னோர்களின் கடவுள்
  rationale: ‘முன்னோர்கள்’ என்பது சாத்தியமான இயல்பாக்கம்; ஆனால் אבותיו இங்கு வெளிப்படையாக ஆண்பால் வடிவில் இருப்பதால் முதன்மை உரை அதைப் பாதுகாக்கிறது.
- issue: וַיִּכָּנַע என்பதன் வினைநிலை
  choice: தன்னைத் தாழ்த்தினான்
  alternative: தாழ்த்தப்பட்டான்; கீழ்ப்படிந்தான்
  rationale: இலக்கண வடிவம் செயப்படுபொருள் அல்லது தன்னிலை நிழலைக் கொண்டிருக்கலாம்; மனந்திரும்புதல் சார்ந்த சூழலில் தன்னிலை வாசிப்பு இயல்பானது, ஆனால் அவன் அனுபவித்த தாழ்த்தப்படுதலின் பின்னணியும் முற்றிலும் நீக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வாசிக்க எளிதானதாயும் மரியாதைமிக்கதாயும் அமைக்கப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் காலச்சூழல், விண்ணப்பம், மிகுந்த மனத்தாழ்மை ஆகியவை தக்கவைக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
