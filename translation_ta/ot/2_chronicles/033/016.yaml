source:
  edition: WLC
  text: ו/יכן אֶת מִזְבַּ֣ח יְהוָ֔ה וַ/יִּזְבַּ֣ח עָלָ֔י/ו זִבְחֵ֥י שְׁלָמִ֖ים וְ/תוֹדָ֑ה וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
translation:
  language: ta
  text: பின்பு அவன் யாவேயின் பலிபீடத்தைச் சீரமைத்து, அதன்மேல் சமாதானப் பலிகளையும்[a] நன்றிப் பலிகளையும்[b] செலுத்தினான். இஸ்ரவேலின் கடவுளாகிய யாவேக்கு ஊழியம் செய்யும்படி யூதாவிடம் கூறினான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை ‘ஐக்கியப் பலிகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘நன்றி’ என்று உள்ளது; பலியிடும் இச்சூழலில் அது நன்றிப் பலிகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/יכן
  choice: சீரமைத்து
  rationale: כון என்பதன் ஹிஃபில் வடிவம் சூழலில் தீட்டுப்படுத்தப்பட்ட பலிபீடத்தை மீண்டும் உரிய நிலையில் அமைத்ததைக் குறிக்கிறது; ‘சீரமைத்து’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִזְבַּח יְהוָה
  choice: யாவேயின் பலிபீடம்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் உடைமைத் தொடர்புடன் வழங்குகிறது; יהוה என்பது ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וַ/יִּזְבַּח עָלָיו
  choice: அதன்மேல் ... செலுத்தினான்
  rationale: זבח என்பது பலி செலுத்துவதைக் குறிக்கிறது; עָלָיו பலிபீடத்தையே சுட்டுவதால் ‘அதன்மேல்’ எனத் தெளிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: זִבְחֵי שְׁלָמִים
  choice: சமாதானப் பலிகள்
  rationale: שְׁלָמִים என்ற வழிபாட்டுப் பலிவகைக்கு தமிழில் புரிந்துகொள்ளத்தக்க நேரடியான இணை; உறவு அல்லது ஐக்கியம் என்ற உட்பொருளை மட்டும் தேர்ந்தெடுத்து மூலத்தின் பரப்பைக் குறுக்கவில்லை.
- source_word: וְ/תוֹדָה
  choice: நன்றிப் பலிகள்
  rationale: תוֹדָה என்பது நன்றி செலுத்துதலையும், இப்பலியிடும் சூழலில் நன்றிப் பலியையும் குறிக்கலாம்; தமிழில் சூழலைத் தெளிவாக்க ‘பலிகள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: וַ/יֹּאמֶר לִיהוּדָה
  choice: யூதாவிடம் கூறினான்
  rationale: மூலத்தில் உள்ள ‘யூதாவிடம் சொன்னான்’ என்ற பொருளை இயல்பாகத் தருகிறது; ‘கட்டளையிட்டான்’ என்று வினையின் வலிமையை மிகைப்படுத்தவில்லை.
- source_word: לַ/עֲבוֹד
  choice: ஊழியம் செய்யும்படி
  rationale: עבד என்பது கடவுளை வழிபடுதல் உட்பட அவருக்குச் சேவை செய்வதைக் குறிக்கும் பரந்த சொல்; ‘ஊழியம் செய்’ அந்தப் பரப்பைத் தக்கவைக்கிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: கூட்டுச் சொல்லமைப்பின் உடைமைத் தொடர்பையும் உடன்படிக்கை அடையாளத்தையும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் காணப்படும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: עבד என்பதன் வழிபாட்டு மற்றும் சேவைப் பொருள்
  choice: ஊழியம் செய்ய
  alternative: வழிபட
  rationale: ‘வழிபட’ என்பது இங்கு சாத்தியமான பொருள் என்றாலும், எபிரெயச் சொல் கொண்டுள்ள கடவுளுக்குச் சேவை செய்யும் பரந்த உடன்படிக்கைப் பொருளை ‘ஊழியம் செய்ய’ பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. பலியியல் சொற்கள் மிகுந்த தொழில்நுட்பத் தன்மை பெறாமல், மூலத்தின் வேறுபாடுகளைத் தக்கவைக்கின்றன. ‘யூதா’ என்பது இங்கு யூதா மக்களைத் தொகுப்பாகக் குறிக்கிறது.
