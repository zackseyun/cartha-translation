id: 2CH.33.23
reference: 2 Chronicles 33:23
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/לֹ֤א נִכְנַע֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה כְּ/הִכָּנַ֖ע מְנַשֶּׁ֣ה אָבִ֑י/ו כִּ֛י ה֥וּא אָמ֖וֹן הִרְבָּ֥ה אַשְׁמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
translation:
  language: ta
  text: ஆனால், அவன் தன் தந்தையான மனாசே யாவேக்கு முன்பாகத் தன்னைத் தாழ்த்திக்கொண்டதுபோல், தன்னைத் தாழ்த்திக்கொள்ளவில்லை[a]. ஏனெனில், ஆமோன் தன் குற்றப்பொறுப்பை அதிகரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்கு முன்பாகத் தன் தந்தையான மனாசே தன்னைத் தாழ்த்திக்கொண்டதுபோல்.”
    reason: எபிரெயச் சொற்றொடரின் அமைப்பின்படி, ‘யாவேக்கு முன்பாக’ என்பது ஆமோனின் தாழ்மைப்படுதலுடன் மட்டும் இணைக்கப்படலாம்; அல்லது மனாசேயின் தாழ்மைப்படுதலுக்கும் பொருந்துமாறு வாசிக்கப்படலாம்.
lexical_decisions:
- source_word: נִכְנַע
  choice: தன்னைத் தாழ்த்திக்கொள்ளவில்லை
  rationale: כנע என்பதன் நிஃபால் வடிவம் இங்கு தன்மீள்சுட்டு பொருளில், கடவுளுக்கு முன் மனத்தாழ்மை கொள்ளாததைச் சுட்டுகிறது; நவீன தமிழில் இது இயல்பாகவும் மனந்திரும்புதல் சார்ந்த சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: מִלִּפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי சார்ந்த எபிரெய மரபுத்தொடர் ஒருவரின் முன்னிலையில் இருப்பதைக் குறிக்கிறது; தேவப்பெயர் יְהוָה ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: כְּהִכָּנַע מְנַשֶּׁה אָבִיו
  choice: தன் தந்தையான மனாசே தன்னைத் தாழ்த்திக்கொண்டதுபோல்
  rationale: כְ உடன் வரும் வினையெச்ச அமைப்பு ஒப்பீட்டை உருவாக்குகிறது. இரு இடங்களிலும் ஒரே தமிழ் வினைத்தொடரைப் பயன்படுத்துவது மூலத்தின் சொல் தொடர்பையும் ஆமோன்–மனாசே முரண்பாட்டையும் காக்கிறது.
- source_word: כִּי
  choice: மாறாக
  rationale: இங்கு כִּי அடுத்த கூற்றை முந்தைய மறுப்புக்கு விளக்கமாகவோ வலுப்படுத்தும் முரண்பாடாகவோ இணைக்கலாம். தமிழில் ‘மாறாக’ ஆமோன் தாழ்மைப்படாததுடன் அவன் குற்றத்தை அதிகரித்ததையும் இயல்பாக இணைக்கிறது.
- source_word: הוּא אָמוֹן
  choice: இந்த ஆமோன்
  rationale: சுட்டுப்பெயரும் இயற்பெயரும் சேர்ந்த வலியுறுத்தலை ‘இந்த ஆமோன்’ என்ற இயல்பான தமிழ் அமைப்பு வெளிப்படுத்துகிறது.
- source_word: הִרְבָּה אַשְׁמָה
  choice: தன் குற்றத்தைப் பெருக்கினான்
  rationale: רבה என்பதன் ஹிஃபில் வடிவம் அதிகரிக்கச் செய்தல் அல்லது பெருக்குதல் என்று பொருள்படும்; אַשְׁמָה இச்சூழலில் பலிக்குரிய காணிக்கை அல்ல, குற்றப்பொறுப்பு. ‘குற்றத்தைப் பெருக்கினான்’ மூலத்தின் தீவிரத்தைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கெழுத்துத் தேவப்பெயரை நேரடியாகக் கொண்டிருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது உடன்படிக்கையின் தனிப்பெயரைப் பாதுகாக்கிறது.
- issue: ஆமோனின் אַשְׁמָה பற்றிய கூற்று
  choice: தன் குற்றத்தைப் பெருக்கினான்
  alternative: குற்றத்தை அதிகரித்தான்
  rationale: இது குற்றநிவாரணப் பலியைக் குறிக்காமல் ஆமோனின் பெருகிய குற்றப்பொறுப்பைச் சுட்டுகிறது; ‘பெருக்கினான்’ மூல வினையின் வலிமையை வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுநிலைத் தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற செறிவும் காக்கப்பட்டுள்ளன. ‘தன்னைத் தாழ்த்திக்கொள்’, ‘குற்றத்தைப் பெருக்கு’ ஆகியவை தெளிவானவையும் மூலத்தின் சொல் வலிமையைத் தக்கவைத்தவையும் ஆகும்.
