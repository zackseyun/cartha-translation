- from: ஆனால், அவன் தன் தந்தையான மனாசே தன்னைத் தாழ்த்திக்கொண்டதுபோல் யாவேக்கு முன்பாகத் தன்னைத் தாழ்த்திக்கொள்ளவில்லை[a]. மாறாக, இந்த ஆமோன் தன் குற்றத்தைப் பெருக்கினான்.
  to: ஆனால், அவன் தன் தந்தையான மனாசே யாவேக்கு முன்பாகத் தன்னைத் தாழ்த்திக்கொண்டதுபோல், தன்னைத் தாழ்த்திக்கொள்ளவில்லை[a]. ஏனெனில், ஆமோன் தன் குற்றப்பொறுப்பை அதிகரித்தான்.
  rationale: மூலத்தின் ஒப்பீட்டையும் தெளிவற்ற சொற்றொடர் இணைப்பையும் அடிக்குறிப்பில் பாதுகாத்தபடி, כִּי-யின் விளக்கத் தொடர்பை ‘ஏனெனில்’ எனத் திருத்தியுள்ளேன். אַשְׁמָה-வின் பலியல்லாத ஒழுக்கக் குற்றப்பொறுப்பு பொருளைத் தெளிவாக்க ‘குற்றப்பொறுப்பை அதிகரித்தான்’ பயன்படுத்தப்பட்டுள்ளது.
