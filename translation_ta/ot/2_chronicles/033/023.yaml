    rationale: אַשְׁמָה என்பது இங்கு ஆமோனின் குற்றப்பொறுப்பு/குற்றநிலையைச் சுட்டுகிறது. ‘குற்றப்பொறுப்பை அதிகரித்தான்’ என்பது பொருளை அதிகத் துல்லியமாக வெளிப்படுத்துகிறது.
