source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֣ל אֵלָ֗י/ו וַ/יֵּעָ֤תֶר ל/וֹ֙ וַ/יִּשְׁמַ֣ע תְּחִנָּת֔/וֹ וַ/יְשִׁיבֵ֥/הוּ יְרוּשָׁלִַ֖ם לְ/מַלְכוּת֑/וֹ וַ/יֵּ֣דַע מְנַשֶּׁ֔ה כִּ֥י יְהוָ֖ה ה֥וּא הָֽ/אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
translation:
  language: ta
  text: அவன் அவரிடம் மன்றாடினான். அவர் அவனுடைய வேண்டுதலுக்கு இணங்கி,[a] அவனுடைய விண்ணப்பத்தைக் கேட்டு, அவனை எருசலேமுக்கு அவனுடைய அரசுரிமைக்குத் திரும்பக் கொண்டுவந்தார்.[b] அப்போது யாவேதான் கடவுள் என்பதை மனாசே அறிந்துகொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் அவனால் மன்றாடப்பட்டார்”; அதாவது, அவனுடைய வேண்டுதலுக்குச் சாதகமாகப் பதிலளித்தார்.
    reason: எபிரெய நிஃபால் வினை, மன்றாட்டை ஏற்றுக்கொண்டு சாதகமாகப் பதிலளித்தார் என்ற பொருளையும் தருகிறது.
  - marker: b
    text: எபிரெயத்தில், “எருசலேமுக்கு, அவனுடைய அரசாட்சிக்கு”; இது அவன் மீண்டும் அரசாளும்படி மீட்கப்பட்டதைக் குறிக்கிறது.
    reason: לְמַלְכוּתוֹ என்பது அவனுடைய அரச ஆட்சி அல்லது அரசுரிமையைக் குறிக்கிறது.
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  choice: அவன் அவரிடம் மன்றாடினான்
  rationale: התפלל என்பதன் அடிப்படைப் பொருள் ‘வேண்டிக்கொள்ளுதல்/மன்றாடுதல்’; சூழலில் மனாசே கடவுளிடம் செய்த தீவிர வேண்டுதலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיֵּעָתֶר לוֹ
  choice: அவர் அவனுடைய வேண்டுதலுக்கு இணங்கி
  rationale: நிஃபால் வடிவம், வேண்டுதலை ஏற்று சாதகமாகப் பதிலளித்ததைக் குறிக்கிறது; வெறும் உணர்ச்சிவசப்படுதலைக் கூறாமல் அந்தச் சாதகமான பதிலைத் தெரிவிக்கிறது.
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  choice: அவனுடைய விண்ணப்பத்தைக் கேட்டு
  rationale: תחנה இரக்கம் அல்லது தயவு கோரும் தீவிர விண்ணப்பத்தைக் குறிக்கிறது; ‘விண்ணப்பம்’ அதன் கனத்த தன்மையைத் தக்கவைக்கிறது.
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלַםִ לְמַלְכוּתוֹ
  choice: அவனை எருசலேமுக்குத் திரும்பக் கொண்டுவந்து அவனுடைய அரசாட்சியை மீண்டும் அளித்தார்
  rationale: ஹிஃபில் שוב ‘திரும்பக் கொண்டுவருதல்’ என்றும் מלכות இங்கு அரசரின் ஆட்சி/அரசுரிமை என்றும் பொருள்படுகின்றன. சொற்சொல்லான ‘அவனுடைய அரசாட்சிக்கு’ என்பதைவிட, மீட்டளிக்கப்பட்ட அரசாட்சியை இயல்பான தமிழில் தெளிவாக்குகிறது.
- source_word: וַיֵּדַע מְנַשֶּׁה
  choice: அப்போது மனாசே அறிந்துகொண்டான்
  rationale: தொடர்ந்து நிகழ்ந்த உணர்தலை ‘அப்போது’ இயல்பாகக் காட்டுகிறது; ידע என்பதன் அறிதல் இங்கு அனுபவத்தின் மூலம் ஏற்பட்ட அங்கீகாரத்தைச் சுட்டுகிறது.
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: யெகோவாவே கடவுள் என்பதை
  rationale: יהוה என்பதைக் ‘யெகோவா’ எனப் பெயர்வடிவில் தருகிறது. הוּא அளிக்கும் வலியுறுத்தலை ‘-வே’ தக்கவைக்கிறது; எபிரெயத்தில் இல்லாத ‘ஒரே’ என்பதைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவில் தருகிறது.
- issue: כִּי יְהוָה הוּא הָאֱלֹהִים என்ற அறிக்கையின் வலிமை
  choice: யெகோவாவே கடவுள்
  alternative: யெகோவா ஒருவரே கடவுள்
  rationale: הוּא தரும் வலியுறுத்தலை ‘-வே’ மூலம் காட்டுகிறது; ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத ‘ஒருவரே’ என்பதைச் சேர்த்து இறையியல் பொருளை மிகுதியாகத் தீர்மானிக்கவில்லை.
- issue: לְמַלְכוּתוֹ என்பதன் குறிப்பு
  choice: அவனுடைய அரசாட்சியை மீண்டும் அளித்தார்
  alternative: அவனுடைய ராஜ்யத்துக்கு அவனைத் திரும்பக் கொண்டுவந்தார்
  rationale: இச்சூழலில் மனாசே எருசலேமுக்கும் தனது அரச ஆட்சிக்கும் மீட்டளிக்கப்பட்டான். ‘அரசாட்சி’ நிலப்பரப்பை மட்டும் அல்லாமல் அரசுரிமை/ஆட்சியையும் உள்ளடக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் வேதாகம உரைக்கேற்ற கண்ணியமும் காக்கப்பட்டுள்ளன. கடவுளைக் குறிக்கும் ஒருமை மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது; செயற்பாடுகளின் எபிரெயத் தொடர் தமிழில் சீரான வாக்கிய ஓட்டத்துடன் தக்கவைக்கப்பட்டுள்ளது.
