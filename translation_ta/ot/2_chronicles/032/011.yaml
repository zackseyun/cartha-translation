  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הֲ/לֹ֤א יְחִזְקִיָּ֨הוּ֙ מַסִּ֣ית אֶתְ/כֶ֔ם לָ/תֵ֣ת אֶתְ/כֶ֔ם לָ/מ֛וּת בְּ/רָעָ֥ב וּ/בְ/צָמָ֖א לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵ֔י/נוּ יַצִּילֵ֕/נוּ מִ/כַּ֖ף מֶ֥לֶךְ אַשּֽׁוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
translation:
  language: ta
  text: எசேக்கியா, ‘நம் கடவுளாகிய யாவே அசீரிய அரசனின் கையிலிருந்து நம்மை விடுவிப்பார்’ என்று சொல்லி, உங்களைப் பசியாலும் தாகத்தாலும் சாகும்படி ஒப்புக்கொடுத்து, உங்களைத் தவறாக வழிநடத்துகிறான்[a] அல்லவா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்களை ஏமாற்றுகிறான்” அல்லது “உங்களைத் தவறான வழியில் தூண்டுகிறான்.” எபிரெய வினை, ஒருவரை வழிதவறச் செய்வதையோ தவறான முறையில் இணங்க வைப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் குற்றச்சாட்டுத் தொனியுள்ள வினாவை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: מַסִּית
  choice: தவறாக வழிநடத்துகிறான்
  rationale: ஒருவரை வழிதவறச் செய்வது அல்லது தவறாக இணங்க வைப்பது என்ற ஹிபில் வினையின் பரந்த பொருளைக் காக்கிறது; ‘ஏமாற்றுகிறான்’ என்பதைவிட நோக்கமுள்ள வஞ்சகத்தை உறுதியாக விதிப்பதில்லை.
- source_word: לָתֵת אֶתְכֶם לָמוּת
  choice: உங்களை ... சாகும்படி ஒப்புக்கொடுத்து
  rationale: மக்களை ஒரு மரண முடிவுக்கு விட்டுக்கொடுப்பதைக் குறிக்கும் எபிரெயச் சொல்லமைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּרָעָב וּבְצָמָא
  choice: பசியாலும் தாகத்தாலும்
  rationale: முற்றுகையால் உண்டாகும் உணவின்மை மற்றும் தண்ணீரின்மையைத் தெளிவாகக் காட்டி, மரணத்திற்கான இரு காரணங்களையும் இணை அமைப்பில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரைப் பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பால் தருகிறது.
- source_word: יַצִּילֵנוּ
  choice: நம்மை விடுவிப்பார்
  rationale: இராணுவ ஆபத்திலிருந்து மீட்பதைக் குறிக்கும் நצל வினையின் பொருளை இச்சூழலில் இயல்பாகத் தருகிறது.
- source_word: מִכַּף
  choice: கையிலிருந்து
  rationale: அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் காக்கிறது.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: எபிரெய இணைப்புத் தொடரைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக இடம்பெறுவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: எசேக்கியாவின் கூற்றைப் பற்றிய பேச்சாளரின் குற்றச்சாட்டு
  choice: மேற்கோளுக்குள் குற்றச்சாட்டாகவே வைத்தல்
  alternative: எசேக்கியா உண்மையிலேயே ஏமாற்றினான் என்று உரையால் உறுதிப்படுத்துதல்
  rationale: இது அசீரியப் பேச்சாளரின் நையாண்டிக் குற்றச்சாட்டு; உரையாளர் அதன் உண்மைத்தன்மையை இவ்வசனத்தில் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பானதும் கண்ணியமானதுமான நடை. குற்றச்சாட்டுத் தொனியும் மூலத்தின் சொற்பொருள் நெகிழ்வும் காக்கப்பட்டுள்ளன.
