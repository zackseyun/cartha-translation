  text: אַחֲרֵ֨י הַ/דְּבָרִ֤ים וְ/הָ/אֱמֶת֙ הָ/אֵ֔לֶּה בָּ֖א סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר וַ/יָּבֹ֣א בִֽ/יהוּדָ֗ה וַ/יִּ֨חַן֙ עַל הֶ/עָרִ֣ים הַ/בְּצֻר֔וֹת וַ/יֹּ֖אמֶר לְ/בִקְעָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
translation:
  language: ta
  text: இந்த நிகழ்ச்சிகளுக்கும் இந்த உண்மைத்தன்மைக்கும்[a] பிறகு, அசீரிய அரசன் சனகெரிப் வந்து யூதாவுக்குள் நுழைந்தான். அவன் கோட்டையிடப்பட்ட நகரங்களுக்கு எதிராக முகாமிட்டு, அவற்றை உடைத்துத் தன்வசப்படுத்த எண்ணினான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இந்த உண்மையுள்ள செயல்களுக்கும்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் “உண்மை” அல்லது “உண்மைத்தன்மை” எனப் பொருள்படும்; இங்கு அது முன்பு கூறப்பட்ட எசேக்கியாவின் உண்மையுள்ள நடத்தையையோ செயல்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவற்றைத் தனக்காக உடைத்துத் திறக்க எண்ணினான்.” இது கோட்டையிடப்பட்ட நகரங்களுக்குள் பலவந்தமாக நுழைந்து அவற்றைத் தன்வசப்படுத்தும் நோக்கத்தைக் குறிக்கும் எபிரெய மொழிநடை.
    reason: idiom_clarification
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים
  choice: இந்த நிகழ்ச்சிகளுக்குப் பிறகு
  rationale: דְּבָרִים என்பது இங்கு முன்பு விவரிக்கப்பட்ட நிகழ்ச்சிகளைக் குறிக்கிறது; இயல்பான நவீன தமிழில் காலத் தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: וְהָאֱמֶת הָאֵלֶּה
  choice: இந்த உண்மையுள்ள செயல்களுக்கும்
  rationale: אֱמֶת என்பதன் அடிப்படைப் பொருள் ‘உண்மை’ அல்லது ‘உண்மைத்தன்மை’; சூழலில் எசேக்கியாவின் முந்தைய உண்மையுள்ள செயல்களைச் சுட்டுவதால், தமிழில் இயல்பாகவும் சூழலோடும் பொருந்துமாறும் இவ்வாறு மொழிபெயர்க்கப்பட்டது. சொற்பொருள் ஐயத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன் சனகெரிப்
  rationale: அரசப் பட்டமும் பெயரும் தமிழின் இயல்பான சொல் வரிசையில் தரப்பட்டுள்ளன.
- source_word: וַיָּבֹא בִיהוּדָה
  choice: வந்து யூதாவுக்குள் நுழைந்தான்
  rationale: בְּ உடன் வரும் இயக்க வினை யூதா நாட்டிற்குள் வந்ததைச் சுட்டுகிறது; ‘நுழைந்தான்’ அந்தத் திசைப் பொருளைத் தெளிவாக்குகிறது.
- source_word: וַיִּחַן עַל הֶעָרִים הַבְּצֻרוֹת
  choice: அரண்சூழ்ந்த நகரங்களுக்கு எதிராக முகாமிட்டு
  rationale: חנה עַל என்பது இலக்கை எதிர்த்து முகாமிடுதலைக் குறிக்கிறது. ‘முற்றுகையிட்டான்’ என்று விளக்கமாக விரிவுபடுத்தாமல் எபிரெயச் சொல்லின் நேரடியான படிமம் காக்கப்பட்டுள்ளது.
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  choice: அவற்றை உடைத்துக் கைப்பற்ற எண்ணினான்
  rationale: בקע என்பது உடைத்தல் அல்லது பிளத்தலைக் குறிக்கிறது; இங்கு அரண்களைத் தகர்த்து நகரங்களைக் கைப்பற்றும் நோக்கம் உள்ளது. אֵלָיו தரும் தனக்கான நோக்கத்தை ‘கைப்பற்ற’ என்ற இயல்பான தமிழ்ச் சொல் வெளிப்படுத்துகிறது; மொழியமைப்பின் தனித்தன்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
