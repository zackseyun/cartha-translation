  to: இந்த நிகழ்ச்சிகளுக்கும் இந்த உண்மைத்தன்மைக்கும்[a] பிறகு, அசீரிய அரசன் சனகெரிப் வந்து யூதாவுக்குள் நுழைந்தான். அவன் கோட்டையிடப்பட்ட நகரங்களுக்கு எதிராக முகாமிட்டு, அவற்றை உடைத்துத் தன்வசப்படுத்த எண்ணினான்.[b]
  rationale: ‘அரண்சூழ்ந்த’ என்பதற்குப் பதிலாக ‘கோட்டையிடப்பட்ட’ என மாற்றி மூலத்தின் ‘fortified’ பொருளைத் துல்லியமாக்கியுள்ளேன். இறுதியில் ‘தன்வசப்படுத்த’ எனத் திருத்தி, நகரங்களின் பாதுகாப்பை உடைத்து அவற்றைச் சனகெரிப்பின் கட்டுப்பாட்டுக்குக் கொண்டுவரும் நோக்கத்தையும் אֵלָיו தரும் தனக்கான கூறையும் வெளிப்படுத்தியுள்ளேன். அடிக்குறிப்பு a-இன் மாற்றுச் சொல்லும் அதற்கேற்பச் சரிசெய்யப்பட்டுள்ளது.
