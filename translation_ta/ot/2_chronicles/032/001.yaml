  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. வரலாற்றுக் கதையாடலுக்கேற்ற தெளிவான வினைத் தொடர்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் சொற்பொருள் ஐயங்களும் இராணுவ மொழிநடையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
