base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/003.yaml
  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
translation:
  language: ta
  text: அவன் தன் அதிகாரிகளோடும் தன் வீரர்களோடும் நகரத்துக்கு வெளியே இருந்த நீரூற்றுகளின் நீரை அடைப்பது குறித்து ஆலோசனை செய்தான்[a]; அவர்கள் அவனுக்கு உதவினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நகரத்துக்கு வெளியே இருந்த நீரூற்றுகளின் நீரை அடைப்பதற்காக அவன் தன் அதிகாரிகளோடும் தன் வீரர்களோடும் ஆலோசனை செய்தான்.”
    reason: לִסְתּוֹם என்ற முடிவிலா வினைவடிவம் ஆலோசனையின் பொருளாகவும் அதன் நோக்கமாகவும் புரிந்துகொள்ளப்படலாம்; இந்த மாற்று நோக்கப் பொருளை வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: ஆலோசனை செய்தான்
  rationale: יעץ என்பதன் நிஃபால் வடிவம் இங்கு மற்றவர்களுடன் ஆலோசிப்பதைக் குறிக்கிறது; இத்தேர்வு இயல்பான நவீனத் தமிழில் கூட்டாகக் கலந்தாலோசித்த உணர்வைப் பாதுகாக்கிறது.
- source_word: שָׂרָיו
  choice: தன் அதிகாரிகளோடும்
  rationale: שַׂר என்பது சூழலுக்கேற்ப ஆட்சியாளர், அதிகாரி, தளபதி அல்லது பிரபு எனப் பொருள்படும். நிர்வாகமும் படைத்துறையும் இணைந்த இச்சூழலில், அரச குடும்பத்தினர் என்ற தேவையற்ற பொருளைத் தவிர்த்து 'அதிகாரிகள்' என்பது பரந்த பொருளை அளிக்கிறது.
- source_word: גִבֹּרָיו
  choice: தன் வீரர்களோடும்
  rationale: גִּבּוֹר என்பது வலிமைமிக்க மனிதரையோ போர்வீரரையோ குறிக்கும். இங்குள்ள படைச் சூழலை இயல்பான தமிழில் 'வீரர்கள்' தெளிவாக எடுத்துரைக்கிறது.
- source_word: לִסְתּוֹם
  choice: அடைத்துவிடுவது குறித்து
  rationale: இந்த வினையெச்ச வடிவம் ஆலோசனையின் நோக்கம் அல்லது பொருளைச் சுட்டுகிறது. 'குறித்து' என்பது தமிழில் ஆலோசனையுடன் இயல்பாக இணைகிறது; 'அடைத்துவிடுவது' நீராதாரங்களை உடல்ரீதியாகத் தடைசெய்வதைத் தெரிவிக்கிறது.
- source_word: מֵימֵי הָעֲיָנוֹת
  choice: நீரூற்றுகளின் தண்ணீரை
  rationale: எபிரெயக் கூட்டுச்சொற்றொடரின் நேரடிப் பொருள் 'நீரூற்றுகளின் நீர்.' சாதாரண நவீனத் தமிழில் சொல் மீளலைத் தவிர்த்து இயல்பாக இருக்க 'நீரூற்றுகளின் தண்ணீர்' பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר מִחוּץ לָעִיר
  choice: நகரத்திற்கு வெளியே இருந்த
  rationale: இச்சார்பு வாக்கியம் நீரூற்றுகள் நகர எல்லைக்கு அப்பால் இருந்ததைத் தெளிவாகக் குறிப்பிடுகிறது.
- source_word: וַיַּעְזְרֻהוּ
  choice: அவர்கள் அவனுக்கு உதவினார்கள்
  rationale: עזר மற்றும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு சேர்ந்து, முன்பு குறிப்பிடப்பட்ட அதிகாரிகளும் வீரர்களும் அவனுக்கு உதவியதைக் குறிக்கின்றன.
