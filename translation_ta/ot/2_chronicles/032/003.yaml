  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் நிர்வாக-படைச் சூழலும், לִסְתּוֹם என்பதிலுள்ள நோக்கம்/ஆலோசனைப் பொருள் என்ற சிறிய தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
