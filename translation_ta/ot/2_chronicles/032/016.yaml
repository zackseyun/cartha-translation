  yaml_path: translation/ot/2_chronicles/032/016.yaml
  text: And his servants spoke further against Yahweh God and against his servant Hezekiah[a].
translation:
  language: ta
  text: மேலும், அவனுடைய சேவகர்கள் யாவே தேவனுக்கு எதிராகவும், அவருடைய சேவகரான எசேக்கியாவுக்கு எதிராகவும் பேசினார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே தேவனைக் குறித்தும், அவருடைய சேவகரான எசேக்கியாவைக் குறித்தும் மேலும் பேசினார்கள்.” எபிரெய முன்னிடைச்சொல் சில வேளைகளில் நடுநிலையாக மொழிபெயர்க்கப்படலாம்; ஆனால் இங்கு சூழல் “எதிராக” என்ற பகைமைப் பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: மேலும்
  rationale: முந்தைய நிகழ்வின் தொடர்ச்சியையும், அதற்கு மேலாக நடந்த பேச்சையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: דִּבְּרוּ
  choice: பேசினார்கள்
  rationale: דבר என்பதன் நேரடியான பொருளை மரியாதையான நவீன தமிழில் தருகிறது.
- source_word: עֲבָדָיו
  choice: அவனுடைய பணியாளர்கள்
  rationale: இங்கு அசீரிய அரசனின் சார்பில் செயல்படும் ஆட்களைக் குறிக்கிறது. ‘அடிமைகள்’ என்பது தேவையற்ற சமூகநிலைப் பொருளை வலுப்படுத்தும்; ‘அதிகாரிகள்’ என்பது எபிரெயச் சொல்லைவிடக் குறுகியது.
- source_word: עַל
  choice: எதிராக
  rationale: சூழல் பழிப்பும் பகைமையும் கொண்ட பேச்சைக் காட்டுவதால், நடுநிலையான ‘குறித்து’ என்பதைக் காட்டிலும் ‘எதிராக’ பொருத்தமானது.
- source_word: יְהוָה הָאֱלֹהִים
  choice: யாவே தேவன்
  rationale: தெய்வீகப் பெயரான יהוה என்பதை ‘யாவே’ என்று ஒலிபெயர்த்து, அதைத் தொடர்ந்து வரும் האלהים என்பதை இயல்பான தமிழில் ‘தேவன்’ என்று தருகிறது.
- source_word: וְעַל
  choice: எதிராகவும்
  rationale: இரண்டாவது இலக்கையும் முதல் இலக்குடன் இணைத்து, எபிரெய இணை அமைப்பையும் பகைமைப் பொருளையும் காக்கிறது.
- source_word: יְחִזְקִיָּהוּ
  choice: எசேக்கியா
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் பெயர் வடிவம்.
- source_word: עַבְדּוֹ
  choice: அவருடைய பணியாளனான
  rationale: எசேக்கியா தேவனுக்குச் சேவை செய்கிறவர் என்ற அரசியல்-இறையியல் உறவை வெளிப்படுத்துகிறது; ‘அடிமை’ என்பது இச்சூழலில் மிக வலுவான சமூகநிலைப் பொருளைச் சேர்க்கும்.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்துத் தெய்வீகப் பெயரே உள்ளது. ஆகவே தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: எசேக்கியாவைக் குறிக்கும் עבד என்பதன் நுணுக்கம்
  choice: பணியாளன்
  alternative: அடிமை; ஊழியன்
  rationale: இது தேவனுக்குக் கீழ்ப்படிந்து சேவை செய்யும் அரசரைச் சுட்டும் உறவுப்பெயர். ‘பணியாளன்’ சமூக அடிமைத்தனத்தைத் தேவையின்றி முன்வைக்காமல் அந்தச் சேவை உறவைப் பாதுகாக்கிறது.
- issue: דבר על என்பதன் உறவுப் பொருள்
  choice: எதிராகப் பேசுதல்
  alternative: குறித்துப் பேசுதல்
  rationale: முன்னும் பின்னும் உள்ள சூழல் இப்பேச்சு பழிப்பும் சவாலும் கொண்டது என்பதைத் தெளிவாக்குகிறது; இருப்பினும் על தனியே சில சூழல்களில் நடுநிலையாக ‘குறித்து’ என்றும் பொருள்படலாம்.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘அவனுடைய’ என்பது அசீரிய அரசனைச் சுட்டுகிறது; தேவனைச் சுட்டும் ‘அவருடைய’ என்பதில் மரியாதை வேறுபாடு இயல்பாகப் பேணப்பட்டுள்ளது.
