  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
translation:
  language: ta
  text: மனிதக் கைகளின் படைப்புகளான[b] பூமியின் மக்களுடைய தெய்வங்களுக்கு எதிராகப் பேசியதுபோல, அவர்கள் எருசலேமின் தேவனுக்கு எதிராகவும்[a] பேசினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எருசலேமின் தேவனை நோக்கியும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய முன்னிடைச்சொல்லின் நேரடிப் பொருள் ‘நோக்கி’; ஆனால் இங்குள்ள சூழல் பகைமையான பேச்சைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில்: ‘மனிதனுடைய கைகளின் செயல்.’ இங்கு ‘மனிதன்’ என்பது மனிதர்களைப் பொதுவாகக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: பேசினார்கள்
  rationale: דבר என்பதன் அடிப்படைப் பொருளான ‘பேசுதல்’ என்பதைக் காக்கிறது; பேச்சின் பகைமைத் தன்மை சூழலாலும் ‘எதிராக’ என்பதாலும் வெளிப்படுகிறது.
- source_word: אֶל
  choice: எதிராக
  rationale: אֶל பொதுவாக ‘நோக்கி/இடம்’ என்று பொருள்பட்டாலும், இங்குள்ள நிந்தனைச் சூழலில் பகைமையான பேச்சை இயல்பான தமிழில் ‘எதிராக’ என்று கூறுவது பொருத்தமானது.
- source_word: אֱלֹהֵי יְרוּשָׁלָם
  choice: எருசலேமின் தேவன்
  rationale: אֱלֹהֵי வடிவில் பன்மைத் தோற்றம் இருந்தாலும், இஸ்ரவேலின் ஒரே தேவனைக் குறிக்கும் இச்சூழலில் ஒருமைப் பொருள் தெளிவாக உள்ளது.
- source_word: כְּעַל
  choice: எதிராகப் பேசியதுபோல
  rationale: ஒப்பீட்டையும் பேச்சின் பகைமைத் தன்மையையும் ஒன்றாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: பூமியின் மக்களுடைய தெய்வங்கள்
  rationale: இங்கு אֱלֹהֵי பன்மைப் பொருளில் உள்ளது; עַמֵּי הָאָרֶץ உலகின் பல மக்களைக் குறிக்கிறது.
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  choice: மனிதக் கைகளின் படைப்புகள்
  rationale: மனிதர்களால் உருவாக்கப்பட்ட தெய்வச் சிலைகளைக் குறிக்கும் எபிரெய மொழிநடையைச் சுருக்கமாகவும் இயல்பாகவும் எடுத்துரைக்கிறது; הָאָדָם இங்கு பாலினத்தைக் குறிப்பதல்ல, மனிதரைப் பொதுவாகக் குறிக்கிறது.
theological_decisions:
- issue: எருசலேமின் தேவனை நோக்கிப் பேசினார்களா அல்லது அவருக்கு எதிராகப் பேசினார்களா
  choice: எதிராகப் பேசினார்கள்
  alternative: தேவனிடம்/தேவனை நோக்கிப் பேசினார்கள்
  rationale: முன்னிடைச்சொல்லை நேரடியாக ‘நோக்கி’ என மொழிபெயர்க்க முடிந்தாலும், உடனடிச் சூழல் நிந்தனையும் இகழ்ச்சியும் நிறைந்த பகைமையான பேச்சைக் காட்டுகிறது. மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: אֱלֹהֵי יְרוּשָׁלָם ஒருமையா பன்மையா
  choice: எருசலேமின் தேவன்
  alternative: எருசலேமின் தெய்வங்கள்
  rationale: אֱלֹהִים என்பதன் வடிவம் பன்மையாக இருந்தாலும், இஸ்ரவேலின் தேவனைக் குறிக்கும்போது அது வழக்கமாக ஒருமைப் பொருள் பெறுகிறது; மனிதக் கைகளின் படைப்புகளான பிற மக்களின் தெய்வங்களுடன் செய்யப்படும் வேறுபாடும் இதை உறுதிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், வேதாகமப் பயன்பாட்டிற்கு ஏற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தேவன்’ ஒரே தேவனுக்காகவும் ‘தெய்வங்கள்’ பிற மக்களின் மனிதனால் செய்யப்பட்ட கடவுள்களுக்காகவும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் ஒப்பீட்டு அமைப்பைத் தெளிவாக்க தமிழில் துணைவாக்கியம் முன்னிறுத்தப்பட்டுள்ளது.
