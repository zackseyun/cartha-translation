  text: When Hezekiah saw that Sennacherib had come and that his purpose was to make war against Jerusalem,[a]
translation:
  language: ta
  text: எசேக்கியா, சனகெரிப் வந்திருப்பதையும், எருசலேமுக்கு எதிராகப் போரிடுவதே அவனுடைய நோக்கம் என்பதையும் கண்டபோது,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டபோது
  rationale: ראה என்ற வினையின் இயல்பான ‘கண்டான்’ என்ற பொருளைப் பேணுகிறது; இச்சூழலில் நிலைமையை உணர்ந்தான் என்ற உட்பொருளையும் தமிழில் அனுமதிக்கிறது.
- source_word: כִּי
  choice: …என்பதையும்
  rationale: எசேக்கியா கண்டறிந்தவற்றின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால், தமிழ் இணை வாக்கிய அமைப்பில் ‘என்பதையும்’ என வழங்கப்பட்டது.
- source_word: בָא
  choice: வந்திருப்பதையும்
  rationale: எசேக்கியா கண்ட தருணத்துக்கு முன்பே சனகெரிப் வந்திருந்த நிலையைத் தமிழ் நிறைவு வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סַנְחֵרִיב
  choice: சனகெரிப்
  rationale: எபிரெய தனிப்பெயரின் ஒலியை நவீனத் தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: וּפָנָיו
  choice: அவனுடைய நோக்கம்
  rationale: சொல்லுக்கு சொல் ‘அவனுடைய முகம்’; இங்கு போரை நோக்கிய உறுதியான எண்ணத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருள் முதன்மை உரையில் இயல்பாக வழங்கப்படுகிறது.
- source_word: לַמִּלְחָמָה
  choice: போரிடுவதே
  rationale: ‘போருக்காக’ என்ற பெயர்ச்சொல் அமைப்பின் செயற்பொருளை இயல்பான தமிழில் காட்டுகிறது; ‘-ஏ’ நோக்கத்தின் உறுதியை உணர்த்துகிறது.
- source_word: עַל
  choice: எதிராக
  rationale: போர் சார்ந்த சூழலில் இலக்கை நோக்கிய பகைமைத் திசையைத் தெளிவாகக் குறிக்கிறது.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் இடப்பெயர் வடிவம்.
