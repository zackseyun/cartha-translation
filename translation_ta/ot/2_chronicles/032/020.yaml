  text: וַ/יִּתְפַּלֵּ֞ל יְחִזְקִיָּ֣הוּ הַ/מֶּ֗לֶךְ וִֽ/ישַֽׁעְיָ֧הוּ בֶן אָמ֛וֹץ הַ/נָּבִ֖יא עַל זֹ֑את וַֽ/יִּזְעֲק֖וּ הַ/שָּׁמָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
translation:
  language: ta
  text: அப்போது எசேக்கியா அரசனும் ஆமோத்சின் மகனான ஏசாயா தீர்க்கதரிசியும் இதைக் குறித்து மன்றாடி, விண்ணை[a] நோக்கிக் கூக்குரலிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விண்ணகங்களை நோக்கி.” எபிரெயச் சொல் வடிவத்தில் பன்மையாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: மன்றாடி
  rationale: פלל என்பதன் ஹித்பயேல் வடிவம் பொதுவாக இறைவனிடம் வேண்டுதல் அல்லது மன்றாடுதலைக் குறிக்கிறது. அடுத்துள்ள தீவிரமான கூக்குரலுடன் இயல்பாக இணைவதற்காக வினையெச்சமாக வழங்கப்பட்டது.
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: எசேக்கியா அரசன்
  rationale: பெயரையும் அதனுடன் வரும் அரசப் பட்டத்தையும் மூலத்தின்படி தக்கவைக்கிறது.
- source_word: וִישַׁעְיָהוּ בֶן־אָמוֹץ הַנָּבִיא
  choice: ஆமோத்சின் மகனான ஏசாயா தீர்க்கதரிசி
  rationale: வம்ச அடையாளத்தையும் தீர்க்கதரிசி என்ற வெளிப்படையான பட்டத்தையும் இயல்பான தமிழ்ச் சொற்றொடரில் பாதுகாக்கிறது.
- source_word: עַל־זֹאת
  choice: இதைக் குறித்து
  rationale: மன்றாட்டிற்குரிய விஷயத்தைச் சுட்டும் על־זאת என்பதன் நேரடியான பொருளைத் தருகிறது; காரணப் பொருளாக மட்டும் தீர்மானித்துவிடாமல் மூலத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: וַיִּזְעֲקוּ
  choice: கூக்குரலிட்டார்கள்
  rationale: זעק குறிப்பிடும் நெருக்கடியும் தீவிரமும் கொண்ட அழைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַשָּׁמָיִם
  choice: விண்ணை நோக்கி
  rationale: எபிரெய வடிவம் பன்மையாக இருந்தாலும், இறைவனை நோக்கிய மன்றாட்டின் திசையை நவீன தமிழில் இயல்பாகக் காட்டுகிறது; சொற்படியாகப் பன்மையில் மொழிபெயர்க்கும் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மன்றாட்டின் இலக்காக הַשָּׁמָיִם என்பதைக் கொடுத்தல்
  choice: விண்ணை நோக்கி
  alternative: விண்ணகங்களை நோக்கி
  rationale: இந்தச் சொற்றொடர் மன்றாட்டு மேலுலகை நோக்கியது என்பதைச் சொல்கிறது; விண்ணுலக அமைப்பைப் பற்றிய தனிப்பட்ட கோட்பாட்டை நிறுவுவதில்லை. இயல்பான தமிழைத் தேர்ந்தெடுத்து, எபிரெயப் பன்மை வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. மூலத்தில் முதல் வினை ஒருமையிலும் பின்னைய வினை பன்மையிலும் இருந்தாலும், இரு பெயரிடப்பட்டவர்களும் செயல்களில் பங்கெடுப்பது தமிழில் இயல்பாகப் பன்மை வினையால் வெளிப்படுத்தப்பட்டுள்ளது.
