  text: מִ֠י בְּֽ/כָל אֱלֹהֵ֞י הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר הֶחֱרִ֣ימוּ אֲבוֹתַ֔/י אֲשֶׁ֣ר יָכ֔וֹל לְ/הַצִּ֥יל אֶת עַמּ֖/וֹ מִ/יָּדִ֑/י כִּ֤י יוּכַל֙ אֱלֹ֣הֵי/כֶ֔ם לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
translation:
  language: ta
  text: என் முன்னோர்கள் அழிவுக்கென ஒதுக்கிய[a] இந்த நாடுகளின் எல்லாத் தெய்வங்களிலும், தன் மக்களை என் கையிலிருந்து விடுவிக்க முடிந்தது எந்தத் தெய்வம்? அப்படியிருக்க, உங்கள் கடவுள் உங்களை என் கையிலிருந்து விடுவிக்க முடியுமா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் முன்னோர்கள் முற்றிலும் அழித்த.” எபிரெய வினைச்சொல் ஒன்றை அழிவுக்கென ஒதுக்குவதைக் குறிக்கிறது.
    reason: חרם வினைச்சொல்லின் ‘அழிவுக்கென ஒதுக்குதல்’ என்ற சிறப்புப் பொருளை விளக்கி, இயல்பான குறுகிய மாற்று மொழிபெயர்ப்பையும் தருகிறது.
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  choice: இந்த நாடுகளின் எல்லாத் தெய்வங்களிலும் ... எது?
  rationale: בְּכָל என்பதன் பகுதியைக் குறிக்கும் பொருளை ‘எல்லாத் தெய்வங்களிலும்’ எனவும், மִי தொடங்கும் ஏளனமான வினாவை உயிரற்ற தெய்வங்களைக் குறிக்கும் இயல்பான தமிழில் ‘எது?’ எனவும் வழங்குகிறது.
- source_word: אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  choice: என் முன்னோர்கள் அழிவுக்கென ஒதுக்கிய
  rationale: חרם என்ற வினை சாதாரணமாக அழிப்பதைவிட, முழுமையான அழிவுக்கென ஒதுக்கும் சிறப்புப் பொருளைக் கொண்டது. ‘முன்னோர்கள்’ என்பது இங்கு அரசனுக்கு முன் இருந்தவர்களையும் மூதாதையரையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: אֲשֶׁר יָכוֹל לְהַצִּיל אֶת עַמּוֹ
  choice: தன் மக்களை ... விடுவிக்க முடிந்தது எது?
  rationale: יכולתையை இறந்தகாலச் சூழலில் ‘முடிந்தது’ என்றும், נצל என்பதைக் இராணுவ ஆதிக்கத்திலிருந்து ‘விடுவிக்க’ என்றும் மொழிபெயர்க்கிறது; עַמּוֹவின் ஒருமையை ‘தன் மக்களை’ காக்கிறது.
- source_word: מִיָּדִי
  choice: என் கையிலிருந்து
  rationale: ‘கை’ அதிகாரத்தையும் கட்டுப்பாட்டையும் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כִּי יוּכַל אֱלֹהֵיכֶם
  choice: அப்படியிருக்க, உங்கள் கடவுள் ... முடியுமா?
  rationale: כִּי இங்கு முந்தைய ஒப்பீட்டிலிருந்து வரும் ஏளனமான முடிவை அறிமுகப்படுத்துகிறது. ‘அப்படியிருக்க’ அந்தத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது; வினா வடிவம் பேசுபவனின் நம்பிக்கையின்மையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: חרם என்ற சொல்லின் மொழிபெயர்ப்பு
  choice: அழிவுக்கென ஒதுக்கிய
  alternative: முற்றிலும் அழித்த
  rationale: சாதாரண அழிப்பாக மட்டும் மாற்றாமல், அழிவுக்கென ஒதுக்கும் எபிரெயச் சொல்லின் சிறப்புப் பொருளைப் பாதுகாக்கிறது; அதே நேரத்தில் குறிப்பிட்ட சமய மரபின் விளக்கத்தைச் சேர்க்கவில்லை.
- issue: அந்நிய தெய்வங்களைக் குறிப்பிடுதல்
  choice: தெய்வங்கள்
  alternative: பொய்த் தெய்வங்கள் / சிலைகள்
  rationale: மூல உரை אֱלֹהֵי என்று நேரடியாகக் கூறுவதால், பேசுபவனின் ஏளனத்தில் இல்லாத மதிப்பீட்டை மொழிபெயர்ப்பாளர் சேர்க்காமல் ‘தெய்வங்கள்’ எனவே வழங்கப்படுகிறது.
- issue: אֲשֶׁר הֶחֱרִימוּ என்பதன் தொடர்பு
  choice: அழிவுக்கென ஒதுக்கப்பட்டவை ‘இந்த நாடுகள்’
  alternative: அழிவுக்கென ஒதுக்கப்பட்டவை அந்த நாடுகளின் தெய்வங்கள்
  rationale: எபிரெயத்தில் தொடர்புப்பெயர் இலக்கண ரீதியாக இரண்டுடனும் தொடர்புகொள்ள வாய்ப்பிருந்தாலும், நாடுகளை வென்ற அரசரின் சூழலும் அடுத்த ஒருமை வினாவும் ‘நாடுகள்’ என்பதைக் குறிக்கும் வாசிப்பை வலுப்படுத்துகின்றன. மூலத்தின் சொல் வரிசைக்கு நெருக்கமாக இதை வழங்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, நேரடியான அரச ஏளனத் தொனி பயன்படுத்தப்பட்டுள்ளது. ‘என் கையிலிருந்து’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற சமயத் திருத்தங்களோ விளக்கச் சேர்க்கைகளோ தவிர்க்கப்பட்டுள்ளன.
