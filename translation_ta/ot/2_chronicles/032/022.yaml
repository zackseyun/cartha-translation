  to: இவ்வாறு யாவே, எசேக்கியாவையும் எருசலேமில் குடியிருந்தவர்களையும் அசீரியாவின் அரசன் சனகெரிபின் கையிலிருந்தும் எல்லாருடைய கையிலிருந்தும்[a] காப்பாற்றினார்; அவர்களை எல்லாப் பக்கங்களிலும் வழிநடத்தினார்[b].
  rationale: மூலத்தின் குறைவுரைத்த וּמִיַּד כֹּל-ஐப் பாதுகாக்க, ‘மற்ற’ நீக்கப்பட்டுள்ளது. சாத்தியமான ‘பிற பகைவர்கள்’ என்ற விளக்கம் அடிக்குறிப்பில் மட்டும் வைக்கப்பட்டுள்ளது. அசீரிய நாட்டுப்பெயருடன் பட்டப்பெயரின் தொடர்பை இயல்பாகக் காட்ட ‘அசீரியாவின் அரசன்’ எனச் சீரமைக்கப்பட்டது.
