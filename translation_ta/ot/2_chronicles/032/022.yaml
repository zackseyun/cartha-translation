  issues:
  - severity: medium
    issue: ‘மற்ற அனைவரின் கையிலிருந்தும்’ என்பது வּמִיַּד כֹּל-இல் இல்லாத ‘மற்ற’ என்ற வரையறையைச் சேர்க்கிறது.
    rationale: כֹּל (‘அனைவர்/எல்லாம்’) என்பதன் தொடர்புப்பொருள் மூலத்தில் வெளிப்படையாகக் கூறப்படவில்லை. ‘மற்ற’ என்பது சூழலால் சாத்தியமான விளக்கம் என்றாலும், முதன்மை உரையில் சேர்ப்பதற்குப் பதிலாக அடிக்குறிப்பில் மட்டுமே குறிப்பிடப்பட வேண்டும்.
