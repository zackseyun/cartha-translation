  edition: WLC
  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
translation:
  language: ta
  text: இவ்வாறு யாவே, எசேக்கியாவையும் எருசலேமில் குடியிருந்தவர்களையும் அசீரியாவின் அரசன் சனகெரிபின் கையிலிருந்தும் எல்லாருடைய கையிலிருந்தும்[a] காப்பாற்றினார்; அவர்களை எல்லாப் பக்கங்களிலும் வழிநடத்தினார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அனைவரின் கையிலிருந்தும்.” எபிரெயத்தில் “எல்லார்” என்பதன் தொடர்புப்பொருள் கூறப்படவில்லை; அது பிற பகைவர்களையோ எதிரான அதிகாரங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களைச் சுற்றிலும் நடத்தினார்.” இச்சொற்றொடரைச் சிலர், அவர் அவர்களுக்கு எல்லாப் பக்கங்களிலும் பாதுகாப்பு அல்லது அமைதி அளித்தார் என்ற விரிவான பொருளில் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: காப்பாற்றி
  rationale: ישע என்ற வினை மீட்பு அல்லது ஆபத்திலிருந்து விடுவித்தலைக் குறிக்கிறது. இராணுவ வெற்றியை மட்டும் குறிப்பதாகச் சுருக்காமல், கடவுள் செய்த மீட்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது எபிரெய வேதாகமத்தில் இடம்பெறும் கடவுளின் தனிப்பெயர். அதற்குப் பதிலாக ஒரு பட்டத்தை இடாமல், தமிழில் ஏற்ற ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: எருசலேமில் குடியிருந்தவர்கள்
  rationale: பங்கேற்புவினை வடிவம் எருசலேமில் வசித்த மக்களைக் குறிக்கிறது; இச்சொற்றொடர் தெளிவான நவீனத் தமிழை வழங்குகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து விடுவிக்கப்படுவதை வெளிப்படுத்தும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்கவாறு தக்கவைக்கிறது.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன் சனகெரிப்
  rationale: அரசனின் பெயரும் அவருடைய பட்டமும் இயல்பான தமிழ் சொல் வரிசையில் தரப்பட்டுள்ளன.
- source_word: וּמִיַּד כֹּל
  choice: மற்ற அனைவரின் கையிலிருந்தும்
  rationale: כֹּל என்பதன் தொடர்புப்பொருள் மூலத்தில் கூறப்படவில்லை. சூழலில் சனகெரிபைத் தவிர்த்த பிற பகைவர்களையோ எதிரான அதிகாரங்களையோ குறிக்கலாம்; ‘மற்ற அனைவரின்’ என்பது இதை இயல்பாக வெளிப்படுத்துகிறது, அதேவேளை அடிக்குறிப்பு மூலத்தின் குறைவுரைத்த தன்மையைக் காட்டுகிறது.
- source_word: וַיְנַהֲלֵם
  choice: அவர்களை … வழிநடத்தினார்
  rationale: נהל என்பதன் நேரடியான பொருள் நடத்துதல் அல்லது வழிகாட்டுதல். ‘இளைப்பாறச் செய்தார்’ அல்லது ‘பாதுகாப்பளித்தார்’ என்ற விளக்கப் பொருளை முதன்மை உரையில் திணிக்காமல் சொற்பொருளைத் தக்கவைக்கிறது.
- source_word: מִסָּבִיב
  choice: எல்லாப் பக்கங்களிலும்
  rationale: சுற்றிலும் அல்லது ஒவ்வொரு பக்கத்திலும் என்ற விரிவை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை கடவுளின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஒரு பட்டத்தால் அதை மாற்றாமல் தனிப்பெயராகவே ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: וַיְנַהֲלֵם מִסָּבִיב என்பதன் பொருள்
  choice: அவர்களை எல்லாப் பக்கங்களிலும் வழிநடத்தினார்
  alternative: அவர்களுக்கு எல்லாப் பக்கங்களிலும் பாதுகாப்பு/இளைப்பாறுதல் அளித்தார்
  rationale: נהל என்பதன் முதன்மையான சொற்பொருள் ‘வழிநடத்து’ என்பதாகும். சுற்றிலும் பாதுகாப்பளித்தார் என்ற உட்கருத்து இருக்கக்கூடும்; எனினும் அந்த விளக்கத்தை முதன்மை உரை இறுதியாகத் தீர்மானிக்காமல், அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கையிலிருந்து’ என்ற மூல உருவகமும் ‘வழிநடத்தினார்’ என்ற வினையின் நேரடிப் பொருளும் தக்கவைக்கப்பட்டுள்ளன; எபிரெயத்தில் உள்ள இரண்டு பொருள் தெளிவின்மைகளும் அடிக்குறிப்புகளில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளன.
