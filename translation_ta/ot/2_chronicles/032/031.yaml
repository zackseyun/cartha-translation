  to: அவ்வாறே, நாட்டில் நிகழ்ந்திருந்த அடையாளத்தைப்[a] பற்றி விசாரிப்பதற்காக எசேக்கியாவிடம் அனுப்பப்பட்ட பாபிலோன் தலைவர்களின் தூதர்கள் சம்பந்தமான விவகாரத்திலும், கடவுள் எசேக்கியாவைச் சோதிப்பதற்கும் அவருடைய இதயத்தில் இருந்த அனைத்தையும் அறிந்துகொள்வதற்கும் அவரை விட்டார்.[b]
