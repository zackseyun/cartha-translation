  text: וְ/כֵ֞ן בִּ/מְלִיצֵ֣י שָׂרֵ֣י בָּבֶ֗ל הַֽ/מְשַׁלְּחִ֤ים עָלָי/ו֙ לִ/דְרֹ֗שׁ הַ/מּוֹפֵת֙ אֲשֶׁ֣ר הָיָ֣ה בָ/אָ֔רֶץ עֲזָב֖/וֹ הָֽ/אֱלֹהִ֑ים לְ/נַ֨סּוֹת֔/וֹ לָ/דַ֖עַת כָּל בִּ/לְבָבֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
translation:
  language: ta
  text: அவ்வாறே, நாட்டில் நிகழ்ந்திருந்த அடையாளத்தைப்[a] பற்றி விசாரிப்பதற்காக எசேக்கியாவிடம் அனுப்பப்பட்ட பாபிலோன் தலைவர்களின் தூதர்கள் சம்பந்தமான விவகாரத்திலும், கடவுள் எசேக்கியாவைச் சோதிப்பதற்கும் அவருடைய இதயத்தில் இருந்த அனைத்தையும் அறிந்துகொள்வதற்கும் அவரை விட்டார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “அற்புதத்தை” அல்லது “அருங்குறியை.”
    reason: lexical_alternative
  - marker: b
    text: “அவருடைய இதயத்தில் இருந்த அனைத்தையும் அறிந்துகொள்வதற்கும்” என்ற மூலத்தின் சொல்லாட்சி பாதுகாக்கப்பட்டுள்ளது. இதைச் சிலர், அவருடைய இதயத்தில் இருந்ததை “வெளிப்படுத்துவதற்காக” அல்லது “வெளிச்சத்திற்குக் கொண்டுவருவதற்காக” என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: அவ்வாறே
  rationale: முந்தைய நிகழ்வுடன் இந்தச் சூழ்நிலையையும் இணைக்கும் தொடர் மற்றும் ஒப்புமைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בִּמְלִיצֵי שָׂרֵי בָּבֶל
  choice: பாபிலோன் தலைவர்களின் தூதர்கள் சம்பந்தப்பட்ட விவகாரத்திலும்
  rationale: מְלִיצֵי என்பது இச்சூழலில் இடைத்தரகர்கள் அல்லது தூதர்களைக் குறிக்கிறது; בְּ முன்னொட்டு சூழல் அல்லது விவகாரத்தைக் குறிப்பதால், தமிழில் இவ்வாறு தருவது பொருளைத் தெளிவாக்குகிறது.
- source_word: הַמְשַׁלְּחִים עָלָיו
  choice: தன்னிடம் அனுப்பப்பட்ட
  rationale: எபிரெய வடிவம் செயப்பாட்டு வடிவமல்ல என்றாலும், சூழலில் தூதர்கள் எசேக்கியாவிடம் அனுப்பப்பட்டவர்கள் என்பதே இயல்பான பொருள். ‘தன்னிடம்’ என்பது வாக்கியத்தின் மைய நபரான எசேக்கியாவைச் சுட்டுகிறது.
- source_word: לִדְרֹשׁ
  choice: பற்றி விசாரிப்பதற்காக
  rationale: வெறுமனே கேட்பதைவிட ஆராய்ந்து தகவல் பெறும் தூதரகச் சூழலை இது வெளிப்படுத்துகிறது.
- source_word: הַמּוֹפֵת
  choice: அடையாளம்
  rationale: מוֹפֵת என்பது அடையாளம், அற்புதம் அல்லது அருங்குறி எனப் பொருள்படலாம். ‘அடையாளம்’ அதன் பரந்த அடிப்படைப் பொருளைத் தருகிறது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
- source_word: אֲשֶׁר הָיָה בָאָרֶץ
  choice: நாட்டில் நிகழ்ந்திருந்த
  rationale: היה இங்கு குறிப்பிடத்தக்க நிகழ்வைக் குறிக்கிறது; முன்னர் நிகழ்ந்ததைத் தெரிவிக்க ‘நிகழ்ந்திருந்த’ இயல்பான தமிழ் வடிவமாகும்.
- source_word: עֲזָבוֹ
  choice: அவரை விட்டுவிட்டார்
  rationale: עזב என்பதன் நேரடியான ‘விடுதல்’ என்ற பொருளைப் பாதுகாக்கிறது; ‘முற்றிலும் கைவிட்டார்’ போன்ற வலுவான இறையியல் முடிவைச் சேர்ப்பதில்லை.
- source_word: לְנַסּוֹתוֹ
  choice: அவரைச் சோதித்து
  rationale: נסה என்பதன் மதிப்பீட்டு நோக்குடைய சோதித்தல் என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: לָדַעַת
  choice: அறிந்துகொள்வதற்காக
  rationale: எபிரெய மூலத்தின் நோக்கச் சொல்லை நேரடியாகப் பாதுகாத்து, இறை அறிவைப் பற்றிய உரையின் பதற்றத்தை விளக்கி நீக்காமல் வைத்திருக்கிறது.
- source_word: כָּל בִּלְבָבוֹ
  choice: அவருடைய இதயத்தில் இருந்த அனைத்தையும்
  rationale: இதயம் என்பது எண்ணங்கள், நோக்கங்கள் உள்ளிட்ட உள்ளார்ந்த மனிதனைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் பாதுகாக்கிறது.
theological_decisions:
- issue: இறைவன் சோதித்தலும் அறிந்துகொள்ளுதலும்
  choice: எசேக்கியாவைச் சோதித்து, அவருடைய இதயத்தில் இருந்த அனைத்தையும் அறிந்துகொள்வதற்காக கடவுள் அவரை விட்டுவிட்டார்
  alternative: எசேக்கியாவின் இதயத்தில் இருந்த அனைத்தையும் வெளிப்படுத்துவதற்காகக் கடவுள் அவரைத் தனியே விட்டார்
  rationale: மூல எபிரெயம் ‘சோதிப்பதற்காக’ என்றும் ‘அறிந்துகொள்வதற்காக’ என்றும் கூறுகிறது. இறைவனின் அறிவைப் பற்றிய கேள்வியை மொழிபெயர்ப்பிலேயே தீர்த்துவிடாமல், மூல உரையின் சொற்களையும் இறையியல் பதற்றத்தையும் பிரதான உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியத்தின் தொடர்புகள் தெளிவாக இருக்க ‘எசேக்கியா’ என்ற பெயர் ஒருமுறை வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; இது புதிய தகவலைச் சேர்ப்பதல்ல, சுட்டுப்பெயரின் குறிப்பு நபரைத் தெளிவாக்குவதாகும்.
