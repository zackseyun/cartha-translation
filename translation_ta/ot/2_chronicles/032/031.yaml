  verdict: revise
  source_fidelity: மூலத்தின் முக்கியக் கூறுகள்—பாபிலோன் தலைவர்களின் தூதர்கள், நாட்டில் நிகழ்ந்த அடையாளம், கடவுள் எசேக்கியாவை விட்டது, சோதித்தல், இதயத்தில் உள்ள அனைத்தையும் அறிதல்—பாதுகாக்கப்பட்டுள்ளன. ஆயினும், לְנַסּוֹתוֹ மற்றும் לָדַעַת இரண்டும் நோக்கத்தைச் சுட்டும் இணையான வினையெச்சங்கள்; வரைவு அவற்றில் முதலாவதை ‘சோதித்து’ என மாற்றுவதால், சோதித்தலே அறிதலுக்கான வழிமுறையாகத் தோன்றுகிறது. இரண்டையும் ‘சோதிப்பதற்கும் … அறிந்துகொள்வதற்கும்’ எனத் தர வேண்டும்.
  naturalness: ‘தன்னிடம்’ என்பது வாக்கியத்தின் பிற்பகுதியில் மட்டுமே வெளிப்படும் எசேக்கியாவைச் சுட்டுவதால் தற்குறிப்பும் தெளிவின்மையும் ஏற்படுகிறது. பெயரை முன்கூட்டியே குறிப்பிடுவதும், நீண்ட முன்னுரைப் பகுதியை இயல்பாகச் சீரமைப்பதும் நவீன தரத் தமிழுக்கு ஏற்றது. ‘விட்டுவிட்டார்’ என்பதற்குப் பதில் ‘விட்டார்’ மூலத்தின் அளவான பொருளைத் தருகிறது.
  terminology: ‘அடையாளம்’ என்பது מוֹפֵת என்பதற்குப் பொருத்தமான பரந்த சொல்; மாற்றுச் சொற்களுக்கான அடிக்குறிப்பும் பொருத்தமானது. שָׂרֵי என்பதற்கு ‘தலைவர்கள்’ ஏற்கத்தக்கது. ‘இதயம்’ என்ற உருவகமும் மூலத்தின் உள்ளார்ந்த நோக்கம்/சிந்தனைப் பொருளைச் சுமக்கிறது.
