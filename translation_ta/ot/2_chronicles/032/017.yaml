source:
  edition: WLC
  text: וּ/סְפָרִ֣ים כָּתַ֔ב לְ/חָרֵ֕ף לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/לֵֽ/אמֹ֨ר עָלָ֜י/ו לֵ/אמֹ֗ר כֵּֽ/אלֹהֵ֞י גּוֹיֵ֤ הָ/אֲרָצוֹת֙ אֲשֶׁ֨ר לֹא הִצִּ֤ילוּ עַמָּ/ם֙ מִ/יָּדִ֔/י כֵּ֣ן לֹֽא יַצִּ֞יל אֱלֹהֵ֧י יְחִזְקִיָּ֛הוּ עַמּ֖/וֹ מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
translation:
  language: ta
  text: 'அவன் இஸ்ரவேலின் கடவுளாகிய யாவேயைப் பழித்துரைக்கவும்[a], அவருக்கு எதிராகப் பேசவும் கடிதங்களை எழுதினான். அவற்றில் அவன் இவ்வாறு எழுதினான்: “தேசங்களின் தெய்வங்கள் தங்கள் மக்களை என் கையிலிருந்து விடுவிக்காததுபோல, எசேக்கியாவின் கடவுளும் தம் மக்களை என் கையிலிருந்து விடுவிக்கமாட்டார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிந்திக்க’, ‘அவமதிக்க’ அல்லது ‘சவால் விட’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் இகழ்ந்து பழித்துப் பேசுவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְפָרִים כָּתַב
  choice: கடிதங்களை எழுதினான்
  rationale: סְפָרִים என்பது இச்சூழலில் அனுப்பப்பட்ட எழுத்துச் செய்திகளைக் குறிக்கிறது; எனவே இயல்பான தமிழில் ‘கடிதங்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: לְחָרֵף
  choice: பழித்துரைக்க
  rationale: חרף என்பது இகழ்தல், நிந்தித்தல், அவமதித்தல் ஆகிய பொருள்களைக் கொண்டது. பகைமையான பேச்சையும் கடவுளுக்கு நேர்ந்த அவமதிப்பையும் ‘பழித்துரைக்க’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் தனிப்பட்ட இறைப்பெயரான יהוה நேரடியாக உள்ளது; அதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: எபிரெய இணைநிலை அமைப்பை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: וְלֵאמֹר עָלָיו
  choice: அவருக்கு எதிராகப் பேசவும்
  rationale: இச்சூழலில் עַל நடுநிலையான ‘அவரைக் குறித்து’ என்பதைக் காட்டிலும் எதிரான, பகைமையான பேச்சைக் குறிக்கிறது.
- source_word: כֵּאלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: பல நாடுகளைச் சேர்ந்த மக்களின் தெய்வங்கள் ... போல
  rationale: כֵּ குறிக்கும் ஒப்பீட்டை ‘போல’ தக்கவைக்கிறது; பல நிலப்பகுதிகளின் தேசங்கள் அல்லது மக்கள் என்ற எபிரெய கருத்தை வாசிக்க இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר לֹא הִצִּילוּ עַמָּם
  choice: தங்கள் மக்களை ... விடுவிக்காத
  rationale: Hiphil வடிவிலுள்ள נצל இராணுவ அச்சுறுத்தலிலிருந்து மீட்பதையோ விடுவிப்பதையோ குறிக்கிறது; ‘விடுவிக்க’ அடுத்த கூற்றிலும் திரும்ப வருவதால் மூலத்தின் இணை அமைப்பு காக்கப்படுகிறது.
- source_word: מִיָּדִי
  choice: என் கையிலிருந்து
  rationale: அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் அப்படியே தக்கவைக்கிறது.
- source_word: אֱלֹהֵי יְחִזְקִיָּהוּ
  choice: எசேக்கியாவின் கடவுள்
  rationale: மூலத்தின் உரிமைத் தொடர்பையும் சனகெரிபின் ஏளனமான சொல்லாக்கத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: வசனம் தனிப்பட்ட உடன்படிக்கைப் பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அந்தப் பெயருக்கும் אֱלֹהִים (‘கடவுள்’) என்பதற்கும் உள்ள வேறுபாடு தமிழிலும் தெரியும்படி ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: சனகெரிபின் கூற்றில் யாவே பிற தேசங்களின் தெய்வங்களுக்கு ஒப்பிடப்படுதல்
  choice: ஒப்பீட்டை மூலத்தில் உள்ளபடியே நேரடியாகத் தக்கவைத்தல்
  alternative: இது பொய்யான அல்லது இறைநிந்தனையான ஒப்பீடு என்று மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: இது சனகெரிபின் மேற்கோள் கூற்று; உரை அவனுடைய இறையியல் தவறை இவ்வசனத்துக்குள் விளக்காமல், அவன் கூறிய சவாலைப் பதிவு செய்கிறது. எனவே மொழிபெயர்ப்பு கூடுதல் தீர்ப்பைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கடவுளைக் குறிக்கும் சுட்டுப்பெயர் மற்றும் வினைமுற்றுகளில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. மேற்கோளின் மீளுரைப்பும் ‘என் கையிலிருந்து’ என்ற மூல உருவகமும் தக்கவைக்கப்பட்டுள்ளன.
