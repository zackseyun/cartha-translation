  text: וַ/יִּתְחַזַּ֡ק וַ/יִּבֶן֩ אֶת כָּל הַ/חוֹמָ֨ה הַ/פְּרוּצָ֜ה וַ/יַּ֣עַל עַל הַ/מִּגְדָּל֗וֹת וְ/לַ/ח֨וּצָ/ה֙ הַ/חוֹמָ֣ה אַחֶ֔רֶת וַ/יְחַזֵּ֥ק אֶת הַ/מִּלּ֖וֹא עִ֣יר דָּוִ֑יד וַ/יַּ֥עַשׂ שֶׁ֛לַח לָ/רֹ֖ב וּ/מָגִנִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
translation:
  language: ta
  text: அவன் தன்னைத் திடப்படுத்திக்கொண்டு, சேதமடைந்திருந்த மதில் முழுவதையும் சீரமைத்துக் கட்டி, அதைக் கோபுரங்கள் வரை உயர்த்தினான்[a]. அதற்கு வெளியே வேறொரு மதிலையும் கட்டினான். தாவீதின் நகரத்திலுள்ள மில்லோவை[b] பலப்படுத்தி, ஏராளமான ஆயுதங்களையும்[c] கேடயங்களையும் செய்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்த எபிரெயச் சொற்றொடரை, “அதன்மேல் கோபுரங்களை எழுப்பினான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: textual_ambiguity
  - marker: b
    text: “மில்லோ” என்பது எருசலேமிலிருந்த ஒரு நிரப்பி அமைக்கப்பட்ட மேடை அல்லது அரண் சார்ந்த ஆதார அமைப்பைக் குறித்திருக்கலாம்; அதன் துல்லியமான வடிவம் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
  - marker: c
    text: “ஆயுதங்கள்” என்பதற்கான எபிரெயச் சொல் எறிகணைகள், ஈட்டிகள் அல்லது வேறு எறியப்படும் படைக்கலங்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  choice: தன்னைத் திடப்படுத்திக்கொண்டு
  rationale: חזק என்பதன் Hitpael வடிவிலுள்ள தன்முகச் செயற்பாட்டைப் பாதுகாக்கிறது; எசேக்கியா பாதுகாப்புப் பணிக்காகத் தன்னை உறுதிப்படுத்திக்கொண்டதைக் காட்டுகிறது.
- source_word: וַיִּבֶן ... כָּל הַחוֹמָה הַפְּרוּצָה
  choice: இடிந்திருந்த மதில் முழுவதையும் கட்டியெழுப்பி
  rationale: சேதமடைந்து பிளவுபட்டிருந்த மதிலைச் சீரமைத்துக் கட்டிய செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וַיַּעַל עַל הַמִּגְדָּלוֹת
  choice: அதைக் கோபுரங்கள் வரை உயர்த்தினான்
  rationale: சுருக்கமானதும் பொருள் தெளிவில்லாததுமான எபிரெய சொற்றொடரில், முந்திய மதிலையே மறைபொருளான செயப்படுபொருளாகக் கொண்டு, கோபுரங்களுடன் தொடர்புடைய உயர்த்துதலைக் காட்டுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלַחוּצָה הַחוֹמָה אַחֶרֶת
  choice: அதற்கு வெளியே வேறொரு மதிலையும் கட்டினான்
  rationale: வெளிப்புறத்தில் அமைந்த கூடுதல் மதில் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; சூழலிலிருந்து 'கட்டினான்' நிரப்பப்படுகிறது.
- source_word: וַיְחַזֵּק אֶת הַמִּלּוֹא עִיר דָּוִיד
  choice: தாவீதின் நகரத்திலுள்ள மில்லோவை பலப்படுத்தி
  rationale: מִלּוֹא என்பதன் துல்லிய அடையாளம் விவாதத்திற்குரியதால் வரலாற்றுப் பெயரை ஒலிபெயர்த்து வைத்திருக்கிறது; חזק என்பதன் அரண் வலுப்படுத்தும் பொருளையும் காக்கிறது.
- source_word: שֶׁלַח
  choice: ஆயுதங்கள்
  rationale: குறிப்பிட்ட ஓர் ஆயுத வகையாகக் குறுக்காமல், எறியப்படும் ஆயுதங்கள் உட்பட பலவகை ஆயுதங்களைக் குறிக்கக்கூடிய எபிரெயச் சொல்லின் பரந்த பொருளைப் பாதுகாக்கிறது.
- source_word: לָרֹב
  choice: ஏராளமான
  rationale: மிகுந்த எண்ணிக்கையைச் சொல்லும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தருகிறது.
- source_word: וּמָגִנִּים
  choice: கேடயங்கள்
  rationale: מָגֵן என்பதற்கான பொதுவான, துல்லியமான நவீனத் தமிழ்ச் சொல்.
