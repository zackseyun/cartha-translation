base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
translation:
  language: ta
  text: “எசேக்கியாதானே அவருடைய மேடைகளையும் பலிபீடங்களையும்[a] அகற்றிவிட்டு, யூதாவிடமும் எருசலேமிடமும், ‘ஒரே பலிபீடத்திற்கு முன்பாக நீங்கள் பணிந்து வணங்கி, அதன்மேல் தூபம் காட்ட வேண்டும்’ என்று சொன்னான் அல்லவா?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரே பலிபீடத்தின் முன்பாக நீங்கள் வணங்க வேண்டும்; அதன்மேல் புகையெழச் செய்யும் காணிக்கைகளைச் செலுத்த வேண்டும்.”
    reason: கத்தீர் (קטר) என்பதற்கு ‘தூபம் காட்டுதல்’ என்பதோடு, காணிக்கையைப் புகையெழச் செய்தல் என்ற விரிவான பொருளும் உண்டு; மூலத்தின் சொற்பொருள் வரம்பையும் ஆங்கில audit trail-இன் மாற்றுவாசிப்பையும் காக்கிறது.
lexical_decisions:
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: கடந்தகாலச் சூழலில் கேட்பவர் உடன்படுவார் என எதிர்பார்க்கும் வினாவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הוּא יְחִזְקִיָּהוּ
  choice: எசேக்கியாதானே
  rationale: சுட்டுப்பெயருடன் வரும் பெயரின் அழுத்தத்தைத் தமிழ் வலியுறுத்தும் ‘தானே’ பாதுகாக்கிறது.
- source_word: הֵסִיר
  choice: அகற்றிவிட்டு
  rationale: வழிபாட்டுத் தலங்களையும் பலிபீடங்களையும் நீக்கிய செயலைத் தெளிவாகக் குறிக்கிறது; அதைத் தொடர்ந்து அவர் கூறியதை இயல்பாக இணைக்கிறது.
- source_word: בָּמֹתָיו
  choice: அவருடைய மேடைகள்
  rationale: பாமோத் என்பதற்கான மரபான வழிபாட்டு ‘மேடைகள்’ என்ற சொல்லையும், எபிரெய உரையிலுள்ள உடைமை விகுதியையும் பாதுகாக்கிறது.
- source_word: מִזְבְּחֹתָיו
  choice: அவருடைய பலிபீடங்கள்
  rationale: எபிரெய உடைமை விகுதியை வெளிப்படையாகக் காத்து, அசீரியப் பேச்சாளரின் சர்ச்சைக்குரிய சித்தரிப்பை மாற்றாமல் தருகிறது.
- source_word: וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר
  choice: யூதாவிடமும் எருசலேமிடமும் ... என்று சொன்னான்
  rationale: இரு இடப்பெயர்களையும் அவற்றின் மக்களைக் குறிக்கும் தொகுப்புப் பெயர்களாகக் காத்து, எபிரெய மேற்கோள் அறிமுகத்தை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: לִפְנֵי מִזְבֵּחַ אֶחָד
  choice: ஒரே பலிபீடத்திற்கு முன்பாக
  rationale: ‘முன்பாக’ என்ற இடத்தொடரையும், வழிபாடு ஒரு பலிபீடத்தில் மையப்படுத்தப்பட்டதைக் குறிக்கும் எண் அழுத்தத்தையும் பாதுகாக்கிறது.
- source_word: תִּשְׁתַּחֲווּ
  choice: பணிந்து வணங்கி
  rationale: வினையின் உடல்சார்ந்த பணிதலையும் அதன் வழிபாட்டு நோக்கத்தையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: וְעָלָיו תַּקְטִירוּ
  choice: அதன்மேல் தூபம் காட்ட வேண்டும்
  rationale: קטר என்பதன் இச்சூழலுக்குரிய பொதுவான வழிபாட்டுப் பொருளைத் தெளிவாகத் தருகிறது; ‘அதன்மேல்’ பலிபீடத்தைக் குறிக்கிறது.
theological_decisions:
- issue: ‘மேடைகள்’, ‘பலிபீடங்கள்’ என்பவற்றிலுள்ள உடைமை விகுதிகள்
  choice: ‘அவருடைய மேடைகளையும் பலிபீடங்களையும்’ என்று அசீரியப் பேச்சாளரின் சொற்களை அப்படியே காத்தல்
  alternative: ‘மேடைகளையும் பலிபீடங்களையும்’ என்று உடைமையைக் குறிப்பிடாமல் மொழிபெயர்த்தல்
  rationale: எபிரெய உரையில் உடைமை விகுதிகள் வெளிப்படையாக உள்ளன. அவை பேச்சாளரின் வாதத்தையும் தவறான அல்லது சர்ச்சைக்குரிய இறையியல் சித்தரிப்பையும் பிரதிபலிக்கின்றன; மொழிபெயர்ப்பு அதைச் சரிசெய்யக் கூடாது.
- issue: ஒரே பலிபீடத்தில் வழிபாட்டை மையப்படுத்துதல்
  choice: எசேக்கியாவின் சீர்திருத்தத்தை விளக்காமல் ‘ஒரே பலிபீடம்’ என்ற குற்றச்சாட்டை மட்டும் தருதல்
  alternative: ‘ஆலயத்தின் பலிபீடத்தில் மட்டுமே’ என்று விளக்கிப் பொருள் கூறுதல்
  rationale: இவ்வசனம் உரையாசிரியரின் இறையியல் விளக்கம் அல்ல; அசீரியப் பேச்சாளரின் குற்றச்சாட்டு. எனவே விரிந்த வேதாகமச் சூழலின் மதிப்பீட்டை இங்கே மொழிபெயர்ப்புக்குள் சேர்க்காமல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ்; வாசிப்புக்கு இயல்பானதாயும் வேதாகம உரைக்கு ஏற்ற கண்ணியமுடையதாயும் அமைக்கப்பட்டது. ‘எசேக்கியாதானே’ வலியுறுத்தலைக் காக்கிறது. ‘பணிந்து வணங்கி’ என்பது உடல் பணிதலும் வழிபாடும் ஆகிய இரு கூறுகளையும் சுமக்கிறது.
