translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. நீண்ட எபிரெய வாக்கியம் தெளிவுக்காக மூன்று தமிழ் வாக்கியங்களாகப் பிரிக்கப்பட்டுள்ளது. ‘லாகீசுக்கு எதிராக’ மற்றும் ‘ஆட்சியின் முழு வல்லமை’ என்பவற்றின் உண்மையான பொருள் நெகிழ்வு அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளது.
