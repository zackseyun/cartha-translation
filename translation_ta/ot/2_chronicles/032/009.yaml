base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
translation:
  language: ta
  text: 'இதற்குப் பிறகு, அசீரிய அரசனான சனகெரிப் தன் பணியாளர்களை எருசலேமுக்கு அனுப்பினான். அப்போது அவன் லாகீசுக்கு எதிராக[a], தன் முழு அரச வல்லமையோடும்[b] இருந்தான். யூதாவின் அரசனான எசேக்கியாவுக்கும் எருசலேமில் இருந்த யூதா மக்கள் அனைவருக்கும் எதிராக இவ்வாறு கூறும்படி அவர்களை அனுப்பினான்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லாகீசைத் தாக்கிக்கொண்டிருந்தபோது” அல்லது “லாகீசை முற்றுகையிட்டிருந்தபோது.” எபிரெயில் சொல்லுக்குச் சொல் “லாகீசின்மேல்/லாகீசுக்கு எதிராக” என்று உள்ளது; இது போர்ச் சூழலில் பயன்படுத்தப்படும் சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தன் முழு அரசாட்சியோடும்” அல்லது “தன் படைகள் அனைத்தோடும்.” எபிரெயச் சொல் அவனுடைய அரசாட்சி அல்லது ஆட்சிப் பரப்பைக் குறிக்கலாம்; இச்சூழலில் அவன் கட்டுப்பாட்டிலிருந்த முழு படை வல்லமையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר זֶה
  choice: இதற்குப் பிறகு
  rationale: நிகழ்வுகளின் தொடர்ச்சியைக் காட்டும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: שָׁלַח
  choice: அனுப்பினான்
  rationale: எபிரெய வினையின் அடிப்படைப் பொருளை நேரடியாக வழங்குகிறது.
- source_word: עֲבָדָיו
  choice: தன் பணியாளர்களை
  rationale: அரசனின் சேவகர்கள் அல்லது அலுவலர்கள் என்ற இரு சாத்தியங்களையும் அளவுக்கு மீறித் துல்லியப்படுத்தாமல் காட்டுகிறது.
- source_word: יְרוּשָׁלַיְמָה
  choice: எருசலேமுக்கு
  rationale: இடத்தை நோக்கிய இயக்கத்தைக் குறிக்கும் திசை விகுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהוּא עַל לָכִישׁ
  choice: அவன் லாகீசுக்கு எதிராக இருந்தான்
  rationale: עַל என்பதன் போர்ச் சூழலிலான பகைமை நிலையைப் பாதுகாக்கிறது; முற்றுகையிட்டான் என்று கூடுதலாகத் தீர்மானிக்கவில்லை.
- source_word: וְכָל מֶמְשַׁלְתּוֹ עִמּוֹ
  choice: தன் ஆட்சியின் முழு வல்லமையோடும்
  rationale: מֶמְשָׁלָה என்பதன் ஆட்சி/அதிகாரம் என்ற மையப் பொருளையும், இச்சூழலில் அவனுடன் இருந்த பேரரசின் முழு ஆற்றல் என்ற கருத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: עַל יְחִזְקִיָּהוּ ... וְעַל כָּל יְהוּדָה
  choice: எசேக்கியாவுக்கும் ... யூதா மக்கள் அனைவருக்கும் எதிராக
  rationale: திரும்ப வரும் עַל என்பதன் பகைமை சார்ந்த திசையைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֲשֶׁר בִּירוּשָׁלִַם
  choice: எருசலேமில் இருந்த
  rationale: ‘யூதா’ என்பது இங்கு எருசலேமில் இருந்த மக்களைக் குறிக்கிறது என்பதை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: לֵאמֹר
  choice: 'சொல்லியனுப்பியது:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிக் கூற்றை அறிமுகப்படுத்தும் எபிரெய வடிவத்தைத் தமிழில் இயல்பாக இணைக்கிறது.
