source:
  edition: WLC
  text: וְ/עָרִים֙ עָ֣שָׂה ל֔/וֹ וּ/מִקְנֵה צֹ֥אן וּ/בָקָ֖ר לָ/רֹ֑ב כִּ֤י נָֽתַן ל/וֹ֙ אֱלֹהִ֔ים רְכ֖וּשׁ רַ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/029.yaml
  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
translation:
  language: ta
  text: அவர் தனக்காக நகரங்களையும் அமைத்தார்; ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும் அவருக்கு ஏராளமாக இருந்தன. ஏனெனில் கடவுள் அவருக்கு மிகப் பெரும் செல்வத்தை[a] கொடுத்திருந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “செல்வம்” என்பதற்கு “சொத்துகள்” அல்லது “உடைமைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרִים עָשָׂה לוֹ
  choice: அவர் தனக்காக நகரங்களையும் அமைத்தார்
  rationale: עָרִים என்பது நகரங்கள் அல்லது ஊர்களைக் குறிக்கிறது. עָשָׂה לוֹ என்ற சொற்றொடர் எசேக்கியாவின் நலனுக்காக அல்லது அவருக்குச் சொந்தமாக அவை அமைக்கப்பட்டன என்பதைக் காட்டுகிறது; தமிழில் இயல்பாகவும் நேரடியாகவும் இருக்க “தனக்காக ... அமைத்தார்” என மொழிபெயர்க்கப்பட்டது.
- source_word: וּמִקְנֵה צֹאן וּבָקָר
  choice: ஆட்டு மந்தைகளும் மாட்டு மந்தைகளும் அவருக்கு ... இருந்தன
  rationale: מִקְנֶה என்பது கால்நடை உடைமையைக் குறிக்கிறது; צֹאן சிறு கால்நடைகளையும், குறிப்பாக ஆடு-வெள்ளாடுகளையும், בָּקָר மாடுகளையும் குறிக்கிறது. இரு வகைகளுக்குமுள்ள வேறுபாட்டைத் தெளிவாகப் பேண “ஆட்டு மந்தைகள்” மற்றும் “மாட்டு மந்தைகள்” என வழங்கப்பட்டது.
- source_word: לָרֹב
  choice: ஏராளமாக
  rationale: இந்தச் சொல் மிகுந்த எண்ணிக்கை அல்லது பெருக்கத்தைக் குறிக்கிறது. கால்நடை மந்தைகளின் பெருக்கத்தை இயல்பான தமிழில் “ஏராளமாக” தெரிவிக்கிறது.
- source_word: כִּי נָתַן לוֹ אֱלֹהִים
  choice: ஏனெனில் கடவுள் அவருக்கு ... கொடுத்திருந்தார்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது. எசேக்கியாவின் வளத்திற்குக் கடவுளே காரணம் என்று எபிரெய உரை கூறுவதை இவ்வாக்கியம் நேரடியாகப் பேணுகிறது; விளக்கச் சூழலுக்கு ஏற்றவாறு நிறைவுற்ற செயல் “கொடுத்திருந்தார்” என வழங்கப்பட்டது.
- source_word: רְכוּשׁ רַב מְאֹד
  choice: மிகப் பெரும் செல்வம்
  rationale: רְכוּשׁ என்பது பொருட்சார்ந்த சொத்துகள் அல்லது உடைமைகளைக் குறிக்கிறது; இச்சூழலில் “செல்வம்” இயல்பான விரிவுப் பொருளைக் கொடுக்கிறது. רַב מְאֹד கூறும் வலியுறுத்தலை “மிகப் பெரும்” பேணுகிறது.
theological_decisions:
- issue: எசேக்கியாவின் செழிப்புக்குப் பின்னுள்ள செயலாற்றல்
  choice: எசேக்கியாவின் மிகுந்த செல்வம் கடவுள் கொடுத்தது என்று வசனம் நேரடியாகக் கூறுகிறது.
  alternative: அவருடைய செழிப்பை மனித முயற்சியால் மட்டும் விளக்குதல்.
  rationale: כִּי נָתַן לוֹ אֱלֹהִים என்ற கூற்று கடவுளின் செயலாற்றலைத் தெளிவாகக் குறிப்பிடுகிறது. ஆனால் இதிலிருந்து பொதுவான செழிப்பு போதனை எதுவும் விரிவாக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய உரையின் இணைப்புத் தன்மையை “நகரங்களையும்” என்பதும், காரணத் தொடர்பை “ஏனெனில்” என்பதும் இயல்பாகப் பேணுகின்றன.
