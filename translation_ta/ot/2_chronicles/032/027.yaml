base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/027.yaml
  text: And Hezekiah had very great wealth and honor[a], and he made storehouses for silver and gold, precious stones, spices, shields[b], and every desirable article.
translation:
  language: ta
  text: எசேக்கியாவுக்கு மிகுந்த செல்வமும் பெரும் கௌரவமும் இருந்தன. வெள்ளி, பொன், விலையுயர்ந்த கற்கள், நறுமணப் பொருட்கள், கேடயங்கள், விரும்பத்தக்க எல்லாப் பொருட்கள்[b] ஆகியவற்றுக்காக அவர் தனக்குக் களஞ்சியங்களை[a] அமைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘களஞ்சியங்கள்’ என்பதற்குப் பதிலாக ‘கருவூலங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொதுவான சேமிப்பிடங்களையோ, குறிப்பாக அரசரின் செல்வம் வைக்கப்படும் கருவூலங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘விரும்பத்தக்க எல்லாப் பொருட்கள்’ என்பதை ‘மதிப்புமிக்க எல்லாப் பொருட்கள்’ அல்லது ‘அரிய எல்லா வகைக் கலன்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் பரந்த பொருளுடையது; பலவகையான ஆடம்பர அல்லது விலைமதிப்புள்ள பொருட்களையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיחִזְקִיָּהוּ
  choice: எசேக்கியாவுக்கு ... இருந்தன
  rationale: உடைமையைக் குறிக்கும் எபிரெய மொழிமரபை இயல்பான நவீனத் தமிழில் உடைமைப் பொருளாக வழங்குகிறது.
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  choice: செல்வமும் பெருமதிப்பும் மிகுதியாக
  rationale: עֹשֶׁר என்பதன் பொருளாதார வளத்தையும், அரசச் சூழலில் כָבוֹד குறிக்கும் சமூக மதிப்பு மற்றும் உயர்நிலையையும், எபிரெய வலியுறுத்தலையும் காக்கிறது.
- source_word: וְאֹצָרוֹת עָשָׂה לוֹ
  choice: அவர் தனக்குக் களஞ்சியங்களை அமைத்தார்
  rationale: עָשָׂה என்பதைக் குறிப்பான கட்டுமான வினையாகச் சுருக்காமல் ‘அமைத்தார்’ எனவும், לוֹ என்பதைக் ‘தனக்கு’ எனவும் வெளிப்படுத்துகிறது; אֹצָרוֹת என்பதின் பொருள் விரிவு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְכֶסֶף וּלְזָהָב וּלְאֶבֶן יְקָרָה
  choice: வெள்ளி, பொன், விலையுயர்ந்த கற்கள்
  rationale: பட்டியலின் பொருட்களைத் தெளிவாக வழங்குகிறது; ஒருமை வடிவிலுள்ள אֶבֶן தமிழில் இயல்பான தொகுப்புப் பன்மையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: וְלִבְשָׂמִים
  choice: நறுமணப் பொருட்கள்
  rationale: בְשָׂמִים குறிக்கும் வாசனைத் திரவியங்கள், மணப்பொருட்கள், மசாலாப் பொருட்கள் ஆகிய பரப்பைத் தேவையின்றி ஒடுக்காத பொதுவான சொல்.
- source_word: וּלְמָגִנִּים
  choice: கேடயங்கள்
  rationale: מָגִנִּים என்பது பொதுவான போர்க்கருவிகளை அல்ல, குறிப்பாகக் கேடயங்களைக் குறிக்கிறது.
- source_word: וּלְכֹל כְּלֵי חֶמְדָּה
  choice: விரும்பத்தக்க எல்லாப் பொருட்கள்
  rationale: כְּלֵי என்பதைக் கலன்கள் என்று மட்டும் கட்டுப்படுத்தாமல் பொருட்கள் எனவும், חֶמְדָּה என்பதன் விரும்பத்தக்க அல்லது அருமையான தன்மையையும் காக்கிறது.
