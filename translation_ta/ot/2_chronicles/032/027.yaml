translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பட்டியலின் கூறுகள் அனைத்தும் காக்கப்பட்டுள்ளன; தமிழின் இயல்புக்காக இறுதியில் ‘ஆகியவற்றுக்காக’ கொண்டு பட்டியல் இணைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
