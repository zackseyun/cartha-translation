translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளையில் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மரபுத்தொடரின் உருவகம் முதன்மை உரையில் ‘உள்ளத்தோடு பேசினான்’ என்று காக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
