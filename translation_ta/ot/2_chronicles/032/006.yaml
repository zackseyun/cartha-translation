  text: וַ/יִּתֵּ֛ן שָׂרֵ֥י מִלְחָמ֖וֹת עַל הָ/עָ֑ם וַ/יִּקְבְּצֵ֣/ם אֵלָ֗י/ו אֶל רְחוֹב֙ שַׁ֣עַר הָ/עִ֔יר וַ/יְדַבֵּ֥ר עַל לְבָבָ֖/ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
translation:
  language: ta
  text: 'அவன் மக்களுக்கு மேல் படைத் தலைவர்களை நியமித்தான். பின்பு அவர்களை நகர வாசலின் திறந்தவெளியில் தன்னிடம் ஒன்றுகூட்டினான்; அவர்களின் உள்ளங்களை நோக்கிப் பேசினான்[a]. அவன் சொன்னதாவது:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவர்களுடைய இருதயங்களின்மேல் பேசினான்.” இது அவர்களை ஊக்கப்படுத்தும் அல்லது மனவலிமை அளிக்கும் விதத்தில் பேசுவதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: நியமித்தான்
  rationale: வினைச்சொல் அடிப்படையில் ‘வைத்தான்/கொடுத்தான்’ எனப் பொருள்பட்டாலும், மக்கள்மேல் அதிகாரிகளை வைக்கும் இக்கட்டமைப்பில் பதவிக்கு நியமித்தல் என்பதே இயல்பான பொருள்.
- source_word: שָׂרֵי מִלְחָמוֹת
  choice: படைத்தலைவர்கள்
  rationale: சொல்லுக்குச் சொல் ‘போர்களின் தலைவர்கள்’; இச்சூழலில் படையை வழிநடத்தும் அதிகாரிகளைக் குறிக்கிறது. ‘படைத்தலைவர்கள்’ என்பது தெளிவான, தற்போதைய தமிழ்.
- source_word: עַל הָעָם
  choice: மக்கள்மேல்
  rationale: நியமித்தலைக் குறிக்கும் வாக்கியத்தில் עַל அதிகாரத்தையும் மேற்பார்வையையும் சுட்டுகிறது.
- source_word: וַיִּקְבְּצֵם אֵלָיו
  choice: அவர்களைத் தன்னிடம் ஒன்றுகூட்டி
  rationale: קבץ என்பது ஒன்றுகூட்டுதல்; אֵלָיו எசேக்கியா அவர்களைத் தன்னிடம் நேரடியாகக் கூட்டியதைத் தெரிவிக்கிறது. ‘அவர்களை’ என்பதன் முன்னிலைச் சுட்டு மூலத்தைப் போலவே தீர்மானிக்கப்படாமல் விடப்பட்டுள்ளது.
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  choice: நகர வாசலின் திறந்த வெளியில்
  rationale: רְחוֹב என்பது வாசலருகே இருந்த பொதுப் பயன்பாட்டுக்கான அகன்ற திறந்த வெளியைக் குறிக்கிறது; ‘திறந்த வெளி’ சாதாரண வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: וַיְדַבֵּר עַל לְבָבָם
  choice: அவர்களின் உள்ளத்தோடு பேசினான்
  rationale: எபிரெய உருவகத்தை முடிந்தவரை காத்து, அது உள்ளத்தைத் தேற்றும் அல்லது வலுப்படுத்தும் பேச்சு என்பதை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: לֵאמֹר
  choice: 'அவன் சொன்னதாவது:'
  rationale: அடுத்த வசனத்தில் வரும் நேரடிப் பேச்சை இயல்பான தமிழில் அறிமுகப்படுத்துகிறது.
