source:
  edition: WLC
  text: הֲ/לֹ֣א תֵדְע֗וּ מֶ֤ה עָשִׂ֨יתִי֙ אֲנִ֣י וַ/אֲבוֹתַ֔/י לְ/כֹ֖ל עַמֵּ֣י הָ/אֲרָצ֑וֹת הֲ/יָכ֣וֹל יָֽכְל֗וּ אֱלֹהֵי֙ גּוֹיֵ֣ הָ/אֲרָצ֔וֹת לְ/הַצִּ֥יל אֶת אַרְצָ֖/ם מִ/יָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
translation:
  language: ta
  text: “நானும் என் முற்பிதாக்களும்[a] எல்லா நாடுகளின் மக்களுக்கும் என்ன செய்தோம் என்பதை நீங்கள் அறியவில்லையா? அந்நாடுகளின் மக்களின் தெய்வங்கள் அந்த மக்களின் நாட்டை என் கையிலிருந்து காப்பாற்றவே முடிந்ததா?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் முன்னோர்களும்.’ எபிரேய மொழி அரச வம்சத்தைக் குறிக்கும் குடும்பச் சொல்லைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  choice: நீங்கள் அறியவில்லையா?
  rationale: ஒப்புதலை எதிர்பார்க்கும் எதிர்மறை வினாவின் சொல்லாட்சியையும் ידע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: מֶה עָשִׂיתִי
  choice: நான் ... செய்ததை
  rationale: முடிவுற்ற செயல்களைச் சுட்டும் எபிரெய நிறைவுவினையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; தற்போதைய பெருமைப் பேச்சுடன் அதன் தொடர்பைச் சூழல் தெளிவாக்குகிறது.
- source_word: אֲנִי וַאֲבוֹתַי
  choice: நானும் என் தந்தையர்களும்
  rationale: அரச வம்ச முன்னோர்களைக் குறிக்கும் மூலத்தின் குடும்ப/வம்ச மொழிநடையைத் தக்கவைக்கிறது. ‘முன்னோர்கள்’ என்பது தெளிவான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  choice: எல்லா நாடுகளின் மக்களுக்கும்
  rationale: பல நிலப்பகுதிகளையும் அவற்றில் வாழும் மக்களையும் குறிக்கும் பன்மை உணர்வைக் காக்கிறது; עשה உடன் வரும் ל தமிழில் ‘செய்ததை ... மக்களுக்கும்’ என்று இயல்பாக அமைகிறது.
- source_word: הֲיָכוֹל יָכְלוּ
  choice: உண்மையிலேயே முடிந்ததா?
  rationale: வினைமுற்றுடன் வரும் வினையெச்சப் பெயரின் வலியுறுத்தலை மரத்துப் போன சொற்சொல் மொழிபெயர்ப்பின்றி வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: அந்த நாடுகளின் இனங்களுடைய தெய்வங்கள்
  rationale: அந்நிலப்பகுதிகளில் வாழ்ந்த அரசியல்-இனக் குழுக்களின் தெய்வங்களைக் குறிக்கும் உரிமைத் தொடரைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְהַצִּיל
  choice: காப்பாற்ற
  rationale: படைத் தாக்குதலிலிருந்து விடுவித்தல் அல்லது மீட்டல் என்ற נצל வினையின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֶת אַרְצָם
  choice: தங்கள் நாட்டை
  rationale: ஒவ்வொரு இனத்திற்கும் உரிய நிலப்பகுதியை ஒருமையாகக் குறிப்பிடும் எபிரெய அமைப்பை இயல்பாக எடுத்துரைக்கிறது.
- source_word: מִיָדִי
  choice: என் கையிலிருந்து
  rationale: அதிகாரம் மற்றும் கட்டுப்பாட்டைக் குறிக்கும் ‘கை’ உருவகத்தைத் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் காக்கிறது.
theological_decisions:
- issue: புறமத அரசனின் பெருமைப் பேச்சில் வரும் ‘தெய்வங்கள்’
  choice: אֱלֹהֵי என்பதை எந்த விளக்கத் தகுதியும் சேர்க்காமல் ‘தெய்வங்கள்’ என்று மொழிபெயர்த்தல்.
  alternative: ‘தெய்வங்கள் எனப்படுபவை’ என்று மொழிபெயர்த்தல்.
  rationale: பேசுகிறவன் தன் வெற்றிகளை அடிப்படையாகக் கொண்டு பிற இனங்களின் தெய்வங்களை யூதாவின் தேவனுடன் ஒப்பிடுகிறான். மொழிபெயர்ப்பு அவனுடைய கூற்றை அப்படியே பிரதிபலிக்க வேண்டும்; அதன் உண்மைத்தன்மை குறித்த இறையியல் தீர்ப்பை வசனத்துக்குள் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்கள் புரிந்துகொள்ளும் வகையிலும் அரசனின் சவாலான, பெருமிதமுள்ள சொல்லாட்சியைத் தக்கவைக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. ‘என் கையிலிருந்து’ என்ற மூல உருவகமும், திறனை வலியுறுத்தும் ‘உண்மையிலேயே முடிந்ததா?’ என்ற வினாவும் பாதுகாக்கப்பட்டுள்ளன.
