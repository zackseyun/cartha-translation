source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְחִזְקִיָּ֖הוּ וַ/חֲסָדָ֑י/ו הִנָּ֣/ם כְּתוּבִ֗ים בַּ/חֲז֞וֹן יְשַֽׁעְיָ֤הוּ בֶן אָמוֹץ֙ הַ/נָּבִ֔יא עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: The rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
translation:
  language: ta
  text: எசேக்கியாவின் மற்ற செயல்களும் அவனுடைய பற்றுறுதிச் செயல்களும்[a]—இதோ, அவை ஆமோத்சின் மகனான ஏசாயா தீர்க்கதரிசியின் தரிசனத்தில், யூதா மற்றும் இஸ்ரவேல் அரசர்களின் புத்தகத்தில் எழுதப்பட்டுள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய உடன்படிக்கைப் பற்றுறுதிச் செயல்கள்” அல்லது “அவனுடைய பற்றுறுதியான செயல்கள்.” இதற்கான எபிரெயச் சொல் உறுதியான அன்பு, நம்பிக்கைக்குரிய தயவு, அல்லது விசுவாசமுள்ள பற்றுறுதி ஆகிய பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְחִזְקִיָּהוּ
  choice: எசேக்கியாவின் மற்ற செயல்களும்
  rationale: அரசர் வரலாற்றுச் சுருக்கத்தில் דִּבְרֵי என்பது வெறும் சொற்களை அல்லாமல் செயல்களையும் நிகழ்வுகளையும் குறிக்கிறது; וְיֶתֶר என்பது மீதமுள்ளவற்றை அறிமுகப்படுத்துகிறது.
- source_word: וַחֲסָדָיו
  choice: அவன் உண்மைப்பற்றுடன் செய்த செயல்களும்
  rationale: חֶסֶד இங்கு மனித அரசனின் நடத்தை குறிக்கிறது; உறுதியான பற்று, விசுவாசம், பற்றுறுதி ஆகிய நுணுக்கங்களை இயல்பான தமிழில் தெரிவிக்கிறது; உடன்படிக்கை சார்ந்த பொருளை முதன்மை உரையில் அளவுக்கு மீறி வலியுறுத்தவில்லை.
- source_word: הִנָּם
  choice: இதோ
  rationale: அடுத்து கூறப்படுவதற்குக் கவனம் ஈர்க்கும் எபிரெய நிகழ்த்துக்காட்டுச் சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன
  rationale: எழுதப்பட்ட அல்லது பதிவுசெய்யப்பட்ட நிலையில் இருப்பதைக் குறிக்கும் பன்மைச் செயலெச்சத்தின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: בַּחֲזוֹן
  choice: தரிசனத்தில்
  rationale: חָזוֹן என்பதன் முதன்மைப் பொருளான ‘தரிசனம்’ என்பதைக் காக்கிறது; அதை விளக்கமாக ‘தீர்க்கதரிசனம்’ அல்லது ‘பதிவு’ என்று மாற்றவில்லை.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: ஆமோத்சின் மகனான ஏசாயா தீர்க்கதரிசி
  rationale: பெயர், தந்தைவழி அடையாளம், தீர்க்கதரிசி என்ற பணி ஆகிய மூன்றையும் மூல வரிசைக்கு நெருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: யூதா மற்றும் இஸ்ரவேல் அரசர்களின் புத்தகத்தில்
  rationale: நூற்பட்டியல் சூத்திரத்தில் עַל எழுதப்பட்ட ஆதாரத்துடன் உள்ள தொடர்பைக் குறிக்கிறது; தமிழில் ‘புத்தகத்தில்’ என்பது மரத்தனமான ‘புத்தகத்தின்மேல்’ என்பதைவிட இயல்பாக அந்த உறவைத் தெரிவிக்கிறது.
theological_decisions:
- issue: எசேக்கியாவின் செயல்களுக்கு பயன்படுத்தப்பட்ட חֶסֶד என்பதன் நுணுக்கம்
  choice: அவன் உண்மைப்பற்றுடன் செய்த செயல்கள்
  alternative: அவனுடைய உடன்படிக்கைப் பற்றுறுதிச் செயல்கள்; அவனுடைய பற்றுறுதியான செயல்கள்; அவனுடைய நற்செயல்கள்
  rationale: இந்தச் சொல் உறவுசார் பற்று, விசுவாசம், உண்மைத்தன்மை ஆகியவற்றை உள்ளடக்கலாம். இங்கு பொருள் மனித அரசன் என்பதால், தொழில்நுட்பமான உடன்படிக்கைப் பொருளைத் திணிக்காமல் அந்த ஒழுக்க மற்றும் உறவுசார் நுணுக்கத்தை முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்றுச் சுருக்க மொழி பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்பது மூலத்தின் கவன ஈர்ப்பு வலிமையைத் தக்கவைக்கும் சற்றே உயர்ந்த நடை. ஆதார நூல்களுக்கிடையிலான எபிரெயத் தொடரின் சாத்தியமான தொடர்பைத் தீர்மானமாக மறுவிளக்கம் செய்யாமல், இரண்டு இடவெற்றுமைத் தொடர்களாக வைத்துள்ளது.
