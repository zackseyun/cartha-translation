  source_fidelity: மூலத்தின் அரச வரலாற்றுச் சுருக்கப் பொருளும், ‘தரிசனம்,’ ஏசாயாவின் அடையாளம், மற்றும் யூதா-இஸ்ரவேல் அரசர்களின் நூல் பற்றிய குறிப்பு ஆகியவையும் பொதுவாகச் சரியாக உள்ளன. ஆனால் וַחֲסָדָיו என்பதற்கான நடப்பிலுள்ள ‘உண்மைப்பற்றுடன் செய்த செயல்கள்’ என்ற தொடர் இயல்பற்றதாகவும், ‘செயல்கள்’ என்பதைக் கூடுதலாகத் திரும்பக் கூறுவதாகவும் உள்ளது. הִנָּם-இன் பன்மைச் சுட்டுதலை ‘அவை’ என வெளிப்படுத்துவது தெளிவானது.
