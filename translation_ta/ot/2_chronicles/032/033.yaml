source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֨ב יְחִזְקִיָּ֜הוּ עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ/הוּ֮ בְּֽ/מַעֲלֵה֮ קִבְרֵ֣י בְנֵי דָוִיד֒ וְ/כָבוֹד֙ עָֽשׂוּ ל֣/וֹ בְ/מוֹת֔/וֹ כָּל יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
translation:
  language: ta
  text: எசேக்கியா தன் முன்னோர்களோடு துயிலடைந்தான். தாவீதின் மகன்களுடைய கல்லறைகளின் மேற்பகுதியில் அவனை அடக்கம் செய்தார்கள்.[a] அவன் இறந்தபோது, யூதாவிலுள்ள அனைவரும் எருசலேமில் குடியிருந்தவர்களும் அவனுக்கு மரியாதை செலுத்தினார்கள். அவனுக்குப் பதிலாக அவன் மகன் மனாசே அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதின் வழிவந்தவர்களுடைய கல்லறைகள்.” இங்கு “தாவீதின் மகன்கள்” என்பது தாவீதின் அரச வம்சத்தினரைக் குறிக்கிறது.
    reason: சொற்பொருள் மாற்றுவாய்ப்பையும் வம்சப் பொருளையும் தெளிவுபடுத்துதல்
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு துயிலடைந்தான்
  rationale: இது மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய அரச இரங்கல் மரபுத்தொடர். தமிழில் பொருள் விளங்கும்படியும் மூலத்தின் ‘துயில்’ உருவகத்தைத் தக்கவைக்கும்படியும் மொழிபெயர்க்கப்பட்டது; אֲבֹתָיו இங்கு வம்சத்து முன்னோர்களைக் குறிக்கிறது.
- source_word: וַיִּקְבְּרֻהוּ
  choice: அவனை அடக்கம் செய்தார்கள்
  rationale: எபிரெய வினை செயப்பாட்டு அல்ல, குறிப்பிடப்படாத பன்மை எழுவாயைக் கொண்ட செயவினை; தமிழிலும் அதை இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְּמַעֲלֵה
  choice: மேற்பகுதியில்
  rationale: இந்தச் சூழலில் உயர்ந்த இடம் அல்லது மேற்பகுதி என்ற நிலவியல் பொருள் பொருத்தமானது; ‘ஏறும் வழியில்’ என்ற சாத்தியத்தைத் தேவையின்றி உறுதிப்படுத்தவில்லை.
- source_word: קִבְרֵי בְנֵי דָוִיד
  choice: தாவீதின் மகன்களுடைய கல்லறைகள்
  rationale: மூலத்தின் சொல் வடிவை முதன்மை உரையில் தக்கவைக்கிறது. சூழலில் இது தாவீதின் அரச வம்சத்தினரைக் குறிக்கக்கூடும் என்பதைக் குறிப்பில் தெளிவுபடுத்துகிறது.
- source_word: וְכָבוֹד עָשׂוּ לוֹ
  choice: அவனுக்கு மரியாதை செலுத்தினார்கள்
  rationale: ‘அவனுக்கு மரியாதை செய்தார்கள்’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: בְּמוֹתוֹ
  choice: அவன் இறந்தபோது
  rationale: மரண நிகழ்வின் காலச் சூழலை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כָּל יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: யூதா முழுவதும் எருசலேமின் குடிமக்களும்
  rationale: மரியாதை செலுத்தியோரின் விரிவான பொது அளவைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக ... அரசாண்டான்
  rationale: அரச வாரிசுரிமையைக் குறிக்கும் வழக்கமான தொடரைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: அரச இரங்கல் தொடரிலுள்ள மரண உருவகம்
  choice: ‘தன் முன்னோர்களோடு துயிலடைந்தான்’ என்று துயில் உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘இறந்தான்’
  rationale: மூல எபிரெயத்தின் வழக்கமான அரச இரங்கல் மரபுத்தொடரையும் அதன் இலக்கியத் தொடர்ச்சியையும் பாதுகாக்கிறது; அடுத்த அடக்கக் கூற்று பொருளைத் தெளிவாக்குகிறது.
- issue: ‘தாவீதின் மகன்கள்’ என்பதன் வரம்பு
  choice: முதன்மை உரையில் நேரடி வடிவத்தை வைத்துக் குறிப்பில் வம்சப் பொருளை விளக்குதல்
  alternative: ‘தாவீதின் வழிவந்தவர்களுடைய கல்லறைகள்’
  rationale: בְנֵי דָוִיד என்ற மூலச் சொல்லை மறைக்காமல், சூழலில் அது தாவீதிய அரச வம்சத்தைக் குறிக்கும் விரிவான பொருளையும் வாசகருக்குத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. மரணத்திற்கான எபிரெய உருவகம் பாதுகாக்கப்பட்டுள்ளது; ‘துயிலடைந்தான்’ என்பது ‘நித்திரையடைந்தான்’ என்பதைக் காட்டிலும் தற்போதைய தமிழில் இயல்பானது. அடிக்குறி குறியீடு தொடர்புடைய ‘தாவீதின் மகன்கள்’ தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
