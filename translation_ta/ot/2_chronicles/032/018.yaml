  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று உரைநடை. எபிரெய மூலத்தின் நோக்கத் தொடர்பும், பயமுறுத்துதல் மற்றும் கலங்கச் செய்தல் என்ற இரட்டை வலியுறுத்தலும் பாதுகாக்கப்பட்டுள்ளன.
