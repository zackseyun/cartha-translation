base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/018.yaml
  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: ta
  text: அவர்கள் மதில்மேல் இருந்த எருசலேம் மக்களைப் பயமுறுத்திக் கலங்கச் செய்து, நகரத்தைக் கைப்பற்றுவதற்காக, யூத மொழியில் உரத்த குரலில் அவர்களை நோக்கிக் கூப்பிட்டார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוּדִית
  choice: யூத மொழியில்
  rationale: இச்சொல் யூதா நாட்டினரின் மொழியைக் குறிக்கிறது; நவீன வாசகருக்கு மொழி குறித்த பொருள் தெளிவாக இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְקוֹל גָּדוֹל
  choice: உரத்த குரலில்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான பொருளையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: לְיָרְאָם וּלְבַהֲלָם
  choice: அச்சுறுத்திக் கலங்கச் செய்து
  rationale: முதல் வினை பயத்தை ஏற்படுத்துவதையும், இரண்டாவது வினை மனக்கலக்கத்தையோ திகிலையோ ஏற்படுத்துவதையும் குறிக்கிறது; இரு தனித்த நுணுக்கங்களும் காக்கப்பட்டுள்ளன.
- source_word: יִלְכְּדוּ אֶת הָעִיר
  choice: நகரத்தைக் கைப்பற்றுவதற்காக
  rationale: לכד என்ற வினையின் போர் சூழலுக்குரிய பொருள் ‘கைப்பற்று’; நோக்கத்தைக் காட்டும் לְמַעַן இயல்பான தமிழ் வாக்கிய அமைப்பில் இணைக்கப்பட்டது.
