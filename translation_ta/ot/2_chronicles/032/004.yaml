source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ עַם רָ֔ב וַֽ/יִּסְתְּמוּ֙ אֶת כָּל הַ/מַּעְיָנ֔וֹת וְ/אֶת הַ/נַּ֛חַל הַ/שּׁוֹטֵ֥ף בְּ/תוֹךְ הָ/אָ֖רֶץ לֵ/אמֹ֑ר לָ֤/מָּה יָב֨וֹאוּ֙ מַלְכֵ֣י אַשּׁ֔וּר וּ/מָצְא֖וּ מַ֥יִם רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
translation:
  language: ta
  text: ஏராளமான மக்கள் ஒன்றுகூடி, எல்லா நீரூற்றுகளையும் நாட்டின் வழியாகப் பாய்ந்துகொண்டிருந்த ஓடையையும்[a] அடைத்தார்கள். அவர்கள், “அசீரியாவின் அரசர்கள்[b] வந்து ஏராளமான தண்ணீரைக் கண்டடைய ஏன் அனுமதிக்க வேண்டும்?” என்றார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாட்டின் வழியாகப் பாய்ந்துகொண்டிருந்த நீரோடையையும்.”
    reason: நַחַל என்பது சூழலுக்கேற்ப ஓடை, நீரோடை அல்லது வறண்ட காலத்தில் நீரற்ற பள்ளத்தாக்கு எனப் பொருள்படலாம்.
  - marker: b
    text: எபிரெயில், “அசீரியாவின் அரசர்கள்.” இந்தப் பன்மை அசீரிய அரச அதிகாரத்தையோ அரச வம்சத்தையோ குறிக்கலாம்; உடனடி வரலாற்றுச் சூழலை முன்னிட்டு சில மொழிபெயர்ப்புகள் இதை “அசீரியாவின் அரசன்” என்று ஒருமையில் தருகின்றன.
    reason: மூலப்பாடத்தின் பன்மையையும் அதன் சாத்தியமான வரலாற்றுப் பொருளையும் வாசகருக்குத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  choice: ஏராளமான மக்கள் ஒன்றுகூடி
  rationale: Niphal வினையின் ஒன்றுசேரும் பொருளையும் עַם רָב என்பதன் பெருந்திரளான மக்களைக் குறிக்கும் பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: וַיִּסְתְּמוּ
  choice: அடைத்தார்கள்
  rationale: நீரூற்றுகளும் நீரோடையும் எதிரிகளுக்குப் பயன்படாதபடி தடுக்கப்பட்டதைத் தெளிவாகக் குறிக்கிறது.
- source_word: כָּל הַמַּעְיָנוֹת
  choice: எல்லா நீரூற்றுகளையும்
  rationale: מַעְיָן என்பதன் இயற்கையான ஊற்று என்ற பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: הַנַּחַל הַשּׁוֹטֵף
  choice: பாய்ந்த ஓடையையும்
  rationale: נַחַל என்பதன் ஓடை/நீரோடை என்ற பொருளையும் שׁוֹטֵף என்பதன் செயலில் பாயும் தன்மையையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: நாட்டின் வழியாக
  rationale: அந்த நீரோடை நிலப்பகுதியினுள் வழிந்தோடியதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֵאמֹר
  choice: அவர்கள் … என்றார்கள்
  rationale: எபிரெய மேற்கோள் அறிமுகத்தைத் தமிழில் இயல்பான நேரடி உரையாக அமைக்கிறது.
- source_word: לָמָּה יָבֹאוּ
  choice: வந்து … ஏன் விட வேண்டும்?
  rationale: தண்ணீர் எதிரிகளுக்குக் கிடைக்கக் கூடாது என்ற ஆலோசனை சார்ந்த வினாவின் நோக்கத்தை, தேவையற்ற விளக்கத்தைச் சேர்க்காமல் இயல்பாகத் தருகிறது.
- source_word: מַלְכֵי אַשּׁוּר
  choice: அசீரியாவின் அரசர்கள்
  rationale: மூல எபிரெயிலுள்ள பன்மையை மாற்றாமல் பாதுகாக்கிறது.
- source_word: וּמָצְאוּ מַיִם רַבִּים
  choice: ஏராளமான தண்ணீரைக் கண்டடையும்படி
  rationale: மிகுதியாகக் கிடைக்கும் நீர்வளத்தைக் குறிக்கும் מַיִם רַבִּים என்பதன் பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: מַלְכֵי אַשּׁוּר என்பதிலுள்ள பன்மை
  choice: அசீரியாவின் அரசர்கள்
  alternative: அசீரியாவின் அரசன்
  rationale: உடனடி வரலாற்றுச் சூழலில் ஒரே அரசன் குறிக்கப்பட்டிருக்கலாம் என்றாலும், மூலப்பாடத்தின் உண்மையான பன்மையை ஒருமையாக மாற்றாமல் வைத்திருக்கிறது; அது அரச வம்சத்தையோ அசீரிய அரச அதிகாரத்தையோ குறிக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் வரலாற்று உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. எபிரெயின் பன்மையும் நீர்வழியைக் குறிக்கும் சொல்லின் பொருள் விரிவும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
