source:
  edition: WLC
  text: וַ/יִּכָּנַ֤ע יְחִזְקִיָּ֨הוּ֙ בְּ/גֹ֣בַהּ לִבּ֔/וֹ ה֖וּא וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/לֹא בָ֤א עֲלֵי/הֶם֙ קֶ֣צֶף יְהוָ֔ה בִּ/ימֵ֖י יְחִזְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
translation:
  language: ta
  text: அப்போது எசேக்கியா தன் உள்ளத்தின் பெருமையின் காரணமாகத் தன்னைத் தாழ்த்தினார்[a]; அவரோடு எருசலேமின் குடிகளும் தங்களைத் தாழ்த்தினார்கள். ஆகவே, எசேக்கியாவின் நாட்களில் யாவேயின் சினம் அவர்கள்மேல் வரவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் உள்ளத்தின் பெருமையைக் குறித்து.” எபிரேயச் சொற்றொடரின் நேர்ப்பொருள் “தன் உள்ளத்தின் உயரத்தில்/உயரத்திற்காக” என்பதாகும்; இது உள்ளார்ந்த அகந்தையையோ மேட்டிமையையோ குறிக்கும் மரபுத்தொடர்.
    reason: முன்னிடைச்சொல்லின் காரணப்பொருளுக்கும் தொடர்புப்பொருளுக்கும் இடையிலான உண்மையான மொழியியல் தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: தன்னைத் தாழ்த்தினார்
  rationale: כנע என்பதன் நிஃபால் வடிவம் இச்சூழலில் வெறும் செயல்படுபொருள் நிலையைக் காட்டாமல், மனந்திரும்புதலோடு ஒருவர் தாமே தாழ்ந்துகொள்வதைக் குறிக்கிறது.
- source_word: בְּגֹבַהּ לִבּוֹ
  choice: தன் உள்ளத்தின் பெருமையின் காரணமாக
  rationale: גֹבַהּ என்பதன் நேர்ப்பொருள் ‘உயரம்’; ‘உள்ளம்’ என்பதோடு சேரும்போது அகந்தை அல்லது மேட்டிமையைக் குறிக்கிறது. בְּ முன்னிடைச்சொல் இங்கு காரணத்தையோ தொடர்பையோ குறிக்கக்கூடும்; முதன்மை உரையில் இயல்பான காரணப்பொருள் தரப்பட்டுள்ளது, மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הוּא וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: அவரோடு எருசலேமின் குடிகளும்
  rationale: הוּא எசேக்கியாவை வலியுறுத்தி, எருசலேமின் குடிகளையும் அதே தாழ்த்துதல் செயலில் இணைக்கிறது. தமிழில் பொருள் தெளிவாக இருக்கப் பகிரப்பட்ட செயப்படுபொருள் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: קֶצֶף יְהוָה
  choice: யாவேயின் சினம்
  rationale: קֶצֶף என்பது நியாயத்தீர்ப்புடன் தொடர்புடைய தீவிரமான கோபத்தைக் குறிக்கிறது; ‘சினம்’ அதன் கனத்தைச் சுருக்கமாகவும் கண்ணியமாகவும் தருகிறது. יהוה தனிப்பட்ட இறைப் பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֹא בָא עֲלֵיהֶם
  choice: அவர்கள்மேல் வரவில்லை
  rationale: בוא על என்ற எபிரேய மரபுத்தொடர் தீர்ப்பு ஒருவர்மேல் வருவதைக் குறிக்கிறது; தமிழிலும் இதே உருவகம் இயல்பாகப் புரிகிறது.
- source_word: בִּימֵי יְחִזְקִיָּהוּ
  choice: எசேக்கியாவின் நாட்களில்
  rationale: அரசனின் காலத்தையோ வாழ்நாள் காலப்பகுதியையோ குறிக்கும் மூலமொழியின் வழக்கமான காலவாக்கியத்தை அதிகமாக விளக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஒரு பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என வழங்குவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: எசேக்கியாவோடு எருசலேம் குடிகளும் தங்களைத் தாழ்த்தியதாகப் புரிந்துகொள்ளுதல்
  choice: பகிரப்பட்ட செயலைத் தமிழில் வெளிப்படையாகக் கூறுதல்
  alternative: ‘அவர், எருசலேமின் குடிகளும்’ என்று மூலத்தின் இலக்கண அமைப்பை அப்படியே வைத்தல்
  rationale: எபிரேயத்தில் வினை முதலில் எசேக்கியாவுடன் ஒருமையில் வந்து, பின்னர் הוּא וְיֹשְׁבֵי என்ற இணை எழுவாய் சேர்கிறது. இரு தரப்பினரும் தாழ்ந்தார்கள் என்பதே இயல்பான பொருள்; தமிழில் தெளிவுக்காக இரண்டாம் கூறில் வினை மீண்டும் சொல்லப்பட்டுள்ளது, புதிய இறையியல் முடிவு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பேணுகிறது. ‘உள்ளம்’, ‘பெருமை’, ‘சினம்’, ‘குடிகள்’ ஆகிய சொற்கள் சாதாரண வாசகர்களுக்குப் புரியத்தக்கவையாகவும், மூலத்தின் நெறி மற்றும் நியாயத்தீர்ப்பு வலிமையைத் தக்கவைத்தவையாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் [a] என இடம்பெற்றுள்ளது.
