translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தில் இவ்வசனம் முந்தைய வினைச்சொல்லைத் தொடர்ந்து வரும் பட்டியலாக உள்ளது; தமிழில் தனிவசனமாகத் தெளிவாக வாசிக்க ‘அவர் அமைத்தார்’ சேர்க்கப்பட்டுள்ளது. ‘கால்நடை’ மற்றும் ‘மந்தை’, ‘தொழுவம்’ மற்றும் ‘பட்டி’ என்ற வேறுபாடுகள் மூலத்தின் இணை அமைப்பைத் தக்கவைக்கின்றன.
