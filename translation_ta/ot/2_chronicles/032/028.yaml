  text: storehouses for the produce of grain[a], new wine, and oil, and stalls for all kinds of animals[c][b], and folds for the flocks.
translation:
  language: ta
  text: தானியம், புதுத் திராட்சரசம்[b], எண்ணெய் ஆகிய விளைபொருள்களுக்கான களஞ்சியங்களையும்[a], எல்லா வகைக் கால்நடைகளுக்கான தொழுவங்களையும், மந்தைகளுக்கான பட்டிகளையும்[c] அவர் அமைத்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “களஞ்சிய நகரங்கள்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் தனிக் களஞ்சியங்களைவிடப் பெரிய சேமிப்பு வளாகங்களையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “புதுத் திராட்சரசம்” என்பதற்கான எபிரெயச் சொல், வேளாண் பட்டியல்களில் திராட்சரசத்தைக் குறிக்கும் பொதுவான சொற்களிலிருந்து அடிக்கடி வேறுபடுத்திப் பயன்படுத்தப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: “பட்டிகள்” என்பதற்குப் பதிலாக “அடைப்புகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְכְּנוֹת
  choice: களஞ்சியங்கள்
  rationale: வேளாண் விளைபொருள்களைச் சேமிக்கும் வசதிகளை இச்சூழலில் இயல்பாகக் குறிக்கிறது; பெரிய சேமிப்பு வளாகங்கள் அல்லது ‘களஞ்சிய நகரங்கள்’ என்ற நுட்பமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תְבוּאַת
  choice: விளைபொருள்கள்
  rationale: தானியம், திராட்சரசம், எண்ணெய் ஆகியவற்றை உள்ளடக்கும் வேளாண் விளைச்சலை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: דָּגָן
  choice: தானியம்
  rationale: தானியப் பயிர்களுக்கான பரந்த, வழக்கமான தமிழ்ச் சொல்.
- source_word: תִירוֹשׁ
  choice: புதுத் திராட்சரசம்
  rationale: பொதுவான திராட்சரசச் சொற்களிலிருந்து இதனை வேறுபடுத்தி, புதிதாக உற்பத்திசெய்யப்பட்ட திராட்சரசம் என்ற வேளாண் சூழலைப் பாதுகாக்கிறது.
- source_word: יִצְהָר
  choice: எண்ணெய்
  rationale: இவ்வேளாண் முப்பொருள் பட்டியலில் பொதுவாக ஒலிவ எண்ணெயைக் குறித்தாலும், எபிரெயச் சொல்லின் சுருக்கத்தைக் காக்க ‘எண்ணெய்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֻרָוֹת
  choice: தொழுவங்கள்
  rationale: கால்நடைகளைத் தங்கவைக்க அல்லது தீனியிடப் பயன்படும் இடங்களை இயல்பாகக் குறிக்கிறது.
- source_word: לְכָל בְּהֵמָה וּבְהֵמָה
  choice: எல்லா வகைக் கால்நடைகளுக்கும்
  rationale: எபிரெயத்தில் பெயர்ச்சொல் மீண்டும் வருவது ஒவ்வொன்றையும் அல்லது பல்வேறு வகைகளையும் பகிர்ந்துணர்த்தும் நடை; தமிழில் அதன் பொருள் இயல்பாக வழங்கப்படுகிறது.
- source_word: עֲדָרִים
  choice: மந்தைகள்
  rationale: முக்கியமாக ஆடு, வெள்ளாடு போன்ற கூட்டங்களைக் குறிக்கும் பரந்த தமிழ்ச் சொல்.
- source_word: אֲוֵרוֹת
  choice: பட்டிகள்
  rationale: மந்தைகளை வைத்திருக்கச் சுற்றி அடைக்கப்பட்ட இடங்களைத் தெளிவாகக் குறிக்கிறது; முந்தைய ‘தொழுவங்கள்’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
