  text: כֹּ֣ה אָמַ֔ר סַנְחֵרִ֖יב מֶ֣לֶךְ אַשּׁ֑וּר עַל מָה֙ אַתֶּ֣ם בֹּטְחִ֔ים וְ/יֹשְׁבִ֥ים בְּ/מָצ֖וֹר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/010.yaml
  text: 'Thus says Sennacherib king of Assyria: On what are you trusting, that you remain under siege in Jerusalem?'
translation:
  language: ta
  text: '“அசீரியாவின் அரசன் சனகெரிப் இவ்வாறு கூறுகிறான்: எதை நம்பி எருசலேமில் முற்றுகையின்கீழ் இருக்கிறீர்கள்?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: கூறுவது இதுவே
  rationale: தூதர் உரைக்குரிய எபிரெய அறிமுகச் சூத்திரத்தை இயல்பான, கண்ணியமான நவீன தமிழில் தருகிறது.
- source_word: עַל מָה אַתֶּם בֹּטְחִים
  choice: எதை நம்பி
  rationale: מָה என்பதன் திறந்த வினாப்பொருளைத் தக்கவைத்து, நம்பிக்கைக்கான ஆதாரம் என்ன என்பதைக் கேட்கும் இயல்பான தமிழ் வடிவம்.
- source_word: וְיֹשְׁבִים
  choice: தங்கியிருக்கிறீர்கள்
  rationale: ישׁב இங்கு அமர்ந்திருத்தலை மட்டும் அல்லாமல் ஒரு இடத்தில் தொடர்ந்து இருப்பதைக் குறிக்கிறது; சூழலுக்கு ஏற்றவாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּמָצוֹר
  choice: முற்றுகைக்குள்
  rationale: מָצוֹר என்பதன் முற்றுகை நிலையை நேரடியாகக் காட்டுகிறது; எருசலேம் முற்றுகையிடப்பட்டிருந்த சூழலைத் தெளிவாகத் தருகிறது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: இடப்பொருளை இயல்பான தமிழ் வேற்றுமையுடன் வழங்குகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழ்; அரச தூதுச் செய்தியின் சவாலான தொனியைப் பேணும் வகையில் சுருக்கமாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. வாசகம் சனகெரிபின் நேரடி உரையாக மேற்கோள் குறிகளுக்குள் தரப்பட்டுள்ளது.
