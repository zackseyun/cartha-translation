  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ מַלְאָ֔ךְ וַ/יַּכְחֵ֞ד כָּל גִּבּ֥וֹר חַ֨יִל֙ וְ/נָגִ֣יד וְ/שָׂ֔ר בְּ/מַחֲנֵ֖ה מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּשָׁב֩ בְּ/בֹ֨שֶׁת פָּנִ֜ים לְ/אַרְצ֗/וֹ וַ/יָּבֹא֙ בֵּ֣ית אֱלֹהָ֔י/ו ו/מ/יציא/ו מֵעָ֔י/ו שָׁ֖ם הִפִּילֻ֥/הוּ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: ta
  text: ஆண்டவர் ஒரு தூதனை அனுப்பினார். அந்தத் தூதன் அசீரிய அரசனுடைய முகாமிலிருந்த வலிமைமிக்க வீரர்கள், தளபதிகள், அதிகாரிகள் அனைவரையும் அழித்துப்போட்டான். எனவே, அரசன் முகத்தில் அவமானத்துடன் தன் நாட்டுக்குத் திரும்பினான். அவன் தன் தெய்வத்தின் கோவிலுக்குள் சென்றபோது, அவனிடமிருந்து பிறந்தவர்கள்[a] அங்கே அவனை வாளால் வீழ்த்தினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “அவனுடைய உடலிலிருந்து புறப்பட்டவர்கள்”; இது அவனுடைய சொந்தச் சந்ததியைக் குறிக்கிறது.
    reason: மூலத்தின் உடற்கூறு உருவகத்தையும், ‘மகன்கள்’ என்று தேவையின்றிக் குறிப்பாக்காத பரந்த சொல்லாட்சியையும் காக்கிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: எபிரெய இறைப்பெயரைத் தமிழில் வழக்கமான, மரியாதைக்குரிய சிறப்புப் பெயரால் காட்டுகிறது; மூலத்தில் உள்ள தனிப்பட்ட இறைப்பெயரின் இடத்தைப் பொதுவான ‘கடவுள்’ என்று மாற்றவில்லை.
- source_word: מַלְאָךְ
  choice: தூதன்
  rationale: இச்சூழலில் ஆண்டவரால் அனுப்பப்பட்ட விண்ணுலகத் தூதரைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: וַיַּכְחֵד
  choice: அழித்துப்போட்டான்
  rationale: முற்றிலும் ஒழித்தல் அல்லது இல்லாமல் செய்தல் என்ற வினையின் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גִּבּוֹר חַיִל
  choice: வலிமைமிக்க வீரர்கள்
  rationale: போராற்றல் மிக்க வீரர்களைக் குறிக்கும் எபிரெயச் சொல்லிணையின் பொருளை நேரடியாகத் தருகிறது.
- source_word: נָגִיד וְשָׂר
  choice: தளபதிகள், அதிகாரிகள்
  rationale: இரண்டு வேறுபட்ட தலைமைப் பதவிகளையும் காக்கிறது; படைமுகாம் என்ற சூழலில் நாகீத் என்பதற்குத் ‘தளபதி’, சார் என்பதற்கு விரிவான ‘அதிகாரி’ பொருந்துகின்றன.
- source_word: בְּבֹשֶׁת פָּנִים
  choice: முகத்தில் அவமானத்துடன்
  rationale: ‘முகத்தின் அவமானத்தோடு’ என்ற மூல உருவகத்தைத் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: מִיצִיאֵי מֵעָיו
  choice: அவனுக்குப் பிறந்தவர்களில் சிலர்
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய உள்ளுறுப்புகளிலிருந்து புறப்பட்டவர்கள்’ என்ற உடற்கூறு உருவகம் அவனுடைய சொந்தச் சந்ததியைக் குறிக்கிறது; பாலினத்தை மூலத்தைவிடக் குறிப்பாக்காமல் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הִפִּילֻהוּ בֶחָרֶב
  choice: அவனை வாளால் வெட்டி வீழ்த்தினார்கள்
  rationale: வாளால் தாக்கி வீழ்த்திக் கொன்ற செயலைத் தெளிவாகவும் மூல வினைக்கு நெருக்கமாகவும் தருகிறது.
theological_decisions:
- issue: ஆண்டவரால் அனுப்பப்பட்ட தூதனின் அடையாளம்
  choice: ‘ஒரு தூதன்’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது
  alternative: ஒரு குறிப்பிட்ட பிரதான தூதன் அல்லது தெய்வீகத் தோற்றம் என்று விளக்குதல்
  rationale: மூலம் தூதனின் தனிப்பட்ட அடையாளத்தையோ இயல்பையோ கூறவில்லை; ஆகவே கூடுதல் இறையியல் அடையாளம் சேர்க்கப்படவில்லை.
- issue: அசீரிய அரசனைக் கொன்றவர்களின் உறவு
  choice: ‘அவனுக்குப் பிறந்தவர்கள்’ என்று மூலத்தின் பரந்த சந்ததி மொழி காக்கப்பட்டது
  alternative: ‘அவனுடைய மகன்கள்’ என்று குறிப்பாக்குதல்
  rationale: இணைவரலாற்றுச் செய்தி மகன்கள் என்று தெளிவுபடுத்தினாலும், இவ்வசனத்தின் எபிரெய வாசகம் பாலினத்தைக் குறிப்பாக்காமல் அரசனுடைய உடலிலிருந்து வந்த சந்ததியைக் கூறுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் அமைக்கப்பட்டது. ‘ஆண்டவர்’ இறைப்பெயருக்கான மரியாதைமிக்க வழக்குச் சமமாகவும், ‘தெய்வம்’ அசீரிய அரசன் வழிபட்ட கடவுளைக் குறிக்கவும் வேறுபடுத்தப்பட்டுள்ளது. முதல் வாக்கியத்தில் ‘அந்தத் தூதன்’ என்று பெயர்ச்சொல் மீண்டும் பயன்படுத்தப்பட்டதால் செய்பவர் தெளிவாகிறார்.
