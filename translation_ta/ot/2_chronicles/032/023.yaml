source:
  edition: WLC
  text: וְ֠/רַבִּים מְבִיאִ֨ים מִנְחָ֤ה לַ/יהוָה֙ לִ/יר֣וּשָׁלִַ֔ם וּ/מִ֨גְדָּנ֔וֹת לִֽ/יחִזְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּנַּשֵּׂ֛א לְ/עֵינֵ֥י כָל הַ/גּוֹיִ֖ם מֵ/אַֽחֲרֵי כֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
translation:
  language: ta
  text: பலர் எருசலேமில் யாவேக்கு[a] காணிக்கையையும், யூதாவின் அரசன் எசேக்கியாவுக்குச் சிறப்பான பரிசுகளையும்[b] கொண்டுவந்து கொண்டிருந்தார்கள். இதற்குப் பிறகு, அவர் எல்லா நாடுகளின் பார்வையிலும் உயர்வாக மதிக்கப்பட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எருசலேமுக்கு.’ இச்சூழலில் எபிரேய முன்னிடைச்சொல் செல்லுமிடத்தையோ நிகழும் இடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘விலையுயர்ந்த பரிசுகள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: பலர்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் இந்தப் பெயரடை ஏராளமான மக்களைக் குறிக்கிறது; ‘பலர்’ என்பது இயல்பான, சுருக்கமான தமிழ் வடிவம்.
- source_word: מְבִיאִים
  choice: கொண்டுவந்து கொண்டிருந்தார்கள்
  rationale: இறந்தகாலக் கதைச்சூழலில் எபிரெயப் பங்கேற்புவினை தொடர்ச்சியாக நடந்த செயலைக் காட்டுவதால், தமிழ் தொடர்நிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מִנְחָה
  choice: காணிக்கை
  rationale: இச்சொல் அன்பளிப்பு அல்லது திறையைக் குறிக்கலாம்; யாவே பெறுபவராக இருப்பதால் வழிபாட்டுச் சூழலுக்கு ஏற்ற ‘காணிக்கை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: உடன்படிக்கையின் இறைப்பெயரான יהוה ஒலிபெயர்ப்பாக வழங்கப்பட்டு, לְ முன்னொட்டு பெறுபவரைக் குறிக்கும் ‘-க்கு’ வேற்றுமையால் மொழிபெயர்க்கப்பட்டது.
- source_word: לִירוּשָׁלִַם
  choice: எருசலேமில்
  rationale: இங்கு காணிக்கை செலுத்தப்பட்ட இடத்தைக் குறிக்கும் வாசிப்பு சூழலுக்கு இயல்பானது; எனினும் இலக்கைச் சுட்டும் ‘எருசலேமுக்கு’ என்ற வாசிப்பும் எபிரெய முன்னொட்டில் சாத்தியமுள்ளதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: מִגְדָּנוֹת
  choice: சிறப்பான பரிசுகள்
  rationale: தேர்ந்தெடுக்கப்பட்ட அல்லது மதிப்புமிக்க பொருட்களைப் பரிசுகளாக வழங்குவதை இச்சொல் குறிக்கிறது; உணவுப் பொருட்கள் என்று தேவையின்றிக் குறுக்காமல் இயல்பான தமிழில் தரப்பட்டது.
- source_word: לִיחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் எசேக்கியாவுக்கு
  rationale: எசேக்கியாவைப் பரிசுகளின் பெறுபவராகவும் யூதாவின் அரசனாகவும் தெளிவாக அடையாளப்படுத்துகிறது.
- source_word: וַיִּנַּשֵּׂא
  choice: மிகவும் உயர்வாக மதிக்கப்பட்டார்
  rationale: நிஃபால் வடிவம் அந்தஸ்திலும் புகழிலும் உயர்த்தப்பட்ட அல்லது உயர்வாகக் கருதப்பட்ட நிலையைச் சுட்டுகிறது; சூழலுக்கு இயல்பான தமிழில் செயப்பாட்டு பொருள் காக்கப்பட்டது.
- source_word: לְעֵינֵי כָל הַגּוֹיִם
  choice: எல்லா நாடுகளின் பார்வையிலும்
  rationale: இது நாடுகளிடையே வெளிப்படையாகப் பெற்ற மதிப்பையும் புகழையும் குறிக்கும் எபிரெயச் சொற்றொடரின் நெருக்கமான தமிழ் வடிவம்.
- source_word: מֵאַחֲרֵי כֵן
  choice: இதற்குப் பிறகு
  rationale: முந்தைய நிகழ்வுகளைத் தொடர்ந்து வந்த காலத்தைக் குறிக்கும் இயல்பான தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- issue: וַיִּנַּשֵּׂא என்பதில் உயர்த்துபவர் யார் என்பது
  choice: மிகவும் உயர்வாக மதிக்கப்பட்டார்
  alternative: மேன்மைப்படுத்தப்பட்டார்
  rationale: செயப்பாட்டு உணர்வைப் பாதுகாக்கிறது; ஆனால் யார் அவரை உயர்த்தினார் என்று மூல உரை கூறாத நிலையில், தேவனே நேரடியாகச் செய்தார் என்ற கருத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் வேதாகம உரைக்கு ஏற்ற கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. தொடர்ச்சியான செயல், இடம்/இலக்கு குறித்த உண்மையான தெளிவின்மை, எசேக்கியாவின் பொது மதிப்புயர்வு ஆகியவை தேவையற்ற விளக்கமின்றிப் பாதுகாக்கப்பட்டுள்ளன.
