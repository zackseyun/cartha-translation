  text: וְ/לֹא כִ/גְמֻ֤ל עָלָי/ו֙ הֵשִׁ֣יב יְחִזְקִיָּ֔הוּ כִּ֥י גָבַ֖הּ לִבּ֑/וֹ וַ/יְהִ֤י עָלָי/ו֙ קֶ֔צֶף וְ/עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
translation:
  language: ta
  text: ஆனால் எசேக்கியா தனக்குக் கிடைத்த நன்மைக்கு ஏற்றபடி கைம்மாறு செய்யவில்லை[a]; ஏனெனில் அவனுடைய உள்ளம் பெருமைகொண்டது. ஆகவே அவன்மீதும் யூதாவின்மீதும் எருசலேமின்மீதும் கடுங்கோபம் வந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தனக்குக் காட்டப்பட்ட தயவுக்கு ஏற்றபடி பதிலளிக்கவில்லை.” எபிரெய மொழிவழக்கு, ஒருவர் பெற்ற நன்மைக்குத் தகுந்த கைம்மாறு செய்வதைப் பரந்த பொருளில் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִגְמֻל עָלָיו
  choice: தனக்குக் கிடைத்த நன்மைக்கு ஏற்றபடி
  rationale: גְּמוּל என்பது சூழலுக்கேற்ப செய்யப்பட்ட நன்மை, கைம்மாறு அல்லது ஒருவருக்குக் கிடைத்த பலன் ஆகியவற்றைக் குறிக்கலாம். முந்தைய நிகழ்வுகளில் எசேக்கியாவுக்குக் கிடைத்த குணமாக்குதலும் விடுதலையும் கருத்தில் கொண்டு, இங்கு அவன் பெற்ற நன்மை என்ற பொருள் இயல்பானது; כִּ என்பதன் ஒப்பீட்டுப் பொருளை ‘ஏற்றபடி’ தக்கவைக்கிறது.
- source_word: הֵשִׁיב
  choice: கைம்மாறு செய்யவில்லை
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் ‘திருப்பிக் கொடுத்தல்’ அல்லது ‘பதிலாகச் செய்தல்’ என்று பொருள்படும். גְּמוּל உடன் சேர்ந்த இச்சூழலில், பெற்ற நன்மைக்குத் தகுந்த பதிலைச் செய்தல் என்ற பரந்த பொருளை ‘கைம்மாறு செய்தல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גָבַהּ לִבּוֹ
  choice: அவனுடைய உள்ளம் பெருமைகொண்டது
  rationale: எபிரெய மொழிவழக்கு சொற்படியாக ‘அவனுடைய இருதயம் உயர்ந்தது’ என்று கூறி அகந்தையைச் சுட்டுகிறது. ‘உள்ளம் பெருமைகொண்டது’ என்பது உள்ளார்ந்த ஒழுக்கநிலையைத் தக்கவைத்து நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: קֶצֶף
  choice: கடுங்கோபம்
  rationale: קֶצֶף தீவிரமான கோபத்தையோ சினத்தையோ, பல இடங்களில் இறைத் தீர்ப்புடன் தொடர்புடைய கோபத்தையோ குறிக்கிறது. ‘கடுங்கோபம்’ அதன் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיְהִי עָלָיו קֶצֶף
  choice: அவன்மீது கடுங்கோபம் வந்தது
  rationale: எபிரெய கட்டமைப்பு கோபம் அவன்மேல் ஏற்பட்டதை அல்லது வந்தடைந்ததைத் தெரிவிக்கிறது. ‘வந்தது’ தீர்ப்பின் வருகையை இயல்பாகக் காட்டுகிறது; கோபத்தின் மூலத்தை வசனம் வெளிப்படையாகச் சொல்லாததால் அதனைச் சேர்க்கவில்லை.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: யூதா, எருசலேம்
  rationale: இவை தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற இடப்பெயர் வடிவங்கள்.
theological_decisions:
- issue: எசேக்கியா பெற்ற நன்மைக்கு அளிக்க வேண்டிய பதிலின் தன்மை
  choice: அவன் பெற்ற நன்மைக்குத் தகுந்த கைம்மாறு செய்யவில்லை என்று பரந்த முறையில் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: அவன் நன்றி செலுத்தவில்லை; அல்லது கடவுளுடைய தயவுக்கு ஏற்ற நன்றியுணர்வுடன் நடக்கவில்லை.
  rationale: எபிரெய வாசகம் குறிப்பாக வாய்மொழி நன்றி செலுத்துதலை மட்டும் கூறாமல், பெற்ற நன்மைக்குத் தகுந்த பதிலைச் செய்யாததைப் பரந்த முறையில் குறிப்பிடுகிறது. ஆகவே செயலைத் தேவையின்றி குறுக்காமல் ‘கைம்மாறு செய்யவில்லை’ என வைக்கப்பட்டுள்ளது.
- issue: கடுங்கோபத்தின் மூலம்
  choice: மூலத்தைப் பெயரிட்டு வெளிப்படுத்தாமல், ‘கடுங்கோபம் வந்தது’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: கடவுளுடைய கடுங்கோபம் வந்தது; அல்லது ஆண்டவரின் கடுங்கோபம் வந்தது.
  rationale: சூழலில் இது இறைக் கோபம் என்பது தெளிவாகப் புரிந்தாலும், இவ்வசனத்தின் எபிரெய வாக்கியம் ஆண்டவரை வெளிப்படையான எழுவாயாகக் குறிப்பிடவில்லை. எனவே மூலத்தின் மறைமுகத்தன்மை பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கைம்மாறு’ மற்றும் ‘கடுங்கோபம்’ ஆகிய சொற்கள் மூலத்தின் ஒழுக்க மற்றும் தீர்ப்புச் செறிவைத் தக்கவைக்கின்றன; தேவையற்ற சமயவியல் விளக்கம் சேர்க்கப்படவில்லை.
