revisions:
- from: எசேக்கியாவே கீகோன் நீரின் மேற்புற வெளியேற்றுவாயை[a] அடைத்து, அந்த நீரைத் தாவீதின் நகரத்தின் மேற்குப் பக்கமாகக் கீழே திருப்பிவிட்டார்[b]. எசேக்கியா தாம் செய்த எல்லாவற்றிலும் வெற்றி பெற்றார்.
  to: எசேக்கியாவே கீகோன் நீரின் மேல்புற வெளியேற்றுவாயை[a] அடைத்து, அந்த நீரைத் தாவீதின் நகரத்தின் மேற்குப் பக்கத்திற்குக் கீழ்நோக்கிச் செலுத்தினார்[b]. எசேக்கியா தம் எல்லாச் செயல்களிலும் வெற்றி பெற்றார்.
  rationale: The revision corrects the directional syntax so that the waters are directed downward to the west side of the City of David, rather than merely along it. It also uses a more direct Tamil rendering of the concluding expression. Footnote a is adjusted to match the main text’s topographical ‘upper’ description and continues to preserve the lexical ambiguity of מוֹצָא.
