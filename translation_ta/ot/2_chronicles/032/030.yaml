translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வேதாகம உரைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘எசேக்கியாவே’ என்ற வடிவம் மூலத்தின் வலியுறுத்தலைச் சுருக்கமாகக் காக்கிறது; நீர்ப்பணியை விவரிக்கும் சொற்கள் மிகையான தொல்பொருள் விளக்கமின்றித் தெளிவாக வைக்கப்பட்டுள்ளன.
