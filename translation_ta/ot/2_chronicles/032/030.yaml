base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
translation:
  language: ta
  text: எசேக்கியாவே கீகோன் நீரின் மேல்புற வெளியேற்றுவாயை[a] அடைத்து, அந்த நீரைத் தாவீதின் நகரத்தின் மேற்குப் பக்கத்திற்குக் கீழ்நோக்கிச் செலுத்தினார்[b]. எசேக்கியா தம் எல்லாச் செயல்களிலும் வெற்றி பெற்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீகோனின் மேல்புற நீரூற்றை.” இதற்கான எபிரெயச் சொல் நீர் வெளிவரும் இடத்தையோ, விரிவான பொருளில் நீரூற்று அல்லது நீர் வெளியேறும் பகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அந்த நீரைக் கால்வாய் வழியாகச் செலுத்தினார்” அல்லது “அதை நேரான பாதையில் ஓடச் செய்தார்.” நீரை ஒழுங்குபடுத்தப்பட்ட பாதையில் செலுத்தியதை எபிரெய வினை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יְחִזְקִיָּהוּ
  choice: எசேக்கியாவே
  rationale: தனிப்பெயருக்கு முன் வரும் வலியுறுத்தும் சுட்டுப்பெயரின் பொருளை, இயல்பான தமிழில் ‘-வே’ என்னும் வலியுறுத்தல் உருபால் வெளிப்படுத்துகிறது.
- source_word: סָתַם
  choice: அடைத்து
  rationale: ஒரு திறப்பை மூடுதல் அல்லது நீரோட்டத்தைத் தடுத்தல் என்ற பொருளை நீர்ப்பணிச் சூழலில் இயல்பாகத் தருகிறது.
- source_word: מוֹצָא מֵימֵי גִיחוֹן הָעֶלְיוֹן
  choice: கீகோன் நீரின் மேற்புற வெளியேற்றுவாய்
  rationale: מוֹצָא என்பதிலுள்ள நீர் வெளிவரும் இடம் என்ற பொருளையும், הָעֶלְיוֹן என்பதிலுள்ள மேற்புற நிலக்குறிப்பையும் மிகையாக விளக்காமல் காக்கிறது.
- source_word: וַיַּישְּׁרֵם
  choice: அந்த நீரை … திருப்பிவிட்டார்
  rationale: ישר என்பதன் காரணவினைப் பொருள் நீரை ஒரு குறிப்பிட்ட பாதையில் செலுத்தியதைக் குறிக்கிறது; ‘திருப்பிவிட்டார்’ என்பது தமிழில் தெளிவான நீரியல் பயன்பாடு.
- source_word: לְמַטָּה מַעְרָבָה לְעִיר דָּוִיד
  choice: தாவீதின் நகரத்தின் மேற்குப் பக்கமாகக் கீழே
  rationale: கீழ்நோக்கிய நிலப்போக்கையும் மேற்குத் திசையையும் சேர்த்துக் காட்டுகிறது; நகரத்தின் மேற்குப் பக்கத்தோடு தொடரை இணைக்கும் வாசிப்பைப் பின்பற்றுகிறது.
- source_word: וַיַּצְלַח
  choice: வெற்றி பெற்றார்
  rationale: செயல்களிலும் முயற்சிகளிலும் வெற்றியடைதல் என்ற சூழல்சார் பொருளை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: தாம் செய்த எல்லாவற்றிலும்
  rationale: எபிரெய ஒருமைத் தொகுப்புச் சொல்லான ‘அவருடைய செயல்/வேலை’ என்பதைக் தமிழில் இயல்பான விரிவான தொகுப்பாக வெளிப்படுத்துகிறது.
