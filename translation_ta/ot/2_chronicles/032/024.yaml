  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה יְחִזְקִיָּ֖הוּ עַד לָ/מ֑וּת וַ/יִּתְפַּלֵּל֙ אֶל יְהוָ֔ה וַ/יֹּ֣אמֶר ל֔/וֹ וּ/מוֹפֵ֖ת נָ֥תַן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
translation:
  language: ta
  text: அந்த நாட்களில் எசேக்கியா சாகும் அளவுக்கு நோயுற்றார். அவர் யாவேவிடம் மன்றாடினார்; யாவே அவரிடம் சொன்னார்[a], அவருக்கு ஒரு அடையாளத்தைக் கொடுத்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சூழலுக்கு ஏற்ப, “அவருக்குப் பதிலளித்தார்.” எபிரேய வினை நேரடியாக “சொன்னார்” என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “அதிசயம்”; “முன்னறிகுறி” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: அந்த நாட்களில்
  rationale: எபிரேய காலக் குறிப்பை இயல்பான, நேரடியான தமிழில் தக்கவைக்கிறது.
- source_word: חָלָה
  choice: நோயுற்றார்
  rationale: நோய்வாய்ப்பட்ட நிலைக்கு வந்ததைக் குறிக்கும் வினையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: עַד לָמוּת
  choice: சாகும் அளவுக்கு
  rationale: மரணத்தை அணுகும் அளவுக்கு நோய் கடுமையாக இருந்ததைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: யாவேவிடம் மன்றாடினார்
  rationale: תפלל என்பதன் வேண்டுதல்/மன்றாட்டுப் பொருளையும், יהוה என்ற இறைப் பெயரையும் நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: וַיֹּאמֶר לוֹ
  choice: யாவே அவரிடம் சொன்னார்
  rationale: எபிரேய வினையின் அடிப்படைப் பொருளான ‘சொன்னார்’ என்பதைத் தக்கவைத்து, தொடரின் பொருளுக்காக மறைந்துள்ள எழுவாயை வெளிப்படையாக்குகிறது; ‘பதிலளித்தார்’ என்று பொருளை அமைதியாகக் குறுக்கவில்லை.
- source_word: מוֹפֵת
  choice: அடையாளம்
  rationale: இச்சூழலில் எசேக்கியாவுக்கு உறுதிப்படுத்தும் வகையில் கொடுக்கப்பட்ட அதிசய நிகழ்வைக் குறிக்க ஏற்ற, பொதுவாகப் புரியும் சொல்; சொல்லின் பிற சாத்தியப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: נָתַן לוֹ
  choice: அவருக்குக் கொடுத்தார்
  rationale: נתן வினையையும் மறைமுகச் செயப்படுபொருளையும் நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், தமிழில் ஒலிபெயர்த்துத் தருகிறது.
- issue: וַיֹּאמֶר לוֹ என்பதை ‘சொன்னார்’ அல்லது ‘பதிலளித்தார்’ என மொழிபெயர்த்தல்
  choice: சொன்னார்
  alternative: பதிலளித்தார்
  rationale: சூழலில் இது ஜெபத்திற்கான பதிலாக இருந்தாலும், எபிரேய வினை நேரடியாக ‘சொன்னார்’ என்பதே. மூலத்தின் சொற்பொருளையும் அதன் சூழல்சார் பதில் உணர்வையும் அடிக்குறிப்புடன் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. எபிரேயத்தின் தொடர்ச்சியான வாக்கிய அமைப்பு தமிழில் இயல்பாக வாசிக்க அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; குழப்பம் தவிர்க்க மறைந்துள்ள இறை எழுவாய் ‘யாவே’ என வெளிப்படுத்தப்பட்டுள்ளது.
