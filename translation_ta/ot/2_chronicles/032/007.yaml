base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
translation:
  language: ta
  text: “திடன்கொண்டு துணிவாயிருங்கள். அசீரிய அரசனைக் கண்டோ, அவனோடு இருக்கும் பெருந்திரளைக்[a] கண்டோ பயப்படாதீர்கள்; கலங்காதீர்கள். ஏனெனில், அவனோடு இருப்பவர்களைவிட நம்மோடு இருப்பவர்கள் அதிகம்.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனோடு இருக்கும் படை முழுவதையும்.” இங்கே பயன்படுத்தப்பட்டுள்ள எபிரெயச் சொல் ஒரு பெருந்திரளையோ, இச்சூழலில் திரண்ட படைவீரர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “நம்மோடு இருப்பது அவனோடு இருப்பதைவிட அதிகம்.” இது விடுபட்ட கூறுகளைக் கொண்ட ஒப்பீடு; அடுத்த வசனம் இதைத் தெளிவுபடுத்துகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: திடன்கொண்டு துணிவாயிருங்கள்
  rationale: இணையாக வரும் இரண்டு பன்மை ஏவல் வினைகளையும் இயல்பான, கண்ணியமான தமிழில் வலிமையும் துணிவும் குறிக்கும் exhortation ஆக வழங்குகிறது.
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: பயப்படாதீர்கள்; கலங்காதீர்கள்
  rationale: முதலாம் வினை பயத்தை நேரடியாகவும், Niphal வடிவிலுள்ள חתת அச்சுறுத்தலால் மனம் உடைந்து கலங்குவதைவும் இச்சூழலில் இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: அசீரிய அரசன்
  rationale: எபிரெயக் கட்டிணைப்புத் தொடரை நவீனத் தமிழில் தெளிவாகவும் சுருக்கமாகவும் வழங்குகிறது.
- source_word: כָּל הֶהָמוֹן אֲשֶׁר עִמּוֹ
  choice: அவனோடு இருக்கும் பெருந்திரள்
  rationale: הָמוֹן என்பது பெருந்திரள் அல்லது மக்கள்/படைவீரர் கூட்டத்தைக் குறிக்கலாம். இராணுவச் சூழல் இருந்தாலும் ‘படை’ என்று அளவுக்கு மீறிக் குறிப்பாக்காமல் அதன் சொற்பொருள் அகலத்தைப் பாதுகாக்கிறது.
- source_word: עִמָּנוּ רַב מֵעִמּוֹ
  choice: அவனோடு இருப்பவர்களைவிட நம்மோடு இருப்பவர்கள் அதிகம்
  rationale: மூலத்தில் விடுபட்ட கூறுகளைக் கொண்ட ஒப்பீட்டை வாசிக்க இயலும் தமிழில் அளவுசார் ஒப்பீடாக வழங்குகிறது; அடுத்த வசனத்தின் விளக்கத்தை இவ்வசனத்திற்குள் முன்கூட்டியே சேர்க்கவில்லை.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள விடுபட்ட கூறுகளைக் கொண்ட ஒப்பீடு
  choice: ‘அவனோடு இருப்பவர்களைவிட நம்மோடு இருப்பவர்கள் அதிகம்’ என்ற அளவுசார் ஒப்பீடு
  alternative: ‘நம்மோடு இருப்பவர் அவனோடு இருப்பவரைவிட பெரியவர்’ என்ற ஒருமை ஆள்சார் வாசிப்பு
  rationale: எபிரெயத்தில் רַב ஒருமை வடிவில் இருந்தாலும், சொற்றொடர் சுருக்கமானதும் விடுபட்ட கூறுகளைக் கொண்டதுமாக உள்ளது. உடனடிச் சூழல் அசீரியப் பெருந்திரளையும் யூதாவுக்கு இருக்கும் துணையையும் ஒப்பிடுகிறது; அடுத்த வசனமே இரு தரப்பின் துணையை விளக்குகிறது. ஆகவே பிற வேதாகமத் தொடர்களின் ஒருமை ஆள்சார் சொல்லாக்கத்தை இங்கே இறக்குமதி செய்யாமல் மூலத்தின் ஒப்பீட்டுத் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான ஊக்கவுரை நடையைப் பயன்படுத்தியுள்ளது. பன்மை ஏவல் வடிவங்கள் தெளிவாகக் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
