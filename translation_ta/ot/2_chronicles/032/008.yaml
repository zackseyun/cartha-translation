id: 2CH.32.8
reference: 2 Chronicles 32:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עִמּ/וֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְ/עִמָּ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לְ/עָזְרֵ֔/נוּ וּ/לְ/הִלָּחֵ֖ם מִלְחֲמֹתֵ֑/נוּ וַ/יִּסָּמְכ֣וּ הָ/עָ֔ם עַל דִּבְרֵ֖י יְחִזְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
translation:
  language: ta
  text: அவனோடு இருப்பதோ மாம்சத்தின் புயம் மட்டுமே[a]; ஆனால் நம்மோடு நம் கடவுளாகிய யாவே இருக்கிறார்; அவர் நமக்கு உதவவும் நம் போர்களைப் போரிடவும் இருக்கிறார். யூதாவின் அரசன் எசேக்கியாவின் வார்த்தைகளை மக்கள் நம்பினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “மனித வலிமை.” நேர்ச்சொல்: “மாம்சத்தின் புயம்”; இது யாவேயின் உதவிக்கு எதிராக வெறும் மனித ஆற்றலைக் குறிக்கும் உருவகம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ זְרוֹעַ בָּשָׂר
  choice: அவனோடு இருப்பது மனித வலிமை மட்டுமே
  rationale: עִמּוֹ என்பதன் ‘அவனோடு’ என்ற இணைவு அடுத்துள்ள ‘நம்மோடு’ என்பதுடனான இணை அமைப்பைப் பேணுகிறது. זְרוֹעַ בָּשָׂר என்பதன் சொற்படிமம் ‘மாம்சத்தின் புயம்’; தமிழில் அதன் கருத்தான வெறும் மனித ஆற்றலைத் தெளிவுபடுத்த ‘மனித வலிமை மட்டுமே’ என வழங்கி, சொற்படிமத்தை அடிக்குறிப்பில் வைத்துள்ளது.
- source_word: וְעִמָּנוּ
  choice: ஆனால் நம்மோடு
  rationale: וְ இங்கு மனித ஆற்றலுக்கும் இறை உதவிக்கும் இடையிலான வலுவான எதிர்மறை ஒப்பீட்டைச் சுட்டுவதால், இயல்பான தமிழில் ‘ஆனால்’ என வழங்கப்பட்டுள்ளது.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய யாவே
  rationale: יְהוָה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; אֱלֹהֵינוּ இயல்பாக ‘நம் கடவுள்’ என்று பொருள்படும். தமிழில் வாக்கியத் தொடர்புக்காக ‘நம் கடவுளாகிய’ என அமைக்கப்பட்டுள்ளது.
- source_word: לְעָזְרֵנוּ
  choice: நமக்கு உதவவும்
  rationale: לְ உடன் வந்த வினையெச்சம் இங்கு நோக்கத்தை வெளிப்படுத்துகிறது; ‘நமக்கு உதவவும்’ என்பது அதன் வினை வலிமையைப் பேணும் இயல்பான தமிழ்.
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  choice: நம் போர்களை நடத்தவும்
  rationale: ‘போர் புரிதல்’ என்ற வினையையும் அதே வேர் சார்ந்த ‘போர்கள்’ என்ற பெயர்ச்சொல்லையும் கொண்ட எபிரெயச் சொல்லமைப்பு வலியுறுத்தலைத் தருகிறது. தமிழில் ‘நம் போர்களை நடத்தவும்’ என்பது யாவே அவர்களுக்காகப் போரிடும் கருத்தை தேவையின்றி விரிவாக்காமல் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וַיִּסָּמְכוּ הָעָם עַל דִּבְרֵי
  choice: வார்த்தைகளை நம்பி மக்கள் உறுதியடைந்தார்கள்
  rationale: סמך என்பதன் அடிப்படைப் படிமம் ஒன்றின்மேல் சாய்ந்து ஆதரவு பெறுதல்; இச்சூழலில் எசேக்கியாவின் வார்த்தைகளால் நம்பிக்கையும் உறுதியும் பெற்றதைக் குறிக்கிறது. ‘நம்பி … உறுதியடைந்தார்கள்’ என்பது காரணத்தையும் விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: யூதாவின் அரசன் எசேக்கியா
  rationale: பெயரும் அரசப் பதவியும் நவீனத் தமிழின் இயல்பான அடைமொழி வரிசையில் வழங்கப்பட்டுள்ளன.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரே உள்ளது. ஆகவே பெயரின் தன்மையைப் பேண ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: மனித உதவிக்கும் இறை உதவிக்கும் இடையிலான எதிர்நிலை
  choice: ‘மட்டுமே … ஆனால்’ என எதிர்நிலையை வெளிப்படுத்துதல்
  alternative: ‘அவனோடு … நம்மோடு’ என இணைப்பை மட்டும் காட்டுதல்
  rationale: வசனத்தின் இணை அமைப்பு அசீரிய அரசனின் மனிதப் படைவலிமையையும் யாவேயின் உதவியையும் நேரடியாக எதிரெதிராக நிறுத்துகிறது. ‘மட்டுமே … ஆனால்’ என்பது இந்த உரைநடை வலிமையைத் தெளிவாக்குகிறது; புதிய கோட்பாட்டுக் கருத்தைச் சேர்ப்பதில்லை.
- issue: וַיִּסָּמְכוּ என்பதன் நம்பிக்கை/உறுதி நுட்பம்
  choice: ‘நம்பி … உறுதியடைந்தார்கள்’
  alternative: ‘வார்த்தைகளைச் சார்ந்திருந்தார்கள்’
  rationale: வினைச்சொல் உருவகமாக ஆதரவைப் பெற்று நம்பிக்கை கொள்ளுதலைக் குறிக்கிறது. தமிழில் வெறும் ‘சார்ந்திருந்தார்கள்’ என்பது செயலற்ற தொடர்நிலையாக ஒலிக்கலாம்; சூழலில் மக்களுக்கு ஏற்பட்ட மனஉறுதியைத் தெரிவிக்கத் தேர்ந்த மொழிபெயர்ப்பு ஏற்றது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘புயம்’ என்ற சொற்படிமம் முதன்மை உரையில் செயற்கையாக ஒலிப்பதால் கருத்து உரையில் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது. இறைப் பெயர் ‘யாவே’ என்றும், Hezekiah ‘எசேக்கியா’ என்றும் வழங்கப்பட்டுள்ளன.
