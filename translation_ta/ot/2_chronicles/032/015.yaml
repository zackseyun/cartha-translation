  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
translation:
  language: ta
  text: இப்போது எசேக்கியா உங்களை ஏமாற்றவோ, இவ்வாறு உங்களைத் தூண்டவோ[a] விடாதீர்கள்; அவனை நம்பாதீர்கள். ஏனெனில் எந்த நாட்டுக்கும் அரசாட்சிக்கும் உரிய எந்தத் தெய்வமும் தன் மக்களை என் கையிலிருந்தும் என் முன்னோர்களின் கையிலிருந்தும்[b] விடுவிக்க முடிந்ததில்லை. அப்படியிருக்க, உங்கள் கடவுள் உங்களை என் கையிலிருந்து எப்படித்தான் விடுவிப்பார்![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூண்டவோ” என்பதற்கு “இணங்கச் செய்யவோ” அல்லது “கவர்ந்திழுக்கவோ” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் கையிலிருந்தும் என் முன்னோர்களின் கையிலிருந்தும்” என்பது எபிரேயத்தின் சொற்படி அமைப்பு; இங்கு “கை” அதிகாரத்தையோ கட்டுப்பாட்டையோ குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “உங்கள் கடவுள் உங்களை என் கையிலிருந்து நிச்சயமாக விடுவிக்கமாட்டார்” என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்றொடர் வலியுறுத்தப்பட்ட எதிர்மறை முடிவைக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: உடனடியான எச்சரிக்கைக்கு மாறும் உரையாடல் தொடர்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יַשִּׁיא
  choice: ஏமாற்ற
  rationale: ஒருவரைத் தவறாக நம்பச் செய்தல் அல்லது வழிதவறச் செய்தல் என்ற வினையின் பொருளை நேரடியாகத் தருகிறது.
- source_word: יַסִּית
  choice: தூண்ட
  rationale: முந்தைய ‘ஏமாற்ற’ என்பதோடு ஒன்றாக்காமல், ஒருவரின் சொற்களால் பிறரை ஒரு நிலைப்பாட்டுக்கு நகர்த்தும் வினையின் வலிமையைப் பாதுகாக்கிறது; சூழலில் ‘இணங்கச் செய்ய’ என்பதும் சாத்தியம்.
- source_word: כָּזֹאת
  choice: இவ்வாறு
  rationale: எசேக்கியா பேசுவதாகக் கூறப்படும் விதத்தையும் கருத்தையும் சுட்டும் எபிரேயச் சுட்டுப்பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: תַּאֲמִינוּ לוֹ
  choice: அவனை நம்பாதீர்கள்
  rationale: இங்கு எசேக்கியாவின் கூற்றை ஏற்றுக்கொள்ள வேண்டாம் என்பதே மையம்; தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כָּל אֱלוֹהַ כָּל גּוֹי וּמַמְלָכָה
  choice: எந்த நாட்டையோ அரசையோ சேர்ந்த எந்தத் தெய்வமும்
  rationale: தெய்வங்கள் நாடுகளோடும் அரசுகளோடும் தொடர்புடையவை என்ற உலகளாவிய கூற்றைத் தெளிவான தமிழில் தருகிறது.
- source_word: לְהַצִּיל
  choice: விடுவிக்க
  rationale: எதிரியின் அதிகாரத்திலிருந்து மீட்பது என்ற இராணுவச் சூழலுக்குப் பொருத்தமான பொதுத் தமிழ் சொல்.
- source_word: מִיָּדִי וּמִיַּד אֲבוֹתָי
  choice: என் கையிலிருந்தும் என் முன்னோர்களின் கையிலிருந்தும்
  rationale: ‘கை’ என்பது அதிகாரம் அல்லது கட்டுப்பாட்டைக் குறிக்கும் எபிரேய உருவகத்தைப் பாதுகாக்கிறது; אֲבוֹתָי இங்கு அரச முன்னோர்களை அல்லது முந்தைய ஆட்சியாளர்களைக் குறிக்கிறது.
- source_word: אַף כִּי
  choice: அப்படியிருக்க ... ஆ என்ன!
  rationale: முந்தைய வரலாற்றுக் கூற்றிலிருந்து இன்னும் வலுவான எதிர்மறை முடிவுக்கு நகரும் இகழ்ச்சியான வாதத்தை இயல்பான தமிழ் வினாவாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵיכֶם
  choice: உங்கள் கடவுள்
  rationale: வடிவில் பன்மையாக இருந்தாலும், சூழலில் யூதாவின் ஒரே கடவுளைக் குறிக்கும் ஒருமைப் பயன்பாடு.
theological_decisions:
- issue: אֱלֹהֵיכֶם என்பதன் எண்ணும் குறிப்பும்
  choice: யூதா/இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் ‘உங்கள் கடவுள்’
  alternative: வடிவியல் பன்மையைப் பின்பற்றி ‘உங்கள் தெய்வங்கள்’
  rationale: சூழலும் எபிரேயத்தில் இஸ்ரவேலின் கடவுளுக்குப் பயன்படுத்தப்படும் வழக்கமான אֱלֹהִים வடிவமும் ஒருமைக் குறிப்பைத் தேவைப்படுத்துகின்றன.
- issue: அசீரியப் பேச்சாளரின் இறையியல் கூற்று
  choice: அவருடைய இகழ்ச்சியான கூற்றாகவே, மறைமுகத் திருத்தமின்றி மொழிபெயர்க்கப்பட்டது
  alternative: கடவுள் உண்மையில் விடுவிக்க வல்லவர் என்பதை மொழிபெயர்ப்பிலேயே விளக்குதல்
  rationale: வசனம் எதிரியின் உரையைப் பதிவு செய்கிறது; மொழிபெயர்ப்பு அந்தக் கதாபாத்திரத்தின் தவறான பெருமிதத்தையும் கதையின் இறையியல் பதற்றத்தையும் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், அசீரியப் பேச்சாளரின் அச்சுறுத்தலும் இகழ்ச்சியும் தெளிவாக ஒலிக்கும் கண்ணியமான பொது நடையில் அமைக்கப்பட்டது. ‘கர்த்தர்’ போன்ற சமய மரபுசார் பெயர் இங்கு மூலத்தில் இல்லாததால் சேர்க்கப்படவில்லை; ‘உங்கள் கடவுள்’ என்று சூழலுக்கேற்ப தரப்பட்டது.
