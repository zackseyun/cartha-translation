  naturalness: ‘ஆலயத்துக்குள் நுழையும்போதெல்லாம்’ என்பது ‘ஆலயத்திற்குள் செல்லும்போதெல்லாம்’ என்பதைவிட இயல்பாகவும், எபிரெய ‘ஆலயத்தினுள் வருதல்’ என்பதற்கும் நெருக்கமாகவும் உள்ளது. இறுதிச் செயலை ‘அறைக்குத் திரும்பக் கொண்டு வந்து வைப்பார்கள்’ எனச் சொல்வது நவீனத் தமிழில் தெளிவானது.
