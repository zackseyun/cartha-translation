  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֛י מִ/דֵּי ב֥וֹא הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה בָּ֤אוּ הָ/רָצִים֙ וּ/נְשָׂא֔וּ/ם וֶ/הֱשִׁב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
translation:
  language: ta
  text: அரசன் யாவேயின் ஆலயத்துக்குள் நுழையும்போதெல்லாம், காவலர்கள்[a] வந்து அவற்றை[b] எடுத்துச் செல்வார்கள்; பின்னர் அவற்றைக் காவலர்களின் அறைக்குத்[c] திரும்பக் கொண்டு வந்து வைப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக ‘ஓடுகிறவர்கள்’; அரசனின் மெய்க்காவலர்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவை’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வெண்கலக் கேடயங்களைக் குறிக்கிறது.
    reason: cross_reference
  - marker: c
    text: அல்லது ‘காவலறை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  choice: செல்லும்போதெல்லாம்
  rationale: מִדֵּי + infinitive மீண்டும் மீண்டும் நிகழ்வதைக் குறிக்கிறது; ‘செல்லும்போதெல்லாம்’ அந்தத் தொடர்நிகழ்வை இயல்பான தமிழில் தருகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் ஆலயம்
  rationale: எபிரெயில் நேரடியாக ‘யாவேயின் வீடு’ என்றாலும், இச்சூழலில் ஆலயத்தைக் குறிக்கிறது; ‘ஆலயம்’ நவீனத் தமிழில் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் எபிரெய மெய்யெழுத்துகளான YHWH-ஐப் பெயராகவே பிரதிபலிக்கிறது; பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றவில்லை.
- source_word: הָרָצִים
  choice: காவலர்கள்
  rationale: சொல்லுக்கு நேரடியாக ‘ஓடுகிறவர்கள்’ என்ற பொருள் இருந்தாலும், அரசவைக் சூழலில் இது அரசனின் மெய்க்காவல் படையினரைக் குறிக்கிறது.
- source_word: וּנְשָׂאוּם
  choice: அவற்றைச் சுமந்து செல்வார்கள்
  rationale: வினைச்சொல் கேடயங்களை எடுத்துச் சுமப்பதைக் குறிக்கிறது; பன்மைப் பிரதிப்பெயரின் முன்னிடைச் சுட்டும் பொருளை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: וֶהֱשִׁיבוּם
  choice: அவற்றை ... திரும்ப வைத்துவிடுவார்கள்
  rationale: שׁוב என்பதன் Hiphil வடிவம் பொருட்களை அவற்றின் இடத்துக்குத் திருப்பிக் கொண்டுவந்து வைப்பதைக் குறிக்கிறது.
- source_word: תָּא
  choice: அறை
  rationale: சிறிய தனி அறை அல்லது அறைப்பகுதியைக் குறிக்கும் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் YHWH என்ற தனிப்பட்ட திருநாமத்தைப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் பெயராகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் மீள்நிகழ்வு உணர்வும் செயல்களின் வரிசையும் காக்கப்பட்டுள்ளன; ‘இல்லம்’ என்பதற்குப் பதிலாக சூழலுக்கேற்ற ‘ஆலயம்’ பயன்படுத்தப்பட்டது.
