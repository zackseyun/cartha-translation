  source_fidelity: மூல எபிரெயத்தின் இராணுவ எண்ணிக்கைகள், ‘எண்ணிக்கையில்லாத’ மக்கள் என்ற சொற்றொடர், எகிப்திலிருந்து அவனுடன் வந்தமை, மற்றும் மூன்று இனப்பெயர்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன. עָם என்பதற்கு ‘மக்கள்’ எனத் தரப்பட்டிருப்பது மூலத்தின் பொதுத்தன்மையைப் பேணுகிறது.
  naturalness: நவீன பொதுத்தமிழில் வாசிக்க இயல்பாக உள்ளது. ‘எண்ணிக்கையற்றவர்களாய் இருந்தனர்’ என்பது மரியாதையான விவிலிய நடையில் இயல்பானது; இராணுவப் பட்டியல் மற்றும் அதன் பின் வரும் இனப்பெயர் விளக்கமும் தெளிவாக உள்ளது.
  terminology: ‘தேர்கள்,’ ‘குதிரைவீரர்கள்,’ ‘லிபியர்கள்,’ ‘சுக்கியர்கள்,’ ‘கூஷியர்கள்’ ஆகியவை பொருத்தமானவை. உறுதியற்ற சுக்கியர் அடையாளமும், கூஷ்/எத்தியோப்பியா தொடர்பான வரலாற்று-புவியியல் வேறுபாடும் அடிக்குறிப்புகளில் அளவோடு விளக்கப்பட்டுள்ளன.
