translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் வினையுடன் இலக்கண ரீதியாகத் தொடரும் எபிரெய அமைப்பை உணர்த்துவதற்காக முதல் இராணுவ எண்ணிக்கைக்குப் பின் அரைப்புள்ளி வைக்கப்பட்டுள்ளது. இனப்பெயர்களில் உறுதியற்ற தன்மை அடிக்குறிப்புகளில் வெளிப்படையாகப் பேணப்பட்டுள்ளது.
