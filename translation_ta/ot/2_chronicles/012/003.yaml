source:
  edition: WLC
  text: בְּ/אֶ֤לֶף וּ/מָאתַ֨יִם֙ רֶ֔כֶב וּ/בְ/שִׁשִּׁ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֣ין מִסְפָּ֗ר לָ/עָ֞ם אֲשֶׁר בָּ֤אוּ עִמּ/וֹ֙ מִ/מִּצְרַ֔יִם לוּבִ֥ים סֻכִּיִּ֖ים וְ/כוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
translation:
  language: ta
  text: 1,200 தேர்களோடும் 60,000 குதிரைவீரர்களோடும்; அவனுடன் எகிப்திலிருந்து வந்த மக்கள் எண்ணிக்கையற்றவர்களாய் இருந்தனர்[a]—லிபியர்கள், சுக்கியர்கள்[b], கூஷியர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எண்ண முடியாதவர்களாய் இருந்தனர்’; சொல்லுக்குச் சொல், ‘மக்களுக்கு எண்ணிக்கை இல்லை.’
    reason: lexical_alternative
  - marker: b
    text: ‘சுக்கியர்கள்’ என்பது துல்லியமாக அடையாளம் காண முடியாத ஓர் இனப்பெயரின் ஒலிபெயர்ப்பு; இதை ‘சுக்கீம்’ என்றும் ஒலிபெயர்க்கலாம்.
    reason: cultural_note
  - marker: c
    text: ‘கூஷியர்கள்’ என்பதற்குப் பதிலாக ‘எத்தியோப்பியர்கள்’ என்றும் மொழிபெயர்க்கப்படுகிறது; ஆனால் ‘கூஷியர்கள்’ என்பது எபிரெய இன-புவியியல் பெயரை இன்னும் நேரடியாகப் பிரதிபலிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶלֶף וּמָאתַיִם רֶכֶב
  choice: 1,200 தேர்களோடும்
  rationale: எண்ணிக்கையுடன் வரும் רֶכֶב என்பதைத் தனித்தனி தேர்களாகக் கொள்வது இயல்பானது; בְּ முன்னொட்டு உடனிருப்பதைக் குறிக்கும் இணைப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: וּבְשִׁשִּׁים אֶלֶף פָּרָשִׁים
  choice: 60,000 குதிரைவீரர்களோடும்
  rationale: פָּרָשִׁים என்பது இச்சூழலில் குதிரைமேல் போரிடும் வீரர்களைக் குறிக்கிறது; இராணுவப் பட்டியலின் இணை அமைப்பும் காக்கப்பட்டது.
- source_word: וְאֵין מִסְפָּר לָעָם
  choice: மக்கள் எண்ணிக்கையற்றவர்களாய் இருந்தனர்
  rationale: ‘மக்களுக்கு எண்ணிக்கை இல்லை’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான தமிழில் தருகிறது; עָם என்பதைக் குறிப்பாக ‘படை’ என்று சுருக்காமல் ‘மக்கள்’ எனப் பேணுகிறது.
- source_word: אֲשֶׁר בָּאוּ עִמּוֹ מִמִּצְרַיִם
  choice: அவனுடன் எகிப்திலிருந்து வந்த
  rationale: உடன்வருதலையும் புறப்பட்ட இடமாகிய எகிப்தையும் மூலத்தின் வரிசைக்கு நெருக்கமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: לוּבִים
  choice: லிபியர்கள்
  rationale: இனப்பெயரின் பரவலாக ஏற்கப்பட்ட வரலாற்று அடையாளத்தை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: סֻכִּיִּים
  choice: சுக்கியர்கள்
  rationale: துல்லியமான அடையாளம் உறுதியில்லாத இனப்பெயரை மேலதிக விளக்கம் புகுத்தாமல் ஒலிபெயர்க்கிறது.
- source_word: כּוּשִׁים
  choice: கூஷியர்கள்
  rationale: כּוּשׁ என்ற பண்டைய இன-புவியியல் பெயரை நேரடியாகப் பிரதிபலிக்கிறது; அதை நவீன ‘எத்தியோப்பியர்கள்’ என்ற பெயருடன் முழுமையாக ஒப்பிடுவதைத் தவிர்க்கிறது.
