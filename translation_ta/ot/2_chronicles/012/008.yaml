source:
  edition: WLC
  text: כִּ֥י יִהְיוּ ל֖/וֹ לַ/עֲבָדִ֑ים וְ/יֵדְעוּ֙ עֲב֣וֹדָתִ֔/י וַ/עֲבוֹדַ֖ת מַמְלְכ֥וֹת הָ/אֲרָצֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/008.yaml
  text: For they will become his servants[a], so that they may know my service and the service of the kingdoms of the lands.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் அவனுக்கு அடிமைகளாவார்கள்; அதனால், எனக்குச் செய்யும் சேவையையும்[a] நாடுகளின் அரசுகளுக்குச் செய்யும் சேவையையும் அவர்கள் அறிந்துகொள்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கான வழிபாட்டையும் ... நாடுகளின் அரசுகளுக்கான சேவையையும்.” “சேவை” என்பதற்கான எபிரெயச் சொல், வழிபாட்டுத்தன்மை கொண்ட சேவையையும் அடிமைப் பணியையோ உழைப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய இறைச்செயலுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִהְיוּ לוֹ לַעֲבָדִים
  choice: அவர்கள் அவனுக்கு அடிமைகளாவார்கள்
  rationale: היה + ל கட்டமைப்பின் ‘ஆகுதல்’ என்ற பொருளையும், சீஷாக்கின் கீழான அரசியல் அடிமைத்தனத்தின் வலிமையையும் காக்கிறது.
- source_word: וְיֵדְעוּ
  choice: அப்போது ... அறிந்துகொள்வார்கள்
  rationale: இணைப்புச் சொல்லுடன் வரும் இந்த வினை சூழலில் விளைவு மற்றும் கற்றறிதல் ஆகிய இரண்டையும் உணர்த்துகிறது; ‘அறிந்துகொள்வார்கள்’ என்பது ידע என்பதற்கு இயல்பான இணை.
- source_word: עֲבוֹדָתִי
  choice: எனக்குச் சேவை செய்வது
  rationale: עֲבוֹדָה என்பதிலுள்ள சேவை, கீழ்ப்படிதல், வழிபாடு ஆகிய பரப்பை ஒரே பொருளாகச் சுருக்காமல் காக்கிறது; தமிழில் இயல்புக்காக பெயர்ச்சொல் அமைப்பு வினைத்தொடராக வழங்கப்படுகிறது.
- source_word: וַעֲבוֹדַת
  choice: சேவை செய்வது
  rationale: முதல் עֲבוֹדָה சொல்லுடனான திட்டமிட்ட சொல் ஒற்றுமையையும் இருவகைச் சேவைகளின் ஒப்பீட்டையும் காக்கிறது.
- source_word: מַמְלְכוֹת הָאֲרָצוֹת
  choice: நாடுகளின் அரசுகள்
  rationale: பல அந்நிய அரசாட்சிகளைக் குறிக்கும் பன்மை அரசியல் பொருளை நவீனத் தமிழில் தெளிவாக வழங்குகிறது; ‘பூமியின் அரசுகள்’ என்று மிகைப்படுத்தப்பட்ட உலகளாவிய பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: கடவுளைக் குறிக்கும் עֲבוֹדָה என்பதை ‘சேவை’ என்றா, ‘வழிபாடு’ என்றா மொழிபெயர்ப்பது
  choice: சேவை செய்வது
  alternative: வழிபடுவது
  rationale: இந்த வசனம் ஆண்டவருக்கான பற்றுறுதியையும் உலக அரசுகளுக்கான கட்டாயப் பணிவையும் எதிரெதிராக நிறுத்துகிறது. ‘சேவை’ என்பது சமய வழிபாட்டையும் உட்படுத்தக்கூடியதாய் இருந்து, எபிரெயச் சொல்லின் சமய மற்றும் அரசியல் பரிமாணங்களைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அடிமைகள்’ என்பது இச்சூழலின் கட்டாய அரசியல் கீழ்ப்படிதலைத் தெளிவாக்குகிறது. ஒரே எபிரெயச் சொல்லின் மறுபயன்பாட்டைத் தமிழிலும் ‘சேவை செய்வது’ என்று இருமுறை வழங்கி சொல்லாடல் இணைநிலையைப் பாதுகாத்துள்ளோம்.
