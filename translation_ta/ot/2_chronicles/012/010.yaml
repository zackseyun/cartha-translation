translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ராஜா’ மற்றும் ‘அரண்மனை’ என்பவை அரசவைக் சூழலைத் தெளிவாக்குகின்றன; הָרָצִים என்பதின் சொல்லர்த்தம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
