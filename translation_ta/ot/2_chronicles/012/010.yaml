base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
translation:
  language: ta
  text: ஆகவே, ராஜா ரெகொபெயாம் அவற்றுக்குப் பதிலாக வெண்கலக் கேடயங்களைச் செய்து,[b] அவற்றை அரண்மனைக் காவலர்களின்[a] தலைவர்களிடம் ஒப்படைத்தான்; அந்தக் காவலர்கள் ராஜாவின் அரண்மனையின் நுழைவாயிலைக் காவல் காத்துவந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “ஓடுகிறவர்கள்.” இவர்கள் அரச தூதர்களாகவும் அரண்மனைக் காவலர்களாகவும் பணியாற்றிய அரச காவற்படையினராக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, முந்தைய வசனத்தில் சீஷாக் எடுத்துச் சென்ற தங்கக் கேடயங்களுக்குப் பதிலாக வெண்கலக் கேடயங்கள் செய்யப்பட்டன.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்து
  rationale: עשה என்பதன் அடிப்படைப் பொருளான ‘செய்தல்/உருவாக்குதல்’ என்பதை இயல்பான தமிழ் கதைநடையில் தருகிறது.
- source_word: תַּחְתֵּיהֶם
  choice: அவற்றுக்குப் பதிலாக
  rationale: תחת இங்குப் பதிலீட்டைக் குறிக்கிறது; முந்தைய வசனத்தில் எடுத்துச் செல்லப்பட்ட தங்கக் கேடயங்களை இச்சுட்டுப்பெயர் குறிக்கிறது.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: வெண்கலக் கேடயங்கள்
  rationale: נְחֹשֶׁת செம்பு அல்லது வெண்கலத்தைக் குறிக்கலாம்; ஆயுதச் சூழலில் ‘வெண்கலம்’ பொருத்தமான பொதுவான தெரிவாகும்.
- source_word: וְהִפְקִיד עַל יַד
  choice: தலைவர்களிடம் ஒப்படைத்தான்
  rationale: பாதுகாப்புப் பொறுப்பில் வைத்தல் அல்லது ஒருவரின் கவனிப்பில் ஒப்படைத்தல் என்ற ஒருங்கிணைந்த கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׂרֵי
  choice: தலைவர்கள்
  rationale: שָׂרִים என்பது அதிகாரிகள் அல்லது தலைவர்களைக் குறிக்கிறது; இக்காவல் அமைப்பின் சூழலில் ‘தலைவர்கள்’ தெளிவாகவும் அளவுக்கு மீறிய இராணுவத் துல்லியமின்றியும் உள்ளது.
- source_word: הָרָצִים
  choice: அரண்மனைக் காவலர்கள்
  rationale: சொல்லர்த்தமாக ‘ஓடுகிறவர்கள்’; அரசவைக் சூழலில் அரசருக்குச் சேவை செய்த தூதர்-காவலர் குழுவைக் குறிக்கிறது. செயல்பாட்டை முதன்மைப்படுத்தி மொழிபெயர்த்து, சொல்லர்த்தத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: הַשֹּׁמְרִים
  choice: காவல் காத்துவந்தார்கள்
  rationale: எபிரெயப் பங்கேற்புவினை அவர்களின் தொடர்ச்சியான காவல் பணியைக் குறிக்கிறது; ‘காத்துவந்தார்கள்’ அந்த நீடித்த தன்மையை வெளிப்படுத்துகிறது.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: ராஜாவின் அரண்மனை நுழைவாயில்
  rationale: சொல்லர்த்தம் ‘ராஜாவின் வீட்டின் நுழைவாயில்’; சூழலில் அது அரச வாசஸ்தலமாகிய அரண்மனையைச் சுட்டுவதால் நவீன தமிழில் தெளிவாக வழங்கப்பட்டுள்ளது.
