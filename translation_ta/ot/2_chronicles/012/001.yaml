language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/הָכִ֞ין מַלְכ֤וּת רְחַבְעָם֙ וּ/כְ/חֶזְקָת֔/וֹ עָזַ֖ב אֶת תּוֹרַ֣ת יְהוָ֑ה וְ/כָל יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
translation:
  language: ta
  text: ரெகொபெயாமின் அரசாட்சி நிலைபெற்று, அவன் வலிமையடைந்தபோது, அவன் யாவேயின் சட்டத்தை[a] கைவிட்டான்; இஸ்ரவேலர் அனைவரும் அவனோடு சேர்ந்து அதைக் கைவிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் போதனையை.” எபிரெய மொழியிலுள்ள தோரா என்ற சொல் சூழலுக்கேற்ப “சட்டம்” அல்லது “போதனை” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהָכִין
  choice: நிலைபெற்று ... போது
  rationale: எபிரெயக் கதைத் தொடரின் காலச் சூழலை இயல்பான தமிழில் காட்டுகிறது; כון என்பதன் அரசாட்சி உறுதிப்பட்டதைக் குறிக்கும் பொருளையும் தக்கவைக்கிறது.
- source_word: מַלְכוּת רְחַבְעָם
  choice: ரெகொபெயாமின் அரசாட்சி
  rationale: מַלְכוּת இங்கு நிலப்பரப்பை மட்டும் அல்லாமல் அரசரின் ஆட்சிநிலையையும் குறிக்கலாம்; ‘அரசாட்சி’ அந்தப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וּכְחֶזְקָתוֹ
  choice: அவன் வலிமையடைந்தபோது
  rationale: חזק என்பதன் வலிமை அல்லது உறுதிநிலை அடைந்த பொருளை, ரெகொபெயாமே குறிக்கப்படுவதை வெளிப்படுத்தி மொழிபெயர்க்கிறது.
- source_word: עָזַב
  choice: கைவிட்டான்
  rationale: உடன்படிக்கை சார்ந்த விலகலைத் தெளிவாகவும் நவீன தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תּוֹרַת יְהוָה
  choice: யெகோவாவின் சட்டத்தை
  rationale: תּוֹרָה என்பதற்கு இச்சூழலில் ‘சட்டம்’ பொருத்தமானது; யெகோவா என்ற இறைப் பெயர் பெயராகவே வழங்கப்படுகிறது. ‘போதனை’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: இஸ்ரவேலர் அனைவரும் அவனோடு சேர்ந்து அதைக் கைவிட்டார்கள்
  rationale: எபிரெயில் சுருக்கமாக விடப்பட்டுள்ள வினையைத் தமிழில் இயல்புக்கும் தெளிவுக்கும் ஏற்ப மீட்டுரைக்கிறது; ‘அனைத்து இஸ்ரவேல்’ என்பதன் வரலாற்றுச் சூழல் சார்ந்த தெளிவின்மையை ‘இஸ்ரவேலர் அனைவரும்’ எனக் காக்கிறது.
theological_decisions:
- issue: பிளவுபட்ட அரசாட்சிக் காலத்தில் ‘இஸ்ரவேலர் அனைவரும்’ என்பதன் வரம்பு
  choice: இஸ்ரவேலர் அனைவரும்
  alternative: யூதா மக்கள் அனைவரும் / அவனுடைய மக்கள் அனைவரும்
  rationale: நாளாகமம் இச்சூழலிலும் ‘இஸ்ரவேல்’ என்ற பெயரைப் பயன்படுத்துகிறது. அது யாரைத் துல்லியமாக உள்ளடக்குகிறது என்பதை மொழிபெயர்ப்பில் குறுக்காமல், மூலத்தின் பதற்றத்தையும் சொல்லாட்சியையும் பாதுகாக்கிறது.
- issue: תּוֹרָה என்பதன் பொருள்
  choice: சட்டம்
  alternative: போதனை
  rationale: வரலாற்று-உடன்படிக்கைச் சூழலில் ‘சட்டம்’ முதன்மைப் பொருளாகப் பொருந்துகிறது; எனினும் ‘போதனை’ என்ற விரிவான பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. எபிரெயின் சுருக்கமான இறுதிக் கூறு தமிழில் தெளிவாக இருக்க வினை மீட்டுரைக்கப்பட்டது.
