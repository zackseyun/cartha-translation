source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ הָ/רָ֑ע כִּ֣י לֹ֤א הֵכִין֙ לִבּ֔/וֹ לִ/דְר֖וֹשׁ אֶת יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/014.yaml
  text: And he did what was evil[a], because he had not set his heart to seek Yahweh.
translation:
  language: ta
  text: அவன் தீமை செய்தான்; ஏனெனில், யாவேவைத் தேடுவதற்குத் தன் இதயத்தை ஆயத்தப்படுத்தவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: செய்தான்
  rationale: עשה என்பதன் Qal wayyiqtol வடிவம் கதையின் தொடர்ச்சியான விளைவைச் சுட்டுகிறது; தமிழில் இயல்பான வாக்கிய அமைப்பில் ‘செய்தான்’ நேரடியான மொழிபெயர்ப்பு.
- source_word: הָרָע
  choice: தீமையானதை
  rationale: குறிப்புச் சுட்டியுடன் வரும் இச்சொல் ஒழுக்க ரீதியாகத் தீமையான செயலைக் குறிக்கிறது; ‘தீமையானதை’ என்பது பொருளை இயல்பாகக் காக்கிறது.
- source_word: כִּי
  choice: …ஆததால்
  rationale: இங்கு כִּי முந்தைய மதிப்பீட்டிற்கான காரணத்தைக் கூறுகிறது; தமிழில் காரணத் தொடர்பைத் தெளிவாக வெளிப்படுத்த வினையெச்ச விகுதி பயன்படுத்தப்பட்டது.
- source_word: לֹא הֵכִין
  choice: ஆயத்தப்படுத்தாததால்
  rationale: כון என்பதன் Hiphil வடிவம் ஆயத்தப்படுத்துதல், நிலைப்படுத்துதல், உறுதியாக அமைத்தல் ஆகிய நிழற்பொருள்களை உடையது. ‘இதயம்’ மற்றும் நோக்கத்தைக் குறிக்கும் தொடருடன் ‘ஆயத்தப்படுத்து’ மூலத்தின் உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: לִבּוֹ
  choice: தன் இதயத்தை
  rationale: לֵב இங்கு சிந்தனை, மனவுறுதி, உள்நோக்கம் ஆகியவற்றை உள்ளடக்கிய அகமனிதனைக் குறிக்கிறது; ‘இதயம்’ எபிரேய உருவகத்தைப் பாதுகாக்கிறது. எழுவாயையே சுட்டுவதால் தமிழில் ‘தன்’ இயல்பானது.
- source_word: לִדְרוֹשׁ
  choice: தேடுவதற்கு
  rationale: דרשׁ கடவுளை நோக்கிப் பயன்படுத்தப்படும்போது அவரை நாடுதல் அல்லது அவரிடம் விசாரித்தல் என்ற பொருளைக் கொள்ளலாம்; ‘தேடு’ இந்த இரண்டையும் தேவையின்றிக் குறுக்காமல் சுருக்கமாகக் காக்கிறது.
- source_word: אֶת יְהוָה
  choice: யாவேவை
  rationale: אֶת நேரடி செயப்படுபொருள் குறியீடு; יהוה உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கப்பட்டது. தமிழ் வேற்றுமை உருபுடன் ‘யாவேவை’ என வழங்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்லாமல் நான்கெழுத்து இறைப்பெயர் நேரடியாக உள்ளது; அதனைப் பட்டப்பெயராக மாற்றாமல் நவீன தமிழில் அறியப்பட்ட ‘யாவே’ என ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: இதயத்தை ஆயத்தப்படுத்துதல் என்பதன் பொருள்
  choice: உள்ளார்ந்த மனவுறுதியைச் சுட்டும் உருவகத்தை அப்படியே வைத்தல்
  alternative: மனதை உறுதியாகச் செலுத்துதல்
  rationale: இத்தொடர் அறிவுச் செயலையே மட்டும் அல்லாமல் நோக்கம், விருப்பம், மனவுறுதி ஆகிய முழு அகநிலையையும் குறிக்கிறது; ஆகவே விளக்கமாகச் சுருக்காமல் எபிரேய உருவகம் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டது. தமிழ் இயல்புக்காக காரணத் தொடர் முதலில் வைக்கப்பட்டது; மூலத்தின் காரண உறவு முழுமையாகக் காக்கப்பட்டது.
