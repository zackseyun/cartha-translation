  verdict: revise
  source_fidelity: 'கருத்து முழுமையாக மூலத்தோடு பொருந்துகிறது: ரெகொபெயாம் தீமை செய்ததற்கான காரணமாக, யாவேவை நாடுவதற்குத் தன் இதயத்தை ஆயத்தப்படுத்தாததையே வசனம் கூறுகிறது. இருப்பினும் மூலத்தின் முதன்மை மதிப்பீட்டையும் அதைத் தொடரும் காரணத்தையும் நேரடியாகக் காட்டும் வாக்கிய அமைப்பு சிறந்தது.'
