source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ שָׂרֵֽי יִשְׂרָאֵ֖ל וְ/הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֖וּ צַדִּ֥יק יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
translation:
  language: ta
  text: அப்போது இஸ்ரவேலின்[a] தலைவர்களும் அரசனும் தங்களைத் தாழ்த்தினார்கள்; “யாவே நீதியுள்ளவர்” என்று சொன்னார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “இஸ்ரவேலின் தலைவர்கள்.” இச்சூழலில் இது ரெகொபெயாமின் ஆட்சிக்குட்பட்ட யூதாவின் தலைவர்களையே குறிப்பதாகச் சிலர் புரிந்துகொள்கிறார்கள்; ஆனால் மூல உரை “இஸ்ரவேல்” என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: தங்களைத் தாழ்த்தி
  rationale: כנע என்பதன் நிஃபால் வடிவம் இங்கு தீர்க்கதரிசியின் கண்டிப்புக்குப் பதிலாகத் தாமே தாழ்மையடைந்து பணிந்ததைக் குறிக்கிறது. தமிழ் தொடரில் இயல்பாகவும் செயப்படுபொருள் சார்ந்த நுணுக்கத்துடனும் இதை வெளிப்படுத்துகிறது.
- source_word: שָׂרֵי
  choice: தலைவர்கள்
  rationale: שָׂרִים என்பது ஆளும் அதிகாரிகள் அல்லது பிரபுக்களைக் குறிக்கிறது. ‘தலைவர்கள்’ என்பது இன்றைய வாசகர்களுக்குத் தெளிவானதும் சூழலுக்கு ஏற்றதுமான பொதுச் சொல்.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: உடனடிச் சூழல் யூதாவைப் பற்றியதாக இருந்தாலும், எபிரெய உரை வெளிப்படையாக ‘இஸ்ரவேல்’ என்கிறது. ஆகவே உரையை யூதா என்று ஒத்திசைக்காமல் மூலச் சொல்லே பாதுகாக்கப்படுகிறது.
- source_word: וְהַמֶּלֶךְ
  choice: அரசனும்
  rationale: தலைவர்களிலிருந்து அரசனைத் தனியாக இணைத்துக் காட்டும் எபிரெய இணைப்பைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது.
- source_word: וַיֹּאמְרוּ
  choice: என்றார்கள்
  rationale: முன்னுள்ள பன்மை எழுவாயைக் கொண்டு, அவர்கள் கூறிய அறிவிப்பை இயல்பான தமிழ் நேர்கூற்றாக நிறைவு செய்கிறது.
- source_word: צַדִּיק
  choice: நீதியுள்ளவர்
  rationale: இங்கு யாவேயின் தீர்ப்பும் செயல்பாடும் நீதியானவை என்பதைச் சுட்டுகிறது. ‘நீதியுள்ளவர்’ என்பது ஒழுக்க மற்றும் உடன்படிக்கை சார்ந்த நிறையைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
theological_decisions:
- issue: இறைப்பெயரைப் பாதுகாப்பதா அல்லது ஒரு பட்டத்தால் மாற்றுவதா
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் יְהוָה என்ற தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. எனவே அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து வழங்குவது மூலத்துக்கு நெருக்கமானது.
- issue: ‘இஸ்ரவேல்’ என்பதை வரலாற்றுச் சூழலுக்காக ‘யூதா’ என மாற்றுவதா
  choice: இஸ்ரவேல்
  alternative: யூதா
  rationale: எபிரெய உரை ‘இஸ்ரவேல்’ என்றே கூறுகிறது. ‘யூதா’ என மாற்றுவது மொழிபெயர்ப்பில் விளக்க ஒத்திசைவைப் புகுத்திவிடும்; எனவே உரையின் பதற்றமும் சொற்பயன்பாடும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. கதைநடையின் வரிசையை ‘அப்போது’ வெளிப்படுத்துகிறது; நேர்கூற்று சுருக்கமாகவும் வழிபாட்டு மரபுச் சொற்களால் அளவுக்கு மீறிச் சுமத்தப்படாமலும் உள்ளது.
