  text: וּ/בְ/הִכָּֽנְע֗/וֹ שָׁ֤ב מִמֶּ֨/נּוּ֙ אַף יְהוָ֔ה וְ/לֹ֥א לְ/הַשְׁחִ֖ית לְ/כָלָ֑ה וְ/גַם֙ בִּֽ/יהוּדָ֔ה הָיָ֖ה דְּבָרִ֥ים טוֹבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
translation:
  language: ta
  text: அவன் தன்னைத் தாழ்த்திக்கொண்டபோது[a], யாவேவின் கோபம் அவனைவிட்டு விலகியது; அதனால் அவர் அவனை முற்றிலும் அழிக்கவில்லை. யூதாவில் நல்ல காரியங்களும் இருந்தன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் தன்னை அடக்கிக்கொண்டபோது.’ இங்குள்ள எபிரெய வினைவடிவம் அவன் தானே தன்னைத் தாழ்த்திக்கொண்டதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘நல்ல விஷயங்கள்.’ இது யூதாவிலிருந்த பாராட்டத்தக்க நிலைமைகள், செயல்கள் அல்லது பிற நன்மையான அம்சங்களைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  choice: அவன் தன்னைத் தாழ்த்திக்கொண்டபோது
  rationale: בְּ + தொழிற்பெயர் அமைப்பு காலப்பொருளைத் தருகிறது; כנע என்பதன் ஹித்பயேல் வடிவம் இங்கு ரெகொபெயாம் தானே தன்னைத் தாழ்த்திக்கொண்டதைக் குறிக்கிறது.
- source_word: שָׁב מִמֶּנּוּ אַף יְהוָה
  choice: யாவேவின் கோபம் அவனைவிட்டு விலகியது
  rationale: שׁוב உடன் מִן வருவது கோபம் அவனிடமிருந்து திரும்பி விலகிய திசைப்பொருளைக் காட்டுகிறது. ‘மனம் மாறினார்’ என்பது மூலத்தில் உள்ளதைவிட அதிக விளக்கத்தைச் சேர்க்கும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  choice: அவனை முற்றிலும் அழித்துவிடாதபடி
  rationale: எதிர்மறைத் தொழிற்பெயர் முன் கூறிய கோபம் விலகியதன் விளைவு அல்லது நோக்கத்தைக் காட்டுகிறது; לְכָלָה முழுமையான அழிவை வலியுறுத்துகிறது. தமிழ் வாக்கியத் தெளிவுக்காகச் சூழலிலிருந்து ‘அவனை’ சேர்க்கப்பட்டுள்ளது.
- source_word: וְגַם בִּיהוּדָה הָיָה דְּבָרִים טוֹבִים
  choice: யூதாவில் நல்ல காரியங்களும் இருந்தன
  rationale: וְגַם என்பதன் சேர்க்கைப் பொருளை ‘-உம்’ இயல்பாகத் தருகிறது. דְּבָרִים என்ற பரந்த சொல்லை குறிப்பிட்ட நற்செயல்கள், சூழ்நிலைகள் அல்லது செழிப்பு என்று சுருக்காமல் ‘காரியங்கள்’ எனப் பொதுவாக வைத்திருக்கிறது.
theological_decisions:
- issue: தெய்வீகக் கோபம் தணிக்கப்பட்ட விதம்
  choice: யாவேவின் கோபம் அவனைவிட்டு விலகியது; அவனை முற்றிலும் அழித்துவிடாதபடி அது விலகியது
  alternative: யாவே மனம் மாறி அவனை முற்றிலும் அழிக்கவில்லை
  rationale: மூலம் கோபம் உண்மையாக விலகியதையும் முழு அழிவு தவிர்க்கப்பட்டதையும் கூறுகிறது; ஆனால் எல்லா தண்டனை விளைவுகளும் நீக்கப்பட்டன என்றோ, தெய்வீக மனமாற்றத்தின் தன்மையை விளக்குகிறதென்றோ கூறவில்லை.
- issue: யூதாவிலிருந்த ‘நல்ல காரியங்களின்’ வரம்பு
  choice: யூதாவில் நல்ல காரியங்களும் இருந்தன
  alternative: யூதாவில் நல்ல செயல்கள் செய்யப்பட்டன
  rationale: மூலத்தின் דְּבָרִים טוֹבִים என்பது நற்செயல்கள், நல்ல நிலைமைகள் அல்லது வேறு நன்மையான அம்சங்கள் ஆகியவற்றில் ஒன்றாக மட்டும் வரையறுக்கப்படாத பரந்த சொற்றொடர்; அந்தத் தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் மீளுரையைத் தமிழில் சற்றே வெளிப்படையாக வைத்திருப்பதால் கோபம் விலகியதற்கும் முழு அழிவு தவிர்க்கப்பட்டதற்கும் உள்ள தொடர்பு தெளிவாகிறது; இறுதிக் கூறின் பொருள் திட்டமிட்டு பரந்ததாகவே வைக்கப்பட்டுள்ளது.
