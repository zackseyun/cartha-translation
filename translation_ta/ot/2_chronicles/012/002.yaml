source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/שָּׁנָ֤ה הַֽ/חֲמִישִׁית֙ לַ/מֶּ֣לֶךְ רְחַבְעָ֔ם עָלָ֛ה שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַ֖יִם עַל יְרוּשָׁלִָ֑ם כִּ֥י מָעֲל֖וּ בַּ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/002.yaml
  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
translation:
  language: ta
  text: ரெகொபெயாம் அரசனின் ஆட்சியின் ஐந்தாம் ஆண்டில், எகிப்தின் அரசனான சீஷாக் எருசலேமுக்கு எதிராகப் படையெடுத்து வந்தான்; ஏனெனில் அவர்கள் யெகோவாவுக்கு உண்மையற்றவர்களாக நடந்துகொண்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யெகோவாவுக்கு எதிராக நம்பிக்கைத் துரோகம் செய்தார்கள்” அல்லது “யெகோவாவுக்கு எதிராகக் குற்றமிழைத்தார்கள்.” எபிரெய வினைச்சொல் நம்பிக்கையை அல்லது உடன்படிக்கையை மீறிய துரோகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: —
  rationale: எபிரெயக் கதைத் தொடரைத் தொடங்கும் இவ்வடிவத்தைத் தமிழில் தனியாக மொழிபெயர்க்காமல், காலக் குறிப்புடன் நேரடியாகத் தொடங்குவது இயல்பான நடை.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: ரெகொபெயாம் அரசனான ஐந்தாம் ஆண்டில்
  rationale: அரசாட்சியின் ஐந்தாம் ஆண்டு என்ற காலக் குறிப்பை இயல்பான தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: עָלָה ... עַל יְרוּשָׁלִָם
  choice: எருசலேமுக்கு எதிராகப் படையெடுத்து வந்தான்
  rationale: இராணுவச் சூழலில் உள்ள hostile advance என்ற பொருளைத் தெளிவாக்குகிறது; நகரம் ஏற்கெனவே தாக்கப்பட்டதா என்பதை அளவுக்கு மீறி நிர்ணயிக்கவில்லை.
- source_word: שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசன் சீஷாக்
  rationale: பெயரை ஒலிபெயர்த்து, எபிரெயக் கட்டமைப்பை இயல்பான தமிழ் சொல்லொழுங்கில் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: படையெடுப்புக்கான வரலாற்று-இறையியல் காரணத்தை வெளிப்படையான காரண இணைப்பாகப் பாதுகாக்கிறது.
- source_word: מָעֲלוּ
  choice: நம்பிக்கைத் துரோகம் செய்திருந்தார்கள்
  rationale: מעל குறிக்கும் நம்பிக்கை அல்லது உடன்படிக்கை மீறலை, பொதுவான ‘தவறு செய்தார்கள்’ என்பதைக் காட்டிலும் துல்லியமாகக் கூறுகிறது.
- source_word: בַּיהוָה
  choice: யெகோவாவுக்கு எதிராக
  rationale: מעל உடன் வரும் ב, துரோகம் யாருக்கு எதிராகச் செய்யப்பட்டது என்பதைச் சுட்டுகிறது; தெய்வீகப் பெயரைத் தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என வழங்குகிறது.
theological_decisions:
- issue: சீஷாக்கின் படையெடுப்புக்கான உடன்படிக்கை சார்ந்த விளக்கம்
  choice: ஏனெனில் அவர்கள் யெகோவாவுக்கு எதிராக நம்பிக்கைத் துரோகம் செய்திருந்தார்கள்
  alternative: ஏனெனில் அவர்கள் யெகோவாவுக்கு உண்மையற்றவர்களாக நடந்துகொண்டார்கள் / யெகோவாவுக்கு எதிராகக் குற்றமிழைத்தார்கள்
  rationale: ஆசிரியர் அரசியல் நிகழ்வை மக்களின் இறைநம்பிக்கை மீறலோடு நேரடியாகக் காரணரீதியில் இணைக்கிறார். மொழிபெயர்ப்பு அந்த இறையியல் காரணத்தையும் relational offense என்ற நுணுக்கத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘படையெடுத்து வந்தான்’ இராணுவச் சூழலை இயல்பாகத் தருகிறது; ‘நம்பிக்கைத் துரோகம்’ மூலச்சொல்லின் உடன்படிக்கை சார்ந்த செறிவைப் பாதுகாக்கிறது.
