base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/004.yaml
  text: He captured the fortified cities that belonged to Judah and came as far as Jerusalem[a].
translation:
  language: ta
  text: அவன் யூதாவுக்குச் சொந்தமான அரண்சூழ்ந்த நகரங்களைக் கைப்பற்றி, எருசலேம் வரை வந்தான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எருசலேம் வரை முன்னேறி வந்தான்.’ எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘எருசலேம் வரை வந்தான்’ என்று உள்ளது; யூதாவின் அரண்சூழ்ந்த நகரங்களைக் கைப்பற்றிய பின்பு அவன் எருசலேம் வரை வந்ததை இது வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: கைப்பற்றி
  rationale: לכד என்பது போரில் நகரங்களைக் கைப்பற்றுவதைக் குறிக்கிறது; ‘கைப்பற்றி’ என்பது அதன் இராணுவச் சூழலை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: עָרֵי הַמְּצֻרוֹת
  choice: அரண்சூழ்ந்த நகரங்கள்
  rationale: எபிரெயச் சொற்றொடர் பாதுகாப்பு அரண்களைக் கொண்ட நகரங்களையே குறிக்கிறது; ‘கோட்டைகள்’ என்று மொழிபெயர்த்தால் ‘நகரங்கள்’ என்ற கூறு மறைந்துவிடும்.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: யூதாவுக்குச் சொந்தமான
  rationale: לִיהוּדָה இங்கு உடைமை அல்லது அரசியல் சார்பைக் காட்டுகிறது; இது வெறும் புவியியல் இருப்பிடத்தைக் காட்டிலும் தெளிவாக அந்த உறவைப் பாதுகாக்கிறது.
- source_word: וַיָּבֹא עַד יְרוּשָׁלִָם
  choice: எருசலேம்வரை வந்தான்
  rationale: בוא உடன் עַד வருவது ஓர் எல்லைவரை வந்தடைந்த இயக்கத்தைக் குறிக்கிறது. இம்மொழிபெயர்ப்பு அவன் நகருக்குள் நுழைந்தான் என்று தேவையின்றி கூறாமல் மூலத்தின் நுட்பத்தைப் பாதுகாக்கிறது.
