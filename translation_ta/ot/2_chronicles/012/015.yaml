translation_notes:
  register: நவீன நிலையான தமிழில், வரலாற்றுச் சுருக்கத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. נָבִיא மற்றும் חֹזֶה ஆகிய இரு வேறு பட்டங்களும் முறையே ‘இறைவாக்கினர்,’ ‘தரிசனக்காரர்’ என்று வேறுபடுத்தப்பட்டுள்ளன. மூலத்தில் இல்லாத தொடக்கக் காலச் சுட்டுச்சொல் சேர்க்கப்படவில்லை.
