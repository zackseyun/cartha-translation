  text: וְ/דִבְרֵ֣י רְחַבְעָ֗ם הָ/רִאשֹׁנִים֙ וְ/הָ/אֲ֣חַרוֹנִ֔ים הֲ/לֹא הֵ֨ם כְּתוּבִ֜ים בְּ/דִבְרֵ֨י שְׁמַֽעְיָ֧ה הַ/נָּבִ֛יא וְ/עִדּ֥וֹ הַ/חֹזֶ֖ה לְ/הִתְיַחֵ֑שׂ וּ/מִלְחֲמ֧וֹת רְחַבְעָ֛ם וְ/יָרָבְעָ֖ם כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: The acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
translation:
  language: ta
  text: ரெகொபெயாமின் முந்தைய செயல்களும் பிந்தைய செயல்களும் இறைவாக்கினரான செமாயாவின் பதிவுகளிலும் தரிசனக்காரரான இத்தோவின் பதிவுகளிலும், வம்சாவளிப் பதிவுக்கேற்ப[a] எழுதப்பட்டுள்ளன அல்லவா? ரெகொபெயாமுக்கும் யெரொபெயாமுக்கும் இடையே அவர்கள் காலம் முழுவதும் போர்கள் நடந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வம்சாவளிப் பதிவில்,” அல்லது “வம்சாவளிப் பதிவுக்காக.” இந்த எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது; இத்தோவுடன் தொடர்புடைய ஆதாரப் பதிவின் அமைப்பையோ நோக்கத்தையோ இது விவரிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי רְחַבְעָם
  choice: ரெகொபெயாமின் ... செயல்கள்
  rationale: அரசரின் ஆட்சிக்காலச் சுருக்கத்தில் דִבְרֵי என்பது அவர் பேசிய சொற்களை மட்டும் அல்லாமல் அவரது செயல்களையும் நிகழ்வுகளையும் குறிக்கிறது.
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  choice: முந்தைய செயல்களும் பிந்தைய செயல்களும்
  rationale: அரசாட்சியின் தொடக்கமுதல் முடிவுவரையிலான நிகழ்வுகளைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: எழுதப்பட்டுள்ளன அல்லவா?
  rationale: ஆதாரப் பதிவைச் சுட்டும் மூலமொழியின் வினாவடிவத்தையும் முறையான தொனியையும் காக்கிறது.
- source_word: בְּדִבְרֵי
  choice: பதிவுகளில்
  rationale: இங்கு דִבְרֵי என்பது எழுதப்பட்ட வரலாற்று ஆதாரங்களைக் குறிக்கிறது; எனவே ‘சொற்களில்’ என்பதைக் காட்டிலும் ‘பதிவுகளில்’ பொருத்தமானது.
- source_word: הַנָּבִיא
  choice: இறைவாக்கினர்
  rationale: נָבִיא என்ற தீர்க்கவாக்குப் பணிக்குரிய பட்டத்தை நவீன, மரியாதையான தமிழில் தருகிறது.
- source_word: הַחֹזֶה
  choice: தரிசனக்காரர்
  rationale: חֹזֶה என்பது נָבִיא என்பதிலிருந்து சொல்லளவில் வேறுபட்ட பட்டம்; அந்த வேறுபாட்டைத் தமிழிலும் காக்கிறது.
- source_word: לְהִתְיַחֵשׂ
  choice: வம்சாவளிப் பதிவுக்கேற்ப
  rationale: வம்சமுறைப்படி கணக்கிடுதல் அல்லது பதிவு செய்தல் என்ற அடிப்படைப் பொருளைத் தருகிறது; கடினமான எபிரெயத் தொடரை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: וּמִלְחֲמוֹת
  choice: போர்கள் நடந்தன
  rationale: எபிரெயில் பெயர்ச்சொல் தொடராக இருந்தாலும், தமிழில் முழுமையான இயல்பான வாக்கியமாக அமைய உள்ளார்ந்த வினைப்பொருள் வெளிப்படையாகக் கூறப்படுகிறது.
- source_word: כָּל הַיָּמִים
  choice: அவர்கள் காலம் முழுவதும்
  rationale: இரு அரசர்களுக்கும் உரிய காலம் முழுவதையும் குறிக்கிறது; வாழ்நாளா ஆட்சிக்காலமா என்பதைத் தேவையின்றி முடிவுசெய்யாமல் விடுகிறது.
