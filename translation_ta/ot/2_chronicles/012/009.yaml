  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
translation:
  language: ta
  text: அப்போது, எகிப்தின் அரசனான சீஷாக் எருசலேமுக்கு எதிராகப் படையெடுத்து வந்து, யாவேயின் இல்லத்தின்[a] கருவூலங்களையும் அரசனின் இல்லத்தின்[b] கருவூலங்களையும் எடுத்துக்கொண்டான். அவன் எல்லாவற்றையும் எடுத்துக்கொண்டான்; சாலொமோன் செய்திருந்த தங்கக் கேடயங்களையும் எடுத்துக்கொண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவேயின் ஆலயத்தின்.’
    reason: ‘யாவேயின் இல்லம்’ என்பது இங்கு எருசலேம் ஆலயத்தைக் குறிக்கும் வழக்குச் சொல்லாட்சி.
  - marker: b
    text: அல்லது, ‘அரச அரண்மனையின்.’
    reason: ‘அரசனின் இல்லம்’ என்பது இங்கு அரச அரண்மனையைக் குறிக்கிறது.
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  choice: எருசலேமுக்கு எதிராகப் படையெடுத்து வந்து
  rationale: עלה என்பதுடன் עַל சேர்ந்து வரும் இப்போர்ச் சூழலில், ஒரு நகருக்கு எதிராக முன்னேறிப் படையெடுத்தல் என்ற பொருள் உள்ளது. தமிழ் தொடரில் இயக்கத்தையும் பகைமையான நோக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: எகிப்தின் அரசனான சீஷாக்
  rationale: பெயரை ஒலிபெயர்த்து, பதவியையும் நாட்டையும் தெளிவான தமிழ் இயைபில் தருகிறது.
- source_word: אֹצְרוֹת
  choice: கருவூலங்கள்
  rationale: ஆலயத்திலும் அரண்மனையிலும் விலைமதிப்புள்ள பொருட்கள் வைக்கப்பட்டிருந்த இடங்கள் அல்லது அவற்றின் சேமிப்புகள் என்ற சூழற்பொருளைத் துல்லியமாகக் காட்டுகிறது.
- source_word: בֵּית יְהוָה
  choice: யாவேயின் இல்லம்
  rationale: எபிரெயச் சொல்லாட்சியான ‘யாவேயின் வீடு/இல்லம்’ என்பதைப் பாதுகாக்கிறது; இங்கு அது ஆலயத்தைக் குறிக்கிறது.
- source_word: בֵּית הַמֶּלֶךְ
  choice: அரசனின் இல்லம்
  rationale: மூலத்தின் ‘அரசனின் வீடு’ என்ற இணை அமைப்பைப் பாதுகாக்கிறது; சூழலில் இது அரச அரண்மனையைக் குறிக்கிறது.
- source_word: אֶת־הַכֹּל לָקָח
  choice: அவன் எல்லாவற்றையும் எடுத்துக்கொண்டான்
  rationale: கொள்ளையின் முழுமையை வலியுறுத்தும் மூலத்தின் மீளுரைப்பையும் தனி வாக்கியத்தின் அழுத்தத்தையும் காக்கிறது.
- source_word: מָגִנֵּי הַזָּהָב
  choice: தங்கக் கேடயங்கள்
  rationale: பொருளையும் பொருட்கூறையும் இயல்பான நவீன தமிழில் நேரடியாகத் தருகிறது.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: சாலொமோன் செய்திருந்த
  rationale: சீஷாக் எடுத்துச் சென்ற காலத்துக்கு முன்பே சாலொமோன் அவற்றைச் செய்திருந்தார் என்பதைத் தமிழில் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப்பெயர் அல்லாமல் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதனால் அதை பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘இல்லம்’ என்ற சொல்லை இரு இணையான எபிரெயச் சொற்றொடர்களிலும் வைத்ததால் மூலத்தின் இலக்கிய இணை அமைப்பு காக்கப்படுகிறது; தெளிவான சூழற்பொருள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளது.
