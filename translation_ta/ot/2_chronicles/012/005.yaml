  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
translation:
  language: ta
  text: 'அப்போது இறைவாக்கினரான செமாயா, சீஷாக்கின் அச்சுறுத்தலால்[a] எருசலேமில் ஒன்றுகூடியிருந்த ரெகொபெயாமிடமும் யூதாவின் தலைவர்களிடமும் வந்து, அவர்களிடம், “யாவே கூறுவது இதுவே: நீங்கள் என்னைக் கைவிட்டீர்கள்; ஆகவே நானும் உங்களைச் சீஷாக்கின் கையில் கைவிட்டேன்” என்றார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மொழியில், “சீஷாக்கின் முன்னிலையிலிருந்து”; அதாவது, சீஷாக்கினால் அல்லது அவருக்குப் பயந்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַעְיָה הַ/נָּבִיא
  choice: அப்போது இறைவாக்கினரான செமாயா
  rationale: இணைப்புச்சொல் கதைநிகழ்வை முன்னெடுப்பதால் இயல்பான தமிழில் ‘அப்போது’ என வழங்கப்பட்டுள்ளது. נָבִיא என்பதற்கு தற்போதைய, கண்ணியமான ‘இறைவாக்கினர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בָּא אֶל רְחַבְעָם וְ/שָׂרֵי יְהוּדָה
  choice: ரெகொபெயாமிடமும் யூதாவின் தலைவர்களிடமும் வந்து
  rationale: בָּא אֶל என்பது அணுகி வருதலைக் குறிக்கிறது. שָׂרִים என்போர் அரசியல் அதிகாரமுள்ளோர்; ‘தலைவர்கள்’ என்பது ‘பிரபுக்கள்’ என்பதைக் காட்டிலும் நவீன வாசகர்களுக்கு இயல்பானது.
- source_word: אֲשֶׁר נֶאֶסְפוּ אֶל יְרוּשָׁלַםִ
  choice: எருசலேமில் ஒன்றுகூடியிருந்த
  rationale: நிப்அல் வடிவம் அவர்கள் அங்கே ஒன்றுகூடிய நிலையைத் தெரிவிக்கிறது; இலக்குத் திசையைக் காட்டும் אֶל என்பதன் விளைவிடத்தைத் தமிழில் ‘எருசலேமில்’ என்பது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִ/פְּנֵי שִׁישָׁק
  choice: சீஷாக்கின் அச்சுறுத்தலால்
  rationale: சொல்லுக்குச் சொல் பொருள் ‘சீஷாக்கின் முன்னிலையிலிருந்து’; சூழலில் அவரது படையெடுப்பால் ஏற்பட்ட அச்சுறுத்தலே அவர்கள் கூடிவந்ததற்கான காரணம். அடிப்படை உருவகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כֹּה אָמַר יְהוָה
  choice: யெகோவா கூறுவது இதுவே
  rationale: தீர்க்கதரிசனத் தூதுச் சூத்திரத்தை இயல்பான நவீன தமிழில் வழங்குகிறது; יהוה என்ற தனிப்பெயர் பெயராகவே ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עֲזַבְתֶּם אֹתִי ... עָזַבְתִּי אֶתְכֶם
  choice: நீங்கள் என்னைக் கைவிட்டீர்கள் ... நானும் உங்களைக் கைவிட்டேன்
  rationale: இரு இடங்களிலும் ஒரே עָזַב வினை இருப்பதால் ஒரே தமிழ் வினை பயன்படுத்தப்பட்டு, குற்றத்துக்கும் தீர்ப்புக்கும் இடையிலான கூரிய சொல்லாட்சி ஒற்றுமை காக்கப்பட்டுள்ளது.
- source_word: וְ/אַף אֲנִי
  choice: ஆகவே நானும்
  rationale: இணைப்பு வெறும் தொடர்ச்சியை மட்டுமல்லாது, அவர்களின் செயலுக்கு ஒத்த பதில்தீர்ப்பையும் குறிக்கிறது; ‘ஆகவே நானும்’ அந்த உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּ/יַד שִׁישָׁק
  choice: சீஷாக்கின் கையில்
  rationale: ‘கையில்’ என்பது ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் விடப்படுதல் என்ற எபிரேய உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்படும் பெயருருவான ‘யெகோவா’ அதனைப் பட்டப்பெயராக மாற்றாமல் காக்கிறது.
- issue: ஒரே עָזַב வினையின் இருமுறை பயன்பாடு
  choice: இரு இடங்களிலும் ‘கைவிட்டீர்கள்/கைவிட்டேன்’
  alternative: முதல் இடத்தில் ‘கைவிட்டீர்கள்’, இரண்டாவது இடத்தில் ‘ஒப்புக்கொடுத்தேன்’
  rationale: மக்கள் இறைவனைக் கைவிட்டதற்கும் இறைவன் அவர்களை எதிரியின் அதிகாரத்தில் கைவிட்டதற்கும் இடையிலான திட்டமிட்ட சொல்லாட்சி மற்றும் இறையியல் பதற்றத்தை மாறுபட்ட வினைகளால் மென்மைப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. தீர்க்கதரிசன அறிவிப்பின் அதிகாரத் தொனியும் மூலத்தின் ‘கைவிடுதல்’ என்ற சொல்லாட்சி ஒற்றுமையும் பாதுகாக்கப்பட்டுள்ளன.
