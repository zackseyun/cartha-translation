  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
translation:
  language: ta
  text: ராஜா ரெகொபெயாம் எருசலேமில் தன் நிலையை உறுதிப்படுத்திக்கொண்டு அரசாண்டான்.[a] ரெகொபெயாம் அரசனானபோது நாற்பத்தொரு வயதுடையவனாக இருந்தான். யாவே தமது பெயரை அங்கே வைக்கும்படி இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும் தேர்ந்தெடுத்த நகரமான எருசலேமில் அவன் பதினேழு ஆண்டுகள் அரசாண்டான். அவனுடைய தாயின் பெயர் நாமா; அவள் அம்மோனியப் பெண்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமில் தன்னை வலுப்படுத்திக்கொண்டு அரசாண்டான்.” எபிரெய வினைச்சொல் வலிமை பெறுவதையோ உறுதியாக நிலைபெறுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: தன் நிலையை உறுதிப்படுத்திக்கொண்டு
  rationale: התפעל வடிவம் தன்னை வலுப்படுத்துதல் அல்லது உறுதியாக நிலைபெறுதல் என்ற பொருளைக் கொண்டது. இச்சூழலில் உடல் வலிமையைவிட அரசனாகத் தன் நிலையை உறுதிப்படுத்தியதைக் குறிக்கும் இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: இது முந்தைய செயலுக்குப் பின் தொடரும் அரசாட்சியைச் சொல்கிறது; ‘அரசனானான்’ என்று ஆட்சித் தொடக்கத்தைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: בְּמָלְכוֹ
  choice: அரசனானபோது
  rationale: ב முன்னொட்டுடன் வரும் infinitive construct ஆட்சியேற்ற காலத்தைக் குறிக்கிறது; தமிழில் இந்தக் காலத்தொடர் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெயத் தெய்வீகத் திருப்பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: தமது பெயரை அங்கே வைக்கும்படி
  rationale: ஆலயத் தேர்வைக் குறிக்கும் மூலமொழியின் தெளிவான உருவகத்தைத் தக்கவைத்து, ‘தமது பிரசன்னத்தை நிலைநிறுத்த’ போன்ற விளக்க விரிவாக்கத்தைத் தவிர்க்கிறது.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் எல்லாக் கோத்திரங்களிலிருந்தும்
  rationale: מן என்பது மொத்தத்திலிருந்து செய்யப்படும் தேர்வைக் குறிக்கிறது; இந்தத் தமிழ் வடிவம் அந்த உறவைப் பாதுகாக்கிறது.
- source_word: הָעַמֹּנִית
  choice: அம்மோனியப் பெண்
  rationale: பெண்பால் இனப்பெயரை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: ‘தமது பெயரை அங்கே வைக்க’ என்ற ஆலயத் தேர்வு மொழிநடை
  choice: மூலத்தின் நேரடியான உருவகத்தைத் தக்கவைத்தல்
  alternative: தமது பிரசன்னத்தை அங்கே நிலைநிறுத்த
  rationale: ‘பெயர்’ என்பதைக் ‘பிரசன்னம்’ என்று விளக்குவது மூலவசனம் கூறுவதைவிடக் கூடுதல் இறையியல் விளக்கத்தைச் சேர்க்கும்; ஆகவே உள்ளார்ந்த இறையியல் நெருக்கடியைத் தீர்க்காமல் சொற்றொடர் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வரலாற்று நடையில் மொழிபெயர்க்கப்பட்டது. அரசர் பெயர்களுக்கு இயல்பான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் அரசாட்சி அறிவிப்பு அமைப்பும் இறைப்பெயரும் ஆலயத் தேர்வு உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
