base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
translation:
  language: ta
  text: 'அவர்கள் தங்களைத் தாழ்த்திக்கொண்டதை யாவே கண்டபோது, யாவேயின் வார்த்தை செமாயாவுக்கு வந்தது: “அவர்கள் தங்களைத் தாழ்த்திக்கொண்டார்கள். நான் அவர்களை அழிக்கமாட்டேன்; அவர்களுக்கு சிறிதளவு விடுதலையை அளிப்பேன்.[a] சீஷாக்கின் கையால் என் கடுங்கோபம் எருசலேமின்மேல் ஊற்றப்படாது.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சிறிது தப்புதலை அவர்களுக்கு அளிப்பேன்”; அல்லது, “சில தப்பிப்பிழைத்தோரை அவர்களுக்கு அளிப்பேன்.” எபிரெயச் சொற்றொடர் சுருக்கமானது; முழு அழிவுக்குப் பதிலாக வரையறுக்கப்பட்ட மீட்பை அது வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִרְאוֹת
  choice: கண்டபோது
  rationale: בְּ உடன் வரும் ראה வினையின் infinitive construct காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது; “கண்டபோது” இயல்பான தமிழில் நிகழ்வுகளின் தொடர்ச்சியைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: נִכְנָעוּ
  choice: அவர்கள் தங்களைத் தாழ்த்திக்கொண்டார்கள்
  rationale: כּנע என்பதன் Niphal வடிவம் இச்சூழலில் தீர்க்கதரிசனக் கண்டிப்புக்கு மறுமொழியாகத் தாமே தாழ்ந்து அடங்குவதைக் குறிக்கிறது.
- source_word: הָיָה דְבַר יְהוָה אֶל
  choice: யாவேயின் வார்த்தை ... வந்தது
  rationale: வழக்கமான தீர்க்கதரிசனச் சூத்திரத்தைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: לֹא אַשְׁחִיתֵם
  choice: நான் அவர்களை அழிக்கமாட்டேன்
  rationale: שׁחת என்பதன் Hiphil வடிவத்தின் தீர்ப்புச் சூழலுக்குரிய நேரடியான பொருள் “அழித்தல்” ஆகும்.
- source_word: וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה
  choice: ஓரளவு விடுதலையை அவர்களுக்கு அளிப்பேன்
  rationale: சுருக்கமான எபிரெயச் சொற்றொடர் வரையறுக்கப்பட்ட மீட்பு, தப்புதல் அல்லது தப்பிப்பிழைத்தோர் என்ற பொருள் எல்லையைக் கொண்டது; “ஓரளவு விடுதலை” முதன்மைப் பொருளை இயல்பாகத் தெரிவிக்கிறது, அடிக்குறிப்பு மாற்றுப் பொருள்களைப் பாதுகாக்கிறது.
- source_word: תִתַּךְ חֲמָתִי
  choice: என் கடுங்கோபம் ... ஊற்றப்படாது
  rationale: נתך உடன் חמה வருவது கோபம் ஊற்றப்படுதல் என்ற உருவகப் பயன்பாடு; “கடுங்கோபம்” חמה-வின் தீவிரத்தைத் தக்கவைக்கிறது.
- source_word: בְּיַד שִׁישָׁק
  choice: சீஷாக்கின் கையால்
  rationale: கருவி அல்லது செயலாற்றுபவரைக் குறிக்கும் எபிரெய மரபுத்தொடரைப் புரிந்துகொள்ளத்தக்க தமிழில் பாதுகாக்கிறது.
- source_word: שִׁישָׁק
  choice: சீஷாக்
  rationale: எபிரெய தனிப்பெயரின் தமிழ் ஒலிபெயர்ப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தனிப்பட்ட திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: כִּמְעַט לִפְלֵיטָה என்ற வரையறுக்கப்பட்ட மீட்பின் தன்மை
  choice: ஓரளவு விடுதலை
  alternative: சிறிது தப்புதல் / சில தப்பிப்பிழைத்தோர்
  rationale: தீர்ப்பு முழுவதும் நீக்கப்பட்டது என்று கூறாமல், அது மட்டுப்படுத்தப்பட்டதை முதன்மை உரை தெரிவிக்கிறது; சொல்லின் எண்ணிக்கை சார்ந்த அல்லது மீட்பு சார்ந்த மாற்று நுணுக்கங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன தரத்தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. தீர்க்கதரிசனச் சூத்திரமும் கோபம் “ஊற்றப்படுதல்” என்ற மூல உருவகமும் பாதுகாக்கப்பட்டுள்ளன; அரிதான சொற்றொடரின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
