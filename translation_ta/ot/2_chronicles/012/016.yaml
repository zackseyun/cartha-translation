source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב רְחַבְעָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֖ר בְּ/עִ֣יר דָּוִ֑יד וַ/יִּמְלֹ֛ךְ אֲבִיָּ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/016.yaml
  text: And Rehoboam slept with his fathers and was buried in the city of David[a], and Abijah his son reigned in his place.
translation:
  language: ta
  text: ரெகொபெயாம் தன் முன்னோர்களோடு துயிலடைந்து[a], தாவீதின் நகரத்தில் அடக்கம் செய்யப்பட்டான். அவனுக்குப் பதிலாக அவன் மகன் அபியா அரசாண்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முன்னோர்களோடு துயிலடைந்தான்’ என்பது மரணமடைந்து மூதாதையரின் வரிசையில் சேர்ந்ததைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: தன் முன்னோர்களோடு துயிலடைந்து
  rationale: அரசர்களின் மரணத்தைக் குறிக்கும் வழக்கமான எபிரெய மரபுத்தொடரின் உருவகத்தையும் பொருளையும் காக்கிறது; அடுத்துவரும் அடக்கக் குறிப்பால் இது மரணத்தைக் குறிக்கிறது என்பது தெளிவாகிறது.
- source_word: וַיִּקָּבֵר
  choice: அடக்கம் செய்யப்பட்டான்
  rationale: எபிரெய மொழியின் செயப்பாட்டு வினை வடிவை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בְּעִיר דָּוִיד
  choice: தாவீதின் நகரத்தில்
  rationale: அங்கீகரிக்கப்பட்ட இடப்பெயர்ச் சொல்லைத் தெளிவாகவும் மூலத்திற்கு நெருக்கமாகவும் வழங்குகிறது.
- source_word: וַיִּמְלֹךְ
  choice: அரசாண்டான்
  rationale: அரச வாரிசுரிமை அறிவிப்புகளில் வரும் מלך என்பதற்கான இயல்பான தமிழ் இணைச்சொல்.
- source_word: אֲבִיָּה
  choice: அபியா
  rationale: இவ்வசனத்தின் אֲבִיָּה என்ற பெயர் வடிவைத் தமிழில் ஒலிபெயர்க்கிறது; வேறு இடங்களில் காணப்படும் ‘அபியாம்’ என்ற மாற்று வடிவத்தை இங்கு புகுத்தவில்லை.
- source_word: בְנוֹ
  choice: அவன் மகன்
  rationale: மகன் என்ற உறவைக் குறிக்கும் மூலத்தின் எளிய சொல்லாட்சியை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: תַּחְתָּיו
  choice: அவனுக்குப் பதிலாக
  rationale: அரச வாரிசு அவனுடைய இடத்தை ஏற்றதை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
