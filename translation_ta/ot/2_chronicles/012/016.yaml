translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மரணத்தைக் குறிக்கும் எபிரெய உருவகம் நேரடியாக ‘இறந்தான்’ என்று தட்டையாக்கப்படாமல் பாதுகாக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
