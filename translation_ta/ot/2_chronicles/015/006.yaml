source:
  edition: WLC
  text: וְ/כֻתְּת֥וּ גוֹי בְּ/ג֖וֹי וְ/עִ֣יר בְּ/עִ֑יר כִּֽי אֱלֹהִ֥ים הֲמָמָ֖/ם בְּ/כָל צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/006.yaml
  text: Nation was crushed by nation[a], and city by city, for God troubled them with every kind of distress.
translation:
  language: ta
  text: ஒரு தேசம் மற்றொரு தேசத்தாலும், ஒரு நகரம் மற்றொரு நகரத்தாலும் நொறுக்கப்பட்டன; ஏனெனில் கடவுள் எல்லாவிதமான நெருக்கடியாலும் அவர்களைக் கலங்கச் செய்தார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லாவிதமான நெருக்கடியாலும் அவர்களைக் குழப்பத்தில் ஆழ்த்தினார்.”
    reason: הֲמָמָם என்பது கலக்கத்தை மட்டுமன்றி குழப்பம் அல்லது பீதியில் ஆழ்த்துதலையும் குறிக்கலாம்.
lexical_decisions:
- source_word: וְכֻתְּתוּ
  choice: நொறுக்கப்பட்டன
  rationale: כתת என்பதன் புஅல் வடிவம் உடைக்கப்படுதல் அல்லது நொறுக்கப்படுதல் என்ற வலுவான பொருளைத் தருகிறது. தேசமும் நகரமும் இணையாகக் கூட்டாகக் குறிப்பிடப்படுவதால் தமிழ் வாக்கியத்தில் பன்மை வினை இயல்பாக உள்ளது.
- source_word: גוֹי בְּגוֹי
  choice: ஒரு தேசம் மற்றொரு தேசத்தாலும்
  rationale: בְּ பகைமையான செயலில் கருவி அல்லது செயற்படுத்துபவரைக் குறிக்கிறது. இத்தமிழாக்கம் ஒரு தேசம் மற்றொன்றால் நொறுக்கப்பட்டதைத் தெளிவாக்கி, எபிரெய இணை அமைப்பையும் காக்கிறது.
- source_word: וְעִיר בְּעִיר
  choice: ஒரு நகரம் மற்றொரு நகரத்தாலும்
  rationale: முந்தைய சொற்றொடருக்கு இணையாக, நகரங்களுக்கு இடையிலான அழிவூட்டும் மோதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன் கூறப்பட்ட அழிவுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமை வினையுடன் வரும் אֱלֹהִים ஒரே கடவுளைக் குறிக்கிறது.
- source_word: הֲמָמָם
  choice: அவர்களைக் கலங்கச் செய்தார்
  rationale: המם குழப்பம், பீதி, கலக்கம் ஆகியவற்றை உண்டாக்குதலைக் குறிக்கிறது. ‘கலங்கச் செய்தார்’ என்பது செயப்படுபொருள் பின்னொட்டையும் கடவுளின் நேரடி செயலையும் காக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: בְּכָל צָרָה
  choice: எல்லாவிதமான நெருக்கடியாலும்
  rationale: בְּ இங்கு கருவிப் பொருளிலும் כָּל முழுமையான பரப்பிலும் வருகிறது. ‘எல்லாவிதமான நெருக்கடியாலும்’ என்பது பலவகைத் துன்பங்களின் comprehensive force-ஐ இயல்பாகத் தருகிறது.
theological_decisions:
- issue: பேரழிவுகளில் கடவுளின் செயற்பாடு
  choice: கடவுள் எல்லாவிதமான நெருக்கடியாலும் அவர்களைக் கலங்கச் செய்தார்
  alternative: கடவுள் அவர்கள் நெருக்கடிகளில் கலங்க அனுமதித்தார்
  rationale: எபிரெய உரையில் கடவுளே எழுவாயாக இருந்து செயப்பாட்டு அல்லாத நேரடி வினையைச் செய்கிறார். ஆகவே அவரது செயற்பாட்டை வெறும் அனுமதியாக மென்மைப்படுத்தாமல், அதற்கும் மேலான விளக்கத்தைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் சுருக்கமான இணை அமைப்பு இயல்பான தமிழ் தொடராக விரிக்கப்பட்டுள்ளது; வன்முறைத் தீவிரமும் கடவுளின் நேரடி செயற்பாடும் காக்கப்பட்டுள்ளன.
