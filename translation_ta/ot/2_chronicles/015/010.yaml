  text: So they gathered at Jerusalem in the third month, in the fifteenth year of Asa's reign.
translation:
  language: ta
  text: ஆசாவின் ஆட்சியின் பதினைந்தாம் ஆண்டில், மூன்றாம் மாதத்தில் அவர்கள் எருசலேமில் ஒன்றுகூடினார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: அவர்கள் ஒன்றுகூடினார்கள்
  rationale: קבץ என்பதன் நிஃபால் தொடர்-இறந்தகால வடிவம்; இங்கு மக்கள் தாமாகக் குழுவாகக் கூடிவந்த கூட்டுப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. எபிரெய இணைப்பைத் தனியே ‘அப்போது’ அல்லது ‘ஆகவே’ என்று மொழிபெயர்க்காமல், தமிழ் கதைநடையின் இயல்பான தொடரில் வைத்துள்ளது.
- source_word: יְרוּשָׁלִַם
  choice: எருசலேம்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: மூன்றாம் மாதத்தில்
  rationale: குறிப்பிட்ட வரிசை எண்ணையும் காலக் குறிப்பையும் சுருக்கமாகவும் மூலத்திற்கு நெருக்கமாகவும் தருகிறது.
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה
  choice: பதினைந்தாம் ஆண்டில்
  rationale: அரசாண்டுக் காலக்கணக்கில் ל முன்னிடைச்சொல்லின் பொருளை இயல்பான தமிழ்க் காலவேற்றுமையால் வெளிப்படுத்துகிறது.
- source_word: לְמַלְכוּת אָסָא
  choice: ஆசாவின் ஆட்சியின்
  rationale: מַלְכוּת இங்கு அரசனுடைய ஆட்சிக்காலத்தைக் குறிக்கிறது; ‘ஆட்சி’ என்பது காலக்கணக்குச் சூழலுக்குப் பொருத்தமான, தெளிவான சொல்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கண்ணியமும் கொண்ட கதைநடை. எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றாமல், அரசாண்டுக் காலக்குறிப்பைத் தமிழில் இயல்பாக முன்னிறுத்தியுள்ளது; தகவல் அனைத்தும் பாதுகாக்கப்பட்டுள்ளது.
