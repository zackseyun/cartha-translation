source:
  edition: WLC
  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
translation:
  language: ta
  text: ஆசா அரசனின் தாயான மாக்காவையும் அரசமாதா பதவியிலிருந்து அவன் நீக்கினான்; ஏனெனில் அவள் அசேராவுக்காக அருவருப்பூட்டும் ஓர் உருவத்தைச் செய்திருந்தாள். ஆசா அவளுடைய அருவருப்பூட்டும் உருவத்தை வெட்டி வீழ்த்தி, அதைத் தூளாக்கி, கீதரோன் பள்ளத்தாக்கில்[a] எரித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கீதரோன் நீரோடைப் பள்ளத்தில்.” எபிரெயச் சொல் காலநிலை சார்ந்து நீர் ஓடும் பள்ளத்தாக்கையோ ஓடையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: …யையும்
  rationale: கூடுதலையும் வலியுறுத்தலையும் இயல்பான தமிழில் உணர்த்துகிறது; சீர்திருத்தம் அரசனின் நெருங்கிய உறவினருக்கும் நீண்டதை வெளிப்படுத்துகிறது.
- source_word: מַעֲכָה
  choice: மாக்கா
  rationale: எபிரெய தனிப்பெயரின் ஒலியைத் தமிழில் இயன்றவரை நெருக்கமாக எழுத்துப்பெயர்க்கிறது.
- source_word: אֵם אָסָא הַמֶּלֶךְ
  choice: ஆசா அரசனின் தாயான
  rationale: எபிரெய உறவுநிலையைத் தெளிவாகவும் இயல்பான தமிழ் சொல்வரிசையிலும் தருகிறது.
- source_word: הֱסִירָהּ מִגְּבִירָה
  choice: அரசமாதா பதவியிலிருந்து அவன் நீக்கினான்
  rationale: הסיר என்பதன் பொதுவான ‘நீக்கு’ பொருளையும், அரசவைக் சூழலில் גְּבִירָה குறிக்கும் அதிகாரப்பூர்வ அரசமாதா நிலையையும் தெரிவிக்கிறது.
- source_word: אֲשֶׁר עָשְׂתָה לַאֲשֵׁרָה
  choice: ஏனெனில் அவள் அசேராவுக்காக … செய்திருந்தாள்
  rationale: இச்சொற்றொடரை நீக்கத்திற்கான காரணமாக வாசித்து, அசேராவைத் தெய்வம்/வழிபாட்டுச் சின்னம் என்ற இரு தொடர்புகளையும் முற்றாகத் தீர்மானிக்காமல் பெயராக வைத்திருக்கிறது.
- source_word: מִפְלָצֶת
  choice: அருவருப்பூட்டும் ஓர் உருவம்
  rationale: அச்சமூட்டும் அல்லது வெறுப்பூட்டும் வழிபாட்டுப் பொருள் என்ற அரிய சொல்லின் உணர்வைத் தருகிறது; பின்னர் வெட்டி, தூளாக்கி, எரிக்கப்படும் பொருள் என்பதால் ‘உருவம்’ சூழலிலிருந்து தெளிவாக்கப்படுகிறது.
- source_word: וַיִּכְרֹת
  choice: வெட்டி வீழ்த்தி
  rationale: மரத்தாலானதாகத் தோன்றும் வழிபாட்டுப் பொருளை வெட்டி அகற்றிய செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וַיָּדֶק
  choice: தூளாக்கி
  rationale: சிறு துண்டுகளாக அல்லது பொடியாக நொறுக்குதல் என்ற வினையின் வலுவான பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: וַיִּשְׂרֹף
  choice: எரித்தான்
  rationale: எபிரெய வினையின் நேரான, இயல்பான தமிழ் இணை.
- source_word: בְּנַחַל קִדְרוֹן
  choice: கீதரோன் பள்ளத்தாக்கில்
  rationale: נחל என்பதன் பள்ளத்தாக்கு/நீரோடைப் பள்ளம் என்ற புவியியல் பொருளுக்கு வாசிக்க எளிய தமிழ்; மாற்று நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: אֲשֵׁרָה என்பதன் குறிப்பு
  choice: ‘அசேரா’ எனப் பெயரைத் தக்கவைத்தல்
  alternative: ‘அசேரா கம்பம்’ அல்லது ‘தோப்பு’
  rationale: சொல் தெய்வத்தையோ அதனுடன் தொடர்புடைய வழிபாட்டுச் சின்னத்தையோ குறிக்கலாம். பொருளின் வடிவத்தை ‘கம்பம்’ என மிகையாகத் தீர்மானிக்காமலும், பழைய ‘தோப்பு’ என்ற மொழிபெயர்ப்பால் பண்டைய வழிபாட்டுச் சூழலை மறைக்காமலும் பெயர் தக்கவைக்கப்படுகிறது.
- issue: גְּבִירָה என்ற அரசவைப் பட்டம்
  choice: ‘அரசமாதா பதவி’
  alternative: ‘பெருமாட்டி’ அல்லது ‘அரசி’
  rationale: யூதாவின் அரசவைக் சூழலில் இது ராஜாவின் தாய் அல்லது அந்தப் பங்கை வகித்த அரச குடும்பப் பெண்ணின் அங்கீகரிக்கப்பட்ட உயர்நிலையைக் குறிக்கிறது; ‘பதவி’ என்பது அவள் அந்த நிலையிலிருந்து நீக்கப்பட்டதைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அரசமாதா’ வரலாற்று அரசவைப் பதவியைச் சுருக்கமாகத் தருகிறது. அரிய מִפְלָצֶת சொல்லின் வெறுப்பு/திகில் நுணுக்கம் ‘அருவருப்பூட்டும் உருவம்’ எனப் பாதுகாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
