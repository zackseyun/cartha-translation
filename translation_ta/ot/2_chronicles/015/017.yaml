language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/הַ֨/בָּמ֔וֹת לֹא סָ֖רוּ מִ/יִּשְׂרָאֵ֑ל רַ֧ק לְבַב אָסָ֛א הָיָ֥ה שָׁלֵ֖ם כָּל יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: ta
  text: ஆனால், மேடைகள் இஸ்ரவேலிலிருந்து அகற்றப்படவில்லை; இருந்தாலும், ஆசாவின் இதயம் அவரது வாழ்நாளெல்லாம் முழுமையானதாக இருந்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: மேடைகள்
  rationale: வழிபாட்டுக்காகப் பயன்படுத்தப்பட்ட உயர்ந்த இடங்களைக் குறிக்கும் எபிரெயச் சொல்லை, வேதாகமச் சூழலில் வழக்கமான ‘மேடைகள்’ என்று மொழிபெயர்க்கிறது.
- source_word: לֵבַב ... שָׁלֵם
  choice: இதயம் ... முழுமையாக இருந்தது
  rationale: ‘முழு/பிளவுபடாத இதயம்’ என்ற மூல உருவகத்தையும் அதன் நெறி-இறையியல் பதற்றத்தையும் காக்கிறது; ‘முழுமையாக அர்ப்பணிக்கப்பட்டது’ என்று விளக்கமாக மட்டும் குறுக்குவதில்லை.
- source_word: כָּל־יָמָיו
  choice: அவரது வாழ்நாளெல்லாம்
  rationale: சொற்சொல்லான ‘அவருடைய எல்லா நாட்களிலும்’ என்பதற்கான இயல்பான நவீனத் தமிழ் வடிவம்.
theological_decisions:
- issue: மேடைகள் அகற்றப்படாதபோதும் ஆசாவின் இதயம் ‘முழுமையாக’ இருந்ததாகக் கூறப்படுவது
  choice: இரு கூற்றுகளையும் ‘இருந்தாலும்’ என்பதன் மூலம் அப்படியே இணைத்து, பதற்றத்தைத் தக்கவைத்தல்
  alternative: ஆசா தனிப்பட்ட முறையில் முழுமையாக அர்ப்பணிக்கப்பட்டிருந்தார் என்று விளக்கிச் சமரசப்படுத்துதல்
  rationale: மூல வசனம் தோல்விக்கும் இதயத்தின் முழுமைக்கும் இடையிலான பதற்றத்தைத் தீர்க்காமல் வைக்கிறது; மொழிபெயர்ப்பும் அதைத் தீர்க்கக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதும் கண்ணியமானதும். ‘இதயம் முழுமையாக இருந்தது’ என்ற சற்றே செறிவான வேதாகம உருவகம், மூலத்தின் திட்டமிட்ட மொழிநடையைப் பாதுகாக்கிறது.
