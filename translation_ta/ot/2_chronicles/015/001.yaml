  text: The Spirit of God came upon Azariah son of Oded[a].
translation:
  language: ta
  text: தேவனுடைய ஆவி ஓதேதின் மகனாகிய அசரியாவின் மேல் வந்தது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனுடைய ஆவி ஓதேதின் மகனாகிய அசரியாவின் மேல் இருந்தது.”
    reason: הָיְתָה עָלָיו என்பதன் நேரடியான, நிலைமையைக் குறிக்கும் மாற்று மொழிபெயர்ப்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: וַ/עֲזַרְיָהוּ
  choice: அசரியா
  rationale: וַ־ என்பது கதையின் தொடர்ச்சியைக் குறிக்கிறது; இங்கு தனியாக ‘அப்போது’ அல்லது ‘மேலும்’ என்று சேர்ப்பது இயல்பற்றதும் மூலத்தில் இல்லாத காலச்சுட்டை உருவாக்கக்கூடியதும் ஆகும். பெயர் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பின்படி தரப்பட்டுள்ளது.
- source_word: בֶּן עוֹדֵד
  choice: ஓதேதின் மகனாகிய
  rationale: בֶּן இச்சூழலில் நேரடியான தந்தை–மகன் உறவையே இயல்பாகக் குறிக்கிறது; ‘வழித்தோன்றல்’ என்று விரிவாக்கத் தேவையில்லை.
- source_word: הָיְתָה עָלָיו
  choice: அசரியாவின்மேல் வந்தது
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவன்மேல் இருந்தது’ எனலாம். ஆனால் தீர்க்கதரிசன உரையை அறிமுகப்படுத்தும் இச்சூழலில், ஆவி ஒருவர்மேல் செயலாற்ற வந்த நிகழ்வுணர்வை ‘மேல் வந்தது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רוּחַ אֱלֹהִים
  choice: தேவனுடைய ஆவி
  rationale: எபிரெயக் கட்டமைப்பு தேவனுக்குரிய ஆவியைக் குறிக்கிறது. தீர்க்கதரிசனத் தூண்டுதலின் சூழலில் ‘தேவனுடைய ஆவி’ என்பது இயல்பானதும் குறிப்பானதுமான தமிழ் வடிவம்.
theological_decisions:
- issue: רוּחַ אֱלֹהִים என்பதை தனிப்பட்ட இறையியல் பொருளில் மொழிபெயர்ப்பதா, அல்லது ‘தெய்வீக ஆவி’ போன்ற தெளிவற்ற வடிவில் தருவதா
  choice: தேவனுடைய ஆவி
  alternative: தேவனிடமிருந்து ஓர் ஆவி / ஒரு தெய்வீக ஆவி
  rationale: இச்சொற்றொடர் நாளாகமத்தில் தீர்க்கதரிசனத் தூண்டுதலையும் தேவனால் அளிக்கப்படும் ஆற்றலையும் அறிமுகப்படுத்துகிறது. ‘தேவனுடைய ஆவி’ என்பது எபிரெயச் சொற்றொடரின் உறவையும் குறிப்புத்தன்மையையும் காக்கிறது; அதேவேளை வசனம் கூறுவதைத் தாண்டிய கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, மரியாதைமிக்க நடையைப் பயன்படுத்துகிறது. ‘அசரியாவின்மேல்’ என்ற குறிப்பிடுதல் தமிழ் வாசகத்தில் தெளிவை அளிக்கிறது; எபிரெயில் உள்ள ஆண்பால் ஒருமைச் சுட்டுப்பெயரின் குறிப்பு அசரியாவே.
