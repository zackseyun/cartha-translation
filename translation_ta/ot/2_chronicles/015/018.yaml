  text: וַ/יָּבֵ֞א אֶת קָדְשֵׁ֥י אָבִ֛י/ו וְ/קָֽדָשָׁ֖י/ו בֵּ֣ית הָ/אֱלֹהִ֑ים כֶּ֥סֶף וְ/זָהָ֖ב וְ/כֵלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/018.yaml
  text: 'He brought into the house of God his father''s holy gifts and his own holy gifts: silver, gold, and vessels.'
translation:
  language: ta
  text: அவன் தன் தந்தை அர்ப்பணித்த புனிதப் பொருட்களையும், தான் அர்ப்பணித்த புனிதப் பொருட்களையும்—வெள்ளி, தங்கம், பாத்திரங்கள் ஆகியவற்றை—கடவுளின் ஆலயத்திற்குள் கொண்டுவந்தான்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי אָבִיו
  choice: தன் தந்தை அர்ப்பணித்த புனிதப் பொருட்கள்
  rationale: קֹדֶשׁ என்பதன் அர்ப்பணிக்கப்பட்டு புனிதமாக்கப்பட்ட பொருட்கள் என்ற பொருளைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: וְקָדָשָׁיו
  choice: தான் அர்ப்பணித்த புனிதப் பொருட்கள்
  rationale: இணையான எபிரெய அமைப்பைப் பேணி, இவை ஆசாவுக்குச் சொந்தமானவை மட்டுமல்ல, அவனால் அர்ப்பணிக்கப்பட்டவை என்பதையும் தெரிவிக்கிறது.
- source_word: בֵּית הָאֱלֹהִים
  choice: கடவுளின் ஆலயம்
  rationale: சொற்பொருளில் ‘கடவுளின் வீடு’; இச்சூழலில் இயல்பான தமிழ் வேதாகம நடையில் ஆலயத்தைக் குறிக்கிறது.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: வெள்ளி, தங்கம், பாத்திரங்கள்
  rationale: பட்டியலின் நேரடியான பொருளையும் வரிசையையும் பேணுகிறது; כֵּלִים இங்கு ஆலயப் பயன்பாட்டுப் பாத்திரங்கள் அல்லது உபகரணங்களைக் குறிக்கலாம்.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘புனிதப் பொருட்கள்’ என்பது அவை அர்ப்பணிக்கப்பட்டவை என்ற வழிபாட்டுச் சூழலைத் தக்கவைக்கிறது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
