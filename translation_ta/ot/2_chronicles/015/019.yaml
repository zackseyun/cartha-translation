  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
translation:
  language: ta
  text: ஆசாவின் ஆட்சியின் முப்பத்தைந்தாம் ஆண்டுவரை போர் ஏற்படவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆசாவின் ஆட்சியின் முப்பத்தைந்து ஆண்டு வரை.” தொடர்புடைய வேதப்பகுதிகளுடன் ஒத்திசைப்பதற்காக, சிலர் இந்த எண்ணை ஆசாவின் ஆட்சியாண்டுகளை மட்டும் கொண்டு கணக்கிடாமல், விரிவான ஒரு காலக்கணிப்பு முறையின்படி புரிந்துகொள்கிறார்கள்.
    reason: மாற்று வடிவம் மற்றும் காலக்கணிப்பு சார்ந்த விளக்கத்தைச் சுட்டிக்காட்டுதல்
lexical_decisions:
- source_word: וּ/מִלְחָמָה לֹא הָיָתָה
  choice: போர் ஏற்படவில்லை
  rationale: இணைப்புச் சொல்லுடன் வரும் இந்த இருப்பைக் குறிக்கும் எதிர்மறை வாக்கியத்தை, நவீன தமிழில் இயல்பாகவும் முழுமையான மறுப்புடனும் இவ்வாறு வழங்குகிறது.
- source_word: עַד
  choice: வரை
  rationale: போர் இல்லாத காலப்பகுதியின் முடிவெல்லையைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: שְׁנַת שְׁלֹשִׁים וְחָמֵשׁ
  choice: முப்பத்தைந்தாம் ஆண்டு
  rationale: கட்டமைப்பு நிலையிலுள்ள ‘ஆண்டு’ என்பதையும் முப்பத்தைந்து என்ற எண்ணையும் தமிழுக்குரிய வரிசை எண்ணாகத் தெளிவாக வழங்குகிறது.
- source_word: לְמַלְכוּת
  choice: ஆட்சியின்
  rationale: இங்கு מַלְכוּת அரசனுடைய ஆட்சிக்காலத்தைக் குறிப்பதால், ‘ஆட்சி’ என்பது இயல்பான பொருத்தம்.
- source_word: אָסָא
  choice: ஆசா
  rationale: எபிரெயப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: ஆசாவைப் பற்றிய பிற காலக்கணக்குகளுடன் இவ்வசனத்தின் தொடர்பு
  choice: எபிரெய உரையிலுள்ள ஆட்சியாண்டுக் குறிப்பை ‘ஆசாவின் ஆட்சியின் முப்பத்தைந்தாம் ஆண்டு’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: பிரிந்த அரசின் தொடக்கத்திலிருந்து கணக்கிடும் விரிவான காலக்கணிப்பாக விளக்குதல் அல்லது பிற பகுதிகளுடன் ஒத்திசைக்க எண்ணைத் திருத்துதல்
  rationale: எபிரெய உரை இந்த ஆண்டை ஆசாவின் ஆட்சியோடு நேரடியாக இணைக்கிறது. மொழிபெயர்ப்பு அந்த உரையை மாற்றாமல் வைத்திருக்க வேண்டும்; காலவரிசைச் சிக்கலை அடிக்குறிப்பில் மட்டும் சுட்டிக்காட்டுவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான வரலாற்று உரைநடை. எபிரெய வாக்கியத்தின் கால எல்லையும் காலக்கணிப்பு சார்ந்த பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
