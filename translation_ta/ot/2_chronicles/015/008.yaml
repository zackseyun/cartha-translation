  text: וְ/כִ/שְׁמֹ֨עַ אָסָ֜א הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה וְ/הַ/נְּבוּאָה֮ עֹדֵ֣ד הַ/נָּבִיא֒ הִתְחַזַּ֗ק וַ/יַּעֲבֵ֤ר הַ/שִּׁקּוּצִים֙ מִ/כָּל אֶ֤רֶץ יְהוּדָה֙ וּ/בִנְיָמִ֔ן וּ/מִן הֶ֣/עָרִ֔ים אֲשֶׁ֥ר לָכַ֖ד מֵ/הַ֣ר אֶפְרָ֑יִם וַ/יְחַדֵּשׁ֙ אֶת מִזְבַּ֣ח יְהוָ֔ה אֲשֶׁ֕ר לִ/פְנֵ֖י אוּלָ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
translation:
  language: ta
  text: ஆசா இந்த வார்த்தைகளையும் இறைவாக்கினரான ஓதேதின் தீர்க்கதரிசனத்தையும்[a] கேட்டபோது, தைரியமடைந்து, யூதா, பென்யமீன் நாடு முழுவதிலிருந்தும், எப்பிராயீம் மலைநாட்டில் தான் கைப்பற்றியிருந்த நகரங்களிலிருந்தும் அருவருப்பான பொருட்களை அகற்றினான். மேலும், யாவேயின் முன்மண்டபத்திற்கு முன்னால் இருந்த யாவேயின் பலிபீடத்தைப் புதுப்பித்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய உரை: “இறைவாக்கினரான ஓதேதின் தீர்க்கதரிசனம்.” சுற்றியுள்ள சூழலைக் கருத்தில் கொண்டு, சில விளக்கங்களும் உரைஆய்வுகளும் இதை ஓதேதின் மகனான அசரியாவுடன் தொடர்புபடுத்துகின்றன.'
    reason: textual_variant
lexical_decisions:
- source_word: וְכִשְׁמֹעַ
  choice: கேட்டபோது
  rationale: முன்னிடைச்சொல் இணைந்த infinitive construct காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பாக நிகழ்வுகளின் வரிசையைப் பாதுகாக்கிறது.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: இந்த வார்த்தைகள்
  rationale: உடனுள்ள சூழலில் முன்பு உரைக்கப்பட்ட செய்தியைக் குறிப்பதால், ‘காரியங்கள்’ என்பதைக் காட்டிலும் ‘வார்த்தைகள்’ பொருத்தமானது.
- source_word: וְהַנְּבוּאָה
  choice: தீர்க்கதரிசனம்
  rationale: נְבוּאָה என்பதன் நேரடியான பொருளைத் தக்கவைத்து, இறைவாக்குச் செய்தியுடனான தொடர்பைப் பாதுகாக்கிறது.
- source_word: עֹדֵד הַנָּבִיא
  choice: இறைவாக்கினனான ஓதேத்
  rationale: எபிரெய மெய்யெழுத்துப் பிரதியில் உள்ள ஓதேத் என்ற பெயரையும் ‘இறைவாக்கினன்’ என்ற அடைமொழியையும் மாற்றமின்றி மொழிபெயர்க்கிறது.
- source_word: הִתְחַזַּק
  choice: தைரியமடைந்து
  rationale: Hitpael வடிவம் செய்திக்குப் பதிலாக ஆசா உறுதியும் துணிவும் பெற்றதைக் குறிக்கிறது; நவீன தமிழில் இயல்பான வெளிப்பாடு.
- source_word: וַיַּעֲבֵר הַשִּׁקּוּצִים
  choice: அருவருப்பான பொருட்களை அகற்றினான்
  rationale: שִׁקּוּצִים பொதுவாக அருவருப்பான சிலைவழிபாட்டுப் பொருட்களைக் குறிக்கலாம்; ‘பொருட்கள்’ என்பது மூலத்தின் பொதுத்தன்மையைப் பாதுகாக்க, ‘அகற்றினான்’ causative விளைவைத் தெரிவிக்கிறது.
- source_word: מִכָּל אֶרֶץ יְהוּדָה וּבִנְיָמִן
  choice: யூதா மற்றும் பென்யமீன் நாடு முழுவதிலிருந்தும்
  rationale: אֶרֶץ இங்கு அரசியல்-புவியியல் நிலப்பரப்பைக் குறிக்கிறது; ‘நாடு முழுவதிலும்’ என்பது இயல்பான தமிழ்.
- source_word: וּמִן הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם
  choice: எப்பிராயீம் மலைநாட்டில் தான் கைப்பற்றியிருந்த நகரங்களிலிருந்தும்
  rationale: לכד என்பதற்கு ‘கைப்பற்று’ நேரான இணை; מֵהַר என்பதன் புவியியல் தொடர்பை தமிழில் தெளிவாக ‘மலைநாட்டில்’ என வழங்குகிறது.
- source_word: וַיְחַדֵּשׁ
  choice: புதுப்பித்தான்
  rationale: Piel חדשׁ இன் ‘புதிதாக்குதல்/புதுப்பித்தல்’ என்ற பரந்த பொருளைப் பாதுகாக்கிறது; வெறும் உடல் பழுதுபார்ப்பாகக் குறுக்கவில்லை.
- source_word: מִזְבַּח יְהוָה
  choice: யாவேயின் பலிபீடம்
  rationale: Construct உறவை இயல்பான தமிழ் உடைமை வடிவில் வழங்குகிறது; தெய்வீகப் பெயர் தனிப்பெயராகப் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֶׁר לִפְנֵי אוּלָם יְהוָה
  choice: யாவேயின் முன்மண்டபத்திற்கு முன்னால் இருந்த
  rationale: אוּלָם ஆலயத்தின் porch/vestibule ஐக் குறிக்கிறது; ‘முன்மண்டபம்’ கட்டடப் பொருளை அணுகத்தக்க தமிழில் தெரிவிக்கிறது, לִפְנֵי இன் இடவுறவை ‘முன்னால்’ காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயரான நான்கெழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: ‘ஓதேத் இறைவாக்கினன்’ என்பதைச் சுற்றியுள்ள உரைச் சிக்கல்
  choice: மசோரா உரையின்படி ‘இறைவாக்கினனான ஓதேத்’
  alternative: சுற்றியுள்ள சூழலோடு ஒத்திசைத்து ‘ஓதேதின் மகனான அசரியா இறைவாக்கினன்’
  rationale: கொடுக்கப்பட்ட WLC உரை עֹדֵד הַנָּבִיא என்று வாசிக்கிறது. சூழலிலுள்ள இழுபறியை அமைதியாகத் தீர்க்காமல், முதன்மை உரை மூலத்தைப் பின்பற்றி மாற்று புரிதலை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘முன்மண்டபம்’, ‘பலிபீடம்’, ‘தீர்க்கதரிசனம்’ ஆகியவை வேதாகமச் சூழலுக்குரியவையாக இருந்தாலும் பரவலாக அறியப்பட்ட சொற்கள். மூலத்தின் இரு இணைச் செயற்பாடுகள் வாசிப்புத் தெளிவுக்காக இரண்டு வாக்கியங்களாக அமைக்கப்பட்டுள்ளன.
