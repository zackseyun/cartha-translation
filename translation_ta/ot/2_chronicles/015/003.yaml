source:
  edition: WLC
  text: וְ/יָמִ֥ים רַבִּ֖ים לְ/יִשְׂרָאֵ֑ל לְ/לֹ֣א אֱלֹהֵ֣י אֱמֶ֗ת וּ/לְ/לֹ֛א כֹּהֵ֥ן מוֹרֶ֖ה וּ/לְ/לֹ֥א תוֹרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/003.yaml
  text: For many days Israel was without the true God[a], without a teaching priest[b], and without the law.
translation:
  language: ta
  text: பல நாட்களாக இஸ்ரவேல் உண்மையான கடவுள்[a] இல்லாமலும், போதிக்கும் ஆசாரியன் இல்லாமலும், போதனை இல்லாமலும் இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையின் கடவுள்” அல்லது “உண்மையுள்ள கடவுள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָמִים רַבִּים
  choice: பல நாட்களாக
  rationale: காலநீட்சியைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான தமிழில் தருகிறது; தொடக்க இணைப்புச்சொல் உரையோட்டத்தில் உட்கொள்ளப்படுகிறது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேல் ... இருந்தது
  rationale: לְ இங்கு இஸ்ரவேலின் நிலையைச் சுட்டுகிறது; தமிழில் எழுவாய்–நிலை வாக்கியமாக அமைப்பது இயல்பானது.
- source_word: לְלֹא אֱלֹהֵי אֱמֶת
  choice: உண்மையான கடவுள்[a] இல்லாமலும்
  rationale: לְלֹא என்பதை ‘இல்லாமல்’ என்றும், ‘உண்மையின் கடவுள்/உண்மையுள்ள கடவுள்’ என்ற கட்டமைப்பைச் சூழலுக்கேற்ற ‘உண்மையான கடவுள்’ என்றும் வழங்குகிறது; மாற்று நுணுக்கம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: כֹּהֵן מוֹרֶה
  choice: போதிக்கும் ஆசாரியன்
  rationale: מוֹרֶה என்பது தொடர்ச்சியான கற்பித்தல் பணியைச் சுட்டும் வினையெச்சம்; ‘போதிக்கும் ஆசாரியன்’ என்பது அந்தப் பணியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תּוֹרָה
  choice: போதனை
  rationale: תּוֹרָה இச்சூழலில் சட்டத் தொகுப்பை மட்டும் அல்லாமல் அறிவுறுத்தல் அல்லது போதனை என்ற பரந்த பொருளையும் உடையது; முந்தைய ‘போதிக்கும் ஆசாரியன்’ என்பதோடு சூழலியல்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: אֱלֹהֵי אֱמֶת என்பதன் பொருள் மற்றும் வரையறுத்த தன்மை
  choice: உண்மையான கடவுள்
  alternative: உண்மையின் கடவுள்; உண்மையுள்ள கடவுள்; உண்மையான ஒரு கடவுள்
  rationale: இஸ்ரவேலைப் பற்றிய உடன்படிக்கைச் சூழலில் குறிப்பிட்ட கடவுளையே குறிக்கும் வாசிப்பு இயல்பானது. ஆயினும் எபிரெயக் கட்டமைப்பின் ‘உண்மை/உண்மைத்தன்மை’ நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: போதனை
  alternative: சட்டம்; திருச்சட்டம்; அறிவுறுத்தல்
  rationale: ஆசாரியனின் போதிக்கும் பணியுடன் இணைந்துள்ளதால், இங்கு சட்ட விதிகளை மட்டும் குறுகலாகக் குறிப்பதற்குப் பதிலாக மூலச்சொல்லின் பரந்த கற்பித்தல் பொருளை ‘போதனை’ காக்கிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆசாரியன்’ வேதாகமச் சூழலில் பரவலாக அறியப்படும் சொல்லாக வைக்கப்பட்டுள்ளது. மூன்று முறை வரும் לְלֹא அமைப்பின் இணைநிலையை ‘இல்லாமலும்’ என்ற மறுமொழியால் காக்கப்பட்டுள்ளது. தேவையற்ற அடிக்குறிப்பு குறியீடு சேர்க்கப்படவில்லை; உள்ள ஒரே குறியீடு [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
