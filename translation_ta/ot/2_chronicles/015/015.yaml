  text: וַ/יִּשְׂמְח֨וּ כָל יְהוּדָ֜ה עַל הַ/שְּׁבוּעָ֗ה כִּ֤י בְ/כָל לְבָבָ/ם֙ נִשְׁבָּ֔עוּ וּ/בְ/כָל רְצוֹנָ֣/ם בִּקְשֻׁ֔/הוּ וַ/יִּמָּצֵ֖א לָ/הֶ֑ם וַ/יָּ֧נַח יְהוָ֛ה לָ/הֶ֖ם מִ/סָּבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
translation:
  language: ta
  text: யூதாவினர் அனைவரும் அந்த உறுதிமொழியைக் குறித்து மகிழ்ந்தார்கள். ஏனெனில், அவர்கள் முழு இருதயத்தோடு உறுதிமொழி எடுத்தார்கள்; முழு மனவிருப்பத்தோடு அவரைத் தேடினார்கள். அவர்கள் தம்மைக் கண்டடையும்படி அவரும் அனுமதித்தார்.[a] யாவே அவர்களுக்குச் சுற்றிலும் ஓய்வு அளித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “அவர் அவர்களால் கண்டடையப்பட்டார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ כָל־יְהוּדָה
  choice: யூதா மக்கள் அனைவரும் ... மகிழ்ந்தார்கள்
  rationale: கூட்டாக மக்களைக் குறிக்கும் ‘யூதா முழுவதும்’ என்ற எபிரெயச் சொல்லை, இயல்பான நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עַל־הַשְּׁבוּעָה
  choice: அந்த ஆணையைக் குறித்து
  rationale: மகிழ்ச்சியின் காரணம் அல்லது பொருளைக் குறிக்கும் עַל என்பதையும், கடவுள்முன் செய்யப்பட்ட உறுதிமொழியான שְׁבוּעָה என்பதையும் பொருத்தமாகப் பேணுகிறது.
- source_word: בְכָל־לְבָבָם נִשְׁבָּעוּ
  choice: முழு இருதயத்தோடு ஆணையிட்டு
  rationale: முழுமையான உள்ளார்ந்த ஈடுபாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரையும், ஆணையிடுதல் என்ற செயற்பாட்டையும் பேணுகிறது.
- source_word: וּבְכָל־רְצוֹנָם בִּקְשֻׁהוּ
  choice: முழு மனவிருப்பத்தோடு அவரைத் தேடினார்கள்
  rationale: רָצוֹן என்பதிலுள்ள விருப்பம், மனமுவப்பு, மனவுறுதி ஆகிய நுண்ணிய பொருள்களை ‘மனவிருப்பம்’ இயல்பாகத் தாங்குகிறது; இணையான சொற்றொடர் அமைப்பும் பேணப்படுகிறது.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: அவரும் தம்மைக் கண்டடைய அவர்களுக்கு இடமளித்தார்
  rationale: நிபால் வடிவத்தின் நேரடி ‘அவர்களால் கண்டடையப்பட்டார்’ என்ற பொருளையும், இச்சூழலில் கடவுள் தம்மைக் கண்டடைய அனுமதித்தார் என்ற தொடர்பியல் நுண்பொருளையும் வாசிக்கத்தக்க தமிழில் தருகிறது.
- source_word: וַיָּנַח יְהוָה לָהֶם מִסָּבִיב
  choice: யாவே அவர்களுக்குச் சுற்றிலும் அமைதியளித்தார்
  rationale: הניח என்பதன் ‘இளைப்பாறுதல்/ஓய்வு அளித்தல்’ கருத்தை, சுற்றியுள்ள பகை அல்லது தொந்தரவிலிருந்து கிடைத்த அமைதி என இச்சூழலுக்கு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: וַיִּמָּצֵא לָהֶם என்பதின் தெய்வச் செயற்பாட்டு நுண்பொருள்
  choice: தம்மைக் கண்டடைய அவர்களுக்கு இடமளித்தார்
  alternative: அவர் அவர்களால் கண்டடையப்பட்டார்
  rationale: முதன்மை உரை எபிரெய நிபாலின் தொடர்பியல் நுண்பொருளை இயல்பாகக் காட்டுகிறது; அதிக நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டதால் மூலத்தின் வடிவவியல் தெளிவும் மறைக்கப்படவில்லை.
- issue: יְהוָה என்ற தெய்வீகப் பெயர்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பாகவும், வேதாகமச் சூழலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘இருதயம்’, ‘ஆணையிடுதல்’, ‘யாவே’ போன்ற சொற்கள் மூலத்தின் உடன்படிக்கைச் சாயலைப் பேணுகின்றன.
