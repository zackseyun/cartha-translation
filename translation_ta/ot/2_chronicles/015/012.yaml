  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בַ/בְּרִ֔ית לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
translation:
  language: ta
  text: அவர்கள் தங்கள் தந்தையரின் கடவுளான[b] யாவேவை முழு உள்ளத்தோடும் முழு உயிரோடும் தேடுவதற்காக அந்த உடன்படிக்கைக்குள் நுழைந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உடன்படிக்கையால் தங்களைக் கட்டுப்படுத்திக்கொண்டார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், “தங்கள் தந்தையரின் கடவுள்”; அதாவது, அவர்களுடைய முன்னோர்கள் வழிபட்ட உடன்படிக்கையின் கடவுள்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  choice: அந்த உடன்படிக்கைக்குள் நுழைந்தார்கள்
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்/நுழைதல்.’ בַבְּרִית உடன் இது உடன்படிக்கையில் தங்களை இணைத்துக்கொண்ட செயலைக் குறிக்கிறது. ‘நுழைந்தார்கள்’ மூல உருவகத்தைத் தக்கவைக்கிறது; எபிரெயிலுள்ள குறிப்பிட்ட உடன்படிக்கையைச் சுட்ட ‘அந்த’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִדְרוֹשׁ
  choice: தேடுவதற்காக
  rationale: דרש இங்கு கேள்வி கேட்பதை மட்டும் அல்லாமல், கடவுளை நாடி அவருக்கு உண்மையாய் இருப்பதைக் குறிக்கும் உடன்படிக்கைச் சொல். ‘தேடுதல்’ அதன் பரந்த பொருளையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெயத் தெய்வீகப் பெயரான יהוה-வின் தமிழொலிபெயர்ப்பு.
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: தங்கள் தந்தையரின் கடவுள்
  rationale: אבותיהם என்பது ஆண்பால் பன்மையில் ‘அவர்களுடைய தந்தையர்’ என்று உள்ளது. மூலத்தின் பாலினக் குறிப்பையும் முன்னோர்களுடனான உடன்படிக்கைத் தொடர்பையும் இந்த மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: בְּכָל לְבָבָם
  choice: முழு உள்ளத்தோடும்
  rationale: לֵבָב வெறும் உணர்ச்சியையோ அறிவையோ மட்டும் அல்லாமல் உள்மனிதரின் எண்ணம், விருப்பம், மனவுறுதி ஆகியவற்றைக் குறிக்கிறது. நவீன தமிழில் ‘முழு உள்ளத்தோடும்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּבְכָל נַפְשָׁם
  choice: முழு உயிரோடும்
  rationale: נֶפֶשׁ என்பதற்கு உயிர், உயிருள்ள தன்மை, முழு ஆளுமை ஆகிய பொருள் எல்லைகள் உண்டு. ‘முழு உயிரோடும்’ முழுமையான அர்ப்பணிப்பைத் தெரிவிப்பதுடன் தனியே பிரிந்த ஒரு உட்பொருள் என்ற விளக்கத்தைத் திணிப்பதையும் தவிர்க்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நேரடியாகத் தனிப்பெயரான יהוה-ஐப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது இஸ்ரவேலின் கடவுளுடைய உடன்படிக்கைப் பெயரைத் தக்கவைக்கிறது.
- issue: אֲבוֹתֵיהֶם என்பதிலுள்ள பாலினம் குறித்த முன்னோர் மொழி
  choice: தங்கள் தந்தையர்
  alternative: தங்கள் முன்னோர்
  rationale: எபிரெயச் சொல் வெளிப்படையாக ஆண்பால் பன்மையில் உள்ளது. ஆகவே பொதுப்பாலாக்காமல் மூலத்தின் வடிவமும் தந்தையர் வழியான உடன்படிக்கை நினைவும் காக்கப்படுகின்றன.
- issue: נֶפֶשׁ என்பதன் மனித இயல்பு சார்ந்த பொருள்
  choice: உயிர்
  alternative: ஆத்துமா; முழு ஆளுமை
  rationale: இச்சொல் உயிர், தன்னிலை, முழு நபர் எனப் பல பொருள்களை ஏற்கக்கூடும். ‘உயிர்’ முழுமையான ஈடுபாட்டை இயல்பாகக் கூறுகிறது; மனித இயல்பைப் பற்றிய குறிப்பிட்ட கோட்பாட்டை வசனத்துக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. ‘உள்ளம்,’ ‘உயிர்’ ஆகியவை பொதுவாசகர்களுக்குப் புரியும் சொற்களாக இருப்பதுடன் எபிரெயின் பரந்த பொருள் எல்லைகளையும் காக்கின்றன. [a], [b] ஆகிய குறிப்புக்குறிகள் உரையில் தொடர்புடைய சொற்றொடர்களுக்குப் பின் இடப்பட்டுள்ளன.
