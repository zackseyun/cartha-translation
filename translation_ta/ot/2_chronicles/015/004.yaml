- issue: וַיִּמָּצֵא לָהֶם என்பதில் கடவுளின் செயற்பாடு
  choice: ‘அவர்களுக்குத் தம்மைக் காணும்படி செய்தார்’
  alternative: ‘அவர்களால் கண்டுகொள்ளப்பட்டார்’
  rationale: மூலத்தின் நிஃபால் வடிவம் செயல்பாட்டு மற்றும் அனுமதிப்பொருள் இரண்டுக்கும் இடமளிக்கிறது. முதன்மை உரை கடவுளின் பதிலளிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; நேரடி இறைச்செயப்பாட்டு வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
