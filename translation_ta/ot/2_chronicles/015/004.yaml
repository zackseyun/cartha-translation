base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
translation:
  language: ta
  text: ஆனால் அவர்கள் துன்பத்தில் இருந்தபோது, இஸ்ரவேலின் கடவுளான யாவேயிடம்[a] திரும்பி, அவரைத் தேடினார்கள்; அவர் அவர்களால் கண்டுகொள்ளப்பட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் יהוה (YHWH), இஸ்ரவேலின் கடவுளின் தனிப்பெயர்; இது ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: divine_name
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “அவர் அவர்களுக்குக் கிடைத்தார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: திரும்பி
  rationale: שׁוּב என்பது திரும்புதல் அல்லது மீண்டும் ஒருவரிடம் வருதல் என்பதைக் குறிக்கிறது; இங்கு கடவுளிடம் புதிதாகத் திரும்புவதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּצַּר לוֹ
  choice: துன்பத்தில் இருந்தபோது அவர்கள்
  rationale: எபிரெயில் ஒருமை வடிவம் இருந்தாலும், சூழலில் அது இஸ்ரவேலைக் கூட்டாகக் குறிக்கிறது; தொடர்ந்து வரும் பன்மை வடிவங்களோடு இயல்பாக இணைய தமிழில் பன்மை பயன்படுத்தப்பட்டது.
- source_word: עַל יְהוָה
  choice: யெகோவாவிடம்
  rationale: שׁוּב உடன் வரும் עַל இங்கு ஒருவரிடம் திரும்புவதைச் சுட்டுகிறது. יהוה என்பது பட்டப்பெயராக மாற்றப்படாமல் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: எபிரெயக் கட்டமைப்பின் உடைமை மற்றும் அடையாள உறவைத் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: וַיְבַקְשֻׁהוּ
  choice: அவரைத் தேடினார்கள்
  rationale: בקשׁ என்பது இங்கு கடவுளைச் சார்ந்து அவரை நாடுவதைச் சுட்டுகிறது; ‘தேடினார்கள்’ என்பது நேரடியும் இயல்புமான தமிழ்.
- source_word: וַיִּמָּצֵא לָהֶם
  choice: அவரும் அவர்களுக்குத் தம்மைக் காணும்படி செய்தார்
  rationale: מצא என்பதன் நிஃபால் வடிவம் ‘காணப்பட்டார்’ என நேரடியாக வரலாம்; ஆனால் இங்கு கடவுளின் பதிலளிக்கும் செயற்பாட்டையும், தற்செயலாகக் கண்டுபிடித்தார்கள் என்ற தவறான உணர்வைத் தவிர்ப்பதையும் இந்த வடிவம் சமநிலைப்படுத்துகிறது.
