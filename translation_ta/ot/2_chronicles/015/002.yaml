base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
translation:
  language: ta
  text: 'அவன் ஆசாவைச் சந்திக்கப் புறப்பட்டு, அவனிடம், “ஆசாவே, யூதாவினரே, பென்யமீனியரே, எனக்குச் செவிகொடுங்கள்: நீங்கள் யாவேயோடு இருக்கும்வரை அவர் உங்களோடு இருப்பார். நீங்கள் அவரைத் தேடினால், அவர் உங்களுக்குக் கிடைப்பார்[a]; ஆனால் நீங்கள் அவரைக் கைவிட்டால், அவர் உங்களைக் கைவிடுவார்” என்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீங்கள் அவரைக் கண்டடைவீர்கள்.”
    reason: יִמָּצֵא לָכֶם என்பதன் செயப்பாட்டு வடிவிலான இயல்பான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וַיֵּצֵא לִפְנֵי אָסָא
  choice: அவன் ஆசாவைச் சந்திக்கப் புறப்பட்டு
  rationale: இயக்கத்தைக் குறிக்கும் இச்சூழலில் לִפְנֵי என்பது வெறுமனே ‘முன்பாக’ என்பதைக் காட்டிலும் ஒருவரை எதிர்கொண்டு சந்திக்கச் செல்வதைக் குறிக்கிறது.
- source_word: שְׁמָעוּנִי
  choice: அனைவரும் எனக்குச் செவிகொடுங்கள்
  rationale: பன்மை ஏவல் வடிவத்தையும் நேரடியான தீர்க்கதரிசன அழைப்பின் தொனியையும் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு வடிவத்தில் வழங்குகிறது.
- source_word: עִמָּכֶם ... עִמּוֹ
  choice: உங்களோடு இருப்பார் ... நீங்கள் அவரோடு இருக்கும்வரை
  rationale: எபிரெயச் சொற்றொடரின் பரஸ்பர அமைப்பையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: תִּדְרְשֻׁהוּ
  choice: அவரைத் தேடினால்
  rationale: உடன்படிக்கை மற்றும் வழிபாட்டுச் சூழலில் דרש என்பது வெறுமனே விசாரிப்பதை அல்ல, கடவுளை நாடித் தேடுவதைக் குறிக்கிறது.
- source_word: יִמָּצֵא לָכֶם
  choice: அவர் உங்களுக்குக் காணப்படுவார்
  rationale: நிபால் வடிவத்தின் ‘காணப்படுதல்’ என்ற பொருளை இயல்பான தமிழில் காத்து, ‘நீங்கள் அவரைக் கண்டடைவீர்கள்’ என்று செயப்படுபொருள் அமைப்பை மாற்றாமல் இருக்கிறது.
- source_word: תַּעַזְבֻהוּ ... יַעֲזֹב אֶתְכֶם
  choice: நீங்கள் அவரைக் கைவிட்டால், அவர் உங்களைக் கைவிடுவார்
  rationale: ஒரே எபிரெய வினைச்சொல்லின் மறுமொழி போன்ற பரஸ்பர அமைப்பை ஒரே தமிழ் வினைச்சொல்லால் காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை சார்ந்த நிபந்தனை மற்றும் பரஸ்பரத் தன்மை
  choice: யெகோவா மக்களோடு இருப்பது, அவர்கள் அவரோடு இருப்பதுடன் தொடர்புடையதாகவும், தேடுதல் மற்றும் கைவிடுதல் ஆகியவற்றுக்குத் தொடர்பான விளைவுகள் உள்ளதாகவும் நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: இவற்றை உடன்படிக்கை நிபந்தனைகளாக அல்லாமல் அனுபவ உணர்வுகளை மட்டும் குறிக்கும் மென்மையான கூற்றுகளாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரையில் வெளிப்படையான நிபந்தனை வாக்கியங்களும் பரஸ்பரச் சொல் அமைப்பும் உள்ளன. நிலைத்திருத்தல் அல்லது விசுவாசத்திலிருந்து விலகுதல் பற்றிய விரிவான கோட்பாட்டைச் சேர்க்காமல், வசனத்தின் இறையியல் பதற்றம் அப்படியே காக்கப்படுகிறது.
- issue: יִמָּצֵא என்ற நிபால் வடிவத்தின் இறையியல் நுணுக்கம்
  choice: அவர் உங்களுக்குக் காணப்படுவார்
  alternative: அவர் தம்மைக் கண்டடைய உங்களை அனுமதிப்பார்
  rationale: மூலத்தின் செயப்பாட்டு அல்லது தற்சுட்டு நுணுக்கத்தைத் திறந்தவாறே வைத்து, கடவுள் தம்மை அணுக அனுமதிக்கிறார் என்ற விளக்கத்தை உரைக்குள் கட்டாயமாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் இயல்பான, கண்ணியமான நடை. தீர்க்கதரிசன உரையின் நேரடித் தொனியும் எபிரெய மூலத்தின் பரஸ்பரச் சொல் அமைப்பும் காக்கப்பட்டுள்ளன.
