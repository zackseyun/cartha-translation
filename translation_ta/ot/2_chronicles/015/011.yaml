base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
translation:
  language: ta
  text: அந்த நாளில், அவர்கள் கொண்டுவந்த கொள்ளைப் பொருளிலிருந்து[a] எழுநூறு மாடுகளையும் ஏழாயிரம் ஆடுகளையும்[b] யாவேக்குப் பலியிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “போரில் கைப்பற்றிய பொருளிலிருந்து.” எபிரெயச் சொல் போரில் கொள்ளையாகக் கைப்பற்றப்பட்டவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “ஆடுகள்” என்பதற்கான எபிரெயச் சொல் செம்மறியாடுகளையும் வெள்ளாடுகளையும் உள்ளடக்கிய மந்தை விலங்குகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: பலியிட்டார்கள்
  rationale: זבח என்பது இங்கு வழிபாட்டுச் சூழலில் விலங்குகளைப் பலியாகச் செலுத்துவதைக் குறிக்கிறது. ‘பலியிட்டார்கள்’ என்பது சுருக்கமாகவும் இயல்பாகவும் சடங்குசார் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ என்பது பலியைப் பெறுபவரைக் குறிக்கிறது; יהוה என்ற இறைப் பெயர் பெயராகவே ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בַּיּוֹם הַהוּא
  choice: அந்த நாளில்
  rationale: எபிரெய காலக் குறிப்பை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִן הַשָּׁלָל
  choice: கொள்ளைப் பொருளிலிருந்து
  rationale: שָׁלָל என்பது போரில் கைப்பற்றப்பட்ட பொருட்களைக் குறிக்கிறது. ‘கொள்ளைப் பொருள்’ மூலச்சொல்லின் பொருளையும் வாக்கியத்தின் முறையான நடையையும் காக்கிறது.
- source_word: הֵבִיאוּ
  choice: அவர்கள் கொண்டுவந்த
  rationale: பலியிடுவதற்கு முன்பே அந்தப் பொருளை அவர்கள் கொண்டுவந்திருந்தனர் என்ற நிகழ்வுகளின் தொடர்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: בָּקָר
  choice: மாடுகள்
  rationale: בָּקָר என்பது எருதுகளை மட்டும் அல்லாமல் மாட்டினத்தைத் தொகுப்பாகக் குறிக்கிறது; ‘மாடுகள்’ அதற்கான இயல்பான பொதுப்பெயர்.
- source_word: שְׁבַע מֵאוֹת
  choice: எழுநூறு
  rationale: எண்ணிக்கையின் நேரான தமிழ் வடிவம்.
- source_word: צֹאן
  choice: ஆடுகள்
  rationale: צֹאן என்பது செம்மறியாடுகள், வெள்ளாடுகள் ஆகிய சிறுகால்நடைகளைத் தொகுப்பாகக் குறிக்கக்கூடும். ‘ஆடுகள்’ வாசிக்க இயல்பான பொதுவடிவம்; அதன் விரிவான பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שִׁבְעַת אֲלָפִים
  choice: ஏழாயிரம்
  rationale: எண்ணிக்கையின் நேரான தமிழ் வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் உடன்படிக்கைக்குரிய தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் பெயர்சார் தன்மையைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் வேதாகம உரைக்கு ஏற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. எபிரெய வாக்கியத்தின் தகவல் வரிசை பெருமளவில் காக்கப்பட்டு, தமிழின் இயல்புக்காக எண்ணிக்கையும் விலங்குகளும் பலியிடுதல் வினைக்கு முன் ஒருங்கிணைக்கப்பட்டுள்ளன.
