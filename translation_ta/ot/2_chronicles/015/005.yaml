id: 2CH.15.5
reference: 2 Chronicles 15:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם אֵ֥ין שָׁל֖וֹם לַ/יּוֹצֵ֣א וְ/לַ/בָּ֑א כִּ֚י מְהוּמֹ֣ת רַבּ֔וֹת עַ֥ל כָּל יוֹשְׁבֵ֖י הָ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
translation:
  language: ta
  text: அந்தக் காலங்களில், வெளியே போகிறவனுக்கும் உள்ளே வருகிறவனுக்கும்[a] சமாதானம் இருக்கவில்லை; ஏனெனில், தேசங்களில் குடியிருந்த அனைவர்மீதும் பல பெருங்குழப்பங்கள்[b] ஏற்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வெளியே போகிறவனும் உள்ளே வருகிறவனும்’ என்பது அன்றாட நடமாட்டத்தை, குறிப்பாகப் பயணம் அல்லது பொது நடவடிக்கையை, குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: ‘பல பெருங்குழப்பங்கள்’ என்பதற்கு ‘பெரும் கலகங்கள்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் குழப்பம், கொந்தளிப்பு அல்லது பீதியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: அந்தக் காலங்களில்
  rationale: பன்மையிலுள்ள காலக் குறிப்பையும் சுட்டுப்பொருளையும் இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது; தொடக்க וּ தமிழில் தனியே மொழிபெயர்க்கப்படாவிட்டாலும் உரையின் தொடர்ச்சி காக்கப்படுகிறது.
- source_word: אֵין שָׁלוֹם
  choice: சமாதானம் இருக்கவில்லை
  rationale: שָׁלוֹם என்பதன் சமாதானம், பாதுகாப்பு, நல்வாழ்வு ஆகிய பரந்த பொருள்களில், இச்சூழலில் ‘சமாதானம்’ அடிப்படைச் சொல்லாக ஏற்றது; அடுத்த பகுதி நடைமுறைப் பாதுகாப்பின்மையை விளக்குகிறது.
- source_word: לַיּוֹצֵא וְלַבָּא
  choice: வெளியே போகிறவனுக்கும் உள்ளே வருகிறவனுக்கும்
  rationale: ஒருமை பொதுப்பொருளுடைய எபிரெயப் பெயரெச்ச வடிவத்தையும் இணைச் சொற்றொடரையும் தக்கவைக்கிறது. இது அன்றாடப் போக்குவரத்து மற்றும் பொது நடவடிக்கையைக் குறிக்கும் மரபுத்தொடர் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சமாதானமின்மைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்தும் இயல்பான காரண இணைப்புச்சொல்.
- source_word: מְהוּמֹת רַבּוֹת
  choice: பல பெருங்குழப்பங்கள்
  rationale: מְהוּמָה குறிக்கக்கூடிய கலகம், குழப்பம், பீதி ஆகிய பொருள் பரப்பை ‘பெருங்குழப்பங்கள்’ தக்கவைக்கிறது; רַבּוֹת என்பதன் பன்மை/மிகுதி ‘பல’ என வெளிப்படுகிறது.
- source_word: עַל כָּל יוֹשְׁבֵי הָאֲרָצוֹת
  choice: தேசங்களில் குடியிருந்த அனைவர்மீதும் ... ஏற்பட்டன
  rationale: הָאֲרָצוֹת என்ற பன்மையை ‘தேசங்கள்’ எனத் தக்கவைத்து, עַל என்பதன் அழுத்தம் அல்லது பாதிப்பு மக்கள்மீது வந்தது என்ற படிமத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
