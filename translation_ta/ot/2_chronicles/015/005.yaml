translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியக்கூடிய கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. எபிரெய ஒருமை பொதுப்பொருளும் ‘தேசங்கள்’ என்ற பன்மையும் பாதுகாக்கப்பட்டுள்ளன; மரபுத்தொடரும் சொல்லின் பொருள் பரப்பும் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளன.
