revisions:
- from: நீங்களோ வலிமையாயிருங்கள்; உங்கள் கைகள் தளர்ந்துபோக வேண்டாம்[a]. ஏனெனில், உங்கள் உழைப்புக்குப் பலன் உண்டு.
  to: நீங்களோ வலிமையாக இருங்கள்; உங்கள் கைகள் தளர்ந்து போக வேண்டாம்[a]. ஏனெனில், உங்கள் உழைப்புக்கு வெகுமதி உண்டு.
  rationale: The revision improves modern Tamil idiom and changes ‘பலன்’ to ‘வெகுமதி’ so that the translation retains the Hebrew’s explicit reward/recompense sense. The literal ‘hands’ idiom, its explanatory footnote, the plural exhortation, and the present existential wording (‘உண்டு’) are retained.
