review_pass:
  verdict: revise
  source_fidelity: The contrastive address, plural exhortation, prohibition concerning ‘hands,’ and causal statement of recompense are all represented. However, ‘பலன்’ can primarily mean an outcome or result in modern Tamil, whereas שָׂכָר specifically denotes reward/recompense (and can denote wages). ‘வெகுமதி’ retains the intended recompense sense more precisely.
  naturalness: ‘வலிமையாயிருங்கள்’ and the compounded forms ‘தளர்ந்துபோக/தொய்ந்துபோக’ are understandable but less natural in modern standard Tamil than ‘வலிமையாக இருங்கள்’ and spaced verbal compounds such as ‘தளர்ந்து போக.’
  terminology: Use ‘வெகுமதி’ for the recompense promised for the recipients’ work, without specifying a doctrine or timing of reward. ‘உழைப்பு’ adequately conveys פְעֻלָּה in this exhortational setting.
  issues:
  - severity: medium
    issue: ‘பலன்’ weakens the lexical force of שָׂכָר.
    rationale: In current Tamil, ‘பலன்’ commonly means result, benefit, or fruit of an action. The Hebrew promises a reward/recompense for work, so ‘வெகுமதி’ is more source-specific while not importing theological conclusions.
  - severity: low
    issue: A few expressions are stylistically less idiomatic than needed for modern standard Tamil.
    rationale: ‘வலிமையாக இருங்கள்’ and ‘தளர்ந்து போக’ are smoother contemporary forms and preserve the same imperative and idiom.
  revised_text: நீங்களோ வலிமையாக இருங்கள்; உங்கள் கைகள் தளர்ந்து போக வேண்டாம்[a]. ஏனெனில், உங்கள் உழைப்புக்கு வெகுமதி உண்டு.
  revised_footnotes:
  - marker: a
    text: அல்லது, “உங்கள் கைகள் சோர்ந்து போக வேண்டாம்.” எபிரெய மொழியின் இந்த மரபுத்தொடர் வலிமை, மனவுறுதி அல்லது துணிவை இழப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  revision_rationale: The revision improves modern Tamil idiom and changes ‘பலன்’ to ‘வெகுமதி’ so that the translation retains the Hebrew’s explicit reward/recompense sense. The literal ‘hands’ idiom, its explanatory footnote, the plural exhortation, and the present existential wording (‘உண்டு’) are retained.
