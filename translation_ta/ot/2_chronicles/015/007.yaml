id: 2CH.15.7
reference: 2 Chronicles 15:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אַתֶּ֣ם חִזְק֔וּ וְ/אַל יִרְפּ֖וּ יְדֵי/כֶ֑ם כִּ֛י יֵ֥שׁ שָׂכָ֖ר לִ/פְעֻלַּתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
translation:
  language: ta
  text: நீங்களோ வலிமையாக இருங்கள்; உங்கள் கைகள் தளர்ந்து போக வேண்டாம்[a]. ஏனெனில், உங்கள் உழைப்புக்கு வெகுமதி உண்டு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உங்கள் கைகள் சோர்ந்து போக வேண்டாம்.” எபிரெய மொழியின் இந்த மரபுத்தொடர் வலிமை, மனவுறுதி அல்லது துணிவை இழப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: நீங்களோ
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட சுட்டுப்பெயர் முந்தைய சூழலுடன் முரண்பாட்டையும் வலியுறுத்தலையும் காட்டுகிறது; ‘நீங்களோ’ என்பது இதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חִזְקוּ
  choice: வலிமையாயிருங்கள்
  rationale: பன்மை ஏவல் வடிவம் வலிமையுடனும் உறுதியுடனும் இருக்கும்படி அழைக்கிறது; நேரடியான பொருளைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: וְאַל יִרְפּוּ יְדֵיכֶם
  choice: உங்கள் கைகள் தளர்ந்துபோக வேண்டாம்
  rationale: ‘கைகள் தளர்தல்’ என்ற எபிரெய மரபுத்தொடர் வலிமை, மனவுறுதி அல்லது செயல்படும் துணிவு குறைவதைக் குறிக்கிறது. தமிழிலும் உருவகத்தைப் புரிந்துகொள்ள முடிவதால் அது தக்கவைக்கப்பட்டுள்ளது.
- source_word: כִּי יֵשׁ
  choice: ஏனெனில் ... உண்டு
  rationale: כִּי அறிவுரைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; יֵשׁ இருப்பைச் சுட்டுகிறது. எதிர்காலக் காலத்தை வெளிப்படையாகச் சேர்க்காமல் மூலத்தின் வடிவம் காக்கப்படுகிறது.
- source_word: שָׂכָר
  choice: பலன்
  rationale: இச்சொல் கூலி, கைம்மாறு அல்லது வெகுமதியைக் குறிக்கலாம். இச்சூழலில் ‘பலன்’ என்பது பொருளை தேவையின்றி பணக்கூலியாகக் குறுக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִפְעֻלַּתְכֶם
  choice: உங்கள் உழைப்புக்கு
  rationale: פְעֻלָּה வேலை, செயல் அல்லது உழைப்பைக் குறிக்கிறது. சீர்திருத்தப் பணியில் தொடரும்படி ஊக்குவிக்கும் சூழலில் ‘உழைப்பு’ செயலும் அதற்கான முயற்சியும் ஆகிய இரண்டையும் இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: கைம்மாறு பற்றிய மொழியின் இயல்பு
  choice: உங்கள் உழைப்புக்குப் பலன் உண்டு
  alternative: உங்கள் உழைப்புக்குப் பலன் கிடைக்கும்
  rationale: மூலவசனம் பலன் இருப்பதாகக் கூறுகிறதே தவிர அதன் காலத்தையோ வடிவத்தையோ விரிவாக வரையறுக்கவில்லை. ஆகவே மீட்பு, தகுதி அல்லது நீதிமானாக்கப்படுதல் பற்றிய பிற்காலக் கோட்பாடுகளைச் சேர்க்காமல் அதன் நேரடியான வாக்குறுதி பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் வேதாகம அறிவுரைக்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய உருவகமான ‘கைகள் தளர்தல்’ அடிக்குறிப்பு விளக்கத்துடன் தக்கவைக்கப்பட்டுள்ளது.
