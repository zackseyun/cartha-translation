base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
translation:
  language: ta
  text: இஸ்ரவேலின் கடவுளாகிய ஆண்டவரைத் தேடாத எவரும், சிறியவர் முதல் பெரியவர் வரை[a], ஆண் முதல் பெண் வரை, கொல்லப்பட வேண்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தாழ்ந்தவர் முதல் உயர்ந்தவர் வரை.’ இந்த எபிரெய மரபுத்தொடர் வயதை மட்டும் அல்லாமல் சமூகமெங்கும் அனைவரையும் உள்ளடக்குவதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: எவரும்
  rationale: כֹל אֲשֶׁר என்பது விரிவான தொடர்புத் தொடராக அனைவரையும் உள்ளடக்குகிறது; தமிழில் ‘எவரும்’ இயல்பாகவும் சுருக்கமாகவும் அந்தப் பொதுப்பரப்பைத் தருகிறது.
- source_word: לֹא יִדְרֹשׁ
  choice: தேடாத
  rationale: דרשׁ இங்கு கடவுளை நாடுதல், அவருடைய சித்தத்தை விசாரித்தல், அவரிடம் திரும்புதல் ஆகிய உடன்படிக்கைச் சார்ந்த பொருள் வளத்தை உடையது. ‘தேடாத’ என்பது நாள்பட்ட தமிழில் இயல்பாக இருந்து அந்தப் பொருளைத் திறந்தவாறே வைக்கிறது.
- source_word: לַיהוָה
  choice: ஆண்டவரை
  rationale: தெய்வீகப் பெயரான יהוה என்பதற்குத் தமிழ்ச் வேதாகம நடையில் பரவலாக அறியப்படும் மரியாதைமிக்க ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இஸ்ரவேலோடு அவருக்குள்ள குறிப்பிட்ட அடையாளத்தைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்க் கட்டமைப்பு.
- source_word: יוּמָת
  choice: கொல்லப்பட வேண்டும்
  rationale: 'מות வினையின் ஹொஃபால் வடிவம் காரணப்பாட்டு செயப்பாட்டைக் குறிக்கிறது: வெறுமனே ‘சாவார்’ என்பதல்ல, ‘கொல்லப்பட வேண்டும்’ என்பதே அதன் சட்டரீதியான வலிமையைத் துல்லியமாகக் காட்டுகிறது.'
- source_word: לְמִן קָטֹן וְעַד גָּדוֹל
  choice: சிறியவர் முதல் பெரியவர் வரை
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தை நெருக்கமாகப் பேணுகிறது; வயதை மட்டும் குறிக்காமல் நிலை, முக்கியத்துவம் போன்ற சமூக வேறுபாடுகளையும் உள்ளடக்க இடமளிக்கிறது.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: ஆண் முதல் பெண் வரை
  rationale: பாலின இணையைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவித்து, சமூகமெங்கும் பொருந்தும் முழுமையைக் காட்டுகிறது.
theological_decisions:
- issue: உடன்படிக்கை உறுதிமொழியில் கூறப்படும் கடுமையான மரணத் தண்டனையை மென்மைப்படுத்தாமல் மொழிபெயர்த்தல்
  choice: ‘கொல்லப்பட வேண்டும்’ என்று வெளிப்படையாகத் தக்கவைத்தல்
  alternative: ‘சாவார்’ என்று பொதுவாகக் கூறுதல் அல்லது சமூகத்திலிருந்து விலக்கப்படுவார் என்று விளக்குதல்
  rationale: எபிரெய வினை மரணத்தை மட்டும் அல்ல, கொல்லப்படுதலைத் தெளிவாகக் குறிக்கிறது. வரலாற்றுக் குறிப்பில் உள்ள தண்டனையின் கடுமையை மொழிபெயர்ப்பு குறைக்கவோ விரிவாக்கவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க வேதாகம நடையோடு வடிவமைக்கப்பட்டது. ‘தேடுதல்’ என்ற உடன்படிக்கைச் சொல்லின் பொருள் திட்டமிட்டு விரிவாக விளக்கப்படாமல் வைக்கப்பட்டுள்ளது. தண்டனையின் சட்ட வலிமையும் சமூகத்தின் முழுமையைக் காட்டும் இரு இணைத் தொடர்களும் பாதுகாக்கப்பட்டுள்ளன.
