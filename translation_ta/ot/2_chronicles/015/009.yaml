base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
translation:
  language: ta
  text: அவர் யூதா, பென்யமீன் மக்கள் அனைவரையும், அவர்களோடு குடியேறி வாழ்ந்த எப்பிராயீம், மனாசே, சிமியோன் பகுதிகளிலிருந்து வந்தவர்களையும் ஒன்றுகூட்டினார்; ஏனெனில், அவருடைய கடவுளாகிய யாவே அவருடன் இருப்பதைக் கண்டு, இஸ்ரயேலிலிருந்து பலர் அவருடைய பக்கம் வந்து சேர்ந்திருந்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவரிடம் வந்து சேர்ந்திருந்தார்கள்” என்றும் மொழிபெயர்க்கலாம்; சொல்லுக்குச் சொல், “அவர்மேல் விழுந்திருந்தார்கள்.” இந்த எபிரெய மரபுத்தொடர், மக்கள் தங்கள் சார்பை மாற்றி ஆசாவின் தரப்பில் சேர்ந்ததைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ஒன்றுகூட்டினார்
  rationale: קבץ என்பதன் மக்கள் ஓரிடத்தில் திரட்டப்படுதல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: כָּל יְהוּדָה וּבִנְיָמִן
  choice: யூதா, பென்யமீன் மக்கள் அனைவரையும்
  rationale: கோத்திரப் பெயர்கள் மக்களைக் குறிக்கும் ஆகுபெயர்கள்; தமிழில் பொருள் தெளிவாக இருக்க ‘மக்கள்’ வெளிப்படுத்தப்பட்டது.
- source_word: הַגָּרִים עִמָּהֶם
  choice: அவர்களுடன் குடியிருந்த ... மக்களையும்
  rationale: גרים என்பது அங்கு பிறக்காதவர்களாக அவர்களிடையே தங்கியிருந்தோரைக் குறிக்கிறது. இச்சூழலில் வடக்குக் கோத்திரங்களிலிருந்து யூதாவில் குடியேறியவர்களை ‘குடியிருந்த மக்கள்’ என்பது இயல்பாகக் காட்டுகிறது.
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן
  choice: எப்பிராயீம், மனாசே, சிமியோன் மக்களையும்
  rationale: מִן குறிக்கும் பிறப்பிடம் அல்லது வந்த இடம், தமிழில் அந்தக் கோத்திரப் பெயர்களுடன் இயல்பாகப் புரியுமாறு அமைக்கப்பட்டது.
- source_word: נָפְלוּ עָלָיו
  choice: அவருடைய பக்கம் சேர்ந்திருந்தார்கள்
  rationale: சொல்லுக்குச் சொல் ‘அவர்மேல் விழுந்தார்கள்’ எனினும், இங்கு ஒருவரிடம் விசுவாசத்தை மாற்றி அவரது தரப்பில் சேரும் எபிரெய மரபுத்தொடர். தமிழ் மொழிபெயர்ப்பு அதன் அரசியல்-சமூகப் பொருளைத் தெளிவாக்குகிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִיִּשְׂרָאֵל לָרֹב
  choice: இஸ்ரயேலிலிருந்து பலர்
  rationale: לָרֹב பெருமளவைக் குறிக்கிறது; இவ்வடிவம் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בִּרְאֹתָם
  choice: அவர்கள் கண்டபோது
  rationale: בְּ + infinitive construct நிகழ்ந்த காலச்சூழலைக் குறிக்கிறது; ‘கண்டபோது’ காரணத்தையும் சூழலையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்தாகிய இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பில் வழங்குகிறது.
- source_word: אֱלֹהָיו עִמּוֹ
  choice: அவருடைய கடவுளாகிய யாவே அவருடன் இருப்பதை
  rationale: இறை உடனிருப்பை நேரடியாகப் பேணுகிறது; ‘அவருக்கு ஆதரவாக’ போன்ற விளக்கத்தை உரைக்குள் சேர்க்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பேணுகிறது.
- issue: נָפְלוּ עָלָיו என்பதிலுள்ள விசுவாச மாற்றம்
  choice: அவருடைய பக்கம் சேர்ந்திருந்தார்கள்
  alternative: அவரிடம் வந்து சேர்ந்திருந்தார்கள்; சொல்லுக்குச் சொல் ‘அவர்மேல் விழுந்திருந்தார்கள்’
  rationale: இந்த மரபுத்தொடர் ஆசாவின் தரப்பை ஏற்றுக்கொண்டதைக் குறிக்கிறது. ‘பக்கம் சேர்ந்தார்கள்’ அந்தக் கருத்தைத் தெளிவாகத் தருகிறது; அதேவேளை ‘துரோகம் செய்தார்கள்’ என்று நோக்கத்தைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. கோத்திரப் பெயர்கள் மக்களைக் குறிக்கும் இடங்களில் ‘மக்கள்’ வெளிப்படுத்தப்பட்டுள்ளது. நீண்ட எபிரெய வாக்கியம் வாசிப்புத் தெளிவுக்காக இரண்டு தமிழ் வாக்கியங்களாக அமைக்கப்பட்டுள்ளது; காரணத் தொடர்பு காக்கப்பட்டுள்ளது.
