source:
  edition: WLC
  text: וַ/יִּשָּֽׁבְעוּ֙ לַ/יהוָ֔ה בְּ/ק֥וֹל גָּד֖וֹל וּ/בִ/תְרוּעָ֑ה וּ/בַ/חֲצֹצְר֖וֹת וּ/בְ/שׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/014.yaml
  text: And they swore to Yahweh with a loud voice[a], with shouting, and with trumpets and horns.
translation:
  language: ta
  text: அவர்கள் யாவேக்கு உரத்த குரலோடும் முழக்கத்தோடும் எக்காளங்களோடும் கொம்பு இசைக்கருவிகளோடும் உறுதிமொழி எடுத்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஷோஃபார்கள்’ அல்லது ‘கொம்பு இசைக்கருவிகள்’; இவை சற்றுமுன் குறிப்பிடப்பட்ட ‘எக்காளங்களிலிருந்து’ வேறுபட்டவை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  choice: உறுதிமொழி எடுத்தார்கள்
  rationale: நிபால் வடிவம் இங்கு சத்தியம் அல்லது உறுதிமொழி எடுத்தலைக் குறிக்கிறது. ‘உறுதிமொழி எடுத்தார்கள்’ என்பது அதன் முறையான, உடன்படிக்கை சார்ந்த தன்மையை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ முன்னொட்டு உறுதிமொழி யாருக்கு அளிக்கப்பட்டது என்பதைக் காட்டுகிறது; יהוה என்ற உடன்படிக்கைப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּקוֹל גָּדוֹל
  choice: உரத்த குரலோடும்
  rationale: இச்சொற்றொடர் பெரும் அல்லது உரத்த குரலைக் குறிக்கும் எபிரெய மொழிவழக்கு. தமிழில் இயல்பாகவும் செவிப்புலன் சார்ந்த வலியுறுத்தலைக் காக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבִתְרוּעָה
  choice: ஆரவாரத்தோடும்
  rationale: תְּרוּעָה என்பது கூட்டு முழக்கம், ஆரவாரம் அல்லது வெற்றி முழக்கத்தைக் குறிக்கலாம். இங்கு மகிழ்ச்சி அல்லது போர் என்ற பொருளைத் தேவையின்றி குறிப்பாக்காமல், கூட்டத்தின் உரத்த முழக்கத்தை ‘ஆரவாரம்’ வெளிப்படுத்துகிறது.
- source_word: וּבַחֲצֹצְרוֹת
  choice: எக்காளங்களோடும்
  rationale: חֲצֹצְרוֹת என்பது இஸ்ரவேலரின் வழிபாடு மற்றும் கூடுகைகளில் பயன்படுத்தப்பட்ட நேரான உலோக எக்காளங்களைக் குறிக்கிறது; ‘எக்காளங்கள்’ தமிழில் தெளிவான வழக்குச் சொல்.
- source_word: וּבְשׁוֹפָרוֹת
  choice: கொம்புகளோடும்
  rationale: שׁוֹפָרוֹת என்பது முன் குறிப்பிடப்பட்ட உலோக எக்காளங்களிலிருந்து வேறுபட்ட கொம்பு இசைக்கருவிகள். ‘கொம்புகள்’ அந்த வேறுபாட்டைப் பாதுகாக்கிறது; அவை அவசியம் செம்மறியாட்டுக் கொம்புகளே என்று மூலவசனம் இங்கு குறிப்பாக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்துகளைக் கொண்ட உடன்படிக்கைப் பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக ‘யாவே’ என ஒலிபெயர்ப்பது அந்தத் தனிப்பெயரைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய மூலத்தின் இணைத் தொடர் அமைப்பும் இரண்டு வகை இசைக்கருவிகளுக்கிடையிலான வேறுபாடும் காக்கப்பட்டுள்ளன.
