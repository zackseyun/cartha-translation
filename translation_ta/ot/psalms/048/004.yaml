  text: כִּֽי הִנֵּ֣ה הַ֭/מְּלָכִים נֽוֹעֲד֑וּ עָבְר֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/004.yaml
  text: For look, the kings assembled; they passed by together.
translation:
  language: ta
  text: ஏனெனில், இதோ, அரசர்கள் ஒன்றுகூடினார்கள்; அவர்கள் ஒன்றாகக் கடந்துசென்றார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணம் அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இயல்பாக வழங்குகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: காட்சியைக் கவனிக்க அழைக்கும் எபிரெயச் சுட்டுச்சொல்லின் உயிரோட்டத்தையும் கண்ணியமான தமிழ்நடையையும் காக்கிறது.
- source_word: הַמְּלָכִים
  choice: அரசர்கள்
  rationale: பன்மை பெயர்ச்சொல்லின் நேரடியான, இயல்பான நவீனத் தமிழ் இணை.
- source_word: נוֹעֲדוּ
  choice: ஒன்றுகூடினார்கள்
  rationale: யָעַד வேரின் நிஃபால் வடிவம் இங்கு கூடிவருதல் அல்லது சந்தித்தல் என்பதைக் குறிக்கிறது; நோக்கம் அல்லது உடன்பாட்டை உரையில் இல்லாமல் சேர்க்கவில்லை.
- source_word: עָבְרוּ יַחְדָּו
  choice: அவர்கள் ஒருமித்து முன்னேறிச் சென்றார்கள்
  rationale: עָבַר என்பதன் நகர்ந்து கடத்தல்/முன்னேறுதல் சார்ந்த இயக்கத்தையும் יַחְדָּו என்பதன் கூட்டுச் செயலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; எதை அல்லது எந்த இடத்தை ‘கடந்தார்கள்’ என்பது குறிப்பிடப்படாததால் செயப்படுபொருளைச் சேர்க்கவில்லை.
theological_decisions:
- issue: அரசர்களின் நோக்கமும் அவர்கள் சென்ற திசையும் உரையில் தெளிவாக இல்லை
  choice: நோக்கம், தாக்குதல், அல்லது குறிப்பிட்ட இலக்கைச் சேர்க்காமல் ‘ஒன்றுகூடினார்கள்; ... முன்னேறிச் சென்றார்கள்’ என்று வைத்தல்
  alternative: ‘போருக்காக ஒன்றுகூடி நகரைக் கடந்தார்கள்’ போன்ற விளக்கவுரை
  rationale: மூல எபிரெயம் கூடுகையையும் கூட்டாக நகர்வதையும் மட்டும் வெளிப்படையாகச் சொல்கிறது; சங்கீதத்தின் சூழல் பகைமையை உணர்த்தினாலும் இவ்வசனத்துக்குள் அதனை விரிவாகச் சேர்ப்பது genuine ambiguity-ஐ நீக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு தெளிவாகவும் சங்கீதத்திற்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘இதோ’ என்ற சொல்லால் மூலத்தின் திடீர் கவன ஈர்ப்பு பாதுகாக்கப்படுகிறது; இரு வினைகளின் தொடர்ச்சியும் செமிக்கோலன் மூலம் காட்டப்படுகிறது.
