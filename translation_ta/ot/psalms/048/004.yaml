  naturalness: The sentence is clear and appropriately dignified in modern standard Tamil. ‘ஒன்றாகக் கடந்துசென்றார்கள்’ is a natural, concise rendering of the final paired expression and avoids adding directionality.
  terminology: ‘அரசர்கள்,’ ‘ஒன்றுகூடினார்கள்,’ and ‘இதோ’ are suitable. No theological terminology or names are involved.
