  yaml_path: translation/ot/psalms/048/003.yaml
  text: God is known in her citadels as a stronghold[a][b].
translation:
  language: ta
  text: அவளுடைய கோட்டைகளில்[a] கடவுள் அரணாக[b] அறியப்படுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளுடைய அரண்மனைகளில்.’ எபிரெயச் சொல் மாட்சிமையான குடியிருப்புகளையோ அரணமைப்புள்ள கட்டடங்களையோ குறிக்கலாம்; இங்கு நகரத்தின் பாதுகாப்புச் சூழல் ‘கோட்டைகள்’ என்பதற்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘புகலிடமாக’ அல்லது ‘கோட்டையாக.’ எபிரெயச் சொல் பாதுகாப்பளிக்கும் உயர்ந்த, பத்திரமான இடத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சங்கீதச் சூழலில் பன்மை வடிவம் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் ஒருமைத் தெய்வப் பட்டமாகச் செயல்படுகிறது.
- source_word: בְּאַרְמְנוֹתֶיהָ
  choice: அவளுடைய அரண்மனைகளில்
  rationale: இந்த எபிரெயச் சொல் மாட்சிமையான மாளிகைகளையோ பாதுகாப்புள்ள கோட்டைக் கட்டடங்களையோ குறிக்கலாம். பெண்பால் ஒருமை பின்னொட்டு நகரமாகிய சீயோனைச் சுட்டுகிறது; இரு பொருள் வாய்ப்பையும் குறிப்பில் வைத்திருக்க இயல்பான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: נוֹדַע
  choice: அறியப்படுகிறார்
  rationale: ידע என்பதன் நிஃபால் வடிவம் இங்கு நிலை அல்லது செயப்பாட்டு உணர்வில் ‘அறியப்படுகிறார்’ எனப் பொருள்படுகிறது; ‘தம்மை வெளிப்படுத்தினார்’ என்ற தெளிவில்லாத தற்சுட்டு நுணுக்கம் சேர்க்கப்படவில்லை.
- source_word: לְמִשְׂגָּב
  choice: அரணாக
  rationale: מִשְׂגָּב என்பது உயர்ந்த, பாதுகாப்பான இடத்தையும் அதனால் புகலிடம் அல்லது கோட்டையையும் குறிக்கிறது. ‘அரணாக’ என்பது பாதுகாப்பு உருவகத்தையும் ‘அறியப்படுகிறார்’ என்பதுடன் இயல்பான இணைப்பையும் காக்கிறது.
theological_decisions:
- issue: ‘அவளுடைய அரண்மனைகள்’ என்பதிலுள்ள பெண்பால் பின்னொட்டின் குறிப்பு
  choice: சங்கீதத்தில் போற்றப்படும் சீயோன் நகரத்தைக் குறிக்கிறது.
  alternative: நாட்டையோ சமூகத்தையோ பொதுவாகக் குறிக்கலாம்.
  rationale: சங்கீதம் 48-இன் உடனடிச் சூழல் சீயோன் மலையையும் கடவுளின் நகரத்தையும் மையப்படுத்துவதால், நகரம் பெண்ணாக உருவகப்படுத்தப்பட்டிருப்பதே மிகப் பொருத்தமான வாசிப்பு.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைச் செறிவும் கண்ணியமும் காக்கப்பட்டுள்ளன. நகரத்தைக் குறிக்கும் பெண்பால் உருவகத்தை ‘அவளுடைய’ என வெளிப்படையாக வைத்துள்ளோம்; ‘அரண்’ பாதுகாப்பும் வலிமையும் கொண்ட சுருக்கமான சங்கீதச் சொல்லாட்சியாகப் பயன்படுத்தப்பட்டுள்ளது.
