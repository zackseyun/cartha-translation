source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר שָׁמַ֨עְנוּ כֵּ֤ן רָאִ֗ינוּ בְּ/עִיר יְהוָ֣ה צְ֭בָאוֹת בְּ/עִ֣יר אֱלֹהֵ֑י/נוּ אֱלֹ֘הִ֤ים יְכוֹנְנֶ֖/הָ עַד עוֹלָ֣ם סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: 'Just as we have heard[a], so we have seen in the city of Yahweh of hosts, in the city of our God: God will establish her forever. Selah'
translation:
  language: ta
  text: 'நாம் கேள்விப்பட்டதுபோலவே, படைகளின் யாவேவின் நகரத்தில், நம் கடவுளின் நகரத்தில், கண்டோம்: கடவுள் அவளை[a] என்றென்றும் நிலைநிறுத்துவார். சேலா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அதாவது, அந்நகரை. எபிரெயத்தில் ‘நகர்’ என்பது பெண்பால் பெயர்ச்சொல்; இங்கு நகரம் ஒரு பெண்ணைப் போலக் கவிதைநயத்துடன் ஆளுருவாக்கப்பட்டுள்ளது. ‘கடவுள் அதை என்றென்றும் நிலைநிறுத்துவார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: எபிரெயப் பெண்பால் பின்னொட்டு நகரத்தைக் குறிக்கிறது என்பதையும், தமிழில் பாலற்ற மாற்று மொழியாக்கம் சாத்தியம் என்பதையும் விளக்குகிறது.
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: கேள்விப்பட்டபடியே ... கண்டோம்
  rationale: ‘எப்படியோ... அப்படியே’ என்ற ஒப்பீட்டு இணைப்பை இயல்பான நவீன தமிழில் சுருக்கமாகவும் தெளிவாகவும் எடுத்துரைக்கிறது.
- source_word: שָׁמַעְנוּ / רָאִינוּ
  choice: நாம் கேள்விப்பட்டோம் / கண்டோம்
  rationale: இரண்டு முதலாம் நபர் பன்மை நிறைவுவினைகளின் இணைநிலையைப் பேணுகிறது; முன்பு அறிக்கையாகக் கேட்டதும் இப்போது அனுபவத்தில் கண்டதும் எதிரெதிராக நிறுத்தப்படுகின்றன.
- source_word: יְהוָה צְבָאוֹת
  choice: படைகளின் யாவே
  rationale: יְהוָה என்ற இறைப்பெயரை ‘யாவே’ என ஒலிபெயர்த்து, צְבָאוֹת என்பதன் இராணுவ/விண்ணுலகப் படைகள் சார்ந்த பரந்த பொருளை ‘படைகள்’ எனப் பேணுகிறது.
- source_word: בְּעִיר ... בְּעִיר
  choice: நகரத்தில் ... நகரத்தில்
  rationale: בְּ என்ற இடப்பொருளையும், எபிரெயக் கவிதையின் மறுபடியுரைத்தலையும் நேரடியாகப் பேணுகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதலாம் நபர் பன்மை உடைமை விகுதியை இயல்பான தமிழில் நேரடியாகத் தருகிறது.
- source_word: יְכוֹנְנֶהָ
  choice: அவளை நிலைநிறுத்துவார்
  rationale: כון வேரின் ‘உறுதியாக நிறுவுதல்/நிலைநிறுத்துதல்’ என்ற பொருளைத் தருகிறது; பெண்பால் ஒருமை பின்னொட்டை நகரின் கவிதைமிகு ஆளுருவாக்கமாக ‘அவளை’ எனப் பேணுகிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிரந்தரத்தைக் குறிக்கும் எபிரெயச் சொற்றொடருக்கு இயல்பான தமிழ் இணை.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான இசை அல்லது வழிபாட்டுப் பணி உறுதியற்றதால் விளக்கமாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயர் உள்ளது; அதைத் தலைப்பால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: יְכוֹנְנֶהָ என்பதிலுள்ள பெண்பால் பின்னொட்டின் குறிப்பு
  choice: நகரை ஆளுருவாக்கி ‘அவளை’ எனக் குறிப்பிடுதல்
  alternative: ‘அதை’ அல்லது ‘அந்நகரை’ என்று பாலற்ற முறையில் குறிப்பிடுதல்
  rationale: எபிரெயத்தில் ‘நகர்’ பெண்பால் பெயர்ச்சொல்; பின்னொட்டு அதையே சுட்டுகிறது. ‘அவளை’ என்பது கவிதை ஆளுருவாக்கத்தைத் தக்கவைக்கிறது, ஆனால் தமிழில் இதன் குறிப்பு தெளிவாக இருக்க அடிக்குறிப்பு தரப்படுகிறது.
- issue: יְכוֹנְנֶהָ வினையின் கால/நிலை
  choice: நிலைநிறுத்துவார்
  alternative: நிலைநிறுத்துகிறார்
  rationale: முடிவுறாத வினைவடிவம் எதிர்கால உறுதியை வெளிப்படுத்தக்கூடும்; சூழலில் நகருக்கான கடவுளின் தொடர்ந்த பாதுகாப்பைப் பற்றிய நம்பிக்கையுடன் எதிர்கால வடிவம் இயல்பாகப் பொருந்துகிறது.
translation_notes:
  register: நவீன, பொதுவாகப் புரியும், ஆனால் சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. நீண்ட இறைப்பெயர் தொடர்களை தெளிவுபடுத்த இடைக்கோடுகள் பயன்படுத்தப்பட்டுள்ளன; ‘சேலா’ விளக்கமின்றி ஒலிபெயர்க்கப்பட்டுள்ளது.
