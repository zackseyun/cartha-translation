id: PSA.48.10
reference: Psalms 48:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כְּ/שִׁמְ/ךָ֤ אֱלֹהִ֗ים כֵּ֣ן תְּ֭הִלָּתְ/ךָ עַל קַצְוֵי אֶ֑רֶץ צֶ֝֗דֶק מָלְאָ֥ה יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name[a], O God, so your praise reaches to the ends of the earth[b]; your right hand is full of righteousness.
translation:
  language: ta
  text: தேவனே, உமது பெயர் எப்படியோ, அப்படியே உமது புகழும் பூமியின் கடையெல்லைகள்வரை எட்டுகிறது[a]; உமது வலதுகை நீதியால் நிறைந்திருக்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது புகழ் பூமியின் கடையெல்லைகளின்மேல் உள்ளது.” எபிரெய முன்னிடைச்சொல் நேரடியாக “மேல்/மீது” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நியாயத்தால்.” எபிரெயச் சொல் நீதியையோ நியாயத்தையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשִׁמְךָ ... כֵּן
  choice: உமது பெயர் எப்படியோ, அப்படியே
  rationale: כ ... כֵּן என்ற ‘எப்படியோ ... அப்படியே’ ஒப்புமை அமைப்பையும் கவிதை இணைநிலையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: சூழலில் இது நேரடி விளிப்பு; தமிழ் விளிப்பு வேற்றுமை அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תְּהִלָּתְךָ
  choice: உமது புகழ்
  rationale: இச்சொல் நேரடியாகப் புகழைக் குறிக்கிறது; தேவனுக்குச் செலுத்தப்படும் துதியையும் அவரது புகழ்பெற்ற தன்மையையும் சூழலில் உள்ளடக்கக்கூடும்.
- source_word: עַל קַצְוֵי אֶרֶץ
  choice: பூமியின் கடையெல்லைகள்வரை எட்டுகிறது
  rationale: עַל என்பதன் அடிப்படைப் பொருள் ‘மேல்/மீது’ என்றாலும், இங்கு புகழின் உலகளாவிய பரப்பை இயல்பான தமிழில் தெரிவிக்க ‘வரை எட்டுகிறது’ என மொழிபெயர்க்கப்பட்டுள்ளது; அதிகச் சொற்படி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צֶדֶק
  choice: நீதி
  rationale: צֶדֶק என்பதில் ஒழுக்கநேர்மையும் நியாயத்தீர்ப்பும் சேர்ந்த பொருள் வெளி உள்ளது. ‘நீதி’ முதன்மைத் தமிழாக்கமாகத் தேர்ந்தெடுக்கப்பட்டு, ‘நியாயம்’ மாற்றாகக் குறிக்கப்படுகிறது.
- source_word: מָלְאָה יְמִינֶךָ
  choice: உமது வலதுகை நீதியால் நிறைந்திருக்கிறது
  rationale: வினையின் விளைவுநிலையையும் தேவனுடைய வல்லமை மற்றும் செயலைக் குறிக்கும் ‘வலதுகை’ உருவகத்தையும் காக்கிறது.
theological_decisions:
- issue: தேவனுடைய வலதுகையை விவரிக்கும் צֶדֶק என்பதன் பொருள்
  choice: நீதி
  alternative: நியாயம்
  rationale: எபிரெயச் சொல் ஒழுக்கநீதியையும் நீதித்தீர்ப்பையும் குறிக்கக்கூடும். ஒரு பொருளை மட்டும் கட்டாயப்படுத்தாமல், முதன்மை உரையில் ‘நீதி’ என்றும் அடிக்குறிப்பில் ‘நியாயம்’ என்றும் கொடுக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் கவிதைநயமும் காக்கப்பட்டுள்ளன. ‘எப்படியோ, அப்படியே’ என்பது எபிரெய ஒப்புமை அமைப்பைத் தெளிவாக வைத்திருக்கிறது; ‘கடையெல்லைகள்’ சங்கீதத்தின் உலகளாவிய காட்சியைத் தக்கவைக்கிறது.
