lexical_decisions:
- source_word: שִׁיר
  choice: பாடல்
  rationale: இது பாடலைக் குறிக்கும் பொதுவான எபிரெயச் சொல்; தலைப்பில் கூடுதல் விளக்கத்தைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையோடு தொடர்புடைய இந்தச் சொல் சங்கீதத் தலைப்புகளில் ஒரு தனித்த இலக்கிய-இசை வகையைக் குறிக்கிறது. שִׁיר என்பதுடன் ஒன்றாக்காமல் இரட்டை வகைப்பாட்டைப் பாதுகாக்கிறது.
- source_word: לִבְנֵי
  choice: மகன்களுக்குரிய
  rationale: லாமேத் முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, அர்ப்பணிப்பு அல்லது பாடி நிகழ்த்தும் சூழலைக் குறிக்கக்கூடும். ‘மகன்களுக்குரிய’ என்பது இவற்றில் ஒன்றை மட்டும் திட்டவட்டமாகத் தேர்ந்தெடுக்காமல் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: קֹרַח
  choice: கோராக்
  rationale: எபிரெயத் தனிப்பெயர் நவீனத் தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்கப்படுகிறது; வேற்றுமைத் தொடரில் ‘கோராகின்’ என வருகிறது.
theological_decisions:
- issue: לִבְנֵי קֹרַח என்ற தலைப்புத் தொடரின் செயல்பாடு
  choice: கோராகின் மகன்களுக்குரிய
  alternative: கோராகின் மகன்களுக்காக
  rationale: சங்கீதத் தலைப்புகளில் ל முன்னொட்டின் பொருள் பரந்தது. மொழிபெயர்ப்பு ஆசிரியத்துவமா, அர்ப்பணிப்பா, நிகழ்த்துவதற்கான குறிப்பா என்று தீர்மானிக்காமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான சங்கீதத் தலைப்பு. שִׁיר மற்றும் מִזְמוֹר ஆகிய இரு வகைப்பாடுகளும் முறையே ‘பாடல்’, ‘சங்கீதம்’ என்று தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
