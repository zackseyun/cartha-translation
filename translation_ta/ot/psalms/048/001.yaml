source:
  edition: WLC
  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד בְּ/עִ֥יר אֱ֝לֹהֵ֗י/נוּ הַר קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/001.yaml
  text: Great is Yahweh[a], and greatly to be praised, in the city of our God, his holy mountain.
translation:
  language: ta
  text: யாவே மகத்தானவர்; நம் கடவுளின் நகரமாகிய அவரது பரிசுத்த மலையில் அவர் மிகவும் போற்றப்படுபவர்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகவும் போற்றத்தக்கவர்.” எபிரெயச் செயப்பாட்டு வினையெச்சத்தை இன்னும் சொற்படியாக “போற்றப்படுபவர்” என்றும், அதன் கருத்தை இயல்பாக “போற்றத்தக்கவர்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: பெரியவர்
  rationale: வசனத்தின் தொடக்கத்தில் வரும் பயனிலைப் பெயரடை. வெறும் வல்லமையை மட்டும் குறுக்காமல், யாவேயின் மேன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וּמְהֻלָּל מְאֹד
  choice: அவர் மிகவும் போற்றத்தக்கவர்[a]
  rationale: הלל என்பதன் புஆல் செயல்பாட்டு எச்சம் பாராட்டப்படுகிறவர் அல்லது பாராட்டுக்குத் தகுதியானவர் என்ற இரு நெருங்கிய நுணுக்கங்களையும் தாங்கலாம். முதன்மை உரையில் இயல்பான ‘போற்றத்தக்கவர்’ பயன்படுத்தப்பட்டு, மாற்றுச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; מְאֹד என்பதற்கு ‘மிகவும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּעִיר אֱלֹהֵינוּ
  choice: நம் கடவுளின் நகரமாகிய
  rationale: בְּ என்பதன் இடப்பொருளையும் אֱלֹהֵינוּ என்பதன் உறவுசார் உடைமைப்பொருளையும் காக்கிறது. அடுத்து வரும் ‘அவரது பரிசுத்த மலை’ நகரத்தை விளக்கும் இணைநிலைத் தொடராக இருப்பதை ‘நகரமாகிய’ தெளிவாகவும் இயல்பாகவும் இணைக்கிறது.
- source_word: הַר קָדְשׁוֹ
  choice: அவரது பரிசுத்த மலையில்
  rationale: எபிரெயச் சொற்றொடரின் ‘அவருடைய பரிசுத்த மலை’ என்ற பொருளை நேரடியாகக் காக்கிறது; இடப்பொருள் முழு இணைநிலைத் தொடருக்கும் பொருந்துமாறு தமிழில் ‘மலையில்’ என அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே ஒரு பொதுப் பட்டத்தைப் பதிலிடாமல், அப்பெயரின் பரவலாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- issue: ‘மிகவும் போற்றப்பட்டவர்’ அல்லது ‘மிகவும் போற்றத்தக்கவர்’
  choice: மிகவும் போற்றத்தக்கவர்
  alternative: மிகவும் போற்றப்படுகிறவர்
  rationale: எபிரெயச் செயல்பாட்டு எச்சம் நிலைமையையும் தகுதியையும் உணர்த்தக்கூடும். சங்கீதப் புகழ்ச்சிச் சூழலில் ‘போற்றத்தக்கவர்’ இயல்பாக இருந்தாலும், உண்மையில் போற்றப்படுகிறார் என்ற வாசிப்பையும் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘நகரமாகிய அவரது பரிசுத்த மலை’ என்பது நகரமும் மலையும் இணைநிலையில் சீயோனைச் சுட்டுவதை வெளிப்படுத்துகிறது; மூலத்தின் பொருள் சார்ந்த தெளிவின்மை தேவையின்றி இறுக்கப்படவில்லை.
