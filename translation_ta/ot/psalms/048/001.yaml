  to: யாவே மகத்தானவர்; நம் கடவுளின் நகரமாகிய அவரது பரிசுத்த மலையில் அவர் மிகவும் போற்றப்படுபவர்[a].
  rationale: The revision preserves the Hebrew predicate sequence, the location in God’s city/his holy mountain, and the divine name. It uses a direct Tamil passive participial expression in the main text for מְהֻלָּל and corrects the footnote’s grammatical description. The alternative idiomatic sense, “worthy of praise,” remains available in the footnote.
