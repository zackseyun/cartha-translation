source:
  edition: WLC
  text: יִשְׂמַ֤ח הַר צִיּ֗וֹן תָּ֭גֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְ֝מַ֗עַן מִשְׁפָּטֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/011.yaml
  text: Let Mount Zion rejoice[a]; let the daughters of Judah be glad because of your judgments.
translation:
  language: ta
  text: 'சீயோன் மலை மகிழட்டும்;


    உமது தீர்ப்புகளால்


    யூதாவின் மகள்கள் களிகூரட்டும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யூதாவின் பட்டணங்கள்” அல்லது “யூதாவின் குடியிருப்புகள்” என்றும் பொருள் கொள்ளலாம்; “மகள்கள்” என்பது கவிதை வழக்கில் சார்ந்துள்ள நகரங்களையோ குடியிருப்புகளையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: மகிழட்டும்
  rationale: שׂמח என்பதன் Qal imperfect வடிவம் இக்கவிதைச் சூழலில் விருப்பம் அல்லது கொண்டாட்ட அழைப்பை வெளிப்படுத்துகிறது; தமிழ் வியங்கோள் வடிவமான ‘மகிழட்டும்’ அதை இயல்பாகத் தருகிறது.
- source_word: הַר צִיּוֹן
  choice: சீயோன் மலை
  rationale: நிலவியல் உருவகத்தையும் சீயோன் என்ற இயற்பெயரையும் தெளிவாகப் பாதுகாக்கும் இயல்பான தமிழ் அமைப்பு.
- source_word: תָּגֵלְנָה
  choice: களிகூரட்டும்
  rationale: גיל என்பது மிகுந்த மகிழ்ச்சி அல்லது களிப்பைக் குறிக்கிறது. முந்தைய வினையிலிருந்து சொல்வேறுபாட்டைப் பேணியபடி இணையான கொண்டாட்ட உணர்வைத் தருகிறது.
- source_word: בְּנוֹת יְהוּדָה
  choice: யூதாவின் மகள்கள்
  rationale: எபிரெய மூலத்தின் ‘யூதாவின் மகள்கள்’ என்ற கவித்துவச் சொல்லாட்சியை முதன்மை உரையில் வெளிப்படையாகப் பேணுகிறது; இது யூதாவைச் சார்ந்த பட்டணங்கள் அல்லது குடியிருப்புகளையும் குறிக்கலாம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
- source_word: לְמַעַן
  choice: நிமித்தம்
  rationale: இங்கு மகிழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்துகிறது; ‘நிமித்தம்’ என்பது உயர்வானதாயினும் பொதுவாகப் புரியக்கூடிய காரணப் பொருளைத் தருகிறது.
- source_word: מִשְׁפָּטֶיךָ
  choice: உமது நீதித் தீர்ப்புகள்
  rationale: מִשְׁפָּט என்பதில் தீர்ப்பு மற்றும் நீதி ஆகிய இரு நுணுக்கங்களும் உள்ளன. சங்கீதத்தின் சூழலில் தேவனுடைய நீதியான நியாயத்தீர்ப்புச் செயல்களைக் குறிக்கும் வகையில் ‘நீதித் தீர்ப்புகள்’ பொருத்தமாக உள்ளது.
theological_decisions:
- issue: מִשְׁפָּטֶיךָ என்பதன் சூழல்சார் பொருள்
  choice: உமது நீதித் தீர்ப்புகள்
  alternative: உமது நீதி; உமது நியமங்கள்
  rationale: சுற்றியுள்ள பாடல், வெளிப்படுத்தப்பட்ட சட்டங்களைவிட அரசரும் நீதிபதியுமான தேவனுடைய தீர்ப்புச் செயல்களைக் கொண்டாடுகிறது. ‘நீதித் தீர்ப்புகள்’ என்பது தீர்ப்பையும் அதன் நீதியான தன்மையையும் வைத்திருக்கிறது; ‘நியமங்கள்’ எனக் குறுக்கிவிடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இணையான இரு வியங்கோள் வினைகள் எபிரெய வசனத்தின் கொண்டாட்ட அமைப்பைப் பேணுகின்றன. ‘உமது’ என்பது சங்கீதப் பேச்சின் உயர்வான நேரடி அழைப்புக்கு ஏற்றதாக உள்ளது; அடிக்குறிப்பு குறியீடு தொடர்புடைய ‘யூதாவின் மகள்கள்’ தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
