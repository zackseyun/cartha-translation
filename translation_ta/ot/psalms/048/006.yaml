lexical_decisions:
- source_word: רְעָדָה
  choice: நடுக்கம்
  rationale: உடல் நடுங்குவதையும் அச்சத்தால் ஏற்படும் அதிர்வையும் இயல்பாக வெளிப்படுத்தும் நேரடியான பெயர்ச்சொல்.
- source_word: אֲחָזָתַם
  choice: அவர்களைப் பற்றிக்கொண்டது
  rationale: אחז என்பதன் ‘பற்றிக்கொள், பிடி’ என்ற வலிமையான பொருளைத் தமிழில் இயல்பாகத் தருகிறது; பெண்பால் ஒருமை வினை எபிரெயப் பெயர்ச்சொல்லுடன் இயைகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய, நேரடியான மொழிபெயர்ப்பு.
- source_word: חִיל
  choice: துயரம்
  rationale: இந்தச் சொல் வேதனை, பேறுகால வலி, உடல் நெளிதல் ஆகிய தொடர்புடைய பொருட்களைக் கொண்டது. உவமை உடல் வலியின் தன்மையைத் தெளிவாக்குவதால் ‘துயரம்’ உணர்ச்சி மற்றும் உடல் வேதனையை உள்ளடக்கும் இயல்பான தேர்வு.
- source_word: כַּיּוֹלֵדָה
  choice: பேறுகாலப் பெண்ணுக்கு உண்டாகும் வேதனைபோன்ற
  rationale: குழந்தை பெற்றெடுக்கும் பெண்ணின் நிலையைத் தெளிவாகவும் மரியாதையான நவீன தமிழிலும் வெளிப்படுத்துகிறது.
