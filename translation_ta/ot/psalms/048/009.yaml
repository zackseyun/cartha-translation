source:
  edition: WLC
  text: דִּמִּ֣ינוּ אֱלֹהִ֣ים חַסְדֶּ֑/ךָ בְּ֝/קֶ֗רֶב הֵיכָלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/009.yaml
  text: We have reflected on your steadfast love[a], O God, in the midst of your temple.
translation:
  language: ta
  text: கடவுளே, உமது ஆலயத்தின் நடுவில் உமது மாறாத அன்பைச் சிந்தித்திருக்கிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நினைத்துப் பார்த்திருக்கிறோம்’ அல்லது ‘ஆழ்ந்து எண்ணியிருக்கிறோம்.’ எபிரெய வினைச்சொல் கவனமாக எண்ணுதல் அல்லது தியானித்தல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמִּינוּ
  choice: சிந்தித்திருக்கிறோம்
  rationale: பீயேல் நிறைவுவினையான இச்சொல், இச்சூழலில் ஒன்றைக் கவனமாக எண்ணிப் பார்ப்பதையோ ஆழ்ந்து சிந்திப்பதையோ குறிக்கிறது. தமிழ் நிறைவுநிலை வடிவம், ஆலய வழிபாட்டில் கூடியவர்கள் செய்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இங்கு இச்சொல் நேரடி அழைப்பாக இருப்பதால், தமிழ் விளிவேற்றுமை வடிவமான ‘கடவுளே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: חַסְדֶּךָ
  choice: உமது மாறாத அன்பை
  rationale: חֶסֶד என்பது அன்பு, பற்றுறுதி, நிலைத்த நம்பகத்தன்மை ஆகியவற்றை உள்ளடக்குகிறது. ‘மாறாத அன்பு’ இதன் உறவுசார் மற்றும் நிலையான தன்மையை இயல்பான நவீன தமிழில் தருகிறது; ‘இரக்கம்’ என்று மட்டும் மொழிபெயர்ப்பது பொருளைக் குறுக்கிவிடும்.
- source_word: בְּקֶרֶב
  choice: நடுவில்
  rationale: ஓர் இடத்தின் உள்ளே அல்லது மத்தியில் இருப்பதைச் சுட்டும் எபிரெயச் சொற்றொடரின் இடப்பொருளைத் தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: הֵיכָלֶךָ
  choice: உமது ஆலயம்
  rationale: הֵיכָל என்பதற்கு ‘அரண்மனை’ என்றும் பொருள் வரலாம்; ஆனால் சங்கீதத்தின் வழிபாட்டுச் சூழலும் கடவுளை நோக்கிய நேரடி உரையும் இங்கு ‘ஆலயம்’ என்பதையே ஆதரிக்கின்றன.
theological_decisions:
- issue: חֶסֶד என்பதன் பொருள்
  choice: மாறாத அன்பு
  alternative: இரக்கம்; பேரன்பு; உடன்படிக்கை அன்பு
  rationale: கடவுளுடைய அன்பின் நிலைத்தன்மையையும் உறவுசார் பற்றுறுதியையும் இம்மொழிபெயர்ப்பு காக்கிறது. அதேவேளை, ‘உடன்படிக்கை அன்பு’ என்ற விளக்கநிறைந்த இறையியல் சொற்றொடரை மூலவசனத்தில் வெளிப்படையாக இல்லாத அளவுக்கு முன்னிறுத்துவதில்லை.
- issue: אֱלֹהִים என்பது நேரடி அழைப்பா அல்லது குறிப்பா
  choice: ‘கடவுளே’ என்ற நேரடி அழைப்பு
  alternative: ‘கடவுள்’ என்ற குறிப்பு
  rationale: சொற்றொடர் ஜெபம் அல்லது பாடலில் கடவுளை நேரடியாக நோக்கிப் பேசுவதாக இயல்பாக வாசிக்கப்படுகிறது; தமிழ் விளிவேற்றுமை இதைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைமிக்க ஒருமை உரைக்காக ‘உமது’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
