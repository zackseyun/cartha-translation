source:
  edition: WLC
  text: יְפֵ֥ה נוֹף֮ מְשׂ֪וֹשׂ כָּל הָ֫/אָ֥רֶץ הַר צִ֭יּוֹן יַרְכְּתֵ֣י צָפ֑וֹן קִ֝רְיַ֗ת מֶ֣לֶךְ רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/002.yaml
  text: Beautiful in elevation[a], the joy of all the earth, is Mount Zion, in the far north, the city of the great King.
translation:
  language: ta
  text: 'உயர்ந்த நிலையில் அழகாய் விளங்குவதும்,

    பூமியனைத்திற்கும் மகிழ்ச்சியாய் இருப்பதும்,

    சீயோன் மலை;

    வடதிசையின் தொலைவான பகுதிகளில்[a] உள்ள

    மாபெரும் அரசரின் நகரம் அது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வடக்குப் பக்கங்களில்” அல்லது “வடக்குச் சரிவுகளில்.” எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் “வடக்கின் தொலைவான பகுதிகள்/பக்கங்கள்”; இது சாபோனுடன் தொடர்புடைய தெய்வீக மலைப் படிமத்தையும் எதிரொலிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְפֵה נוֹף
  choice: உயர்ந்த அமைப்பில் அழகானதும்
  rationale: יְפֵה என்பது ‘அழகான’ என்பதைக் குறிக்கிறது; அரிதான נוֹף இங்கு உயரம், உயர்ந்த தோற்றம் அல்லது நில அமைப்பைக் குறிக்கலாம். ‘உயர்ந்த அமைப்பில்’ என்பது அந்த இடவியல் உணர்வை இயல்பான தமிழில் தருகிறது; பொருளைத் தேவையின்றி மிகத் துல்லியமாக்கவில்லை.
- source_word: מְשׂוֹשׂ כָּל־הָאָרֶץ
  choice: பூமியனைத்திற்கும் மகிழ்ச்சியானதும்
  rationale: מְשׂוֹשׂ என்பது மகிழ்ச்சி அல்லது களிப்புக்குரிய ஒன்றைக் குறிக்கிறது. כָּל־הָאָרֶץ என்பதன் பரந்த, உலகளாவிய வீச்சை ‘பூமியனைத்திற்கும்’ காக்கிறது.
- source_word: הַר צִיּוֹן
  choice: சீயோன் மலை
  rationale: இடப்பெயரையும் பொதுப்பெயரையும் நவீனத் தமிழில் வழக்கமான, தெளிவான முறையில் வழங்குகிறது.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: வடதிசையின் தொலைவான பகுதிகளில்
  rationale: יַרְכְּתֵי என்பது கடைப்புறங்கள், தொலைவான பகுதிகள் அல்லது பக்கங்கள் எனப் பொருள்படலாம்; צָפוֹן என்பது வடதிசையையோ சாபோன் என்ற குறிப்பையோ உணர்த்தக்கூடும். முதன்மை உரை எபிரெயச் சொற்றொடரின் இடவியல் வடிவத்தையும் தெளிவின்மையையும் காக்கிறது.
- source_word: קִרְיַת מֶלֶךְ רָב
  choice: மகா அரசரின் நகரம்
  rationale: இது எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் தருகிறது. ‘மகா அரசர்’ என்பது சூழலில் உன்னத அரசரைச் சுட்டுகிறது; பெயரை வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: יַרְכְּתֵי צָפוֹן என்பதற்கும் சீயோன் மலைக்கும் உள்ள தொடர்பு
  choice: ‘வடதிசையின் தொலைவான பகுதிகளில்’ என்று இடவியல் மொழியை முதன்மை உரையில் காத்தல்
  alternative: ‘வடக்குச் சரிவுகளில்’ என்ற நில அமைப்புக் குறிப்பு அல்லது ‘சாபோனின் தொலைவான பகுதிகளில்’ என்ற தெய்வீக-மலைப் படிமக் குறிப்பு
  rationale: எபிரெயச் சொற்றொடர் சாதாரண நிலவியல் விளக்கமாகவும், வடக்கு/சாபோனுடன் தொடர்புடைய தெய்வீக மலையை எதிரொலிக்கும் கவித்துவ மொழியாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை எந்த ஓர் விளக்கத்தையும் கட்டாயப்படுத்தாமல், மாற்று வாய்ப்புகளை அடிக்குறிப்பில் வெளிப்படையாக வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான கவித்துவ நடையுடன் வடிவமைக்கப்பட்டது. எபிரெய வசனத்தின் பெயரெச்சத் தொடர்களையும் இறுதி இணைப்பையும் தெளிவாக்க ‘அது’ சேர்க்கப்பட்டுள்ளது; புதிய கருத்து சேர்க்கப்படவில்லை.
