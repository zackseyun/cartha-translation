lexical_decisions:
- source_word: בְּ/רוּחַ קָדִים
  choice: கிழக்குக் காற்றினால்
  rationale: רוּחַ மற்றும் קָדִים இணைந்து அழிவை ஏற்படுத்தும் கிழக்குக் காற்றைக் குறிக்கின்றன; ב கருவிப் பொருளில் செயல் நிகழும் வழிமுறையைச் சுட்டுவதால் ‘-னால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: תְּשַׁבֵּר
  choice: நீர் நொறுக்குகிறீர்
  rationale: שבר என்பதன் பியேல் வடிவம் வலிமையாக உடைத்துச் சிதைப்பதைக் குறிக்கிறது. இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் கடவுளை நேரடியாக விளிக்கும் மரியாதைத் தமிழ் நடையில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֳנִיּוֹת
  choice: கப்பல்களை
  rationale: இச்சொல் பன்மையில் ‘கப்பல்கள்’ என்று பொருள்படும்; தமிழில் செயப்படுபொருள் வேற்றுமை உருபுடன் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: תַּרְשִׁישׁ
  choice: தர்ஷீசின்
  rationale: இடப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் தொடர்பைத் தமிழில் ஆறாம் வேற்றுமை மூலம் காட்டுகிறது; அதன் துல்லியமான தொடர்பு பலவாறு புரிந்துகொள்ளப்படலாம் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இரண்டாம் நபர் வினையின் விளிப்புக்குரியவர்
  choice: கடவுளை நேரடியாக விளித்தல் (‘நீர் நொறுக்குகிறீர்’)
  alternative: ஆளில்லா அல்லது பொதுவான கூற்றாக மொழிபெயர்த்தல்
  rationale: תְּשַׁבֵּר என்பது இரண்டாம் நபர் ஆண்பால் ஒருமை வினை; சங்கீதச் சூழலில் கடவுளை நோக்கிய நேரடி விளிப்பாக இயல்பாகத் தொடர்கிறது. தமிழ் மரியாதை ஒருமை இதைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நொறுக்குகிறீர்’ என்பது மூலத்தின் வலிமையான உடைத்தல் உணர்வையும் கடவுளுக்கான நேரடி மரியாதை விளிப்பையும் காக்கிறது.
