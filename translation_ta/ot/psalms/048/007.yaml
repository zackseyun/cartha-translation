  yaml_path: translation/ot/psalms/048/007.yaml
  text: With an east wind you shatter the ships of Tarshish[a].
translation:
  language: ta
  text: கிழக்குக் காற்றினால் தர்ஷீசின் கப்பல்களை நீர் நொறுக்குகிறீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தர்ஷீசுக்குச் செல்லும் கப்பல்கள்” அல்லது “தர்ஷீசுக் கப்பல்கள்.” இச்சொற்றொடர் தர்ஷீசுடன் தொடர்புடைய கடற்பயண வணிகக் கப்பல்களைக் குறிக்கலாம்.
