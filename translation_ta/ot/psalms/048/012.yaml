  yaml_path: translation/ot/psalms/048/012.yaml
  text: Walk around Zion and go around her[a]; count her towers.
translation:
  language: ta
  text: சீயோனைச் சுற்றி நடவுங்கள்; அதை வலம்வாருங்கள்[a]; அதன் கோபுரங்களை எண்ணுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீயோனைச் சுற்றிச் செல்லுங்கள்; அதைச் சுற்றி வாருங்கள்.”
    reason: முதல் ஏவலுக்கு ‘சுற்றிச் செல்லுங்கள்’ என்பதையும், இரண்டாவது ஏவலுக்கு ‘சுற்றி வாருங்கள்’ என்பதையும் மாற்று இயல்பான மொழிபெயர்ப்புகளாகக் கொள்ளலாம்; இரு தொடர்ச்சியான சுற்றிவரும் ஏவல்களின் மறுமொழிச் சாயல் காக்கப்படுகிறது.
lexical_decisions:
- source_word: סֹבּוּ
  choice: சுற்றி நடந்து
  rationale: סבב என்பதன் பன்மை ஏவல் வடிவம் சீயோனைச் சுற்றி நகரும் நேரடியான செயலுக்கு அழைக்கிறது. ‘சுற்றி நடந்து’ என்பது அந்த இடஞ்சார்ந்த இயக்கத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִיּוֹן
  choice: சீயோன்
  rationale: இது இடப்பெயர்; எபிரெய மூலத்தில் ‘மலை’ என்ற சொல் இல்லாததால் அதைச் சேர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְהַקִּיפוּהָ
  choice: அதை வலம் வாருங்கள்
  rationale: நகரைக் சுற்றிச் செல்லுமாறு கூறும் பன்மை ஏவலையும் சீயோனைக் குறிக்கும் ஒருமை பின்னொட்டையும் வெளிப்படுத்துகிறது. ‘வலம் வாருங்கள்’ சுற்றிச் செல்லும் பொருளை இயல்பாகத் தருகிறது; பகைமையான முற்றுகை என்ற தேவையற்ற சாயலைத் தவிர்க்கிறது.
- source_word: סִפְרוּ
  choice: எண்ணுங்கள்
  rationale: கோபுரங்களின் எண்ணிக்கையைக் கணக்கிடும் செயலை இச்சூழலில் நேரடியாகக் குறிக்கிறது.
- source_word: מִגְדָּלֶיהָ
  choice: அதன் கோபுரங்களை
  rationale: பன்மையான ‘கோபுரங்கள்’ என்பதையும் சீயோன் நகரைக் குறிக்கும் மூன்றாம் நபர் ஒருமைப் பின்னொட்டையும் பாதுகாக்கிறது. தமிழில் நகரைக் குறிக்க ‘அதன்’ என்பது இயல்பானது; எபிரெய இலக்கணப் பாலினத்தைச் செயற்கையாகப் பெண்பாலாக்கவில்லை.
