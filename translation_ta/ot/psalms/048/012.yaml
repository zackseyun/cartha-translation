translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியாக வரும் இரண்டு சுற்றிச் செல்லும் ஏவல்களின் எபிரெயக் கவிதைத் தீவிரம் காக்கப்பட்டுள்ளது; தமிழில் இயல்பில்லாத இலக்கணப் பெண்பால் குறிப்பு திணிக்கப்படவில்லை.
