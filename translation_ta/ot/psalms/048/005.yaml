  text: They saw[a], and so they were astonished; they were terrified; they fled in haste.
translation:
  language: ta
  text: அவர்கள் அதைக் கண்டார்கள்; அதனால் திகைத்தார்கள்; கலங்கினார்கள்; அவசரமாக அகன்றுபோனார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பதற்றத்துடன் அவசரமாக அகன்றுபோனார்கள்.’ எபிரெய வினைச்சொல் அச்சத்தால் உந்தப்பட்ட அவசரமான நகர்வைக் குறிக்கிறது; அது தானாகவே ‘ஓடுதல்’ என்று குறிப்பிடுவதில்லை.
