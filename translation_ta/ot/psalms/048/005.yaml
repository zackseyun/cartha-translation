lexical_decisions:
- source_word: הֵמָּה
  choice: அவர்கள்
  rationale: வலியுறுத்தும் மூன்றாம் நபர் ஆண்பால் பன்மைப் பெயர்ப்பதிலி. தமிழில் இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் ‘அவர்கள்’ என்று வழங்கப்பட்டுள்ளது.
- source_word: רָאוּ
  choice: அதைக் கண்டார்கள்
  rationale: ראה என்பதன் எளிய பொருள் ‘காணுதல்.’ எதைக் கண்டார்கள் என்பது முந்தைய வசனச் சூழலால் தெளிவாவதால், இயல்பான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: כֵּן
  choice: கண்டதும்
  rationale: அவர்கள் கண்டதற்கும் அதைத் தொடர்ந்து ஏற்பட்ட எதிர்வினைக்கும் உள்ள உடனடி விளைவு உறவை இயல்பான தமிழில் காட்டுகிறது.
- source_word: תָּמָהוּ
  choice: திகைத்தார்கள்
  rationale: வியப்பு அல்லது அதிர்ச்சியால் திகைத்த நிலையைச் சுட்டுகிறது; நேர்மறையான வியப்பாகவோ மிகையான திகிலாகவோ பொருளைச் சுருக்கவில்லை.
- source_word: נִבְהֲלוּ
  choice: திகிலடைந்து
  rationale: בהל என்பதன் நிஃபால் வடிவம் கலக்கம், பீதி அல்லது திகிலை வெளிப்படுத்துகிறது. இங்கு அச்சம் தீவிரமடையும் தொடருக்கு ‘திகிலடைந்து’ பொருந்துகிறது.
- source_word: נֶחְפָּזוּ
  choice: பதற்றத்துடன் விரைந்தோடினார்கள்
  rationale: חפז என்பதன் நிஃபால் வடிவம் அழுத்தம் அல்லது பீதியால் ஏற்படும் அவசரமான நகர்வைக் குறிக்கிறது. சூழலில் அங்கிருந்து ஓடிச் செல்வதைக் காட்டும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது; அடிப்படைச் சொல்லின் பரந்த வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
