  rationale: மசோரா உரையின் இரண்டு சொற்களாக அமைந்த வாசிப்பை மதித்து, தேவனுடைய வழிநடத்துதல் மரணத்தையும் கடந்து தொடரும் என்ற சாத்தியமான பொருளை வெளிப்படுத்துகிறது; உரைநிலைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: עַל־מוּת என்பதன் பொருள் மற்றும் தேவனுடைய வழிநடத்துதலின் கால எல்லை
  choice: மரணத்திற்கும் அப்பால்
  alternative: மரணம் வரைக்கும்; அல்லது என்றென்றும்
  rationale: மசோரா உரையின் மெய்யெழுத்து வடிவம் ‘மரணத்தின் மேல்/அப்பால்’ என்ற புரிதலை அனுமதிக்கிறது; ஆயினும் சொற்றொடர் அரிதானதால் வேறு பிரிப்புகளும் பழைய மொழிபெயர்ப்பு மரபுகளும் வேறு பொருள்களை முன்வைக்கின்றன. முதன்மை உரை ஒரு நியாயமான வாசிப்பைத் தேர்ந்தெடுக்கிறது; மாற்று வாய்ப்புகள் மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான இறைமொழி நடை. தேவனைச் சுட்ட ‘அவர்’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; அரிதான எபிரெய இறுதிச் சொற்றொடரின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
