  text: For this God is our God forever and ever; he will guide us beyond death.
translation:
  language: ta
  text: ஏனெனில், இந்த இறைவனே என்றென்றைக்கும் நம் இறைவன்; அவர் மரணத்திற்கும் அப்பால் நம்மை வழிநடத்துவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மரணத்திற்கும் அப்பால்” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொற்றொடர் அரிதானதும் பொருள் தெளிவில்லாததும் ஆகும். இதை “மரணம் வரைக்கும்” என்றும் வாசிக்கலாம்; வேறு ஒரு பழமையான வாசிப்பு மரபு “என்றென்றும்” என்ற பொருளைக் காட்டுகிறது.
    reason: עַל־מוּת என்ற மசோரா வாசிப்பின் உண்மையான சொற்பொருள் மற்றும் உரைமரபு சார்ந்த தெளிவின்மையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: כִּי זֶה אֱלֹהִים
  choice: இந்த இறைவனே
