source:
  edition: WLC
  text: שִׁ֤יתוּ לִבְּ/כֶ֨ם לְֽ/חֵילָ֗/ה פַּסְּג֥וּ אַרְמְנוֹתֶ֑י/הָ לְמַ֥עַן תְּ֝סַפְּר֗וּ לְ/ד֣וֹר אַחֲרֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/013.yaml
  text: Set your heart on her rampart[a]; pass through her citadels[b], so that you may tell the next generation.
translation:
  language: ta
  text: அவளுடைய அரண்மதிலின்மேல்[a] உங்கள் மனத்தைச் செலுத்துங்கள்; அவளுடைய கோட்டைகளினூடே செல்லுங்கள்[b]; வருங்காலத் தலைமுறைக்கு நீங்கள் எடுத்துச் சொல்லும்படியாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவளுடைய வெளிப்புற மதிலின்மேல்.’ எபிரெயச் சொல் நகரத்தின் மதில் அல்லது தற்காப்பு அரண் அமைப்பைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கோட்டைகள்’ என்பதற்குப் பதிலாக, ‘அரண்மனைகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அரண்மனைகளையோ அரண் கொண்ட வலுவான கட்டிடங்களையோ குறிக்கக்கூடும்; நகரப் பாதுகாப்பு அமைப்புகளை ஆய்வுசெய்யும் இச்சூழல் ‘கோட்டைகள்’ என்பதற்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  choice: உங்கள் மனத்தைச் செலுத்துங்கள்
  rationale: எபிரெய மொழியில் சொற்சொல்லாக ‘உங்கள் இருதயத்தை வையுங்கள்’ என்றாலும், இங்கு கவனத்தை ஒருமுகப்படுத்துதல் என்பதே பொருள். நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் அமைய ‘மனத்தைச் செலுத்துங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לְחֵילָה
  choice: அவளுடைய அரண்மதிலின்மேல்
  rationale: חֵיל என்பது நகரத்தின் மதில், வெளிப்புறத் தற்காப்புச் சுவர் அல்லது விரிவான அரண் அமைப்பைக் குறிக்கலாம். நகரப் பாதுகாப்பு அமைப்பு என்ற பொருளைச் சுருக்கமாகக் காட்ட ‘அரண்மதில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פַּסְּגוּ
  choice: செல்லுங்கள்
  rationale: அரிதாக வரும் இந்த வினை, இச்சூழலில் நகரத்தின் கட்டிடங்களினூடே சென்று அவற்றைக் கவனித்துப் பார்ப்பதைக் குறிக்கிறது. உடல்சார்ந்த நகர்வைத் தக்கவைக்க ‘செல்லுங்கள்’ பயன்படுத்தப்பட்டது.
- source_word: אַרְמְנוֹתֶיהָ
  choice: அவளுடைய கோட்டைகள்
  rationale: אַרְמוֹן என்பது அரண்மனைகளையோ அரண் கொண்ட வலுவான கட்டிடங்களையோ குறிக்கலாம். அரண்மதிலுடன் இணைந்த நகரப் பாதுகாப்புச் சூழலில் ‘கோட்டைகள்’ பொருத்தமானது; வேறு சாத்தியம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְמַעַן תְּסַפְּרוּ
  choice: அப்போது ... நீங்கள் எடுத்துச் சொல்லலாம்
  rationale: לְמַעַן நோக்கத்தைக் குறிக்கிறது; ספר என்பதன் பியேல் வடிவம் விவரித்தல் அல்லது எடுத்துச் சொல்லுதல். ஆய்ந்து பார்த்ததைப் பின்வரும் தலைமுறைக்குச் சொல்லும் தொடர்பை இயல்பான தமிழில் இவ்வாறு வெளிப்படுத்துகிறது.
- source_word: לְדוֹר אַחֲרוֹן
  choice: வருங்காலத் தலைமுறைக்கு
  rationale: சொற்சொல்லாக ‘பிந்திய தலைமுறைக்கு’ என்று பொருள். அது அடுத்த தலைமுறையை மட்டுமல்லாமல் பின்வரும் தலைமுறையையும் குறிக்கக்கூடும் என்பதால், மூலத்தின் பரப்பைத் தக்கவைக்கும் ‘வருங்காலத் தலைமுறை’ தேர்ந்தெடுக்கப்பட்டது.
