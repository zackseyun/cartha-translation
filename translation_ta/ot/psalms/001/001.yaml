reference: Psalms 1:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
translation:
  language: ta
  text: 'தீயவர்களின் ஆலோசனையின்படி நடக்காதவனும்,

    பாவிகளின் வழியில் நிற்காதவனும்,

    ஏளனம் செய்பவர்கள் அமரும் இடத்தில்[a] அமராதவனுமாகிய

    மனிதன்[b] பேறுபெற்றவன்![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏளனம் செய்பவர்களின் கூட்டத்தில்.” எபிரேயச் சொல் அமரும் இடத்தையோ, கூடுகையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மனிதன்” என்பது எபிரேயத்தில் ஆண்பால் ஒருமை; இங்கு அது ஆண்களை மட்டும் அல்லாமல், இவ்வாறு வாழும் முன்மாதிரியான நபரைப் பொதுவாகக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, “எவ்வளவு நற்பேறு பெற்றவன்!” இந்த எபிரேய வாழ்த்துரை வெறும் மகிழ்ச்சி உணர்வை அல்ல, ஆழமான நலமும் பேறும் கொண்ட நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவன்!
  rationale: இது வெறும் மனமகிழ்ச்சியைக் குறிப்பிடாமல், ஆழமான நல்வாழ்வு அல்லது ஆசீர்வதிக்கப்பட்ட நிலையைக் கூறும் ஞான இலக்கிய வாழ்த்துரை. தமிழில் இயல்பாகவும் வலிமையாகவும் அமைய வியப்புக்குறியுடன் தரப்பட்டது.
- source_word: הָאִישׁ
  choice: மனிதன்
  rationale: எபிரேயச் சொல் இலக்கணத்தில் ஆண்பால் ஒருமையாக இருந்தாலும், இங்கு முன்மாதிரியான நீதியுள்ள நபரைப் பொதுவாகக் குறிக்கிறது. மூலத்தின் ஒருமையையும் மனித நபர் என்ற பொருளையும் தமிழில் காக்கிறது.
- source_word: הָלַךְ / עָמַד / יָשָׁב
  choice: நடக்காதவனும் / நிற்காதவனும் / அமராதவனும்
  rationale: நடத்தையின் படிப்படியான உருவக முன்னேற்றமான நடத்தல்–நிற்றல்–அமர்தல் என்பதைக் காக்கிறது.
- source_word: בַּעֲצַת רְשָׁעִים
  choice: தீயவர்களின் ஆலோசனையின்படி
  rationale: עֵצָה என்பது அறிவுரை மட்டுமல்ல, ஒருவரை வழிநடத்தும் எண்ணப்போக்கையும் குறிக்கக்கூடும். ‘ஆலோசனையின்படி’ என்பது அந்த வழிகாட்டும் தாக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְדֶרֶךְ חַטָּאִים
  choice: பாவிகளின் வழியில்
  rationale: דֶּרֶךְ என்பதன் நேரடியான ‘வழி’ என்ற படிமத்தையும், வாழ்க்கை முறை என்ற விரிவான பொருளையும் ஒருங்கே தக்கவைக்கிறது.
- source_word: בְמוֹשַׁב לֵצִים
  choice: ஏளனம் செய்பவர்கள் அமரும் இடத்தில்
  rationale: מוֹשָׁב என்பதன் அமரும் இடம் அல்லது கூடுகை என்ற பொருள் பரப்பையும், לֵצִים என்பதன் இகழ்ந்து கேலி செய்பவர்கள் என்ற பொருளையும் வெளிப்படுத்துகிறது; அத்துடன் இறுதி ‘அமர்தல்’ படிமத்தையும் காக்கிறது.
theological_decisions:
- issue: ஞான இலக்கியத்தில் பொதுப்பொருளில் வரும் ஆண்பால் ஒருமை
  choice: மனிதன்
  alternative: நபர் / ஒருவர்
  rationale: הָאִישׁ இலக்கணத்தில் ஆண்பால் ஒருமை. ஆனால் இவ்வாழ்த்துரை ஆண்களுக்கு மட்டும் வரையறுக்கப்படவில்லை. மூல வடிவத்தை மறைக்காமல் அதன் பொதுப்பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
- issue: אַשְׁרֵי என்பதின் வாழ்த்துரைத் தன்மை
  choice: பேறுபெற்றவன்!
  alternative: மகிழ்ச்சியானவன்! / ஆசீர்வதிக்கப்பட்டவன்!
  rationale: இந்தச் சொல் வெறும் உணர்ச்சி நிலையையல்ல, நல்வாய்ப்பும் ஆழமான நலநிலையும் கொண்ட ஒருவரைப் பாராட்டி அறிவிக்கிறது. ‘பேறுபெற்றவன்’ அந்தப் பொருளை சமயப் பிரிவுசார் விளக்கமின்றி சுருக்கமாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கவித்துவ இணை அமைப்பும் நடத்தல்–நிற்றல்–அமர்தல் என்ற முன்னேற்றமும் வரி பிரிப்பால் தெளிவாக்கப்பட்டுள்ளன. ‘ஏளனம் செய்பவர்கள்’ என்பது பொதுவாசகருக்குப் புரியும் தற்போதைய சொற்பயன்பாடு.
