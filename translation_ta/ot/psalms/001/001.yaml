  source_fidelity: மூல எபிரேயத்தின் மூன்று மறுப்புத் தொடர்களும்—தீயவர்களின் ஆலோசனையின்படி நடத்தல், பாவிகளின் வழியில் நிற்றல், ஏளனம் செய்பவர்களின் அமர்விடத்தில் அமர்தல்—துல்லியமாகக் காக்கப்பட்டுள்ளன. நடத்தல்–நிற்றல்–அமர்தல் என்ற கவித்துவ, தீவிரமடையும் வரிசையும் பாதுகாக்கப்பட்டுள்ளது. אַשְׁרֵי என்பதன் வாழ்த்துரைத் தன்மையை ‘பேறுபெற்றவன்!’ பொருத்தமாக வெளிப்படுத்துகிறது.
