translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய வசனத்தின் திடீர் முரண்பாடும் வேளாண் உருவகமும் காக்கப்பட்டுள்ளன. 'பதர்' சூழலால் புரிந்துகொள்ளக்கூடிய துல்லியமான வேளாண் சொலாகத் தேர்ந்தெடுக்கப்பட்டது.
