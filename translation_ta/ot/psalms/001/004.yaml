id: PSA.1.4
reference: Psalms 1:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לֹא כֵ֥ן הָ/רְשָׁעִ֑ים כִּ֥י אִם כַּ֝/מֹּ֗ץ אֲֽשֶׁר תִּדְּפֶ֥/נּוּ רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/004.yaml
  text: Not so the wicked; rather[a], they are like chaff that the wind drives away.
translation:
  language: ta
  text: தீயவர்கள் அப்படியல்ல; மாறாக, அவர்கள் காற்று அடித்துச் செல்லும் பதரைப் போன்றவர்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כֵן
  choice: அப்படியல்ல
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நீதிமான்களின் செழிப்புடன் தீயவர்களைத் திடீரென முரண்படுத்தும் எபிரெய மொழியின் சுருக்கமான மறுப்பை இயல்பான தமிழில் காக்கிறது.
- source_word: הָרְשָׁעִים
  choice: தீயவர்கள்
  rationale: ஞான இலக்கியச் சூழலில் ஒழுக்க ரீதியாகத் தீமை செய்பவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்; வெறும் சட்டரீதியான குற்றவாளிகள் என்ற பொருளுக்குள் இதைக் கட்டுப்படுத்தாது.
- source_word: כִּי אִם
  choice: மாறாக
  rationale: நீதிமான்களைப் பற்றிய முந்தைய உருவகத்தை மறுத்து, அதற்கு நேரெதிரான பதர் உருவகத்தை அறிமுகப்படுத்தும் வலுவான முரண்பாட்டை வெளிப்படுத்துகிறது.
- source_word: כַּמֹּץ
  choice: பதரைப் போன்றவர்கள்
  rationale: தானியத்திலிருந்து பிரிக்கப்பட்டு காற்றில் எளிதாகப் பறக்கும் இலகுவான கழிவை מֹץ குறிக்கிறது; 'பதர்' அந்த வேளாண் உருவகத்தைச் சுருக்கமாகவும் துல்லியமாகவும் காக்கிறது.
- source_word: אֲשֶׁר
  choice: —உறவுத்தொடராக ‘காற்று அடித்துச் செல்லும்’—
  rationale: தமிழில் தனியான உறவுப்பெயரைச் சேர்க்காமல் வினையெச்சத் தொடரால் எபிரெய உறவுவாக்கியத்தை இயல்பாக வெளிப்படுத்தலாம்.
- source_word: תִּדְּפֶנּוּ
  choice: அடித்துச் செல்லும்
  rationale: נדף என்பதன் காற்றால் ஓட்டப்பட்டு அகற்றப்படும் இயக்கத்தைத் தெளிவாகக் காட்டும் இயல்பான தமிழ் சொல்லாக்கம்.
- source_word: רוּחַ
  choice: காற்று
  rationale: தானியத்தைத் தூற்றும் வேளாண் உருவகத்தில் இங்கு 'ஆவி' அல்லது 'மூச்சு' அல்ல, இயற்கையான காற்றே தெளிவாகக் குறிக்கப்படுகிறது.
