  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
translation:
  language: ta
  text: ஆனால், யாவேயின் திருச்சட்டத்தில்[a] அவன் மகிழ்ச்சி கொள்கிறான்; அவருடைய திருச்சட்டத்தைப் பகலும் இரவும் தியானிக்கிறான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவேயின் போதனையில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இதற்கான எபிரெய வினைச்சொல், தியானிக்கும்போது மெதுவாக முணுமுணுத்தல் அல்லது தாழ்ந்த குரலில் ஓதுதல் என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: ஆனால்
  rationale: முந்தைய வசனத்திலுள்ள மறுப்புகளுக்கு மாறான நீதிமானின் நிலையைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது; இங்கு இது காரணப் பொருளை விட முரண்பாட்டுப் பொருளுடைய தொடர்.
- source_word: בְּתוֹרַת / וּבְתוֹרָתוֹ
  choice: திருச்சட்டத்தில் / திருச்சட்டத்தை
  rationale: תּוֹרָה என்பது போதனை அல்லது அறிவுரை என்ற விரிவான பொருளையும் கொண்டது; இச்சங்கீதச் சூழலில் யாவே வெளிப்படுத்திய உடன்படிக்கை சார்ந்த போதனையின் அதிகாரத்தைக் காட்ட ‘திருச்சட்டம்’ தேர்ந்தெடுக்கப்பட்டது. எபிரெய இணைநிலையைப் பேண இரண்டாம் முறையும் பெயர்ச்சொல் மீண்டும் கூறப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: חֶפְצוֹ
  choice: அவன் மகிழ்ச்சி கொள்கிறான்
  rationale: חֵפֶץ குறிக்கும் விருப்பம், இன்பம், மனமகிழ்ச்சி ஆகிய உணர்வுகளை இச்சூழலில் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֶהְגֶּה
  choice: தியானிக்கிறான்
  rationale: הגה குறிக்கும் தொடர்ந்து சிந்தித்தல் அல்லது மனதில் அசைபோடுதல் என்ற கருத்தைத் தெளிவாகக் காட்டுகிறது; மெதுவாக உச்சரித்தல் என்ற உட்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יוֹמָם וָלָיְלָה
  choice: பகலும் இரவும்
  rationale: தொடர்ச்சியான நடைமுறையைக் குறிக்கும் எபிரெய இருமுனைச் சொல்லாட்சியை நேரடியாகவும் கவிதைநயத்துடனும் பேணுகிறது.
theological_decisions:
- issue: ஞானப்பாடல் சூழலில் תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: திருச்சட்டம்
  alternative: போதனை / அறிவுரை
  rationale: சொல் வெறும் சட்ட விதிகளை விட விரிவான பொருளைக் கொண்டிருந்தாலும், இங்கு யாவே வெளிப்படுத்திய அதிகாரமுள்ள உடன்படிக்கைப் போதனையின் வேதப்பூர்வ நிறையை ‘திருச்சட்டம்’ காக்கிறது; விரிவான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரையே பயன்படுத்துவதால் அதனை ஒலிபெயர்த்து வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவருடைய’ என்பது யாவேயைக் குறிப்பதைத் தெளிவாக்குகிறது; ‘பகலும் இரவும்’ என்ற மூல மொழியின் இணைச்சொல் அமைப்பு அப்படியே பேணப்பட்டுள்ளது.
