  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
translation:
  language: ta
  text: ஏனெனில், யாவே நீதிமான்களின் வழியை அறிகிறார்[a]; ஆனால் பொல்லாதவர்களின் வழி அழிந்துபோகும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அக்கறையுடன் கவனிக்கிறார்.’ ‘அறிகிறார்’ என்பதற்கான எபிரெயச் சொல் வெறும் தகவல் அறிவை மட்டுமல்லாமல், உறவுசார்ந்த அக்கறை அல்லது அங்கீகாரத்தையும் உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய செய்யுளில் கூறப்பட்ட இரு வாழ்க்கை முடிவுகளுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: יֹדֵעַ
  choice: அறிந்திருக்கிறார்
  rationale: ידע என்ற வினையின் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதைக் காக்கிறது. இச்சூழலில் உறவுசார்ந்த அக்கறையையும் அங்கீகாரத்தையும் இது உட்குறிக்கலாம்; இருப்பினும் அவற்றை முதன்மை உரையிலேயே வெளிப்படையாகச் சேர்த்து விளக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்திலுள்ள இறைபெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: דֶּרֶךְ
  choice: வழி
  rationale: ஒருவரின் வாழ்க்கை முறை, நடத்தை, அதன் இறுதி விளைவு ஆகிய அனைத்தையும் உள்ளடக்கக்கூடிய விரிவான சொல்லாகவும், இரு அரையடிகளின் இணை அமைப்பைக் காக்கக்கூடியதாகவும் உள்ளது.
- source_word: צַדִּיקִים
  choice: நீதிமான்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை அடைமொழியை, ஒழுக்கரீதியாக நேர்மையானவர்களைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்லால் தருகிறது.
- source_word: וְ
  choice: ஆனால்
  rationale: எபிரெயில் அடிப்படையாக ‘மற்றும்’ என்றாலும், நீதிமான்களின் வழிக்கும் பொல்லாதவர்களின் வழிக்கும் இடையிலான கவிதைநய எதிர்மறையைத் தமிழில் தெளிவாக்குகிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: சங்கீத ஞான இலக்கியச் சூழலில் கடவுளுக்கு எதிரான தீய வாழ்க்கை முறையுடையவர்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ப் பதம்.
- source_word: תֹּאבֵד
  choice: அழிந்துபோகும்
  rationale: אבד என்பதன் செயப்படுபொருள் குன்றிய ‘அழிதல், முடிவுறுதல்’ என்ற பொருளைத் தக்கவைத்து, பொல்லாதவர்களின் ‘வழி’ நாசத்தில் முடியும் என்பதைச் சொல்கிறது.
theological_decisions:
- issue: யாவே ‘அறிவது’ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘அறிந்திருக்கிறார்’ என்று மூல வினையின் நேரடிப் பொருள் காக்கப்பட்டு, உறவுசார்ந்த அக்கறை அல்லது அங்கீகாரம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
  alternative: ‘நீதிமான்களின் வழியைக் கவனித்துப் பாதுகாக்கிறார்’ அல்லது ‘அங்கீகரிக்கிறார்’ என்று மொழிபெயர்த்தல்.
  rationale: இச்சூழலில் இறைவனின் அறிதல் வெறும் தகவல் அறிவைத் தாண்டி அக்கறையையும் ஆதரவையும் உணர்த்தக்கூடும். ஆயினும் ‘கவனித்துப் பாதுகாக்கிறார்’ என்பதை முதன்மை உரையில் இடுவது மூலச் சொல்லின் வெளிப்படையான பொருளைவிட விளக்கத்தை முன்னிறுத்திவிடும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வழி’ என்ற சொல்லின் மறுபயன்பாடு எபிரெயக் கவிதையின் இணை அமைப்பையும், வாழ்க்கை முறையிலிருந்து அதன் முடிவுவரை விரியும் உருவகத்தையும் காக்கிறது. ‘வழியோ’ என்பது இரண்டாவது அரையடியின் எதிர்மறையை இயல்பான தமிழில் வலியுறுத்துகிறது.
