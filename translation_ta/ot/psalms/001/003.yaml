source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
translation:
  language: ta
  text: அவன் நீரோடைகளின் கரையோரம் நடப்பட்ட மரத்தைப்போல் இருப்பான். அது தக்க காலத்தில் தன் கனியைத் தரும்; அதன் இலை வாடாது. அவன் செய்கிற அனைத்திலும் செழிப்படைவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் செய்வதெல்லாம் செழிக்கும்.” எபிரேயத்தில் “அவன் செய்வதெல்லாம்” என்பதையே இறுதி வினையின் எழுவாயாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: இருப்பான்
  rationale: முந்தைய வசனங்களில் வர்ணிக்கப்பட்ட மனிதனின் விளைவு அல்லது நிலையைத் தொடரும் வினையாக இங்கு வருகிறது; தமிழில் எதிர்கால வடிவம் இயல்பாக உள்ளது.
- source_word: כְעֵץ שָׁתוּל
  choice: நடப்பட்ட மரத்தைப்போல்
  rationale: כְּ ஒப்புமையையும், שָׁתוּל ஒரு இடத்தில் நோக்கத்துடன் நிலைநிறுத்தப்பட்ட மரத்தையும் குறிக்கிறது. ‘நடப்பட்ட’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: עַל פַלְגֵי מָיִם
  choice: நீரோடைகளின் அருகே
  rationale: פַלְגֵי என்பது பிரிந்து செல்லும் நீர்வழிகள் அல்லது ஓடைகளைக் குறிக்கலாம். ‘நீரோடைகள்’ அந்தப் படிமத்தைச் சாதாரண வாசகருக்குத் தெளிவாகக் கொடுக்கிறது; עַל இச்சூழலில் அருகாமையைச் சுட்டுகிறது.
- source_word: פִּרְיוֹ יִתֵּן
  choice: தன் கனியைத் தரும்
  rationale: எபிரெயச் சொற்றொடரின் ‘தன் கனியைத் தரும்’ என்ற நேரடியான பொருளையும் மரத்துக்கேற்ற இயல்பான தமிழையும் காக்கிறது.
- source_word: בְּעִתּוֹ
  choice: தக்க காலத்தில்
  rationale: பழம் விளைவதற்குரிய அல்லது நியமிக்கப்பட்ட காலத்தைக் குறிக்கிறது. ‘தக்க காலத்தில்’ என்பது வேளாண்மைப் படிமத்தையும் நேரத்தின் பொருத்தத்தையும் வெளிப்படுத்துகிறது.
- source_word: וְעָלֵהוּ לֹא יִבּוֹל
  choice: அதன் இலை வாடாது
  rationale: எபிரெயில் உள்ள ஒருமைத் தொகுப்புப் பயன்பாட்டையும் செடியின் இலை வாடுதல் என்ற நேரடியான படிமத்தையும் காக்கிறது.
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה יַצְלִיחַ
  choice: அவன் செய்கிற அனைத்திலும் செழிப்படைவான்
  rationale: இறுதி வினையின் எழுவாயை சங்கீதத்தின் மனிதனாகக் கொண்டு, அவனுடைய செயல்கள் அனைத்திலும் அவன் செழிப்படைவதை இயல்பான தமிழில் கூறுகிறது. ‘அவன் செய்வதெல்லாம் செழிக்கும்’ என்ற இலக்கணப் புரிதலும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יַצְלִיחַ என்ற இறுதி வினையின் எழுவாய்
  choice: 'செழிப்படைவது அந்த மனிதன்: ‘அவன் செய்கிற அனைத்திலும் செழிப்படைவான்.’'
  alternative: 'அவனுடைய செயல்கள் செழிக்கின்றன: ‘அவன் செய்வதெல்லாம் செழிக்கும்.’'
  rationale: எபிரெயத் தொடரை, முன்பிருந்து வர்ணிக்கப்படும் மனிதனையே மறைமுக எழுவாயாகக் கொண்டதாகவோ, ‘அவன் செய்வதெல்லாம்’ என்பதை இறுதி வினையின் எழுவாயாகக் கொண்டதாகவோ புரிந்துகொள்ள முடியும். முதன்மை உரை மனிதனை மையமாக வைத்தாலும், சாத்தியமான மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கவித்துவத் தெளிவும் காக்கப்பட்டுள்ளன. நீர், கனி, இலை ஆகிய மூலப்படிமங்கள் நேரடியாக வைக்கப்பட்டுள்ளன; தேவையற்ற சமயச் சிறப்புச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
