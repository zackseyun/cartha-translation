  yaml_path: translation/ot/psalms/001/005.yaml
  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
translation:
  language: ta
  text: ஆகையால், தீயவர்கள் நியாயத்தீர்ப்பில்[a] நிலைநிற்கமாட்டார்கள்; பாவிகளும் நீதிமான்களின் சபையில்[b] நிலைநிற்கமாட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீதிவிசாரணையில்.’ இங்கு வரும் எபிரெய் சொல், இவ்வுலகில் நிகழும் நீதிக் கணக்குக் கேட்பையோ இறுதி நியாயத்தீர்ப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீதிமான்களின் கூட்டத்தில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய வசனங்களில் தீயவர்களைப் பற்றிக் கூறப்பட்டதிலிருந்து வரும் முடிவை இயல்பாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: יָקֻמוּ
  choice: நிலைநிற்கமாட்டார்கள்
  rationale: קום என்பதன் ‘எழுதல்/நிற்றல்’ என்ற உருவகத்தைப் பேணுவதோடு, நியாய விசாரணையில் நிலைத்திருக்கவோ ஏற்றுக்கொள்ளப்படவோ முடியாது என்ற நீதித்துறை சார்ந்த நுட்பத்தையும் மிகைப்படுத்தாமல் வெளிப்படுத்துகிறது. இரண்டாம் இணை வாக்கியத்திலும் எபிரெயில் விடுபட்டுள்ள வினைச்சொல்லைத் தமிழின் தெளிவிற்காக மீண்டும் வழங்குகிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: ஞான இலக்கியத்தில் காணப்படும் ஒழுக்க வகைப்பாட்டை, வெறும் சட்டக் குற்றவாளிகள் என்ற பொருளாகக் குறுக்காமல், நவீன தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: בַּמִּשְׁפָּט
  choice: நியாயத்தீர்ப்பில்
  rationale: מִשְׁפָּט என்பதிலுள்ள தீர்ப்பு/நீதி விசாரணை சார்ந்த பொருளைப் பேணுகிறது; இது தற்போதைய விசாரணையா இறுதி நியாயத்தீர்ப்பா என்பதை உரை தீர்மானிக்கவில்லை.
- source_word: חַטָּאִים
  choice: பாவிகள்
  rationale: பாவத்தால் அடையாளப்படுத்தப்படுகிறவர்களைக் குறிக்கும் நேரடியான, பொதுவாகப் புரியும் தமிழ் இணைச்சொல்.
- source_word: בַּעֲדַת
  choice: சபையில்
  rationale: עֵדָה குறிக்கும் ஒன்றுகூடிய சமூகத்தை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; ‘மத்தியில்’ என்பதைவிட அதன் குழுமத் தன்மையை நன்றாகப் பேணுகிறது.
- source_word: צַדִּיקִים
  choice: நீதிமான்களின்
  rationale: ஒழுக்க மற்றும் உடன்படிக்கைச் சூழலிலுள்ள ‘நீதியுள்ளோர்’ என்ற வகைப்பாட்டைச் சுருக்கமாகவும் மரபுக்கு இசைவாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘நியாயத்தீர்ப்பு’ என்பதன் காலமும் எல்லையும்
  choice: தற்போதைய நீதிவிசாரணையையோ இறுதி நியாயத்தீர்ப்பையையோ குறிப்பாக நிர்ணயிக்காமல் பொதுவாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘இறுதி நியாயத்தீர்ப்பில்’ என்று வெளிப்படையாகக் காலவரையறை செய்வது, அல்லது ‘நீதி விசாரணையில்’ என்று இம்மைக்குரிய சட்டச் சூழலாகக் குறுக்குவது.
  rationale: எபிரெய் சொல் பரந்த நீதித்துறை கணக்குக் கேட்பை அனுமதிக்கிறது; சங்கீதத்தின் ஞான இலக்கியச் சூழலும் உடனடியான மற்றும் இறுதியான விளைவுகள் இரண்டையும் திறந்தவாறு வைத்திருக்கலாம்.
- issue: இரண்டாம் உறுப்பில் ‘நிலைநிற்கமாட்டார்கள்’ என்பதன் பொருள்
  choice: சபையில் நிலைபெறவோ இடம்பெறவோ முடியாது என்ற கருத்தை, முதல் உறுப்பின் வினைச்சொல்லை மீண்டும் வழங்கி வெளிப்படுத்தப்பட்டது.
  alternative: ‘பாவிகள் நீதிமான்களின் சபையில் இருக்கமாட்டார்கள்’ என்று உருவகத்தை விளக்கிப் பரிமாற்றுவது.
  rationale: எபிரெய் இணை அமைப்பில் ஒரே வினை இரு உறுப்புகளையும் ஆளுகிறது; அதைத் தமிழில் மீளச் சொல்வது தெளிவை அளித்து ‘நிற்றல்’ என்ற மூல உருவகத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான பொதுவாசிப்பு நடையில் வடிவமைக்கப்பட்டது. ‘நியாயத்தீர்ப்பு,’ ‘பாவிகள்,’ ‘நீதிமான்கள்’ போன்ற பரவலாக அறியப்பட்ட வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; வாக்கியத் தெளிவிற்காக இணை உறுப்பின் வினைச்சொல் தமிழில் மீண்டும் கூறப்பட்டுள்ளது.
