  yaml_path: translation/ot/psalms/107/010.yaml
  text: Some sat in darkness and deep shadow[a], prisoners in affliction and irons,
translation:
  language: ta
  text: 'இருளிலும் காரிருளிலும்[a] அமர்ந்திருந்தோர்,

    துன்பத்தாலும் இரும்புக் கட்டுகளாலும் பிணைக்கப்பட்டோர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரண நிழலிலும்.” צַלְמָוֶת என்பதற்கான மரபுவழி மொழிபெயர்ப்பு இது; ஆனால் இச்சொல் பொதுவாக ஆழ்ந்த இருளையோ அடர்ந்த இருண்ட நிலையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: அமர்ந்திருந்தவர்கள்
  rationale: ישב என்பதன் பன்மைப் பெயரெச்ச வடிவம் அமர்ந்திருப்போர் அல்லது குடியிருப்போர் என்பதைக் குறிக்கிறது. இங்கு ஒரு துயர்நிலையில் சிக்கியிருப்பதை இயல்பான தமிழில் தெரிவிக்க ‘அமர்ந்திருந்தவர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חֹשֶׁךְ
  choice: இருள்
  rationale: நேரடியான அல்லது உருவகமான இருளைக் குறிக்கும் எபிரெயச் சொல்லுக்கு இயல்பான, தெளிவான தமிழ் இணை.
- source_word: צַלְמָוֶת
  choice: காரிருள்
  rationale: இந்தச் சொல் ஆழ்ந்த இருள் அல்லது கடும் மந்தாரத்தைப் பொதுவாகக் குறிக்கலாம். மரணத்தை வெளிப்படையாகச் சேர்க்காமல் அதன் கவித்துவ வலிமையைத் தக்கவைக்க ‘காரிருள்’ தேர்ந்தெடுக்கப்பட்டது; மரபுவழி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֲסִירֵי
  choice: கட்டுண்ட கைதிகள்
  rationale: கட்டப்பட்டோர் அல்லது சிறைப்பட்டோர் என்ற பொருளைத் தெளிவாக்குகிறது. அடுத்துவரும் இரும்பு என்ற சிறைப்பிடிப்பு உருவகத்துடனும் பொருந்துகிறது.
- source_word: עֳנִי
  choice: துன்பம்
  rationale: இச்சொல் சிறுமை, துயரம், வறுமை ஆகிய பொருட்களைக் கொள்ளலாம். சிறை மற்றும் தளைகள் என்ற சூழலில் பொருளாதார வறுமை எனக் குறுக்காமல் விரிந்த வேதனையை ‘துன்பம்’ தெரிவிக்கிறது.
- source_word: בַרְזֶל
  choice: இரும்புத் தளைகள்
  rationale: எபிரெயத்தில் ‘இரும்பு’ ஒருமையில் வந்தாலும், இங்கு அது இரும்பால் செய்யப்பட்ட கட்டுகள் அல்லது விலங்குகளைக் குறிக்கும் ஆகுபெயர். தமிழில் சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க ‘இரும்புத் தளைகள்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: צַלְמָוֶת என்பதில் மரணம் வெளிப்படையாக உள்ளதா
  choice: முதன்மை உரையில் ‘காரிருள்’
  alternative: ‘மரண நிழல்’
  rationale: இச்சொல்லை ‘மரண நிழல்’ என்று வழங்குவது மரபானது; ஆனால் அது பொதுவாக ஆழ்ந்த இருள் அல்லது கடும் மந்தாரத்தையும் குறிக்கக்கூடும். எனவே மரணக் கருத்தைத் தீர்மானமாகச் சேர்க்காமல், மரபு வாசிப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கவித்துவ கண்ணியத்தையும் எபிரெய இணை அமைப்பையும் காக்கும் வகையில் வடிவமைக்கப்பட்டது. ‘இரும்புத் தளைகள்’ என்பது மூலத்தின் ஆகுபெயரை வாசகருக்குத் தெளிவாக்கும் இயல்பான விரிவாக்கம்.
