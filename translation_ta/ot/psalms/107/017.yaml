source:
  edition: WLC
  text: אֱ֭וִלִים מִ/דֶּ֣רֶךְ פִּשְׁעָ֑/ם וּֽ֝/מֵ/עֲוֺֽנֹתֵי/הֶ֗ם יִתְעַנּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/017.yaml
  text: Fools[a], because of the way of their transgression and because of their iniquities[c][b], were afflicted.
translation:
  language: ta
  text: மூடர்கள், தங்கள் மீறுதலின் வழியினாலும் தங்கள் அக்கிரமங்களினாலும் துன்பப்பட்டார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தங்கள் மீறுதலின் வழியிலிருந்தும் தங்கள் அக்கிரமங்களிலிருந்தும் துன்பப்பட்டார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய முன்னிடைச்சொற்கள் சொல்லுக்குச் சொல்லாக “இருந்து” எனப் பொருள்படலாம்; இங்கு அவை பெரும்பாலும் காரணத்தைக் குறிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: “மீறுதல்” என்பதை “கலகம்” என்றும், “அக்கிரமங்கள்” என்பதை “பாவங்கள்” அல்லது “குற்றங்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: மூடர்கள்
  rationale: இது அறிவுத்திறன் குறைந்தவர்களை மட்டும் குறிக்காமல், ஒழுக்க ரீதியில் மதியீனமாக நடப்பவர்களைக் குறிக்கும் ஞான இலக்கியச் சொல்.
- source_word: מִדֶּרֶךְ פִּשְׁעָם
  choice: தங்கள் மீறுதலான வழியினால்
  rationale: מִן இங்கு காரணத்தைக் குறிக்கிறது; דֶּרֶךְ வாழ்க்கை முறை அல்லது நடத்தையின் பாதை என்ற உருவகத்தைத் தக்கவைக்கிறது. פֶּשַׁע அதிகாரத்திற்கு எதிரான மீறுதல் அல்லது கலகத்தின் நுண்ணுணர்வைக் கொண்டது.
- source_word: וּמֵעֲוֺנֹתֵיהֶם
  choice: தங்கள் அக்கிரமங்களினாலும்
  rationale: இரண்டாவது מִן-உம் காரணத்தைக் குறிக்கிறது. עָוֹן என்பது அக்கிரமம், குற்றம் அல்லது குற்றப்பழி எனப் பொருள்படலாம்; இங்கு பன்மை வடிவம் அவர்கள் செய்த குற்றச் செயல்களைச் சுட்டுகிறது.
- source_word: יִתְעַנּוּ
  choice: துன்பப்பட்டார்கள்
  rationale: ענה என்பதன் ஹித்பயேல் வடிவம் துன்புறுதல் அல்லது சிறுமைப்படுத்தப்படுதல் என்ற நிலையைத் தெரிவிக்கிறது. சங்கீதத்தின் கடந்தகால நிகழ்வுரைக்கு ஏற்ற இயல்பான தமிழ் வடிவம் இது.
theological_decisions:
- issue: பாவத்திற்கும் துன்பத்திற்கும் இடையிலான காரண உறவு
  choice: அவர்களின் மீறுதலான வாழ்க்கை முறையினாலும் அக்கிரமங்களினாலும் அவர்கள் துன்பப்பட்டார்கள் என்று வசனம் கூறுகிறது.
  alternative: எபிரெய முன்னிடைச்சொல்லை இன்னும் சொல்லுக்குச் சொல்லாகக் கொண்டு, அவர்கள் தங்கள் மீறுதலான வழியிலிருந்தும் அக்கிரமங்களிலிருந்தும் துன்ப நிலைக்கு வந்தார்கள் என மொழிபெயர்க்கலாம்.
  rationale: இரு מִן வடிவங்களும் இச்சூழலில் காரணத்தைக் குறிப்பதாகப் புரிவது சிறந்தது. எனினும், எல்லாத் துன்பமும் தனிப்பட்ட பாவத்தாலேயே வருகிறது என்ற பொதுக் கோட்பாட்டை வசனத்தில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. “வழி” என்ற எபிரெய உருவகம் தக்கவைக்கப்பட்டுள்ளது; இரு காரணப் பிரிவுகளும் “-ஆல்” வடிவில் தெளிவாகக் காட்டப்பட்டுள்ளன.
