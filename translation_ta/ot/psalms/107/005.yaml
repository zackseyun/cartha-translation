source:
  edition: WLC
  text: רְעֵבִ֥ים גַּם צְמֵאִ֑ים נַ֝פְשָׁ֗/ם בָּ/הֶ֥ם תִּתְעַטָּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/005.yaml
  text: Hungry and thirsty[b][a], their soul fainted within them.
translation:
  language: ta
  text: பசியும் தாகமும் கொண்டவர்களாய், அவர்களுடைய உயிர் அவர்களுக்குள் சோர்ந்துபோனது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְעֵבִים
  choice: பசியும்
  rationale: எபிரெய அடைமொழியான ‘பசியுள்ளவர்கள்’ என்பதை, அடுத்து வரும் ‘தாகம்’ என்பதோடு இயல்பாக இணைக்கிறது; ‘பட்டினியால் வாடினர்’ என்று தேவையற்ற தீவிரத்தைச் சேர்க்கவில்லை.
- source_word: גַּם
  choice: -உம் … -உம்
  rationale: ‘மேலும்/கூட’ என்ற சேர்க்கைப் பொருளைத் தமிழின் இயல்பான இணை அமைப்பான ‘பசியும் தாகமும்’ என்பதில் வெளிப்படுத்துகிறது.
- source_word: צְמֵאִים
  choice: தாகமும் கொண்டவர்களாய்
  rationale: தாகமுள்ள நிலையைத் தெளிவாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: נַפְשָׁם
  choice: அவர்களுடைய உயிர்
  rationale: נֶפֶשׁ இங்கு உயிர், உள்ளுயிர் அல்லது தாமே என்ற பொருள் வரம்பைக் கொண்டது. ‘உயிர்’ என்பது உட்புற வலிமை தளர்வதையும் எபிரெய உருவகத்தையும் காக்கிறது.
- source_word: בָּהֶם
  choice: அவர்களுக்குள்
  rationale: உள்ளார்ந்த இடத்தைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִּתְעַטָּף
  choice: சோர்ந்துபோனது
  rationale: உள்ளுயிர் தளர்ந்து மங்கும் பொருளைச் சூழலுக்கேற்ற இயல்பான தமிழில் தருகிறது; உடல் மயக்கம் மட்டுமே எனக் குறுக்கவில்லை.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் மானுடவியல் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா / அவர்களே
  rationale: ஒரு குறிப்பிட்ட உடல்–ஆத்துமா பிரிவுக் கோட்பாட்டை உரையில் புகுத்தாமல், உயிர், உள்ளுயிர், தாமே ஆகிய உண்மையான பொருள் சாத்தியங்களை அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெயத்தின் சேர்க்கை வலியுறுத்தல் ‘பசியும் தாகமும்’ என்ற இயல்பான தமிழ் இணைப்பால் தரப்பட்டுள்ளது; נֶפֶשׁ என்பதின் பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
