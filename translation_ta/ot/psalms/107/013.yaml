  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: ta
  text: அப்போது அவர்கள் தங்கள் நெருக்கடியில் யாவேவை நோக்கிக் கூக்குரலிட்டார்கள்; அவர் அவர்களுடைய இடுக்கண்களிலிருந்து அவர்களை மீட்டார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: அப்போது ... கூக்குரலிட்டார்கள்
  rationale: זעק என்பது உதவி வேண்டி உரக்கக் கூப்பிடுவதைக் குறிக்கிறது. தொடர்ச்சியை முன்னெடுக்கும் waw வடிவத்தையும் சங்கீதத்தின் திரும்பவரும் அமைப்பையும் “அப்போது” இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶל־יְהוָה
  choice: யாவேவை நோக்கி
  rationale: אֶל திசை அல்லது இலக்கைக் குறிக்கிறது; கூக்குரல் யாவேவை நோக்கியது என்பதை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בַּצַּר לָהֶם
  choice: தங்கள் நெருக்கடியில்
  rationale: צַר இங்கு நெருக்கமான, துன்பமான நிலையைச் சுட்டுகிறது. எபிரெய ஒருமையின் கூட்டு உணர்வைத் தமிழ் ஒருமையான “நெருக்கடியில்” காக்கிறது.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: அவர்களுடைய இடுக்கண்களிலிருந்து
  rationale: מְצוּקוֹת என்பது நெருக்குதல்கள், கடும் இன்னல்கள் அல்லது இடுக்கண்கள் என்னும் பன்மைப் பொருளைக் கொண்டது. “இடுக்கண்கள்” பன்மையையும் விடுதலை தேவைப்படும் கடுமையான சூழ்நிலைகளையும் காக்கிறது.
- source_word: יוֹשִׁיעֵם
  choice: அவர்களை மீட்டார்
  rationale: ישׁע வேரின் Hiphil வடிவம் காப்பாற்றுதல் அல்லது விடுவித்தல் என்று பொருள்படும். இச்சூழலில் “மீட்டார்” சுருக்கமாகவும் இயல்பாகவும் அந்தச் செயலை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் ஒரு பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைபெயரே உள்ளது. ஆகவே அதை பட்டப்பெயராக மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பான “யாவே” என்று வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான சங்கீத நடையைப் பயன்படுத்துகிறது. “நெருக்கடி” மற்றும் “இடுக்கண்கள்” மூலம் மூலத்திலுள்ள தொடர்புடைய ஆனால் வேறுபட்ட இரு சொற்களும் வேறுபடுத்தப்பட்டுள்ளன.
