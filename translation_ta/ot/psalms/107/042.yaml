source:
  edition: WLC
  text: יִרְא֣וּ יְשָׁרִ֣ים וְ/יִשְׂמָ֑חוּ וְ/כָל עַ֝וְלָ֗ה קָ֣פְצָה פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/042.yaml
  text: The upright see and rejoice[a], and all injustice shuts its mouth.
translation:
  language: ta
  text: 'நேர்மையானவர்கள் கண்டு மகிழ்வார்கள்;

    அநீதியெல்லாம் தன் வாயை மூடிக்கொள்ளும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அக்கிரமமெல்லாம் தன் வாயை மூடிக்கொள்ளும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘அநீதி’ என்பது பெண்பால் ஒருமை அருவப் பெயர்; அதன் பெண்பால் உரிமைச்சுட்டு, அநீதியை ஒரு நபரைப்போல் உருவகப்படுத்தி அது மௌனமாக்கப்படுவதைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ
  choice: இதைக் கண்டு
  rationale: ראה என்பதன் Qal முற்றுப்பெறா வடிவம். சங்கீதத்தின் சூழலில் முன்பு விவரிக்கப்பட்ட இறைவனின் செயல்களை அவர்கள் காண்பதை இயல்பாகச் சுட்டுவதற்காக ‘இதைக் கண்டு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְשָׁרִים
  choice: நேர்மையானவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை உரிச்சொல்; ஒழுக்கத்தில் செம்மையானவர்களைக் குறிக்கிறது. ‘நீதிமான்கள்’ என்பதைக் காட்டிலும் எபிரெயச் சொல்லின் ‘நேரான/செம்மையான’ நுண்பொருளை இது நேரடியாகக் காக்கிறது.
- source_word: וְיִשְׂמָחוּ
  choice: மகிழ்வார்கள்
  rationale: שמח என்பதன் Qal முற்றுப்பெறா பன்மை வடிவம். ‘காண்பார்கள்’ என்பதோடு இணையும் எதிர்கால/பொதுநிலைச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְכָל עַוְלָה
  choice: அநீதி அனைத்தும்
  rationale: עַוְלָה என்பது அநீதி, அக்கிரமம், நேர்மையின்மை ஆகிய பொருள்களைக் கொண்ட அருவப் பெயர். தனிப்பட்ட ‘தீயவர்கள்’ என்று மாற்றாமல், மூலத்தின் அருவமானதும் கூட்டுத்தன்மையுடையதுமான பொருளை ‘அநீதி அனைத்தும்’ காக்கிறது.
- source_word: קָפְצָה פִּיהָ
  choice: தன் வாயை மூடிக்கொள்ளும்
  rationale: ‘வாயை மூடுதல்’ என்ற எபிரெய மொழிப்படிமத்தைத் தக்கவைக்கிறது. தமிழ் நடையில் ‘தன்’ என்பது அநீதியை மனிதரைப்போல் உருவகப்படுத்தும் தொடர்பைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: அநீதி மனிதரைப்போல் உருவகப்படுத்தப்படுதல்
  choice: ‘அநீதி அனைத்தும் தன் வாயை மூடிக்கொள்ளும்’ என்று அருவப் பொருளையே உருவகப்படுத்துதல்
  alternative: ‘தீயவர்கள் வாயடைத்துப்போவார்கள்’ என்று மனிதர்களை நேரடிப் பொருளாக்குதல்
  rationale: மூல எபிரெயத்தில் எழுவாய் தீய மனிதர்களைக் குறிக்கும் பெயர்ச்சொல் அல்ல; ‘அநீதி’ என்ற பெண்பால் ஒருமை அருவப் பெயர். எனவே அநீதியே மௌனமாக்கப்படுவதாக உள்ள கவிதை உருவகத்தை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணை வரிகளின் எதிர்மறை ஒப்புமை அரைப்புள்ளி மற்றும் வரிமுறிவால் வெளிப்படுத்தப்பட்டுள்ளது.
