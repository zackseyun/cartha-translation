  yaml_path: translation/ot/psalms/107/040.yaml
  text: He pours contempt on nobles and makes them wander in a trackless waste[a][b].
translation:
  language: ta
  text: 'அவர் உயர்குடியினர் மேல் இகழ்ச்சியைப் பொழிகிறார்;

    பாதையே இல்லாத பாழ்வெளியில் அவர்களை அலையச் செய்கிறார்.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிரபுக்கள்’ அல்லது ‘தலைவர்கள்.’ எபிரெயச் சொல் உயர்நிலையினரையும் ஆட்சித் தலைவர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘பாழ்வெளியில்—வழி இல்லை’; அதாவது, பாதையற்ற வெறிச்சோடிய இடத்தில்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: பொழிந்து
  rationale: שׁפך என்பதன் ‘ஊற்று/பொழி’ என்ற உயிரோட்டமான உருவகத்தைத் தக்கவைக்கிறது. தொடரும் வினையுடன் இயல்பாக இணைவதற்காகத் தமிழ் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בּוּז
  choice: இகழ்ச்சியை
  rationale: בּוּז குறிக்கும் contempt/scorn என்ற பொதுவெளி அவமதிப்பு உணர்வை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: נְדִיבִים
  choice: உயர்குடியினர்
  rationale: இச்சூழலில் அதிகாரமும் சமூக உயர்நிலையும் கொண்ட nobles அல்லது princes என்பவர்களைக் குறிக்கிறது. ‘உயர்குடியினர்’ என்பது ‘இளவரசர்கள்’ என்று தேவையின்றிக் குறுக்காமல் அந்தப் படிநிலையை வெளிப்படுத்துகிறது.
- source_word: וַיַּתְעֵם
  choice: அவர்களை அலையச் செய்கிறார்
  rationale: תעה என்பதன் Hiphil வடிவத்திலுள்ள ‘அலையும்படி செய்’ என்ற causative பொருளையும், பாழ்வெளியில் திசையின்றித் திரியும் காட்சியையும் காக்கிறது.
- source_word: בְּתֹהוּ
  choice: பாழ்வெளியில்
  rationale: תֹהוּ என்பதன் பாழ்மை, வெறுமை, ஒழுங்கின்மை ஆகிய பொருட்களில் இச்சூழலுக்குரிய வெறிச்சோடிய இடம் என்ற காட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: לֹא דָרֶךְ
  choice: பாதையே இல்லாத
  rationale: எபிரெய மொழியின் ‘வழி இல்லை’ என்ற சொற்றொடரை வலியுறுத்தும் ஏகாரத்துடன் இயல்பாகவும், trackless என்ற கருத்தைத் தெளிவாகவும் தருகிறது.
theological_decisions:
- issue: மறைமுக எழுவாய்
  choice: சூழலில் கர்த்தரைக் குறிக்கும் எழுவாயை ‘அவர்’ என்று வெளிப்படையாக வழங்குதல்
  alternative: பொதுவான அல்லது ஆளற்ற எழுவாயாக விடுதல்
  rationale: சங்கீதம் 107-ன் சுற்றியுள்ள வசனங்கள் இத்தகைய தலைகீழ் மாற்றங்களை கர்த்தருடைய செயல்களாகக் காட்டுகின்றன. தமிழிலும் எழுவாயை வெளிப்படுத்துவது தெளிவை அளிக்கிறது; ‘அவர்’ என்பது மூலத்தில் சுட்டப்படும் தெய்வீகச் செய்பவரை மட்டுமே வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவித்துவமான உருவகத்தைத் தக்கவைத்தபடியே பொதுவாசகர்களுக்கு இயல்பாகப் புரியும் கண்ணியமான நடை. எபிரெய வினைநிலைகளின் கால வேறுபாட்டைத் தமிழில் தொடர்ச்சியான பொதுநிகழ் வருணனையாக வழங்குகிறது.
