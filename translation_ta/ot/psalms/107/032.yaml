  yaml_path: translation/ot/psalms/107/032.yaml
  text: Let them exalt him in the assembly of the people[b][a], and praise him in the council of the elders.
translation:
  language: ta
  text: மக்களின் சபையில்[a] அவரை மேன்மைப்படுத்தட்டும்; மூப்பர்கள் அமர்ந்திருக்கும் அவையில்[b] அவரைப் புகழட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சபை’ என்பதற்கு மாற்றாக ‘கூட்டம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘மூப்பர்களின் அமர்வு’ அல்லது ‘மூப்பர்கள் அமரும் இடம்’ என்று நேரடியாக உள்ளது; இங்கு அமர்ந்திருக்கும் அவர்களுடைய ஆலோசனைக் கூட்டத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירֹמְמוּהוּ
  choice: அவரை மேன்மைப்படுத்தட்டும்
  rationale: רומם என்பதன் தீவிரப் பயன்பாடு ஒருவரை உயர்வாக மதித்துப் போற்றுவதைக் குறிக்கிறது. தமிழில் பொதுமக்களுக்கு இயல்பாகவும், பொதுவில் அவருக்குச் செய்யப்படும் கனத்தைத் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: בִּקְהַל עָם
  choice: மக்களின் சபையில்
  rationale: קהל என்பது கூடிவந்த மக்கள் கூட்டம் அல்லது சபை; עָם இங்கு பொதுவாக மக்களைக் குறிக்கிறது. ‘மக்களின் சபை’ என்பது வழிபாட்டு மற்றும் பொதுக்கூட்டச் சூழல் இரண்டுக்கும் பொருந்துகிறது.
- source_word: וּבְמוֹשַׁב זְקֵנִים
  choice: மூப்பர்கள் அமர்ந்திருக்கும் அவையில்
  rationale: מוֹשָׁב என்பது அமர்வு, அமரும் இடம், அல்லது அமர்ந்த கூட்டம் என்ற பொருள்களை உடையது; זְקֵנִים இங்கு வயதானவர்களை மட்டும் அல்ல, சமூக மூப்பர்களைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு அமர்ந்த ஆலோசனைக் கூட்டம் என்ற படிமத்தையும் அதன் பொதுச் சபைச் செயல்பாட்டையும் காக்கிறது.
- source_word: יְהַלְלוּהוּ
  choice: அவரைப் புகழட்டும்
  rationale: הלל என்பதன் பியேல் வடிவம் நேரடியாகப் புகழ்வதைக் குறிக்கிறது; சங்கீதச் சூழலில் ‘புகழட்டும்’ இயல்பானதும் துல்லியமானதும் ஆகும்.
