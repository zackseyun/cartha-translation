translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. இணையான இரு அழைப்புகளின் கவிதை அமைப்பு காக்கப்பட்டுள்ளது; ‘மூப்பர்கள் அமர்ந்திருக்கும் அவை’ என்பது மூலத்தின் அமர்வு சார்ந்த படிமத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
