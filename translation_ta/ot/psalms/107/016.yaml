lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நன்றிசெலுத்துதலுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: שִׁבַּר
  choice: நொறுக்கி
  rationale: வலிமையாகவும் முற்றிலுமாகவும் உடைக்கும் செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: דַּלְתוֹת
  choice: கதவுகளை
  rationale: எபிரெயச் சொல்லின் நேரான பொருள் கதவுகள் அல்லது கதவுப் பலகைகள்; சூழலில் அரண் வாயில்களின் கதவுகளைக் குறிக்கலாம்.
- source_word: נְחֹשֶׁת
  choice: வெண்கல
  rationale: இச்சூழலில் செம்புக் கலவையைக் குறிக்கும் வழக்கமான, வரலாற்றுக்கு ஏற்ற நவீனத் தமிழ் சொல்.
- source_word: בְרִיחֵי
  choice: தாழ்ப்பாள்களை
  rationale: கதவுகளையோ வாயில்களையோ அடைத்துப் பாதுகாக்கும் குறுக்குக் கம்பிகளை இயல்பான தமிழில் குறிக்கிறது.
- source_word: בַרְזֶל
  choice: இரும்பு
  rationale: உலோகத்தைக் குறிக்கும் எபிரெயச் சொல்லின் நிலையான தமிழ் மொழிபெயர்ப்பு.
- source_word: גִּדֵּעַ
  choice: துண்டித்தார்
  rationale: வெட்டி முறிக்கும் அல்லது அறுத்தெடுக்கும் வலிமையான செயலைக் காட்டுகிறது; இரும்புத் தாழ்ப்பாள்கள் என்ற பொருளுடன் இயல்பாக இணைகிறது.
theological_decisions:
- issue: தெய்வீகச் செயலின் எழுவாய்
  choice: அவர்
  alternative: யெகோவா
  rationale: இவ்வசனத்தில் எழுவாய் வெளிப்படையாக இடம்பெறாமல், மூன்றாம் நபர் ஆண்பால் ஒருமை வினைகள் முந்தைய சூழலில் உள்ள யெகோவாவைக் குறிக்கின்றன. ‘அவர்’ என்பது மூல உரையின் உரையோட்டத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமான கண்ணியத்தையும் சாதாரண வாசகர்களுக்கான தெளிவையும் இணைக்கும் நடை. ‘நொறுக்கி’ மற்றும் ‘துண்டித்தார்’ ஆகியவை எபிரெய இணைவரிகளின் வலிமையைப் பாதுகாக்கின்றன.
