  source_fidelity: 'முதல் வரி எபிரெய மூலத்துடன் நன்றாக ஒத்துள்ளது: כִּי-யின் விளக்கத் தொடர்பு, வெண்கலக் கதவுகள், அவற்றை வலிமையாக உடைத்தல் ஆகியவை தெளிவாக உள்ளன. ஆனால் בְרִיחֵי என்பது கதவு/வாயிலை உறுதிப்படுத்தும் கம்பிகள் அல்லது குறுக்குக்கம்பிகளைக் குறிப்பதால், ‘தாழ்ப்பாள்கள்’ என்பது சற்றுக் குறுகிய பொருளைத் தருகிறது. ‘கம்பிகள்’ மூலத்தின் உருவகத்தையும் இணைவரியின் வலிமையையும் சிறப்பாகக் காக்கிறது.'
  naturalness: ‘ஏனெனில் அவர் வெண்கலக் கதவுகளை நொறுக்கி, இரும்புக் கம்பிகளை வெட்டித் துண்டித்தார்’ என்பது நவீன நிலையான தமிழில் இயல்பாகவும் கவித்துவக் கண்ணியத்துடனும் உள்ளது. ‘வெட்டித் துண்டித்தார்’ גִּדֵּעַ-யின் வெட்டி அகற்றும்/முறிக்கும் வலிமையை வெளிப்படுத்துகிறது.
