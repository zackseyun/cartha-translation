    text: அல்லது, “வெண்கல வாயில்களை உடைத்தார்.” எபிரெயப் பெயர்ச்சொல்லின் துல்லியமான பொருள் “கதவுகள்”; ஆயினும், இச்சூழலில் அரணமைந்த வாயில்கள் குறிக்கப்படலாம்.
