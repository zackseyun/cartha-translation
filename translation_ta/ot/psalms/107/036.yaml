source:
  edition: WLC
  text: וַ/יּ֣וֹשֶׁב שָׁ֣ם רְעֵבִ֑ים וַ֝/יְכוֹנְנ֗וּ עִ֣יר מוֹשָֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/036.yaml
  text: There he settled the hungry[a], and they established a city to live in.
translation:
  language: ta
  text: 'அங்கே அவர் பசியுற்றவர்களைக் குடியமர்த்தினார்;

    அவர்கள் குடியிருப்பதற்காக ஒரு நகரத்தை நிறுவினார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குடியிருப்பதற்கான ஒரு நகரத்தை.”
    reason: מוֹשָׁב என்பதை நோக்கத்தைக் காட்டும் வினைச்சொல் தொடராகவோ, ‘குடியிருப்பதற்கான’ என்ற பெயரடைத் தொடராகவோ இயல்பாகப் புரிந்துகொள்ளலாம்; மாற்று அமைப்பு மூலத்தின் சுருக்கமான பெயர்ச்சொல் இணைப்பை நெருக்கமாகக் காட்டுகிறது.
lexical_decisions:
- source_word: וַיּוֹשֶׁב
  choice: குடியமர்த்தினார்
  rationale: ישׁב என்பதன் ஹிஃபில் வடிவம் ‘குடியிருக்கச் செய்தார்’ என்ற காரணவினைப் பொருளைத் தருகிறது. ‘குடியமர்த்தினார்’ என்பது அந்தப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைக் குறிக்கும் எளிய வினையடை; ‘அங்கே’ என்பது நேரடியான, இயல்பான தமிழ் இணை.
- source_word: רְעֵבִים
  choice: பசியுற்றவர்களை
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் இந்தப் பெயரடை பசியால் பாதிக்கப்பட்ட மக்களைக் கூட்டாகக் குறிக்கிறது. ‘பசியுற்றவர்கள்’ என்பது பொருளை மிகைப்படுத்தாமல் தெளிவாகத் தருகிறது.
- source_word: וַיְכוֹנְנוּ
  choice: நிறுவினார்கள்
  rationale: כון என்பதன் இவ்வினைவடிவம் நிலைநிறுத்துதல் அல்லது அமைத்தல் என்ற பொருளைக் கொண்டது. நகரத்துடன் வரும் சூழலில் ‘நிறுவினார்கள்’ பொருத்தமானது.
- source_word: עִיר
  choice: ஒரு நகரத்தை
  rationale: עִיר என்பதன் வழக்கமான பொருள் ‘நகரம்’; குடியிருப்பின் அளவை ஊகித்து ‘ஊர்’ அல்லது ‘குடியேற்றம்’ எனக் குறுக்காமல் மூலச்சொல்லை நெருக்கமாகப் பின்பற்றுகிறது.
- source_word: מוֹשָׁב
  choice: குடியிருப்பதற்காக
  rationale: מוֹשָׁב என்பது குடியிருத்தல், வாழிடம் அல்லது குடியிருக்கும் இடம் ஆகிய பொருள்களைத் தருகிறது. עִיר מוֹשָׁב என்ற இணைப்பை நோக்கம் அல்லது பயன்பாட்டைக் காட்டும் இயல்பான தமிழாக இவ்வாறு வழங்குகிறது.
theological_decisions:
- issue: וַיּוֹשֶׁב என்ற ஒருமை வினையின் மறைமுக எழுவாய்
  choice: சுற்றியுள்ள சங்கீதச் சூழலிலிருந்து தொடரும் இறைவனைக் குறிக்கும் ‘அவர்’
  alternative: எழுவாய் குறிப்பிடப்படாத ‘ஒருவர் குடியமர்த்தினார்’ என்ற வாசிப்பு
  rationale: சுற்றியுள்ள வசனங்கள் ஆண்டவரின் செயல்களை விவரிப்பதால், ஒருமை வினை இயல்பாக அவரையே எழுவாயாகத் தொடர்கிறது. அதேவேளை இவ்வசனத்தில் இல்லாத இறைத் திருப்பெயரைச் சேர்க்காமல், எபிரேயத்தின் பதிலிடுபெயர் நடையைப் பாதுகாக்க ‘அவர்’ என வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் dignified நடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியமர்த்தினார்’ காரணவினைப் பொருளையும், ‘நிறுவினார்கள்’ நிலையான குடியேற்றத்தை உருவாக்கிய செயலையும் தெளிவாகக் காட்டுகின்றன. எபிரேயக் கவிதையின் இரு இணைச் செயல்கள் அரைப்புள்ளி மற்றும் வரிப்பிரிப்பால் பாதுகாக்கப்பட்டுள்ளன.
