  text: Those who go down to the sea in ships[a], doing business on great waters—
translation:
  language: ta
  text: 'கப்பல்களில் கடலுக்குச் செல்கிறவர்கள்,

    பெரும் நீர்ப்பரப்புகளில் பணியாற்றுகிறவர்கள்[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெரும் நீர்ப்பரப்புகளில் வேலை செய்கிறவர்கள்” அல்லது “பெரும் நீர்ப்பரப்புகளில் வணிகம் செய்கிறவர்கள்.” எபிரெயச் சொற்றொடர் திறந்த கடலில் செய்யப்படும் வேலை அல்லது வணிகத்தைக் குறிக்கலாம்.
    reason: מְלָאכָה என்பதன் ‘வேலை/தொழில்/வணிகம்’ என்ற பொருள் எல்லையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: יוֹרְדֵי
  choice: செல்கிறவர்கள்
  rationale: ירד என்பதன் நேரடிப் பொருள் ‘இறங்குகிறவர்கள்’ என்றாலும், கடற்பயணத்தைத் தொடங்குவதைக் குறிக்கும் எபிரெய வழக்கை நவீனத் தமிழில் இயல்பாக ‘கடலுக்குச் செல்கிறவர்கள்’ எனத் தருகிறது.
- source_word: הַיָּם
  choice: கடல்
  rationale: குறிப்பிட்ட பெயருடைய நீர்நிலையைக் காட்டாமல், பொதுவான கடற்பரப்பைக் குறிக்கிறது.
- source_word: בָּאֳנִיּוֹת
  choice: கப்பல்களில்
  rationale: ב முன்னிடைச்சொல்லின் இடம் அல்லது பயண ஊடகம் சார்ந்த பொருளையும், אֳנִיּוֹת என்பதன் பன்மையையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: עֹשֵׂי מְלָאכָה
  choice: தொழில் செய்கிறவர்கள்
  rationale: இந்தச் சொற்றொடர் வேலை, தொழில் அல்லது வணிகச் செயலைக் குறிக்கலாம். ‘தொழில் செய்கிறவர்கள்’ கடல்சார் வாழ்வாதாரச் செயலை இயல்பாகக் காட்டுவதோடு, அதை வணிகம் என்று மட்டும் குறுக்கவில்லை.
- source_word: בְּמַיִם רַבִּים
  choice: பெருங்கடலில்
  rationale: சொல்லுக்குச் சொல் ‘பல/பெரும் நீர்களில்’ என்ற கவித்துவ மரபை, திறந்த கடற்பரப்பைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்லாக வழங்குகிறது.
