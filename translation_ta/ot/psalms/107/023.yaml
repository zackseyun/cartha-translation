translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் சங்கீதத்திற்குரிய கண்ணியமான கவிநடையும் பேணப்பட்டுள்ளன. இரண்டு இணையான பங்கேற்புச் சொற்றொடர்களும் ‘-கிறவர்கள்’ அமைப்பில் தரப்பட்டுள்ளன; இறுதியிலுள்ள கோடு அடுத்த வசனத்தில் வாக்கியம் தொடர்வதை உணர்த்துகிறது.
