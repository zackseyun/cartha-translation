  yaml_path: translation/ot/psalms/107/039.yaml
  text: Then they were diminished and brought low through oppression[a], calamity, and sorrow.
translation:
  language: ta
  text: பின்பு அவர்கள் குறைந்துபோய், ஒடுக்குமுறையாலும் துன்பத்தாலும் துயரத்தாலும் தாழ்ந்துபோனார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் எண்ணிக்கையில் குறைந்து, நெருக்குதல், தீமை, துக்கம் ஆகியவற்றால் குனிந்துபோனார்கள்.”
    reason: மூலச் சொற்கள் எண்ணிக்கைக் குறைவு அல்லது பொதுவான வீழ்ச்சி, ஒடுக்குமுறை அல்லது கட்டுப்பாடு, தீமை அல்லது துன்பம், உடலாகக் குனிதல் அல்லது நிலையில் தாழ்தல் ஆகிய பொருள் நிழல்களைக் கொண்டுள்ளன.
lexical_decisions:
- source_word: וַיִּמְעֲטוּ
  choice: அவர்கள் குறைந்துபோய்
  rationale: מעט என்பதன் இவ்வடிவம் எண்ணிக்கையில் குறைவதையோ நிலையில் சிறுத்துப்போவதையோ குறிக்கலாம். ‘குறைந்துபோய்’ என்பது இந்த இரு சாத்தியங்களையும் தேவையின்றி ஒன்றாக முடிவுசெய்யாமல் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וַיָּשֹׁחוּ
  choice: தாழ்ந்துபோனார்கள்
  rationale: שׁחח என்பது குனிதல் அல்லது தாழ்த்தப்படுதல் என்ற கருத்தைக் கொண்டது. இங்கு உடல் நிலையைக் காட்டிலும் சமூக அல்லது வாழ்வியல் வீழ்ச்சியையும் உள்ளடக்குமாறு ‘தாழ்ந்துபோனார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מֵעֹצֶר
  choice: ஒடுக்குமுறையாலும்
  rationale: עֹצֶר என்பது கட்டுப்பாடு, நெருக்குதல் அல்லது ஒடுக்குதல் எனப் பொருள்படக்கூடிய அரிய சொல். சூழலில் மִן காரணத்தைக் காட்டுவதால், ஒடுக்குகிற அழுத்தத்தை இயல்பாக வெளிப்படுத்த ‘ஒடுக்குமுறையாலும்’ பயன்படுத்தப்பட்டது.
- source_word: רָעָה
  choice: துன்பத்தாலும்
  rationale: רָעָה இங்கு ஒழுக்கத் தீமையை மட்டுமல்லாமல் கேடு, இடர் அல்லது துயரான சூழ்நிலையையும் குறிக்கலாம். ‘துன்பம்’ இந்த எதிர்மறை அனுபவத்தை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: וְיָגוֹן
  choice: துயரத்தாலும்
  rationale: יָגוֹן ஆழ்ந்த வருத்தம் அல்லது துக்கத்தைக் குறிக்கிறது. ‘துயரம்’ கவிதைநயமும் பொதுவான புரிதலும் கொண்ட சொல்.
