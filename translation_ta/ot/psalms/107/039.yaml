  naturalness: The sentence is fluent modern standard Tamil and retains an appropriately dignified poetic register. The paired verbs “குறைந்துபோய் ... தாழ்ந்துபோனார்கள்” and repeated instrumental forms naturally convey the verse’s reversal and causal triad.
  terminology: “ஒடுக்குமுறை,” “துன்பம்,” and “துயரம்” distinguish external pressure, adverse circumstance, and emotional grief effectively. The footnote responsibly preserves the possibilities of numerical reduction, constraint, evil/adversity, and bowed posture/status.
