  text: כָּל אֹ֭כֶל תְּתַעֵ֣ב נַפְשָׁ֑/ם וַ֝/יַּגִּ֗יעוּ עַד שַׁ֥עֲרֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/018.yaml
  text: Their soul loathed all food[a], and they drew near to the gates of death.
translation:
  language: ta
  text: அவர்களுடைய உள்ளம் எல்லா உணவையும் அருவருத்தது[a]; அவர்கள் மரணத்தின் வாசல்கள்வரை வந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய பசி உணர்வு எல்லா உணவையும் அருவருத்தது”; எபிரெயச் சொல் (נַפְשָׁם) சூழலுக்கேற்ப அவர்களுடைய உட்சுயம், உயிர் அல்லது பசி உணர்வைக் குறிக்கலாம். எளிமையாக, “அவர்கள் எல்லா உணவையும் அருவருத்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֹכֶל
  choice: எல்லா உணவையும்
  rationale: כָּל உடன் אֹכֶל வருவதால் உணவு முழுவதையும் பொதுவாகக் குறிக்கும் தொகுப்புப் பொருள் கிடைக்கிறது; இயல்பான நவீனத் தமிழில் இதை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: תְּתַעֵב
  choice: அருவருத்தது
  rationale: תעב என்பதன் பியேல் வடிவம் கடுமையான வெறுப்பையும் குமட்டலுடன் கூடிய ஒதுக்குதலையும் குறிக்கிறது; ‘அருவருத்தது’ அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: נַפְשָׁם
  choice: அவர்களுடைய உள்ளம்
  rationale: נֶפֶשׁ இங்கு மனிதரின் உட்பட்ட சுயம், உயிர் அல்லது பசி உணர்வு ஆகிய பொருள் நிழல்களைக் கொண்டிருக்கலாம். ‘உள்ளம்’ எபிரெய உருவகத்தை ஓரளவு காத்து, தமிழில் ‘ஆத்துமா உணவை அருவருத்தது’ என்ற இயல்பற்ற சொல்லாட்சியைத் தவிர்க்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיַּגִּיעוּ עַד
  choice: நெருங்கிவிட்டார்கள்
  rationale: נגע என்பதன் ஹிஃபில் வடிவமும் עַד என்பதும் ஓர் எல்லையை எட்டுமளவுக்கு வந்ததைச் சுட்டுகின்றன. சூழலில் அவர்கள் மரணத்தின் விளிம்பை அடைந்துவிட்ட நிலையை ‘நெருங்கிவிட்டார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שַׁעֲרֵי מָוֶת
  choice: மரணத்தின் வாசல்கள்
  rationale: இது எழுத்துப்படி ‘மரணத்தின் வாசல்கள்’; மரணத்தின் நுழைவாயில் அல்லது விளிம்பு என்ற எபிரெயக் கவிதை உருவகத்தைத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: கடுமையான நோயின் சூழலில் נֶפֶשׁ என்பதன் மொழிபெயர்ப்பு
  choice: அவர்களுடைய உள்ளம்
  alternative: அவர்களுடைய பசி உணர்வு; அவர்கள்
  rationale: இந்த வசனம் உடல் நோயைப் பற்றியதாயினும், எபிரெயம் ஒரு சாதாரணப் பதிற்பெயருக்குப் பதிலாக נֶפֶשׁ என்பதைப் பயன்படுத்துகிறது. ‘உள்ளம்’ மனிதரின் முழு உட்சுயத்தைக் குறிக்கும் நுணுக்கத்தைப் பாதுகாக்கிறது; உணவைப் பற்றிய சூழலில் ‘பசி உணர்வு’ என்ற சாத்தியமான பொருளையும் அடிக்குறிப்பு மறைக்காமல் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘மரணத்தின் வாசல்கள்’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது; ‘உள்ளம்’ என்பது இயல்பான தமிழையும் נֶפֶשׁ என்பதன் பொருள் விரிவையும் சமநிலைப்படுத்துகிறது.
