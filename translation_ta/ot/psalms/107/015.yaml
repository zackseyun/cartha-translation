source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: ta
  text: அவர்கள் யாவேக்கு[a] அவருடைய மாறாத அன்பிற்காகவும், மனிதர்களுக்கு அவர் செய்த அதிசயச் செயல்களுக்காகவும்[b] நன்றி செலுத்தட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“யாவே” என்பது எபிரெய இறைப் பெயர் יהוה-வின் ஒலிபெயர்ப்பு; மாற்று வடிவம்: “யெகோவா.”'
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், “மனிதரின் பிள்ளைகளுக்கு”; மாற்றாக, “மனிதகுலத்துக்கு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: அவர்கள் நன்றி செலுத்தட்டும்
  rationale: ידה என்பதன் ஹிஃபில் பன்மை வடிவம் இங்கு வேண்டுகோள் அல்லது அறைகூவல் வலிமையைக் கொண்டுள்ளது. சங்கீதத்தின் திரும்பவரும் இச்சொற்றொடரில் ‘நன்றி செலுத்தட்டும்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: לְ முன்னொட்டு நன்றியின் மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: חַסְדּוֹ
  choice: அவருடைய மாறாத அன்பு
  rationale: חסד அன்பு, விசுவாசம், நிலைத்தன்மை, இரக்கம் ஆகிய தொடர்புடைய கருத்துகளைத் தாங்குகிறது. ‘மாறாத அன்பு’ அதன் நிலைத்த அன்புறுதியை எளிய நவீன தமிழில் வெளிப்படுத்துகிறது; ‘உடன்படிக்கை அன்பு’ என்று பொருளை அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: וְנִפְלְאוֹתָיו
  choice: அவர் செய்த அதிசயச் செயல்கள்
  rationale: פלא வேரிலிருந்து வரும் இப்பன்மைப் பெயர்ச்சொல் வியப்பூட்டும் அசாதாரண செயல்களைக் குறிக்கிறது. தமிழில் செயற்பொருளைத் தெளிவாக்க ‘அவர் செய்த அதிசயச் செயல்கள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִבְנֵי אָדָם
  choice: மனிதர்களுக்காக
  rationale: சொல்லுக்குச் சொல் ‘மனிதனின் பிள்ளைகளுக்கு’ என்றாலும், எபிரெய வழக்கில் இது மனிதகுல உறுப்பினர்களைக் குறிக்கிறது. இங்கு அவர்களுக்கு நன்மையாகச் செய்யப்பட்ட செயல்கள் என்பதால் இயல்பான தமிழில் ‘மனிதர்களுக்காக’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, நான்கெழுத்து இறைப் பெயரே உள்ளது. அதை ‘கர்த்தர்’ என்று மாற்றாமல் தனிப்பெயராகப் பாதுகாக்கிறது; தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம் தேர்ந்தெடுக்கப்பட்டது. மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: חסד என்பதன் பொருள் பரப்பு
  choice: மாறாத அன்பு
  alternative: பேரன்பு; உடன்படிக்கை அன்பு; இரக்கம்
  rationale: இச்சொல் அன்பும் நிலைத்த விசுவாசமும் சேர்ந்த பொருள் பரப்பைக் கொண்டுள்ளது. ‘மாறாத அன்பு’ இதைச் சுருக்கமாகக் காக்கிறது; குறிப்பிட்ட ஓர் இறையியல் விளக்கத்தை மட்டும் திணிக்கவில்லை.
- issue: בני אדם என்ற பிரதிநிதித்துவ ஆண்பால் வழக்கு
  choice: மனிதர்கள்
  alternative: மனிதனின் பிள்ளைகள்; மனிதகுலம்
  rationale: இது ஆண்களை மட்டும் அல்லாமல் மனிதர்களைப் பொதுவாகக் குறிக்கும் எபிரெய வழக்கு. நவீன தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் ‘மனிதர்கள்’ என வழங்கப்பட்டுள்ளது; சொற்படிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகருக்குப் புரியும் dignified சங்கீத நடையில் அமைக்கப்பட்டுள்ளது. எபிரெய வசனத்தின் அறைகூவல் வலிமை ‘செலுத்தட்டும்’ என்பதால் காக்கப்படுகிறது. [a], [b] குறிகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடப்பட்டுள்ளன.
