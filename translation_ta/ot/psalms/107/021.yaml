  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/021.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: ta
  text: அவர்கள் யாவேக்கு நன்றி செலுத்தட்டும்—அவரது மாறாத அன்புக்காகவும், மனிதர்களுக்காக[a] அவர் செய்த வியத்தகு செயல்களுக்காகவும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “மனிதனின் பிள்ளைகளுக்கு.” இது மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கும் எபிரெய மரபுத்தொடர். “மனிதகுலத்திற்காக” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
  - marker: b
    text: “அவரது அதிசயங்களுக்காகவும்” அல்லது “அவரது அற்புதமான செயல்களுக்காகவும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: அவர்கள் … நன்றி செலுத்தட்டும்
  rationale: இச்சங்கீதத்தில் மீண்டும் வரும் இந்த வினை, விடுதலைக்கு மறுமொழியாக நன்றி கூறுதல் அல்லது புகழ்தல் என்ற பொருளைக் கொண்டது; இங்கு ‘நன்றி செலுத்தட்டும்’ என்பது சூழலுக்கு மிகவும் பொருத்தமானது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ முன்னொட்டு நன்றியின் பெறுநரைக் குறிக்கிறது; יהוה என்ற இறைப் பெயர் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: חַסְדּוֹ
  choice: அவரது மாறாத அன்பு
  rationale: חסד அன்பு, விசுவாசம், நிலைத்த நன்மை ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘மாறாத அன்பு’ அதன் உறுதியையும் அன்புத் தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְנִפְלְאוֹתָיו
  choice: அவர் செய்த வியத்தகு செயல்கள்
  rationale: נפלאות வியப்பை உண்டாக்கும் அசாதாரண செயல்களைக் குறிக்கிறது. ‘வியத்தகு செயல்கள்’ என்பது வெறும் அபூர்வ நிகழ்வுகள் என்பதைக் காட்டிலும் தேவனுடைய செயல்களைத் தெளிவாகக் குறிக்கிறது.
- source_word: לִבְנֵי אָדָם
  choice: மனிதர்களுக்காக
  rationale: சொல்லுக்கு சொல் வடிவம் ‘மனிதனின் பிள்ளைகளுக்கு’ என்பதாகும்; இது எல்லா மனிதர்களையும் பொதுவாகக் குறிக்கும் எபிரெய மரபுத்தொடர். இயல்பான நவீன தமிழில் ‘மனிதர்களுக்காக’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நான்கு எழுத்துகளாலான தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் இயல்பைப் பாதுகாக்கிறது.
- issue: בני אדם என்ற பொதுமனித மரபுத்தொடர்
  choice: மனிதர்கள்
  alternative: மனிதனின் பிள்ளைகள் / மனிதகுலம்
  rationale: இலக்கண வடிவம் ஆண்பால் சார்ந்திருந்தாலும், இங்கு அது எல்லா மனிதர்களையும் பொதுவாகக் குறிக்கிறது. ‘மனிதர்கள்’ என்பது அந்தப் பொது நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; சொல்லுக்கு சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: לִבְנֵי אָדָם என்பதில் לְ-இன் தொடர்பு
  choice: வியத்தகு செயல்கள் மனிதர்களுக்காகச் செய்யப்பட்டவை
  alternative: வியத்தகு செயல்கள் மனிதர்களிடம் நிகழ்த்தப்பட்டவை
  rationale: לְ முன்னொட்டு மனிதர்களை அந்த வியத்தகு செயல்களின் பயனாளிகளாகவோ இலக்காகவோ காட்டலாம். ‘மனிதர்களுக்காக’ என்பது இயல்பான தமிழில் அந்த உறவைத் தருகிறது; ஆனால் ‘மனிதர்களிடம்’ என்ற பொருள் நிழலும் சாத்தியம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் வழிபாட்டுக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. கட்டளை/விருப்ப ஏவல் நிழலை ‘செலுத்தட்டும்’ காக்கிறது; எபிரெய இணை அமைப்பு நீண்ட கோட்டால் தெளிவாக்கப்பட்டுள்ளது.
