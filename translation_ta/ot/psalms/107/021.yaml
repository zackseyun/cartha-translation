  source_fidelity: எபிரெய மூலத்தின் יוֹדוּ என்ற விருப்ப/ஏவல் நிழல் ‘நன்றி செலுத்தட்டும்’ என்பதில் துல்லியமாக உள்ளது. לַיהוָה, חַסְדּוֹ, וְנִפְלְאוֹתָיו, לִבְנֵי אָדָם ஆகியவை முறையே ‘யாவேக்கு,’ ‘அவரது மாறாத அன்புக்காகவும்,’ ‘அவர் செய்த வியத்தகு செயல்களுக்காகவும்,’ ‘மனிதர்களுக்காக’ எனப் பொருளும் தொடரியல் உறவும் காக்கப்பட்டுள்ளன. ‘மனிதர்களுக்காக’ என்பது לְ-இன் பயனாளர்/நோக்குநர் நிழலை இயல்பாகத் தருகிறது.
