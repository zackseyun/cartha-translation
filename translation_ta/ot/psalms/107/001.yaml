  text: הֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: ta
  text: யாவேவுக்கு[a] நன்றி செலுத்துங்கள்; ஏனெனில் அவர் நல்லவர்; அவரது மாறாத அன்பு[b] என்றென்றும் நிலைத்திருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: יהוה என்ற எபிரெய இறைப் பெயரின் ஒலிபெயர்ப்பு; இதை ‘கர்த்தர்’ என்றும் மொழிபெயர்ப்பார்கள்.
    reason: alternative_reading
  - marker: b
    text: ‘மாறாத அன்பு’ என்பதற்கான எபிரெயச் சொல் חֶסֶד; ‘உடன்படிக்கை உண்மைத்தன்மை’ அல்லது ‘இரக்கம்’ என்ற பொருள் நுணுக்கங்களும் இதில் அடங்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹדוּ
  choice: நன்றி செலுத்துங்கள்
  rationale: ידה என்பதன் ஹிஃபீல் பன்மை ஏவல் வடிவம், சங்கீத நன்றியறிதல் சூழலில் நன்றி செலுத்தும்படி விடுக்கும் அழைப்பைக் குறிக்கிறது.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: לְ முன்னொட்டு செயல் யாரை நோக்கியது என்பதைக் காட்டுகிறது; יהוה என்ற இறைப் பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי טוֹב
  choice: ஏனெனில் அவர் நல்லவர்
  rationale: כִּי காரணத்தை அறிமுகப்படுத்துகிறது; எபிரெய மொழியில் வெளிப்படையாக இல்லாத இணைப்பு வினை, இயல்பான தமிழுக்காக ‘அவர் நல்லவர்’ என வழங்கப்பட்டுள்ளது.
- source_word: לְעוֹלָם
  choice: என்றென்றும் நிலைத்திருக்கிறது
  rationale: ‘என்றென்றும்’ என்ற காலநீடிப்பை, חֶסֶד உடன் இயல்பான தமிழில் கூற ‘நிலைத்திருக்கிறது’ என வெளிப்படுத்துகிறது.
- source_word: חַסְדּוֹ
  choice: அவரது மாறாத அன்பு
  rationale: חֶסֶד என்பதில் அன்பு, விசுவாசமான பற்றுறுதி, இரக்கம் ஆகிய நுணுக்கங்கள் உள்ளன; ‘மாறாத அன்பு’ அதன் அன்பையும் நீடித்த உண்மைத்தன்மையையும் மிகையாகக் குறுக்காமல் எடுத்துரைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பட்டப்பெயராக மாற்றாமல் அதன் பரவலாக ஏற்கப்பட்ட ஒலிப்பைத் தமிழில் தருகிறது.
- issue: חֶסֶד என்பதன் பொருள்
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கை உண்மைத்தன்மை / இரக்கம்
  rationale: இந்தச் சொல் அன்பையும் பற்றுறுதியையும் உள்ளடக்குகிறது; ஒரே கருத்தாகக் குறுக்காமல் அந்த இறையியல் செறிவை ‘மாறாத அன்பு’ பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதில் புரியும் அதேவேளையில் சங்கீதத்தின் வழிபாட்டு அழைப்புக்குரிய கண்ணியத்தைப் பேணும் நடை. காரணம் கூறும் இரு כִּי கூறுகளும் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
