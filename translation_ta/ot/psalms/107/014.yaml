  text: יֽ֭וֹצִיאֵ/ם מֵ/חֹ֣שֶׁךְ וְ/צַלְמָ֑וֶת וּ/מוֹסְר֖וֹתֵי/הֶ֣ם יְנַתֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/014.yaml
  text: He brought them out from darkness and the shadow of death[b][a], and he tore apart their bonds.
translation:
  language: ta
  text: அவர்களை இருளிலிருந்தும் மரண நிழலிலிருந்தும்[a] வெளியே கொண்டுவந்தார்; அவர்களுடைய கட்டுகளை அறுத்தெறிந்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காரிருள்.” எபிரெயச் சொல் மரண நிழலையோ ஆழ்ந்த இருளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצִיאֵם
  choice: அவர்களை வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல்/வெளியே கொண்டுவருதல்’ என்று பொருள்படும். சங்கீதத்தின் நன்றியறிதல் வருணனைக்கு இறந்தகால நடை இயல்பாக உள்ளது.
- source_word: מֵחֹשֶׁךְ
  choice: இருளிலிருந்து
  rationale: חֹשֶׁךְ என்பதன் நேரடியான பொருள் ‘இருள்’; מִן முன்னிடைச்சொல்லின் பிரிவுப் பொருளை ‘இலிருந்து’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: וְצַלְמָוֶת
  choice: மரண நிழலிலிருந்து
  rationale: צַלְמָוֶת என்பது ‘மரண நிழல்’ என்றும் ‘காரிருள்/ஆழ்ந்த இருள்’ என்றும் புரிந்துகொள்ளப்படலாம். மரண அபாயத்தை உணர்த்தும் பாரம்பரியமான, சொல்லியல் அடிப்படையுள்ள வடிவம் முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וּמוֹסְרוֹתֵיהֶם
  choice: அவர்களுடைய கட்டுகளை
  rationale: מוֹסְרוֹת என்பது கட்டுகள், விலங்குகள் அல்லது பிணைப்புகள் என்பதைக் குறிக்கிறது. ‘கட்டுகள்’ என்பது சிறையிருப்பு உருவகத்திற்குப் பொருந்தும் இயல்பான பொதுத்தமிழ்ச் சொல்.
- source_word: יְנַתֵּק
  choice: அறுத்தெறிந்தார்
  rationale: נתק என்பதன் பியேல் வடிவம் வலுக்கட்டாயமாகப் பிரித்தல், அறுத்தல் அல்லது பிய்த்தெறிதல் என்ற தீவிரத்தைத் தருகிறது. ‘அறுத்தெறிந்தார்’ விடுதலையின் வலிமையை இயல்பான தமிழில் காட்டுகிறது.
theological_decisions:
- issue: צַלְמָוֶת என்பதன் பொருள்
  choice: மரண நிழல்
  alternative: காரிருள்
  rationale: இச்சொல் மரண ஆபத்தை உணர்த்தும் ‘மரண நிழல்’ அல்லது மிக ஆழ்ந்த இருளைக் குறிக்கும் ‘காரிருள்’ என இருவகையில் புரிந்துகொள்ளப்படலாம். ஒரு பொருளை மட்டும் உறுதிப்படுத்தாமல் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இருள்/மரண நிழல் என்ற இணை உருவகமும் கட்டுகளை வலுக்கட்டாயமாக நீக்கும் செயலும் பாதுகாக்கப்பட்டுள்ளன.
