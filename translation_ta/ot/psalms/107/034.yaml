lexical_decisions:
- source_word: אֶרֶץ פְּרִי
  choice: செழிப்பான நிலம்
  rationale: சொல்லர்த்தமாக ‘கனியின் நிலம்’ என்றாலும், எபிரெயக் கட்டமைப்பு விளைச்சல் தரும் நிலத்தைக் குறிக்கிறது; ‘செழிப்பான நிலம்’ இயல்பான நவீனத் தமிழில் அந்த வேளாண் பொருளைத் தக்கவைக்கிறது.
- source_word: לִמְלֵחָה
  choice: உவர் நிலமாக
  rationale: לְ மாற்றத்தின் விளைவைக் குறிக்கிறது. מְלֵחָה உப்புத்தன்மை கொண்ட, விளைச்சலற்ற நிலையைச் சுட்டுகிறது; ‘உவர் நிலம்’ உப்பு என்ற நேரடிப் படிமத்தையும் மலட்டுத்தன்மை என்ற உட்கருத்தையும் காக்கிறது.
- source_word: מֵרָעַת
  choice: தீமையினால்
  rationale: מִן இங்கு காரணத்தைக் குறிக்கிறது; רָעָה என்பதன் ஒழுக்கவியல் பொருளான ‘தீமை’யையும் காரணத் தொடர்பையும் சுருக்கமாகவும் தெளிவாகவும் அளிக்கிறது.
- source_word: יֹשְׁבֵי בָהּ
  choice: அதில் குடியிருந்தவர்கள்
  rationale: ישב வினையின் பங்கேற்பு வடிவிலுள்ள ‘அதில் வசிப்பவர்கள்’ என்ற செயற்பண்பை இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: நிலம் பாழாவதற்கான காரணம்
  choice: குடியிருந்தவர்களின் தீமையே செழிப்பான நிலம் உவர் நிலமாக மாற்றப்படுவதற்குக் காரணம் என வெளிப்படையாகக் கூறுதல்
  alternative: இதை ஒழுக்கக் காரணமற்ற சுற்றுச்சூழல் அல்லது வரலாற்று மாற்றமாக மட்டும் கூறுதல்
  rationale: מֵרָעַת יֹשְׁבֵי בָהּ என்ற எபிரெயத் தொடர் மாற்றத்தையும் குடிகளின் தீமையையும் நேரடியாகக் காரணத் தொடர்பில் இணைக்கிறது; அந்த நியாயத்தீர்ப்பு சார்ந்த பதற்றத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடை. முந்தைய வசனங்களில் வரும் இறைச் செயற்பாட்டைத் தொடரும் மறைநிலை எழுவாய் காரணமாக ‘ஆக்கினார்’ பயன்படுத்தப்பட்டுள்ளது.
