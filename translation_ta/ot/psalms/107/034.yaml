  text: a fruitful land into a salt waste[a], because of the evil of those who dwell in it.
translation:
  language: ta
  text: அதில் குடியிருப்பவர்களின் தீமையினால், விளைச்சல் மிகுந்த நிலத்தை உவர் நிலமாக்கினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உவர்ப்பாக” அல்லது “உப்புத்தன்மை கொண்ட நிலமாக”; எபிரெயப் படிமம் விளைச்சலற்ற, பாழான நிலப்பகுதியைக் குறிப்பதாக இருக்கலாம்.
