source:
  edition: WLC
  text: הֵ֣מָּה רָ֭אוּ מַעֲשֵׂ֣י יְהוָ֑ה וְ֝/נִפְלְאוֹתָ֗י/ו בִּ/מְצוּלָֽה׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/024.yaml
  text: They saw the works of Yahweh[a], and his wonders in the deep.
translation:
  language: ta
  text: அவர்கள் யாவேயின் செயல்களையும், ஆழ்கடலில்[a] அவருடைய அற்புதங்களையும் கண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடலின் ஆழங்களில்.” இங்கு வரும் எபிரெயச் சொல் ஆழமான நீரைக் குறிக்கிறது; சங்கீதத்தின் கடற்பயணச் சூழலில் அது கடலின் ஆழத்தைக் குறிப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: அவர்கள்
  rationale: தனித்து நிற்கும் மூன்றாம் நபர் ஆண்பால் பன்மைப் பெயர்ச்சொல் வலியுறுத்தலைக் கொண்டுள்ளது; நவீன தமிழில் வெளிப்படையான எழுவாயான ‘அவர்கள்’ இயல்பாக இதை எடுத்துரைக்கிறது.
- source_word: רָאוּ
  choice: கண்டார்கள்
  rationale: ראה என்பதன் Qal perfect மூன்றாம் நபர் பன்மை வடிவம்; கடற்பயணிகள் அனுபவித்ததை விவரிக்கும் இறந்தகாலச் செயலை இயல்பாகக் குறிக்கிறது.
- source_word: מַעֲשֵׂי
  choice: செயல்களையும்
  rationale: מַעֲשֶׂה என்பதன் பன்மை இணைப்பு வடிவம். ‘செயல்கள்’ என்பது யாவேயின் வல்லமையான கிரியைகளைப் பொதுவாகவும் தெளிவாகவும் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְנִפְלְאוֹתָיו
  choice: அவருடைய அற்புதங்களையும்
  rationale: פלא சார்ந்த பன்மைப் பெயர்ச்சொல்லும் மூன்றாம் நபர் ஒருமை உடைமைப் பின்னொட்டும் தெளிவாகப் பாதுகாக்கப்படுகின்றன; ‘அற்புதங்கள்’ வியப்பூட்டும் தெய்வீகச் செயல்களை இயல்பாகக் குறிக்கிறது.
- source_word: בִּמְצוּלָה
  choice: ஆழ்கடலில்
  rationale: இச்சொல் ஆழத்தைக், குறிப்பாகக் கடலின் ஆழமான நீரை, குறிக்கிறது. சங்கீதத்தின் கடற்பயணச் சூழலில் ‘ஆழ்கடலில்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவ கண்ணியத்தையும் பொதுவாசகர்களுக்கான தெளிவையும் இணைக்கும் நடை. ‘ஆழ்கடலில்’ என்ற சொல் கடற்பயணச் சூழலை வெளிப்படுத்துகிறது; அதே நேரத்தில் அடிக்குறிப்பு எபிரெயச் சொல்லின் பன்மை சார்ந்த மாற்று வெளிப்பாட்டைத் தருகிறது.
