lexical_decisions:
- source_word: וַיִּזְרְעוּ שָׂדוֹת
  choice: வயல்களில் விதைத்து
  rationale: זָרַע என்பதன் வழக்கமான வேளாண்மைச் செயலை ‘விதைத்து’ நேரடியாகத் தருகிறது. எபிரெயத்தில் ‘வயல்களை விதைத்தார்கள்’ என்று இருந்தாலும், இயல்பான நவீன தமிழில் இடப்பொருளைக் காட்ட ‘வயல்களில்’ பயன்படுத்தப்பட்டது.
- source_word: וַיִּטְּעוּ כְרָמִים
  choice: திராட்சைத்தோட்டங்களை நட்டார்கள்
  rationale: נָטַע என்பது நடுதலையும், כְּרָמִים என்பது தனித்தனி திராட்சைக்கொடிகளை அல்லாமல் திராட்சைத்தோட்டங்களையும் குறிக்கிறது; ஆகவே சொற்பொருளும் வேளாண்மைச் சூழலும் காக்கப்படுகின்றன.
- source_word: וַיַּעֲשׂוּ פְּרִי תְבוּאָה
  choice: விளைச்சலின் பலனை விளைவித்தார்கள்
  rationale: עָשָׂה என்பதன் ‘உண்டாக்கு/விளைவி’ என்ற கருத்தையும், פְּרִי תְבוּאָה என்பதிலுள்ள ‘விளைச்சலின் கனி/பலன்’ என்ற அமைப்பையும் இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
