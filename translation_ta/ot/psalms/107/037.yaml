  text: They sowed fields and planted vineyards[a], and produced the fruit of the harvest.
translation:
  language: ta
  text: அவர்கள் வயல்களில் விதைத்தார்கள், திராட்சைத்தோட்டங்களை நட்டார்கள், விளைச்சலின் கனியை உண்டாக்கினார்கள்.[a]
  philosophy: optimal-equivalence
