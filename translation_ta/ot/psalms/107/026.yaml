translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். கடற்புயலின் மேலேற்றம்–கீழிறக்கம் என்ற கவித்துவ எதிரிணை தெளிவாக வைக்கப்பட்டுள்ளது; ‘வானளவு’ என்பது சொல்லுக்குச் சொல் பன்மையை விட இயல்பான தமிழ்க் காட்சியை அளிக்கிறது. ‘உயிர் கரைந்துபோனது’ மூலத்தின் உருவகத்தையும் நֶפֶשׁ என்ற சொல்லின் பொருள் நெகிழ்வையும் பேணுகிறது.
