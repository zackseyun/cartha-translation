  yaml_path: translation/ot/psalms/107/026.yaml
  text: They rose up to the heavens; they went down to the depths[a]. Their soul melted away in distress.
translation:
  language: ta
  text: அவர்கள் வானங்கள் வரை ஏறினார்கள்; ஆழங்களுக்கு இறங்கினார்கள். துன்பத்தில் அவர்களுடைய உள்ளம்[a] உருகிப்போனது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுடைய ஆன்மா,” “அவர்களுடைய உயிர்,” அல்லது “அவர்களே” என்றும் மொழிபெயர்க்கலாம். נֶפֶשׁ என்பது ‘ஆன்மா,’ ‘உயிர்,’ ‘தான்/தாமே,’ அல்லது ‘உள்ளார்ந்த நபர்’ என்று பொருள்படலாம். “துன்பத்தில்” என்பதற்கு “தொல்லையில்” அல்லது “பேரிடரில்” என்றும் மொழிபெயர்க்கலாம்; רָעָה என்பது தொல்லை அல்லது பேரிடரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלוּ
  choice: உயர்ந்தார்கள்
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தை இயல்பான தமிழில் தருகிறது; புயலில் அலைகளோடு மேலெழும் பயணிகளைக் குறிக்கும் கவித்துவக் காட்சியைத் தக்கவைக்கிறது.
- source_word: שָׁמַיִם
  choice: வானளவு
  rationale: எபிரேய மொழியில் உள்ள ‘வானங்கள்’ என்ற உயரக் காட்சியை, தமிழில் இயல்பாகவும் மிகுந்த உயரத்தை உணர்த்தும் வகையிலும் தருகிறது.
- source_word: יֵרְדוּ
  choice: இறங்கினார்கள்
  rationale: ירד என்பதன் கீழ்நோக்கிய இயக்கத்தை நேரடியாகத் தருவதோடு, ‘உயர்ந்தார்கள்’ என்பதற்கு எதிரிணையாக அமைகிறது.
- source_word: תְהוֹמוֹת
  choice: ஆழங்களுக்குள்
  rationale: תְּהוֹם என்பதன் பன்மை வடிவத்தையும் புயற்கடலின் ஆழமான பள்ளங்களையும் வெளிப்படுத்துகிறது.
- source_word: נַפְשָׁם
  choice: அவர்களுடைய உயிர்
  rationale: נֶפֶשׁ என்பது உயிர், ஆன்மா, தம்மையே அல்லது உள்ளார்ந்த நபரைச் சுட்டலாம். இங்கு பேரிடரால் உள்ளம் நிலைகுலைவதை ‘உயிர்’ இயல்பாகக் காட்டுகிறது; சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בְּרָעָה
  choice: துன்பத்தில்
  rationale: இந்தப் புயல் சூழலில் רָעָה அறநெறித் தீமையை அல்ல, நெருக்கடி அல்லது பேரிடரால் உண்டான துன்பத்தைக் குறிக்கிறது.
- source_word: תִּתְמוֹגָג
  choice: கரைந்துபோனது
  rationale: מוג வேரிலிருந்து வரும் வடிவம் உருகுதல் அல்லது உள்ளார்ந்து சிதைந்துபோதல் என்ற உருவகத்தைத் தருகிறது; ‘கரைந்துபோனது’ அந்தக் கவித்துவ வலிமையைப் பேணுகிறது.
