revisions:
- from: அப்போது தங்கள் நெருக்கடியில் அவர்கள் யெகோவாவை நோக்கிக் கூக்குரலிட்டார்கள்; அவர்களுடைய பல்வேறு துயரங்களிலிருந்து[a] அவர் அவர்களை விடுவித்தார்.
  to: அப்போது அவர்கள் தங்கள் நெருக்கடியில் யாவேயை நோக்கிக் கூக்குரலிட்டார்கள்; அவர் அவர்களை அவர்களுடைய இடுக்கண்களிலிருந்து[a] விடுவித்தார்.
  rationale: The revision aligns the divine name with the POB’s ‘Yahweh’ policy by using ‘யாவே.’ It removes the interpretive addition ‘பல்வேறு,’ while preserving the Hebrew plural through ‘இடுக்கண்கள்.’ The revised wording retains the sequential force, urgent appeal, singular collective trouble, and divine deliverance of the Hebrew text.
