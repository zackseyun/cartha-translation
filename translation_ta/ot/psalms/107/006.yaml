  yaml_path: translation/ot/psalms/107/006.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he delivered them from their distresses.
translation:
  language: ta
  text: அப்போது அவர்கள் தங்கள் நெருக்கடியில் யாவேயை நோக்கிக் கூக்குரலிட்டார்கள்; அவர் அவர்களை அவர்களுடைய இடுக்கண்களிலிருந்து[a] விடுவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவர்களுடைய நெருக்கடிகளிலிருந்து” அல்லது “அவர்களுடைய துயரங்களிலிருந்து” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பலவினையில் உள்ளது; அது பல துன்பநிலைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: அப்போது ... கூக்குரலிட்டார்கள்
  rationale: צעק என்பது நெருக்கடியின்போது எழுப்பப்படும் அவசரமான உதவிக் கூக்குரலைக் குறிக்கிறது. தொடக்க வாவ் தொடர்ச்சியை இயல்பான தமிழில் “அப்போது” என வெளிப்படுத்துகிறது.
- source_word: אֶל־יְהוָה
  choice: யெகோவாவை நோக்கி
  rationale: אֶל திசை அல்லது நோக்கைச் சுட்டுகிறது. יהוה என்ற தனிப்பெயரைத் தமிழில் பரவலாக அறியப்பட்ட “யெகோவா” என ஒலிபெயர்த்து, ஒரு பட்டமாக மாற்றாமல் வைத்திருக்கிறது.
- source_word: בַּצַּר לָהֶם
  choice: தங்கள் நெருக்கடியில்
  rationale: צַר இங்கு இடுக்கண் அல்லது நெருக்கடியான நிலையைக் குறிக்கிறது; எபிரெய ஒருமையின் கூட்டு உணர்வைத் தமிழ் ஒருமை இயல்பாகத் தக்கவைக்கிறது.
- source_word: מִמְּצוּקוֹתֵיהֶם
  choice: அவர்களுடைய பல்வேறு துயரங்களிலிருந்து
  rationale: מְצוּקוֹתֵיהֶם என்பது பலவினையாக இருந்து பலவகையான அழுத்தங்களையும் கடும் இடுக்கண்களையும் குறிக்கக்கூடும். “பல்வேறு” என்பது அந்தப் பலவினை வலியுறுத்தலை வாசகருக்குத் தெளிவாக்குகிறது.
- source_word: יַצִּילֵם
  choice: அவர் அவர்களை விடுவித்தார்
  rationale: נצל என்பதன் ஹிப்ஃபீல் வடிவம் ஆபத்திலிருந்து மீட்பது அல்லது விடுவிப்பதைக் குறிக்கிறது. கவிதைநடைச் சம்பவத் தொடருக்கு இறந்தகாலம் பொருந்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பட்டமல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரே உள்ளது. தமிழில் நீண்டகாலமாகப் பரவலாக அறியப்பட்ட “யெகோவா” என்பதைப் பயன்படுத்துவது சாதாரண வாசகர்களுக்கு அடையாளம் காண எளிது; “யாவே” என்பது மூல உச்சரிப்பை மீளமைக்க முயலும் ஏற்ற மாற்று.
- issue: צַר மற்றும் מְצוּקוֹת என்ற இணைச் சொற்களின் வேறுபாடு
  choice: நெருக்கடி / பல்வேறு துயரங்கள்
  alternative: இடுக்கண் / நெருக்கடிகள்
  rationale: முதல் சொல் ஒருமையாகவும் இரண்டாவது சொல் பலவினையாகவும் இருப்பதையும், இரண்டாவது அரையடியில் தீவிரமும் பல்வகைத் தன்மையும் இருப்பதையும் மொழிபெயர்ப்பு தக்கவைக்கிறது; அவற்றை ஒரே தமிழ்ச் சொல்லால் சமப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையைப் பயன்படுத்தியுள்ளது. “கூக்குரலிட்டார்கள்” அவசர வேண்டுதலை வெளிப்படுத்துகிறது; “விடுவித்தார்” இயல்பான வேதாகமக் கண்ணிய நடையைத் தக்கவைக்கிறது.
