  register: நவீனத் தரமான, கண்ணியமான கவித்துவத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அலைந்து திரிந்தார்கள்’ என்பது உடல் அலைச்சலையும் திசையின்மையையும் தெரிவிக்கிறது; ஒழுக்க அல்லது ஆன்மீக வழிதவறலை உரையில் திணிக்கவில்லை. எபிரெயச் சொற்றொடரின் சாத்தியமான இலக்கணத் தெளிவின்மையை மிகைப்படுத்தாமல் ‘பாழ்நிலப் பாதையில்’ எனச் செறிவாக மொழிபெயர்க்கப்பட்டுள்ளது.
