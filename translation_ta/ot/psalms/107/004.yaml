  text: תָּע֣וּ בַ֭/מִּדְבָּר בִּ/ישִׁימ֣וֹן דָּ֑רֶךְ עִ֥יר מ֝וֹשָׁ֗ב לֹ֣א מָצָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/004.yaml
  text: They wandered in the wilderness[a], in a desolate way; they found no city to dwell in.
translation:
  language: ta
  text: அவர்கள் வனாந்தரத்தில்[a], பாழ்நிலப் பாதையில் அலைந்து திரிந்தார்கள்; குடியிருக்கத்தக்க நகரம் ஒன்றையும் காணவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் வனாந்தரத்தில், பாழ்நிலத்தில் அலைந்து திரிந்தார்கள்; குடியிருக்கும் நகரம் ஒன்றையும் காணவில்லை.”
    reason: மூலத்தின் மாற்றாகப் புரிந்துகொள்ளத்தக்க சொற்றொடர் அமைப்பை, ஆங்கில POB அடிக்குறிப்புக்கு இணங்கக் காட்டுகிறது.
lexical_decisions:
- source_word: תָּעוּ
  choice: அலைந்து திரிந்தார்கள்
  rationale: תעה என்பது வழிதவறி அலைதல் அல்லது நோக்கமின்றித் திரிதல் எனப் பொருள்படும். இச்சூழலில் ஒழுக்கத் தவறைச் சேர்க்காமல், திசையறியாத அலைச்சலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்பற்ற வறண்ட வெளி அல்லது வனாந்தரத்தைக் குறிக்கிறது. ‘வனாந்தரம்’ சங்கீதத்தின் கவித்துவ நடைக்கும் நவீன வேதாகமத் தமிழுக்கும் ஏற்றது.
- source_word: בִּישִׁימוֹן דָּרֶךְ
  choice: பாழ்நிலப் பாதையில்
  rationale: יְשִׁימוֹן பாழான, வெறுமையான நிலத்தையும் דֶּרֶךְ வழி அல்லது பாதையையும் குறிக்கின்றன. இரண்டையும் இணைத்த ‘பாழ்நிலப் பாதை’ எபிரெயச் செறிவையும் பயணச் சூழலையும் காக்கிறது.
- source_word: עִיר מוֹשָׁב
  choice: குடியிருக்கத்தக்க நகரம்
  rationale: இந்தச் சொற்றொடர் குடியிருப்பதற்கான அல்லது குடியேறுவதற்கான நகரத்தைக் குறிக்கிறது. ‘குடியிருக்கத்தக்க நகரம்’ என்பது நகரம் வெறுமனே மக்கள் வசிக்கும் இடம் என்பதற்குப் பதிலாக, பயணிகள் தங்கத் தேடிய இடம் என்ற கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא מָצָאוּ
  choice: ஒன்றையும் காணவில்லை
  rationale: எபிரெய எதிர்மறை வினை அவர்கள் அத்தகைய நகரத்தைக் கண்டடையவில்லை என்று நேரடியாகக் கூறுகிறது. ‘ஒன்றையும் காணவில்லை’ தமிழில் இயல்பாகவும் வலியுறுத்தலுடனும் உள்ளது.
