source:
  edition: WLC
  text: יָשֵׂ֣ם מִ֭דְבָּר לַֽ/אֲגַם מַ֑יִם וְ/אֶ֥רֶץ צִ֝יָּ֗ה לְ/מֹצָ֥אֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/035.yaml
  text: He turns a wilderness into a pool of water[c][b][a], and dry land into springs of water.
translation:
  language: ta
  text: அவர் வனாந்தரத்தை நீர்நிலையாகவும்,[a][b] வறண்ட நிலத்தை நீரூற்றுகளாகவும்[c] மாற்றுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உண்டாக்குகிறார்’; எபிரெய வினைச்சொல் சூழலுக்கேற்ப ‘வைக்கிறார்,’ ‘உண்டாக்குகிறார்,’ அல்லது ‘மாற்றுகிறார்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பாலைவனத்தை.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நீர் பிறக்கும் இடங்களாக’ அல்லது ‘நீராதாரங்களாக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: மாற்றுகிறார்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வை, அமை, உண்டாக்கு’ என்பதாக இருந்தாலும், இங்கு ஓர் நிலையை மற்றொன்றாக மாற்றும் கவிதைச் சூழலில் ‘மாற்றுகிறார்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: מִדְבָּר
  choice: வனாந்தரத்தை
  rationale: மִדְבָּר என்பது மக்கள் வாழாத வறண்ட வனப்பகுதி அல்லது பாலைவனத்தைக் குறிக்கலாம். ‘வனாந்தரம்’ அதன் பரந்த பொருளைத் தக்கவைத்து, மணற்பாலைவனம் என்ற மிகக் குறுகிய படிமத்தைத் தவிர்க்கிறது.
- source_word: לַאֲגַם מַיִם
  choice: நீர்நிலையாக
  rationale: אֲגַם என்பது குளம், சதுப்புநில நீர்த்தேக்கம், அல்லது நாணல் வளரும் நீர்நிலையைக் குறிக்கலாம். ‘நீர்நிலை’ இந்தப் பொருள் வரம்பை இயல்பான தமிழில் காக்கிறது.
- source_word: וְאֶרֶץ צִיָּה
  choice: வறண்ட நிலத்தை
  rationale: צִיָּה என்பது உலர்ந்த அல்லது நீரின்றித் தாகமுற்ற நிலத்தைக் குறிக்கிறது. ‘வறண்ட நிலம்’ தெளிவான, இயல்பான எதிர்மறைப் படிமத்தை அளிக்கிறது.
- source_word: לְמֹצָאֵי מָיִם
  choice: நீரூற்றுகளாக
  rationale: מוֹצָא என்பது நீர் வெளிப்படும் இடம், மூலம், அல்லது ஊற்றைக் குறிக்கலாம். பன்மையைப் பேணும் ‘நீரூற்றுகள்’ இங்கு இயற்கையாக வெளிப்படும் நீராதாரங்களைத் தெளிவாகக் காட்டுகிறது.
