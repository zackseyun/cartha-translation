source:
  edition: WLC
  text: וַ/יִּשְׂמְח֥וּ כִֽי יִשְׁתֹּ֑קוּ וַ֝/יַּנְחֵ֗/ם אֶל מְח֥וֹז חֶפְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/030.yaml
  text: Then they were glad that they grew quiet[b][a], and he led them to their desired haven.
translation:
  language: ta
  text: அமைதி ஏற்பட்டதால் அவர்கள் மகிழ்ந்தார்கள்[a]; அவர் அவர்களை அவர்கள் விரும்பிய துறைமுகத்துக்கு[b] நடத்திச் சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லர்த்தமாக, “அவர்கள் அமைதியடைந்ததால் அவர்கள் மகிழ்ந்தார்கள்.” இங்குள்ள வினையின் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை; அது அலைகள் அல்லது நீர் அடங்கியதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “துறைமுகம்” என்பதற்கு “வந்து சேர விரும்பிய இடம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: அவர்கள் மகிழ்ந்தார்கள்
  rationale: שׂמח என்பது மகிழ்ச்சி அடைதலைக் குறிக்கிறது. வாவ் தொடரும் நிகழ்வைச் சுட்டினாலும், தமிழில் வாக்கிய ஓட்டமே அந்தத் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי יִשְׁתֹּקוּ
  choice: அமைதி ஏற்பட்டதால்
  rationale: כִּי இங்கு காரணத்தைக் குறிக்கிறது; שׁתק என்பது அமைதியாதல் அல்லது அடங்குதலைக் குறிக்கிறது. எபிரெய வினையின் வெளிப்படாத பன்மை எழுவாய் மாலுமிகளையோ அலைகள்/நீரையோ குறிக்கக்கூடியதால், தமிழில் எழுவாயைச் சேர்க்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: וַיַּנְחֵם
  choice: அவர் அவர்களை ... நடத்திச் சென்றார்
  rationale: נחה என்பது வழிநடத்துதல் அல்லது அழைத்துச் செல்லுதல். சூழலில் மறைந்திருக்கும் ஒருமை ஆண்பால் எழுவாய் ஆண்டவரைக் குறிக்கிறது; மரியாதையான தமிழ் நடைமுறைக்கு ஏற்ப ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מְחוֹז
  choice: துறைமுகம்
  rationale: இந்த அரிய பெயர்ச்சொல் வந்து சேரும் இடம் அல்லது கப்பல் தங்கும் துறைமுகத்தைக் குறிக்கிறது. கடற்பயணச் சூழலில் ‘துறைமுகம்’ தெளிவான, இயல்பான சொல்.
- source_word: חֶפְצָם
  choice: அவர்கள் விரும்பிய
  rationale: חפץ என்ற வேர்ச்சொல் விருப்பம் அல்லது வாஞ்சையைக் குறிக்கிறது. இங்கு அவர்கள் சென்றடைய விரும்பிய துறைமுகம் என்ற தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיַּנְחֵם என்பதன் மறைந்திருக்கும் தெய்வீக எழுவாய்
  choice: ‘அவர்’ என்று மொழிபெயர்த்து, சூழலில் அது ஆண்டவரைக் குறிக்கும்படி விடப்பட்டுள்ளது.
  alternative: ‘அவர்கள் நடத்திச் செல்லப்பட்டார்கள்’ என்ற செயப்பாட்டு வடிவம்.
  rationale: எபிரெய வினை மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளது; முந்திய சூழலில் மாலுமிகளின் கூக்குரலுக்குப் பதிலளித்துச் செயல்படுபவர் ஆண்டவர். ‘அவர்’ என்பது அந்தத் தனிப்பட்ட செயற்பாட்டைப் பாதுகாக்கிறது; பெயரை வசனத்தில் புதிதாகச் சேர்ப்பதில்லை.
- issue: יִשְׁתֹּקוּ என்பதன் எழுவாய்
  choice: ‘அமைதி ஏற்பட்டதால்’ என்று எழுவாயைக் குறிப்பிடாமல் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘அலைகள் அமைதியடைந்ததால்’ அல்லது ‘அவர்கள் அமைதியடைந்ததால்’.
  rationale: எபிரெயத்தில் வெளிப்படையான எழுவாய் இல்லை. இலக்கண வடிவம் பன்மை; சூழல் அலைகள்/நீர் அடங்கியதைக் குறிக்கலாம், ஆனால் ‘அவர்கள்’ என்ற மாலுமிகளோடும் இலக்கணரீதியாக இணைக்கலாம். மொழிபெயர்ப்பு இந்தத் தெளிவின்மையைத் தீர்மானித்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், கவித்துவ கண்ணியத்தையும் பொதுவாசகர்களுக்கான தெளிவையும் இணைக்கும் நடை. ‘அவர்’ என்பது மரியாதை ஒருமையாகவும், சூழலில் கடவுளைக் குறிக்கும் மறைந்த எழுவாயைத் தக்கவைத்தும் உள்ளது. எபிரெயத்தில் அமைதியடைந்தது யார் அல்லது எது என்ற தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
