  text: He led them by a straight way to go to a city to dwell in[a].
translation:
  language: ta
  text: அவர் அவர்களை நேரான வழியில், குடியிருப்பதற்கான ஒரு நகரத்துக்குச் செல்லும்படி வழிநடத்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்படியாக, “அவர் அவர்களை நேரான வழியில், குடியிருப்பின் ஒரு நகரத்துக்குச் செல்லும்படி வழிநடத்தினார்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְרִיכֵם
  choice: அவர் அவர்களை … நடத்தி
  rationale: דרך என்பதன் ஹிஃபில் வடிவம் வழிநடத்துதல் அல்லது ஒரு வழியில் செல்லச் செய்தல் என்ற பொருளைக் கொண்டது. ‘நடத்தி’ என்பது காரணவினை நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּדֶרֶךְ
  choice: வழியில்
  rationale: דֶּרֶךְ என்பது வழி, சாலை, பாதை ஆகியவற்றைக் குறிக்கலாம். பயணச் சூழலுக்கு ‘வழி’ இயல்பாகவும் விரிவான பொருள் கொண்டதாகவும் உள்ளது.
- source_word: יְשָׁרָה
  choice: நேரான
  rationale: இந்தப் பெயரடை நேரான, செம்மையான என்ற பொருள்களைக் கொண்டது. வழிதவறித் திரிந்தவர்களின் பயணச் சூழலில் ‘நேரான’ என்பது தெளிவான இடவியல் படிமத்தைப் பாதுகாக்கிறது.
- source_word: לָלֶכֶת
  choice: செல்லச் செய்தார்
  rationale: הלך என்பது செல்லுதல் அல்லது நடத்தல். இங்குள்ள நோக்கத்தைக் குறிக்கும் வினையெச்சத்தை, முந்தைய வழிநடத்துதலோடு இயல்பாக இணைத்து ‘செல்லச் செய்தார்’ என வழங்கப்பட்டுள்ளது.
- source_word: אֶל
  choice: … நகரத்துக்கு
  rationale: இது இலக்கைச் சுட்டும் முன்னிடைச்சொல்; தமிழில் நான்காம் வேற்றுமை உருபான ‘-க்கு’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: עִיר
  choice: ஒரு நகரம்
  rationale: עִיר என்பது நகரம் அல்லது ஊர் எனப் பொருள்படும். இங்கு பாதுகாப்பான குடியிருப்பை அடையும் படிமத்துக்கு ‘நகரம்’ பொருந்துகிறது.
- source_word: מוֹשָׁב
  choice: குடியிருக்கத்தக்க
  rationale: מוֹשָׁב என்பது குடியிருப்பு, தங்குமிடம், வாழிடம் ஆகியவற்றைக் குறிக்கிறது. ‘குடியிருக்கத்தக்க ஒரு நகரம்’ என்பது ‘குடியிருப்பின் நகரம்’ என்ற எபிரெயக் கட்டமைப்பை வாசிக்க எளிதான தமிழில் தருகிறது.
