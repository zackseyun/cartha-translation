revisions:
- from: அவர் அவர்களை நேரான வழியில் நடத்தி, குடியிருக்கத்தக்க ஒரு நகரத்துக்குச் செல்லச் செய்தார்.[a]
  to: அவர் அவர்களை நேரான வழியில், குடியிருப்பதற்கான ஒரு நகரத்துக்குச் செல்லும்படி வழிநடத்தினார்.[a]
