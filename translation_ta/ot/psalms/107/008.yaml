id: PSA.107.8
reference: Psalms 107:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/008.yaml
  text: Let them give thanks to Yahweh for his steadfast love[a], and for his wondrous deeds to the children of man.
translation:
  language: ta
  text: அவர்கள் யாவேக்கு நன்றி செலுத்துவார்களாக, அவரது நிலையான அன்பிற்காகவும், மனிதர்களுக்கு[a] அவர் செய்த வியத்தகு செயல்களுக்காகவும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், “மனிதரின் பிள்ளைகளுக்கு” என்று உள்ளது; இது மனிதர்கள் அனைவரையும் குறிக்கும் பொதுவான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: நன்றி செலுத்தட்டும்
  rationale: ידה என்பதன் இவ்விடத்து ஹிஃபில் வடிவம், சங்கீதம் 107-இல் திரும்பத் திரும்ப வரும் பல்லவியில் ‘நன்றி செலுத்துதல்’ என்ற பொருளைத் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ முன்னொட்டு நன்றி செலுத்தப்படுபவரைக் குறிக்கிறது; יהוה என்ற இறைபெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: חַסְדּוֹ
  choice: அவரது மாறாத அன்பு
  rationale: חֶסֶד என்பது உறுதியான, தொடர்ந்து நிலைக்கும் பற்றுமிக்க அன்பையும் இரக்கமுள்ள நன்மையையும் குறிக்கிறது; ‘மாறாத அன்பு’ அதன் மையக் கருத்தை இயல்பான தமிழில் தருகிறது.
- source_word: וְנִפְלְאוֹתָיו
  choice: அவர் செய்த வியத்தகு செயல்கள்
  rationale: נִפְלָאוֹת என்பது வியப்பூட்டும் அசாதாரண செயல்களைக் குறிக்கிறது; தமிழில் செயற்பொருள் தெளிவாக இருக்க ‘அவர் செய்த’ என்று வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: לִבְנֵי אָדָם
  choice: மனிதர்களுக்கு
  rationale: ‘மனிதரின் பிள்ளைகள்’ என்பது மனிதகுலத்தைக் குறிக்கும் எபிரெயப் பொதுச்சொற்றொடர். இயல்பான நவீன தமிழில் ‘மனிதர்களுக்கு’ எனத் தரப்பட்டு, மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரையில் உடன்படிக்கைக்குரிய தனிப்பட்ட இறைபெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בני אדם என்பதிலுள்ள אָדָם-ஐக் கையாளுதல்
  choice: மனிதர்களுக்கு
  alternative: மனிதரின் பிள்ளைகளுக்கு
  rationale: இச்சொற்றொடர் ஒரு பாலினத்தவரை மட்டும் அல்லாமல் மனிதர்கள் அனைவரையும் பொதுவாகக் குறிக்கிறது. அதன் நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டிருப்பதால் பொருளும் மூல உருவகமும் இரண்டும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணை அமைப்பைப் பாதுகாக்க ‘—’ மற்றும் ‘-க்காகவும்’ என்ற இரட்டைத் தொடர் பயன்படுத்தப்பட்டுள்ளது.
