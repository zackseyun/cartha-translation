lexical_decisions:
- source_word: יָח֣וֹגּוּ
  choice: தள்ளாடுகிறார்கள்
  rationale: புயலில் நிலைகுலைந்து அசைவதை இயல்பான நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וְיָנוּעוּ
  choice: தடுமாறுகிறார்கள்
  rationale: முதல் இயக்க வினையுடன் இணைந்து, சீரற்ற அசைவைக் காட்டும் கவிதை இணைச்சொல்லாக அமைகிறது.
- source_word: כַּשִּׁכּוֹר
  choice: குடிகாரனைப் போல
  rationale: போதையால் நிலைதடுமாறும் ஒருவரைச் சுட்டும் எபிரெய ஒப்புமையைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: וְכָל חָכְמָתָם
  choice: அவர்களுடைய திறமையெல்லாம்
  rationale: חָכְמָה பொதுவாக ‘ஞானம்’ என்றாலும், கடற்புயல் சூழலில் அவர்களுடைய நடைமுறை அறிவையும் கப்பலோட்டும் திறனையும் குறிக்கிறது; ‘திறமை’ அந்தச் சூழற்பொருளை அளவுக்கு மீறிக் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: תִּתְבַּלָּע
  choice: பயனற்றுப் போகிறது
  rationale: சொல்லடிப்படையில் ‘விழுங்கப்படுகிறது’ என்ற உருவகம் இருந்தாலும், இங்கு மனிதத் திறமை முற்றிலும் செயலிழப்பதே கருத்து; இயல்பான தமிழுக்காக பொருளைத் தெளிவாகத் தருகிறது, அடிப்படை உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
