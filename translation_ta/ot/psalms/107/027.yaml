  text: They reel and stagger like a drunkard[a], and all their wisdom is swallowed up.
translation:
  language: ta
  text: அவர்கள் போதையில் இருப்பவனைப் போலத் தள்ளாடித் தடுமாறுகிறார்கள்; அவர்களுடைய ஞானமெல்லாம் விழுங்கப்படுகிறது.[a]
  philosophy: optimal-equivalence
