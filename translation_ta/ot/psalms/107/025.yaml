source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר וַֽ֭/יַּעֲמֵד ר֣וּחַ סְעָרָ֑ה וַ/תְּרוֹמֵ֥ם גַּלָּֽי/ו׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/025.yaml
  text: For he spoke and raised up a storm wind[a], and it lifted up its waves.
translation:
  language: ta
  text: அவர் சொன்னார்; புயற்காற்றை எழும்பச் செய்தார்[a]; அது கடலின் அலைகளை உயர்த்தியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் சொல்லி, புயற்காற்றை எழச் செய்தார்.”
    reason: וַיֹּאמֶר וַיַּעֲמֵד என்ற தொடர் ‘அவர் சொன்னார்; எழும்பச் செய்தார்’ என்றும், தமிழில் தொடர்பை வெளிப்படுத்தி ‘அவர் சொல்லி ... எழச் செய்தார்’ என்றும் இயல்பாக வழங்கப்படலாம்.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: அவர் சொன்னார்
  rationale: אמר என்பதன் இயல்பான பொருள் ‘சொல்/பேசு’. சூழலில் கர்த்தரே மறைமுக எழுவாய்; ‘கட்டளையிட்டார்’ என்று கூடுதல் விளக்கம் சேர்க்காமல், அவரது சொல்லால் புயல் எழுவதை இது காக்கிறது.
- source_word: וַיַּעֲמֵד
  choice: எழும்பச் செய்தார்
  rationale: עמד என்பதன் ஹிஃபீல் வடிவம் காரணவினைப் பொருளைக் கொண்டது. ‘நிற்கச் செய்தார்’ என்ற சொற்சொல் மொழிபெயர்ப்பைவிட, காற்று தோன்றியெழும் படிமத்திற்கு ‘எழும்பச் செய்தார்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: רוּחַ סְעָרָה
  choice: புயற்காற்றை
  rationale: இந்தச் சொல் இணைப்பு புயல்தன்மையுள்ள காற்றைக் குறிக்கிறது. ‘புயற்காற்று’ என்பதில் காற்று என்ற மூலச்சொல்லும் புயலின் வலிமையும் சுருக்கமாகப் பாதுகாக்கப்படுகின்றன.
- source_word: וַתְּרוֹמֵם
  choice: அது ... உயர்த்தியது
  rationale: רום என்பது உயர்த்துதல் அல்லது உயரமாதல் என்னும் பொருளுடையது. பெண்பால் ஒருமை வினைச்சொல் רוּחַ என்ற காற்றை எழுவாயாகக் காட்டுவதால், ‘அது’ புயற்காற்றைக் குறிக்கிறது.
- source_word: גַּלָּיו
  choice: கடலின் அலைகளை
  rationale: எபிரெயச் சொல் நேரடியாக ‘அதன்/அவனுடைய அலைகள்’ என்று உடைமை விகுதியைக் கொண்டுள்ளது; சூழலில் அந்த உடைமை கடலைக் குறிக்கிறது. தமிழில் தெளிவுக்காக, மறைமுகமான முன்னிலையை வெளிப்படுத்தி ‘கடலின் அலைகள்’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: மறைமுகமான இறை எழுவாய்
  choice: ‘அவர்’ என்பது உடனடியான சூழலில் கர்த்தரைக் குறிக்கிறது.
  alternative: எழுவாயை வெளிப்படுத்தாமல் ‘சொல்லப்பட்டது’ போன்ற செயப்பாட்டு வடிவில் தருதல்.
  rationale: எபிரெய வினைகள் செய்பாட்டு வடிவில் உள்ளன; சுற்றியுள்ள வசனங்கள் கடலின்மேல் கர்த்தர் செயற்படுவதை விவரிக்கின்றன. ஆகவே ‘அவர்’ என்பது உரையின் தொடர்ச்சியைக் காக்கிறது; கூடுதல் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தையும் மூலத்தின் காரணவினை அமைப்பையும் காக்கும் நடை. ‘புயற்காற்று’ தெளிவான பொதுப்பயன்பாட்டுச் சொல்; ‘கடலின்’ என்பது சூழலில் மறைந்துள்ள அலைகளின் உடைமையாளரைத் தெளிவுபடுத்துகிறது.
