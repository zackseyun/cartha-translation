source:
  edition: WLC
  text: וַ/יִּצְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם וּֽ֝/מִ/מְּצֽוּקֹתֵי/הֶ֗ם יוֹצִיאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/028.yaml
  text: Then they cried out to Yahweh in their trouble[a], and he brought them out of their distresses.
translation:
  language: ta
  text: அப்போது அவர்கள் தங்கள் நெருக்கடியில் யாவேவை நோக்கிக் கூக்குரலிட்டார்கள்; அவர் அவர்களை அவர்களுடைய துயரங்களிலிருந்து வெளியே கொண்டுவந்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: அப்போது ... கூக்குரலிட்டார்கள்
  rationale: வாவ் தொடர்வினை கதைநிகழ்வை முன்னெடுத்துச் செல்வதால் ‘அப்போது’ பொருத்தமானது; צעק என்பது உதவிக்கான அவசரமான கூக்குரலைக் குறிக்கிறது.
- source_word: אֶל־יְהוָה
  choice: யாவேவை நோக்கி
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளை இயல்பான தமிழில் ‘நோக்கி’ வெளிப்படுத்துகிறது; יהוה என்ற தனிப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: בַּצַּר לָהֶם
  choice: தங்கள் நெருக்கடியில்
  rationale: צַר இங்கு நெருக்கடியான அல்லது இக்கட்டான நிலையைச் சுட்டுகிறது; לָהֶם தரும் உடைமைத் தொடர்பை ‘தங்கள்’ வெளிப்படுத்துகிறது.
- source_word: וּמִמְּצוּקוֹתֵיהֶם
  choice: அவர்களுடைய துயரங்களிலிருந்து
  rationale: מְצוּקוֹת என்பது அழுத்தங்கள் அல்லது கடும் துயரங்களைக் குறிக்கும் பன்மைச் சொல்; מן என்பதன் பிரிவுப் பொருளை ‘இலிருந்து’ பாதுகாக்கிறது.
- source_word: יוֹצִיאֵם
  choice: அவர்களை ... வெளியே கொண்டுவந்தார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே வரச் செய்தல்/கொண்டுவருதல்’ எனும் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைத் தனிப்பெயரே உள்ளது; அதனைத் தலைப்பாக மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
translation_notes:
  register: நவீன பொதுத் தமிழில் இயல்பாகவும், சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. மூலத்தின் ‘நெருக்கடி’ என்ற ஒருமைக்கும் ‘துயரங்கள்’ என்ற பன்மைக்கும் இடையிலான வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
