source:
  edition: WLC
  text: וַ/יְבָרֲכֵ֣/ם וַ/יִּרְבּ֣וּ מְאֹ֑ד וּ֝/בְהֶמְתָּ֗/ם לֹ֣א יַמְעִֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/038.yaml
  text: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
translation:
  language: ta
  text: அவர் அவர்களை ஆசீர்வதித்தார்; அவர்கள் மிகவும் பெருகினார்கள்; அவர்களுடைய கால்நடைகளை அவர் குறையவிடவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய கால்நடைகள் குறையவில்லை.” எபிரேய வினைச்சொல் ஒருமையில் உள்ளது. அதை முன் வாக்கியத்திலுள்ள கடவுளை எழுவாயாகக் கொண்டு, “அவர் குறையவிடவில்லை” என்றும், விளைவைக் கூறும் வாக்கியமாக, “கால்நடைகள் குறையவில்லை” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: அவர் அவர்களை ஆசீர்வதித்தார்
  rationale: பיעேல் வடிவிலுள்ள ברך, ஆசீர்வாதத்தையும் செழிப்பையும் அருளுவதைக் குறிக்கிறது. சங்கீதத்தின் சூழலில் ஒருமை எழுவாய் கடவுளைக் குறிப்பதால், ‘அவர்’ எனத் தக்கவைக்கப்பட்டது.
- source_word: וַיִּרְבּוּ
  choice: அவர்கள் பெருகினார்கள்
  rationale: רבה என்பதன் இங்கு வரும் பன்மை, செயப்படுபொருள் குன்றிய வடிவம் எண்ணிக்கையில் பெருகுவதைக் குறிக்கிறது. ‘பெருகினார்கள்’ என்பது மக்கள்தொகை வளர்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: பெருக்கத்தின் அளவை வலுப்படுத்தும் வினையடை; நவீனத் தமிழில் எளிமையாகவும் இயல்பாகவும் அதன் வலிமையைத் தருகிறது.
- source_word: וּבְהֶמְתָּם
  choice: அவர்களுடைய கால்நடைகளை
  rationale: בְּהֵמָה இங்கு வளர்ப்பு விலங்குகளைத் தொகுப்பாகக் குறிக்கிறது. ‘கால்நடைகள்’ என்பது மாடுகள் மட்டுமல்லாமல் பொதுவான வளர்ப்பு மிருகங்களையும் உள்ளடக்கும் இயல்பான சமமான சொல்.
- source_word: לֹא יַמְעִיט
  choice: அவர் குறையவிடவில்லை
  rationale: מעט என்பதன் ஹிஃபில் வடிவம் ‘குறையச் செய்தல்/குறைத்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. முந்தைய ஒருமைத் தெய்வீக எழுவாயைத் தொடரும் வாசிப்பையும், பாதுகாத்ததால் அவை குறையவில்லை என்ற விளைவையும் ‘குறையவிடவில்லை’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதி வாக்கியக்கூறின் எழுவாய் தொடர்ச்சி
  choice: 'கடவுளே எழுவாயாகத் தொடர்கிறார்: ‘அவர்களுடைய கால்நடைகளை அவர் குறையவிடவில்லை.’'
  alternative: ‘அவர்களுடைய கால்நடைகளும் குறையவில்லை.’
  rationale: எபிரெயச் சொல்லான יַמְעִיט ஒருமையில் இருப்பதால், ‘அவர் ஆசீர்வதித்தார்’ என்பதிலுள்ள கடவுளையே எழுவாயாகத் தொடர்வது இலக்கண ரீதியாக இயல்பானது. இருப்பினும், கால்நடைகள் குறையவில்லை என்ற விளைவு வாசிப்பும் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; இதன்மூலம் உரையின் உண்மையான தெளிவின்மை மறைக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆசீர்வதித்தார்’ என்ற பரவலாக அறியப்பட்ட வேதாகமச் சொல் தக்கவைக்கப்பட்டு, மற்ற சொற்றொடர்கள் இயல்பான தமிழில் அமைக்கப்பட்டுள்ளன.
