    text: 'வேறு மொழிபெயர்ப்பு: “அவர் புயலை அமைதிக்குக் கொண்டுவந்தார்.” எபிரெயச் சொற்றொடர், புயலை அமைதி அல்லது நிசப்தம் என்ற நிலைக்கு வரச் செய்ததைச் சொல்கிறது.'
