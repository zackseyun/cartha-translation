lexical_decisions:
- source_word: יָקֵם
  choice: அமைதியாக்கினார்
  rationale: קום என்பதன் ஹிஃபில் வடிவம் இங்கு ‘ஒரு நிலைக்கு வரச் செய்தார்’ என்ற காரணவினைப் பொருளைத் தருகிறது. தமிழில் ‘அமைதியாக்கினார்’ என்பது அந்தக் காரணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סְעָרָה
  choice: புயலை
  rationale: கடற்பயணச் சூழலில் இச்சொல் புயல் அல்லது கடும் புயற்காற்றைக் குறிக்கிறது; ‘புயல்’ என்பது தெளிவான, பொதுவான நவீனத் தமிழ்ச் சொல்.
- source_word: לִדְמָמָה
  choice: அமைதியாக்கினார்
  rationale: לְ உடன் வரும் דְּמָמָה, புயல் அமைதி/நிசப்தம் என்ற விளைவு நிலைக்கு மாற்றப்பட்டதைச் சுட்டுகிறது. அது தமிழில் காரணவினையோடு இணைத்து வழங்கப்பட்டுள்ளது.
- source_word: וַיֶּחֱשׁוּ
  choice: அடங்கின
  rationale: இவ்வினை அமைதியடைதல் அல்லது ஓசையின்றிப் போதலைக் குறிக்கிறது. அலைகளைப் பற்றிய தமிழ்ச் சொல்லாட்சியில் ‘அடங்கின’ இயல்பாகவும் உயிரோட்டமாகவும் உள்ளது.
- source_word: גַּלֵּיהֶם
  choice: அவர்களுடைய அலைகள்
  rationale: எபிரெயப் பின்னொட்டு இலக்கணப்படி மூன்றாம் நபர் ஆண்பால் பன்மை, அதாவது ‘அவர்களுடைய’ என உள்ளது. அதன் முன்னிலைச் சொல்லைத் தீர்மானித்துவிடாமல், மூலத்தின் வடிவம் தக்கவைக்கப்படுகிறது.
