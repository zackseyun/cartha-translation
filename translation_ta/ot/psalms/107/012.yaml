  yaml_path: translation/ot/psalms/107/012.yaml
  text: So he humbled their heart with hard labor[a]; they stumbled[c][b], and there was no one to help.
translation:
  language: ta
  text: அவர் கடுமையான உழைப்பினால்[a] அவர்களுடைய உள்ளத்தைத் தாழ்த்தினார்; அவர்கள் இடறினார்கள்[b]; உதவ ஒருவரும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடும் பாடுகளால்” அல்லது “துன்பத்தினால்”; எபிரெயச் சொல் கடின உழைப்பு, வருத்தம், அல்லது துயரம் என்பவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் விழுந்தார்கள்”; எபிரெய வினை இடறுதல், தடுமாறுதல், அல்லது சரிதல் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: அவர் ... தாழ்த்தினார்
  rationale: כנע என்பதன் ஹிஃபில் வடிவம் ‘தாழ்த்தச் செய்தார்’ அல்லது ‘அடக்கினார்’ என்ற காரணவினைப் பொருளைத் தருகிறது. சூழலில் மறைமுக எழுவாய் ஆண்டவர்; ‘தாழ்த்தினார்’ என்பது இயல்பாகவும் கண்ணியமாகவும் அந்தப் பொருளைக் காக்கிறது.
- source_word: בֶּעָמָל
  choice: கடுமையான உழைப்பினால்
  rationale: עָמָל கடின உழைப்பு, வருத்தம், துன்பம் ஆகிய பொருள்களைக் கொள்ளலாம். சிறை மற்றும் ஒடுக்குமுறைச் சூழலில் ‘கடுமையான உழைப்பினால்’ என்பது கருவிப்பொருளையும் சுமைமிக்க உழைப்பையும் நன்கு வெளிப்படுத்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: לִבָּם
  choice: அவர்களுடைய உள்ளத்தை
  rationale: எபிரெயத்தில் ஒருமை ‘இருதயம்’ பன்மைக் குழுவைக் குறிக்கும் வகையில் வருகிறது. நவீன தமிழில் ‘அவர்களுடைய உள்ளத்தை’ என்பது கூட்டு ஒருமையை இயல்பாகத் தக்கவைத்து, மனம், துணிவு, அகநிலை ஆகிய பரப்பையும் உணர்த்துகிறது.
- source_word: כָּשְׁלוּ
  choice: அவர்கள் இடறி விழுந்தார்கள்
  rationale: כשל இடறுதல், தடுமாறுதல், சில சூழல்களில் விழுதல் அல்லது சரிதல் ஆகியவற்றைக் குறிக்கிறது. இங்கு உதவியற்ற வீழ்ச்சியை இயல்பான தமிழில் காட்ட ‘இடறி விழுந்தார்கள்’ என வழங்கப்பட்டுள்ளது; குறைந்த தீவிரமுள்ள மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאֵין עֹזֵר
  choice: உதவ ஒருவரும் இல்லை
  rationale: אֵין உடன் வரும் உதவுபவர் என்ற பங்கேற்பு வடிவம், உதவியாளர் எவரும் இல்லாத நிலையைச் சொல்கிறது. ‘உதவ ஒருவரும் இல்லை’ என்பது சுருக்கமான, இயல்பான நவீன தமிழ்.
theological_decisions:
- issue: וַיַּכְנַע என்பதன் மறைமுக எழுவாய்
  choice: இறைவனைச் சுட்டும் ‘அவர்’ எழுவாயுடன் செயப்பாட்டு அல்லாத காரணவினை
  alternative: ‘அவர்களுடைய உள்ளம் தாழ்த்தப்பட்டது’ என்ற எழுவாயற்ற/செயப்பாட்டு வடிவம்
  rationale: சுற்றியுள்ள வசனங்கள் தண்டித்தலும் விடுவித்தலும் ஆண்டவருடைய செயல்கள் என்று காட்டுகின்றன. மூலத்தின் ஒருமைச் செய்பாட்டு வினையைப் பின்பற்றி ‘அவர்’ எனக் கொள்வது இறைச்செயலைத் தக்கவைக்கிறது; அதேவேளை இந்த வசனத்திலேயே ‘ஆண்டவர்’ என்ற பெயரைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘உள்ளம்’ என்பது எபிரெயக் கூட்டு ஒருமையையும் அகநிலை/துணிவு சார்ந்த பொருளையும் இயல்பாகத் தக்கவைக்கிறது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
