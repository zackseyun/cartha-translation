  text: and gathered them from the lands[a], from the east and from the west[b], from the north and from the sea.
translation:
  language: ta
  text: நாடுகளிலிருந்து அவர்களைக் கூட்டிச்சேர்த்தார்—கிழக்கிலிருந்தும் மேற்கிலிருந்தும், வடக்கிலிருந்தும் கடலிலிருந்தும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தெற்கிலிருந்தும்.’ எபிரெயத்தில் ‘கடலிலிருந்தும்’ என்று உள்ளது. சில சூழல்களில் ‘கடல்’ என்பது ஒரு திசையைக்—பொதுவாக மேற்கை—குறிக்கலாம்; ஆனால் இங்கு மேற்கு ஏற்கெனவே தனியாகக் குறிப்பிடப்பட்டுள்ளது.
