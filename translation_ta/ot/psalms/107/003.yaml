lexical_decisions:
- source_word: וּמֵאֲרָצוֹת
  choice: பல நாடுகளிலிருந்து
  rationale: אֶרֶץ என்பதன் பன்மை இங்கு மக்கள் கூட்டிச் சேர்க்கப்பட்ட பல்வேறு நிலப்பகுதிகள் அல்லது நாடுகளைக் குறிக்கிறது. நவீன தமிழில் இயல்பாகவும் புவியியல் பன்மையைத் தெளிவாகவும் தெரிவிக்க ‘பல நாடுகளிலிருந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: קִבְּצָם
  choice: அவர்களைக் கூட்டிச்சேர்த்தார்
  rationale: קבץ என்பது ‘ஒன்றாகக் கூட்டுதல், சேர்த்தல்’ என்று பொருள். சிதறியிருந்தவர்களை மீண்டும் ஒன்றாகச் சேர்க்கும் சூழலை ‘கூட்டிச்சேர்த்தார்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִמִּזְרָח וּמִמַּעֲרָב
  choice: கிழக்கிலிருந்தும் மேற்கிலிருந்தும்
  rationale: இரு திசைகளையும் இணையான, இயல்பான தமிழ் வடிவில் அளிக்கிறது; ‘சூரிய உதயம்/மறைவு’ என்ற சொல்லடிப் பொருளை தேவையின்றி முன்னிறுத்தவில்லை.
- source_word: מִצָּפוֹן
  choice: வடக்கிலிருந்தும்
  rationale: צָפוֹן இங்கு வடக்கு என்னும் திசையைக் குறிக்கிறது.
- source_word: וּמִיָּם
  choice: கடலிலிருந்தும்
  rationale: יָם என்பதன் நேரடியான பொருள் ‘கடல்’. அது சில சூழல்களில் மேற்குத் திசையைக் குறிக்கலாம்; ஆனால் இவ்வசனத்தில் மேற்கு ஏற்கெனவே தனியாகக் குறிப்பிடப்பட்டுள்ளதால், எபிரெய உரையின் உண்மையான வடிவத்தையும் அதன் சிக்கலையும் காக்க ‘கடலிலிருந்தும்’ என மொழிபெயர்க்கப்பட்டது.
