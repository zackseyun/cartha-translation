  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּזְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם מִ֝/מְּצֻֽקוֹתֵי/הֶ֗ם יוֹשִׁיעֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/019.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: ta
  text: அப்போது அவர்கள் தங்கள் துன்பத்தில் யாவேவை[a] நோக்கிக் கூக்குரலிட்டார்கள்; அவர் அவர்களை அவர்களுடைய நெருக்கடிகளிலிருந்து காப்பாற்றினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய உரையில் ‘YHWH’ என்ற இறைப்பெயர் உள்ளது; இது மரபாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது. இங்கு ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: divine_name_rendering
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: அப்போது … கூக்குரலிட்டார்கள்
  rationale: தொடர்நிலை வாவ் சங்கீதத்தின் நிகழ்வுத் தொடரை முன்னெடுப்பதால் ‘அப்போது’ இயல்பாக அமைகிறது. זעק என்பது உதவி நாடும் அவசரமான உரத்த அழுகுரலைக் குறிப்பதால் ‘கூக்குரலிட்டார்கள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: אֶל־יְהוָה
  choice: யாவேவை நோக்கி
  rationale: אֶל என்பதன் திசைநோக்கிய பொருளை ‘நோக்கி’ இயல்பாக வெளிப்படுத்துகிறது; יהוה என்பது பட்டமல்ல, இறைப்பெயர் என்பதால் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: בַּצַּר לָהֶם
  choice: தங்கள் துன்பத்தில்
  rationale: צַר இங்கு அவர்கள் அனுபவித்த துயரான சூழ்நிலையைக் குறிக்கிறது. לָהֶם என்பதன் பொருள் தமிழில் ‘தங்கள்’ என்ற உடைமை வடிவில் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: அவர்களுடைய நெருக்கடிகளிலிருந்து
  rationale: מְצוּקוֹת என்பது அழுத்தும் இக்கட்டுகள் அல்லது கடும் நெருக்கடிகளைக் குறிக்கும் பன்மைச்சொல். முந்தைய צַר என்பதிலிருந்து சொற்பொருள் வேறுபாட்டையும் பன்மையையும் இத்தேர்வு காக்கிறது.
- source_word: יוֹשִׁיעֵם
  choice: அவர் அவர்களைக் காப்பாற்றினார்
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்து காப்பாற்றுதல் அல்லது விடுவித்தல் என்று பொருள்படும். ‘காப்பாற்றினார்’ என்பது சுருக்கமாகவும் இயல்பாகவும் இறை மீட்பை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய உரையில் நான்கெழுத்து இறைப்பெயரான יהוה நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், தனிப்பட்ட இறைப்பெயராக ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடிய அதேவேளையில் சங்கீதத்துக்குரிய கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘துன்பம்’ மற்றும் ‘நெருக்கடிகள்’ என்பவை மூலத்திலுள்ள இரண்டு தொடர்புடைய சொற்களின் வேறுபாட்டைக் காக்கின்றன.
