translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் சாதாரண வாசகர்களுக்குப் புரியும் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் இணையான இரு அறிவுறுத்தல்களும் காக்கப்பட்டுள்ளன; רִנָּה என்பதிலுள்ள ஆரவாரம்/பாடல் சார்ந்த பொருள் முதன்மை உரையிலும் அடிக்குறிப்பிலும் பிரதிபலிக்கப்படுகிறது.
