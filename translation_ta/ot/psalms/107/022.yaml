lexical_decisions:
- source_word: וְיִזְבְּחוּ
  choice: செலுத்தி
  rationale: இங்கு 3ஆம் நபர் பன்மை imperfect வடிவம் அறிவுறுத்தும் பொருளைக் கொண்டுள்ளது. பலியைக் குறிக்கும் சூழலில் ‘பலிகளைச் செலுத்தி’ என்பது இயல்பாகவும் வழிபாட்டுப் பொருளைத் துல்லியமாகவும் தருகிறது.
- source_word: זִבְחֵי תוֹדָה
  choice: நன்றிப் பலிகள்
  rationale: இந்த இணைப்புச் சொற்றொடர் நன்றி செலுத்துவதற்கான பலிகளைக் குறிக்கிறது. ‘நன்றிப் பலிகள்’ என்பது சுருக்கமாகவும் தெளிவாகவும் எபிரெயச் சொல்லமைப்பின் பொருளைத் தருகிறது.
- source_word: תוֹדָה
  choice: நன்றி
  rationale: பலியிடும் சூழலில் இச்சொல் பொதுவான துதியைவிட நன்றி செலுத்துதலை அல்லது நன்றிக்கான காணிக்கையைச் சுட்டுகிறது.
- source_word: וִיסַפְּרוּ
  choice: எடுத்துரைக்கட்டும்
  rationale: Piel வடிவிலுள்ள ספר, செயல்களை விரிவாகச் சொல்லுதல் அல்லது விவரித்துரைத்தல் என்ற பொருளைக் கொண்டது. ‘எடுத்துரைக்கட்டும்’ அந்த அறிவுறுத்தும் தன்மையையும் விவரித்துச் சொல்லும் நுணுக்கத்தையும் காக்கிறது.
- source_word: מַעֲשָׂיו
  choice: அவருடைய செயல்கள்
  rationale: இது தேவனுடைய செயல்கள் அல்லது கிரியைகளைக் குறிக்கிறது. நவீன பொதுத் தமிழில் ‘செயல்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְּרִנָּה
  choice: மகிழ்ச்சி ஆரவாரத்துடன்
  rationale: רִנָּה மகிழ்ச்சியால் எழும் உரத்த ஒலி, ஆரவாரம் அல்லது பாடலைக் குறிக்கலாம். மூலத்தில் பாடல் என்பது வெளிப்படையாக இல்லாததால், ‘மகிழ்ச்சி ஆரவாரத்துடன்’ அதன் பரந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
