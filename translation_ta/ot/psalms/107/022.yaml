  text: Let them offer sacrifices of thanksgiving[b][a], and recount his works with joyful singing.
translation:
  language: ta
  text: அவர்கள் நன்றிப் பலிகளைச் செலுத்தட்டும்;[a] மகிழ்ச்சி முழக்கத்துடன் அவருடைய செயல்களை எடுத்துரைக்கட்டும்.[b]
  philosophy: optimal-equivalence
