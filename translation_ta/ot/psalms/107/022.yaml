revisions:
- from: அவர்கள் நன்றிப் பலிகளைச் செலுத்தி,[a] மகிழ்ச்சி ஆரவாரத்துடன் அவருடைய செயல்களை எடுத்துரைக்கட்டும்.[b]
  to: அவர்கள் நன்றிப் பலிகளைச் செலுத்தட்டும்;[a] மகிழ்ச்சி முழக்கத்துடன் அவருடைய செயல்களை எடுத்துரைக்கட்டும்.[b]
  rationale: The first clause has been changed to an independent exhortation (‘செலுத்தட்டும்’) so that it remains parallel to ‘எடுத்துரைக்கட்டும்,’ as in the Hebrew. The rendering of רִנָּה has been adjusted to ‘மகிழ்ச்சி முழக்கத்துடன்,’ which retains its audible, jubilant sense without adding an explicit reference to song. Footnotes have been aligned with the words they clarify and revised to give genuine lexical alternatives.
