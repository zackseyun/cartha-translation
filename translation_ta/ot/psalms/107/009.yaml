theological_decisions:
- issue: נֶפֶשׁ என்பதன் மனிதவியல் பொருள்
  choice: இரு அரையடிகளிலும் ‘உயிர்’
  alternative: ஒருவர்; தன்னுயிர்; உள்ளம்; ஆன்மா
  rationale: எபிரெயச் சொல் முழு உயிருள்ள மனிதரையும் அவரது உள்ளார்ந்த உயிர் ஏக்கத்தையும் குறிக்கலாம். ‘உயிர்’ என்பது கவிதைச் செறிவைத் தக்கவைத்து, மனிதனை உடல் மற்றும் உடலற்ற ஆன்மா எனக் கட்டாயமாகப் பிரிக்கும் ஒரு குறிப்பிட்ட கோட்பாட்டை வசனத்துக்குள் புகுத்தாமல் இருக்கிறது.
- issue: טוֹב என்பதன் பொருள் வடிவம்
  choice: நல்லவற்றால்
  alternative: நன்மையால்; நல்லதினால்
  rationale: தேவனுடைய நன்மையான வழங்குதலை இயல்பாக உணர்த்தும் கூட்டுப்பொருள் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது; மூலத்தில் உள்ள ஒருமை/பண்புப் பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைநிலையைப் பாதுகாக்க ‘உயிர்’ இருமுறையும் இடம் பெற்றுள்ளது; இரண்டு அரையடிகளின் தாகம்–பசி ஒத்திசைவும் தக்கவைக்கப்பட்டுள்ளது.
