  yaml_path: translation/ot/psalms/107/011.yaml
  text: For they rebelled against the words of God and despised the counsel of the Most High[a].
translation:
  language: ta
  text: ஏனெனில், அவர்கள் இறைவனின் வார்த்தைகளுக்கு எதிராகக் கிளர்ந்தெழுந்து, உன்னதமானவரின் ஆலோசனையை அவமதித்தார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் இறைவனின் வார்த்தைகளை மீறி, உன்னதமானவரின் ஆலோசனையை இகழ்ந்ததால்.”
    reason: மרה மற்றும் נאץ ஆகிய வினைச்சொற்களின் முறையே எதிர்ப்பு/கீழ்ப்படியாமை மற்றும் இகழ்ச்சி/அவமதிப்பு என்ற பொருள் நிழல்களையும், כִּי என்பதன் காரணப் பயன்பாட்டையும் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழ்நிலைக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணத் தொடர்பை இயல்பாகவும் தெளிவாகவும் காட்டுகிறது.
- source_word: הִמְרוּ
  choice: எதிர்த்துக் கலகம் செய்து
  rationale: מרה என்பதிலுள்ள கீழ்ப்படியாமை, எதிர்ப்பு, கலகம் ஆகிய வலுவான பொருள்களைப் பாதுகாக்கிறது; இங்கு அதன் இலக்கு இறைவனின் வார்த்தைகள்.
- source_word: אִמְרֵי
  choice: வார்த்தைகளை
  rationale: אמרה என்பதன் பன்மை வடிவத்தை இயல்பான நவீன தமிழில் தருகிறது; தெய்வீக உரைகளைப் பொதுவாகக் குறிக்க ஏற்றது.
- source_word: אֵל
  choice: இறைவன்
  rationale: இச்சூழலில் வழக்கமான தெய்வப் பெயராக இருப்பதால், தெளிவானதும் சமயப்பிரிவு சாராததுமான தமிழ்ச் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַעֲצַת
  choice: ஆலோசனையை
  rationale: עֵצָה என்பதில் உள்ள ஆலோசனை, அறிவுரை, திட்டம் ஆகிய பொருள் பரப்பை அளவுக்கு மீறிக் குறுக்காமல் பாதுகாக்கிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: தெய்வீகப் பட்டத்தின் உயர்வையும் கவித்துவ இணைப்பையும் இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: נָאָצוּ
  choice: அவமதித்தார்கள்
  rationale: נאץ குறிக்கும் இகழ்ச்சி மற்றும் மதிப்பின்றித் தள்ளுதல் ஆகிய வலுவான எதிர்வினையைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֵל மற்றும் עֶלְיוֹן என்ற இணையான தெய்வீகப் பட்டங்களின் மொழிபெயர்ப்பு
  choice: இறைவன் ... உன்னதமானவர்
  alternative: வல்லவர் ... மிக உயர்ந்தவர்
  rationale: இரு எபிரெயப் பெயர்களுக்கிடையிலான வேறுபாட்டையும் சங்கீதத்தின் உயர்ந்த நடையையும் காக்கிறது; மூலத்தில் இல்லாத தனிப்பட்ட கோட்பாட்டு நுணுக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் கொண்ட சங்கீத நடையைப் பின்பற்றுகிறது. “ஆலோசனை” என்ற சொல் மூலத்தின் ஆலோசனை/திட்டம் என்ற திட்டமிட்ட தெளிவின்மையைத் தக்கவைக்கிறது.
