- from: ஏனெனில், அவர்கள் இறைவனின் வார்த்தைகளை எதிர்த்துக் கலகம் செய்து, உன்னதமானவரின் ஆலோசனையை அவமதித்தார்கள்.[a]
  to: ஏனெனில், அவர்கள் இறைவனின் வார்த்தைகளுக்கு எதிராகக் கிளர்ந்தெழுந்து, உன்னதமானவரின் ஆலோசனையை அவமதித்தார்கள்.[a]
  rationale: முதல் வினைச்சொல்லை மூலத்தின் ஒரே செயலைத் தெளிவாகக் காட்டும் வகையில் திருத்தியுள்ளோம். மீதமுள்ள இணைநடை, தெய்வீகப் பட்டங்கள், மற்றும் ஆலோசனை என்ற சொல் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்பும் திருத்தப்பட்ட முக்கிய உரையுடன் ஒத்திசையச் சுருக்கமாக மாற்றப்பட்டுள்ளது.
