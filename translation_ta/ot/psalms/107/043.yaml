source:
  edition: WLC
  text: מִי חָכָ֥ם וְ/יִשְׁמָר אֵ֑לֶּה וְ֝/יִתְבּֽוֹנְנ֗וּ חַֽסְדֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/043.yaml
  text: Who is wise? Let him keep these things[c][b][a], and let them consider the steadfast love of Yahweh.
translation:
  language: ta
  text: ஞானமுள்ளவன் யார்? அவன் இவற்றைக் கவனத்தில் கொள்ளட்டும்[a]; அவர்கள்[b] யாவேயின் மாறாத அன்புச் செயல்களை[c] ஆழ்ந்து சிந்திக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவற்றைக் காத்துக்கொள்ளட்டும்” அல்லது “இவற்றைக் கருத்தில் கொள்ளட்டும்.”
    reason: שׁמר என்ற சொல் காத்தல், மனத்தில் வைத்தல், கவனித்தல் ஆகிய பொருள்களைக் கொள்ளலாம்.
  - marker: b
    text: எபிரெய மூலத்தில் முதலில் ஒருமை (“அவன்”) வந்த பின் இங்கு பன்மை (“அவர்கள்”) வருகிறது; அந்த மாற்றம் மொழிபெயர்ப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
    reason: மூலத்தின் ஒருமை–பன்மை மாற்றத்தை வாசகருக்குத் தெளிவுபடுத்துகிறது.
  - marker: c
    text: எபிரெயத்தில் சொற்பொருளாக “மாறாத அன்புகள்”; இது யாவேயின் உடன்படிக்கை அன்பும் இரக்கமும் வெளிப்பட்ட பல செயல்களைக் குறிக்கலாம்.
    reason: חַסְדֵי என்பதன் பன்மை வடிவத்தையும் அதன் பொருள் பரப்பையும் விளக்குகிறது.
lexical_decisions:
- source_word: מִי חָכָם
  choice: ஞானமுள்ளவன் யார்?
  rationale: மִי என்பதன் நேரடியான வினாவையும் חָכָם என்பதன் ஆண்பால் ஒருமை வடிவையும் பாதுகாக்கும் ஞானநூல் பாணியிலான இயல்பான தமிழ்.
- source_word: וְיִשְׁמָר אֵלֶּה
  choice: அவன் இவற்றைக் கவனத்தில் கொள்ளட்டும்
  rationale: שׁמר இங்கு சங்கீதத்தில் விவரிக்கப்பட்டவற்றை மனத்தில் வைத்துக் கவனிப்பதைக் குறிக்கிறது. வினைச்சொல்லின் ஒருமையையும் அறிவுரைப் பொருளையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: וְיִתְבּוֹנְנוּ
  choice: அவர்கள் ... ஆழ்ந்து சிந்திக்கட்டும்
  rationale: בין என்பதன் இந்த வடிவம் கவனமாக ஆராய்ந்து உணர்வதைக் குறிக்கிறது. எபிரெயத்தில் திடீரென வரும் பன்மை வினை தமிழிலும் பன்மை எழுவாயால் வெளிப்படுத்தப்படுகிறது.
- source_word: חַסְדֵי
  choice: மாறாத அன்புச் செயல்களை
  rationale: חֶסֶד என்பதன் பன்மை வடிவம் யாவே பலவிதங்களில் வெளிப்படுத்திய உடன்படிக்கை உண்மையும் இரக்கமுமுள்ள அன்புச் செயல்களைக் குறிக்கலாம். ‘மாறாத அன்பு’ என்ற கருத்தையும் பன்மை நுட்பத்தையும் இச்சொற்றொடர் இயல்பாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர்; அதனால் தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் இறைவனுடைய தனிப்பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: ஒருமையிலிருந்து பன்மைக்கு மாறும் இலக்கண அமைப்பு
  choice: அவன் ... அவர்கள்
  alternative: அவன் ... அவன்
  rationale: மூலத்தில் முதல் வினை ஆண்பால் ஒருமையிலும் இரண்டாவது வினை பன்மையிலும் உள்ளது. அதன் இயல்பான பதற்றத்தைச் சீராக்காமல் தமிழிலும் வெளிப்படுத்தப்பட்டுள்ளது.
- issue: חַסְדֵי என்பதன் பன்மை
  choice: மாறாத அன்புச் செயல்கள்
  alternative: மாறாத அன்பு
  rationale: ஒருமையான கூட்டுப்பொருளாக மாற்றாமல், யாவேயின் அன்பு வெளிப்பட்ட பல செயல்களைக் குறிக்கக்கூடிய மூலத்தின் பன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் சங்கீதத்தின் ஞான அறிவுரைக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ஆண்பால் ஒருமையும் பின்னர் வரும் பன்மையும் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளன; ‘அவர்கள்’ என்பதன் திடீர் வருகையை அடிக்குறிப்பு விளக்குகிறது.
