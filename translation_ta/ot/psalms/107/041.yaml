base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/041.yaml
  text: But he sets the needy on high[a], away from affliction, and makes their families like a flock.
translation:
  language: ta
  text: ஆனால் அவர் தேவையுள்ளவரைத் துன்பத்திலிருந்து பாதுகாப்பான உயரத்தில் வைக்கிறார்[a]; அவரது குடும்பங்களை ஒரு மந்தையைப்போல் பெருகச் செய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவையுள்ளவரை அவலத்திலிருந்து உயர்த்துகிறார்”; அல்லது, “அவரது குடும்பங்களை ஒரு மந்தையைப்போல் ஆக்குகிறார்.” எபிரெயச் சொல் உயர்த்துவதோடு பாதுகாப்பான உயர்ந்த இடத்தில் வைப்பதையும் உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: உயர்த்திப் பாதுகாப்பாக வைக்கிறார்
  rationale: שׂגב என்ற வினை உயர்ந்த இடத்தில் வைப்பதையும் அதனால் கிடைக்கும் பாதுகாப்பையும் உணர்த்துகிறது; இரு நுணுக்கங்களையும் இந்தச் சொற்றொடர் காக்கிறது.
- source_word: אֶבְיוֹן
  choice: ஏழையை
  rationale: אֶבְיוֹן என்பது தேவையிலும் வறுமையிலும் இருப்பவரைக் குறிக்கிறது; இங்கு ஒருமை வடிவத்தையும் சமூகப் பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעֹנִי
  choice: துன்பத்திலிருந்து
  rationale: עֹנִי என்பதற்கு துன்பம், அவலம், வறுமை எனப் பொருள்கள் உண்டு. சங்கீதத்தின் மீட்பு மற்றும் நிலைமாற்றச் சூழலில் ‘துன்பம்’ பரந்த பொருளைத் தக்கவைக்கிறது; מִן என்பதன் பிரிவுப் பொருளை ‘இலிருந்து’ காட்டுகிறது.
- source_word: וַיָּשֶׂם
  choice: பெருகச் செய்கிறார்
  rationale: שׂים அடிப்படையில் ‘வைக்கிறார்/ஆக்குகிறார்’ எனப் பொருள்படும். குடும்பங்களை மந்தையைப்போல் ஆக்குதல் என்ற உருவகம் இங்கு எண்ணிக்கையிலும் செழிப்பிலும் பெருக்குவதை உணர்த்துவதால், தமிழில் கருத்தை இயல்பாகத் தெரிவிக்க ‘பெருகச் செய்கிறார்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כַּצֹּאן
  choice: ஒரு மந்தையைப்போல்
  rationale: צֹאן என்பது செம்மறியாடுகள் அல்லது வெள்ளாடுகள் அடங்கிய சிறுகால்நடை மந்தையைக் குறிக்கும் கூட்டுப்பெயர்; ‘மந்தை’ உருவகத்தையும் கூட்டுப் பொருளையும் காக்கிறது.
- source_word: מִשְׁפָּחוֹת
  choice: அவர்களுடைய குடும்பங்களை
  rationale: எபிரெயத்தில் உடைமைச் சுட்டு வெளிப்படையாக இல்லாவிட்டாலும், ஏழைகளுடன் குடும்பங்களுக்குள்ள உறவு சூழலில் மறைமுகமாக உள்ளது. தமிழில் ‘அவர்களுடைய’ என்பது அதை இயல்பாகத் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘குடும்பங்கள்’ என்பதுடன் மறைமுக உடைமைச் சுட்டை வழங்குதல்
  choice: அவர்களுடைய குடும்பங்களை
  alternative: குடும்பங்களை
  rationale: மூலத்தில் ‘குடும்பங்கள்’ என்று மட்டுமே இருந்தாலும், சூழலில் அவை மீட்கப்பட்ட ஏழைகளின் குடும்பங்கள். ‘அவர்களுடைய’ என்று சேர்ப்பது புதிய இறையியல் கருத்தை உருவாக்காமல் தமிழில் உறவைத் தெளிவாக்குகிறது.
- issue: மந்தையைப்போல் ஆக்குதல் என்ற உருவகத்தின் விளக்கம்
  choice: ஒரு மந்தையைப்போல் பெருகச் செய்கிறார்
  alternative: குடும்பங்களை ஒரு மந்தையைப்போல் வைக்கிறார்
  rationale: உருவகத்தைத் தக்கவைத்தபடியே அதன் சூழல்சார் பெருக்கப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. பாதுகாப்பு அல்லது மேய்ப்புக் கருத்தை மட்டும் எனத் தீர்மானித்து விடவில்லை.
