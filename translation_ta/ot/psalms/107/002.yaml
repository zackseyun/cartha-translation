  yaml_path: translation/ot/psalms/107/002.yaml
  text: Let the redeemed of Yahweh say so[a], whom he has redeemed from the hand of the foe,
translation:
  language: ta
  text: பகைவனின் கையிலிருந்து அவர் மீட்ட யாவேயின் மீட்கப்பட்டவர்கள் இதைச் சொல்லட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எதிரியின் கையிலிருந்து’ அல்லது ‘ஒடுக்குபவனின் கையிலிருந்து’ என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பெயர்ச்சொல் பகைவன், எதிரி, அல்லது ஒடுக்குபவன் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: சொல்லட்டும்
  rationale: சங்கீதத்தின் அறிவுறுத்தல் சூழலில் இந்த வினை வடிவம் விருப்பம் அல்லது அழைப்பை வெளிப்படுத்துகிறது. ஆகவே இயல்பான தமிழ் ஏவல் வடிவமான ‘சொல்லட்டும்’ பயன்படுத்தப்பட்டது.
- source_word: גְּאוּלֵי
  choice: மீட்கப்பட்டவர்கள்
  rationale: גאל என்பதிலிருந்து வந்த இவ்வடிவம் மீட்பைப் பெற்ற மக்களைக் குறிக்கிறது. ‘மீட்கப்பட்டவர்கள்’ என்பது அதன் செயல்பாட்டு மற்றும் இறையியல் பரப்பைத் தேவையின்றி குறுக்காமல் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெய வேதாகமத்திலுள்ள இறைபெயரைத் தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: אֲשֶׁר
  choice: —…அவர் மீட்டவர்கள்—
  rationale: தொடர்புச் சொல்லின் விளக்கப் பணியைத் தமிழில் இடைச்செருகப்பட்ட உறவுத்தொடராக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: גְּאָלָם
  choice: அவர் மீட்டவர்கள்
  rationale: முடிவுற்ற மீட்புச் செயலைக் காட்டுகிறது; மேலும் גאל என்ற ஒரே சொல்லின் எபிரெய மறுபயன்பாட்டை ‘மீட்கப்பட்டவர்கள் / மீட்டவர்கள்’ என்று பாதுகாக்கிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டிலிருந்து விடுவித்தல் என்ற எபிரெய உருவகத்தைத் தமிழிலும் புரியக்கூடிய வகையில் காக்கிறது.
- source_word: צָר
  choice: பகைவன்
  rationale: இங்கு இந்த ஒருமை பெயர்ச்சொல் நெருக்கடியை அல்ல, எதிரியாக அல்லது ஒடுக்குபவனாக இருப்பவரைக் குறிப்பது இயல்பான வாசிப்பு. ‘பகைவன்’ கவிதை நடைக்கும் பொருளுக்கும் ஏற்றது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைபெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: גאל என்ற மீட்பு மொழியின் பொருள்
  choice: மீட்கப்பட்டவர்கள் / மீட்டவர்கள்
  alternative: விலை கொடுத்து விடுவிக்கப்பட்டவர்கள்
  rationale: மூலச்சொல் இருமுறை வருவதால் அதன் மறுபயன்பாடு காக்கப்பட்டது. ‘மீட்பு’ என்பது தெய்வீக விடுதலையைத் தெரிவிக்கிறது; அதை வெறும் வணிகப் பரிமாற்றமாகக் குறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்குரிய சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டது. உறவுத்தொடரை இருபுற நீள்கோடுகளுக்குள் அமைத்ததால் மூலத்தின் விளக்க அமைப்பும் גאל என்ற சொல்லின் மறுபயன்பாடும் தெளிவாகத் தங்குகின்றன.
