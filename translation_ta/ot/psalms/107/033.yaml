  text: יָשֵׂ֣ם נְהָר֣וֹת לְ/מִדְבָּ֑ר וּ/מֹצָ֥אֵי מַ֝֗יִם לְ/צִמָּאֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/033.yaml
  text: He turns rivers into a wilderness[a], and springs of water into thirsty ground.
translation:
  language: ta
  text: 'அவர் ஆறுகளை வனாந்தரமாகவும்,

    நீரூற்றுகளைத் தாகமுற்ற நிலமாகவும்[a] மாற்றுகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வறண்ட நிலமாக.’ எபிரெயச் சொல் நேரடியாக ‘தாகம்’ அல்லது ‘தாகநிலை’ என்பதைக் குறிக்கிறது; இங்கு அது நீரற்ற வறண்ட நிலையைக் குறிக்கப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: மாற்றுகிறார்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்/ஆக்குதல்’; இங்கு ஒன்று வேறொரு நிலையாக மாறுவதைச் சுட்டுவதால், ‘மாற்றுகிறார்’ என்பது தமிழில் இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: נְהָרוֹת
  choice: ஆறுகளை
  rationale: பன்மைச் சொல்லான נְהָרוֹת பொதுவாக ‘ஆறுகள்’ என்பதைக் குறிக்கிறது; இது நேரடியான தமிழ் இணைச்சொல்.
- source_word: לְמִדְבָּר
  choice: வனாந்தரமாக
  rationale: מִדְבָּר என்பது வனாந்தரம் அல்லது பாலைவனம் எனப் பொருள்படலாம். நீரற்ற, பாழான வெளியைக் குறிக்கும் பரந்த பொருளையும் கவிதைநயமான எதிர்மறை ஒப்புமையையும் ‘வனாந்தரம்’ காக்கிறது; לְ விளைவு நிலையை இங்கு ‘-ஆக’ வெளிப்படுத்துகிறது.
- source_word: וּמֹצָאֵי מַיִם
  choice: நீரூற்றுகளை
  rationale: מֹצָאֵי מַיִם என்பதன் சொற்பொருள் ‘நீர் புறப்படும் இடங்கள்/நீராதாரங்கள்.’ சூழலில் நீர் வெளிப்படும் ஊற்றுகளைக் குறிப்பதால் ‘நீரூற்றுகள்’ இயல்பான தெரிவாகும்.
- source_word: לְצִמָּאוֹן
  choice: தாகமுற்ற நிலமாக
  rationale: צִמָּאוֹן என்பதற்கு நேரடியாக ‘தாகம்/தாகநிலை’ என்று பொருள்; இங்கு அது நீரற்ற வறண்ட இடத்தைக் குறிக்கிறது. ‘தாகமுற்ற நிலம்’ மூலத்தின் உருவகத்தைத் தக்கவைத்தபடி தமிழில் புரிந்துகொள்ளத்தக்கதாக உள்ளது.
