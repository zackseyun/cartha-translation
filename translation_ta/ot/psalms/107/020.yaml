  yaml_path: translation/ot/psalms/107/020.yaml
  text: He sent his word and healed them[a], and delivered them from their pits.
translation:
  language: ta
  text: அவர் தமது வார்த்தையை அனுப்பி அவர்களைக் குணமாக்கினார்; அவர்களுடைய படுகுழிகளிலிருந்து[a] அவர்களை விடுவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய அழிவுகளிலிருந்து.” எபிரெயச் சொல் படுகுழிகள், கல்லறைகள் அல்லது அழிவு நிலைகளைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: அனுப்பினார்
  rationale: சங்கீதம் ஆண்டவரின் செயல்களைப் பின்னோக்கி எடுத்துரைக்கும் சூழலில், எபிரெய நிறைவுறா வினை வடிவத்தைத் தமிழில் இறந்தகாலமாக வழங்குவது இயல்பானது.
- source_word: דְּבָרוֹ
  choice: தமது வார்த்தையை
  rationale: ‘வார்த்தை’ என்பது எபிரெயச் சொல்லின் சுருக்கத்தையும், கடவுளுடைய உரையின் செயலாற்றும் தன்மையையும் காக்கிறது; அதைத் தனிப்பட்ட முறையில் ‘கட்டளை’ என்றோ ஒரு நபரைக் குறிப்பதாகவோ வரையறுக்கவில்லை.
- source_word: וְיִרְפָּאֵם
  choice: அவர்களைக் குணமாக்கினார்
  rationale: רפא என்பதன் நேரடியான பொருள் ‘குணமாக்குதல்’; பின்சேர்க்கை, சங்கீதத்தில் துன்புற்றிருந்த மக்களைக் குறிக்கிறது.
- source_word: וִימַלֵּט
  choice: அவர்களை விடுவித்தார்
  rationale: மלט என்பதன் பியேல் வடிவம் ஒருவரைத் தப்புவித்தல் அல்லது விடுவித்தல் என்ற பொருளைத் தருகிறது; ‘விடுவித்தார்’ என்பது இங்கு இயல்பாகவும் மீட்பின் தொனியுடனும் உள்ளது.
- source_word: מִשְּׁחִיתוֹתָם
  choice: அவர்களுடைய படுகுழிகளிலிருந்து
  rationale: இச்சொல்லின் பன்மையையும் மூன்றாம் நபர் பன்மைப் பின்சேர்க்கையையும் பிரதிபலிக்கிறது. ‘படுகுழிகள்’ என்பது மரண ஆபத்தையும் அழிவையும் உணர்த்தும் இயல்பான தமிழ்ச் சொல்; ‘அழிவுகள்’ என்ற விரிவான பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘தமது வார்த்தை’ என்பதற்குத் தேவைக்கு அதிகமான இறையியல் அடையாளம் அளித்தல்
  choice: கடவுளின் செயலாற்றும் உரை என்ற அளவில் ‘தமது வார்த்தை’ என்று வைத்தல்
  alternative: ‘தமது கட்டளை’ அல்லது தனி நபராக உருவகிக்கப்பட்ட ‘வார்த்தை’
  rationale: வசனம் கடவுள் தமது வார்த்தையை அனுப்பிக் குணமாக்கி விடுவித்தார் என்று கூறுகிறது; ஆனால் அந்த வார்த்தையை ஒரு குறிப்பிட்ட நபருடன் வெளிப்படையாக அடையாளப்படுத்தவில்லை.
- issue: מִשְּׁחִיתוֹתָם என்பதன் உருவக அல்லது நேரடி பொருள்
  choice: முதன்மை உரையில் ‘படுகுழிகள்’ என்று வைத்து, பரந்த ‘அழிவுகள்’ என்ற பொருளை அடிக்குறிப்பில் தருதல்
  alternative: முதன்மை உரையில் ‘அழிவுகளிலிருந்து’ அல்லது ‘கல்லறைகளிலிருந்து’
  rationale: எபிரெயச் சொல் குழி, கல்லறை அல்லது அழிவு நிலையைக் குறிக்கக்கூடியதால், அதன் உண்மையான பொருள் விரிவை ஒரு பொருளுக்குள் மட்டுமே சுருக்காமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வாசிக்க எளிதானதும் வழிபாட்டு மரியாதை கொண்டதுமான நடை. ‘தமது’ என்பது எழுவாயான கடவுளையே மீண்டும் சுட்டுகிறது; அரிதான எபிரெயச் சொல்லின் பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
