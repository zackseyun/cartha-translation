    rationale: In 'யெகோவாவின் ... அவர்கள் அவருக்கு நன்றி செலுத்தட்டும்,' the antecedent of 'அவருக்கு' is delayed and the Hebrew לַיהוָה is not rendered at its natural point. A dative phrase, 'யாவேக்கு,' is clearer and more faithful.
