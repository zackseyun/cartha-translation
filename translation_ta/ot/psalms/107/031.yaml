source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/031.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: ta
  text: யாவேக்கு[b] அவருடைய மாறாத அன்புக்காகவும், மனிதர்களுக்காக[a] அவர் செய்த அதிசயச் செயல்களுக்காகவும் அவர்கள் நன்றி செலுத்தட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “மனிதனின் மகன்களுக்கு”; அதாவது, மனிதகுலத்துக்கு.
    reason: lexical_alternative
  - marker: b
    text: “யாவே” என்பது יהוה (YHWH) என்ற இறைப் பெயரின் ஒலிபெயர்ப்பு; மாற்று வடிவம் “யெகோவா.”
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּ
  choice: நன்றி செலுத்தட்டும்
  rationale: ידה என்பதன் ஹிஃபில் நிறைவுறா வடிவம் இங்குள்ள சங்கீதப் பல்லவியில் அறிவுறுத்தல் அல்லது விருப்பத்தை வெளிப்படுத்துகிறது; தமிழில் “நன்றி செலுத்தட்டும்” இயல்பாகவும் கண்ணியமாகவும் அதைப் பிரதிபலிக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: לְ என்பது நன்றியின் மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது. יהוה என்ற தனிப்பெயருக்கு தமிழில் பரவலாக அறியப்பட்ட “யெகோவா” பயன்படுத்தப்பட்டது; “யாவே” என்பது மாற்று ஒலிபெயர்ப்பு.
- source_word: חַסְדּוֹ
  choice: அவருடைய மாறாத அன்பு
  rationale: חֶסֶד என்பது உறுதியான பற்றும் இரக்கமிக்க அன்பும் சேர்ந்த கருத்தைக் கொண்டது. “மாறாத அன்பு” அதன் நீடித்த நம்பகத்தன்மையை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: וְנִפְלְאוֹתָיו
  choice: அவர் செய்த அதிசயச் செயல்கள்
  rationale: נִפְלָאוֹת என்பது வியப்பை உண்டாக்கும் அசாதாரண செயல்களைக் குறிக்கிறது; வினைச்செயல் சார்ந்த பொருளைத் தெளிவாக்க “அவர் செய்த அதிசயச் செயல்கள்” என மொழிபெயர்க்கப்பட்டது.
- source_word: לִבְנֵי אָדָם
  choice: மனிதர்களுக்காக
  rationale: בְּנֵי אָדָם என்பதன் சொற்பொருள் “மனிதனின் மகன்கள்”; இங்கு அது மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. לְ சூழலில் இச்செயல்கள் மனிதர்களின் நன்மைக்காகச் செய்யப்பட்டவை என்பதை “மனிதர்களுக்காக” இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; பட்டப்பெயரால் மாற்றாமல் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது. எபிரெய ஒலிப்பை மீட்டமைக்கும் மாற்று வடிவமாக “யாவே” அடிக்குறிப்பில் தரப்பட்டது.
- issue: בני אדם என்பதன் பிரதிநிதித்துவப் பொருள்
  choice: மனிதர்கள்
  alternative: மனிதனின் பிள்ளைகள்
  rationale: இந்த எபிரெய மரபுத்தொடர் இலக்கணரீதியாக ஆண்பால் வடிவம் கொண்டிருந்தாலும், இங்கு மனிதகுலம் முழுவதையும் குறிக்கிறது. சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு கண்ணியத்தைத் தக்கவைத்தும் சாதாரண வாசகர்களுக்கு எளிதில் புரியுமாறும் வடிவமைக்கப்பட்டது. மூலத்தின் இணை அமைப்பைத் தமிழின் இயல்புக்கேற்ப இரு “-க்காகவும்” தொடர்களால் வெளிப்படுத்துகிறது.
