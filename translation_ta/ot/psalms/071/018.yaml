source:
  edition: WLC
  text: וְ/גַ֤ם עַד זִקְנָ֨ה וְ/שֵׂיבָה֮ אֱלֹהִ֪ים אַֽל תַּעַ֫זְבֵ֥/נִי עַד אַגִּ֣יד זְרוֹעֲ/ךָ֣ לְ/ד֑וֹר לְ/כָל יָ֝ב֗וֹא גְּבוּרָתֶֽ/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/018.yaml
  text: Even to old age and gray hairs[a], O God, do not forsake me, until I declare your arm to the next generation[b], your might to everyone who is to come.
translation:
  language: ta
  text: இறைவனே, முதுமையும் நரையும் வந்தபோதிலும், அடுத்த தலைமுறைக்கு உமது புயத்தையும்[a], இனி வரவிருக்கும் அனைவருக்கும்[b] உமது வல்லமையையும் நான் அறிவிக்கும்வரை என்னைக் கைவிடாதீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது வலிமையை” அல்லது “உமது ஆற்றலை.” எபிரேய மொழியில் “புயம்” என்பது தேவனுடைய செயலாற்றும் வல்லமையைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வருங்காலத் தலைமுறைகள் அனைத்துக்கும்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם עַד זִקְנָה וְשֵׂיבָה
  choice: முதுமையும் நரையும் வந்தபோதிலும்
  rationale: முதுமை, நரை என்ற இரு நேரடியான உருவகங்களையும் காத்து, முந்தைய வேண்டுதலின் தொடர்ச்சியையும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: இறைவனே
  rationale: நேரடியாக அழைக்கும் விளிவடிவத்தைத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: אַל תַּעַזְבֵנִי
  choice: என்னைக் கைவிடாதீர்
  rationale: עזב என்பதன் கைவிடுதல் அல்லது துறத்தல் என்ற பொருளைச் சங்கீத வேண்டுதலுக்கேற்ற தெளிவான தமிழில் தருகிறது.
- source_word: עַד אַגִּיד
  choice: நான் அறிவிக்கும்வரை
  rationale: தெய்வீக உதவி தொடர வேண்டும் என்ற கால எல்லையையும், பிறருக்கு வெளிப்படையாக எடுத்துரைக்கும் செயலையும் காக்கிறது.
- source_word: זְרוֹעֲךָ
  choice: உமது புயம்
  rationale: தேவனுடைய செயலாற்றும் வல்லமையைக் குறிக்கும் எபிரேய உடலுறுப்பு உருவகத்தை விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: לְדוֹר
  choice: அடுத்த தலைமுறைக்கு
  rationale: சங்கீதக்காரருக்குப் பின் வரும் தலைமுறையைச் சூழலில் தெளிவாகக் குறிக்கிறது.
- source_word: לְכָל יָבוֹא
  choice: இனி வரவிருக்கும் அனைவருக்கும்
  rationale: כָּל உடன் வரும் ஒருமை வினையின் கூட்டுப் பொருளையும் எதிர்கால நோக்கையும் காக்கிறது; இதைத் தலைமுறைகள் மட்டுமாகச் சுருக்கவில்லை.
- source_word: גְּבוּרָתֶךָ
  choice: உமது வல்லமை
  rationale: வலிமை, வல்லமை, வல்ல செயல்கள் ஆகிய பொருள் பரப்பைத் திறந்தவாறு வைத்துக்கொண்டு, இங்கு இணைவரியில் இயல்பாக அமைகிறது.
theological_decisions:
- issue: זְרוֹעֲךָ என்பதிலுள்ள தேவனுடைய ‘புயம்’ என்ற உருவகத்தை வைத்திருக்க வேண்டுமா, நேரடியாக ‘வல்லமை’ என்று விளக்க வேண்டுமா
  choice: முதன்மை உரையில் ‘உமது புயம்’ என்று உருவகத்தை வைத்தல்
  alternative: உமது வலிமை; உமது ஆற்றல்
  rationale: எபிரேய உரை தேவனுடைய செயலாற்றும் வல்லமையை உடலுறுப்பு உருவகத்தால் கூறுகிறது. அதை வைத்திருப்பது கவித்துவத்தையும் இறையியல் நுணுக்கத்தையும் காக்கிறது; அடுத்துள்ள ‘வல்லமை’ அதன் பொருளைச் சூழலில் தெளிவுபடுத்துகிறது.
- issue: לְדוֹר ... לְכָל יָבוֹא என்பவற்றின் எதிர்காலக் கேட்போர் பரப்பு
  choice: ‘அடுத்த தலைமுறை’ என்பதிலிருந்து ‘இனி வரவிருக்கும் அனைவரும்’ என விரிவடையும் அமைப்பை வைத்தல்
  alternative: இரண்டையும் தலைமுறைச் சொற்களால் ‘மற்றொரு தலைமுறைக்கு ... வருங்காலத் தலைமுறைகள் அனைத்துக்கும்’ என மொழிபெயர்த்தல்
  rationale: எபிரேய இணைவரி முதலில் ஒரு தலைமுறையைக் குறிப்பிட்டு, பின்னர் வரவிருக்கும் அனைவரையும் நோக்கிப் பரப்பை விரிவாக்குவது போல உள்ளது. அந்த இயல்பான பதற்றத்தை ஒரே கருத்தாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவனே,’ ‘உமது,’ ‘கைவிடாதீர்’ ஆகியவை உயர்வான சங்கீதத் தொனியைத் தருகின்றன; பழமையான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
