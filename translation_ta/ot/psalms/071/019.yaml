  yaml_path: translation/ot/psalms/071/019.yaml
  text: And your righteousness[a], O God, reaches to the heights—you who have done great things. O God[b], who is like you?
translation:
  language: ta
  text: கடவுளே, உமது நீதி[a] உயர்ந்த இடம்வரை[b] எட்டுகிறது; நீர் மகத்தான செயல்களைச் செய்திருக்கிறீர். கடவுளே, உமக்கு நிகரானவர் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நியாயம்.’ எபிரெயச் சொல் சூழலின்படி நீதியையோ நியாயத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘வானம்வரை விரிகிறது.’ எபிரெயச் சொற்றொடர் நேரடியாக, ‘உயர்ந்த இடம்வரை’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צִדְקָתְ/ךָ
  choice: உமது நீதி
  rationale: צְדָקָה என்பது சூழலின்படி நீதித்தன்மையையும் நியாயத்தையும் குறிக்கலாம். இங்கு கடவுளின் பண்பையும் செயல்களையும் விரிவாகப் புகழ்வதால், தமிழில் இயல்பாக இரு நிழற்பொருள்களையும் தாங்கக்கூடிய ‘நீதி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இரு இடங்களிலும் நேரடி அழைப்பு இருப்பதால், தமிழின் விளிவேற்றுமை வடிவமான ‘கடவுளே’ பயன்படுத்தப்பட்டது.
- source_word: עַד מָרוֹם
  choice: உயரங்கள்வரை எட்டுகிறது
  rationale: ‘உயரம்/உயர்ந்த இடம் வரை’ என்ற எபிரெய இடவியல் உருவகத்தைப் பாதுகாக்கிறது; מָרוֹם என்பதைத் திட்டவட்டமாக ‘வானம்’ என்று விளக்குவதைத் தவிர்க்கிறது.
- source_word: אֲשֶׁר עָשִׂיתָ גְדֹלוֹת
  choice: நீர் மகத்தானவற்றைச் செய்திருக்கிறீர்
  rationale: אֲשֶׁר அறிமுகப்படுத்தும் தொடர்பை தமிழில் இயல்பான தனி வாக்கியமாக வழங்குகிறது; גְדֹלוֹת என்பதன் விரிவான பொருளை ‘மகத்தானவை’ தக்கவைக்கிறது.
- source_word: מִי כָמוֹךָ
  choice: உமக்கு நிகரானவர் யார்?
  rationale: ஒப்பற்ற தன்மையை வலியுறுத்தும் எபிரெய வினாவைத் தெளிவான, கண்ணியமான நவீன தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கடவுளைக் குறிக்கும் צדקה என்பதன் மொழிபெயர்ப்பு
  choice: நீதி
  alternative: நியாயம் / நீதித்தன்மை
  rationale: இங்கு கடவுளின் நீதியான பண்பும் அவரது மகத்தான செயல்களும் புகழப்படுகின்றன. நீதித்தீர்ப்பு மட்டும் என்று பொருளைக் குறுக்காமல் பரந்த அறநெறிப் பொருளை ‘நீதி’ தக்கவைக்கிறது; ‘நியாயம்’ அடிக்குறிப்பில் மாற்றாகக் கொடுக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமைக்காக ‘உமது/நீர்/உமக்கு’ வடிவங்கள் தொடர்ச்சியாக வைக்கப்பட்டுள்ளன. மூலத்தின் ‘உயரம்’ உருவகம் குறிப்பாக ‘வானம்’ என்று தீர்மானிக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
