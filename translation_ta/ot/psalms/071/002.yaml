  source_fidelity: 'The draft accurately represents the Hebrew sequence and parallel petitions: בְּצִדְקָתְךָ, תַּצִּילֵנִי, וּתְפַלְּטֵנִי, the ear-inclining idiom, and וְהוֹשִׁיעֵנִי. ‘நீதியினால்’ is a valid instrumental rendering of בְּצִדְקָתְךָ, while the footnote appropriately preserves an alternative construal and the possible ‘justice’ sense.'
