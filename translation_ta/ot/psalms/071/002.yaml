  yaml_path: translation/ot/psalms/071/002.yaml
  text: In your righteousness rescue me and deliver me[a]; incline your ear to me and save me.
translation:
  language: ta
  text: உமது நீதியினால் என்னை மீட்டு, என்னை விடுவியும்[a]; உமது செவியை எனக்குச் சாய்த்து, என்னைக் காப்பாற்றும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது நீதியின்படி.” “நீதி” என்பதை “நியாயம்” என்றும் புரிந்துகொள்ளலாம்.
    reason: בְּצִדְקָתְךָ என்பதில் உள்ள בְּ முன்னிடைச்சொல் கருவி அல்லது அடிப்படை/ஒத்திசைவு உறவைக் குறிக்கலாம்; צְדָקָה என்பதற்கு ‘நீதி’ மற்றும் ‘நியாயம்’ ஆகிய பொருள் வாய்ப்புகள் உள்ளன.
lexical_decisions:
- source_word: בְּצִדְקָתְךָ
  choice: உமது நீதியினால்
  rationale: בְּ என்ற முன்னிடைச்சொல்லை இங்கு கருவி அல்லது அடிப்படைப் பொருளில் இயல்பான தமிழில் வெளிப்படுத்துகிறது. צְדָקָה என்பதன் நேர்மை, உண்மைத்தன்மை, நீதியான செயல் ஆகிய பரப்பையும் ‘நீதி’ தக்கவைக்கிறது.
- source_word: תַּצִּילֵנִי
  choice: என்னை மீட்டு
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்து மீட்பதைக் குறிக்கிறது. அடுத்த வினையுடன் உள்ள கவிதை இணைநிலையைத் தக்கவைத்தபடியே சொல் மீளுரைப்பைத் தவிர்க்க ‘மீட்டு’ பயன்படுத்தப்படுகிறது.
- source_word: וּתְפַלְּטֵנִי
  choice: என்னை விடுவியும்
  rationale: פלט என்பதன் பியேல் வடிவம் தப்பச் செய்தல் அல்லது பாதுகாப்பாக விடுவித்தல் என்ற நுண்பொருளைக் கொண்டது. ‘விடுவியும்’ அந்த வேறுபாட்டை இயல்பாகக் காட்டுகிறது.
- source_word: הַטֵּה
  choice: சாய்த்து
  rationale: ‘செவி’ என்பதுடன் வரும் נטה, கவனித்துக் கேட்பதற்காகச் செவியைச் சாய்க்கும் உருவகத்தைத் தருகிறது. தமிழிலும் அந்த உருவகம் இயல்பாக உள்ளது.
- source_word: אָזְנְךָ
  choice: உமது செவியை
  rationale: எபிரேயத்தின் உடல் உறுப்புச் சித்திரத்தை நேரடியாகத் தக்கவைத்து, கவனமாகக் கேட்கும்படியான வேண்டுதலை வெளிப்படுத்துகிறது.
- source_word: וְהוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றும்
  rationale: ישע என்பதன் ஹிஃபில் வடிவம் காப்பாற்றுதல் அல்லது இரட்சித்தல் என்பதைக் குறிக்கும். உடனடி ஆபத்திலிருந்து விடுதலை வேண்டப்படும் இச்சூழலில் ‘காப்பாற்றும்’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
theological_decisions:
- issue: தேவனை நோக்கிய வேண்டுதலில் צְדָקָה என்பதன் பொருள்
  choice: நீதி
  alternative: நியாயம்
  rationale: இச்சொல் தேவனுடைய நேர்மையான, உண்மையுள்ள குணத்தையும் அதற்கேற்ற செயலையும் குறிக்கக்கூடும்; ‘நீதி’ அந்த விரிந்த பொருளைப் பாதுகாக்கிறது. நீதித்தீர்ப்பு சார்ந்த ‘நியாயம்’ என்பதும் சாத்தியமான வாசிப்பாக அடிக்குறிப்பில் தரப்படுகிறது.
- issue: בְּ முன்னிடைச்சொல்லின் உறவு
  choice: நீதியினால்
  alternative: நீதியின்படி
  rationale: மீட்பின் கருவி அல்லது அடிப்படையாக தேவனுடைய நீதியை வேண்டுதல் இயல்பான முதன்மை வாசிப்பு. அதே நேரத்தில், அவருடைய நீதியான குணத்திற்கு ஏற்ப செயல்படுமாறு வேண்டுவதாகவும் எபிரேயத்தைப் புரிந்துகொள்ளலாம்; அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, அதே நேரத்தில் சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய மரியாதையை ‘உமது’ மற்றும் மரியாதை ஏவல் வடிவங்கள் தக்கவைக்கின்றன; எபிரேயக் கவிதையின் இணை வினைகளும் செவியைச் சாய்க்கும் உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
