  edition: WLC
  text: יִמָּ֣לֵא פִ֭/י תְּהִלָּתֶ֑/ךָ כָּל הַ֝/יּ֗וֹם תִּפְאַרְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/008.yaml
  text: My mouth will be filled with your praise[b][a], with your splendor all day long.
translation:
  language: ta
  text: நாள் முழுவதும், என் வாய் உமது புகழாலும் உமது மாட்சியாலும் நிரம்பியிருக்கும்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாள் முழுவதும், என் வாய் உமது புகழாலும் உமது மாட்சியாலும் நிரம்பியிருக்கிறது”; ஒருவேளை, “நாள் முழுவதும், என் வாய் உமது புகழாலும் உமது மாட்சியாலும் நிரம்பட்டும்.” கவிதைச் சூழலில் எபிரெய முற்றுப்பெறா வினை வடிவம் எதிர்கால, நிகழ்கால, அல்லது வேண்டுதல் நுணுக்கத்தைக் கொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “மாட்சி” என்பதற்கு “மகிமை,” “அழகு,” அல்லது “மாண்பு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלֵא
  choice: நிரம்பியிருக்கும்
  rationale: מלא என்பதன் நிஃபால் முற்றுப்பெறா வடிவம். சூழலில் எதிர்கால அல்லது தொடர்நிலைப் பொருள் இயல்பாக இருப்பதால், செயப்பாட்டு உணர்வையும் காலத் தெளிவின்மையின் ஒரு பகுதியையும் இந்தச் சொல் காக்கிறது.
- source_word: פִי
  choice: என் வாய்
  rationale: எபிரெயக் கவிதையில் பேச்சையும் புகழ்ச்சியையும் குறிக்கும் இயல்பான உடலுறுப்பு உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: תְּהִלָּתֶךָ
  choice: உம்மைப் புகழ்வதால்
  rationale: இறைவனை நோக்கிய அல்லது அவரைப் பற்றிய புகழ்ச்சியே கருத்து. தமிழில் ‘உமது புகழ்ச்சியால்’ என்பதைவிட ‘உம்மைப் புகழ்வதால்’ இயல்பாகவும் பொருள் தெளிவாகவும் உள்ளது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: காலநீடிப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: תִּפְאַרְתֶּךָ
  choice: உமது மகிமையை
  rationale: תפארת என்பது மகிமை, மாண்பு, அழகு, மாட்சிமை போன்ற பொருள்களைக் கொண்டது. இங்கு இறைவனின் ஒளிவாய்ந்த மேன்மையைக் குறிக்க ‘மகிமை’ இயல்பான கவிதைச் சொல்; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
theological_decisions:
- issue: יִמָּלֵא என்பதன் முற்றுப்பெறா வினை வடிவத்தின் நுணுக்கம்
  choice: எதிர்கால/தொடர்நிலை கூற்றாக ‘நிரம்பியிருக்கும்’
  alternative: ‘நிரம்பியிருக்கிறது’ அல்லது வேண்டுதலாக ‘நிரம்பட்டும்’
  rationale: கவிதைச் சூழலில் இந்த எபிரெய வடிவம் எதிர்காலம், நிகழ்காலத் தொடர்நிலை, அல்லது விருப்ப/வேண்டுதல் நுணுக்கம் பெறலாம். முதன்மை உரை எதிர்காலத் தொடர்நிலையைத் தேர்ந்தெடுக்கிறது; பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை மரியாதையுடன் ஒருமையில் குறிக்கும் ‘உம்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. இரண்டாம் அடியில் எபிரெயத்தில் வெளிப்படையாக இல்லாத வினை, முதல் அடியின் ‘வாய்’ உருவகத்தை தமிழில் இயல்பாக நிறைவு செய்ய ‘பேசும்’ என அளவாகச் சேர்க்கப்பட்டுள்ளது.
