  to: நாள் முழுவதும், என் வாய் உமது புகழாலும் உமது மாட்சியாலும் நிரம்பியிருக்கும்[a][b].
  rationale: The revision removes the unsupported separate verb “பேசும்” and renders both “your praise” and “your splendor” as the coordinated content with which the speaker's mouth is filled. It preserves the imperfect's ambiguity in footnote a and retains a lexical-alternative note for תפארת.
