lexical_decisions:
- source_word: אֱלֹהַי
  choice: என் கடவுளே
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் வரும் நேரடி அழைப்பு; நவீனத் தமிழில் இயல்பான விளி வடிவம்.
- source_word: פַּלְּטֵנִי
  choice: என்னை விடுவியும்
  rationale: ஆபத்திலிருந்து தப்புவித்தல் அல்லது விடுவித்தல் என்ற வேண்டுகோளைச் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: מִיַּד רָשָׁע
  choice: பொல்லாதவனின் கையிலிருந்து
  rationale: יָד என்பதன் கை/அதிகாரம் என்ற எபிரெய உருவகத்தைத் தமிழிலும் தெளிவாகப் பேணுகிறது; רָשָׁע இங்கு ஒருமை நபரைக் குறிக்கிறது.
- source_word: מִכַּף
  choice: பிடியிலிருந்து
  rationale: כַּף என்பதன் சொற்பொருள் ‘உள்ளங்கை’; இவ்விடத்தில் கட்டுப்படுத்தும் பிடி அல்லது அதிகாரம் என்பதே சூழல்பொருள்.
- source_word: מְעַוֵּל וְחוֹמֵץ
  choice: அநியாயம் செய்து வன்முறையில் ஈடுபடுகிறவன்
  rationale: இரு ஒருமைச் செயப்பெயரெச்சங்களும் ஒரே எதிரியை அநியாயம் செய்கிறவனாகவும் வன்முறையாளனாகவும் சித்தரிப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
