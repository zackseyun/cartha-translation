lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: என்னைத் தள்ளிவிடாதீர்
  rationale: שלך என்பதன் ஹிஃபில் வடிவம் ஒருவரைத் தூக்கி எறிவது அல்லது வேண்டாமென ஒதுக்கிவிடுவது போன்ற வலுவான உருவகத்தைத் தருகிறது. ‘தள்ளிவிடாதீர்’ என்பது அந்த உருவகத்தையும் விண்ணப்பத்தின் கண்ணியமான தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: לְעֵת זִקְנָה
  choice: முதுமைக் காலத்தில்
  rationale: עֵת என்பது காலம் அல்லது பருவத்தையும், זִקְנָה என்பது முதுமையையும் குறிக்கிறது. ‘முதுமைக் காலத்தில்’ என்பது இரு கூறுகளையும் சுருக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּכְלוֹת
  choice: தீர்ந்துபோகும்போது
  rationale: 'כלה என்பதன் infinitive construct-உடன் வரும் כִּ காலச்சூழலைக் குறிக்கிறது: வலிமை முடிவடையும் அல்லது செலவழிந்து போகும் நேரம். ‘தீர்ந்துபோகும்போது’ என்பது படிப்படியாகக் குறைந்து முடிவதைத் தெளிவாகக் காட்டுகிறது.'
- source_word: כֹּחִי
  choice: என் வலிமை
  rationale: כֹּחַ என்பது வலிமை, ஆற்றல், பலம் ஆகியவற்றைக் குறிக்கலாம். முதுமையின் சூழலில் ‘என் வலிமை’ என்பது தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: תַּעַזְבֵנִי
  choice: என்னைக் கைவிடாதீர்
  rationale: עזב என்பது விட்டுவிடுதல், கைவிடுதல், பிரிதல் ஆகிய அர்த்தங்களைக் கொண்டது. ‘கைவிடாதீர்’ என்பது சங்கீத விண்ணப்பத்தின் உறவுசார் தீவிரத்தை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: אַל
  choice: —ஆதீர்
  rationale: אַל உடன் வரும் imperfect/jussive தடை அல்லது தீவிரமான எதிர்மறை வேண்டுதலைக் குறிக்கிறது. தமிழில் மரியாதையான வேண்டுதலுக்குரிய ‘தள்ளிவிடாதீர் / கைவிடாதீர்’ வடிவங்கள் இதை இயல்பாக வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: முதுமையிலும் குறையும் வலிமையிலும் இறைவனின் உடனிருப்பைக் கோரும் விண்ணப்பம்
  choice: முதுமையில் தன் வலிமை தீரும் நேரத்தில் கடவுள் தன்னை நிராகரிக்கவோ கைவிடவோ வேண்டாம் எனச் சங்கீதக்காரன் நேரடியாக மன்றாடுகிறார்.
  alternative: முதுமைக்கு விசேஷ முக்கியத்துவம் தராமல், துன்பத்தில் உதவி கேட்கும் பொதுவான விண்ணப்பமாக வாசித்தல்.
  rationale: மூலவசனம் ‘முதுமைக் காலம்’ என்றும் ‘என் வலிமை தீர்ந்துபோகும்போது’ என்றும் வெளிப்படையாக இணைக்கிறது. ஆகவே முதுமையின் பலவீனத்தில் கடவுளைச் சார்ந்திருக்கும் நேரடியான பொருள் காக்கப்படுகிறது; இதற்கு அப்பாற்பட்ட கோட்பாட்டுக் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான ஜெபநடை பயன்படுத்தப்பட்டுள்ளது. ‘தள்ளிவிடாதீர்’ மூலத்தின் உருவக வலிமையையும், ‘கைவிடாதீர்’ உறவுசார் விண்ணப்பத்தையும் வேறுபடுத்திக் காக்கின்றன.
