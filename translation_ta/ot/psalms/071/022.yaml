base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
translation:
  language: ta
  text: என் இறைவனே, உமது உண்மைத்தன்மைக்காக[a][c] நானும் யாழால் உம்மைப் புகழ்வேன்; இஸ்ரயேலின் பரிசுத்தரே, கின்னரத்தால்[b] உமக்கு இசையிசைப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது உண்மைக்காக.” எபிரெயச் சொல் உண்மையையும் உண்மைத்தன்மையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு குறிப்பிடப்படும் நெபேல், கின்னோர் ஆகிய பழங்கால நரம்பிசைக் கருவிகளின் துல்லியமான வடிவமும் அவற்றுக்கிடையிலான வேறுபாடும் உறுதியாகத் தெரியவில்லை; இங்கே அவை முறையே “யாழ்,” “கின்னரம்” என்று மொழிபெயர்க்கப்பட்டுள்ளன.
    reason: cultural_note
  - marker: c
    text: அல்லது, “யாழால் உம்மையும் உமது உண்மைத்தன்மையையும் புகழ்வேன், என் இறைவனே.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: நானும்
  rationale: גַּם உடன் வரும் தனிப்பட்ட பதிலிப்பெயர் தொடர்ச்சியையும் வலியுறுத்தலையும் காட்டுகிறது; ‘நானும்’ என்பது இயல்பான தமிழில் இரண்டையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אוֹדְךָ
  choice: உம்மைப் புகழ்வேன்
  rationale: ידה என்பதன் இவ்வழிபாட்டுச் சூழலுக்குரிய பொருள் ‘புகழ்தல்’ அல்லது ‘நன்றி செலுத்துதல்’; இணையான இசைச்சொற்றொடருக்கு ஏற்றவாறு ‘புகழ்வேன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בִכְלִי נֶבֶל
  choice: யாழால்
  rationale: כְּלִי என்ற பொதுச்சொல்லை נֶבֶל என்ற இசைக்கருவிப் பெயர் குறிப்பாக்குகிறது. அதன் துல்லியமான வடிவம் தெரியாததால், பழமையான நரம்பிசைக் கருவியைக் குறிக்கும் பொதுவான ‘யாழ்’ பயன்படுத்தப்பட்டது.
- source_word: אֲמִתְּךָ
  choice: உமது உண்மைத்தன்மைக்காக
  rationale: אֱמֶת என்பது உண்மை, நம்பகத்தன்மை, உண்மைத்தன்மை ஆகிய பொருள்களைத் தரலாம். இங்கு இறைவனின் நம்பத்தகுந்த குணம் புகழ்ச்சிக்கான காரணமாகக் கொள்ளப்பட்டதால் ‘உண்மைத்தன்மை’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருளும் இலக்கணத் தொடர்பும் அடிக்குறிப்புகளில் வைக்கப்பட்டுள்ளன.
- source_word: אֱלֹהָי
  choice: என் இறைவனே
  rationale: உடைமைப் பொருளையும் நேரடி விளிப்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲזַמְּרָה לְךָ
  choice: உமக்கு இசை பாடுவேன்
  rationale: זמר என்பதன் பீயேல் வடிவம் இசையுடன் பாடுவதையோ புகழிசை எழுப்புவதையோ குறிக்கலாம். கருவி வெளிப்படையாகக் குறிப்பிடப்படுவதால் ‘இசை பாடுவேன்’ அதன் பாடல் மற்றும் இசை நுணுக்கங்களைத் தக்கவைக்கிறது.
- source_word: בְכִנּוֹר
  choice: கின்னரத்தால்
  rationale: כִּנּוֹר என்பது נֶבֶל இலிருந்து வேறுபட்ட நரம்பிசைக் கருவி. இரு எபிரெயச் சொற்களின் வேறுபாட்டைத் தக்கவைக்க, ஒலிபெயர்ப்பை அடிப்படையாகக் கொண்ட ‘கின்னரம்’ பயன்படுத்தப்பட்டது.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: இஸ்ரயேலின் பரிசுத்தரே
  rationale: இது இறைவனுக்குரிய பட்டப்பெயராகவும் நேரடி விளியாகவும் வருகிறது; ‘-ரே’ என்னும் விளிவிகுதி அந்தப் பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: இறைவனைப் பற்றிய אֱמֶת என்ற சொல்லின் பொருள்
  choice: உண்மைத்தன்மை
  alternative: உண்மை
  rationale: இச்சூழலில் இறைவனின் நம்பத்தகுந்த, மாறாத குணத்தை ‘உண்மைத்தன்மை’ இயல்பாக வெளிப்படுத்துகிறது. ஆயினும், எபிரெயச் சொல் ‘உண்மை’ என்றும் பொருள்படுவதால் அந்த நியாயமான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: אֲמִתְּךָ என்பது புகழ்ச்சிக்கான காரணமா அல்லது புகழப்படும் பண்பா
  choice: 'புகழ்ச்சிக்கான காரணம்: ‘உமது உண்மைத்தன்மைக்காக’'
  alternative: 'நேரடிப் பொருள்: ‘உமது உண்மைத்தன்மையைப் புகழ்வேன்’'
  rationale: எபிரெயில் இச்சொல்லுக்கு முன் முன்னிடைச்சொல் இல்லை; ஆகவே அதன் இலக்கணத் தொடர்பில் ஓரளவு ambiguity உள்ளது. சூழலுக்கு இயல்பான காரணப்பொருள் முதன்மை உரையில் தரப்பட்டு, நேரடிப் பொருள் வாசிப்பு அடிக்குறிப்பில் தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியமான தொனியுடன் மொழிபெயர்க்கப்பட்டது. இறைவனை நோக்கிய உரையில் ‘உம்’ மரியாதை வடிவமும், நேரடி விளியில் ‘இறைவனே/பரிசுத்தரே’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. பழங்கால இசைக்கருவிகளின் உறுதியற்ற அடையாளம் உரையில் மிகத் துல்லியமாக்கப்படாமல், அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
