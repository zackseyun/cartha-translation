- from: ஏனெனில், ஆண்டவராகிய யாவே[a], நீரே என் நம்பிக்கை; என் இளமைமுதல் நான் நம்பியிருப்பவரும் நீரே.[b]
  to: ஏனெனில், ஆண்டவராகிய யாவே, நீரே என் நம்பிக்கை; என் இளமைமுதல் என் நம்பிக்கைக்குரியவர்.
  rationale: 'The revision retains the direct address and Tamil psalmic register but restores the Hebrew’s parallel nominal predicates: Yahweh is both the speaker’s hope and the speaker’s confidence/trust from youth. The footnote anchor for the lexical alternative is placed on ‘நம்பிக்கைக்குரியவர்.’'
