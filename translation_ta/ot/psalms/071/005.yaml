reference: Psalms 71:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּֽי אַתָּ֥ה תִקְוָתִ֑/י אֲדֹנָ֥/י יְ֝הוִ֗ה מִבְטַחִ֥/י מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/005.yaml
  text: For you are my hope[a], Lord Yahweh[c][b], my confidence from my youth.
translation:
  language: ta
  text: ஏனெனில், ஆண்டவராகிய யாவே, நீரே என் நம்பிக்கை; என் இளமைமுதல் என் நம்பிக்கைக்குரியவர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரேய இணைப்புச் சொல்லின் காரணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַתָּה
  choice: நீரே
  rationale: கடவுளை நேரடியாகச் சுட்டும் இரண்டாம் நபர் ஒருமைப் பெயர்ச்சொல்லின் வலியுறுத்தலைத் தமிழில் மரியாதையுடனும் தெளிவாகவும் காக்கிறது.
- source_word: תִקְוָתִי
  choice: என் நம்பிக்கை
  rationale: இச்சூழலில் எதிர்பார்ப்பும் நம்பிக்கையும் கலந்த பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற தனிப்பெயரையும் வேறுபடுத்திக் காட்டி, தமிழில் இயல்பான இணைப்பாக வழங்குகிறது.
- source_word: מִבְטַחִי
  choice: நான் நம்பியிருப்பவர்
  rationale: இந்தப் பெயர்ச்சொல் நம்பிக்கை வைக்கப்படும் ஒருவரையோ ஒன்றையோ குறிக்க முடியும்; இங்கு கடவுளே அந்த நம்பிக்கையின் ஆதாரம் என்பதைக் கூறும் இயல்பான தமிழ் வடிவம்.
- source_word: מִנְּעוּרָי
  choice: என் இளமைமுதல்
  rationale: நம்பிக்கை தொடங்கிய காலப்புள்ளியையும் அது தொடர்ந்திருப்பதையும் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲדֹנָי יהוה என்ற இறைப் பட்டமும் பெயரும் சேர்ந்த அமைப்பு
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர்
  rationale: மூலத்தில் பட்டமும் இறைவனின் தனிப்பெயரும் தனித்தனியாக இருப்பதை மறைக்காமல், உச்சரிப்பைச் சார்ந்த பொதுவான ‘யாவே’ வடிவத்தில் தருகிறது; குறிப்பிட்ட சமயப் பிரிவின் தனிப்பட்ட விளக்கத்தைச் சேர்க்கவில்லை.
- issue: מִבְטַחִי என்பது உள்ளார்ந்த நம்பிக்கையா அல்லது நம்பிக்கைக்குரியவரா
  choice: நான் நம்பியிருப்பவர்
  alternative: என் உறுதியான நம்பிக்கை
  rationale: இலக்கண ரீதியாக ‘என் நம்பிக்கைக்குரியவர்/என் நம்பிக்கையின் ஆதாரம்’ என்ற பொருள் சாத்தியம். கடவுளை நேரடியாக விளிக்கும் சூழலில் நபரை மையப்படுத்தும் இயல்பான தமிழ் தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற மரியாதையும் நேரடியான வேண்டுதல் நடையும் காக்கப்பட்டுள்ளன. ‘நீரே’ என்ற வடிவம் எபிரேய மூலத்தின் வலியுறுத்தலை வெளிப்படுத்துகிறது; தேவையற்ற பழந்தமிழ் அல்லது சமயப் பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
