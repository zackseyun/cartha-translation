  text: הֱיֵ֤ה לִ֨/י לְ/צ֥וּר מָע֡וֹן לָ/ב֗וֹא תָּמִ֗יד צִוִּ֥יתָ לְ/הוֹשִׁיעֵ֑/נִי כִּֽי סַלְעִ֖/י וּ/מְצוּדָתִ֣/י אָֽתָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/003.yaml
  text: Be for me a rock of refuge[a], to which I may always come; you have commanded salvation for me[b], for you are my crag and my fortress.
translation:
  language: ta
  text: எனக்காக அடைக்கலப் பாறையாக இருப்பீராக[a]; அதற்கு நான் எப்போதும் வரும்படி; என்னைக் காப்பாற்றும்படி கட்டளையிட்டீர்[b]; ஏனெனில், நீரே என் பாறையும் என் கோட்டையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்காக வாழிடமான கற்பாறையாக இருப்பீராக.”
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “என்னைக் காப்பாற்றும்படி கட்டளையிட்டீர்”; அல்லது, “என்னைக் காப்பாற்ற விதித்தீர்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱיֵה לִי
  choice: எனக்கு இரும்
  rationale: இறைவனை நோக்கிய நேரடியான வேண்டுதலாக உள்ள எபிரெய கட்டளை வடிவத்தை, மரியாதை ஒருமை கொண்ட இயல்பான தமிழ் வேண்டுதல் நடையில் காக்கிறது.
- source_word: לְצוּר מָעוֹן
  choice: அடைக்கலம் புகக்கூடிய கற்பாறையாக
  rationale: צוּר என்பதன் பாறை உருவகத்தையும், மָעוֹן என்பதன் தங்குமிடம்/புகலிடம் பொருளையும் பாதுகாப்புச் சூழலில் இயல்பாக இணைக்கிறது; வேறொரு நேரடி அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָבוֹא תָּמִיד
  choice: எப்போதும் வந்து ... புகக்கூடிய
  rationale: בוא என்பதன் வருதல்/நுழைதல் கருத்தையும் תָּמִיד என்பதன் தொடர்ச்சியையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִוִּיתָ לְהוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றக் கட்டளையிட்டிருக்கிறீர்
  rationale: எபிரெயத்தில் உள்ள ‘கட்டளையிடு’ என்ற வலுவான வினையையும், ‘என்னைக் காப்பாற்ற’ என்ற வினையெச்சத்தின் நேரடி பொருளையும் விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: סַלְעִי
  choice: என் பாறை
  rationale: סלע குறிக்கும் செங்குத்தான அல்லது உறுதியான பாறை உருவகத்தை எளிய நவீன தமிழில் தருகிறது; முன்னுள்ள צוּר-க்கு ‘கற்பாறை’ என்று கொடுத்ததால் சொல் வேறுபாடும் ஓரளவு காக்கப்படுகிறது.
- source_word: וּמְצוּדָתִי
  choice: என் கோட்டை
  rationale: מצודה என்பதன் பாதுகாப்பு அரண்/கோட்டை கருத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אָתָּה
  choice: நீரே
  rationale: தனித்து வரும் இரண்டாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலை ‘-ஏ’ மூலம் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: צִוִּיתָ לְהוֹשִׁיעֵנִי என்பதை ‘மீட்பை நியமித்தீர்’ என்று பொருள்விரிவாக்குவதா, அல்லது ‘காப்பாற்றக் கட்டளையிட்டீர்’ என்ற வலுவான வினையைப் பேணுவதா
  choice: என்னைக் காப்பாற்றக் கட்டளையிட்டிருக்கிறீர்
  alternative: என்னைக் காப்பாற்றத் தீர்மானித்திருக்கிறீர்
  rationale: மூலத்தில் வெளிப்படையாக உள்ள ‘கட்டளையிடு’ என்ற வினையைப் பேணுகிறது; அதனை ஒரு குறிப்பிட்ட கோட்பாட்டு அமைப்பாகச் சுருக்காமல், இறைவனின் செயல்திறனுள்ள ஆணை என்ற உரையின் பதற்றத்தை அப்படியே விடுகிறது.
- issue: מָעוֹן என்பதைக் ‘அடைக்கலம்’ எனச் சூழலுக்கேற்ப மொழிபெயர்ப்பதா அல்லது ‘வாழிடம்’ என நேரடியாகக் கொடுப்பதா
  choice: அடைக்கலம் புகக்கூடிய
  alternative: வாழிடமான
  rationale: பாறை, காப்பாற்றுதல், கோட்டை ஆகிய பாதுகாப்பு உருவகங்களோடு ‘அடைக்கலம்’ இயல்பாகப் பொருந்துகிறது; ‘வாழிடம்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நடையும் இறைவனை நோக்கிய மரியாதை ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. பாதுகாப்பைச் சுட்டும் கற்பாறை, பாறை, கோட்டை ஆகிய உருவகங்கள் காக்கப்பட்டுள்ளன.
