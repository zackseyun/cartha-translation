  rationale: The revision resolves the honorific inconsistency, makes the continual-access relationship of לָבוֹא תָּמִיד clearer, and preserves the Hebrew's explicit 'command' language. The footnotes retain the viable lexical alternative for מָעוֹן and the more literal/alternative sense of the command-to-save clause.
