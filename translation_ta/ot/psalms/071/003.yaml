review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal Hebrew images and the direct force of the plea. However, the polite divine address elsewhere ('நீரே', '-இறீர்') is inconsistent with the non-honorific imperative 'இரும்'. The clause with לָבוֹא תָּמִיד is more clearly represented as the place to which the psalmist may continually come, rather than as a descriptive compound alone.
  naturalness: The proposed revision uses idiomatic modern, reverent Tamil while retaining a psalm-like register. 'அடைக்கலப் பாறை' is a natural protective metaphor, and 'இருப்பீராக' consistently addresses God respectfully.
  terminology: '''கற்பாறை'' / ''பாறை'' preserves the two related Hebrew rock terms without forcing a sharp lexical distinction. ''கோட்டை'' appropriately renders מצודה. ''கட்டளையிட்டீர்'' retains the explicit force of צִוִּיתָ; the footnote retains the literal syntactic alternative without imposing a doctrinal interpretation.'
  issues:
  - severity: medium
    issue: Person/register mismatch in the imperative
    rationale: '''இரும்'' is a non-honorific singular imperative, whereas the verse otherwise addresses God with honorific forms (''கட்டளையிட்டிருக்கிறீர்'', ''நீரே''). Modern standard Tamil calls for a consistent respectful imperative.'
  - severity: low
    issue: The continual-coming relation is not stated as clearly as in the Hebrew
    rationale: The Hebrew presents a rock/dwelling place 'for coming continually.' Recasting this as 'அதற்கு நான் எப்போதும் வரும்படி' makes the intended relation explicit and avoids making 'வந்து அடைக்கலம் புகக்கூடிய' an overly compressed modifier.
  revised_text: எனக்காக அடைக்கலப் பாறையாக இருப்பீராக[a]; அதற்கு நான் எப்போதும் வரும்படி; என்னைக் காப்பாற்றும்படி கட்டளையிட்டீர்[b]; ஏனெனில், நீரே என் பாறையும் என் கோட்டையும்.
