revisions:
- from: நான் எப்போதும் வந்து அடைக்கலம் புகக்கூடிய கற்பாறையாக எனக்கு இரும்[a]; என்னைக் காப்பாற்றக் கட்டளையிட்டிருக்கிறீர்[b]; ஏனெனில், நீரே என் பாறையும் என் கோட்டையும்.
