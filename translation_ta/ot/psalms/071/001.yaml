id: PSA.71.1
reference: Psalms 71:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בְּ/ךָֽ יְהוָ֥ה חָסִ֑יתִי אַל אֵב֥וֹשָׁה לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame.
translation:
  language: ta
  text: யாவே, உம்மிடம் அடைக்கலம் புகுந்தேன்; நான் ஒருபோதும் அவமானப்படாதிருப்பேனாக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּךָ
  choice: உம்மிடம்
  rationale: בְּ־ என்பதன் ‘உம்மில்/உம்மிடம்’ என்ற உறவுசார் பொருளை, அடைக்கலம் புகும் சூழலில் இயல்பான தமிழில் ‘உம்மிடம்’ என்று வழங்குகிறது; மூலத்தில் இல்லாத தனிப்பட்ட வலியுறுத்தலைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: חָסִיתִי
  choice: அடைக்கலம் புகுந்தேன்
  rationale: חסה வினையின் பாதுகாப்பை நாடி அடைக்கலம் புகும் உருவகத்தைத் தக்கவைக்கிறது. எபிரெய நிறைவுவினை வடிவத்தின் முடிவுற்ற, தற்போது பொருத்தமுள்ள செயலைத் தமிழ் இறந்தகாலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַל אֵבוֹשָׁה
  choice: நான் … அவமானமடைய விடாதிரும்
  rationale: אַל உடன் வரும் முதல் நபர் வேண்டுதல்/விருப்ப நுணுக்கத்தையும், בושׁ குறிக்கும் வெட்கம் அல்லது பொதுவான இழிவுநிலையையும் இயல்பான தமிழ்ப் பிரார்த்தனை நடையில் வெளிப்படுத்துகிறது.
- source_word: לְעוֹלָם
  choice: ஒருபோதும்
  rationale: எதிர்மறை வேண்டுதலுடன் לְעוֹלָם என்பதன் ‘எக்காலத்திலும் இல்லை’ என்ற பொருளை இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல வசனம் தெய்வீகப் பெயரையே நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர்த் தன்மையைத் தக்கவைக்கிறது.
- issue: בושׁ என்பதன் அவமான நுணுக்கம்
  choice: அவமானமடைய
  alternative: வெட்கப்பட
  rationale: இங்கு தனிப்பட்ட கூச்ச உணர்வை மட்டும் அல்லாமல், நம்பிக்கை பொய்த்ததால் ஏற்படும் தோல்வி அல்லது இழிவுநிலையையும் குறிக்கக்கூடும். ‘அவமானமடைய’ இந்தப் பரந்த நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதை ஒருமை (‘உம்மிடம்’, ‘விடாதிரும்’) பயன்படுத்தப்பட்டுள்ளது. கவிதைநயமும் வேண்டுதல் தொனியும் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
