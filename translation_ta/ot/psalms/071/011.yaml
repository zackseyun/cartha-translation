source:
  edition: WLC
  text: לֵ֭/אמֹר אֱלֹהִ֣ים עֲזָב֑/וֹ רִֽדְפ֥וּ וְ֝/תִפְשׂ֗וּ/הוּ כִּי אֵ֥ין מַצִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/011.yaml
  text: saying[a], “God has forsaken him; pursue and seize him, for there is no one to rescue him.”
translation:
  language: ta
  text: “கடவுள் அவனைக் கைவிட்டுவிட்டார்[a]; அவனைத் துரத்திப் பிடியுங்கள்; ஏனெனில் அவனை மீட்பவர் யாரும் இல்லை” என்று கூறி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் அவனைத் துறந்துவிட்டார்.” எபிரெய வினைச்சொல்லை இவ்விரு விதங்களிலும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: என்று சொல்கிறார்கள்
  rationale: אמר என்பதன் infinitive construct மேற்கோள் பேச்சை அறிமுகப்படுத்துகிறது. முந்தைய வசனத்திலுள்ள எதிரிகளே பேசுகிறார்கள் என்பது தமிழில் இயல்பாக விளங்க, சூழலுக்கேற்ற பன்மை வினை பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: עֲזָבוֹ என்ற ஒருமை வினையுடன் வருவதால் இது பன்மையான ‘தெய்வங்கள்’ அல்ல, ஒருமையான இறைப்பட்டம்.
- source_word: עֲזָבוֹ
  choice: அவனைக் கைவிட்டுவிட்டார்
  rationale: עזב என்பதன் Qal perfect வடிவம் முடிந்த செயலையும் அதன் தற்போதைய விளைவையும் காட்டுகிறது. ‘கைவிட்டுவிட்டார்’ என்பது எதிரிகளின் கடுமையான கூற்றை நவீன தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: רִדְפוּ
  choice: அவனைத் துரத்தி
  rationale: רדף என்பதன் பன்மை ஏவல் வடிவம். பகைவர்கள் பலவீனமான ஒருவனைப் பின்தொடரும் உடனடி பகைச் செயலை ‘துரத்தி’ தெளிவாகக் காட்டுகிறது.
- source_word: וְתִפְשׂוּהוּ
  choice: பிடியுங்கள்
  rationale: תפשׂ என்பதன் பன்மை ஏவல் வடிவம் 3ஆம் ஆண் ஒருமை பின்னொட்டுடன் உள்ளது; ‘பிடியுங்கள்’ பற்றிப்பிடித்தல் அல்லது கைப்பற்றுதல் என்ற பொதுவான பொருளை மிகைப்படுத்தாமல் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்.
- source_word: אֵין מַצִּיל
  choice: அவனை மீட்பவர் யாரும் இல்லை
  rationale: אֵין இல்லாமையைச் சுட்டுகிறது; מַצִּיל என்பது נצל என்பதன் Hiphil participle, ‘மீட்பவர்’. தனிப்பட்ட மீட்பாளர் ஒருவரும் இல்லை என்ற பொருளை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: கடவுள் கைவிட்டதாக எதிரிகள் கூறும் கூற்று
  choice: கடவுள் அவனைக் கைவிட்டுவிட்டார்
  alternative: கடவுள் அவனைத் துறந்துவிட்டார்
  rationale: இது சங்கீதக்காரனின் எதிரிகள் பேசும் கூற்று; உரையாசிரியரின் இறையியல் உறுதிப்படுத்தல் அல்ல. மொழிபெயர்ப்பு அந்த நிந்தனைக்கூற்றின் தீவிரத்தைத் தக்கவைத்தாலும், கடவுள் உண்மையிலேயே நீதிமானைக் கைவிட்டார் என்று தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; சங்கீதத்திற்கேற்ற கண்ணியமான, நேரடியான நடை. மேற்கோளின் கூர்மையும் ஏவல் வினைகளின் அவசரமும் காக்கப்பட்டுள்ளன.
