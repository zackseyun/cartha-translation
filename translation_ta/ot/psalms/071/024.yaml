id: PSA.71.24
reference: Psalms 71:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: גַּם לְשׁוֹנִ֗/י כָּל הַ֭/יּוֹם תֶּהְגֶּ֣ה צִדְקָתֶ֑/ךָ כִּי בֹ֥שׁוּ כִֽי חָ֝פְר֗וּ מְבַקְשֵׁ֥י רָעָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/024.yaml
  text: My tongue also will speak of your righteousness all day long[a], for those seeking my harm have been put to shame; they have been disgraced.
translation:
  language: ta
  text: என் நாவும் நாளெல்லாம் உமது நீதியை[a] எடுத்துரைக்கும்; ஏனெனில், எனக்குத் தீங்கு செய்ய நாடுகிறவர்கள் வெட்கமடைந்து அவமானப்பட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது நியாயத்தை.’ இங்கு வரும் எபிரெயச் சொல் இறைவனின் நீதியையும், அவர் நியாயம் செய்து மீட்டு நிலைநாட்டுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: -உம் (என் நாவும்)
  rationale: முந்தைய வசனத்தின் துதியைத் தொடர்ந்து, நாவும் அதில் இணைகிறது என்ற கூட்டுப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְשׁוֹנִי
  choice: என் நாவு
  rationale: ‘என் பேச்சு’ என்று கருத்தாக்காமல், எபிரெயக் கவிதையின் உடல் உறுப்புச் சித்திரத்தைத் தக்கவைக்கிறது.
- source_word: כָּל הַיּוֹם
  choice: நாளெல்லாம்
  rationale: தொடர்ந்து நாள் முழுவதும் துதிப்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תֶּהְגֶּה
  choice: எடுத்துரைக்கும்
  rationale: הגה என்பது முணுமுணுத்தல், தியானித்தல், வாயால் உரைத்தல் ஆகிய பொருட்களைக் கொண்டது. இங்கு ‘நாவு’ எழுவாயாக இருப்பதால், கேட்கத்தக்க வாய்மொழித் துதியை ‘எடுத்துரைக்கும்’ பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: צִדְקָתֶךָ
  choice: உமது நீதி
  rationale: இறைவனின் நேர்மை, நியாயம், மீட்டு நிலைநாட்டும் செயல் ஆகிய பரந்த பொருள் வளத்தை ‘நீதி’ தக்கவைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சங்கீதக்காரரின் தொடர்ந்த துதிக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: בֹשׁוּ
  choice: வெட்கமடைந்து
  rationale: எபிரெய நிறைவுற்ற வினையின் விளைவுநிலையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: כִּי חָפְרוּ
  choice: அவமானப்பட்டார்கள்
  rationale: இரண்டாவது כִּי தமிழில் தனியே மீண்டும் மொழிபெயர்க்கப்படாமல், இணையான இரண்டாவது விளைவை இயல்பான தொடராக அளிக்கிறது; חפר என்பதின் இழிவடைதல் அல்லது அவமானமடைதல் நுணுக்கத்தையும் காக்கிறது.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: எனக்குத் தீங்கு செய்ய நாடுகிறவர்கள்
  rationale: தொடர்ந்து பகை நோக்குடன் சங்கீதக்காரருக்குத் தீங்கை நாடுவோரைக் குறிக்கும் பங்கேற்பு வடிவத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சங்கீதச் சூழலில் צִדְקָתֶךָ என்பதன் மொழிபெயர்ப்பு
  choice: உமது நீதி
  alternative: உமது நியாயம்
  rationale: ‘நீதி’ என்பது இறைவனின் ஒழுக்க நேர்மையையும் நீதித்தீர்ப்பையும் மீட்டு நிலைநாட்டும் செயலையும் உள்ளடக்கக்கூடிய பரந்த தமிழ்ச் சொல். ‘நியாயம்’ என்ற மாற்றை அடிக்குறிப்பில் தருவது நீதிசார் நுணுக்கத்தை வெளிப்படுத்துகிறது; ஆனால் மூலத்தின் பொருள் வளத்தை ஒரே திசையில் குறுக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதத்திற்குரிய கண்ணியமான கவிதை நடையுடனும் அமைக்கப்பட்டுள்ளது. ‘உமது’ என்ற மரியாதை வடிவமும் ‘எடுத்துரைக்கும்’ என்ற நீடித்த வாய்மொழித் துதியைக் குறிக்கும் சொல்லும் பயன்படுத்தப்பட்டுள்ளன.
