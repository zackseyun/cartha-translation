  text: God[a], do not be far from me; my God, hurry to help me.
translation:
  language: ta
  text: தேவனே, என்னைவிட்டு தொலைவில் இருக்காதீர்; என் தேவனே, எனக்கு உதவ விரையுங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: நேரடி அழைப்பாக உள்ள எபிரெயச் சொல்லை, நவீனத் தமிழில் இயல்பாக விளிக்கும் வேற்றுமையுடன் மொழிபெயர்க்கிறது.
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: என்னைவிட்டு தொலைவில் இருக்காதீர்
  rationale: רחק என்பதிலுள்ள இடம் மற்றும் உறவு சார்ந்த ‘தொலைவில் இருத்தல்’ என்ற உருவகத்தைத் தெளிவாகப் பேணுகிறது; אַל என்பதன் வேண்டுகோள் கலந்த எதிர்மறை ஆணையும் வெளிப்படுகிறது.
- source_word: אֱלֹהַי
  choice: என் தேவனே
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டையும் நேரடி வேண்டுதலையும் இயல்பான தமிழில் பேணுகிறது.
- source_word: לְעֶזְרָתִי
  choice: எனக்கு உதவ
  rationale: சொல்லுக்குச் சொல் ‘என் உதவிக்காக/என் உதவிக்கு’ என்பதைக் காட்டிலும், வேகப்படுதலைக் குறிக்கும் வினையுடன் இது இயல்பான நவீனத் தமிழ்.
- source_word: חִישָׁה
  choice: விரைந்து வாரும்
  rationale: அடிப்படைப் பொருளான ‘விரைதல்’ என்பதையும் சூழலில் உள்ள அணுகிவந்து உதவும் வேண்டுதலையும் இயல்பாக வெளிப்படுத்துகிறது; ‘வரும்’ என்பது எபிரெயத்தில் தனிச் சொல்லாக இல்லாவிட்டாலும், ‘எனக்கு உதவ விரை’ என்ற கருத்தில் சூழலால் உணர்த்தப்படுகிறது.
theological_decisions:
- issue: மீண்டும் வரும் இறைப் பெயர்களை நேரடி அழைப்பாக மொழிபெயர்த்தல்
  choice: தேவனே … என் தேவனே
  alternative: தேவன் … என் தேவன்
  rationale: எபிரெயத்தில் இரு பெயர்களும் நேரடி அழைப்புகள். தமிழில் ‘-ஏ’ விளி உருபு அவற்றின் வேண்டுதல் நிறைந்த நேரடி அழைப்பை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது; தனிப்பட்ட இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: חִישָׁה என்பதில் வருகையை வெளிப்படுத்துதல்
  choice: விரைந்து வாரும்
  alternative: விரையும்
  rationale: ‘வா’ என்ற வினை மூலத்தில் வெளிப்படையாக இல்லை. எனினும் ‘தொலைவில் இருக்காதீர்’ மற்றும் ‘எனக்கு உதவ’ என்ற இணைச்சூழல், உதவுவதற்காக விரைந்து அணுகுவதை உணர்த்துகிறது. இயல்பான தமிழுக்காக அதை வெளிப்படுத்தியபோதும், தனி இறையியல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான ஜெப மொழிநடை. ‘இருக்காதீர்’ மற்றும் ‘வாரும்’ ஆகிய மரியாதை வடிவங்கள் இறைவனை நோக்கிய நேரடி வேண்டுதலுக்கு இயல்பானவை. ஆங்கிலத்தில் உள்ள vocative மாற்றுக்கான அடிக்குறிப்பு தமிழில் தேவையில்லை; தமிழின் ‘-ஏ’ உருபே நேரடி அழைப்பைத் தெளிவாகக் குறிக்கிறது.
