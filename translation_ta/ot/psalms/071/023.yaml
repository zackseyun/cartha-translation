base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/023.yaml
  text: My lips will shout for joy when I sing praise to you[a], and my soul[c][b], which you have redeemed.
translation:
  language: ta
  text: நான் உமக்குப் புகழ் பாடும்போது, என் உதடுகள் மகிழ்ந்து பாடும்[a]; நீர் மீட்ட என் உயிரும்[b] மகிழ்ந்து பாடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகிழ்ச்சியுடன் ஆர்ப்பரிக்கும்”; எபிரேய வினை களிப்பான பாடலையும் மகிழ்ச்சிக் கூக்குரலையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் உள்ளமும்” அல்லது “நானும்”; எபிரேயச் சொல் உயிர், உள்ளம், அல்லது முழு நபரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַנֵּנָּה
  choice: மகிழ்ந்து பாடும்
  rationale: ரנן என்பதன் பியேல் வடிவம் மகிழ்ச்சிப் பாடலையும் களிப்பாரவாரத்தையும் குறிக்கலாம். உதடுகளையும் அடுத்துவரும் இசைப் புகழையும் கருத்தில் கொண்டு, இயல்பான தமிழில் ‘மகிழ்ந்து பாடும்’ என வழங்கப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שְׂפָתַי
  choice: என் உதடுகள்
  rationale: மூலத்தின் கவித்துவமான உடல் உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: כִּי
  choice: பாடும்போது
  rationale: இங்கு כִּי மகிழ்ச்சிப் பாடல் நிகழும் சந்தர்ப்பத்தை அறிமுகப்படுத்துவதாகப் புரிந்துகொள்ளலாம். தமிழில் ‘பாடும்போது’ என்பது உறவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲזַמְּרָה לָּךְ
  choice: நான் உமக்குப் புகழ் பாடும்போது
  rationale: זמר என்ற வினை இசையோடு புகழ்வதைச் சுட்டுகிறது; לָךְ புகழின் முகவரைச் சுட்டுவதால் ‘உமக்குப் புகழ் பாடு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְנַפְשִׁי
  choice: என் உயிரும்
  rationale: נפשׁ என்பது உயிர், உள்ளம், தன்னையே அல்லது முழு நபரையும் குறிக்கலாம். ‘என் உயிரும்’ என்பது தமிழில் இயல்பாக இருந்து, பேச்சாளரின் முழு உள்ளார்ந்த ஆளுமையைக் குறிக்கும் பரப்பையும் காக்கிறது.
- source_word: פָּדִיתָ
  choice: நீர் மீட்ட
  rationale: פדה என்பது விலைகொடுத்து விடுவித்தல், மீட்டல், ஆபத்திலிருந்து விடுவித்தல் ஆகிய அர்த்தங்களை உடையது. ‘மீட்ட’ என்பது தமிழில் இரட்சிப்புச் செயலைக் கண்ணியமாகவும் மிகக் குறுகிய கோட்பாட்டு விளக்கமின்றியும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வழிபாட்டுச் சூழலில் פדה என்பதன் மொழிபெயர்ப்பு
  choice: மீட்ட
  alternative: மீட்புவிலை கொடுத்து விடுவித்த / விடுவித்த
  rationale: இவ்வசனம் இறைவனின் காப்பாற்றும் செயலைப் புகழ்ச்சிக்கான அடிப்படையாகக் காட்டுகிறது. ‘மீட்ட’ என்பது உடன்படிக்கை மற்றும் இறையியல் நிறையைத் தக்கவைத்தாலும், பிற்காலக் கோட்பாட்டு அமைப்பொன்றை வசனத்தில் திணிக்காது.
- issue: נפשׁ என்பதன் மனிதவியல் பரப்பு
  choice: உயிர்
  alternative: ஆத்துமா / உள்ளம் / நானும்
  rationale: எபிரேயச் சொல் உடலிலிருந்து பிரிந்த ஓர் அங்கத்தை மட்டும் கட்டாயமாகக் குறிக்காது; உயிரையும் நபரின் தன்னையுமே குறிக்கலாம். ‘உயிர்’ அந்தத் திறந்த பொருள் பரப்பை நவீன தமிழில் நன்றாகப் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமான ‘உமக்கு/நீர்’ கையாளப்பட்டுள்ளது. எபிரேய இணைப்பான וְ-ஐ ‘உம்’ என வெளிப்படுத்தி, உதடுகளுக்கும் உயிருக்கும் இடையிலான கவித்துவ இணைநிலையைத் தெளிவாக்கப்பட்டுள்ளது.
