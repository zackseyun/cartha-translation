  yaml_path: translation/ot/psalms/071/010.yaml
  text: For my enemies speak against me[b][a], and those who watch for my life consult together.
translation:
  language: ta
  text: 'ஏனெனில், என் பகைவர்கள் எனக்கு எதிராகப் பேசுகிறார்கள்;


    என் உயிருக்கு வேவு பார்ப்பவர்கள்[a] ஒன்றாக ஆலோசிக்கிறார்கள்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உயிரைப் பறிக்கப் பதுங்கிக் காத்திருப்பவர்கள்” அல்லது “என் உயிரைத் தேடுகிறவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஒன்றுகூடித் திட்டமிடுகிறார்கள்”; இச்சூழலில் இந்த வினைச்சொல் “சூழ்ச்சி செய்கிறார்கள்” என்ற பகைமைப் பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָמְרוּ
  choice: பேசுகிறார்கள்
  rationale: எபிரெய நிறைவுற்ற வினை வடிவம் கவிதைச் சூழலில் தற்போது தொடரும் பகைமைப் பேச்சைக் குறிக்க முடியும்; தமிழ் நிகழ்காலம் அந்தச் சூழலுக்கு இயல்பாக உள்ளது.
- source_word: אֹיְבַי
  choice: என் பகைவர்கள்
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் பெயர்ச்சொல்லின் நேரடியான, வழக்கமான மொழிபெயர்ப்பு.
- source_word: לִי
  choice: எனக்கு எதிராக
  rationale: சொல்லளவில் ‘எனக்கு’ என இருந்தாலும், பகைமைச் சூழலில் எதிரான பேச்சு என்பதைக் காட்டும் இயல்பான தமிழ் வடிவம்.
- source_word: וְשֹׁמְרֵי נַפְשִׁי
  choice: என் உயிரைக் கண்காணிப்பவர்கள்
  rationale: שׁמר என்பதன் ‘கவனித்தல்/கண்காணித்தல்’ பொருளையும், נֶפֶשׁ இங்கு ஆபத்திலுள்ள உயிரைக் குறிப்பதையும் வெளிப்படுத்துகிறது; தீய நோக்கத்தின் துல்லியமான வடிவத்தை முதன்மை உரையில் மிகையாக நிர்ணயிக்கவில்லை.
- source_word: נוֹעֲצוּ
  choice: ஆலோசிக்கிறார்கள்
  rationale: ஒருவரோடொருவர் கலந்து யோசிப்பது என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; சூழலில் பகைமையான சூழ்ச்சி உட்பொருளாக இருந்தாலும் அதை முதன்மை உரையில் கட்டாயப்படுத்தவில்லை.
- source_word: יַחְדָּו
  choice: ஒன்றாக
  rationale: அவர்கள் ஒருங்கிணைந்து செயல்படுவதைக் குறிக்கும் வினையடைப் பொருளை இயல்பான தமிழில் தருகிறது.
