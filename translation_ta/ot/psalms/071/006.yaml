  yaml_path: translation/ot/psalms/071/006.yaml
  text: Upon you I have leaned from the womb; from my mother’s inward parts you are the one who brought me out[a]. In you is my praise continually.
translation:
  language: ta
  text: கருப்பையிலிருந்தே உம்மைச் சார்ந்திருக்கிறேன்; என் தாயின் அக உறுப்புகளிலிருந்து என்னை வெளியே கொண்டுவந்தவர் நீரே.[a] உம்மில் என் புகழ்ச்சி எப்போதும் உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை இன்னும் இயல்பாக, “என் தாயின் கருப்பையிலிருந்து என்னை வெளியே கொண்டுவந்தவர் நீரே” என்றும் மொழிபெயர்க்கலாம். முந்தைய தொடரில் ‘கருப்பை’ என்பதற்குப் பயன்படுத்தப்பட்ட சொல்லிலிருந்து வேறான எபிரெயச் சொல் இங்கு உள்ளது; அது சொல்லடிப்படையில் ‘அக உறுப்புகள்’ என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ נִסְמַכְתִּי
  choice: உம்மைச் சார்ந்திருக்கிறேன்
  rationale: சמך என்பதன் நிஃபால் வடிவம் சாய்ந்திருத்தல், ஆதரவு பெறுதல், சார்ந்திருத்தல் ஆகிய உணர்வுகளைத் தருகிறது. தமிழில் ‘உம்மைச் சார்ந்திருக்கிறேன்’ என்பது தேவனைச் சார்ந்திருக்கும் உருவகத்தையும் இயல்பான நடையையும் காக்கிறது.
- source_word: מִבֶּטֶן
  choice: தாயின் கருப்பையிலிருந்தே
  rationale: בטן இங்கு கருப்பை அல்லது வயிறு எனப் பொருள்படும். பிறப்புக்கு முந்திய காலத்திலிருந்தே என்ற கருத்தைத் தெளிவாகக் கூற ‘தாயின் கருப்பையிலிருந்தே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִמְּעֵי אִמִּי
  choice: என் தாயின் அக உறுப்புகளிலிருந்து
  rationale: מֵעֶה என்பது சொல்லடிப்படையில் உள்ளுறுப்புகளைக் குறிக்கிறது. முன் தொடரிலுள்ள בטן என்பதிலிருந்து எபிரெயச் சொல் வேறுபாட்டைக் காக்க ‘அக உறுப்புகள்’ பயன்படுத்தப்பட்டது; இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אַתָּה גוֹזִי
  choice: என்னை வெளிக்கொண்டுவந்தவர் நீரே
  rationale: தனிப் பெயர்ச்சுட்டான אַתָּה வலியுறுத்தலைக் கொண்டுள்ளது; ‘நீரே’ அதைக் காக்கிறது. גוֹזִי இச்சூழலில் தாயின் உடலிலிருந்து வெளிக்கொணர்ந்து பிறக்கச் செய்த செயலைக் குறிக்கிறது.
- source_word: בְּךָ תְהִלָּתִי תָמִיד
  choice: உம்மையே நான் எப்போதும் புகழ்கிறேன்
  rationale: சொல்லடிப்படையான ‘உம்மில் என் புகழ்ச்சி எப்போதும்’ என்பது தமிழில் இயல்பற்றதும் பொருள் மங்கலானதும் ஆகும். தேவனை இடைவிடாமல் புகழ்வதே கருத்து என்பதால், வினைத் தொடராக இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது; בְּךָ-வின் மையப்படுத்தலை ‘உம்மையே’ காக்கிறது.
theological_decisions:
- issue: பிறப்பில் தேவனுடைய செயற்பாடு
  choice: சங்கீதக்காரரைத் தாயின் உடலிலிருந்து வெளிக்கொண்டுவந்தவர் தேவனே என்று உரை கூறுகிறது.
  alternative: பிறப்பிலிருந்து ஆதரித்தவர் என்ற பொதுவான பொருள் மட்டும்.
  rationale: பிறப்பு நிகழ்வில் தேவனுடைய பராமரிப்புச் செயற்பாட்டை எபிரெய உருவகம் நேரடியாகக் காட்டுகிறது. வசனம் கூறுவதைத் தாண்டிய தனிப்பட்ட கோட்பாட்டைச் சேர்க்காமல் அந்த உருவகம் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய சங்கீத உரைக்கு ஏற்ற மரியாதைப் பன்மை (‘உம்மை’, ‘நீரே’) கடைப்பிடிக்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் பிறப்பு உருவகமும் சொல் வேறுபாடும் முதன்மை உரை மற்றும் அடிக்குறிப்பு வழியாகப் பாதுகாக்கப்பட்டுள்ளன.
