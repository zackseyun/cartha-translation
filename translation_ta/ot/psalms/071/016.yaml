  yaml_path: translation/ot/psalms/071/016.yaml
  text: I will come in the mighty deeds of the Lord GOD[a]; I will proclaim your righteousness[c][b], yours alone.
translation:
  language: ta
  text: ஆண்டவராகிய யாவேவின் வல்ல செயல்களுடன் நான் வருவேன்[a]; உமது நீதியை மட்டுமே எடுத்துரைப்பேன்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆண்டவராகிய யாவேவின் வல்ல செயல்களில் நான் வருவேன்.” ב என்ற எபிரெய முன்னொட்டு ‘உடன்/மூலம்’ என்ற கருவிப்பொருளிலும், ‘உள்’ என்ற இடப்பொருளிலும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது நீதியைக் குறிப்பிடுவேன்” அல்லது “விவரிப்பேன்.” எபிரெய வினைச்சொல் குறிப்பிடுதல், விவரித்தல், அறிவித்தல் ஆகிய பொருள்களைத் தரலாம்.
    reason: lexical_alternative
  - marker: c
    text: “உமது நீதி” என்பதை “உமது நியாயம்” அல்லது, இச்சூழலில், “உமது நீதியான செயல்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: நான் வருவேன்
  rationale: בוא என்பதன் அடிப்படைப் பொருளான ‘வருதல்/செல்லுதல்/உள்ளே நுழைதல்’ என்பவற்றில், எபிரெய வடிவத்தை மிகையாக விளக்காமல் ‘நான் வருவேன்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בִּגְבֻרוֹת
  choice: வல்ல செயல்களுடன்
  rationale: גְּבוּרוֹת என்பது ‘வல்லமை’ என்பதன் பன்மை; இங்கு அது தேவனுடைய வல்ல செயல்களைக் குறிக்கிறது. ב என்ற முன்னொட்டின் கருவிப்பொருளை முதன்மை உரை காட்டுகிறது; இடப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲדֹנָי יְהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்பது ‘ஆண்டவர்’; יְהוִה என்ற தேவப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது. இரண்டையும் இணைத்து இயல்பான தமிழில் வழங்குகிறது.
- source_word: אַזְכִּיר
  choice: எடுத்துரைப்பேன்
  rationale: זכר என்பதன் ஹிஃபில் வடிவம் ‘நினைவுபடுத்துதல், குறிப்பிடுதல், விவரித்தல், அறிவித்தல்’ என்று பொருள்படலாம். ‘எடுத்துரைப்பேன்’ என்பது பொதுவாகச் சொல்லி அறிவிக்கும் கருத்தையும் அதன் பரந்த பொருள் வரம்பையும் காக்கிறது.
- source_word: צִדְקָתְךָ
  choice: உமது நீதி
  rationale: צְדָקָה என்பதன் மையப் பொருளான ‘நீதி/நேர்மை’ காக்கப்படுகிறது; அது நீதியான செயல்களையும் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְבַדֶּךָ
  choice: உம்முடையதை மட்டுமே
  rationale: ‘நீர் மட்டுமே/உம்முடையது மட்டுமே’ என்ற தனித்தன்மை வலியுறுத்தலை, முந்தைய ‘உமது நீதி’ என்பதோடு இயல்பாக இணைக்கிறது; எபிரெயத்தின் அழுத்தத்தை கோடுகளால் தெளிவாக்குகிறது.
theological_decisions:
- issue: אֲדֹנָי יְהוִה என்ற கூட்டுத் தேவப்பெயரை மொழிபெயர்த்தல்
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர்; ஆண்டவர் யெகோவா
  rationale: יְהוִה என்ற உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ எனப் பாதுகாக்கிறது; אֲדֹנָי என்பதையும் தனியே ‘ஆண்டவர்’ என வெளிப்படுத்துகிறது.
- issue: צִדְקָתְךָ என்பதன் கருத்தளவு
  choice: உமது நீதி
  alternative: உமது நியாயம்; உமது நீதியான செயல்கள்
  rationale: சொல்லின் அடிப்படைத் தெய்வவியல் கருத்தை முதன்மை உரையில் காக்கிறது; இச்சூழலில் அது நீதியான செயல்களைக் குறிக்கக்கூடிய வாய்ப்பை அடிக்குறிப்பு பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது/உம்முடையது’ என்ற மரியாதை ஒருமை இறைவனை நேரடியாக அழைக்கும் சங்கீத நடையைத் தக்கவைக்கிறது. எபிரெய முன்னொட்டு மற்றும் முக்கியச் சொற்களின் உண்மையான பொருள் வேறுபாடுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
