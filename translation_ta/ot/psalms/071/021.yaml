  text: תֶּ֤רֶב גְּֽדֻלָּתִ֗/י וְ/תִסֹּ֥ב תְּֽנַחֲמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/021.yaml
  text: May you increase my greatness and comfort me again[a][b][c].
translation:
  language: ta
  text: என் மேன்மையைப் பெருக்கி, என்னிடம் திரும்பி வந்து என்னை ஆறுதல்படுத்துவீராக[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் என் மேன்மையைப் பெருக்கி, என்னிடம் திரும்பி வந்து என்னை ஆறுதல்படுத்துவீர்.” எபிரெய மொழியின் நிறைவுறா வினைவடிவங்களை இக்கவிதைச் சூழலில் வேண்டுதலாகவும் எதிர்காலக் கூற்றாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் நேரடியாக “என் பெருமை”; இது அளவு அல்லது பரப்பு மட்டுமல்லாமல் மேன்மை, கண்ணியம், அல்லது உயர்நிலையையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் நேரடியாக “திரும்பி”; ஆறுதல்படுத்துவதற்காக சங்கீதக்காரனை நோக்கித் திரும்புதல் என்பது இங்கு பொருளாக இருக்கலாம். இதை “மீண்டும் என்னை ஆறுதல்படுத்துவீராக” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּרֶב
  choice: பெருகச் செய்து
  rationale: רבה என்பதன் ஹிஃபில் வடிவம் ‘பெருகச் செய்’ என்று பொருள்படும். சங்கீதத்தின் வேண்டுதல் சூழலில் இந்த நிறைவுறா வினைவடிவம் விருப்பம் அல்லது மன்றாட்டாக இயல்பாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: גְּדֻלָּתִי
  choice: என் மேன்மையை
  rationale: இந்தச் சொல் பெருமை, உயர்நிலை, கண்ணியம் ஆகிய அர்த்தங்களைத் தாங்கலாம். ‘மேன்மை’ மூலச்சொல்லின் பரந்த பொருளையும் உயர்வு சார்ந்த நுணுக்கத்தையும் காக்கிறது.
- source_word: וְתִסֹּב
  choice: என்னிடம் திரும்பி
  rationale: סבב என்பதன் அடிப்படைப் பொருள் ‘திரும்பு’. ஆறுதல்படுத்துதல் தொடர்வதால், சங்கீதக்காரனை நோக்கித் திரும்புதல் என்ற திசைநுணுக்கம் தமிழில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: תְּנַחֲמֵנִי
  choice: என்னை ஆறுதல்படுத்துவீராக
  rationale: נחם என்பதன் பியேல் வடிவம் இங்கு ‘ஆறுதல்படுத்து, தேற்று’ என்று பொருள்படும். ‘ஆறுதல்படுத்து’ நவீனத் தமிழில் தெளிவானதும் கண்ணியமானதும் ஆகும்.
theological_decisions:
- issue: நிறைவுறா வினைவடிவங்களின் மனோபாவம்
  choice: 'வேண்டுதல் அல்லது விருப்பமாக மொழிபெயர்த்தல்: ‘… செய்வீராக’'
  alternative: 'எதிர்கால நம்பிக்கைக் கூற்றாக மொழிபெயர்த்தல்: ‘நீர் … செய்வீர்’'
  rationale: எபிரெயக் கவிதையில் இந்த வடிவங்கள் எதிர்காலக் கூற்றாகவும் விருப்பம் அல்லது மன்றாட்டாகவும் அமையலாம். உடனடிச் சூழலின் நேரடி வேண்டுதலுக்கு ‘செய்வீராக’ பொருந்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமான நேரடி இறைவேண்டுதல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘மேன்மை’ மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது; ‘என்னிடம் திரும்பி’ எபிரெய உருவகத்தைத் தெளிவாக வைத்திருக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
