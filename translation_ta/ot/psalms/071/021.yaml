revisions:
- from: என் மேன்மையைப் பெருகச் செய்து, என்னிடம் திரும்பி என்னை ஆறுதல்படுத்துவீராக[a][b][c].
  to: என் மேன்மையைப் பெருக்கி, என்னிடம் திரும்பி வந்து என்னை ஆறுதல்படுத்துவீராக[a][b][c].
  rationale: The revision replaces an understandable but less idiomatic causative construction with standard Tamil ‘பெருக்கி.’ It retains the prayer form, the broad lexical force of ‘greatness,’ and the contextual interpretation of the second verb. The footnotes continue to preserve both the future-indicative possibility and the literal turning image.
