lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: எபிரெய மொழியில் அழைப்பைக் குறிக்கும் தனிச் சொல் இல்லாவிட்டாலும், தொடர்ந்து வரும் இரண்டாம் நபர் வடிவங்கள் இது நேரடி அழைப்பு என்பதைக் காட்டுகின்றன; தமிழில் அழைப்புவேற்றுமை இயல்பாக அதை வெளிப்படுத்துகிறது.
- source_word: לִמַּדְתַּנִי
  choice: நீர் எனக்குக் கற்றுக்கொடுத்தீர்
  rationale: למד என்பதன் பியேல் வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும் ‘நீர் எனக்குக் கற்றுக்கொடுத்தீர்’ எனப் பொருள்படும்; மரியாதைப் பன்மை வடிவம் நவீனத் தமிழ் இறைமொழி நடைக்கு ஏற்றது.
- source_word: מִנְּעוּרָי
  choice: என் இளமைமுதல்
  rationale: מן தொடக்கப் புள்ளியையும் נְעוּרִים இளமைப் பருவத்தையும் குறிக்கின்றன; இந்தச் சுருக்கமான தமிழ் தொடர் இரண்டையும் நேரடியாகக் காக்கிறது.
- source_word: וְעַד הֵנָּה
  choice: இன்றுவரை
  rationale: சொல்லாட்சியில் ‘இதுவரை’ என்றாலும், காலத் தொடர்ச்சியை இயல்பான நவீனத் தமிழில் ‘இன்றுவரை’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אַגִּיד
  choice: நான் அறிவித்து வருகிறேன்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் சொல்லுதல் அல்லது அறிவித்தலைக் குறிக்கிறது. சூழலிலுள்ள ‘இன்றுவரை’ என்பதுடன் தொடரும் சாட்சியறிவிப்பைத் தமிழில் இயல்பாக வெளிப்படுத்த இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: נִפְלְאוֹתֶיךָ
  choice: உமது வியத்தகு செயல்களை
  rationale: נִפְלָאוֹת கடவுளின் வியப்பூட்டும் செயல்களைக் குறிக்கக்கூடும்; ‘வியத்தகு செயல்கள்’ என்பது அதன் செயற்பொருளை இயல்பாக வெளிப்படுத்துகிறது, அதேவேளை மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதை நேரடி அழைப்பாகப் புரிந்துகொள்வதா
  choice: ‘கடவுளே’ என்ற நேரடி அழைப்பு
  alternative: கடவுளைப் பற்றிய கூற்றாக மொழிபெயர்த்தல்
  rationale: அடுத்து வரும் ‘நீர்’ சார்ந்த இரண்டாம் நபர் வினை மற்றும் உரிமை வடிவங்கள், சங்கீதக்காரன் கடவுளை நேரடியாக நோக்கிப் பேசுவதை வலுவாகக் காட்டுகின்றன; இந்த வாசிப்பு கூடுதல் கோட்பாட்டைச் சேர்க்காமல் ஜெபத் தன்மையைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான ஜெபநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் இரண்டாம் நபருக்கு ‘நீர்/உமது’ என்ற மரியாதை வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. அடிக்குறி அது விளக்கும் ‘வியத்தகு செயல்களை’ என்பதன் பின்னரே வைக்கப்பட்டுள்ளது.
