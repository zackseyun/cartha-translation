  text: God[a], you have taught me from my youth, and to this day I declare your wondrous deeds.
translation:
  language: ta
  text: கடவுளே, என் இளமை முதல் நீர் எனக்குக் கற்றுக்கொடுத்தீர்; இன்றுவரை நான் உமது வியத்தகு செயல்களை[a] அறிவிக்கிறேன்.
  philosophy: optimal-equivalence
