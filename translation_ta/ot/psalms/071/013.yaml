source:
  edition: WLC
  text: יֵבֹ֣שׁוּ יִכְלוּ֮ שֹׂטְנֵ֪י נַ֫פְשִׁ֥/י יַֽעֲט֣וּ חֶ֭רְפָּה וּ/כְלִמָּ֑ה מְ֝בַקְשֵׁ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/013.yaml
  text: Let those who are hostile to my life be put to shame and come to an end[b][a]; let those who seek my harm be clothed with reproach and disgrace.
translation:
  language: ta
  text: என் உயிருக்கு விரோதமாய் இருப்பவர்கள் வெட்கமடைந்து அழிந்துபோவார்களாக[a]; எனக்குத் தீங்கு நாடுகிறவர்கள் நிந்தையையும் அவமானத்தையும் ஆடையாக அணிந்துகொள்வார்களாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழிந்துபோவார்களாக’ என்பதற்கு ‘முடிவுக்கு வருவார்களாக’ அல்லது ‘ஒழிந்துபோவார்களாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: வெட்கமடைவார்களாக
  rationale: வேண்டுதல் அல்லது சாபவேண்டுதல் சார்ந்த imperfect வடிவத்தின் வலிமையைத் தமிழ் வியங்கோள் அமைப்பு இயல்பாக வெளிப்படுத்துகிறது; இங்கு பொது அவமானத்தின் விளைவும் அடங்கியுள்ளது.
- source_word: יִכְלוּ
  choice: அழிந்துபோவார்களாக
  rationale: כלה என்பதன் ‘முடிவுறுதல், ஒழிந்துபோதல், அழிதல்’ என்ற பரந்த பொருள் வரம்பில், பகைவர்களின் முடிவைச் சுட்டும் கவிதைச் சூழலுக்கு இது இயல்பான தமிழ்; உடல் மரணத்தை மட்டும் கட்டாயப்படுத்தாது.
- source_word: שֹׂטְנֵי נַפְשִׁי
  choice: என் உயிருக்கு விரோதமாய் இருப்பவர்கள்
  rationale: שׂטן பகைமை கொண்ட எதிர்ப்பைக் குறிக்கிறது. இச்சூழலில் נֶפֶשׁ உடலற்ற ‘ஆத்துமா’ என்பதைவிட உயிர் அல்லது தன்னையே குறிப்பதால் ‘என் உயிருக்கு’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יַעֲטוּ
  choice: ஆடையாக அணிந்துகொள்வார்களாக
  rationale: עטה என்பதிலுள்ள போர்த்திக்கொள்ளுதல் அல்லது உடுத்திக்கொள்ளுதல் என்ற உருவகத்தைத் தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: חֶרְפָּה
  choice: நிந்தை
  rationale: பிறர் பழித்தல் மற்றும் பொதுமக்கள் முன்னிலையிலான இழிவு ஆகிய கூறுகளை ‘நிந்தை’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּכְלִמָּה
  choice: அவமானம்
  rationale: כְּלִמָּה குறிக்கும் அவமானம் அல்லது இழிவை வெளிப்படுத்துவதோடு, முந்தைய בוש மற்றும் חֶרְפָּה என்பவற்றிலிருந்து தமிழில் தேவையான சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: எனக்குத் தீங்கு நாடுகிறவர்கள்
  rationale: தனக்கு கேடு உண்டாக வேண்டும் என்று முனைவோரின் செயற்பாட்டுப் பகைமையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: சாபவேண்டுதல் சார்ந்த வியங்கோள் வினை வலிமை
  choice: வினைகளை ‘வெட்கமடைந்து அழிந்துபோவார்களாக ... அணிந்துகொள்வார்களாக’ என்ற வேண்டுதல் வடிவில் மொழிபெயர்த்தல்
  alternative: ‘வெட்கமடைந்து அழிந்துபோவார்கள் ... அணிந்துகொள்வார்கள்’ என்ற எதிர்கால முன்னறிவிப்பாக மொழிபெயர்த்தல்
  rationale: இந்தக் கவிதை-மன்றாட்டுச் சூழலில் தொடரும் imperfect வினைகள் வெறும் எதிர்கால அறிவிப்பைவிட இறைவனை நோக்கிய வேண்டுதல் அல்லது சாபவேண்டுதலாகச் செயல்படுகின்றன. தமிழ் ‘-ஆர்களாக’ வடிவம் அந்த வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடையும் இணைவரிசை அமைப்பும் பயன்படுத்தப்பட்டுள்ளன. ‘ஆடையாக அணிந்துகொள்’ என்பது எபிரேய உருவகத்தைத் தெளிவாக வைத்திருக்கிறது. ‘உயிர்’ என்பது இச்சூழலில் נֶפֶשׁ குறிக்கும் வாழ்க்கை/தன்னைச் சுட்டுகிறது; தேவையற்ற தத்துவப் பொருளைத் தவிர்க்கிறது.
