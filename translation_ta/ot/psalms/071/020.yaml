  register: நவீன தரத் தமிழில், மரியாதைக்குரிய இறைமுகப்புக்காக ‘நீர்/பீர்’ வடிவுகள் பயன்படுத்தப்பட்டுள்ளன. கவிதைச் சுருக்கமும் ‘மீண்டும்’ என்ற இரட்டிப்பு அமைப்பும் காக்கப்பட்டுள்ளன; அரிதான சமயக் கலைச்சொற்கள் முதன்மை உரையில் தவிர்க்கப்பட்டுள்ளன.
