  text: אֲשֶׁ֤ר הראית/נו צָר֥וֹת רַבּ֗וֹת וְ/רָ֫ע֥וֹת תָּשׁ֥וּב תחיי/נו וּֽ/מִ/תְּהֹמ֥וֹת הָ֝/אָ֗רֶץ תָּשׁ֥וּב תַּעֲלֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/020.yaml
  text: You[a], who have made us see many troubles and calamities, will return and revive us[d][c][b]; and from the depths of the earth you will return and bring me up.
translation:
  language: ta
  text: பல துன்பங்களையும் பேரிடர்களையும்[b] எங்களைக் காணச் செய்த[a] நீர், மீண்டும் எங்களை உயிர்ப்பிப்பீர்; பூமியின் ஆழங்களிலிருந்து[d] மீண்டும் என்னை மேலே கொண்டுவருவீர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எங்களுக்குக் காட்டிய’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை காரணவினை வடிவில் இருப்பதால், சொல்லுக்குச் சொல் பொருள் ‘எங்களைக் காணச் செய்த’ என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘தீமைகள்.’ இச்சூழலில் அது அறநெறித் தீமையை அல்ல, கேடுகளையோ துன்பங்களையோ குறிக்கிறது.'
    reason: lexical_alternative
  - marker: c
    text: எபிரெய உரை ‘எங்களை உயிர்ப்பிப்பீர்’ என்ற பன்மையிலிருந்து ‘என்னை மேலே கொண்டுவருவீர்’ என்ற ஒருமைக்கு மாறுகிறது.
    reason: textual_variant
  - marker: d
    text: ‘பூமியின் ஆழங்கள்’ என்பது மிகுந்த தாழ்வையோ மரணத்தை நெருங்கிய நிலையையோ உருவகமாகக் குறிக்கலாம்; கல்லறைக்குள் இறங்கும் படிமத்தையும் இது எதிரொலிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: הראיתנו
  choice: எங்களுக்குக் காணச் செய்த
  rationale: ראה என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளை நேரடியாகப் பாதுகாக்கிறது; வெறுமனே ‘காட்டினீர்’ என்று மென்மைப்படுத்தவில்லை.
- source_word: צָרוֹת רַבּוֹת
  choice: பல துன்பங்கள்
  rationale: רַבּוֹת என்பதை தீவிரத்தைக் குறிப்பதாக அல்லாமல் எண்ணிக்கையைக் குறிக்கும் ‘பல’ எனவும், צָרוֹת என்பதை பொதுவாகப் புரியக்கூடிய ‘துன்பங்கள்’ எனவும் மொழிபெயர்க்கிறது.
- source_word: וְרָעוֹת
  choice: பேரிடர்கள்
  rationale: இங்கு רָעוֹת அறநெறித் தீமையைக் காட்டிலும் அனுபவிக்கப்பட்ட கேடுகளையும் கடும் துயரங்களையும் குறிக்கிறது; ‘பேரிடர்கள்’ அந்தச் சூழலைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: תָּשׁוּב
  choice: மீண்டும்
  rationale: שוב இங்கு தொடர்வினையோடு சேர்ந்து செயல் மறுபடியும் நிகழ்வதைச் சுட்டுகிறது. இரு இடங்களிலும் ‘மீண்டும்’ என வழங்குவது எபிரெயத்தின் மறுபயன்பாட்டையும் தமிழின் இயல்பையும் காக்கிறது.
- source_word: תחיינו
  choice: எங்களை உயிர்ப்பிப்பீர்
  rationale: חיה என்பதன் பியேல் வடிவம் உயிரையோ உயிர்த்துடிப்பையோ மீட்டளிப்பதைக் குறிக்கிறது; ‘உயிர்ப்பிப்பீர்’ இதைச் சுருக்கமாகவும் திறந்த பொருளுடனும் தருகிறது.
- source_word: וּמִתְּהֹמוֹת הָאָרֶץ
  choice: பூமியின் ஆழங்களிலிருந்து
  rationale: תהומות என்பதன் ஆழம்/பாதாள ஆழங்கள் என்ற உருவகப் படிமத்தைத் தக்கவைத்து, அதனை வெளிப்படையாகக் கல்லறை அல்லது உயிர்த்தெழுதல் என்று குறுக்கவில்லை.
- source_word: תעלני
  choice: என்னை மேலே கொண்டுவருவீர்
  rationale: עלה என்பதன் ஹிஃபில் வடிவிலுள்ள மேலே வரச்செய்தல் என்ற இடவியல் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: נו ... ני
  choice: எங்களை ... என்னை
  rationale: மசோரா உரையில் காணப்படும் முதலாம் நபர் பன்மையிலிருந்து ஒருமைக்கான மாற்றத்தைச் சீராக்காமல் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: רָעוֹת என்பது அறநெறித் ‘தீமைகளா’ அல்லது அனுபவிக்கப்பட்ட கேடுகளா
  choice: அனுபவிக்கப்பட்ட பேரிடர்கள்
  alternative: தீமைகள்
  rationale: சூழல், கடவுள் அறநெறித் தீமை செய்தார் என்று கூறாமல், சங்கீதக்காரர் அனுபவித்த கடும் துன்பங்களைக் குறிக்கிறது. இருப்பினும் மூலச்சொல்லின் விரிந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘பூமியின் ஆழங்கள்’ என்பதைக் குறிப்பிட்ட உயிர்த்தெழுதல் மொழியாக்க வேண்டுமா
  choice: மூல உருவகத்தைத் திறந்த நிலையில் வைத்தல்
  alternative: கல்லறையிலிருந்து என்னை உயிர்த்தெழச் செய்வீர்
  rationale: இந்தப் படிமம் மிகுந்த தாழ்வு, மரணத்தை நெருங்கிய நிலை, அல்லது பாதாளம் போன்ற ஆழம் ஆகியவற்றை உணர்த்தலாம். மூல உரை வெளிப்படையாகச் சொல்லாத உடல் உயிர்த்தெழுதலை மொழிபெயர்ப்பு தீர்மானமாகச் சேர்க்கவில்லை.
- issue: பன்மை ‘எங்களை’ என்பதிலிருந்து ஒருமை ‘என்னை’ என்பதற்கான மாற்றம்
  choice: மசோரா உரையின் மாற்றத்தைப் பாதுகாத்தல்
  alternative: முழுவதையும் ‘என்னை’ அல்லது ‘எங்களை’ என்று ஒரே நபர்-எண்ணில் சீராக்குதல்
  rationale: இந்த மாற்றம் சமூக அனுபவத்திலிருந்து தனிப்பட்ட விண்ணப்பத்துக்குச் செல்லக்கூடும்; அதன் துல்லிய நோக்கம் உறுதியல்லாததால் உரையிலுள்ள பதற்றம் பாதுகாக்கப்படுகிறது.
