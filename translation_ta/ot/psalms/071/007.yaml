source:
  edition: WLC
  text: כְּ֭/מוֹפֵת הָיִ֣יתִי לְ/רַבִּ֑ים וְ֝/אַתָּ֗ה מַֽחֲסִ/י עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/007.yaml
  text: I have become like a portent to many[a], but you are my strong refuge.
translation:
  language: ta
  text: 'பலருக்கு நான் ஓர் அறிகுறிபோல்[a] ஆகியிருக்கிறேன்;

    ஆனால் நீரே எனது வலிமையான அடைக்கலம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அதிசயம்போல்,’ ‘முன்னறிகுறிபோல்,’ அல்லது ‘வியப்புக்குரிய ஒருவர்போல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹפֵת
  choice: ஓர் அறிகுறிபோல்
  rationale: מוֹפֵת என்பது அறிகுறி, அதிசயம், வியப்புக்குரிய காட்சி ஆகிய பொருள் நிழல்களைக் கொண்டது. முன்னொட்டு כְ-ஐ ‘போல்’ என்று வெளிப்படுத்தி, சூழல் தீர்மானிக்காமல் விட்டுள்ள நேர்மறை அல்லது அச்சமூட்டும் நுணுக்கத்தை ‘அறிகுறி’ ஓரளவு திறந்தவாறே வைக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: הָיִיתִי
  choice: ஆகியிருக்கிறேன்
  rationale: היה என்பதன் qatal முதலாம் நபர் ஒருமை வடிவம் கடந்தகாலத்தில் உருவாகி தற்போது தொடரும் நிலையை இச்சூழலில் குறிக்க முடியும். ‘ஆகியிருக்கிறேன்’ அந்த நிகழ்வுற்ற தற்போதைய நிலையைக் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְרַבִּים
  choice: பலருக்கு
  rationale: לְ முன்னிடைச்சொல்லையும் רַבִּים என்பதையும் நேரடியாகவும் இயல்பாகவும் ‘பலருக்கு’ என வழங்குகிறது.
- source_word: מַחֲסִי
  choice: எனது ... அடைக்கலம்
  rationale: מַחֲסֶה பாதுகாப்பிற்கான புகலிடம் அல்லது அடைக்கலத்தைக் குறிக்கிறது. ‘அடைக்கலம்’ தேவனில் கிடைக்கும் பாதுகாப்பு என்ற உருவகத்தை தெளிவாகக் காக்கிறது.
- source_word: עֹז
  choice: வலிமையான
  rationale: עֹז என்பதன் அடிப்படைப் பொருள் வலிமை. எபிரெயத்தின் ‘வலிமையின் அடைக்கலம்’ என்ற அமைப்பை இயல்பான தமிழில் ‘வலிமையான அடைக்கலம்’ எனப் பெயரடையாக வழங்குகிறது.
theological_decisions:
- issue: சங்கீதக்காரரின் பொதுநிலையை விவரிக்கும் מוֹפֵת என்பதன் நுணுக்கம்
  choice: பலருக்கு வியப்பூட்டும் அல்லது முக்கியத்துவமுள்ள ஓர் அறிகுறிபோல் அவர் ஆகியுள்ளார்; அது நல்ல அதிசயமா, அச்சமூட்டும் முன்னறிகுறியா என்பதை மொழிபெயர்ப்பு தீர்மானிக்கவில்லை.
  alternative: அவர் பலருக்கு ஒரு நேர்மறையான அதிசயமாகியுள்ளார்; அல்லது ஓர் அச்சமூட்டும் முன்னறிகுறியாகியுள்ளார்; அல்லது வெறுமனே வியப்புக்குரியவராகியுள்ளார்.
  rationale: எபிரெயச் சொல் இவ்வனைத்து நுணுக்கங்களுக்கும் இடமளிக்கிறது. ‘அறிகுறி’ என்ற முதன்மை மொழிபெயர்ப்பும் அடிக்குறிப்பிலுள்ள மாற்றுகளும் உரையின் தெளிவின்மையையும் இறையியல் இழுபறியையும் காக்கின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. சங்கீதத்தில் தேவனை நோக்கிப் பேசும் உயர்வான தொனிக்காக ‘நீரே’ பயன்படுத்தப்பட்டுள்ளது. மוֹפֵת என்பதன் பல்பொருள் தன்மையை முதன்மை உரையும் அடிக்குறிப்பும் சேர்ந்து பாதுகாக்கின்றன.
