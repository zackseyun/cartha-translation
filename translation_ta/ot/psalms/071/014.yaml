  text: But as for me[a], I will continually hope[c][b], and I will add to all your praise.
translation:
  language: ta
  text: ஆனால் நானோ எப்போதும் நம்பிக்கையோடு காத்திருப்பேன்; உமக்குச் செலுத்தும் எல்லாப் புகழுக்கும் மேலும் புகழ் சேர்ப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமக்குரிய எல்லாப் புகழுக்கும் மேலும் சேர்ப்பேன்.” எபிரெய மரபுத்தொடர், தேவனை நோக்கிய புகழைத் தொடர்ந்து அதிகரிப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: இணைப்புச் சொல்லும் தனித்த சுட்டுப்பெயரும் சேர்ந்து காட்டும் முரண்பாட்டையும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: தொடர்ச்சியாக நீடிக்கும் செயலைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: אֲיַחֵל
  choice: நம்பிக்கையோடு காத்திருப்பேன்
  rationale: יחל என்பதன் பியேல் வடிவம் நம்புவதையும் எதிர்பார்த்துக் காத்திருப்பதையும் குறிக்கக்கூடும்; இத்தொடர் அதன் இரு நுணுக்கங்களையும் பாதுகாக்கிறது.
- source_word: וְהוֹסַפְתִּי
  choice: மேலும் மேலும் பெருக்குவேன்
  rationale: יסף குறிக்கும் சேர்த்தல் அல்லது அதிகரித்தல் என்ற கருத்தை, புகழ்தலோடு இயல்பாக இணையும் தமிழில் தருகிறது.
- source_word: עַל כָּל תְּהִלָּתֶךָ
  choice: உம்மைப் புகழ்வதை
  rationale: தேவனை நோக்கிய புகழ்தலாக இத்தொடரைப் புரிந்துகொண்டு, எபிரெயச் சேர்த்தல் உருவகத்தை அடுத்த வினைச்சொல்லுடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: תְּהִלָּתֶךָ என்பதன் பொருள்
  choice: உம்மைப் புகழ்வதை
  alternative: உமது புகழுக்கெல்லாம்
  rationale: பின்னொட்டு தேவனுக்குரிய அல்லது அவரை நோக்கிய புகழைக் குறிக்கலாம். முதன்மை மொழிபெயர்ப்பு செயற்பாட்டைக் காட்டும் இயல்பான தமிழைத் தேர்ந்தெடுக்கிறது; எபிரெய அமைப்பின் நேரடியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. “உம்மை” என்ற வடிவம் சங்கீதத்தின் நேரடி தேவவிளிப்புக்கு ஏற்ற கண்ணியத்தைத் தருகிறது. முதல் அரையடியில் நம்பிக்கையும் எதிர்பார்த்துக் காத்திருத்தலும் இணைந்துள்ள மூலமொழி நுணுக்கம் காக்கப்பட்டுள்ளது.
