source:
  edition: WLC
  text: פִּ֤/י יְסַפֵּ֬ר צִדְקָתֶ֗/ךָ כָּל הַ/יּ֥וֹם תְּשׁוּעָתֶ֑/ךָ כִּ֤י לֹ֖א יָדַ֣עְתִּי סְפֹרֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/015.yaml
  text: My mouth will recount your righteousness and your salvation all day long[b][a], for I do not know their number.
translation:
  language: ta
  text: என் வாய் உமது நீதியையும்[a] உமது மீட்பையும் நாள் முழுவதும் எடுத்துரைக்கும்; ஏனெனில் அவற்றின் எண்ணிக்கை எனக்குத் தெரியாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது நியாயத்தையும்” அல்லது “உமது நீதியான செயல்களையும்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் சொற்சார்ந்த வகையில், “எண்ணிக்கைகளை நான் அறியேன்.” அதாவது, தேவனுடைய நீதியான மற்றும் மீட்கும் செயல்கள் எண்ண முடியாத அளவுக்கு மிகுதியானவை.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: என் வாய்
  rationale: எபிரெய உரையின் நேரடியான உருவகத்தைத் தக்கவைத்து, புகழ்ச்சியை வெளிப்படுத்தும் கருவியாக வாயை முன்னிறுத்துகிறது.
- source_word: יְסַפֵּר
  choice: எடுத்துரைக்கும்
  rationale: பியேல் வடிவம் விரிவாகச் சொல்லுதல் அல்லது விவரித்துரைத்தல் என்ற பொருளைக் கொண்டது; இயல்பான நவீன தமிழில் இதை ‘எடுத்துரைக்கும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: צִדְקָתֶךָ
  choice: உமது நீதி
  rationale: தெய்வீக நேர்மையையும் நியாயத்தையும் உள்ளடக்கும் மூலமொழியின் அருவப் பெயர்ச்சொல்லைத் தக்கவைக்கிறது; அதைச் செயல்களாக மட்டும் சுருக்கவில்லை.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: தொடர்ச்சியான கால அளவைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொற்றொடர்.
- source_word: תְּשׁוּעָתֶךָ
  choice: உமது மீட்பு
  rationale: ஆபத்திலிருந்து காப்பாற்றுதல் மற்றும் விடுவித்தல் ஆகிய சூழல்சார் பொருள்களை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘இரட்சிப்பு’ என்பதும் சாத்தியமான மாற்று.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தொடர்ந்து எடுத்துரைப்பதற்கான காரணத்தை அறிமுகப்படுத்தும் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: לֹא יָדַעְתִּי
  choice: எனக்குத் தெரியாது
  rationale: வடிவத்தில் நிறைவுநிலை வினையாக இருந்தாலும், சூழலில் பேசுபவரின் தற்போதைய அறிவின்மை அல்லது கணக்கிட இயலாமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: סְפֹרוֹת
  choice: அவற்றின் எண்ணிக்கை
  rationale: மூலத்தில் பன்மையான ‘எண்ணிக்கைகள்/கணக்குகள்’ என்று இருந்தாலும், முன்னர் கூறப்பட்ட தேவனுடைய நீதியும் மீட்பும் எண்ணிக்கைக்கு அப்பாற்பட்டவை என்ற சூழல்சார் பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: צִדְקָתֶךָ என்பதை அருவப் பண்பாகவா அல்லது நீதியான செயல்களாகவா மொழிபெயர்ப்பது
  choice: முதன்மை உரையில் ‘உமது நீதி’
  alternative: ‘உமது நியாயம்’ அல்லது ‘உமது நீதியான செயல்கள்’
  rationale: எபிரெயில் ஒருமை அருவப் பெயர்ச்சொல் இருப்பதால் ‘நீதி’ அதை நேரடியாகத் தக்கவைக்கிறது. சங்கீதங்களில் தேவனுடைய நீதி அவரது உண்மையுள்ள மீட்புச் செயல்களையும் உள்ளடக்கக்கூடும்; ஆனால் அதைச் செயல்கள் என்று மட்டும் தீர்மானிக்காமல் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: סְפֹרוֹת என்பது எதைக் குறிக்கிறது என்பது வெளிப்படையாகச் சொல்லப்படாதிருத்தல்
  choice: சூழலின்படி ‘அவற்றின் எண்ணிக்கை’
  alternative: ‘எண்ணிக்கைகளை நான் அறியேன்’ என்ற சொற்சார்ந்த வாசிப்பு
  rationale: மூலத்தில் நேரடியான சுட்டுப்பெயர் இல்லை. எனினும் முன் கூறப்பட்ட தேவனுடைய நீதியையும் மீட்பையும் கணக்கிட முடியாத அளவு பெரிதாகக் கூறுவதே இயல்பான தொடர்பு; மூலத்தின் சுருக்கமும் சாத்தியமான சொற்சார்ந்த வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: மரியாதைமிக்க ‘உமது’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. நடை நவீன நிலையான தமிழில் இயல்பாகவும், சங்கீதத்திற்கேற்ற கண்ணியத்துடனும் உள்ளது. மூலத்தின் ‘என் வாய்’ என்ற உருவகம் தக்கவைக்கப்பட்டு, தேவனுடைய நீதி குறித்த அருவப்பொருள் தேவையின்றி விளக்கமாக மாற்றப்படவில்லை.
