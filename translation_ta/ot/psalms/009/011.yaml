source:
  edition: WLC
  text: זַמְּר֗וּ לַ֭/יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝/עַמִּ֗ים עֲלִֽילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/011.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
translation:
  language: ta
  text: சீயோனில் குடியிருக்கும்[a] யாவேவைப் புகழ்ந்து பாடுங்கள்; மக்களிடையே அவருடைய செயல்களை அறிவியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீயோனில் வீற்றிருக்கும்.”
    reason: יֹשֵׁב என்பது இச்சூழலில் குடியிருப்பதையோ அரசராய் வீற்றிருப்பதையோ குறிக்கக்கூடும்.
lexical_decisions:
- source_word: זַמְּרוּ
  choice: புகழ்ந்து பாடுங்கள்
  rationale: זמר என்பதன் பன்மை ஏவல் வடிவம் இசையோடு துதிப்பதைக் குறிக்கிறது. ‘புகழ்ந்து பாடுங்கள்’ என்பது அதன் இசை மற்றும் வழிபாட்டு வலிமைகளை இயல்பான தமிழில் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேவைப்
  rationale: לְ முன்னொட்டு பாடலின் நோக்குப் பொருளைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: יֹשֵׁב צִיּוֹן
  choice: சீயோனில் குடியிருக்கும்
  rationale: יֹשֵׁב என்பது அமர்ந்திருத்தல் அல்லது குடியிருத்தல் என்ற இரு நுணுக்கங்களையும் கொண்டிருக்கலாம். முதன்மை உரை சீயோனில் தேவனுடைய பிரசன்னத்தை இயல்பாகத் தெரிவிக்கிறது; அரசராய் வீற்றிருக்கும் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הַגִּידוּ
  choice: அறிவியுங்கள்
  rationale: נגד என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவம் பிறருக்குப் பொதுவாக எடுத்துரைத்து அறியச் செய்வதைக் குறிக்கிறது.
- source_word: בָעַמִּים
  choice: மக்களினங்களிடையே
  rationale: בְ முன்னொட்டு ‘இடையே’ என்ற பொருளையும், עַמִּים பல்வேறு இன அல்லது சமூகக் குழுக்களையும் குறிக்கிறது. ‘மக்களினங்கள்’ என்பது அரசியல் நாடுகள் என்ற கருத்தைத் தேவையின்றி சேர்க்காமல் பன்மையைப் பாதுகாக்கிறது.
- source_word: עֲלִילוֹתָיו
  choice: அவர் செய்த செயல்களை
  rationale: עֲלִילוֹתָיו என்பது அவருடைய செயல்கள் அல்லது செய்கைகளைக் குறிக்கிறது. தமிழில் ‘அவர் செய்த செயல்கள்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத ‘வல்லமைமிக்க’ என்ற வலியுறுத்தலைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரையில் நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டப் பெயராக மாற்றாமல், வெளிப்படுத்தப்பட்ட உடன்படிக்கைப் பெயராக ‘யாவே’ என்று ஒலிபெயர்க்கிறது.
- issue: יֹשֵׁב צִיּוֹן என்பதன் நுணுக்கம்
  choice: சீயோனில் குடியிருக்கும்
  alternative: சீயோனில் வீற்றிருக்கும்
  rationale: எபிரெயப் பங்கேற்புவினை குடியிருப்பதையும் அரியணையில் அமர்ந்திருப்பதையும் சுட்டக்கூடும். முதன்மை உரை தேவனுடைய பிரசன்னத்தை முன்னிறுத்துகிறது; சாத்தியமான அரசாட்சிப் படிமத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இணையான இரண்டு பன்மை ஏவல் வினைகள் வசனத்தின் அழைப்புத் தொனியைப் பாதுகாக்கின்றன.
