  yaml_path: translation/ot/psalms/009/007.yaml
  text: But Yahweh sits enthroned forever[b][a]; he has established his throne for judgment.
translation:
  language: ta
  text: ஆனால் யாவே என்றென்றும் அரியணையில் வீற்றிருக்கிறார்[a]; அவர் நீதித்தீர்ப்புக்காகத் தமது அரியணையை நிலைநிறுத்தியிருக்கிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக, “அமர்ந்திருக்கிறார்”; இங்குள்ள அரியணைச் சூழலில் அரசராக வீற்றிருக்கும் பொருள் வெளிப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் நீதிக்காகத் தமது அரியணையை ஆயத்தப்படுத்தியிருக்கிறார்.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: ஆனால் யாவே
  rationale: முந்தைய சூழலில் தீயோரின் அழிவுக்கு மாறாக யாவேயின் நிலையான ஆட்சியை எடுத்துக்காட்டுவதால் וְ இணைப்பு எதிர்மறைத் தொடர்பைக் காட்டும் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது; יהוה என்பது ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: முடிவில்லாத, நிலையான காலத்தைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: יֵשֵׁב
  choice: அரியணையில் வீற்றிருக்கிறார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘அமர்ந்திருக்கிறார்’; இவ்வசனத்தின் அரியணை மற்றும் நீதித்தீர்ப்புச் சூழலில் அரசருக்குரிய அமர்வை இயல்பாக வெளிப்படுத்த ‘அரியணையில் வீற்றிருக்கிறார்’ என்று தரப்பட்டது.
- source_word: כּוֹנֵן
  choice: நிலைநிறுத்தியிருக்கிறார்
  rationale: Polel வடிவம் உறுதியாக அமைத்தல் அல்லது நிலைநிறுத்துதல் என்ற பொருளைக் கொண்டது; நிறைவேற்றப்பட்டு தொடர்ந்து நிலைக்கும் செயலை இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: לַמִּשְׁפָּט
  choice: நீதித்தீர்ப்புக்காக
  rationale: מִשְׁפָּט என்பது ‘தீர்ப்பு’ அல்லது ‘நீதி’ எனப் பொருள்படலாம்; அரியணையில் இருந்து மேற்கொள்ளப்படும் நீதிசார் செயல் இங்கு முன்னிலைப்படுவதால் ‘நீதித்தீர்ப்பு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּסְאוֹ
  choice: தமது அரியணையை
  rationale: யாவே என்ற மரியாதைக்குரிய ஒருமை எழுவாயுடன் இயல்பாகப் பொருந்தும் தற்சுட்டு உடைமை வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய உரையில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இடம்பெறுவதால், பொதுப் பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது.
- issue: יֵשֵׁב என்பதில் உள்ள தெய்வீக அரசாட்சி நயம்
  choice: அரியணையில் வீற்றிருக்கிறார்
  alternative: அமர்ந்திருக்கிறார்
  rationale: எபிரெய வினையின் நேரடிப் பொருளை அரச மற்றும் நீதித்தீர்ப்புச் சூழலுடன் இணைத்து இயல்பான தமிழில் தெரிவிக்கிறது; அதேவேளை நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: מִשְׁפָּט என்பதன் பொருள் நயம்
  choice: நீதித்தீர்ப்பு
  alternative: நீதி
  rationale: சொல் தீர்ப்பளிக்கும் செயலும் நீதியும் ஆகிய இரு நயங்களைக் கொண்டது; அரியணைச் சூழலில் நீதிசார்ந்த தீர்ப்பளித்தல் முதன்மையாகத் தெரிகிறது, ஆனால் மாற்று நயம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழில், வழிபாட்டு மரியாதையையும் கவிதைநயத்தையும் காக்கும் தெளிவான நடை பயன்படுத்தப்பட்டது. ‘வீற்றிருக்கிறார்’, ‘தமது’ ஆகியவை உயர்ந்த ஆனால் பொதுவாகப் புரியும் மரியாதை வடிவங்கள்; மூலத்தின் அரசாட்சி மற்றும் நீதித்தீர்ப்பு உருவகம் பாதுகாக்கப்பட்டது.
