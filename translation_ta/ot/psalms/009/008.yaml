source:
  edition: WLC
  text: וְ/ה֗וּא יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק יָדִ֥ין לְ֝אֻמִּ֗ים בְּ/מֵישָׁרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/008.yaml
  text: And he will judge the world in righteousness[b][a]; he will govern the peoples with fairness.
translation:
  language: ta
  text: 'அவரே உலகத்தை[a] நீதியின்படி நியாயந்தீர்ப்பார்;

    மக்களினங்களுக்கு நேர்மையுடன்[b] தீர்ப்பளிப்பார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதர்கள் வாழும் உலகத்தை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பாரபட்சமின்றி” அல்லது “செம்மையாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: அவரே
  rationale: இணைப்புச் சொல்லுடன் வரும் தனிப்பெயர் சுட்டுப்பெயர் பொருளின் தொடர்ச்சியையும் மிதமான வலியுறுத்தலையும் தருகிறது; தமிழில் “அவரே” அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִשְׁפֹּט
  choice: நியாயந்தீர்ப்பார்
  rationale: שׁפט என்பதன் நீதித்துறை மற்றும் ஆட்சிசார் பொருளைத் தெளிவாகக் காட்டுகிறது; கவிதைச் சூழலிலுள்ள yiqtol வடிவம் இங்கு எதிர்கால அறிவிப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תֵּבֵל
  choice: உலகத்தை
  rationale: இச்சொல் வெறும் நிலப்பரப்பை மட்டுமல்லாமல் மனிதர்கள் வாழும் உலகத்தைக் குறிக்கலாம்; “உலகம்” நவீனத் தமிழில் இயல்பாகவும் பரந்த நோக்கைத் தக்கவைத்தும் உள்ளது.
- source_word: בְּצֶדֶק
  choice: நீதியின்படி
  rationale: தீர்ப்பின் ஒழுக்கநெறியான தரத்தையோ முறையையோ குறிக்கிறது; “நீதியின்படி” என்பது நீதியைத் தீர்ப்பின் அளவுகோலாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָדִין
  choice: தீர்ப்பளிப்பார்
  rationale: דין என்பதும் நீதித்தீர்ப்பு வழங்குவதைக் குறிக்கிறது. முதல் அடியின் சொல்லை அப்படியே மீண்டும் இடாமல், இணைவரியின் நீதித்துறைப் பொருளைத் தக்கவைக்கிறது.
- source_word: לְאֻמִּים
  choice: மக்களினங்களுக்கு
  rationale: לאמים என்பது பல மக்கள் கூட்டங்களையோ தேச மக்களையோ குறிக்கிறது; நவீன தேசிய அரசுகளாக மட்டும் பொருளைக் குறுக்காமல் பன்மையைப் பாதுகாக்கிறது.
- source_word: בְּמֵישָׁרִים
  choice: நேர்மையுடன்
  rationale: מֵישָׁרִים குறிக்கும் நேர்மை, செம்மை, பாரபட்சமின்மை ஆகிய நுண்பொருள்களைப் பொதுவாசகருக்கு இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: மனிதகுலம் முழுவதின்மேலும் கடவுளுடைய நீதித்தீர்ப்பு
  choice: இவ்வசனம் கடவுள் உலகத்தையும் மக்களினங்களையும் நீதியாகத் தீர்ப்பார் என்று கூறுகிறது; தீர்ப்பின் குறிப்பிட்ட கால அட்டவணையை நிர்ணயிக்கவில்லை.
  alternative: இது தொடர்ந்து நிகழும் தற்போதைய ஆட்சியையோ குறிப்பாக இறுதி நியாயத்தீர்ப்பையோ குறிக்கிறது என்று வரையறுத்தல்.
  rationale: எபிரெயக் கவிதையிலுள்ள yiqtol வடிவங்கள் எதிர்காலச் செயலையோ இயல்பாகத் தொடரும் செயலையோ குறிக்கக்கூடும். தமிழ் எதிர்கால வடிவம் வசனத்தின் அறிவிப்புத் தன்மையைப் பாதுகாக்கிறது; ஆனால் ஒரு குறிப்பிட்ட இறுதிக்காலக் கோட்பாட்டைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர் புரிந்துகொள்ளும் வகையிலும் சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. இரு இணை அடிகளின் நீதித்தீர்ப்பு சார்ந்த பொருள் காக்கப்பட்டு, தமிழில் கடினமான சொல் மறுபடியைத் தவிர்க்க “நியாயந்தீர்ப்பார் / தீர்ப்பளிப்பார்” என மாறுபடுத்தப்பட்டுள்ளது.
