  edition: WLC
  text: בְּ/שׁוּב אוֹיְבַ֥/י אָח֑וֹר יִכָּשְׁל֥וּ וְ֝/יֹאבְד֗וּ מִ/פָּנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/003.yaml
  text: When my enemies turn back[a], they stumble and perish before you.
translation:
  language: ta
  text: 'என் பகைவர்கள் பின்வாங்கும்போது,

    அவர்கள் உமது முன்னிலையில் தடுமாறி அழிந்துபோவார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது சந்நிதியில்.” சொல்லர்த்தமாக, “உமது முகத்திற்கு முன்பிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: பின்வாங்கும்போது
  rationale: בְּ + שוב என்பதன் infinitive construct காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது. சூழலில் אָחוֹר உடன் சேர்ந்து இது பின்வாங்குதலைக் குறிக்கிறது.
- source_word: אוֹיְבַי
  choice: என் பகைவர்கள்
  rationale: אויב என்ற பெயர்ச்சொல்லுடன் முதலாம் நபர் ஒருமை உரிமை விகுதி இணைந்து நேரடியாக ‘என் பகைவர்கள்’ எனப் பொருள்படுகிறது.
- source_word: אָחוֹר
  choice: பின்- (பின்வாங்கு என்பதில்)
  rationale: இச்சொல் שוב உடன் வினையடையாக வந்து பின்னோக்கித் திரும்புதல் அல்லது பின்வாங்குதலைக் குறிக்கிறது; தமிழில் இயல்பாக ஒரே வினைச்சொல்லாக வழங்கப்பட்டுள்ளது.
- source_word: יִכָּשְׁלוּ
  choice: அவர்கள் தடுமாறி
  rationale: כשל என்பதன் Niphal வடிவம் தடுமாறுதல் அல்லது நிலைகுலைதலைக் குறிக்கிறது. அடுத்துள்ள அழிவைக் குறிக்கும் வினையை முன்கூட்டியே இதில் சேர்க்காமல் அதன் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְיֹאבְדוּ
  choice: அழிந்துபோவார்கள்
  rationale: אבד என்பதன் Qal வடிவம் அழிந்துபோதல் அல்லது ஒழிந்துபோதலைக் குறிக்கிறது. கவிதை இணைப்பையும் முடிவின் தீவிரத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: מִפָּנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: சொல்லர்த்தமாக ‘உமது முகம்/சந்நிதியிலிருந்து’ என்பதாகும். ‘உமக்கு முன்பாக’ என்பது இட-உறவு சார்ந்த பொருளைப் பாதுகாக்கும் இயல்பான, மரியாதையான தமிழ்; காரணப் பொருளுடைய மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: பகைவர்களின் வீழ்ச்சியில் இறைச் செயலின் விதம்
  choice: அவர்கள் தேவனுக்கு முன்பாகத் தடுமாறி அழிவதாக மட்டும் மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: தேவன் அவர்களை நேரடியாக அழிக்கிறார்; அல்லது அவரது சந்நிதி தோன்றியதாலேயே அவர்கள் அழிகிறார்கள்.
  rationale: எபிரெய உரை வீழ்ச்சியின் துல்லியமான செயல்முறையை விளக்காமல், அது தேவனுடைய முகம்/சந்நிதிக்கு முன்பாக அல்லது அதனால் நிகழ்வதாகக் கூறுகிறது. அந்தத் தெய்வவியல் அழுத்தமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், கவிதைக்கேற்ற கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சங்கீதத்தில் தேவனை நோக்கிப் பேசும் மரியாதையைத் தக்கவைக்க ‘உமக்கு’ தேர்ந்தெடுக்கப்பட்டது; இரண்டு எபிரெய வினைகளின் வரிசையும் பாதுகாக்கப்பட்டுள்ளது.
