source:
  edition: WLC
  text: קוּמָ֣/ה יְ֭הוָה אַל יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: Rise up[a], O Yahweh; do not let man prevail; let the nations be judged before you.
translation:
  language: ta
  text: யாவே, எழுந்தருளும்! மனிதன்[a] மேலோங்காதபடி செய்யும்; நாடுகள் உமது முன்னிலையில் நியாயந்தீர்க்கப்படட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரணத்திற்குட்பட்ட மனிதன்”; אֱנוֹשׁ என்ற எபிரெயச் சொல் மனிதரின் பலவீனத்தையோ மரணத்திற்குட்பட்ட நிலையையோ அடிக்கடி வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: எழுந்தருளும்
  rationale: தேவனை நோக்கிய קום என்பதன் கட்டளை வடிவம். தெய்வீகத் தலையீட்டுக்கான மன்றாட்டை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אַל יָעֹז
  choice: வெற்றிபெற விடாதேயும்
  rationale: மனிதன் வலிமைபெற்று மேலோங்குவதையோ வெல்வதையோ அனுமதிக்க வேண்டாம் என்ற மன்றாட்டு வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֱנוֹשׁ
  choice: மனிதன்
  rationale: ஒருமை வடிவத்தையும் மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்தும் பொருளையும் காக்கிறது; சொல்லிலுள்ள நிலையாமை/பலவீனத்தின் நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִשָּׁפְטוּ
  choice: நியாயந்தீர்க்கப்படட்டும்
  rationale: שפט என்பதன் நிஃபால் வடிவத்திலுள்ள செயப்பாட்டு நீதித்தீர்ப்பு பொருளையும் வேண்டுகோள் சார்ந்த வியங்கோள் வலிமையையும் காக்கிறது.
- source_word: גּוֹיִם
  choice: தேசத்தார்
  rationale: தேசிய இனங்களாகிய மக்களைச் சுட்டும் சங்கீதப் பயன்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַל־פָּנֶיךָ
  choice: உமது முன்னிலையில்
  rationale: சொல்லுக்குச் சொல் 'உமது முகத்திற்கு முன்' என்பதன், தேவனுடைய சமூகத்தில் நீதித்தீர்ப்புக்கு நிற்பது என்ற இயல்பான பொருளை வழங்குகிறது.
theological_decisions:
- issue: אֱנוֹשׁ என்பதன் மனிதவியல் நுண்பொருள்
  choice: மனிதன்
  alternative: சாவுக்குரிய மனிதன்
  rationale: மூலத்தின் ஒருமை மற்றும் பிரதிநிதித்துவப் பொருளை முதன்மை உரை காக்கிறது. மனிதனின் நிலையாமையையும் பலவீனத்தையும் வலியுறுத்தக்கூடிய மாற்றுப் பொருள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சங்கீத மன்றாட்டுக்கு ஏற்ற கண்ணியமான வழிபாட்டு நடையும் புரிந்துகொள்ள எளிய சொற்களும் பயன்படுத்தப்பட்டுள்ளன. மரியாதை ஒருமை வடிவங்களான “உமது”, “விடாதேயும்” என்பவை தேவனை நோக்கிய உரைக்கு ஏற்றவாறு அமைந்துள்ளன.
