    rationale: יָעֹז concerns becoming strong or prevailing. “மனிதன் மேலோங்காதபடி செய்யும்” preserves the prayer’s negative-jussive force in fluent modern Tamil.
  - severity: low
    issue: “தேசத்தார்” is potentially narrower or misleading for גּוֹיִם.
    rationale: It may denote a country's citizens. “நாடுகள்” naturally represents the collective nations in this context.
