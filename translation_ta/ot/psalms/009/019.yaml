    issue: The divine name is rendered “யெகோவா.”
    rationale: The source is יהוה, and the English POB audit trail explicitly adopts “Yahweh” rather than “Jehovah.” “யாவே” is the corresponding Tamil transliteration and avoids importing a different traditional vocalization.
