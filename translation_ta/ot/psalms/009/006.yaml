id: PSA.9.6
reference: Psalms 9:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הָֽ/אוֹיֵ֨ב תַּ֥מּוּ חֳרָב֗וֹת לָ֫/נֶ֥צַח וְ/עָרִ֥ים נָתַ֑שְׁתָּ אָבַ֖ד זִכְרָ֣/ם הֵֽמָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
translation:
  language: ta
  text: பகைவன் என்றென்றும் பாழாகி ஒழிந்தான்[a]; நீ நகரங்களை வேரோடு பிடுங்கினாய்; அவர்களின் நினைவே அழிந்துபோயிற்று.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பகைவனே, அழிவுகள் என்றென்றைக்கும் முடிவடைந்தன.” எபிரெயத் தொடக்கத்தைப் பகைவனைப் பற்றிய கூற்றாக அல்லாமல், அவனை நோக்கிய நேரடி விளிப்பாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
  choice: பகைவன்
  rationale: முன்னொட்டாகிய திட்டவுரை இயல்பாக ‘பகைவன்’ என்ற எழுவாயைக் காட்டுகிறது; எனினும் நேரடி விளியாகவும் இதைப் புரிந்துகொள்ளலாம்.
- source_word: תַּמּוּ
  choice: முடிவுக்கு வந்தான்
  rationale: תמם என்பதன் நிறைவு அல்லது முடிவடைதல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது. எபிரெய வடிவம் பன்மையாக இருப்பதால் தொடக்கத் தொடரின் தொடரியல் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חֳרָבוֹת
  choice: இடிபாடுகளில்
  rationale: அழிவால் எஞ்சிய பாழிடங்கள் அல்லது இடிபாடுகள் என்ற காட்சியைத் தெளிவாகத் தருகிறது; முதன்மை வாசிப்பில் பகைவனின் நிரந்தர முடிவின் சூழலாக மொழிபெயர்க்கப்படுகிறது.
- source_word: לָנֶצַח
  choice: என்றென்றும் நிலைக்கும்
  rationale: அழிவின் நீடித்த, மாற்றமற்ற தன்மையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְעָרִים
  choice: நகரங்களை
  rationale: עִיר என்பதன் வழக்கமான பொருள் ‘நகரம்’; இங்கு அதைத் தளர்த்த வேண்டிய சூழலியல் காரணம் இல்லை.
- source_word: נָתַשְׁתָּ
  choice: வேரோடு பிடுங்கிப்போட்டாய்
  rationale: נתשׁ சொல்லில் உள்ள வேருடன் பிடுங்கி முழுமையாக அகற்றும் வலிமையான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אָבַד
  choice: அழிந்துபோனது
  rationale: முற்றிலும் இல்லாமற்போதல் அல்லது மறைந்துபோதல் என்ற பொருளைச் சீரிய, இயல்பான தமிழில் தருகிறது.
- source_word: זִכְרָם הֵמָּה
  choice: அவற்றைப் பற்றிய நினைவே
  rationale: இறுதியிலுள்ள தனிப்பட்ட சுட்டுப்பெயரின் அழுத்தத்தை ‘நினைவே’ என்பதன் மூலம் வெளிப்படுத்தி, நகரங்களைக் குறிக்கும் தொடர்பையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: தொடக்கக் கூற்றின் தொடரியல் அமைப்பு
  choice: பகைவனின் இறுதி அழிவைப் பற்றிய அறிவிப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘பகைவனே, அழிவுகள் என்றென்றைக்கும் முடிந்துபோயின’ என்ற நேரடி விளிப்பு வாசிப்பு.
  rationale: הָאוֹיֵב என்பதை எழுவாயாக எடுத்துக்கொள்வது சூழலில் பகைவனுக்கு நேர்ந்த தீர்ப்பை இயல்பாக எடுத்துரைக்கிறது. ஆயினும் பின்வரும் பன்மை வினைச்சொல்லால் நேரடி விளிப்பு வாசிப்பும் சாத்தியம்; ஆகவே அது அடிக்குறிப்பில் தரப்படுகிறது. இது தொடரியல் சார்ந்த முடிவு, கோட்பாட்டுத் தீர்மானம் அல்ல.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வேரோடு பிடுங்கிப்போட்டாய்’ மூலத்தின் வலிமையான உருவகத்தைப் பாதுகாக்கிறது; ‘நினைவே’ இறுதி அழுத்தத்தை இயல்பாகத் தருகிறது.
