source:
  edition: WLC
  text: כִּ֤י לֹ֣א לָ֭/נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת ענוים תֹּאבַ֥ד לָ/עַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
translation:
  language: ta
  text: ஏனெனில், வறியவர் என்றென்றும் மறக்கப்படமாட்டார்; துன்புறுவோரின்[a] நம்பிக்கை எக்காலத்துக்கும் அழிந்துபோகாது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“தாழ்மையானோர்” அல்லது “சாந்தகுணமுள்ளோர்” என்றும் மொழிபெயர்க்கலாம் (எபிரெயம்: ענוים).'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயக் கவிதை, வறியவர்கள் நிரந்தரமாகக் கைவிடப்படமாட்டார்கள் என்பதை வலியுறுத்த, “என்றென்றும்,” “எக்காலத்துக்கும்” என்ற நெருங்கிய பொருளுடைய இரு காலச் சொற்றொடர்களைப் பயன்படுத்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தையும் உறுதியையும் அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: לֹא לָנֶצַח
  choice: என்றென்றும் … மாட்டார்
  rationale: நிரந்தரமாக மறக்கப்படுவதில்லை என்ற எபிரெய காலவியல் மறுப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִשָּׁכַח
  choice: மறக்கப்படமாட்டார்
  rationale: எபிரெய நிஃபால் வினையின் செயப்பாட்டு வடிவைப் பாதுகாக்கிறது; மறப்பவராக இறைவனை மொழிபெயர்ப்பில் வெளிப்படையாகச் சேர்ப்பதில்லை.
- source_word: אֶבְיוֹן
  choice: வறியவர்
  rationale: வறுமையிலும் தேவையிலும் இருக்கும் ஒருவரைக் குறிக்கும் சொல்லின் பொருளை நவீனத் தமிழில் கண்ணியமாகத் தருகிறது.
- source_word: תִּקְוַת
  choice: நம்பிக்கை
  rationale: பின்வரும் பெயர்ச்சொல்லோடு இணைந்துள்ள ‘நம்பிக்கை’ என்ற இயல்பான பொருளைத் தருகிறது.
- source_word: ענוים
  choice: துன்புறுவோர்
  rationale: இணைவாக்கியத்தில் ‘வறியவர்’ என்பதோடு ஒத்த சமூகத் துயர்நிலையை முன்னிறுத்துகிறது; சொல்லின் ‘தாழ்மையானோர்’ என்ற பொருள் வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: תֹּאבַד
  choice: அழிந்துபோகாது
  rationale: אבד என்பதன் ‘அழிந்துபோதல்’ என்ற வலுவான பொருளைத் தருகிறது; முதல் கூறிலுள்ள மறுப்பு இரண்டாம் கூறிலும் பொருளால் தொடர்வதைத் தமிழில் வெளிப்படையாக்குகிறது.
- source_word: לָעַד
  choice: எக்காலத்துக்கும்
  rationale: לָנֶצַח என்பதற்கு இணையான கவிதைச் சொற்றொடரை வேறுபட்ட இயல்பான தமிழ்ச் சொல்லால் அளித்து நிரந்தர கைவிடல் இல்லை என்ற வலியுறுத்தலைக் காக்கிறது.
theological_decisions:
- issue: ‘மறக்கப்படமாட்டார்’ என்ற செயப்பாட்டின் மறைமுகச் செய்பவர்
  choice: இறைவன் வறியவரை மறக்கமாட்டார் என்பது சூழலில் உணரப்பட்டாலும், இறைவனை வெளிப்படையான இலக்கண எழுவாயாகச் சேர்க்கவில்லை.
  alternative: இறைவன் வறியவரை என்றென்றும் மறக்கமாட்டார்.
  rationale: மூல எபிரெயம் செய்பவரைப் பெயரிடாமல் செயப்பாட்டு வடிவைப் பயன்படுத்துகிறது; அதையே காப்பது கவிதை வடிவையும் உண்மையான மறைமுகத்தன்மையையும் பாதுகாக்கிறது.
- issue: ענוים என்பதன் பொருள்
  choice: துன்புறுவோர்
  alternative: தாழ்மையானோர்; சாந்தகுணமுள்ளோர்
  rationale: אֶבְיוֹן (‘வறியவர்’) என்பதுடனான இணைநிலையில் சமூகத் துன்பம் முன்னிலைப்படுகிறது. எனினும் ஒழுக்கநிலை சார்ந்த தாழ்மை என்ற பொருள் வாய்ப்பும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: இரண்டாம் கூறில் மறுப்பு
  choice: ‘அழிந்துபோகாது’ என்று மறுப்பை வெளிப்படையாக வழங்குதல்
  alternative: ‘அழிந்துபோகும்’ என்று எபிரெய மேற்பரப்பு வடிவை மட்டும் பின்பற்றுதல்
  rationale: முதல் கூறின் לֹא என்ற மறுப்பு கவிதை இணைநிலையின் வழியாக இரண்டாம் கூறுக்கும் தொடர்கிறது; தமிழில் அதைச் சொல்லாவிட்டால் எதிர்மாறான பொருள் தோன்றும்.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு இணைக் கூறுகளின் சமநிலை காக்கப்பட்டுள்ளது; ‘வறியவர்’ ஒருமை வடிவம் எபிரெயக் கூட்டுப்பொருள் ஒருமையைப் பின்பற்றுகிறது.
