source:
  edition: WLC
  text: טָבְע֣וּ ג֭וֹיִם בְּ/שַׁ֣חַת עָשׂ֑וּ בְּ/רֶֽשֶׁת ז֥וּ טָ֝מָ֗נוּ נִלְכְּדָ֥ה רַגְלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/015.yaml
  text: The nations have sunk into the pit they made; in the net they hid[a], their own foot has been caught.
translation:
  language: ta
  text: நாடுகள் வெட்டிய குழியில் மூழ்கின; அவை மறைத்து வைத்த வலையில் அவற்றின் கால்[a] சிக்கிக்கொண்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில் ‘கால்’ ஒருமையில் உள்ளது; இது நாடுகளை ஒட்டுமொத்தமாகக் குறிக்கும் ஒருமையாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ
  choice: அமிழ்ந்துபோனார்கள்
  rationale: Qal நிறைவுவினை, ஆழத்தில் மூழ்கி அழிவுக்குள்ளாகும் உருவகத்தைத் தருகிறது; ‘அமிழ்ந்துபோனார்கள்’ அந்தப் படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: גּוֹיִם
  choice: இனத்தார்
  rationale: இந்தச் சூழலில் எதிர்த்து நிற்கும் மக்கள் கூட்டங்களை ஒட்டுமொத்தமாகக் குறிக்கிறது. ‘இனத்தார்’ என்பது அரசியல் நாடுகளை மட்டும் குறுக்காமல் மக்களைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: בְּשַׁחַת
  choice: குழியில்
  rationale: שַׁחַת என்பது குழி அல்லது பொறிக்காக வெட்டப்பட்ட பள்ளத்தைக் குறிக்கலாம். ‘குழி’ தெளிவான concrete படிமத்தைப் பேணுகிறது.
- source_word: עָשׂוּ
  choice: வெட்டிய
  rationale: மூல வினை பொதுவாக ‘செய்தார்கள்’ என்று பொருள்பட்டாலும், குழியை உருவாக்குவதைத் தமிழில் ‘குழி வெட்டுதல்’ என்று இயல்பாகச் சொல்வதால் இத்தேர்வு செய்யப்பட்டது; அவர்கள் உருவாக்கியதிலேயே அவர்கள் விழும் நையாண்டியும் நிலைக்கிறது.
- source_word: בְּרֶשֶׁת
  choice: வலையில்
  rationale: רֶשֶׁת என்பதன் நேரடியான பொருள் ‘வலை’; இடத்தைக் குறிக்கும் בְּ தமிழில் ‘வலையில்’ என இயல்பாக வருகிறது.
- source_word: זוּ טָמָנוּ
  choice: தாங்கள் மறைத்து வைத்த
  rationale: זוּ உறவுச் சுட்டாகவும் טָמָנוּ மறைத்தல் அல்லது இரகசியமாகப் பதித்தல் என்றும் பொருள்படுகின்றன. ‘தாங்கள் மறைத்து வைத்த’ என்பது வலையை இரகசியமாக வைத்த செயலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נִלְכְּדָה
  choice: சிக்கிக்கொண்டது
  rationale: Niphal நிறைவுவினையின் ‘பிடிபட்டது/சிக்கியது’ என்ற செயல்பாட்டை ‘சிக்கிக்கொண்டது’ தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: רַגְלָם
  choice: அவர்களுடைய கால்
  rationale: எபிரெயத்தில் ‘கால்’ ஒருமையில் உள்ளது; பன்மையான மக்களைக் கூட்டாகக் குறிக்கும் அந்த ஒருமைப் படிமம் தமிழிலும் காக்கப்படுகிறது.
