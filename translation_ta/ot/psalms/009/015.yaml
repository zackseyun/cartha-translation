revisions:
- from: இனத்தார் தாங்கள் வெட்டிய குழியில் அமிழ்ந்துபோனார்கள்; தாங்கள் மறைத்து வைத்த வலையில் அவர்களுடைய கால்[a] சிக்கிக்கொண்டது.
  to: நாடுகள் வெட்டிய குழியில் மூழ்கின; அவை மறைத்து வைத்த வலையில் அவற்றின் கால்[a] சிக்கிக்கொண்டது.
  rationale: “நாடுகள்” directly and naturally renders גּוֹיִם. The revision preserves the concrete pit-and-net imagery, the irony that the nations are trapped by what they made and concealed, and the Hebrew’s singular collective “foot.”
