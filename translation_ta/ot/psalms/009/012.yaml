  yaml_path: translation/ot/psalms/009/012.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
translation:
  language: ta
  text: ஏனெனில், சிந்தப்பட்ட இரத்தத்திற்குக் கணக்குக் கேட்கிறவர் அவர்களை நினைவுகூருகிறார்; துன்புறுகிறவர்களின்[a] கூக்குரலை அவர் மறப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏழைகளின்.” இங்கு வரும் எபிரெயச் சொல் ஏழைகள், துன்புறுகிறவர்கள், தாழ்மையானவர்கள் அல்லது ஒடுக்கப்பட்டவர்கள் என்போரைக் குறிக்கலாம். இரத்தச்சிந்துதலும் நீதிக்கான முறையீடும் பேசப்படும் இச்சூழலில், துன்பத்தை அனுபவிக்கும் மக்களைக் குறிக்கும் பரந்த பொருள் பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துவதால், சங்கீதத்தின் விளக்க ஓட்டத்துக்கு இயல்பாக அமைகிறது.
- source_word: דֹרֵשׁ דָּמִים
  choice: சிந்தப்பட்ட இரத்தத்திற்குக் கணக்குக் கேட்கிறவர்
  rationale: இது இரத்தத்தைத் தேடுவதை அல்ல, கொலை மற்றும் இரத்தச்சிந்துதலுக்குப் பொறுப்புக் கேட்டு நீதி செய்வதைக் குறிக்கிறது. குறிப்பிட்ட சட்டப் பதவியைத் தேவையின்றி உணர்த்தாமல் நீதிசார் பொருளைப் பாதுகாக்கிறது.
- source_word: אוֹתָם
  choice: அவர்களை
  rationale: எபிரெய உரையின் பன்மைச் சுட்டுப்பெயரைப் பாதுகாத்து, துன்புறுகிற மக்களை ஒரு குழுவாகச் சுட்டுகிறது.
- source_word: זָכָר
  choice: நினைவுகூருகிறார்
  rationale: வடிவில் நிறைவேற்றுக் காலமாக இருந்தாலும், கவிதைச் சூழலில் தேவனுடைய தொடர்ந்தும் நிலையான செயல்பாட்டை வெளிப்படுத்துகிறது.
- source_word: לֹא שָׁכַח
  choice: மறப்பதில்லை
  rationale: இணையான முந்தைய வினையுடன் சேர்ந்து, தொடரும் உண்மையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: צַעֲקַת
  choice: கூக்குரலை
  rationale: துன்பத்தில் நீதிக்காக எழுப்பப்படும் உரத்த அழைப்பை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עניים
  choice: துன்புறுகிறவர்கள்
  rationale: இச்சொல் ஏழைகள், துன்புறுகிறவர்கள், தாழ்மையானவர்கள் அல்லது ஒடுக்கப்பட்டவர்கள் என்போரைக் குறிக்கலாம். இரத்தச்சிந்துதலும் நீதிக்கான முறையீடும் பேசப்படும் இச்சூழலில், பொருளாதார வறுமைக்கு மட்டும் சுருக்காமல் துன்பத்தின் பரந்த பொருளை இத்தேர்வு தருகிறது.
theological_decisions:
- issue: דֹרֵשׁ דָּמִים என்பதில் வெளிப்படும் இறைநீதி
  choice: இரத்தச்சிந்துதலுக்குத் தேவன் பொறுப்புக் கேட்டு, அநியாயமாகக் கொல்லப்பட்டவர்களுக்கு நீதி செய்கிறவராகச் சித்தரிக்கப்படுகிறார்.
  alternative: தேவன் இரத்தச்சிந்துதலை வெறுமனே கவனிக்கிறார்; அல்லது சொல்லாட்சிப்படி இரத்தத்தைத் தேடுகிறார்.
  rationale: இந்த மொழிவழக்கு இரத்தப்பழிக்கான நீதிசார் கணக்குத் தீர்ப்பைக் குறிக்கிறது; இரத்தத்துக்கான நேரடியான விருப்பத்தைக் குறிக்காது. அதேவேளையில், குறிப்பிட்ட ஒரு தொழில்நுட்பச் சட்டப் பதவியை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. “சிந்தப்பட்ட இரத்தத்திற்குக் கணக்குக் கேட்கிறவர்” என்பது எபிரெய மொழிவழக்கின் நீதிசார் வலிமையைப் பாதுகாக்கிறது; “துன்புறுகிறவர்கள்” என்பது עניים என்ற சொல்லின் சூழலுக்கேற்ற பரந்த பொருளை முதன்மைப்படுத்துகிறது.
