source:
  edition: WLC
  text: לַ֭/מְנַצֵּחַ עַלְמ֥וּת לַבֵּ֗ן מִזְמ֥וֹר לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/000.yaml
  text: 'For the choirmaster: according to “Death of the Son.”[a] A psalm of David.'
translation:
  language: ta
  text: 'இசைத்தலைவருக்கு: “மகனின் மரணம்” என்ற மெட்டின்படி.[a] தாவீதின் சங்கீதம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் עַלְמוּת לַבֵּן (ஒலிபெயர்ப்பு: ‘அல்மூத் லப்பேன்’) என்பதன் பொருள் உறுதியற்றது. இது பெரும்பாலும் ஓர் இசைக்குறிப்பு அல்லது மெட்டின் தலைப்பாக இருக்கலாம்; மரபாக இது மொழிபெயர்க்கப்படாமல் ஒரு பெயரைப்போலவும் எழுதப்பட்டுள்ளது.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத்தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்த்துதலை வழிநடத்தும் தலைவரைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும், பாடற்குழுவுக்கு மட்டும் பொருளைக் குறுக்காமலும் இருக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: עַלְמוּת לַבֵּן
  choice: “மகனின் மரணம்” என்ற மெட்டின்படி
  rationale: இச்சொற்றொடரின் பொருள் உறுதியற்றது; ஆயினும் இது ஓர் இசைக்குறிப்பு அல்லது மெட்டின் தலைப்பாக இருப்பதற்கான வாய்ப்பு அதிகம். מות மற்றும் בן என்பவற்றின் சாத்தியமான சொற்பொருளையும் தலைப்பின் செயலையும் இம்மொழிபெயர்ப்பு வெளிப்படுத்துகிறது; உறுதியின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: தலைப்புகளில் பாடல் அல்லது இசைப்பாடல் வகையைக் குறிக்கும் வழக்கமான பெயர்; தமிழில் அறியப்பட்ட, dignified and natural equivalent.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவம், தொடர்பு, அர்ப்பணம் அல்லது தொகுப்பைச் சுட்டக்கூடும். ‘தாவீது இயற்றியது’ என்று குறிப்பாகத் தீர்மானிக்காமல், ‘தாவீதின்’ என்பது மூலத்தின் பரந்த தொடர்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: לְדָוִד என்பதன் உறவு
  choice: தாவீதின்
  alternative: தாவீது இயற்றிய
  rationale: ஆசிரியத்துவத்தை மூலவாசகம் வெளிப்படையாக நிர்ணயிப்பதைக் காட்டிலும் அதிகமாக உறுதிப்படுத்தாமல், தாவீதுடனான தொடர்பின் இயல்பான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. தலைப்பின் சுருக்கமான இசைநடை காக்கப்பட்டுள்ளது; அரிதான ‘பாடற்குழுத் தலைவர்’ என்பதற்குப் பதிலாகப் பரந்த பொருளுடைய ‘இசைத்தலைவர்’ தேர்ந்தெடுக்கப்பட்டது. அடிக்குறி அது விளக்கும் சொற்றொடருக்கு உடனே பின்வைக்கப்பட்டுள்ளது.
