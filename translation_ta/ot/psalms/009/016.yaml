source:
  edition: WLC
  text: נ֤וֹדַ֨ע יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּ/פֹ֣עַל כַּ֭פָּי/ו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
translation:
  language: ta
  text: யாவே தம்மை அறியச் செய்துள்ளார்[a]; அவர் நியாயத்தீர்ப்பை நிறைவேற்றியுள்ளார். பொல்லாதவன் தன் கைகளின் செயலால் கண்ணியில் சிக்குகிறான். ஹிக்காயோன்[b]. சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே அறியப்பட்டிருக்கிறார்; அவர் நியாயத்தீர்ப்பை நிறைவேற்றியுள்ளார்.” נודע என்ற எபிரெயச் சொல், “அறியப்பட்டிருக்கிறார்” என்ற நிலையையோ, “தம்மை அறியச் செய்துள்ளார்” என்ற விளைவுசார் பொருளையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “ஹிக்காயோன்” என்பது இசை அல்லது வழிபாடு சார்ந்த சொல்லாக இருக்கலாம்; இதற்கு “தியானம்” அல்லது “முழங்கும் இசை” என்றும் பொருள் இருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נודע
  choice: தம்மை அறியச் செய்துள்ளார்
  rationale: ידע என்பதன் நிஃபால் வடிவம் இங்கு ‘அறியப்பட்டுள்ளார்’ என்ற நிலையையோ, செய்த நியாயத்தீர்ப்பின் மூலம் ‘தம்மை அறியச் செய்துள்ளார்’ என்ற விளைவையோ குறிக்கலாம். முதன்மை உரை சூழலில் உள்ள தெய்வீக வெளிப்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் அதன் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מִשְׁפָּט עָשָׂה
  choice: நியாயத்தீர்ப்பை நிறைவேற்றியுள்ளார்
  rationale: இச்சொற்றொடர் நீதித்துறை சார்ந்த தீர்ப்பைச் செயல்படுத்துவதைக் குறிக்கிறது. ‘நிறைவேற்றியுள்ளார்’ என்பது வெறும் தீர்ப்பு கூறுதலைவிட அதை நடைமுறைப்படுத்திய கருத்தையும் தருகிறது.
- source_word: בפעל כפיו
  choice: தன் கைச் செயலால்
  rationale: பொல்லாதவனின் சொந்தச் செயலே அவன் சிக்குவதற்குக் காரணம் அல்லது கருவி என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: נוקש
  choice: கண்ணியில் சிக்கினான்
  rationale: வினைச்சொல்லில் உள்ள பொறி அல்லது கண்ணியில் அகப்படும் உருவகத்தைத் தமிழில் தெளிவாகத் தக்கவைக்கிறது.
- source_word: רשע
  choice: பொல்லாதவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஒருமை உரிச்சொல்லை பிரதிநிதித்துவ ஒருமையாகவே பாதுகாக்கிறது.
- source_word: הגיון
  choice: ஹிக்காயோன்
  rationale: இதன் துல்லியமான பொருள் உறுதியல்ல; இது இசை அல்லது வழிபாட்டுக் குறியீடாக இருக்கலாம். ஆகவே ஊகமான மொழிபெயர்ப்புக்குப் பதிலாக ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: סלה
  choice: சேலா
  rationale: இதன் துல்லியமான இசை அல்லது வழிபாட்டுச் செயல்பாடு உறுதியில்லாததால் மரபுப்படி ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்பின் மூலம் இறைவன் அறியப்படுதல்
  choice: யாவே செய்த நியாயத்தீர்ப்பின் மூலம் தம்மை அறியச் செய்துள்ளார் என்ற தொடர்பை முதன்மை உரையில் காட்டுதல்
  alternative: ‘யாவே அறியப்பட்டிருக்கிறார்; அவர் நியாயத்தீர்ப்பை நிறைவேற்றியுள்ளார்’ என்று நிலைசார் செயப்பாட்டு வாசிப்பாக மொழிபெயர்த்தல்
  rationale: எபிரெய נודע இரண்டு நுணுக்கங்களுக்கும் இடமளிக்கிறது. சூழல் யாவேயின் நியாயச் செயலுக்கும் அவர் அறியப்படுவதற்கும் உள்ள தொடர்பை உணர்த்துவதால் விளைவுசார் வாசிப்பு முதன்மைப்படுத்தப்படுகிறது; ஆனால் செயப்பாட்டு வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘யாவே’ என்ற தனிப்பெயர் தக்கவைக்கப்பட்டுள்ளது. ‘தன் கைச் செயல்’ மற்றும் ‘கண்ணியில் சிக்கினான்’ ஆகியவை எபிரெய உருவகத்தையும் பழிவிளைவு சார்ந்த நீதிக் கருத்தையும் எளிய தமிழில் பாதுகாக்கின்றன. உறுதியற்ற வழிபாட்டு/இசைக் குறியீடுகள் மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளன.
