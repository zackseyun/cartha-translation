  text: so that I may recount all your praises in the gates of Daughter Zion[a]; I will rejoice in your salvation.
translation:
  language: ta
  text: சீயோன் மகளின் வாசல்களில் உமது புகழ்கள் அனைத்தையும் நான் எடுத்துரைக்கும்படி; உமது இரட்சிப்பைக் குறித்து நான் களிகூருவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விடுதலை.” எபிரெயச் சொல் தற்போதைய ஆபத்திலிருந்து விடுவித்தலையும், விரிவான பொருளில் இரட்சிப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: எடுத்துரைக்கும்படி
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் எபிரெயச் சொல்லின் ஆற்றலைத் தமிழில் இயல்பான நோக்கத் தொடரால் வெளிப்படுத்துகிறது.
- source_word: אֲסַפְּרָה
  choice: நான் எடுத்துரைக்கும்படி
  rationale: பொதுவில் விவரித்துச் சொல்லுதல் அல்லது அறிவித்தல் என்ற பியேல் வினையின் பொருளைத் தெளிவாகக் கொண்டுவருகிறது.
- source_word: כָּל־תְּהִלָּתֶיךָ
  choice: உமது புகழ்கள் அனைத்தையும்
  rationale: மூலத்தில் உள்ள பன்மையையும் முழுமையைக் குறிக்கும் כָּל என்பதையும் காக்கிறது; இங்கு இது தேவனைப் புகழும் உரைகளையோ அவருடைய புகழுக்குரிய செயல்களையோ குறிக்கலாம்.
- source_word: בְּשַׁעֲרֵי בַת־צִיּוֹן
  choice: சீயோன் மகளின் வாசல்களில்
  rationale: சீயோன் அல்லது எருசலேமைப் பெண்ணாக உருவகப்படுத்தும் கவித்துவப் பெயரையும், வாசல்கள் என்ற பொதுக்கூடல் இடத்தின் படிமத்தையும் காக்கிறது.
- source_word: אָגִילָה
  choice: நான் களிகூருவேன்
  rationale: גיל குறிக்கும் மிகுந்த மகிழ்ச்சியை, கண்ணியமானதும் இன்றைய தமிழில் புரியத்தக்கதுமான சொல்லால் தருகிறது.
- source_word: בִּישׁוּעָתֶךָ
  choice: உமது இரட்சிப்பில்
  rationale: ישועה என்பதன் விரிவான இரட்சிப்பு உணர்வைத் தக்கவைத்தபடியே, உடனடி ஆபத்திலிருந்து விடுவித்தல் என்ற சூழல் பொருளையும் அடிக்குறிப்பில் பதிவு செய்கிறது.
theological_decisions:
- issue: יְשׁוּעָה என்பதன் பொருள் வரம்பு
  choice: இரட்சிப்பு
  alternative: விடுதலை அல்லது மீட்பு
  rationale: இச்சொல் தற்போதைய ஆபத்திலிருந்து காப்பாற்றுதலையும் விரிவான இரட்சிப்பையும் குறிக்க முடியும். முதன்மை உரையில் அதன் பரந்த வேதாகம ஒலியை வைத்துக்கொண்டு, உடனடிச் சூழலுக்குரிய மாற்றுப் பொருளை அடிக்குறிப்பில் தருவது உள்ளார்ந்த பொருள் இழுப்பைத் தீர்த்துவிடாமல் காக்கிறது.
- issue: בַת־צִיּוֹן என்ற உருவகம்
  choice: சீயோன் மகள்
  alternative: சீயோன், அதாவது எருசலேம்
  rationale: நகரத்தைப் பெண்ணாக உருவகப்படுத்தும் மூலத்தின் கவித்துவத்தை விளக்கவுரையால் மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், வழிபாட்டுக் கவிதைக்கேற்ற கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. “உமது,” “களிகூருவேன்” போன்ற வடிவங்கள் உயர்ந்த நடையைத் தருகின்றன; அரிதான பழமொழிநடை தவிர்க்கப்பட்டுள்ளது. நோக்கத் தொடருக்கும் அடுத்த உறுதியுரைக்கும் இடையிலான எபிரெயக் கட்டமைப்பு அரைப்புள்ளியால் காக்கப்பட்டுள்ளது.
