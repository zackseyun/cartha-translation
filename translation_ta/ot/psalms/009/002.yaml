  text: אֶשְׂמְחָ֣ה וְ/אֶעֶלְצָ֣ה בָ֑/ךְ אֲזַמְּרָ֖ה שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/002.yaml
  text: I will rejoice and exult in you[a]; I will sing praise to your name[b], Most High.
translation:
  language: ta
  text: உம்மில் மகிழ்வேன், களிகூருவேன்; உமது பெயரைப் புகழ்ந்து பாடுவேன், உன்னதமானவரே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘உன்னதமானவர்’ என்பது எபிரெயத்தில் கடவுளுக்கான ஒரு பட்டம்.
    reason: cultural_note
lexical_decisions:
- source_word: אֶשְׂמְחָה
  choice: மகிழ்ந்து
  rationale: שׂמח என்பதன் மகிழ்ச்சி/மகிழ்தல் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; அடுத்துள்ள வினையுடன் இணைந்து முதல் நபரின் உறுதியான நோக்கையும் வெளிப்படுத்துகிறது.
- source_word: וְאֶעֶלְצָה
  choice: களிகூருவேன்
  rationale: עלץ குறிக்கும் பொங்கும், கொண்டாட்டமிக்க மகிழ்ச்சியைத் தனித்துவமாகக் காக்கிறது; முந்தைய ‘மகிழ்ந்து’ என்பதோடு பொருளை ஒன்றாக்கிவிடவில்லை.
- source_word: בָךְ
  choice: உம்மில்
  rationale: בְּ முன்னிடைச்சொல் இங்கு மகிழ்ச்சியின் மையம் அல்லது பொருளாகக் கடவுளைக் குறிக்கிறது. ‘உம்மில்’ என்பது நேரடியும் மரியாதைமிக்கதுமான தமிழ் வடிவம்.
- source_word: אֲזַמְּרָה
  choice: புகழ்ந்து பாடுவேன்
  rationale: பியேல் வடிவிலுள்ள זמר வழக்கமாக இசையோடு புகழ்ந்து பாடுதலைக் குறிக்கிறது; தமிழில் இயல்பாக அதன் துதிசார் வலிமையை வெளிப்படுத்துகிறது.
- source_word: שִׁמְךָ
  choice: உமது பெயரை
  rationale: எபிரெயச் சொல்லான ‘பெயர்’ என்பதைக் காத்து, பாடுதலின் நேரடிச் செயப்படுபொருளாக இயல்பான தமிழில் அமைக்கிறது; அது கடவுளின் வெளிப்பட்ட தன்மையையும் புகழையும் சுட்டலாம்.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவரே
  rationale: கடவுளுக்கான ‘மிக உயர்ந்தவர்’ என்ற பட்டத்தை, நேரடி அழைப்பாகவும் இயல்பான மரியாதைத் தமிழிலும் வழங்குகிறது.
theological_decisions:
- issue: עֶלְיוֹן என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: உன்னதமானவரே
  alternative: மிக உயர்ந்தவரே
  rationale: இங்கு இந்தச் சொல் கடவுளை நேரடியாக அழைக்கும் தெய்வீகப் பட்டமாகச் செயல்படுகிறது. ‘உன்னதமானவரே’ அந்தப் பட்டத்தையும் அழைப்புத் தன்மையையும் விரிவான விளக்கமின்றிக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதப் பாடலுக்கேற்ற கண்ணியமான, எளிதில் புரியும் நடை. கடவுளை நோக்கிய உரையில் ‘உம்/உமது’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது; இணையான இரண்டு மகிழ்ச்சி வினைகளின் தீவிர வேறுபாடு காக்கப்பட்டுள்ளது.
