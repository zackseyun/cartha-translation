  text: חָֽנְנֵ֬/נִי יְהוָ֗ה רְאֵ֣ה עָ֭נְיִ/י מִ/שֹּׂנְאָ֑/י מְ֝רוֹמְמִ֗/י מִ/שַּׁ֥עֲרֵי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction from those who hate me[b], you who lift me up from the gates of death.
translation:
  language: ta
  text: யாவே, எனக்கு அருள்கூரும்[a]; என்னைப் பகைக்கிறவர்களால் உண்டான என் துன்பத்தைப் பாரும்; மரணத்தின் வாசல்களிலிருந்து[b] என்னைத் தூக்கி எடுக்கிறவரே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்மேல் இரக்கம் காட்டும்.”
    reason: lexical_alternative
  - marker: b
    text: “மரணத்தின் வாசல்கள்” என்பது மரணத்தின் விளிம்பில் அல்லது அதன் அதிகாரத்தின்கீழ் இருப்பதைக் குறிக்கும் எபிரெய உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: חָנְנֵנִי
  choice: எனக்கு அருள்கூரும்
  rationale: חנן என்பதன் கட்டளை வடிவம் அருள் அல்லது தயவு காட்டுமாறு வேண்டுகிறது. “அருள்கூரும்” என்பது இறைவேண்டுதலுக்கு இயல்பான, கண்ணியமான தமிழாகவும், “இரக்கம் காட்டும்” என்பதைக் காட்டிலும் மூலச்சொல்லின் அருள் சார்ந்த பரப்பைத் திறந்தவாறும் வைத்திருக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான “யாவே” என்று வழங்குகிறது.
- source_word: רְאֵה
  choice: பாரும்
  rationale: ראה என்பதன் நேரடியான கட்டளையைப் பாதுகாக்கிறது; ஜெப மொழியில் “பாரும்” என்பது தெய்வீகக் கவனத்தைக் கோரும் இயல்பான ஒருமை மரியாதை வடிவம்.
- source_word: עָנְיִי
  choice: என் துன்பம்
  rationale: עֳנִי குறிக்கும் ஒடுக்கப்பட்ட நிலை, துயரம், வேதனை ஆகிய பரப்பை தேவையின்றி குறுக்காமல் “துன்பம்” இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִשֹּׂנְאַי
  choice: என்னைப் பகைக்கிறவர்களால் உண்டான
  rationale: மூலத்தில் உள்ள מִן, துன்பம் பகைவர்களிடமிருந்து வருவதைச் சுருக்கமாகக் காட்டுகிறது. தமிழில் அதன் தொடரியல் உறவைத் தெளிவாக்க “உண்டான” சேர்க்கப்பட்டுள்ளது; புதிய செயல் எதுவும் சேர்க்கப்படவில்லை.
- source_word: מְרוֹמְמִי
  choice: என்னைத் தூக்கி எடுக்கிறவரே
  rationale: רום என்பதன் Polel நிகழ்காலப் பெயரெச்ச வடிவமும் முதல் நபர் பின்னொட்டும், யாவேவைத் தன்னை மேலே தூக்குபவராக நேரடியாக அழைக்கின்றன. “உயர்த்துகிறவரே” என்ற மாற்று சாத்தியமாயினும், அது பதவி உயர்வு அல்லது மகிமைப்படுத்தலை உணர்த்தக்கூடும்; இங்கு மரண வாசல்களிலிருந்து மீட்கும் படிமத்தை “தூக்கி எடுக்கிறவரே” தெளிவாகத் தக்கவைக்கிறது.
- source_word: מִשַּׁעֲרֵי מָוֶת
  choice: மரணத்தின் வாசல்களிலிருந்து
  rationale: மூலத்தின் தெளிவான உருவகத்தை நேரடியாகப் பாதுகாக்கிறது. எபிரெய உரையில் שאול இல்லாததால் “பாதாளம்” சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனம் இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் தனிப்பெயரை ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: “என்னைப் பகைக்கிறவர்களிடமிருந்து” என்பதன் தொடரியல் தொடர்பு
  choice: அது “என் துன்பம்” என்பதுடன் இணைக்கப்பட்டு, பகைப்பவர்களால் உண்டான துன்பம் என வழங்கப்பட்டுள்ளது.
  alternative: “என் துன்பத்தைப் பாரும்; என்னைப் பகைக்கிறவர்களையும் பாரும்” என்று இரண்டு பொருட்களாகப் பிரித்தல்
  rationale: எபிரெயச் சொல் வரிசையிலும் பொருளிலும் מִשֹּׂנְאַי என்பது துன்பத்தின் மூலத்தைக் குறிப்பதாக வாசிப்பது இயல்பானது. மாற்று வாசிப்பு உரையில் இல்லாத இரண்டாம் “பாரும்” என்பதை மறைமுகமாகச் சேர்க்கும்.
- issue: “மரணத்தின் வாசல்கள்” என்ற உருவகம்
  choice: உருவகம் அப்படியே வைக்கப்பட்டுள்ளது.
  alternative: “மரணத்தின் விளிம்பு” அல்லது “மரணத்தின் பிடி” என்று விளக்கிப் பெயர்த்தல்
  rationale: இந்த உருவகம் மரணத்தின் எல்லையையும் ஆட்சிப் பரப்பையும் சுட்டலாம். முதன்மை உரையில் அதை விளக்கமாக மாற்றாமல் வைப்பது கவித்துவப் படிமத்தையும் அதன் பொருள் விரிவையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத ஜெபத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை மரியாதை வேண்டுதல் வடிவங்களான “அருள்கூரும்,” “பாரும்” பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரண்டு கட்டளைகளும் இறுதி அழைப்பும் அரைப்புள்ளிகளால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன; கவித்துவ உருவகம் பாதுகாக்கப்பட்டுள்ளது.
