  yaml_path: translation/ot/psalms/009/001.yaml
  text: I will give thanks to Yahweh with all my heart[a]; I will recount all your wondrous deeds.
translation:
  language: ta
  text: 'என் முழு இதயத்தோடும் யாவேவுக்கு நன்றி செலுத்துவேன்;

    உமது வியத்தகு செயல்கள் அனைத்தையும் எடுத்துரைப்பேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “உமது அதிசயங்கள்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: நன்றி செலுத்துவேன்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் வழிபாட்டுச் சூழலில் நன்றி செலுத்துதல் அல்லது புகழ்தலைக் குறிக்கிறது. இங்கு யாவே நேரடியாக நோக்கப்படுவதால், நன்றியுணர்வைத் தெளிவாக வெளிப்படுத்தும் இயல்பான தமிழ்ச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் உள்ள தேவனுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּכָל לִבִּי
  choice: என் முழு இதயத்தோடும்
  rationale: முழுமையான உள்ளார்ந்த ஈடுபாட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளையும் כָל என்பதன் முழுமையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: אֲסַפְּרָה
  choice: எடுத்துரைப்பேன்
  rationale: ספר இங்கு தேவனுடைய செயல்களை விவரித்துச் சொல்லுதல் அல்லது அறிவித்தல் என்ற பொருளைக் கொண்டுள்ளது. ‘எடுத்துரைப்பேன்’ என்பது சாட்சியமாக விரிவாகச் சொல்வதன் நயத்தைத் தருகிறது.
- source_word: כָּל
  choice: அனைத்தையும்
  rationale: தேவனுடைய வியத்தகு செயல்களின் முழுத் தொகுப்பையும் குறிக்கும் மூலமொழியின் விரிவை வெளிப்படையாகக் காக்கிறது.
- source_word: נִפְלְאוֹתֶיךָ
  choice: உமது வியத்தகு செயல்கள்
  rationale: פלא வேரிலிருந்து வரும் இச்சொல் வியப்பை உண்டாக்கும் அசாதாரண செயல்களை, குறிப்பாக தேவனுடைய வல்லமையான தலையீடுகளை, குறிக்கலாம். ‘வியத்தகு செயல்கள்’ என்பது வியப்பையும் செயல் சார்ந்த நயத்தையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்துகளாலான தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: נִפְלְאוֹתֶיךָ என்பதன் செயல் சார்ந்த அல்லது பொதுவான பொருள்
  choice: உமது வியத்தகு செயல்கள்
  alternative: உமது அதிசயங்கள்
  rationale: எபிரெயச் சொல் ‘அதிசயங்கள்’ என்றும் ‘வியத்தகு செயல்கள்’ என்றும் பொருள்படலாம். பிரதான உரையில் செயல் சார்ந்த நயத்தை வெளிப்படுத்தி, மற்ற உண்மையான சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது; இரு இணை அடிகளின் அமைப்பும் ‘முழு/அனைத்து’ என்ற முழுமை நயமும் காக்கப்பட்டுள்ளன.
