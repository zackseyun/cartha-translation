  text: You rebuked nations[a]; you destroyed the wicked[b]; you blotted out their name forever and ever.
translation:
  language: ta
  text: நீர் தேசங்களைக் கண்டித்தீர்; பொல்லாதவர்களை அழித்தீர்; அவர்களுடைய பெயரை என்றென்றைக்கும் துடைத்தழித்தீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּעַרְתָּ
  choice: கண்டித்தீர்
  rationale: גער என்பது அதிகாரத்துடனும் செயல்திறனுடனும் கூடிய கடுமையான கண்டிப்பைக் குறிக்கிறது; ‘கண்டித்தீர்’ என்பது தேவையற்ற விளக்கத்தைச் சேர்க்காமல் அந்த நேரடி செயலை இயல்பான தமிழில் தருகிறது.
- source_word: גּוֹיִם
  choice: தேசங்கள்
  rationale: சங்கீதத்தின் நியாயத்தீர்ப்புச் சூழலில் גוים என்பது கூட்டான மக்கள் சமுதாயங்களாகிய தேசங்களைக் குறிக்கிறது; ‘புறஜாதிகள்’ என்பது இவ்வசனத்தில் வெளிப்படையாக இல்லாத பிற்கால வேறுபாட்டை உட்புகுத்தக்கூடும்.
- source_word: אִבַּדְתָּ
  choice: அழித்தீர்
  rationale: אבד என்பதன் பியேல் வடிவம் அழியச் செய்தல் அல்லது அழித்தல் என்ற வலுவான பொருளைத் தருகிறது; ‘அழித்தீர்’ நியாயத்தீர்ப்புச் சூழலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: רָשָׁע
  choice: பொல்லாதவர்களை
  rationale: எபிரெயத்தில் ஒருமையாக இருந்தாலும், רשע ஒரு வகுப்பை அல்லது கூட்டத்தைப் பொதுவாகக் குறிக்கலாம். அதற்கு இணையாக வரும் ‘தேசங்கள்’ என்பதும் பின்னுள்ள பன்மை உருபும் இங்கு கூட்டுப் பொருளை ஆதரிக்கின்றன.
- source_word: שְׁמָם
  choice: அவர்களுடைய பெயரை
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘அவர்களுடைய பெயர்’; அது நினைவு அல்லது புகழையும் குறிக்கக்கூடும் என்றாலும், மூல உருவகத்தை முதன்மை உரை பாதுகாக்கிறது.
- source_word: מָחִיתָ
  choice: துடைத்தழித்தீர்
  rationale: מחה என்பது துடைத்து நீக்குதல் அல்லது முற்றிலும் அழித்தல் என்ற தெளிவான உருவகத்தைக் கொண்டது; பெயரை நினைவிலிருந்தோ பதிவிலிருந்தோ அகற்றும் வலிமையை ‘துடைத்தழித்தீர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְעוֹלָם וָעֶד
  choice: என்றென்றைக்கும்
  rationale: இணைந்த இச்சொற்றொடர் காலத்தின் முடிவின்மையை வலியுறுத்துகிறது; ‘என்றென்றைக்கும்’ அதன் தீவிரத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: רָשָׁע என்பதன் கூட்டுப் பொருளா தனிநபர் பொருளா
  choice: 'கூட்டு/பொதுப் பொருள்: ‘பொல்லாதவர்கள்’'
  alternative: 'தனிநபர் பொருள்: ‘பொல்லாதவன்’'
  rationale: ஒருமை வடிவம் ஒரு வகுப்பின் பிரதிநிதியாக இருக்கலாம். ‘தேசங்கள்’ என்ற இணைச்சொல்லும் ‘அவர்களுடைய பெயர்’ என்ற பன்மைச் சுட்டும் கூட்டுப் பொருளுக்கு ஏற்றவை; எனினும் தனிநபர் வாசிப்பும் இலக்கண ரீதியாகச் சாத்தியம்.
translation_notes:
  register: நவீன தரத் தமிழ்; இறைவனை நோக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. கவிதையின் சுருக்கமும் நியாயத்தீர்ப்பின் வலிமையும் காக்கப்பட்டுள்ளன. இவ்வசனத்திற்கு அளிக்கப்பட்ட ஆங்கில அடிக்குறிப்புகள் மூலச் சொற்களுடன் இடமாற்றமாகத் தோன்றுவதால், அவற்றை அப்படியே பின்பற்றாமல் எபிரெய மூலத்தின் அடிப்படையில் உரை அமைக்கப்பட்டது; வெளியீட்டு முதன்மை உரையில் அடிக்குறிப்புகள் சேர்க்கப்படவில்லை.
