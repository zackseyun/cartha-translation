  source_fidelity: 'மூல எபிரெயத்தின் மூன்று இணை வினைச்சொற்களும் துல்லியமாகத் தரப்பட்டுள்ளன: גָּעַרְתָּ—«கண்டித்தீர்», אִבַּדְתָּ—«அழித்தீர்», מָחִיתָ—«துடைத்தழித்தீர்». גּוֹיִם என்பதற்கான «தேசங்கள்» பொருத்தமானது. ஒருமை רָשָׁע-ஐ வகுப்புப் பொருளில் «பொல்லாதவர்கள்» எனத் தருவதும், பின்னுள்ள பன்மைச் சுட்டான «அவர்களுடைய பெயர்» உடன் நன்றாக ஒத்துவருகிறது. «என்றென்றைக்கும்» לְעוֹלָם וָעֶד என்பதன் வலியுறுத்தப்பட்ட காலநிலையைச் சரிவரக் காக்கிறது.'
  naturalness: நவீன தரத் தமிழில் உரை சுருக்கமாகவும் கவிதைநடைக்கேற்றதாகவும் உள்ளது. இறைவனை நோக்கிய மரியாதைப் பன்மை இயல்பானது. «துடைத்தழித்தீர்» என்பது பெயரை/நினைவை அகற்றும் מחה உருவகத்தின் வலிமையை நன்றாக வெளிப்படுத்துகிறது.
  terminology: «தேசங்கள்», «பொல்லாதவர்கள்», «பெயர்», «அழித்தீர்» ஆகியவை நிலையான, சமயப் பாகுபாடுகளைச் சேர்க்காத சொற்கள். «புறஜாதிகள்» போன்ற பிற்காலச் சொல்லைத் தவிர்த்தது சரியானது.
