translation:
  language: ta
  text: யாவே ஒடுக்கப்பட்டவர்களுக்கு உயர்ந்த அடைக்கலமாக இருப்பார்[a], நெருக்கடியான காலங்களில் உயர்ந்த அடைக்கலமாக இருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயர்ந்த அடைக்கலம்’ என்பதற்கு ‘பாதுகாப்பான கோட்டை’ அல்லது ‘அடைக்கலம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் பாதுகாப்பளிக்கும் எட்ட முடியாத உயரமான இடத்தைக் குறிக்கிறது.
