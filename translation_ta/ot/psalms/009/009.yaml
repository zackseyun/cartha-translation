lexical_decisions:
- source_word: וִיהִי
  choice: இருப்பார்
  rationale: இங்கு வடிவம் வேண்டுதலாகப் புரிந்துகொள்ளப்படக்கூடிய சாத்தியம் இருந்தாலும், சங்கீதத்தின் உடனடிச் சூழலில் இது யெகோவாவைப் பற்றிய நம்பிக்கையான அறிவிப்பாக இயல்பாக அமைகிறது; ஆகவே எதிர்கால அறிவிப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய வேதாகமத்தில் வரும் இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நன்கு அறியப்பட்ட ஒலிபெயர்ப்பு வடிவமான ‘யெகோவா’ என்று வழங்குகிறது.
- source_word: מִשְׂגָּב
  choice: உயர்ந்த அடைக்கலம்
  rationale: பாதுகாப்பளிக்கும் எட்டமுடியாத உயரமான இடம் என்ற சொல்லின் இரு கூறுகளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; கவிதை வலியுறுத்தலுக்காக மறுபடியும் வரும் சொல்லும் அப்படியே வைக்கப்பட்டது.
- source_word: לַדָּךְ
  choice: ஒடுக்கப்பட்டவர்களுக்கு
  rationale: דך என்பது நசுக்கப்பட்ட, தாழ்த்தப்பட்ட அல்லது ஒடுக்கப்பட்ட நிலையிலுள்ளவரைக் குறிக்கிறது; ‘ஒடுக்கப்பட்டவர்கள்’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לְעִתּוֹת
  choice: காலங்களில்
  rationale: பன்மைச் சொல்லுடன் சேர்ந்த ל இங்கு காலத்தைக் குறிக்கிறது; மீண்டும் மீண்டும் நேரக்கூடிய சந்தர்ப்பங்களையும் தமிழ் பன்மை இயல்பாகக் காட்டுகிறது.
- source_word: בַּצָּרָה
  choice: நெருக்கடியான
  rationale: צָרָה குறிக்கும் துன்பம், இடுக்கண், நெருக்கடி ஆகிய அர்த்தங்களில், ‘நெருக்கடியான காலங்களில்’ என்பது தெளிவான நவீனத் தமிழ்ச் சொற்றொடராகும்.
theological_decisions:
- issue: וִיהִי என்பதன் வினைநிலை
  choice: 'நம்பிக்கையான எதிர்கால அறிவிப்பு: ‘இருப்பார்’'
  alternative: 'வேண்டுதல்: ‘இருப்பாராக’'
  rationale: எபிரெய வடிவம் சில சூழல்களில் வேண்டுதலைக் குறிக்கலாம். எனினும் இவ்வசனத்தின் சூழலும் இணையான அறிவிப்புத் தன்மையும் எதிர்கால உறுதியுரையை ஆதரிக்கின்றன; மாற்று சாத்தியம் மறுக்கப்படவில்லை.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால் ‘கர்த்தர்’ போன்ற பட்டத்தால் மாற்றப்படவில்லை. ‘யெகோவா’ என்பது தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு; ‘யாவே’ என்பது சாத்தியமான மாற்று ஒலிபெயர்ப்பு.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. எபிரெய மூலத்தின் மறுபடிச் சொல் அமைப்பு பாதுகாக்கப்பட்டது.
