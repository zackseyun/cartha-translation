  text: The wicked will return to Sheol—all the nations that forget God[a][b].
translation:
  language: ta
  text: தீயவர்களும், தேவனை மறக்கும் எல்லா தேசங்களும், ஷியோலுக்குத்[b] திரும்புவார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘திரும்பிப் போவார்கள்.’ எபிரேய வினைச்சொல் ‘திரும்புதல்’ அல்லது ‘திரும்பிப் போதல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘ஷியோல்’ என்பது இறந்தோரின் உலகத்தைக் குறிக்கும் எபிரேயச் சொல்; பிற்காலத்தில் மேலும் குறிப்பான பொருளைப் பெற்ற ‘நரகம்’ என்ற கருத்துடன் இது முற்றிலும் ஒன்றானதல்ல.
    reason: cultural_note
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: திரும்புவார்கள்
  rationale: שוב என்பதன் Qal முற்றுப்பெறாத வடிவம் ‘திரும்புதல்’ அல்லது ‘திரும்பிச் செல்லுதல்’ என்று பொருள்படும். ‘திரும்புவார்கள்’ என்பது ஷியோலை நோக்கிய இயக்கத்தைப் பேணுவதோடு, அதை வெறும் உருவக அழிவாக விளக்கிவிடுவதையும் தவிர்க்கிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: ஒழுக்கரீதியாகத் தீயவர்களைக் குறிக்கும் பன்மை பெயரடை இங்கு பெயர்ச்சொல்லாகப் பயன்படுகிறது. ‘தீயவர்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לִשְׁאוֹלָה
  choice: ஷியோலுக்கு
  rationale: שְׁאוֹל என்பது எபிரேய வேதாகமத்தில் இறந்தோரின் உலகத்தைக் குறிக்கும் சொல். ‘கல்லறை’ என்பது மிகக் குறுகிய பொருளையும், ‘நரகம்’ என்பது பிற்காலத்தில் குறிப்பாக வளர்ந்த இறையியல் பொருளையும் தரக்கூடும்; ஆகவே ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּל גּוֹיִם
  choice: எல்லா தேசத்தாரும்
  rationale: גּוֹיִם என்பது தேசங்கள் அல்லது மக்களினங்களைக் குறிக்கிறது. இங்கு மக்களையே வாக்கியத்தின் இணை எழுவாயாகச் சுட்டுவதால் ‘எல்லா தேசத்தாரும்’ என்பது தமிழில் இயல்பாக உள்ளது; உரையில் வெளிப்படையாக இல்லாத யூதர்–புறவினர் வேறுபாட்டை இது புகுத்துவதில்லை.
- source_word: שְׁכֵחֵי אֱלֹהִים
  choice: தேவனை மறக்கும்
  rationale: இது ‘தேவனை மறப்பவர்கள்’ என்ற பண்பைக் குறிக்கும் construct participle தொடர். ‘தேவனை மறக்கும்’ என்பது அதன் தொடர்ச்சியான அல்லது பண்பியலான நுணுக்கத்தை இயல்பான தமிழில் பேணுகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்புச் சூழலில் שְׁאוֹל என்பதன் பொருள்
  choice: ‘நரகம்’ என்று விளக்காமல் ‘ஷியோல்’ என்று ஒலிபெயர்த்தல்
  alternative: கல்லறை; இறந்தோரின் உலகம்; நரகம்
  rationale: இந்த வசனம் தீயவர்களின் முடிவைப் பற்றிப் பேசினாலும், எபிரேயச் சொல் தானாகவே பிற்காலத்தில் உருவான நித்திய நரகம் என்ற குறிப்பான கோட்பாட்டுப் பொருளைக் கட்டாயப்படுத்தவில்லை. ஒலிபெயர்ப்பு மூலத்தின் பொருள் எல்லையையும் இறையியல் பதற்றத்தையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரேய வாக்கியத்தின் இரண்டாம் பகுதி முதல் பகுதியின் எழுவாயை விரிவுபடுத்தும் அமைப்பாக இருப்பதால், தமிழிலும் நீண்ட கோடு மூலம் அந்த இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது. ‘ஷியோல்’ என்ற அறிமுகமற்ற சொல்லின் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
