  text: וְ/יִבְטְח֣וּ בְ֭/ךָ יוֹדְעֵ֣י שְׁמֶ֑/ךָ כִּ֤י לֹֽא עָזַ֖בְתָּ דֹרְשֶׁ֣י/ךָ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And those who know your name will trust in you[a], for you, O Yahweh[c][b], have not forsaken those who seek you.
translation:
  language: ta
  text: உமது பெயரை[a] அறிந்தவர்கள் உம்மை நம்புவார்கள்; ஏனெனில், யாவே[c], உம்மைத் தேடுகிறவர்களை நீர் கைவிடவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது பெயரை அறிந்தவர்கள்’—இங்கு ‘பெயர்’ என்பது பெயரின் ஒலியை மட்டும் அல்ல, யாவே வெளிப்படுத்தியுள்ள உமது இயல்பையும் நற்பெயரையும் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: 'அல்லது: ‘விட்டுவிடவில்லை.’'
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் YHWH; பாரம்பரியமாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִבְטְחוּ בְךָ
  choice: உம்மை நம்புவார்கள்
  rationale: בטח என்பதன் Qal முற்றுப்பெறா வடிவம் இச்சூழலில் எதிர்கால நிச்சயத்தை வெளிப்படுத்துகிறது. בְּךָ நம்பிக்கையின் இலக்கைக் குறிக்கிறது; தமிழில் இயல்பாகவும் நேரடியாகவும் ‘உம்மை நம்புவார்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: יֹדְעֵי שְׁמֶךָ
  choice: உமது பெயரை அறிந்தவர்கள்
  rationale: பங்கேற்பு வடிவம், தேவனுடைய பெயரை அறிதல் என்ற பண்பால் அடையாளப்படுத்தப்படும் மக்களைக் குறிக்கிறது. ‘பெயர்’ என்பது வெறும் ஒலிப்பெயரைத் தாண்டிய பொருள் கொண்டிருந்தாலும், எபிரெயச் சொல்லாட்சியின் உடன்படிக்கை சார்ந்த ஆழத்தைப் பாதுகாக்க நேரடி வடிவம் வைக்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னர் கூறப்பட்ட நம்பிக்கைக்கான காரணத்தை அறிமுகப்படுத்துவதால், காரண இணைப்பான ‘ஏனெனில்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא עָזַבְתָּ
  choice: நீர் கைவிடவில்லை
  rationale: עזב என்பது விட்டுவிடுதல், கைவிடுதல், புறக்கணித்தல் ஆகிய பொருள்களைத் தருகிறது. சங்கீதச் சூழலின் உறவுசார் வலிமையை இயல்பான நவீன தமிழில் ‘கைவிடவில்லை’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: דֹּרְשֶׁיךָ
  choice: உம்மைத் தேடுகிறவர்கள்
  rationale: தேவனைப் பொருளாகக் கொள்ளும்போது דרש என்பது பக்தியுடனும் விண்ணப்பத்துடனும் அவரை நாடுவதைக் குறிக்கிறது. ‘தேடுகிறவர்கள்’ மூலத்தின் பரந்த பொருளைத் திறந்தவாறே வைத்திருக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட தேவப்பெயர் ஒரு பட்டமாக மாற்றப்படாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தேவப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட தேவப்பெயரான YHWH நேரடியாக உள்ளது. ஆகவே பாரம்பரிய மாற்றுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாக தேவப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: ‘உமது பெயரை அறிதல்’ என்பதன் பொருள்
  choice: மூல உருவகத்தை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: உமது வெளிப்படுத்தப்பட்ட இயல்பை அறிந்தவர்கள்
  rationale: שֵׁם என்பது இங்கு தேவனுடைய வெளிப்படுத்தப்பட்ட இயல்பையும் நற்பெயரையும் உள்ளடக்குகிறது. ஆனால் அதனை முதன்மை உரையிலேயே விளக்கிவிடுவது எபிரெயச் சொல்லாட்சியின் செறிவைக் குறைக்கும்; எனவே விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான உரைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘உம்மை’, ‘நீர்’ தொடர்ந்து கையாளப்பட்டுள்ளன. மூலத்தின் காரணத் தொடர்பும், ‘பெயர்’, ‘தேடுதல்’, ‘கைவிடுதல்’ ஆகிய முக்கிய உருவகங்களும் பாதுகாக்கப்பட்டுள்ளன.
