  text: כִּֽי עָ֭שִׂיתָ מִשְׁפָּטִ֣/י וְ/דִינִ֑/י יָשַׁ֥בְתָּ לְ֝/כִסֵּ֗א שׁוֹפֵ֥ט צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/004.yaml
  text: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
translation:
  language: ta
  text: ஏனெனில், என் உரிமைக்கும் என் வழக்குக்கும் நீர் நீதி வழங்கினீர்[a]; நீதியுடன்[b] தீர்ப்பளிப்பவராய் அரியணையில் அமர்ந்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் தீர்ப்பையும் என் வழக்கையும்’ அல்லது ‘என் நியாயத்தையும் என் வழக்கையும்.’ எபிரெய மொழியில், நியாயம் நிலைநாட்டப்படுவதைக் குறிக்கும் இணையான இரு சட்டவியல் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: ‘நீதியுடன்’ என்பதற்கு ‘நியாயமாக’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் ‘நீதி’ என்ற பெயர்ச்சொல் இங்கு வினையடைப் பொருளில், அதாவது ‘நீதியோடு தீர்ப்பளித்தல்’ என்ற விதத்தில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய துதியின் காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக உள்ளது; சங்கீதத்தின் காரணத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: עָשִׂיתָ
  choice: நீதி வழங்கினீர்
  rationale: நேரடியாக ‘செய்தீர்’ என்றாலும், சட்டவியல் பெயர்ச்சொற்களுடன் வரும்போது ஒருவரின் உரிமையையும் வழக்கையும் நியாயமாகத் தீர்த்து நிலைநாட்டுவதைச் சுட்டுகிறது.
- source_word: מִשְׁפָּטִי
  choice: என் உரிமை
  rationale: இச்சூழலில் சங்கீதக்காரருக்குரிய நியாயமான உரிமை அல்லது தீர்ப்பைக் குறிக்கிறது; இணையாக வரும் சட்டவியல் சொல்லிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: וְדִינִי
  choice: என் வழக்கு
  rationale: நீதிமன்றத்தில் முன்வைக்கப்படும் விவகாரம் அல்லது வழக்கைக் குறிக்கும் சட்டவியல் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יָשַׁבְתָּ
  choice: அமர்ந்தீர்
  rationale: தீர்ப்பளிப்பதற்காக அரியணையில் வீற்றிருக்கும் காட்சியைச் சுருக்கமாகவும் மரியாதையாகவும் தருகிறது.
- source_word: לְכִסֵּא
  choice: அரியணையில்
  rationale: அரசாட்சியையும் நீதித்தீர்ப்பையும் ஒருங்கிணைக்கும் தெய்வீக அரியணைக் காட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שׁוֹפֵט
  choice: தீர்ப்பளிக்கும் நியாயாதிபதியாக
  rationale: எபிரெயப் பங்கேற்பு வடிவின் தொடர்ச்சியான நீதிபதி பங்கை வெளிப்படையாகக் காக்கிறது.
- source_word: צֶדֶק
  choice: நீதியுடன்
  rationale: ‘நீதி’ என்ற பெயர்ச்சொல் இங்கு வினையடைப் பொருளில் செயல்படுவதை இயல்பான தமிழில் காட்டுகிறது; ‘நியாயமாக’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: தேவனின் நீதித்துறை சார்ந்த உருவகம்
  choice: அரியணையில் அமர்ந்த நியாயாதிபதியாக தேவன் சங்கீதக்காரரின் உரிமைக்கும் வழக்குக்கும் நீதி வழங்குகிறார்.
  alternative: தேவன் பொதுவாகச் சங்கீதக்காரரின் சார்பில் செயல்பட்டார் என்ற வாசிப்பு.
  rationale: מִשְׁפָּט மற்றும் דִּין ஆகிய சட்டவியல் சொற்களோடு அரியணை மற்றும் தீர்ப்பளித்தல் பற்றிய மொழியும் இணைவதால் நீதித்துறை உருவகம் வெளிப்படையாகத் தக்கவைக்கப்படுகிறது; பிற்கால கோட்பாட்டுக் கருத்துகள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமை வடிவங்களுடன், கண்ணியமான சங்கீத நடையும் தெளிவான சட்டவியல் உருவகமும் பேணப்பட்டுள்ளன. ‘உரிமை—வழக்கு’ என்ற சொல் இணை, மூலத்தின் தொடர்புடைய ஆனால் வேறுபட்ட சட்டவியல் சொற்களை இயன்றவரைத் தக்கவைக்கிறது.
