  text: Put fear in them, O LORD; let the nations know that they are only man. Selah
translation:
  language: ta
  text: ஆண்டவரே, அவர்களுக்குப் பயத்தை உண்டாக்கும்; தேசங்கள் தாம் மனிதர்களே என்பதை அறியட்டும். சேலா.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה ... מוֹרָה לָהֶם
  choice: அவர்களுக்குள் பயத்தை ஏற்படுத்தும்
  rationale: שִׁיתָה என்பது ‘வை/ஏற்படுத்து’ என்ற வேண்டுகோள் வடிவம்; מוֹרָה இங்கு ‘பயம், திகில்’ எனப் பொருள்படுகிறது. לָהֶם என்பதன் இலக்கு உணர்வை இயல்பான தமிழில் ‘அவர்களுக்குள்’ என வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: ஆண்டவரே
  rationale: தேவநாமத்தைக் குறிக்கும் மரியாதைமிக்க, பொதுவாகப் புரியும் தமிழ் வடிவம்; அழைப்புவேற்றுமையை ‘-ஏ’ காட்டுகிறது.
- source_word: גוֹיִם
  choice: தேசங்கள்
  rationale: இங்கு தனிநபர்களை அல்ல, இஸ்ரவேலுக்கு வெளியேயுள்ள மக்களினங்களைக் கூட்டாகக் குறிக்கிறது.
- source_word: אֱנוֹשׁ הֵמָּה
  choice: தாங்கள் மனிதர்களே
  rationale: אֱנוֹשׁ மனிதரின் பலவீனமான, இறப்புக்குட்பட்ட இயல்பை உணர்த்தலாம்; ஆனால் வசனம் நேரடியாகக் கூறும் ‘அவர்கள் மனிதரே’ என்ற வலியுறுத்தலை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: סֶּלָה
  choice: சேலா
  rationale: பொருள் உறுதியாகத் தெரியாத சங்கீதக் குறியீட்டை விளக்கிப் பொருள்கூறாமல் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: தேசங்கள் தங்கள் வரம்புள்ள மனித இயல்பை உணருதல்
  choice: ‘தாங்கள் மனிதர்களே’ என்று திறந்த வலியுறுத்தலாக மொழிபெயர்க்கப்பட்டது
  alternative: ‘தாங்கள் வெறும் மனிதர்கள்’ அல்லது ‘சாவுக்குட்பட்டவர்கள்’
  rationale: ‘வெறும்’ என்பது மூலத்தில் தனிச் சொல்லாக இல்லை; ‘சாவுக்குட்பட்டவர்கள்’ என்பது אֱנוֹשׁ சொல்லின் நிழற்பொருளை வெளிப்படையான விளக்கமாக மாற்றிவிடும். ‘மனிதர்களே’ என்பது எபிரெய வாக்கியத்தின் வலியுறுத்தலையும் அதன் உட்கருத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேண்டுதல்/ஜெபத்திற்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. சுருக்கமான எபிரெய இணைநிலைக் கட்டமைப்பும் ‘சேலா’ என்ற நிறைவும் பாதுகாக்கப்பட்டுள்ளன.
