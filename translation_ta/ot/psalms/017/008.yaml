base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/008.yaml
  text: Keep me like the pupil of the eye[a]; hide me in the shadow of your wings.
translation:
  language: ta
  text: 'என்னைக் கண்ணின் கருவிழியைப்போல்[a] காத்தருளும்;

    உமது சிறகுகளின் நிழலில் என்னை மறைத்தருளும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கண்மணியைப்போல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: என்னைக் காத்தருளும்
  rationale: שׁמר என்பதன் காத்தல், பாதுகாத்தல் என்ற வேண்டுதல் பொருளை இயல்பான, கண்ணியமான தமிழில் நேரடியாகத் தருகிறது.
- source_word: כְּאִישׁוֹן בַּת עָיִן
  choice: கண்ணின் கருவிழியைப்போல்
  rationale: இந்த எபிரேய மரபுத்தொடர் கண்ணின் நடுவிலுள்ள கருவிழியைக் குறிக்கிறது. மிகவும் கவனமாகப் பாதுகாக்கப்படுவதை உணர்த்தும் உருவகத்தையும் நவீன வாசகருக்குத் தெளிவாக வைத்திருக்கிறது.
- source_word: בְּצֵל
  choice: நிழலில்
  rationale: צֵל என்பதன் நிழல் அல்லது நிழற்காப்பு என்ற நேரடிப் பொருளைத் தக்கவைத்து, சிறகுகளால் கிடைக்கும் பாதுகாப்பு என்ற கவித்துவ உருவகத்துடன் இயல்பாக இணைகிறது.
- source_word: כְּנָפֶיךָ
  choice: உமது சிறகுகளின்
  rationale: כָּנָף என்பதன் 'சிறகு' என்ற உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே காக்கிறது.
- source_word: תַּסְתִּירֵנִי
  choice: என்னை மறைத்தருளும்
  rationale: סתר என்பதன் மறைத்தல் என்ற செயலை நேரடியாகத் தருகிறது; 'அடைக்கலம் தரும்' எனப் பொருள்விரித்து உருவகத்தை மாற்றவில்லை.
theological_decisions:
- issue: கண்ணைப் பற்றிய பாதுகாப்பு மரபுத்தொடரை மொழிபெயர்த்தல்
  choice: கண்ணின் கருவிழியைப்போல்
  alternative: கண்மணியைப்போல்
  rationale: மூலமொழியின் உடல் சார்ந்த தெளிவான படிமத்தை முதன்மை உரையில் வைத்திருக்கிறது. தமிழின் மரபான 'கண்மணி' என்ற சுருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது; அது அன்புக்குரியவர் என்ற கூடுதல் பொருளையும் பெறக்கூடும்.
- issue: தெய்வீகப் பாதுகாப்பைக் குறிக்கும் சிறகு உருவகம்
  choice: '''உமது சிறகுகள்'' என்ற உருவகத்தை அப்படியே வைத்தல்'
  alternative: '''உமது பாதுகாப்பு'' என்று பொருளை விளக்குதல்'
  rationale: எபிரேயக் கவிதையின் உருவகத்தையும் அதன் இறையியல் நிறைவையும் பாதுகாக்கிறது; உரையில் இல்லாத விளக்கத்தைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. 'காத்தருளும்', 'மறைத்தருளும்' என்பவை வேண்டுதலின் மரியாதைத் தொனியை இயல்பாக வெளிப்படுத்துகின்றன; மூலத்தின் இணையான இரு வேண்டுதல்களும் காக்கப்பட்டுள்ளன.
