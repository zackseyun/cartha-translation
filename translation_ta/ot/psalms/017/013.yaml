source:
  edition: WLC
  text: קוּמָ֤/ה יְהוָ֗ה קַדְּמָ֣/ה פָ֭נָי/ו הַכְרִיעֵ֑/הוּ פַּלְּטָ֥/ה נַ֝פְשִׁ֗/י מֵ/רָשָׁ֥ע חַרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/013.yaml
  text: Rise up[a], O Yahweh; confront him, bring him low[b]; deliver my life from the wicked by your sword.
translation:
  language: ta
  text: யாவே, எழுந்தருளும்; அவனை எதிர்கொண்டு, அவனை வீழ்த்தும்; பொல்லாதவனிடமிருந்து என் உயிரை[b] உமது வாளால்[a] காப்பாற்றும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது வாளாகிய பொல்லாதவனிடமிருந்து என் உயிரைக் காப்பாற்றும்.” பொல்லாதவன் யாவேயின் கையிலுள்ள ஒரு கருவியாகச் சித்தரிக்கப்படவும் எபிரெயச் சொற்றொடர் இடமளிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் நெஃபெஷ்; இது பெரும்பாலும் “ஆத்துமா” என்றும் மொழிபெயர்க்கப்படுகிறது. ஆனால் உயிருக்கு ஆபத்து நேர்ந்துள்ள இச்சூழலில் “உயிர்” அல்லது “என்னையே” என்று பொருள்பட வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: எழுந்தருளும்
  rationale: யாவேயை நோக்கிய அவசரமான கட்டளை வேண்டுதலை, நவீனத் தமிழில் இயல்பானதும் மரியாதைமிக்கதுமான இறைவேண்டுதல் நடையில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: קַדְּמָה פָנָיו
  choice: அவனை எதிர்கொண்டு
  rationale: சொல்லுக்குச் சொல் பார்த்தால் ‘அவனுடைய முகத்துக்கு முன் செல்’ என்ற பொருள்; பகைமைச் சூழலில் நேரடியாகச் சந்தித்து எதிர்ப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַכְרִיעֵהוּ
  choice: அவனை வீழ்த்தும்
  rationale: ஒருவனை மண்டியிடச் செய்வது அல்லது தாழ்த்துவது என்ற causative வினையின் போர்ச் சூழல் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: פַּלְּטָה
  choice: காப்பாற்றும்
  rationale: உயிருக்கு ஆபத்தான நிலையிலிருந்து விடுவிக்க அல்லது மீட்க வேண்டிய விண்ணப்பத்தை இயல்பான சங்கீத நடையில் தருகிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: נפש என்பது ஆத்துமா, உயிர், தன்னையே போன்ற பொருள்களைக் கொள்ளலாம்; இங்கு மரண ஆபத்திலிருந்து பாதுகாப்பதே சூழல் என்பதால் ‘உயிரை’ பொருத்தமானது.
- source_word: מֵרָשָׁע
  choice: பொல்லாதவனிடமிருந்து
  rationale: எபிரெய ஒருமையையும் முன்வரும் ஒருமை ஆண்பால் சுட்டுப்பெயர்களுடனான தொடர்பையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: חַרְבֶּךָ
  choice: உமது வாளால்
  rationale: முதன்மை வாசிப்பில் யாவே தமது வாளை மீட்புக்கான கருவியாகப் பயன்படுத்துகிறார்; ‘-ஆல்’ வேற்றுமை இதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘உமது வாள்’ என்பதற்கும் ‘பொல்லாதவன்’ என்பதற்கும் இடையிலான தொடர்பு
  choice: யாவே தமது வாளால் சங்கீதக்காரரைக் காப்பாற்றுகிறார் என்ற கருவிப்பொருள் வாசிப்பு
  alternative: பொல்லாதவனே யாவேயின் வாள் அல்லது நியாயத்தீர்ப்புக் கருவி என்ற ஒட்டுநிலை வாசிப்பு
  rationale: מֵרָשָׁע חַרְבֶּךָ என்ற சுருக்கமான எபிரெய அமைப்பு இரு வாசிப்புகளுக்கும் இடமளிக்கிறது. தெய்வீகத் தலையீட்டுக்கான தொடர் வேண்டுகோள்கள் கருவிப்பொருள் வாசிப்பை முதன்மை உரைக்கு ஆதரிக்கின்றன; எனினும் தெய்வீகச் செயலாண்மை குறித்த உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய மரியாதைமிக்க சங்கீத வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய வினைகள் ‘எழுந்தருளும்’, ‘வீழ்த்தும்’, ‘காப்பாற்றும்’ என்ற மரியாதை ஏவல் வடிவங்களில் அமைந்துள்ளன; தேவையற்ற பழமொழிநடை தவிர்க்கப்பட்டுள்ளது.
