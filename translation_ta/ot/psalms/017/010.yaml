  text: They close up their fat hearts[a]; with their mouths they speak arrogantly.
translation:
  language: ta
  text: அவர்கள் தங்கள் கொழுப்பு படிந்த இதயங்களை மூடினார்கள்[a]; தங்கள் வாயால் அகந்தையாகப் பேசுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு சொல், “அவர்கள் தங்களுடைய கொழுப்பை மூடினார்கள்.” இங்கு “கொழுப்பு” என்பது உணர்வற்ற அல்லது தன்னிறைவால் கடினப்பட்ட இதயத்தைக் குறிக்கும் உருவகமாக இருக்கலாம்; “உணர்வற்ற இதயங்கள்” என்பது இதன் கருத்தை வெளிப்படுத்தும் மற்றொரு மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבָּמוֹ
  choice: தங்கள் கொழுத்த உள்ளங்களை
  rationale: எபிரெயத்தில் சொல்லுக்கு சொல் ‘அவர்களுடைய கொழுப்பை’ என்று உள்ளது. சூழலில் ‘கொழுப்பு’ உணர்வற்ற அல்லது தன்னிறைவால் கடினப்பட்ட அகநிலைக்கான உருவகமாகத் தோன்றுகிறது. தமிழில் பொருள் தெளிவதற்காக மறைந்துள்ள பொருளாக ‘உள்ளங்கள்’ சேர்க்கப்பட்டுள்ளது; அதேவேளை ‘கொழுத்த’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டுள்ளது.
- source_word: סָּגְרוּ
  choice: அடைத்துக்கொண்டார்கள்
  rationale: வினைச்சொல் ‘மூடு/அடை’ என்று பொருள்படும். இங்கு உள்ளார்ந்த உணர்வை மூடிக்கொண்ட நிலையை இயல்பான தமிழில் தெரிவிக்கத் தற்சுட்டுப் பொருள் கொண்ட வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: פִּימוֹ
  choice: தங்கள் வாயால்
  rationale: வடிவில் ஒருமையாக இருந்தாலும் பன்மை எழுவாயுடன் கூட்டுப் பொருளில் வருகிறது. ‘தங்கள் வாயால்’ என்பது தமிழில் இயல்பாக அந்தக் கூட்டுப் பொருளைத் தருகிறது.
- source_word: דִּבְּרוּ
  choice: பேசுகிறார்கள்
  rationale: எபிரெய நிறைவு வினை கவிதைச் சூழலில் தொடரும் அல்லது குணவிளக்க நிகழ்காலப் பொருளைக் கொள்ளலாம். பொல்லாதோரின் வழக்கமான நடத்தையைச் சுட்டுவதால் நிகழ்காலம் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: בְגֵאוּת
  choice: அகந்தையாக
  rationale: இந்தப் பெயர்ச்சொல் செருக்கு, பெருமிதம் அல்லது அகந்தையைக் குறிக்கிறது. ‘பேசுகிறார்கள்’ என்பதுடன் ‘அகந்தையாக’ என்பது இயல்பாக இணைந்து எதிர்மறையான ஒழுக்கப் பொருளைக் காக்கிறது.
