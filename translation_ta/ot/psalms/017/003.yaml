  text: בָּ֘חַ֤נְתָּ לִבִּ֨/י פָּ֘קַ֤דְתָּ לַּ֗יְלָה צְרַפְתַּ֥/נִי בַל תִּמְצָ֑א זַ֝מֹּתִ֗י בַּל יַעֲבָר פִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/003.yaml
  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
translation:
  language: ta
  text: 'நீர் என் உள்ளத்தை ஆராய்ந்தீர்;


    இரவில் என்னை விசாரித்தீர்;


    என்னைப் புடமிட்டுச் சோதித்தீர்;


    எதையும் காணவில்லை.[a]


    என் வாய் வரம்பு மீறாதபடி நான் தீர்மானித்தேன்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எதையும்’ என்பதற்குரிய பொருள் மூலமொழியில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை; ‘என்னில் எதையும் காணவில்லை’ அல்லது சூழலின்படி ‘குற்றம் எதையும் காணவில்லை’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: இறுதி வரி மூலமொழியில் சுருக்கமாகவும் பொருள் இணைப்பில் கடினமாகவும் உள்ளது. இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக, ‘நான் தீர்மானித்தேன்; என் வாய் வரம்பைக் கடக்காது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: textual_ambiguity
lexical_decisions:
- source_word: בָּחַנְתָּ
  choice: ஆராய்ந்தீர்
  rationale: בחן என்பது ஒருவரின் உள்ளார்ந்த தன்மையைச் சோதித்து ஆராய்வதைக் குறிக்கிறது. ‘உள்ளத்தை ஆராய்ந்தீர்’ என்பது தமிழில் இயல்பாகவும் மதிப்பீட்டின் நுண்பொருளுடனும் உள்ளது.
- source_word: לִבִּי
  choice: என் உள்ளத்தை
  rationale: எபிரெயத்தில் ‘இதயம்’ என்பது சிந்தனை, நோக்கம் உள்ளிட்ட உள்ளார்ந்த மனிதனைச் சுட்டுகிறது. நவீன தமிழில் ‘உள்ளம்’ இப்பொருளை இயல்பாகத் தருகிறது.
- source_word: פָּקַדְתָּ לַּיְלָה
  choice: இரவில் என்னை நாடி வந்தீர்
  rationale: פקד என்பதன் ‘வருகை தருதல்/கவனித்தல்/ஆய்வு செய்தல்’ என்ற விரிந்த பொருளை ‘நாடி வந்தீர்’ பாதுகாக்கிறது; சுற்றியுள்ள வரிகள் அந்த வருகையின் ஆய்வுத் தன்மையைத் தெளிவாக்குகின்றன.
- source_word: צְרַפְתַּנִי
  choice: என்னைப் புடமிட்டுச் சோதித்தீர்
  rationale: צרף அடிப்படையில் உலோகத்தைப் புடமிட்டுத் தூய்மை சோதிப்பதைக் குறிக்கிறது. இந்த உருவகத்தையும், ஒருவரைச் சோதிக்கும் சூழற்பொருளையும் இச்சொற்றொடர் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: בַל תִּמְצָא
  choice: எதையும் காணவில்லை
  rationale: எபிரெயத்தில் காணப்படாத பொருள் எது என்பது சொல்லப்படவில்லை. ‘குற்றம்’ அல்லது ‘தீமை’ என்று சேர்க்காமல், மூலத்தின் சுருக்கத்தையும் திறந்த நிலையையும் இவ்வாக்கியம் காக்கிறது.
- source_word: זַמֹּתִי
  choice: நான் தீர்மானித்தேன்
  rationale: இந்த வடிவத்தை זמם என்ற வினையின் முதல் நபர் வடிவமாக எடுத்துக்கொள்வது அடுத்துள்ள வாயைப் பற்றிய கூற்றை ஒரு தீர்மானமாக இயல்பாக இணைக்கிறது.
- source_word: בַּל יַעֲבָר פִּי
  choice: என் வாய் வரம்புமீறாதிருக்க
  rationale: עבר என்பதன் அடிப்படைப் பொருள் ‘கடத்தல்/எல்லை மீறுதல்.’ வாயோடு சேரும் இச்சூழலில், பேச்சில் வரம்புமீறாதிருப்பது என்ற நெறிப்பொருளை ‘வரம்புமீறாதிருக்க’ தெளிவாகத் தருகிறது.
theological_decisions:
- issue: இறுதி அடியின் இலக்கண மற்றும் பொருள் தொடர்பு
  choice: ‘என் வாய் வரம்புமீறாதிருக்க நான் தீர்மானித்தேன்’—சங்கீதக்காரனின் பேச்சைக் குறித்த உறுதித் தீர்மானமாக எடுத்துக்கொள்ளப்பட்டது.
  alternative: ‘நான் திட்டமிட்டது என் வாயைக் கடந்து செல்லாது’ அல்லது ‘என் வாய் வரம்புமீறுவதில்லை’ என்று மேலும் சொல்லுக்குச் சொல் நெருக்கமாகவோ நிலையான கூற்றாகவோ புரிந்துகொள்ளலாம்.
  rationale: எபிரெய இறுதி அடி சுருக்கமானதும் பொருள் இணைப்பில் கடினமானதும் ஆகும். זַמֹּתִי என்பதை வினையாகவும் அடுத்த சொற்றொடரை அந்தத் தீர்மானத்தின் உள்ளடக்கமாகவும் கொள்வது சூழலுக்கு ஏற்ற தெளிவான வாசிப்பைத் தருகிறது; மாற்று அமைப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. ‘புடமிட்டுச் சோதித்தீர்’ என்பது மூலத்தின் உலோகச் சுத்திகரிப்பு உருவகத்தை வாசகருக்குப் புரியும் வகையில் காக்கிறது. மரியாதை ஒருமை ‘நீர்/ஆராய்ந்தீர்’ இறைவனை நோக்கிய உரைக்கு ஏற்றவாறு தொடர்ச்சியாகப் பயன்படுத்தப்பட்டுள்ளது.
