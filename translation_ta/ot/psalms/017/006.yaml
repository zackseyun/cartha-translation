source:
  edition: WLC
  text: אֲנִֽי קְרָאתִ֣י/ךָ כִֽי תַעֲנֵ֣/נִי אֵ֑ל הַֽט אָזְנְ/ךָ֥ לִ֝֗/י שְׁמַ֣ע אִמְרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/006.yaml
  text: I call on you[a], for you answer me, O God; incline your ear to me[b]; hear my words.
translation:
  language: ta
  text: இறைவனே, நான் உம்மை நோக்கிக் கூப்பிடுகிறேன்[a]; ஏனெனில் நீர் எனக்குப் பதிலளிக்கிறீர். உமது செவியை எனக்குச் சாய்த்தருளும்[b]; என் சொல்லைக் கேட்டருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் உம்மை நோக்கிக் கூப்பிட்டேன்; ஏனெனில் நீர் எனக்குப் பதிலளிப்பீர், இறைவனே” என்றும் மொழிபெயர்க்கலாம். கவிதை மன்றாட்டிலுள்ள எபிரெய வினைவடிவங்கள் கடந்தகால, நிகழ்கால, அல்லது நம்பிக்கையுடன் எதிர்நோக்கும் எதிர்கால நுணுக்கத்தைக் கொண்டிருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “உமது செவியை எனக்குச் சாய்த்தருளும்” என்பது கவனமாகக் கேட்கும்படி இறைவனிடம் வேண்டுகிற எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: קְרָאתִיךָ
  choice: நான் உம்மை நோக்கிக் கூப்பிடுகிறேன்
  rationale: கால் முற்றுவினை வடிவம் கடந்தகாலம், நிகழ்கால வேண்டுதல், அல்லது உறுதியான எதிர்பார்ப்பு ஆகிய நுணுக்கங்களைப் பெறலாம். சங்கீதத்தின் நேரடி மன்றாட்டில் இயல்பாக ஒலிக்க நிகழ்காலம் தேர்ந்தெடுக்கப்பட்டது; மாற்று கால நுணுக்கம் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அழைப்பிற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாக உள்ளது.
- source_word: תַעֲנֵנִי
  choice: நீர் எனக்குப் பதிலளிக்கிறீர்
  rationale: இறைவன் செவிகொடுப்பார் என்ற சங்கீதக்காரரின் நம்பிக்கையை நிகழ்கால உறுதியாக வெளிப்படுத்துகிறது; எதிர்கால நுணுக்கமும் எபிரெயத்தில் சாத்தியம்.
- source_word: אֵל
  choice: இறைவனே
  rationale: நேரடி விளிப்பை இயல்பான, மரியாதைமிக்க நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַט אָזְנְךָ לִי
  choice: உமது செவியை என்னிடம் சாய்த்தருளும்
  rationale: கவனமாகக் கேட்கும்படி வேண்டுகிற எபிரெய உருவகத்தைத் தக்கவைக்கிறது; ‘அருளும்’ தமிழ் மன்றாட்டு நடையில் மரியாதையை இயல்பாகக் குறிக்கிறது.
- source_word: שְׁמַע
  choice: கேட்டருளும்
  rationale: நேரடி கட்டளை வடிவத்தைத் தமிழ் மன்றாட்டு நடையில் இயல்பாகவும் மரியாதையுடனும் தருகிறது.
- source_word: אִמְרָתִי
  choice: என் சொல்
  rationale: வழங்கப்பட்ட WLC வாசகம் ஒருமை வடிவில் இருப்பதால், அதன் கவிதைச் சுருக்கத்தையும் எண்ணையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இறைவன் பதிலளிப்பதன் கால நுணுக்கம்
  choice: 'நிகழ்கால உறுதி: ‘பதிலளிக்கிறீர்’'
  alternative: ‘பதிலளிப்பீர்’ அல்லது ‘பதிலளித்திருக்கிறீர்’
  rationale: எபிரெய வினைவடிவங்கள் கவிதை மன்றாட்டில் நிகழ்கால நம்பிக்கை, உறுதியான எதிர்காலம், அல்லது அனுபவிக்கப்பட்ட கடந்தகாலம் எனப் புரிந்துகொள்ளப்படலாம். முதன்மை உரை ஒன்றை இயல்பாகத் தேர்ந்தெடுக்கிறது; பிற சாத்தியங்களை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மன்றாட்டுக்குரிய கண்ணியமான நடையும் நேரடி கவிதைச் சுருக்கமும் பேணப்பட்டுள்ளன. இறைவனை நோக்கி ‘நீர்/உமது’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. வழங்கப்பட்ட எபிரெய உரையில் אִמְרָתִי ஒருமையாக இருப்பதால் ‘என் சொல்’ என மொழிபெயர்க்கப்பட்டது; ஆங்கிலத் திருத்தத்தின் பன்மை இங்கு பின்பற்றப்படவில்லை.
