translation:
  language: ta
  text: என்னைப் பாழாக்கும் தீயவர்களிடமிருந்தும், என் உயிருக்கு ஆபத்தான என் பகைவர்கள் என்னைச் சூழ்ந்துகொள்வதிலிருந்தும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறுவிதமாக: ‘என் உயிருக்கு எதிராக என்னைச் சூழ்ந்துகொள்ளும் என் பகைவர்கள்.’ எபிரெயச் சொற்றொடரில் ‘உயிர்/ஆத்துமா’ (בְּנֶפֶשׁ) என்ற சொல் உள்ளது. அது பகைவர்கள் சங்கீதக்காரனின் உயிரைக் குறிவைப்பதையோ, அல்லது அவர்கள் முழு முனைப்புடன் அவனைச் சூழ்வதையோ குறிக்கலாம்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי
  choice: இடமிருந்தும்
  rationale: இங்கு தீயவர்களால் வரும் ஆபத்திலிருந்து பாதுகாப்பைக் கோரும் பொருளில் பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனத்துடன் இயல்பாக இணைவதற்காக ‘இடமிருந்தும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: רְשָׁעִים
  choice: கொடியவர்கள்
  rationale: ஒழுக்கரீதியாகத் தீமை செய்பவர்களைக் குறிக்கிறது. இச்சூழலில் அவர்களின் வன்முறையான செயலையும் இயல்பான தமிழில் உணர்த்த ‘கொடியவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: זוּ
  choice: என்னைப் பாழாக்கும்
  rationale: இந்த உறவுப்பெயர் அடுத்த வினையை ‘கொடியவர்கள்’ என்பதுடன் இணைக்கிறது; தமிழில் தனி உறவுப்பெயர் இல்லாமல் பெயரெச்சத் தொடராக இயல்பாக அமைக்கப்பட்டது.
- source_word: שַׁדּוּנִי
  choice: என்னைப் பாழாக்கும்
  rationale: שׁדד என்பது வன்முறையாகச் சீரழித்தல் அல்லது கொள்ளையிட்டு நாசமாக்குதல் என்ற கருத்தைக் கொண்டது. முழுமையாக அழித்தொழித்தல் என்று மிகைப்படுத்தாமல் அதன் தீவிரத்தை ‘பாழாக்கும்’ உணர்த்துகிறது.
- source_word: אֹיְבַי
  choice: என் பகைவர்கள்
  rationale: சங்கீதக்காரனுக்கு எதிராகச் செயல்படுகிற பல பகைவர்களை நேரடியாகக் குறிக்கிறது.
- source_word: בְּנֶפֶשׁ
  choice: என் உயிரைப் பறிக்க
  rationale: נֶפֶשׁ என்பதன் ‘உயிர்’ என்ற கருத்தை வெளிப்படையாக வைத்துக்கொண்டு, பகைவர்கள் சங்கீதக்காரனின் உயிரையே குறிவைப்பதை இயல்பான தமிழில் தெரிவிக்கிறது. எபிரெயச் சொற்றொடரின் சுருக்கமும் தெளிவின்மையும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: יַקִּיפוּ עָלָי
  choice: என்னைச் சூழ்ந்துகொள்ளும்
  rationale: נקף என்பதன் காரணவினை வடிவமும் עַל என்பதும் ஒருவரைச் சுற்றி வளைத்துக்கொள்ளும் பகைச் செயலைக் குறிக்கின்றன. ‘சூழ்ந்துகொள்ளும்’ என்பது தெளிவான, உயிரோட்டமுள்ள தமிழ்.
theological_decisions:
- issue: בְּנֶפֶשׁ என்ற சொற்றொடர் யாருடைய உயிரையோ மனவிருப்பத்தையோ குறிக்கிறதா என்பது
  choice: பகைவர்கள் சங்கீதக்காரனின் உயிரைப் பறிக்க முனைவதாக முதன்மை உரையில் தரப்பட்டது.
  alternative: ‘உயிர்வெறியுடன் என்னைச் சூழ்ந்துகொள்ளும்’ அல்லது இன்னும் சொல்லுக்குச் சொல் முறையில் ‘உயிருக்கெதிராக என்னைச் சூழ்ந்துகொள்ளும்’ என்று கொள்ளலாம்.
  rationale: சூழ்ந்துகொள்ளும் பகைவர்கள் உயிருக்கு நேரான அச்சுறுத்தலாக இருப்பது இச்சூழலுக்கு நன்றாகப் பொருந்துகிறது. எனினும் எபிரெயில் ‘என்’ என்ற உடைமைச்சுட்டு בְּנֶפֶשׁ உடன் வெளிப்படையாக இல்லை; ஆகவே மாற்றுப் புரிதல் அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
