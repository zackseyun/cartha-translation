  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டது. வசனம் முந்தைய விண்ணப்ப வாக்கியத்துடன் தொடரும் துணைவாக்கியமாக இருப்பதால் இரு பகுதிகளிலும் ‘இடமிருந்தும்’ என அமைக்கப்பட்டுள்ளது. ‘ஆத்துமா’ என்பதை முதன்மை உரையில் தவிர்த்து, இச்சூழலுக்குரிய ‘உயிர்’ என்ற இயல்பான சொல்லைப் பயன்படுத்தியுள்ளோம்.
