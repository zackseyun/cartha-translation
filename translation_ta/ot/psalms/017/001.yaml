  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד שִׁמְעָ֤/ה יְהוָ֨ה צֶ֗דֶק הַקְשִׁ֥יבָ/ה רִנָּתִ֗/י הַאֲזִ֥ינָ/ה תְפִלָּתִ֑/י בְּ֝/לֹ֗א שִׂפְתֵ֥י מִרְמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
translation:
  language: ta
  text: தாவீதின் விண்ணப்பம். யாவே, நீதியான வழக்கைக் கேளும்[a]; என் கூக்குரலுக்குச் செவிசாய்த்தருளும்; வஞ்சகமில்லாத உதடுகளிலிருந்து வரும் என் விண்ணப்பத்தைக் கேட்டருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியைக் கேளும்.” எபிரெயச் சொல் நீதி, நேர்மை, அல்லது நீதியான வழக்கு ஆகியவற்றைக் குறிக்கலாம்; இங்கு அது சங்கீதக்காரரின் நியாயமான வழக்கைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: தாவீதின் விண்ணப்பம்
  rationale: சங்கீதத் தலைப்பிலுள்ள לְדָוִד என்பதை தாவீதுடன் தொடர்புடைய அல்லது அவரால் இயற்றப்பட்ட விண்ணப்பம் என இயல்பாகக் காட்டுகிறது; תְּפִלָּה என்பதற்கான ‘விண்ணப்பம்’ இவ்வசனத்தின் வேண்டுதல் சூழலுக்கு ஏற்றது.
- source_word: שִׁמְעָה
  choice: கேளும்
  rationale: שׁמע வினையின் கட்டளை வடிவத்தை நேரடியான, மரியாதைமிக்க வேண்டுதலாக வழங்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: צֶדֶק
  choice: நீதியான என் வழக்கு
  rationale: இங்கு ‘நீதி’ என்ற அரூபப் பண்பைவிட, சங்கீதக்காரரின் நியாயமான கோரிக்கை அல்லது வழக்கே கேட்கப்பட வேண்டும் என்பது சூழலுக்கு ஏற்றது; ‘என்’ என்பது தமிழில் மறைபொருளைத் தெளிவாக்குகிறது.
- source_word: הַקְשִׁיבָה רִנָּתִי
  choice: என் கூக்குரலுக்குச் செவிசாய்த்தருளும்
  rationale: קשׁב என்பதின் கவனமாகக் கேட்கும் வலிமையையும், רִנָּה என்பதின் உரத்த, அவசரக் கூக்குரலையும் இயல்பான கவிதை நடையில் தருகிறது.
- source_word: הַאֲזִינָה תְפִלָּתִי
  choice: என் விண்ணப்பத்தைக் கேட்டருளும்
  rationale: אזן என்பதின் ‘செவிகொடு’ என்ற பொருளை மரியாதைமிக்க நவீன தமிழில் தருகிறது; தலைப்பிலுள்ள תְּפִלָּה உடன் சொல் தொடர்பையும் ‘விண்ணப்பம்’ காக்கிறது.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: வஞ்சகமில்லாத உதடுகளிலிருந்து வரும்
  rationale: விண்ணப்பம் வஞ்சகமான உதடுகளிலிருந்து வரவில்லை என்ற எபிரெய அமைப்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: צֶדֶק என்பதின் பொருள்
  choice: நீதியான என் வழக்கு
  alternative: நீதி
  rationale: ‘கேள்’ என்பதின் நேரடி பொருளாக வரும் צֶדֶק, இச்சூழலில் அரூபமான நீதியையும் குறிக்கக்கூடிய போதிலும், விண்ணப்பக்காரரின் நியாயமான வழக்கு அல்லது கோரிக்கையைக் குறிப்பதாகத் தெரிகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதைமிக்க வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று கேட்பதற்கான வேண்டுகோள்களும் கவிதை இணைநிலையுடன் வேறுபடுத்தப்பட்டுள்ளன; அதேவேளையில் செயற்கையான பழமொழிநடை தவிர்க்கப்பட்டுள்ளது.
