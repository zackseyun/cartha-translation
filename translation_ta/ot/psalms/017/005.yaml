  text: My steps have held fast in your paths[b][a]; my feet have not slipped.
translation:
  language: ta
  text: உமது பாதைகளில் என் அடிகளைத் தாங்கியருளும்[a][b]; என் காலடிகள் சறுக்காதிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பாதைகளில் என் அடிகள் உறுதியாக நிலைத்தன.” எபிரெய வினைவடிவத்தை வேண்டுதலாகவோ, உறுதியாக நிலைத்திருப்பதைக் கூறும் கூற்றாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “உமது வழித்தடங்களில்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמֹךְ
  choice: உறுதியாக நிலைத்தன
  rationale: תמך என்பது உறுதியாகப் பற்றிக்கொள்வது அல்லது தாங்குவது என்ற கருத்தைக் கொண்டது. அடுத்த வரியில் காலடிகள் சறுக்கவில்லை என்பதுடன் இணைந்து, நடையில் உறுதியாக நிலைத்திருந்ததை இச்சொற்றொடர் இயல்பான தமிழில் தெரிவிக்கிறது; எபிரெய வடிவிலுள்ள வேண்டுதல்/கூற்று ambiguity அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲשֻׁרַי
  choice: என் அடிகள்
  rationale: நடையின் அடிகள் அல்லது ஒருவரின் நடைப்போக்கைக் குறிக்கும் உருவகத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: בְּמַעְגְּלוֹתֶיךָ
  choice: உமது பாதைகளில்
  rationale: מַעְגָּל என்பது பாதை, வழித்தடம், பதிந்த தடம் ஆகியவற்றைக் குறிக்கலாம். பொதுவாசகர்களுக்குத் தெளிவாக இருக்கும் ‘பாதைகள்’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, ‘வழித்தடங்கள்’ என்ற நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּל
  choice: இல்லை
  rationale: கவிதை நடையிலுள்ள உறுதியான மறுப்பைத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: נָמֹטּוּ
  choice: சறுக்கவில்லை
  rationale: מוט என்பதன் சறுக்குதல், தடுமாறுதல், அசைக்கப்படுதல் ஆகிய பொருள்களில், காலடிகளுடன் வரும் இவ்விடத்தில் ‘சறுக்கவில்லை’ தெளிவானதும் உருவகத்தைப் பாதுகாப்பதும் ஆகும்.
- source_word: פְעָמָי
  choice: என் காலடிகள்
  rationale: இச்சொல் அடிகள் அல்லது காலடிகளைக் குறிக்கலாம். ‘சறுக்கவில்லை’ என்பதுடன் ‘காலடிகள்’ இயல்பாக இணைந்து, முதல் அரையடியிலுள்ள ‘என் அடிகள்’ என்பதுடன் கவிதை இணைநிலையைப் பேணுகிறது.
theological_decisions:
- issue: 'תָּמֹךְ என்பதன் இலக்கணப் பொருள்: உறுதிநிலையைக் கூறும் கூற்றா அல்லது தாங்கும்படி செய்யும் வேண்டுதலா'
  choice: கடந்த உறுதிநிலையைக் கூறும் கூற்றாக ‘என் அடிகள் உறுதியாக நிலைத்தன’
  alternative: வேண்டுதலாக ‘என் அடிகளைத் தாங்கியருளும்’
  rationale: அடுத்த அரையடியான ‘என் காலடிகள் சறுக்கவில்லை’ என்பது நடந்த நிலையை உறுதிப்படுத்தும் கூற்றாக இருப்பதால் முதன்மை உரையில் கூற்று தேர்ந்தெடுக்கப்பட்டது. இருப்பினும் எபிரெய வடிவம் வேண்டுதலாகவும் புரிந்துகொள்ளப்படக்கூடியதால் அந்த உண்மையான ambiguity அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உமது’ என்பது மரியாதையையும் நேரடி இறைமுகப்பையும் காக்கிறது. நடை/பாதை/சறுக்குதல் என்ற தொடர்ச்சியான உருவகம் பாதுகாக்கப்பட்டுள்ளது.
