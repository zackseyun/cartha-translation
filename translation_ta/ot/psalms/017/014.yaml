  source_fidelity: மூல எபிரெயத்தில் இந்த வசனம் முந்தைய வசனத்திலுள்ள வேண்டுதலைத் தொடரும் சுருக்கமான தொடராக உள்ளது; தனியாகச் சொல்லப்படும் “என்னை விடுவியும்” இவ்வசனத்தின் சொற்களில் இல்லை. அதனை நீக்கி, மூலத்தின் நோக்கமுள்ள தொடர்ச்சியையும் எஞ்சியுள்ள தொடரமைப்பு ஐயத்தையும் பாதுகாப்பது சிறந்தது. יִתְרָם என்பதற்கு வெறும் எஞ்சிய உணவு/மீதி என்ற பொருளைத் தரக்கூடிய சொல்லை விட, ‘மிகுதி’ பொருத்தமானது.
  naturalness: மொழிநடை பெரும்பாலும் நவீன தரத் தமிழிலும் சங்கீதத்திற்கேற்ற மரியாதை நடையிலும் உள்ளது. “மகன்களால் திருப்தியடைகிறார்கள்” மற்றும் “தங்களுடைய மிகுதியை” என்பவை இச்சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளன.
  terminology: ‘யாவே,’ ‘இவ்வுலகத்து மனிதர்கள்,’ ‘பங்கு,’ ‘வயிறு,’ ‘மகன்கள்,’ ‘சிறு பிள்ளைகள்’ ஆகியவை மூலத்தின் முக்கியச் சொற்களையும் வேறுபாடுகளையும் நன்கு காக்கின்றன. ‘மகன்கள்’ என்பதன் ஆண்பால் பன்மை நுணுக்கம் அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட வேண்டும்.
  issues:
  - severity: medium
    issue: முதன்மை உரையில் “என்னை விடுவியும்” சேர்க்கப்பட்டுள்ளது.
    rationale: விடுவிப்புக்கான வேண்டுதல் முந்தைய வசனத்திலிருந்து பொருளாகத் தொடர்ந்தாலும், இவ்வசனத்தின் எபிரெயச் சொற்களில் வினை வெளிப்படையாக இல்லை. சேர்க்கப்பட்ட வினை வசனத்தின் சுருக்கமான, தொடரும் இயல்பை விளக்கமாக மாற்றுகிறது.
  - severity: low
    issue: “தங்களிடம் மீந்திருப்பதை” יִתְרָם என்பதன் செழிப்பு/மிகுதி நுணுக்கத்தைத் தளர்த்துகிறது.
    rationale: இச்சூழலில் சொல் வெறுமனே மீதமுள்ள பொருளைக் காட்டுவதைக் காட்டிலும், அவர்கள் விட்டுச்செல்லும் உபரி அல்லது மிகுதியைக் குறிக்கிறது.
