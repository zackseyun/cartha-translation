    reason: lexical_nuance
  revision_rationale: மூலத்தில் வெளிப்படையாக இல்லாத வினையை நீக்கி, முந்தைய வசனத்திலிருந்து தொடரும் வேண்டுதலைக் கோடிட்ட இடைநிறுத்தத்தால் காத்துள்ளேன். ‘மீந்திருப்பது’ என்பதற்குப் பதிலாக ‘மிகுதி’ பயன்படுத்தப்பட்டதால் יִתְרָם என்பதன் உபரி/செழிப்பு பொருள் தெளிவாகிறது. அடிக்குறிப்பு b மூலத்தின் ஆண்பால் பன்மையையும் சாத்தியமான மாற்று இலக்கண வாசிப்பையும் இரண்டையும் காக்கிறது.
