    rationale: மாற்று இலக்கண வாசிப்பு குறிப்பிடத்தக்கதுதான்; அதேவேளை மூலச் சொல்லின் வெளிப்படையான ஆண்பால் பன்மையையும், வளமையின் அடையாளமாகப் பல மகன்கள் என்ற பொருள் நுணுக்கத்தையும் அடிக்குறிப்பு பாதுகாக்க வேண்டும்.
  revised_text: 'யாவே, உமது கையால் மனிதர்களிடமிருந்து[a]—

    இவ்வுலகத்து மனிதர்களிடமிருந்து—


    இவ்வாழ்விலேயே அவர்களுடைய பங்கு இருக்கிறது.


    நீர் சேமித்து வைத்திருப்பவற்றால் அவர்களுடைய வயிற்றை நிரப்புகிறீர்;

    அவர்கள் மகன்களால்[b] திருப்தியடைகிறார்கள்;

    தங்களுடைய மிகுதியைத் தங்கள் சிறு பிள்ளைகளுக்கு[c] விட்டுச் செல்கிறார்கள்.'
  revised_footnotes:
