  text: מִֽ/מְתִ֥ים יָדְ/ךָ֨ יְהוָ֡ה מִֽ/מְתִ֬ים מֵ/חֶ֗לֶד חֶלְקָ֥/ם בַּֽ/חַיִּים֮ ו/צפינ/ך תְּמַלֵּ֪א בִ֫טְנָ֥/ם יִשְׂבְּע֥וּ בָנִ֑ים וְ/הִנִּ֥יחוּ יִ֝תְרָ֗/ם לְ/עוֹלְלֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
translation:
  language: ta
  text: 'யாவே, உமது கையால் மனிதர்களிடமிருந்து[a]—

    இவ்வுலகத்து மனிதர்களிடமிருந்து—


    இவ்வாழ்விலேயே அவர்களுடைய பங்கு இருக்கிறது.


    நீர் சேமித்து வைத்திருப்பவற்றால் அவர்களுடைய வயிற்றை நிரப்புகிறீர்;

    அவர்கள் மகன்களால்[b] திருப்தியடைகிறார்கள்;

    தங்களுடைய மிகுதியைத் தங்கள் சிறு பிள்ளைகளுக்கு[c] விட்டுச் செல்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதர்களிடமிருந்து, உமது கையால்” / “உமது கைக்குரிய மனிதர்களிடமிருந்து.” எபிரெய தொடரமைப்பு சுருக்கமாக இருப்பதால் இதைப் பலவாறு இணைத்துப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயில் “மகன்கள்.” இது ஆண்பால் பன்மை; பல மகன்கள் வளமையின் அடையாளமாகக் கருதப்பட்டிருக்கலாம். “அவர்களுடைய மகன்கள் திருப்தியடைகிறார்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_and_syntactical_alternative
  - marker: c
    text: எபிரெயச் சொல் குறிப்பாகச் சிறு குழந்தைகளைக் குறிக்கிறது.
    reason: lexical_nuance
lexical_decisions:
- source_word: מִמְתִים
  choice: மனிதர்களிடமிருந்து
  rationale: இது ‘இவ்வுலகத்து மனிதர்கள்’ என்பதற்கு இணையாக மனித எதிரிகளைக் குறிக்கிறது; ‘இறந்தவர்களிடமிருந்து’ என்பது இச்சூழலுக்குப் பொருந்தாது. முந்தைய வசனத்திலிருந்து தொடரும் விடுவிப்புக்கான வேண்டுதல் தமிழில் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: יָדְךָ
  choice: உமது கையால்
  rationale: இறைவனுடைய கை செயற்படும் கருவி அல்லது ஆளுகையைச் சுட்டலாம். எபிரெய தொடரமைப்பு சுருக்கமாக இருப்பதால் அதன் மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
- source_word: מֵחֶלֶד
  choice: இவ்வுலகத்து
  rationale: காலவரம்புடைய தற்போதைய மனித வாழ்வின் உலகத்தைக் குறிக்கிறது; அருவமான பிரபஞ்சக் கருத்தை அல்ல.
- source_word: חֶלְקָם בַּחַיִּים
  choice: இவ்வாழ்விலேயே அவர்களுடைய பங்கு இருக்கிறது
  rationale: அவர்களுடைய பங்கு தற்போதைய வாழ்வில் இருப்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; எதிர்காலத்தைப் பற்றிய மேலதிக கோட்பாட்டைச் சேர்க்கவில்லை.
- source_word: וּצְפוּנְךָ
  choice: நீர் சேமித்து வைத்திருப்பவை
  rationale: மறைத்து அல்லது சேமித்து வைக்கப்பட்டவை என்ற மூலப் படிமத்தைப் பாதுகாக்கிறது; அது பொருள் செல்வம் மட்டுமே என்று மிகையாகக் குறிப்பதில்லை.
- source_word: תְּמַלֵּא בִטְנָם
  choice: அவர்களுடைய வயிற்றை நிரப்புகிறீர்
  rationale: בטן என்பதன் konkrete உடற்படிமத்தைப் பாதுகாக்கிறது; இச்சூழலில் நிறைவும் வளமையும் குறிக்கிறது.
- source_word: יִשְׂבְּעוּ בָנִים
  choice: அவர்கள் மகன்களால் நிறைவடைகிறார்கள்
  rationale: בנים என்பது ஆண்பால் பன்மையில் ‘மகன்கள்’ என இருப்பதைப் பாதுகாக்கிறது. வினையின் எழுவாய் அந்த மனிதர்களே என்ற வாசிப்பைப் பின்பற்றுகிறது; மாற்று இலக்கண வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְהִנִּיחוּ יִתְרָם
  choice: தங்களிடம் மீந்திருப்பதை விட்டுச் செல்கிறார்கள்
  rationale: יֶתֶר என்பது மீதி அல்லது உபரி என்பதால், சொத்துச் சேர்க்கையை மிகையாகக் குறிப்பதின்றி இயல்பான தமிழில் தருகிறது.
- source_word: לְעוֹלְלֵיהֶם
  choice: தங்கள் சிறு பிள்ளைகளுக்கு
  rationale: עוללים குறிப்பாகச் சிறு குழந்தைகளைக் குறிக்கிறது; பொதுவான ‘பிள்ளைகள்’ என்பதைவிட மூலத்தின் நுணுக்கத்தை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘மனிதர்களிடமிருந்து—உமது கையால்’ என்பதில் எதிரிகளுக்கும் இறைவனுடைய கைக்கும் உள்ள உறவு
  choice: ‘உமது கையால் மனிதர்களிடமிருந்து’ என்று இறைவனிடம் விடுவிப்பைக் கோரும் வாசிப்பு
  alternative: ‘உமது கைக்குரிய மனிதர்களிடமிருந்து’ அல்லது ‘மனிதர்களிடமிருந்து, உமது கையால்’
  rationale: எபிரெய தொடரமைப்பு சுருக்கமாகவும் பலவாறு இணைக்கத்தக்கதாகவும் உள்ளது. முதன்மை உரை இயல்பான வேண்டுதலைத் தருகிறது; அந்த மனிதர்கள் இறைவனுடைய நியாயத்தீர்ப்புக் கருவிகள் என்று தீர்மானிக்காமல் மாற்று வாசிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: தீயவர்களின் தற்போதைய வளமை
  choice: அவர்களுடைய பங்கு ‘இவ்வாழ்விலேயே’ இருப்பதாகக் கூறுதல்
  alternative: ‘உயிரோடிருப்போரிடையே அவர்களுடைய பங்கு இருக்கிறது’
  rationale: காலத்திற்குட்பட்ட வளமையை உரை சுட்டுகிறது. ஆனால் எதிர்கால நியாயத்தீர்ப்பு அல்லது மறுவாழ்வு பற்றிய முழுமையான முடிவை இந்த வசனத்திற்குள் சேர்க்கவில்லை.
- issue: יִשְׂבְּעוּ בָנִים என்ற தொடரின் இலக்கண உறவு
  choice: அந்த மனிதர்கள் மகன்களால் நிறைவடைகிறார்கள்
  alternative: அவர்களுடைய மகன்கள் நிறைவடைகிறார்கள்
  rationale: எபிரெயில் இரு வாசிப்புகளுக்கும் இடமுள்ளது. சூழலில் சந்ததியால் கிடைக்கும் செழிப்பு முதன்மை வாசிப்பாக ஏற்கப்பட்டுள்ளது; மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாகத் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனை நோக்கி ‘நீர்/உமது’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வேண்டுதலின் தொடராக இருப்பதால் தமிழில் பொருள் முழுமையடைய ‘என்னை விடுவியும்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது; இது எபிரெயில் முன்வசனத்திலிருந்து தொடரும் கருத்தாகும்.
