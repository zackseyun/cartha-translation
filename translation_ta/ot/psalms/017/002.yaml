  text: מִ֭/לְּ/פָנֶי/ךָ מִשְׁפָּטִ֣/י יֵצֵ֑א עֵ֝ינֶ֗י/ךָ תֶּחֱזֶ֥ינָה מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/002.yaml
  text: May my judgment come forth from before you[b][a]; may your eyes behold what is upright.
translation:
  language: ta
  text: உமது முன்னிலையிலிருந்து என் வழக்கின் தீர்ப்பு புறப்படட்டும்[a]; உமது கண்கள் நேர்மையானவற்றைக் காணட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது முன்னிலையிலிருந்து எனக்கு நீதி கிடைக்கட்டும்.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “சமநீதியைக்” அல்லது “சரியானதைக்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  choice: உமது முன்னிலையிலிருந்து
  rationale: தேவனுடைய முகத்துக்கு முன்பாக அல்லது அவரது முன்னிலையிலிருந்து தீர்ப்பு புறப்படும் என்ற இடம்சார் நீதிமன்றப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: מִשְׁפָּטִי
  choice: என் வழக்கின் தீர்ப்பு
  rationale: இச்சொல் தீர்ப்பு, நீதி, வழக்கு அல்லது நியாயத் தீர்ப்பு எனப் பொருள்படலாம். தமிழில் ‘என் தீர்ப்பு’ என்பது சங்கீதக்காரன் வழங்கும் தீர்ப்பு எனத் தவறாகப் புரியக்கூடும்; ‘என் வழக்கின் தீர்ப்பு’ என்பது நீதிமன்றச் சூழலைத் தெளிவாக்குகிறது, அதேவேளை ‘நீதி கிடைத்தல்’ என்ற மாற்றுப் பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: יֵצֵא
  choice: புறப்படட்டும்
  rationale: ‘வெளியேறு/புறப்படு’ என்ற மூலப் படிமத்தையும், வேண்டுதலைக் குறிக்கும் வினைமுறையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עֵינֶיךָ
  choice: உமது கண்கள்
  rationale: தேவனுடைய ஆராயும் பார்வையை வெளிப்படுத்தும் எபிரெயக் கவிதைப் படிமத்தைச் சுருக்காமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: תֶּחֱזֶינָה
  choice: காணட்டும்
  rationale: கவனமாகப் பார்த்தல் என்ற பொருளுக்கு ஏற்ற, தெளிவான நவீனத் தமிழ்ச் சொல்; இணையான வேண்டுதல் வடிவத்தையும் காக்கிறது.
- source_word: מֵישָׁרִים
  choice: நேர்மையானதை
  rationale: நேர்மை, சமநீதி, சரியானது ஆகிய அறநெறி மற்றும் நீதித்துறைப் பொருள் பரப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; பிற சாத்தியங்களை அடிக்குறிப்பு குறிப்பிடுகிறது.
theological_decisions:
- issue: இவ்வசனத்தை உறுதியான அறிவிப்பாக மொழிபெயர்ப்பதா, வேண்டுதலாக மொழிபெயர்ப்பதா
  choice: 'வேண்டுதல்: ‘புறப்படட்டும் … காணட்டும்’'
  alternative: 'எதிர்காலம் அல்லது அறிவிப்பு: ‘புறப்படும் … காணும்’'
  rationale: எபிரெய முற்றுப்பெறா வினைகள் சாதாரண எதிர்காலத்தையும் குறிக்கலாம். எனினும் சுற்றியுள்ள ஜெபச் சூழலில் அவை வேண்டுதலுக்குரிய ஏவல் நுணுக்கத்துடன் இயங்குகின்றன; ‘ட்டும்’ வடிவம் அந்த வேண்டுதலை வெளிப்படுத்துகிறது, இலக்கணம் அளிப்பதைவிட அதிகமான உறுதியைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடையுடன் ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நீதிமன்றப் படிமமும் இணையான இரு வேண்டுதல் தொடர்களும் காக்கப்பட்டுள்ளன.
