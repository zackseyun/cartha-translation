lexical_decisions:
- source_word: בְּצֶדֶק
  choice: நீதியில்
  rationale: צֶדֶק என்பது நீதி அல்லது நீதிநிலை என்பதைக் குறிக்கிறது. இங்குள்ள ב முன்னொட்டின் சுருக்கத்தையும், இது சங்கீதக்காரரின் நேர்மையையா, கடவுள் வழங்கும் நியாயத்தீர்ப்பையா, வேறொரு நீதிநிலையையா குறிக்கிறது என்ற தெளிவின்மையையும் ‘நீதியில்’ தக்கவைக்கிறது.
- source_word: אֶחֱזֶה
  choice: காண்பேன்
  rationale: חזה என்பது வெறுமனே கண்ணால் பார்ப்பதைவிட உணர்ந்து காணுதல் அல்லது தரிசித்தல் என்ற உயர்ந்த பொருளையும் கொண்டிருக்கலாம். இயல்பான நவீன தமிழில் கவிதைச் செறிவைத் தக்கவைக்க ‘காண்பேன்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: פָנֶיךָ
  choice: உமது முகம்
  rationale: எபிரெயச் சொல் நேரடியாக ‘உமது முகம்’ எனப் பொருள்படும். ‘உமது பிரசன்னம்’ என்பது சாத்தியமான விரிவாக்கம் என்றாலும், மூலத்தின் உருவகமிக்க நேரடிச் சொல்லாட்சி முதன்மை உரையில் தக்கவைக்கப்படுகிறது.
- source_word: אֶשְׂבְּעָה
  choice: மனநிறைவடைவேன்
  rationale: שׂבע என்பது நிறைவடைதல் அல்லது திருப்தியடைதல் என்பதைக் குறிக்கிறது. ‘மனநிறைவடைவேன்’ என்பது இச்சூழலில் இயல்பான தமிழாகவும், உள்ளார்ந்த நிறைவை வெளிப்படுத்துவதாகவும் உள்ளது.
- source_word: בְּהָקִיץ
  choice: நான் விழித்தெழும்போது
  rationale: 'ב உடன் வரும் வினையெச்ச அமைப்பு காலத்தைக் குறிக்கிறது: ‘விழித்தெழும்போது.’ இது சாதாரண உறக்கத்திலிருந்து விழிப்பதா அல்லது இறுதி மீட்பு/உயிர்த்தெழுதலைச் சுட்டுகிறதா என்பதை முதன்மை உரை தீர்மானிக்கவில்லை.'
- source_word: תְּמוּנָתֶךָ
  choice: உமது சாயல்
  rationale: תְּמוּנָה என்பது சாயல், வடிவம் அல்லது உருவம் எனப் பொருள்படலாம். ‘சாயல்’ என்பது திட்டவட்டமான உடல் வடிவத்தைத் திணிக்காமல், மூலத்தின் கண்கூடான பெயர்ச்சொல் தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: בְּהָקִיץ என்பது சாதாரண உறக்கத்திலிருந்து விழிப்பதைக் குறிக்கிறதா, அல்லது இறுதி நியாயநிறைவேற்றம்/உயிர்த்தெழுதல் பற்றிய நம்பிக்கையைக் குறிக்கிறதா?
  choice: முதன்மை உரையில் ‘நான் விழித்தெழும்போது’ என்று வைத்து, விழித்தெழுதலின் தன்மை வரையறுக்கப்படவில்லை.
  alternative: இதை அன்றாட உறக்கத்திலிருந்து விழித்தல் என்றோ, இறுதிக்கால விழித்தெழுதல் அல்லது உயிர்த்தெழுதல் என்றோ புரிந்துகொள்ளலாம்.
  rationale: எபிரெயச் சொற்றொடர் எந்தப் பொருளை மட்டும் குறிக்கிறது என்று வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே இறையியல் பதற்றமும் பொருள் திறப்பும் உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கவிதைநயம் மற்றும் கண்ணியமுள்ள நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதை ஒருமை ‘உமது’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் சுருக்கமும் இறையியல் தெளிவின்மையும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன.
