  yaml_path: translation/ot/psalms/017/000.yaml
  text: A prayer of David. Hear righteousness[a], Yahweh; pay attention to my cry; give ear to my prayer from lips without deceit.
translation:
  language: ta
  text: 'தாவீதின் மன்றாட்டு.


    யெகோவாவே, நீதியான வழக்கைக்[a] கேளும்; என் கூக்குரலுக்குச் செவிசாயும்; வஞ்சகமற்ற உதடுகளிலிருந்து வரும் என் மன்றாட்டைக் கவனித்துக் கேளும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதியைக் கேளும்.” எபிரெயச் சொல் ‘நீதி’, ‘நியாயம்’, அல்லது ‘நியாயமான வழக்கு’ என்பவற்றைக் குறிக்கலாம்; இங்கு சங்கீதக்காரர் முன்வைக்கும் நியாயமான வழக்கைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: மன்றாட்டு
  rationale: இங்கு வேண்டுதல் நிறைந்த ஜெபத்தைக் குறிக்கிறது; தலைப்பிலும் வசனத்தின் இறுதியிலும் ஒரே சொல்லை இயன்றவரை ஒருமையாகத் தருகிறது.
- source_word: צֶדֶק
  choice: என் நீதியான வழக்கு
  rationale: எபிரெயச் சொல் ‘நீதி’, ‘நியாயம்’, அல்லது ‘நியாயமான வழக்கு’ எனப் பொருள்படலாம். சூழலில் சங்கீதக்காரரின் நியாயமான முறையீடு நோக்கமாகத் தோன்றுவதால் இயல்பான தமிழில் இவ்வாறு தரப்பட்டுள்ளது; உண்மையான பொருள் விரிவு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: רִנָּתִי
  choice: என் கூக்குரல்
  rationale: உதவிக்காக உரக்க எழுப்பப்படும் குரலை இச்சூழலில் இயல்பாகக் குறிக்கிறது.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: வஞ்சகமற்ற உதடுகளிலிருந்து வரும்
  rationale: மன்றாட்டு பொய்யோ ஏமாற்றமோ இல்லாத பேச்சிலிருந்து வருகிறது என்ற எபிரெயத் தொடர்பைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: צֶדֶק என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘என் நீதியான வழக்கு’
  alternative: ‘நீதியைக் கேளும்’ அல்லது ‘நியாயத்தைக் கேளும்’
  rationale: சொல்லின் கருத்தியல் பொருளை மட்டும் கூறாமல், இங்கு தேவனிடம் முன்வைக்கப்படும் நியாயமான வழக்கை அது குறிக்கக்கூடும். எனினும் மூலத்தின் பலபொருள் தன்மையை அடிக்குறிப்பு வெளிப்படையாகக் காக்கிறது.
- issue: יהוה என்ற இறைபெயர்
  choice: யெகோவா
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்குரிய கண்ணியத்தையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கும் நடை. தொடர்ச்சியான வேண்டுகோள்களுக்கு மரியாதை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; அளவுக்கு மீறிய பழந்தமிழ் தவிர்க்கப்பட்டுள்ளது.
