  yaml_path: translation/ot/psalms/017/011.yaml
  text: They have now surrounded our steps[c][b][a]; they set their eyes to cast us down to the ground.
translation:
  language: ta
  text: எங்கள் காலடிகளில், இப்போது அவர்கள் என்னைச் சூழ்ந்துகொண்டார்கள்[a]; தரையில் தள்ளிவிடுவதற்காகத் தங்கள் கண்களைப் பதிக்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில், ‘எங்கள் காலடிகள்’ என்று கூறிய பின், ‘என்னைச் சூழ்ந்தார்கள்’ என்று ஒருமைக்கு மாறுகிறது. இந்தத் தொடரை ‘இப்போது அவர்கள் எங்கள் காலடிகளைச் சூழ்ந்தார்கள்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: grammatical_ambiguity
  - marker: b
    text: அல்லது, ‘தரையை நோக்கிச் சாய்க்கத் தங்கள் கண்களைப் பதிக்கிறார்கள்.’ வீழ்த்தப்படுபவர் எபிரெயத்தில் வெளிப்படையாகக் குறிப்பிடப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשֻּׁרֵינוּ
  choice: எங்கள் காலடிகளின் வழியில்
  rationale: இந்தப் பெயர்ச்சொல் ‘எங்கள் அடிகள்/காலடிகள்’ என்று பொருள்படும். அடுத்து வரும் வினையில் ‘என்னை’ என்ற ஒருமை பின்னொட்டு இருப்பதால், இதை நேரடிச் செயப்படுபொருளாக மாற்றாமல், அவர்கள் சங்கீதக்காரனின் நடமாட்டப் பாதையிலேயே அவனைச் சூழ்வதாக இயல்பான தமிழில் காட்டுகிறது.
- source_word: עַתָּה
  choice: இப்போது
  rationale: நடப்பு நெருக்கடியைக் குறிக்கும் கால வினையடை.
- source_word: סבבוני
  choice: அவர்கள் என்னைச் சூழ்ந்துகொண்டார்கள்
  rationale: வினை ‘சூழ்தல்’ என்று பொருள்படுகிறது; மசோரா உரையில் உள்ள முதலாம் நபர் ஒருமை ‘என்னை’ பின்னொட்டைத் தெளிவாகப் பேணுகிறது.
- source_word: עֵינֵיהֶם יָשִׁיתוּ
  choice: தங்கள் கண்களைப் பதிக்கிறார்கள்
  rationale: ‘கண்களை வைக்கிறார்கள்/பதிக்கிறார்கள்’ என்ற எபிரெய உருவகத்தையும் பகைமையான உறுதியான நோக்கத்தையும் பேணுகிறது.
- source_word: לִנְטוֹת בָּאָרֶץ
  choice: தரையில் வீழ்த்துவதற்காக
  rationale: נטה என்பதன் அடிப்படை எண்ணம் சாய்த்தல் அல்லது வளைத்தல்; இங்கு பகைவர்கள் ஒருவரைத் தரை நோக்கித் தாழ்த்தும் நோக்கம் சூழலுக்குப் பொருந்துகிறது. எபிரெயத்தில் வீழ்த்தப்படுபவர் வெளிப்படையாகக் குறிப்பிடப்படாததால் தமிழிலும் செயப்படுபொருள் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: ‘எங்கள்’ என்பதிலிருந்து ‘என்னை’ என்பதற்கான எண்ணிக்கை மாற்றம்
  choice: மூல உரையின் பன்மை–ஒருமை மாற்றத்தை முதன்மை உரையிலேயே பேணுதல்
  alternative: ‘எங்கள் காலடிகளை அவர்கள் சூழ்ந்தார்கள்’ அல்லது ‘எங்களைச் சூழ்ந்தார்கள்’ என்று எண்ணிக்கையை ஒருமைப்படுத்துதல்
  rationale: மசோரா உரையில் אַשֻּׁרֵינוּ என்பது ‘எங்கள் காலடிகள்’ என்றும் סבבוני என்பது ‘என்னைச் சூழ்ந்தார்கள்’ என்றும் உள்ளது. இதைச் சீராக்குவது மூலத்தின் உண்மையான இலக்கணத் திடுக்கத்தை மறைக்கும்.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை. ‘காலடிகள்’, ‘சூழ்ந்துகொண்டார்கள்’, ‘கண்களைப் பதிக்கிறார்கள்’ ஆகியவை தெளிவானவையாக இருக்க, மூலத்தின் உடல் சார்ந்த உருவகமும் பன்மையிலிருந்து ஒருமைக்கு மாறும் பதற்றமும் பேணப்பட்டுள்ளன.
