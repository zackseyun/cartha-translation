  text: As for the deeds of man[a], by the word of your lips I have kept myself from the paths of the violent.
translation:
  language: ta
  text: மனிதரின் செயல்களைப் பொறுத்தமட்டில், உமது உதடுகளின் வார்த்தையால் வன்முறையாளர்களின் பாதைகளிலிருந்து என்னைக் காத்துக்கொண்டேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மற்றொரு முறையில், “வன்முறையாளர்களின் பாதைகளிலிருந்து விலகியிருந்தேன்.” எபிரெயச் சொல்லை “வன்முறையாளர்களின் பாதைகளைக் கவனித்தேன்” என்றும் புரிந்துகொள்ளலாம்; ஆனால் சூழல் அவற்றைத் தவிர்த்ததையே ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְעֻלּוֹת אָדָם
  choice: மனிதரின் செயல்களைப் பொறுத்தவரை
  rationale: לְ இங்கு பேசுபொருளையோ தொடர்புடைய துறையையோ அறிமுகப்படுத்துகிறது. אָדָם ஒரு குறிப்பிட்ட ஆணை அல்ல, மனிதரைப் பொதுவாகக் குறிக்கிறது; ஆகவே இயல்பான நவீனத் தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בִּדְבַר שְׂפָתֶיךָ
  choice: உமது உதடுகளின் வார்த்தையால்
  rationale: בְ கருவிப் பொருளில் வந்துள்ளது. 'உதடுகளின் வார்த்தை' என்ற எபிரெயக் கவித்துவமான மனிதவுருவகத்தைச் சுருக்காமல் காக்கிறது.
- source_word: שָׁמַרְתִּי
  choice: என்னைக் காத்துக்கொண்டேன்
  rationale: שׁמר என்பதன் அடிப்படைப் பொருள் 'காத்தல், கடைப்பிடித்தல், கவனித்தல்.' இங்கு வரும் பாதைகளும் நேர்மையை வலியுறுத்தும் சூழலும் தீய வழிகளிலிருந்து தன்னைக் காத்துக்கொண்ட பொருளை ஆதரிக்கின்றன; தேவையான தன்னிலைப் பொருள் தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אָרְחוֹת
  choice: பாதைகளிலிருந்து
  rationale: வாழ்க்கை நடத்தை அல்லது போக்கைக் குறிக்கும் 'பாதை' உருவகத்தைத் தக்கவைக்கிறது. தவிர்த்தல் என்ற சூழற்பொருளை இயல்பாகச் சொல்ல விலகல் வேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: פָּרִיץ
  choice: வன்முறையாளர்களின்
  rationale: இச்சொல் பொதுவான மீறுபவரை மட்டுமல்ல, வன்முறையும் கொடுமையும் செய்பவரைக் குறிக்கிறது. பன்மையான 'பாதைகள்' என்பதோடு இயல்பாக அமைய தமிழில் வகுப்பைக் குறிக்கும் பன்மை பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: שָׁמַרְתִּי உடைய உட்பொருள்
  choice: தேவனுடைய பேச்சின் வழியாகச் சங்கீதக்காரர் வன்முறையாளர்களின் வழிகளிலிருந்து தன்னைக் காத்துக்கொண்டார்.
  alternative: அவர் வன்முறையாளர்களின் பாதைகளைக் கவனித்தார் அல்லது அவற்றைக் காவல் காத்தார்.
  rationale: שׁמר என்பதற்கு 'காத்தல்' மற்றும் 'கவனித்தல்/கடைப்பிடித்தல்' ஆகிய பொருள்கள் உண்டு. இச்சங்கீதத்தில் நேர்மையை உரிமைகோரும் சூழலும், தேவனுடைய வார்த்தை அதற்கான கருவியாகக் கூறப்படுவதும் தவிர்த்தல் என்ற பொருளை வலுப்படுத்துகின்றன. எனினும் மூலத்தின் உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. 'உமது' மற்றும் 'உதடுகளின் வார்த்தை' ஆகியவை சங்கீதத்தின் உயர்ந்த கவித்துவத் தொனியைத் தக்கவைக்கின்றன; வாக்கியம் சாதாரண வாசகருக்கும் தெளிவாக அமைக்கப்பட்டுள்ளது.
