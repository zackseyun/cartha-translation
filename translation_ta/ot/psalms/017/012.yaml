  yaml_path: translation/ot/psalms/017/012.yaml
  text: He is like a lion eager to tear[c][b][a], like a young lion sitting in hiding places.
translation:
  language: ta
  text: 'அவன் இரையைக் கிழிக்க ஆவல்கொள்ளும் சிங்கத்தைப் போன்றவன்[a]; மறைவிடங்களில் பதுங்கியிருக்கும்[b] இளஞ்சிங்கத்தைப் போன்றவன்.


    [a] எபிரெயச் சொற்றொடரைச் சொல்லுக்குச் சொல் மொழிபெயர்த்தால், “அவனுடைய சாயல் சிங்கத்தைப் போன்றது” என வரும்.


    [b] சொல்லுக்குச் சொல்: “மறைவிடங்களில் அமர்ந்திருக்கும்.” இந்தச் சூழலில் அது இரைக்காகப் பதுங்கியிருப்பதைக் குறிக்கிறது.'
  philosophy: optimal-equivalence
