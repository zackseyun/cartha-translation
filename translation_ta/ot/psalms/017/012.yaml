lexical_decisions:
- source_word: דִּמְיֹנוֹ
  choice: அவன் ... போன்றவன்
  rationale: דמיון என்பது ‘ஒப்புமை/சாயல்’ என்பதைக் குறிக்கும் பெயர்ச்சொல். தமிழில் ‘அவனுடைய சாயல் சிங்கத்தைப் போன்றது’ என்பது சாத்தியமானாலும் சற்றுச் செயற்கையாக இருப்பதால், ஒப்புமையின் பொருளை இயல்பாக வெளிப்படுத்த நேரடி ஒப்பீடு பயன்படுத்தப்பட்டது; பெயர்ச்சொல் அமைப்பு அடிக்குறிப்பில் தரப்பட்டது.
- source_word: כְּאַרְיֵה
  choice: சிங்கத்தைப் போன்றவன்
  rationale: כְּ என்ற ஒப்புமை முன்னொட்டையும் אַרְיֵה என்ற ‘சிங்கம்’ பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִכְסוֹף
  choice: ஆவலாயிருக்கும்
  rationale: כסף இங்கு வலுவான விருப்பம் அல்லது ஏக்கத்தைக் குறிக்கிறது. வேட்டையாடும் சிங்கத்தின் சூழலில் ‘ஆவலாயிருக்கும்’ என்பது தீவிர விருப்பத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: לִטְרוֹף
  choice: இரையைக் கிழிக்க
  rationale: טרף விலங்கு இரையைப் பிடித்துக் கிழிப்பதைக் குறிக்கிறது. தமிழில் செயற்பாட்டின் கொடூரத் தெளிவையும் இரைச்சூழலையும் காக்க ‘இரையைக் கிழிக்க’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְכִכְפִיר
  choice: இளஞ்சிங்கத்தைப் போன்றவன்
  rationale: כפיר என்பது இளஞ்சிங்கம். இணைப்பும் இரண்டாவது ஒப்புமையும் அரைப்புள்ளிக்குப் பிந்தைய இணை அமைப்பில் இயல்பாக வெளிப்படுகின்றன.
- source_word: יֹשֵׁב
  choice: பதுங்கியிருக்கும்
  rationale: ישב என்பதன் அடிப்படைப் பொருள் ‘அமர்ந்திருத்தல்/தங்கியிருத்தல்.’ ஆனால் மறைவிடத்தில் காத்திருக்கும் வேட்டை விலங்கின் சூழலில் ‘பதுங்கியிருக்கும்’ என்பது நோக்கப்பட்ட காட்சியை இயல்பாகத் தருகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: בְּמִסְתָּרִים
  choice: மறைவிடங்களில்
  rationale: מסתרים என்பது மறைக்கப்பட்ட அல்லது இரகசியமான இடங்களைக் குறிக்கும் பன்மைச்சொல். ‘மறைவிடங்களில்’ அதன் பன்மையையும் வேட்டைப் பதுங்கலின் சூழலையும் தெளிவாகக் காக்கிறது.
