    issue: The expression “ஆவலாயிருக்கும் சிங்கம்” is slightly awkward in modern Tamil.
    rationale: For a lion intensely desiring to tear prey, “ஆவல்கொள்ளும்” is the more idiomatic verbal collocation and does not alter the source sense.
