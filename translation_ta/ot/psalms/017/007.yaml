  text: הַפְלֵ֣ה חֲ֭סָדֶי/ךָ מוֹשִׁ֣יעַ חוֹסִ֑ים מִ֝/מִּתְקוֹמְמִ֗ים בִּֽ/ימִינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/007.yaml
  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
translation:
  language: ta
  text: உமது வியத்தகு மாறாத அன்பை வெளிப்படுத்தும்[a]; தங்களுக்கு எதிராக எழும்புகிறவர்களிடமிருந்து உம்மிடம் அடைக்கலம் புகுவோரை உமது வலக்கையால்[b] காப்பவரே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது மாறாத அன்பை வியத்தகுமாறு செய்யும்.” எபிரெயக் கட்டளை வினை, ஒன்றை வியத்தகுவதாகக் காட்டுதல் அல்லது தனிச்சிறப்புடையதாகச் செய்தல் என்ற இரு நுணுக்கங்களையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: இறுதித் தொடரை “உமது வலக்கையில் அடைக்கலம் புகுவோர்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  choice: வியத்தகு ... வெளிப்படுத்தும்
  rationale: פלא என்பதன் ஹிஃபில் கட்டளை வடிவம் ஒன்றை வியத்தகுமாறு காட்டுதல் அல்லது தனிச்சிறப்புடையதாகச் செய்தல் என்ற பொருளைத் தரலாம். வேண்டுதல் சூழலில், கடவுள் தமது அன்பை அற்புதமான விதத்தில் வெளிப்படுத்த வேண்டும் என்ற இயல்பான தமிழை இது தருகிறது.
- source_word: חֲסָדֶיךָ
  choice: உமது ... மாறாத அன்பை
  rationale: חסד என்பது இரக்கம், உண்மைத்தன்மை, உறுதியான பற்றுறுதி ஆகியவற்றை உள்ளடக்கியது. 'மாறாத அன்பு' என்பது அதன் நிலைத்த விசுவாசத்தை நவீன தமிழில் இயல்பாக எடுத்துரைக்கிறது; உடன்படிக்கை என்ற சொல்லை மூலத்தில் வெளிப்படையாக இல்லாத இடத்தில் சேர்ப்பதையும் தவிர்க்கிறது.
- source_word: מוֹשִׁיעַ
  choice: காப்பவரே
  rationale: இப்பெயரெச்சம் கடவுளை நேரடியாக அழைக்கும் விளிவடிவப் பொருளில் வருகிறது. 'காப்பவரே' என்பது அந்த அழைப்பையும் தொடர்ச்சியான மீட்புச் செயலையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: חוֹסִים
  choice: அடைக்கலம் புகுவோரை
  rationale: חסה என்பது பாதுகாப்புக்காக அடைக்கலம் தேடுதல் அல்லது புகுதல் என்ற உருவகத்தைத் தருகிறது. வெறும் 'நம்புவோர்' என்பதைவிட 'அடைக்கலம் புகுவோர்' அந்தத் தெளிவான பாதுகாப்பு உருவகத்தைப் பேணுகிறது.
- source_word: מִמִּתְקוֹמְמִים
  choice: தங்களுக்கு எதிராக எழும்புகிறவர்களிடமிருந்து
  rationale: קום என்பதன் இவ்வடிவம் பகைமையுடன் எழும்புதலைக் குறிக்கிறது; מן விடுவிக்கப்படும் அபாயத்தின் மூலத்தைக் குறிக்கிறது. எதிர்ப்பின் இலக்கு எபிரெயத்தில் வெளிப்படையாகக் கூறப்படாததால், உடனுள்ள 'அடைக்கலம் புகுவோர்' என்பதைக் கொண்டு 'தங்களுக்கு எதிராக' என இயல்பாகத் தரப்பட்டுள்ளது.
- source_word: בִּימִינֶךָ
  choice: உமது வலக்கையால்
  rationale: 'ב இங்கு கருவி அல்லது வழிமுறையைக் குறிப்பதாக வாசிக்கப்படுகிறது: கடவுள் தமது வலக்கையால் காப்பவர். இது தெய்வீக வல்லமையைக் குறிக்கும் மனித உறுப்புருவகத்தையும் பேணுகிறது.'
theological_decisions:
- issue: இறுதியில் வரும் בִּימִינֶךָ என்பதன் தொடர்பு
  choice: '''உமது வலக்கையால் காப்பவரே'' என்று கடவுளின் காப்புச் செயலுடன் இணைத்தல்'
  alternative: '''உமது வலக்கையில் அடைக்கலம் புகுவோர்'' என்று அடைக்கலம் புகுவோருடன் இணைத்தல்; அல்லது ''உமது வலக்கைக்கு எதிராக எழும்புவோர்'' என்று எதிரிகளுடன் இணைத்தல்'
  rationale: இறுதி முன்னிடைச்சொல் தொடர் எதனுடன் இணைகிறது என்பது எபிரெயச் சொல்வரிசையில் முழுமையாகத் தீர்மானிக்கப்படவில்லை. சூழலில் கடவுள் தமது வலக்கையால் காப்பார் என்பது மிக இயல்பான முதன்மை வாசிப்பு; உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் வேண்டுதல் நடையும் பேணப்பட்டுள்ளன. 'உமது/உம்மிடம்' என்ற வடிவங்கள் கடவுளை நேரடியாக அழைக்கும் கவிதைநடைக்கு ஏற்றவை. அரிதான சமயத் தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
