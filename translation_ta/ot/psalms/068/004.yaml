source:
  edition: WLC
  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
translation:
  language: ta
  text: 'கடவுளுக்குப் பாடுங்கள்;

    அவருடைய பெயரைப் புகழ்ந்து பாடுங்கள்.


    வறண்ட சமவெளிகளின் வழியே பயணிப்பவருக்காகப் பாதையை ஆயத்தப்படுத்துங்கள்[a][b];

    “யா” அவருடைய பெயர்;

    அவர் முன்னிலையில் மகிழுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய வினைச்சொல், ‘பாதையை மேடாக்குங்கள்’ அல்லது ‘பாதையை ஆயத்தப்படுத்துங்கள்’ என்றும் பொருள்படும். சிலர் இங்குள்ள கவிதை இணைப்பை முன்னிட்டு, ‘அவருக்குப் பாடலை உயர்த்திப் பாடுங்கள்’ என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘மேகங்களின்மேல்.’ எபிரேயச் சொல்லின் வழக்கமான பொருள் ‘வறண்ட சமவெளிகள்’; ஆனால் சிலர் இதை மேகங்களின்மேல் பயணிக்கும் தெய்வீகத் தோற்றமாகப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  choice: கடவுளுக்குப் பாடுங்கள்
  rationale: பன்மை ஏவல் வினையின் நேரடியான அழைப்பையும், இச்சூழலில் אֱלֹהִים இஸ்ரவேலின் ஒரே கடவுளைக் குறிப்பதையும் தெளிவாகக் காக்கிறது.
- source_word: זַמְּרוּ שְׁמוֹ
  choice: அவருடைய பெயரைப் புகழ்ந்து பாடுங்கள்
  rationale: זמר என்பதன் இசையோடு கூடிய புகழ்ச்சிப் பொருளையும், שְׁמוֹ என்ற நேரடி பொருளையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: סֹלּוּ
  choice: பாதையை அமைத்திடுங்கள்
  rationale: סלל என்பதன் அடிப்படைப் பொருள் பாதையை மேடாக்குதல் அல்லது ஆயத்தப்படுத்துதல். அடுத்துவரும் தெய்வீகப் பயண உருவகத்தோடு இது நேரடியாகப் பொருந்துவதால், ‘பாடலை உயர்த்துங்கள்’ என்று விளக்கமாக மாற்றாமல் மூல உருவகம் காக்கப்படுகிறது.
- source_word: לָרֹכֵב בָּעֲרָבוֹת
  choice: வறண்ட சமவெளிகளின் வழியாகச் சவாரி செய்கிறவருக்கு
  rationale: רכב என்பதன் நிகழ்காலப் பங்கேற்பு வடிவம் ‘சவாரி செய்கிறவர்’ எனவும், עֲרָבוֹת என்பதன் வழக்கமான நிலவியல் பொருள் வறண்ட சமவெளிகள் எனவும் வழங்கப்படுகிறது. בְּ இங்கு இயக்கத்தின் சூழலில் ‘வழியாக’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: בְּיָהּ שְׁמוֹ
  choice: “யா” என்பது அவருடைய பெயர்
  rationale: יָהּ என்பது தெய்வீகப் பெயரின் குறுவடிவம்; அதை ஒரு பட்டப்பெயராக மாற்றாமல் தமிழில் ‘யா’ என்று ஒலிபெயர்ப்பது மூல வடிவின் தனித்தன்மையைக் காக்கிறது.
- source_word: וְעִלְזוּ לְפָנָיו
  choice: அவருக்கு முன்பாகக் களிகூருங்கள்
  rationale: עלז குறிக்கும் மிகுந்த மகிழ்ச்சியையும், לְפָנָיו என்பதன் முன்னிலை உறவையும் dignified, இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יָהּ என்ற குறுவடிவத் தெய்வீகப் பெயரை வழங்குதல்
  choice: யா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் முழு நான்கெழுத்துப் பெயரான יְהוָה அல்ல, தனித்த குறுவடிவமான יָהּ உள்ளது. எனவே பொதுவான பட்டப்பெயரைப் பயன்படுத்தாமல் பெயரை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: தெய்வீகச் சவாரியின் இடம் குறித்த உருவகம்
  choice: வறண்ட சமவெளிகள்
  alternative: மேகங்கள்
  rationale: עֲרָבוֹת என்பதன் வழக்கமான எபிரேயப் பொருள் வறண்ட நிலங்கள் அல்லது சமவெளிகள். எனினும் மேகங்களின்மேல் சவாரி செய்யும் தெய்வீகத் தோற்றமாக வாசிக்கும் பழமையான விளக்க வாய்ப்பு இருப்பதால் அது அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்குரிய உயர்வும் பொதுவாசகருக்கான தெளிவும் சமநிலைப்படுத்தப்பட்டுள்ளன. இணையான ஏவல் வாக்கியங்கள் சுருக்கமாக வைக்கப்பட்டுள்ளன; ‘சவாரி செய்கிறவர்,’ ‘களிகூருங்கள்’ ஆகிய சொற்கள் கவிதைமிக்க கண்ணியத்தைத் தக்கவைக்கின்றன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடருக்குப் பின்னரே வைக்கப்பட்டுள்ளன.
