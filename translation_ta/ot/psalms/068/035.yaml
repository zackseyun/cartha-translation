  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
translation:
  language: ta
  text: உமது பரிசுத்த இடங்களிலிருந்து கடவுள் அச்சமும் வியப்பும் ஊட்டுபவராய் இருக்கிறார்[a]; இஸ்ரவேலின் கடவுளாகிய அவரே மக்களுக்கு வலிமையையும் பேராற்றலையும் அளிக்கிறார். கடவுள் போற்றப்படுவாராக!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உமது பரிசுத்த இடத்திலிருந்து” அல்லது “உமது பரிசுத்த இடத்தில்” என்றும் பொருள் கொள்ளலாம். எபிரெயத்தில் “உமது பரிசுத்த இடங்களிலிருந்து” என்று பன்மை வடிவம் உள்ளது; அது கடவுளின் பரிசுத்த உறைவிடத்தை மாட்சிமைப் பன்மையாகவோ தொகுப்புப் பொருளிலோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹרָא
  choice: அச்சமும் வியப்பும் அளிப்பவர்
  rationale: இச்சொல் பயபக்தியையும் வியப்பையும் தூண்டும் இறைமாட்சியைக் குறிக்கிறது; ‘பயங்கரமானவர்’ என்பது நவீனத் தமிழில் தவறான எதிர்மறைப் பொருளைத் தரக்கூடும்.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இலக்கண வடிவம் பன்மையாக இருந்தாலும், இஸ்ரவேலின் ஒரே கடவுளையே குறிக்கிறது.
- source_word: מִמִּקְדָּשֶׁיךָ
  choice: உமது பரிசுத்த இடங்களிலிருந்து
  rationale: எபிரெயச் சொல் இரண்டாம் நபர் ஒருமை உடைமை விகுதியுடன் உருவில் பன்மையாகவும், מִן என்பதால் ‘இருந்து’ என்ற பொருளுடனும் உள்ளது; எனவே இரண்டையும் முதன்மை உரையில் காக்கிறது.
- source_word: אֵל יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: முன் குறிப்பிடப்பட்ட கடவுளை இஸ்ரவேலின் கடவுள் என்று அடையாளப்படுத்தும் பெயரிணை அமைப்பு.
- source_word: הוּא
  choice: அவரே
  rationale: வெளிப்படையாக உள்ள வலியுறுத்தும் பிரதிப்பெயரை இயல்பான தமிழில் ‘அவரே’ எனக் காட்டுகிறது.
- source_word: נֹתֵן
  choice: அளிக்கிறார்
  rationale: வழக்கமாக அல்லது தொடர்ச்சியாகச் செய்யும் செயலைக் குறிக்கும் எபிரெயப் பங்கேற்பு வடிவத்தை நிகழ்காலமாகத் தருகிறது.
- source_word: עֹז
  choice: வலிமை
  rationale: உடல், மனம் அல்லது செயல் ஆற்றலைக் குறிக்கும் பொதுவான பொருளை நேரடியாகத் தருகிறது.
- source_word: וְתַעֲצֻמוֹת
  choice: பேராற்றல்
  rationale: மிகுந்த வல்லமையைக் குறிக்கும் தீவிரத்தைப் பாதுகாத்து, முந்தைய ‘வலிமை’ என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: לָעָם
  choice: மக்களுக்கு
  rationale: எபிரெயத்தில் உடைமைச் சொல் இல்லாததால் ‘தம் மக்களுக்கு’ என்று சேர்க்காமல், உள்ளபடியே தருகிறது.
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: கடவுளை வாழ்த்திப் போற்றும் நிறைவு முழக்கத்தை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘பரிசுத்த இடங்கள்’ என்பதன் எண்ணும் பொருளும்
  choice: உமது பரிசுத்த இடங்களிலிருந்து
  alternative: உமது பரிசுத்த இடத்திலிருந்து; உமது பரிசுத்த இடத்தில்
  rationale: மசோரெட்டிக் எபிரெய வடிவம் உருவியல் ரீதியாகப் பன்மையாகவும் முன்னிடைச்சொல் ‘இருந்து’ என்ற பொருளுடனும் உள்ளது. அது இறைவனின் ஒரே பரிசுத்த உறைவிடத்தை மாட்சிமைப் பன்மையில் அல்லது தொகுப்புப் பொருளில் குறிக்கலாம் என்பதால், அந்த மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘உமது’, ‘அவரே’, ‘போற்றப்படுவாராக’ ஆகியவை சங்கீதத்தின் இறைமாட்சியையும் வாழ்த்துரைத் தொனியையும் காக்கின்றன; அரிதான சமயத் தொழில்நுட்பச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
