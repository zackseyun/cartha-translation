id: PSA.68.3
reference: Psalms 68:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְֽ/צַדִּיקִ֗ים יִשְׂמְח֣וּ יַֽ֭עַלְצוּ לִ/פְנֵ֥י אֱלֹהִ֗ים וְ/יָשִׂ֥ישׂוּ בְ/שִׂמְחָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/003.yaml
  text: But the righteous will be glad[a]; they will exult before God[b], and they will rejoice with gladness.
translation:
  language: ta
  text: ஆனால் நீதிமான்கள் மகிழ்வார்கள்[a]; கடவுளின் முன்னிலையில்[b] களிகூர்வார்கள்; மகிழ்ச்சியுடன் அகமகிழ்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீதிமான்களோ மகிழ்வார்கள்.’ எபிரெய இணைப்புச்சொல் எளிமையாக ‘மேலும்’ என்றும் பொருள்படலாம்; முதன்மைப் பாடத்திலுள்ள ‘ஆனால்’ முந்தைய வசனத்துடனான முரண்பாட்டை வெளிப்படுத்துகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில், ‘கடவுளுக்கு முன்பாக’; அதாவது, கடவுளின் சந்நிதியில்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַדִּיקִים
  choice: ஆனால் நீதிமான்கள்
  rationale: צַדִּיקִים என்பது நீதியுள்ள மக்களைக் குறிக்கிறது. முந்தைய வசனத்தில் கூறப்பட்டவர்களுடன் உள்ள முரண்பாட்டை வְ இங்கு சுட்டுவதால், இயல்பான தமிழில் ‘ஆனால்’ என வழங்கப்பட்டது; அதன் எளிய பொருளான ‘மேலும்/நீதிமான்களோ’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִשְׂמְחוּ
  choice: மகிழ்வார்கள்
  rationale: שׂמח மகிழ்ச்சியைக் குறிக்கிறது. வசனத்தில் தொடரும் மூன்று மகிழ்ச்சி வினைகளின் வேறுபாட்டை ஓரளவு காக்கும் நேரடியான, இயல்பான தமிழ்.
- source_word: יַעַלְצוּ
  choice: களிகூர்வார்கள்
  rationale: עלץ மிகுந்த, பொங்கும் மகிழ்ச்சியை வெளிப்படுத்துகிறது; ‘களிகூர்வார்கள்’ அதன் உயர்ந்த வலிமையையும் சங்கீத நடையையும் இயல்பாகக் காக்கிறது.
- source_word: לִפְנֵי אֱלֹהִים
  choice: கடவுளின் முன்னிலையில்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘கடவுளுக்கு முன்பாக/கடவுளின் முன்னிலையில்’ எனப் பொருள்படும். இங்கு ‘முன்னிலையில்’ என்பது அவரது சந்நிதி அல்லது இருப்பைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וְיָשִׂישׂוּ
  choice: அகமகிழ்வார்கள்
  rationale: שׂוש என்பது ஆழ்ந்த அல்லது ஆர்வமிக்க மகிழ்ச்சியைக் குறிக்கிறது. ‘அகமகிழ்வார்கள்’ முன்வரும் ‘மகிழ்வார்கள்’, ‘களிகூர்வார்கள்’ என்பவற்றோடு முற்றிலும் ஒன்றாக்காமல் அதன் மகிழ்ச்சி நுணுக்கத்தை வெளிப்படுத்துகிறது.
- source_word: בְשִׂמְחָה
  choice: மகிழ்ச்சியுடன்
  rationale: בְ இங்கு விதம் அல்லது நிலையில் நிகழ்வதைக் குறிக்கிறது; שִׂמְחָה மகிழ்ச்சி. ‘மகிழ்ச்சியுடன்’ என்பது எபிரெய மூலத்தின் மகிழ்ச்சிச் சொற்களின் வலியுறுத்தும் அடுக்கை இயல்பான தமிழில் காக்கிறது.
