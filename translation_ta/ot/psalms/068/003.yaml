translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்குரிய கண்ணியமான உயர்நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் அடுக்கிவரும் மூன்று மகிழ்ச்சி வினைகளையும் ஒரே சொல்லாகச் சுருக்காமல் ‘மகிழ்வார்கள்—களிகூர்வார்கள்—அகமகிழ்வார்கள்’ என வேறுபடுத்தி, கவிதை வலியுறுத்தல் காக்கப்பட்டுள்ளது.
