base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/010.yaml
  text: Your creatures settled in it; in your goodness[a], O God, you provided for the poor.
translation:
  language: ta
  text: உமது உயிரினங்கள்[a] அதில் குடியேறின; தேவனே, உமது நன்மையால் ஏழைக்கு வேண்டியதை நீர் ஆயத்தப்படுத்தினீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்குள்ள எபிரெயச் சொல் பொருள் காண்பதற்குக் கடினமானது; இதை “உமது உயிருள்ள படைப்புகள்,” “உமது மக்கள் கூட்டம்,” அல்லது “உமது சபை” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  choice: உமது உயிரினங்கள்
  rationale: חיה என்பதன் அடிப்படைப் பொருள் உயிருள்ள ஒன்று அல்லது விலங்கு. இங்கு அது ஒரு கூட்டத்தைக் குறிக்கக்கூடிய கவிதைச்சொல்லாக உள்ளது. ‘உமது உயிரினங்கள்’ என்பது அதன் பரந்த, உயிருள்ளவை என்ற பொருளைத் தக்கவைக்கிறது; மனிதக் கூட்டத்தையோ விலங்குகளையோ மட்டும் என்று தீர்மானிக்கவில்லை. மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: יָשְׁבוּ בָהּ
  choice: அதில் குடியேறின
  rationale: ישב என்பது அமர்தல், குடியிருத்தல், குடியேறுதல் ஆகிய பொருள்களைக் கொண்டது. முந்தைய சூழலில் குறிப்பிடப்பட்ட நிலம் அல்லது உரிமைப் பகுதியில் வாழத் தொடங்கியதைக் ‘குடியேறின’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תָּכִין
  choice: நீர் ஆயத்தப்படுத்தினீர்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் ஆயத்தப்படுத்துதல், நிலைநிறுத்துதல், தயார்செய்தல் என்று பொருள்படும். ‘ஏழைக்கு வேண்டியதை’ என்பதுடன் சேர்த்து வழங்கியிருப்பதை உணர்த்தினாலும், எபிரெய வினையின் அடிப்படைப் பொருளை ‘ஆயத்தப்படுத்தினீர்’ நெருக்கமாகக் காக்கிறது.
- source_word: בְּטוֹבָתְךָ
  choice: உமது நன்மையால்
  rationale: טובה என்பது நன்மை, தயவு அல்லது வளமான கொடை என்பதைக் குறிக்கலாம். בְּ முன்னொட்டின் கருவி அல்லது மூலப் பொருளை ‘நன்மையால்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֶעָנִי
  choice: ஏழைக்கு
  rationale: עני என்பது ஏழை, துன்புறுகிறவர், தேவையுள்ளவர் என்று பொருள்படலாம். இங்கு தேவன் அளிக்கும் ஏற்பாட்டின் சூழலில் ‘ஏழைக்கு’ நேரடியும் இயல்புமான மொழிபெயர்ப்பு.
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: வசனத்தின் முடிவில் இது நேரடி அழைப்பாக வருகிறது. தமிழ் கவிதைநடையில் ‘தேவனே’ அந்த விளிவேற்றுமையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கடினமான கவிதைச் சூழலில் חַיָּתְךָ என்பதன் குறிப்பு
  choice: விலங்குகள் அல்லது மனிதக் கூட்டம் என்று குறுக்காமல், பரந்த பொருளில் ‘உமது உயிரினங்கள்’
  alternative: உமது மக்கள் கூட்டம் / உமது சபை / உமது உயிருள்ள படைப்புகள்
  rationale: மூலச்சொல் உயிருள்ளவற்றைக் குறித்தாலும், இச்சூழலில் தேவனுடைய மக்கள் அல்லது அவருடைய கூட்டத்தைக் கூட்டுப்பெயராகக் குறிக்கலாம். பிரதான உரை சொல்லின் அடிப்படைப் பரப்பைத் தக்கவைக்கிறது; உண்மையான தெளிவின்மையை அடிக்குறிப்பு வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும் மரியாதைத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. சங்கீதத்தின் நேரடி அழைப்புத் தன்மைக்காக ‘தேவனே’ என்றும், கடவுளைக் குறிக்கும் முன்னிலைப் பன்மை மரியாதைக்காக ‘நீர்/உமது’ என்றும் அமைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி தெளிவின்மை உள்ள ‘உயிரினங்கள்’ என்பதற்குப் பின்னரே வைக்கப்பட்டுள்ளது.
