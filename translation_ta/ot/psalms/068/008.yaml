revisions:
- from: பூமி அதிர்ந்தது; வானங்களும் கடவுளின் முன்னிலையில் மழை பொழிந்தன; இந்தச் சீனாயும் கடவுளின் முன்னிலையில்—இஸ்ரவேலின் கடவுளின் முன்னிலையில்—அதிர்ந்தது.[a]
  to: பூமி அதிர்ந்தது; கடவுளின் முன்னிலையில் வானங்களும் சொட்டின—இந்தச் சீனாய்—இஸ்ரவேலின் கடவுளான கடவுளின் முன்னிலையில்.
  rationale: The revision removes the unsupported assertion that Sinai itself trembled and preserves the Hebrew’s compact, ambiguous appositional phrase, in line with the English POB audit text. It also renders “the heavens dripped” with “வானங்களும் சொட்டின,” avoiding the more specific “rain poured.”
