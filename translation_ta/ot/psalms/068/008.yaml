source:
  edition: WLC
  text: אֶ֤רֶץ רָעָ֨שָׁה אַף שָׁמַ֣יִם נָטְפוּ֮ מִ/פְּנֵ֪י אֱלֹ֫הִ֥ים זֶ֥ה סִינַ֑י מִ/פְּנֵ֥י אֱ֝לֹהִ֗ים אֱלֹהֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/008.yaml
  text: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
translation:
  language: ta
  text: பூமி அதிர்ந்தது; கடவுளின் முன்னிலையில் வானங்களும் சொட்டின—இந்தச் சீனாய்—இஸ்ரவேலின் கடவுளான கடவுளின் முன்னிலையில்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָשָׁה
  choice: அதிர்ந்தது
  rationale: நிலம் குலுங்குவதைக் குறிக்கும் எபிரேய வினையின் இயல்பான, நேரடியான தமிழ் இணை.
- source_word: נָטְפוּ
  choice: மழை பொழிந்தன
  rationale: அடிப்படைப் பொருள் ‘சொட்டின/வடிந்தன’; வானங்கள் எழுவாயாக வருவதால், இங்கு மழை பொழிவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: זֶה סִינַי
  choice: இந்தச் சீனாயும் … அதிர்ந்தது
  rationale: ‘இந்தச் சீனாய்’ என்ற சுட்டுத்தொடரைப் பாதுகாத்து, எபிரேயக் கவிதையின் துண்டிக்கப்பட்ட அமைப்பில் மறைந்துள்ள வினையை தமிழில் தெளிவாக்குகிறது.
- source_word: מִפְּנֵי
  choice: முன்னிலையில்
  rationale: ‘முகத்திற்கு முன்பாக/சந்நிதியில்’ என்ற பொருளை மரியாதையான நவீன தமிழில் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இவ்வசனத்தில் இஸ்ரவேலின் கடவுளைக் குறிக்கும் பொதுவான தெய்வப்பெயருக்கான இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: ‘இந்தச் சீனாய்’ என்பதன் தொடரியல் தொடர்பு
  choice: சீனாயையும் அதிர்ந்ததாகக் கொண்டு, மறைந்த வினையை வெளிப்படையாகச் சேர்த்தல்
  alternative: ‘கடவுளின் முன்னிலையில்—இந்தச் சீனாய்—’ என்று இடைச்செருகலாக மட்டும் வைத்தல்
  rationale: எபிரேய வாசகம் சுருக்கமானதும் தொடரியல் ரீதியாகக் கடினமானதும் ஆகும். நீதிபதிகள் 5:5 போன்ற கவிதைச் சான்றின் அடிப்படையில் சீனாய் அதிர்ந்தது/குலுங்கியது என்பது சாத்தியம்; எனினும் வேறுபட்ட பகுப்பாய்வு இருப்பதால் அடிக்குறிப்பில் ambiguity பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; கவிதைத் தன்மையும் மரியாதையான தொனியும் காக்கப்பட்டுள்ளன. ‘சந்நிதி’ என்பதற்குப் பதில் பொதுவாகப் புரியும் ‘முன்னிலை’ பயன்படுத்தப்பட்டது. ‘வானங்கள்’ என்ற பன்மை மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
