lexical_decisions:
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: இது இங்கு கடவுளைக் குறிக்கும் தெய்வீகப் பட்டம். יהוה என்பதற்குரிய தனிப்பட்ட பெயர் மரபை இதில் புகுத்தாமல், நவீனத் தமிழில் இயல்பாகவும் மரியாதையுடனும் ‘ஆண்டவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִתֶּן
  choice: தருகிறார்
  rationale: இந்த yiqtol வடிவம் நிகழ்கால, எதிர்கால அல்லது சூழல்சார் நுண்பொருளைக் கொள்ளலாம். இக்கவிதை அறிவிப்பில் நிகழ்காலப் பொருள் இயல்பாக இருப்பதால் ‘தருகிறார்’ எனத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֹמֶר
  choice: செய்தி
  rationale: இச்சொல் சொல், கூற்று, செய்தி அல்லது கட்டளை எனப் பொருள்படலாம். தமிழில் ‘சொல்லைத் தருகிறார்’ என்பது இயல்பற்றதாக இருப்பதால், அதன் பரந்த பொருளையும் கவிதைச் சுருக்கத்தையும் காக்கும் ‘செய்தி’ தேர்ந்தெடுக்கப்பட்டது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: הַמְבַשְּׂרוֹת
  choice: நற்செய்தியை அறிவிக்கும் பெண்கள்
  rationale: בשׂר வேரிலிருந்து வந்த இப்பன்மைப் பங்கேற்புவினை வடிவம் பெண்பாலைக் குறிக்கிறது; ஆகவே பாலினக் குறிப்பை நீக்காமல் ‘பெண்கள்’ என்று வெளிப்படையாக மொழிபெயர்க்கப்பட்டுள்ளது. வேரின் நல்ல செய்தியை அறிவித்தல் என்ற பொருளும் காக்கப்பட்டுள்ளது.
- source_word: צָבָא
  choice: படை
  rationale: צָבָא என்பதற்கு படை, சேனை அல்லது பெருந்திரள் என்ற பொருள்கள் உண்டு. சங்கீதத்தின் சுற்றியுள்ள போர் மற்றும் வெற்றி உருவகத்தைப் பாதுகாக்க ‘படை’ தேர்ந்தெடுக்கப்பட்டது; இது பெண்களால் ஆன பெரிய அணியையும் குறிக்க முடியும்.
- source_word: רָב
  choice: பெரும்
  rationale: இது படையின் அளவு அல்லது எண்ணிக்கை மிகுதியைக் குறிக்கிறது. ‘பெரும் படை’ என்பது இயல்பான, வலிமையான தமிழ்ச் சொற்றொடர்.
theological_decisions:
- issue: הַמְבַשְּׂרוֹת என்ற சொல்லின் பெண்பால் பன்மை
  choice: ‘நற்செய்தியை அறிவிக்கும் பெண்கள்’ என்று பெண்பாலை வெளிப்படையாகக் காட்டுதல்
  alternative: ‘நற்செய்தியை அறிவிப்பவர்கள்’ அல்லது ‘தூதர்கள்’
  rationale: எபிரெய வடிவத்தில் பெண்பால் இலக்கணக் குறி தெளிவாக உள்ளது. அதை பாலினப் பொதுமைப்படுத்தலால் மறைக்காமல் மொழியில் வெளிப்படுத்துவது மூலத்தின் இலக்கிய அம்சத்தைப் பாதுகாக்கிறது; இதற்கு மேலான கோட்பாட்டுத் தீர்மானம் எதுவும் சேர்க்கப்படவில்லை.
- issue: צָבָא என்பதில் உள்ள இராணுவ உருவகம்
  choice: ‘பெரும் படை’
  alternative: ‘பெருந்திரள்’ அல்லது ‘பெருங்கூட்டம்’
  rationale: சூழலில் வெற்றி மற்றும் எதிரி அரசர்களின் ஓட்டம் இடம்பெறுவதால் இராணுவ நுண்பொருள் பொருத்தமானது. ஆயினும் இது கட்டாயமாகப் போரிடும் படையையே குறிக்க வேண்டியதில்லை என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நற்செய்தி’ இங்கு பிற்காலத் தொழில்நுட்ப இறையியல் சொல்லாக அல்லாமல், בשׂר என்பதன் ‘நல்ல செய்தியை அறிவித்தல்’ என்ற நேரடிப் பொருளில் வருகிறது. எபிரெயத்தின் சுருக்கமான இரண்டாம் அரையடியைத் தக்கவைக்க ‘இருக்கிறார்கள்’ போன்ற இணைப்புவினை சேர்க்கப்படவில்லை.
