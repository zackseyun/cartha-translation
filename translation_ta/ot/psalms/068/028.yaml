  text: צִוָּ֥ה אֱלֹהֶ֗י/ךָ עֻ֫זֶּ֥/ךָ עוּזָּ֥/ה אֱלֹהִ֑ים ז֝֗וּ פָּעַ֥לְתָּ לָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/028.yaml
  text: Your God has commanded your strength. Show strength[a], O God, you who have worked for us.
translation:
  language: ta
  text: உன் தேவன் உன் வலிமையைக் கட்டளையிட்டுள்ளார். தேவனே, எங்களுக்காகச் செயலாற்றிய நீர், வலிமையைக் காட்டும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வலிமையைக் காட்டும்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரேயச் சொல் பொருள்கொள்வதற்குக் கடினமானது. இதை ‘தேவனே, வலிமையுள்ளவராய் இருங்கள்’ என்றும், அடுத்த வசனத்துடன் இணைத்து ‘தேவனே, எங்களுக்காக நீர் செய்ததை வலுப்படுத்தும்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  choice: கட்டளையிட்டுள்ளார்
  rationale: முற்றுவினையின் நிறைவுற்ற செயலையும் அதன் தற்போதைய பொருத்தத்தையும் காக்கிறது; அதிகாரபூர்வமான ஆணை என்ற வினை வலிமையையும் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் தேவன்
  rationale: வடிவில் பன்மையாக இருந்தாலும் இங்கு இஸ்ரவேலின் தேவனை ஒருமையில் குறிக்கிறது; இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு ‘உன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֻזֶּךָ
  choice: உன் வலிமை
  rationale: பெயர்ச்சொல்லின் ‘வலிமை/வல்லமை’ பொருளையும் இரண்டாம் நபர் உரிமையையும் நேரடியாகக் காக்கிறது.
- source_word: עוּזָּה
  choice: வலிமையைக் காட்டும்
  rationale: கடினமான இவ்வடிவத்தை, தேவன் தமது வலிமையை வெளிப்படுத்த வேண்டுமென்ற வேண்டுதலாக வாசிக்கிறது. எபிரெயத்தில் இவ்விடத்தில் உரிமைப்பெயர் இல்லாததால் தமிழிலும் ‘உமது’ சேர்க்கப்படவில்லை.
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: நேரடி அழைப்பைத் தமிழின் எட்டாம் வேற்றுமை வடிவம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זוּ
  choice: செயலாற்றிய நீர்
  rationale: தேவனை விவரிக்கும் தொடர்புச் சொல்லின் பொருளை மரியாதையான நேரடி அழைப்பில் இயல்பாகத் தருகிறது.
- source_word: פָּעַלְתָּ
  choice: செயலாற்றிய
  rationale: தேவனுடைய பயனுள்ள, நிகழ்த்தப்பட்ட செயலைப் பொதுவாகவும் நேரடியாகவும் குறிக்கிறது.
- source_word: לָּנוּ
  choice: எங்களுக்காக
  rationale: இங்குள்ள முன்னிடைச்சொல்லின் பயன்நோக்குப் பொருளைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: עוּזָּה என்ற தெளிவற்ற கட்டளை வடிவம்
  choice: 'தேவன் வலிமையை வெளிப்படுத்த வேண்டுமென்ற விண்ணப்பம்: ‘வலிமையைக் காட்டும்’'
  alternative: ‘தேவனே, வலிமையுள்ளவராய் இரும்’ அல்லது அடுத்த வசனத்துடன் இணைத்து ‘தேவனே, எங்களுக்காக நீர் செய்ததை வலுப்படுத்தும்’
  rationale: எபிரெய வடிவம் இலக்கணரீதியாகக் கடினமானது. முதன்மை உரை வசனத்திற்குள் பொருந்தும் வேண்டுதல் தன்மையைத் தருகிறது; மாற்று வாசிப்புகளை அடிக்குறிப்பு பாதுகாக்கிறது, எனவே தெளிவின்மை செயற்கையாகத் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. தேவனை நேரடியாக அழைக்கும் இடத்தில் மரியாதைக்குரிய ‘நீர்’ மற்றும் தமிழ்ச் சங்கீத நடைக்கு ஏற்ற ‘காட்டும்’ என்ற வேண்டுதல் வடிவம் பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் சுருக்கமும் இறையியல் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
