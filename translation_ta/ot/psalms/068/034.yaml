source:
  edition: WLC
  text: תְּנ֥וּ עֹ֗ז לֵֽ/אלֹ֫הִ֥ים עַֽל יִשְׂרָאֵ֥ל גַּאֲוָת֑/וֹ וְ֝/עֻזּ֗/וֹ בַּ/שְּׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/034.yaml
  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
translation:
  language: ta
  text: 'வல்லமை கடவுளுக்குரியது எனப் பறைசாற்றுங்கள்[a];

    இஸ்ரவேலின்மேல் அவருடைய மாட்சிமை விளங்குகிறது;

    வானவெளிகளில்[b] அவருடைய வல்லமை விளங்குகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேரடியாக, ‘கடவுளுக்கு வல்லமையைக் கொடுங்கள்’; இங்கு ‘கொடுங்கள்’ என்பது கடவுளுடைய வல்லமையை ஏற்றுக்கொண்டு அவருக்குரியதாக அறிவியுங்கள் என்னும் கவிதை வழக்கு.
    reason: lexical_alternative
  - marker: b
    text: ‘மேகங்களில்’ அல்லது ‘வானங்களில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ עֹז לֵאלֹהִים
  choice: வல்லமை கடவுளுக்குரியது எனப் பறைசாற்றுங்கள்
  rationale: תְּנוּ என்பதன் நேர்ப்பொருள் ‘கொடுங்கள்’ என்றாலும், இங்கு கடவுளுக்கு வல்லமையை மனிதர்கள் வழங்குகிறார்கள் என்பது பொருளல்ல; அவருடைய வல்லமையை ஏற்றுக்கொண்டு அறிவிக்குமாறு அழைக்கும் எபிரேயக் கவிதை வழக்கு. இயல்பான தமிழில் அந்தச் செயற்பாட்டை ‘பறைசாற்றுங்கள்’ வெளிப்படுத்துகிறது.
- source_word: עֹז / עֻזּוֹ
  choice: வல்லமை / அவருடைய வல்லமை
  rationale: மூலத்தின் மீளுரைப்பையும் கவிதைத் தொடர்பையும் காக்க இரு இடங்களிலும் ஒரே தமிழ்ச் சொல் பயன்படுத்தப்பட்டது.
- source_word: עַל יִשְׂרָאֵל
  choice: இஸ்ரவேலின்மேல்
  rationale: עַל இங்கு மாட்சிமை இஸ்ரவேலின்மேல் பரவியிருப்பதையோ ஆட்சி செலுத்துவதையோ குறிக்கிறது; தெளிவை மீறி ஒரு குறிப்பிட்ட விளக்கத்தைச் சேர்க்காமல் ‘மேல்’ காக்கப்பட்டது.
- source_word: גַּאֲוָתוֹ
  choice: அவருடைய மாட்சிமை
  rationale: גַּאֲוָה என்பதற்கு பெருமை, உயர்வு, மாட்சிமை என்ற பொருட்கள் உண்டு. கடவுளைப் புகழும் இச்சூழலில் ‘மாட்சிமை’ அதன் நேர்மறையான உயர்வுணர்வை இயல்பாகத் தருகிறது.
- source_word: בַּשְּׁחָקִים
  choice: வானவெளிகளில்
  rationale: שְׁחָקִים என்பது கவிதை நடையில் மேலுள்ள வானப்பரப்புகளையோ மேகங்களையோ குறிக்கலாம். ‘வானவெளிகளில்’ உயர்ந்த அண்டவெளிப் படிமத்தைக் காத்து, மேகங்கள் என்ற ஒரே பொருளுக்குள் அதைச் சுருக்கவில்லை.
theological_decisions:
- issue: மனிதர்கள் கடவுளுக்கு உண்மையில் வல்லமையை வழங்குகிறார்களா என்பதான கட்டளையின் பொருள்
  choice: ‘வல்லமை கடவுளுக்குரியது எனப் பறைசாற்றுங்கள்’ என்று வழக்குப்பொருளில் மொழிபெயர்த்தல்
  alternative: ‘கடவுளுக்கு வல்லமையைக் கொடுங்கள்’
  rationale: மூல எபிரேய வினைச்சொல் ‘கொடுங்கள்’ என்று நேரடியாகப் பொருள்பட்டாலும், புகழ்ச்சிக் கவிதையில் இது கடவுளிடம் இல்லாத ஒன்றை மனிதர்கள் வழங்குவதைக் குறிக்காமல், அவருடைய வல்லமையை ஏற்றுக்கொண்டு அறிவிப்பதைக் குறிக்கிறது.
translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், அதேவேளை சங்கீதப் புகழ்ச்சிக்கேற்ற கண்ணியமான கவிதை நடை. எபிரேயத்தின் வினையில்லா இணை வாக்கியங்கள் தமிழில் இயல்பாக அமைய ‘விளங்குகிறது’ சேர்க்கப்பட்டு, இரு அடிகளிலும் இணை அமைப்பு காக்கப்பட்டது.
