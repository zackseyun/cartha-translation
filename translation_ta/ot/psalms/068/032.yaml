lexical_decisions:
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: பூமியின் அரசுகளே
  rationale: இந்த இணைப்பு உலகெங்குமுள்ள அரசாட்சிகளை நேரடியாக அழைக்கிறது. தமிழ் அழைப்புமுறையைத் தெளிவாக்க ‘அரசுகளே’ என வழங்கப்பட்டுள்ளது.
- source_word: שִׁירוּ לֵאלֹהִים
  choice: கடவுளைப் பாடுங்கள்
  rationale: பன்மை ஏவல் வினைச்சொல்லும், பாடலின் நோக்குநராகக் கடவுளைக் குறிக்கும் ל முன்னிடைச்சொல்லும் இயல்பான தமிழில் இவ்வாறு தரப்படுகின்றன.
- source_word: זַמְּרוּ
  choice: புகழ்ந்து பாடுங்கள்
  rationale: זמר என்பதன் பியேல் வடிவம் இசையுடன் கூடிய புகழ்பாடலைக் குறிக்கிறது. ‘புகழ்ந்து பாடுங்கள்’ என்பது வழிபாட்டுச் சூழலையும் பாடுதல் என்ற முதன்மைப் பொருளையும் காக்கிறது; இசை எழுப்புதல் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: இங்கு இருப்பது יהוה அல்ல, אֲדֹנָי என்னும் தெய்வீகப் பட்டம். ஆகவே பெயராக ஒலிபெயர்க்காமல் ‘ஆண்டவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான வழிபாட்டு அல்லது இசைச் செயல்பாடு உறுதியற்றதால் விளக்கிப் பொருள் நிர்ணயிக்காமல் மரபான ஒலிபெயர்ப்பு வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אֲדֹנָי என்னும் தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவர்
  alternative: கர்த்தர்
  rationale: மூலத்தில் இங்கு நான்கெழுத்துத் திருப்பெயர் இல்லை; ‘ஆண்டவர்’ என்பது நவீன பொதுத்தமிழில் இயல்பான பட்டமாக இருந்து, יהוה என்பதற்குரிய தனித்த மொழிபெயர்ப்பை இங்கு தவறாகப் புகுத்துவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. கவிதை நடையின் இணை அமைப்பைக் காக்க இரண்டு அடிகளாக அமைக்கப்பட்டுள்ளது. அழைக்கப்படும் தரப்பைத் தெளிவாக்க ‘அரசுகளே’ என்ற விளிவடிவம் பயன்படுத்தப்பட்டுள்ளது.
