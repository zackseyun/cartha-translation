  text: יָק֣וּם אֱ֭לֹהִים יָפ֣וּצוּ אוֹיְבָ֑י/ו וְ/יָנ֥וּסוּ מְ֝שַׂנְאָ֗י/ו מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/001.yaml
  text: God rises up; his enemies are scattered[a], and those who hate him flee from before him.
translation:
  language: ta
  text: கடவுள் எழுந்தருளுகிறார்; அவருடைய பகைவர்கள் சிதறிப்போகிறார்கள்[a]; அவரை வெறுப்பவர்கள் அவர் முன்னிலையிலிருந்து ஓடிப்போகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, பாரம்பரிய வேண்டுதல் நடையைப் பின்பற்றி: “கடவுள் எழுந்தருள்வாராக; அவருடைய பகைவர்கள் சிதறிப்போவார்களாக; அவரை வெறுப்பவர்கள் அவர் முன்னிலையிலிருந்து ஓடிப்போவார்களாக.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יָקוּם
  choice: எழுந்தருளுகிறார்
  rationale: קום என்பதன் Qal imperfect 3ms வடிவம். கவிதைச் சூழலில் இது உயிரோட்டமான நிகழ்கால அறிவிப்பாகவும் வேண்டுதலாகவும் அமையலாம். முதன்மை உரையில் அறிவிப்பு நடை வைக்கப்பட்டுள்ளது; கடவுளைக் குறிக்கும் மரியாதையும் எழுந்து செயல்படும் உருவகமும் ‘எழுந்தருளுகிறார்’ என்பதில் இயல்பாக வெளிப்படுகின்றன.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், ஒருமை வினைச்சொல்லுடன் வந்து இஸ்ரவேலின் கடவுளைக் குறிப்பதால் ஒருமையாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יָפוּצוּ
  choice: சிதறிப்போகிறார்கள்
  rationale: פוץ என்பதன் Qal imperfect பன்மை. பகைவர்கள் பல திசைகளில் கலைந்து போகும் விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֹיְבָיו
  choice: அவருடைய பகைவர்கள்
  rationale: 3ms உடைமைப் பின்னொட்டைக் கொண்ட வடிவம்; அதன் உடைமைத் தொடர்பு நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: וְיָנוּסוּ
  choice: தப்பியோடுகிறார்கள்
  rationale: נוס என்பதன் Qal imperfect பன்மை. அச்சுறுத்தலிலிருந்து விலகி ஓடும் பொருளை தற்போதைய தமிழில் தெளிவாகக் கூறுகிறது.
- source_word: מְשַׂנְאָיו
  choice: அவரை வெறுப்பவர்கள்
  rationale: பெயர்ச்சொல்லாகச் செயல்படும் பங்கேற்பு வடிவத்தின் செயற்பாட்டு வலிமையைப் பாதுகாக்கிறது.
- source_word: מִפָּנָיו
  choice: அவர் முன்னிலையிலிருந்து
  rationale: நேரடியாக ‘அவருடைய முகம்/முன்னிலையிலிருந்து’ என்று பொருள்படும் எபிரெயச் சொல்லாட்சியை, கடவுளின் சந்நிதியிலிருந்து பின்வாங்கும் கருத்துடன் புரிந்துகொள்ளத்தக்க தமிழில் வழங்குகிறது.
theological_decisions:
- issue: கவிதை மற்றும் போர்த் தெய்வத்தோற்றச் சூழலில் தொடக்க imperfect வினைகளின் வலிமை
  choice: 'உயிரோட்டமான அறிவிப்பு நடை: ‘கடவுள் எழுந்தருளுகிறார்; அவருடைய பகைவர்கள் சிதறிப்போகிறார்கள்…’'
  alternative: 'வேண்டுதல் நடை: ‘கடவுள் எழுந்தருள்வாராக; அவருடைய பகைவர்கள் சிதறிப்போவார்களாக…’'
  rationale: எபிரெய imperfect வடிவங்களை இச்சூழலில் அறிவிப்பாகவும் வேண்டுதலாகவும் கேட்க முடியும். முதன்மை உரை உயிரோட்டமான அறிவிப்பைத் தேர்ந்தெடுக்கிறது; உண்மையான இலக்கணத் தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. ‘எழுந்தருளுகிறார்’ மரியாதைநடையையும் கடவுள் எழுந்து செயல்படும் மூல உருவகத்தையும் இணைக்கிறது. பிரதான உரையிலும் மாற்று அடிக்குறிப்பிலும் வினைநடை தொடர்ச்சியாக வைக்கப்பட்டுள்ளது.
