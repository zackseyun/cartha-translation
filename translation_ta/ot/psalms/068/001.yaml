- from: கடவுள் எழுந்தருளுகிறார்; அவருடைய பகைவர்கள் சிதறிப்போகிறார்கள்[a]; அவரை வெறுப்பவர்கள் அவர் முன்னிலையிலிருந்து தப்பியோடுகிறார்கள்.
  to: கடவுள் எழுந்தருளுகிறார்; அவருடைய பகைவர்கள் சிதறிப்போகிறார்கள்[a]; அவரை வெறுப்பவர்கள் அவர் முன்னிலையிலிருந்து ஓடிப்போகிறார்கள்.
