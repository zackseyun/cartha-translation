  yaml_path: translation/ot/psalms/068/021.yaml
  text: Surely God will crush the head of his enemies[a], the hairy crown of the one who walks in his guilt.
translation:
  language: ta
  text: நிச்சயமாகவே கடவுள் தம் பகைவர்களின் தலையையும், தன் குற்றச்செயல்களில் தொடர்ந்து நடக்கிறவனின் மயிரடர்ந்த உச்சந்தலையையும்[a] நொறுக்குவார்.
  philosophy: optimal-equivalence
