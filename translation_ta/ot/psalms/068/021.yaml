    reason: קָדְקֹד என்பதற்கு ‘உச்சந்தலை/மண்டையோடு’ என்ற மாற்றுகளும், בַּאֲשָׁמָיו என்பதற்கு ‘குற்றச்செயல்கள்/மீறுதல்கள்’ என்ற பொருள் வரம்பும் உள்ளன.
  revision_rationale: The revision keeps the verse’s forceful judgment imagery and its referent to God while restoring the plural sense of בַּאֲשָׁמָיו. It also lets one final verb govern both coordinated objects, reflecting the Hebrew syntax and poetic parallelism. The footnote remains attached to the phrase containing both lexical alternatives.
