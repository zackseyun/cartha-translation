theological_decisions:
- issue: ‘தம் பகைவர்கள்’ என்பதிலுள்ள உரிமைப் பின்னொட்டின் சுட்டுப்பொருள்
  choice: அது கடவுளைக் குறிக்கிறது.
  alternative: சூழலின் அடிப்படையில் தெய்வீக அரசரின் அல்லது கடவுளுடைய மக்களின் பகைவர்கள் எனப் பொதுவாகப் புரிந்துகொள்ளலாம்.
  rationale: உடனடி எழுவாய் אֱלֹהִים என்பதும் அதனுடன் ஒருமை வினைச்சொல் வருவதும், பின்னொட்டின் மிக இயல்பான முன்னிலையாகக் கடவுளையே காட்டுகின்றன; வசனம் வெளிப்படையாகச் சொல்லாத குறுகிய மெசியா அல்லது தேசிய விளக்கம் சேர்க்கப்படவில்லை.
- issue: בַּאֲשָׁמָיו என்பதன் பொருள்
  choice: ‘தன் குற்றத்திலேயே’ என்று குற்றநிலையிலும் அதில் தொடரும் நடத்தையிலும் உள்ள பதற்றம் தக்கவைக்கப்பட்டுள்ளது.
  alternative: ‘தன் குற்றச்செயல்களில்’ அல்லது ‘தன் மீறுதல்களில்’ என்று செயல்களின் பன்மையை முன்னிறுத்தலாம்.
  rationale: பெயர்ச்சொல் குற்றநிலையையும் குற்றத்திற்குரிய செயல்களையும் குறிக்கக்கூடும். எபிரெய ஒருமையை நேரடியாகக் காத்து, பங்கேற்பு வடிவம் உணர்த்தும் தொடர்ச்சியான நடத்தையை ‘நடந்துகொண்டிருப்பவன்’ வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியமும் தீர்ப்பின் வன்மையான உருவகமும் தக்கவைக்கப்பட்டுள்ளன. ‘நொறுக்குவார்’ இரு இணை உறுப்புகளுக்கும் பொருந்துவதால், இரண்டாவது உறுப்பில் தெளிவுக்காக மீண்டும் சொல்லப்பட்டுள்ளது. ‘தம்’ கடவுளைக் குறிக்கும் மரியாதை ஒருமையாகப் பயன்படுத்தப்பட்டுள்ளது.
