revisions:
- from: நிச்சயமாகவே கடவுள் தம் பகைவர்களின் தலையை நொறுக்குவார்; தன் குற்றத்திலேயே நடந்துகொண்டிருப்பவனின் மயிரடர்ந்த உச்சந்தலையை[a] நொறுக்குவார்.
  to: நிச்சயமாகவே கடவுள் தம் பகைவர்களின் தலையையும், தன் குற்றச்செயல்களில் தொடர்ந்து நடக்கிறவனின் மயிரடர்ந்த உச்சந்தலையையும்[a] நொறுக்குவார்.
