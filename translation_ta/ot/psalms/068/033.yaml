  text: לָ֭/רֹכֵב בִּ/שְׁמֵ֣י שְׁמֵי קֶ֑דֶם הֵ֥ן יִתֵּ֥ן בְּ֝/קוֹל/וֹ ק֣וֹל עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/033.yaml
  text: to him who rides in the highest heavens[a], which are from ancient times—behold, he gives forth his voice[b], a mighty voice.
translation:
  language: ta
  text: பழங்காலத்திலிருந்தே இருக்கும் உன்னத வானங்களில் சவாரி செய்கிறவருக்கு[a]—இதோ, அவர் தம் குரலை எழுப்புகிறார்—வல்லமையான குரலை.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “பழங்காலத்து வானங்களின் வானங்களில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் தம் குரலைத் தருகிறார், வல்லமையின் குரலை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָ/רֹכֵב
  choice: ஏறிச் செல்கிறவருக்கு
  rationale: முந்தைய வசனத்தின் ‘தேவனுக்கு வல்லமையைச் செலுத்துங்கள்’ என்ற கட்டளையின் தொடர்ச்சியாக לָ indirect object-ஐக் குறிக்கிறது. רֹכֵב என்பது தேவனை ‘ஏறிச் செல்கிறவர்’ என விவரிக்கும் பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினை.
- source_word: בִּ/שְׁמֵי שְׁמֵי
  choice: உன்னத வானங்களில்
  rationale: ‘வானங்களின் வானங்கள்’ என்ற எபிரெய கட்டமைப்பு மிக உயர்ந்த வானங்களைக் குறிக்கும் உச்சநிலைச் சொற்றொடர். ‘உன்னத வானங்கள்’ அதன் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: קֶדֶם
  choice: பண்டைக்காலம் முதல் உள்ள
  rationale: இங்கு இச்சொல் திசையைக் குறிக்காமல், வானங்களின் தொன்மையைக் காலரீதியாகக் குறிக்கிறது.
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் இத்துகள், கவிதை நடையின் வலிமையை ‘இதோ’ என்பதால் பாதுகாக்கிறது.
- source_word: יִתֵּן בְּ/קוֹל/וֹ
  choice: தமது குரலை எழுப்புகிறார்
  rationale: சொல்லுக்குச் சொல் ‘தமது குரலைக் கொடுக்கிறார்’ என்றாலும், נתן קול என்ற மரபுத்தொடர் குரலை வெளிப்படுத்துதல் அல்லது எழுப்புதலைக் குறிக்கிறது.
- source_word: קוֹל עֹז
  choice: வல்லமையான குரல்
  rationale: ‘வல்லமையின் குரல்’ என்ற கட்டமைப்பை இயல்பான தமிழில் வழங்கி, குரலின் வலிமையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வானங்களில் ஏறிச் செல்கிறவரின் அடையாளம்
  choice: சுற்றியுள்ள பாடலின் சூழலின்படி இஸ்ரவேலின் தேவனையே குறிக்கிறது; அதற்கு மேல் குறுகிய அடையாளம் சேர்க்கப்படவில்லை.
  alternative: பின்னாளைய typological வாசிப்பு இதை மேசியாவுடன் தொடர்புபடுத்தலாம்.
  rationale: எபிரெய உரை உடனடியான சூழலில் தேவனை உயர்ந்த கவிதை உருவகத்தில் வர்ணிக்கிறது. மொழிபெயர்ப்பு பிற்கால இறையியல் அடையாளத்தை மூலவசனத்திற்குள் சேர்க்காமல் இந்த நேரடி குறிப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும், சங்கீதத்திற்குரிய கண்ணியமான கவிதை நடையுடனும் அமைக்கப்பட்டது. எபிரெயச் சொற்றொடரின் மீளுரைப்பும் வலிமையும் பிரதான உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளன.
