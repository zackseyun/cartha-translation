translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டது. அரிய ‘pinion’ என்பதற்குச் சமமான கடினச் சொல்லைத் தவிர்த்து, ‘சிறகின் நீண்ட இறகுகள்’ எனத் தெளிவுபடுத்தப்பட்டது. மூலத்தில் முதல் துணைவாக்கியத்துக்கும் புறா உருவகத்துக்கும் இடையிலான தெளிவற்ற தொடர்பு விளக்கவுரை சேர்க்காமல் அப்படியே பாதுகாக்கப்பட்டது.
