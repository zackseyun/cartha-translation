  text: אִֽם תִּשְׁכְּבוּ/ן֮ בֵּ֪ין שְׁפַ֫תָּ֥יִם כַּנְפֵ֣י י֭וֹנָה נֶחְפָּ֣ה בַ/כֶּ֑סֶף וְ֝/אֶבְרוֹתֶ֗י/הָ בִּֽ/ירַקְרַ֥ק חָרֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/013.yaml
  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
translation:
  language: ta
  text: நீங்கள் ஆட்டுத்தொழுவங்களின் நடுவே படுத்துக் கிடந்தாலும்[a], புறாவின் சிறகுகள் வெள்ளியால் மூடப்பட்டிருக்கின்றன; அதன் நீண்ட சிறகிறகுகள் மஞ்சள் பொன்னால் மூடப்பட்டிருக்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுமைப்பைகளுக்கு நடுவே” அல்லது “அடுப்புக் கற்களுக்கு நடுவே”; இதற்கான எபிரெயச் சொல்லின் பொருள் உறுதியற்றது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “பசுமை கலந்த பொன்னால்” அல்லது “மஞ்சள்-பச்சை ஒளிவீசும் பொன்னால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: படுத்துக் கிடந்தாலும்
  rationale: אִם இங்கு கவிதைச் சூழலில் நிபந்தனை அல்லது விட்டுக்கொடுப்பு பொருளைத் தரலாம். தொடரின் உறவை இயல்பான தமிழில் காட்ட ‘-ஆலும்’ பயன்படுத்தப்பட்டது; இருப்பினும் நிபந்தனை நிழல் முற்றிலும் நீக்கப்படவில்லை.
- source_word: תִּשְׁכְּבוּן
  choice: படுத்துக் கிடக்கிறீர்கள்
  rationale: שׁכב என்பதன் அடிப்படை உடல்சார் படிமமான ‘படுத்துக் கிடத்தல்’ பாதுகாக்கப்பட்டது. வசனத்தில் விட்டுக்கொடுப்பு வினைமுற்றோடு ‘படுத்துக் கிடந்தாலும்’ என வருகிறது.
- source_word: בֵּין שְׁפַתָּיִם
  choice: ஆட்டுத் தொழுவங்களுக்கு நடுவே
  rationale: שְׁפַתָּיִם மிகவும் விவாதத்திற்குரிய சொல். பாரம்பரியமாக அறியப்படும் ‘ஆட்டுத் தொழுவங்கள்’ முதன்மை உரையில் வைக்கப்பட்டு, முக்கிய மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டன.
- source_word: כַּנְפֵי יוֹנָה
  choice: புறாவின் சிறகுகள்
  rationale: எபிரெயக் கூட்டுச்சொல்லை நேரடியாகவும் இயல்பான தமிழிலும் எடுத்துரைக்கிறது.
- source_word: נֶחְפָּה בַכֶּסֶף
  choice: வெள்ளியால் மூடப்பட்டிருக்கின்றன
  rationale: חפה குறிக்கும் மூடப்பட்ட அல்லது மேல்பூச்சிடப்பட்ட நிலையைத் தெளிவாகக் காட்டுகிறது; குறிப்பிட்ட அலங்கார முறையை ஊகித்து சேர்க்கவில்லை.
- source_word: אֶבְרוֹתֶיהָ
  choice: அதன் சிறகின் நீண்ட இறகுகள்
  rationale: אֶבְרוֹת என்பது பறப்புக்குரிய நீண்ட சிறகிறகுகளைக் குறிக்கிறது. தொழில்நுட்பமான அரிய சொல்லுக்குப் பதிலாக சாதாரண வாசகருக்குப் புரியும் விளக்கமான சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: בִּירַקְרַק חָרוּץ
  choice: மஞ்சள் பொன்
  rationale: חָרוּץ இங்கு பொன்னைக் குறிக்கிறது; יְרַקְרַק மஞ்சள்-பச்சை அல்லது பசுமை கலந்த ஒளிநிறத்தைச் சுட்டலாம். வாசிக்க இயல்பான ‘மஞ்சள் பொன்’ முதன்மை உரையில் தரப்பட்டு, நுண்ணிய நிறப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
