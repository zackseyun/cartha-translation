  text: From your temple above Jerusalem[c][b][a], kings will bring tribute to you.
translation:
  language: ta
  text: எருசலேமுக்கு மேலுள்ள உமது ஆலயத்திலிருந்து[a] அரசர்கள் உமக்குக் காணிக்கை[b] கொண்டுவருவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எருசலேமிலுள்ள உமது ஆலயத்தின் காரணமாக.”
    reason: alternative_reading
  - marker: b
    text: “காணிக்கை” என்பதை “பரிசு” அல்லது “திறை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  choice: உமது ஆலயத்திலிருந்து
  rationale: מִן என்பதன் இயல்பான இடமூலப் பொருளான ‘இலிருந்து’ என்பதையும், הֵיכָל என்பதன் சூழலுக்கேற்ற ‘ஆலயம்’ என்ற பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: עַל יְרוּשָׁלִָם
  choice: எருசலேமுக்கு மேலுள்ள
  rationale: עַל என்பதன் ‘மேல்/மேலுள்ள’ என்ற இடவியல் வலிமையைப் பாதுகாத்து, ஆலயம் எருசலேமின் உயர்ந்த பகுதியில் இருப்பதைக் குறிக்கும் இயல்பான தமிழாக அமைக்கப்பட்டுள்ளது.
- source_word: לְךָ
  choice: உமக்கு
  rationale: அரசர்கள் கொண்டுவரும் பொருளைப் பெறுபவர் தேவன் என்பதைச் சுட்டும் வேற்றுமையை இயல்பாகக் காட்டுகிறது.
- source_word: יוֹבִילוּ
  choice: கொண்டுவருவார்கள்
  rationale: יבל என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் ஒரு பொருளைக் கொண்டு வந்து அளிப்பதைக் குறிக்கிறது.
- source_word: מְלָכִים
  choice: அரசர்கள்
  rationale: அரச அதிகாரத்தையும் பன்னாட்டு மரியாதையையும் வெளிப்படுத்தும் நேரடியான தமிழ் இணை.
- source_word: שַׁי
  choice: காணிக்கை
  rationale: שַׁי என்பது பரிசு அல்லது உயர்ந்தவருக்கு அளிக்கப்படும் திறை எனப் பொருள்படலாம்; தேவனுக்கு அரசர்கள் கொண்டு வருவதைக் குறிக்கும் இச்சூழலில் ‘காணிக்கை’ இயல்பாகவும் மரியாதையாகவும் உள்ளது.
theological_decisions:
- issue: ஆலயத்தைக் குறிக்கும் சொற்றொடருக்கும் எருசலேமுக்கும் உள்ள தொடரியல் உறவு
  choice: ஆலயம் ‘எருசலேமுக்கு மேலுள்ளது’ என்றும், அதிலிருந்து அரசர்கள் தேவனுக்குக் காணிக்கை கொண்டுவருவார்கள் என்றும் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எருசலேமிலுள்ள உமது ஆலயத்தின் காரணமாக, அரசர்கள் உமக்குப் பரிசுகளைக் கொண்டுவருவார்கள்.’
  rationale: எபிரெயத்தில் מִן காரணப் பொருளிலும், עַל பொதுவான இடப்பொருளிலும் கொள்ளப்படலாம். முதன்மை உரை இரு முன்னிடைச்சொற்களின் அடிப்படை இடவியல் வலிமையைப் பாதுகாக்கிறது; வேறு சாத்தியமான தொடரியல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘உமக்கு’ என்பவை பயன்படுத்தப்பட்டுள்ளன; எபிரெயச் சொற்றொடரின் உண்மையான தொடரியல் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
