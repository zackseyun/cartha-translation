source:
  edition: WLC
  text: בְּ/פָ֘רֵ֤שׂ שַׁדַּ֓י מְלָ֘כִ֤ים בָּ֗/הּ תַּשְׁלֵ֥ג בְּ/צַלְמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/014.yaml
  text: When the Almighty scattered kings there, it snowed on Zalmon.
translation:
  language: ta
  text: சர்வவல்லவர் அங்கே அரசர்களைச் சிதறடித்தபோது, சல்மோனில் பனி பெய்தது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּפָרֵשׂ
  choice: சிதறடித்தபோது
  rationale: פָּרַשׂ என்பதன் இச்சூழலுக்குரிய ‘சிதறச் செய்தல்/சிதறடித்தல்’ என்ற பொருளையும், בְּ + infinitive construct தரும் காலத் தொடர்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שַׁדַּי
  choice: சர்வவல்லவர்
  rationale: தெய்வப் பெயரான Shaddai-க்கு நவீனத் தமிழில் பரவலாக அறியப்படும் பொருள் சார்ந்த இணை; பெயரின் தெய்வீக மரியாதையையும் காக்கிறது.
- source_word: בָּהּ
  choice: அங்கே
  rationale: பெண்பால் ஒருமைச் சுட்டுப்பெயரின் தெளிவில்லாத முன்னுறுப்பைத் தமிழில் இடச்சுட்டாகப் பாதுகாக்கிறது; குறிப்பிட்ட பெயர்ச்சொல்லை ஊகித்து சேர்ப்பதில்லை.
- source_word: תַּשְׁלֵג
  choice: பனி பெய்தது
  rationale: இவ்வடிவம் இரண்டாம் நபர் பெண்பால் அல்லது மூன்றாம் நபர் பெண்பால் என இலக்கணரீதியாக வாசிக்கப்படலாம்; சூழலில் பொதுவாக ஏற்கப்படும் ‘பனி பெய்தது’ என்ற இயற்கை நிகழ்வு வாசிப்பைத் தெளிவான தமிழில் தருகிறது.
- source_word: צַלְמוֹן
  choice: சல்மோன்
  rationale: இடப்பெயரை மொழிபெயர்த்து ஊகிக்காமல் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: שַׁדַּי என்ற தெய்வப் பெயரின் மொழிபெயர்ப்பு
  choice: சர்வவல்லவர்
  alternative: ஷத்தாய்
  rationale: தமிழ் வாசகர்களுக்கு உடனடியாகப் புரியும் மரியாதையான பாரம்பரிய இணையைத் தேர்ந்தெடுக்கிறது; எந்தத் தனிப்பட்ட சமயக் கோட்பாட்டையும் சேர்ப்பதில்லை.
- issue: בָּהּ என்பதன் குறிப்பு
  choice: அங்கே
  alternative: அதில்
  rationale: எதைக் குறிக்கிறது என்பது எபிரெய உரையில் தெளிவாக இல்லை. ‘அங்கே’ என்பது அந்தத் தெளிவின்மையைப் பாதுகாத்து, முந்தைய உருவகங்களில் ஒன்றுடன் கட்டாயமாக இணைப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான கவிதைநடை மற்றும் மூலத்தின் இடத் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளன. ‘சல்மோன்’ இடப்பெயராக ஒலிபெயர்க்கப்பட்டது.
