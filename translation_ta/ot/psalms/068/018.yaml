  text: עָ֘לִ֤יתָ לַ/מָּר֨וֹם שָׁ֘בִ֤יתָ שֶּׁ֗בִי לָקַ֣חְתָּ מַ֭תָּנוֹת בָּ/אָדָ֑ם וְ/אַ֥ף ס֝וֹרְרִ֗ים לִ/שְׁכֹּ֤ן יָ֬הּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/018.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
translation:
  language: ta
  text: 'நீர் உயரத்திற்கு ஏறினீர்;

    சிறைக்கூட்டத்தைச் சிறைபிடித்துச் சென்றீர்;

    மனிதர்களிடையே[a] அன்பளிப்புகளைப் பெற்றீர்—

    கலகம் செய்பவர்களிடையேயும்கூட—

    யா தேவன் அங்கே குடியிருப்பதற்காக.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதர்களிடமிருந்து.” இங்குள்ள எபிரெய முன்னிடைச்சொல் ‘மனிதர்களிடையே’ என்றும், அன்பளிப்புகள் வந்த மூலத்தைக் குறிப்பதாக ‘மனிதர்களிடமிருந்து’ என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யா தேவன் அவர்களிடையே குடியிருப்பதற்காக”; அல்லது, “யா தேவன் குடியிருக்கும் இடமாக.” எபிரெய இறுதித் தொடர் மிகவும் சுருக்கமாக இருப்பதால் ஒன்றுக்கு மேற்பட்ட விதங்களில் தொடர்புபடுத்திப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ לַמָּרוֹם
  choice: நீர் உயரத்திற்கு ஏறினீர்
  rationale: עלה என்பதன் மேல்நோக்கிய இயக்கத்தையும் מָרוֹם குறிக்கும் உயர்ந்த இடத்தையும் நேரடியாகவும் கவிதைநயத்துடனும் வெளிப்படுத்துகிறது.
- source_word: שָׁבִיתָ שֶּׁבִי
  choice: சிறைப்பட்டோர் கூட்டத்தைச் சிறைபிடித்துச் சென்றீர்
  rationale: எபிரெயச் சொல்விளையாட்டின் வலிமையை முடிந்தவரை காக்கிறது; அதேவேளை சொல்லுக்குச் சொல் அமைப்பால் தமிழில் உருவாகக்கூடிய தெளிவின்மையைத் தவிர்க்கிறது.
- source_word: לָקַחְתָּ מַתָּנוֹת
  choice: அன்பளிப்புகளைப் பெற்றீர்
  rationale: לקח அடிப்படையில் ‘எடுத்தீர்’ எனப் பொருள்படலாம்; ஆனால் வெற்றிபெற்றவருக்குக் கொண்டுவரப்படும் மַתָּנוֹת என்ற சூழலில் ‘பெற்றீர்’ என்பது இயல்பான தமிழ். ‘அன்பளிப்புகள்’ என்பது காணிக்கை அல்லது கப்பம் என்று மிகையாக வரையறுக்காமல் பொதுப் பொருளைக் காக்கிறது.
- source_word: בָּאָדָם
  choice: மனிதர்களிடையே
  rationale: ב என்ற முன்னிடைச்சொல்லை இடம் அல்லது வட்டாரம் குறிக்கும் வகையில் எடுத்துக்கொள்கிறது. அது மூலத்திலிருந்து வருதலைக் குறிக்கும் வாய்ப்பும் உள்ளதால் ‘மனிதர்களிடமிருந்து’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְאַף סוֹרְרִים
  choice: கலகம் செய்பவர்களிடையேயும்கூட
  rationale: וְאַף தரும் வலியுறுத்தலையும், סוֹרְרִים குறிக்கும் தொடர்ந்து எதிர்க்கும் அல்லது கலகம் செய்யும் மக்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִשְׁכֹּן
  choice: குடியிருப்பதற்காக
  rationale: ל உடனான வினையெச்சத்தை நோக்கம் அல்லது விளைவு குறிக்கும் அமைப்பாக எடுத்துக்கொள்கிறது; மூலத்தின் சுருக்கமான தொடரை வாசிக்கத்தக்க தமிழாக்கமாக்குகிறது.
- source_word: יָהּ אֱלֹהִים
  choice: யா தேவன்
  rationale: יָהּ என்ற இறைப்பெயரின் குறுகிய வடிவத்தை ‘யா’ என்று ஒலிபெயர்த்து, אֱלֹהִים என்பதை ‘தேவன்’ என்று மொழிபெயர்க்கிறது; இதை முழு நான்கெழுத்து இறைப்பெயராக விரிவுபடுத்தவில்லை.
theological_decisions:
- issue: בָּאָדָם என்பதில் அன்பளிப்புகள் பெறப்பட்ட இடமா, அவற்றின் மூலமா என்பது
  choice: மனிதர்களிடையே
  alternative: மனிதர்களிடமிருந்து
  rationale: எபிரெய முன்னிடைச்சொல் இரு பொருள்களுக்கும் இடமளிக்கிறது. முதன்மை உரை இடம் அல்லது வட்டாரப் பொருளைக் காக்கிறது; மூலத்தைக் குறிக்கும் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: לִשְׁכֹּן יָהּ אֱלֹהִים என்ற இறுதித் தொடரின் தொடர்பும் பொருளும்
  choice: யா தேவன் அங்கே குடியிருப்பதற்காக
  alternative: யா தேவன் அவர்களிடையே குடியிருப்பதற்காக; அல்லது யா தேவன் குடியிருக்கும் இடமாக
  rationale: எபிரெயத் தொடர் சுருக்கமானதும் வெளிப்படையான இடச்சுட்டு இல்லாததும் ஆகும். ‘அங்கே’ என்பது வாசிப்பிற்கு உதவினாலும் யாரிடையே அல்லது எதில் குடியிருப்பார் என்பதைத் தீர்மானிக்காது; மற்ற சாத்தியமான தொடர்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடையும் இரண்டாம் நபர் ஒருமைக்கான மரியாதை வடிவமான ‘நீர்/ஏறினீர்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன. வரிப் பிரிப்பும் இடைக்கோடுகளும் வெற்றிப் பவனி, அன்பளிப்புகள், கலகக்காரர்கள், இறைவனின் குடியிருப்பு ஆகிய கருத்துகளின் அடுக்கைத் தெளிவாக்குகின்றன.
