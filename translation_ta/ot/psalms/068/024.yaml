id: PSA.68.24
reference: Psalms 68:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/024.yaml
  text: They have seen your processions[a], O God— the processions of my God, my King, into the sanctuary.
translation:
  language: ta
  text: இறைவனே, உமது பவனிகளை அவர்கள் கண்டார்கள்—பரிசுத்த இடத்தில் என் இறைவனும் என் அரசருமானவரின் பவனிகளை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאוּ
  choice: கண்டார்கள்
  rationale: Qal perfect 3ஆம் நபர் பன்மை வடிவத்தின் நிறைவுற்ற சாட்சிச் செயலை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: הֲלִיכוֹתֶיךָ / הֲלִיכוֹת
  choice: உமது பவனிகள் / பவனிகள்
  rationale: הלך என்பதிலிருந்து வரும் பன்மைப் பெயர்ச்சொல் பொதுவான ‘செல்லுதல்கள்’ என்பதையும் சடங்கார்ந்த அணிவகுப்பு இயக்கத்தையும் குறிக்கலாம். சூழலின் வழிபாட்டு மற்றும் கொண்டாட்டப் படிமத்துக்கு ‘பவனிகள்’ பொருந்துகிறது; இரு இடங்களிலும் அதே சொல்லை வைத்தது எபிரெயப் பன்மையையும் மறுபடியுரைத்தலையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: இறைவனே
  rationale: சூழல் நேரடி அழைப்பைக் காட்டுவதால் தமிழ் விளிவேற்றுமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֵלִי
  choice: என் இறைவன்
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מַלְכִּי
  choice: என் அரசர்
  rationale: இறைவனுக்குப் பயன்படுத்தப்படும் அரசாட்சி அடைமொழியைச் சேர்க்கையின்றி காக்கிறது.
- source_word: בַקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: בְּ முன்னிடைச்சொல்லின் அடிப்படை இடப்பொருளையும் קֹדֶשׁ என்பதன் புனித இடப் பொருளையும் காக்கிறது; ‘உள்ளே’ என்ற திசைப் பொருளைத் தீர்மானமாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: பவனிகளின் குறிப்பு மற்றும் בַקֹּדֶשׁ என்பதன் பொருள்
  choice: இறைவனுடைய சடங்கார்ந்த பவனிகள் பரிசுத்த இடத்தில் காணப்பட்டதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இது இறைவனுடைய பொதுவான நடப்புகள் அல்லது வழிகள் ‘பரிசுத்தத்தில்’ காணப்பட்டதைக் குறிக்கலாம்; அல்லது பவனிகள் பரிசுத்த இடத்திற்குள் சென்றதாக எடுத்துக்கொள்ளலாம்.
  rationale: மீண்டும் வரும் הֲלִיכוֹת மற்றும் சுற்றியுள்ள கொண்டாட்டச் சூழல் பவனி என்ற பொருளை ஆதரிக்கின்றன. ஆனால் בַקֹּדֶשׁ இடத்தையா, திசையையா, பண்பையா குறிக்கிறது என்பது முழுமையாகத் தீர்மானிக்கப்படாததால், முதன்மை உரை இடப்பொருளை வைத்துக் கொண்டு மாற்று வாய்ப்பை அடிக்குறிப்பில் பதிவு செய்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் வழிபாட்டுக்கேற்ற கண்ணியமான நடை. ‘உமது’, ‘இறைவனே’, ‘அரசர்’ ஆகியவை கவிதைத் தன்மையையும் நேரடி அழைப்பையும் காக்கின்றன. இரண்டாம் பாதியின் எபிரெயச் சொற்றொடர் சுருக்கத்தைத் தமிழில் புரியச் செய்வதற்காக ‘கண்டார்கள்’ மீண்டும் வழங்கப்பட்டுள்ளது.
