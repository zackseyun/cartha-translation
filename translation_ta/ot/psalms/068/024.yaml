revisions:
- from: இறைவனே, உமது பவனிகளை அவர்கள் கண்டார்கள்—என் இறைவனும் என் அரசருமானவரின் பவனிகளைப் பரிசுத்த இடத்தில் கண்டார்கள்.[a]
  to: இறைவனே, உமது பவனிகளை அவர்கள் கண்டார்கள்—பரிசுத்த இடத்தில் என் இறைவனும் என் அரசருமானவரின் பவனிகளை.
  rationale: The revision retains the cultic/processional reading while keeping the Hebrew’s single verbal action and final locative phrase. It also maintains the repeated plural noun and the concise poetic structure. The footnote now distinguishes the lexical locative sense from the contextually possible directional interpretation.
