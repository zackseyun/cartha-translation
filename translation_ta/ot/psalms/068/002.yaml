  text: כְּ/הִנְדֹּ֥ף עָשָׁ֗ן תִּ֫נְדֹּ֥ף כְּ/הִמֵּ֣ס דּ֭וֹנַג מִ/פְּנֵי אֵ֑שׁ יֹאבְד֥וּ רְ֝שָׁעִ֗ים מִ/פְּנֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/002.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
translation:
  language: ta
  text: புகை சிதறடிக்கப்படுவதுபோல்[a], நீர் அவர்களைச் சிதறடிக்கிறீர்; நெருப்பின் முன் மெழுகு உருகுவதுபோல்[b], பொல்லாதவர்கள் கடவுளின் முன்னிலையில் அழிந்துபோகிறார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிதறடிக்கப்படுவதுபோல்’ என்பதற்கு ‘விரட்டப்படுவதுபோல்’ அல்லது ‘அடித்துச் செல்லப்படுவதுபோல்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை விரட்டப்படுதல், சிதறுதல், அல்லது காற்றில் அடித்துச் செல்லப்படுதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நெருப்பின் முன்’ என்பதும் ‘கடவுளின் முன்னிலையில்’ என்பதும் சொல்லுக்குச் சொல் ‘நெருப்பின் முன்பிருந்து,’ ‘கடவுளின் முன்பிருந்து’ என்பதாகும்; அந்த முன்னிலையால் அல்லது பிரசன்னத்தால் நிகழ்வதை இது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய வினைகளை ‘நீர் சிதறடிப்பீர் ... அழிந்துபோவார்கள்’ என்ற எதிர்காலமாகவோ, சூழலுக்கேற்ப ‘நீர் சிதறடிப்பீராக ... அழிந்துபோவார்களாக’ என்ற வேண்டுதலாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  choice: புகை சிதறடிக்கப்படுவதுபோல்
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது; נדף விரட்டப்படுதல், சிதறடிக்கப்படுதல், அடித்துச் செல்லப்படுதல் ஆகிய நுணுக்கங்களைக் கொண்டது. புகையின் உருவகத்துக்கும் அடுத்த வினையுடனான சொல்லிணைப்புக்கும் ‘சிதறடிக்கப்படுதல்’ இயல்பாகப் பொருந்துகிறது.
- source_word: תִּנְדֹּף
  choice: நீர் அவர்களைச் சிதறடிக்கிறீர்
  rationale: இது தேவனை நேரடியாக முன்னிலைப்படுத்தும் இரண்டாம் நபர் ஆண்பால் ஒருமை வினை. எபிரெயில் வெளிப்படையான செயப்படுபொருள் இல்லாவிட்டாலும், முந்தைய வசனத்தின் எதிரிகளையும் இவ்வசனத்தின் பொல்லாதவர்களையும் சுட்டும் ‘அவர்களை’ தமிழில் தெளிவுக்காக வழங்கப்பட்டுள்ளது.
- source_word: כְּ/הִמֵּס דּוֹנַג
  choice: மெழுகு உருகுவதுபோல்
  rationale: כְּ உடன் வரும் வினைபெயர் ஒப்புமையை அறிமுகப்படுத்துகிறது. தமிழில் வரையறுக்கப்பட்ட வினை வடிவம் கவிதைநயத்தோடும் இயல்பாகவும் உள்ளது.
- source_word: מִ/פְּנֵי אֵשׁ
  choice: நெருப்பின் முன்னிலையில்
  rationale: מִפְּנֵי என்பதன் அடிப்படை உருவகம் ‘முகத்திற்கு/முன்னிலையிலிருந்து’ என்பதாகும். நெருப்பின் தாக்கத்தால் மெழுகு உருகுவதைச் சொல்வதோடு, அடுத்த ‘கடவுளின் முன்னிலையில்’ என்ற இணை அமைப்பையும் இது காக்கிறது.
- source_word: יֹאבְדוּ
  choice: அழிந்துபோகிறார்கள்
  rationale: אבד என்பதன் பொருள் அழிதல் அல்லது மாண்டுபோதல். அழிவின் முறையைத் தேவையின்றி குறிப்பாக்காமல், புகை மற்றும் மெழுகு உருவகங்களுடன் பொருந்தும் பொதுவான சொல்லாக இது உள்ளது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: இது ஒழுக்கரீதியாகத் தீமை செய்பவர்களைக் குறிக்கும் பெயர்ச்சொல் பயன்பாடு. ‘பொல்லாதவர்கள்’ என்பது நவீனத் தமிழில் தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: מִ/פְּנֵי אֱלֹהִים
  choice: கடவுளின் முன்னிலையில்
  rationale: இச்சூழலில் אֱלֹהִים என்பதற்கு ‘கடவுள்’ நேரான மொழிபெயர்ப்பு. מִפְּנֵי என்பதிலுள்ள முன்னிலை/பிரசன்ன உருவகத்தை ‘முன்னிலையில்’ காக்கிறது.
theological_decisions:
- issue: கவிதைச் சூழலில் எபிரெய இறந்தகாலமற்ற வினைகளின் காலமும் வினைநிலையும்
  choice: 'நிகழ்காலப் பொதுமை: ‘சிதறடிக்கிறீர் ... அழிந்துபோகிறார்கள்’'
  alternative: 'எதிர்காலம்: ‘சிதறடிப்பீர் ... அழிந்துபோவார்கள்’; அல்லது வேண்டுதல்: ‘சிதறடிப்பீராக ... அழிந்துபோவார்களாக’'
  rationale: எபிரெயக் கவிதையில் இவ்வினை வடிவங்கள் எதிர்காலம், வழக்கமான நிகழ்வு, அல்லது வேண்டுதல் ஆகிய நுணுக்கங்களை ஏற்கலாம். இங்கு கடவுளின் முன்னிலையில் நிகழ்வதை உயிரோட்டமான பொதுமையாக நிகழ்காலத்தில் கூறுவது எந்த ஓர் வாசிப்பையும் தேவையின்றி முடிவுசெய்யாது; மாற்று வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘நீர்’ பயன்படுத்தப்படுகிறது. ஒரே எபிரெய வேரின் மீளுரையை வெளிப்படுத்த ‘சிதறடிக்கப்படுவதுபோல் ... சிதறடிக்கிறீர்’ என்று சொல்லிணைப்பு காக்கப்பட்டுள்ளது.
