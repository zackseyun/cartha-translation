lexical_decisions:
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: இறைவனை வாழ்த்திப் போற்றும் எபிரெய ஆசிமொழிச் சூத்திரத்தின் வலிமையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: இறை ஆட்சியையும் அதிகாரத்தையும் குறிக்கும் இத்தலைப்பிற்கான இயல்பான தமிழ் வடிவம்.
- source_word: יוֹם יוֹם
  choice: நாள்தோறும்
  rationale: சொல் இரட்டிப்பு குறிக்கும் தொடர்ச்சியான, ஒவ்வொரு நாளுக்குமான செயலைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: יַעֲמָס לָנוּ
  choice: நம் சுமையைச் சுமக்கிற
  rationale: עמס என்பதன் அடிப்படைச் சுமத்துதல்/சுமத்தல் உருவகத்தைத் தக்கவைக்கிறது. எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால், சூழலுக்கேற்ற ‘நம் சுமை’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: הָאֵל
  choice: இறைவன்
  rationale: பொதுவான இறைப்பெயரான אֵל என்பதைக் கண்ணியமான நவீன தமிழில் இயல்பாக வழங்குகிறது.
- source_word: יְשׁוּעָתֵנוּ
  choice: நமது மீட்பு
  rationale: காப்பு, விடுதலை, உதவி ஆகிய பரந்த பொருள் வளத்தை ‘மீட்பு’ தக்கவைக்கிறது; வெறும் ஒரு குறிப்பிட்ட ஆபத்திலிருந்து விடுதலை என்ற குறுகிய பொருளுக்குள் இதை அடைக்கவில்லை.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான பொருளும் இசை/வழிபாட்டுப் பணியும் உறுதியில்லாததால், பொருளை ஊகித்து மொழிபெயர்க்காமல் ஒலிபெயர்ப்பு தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: יַעֲמָס לָנוּ என்ற சுருக்கமான சொற்றொடரின் பொருள்
  choice: கடவுள் தமது மக்களின் சுமையை நாள்தோறும் சுமக்கிறார்.
  alternative: கடவுள் நாள்தோறும் நம்மைத் தாங்குகிறார்; அல்லது நாள்தோறும் நமக்காகச் சுமக்கிறார்; பாரம்பரியமாக, நாள்தோறும் நன்மைகளால் நம்மை நிரப்புகிறார்.
  rationale: עמס என்பது சுமத்துதல் அல்லது சுமத்தல்/சுமந்து செல்லுதல் என்பதைக் குறிக்கிறது; לָנוּ என்பது ‘நமக்காக/நமக்கு’ என்று வருகிறது, ஆனால் சுமக்கப்படும் பொருள் வெளிப்படையாகக் கூறப்படவில்லை. ஆகவே தெய்வீக ஆதரவைக் காட்டும் ‘நம் சுமையைச் சுமக்கிற’ என்பது முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டது; உரையில் இல்லாத ‘நன்மைகள்’ என்பதைக் கட்டாயமாகச் சேர்க்காமல் மற்ற வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியத்தையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கும் நடை. ‘ஆண்டவர்’, ‘இறைவன்’ ஆகியவை இயல்பான இறைக்குறிப்புகளாகவும், ‘சேலா’ விளக்கமின்றி ஒலிபெயர்ப்பாகவும் வைக்கப்பட்டுள்ளன.
