source:
  edition: WLC
  text: גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים בְּ/עֶגְלֵ֬י עַמִּ֗ים מִתְרַפֵּ֥ס בְּ/רַצֵּי כָ֑סֶף בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, trampling on pieces of silver[b]. Scatter the peoples who delight in wars.
translation:
  language: ta
  text: நாணற்புதரின் மிருகத்தையும்[a], மக்கள் கூட்டங்களின் கன்றுகளிடையே உள்ள காளைக் கூட்டத்தையும் கண்டியும்; வெள்ளித் துண்டுகளை மிதிப்பவைகளை[b] கண்டியும். போர்களில் மகிழும் மக்கள் கூட்டங்களைச் சிதறடித்தருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாணற்புதரின் காட்டு மிருகம்.” இது எகிப்தையோ வேறொரு பகை வல்லமையையோ உருவகமாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த எபிரெயச் சொற்றொடரின் பொருள் தெளிவற்றது. “வெள்ளித் துண்டுகளோடு தன்னைத் தாழ்த்திக்கொள்வது” அல்லது “வெள்ளிப் பாளங்களால் பணிவது,” அதாவது கப்பம் செலுத்துவது என்றும் இதைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּעַר
  choice: கண்டியும்
  rationale: இது வலிமையான இறைக் கண்டிப்பையும், அதனால் பகை வல்லமை அடக்கப்படுவதையும் குறிக்கும் கட்டளை வடிவம். ‘அழித்துவிடும்’ என்று பொருளை மிகைப்படுத்தாமல் எபிரெயச் சொல்லின் வலிமையைப் பேணுகிறது.
- source_word: חַיַּת קָנֶה
  choice: நாணற்புதரின் மிருகம்
  rationale: ‘நாணலின் மிருகம்’ என்ற உருவகத்தைத் தக்கவைத்து, சதுப்புநிலத்தின் ஆபத்தான விலங்கையோ பகை வல்லமையையோ குறிப்பதாக இருக்கக்கூடிய பொருளை வெளிப்படையாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: עֲדַת אַבִּירִים
  choice: காளைகளின் மந்தை
  rationale: עֲדָה என்பது பொதுவாகக் கூட்டத்தைக் குறித்தாலும், சுற்றியுள்ள விலங்கு உருவகத்தில் אַבִּירִים ‘வலியவை/காளைகள்’ எனப் பொருள்படுவது இயல்பானது. ‘மந்தை’ அந்தத் தொடர்ச்சியான உருவகத்தைப் பேணுகிறது.
- source_word: בְּעֶגְלֵי עַמִּים
  choice: மக்களினங்களின் கன்றுகளிடையே
  rationale: בְּ என்பதற்கு இங்கு இடப்பொருளான ‘இடையே’ எனவும், עֶגְלֵי என்பதற்கு ‘கன்றுகள்’ எனவும் மொழிபெயர்க்கப்பட்டுள்ளது. עַמִּים என்பதன் பன்மை ‘மக்களினங்கள்’ என்று தக்கவைக்கப்பட்டுள்ளது.
- source_word: מִתְרַפֵּס
  choice: மிதிக்கிறது
  rationale: இந்த வடிவத்தின் பொருள் விவாதத்திற்குரியது. பகை விலங்கு/காளை உருவகத்துக்கும் போரை விரும்புவோருக்கு எதிரான வேண்டுதலுக்கும் பொருந்தும் வன்முறைச் செயலாக முதன்மை உரையில் எடுத்துக்கொள்ளப்பட்டுள்ளது; தன்னைத் தாழ்த்துதல் அல்லது பணிதல் என்ற வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְּרַצֵּי כָסֶף
  choice: வெள்ளித் துண்டுகளை
  rationale: רַצֵּי அரிதானதும் தெளிவற்றதுமான சொல்; துண்டுகள் அல்லது பாளங்களைக் குறிக்கலாம். ‘வெள்ளித் துண்டுகள்’ பொருளாதார உருவகத்தைத் தக்கவைத்தபடி பொருளை அளவுக்கு மீறிக் குறிப்பாக்காமல் விடுகிறது.
- source_word: בִּזַּר
  choice: சிதறடியும்
  rationale: வடிவியல் அடிப்படையில் இது நிறைவுற்ற வினைபோல் குறியிடப்பட்டிருந்தாலும், கவிதைச் சூழலில் தொடக்கக் கட்டளைக்கு இணையான வேண்டுதலாகப் புரிந்துகொள்ளப்படுகிறது. ‘சிதறடியும்’ பகை மக்களை விரட்டியடிக்க வேண்டிய வலிமையான மன்றாட்டை வெளிப்படுத்துகிறது.
- source_word: עַמִּים
  choice: மக்களினங்கள்
  rationale: இந்தப் பன்மைச் சொல் ‘மக்கள் கூட்டங்கள்/மக்களினங்கள்’ எனப் பொருள்படும். ‘நாடுகள்’ என்று அரசியல் பொருளைக் குறுக்காமல் மூலத்தின் கூட்டுமக்கள் கருத்தைப் பேணுகிறது.
- source_word: קְרָבוֹת יֶחְפָּצוּ
  choice: போர்களில் மகிழும்
  rationale: பன்மையான ‘போர்கள்’ என்பதையும் அவற்றை விரும்பி இன்புறும் தொடர்ச்சியான மனப்பாங்கையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘நாணற்புதரின் மிருகம்’ எகிப்தையோ வேறு குறிப்பிட்ட வரலாற்று வல்லமையையோ குறிக்கிறதா
  choice: முதன்மை உரையில் உருவகத்தை மட்டும் தக்கவைத்தல்
  alternative: அதை எகிப்து எனக் குறிப்பாக அடையாளப்படுத்துதல் அல்லது பொதுவான பகை பேரரசாக விளக்குதல்
  rationale: நாணல்/சதுப்புநிலச் சூழலும் சங்கீதத்தின் விரிந்த பின்னணியும் எகிப்தை நினைவூட்டக்கூடும். ஆயினும் இவ்வசனம் எந்த நாட்டையும் பெயரிடாமல் உருவகமாகவே பேசுவதால், மொழிபெயர்ப்பு அதற்கு மேல் வரலாற்று அடையாளத்தைத் திணிக்கவில்லை.
- issue: מִתְרַפֵּס என்பது பகைமையுடன் மிதிப்பதையா அல்லது வெள்ளி காணிக்கையுடன் பணிவதையா குறிக்கிறது
  choice: முதன்மை உரையில் ‘மிதிக்கிறது’ எனக் கொடுத்து, பணிதல்/காணிக்கை வாசிப்பை அடிக்குறிப்பில் பேணுதல்
  alternative: ‘வெள்ளித் துண்டுகளோடு தன்னைத் தாழ்த்திக்கொள்கிறது’ அல்லது ‘வெள்ளிப் பாளங்களைக் காணிக்கையாகக் கொடுத்துப் பணிகிறது’
  rationale: சொல் கடினமானதும் பலவாறு விளக்கப்பட்டதுமாகும். பகை விலங்கு உருவகமும் போரை விரும்பும் மக்களைச் சிதறடிக்க வேண்டிய இறுதி வேண்டுதலும் வன்முறை வாசிப்பை ஆதரிக்கின்றன; அதேவேளை பணிதல் அல்லது கப்பம் செலுத்துதல் என்ற முக்கிய மாற்று வாசிப்பு மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. விலங்கு உருவகம் திட்டமிட்டு அப்படியே வைக்கப்பட்டுள்ளது. தெய்வத்தை நேரடியாக அழைக்கும் வேண்டுதலுக்கேற்ற மரியாதைக் கட்டளை வடிவங்களான ‘கண்டியும்’, ‘சிதறடியும்’ பயன்படுத்தப்பட்டுள்ளன; தெளிவற்ற எபிரெயப் பகுதி அடிக்குறிப்பில் மாற்று வாசிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
