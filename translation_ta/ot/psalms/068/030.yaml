  revision_rationale: மூலத்தின் கடினமான מִתְרַפֵּס בְּרַצֵּי כָסֶף தொடரைத் தனி வாக்கியமாக்கி, தமிழில் இருந்த தெளிவற்ற “அது” என்ற சுட்டலை நீக்கியுள்ளேன். “மிதிப்பவைகளை” என்ற பன்மை வடிவம் முன்வரும் பகை உருவகங்களை ஒருமுகமாகக் குறிப்பிடுகிறது; குறிப்பிட்ட ஒரே விலங்குக்கு அந்தச் செயலைக் கட்டாயப்படுத்தவில்லை. மாற்று பணிதல்/கப்பம் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
