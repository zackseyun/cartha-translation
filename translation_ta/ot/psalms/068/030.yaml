  terminology: “நாணற்புதரின் மிருகம்,” “காளைக் கூட்டம்,” “கன்றுகள்,” “வெள்ளித் துண்டுகள்,” “போர்கள்” ஆகியவை மூலத்தின் விலங்கு மற்றும் பொருளாதார உருவகங்களைப் பாதுகாக்கின்றன. எகிப்து பற்றிய சாத்தியமான குறிப்பு அடிக்குறிப்பில் மட்டுமே வைக்கப்பட்டுள்ளது.
