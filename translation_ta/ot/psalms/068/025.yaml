  text: The singers went before[a], the musicians after[b], in the midst of young women beating tambourines.
translation:
  language: ta
  text: 'பாடகர்கள் முன்னே சென்றனர்;

    இசைக்கருவி வாசிப்பவர்கள் பின்னே;

    நடுவில் தம்புரின்களைத் தட்டும் இளம்பெண்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தம்புரின்கள்’ என்பது கையால் அடித்து இசைக்கப்படும் சட்டக வடிவத் தாளக்கருவிகள். எபிரெயச் சொல் இளம் பெண்களைக் குறிக்கிறது; ‘கன்னியர்’ என்பது மூலத்தில் கட்டாயமில்லாத கூடுதல் குறிப்பைச் சேர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדְּמוּ
  choice: முன்னே சென்றார்கள்
  rationale: קדם என்பதன் பியேல் வடிவம் ஊர்வலத்தில் முன்னிலை வகித்துச் செல்வதைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் இயக்க உணர்வுடனும் உள்ளது.
- source_word: שָׁרִים
  choice: பாடகர்கள்
  rationale: இது ‘இளவரசர்கள்’ என்று பொருள்படும் வேறு சொல்லல்ல; שׁיר (‘பாடு’) என்பதிலிருந்து வந்து, இசை ஊர்வலச் சூழலில் பாடுவோரைக் குறிக்கிறது.
- source_word: אַחַר
  choice: பின்னே
  rationale: ஊர்வலத்தின் இடவரிசையையும் முன்னே சென்ற பாடகர்களுக்கு அடுத்த நிலையையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: נֹגְנִים
  choice: இசைக்கருவி வாசிப்பவர்கள்
  rationale: נגן என்பது இசைக்கருவி இசைப்பதைக் குறிக்கிறது. ‘இசைக்கலைஞர்கள்’ என்பதைவிட இந்தத் தேர்வு மூலத்தின் கருவியிசைக் கருத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּתוֹךְ
  choice: அவர்களின் நடுவே
  rationale: பாடகர்களுக்கும் இசைக்கருவி வாசிப்பவர்களுக்கும் இடையிலான ஊர்வல அமைப்பை இயல்பான தமிழில் காட்டுகிறது; ‘அவர்களின்’ என்பது சூழலிலிருந்து தெளிவாகச் சேர்க்கப்பட்டது.
- source_word: עֲלָמוֹת
  choice: இளம்பெண்கள்
  rationale: திருமண வயதை அண்மித்த இளம் பெண்களைக் குறிக்கும் பொதுச் சொல். ‘கன்னியர்’ என்பது மூலச்சொல் கட்டாயப்படுத்தாத பாலியல் நிலையைக் குறிப்பாகச் சேர்க்கக்கூடும்.
- source_word: תּוֹפֵפוֹת
  choice: கைத்தப்புகளைத் தட்டிக்கொண்டு சென்றார்கள்
  rationale: תֹּף எனும் கையால் அடிக்கப்படும் சட்டகப் பறையிலிருந்து உருவான வினைச்சொல். தொடர்ச்சியான தாளச் செயலையும் ஊர்வல இயக்கத்தையும் இயல்பான தமிழில் தருகிறது.
