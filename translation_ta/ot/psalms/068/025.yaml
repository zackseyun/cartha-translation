translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய மூன்று அடிச் சமநிலையுடன் மொழிபெயர்க்கப்பட்டது. இரண்டாம், மூன்றாம் கூறுகளில் எபிரெயத்தில் மறைந்திருக்கும் இயக்க வினை தமிழின் தெளிவுக்காக ‘சென்றார்கள்’ என வெளிப்படுத்தப்பட்டது. மொழிநடை கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியத்தக்கதுமானதாக வைக்கப்பட்டது.
