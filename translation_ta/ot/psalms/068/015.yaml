base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/015.yaml
  text: A mountain of God is the mountain of Bashan[b][a]; a mountain of peaks is the mountain of Bashan.
translation:
  language: ta
  text: தேவனுடைய மலை[a] பாசான் மலையே; பல சிகரங்களையுடைய மலை[b] பாசான் மலையே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வல்லமைமிக்க மலை’ அல்லது ‘மகத்தான மலை’; ‘தேவனுடைய மலை’ என்ற எபிரெயத் தொடர் மிக உயர்ந்த தன்மையை உணர்த்தும் மரபுத்தொடராகவும் இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘பல சிகரங்களையுடைய’ என்று மொழிபெயர்க்கப்பட்டுள்ள அரிய எபிரெயச் சொல், கரடுமுரடான அல்லது திமில்கள் போன்ற மேடுகளையுடைய மலையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: மலை
  rationale: எபிரெயச் சொல்லின் வழக்கமான பொருள் ‘மலை’. கவிதையின் வலியுறுத்தும் மறுபடியுரைத்தலைக் காக்க, மூன்று இடங்களிலும் இச்சொல் வெளிப்படையாகத் தக்கவைக்கப்பட்டது.
- source_word: אֱלֹהִים
  choice: தேவனுடைய
  rationale: הַר אֱלֹהִים என்ற இணைப்பின் நேரடியான வடிவத்தையும் அதன் இறையியல்-கவிதைத் தொனியையும் காக்கிறது; வலிமை அல்லது மகத்துவத்தைக் குறிக்கும் உயர்நிலைப் பயன்பாடு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בָּשָׁן
  choice: பாசான்
  rationale: இது ஓர் இடப்பெயர்; நவீனத் தமிழில் புரிந்துகொள்ளத்தக்க வேதாகமப் பெயரொலிப்பாக ‘பாசான்’ பயன்படுத்தப்பட்டது.
- source_word: גַּבְנֻנִּים
  choice: சிகரங்கள் நிறைந்த
  rationale: இந்த அரிய பன்மைச்சொல் பல சிகரங்களையுடைய அல்லது கரடுமுரடான, மேடுபள்ளமுள்ள மலைவடிவைக் குறிக்கலாம். ‘சிகரங்கள் நிறைந்த’ என்பது இயல்பான தமிழில் நில அமைப்பைத் தெளிவாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: הַר אֱלֹהִים என்பதை நேரடியாக மொழிபெயர்ப்பதா, உயர்நிலைப் பொருளுடைய மரபுத்தொடராக மொழிபெயர்ப்பதா
  choice: முதன்மை உரையில் ‘தேவனுடைய மலை’
  alternative: ‘வல்லமைமிக்க மலை’ அல்லது ‘மகத்தான மலை’
  rationale: எபிரெய இணைப்பின் இயல்பான நேரடிப் பொருள் ‘தேவனுடைய மலை’. எனினும், ‘אֱלֹהִים’ இங்கு உயர்நிலையை உணர்த்தும் தீவிரப்படுத்தியாக இருக்கக்கூடிய வாய்ப்பைத் தீர்த்துவிடாமல் அடிக்குறிப்பில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமானதும் கண்ணியமானதுமான கவிதைநடை பயன்படுத்தப்பட்டது. மூலத்தின் ‘மலை’ என்ற மும்முறை மறுபடியுரைத்தலும் இரு அரையடிகளின் இணை அமைப்பும் காக்கப்பட்டன. ஒவ்வொரு அடிக்குறிப்பு குறியும் அதற்குரிய சொல்லுக்குப் பின்னர் முதன்மை உரையில் வைக்கப்பட்டது.
