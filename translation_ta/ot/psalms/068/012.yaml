  text: Kings of armies flee[a], they flee, and the woman at home divides the spoil.
translation:
  language: ta
  text: 'படைகளின் மன்னர்கள் ஓடுகின்றனர், ஓடுகின்றனர்;

    வீட்டிலிருக்கும் பெண் கொள்ளைப்பொருளைப் பங்கிடுகிறாள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வீட்டுப் பெண் கொள்ளைப்பொருளைப் பங்கிடுகிறாள்” / “வீட்டில் வசிப்பவள் கொள்ளைப்பொருளைப் பங்கிடுகிறாள்.” எபிரெயச் சொற்றொடர் பெண்பால் ஒருமையில் உள்ளது; வீட்டில் இருந்த பெண் போரில் கைப்பற்றப்பட்ட பொருட்களைப் பெற்று அவற்றைப் பகிர்ந்தளிப்பதை இது சித்தரிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי צְבָאוֹת
  choice: படைகளின் அரசர்கள்
  rationale: எபிரெயச் சொற்றொடரின் பன்மை இணைப்பையும் இராணுவப் பொருளையும் நேரடியாகப் பேணுகிறது; தெய்வீகப் பட்டத்தைக் குறிக்கும் வேறு நுண்ணுணர்வைத் தேவையின்றி புகுத்தவில்லை.
- source_word: יִדֹּדוּן יִדֹּדוּן
  choice: ஓடுகிறார்கள், ஓடுகிறார்கள்
  rationale: נדד என்பதன் தொடர்ச்சியான இருமுறை பயன்பாட்டை அப்படியே வைத்து, தோற்று ஓடும் செயலின் கவித்துவ வலியுறுத்தலைப் பேணுகிறது.
- source_word: וּנְוַת בַּיִת
  choice: வீட்டில் தங்கியிருக்கும் பெண்
  rationale: பெண்பால் ஒருமையையும் வீட்டில் இருப்பவர் என்ற பொருளையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; குறிப்பிட்ட சமூகப் பங்கைத் தேவையின்றி ஊகிக்கவில்லை.
- source_word: תְּחַלֵּק
  choice: பங்கிடுகிறாள்
  rationale: பீயேல் வினைச்சொல்லின் பிரித்து வழங்குதல் அல்லது பகிர்ந்தளித்தல் என்ற பொருளைச் சூழலுக்கு இயல்பாகக் காட்டுகிறது.
- source_word: שָׁלָל
  choice: கொள்ளைப்பொருள்
  rationale: போரில் கைப்பற்றப்பட்ட பொருட்களைக் குறிக்கும் எபிரெயச் சொல்லின் பொருளைத் தெளிவாகவும் பொதுவாகப் புரியும் தமிழிலும் தருகிறது.
