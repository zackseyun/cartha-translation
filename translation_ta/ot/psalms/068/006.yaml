theological_decisions:
- issue: தனிமையில் இருப்பவர்களுக்கான கடவுளின் செயல்
  choice: தனியாகவும் ஆதரவின்றியும் இருப்பவர்களுக்கு கடவுள் நிலையான குடியிருப்பையும் சேர்ந்திருக்கும் இடத்தையும் அளிக்கிறார்.
  alternative: தனிமையில் இருப்பவர்களைக் கடவுள் குடும்பங்களில் சேர்க்கிறார்.
  rationale: எபிரெயத்தில் நேரடியாக ‘தனியாக இருப்பவர்கள்’ என்றும் ‘வீடு’ என்றும் உள்ளது. ‘குடும்பங்கள்’ என்பது பாரம்பரிய விளக்க மொழிபெயர்ப்பாக இருந்தாலும், ஒருமையில் உள்ள בַּיִת என்பதன் நேரடிப் படிமமான ‘வீடு’ என்பதைக் காப்பது பொருளை உயிரியல் குடும்ப அமைப்புகளுக்கு மட்டும் குறுக்காமல் விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவித்துவ கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘குடியமர்த்துகிறார்’ காரணவினைப் பொருளைக் காக்கிறது; ‘ஒரு வீட்டில்’ மூலத்தின் உருவகத்தையும் அதன் திறந்த பொருள் பரப்பையும் பேணுகிறது. அரிய בַּכּוֹשָׁרוֹת சொல்லின் நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
