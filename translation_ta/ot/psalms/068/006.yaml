- source_word: סוֹרֲרִים
  choice: கலகக்காரர்கள்
  rationale: பிடிவாதமாக எதிர்த்து நடப்பவர்களை அல்லது கிளர்ச்சி செய்பவர்களைக் குறிக்கிறது; நெறிசார் எதிர்ப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שָׁכְנוּ
  choice: வாழ்கிறார்கள்
  rationale: שכן என்பதன் கால் நிறைவுவடிவம் கவிதையில் பொதுநிலை உண்மையாகப் பயன்படுத்தப்பட்டுள்ளது; தமிழில் நிகழ்காலம் இயல்பாக அமைகிறது.
- source_word: צְחִיחָה
  choice: வறண்ட நிலம்
