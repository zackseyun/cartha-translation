  yaml_path: translation/ot/psalms/068/006.yaml
  text: God settles the solitary in a home; he brings out prisoners into prosperity[a], but the rebellious dwell in a parched land.
translation:
  language: ta
  text: தனியாக இருப்பவர்களைக் கடவுள் ஒரு வீட்டில் குடியமர்த்துகிறார்; சிறைப்பட்டவர்களைச் சிறையிலிருந்து வெளியேற்றி, செழிப்புக்குள் அழைத்துச் செல்கிறார்[a]; ஆனால் கலகக்காரர்கள் வறண்ட நிலத்தில் வாழ்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மிகுதிக்குள்’; அரிதான இந்த எபிரெயச் சொல்லைச் சிலர் ‘பாடலுடன்’ என்றும், அல்லது மகிழ்ச்சியான விடுதலையைக் குறிக்கும் வேறுவகை வெளிப்பாடாகவும் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
