  rationale: தனியாக அல்லது பிறரிடமிருந்து பிரிந்து இருப்பவர்களைக் குறிக்கிறது; உணர்ச்சிசார் தனிமை என்று மட்டும் பொருளைக் குறுக்காமல் தெளிவாகச் சொல்கிறது.
- source_word: בַּיְתָה
  choice: ஒரு வீட்டில்
  rationale: בַּיִת என்பது வீடு அல்லது வீட்டார்/குடும்பச் சூழல் எனப் பொருள்படலாம். எபிரெய மூலத்தின் வீடு என்ற உருவகத்தை வைத்துக்கொண்டு, உயிரியல் குடும்பம் என்ற ஒரே விளக்கத்துக்கு அதைக் குறுக்கவில்லை.
- source_word: מוֹצִיא
  choice: அழைத்து வருகிறார்
