base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/016.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
translation:
  language: ta
  text: பல சிகரங்கள் கொண்ட மலைகளே, கடவுள் தாம் குடியிருக்க விரும்பிய மலையைக் கண்டு ஏன் குதித்தாடுகிறீர்கள்[a]? ஆம், யாவே அங்கே என்றென்றும் குடியிருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏன் பொறாமையுடன் பார்க்கிறீர்கள்?” எபிரெய வினைச்சொல் அரிதானதும் அதன் பொருள் உறுதியற்றதுமாகும்; அது துள்ளுதல் அல்லது குதித்தலை, அல்லது பொறாமையுடன் அல்லது வெறுப்பாகப் பார்ப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַצְּדוּן
  choice: துள்ளுகிறீர்கள்
  rationale: அரிதானதும் பொருள் உறுதியற்றதுமான இவ்வினைச்சொல்லின் அசைவு சார்ந்த பொருளை முதன்மை உரையில் காக்கிறது. பொறாமையுடன் பார்ப்பது அல்லது கண்ணுறுத்திப் பார்ப்பது என்ற சூழல்சார் சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הָרִים גַּבְנֻנִּים
  choice: பல முகடுகளுள்ள மலைகளே
  rationale: גַּבְנֻנִּים குறிக்கும் மேடுகள், முதுகுகள் அல்லது பல சிகரங்களைக் கொண்ட தோற்றத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; வெறுமனே ‘உயர்ந்த’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: הָהָר
  choice: மலையை
  rationale: எபிரெய உரை குறிப்பிட்ட ஒரு மலையைச் சுட்டினாலும் அதன் பெயரைச் சொல்லவில்லை. ஆகவே ‘சீயோன் மலை’ என்று விளக்கத்தைச் சேர்க்காமல் ‘மலை’ என்றே வைக்கப்படுகிறது.
- source_word: חָמַד
  choice: விரும்பிய
  rationale: ஆசை கொள்ளுதல் அல்லது விருப்பம் கொள்ளுதல் என்ற அடிப்படைப் பொருளை நெருக்கமாகக் காக்கிறது. ‘தேர்ந்தெடுத்த’ என்பது சூழலின் உட்பொருளாக இருந்தாலும் அதிக விளக்கமானது.
- source_word: לְשִׁבְתּוֹ
  choice: தாம் குடியிருக்க
  rationale: கடவுள் அந்த மலையைத் தமது குடியிருப்பிடமாக விரும்பினார் என்ற நோக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது. மரியாதை ஒருமைக்கேற்ற ‘தாம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אַף
  choice: ஆம்
  rationale: பின்வரும் கூற்றை வலியுறுத்தி உறுதிப்படுத்தும் சொல்லாக இங்கு செயல்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பில் தருகிறது.
- source_word: יִשְׁכֹּן לָנֶצַח
  choice: அங்கே என்றென்றும் குடியிருப்பார்
  rationale: שׁכן என்பதன் குடியிருத்தல் என்ற பொருளையும் לָנֶצַח என்பதன் முடிவற்ற காலநீட்சியையும் காக்கிறது. ‘அங்கே’ என்பது தேர்ந்தெடுக்கப்பட்ட மலையைச் சூழலிலிருந்து தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: மலையை வெளிப்படையாகச் சீயோன் என்று அடையாளப்படுத்தலாமா
  choice: முதன்மை உரையில் ‘மலை’ என்ற பொதுப்பெயரையே வைத்தல்
  alternative: ‘சீயோன் மலை’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சங்கீதத்தின் விரிவான சூழல் சீயோனைக் குறித்தாலும், இவ்வசனம் தனியாக ஒரு பெயரைக் கொடுக்காமல் ‘அந்த மலை’ என்றே கூறுகிறது. மூலத்தில் இல்லாத குறிப்பைச் சேர்க்காமல் அதன் கட்டுப்பாட்டைக் காக்கிறது.
- issue: பிற மலைகளுக்கும் கடவுள் விரும்பிய மலைக்கும் இடையிலான சொல்லாட்சியை எவ்வாறு வெளிப்படுத்துவது
  choice: அரிதான வினைச்சொல்லின் அசைவு உருவகத்தை ‘துள்ளுகிறீர்கள்’ என்று முதன்மை உரையில் காத்தல்
  alternative: ‘பொறாமையுடன் பார்க்கிறீர்கள்’ அல்லது ‘கண்ணுறுத்திப் பார்க்கிறீர்கள்’ என்று எதிர்மறை நோக்கை வெளிப்படையாக்குதல்
  rationale: வினைச்சொல்லின் சரியான பொருள் உறுதியற்றது. அசைவு சார்ந்த பொருளை உரையில் வைத்தும், சூழலுக்கு ஏற்ற பொறாமை அல்லது பகைநோக்குப் பொருளை அடிக்குறிப்பில் பதிவுசெய்தும் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மலைகளை நேரடியாக அழைக்கும் பன்மை வடிவமும் கடவுளுக்கான மரியாதை ஒருமையும் காக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத ‘சீயோன்’ என்ற பெயர் சேர்க்கப்படவில்லை.
