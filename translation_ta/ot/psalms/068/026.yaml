revisions:
- from: சபைகளில் கடவுளை—யாவேவை—வாழ்த்துங்கள், இஸ்ரவேலின் ஊற்றிலிருந்து வந்தவர்களே.[a]
  to: கூட்டங்களில் கடவுளாகிய யாவேவை[b] வாழ்த்துங்கள், இஸ்ரவேலின் ஊற்றிலிருந்து வந்தவர்களே.[a]
  rationale: 'The revision removes unnatural dash punctuation, renders the appositional divine designation idiomatically, and uses a broader term for the gathered groups. It does not present the disputed relationship of ‘from the fountain of Israel’ as certain: the main text adopts one viable Tamil reading, while footnote a explicitly preserves the Hebrew ellipsis and alternative attachment. Footnote b supplies a correctly placed source-name anchor.'
