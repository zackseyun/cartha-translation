  yaml_path: translation/ot/psalms/068/026.yaml
  text: In the assemblies[a], bless God, the Lord[b], from the fountain of Israel.
translation:
  language: ta
  text: கூட்டங்களில் கடவுளாகிய யாவேவை[b] வாழ்த்துங்கள், இஸ்ரவேலின் ஊற்றிலிருந்து வந்தவர்களே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘இஸ்ரவேலின் ஊற்றிலிருந்து’ என்ற சுருக்கமான தொடர் உள்ளது. இங்கு அது ‘இஸ்ரவேலின் ஊற்றிலிருந்து வந்தவர்களே’ என்று விளங்குகிறது. மாற்றாக, அது முன்செல்லும் கட்டளையோடு இணையும் தொடராகவும் புரிந்துகொள்ளலாம்; எபிரெயம் அதன் இலக்கணத் தொடர்பைத் தெளிவாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் ‘YHWH’; இங்கு தனிப்பெயராக ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  choice: சபைகளில்
  rationale: מַקְהֵלוֹת என்பது கூடியிருக்கும் மக்கள் குழுக்களைக் குறிக்கும் பன்மைச்சொல். ‘சபைகளில்’ என்பது பன்மையையும் வழிபாட்டுக்காகக் கூடும் சூழலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּרְכוּ
  choice: வாழ்த்துங்கள்
  rationale: בָּרְכוּ என்பது பன்மை ஏவல் வடிவம். கடவுளை நோக்கிய வழிபாட்டு மொழியில் ‘வாழ்த்துங்கள்’ என்பது சொல்லின் அடிப்படைப் பொருளைக் காக்கிறது; ‘துதியுங்கள்’ என்பது சூழலுக்கு ஏற்றதாக இருந்தாலும் சொற்பொருளைச் சற்றே மாற்றும்.
- source_word: אֱלֹהִים
  choice: கடவுளை
  rationale: இங்கு יְהוָה என்பதுடன் ஒரே இறைவரைக் குறிப்பதால் ஒருமைப் பொருளில் உள்ளது. தமிழ் வேற்றுமை உருபு இதை בָּרְכוּ வினையின் நேரடிச் செயப்படுபொருளாகத் தெளிவாக்குகிறது.
- source_word: יְהוָה
  choice: யாவேவை
  rationale: திருநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குகிறது. இங்கு ‘கடவுள்’ என்பதற்கு இணைப்பெயராகவும் வினையின் செயப்படுபொருளாகவும் அமைவதால் ‘யாவேவை’ என வேற்றுமை பெறுகிறது.
- source_word: מִמְּקוֹר יִשְׂרָאֵל
  choice: இஸ்ரவேலின் ஊற்றிலிருந்து வந்தவர்களே
  rationale: מָקוֹר என்பதன் ‘ஊற்று/மூலம்’ என்ற கவித்துவப் படிமத்தை ‘ஊற்று’ காக்கிறது. מִן குறிக்கும் தோற்றத்தை தமிழில் இயல்பாக்க ‘வந்தவர்களே’ சேர்க்கப்பட்டுள்ளது; எபிரெயத்தில் இச்சொல் வெளிப்படையாக இல்லாததால் மாற்று அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல எபிரெய உரையில் நான்கெழுத்துத் திருநாமம் நேரடியாக உள்ளது. அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: מִמְּקוֹר יִשְׂרָאֵל என்ற சுருக்கமான தொடரின் தொடர்பு
  choice: இஸ்ரவேலின் ஊற்றிலிருந்து வந்த வழிபாட்டாளர்களை அழைக்கும் விளிவாகப் புரிந்துகொள்ளுதல்
  alternative: ‘இஸ்ரவேலின் ஊற்றிலிருந்து’ என்பதை முந்திய கட்டளையுடன் நேரடியாக இணைத்தல்
  rationale: எபிரெயத் தொடர் வினையின்றிச் சுருக்கமாக இருப்பதால் அதன் தொடர்பு தெளிவாக இல்லை. வழிபாட்டாளர்களின் இஸ்ரவேலியத் தோற்றத்தைக் குறிக்கும் விளிவாக வாசிப்பது வாக்கியத்தைத் தமிழில் இயல்பாக்குகிறது; ஆனால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘சபைகள்’ என்பது தேவாலய நிறுவனம் என்ற குறுகிய பொருளில் அல்லாமல் கூடியிருக்கும் மக்கள் குழுக்களைக் குறிக்கிறது. இடைக்கோடுகள் ‘கடவுள்’ மற்றும் ‘யாவே’ ஒரே இறைவரைக் குறிக்கும் இணைப்பெயர்கள் என்பதை வாசிப்பில் தெளிவாக்குகின்றன.
