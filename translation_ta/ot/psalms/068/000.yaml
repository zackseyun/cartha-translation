  text: For the choir director[a]. Of David. A psalm[b]. A song.
translation:
  language: ta
  text: இசைத் தலைவருக்கு[a]. தாவீதுக்குரியது[b]. ஒரு சங்கீதம். ஒரு பாடல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இசை இயக்குநருக்கு’ அல்லது ‘இசை மேற்பார்வையாளருக்கு’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: தலைப்புகளில் வரும் எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவம், அர்ப்பணிப்பு, உடைமை அல்லது தொடர்பு ஆகியவற்றைக் குறிக்கக்கூடும்; ஆகவே ‘தாவீது இயற்றியது’ அல்லது ‘தாவீதுக்காக’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடும் நபரைக் குறிக்கும் மரபுச் சொல்லாக இது புரிந்துகொள்ளப்படுகிறது. ‘இசைத் தலைவர்’ என்பது இன்றைய தமிழில் இயல்பாகவும் தெளிவாகவும் இருந்து, பாடகர் குழுவை மட்டும் குறிப்பதாக வரம்புபடுத்தாது.
- source_word: לְדָוִד
  choice: தாவீதுக்குரியது
  rationale: לְ என்ற எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவம், அர்ப்பணிப்பு, உடைமை அல்லது தொடர்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதுக்குரியது’ என்பது ‘தாவீது இயற்றியது’ என்று பொருளைச் சுருக்காமல் அந்த விரிவை ஓரளவு காக்கிறது.
- source_word: מִזְמוֹר
  choice: ஒரு சங்கீதம்
  rationale: இசைக்கருவி இசையுடன் பாடப்படும் பாடல்வகையைக் குறிக்கும் இச்சொல்லுக்கு, வேதாகமத் தமிழில் நன்கு அறியப்பட்டதும் இயல்பானதுமான ‘சங்கீதம்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: שִׁיר
  choice: ஒரு பாடல்
  rationale: எபிரெய மூலத்தில் உள்ள இரு வகைப்பெயர்களையும் ஒன்றாக்காமல் காக்க, שִׁיר நேரடியாக ‘ஒரு பாடல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: לְדָוִד என்பதன் தொடர்பு அல்லது ஆசிரியத்துவம்
  choice: தாவீதுக்குரியது
  alternative: தாவீது இயற்றியது / தாவீதுக்காக
  rationale: தலைப்பிலுள்ள எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவத்தை மட்டும் கட்டாயப்படுத்தவில்லை. ஆகவே மூலத்தின் உண்மையான பொருள் விரிவு தீர்மானிக்கப்படாமல் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான சங்கீதத் தலைப்பாக வடிவமைக்கப்பட்டுள்ளது. மரியாதையான வேதாகம நடையைத் தக்கவைத்தபடியே பழமையான இசைச் சொற்கள் தவிர்க்கப்பட்டுள்ளன. எபிரெய மூலத்தின் நான்கு கூறுகளும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
