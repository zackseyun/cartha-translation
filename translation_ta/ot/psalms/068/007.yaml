  text: אֱֽלֹהִ֗ים בְּ֭/צֵאתְ/ךָ לִ/פְנֵ֣י עַמֶּ֑/ךָ בְּ/צַעְדְּ/ךָ֖ בִֽ/ישִׁימ֣וֹן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/007.yaml
  text: God[a], when you went out before your people, when you marched through the wilderness—Selah
translation:
  language: ta
  text: 'இறைவனே, நீர் உமது மக்களுக்கு முன்பாகப் புறப்பட்டபோது,

    நீர் பாழ்நிலத்தின் வழியாக நடந்து சென்றபோது—செலா[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “செலா” என்பதன் துல்லியமான பொருள் தெரியவில்லை; இது ஓர் இசை அல்லது வழிபாட்டுக் குறியீடாக இருக்கலாம்.
    reason: textual_or_liturgical_term
lexical_decisions:
- source_word: אֱלֹהִים
  choice: இறைவனே
  rationale: சூழலில் இது இறைவனை நேரடியாக விளிக்கும் சொல்லாக உள்ளது. எபிரெயத்தில் தனி விளித்தல் இடைச்சொல் இல்லாவிட்டாலும், தமிழில் இயல்பான நேரடி அழைப்பைத் தெளிவுபடுத்த ‘இறைவனே’ என வழங்கப்படுகிறது.
- source_word: בְּצֵאתְךָ
  choice: நீர் ... புறப்பட்டபோது
  rationale: בְּ + வினையெச்சப் பெயர் மற்றும் இரண்டாம் நபர் ஒருமை பின்னொட்டு இங்கு காலப்பொருளைத் தருவதால், நிகழ்வை இயல்பாகக் காட்டும் ‘புறப்பட்டபோது’ தெரிவுசெய்யப்பட்டது.
- source_word: לִפְנֵי עַמֶּךָ
  choice: உமது மக்களுக்கு முன்பாக
  rationale: இறைவன் தம் மக்களை முன்னின்று வழிநடத்தும் காட்சியை לִפְנֵי என்பதற்குரிய ‘முன்பாக’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְּצַעְדְּךָ
  choice: நீர் ... அணிவகுத்துச் சென்றபோது
  rationale: צעד என்பது காலடி எடுத்து நடத்தல் அல்லது அணிவகுத்துச் செல்லுதல் என்ற பொருளுடையது. இணைவரியின் நோக்கமுள்ள, மேன்மையான நகர்வை ‘அணிவகுத்துச் சென்றபோது’ வெளிப்படுத்துகிறது.
- source_word: בִישִׁימוֹן
  choice: பாழ்நிலத்தின் வழியாக
  rationale: יְשִׁימוֹן குடியிருப்பற்ற வறண்ட பாழ்நிலத்தைக் குறிக்கிறது. இயக்க வினையுடன் ‘வழியாக’ என்பது தமிழில் இயல்பாக அமைகிறது; ‘பாலைவனம்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் பரந்த பாழ்நிலப் பொருளை இது காக்கிறது.
- source_word: סֶלָה
  choice: செலா
  rationale: இதன் துல்லியமான பொருள் உறுதியற்றது; இது இசை அல்லது வழிபாட்டுக் குறியீடாக இருக்கலாம். உறுதியற்ற பொருளைத் தீர்மானித்து மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: வனாந்தரப் பயணத்தில் இறைவனின் செயல்
  choice: இறைவன் தம் மக்களுக்கு முன்பாகச் சென்றதை நினைவுகூரும் நேரடி விளிப்பாக மொழிபெயர்த்தல்
  alternative: இறைவனை நேரடியாக விளிக்காத ஒரு விவரிப்பாக மொழிபெயர்த்தல்
  rationale: சொற்றொடர் அமைப்பும் சங்கீதத்தின் விரிந்த சூழலும் நேரடி விளிப்பை ஆதரிக்கின்றன. இறைவன் மக்களை வழிநடத்திய வரலாற்றுக் குறிப்பைத் தக்கவைத்து, உரையில் இல்லாத கூடுதல் கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், மரியாதைக்குரிய ‘நீர்/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. கவிதை இணைநிலை இரு வரிகளாகப் பாதுகாக்கப்பட்டுள்ளது; அரிதான ‘பாழ்நிலம்’ சூழலுக்கு ஏற்ற தெளிவான சொல்லாக உள்ளது.
