  text: God is to us a God of salvations[b][a], and to the Lord GOD belong escapes from death.
translation:
  language: ta
  text: கடவுள் நமக்கு மீட்புகளின் கடவுள்[a]; மரணத்திலிருந்து தப்பும் வழிகள்[b] யாவேவாகிய ஆண்டவருக்கே உரியவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மீட்புகளை அருளும் கடவுள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘மீட்புகள்’ என்பது பன்மையில் உள்ளது; இது மீண்டும் மீண்டும் நிகழும் அல்லது பலவகையான மீட்புகளை வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘மரணத்துக்கான வெளியேறும் வழிகள்.’ இங்கு மரணத்திலிருந்து தப்பும் வழிகள் என்பதே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל ... אֵל
  choice: கடவுள் ... கடவுள்
  rationale: எபிரெய மூலத்தில் אֵל இருமுறை வருவதால், அதன் வலியுறுத்தலைக் காக்கத் தமிழிலும் ‘கடவுள்’ இருமுறை வைக்கப்பட்டுள்ளது.
- source_word: לָנוּ
  choice: நமக்கு
  rationale: ל முன்னிடைச்சொல் இங்கு உறவையும் நன்மை பெறுபவரையும் குறிக்கிறது; ‘நமக்கு’ என்பது மூல அமைப்புக்கு நெருக்கமான இயல்பான தமிழ்.
- source_word: לְמוֹשָׁעוֹת
  choice: மீட்புகளை வழங்கும்
  rationale: מוֹשָׁעוֹת என்பது பன்மை. தமிழில் இயல்பாகப் புரியும்படியும், பலமுறை அல்லது பலவகையில் நிகழும் மீட்புகள் என்ற பன்மை நுணுக்கத்தை முடிந்தவரை காக்கும்படியும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְלֵיהוָה אֲדֹנָי
  choice: ஆண்டவராகிய யாவேவிடமே
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற தனிப்பெயரையும் வேறுபடுத்திக் காட்டுகிறது; לֵ இங்குள்ள உடைமை/சார்பு உறவு ‘விடமே’ என்பதால் வெளிப்படுகிறது.
- source_word: לַמָּוֶת תּוֹצָאוֹת
  choice: மரணத்திலிருந்து தப்பும் வழிகள்
  rationale: תּוֹצָאוֹת என்பதன் அடிப்படைப் பொருள் ‘வெளியேறும் இடங்கள்/வழிகள்.’ மரணத்தோடு இணையும் இச்சூழலில், மரணத்திலிருந்து தப்புவதற்கான வழிகள் என்பதே இயல்பான பொருள்; பன்மையும் காக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה மற்றும் אֲדֹנָי இணைந்து வரும் இறைப்பெயரை மொழிபெயர்த்தல்
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர்
  rationale: மூலத்தில் உள்ள ‘ஆண்டவர்’ என்ற பட்டத்தையும் YHWH என்ற உடன்படிக்கைப் பெயரையும் ஒன்றில் ஒன்றாகக் கரைக்காமல் தனித்தனியாகப் பாதுகாக்கிறது.
- issue: ‘மீட்புகள்’ என்ற பன்மையின் பொருள்
  choice: மீட்புகளை வழங்கும்
  alternative: மீட்கும்
  rationale: எபிரெய பன்மை பலமுறை நிகழும் அல்லது பலவகையான மீட்புகளைக் குறிக்கக்கூடும். அதை ஒற்றை, பொதுவான ‘மீட்கும்’ எனச் சுருக்காமல் உரையில் வெளிப்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘மீட்புகளை வழங்கும்’ என்பது வழக்கத்தைவிடச் சற்றுக் குறியிடப்பட்ட சொற்றொடராக இருந்தாலும், மூலத்தின் பன்மையையும் இருமுறை வரும் ‘கடவுள்’ என்ற வலியுறுத்தலையும் காக்கிறது.
