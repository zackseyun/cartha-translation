  yaml_path: translation/ot/psalms/068/009.yaml
  text: You sent abundant rain[a], O God; when your inheritance was weary[b], you established it.
translation:
  language: ta
  text: தேவனே, தாராளமான மழையைப் பொழியச் செய்தீர்[a]; உமது சுதந்தரம் களைத்திருந்தபோது[b], அதை நிலைநிறுத்தினீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மிகுதியான மழை’ அல்லது ‘தாராளக் கொடையாகிய மழை’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் தேவனுடைய மிகுந்த தாராளத்தை வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உமது சுதந்தரம்’ என்பது தேவனுடைய மக்களையோ, நாட்டையோ, அல்லது கவிதைநயத்தில் இரண்டையுமோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  choice: தாராளமான மழை
  rationale: நְדָבוֹת என்பது மனமுவந்த கொடை அல்லது தாராளத்துடன் தொடர்புடைய சொல்; மழையுடன் சேர்ந்த இச்சொற்றொடர் தேவனுடைய மிகுந்த கொடையை உணர்த்துகிறது. ‘தாராளமான மழை’ அந்த உருவகத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: תָּנִיף
  choice: பொழியச் செய்தீர்
  rationale: נוּף என்பதன் ஹிஃபில் வடிவம் அசைக்க அல்லது வீசச் செய்யும் அடிப்படைக் கருத்தைக் கொண்டது; மழைச் சூழலில் அதை விழச் செய்த தெய்வீகச் செயலை ‘பொழியச் செய்தீர்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: இது நேரடி அழைப்பாக இருப்பதால், நவீனத் தமிழில் கவிதைநயமும் கண்ணியமும் கொண்ட அழைப்புமுறை பயன்படுத்தப்பட்டது.
- source_word: נַחֲלָתְךָ
  choice: உமது உரிமைச்சொத்து
  rationale: נַחֲלָה என்பது சுதந்தரம், பங்காகக் கிடைத்த உடைமை, அல்லது உரிமைச்சொத்து எனப் பொருள்படும். இங்கு மக்கள், நாடு, அல்லது இரண்டும் குறிக்கப்படக்கூடியதால், குறிப்பைச் சுருக்காமல் ‘உரிமைச்சொத்து’ என வைக்கப்பட்டது.
- source_word: וְנִלְאָה
  choice: களைத்திருந்தபோது
  rationale: பெண்பால் ஒருமை வடிவம் முந்தைய ‘உரிமைச்சொத்து’ என்பதோடு இயைந்து, களைப்பு அல்லது தளர்ச்சியைக் குறிக்கிறது. தமிழில் தொடர்பை இயல்பாக்க காலநிலைத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: כּוֹנַנְתָּהּ
  choice: அதை நிலைநிறுத்தினீர்
  rationale: כּון வினை உறுதிப்படுத்துதல், நிலைபெறச் செய்தல், ஒழுங்குபடுத்துதல் ஆகிய கருத்துகளை உடையது. ‘நிலைநிறுத்தினீர்’ என்பது நிலத்துக்கும் மக்களுக்கும் பொருந்தக்கூடிய அதன் மையப் பொருளைக் காக்கிறது.
theological_decisions:
- issue: ‘உமது உரிமைச்சொத்து’ என்பதன் குறிப்பு
  choice: நிலமா மக்களா என்று குறிப்பிடாமல் ‘உமது உரிமைச்சொத்து’ என்று வைத்தல்
  alternative: இஸ்ரவேல் நாடு; இஸ்ரவேல் மக்கள்; அல்லது இரண்டும்
  rationale: எபிரெயக் கவிதை தேவனுக்குரிய மக்கள், அவர்களுடைய நாடு, அல்லது இரண்டையும் ஒருங்கே குறிக்கக்கூடும். ஒரு குறிப்பிட்ட விளக்கத்தைத் திணிக்காமல் அந்த இறையியல் விரிவும் தெளிவின்மையும் பாதுகாக்கப்பட்டன.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு அணுக்கமான, கண்ணியமுள்ள கவிதைநடை பயன்படுத்தப்பட்டது. ‘தேவனே’, ‘உமது’, ‘செய்தீர்’ ஆகிய வடிவங்கள் நேரடி அழைப்பின் மரியாதைநிலையைப் பேணுகின்றன; அரிதான சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டன.
