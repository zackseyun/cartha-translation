  source_fidelity: மூல எபிரெயத்தின் பட்டியல்-அமைப்பும் முக்கியச் சொற்களும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன. שָׁם என்பதற்கு “அங்கே,” בִּנְיָמִן צָעִיר என்பதற்கு “சிறிய பென்யமீன்,” רֹדֵם என்பதற்கு ஊர்வலச் சூழலில் “அவர்களை வழிநடத்துகிறான்,” மற்றும் רִגְמָתָם என்பதற்கு உறுதியற்ற குழு/திரள் பொருளைத் தரும் “தங்கள் திரளோடு” ஆகியவை பொருத்தமானவை. ரֹדֵם-இன் ஆட்சிசார் மாற்றுப்பொருளும், ரִגְמָתָם-இன் சொற்பொருள் உறுதியின்மையும் அடிக்குறிப்புகளில் காக்கப்பட்டுள்ளன.
