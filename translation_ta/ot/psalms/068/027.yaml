source:
  edition: WLC
  text: שָׁ֤ם בִּנְיָמִ֨ן צָעִ֡יר רֹדֵ֗/ם שָׂרֵ֣י יְ֭הוּדָה רִגְמָתָ֑/ם שָׂרֵ֥י זְ֝בֻל֗וּן שָׂרֵ֥י נַפְתָּלִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/027.yaml
  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
translation:
  language: ta
  text: அங்கே சிறிய பென்யமீன் அவர்களை வழிநடத்துகிறான்[a]; யூதாவின் தலைவர்கள் தங்கள் திரளோடு[b] இருக்கிறார்கள்; செபுலோனின் தலைவர்களும் நப்தலியின் தலைவர்களும் இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களை ஆளுகிறான்” / “அவர்கள்மேல் அதிகாரம் செலுத்துகிறான்.” எபிரெயச் சொல் ஆட்சியையோ முன்னிலையையோ குறிக்கலாம்; இங்குள்ள ஊர்வலச் சூழலைக் கருத்தில் கொண்டு முதன்மை உரையில் “வழிநடத்துகிறான்” எனத் தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தங்கள் கூட்டத்தோடு,” “தங்கள் பெருந்திரளோடு.” இங்குள்ள எபிரெயச் சொல் அரிதானது; அதன் துல்லியமான நுண்பொருள் உறுதியற்றது. யூதாவின் தலைவர்களுடன் சேர்ந்துள்ள ஒரு குழுவை அது குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: அங்கே
  rationale: இடத்தைச் சுட்டும் எபிரெய வினையடை. தமிழில் பட்டியலை இயல்பாகத் தொடங்கும் வகையில் ‘அங்கே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בִּנְיָמִן צָעִיר
  choice: சிறிய பென்யமீன்
  rationale: צָעִיר என்பதற்கு ‘சிறியவன்/இளையவன்’ என்ற பொருள்கள் உண்டு. இங்கு வயதைவிட கோத்திரத்தின் சிறிய நிலையைச் சுட்டுவது பொருத்தமாக இருப்பதால் ‘சிறிய’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: רֹדֵם
  choice: அவர்களை வழிநடத்துகிறான்
  rationale: ஆளுதல் அல்லது அதிகாரம் செலுத்துதல் என்ற அடிப்படை நுண்பொருளைக் கொண்ட வினையெச்ச வடிவம்; ஊர்வலச் சூழலில் முன்னின்று நடத்துவதை இயல்பாக வெளிப்படுத்த ‘வழிநடத்துகிறான்’ பயன்படுத்தப்பட்டது. ஆட்சிசெய்தல் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: שָׂרֵי
  choice: தலைவர்கள்
  rationale: שַׂר என்பதன் பன்மை இணைப்பு வடிவம்; கோத்திரங்களின் உயர்நிலைத் தலைவர்களைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருப்பதால் ‘தலைவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: רִגְמָתָם
  choice: தங்கள் திரளோடு
  rationale: மிக அரிதானதும் துல்லியப் பொருள் உறுதியற்றதுமான சொல்; ஒரு கூட்டம் அல்லது திரள் என்ற பொதுவான கருத்தைச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: கோத்திரப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: זְבֻלוּן
  choice: செபுலோன்
  rationale: கோத்திரப் பெயரின் தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு.
- source_word: נַפְתָּלִי
  choice: நப்தலி
  rationale: கோத்திரப் பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
theological_decisions:
- issue: רֹדֵם என்பதன் ஆட்சி அல்லது ஊர்வல முன்னிலை சார்ந்த நுண்பொருள்
  choice: முதன்மை உரையில் ‘வழிநடத்துகிறான்’
  alternative: ‘அவர்களை ஆளுகிறான்’ அல்லது ‘அவர்கள்மேல் அதிகாரம் செலுத்துகிறான்’
  rationale: சங்கீதத்தின் இப்பகுதி ஒரு ஊர்வலத்தைக் காட்சிப்படுத்துவதால் வழிநடத்துதல் சூழலுக்கு இயல்பானது; எனினும் மூலச்சொல்லின் ஆட்சிசார் வலிமை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்தையும் எளிய புரிதலையும் இணைக்கும் நடை பயன்படுத்தப்பட்டது. எபிரெயப் பட்டியல் தமிழில் முழுமையான வாக்கியமாக ஒலிக்க ‘இருக்கிறார்கள்’ சேர்க்கப்பட்டது; மூலத்தின் அணிவகுப்பு அமைப்பு அரைப்புள்ளிகளால் பாதுகாக்கப்பட்டது.
