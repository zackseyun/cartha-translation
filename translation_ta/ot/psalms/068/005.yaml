theological_decisions:
- issue: דַיַּן என்பதைப் பாதுகாப்புச் சார்ந்த சொல்லாக மொழிபெயர்ப்பதா
  choice: நீதி வழங்குகிறவர்
  alternative: விதவைகளின் பாதுகாவலர்
  rationale: சூழலில் விதவைகளுக்கான பாதுகாப்பு உட்பொருளாக இருந்தாலும், எபிரேயச் சொல் முதன்மையாக நியாயந்தீர்த்தல் அல்லது நீதி நிர்வாகத்தைக் குறிக்கிறது. ஆகவே பாதுகாப்பு என்ற விளைவை மட்டும் முன்னிறுத்தாமல் சட்டநீதிப் படிமம் காக்கப்படுகிறது.
- issue: בִּמְעוֹן קָדְשׁוֹ என்பது இருப்பிடத்தையா செயலின் தொடக்க இடத்தையா குறிக்கிறது
  choice: தமது பரிசுத்த வாசஸ்தலத்தில்
  alternative: தமது பரிசுத்த வாசஸ்தலத்திலிருந்து
  rationale: בְּ- என்ற எபிரேய முன்னொட்டு நேரடியாக ‘இல்’ என்று பொருள்படும். ‘இலிருந்து’ என்பது கடவுள் அங்கிருந்து செயல்படுகிறார் என்ற பொருளை விளக்கினாலும், அது மூலத்தில் வெளிப்படையாக இல்லாத திசைநிலையைச் சேர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தையும் பொதுவாசகருக்கான தெளிவையும் இணைக்கும் நடை. ‘தகப்பன்’, ‘பரிசுத்த வாசஸ்தலம்’ ஆகியவை வேதாகமச் சூழலுக்கு ஏற்ற உயர்ந்த சொற்களாக இருந்தாலும் எளிதில் புரியக்கூடியவை. எபிரேயத்தின் வினையற்ற அடையாள வாக்கியம் தமிழில் தெளிவாக அமைய ‘கடவுளே’ மற்றும் ‘இருக்கிறார்’ பயன்படுத்தப்பட்டுள்ளன.
