lexical_decisions:
- source_word: אֲבִי
  choice: தகப்பன்
  rationale: אָב என்பதன் கட்டிணை வடிவம். வினைச்சொல் இல்லாத எபிரேயக் கவிதை வாக்கியத்தில், பின்னர் வரும் אֱלֹהִים என்பதைக் குறித்து பயனிலையாகச் செயல்படுகிறது.
- source_word: יְתוֹמִים
  choice: தகப்பனற்றவர்கள்
  rationale: முதன்மையாகத் தந்தையை இழந்த பிள்ளைகளைக் குறிக்கிறது; அவர்களின் சமூகப் பாதுகாப்பின்மையையும் வெளிப்படுத்துகிறது. ‘அனாதைகள்’ என்பது இயல்பான மாற்றுச் சொல் என்றாலும், அது பெற்றோர் இருவரையும் இழந்தவர்கள் என்ற பரந்த பொருளில் புரிந்துகொள்ளப்படலாம்.
- source_word: דַיַּן
  choice: நீதி வழங்குகிறவர்
  rationale: நியாயந்தீர்ப்பவர் அல்லது நீதியை நிர்வகிப்பவர் என்பதே சொல்லின் நேரடிப் பொருள். நவீனத் தமிழில் ‘விதவைகளின் நீதிபதி’ என்பதில் ஏற்படக்கூடிய தெளிவின்மையைத் தவிர்த்து, நீதித்துறை சார்ந்த மூலப் படிமத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַלְמָנוֹת
  choice: விதவைகள்
  rationale: கணவரை இழந்த பெண்களைக் குறிக்கும் வழக்கமான, நேரடியான தமிழ் இணைச்சொல்.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு வடிவத்தில் பன்மையாக இருந்தாலும் ஒருமைப் பொருளுடைய வாக்கிய எழுவாய்; நவீன நிலையான தமிழில் இயல்பான மொழிபெயர்ப்பு ‘கடவுள்’.
