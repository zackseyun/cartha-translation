  yaml_path: translation/ot/psalms/068/017.yaml
  text: The chariots of God are myriads[a], thousands upon thousands; the Lord is among them[c][b], Sinai in holiness.
translation:
  language: ta
  text: தேவனுடைய தேர்கள் பதினாயிரங்கள் பல, ஆயிரமாயிரங்கள்[a]; ஆண்டவர் அவற்றின் நடுவில் இருக்கிறார்—சீனாய் பரிசுத்தத்தில்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொற்படி, ‘ஷின்ஆனின் ஆயிரங்கள்.’ ‘ஷின்ஆன்’ என்பது அரிதான, பொருள் உறுதியாகத் தெரியாத சொல்; அது மீள்மீளும் பெருக்கத்தையோ எண்ணற்ற மிகுதியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இந்த எபிரெயக் கூற்று மிகவும் சுருக்கமானதும் பொருள் காணக் கடினமானதுமாகும். ‘ஆண்டவர் அவற்றின் நடுவில், சீனாயில் இருந்ததுபோல், பரிசுத்தத்தில் இருக்கிறார்,’ ‘ஆண்டவர் அவற்றின் நடுவில் இருக்கிறார்; சீனாய் பரிசுத்த ஸ்தலத்தில் இருக்கிறது,’ அல்லது ‘ஆண்டவர் சீனாயிலிருந்து பரிசுத்த ஸ்தலத்துக்கு வந்திருக்கிறார்’ என்றும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  choice: தேவனுடைய தேர்கள்
  rationale: רֶכֶב என்பது கூட்டுப்பொருளில் தேர்களையோ தேர்ப்படையையோ குறிக்கலாம். தமிழில் இயல்பாகவும் மூல உருவகத்தைத் தெளிவாகவும் காக்கும் வகையில் ‘தேவனுடைய தேர்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: רִבֹּתַיִם
  choice: பல்லாயிரக்கணக்கானவை
  rationale: இருமை வடிவம் சொற்பட ‘இரண்டு பதினாயிரங்கள்’ எனக் கொள்ளப்படலாம்; கவிதைச் சூழலில் அளவற்ற பெருந்தொகையை உணர்த்துவதால், துல்லியமான கணக்கைத் திணிக்காமல் ‘பல்லாயிரக்கணக்கானவை’ என வழங்கப்பட்டது.
- source_word: אַלְפֵי שִׁנְאָן
  choice: ஆயிரமாயிரமானவை
  rationale: שִׁנְאָן அரிதானதும் பொருள் உறுதியாகத் தெரியாததுமான சொல். திரும்பத் திரும்பப் பெருகும் எண்ணிக்கை அல்லது மிகுதியை இது குறிக்கலாம்; ‘ஆயிரமாயிரமானவை’ அந்தச் சாத்தியமான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: தெய்வீக ஆட்சியுரிமையைக் குறிக்கும் பட்டமாகிய אֲדֹנָי என்பதற்கு நவீன வேதாகமத் தமிழில் இயல்பான ‘ஆண்டவர்’ பயன்படுத்தப்பட்டது.
- source_word: בָם
  choice: அவற்றின் நடுவில்
  rationale: בָם என்பதற்கு ‘அவற்றில்’, ‘அவற்றோடு’, ‘அவற்றின் நடுவில்’ என்று பொருள் கொள்ளலாம். தேர்களின் பெருந்திரளுக்குள் ஆண்டவர் இருப்பதைத் தமிழில் தெளிவாகக் காட்ட ‘அவற்றின் நடுவில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: סִינַי
  choice: சீனாய்
  rationale: இடப்பெயர் தமிழின் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தரப்பட்டது.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்தத்தில்
  rationale: קֹדֶשׁ என்பது பரிசுத்தம் என்ற பண்பையோ பரிசுத்த இடம் அல்லது பரிசுத்த ஸ்தலம் என்ற இடப்பொருளையோ குறிக்கலாம். மூலத்தின் சுருக்கத்தையும் இருபொருள் வாய்ப்பையும் காக்க ‘பரிசுத்தத்தில்’ என வழங்கப்பட்டது.
theological_decisions:
- issue: אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ என்ற சுருக்கமான இறுதிக் கூற்றின் தொடர்பு
  choice: ஆண்டவர் அவற்றின் நடுவில் இருக்கிறார்—சீனாய் பரிசுத்தத்தில்
  alternative: ஆண்டவர் அவற்றின் நடுவில், சீனாயில் இருந்ததுபோல், பரிசுத்தத்தில் இருக்கிறார்; அல்லது ஆண்டவர் சீனாயிலிருந்து பரிசுத்த ஸ்தலத்துக்கு வந்திருக்கிறார்
  rationale: எபிரெயக் கூற்று இணைப்புச் சொற்களின்றி மிகவும் சுருக்கமாக உள்ளது. ‘இருந்ததுபோல்’ என்ற ஒப்பீட்டையோ ‘வந்தார்’ என்ற இயக்கத்தையோ முதன்மை உரையில் சேர்த்தால் இல்லாத சொற்கள் மூலம் பொருள் தீர்மானிக்கப்படும். ஆகவே மூலத்தின் கவித்துவச் சுருக்கமும் இறையிருப்பைக் குறித்த பதற்றமும் காக்கப்பட்டு, முக்கிய மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்பட்டன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘பல்லாயிரக்கணக்கானவை, ஆயிரமாயிரமானவை’ என்ற இணைப்பு பெருந்திரளின் கவித்துவத் தீவிரத்தை வெளிப்படுத்துகிறது. இறுதிக் கூற்றின் இயல்பான எபிரெயச் சுருக்கம் தமிழிலும் திட்டமிட்டு ஓரளவு காக்கப்பட்டு, வாசிப்பு வாய்ப்புகள் அடிக்குறிப்பில் விளக்கப்பட்டன.
