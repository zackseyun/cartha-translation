base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/022.yaml
  text: The Lord said[a], “I will bring them back from Bashan; I will bring them back from the depths of the sea,”
translation:
  language: ta
  text: 'ஆண்டவர் சொன்னார்[a]: “பாசானிலிருந்து அவர்களைத் திரும்பக் கொண்டுவருவேன்; கடலின் ஆழங்களிலிருந்து அவர்களைத் திரும்பக் கொண்டுவருவேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்சொல்லான மொழிபெயர்ப்பு: “பாசானிலிருந்து திரும்பக் கொண்டுவருவேன்; கடலின் ஆழங்களிலிருந்து திரும்பக் கொண்டுவருவேன்.” எபிரெய மூலத்தில் யாரைத் திரும்பக் கொண்டுவருவார் என்பது வெளிப்படையாகக் கூறப்படவில்லை.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: இது יהוה என்ற இறைப்பெயர் அல்ல, தெய்வீகப் பட்டமான אֲדֹנָי. நவீனத் தமிழில் மரியாதையும் இயல்பும் கொண்ட ‘ஆண்டவர்’ அதைப் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: אָמַר
  choice: சொன்னார்
  rationale: தெய்வீக உரையை அறிமுகப்படுத்தும் qatal வடிவத்தின் நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: מִבָּשָׁן
  choice: பாசானிலிருந்து
  rationale: בָּשָׁן என்பது இடப்பெயர்; அது ‘பாசான்’ என ஒலிபெயர்க்கப்பட்டு, מִן ‘-இலிருந்து’ என வழங்கப்படுகிறது.
- source_word: אָשִׁיב ... אָשִׁיב
  choice: அவர்களைத் திரும்பக் கொண்டுவருவேன் ... அவர்களைத் திரும்பக் கொண்டுவருவேன்
  rationale: שׁוב என்பதன் Hiphil வடிவம் ‘திரும்பக் கொண்டுவருதல்’ எனும் செயப்படுபொருள் குன்றா பொருளைக் கொண்டது. எபிரெயத்தில் விடப்பட்டுள்ள செயப்படுபொருள் தமிழின் இயல்புக்காகச் சூழலிலிருந்து ‘அவர்களை’ என நிரப்பப்பட்டுள்ளது; வலியுறுத்தும் மறுபடியும் கூறுதல் காக்கப்பட்டுள்ளது.
- source_word: מִמְּצֻלוֹת יָם
  choice: கடலின் ஆழங்களிலிருந்து
  rationale: מְצֻלוֹת என்பது குறிப்பாக நீரின் ஆழமான இடங்களைக் குறிக்கிறது. ‘கடலின் ஆழங்கள்’ இயல்பான தமிழில் அந்தத் தொலைவு மற்றும் அபாயப் படிமத்தைக் காக்கிறது.
theological_decisions:
- issue: மீண்டும் வரும் אָשִׁיב வினையின் வெளிப்படையாகக் கூறப்படாத செயப்படுபொருள்
  choice: சூழலிலிருந்து ‘அவர்களை’ என நிரப்பி, ‘அவர்களைத் திரும்பக் கொண்டுவருவேன்’ என்று மொழிபெயர்த்தல்
  alternative: செயப்படுபொருளை நிரப்பாமல், ‘பாசானிலிருந்து திரும்பக் கொண்டுவருவேன்; கடலின் ஆழங்களிலிருந்து திரும்பக் கொண்டுவருவேன்’ என வழங்குதல்
  rationale: எபிரெயம் செயப்படுபொருளை வெளிப்படையாகக் கூறவில்லை. தமிழில் ‘திரும்பக் கொண்டுவருவேன்’ என்பதற்கு செயப்படுபொருள் இயல்பாக எதிர்பார்க்கப்படுவதால் ‘அவர்களை’ சேர்க்கப்பட்டுள்ளது. எனினும், மூலத்தின் இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது; அவர்கள் தேவனுடைய மக்களா அல்லது எதிரிகளா என்பதை வசனம் தனியே தீர்மானிப்பதாகக் கூறப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கவிதை வரியின் இணை அமைப்பும் மீளுரையும் காக்கப்பட்டுள்ளன; ‘பாசான்’ இடப்பெயராக ஒலிபெயர்க்கப்பட்டுள்ளது.
