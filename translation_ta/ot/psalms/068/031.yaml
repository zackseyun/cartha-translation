  text: יֶאֱתָ֣יוּ חַ֭שְׁמַנִּים מִנִּ֣י מִצְרָ֑יִם כּ֥וּשׁ תָּרִ֥יץ יָ֝דָ֗י/ו לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/031.yaml
  text: Nobles shall come from Egypt[b][a]; Cush shall quickly stretch out its hands to God.
translation:
  language: ta
  text: எகிப்திலிருந்து மேன்மக்கள்[a] வருவார்கள்; கூஷ் கடவுளை நோக்கித் தன் கைகளை விரைவாக நீட்டும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேன்மக்கள்’ என்பதற்கு ‘தூதர்கள்’ அல்லது ‘இளவரசர்கள்’ என்றும் மொழிபெயர்க்கலாம். அரிதான எபிரெயச் சொல் எகிப்திலிருந்து வரும் உயர்நிலையிலுள்ள நபர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘கூஷ் கடவுளை நோக்கித் தன் கைகளை நீட்ட விரையும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் மனிதராக உருவகிக்கப்படும் நாட்டைக் குறிக்க ஒருமை பின்னொட்டு பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱתָיוּ
  choice: வருவார்கள்
  rationale: Qal imperfect 3mp வடிவம் இச்சூழலில் வருதல் அல்லது வந்துசேர்தல் என்பதையே இயல்பாகக் குறிக்கிறது; காணிக்கை கொண்டுவருதல் என்ற விரிவாக்கம் வினையிலேயே வெளிப்படையாக இல்லை.
- source_word: חַשְׁמַנִּים
  choice: மேன்மக்கள்
  rationale: அரிதான இச்சொல் உயர்நிலையிலுள்ள முக்கிய நபர்களைக் குறிக்கிறது. தூதர்கள் அல்லது இளவரசர்கள் என்று பங்கை மிகத் துல்லியமாக நிர்ணயிக்காமல், நவீன தமிழில் இயல்பாக ‘மேன்மக்கள்’ என வழங்கப்பட்டுள்ளது.
- source_word: מִנִּי מִצְרָיִם
  choice: எகிப்திலிருந்து
  rationale: முன்னிடைச்சொல் பிறப்பிடம் அல்லது புறப்படும் இடத்தைக் குறிக்கிறது; ‘எகிப்திலிருந்து’ என்பது நேரான, இயல்பான தமிழ்.
- source_word: כּוּשׁ
  choice: கூஷ்
  rationale: பிற்கால நிலப்பெயரான ‘எத்தியோப்பியா’ என்பதற்குப் பதிலாக எபிரெய இடப்பெயரின் ஒலிவடிவம் பாதுகாக்கப்படுகிறது.
- source_word: תָּרִיץ
  choice: விரைவாக நீட்டும்
  rationale: רוץ என்பதன் Hiphil வடிவம் விரைவு அல்லது விரையச் செய்தல் என்ற கூறைக் கொண்டது; ‘கைகள்’ என்ற செயப்படுபொருளுடன், கைகளை விரைவாக நீட்டுதல் என்பதே சூழலுக்கேற்ற தமிழ்.
- source_word: יָדָיו
  choice: தன் கைகளை
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு, ஒருமை இடப்பெயரான கூஷோடு இலக்கணரீதியாகப் பொருந்துகிறது. நாட்டை மனிதராக உருவகிக்கும் தன்மையை ‘தன் கைகளை’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: לֵאלֹהִים
  choice: கடவுளை நோக்கி
  rationale: לְ திசையைச் சுட்டுகிறது. கைகளை நீட்டும் உருவகத்துடன் ‘கடவுளை நோக்கி’ என்பது இலக்கு மற்றும் திசை இரண்டையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கூஷ் கடவுளை நோக்கிக் கைகளை நீட்டுவதன் பொருள்
  choice: அடிபணிதல், மன்றாட்டு அல்லது வழிபாடு ஆகியவற்றில் ஒன்றையோ ஒன்றுக்கு மேற்பட்டவற்றையோ குறிக்கக்கூடிய திறந்த உருவகமாக வைக்கப்பட்டது.
  alternative: இது குறிப்பாக அரசியல் காணிக்கை செலுத்துதல் அல்லது முழுமையான உடன்படிக்கைச் சேர்க்கை என்று விளக்குவது.
  rationale: கடவுளை நோக்கிக் கைகளை நீட்டுதல் மன்றாட்டு, வேண்டுதல், அடிபணிதல் அல்லது வழிபாட்டைக் குறிக்கலாம். மூலவசனம் அதன் துல்லியமான வகையை நிர்ணயிக்காததால் மொழிபெயர்ப்பும் அதைச் சுருக்கி நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்குரிய கண்ணியமான ஆனால் பொதுவாசகருக்கு எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. ‘கூஷ்’ என்ற மூல இடப்பெயரும் நாட்டின் மனித உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
