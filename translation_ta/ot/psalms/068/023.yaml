translation:
  language: ta
  text: 'உன் கால் அவர்களை இரத்தத்தில் நசுக்கும்படியாகவும்,


    உன் நாய்களின் நாக்குக்கு எதிரிகளிடமிருந்து அதன் பங்கு கிடைக்கும்படியாகவும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய இறுதித் தொடர் கடினமானதும் சுருக்கமானதும் ஆகும். இறுதியிலுள்ள சொல்லை மிக நேரடியாக “அவனிடமிருந்து” எனவும், சூழலுக்கு ஏற்ப “அவர்களிடமிருந்து” எனவும் புரிந்துகொள்ளலாம்; அதன் தொடர்பு தெளிவாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: …ம்படியாகவும்
  rationale: நோக்கம் அல்லது விளைவை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் விசையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִּמְחַץ
  choice: நசுக்கு
  rationale: מחץ என்ற வேரின் ‘அடித்து நொறுக்கு/நசுக்கு’ என்ற வன்மையான போர்க்களப் படிமத்தைப் பாதுகாக்கிறது. לְמַעַן என்பதோடு இணைந்த வினை வடிவம் தமிழில் ‘நசுக்கும்படியாக’ என வழங்கப்படுகிறது.
- source_word: רַגְלְךָ
  choice: உன் கால்
  rationale: மூலத்தில் ஒருமை இருப்பதால், தமிழிலும் ஒருமை தக்கவைக்கப்படுகிறது.
- source_word: בְּדָם
  choice: இரத்தத்தில்
  rationale: ב என்ற முன்னொட்டின் இடம் அல்லது சூழலைக் குறிக்கும் திறந்த பொருளைத் தக்கவைத்து, இரத்தத்தின் நடுவே நிகழும் நசுக்குதலைத் தெளிவான படிமமாக அளிக்கிறது.
- source_word: לְשׁוֹן כְּלָבֶיךָ
  choice: உன் நாய்களின் நாக்கு
  rationale: ‘நாக்கு’ எனும் எபிரெயக் கூட்டு ஒருமையைத் தமிழிலும் தக்கவைக்கிறது; அது நாய்களை ஒரு தொகுதியாகக் குறிக்கிறது.
- source_word: מֵאֹיְבִים
  choice: எதிரிகளிடமிருந்து
  rationale: מן குறிக்கும் மூலம் அல்லது தோற்றத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִנֵּהוּ
  choice: தன் பங்கைப் பெறும்படியாக
  rationale: இறுதிச் சொற்றொடர் சுருக்கமானதும் பொருள் தெளிவற்றதும் ஆகும். சூழலில் நாய்களின் நாக்கு தோற்கடிக்கப்பட்ட எதிரிகளிடமிருந்து கிடைப்பதை உண்ணும் படிமத்தைப் புரியவைக்க, மிகக் குறைந்த அளவு நிரப்புதலுடன் ‘தன் பங்கைப் பெற’ என வழங்கப்படுகிறது; நேரடி வடிவம் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: வன்மையான சாப/போர்க்களப் படிமம்
  choice: கால் இரத்தத்தில் எதிரிகளை நசைப்பதும் நாய்கள் அவர்களிடமிருந்து பங்கு பெறுவதுமான தெளிவான படிமத்தைத் தக்கவைத்தல்
  alternative: வெற்றியை மட்டும் பொதுவாகச் சொல்லி வன்மையான படிமத்தை மென்மையாக்குதல்
  rationale: மூலவசனம் திட்டமிட்டே கடுமையான போர்க்கள மொழியைப் பயன்படுத்துகிறது. அதை மென்மையாக்குவதற்கு உரை சார்ந்த ஆதாரம் இல்லாததால் அதன் இறையியல் பதற்றமும் வன்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்குரிய கண்ணியத்துடனும் மொழியாக்கப்பட்டுள்ளது. மூலத்தின் ஒருமை வடிவங்களும் கடுமையான போர்க்களப் படிமமும் தக்கவைக்கப்பட்டுள்ளன; தெளிவற்ற இறுதித் தொடர் முதன்மை உரையில் அளவான முறையில் இயல்பாக்கப்பட்டு, அதன் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
