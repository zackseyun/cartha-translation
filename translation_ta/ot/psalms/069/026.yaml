source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֲשֶׁר הִכִּ֣יתָ רָדָ֑פוּ וְ/אֶל מַכְא֖וֹב חֲלָלֶ֣י/ךָ יְסַפֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/026.yaml
  text: For they persecute the one you struck[a], and they recount the pain of those you wounded.
translation:
  language: ta
  text: 'ஏனெனில், நீர் அடித்தவரை அவர்கள் துன்புறுத்துகிறார்கள்;

    நீர் காயப்படுத்தியவர்களின் வேதனையைப் பற்றி விவரித்துச் சொல்கிறார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம் கொல்லப்பட்டோரின் வேதனை.” எபிரெயத்தில் “நீர் காயப்படுத்தியவர்கள்” என மொழிபெயர்க்கப்பட்ட சொல் “உம் குத்தப்பட்டோர்” அல்லது “உம் கொல்லப்பட்டோர்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய காரணத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  choice: நீர் அடித்தவரை
  rationale: எபிரெய உரையின் ஒருமைச் சுட்டையும், கடவுளே அடித்தவர் என்ற செயப்பாட்டையும் தெளிவாகப் பேணுகிறது.
- source_word: רָדָפוּ
  choice: அவர்கள் துன்புறுத்துகிறார்கள்
  rationale: இங்கு வெறும் பின்தொடர்தல் அல்ல, பகைமையுடன் மேலும் தொல்லை கொடுத்தல் குறிக்கப்படுவதால் ‘துன்புறுத்துகிறார்கள்’ சூழலுக்குப் பொருந்துகிறது.
- source_word: וְאֶל
  choice: பற்றிப்
  rationale: אֶל இங்கு பேசப்படும் பொருளை அறிமுகப்படுத்தும் வழக்கில் உள்ளது; ‘பற்றிப் பேசுகிறார்கள்’ என்பது இயல்பான தமிழ் அமைப்பு.
- source_word: מַכְאוֹב
  choice: வேதனையை
  rationale: உடல் அல்லது உள்ளத் துன்பத்தைக் குறிக்கும் சொல்லின் நேரடியான, கவிதைநயமுள்ள தமிழ் இணை.
- source_word: חֲלָלֶיךָ
  choice: நீர் காயப்படுத்தியவர்களின்
  rationale: ‘காயமடைந்தவர்கள்/குத்தப்பட்டவர்கள்’ என்ற பொருளையும், இரண்டாம் நபர் பின்னொட்டில் உள்ள கடவுளுடனான தொடர்பையும் செயப்படுவினை அமைப்பில் இயல்பாகக் காட்டுகிறது; ‘கொல்லப்பட்டவர்கள்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְסַפֵּרוּ
  choice: பேசுகிறார்கள்
  rationale: Piel வடிவம் கூறுதல் அல்லது விவரித்தல் எனப் பொருள்படும். இங்கு வேதனையைத் தமக்குள் எண்ணிக் கணக்கிடுகிறார்கள் என்பதைக் காட்டிலும், அதைப் பற்றிப் பகைமையுடன் பேசுகிறார்கள் என்ற இயல்பான வாசிப்பை வழங்குகிறது.
theological_decisions:
- issue: חֲלָלֶיךָ என்பது ‘நீர் காயப்படுத்தியவர்கள்’ என்றா, ‘நீர் கொன்றவர்கள்’ என்றா?
  choice: நீர் காயப்படுத்தியவர்கள்
  alternative: நீர் கொன்றவர்கள் / நீர் குத்தியவர்கள்
  rationale: ‘வேதனை’ என்பதுடன் இணைந்துள்ளதால் உயிருடன் துன்புறும் காயமடைந்தவர்களைக் குறிக்கும் வாசிப்பு சூழலுக்கு நன்கு பொருந்துகிறது. இருப்பினும், எபிரெயச் சொல் கொல்லப்பட்டவர்களையும் குறிக்கக்கூடும்; அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், கடவுளை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. இரு கவிதை அடிகளின் இணைநிலையும் காரணத் தொடர்பும் பேணப்பட்டுள்ளன; ‘பற்றிப் பேசுகிறார்கள்’ என்பது தெளிவற்ற எபிரெய முன்விகுதி அமைப்பை இயல்பான தமிழில் தருகிறது.
