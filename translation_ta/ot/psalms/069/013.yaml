source:
  edition: WLC
  text: וַ/אֲנִ֤י תְפִלָּתִֽ/י לְ/ךָ֨ יְהוָ֡ה עֵ֤ת רָצ֗וֹן אֱלֹהִ֥ים בְּ/רָב חַסְדֶּ֑/ךָ עֲ֝נֵ֗/נִי בֶּ/אֱמֶ֥ת יִשְׁעֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
translation:
  language: ta
  text: ஆனால் நானோ, யாவே, உகந்த காலத்தில்[a] என் வேண்டுதலை உமக்கே செலுத்துகிறேன். கடவுளே, உமது மாறாத அன்பின் மிகுதியால், உமது மீட்பின் உண்மையோடு[b] எனக்குப் பதிலளியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தயை கிடைக்கும் காலத்தில்.” இச்சொற்றொடர் கடவுள் செவிகொடுத்துச் செயல்படுவதற்கு ஏற்ற காலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது மீட்பின் நம்பகத்தன்மையோடு.” எபிரெயச் சொல் ‘உண்மை’ அல்லது ‘உண்மைத்தன்மை/நம்பகத்தன்மை’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: இணைப்புச்சொல்லும் தனிப்பட்ட சுட்டுப்பெயரும் சேர்ந்து முந்தைய சூழலுடன் முரண்பாட்டையும் ‘நான்’ என்பதற்கான அழுத்தத்தையும் காட்டுகின்றன.
- source_word: תְפִלָּתִי לְךָ
  choice: உம்மை நோக்கி வேண்டுகிறேன்
  rationale: சொல்லுக்கு நெருக்கமாக ‘என் வேண்டுதல் உமக்கு’ என்று கூறலாம்; ஆனால் அதன் திசையையும் பொருளையும் இயல்பான நவீனத் தமிழில் இவ்வாறு வெளிப்படுத்துவது தெளிவாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: עֵת רָצוֹן
  choice: உகந்த காலத்தில்
  rationale: கடவுள் செவிகொடுத்து செயல்படுவதற்கு ஏற்புடைய அல்லது தயவான நேரம் என்ற காலப் பொருளை இயல்பாகத் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: நேரடி அழைப்பைத் தமிழில் இயல்பாகக் காட்ட விளிவேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְּרָב חַסְדֶּךָ
  choice: உமது மாறாத அன்பின் பெருக்கின்படி
  rationale: חסד என்பதிலுள்ள உறுதியான, பற்றுமாறாத அன்பின் நுண்பொருளையும் בְּרָב என்பதிலுள்ள மிகுதி மற்றும் வேண்டுதலுக்கான அடிப்படை என்ற கருத்தையும் காக்கிறது.
- source_word: עֲנֵנִי
  choice: எனக்குப் பதிலளியும்
  rationale: வேண்டுதல் சூழலில் வரும் நேரடியான கட்டளைப் பொருளை மரியாதையான தமிழ் வினைமுற்றில் தருகிறது.
- source_word: בֶּאֱמֶת יִשְׁעֶךָ
  choice: உமது மீட்பின் உண்மையின்படி
  rationale: אמת என்பதன் ‘உண்மை’ என்ற நேரடிப் பொருளையும், יִשְׁעֶךָ என்பதன் மீட்பு/விடுவிப்பு கருத்தையும் காக்கிறது; ‘நம்பகத்தன்மை’ என்ற சாத்தியமான நுண்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: மீட்புடன் தொடர்புடைய אֱמֶת என்பதன் நுண்பொருள்
  choice: உண்மை
  alternative: உண்மைத்தன்மை; நம்பகத்தன்மை
  rationale: இந்தச் சொல் ‘உண்மை’ என்பதையும் ‘உறுதியான நம்பகத்தன்மை’ என்பதையும் குறிக்கலாம். முதன்மை உரை நேரடிப் பொருளைக் காக்கிறது; சூழலுக்கு ஏற்ற மற்றொரு சாத்தியம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேண்டுதல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனை நோக்கும் இடங்களில் ‘உமது’, ‘பதிலளியும்’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய மொழியின் பெயர்ச்சொல் அமைப்பு தமிழில் இயல்பாக இருக்க ‘உம்மை நோக்கி வேண்டுகிறேன்’ என வினை அமைப்பாக மாற்றப்பட்டுள்ளது; கருத்து மாறவில்லை.
