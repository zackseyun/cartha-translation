  source_fidelity: மூலத்தின் எதிர்மறை அழுத்தம் (வַאֲנִי), யாவே என்ற இறைநாமம், ஏற்ற காலம், மிகுந்த חסד, மற்றும் மீட்போடு தொடர்புடைய אֱמֶת ஆகியவை வரைவில் பெரும்பாலும் காக்கப்பட்டுள்ளன. எனினும், ‘உம்மை நோக்கி வேண்டுகிறேன்’ என்பது ‘என் வேண்டுதல் உமக்கே’ என்ற பெயர்ச்சொல்-அழுத்தத்தை வினைவடிவமாக்குகிறது; இது ஏற்கத்தக்கதாக இருந்தாலும், திருத்தத்தில் ‘என் வேண்டுதல் உமக்கே’ என அதை நேரடியாகத் தக்கவைத்துள்ளேன். בֶאֱמֶת என்பதற்கு ‘உண்மையின்படி’ என்பதைக் காட்டிலும் ‘உண்மையோடு’ நெருக்கமானதும் தமிழில் இயல்பானதுமாகும்.
