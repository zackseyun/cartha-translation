lexical_decisions:
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: இது ஜெபத்தில் தேவனை நேரடியாக அழைக்கும் விளிவேற்றுமை; நவீன, கண்ணியமான தமிழில் ‘தேவனே’ இயல்பாக உள்ளது.
- source_word: אַתָּה
  choice: நீர்
  rationale: எபிரெயத்தில் வெளிப்படையாக வரும் இரண்டாம் நபர் ஒருமைப் பெயர்ச்சொல் வலியுறுத்தலைக் கொண்டுள்ளது; மரியாதைமிக்க ஒருமையாக ‘நீர்’ அதைத் தக்கவைக்கிறது.
- source_word: יָדַעְתָּ
  choice: அறிந்திருக்கிறீர்
  rationale: Qal perfect இங்கு தற்போதும் முழுமையாக நிலைக்கும் அறிவைக் குறிக்கிறது; ‘அறிந்திருக்கிறீர்’ அந்த நிலைத்த நிறைவு உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְאִוַּלְתִּי
  choice: என் மதியீனத்தை
  rationale: אִוֶּלֶת வெறும் அறிவுக் குறைவைக் காட்டிலும் பொறுப்புக்குரிய மூடத்தனத்தையும் தவறான நடத்தையையும் குறிக்கலாம்; ‘மதியீனம்’ சங்கீத நடைக்கு ஏற்ற கண்ணியமான, புரிந்துகொள்ளக்கூடிய சொல்.
- source_word: וְאַשְׁמוֹתַי
  choice: என் குற்றங்கள்
  rationale: பன்மை வடிவத்தைத் தமிழிலும் வெளிப்படையாகப் பாதுகாக்க ‘குற்றங்கள்’ தேர்ந்தெடுக்கப்பட்டது; இச்சூழலில் பலி அல்ல, குற்றச்செயல்கள் அல்லது குற்றப்பொறுப்புகளே குறிக்கப்படுகின்றன.
- source_word: מִמְּךָ
  choice: உமக்கு
  rationale: כחד உடன் வரும் מן, ஒருவருடைய பார்வை அல்லது அறிவிலிருந்து மறைக்கப்படுதலைக் குறிக்கிறது; தமிழில் ‘உமக்கு மறைவானவை’ என்பது இயல்பான சமவிகிதம்.
- source_word: לֹא נִכְחָדוּ
  choice: மறைவானவை அல்ல
  rationale: Niphal perfect plural-ஐ ‘குற்றங்கள்’ என்ற பன்மை எழுவாயுடன் பொருந்துமாறு மொழிபெயர்த்து, அவை தேவனிடமிருந்து மறைக்கப்படவில்லை என்ற பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: புதிய ஏற்பாட்டில் பின்னர் மெசியாவுடன் தொடர்புபடுத்தப்படும் சங்கீதத்தில் பேசுபவர் தமது மதியீனத்தையும் குற்றங்களையும் ஒப்புக்கொள்வது
  choice: முதலாம் நபரில் உள்ள ஒப்புக்கொள்ளுதலை அதன் நேரடியான எபிரெயப் பொருளோடு தக்கவைத்தல்
  alternative: இதைத் தனிப்பட்ட ஒப்புக்கொள்ளுதலாக அல்லாமல், சமூகத்தின் சார்பான அல்லது பிரதிநிதித்துவ ஒப்புக்கொள்ளுதலாக விளக்கி மொழிபெயர்த்தல்
  rationale: எபிரெய உரை பேசுபவரின் ‘என் மதியீனம்’ மற்றும் ‘என் குற்றங்கள்’ என்று நேரடியாகக் கூறுகிறது. பின்னைய இறையியல் பயன்பாட்டை வைத்து இந்தப் பதற்றத்தை மொழிபெயர்ப்பிலேயே தீர்க்காமல் இருப்பது மூல உரைக்கு உண்மையானது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான ஜெப நடையைப் பயன்படுத்துகிறது. ‘நீர்/உமக்கு’ மரியாதைமிக்க ஒருமையைத் தக்கவைக்கின்றன. எபிரெயப் பன்மையான ‘குற்றங்கள்’ பாதுகாக்கப்பட்டுள்ளது; இறையியல் பதற்றம் விளக்கி அகற்றப்படவில்லை.
