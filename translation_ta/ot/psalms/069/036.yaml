  text: The offspring of his servants will inherit it[b][a], and those who love his name will dwell in it.
translation:
  language: ta
  text: அவருடைய ஊழியர்களின் சந்ததியினர்[a] அதை உரிமையாகப் பெறுவார்கள்[b]; அவருடைய பெயரை நேசிப்பவர்கள் அதில் குடியிருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை ‘வழித்தோன்றல்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அதை’ என்பது முந்தைய சூழலில் குறிப்பிடப்பட்ட சீயோனை அல்லது மீளக் கட்டப்பட்ட நகரத்தைக் குறிக்கிறது; இதை நாடு அல்லது எருசலேம் என்று விரிவாகவும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: cross_reference
lexical_decisions:
- source_word: זֶרַע
  choice: சந்ததியினர்
  rationale: இங்கு זֶרַע என்பது நேரடியான ‘விதை’ அல்ல, கூட்டுப்பொருளில் பின்வரும் தலைமுறையினரைக் குறிக்கிறது. ‘சந்ததியினர்’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עֲבָדָיו
  choice: அவருடைய ஊழியர்கள்
  rationale: சங்கீதத்தின் உடன்படிக்கை மற்றும் பக்திசார் சூழலில் עֶבֶד என்பதற்கு ‘ஊழியர்’ என்பது பொருத்தமானது; சமூக அடிமைத்தனத்தைத் தேவையின்றி முன்னிறுத்தாது.
- source_word: יִנְחָלוּהָ
  choice: அதை உரிமையாகப் பெறுவார்கள்
  rationale: נחל என்ற வினையின் மரபுரிமையாகப் பெறுதல் என்ற நுணுக்கத்தை ‘உரிமையாகப் பெறுவார்கள்’ தெளிவாக எடுத்துரைக்கிறது; பெண்பால் பின்னொட்டு தமிழில் ‘அதை’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: אֹהֲבֵי שְׁמוֹ
  choice: அவருடைய பெயரை நேசிப்பவர்கள்
  rationale: ‘அவரை நேசிப்பவர்கள்’ என்று சுருக்காமல், தேவனுடைய பெயரை நேசித்தல் என்ற எபிரெய வேதாகமச் சொல்லாட்சியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יִשְׁכְּנוּ בָהּ
  choice: அதில் குடியிருப்பார்கள்
  rationale: שׁכן என்பதன் வசித்தல், நிலையாகத் தங்குதல் ஆகிய பொருள்களை ‘குடியிருப்பார்கள்’ இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அதை’ மற்றும் ‘அதில்’ என்பவற்றின் பெண்பால் பின்னொட்டுகள் குறிக்கும் இடம்
  choice: உடனடிச் சூழலில் வரும் சீயோன் அல்லது மீளக் கட்டப்பட்ட நகரத்தைக் குறிக்கும் பொதுப்பெயராக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை விரிவாக நாடு அல்லது எருசலேம் என்று புரிந்துகொள்ளலாம்.
  rationale: முந்தைய வசனம் தேவன் சீயோனை மீட்டு யூதாவின் நகரங்களைக் கட்டுவதைப் பேசுவதால், பெண்பால் ஒருமைப் பின்னொட்டு மிக இயல்பாக சீயோன் அல்லது அந்த நகரத்தைக் குறிக்கிறது. ‘அதை/அதில்’ என்பது மூலத்தின் சுட்டுதலை அளவுக்கு மீறி விளக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உரிமையாகப் பெறுவார்கள்’ மரபுரிமை நுணுக்கத்தைப் பாதுகாக்கிறது; ‘குடியிருப்பார்கள்’ உயர்ந்த நடையும் பொதுவாசகருக்கான தெளிவும் இடையே சமநிலையை வழங்குகிறது.
