  source_fidelity: The translation accurately conveys the collective sense of זֶרַע, the devotional sense of עֲבָדָיו, the future inheritance nuance of יִנְחָלוּהָ, and the explicit idiom ‘those who love his name.’ ‘அதில் குடியிருப்பார்கள்’ faithfully renders יִשְׁכְּנוּ בָהּ. The referent is appropriately left as ‘it/in it,’ with the note preserving the contextual ambiguity.
