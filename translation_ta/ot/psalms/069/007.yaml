lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இங்கு כִּי முந்தைய சூழலுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்துகிறது; நவீன தமிழில் ‘ஏனெனில்’ இதை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עָלֶיךָ
  choice: உம்மால்
  rationale: இங்கு עַל இடப்பொருளில் அல்லாமல் காரணத்தைச் சுட்டுகிறது. ‘உம்மால்’ என்பது ‘உமது நிமித்தம்’ என்ற சாத்தியமான நுண்பொருளை முழுமையாகத் தீர்மானிக்காமல், காரணத் தொடர்பைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: נָשָׂאתִי
  choice: நான் ... சுமந்தேன்
  rationale: נשא என்பதன் ‘சுமத்தல்/சுமத்திக்கொள்வது’ என்ற உருவகத்தைப் பாதுகாத்து, חֶרְפָּה என்பதுடன் தமிழில் இயல்பாக அமைகிறது.
- source_word: חֶרְפָּה
  choice: நிந்தையை
  rationale: חֶרְפָּה பொதுமக்கள் முன் ஏற்படும் பழிப்பு, இகழ்ச்சி, நாணக்கேடு ஆகிய பரப்பைக் கொண்டது; ‘நிந்தை’ அதன் வாய்மொழி இகழ்ச்சியையும் பழிப்பையும் தக்கவைக்கிறது.
- source_word: כִּסְּתָה
  choice: மூடியது
  rationale: כסה என்பதன் நேரடியான ‘மூடுதல்’ உருவகத்தைத் தக்கவைக்கிறது; பெண்பால் ஒருமை வினை எபிரெயத்தில் பின்வரும் כְלִמָּה-வுடன் ஒத்துள்ளது.
- source_word: כְלִמָּה
  choice: அவமானம்
  rationale: כְלִמָּה என்பது வெட்கம், அவமதிப்பு, மானக்கேடு ஆகியவற்றைக் குறிக்கலாம். ‘அவமானம்’ பொதுவெளி இழிவின் நுண்பொருளைத் தருவதோடு ‘நிந்தை’ என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: פָנַי
  choice: என் முகத்தை
  rationale: இங்கு ‘முகம்’ என்ற நேரடி படிமமே இயல்பானது; அவமானம் முகத்தை மூடுகிறது என்ற கவித்துவ உருவகம் பாதுகாக்கப்படுகிறது.
