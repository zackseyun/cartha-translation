revisions:
- from: ஏனெனில், உம்மால் நான் நிந்தையைச் சுமந்தேன்; அவமானம் என் முகத்தை மூடியது.
  to: ஏனெனில், உம்மினிமித்தம் நான் நிந்தையைச் சுமந்தேன்; அவமானம் என் முகத்தை மூடியது.
  rationale: Replaced the potentially agentive ‘உம்மால்’ with ‘உம்மினிமித்தம்’ to reflect the Hebrew causal/referential force of עָלֶיךָ. No other change is needed.
