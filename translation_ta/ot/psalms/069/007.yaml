translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்தின் கண்ணியமான கவித்துவத் தொனியைப் பேணும் மொழிநடை. தேவனை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘உம்மால்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் செய்யுளின் இரு இணை உறுப்புகளும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
