lexical_decisions:
- source_word: תְּהִי
  choice: பாழாய்ப்போகட்டும்
  rationale: היה என்பதன் விருப்பவினை வலிமையை ‘-ட்டும்’ வடிவம் இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடுத்த சொல்லுடன் சேர்ந்து நிலைமாற்றத்தையும் உணர்த்துகிறது.
- source_word: טִירָתָם
  choice: அவர்களுடைய பாளயம்
  rationale: טִירָה என்பதன் கூட்டுக் குடியிருப்பு அல்லது முகாம் என்ற திடமான படிமத்தை ‘பாளயம்’ காக்கிறது; கூடாரங்கள் என்ற இணைவரியோடும் பொருந்துகிறது.
- source_word: נְשַׁמָּה
  choice: பாழாய்ப்போக
  rationale: இச்சொல் பாழடைந்த அல்லது வெறிச்சோடிய நிலையைக் குறிக்கிறது. ‘பாழாய்ப்போக’ என்பது அழிவினால் ஏற்படும் வெறுமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּאָהֳלֵיהֶם
  choice: அவர்களுடைய கூடாரங்களில்
  rationale: אֹהֶל என்பதன் நேரடியான கூடாரப் படிமத்தைத் தக்கவைக்கிறது; விரிவான பொருளில் குடியிருப்புகளையும் குறிக்கலாம்.
- source_word: אַל יְהִי
  choice: இல்லாமல் போகட்டும்
  rationale: எதிர்மறை விருப்பவினையாகிய எபிரெய அமைப்பை வேண்டுதல் அல்லது சாபவாக்கின் வலிமையுடன் தமிழில் வெளிப்படுத்துகிறது; வெறும் எதிர்காலக் கூற்றாக மாற்றவில்லை.
- source_word: יֹשֵׁב
  choice: குடியிருப்பவர்
  rationale: ישב என்பதன் வினையெச்சம் இங்கு வசிப்பவரைக் குறிக்கிறது; ‘குடியிருப்பவர்’ என்பது செயற்பொருளையும் நபரையும் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: புலம்பல் சங்கீதத்திலுள்ள சாப வேண்டுதலின் விருப்பவினைகள்
  choice: ‘பாழாய்ப்போகட்டும்’; ‘இல்லாமல் போகட்டும்’ என வேண்டுதல் அல்லது விருப்பவாக்காக மொழிபெயர்த்தல்
  alternative: ‘பாழாய்ப்போகும்; ... ஒருவரும் இருக்கமாட்டார்’ என எளிய எதிர்கால முன்னறிவிப்பாக மொழிபெயர்த்தல்
  rationale: எபிரெய வினைவடிவங்கள் விருப்ப அல்லது வேண்டுதல் வலிமை உடையவை. ஆகவே வசனத்தின் கடுமையான இறைவேண்டுதலைத் தக்கவைத்து, அதை வெறும் முன்னறிவிப்பாகச் சமப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பாளயம்’ மூலத்தின் திடமான முகாம்/கூட்டுக் குடியிருப்புப் படிமத்தை காக்கிறது; ‘கூடாரங்கள்’ என்பதும் நேரடி எபிரெயப் படிமமாக வைக்கப்பட்டுள்ளது. ஒரே அடிக்குறி மட்டும் தேவைப்படுகிறது; அதன் குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
