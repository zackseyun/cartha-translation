source:
  edition: WLC
  text: וְ/תִיטַ֣ב לַֽ֭/יהוָה מִ/שּׁ֥וֹר פָּ֗ר מַקְרִ֥ן מַפְרִֽיס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/031.yaml
  text: And it will please Yahweh more than an ox[a], a bull with horns and split hooves.
translation:
  language: ta
  text: அது யாவேக்கு, கொம்புகளும் பிளந்த குளம்புகளும் உடைய ஒரு எருது—காளையைவிட அதிகம் உகந்ததாயிருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது யாவேக்கு ஒரு எருதைவிட, அதாவது கொம்புகளும் பிளந்த குளம்புகளும் உடைய காளையைவிட, அதிகம் உகந்ததாயிருக்கும்.” எபிரெயம் துதியை முழுமையாகத் தகுதியான பலி விலங்குடன் ஒப்பிடுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתִיטַב
  choice: அது ... உகந்ததாயிருக்கும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட துதியையும் நன்றியறிதலையும் குறிக்கும் 3ஆம் நபர் பெண்பால் ஒருமை வினை. יטב உடன் வரும் ஒப்பீட்டுக் கட்டமைப்பை இயல்பான தமிழில் ‘உகந்ததாயிருக்கும்’ என்று வழங்குகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: திருநாமமாகிய יהוה-ஐ பொதுப்பட்டப் பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, வேற்றுமை உருபை இயல்பாக இணைக்கிறது.
- source_word: מִשּׁוֹר פָּר
  choice: எருதைவிட
  rationale: שׁוֹר மற்றும் פָּר இங்கு ஒரே பலியிடத்தக்க ஆண் மாட்டை இணைநிலையில் விளக்குகின்றன. தமிழில் இரு ஏறத்தாழ ஒத்த விலங்குப் பெயர்களைச் சேர்ப்பதால் ஏற்படும் செயற்கைத்தன்மையைத் தவிர்த்து, ஒப்பீட்டைத் தெளிவாகக் காட்டுகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מַקְרִן
  choice: கொம்புகளும் ... கொண்ட
  rationale: கொம்புடைய முதிர்ந்த பலி விலங்கு என்ற பண்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מַפְרִיס
  choice: பிளந்த குளம்புகளும் கொண்ட
  rationale: குளம்பைப் பிளந்த விலங்கு என்ற எபிரெய விளக்கத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைதிருநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைத் திருநாமம் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: துதி மற்றும் மிருகபலி இடையிலான ஒப்பீடு
  choice: முந்தைய வசனத்தின் துதி யாவேக்கு எருதைவிட உகந்தது
  alternative: அது எருதைவிடச் சிறந்தது
  rationale: מן உடன் வரும் יטב இங்கு யாவேக்கு ஏற்புடையதாய் இருப்பதை ஒப்பிடுகிறது. இதனால் துதியின் முன்னுரிமை வெளிப்படுகிறது; இருப்பினும் பலியைப் பற்றிய விரிவான கோட்பாட்டு முடிவு வசனத்தில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. முந்தைய வசனத்தைச் சுட்டும் ‘அது’ தக்கவைக்கப்பட்டுள்ளது. மூலத்தின் שׁוֹר פָּר இணைநிலையை முதன்மை உரையில் சுருக்கமாக வழங்கி, அதன் வெளிப்படையான மாற்றை அடிக்குறிப்பில் பாதுகாத்துள்ளது.
