source:
  edition: WLC
  text: יָגַ֣עְתִּי בְ/קָרְאִ/י֮ נִחַ֪ר גְּר֫וֹנִ֥/י כָּל֥וּ עֵינַ֑/י מְ֝יַחֵ֗ל לֵ/אלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/003.yaml
  text: I am weary from my crying[a]; my throat is parched[b]; my eyes fail while I wait for my God.
translation:
  language: ta
  text: 'நான் கூப்பிட்டுக் கூப்பிட்டுச் சோர்ந்துபோனேன்;


    என் தொண்டை வறண்டுபோயிற்று[a];


    என் கடவுளுக்காகக் காத்திருக்கையில்[b]


    என் கண்கள் சோர்ந்துபோயின.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் தொண்டை எரிந்துபோயிற்று’ அல்லது ‘என் குரல் கரகரத்தது.’ எபிரெயச் சொல் நீண்ட நேரம் கூப்பிட்டதால் ஏற்பட்ட வறட்சி அல்லது எரிதலைப் படிமமாகக் காட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நம்பிக்கையோடு எதிர்பார்க்கையில்.’ எபிரெய வினை காத்திருப்பதையும் நம்பிக்கையுடன் எதிர்பார்ப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: சோர்ந்துபோனேன்
  rationale: இந்த வினை முயற்சியால் ஏற்பட்ட களைப்பையும் சோர்வையும் குறிக்கிறது. நிறைவுற்ற செயலின் தற்போதைய விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְקָרְאִי
  choice: கூப்பிட்டுக் கூப்பிட்டு
  rationale: இங்கு קרא என்பது உதவிக்காக உரக்க அழைப்பதைக் குறிக்கிறது. மறுமொழியில்லாமல் தொடர்ந்து அழைத்ததையும் அதனால் ஏற்பட்ட சோர்வையும் இரட்டிப்பு நடை இயல்பாக உணர்த்துகிறது.
- source_word: נִחַר
  choice: வறண்டுபோயிற்று
  rationale: இந்தச் சொல் சூடாதல், வறண்டுபோதல் அல்லது எரிச்சலடைதல் என்ற படிமத்தைக் கொண்டது. தொண்டையுடன் சேரும்போது நீண்ட நேரம் கூப்பிட்டதால் ஏற்பட்ட வறட்சியை நேரடியாகக் காட்டுகிறது.
- source_word: גְּרוֹנִי
  choice: என் தொண்டை
  rationale: உடல் சார்ந்த புலம்பல் படிமத்தைத் தெளிவாகவும் நேரடியாகவும் தக்கவைக்கிறது.
- source_word: כָּלוּ
  choice: சோர்ந்துபோயின
  rationale: כלה என்பது தீர்ந்துபோதல், சக்தியிழத்தல் அல்லது செயலிழத்தல் எனப் பொருள்படலாம். கண்களைப் பற்றிய சூழலில் நீண்ட எதிர்பார்ப்பால் அவை தளர்ந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֵינַי
  choice: என் கண்கள்
  rationale: மூலத்தின் உடல் சார்ந்த படிமத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מְיַחֵל
  choice: காத்திருந்து
  rationale: יחל என்பது காத்திருப்பதையும் நம்பிக்கையோடு எதிர்பார்ப்பதையும் குறிக்கலாம். முதன்மை உரையில் காலம் நீளும் காத்திருப்பை முன்னிறுத்தி, நம்பிக்கை சார்ந்த நுண்பொருளை அடிக்குறிப்பில் தக்கவைக்கிறது.
- source_word: לֵאלֹהָי
  choice: என் கடவுளுக்காக
  rationale: ל முன்னிடைச்சொல் காத்திருப்பு அல்லது எதிர்பார்ப்பின் இலக்கைக் குறிக்கிறது; உடைமைப் பின்னொட்டு வெளிப்படுத்தும் தனிப்பட்ட உறவையும் ‘என் கடவுள்’ பாதுகாக்கிறது.
