  register: நவீன நிலையான தமிழில், புலம்பலுக்குரிய கண்ணியமான கவிதை நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கூப்பிட்டுக் கூப்பிட்டு’ என்பது தொடர்ச்சியான உதவி அழைப்பை இயல்பாக உணர்த்துகிறது; மூலத்தின் உடல் சார்ந்த மூன்று படிமங்களான சோர்வு, வறண்ட தொண்டை, சோர்ந்த கண்கள் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
