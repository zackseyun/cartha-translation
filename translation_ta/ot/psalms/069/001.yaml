lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றும்
  rationale: ישׁע என்பதன் ஹிஃபில் கட்டளை வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும் சேர்ந்த நேரடியான மீட்பு வேண்டுதல். நவீனத் தமிழில் இயல்பாகவும் சங்கீதத்தின் அவசரத்துக்கு ஏற்றவாறும் உள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது நேரடி அழைப்பாகப் பயன்படுகிறது; தமிழ் விளிவேற்றுமை வடிவம் வேண்டுதலின் நேரடித்தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: בָאוּ
  choice: வந்துவிட்டது
  rationale: தண்ணீர் ஏற்கெனவே ஆபத்தான அளவை எட்டியுள்ள நிறைவுற்ற நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַיִם
  choice: தண்ணீர்
  rationale: எபிரெயச் சொல்லின் பொதுவான பொருளைத் தக்கவைத்து, மூலத்தில் வெளிப்படையாக இல்லாத ‘வெள்ளம்’ என்ற கூடுதல் குறிப்பைச் சேர்க்கவில்லை.
- source_word: עַד נָפֶשׁ
  choice: என் கழுத்துவரை
  rationale: நֶפֶשׁ என்பதற்கு ‘உயிர்/ஆத்துமா/தன்’ என்ற பொருட்கள் இருந்தாலும், மூழ்கும் அபாயத்தைச் சித்தரிக்கும் இச்சூழலில் தொண்டை அல்லது கழுத்து என்ற உடல்சார் உணர்வு பொருத்தமானது. விரிந்த சொற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: கவித்துவமான ஆபத்துச் சித்திரத்தில் נֶפֶשׁ என்பதன் மொழிபெயர்ப்பு
  choice: மூழ்கும் உருவகத்திற்கேற்ற உடல்சார் பொருளான ‘கழுத்து’
  alternative: ‘என் உயிர்வரை’ அல்லது சொற்பொருளுக்கு நெருக்கமாக ‘என் ஆத்துமாவரை’
  rationale: இவ்வசனம் ஆத்துமாவின் இயல்பைப் பற்றிய கோட்பாட்டுக் கூற்றை முன்வைக்காமல், உயிருக்கு நெருக்கமான பேராபத்தை உடல்சார் கவிப்படமாகச் சொல்கிறது. எனவே தெளிவான சூழல்பொருள் முதன்மை உரையில் தரப்பட்டு, எபிரெயச் சொல்லின் உண்மையான விரிந்த பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேண்டுதலுக்குரிய கண்ணியத்தையும் அவசரத்தையும் இணைக்கும் எளிய கவிநடை. ‘கடவுளே’ மற்றும் ‘காப்பாற்றும்’ என்பவை நேரடி மன்றாட்டை இயல்பாக வெளிப்படுத்துகின்றன; ‘வந்துவிட்டது’ தற்போதைய கடும் அபாயத்தைத் தெளிவாக்குகிறது.
