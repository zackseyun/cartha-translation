  text: יְֽ֭הַלְלוּ/הוּ שָׁמַ֣יִם וָ/אָ֑רֶץ יַ֝מִּ֗ים וְֽ/כָל רֹמֵ֥שׂ בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/034.yaml
  text: Let heaven and earth praise him[c][b][a], the seas and everything that moves in them.
translation:
  language: ta
  text: வானமும்[b] பூமியும் அவரைப் புகழட்டும்[a]; கடல்களும் அவற்றில் அசைகிற[c] அனைத்தும் அவரைப் புகழட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானமும் பூமியும் அவரைப் புகழட்டுமாக”; எபிரெய வினையை வேண்டுகோள் கலந்த அழைப்பாகப் புரிந்துகொள்ளலாம். சிலர், “வானமும் பூமியும் அவரைப் புகழும்” என்று முன்னறிவிப்பாகவும் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் “வானங்கள்” என்று பன்மையில் உள்ளது; இங்கே “வானமும் பூமியும்” என்ற வழக்கமான இணையில் கூட்டுப்பொருள் ஒருமையாக மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஊர்கிற.” எபிரெயச் சொல் அசைகிற, ஊர்கிற அல்லது திரளாகச் செல்கிற உயிரினங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלְלוּהוּ
  choice: அவரைப் புகழட்டும்
  rationale: הלל என்பதன் பியேல் முற்றுப்பெறா வினை இங்கு அழைப்பு அல்லது வேண்டுகோள் பொருளில் வருகிறது; 3ஆம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பொருளையும் வெளிப்படையாகக் காக்கிறது.
- source_word: שָׁמַיִם
  choice: வானம்
  rationale: எபிரெயத்தில் வடிவியல் பன்மையாக இருந்தாலும், ‘வானமும் பூமியும்’ என்ற தமிழில் இயல்பான படைப்புலக இணையில் கூட்டுப்பொருள் ஒருமையாக வழங்கப்பட்டுள்ளது.
- source_word: וָאָרֶץ
  choice: பூமியும்
  rationale: குறிப்பிட்ட ஒரு நிலப்பகுதியை அல்லாமல் முழுப் படைப்புலகையும் குறிக்கும் சூழலில் ‘பூமி’ பொருத்தமானது.
- source_word: יַמִּים
  choice: கடல்கள்
  rationale: எபிரெய பன்மையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וְכָל
  choice: அனைத்தும்
  rationale: பின்வரும் பெயரெச்ச வினையுடன் சேர்ந்து முழுமையைக் குறிக்கும் כָל என்பதன் பரந்த பொருளைக் காக்கிறது.
- source_word: רֹמֵשׂ
  choice: அசைகிற
  rationale: רמש என்பது நகரும், ஊரும் அல்லது திரளாகச் செல்லும் உயிரினங்களைக் குறிக்கலாம்; கடல்சார் சூழலில் ‘அசைகிற’ என்பது தேவையற்ற குறுக்கத்தைத் தவிர்க்கிறது.
- source_word: בָּם
  choice: அவற்றில்
  rationale: ஆண்பால் பன்மைச் சுட்டுப்பெயர் பின்னொட்டு இயல்பாக ‘கடல்கள்’ என்பதைக் குறிக்கிறது; அந்த இணைப்பைத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: படைப்புலகம் புகழ்வதற்கான வினையின் தன்மை
  choice: புகழும்படி விடுக்கப்படும் கவித்துவ அழைப்பு
  alternative: படைப்புலகம் அவரைப் புகழும் என்ற முன்னறிவிப்பு அல்லது ‘புகழட்டுமாக’ என்ற வேண்டுதல்
  rationale: எபிரெய முற்றுப்பெறா வினை இங்கு ஜஸ்ஸிவ் அழைப்பாகக் கேட்கிறது; இருப்பினும் வேண்டுதல் அல்லது முன்னறிவிப்பு நிழற்பொருளை அடிக்குறிப்பில் திறந்துவைக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில் எளிமையும் கவித்துவ கண்ணியமும் பேணப்பட்டுள்ளன. மூலத்தில் ஒரே வினை எல்லா எழுவாய்களையும் ஆளுகிறது; நீண்ட பட்டியலில் பொருள் தெளிவாக இருக்கத் தமிழில் ‘அவரைப் புகழட்டும்’ இருமுறை வழங்கப்பட்டுள்ளது. ‘வானம்’ கூட்டுப்பொருளிலும் ‘அசைகிற’ பரந்த உயிரினப் பொருளிலும் பயன்படுத்தப்பட்டுள்ளன.
