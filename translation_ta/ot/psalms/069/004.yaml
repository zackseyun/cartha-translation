    rationale: அடிக்குறிப்பு வலிமையை அல்ல, “நியாயமின்றி ... பகைவர்” என்ற שֶׁקֶר தொடரின் தெளிவின்மையை விளக்குகிறது. குறியீட்டை அந்தத் தொடரோடு இணைப்பது சரியான அடையாளமிடல்.
  - severity: low
