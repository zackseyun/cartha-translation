  source_fidelity: முதன்மைச் சிக்கல் இரண்டாம் இணைவரியின் தொடரமைப்பில் உள்ளது. “நியாயமின்றி எனக்குப் பகைவர்களாகி” என்பது அவர்கள் பகைவர்களாக *ஆனார்கள்* என்ற பொருளைத் தரக்கூடும்; எபிரெயத்தில் அது அழிக்க முனைவோருக்கு இணைநிலையாக வரும் “என் பொய்யான/நியாயமற்ற பகைவர்கள்” அல்லது “என்னைப் பொய்யாக எதிர்ப்போர்” என்ற குறிப்பு. அதை இணைநிலைப் பெயரெச்சமாக மாற்றுவது மூலத்தின் உறவையும் தெளிவின்மையையும் நன்றாகக் காக்கிறது. இறுதி வரியில் உள்ள கட்டாயப் பொருள் சூழலால் ஆதரிக்கப்படுகிறது; அடிக்குறிப்பில் சொற்படியான வடிவம் உள்ளது.
  naturalness: “என் தலைமுடிகளைவிட எண்ணிக்கையில் அதிகமானவர்கள்” புரியத்தக்கது; ஆனால் “என் தலையிலுள்ள முடிகளைவிட அதிகமானவர்கள்” நவீனத் தமிழில் இயல்பாகவும் கவிதைநடைக்கு ஏற்றதாகவும் உள்ளது. “அப்போது ... வேண்டியிருக்கிறது” கால அமைப்பு சற்றே ஒத்திசைவற்றது; தமிழில் “அப்போது” நீக்கப்பட்டாலும் எபிரெயத்தின் சொற்படியான “அப்போது” அடிக்குறிப்பில் பாதுகாக்கப்படலாம்.
  terminology: “பறித்துக்கொள்ளுதல்” גזל-இன் வலுக்கட்டாயமாக எடுத்தல் என்ற நுணுக்கத்தைத் தகுந்த அளவு காக்கிறது. “அழிக்க முனைவோர்,” “வலிமைமிக்கவர்கள்” ஆகியவை கண்ணியமான, இயல்பான நவீனத் தமிழ். שֶׁקֶר-இன் இரு சாத்தியங்களையும் அடிக்குறிப்பு தொடர்ந்து வெளிப்படுத்துகிறது.
  issues:
