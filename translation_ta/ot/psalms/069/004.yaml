  text: רַבּ֤וּ מִ/שַּׂעֲר֣וֹת רֹאשִׁ/י֮ שֹׂנְאַ֪/י חִ֫נָּ֥ם עָצְמ֣וּ מַ֭צְמִיתַ/י אֹיְבַ֣/י שֶׁ֑קֶר אֲשֶׁ֥ר לֹא גָ֝זַ֗לְתִּי אָ֣ז אָשִֽׁיב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
translation:
  language: ta
  text: 'காரணமின்றி என்னை வெறுப்பவர்கள்

    என் தலையிலுள்ள முடிகளைவிட அதிகமானவர்கள்.

    என்னை அழிக்க முனையும்,

    நியாயமின்றி எனக்குப் பகைவராய் இருப்போர்[a]

    வலிமைமிக்கவர்கள்.

    நான் பறித்துக்கொள்ளாததைக்கூட

    திருப்பிக் கொடுக்க வேண்டியிருக்கிறது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நியாயமின்றி எனக்குப் பகைவராய் இருப்போர்” என்பதற்குப் பதிலாக, “பொய்யான என் பகைவர்கள்” அல்லது “வஞ்சகமான என் பகைவர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர், அவர்கள் வஞ்சகமானவர்கள் என்பதையோ, அவர்கள் சங்கீதப் பாடகரைத் தவறான அடிப்படையில் எதிர்க்கிறார்கள் என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படி, “அப்போது நான் திருப்பிக் கொடுக்கிறேன்.” தான் பறித்துக்கொள்ளாததைக்கூட சங்கீதப் பாடகர் திருப்பிக் கொடுக்கத் தள்ளப்படுகிறார் என்பது இதன் பொருளாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: என் தலைமுடிகளைவிட எண்ணிக்கையில் அதிகமானவர்கள்
  rationale: רַבּוּ என்பது பலராயிருத்தலைக் குறிக்கிறது; ஒப்பீட்டைக் குறிக்கும் מִ־ உடன் சேர்ந்து, தலைமுடிகளைவிட அவர்கள் எண்ணிக்கையில் அதிகம் என்ற மிகைப்படுத்திய கவித்துவப் படிமத்தைத் தெளிவாக வழங்குகிறது.
- source_word: שֹׂנְאַי חִנָּם
  choice: காரணமின்றி என்னை வெறுப்பவர்கள்
  rationale: חִנָּם இங்கு கூலியின்றி என்பதல்ல, தகுந்த காரணமோ நியாயமோ இன்றி என்பதைக் குறிக்கிறது. “காரணமின்றி” என்பது இயல்பான நவீனத் தமிழில் அந்தப் பொருளைப் பாதுகாக்கிறது.
- source_word: עָצְמוּ
  choice: வலிமைமிக்கவர்கள்
  rationale: עצם என்ற வேரிலிருந்து வரும் இவ்வினை வலிமை பெறுதல் அல்லது வலிமையாயிருத்தலைக் குறிக்கிறது; எதிரிகளால் ஏற்படும் அச்சுறுத்தலை இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַצְמִיתַי
  choice: என்னை அழிக்க நினைப்பவர்கள்
  rationale: இந்தப் பெயரெச்ச வடிவம் பேச்சாளரை அழிவுக்குக் கொண்டுவர முனைவோரைச் சுட்டுகிறது. “நினைப்பவர்கள்” அவர்களுடைய பகைமையான நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֹיְבַי שֶׁקֶר
  choice: நியாயமின்றி எனக்குப் பகைவர்களாகி
  rationale: שֶׁקֶר என்பதை வினையடைப் பொருளில் கொண்டு, அவர்களுடைய எதிர்ப்பு பொய்யான அடிப்படையிலானது அல்லது நியாயமற்றது என வழங்குகிறது. அது பகைவர்களையே “பொய்யானவர்கள்” என விவரிக்கும் வாய்ப்பும் உள்ளதால் அடிக்குறிப்பில் மாற்றுப் பொருள் தரப்பட்டுள்ளது.
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  choice: நான் பறித்துக்கொள்ளாததைக்கூட
  rationale: גזל என்பது வலுக்கட்டாயமாகப் பறித்தல் அல்லது கொள்ளையிடுதலைக் குறிக்கிறது. “பறித்துக்கொள்ளாதது” அந்தச் சிறப்புப் பொருளை பொதுவான “திருடாதது” என்பதைக் காட்டிலும் நெருக்கமாகப் பாதுகாக்கிறது; “கூட” சூழலிலுள்ள முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָז אָשִׁיב
  choice: அப்போது திருப்பிக் கொடுக்க வேண்டியிருக்கிறது
  rationale: எபிரெய வினை நேரடியாக “திருப்பிக் கொடுக்கிறேன்/கொடுப்பேன்” என்கிறது. ஆனால் குற்றமற்றவர் செய்யாத கொள்ளைக்காக ஈடுசெய்யத் தள்ளப்படுகிறார் என்ற சூழல்பொருளை “வேண்டியிருக்கிறது” வெளிப்படுத்துகிறது; நேரடியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: குற்றமற்றிருந்தும் திருப்பிச் செலுத்தத் தள்ளப்படும் இறுதி வரியின் பொருள்
  choice: நான் பறித்துக்கொள்ளாததைக்கூட அப்போது திருப்பிக் கொடுக்க வேண்டியிருக்கிறது.
  alternative: நான் பறித்துக்கொள்ளாததை அப்போது திருப்பிக் கொடுக்கிறேன்.
  rationale: சங்கீதப் பேச்சாளர் பொய்யான எதிர்ப்பினாலும் அநியாயத்தினாலும் துன்புறுவதாகச் சூழல் காட்டுகிறது. “வேண்டியிருக்கிறது” என்பது அவர் செய்யாத செயலுக்காக ஈடுசெய்ய வேண்டிய அபத்தமான கட்டாயத்தை வெளிப்படுத்துகிறது; அதே நேரம் எபிரெயின் சொற்படியான எளிய வினை அடிக்குறிப்பில் தரப்பட்டு அதன் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: אֹיְבַי שֶׁקֶר என்பதில் שֶׁקֶר பகைவர்களையா அவர்களுடைய எதிர்ப்பையா விவரிக்கிறது
  choice: நியாயமின்றி எனக்குப் பகைவர்களாகி
  alternative: பொய்யான என் பகைவர்கள் / வஞ்சகமான என் பகைவர்கள்
  rationale: எபிரெயத் தொடர் இருவிதமாகப் புரிந்துகொள்ளப்படலாம். முதன்மை உரை எதிர்ப்பு நியாயமற்றது என்ற வினையடைப் பொருளைத் தேர்ந்தெடுக்கிறது; பகைவர்கள் வஞ்சகமானவர்கள் என்ற பெயரடைப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டதால் மூலத்தின் உண்மையான தெளிவின்மை மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைவரி அமைப்பை நினைவூட்டும் வகையில் வரிகள் பிரிக்கப்பட்டுள்ளன. “பறித்துக்கொள்ளுதல்” என்பது גזל என்பதிலுள்ள வலுக்கட்டாயமாக எடுத்தல் என்ற நுணுக்கத்தையும், “திருப்பிக் கொடுக்க வேண்டியிருக்கிறது” சூழலிலுள்ள கட்டாயத்தையும் வெளிப்படுத்துகின்றன; இரு முக்கியத் தெளிவின்மைகளும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
