    rationale: இறுதி வரியை “திருப்பிக் கொடுக்க வேண்டியிருக்கிறது” என இயல்பாக்கலாம்; எபிரெயத்தின் אָז (‘அப்போது/பின்’) அடிக்குறிப்பின் சொற்படி மேற்கோளில் நிலைத்திருக்கும்.
  revised_text: 'காரணமின்றி என்னை வெறுப்பவர்கள்

    என் தலையிலுள்ள முடிகளைவிட அதிகமானவர்கள்.

    என்னை அழிக்க முனையும்,

    நியாயமின்றி எனக்குப் பகைவராய் இருப்போர்[a]

    வலிமைமிக்கவர்கள்.

    நான் பறித்துக்கொள்ளாததைக்கூட

    திருப்பிக் கொடுக்க வேண்டியிருக்கிறது[b].'
