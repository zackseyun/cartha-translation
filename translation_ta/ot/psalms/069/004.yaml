    issue: இரண்டாம் இணைவரியில் “நியாயமின்றி எனக்குப் பகைவர்களாகி” என்ற வடிவம் பயன்படுத்தப்பட்டுள்ளது.
    rationale: இது எபிரெயத்தின் அப்போசிஷன்/இணைநிலை உறவை விட, பகைவர்களாக மாறிய ஒரு நிகழ்வைக் குறிக்கலாம். “நியாயமின்றி எனக்குப் பகைவராய் இருப்போர்” என்பது எதிர்ப்பின் ஆதாரமின்மையைச் சுட்டி, மாற்று பெயரடைப் பொருளுக்கான அடிக்குறிப்பையும் பொருத்தமாக்குகிறது.
