  revision_rationale: 'திருத்தம் எபிரெய இணைவரி அமைப்பைத் தெளிவுபடுத்துகிறது: அழிக்க முனைவோரும் நியாயமின்றிப் பகைவராய் இருப்போரும் ஒரே எதிரிக்குழுவைக் குறிக்கின்றனர். שֶׁקֶר-இன் ‘வஞ்சகமான’ மற்றும் ‘தவறான அடிப்படையில் எதிர்க்கும்’ ஆகிய இரு வாசிப்புகளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன. அசல் உரையின் இறுதி வினைக்குரிய கட்டாயச் சூழல்பொருள் நீடிக்கிறது; அதன் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.'
