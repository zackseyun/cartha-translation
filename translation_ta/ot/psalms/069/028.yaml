  text: יִ֭מָּחֽוּ מִ/סֵּ֣פֶר חַיִּ֑ים וְ/עִ֥ם צַ֝דִּיקִ֗ים אַל יִכָּתֵֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/028.yaml
  text: Let them be blotted out of the book of life[b][a], and let them not be written with the righteous.
translation:
  language: ta
  text: வாழ்வின் புத்தகத்திலிருந்து அவர்கள் அழிக்கப்படட்டும்[a]; நீதிமான்களோடு அவர்கள் எழுதப்படாதிருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உயிருள்ளோரின் புத்தகத்திலிருந்து.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּחוּ
  choice: அழிக்கப்படட்டும்
  rationale: מחה என்பதன் நிஃபால் வடிவம் இங்கு வேண்டுதல்/சாபவேண்டுதல் வலிமையுடையது. புத்தகத்திலிருந்து எழுத்தை அழிக்கும் உருவகத்தையும் செயப்பாட்டு பொருளையும் இந்தத் தேர்வு காக்கிறது.
- source_word: מִסֵּפֶר
  choice: புத்தகத்திலிருந்து
  rationale: סֵפֶר என்பது புத்தகம், சுருள், அல்லது எழுதப்பட்ட ஆவணம் எனப் பொருள்படலாம். இத்தொடரில் ‘புத்தகம்’ இயல்பாகவும் உருவகத்துக்கு ஏற்றதாகவும் உள்ளது.
- source_word: חַיִּים
  choice: வாழ்வின்
  rationale: חַיִּים என்பது ‘வாழ்வு’ என்றும் ‘உயிருள்ளோர்’ என்றும் பொருள்படக்கூடும். ‘வாழ்வின் புத்தகம்’ மூலத்தின் சுருக்கமான உருவகத்தைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְעִם
  choice: நீதிமான்களோடு
  rationale: עִם என்பதன் நேரடிப் பொருளான ‘உடன்/ஓடு’ காக்கப்பட்டுள்ளது; ஒரே பதிவில் அவர்களுடன் சேர்த்து எழுதப்படுதல் என்ற தொடர்பை இது உணர்த்துகிறது.
- source_word: צַדִּיקִים
  choice: நீதிமான்கள்
  rationale: צַדִּיקִים என்பதற்கான இயல்பான, பரவலாகப் புரியக்கூடிய தமிழ் இணை இது; ஒழுக்க மற்றும் உடன்படிக்கை சார்ந்த வகைப்பாட்டை மேலதிக விளக்கமின்றி காக்கிறது.
- source_word: אַל יִכָּתֵבוּ
  choice: எழுதப்படாதிருக்கட்டும்
  rationale: אַל உடன் வரும் நிஃபால் வினை எதிர்மறை வேண்டுதலைக் குறிக்கிறது. ‘எழுதப்படுதல்’ என்பது כתב என்பதற்கு நெருக்கமானதுடன் புத்தக உருவகத்தையும் தொடர்கிறது.
theological_decisions:
- issue: ‘வாழ்வின் புத்தகம்’ என்பதன் குறிப்பு
  choice: ‘வாழ்வின் புத்தகம்’ என்ற உருவகத்தை விளக்கித் தீர்மானிக்காமல் தக்கவைத்தல்
  alternative: உயிருள்ளோரின் பதிவேடு; இறுதி இரட்சிப்புக்கான வானகப் புத்தகம்
  rationale: இந்த எபிரெயத் தொடர் உயிருடன் இருப்போரின் தெய்வீகப் பதிவைக் குறிக்கலாம்; பிற வேதாகமப் பயன்பாடுகள் இறுதிக்கால இரட்சிப்பு சார்ந்த ஒலியையும் தரலாம். வசனம் ஒன்றையே கொண்டு இவற்றில் ஒன்றை மட்டும் தீர்மானிப்பதை மொழிபெயர்ப்பு தவிர்க்கிறது.
- issue: சாபவேண்டுதலின் வலிமை
  choice: வேண்டுதல் வடிவில் ‘அழிக்கப்படட்டும்… எழுதப்படாதிருக்கட்டும்’ என மொழிபெயர்த்தல்
  alternative: அவர்கள் அழிக்கப்படுவார்கள்; அவர்கள் எழுதப்படமாட்டார்கள்
  rationale: சூழலில் வினைவடிவங்கள் முன்னறிவிப்பாக அல்லாமல் வேண்டுதல்/சாபவேண்டுதலாகச் செயல்படுகின்றன. தமிழ் வியங்கோள் வடிவம் அந்தச் சொல்லாட்சியை நேரடியாகக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அழிக்கப்படட்டும்’ மற்றும் ‘எழுதப்படாதிருக்கட்டும்’ என்ற இணை அமைப்பு புத்தகம்/எழுத்து உருவகத்தையும் எபிரெயப் பாடலின் இணைவாக்கிய அமைப்பையும் காக்கிறது.
