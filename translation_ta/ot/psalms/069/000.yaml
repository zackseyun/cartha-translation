  text: לַ/מְנַצֵּ֬חַ עַֽל שׁוֹשַׁנִּ֬ים לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/000.yaml
  text: 'For the choirmaster: according to Lilies[a]. Of David[b].'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: “லில்லி மலர்கள்” என்பதன்படி[a]. தாவீதுக்குரியது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “லில்லி மலர்கள்” என்ற மெட்டில். இச்சொற்றொடர் ஒருவேளை ஒரு மெட்டின் அல்லது இசைப்பாணியின் பெயராக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தாவீதுக்குரியது” என்பதற்கான எபிரெயச் சொற்றொடர், தாவீது இதை இயற்றினார், அவருக்கு இது அர்ப்பணிக்கப்பட்டது, அல்லது அவருடன் இது தொடர்புடையது என்பதைக் குறிக்கலாம்; அது மட்டுமே ஆசிரியர் யார் என்பதைத் தீர்மானிப்பதில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை அல்லது வழிபாட்டு நிகழ்த்துதலை வழிநடத்துபவருக்கான குறிப்பாக இச்சொல் வருகிறது. ‘இசைத் தலைவர்’ என்பது பாடகர் குழுவை மட்டும் குறிக்காமல் மூலச்சொல்லின் பரந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עַל
  choice: என்பதன்படி
  rationale: இசைக் குறிப்புகளில் இது மெட்டு, இசைப்பாணி அல்லது நிகழ்த்தும் முறை ஆகியவற்றுள் ஒன்றுடனான தொடர்பைக் குறிக்கலாம். ‘என்பதன்படி’ அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: שׁוֹשַׁנִּים
  choice: “லில்லி மலர்கள்”
  rationale: இச்சொல்லின் நேரடிப் பொருள் ‘லில்லி மலர்கள்’. இங்கு அது ஒரு மெட்டு அல்லது இசைப்பாணியின் பெயராக இருக்கக்கூடும் என்பதைக் காட்ட மேற்கோள் குறிகளுடன் தலைப்புப் பெயராக வழங்கப்பட்டுள்ளது.
- source_word: לְדָוִד
  choice: தாவீதுக்குரியது
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், அர்ப்பணம் அல்லது தொடர்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதுக்குரியது’ என்பது ‘தாவீது எழுதியது’ என்று பொருளை அளவுக்கு மீறி முடிவுசெய்யாமல் அந்தப் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தாவீதுடனான தொடர்பின் தன்மை
  choice: தாவீதுக்குரியது
  alternative: தாவீது எழுதியது
  rationale: எபிரெய முன்னொட்டு ஆசிரியத்துவத்தைச் சுட்டக்கூடும்; ஆனால் அதையே மட்டும் கட்டாயப்படுத்தாது. ஆகவே ஆசிரியத்துவம், அர்ப்பணம் அல்லது தொடர்பு என்ற சாத்தியங்களைத் திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான சங்கீதத் தலைப்பாக வடிவமைக்கப்பட்டது. ‘இசைத் தலைவர்’ இயல்பானதும் பரந்ததும்; ‘தாவீதுக்குரியது’ மூலத்தின் திட்டமிட்ட தெளிவின்மையைப் பாதுகாக்கிறது. மேற்கோள் குறிகள் ‘லில்லி மலர்கள்’ என்பது சாதாரண மலர்க் குறிப்பு அல்லாமல் இசைத் தலைப்பாக இருக்கலாம் என்பதை உணர்த்துகின்றன.
