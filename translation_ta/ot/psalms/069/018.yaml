  text: Come near to my soul[a]; redeem it. Because of my enemies[b], ransom me.
translation:
  language: ta
  text: என் உயிருக்கு[a] அருகில் வாரும்; அதனை மீட்டருளும். என் பகைவர்களினிமித்தம்[b] என்னை விடுவித்தருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் உயிர்’ என்பதற்கான எபிரெயச் சொல் ‘என் ஆத்துமா’ அல்லது ‘என்னையே’ என்றும் சூழலுக்கேற்ப பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் பகைவர்களின் பொருட்டு.’ எபிரெயச் சொற்றொடர் நோக்கத்தையும் காரணத்தையும் குறிக்கக்கூடும்; இச்சூழலில் ‘என் பகைவர்களால் ஏற்பட்ட நிலையினிமித்தம்’ என்பது பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָה
  choice: அருகில் வாரும்
  rationale: קרב என்பதன் ஆண்பால் ஒருமை ஏவல் வடிவம் இது. கடவுள் அருகில் வரவேண்டும் என்ற நேரடியான மன்றாட்டை, இயல்பானவும் மரியாதையானவும் உள்ள தமிழில் இத்தேர்வு காக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிர்
  rationale: נפשׁ என்பது சூழலுக்கேற்ப உயிர், ஆத்துமா, அல்லது ஒருவரையே குறிக்கலாம். இங்கு ‘உயிர்’ என்பது தனிப்பட்ட ஆழ்ந்த மன்றாட்டையும் உயிரைக் காக்கும் வேண்டுதலையும் இயல்பாக வெளிப்படுத்துகிறது; மூலமொழியின் பொருள் விரிவை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: גְאָלָהּ
  choice: அதை மீட்டருளும்
  rationale: גאל என்பது மீட்பவராகச் செயல்பட்டு மீட்டுக்கொள்வதைக் குறிக்கிறது. பெண்பால் ஒருமை பின்னொட்டு முன்வரும் נפשׁ-ஐச் சுட்டுவதால், ‘அதை’ எனும் பொருள் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
- source_word: לְמַעַן
  choice: நிமித்தம்
  rationale: למען பொதுவாக ‘பொருட்டு/நிமித்தம்’ என்ற நோக்கம் அல்லது காரண உறவைத் தரலாம். இச்சூழலில் பகைவர்களால் ஏற்பட்ட நிலையைக் காரணமாகக் கொண்டு விடுதலை கோரப்படுவதற்கு ‘நிமித்தம்’ பொருந்துகிறது; நோக்கப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் மாற்று தரப்பட்டுள்ளது.
- source_word: אֹיְבַי
  choice: என் பகைவர்கள்
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் பன்மைச் சொல்லை நேராகவும் தெளிவாகவும் மொழிபெயர்க்கிறது.
- source_word: פְּדֵנִי
  choice: என்னை விடுவித்தருளும்
  rationale: פדה என்பது மீட்பு அல்லது பிணையிலிருந்து விடுவித்தலைக் குறிக்கிறது. முந்தைய גאל-க்கு ‘மீட்டருளும்’ என்றும் இதற்கு ‘விடுவித்தருளும்’ என்றும் வேறுபடுத்துவது, இரு தொடர்புடைய வினைகளின் கவித்துவச் செறிவைக் காக்கிறது; குறிப்பிட்ட பரிகாரக் கோட்பாட்டை உரைக்குள் சேர்ப்பதையும் தவிர்க்கிறது.
theological_decisions:
- issue: גאל, פדה என்னும் இணையான இரு மீட்பு வினைகளை வேறுபடுத்துதல்
  choice: גאל-ஐ ‘மீட்டருளும்’ என்றும் פדה-ஐ ‘விடுவித்தருளும்’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘மீட்டருளும்’ என மொழிபெயர்த்தல்; அல்லது இரண்டாவது சொல்லை ‘பிணை கொடுத்து மீட்டருளும்’ என மொழிபெயர்த்தல்
  rationale: தொடர்புடைய இரு மீட்புச் சொற்களையும் ஒரே தமிழ்ச் சொல்லாகத் தட்டையாக்காமல் கவித்துவ வலிமையைப் பாதுகாக்கிறது. அதேவேளையில், ‘பிணை’ அல்லது விலை குறித்த வளர்ச்சியடைந்த இறையியல் விளக்கத்தை இந்த மன்றாட்டில் தேவையின்றி புகுத்துவதில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சங்கீத மன்றாட்டுக்கேற்ற கண்ணியமான மரியாதை ஏவல் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘உயிர்’ பொதுவாசகர்களுக்கு இயல்பாக இருக்கிறது; மூலத்தின் விரிந்த נפשׁ பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது. ‘மீட்டருளும்/விடுவித்தருளும்’ என்ற வேறுபாடு எபிரெயக் கவிதையின் இணைச் சொல் நயத்தை வெளிப்படுத்துகிறது.
