source:
  edition: WLC
  text: כִּֽי שֹׁמֵ֣עַ אֶל אֶבְיוֹנִ֣ים יְהוָ֑ה וְ/אֶת אֲ֝סִירָ֗י/ו לֹ֣א בָזָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/033.yaml
  text: For Yahweh hears the needy[a], and he does not despise his prisoners.
translation:
  language: ta
  text: 'ஏனெனில் யாவே வறியவர்களுக்குச் செவிகொடுக்கிறார்;

    தம்முடைய கைதிகளை[a] அவர் இகழ்வதில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம்முடைய சிறைப்பட்டவர்கள்.” எபிரெயச் சொல் சிறையிலோ வேறு கட்டுப்பாட்டிலோ வைக்கப்பட்டவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புகழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயக் காரண இணைப்பின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: שֹׁמֵעַ אֶל
  choice: செவிகொடுக்கிறார்
  rationale: வெறுமனே ஒலியைக் கேட்பதைக் காட்டிலும், வேண்டுதலைக் கவனித்துப் பதிலளிக்கும் சூழல்சார் நுட்பத்தை வெளிப்படுத்துகிறது; நிகழ்காலம் வழக்கமான இறைச்செயலைக் காட்டுகிறது.
- source_word: אֶבְיוֹנִים
  choice: வறியவர்கள்
  rationale: பொருளாதாரக் குறைவும் சமூகப் பலவீனமும் உடையவர்களைக் குறிக்கும் சொல்லின் பரந்த பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக வரும் இறைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲסִירָיו
  choice: தம்முடைய கைதிகள்
  rationale: ‘கைதிகள்/சிறைப்பட்டவர்கள்’ என்ற அடிப்படைப் பொருளையும் மூன்றாம் நபர் ஒருமை உடைமைப் பின்னொட்டையும் காக்கிறது; தமிழில் கர்த்தரையே குறிக்கும் தற்சுட்டு உடைமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא בָזָה
  choice: இகழ்வதில்லை
  rationale: בזה என்பதன் அவமதித்தல் அல்லது மதிப்பற்றவர்களாக நடத்துதல் என்ற பொருளைத் தருகிறது; கவிதைச் சூழலில் பொதுவான உண்மையைக் காட்ட நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரைப் பாதுகாக்கிறது; பட்டப்பெயரைப் பதிலீடு செய்யவில்லை.
- issue: אֲסִירָיו என்பதிலுள்ள உடைமை உறவு
  choice: தம்முடைய கைதிகள்
  alternative: கைதிகள்
  rationale: எபிரெயச் சொல்லின் ‘அவருடைய’ என்ற உடைமைப் பின்னொட்டை நீக்காமல் காக்கிறது. அவர்கள் எந்த வகையில் யாவேக்குரியவர்கள் என்பதைக் கூடுதலாக விளக்காமல், மூலத்தின் இறையியல் நுட்பத்தையும் பதற்றத்தையும் அப்படியே விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்கேற்ற சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. இரண்டு இணைச் செயல்களான ‘செவிகொடுக்கிறார்’ மற்றும் ‘இகழ்வதில்லை’ தெளிவாக நிறுத்தப்பட்டுள்ளன. அடிக்குறிப்புக் குறி அது விளக்கும் אֲסִירָיו என்ற சொல்லின் மொழிபெயர்ப்புக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
