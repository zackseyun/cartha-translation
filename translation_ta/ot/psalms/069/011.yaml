  register: நவீனத் தரமான, கண்ணியமான தமிழில் துக்கச் சூழலைப் பேணுகிறது. ‘சாக்குத்துணி’ பண்பாட்டு உருவகத்தைத் தக்கவைக்கிறது; ‘பழிச்சொல்’ சூழலிலுள்ள இகழ்ச்சியை முதன்மை உரையில் வெளிப்படுத்துகிறது.
