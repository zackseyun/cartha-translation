  text: I made sackcloth my clothing[b][a], and I became a byword to them.
translation:
  language: ta
  text: சாக்குத்துணியை என் உடையாகக் கொண்டேன்; அவர்களுக்கு நான் பழிச்சொல்லானேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லுக்கு “பழமொழி” அல்லது “கேலிக்குரிய எடுத்துக்காட்டு” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: ஆக்கிக்கொண்டேன்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு/வை’ என்றாலும், ‘என் உடை’ மற்றும் ‘சாக்குத்துணி’ என்பவற்றுடன் வரும் இவ்வமைப்பு, சாக்குத்துணியைத் தன் உடையாக ஏற்றுக்கொண்டதைக் குறிக்கிறது.
- source_word: לְבוּשִׁי
  choice: என் உடை
  rationale: சங்கீதக்காரர் அணிந்த உடையைக் குறிக்கும் உடைமைப் பொருளை எளிய, இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: שָׂק
  choice: சாக்குத்துணி
  rationale: துக்கம், மனத்தாழ்மை ஆகியவற்றோடு தொடர்புடைய கரடுமுரடான ஆடைத்துணிக்கான வழக்கமான வேதாகமச் சொல்.
- source_word: וָאֱהִי
  choice: நான் ... ஆனேன்
  rationale: היה இங்கு ஏற்பட்ட புதிய நிலையைக் குறிக்கிறது; ஆகவே வெறுமனே ‘இருந்தேன்’ என்பதைக் காட்டிலும் ‘ஆனேன்’ பொருத்தமானது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: எபிரெய முன்னிடைச்சொல்லின் உறவை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לְמָשָׁל
  choice: பழிச்சொல்
  rationale: מָשָׁל என்பதற்கு ‘பழமொழி, உவமைப் பேச்சு, கேலிக்குரிய பழிச்சொல்’ ஆகிய பொருள்கள் உண்டு. இகழ்ச்சி நிறைந்த இச்சூழலில், ஒருவரை இழிவான எடுத்துக்காட்டாகச் சொல்லும் ‘பழிச்சொல்’ முதன்மைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions: []
