source:
  edition: WLC
  text: יְהִֽי שֻׁלְחָנָ֣/ם לִ/פְנֵי/הֶ֣ם לְ/פָ֑ח וְ/לִ/שְׁלוֹמִ֥ים לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/022.yaml
  text: May their table before them become a trap[a], and for their well-being a snare.
translation:
  language: ta
  text: அவர்களுக்கு முன்பாக உள்ள அவர்களுடைய மேசை அவர்களுக்குக் கண்ணியாகட்டும்; அவர்களுடைய நல்வாழ்வே[a] பொறியாகட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: “அவர்களுடைய சமாதானப் பலிகளே.” எபிரெயச் சொல் நல்வாழ்வையும் குறிக்கலாம்; சமாதானப் பலிகளையும் குறிக்கலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: ஆகட்டும்
  rationale: היה என்பதன் வேண்டுதல்/சாபவிருப்பம் காட்டும் வடிவத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֻׁלְחָנָם
  choice: அவர்களுடைய பந்தி
  rationale: சாப்பாட்டு மேசையையும் அதில் பரிமாறப்பட்ட விருந்தையும் குறிக்கக்கூடிய concrete உருவகத்தைத் தக்கவைக்கிறது; இச்சூழலில் 'பந்தி' இயல்பான தமிழாகும்.
- source_word: לִפְנֵיהֶם
  choice: அவர்களுக்கு முன்பாக இருக்கும்
  rationale: அவர்கள் கண்முன் கிடக்கும் உணவு/விருந்து ஆபத்தாக மாறும் முரணைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְפָח
  choice: கண்ணி
  rationale: פח குறிக்கும் வேட்டைப் பொறி அல்லது கண்ணி என்ற உருவகத்தைப் பேணுகிறது; இணைச்சொல்லிலிருந்து வேறுபடுத்தப்படுகிறது.
- source_word: וְלִשְׁלוֹמִים
  choice: அவர்களுடைய நல்வாழ்வே
  rationale: இச்சூழலில் שְׁלוֹמִים என்பதன் நலம், பாதுகாப்பு, செழிப்பு சார்ந்த பொருளை வழங்குகிறது; பலியுணவு சார்ந்த சாத்தியம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: לְמוֹקֵשׁ
  choice: பொறி
  rationale: מוֹקֵשׁ என்பதன் 'snare/trap' பொருளை வழங்கி, פח என்பதற்கான 'கண்ணி'யுடன் கவிதை இணைநிலையையும் சொல்வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: சாபவேண்டுதலின் வலிமை
  choice: '''ஆகட்டும்'' என்று நேரடியாகப் பேணப்பட்டது'
  alternative: விளைவைக் கூறும் சாதாரண எதிர்கால வாக்கியமாக மொழிபெயர்த்தல்
  rationale: எபிரெய jussive வடிவம் வெறும் முன்னறிவிப்பு அல்ல; தீங்கு நிகழ வேண்டும் என்ற வேண்டுதலை வெளிப்படுத்துகிறது.
- issue: שְׁלוֹמִים என்பதன் சூழல்சார் பொருள்
  choice: நல்வாழ்வு
  alternative: சமாதானப் பலிகள் / சமாதானப் பலியுணவு
  rationale: இணைநிலை அமைப்பில், அவர்களுக்கு நன்மையாகவும் பாதுகாப்பாகவும் இருப்பதே பொறியாக வேண்டும் என்ற முரண் இயல்பாகப் பொருந்துகிறது. இருப்பினும் பந்தி மற்றும் பலியுணவு இடையிலான சாத்தியமான வழிபாட்டு ஒலிநயம் உண்மையான மாற்று வாசிப்பாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான வேண்டுதல் நடையுடன் மொழிபெயர்க்கப்பட்டது. 'கண்ணி—பொறி' என்ற சொல் வேறுபாடு எபிரெயக் கவிதையின் தொடர்புடைய இரு வேட்டையுருவகங்களைப் பாதுகாக்கிறது.
