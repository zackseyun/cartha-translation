  text: Pour out your indignation on them[b][a], and let your burning anger overtake them.
translation:
  language: ta
  text: 'உமது சீற்றத்தை[a] அவர்கள்மேல் ஊற்றும்;

    உமது எரியும் கோபம்[b] அவர்களை வந்தடையட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சீற்றம்’ என்பதற்கு ‘கடுங்கோபம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘உமது மூக்கின் எரிதல்.’ இது கடும் கோபத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָךְ
  choice: ஊற்றும்
  rationale: இது இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை வடிவம். கோபம் முழுமையாக வெளிப்படுத்தப்படுவதைச் சித்தரிக்கும் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: עֲלֵיהֶם
  choice: அவர்கள்மேல்
  rationale: கோபம் செலுத்தப்படும் இலக்கை עַל தெளிவாகக் குறிக்கிறது; ‘அவர்கள்மேல்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: זַעְמֶךָ
  choice: உமது சீற்றத்தை
  rationale: זַעַם கடுமையான, குறிப்பாகத் தெய்வீகமான கோபத்தைக் குறிக்கிறது. ‘சீற்றம்’ அதன் வலிமையையும் அடுத்துள்ள கோபச் சொற்றொடரிலிருந்து உள்ள சொல்லியல் வேறுபாட்டையும் காக்கிறது.
- source_word: וַחֲרוֹן אַפְּךָ
  choice: உமது எரியும் கோபம்
  rationale: ‘மூக்கின் எரிச்சல்’ என்ற எபிரெய உருவகம் தீவிரமான கோபத்தைக் குறிக்கிறது. ‘எரியும் கோபம்’ வெப்ப உருவகத்தையும் தமிழில் தெளிவான பொருளையும் தக்கவைக்கிறது.
- source_word: יַשִּׂיגֵם
  choice: அவர்களை வந்தடையட்டும்
  rationale: נשׂג என்பதன் ஹிஃபில் வடிவம் ‘எட்டுதல், வந்தடைதல், முந்திப்பிடித்தல்’ எனப் பொருள்படும். இங்கு ‘வந்தடையட்டும்’ கோபம் அதன் இலக்கை எட்டும் கருத்தை இயல்பாகத் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் விவரத்தைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: பகைவர்களுக்கு எதிராகத் தெய்வீகத் தீர்ப்பைக் கோரும் சாப வேண்டுதல்
  choice: இறைவனின் சீற்றம் அவர்கள்மேல் ஊற்றப்பட்டு அவர்களை வந்தடைய வேண்டும் என்ற நேரடியான வேண்டுதலை மென்மைப்படுத்தாமல் தக்கவைத்தல்.
  alternative: ‘உமது அதிருப்தியை அவர்களுக்குக் காட்டும்’ போன்ற மென்மையான பொழிப்புரை.
  rationale: எபிரெய உரை இறைவனுடைய கடும் கோபம் பகைவர்கள்மேல் ஊற்றப்பட்டு அவர்களை வந்தடைய வேண்டும் என்று வெளிப்படையாக வேண்டுகிறது. அதன் இறையியல் பதற்றத்தையும் தீவிரத்தையும் மொழிபெயர்ப்பு மறைக்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேண்டுதலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஊற்றும்’ என்ற மரியாதைக் கட்டளையும் ‘வந்தடையட்டும்’ என்ற வேண்டுதல் வடிவமும் எபிரெய வினைகளின் அழுத்தத்தைத் தக்கவைக்கின்றன.
