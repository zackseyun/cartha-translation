  yaml_path: translation/ot/psalms/069/027.yaml
  text: Add iniquity to their iniquity[b][a], and do not let them come into your righteousness.
translation:
  language: ta
  text: அவர்களுடைய அக்கிரமத்தோடு அக்கிரமத்தைச் சேர்த்திடும்[a]; அவர்கள் உமது நீதிக்குள்[b] வரவிடாதிரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அக்கிரமம்” என்பதற்கான எபிரெயச் சொல் அக்கிரமம், குற்றப்பழி, அல்லது குற்றப்பழியின் விளைவு என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது நியாயத்திற்குள்.” இங்கு எபிரெயச் சொல் தேவனுடைய நீதியையோ, அவரது நீதியான அல்லது விடுவிக்கும் செயலையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּנָה
  choice: சேர்த்திடும்
  rationale: נתן என்பதன் கட்டளை வடிவம் அடிப்படையில் ‘கொடு/வை’ என்று பொருள்படும். ஆனால் עָוֺן עַל עֲוֺנָם என்ற தொடரில் ஒன்றோடு மற்றொன்றைச் சேர்த்தல் என்ற பொருள் இயல்பாக இருப்பதால், தமிழில் ‘சேர்த்திடும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עָוֺן / עֲוֺנָם
  choice: அக்கிரமம் / அவர்களுடைய அக்கிரமம்
  rationale: இந்தப் பெயர்ச்சொல் அக்கிரமம், குற்றப்பழி, அல்லது அக்கிரமத்தின் விளைவு ஆகிய பொருள்களை ஏற்கக்கூடும். இரு இடங்களிலும் ஒரே சொல்லைப் பயன்படுத்தி எபிரெயச் சொல் மீளுருவையும் திரண்டுவரும் பொருளையும் காக்க ‘அக்கிரமம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַל
  choice: -ஓடு
  rationale: சொல்லடியாக ‘மேல்’ என்று பொருள்பட்டாலும், இத்தொடரின் கூட்டிச் சேர்க்கும் கருத்தை இயல்பான தமிழில் ‘அக்கிரமத்தோடு அக்கிரமத்தைச் சேர்’ என்ற அமைப்பு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאַל יָבֹאוּ
  choice: அவர்கள் வர விடாதேயும்
  rationale: אַל உடன் வரும் வினை எதிர்மறை வேண்டுதலை வெளிப்படுத்துகிறது. தேவனை நோக்கிய வேண்டுகோள் என்பதைத் தமிழில் இயல்பாகக் காட்ட ‘வர விடாதேயும்’ என வழங்கப்பட்டது.
- source_word: בְּצִדְקָתֶךָ
  choice: உமது நீதிக்குள்
  rationale: צְדָקָה என்பது நீதி, நேர்மை, நீதிச் செயல் அல்லது விடுவிக்கும் நியாயம் ஆகிய நிழற்பொருள்களைக் கொண்டிருக்கலாம். இயக்கத்தைக் குறிக்கும் בוא உடன் உள்ள உருவகத்தைத் தக்கவைக்க ‘உமது நீதிக்குள்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: சாபவேண்டுதலின் சூழலில் ‘உமது நீதி’ என்பதன் பொருள்
  choice: உமது நீதிக்குள்
  alternative: உமது நியாயத்திற்குள்; உமது நீதிப்படுத்தும் செயலுக்குள்
  rationale: இச்சொற்றொடர் தேவனுடைய நீதியான ஒழுங்கையோ, நியாயத் தீர்ப்பையோ, விடுவித்து நிலைநிறுத்தும் செயலையோ குறிக்கலாம். ஒரே இறையியல் விளக்கமாகக் குறுக்காமல், மூலத்தின் விரிந்த பொருள் மற்றும் உருவகம் முதன்மை உரையில் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், தேவனை நோக்கிய மரியாதைமிக்க வேண்டுதல் நடையில் மொழிபெயர்க்கப்பட்டது. சாபவேண்டுதலின் கடுமையும் ‘நீதிக்குள் வருதல்’ என்ற மூல உருவகமும் மென்மைப்படுத்தப்படாமல் தக்கவைக்கப்பட்டுள்ளன.
