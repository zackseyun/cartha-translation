base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/021.yaml
  text: They gave me poison for my food[c][b][a], and for my thirst they gave me vinegar to drink.
translation:
  language: ta
  text: அவர்கள் எனக்கு உணவாக நஞ்சைக்[a] கொடுத்தார்கள்; என் தாகத்துக்குப் புளித்த திராட்சரசத்தைக்[b] குடிக்கக் கொடுத்தார்கள்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கசப்பான நச்சுப் பொருளை”; பாரம்பரியமாக “பித்தநீரை.” எபிரெயச் சொல் இங்கு நச்சான அல்லது கடுமையாகக் கசக்கும் பொருளைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “காடியை (வினிகரை).” எபிரெயச் சொல் புளித்த திராட்சரசத்தையோ காடியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: முதல் அரையடியை, “என் உணவில் நஞ்சை வைத்தார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: syntactic_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: கொடுத்தார்கள்
  rationale: נתן என்பதன் வழக்கமான பொருள் ‘கொடு’; இங்கு கடந்தகாலக் கவிதை நிகழ்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּבָרוּתִי
  choice: எனக்கு உணவாக
  rationale: בָּרוּת என்பது உணவு அல்லது ஊட்டத்தைக் குறிக்கிறது. முன்னொட்டு בְּ இங்கு கொடுக்கப்பட்ட பொருள் உணவாக அமைந்ததைக் குறிக்கும் வகையில் புரிந்துகொள்ளப்பட்டுள்ளது; ‘என் உணவில்’ என்பதும் இலக்கணரீதியாகச் சாத்தியம்.
- source_word: רֹאשׁ
  choice: நஞ்சு
  rationale: இச்சூழலில் רֹאשׁ தலை என்பதைக் குறிக்காமல், நச்சுத்தன்மையுள்ள அல்லது கடுமையான கசப்புப் பொருளைக் குறிக்கிறது. ‘நஞ்சு’ என்பது இன்றைய வாசகருக்குத் தெளிவான பொதுச் சொல்.
- source_word: וְלִצְמָאִי
  choice: என் தாகத்துக்கு
  rationale: לְ முன்னொட்டு தாகத்தைத் தணிக்க வேண்டியதாகக் கொடுக்கப்பட்டதைச் சுட்டுகிறது; முதல் அரையடியுடன் உள்ள இணைநிலையையும் காக்கிறது.
- source_word: יַשְׁקוּנִי
  choice: குடிக்கக் கொடுத்தார்கள்
  rationale: שׁקה என்பதன் ஹிஃபீல் வடிவம் ‘குடிக்கச் செய் / குடிக்கக் கொடு’ என்று பொருள்படும்; சூழலில் ‘குடிக்கக் கொடுத்தார்கள்’ இயல்பாகவும் நேர்த்தியாகவும் உள்ளது.
- source_word: חֹמֶץ
  choice: புளித்த திராட்சரசம்
  rationale: חֹמֶץ என்பது புளிப்படைந்த திராட்சரசத்தையோ காடி போன்ற புளிப்புத் திரவத்தையோ குறிக்கலாம். பழங்காலப் பானச் சூழலைத் தெளிவாகக் காட்ட ‘புளித்த திராட்சரசம்’ முதன்மை உரையில் பயன்படுத்தப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: நற்செய்தி நூல்களின் பாடு நிகழ்வுகளுடனான தொடர்பொலி
  choice: சங்கீதத்தின் எபிரெயச் சொற்கள் தம் சொந்தச் சூழலில் தரும் பொருளின் அடிப்படையில் மொழிபெயர்த்தல்
  alternative: புதிய ஏற்பாட்டின் பாரம்பரியச் சொல்வடிவங்களுடன் இன்னும் நேரடியாக ஒத்துப்போக ‘பித்தநீர்’ மற்றும் ‘காடி’ போன்ற சொற்களை முதன்மை உரையில் பயன்படுத்துதல்
  rationale: பிற்காலத் தொடர்பை மறுப்பதோ வலுக்கட்டாயமாக முன்வைப்பதோ இல்லாமல், எபிரெய மூலத்தின் பொருளுக்கு முன்னுரிமை அளிக்கப்படுகிறது. பாரம்பரிய மாற்றுகள் அடிக்குறிப்புகளில் பதிவு செய்யப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், கவிதையின் இணை அமைப்பைத் தெளிவாக வைத்திருக்கும் கண்ணியமான நடை. ‘காடி’ என்ற மரபுச் சொல் பல இன்றைய வாசகர்களுக்கு அரிதாக இருக்கலாம் என்பதால் முதன்மை உரையில் ‘புளித்த திராட்சரசம்’ பயன்படுத்தப்பட்டு, மரபு மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
