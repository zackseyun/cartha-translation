  text: Rescue me from the mire; do not let me sink[a]. Let me be delivered from those who hate me and from the depths of the waters.
translation:
  language: ta
  text: சேற்றிலிருந்து என்னை மீட்டருளும்; நான் அமிழ்ந்து போகாதிருக்கட்டும். என்னை வெறுப்பவர்களிடமிருந்தும் நீரின் ஆழங்களிலிருந்தும் நான் தப்புவேனாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பகைவர்களிடமிருந்தும் ஆழமான நீரிலிருந்தும் நான் தப்புவேனாக.” எபிரெயக் கவிதையில் மீட்புக்கான மன்றாட்டு இணைநிலையில் மீண்டும் சொல்லப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: என்னை மீட்டருளும்
  rationale: נצל என்பதன் ஹிஃபில் கட்டளை வடிவம், முதலாம் நபர் ஒருமை பின்னொட்டுடன், ஆபத்திலிருந்து செயற்படையாக மீட்கும்படி வேண்டுகிறது. மரியாதையுடன் கூடிய வேண்டுதல் நடையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִטִּיט
  choice: சேற்றிலிருந்து
  rationale: טיט என்பது சேறு, சகதி அல்லது களிமண்ணைக் குறிக்கலாம். தொடர்ந்து வரும் அமிழ்தல் உருவகத்துக்கு ‘சேறு’ தெளிவாகவும் இயல்பாகவும் பொருந்துகிறது.
- source_word: וְאַל אֶטְבָּעָה
  choice: நான் அமிழ்ந்துபோக விடாதேயும்
  rationale: எதிர்மறைத் துகளுடன் வரும் முதலாம் நபர் imperfect ஒரு மன்றாட்டு வேண்டுதலை வெளிப்படுத்துகிறது. ‘விடாதேயும்’ அந்த வேண்டுதல் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: אִנָּצְלָה
  choice: நான் தப்புவேனாக
  rationale: נצל என்பதன் நிஃபால் cohortative வடிவம் மீண்டும் ஒரு விருப்பமிக்க மன்றாட்டைத் தருகிறது. ‘தப்புவேனாக’ என்பது நடுநிலை வடிவத்தின் தப்பித்தல் நுணுக்கத்தையும் கவிதை இணைநிலையையும் காக்கிறது.
- source_word: מִשֹּׂנְאַי
  choice: என்னை வெறுப்பவர்களிடமிருந்து
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘என்னை வெறுப்பவர்கள்’ என்று பொருள்படும்; ‘என் பகைவர்கள்’ என விளக்கமாக மாற்றாமல் அதன் சொற்பொருள் காக்கப்படுகிறது.
- source_word: וּמִמַּעֲמַקֵּי מָיִם
  choice: ஆழமான நீர்நிலைகளிலிருந்து
  rationale: מעמקים என்பது ஆழங்கள் அல்லது ஆழமான இடங்கள்; מים உடன் சேர்ந்து நீரின் ஆழமான பகுதிகளைக் குறிக்கிறது. ‘ஆழமான நீர்நிலைகள்’ தமிழில் இயல்பாக இருந்து, சேறு–அமிழ்தல் உருவகத் தொடரையும் பேணுகிறது.
