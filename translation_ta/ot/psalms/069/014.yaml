revisions:
- from: சேற்றிலிருந்து என்னை மீட்டருளும்; நான் அமிழ்ந்துபோக விடாதேயும். என்னை வெறுப்பவர்களிடமிருந்தும் ஆழமான நீர்நிலைகளிலிருந்தும் நான் தப்புவேனாக.[a]
  to: சேற்றிலிருந்து என்னை மீட்டருளும்; நான் அமிழ்ந்து போகாதிருக்கட்டும். என்னை வெறுப்பவர்களிடமிருந்தும் நீரின் ஆழங்களிலிருந்தும் நான் தப்புவேனாக.[a]
  rationale: The revision replaces an unidiomatic negative construction with a natural Tamil volitional plea and renders ‘depths of waters’ more closely as ‘நீரின் ஆழங்கள்.’ The renewed first-person plea ‘நான் தப்புவேனாக’ retains the source’s volitional force and does not over-specify the agent of deliverance. The footnote continues to present the permitted alternative involving ‘enemies’ and ‘deep waters.’
