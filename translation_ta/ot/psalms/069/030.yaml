  yaml_path: translation/ot/psalms/069/030.yaml
  text: I will praise the name of God with song[a], and I will magnify him with thanksgiving.
translation:
  language: ta
  text: 'பாடலால் கடவுளின் பெயரைப் புகழ்வேன்;

    நன்றியுடன்[a] அவரை உயர்த்திப் போற்றுவேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நன்றிப் பலியால்’; எபிரெயச் சொல் சூழலைப் பொறுத்து நன்றி செலுத்துதலையோ நன்றிப் பலியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: புகழ்வேன்
  rationale: முதல் நபர் ஒருமை cohortative வடிவத்தின் மனவுறுதியை இயல்பான தமிழ் எதிர்கால வினையால் வெளிப்படுத்துகிறது.
- source_word: שֵׁם אֱלֹהִים
  choice: கடவுளின் பெயரை
  rationale: எபிரெயக் கூட்டு அமைப்பையும் ‘பெயர்’ என்பதன் பக்திநிறைந்த கருத்தையும் நேரடியாகப் பேணுகிறது.
- source_word: בְּשִׁיר
  choice: பாடலால்
  rationale: ב முன்னிடைச்சொல் இங்கு கருவி அல்லது முறையைக் குறிக்கிறது; ‘பாடலால்’ அதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַאֲגַדְּלֶנּוּ
  choice: அவரை உயர்த்திப் போற்றுவேன்
  rationale: גדל என்பதன் piel பயன்பாடு கடவுளை அளவில் பெரிதாக்குதல் அல்ல, அவரது மேன்மையை எடுத்துரைத்துப் போற்றுதல் என்பதைக் குறிக்கிறது. இச்சொற்றொடர் அந்தப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: בְתוֹדָה
  choice: நன்றியுடன்
  rationale: תּוֹדָה நன்றி செலுத்துதலையோ நன்றிப் பலியையோ குறிக்கலாம். பாடலும் புகழ்ச்சியும் இடம்பெறும் இணை அமைப்பில் வாய்மொழியான நன்றி செலுத்துதல் முதன்மைப் பொருளாகத் தெரிகிறது.
theological_decisions:
- issue: תּוֹדָה என்பது நன்றி செலுத்துதலையா நன்றிப் பலியையா குறிக்கிறது?
  choice: வாய்மொழியான நன்றி செலுத்துதல்
  alternative: நன்றிப் பலி
  rationale: ‘புகழ்வேன்’, ‘பாடலால்’, ‘போற்றுவேன்’ என்ற வாய்மொழி மற்றும் இசை சார்ந்த இணை அமைப்புக்கு ‘நன்றியுடன்’ என்பது சிறப்பாகப் பொருந்துகிறது; எனினும் பலியைக் குறிக்கும் சொற்பொருளும் சாத்தியமானதால் அடிக்குறிப்பில் அது பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் வழிபாட்டுக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. எபிரெயக் கவிதையின் இரு இணையான செயல்கள் அரைப்புள்ளியால் தெளிவுபடுத்தப்பட்டுள்ளன; cohortative வடிவங்களின் உறுதியான மனநிலை ‘புகழ்வேன்’, ‘போற்றுவேன்’ எனப் பேணப்பட்டுள்ளது.
