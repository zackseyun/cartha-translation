  yaml_path: translation/ot/psalms/069/008.yaml
  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
translation:
  language: ta
  text: 'என் சகோதரர்களுக்கு நான் அந்நியனானேன்[a];

    என் தாயின் மகன்களுக்கு அயலானானேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் அந்நியனாக இருந்தேன்” அல்லது “நான் அந்நியனானேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் எளிய இறந்தகால நிலையையோ, அந்த நிலைக்கு வந்ததையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּזָר
  choice: அந்நியன்
  rationale: זוּר என்பதிலிருந்து வந்த இந்தச் சொல், உறவினரிடையே அந்நியனாக அல்லது ஒதுக்கப்பட்டவனாக இருப்பதைக் குறிக்கிறது. “அந்நியன்” என்பது அடுத்த அடியிலுள்ள “வேற்றாள்” என்பதுடன் இயல்பான கவிதை இணையை உருவாக்குகிறது.
- source_word: הָיִיתִי
  choice: ஆனேன்
  rationale: היה என்பதன் qatal வடிவம் இங்கு அந்நியனாகிய நிலையைச் சுட்டுகிறது. “ஆனேன்” என்பது அந்த நிலைக்கு வந்ததைக் காட்டுகிறது; எளிய இறந்தகாலமான “இருந்தேன்” என்பதும் இலக்கண ரீதியில் சாத்தியம்.
- source_word: לְאֶחָי
  choice: என் சகோதரர்களுக்கு
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக “என் சகோதரர்களுக்கு” என்று பொருள்படுகிறது. மூலத்திலுள்ள ஆண்பால் பன்மை உறவுச் சொல்லை பொதுமைப்படுத்தாமல் தக்கவைக்கிறது.
- source_word: וְנָכְרִי
  choice: வேற்றாள்
  rationale: נָכְרִי என்பது வேறொரு இனத்தையோ இடத்தையோ சேர்ந்தவர், அயலார் அல்லது உறவில்லாதவர் போன்ற பொருள்களைக் கொண்டது. “வேற்றாள்” இங்கு குடும்பத்தினருக்கே அயலானவனாகக் கருதப்பட்ட தீவிரமான உறவுப் பிரிவைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: לִבְנֵי אִמִּי
  choice: என் தாயின் மகன்களுக்கு
  rationale: மூலத்தின் “என் தாயின் மகன்களுக்கு” என்ற சொற்றொடரை நேரடியாகத் தக்கவைத்து, “என் சகோதரர்கள்” என்பதுடனான கவிதை இணைப்பையும் ஆண்பால் உறவுச் சொல்லையும் பாதுகாக்கிறது.
theological_decisions:
- issue: பாலினம் குறிக்கப்பட்ட உறவுச் சொற்கள்
  choice: “சகோதரர்கள்” மற்றும் “என் தாயின் மகன்கள்” என்பவற்றை முதன்மை உரையில் தக்கவைத்தல்
  alternative: “உடன்பிறந்தவர்கள்” அல்லது “குடும்பத்தினர்”
  rationale: எபிரெய உரை வெளிப்படையாக ஆண்பால் பன்மை உறவுச் சொற்களை இணை அடிகளில் பயன்படுத்துகிறது. சூழல் அவற்றைப் பொதுப்பாலாக மாற்றுமாறு கட்டாயப்படுத்தாததால், மூலத்தின் பாலினக் குறிப்பைத் தக்கவைப்பது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதப் புலம்பலுக்கேற்ற சுருக்கமான கவிதை நடையும் கண்ணியமான மொழியும் பயன்படுத்தப்பட்டுள்ளன. இணை அடிகளின் அமைப்பைக் காக்க “அந்நியன்” / “வேற்றாள்” மற்றும் “சகோதரர்கள்” / “தாயின் மகன்கள்” என்ற சொல் இணைகள் பயன்படுத்தப்பட்டுள்ளன.
