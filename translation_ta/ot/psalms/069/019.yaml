translation_notes:
  register: நவீன நிலையான தமிழில், ஜெபத்திற்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்/உமக்கு’ பயன்படுத்தப்பட்டுள்ளன. எபிரெய உரையில் உள்ள நிந்தை–அவமானம்–இழிவு என்ற நெருங்கிய பொருளுடைய மும்மைச் சொல் அடுக்கு சுருக்கப்படாமல் பேணப்பட்டுள்ளது. வழங்கப்பட்ட ஆங்கில அடிக்குறிப்பு உரையின் இடம் அல்லது தொடர்பு மூலவசனத்துடன் பொருந்தாததால், மூல எபிரெய உரையில் இல்லாத மாற்றுப் பொருளை இணைக்காமல் அடிக்குறிப்பு சேர்க்கப்படவில்லை.
