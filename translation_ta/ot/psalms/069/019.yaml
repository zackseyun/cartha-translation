source:
  edition: WLC
  text: אַתָּ֤ה יָדַ֗עְתָּ חֶרְפָּתִ֣/י וּ֭/בָשְׁתִּ/י וּ/כְלִמָּתִ֑/י נֶ֝גְדְּ/ךָ֗ כָּל צוֹרְרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/019.yaml
  text: You know my reproach[a], my shame, and my humiliation; all my adversaries are before you.
translation:
  language: ta
  text: எனக்கு நேர்ந்த நிந்தையையும், என் அவமானத்தையும், என் இழிவையும் நீர் அறிவீர்; என் பகைவர்கள்[a] அனைவரும் உமக்கு முன்பாக இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் எதிரிகள் அனைவரும் உமக்கு முன்பாக இருக்கிறார்கள்.”
    reason: צוֹרְרָי என்பதற்கு ‘பகைவர்கள்’ என்பதற்குப் பதில் ‘எதிரிகள்’ என்பது சாத்தியமான சொல்-மாற்று; அடிக்குறிப்பு பொருந்தும் சொல்லிலேயே இணைக்கப்பட்டுள்ளது.
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: நீர் அறிவீர்
  rationale: ידע என்பதன் Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் கடவுளை நேரடியாக விளிக்கிறது. இங்கு நிலைத்த அறிதலையும் முழுமையான விழிப்புணர்வையும் இயல்பான தமிழில் நிகழ்காலமாகத் தருகிறது.
- source_word: חֶרְפָּתִי
  choice: எனக்கு நேர்ந்த நிந்தை
  rationale: חרפה சமூகத்தின் பழிப்பு, ஏளனம், நிந்தை ஆகியவற்றைக் குறிக்கிறது. ‘என் நிந்தை’ என்பது தமிழில் பேசுபவர் பிறரை நிந்திப்பதாகத் தவறாகப் புரியக்கூடும்; ஆகவே அவர் அனுபவித்த நிந்தை என்ற பொருளைத் தெளிவாக்குகிறது.
- source_word: בָשְׁתִּי
  choice: என் அவமானம்
  rationale: בשׁת குறிக்கும் வெட்கம் அல்லது மானக்கேட்டின் தீவிரத்தைக் ‘அவமானம்’ இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: כְלִמָּתִי
  choice: என் இழிவு
  rationale: כלמה என்பது அவமானம், இழிவுபடுத்தப்படுதல் ஆகிய பொருள்களைக் கொண்டது. முந்தைய சொல்லுடன் உள்ள நெருங்கிய பொருள் உறவைப் பேணியபடியே மூன்று சொற்களின் கவிதைநடை அடுக்கை வேறுபடுத்திக் காட்ட ‘இழிவு’ பயன்படுத்தப்படுகிறது.
- source_word: נֶגְדְּךָ
  choice: உமக்கு முன்பாக
  rationale: נגד உடன் வரும் இரண்டாம் நபர் பின்னொட்டு, கடவுளின் பார்வைக்கும் முன்னிலைக்கும் எதிரிகள் வெளிப்படையாக இருப்பதைச் சுட்டுகிறது. ‘உமக்கு முன்பாக’ இதைச் சுருக்கமாகப் பேணுகிறது.
- source_word: כָּל
  choice: அனைவரும்
  rationale: பன்மையில் மனித எதிரிகளைக் குறிக்கும் பெயருடன் כָּל முழுமையைக் காட்டுவதால், தமிழில் மனிதர்களுக்குரிய இயல்பான தொகுப்புச் சொல்லான ‘அனைவரும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: צוֹרְרָי
  choice: என் பகைவர்கள்
  rationale: צרר வேரிலிருந்து வரும் இச்சொல் பகைமையுடன் எதிர்ப்பவர்களைக் குறிக்கிறது. ‘பகைவர்கள்’ நவீனத் தமிழில் தெளிவாகவும் சங்கீதத்தின் கவிதைநடைக்கு ஏற்றதாகவும் உள்ளது.
