  text: אַל תִּשְׁטְפֵ֤/נִי שִׁבֹּ֣לֶת מַ֭יִם וְ/אַל תִּבְלָעֵ֣/נִי מְצוּלָ֑ה וְ/אַל תֶּאְטַר עָלַ֖/י בְּאֵ֣ר פִּֽי/הָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/015.yaml
  text: Do not let the flood of waters sweep me away[a], and do not let the deep swallow me up[b], and do not let the pit close its mouth over me.
translation:
  language: ta
  text: நீர்ப்பெருக்கு என்னை அடித்துச் செல்லாதிருக்கட்டும்[a]; ஆழம் என்னை விழுங்காதிருக்கட்டும்; குழி தன் வாயை என்மேல் மூடாதிருக்கட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீரோட்டம் என்னை அடித்துச் செல்லாதிருக்கட்டும்.’
    reason: lexical_alternative
  - marker: b
    text: ‘குழி’ என்பதற்கான எபிரெயச் சொல் ‘கிணறு’ என்றும் பொருள்படலாம்; இங்கு கவிதை இணைநிலையின் ஆபத்தான படிமத்தால் ‘குழி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי
  choice: என்னை அடித்துச் செல்லாதிருக்கட்டும்
  rationale: שטף என்பது பெருக்கெடுத்து மூழ்கடித்தல் அல்லது அடித்துச் செல்லுதலைக் குறிக்கிறது. இங்கு பாயும் நீரின் அழிவாற்றலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׁבֹּלֶת מַיִם
  choice: நீர்ப்பெருக்கு
  rationale: இந்தச் சொற்றொடர் பாயும் நீரோட்டம், வெள்ளம் அல்லது பெருக்கைக் குறிக்கலாம். ‘நீர்ப்பெருக்கு’ கவித்துவச் செறிவையும் ஆபத்தான நீரோட்டத்தின் படிமத்தையும் காக்கிறது.
- source_word: תִּבְלָעֵנִי
  choice: என்னை விழுங்காதிருக்கட்டும்
  rationale: בלע என்பதன் நேரடியான ‘விழுங்கு’ என்ற பொருளைத் தக்கவைத்து, முழுமையாக உள்ளிழுக்கப்படுதல் என்ற உருவகத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְצוּלָה
  choice: ஆழம்
  rationale: ஆழ்கடல் அல்லது ஆழமான நீர்ப்பகுதியைக் குறிக்கும் சொல்லாகும். ‘ஆழம்’ சுருக்கமாகவும் கவித்துவமாகவும் மூலத்தின் உருவகத்தைப் பேணுகிறது.
- source_word: תֶּאְטַר
  choice: மூடாதிருக்கட்டும்
  rationale: அடைத்தல் அல்லது மூடுதல் என்ற பொருளை ‘தன் வாயை’ என்ற உருவகத்துடன் இயல்பாக இணைக்கிறது.
- source_word: בְּאֵר
  choice: குழி
  rationale: באר வழக்கமாகக் ‘கிணறு’ என்றும் பொருள்படலாம்; ஆனால் ஆபத்து, விழுங்குதல், வாய் மூடுதல் ஆகிய இணை உருவகங்களில் ‘குழி’ உயிரைப் பறிக்கும் பாதாளக் குழியின் உணர்வைத் தெளிவாகத் தருகிறது.
- source_word: פִּיהָ
  choice: தன் வாயை
  rationale: எபிரெயப் பெண்பால் பின்னொட்டு באר என்பதுடன் இலக்கண ஒத்திசைவு பெறுகிறது. தமிழில் ‘தன் வாயை’ என்பது குழியை உயிருள்ள ஒன்றாகச் சித்தரிக்கும் உருவகத்தைப் பேணுகிறது.
- source_word: עָלַי
  choice: என்மேல்
  rationale: குழியின் வாய் பேசுபவருக்கு மேலாக மூடிக்கொள்வதைக் குறிக்கும் இடவியல் உருவகத்தை நேரடியாகப் பேணுகிறது.
