  language: ta
  text: அவர்களுடைய கண்கள் காண முடியாதபடி இருண்டுபோகட்டும்[a]; அவர்களுடைய இடுப்புகள் எப்போதும் தள்ளாடும்படி செய்வீராக.[b]
