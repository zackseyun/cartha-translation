lexical_decisions:
- source_word: תֶּחְשַׁכְנָה
  choice: இருண்டுபோகட்டும்
  rationale: இச்சூழலில் Qal முற்றுப்பெறா வினை வேண்டுதல் அல்லது சாபவேண்டுதலின் வலிமையைக் கொண்டுள்ளது. ‘இருண்டுபோகட்டும்’ என்பது ஏற்பட வேண்டிய நிலையையும் வேண்டுதலின் தொனியையும் இயல்பான தமிழில் தருகிறது.
- source_word: עֵינֵיהֶם
  choice: அவர்களுடைய கண்கள்
  rationale: உடல் உறுப்பை மையப்படுத்தும் எபிரெயக் கவிப்படிமத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: מֵרְאוֹת
  choice: காண முடியாதபடி
  rationale: מן முன்னொட்டுடன் வரும் ראה வினையெச்சத்தின் சொற்பொருள் ‘காண்பதிலிருந்து’ என்பதாக இருந்தாலும், இங்கு பார்வை தடுக்கப்படுதல் அல்லது இயலாமை என்பதே இயல்பான பொருள். அதனால் பொருளைத் தெளிவாகக் கூறி, சொற்சொல் வடிவத்தை அடிக்குறிப்பில் வைத்துள்ளோம்.
- source_word: וּמָתְנֵיהֶם
  choice: அவர்களுடைய இடுப்புகளை
  rationale: מָתְנַיִם குறிக்கும் இடுப்பு அல்லது அரைப் பகுதியை நவீனத் தமிழில் தெளிவாகச் சொல்கிறது; உடல் சார்ந்த மூலப்படிமமும் நீடிக்கிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: தொடர்ந்து நீடிக்கும் நிலையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: הַמְעַד
  choice: தள்ளாடச் செய்வீராக
  rationale: Hiphil கட்டளை வடிவத்தின் காரணவினைப் பொருளை ‘செய்வீராக’ பாதுகாக்கிறது. מעד என்பதன் நிலைதடுமாறுதல் அல்லது தள்ளாடுதல் என்ற உடல்சார் படிமத்தை ‘தள்ளாட’ நெருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வசனத்தின் சாபவேண்டுதல் சார்ந்த வலிமை
  choice: ‘இருண்டுபோகட்டும் ... செய்வீராக’ என இறைவனை நோக்கிய வேண்டுதலாக மொழிபெயர்த்தல்
  alternative: ‘அவர்களுடைய கண்கள் இருண்டுபோகும் ... இடுப்புகள் தள்ளாடும்’ என எதிர்கால முன்னறிவிப்பாக மொழிபெயர்த்தல்
  rationale: சூழலில் வினை வடிவங்கள் வெறும் முன்னறிவிப்பாக அல்லாமல் நீதித்தீர்ப்பைக் கோரும் வேண்டுதலாகச் செயல்படுகின்றன. இதை மென்மைப்படுத்தாமலும், கூடுதல் கோட்பாட்டு விளக்கம் சேர்க்காமலும் தமிழில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கும் இறைவனை நோக்கிய வேண்டுதலுக்கும் ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘செய்வீராக’ என்பது மூலத்தின் நேரடி கட்டளையையும் தமிழின் மரியாதைமிக்க வேண்டுதல் நடையையும் இணைக்கிறது; ‘இடுப்பு’ என்பது பழமையான அல்லது தெளிவில்லாத உடற்கூறு சொல்லைத் தவிர்க்கிறது.
