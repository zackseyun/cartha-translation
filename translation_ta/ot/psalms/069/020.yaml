source:
  edition: WLC
  text: חֶרְפָּ֤ה שָֽׁבְרָ֥ה לִבִּ֗/י וָֽ/אָ֫נ֥וּשָׁ/ה וָ/אֲקַוֶּ֣ה לָ/נ֣וּד וָ/אַ֑יִן וְ֝/לַ/מְנַחֲמִ֗ים וְ/לֹ֣א מָצָֽאתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/020.yaml
  text: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
translation:
  language: ta
  text: நிந்தை என் இதயத்தை நொறுக்கிவிட்டது; நான் நலிந்திருக்கிறேன். பரிவு காட்டுவோரை எதிர்பார்த்தேன்; எவரும் இல்லை. ஆறுதலளிப்போரைத் தேடினேன்; எவரையும் காணவில்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶרְפָּה
  choice: நிந்தை
  rationale: பிறர் சுமத்தும் இகழ்ச்சியையும் அதனால் வரும் அவமானத்தையும் குறிக்கும் சொல்; சங்கீதப் புலம்பலின் நடைக்கு ஏற்ற இயல்பான தமிழ்ச் சொல்.
- source_word: שָׁבְרָה לִבִּי
  choice: என் உள்ளத்தை உடைத்துவிட்டது
  rationale: எபிரெய மொழியின் உருவகத்தைத் தக்கவைத்து, அதன் விளைவாக நீடிக்கும் மனமுறிவை இயல்பான தமிழில் தெரிவிக்கிறது. ‘உள்ளம்’ இங்கு உணர்ச்சியும் மனவுறுதியும் அடங்கிய அகமனிதனைக் குறிக்கிறது.
- source_word: וָאֲנוּשָׁה
  choice: நான் மிகவும் நலிவுற்றிருக்கிறேன்
  rationale: கடுமையாகப் பாதிக்கப்பட்ட நிலையைக் குறிக்கிறது; உடல் நோய் என்று மட்டும் சுருக்காமலும் ‘குணப்படுத்த முடியாதவன்’ என்று மிகைப்படுத்தாமலும் மூலத்தின் பரந்த பொருளைக் காக்கிறது.
- source_word: וָאֲקַוֶּה
  choice: எதிர்பார்த்தேன்
  rationale: காத்திருத்தல் அல்லது நம்பிக்கையுடன் எதிர்நோக்குதல் என்ற பொருளை, இங்கு மனிதரிடமிருந்து கிடைக்க வேண்டிய பதிலை நோக்கிய எதிர்பார்ப்பாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לָנוּד
  choice: பரிவு காட்டுவோரை
  rationale: துன்பப்படுபவரோடு இரக்கத்துடன் மனம் இணைந்து வருந்துவதை வெளிப்படுத்துகிறது; அடுத்துள்ள ‘ஆறுதலளிப்போர்’ என்பதிலிருந்து பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: וָאַיִן
  choice: எவரும் இல்லை
  rationale: எதிர்பார்க்கப்பட்ட மனிதப் பதில் முற்றிலும் இல்லாததைச் சுருக்கமாகவும் வலிமையாகவும் கூறுகிறது.
- source_word: וְלַמְנַחֲמִים
  choice: ஆறுதலளிப்போரை
  rationale: ஆறுதல் தரக்கூடிய நபர்களைக் குறிக்கும் பன்மைப் பங்கேற்புப் பெயரின் தனிப்பட்ட மனிதச் சுட்டுதலைத் தக்கவைக்கிறது.
- source_word: וְלֹא מָצָאתִי
  choice: எவரையும் காணவில்லை
  rationale: தேடிய ஆறுதலாளர்கள் யாரும் கிடைக்கவில்லை என்பதைக் கூறி, முந்தைய அரையடியின் இணைநடையை இயல்பான தமிழில் பேணுகிறது.
theological_decisions:
- issue: கிறிஸ்தவ விளக்கத்தில் மேசியாவோடு தொடர்புபடுத்துதல்
  choice: வசனத்தை முதலில் சங்கீதத்தின் தனிநபர் புலம்பல் சூழலில் மொழிபெயர்த்து, வெளிப்படையான மேசியக் குறிப்பை முதன்மை உரையில் சேர்க்கவில்லை.
  alternative: முதன்மை உரையிலேயே மேசியாவின் பாடுகளை நேரடியாக முன்னறிவிப்பதாக மொழிபெயர்த்தல்.
  rationale: புதிய ஏற்பாடு சங்கீதம் 69-ஐ இயேசுவோடு தொடர்புபடுத்தினாலும், இவ்வசனத்தின் எபிரெய உரை ஒரு தனிநபரின் புலம்பலாகவே மொழிபெயர்க்கப்பட வேண்டும். இம்மொழிபெயர்ப்பு பின்னைய மேசியப் பயன்பாட்டோடு ஒத்திசைவதற்கான இடத்தைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான புலம்பல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நிந்தை’, ‘உள்ளம்’, ‘பரிவு’, ‘ஆறுதல்’ ஆகிய சொற்கள் கவித்துவத் தன்மையையும் இயல்பான வாசிப்பையும் சமநிலைப்படுத்துகின்றன; இணை அமைப்பைத் தெளிவாக்க ‘எதிர்பார்த்தேன்’ இருமுறை வழங்கப்பட்டுள்ளது.
