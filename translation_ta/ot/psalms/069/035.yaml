  yaml_path: translation/ot/psalms/069/035.yaml
  text: For God will save Zion and build the cities of Judah[b][a], and they will dwell there and possess it.
translation:
  language: ta
  text: ஏனெனில், கடவுள் சீயோனைக் காப்பாற்றுவார்; யூதாவின் நகரங்களைக் கட்டுவார். அவர்கள் அங்கே குடியிருப்பார்கள்; அவளை உரிமையாக்கிக் கொள்வார்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவளைச் சுதந்தரித்துக்கொள்வார்கள்’ அல்லது ‘அவளைக் கைப்பற்றிக்கொள்வார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை, குறிப்பாக நிலத்தைப் பற்றிப் பேசும்போது, சுதந்தரித்தல் அல்லது உடைமையாக்குதல் என்ற பொருள்களைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மூலத்தில் வினையின் செயப்படுபொருள் பெண்பால் ஒருமையில் உள்ளது. அது சீயோனை அல்லது பெண்ணாக உருவகிக்கப்படும் நிலம் அல்லது நகரத்தைச் சுட்டக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய நம்பிக்கைக்கும் துதிக்கும் அடிப்படையை விளக்கும் இணைப்பாக இங்கு வருகிறது; எனவே விளக்கக் காரணத்தைக் காட்டும் ‘ஏனெனில்’ பொருத்தமானது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: எபிரெய வினை ஒருமையில் இருப்பதால், இங்கு ஒருமைப் பொருளே தெளிவாக உள்ளது.
- source_word: יוֹשִׁיעַ
  choice: காப்பாற்றி
  rationale: ישׁע என்பதன் Hiphil வடிவம் ‘காப்பாற்றுதல், விடுவித்தல்’ என்று பொருள்படும். தொடர்வினை அமைப்பில் அடுத்துள்ள ‘கட்டுவார்’ என்பதுடன் எதிர்காலப் பொருள் இயல்பாக வெளிப்படுகிறது.
- source_word: צִיּוֹן
  choice: சீயோன்
  rationale: இடப்பெயர் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் தக்கவைக்கப்படுகிறது.
- source_word: וְיִבְנֶה
  choice: கட்டுவார்
  rationale: בנה என்பதன் அடிப்படைப் பொருள் ‘கட்டுதல்’. ‘மீண்டும் கட்டுவார்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத மறுகட்டுமானக் கருத்தைச் சேர்க்கும்.
- source_word: עָרֵי יְהוּדָה
  choice: யூதாவின் நகரங்கள்
  rationale: எபிரெய சார்பு அமைப்பு இயல்பான தமிழ்ச் சொற்றொடராக நேரடியாக வழங்கப்படுகிறது.
- source_word: וְיָשְׁבוּ
  choice: அவர்கள் … குடியிருந்து
  rationale: ישׁב இங்கு நிலையாக வாழ்தல் அல்லது குடியிருத்தலைக் குறிக்கிறது; ‘குடியிருந்து’ என்பது நிலத்தில் வாழும் கருத்தை இயல்பாகக் காக்கிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: முன்னர் குறிப்பிடப்பட்ட சீயோன் மற்றும் யூதாவின் நகரங்களைச் சுட்டும் இடவினையடை.
- source_word: וִירֵשׁוּהָ
  choice: அவளைத் தங்கள் உடைமையாக்கிக்கொள்வார்கள்
  rationale: ירשׁ என்பது ‘உடைமையாக்குதல், உரிமைபெறுதல், சுதந்தரித்தல்’ என்ற பொருள்களை உடையது. பெண்பால் ஒருமை பின்னொட்டைப் பாதுகாக்க ‘அவளை’ பயன்படுத்தப்பட்டுள்ளது; இது சீயோனை அல்லது பெண்ணாக உருவகிக்கப்படும் நிலத்தைச் சுட்டலாம்.
theological_decisions:
- issue: וִירֵשׁוּהָ என்பதிலுள்ள பெண்பால் ஒருமை பின்னொட்டின் சுட்டுப்பொருள்
  choice: ‘அவளைத் தங்கள் உடைமையாக்கிக்கொள்வார்கள்’ என்று பெண்பால் உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘அதைத் தங்கள் உடைமையாக்கிக்கொள்வார்கள்’ அல்லது ‘சீயோனை உரிமையாக்கிக்கொள்வார்கள்’
  rationale: பின்னொட்டு பெண்பால் ஒருமையில் இருந்தாலும், அது சீயோனையா, நிலத்தையா, நகரமாக உருவகிக்கப்பட்ட இடத்தையா சுட்டுகிறது என்பது முழுமையாகத் தீர்மானிக்கப்படவில்லை. ‘அவளை’ என்பது மூலத்தின் உருவகத்தையும் தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்கு எளிதாகவும் சங்கீதத்திற்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘மீண்டும் கட்டுவார்’ என்று விளக்கிப் பெருக்காமல், மூலத்தின் ‘கட்டுவார்’ தக்கவைக்கப்பட்டது. இறுதி பெண்பால் சுட்டு தமிழில் சற்றுக் கவித்துவமாக ஒலித்தாலும், எபிரெய உருவகத்தையும் சுட்டுப்பொருளின் தெளிவின்மையையும் பாதுகாக்கிறது.
