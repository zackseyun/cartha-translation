- from: ஏனெனில், கடவுள் சீயோனைக் காப்பாற்றி, யூதாவின் நகரங்களைக் கட்டுவார்; அவர்கள் அங்கே குடியிருந்து, அவளைத் தங்கள் உடைமையாக்கிக்கொள்வார்கள்[a][b].
