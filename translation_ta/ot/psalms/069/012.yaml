source:
  edition: WLC
  text: יָשִׂ֣יחוּ בִ֭/י יֹ֣שְׁבֵי שָׁ֑עַר וּ֝/נְגִינ֗וֹת שׁוֹתֵ֥י שֵׁכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/012.yaml
  text: Those who sit in the gate talk about me[b][a], and I am the song of those who drink strong drink.
translation:
  language: ta
  text: வாசலில் அமர்ந்திருப்பவர்கள் என்னைப் பற்றிப் பேசுகிறார்கள்[a]; போதையூட்டும் பானம் குடிப்பவர்களின் பாடல்களின் பொருளாக நான் இருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பண்டைய நகரங்களில் ‘வாசல்’ என்பது குடிமை விவகாரங்களும் நீதி விசாரணைகளும் நடைபெற்ற பொது இடமாக இருந்தது. எனவே, இச்சொற்றொடர் வெறும் வாயிற்காவலர்களை அல்ல, பொதுவெளியில் செல்வாக்குடையவர்களின் ஏளனத்தைக் குறிக்கக்கூடும்.
    reason: cultural_note
lexical_decisions:
- source_word: יָשִׂיחוּ בִי
  choice: என்னைப் பற்றிப் பேசுகிறார்கள்
  rationale: שׂיח என்பது தியானித்தல் அல்லது பேசுதல் எனப் பொருள்படலாம். இங்குள்ள பகைமையான சமூகச் சூழலில் பேச்சு அல்லது ஏளன உரையாடலே பொருத்தமானது. בִי என்பது பேச்சின் பொருளைச் சுட்டுவதால், ‘என்னைப் பற்றி’ என்று மொழிபெயர்க்கப்பட்டது; ‘எனக்கு எதிராக’ என்பது மூலத்தில் நேரடியாக இல்லாத பகைநோக்கைச் சேர்த்துவிடும்.
- source_word: יֹשְׁבֵי שָׁעַר
  choice: வாசலில் உட்கார்ந்திருப்பவர்கள்
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தைப் பாதுகாக்கிறது. பண்டைய நகர வாசல் குடிமை வாழ்வும் நீதி விசாரணையும் நடைபெற்ற பொது இடமாக இருந்தது; எனினும் ‘அதிகாரிகள்’ அல்லது ‘மூப்பர்கள்’ என்று குறிப்பாகக் குறுக்கப்படவில்லை.
- source_word: וּנְגִינוֹת
  choice: பாடலாகவும் நான் ஆகிவிட்டேன்
  rationale: இந்தப் பன்மை வடிவம் பாடல்கள் அல்லது இசைப் பாடல்களைக் குறிக்கிறது. முதல் அடியுடன் இணையும் பொருளில், சங்கீதக்காரர் அவர்களுடைய பாடல்களின் கருப்பொருளாகிவிட்டார் என்பதைக் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שׁוֹתֵי שֵׁכָר
  choice: போதைப் பானம் குடிப்பவர்கள்
  rationale: שֵׁכָר என்பது திராட்சரசத்திலிருந்து வேறுபட்ட போதையூட்டும் பானத்தைக் குறிக்கிறது. ‘குடிகாரர்கள்’ என்பது சாத்தியமான சுருக்கமான மாற்றாக இருந்தாலும், மூலத்தின் செயற்பாட்டு வருணனையையும் பானத்தின் தன்மையையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
