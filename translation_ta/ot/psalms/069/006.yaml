  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/006.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be humiliated because of me[b], God of Israel.
translation:
  language: ta
  text: உம்மை நம்பிக்கையோடு எதிர்பார்ப்பவர்கள்[a] என்னால் வெட்கத்திற்கு ஆளாகாதிருப்பார்களாக; படைகளின் ஆண்டவராகிய யாவேவே[b], உம்மைத் தேடுகிறவர்கள் என்னால் அவமானம் அடையாதிருப்பார்களாக; இஸ்ரவேலின் கடவுளே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமக்காகக் காத்திருப்பவர்கள்.” எபிரெயப் பங்கேற்புவினை நம்பிக்கையோடு காத்திருப்பதையும் எதிர்பார்ப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “ஆண்டவர் யாவே, படைகளின்.” இங்கு יהוה என்ற இறைப் பெயர் “யாவே” என்று தரப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: வெட்கத்திற்கு ஆளாகாதிருப்பார்களாக
  rationale: בוש குறிக்கும் வெட்கம் அல்லது இழிவுக்கு ஆளாகும் விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִי
  choice: என்னால்
  rationale: சங்கீதக்காரன் பிறருடைய வெட்கத்திற்குக் காரணமாகிவிடக் கூடாது என்ற சூழல்சார் காரணப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: קֹוֶיךָ
  choice: உம்மை நம்பிக்கையோடு எதிர்பார்ப்பவர்கள்
  rationale: קוה என்பதிலுள்ள காத்திருத்தல் மற்றும் நம்பிக்கையுடன் எதிர்பார்த்தல் ஆகிய இரு நுணுக்கங்களையும் ஒருங்கிணைக்கிறது.
- source_word: אֲדֹנָי יְהוָה צְבָאוֹת
  choice: படைகளின் யாவேவாகிய ஆண்டவரே
  rationale: אֲדֹנָי என்பதைக் ‘ஆண்டவர்’ என்றும், יהוה என்ற திருப்பெயரை ‘யாவே’ என்றும் வெளிப்படையாகக் காட்டி, צְבָאוֹת என்பதன் ‘படைகள்’ என்ற உருவகத்தையும் பாதுகாக்கிறது.
- source_word: יִכָּלְמוּ
  choice: அவமானம் அடையாதிருப்பார்களாக
  rationale: כלם குறிக்கும் அவமானம் அல்லது இழிவைத் தெரிவித்து, முதல் இணை வினையான בוש உடன் இருக்கும் கவிதை வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: מְבַקְשֶׁיךָ
  choice: உம்மைத் தேடுகிறவர்கள்
  rationale: בקש என்ற தொடர்ச்சியான தேடுதல் செயலை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளே
  rationale: மூலத்தின் இணைப்புத் தொடரையும் நேரடி அழைப்பின் வலிமையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: אֲדֹנָי יהוה என்ற கூட்டு இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவேவாகிய ஆண்டவர்
  alternative: ஆண்டவராகிய கர்த்தர்
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரைப் பொதுப் பட்டத்தால் மறைக்காமல் ‘யாவே’ என்று வெளிப்படையாகத் தருகிறது; அதேவேளையில் אֲדֹנָי என்பதையும் ‘ஆண்டவர்’ எனப் பாதுகாக்கிறது.
- issue: צְבָאוֹת என்பதன் குறிப்பு
  choice: படைகள்
  alternative: வல்லமையுள்ளவர்
  rationale: இச்சொல் எந்தப் படைகளைக் குறிக்கிறது என்பதை உரை வெளிப்படையாகத் தீர்மானிக்காததால், உருவகத்தையும் உண்மையான தெளிவின்மையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதை ஒருமையான ‘உம்மை’ வடிவத்துடன், ஜெபத்திற்கேற்ற கண்ணியமான நடையும் இணைவரி அமைப்பும் பயன்படுத்தப்பட்டுள்ளன. ‘வெட்கம்’ மற்றும் ‘அவமானம்’ என வேறுபடுத்தி எபிரெயக் கவிதையின் ஒத்திசைவும் சொல் வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன.
