  yaml_path: translation/ot/psalms/069/010.yaml
  text: When I wept with fasting in my soul[b][a], it became a reproach to me.
translation:
  language: ta
  text: நான் நோன்போடு என் உள்ளத்தில் அழுதபோது[a], அது எனக்கு நிந்தையாக மாறியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘என் ஆத்துமா/என் உயிர்’ என்ற சொல் (‘என் உள்ளத்தில்’ என மொழிபெயர்க்கப்பட்டுள்ளது) வெளிப்படையாக உள்ளது. அது ‘நோன்பு’ என்பதுடனோ, ‘அழுதேன்’ என்பதுடனோ எவ்வாறு தொடர்புபடுகிறது என்பது தெளிவற்றது. ஆகவே இதை ‘நான் நோன்போடு அழுதேன்—என் ஆத்துமா’ என்றும், பொருளுரையாக ‘நோன்பினால் என்னைத் தாழ்த்திக்கொண்டபோது’ என்றும் புரிந்துகொள்ளலாம்; ஆனால் ‘தாழ்த்திக்கொண்டேன்’ என்ற வினை மூலத்தில் வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְכֶּה
  choice: நான் … அழுதபோது
  rationale: בכה என்பதன் அடிப்படைப் பொருள் ‘அழுதல்’. அடுத்த கூற்றில் வரும் விளைவை இயல்பாக இணைக்க, தொடக்க வாவுடன் கூடிய வினை காலப்பொருளில் ‘அழுதபோது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: בַצּוֹם
  choice: நோன்போடு
  rationale: צוֹם என்பது ‘நோன்பு/உண்ணாநோன்பு’. ב முன்னொட்டு இங்கு அழுகையுடன் நோன்பும் சேர்ந்திருந்ததைத் தெரிவிப்பதால், இயல்பான தமிழில் ‘நோன்போடு’ என வழங்கப்பட்டது.
- source_word: נַפְשִׁי
  choice: என் உள்ளத்தில்
  rationale: נֶפֶשׁ என்பது சூழலுக்கேற்ப ‘உயிர், ஆத்துமா, தான், உள்ளம்’ எனப் பொருள்படும். இங்கு சொல்லை விடாமல், துயரத்தின் உள்ளார்ந்த தன்மையைத் தெரிவிக்கும் ‘என் உள்ளத்தில்’ என வழங்கப்பட்டது; எபிரெயச் சொற்றொடரின் இலக்கண உறவு தெளிவற்றிருப்பது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וַתְּהִי
  choice: அது … ஆகியது
  rationale: היה இங்கு முந்தைய செயல் நிந்தைக்கு உரிய ஒன்றாக மாறிய விளைவைச் சுட்டுகிறது. பெண்பால் ஒருமை வினையின் சுட்டுப்பொருள் தமிழில் முந்தைய முழுச் செயலையும் குறிக்கும் ‘அது’ என இயல்பாக வழங்கப்பட்டது.
- source_word: לַחֲרָפוֹת
  choice: நிந்தையாக
  rationale: חֲרָפוֹת வடிவில் பன்மையாக இருந்தாலும், இக்கட்டமைப்பில் பழி, இகழ்ச்சி அல்லது அவமானத்தைத் தெரிவிக்கும் தொகுப்புப்பொருள் கொண்டது. தமிழில் ‘நிந்தையாக’ என்பது அந்தப் பொருளை இயல்பாகக் கொடுக்கிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: לִי பாதிக்கப்படும் நபரைச் சுட்டுவதால் நேரடியாக ‘எனக்கு’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: נַפְשִׁי என்பதன் இலக்கணத் தொடர்பும் பொருளும்
  choice: ‘என் உள்ளத்தில்’ என்று வெளிப்படையாகச் சேர்த்து, உள்ளார்ந்த அழுகையாக வழங்குதல்
  alternative: ‘என் ஆத்துமா’ என்று தனியே வாசித்தல்; அல்லது ‘நோன்பினால் என்னைத் தாழ்த்திக்கொண்டேன்’ என்று பொருளுரைத்தல்
  rationale: மூலத்தில் נַפְשִׁי வெளிப்படையாக இருப்பதால் அதை நீக்கவில்லை. ஆனால் ‘தாழ்த்தினேன்’ என்பதற்கான வினை இவ்வசனத்தின் WLC உரையில் இல்லை; அதைச் சேர்ப்பது இணை வசனத்தின் மொழியை இங்கு கொண்டுவரும். ஆகவே மூலத்தின் பதற்றத்தைத் தீர்மானமாகக் களையாமல், இயல்பான தமிழில் உள்ளார்ந்த பொருளை முதன்மை உரையில் கொடுத்து மாற்று புரிதல்களை அடிக்குறிப்பில் பதிவு செய்தோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘ஆத்துமா’ என்ற சமயப் பதிவுச் சொல்லுக்குப் பதிலாக இச்சூழலில் இயல்பான ‘உள்ளம்’ பயன்படுத்தப்பட்டது; ‘நிந்தை’ சங்கீதத்தின் பழி/இகழ்ச்சி சார்ந்த உயர்நடையைத் தக்கவைக்கிறது.
