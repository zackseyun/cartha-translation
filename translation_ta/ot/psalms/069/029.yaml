  yaml_path: translation/ot/psalms/069/029.yaml
  text: But as for me[a], I am afflicted and in pain; O God[c][b], let your salvation set me on high.
translation:
  language: ta
  text: ஆனால் நானோ துன்புற்று வேதனையில் இருக்கிறேன்; கடவுளே, உமது மீட்பு என்னை உயரத்தில் பாதுகாப்பாக வைக்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளே, உமது மீட்பு என்னை உயரத்தில் பாதுகாப்பாக வைக்கும்.” எபிரெய வினை வேண்டுதலாகவும் எதிர்காலக் கூற்றாகவும் வாசிக்கப்படலாம். “உயரத்தில் பாதுகாப்பாக வை” என்பது எட்ட முடியாத உயரத்தில் வைத்து பாதுகாப்பதைக் குறிக்கும் உருவகம்; “என்னைப் பாதுகாக்கட்டும்” என்றும் பொருள்கொள்ளலாம்.
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: இணைப்புச்சொல்லும் தனிப்பெயரும் முந்தைய சூழலுடன் உள்ள வலியுறுத்தப்பட்ட வேறுபாட்டைக் காட்டுகின்றன; ‘ஆனால் நானோ’ என்பது அதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עָנִי
  choice: துன்பப்பட்டு
  rationale: இச்சூழலில் இது பொருளாதார ஏழ்மையை மட்டும் அல்லாமல் ஒடுக்கப்பட்டு தாழ்த்தப்பட்ட நிலையைக் குறிக்கிறது; அடுத்துவரும் ‘வேதனை’ என்பதுடன் இது பொருந்துகிறது.
- source_word: וְכוֹאֵב
  choice: வேதனையில் இருக்கிறேன்
  rationale: כאב என்ற சொல்லின் பங்கேற்புவினை வடிவம் தொடரும் வலி அல்லது துன்ப நிலையைக் குறிக்கிறது; இத்தமிழாக்கம் அந்த நிகழ்நிலையைத் தெளிவாகக் காக்கிறது.
- source_word: יְשׁוּעָתְךָ
  choice: உமது மீட்பு
  rationale: ישועה என்பது இரட்சிப்பு, விடுதலை, உதவி ஆகிய பரப்பைக் கொண்டது. இவ்விடத்தில் ஆபத்திலிருந்து காக்கும் செயலை ‘மீட்பு’ இயல்பாகத் தெரிவிக்கிறது; அதேவேளையில் சொல்லின் இறையியல் பரப்பையும் அளவுக்கு மீறிக் குறுக்கவில்லை.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது நேரடி அழைப்பாக அமைந்துள்ளது; ‘கடவுளே’ நவீனத் தமிழில் இயல்பான வேண்டுதல் வடிவம்.
- source_word: תְּשַׂגְּבֵנִי
  choice: என்னை உயர்ந்த பாதுகாப்பான இடத்தில் வைப்பதாக
  rationale: שגב என்ற வினை எட்ட முடியாத உயர்ந்த இடத்தில் வைத்து பாதுகாப்பதை உருவகமாகக் குறிக்கிறது. இத்தேர்வு உயரம் மற்றும் பாதுகாப்பு ஆகிய இரு கூறுகளையும் தமிழில் புரியுமாறு காக்கிறது.
theological_decisions:
- issue: תְּשַׂגְּבֵנִי என்ற imperfect வினையின் வலிமை
  choice: 'வேண்டுதல்: ‘வைப்பதாக’'
  alternative: 'எதிர்கால உறுதி: ‘வைக்கும்’'
  rationale: புலம்பலும் வேண்டுதலும் நிறைந்த உடனடிச் சூழலில் இதை வேண்டுதலாகப் புரிவது இயல்பானது. எனினும் எபிரெய வடிவம் எதிர்காலக் கூற்றாகவும் புரியக்கூடும் என்பதால் அந்த உண்மையான இருபொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான வேண்டுதல் நடையைப் பயன்படுத்துகிறது. ‘உமது’ என்பது சங்கீதத்தின் நேரடி இறைமுகப்பை மரியாதையுடன் காக்கிறது; அரிதான சொற்களும் சமயப்பிரிவு சார்ந்த தனிச்சொல்லாட்சியும் தவிர்க்கப்பட்டுள்ளன.
