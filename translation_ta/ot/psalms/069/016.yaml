id: PSA.69.16
reference: Psalms 69:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: עֲנֵ֣/נִי יְ֭הוָה כִּי ט֣וֹב חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ פְּנֵ֣ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/016.yaml
  text: Answer me[a], O Yahweh, for your steadfast love is good; according to your abundant mercies, turn to me.
translation:
  language: ta
  text: யாவே, எனக்குப் பதிலளியும்; ஏனெனில் உமது மாறாத அன்பு நல்லது. உமது மிகுந்த இரக்கங்களுக்கு ஏற்ப என்னிடமாகத் திரும்பும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנֵנִי
  choice: எனக்குப் பதிலளியும்
  rationale: வேண்டுதல் சூழலில் வரும் ענה வினையின் கட்டளை வடிவம், கடவுள் பதிலளிக்க வேண்டும் என்ற மன்றாட்டைக் குறிக்கிறது. நவீனத் தமிழில் இது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: மன்றாட்டிற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இடைச்சொல்லின் வலிமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: טוֹב
  choice: நல்லது
  rationale: חסד குறித்து கூறப்படும் அடிப்படைப் பெயரடைப் பொருளை நேரடியாகத் தருகிறது; அதை வெறுமனே ‘பெரியது’ அல்லது ‘இனியது’ என்று விளக்கவில்லை.
- source_word: חַסְדֶּךָ
  choice: உமது மாறாத அன்பு
  rationale: חסד என்பதில் உள்ள அன்பு, விசுவாசம், நிலைத்த பற்றுறுதி ஆகிய நுண்ணுணர்வுகளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ‘உடன்படிக்கை அன்பு’ என்ற விளக்கத்தை உரைக்குள் திணிக்கவில்லை.
- source_word: כְּרֹב רַחֲמֶיךָ
  choice: உமது மிகுந்த இரக்கங்களுக்கு ஏற்ப
  rationale: כְּ־ குறிக்கும் அளவு அல்லது நெறிக்கு ஏற்ப என்ற உறவையும், רַחֲמִים என்பதன் எபிரெயப் பன்மையையும் பாதுகாக்கிறது.
- source_word: פְּנֵה אֵלָי
  choice: என்னிடமாகத் திரும்பும்
  rationale: פנה உடன் אֶל வரும்போது ஒருவரை நோக்கித் திரும்பும் உறவுசார் இயக்கம் குறிக்கப்படுகிறது. தமிழ் வேண்டுதல் நடையில் இது இயல்பான கட்டளை வடிவம்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பொதுப் பட்டம் அல்லாமல் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே தனிப்பெயரை ஒலிபெயர்த்து, பட்டத்தால் மாற்றாமல் வைத்திருக்கிறது.
- issue: חסד என்பதன் பொருள்
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கை அன்பு
  rationale: சொல்லிலுள்ள நிலையான, பற்றுறுதியுள்ள அன்பை வெளிப்படுத்துகிறது; ஆனால் ஒவ்வொரு பயன்பாட்டிலும் ‘உடன்படிக்கை’ என்பதை வெளிப்படையாகச் சேர்த்து இறையியல் விளக்கத்தை நிர்ணயிப்பதைத் தவிர்க்கிறது.
- issue: רַחֲמֶיךָ என்பதன் எண்ணும் நுண்ணுணர்வும்
  choice: இரக்கங்கள்
  alternative: இரக்கம்
  rationale: மூலத்தின் பன்மையைப் பாதுகாத்து, இறைவனுடைய பலவிதமான இரக்க வெளிப்பாடுகளைச் சுட்டுகிறது; ஒருமைத் தொகுப்புப் பெயராகவும் இதைப் புரிந்துகொள்ள முடியும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத மன்றாட்டிற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘உமது’, ‘பதிலளியும்’, ‘திரும்பும்’ ஆகிய மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இரு கட்டளைகளும் காரண மற்றும் அளவு சார்ந்த தொடர்களும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
