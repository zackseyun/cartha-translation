base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: For zeal for your house has consumed me[b][a], and the reproaches of those who reproach you have fallen on me.
translation:
  language: ta
  text: ஏனெனில், உமது வீட்டின்மேலுள்ள ஆர்வம் என்னை விழுங்கிவிட்டது[a][b]; உம்மை நிந்திப்பவர்களின் நிந்தைகள் என்மேல் விழுந்தன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது வீட்டின்மேலுள்ள ஆர்வம் என்னைத் தின்றுவிட்டது.”
    reason: lexical_alternative
  - marker: b
    text: இவ்வசனம் இயேசுவைக் குறித்து யோவான் 2:17-ல் மேற்கோள் காட்டப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வசனங்களில் சங்கீதக்காரரின் நிலைக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קִנְאַת
  choice: வைராக்கியம்
  rationale: இங்கு பொறாமையைக் குறிக்காமல், தேவனுடைய வீட்டின்மேல் கொண்ட தீவிரமான பற்றையும் அர்ப்பணிப்பையும் குறிக்கிறது.
- source_word: בֵּיתְךָ
  choice: உமது வீடு
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருளான ‘வீடு’ என்பதைக் காத்து, அது தேவாலயத்தைக் குறிப்பதாக இருக்கும் சூழலை அளவுக்கு மீறி வெளிப்படுத்தாமல் விடுகிறது.
- source_word: אֲכָלָתְנִי
  choice: என்னை விழுங்கிவிட்டது
  rationale: ‘என்னைத் தின்றுவிட்டது’ என்ற மூல உருவகத்தின் தீவிரத்தை இயல்பான, கவித்துவமான தமிழில் காக்கிறது.
- source_word: וְחֶרְפּוֹת
  choice: நிந்தைகள்
  rationale: வாய்மொழியான இகழ்ச்சியையும் அவமதிப்பையும் குறிக்கிறது; அடுத்து வரும் அதே வேர்ச்சொல்லோடு உள்ள தொடர்பையும் தமிழில் காக்க உதவுகிறது.
- source_word: חֹרְפֶיךָ
  choice: உம்மை நிந்திப்பவர்கள்
  rationale: தேவனை நிந்திப்பதைத் தங்கள் செயலாகக் கொண்டவர்களைக் குறிக்கும் பங்கேற்புப் பெயரின் பொருளைத் தெளிவாகவும், ‘நிந்தைகள்’ என்பதுடனான சொல் தொடர்பைக் காத்தும் தருகிறது.
- source_word: נָפְלוּ עָלַי
  choice: என்மேல் விழுந்தன
  rationale: தேவனை நோக்கிய நிந்தைகள் சங்கீதக்காரர்மேல் வந்து சேர்ந்தன என்ற எபிரெய உருவகத்தை நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: வசனத்தின் மேசியா சார்ந்ததும் திருமுறை முழுமை சார்ந்ததுமான ஒலிப்பு
  choice: முதன்மை உரையில், சங்கீதத்தின் உடனடிச் சூழலில் சங்கீதக்காரரின் குரலாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: புதிய ஏற்பாட்டின் மேற்கோளின் அடிப்படையில் கிறிஸ்துவை வெளிப்படையாகச் சுட்டும் வகையில் முதன்மை உரையை அமைத்தல்.
  rationale: யோவான் 2:17 இவ்வசனத்தை இயேசுவுடன் தொடர்புபடுத்தினாலும், இங்குள்ள எபிரெய உரை நேரடியாகச் சங்கீதக்காரரின் குரலில் பேசுகிறது. ஆகவே பிற்காலக் கிறிஸ்துவியல் பயன்பாடு அடிக்குறிப்பில் குறிப்பிடப்பட்டு, மூல உரையைத் தாண்டிய விளக்கம் முதன்மை மொழிபெயர்ப்புக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘உம்மை’ என்பவை தொடர்ச்சியாகக் கையாளப்பட்டுள்ளன; ‘வீடு’ என்ற மூல உருவகமும், ‘நிந்தைகள்/நிந்திப்பவர்கள்’ என்ற ஒரே வேர்ச்சொல் தொடர்பும் காக்கப்பட்டுள்ளன.
