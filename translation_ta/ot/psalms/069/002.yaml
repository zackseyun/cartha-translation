    reason: שִׁבֹּלֶת என்பது நீரோட்டம், பெருக்கு, அல்லது காட்டாற்று வெள்ளம் எனப் பொருள்படலாம்; שׁטף இச்சூழலில் மூழ்கடித்தல் அல்லது வெள்ளம்போல் ஆட்கொள்ளுதல் என்ற பொருளைத் தருகிறது.
