  text: ஆழமான சேற்றில் மூழ்கிவிட்டேன்; காலூன்ற இடமில்லை. ஆழமான நீருக்குள் வந்துவிட்டேன்; வெள்ளப்பெருக்கு என்னை மூழ்கடித்துவிட்டது.[a]
  philosophy: optimal-equivalence
