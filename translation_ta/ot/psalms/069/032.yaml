lexical_decisions:
- source_word: רָאוּ
  choice: கண்டு
  rationale: ראה என்பதன் Qal நிறைவுவினை வடிவம். எபிரெய மூலத்தில் நேரடிச் செயப்படுபொருள் இல்லாததால், தமிழிலும் ‘இதைக்’ போன்ற சொல்லைச் சேர்க்காமல் வைத்திருக்கிறது; அடுத்துவரும் மகிழ்ச்சிக்குக் காரணமான கண்டுணர்வைக் குறிக்கிறது.
- source_word: עֲנָוִים
  choice: தாழ்மையானவர்கள்
  rationale: இச்சொல் தாழ்மையுள்ளோர் அல்லது சாந்தகுணமுள்ளோர் என்பதையும், சங்கீதச் சூழலில் துன்புறுத்தப்பட்ட எளியோர் என்பதையும் குறிக்கக்கூடும். ‘தாழ்மையானவர்கள்’ அதன் முதன்மையான நெறி-ஆவிக்குரிய பொருளை இயல்பாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִשְׂמָחוּ
  choice: மகிழ்வார்கள்
  rationale: שמח என்பதன் imperfect வடிவம்; கவிதையில் நிகழ் அல்லது எதிர்கால விளைவை வெளிப்படுத்தலாம். ‘மகிழ்வார்கள்’ கண்டதன் விளைவாக எழும் மகிழ்ச்சியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: דֹּרְשֵׁי אֱלֹהִים
  choice: கடவுளைத் தேடுகிறவர்களே
  rationale: பங்கேற்புவினைச் சொற்றொடரை, தொடர்ந்து வரும் இரண்டாம் நபர் பன்மை உரிமை விகுதியினால் நேரடி அழைப்பாக மொழிபெயர்த்துள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பயன்பாடு.
- source_word: וִיחִי לְבַבְכֶם
  choice: உங்கள் உள்ளங்கள் உயிர்பெறட்டும்
  rationale: ‘வாழட்டும்’ என்ற நேரடி உருவகத்தைப் பாதுகாத்தபடியே, மனவலிமை, உயிர்த்துடிப்பு, நம்பிக்கை புதுப்பிக்கப்படுதல் என்ற பொருளை இயல்பாக உணர்த்த ‘உயிர்பெறட்டும்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் பன்மை உரிமை விகுதியுடன் கூடிய கூட்டொருமை ‘உள்ளம்’ வந்தாலும், பன்மைக் குழுவை நோக்கிய தமிழில் ‘உள்ளங்கள்’ இயல்பானது.
