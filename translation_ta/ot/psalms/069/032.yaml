    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “உங்கள் உள்ளம் வாழட்டும்.” இது புதுப்பிக்கப்பட்ட மனவலிமை, உயிர்த்துடிப்பு அல்லது நம்பிக்கையைக் குறிக்கும் சொல்லாட்சி.
