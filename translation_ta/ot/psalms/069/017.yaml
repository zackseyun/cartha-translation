base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/017.yaml
  text: And do not hide your face from your servant[a], for I am in distress[b]; answer me quickly.
translation:
  language: ta
  text: உமது முகத்தை[a] உமது ஊழியனிடமிருந்து[b] மறைக்காதேயும்; ஏனெனில் நான் நெருக்கடியில் இருக்கிறேன்; விரைந்து எனக்குப் பதிலளியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது பிரசன்னத்தை.’ எபிரெயத்தில் சொல்லுக்கு சொல் ‘உமது முகத்தை’; இது அருளையும் கவனமுள்ள அண்மையையும் குறிக்கும் பொதுவான சொற்றொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமது அடிமையிடமிருந்து.’ எபிரெயச் சொல் சூழலுக்கேற்ப ஊழியனையோ அடிமையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַל
  choice: மறைத்துக்கொள்ளாதேயும்
  rationale: וְ தொடர்ச்சியான விண்ணப்பத்தை இணைக்கிறது; אַל உடன் வரும் வினை தடை அல்லது வேண்டுகோள் பொருளில் ‘செய்யாதேயும்’ என மரியாதையுள்ள விண்ணப்பமாக வழங்கப்பட்டுள்ளது. தமிழில் தனியே ‘மேலும்’ சேர்க்காமல் வாக்கியத் தொடர்ச்சி இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: תַּסְתֵּר
  choice: மறைத்துக்கொள்ளாதேயும்
  rationale: סתר என்பதன் அடிப்படைப் பொருளான ‘மறைத்தல்’ காக்கப்படுகிறது; முகத்தை மறைத்தல் என்ற எபிரெய உருவகமும் தக்கவைக்கப்படுகிறது.
- source_word: פָּנֶיךָ
  choice: உமது முகத்தை
  rationale: ‘முகம்’ என்ற நேரடிப் படிமம் பிரதான உரையில் காக்கப்படுகிறது; இது இறைவனின் அருள், கவனம், அண்மை ஆகியவற்றைக் குறிக்கும் வழக்குச் சொற்றொடராக இருந்தாலும், அதை விளக்கவுரையாக மாற்றவில்லை.
- source_word: מֵעַבְדֶּךָ
  choice: உமது ஊழியனிடமிருந்து
  rationale: עבד என்பது ‘ஊழியன்’ அல்லது ‘அடிமை’ எனப் பொருள்படலாம். இங்கு இறைவனை நோக்கிய தாழ்மையான விண்ணப்பச் சூழலில் ‘ஊழியன்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்திய வேண்டுகோளுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்தும் காரண இணைப்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: צַר לִי
  choice: நான் நெருக்கடியில் இருக்கிறேன்
  rationale: எபிரெயத்தின் சுருக்கமான ‘எனக்கு நெருக்கடி’ என்ற நிலையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; துன்பத்தின் தன்மையைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: מַהֵר
  choice: விரைந்து
  rationale: ‘விரைவுபடுத்து/விரைந்து செய்’ என்ற அவசரத்தை அடுத்த வேண்டுகோளுடன் இயல்பாக இணைக்கிறது.
- source_word: עֲנֵנִי
  choice: எனக்கு … பதிலளியும்
  rationale: ஜெபச் சூழலில் ענה என்பதற்குரிய நேரடியான ‘பதிலளி’ என்ற பொருள் மரியாதைமிக்க வேண்டுகோள் வடிவில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: இறைவனைப் பற்றிய மனித உருவக மொழி
  choice: பிரதான உரையில் ‘உமது முகத்தை’ என்று வைத்தல்
  alternative: உமது பிரசன்னத்தை / உமது சந்நிதியை
  rationale: இறைவனின் ‘முகம்’ என்பது அவரது அருள், கவனம், உறவுசார் அண்மை ஆகியவற்றை உணர்த்தும் எபிரெயப் படிமம். அதை அருவமான விளக்கமாக மாற்றாமல் கவித்துவ மற்றும் இறையியல் அழுத்தம் பாதுகாக்கப்படுகிறது.
- issue: இறைவனுடன் உள்ள உறவில் עבד என்பதன் மொழிபெயர்ப்பு
  choice: ஊழியன்
  alternative: அடிமை
  rationale: சொல் அடிமை நிலையையும் குறிக்கக்கூடும்; ஆனால் இந்த ஜெபத்தில் சட்டரீதியான பிணைப்பு நிலையைவிடத் தாழ்மையான சார்பும் சேவையும் முன்னிலையில் உள்ளன. ஆகவே ‘ஊழியன்’ பிரதான உரையில் தேர்ந்தெடுக்கப்பட்டு, ‘அடிமை’ மாற்றாகக் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத ஜெபத்திற்கேற்ற கண்ணியமான நடையும் இறைவனை நோக்கிய மரியாதை ஒருமை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. ‘முகம்’ என்ற மூல உருவகம் காக்கப்பட்டு, பொருள் விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களோடு நேரடியாக இணைக்கப்பட்டுள்ளன.
