  text: יִ֭רְוְיֻ/ן מִ/דֶּ֣שֶׁן בֵּיתֶ֑/ךָ וְ/נַ֖חַל עֲדָנֶ֣י/ךָ תַשְׁקֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/008.yaml
  text: They are filled from the richness of your house[b][a], and you give them drink from the river of your delights.
translation:
  language: ta
  text: உமது வீட்டின் செழுமையால் அவர்கள் நிறைவடைகிறார்கள்[a]; உமது இன்பங்களின் ஆற்றிலிருந்து[b] அவர்களுக்குக் குடிக்கத் தருகிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது வீட்டின் வளத்திலிருந்து அவர்கள் தாகம் தீரக் குடிக்கிறார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: “உமது இன்பங்கள்” என்பதை “உமது மகிழ்ச்சிகள்” என்றும் மொழிபெயர்க்கலாம்; இங்குள்ள எபிரெயச் சொல் ஏதேனை எதிரொலிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיוּן
  choice: அவர்கள் நிறைவடைகிறார்கள்
  rationale: רוה என்பதன் Qal வடிவம் தாகம் தீருமளவு குடித்து நிறைவடைவதை அல்லது மிகுதியாகத் திருப்தியடைவதைச் சுட்டுகிறது. தமிழ் முதன்மை உரையில் விளைவுநிலையும் நிறைவின் கருத்தும் இயல்பாகத் தக்கவைக்கப்படுகின்றன; குடிப்பதைக் குறிப்பாக வெளிப்படுத்தும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִדֶּשֶׁן
  choice: செழுமையால்
  rationale: דֶּשֶׁן என்பதன் அடிப்படைப் படிமம் ‘கொழுமை’; உருவகமாக அது வளம், செழிப்பு, மிகுதி ஆகியவற்றைக் குறிக்கிறது. ‘செழுமை’ நவீன தமிழில் கவித்துவத்தையும் இயல்பான பொருளையும் காக்கிறது.
- source_word: בֵּיתֶךָ
  choice: உமது வீட்டின்
  rationale: எபிரெயச் சொல் நேரடியாக ‘உமது வீடு’ என்பதாகும். ‘ஆலயம்’ அல்லது ‘வாசஸ்தலம்’ என்று குறிப்பாக்காமல், மூலத்தின் விரிந்த கவித்துவப் படிமம் காக்கப்படுகிறது.
- source_word: וְנַחַל
  choice: ஆற்றிலிருந்து
  rationale: נַחַל என்பது ஓடை, நீரோடை அல்லது ஆறு எனப் பொருள்படலாம். தெய்வீக மிகுதியின் இந்தக் கவித்துவச் சூழலில் ‘ஆறு’ உயிரளிக்கும் நிறைவான ஓட்டத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲדָנֶיךָ
  choice: உமது இன்பங்களின்
  rationale: עֵדֶן சார்ந்த இச்சொல் இன்பம், மகிழ்ச்சி, வளமான சுகம் ஆகியவற்றைக் குறிக்கிறது. ‘இன்பங்கள்’ என்ற பன்மை வடிவம் மூலத்தின் பன்மையையும் ஏதேனுடன் இருக்கக்கூடிய சொல் ஒலிப்பையும் மிகைப்படுத்தாமல் காக்கிறது.
- source_word: תַשְׁקֵם
  choice: அவர்களுக்குக் குடிக்கக் கொடுக்கிறீர்
  rationale: שקה என்பதன் Hiphil வடிவம் ‘அவர்களைக் குடிக்கச் செய்கிறீர்’ அல்லது ‘அவர்களுக்குக் குடிக்கக் கொடுக்கிறீர்’ என்று பொருள்படும். தேர்ந்தெடுத்த வடிவம் தேவனின் செயற்பாட்டைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேவனுடைய ‘வீடு’ என்ற படிமம்
  choice: ‘உமது வீடு’ என்ற பொதுவான படிமத்தைத் தக்கவைத்தல்
  alternative: ‘உமது ஆலயம்’, ‘உமது குடும்பம்’ அல்லது ‘உமது வாசஸ்தலம்’ என்று குறிப்பாக்குதல்
  rationale: எபிரெய உரை தேவனுடைய அருகாமையையும் அவரிடமிருந்து வரும் வளமான பராமரிப்பையும் கவித்துவமாகச் சித்தரிக்கிறது; அது ஆலயத்தையோ பரலோக வாசஸ்தலத்தையோ மட்டும் கட்டாயப்படுத்தவில்லை. ஆகவே இறையியல் சாத்தியங்களைச் சுருக்காமல் மூலப் படிமம் காக்கப்படுகிறது.
- issue: עֲדָנֶיךָ என்பதில் ஏதேன் குறித்த சாத்தியமான எதிரொலி
  choice: முதன்மை உரையில் ‘உமது இன்பங்கள்’ என்று மொழிபெயர்த்து, ஏதேன் எதிரொலியை அடிக்குறிப்பில் குறிப்பிடுதல்
  alternative: ‘உமது ஏதேன் போன்ற இன்பங்கள்’ என்று முதன்மை உரையிலேயே வெளிப்படுத்துதல்
  rationale: சொல் ‘இன்பங்கள்’ அல்லது ‘மகிழ்ச்சிகள்’ என்று நேரடியாகப் பொருள்படும்; ஏதேன் குறித்த சொல் ஒலி சாத்தியமானது, ஆனால் அது வெளிப்படையான அடையாளப்படுத்தல் அல்ல. எனவே அந்த நுட்பம் தீர்மானமாக்கப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க ‘உமது/கொடுக்கிறீர்’ இறைமுகப்புப் பாங்கு பயன்படுத்தப்பட்டுள்ளது. கவித்துவமான செழுமை, வீடு, ஆறு ஆகிய படிமங்கள் எளிய வாசகருக்கும் புரியும் வகையில் காக்கப்பட்டுள்ளன.
