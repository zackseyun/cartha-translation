  text: Let not the foot of pride come against me[b][a], and let not the hand of the wicked drive me away.
translation:
  language: ta
  text: ஆணவத்தின் கால் எனக்கு எதிராக வராதிருக்கட்டும்[a]; தீயோரின் கை என்னை விரட்டியடிக்காதிருக்கட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்மேல் வராதிருக்கட்டும்.” எபிரேயத்தில் சொல்லுக்குச் சொல், “ஆணவத்தின் கால் என்னிடம் வராதிருக்கட்டும்” என உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னை அலையச்செய்யாதிருக்கட்டும்” அல்லது “என்னை ஓடச்செய்யாதிருக்கட்டும்.” இவ்வினைச்சொல் ஒருவரைத் தம் இடத்திலிருந்து அகலச் செய்யும் பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבוֹאֵנִי
  choice: எனக்கு எதிராக வராதிருப்பதாக
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்’. ‘பெருமையின் கால்’ என்ற பகைமைச் சூழலில், வெறும் அணுகுதலைவிட எதிர்த்து வருவதைக் காட்டும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது; ‘என்மேல் வருதல்’ என்ற வாய்ப்பும் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: רֶגֶל גַּאֲוָה
  choice: பெருமையின் கால்
  rationale: எபிரெய உருவகத்தைப் பாதுகாக்கும் நேரடியான மொழிபெயர்ப்பு. ‘பெருமையுள்ளவர்களின் கால்’ என்று நபர்களைக் குறிப்பது மூலத்தின் கருத்துமயமான சொல்லாட்சியை விளக்கமாக மாற்றிவிடும்.
- source_word: יַד רְשָׁעִים
  choice: கொடியவர்களின் கை
  rationale: רְשָׁעִים என்பது தீயவர்களைக் குறிக்கும் பன்மை பெயர்ச்சொல் பயன்பாடு; ‘கை’ அவர்களுடைய வல்லமை அல்லது செயற்பாட்டை உணர்த்தும் மூல உருவகமாகவே வைக்கப்பட்டது.
- source_word: תְּנִדֵנִי
  choice: என்னைத் துரத்திவிடாதிருப்பதாக
  rationale: Hiphil வடிவம் ஒருவரைத் தம் இடத்திலிருந்து அகலச் செய்தல், அலையச் செய்தல் அல்லது ஓடச் செய்தல் என்ற பொருள் தரலாம். இணைவரியில் வரும் பகைமைச் ‘கை’ உருவகத்துடன் இயல்பாக அமைய ‘துரத்திவிடுதல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אַל
  choice: வராதிருப்பதாக / துரத்திவிடாதிருப்பதாக
  rationale: אַל உடன் வரும் வேண்டுதல் வடிவம் ஜெபத்திலான எதிர்மறை விண்ணப்பத்தைக் காட்டுகிறது. நவீனத் தமிழில் கண்ணியமான கவிதைநடையைப் பேண ‘-ஆதிருப்பதாக’ பயன்படுத்தப்பட்டது.
