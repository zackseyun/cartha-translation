  text: נְאֻֽם פֶּ֣שַׁע לָ֭/רָשָׁע בְּ/קֶ֣רֶב לִבִּ֑/י אֵֽין פַּ֥חַד אֱ֝לֹהִ֗ים לְ/נֶ֣גֶד עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/001.yaml
  text: 'Transgression speaks to the wicked within my heart: there is no fear of God before his eyes[a][b].'
translation:
  language: ta
  text: 'என் இதயத்தில்[a], மீறுதல் தீயவனிடம் உரைக்கிறது: அவன் கண்களுக்கு முன்பாகக் கடவுளுக்குப் பயம் இல்லை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: ‘என் இதயத்தில்.’ சில பழங்கால மொழிபெயர்ப்புகளும் நவீன மொழிபெயர்ப்புகளும் இதை ‘அவன் இதயத்தில்’ என்று சீராக்குகின்றன; வேறு சில, ‘தீயவனைப் பற்றிய செய்தி என் இதயத்தில் உள்ளது’ என்று பொருளுரைக்கின்றன.'
    reason: alternative_reading
  - marker: b
    text: ‘கடவுளுக்குப் பயம்’ என்பது கடவுளுக்கு உரிய பயபக்தியையும் அச்சமுள்ள மதிப்பையும் குறிக்கலாம்.
    reason: lexical_clarification
lexical_decisions:
- source_word: נְאֻם
  choice: உரைக்கிறது
  rationale: இந்தப் பெயர்ச்சொல் பொதுவாக ஆணித்தரமான ‘உரை’ அல்லது ‘அறிவிப்பு’ என்பதைக் குறிக்கிறது. தமிழில் வாக்கியத்தை இயல்பாக அமைக்க வினை வடிவம் பயன்படுத்தப்பட்டுள்ளது; அதேவேளையில் உள்ளார்ந்த, அதிகாரமிக்க கூற்றின் தன்மை காக்கப்படுகிறது.
- source_word: פֶּשַׁע
  choice: மீறுதல்
  rationale: வேண்டுமென்றே வரம்பை மீறும் செயல் அல்லது கலகத்தன்மையுள்ள குற்றத்தைக் குறிக்கிறது. ‘மீறுதல்’ அதன் அறநெறிச் சுமையைத் தக்கவைத்து, சட்டவியல் பொருளாக மட்டும் குறுக்கிவிடாமல் இருக்கிறது.
- source_word: לָרָשָׁע
  choice: தீயவனிடம்
  rationale: לְ முன்னொட்டு உரையின் பெறுநரைக் குறிக்கிறது; ஒருமை வடிவத்தின் பிரதிநிதித்தன்மையை ‘தீயவன்’ காக்கிறது.
- source_word: בְּקֶרֶב לִבִּי
  choice: என் இதயத்தில்
  rationale: மசோரா உரையில் தெளிவாக முதலாம் நபர் ஒருமை பின்னொட்டு, ‘என்’, உள்ளது. கடினமான இந்த வாசகம் திருத்தப்படாமல், தமிழில் சுருக்கமாகவும் இயல்பாகவும் தரப்பட்டுள்ளது.
- source_word: אֵין פַּחַד אֱלֹהִים
  choice: கடவுளைப் பற்றிய பயம் இல்லை
  rationale: இது கடவுளுக்கு உரிய பயபக்தியையும் அச்சமுள்ள மதிப்பையும் குறிக்கக்கூடிய வழக்குச் சொற்றொடர். வெறும் திகில் என்ற பொருளுக்கு இதைக் குறுக்காமல் ‘பயம்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְנֶגֶד עֵינָיו
  choice: அவன் கண்களுக்கு முன்பாக
  rationale: ஒருவன் தன் பார்வையிலும் எண்ணத்திலும் எதை வைத்திருக்கிறான் என்பதைக் குறிக்கும் எபிரெய உருவகம் தமிழிலும் தக்கவைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: לִבִּי (‘என் இதயம்’) என்பதில் உள்ள சுட்டுப்பெயரும் பார்வைக் கோணமும்
  choice: மசோரா உரையின் முதலாம் நபர் வாசகமான ‘என் இதயத்தில்’ என்பதே தக்கவைக்கப்பட்டது; அடுத்த கூற்றில் தீயவனே ‘அவன்’ என்பதன் குறிப்பு.
  alternative: ‘அவன் இதயத்தில்’ என்று உரையைச் சீராக்குதல், அல்லது ‘தீயவனைப் பற்றி என் இதயத்தில் ஒரு செய்தி உள்ளது’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: எபிரெய மெய்யெழுத்து மற்றும் உயிர்க்குறியிடப்பட்ட உரை இரண்டுமே ‘என் இதயம்’ என்பதை ஆதரிக்கின்றன. பொருள் அமைப்பில் பதற்றம் இருந்தாலும், உரையைத் திருத்தி அதை மறைப்பதற்குப் பதிலாக மூலத்தின் உண்மையான கடினத்தன்மை பாதுகாக்கப்பட்டுள்ளது.
- issue: פֶּשַׁע என்பதன் ஆளுருவாக்கம்
  choice: ‘மீறுதல் … உரைக்கிறது’ என ஆளுருவாக்கம் தக்கவைக்கப்பட்டது.
  alternative: ‘தீயவனின் மீறுதல் எனக்குள் உணர்த்துகிறது’ என்று விளக்கிப் பொருளுரைத்தல்.
  rationale: மூலத்தில் மீறுதலே உரையின் பேசுபவனாக முன்வைக்கப்படுகிறது. இதைத் தக்கவைப்பது தீய நடத்தை உள்ளிருந்து அதிகாரமிக்க குரல்போல் பேசும் உருவகத்தையும் அதன் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கடினமான எபிரெயச் சொற்றொடரின் பார்வைக் கோணம் மறைக்கப்படவில்லை; இயல்பான தமிழ் சொல் வரிசைக்காக ‘என் இதயத்தில்’ முன்வைக்கப்பட்டுள்ளது.
