  text: אָ֤וֶן יַחְשֹׁ֗ב עַֽל מִשְׁכָּ֫ב֥/וֹ יִ֭תְיַצֵּב עַל דֶּ֣רֶךְ לֹא ט֑וֹב רָ֝֗ע לֹ֣א יִמְאָֽס׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/004.yaml
  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
translation:
  language: ta
  text: அவன் தன் படுக்கையில் தீமையைத் திட்டமிடுகிறான்[a]; நல்லதல்லாத வழியில் தன்னை நிலைநிறுத்திக்கொள்கிறான்; தீமையை அவன் வெறுத்தொதுக்குவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் தன் படுக்கையில் அக்கிரமத்தைத் திட்டமிடுகிறான்; நல்லதல்லாத வழியில் தன்னை நிலைநிறுத்திக்கொள்கிறான்; தீமையை வெறுப்பதில்லை.”
    reason: אָוֶן என்பதற்கு ‘அக்கிரமம்’, חשב என்பதற்கு ‘திட்டமிடுதல்’, מאס என்பதற்கு ‘வெறுத்தல்’ என்ற சொற்பொருள் மாற்றுகளைச் சுட்டுகிறது.
lexical_decisions:
- source_word: אָוֶן
  choice: தீமை
  rationale: இச்சூழலில் இச்சொல் துன்பத்தை அல்ல, திட்டமிடப்படும் ஒழுக்கக்கேட்டை முதன்மையாகக் குறிக்கிறது. இயல்பான நவீனத் தமிழில் ‘தீமை’ இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: יַחְשֹׁב
  choice: திட்டமிடுகிறான்
  rationale: חשב என்பது சிந்தித்தல் அல்லது திட்டமிடுதல் எனப் பொருள்படும்; אָוֶן என்ற செயப்படுபொருளும் படுக்கை என்ற சூழலும் வெறும் எண்ணத்தைவிட நோக்கமுள்ள திட்டமிடுதலைக் காட்டுகின்றன.
- source_word: עַל מִשְׁכָּבוֹ
  choice: தன் படுக்கையிலேயே
  rationale: இடத்தைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பாகப் பிரதிபலிக்கிறது; ‘-ஏ’ இரவின் தனிமையிலும் அவன் திட்டமிடுவதைச் சற்றே வலியுறுத்துகிறது.
- source_word: יִתְיַצֵּב
  choice: தன்னை நிலைநிறுத்திக்கொள்கிறான்
  rationale: התפעל வடிவின் தன்வினைத் தன்மையையும், ஒரு வழியில் வேண்டுமென்றே உறுதியாக நிற்கும் கருத்தையும் காக்கிறது.
- source_word: עַל דֶּרֶךְ לֹא טוֹב
  choice: நல்லதல்லாத வழியில்
  rationale: ‘வழி’ என்ற நடத்தை உருவகத்தையும் ‘நல்லதல்லாத’ என்ற மூலத்தின் மறுப்பு வடிவத்தையும் சுருக்காமல் பாதுகாக்கிறது.
- source_word: רָע
  choice: தீமை
  rationale: இங்கு ஒழுக்கரீதியான தீமை குறிக்கப்படுகிறது; தமிழில் நேரடியான, இயல்பான இணைச்சொல் இதுவே.
- source_word: לֹא יִמְאָס
  choice: வெறுத்தொதுக்குவதில்லை
  rationale: מאס என்பதில் நிராகரித்தல் மட்டுமல்ல, வெறுத்து விலக்குதல் என்ற வலுவான உணர்வும் இருக்க முடியும். ‘வெறுத்தொதுக்குதல்’ அந்த இரு கூறுகளையும் தமிழில் சுருக்கமாகக் கொண்டுவருகிறது.
