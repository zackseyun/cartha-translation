  text: לַ/מְנַצֵּ֬חַ לְ/עֶֽבֶד יְהוָ֬ה לְ/דָוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/000.yaml
  text: For the choirmaster[a]. Of David[d][c][b], the servant of Yahweh.
translation:
  language: ta
  text: இசைத்தலைவருக்கு[a]. யாவேயின் ஊழியனான தாவீதுக்கு உரியது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இசை இயக்குநருக்கு.” எபிரெயச் சொல் வழிபாட்டு இசைக்குப் பொறுப்பான தலைவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “யாவேயின் ஊழியனான தாவீதுக்கு.” எபிரெய முன்னொட்டு இந்தச் சங்கீதம் தாவீதோடு தொடர்புடையது என்பதைக் காட்டுகிறது; அது ஆசிரியத்துவம், அர்ப்பணிப்பு, அல்லது வேறு தொடர்பு என்பதில் ஒன்றை மட்டும் தீர்மானிப்பதில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத்தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை அல்லது வழிபாட்டை நடத்தும் பொறுப்பாளரைக் குறிக்கிறது. ‘இசைத்தலைவர்’ என்பது சுருக்கமாகவும் இயல்பாகவும் அந்தப் பணியை வெளிப்படுத்துகிறது.
- source_word: לְעֶבֶד
  choice: ஊழியனாகிய
  rationale: இங்கு עֶבֶד அடிமைநிலையை வலியுறுத்தாமல், யெகோவாவுக்குச் சேவை செய்பவரைக் குறிக்கும் மதிப்புக்குரிய பட்டமாக வருகிறது; ஆகவே ‘ஊழியன்’ பொருத்தமானது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் தனிப்பெயரான நான்கெழுத்துத் திருப்பெயர் நேரடியாக உள்ளது. நவீனத் தமிழில் பரவலாக அறியப்படும் அதன் பெயர்வடிவமாக ‘யெகோவா’ பயன்படுத்தப்படுகிறது; ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றப்படவில்லை.
- source_word: לְדָוִד
  choice: தாவீதுக்கு உரியது
  rationale: சங்கீதத் தலைப்பிலுள்ள לְדָוִד ஆசிரியத்துவம், தொடர்பு, அர்ப்பணிப்பு ஆகியவற்றில் ஒன்றை மட்டும் உறுதியாகத் தீர்மானிப்பதில்லை. ‘தாவீதுக்கு உரியது’ அதன் பரந்த attribution பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் பொதுப் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயர் உள்ளது. தமிழில் நிலைபெற்ற ‘யெகோவா’ வடிவம் பயன்படுத்தப்பட்டாலும், எபிரெய உச்சரிப்பை ‘யாவே’ என்று தருவதும் சாத்தியம்.
- issue: עֶבֶד என்பதன் சூழல்சார் பொருள்
  choice: ஊழியன்
  alternative: அடிமை
  rationale: இந்தத் தலைப்பில் அது தாவீதின் யெகோவாவுடனான சேவை உறவைக் குறிக்கும் மரியாதைப் பட்டம்; கட்டுண்ட அடிமைநிலையே முன்னிலைப்படுத்தப்படவில்லை.
- issue: לְדָוִד குறிக்கும் தொடர்பு
  choice: தாவீதுக்கு உரியது
  alternative: தாவீது இயற்றியது
  rationale: எபிரெய முன்னொட்டு தொடர்பு அல்லது உரிமையைப் பரந்த வகையில் குறிக்க முடியும்; ஆசிரியத்துவத்தை மட்டும் கட்டாயப்படுத்தாத மொழி தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத் தலைப்புக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை. எபிரெய முன்சொற்களின் தொடர்பு இயன்றவரை காக்கப்பட்டு, தமிழில் இயல்பான சொற்றொடர் அமைப்பு பயன்படுத்தப்பட்டது.
