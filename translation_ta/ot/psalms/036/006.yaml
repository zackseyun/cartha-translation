source:
  edition: WLC
  text: צִדְקָֽתְ/ךָ֨ כְּֽ/הַרְרֵי אֵ֗ל מִ֭שְׁפָּטֶ/ךָ תְּה֣וֹם רַבָּ֑ה אָ֤דָֽם וּ/בְהֵמָ֖ה תוֹשִׁ֣יעַ יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
translation:
  language: ta
  text: உமது நீதி தேவனுடைய மலைகளைப் போன்றது[a]; உமது நியாயத்தீர்ப்புகள் பெரும் ஆழம். யாவே, மனிதனையும் விலங்கையும் நீர் காப்பாற்றுகிறீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘தேவனுடைய மலைகள்’; இது ‘வலிமைமிக்க மலைகள்’ அல்லது ‘மிக உயர்ந்த மலைகள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மனுக்குலத்தையும் விலங்குகளையும் நீர் காப்பாற்றுகிறீர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: உமது நீதி
  rationale: צְדָקָה என்பதன் நேர்மை, நீதியான தன்மை ஆகிய பரந்த பொருளைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: כְּהַרְרֵי־אֵל
  choice: தேவனுடைய மலைகளைப் போன்றது
  rationale: אֵל என்பதை மிகுதியைக் குறிக்கும் சொல்லாக மட்டும் மாற்றாமல், எபிரெயச் சொற்றொடரின் நேரடியான கவித்துவ வடிவத்தையும் அதன் உண்மையான பொருள் இருமையையும் பாதுகாக்கிறது.
- source_word: מִשְׁפָּטֶךָ
  choice: உமது நியாயத்தீர்ப்புகள்
  rationale: தேவனுடைய நீதியான தீர்ப்புகள் அல்லது நீதிச் செயல்கள் என்ற பன்மை உணர்வைக் காட்டி, צְדָקָה என்பதற்குப் பயன்படுத்திய ‘நீதி’ என்பதிலிருந்து சொற்பொருள் வேறுபாட்டைப் பேணுகிறது.
- source_word: תְּהוֹם רַבָּה
  choice: பெரும் ஆழ்கடல்
  rationale: அளவிட முடியாத ஆழத்தையும் ஆழமான நீர்ப்பரப்பின் கவித்துவப் படிமத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: விலங்குடன் இணைத்துக் கூறப்படும் பொதுமையான ஒருமை வடிவத்தைப் பாதுகாத்து, மனித இனத்தைப் பிரதிநிதித்துவமாகக் குறிக்கிறது.
- source_word: וּבְהֵמָה
  choice: விலங்கு
  rationale: இச்சூழலில் உயிரினங்களைப் பொதுவாகக் குறிக்கும் சொல்லாக இருந்து, אָדָם என்பதுடன் காணப்படும் ஒருமை இணைப்பையும் தக்கவைக்கிறது.
- source_word: תוֹשִׁיעַ
  choice: நீர் காப்பாற்றுகிறீர்
  rationale: ישׁע என்பதன் காப்பாற்றுதல், விடுவித்தல், பாதுகாத்தல் ஆகிய பொருள் எல்லையை இச்சூழலில் அதிகமாகக் குறுக்காமல் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் பதிலிடாமல் ஒலிபெயர்க்கிறது.
- issue: אָדָם என்பதன் பொதுமையான பொருள்
  choice: மனிதன்
  alternative: மனுக்குலம் / மனிதர்கள்
  rationale: எபிரெயத்தில் விலங்குடன் இணையாக வரும் பொதுமை ஒருமையை முதன்மை உரையில் பேணுகிறது; அது ஆண்களை மட்டும் குறிப்பதல்ல என்பதை அடிக்குறிப்பு தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், கவித்துவமும் மரியாதையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது/நீர்’ என்ற வடிவங்கள் சங்கீதத்தின் உயர்ந்த நேரடி அழைப்பைத் தக்கவைக்கின்றன; ‘பெரும் ஆழ்கடல்’ மூலத்தின் ஆழநீர்ப் படிமத்தை இயல்பாக வெளிப்படுத்துகிறது.
