revisions:
- from: உம்மை அறிந்தவர்களுக்கு உமது மாறாத அன்பையும், நேர்மையான உள்ளத்தாருக்கு உமது நீதியையும்[b] தொடர்ந்து காட்டும்[a].
  to: உம்மை அறிந்தவர்களுக்கு உமது மாறாத அன்பையும், உள்ளத்தில் நேர்மையானவர்களுக்கு உமது நீதியையும் தொடர்ந்து நீட்டும்.[a][b]
  rationale: The revision replaces ‘காட்டும்’ with ‘தொடர்ந்து நீட்டும்’ to represent the Hebrew imperative’s central sense of extending or continuing. It retains the Hebrew parallelism, respectful address, and the broad rendering ‘நீதி’ for צְדָקָה. Footnote a is corrected to a grammatical and meaningful alternative.
