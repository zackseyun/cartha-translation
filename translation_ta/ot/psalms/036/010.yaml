  yaml_path: translation/ot/psalms/036/010.yaml
  text: Continue your steadfast love to those who know you[b][a], and your righteousness to the upright in heart.
translation:
  language: ta
  text: உம்மை அறிந்தவர்களுக்கு உமது மாறாத அன்பையும், உள்ளத்தில் நேர்மையானவர்களுக்கு உமது நீதியையும் தொடர்ந்து நீட்டும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது மாறாத அன்பையும் உமது நீதியையும் நீட்டும்’; சொல்லுக்குச் சொல், ‘உமது மாறாத அன்பை இழுத்து நீட்டும்.’
    reason: lexical_alternative
  - marker: b
    text: ‘நீதி’ என்பதற்குப் பதிலாக ‘நியாயம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֹׁךְ
  choice: தொடர்ந்து காட்டும்
  rationale: இந்தக் கட்டளைச்சொல் அடிப்படையில் ‘இழு/நீட்டு’ என்று பொருள்படும். ஆனால் ‘மாறாத அன்பு’ என்னும் கருத்துப்பொருளோடு வரும் இந்த வேண்டுதலில், அந்த அன்பைத் தொடர்ந்து வெளிப்படுத்துமாறு கேட்பதே இயல்பான தமிழில் பொருளைத் தெளிவாகக் கொண்டுவருகிறது. ‘நீட்டியும்’ என்பது சாத்தியமான நெருக்கமான மாற்று.
- source_word: חַסְדְּךָ
  choice: உமது மாறாத அன்பு
  rationale: חֶסֶד என்பது வெறும் பாசத்தை மட்டுமல்லாமல் உறுதியான, உண்மையுள்ள உறவுசார் அன்பையும் குறிக்கிறது. ‘மாறாத அன்பு’ அதன் நிலைத்த தன்மையை எளிய நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְיֹדְעֶיךָ
  choice: உம்மை அறிந்தவர்களுக்கு
  rationale: எபிரெயப் பங்கேற்பு வடிவம் ‘உம்மை அறிகிறவர்கள்’ என்பதைக் குறிக்கிறது; இங்கு ‘அறிதல்’ உறவுசார் பொருளையும் தக்கவைக்கிறது.
- source_word: וְצִדְקָתְךָ
  choice: உமது நீதி
  rationale: צְדָקָה என்பது நீதிநிலை, நேர்மை, நியாயம் ஆகிய பொருட்களைக் கொண்டிருக்கலாம். இங்கு ‘நீதி’ என்பது சொல்லின் பரந்த அறநெறி மற்றும் உறவுசார் விசுவாசப் பொருளைத் தக்கவைக்கிறது; அதை நீதிமன்றத் தீர்ப்பாக மட்டும் குறுக்குவதில்லை.
- source_word: לְיִשְׁרֵי לֵב
  choice: நேர்மையான உள்ளத்தாருக்கு
  rationale: ‘உள்ளத்தில் நேரானவர்கள்’ என்ற எபிரெய மரபுத்தொடர் உள்ளார்ந்த ஒழுக்க நேர்மையைக் குறிக்கிறது. ‘நேர்மையான உள்ளத்தார்’ இயல்பான, சுருக்கமான தமிழ் வடிவம்.
theological_decisions:
- issue: இறைவனுடைய உடன்படிக்கைசார் பண்புகளை இணையாக மொழிபெயர்த்தல்
  choice: חֶסֶד என்பதை ‘மாறாத அன்பு’ என்றும் צְדָקָה என்பதை ‘நீதி’ என்றும் இணையாக வழங்குதல்
  alternative: חֶסֶד என்பதை ‘இரக்கம்’ என்றும் צְדָקָה என்பதை ‘நியாயம்’ என்றும் மொழிபெயர்த்தல்
  rationale: இந்த வசனம் இறைவனுடைய நிலையான அன்பும் நீதியுள்ள செயல்பாடும் தொடர வேண்டுமென்ற விண்ணப்பம். தேர்ந்த சொற்கள் பிற்கால கோட்பாட்டுக் கருத்துகளைச் சேர்க்காமல் எபிரெயக் கவிதையின் இணை அமைப்பையும் உறவுசார் அழுத்தத்தையும் காக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை நோக்கிய மரியாதை வடிவங்களான ‘உம்மை’, ‘உமது’ பயன்படுத்தப்பட்டுள்ளன. கவிதையின் ஒரே கட்டளை வினை இரு இணையான கூறுகளையும் ஆளும் அமைப்பு தமிழிலும் காக்கப்பட்டுள்ளது.
