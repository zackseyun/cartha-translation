    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּקָר
  choice: எவ்வளவு அருமையானது
  rationale: מַה இங்கு கேள்வியைக் குறிக்காமல் வியப்பை வெளிப்படுத்துகிறது; יָקָר உயர்ந்த மதிப்பையும் அன்புக்குரிய தன்மையையும் குறிக்கிறது. இந்தத் தமிழ் தொடர் இரண்டையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: חַסְדְּךָ
  choice: உமது மாறாத அன்பு
  rationale: חֶסֶד அன்பு, இரக்கம், உறுதியான விசுவாசம், உடன்படிக்கைச் சார்ந்த பற்றுறுதி ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘மாறாத அன்பு’ அதன் நிலைத்த உறவுத் தன்மையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது; மற்ற நிழற்பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது நேரடி அழைப்பாக வருவதால் தமிழ் விளிவேற்றுமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּבְנֵי אָדָם
  choice: மனிதர்கள்
  rationale: இந்த எபிரெயச் சொற்றொடர் பொதுவாக மனிதகுலத்தைக் கூட்டாகக் குறிக்கிறது. சொற்சொல் வடிவத்தைத் திணிப்பதைவிட ‘மனிதர்கள்’ நவீனத் தமிழில் இயல்பாகவும் உள்ளடக்கமாகவும் உள்ளது; மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּצֵל כְּנָפֶיךָ
  choice: உமது சிறகுகளின் நிழலில்
  rationale: பாதுகாப்பளிக்கும் பறவைச் சிறகுகளின் கவித்துவ உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: יֶחֱסָיוּן
  choice: அடைக்கலம் புகுகிறார்கள்
  rationale: חסה பாதுகாப்பை நாடி அடைக்கலம் புகுவதைக் குறிக்கிறது. இந்த நிகழ்காலத் தமிழ் வடிவம் பொதுவான அல்லது தொடர்ச்சியான செயலை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חֶסֶד என்பதன் பரந்த இறையியல் மற்றும் உறவுசார் பொருள்
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கைப் பற்றுறுதி / இரக்கம் / உண்மையுள்ள அன்பு
  rationale: ஒரே குறுகிய சொல்லால் மூலச்சொல்லின் எல்லா நிழற்பொருள்களையும் தெரிவிக்க முடியாது. ‘மாறாத அன்பு’ அதன் நிலைத்த அன்பை முன்னிலைப்படுத்துகிறது; உடன்படிக்கைப் பற்றுறுதி அல்லது இரக்கம் மட்டுமே பொருள் என்று உரையைச் சுருக்கவில்லை.
- issue: בְנֵי אָדָם என்ற ஆண்பால் வடிவமுள்ள கூட்டுச் சொற்றொடர்
  choice: மனிதர்கள்
  alternative: ஆதாமின் பிள்ளைகள் / மனிதரின் பிள்ளைகள்
  rationale: சூழலில் இச்சொற்றொடர் ஆண்களை மட்டும் அல்ல, மனிதர்களை பொதுவாகக் குறிக்கிறது. இயல்பான தமிழ் கூட்டுப்பெயர் அந்தப் பரப்பைத் தெளிவாக்குகிறது; எபிரெய உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘உமது’ என்ற மரியாதை வடிவம் இறைவனை நேரடியாக அழைக்கும் தொனிக்கு ஏற்றது. சிறகுகளின் நிழல் என்ற மூல உருவகம் விளக்கமாக மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
