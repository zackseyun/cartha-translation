    text: “மாறாத அன்பு” என்பது எபிரெய மொழியின் ‘கெசெத்’ (חֶסֶד) என்ற சொல்லை மொழிபெயர்க்கிறது; இதில் இரக்கம், உண்மையுள்ள அன்பு, உடன்படிக்கைப் பற்றுறுதி ஆகிய பொருள் நிழல்களும் அடங்கலாம்.
