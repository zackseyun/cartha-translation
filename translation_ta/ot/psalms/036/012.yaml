- source_word: נָפְלוּ
  choice: விழுந்தார்கள்
  rationale: נפל என்பதன் நிறைவுற்ற செயலை நேரடியாகவும் இயல்பான தமிழிலும் தெரிவிக்கிறது.
- source_word: פֹּעֲלֵי אָוֶן
  choice: தீமை செய்பவர்கள்
  rationale: ‘தீமையைச் செய்கிறவர்கள்’ என்ற எபிரெயக் கூட்டுச்சொல்லின் செயற்பாட்டு உருவகத்தையும் அதன் அறநெறி வலிமையையும் காக்கிறது.
- source_word: אָוֶן
  choice: தீமை
  rationale: இச்சூழலில் குற்றம், கேடு, துன்மார்க்கம் ஆகிய பொருள் வாய்ப்புகளில் அறநெறி சார்ந்த ‘தீமை’ முதன்மையானது.
- source_word: דֹּחוּ
  choice: தள்ளிவீழ்த்தப்பட்டு
  rationale: வலுக்கட்டாயமாகக் கீழே தள்ளப்பட்டு முறியடிக்கப்படுதல் என்ற பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא יָכְלוּ קוּם
  choice: எழ முடியாமல் போனார்கள்
  rationale: வீழ்த்தப்பட்ட பின் எழுந்துநிற்க இயலாத இறுதியான நிலையை இயல்பான நவீனத் தமிழில் தருகிறது.
