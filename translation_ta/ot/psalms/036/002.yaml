  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
translation:
  language: ta
  text: ஏனெனில், அவன் தன் அக்கிரமத்தைக் கண்டுணர்ந்து அதை வெறுக்க முடியாதபடி, தன் பார்வையில் தன்னைத் தானே புகழ்ந்துகொள்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல் நெருக்கமாக: “ஏனெனில், அவன் தன் பார்வையில் தனக்கே மென்மையாக்குகிறான்—தன் அக்கிரமத்தைக் கண்டுபிடிக்க, வெறுக்க.” எபிரெய வாசகம் கடினமானது; தன்னைத் தானே புகழ்ந்துகொள்வது, தன் அக்கிரமத்தை உணர்ந்து அதை நிராகரிப்பதைத் தடுக்கிறது என்பதே இங்கு கூறப்படும் பொருளாகத் தெரிகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; சங்கீதத்தின் வாத ஓட்டத்துக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: הֶחֱלִיק אֵלָיו
  choice: தன்னையே முகஸ்துதி செய்துகொள்கிறான்
  rationale: חלק என்பதன் அடிப்படைப் பொருள் ‘மென்மையாக்குதல்’; இங்கு தனக்குத்தானே இனிமையான, ஏமாற்றும் மதிப்பீட்டை வழங்குதல் என்ற சொல்லாட்சிப் பொருள் வருகிறது. தமிழ் நடையில் தன்னையே ஏமாற்றும் புகழ்ச்சியை இது தெளிவாகக் காட்டுகிறது.
- source_word: בְּעֵינָיו
  choice: தன் பார்வையில்
  rationale: ஒருவரின் சொந்த மதிப்பீடு அல்லது கணிப்பு என்பதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לִמְצֹא
  choice: கண்டுணர்ந்து
  rationale: ‘கண்டுபிடித்தல்’ என்ற நேரடிப் பொருளோடு, இங்கு சொந்த அக்கிரமத்தை உணர்ந்து அறிதல் என்ற நெறிசார் நுணுக்கத்தையும் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲוֺנוֹ
  choice: தன் அக்கிரமத்தை
  rationale: עָוֹן குறிக்கும் ஒழுக்கக் கேட்டையும் குற்றத்தன்மையையும் ‘அக்கிரமம்’ தக்கவைக்கிறது; பொதுவான ‘பாவம்’ என்பதைவிட மூலச்சொல்லின் கனத்தை நெருக்கமாக வெளிப்படுத்துகிறது.
- source_word: לִשְׂנֹא
  choice: அதை வெறுக்க
  rationale: வெறுப்பதற்கான பொருள் முந்தைய ‘அக்கிரமம்’ என்பதே என்பதை ‘அதை’ தெளிவாக்குகிறது; மூலத்தின் இறுதிநிலை வினையெச்சத் தொடர்பையும் தக்கவைக்கிறது.
- source_word: לִמְצֹא עֲוֺנוֹ לִשְׂנֹא
  choice: தன் அக்கிரமத்தைக் கண்டுணர்ந்து அதை வெறுக்க முடியாதபடி
  rationale: சுருக்கமானதும் கடினமானதுமான எபிரெய தொடரை, சுயமுகஸ்துதி பாவத்தை அறிந்து நிராகரிப்பதைத் தடுக்கிறது என்ற சூழல்சார் பொருளில் வாசிக்கிறது. ‘முடியாதபடி’ என்பது தடுக்கும் விளைவைத் தெளிவாக்கினாலும், மாற்று நேரடி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: வசனத்தின் ஒழுக்க-உளவியல் பொருள்
  choice: தீயவன் தன்னையே முகஸ்துதி செய்துகொள்வதால் தன் அக்கிரமத்தை உணர்ந்து வெறுக்க முடியாமல் போகிறான்.
  alternative: அவன் தன் அக்கிரமத்தைக் கண்டுபிடித்து வெறுப்பதற்காகத் தன் பார்வையில் தனக்காகக் காரியங்களை மென்மையாக்குகிறான்; அல்லது அவனுடைய அக்கிரமம் வெறுக்கத்தக்கதாகக் கண்டறியப்படும் வரை அவன் தன்னை முகஸ்துதி செய்கிறான்.
  rationale: எபிரெய இலக்கணத் தொடர்பு தெளிவற்றது. சங்கீதம் 36-ன் உடனடி சூழல் தீயவனின் உள்ளார்ந்த வஞ்சனையையும் பாவத்தை நிராகரிக்காத நிலையையும் வலியுறுத்துவதால் தடுப்பு அர்த்தம் முதன்மை உரையில் ஏற்கப்படுகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் விடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘முகஸ்துதி செய்துகொள்கிறான்’ என்பது சுயவஞ்சகப் புகழ்ச்சியை இயல்பாகச் சொல்கிறது; ‘அக்கிரமம்’ மூலச்சொல்லின் ஒழுக்கக் கனத்தைப் பாதுகாக்கிறது. கடினமான எபிரெய தொடரின் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
