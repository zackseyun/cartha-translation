review_pass:
  verdict: approve
  source_fidelity: 'The Tamil accurately represents the Hebrew: כִּי is retained as a causal connective (''ஏனெனில்''); עִמְּךָ is naturally conveyed by ''உம்மிடமே'' in the sense that the fountain is with/in God''s possession or presence; מְקוֹר חַיִּים is preserved as the concrete poetic image ''வாழ்வின் ஊற்று''; and בְּאוֹרְךָ נִרְאֶה אוֹר retains both the prepositional ambiguity of ''உமது ஒளியில்'' and the deliberate repetition of ''ஒளி.'' No theological paraphrase has been introduced.'
  naturalness: The wording is fluent modern standard Tamil with an appropriately dignified psalmic register. 'உம்மிடமே வாழ்வின் ஊற்று இருக்கிறது' is idiomatic and gives suitable poetic emphasis. The second colon is balanced and natural.
  terminology: ‘வாழ்வின் ஊற்று’ preserves the spring/fountain imagery without reducing it to an abstract cause. ‘ஒளி’ consistently renders both occurrences of אוֹר. Respectful second-person forms (‘உமது,’ ‘உம்மிடமே’) are appropriate for direct address to God. The alternatives in both notes are accurate and their anchors are correctly placed.
