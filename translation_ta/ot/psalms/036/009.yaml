  text: כִּֽי עִ֭מְּ/ךָ מְק֣וֹר חַיִּ֑ים בְּ֝/אוֹרְ/ךָ֗ נִרְאֶה אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/009.yaml
  text: For with you is the fountain of life[b][a]; in your light we see light.
translation:
  language: ta
  text: ஏனெனில், உம்மிடமே வாழ்வின் ஊற்று இருக்கிறது[a]; உமது ஒளியில் நாங்கள் ஒளியைக் காண்கிறோம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வாழ்வின் நீரூற்று’ அல்லது ‘வாழ்வின் மூலம்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமது ஒளியால் நாங்கள் ஒளியைக் காண்கிறோம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: עִמְּךָ
  choice: உம்மிடமே
  rationale: ‘உம்முடன்/உம்மிடம்’ என்ற அடிப்படை உறவையும், வாழ்வின் ஊற்று கடவுளிடமே உள்ளது என்ற மூலத்தன்மையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘-ஏ’ கவிதை வலியுறுத்தலைத் தருகிறது.
- source_word: מְקוֹר
  choice: ஊற்று
  rationale: நீரூற்று அல்லது ஊற்றுக்கண் என்ற உயிரோட்டமுள்ள கவிதைப் படிமத்தைக் காக்கிறது; ‘ஆதாரம்’ என்பதைவிட konkreதமான படிமம்.
- source_word: חַיִּים
  choice: வாழ்வு
  rationale: எபிரெயத்தில் வடிவியல் பன்மையாக இருந்தாலும் இங்கு ‘வாழ்வு’ என்னும் கருத்துப்பெயராக இயங்குகிறது.
- source_word: בְּאוֹרְךָ
  choice: உமது ஒளியில்
  rationale: בְ என்பதன் இடவியல்/சூழல் சார்ந்த நுணுக்கத்தையும் கவிதைப் படிமத்தையும் காக்கிறது; கருவிப்பொருளாக மட்டும் குறுக்கவில்லை.
- source_word: נִרְאֶה
  choice: நாங்கள் காண்கிறோம்
  rationale: கவிதைச் சூழலில் பொதுவான நிகழ்கால உண்மையைச் சொல்லும் வினையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: எபிரெய மூலத்தில் வரும் ‘ஒளி’ என்ற சொல்லின் மறுபயன்பாட்டையும் கவிதைச் சொல்லாட்டத்தையும் அப்படியே காக்கிறது.
theological_decisions:
- issue: தெய்வீக வாழ்வும் ஒளியும் குறித்த உருவகங்களின் பொருள்
  choice: ‘வாழ்வின் ஊற்று’, ‘உமது ஒளியில் ... ஒளியைக் காண்கிறோம்’ என்ற உருவகங்களை விளக்கவுரை இன்றிக் காத்தல்
  alternative: ‘எல்லா வாழ்வுக்கும் நீரே ஆதாரம்’ அல்லது ‘உமது சத்தியத்தால் நாங்கள் புரிந்துகொள்கிறோம்’ எனப் பொருள்விரித்தல்
  rationale: கடவுளை வாழ்வின் மூலமாகவும் ஒளியூட்டுபவராகவும் சித்தரிக்கும் செறிவான கவிதை மற்றும் இறையியல் பதற்றத்தை ஒரு குறுகிய விளக்கமாகத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. கடவுளை நோக்கிய மரியாதைப் பாங்கிற்கு ‘உமது/உம்மிடம்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் ஒளி-ஒளி மறுபயன்பாடு பாதுகாக்கப்பட்டுள்ளது.
