lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரை ஒலிபெயர்த்து, நேரடி அழைப்பாக இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּהַשָּׁמַיִם
  choice: வானங்களில் உள்ளது
  rationale: בְּ என்பதன் முதன்மையான இடப்பொருளையும், שָׁמַיִם என்பதன் பன்மை வடிவத்தையும் காக்கிறது; தமிழில் முழுமையான வாக்கியத்திற்காக ‘உள்ளது’ சேர்க்கப்பட்டுள்ளது.
- source_word: חַסְדֶּךָ
  choice: உமது மாறாத அன்பு
  rationale: חֶסֶד குறிக்கும் நிலையான, நம்பிக்கைக்குரிய அன்பை நவீன வாசகர்களுக்குத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֱמוּנָתְךָ
  choice: உமது உண்மைத்தன்மை
  rationale: இணைவரியில் வரும் אֱמוּנָה என்பதன் நம்பத்தகுந்த தன்மை, விசுவாசத்தன்மை ஆகிய பொருள்களை ‘உண்மைத்தன்மை’ வெளிப்படுத்துகிறது.
- source_word: עַד
  choice: வரை எட்டுகிறது
  rationale: எல்லை அல்லது பரப்பைக் குறிக்கும் עַד என்பதைத் தமிழ்க் கவிதைநடையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שְׁחָקִים
  choice: மேகங்கள்
  rationale: உயர்ந்த வானத்தைச் சுட்டும் சொல்லின் தெளிவான கவித்துவப் படிமத்தைப் பாதுகாக்கிறது.
