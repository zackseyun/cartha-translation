  text: The words of his mouth are wickedness and deceit; he has ceased to act wisely[a], to do good.
translation:
  language: ta
  text: அவன் வாயின் சொற்கள் தீமையும் வஞ்சகமுமாகும்; விவேகமாக நடப்பதையும்[a] நன்மை செய்வதையும் அவன் கைவிட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்மை செய்வதில் ஞானமுள்ளவனாய் இருப்பதை அவன் கைவிட்டான்.” எபிரெய மொழியிலுள்ள இரண்டு முடிவிலா வினை வடிவங்களையும் “கைவிட்டான்” என்பதுடன் இணையும் இரண்டு இணையான வினைத் தொடர்களாகவும் புரிந்துகொள்ளலாம்.
