  rationale: לְהַשְׂכִּיל மற்றும் לְהֵיטִיב இரண்டும் חָדַל என்பதுடன் இணையும் இணையான நிறைவுப்பொருள்களாகப் புரிந்துகொள்ளப்படலாம்; மாற்று தொடரியல் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
