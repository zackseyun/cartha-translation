lexical_decisions:
- source_word: דִּבְרֵי פִיו
  choice: அவனுடைய வாயின் சொற்கள்
  rationale: எபிரெய மொழியின் பன்மையையும் ‘வாய்’ என்ற உருவகத்தையும் நேரடியாகப் பாதுகாக்கும் இயல்பான தமிழ் நடை.
- source_word: אָוֶן
  choice: தீமை
  rationale: வஞ்சகத்துடன் இணைந்து பேச்சின் ஒழுக்கக்கேட்டைச் சுட்டுவதால், சூழலுக்கு ஏற்ற தெளிவான நவீனத் தமிழ்ச் சொல்.
- source_word: וּמִרְמָה
  choice: வஞ்சகம்
  rationale: מִרְמָה என்பதன் ஏமாற்றுதல் அல்லது கபடம் சார்ந்த பொருளை பேச்சுச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חָדַל
  choice: விட்டுவிட்டான்
  rationale: ஒரு செயலைத் தொடராமல் கைவிட்டுவிட்டான் என்ற நிறைவுற்ற வினையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: לְהַשְׂכִּיל
  choice: ஞானமாகச் செயல்படுவதையும்
  rationale: Hiphil வடிவம் இங்கு வெறும் அறிவைவிட நடைமுறை விவேகத்துடன் செயல்படுவதைக் குறிக்கிறது.
- source_word: לְהֵיטִיב
  choice: நன்மை செய்வதையும்
  rationale: நல்லதைச் செய்தல் என்ற ஒழுக்கச் செயலைத் தெளிவாகப் பாதுகாக்கிறது.
