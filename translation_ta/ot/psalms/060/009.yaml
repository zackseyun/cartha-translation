  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a]
translation:
  language: ta
  text: அரணமைந்த நகரத்துக்கு என்னைக் கொண்டுபோவது யார்? ஏதோம் வரை என்னை வழிநடத்துவது யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரணமைந்த நகரத்துக்கு என்னை வழிநடத்துவது யார்? ஏதோம் வரை என்னை வழிநடத்தியவர் யார்?” எபிரேய வினைச்சொற்கள் காலம் அல்லது செயல்வகை சார்ந்த சற்றே வேறுபட்ட நுட்பங்களை அனுமதிக்கின்றன; முதன்மை உரை இரு கேள்விகளையும் எதிர்நோக்கும் கேள்விகளாக அமைத்து, கவிதை இணைவடிவத்தைத் தக்கவைக்கிறது.
