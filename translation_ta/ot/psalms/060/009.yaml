lexical_decisions:
- source_word: מִי
  choice: யார்
  rationale: வினாவுச் சுட்டுப்பெயரான இதை, சொல்லாட்சியின் வினாவியல் வலிமையை இயல்பாகத் தக்கவைக்கும் ‘யார்’ என மொழிபெயர்த்தோம்.
- source_word: יֹבִלֵנִי
  choice: என்னைக் கொண்டுபோவது
  rationale: יבל என்பதன் ஹிஃபில் வடிவம் ஒருவரை ஓர் இலக்குக்குக் கொண்டுபோதல் அல்லது வழிநடத்தலைக் குறிக்கிறது; தொடர்ந்து வரும் இடப்பெயர்ச்சித் தொடருடன் ‘கொண்டுபோவது’ இயல்பாகப் பொருந்துகிறது.
- source_word: עִיר מָצוֹר
  choice: அரண்சூழ்ந்த நகரம்
  rationale: பாதுகாப்பு அரண்களால் வலுப்படுத்தப்பட்ட நகரத்தைக் குறிக்கும் இக்கட்டுத்தொடரை, முற்றுகையிடப்பட்ட நகரம் என்ற தவறான பொருள் வராமல் நவீனத் தமிழில் தெளிவாக வழங்குகிறது.
- source_word: נָחַנִי
  choice: என்னை வழிநடத்துவது
  rationale: נחה என்பது வழிநடத்துதல் அல்லது வழிகாட்டுதலைக் குறிக்கிறது. வடிவம் இறந்தகால நுட்பத்தையும் அனுமதித்தாலும், முதல் கேள்வியுடன் அமைந்த கவிதை இணைவடிவம் எதிர்நோக்கும் கேள்வியாக இயல்பாக வாசிக்கப்படுகிறது.
- source_word: עַד אֱדוֹם
  choice: ஏதோம் வரை
  rationale: עַד எல்லை அல்லது சென்றடையும் முனையைச் சுட்டுவதால், ‘ஏதோம் வரை’ என்பது அதன் நுட்பத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: எபிரேய இடப்பெயரைத் தமிழில் வழக்கமான ஒலிபெயர்ப்பு வடிவில் வழங்குகிறது.
