lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  choice: அதிரச் செய்தீர்
  rationale: ரָעַשׁ என்பதன் ஹிஃபீல் வடிவம் பூமியை அதிரச் செய்வதைக் குறிக்கிறது; தமிழில் காரணவினைத் தன்மையை இயல்பாகக் காக்கிறது.
- source_word: אֶרֶץ
  choice: பூமி
  rationale: இந்தச் சொல் முழுப் பூமியையோ ஒரு குறிப்பிட்ட நாட்டையோ குறிக்கலாம். நிலநடுக்கக் கவிப்படிமத்திற்கு ‘பூமி’ பொருந்துகிறது; ‘நாடு’ என்ற நுட்பமும் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: פְּצַמְתָּהּ
  choice: அதைப் பிளந்தீர்
  rationale: உடைத்தல் அல்லது பிளவுபடுத்தல் என்ற பொருளைத் தெளிவாக வெளிப்படுத்தி, அடுத்துவரும் ‘பிளவுகள்’ என்ற படிமத்துடன் இணைகிறது.
- source_word: רְפָה
  choice: குணமாக்கும்
  rationale: רָפָא என்பதன் கட்டளை வடிவம் அடிப்படையில் ‘குணமாக்கு’ என்பதாகும். பூமியை உயிருள்ளதுபோல் சித்தரிக்கும் கவித்துவ உருவகத்தை இது காக்கிறது.
- source_word: שְׁבָרֶיהָ
  choice: அதன் பிளவுகள்
  rationale: உடைவு, வெடிப்பு அல்லது பிளவு என்று பொருள்படும் சொல்; நிலம் அதிர்ந்து பிளந்த காட்சியில் ‘பிளவுகள்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: כִי
  choice: ஏனெனில்
  rationale: வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; நவீன செந்தமிழ் உரையில் தெளிவாக உள்ளது.
- source_word: מָטָה
  choice: அது தள்ளாடுகிறது
  rationale: சாய்தல், நிலைகுலைதல், தள்ளாடுதல் ஆகிய தொடரும் நிலையின்மையைக் குறிக்கிறது; முற்றிலும் சரிந்துவிட்டது என்ற பொருளைத் தவிர்க்கிறது.
