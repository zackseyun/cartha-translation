  text: לַ֭/מְנַצֵּחַ עַל שׁוּשַׁ֣ן עֵד֑וּת מִכְתָּ֖ם לְ/דָוִ֣ד לְ/לַמֵּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/000.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.”[a] A miktam[b] of David[c], for teaching when he fought against Aram-naharaim and Aram-zobah, and Joab returned and struck down twelve thousand of Edom in the Valley of Salt.'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: “சாட்சியின் லில்லி” என்பதன்படி.[a] தாவீதின்[c] மிக்தாம்[b]; கற்பிப்பதற்காக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சாட்சியின் லில்லி” என்ற மெட்டின்படி என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் இசை அல்லது வழிபாடு சார்ந்த தலைப்பாக இருக்கலாம்; ஆனால் அதன் துல்லியமான பொருள் உறுதியற்றது.
    reason: lexical_alternative
  - marker: b
    text: “மிக்தாம்” என்பது பொருள் உறுதியாகத் தெரியாத ஓர் எபிரெயப் பாடல்வகைப் பெயர். சிலர் இதை இசை அல்லது இலக்கியம் சார்ந்த குறிப்பு என்று கருதுகின்றனர்.
    reason: lexical_alternative
  - marker: c
    text: “தாவீதின்” என்பது “தாவீதால் இயற்றப்பட்டது,” “தாவீதுக்குரியது,” அல்லது “தாவீதுக்காக” என்றும் பொருள்படலாம்; எபிரெயக் கட்டமைப்பு ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பைக் குறிக்கக்கூடும்.
    reason: alternative_reading
