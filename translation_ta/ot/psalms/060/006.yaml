  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶ֫עְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
translation:
  language: ta
  text: 'கடவுள் தமது பரிசுத்தத்தில்[a] பேசியிருக்கிறார்: “நான் களிகூருவேன்[b]; சீகேமைப் பங்கிடுவேன்; சுக்கோத்தின் பள்ளத்தாக்கை அளப்பேன்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தமது பரிசுத்த இடத்தில்” அல்லது “தமது பரிசுத்தத்தினால்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் கடவுளின் பரிசுத்தத்தையோ, அவரது பரிசுத்த முன்னிலை இருக்கும் இடத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “நான் களிகூருவேன்” என்பது கடவுளுடைய உரையின் ஒரு பகுதி அல்லாமல், அவரது உரைக்குச் சங்கீதக்காரர் அளிக்கும் பதில் என்று சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: ஒருமை வினைச்சொல்லுடன் வருவதால் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான ஒருமை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: דִּבֶּר
  choice: பேசியிருக்கிறார்
  rationale: முடிவுற்ற தெய்வீக உரையையும் அதன் தற்போதைய பொருத்தத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּקָדְשׁוֹ
  choice: தமது பரிசுத்தத்தில்
  rationale: எபிரெயச் சொற்றொடரின் சுருக்கத்தையும், கடவுளின் பரிசுத்த இயல்பு அல்லது அவரது பரிசுத்த பிரசன்னத்தின் தளம் என்ற இரு சாத்தியங்களையும் தேவையின்றி குறுக்காமல் காக்கிறது.
- source_word: אֶעְלֹזָה
  choice: நான் களிகூருவேன்
  rationale: வெற்றிப் பெருமகிழ்ச்சியை dignified, இயல்பான தமிழில் தெரிவிக்கிறது; cohortative நுணுக்கத்தை எதிர்காலத் தன்மை கொண்ட முதல் நபர் வடிவம் ஏற்றுக்கொள்கிறது.
- source_word: אֲחַלְּקָה
  choice: பங்கிடுவேன்
  rationale: நிலப்பகுதியைப் பிரித்து ஒதுக்கும் சூழல்சார் பொருளைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: שְׁכֶם
  choice: சீகேம்
  rationale: இடப்பெயர் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: சுக்கோத்தின் பள்ளத்தாக்கை
  rationale: இடப்பெயரையும் அதனுடன் இணைந்த புவியியல் பகுதியையும் தெளிவாகக் காட்டுகிறது.
- source_word: אֲמַדֵּד
  choice: அளந்திடுவேன்
  rationale: நிலத்தை அளந்து உரிமைப் பகுதியாக வரையறுக்கும் உருவகத்தைத் தக்கவைக்கிறது; ‘பங்கிடுவேன்’ என்று மீண்டும் கூறி பொருளை முழுமையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது.
theological_decisions:
- issue: பேசுபவர் மாறும் இடமும் மேற்கோளின் எல்லையும்
  choice: ‘நான் களிகூருவேன்’ என்பதிலிருந்து கடவுளின் நேரடி உரையாக வழங்கப்பட்டது.
  alternative: ‘நான் களிகூருவேன்’ என்பது கடவுளின் உரைக்கு சங்கீதக்காரர் அளிக்கும் பதிலாக இருக்கலாம்.
  rationale: சீகேமைப் பங்கிடுவதும் சுக்கோத்தின் பள்ளத்தாக்கை அளப்பதும் தொடர்ச்சியான முதல் நபர் தெய்வீக உரையாக இயல்பாக அமைகின்றன. இருப்பினும், வாக்கிய எல்லை எபிரெயத்தில் வெளிப்படையாகக் குறிக்கப்படாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு வாசிப்பிற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘தமது’ என்பது கடவுளைக் குறிக்கும் மரியாதைத் தற்சுட்டாகவும், ‘களிகூருவேன்’ என்பது கவிதைநயமுள்ள ஆனால் புரிந்துகொள்ளத்தக்க சொல்லாகவும் பயன்படுத்தப்பட்டது. இடப்பெயர்கள் சீகேம், சுக்கோத் எனத் தமிழ் ஒலிமுறைக்கு ஏற்ப வழங்கப்பட்டன.
