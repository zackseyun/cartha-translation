  text: Give us help against the adversary[c][b][a], for the salvation of man is vain.
translation:
  language: ta
  text: பகைவனுக்கு எதிராக எங்களுக்கு உதவி தாரும்[a]; மனிதரால் வரும் மீட்பு[b][c] வீண்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நெருக்கடியிலிருந்து எங்களுக்கு உதவி தாரும்”; எபிரேய צַר என்பது “நெருக்கடி” அல்லது “பகைவன்” என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “மீட்பு” என்பதற்கு “விடுதலை” அல்லது “வெற்றி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “மனிதரால்” என்பதற்கான எபிரேயச் சொல் אָדָם; இங்கு அது பொதுவாக மனிதகுலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: தாரும்
  rationale: வேண்டுதல் நிறைந்த கட்டளை வடிவத்தை, இறைவனை நோக்கிய மன்றாட்டுக்கு ஏற்ற இயல்பான மற்றும் மரியாதையான தமிழில் தருகிறது.
- source_word: לָּנוּ
  choice: எங்களுக்கு
  rationale: முதலாம் நபர் பன்மை மறைமுகச் செயப்படுபொருளை நேரடியாகக் காட்டுகிறது.
- source_word: עֶזְרַת
  choice: உதவி
  rationale: ‘உதவி/துணை’ என்ற பொருளை இயல்பாகவும் ஜெப மொழிநடைக்கு ஏற்றவாறும் தருகிறது.
- source_word: מִצָּר
  choice: பகைவனுக்கு எதிராக
  rationale: צַר என்பதன் ‘பகைவன்’ என்ற பொருள் சங்கீதத்தின் போர்ச் சூழலுக்கு நன்கு பொருந்துகிறது; מִן முன்னொட்டு தமிழில் ‘எதிராக உதவி’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது. ‘நெருக்கடியிலிருந்து’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וְשָׁוְא
  choice: வீண்
  rationale: שָׁוְא குறிக்கும் பயனின்மை அல்லது வெறுமையைச் சுருக்கமான கவிதைநடையில் வெளிப்படுத்துகிறது. எபிரேய இணைப்புச்சொல் தமிழின் இயல்புக்காக அரைப்புள்ளியால் பிரதிபலிக்கப்படுகிறது.
- source_word: תְּשׁוּעַת
  choice: விடுதலை
  rationale: இப்போர்ச் சூழலில் மீட்பு, தப்புவித்தல் அல்லது வெற்றி என்ற பொருள் கொண்ட சொல்லுக்கு ‘விடுதலை’ தெளிவாகப் பொருந்துகிறது; ‘மீட்பு’ மற்றும் ‘வெற்றி’ சாத்தியங்களும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: אָדָם
  choice: மனிதரின்
  rationale: ஒரு குறிப்பிட்ட ஆணை அல்லாமல், கடவுளுக்கு மாறாக மனிதகுலத்தைப் பொதுவாகக் குறிக்கும் சொல்லாக இங்கு அமைகிறது. ‘மனிதரின்’ என்பது மூலத்தின் சுருக்கமான உடைமைத் தொடர்பையும் அதன் ஓரளவு தெளிவின்மையையும் காக்கிறது.
theological_decisions:
- issue: இறை உதவிக்கும் மனித விடுதலைக்கும் இடையிலான மாறுபாடு
  choice: கடவுளிடம் உதவி கோருவதற்கு மாறாக மனிதரின் விடுதலை பயனற்றது என்று வசனத்தின் உடனடிச் சூழலுக்குள் மொழிபெயர்க்கப்பட்டது.
  alternative: மனித முயற்சி அனைத்தும் எப்போதும் வீண் என்ற விரிவான பொதுக் கோட்பாடாக எடுத்துக்கொள்ளுதல்.
  rationale: எபிரேய உரை இறைவனின் உதவியை வேண்டுவதையும் மனித விடுதலையின் பயனின்மையையும் எதிரெதிராக வைக்கிறது; வசனம் கூறாத விரிவான கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்குரிய மரியாதையுடனும் சங்கீதத்தின் சுருக்கமான கவிதை வலிமையுடனும் வடிவமைக்கப்பட்டது. ‘தாரும்’ உயர்ந்த ஆனால் பொதுவாகப் புரியக்கூடிய மன்றாட்டு நடையைத் தருகிறது; ‘மனிதரின் விடுதலை’ என்ற அமைப்பு மூல எபிரேயத்தின் சுருக்கத்தையும் இறை உதவி–மனித உதவி மாறுபாட்டையும் காக்கிறது.
