  rationale: The revision is limited to clarifying the Tamil expression for the final Hebrew construct. It preserves the verse's contrast between requested divine aid and the futility of human-supplied rescue, without extending it into a general claim about all human effort. Footnote wording and anchors have been updated to match the revised text.
