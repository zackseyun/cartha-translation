    text: சொல்லர்த்தமாக, “தள்ளாட்டத்தின் திராட்சரசம்”; அல்லது “தடுமாறச் செய்யும் திராட்சரசம்,” “நிலைகுலையச் செய்யும் திராட்சரசம்.”
