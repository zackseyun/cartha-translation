- from: உமது மக்களுக்குக் கடுமையானவற்றை அனுபவிக்கச் செய்தீர்; தள்ளாடச் செய்யும் திராட்சரசத்தை எங்களுக்குக் குடிக்கக் கொடுத்தீர்.[a]
  to: உமது மக்களுக்குக் கடுமையான அனுபவங்களைக் கொடுத்தீர்; தள்ளாட வைக்கும் திராட்சரசத்தை[a] எங்களுக்குக் குடிக்கக் கொடுத்தீர்.
