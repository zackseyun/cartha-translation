lexical_decisions:
- source_word: הִרְאִיתָה
  choice: அனுபவிக்கச் செய்தீர்
  rationale: ראה என்பதன் ஹிஃபில் வடிவம் அடிப்படையில் ‘காணச் செய்தல்/காட்டுதல்’ என்று பொருள்படும். இச்சூழலில் கடுமையானவற்றை மக்கள் நேரடியாக அனுபவிக்கும்படி செய்தார் என்பதே இயல்பான தமிழ் வெளிப்பாடு.
- source_word: עַמְּךָ
  choice: உமது மக்கள்
  rationale: உடன்படிக்கைச் சூழலில் עַם என்பது தேவனுக்குரிய மக்களைக் குறிக்கிறது; ‘உமது மக்கள்’ இதை இயல்பாகவும் தெளிவாகவும் தருகிறது.
- source_word: קָשָׁה
  choice: கடுமையானவற்றை
  rationale: இங்கு பெயர்ச்சொல்லாகப் பயன்படும் இவ்வடைமொழி கடினமான அல்லது கொடிய அனுபவங்களைக் குறிக்கிறது. ‘கடுமையானவற்றை’ என்பது எபிரெயச் சொல்லின் சுருக்கத்தையும் பொருளின் பரப்பையும் காக்கிறது.
- source_word: הִשְׁקִיתָנוּ
  choice: எங்களுக்குக் குடிக்கக் கொடுத்தீர்
  rationale: שקה என்பதன் ஹிஃபில் வடிவம் ‘குடிக்கக் கொடுத்தல்/குடிக்கச் செய்தல்’ என்று பொருள்படும். இத்தேர்வு தேவனே அந்த அனுபவத்தைக் கொடுத்தார் என்ற காரணவினைப் பொருளைக் காக்கிறது.
- source_word: יַיִן
  choice: திராட்சரசம்
  rationale: יַיִן என்பதன் வழக்கமான பொருள் திராட்சரசம்; இங்கு அது துன்பத்தாலும் நியாயத்தீர்ப்பாலும் உண்டாகும் தடுமாற்றத்திற்கான உருவகமாக உள்ளது.
- source_word: תַּרְעֵלָה
  choice: தள்ளாடச் செய்யும்
  rationale: இச்சொல் தள்ளாட்டம், தடுமாற்றம், போதையால் ஏற்படும் நிலைகுலைவு ஆகியவற்றைக் குறிக்கிறது. ‘தள்ளாடச் செய்யும்’ என்பது உருவகத்தின் விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘திராட்சரசம்’ என்ற உருவகத்தின் பொருள்
  choice: தேவன் தமது மக்களை கடுமையான துன்பத்திற்கும் நிலைகுலைவிற்கும் உட்படுத்தியதை உருவகமாகக் கூறுகிறது.
  alternative: தேவன் உண்மையாகவே அவர்களுக்குத் திராட்சரசம் குடிக்கக் கொடுத்தார்; அல்லது நியாயத்தீர்ப்பின் நிழலற்ற பொதுவான துன்பத்தை மட்டும் இது குறிக்கிறது.
  rationale: முதல் அடியின் ‘கடுமையானவற்றை அனுபவிக்கச் செய்தீர்’ என்ற இணைவாக்கியமும், தள்ளாட வைக்கும் திராட்சரசம் பற்றிய வேதாகம உருவகமும், திணிக்கப்பட்ட துன்பத்தையும் நிலைகுலைவையும் சுட்டுகின்றன. மொழிபெயர்ப்பு அந்த உருவகத்தை விளக்கவுரையாக மாற்றாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதை ஒருமையான ‘செய்தீர்/கொடுத்தீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய உருவகம் காக்கப்பட்டு, சொல்லுக்குச் சொல் தமிழில் இயல்பில்லாத ‘தள்ளாட்டத்தின் திராட்சரசம்’ முதன்மை உரையில் இயல்பான காரணவினைத் தொடராக வழங்கப்பட்டுள்ளது.
