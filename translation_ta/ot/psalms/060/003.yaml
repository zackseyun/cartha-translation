  language: ta
  text: உமது மக்களுக்குக் கடுமையான அனுபவங்களைக் கொடுத்தீர்; தள்ளாட வைக்கும் திராட்சரசத்தை[a] எங்களுக்குக் குடிக்கக் கொடுத்தீர்.
