  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பாத்திரம்,’ ‘செருப்பு,’ ‘வெற்றிமுழக்கம்’ ஆகியவை பொதுவாசகருக்குப் புரியும் சொற்கள்; எபிரேய வரியின் சுருக்கமும் மூன்று தேசங்கள்மீதான ஆதிக்கப் படிமமும் காக்கப்பட்டுள்ளன.
