    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: என் கால் கழுவும் பாத்திரம்
  rationale: סִיר என்பது பாத்திரம் அல்லது கலம்; רַחְצִי என்பது கழுவுவதற்குரியது எனக் குறிக்கிறது. சங்கீதத்தின் இணை இடமான 108:9 மற்றும் உருவகச் சூழலின் அடிப்படையில், தமிழில் இயல்பாகவும் இழிவுபடுத்தி அடக்குவதைக் காட்டும் உருவகத்தைத் தெளிவாகவும் தெரிவிக்க ‘என் கால் கழுவும் பாத்திரம்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: என் செருப்பை எறிவேன்
  rationale: Hiphil வடிவிலுள்ள שלך ‘எறிதல்’ என்று பொருள்படும்; נַעַל என்பது பாதஅணி. நவீனத் தமிழில் ‘செருப்பு’ இயல்பாகவும் பண்டைய உருவகத்திற்குப் பொருத்தமாகவும் உள்ளது.
- source_word: עַל אֱדוֹם
  choice: ஏதோமின்மேல்
  rationale: עַל என்பதன் இடவியல் வலிமையைப் பாதுகாத்து, ஏதோமின்மேல் செருப்பை எறியும் ஆதிக்க உருவகத்தை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עָלַי פְּלֶשֶׁת
  choice: பெலிஸ்தியாவே, எனக்காக
  rationale: עָלַי என்ற கடினமான வடிவிலுள்ள முதலாம் நபர் ஒருமை பின்னொட்டை ‘எனக்காக’ என அடுத்த கட்டளை வினையோடு இணைத்துள்ளோம்; பின்வரும் பெண்பால் ஒருமைக் கட்டளைக்கேற்ப பெலிஸ்தியாவை விளிவேற்றுமையில் தருகிறது.
- source_word: הִתְרֹעָעִי
  choice: வெற்றிமுழக்கமிடு
  rationale: רוע வேரின் இவ்வடிவம் உரத்த முழக்கத்தை, குறிப்பாகப் போர் அல்லது வெற்றிச் சூழலிலான முழக்கத்தைத் தெரிவிக்கிறது. ‘வெற்றிமுழக்கமிடு’ என்பது கட்டளை வடிவத்தையும் கவித்துவச் செறிவையும் காக்கிறது.
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  choice: மோவாப் / ஏதோம் / பெலிஸ்தியா
  rationale: இவை நிலம் அல்லது தேசத்தைக் குறிக்கும் பெயர்களாகத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன; குறிப்பாக פְּלֶשֶׁת மக்களைக் காட்டிலும் நிலம்/தேசத்தைக் குறிக்க ‘பெலிஸ்தியா’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: பெலிஸ்தியாவை நோக்கிய הִתְרֹעָעִי என்ற கட்டளையின் வலிமை
  choice: பெலிஸ்தியாவே, எனக்காக வெற்றிமுழக்கமிடு
  alternative: பெலிஸ்தியாவின்மேல் நான் வெற்றிமுழக்கமிடுவேன்
  rationale: மசோரா உயிர்க்குறிப்பீட்டின்படி வினை பெண்பால் ஒருமைக் கட்டளை; தேசமாகிய பெலிஸ்தியாவை நோக்கிய ஏளனமான அடக்குமுறைக் கட்டளையாக இதைப் புரிந்துகொள்ளலாம். சூழல் தெய்வீக வெற்றியைக் குறித்தாலும், முதலாம் நபர் அறிவிப்பாக மாற்றாமல் எபிரேய உரையின் இலக்கணத்தையும் அதன் பதற்றத்தையும் முதன்மை உரையில் காத்து, மாற்று வாசிப்பை அடிக்குறிப்பில் குறிப்பிட்டுள்ளோம்.
