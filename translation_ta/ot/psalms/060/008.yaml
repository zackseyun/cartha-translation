base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/008.yaml
  text: Moab is my washbasin[a]; on Edom I cast my sandal; over Philistia[b], shout in triumph for me.
translation:
  language: ta
  text: மோவாப் என் கழுவும் பாத்திரம்[a]; ஏதோமின்மேல் என் செருப்பை எறிவேன்; பெலிஸ்தியாவே, எனக்காக வெற்றிமுழக்கமிடு[b].
  philosophy: optimal-equivalence
