  source_fidelity: 'The draft correctly represents the Hebrew sequence: action undertaken בֵּאלֹהִים, followed by God''s decisive trampling of the psalmist''s foes. ‘தேவனோடு’ is a defensible rendering of the preposition, and ‘அவரே’ appropriately retains the explicit divine subject without diminishing the human ‘we.’'
