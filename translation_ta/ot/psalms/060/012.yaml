  terminology: ‘தேவன்,’ ‘எதிரிகள்,’ and ‘மிதித்துப்போடுவார்’ are appropriate modern Bible-Tamil terms. The footnotes preserve the relevant prepositional and verbal alternatives. The first note is adjusted for smoother and more precise Tamil.
