  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/012.yaml
  text: With God we will do valiantly[b][a], and he will trample our adversaries.
translation:
  language: ta
  text: தேவனோடு நாம் வீரமாய் செயல்படுவோம்[a]; அவரே நம் எதிரிகளை மிதித்துப்போடுவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேவனால் நாம் வீரமாய் செயல்படுவோம்.’ எபிரெய முன்னிடைச்சொல் நெருங்கிய இணைப்பையோ வழிமுறையையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நம் எதிரிகளைக் காலின்கீழ் போட்டு மிதிப்பார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: தேவனோடு
  rationale: בְּ என்ற முன்னிடைச்சொல் இங்கு நெருங்கிய இணைப்பையும் வழிமுறையையும் குறிக்கக்கூடும். ‘தேவனோடு’ என்பது அவரைச் சார்ந்து, அவருடைய துணையுடன் செயல்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது; ‘தேவனால்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נַעֲשֶׂה חָיִל
  choice: நாம் வீரச்செயல்கள் செய்வோம்
  rationale: עָשָׂה חַיִל என்ற சொற்றொடர் வீரத்துடன் செயல்படுதல் அல்லது வல்ல செயல்களைச் செய்தல் என்னும் பொருளுடையது. ‘வீரச்செயல்கள் செய்வோம்’ என்பது அதன் இராணுவக் கவித்துவச் சூழலையும் மனிதச் செயல்பாட்டையும் காக்கிறது.
- source_word: וְהוּא
  choice: அவரே
  rationale: தனிப்பட்ட சுட்டுப்பெயர் வலியுறுத்தப்பட்டிருப்பதால், வெற்றியின் முடிவான செயலை தேவனே செய்வார் என்ற அழுத்தத்தை ‘அவரே’ இயல்பாக வெளிப்படுத்துகிறது. இணைப்பின் தொடர்ச்சியைத் தமிழ் வாக்கியப் பிரிப்பும் அரைப்புள்ளியும் தாங்குகின்றன.
- source_word: יָבוּס
  choice: மிதித்துப்போடுவார்
  rationale: בוס என்பது காலின்கீழ் மிதித்தல் என்ற உயிரோட்டமான படிமத்தைக் கொண்டது. ‘மிதித்துப்போடுவார்’ அந்த வெற்றிப் படிமத்தை நவீன, புரிந்துகொள்ளத்தக்க தமிழில் காக்கிறது.
- source_word: צָרֵינוּ
  choice: நம் எதிரிகளை
  rationale: צָר என்பது பகைவன் அல்லது எதிரி என்பதைக் குறிக்கிறது. ‘எதிரிகள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ் சொல்; இராணுவச் சூழலுக்கும் பொருந்துகிறது.
theological_decisions:
- issue: வெற்றியில் மனித மற்றும் தெய்வீகச் செயல்பாடு
  choice: மக்கள் தேவனோடு வீரச்செயல்கள் செய்வார்கள்; அதேவேளை எதிரிகளை முடிவாக மிதித்துப்போடுபவர் அவரே.
  alternative: மனிதச் செயலையே மட்டும் அல்லது தெய்வீகச் செயலையே மட்டும் முன்னிறுத்துதல்.
  rationale: எபிரெய உரை ‘நாம் செய்வோம்’ என்பதையும் ‘அவரே மிதிப்பார்’ என்பதையும் ஒன்றாக வைத்திருக்கிறது. மொழிபெயர்ப்பு இந்த இரு செயல்பாடுகளையும் ஒன்றில் ஒன்றைக் கரைக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான மற்றும் சுருக்கமான கவித்துவ நடையில் வடிவமைக்கப்பட்டது. ‘தேவன்’ என்ற பொதுவான வேதாகமச் சொல் பயன்படுத்தப்பட்டுள்ளது. மனித முயற்சியையும் தேவனுடைய தீர்மானமான செயலையும் இணைத்து நிறுத்தும் மூல உரையின் பதற்றம் காக்கப்பட்டுள்ளது.
