    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: விடுவிக்கப்படும்படி
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் எபிரெயச் சொல்லின் வலிமையை இயல்பான தமிழில் பின்னொட்டுத் தொடராகப் பாதுகாக்கிறது.
- source_word: יֵחָלְצוּן
  choice: விடுவிக்கப்பட
  rationale: חלץ என்பதன் நிபால் வடிவம் ஆபத்திலிருந்து இழுத்தெடுக்கப்படுதல் அல்லது மீட்கப்படுதல் என்ற பொருளைத் தருகிறது; இங்கு ‘விடுவிக்கப்பட’ என்பது வேண்டுதல் சூழலுக்கு இயல்பாக உள்ளது.
- source_word: יְדִידֶיךָ
  choice: உமக்கு அன்பானவர்கள்
  rationale: இரண்டாம் நபர் ஒருமை உரிமைப் பின்னொட்டுடன் வரும் பன்மையையும், பாசத்துக்குரியவர்கள் என்ற பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: הוֹשִׁיעָה
  choice: காப்பாற்றி
  rationale: ישׁע என்பதன் ஹிபீல் கட்டளை வடிவம் நேரடியான இரட்சிப்பு வேண்டுதலைக் குறிக்கிறது; ‘காப்பாற்றி’ நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְמִינְךָ
  choice: உமது வலக்கையால்
  rationale: தேவனுடைய வல்லமையான செயலைக் குறிக்கும் உருவகத்தைச் சுருக்காமல், செயற்கருவிப் பொருளையும் பாதுகாக்கிறது.
- source_word: ו/ענ/נו
  choice: எங்களுக்குப் பதிலளியும்
  rationale: WLC-இல் தரப்பட்ட மெய்யெழுத்து/வாசிப்பு மரபு பன்மை வேண்டுதலாகப் புரிந்துகொள்ள இடமளிக்கிறது; சங்கீதத்தின் சமூகக் குரலோடும் இது பொருந்துகிறது. ஒருமை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: தேவனுடைய வலக்கை என்ற உருவகம்
  choice: ‘உமது வலக்கையால்’ என்று உருவகத்தை அப்படியே வைத்தல்
  alternative: ‘உமது வல்லமையால்’ என்று கருத்தை மட்டும் மொழிபெயர்த்தல்
  rationale: மூலத்தின் கவித்துவமும் தேவனுடைய காப்பாற்றும் வல்லமையை வெளிப்படுத்தும் மனிதஉருவக மொழியும் முக்கியமானவை; அவற்றை அரூபமாக்காமல் பாதுகாக்க வேண்டும்.
- issue: இறுதி வினையின் நபர்-எண் வாசிப்பு
  choice: ‘எங்களுக்குப் பதிலளியும்’ என்ற பன்மை வாசிப்பு
  alternative: ‘எனக்குப் பதிலளியும்’ என்ற ஒருமை வாசிப்பு
  rationale: கொடுக்கப்பட்ட WLC வடிவம் மற்றும் மசோரா வாசிப்பு மரபின் ஒரு புரிதல் பன்மையை ஆதரிக்கிறது; ஆயினும் ஒருமை வாசிப்பும் சான்றுடையதால் அதை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நடையில் ‘உமது/பதிலளியும்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் நோக்கத் தொடர், பன்மை, வலக்கை உருவகம், இறுதி வாசிப்பு வேறுபாடு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
