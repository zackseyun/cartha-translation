revisions:
- from: உமக்கு அன்பானவர்கள் விடுவிக்கப்படும்படி,[a] உமது வலக்கையால் காப்பாற்றி, எங்களுக்குப் பதிலளியும்.[b]
  to: உமது அன்புக்குரியவர்கள் விடுவிக்கப்படும்படி,[a] உமது வலக்கையால் காப்பாற்றும்; எங்களுக்குப் பதிலளியும்.[b]
