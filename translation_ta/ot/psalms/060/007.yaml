source:
  edition: WLC
  text: לִ֤/י גִלְעָ֨ד וְ/לִ֬/י מְנַשֶּׁ֗ה וְ֭/אֶפְרַיִם מָע֣וֹז רֹאשִׁ֑/י יְ֝הוּדָ֗ה מְחֹֽקְקִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/007.yaml
  text: Gilead is mine[a], and Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my scepter.
translation:
  language: ta
  text: கீலேயாத் எனக்குரியது; மனாசேயும் எனக்குரியது; எப்பிராயீம் என் தலைக்குக் கோட்டை; யூதா என் ஆட்சிக்கோல்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சட்டமளிப்பவர்” அல்லது “என் ஆளுகைக்கோல்.” எபிரெயச் சொல் ஆணை பிறப்பிப்பவரையோ, ஆட்சியைக் குறிக்கும் கோல் அல்லது செங்கோலையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לִי
  choice: எனக்குரியது
  rationale: முதலாம் நபர் ஒருமை பின்னொட்டுடன் வரும் முன்னிடைச்சொல் உடைமையைக் குறிக்கிறது; தமிழில் இயல்பாகவும் நேரடியாகவும் ‘எனக்குரியது’ என வழங்கப்படுகிறது.
- source_word: גִלְעָד
  choice: கீலேயாத்
  rationale: இடப்பெயர்; தமிழ் வேதாகமப் பெயரிடல் மரபுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: מְנַשֶּׁה
  choice: மனாசே
  rationale: கோத்திரம் அல்லது பிரதேசத்தைக் குறிக்கும் பெயர்; மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֶפְרַיִם
  choice: எப்பிராயீம்
  rationale: கோத்திரப் பெயர்; தமிழ் வேதாகமப் பயன்பாட்டுக்கு ஏற்ற ஒலிபெயர்ப்பு.
- source_word: מָעוֹז
  choice: கோட்டை
  rationale: பாதுகாப்பையும் வலிமையான அரணையும் குறிக்கும் பெயர்ச்சொல்; சங்கீதத்தின் இராணுவ-அரசியல் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: רֹאשִׁי
  choice: என் தலைக்கு
  rationale: ‘என் தலை’ என்ற மூல உருவகத்தைத் தக்கவைத்து, கோட்டையின் பாதுகாப்புப் பங்கைத் தமிழில் இயல்பாக வெளிப்படுத்த நான்காம் வேற்றுமை பயன்படுத்தப்படுகிறது.
- source_word: מְחֹקְקִי
  choice: என் ஆட்சிக்கோல்
  rationale: சட்டம் அல்லது ஆணை பிறப்பிப்பவரையும், ஆட்சியை அடையாளப்படுத்தும் கோல் அல்லது செங்கோலையும் இச்சொல் குறிக்கலாம். இச்சூழலின் அரசாட்சி உருவகத்தை ‘ஆட்சிக்கோல்’ தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: מְחֹקְקִי என்ற சொல்லின் அரசாட்சி உருவகம்
  choice: என் ஆட்சிக்கோல்
  alternative: என் சட்டமளிப்பவர்; என் ஆளுகைக்கோல்
  rationale: இந்த வசனம் கோத்திரங்களுக்குப் பாதுகாப்பு மற்றும் அரசாட்சி சார்ந்த உருவகப் பங்குகளை வழங்குகிறது. ‘ஆட்சிக்கோல்’ அரச அதிகாரத்தை வெளிப்படுத்துகிறது; அதே நேரத்தில், மூலச்சொல் ஒருவரைக் குறிக்கும் ‘சட்டமளிப்பவர்’ என்ற பொருளையும் கொள்ளக்கூடியதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமான கவிதை நடையும் இணை அமைப்பும் காக்கப்பட்டுள்ளன. ‘என் தலைக்குக் கோட்டை’ என்பது மூலத்தின் தலை-கோட்டை உருவகத்தை விளக்கமாக விரித்துவிடாமல் இயல்பான தமிழில் தருகிறது.
