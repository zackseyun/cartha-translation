source:
  edition: WLC
  text: אֱ֭לֹהִים זְנַחְתָּ֣/נוּ פְרַצְתָּ֑/נוּ אָ֝נַ֗פְתָּ תְּשׁ֣וֹבֵ֥ב לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/001.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
translation:
  language: ta
  text: 'கடவுளே, நீர் எங்களை ஒதுக்கித் தள்ளினீர்;

    எங்களில் ஒரு பிளவை ஏற்படுத்தினீர்;

    எங்கள்மேல் சினங்கொண்டீர்.

    எங்களை மீண்டும் நிலைநிறுத்தும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களிடம் திரும்பிவாரும்.” எபிரெயச் சொற்றொடர், மக்களை மீண்டும் நிலைநிறுத்துவதையோ கடவுள் அவர்களிடம் திரும்பிவருவதையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது இஸ்ரயேலின் கடவுளை நேரடியாக அழைக்கும் விளிவேற்றுமை; ‘கடவுளே’ என்பது நவீனத் தமிழில் இயல்பாகவும் மரியாதையுடனும் உள்ளது.
- source_word: זְנַחְתָּנוּ
  choice: நீர் எங்களை ஒதுக்கித் தள்ளினீர்
  rationale: זנח என்பதன் நிராகரித்தல் அல்லது தள்ளிவிடுதல் என்ற வலுவான பொருளை இது தெளிவாகக் காட்டுகிறது; ‘புறக்கணித்தீர்’ என்பதைக் காட்டிலும் உடன்படிக்கைச் சூழலிலுள்ள தள்ளுபடியின் தீவிரத்தைப் பேணுகிறது.
- source_word: פְרַצְתָּנוּ
  choice: எங்களைப் பிளந்தீர்
  rationale: פרץ என்பதிலுள்ள உடைத்துப் பிளத்தல் அல்லது மதிலில் பிளவு உண்டாக்குதல் என்ற வன்மையான உருவகத்தைச் சுருக்கமாகப் பேணுகிறது; தமிழில் பொருள் தலைகீழாகப் புரியாதவாறும் உள்ளது.
- source_word: אָ֝נַפְתָּ
  choice: எங்கள்மேல் சினங்கொண்டீர்
  rationale: வினைச்சொல்லின் கோபம் அல்லது சினம் என்ற பொருளை இயல்பான தமிழில் தருகிறது; சூழலில் அந்தச் சினம் மக்கள்மேல் இருந்ததை வெளிப்படுத்துகிறது.
- source_word: תְּשׁוֹבֵב לָנוּ
  choice: எங்களை மீண்டும் நிலைநிறுத்தும்
  rationale: நியாயத்தீர்ப்பால் சிதைந்த மக்களைப் பழைய நிலைக்குக் கொண்டுவர வேண்டும் என்ற வேண்டுதலை இயல்பான, மாண்பான தமிழில் தெரிவிக்கிறது. கடவுள் அவர்களிடம் திரும்பிவர வேண்டும் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: תְּשׁוֹבֵב לָנוּ என்ற இறுதி வேண்டுதலின் பொருள்
  choice: நியாயத்தீர்ப்புக்குப் பின் மக்களை மீண்டும் நிலைநிறுத்தும்படி கடவுளிடம் வேண்டுதல்
  alternative: கடவுள் தம் மக்களிடம் திரும்பிவரும்படி வேண்டுதல்
  rationale: எபிரெயச் சொற்றொடர் மக்களின் மீட்சி அல்லது கடவுளின் உறவுசார் திரும்பிவருதல் ஆகிய இரண்டையும் குறிக்கக்கூடும். முதன்மை உரை சங்கீதத்தின் சிதைவு–மீட்சி நகர்வை இயல்பாகத் தருகிறது; உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் விடப்படாமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடி வேண்டுதலுக்குரிய மரியாதைமிக்க ‘நீர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. கவிதை வரியமைப்பு காக்கப்பட்டுள்ளது; மிகப் பழமையான அல்லது குறிப்பிட்ட திருச்சபை மரபுக்குரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
