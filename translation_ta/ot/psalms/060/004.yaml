  yaml_path: translation/ot/psalms/060/004.yaml
  text: You have given a banner to those who fear you[a], to be raised up because of the truth[b]. Selah
translation:
  language: ta
  text: உமக்கு அஞ்சுகிறவர்களுக்கு ஒரு கொடியைக் கொடுத்தீர்; உண்மையின் பொருட்டு அது உயர்த்தப்படுவதற்காக.[a][b] சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உயர்த்திக் காட்டப்படுவதற்காக,” “ஒன்றுகூடுவதற்காக,” அல்லது ஒருவேளை “தப்பியோடுவதற்காக” என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெய வினைச்சொல் கடினமானதும் விவாதத்திற்குரியதும் ஆகும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல்லான கோஷெட் என்பதற்கு பெரும்பாலும் “உண்மை” அல்லது “உண்மைத்தன்மை” என்று பொருள். சில பழங்கால மொழிபெயர்ப்புகளும் விளக்கங்களும் இவ்வரியை வேறுவிதமாகப் புரிந்துகொண்டு, “வில்லின் காரணமாக” என்பது போன்ற வாசிப்புகளைத் தருகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: கொடுத்தீர்
  rationale: נתן என்பதன் Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை; கடவுளை மரியாதை ஒருமையில் நேரடியாக விளித்து, முடிவுற்ற செயலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לִירֵאֶיךָ
  choice: உமக்கு அஞ்சுகிறவர்களுக்கு
  rationale: ירא participle-ஐ ‘அஞ்சுகிறவர்கள்’ என மொழிபெயர்ப்பது வெறும் பீதியை மட்டும் அல்லாமல் கடவுளிடம் கொள்ளும் பயபக்தியையும் சூழலில் தக்கவைக்கிறது.
- source_word: נֵס
  choice: ஒரு கொடி
  rationale: உயர்த்தப்படும் அடையாளம் அல்லது படைக்கொடி என்ற உருவகத்தைச் சாதாரண நவீன தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: לְהִתְנוֹסֵס
  choice: அது உயர்த்தப்படுவதற்காக
  rationale: கடினமும் விவாதத்திற்குரியதுமான வினைவடிவத்தை, נֵס (‘கொடி’) என்பதுடன் உள்ள சொல்விளையாட்டையும் காட்சியையும் தக்கவைக்கும் passive/reflexive பொருளில் வழங்குகிறது.
- source_word: מִפְּנֵי
  choice: பொருட்டு
  rationale: சொல்லுக்குச் சொல் ‘முகத்திலிருந்து/முன்பிருந்து’ என்றாலும், இங்கு காரணம் அல்லது நோக்குச் சார்பைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்லாக அமைகிறது; மூலத்தின் உறவை முற்றிலும் மிகத் தெளிவாக்காமல் விடுகிறது.
- source_word: קֹשֶׁט
  choice: உண்மை
  rationale: இந்த அரிய கவிதைச்சொல்லின் மிகச் சாத்தியமான பொருள் ‘உண்மை/உண்மைத்தன்மை’; தமிழில் தேவையற்ற definite article சேர்க்காமல் வழங்கப்படுகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: துல்லியமான பொருள் உறுதியில்லாத வழிபாட்டு அல்லது இசைக் குறியீடாக இருப்பதால் எபிரெய வடிவம் ஒலிபெயர்க்கப்படுகிறது.
