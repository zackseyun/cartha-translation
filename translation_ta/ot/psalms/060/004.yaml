  register: நவீன நிலையான தமிழில், கடவுளை நோக்கி மரியாதை ஒருமையான ‘உமக்கு/கொடுத்தீர்’ பயன்படுத்தப்பட்டுள்ளது. கவிதைநடை கண்ணியமாகவும் பொதுவாசகருக்கு எளிதாகவும் வைக்கப்பட்டுள்ளது. மூலத்தின் விவாதத்திற்குரிய இரண்டு இடங்களும் [a], [b] அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
