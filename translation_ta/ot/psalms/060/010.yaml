  text: הֲ/לֹֽא אַתָּ֣ה אֱלֹהִ֣ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/010.yaml
  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
translation:
  language: ta
  text: கடவுளே, நீர்தாமே எங்களை ஒதுக்கிவிட்டீர்[a] அல்லவா? கடவுளே, எங்கள் படைகளுடன் நீர் புறப்படுவதில்லையே[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களைக் கைவிட்டீர்.”
    reason: lexical_alternative
  - marker: b
    text: “புறப்படுதல்” என்பது இங்கு படைகளுடன் போருக்குச் செல்லுவதைக் குறிக்கும் இராணுவ வழக்கு.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא
  choice: அல்லவா? … இல்லையே?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் வினாவின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; அதன் தாக்கம் இரு இணைக் கூறுகளிலும் தொடர்கிறது.
- source_word: אַתָּה
  choice: நீர்தாமே
  rationale: தனியாக நிற்கும் எபிரெயப் பதிலிப்பெயரின் அழுத்தத்தை மரியாதையான, இறைவனை நேரடியாக விளிக்கும் தமிழில் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இங்கு நேரடி விளியாக இருப்பதால் விளிவேற்றுமை வடிவம் பயன்படுத்தப்பட்டது; மூலத்தில் உள்ள இருமுறை பயன்பாடும் காக்கப்பட்டது.
- source_word: זְנַחְתָּנוּ
  choice: எங்களை ஒதுக்கிவிட்டீர்
  rationale: זנח என்பதன் ‘நிராகரி/தள்ளிவிடு’ என்ற கருத்தை இயல்பாகத் தருகிறது; ‘கைவிட்டீர்’ என்பதைக் காட்டிலும் முழுமையாகத் துறந்துவிட்டார் என்ற கூடுதல் முடிவைத் தவிர்க்கிறது.
- source_word: וְלֹא תֵצֵא
  choice: நீர் புறப்படுவதும் இல்லையே
  rationale: இரண்டாம் கூறும் தொடரும் எதிர்மறை வினாவின் பகுதியாக இருப்பதைத் தெளிவாக்குகிறது; கட்டளையாகத் தவறாகப் புரிந்துகொள்ளப்படுவதைத் தவிர்க்கிறது.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: எங்கள் படைகளுடன்
  rationale: צבאות இங்கு இராணுவப் படைகளைக் குறிக்கிறது; בְ என்பதன் உடன்செல்லும் பொருளை ‘உடன்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: புலம்பலில் கடவுள் தம் மக்களை நிராகரித்ததாகக் கூறுதல்
  choice: கடவுள் அவர்களை ஒதுக்கிவிட்டதாகவும் அவர்களுடைய படைகளுடன் புறப்படுவதில்லை என்றும் நேரடியாகக் கூறும் மொழியைத் தக்கவைத்தல்
  alternative: ‘கடவுள் எங்களை ஒதுக்க அனுமதித்தார்’ அல்லது ‘ஒதுக்கியதுபோல் தோன்றினார்’ என்று மென்மையாக்குதல்
  rationale: எபிரெய உரை இந்தச் செயல்களை நேரடியாகக் கடவுளோடு தொடர்புபடுத்துகிறது. புலம்பலின் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்க வேண்டும்.
- issue: הֲלֹא வினாவின் பரப்பு
  choice: இரு கூறுகளையும் உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் வினாவாக மொழிபெயர்த்தல்
  alternative: முதல் கூறை மட்டும் வினாவாகவும் இரண்டாவதை எதிர்மறைக் கூற்றாகவும் தருதல்
  rationale: இணைப்புச் சொல் இரண்டாம் கூறை முதலாவது வினாவுடன் இணைக்கிறது; தமிழில் இரு வினா வடிவங்கள் பயன்படுத்தப்படுவது அந்தத் தொடர்ச்சியையும் தெளிவையும் காக்கிறது.
translation_notes:
  register: மரியாதையான இறைநோக்கு மொழிக்காக ‘நீர்/விட்டீர்’ பயன்படுத்தப்பட்டுள்ளது. நடை நவீனமும் கண்ணியமுமானது. மூலத்தின் இருமுறை ‘கடவுளே’ என்ற விளிப்பும், நேரடியான புலம்பல் தொனியும் காக்கப்பட்டுள்ளன.
