base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/001.yaml
  text: My heart overflows with a good word[a]; I say[c][b], “My work is for the king.” My tongue is the pen of a skillful scribe.
translation:
  language: ta
  text: 'என் இதயம் ஒரு நல்ல சொல்லால்[a] பொங்குகிறது;


    “என் படைப்பு அரசனுக்கானது[b]” என்று நான் சொல்கிறேன்.


    என் நாவு திறமைமிக்க எழுத்தரின் எழுத்தாணி[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இனிய கருத்தால்” அல்லது “மேன்மையான விஷயத்தால்.” எபிரேயச் சொற்றொடர் பேசப்படும் சொற்களையோ அவற்றின் பொருளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அரசனைப் பற்றியது” அல்லது “அரசனுக்கு.” இங்குள்ள முன்னிடைச்சொல் அர்ப்பணம், பொருள் அல்லது நேரடி முகவரி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “விரைந்து எழுதும் எழுத்தரின் எழுத்தாணி” அல்லது “ஆயத்தமான எழுத்தரின் எழுத்தாணி.” எபிரேயப் பெயரடை திறமையுடன் வேகமாகச் செயல்படுவதையோ ஆயத்தநிலையையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
