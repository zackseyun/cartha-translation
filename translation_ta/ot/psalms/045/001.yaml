- source_word: מַעֲשַׂי
  choice: என் படைப்பு
  rationale: இலக்கியச் சூழலில் கவிஞர் உருவாக்கிய பாடல் அல்லது இயற்றலைக் குறிக்கிறது; ‘செயல்கள்’ என்பதைவிட இங்கு தெளிவாகவும் இயல்பாகவும் உள்ளது.
