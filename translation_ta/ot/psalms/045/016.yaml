  yaml_path: translation/ot/psalms/045/016.yaml
  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
translation:
  language: ta
  text: உன் தந்தையருக்குப் பதிலாக உன் மகன்கள் இருப்பார்கள்[b]; பூமியெங்கும்[a] அவர்களை அதிபதிகளாக நியமிப்பாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடெங்கும்.” எபிரெயச் சொல்லுக்கு “பூமி” என்றும் “நாடு” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உன் தந்தையரின் இடத்தை உன் மகன்கள் ஏற்றுக்கொள்வார்கள்.”
    reason: previous_rendering
lexical_decisions:
- source_word: תַּחַת
  choice: பதிலாக
  rationale: இங்கு இடத்தைக் குறிக்காமல், முந்தைய தலைமுறையினரின் இடத்தை அடுத்த தலைமுறையினர் ஏற்கும் மாற்றையும் வாரிசுரிமையையும் குறிக்கிறது.
- source_word: אֲבֹתֶיךָ
  choice: உன் தந்தையர்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருளைத் தக்கவைத்தபடியே, அரச வம்சத்தின் முன்னோர்களையும் குறிக்கக்கூடிய இயல்பான தமிழ்ச் சொல்.
- source_word: יִהְיוּ
  choice: இருப்பார்கள்
  rationale: வாரிசுகள் குறித்த வாக்குறுதியின் எளிய எதிர்காலப் பொருளை வெளிப்படுத்துகிறது.
- source_word: בָנֶיךָ
  choice: உன் மகன்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் பன்மையாக இருப்பதால், அரச வம்ச வாரிசுகளைக் குறிக்கும் குறிப்பான பொருள் பாதுகாக்கப்படுகிறது.
- source_word: תְּשִׁיתֵמוֹ
  choice: அவர்களை ... நியமிப்பாய்
  rationale: ‘வைத்தல்/நிறுத்துதல்’ என்ற அடிப்படைப் பொருள் இச்சூழலில் ஆட்சிப் பொறுப்பில் அமர்த்துவதைக் குறிப்பதால், ‘நியமிப்பாய்’ என்பது இயல்பான பொருட்சமமான மொழிபெயர்ப்பு.
- source_word: לְשָׂרִים
  choice: அதிபதிகளாக
  rationale: שָׂרִים என்பது தலைவர்கள், ஆட்சியாளர்கள், பிரபுக்கள் ஆகியோரைக் குறிக்கலாம். ‘அதிபதிகள்’ அரசவைக்குரிய உயர்ந்த நடையையும் ஆட்சி அதிகாரத்தையும் தக்கவைக்கிறது; ‘இளவரசர்கள்’ என்று மொழிபெயர்த்தால் மகன்கள் என்ற உறவுநிலையே தேவையின்றி மீண்டும் வலியுறுத்தப்படும்.
- source_word: בְּכָל הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: אֶרֶץ என்பதற்கு ‘பூமி’ அல்லது ‘நாடு’ என்று பொருள் கொள்ளலாம். சங்கீதத்தின் விரிவான அரச மொழிக்கு ‘பூமியெங்கும்’ பொருத்தமாக உள்ளது; ‘நாடெங்கும்’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: அரச/மேசியச் சூழலில் הָאָרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நாடு
  rationale: எபிரெயச் சொல் இரண்டு பொருள்களையும் அனுமதிக்கிறது. இங்கு அரசரின் ஆட்சியை விரிவாகச் சித்தரிக்கும் மொழிநடையுடன் ‘பூமி’ நன்கு பொருந்துகிறது; அதேவேளையில், குறிப்பிட்ட நாட்டைக் குறிக்கும் வாசிப்பை அடிக்குறிப்பு பாதுகாக்கிறது. பிற்கால மேசிய விளக்கத்தை வசனத்துக்குள் கட்டாயமாகப் புகுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘அதிபதிகள்’ என்பது அரசவைக்குரிய உயர்ந்த தொனியைக் காக்கிறது. ஒருமை இரண்டாம் நபர் ஆண்பால் அரசனை நோக்கிய உரை தமிழில் இயல்பான ‘உன்/நியமிப்பாய்’ வடிவில் தரப்பட்டுள்ளது.
