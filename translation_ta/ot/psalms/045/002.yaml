id: PSA.45.2
reference: Psalms 45:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יָפְיָפִ֡יתָ מִ/בְּנֵ֬י אָדָ֗ם ה֣וּצַק חֵ֭ן בְּ/שְׂפְתוֹתֶ֑י/ךָ עַל כֵּ֤ן בֵּֽרַכְ/ךָ֖ אֱלֹהִ֣ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/002.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
translation:
  language: ta
  text: மானிடர் அனைவரையும்விட நீர் பேரழகுடையவர்[a]; உமது உதடுகள்மேல் அருள் பொழியப்பட்டுள்ளது[b]; ஆகையால் கடவுள் உம்மை என்றென்றைக்கும் ஆசீர்வதித்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொல்லுக்குச் சொல், “மனிதனின் மகன்களைவிட”; இது மற்ற மனிதர்களைக் குறிக்கும் கவிதைச் சொற்றொடர்.
    reason: cultural_note
  - marker: b
    text: “அருள்” என்பதற்கான எபிரெயச் சொல் “தயவு,” “ஈர்ப்பு” அல்லது “இனிய நயம்” என்றும் பொருள்படலாம்; இங்கு அது அருள்நிறைந்த பேச்சையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ
  choice: நீர் பேரழகுடையவர்
  rationale: יפה என்பதிலிருந்து வந்த இத்தீவிரக் கவிதை வடிவம் ஒப்பற்ற அல்லது விஞ்சிய அழகைக் குறிக்கிறது. מן தொடங்கும் ஒப்பீட்டுடன் சேர்ந்து, ‘பேரழகுடையவர்’ என்பது உயர்ந்த கவிதை நடையையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: מִבְּנֵי אָדָם
  choice: மானிடர் அனைவரையும்விட
  rationale: சொல்லுக்குச் சொல் பொருள் ‘மனிதனின் மகன்களைவிட’ என்பதாக இருந்தாலும், இது பிற மனிதர்களைக் குறிக்கும் எபிரெயக் கவிதைச் சொற்றொடர். ‘மானிடர் அனைவரையும்விட’ என்பது ஒப்பீட்டின் முழு வலிமையையும் காத்து, தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: הוּצַק
  choice: பொழியப்பட்டுள்ளது
  rationale: יצק என்பதன் செயப்பாட்டு வடிவம் ‘ஊற்றப்படுதல்/பொழியப்படுதல்’ என்று பொருள்படும். தமிழில் ‘பொழியப்பட்டுள்ளது’ என்பது நிறைவுற்ற செயலின் தற்போதைய விளைவையும் நிறைவான மிகுதியின் உருவகத்தையும் காக்கிறது.
- source_word: חֵן
  choice: அருள்
  rationale: חֵן என்பது அருள், தயவு, ஈர்ப்பு, இனிய நயம் ஆகிய பொருட்களைத் தரக்கூடும். உதடுகளுடன் தொடர்புபடுத்தப்படுவதால் இனிய, அருள்நிறைந்த பேச்சையும் சுட்டுகிறது; ‘அருள்’ அதன் பரந்த கவிதை மற்றும் அறநெறி ஒலிப்பைத் தக்கவைக்கிறது.
- source_word: בְּשְׂפְתוֹתֶיךָ
  choice: உமது உதடுகள்மேல்
  rationale: முன்னொட்டு அடிப்படையில் ‘உமது உதடுகளில்/உமது உதடுகளால்’ என்ற சாத்தியம் இருந்தாலும், பொழியும் உருவகத்துக்கு ‘உதடுகள்மேல்’ என்பது இயல்பானதும் காட்சித்தன்மையுடையதும் ஆகும்.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முன் கூறிய பண்புகளையும் கடவுளின் ஆசீர்வாதத்தையும் காரணவிளைவு முறையில் இணைக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: בֵּרַכְךָ אֱלֹהִים
  choice: கடவுள் உம்மை ஆசீர்வதித்திருக்கிறார்
  rationale: மூன்றாம் ஆண்பால் ஒருமை நிறைவுவினையுடன் இரண்டாம் ஆண்பால் ஒருமை பின்னொட்டு உள்ளது; אֱלֹהִים இயல்பாக வினையின் எழுவாய். ‘ஆசீர்வதித்திருக்கிறார்’ நிறைவுற்ற செயலும் தொடரும் நிலையும் வெளிப்படுத்துகிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றைக்கும்
  rationale: நீடித்த, முடிவற்ற காலத்தைக் குறிக்கும் சொல்லை நவீன தமிழில் தெளிவாகவும் கவிதைநயத்துடனும் வழங்குகிறது.
theological_decisions:
- issue: இறுதிக் கூற்றில் אֱלֹהִים எழுவாயா (‘கடவுள் உம்மை ஆசீர்வதித்திருக்கிறார்’), அழைப்புவிளியா (‘கடவுளே’) என்பது
  choice: אֱלֹהִים என்பதை வினையின் எழுவாயாகக் கொண்டு, ‘கடவுள் உம்மை ஆசீர்வதித்திருக்கிறார்’ என்று மொழிபெயர்த்தல்.
  alternative: ‘கடவுளே’ என்ற அழைப்புவிளியாகக் கொண்டு, வெளிப்படையாகக் கூறப்படாத ஓர் எழுவாயை வினைக்கு வழங்குதல்; அல்லது அடுத்த வசனத்தின் சொற்களுடன் இணைத்து வாசித்தல்.
  rationale: இந்த வசனத்தின் எபிரெயச் சொற்றொடரமைப்பில் אֱלֹהִים என்பது בֵּרַכְךָ என்பதன் பின்னர் வரும் எழுவாயாக வாசிக்கப்படுவது மிக இயல்பானது. அடுத்த வசனத்தின் சொற்களையோ ஒரு குறிப்பிட்ட கிறிஸ்துவியல் விளக்கத்தையோ இவ்வசனத்துக்குள் கொண்டுவராமல், உள்ள உரையின் இலக்கண அமைப்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசரை நேரடியாக விளிக்கும் சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான உயர்நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்/உமது/உம்மை’ என்ற மரியாதை வடிவங்கள் ஒரே சீராகப் பேணப்பட்டுள்ளன; அரிதான பழமொழிகளும் சமயப்பிரிவுக்குரிய தனிச்சொற்களும் தவிர்க்கப்பட்டுள்ளன.
