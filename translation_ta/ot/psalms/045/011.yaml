source:
  edition: WLC
  text: וְ/יִתְאָ֣ו הַ/מֶּ֣לֶךְ יָפְיֵ֑/ךְ כִּי ה֥וּא אֲ֝דֹנַ֗יִ/ךְ וְ/הִשְׁתַּֽחֲוִי לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/011.yaml
  text: and the king will desire your beauty[a], for he is your lord[b]; bow down to him.
translation:
  language: ta
  text: அரசன் உன் அழகை விரும்புவான்[a]; ஏனெனில், அவனே உன் எஜமான்; அவன் முன் பணிந்து வணங்கு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசன் உன் அழகை விரும்பட்டும்.” எபிரெய வினைவடிவத்தை எதிர்காலக் கூற்றாகவும், விருப்பம் அல்லது வேண்டுதல் உணர்வுடைய சொல்லாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுக்கு மரியாதை செலுத்து.” இவ்வினை உயர்ந்த ஒருவருக்கு முன் மரியாதையுடன் பணிவதையோ, சமயச் சூழலில் வழிபடுவதையோ குறிக்கலாம். சிலர் “அவனை வழிபடு” என்றும் மொழிபெயர்க்கின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  choice: விரும்புவான்
  rationale: אוה என்பதன் இவ்வினைவடிவம் இங்கு எதிர்காலக் கூற்றாக இயல்பாகப் புரிந்துகொள்ளலாம். அதேவேளையில், கவிதைச் சூழலில் விருப்பம் அல்லது வேண்டுதல் சார்ந்த பொருளும் சாத்தியம்; அது அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: குறிப்பிட்ட அரசனைக் குறிக்கும் எபிரெய வரையறைபெற்ற பெயர்ச்சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: יָפְיֵךְ
  choice: உன் அழகை
  rationale: இரண்டாம் நபர் பெண்பால் ஒருமை உடைமை விகுதியுடன் வரும் ‘அழகு’ என்ற பொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தைத் தெளிவாக இணைக்கிறது.
- source_word: הוּא
  choice: அவனே
  rationale: எபிரெயில் தனிப்பட்ட சுட்டுப்பெயர் வெளிப்படையாக இடம்பெறுவதால் அதன் வலியுறுத்தலை ‘ஏ’ விகுதி மூலம் பாதுகாக்கிறது.
- source_word: אֲדֹנַיִךְ
  choice: உன் தலைவன்
  rationale: அரசன் அல்லது கணவன் சார்ந்த அதிகார உறவைக் குறிக்கிறது; ‘ஆண்டவர்’ என்ற சொல் ஏற்படுத்தக்கூடிய கட்டாயமான தெய்வீகப் பொருளையும், ‘எஜமான்’ என்பதன் கடுமையான நவீனத் தொனியையும் தவிர்க்கிறது.
- source_word: וְהִשְׁתַּחֲוִי
  choice: பணிந்து வணங்கு
  rationale: தன்னைத்தான் தாழ்த்தி வணங்கும் உடல் செய்கையையும் மரியாதையையும் வெளிப்படுத்துகிறது; இது அரசருக்கான மரியாதையா சமய வழிபாடா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: לוֹ
  choice: அவன் முன்
  rationale: தமிழில் பணிந்து வணங்கும் செயலை இயல்பாக வெளிப்படுத்தும் இடவுறவுச் சொற்றொடர்; எபிரெயின் ‘அவனுக்கு/அவனை நோக்கி’ என்ற உறவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: וְהִשְׁתַּחֲוִי לּוֹ என்பது சமய வழிபாட்டைத் தெளிவாகக் குறிக்கிறதா
  choice: அவன் முன் பணிந்து வணங்கு
  alternative: அவனுக்கு மரியாதை செலுத்து; அவனை வழிபடு
  rationale: இந்த எபிரெய வினை கடவுளுக்கு முன்பும் மனித அதிகாரிக்கு முன்பும் பணிவதைக் குறிக்கலாம். அரச திருமணப் பாடலான இச்சூழலில், பிரதான உரை உடல் பணிவையும் மரியாதையையும் காட்டுகிறது; ஆனால் அதை முற்றிலும் அரசவை மரியாதையாகவோ சமய வழிபாடாகவோ கட்டுப்படுத்தவில்லை.
- issue: וְיִתְאָו என்பதன் காலமும் வினைநிலையும்
  choice: அரசன் உன் அழகை விரும்புவான்
  alternative: அரசன் உன் அழகை விரும்புவாராக
  rationale: வடிவத்தை எளிய எதிர்காலக் கூற்றாக வாசிப்பது இலக்கண ரீதியாக வலுவானது. எனினும் முந்தைய அறிவுறுத்தல்களைத் தொடரும் கவிதைச் சூழல் விருப்பம் அல்லது வேண்டுதல் சார்ந்த நுணுக்கத்தையும் அனுமதிப்பதால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘தலைவன்’ என்பது இங்கு மனித அரசன்/கணவன் சார்ந்த உறவுப் பட்டமாக வைக்கப்பட்டுள்ளது; தெய்வீகப் பட்டம் முன்கூட்டியே திணிக்கப்படவில்லை. ‘பணிந்து வணங்கு’ என்பது உடல் பணிவையும் மரியாதையையும் இயல்பாகத் தருவதோடு அரசவை மற்றும் சமயப் பொருள்களுக்கு இடையிலான மூலமொழியின் திறந்த தன்மையையும் காக்கிறது.
