base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/010.yaml
  text: Listen[a], daughter, and see; incline your ear, and forget your people and your father's house.
translation:
  language: ta
  text: மகளே, கேள்[a], பார்; உன் செவியைச் சாய்த்துக் கவனி; உன் மக்களையும் உன் தந்தையின் வீட்டையும் மறந்துவிடு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செவிகொடு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי
  choice: கேள்
  rationale: שׁמע என்பதன் பெண்பால் ஒருமை கட்டளை வடிவம். “கேள்” என்பது கவனத்துடன் செவிகொடுக்கும் அழைப்பை இயல்பான நவீனத் தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: בַת
  choice: மகளே
  rationale: பெண் முகவரியை நேரடியாக அழைக்கும் விளிவேற்றுமையை “மகளே” இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּרְאִי
  choice: பார்
  rationale: ראה என்பதன் பெண்பால் ஒருமை கட்டளை வடிவம். “பார்” என்பது நேரடியான பொருளையும் கட்டளையின் சுருக்கமான வலிமையையும் காக்கிறது.
- source_word: וְהַטִּי אָזְנֵךְ
  choice: உன் செவியைச் சாய்
  rationale: செவியை வளைத்துச் செலுத்துதல் என்ற எபிரெய உருவகத்தைத் தமிழில் புரியக்கூடிய வகையில் காக்கிறது; வெறுமனே “கவனி” என்று பொருளுரைத்து உருவகத்தை நீக்கவில்லை.
- source_word: וְשִׁכְחִי
  choice: மறந்துவிடு
  rationale: שׁכח என்பதன் கட்டளைப் பொருளை நேரடியாகக் காக்கிறது. “விட்டுவிடு” என்று மென்மைப்படுத்தாமல், தீர்மானமான உறவு மறுநோக்கின் வலிமையை வெளிப்படுத்துகிறது.
- source_word: עַמֵּךְ
  choice: உன் மக்கள்
  rationale: עם இங்கு அவளுடைய இன அல்லது சமூக மக்களைக் குறிக்கிறது. “உன் மக்கள்” என்பது நேரடியும் இயல்புமான இணை.
- source_word: וּבֵית אָבִיךְ
  choice: உன் தந்தையின் வீடு
  rationale: குடும்பம், தந்தைவழிக் குடும்ப இல்லம், அல்லது பிறந்த வீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரை “தந்தையின் வீடு” என்ற வடிவில் காக்கிறது.
theological_decisions:
- issue: மணப்பெண்ணுக்கு வழங்கப்படும் அறிவுரையின் வலிமை
  choice: தன் பிறந்த குடும்பம் மற்றும் மக்களிடமிருந்த முதன்மைச் சார்பை அரச திருமணத்தின் புதிய உறவுக்கு மாற்றுமாறு மணப்பெண்ணுக்கு வழங்கப்படும் நேரடி அறிவுரை.
  alternative: குடும்பச் சார்பு மாற்றத்தை வலியுறுத்தாத, கவனத்திற்கான பொதுவான ஞான அறிவுரை.
  rationale: கட்டளைகளின் தொடர் “உன் மக்களையும் உன் தந்தையின் வீட்டையும் மறந்துவிடு” என்பதில் உச்சம் பெறுவதால், சங்கீதத்தின் திருமணச் சூழலில் தீர்மானமான உறவு மறுநோக்கை இயல்பாகக் குறிக்கிறது. பின்னாளைய கோட்பாட்டுக் கருத்துகளைச் சேர்க்காமல் அந்த வலிமை காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் சாதாரண வாசகர்களுக்குப் புரியும் எளிமையுடனும் வடிவமைக்கப்பட்டது. தொடர்ச்சியான பெண்பால் ஒருமைக் கட்டளைகளின் நேரடித்தன்மை காக்கப்பட்டுள்ளது; “செவியைச் சாய்” என்ற உருவகம் மூலத்தின் கவித்துவத்தைப் பாதுகாக்கிறது.
