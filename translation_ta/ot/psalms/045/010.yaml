review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the four feminine-singular imperatives and the direct address: hear/listen, see, incline the ear, and forget. It also preserves ‘your people’ and ‘your father’s house’ without interpretive expansion. However, ‘உன் செவியைச் சாய்’ is not fully idiomatic as a finite Tamil imperative for the Hebrew ear-inclining idiom; it can sound as though the ear itself is being made to lean, without clearly conveying attentive listening.'
  naturalness: ‘மகளே, கேள், பார்’ is natural, direct, and suitably elevated. Recasting the ear idiom as ‘உன் செவியைச் சாய்த்துக் கவனி’ makes the figurative command intelligible and natural in modern standard Tamil while retaining its physical imagery. The semicolon cleanly separates the preparatory calls from the decisive final command.
  terminology: ‘மகளே,’ ‘உன் மக்கள்,’ and ‘உன் தந்தையின் வீடு’ are appropriate. ‘தந்தையின் வீடு’ usefully preserves the Hebrew household idiom without prematurely narrowing it to only a physical house or paraphrasing it as natal family. ‘மறந்துவிடு’ correctly retains the unsoftened imperative force.
  issues:
  - severity: medium
    issue: The phrase ‘உன் செவியைச் சாய்’ is syntactically and idiomatically strained in modern Tamil.
    rationale: The Hebrew idiom literally commands the hearer to incline her ear, meaning to attend carefully. Tamil normally requires a completing verbal expression to make ‘சாய்த்து’ convey this sense naturally. ‘உன் செவியைச் சாய்த்துக் கவனி’ retains the image and explicitly communicates the idiomatic force without altering the command’s meaning.
  revised_text: மகளே, கேள்[a], பார்; உன் செவியைச் சாய்த்துக் கவனி; உன் மக்களையும் உன் தந்தையின் வீட்டையும் மறந்துவிடு.
  revised_footnotes:
  - marker: a
    text: அல்லது, “செவிகொடு.”
    reason: lexical_alternative
