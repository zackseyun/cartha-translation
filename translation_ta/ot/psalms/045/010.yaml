- from: மகளே, கேள்[a], பார்; உன் செவியைச் சாய்; உன் மக்களையும் உன் தந்தையின் வீட்டையும் மறந்துவிடு.
  to: மகளே, கேள்[a], பார்; உன் செவியைச் சாய்த்துக் கவனி; உன் மக்களையும் உன் தந்தையின் வீட்டையும் மறந்துவிடு.
  rationale: A limited idiomatic revision resolves the awkward Tamil rendering of the Hebrew expression ‘incline your ear.’ The revised wording keeps the sequence and force of the source imperatives, maintains the bridal address and familial language, and does not add theological or historical interpretation. The existing lexical-alternative footnote remains correctly anchored to ‘கேள்.’
