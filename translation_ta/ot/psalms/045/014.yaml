  choice: பூவேலைப்பாடுள்ள ஆடைகளில்
  rationale: רְקָמוֹת என்பது வண்ண நூல்களால் செய்யப்பட்ட பூவேலைப்பாடு அல்லது அலங்கார நெசவைக் குறிக்கிறது. திருமண ஊர்வலச் சூழலைத் தெளிவாக்க ‘ஆடைகள்’ என்பது பொருளிலிருந்து இயல்பாக நிரப்பப்பட்டுள்ளது.
- source_word: תּוּבַל
  choice: அழைத்துச் செல்லப்படுகிறாள்
  rationale: יבל என்பதன் ஹோஃபால் வடிவம் ‘கொண்டுசெல்லப்படுதல்/வழிநடத்தப்படுதல்’ என்ற செயப்பாட்டு பொருளைக் கொண்டது. இங்குள்ள சடங்குமிக்க ஊர்வல அசைவை ‘அழைத்துச் செல்லப்படுகிறாள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַמֶּלֶךְ
