  rationale: רֵעוֹתֶיהָ என்பது அவளுடன் உறவுடைய தோழிகள் அல்லது நண்பிகளைக் குறிக்கிறது; ‘தோழிகள்’ அவர்களுடைய குறிப்பிட்ட சடங்குப் பொறுப்பை தேவையின்றி சேர்ப்பதில்லை.
- source_word: מוּבָאוֹת
  choice: அழைத்து வரப்படுகிறார்கள்
  rationale: בוא என்பதன் ஹோஃபால் பெண்பால் பன்மைப் பங்கேற்பு வடிவத்தின் செயப்பாட்டு பொருளையும், தோழிகள் அவளிடம் அழைத்து வரப்படும் நகர்வையும் இது தக்கவைக்கிறது.
- source_word: לָךְ
  choice: உன்னிடம்
  rationale: இது இரண்டாம் நபர் பெண்பால் ஒருமை வடிவம். தமிழில் பால்வேறுபாடு வெளிப்படாவிட்டாலும், ‘உன்னிடம்’ என்பது மணப்பெண்ணை நேரடியாகச் சுட்டும் ஒருமை முன்னிலை மாற்றத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: לָךְ என்பதில் வரும் இறுதி முன்னிலை மாற்றம்
  choice: மணப்பெண்ணை நோக்கிய இரண்டாம் நபர் ஒருமையாக ‘உன்னிடம்’ என்று தக்கவைத்தல்
  alternative: ‘அரசனிடம்/அவரிடம்’ என்று அரசனைக் குறிப்பதாக மாற்றுதல், அல்லது ‘அவளுடன்’ என்று சீராக்குதல்
  rationale: மசோரா உரை இரண்டாம் நபர் பெண்பால் ஒருமையைக் கொண்டிருப்பதால், மணப்பெண்ணைப் பற்றிய மூன்றாம் நபர் வர்ணனையிலிருந்து அவளை நேரடியாக அழைக்கும் நிலைக்கு கவிதை திடீரென மாறுகிறது. உரையின் இந்த இயல்பான பதற்றத்தைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்தையும் திருமண ஊர்வலத்தின் இயக்கத்தையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘அழைத்துச் செல்லப்படுகிறாள்/அழைத்து வரப்படுகிறார்கள்’ என்ற செயப்பாட்டு வடிவங்கள் எபிரெயச் செயப்பாட்டு வினைகளைத் தக்கவைக்கின்றன; இறுதி இரண்டாம் நபர் மாற்றம் சீராக்கப்படவில்லை.
