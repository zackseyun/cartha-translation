  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
translation:
  language: ta
  text: எம்பிராய்டரி வேலைப்பாடுள்ள ஆடைகளில்[a] அவள் அரசனிடம் அழைத்துச் செல்லப்படுகிறாள்; அவளைத் தொடர்ந்து வரும் அவளுடைய தோழிகளாகிய கன்னிப்பெண்கள் உன்னிடம்[c] கொண்டு வரப்படுகின்றனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எம்பிராய்டரி வேலைப்பாட்டுடன் அவள் அரசனிடம் கொண்டுவரப்படுகிறாள்.” எபிரெயச் சொல் எம்பிராய்டரி அல்லது அலங்காரத் தையல்வேலைப்பாட்டைக் குறிக்கிறது; ‘ஆடைகள்’ என்பது சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: c
    text: “உன்னிடம்” என்பதற்கான எபிரெய வடிவம் பெண்பால் ஒருமை; ஆகவே வரி இங்கே மணப்பெண்ணை நேரடியாக அழைப்பதாக மாறுகிறது. சில மொழிபெயர்ப்புகள் இதை அரசனைக் குறிப்பதாகவோ “அவளுடன்” என்றோ சீராக்குகின்றன.
    reason: alternative_reading
