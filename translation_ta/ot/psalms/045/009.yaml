  text: בְּנ֣וֹת מְ֭לָכִים בְּ/יִקְּרוֹתֶ֑י/ךָ נִצְּבָ֥ה שֵׁגַ֥ל לִֽ֝/ימִינְ/ךָ֗ בְּ/כֶ֣תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b][a]; at your right hand stands the queen in gold of Ophir.
translation:
  language: ta
  text: அரசர்களின் மகள்கள் உன் மதிப்புக்குரிய பெண்களிடையே இருக்கிறார்கள்[a]; ஓபீரின் பசும்பொன் அணிந்த அரசி உன் வலப்பக்கத்தில் நிற்கிறாள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன் மதிப்புக்குரியவர்களிடையே’ அல்லது ‘உன் உயர்குடிப் பெண்களிடையே’ என்றும் மொழிபெயர்க்கலாம்; மூல எபிரெயச் சொற்றொடர் பொருள் தெளிவற்றது.
    reason: lexical_alternative
  - marker: b
    text: ‘ஓபீரின் பசும்பொன்’ என்பது செல்வத்திற்கும் உயர்தரத் தங்கத்திற்கும் புகழ்பெற்ற ஓபீர் என்னும் இடத்துடன் தொடர்புடைய பொன்னைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹת מְלָכִים
  choice: அரசர்களின் மகள்கள்
  rationale: எபிரெயச் சொற்றொடரின் உருவகத்தையும் அரசவைக் காட்சியையும் வெளிப்படையாகப் பாதுகாக்கிறது; ‘இளவரசிகள்’ என்பதும் சாத்தியம், ஆனால் அது மூலத்தின் வடிவத்தைச் சுருக்கிவிடும்.
- source_word: בְּיִקְּרוֹתֶיךָ
  choice: உன் மதிப்புக்குரிய பெண்களிடையே
  rationale: சிக்கலான இவ்வடிவம் יקר (‘விலையேறப்பெற்ற, மதிப்புக்குரிய’) என்பதிலிருந்து வந்ததாகவும், சூழலில் அரசனைச் சேர்ந்த சிறப்புக்குரிய பெண்களைக் குறிப்பதாகவும் புரிந்துகொள்ளப்படுகிறது. தெளிவின்மையை அடிக்குறிப்பு பதிவு செய்கிறது.
- source_word: נִצְּבָה
  choice: நிற்கிறாள்
  rationale: கவிதைக் காட்சியில் நிலைகொண்டு நிற்பதைக் குறிக்கும் இயல்பான நிகழ்காலத் தமிழ் வடிவம்.
- source_word: שֵׁגַל
  choice: அரசி
  rationale: அரசனின் துணைவியான அரசியைக் குறிக்கும் சொல்; நவீன தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: לִימִינְךָ
  choice: உன் வலப்பக்கத்தில்
  rationale: மூலத்திலுள்ள இடத்தையும் மரியாதைக்குரிய நிலையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: ஓபீரின் பசும்பொன் அணிந்த
  rationale: כֶּתֶם உயர்தரமான தூய பொன்னைக் குறிக்கிறது; בְּ முன்னொட்டு இங்கு ஆடை அல்லது அணிகலனால் அலங்கரிக்கப்பட்டிருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
