  yaml_path: translation/ot/psalms/045/006.yaml
  text: Your throne[a], O God, is forever and ever[b]; the scepter of your kingdom is a scepter of uprightness.
translation:
  language: ta
  text: உமது அரியணை[a], தேவனே, என்றென்றைக்கும் நிலைத்திருக்கும்; உமது அரசாட்சியின் செங்கோல் நேர்மையின் செங்கோலாகும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது அரியணை தேவன்; அவர் என்றென்றைக்கும் இருக்கிறார்,’ அல்லது, ‘உமது தெய்வீக அரியணை என்றென்றைக்கும் நிலைத்திருக்கும்.’ எபிரெய தொடரமைப்பு குறித்து கருத்துவேறுபாடு உள்ளது; முதன்மை உரை אֱלֹהִים என்பதை ‘தேவனே’ என்ற நேரடி விளிப்பாகக் கொள்கிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெய சொல்வரிசையை நெருக்கமாகப் பின்பற்றி, ‘நேர்மையின் செங்கோலே உமது அரசாட்சியின் செங்கோல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_rendering
lexical_decisions:
- source_word: כִּסְאֲךָ
  choice: உமது அரியணை
  rationale: כִּסֵּא என்பது அரசர் அமரும் ஆட்சியாசனத்தைக் குறிக்கிறது. அரச சங்கீதமான இச்சூழலில் ‘அரியணை’ இயல்பாகவும் துல்லியமாகவும் பொருந்துகிறது.
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: இதை நேரடி அழைப்பாகக் கொள்வது எபிரெய தொடரமைப்புக்கும் சங்கீதத்தின் நேரடி விளிப்பு நடைக்கும் இயல்பாகப் பொருந்துகிறது. வேறு தொடரமைப்பு வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: עוֹלָם וָעֶד
  choice: என்றென்றைக்கும்
  rationale: இந்த எபிரெய சொற்றொடர் முடிவில்லாத நிலைத்திருப்பை வலியுறுத்துகிறது; ‘என்றென்றைக்கும்’ அதன் கவித்துவ வலிமையை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: שֵׁבֶט
  choice: செங்கோல்
  rationale: அரசாட்சிச் சூழலில் שֵׁבֶט பொதுவான கோலை அல்ல, ஆட்சியதிகாரத்தைக் குறிக்கும் அரச செங்கோலைக் குறிக்கிறது.
- source_word: מִישֹׁר
  choice: நேர்மை
  rationale: מִישֹׁר என்பதன் அடிப்படை எண்ணம் நேரான தன்மை; இங்கு அது அறநெறிசார் நேர்மையைக் குறிக்கிறது. ‘நேர்மை’ சட்டநீதியென்ற பொருளுக்கு மட்டும் இதைக் குறுக்காமல் அதன் பரந்த அறநெறிப் பொருளைக் காக்கிறது.
- source_word: שֵׁבֶט מַלְכוּתֶךָ
  choice: உமது அரசாட்சியின் செங்கோல்
  rationale: இந்த மொழிபெயர்ப்பு எபிரெய கட்டிணை உறவைப் பாதுகாத்து, மַלְכוּת என்பதை இச்சூழலில் ‘அரசாட்சி’ என இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: முதல் அடியில் אֱלֹהִים என்பதன் தொடரமைப்பும் இறையியல் வலிமையும்
  choice: 'நேரடி விளிப்பு: ‘உமது அரியணை, தேவனே, என்றென்றைக்கும் நிலைத்திருக்கும்’'
  alternative: ‘உமது அரியணை என்றென்றைக்கும் தேவன்’ அல்லது ‘உமது தெய்வீக அரியணை என்றென்றைக்கும் நிலைத்திருக்கும்’
  rationale: எபிரெய தொடரமைப்பு விவாதிக்கப்பட்டாலும், אֱלֹהִים என்பதை விளிப்பாகக் கொள்வது சூழலில் இயல்பான வாசிப்பாகவும் பழமையான ஏற்புடனும் ஒத்திருக்கிறது. மாற்று வாசிப்புகளை நீக்கிவிடாமல் அடிக்குறிப்பில் தருவது வசனத்தின் உண்மையான இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகப் புரியும், அதேவேளையில் சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. ‘அரியணை,’ ‘செங்கோல்,’ ‘அரசாட்சி’ ஆகியவை அரசச் சூழலைத் தெளிவாக வைத்திருக்கின்றன; எபிரெயின் விவாதத்திற்குரிய தொடரமைப்பு முதன்மை உரையில் ஒரே வாசிப்பாக வழங்கப்பட்டாலும் மாற்றுகள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
