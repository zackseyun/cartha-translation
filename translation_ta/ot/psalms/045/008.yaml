base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/008.yaml
  text: All your garments are fragrant with myrrh[a], aloes, and cassia; from ivory palaces[e][d][c][b], stringed instruments have made you glad.
translation:
  language: ta
  text: வெள்ளைப்போளம், அகில்[a], காசியா நறுமணப்பட்டை[d] ஆகியவற்றின் நறுமணம் உமது ஆடைகள் அனைத்திலும் வீசுகிறது; தந்தம் பதித்த அரண்மனைகளிலிருந்து[b] நரம்பிசைக் கருவிகள் உம்மை மகிழ்வித்தன.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அகில்” என்பது நறுமணம் தரும் மரத்தையோ அதன் கட்டையையோ குறிக்கிறது; சோற்றுக்கற்றாழைச் செடியை அல்ல.
    reason: lexical_clarification
  - marker: b
    text: “தந்த அரண்மனைகளிலிருந்து” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள “இலிருந்து” என்பதன் துல்லியமான நுணுக்கம் விவாதத்திற்குரியது; “தந்த அரண்மனைகளுக்கு வெளியே இருந்து” அல்லது “தந்த அரண்மனைகளால்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: c
    text: “உம்மை மகிழ்வித்தன” என்பதற்கான எழுவாய் எபிரெயத்தில் கூறப்படவில்லை. “இசை,” “இசைக் கலைஞர்கள்,” அல்லது மரபாக “நரம்பிசைக் கருவிகள்” என்று புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: d
    text: “காசியா” என்பது இலவங்கப்பட்டையோடு தொடர்புடைய, ஆனால் அதிலிருந்து வேறுபட்ட நறுமணப் பட்டையாகும்.
    reason: lexical_clarification
lexical_decisions:
- source_word: מֹר
  choice: வெள்ளைப்போளம்
  rationale: நறுமணப் பிசினைக் குறிக்கும் வழக்கமான, துல்லியமான தமிழ் வேதாகமச் சொல்.
- source_word: וַאֲהָלוֹת
  choice: அகில்
  rationale: இங்கு குறிப்பிடப்படுவது நவீன சோற்றுக்கற்றாழைச் செடி அல்ல; நறுமணம் தரும் அகில் மரம் அல்லது அதன் கட்டை.
- source_word: קְצִיעוֹת
  choice: இலவங்கப்பட்டை
  rationale: நறுமணம் தரும் காசியா மரப்பட்டையைக் குறிக்கிறது; பொதுவான வாசகருக்குப் புரியும் சொல்லாக இது தேர்ந்தெடுக்கப்பட்டது.
- source_word: כָּל בִּגְדֹתֶיךָ
  choice: உமது ஆடைகள் அனைத்திலும் ... நறுமணம் வீசுகிறது
  rationale: எபிரெய வாக்கியம் வினைச்சொல் இன்றி நறுமணப் பொருட்களையும் ஆடைகளையும் அடுத்தடுத்து வைக்கிறது. ஆடைகள் அந்த நறுமணங்களைக் கொண்டுள்ளன என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִן הֵיכְלֵי שֵׁן
  choice: தந்தத்தால் அலங்கரிக்கப்பட்ட அரண்மனைகளிலிருந்து
  rationale: அரசத் திருமணச் சூழலில் הֵיכָל என்பதற்கு ‘அரண்மனை’ பொருத்தமானது; שֵׁן என்பது இங்கு தந்தத்தைக் குறிக்கிறது. அரண்மனைகள் முழுவதும் தந்தத்தால் செய்யப்பட்டவை என்று தவறாகப் புரியாதபடி ‘அலங்கரிக்கப்பட்ட’ என்பது பொருள்விளக்கமாக வழங்கப்பட்டது.
- source_word: שִׂמְּחוּךָ
  choice: உம்மை மகிழ்வித்துள்ளது
  rationale: பீயேல் நிறைவினை வடிவத்தின் காரணவினைப் பொருளான ‘உம்மை மகிழச் செய்தன’ என்பதை இயல்பான தமிழில் தருகிறது.
- source_word: implicit subject of שִׂמְּחוּךָ
  choice: எழும் இசை
  rationale: எபிரெயத்தில் பன்மை எழுவாய் வெளிப்படையாக இல்லை. அரசவைக் கொண்டாட்டச் சூழலில் இசை அல்லது இசைக்கருவிகள் என்று புரிந்துகொள்வது சாத்தியம்; நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: சங்கீதம் 45-இன் அரச/மேசியா சார்ந்த வாசிப்பு
  choice: இவ்வசனத்தை அதன் உடனடி அரசத் திருமணச் சூழலில் மொழிபெயர்த்தல்
  alternative: பிற்காலத் திருமறைப் பயன்பாட்டை அடிப்படையாகக் கொண்டு வெளிப்படையான மேசியா சார்ந்த மொழியைச் சேர்த்தல்
  rationale: இவ்வசனம் அரசரின் ஆடைகள், அரண்மனைகள், கொண்டாட்ட மகிழ்ச்சி ஆகியவற்றையே நேரடியாக விவரிக்கிறது. மேசியா சார்ந்த அல்லது முன்நிழல் வாசிப்பு சாத்தியமானாலும், எபிரெய மூலத்தில் இல்லாத அந்த அடுக்கை மொழிபெயர்ப்பில் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் அரசவைக் கண்ணியமும் காக்கப்பட்டுள்ளன. அரசரை நேரடியாக விளிக்கும் இடத்தில் மரியாதை ஒருமை ‘உமது/உம்மை’ பயன்படுத்தப்பட்டுள்ளது. அரிதான நறுமணப் பொருட்களுக்கு பொதுவாகப் புரியும் சொற்கள் தேர்ந்தெடுக்கப்பட்டு, தேவையான விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
