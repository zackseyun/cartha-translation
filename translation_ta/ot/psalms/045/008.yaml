- from: வெள்ளைப்போளம், அகில்[a], இலவங்கப்பட்டை ஆகியவற்றின் நறுமணம் உமது ஆடைகள் அனைத்திலும் வீசுகிறது; தந்தத்தால் அலங்கரிக்கப்பட்ட அரண்மனைகளிலிருந்து[b] எழும் இசை உம்மை மகிழ்வித்துள்ளது.[c]
  to: வெள்ளைப்போளம், அகில்[a], காசியா நறுமணப்பட்டை[d] ஆகியவற்றின் நறுமணம் உமது ஆடைகள் அனைத்திலும் வீசுகிறது; தந்தம் பதித்த அரண்மனைகளிலிருந்து[b] நரம்பிசைக் கருவிகள் உம்மை மகிழ்வித்தன.[c]
