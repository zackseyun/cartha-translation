  yaml_path: translation/ot/psalms/045/015.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
translation:
  language: ta
  text: மகிழ்ச்சியோடும் களிப்போடும் அவர்கள் அழைத்துச் செல்லப்படுவார்கள்; அவர்கள் அரசனின் அரண்மனைக்குள் நுழைவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அரண்மனை” என்பதற்கான எபிரெயச் சொல் “மண்டபம்” என்றும், வேறு சூழல்களில் “ஆலயம்” என்றும் பொருள்படலாம்; இங்கு அரச திருமணச் சூழலுக்கு “அரண்மனை” பொருத்தமானது.
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  choice: அவர்கள் அழைத்துச் செல்லப்படுவார்கள்
  rationale: יבל என்பதன் ஹொஃபால் வடிவம் ‘அழைத்துச் செல்லப்படுதல்’ அல்லது ‘கொண்டுவரப்படுதல்’ என்ற செயப்பாட்டு causative பொருளைக் கொண்டது. திருமண ஊர்வலச் சூழலையும் செயப்பாட்டு வடிவையும் இத்தேர்வு இயல்பாகக் காக்கிறது.
- source_word: בִּשְׂמָחֹת
  choice: மகிழ்ச்சியோடும்
  rationale: ב முன்னிடைச்சொல்லுடன் வரும் பன்மைச் சொல், இங்கு உடனிகழ்ச்சி அல்லது நிகழும் விதத்தைக் குறிக்கிறது. எபிரெயப் பன்மையைச் செயற்கையாகப் பிரதியெடுக்காமல் கொண்டாட்ட உணர்வை இயல்பான தமிழில் தருகிறது.
- source_word: וָגִיל
  choice: களிப்போடும்
  rationale: גיל மிகுந்த, வெளிப்படும் மகிழ்ச்சியைக் குறிக்கிறது. ‘களிப்பு’ முந்தைய ‘மகிழ்ச்சி’ என்பதிலிருந்து சொற்பொருள் வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: תְּבֹאֶינָה
  choice: அவர்கள் நுழைவார்கள்
  rationale: בוא பொதுவாக ‘வருதல்’ எனினும், இங்கு ஒரு கட்டிடத்தை நோக்கிய இயக்கத்தின் முடிவைக் குறிப்பதால் ‘நுழைவார்கள்’ துல்லியமும் இயல்பும் உடையது.
- source_word: בְּהֵיכַל
  choice: அரண்மனைக்குள்
  rationale: הֵיכָל என்பதற்கு அரண்மனை, மண்டபம், ஆலயம் ஆகிய பொருள்கள் உண்டு. சங்கீதத்தின் அரச திருமணச் சூழலில் ‘அரண்மனை’ சிறப்பாகப் பொருந்துகிறது; ב இங்கு உள்ளே நுழைதலைக் குறிக்கிறது.
- source_word: מֶלֶךְ
  choice: அரசனின்
  rationale: எபிரெயத்தில் சுட்டு உருபு இல்லாவிட்டாலும், சூழலில் குறிப்பிட்ட அரசனையே குறிக்கும் இணைப்புநிலைத் தொடர் என்பதால் ‘அரசனின்’ என்பது இயல்பான தமிழ்.
theological_decisions:
- issue: பெண்பால் பன்மை வினைச்சொற்களின் சுட்டுப்பொருள்
  choice: சுட்டுப்பொருளை மேலதிகமாகக் குறிப்பாக்காமல் ‘அவர்கள்’ என்று மொழிபெயர்த்தல்
  alternative: முந்தைய வசனத்தின் அடிப்படையில் மணப்பெண்ணுடன் வரும் கன்னியர் அல்லது மணப்பெண் குழுவினர் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: תּוּבַלְנָה, תְּבֹאֶינָה இரண்டும் பெண்பால் பன்மை வடிவங்கள்; முந்தைய சூழல் மணப்பெண்ணுடன் வரும் பெண்களைக் காட்டுகிறது. ஆயினும் இவ்வசனம் அவர்களைப் பெயரிட்டு அடையாளப்படுத்தாததால், தமிழ் உரையும் தேவையற்ற விளக்கத்தைச் சேர்க்காமல் ‘அவர்கள்’ என வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அழைத்துச் செல்லப்படுவார்கள்’ என்ற செயப்பாட்டு அமைப்பு மூலத்தின் இலக்கணத்தையும் ஊர்வல நுணுக்கத்தையும் காக்கிறது. இரு மகிழ்ச்சிச் சொற்களும் ‘மகிழ்ச்சி/களிப்பு’ என வேறுபடுத்தப்பட்டுள்ளன.
