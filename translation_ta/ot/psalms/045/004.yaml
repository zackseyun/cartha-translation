  text: וַ/הֲדָ֬רְ/ךָ֨ צְלַ֬ח רְכַ֗ב עַֽל דְּבַר אֱ֭מֶת וְ/עַנְוָה צֶ֑דֶק וְ/תוֹרְ/ךָ֖ נוֹרָא֣וֹת יְמִינֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/004.yaml
  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[b][a]; let your right hand teach you awesome deeds.
translation:
  language: ta
  text: உமது மாட்சிமையில் வெற்றியுடன் சவாரி செய்து முன்னேறுவீராக; உண்மை, பணிவு, நீதி ஆகியவற்றிற்காக[a]. உமது வலக்கை உமக்குப் பிரமிப்பூட்டும் செயல்களைக் கற்பிக்கட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மை மற்றும் பணிவான நீதிக்காக.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உமது வலக்கை உமக்கு அச்சமூட்டும் காரியங்களைக் கற்பிக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲדָרְךָ
  choice: உமது மாட்சிமையில்
  rationale: הָדָר என்பது மாட்சிமை, மகிமை, மேன்மை ஆகிய பொருள்களைத் தருகிறது. தொடர்ந்துவரும் ஏவல்களோடு இயல்பாக இணைவதற்காக முன்னொட்டு வாவ் தனியே ‘மற்றும்’ என்று மொழிபெயர்க்கப்படவில்லை.
- source_word: צְלַח רְכַב
  choice: வெற்றியுடன் பவனிவாரும்
  rationale: צלח வெற்றிபெறுதல் அல்லது வெற்றிகரமாக முன்னேறுதல் என்றும், רכב சவாரிசெய்தல் என்றும் பொருள்படும். அரச போர்வீரனின் கம்பீரமான முன்னேற்றத்தை ‘பவனிவாரும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל דְּבַר אֱמֶת
  choice: சத்தியத்தின் பொருட்டு
  rationale: דְּבַר இங்கு சொல் என்பதைக் காட்டிலும் காரியம் அல்லது நோக்கம் எனப் பொருள்படுகிறது; עַל உடன் சேர்ந்து சத்தியத்தின் சார்பாகச் செயல்படுவதை உணர்த்துகிறது.
- source_word: וְעַנְוָה צֶדֶק
  choice: பணிவு, நீதி
  rationale: עַנְוָה மற்றும் צֶדֶק ஆகிய இரு தனிப்பட்ட சொற்களையும் ஒருங்கிணைந்த வரிசையாகக் காட்டுகிறது; எபிரெயச் சொற்றொடரின் சுருக்கத்தையும் பொருள் தெளிவையும் இயன்றவரை காக்கிறது.
- source_word: וְתוֹרְךָ
  choice: உமக்குக் கற்பிக்கட்டும்
  rationale: ירה என்பதன் ஹிஃபில் வடிவம் கற்பித்தல், அறிவுறுத்துதல், காட்டுதல் எனப் பொருள்படும். பெண்பால் எழுவாயான ‘உமது வலக்கை’ என்பதோடு பொருந்தும் வகையில் விருப்ப ஏவலாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: נוֹרָאוֹת
  choice: அச்சமூட்டும் செயல்கள்
  rationale: ירא வேரிலிருந்து வரும் இச்சொல் அச்சம் அல்லது பிரமிப்பு உண்டாக்கும் காரியங்களைக் குறிக்கிறது. சூழலில் செயல்கள் என்பது இயல்பான நிறைவை அளிக்கிறது.
- source_word: יְמִינֶךָ
  choice: உமது வலக்கை
  rationale: வல்லமை, திறமை, வெற்றிகரமான செயல் ஆகியவற்றைக் குறிக்கும் அரச-போர்வீர உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: பிற்காலத்தில் மேசியாவைச் சார்ந்து வாசிக்கப்பட்ட சங்கீதத்திலுள்ள அரச-போர்வீர உருவகம்
  choice: உடனடி இலக்கியச் சூழலில் அரசனை நோக்கிய உரையைப் பாதுகாத்தல்
  alternative: மேசியாவைக் குறிக்கும் பொருளை மொழிபெயர்ப்பிலேயே வெளிப்படையாக முன்னிறுத்துதல்
  rationale: வசனம் அரசனை நேரடியாக நோக்கி அரச மற்றும் போர்வீரக் கவிமொழியில் பேசுகிறது. பின்னைய இறையியல் பயன்பாட்டைத் தடுக்காமலும், அதை மூலவார்த்தைகளுக்குள் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
- issue: וְעַנְוָה צֶדֶק என்பதன் தொடர்பு
  choice: ‘பணிவு, நீதி’ என்று இணை வரிசையாக மொழிபெயர்த்தல்
  alternative: ‘பணிவான நீதி’ அல்லது ‘நீதியின் பணிவு’
  rationale: எபிரெயம் சுருக்கமாகவும் தொடரியல் ரீதியாகத் தெளிவற்றதாகவும் உள்ளது. இரு கருத்துகளையும் தனித்தனியாக நிறுத்துவது அவற்றை ஒன்றுக்குள் ஒன்று கட்டாயமாகச் சேர்த்து விளக்குவதைத் தவிர்க்கிறது.
- issue: וְתוֹרְךָ என்பதன் வினைநிலை
  choice: ‘கற்பிக்கட்டும்’ என்ற விருப்ப ஏவல்
  alternative: ‘கற்பிக்கும்’ என்ற எதிர்காலக் கூற்று
  rationale: வடிவம் இயல்பாக ‘அது உமக்குக் கற்பிக்கும்’ என்றும் வாசிக்கப்படலாம். கவிதையிலுள்ள ஏவல் தொடரோடு ‘கற்பிக்கட்டும்’ பொருந்தினாலும், மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. அரசனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘உமக்கு’, ‘பவனிவாரும்’ பயன்படுத்தப்பட்டுள்ளன; அளவுக்கு மீறிய பழந்தமிழ் நடையும் சமயப் பிரிவுசார் சொற்களும் தவிர்க்கப்பட்டுள்ளன.
