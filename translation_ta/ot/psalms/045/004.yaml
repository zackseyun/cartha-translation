revisions:
- from: உமது மாட்சிமையில், சத்தியம், பணிவு, நீதி ஆகியவற்றின் பொருட்டு வெற்றியுடன் பவனிவாரும்; உமது வலக்கை அச்சமூட்டும் செயல்களை உமக்குக் கற்பிக்கட்டும்.[a]
  to: உமது மாட்சிமையில் வெற்றியுடன் சவாரி செய்து முன்னேறுவீராக; உண்மை, பணிவு, நீதி ஆகியவற்றிற்காக[a]. உமது வலக்கை உமக்குப் பிரமிப்பூட்டும் செயல்களைக் கற்பிக்கட்டும்[b].
  rationale: 'The revision explicitly translates the riding imperative while retaining victorious advance. It uses a modern, dignified Tamil equivalent for awe-inspiring deeds, keeps the optative rendering in the main line, and adds both source-supported alternatives: the compressed “humble righteousness” reading and the future/fearsome-things reading.'
  reviewer_model: gpt-5.6-terra
