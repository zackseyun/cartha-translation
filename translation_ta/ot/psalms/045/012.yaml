base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/012.yaml
  text: And the daughter of Tyre will come with a gift[b][a]; the rich among the people will seek your favor.
translation:
  language: ta
  text: தீரின் மகளும் பரிசுடன்[a] வருவாள்; மக்களிடையே உள்ள செல்வந்தர்கள் உன் தயவை[b] நாடுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காணிக்கையுடன்’ அல்லது ‘திறை கொண்டுவந்து’ என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் சூழலுக்கேற்ப பரிசு, காணிக்கை அல்லது திறை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
