    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת צֹר
  choice: தீரின் மகளும்
  rationale: וּ தொடர்ச்சியையும் சேர்த்தலையும் குறிக்கிறது; ஒரு நகரத்தையோ அதன் மக்களையோ பெண்ணாக உருவகிக்கும் எபிரேய வழக்கை ‘தீரின் மகள்’ என்று பாதுகாக்கிறது.
- source_word: בְּמִנְחָה
  choice: பரிசுடன்
  rationale: מִנְחָה என்பதற்கு பரிசு, காணிக்கை, திறை ஆகிய பொருள்கள் உண்டு. அரசவைச் சூழலில் ‘பரிசு’ இயல்பாகப் பொருந்துகிறது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: פָּנַיִךְ יְחַלּוּ
  choice: உன் தயவை நாடுவார்கள்
  rationale: சொல்லுக்குச் சொல் ‘உன் முகத்தை வேண்டுவார்கள்’ என்றாலும், இச்சொற்றொடர் ஒருவரின் தயவை நாடுதல் அல்லது அவரிடம் மன்றாடுதல் என்ற பொருளுடைய எபிரேய மரபுத்தொடர். இரண்டாம் நபர் பெண்பால் ஒருமை தமிழில் இயல்பான ‘உன்’ மூலம் தொடர்கிறது.
- source_word: עֲשִׁירֵי עָם
  choice: மக்களிடையே உள்ள செல்வந்தர்கள்
  rationale: ஒரு மக்கள்கூட்டத்தில் உள்ள செல்வமிக்கவர்களை இக்கட்டமைப்பு குறிக்கிறது. ‘மக்களிடையே உள்ள’ என்பது குறிப்பிட்ட இனத்தைத் தேவையின்றி ஊகிக்காமல் இயல்பான தமிழை அளிக்கிறது.
