translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘தீரின் மகள்’ என்ற நகர-பெண் உருவகம் பாதுகாக்கப்பட்டுள்ளது. முதல் அரையடியில் வெளிப்படையான வினை இல்லாத எபிரேயச் செய்யுள் அமைப்பை இயல்பான தமிழாக்கத்திற்காக ‘வருவாள்’ என நிறைவு செய்துள்ளது.
