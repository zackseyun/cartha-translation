source:
  edition: WLC
  text: חִצֶּ֗י/ךָ שְׁנ֫וּנִ֥ים עַ֭מִּים תַּחְתֶּ֣י/ךָ יִפְּל֑וּ בְּ֝/לֵ֗ב אוֹיְבֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/005.yaml
  text: Your arrows are sharp[a]; peoples fall beneath you; they are in the heart of the king’s enemies.
translation:
  language: ta
  text: உமது அம்புகள் கூர்மையானவை[a]; மக்கள் உமக்குக் கீழே வீழ்கிறார்கள்; அவை அரசனுடைய பகைவர்களின் இதயத்தில் உள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் நேரடியாக: “உமது அம்புகள் கூர்மையானவை—மக்கள் உமக்குக் கீழே வீழ்கிறார்கள்—அரசனுடைய பகைவர்களின் இதயத்தில்.” எபிரெயக் கவிதை மிகவும் சுருக்கமானது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִצֶּיךָ
  choice: உமது அம்புகள்
  rationale: חֵץ என்பதன் பன்மையுடன் இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி உள்ளது; நவீனத் தமிழில் இயல்பாக ‘உமது அம்புகள்’ என வருகிறது.
- source_word: שְׁנוּנִים
  choice: கூர்மையானவை
  rationale: ‘கூரானவை/தீட்டப்பட்டவை’ என்ற பெயரடை அல்லது செயப்பாட்டு எச்சப் பொருள்; அம்புகளின் பண்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עַמִּים
  choice: மக்கள்
  rationale: עַם என்பதன் பன்மை பல மக்கள் கூட்டங்களைக் குறிக்கிறது. தமிழில் ‘மக்கள்’ வடிவமே இயல்பாகப் பன்மைக் கூட்டங்களைச் சுட்ட முடியும்; ‘தேசங்கள்’ என்பது இங்கு குறைவான நேரடி பொருத்தம்.
- source_word: תַּחְתֶּיךָ
  choice: உமக்குக் கீழே
  rationale: ‘உனக்குக் கீழ்/அடியில்’ என்ற நேரடிப் பொருளைத் தக்கவைத்து, போரில் வீழ்த்தப்பட்டு அடங்குவதையும் உணர்த்துகிறது.
- source_word: יִפְּלוּ
  choice: வீழ்கிறார்கள்
  rationale: נפל வினையின் நிறைவுறா வடிவம்; கவிதையின் உயிரோட்டமான நிகழ்காலக் காட்சியாக மொழிபெயர்க்கப்பட்டுள்ளது. ‘வீழ்வார்கள்’ என்பதும் சாத்தியம்.
- source_word: בְּלֵב
  choice: இதயத்தில் பாய்கின்றன
  rationale: எழுத்துப்படி ‘இதயத்தில்’ என்று மட்டுமே உள்ள மிகச் சுருக்கமான கவிதைத் தொடரில் அம்புகளின் செயல் மறைமுகமாகப் புரிகிறது. தமிழில் வாக்கியம் இயல்பாக இருக்க ‘பாய்கின்றன’ சேர்க்கப்பட்டது; குறிப்பில் சொற்சொல் அமைப்பு தரப்படுகிறது.
- source_word: אוֹיְבֵי הַמֶּלֶךְ
  choice: அரசனுடைய பகைவர்களின்
  rationale: ‘அரசனின் பகைவர்கள்’ என்ற நேரடியான உடைமைத் தொடர். இரண்டாம் நபருடன் ஒத்திசைக்க ‘உமது பகைவர்கள்’ என்று மாற்றாமல் எபிரெய உரையின் ‘அரசன்’ தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: அரச சங்கீதத்தில் ‘அரசன்’ யாரைக் குறிக்கிறது
  choice: மொழிபெயர்ப்பில் எபிரெய உரையிலுள்ள ‘அரசன்’ என்பதையே தக்கவைத்தல்
  alternative: அரசனை நேரடியாக மேசியாவாக அடையாளப்படுத்துதல் அல்லது ‘உமது பகைவர்கள்’ என்று மாற்றுதல்
  rationale: இந்தச் சங்கீதத்திற்கு மேசியாவைச் சார்ந்த வாசிப்பு இருக்கலாம்; ஆனால் இவ்வசனம் வெளிப்படையாக ‘அரசன்’ என்றே கூறுகிறது. மொழிபெயர்ப்பு அந்த வரலாற்று-கவிதைச் சொல்லையும் அதன் விளக்கத் திறப்பையும் பாதுகாக்கிறது.
- issue: இறுதி தொடரின் சுருக்கமான இலக்கண உறவு
  choice: அம்புகள் அரசனுடைய பகைவர்களின் இதயத்தில் பாய்கின்றன என்று பொருளை இயல்பான தமிழில் வெளிப்படுத்துதல்
  alternative: ‘அரசனுடைய பகைவர்களின் இதயத்தில்’ என்ற வினையற்ற சொற்சொல் அமைப்பை மட்டும் வைத்தல்
  rationale: எபிரெயக் கவிதை அம்புகள், வீழும் மக்கள், பகைவர்களின் இதயம் ஆகியவற்றை மிகச் சுருக்கமாக இணைக்கிறது. ‘பாய்கின்றன’ என்பது சூழலிலிருந்து பெறப்படும் குறைந்தபட்ச நிரப்பல்; உண்மையான சுருக்கமும் மாற்று அமைப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. சங்கீதப் பாணிக்கேற்ற மரியாதை ஒருமையாக ‘உமது/உமக்கு’ தேர்ந்தெடுக்கப்பட்டது. ‘பாய்கின்றன’ இயல்பான தமிழுக்கான குறைந்தபட்ச விளக்க நிரப்பல்; எபிரெயத்தின் சுருக்கம் அடிக்குறிப்பில் காட்டப்பட்டுள்ளது.
