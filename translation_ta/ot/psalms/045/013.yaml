source:
  edition: WLC
  text: כָּל כְּבוּדָּ֣ה בַת מֶ֣לֶךְ פְּנִ֑ימָה מִֽ/מִּשְׁבְּצ֖וֹת זָהָ֣ב לְבוּשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/013.yaml
  text: All glorious is the king’s daughter within[b][a]; her clothing is of woven gold.
translation:
  language: ta
  text: அரசனின் மகள் முழு மகிமையுடன் உள்ளே இருக்கிறாள்[a]; அவளுடைய ஆடை பொன் வேலைப்பாடுகளால் ஆனது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனின் மகள் உள்ளே முழு மகிமையுடன் இருக்கிறாள்.” “உள்ளே” என்பது அவளுடைய அக அழகைக் குறிக்கலாம்; அல்லது அவள் அரண்மனைக்குள் அல்லது உள் அறையில் இருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவளுடைய ஆடை பொன் பதிப்புவேலைகளால் அலங்கரிக்கப்பட்டுள்ளது,” அல்லது “அவளுடைய ஆடையில் பொன்னால் சித்திரத் தையல் செய்யப்பட்டுள்ளது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  choice: முழுவதும் மகிமை பொருந்தியவளாய்
  rationale: כָּל இங்கு வலியுறுத்தும் பொருளில் வந்து, כְּבוּדָּה குறிக்கும் முழுமையான மகிமையையும் சிறப்பையும் வெளிப்படுத்துகிறது. நவீனத் தமிழில் இயல்பாகவும் அரசத் திருமணச் சூழலுக்கு ஏற்றவாறும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בַת מֶלֶךְ
  choice: அரசனின் மகள்
  rationale: ‘இளவரசி’ என்பது சாத்தியமானாலும், எபிரெயச் சொற்றொடரின் வடிவத்தையும் அரசவைக் காட்சியையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: פְּנִימָה
  choice: உள்ளே
  rationale: இந்த வினையடை ‘உள்ளே/உட்புறத்தில்’ என்று பொருள்படும். அரண்மனை அல்லது அறைக்குள் இருப்பதையோ, அகத்திலுள்ள மகிமையையோ குறிக்கக்கூடிய தெளிவின்மையை ‘உள்ளே’ ஓரளவு பாதுகாக்கிறது.
- source_word: מִמִּשְׁבְּצוֹת זָהָב
  choice: பொன்னால் பின்னப்பட்டதே
  rationale: מִשְׁבְּצוֹת என்பது பின்னல், சித்திரத் தையல், பதிப்பு அல்லது கட்டமைக்கப்பட்ட அலங்கார வேலைப்பாட்டைக் குறிக்கலாம். ஆடையின் சூழலில் ‘பின்னப்பட்ட’ என்பது இயல்பான தேர்வு; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לְבוּשָׁהּ
  choice: அவளுடைய உடை
  rationale: அவள் அணிந்திருப்பதைக் குறிக்கும் பொதுவான சொல்லாகும். குறிப்பாக ஒருவகை மேலங்கியைச் சுட்டுவதாகக் குறுக்காமல், நவீனத் தமிழில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: פְּנִימָה என்பது இடத்தையா அக அழகையா குறிக்கிறது?
  choice: முதன்மை உரையில் ‘உள்ளே’ என்று தெளிவின்மையைப் பாதுகாத்தல்
  alternative: ‘அகத்தில் மகிமையுள்ளவள்’ அல்லது ‘அரண்மனையின் உள் அறையில்’
  rationale: மூல உரை இடப்பொருளுக்கும் உள்ளார்ந்த பண்புப் பொருளுக்கும் இடையே உறுதியான தீர்மானத்தைத் தரவில்லை. ஆகவே எந்த ஓர் விளக்கத்தையும் இறையியல் அல்லது உருவக வாசிப்பாகத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் dignified அரசவைக் கவிதை நடையைப் பயன்படுத்துகிறது. ‘மகிமை’ அரசச் சிறப்பைத் தக்கவைக்கிறது; ‘பின்னப்பட்டதே’ கவிதைநயமான வலியுறுத்தலை அளிக்கிறது. மூலத்தின் இலக்கணத் தெளிவின்மைகள் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
