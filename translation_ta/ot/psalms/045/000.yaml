base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/000.yaml
  text: 'For the choirmaster: according to “Lilies.” Of the sons of Korah[a]. A Maskil[c][b]. A song of loves.'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: “லில்லிகள்” என்பதின்படி.[a] கோரகின் மகன்களுக்குரியது. ஒரு மஸ்கீல்.[b] காதல்களின் பாடல்.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் ஷோஷன்னிம்; நேரடியாக “லில்லிகள்” என்று பொருள். இது ஒரு மெட்டு அல்லது இசையமைப்பின் பெயராக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: மஸ்கீல் என்பது சங்கீதத் தலைப்புகளில் வரும் ஒரு தொழில்நுட்பச் சொல்; அது தியானத்திற்குரிய அல்லது அறிவுறுத்தும் படைப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “ஒரு காதல் பாடல்.” எபிரெயில் நேரடியாக “காதல்களின் பாடல்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை வழிநடத்தும் ஒருவரைக் குறிக்கும் மரபுசார் சொல்லாக இருப்பதால், பாடகர் குழுவை மட்டும் குறிப்பதாகச் சுருக்காமல் பொதுவான இசைச் செயல்பாட்டைத் தக்கவைக்கிறது.
- source_word: עַל
  choice: என்பதின்படி
  rationale: இங்கு மெட்டு, இசையமைப்பு அல்லது நிகழ்த்தும் முறை ஆகியவற்றில் எதைக் குறிக்கிறது என்பது உறுதியில்லை; ஆகவே தொழில்நுட்ப நுணுக்கத்தை அளவுக்கு மீறி நிர்ணயிக்காத வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: שֹׁשַׁנִּים
  choice: “அல்லிகள்”
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘அல்லிகள்’; மேற்கோள் குறிகள் இது ஓர் இசை மெட்டு அல்லது அமைப்பின் பெயராக இருக்கலாம் என்பதை உணர்த்துகின்றன.
- source_word: לִבְנֵי קֹרַח
  choice: கோராகின் மகன்களுடையது
  rationale: לְ என்னும் முன்னிடைச்சொல் ஆசிரியத்துவம், தொடர்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும்; ‘மகன்களுடையது’ என்பது அந்தத் தொடர்பைத் திறந்தவாறே வைக்கிறது.
- source_word: מַשְׂכִּיל
  choice: ஒரு மஸ்கீல்
  rationale: இது சங்கீதத் தலைப்புகளில் வரும் பொருள் உறுதியற்ற தொழில்நுட்ப வகைப்பாட்டுச் சொல்; தவறான துல்லியத்தைத் தவிர்க்க ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: שִׁיר
  choice: பாடல்
  rationale: இலக்கிய அல்லது இசை வகையைக் குறிக்கும் சொல்லின் நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: יְדִידֹת
  choice: காதல்களின்
  rationale: எபிரெயில் உள்ள அசாதாரண பன்மையைத் தக்கவைத்து, ‘ஒரு காதல் பாடல்’ என்று ஒருமைப்படுத்தி விளக்குவதைத் தவிர்க்கிறது.
