    reason: lexical_alternative
  - marker: b
    text: ‘பொலிவு’, ‘மாட்சி’ என்ற இணைச்சொற்கள் அரசருக்குரிய மேன்மையைக் குறிக்கின்றன. எபிரெயத்தில் இவற்றுக்கு முன் ‘உடன்’ என்பதற்கான சொல் இல்லை; ஆகவே, ‘வலிமைமிக்க வீரனே—உமது பொலிவும் உமது மாட்சியும்’ என்று வீரனை விளக்கும் தனித்த தொடராகவும் வாசிக்கலாம்.
    reason: alternative_reading
