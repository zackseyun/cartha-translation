revisions:
- from: வலிமைமிக்க வீரனே, உமது வாளை உமது தொடையில் கட்டிக்கொள்[a]; உமது பொலிவோடும் மாட்சியோடும்[b] புறப்படு.
  to: வலிமைமிக்க வீரனே, உமது வாளை உமது தொடையில்[a] கட்டிக்கொள், உமது பொலிவுடனும் மாட்சியுடனும்[b].
  rationale: “புறப்படு” நீக்கப்பட்டதால், மொழிபெயர்ப்பு வசனம் 3-ன் எபிரெயச் சொல்லமைப்பையும் அதன் சுருக்கமான, கவிதைநயமுள்ள முடிவையும் காக்கிறது. “உமது பொலிவுடனும் மாட்சியுடனும்” என்பது ஆங்கில POB-இன் “in your splendor and your majesty” என்ற தொடரியல்சார் வாசிப்பைத் தமிழில் இயல்பாகத் தருகிறது; எபிரெயத்தின் மாற்று இணைப்புவாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. முதல் அடிக்குறிப்பு தவறான ‘அரைக்கச்சை’ படிமத்தை அகற்றி, பாதுகாப்பான சொல்லியல் மாற்றை வழங்குகிறது.
