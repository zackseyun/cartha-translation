translation:
  language: ta
  text: வலிமைமிக்க வீரனே, உமது வாளை உமது தொடையில்[a] கட்டிக்கொள், உமது பொலிவுடனும் மாட்சியுடனும்[b].
  philosophy: optimal-equivalence
