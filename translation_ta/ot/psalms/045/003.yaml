theological_decisions:
- issue: சங்கீதம் 45-இல் அரசரை அல்லது மெசியாவைக் குறிக்கும் அழைப்பு
  choice: வசனம் நேரடியாக வலிமைமிக்க அரசப் போர்வீரனை நோக்கிப் பேசுவதாக மொழிபெயர்க்கப்பட்டது; மெசியா என்ற அடையாளம் சொற்களில் வெளிப்படையாகச் சேர்க்கப்படவில்லை.
  alternative: பிற்கால வேதாகமப் பயன்பாட்டின் வெளிச்சத்தில் இங்கேயே மெசியாவை நேரடியாக அடையாளப்படுத்துதல்.
  rationale: எபிரெய வசனம் உடனடியான கவிதைச் சூழலில் அரசப் போர்வீரனை நோக்கிய அழைப்பாக உள்ளது. விரிவான மெசியானிய வாசிப்பை மறுக்காமலும் மொழிபெயர்ப்பிலேயே முடிவுசெய்யாமலும் பதற்றம் பாதுகாக்கப்படுகிறது.
- issue: הוֹדְךָ וַהֲדָרֶךָ என்ற இறுதித் தொடரின் தொடரியல் உறவு
  choice: ‘உமது பொலிவோடும் மாட்சியோடும் புறப்படு’ என்று கட்டளையின் முறையையோ சூழலையோ குறிக்கும் தொடராக வழங்கப்பட்டது.
  alternative: ‘உமது பொலிவும் உமது மாட்சியும்’ என்று தனித்த பெயர்ச்சொல் தொடராக அல்லது வீரனை விளக்கும் இணைப்பாக விடுதல்.
  rationale: எபிரெயத்தில் முன்னிடைச்சொல் இல்லாததால் தொடர்பில் ஓரளவு தெளிவின்மை உள்ளது. தமிழில் முற்றாத வாக்கியத்தைத் தவிர்க்க ‘புறப்படு’ சூழலறிந்து சேர்க்கப்பட்டது; அடிப்படை மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், அரசக் கவிதைக்கேற்ற கண்ணியமான உயர்நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்பது ஒருமை அழைப்பின் மரியாதையையும் கவிதைநடையையும் காக்கிறது. ‘தொடை’ என்ற உடல்சார்ந்த படிமம் மென்மையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
