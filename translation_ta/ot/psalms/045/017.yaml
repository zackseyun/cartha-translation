  text: אַזְכִּ֣ירָה שִׁ֭מְ/ךָ בְּ/כָל דֹּ֣ר וָ/דֹ֑ר עַל כֵּ֥ן עַמִּ֥ים יְ֝הוֹדֻ֗/ךָ לְ/עֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/017.yaml
  text: I will cause your name to be remembered in every generation[b][a]; therefore the peoples will praise you forever and ever.
translation:
  language: ta
  text: ஒவ்வொரு தலைமுறையிலும் உமது பெயர் நினைவுகூரப்படச் செய்வேன்[a]; ஆகையால் மக்களினங்கள் உம்மை என்றென்றும் புகழ்வார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது பெயரை எடுத்துரைப்பேன்’ அல்லது ‘உமது பெயரை நினைவுகூருவேன்.’ எபிரெய வினை காரணவினை வடிவில் இருப்பதால், பெயர் நினைவுகூரப்படும்படி செய்வது முதன்மையான பொருளாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமக்கு நன்றி செலுத்துவார்கள்.’ எபிரெய வினை வழிபாட்டுச் சூழல்களில் புகழ்தலையும் நன்றி செலுத்துதலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּירָה
  choice: நினைவுகூரப்படச் செய்வேன்
  rationale: זכר என்பதன் ஹிஃபீல் வடிவிலுள்ள காரணவினைப் பொருளைத் தக்கவைக்கிறது. இது பேசுபவர் தனிப்பட்ட முறையில் நினைப்பதை மட்டும் அல்லாமல், அந்தப் பெயர் தலைமுறைதோறும் நினைவுகூரப்படும்படி செய்வதைக் குறிக்கிறது.
- source_word: שִׁמְךָ
  choice: உமது பெயர்
  rationale: ‘பெயர்’ என்ற நேரடிப் பொருளோடு, புகழ், நற்பெயர், நினைவாக நிலைக்கும் அடையாளம் ஆகிய கருத்துகளையும் இயல்பாகத் தாங்குகிறது. மரியாதையான நேரடி விளிப்பை ‘உமது’ காக்கிறது.
- source_word: בְּכָל דֹּר וָדֹר
  choice: ஒவ்வொரு தலைமுறையிலும்
  rationale: ‘ஒவ்வொரு தலைமுறை தலைமுறையிலும்’ என்ற எபிரெயச் சொற்றொடரின் பகிர்வுப் பொருளையும் தொடர்ச்சியையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய உறுதிமொழியிலிருந்து வரும் விளைவு அல்லது முடிவைத் தெளிவாகக் காட்டுகிறது.
- source_word: עַמִּים
  choice: மக்களினங்கள்
  rationale: எபிரெயத்தில் உள்ள பன்மையைப் பாதுகாத்து, பல்வேறு மக்கள் சமூகங்கள் அல்லது தேசத்தாரைக் குறிக்கிறது; ஒருமையான ‘மக்கள்’ என்று சுருக்கவில்லை.
- source_word: יְהוֹדֻךָ
  choice: உம்மை ... புகழ்வார்கள்
  rationale: சங்கீத வழிபாட்டுச் சூழலில் ידה என்பது புகழ்தல் அல்லது நன்றி செலுத்துதல் ஆகிய இரு நிழற்பொருள்களையும் கொள்ளலாம். இங்கு ‘புகழ்வார்கள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְעוֹלָם וָעֶד
  choice: என்றென்றும்
  rationale: நிலைத்த காலத்தை வலியுறுத்தும் இணை எபிரெயச் சொற்றொடரை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: இந்த அரச திருமணச் சங்கீதத்தில் இரண்டாம் நபர் சுட்டுப்பெயர் யாரைக் குறிக்கிறது
  choice: ‘உமது/உம்மை’ என்ற நேரடி விளிப்பை மட்டும் தக்கவைத்து, அதன் குறிக்கப்படுபவரை மொழிபெயர்ப்பில் மேலும் வரையறுக்கவில்லை
  alternative: தாவீதிய அரசனை மட்டும் குறிக்கும் விளிப்பு; அல்லது இறுதியில் மேசியாவில் நிறைவேறும் மேசியானிய விளிப்பு
  rationale: வசனம் நேரடியாக ஒருவரை விளித்து, அவர் நிலையான புகழைப் பெறுவார் என்கிறது. சங்கீதத்தின் வரலாற்று அரசச் சூழலும் அதன் விரிந்த மேசியானிய வாசிப்பும் மொழிபெயர்ப்பில் ஒன்றைத் தேர்ந்தெடுத்து மற்றொன்றை நீக்க வேண்டிய அவசியத்தை ஏற்படுத்தவில்லை. எனவே மூலத்தின் விளக்கத் திறந்தநிலை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் மரியாதையான நேரடி விளிப்பும் காக்கப்பட்டுள்ளன. காரணவினை, மக்கள் பன்மை, முடிவைக் குறிக்கும் இணைப்பு ஆகியவை மூலத்துக்கு நெருக்கமாக வைக்கப்பட்டுள்ளன; தெளிவுபடுத்தப்படாத அரச/மேசியானிய குறிப்பு மொழிபெயர்ப்பில் தீர்மானிக்கப்படவில்லை.
