  text: אָהַ֣בְתָּ צֶּדֶק֮ וַ/תִּשְׂנָ֫א רֶ֥שַׁע עַל כֵּ֤ן מְשָׁחֲ/ךָ֡ אֱלֹהִ֣ים אֱ֭לֹהֶי/ךָ שֶׁ֥מֶן שָׂשׂ֗וֹן מֵֽ/חֲבֵרֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/007.yaml
  text: You have loved righteousness and hated wickedness[a]; therefore God, your God[b], has anointed you with the oil of gladness beyond your companions.
translation:
  language: ta
  text: நீ நீதியை நேசித்து, தீமையை வெறுத்தாய்; ஆகையால் கடவுள்—உன் கடவுள்—[a] உன் தோழர்களைவிட மேலாக உன்னை மகிழ்ச்சியின் எண்ணெயால் அபிஷேகம் செய்தார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகையால், கடவுளே, உன் கடவுள் உன் தோழர்களைவிட மேலாக உன்னை மகிழ்ச்சியின் எண்ணெயால் அபிஷேகம் செய்தார்.” முதலாவது “கடவுள்” என்பதை வினையின் எழுவாயாக அல்லாமல் விளியாகவும் வாசிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: இந்த வசனம் எபிரெயர் 1:9-ல் மேற்கோள் காட்டப்பட்டுள்ளது.
    reason: cross_reference
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: நேசித்து
  rationale: Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை. அடுத்த வினையுடன் இயல்பாக இணையும் தமிழ்ச் செய்யுள் நடைக்காக வினையெச்சமாக மொழிபெயர்க்கப்பட்டது; நிலையான ஒழுக்கப் பண்பையும் வெளிப்படுத்துகிறது.
- source_word: צֶּדֶק
  choice: நீதியை
  rationale: சரியானது, நியாயமானது, நீதியானது என்ற பொருள் பரப்பைத் தாங்கும் எளிய, கண்ணியமான சொல்; அரசப் பின்னணிக்கும் ஒழுக்க எதிர்மறை இணைப்புக்கும் ஏற்றது.
- source_word: וַתִּשְׂנָא
  choice: வெறுத்தாய்
  rationale: இரண்டாம் நபர் நேரடி உரையைத் தெளிவாகக் காக்கிறது; முந்தைய வினையுடன் இணைந்து நிறைவு பெற்ற, பண்பை விவரிக்கும் செயலைக் காட்டுகிறது.
- source_word: רֶשַׁע
  choice: தீமையை
  rationale: ஒழுக்கக்கேடு மற்றும் பொல்லாப்பைக் குறிக்கும் மூலச்சொல்லை சாதாரண வாசகருக்குப் புரியும் வகையில் தருகிறது; ‘நீதி’ என்பதற்கான தெளிவான எதிரிணையாகவும் அமைகிறது.
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய ஒழுக்க நிலைப்பாட்டின் விளைவை அறிமுகப்படுத்தும் காரண-விளைவு தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: מְשָׁחֲךָ
  choice: உன்னை ... அபிஷேகம் செய்தார்
  rationale: Qal perfect மூன்றாம் நபர் ஆண்பால் ஒருமையையும் இரண்டாம் நபர் பொருள் விகுதியையும் காக்கிறது. அரச நியமனம் அல்லது தனிப்படுத்துதலின் கருத்தை ‘அபிஷேகம்’ துல்லியமாகத் தாங்குகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: முதலாவது אֱלֹהִים பிரதான உரையில் வினையின் எழுவாயாக எடுத்துக்கொள்ளப்படுகிறது. எபிரெயச் சொற்றொடரின் மாற்று விளி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியை நேரடியாகக் காத்து, எழுவாயான ‘கடவுள்’ என்பதற்கான விளக்க இணைப்பாக அமைக்கப்பட்டுள்ளது.
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: மகிழ்ச்சியின் எண்ணெயால்
  rationale: மகிழ்ச்சி அல்லது கொண்டாட்டத்துடன் தொடர்புடைய எண்ணெயைக் குறிக்கும் construct தொடரை உருவக மற்றும் விழாக்கால நயத்துடன் காக்கிறது.
- source_word: מֵחֲבֵרֶיךָ
  choice: உன் தோழர்களைவிட மேலாக
  rationale: מִן குறிக்கும் ஒப்பீட்டை வெளிப்படையாகக் காட்டுகிறது; உடன் இருப்பவர்களை மிஞ்சிய சிறப்பை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: מְשָׁחֲךָ אֱלֹהִים אֱלֹהֶיךָ என்பதில் முதலாவது אֱלֹהִים சொல்லின் இலக்கணப் பங்கு
  choice: 'முதலாவது ‘கடவுள்’ வினையின் எழுவாயாகவும், ‘உன் கடவுள்’ அதனை விளக்கும் இணைப்பாகவும் தரப்பட்டுள்ளது: ‘கடவுள்—உன் கடவுள்—உன்னை ... அபிஷேகம் செய்தார்.’'
  alternative: முதலாவது சொல்லை விளியாக எடுத்துக்கொண்டு, ‘ஆகையால், கடவுளே, உன் கடவுள் உன்னை ... அபிஷேகம் செய்தார்’ என்று வாசிக்கலாம்.
  rationale: எபிரெய தொடரமைப்பு இரண்டு வாசிப்புகளுக்கும் இடமளிக்கிறது. இவ்வசனத்தின் வினைத் தொடருடன் நேரடியாகப் பொருந்தும் எழுவாய் வாசிப்பு பிரதான உரையில் கொள்ளப்பட்டது; முந்தைய வசனத்துடனும் எபிரெயர் 1:9 மேற்கோளுடனும் தொடர்புடைய இறையியல் அழுத்தத்தை அமைதியாகத் தீர்மானிக்காமல் மாற்று விளி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியும் கண்ணியமுமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அபிஷேகம்’ என்பது பரவலாக அறியப்பட்ட வேதாகமச் சொல்லாக இருப்பதால் தக்கவைக்கப்பட்டது. எபிரெய மொழியின் இலக்கண இருபொருள் தன்மை பிரதான உரை மற்றும் அடிக்குறிப்பு வழியாகத் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளது.
