  text: מִ/כָּל פְּשָׁעַ֥/י הַצִּילֵ֑/נִי חֶרְפַּ֥ת נָ֝בָ֗ל אַל תְּשִׂימֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/008.yaml
  text: Deliver me from all my transgressions[a]; do not make me the reproach of a fool.
translation:
  language: ta
  text: என் மீறுதல்கள் அனைத்திலிருந்தும் என்னை விடுவியும்; மூடனின் பழிப்புக்கு[a] என்னை ஆளாக்காதிரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மூடனுக்குரிய அவமானமாக என்னை ஆக்காதிரும்.” எபிரெயச் சொற்றொடரை, ஒரு மூடனின் பழிப்புக்கு இலக்காவதாகவோ மூடத்தனத்தோடு தொடர்புடைய அவமானமாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל
  choice: அனைத்திலிருந்தும்
  rationale: מִן உடன் כָּל சேர்ந்திருப்பதால், பேசுகிறவரின் எல்லா மீறுதல்களிலிருந்தும் விடுதலை பெறும் பொருள் இயல்பாக வெளிப்படுகிறது.
- source_word: פְּשָׁעַי
  choice: என் மீறுதல்கள்
  rationale: פֶּשַׁע என்பது உரிய அதிகாரத்துக்கு எதிரான மீறுதல் அல்லது கலகத்தைக் குறிக்கலாம். ‘மீறுதல்கள்’ அதன் ஒழுக்க மற்றும் இறையியல் வலிமையை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: הַצִּילֵנִי
  choice: என்னை விடுவியும்
  rationale: נצל என்பதன் ஹிஃபில் கட்டளை வடிவம் மீட்டல், காப்பாற்றல், விடுவித்தல் ஆகிய பொருள்களைத் தருகிறது. இங்கு பாவங்களிலிருந்தும் அவற்றின் விளைவிலிருந்தும் விடுதலை கோரும் மன்றாட்டுக்கு ‘விடுவியும்’ பொருந்துகிறது.
- source_word: חֶרְפַּת
  choice: பழிப்புக்கு
  rationale: חֶרְפָּה என்பது பழிப்பு, நிந்தை, பொது அவமானம் ஆகியவற்றைக் குறிக்கிறது. ‘பழிப்பு’ பிறரிடமிருந்து வரும் இகழ்ச்சியையும் மானக்கேட்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נָבָל
  choice: மூடன்
  rationale: சங்கீதங்களில் נָבָל வெறும் அறிவுக் குறைவுள்ளவனை அல்ல, ஒழுக்க உணர்வற்ற அல்லது இறைபக்தியற்ற ஒருவனையும் குறிக்கலாம். ‘மூடன்’ சுருக்கமானதும் மரபாகப் புரிந்துகொள்ளப்படுவதுமான இணைச்சொல்.
- source_word: אַל תְּשִׂימֵנִי
  choice: என்னை ஆளாக்காதிரும்
  rationale: שׂים இங்கு ஒருவரை ஒரு நிலைக்கு உட்படுத்துதல் அல்லது அதன் பொருளாக ஆக்குதல் என்ற உணர்வைக் கொண்டுள்ளது. ‘பழிப்புக்கு ஆளாக்காதிரும்’ என்பது தமிழில் இயல்பாக அந்தக் காரணவினைப் பொருளைத் தெரிவிக்கிறது.
theological_decisions:
- issue: மூடனுக்கு முன்பாக ஏற்படும் பழிப்பைப் பற்றிய மன்றாட்டின் பொருள்
  choice: தன்னை ஒரு மூடனின் பழிப்புக்கு இலக்காக விட வேண்டாம் என்று சங்கீதக்காரர் கடவுளிடம் வேண்டுகிறார்.
  alternative: மூடனுக்குரிய அவமானமாகத் தன்னை ஆக்க வேண்டாம்; அல்லது மூடத்தனத்தோடு தொடர்புடைய அவமானத்திற்கு உட்படுத்த வேண்டாம்.
  rationale: חֶרְפַּת נָבָל என்ற சேர்க்கை ‘மூடனிடமிருந்து வரும் பழிப்பு’ என்றும் ‘மூடனோடு தொடர்புடைய அவமானம்’ என்றும் புரிந்துகொள்ள இடமளிக்கிறது. முதன்மை உரை முதல் பொருளை இயல்பாகக் காட்டுகிறது; அடிக்குறிப்பு உண்மையான எபிரெய மொழி இருபொருள் வாய்ப்பைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மன்றாட்டுக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விடுவியும்’, ‘ஆளாக்காதிரும்’ ஆகிய வடிவங்கள் கவிதைநயத்தையும் நேரடியான வேண்டுதலையும் காக்கின்றன; சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
