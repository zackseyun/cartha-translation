  text: நான் மௌனமாயிருக்கிறேன்[a]; என் வாயைத் திறக்கமாட்டேன்; ஏனெனில் நீரே இதைச் செய்தீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் மௌனமாக்கப்பட்டேன்” அல்லது “நான் ஊமையானேன்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “நீரே செய்தீர்”; செயப்படுபொருள் கூறப்படாமல் விடப்பட்டுள்ளது.
