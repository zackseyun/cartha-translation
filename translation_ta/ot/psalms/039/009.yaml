  rationale: The revision uses a contextually precise and natural Tamil expression for the Hebrew Niphal while retaining the verse’s concise, reverent register. It preserves the imperfect’s possible volitional sense, the emphatic ‘you,’ and the unresolved implied object of ‘have done.’ Footnote anchors are retained and placed directly after the terms or clause they explain.
