lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: நான் ஊமையானேன்
  rationale: אלם என்பதன் நிஃபால் வடிவம் மௌனமாக்கப்படுதல் அல்லது ஊமையாகிவிட்ட நிலையைச் சுட்டுகிறது. “ஊமையானேன்” அதன் வலுவான, விளைவுநிலைப் பொருளைத் தக்கவைக்கிறது; சூழலில் இது பேச்சை அடக்கிக்கொள்வதைக் குறிக்கிறது.
- source_word: לֹא אֶפְתַּח פִּי
  choice: என் வாயைத் திறக்கமாட்டேன்
  rationale: “வாயைத் திறத்தல்” என்பது பேசுவதற்கான இயல்பான எபிரெய மரபுத்தொடர். இம்பெர்ஃபெக்ட் வடிவத்திலுள்ள உறுதியான மனநிலையைத் தமிழில் “திறக்கமாட்டேன்” இயல்பாக வெளிப்படுத்துகிறது; “வாய்” என்ற உருவகமும் தக்கவைக்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சங்கீதக்காரரின் மௌனத்திற்கான காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பாகத் தெளிவாக உள்ளது.
- source_word: אַתָּה
  choice: நீரே
  rationale: எபிரெயத்தில் எழுவாய் சுட்டுப்பெயர் வெளிப்படையாக வந்து வலியுறுத்தப்படுகிறது. “நீரே” அந்த வலியுறுத்தலைத் தமிழில் தக்கவைக்கிறது; கடவுளை நோக்கிய கண்ணியமான ஒருமை அழைப்பாகவும் இயல்பாக உள்ளது.
- source_word: עָשִׂיתָ
  choice: இதைச் செய்தீர்
  rationale: עשה என்பது பொதுவாக “செய்” என்று பொருள்படும். எபிரெயத்தில் செயப்படுபொருள் கூறப்படாதபோதும், தமிழில் வாக்கியம் இயல்பாக இருக்க “இதை” சேர்க்கப்பட்டுள்ளது; அது எதைக் குறிக்கிறது என்பதை விரிவாக நிர்ணயிக்காமல் விடுகிறது.
theological_decisions:
- issue: עָשִׂיתָ என்பதன் மறைமுகச் செயப்படுபொருளும் இறைச் செயலாற்றலும்
  choice: ஏனெனில் நீரே இதைச் செய்தீர்
  alternative: ஏனெனில் நீரே செயல்பட்டீர் / ஏனெனில் நீரே செய்தீர்
  rationale: சூழ்நிலைக்கு இறைவனே காரணம் என்ற சங்கீதக்காரரின் ஒப்புதலை மொழிபெயர்ப்பு தக்கவைக்கிறது. ஆனால் எபிரெயம் குறிப்பிடாத செயப்படுபொருளைத் துன்பம், தண்டனை போன்ற குறிப்பிட்ட விளக்கமாக மாற்றவில்லை; இதனால் இறைச் செயலாற்றலைச் சார்ந்த மூலவசனத்தின் இறையியல் அழுத்தமும் தெளிவின்மையும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதேவேளையில் சங்கீதத்திற்கேற்ற கண்ணியமான மற்றும் சுருக்கமான நடை பயன்படுத்தப்பட்டுள்ளது. “நீரே” என்பது வெளிப்படையான எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தலைக் காட்டுகிறது.
