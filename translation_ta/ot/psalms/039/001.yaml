  text: אָמַ֗רְתִּי אֶֽשְׁמְרָ֣ה דְרָכַ/י֮ מֵ/חֲט֪וֹא בִ/לְשׁ֫וֹנִ֥/י אֶשְׁמְרָ֥ה לְ/פִ֥/י מַחְס֑וֹם בְּ/עֹ֖ד רָשָׁ֣ע לְ/נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/001.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
translation:
  language: ta
  text: 'நான் சொன்னேன்: “என் நாவினால் பாவம் செய்யாதபடி என் வழிகளைக் காத்துக்கொள்வேன்; தீயவன் என் முன்னிலையில் இருக்கும்வரை என் வாய்க்கு வாய்ப்பூட்டு வைப்பேன்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: நான் சொன்னேன்
  rationale: אמר என்பதன் Qal perfect முதலாம் நபர் ஒருமை; சங்கீதக்காரரின் முன்தீர்மானத்தை நேரடியாக அறிமுகப்படுத்துகிறது.
- source_word: אֶשְׁמְרָה דְרָכַי
  choice: என் வழிகளைக் காத்துக்கொள்வேன்
  rationale: שׁמר என்ற வினை உறுதியான சுயக்கட்டுப்பாட்டைக் குறிக்கிறது; ‘என் வழிகள்’ என்பது வாழ்க்கை நடத்தை குறிக்கும் எபிரேய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מֵחֲטוֹא בִלְשׁוֹנִי
  choice: என் நாவினால் பாவம் செய்யாதபடி
  rationale: מן + infinitive construct தவிர்த்தல் அல்லது தடுத்தலைக் குறிக்கிறது; கருவிப்பொருளிலான בְּ உடன் ‘நாவு’ பாவம் நிகழும் வழியைக் காட்டுகிறது.
- source_word: מַחְסוֹם
  choice: கடிவாளம்
  rationale: வாயைக் கட்டுப்படுத்தும் கருவியைச் சுட்டும் தெளிவான உருவகமாகத் தமிழில் இயல்பாக ஒலிக்கிறது; சொல்லை அடக்குவதைப் பற்றிய மூலப்படிமத்தைப் பேணுகிறது.
- source_word: בְּעוֹד רָשָׁע לְנֶגְדִּי
  choice: தீயவன் என் முன்னிலையில் இருக்கும்வரை
  rationale: בְּעוֹד காலத் தொடர்ச்சியைக் குறிக்கிறது; רָשָׁע ஆண்பால் ஒருமையில் பெயர்ச்சொல் போல் பயன்படுத்தப்பட்டிருப்பதால் ‘தீயவன்’ எனத் தரப்பட்டுள்ளது; לְנֶגְדִּי என்பது ‘என் முன்னிலையில்’ எனப் பொருள்படும்.
theological_decisions:
- issue: רָשָׁע என்பதன் பாலினமும் எண்ணும்
  choice: தீயவன்
  alternative: தீயவர் / ஒரு தீய நபர்
  rationale: எபிரேயச் சொல் ஆண்பால் ஒருமையில் பெயர்ச்சொல் போல் நிற்பதைத் தமிழில் இயல்பாகவும் துல்லியமாகவும் காட்டுகிறது; இதை பொதுப்பாலாக மாற்றி மூலத்தின் வடிவத்தை மறைக்கவில்லை.
- issue: மௌனக் கட்டுப்பாட்டின் உருவகம்
  choice: என் வாய்க்குக் கடிவாளம் போடுவேன்
  alternative: என் வாயை அடக்கிக்கொள்வேன்
  rationale: மூலத்திலுள்ள மַחְסוֹם என்ற கண்கூடிய கட்டுப்பாட்டு உருவகத்தைப் பாதுகாக்கிறது; அதை வெறும் கருத்துரையாக மாற்றவில்லை.
translation_notes:
  register: நவீன தரத் தமிழ்; கண்ணியமானதாயும் பொதுவாசகர்களுக்குப் புரியத்தக்கதாயும் அமைந்துள்ளது. எபிரேயத்தின் ‘வழிகள்,’ ‘நாவு,’ வாய்க்கான கட்டுப்பாட்டு கருவி ஆகிய உருவகங்கள் இயன்றவரை இயல்பான தமிழில் பேணப்பட்டுள்ளன.
