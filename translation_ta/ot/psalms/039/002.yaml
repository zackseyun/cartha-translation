source:
  edition: WLC
  text: נֶאֱלַ֣מְתִּי ד֭וּמִיָּה הֶחֱשֵׁ֣יתִי מִ/טּ֑וֹב וּ/כְאֵבִ֥/י נֶעְכָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/002.yaml
  text: I was mute in silence[a]; I kept silent from good[b], and my pain was stirred up.
translation:
  language: ta
  text: 'நான் மௌனமாகப் பேச்சற்றிருந்தேன்;

    நன்மையிலிருந்து அமைதியாக இருந்தேன்[a];

    என் வேதனை கிளர்ந்தெழுந்தது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மூலத்தில், “நன்மையிலிருந்து அமைதியாக இருந்தேன்” என்று சுருக்கமாக உள்ளது. இது “நல்லதைக்கூடப் பேசாமல் இருந்தேன்” என்றோ, “நன்மையானவற்றிலிருந்து என்னை விலக்கிக்கொண்டேன்” என்றோ பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: பேச்சற்றிருந்தேன்
  rationale: இந்த நிஃபால் வினைச்சொல் பேச முடியாதவர் அல்லது பேசாதவர் போல மௌனமாயிருப்பதைக் குறிக்கிறது. மௌனம் தானாகத் தேர்ந்தெடுக்கப்பட்டதா அல்லது திணிக்கப்பட்டதா என்பதைத் தீர்மானிக்காமல் ‘பேச்சற்றிருந்தேன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: דּוּמִיָּה
  choice: மௌனமாக
  rationale: இந்தப் பெயர்ச்சொல் மௌனம் அல்லது அசைவற்ற அமைதியைக் குறிக்கிறது. தமிழில் வினையடை வடிவம் இயல்பாக இருப்பதோடு, முந்தைய வினையின் பொருளையும் வலுப்படுத்துகிறது.
- source_word: הֶחֱשֵׁיתִי
  choice: அமைதிகாத்தேன்
  rationale: இந்த ஹிஃபில் வடிவம் பேசாமல் அமைதியாக இருப்பதைக் குறிக்கிறது. ‘அமைதிகாத்தேன்’ என்பது முன்வரும் ‘பேச்சற்றிருந்தேன்’ என்பதிலிருந்து சிறிது வேறுபட்டு, எபிரெய இணைநிலையைப் பாதுகாக்கிறது.
- source_word: מִטּוֹב
  choice: நன்மையைக்கூடப் பேசாமல்
  rationale: מִן உடன் வரும் טוֹב மிகவும் சுருக்கமானதும் பலவாறு புரிந்துகொள்ளத்தக்கதுமான சொற்றொடர். சூழலில் நல்லதைக்கூடப் பேசாமல் இருந்தார் என்பது இயல்பான முதன்மைப் பொருள்; நன்மையிலிருந்தே தன்னை விலக்கிக்கொண்டார் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּכְאֵבִי
  choice: என் வேதனை
  rationale: כְּאֵב என்பது உடல் வலியையோ மன வேதனையையோ குறிக்கலாம். ‘வேதனை’ இரண்டையும் உள்ளடக்கக்கூடிய பரந்த தமிழ்ச் சொல்.
- source_word: נֶעְכָּר
  choice: கிளர்ந்தெழுந்தது
  rationale: עכר என்பதன் நிஃபால் வடிவம் கலக்கப்படுதல், தூண்டப்படுதல் அல்லது தீவிரமடைதல் ஆகிய நுண்பொருள்களைத் தருகிறது. அடக்கிவைத்த மௌனத்தின்போது உள்ளார்ந்த வேதனை பொங்கியதை ‘கிளர்ந்தெழுந்தது’ இயல்பாக வெளிப்படுத்துகிறது.
