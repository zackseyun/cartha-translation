  text: הוֹדִ֘יעֵ֤/נִי יְהוָ֨ה קִצִּ֗/י וּ/מִדַּ֣ת יָמַ֣/י מַה הִ֑יא אֵ֝דְעָ֗ה מֶה חָדֵ֥ל אָֽנִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/004.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
translation:
  language: ta
  text: யாவே, என் முடிவு எதுவென்றும், என் நாட்களின் அளவு எவ்வளவு என்றும் எனக்கு அறிவியும்; நான் எவ்வளவு நிலையற்றவன் என்பதை அறியும்படி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் எவ்வளவு பலவீனமானவன்’ அல்லது ‘நான் எவ்வளவு தற்காலிகமானவன்.’ எபிரெயத் தொடர் சுருக்கமானது; அது மனிதப் பலவீனத்தையோ வாழ்வின் நிலையாமை அல்லது குறுகிய தன்மையையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  choice: எனக்கு அறிவியும்
  rationale: ידע என்பதன் ஹிஃபில் கட்டளை வடிவம் காரணவினைப் பொருளைக் கொண்டது. ‘எனக்கு அறிவியும்’ என்பது அந்த வலிமையை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: קִצִּי
  choice: என் முடிவு
  rationale: קֵץ என்பது முடிவு அல்லது எல்லையைக் குறிக்கும். இங்கு வாழ்வின் இறுதி எல்லையே சூழலுக்கு ஏற்ற பொருள்; ‘விதி’ போன்ற கூடுதல் கருத்து சேர்க்கப்படவில்லை.
- source_word: וּמִדַּת יָמַי
  choice: என் நாட்களின் அளவு
  rationale: מִדָּה என்பதிலுள்ள ‘அளவு’ என்ற உருவகத்தைப் பாதுகாக்கிறது; ‘எண்ணிக்கை’ என்று விளக்கமாக மாற்றவில்லை.
- source_word: מַה הִיא
  choice: என்ன என்பது
  rationale: நாட்களின் அளவு எத்தகையது அல்லது எவ்வளவு என்பது பற்றிய கேள்வியை இயல்பான தமிழ் வாக்கிய அமைப்பில் தெரிவிக்கிறது.
- source_word: אֵדְעָה
  choice: அறிந்துகொள்ளச் செய்யும்
  rationale: இவ்விருப்ப வினைமுறை முந்தைய கட்டளையின் நோக்கம் அல்லது விரும்பிய விளைவைச் சுட்டுகிறது. தமிழில் தொடக்கத்திலுள்ள காரணவினைக் கோரிக்கையோடு இணைத்து இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: מֶה חָדֵל אָֽנִי
  choice: நான் எவ்வளவு நிலையற்றவன்
  rationale: சுருக்கமானதும் பொருள் தீர்மானிக்கக் கடினமானதுமான எபிரெய தொடர், இச்சங்கீதத்தின் வாழ்நாள் குறித்த சூழலில் மனித வாழ்வின் நிலையாமையை முதன்மையாகக் குறிக்கிறது; பலவீனம் அல்லது குறுகிய ஆயுள் என்பதும் சாத்தியம்.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: חָדֵל என்பதன் பொருள்
  choice: நிலையற்றவன்
  alternative: பலவீனமானவன் / குறுகிய ஆயுளுள்ளவன்
  rationale: சூழல் வாழ்நாளின் அளவையும் முடிவையும் பேசுவதால் ‘நிலையற்றவன்’ பொருத்தமானது. எனினும், எபிரெயச் சொல்லின் சுருக்கம் மனிதப் பலவீனத்தையும் வாழ்வின் குறுகிய தன்மையையும் உணர்த்தக்கூடும்; ஆகவே மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேண்டுதல் சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அறிவியும்’ என்ற வடிவம் மரியாதையுள்ள நேரடி வேண்டுதலைத் தக்கவைக்கிறது; ‘நாட்களின் அளவு’ என்ற மூல உருவகமும் பாதுகாக்கப்பட்டுள்ளது.
