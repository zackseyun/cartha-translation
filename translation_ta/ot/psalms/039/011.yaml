  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
translation:
  language: ta
  text: அக்கிரமம் காரணமாகக் கண்டனங்களால் நீ ஒரு மனிதனைத் திருத்துகிறாய்; அந்துப்பூச்சி அரிப்பதுபோல், அவனுக்கு அருமையானதை அழியச் செய்கிறாய்[a]. நிச்சயமாக, ஒவ்வொரு மனிதனும் நீராவி மட்டுமே[b]. சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அவனுக்கு அருமையானது” என்பதற்கான எபிரெயச் சொல், இன்னும் குறிப்பாக “அவனுடைய அழகு” என்றும், விரிவாக “அவனுடைய அரிய உடைமைகள்” என்றும் புரிந்துகொள்ளப்படலாம். இந்தச் சொற்றொடரை, “அவனுக்கு அருமையானதை அந்துப்பூச்சிபோல் அழியச் செய்கிறாய்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நீராவி” என்பது எபிரெய மொழியின் ஹெவெல் என்ற சொல்லை வழங்குகிறது. அது மூச்சைப் போன்ற நிலையாமையையோ பிடிபடாத தன்மையையோ குறிக்கிறது; மரபாக “வீண்” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  choice: கண்டனங்களால்
  rationale: בְּ இன் கருவிப்பொருளையும், תוכחה என்பதன் கண்டித்துத் திருத்தும் நுணுக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: עַל עָוֺן
  choice: அக்கிரமத்திற்காக
  rationale: עָוֺן இங்கு ஒழுக்கக் குற்றத்தையும் தண்டித்துத் திருத்துவதற்கான காரணத்தையும் குறிக்கிறது.
- source_word: יִסַּרְתָּ
  choice: தண்டித்துத் திருத்துகிறாய்
  rationale: יסר என்பது வெறும் தண்டனையல்ல, ஒழுங்குபடுத்தும் திருத்தத்தையும் குறிக்கிறது; இணைச்சொல் தமிழில் இரு கூறுகளையும் தெளிவாக்குகிறது.
- source_word: אִישׁ
  choice: ஒரு மனிதனை
  rationale: ஆண்பால் ஒருமை வடிவத்தைப் பிரதிநிதித்துவப் பொதுப்பொருளுடன் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וַתֶּמֶס
  choice: அரித்தழிக்கிறாய்
  rationale: מסס குறிக்கும் தேய்ந்து அழிதலை அந்துப்பூச்சி உருவகத்தோடு இயல்பாக இணைக்கிறது.
- source_word: כָּעָשׁ
  choice: அந்துப்பூச்சிபோல்
  rationale: עָשׁ என்பது உடை முதலியவற்றை அரிக்கும் அந்துப்பூச்சி; உவமையை நேரடியாகக் காக்கிறது.
- source_word: חֲמוּדוֹ
  choice: அவனுக்கு அருமையானதை
  rationale: חמד சார்ந்த இச்சொல் அழகு, விரும்பத்தக்க பொருள், பொக்கிஷம் ஆகிய பரப்பைக் கொள்ளக்கூடும்; பொதுவான 'அருமையானது' அந்தத் திறந்த பொருளைக் காக்கிறது.
- source_word: אַךְ
  choice: நிச்சயமாக
  rationale: இங்குள்ள வலியுறுத்தும் முடிவுரையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הֶבֶל
  choice: வெறும் நீராவி
  rationale: הֶבֶל குறிக்கும் மூச்சு/ஆவி போன்ற நிலையாமை மற்றும் பிடிபடாத தன்மையை உருவகமாகக் காக்கிறது; 'வீண்' என்று மட்டும் கருத்தாக்கவில்லை.
- source_word: כָּל אָדָם
  choice: ஒவ்வொரு மனிதனும்
  rationale: ஆதாம் இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது; தமிழ் 'மனிதன்' ஒருமை பிரதிநிதித்துவ வலிமையைப் பேணுகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: துல்லியப் பொருள் உறுதியற்ற வழிபாட்டு/இசைக் குறிப்பு என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: பொதுப்பொருளுடைய ஆண்பால் மனிதவியல் சொற்கள்
  choice: אִישׁ மற்றும் אָדָם ஆகியவற்றை முறையே 'ஒரு மனிதன்', 'ஒவ்வொரு மனிதனும்' என வழங்குதல்
  alternative: '''ஒருவர்'', ''அனைவரும்'' அல்லது ''மனிதகுலம் முழுவதும்'''
  rationale: எபிரெய ஒருமை பிரதிநிதித்துவ அமைப்பைக் காக்கும் அதேவேளையில், நவீன தமிழில் இச்சொற்கள் மனிதரைப் பொதுவாகக் குறிக்க இயலும்.
- issue: חֲמוּדוֹ என்பதன் பொருள் வரம்பு
  choice: அவனுக்கு அருமையானது
  alternative: அவனுடைய அழகு அல்லது அவனுடைய அரிய உடைமைகள்
  rationale: மூலச்சொல் குறிப்பாக அழகையும் அல்லது விரிவாக விரும்பத்தக்க/மதிப்புமிக்கவற்றையும் குறிக்கலாம்; பிரதான உரையில் ஒன்றை மட்டும் உறுதிப்படுத்தாமல், குறிப்பில் மாற்றுப் பொருள்கள் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவக் கண்ணியத்துடன் வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. கண்டனம், ஒழுக்கத் திருத்தம், அந்துப்பூச்சியால் அரிக்கப்படுதல், நீராவி போன்ற நிலையாமை ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன.
