review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the verse’s principal sequence: divine reproof/discipline because of iniquity, the wasting away of what a person values, and the concluding assertion of universal transience. However, “அந்துப்பூச்சிபோல் அரித்தழிக்கிறாய்” can make God himself sound like the moth and renders the moth’s action too directly; the Hebrew simile is better represented as the wasting away of the valued thing in comparison with a moth’s destructive effect. “தண்டித்துத் திருத்துகிறாய்” also somewhat over-specifies and doubles the disciplinary idea already conveyed by “கண்டனங்களால்.”'
  naturalness: The overall Tamil is readable and appropriately dignified. “அக்கிரமம் காரணமாக” is more idiomatic than “அக்கிரமத்திற்காக,” and “அழியச் செய்கிறாய்” gives a clearer, natural rendering of the causative verb. “நீராவி மட்டுமே” is concise and preserves the concrete, transient image of הֶבֶל.
  terminology: “கண்டனங்களால்” suitably renders reproofs, and “திருத்துகிறாய்” preserves the corrective force of יסר without adding a separate punitive action. “அருமையானது” appropriately retains the lexical breadth of חֲמוּדוֹ. “நீராவி” is a sound modern rendering of הֶבֶל; the note properly records the traditional “வீண்” rendering.
  issues:
  - severity: medium
    issue: The moth simile is syntactically and semantically unclear in the main text.
    rationale: “அந்துப்பூச்சிபோல் அரித்தழிக்கிறாய்” readily reads as though God acts like a moth. The Hebrew depicts the person’s desirable/precious thing as wasting away in a moth comparison. Recasting the clause as “அந்துப்பூச்சி அரிப்பதுபோல் ... அழியச் செய்கிறாய்” preserves the image and avoids assigning the moth’s manner directly to God.
  - severity: low
    issue: “தண்டித்துத் திருத்துகிறாய்” is more expansive than the source.
    rationale: יסר denotes corrective discipline, but the paired Tamil verbs introduce an explicit punishment-plus-correction sequence, while “கண்டனங்களால்” has already supplied the reproof element. “திருத்துகிறாய்” is sufficient and more economical.
  - severity: low
    issue: “அக்கிரமத்திற்காக” is less idiomatic in this causal context.
    rationale: “அக்கிரமம் காரணமாக” clearly and naturally expresses the causal force of עַל עָוֺן.
  revised_text: அக்கிரமம் காரணமாகக் கண்டனங்களால் நீ ஒரு மனிதனைத் திருத்துகிறாய்; அந்துப்பூச்சி அரிப்பதுபோல், அவனுக்கு அருமையானதை அழியச் செய்கிறாய்[a]. நிச்சயமாக, ஒவ்வொரு மனிதனும் நீராவி மட்டுமே[b]. சேலா.
