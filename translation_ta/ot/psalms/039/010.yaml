    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: அகற்றும்
  rationale: இது நேரடியான வேண்டுகோளைக் கூறும் ஏவல் வடிவம். ‘அகற்றும்’ என்பது அதன் வலிமையையும் இறைவனை நோக்கிய மரியாதையான நடையையும் காக்கிறது.
- source_word: מֵעָלַי
  choice: என்மேலிருந்து
  rationale: ‘என்னிடமிருந்து’ என்று பொதுமைப்படுத்தாமல், ‘என்மேலிருந்து’ என மூலத்தின் இடவியல் உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: נִגְעֶךָ
  choice: உமது வாதையை
  rationale: נגע என்பது வாதை, அடி, பீடை போன்ற பொருள்களை ஏற்கக்கூடியது. ‘வாதை’ நோயையோ தண்டனையின் குறிப்பிட்ட வடிவையோ தேவையின்றி வரையறுக்காமல் பரந்த பொருளைக் காக்கிறது.
- source_word: מִתִּגְרַת
  choice: தாக்குதலால்
  rationale: תִּגְרָה பகைமை, மோதல் அல்லது வலிமையான தாக்குதல் என்ற அரிதான சொல்லாகும். ‘உமது கை’ என்பதோடு ‘தாக்குதலால்’ என்பது அதன் கடுமையான அழுத்தத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָדְךָ
  choice: உமது கையின்
  rationale: இறைவனுடைய செயல் அல்லது வல்லமையைக் குறிக்கும் மனிதவுருவகமான ‘கை’ மூலத்தில் இருப்பதுபோலவே காக்கப்படுகிறது.
- source_word: אֲנִי כָלִיתִי
  choice: நான் முற்றிலும் அழிந்துபோனேன்
  rationale: כלה என்பதன் நிறைவடைதல், தீர்ந்துபோதல், அழிந்துபோதல் ஆகிய பொருள் வரம்பை இது வெளிப்படுத்துகிறது; வெளிப்படையாக உள்ள ‘நான்’ என்பதும் வலியுறுத்தலுக்காகக் காக்கப்படுகிறது.
theological_decisions:
- issue: נִגְעֶךָ குறிக்கும் வாதையின் இயல்பு
  choice: இறைவனிடமிருந்து வந்த ‘உமது வாதை’ என்று மொழிபெயர்க்கப்பட்டது; அது குறிப்பாக நோயா, தண்டனையா என்று வரையறுக்கப்படவில்லை.
  alternative: ‘உமது அடி’ அல்லது ‘உமது பீடை’
  rationale: துன்பம் இறைவனுடைய செயலோடு தொடர்புபடுத்தப்படுகிறது; ஆனால் அதன் துல்லியமான வடிவத்தை வசனம் கூறவில்லை. எனவே மூலத்தின் இறையியல் அழுத்தமும் தெளிவின்மையும் காக்கப்படுகின்றன.
- issue: מִתִּגְרַת יָדְךָ என்பதில் இறைவனுடைய கையின் செயல்
  choice: ‘உமது கையின் தாக்குதலால்’ என்று மனிதவுருவகத்தையும் கடுமையையும் காக்கப்பட்டது.
  alternative: ‘உமது கையின் அடியால்’ அல்லது ‘உமது கையின் பகைமையால்’
  rationale: மூலச் சொல் நேரடியான ‘அடி’ என்பதைவிட மோதல் அல்லது பகைமையான தாக்குதல் என்ற பரப்பைக் கொண்டுள்ளது. ‘தாக்குதல்’ அதைக் காக்கிறது; இது இறைவனுடைய நோக்கத்தை அதற்கு மேல் விளக்குவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நடையும் சாதாரண வாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. இறைவனை நோக்கி ‘உமது’ மற்றும் மரியாதை ஏவலான ‘அகற்றும்’ பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் கை உருவகமும் ‘என்மேலிருந்து’ என்ற இடவியல் நுணுக்கமும் காக்கப்பட்டுள்ளன.
