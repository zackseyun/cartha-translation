revisions:
- from: உமது வாதையை என்மேலிருந்து அகற்றும்[a]; உமது கையின் தாக்குதலால்[b] நான் முற்றிலும் அழிந்துபோனேன்[c].
  to: உமது வாதையை என்மேலிருந்து அகற்றும்[a]; உமது கையின் தாக்குதலால்[b] நான் தேய்ந்துபோனேன்[c].
  rationale: The revision narrows only the final rendering. ‘தேய்ந்துபோனேன்’ naturally conveys the psalmist’s being worn down or spent, preserves the lament’s force, and avoids making the speaker’s destruction more definite than the Hebrew does. The first clause, the ‘hand’ metaphor, and the rendering of the hostile pressure as ‘தாக்குதல்’ are retained.
