  text: Remove your plague from me[d][c][b][a]; by the blow of your hand I am consumed.
translation:
  language: ta
  text: உமது வாதையை என்மேலிருந்து அகற்றும்[a]; உமது கையின் தாக்குதலால்[b] நான் தேய்ந்துபோனேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வாதை’ என்பதற்கு ‘அடி’ அல்லது ‘பீடை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமது கையின் அடியால்’; ‘உமது கையின் பகைமையால்’ என்பதும் சாத்தியம்.
    reason: lexical_alternative
  - marker: c
