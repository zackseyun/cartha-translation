    reason: lexical_alternative
  - marker: c
    text: “சேலா” என்பதன் துல்லியமான பொருளும் செயல்பாடும் உறுதியாகத் தெரியவில்லை; அது ஒருவகை இசை அல்லது வழிபாட்டு குறியீடாக இருக்கலாம்.
    reason: textual_or_liturgical_uncertainty
