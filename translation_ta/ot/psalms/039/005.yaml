  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though standing firm, is altogether vapor[c][b]. Selah
translation:
  language: ta
  text: இதோ, என் நாட்களின் அளவைச் சில கைஅகலங்களாக நீ வைத்திருக்கிறாய்; என் வாழ்நாள் உனக்கு முன்பாக ஒன்றுமில்லாததுபோல் இருக்கிறது. ஒவ்வொரு மனிதனும் உறுதியாக நின்றாலும், வெறும் மூச்சுக்காற்றே[a][b]. சேலா.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மூச்சுக்காற்று” என்பதற்கு “நீராவி,” “வெறும் மூச்சு,” அல்லது “நிலையற்றது” என்றும் பொருள் கொள்ளலாம்; எபிரேயச் சொல் பிடிபடாததும் விரைவில் மறைவதுமான ஒன்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
