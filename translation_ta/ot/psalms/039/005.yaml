- source_word: כָּל הֶבֶל
  choice: முற்றிலும் நீராவியே
  rationale: הֶבֶל என்பதன் நிலையற்ற, பிடிபடாத concrete உருவகத்தைத் தக்கவைக்கிறது; כָּל என்பதின் முழுமைப்படுத்தும் வலிமையை ‘முற்றிலும்’ தெரிவிக்கிறது.
- source_word: כָּל אָדָם
  choice: ஒவ்வொரு மனிதனும்
