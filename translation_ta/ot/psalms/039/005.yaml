theological_decisions:
- issue: אָדָם மனிதகுலத்தைப் பொதுவாகக் குறிக்கும் விதம்
  choice: ஒவ்வொரு மனிதனும்
  alternative: ஒவ்வோர் ஆணும் / மனிதகுலம் முழுவதும்
  rationale: இங்கு ஆண் பாலினத்தை மட்டும் அல்லாமல் ஒவ்வொரு மனிதரையும் குறிக்கும் பொதுப்பயன்பாடு உள்ளது; ‘ஒவ்வொரு மனிதனும்’ ஒருமை சார்ந்த பொதுத்தன்மையைத் தக்கவைக்கிறது.
- issue: נִצָּב என்பதன் தொடர்பும் நுணுக்கமும்
  choice: உறுதியாக நிற்பவனாயினும்
  alternative: நிற்கும் நிலையில் / நிலைபெற்றிருக்கும்போது
  rationale: ஒருவன் பாதுகாப்பாக அல்லது நிலையாகத் தோன்றினாலும் நீராவியே என்ற முரண்பாட்டை வெளிப்படுத்துகிறது; ஆனால் இதை மட்டும் சாத்தியமான வாசிப்பாக அடிக்குறிப்பில் குறிக்கிறது.
- issue: הֶבֶל என்பதன் உருவகப் பொருள்
  choice: நீராவி
  alternative: மூச்சு / மாயை / வீண்
  rationale: நிலையின்மை மற்றும் பிடிபடாத தன்மை ஆகியவற்றைத் தரும் மூல உருவகத்தைப் பாதுகாக்கிறது; ‘வீண்’ என்று மட்டும் மொழிபெயர்த்து இறையியல் முடிவை மிகைப்படுத்துவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க கவிதைநடை. ‘உள்ளங்கை அகலங்கள்’ என்ற அளவுருவகமும் ‘நீராவி’ என்ற நிலையின்மை உருவகமும் பாதுகாக்கப்பட்டுள்ளன. இறுதிப் பகுதியில் உள்ள எபிரேயச் சொல் வரிசையைத் தமிழின் இயல்பான தொடரமைப்புக்கு ஏற்ப மாற்றியுள்ளோம்.
