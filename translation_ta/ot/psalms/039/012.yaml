base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
translation:
  language: ta
  text: 'யாவே, என் மன்றாட்டைக் கேளும்;

    என் கூக்குரலுக்குச் செவிசாயும்.

    என் கண்ணீரைக் கேளாதவராய் இராதேயும்[a].

    ஏனெனில், உம்மோடு தங்கும் அந்நியன் நான்;

    என் தந்தையர் அனைவரையும் போலக் குடியிருப்பவன் நான்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கண்ணீரின்போது மௌனமாயிராதேயும்.” எபிரெய வினைச்சொல் ‘மௌனமாயிரு’ என்றும் பொருள்படும்; ஆனால் முந்திய ‘கேளும்’, ‘செவிசாயும்’ என்ற சொற்கள் இங்கு செவிப்புலப் பொருளை ஆதரிக்கின்றன.
    reason: lexical_alternative
  - marker: b
    text: “என் தந்தையர்” என்பதை “என் முன்னோர்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் சொல்லுக்குச் சொல், “என் தந்தையர் அனைவரையும் போல.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה תְפִלָּתִי
  choice: என் மன்றாட்டைக் கேளும்
  rationale: שׁמע என்பதன் நேரடியான வேண்டுகோள் வலிமையையும், תְּפִלָּה என்பதன் ஜெபம்/மன்றாட்டு பொருளையும் இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றீடாக இடாமல், எபிரெய தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: וְשַׁוְעָתִי הַאֲזִינָה
  choice: என் கூக்குரலுக்குச் செவிசாயும்
  rationale: שַׁוְעָה-வின் துயரமிக்க உதவிக் கூக்குரலையும், אזן-ன் செவிகொடுத்தல் என்ற கவித்துவப் படிமத்தையும் காக்கிறது.
- source_word: אֶל דִּמְעָתִי
  choice: என் கண்ணீருக்கு
  rationale: ஒருமை வடிவிலுள்ள ‘கண்ணீர்’ கூட்டுப்பொருளில் வருவதால், தமிழிலும் இயல்பாக அதே படிமம் நிலைநிறுத்தப்படுகிறது.
- source_word: אַל תֶּחֱרַשׁ
  choice: செவிடராய் இராதேயும்
  rationale: חרשׁ என்பது ‘மௌனமாயிரு’ அல்லது ‘செவிடாய் இரு’ எனப் பொருள்படலாம்; முந்திய ‘கேளும்’, ‘செவிசாயும்’ என்ற செவிப்புலப் பின்னணியில் ‘செவிடராய் இராதேயும்’ பொருத்தமாகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: גֵר אָנֹכִי עִמָּךְ
  choice: நான் உம்மோடு அந்நியனாய்த் தங்குகிறேன்
  rationale: גֵר-ன் சொந்த நாட்டுரிமை இல்லாமல் பிறர் நடுவே தங்கும் ஒருவரின் சமூக நிலையை வெளிப்படுத்துகிறது; עִמָּךְ என்பதன் ‘உம்மோடு’ என்ற நேரடித் தொடர்பையும் காக்கிறது.
- source_word: תּוֹשָׁב
  choice: குடியிருக்கும் அயலான்
  rationale: ஒரு இடத்தில் வசித்தாலும் முழு சொந்த உரிமை இல்லாத குடியிருப்பாளரைச் சுட்டுகிறது; முந்திய גֵר என்பதோடு முற்றிலும் ஒன்றாக்காமல் வேறுபடுத்துகிறது.
- source_word: כְּכָל אֲבוֹתָי
  choice: என் தந்தையர் அனைவரையும் போலவே
  rationale: אֲבוֹתָי என்பதன் நேரடியான ஆண்பால் பன்மை ‘என் தந்தையர்’ என்பதைக் காக்கிறது; ‘முன்னோர்’ என்ற இயல்பான மாற்று அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: גֵר மற்றும் תּוֹשָׁב என்ற இணை சமூகநிலைச் சொற்களின் மொழிபெயர்ப்பு
  choice: ‘அந்நியனாய்த் தங்குகிறேன்’ மற்றும் ‘குடியிருக்கும் அயலான்’ என்று வேறுபடுத்துதல்
  alternative: இரண்டையும் ‘அந்நியன்/பரதேசி’ போன்ற ஒரே கருத்தாகச் சுருக்குதல்
  rationale: மனிதன் கடவுளுக்கு முன் நிலையான உடைமையாளன் அல்ல, தற்காலிகமாகத் தங்குகிறவன் என்ற பதற்றத்தைப் பாதுகாத்தபடி, எபிரெயத்தில் உள்ள இரு தொடர்புடைய ஆனால் வேறுபட்ட சமூகநிலைகளையும் காட்டுகிறது.
- issue: עִמָּךְ என்பதன் உறவு
  choice: ‘உம்மோடு’ என்ற நேரடி வடிவம்
  alternative: ‘உம்முடைய முன்னிலையில்’ அல்லது ‘உமது நாட்டில்’
  rationale: இச்சொற்றொடர் கடவுளின் முன்னிலையில் வாழ்வதையோ அவருடைய ஆளுகைக்குள் தங்குவதையோ உணர்த்தக்கூடும். அவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் மூலத்தின் சுருக்கமான தெளிவின்மையைப் பேணுகிறது.
- issue: אֲבוֹתָי என்பதன் பாலின வடிவம்
  choice: முதன்மை உரையில் ‘என் தந்தையர்’
  alternative: ‘என் முன்னோர்’
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் மூதாதையர் சொல்லை முதன்மை உரையில் காக்கிறது; பரந்த இயல்பான பொருளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான கவித்துவ நடையைப் பயன்படுத்துகிறது. ‘மன்றாட்டு’, ‘செவிசாயும்’ போன்ற சொற்கள் பொதுவாகப் புரியக்கூடியவையாகவும் உயர்நடையை மிகைப்படுத்தாதவையாகவும் உள்ளன. கடவுளை நோக்கிய மரியாதைப் பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; எபிரெய வரிகளின் இணைப்போக்கும் காக்கப்பட்டுள்ளது.
