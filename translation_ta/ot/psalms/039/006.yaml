source:
  edition: WLC
  text: אַךְ בְּ/צֶ֤לֶם יִֽתְהַלֶּךְ אִ֗ישׁ אַךְ הֶ֥בֶל יֶהֱמָי֑וּ/ן יִ֝צְבֹּ֗ר וְֽ/לֹא יֵדַ֥ע מִי אֹסְפָֽ/ם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/006.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
translation:
  language: ta
  text: நிச்சயமாக, மனிதன் ஒரு நிழலுருவாகவே நடமாடுகிறான்[a]; நிச்சயமாக, மனிதர்கள் வீணாகவே பரபரக்கிறார்கள்[b]. அவன் செல்வத்தைக் குவிக்கிறான்; அதை யார் சேர்த்துக்கொள்வார் என்று அறியான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிழலுருவாக’—எபிரெயத்தில் சொல்லர்த்தமாக ‘ஓர் உருவத்தில்/பிம்பத்தில்’; ‘வெறும் தோற்றமாக’ அல்லது ‘மாய உருவமாக’ என்றும் பொருள்கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘அவர்கள் பரபரக்கிறார்கள்’ என்று வினை பன்மையில் உள்ளது; முன் வந்த ஒருமை ‘மனிதன்’ என்பதிலிருந்து இங்கு பொதுவாக மனிதர்களைக் குறிப்பதாக இருக்கலாம்.
    reason: grammatical_ambiguity
  - marker: c
    text: எபிரெயத்தில் சொல்லர்த்தமாக ‘அவற்றை யார் சேர்த்துக்கொள்வார்’; ‘அவை’ என்பது அவன் குவித்த உடைமைகளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: நிச்சயமாக
  rationale: இவ்வசனத்தில் இருமுறை வரும் வலியுறுத்தும் இடைச்சொல்லின் அழுத்தத்தையும் கவிதைமிகு மீளுரையையும் காக்கிறது.
- source_word: בְּצֶלֶם
  choice: ஒரு நிழலுருவாகவே
  rationale: צֶלֶם என்பதன் அடிப்படைப் பொருள் ‘உருவம்/பிம்பம்’; இங்கு மனித வாழ்வின் நிலையற்ற, திடமற்ற தோற்றத்தை உணர்த்துவதால் ‘நிழலுருவாக’ என்பது உருவகத்தையும் சூழலையும் இயல்பாகத் தருகிறது.
- source_word: יִתְהַלֶּךְ אִישׁ
  choice: மனிதன் ... நடமாடுகிறான்
  rationale: התהלך இங்கு அங்குமிங்கும் செல்லுதல் அல்லது வாழ்வில் இயங்குதல் என்ற உணர்வைக் கொண்டது. אִישׁ ஒருமை ஆண்பால் வடிவில் மனிதனைப் பொதுவாகக் குறிக்கிறது; ‘மனிதன்’ அதை இயல்பாகப் பிரதிபலிக்கிறது.
- source_word: הֶבֶל
  choice: வீணாகவே
  rationale: הֶבֶל என்பதற்கு ‘மூச்சு,’ ‘வெறுமை,’ ‘வீண்’ ஆகிய பொருள்கள் உண்டு. இங்கு பரபரப்பின் பயனின்மையை வினையடையாகக் காட்டுவதால் ‘வீணாகவே’ பொருத்தமானது.
- source_word: יֶהֱמָיוּן
  choice: மனிதர்கள் ... பரபரக்கிறார்கள்
  rationale: המה என்ற வேர்ச்சொல் இரைச்சல், கலக்கம், பரபரப்பு ஆகியவற்றைக் குறிக்கிறது. எபிரெய வினை பன்மையில் இருப்பதைத் தமிழில் வெளிப்படுத்த ‘மனிதர்கள்’ என்று பொதுப்பன்மை தெளிவாக்கப்பட்டுள்ளது.
- source_word: יִצְבֹּר
  choice: செல்வத்தைக் குவிக்கிறான்
  rationale: צבר என்பது குவித்தல் அல்லது திரட்டுதல். மூலத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், அடுத்துள்ள பன்மைச் சுட்டு திரட்டிய உடைமைகளைக் குறிப்பதால் ‘செல்வம்’ சூழலிலிருந்து தெளிவாக்கப்படுகிறது.
- source_word: וְלֹא יֵדַע
  choice: அறியான்
  rationale: இணைப்புச் சொல்லுடன் வரும் மறுக்கப்பட்ட ידע வினையின் சுருக்கமான கவிதைநடையை ‘அறியான்’ காக்கிறது.
- source_word: מִי אֹסְפָם
  choice: அதை யார் சேர்த்துக்கொள்வார்
  rationale: திரட்டப்பட்ட செல்வம் இறுதியில் யாரிடம் செல்லும் என்ற கருத்தை இயல்பான தமிழில் தருகிறது; மூலத்திலுள்ள ‘அவற்றை’ என்ற பன்மைச் சுட்டு அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אִישׁ என்பதிலுள்ள பிரதிநிதித்துவ ஒருமை ஆண்பால் மொழி
  choice: மனிதன்
  alternative: ஒருவர் / ஒரு நபர்
  rationale: மூலம் ஒருமை ஆண்பால் வடிவின் வழியாக மனித வாழ்வைப் பொதுவாகப் பேசுகிறது. ‘மனிதன்’ அந்த இலக்கண வடிவையும் பொதுமனிதப் பொருளையும் தமிழில் காக்கிறது.
- issue: ஒருமை ‘மனிதன்’ என்பதற்குப் பின் வரும் பன்மை வினை
  choice: மனிதர்கள் ... பரபரக்கிறார்கள்
  alternative: அவன் ... பரபரக்கிறான்
  rationale: எபிரெயத்தில் உள்ள இலக்கண எண்ணிக்கை மாற்றத்தை ஒருமையாக்காமல் காக்கிறது; இது தனி மனிதனிலிருந்து மனிதகுலத்தின் பொதுவான பரபரப்புக்கு நகர்வதாகப் புரிந்துகொள்ளலாம், ஆனால் அந்த விளக்கத்தை உரையில் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நிழலுரு,’ ‘பரபரப்பு,’ ‘குவித்தல்’ ஆகிய சொற்கள் மூலத்தின் உருவகத்தையும் பயனற்ற மனிதச் சுறுசுறுப்பையும் காக்கின்றன. ‘அறியான்’ என்பது சங்ககாலத் தொன்மை அல்லாமல், சங்கீத நடைக்கு ஏற்ற சுருக்கமான உயர்நடை வடிவாகத் தேர்ந்தெடுக்கப்பட்டது.
