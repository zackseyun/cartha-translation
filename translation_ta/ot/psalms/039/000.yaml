  text: For the choir director; according to Jeduthun[a]. A psalm of David[b].
translation:
  language: ta
  text: இசைக்குழுத் தலைவருக்கு; எதுத்தூனின்படி[a]. தாவீதின் சங்கீதம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘எதுத்தூனுக்காக’ அல்லது ‘எதுத்தூனுக்கு.’ சங்கீதத் தலைப்புகளில் வரும் எபிரெய முன்னொட்டு பலவகையான தொடர்புகளைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது ‘தாவீது இயற்றிய.’ எபிரெயத் தலைப்பு சொற்சொல்லாக ‘தாவீதின்’ என உள்ளது; அது ஆசிரியத்துவத்தையோ வேறுவகைத் தொடர்பையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைக்குழுத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்த்தலை மேற்பார்வையிடுபவரைக் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகவும் வழிபாட்டு இசைச் சூழலுக்குப் பொருத்தமாகவும் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: לִידוּתוּן
  choice: எதுத்தூனின்படி
  rationale: לְ என்னும் முன்னொட்டு தொடர்பு, நோக்கம் அல்லது திசையைக் குறிக்கலாம். இங்கு ஓர் இசைமுறை, மரபு அல்லது இசைக்குழுத் தொடர்பைச் சுட்டக்கூடும் என்பதால், உறுதியை மிகைப்படுத்தாமல் ‘எதுத்தூனின்படி’ என வழங்கப்பட்டது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இது இசையுடன் தொடர்புடைய பாடல் வகையைக் குறிக்கும் வழக்கமான தலைப்புச் சொல். தமிழில் பரவலாக அறியப்பட்டதும் இயல்பானதும் ஆகிய ‘சங்கீதம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: சங்கீதத் தலைப்புகளில் לְ என்பது ஆசிரியத்துவம், உரிமை, அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிக்கக்கூடும். இவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் பொதுவான உடைமைத் தொடர்பைத் தக்கவைக்க ‘தாவீதின்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: தாவீதுடன் சங்கீதத்துக்குள்ள தொடர்பின் தன்மை
  choice: ‘தாவீதின்’ என்று பொருள் திறந்த நிலையில் வைக்கப்பட்டது.
  alternative: ‘தாவீது இயற்றிய’ அல்லது ‘தாவீதுக்காக’
  rationale: எபிரெய முன்னொட்டு ஆசிரியத்துவத்தை மட்டும் கட்டாயமாகக் குறிக்காது; ஆகவே மூலத்தில் உள்ள உண்மையான தெளிவின்மை பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், சுருக்கமான சங்கீதத் தலைப்பின் அமைப்பும் மரியாதையான வழிபாட்டு நடையும் காக்கப்பட்டுள்ளன. எதுத்தூன் மற்றும் தாவீது என்பவற்றுக்கு முன் வரும் எபிரெய לְ முன்னொட்டின் பல்பொருள் தன்மை முதன்மை உரையிலும் அடிக்குறிப்புகளிலும் பாதுகாக்கப்பட்டுள்ளது.
