lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: וְ என்ற இணைப்பும் עַתָּה என்ற காலக் குறிப்பும் சேர்ந்து சிந்தனையின் தற்போதைய திருப்பத்தைக் குறிக்கின்றன. தமிழில் இயல்பாகத் தொடங்குவதற்கு ‘இப்போது’ போதுமானது; இணைப்பின் நுணுக்கம் சூழலில் வெளிப்படுகிறது.
- source_word: מַה
  choice: எதற்காக
  rationale: இது வினாப்பெயராக வந்து எதிர்பார்ப்பின் பொருளைக் கேட்கிறது. קוה என்பதுடன் தமிழில் ‘எதற்காகக் காத்திருக்கிறேன்?’ என்பது இயல்பான சொல்லாக்கம்.
- source_word: קִוִּיתִי
  choice: காத்திருக்கிறேன்
  rationale: קוה காத்திருத்தல் மற்றும் நம்பிக்கையோடு எதிர்பார்த்தல் ஆகிய இரு தொடர்புடைய பொருள்களையும் கொண்டது. ‘இப்போது’ என்பதுடன் தற்போதைய நோக்குநிலையை இயல்பாகக் காட்ட ‘காத்திருக்கிறேன்’ பயன்படுத்தப்படுகிறது; ‘நம்பியிருக்கிறேன்’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: கடவுளை நேரடியாக அழைக்கும் மரியாதைக்குரிய தெய்வீகப் பட்டம். விளிப்புமுறையைத் தெளிவாக்க ‘ஆண்டவரே’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: תּוֹחַלְתִּי
  choice: என் நம்பிக்கை
  rationale: இந்தப் பெயர்ச்சொல் நம்பிக்கை அல்லது எதிர்பார்ப்பைக் குறிக்கிறது. சூழலில் இயல்பாகவும் மையப் பொருளைத் தெளிவாகவும் தருவது ‘என் நம்பிக்கை’.
- source_word: לְךָ
  choice: உம்மிடமே
  rationale: לְ இரண்டாம் நபர் ஒருமை ஆண்பால் பின்னொட்டுடன் நம்பிக்கையின் நோக்கத்தையும் சார்பையும் குறிக்கிறது. ‘உம்மிடமே’ என்பது கடவுளை நோக்கிய சார்பை இயல்பான தமிழில் தெரிவிப்பதுடன் வலியுறுத்தலையும் காக்கிறது.
- source_word: הִיא
  choice: இருக்கிறது
  rationale: பெண்பால் பெயர்ச்சொல்லான תּוֹחַלְתִּי-ஐ மீண்டும் சுட்டும் சுட்டுப்பெயர் இங்கு இணைப்புவினைச் செயல்பாட்டைக் கொண்டுள்ளது. தமிழில் ‘இருக்கிறது’ என இயல்பாக வெளிப்படுகிறது.
theological_decisions:
- issue: אֲדֹנָי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: என் ஆண்டவரே
  rationale: אֲדֹנָי இங்கு கடவுளுக்கான வழக்கமான மரியாதைப் பட்டமாகவும் நேரடி அழைப்பாகவும் உள்ளது. தனிப்பட்ட உரிமையைத் தேவையின்றி வலுப்படுத்தாமல் பட்டத்தையும் விளிப்பையும் காக்க ‘ஆண்டவரே’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. கடவுளை நோக்கிய மரியாதையை ‘உம்மிடமே’ மற்றும் ‘ஆண்டவரே’ காக்கின்றன. முதல் வாக்கியத்தில் காத்திருத்தலும் இரண்டாவது வாக்கியத்தில் நம்பிக்கையும் இடம்பெறுவதால் எபிரெயச் சொல்லாட்டத்தின் தொடர்பு பகுதியளவில் பாதுகாக்கப்படுகிறது.
