    text: 'மாற்றாக, இன்னும் சொற்சார்பாக: “இப்போதோ, ஆண்டவரே, நான் எதற்காக நம்பிக்கையுடன் காத்திருந்தேன்? என் நம்பிக்கை உம்மிடமே உள்ளது.” எபிரெய வினைச்சொல் קוה, காத்திருத்தல் மற்றும் நம்பிக்கையுடன் எதிர்பார்த்தல் ஆகிய இரு பொருள்களையும் தரக்கூடும்.'
