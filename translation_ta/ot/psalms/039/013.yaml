- from: என்னைவிட்டு உமது பார்வையைத் திருப்பும்[a]; நான் போய் இல்லாமற்போவதற்கு முன் மீண்டும் தெம்படையட்டும்.
  to: என்னிடமிருந்து உமது பார்வையைத் திருப்பிக்கொள்ளும்; நான் போய் இல்லாமற்போவதற்கு முன் மீண்டும் தெம்படையும்படி.[a]
