  text: Look away from me[a], so that I may smile again before I go and am no more.
translation:
  language: ta
  text: என்னிடமிருந்து உமது பார்வையைத் திருப்பிக்கொள்ளும்; நான் போய் இல்லாமற்போவதற்கு முன் மீண்டும் தெம்படையும்படி.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மீண்டும் முகமலர்ச்சி பெறும்படி” அல்லது “மீண்டும் புத்துணர்ச்சி பெறும்படி.” எபிரெய வினைச்சொல் நிம்மதி, புத்துணர்ச்சி, அல்லது மீண்ட ஒளிர்வு ஆகிய கருத்துகளைத் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁע
  choice: உமது பார்வையைத் திருப்பும்
  rationale: இச்சூழலில் வரும் ஆண்பால் ஒருமை ஏவல் வடிவம், தம்மீது நோக்குவதை அல்லது துன்புறுத்தும் கவனத்தை நிறுத்தும்படி கடவுளிடம் வேண்டுகிறது. தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருக்க மரியாதை ஏவல் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מִמֶּנִּי
  choice: என்னைவிட்டு
  rationale: பிரிவைக் குறிக்கும் מן முன்னிடைச்சொல்லும் முதல் நபர் ஒருமை பின்னொட்டும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளன.
- source_word: וְאַבְלִיגָה
  choice: மீண்டும் தெம்படையட்டும்
  rationale: בלג என்ற வினை இங்கு புத்துணர்வு, நிம்மதி, மனத்தெளிவு அல்லது வலிமை மீட்பு ஆகிய நெருங்கிய கருத்துகளைத் தரக்கூடும். ‘தெம்படையட்டும்’ என்பது உடல்-மன மீட்சியின் பரப்பை இயல்பான தமிழில் காக்கிறது; ‘மீண்டும்’ என்பது மீட்பின் நுண்ணுணர்வை வெளிப்படுத்துகிறது.
- source_word: בְּטֶרֶם
  choice: முன்
  rationale: நிகழ்வொன்றுக்கு முந்திய காலத்தைக் குறிக்கும் எளிய, இயல்பான தமிழ் இணை.
- source_word: אֵלֵךְ
  choice: நான் போய்
  rationale: הלך என்பதன் அடிப்படைப் பொருளான ‘போ’ காக்கப்பட்டுள்ளது. சூழலில் இது இறப்பைக் குறிப்பிட்டாலும், எபிரெயத்தின் மறைமுகமான கவிநடையைத் தெளிவுபடுத்தி மாற்றவில்லை.
- source_word: וְאֵינֶנִּי
  choice: இல்லாமற்போவதற்கு
  rationale: இனி உயிரோடு அல்லது இவ்வுலகில் இல்லாத நிலையைக் குறிக்கும் சொற்றொடரின் இறுதித்தன்மையை இயல்பான தமிழில் தருகிறது; ‘போய் இல்லாமற்போவது’ மூலத்தின் இரு கூறுகளையும் காக்கிறது.
theological_decisions:
- issue: אֵלֵךְ וְאֵינֶנִּי என்பதில் இறப்பை வெளிப்படையாகச் சொல்ல வேண்டுமா
  choice: ‘நான் போய் இல்லாமற்போவதற்கு முன்’ என்று மூலத்தின் மறைமுகச் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘நான் இறந்து மறைவதற்கு முன்’
  rationale: வசனம் இறப்பைத் தெளிவாகச் சுட்டினாலும், எபிரெயம் அதை நேரடியாக ‘இறத்தல்’ என்று கூறவில்லை. கவிதையின் அடக்கமான தொனியையும் உண்மையான சொல்லாட்சியையும் பாதுகாக்க மறைமுக வடிவம் தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வேண்டுதல் நடை. கடவுளை நோக்கிய மரியாதை ஒருமைக்காக ‘உமது’ மற்றும் ‘திருப்பும்’ பயன்படுத்தப்பட்டுள்ளன. வினைச்சொல் தொடரின் கவித்துவமான இறப்பு உருவகம் வெளிப்படையாக விளக்கப்படாமல் காக்கப்பட்டுள்ளது.
