  yaml_path: translation/ot/psalms/039/003.yaml
  text: 'My heart grew hot within me[a]; as I meditated, the fire burned[b]; then I spoke with my tongue:'
translation:
  language: ta
  text: 'என் இதயம் எனக்குள் சூடேறியது; நான் ஆழ்ந்து சிந்தித்தபோது[a], நெருப்பு எரிந்தது[b]; அப்போது என் நாவால் பேசினேன்:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நான் மனத்திற்குள் அசைபோட்டபோது’ அல்லது ‘என் தியானத்தில்.’ எபிரேயச் சொல் உள்ளார்ந்த அசைபோடுதலையோ தியானத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
