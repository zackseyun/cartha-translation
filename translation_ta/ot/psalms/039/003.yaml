    reason: lexical_alternative
lexical_decisions:
- source_word: חַם לִבִּי בְּקִרְבִּי
  choice: என் இதயம் எனக்குள் சூடேறியது
  rationale: חַם என்பதன் நிலைமாற்ற நுட்பத்தை ‘சூடேறியது’ இயல்பாக வெளிப்படுத்துகிறது; ‘இதயம்’ என்ற எபிரேய அகமனித உருவகமும், ‘எனக்குள்’ என்ற உள்ளார்ந்த இடவுணர்வும் காக்கப்படுகின்றன.
- source_word: בַּהֲגִיגִי
  choice: நான் ஆழ்ந்து சிந்தித்தபோது
  rationale: הֲגִיג என்பது உள்ளார்ந்த சிந்தனை, அசைபோடுதல் அல்லது தியானத்தைக் குறிக்கலாம். இங்கு בְּ முன்னொட்டை காலச்சூழலாக எடுத்துக்கொண்டு, நவீன தமிழில் இயல்பான சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
- source_word: תִבְעַר אֵשׁ
  choice: நெருப்பு எரிந்தது
  rationale: בער மற்றும் אֵשׁ இணைப்பு எரிதல் அல்லது பற்றியெரிதல் என்ற உயிரோட்டமான உருவகத்தைத் தருகிறது. முன் வரும் உள்ளார்ந்த சூட்டிலிருந்து நெருப்பாகத் தீவிரமடையும் படிமம் காக்கப்படுகிறது.
- source_word: דִּבַּרְתִּי בִּלְשׁוֹנִי
  choice: அப்போது என் நாவால் பேசினேன்
  rationale: உள்ளார்ந்த கொதிப்பிலிருந்து வெளிப்படையான பேச்சுக்குச் செல்லும் தொடர்ச்சியை ‘அப்போது’ காட்டுகிறது; ‘என் நாவால்’ என்பது எபிரேய உடல் உருவகத்தையும் அதன் வலியுறுத்தலையும் தக்கவைக்கிறது.
