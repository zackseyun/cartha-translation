  text: הֵאִ֣ירוּ בְרָקָ֣י/ו תֵּבֵ֑ל רָאֲתָ֖ה וַ/תָּחֵ֣ל הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/004.yaml
  text: His lightning lights up the world[a]; the earth sees and trembles.
translation:
  language: ta
  text: அவருடைய மின்னல்கள் உலகத்தை ஒளியூட்டுகின்றன; பூமி கண்டு நடுங்குகிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமி கண்டு குலுங்குகிறது.” எபிரெய வினை நடுங்குதல், துடித்தல், அல்லது நிலநடுக்கம்போல் குலுங்குதல் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵאִירוּ
  choice: ஒளியூட்டுகின்றன
  rationale: אור என்பதன் ஹிஃபில் வடிவம் ஒளி உண்டாக்குதல் அல்லது ஒளிரச் செய்தல் என்ற காரணவினைப் பொருளைக் கொண்டது; மின்னல்களை எழுவாயாகக் கொண்ட இச்சூழலில் ‘ஒளியூட்டுகின்றன’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְרָקָיו
  choice: அவருடைய மின்னல்கள்
  rationale: பன்மை பெயர்ச்சொல்லுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி உள்ளது; இது தேவனுடைய மின்னல்களைக் குறிக்கிறது. தமிழில் ‘மின்னல்கள்’ பன்மையை நேரடியாகப் பாதுகாக்கிறது.
- source_word: תֵּבֵל
  choice: உலகம்
  rationale: תבל பொதுவாக மக்கள் வாழும் உலகளாவிய பரப்பைக் குறிக்கிறது; பின்னர் வரும் הָאָרֶץ என்பதிலிருந்து வேறுபாட்டைத் தக்கவைக்க ‘உலகம்’ பொருத்தமானது.
- source_word: רָאֲתָה
  choice: கண்டு
  rationale: இது வடிவத்தில் நிறைவுற்ற செயலைக் குறிக்கும் வினை என்றாலும், எபிரெயக் கவிதையின் உயிரோட்டமான காட்சியைத் தமிழில் தொடர்வினை அமைப்பான ‘கண்டு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַתָּחֵל
  choice: நடுங்குகிறது
  rationale: חול/חיל வேரிலிருந்து வரும் இவ்வினை நடுங்குதல், துடித்தல் அல்லது நிலநடுக்கம்போல் குலுங்குதல் ஆகிய பொருட்களைத் தரலாம். இறைத் தோற்றக் காட்சியில் ‘நடுங்குகிறது’ பொருளை அளவுக்கு மீறிக் குறிப்பாக்காமல் பரந்த உணர்வைப் பாதுகாக்கிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: תבל உடனான இணைப்பும் சங்கீதத்தின் பிரபஞ்சளாவிய சூழலும் இதை உள்ளூர் ‘நாடு’ என்பதற்குப் பதிலாக ‘பூமி’ எனப் புரிந்துகொள்ள ஆதரிக்கின்றன.
theological_decisions:
- issue: இறைத் தோற்றத்தின் பிரபஞ்சளாவிய பரப்பு
  choice: ‘உலகம்’ மற்றும் ‘பூமி’ என்ற வேறுபட்டாலும் ஒன்றையொன்று நிறைவு செய்யும் சொற்கள் மூலம் முழுப் படைப்பையும் பாதிக்கும் காட்சியாக மொழிபெயர்த்தல்
  alternative: הָאָרֶץ என்பதை உள்ளூர் ‘நாடு’ என்று மொழிபெயர்த்தல்
  rationale: கவிதை இணைமையும் சங்கீதத்தின் இறைத் தோற்றச் சூழலும் பிராந்திய அளவைவிட உலகளாவிய பொருளை ஆதரிக்கின்றன; இது கோட்பாட்டுச் சேர்க்கை அல்ல, சொல் மற்றும் சூழல் சார்ந்த முடிவு.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அதைக்’ என்பது மின்னலால் உலகம் ஒளியூட்டப்படுவதை அல்லது அந்த வெளிப்பாட்டைக் பூமி காண்கிறது என்ற மனிதப்பண்பேற்றுக் காட்சியைத் தமிழில் தெளிவாக்குகிறது; மூலத்தின் இறையியல் பதற்றத்தைத் தீர்க்கவில்லை.
