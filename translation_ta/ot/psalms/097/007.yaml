source:
  edition: WLC
  text: יֵבֹ֤שׁוּ כָּל עֹ֬בְדֵי פֶ֗סֶל הַ/מִּֽתְהַלְלִ֥ים בָּ/אֱלִילִ֑ים הִשְׁתַּחֲווּ ל֝/וֹ כָּל אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/007.yaml
  text: Let all who serve carved images be put to shame[a], those who boast in idols; bow down to him, all gods.
translation:
  language: ta
  text: 'செதுக்கப்பட்ட உருவங்களை வழிபட்டு,

    பயனற்ற சிலைகளில் பெருமை கொள்கிற அனைவரும் வெட்கமடையட்டும்;

    தெய்வங்களே[a], நீங்கள் அனைவரும் அவரைப் பணிந்து வணங்குங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “விண்ணுலக உயிர்களே” அல்லது “தூதர்களே.” எபிரெயத்தில் “தெய்வங்களே” என்று உள்ளது. இது பிற இனங்களின் தெய்வங்களை இகழ்ச்சியாகக் குறிப்பிடலாம்; அல்லது ஆண்டவரின் முன்னிலையில் இருக்கும் விண்ணுலக உயிர்களைக் குறிப்பிடலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: வெட்கமடையட்டும்
  rationale: בוש என்பதன் வெட்கம் அல்லது அவமானம் என்ற பொருளையும், இங்கு காணப்படும் வேண்டுகோள்/கட்டளைநிறைந்த வினைவடிவின் வலிமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: עֹבְדֵי
  choice: வழிபடுகிற
  rationale: עבד அடிப்படையில் ‘பணிசெய்தல்’ என்றாலும், இங்கு செதுக்கப்பட்ட உருவங்களுக்குச் செய்யப்படும் சமயச் சேவையைக் குறிப்பதால் ‘வழிபடுகிற’ என்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: פֶסֶל
  choice: செதுக்கப்பட்ட உருவங்கள்
  rationale: פסל என்பது குறிப்பாகச் செதுக்கி உருவாக்கப்பட்ட வழிபாட்டு உருவத்தைக் குறிக்கிறது; பொதுவான ‘சிலை’ என்பதைவிட இந்த மொழிபெயர்ப்பு அதன் உருவாக்க முறையைப் பாதுகாக்கிறது.
- source_word: הַמִּתְהַלְלִים
  choice: பெருமைபாராட்டுகிறவர்கள்
  rationale: הלל என்பதன் இத்பயேல் வடிவம் இங்கு தாங்கள் சார்ந்திருப்பதைப் பற்றிப் பெருமைகொள்வதையோ மேன்மைபாராட்டுவதையோ குறிக்கிறது.
- source_word: בָּאֱלִילִים
  choice: பயனற்ற சிலைகளைப் பற்றி
  rationale: אֱלִילִים என்பது வழிபாட்டுச் சிலைகளைக் குறிப்பதோடு அவற்றின் வெறுமை அல்லது பயனின்மையை இகழ்ச்சியாக உணர்த்துகிறது; ‘பயனற்ற சிலைகள்’ அந்த நுண்ணுணர்வைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: הִשְׁתַּחֲווּ
  choice: பணிந்து வணங்குங்கள்
  rationale: שׁחה உடலைத் தாழ்த்தி மரியாதை அல்லது வழிபாடு செலுத்துவதைச் சுட்டுகிறது; ‘பணிந்து வணங்குங்கள்’ அதன் உடல்சார்ந்த மற்றும் வழிபாட்டுச் சார்ந்த இரு கூறுகளையும் தருகிறது.
- source_word: לוֹ
  choice: அவரை
  rationale: לֹו இங்கு வணக்கத்தின் இலக்கைச் சுட்டுகிறது; ‘அவரைப் பணிந்து வணங்குங்கள்’ என்பது பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: אֱלֹהִים
  choice: தெய்வங்கள்
  rationale: பன்மையான אֱלֹהִים என்பதை நேரடியாக மொழிபெயர்த்து, இது பிற இனங்களின் தெய்வங்களையா அல்லது விண்ணுலக உயிர்களையா குறிக்கிறது என்ற மூலமொழியின் தெளிவின்மையை முதன்மை உரையில் பாதுகாக்கிறது.
theological_decisions:
- issue: כָּל אֱלֹהִים என்பதன் குறிப்பு
  choice: தெய்வங்களே, நீங்கள் அனைவரும்
  alternative: விண்ணுலக உயிர்களே, நீங்கள் அனைவரும்; தூதர்களே, நீங்கள் அனைவரும்
  rationale: எபிரெய உரை நேரடியாக ‘எல்லாத் தெய்வங்களும்’ என்று கூறுகிறது. பிற இனங்களின் தெய்வங்களை நோக்கிய வாதப்பாங்கான கூற்றாகவும், ஆண்டவரின் முன்னிலையில் இருக்கும் விண்ணுலக உயிர்களைக் குறிப்பதாகவும் இதைப் புரிந்துகொள்ள முடியும். இந்த இறையியல் இழுபறியைத் தீர்த்துவிடாமல் ‘தெய்வங்கள்’ என்பது முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் மரியாதைமிக்க தொனியும் காக்கப்பட்டுள்ளன. மூலத்தின் இணைநிலை அமைப்பை வரிப்பிரிப்புகள் தெளிவாக்குகின்றன. அடிக்குறிப்பு குறி அது விளக்கும் ‘தெய்வங்களே’ என்பதன் உடனேயே வைக்கப்பட்டுள்ளது.
