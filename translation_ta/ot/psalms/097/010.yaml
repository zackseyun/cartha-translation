source:
  edition: WLC
  text: אֹהֲבֵ֥י יְהוָ֗ה שִׂנְא֫וּ רָ֥ע שֹׁ֭מֵר נַפְשׁ֣וֹת חֲסִידָ֑י/ו מִ/יַּ֥ד רְ֝שָׁעִ֗ים יַצִּילֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/010.yaml
  text: You who love Yahweh[a], hate evil. He guards the lives of his faithful ones; from the hand of the wicked he delivers them.
translation:
  language: ta
  text: யாவேவை நேசிக்கிறவர்களே, தீமையை வெறுங்கள். தம்முடைய உண்மையுள்ளவர்களின் உயிர்களை[a] அவர் காக்கிறார்; பொல்லாதவர்களின் கையிலிருந்து அவர்களை விடுவிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தம்முடைய பரிசுத்தவான்களின் ஆத்துமாக்களை.” எபிரெயத்தில் நֶפֶשׁ என்பது “உயிர்கள்,” “நபர்கள்,” அல்லது “ஆத்துமாக்கள்” எனவும், חֲסִידָיו என்பது “தம்முடைய உண்மையுள்ளவர்கள்,” “தம்முடைய பக்தியுள்ளவர்கள்,” அல்லது “தம்முடைய பரிசுத்தவான்கள்” எனவும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבֵי יְהוָה
  choice: யாவேவை நேசிக்கிறவர்களே
  rationale: எபிரெயக் கட்டமைப்பு ‘யாவேவை நேசிப்பவர்கள்’ என்று பொருள்படும்; அழைப்பைத் தெளிவாகவும் இயல்பான தமிழிலும் காட்ட விளிவடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர்; ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: שִׂנְאוּ רָע
  choice: தீமையை வெறுங்கள்
  rationale: שִׂנְאוּ என்பது பன்மை ஏவல்வினை; கட்டளையின் நேரடியான வலிமையை மென்மைப்படுத்தாமல், רָע குறிக்கும் பரந்த ஒழுக்கத் தீமையையும் காக்கிறது.
- source_word: שֹׁמֵר
  choice: காக்கிறார்
  rationale: தொடர்ச்சியான அல்லது பண்புசார் பாதுகாப்புச் செயலைக் காட்டும் பங்கேற்புவினை; இச்சூழலில் இயல்பான தமிழ்ச் சொல்.
- source_word: נַפְשׁוֹת
  choice: உயிர்களை
  rationale: இங்கு மனிதரின் உயிர் அல்லது வாழ்வைக் குறிக்கும் பொருள் சூழலுக்கு ஏற்றது; உடலிலிருந்து தனியான ஆத்துமா என்ற பிற்காலக் கருத்தைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: חֲסִידָיו
  choice: தமக்கு உண்மையுள்ளவர்கள்
  rationale: தேவனோடு கொண்ட பற்றுறுதியும் பக்தியும் உடையவர்களைக் குறிக்கிறது; ‘பரிசுத்தவான்கள்’ என்பதைக் காட்டிலும் நவீன வாசகருக்குத் தெளிவாக உறவுசார் உண்மைத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: מִיַּד רְשָׁעִים
  choice: பொல்லாதவர்களின் கையிலிருந்து
  rationale: ‘கை’ என்பது அதிகாரம் அல்லது பிடியைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் அப்படியே காக்கிறது.
- source_word: יַצִּילֵם
  choice: அவர்களை விடுவிக்கிறார்
  rationale: பொல்லாதவர்களின் பிடியிலிருந்து தீவிரமாக மீட்டெடுக்கும் செயலைக் குறிக்கிறது; முன்வரும் ‘கையிலிருந்து’ என்ற சொற்றொடரோடு இயல்பாக இணைகிறது.
theological_decisions:
- issue: נַפְשׁוֹת என்பதன் சூழல்சார் பொருள்
  choice: உயிர்களை
  alternative: ஆத்துமாக்களை; நபர்களை
  rationale: பொல்லாதவர்களிடமிருந்து பாதுகாத்து விடுவிப்பதே சூழல் என்பதால், உயிர் அல்லது வாழ்வு என்ற திடமான பொருள் முன்னுரிமை பெறுகிறது; மனித இயல்பைப் பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டை வசனத்திற்குள் புகுத்துவது தவிர்க்கப்படுகிறது.
- issue: חֲסִידָיו என்பதன் மொழிபெயர்ப்பு
  choice: தமக்கு உண்மையுள்ளவர்கள்
  alternative: தம்முடைய பரிசுத்தவான்கள்; தம்முடைய பக்தியுள்ளவர்கள்; தமக்குப் பற்றுறுதியுள்ளவர்கள்
  rationale: இச்சொல் உடன்படிக்கை சார்ந்த பற்றுறுதியையும் பக்தியையும் தாங்குகிறது. தேர்ந்தெடுக்கப்பட்ட மொழிபெயர்ப்பு இந்த உறவுசார் அம்சத்தை எளிய நவீன தமிழில் வெளிப்படுத்துகிறது; பிற சாத்தியமான நுணுக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடையில் அமைக்கப்பட்டுள்ளது. ‘வெறுங்கள்’ என்ற நேரடிக் கட்டளையும் ‘கை’ என்ற எபிரெய உருவகமும் பாதுகாக்கப்பட்டுள்ளன; தேவனுடைய பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
