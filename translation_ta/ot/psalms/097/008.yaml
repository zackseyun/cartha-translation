  text: Zion heard and rejoiced[a], and the daughters of Judah exulted because of your judgments, O Yahweh.
translation:
  language: ta
  text: 'சீயோன் கேட்டு மகிழ்ந்தது;

    யூதாவின் மகள்கள்[a] உமது நீதித்தீர்ப்புகளினிமித்தம் களிகூர்ந்தார்கள்,

    யாவே!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யூதாவின் பட்டணங்கள்’ அல்லது ‘யூதாவின் கிராமங்கள்.’ எபிரெயத்தில் சொல்லுக்குச் சொல் ‘யூதாவின் மகள்கள்’; இந்தக் கவித்துவச் சொற்றொடர் யூதாவைச் சுற்றியுள்ள குடியிருப்புகளைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה
  choice: அதைக் கேட்டு
  rationale: שׁמע என்பதன் Qal perfect 3fs வடிவம்; பெண்பால் ஒருமை எழுவாயான சீயோனைச் சுட்டுகிறது. எதை கேட்டது என்பது எபிரெயத்தில் வெளிப்படையாகக் கூறப்படாததால், முந்தைய சூழலைச் சுட்டும் பொதுவான ‘அதை’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַתִּשְׂמַח
  choice: மகிழ்ந்தது
  rationale: שׂמח குறிக்கும் மகிழ்ச்சியை இயல்பான தமிழில் தருகிறது; அடுத்துள்ள גיל என்பதன் மிகுதியான களிப்பிலிருந்து சொற்பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: צִיּוֹן
  choice: சீயோன்
  rationale: இடப்பெயர் ஒலிபெயர்ப்பாகத் தக்கவைக்கப்பட்டுள்ளது. இங்கு அது எருசலேமையோ அங்கு மையங்கொண்ட மக்களையோ ஆகுபெயராகக் குறிக்கக்கூடும்; ஆனால் மூலத்தின் பெயரே மொழிபெயர்ப்பில் வைக்கப்பட்டுள்ளது.
- source_word: וַתָּגֵלְנָה
  choice: களிகூர்ந்தார்கள்
  rationale: גיל மிகுந்த, வெளிப்படையான மகிழ்ச்சியை உணர்த்துகிறது. ‘களிகூர்ந்தார்கள்’ என்பது முந்தைய ‘மகிழ்ந்தது’ என்பதைக் காட்டிலும் வலுவான நுண்பொருளைக் காக்கிறது.
- source_word: בְּנוֹת יְהוּדָה
  choice: யூதாவின் மகள்கள்
  rationale: சொல்லுக்கு நெருக்கமான ‘யூதாவின் மகள்கள்’ என்ற கவித்துவ வடிவம் தக்கவைக்கப்பட்டுள்ளது. இது யூதாவின் சுற்றுப்புறப் பட்டணங்களையோ குடியிருப்புகளையோ குறிக்கும் புவியியல் மரபுத்தொடராகவும் இருக்கலாம்; அந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמַעַן
  choice: …ஆல்
  rationale: இச்சூழலில் மகிழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் காரணத்தைக் காட்டும் ‘ஆல்’ வேற்றுமை உருபு இயல்பாக அமைந்துள்ளது.
- source_word: מִשְׁפָּטֶיךָ
  choice: உமது நீதித்தீர்ப்புகள்
  rationale: מִשְׁפָּט என்பது தீர்ப்புகள், நீதி, நீதிச் செயல்கள் ஆகிய பொருள்களைக் கொண்டது. சங்கீதம் 97-ன் சூழலில் கடவுளின் நீதியான தீர்ப்புச் செயல்கள் முன்னிலையில் இருப்பதால் ‘நீதித்தீர்ப்புகள்’ எனத் தரப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரெய இறைப்பெயரான יהוה தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பட்ட உடன்படிக்கைப் பெயராக ஒலிபெயர்ப்பது மூலத்திற்கு வெளிப்படையாக உள்ளது.
- issue: בְּנוֹת יְהוּדָה என்பதை நேரடியாகவா, புவியியல் மரபுத்தொடராகவா புரிந்துகொள்வது
  choice: யூதாவின் மகள்கள்
  alternative: யூதாவின் பட்டணங்கள் / யூதாவின் கிராமங்கள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளும் கவித்துவ ஆற்றலும் முதன்மை உரையில் காக்கப்படுகின்றன. அது சார்ந்த பட்டணங்கள் அல்லது குடியிருப்புகளைக் குறிக்கக்கூடும் என்பதால், தெளிவற்ற தன்மையைத் தீர்த்துவிடாமல் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
