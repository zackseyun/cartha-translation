  text: שִׂמְח֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/012.yaml
  text: Rejoice in Yahweh[a], you righteous ones[b], and give thanks at the remembrance of his holiness.
translation:
  language: ta
  text: நீதிமான்களே, யாவேயில் மகிழுங்கள்; அவருடைய பரிசுத்தத்தை[b] நினைவுகூர்ந்து[a] நன்றி செலுத்துங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவருடைய பரிசுத்தம் குறிப்பிடப்படும்போது.” זֵכֶר என்ற பெயர்ச்சொல் நினைவு, நினைவுச்சின்னம், அல்லது குறிப்பிடுதல் எனப் பொருள்படலாம்.'
    reason: lexical_alternative
  - marker: b
    text: பல மொழிபெயர்ப்புகள் ஒத்த சங்கீதச் சொற்றொடர்களின் தாக்கத்தால் “அவருடைய பரிசுத்த நாமம்” என்று தருகின்றன; ஆனால் இங்குள்ள எபிரேய உரை சொல்லுக்குச் சொல் “அவருடைய பரிசுத்தம்” என்றே கூறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: மகிழுங்கள்
  rationale: שׂמח என்பதன் ஆண்பால் பன்மை ஏவல் வடிவம்; மகிழ்ச்சியுடன் பதிலளிக்க அழைக்கும் கட்டளை வலிமையை இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: צַדִּיקִים
  choice: நீதிமான்களே
  rationale: நீதியால் அடையாளப்படுத்தப்படும் பன்மைக் குழுவை நேரடியாக அழைக்கும் விளிவடிவத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: בַּיהוָה
  choice: யாவேயில்
  rationale: ב குறிக்கும் மகிழ்ச்சியின் ஆதாரம் அல்லது தளத்தைச் சுருக்கமாகக் காக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: וְהוֹדוּ
  choice: நன்றி செலுத்துங்கள்
  rationale: ידה என்பதன் ஹிஃபில் பன்மை ஏவல்; இச்சங்கீதச் சூழலில் நன்றியையும் புகழ்ச்சியையும் வெளிப்படுத்துகிறது. ‘நன்றி செலுத்துங்கள்’ முதன்மைப் பொருளை இயல்பாக வழங்குகிறது.
- source_word: לְזֵכֶר
  choice: நினைவுகூர்ந்து
  rationale: זֵכֶר என்பது நினைவு, நினைவுச்சின்னம், அல்லது குறிப்பிடுதல் எனப் பொருள்படலாம். இங்கு தேவனுடைய பரிசுத்தத்தை நினைவுகூர்வதோடு நன்றி செலுத்துவதை இயல்பான தமிழில் இணைக்கிறது; வேறு சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: קָדְשׁוֹ
  choice: அவருடைய பரிசுத்தத்தை
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘அவருடைய பரிசுத்தம்.’ மூலத்தில் இல்லாத ‘பெயர்’ என்ற சொல்லைச் சேர்க்காமல் இதையே முதன்மை உரையில் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரையில் நான்கு எழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- issue: קָדְשׁוֹ என்பதுடன் ‘பெயர்’ என்பதைச் சேர்க்க வேண்டுமா
  choice: அவருடைய பரிசுத்தம்
  alternative: அவருடைய பரிசுத்த நாமம்
  rationale: இவ்வசனத்தின் எபிரெய உரையில் שֵׁם (‘பெயர்’) இல்லை. ஒத்த சங்கீதச் சொற்றொடர்களின் தாக்கத்தால் அதைச் சேர்க்காமல், மூலத்தின் தனித்த சொற்பொருளையும் இறையியல் அழுத்தத்தையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியத்துடன் நேரடியான பன்மை ஏவல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீதிமான்களே’ நேரடி அழைப்பைத் தெளிவாக்குகிறது; ‘நினைவுகூர்ந்து’ என்பது சொல்லுக்குச் சொல் அமைப்பின் கடினத்தன்மையைத் தவிர்த்து, மூலத்தின் பொருள் வரம்பை அடிக்குறிப்புகளுடன் காக்கிறது.
