  text: Light is sown for the righteous[a], and joy for the upright in heart.
translation:
  language: ta
  text: நீதிமானுக்காக ஒளி விதைக்கப்பட்டுள்ளது[a]; உள்ளத்தில் நேர்மையானவர்களுக்கு மகிழ்ச்சி உண்டு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “நீதிமானுக்காக ஒளி சிதறவிடப்பட்டுள்ளது/நடப்பட்டுள்ளது.” எபிரெயத்தில் வேளாண்மை உருவகம் உள்ளது: ஒளி விதைக்கப்படும் ஒன்றாகச் சித்தரிக்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: ஒளி
  rationale: ஒளி, ஆசீர்வாதம், மீட்பு அல்லது நல்வாழ்வு ஆகியவற்றை உணர்த்தக்கூடிய சங்கீதக் கவிதை உருவகத்தின் அகலத்தைச் சுருக்காமல், அடிப்படைப் பொருளான ‘ஒளி’ என்பதே வைக்கப்பட்டது.
- source_word: זָרֻעַ
  choice: விதைக்கப்பட்டுள்ளது
  rationale: זרע என்பதன் செயல்பாட்டு வினையெச்சம் ‘விதைக்கப்பட்டது’ எனப் பொருள்படும். வேளாண்மை உருவகத்தை ‘ஆயத்தமாக உள்ளது’ அல்லது ‘சேமித்து வைக்கப்பட்டுள்ளது’ என்று விளக்கிப் பரப்பாமல் பாதுகாக்கிறது.
- source_word: לַצַּדִּיק
  choice: நீதிமானுக்காக
  rationale: ל இங்கு நன்மை அல்லது இலக்கைக் குறிக்கிறது. எபிரெய பொதுமைப் பிரதிநிதி ஒருமையைத் தமிழிலும் இயல்பாகத் தக்கவைக்க ‘நீதிமானுக்காக’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּלְיִשְׁרֵי לֵב
  choice: நேர்மையான உள்ளம் கொண்டவர்களுக்கு
  rationale: ‘உள்ளத்தில் நேர்மையானவர்கள்’ என்ற எபிரெய மரபுத்தொடரின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; இரண்டாம் பாதியின் பன்மையும் பாதுகாக்கப்படுகிறது.
- source_word: שִׂמְחָה
  choice: மகிழ்ச்சி
  rationale: ‘ஒளி’ என்பதற்கு இணையாக நிற்கும் சுருக்கமான, இயல்பான கவிதைச் சொல்.
theological_decisions:
- issue: ‘ஒளி’ என்ற உருவகத்தின் பொருள்
  choice: ‘ஒளி விதைக்கப்பட்டுள்ளது’ என்ற உருவகம் அப்படியே தக்கவைக்கப்பட்டது.
  alternative: ‘மீட்பு ஆயத்தமாக உள்ளது,’ ‘நல்வாழ்வு சேமித்து வைக்கப்பட்டுள்ளது’ அல்லது ‘விடுதலை ஏற்பாடு செய்யப்பட்டுள்ளது.’
  rationale: மூலவசனம் ஒளியை மீட்பு, செழிப்பு, நீதி நிலைநாட்டல் ஆகியவற்றில் ஒன்றாக மட்டும் வரையறுப்பதில்லை; உருவகத்தைத் தக்கவைப்பது அதன் இறையியல் அகலத்தையும் கவிதை வலிமையையும் பாதுகாக்கிறது.
- issue: இரண்டாம் அடியில் விடுபட்டுள்ள வினையின் வழங்கல்
  choice: தமிழில் தெளிவுக்காக ‘விதைக்கப்பட்டுள்ளது’ மீண்டும் வழங்கப்பட்டது.
  alternative: ‘நேர்மையான உள்ளம் கொண்டவர்களுக்கு மகிழ்ச்சி’ என்று வினையின்றி விடுதல்.
  rationale: எபிரெயக் கவிதையில் முதல் அடியின் זָרֻעַ இரண்டாம் அடிக்கும் இயல்பாக எடுத்துக்கொள்ளப்படுகிறது. தமிழில் வினையை மீண்டும் கூறுவது பொருளை மாற்றாமல் முழுமையான, இயல்பான வாக்கியத்தை உருவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை பயன்படுத்தப்பட்டது. ‘நீதிமான்’ சங்கீதச் சூழலில் பரவலாகப் புரியப்படும் சொல்; ‘நேர்மையான உள்ளம் கொண்டவர்கள்’ என்பது இயல்பான தமிழில் எபிரெய மரபுத்தொடரைத் தருகிறது. இணை அமைப்பைத் தெளிவாக்க இரண்டாம் அடியில் வினை மீண்டும் கூறப்பட்டது.
