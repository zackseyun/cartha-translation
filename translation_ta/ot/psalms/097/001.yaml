  text: Yahweh reigns[a]; let the earth rejoice; let the many coastlands be glad.
translation:
  language: ta
  text: 'யாவே அரசாளுகிறார்;

    பூமி மகிழட்டும்;

    பல கடலோரப் பகுதிகள்[a] களிகூரட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீவுகள்.” எபிரெயச் சொல் தீவுகளையோ கடல்சார்ந்த கடலோரப் பகுதிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், எபிரெய நான்கெழுத்துத் திருப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מָלָךְ
  choice: அரசாளுகிறார்
  rationale: இவ்வடிவம் அரசராகிய நிலை அல்லது அரசாட்சிக்கு வந்த நிகழ்வு ஆகிய இரண்டையும் சுட்டக்கூடும். சங்கீதத்தின் அறிவிப்பில் தொடரும் அரசாட்சியை இயல்பாகக் கூறும் இந்நிகழ்கால வினை, அரசேற்றத் தொடக்கத்தைத் தேவையின்றி உறுதிப்படுத்துவதில்லை.
- source_word: תָּגֵל
  choice: மகிழட்டும்
  rationale: ‘பூமி’யோடு பொருந்தும் இவ்வினை வடிவத்தை, முன்வரும் அரசாட்சி அறிவிப்புக்குப் பிந்தைய கவித்துவ அழைப்பு அல்லது விருப்ப வினையாக எடுத்துக்கொள்கிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: இணைவரியில் வரும் பல கடற்கரைப் பகுதிகளோடு சேர்ந்து உலகளாவிய பரப்பைக் குறிப்பதால், ‘நாடு’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
- source_word: יִשְׂמְחוּ
  choice: களிகூரட்டும்
  rationale: முந்தைய ‘மகிழட்டும்’ என்பதற்கு இணையான அழைப்பு வினையைத் தக்கவைத்தபடி, தமிழ்க் கவிதை நடையில் தேவையற்ற சொல் மறுபடியையும் தவிர்க்கிறது.
- source_word: אִיִּים
  choice: கடற்கரைப் பகுதிகள்
  rationale: எபிரெயச் சொல் தீவுகளையோ கடல்சார்ந்த கரைப்பகுதிகளையோ குறிக்கலாம். முதன்மை உரையில் பரந்த கடல்சார் பகுதிகளைக் குறிக்கும் இயல்பான தமிழ் சொல்லாட்சி பயன்படுத்தப்பட்டு, ‘தீவுகள்’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: רַבִּים
  choice: பல
  rationale: பெயர்ச்சொல்லை இயல்பாக அடைமொழியாக்கும் நேரடியான அளவுக் குறிப்பு.
theological_decisions:
- issue: யாவேயின் அரசாட்சி அறிவிப்பின் பரப்பு
  choice: உலகெங்கும் நிலவும் யாவேயின் தற்போதைய அரசாட்சியை அறிவித்தல்
  alternative: இஸ்ரவேல் நாட்டை மட்டும் குறிக்கும் அறிவிப்பு; அல்லது ‘யாவே அரசராகியிருக்கிறார்’ என்ற அரசேற்ற நிகழ்வு
  rationale: ‘பூமி’ என்பதும் ‘பல கடற்கரைப் பகுதிகள்’ என்பதும் இணையாக வருவதால் உலகளாவிய பரப்பு தெளிவாகிறது. ‘அரசாளுகிறார்’ என்பது இறை அரசாட்சியை உறுதிப்படுத்தினாலும், அதை ஒரு குறிப்பிட்ட அரசேற்றத் தருணமாக மட்டும் சுருக்குவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் சங்கீதத்துக்குரிய கண்ணியமான கவித்துவச் சுருக்கத்துடனும் அமைக்கப்பட்டது. மூன்று எபிரெயக் கூறுகளின் இணை அமைப்பை வரிப்பிரிப்பும் அரைப்புள்ளிகளும் காக்கின்றன.
