source:
  edition: WLC
  text: אֵ֭שׁ לְ/פָנָ֣י/ו תֵּלֵ֑ךְ וּ/תְלַהֵ֖ט סָבִ֣יב צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/003.yaml
  text: Fire goes before him and burns his adversaries all around[a].
translation:
  language: ta
  text: 'நெருப்பு அவருக்கு முன்னே செல்கிறது;

    சுற்றிலும் அவருடைய எதிரிகளை எரிக்கிறது[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய பகைவர்களை.’
    reason: צָרָיו என்பதற்கான இயல்பான மாற்றுச் சொல்.
lexical_decisions:
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: இது நேரடியாக நெருப்பைக் குறிக்கும் பெயர்ச்சொல்; தமிழ் கவிதை நடையில் தனி எண்ணுப்பெயர்ச் சுட்டு தேவையில்லை.
- source_word: לְפָנָיו
  choice: அவருக்கு முன்னே
  rationale: ‘அவருடைய முகத்துக்கு முன்’ என்ற எபிரெயச் சொற்றொடரின் இயல்பான பொருளைச் சுருக்கமாகவும் கவிதைநயத்துடனும் தருகிறது.
- source_word: תֵּלֵךְ
  choice: செல்கிறது
  rationale: הלך என்பதன் பொதுப் பொருள் ‘செல்/நட’; நெருப்பு எழுவாயாக இருப்பதால் ‘செல்கிறது’ என்பது இயல்பான தமிழ்.
- source_word: וּתְלַהֵט
  choice: எரிக்கிறது
  rationale: להט தீப்பற்றி எரிதல் அல்லது கடும் வெப்பத்தால் எரித்தல் என்ற அழிவாற்றலைக் குறிக்கிறது; மூலத்தில் தெளிவாக இல்லாத முழுமையான அழிவை கூடுதலாகச் சேர்க்காமல் ‘எரிக்கிறது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: எல்லாப் பக்கங்களிலும் நிகழ்வதைக் குறிக்கும் வினையடைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: צָרָיו
  choice: அவருடைய எதிரிகளை
  rationale: צר என்பதன் அடிப்படை உணர்வு எதிர்த்து நிற்பவர்களைக் குறிக்கிறது; ‘எதிரிகள்’ அந்த எதிர்நிலைப் பொருளைப் பாதுகாக்கிறது. ‘பகைவர்கள்’ என்பதும் சாத்தியமான மாற்று.
theological_decisions:
- issue: மூன்றாம் நபர் ஒருமை ஆண்பால் பின்னொட்டுகளின் குறிப்பு
  choice: ‘அவர்/அவருடைய’ என்ற சுட்டுப்பெயர்களையே வைத்தல்
  alternative: ‘யெகோவாவுக்கு முன்னே நெருப்பு செல்கிறது’ என்று இறைப் பெயரை வெளிப்படையாகச் சேர்த்தல்
  rationale: சங்கீதத்தின் சூழல் குறிப்பிடப்படுபவர் யார் என்பதைத் தெளிவாக்கினாலும், இவ்வசனத்தின் எபிரெய உரையில் இறைப் பெயருக்குப் பதிலாக மூன்றாம் நபர் பின்னொட்டுகளே உள்ளன. அவற்றைச் சுட்டுப்பெயர்களாகவே தருவது கவிதை ஓட்டத்தையும் மூலத்தின் மறைமுகக் குறிப்பையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைக் குறிக்கும் சுட்டுப்பெயருக்கு மரியாதைப் பன்மை வடிவம் பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் இல்லாத இறைப் பெயர் சேர்க்கப்படவில்லை.
