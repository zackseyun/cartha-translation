  yaml_path: translation/ot/psalms/097/009.yaml
  text: For you[a], O Yahweh, are Most High over all the earth; you are exalted far above all gods.
translation:
  language: ta
  text: 'ஏனெனில், யாவே, நீரே பூமி முழுவதற்கும் மேலான உன்னதர்;

    எல்லாத் தெய்வங்களுக்கும்[a] மேலாக நீர் மிகவும் உயர்ந்திருக்கிறீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எல்லாத் தெய்வீக உயிர்களுக்கும் மேலாக’ அல்லது ‘எல்லா வானுலக உயிர்களுக்கும் மேலாக.’ எபிரெயச் சொல்லான ‘எலோஹிம்’ சூழலைப் பொறுத்து தெய்வங்கள், தெய்வீக உயிர்கள் அல்லது வானுலக வல்லமைகள் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; சங்கீதத்தின் கருத்தோட்டத்தில் இயல்பான காரண இணைப்பாக உள்ளது.
- source_word: אַתָּה
  choice: நீரே
  rationale: வெளிப்படையாக உள்ள இரண்டாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் ‘-ஏ’ விகுதி காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் தனிப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் ஒலிபெயர்த்து வழங்குகிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதர்
  rationale: உயர்ந்த நிலை மற்றும் மேலாதிக்கம் ஆகிய இரண்டையும் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: עַל כָּל הָאָרֶץ
  choice: பூமி முழுவதற்கும் மேலான
  rationale: பூமி அனைத்தின் மீதான மேலாதிக்கத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: தொடர்ந்து வரும் வினையின் தீவிரத்தை நேரடியாகக் காக்கிறது.
- source_word: נַעֲלֵיתָ
  choice: நீர் உயர்ந்திருக்கிறீர்
  rationale: எபிரெய வினையின் விளைவுநிலை அல்லது நிலைத்த நிலையைக் காட்டும் பொருளைத் தமிழின் நிறைவுநிலை வடிவில் வெளிப்படுத்துகிறது.
- source_word: עַל כָּל אֱלֹהִים
  choice: எல்லாத் தெய்வங்களுக்கும் மேலாக
  rationale: אֱלֹהִים என்பதன் பன்மைப் பொருளையும், யாவேயின் ஒப்பற்ற மேன்மையை வலியுறுத்தும் கவிதைத் தன்மையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றுக்கு நெருக்கமாக உள்ளது.
- issue: இறுதி அடியில் אֱלֹהִים என்பதன் பொருள்
  choice: தெய்வங்கள்
  alternative: தெய்வீக உயிர்கள்; வானுலக உயிர்கள்
  rationale: எபிரெயச் சொல்லின் வெளிப்படையான பன்மையையும், அது சிலைகளையா, பிற மக்களின் தெய்வங்களையா, வானுலக உயிர்களையா குறிக்கிறது என்ற திட்டமிட்ட தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான நடையும் எளிதில் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. கவிதை இணைநிலையும், ‘நீரே’ என்ற வலியுறுத்தலும், இறுதி சொல்லின் பொருள் சார்ந்த தெளிவின்மையும் காக்கப்பட்டுள்ளன.
