base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/006.yaml
  text: The heavens declare his righteousness[a], and all the peoples see his glory.
translation:
  language: ta
  text: 'வானங்கள் அவருடைய நீதியை[a] அறிவிக்கின்றன;

    எல்லா மக்களினங்களும் அவருடைய மகிமையைக் காண்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய நியாயத்தை.” எபிரெயச் சொல் ஒழுக்கநீதியையும் நியாயத்தையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידוּ
  choice: அறிவிக்கின்றன
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ஒன்றை அறியச் செய்தல் அல்லது வெளிப்படையாக அறிவித்தல் என்னும் பொருள் தருகிறது. கவிதையில் தொடரும் உயிரோட்டமான சாட்சியை இயல்பாக வெளிப்படுத்த நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַשָּׁמַיִם
  choice: வானங்கள்
  rationale: שָׁמַיִם என்பது இங்குள்ள பிரபஞ்சம்சார், இறைத்தோற்றப் பின்னணியில் வானுலகப் படைப்பைக் குறிக்கிறது. பன்மை வடிவமும் கவித்துவ உயர்வும் காக்கப்படுகின்றன.
- source_word: צִדְקוֹ
  choice: அவருடைய நீதி
  rationale: צֶדֶק சார்ந்த சொல் ஒழுக்கநேர்மை மற்றும் நியாயத் தீர்ப்பு ஆகிய இரு நுண்பொருள்களையும் தாங்கக்கூடும். ‘நீதி’ இவ்விரண்டையும் ஓரளவு உள்ளடக்கும் இயல்பான தமிழ் சொல்; ‘நியாயம்’ மாற்றுப் பொருளாகக் குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְרָאוּ
  choice: காண்கிறார்கள்
  rationale: எபிரெய நிறைவு வடிவம் கடந்த நிகழ்வாகவும் கவிதையில் உயிரோட்டமான, பொதுவான உண்மையாகவும் புரிந்துகொள்ளப்படலாம். இணைவரியின் நிகழ்கால அறிவிப்போடு இசைய, ‘காண்கிறார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כָל הָעַמִּים
  choice: மக்கள் அனைவரும்
  rationale: עַמִּים பல்வேறு மக்கள் இனங்கள் அல்லது மக்கள்கூட்டங்களைக் குறிக்கிறது. ‘மக்கள் அனைவரும்’ அதன் உலகளாவிய பரப்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அரசியல் நாடுகள் என்ற அளவுக்கு பொருளைக் குறுக்கவில்லை.
- source_word: כְּבוֹדוֹ
  choice: அவருடைய மகிமை
  rationale: கடவுளைக் குறிக்கும் כָּבוֹד, வெளிப்படும் மாட்சியையும் பெருமையையும் குறிக்கிறது. ‘மகிமை’ தமிழில் நிலைபெற்றதும் இச்சூழலுக்கு ஏற்றதுமான சொல்.
theological_decisions:
- issue: צִדְקוֹ குறிக்கும் இறைமையின் ஒழுக்க மற்றும் நீதித்துறை சார்ந்த பண்பு
  choice: அவருடைய நீதி
  alternative: அவருடைய நியாயம்
  rationale: மூலச்சொல் கடவுளின் நேர்மையான இயல்பையும் அவரது நியாயமான செயல்களையும் குறிக்கக்கூடும். முதன்மை உரையில் பரந்த பொருளுடைய ‘நீதி’ வைக்கப்பட்டு, நீதித்தீர்ப்பு சார்ந்த நுண்பொருளை வெளிப்படுத்தும் ‘நியாயம்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் சங்கீதத்துக்குரிய கண்ணியமான கவித்துவமும் பேணப்பட்டுள்ளன. எபிரெய நிறைவு வினைகள், இணைவரிகளின் உயிரோட்டமான பொதுக்கூற்றை வெளிப்படுத்த நிகழ்காலத்தில் மொழிபெயர்க்கப்பட்டுள்ளன.
