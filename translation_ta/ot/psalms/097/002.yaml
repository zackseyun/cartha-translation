lexical_decisions:
- source_word: עָנָן
  choice: மேகம்
  rationale: எபிரெயச் சொல் ஒருமையில் உள்ளது; கவிதைநடையில் கூட்டுப்பொருள் தரும் ஒருமையாக இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: וַעֲרָפֶל
  choice: காரிருளும்
  rationale: அடர்ந்த இருள் அல்லது இருண்ட மந்தாரத்தைக் குறிக்கும் இச்சொல்லின் கனத்த இறைத்தோற்றப் படிமத்தை ‘காரிருள்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: סְבִיבָיו
  choice: அவரைச் சூழ்ந்துள்ளன
  rationale: ‘அவரைச் சுற்றிலும்’ என்ற பொருளை, இரு பெயர்ச்சொற்களுக்கும் பொருந்தும் இயல்பான தமிழ் வினைத்தொடராக வழங்குகிறது.
- source_word: צֶדֶק
  choice: நீதி
  rationale: செம்மை மற்றும் நேர்மையின் பொருளைப் பாதுகாக்கிறது; இணையாக வரும் מִשְׁפָּט என்பதிலிருந்து வேறுபாட்டையும் இயன்றவரை நிலைநிறுத்துகிறது.
- source_word: וּמִשְׁפָּט
  choice: நியாயமும்
  rationale: தீர்ப்பு, நீதி ஒழுங்கு ஆகிய பொருள்களைத் தரும் இச்சொல், அரியணைச் சூழலில் ‘நியாயம்’ என இயல்பாக அமைகிறது.
- source_word: מְכוֹן
  choice: அடித்தளம்
  rationale: நிலையான தளம் அல்லது அஸ்திவாரம் என்ற உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּסְאוֹ
  choice: அவருடைய அரியணையின்
  rationale: ‘அவருடைய அரியணையின் அடித்தளம்’ என்ற எபிரெயச் சார்புத் தொடரைத் துல்லியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறைவன் வெளிப்படுவதிலும் மறைந்திருப்பதிலும் உள்ள இறைத்தோற்றப் படிமம்
  choice: மேகமும் காரிருளும் அவரைச் சூழ்ந்துள்ளன என்ற படிமத்தை மென்மைப்படுத்தாமல் தக்கவைத்தல்
  alternative: அவரை மாட்சியும் மறைபொருளும் சூழ்ந்துள்ளன என்று கருத்துரையாக மொழிபெயர்த்தல்
  rationale: இவ்வசனம் சீனாய் நிகழ்வை நினைவூட்டும் இறைத்தோற்ற மொழியில் கடவுளின் அரசாட்சியைச் சித்தரிக்கிறது. அவர் தம்மை வெளிப்படுத்துகிறவராகவும் மறைந்திருப்பவராகவும் காணப்படும் பதற்றத்தை அருவமான விளக்கமாக மாற்றாமல் மூலப்படிமத்திலேயே வைத்திருக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘காரிருள்’ இறைத்தோற்றப் படிமத்தின் செறிவைத் தக்கவைக்கிறது; ‘நீதி—நியாயம்’ என்ற இணை, எபிரெயச் சொற்களின் பொருள் வேறுபாட்டை தமிழில் இயன்றவரை பாதுகாக்கிறது.
