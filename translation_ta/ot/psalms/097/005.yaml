  text: The mountains melt like wax before Yahweh[b][a], before the Lord of all the earth.
translation:
  language: ta
  text: யாவேக்கு[a] முன்பாகவும், முழுப் பூமியின் ஆண்டவருக்கு முன்பாகவும், மலைகள் மெழுகுபோல் உருகுகின்றன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில்: יהוה. தெய்வீகப் பெயர் இங்கு ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.'
    reason: alternative_reading
  - marker: b
    text: எபிரெயத் தொடர் சொல்லடியாக, ‘முகம்/சந்நிதியிலிருந்து’ என்று பொருள்படலாம்; இயல்பான தமிழில் ‘முன்பாக’ எனத் தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: மலைகள்
  rationale: எபிரெயச் சொல்லின் பன்மையையும் படைப்புலகைச் சித்தரிக்கும் கவித்துவப் படிமத்தையும் நேரடியாகப் பேணுகிறது.
- source_word: כַּדּוֹנַג
  choice: மெழுகைப்போல்
  rationale: כ முன்னொட்டு காட்டும் உவமையை இயல்பான நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: נָמַסּוּ
  choice: உருகுகின்றன
  rationale: வினைச்சொல்லின் ‘உருகுதல்/கரைதல்’ என்ற பொருளைப் பேணுகிறது; கவிதையில் நிறைவுவடிவம் உயிரோட்டமான இறைத் தோற்றக் காட்சியைச் சுட்டுவதால் நிகழ்காலம் இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִלִּפְנֵי
  choice: முன்பாக
  rationale: சொல்லடியாக ‘முகம்/சந்நிதியிலிருந்து’ என்ற இடைச்சொல் தொடரை, இறை முன்னிலையைக் காக்கும் சுருக்கமான இயல்புத் தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பால் தருகிறது.
- source_word: אֲדוֹן
  choice: ஆண்டவர்
  rationale: ‘ஆண்டவர்/எஜமான்’ என்ற பட்டப் பொருள்களில், உயர்ந்த கவிதை நடைக்கும் உலகளாவிய ஆட்சியைக் குறிக்கும் சூழலுக்கும் ‘ஆண்டவர்’ பொருந்துகிறது.
- source_word: כָּל הָאָרֶץ
  choice: பூமி முழுவதின்
  rationale: ‘பூமி முழுவதின் ஆண்டவர்’ என்ற உடைமைத் தொடர்பையும் அதன் உலகளாவிய பரப்பையும் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் தனிப்பட்ட தெய்வீகப் பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் வேறுபாட்டைப் பேணுகிறது; அடுத்துவரும் אֲדוֹן என்ற ‘ஆண்டவர்’ பட்டத்துடனான வேறுபாடும் இதனால் தெளிவாகிறது.
- issue: נָמַסּוּ என்பதன் காலமும் வினைநிலையும்
  choice: உருகுகின்றன
  alternative: உருகின
  rationale: எபிரெய நிறைவுவடிவம் கடந்த நிகழ்வாகவும் புரிந்துகொள்ளப்படலாம்; ஆனால் இக்கவிதை இறை முன்னிலையில் இயற்கை உருகுவதை உயிரோட்டமான பொதுக் காட்சியாக முன்வைப்பதால் நிகழ்காலம் தேர்ந்தெடுக்கப்பட்டது.
