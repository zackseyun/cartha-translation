  text: כִּ֤י כִ/גְבֹ֣הַּ שָׁ֭מַיִם עַל הָ/אָ֑רֶץ גָּבַ֥ר חַ֝סְדּ֗/וֹ עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/011.yaml
  text: For as high as the heavens are above the earth[a], so great is his steadfast love toward those who fear him.
translation:
  language: ta
  text: ஏனெனில், வானங்கள் பூமிக்கு மேலே எவ்வளவு உயரமாக இருக்கின்றனவோ, அவருக்கு அஞ்சுகிறவர்கள்மேல் அவருடைய மாறாத அன்பும்[a] அவ்வளவு வலிமையாயிருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடைய இரக்கம்’ அல்லது ‘அவருடைய உடன்படிக்கை விசுவாசம்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் חֶסֶד, உடன்படிக்கை உறவிற்குள் வெளிப்படும் விசுவாசமுள்ள, நிலைத்த அன்பையும் இரக்கத்தையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பாக இங்கு வருகிறது.
- source_word: כִגְבֹהַּ שָׁמַיִם עַל־הָאָרֶץ
  choice: வானங்கள் பூமிக்கு மேலாக எவ்வளவு உயர்ந்திருக்கின்றனவோ
  rationale: כְּ ஒப்புமையின் அளவைக் குறிக்கிறது; எபிரெய உரையின் உயரம் சார்ந்த கவித்துவ ஒப்புமையையும் שָׁמַיִם என்பதன் பன்மை வடிவத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: גָּבַר
  choice: அவ்வளவு வல்லமையுடன் விளங்குகிறது
  rationale: இந்த வினை வலிமைபெறுதல், மேலோங்குதல், வல்லமையாயிருத்தல் ஆகிய பொருள்களைக் கொண்டது. வானங்களின் உயரத்துடன் ஒப்பிடப்படும் அன்பின் அளப்பரிய வலிமையைத் தமிழில் வெளிப்படுத்துகிறது; போராட்டத்தில் வெல்வது என்ற தேவையற்ற கருத்தைச் சேர்க்கவில்லை.
- source_word: חַסְדּוֹ
  choice: அவருடைய மாறாத அன்பு
  rationale: חֶסֶד என்பது அன்பு, இரக்கம், உறுதியான விசுவாசம் ஆகியவற்றை ஒருங்கே சுமக்கும் செறிவான சொல். ‘மாறாத அன்பு’ அதன் நிலைத்த உறவுசார் தன்மையை வாசிக்க எளிய நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: עַל־יְרֵאָיו
  choice: அவருக்கு அஞ்சுகிறவர்கள்மேல்
  rationale: עַל உறவின் நோக்கைச் சுட்டுகிறது; יְרֵאָיו அவரிடம் பயபக்தியுடன் அஞ்சுவோரைக் குறிக்கிறது. ‘அஞ்சுகிறவர்கள்’ என்ற சொல் மூலத்தின் நேரடியான வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: உடன்படிக்கைச் சூழலில் חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: அவருடைய மாறாத அன்பு
  alternative: அவருடைய இரக்கம்; அவருடைய உடன்படிக்கை விசுவாசம்; அவருடைய பேரன்பு
  rationale: ‘மாறாத அன்பு’ என்பது பாசத்தையும் நிலைத்த விசுவாசத்தையும் இணைத்துக் காட்டுகிறது; ஒரே ஒரு இறையியல் நுட்பத்துக்குள் சொல்லைச் சுருக்காமல் அதன் பொருள் பரப்பைத் தக்கவைக்கிறது.
- issue: יְרֵאָיו என்பதில் உள்ள ‘பயம்’ மற்றும் ‘பயபக்தி’ சார்ந்த பதற்றம்
  choice: அவருக்கு அஞ்சுகிறவர்கள்
  alternative: அவரைப் பயபக்தியுடன் மதிக்கிறவர்கள்
  rationale: ‘அஞ்சுகிறவர்கள்’ என்பது மூலச்சொல்லின் நேரடித் தீவிரத்தைப் பாதுகாக்கிறது. இது வெறும் திகிலைக் குறிப்பதாகக் கட்டுப்படுத்தப்படாமல், சங்கீதச் சூழலில் பயபக்தியையும் உள்ளடக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாயும் சங்கீதத்திற்குரிய கண்ணியமான கவித்துவ நடையுடனும் வடிவமைக்கப்பட்டது. ‘வானங்கள்’ என்ற பன்மையும் உயரம்–வல்லமை ஒப்புமையும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறிப்புக் குறி அது விளக்கும் ‘மாறாத அன்பு’ என்பதன் பின்னர் வைக்கப்பட்டுள்ளது.
