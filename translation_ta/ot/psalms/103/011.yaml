- from: ஏனெனில், வானங்கள் பூமிக்கு மேலாக எவ்வளவு உயர்ந்திருக்கின்றனவோ, அவருக்கு அஞ்சுகிறவர்கள்மேல் அவருடைய மாறாத அன்பும்[a] அவ்வளவு வல்லமையுடன் விளங்குகிறது.
