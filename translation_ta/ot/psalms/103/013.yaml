  text: כְּ/רַחֵ֣ם אָ֭ב עַל בָּנִ֑ים רִחַ֥ם יְ֝הוָ֗ה עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/013.yaml
  text: As a father has compassion on his children[a], so Yahweh has compassion on those who fear him.
translation:
  language: ta
  text: ஒரு தந்தை தன் பிள்ளைகள்மேல் இரக்கம் காட்டுவதுபோல்[a], யாவே தமக்கு அஞ்சுகிறவர்கள்மேல் இரக்கம் காட்டுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு தந்தை தன் மகன்களுக்காக மனமிரங்குவதுபோல், யாவே தமக்கு அஞ்சுகிறவர்களுக்காக மனமிரங்குகிறார்.”
    reason: בָּנִים என்பதன் நேரடியான ‘மகன்கள்’ என்ற வடிவத்தையும், רחם என்பதற்கான ‘மனமிரங்குதல்’ என்ற நெருக்கமான மாற்றுச் சொல்லையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: כְּ/רַחֵם
  choice: இரக்கம் காட்டுவதுபோல்
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது; רחם ஆழ்ந்த பரிவையும் கனிவான இரக்கத்தையும் குறிக்கிறது. இந்தத் தமிழாக்கம் ஒப்புமையையும் இயல்பான நவீன நடையையும் காக்கிறது.
- source_word: אָב
  choice: ஒரு தந்தை
  rationale: குறிப்பிட்ட ஒருவரை அல்லாமல் பொதுவான தந்தை–பிள்ளை உறவைச் சுட்டும் ஒருமை என்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל
  choice: மேல்
  rationale: רחם என்பதுடன் வரும் עַל இரக்கத்தின் இலக்கைச் சுட்டுகிறது; தமிழில் ‘ஒருவர்மேல் இரக்கம் காட்டுதல்’ இயல்பான பயன்பாடு.
- source_word: בָּנִים
  choice: தன் பிள்ளைகள்
  rationale: இலக்கண வடிவம் ஆண்பால் பன்மையாக இருந்தாலும், இக்குடும்ப ஒப்புமையில் அது ஒருவரின் சந்ததியினரைப் பொதுவாகக் குறிக்கிறது. ‘தன்’ என்பது தந்தையுடனான உறவைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: רִחַם
  choice: இரக்கம் காட்டுகிறார்
  rationale: முதல் அடியில் உள்ள רחם என்பதற்குப் பயன்படுத்திய அதே சொல்லாட்சியைத் தொடர்ந்து, எபிரெயக் கவிதையின் மறுபதிப்பைச் சீராகக் காக்கிறது; சூழலில் இது நிலையான பொதுவுண்மையைத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יְרֵאָיו
  choice: தமக்கு அஞ்சுகிறவர்கள்
  rationale: இந்த வடிவம் யாவேக்கு அஞ்சுவதைத் தங்கள் நிலையான பண்பாகக் கொண்டவர்களைக் குறிக்கிறது. ‘அஞ்சுகிறவர்கள்’ என்பது எபிரெயச் சொல்லின் நேரடியான வலிமையைத் தக்கவைக்கிறது; ‘மதிக்கிறவர்கள்’ என மென்மையாக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, தனிப்பட்ட தெய்வீகப் பெயரே உள்ளது. எனவே அதை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது; ‘யாவே’ என்பது எபிரெயப் பெயரின் ஏற்றுக்கொள்ளப்பட்ட மீளமைக்கப்பட்ட உச்சரிப்பைத் தமிழில் பிரதிபலிக்கிறது.
- issue: בָּנִים என்பதிலுள்ள பாலினம் சார்ந்த குடும்பச் சொல்
  choice: பிள்ளைகள்
  alternative: மகன்கள்
  rationale: ஆண்பால் பன்மை வடிவம் இங்கு தந்தையின் சந்ததியினரைப் பொதுவாகக் குறிக்கிறது. ஆகவே ‘பிள்ளைகள்’ என்பது குறிப்பை ஆண் மக்களுக்கு மட்டும் தேவையின்றிக் குறுக்காமல் மூலத்தின் சூழல்சார் பொருளைத் தருகிறது; நேரடியான ‘மகன்கள்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையையும் கவிதை ஒப்புமையின் எளிமையையும் காக்கும் நடை. ‘இரக்கம் காட்டுதல்’ இரு அடிகளிலும் மீண்டும் வருவதால் எபிரெய மூலத்தின் கவிதை ஒத்திசைவு பாதுகாக்கப்பட்டுள்ளது; யாவேக்கு மரியாதை ஒருமையைக் காட்ட ‘தமக்கு’ பயன்படுத்தப்பட்டுள்ளது.
