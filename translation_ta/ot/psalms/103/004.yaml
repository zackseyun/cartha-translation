  text: הַ/גּוֹאֵ֣ל מִ/שַּׁ֣חַת חַיָּ֑יְ/כִי הַֽ֝/מְעַטְּרֵ֗/כִי חֶ֣סֶד וְ/רַחֲמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/004.yaml
  text: who redeems your life from the pit[a], who crowns you with steadfast love and compassion[b],
translation:
  language: ta
  text: குழியிலிருந்து[a] உன் உயிரை மீட்கிறவர்; மாறாத அன்பினாலும் இரக்கத்தினாலும்[b] உனக்கு முடிசூட்டுகிறவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அழிவிலிருந்து’ அல்லது ‘கல்லறையிலிருந்து.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘இரக்கங்களினாலும்’; அல்லது, ‘கனிவான இரக்கங்களினாலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹאֵל
  choice: மீட்கிறவர்
  rationale: גאל என்பதன் மீட்டல், மீட்டுக்கொள்ளுதல் என்ற வினை வலிமையையும் அதன் விடுவிப்பு சார்ந்த நயத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מִשַּׁחַת
  choice: குழியிலிருந்து
  rationale: שׁחת என்பதற்கான மிக நேரடியான, உருவகத் தன்மையைத் தக்கவைக்கும் பொருள் ‘குழி’; அழிவு அல்லது கல்லறை என்ற சாத்தியங்களைக் குறிப்பு பாதுகாக்கிறது.
- source_word: חַיָּיִכִי
  choice: உன் உயிரை
  rationale: இங்கு חַיִּים ஒருவருடைய முழு உயிர்வாழ்வைக் குறிக்கிறது; ‘ஆத்துமா’ என்று மொழிபெயர்ப்பது மூலத்தில் கட்டாயமில்லாத உடலற்ற பொருளைச் சேர்க்கக்கூடும்.
- source_word: הַמְעַטְּרֵכִי
  choice: உனக்கு முடிசூட்டுகிறவர்
  rationale: עטר என்பதன் முடிசூட்டுதல் அல்லது கௌரவத்தால் சூழ்தல் என்ற கவிதை உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் அளிக்கிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: חסד-இல் உள்ள பற்றுறுதியும் நிலைத்த அன்பும் வாசிக்க எளிய நவீன தமிழில் வெளிப்படுகின்றன; உடன்படிக்கை என்ற கருத்தை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: וְרַחֲמִים
  choice: இரக்கம்
  rationale: எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், தமிழில் ‘இரக்கம்’ என்ற திரள்பொருள் ஒருமை இயல்பாக இருந்து பரிவும் கருணையும் கொண்ட கருத்தைத் தருகிறது; பன்மை நயம் குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: மீட்பு உருவகத்தின் வரம்பு
  choice: மரண ஆபத்து அல்லது அழிவிலிருந்து கிடைக்கும் வாழ்வியல் மீட்பை விரிவான கவிதை மொழியில் வைத்திருக்கிறது.
  alternative: கல்லறையிலிருந்து மீட்பு என்று மட்டும் குறிப்பிடுதல்; அல்லது ஆன்மீக இரட்சிப்பு என்று மட்டும் குறிப்பிடுதல்.
  rationale: שׁחת என்பது குழி, அழிவு, கல்லறை ஆகிய பொருட்களைத் தாங்கக்கூடும். ஆகவே வசனத்தை உடல் சார்ந்த விடுதலைக்கோ இறுதி இரட்சிப்புக்கோ மட்டும் கட்டுப்படுத்தாமல் அதன் இறையியல் நெருக்கடியையும் அகலத்தையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகருக்குப் புரியும் கண்ணியமான கவிதைநடை. எபிரெய மூலத்தின் இணையான இரு செயற்பெயரெச்ச அமைப்புகளும் தமிழில் ‘மீட்கிறவர் / முடிசூட்டுகிறவர்’ என்று காக்கப்பட்டுள்ளன; பாலினக் குறியுடைய இரண்டாம் நபர் ஒருமை தமிழில் இயல்பாக ‘உன்’ என வழங்கப்பட்டுள்ளது.
