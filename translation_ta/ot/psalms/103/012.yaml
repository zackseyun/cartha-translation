    issue: The alternative gloss ‘கலகங்கள்’ is less broadly suitable for פשע.
    rationale: ‘கிளர்ச்சிகள்’ more directly reflects the lexical alternative ‘rebellions’; ‘குற்றங்கள்’ may remain for ‘offenses.’
