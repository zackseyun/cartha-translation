  text: כִּ/רְחֹ֣ק מִ֭זְרָח מִֽ/מַּֽעֲרָ֑ב הִֽרְחִ֥יק מִ֝מֶּ֗/נּוּ אֶת פְּשָׁעֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/012.yaml
  text: As far as the east is from the west[b][a], so far he has removed our transgressions from us.
translation:
  language: ta
  text: கிழக்கு மேற்கிலிருந்து எவ்வளவு தொலைவில் இருக்கிறதோ, அவ்வளவு தூரமாக அவர் நம் மீறுதல்களை[b] நம்மிடமிருந்து அகற்றியிருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் நம் மீறுதல்களை நம்மிடமிருந்து வெகுதூரத்தில் வைத்திருக்கிறார்.’
    reason: lexical_alternative
  - marker: b
    text: ‘மீறுதல்கள்’ என்று மொழிபெயர்க்கப்பட்ட சொல் ‘கிளர்ச்சிகள்’ அல்லது ‘குற்றங்கள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְחֹק
  choice: எவ்வளவு தொலைவில் இருக்கிறதோ, அவ்வளவு தொலைவுக்கு
  rationale: எபிரெய ஒப்பீட்டுத் தொடரின் அளவையும், இரண்டாம் கூறில் அதற்கேற்ப வரும் விளைவையும் இயல்பான தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: מִזְרָח ... מִמַּעֲרָב
  choice: கிழக்கு மேற்கிலிருந்து
  rationale: சூரியன் உதிக்கும் திசையையும் மறையும் திசையையும் குறிக்கும் இணைச்சொற்களைத் திசைப் பெயர்களாக இயல்பாக வழங்கி, அளவிட முடியாத பிரிவுத் தொலைவு என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: הִרְחִיק
  choice: அகற்றியிருக்கிறார்
  rationale: רחק என்பதன் ஹிஃபில் வடிவிலுள்ள ‘தொலைவாக்குதல், தூரத்தில் வைப்பது’ என்ற காரணவினைப் பொருளை, பாவச்செயல்களைப் பொருளாகக் கொண்ட இச்சூழலில் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִמֶּנּוּ
  choice: நம்மைவிட்டு
  rationale: முதல் நபர் பன்மையான ‘நம்மிடமிருந்து’ என்ற பிரிவுப் பொருளை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: פְּשָׁעֵינוּ
  choice: நம் மீறுதல்களை
  rationale: פשע குறிக்கும் அறிந்தே செய்யும் வரம்புமீறல் அல்லது கலகச் செயல் என்ற ஒழுக்க மற்றும் உடன்படிக்கை சார்ந்த கனத்தை, பொதுவான ‘பாவங்கள்’ என்பதைக் காட்டிலும் நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: மன்னிப்பை விளக்கும் இடவெளி உருவகம்
  choice: கிழக்குக்கும் மேற்குக்கும் இடையிலான அளவிட முடியாத தொலைவையும், மீறுதல்களை நம்மைவிட்டு அகற்றியதையும் உருவகமாக அப்படியே வைத்தல்
  alternative: தொலைவு உருவகத்தை விடுத்து, தேவன் பொதுவாக மன்னித்தார் என்று மட்டும் கூறுதல்
  rationale: எபிரெய உரை கிழக்கு–மேற்கு தொலைவைத் தெளிவாக முன்வைத்து அதையே மீறுதல்களை அகற்றுவதற்குப் பயன்படுத்துகிறது. இந்த உருவகத்தைப் பாதுகாப்பது தெய்வீக மன்னிப்பின் முழுமையை எடுத்துரைக்கிறது; அது எவ்வாறு நிகழ்கிறது என்பதை மொழிபெயர்ப்பு கூடுதலாக விளக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘எவ்வளவு… அவ்வளவு…’ அமைப்பு எபிரெய ஒப்பீட்டை இயல்பாகத் தருகிறது; ‘அகற்றியிருக்கிறார்’ நிறைவேறிய செயலின் தற்போதைய விளைவை உணர்த்துகிறது.
