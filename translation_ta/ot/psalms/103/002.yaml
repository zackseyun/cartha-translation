  text: בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/אַל תִּ֝שְׁכְּחִ֗י כָּל גְּמוּלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/002.yaml
  text: Bless Yahweh[a], O my soul, and do not forget all his benefits.
translation:
  language: ta
  text: என் ஆத்துமாவே, யாவேவைப் போற்று; அவருடைய நன்மைகள் அனைத்தையும்[a] மறவாதே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய செயல்கள்” அல்லது “அவருடைய கைம்மாறுகள்.” எபிரெயச் சொல் ஒருவர் மற்றொருவரிடமிருந்து பெறுவதைப் பரந்த வகையில் குறிக்கலாம்; ஆனால் இங்குள்ள சூழல் “நன்மைகள்” என்ற நேர்மறைப் பொருளை ஆதரிக்கிறது.
