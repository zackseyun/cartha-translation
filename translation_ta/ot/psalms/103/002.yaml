lexical_decisions:
- source_word: בָּרֲכִי
  choice: வாழ்த்து
  rationale: ברך என்பதன் பெண்பால் ஒருமை கட்டளை வடிவம், சங்கீதக்காரன் தன் ஆத்துமாவை நோக்கிப் பேசுவதைச் சுட்டுகிறது. கடவுளை நோக்கிய ‘bless’ என்ற மதச்சார்ந்த பொருளையும் கவித்துவத் தொனியையும் ‘வாழ்த்து’ காக்கிறது.
- source_word: נַפְשִׁי
  choice: என் ஆத்துமாவே
  rationale: נפש இங்கு மனிதனின் தன்முழுமையையும் உள்ளார்ந்த சுயத்தையும் நேரடியாக அழைக்கும் விளிவடிவில் வருகிறது. ‘என் ஆத்துமாவே’ அந்தக் கவித்துவமான தன்னழைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைநாமத்தை பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கையின் தனிப்பெயராக ஒலிபெயர்த்துள்ளது.
- source_word: וְאַל תִּשְׁכְּחִי
  choice: மறவாதே
  rationale: אַל உடன் வரும் வினை வடிவம் தடை அல்லது எதிர்மறைக் கட்டளையைத் தருகிறது. தமிழில் இயல்பான ஒருமை அழைப்பாக ‘மறவாதே’ அமைகிறது; எபிரெயத்தின் தொடக்க இணைப்புச் சொல் தமிழில் அரைப்புள்ளியால் இயல்பாக வெளிப்படுகிறது.
- source_word: כָּל גְּמוּלָיו
  choice: அவருடைய நன்மைகள் அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையான அளவை ‘அனைத்தையும்’ காக்கிறது. גמול என்பது ஒருவரிடமிருந்து பெறும் கைம்மாறு, நடத்துகை அல்லது நன்மையைக் குறிக்கலாம்; அடுத்த வசனங்களில் யாவேயின் அருள்செயல்கள் பட்டியலிடப்படுவதால் இங்கு ‘நன்மைகள்’ பொருத்தமானது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் பொது இறைப்பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அதன் தனிப்பெயர்த் தன்மையைப் பாதுகாக்க ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: גְּמוּלָיו என்பதன் சூழல்சார் பொருள்
  choice: அவருடைய நன்மைகள்
  alternative: அவருடைய செயல்கள் / அவருடைய கைம்மாறுகள்
  rationale: இந்தச் சொல் நல்லதோ கெட்டதோ ஆன நடத்துகை அல்லது கைம்மாற்றைக் குறிக்கக்கூடும். ஆனால் சங்கீதம் 103:3 தொடங்கி மன்னிப்பு, குணமாக்குதல், மீட்பு போன்ற அருள்செயல்களை விவரிப்பதால் நேர்மறைப் பொருள் முன்னிலை பெறுகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் அதேவேளையில் சங்கீதத்தின் கண்ணியமான கவித்துவத் தொனியைப் பேணும் நடை. ‘ஆத்துமாவே’ என்ற விளிவடிவம் மூலத்தின் தன்னழைப்பைத் தக்கவைக்கிறது; ‘வாழ்த்து’ பாரம்பரிய மதச்சார்ந்த நயத்தையும் இயல்பான கட்டளைத் தொனியையும் வழங்குகிறது.
