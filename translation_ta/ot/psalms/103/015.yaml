translation:
  language: ta
  text: மனிதனோ, அவனுடைய நாட்கள் புல்லைப் போன்றவை; வயல்வெளிப் பூவைப் போலவே அவன் மலர்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
