source:
  edition: WLC
  text: בָּרֲכ֣וּ יְ֭הוָה כָּל צְבָאָ֑י/ו מְ֝שָׁרְתָ֗י/ו עֹשֵׂ֥י רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/021.yaml
  text: Bless Yahweh[a], all his hosts, his ministers[b], who do his will.
translation:
  language: ta
  text: யாவேவை வாழ்த்துங்கள், அவருடைய படைகள் அனைவரும்; அவருக்குப் பணிவிடை செய்பவர்களே, அவருடைய சித்தத்தை நிறைவேற்றுகிறவர்களே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: வாழ்த்துங்கள்
  rationale: இது பன்மை ஏவல்வினை. சங்கீதம் 103:20–22இல் திரும்பத் திரும்ப வரும் ברך என்ற வினையின் தொடர்ச்சியைப் பேணுவதற்காக ‘வாழ்த்துங்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: כָּל
  choice: அனைத்துமே
  rationale: அழைக்கப்படும் பன்மைக் குழுவின் முழுமையையும் வலியுறுத்தும் அளவுச்சொல்.
- source_word: צְבָאָיו
  choice: அவருடைய படைகள்
  rationale: צָבָא என்பதன் படை/சேனை என்ற அடிப்படைப் பொருளைப் பேணுகிறது; சூழலில் விண்ணுலகப் படைகள் குறிக்கப்படலாம் என்றாலும், அதை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: מְשָׁרְתָיו
  choice: அவருக்குப் பணிவிடை செய்பவர்கள்
  rationale: שׁרת குறிக்கும் முறையான சேவை அல்லது பணிவிடையின் பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֹשֵׂי
  choice: நிறைவேற்றுகிறவர்கள்
  rationale: எபிரெயப் பங்கேற்புவினை அழைக்கப்படும் குழுவை மேலும் விளக்கும் பெயரடைத் தொடராகத் தமிழில் தரப்பட்டுள்ளது.
- source_word: רְצוֹנוֹ
  choice: அவருடைய சித்தம்
  rationale: இங்கு கடவுள் விரும்புவது அல்லது கட்டளையிடுவது என்ற பொருளை ‘சித்தம்’ சுருக்கமாகவும் சூழலுக்கு ஏற்றவாறும் தருகிறது.
theological_decisions:
- issue: ‘அவருடைய படைகள்’ மற்றும் ‘அவருக்குப் பணிவிடை செய்பவர்கள்’ என்போரின் அடையாளம்
  choice: விண்ணுலக உயிர்கள் அல்லது தேவதூதப் பணியாளர்கள் சூழலில் முதன்மையாகக் குறிக்கப்படுகின்றனர்; ஆனால் முதன்மை உரை எபிரெயத்தின் பரந்த சொல்லாட்சியைப் பேணுகிறது.
  alternative: பூமியில் கடவுளுக்குப் பணிபுரிபவர்களையும் பொதுவாகக் குறிக்கலாம்.
  rationale: முந்தைய வசனம் தேவதூதர்களை நேரடியாக அழைப்பதால் விண்ணுலகச் சபையே உடனடிச் சூழல். இருப்பினும் צְבָאָיו மற்றும் מְשָׁרְתָיו ஆகிய சொற்கள் தாமாகவே அந்தக் குறிப்பை முழுமையாக வரையறுப்பதில்லை.
- issue: ‘படைகள்,’ ‘பணிவிடை செய்பவர்கள்,’ ‘சித்தத்தை நிறைவேற்றுகிறவர்கள்’ ஆகியவற்றின் இலக்கண உறவு
  choice: ஒரே அழைக்கப்படும் குழுவை அடுக்காக விளக்கும் அழைப்புத் தொடர்களாக வைக்கப்பட்டுள்ளது.
  alternative: ‘படைகள்’ மற்றும் ‘பணிவிடை செய்பவர்கள்’ தனித்தனி குழுக்களாகவும் வாசிக்கப்படலாம்.
  rationale: எபிரெயத்தில் இணைப்புச்சொல் இல்லாத அடுத்தடுத்த பெயர்த்தொடர்கள் உள்ளன. தமிழ் உரையும் அவற்றின் நெருங்கிய தொடர்பைப் பேணுகிறது; அவை முற்றிலும் ஒன்றே என்று கூடுதலாக விளக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான அழைப்புமுறை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் தொடக்க ஏவல்வினை தமிழின் இயல்பான வாக்கிய அமைப்புக்காக இறுதியில் வைக்கப்பட்டுள்ளது. ‘படை’ என்ற சொல் விண்ணுலகச் சூழலை அளவுக்கு மீறி விளக்காமல் மூலத்தின் உருவகத்தைப் பேணுகிறது.
