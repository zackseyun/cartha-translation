source:
  edition: WLC
  text: וְ/חֶ֤סֶד יְהוָ֨ה מֵ/עוֹלָ֣ם וְ/עַד ע֭וֹלָם עַל יְרֵאָ֑י/ו וְ֝/צִדְקָת֗/וֹ לִ/בְנֵ֥י בָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/017.yaml
  text: But the steadfast love of Yahweh is from everlasting to everlasting on those who fear him[a], and his righteousness to children's children.
translation:
  language: ta
  text: ஆனால், யாவேயின் மாறாத அன்பு அவருக்கு அஞ்சுகிறவர்கள்மேல் அனாதிகாலம் முதல் என்றென்றைக்கும் உள்ளது; அவருடைய நீதி[a] அவர்களின் பிள்ளைகளின் பிள்ளைகளுக்கும் உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நேர்மை.” இங்குள்ள எபிரெயச் சொல் சூழலுக்கேற்ப நீதி அல்லது நேர்மை என்ற பொருளைக் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶסֶד
  choice: ஆனால் ... மாறாத அன்பு
  rationale: முந்தைய வசனத்தில் மனித வாழ்வின் நிலையாமையுடன் உள்ள முரண்பாட்டை וְ இங்கு காட்டுவதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது. חֶסֶד என்பதன் பற்றுறுதியும் நீடித்த தன்மையும் ‘மாறாத அன்பு’ என்பதில் இயல்பாக வெளிப்படுகின்றன.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் வரும் இறைத் திருப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் நிலைபெற்றுள்ள ‘யெகோவா’ என்ற ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: என்றென்றைக்கும்
  rationale: கால எல்லையற்ற நீடிப்பைக் குறிக்கும் இரட்டைப் பயன்பாட்டை இயல்பான, கவிதைநயம் கொண்ட தமிழில் தெரிவிக்கிறது.
- source_word: עַל יְרֵאָיו
  choice: அவருக்கு அஞ்சுகிறவர்கள்மேல்
  rationale: עַל குறிக்கும் ‘மேல்’ என்ற உறவையும், יְרֵאָיו என்பதில் உள்ள பயபக்தியுடனான அஞ்சுதலையும் குறைக்காமல் பாதுகாக்கிறது.
- source_word: וְצִדְקָתוֹ
  choice: அவருடைய நீதி
  rationale: צְדָקָה இங்கு ஒழுக்க நேர்மை, நீதியான செயல் ஆகிய இரு நிழற்பொருள்களையும் தாங்குகிறது; நவீன தமிழில் ‘நீதி’ இவற்றைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது. ‘நேர்மை’ ஒரு பொருத்தமான மாற்று என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִבְנֵי בָנִים
  choice: அவர்களுடைய பிள்ளைகளின் பிள்ளைகளுக்கும்
  rationale: ‘பிள்ளைகளின் பிள்ளைகள்’ என்ற எபிரெய தலைமுறைப் படிமத்தை அப்படியே காத்து, யாருடைய தலைமுறை என்பது தமிழில் தெளிவாக இருக்க ‘அவர்களுடைய’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக வருவதால் அதை ‘கர்த்தர்’ போன்ற பட்டப்பெயரால் மாற்றவில்லை. தமிழ் வாசகர்களிடையே நிலைபெற்ற ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- issue: צִדְקָה என்பதன் பொருள்
  choice: நீதி
  alternative: நேர்மை
  rationale: சூழலில் கடவுளுடைய நீதியான, உடன்படிக்கைக்கு உண்மையுள்ள குணமும் தலைமுறைகளுக்கான செயல்பாடும் இணைகின்றன. ஒரு பொருளை மட்டும் கட்டாயப்படுத்தாமல் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான சங்கீத நடையுடன் அமைக்கப்பட்டது. மூலத்தின் இரு இணை வாக்கியங்களும் தலைமுறைப் படிமமும் காக்கப்பட்டுள்ளன.
