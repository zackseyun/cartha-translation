  text: יוֹדִ֣יעַ דְּרָכָ֣י/ו לְ/מֹשֶׁ֑ה לִ/בְנֵ֥י יִ֝שְׂרָאֵ֗ל עֲלִילֽוֹתָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/007.yaml
  text: He made his ways known to Moses[a], his deeds to the sons of Israel.
translation:
  language: ta
  text: அவர் தமது வழிகளை மோசேக்கும், தமது செயல்களை இஸ்ரவேல் மக்களுக்கும்[a] தெரியப்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்சொல்லாக, “இஸ்ரவேலின் மகன்களுக்கு”; “இஸ்ரவேலின் பிள்ளைகளுக்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדִיעַ
  choice: தெரியப்படுத்தினார்
  rationale: ידע என்பதன் ஹிஃபில் வடிவம் ‘அறியச் செய்தார்/தெரியப்படுத்தினார்’ என்ற காரணவினைப் பொருளைத் தருகிறது. ‘தெரியப்படுத்தினார்’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: דְּרָכָיו
  choice: தமது வழிகளை
  rationale: דֶּרֶךְ என்பதன் அடிப்படைப் பொருள் ‘வழி’; இங்கு அது கடவுள் செயல்படும் விதங்களைக் குறிக்கிறது. ‘வழிகள்’ என்ற உருவகத்தை மொழிபெயர்ப்பு தக்கவைக்கிறது.
- source_word: לְמֹשֶׁה
  choice: மோசேக்கும்
  rationale: לְ என்னும் முன்னொட்டு வெளிப்படுத்தப்பட்டதைப் பெற்றவரைக் குறிக்கிறது. அடுத்த இணை அமைப்போடு இயல்பாக ஒத்திசைய ‘மோசேக்கும்’ என வழங்கப்பட்டுள்ளது.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: இஸ்ரவேல் மக்களுக்கும்
  rationale: בְּנֵי יִשְׂרָאֵל என்பது சொற்சொல்லாக ‘இஸ்ரவேலின் மகன்கள்/பிள்ளைகள்’ என்றாலும், வழக்கமான இனக்குழுப் பெயராக முழு இஸ்ரவேல் மக்களையும் குறிக்கிறது. நவீனத் தமிழில் ‘இஸ்ரவேல் மக்கள்’ இயல்பாகவும் பொருள் துல்லியமாகவும் உள்ளது; சொற்சொல் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֲלִילוֹתָיו
  choice: தமது செயல்களை
  rationale: இச்சொல் செயல்கள் அல்லது செய்கைகளைக் குறிக்கிறது. ‘வல்ல செயல்கள்’ என்பது மூலத்தில் வெளிப்படையாக இல்லாத மதிப்பீட்டு நுணுக்கத்தைச் சேர்க்கும்; ஆகவே ‘செயல்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל என்ற ஆண்பால் வடிவிலான கூட்டுப்பெயர்
  choice: இஸ்ரவேல் மக்கள்
  alternative: இஸ்ரவேலின் பிள்ளைகள்; இஸ்ரவேலின் மகன்கள்
  rationale: எபிரெயச் சொற்றொடர் இலக்கணப்படி ஆண்பால் பன்மையாக இருந்தாலும், நிலையான இனக்குழுப் பெயராக ஆண்கள், பெண்கள் உட்பட இஸ்ரவேல் சமூகத்தைக் குறிக்கிறது. தமிழில் ‘மக்கள்’ அந்தக் கூட்டுப் பொருளை இயல்பாகத் தெரிவிக்கிறது; மூலத்தின் சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் ஒருமை மரியாதை வடிவமாக ‘அவர்/தமது’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணை அமைப்பு—‘வழிகள்/செயல்கள்’, ‘மோசே/இஸ்ரவேல் மக்கள்’—தக்கவைக்கப்பட்டுள்ளது.
