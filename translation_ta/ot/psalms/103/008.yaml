  text: רַח֣וּם וְ/חַנּ֣וּן יְהוָ֑ה אֶ֖רֶךְ אַפַּ֣יִם וְ/רַב חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/008.yaml
  text: Yahweh is compassionate and gracious[b][a], slow to anger and abounding in steadfast love.
translation:
  language: ta
  text: யாவே கருணையுள்ளவரும்[a] அருளுள்ளவரும்; கோபப்படத் தாமதிப்பவரும், மாறாத அன்பில் மிகுந்தவரும் ஆவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரக்கமுள்ளவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: பரிவிரக்கமுள்ளவர்
  rationale: ஆழ்ந்த பரிவையும் இரக்கத்தையும் குறிக்கும் எபிரேயப் பெயரடையின் உணர்வை, அடுத்துவரும் ‘அருளுள்ளவர்’ என்பதுடன் ஒன்றாக்காமல் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חַנּוּן
  choice: அருளுள்ளவர்
  rationale: தகுதியின் அடிப்படையிலல்லாமல் நன்மையும் தயவும் வழங்கும் குணத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரேய மூலத்திலுள்ள இறைவனின் தனிப்பட்ட பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֶרֶךְ אַפַּיִם
  choice: கோபங்கொள்ளத் தாமதிப்பவர்
  rationale: ‘மூக்குகள் நீண்டவர்’ என்ற எபிரேய மரபுத்தொடரின் பொருளான, கோபம் எழுவதில் தாமதம் அல்லது பொறுமையை இயல்பான தமிழில் தருகிறது.
- source_word: רַב
  choice: நிறைந்தவர்
  rationale: חָסֶד மிகுதியாக இருப்பதைத் தமிழில் இயல்பான இறைவிளக்கச் சொல்லாக்கமாக வெளிப்படுத்துகிறது.
- source_word: חָסֶד
  choice: மாறாத அன்பு
  rationale: அன்பு, உறுதி, விசுவாசமான பற்றுறுதி ஆகியவற்றை ஒருங்கே தாங்கும் சொல்லின் செறிவைச் சுருக்கமாக வெளிப்படுத்துகிறது; அதை வெறும் உணர்ச்சியாகவோ சட்டரீதியான உடன்படிக்கைச் சொல்லாகவோ குறுக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப்பெயரே உள்ளது. ஆகவே அதைப் பட்டப்பெயரால் பதிலிடாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: חָסֶד என்பதன் உடன்படிக்கை சார்ந்த பொருட்செறிவு
  choice: மாறாத அன்பு
  alternative: உண்மையான அன்பு; உடன்படிக்கைப் பற்றுறுதி; பேரன்பு
  rationale: இச்சொல்லிலுள்ள பாசத்தையும் நிலைத்த விசுவாசத்தையும் ஒன்றாகத் தக்கவைத்து, குறிப்பிட்ட கோட்பாட்டு விளக்கத்திற்குள் பொருளைச் சுருக்காமல் இருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் சங்கீதத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இணையான எபிரேய குணவிளக்கங்கள் தமிழிலும் சமச்சீரான தொடராக வைக்கப்பட்டுள்ளன.
