id: PSA.103.1
reference: Psalms 103:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לְ/דָוִ֨ד בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/כָל קְ֝רָבַ֗/י אֶת שֵׁ֥ם קָדְשֽׁ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/001.yaml
  text: Of David. Bless Yahweh[a], O my soul, and all that is within me, bless his holy name.
translation:
  language: ta
  text: 'தாவீதுக்குரியது.


    என் ஆத்துமாவே, யாவேயை வாழ்த்து;

    எனக்குள் உள்ள அனைத்தும்[a] அவருடைய பரிசுத்தப் பெயரை வாழ்த்தட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “என் உள்ளுறுப்புகள் அனைத்தும்”; அல்லது, “என் அகமனைத்தும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்குரியது
  rationale: தாவீதுடன் உள்ள தொடர்பை இயல்பான தமிழில் தெரிவிக்கிறது; அவர் எழுதியது அல்லது அவருக்காக எழுதப்பட்டது என்று தேவையின்றி வரையறுக்காமல் எபிரெய முன்னுரையின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: בָּרֲכִי
  choice: வாழ்த்து
  rationale: பியேல் வடிவிலுள்ள ברך என்பதன் ‘ஆசீர்வதி/வாழ்த்து’ என்ற அடிப்படைப் பொருளைத் தக்கவைக்கிறது. தேவனை நோக்கிய மனிதரின் சொல்லாகத் தமிழில் ‘வாழ்த்து’ இயல்பாகவும் மரியாதையாகவும் உள்ளது.
- source_word: נַפְשִׁי
  choice: என் ஆத்துமாவே
  rationale: தன்னையே நேரடியாக அழைக்கும் கவிதை நடையை ‘-வே’ என்ற விளிவேற்றுமை தெளிவாக்குகிறது; נפש என்பதன் உயிர், தன்முழுமை, அகநிலை ஆகிய பொருள் பரப்பையும் ‘ஆத்துமா’ தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பதவிப்பெயர் அல்ல, எபிரெய இறைப்பெயரின் தமிழொலிபெயர்ப்பு. வேற்றுமை உருபுடன் ‘யாவேயை’ என்று இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: וְכָל קְרָבַי
  choice: எனக்குள் உள்ள அனைத்தும்
  rationale: பன்மையிலுள்ள קְרָבַי என்பதன் நேர்ப்பொருள் ‘என் உள்ளுறுப்புகள்’; இங்கு ஒருவரின் முழு அகநிலையைக் குறிக்கும் கவிதை வழக்கை உடற்கூறு சார்ந்த கடின நடையின்றி வாசிக்கத்தக்க தமிழில் தருகிறது.
- source_word: שֵׁם קָדְשׁוֹ
  choice: அவருடைய பரிசுத்தப் பெயர்
  rationale: ‘அவருடைய பரிசுத்தப் பெயர்’ என்பது ‘அவருடைய பரிசுத்தத்தின் பெயர்’ என்ற எபிரெய ஆக்கநிலைத்தொடரின் இயல்பான தமிழ் வடிவம்; பெயர் மற்றும் பரிசுத்தம் ஆகிய இரண்டையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக வருகிறது. அதைப் பட்டப்பெயரால் மாற்றாமல், பரவலாக ஏற்கப்படும் ஒலிப்புக்கு நெருக்கமான தமிழ் வடிவில் தரப்பட்டுள்ளது.
- issue: மனிதர் தேவனை ‘வாழ்த்துதல்’
  choice: வாழ்த்து
  alternative: போற்று / துதி
  rationale: மூல வினையின் ‘bless’ என்ற நேரடிப் பொருளையும், தேவனைப் பயபக்தியுடன் புகழ்ந்து நன்மை கூறும் கருத்தையும் பாதுகாக்கிறது; ‘துதி’ என்று மட்டும் பொருளைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன, மரியாதையான, கவிதைநயமுள்ள பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. முதல் அடியின் நேரடி சுயஅழைப்பும் இரண்டாம் அடியின் இணை அமைப்பும் தக்கவைக்கப்பட்டுள்ளன; இரண்டாம் அடியில் எபிரெயத்தில் விடுபட்டுள்ள வினை தமிழில் ‘வாழ்த்தட்டும்’ என இயல்பாக நிரப்பப்பட்டுள்ளது.
