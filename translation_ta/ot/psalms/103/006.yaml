  text: עֹשֵׂ֣ה צְדָק֣וֹת יְהוָ֑ה וּ֝/מִשְׁפָּטִ֗ים לְ/כָל עֲשׁוּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/006.yaml
  text: Yahweh works righteousness and justice for all who are oppressed[a].
translation:
  language: ta
  text: ஒடுக்கப்பட்ட அனைவருக்காகவும் யாவே நீதியான செயல்களையும் நியாயத்தீர்ப்புகளையும் செய்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒடுக்கப்பட்ட அனைவருக்காகவும் யாவே நீதியையும் நியாயத்தையும் நிலைநாட்டுகிறார்.’
    reason: צְדָקוֹת மற்றும் מִשְׁפָּטִים ஆகிய பன்மைச் சொற்களைத் தொகுப்புப் பொருளில் கருத்துப்பெயர்களாகவும் புரிந்துகொள்ளலாம்.
lexical_decisions:
- source_word: עֹשֵׂה
  choice: செய்கிறார்
  rationale: கால் வினையெச்சம் இங்கு யாவே தொடர்ந்து, இயல்பாகச் செயல்படுவதைக் குறிக்கிறது; நிகழ்கால வடிவம் அந்த வழக்கமான செயலைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: צְדָקוֹת
  choice: நீதியான செயல்கள்
  rationale: பன்மை வடிவம் நீதியை ஒரு கருத்தாக மட்டுமல்லாமல், நீதியுள்ள செயல்களாகவும் குறிக்கலாம். அடுத்துள்ள מִשְׁפָּטִים என்பதிலிருந்து வேறுபாட்டைக் காக்க இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: וּמִשְׁפָּטִים
  choice: நியாயத்தீர்ப்புகள்
  rationale: பன்மைச் சொல் நீதித்துறை சார்ந்த தீர்ப்புகளையோ நியாயம் வழங்கும் செயல்களையோ குறிக்கிறது; அதன் பன்மைத் தன்மையை இச்சொல் காக்கிறது.
- source_word: לְכָל
  choice: அனைவருக்காகவும்
  rationale: לְ இங்கு செயல் யாருடைய நன்மைக்காக நடைபெறுகிறது என்பதைக் காட்டுகிறது; தமிழில் பயனாளியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲשׁוּקִים
  choice: ஒடுக்கப்பட்ட
  rationale: עשק என்பதன் செயப்பாட்டு வினையெச்சம் அநீதியான ஒடுக்குதலுக்கும் சுரண்டலுக்கும் ஆளானவர்களைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப் பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரையே பயன்படுத்துகிறது. ஆகவே பெயருக்கும் பட்டத்துக்கும் உள்ள வேறுபாட்டைக் காக்க ஒலிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டுள்ளது.
- issue: צְדָקוֹת மற்றும் מִשְׁפָּטִים ஆகியவற்றின் தொடர்பு
  choice: நீதியான செயல்களையும் நியாயத்தீர்ப்புகளையும்
  alternative: நீதியையும் நியாயத்தையும்
  rationale: இரு சொற்களையும் ஒரே கருத்தாகக் கலக்காமல், முதலாவது சொல்லின் செயல் சார்ந்த பன்மையையும் இரண்டாவது சொல்லின் தீர்ப்பு சார்ந்த பன்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயப் பன்மைகளின் செயல் சார்ந்த நுணுக்கம் முதன்மை உரையில் காக்கப்பட்டு, இயல்பான தொகுப்புப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
