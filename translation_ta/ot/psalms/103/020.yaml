  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בָּרֲכ֥וּ יְהוָ֗ה מַלְאָ֫כָ֥י/ו גִּבֹּ֣רֵי כֹ֭חַ עֹשֵׂ֣י דְבָר֑/וֹ לִ֝/שְׁמֹ֗עַ בְּ/ק֣וֹל דְּבָרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/020.yaml
  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
translation:
  language: ta
  text: வல்லமை மிக்க, அவருடைய வார்த்தையை நிறைவேற்றி, அவருடைய வார்த்தையின் குரலுக்குச் செவிகொடுக்கிற[a] அவருடைய தூதர்களே, யாவேவைப் போற்றுங்கள்!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “செவிகொடுக்கிற” என்பதை “கீழ்ப்படிகிற” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் கேட்டறிவதையும் அதன்படி கீழ்ப்படிவதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: போற்றுங்கள்
  rationale: இது பன்மை ஏவல் வினை. தமிழில் கடவுளை நோக்கி இயல்பாகப் பயன்படுத்தக்கூடிய ‘போற்றுங்கள்’ என்பது, சங்கீதம் 103 முழுவதும் திரும்பத் திரும்ப வரும் யாவேவை வாழ்த்தும் அழைப்பைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் அதன் பெயரொலியை ‘யாவே’ என்று தருகிறது.
- source_word: מַלְאָכָיו
  choice: அவருடைய தூதர்களே
  rationale: இச்சூழலில் מַלְאָךְ என்பது மனிதத் தூதர்களை அல்ல, விண்ணுலகத் தூதர்களைக் குறிக்கிறது. அழைப்பு நேரடியாக அவர்களை நோக்கியிருப்பதால் விளிவேற்றுமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: גִּבֹּרֵי כֹחַ
  choice: வல்லமை மிக்கவர்களாய்
  rationale: ‘வலிமையின் வல்லவர்கள்’ என்ற சொற்சொல்லான, இயல்பற்ற அமைப்பைத் தவிர்த்து, அவர்களுடைய பெரும் ஆற்றலைத் தெளிவாக வெளிப்படுத்துகிறது; ‘போர்வீரர்கள்’ என்ற தேவையற்ற இராணுவப் பொருளையும் சேர்க்கவில்லை.
- source_word: עֹשֵׂי דְבָרוֹ
  choice: அவருடைய வார்த்தையை நிறைவேற்றி
  rationale: எபிரெயப் பங்கேற்புவினை தூதர்களின் வழக்கமான செயலை விவரிக்கிறது. ‘வார்த்தை’ என்பதைப் பாதுகாக்கும் அதே வேளையில், தமிழில் ‘வார்த்தையைச் செய்கிற’ என்ற இயல்பற்ற தொடருக்குப் பதிலாக அதன் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: לִשְׁמֹעַ בְּקוֹל דְּבָרוֹ
  choice: அவருடைய வார்த்தையின் குரலுக்குச் செவிகொடுக்கிற
  rationale: שׁמע בְּקוֹל என்ற தொடர் கேட்பதையும் அதற்கேற்ற கீழ்ப்படிதலையும் உள்ளடக்குகிறது. ‘செவிகொடுக்கிற’ என்பது இந்த இரு நுணுக்கங்களையும் தமிழில் ஓரளவு பாதுகாக்கிறது; ‘வார்த்தையின் குரல்’ மூலத்தின் செவிப்புல உருவகத்தையும் மறைக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதனைப் பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- issue: שׁמע בְּקוֹל என்பதில் கேட்பதா, கீழ்ப்படிதலா
  choice: செவிகொடுக்கிற
  alternative: கீழ்ப்படிகிற
  rationale: இச்சொற்றொடர் வெறுமனே ஒலியைக் கேட்பதைவிட ஏற்றுக்கொண்டு கீழ்ப்படிவதைக் குறிக்க முடியும். இருப்பினும் மூலத்தின் ‘குரல்’ உருவகத்தையும் கேட்பதிலிருந்து செயல்படுதல் என்ற அமைப்பையும் அழிக்காமல் இருக்க ‘செவிகொடுக்கிற’ தேர்ந்தெடுக்கப்பட்டது; கீழ்ப்படிதல் நுணுக்கம் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வசனத்தின் நேரடி அழைப்பும் ‘வார்த்தை’ என்ற சொல்லின் மீளுரையும் பாதுகாக்கப்பட்டுள்ளன.
