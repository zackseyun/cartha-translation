  text: For the wind passes over it[a], and it is gone[c][b], and its place knows it no more.
translation:
  language: ta
  text: ஏனெனில், காற்று அதன்மேல் வீசிக் கடந்து செல்கிறது; அது இல்லாமற்போகிறது; அதன் இடம் அதை இனி அறியாது.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காற்று’ என்பதற்கு ‘மூச்சு’ அல்லது ‘ஆவி’ என்றும் பொருள் கொள்ளலாம்; புல், பூ ஆகியவற்றைப் பற்றிய கவிதைச் சூழல் ‘காற்று’ என்பதையே ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அது இல்லை.’'
    reason: lexical_alternative
  - marker: c
    text: மறைந்துபோனதை அதன் இடம் ‘அறிவதாக’ அல்லது ‘அடையாளம் காண்பதாக’ எபிரெயக் கவிதை ஆளுருவகப்படுத்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: -தும்
  rationale: முந்தைய வசனத்தில் மனித வாழ்வு புல்லுக்கும் பூவுக்கும் ஒப்பிடப்பட்டதற்கான விளைவைக் காட்டுகிறது. தமிழில் காலத்தையும் காரணவிளைவையும் இயல்பாக இணைக்க ‘கடந்துபோனதும்’ பயன்படுத்தப்பட்டது.
- source_word: רוּחַ
  choice: காற்று
  rationale: புல் மற்றும் பூ பற்றிய உடனடியான கவிதைச் சூழலில் ‘காற்று’ என்பதே இயல்பான பொருள்; ‘மூச்சு’ அல்லது ‘ஆவி’ என்ற சாத்தியங்களும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: עָבְרָה בּוֹ
  choice: அதன்மேல் வீசிக் கடந்துபோனதும்
  rationale: עבר என்பதன் ‘கடந்து செல்லுதல்’ என்ற அடிப்படைப் படிமத்தைத் தக்கவைத்து, காற்றைப் பற்றிய இயல்பான தமிழுக்காக ‘வீசிக்’ சேர்க்கப்பட்டது. בּוֹ இங்கு ‘அதன்மேல்’ எனக் கொள்ளப்பட்டது.
- source_word: וְאֵינֶנּוּ
  choice: அது இல்லாமற்போகிறது
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருளான ‘அது இல்லை’ என்பதையும், சூழலில் உள்ள மறைந்துபோதல் என்ற உணர்வையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: וְלֹא יַכִּירֶנּוּ עוֹד
  choice: இனி அதை அறிந்துகொள்வதில்லை
  rationale: נכר என்பதன் ‘அறிதல்/அடையாளம் காணுதல்’ என்ற பொருளைத் தக்கவைத்து, இடம் அறிகிறது என்ற எபிரெயக் கவிதை ஆளுருவகத்தையும் பாதுகாக்கிறது.
- source_word: מְקוֹמוֹ
  choice: அதன் இடம்
  rationale: முந்தைய வசனத்தின் புல்/பூப் படிமத்தைக் குறிக்கும் ஆண்பால் ஒருமை பின்னொட்டைத் தமிழில் இயல்பான அஃறிணை வடிவில் மொழிபெயர்க்கிறது.
