  text: who satisfies you with good[b][a], so that your youth is renewed like the eagle’s.
translation:
  language: ta
  text: நன்மையால் உன்னைத் திருப்திப்படுத்துகிறவர்[a]; கழுகைப் போல உன் இளமை புதிதாகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் நேரடியாக ‘உன் அலங்காரம்’ எனப் பொருள்படும். இச்சொற்றொடர் கடினமானது; ‘உன் வாழ்நாளெல்லாம் உன்னை நன்மைகளால் திருப்திப்படுத்துகிறவர்’ என்றும், வேறொரு விளக்க மரபின்படி ‘உன் வாயை நன்மையால் திருப்திப்படுத்துகிறவர்’ என்றும் பலர் புரிந்துகொள்கின்றனர்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயச் சொல் ஒரு பெரிய இரைகொல்லிப் பறவையைக் குறிக்கிறது; அது மரபாக ‘கழுகு’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂבִּיעַ
  choice: நிறைவாக்குகிறவர்
  rationale: שׂבע என்பதன் ஹிப்ஃபீல் வினையெச்ச வடிவம், ஆண்டவரின் செயல்களைத் தொடர்ந்து விவரிக்கிறது. போதுமான அளவு நன்மை அளித்துத் திருப்திப்படுத்தும் கருத்தை இயல்பான தமிழில் ‘நிறைவாக்குகிறவர்’ தெரிவிக்கிறது.
- source_word: בַּטּוֹב
  choice: நன்மையால்
  rationale: טוֹב இங்கு பெயர்ச்சொல் தன்மையில் வரும் பெயரடை. எவற்றை அளிக்கிறார் என்று தேவையின்றிக் குறிப்பாக்காமல், எபிரெயச் சொல்லின் கூட்டு ஒருமைப் பொருளை ‘நன்மையால்’ காக்கிறது.
- source_word: עֶדְיֵךְ
  choice: உன்னை
  rationale: மசோரெட்டிக் உயிர்க்குறிகளின்படி இச்சொல் வழக்கமாக ‘உன் அலங்காரம்’ என்று பொருள்படும்; ஆனால் இவ்விடத்திலுள்ள சொற்றொடர் கடினமானது. சூழலில் நன்மையால் நிறைவடைவது சங்கீதத்தில் தன்னைத்தானே அழைக்கும் நபர் என்பதால், முழுச் சொற்றொடரின் சாத்தியமான பொருள் இயல்பான தமிழில் ‘உன்னை நிறைவாக்குகிறவர்’ என வழங்கப்படுகிறது; நேரடிச் சொற்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: תִּתְחַדֵּשׁ
  choice: புதுப்பிக்கப்படுகிறது
  rationale: חדש என்பதன் ஹித்பயேல் முற்றாத வினை வடிவத்தில் செயப்படுபொருள்–தற்செயல் நுட்பம் உள்ளது. இச்சூழலில் ‘புதுப்பிக்கப்படுகிறது’ இயல்பாகவும் மூலத்தின் திறந்த நுட்பத்தைத் தக்கவைத்தும் உள்ளது.
- source_word: כַּנֶּשֶׁר
  choice: கழுகைப் போல
  rationale: נֶשֶׁר என்பது பெரிய இரைகொல்லிப் பறவையைக் குறிக்கிறது; மரபாக ‘கழுகு’ என மொழிபெயர்க்கப்படுகிறது. உவமையின் கவித்துவ வலிமையை இது தெளிவாகக் காக்கிறது.
- source_word: נְעוּרָיִכִי
  choice: உன் இளமை
  rationale: இரண்டாம் நபர் பெண்பால் ஒருமை பின்னொட்டுள்ள பன்மை வடிவச் சுருக்கப் பெயர்; இளமை அல்லது இளமைத் துடிப்பைக் குறிக்கிறது. ‘உன் இளமை’ மூலத்தின் கவித்துவத்தைப் பாதுகாக்கிறது.
