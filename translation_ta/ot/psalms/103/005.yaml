translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடினமான עֶדְיֵךְ என்பதைக் கருத்துவழியாக முதன்மை உரையில் வழங்கி, அதன் நேரடிப் பொருளையும் முக்கிய மாற்று விளக்கங்களையும் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாத்துள்ளோம்.
