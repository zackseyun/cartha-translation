source:
  edition: WLC
  text: יְֽהוָ֗ה בַּ֭/שָּׁמַיִם הֵכִ֣ין כִּסְא֑/וֹ וּ֝/מַלְכוּת֗/וֹ בַּ/כֹּ֥ל מָשָֽׁלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/019.yaml
  text: Yahweh has established his throne in the heavens[b][a], and his kingdom rules over all.
translation:
  language: ta
  text: 'யாவே வானங்களில்[a] தமது அரியணையை நிலைநிறுத்தியிருக்கிறார்;

    அவருடைய அரசாட்சி[b] எல்லாவற்றின்மீதும் ஆளுகிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானத்தில்.” எபிரெயில் “வானங்கள்” என்று பன்மையில் உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருடைய அரசுரிமை” அல்லது “அவருடைய ஆளுகை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரைப் பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: בַּשָּׁמַיִם
  choice: வானங்களில்
  rationale: שָׁמַיִם என்பதன் எபிரெயப் பன்மை வடிவத்தையும் கவிதைநடையின் உயர்வையும் காக்கிறது.
- source_word: הֵכִין
  choice: நிலைநிறுத்தியிருக்கிறார்
  rationale: Hiphil வடிவம் இங்கு உறுதியாக நிறுவுதல் அல்லது நிலைபெறச் செய்தல் என்ற பொருளைத் தருகிறது; நிறைவுற்ற செயலின் தொடரும் விளைவைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּסְאוֹ
  choice: தமது அரியணையை
  rationale: அரசாட்சிச் சூழலில் כִּסֵּא என்பதற்குரிய இயல்பான தமிழ்ச் சொல் ‘அரியணை’; ‘தமது’ என்பது எழுவாயான யாவேயையே சுட்டுகிறது.
- source_word: וּמַלְכוּתוֹ
  choice: அவருடைய அரசாட்சி
  rationale: מַלְכוּת என்பது அரசு, அரசுரிமை, ஆட்சி ஆகிய பொருள்களை ஏற்கக்கூடும்; ‘அரசாட்சி’ என்பது ஆளும் அதிகாரத்தையும் அதன் செயல்பாட்டையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: בַּכֹּל
  choice: எல்லாவற்றின்மீதும்
  rationale: משׁל என்ற வினையுடன் சேர்ந்து ஆட்சியின் உலகளாவிய பரப்பைக் குறிக்கிறது.
- source_word: מָשָׁלָה
  choice: ஆளுகிறது
  rationale: பெண்பால் எழுவாயான מַלְכוּת உடன் பொருந்தும் qatal வடிவம் இங்கு தொடர்ந்திருக்கும் பொதுநிலையை அறிவிக்கிறது; நிகழ்காலம் அதை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் காக்கிறது; ‘யாவே’ என்பது எபிரெயப் பெயருக்கான பரவலாக ஏற்கப்பட்ட நவீன ஒலிபெயர்ப்பு.
- issue: מָשָׁלָה என்பதன் காலம் மற்றும் பொருள்நிலை
  choice: ஆளுகிறது
  alternative: ஆண்டது; ஆண்டிருக்கிறது
  rationale: எபிரெய நிறைவுவடிவத்தை வெறும் கடந்தகாலச் செயலாகக் குறுக்காமல், கடவுளுடைய உலகளாவிய ஆட்சி தொடரும் நிலை என்ற கவிதைச் சொல்லாற்றலைப் பாதுகாக்கிறது.
- issue: מַלְכוּת என்பதன் பொருள் பரப்பு
  choice: அரசாட்சி
  alternative: ராஜ்யம்; அரசுரிமை; ஆளுகை
  rationale: மூலச்சொல் ஆளப்படும் நிலப்பரப்பையும் ஆளும் அதிகாரத்தையும் குறிக்கக்கூடியது. சூழலில் அடுத்த வினையான ‘ஆளுகிறது’ என்பதுடன் ‘அரசாட்சி’ இயல்பாக அமைகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் அடியில் நிறைவுற்ற நிறுவுதலின் தொடரும் விளைவும், இரண்டாம் அடியில் நிலையான உலகளாவிய ஆட்சியும் தெளிவாக வேறுபடுத்தப்பட்டுள்ளன. ‘தமது’ மற்றும் ‘அவருடைய’ என்பவை மரியாதையையும் சுட்டுப்பொருள் தெளிவையும் காக்கின்றன.
