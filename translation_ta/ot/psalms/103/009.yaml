  source_fidelity: முதல் அரையடியில் உள்ள ריב என்பதன் வாதிடுதல்/எதிர்த்து நிற்றல் என்ற பொருள் வரையறைக்குள் உள்ளது. ஆனால் இரண்டாம் அரையடியின் יִטּוֹר, இச்சூழலில் மறைவாகக் குறிக்கப்படும் சினத்தைத் தொடர்ந்து வைத்திருத்தல் என்ற பொருளைத் தருகிறது. தமிழில் செயப்படுபொருளை முற்றிலும் விடுவதால் வாசகம் இயல்பாக முழுமையடையவில்லை; ‘கோபத்தை’ வெளிப்படுத்துவது பொருளைத் தெளிவாக்குகிறது.
  naturalness: ‘மனத்தில் வைத்துக்கொண்டிருக்கவும் மாட்டார்’ என்பது தமிழில் எதை மனத்தில் வைத்திருக்கமாட்டார் என்ற எதிர்பார்ப்பை நிறைவேற்றாமல் சற்றே முழுமையற்றதாக ஒலிக்கிறது. ‘கோபத்தை வைத்திருக்கமாட்டார்’ என்பது நவீன நிலையான தமிழில் இயல்பானதும் கவிதைநடைக்கு ஏற்றதுமாகும். ‘வாதாடிக்கொண்டிருக்கமாட்டார்’ என்பது ‘வழக்காடிக்கொண்டிருக்கமாட்டார்’ என்பதைவிட ரיב-இன் பரந்த உறவுசார்/வாதச் சாயலைக் குறைவாகக் குறிப்பாக்குகிறது.
  terminology: ‘கோபம்’ என்பது இவ்விடத்தில் יִטּוֹר-இன் சூழல்சார், மரபான பொருளைத் துல்லியமாகக் காட்டுகிறது; இது குறிப்பிட்ட கோட்பாட்டு விளக்கத்தைத் திணிக்கவில்லை. ‘வாதாடுதல்’ ரיב என்பதற்கான நடுநிலையான முதன்மைத் தேர்வாகும்.
