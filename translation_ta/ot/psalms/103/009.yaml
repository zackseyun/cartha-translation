  yaml_path: translation/ot/psalms/103/009.yaml
  text: He will not contend forever[b][a], nor will he keep his anger for all time.
translation:
  language: ta
  text: அவர் எப்போதும் வாதாடிக்கொண்டிருக்கமாட்டார்[a]; என்றென்றும் கோபத்தை வைத்திருக்கமாட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எப்போதும் குற்றஞ்சாட்டிக்கொண்டிருக்கமாட்டார் / எதிர்த்து வாதாடிக்கொண்டிருக்கமாட்டார்.” இவ்வினைச்சொல் வாதிடுதல் அல்லது ஒருவருக்கு எதிராக வழக்குத் தொடருதல் என்ற பொருள்களையும் தரலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்றென்றும் [தம் கோபத்தை]க் காத்துவைத்திருக்கமாட்டார்.” “பகை வைத்திருக்கமாட்டார்” என்றும் பொருள்படலாம். எபிரேய வினைச்சொல்லின் அடிப்படைப் பொருள் “வைத்திரு / காத்துவை / காவல் செய்” என்பதாகும்; இங்கு அதன் செயப்படுபொருள் எபிரேயத்தில் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֶצַח
  choice: எப்போதும்
  rationale: நீடித்த காலத்தைக் குறிக்கும் சொல்லை இயல்பான தமிழில் தருகிறது; அடுத்த அரையடியிலுள்ள לְעוֹלָם என்பதுடனான கவிதை இணைநிலையையும் காக்கிறது.
- source_word: יָרִיב
  choice: வழக்காடிக்கொண்டிருக்கமாட்டார்
  rationale: ריב என்பதிலுள்ள வாதிடுதல், எதிர்த்து நிற்றல், வழக்குத் தொடுப்பது ஆகிய நீதித்துறை–உறவுசார் நிழல்களை அளவுக்கு மீறிக் குறிப்பாக்காமல் தக்கவைக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: காலவரையற்ற அல்லது நீடித்த காலத்தை இயல்பாகக் குறிக்கிறது; முதல் அரையடியின் எப்போதும் என்பதற்கு இணையாக நிற்கிறது.
- source_word: יִטּוֹר
  choice: மனத்தில் வைத்துக்கொண்டிருக்கவும் மாட்டார்
  rationale: נטר என்பதன் வைத்திருத்தல் அல்லது காத்துவைத்தல் என்ற அடிப்படை உணர்வையும், இச்சூழலில் கோபத்தையோ மனக்குறையையோ தொடர்ந்து வைத்திருத்தல் என்ற மரபுத்தொடர் பொருளையும் தருகிறது; எபிரேயத்தில் விடப்பட்டுள்ள செயப்படுபொருளை முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
theological_decisions:
- issue: தேவன் எதை எதிர்த்து வழக்காடுகிறார் அல்லது எதை மனத்தில் வைத்திருக்கிறார் என்பதை வெளிப்படையாகக் குறிப்பிடுவதா
  choice: எபிரேயத்தைப் போலவே இரு செயல்களின் செயப்படுபொருள்களையும் மறைமுகமாக விடுதல்.
  alternative: “அவர் என்றென்றும் தமது கோபத்தை வைத்திருக்கமாட்டார்” என்று ‘கோபம்’ என்பதை வெளிப்படையாகச் சேர்த்தல்.
  rationale: சுற்றியுள்ள வசனங்கள் தேவனுடைய சினத்தைச் சுட்டினாலும், இவ்வசனத்தின் எபிரேய உரையில் ‘கோபம்’ என்ற செயப்படுபொருள் இல்லை. அதைச் சேர்க்காமல் விடுவது மூலத்தின் கவிதைச் சுருக்கத்தையும் உண்மையான மறைபொருளையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. “வழக்காடுதல்” மூலத்தின் நீதித்துறைச் சாயலைக் காக்கிறது; “மனத்தில் வைத்துக்கொண்டிருத்தல்” தமிழில் இயல்பாக இருந்து, வெளிப்படையாகக் கூறப்படாத கோபத்தை உரைக்குள் சேர்க்காமல் அதன் சூழல்சார் பொருளை உணர்த்துகிறது.
