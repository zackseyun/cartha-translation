source:
  edition: WLC
  text: בָּרֲכ֤וּ יְהוָ֨ה כָּֽל מַעֲשָׂ֗י/ו בְּ/כָל מְקֹמ֥וֹת מֶמְשַׁלְתּ֑/וֹ בָּרֲכִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/022.yaml
  text: Bless Yahweh[a], all his works, in all the places of his dominion. Bless Yahweh[c][b], O my soul.
translation:
  language: ta
  text: யாவேவை வாழ்த்துங்கள், அவருடைய செயல்களே, அவருடைய ஆட்சியின் எல்லா இடங்களிலும்! என் ஆத்துமாவே, யாவேவை வாழ்த்து!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכ֤וּ / בָּרֲכִ֥י
  choice: வாழ்த்துங்கள் / வாழ்த்து
  rationale: ברך என்பதன் பன்மை மற்றும் பெண்பால் ஒருமை கட்டளை வடிவங்களை நேரடியாகப் பிரதிபலிக்கிறது; சங்கீதத்தின் தொடக்கமும் முடிவும் இணையும் மறுமொழியையும் காக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் இறைத் திருப்பெயரைத் தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என்ற வடிவில் வழங்குகிறது.
- source_word: כָּל מַעֲשָׂיו
  choice: அவருடைய செயல்களே
  rationale: מַעֲשֶׂה என்பது அவர் செய்தவை அல்லது படைத்தவை அனைத்தையும் விரிவாகக் குறிக்கலாம். விளிச் சொல் வடிவம் அவையே கட்டளையின் முன்னிலைப் பெறுநர்கள் என்பதைத் தெளிவாக்குகிறது.
- source_word: בְּכָל מְקֹמוֹת מֶמְשַׁלְתּוֹ
  choice: அவருடைய ஆட்சி செலுத்தப்படும் எல்லா இடங்களிலும் உள்ளவைகளே
  rationale: מֶמְשָׁלָה குறிக்கும் ஆளுகை அல்லது ஆட்சியதிகாரத்தைப் புவியியல் அரசாக மட்டும் சுருக்காமல், அவரது ஆட்சி எங்கெல்லாம் பரவியுள்ளதோ அங்குள்ள செயல்கள் என இயல்பான தமிழில் இணைக்கிறது.
- source_word: נַפְשִׁי
  choice: என் ஆத்துமாவே
  rationale: சங்கீதக்காரரின் நேரடியான தன்முக அழைப்பையும் கவிதைநயமுள்ள உயர்ந்த நடையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைத் திருப்பெயரை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது. தமிழ்க் கிறிஸ்தவப் பயன்பாட்டில் பரவலாக அறியப்பட்ட வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பதும் சாத்தியமான ஒலிபெயர்ப்பு.
- issue: מַעֲשָׂיו என்பதன் பரப்பு
  choice: அவருடைய செயல்கள்
  alternative: அவர் படைத்த அனைத்தும்
  rationale: சொல் படைப்புகளை மட்டுமல்லாமல் கடவுளுடைய செயல்களையும் குறிக்கக்கூடியதால், மூலத்தின் பரந்த பொருளையும் நுண்ணிய தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் கட்டளை பன்மையிலும் இறுதிக் கட்டளை ஆத்துமாவை நோக்கிய ஒருமையிலும் இருப்பது தெளிவாக வைக்கப்பட்டுள்ளது.
