  text: to those who keep his covenant[a], and to those who remember his precepts[b], to do them.
translation:
  language: ta
  text: அவருடைய உடன்படிக்கையைக் கடைப்பிடிப்பவர்களுக்கும்[a], அவற்றைச் செய்வதற்காக அவருடைய நியமங்களை[b] நினைவில் வைத்திருப்பவர்களுக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய உடன்படிக்கையைக் காக்கிறவர்களுக்கும்.’
    reason: lexical_alternative
  - marker: b
    text: ‘நியமங்கள்’ என்பதற்கு ‘அறிவுறுத்தல்கள்’ அல்லது ‘கட்டளைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמְרֵי
  choice: கைக்கொள்கிறவர்கள்
  rationale: שׁמר என்பதற்கு காத்தல், பேணுதல், கடைப்பிடித்தல் ஆகிய பொருள்கள் உண்டு. உடன்படிக்கைச் சூழலில் உண்மையுடன் அதன்படி நடப்பதை இயல்பாக உணர்த்துவதால் ‘கைக்கொள்கிறவர்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְרִיתוֹ
  choice: அவருடைய உடன்படிக்கை
  rationale: בְּרִית என்பது இங்கு இறைவனுக்கும் அவரது மக்களுக்கும் இடையிலான உறுதிப்படுத்தப்பட்ட உறவைச் சுட்டுகிறது; ‘உடன்படிக்கை’ அதன் வேதாகம மற்றும் இறையியல் நிறையைப் பாதுகாக்கிறது.
- source_word: וּלְזֹכְרֵי
  choice: நினைவில் கொண்டு
  rationale: זכר வெறும் மன நினைவை மட்டும் அல்லாமல் செயலுக்கு வழிநடத்தும் கவனமான நினைவையும் குறிக்கிறது. தொடர்ந்து வரும் செயற்பாட்டு சொற்றொடருடன் இயல்பாக இணைய ‘நினைவில் கொண்டு’ என மொழிபெயர்க்கப்பட்டது.
- source_word: פִקֻּדָיו
  choice: அவருடைய நியமங்கள்
  rationale: פִּקּוּדִים என்பது ஆண்டவர் விதித்த வழிகாட்டும் ஆணைகளைக் குறிக்கிறது. ‘நியமங்கள்’ என்பது கட்டளைகள் அல்லது சட்டங்கள் போன்ற தொடர்புடைய தோரா சொற்களுடன் முழுமையாக ஒன்றாக்காமல் இதன் தனித்த நுட்பத்தைப் பேணுகிறது.
- source_word: לַעֲשׂוֹתָם
  choice: அவற்றைச் செயல்படுத்துகிறவர்கள்
  rationale: ל prefixed infinitive நினைவுகூர்வது நடைமுறை கீழ்ப்படிதலுக்குச் செல்கிறது என்பதை உணர்த்துகிறது. தமிழ் நடையில் இயல்பாக இருக்கவும் செயற்பாட்டு நோக்கைப் பாதுகாக்கவும் இவ்வாறு தரப்பட்டது.
theological_decisions:
- issue: இறைவனுடைய நியமங்களை ‘நினைவில் கொள்வதன்’ ஒழுக்கச் செயற்பாட்டு வலிமை
  choice: ‘நினைவில் கொண்டு அவற்றைச் செயல்படுத்துகிறவர்கள்’ என்று மொழிபெயர்த்து, நினைவு நடைமுறை கீழ்ப்படிதலோடு இணைந்திருப்பதைப் பாதுகாத்தல்
  alternative: ‘அவற்றைச் செய்வதற்காக அவருடைய நியமங்களை நினைவில் கொள்கிறவர்கள்’
  rationale: எபிரெயச் சொற்றொடர் நினைவையும் செயலையும் இணைக்கிறது. இம்மொழிபெயர்ப்பு வெறும் அறிவுசார் நினைவு என்ற பொருளைத் தவிர்க்கிறது; அதேவேளையில் கிரியைகளால் நீதியடைவது போன்ற எந்தக் கோட்பாட்டையும் உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. இணையான இரு தத்திவ் சொற்றொடர்களின் அமைப்பு ‘-வர்களுக்கும்’ என்பதன் மூலம் பேணப்பட்டுள்ளது; முந்தைய வசனத்துடன் தொடரும் துணைவாக்கியத் தன்மையும் அப்படியே வைக்கப்பட்டுள்ளது.
