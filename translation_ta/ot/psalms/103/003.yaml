    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּלֵחַ
  choice: மன்னித்து
  rationale: பெயர்ச்சொல் தன்மையுடன் வரும் எபிரெயப் பங்கேற்புவினை, கர்த்தரின் தொடர்ச்சியான பண்புசார் செயலைக் குறிக்கிறது. முந்தைய வசனத்துடன் இயல்பாக இணையும் தமிழ் தொடரமைப்பில் ‘மன்னித்து’ என வழங்கப்பட்டுள்ளது.
- source_word: לְכָל
  choice: அனைத்தையும்
  rationale: தொடர்ந்து வரும் தொகுப்புப் பொருள்களின் முழுமையான பரப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲוֺנֵכִי
  choice: உன் அக்கிரமம்
  rationale: עָוֹן என்பதிலுள்ள ஒழுக்கக் கேடு, குற்றம், குற்றப்பழி ஆகிய அர்த்தச்சுமையை ‘அக்கிரமம்’ காக்கிறது; எபிரெய ஒருமையின் தொகுப்புப் பொருளும் தக்கவைக்கப்படுகிறது.
- source_word: הָרֹפֵא
  choice: குணமாக்குகிறவர்
  rationale: இரண்டாவது பெயர்ச்சொல் தன்மையுள்ள பங்கேற்புவினையை, கர்த்தரின் பண்புசார் செயலைத் தெளிவாகக் காட்டும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: תַּחֲלֻאָיִכִי
  choice: உன் நோய்கள்
  rationale: இந்தச் சொல் நோய் அல்லது உடல்நலக் குறைவை நேரடியாகக் குறிக்கிறது; ‘நோய்கள்’ என்பது அதன் உறுதியான பொருளைத் தெளிவாகவும் பொதுவாகவும் தருகிறது.
theological_decisions:
- issue: குணமாக்குதல் என்ற மொழியை ஆன்மீகப் பொருளாக மட்டும் மாற்ற வேண்டுமா?
  choice: ‘உன் நோய்கள் அனைத்தையும் குணமாக்குகிறவர்’ என்ற நேரடியான பொருளை வைத்திருத்தல்
  alternative: ‘உன் ஆன்மீக நோய்கள் அனைத்தையும் குணமாக்குகிறவர்’ அல்லது உருவகத் துன்பங்களையும் வெளிப்படையாக உள்ளடக்கும் விரிவாக்கம்
  rationale: எபிரெயச் சொல் இயல்பாக நோய் அல்லது உடல்நலக் குறைவைக் குறிக்கிறது. சங்கீதத்தின் கவிதைச் சூழல் விரிவான இறையியல் வாசிப்பை அனுமதிக்கலாம்; ஆனால் மொழிபெயர்ப்பு அதன் பரப்பை உடல் சார்ந்ததாக மட்டும் அல்லது ஆன்மீகமானதாக மட்டும் நிர்ணயிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கவித்துவ ஓட்டமும் கொண்ட நடை. சங்கீதம் 103:2-இல் உள்ள ‘அவர்’ என்பதுடன் தொடரும் வகையில் வாக்கியம் அமைக்கப்பட்டுள்ளது; பெண்பால் ஒருமை இரண்டாம் நபர் பின்னொட்டுகளைத் தமிழ் இயல்பின்படி பாலின வேறுபாடில்லாத ‘உன்’ என வழங்குகிறது.
