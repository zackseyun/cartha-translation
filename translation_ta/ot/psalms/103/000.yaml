  yaml_path: translation/ot/psalms/103/000.yaml
  text: Of David. Bless the LORD, O my soul, and all that is within me[a], bless his holy name.
translation:
  language: ta
  text: தாவீதுக்குரியது. என் உயிரே, ஆண்டவரைப் போற்று; எனக்குள் உள்ள அனைத்துமே[a] அவருடைய பரிசுத்தப் பெயரைப் போற்றட்டும்.
  philosophy: optimal-equivalence
