lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதின் பாடல்
  rationale: இது தாவீதுடன் சங்கீதத்தைத் தொடர்புபடுத்தும் தலைப்பு. இயல்பான தமிழுக்காக ‘பாடல்’ சேர்க்கப்பட்டுள்ளது; எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவம் உட்பட பலவகைத் தொடர்பைக் குறிக்கக்கூடும்.
- source_word: בָּרֲכִי
  choice: போற்று / போற்றட்டும்
  rationale: தேவனை நோக்கிப் பயன்படுத்தப்படும் ברך என்பதன் பொருள் இங்கு ‘புகழ்ந்து போற்று’. இரண்டாவது வினை எபிரெயத்தில் விடுபட்டிருந்தாலும் தமிழில் தெளிவுக்காக மீண்டும் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: נַפְשִׁי
  choice: என் உயிரே
  rationale: נפשׁ என்பது இங்கு பாடகர் தன்னையே உள்ளார்ந்து அழைக்கும் சொல்; ‘ஆத்துமா’ என்பதைவிட ‘உயிர்’ நவீனத் தமிழில் இயல்பாகவும் முழு ஆளுமையைச் சுட்டுவதாகவும் உள்ளது.
- source_word: כָל־קְרָבַי
  choice: எனக்குள் உள்ள அனைத்துமே
  rationale: சொல்லாட்சிப்படி ‘என் உட்பகுதிகள்’; சூழலில் ஒருவரின் முழு உள்ளார்ந்த இருப்பைச் சுட்டுவதால் இயல்பான பொருளை முதன்மை உரையில் கொடுத்து, சொல்லாட்சியை அடிக்குறிப்பில் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தெய்வீகப் பெயரான יהוה-ஐ மரியாதைமிக்க, பரவலாகப் புரியக்கூடிய தமிழ் மரபுப்படி ‘ஆண்டவர்’ என வழங்குகிறது.
- source_word: שֵׁם קָדְשׁוֹ
  choice: அவருடைய பரிசுத்தப் பெயர்
  rationale: எபிரெயச் சொற்றொடரின் பொருளையும் வழிபாட்டு மொழியின் கண்ணியத்தையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: לְדָוִד என்பதன் தொடர்பு
  choice: தாவீதின் பாடல்
  alternative: தாவீதுக்குரியது / தாவீதிற்காக
  rationale: தலைப்பு தாவீதுடனான தொடர்பை உறுதிப்படுத்துகிறது; ஆனால் அந்தத் தொடர்பின் துல்லிய இயல்பை எபிரெயம் தனியாக நிர்ணயிக்கவில்லை. தமிழில் வழக்கமான தலைப்புரையாக வழங்கப்பட்டுள்ளது.
- issue: ‘என் உயிர்’ மற்றும் ‘எனக்குள் உள்ள அனைத்தும்’ இடையிலான உறவு
  choice: முழு மனிதனும் தேவனைப் போற்றும் உள்ளார்ந்த சுயஅழைப்பு
  alternative: உடல் உறுப்புகளை மட்டும் குறிக்கும் வாசிப்பு
  rationale: கவிதை இணைமுறை முழு உள்ளார்ந்த ஆளுமையை வலியுறுத்துகிறது; உடலையும் உள்ளத்தையும் பிரிக்கும் ஒரு குறிப்பிட்ட மனிதவியல் கோட்பாட்டை உரையில் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் உயிரே’ என்ற நேரடி அழைப்பும் ‘போற்று’ என்ற ஒருமை ஏவலும் கவிதையின் சுயஅழைப்பைத் தக்கவைக்கின்றன. ‘எனக்குள் உள்ள அனைத்துமே’ என்பதற்குப் பன்மை உணர்வுடன் ‘போற்றட்டும்’ பயன்படுத்தப்பட்டுள்ளது.
