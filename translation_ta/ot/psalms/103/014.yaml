  terminology: ‘தூசி’ suitably renders עָפָר and retains the creation-and-mortality imagery. ‘உருவமைப்பு’ appropriately conveys the formed constitution/frame denoted by יֵצֶר without imposing a doctrinal interpretation. The footnote retains legitimate lexical alternatives.
