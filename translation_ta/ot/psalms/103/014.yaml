lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்துவதால், எபிரெயச் சொல்லின் காரணப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הוּא
  choice: அவர்
  rationale: எபிரெயில் வலியுறுத்தப்பட்டுள்ள வெளிப்படையான பிரதிப்பெயரைத் தக்கவைக்கிறது; சூழலில் இது கடவுளைக் குறிக்கிறது.
- source_word: יָדַע
  choice: அறிந்திருக்கிறார்
  rationale: Qal perfect இங்கு நிலைத்த, தற்போதும் தொடரும் அறிவைக் குறிக்கிறது; தமிழ் நடையில் ‘அறிந்திருக்கிறார்’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִצְרֵנוּ
  choice: நாம் எவ்வாறு உருவாக்கப்பட்டவர்கள்
  rationale: יֵצֶר என்பது உருவாக்கப்பட்டது அல்லது வடிவமைக்கப்பட்டது என்பதைக் குறிக்கிறது. ‘நமது அமைப்பு’ என்பதைவிட இச்சொற்றொடர் சாதாரண வாசகருக்குத் தெளிவாகவும், மனிதரின் படைக்கப்பட்ட தன்மையை மிகை விளக்கமின்றி வெளிப்படுத்துவதாகவும் உள்ளது.
- source_word: זָכוּר
  choice: நினைவில் வைத்திருக்கிறார்
  rationale: வடிவியல் ரீதியாக passive participial/adjectival வடிவமாக இருந்தாலும், இங்கு கடவுளின் தொடர்ந்த நினைவுணர்வைப் பயனிலையாகக் கூறுகிறது; ‘அறிந்திருக்கிறார்’ என்பதுடன் இணையான தெளிவான தமிழ் நடை இது.
- source_word: כִּי
  choice: என்பதை
  rationale: இரண்டாவது כִּי, கடவுள் நினைவில் வைத்திருப்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் ‘என்பதை’ அந்தத் தொடரமைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: עָפָר
  choice: தூசி
  rationale: படைப்பு மற்றும் மனித நிலையாமை பற்றிய ஆதியாகமப் படிமத்தைத் தக்கவைக்கும் நேரடியான, மரபுமிக்க தமிழாக்கம்.
- source_word: אֲנָחְנוּ
  choice: நாம்
  rationale: எபிரெயப் பெயர்ச்சொல் வாக்கியத்தைத் தமிழில் ‘நாம் தூசி’ என்று இயல்பாகக் கூற முடிவதால், தேவையற்ற வினைச்சொல் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: மனித பலவீனத்தையும் படைக்கப்பட்ட தன்மையையும் குறிக்கும் உருவகம்
  choice: ‘நாம் தூசி’ என்று மொழிபெயர்க்கப்பட்டது
  alternative: ‘நாம் வெறும் தூசிதான்’
  rationale: இவ்வசனம் மனிதரின் மரணத்தன்மையையும் பலவீனத்தையும் கடவுள் இரக்கத்துடன் அறிந்திருப்பதைச் சொல்கிறது; மனித மாண்பை மறுப்பதில்லை. ‘வெறும்’ அல்லது ‘தான்’ போன்ற கூடுதல் வலியுறுத்தலைச் சேர்க்காமல் எபிரெயப் படிமத்தையும் அதன் இறையியல் அழுத்தத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கண்ணியமானதாயும் பொதுவாசகருக்குத் தெளிவானதாயும் உள்ளது. ‘நாம் எவ்வாறு உருவாக்கப்பட்டவர்கள்’ என்பது மூலத்தின் பொருளை வெளிப்படுத்தும் இயல்பான தமிழ்; அடிக்குறிப்பு அதன் சுருக்கமான பெயர்ச்சொல் மாற்றுகளைப் பாதுகாக்கிறது.
