  text: He has not dealt with us according to our sins[a], nor repaid us according to our iniquities.
translation:
  language: ta
  text: 'அவர் நம் பாவங்களுக்கு ஏற்றபடி நம்மை நடத்தவில்லை;

    நம் அக்கிரமங்களுக்கு ஏற்றபடி நமக்குக் கைம்மாறு செய்யவில்லை.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּחֲטָאֵינוּ
  choice: நம் பாவங்களுக்கு ஏற்றபடி
  rationale: כְּ ஒப்பீட்டையும் அளவையும் குறிக்கிறது; இங்கு ‘பாவங்களின் அளவுக்கு ஏற்ப’ என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது. חֲטָאֵינוּ என்பது ‘நம் பாவங்கள்’ எனப் பன்மையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עָשָׂה לָנוּ
  choice: நம்மை நடத்தவில்லை
  rationale: עשה ל־ என்பது இச்சூழலில் ஒருவரிடம் ஒரு விதமாக நடந்துகொள்வதைக் குறிக்கிறது. ‘நம்மை நடத்தவில்லை’ என்பது சொற்சொல் வடிவமான ‘நமக்குச் செய்யவில்லை’ என்பதைவிட இயல்பாகவும் கருத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: וְלֹא
  choice: …வில்லை
  rationale: இரண்டாம் அடியின் மறுப்பைத் தமிழில் இயல்பான இணைநிலை வாக்கியமாகக் காட்டுகிறது; எபிரெயத்தின் இரட்டை மறுப்பும் கவிதை இணைமையும் காக்கப்படுகின்றன.
- source_word: כַּעֲוֺנֹתֵינוּ
  choice: நம் அக்கிரமங்களுக்கு ஏற்றபடி
  rationale: עָוֹן என்பது அக்கிரமம், குற்றப்பழி, அதன் விளைவு ஆகிய பொருள் பரப்பைக் கொண்டது. ‘அக்கிரமங்கள்’ என்பது முதல் அடியிலுள்ள ‘பாவங்கள்’ என்பதிலிருந்து சொல்வேறுபாட்டைக் காத்து, பொருளை தேவையின்றி குறுக்காது.
- source_word: גָּמַל עָלֵינוּ
  choice: நமக்குப் பதிலளிக்கவில்லை
  rationale: גמל இங்கு ஒருவரது செயலுக்கு ஏற்ப திருப்பிக் கொடுத்தல் அல்லது கைம்மாறு செய்தல் என்ற எதிர்மறைச் சூழல் பொருளைக் கொண்டது. ‘பதிலளிக்கவில்லை’ என்பது நம் அக்கிரமங்களுக்குத் தக்க விளைவை அவர் நம்மீது வரச்செய்யவில்லை என்ற கருத்தை, மிகையாக விளக்காமல், நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לֹא ... וְלֹא
  choice: …வில்லை; …வில்லை
  rationale: இரு கவிதை அடிகளிலும் உள்ள மறுப்பைத் தெளிவாக மீளுரைத்து, மூலத்தின் சமநிலை அமைப்பையும் வலியுறுத்தலையும் காக்கிறது.
theological_decisions:
- issue: இறைவனுடைய இரக்கத்தைப் பற்றிய கூற்றில் பாவநிவிர்த்தி அல்லது நியாயத்தீர்ப்பின் காலம் குறித்த கோட்பாட்டைச் சேர்க்காமல் மொழிபெயர்த்தல்
  choice: நம் பாவங்களின் அளவுக்கு ஏற்ப கடவுள் நம்மை நடத்தவோ, நம் அக்கிரமங்களுக்கு ஏற்ப பதிலளிக்கவோ இல்லை என்ற பொதுவான கூற்று
  alternative: இது இவ்வுலகத் தண்டனைகளை மட்டும் குறிக்கிறது; அல்லது எந்தத் தண்டனையும் இல்லை என்று முழுமையாகக் கூறுகிறது
  rationale: எபிரெய உரை கடவுளின் இரக்கமுள்ள நடத்தையையும், பாவத்தின் அளவுக்கு ஏற்ப அவர் கைம்மாறு செய்யாததையும் விரிவாகக் கூறுகிறது. வசனம் சொல்லாத தீர்ப்புக் கோட்பாடு அல்லது காலவரம்பை மொழிபெயர்ப்பு சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், மரியாதைமிக்க கவிதைநடை. இரு இணை அடிகளின் அமைப்பும் ‘பாவங்கள் / அக்கிரமங்கள்’ என்ற மூலச் சொல்வேறுபாடும் காக்கப்பட்டுள்ளன.
