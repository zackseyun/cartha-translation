  choice: உமது உண்மைத்தன்மை
  rationale: אֱמֶת இங்கு வெறும் கருத்தியல் 'உண்மை' மட்டுமல்லாமல் கடவுளின் நம்பகத்தன்மையையும் விசுவாசத்தையும் குறிக்கிறது; 'உண்மைத்தன்மை' இரண்டிற்கும் இடமளிக்கிறது.
theological_decisions:
- issue: חֶסֶד மற்றும் אֱמֶת ஆகிய இறைப் பண்புகளின் இணைப்பு
  choice: மாறாத அன்பு / உண்மைத்தன்மை
  alternative: உடன்படிக்கை அன்பு / உண்மை; பேரன்பு / விசுவாசம்
  rationale: மூலத்தின் உடன்படிக்கை சார்ந்த பற்றுறுதியைத் தக்கவைத்தாலும், உரையில் நேரடியாக இல்லாத தொழில்நுட்பச் சொல்லான 'உடன்படிக்கை'யைச் சேர்க்கவில்லை. אֱמֶת என்பதன் 'உண்மை' மற்றும் 'நம்பகத்தன்மை' நிழற்பொருள்கள் இரண்டையும் 'உண்மைத்தன்மை' திறந்தவையாக வைத்திருக்கிறது.
- issue: גָדֹל עַד என்ற அளவு/விரிவு படிமம்
  choice: வானங்கள்வரை உயர்ந்துள்ளது
  alternative: வானங்கள்வரை பெரிதாயிருக்கிறது
  rationale: தமிழில் இயல்பான கவித்துவ நடைக்காக 'உயர்ந்துள்ளது' பயன்படுத்தப்படுகிறது; இது இறைப் பண்பை இடவியல் பொருளாக மாற்றாமல் அதன் அளவற்ற விரிவைச் சுட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. இறைவனை நோக்கிய மரியாதைப் பன்மையான ‘உமது’ பயன்படுத்தப்பட்டுள்ளது; இரு இணை வரிகளின் வானங்கள்/மேகங்கள் படிமம் காக்கப்பட்டுள்ளது.
