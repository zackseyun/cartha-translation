  yaml_path: translation/ot/psalms/057/001.yaml
  text: Be gracious to me[a], God, be gracious to me, for in you my soul takes refuge[b]; and in the shadow of your wings I will take refuge until destruction passes by.
translation:
  language: ta
  text: எனக்கு அருள்புரியும், கடவுளே, எனக்கு அருள்புரியும்! ஏனெனில் உம்மிடத்தில் என் உயிர் அடைக்கலம் புகுந்திருக்கிறது[a]. உமது சிறகுகளின் நிழலில் நான் அடைக்கலம் புகுவேன்; பேரழிவுகள்[b] கடந்துபோகும்வரை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் உயிர்’ என்பதற்கான எபிரெயச் சொல் (נַפְשִׁי), ‘என் ஆத்துமா,’ ‘என் வாழ்க்கை’ அல்லது ‘நானே’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் இது பன்மைச் சொல்; ‘அழிவுகள்,’ ‘பேரிடர்கள்’ அல்லது அழிவை உண்டாக்கும் ஆபத்துகள் என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: எனக்கு அருள்புரியும்
  rationale: חנן வினையின் கட்டளை வடிவம், தன்மைப் பொருள் ஒருமை பின்னொட்டுடன் வந்து, கடவுளின் அருள் அல்லது தயவைக் கோருகிறது. ‘அருள்புரியும்’ என்பது வேண்டுதலின் வலிமையையும் மரியாதையான கவித்துவ நடையையும் இயல்பாகக் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: நேரடி அழைப்பில் வரும் பொதுவான இறைப்பட்டம். தமிழில் விளிவேற்றுமையை ‘-ஏ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְךָ
  choice: உம்மிடத்தில்
  rationale: חסה என்பதுடன் வரும் ב, அடைக்கலம் தேடப்படும் நபரைச் சுட்டுகிறது. ‘உம்மிடத்தில்’ என்பது தமிழில் இயல்பாகவும் மரியாதையாகவும் உள்ளது.
- source_word: חָסָיָה נַפְשִׁי
  choice: என் உயிர் அடைக்கலம் புகுந்திருக்கிறது
  rationale: נפש என்பது உயிர், தன் முழு ஆளுமை, அல்லது பாரம்பரியமாக ‘ஆத்துமா’ என்று பொருள்படலாம். ‘என் உயிர்’ என்பது உடலிலிருந்து பிரிந்த ஓர் ஆன்மீகக் கூறு என்ற கருத்தைத் திணிக்காமல், முழு நபர் அல்லது உயிர் என்ற எபிரெய நுணுக்கத்தைப் பாதுகாக்கிறது. perfect வடிவம் நிலைபெற்ற நம்பிக்கையை ‘புகுந்திருக்கிறது’ என வெளிப்படுத்துகிறது.
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: உமது சிறகுகளின் நிழலில்
  rationale: தெய்வீகப் பாதுகாப்பைக் குறிக்கும் பறவை உருவகத்தை விளக்கவுரையாக மாற்றாமல் நேரடியாகக் காக்கிறது.
- source_word: אֶחְסֶה
  choice: நான் அடைக்கலம் புகுவேன்
  rationale: தன்மைப் பொருள் ஒருமை imperfect வடிவம் இங்கு தொடர்ந்து அல்லது இனியும் நாடப்படும் அடைக்கலத்தைச் சுட்டுகிறது; எதிர்கால வடிவம் முன் வரியிலுள்ள நிலைபெற்ற நம்பிக்கையுடன் உள்ள முன்னேற்றத்தைப் பாதுகாக்கிறது.
- source_word: יַעֲבֹר
  choice: கடந்துபோகும்வரை
  rationale: அபாயம் நகர்ந்து விலகிச் செல்லும் படிமத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַוּוֹת
  choice: பேரழிவுகள்
  rationale: பன்மையில் வரும் சொல் அழிவை உண்டாக்கும் பேரிடர்கள் அல்லது ஆபத்துகளைக் குறிக்கிறது. மூலத்தின் பன்மையைத் தமிழிலும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: נַפְשִׁי என்பதன் மனித இயல்பு சார்ந்த நுணுக்கம்
  choice: என் உயிர்
  alternative: என் ஆத்துமா; நானே
  rationale: இந்த எபிரெயச் சொல் முழு நபரையோ உயிரையோ குறிக்கக்கூடும்; உடலிலிருந்து தனியாக உள்ள ‘ஆத்துமா’ என்ற குறிப்பிட்ட மனிதவியல் கோட்பாட்டை வசனத்தில் திணிக்காமல் ‘என் உயிர்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: ‘உமது சிறகுகளின் நிழல்’ என்ற பாதுகாப்பு உருவகம்
  choice: உருவகத்தை அப்படியே வைத்தல்
  alternative: உமது பாதுகாப்பில்
  rationale: மூலத்தின் கவித்துவமான, மனித உருவில் பேசும் படிமத்தை விளக்கவுரையாகத் தட்டையாக்காமல் பாதுகாக்கிறது; கடவுளுக்கு உடலமைப்பு உண்டு என்றும் உரை தீர்மானிப்பதாக ஆக்கவில்லை.
- issue: הַוּוֹת என்பதன் பன்மை மற்றும் பொருள் பரப்பு
  choice: பேரழிவுகள்
  alternative: அழிவுகள்; பேரிடர்கள்; அழிவை உண்டாக்கும் ஆபத்துகள்
  rationale: மூலத்தின் இலக்கணப் பன்மையைத் தக்கவைத்து, பலவகையான அழிவூட்டும் ஆபத்துகளைக் கூட்டாகக் குறிக்கும் வாய்ப்பை திறந்துவைக்கிறது.
translation_notes:
  register: மரியாதையான ஒருமை இறைமுகப்பு (‘உமது,’ ‘உம்மிடத்தில்’) பயன்படுத்தப்பட்டுள்ளது. நடை நவீனத் தரத் தமிழில், ஜெபத்திற்குரிய கண்ணியத்துடனும் சங்கீதத்தின் இணைவரி மற்றும் சிறகுகளின் நிழல் உருவகத்தைப் பாதுகாக்கும் வகையிலும் அமைக்கப்பட்டுள்ளது.
