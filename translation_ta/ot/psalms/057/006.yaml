- source_word: לִפְעָמַי
  choice: என் காலடிகளுக்காக
  rationale: פעם இங்கு கால் அல்லது காலடி என்ற பொருளைத் தருகிறது; வலைவைக்கும் உருவகத்துடன் இயல்பாகப் பொருந்துகிறது.
- source_word: כָּפַף
  choice: குனிந்துபோனது
  rationale: குனிதல் அல்லது தாழ்தல் என்னும் அடிப்படைப் பொருளை வைத்துக்கொண்டு, נפשי என்பதுடன் இயல்பாக இணைக்கப்படுகிறது.
- source_word: נַפְשִׁי
  choice: என் ஆத்துமா
  rationale: நפשׁ என்பதன் ஆத்துமா, உயிர், நான் ஆகிய பொருள் வாய்ப்புகளில், எபிரெயக் கவிதை மொழியைத் தக்கவைக்கும் தெரிவு இது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּרוּ
  choice: தோண்டினார்கள்
  rationale: குழியை உண்டாக்கும் செயலை நேரடியாகக் குறிக்கும் வினைச்சொல்.
- source_word: לְפָנַי
  choice: எனக்கு முன்னால்
  rationale: சங்கீதக்காரனின் முன்னிலையில் அல்லது அவன் செல்லும் வழியில் எனும் இடப்பொருளை இயல்பான தமிழில் தருகிறது.
