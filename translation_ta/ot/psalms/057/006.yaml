  text: என் காலடிகளுக்காக அவர்கள் ஒரு வலையை ஆயத்தப்படுத்தினார்கள்[a]; என் ஆத்துமா குனிந்துபோனது[b]; எனக்கு முன்னால் ஒரு குழியைத் தோண்டினார்கள்; அவர்கள் அதன் நடுவில் விழுந்தார்கள்[c]. சேலா[d]
  philosophy: optimal-equivalence
