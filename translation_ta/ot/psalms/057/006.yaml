- source_word: נָפְלוּ
  choice: விழுந்தார்கள்
  rationale: எதிரிகளின் திட்டம் அவர்கள்மீதே திரும்பிய முடிவை எபிரெய இறந்தகால வடிவத்துக்கு ஏற்ப தருகிறது.
- source_word: בְתוֹכָהּ
  choice: அதன் நடுவில்
  rationale: சொல்லடியாக அதன் நடுவில் என்று பொருள்; குழிக்குள் விழுந்தார்கள் என்பதைக் காட்டும் இயல்பான தமிழ் அமைப்பு.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியற்றதால் ஊகித்து மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: נַפְשִׁי என்பதன் மனித இயல்பியல் பரப்பு
  choice: என் ஆத்துமா
  alternative: நான் / என் உயிர்
  rationale: ஒரு குறிப்பிட்ட மனித இயல்பியல் கோட்பாட்டைத் திணிக்காமல் மூலத்தின் கவிதைச் சொல்லைத் தக்கவைத்து, அதன் பிற பொருள் வாய்ப்புகளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்தைப் பேணும் நடை. வலை–குழி உருவகங்களும் எதிரிகள் தங்கள் பொறியிலேயே விழும் திருப்பமும் தெளிவாகக் காக்கப்பட்டுள்ளன; அரைப்புள்ளிகள் எபிரெய இணைநிலைக் கவிதை ஓட்டத்தைப் பிரதிபலிக்கின்றன.
