source:
  edition: WLC
  text: לַ/מְנַצֵּ֣חַ אַל תַּ֭שְׁחֵת לְ/דָוִ֣ד מִכְתָּ֑ם בְּ/בָרְח֥/וֹ מִ/פְּנֵי שָׁ֝א֗וּל בַּ/מְּעָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: “அழித்துவிடாதே”[a]. தாவீதுக்குரியது. ஒரு மிக்தாம்[b]. அவர் சவுலிடமிருந்து தப்பியோடியபோது, குகையில்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது ஓர் இசை மெட்டின் பெயராகவோ பல்லவியாகவோ இருக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “மிக்தாம்” என்ற எபிரெயச் சொல்லின் பொருள் உறுதியாகத் தெரியவில்லை; ஆகவே அது மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசையை வழிநடத்தும் நபரைக் குறிக்கும் வழக்கமான சொல்லாக இருப்பதால், நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אַל־תַּשְׁחֵת
  choice: “அழித்துவிடாதே”
  rationale: இது பாடலின் உட்பகுதியில் வரும் கட்டளை என்பதைவிட, தலைப்பு, மெட்டின் பெயர் அல்லது பல்லவி என்பதற்கான வாய்ப்பு அதிகம். மேற்கோள் குறிகள் அதன் தலைப்புத் தன்மையைச் சுட்டுகின்றன; அடிக்குறிப்பு அதன் துல்லியமான செயல்பாடு உறுதியற்றது என்பதைப் பாதுகாக்கிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்குரிய
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், தொடர்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். “தாவீது இயற்றியது” என்று ஒரே பொருளைத் தீர்மானிக்காமல், “தாவீதுக்குரிய” என்பது அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: מִכְתָּם
  choice: மிக்தாம்
  rationale: இச்சொல்லின் துல்லியமான பொருள் உறுதியற்றதால், ஊகமான வகைப்பெயரை வழங்காமல் எபிரெயச் சொல்லைத் தமிழில் ஒலிபெயர்த்துள்ளோம்.
- source_word: בְּבָרְחוֹ מִפְּנֵי שָׁאוּל
  choice: அவர் சவுலிடமிருந்து தப்பியோடி
  rationale: எபிரெய வினையெச்சத் தொடரின் காலச் சூழலை இயல்பான தமிழில் தெரிவிக்கிறது; מִפְּנֵי என்ற சொற்றொடர் இங்கு “சவுலிடமிருந்து” எனத் தெளிவாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: בַּמְּעָרָה
  choice: குகையில் இருந்தபோது
  rationale: בְּ முன்னொட்டு இங்கு இடத்தைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டுள்ளது. தமிழில் முழுமையான, இயல்பான காலச் சூழல் தொடரை உருவாக்க “இருந்தபோது” சேர்க்கப்பட்டுள்ளது; குகைக்குள் சென்ற இயக்கத்தை இது தேவையின்றி முன்வைப்பதில்லை.
theological_decisions:
- issue: சங்கீதத் தலைப்பின் இலக்கிய இயல்பு
  choice: முழு வசனத்தையும் சங்கீதத்தின் தலைப்புக் குறிப்பாக வழங்குதல்
  alternative: “அழித்துவிடாதே” போன்ற கூறுகளைப் பாடலின் கவிதை உட்பகுதியாகக் கருதுதல்
  rationale: இசைத் தலைவருக்கான குறிப்பு, தலைப்பு அல்லது மெட்டு, தாவீதுடனான தொடர்பு, வகைப்பெயர் மற்றும் வரலாற்றுச் சூழல் ஆகிய வழக்கமான தலைப்புக் கூறுகளால் எபிரெய உரை அமைந்துள்ளது.
- issue: לְדָוִד என்பதன் தொடர்பு
  choice: “தாவீதுக்குரிய” என்று மொழிபெயர்த்து தொடர்பின் வகையைத் திறந்தவாறு வைத்தல்
  alternative: “தாவீது இயற்றியது” அல்லது “தாவீதுக்காக” என்று குறிப்பிட்டுப் பொருள்கொள்ளுதல்
  rationale: எபிரெய לְ ஆசிரியத்துவம் மட்டுமன்றி தொடர்பு அல்லது அர்ப்பணிப்பையும் குறிக்க முடியும். உரை கூறுவதைவிட அதிகமான ஆசிரியத்துவக் கோட்பாட்டை மொழிபெயர்ப்பு உறுதிப்படுத்தக்கூடாது.
- issue: מִכְתָּם என்ற உறுதியற்ற வகைப்பெயர்
  choice: “மிக்தாம்” என்று ஒலிபெயர்த்தல்
  alternative: “கல்வெட்டு,” “பொன் சங்கீதம்,” அல்லது “இரகசியப் பாடல்” என்று பொருள் வழங்குதல்
  rationale: இச்சொல்லின் பொருள் விவாதத்திற்குரியது. ஒலிபெயர்ப்பு மூல உரையின் தகவலைப் பாதுகாத்து, ஊகமான விளக்கத்தை வாசகர்கள்மீது திணிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத் தலைப்புக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. “தாவீதுக்குரிய” என்பது ஆசிரியத்துவத்தை தேவையின்றி உறுதிசெய்யாமல் மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது. “அழித்துவிடாதே” மற்றும் “மிக்தாம்” தொடர்பான இரு அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் உரிய இடங்களில் இடம்பெற்றுள்ளன.
