  yaml_path: translation/ot/psalms/057/002.yaml
  text: I call to God Most High[a], to God who fulfills his purpose for me.
translation:
  language: ta
  text: 'உன்னதமான கடவுளை நோக்கிக் கூப்பிடுகிறேன்;

    எனக்கான தமது நோக்கத்தை நிறைவேற்றும்[a] கடவுளை நோக்கிக் கூப்பிடுகிறேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைப் பற்றியதை நிறைவுசெய்யும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקְרָא
  choice: கூப்பிடுகிறேன்
  rationale: கָרָא என்பதன் Qal முற்றுப்பெறா வினை வடிவம் நிகழ்காலத்தையோ எதிர்காலத்தையோ வெளிப்படுத்தலாம். சங்கீதத்தின் உடனடி வேண்டுதல் சூழலில் நிகழ்காலமான ‘கூப்பிடுகிறேன்’ இயல்பாகவும் மூலத்திற்கு நெருக்கமாகவும் உள்ளது; ‘கதறுகிறேன்’ என்பது மூல வினையில் வெளிப்படையாக இல்லாத உணர்ச்சி வலிமையைச் சேர்க்கும்.
- source_word: לֵאלֹהִים
  choice: கடவுளை நோக்கி
  rationale: אֱלֹהִים வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு இஸ்ரவேலின் ஒரே கடவுளையே குறிக்கிறது. לְ முன்னொட்டின் திசைநோக்கிய பொருளை இயல்பான தமிழில் ‘நோக்கி’ வெளிப்படுத்துகிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதமான
  rationale: இது ‘மிக உயர்ந்தவர்’ என்ற பொருளுடைய இறைப்பட்டம். தமிழில் கடவுளை விவரிக்கும் ‘உன்னதமான’ என்பது சுருக்கமாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: לָאֵל
  choice: கடவுளை நோக்கி
  rationale: אֵל என்பது கடவுளைக் குறிக்கும் பொதுவான செமித்தியச் சொல் அல்லது பட்டம். கவிதை இணைநிலையைப் பேண இரு இடங்களிலும் ‘கடவுள்’ பயன்படுத்தப்படுகிறது; இதனை ‘ஏல்’ என்ற தனிப்பெயராக மாற்றவில்லை.
- source_word: גֹמֵר
  choice: நோக்கத்தை நிறைவேற்றுகிற
  rationale: גמר என்பதன் பங்கேற்பு வடிவம் ‘முடித்தல், நிறைவுக்குக் கொண்டுவருதல்’ என்று பொருள்படும். עָלַי உடன் சேரும்போது, பாடகருக்குரியதை கடவுள் நிறைவுக்குக் கொண்டுவருகிறார் என்பதே கருத்து. ‘நோக்கம்’ என்பது தமிழில் மறைபொருளைத் தெளிவாக்கும் சொல்; அது எபிரெயத்தில் வெளிப்படையாக இல்லாததால் அடிக்குறிப்பில் சொற்சார்ந்த மாற்று தரப்படுகிறது.
- source_word: עָלָי
  choice: எனக்கான
  rationale: עַל மற்றும் முதலாம் நபர் பின்னொட்டு இங்கு பாடகருக்காக அல்லது அவரைப் பற்றியதாக நடைபெறுவதைச் சுட்டுகிறது. ‘எனக்கான’ என்பது பயனுறு நுட்பத்தை இயல்பான தமிழில் தருகிறது; ‘என்னைப் பற்றிய’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: גֹמֵר עָלַי என்பதன் பொருள்
  choice: கடவுள் பாடகருக்கான தமது நோக்கத்தை நிறைவேற்றுகிறார்
  alternative: கடவுள் என்னைப் பற்றியதை நிறைவுசெய்கிறார்
  rationale: எபிரெயச் சொற்றொடர் பாடகருக்குரியதை கடவுள் நிறைவுக்குக் கொண்டுவருகிறார் என்பதை இயல்பாக உணர்த்துகிறது. முதன்மை உரை இந்த மறைபொருளைத் தெளிவான தமிழில் வழங்குகிறது; ‘நோக்கம்’ எபிரெயத்தில் வெளிப்படையாக இல்லாததால் சொற்சார்ந்த வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதை நடையுடன் மொழிபெயர்க்கப்பட்டது. இணையான இரு அரையடிகளிலும் ‘கடவுளை நோக்கிக் கூப்பிடுகிறேன்’ என்பதை மீண்டும் கூறி எபிரெயக் கவிதை அமைப்பு வெளிப்படுத்தப்பட்டுள்ளது.
