source:
  edition: WLC
  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/011.yaml
  text: Be exalted above the heavens[a], O God; let your glory be above all the earth.
translation:
  language: ta
  text: 'வானங்களுக்கு மேலாக உயர்ந்தருளும், கடவுளே;


    உமது மகிமை பூமி முழுவதின்மேல் இருப்பதாக.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது மகிமை பூமி முழுவதின்மேல் இருக்கிறது.” எபிரெய இரண்டாம் கவிதை அடியில் வெளிப்படையான வினைச்சொல் இல்லை; எனவே சூழலுக்கேற்ப வினைச்சொல் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: உயர்ந்தருளும்
  rationale: கடவுளை நேரடியாக நோக்கி வேண்டுகின்ற கட்டளை/விருப்ப வடிவத்தின் வலிமையையும், அவர் உயர்ந்தவராக வெளிப்பட வேண்டும் என்ற பொருளையும் இயல்பான மரியாதைமிக்க தமிழில் தருகிறது.
- source_word: עַל
  choice: மேலாக
  rationale: வானங்களையும் பூமி முழுவதையும் சார்ந்த இரு கவிதை அடிகளிலும் உயர்வு மற்றும் மேலாதிக்கம் ஆகிய இரு நுண்பொருள்களையும் தக்கவைக்கிறது.
- source_word: שָׁמַיִם
  choice: வானங்கள்
  rationale: எபிரெயச் சொல்லின் பன்மை வடிவத்தையும் கவிதைநயமுள்ள அண்டவெளிக் காட்சியையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது நேரடி விளி என்பதால் ‘கடவுளே’ என விளிவேற்றுமையில் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָּל הָאָרֶץ
  choice: பூமி முழுவதும்
  rationale: ‘வானங்கள்’ என்பதற்கு இணையான அண்டளாவிய சூழலில், ‘நாடு’ என்பதைவிட ‘பூமி’ பொருத்தமானது; ‘முழுவதும்’ כָּל என்பதன் முழுமையை வெளிப்படுத்துகிறது.
- source_word: כְּבוֹדֶךָ
  choice: உமது மகிமை
  rationale: கடவுளின் வெளிப்படும் மாட்சியையும் கனத்த பெருமையையும் குறிக்கும் כבוד என்பதற்கு தெளிவான, மரியாதைமிக்க தமிழ் இணை.
theological_decisions:
- issue: இரண்டாம் கவிதை அடியில் வெளிப்படையான வினைச்சொல் இல்லாதது
  choice: உமது மகிமை பூமி முழுவதற்கும் மேலாக இருப்பதாக
  alternative: உமது மகிமை பூமி முழுவதற்கும் மேலாக இருக்கிறது
  rationale: முதல் அடியின் வேண்டுதல் தொனியுடன் இணைந்து நிற்கும் வகையில் பிரதான உரையில் விருப்பப் பொருள் தரப்பட்டுள்ளது. அதேவேளையில், எபிரெயத்தில் வினைச்சொல் இல்லாததால் இதை நிகழ்நிலை அறிவிப்பாகவும் புரிந்துகொள்ள முடியும்; அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க கவிதை மற்றும் ஜெப நடையைப் பயன்படுத்துகிறது. ‘உயர்ந்தருளும்’ என்பது தெய்வத்தை நோக்கிய நேரடி வேண்டுதலுக்கு இயல்பான மரியாதை வடிவம்; இரு அடிகளின் அண்டளாவிய இணைநிலையும் பேணப்பட்டுள்ளது.
