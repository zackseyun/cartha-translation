  yaml_path: translation/ot/psalms/057/004.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
translation:
  language: ta
  text: 'என் உயிர் சிங்கங்களின் நடுவில் இருக்கிறது;


    தீப்பற்றி எரிகிறவர்களான[b] மனிதரின் மகன்களிடையே[a] நான் படுத்திருக்கிறேன்—


    அவர்களுடைய பற்கள் ஈட்டிகளும் அம்புகளுமாக இருக்கின்றன;


    அவர்களுடைய நாவோ கூர்மையான வாளாக இருக்கிறது.'
  philosophy: optimal-equivalence
