    text: “மனிதரின் மகன்கள்” என்பதை “மனிதர்கள்” அல்லது “ஆண்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தீப்பற்றி எரிகிறவர்கள்” என்பதை “எரிகிறவர்கள்” அல்லது “கொழுந்துவிட்டு எரிகிறவர்கள்” என்றும் மொழிபெயர்க்கலாம்; இது எதிரிகளின் கடுமையான பகைமையைச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: என் உயிர்
  rationale: נֶפֶשׁ என்பது உயிர், ஆள், சுயம், ஆன்மா ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு ஆபத்துக்குள்ளான சங்கீதக்காரரின் உயிரையே குறிக்கும் இயல்பான தமிழ்ச் சொல்லாக ‘என் உயிர்’ அமைகிறது; ‘என் ஆத்துமா’ எனக் குறுக்கி விளக்குவதைத் தவிர்க்கிறது.
- source_word: בְּתוֹךְ לְבָאִם
  choice: சிங்கங்களின் நடுவில்
  rationale: சூழப்பட்ட ஆபத்தின் காட்சியையும் ‘சிங்கங்கள்’ என்ற எபிரெயக் கவிதைப் படிமத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֶשְׁכְּבָה
  choice: நான் படுத்திருக்கிறேன்
  rationale: שׁכב வினையின் உடல்சார்ந்த படுத்திருக்கும் நிலையை இயல்பான நிகழ்காலத் தமிழில் தருகிறது.
- source_word: לֹהֲטִים
  choice: தீப்பற்றி எரிகிறவர்கள்
  rationale: இந்தப் பங்கேற்பு வடிவம் எரிதல் அல்லது கொழுந்துவிட்டு எரிதல் என்ற படிமத்தைக் கொண்டது. எதிரிகளின் சீற்றத்தை விளக்கவுரையாக மாற்றாமல் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בְּנֵי אָדָם
  choice: மனிதரின் மகன்கள்
  rationale: எபிரெயின் ஆண்பால் குறியீடும் கவிதைநடையும் பாதுகாக்கப்படுகின்றன; தமிழில் இதன் பொதுவான மனிதக் குறிப்பு அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: שִׁנֵּיהֶם חֲנִית וְחִצִּים
  choice: அவர்களுடைய பற்கள் ஈட்டிகளும் அம்புகளுமாய் இருக்கின்றன
  rationale: பற்களை ஆயுதங்களோடு ஒப்பிடும் வலிமையான உருவகத்தைத் தக்கவைக்கிறது. ஒருமை ‘ஈட்டி’ கவிதை/கூட்டுப் பொருளில் வருவதால் இயல்பான தமிழில் பன்மையாக வழங்கப்படுகிறது.
- source_word: וּלְשׁוֹנָם חֶרֶב חַדָּה
  choice: அவர்களுடைய நாவோ கூர்மையான வாள்
  rationale: அழிவை உண்டாக்கும் பேச்சுக்கான உருவகத்தை நேரடியாகவும் சுருக்கமாகவும் காக்கிறது; ‘நாவோ’ முந்தைய உறுப்புடன் உள்ள வேறுபாட்டை இயல்பாக இணைக்கிறது.
theological_decisions:
- issue: சிங்கங்கள் மற்றும் ஆயுதங்களின் படிமம் நேரடியானதா அல்லது உருவகமானதா
  choice: மனித எதிரிகளைச் சித்தரிக்கும் கவிதைப் படிமங்களை விளக்காமல் அப்படியே பாதுகாத்தல்
  alternative: உண்மையான சிங்கங்களும் மனித எதிரிகளும் எனப் பிரித்தல், அல்லது அனைத்தையும் வன்முறையாளர்களுக்கான உருவகமாக வெளிப்படையாக மாற்றுதல்
  rationale: வசனம் ‘சிங்கங்கள்’ என்பதிலிருந்து ‘மனிதரின் மகன்கள்’ என்பதற்கு நகர்ந்து அடுக்கான கவிதைப் படிமத்தை உருவாக்குகிறது. அதன் தெளிவின்மையையும் இழுவிசையையும் மொழிபெயர்ப்பு தீர்த்துவிடக் கூடாது.
- issue: בְּנֵי אָדָם என்பதிலுள்ள பாலினமும் மனிதக் குறிப்பும்
  choice: மனிதரின் மகன்கள்
  alternative: மனிதர்கள்; ஆண்கள்; ஆதாமின் மகன்கள்
  rationale: மூலத்தின் ஆண்பால் வடிவத்தையும் கவிதைச் சொற்றொடரையும் முதன்மை உரை காக்கிறது; அது பொதுவாக மனிதர்களைக் குறிக்கக்கூடும் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்கு விளங்கும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயின் சிங்கம், தீ, ஈட்டி, அம்பு, வாள் ஆகிய படிமங்கள் விளக்கவுரையாக மாற்றப்படாமல் தக்கவைக்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
