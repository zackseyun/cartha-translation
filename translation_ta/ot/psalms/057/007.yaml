translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நேரடி உரைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் இருமுறை வரும் ‘என் இதயம் உறுதியாய் இருக்கிறது’ என்ற அமைப்பு வலியுறுத்தலுக்காக அப்படியே காக்கப்பட்டுள்ளது. இணை கோஹோர்டேட்டிவ்களின் தீர்மானத் தொனியும், זמר என்பதிலுள்ள இசை/துதி நுண்பொருள் இடைவெளியும் பாதுகாக்கப்பட்டுள்ளன.
