  text: נָ֘כ֤וֹן לִבִּ֣/י אֱ֭לֹהִים נָכ֣וֹן לִבִּ֑/י אָ֝שִׁ֗ירָה וַ/אֲזַמֵּֽרָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/007.yaml
  text: My heart is steadfast[a], O God; my heart is steadfast. I will sing, yes[b], I will make melody.
translation:
  language: ta
  text: 'என் இதயம் உறுதியாய் இருக்கிறது[a], இறைவனே;

    என் இதயம் உறுதியாய் இருக்கிறது.

    நான் பாடுவேன்; இசையுடன் துதிப்பேன்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இதயம் நிலைபெற்றிருக்கிறது”; அல்லது, “என் இதயம் ஆயத்தமாயிருக்கிறது.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இசை மீட்டுவேன்”; அல்லது, “துதித்துப் பாடுவேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: உறுதியாய் இருக்கிறது
  rationale: இந்தச் சொல் நிலைபெற்றிருத்தல், உறுதியாக இருத்தல், ஆயத்தமாயிருத்தல் ஆகிய பொருள் நிழல்களைக் கொண்டது. இச்சூழலில் நம்பிக்கையிலும் துதிக்கும் தீர்மானத்திலும் உள்ள உறுதியை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִבִּי
  choice: என் இதயம்
  rationale: எபிரெயச் சொல்லின் நேரடியான உருவகத்தையும், சித்தம் மற்றும் உணர்வுகள் உட்பட உள்ளார்ந்த மனிதனைச் சுட்டும் வேதாகமப் பயன்பாட்டையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: இறைவனே
  rationale: இது நேரடி விளிப்பாக இருப்பதால் தமிழ் விளிவேற்றுமை பயன்படுத்தப்பட்டுள்ளது. ‘இறைவனே’ நவீனத் தமிழில் இயல்பானதும் கண்ணியமானதும் ஆகும்.
- source_word: אָשִׁירָה
  choice: நான் பாடுவேன்
  rationale: கோஹோர்டேட்டிவ் வடிவம் இங்கு பாடுவதற்கான உறுதியான தீர்மானத்தை வெளிப்படுத்துகிறது; ‘பாடுவேன்’ அதை இயல்பாகத் தருகிறது.
- source_word: וַאֲזַמֵּרָה
  choice: இசையுடன் துதிப்பேன்
  rationale: זמר என்ற வினை இசை செய்தல் அல்லது துதித்துப் பாடுதல் என்ற இரு தொடர்புடைய நுண்பொருள்களையும் தரக்கூடும். ‘இசையுடன் துதிப்பேன்’ இசை மற்றும் துதி ஆகிய இரண்டையும் இயல்பான தமிழில் இணைக்கிறது; மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
