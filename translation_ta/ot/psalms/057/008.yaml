    reason: cultural_note
lexical_decisions:
- source_word: עוּרָה
  choice: விழித்தெழு / விழித்தெழுங்கள்
  rationale: இது עור என்ற வினையின் நேரடியான கட்டளை வடிவம். தனக்குத் தானே விடுக்கும் அழைப்பில் ஒருமையும், இரு இசைக்கருவிகளை நோக்கி விடுக்கும் அழைப்பில் மரியாதைப் பன்மைபோல் இயல்பாக ஒலிக்கும் பன்மையும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: כְבוֹדִי
  choice: என் மகிமையே
  rationale: சொல்லடிப்படையான ‘என் மகிமை’ என்ற கவித்துவ உருவகத்தைத் தக்கவைக்கிறது. இது சங்கீதக்காரரின் ஆன்மா அல்லது முழு உள்ளத்தைச் சுட்டும் தற்சுட்டாக இருக்கக்கூடும்; அந்தப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הַנֵּבֶל
  choice: யாழ்
  rationale: பண்டைய நரம்பிசைக் கருவியைக் குறிக்கிறது; அதன் துல்லியமான நவீன ஒப்புமை உறுதியில்லை. ‘யாழ்’ தமிழில் கவித்துவமாகவும் புரிந்துகொள்ளத்தக்கதாகவும் உள்ளது.
- source_word: כִנּוֹר
  choice: வீணை
  rationale: மற்றொரு பண்டைய நரம்பிசைக் கருவி. נבל என்பதிலிருந்து வேறுபடுத்தவும் தமிழில் இயல்பான இசைக்கருவிப் பெயரை வழங்கவும் ‘வீணை’ தேர்ந்தெடுக்கப்பட்டது; துல்லிய ஒப்புமையின் நிச்சயமின்மை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: אָעִירָה
  choice: நான் எழுப்புவேன்
  rationale: Hiphil வடிவத்தின் காரணவினைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. சங்கீதக்காரரின் பாடல் விடியலையே எழுப்புவதாகக் கூறும் உயிர்ப்பூட்டப்பட்ட கவித்துவப் படிமம் பாதுகாக்கப்படுகிறது.
- source_word: שָּׁחַר
  choice: விடியல்
  rationale: பொழுது புலரும் நேரத்தைக் குறிக்கும் தெளிவான, கவித்துவமான நவீனத் தமிழ்ச் சொல்.
