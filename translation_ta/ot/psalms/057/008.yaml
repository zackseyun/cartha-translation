  text: Awake[a], my glory! Awake[b], harp and lyre! I will awaken the dawn.
translation:
  language: ta
  text: விழித்தெழு, என் மகிமையே[a]! யாழே, வீணையே, விழித்தெழுங்கள்[b]! விடியலை நான் எழுப்புவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் ஆன்மாவே” அல்லது “என் முழு உள்ளமே” என்றும் பொருள் கொள்ளலாம். “என் மகிமை” என்பது இங்கே கவித்துவமான தற்சுட்டாக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
