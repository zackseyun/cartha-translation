review_pass:
  verdict: revise
  source_fidelity: The first colon correctly retains direct address, the plural ‘heavens,’ and the exaltation imagery. However, ‘உயர்ந்து விளங்கும்’ is a finite declarative/future-style expression (‘will shine/be manifest in an elevated state’), not a clear imperative or prayer equivalent to רוּמָה. The second colon appropriately represents the Hebrew verbless line as a wish, while the footnote preserves its possible declarative reading.
  naturalness: ‘பூமி முழுவதன் மேலும்’ is understandable but slightly awkward. ‘பூமி முழுவதின்மேலும்’ is smoother modern standard Tamil in this elevated poetic register. ‘உயர்த்தப்படுவீராக’ gives an idiomatic Tamil prayer/wish and preserves the source’s doxological appeal.
  terminology: ‘கடவுளே,’ ‘வானங்கள்,’ and ‘உமது மகிமை’ are suitable modern-standard Tamil renderings and maintain a dignified worship register. ‘உயர்த்தப்படுவீராக’ accurately conveys ‘Be exalted’ without reducing it to literal upward movement.
  issues:
  - severity: high
    issue: The rendering ‘உயர்ந்து விளங்கும்’ does not clearly express the imperative/prayer force of רוּמָה.
    rationale: It reads as a statement or future prediction rather than the psalmist’s appeal, ‘Be exalted.’ A Tamil optative/passive expression is needed.
  - severity: low
    issue: ‘பூமி முழுவதன் மேலும்’ is stylistically less natural than ‘பூமி முழுவதின்மேலும்.’
    rationale: The revision retains the intended universal scope and parallelism while improving standard Tamil flow.
  revised_text: 'கடவுளே, வானங்களுக்கு மேலாக உயர்த்தப்படுவீராக;

