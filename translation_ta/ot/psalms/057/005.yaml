source:
  edition: WLC
  text: ר֣וּמָ/ה עַל הַ/שָּׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/005.yaml
  text: Be exalted above the heavens[a], O God; let your glory be over all the earth.
translation:
  language: ta
  text: 'கடவுளே, வானங்களுக்கு மேலாக உயர்த்தப்படுவீராக;

    பூமி முழுவதின்மேலும் உமது மகிமை இருப்பதாக.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமி முழுவதின்மேலும் உமது மகிமை இருக்கிறது.” எபிரெயத்தில் இரண்டாம் அடியில் வினைச்சொல் இல்லை; ஆகவே அதை ஒரு வேண்டுதலாகவும் ஓர் உறுதிக்கூற்றாகவும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: உயர்ந்து விளங்கும்
  rationale: רוּם என்பதன் கட்டளை/வேண்டுதல் வடிவம் உயர்ந்த நிலையில் விளங்குவதைச் சுட்டுகிறது. ‘உயர்ந்து விளங்கும்’ என்பது வெறும் இடமாற்றமாக மேலே செல்வதைவிட, கடவுளின் மேன்மை வெளிப்பட வேண்டும் என்ற துதிசார்ந்த வேண்டுதலை இயல்பான தமிழில் தருகிறது.
- source_word: עַל
  choice: மேலாக / மேலும்
  rationale: வானங்களுடன் வரும் இடத்தில் உயர்வையும் மேன்மையையும் காட்ட ‘மேலாக’ என்றும், பூமி முழுவதுடன் வரும் இடத்தில் பரப்பையும் மேலாதிக்கத்தையும் இயல்பாகக் காட்ட ‘மேலும்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הַשָּׁמַיִם
  choice: வானங்கள்
  rationale: எபிரெயப் பன்மை வடிவத்தையும் அதன் கவிதைநயமிக்க அண்டவியல் சொல்லாட்சியையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது நேரடி அழைப்பு என்பதால் தமிழின் விளிவேற்றுமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: עַל כָּל הָאָרֶץ
  choice: பூமி முழுவதன் மேலும்
  rationale: כָּל என்பதன் முழுமையான பரப்பைத் தெளிவாகக் காட்டி, உமது மகிமை பூமியனைத்திற்கும் மேலாக இருப்பதைக் கூறுகிறது.
- source_word: כְּבוֹדֶךָ
  choice: உமது மகிமை
  rationale: கடவுளைக் குறிக்கும் כבוד என்பது அவரது கனமிக்க மாட்சியும் வெளிப்படும் மேன்மையும் குறிக்கும்; ‘மகிமை’ இதற்கான தெளிவான, மரியாதைமிக்க தமிழ் இணை.
theological_decisions:
- issue: இரண்டாம் அடியை வேண்டுதலாகவா அல்லது கூற்றாகவா வாசிப்பது
  choice: பூமி முழுவதன் மேலும் உமது மகிமை இருப்பதாக
  alternative: பூமி முழுவதன் மேலும் உமது மகிமை இருக்கிறது
  rationale: எபிரெய இரண்டாம் அடியில் வினைச்சொல் இல்லை. முதல் அடியின் கட்டளை/வேண்டுதல் வடிவத்துக்கு இணையாக இதை வேண்டுதலாக வாசிப்பது இயல்பானது; எனினும் உறுதிக்கூற்றாக வாசிக்கக்கூடிய உண்மையான இலக்கண இருபொருள்தன்மை அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியத்தையும் எபிரெயக் கவிதையின் இரு அடி அமைப்பையும் காக்கும் வகையில் வடிவமைக்கப்பட்டது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
