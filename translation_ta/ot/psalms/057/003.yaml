  text: יִשְׁלַ֤ח מִ/שָּׁמַ֨יִם וְֽ/יוֹשִׁיעֵ֗/נִי חֵרֵ֣ף שֹׁאֲפִ֣/י סֶ֑לָה יִשְׁלַ֥ח אֱ֝לֹהִ֗ים חַסְדּ֥/וֹ וַ/אֲמִתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
translation:
  language: ta
  text: அவர் வானத்திலிருந்து அனுப்பி என்னைக் காப்பாற்றுவார்; என்னை விழுங்கத் துடிப்பவனை அவர் நிந்திப்பார்.[a] சேலா.[b] கடவுள் தமது மாறாத அன்பையும் நம்பகத்தன்மையையும் அனுப்புவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை, “என்னைத் துரத்துகிறவன் என்னை நிந்திக்கிறான்” என்றும், “என்னை விழுங்கத் துடிப்பவனின் நிந்தையிலிருந்து அவர் என்னைக் காப்பாற்றுவார்” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “சேலா” என்பதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை; இது இசை அல்லது வழிபாடு தொடர்பான ஒரு குறிப்பாக இருக்கலாம்.
    reason: term_uncertainty
lexical_decisions:
- source_word: יִשְׁלַח
  choice: அனுப்புவார்
  rationale: Qal முற்றுப்பெறாத வினை இங்கு நம்பிக்கையுடன் கூறப்படும் எதிர்காலச் செயலாக வருகிறது; அனுப்பப்படும் பொருள் எது என்பது எபிரெயத்தில் வெளிப்படையாகச் சொல்லப்படாததால் முதல் இடத்தில் பொதுவாக ‘உதவி’ எனத் தெளிவுபடுத்தப்பட்டுள்ளது, இறுதியில் அன்பும் உண்மைத்தன்மையும் நேரடிப் பொருள்களாக உள்ளன.
- source_word: מִשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: தெய்வீக உதவி வரும் இடத்தை இயல்பான நவீனத் தமிழில் குறிக்கிறது.
- source_word: וְיוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றுவார்
  rationale: ישׁע என்பதன் Hiphil வடிவம் ஆபத்திலிருந்து காப்பாற்றுதல் அல்லது விடுவித்தல் என்ற பரந்த பொருளைக் கொண்டது; இச்சூழலில் ‘காப்பாற்றுவார்’ இயல்பாக உள்ளது.
- source_word: חֵרֵף
  choice: அவர் நிந்திப்பார்
  rationale: வினையின் நேரடிப் பொருளான ‘நிந்தித்தல்/பழித்தல்’ பாதுகாக்கப்படுகிறது; ‘வெட்கப்படுத்துவார்’ என்ற விளைவுசார் விரிவாக்கம் முதன்மை உரையில் தவிர்க்கப்படுகிறது.
- source_word: שֹׁאֲפִי
  choice: என்னை விழுங்கத் துடிப்பவனை
  rationale: שאף என்பதிலுள்ள பகைமையுடன் மூச்சிரைத்துத் தொடரும் அல்லது விழுங்க முனையும் உயிர்ப்பான உருவகத்தை வாசிக்கத்தக்க தமிழில் தருகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: துல்லியமான பொருள் உறுதியில்லாத இசை அல்லது வழிபாட்டுக் குறிப்பு என்பதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமைப் பொருளில் வரும் தெய்வப் பெயருக்கான இயல்பான பொதுத் தமிழ் வடிவம்.
- source_word: חַסְדּוֹ
  choice: தமது மாறாத அன்பை
  rationale: חסד என்பதிலுள்ள உறுதியான அன்பு, இரக்கம், பற்றுறுதி ஆகியவற்றை ‘மாறாத அன்பு’ தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וַאֲמִתּוֹ
  choice: தமது உண்மைத்தன்மையை
  rationale: חסד உடன் இணையும் אמת இங்கு வெறும் உண்மைத் தகவலைவிட நம்பகத்தன்மையையும் பற்றுறுதியையும் குறிக்கிறது.
theological_decisions:
- issue: חֵרֵף שֹׁאֲפִי என்பதன் இலக்கணத் தொடர்பும் கர்த்தாவும்
  choice: கடவுளே கர்த்தா எனக் கொண்டு, ‘என்னை விழுங்கத் துடிப்பவனை அவர் நிந்திப்பார்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என்னைத் துரத்துகிறவன் என்னை நிந்திக்கிறான்’ அல்லது ‘என்னை விழுங்கத் துடிப்பவனின் நிந்தையிலிருந்து அவர் என்னைக் காப்பாற்றுவார்.’
  rationale: எபிரெயக் கவிதைத் தொடர் சுருக்கமானதாலும் வெளிப்படையான கர்த்தா இல்லாததாலும் ஒன்றுக்கு மேற்பட்ட இலக்கணப் பகுப்புகள் சாத்தியம். முன் மற்றும் பின் வரும் தெய்வீகச் செயல்களுடன் கடவுளைக் கர்த்தாவாகக் கொள்வது தொடர்ச்சியளிக்கிறது; வேறு வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: חסד மற்றும் אמת இணையின் இறையியல் நிறை
  choice: ‘மாறாத அன்பு’ மற்றும் ‘உண்மைத்தன்மை’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உடன்படிக்கை அன்பு’ மற்றும் ‘சத்தியம்.’
  rationale: எபிரெயச் சொற்களின் பற்றுறுதி மற்றும் நம்பகத்தன்மை பாதுகாக்கப்படுகின்றன; ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத குறிப்பிட்ட சமயவியல் விளக்கச்சொல் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தமது’ என்பது கடவுளைக் குறிக்கும் மரியாதை ஒருமையைத் தெளிவாக்குகிறது. மூலத்தின் சுருக்கமும் உண்மையான இலக்கணத் தெளிவின்மையும் அடிக்குறிப்புகளால் பாதுகாக்கப்பட்டுள்ளன.
