  source_fidelity: 'The translation accurately represents the Hebrew bicola: אוֹדְךָ as “உமக்கு நன்றி செலுத்துவேன்,” בָעַמִּים as “மக்களினங்களிடையே,” the vocative divine title אֲדֹנָי as “ஆண்டவரே,” and אֲזַמֶּרְךָ בַּל־אֻמִּים as “தேசங்களிடையே உம்மைப் புகழ்ந்து பாடுவேன்.” The distinct yet parallel terms for peoples and nations are retained, as is the future/volitional sense of both verbs.'
