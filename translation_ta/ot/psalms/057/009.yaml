source:
  edition: WLC
  text: אוֹדְ/ךָ֖ בָ/עַמִּ֥ים אֲדֹנָ֑/י אֲ֝זַמֶּרְ/ךָ֗ בַּל אֻמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/009.yaml
  text: I will give thanks to you among the peoples[a], Lord; I will sing praise to you among the nations.
translation:
  language: ta
  text: ஆண்டவரே, மக்களினங்களிடையே உமக்கு நன்றி செலுத்துவேன்[a]; தேசங்களிடையே உம்மைப் புகழ்ந்து பாடுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மக்களினங்களிடையே உம்மைப் புகழ்வேன்.’ எபிரெய வினைச்சொல் நன்றி செலுத்துதல் அல்லது புகழ்தல் ஆகிய இரண்டையும் குறிக்கலாம்; அடுத்த அடியிலுள்ள ‘புகழ்ந்து பாடுவேன்’ என்பதிலிருந்து வேறுபாட்டைக் காக்க இங்கு ‘நன்றி செலுத்துவேன்’ எனத் தேர்ந்தெடுக்கப்பட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: உமக்கு நன்றி செலுத்துவேன்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் நன்றி செலுத்துதல் அல்லது புகழ்தல் என்ற இரு நுணுக்கங்களையும் தரலாம். அடுத்த அடியில் வரும் זמר என்பதிலிருந்து வேறுபாட்டைக் காக்க இங்கு ‘நன்றி செலுத்துவேன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בָעַמִּים
  choice: மக்களினங்களிடையே
  rationale: עַמִּים என்பது עַם என்பதன் பன்மை; பல்வேறு இன அல்லது சமூகக் குழுக்களைக் குறிக்கும் பன்மைத் தொகுப்புணர்வை ‘மக்களினங்கள்’ காக்கிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது יהוה என்ற இறைப் பெயர் அல்ல, אֲדֹנָי என்ற இறைப் பட்டம். அழைப்புவேற்றுமையை இயல்பான தமிழில் ‘ஆண்டவரே’ வெளிப்படுத்துகிறது.
- source_word: אֲזַמֶּרְךָ
  choice: உம்மைப் புகழ்ந்து பாடுவேன்
  rationale: சங்கீதச் சூழலில் זמר என்பதன் பியேல் வடிவம் இசையோடு புகழ்ந்து பாடுவதைக் குறிக்கிறது; ‘புகழ்ந்து பாடுவேன்’ அதன் வழிபாட்டு மற்றும் இசை நுணுக்கங்களைத் தெளிவாகக் காக்கிறது.
- source_word: בַּל
  choice: இடையே
  rationale: இங்கு בַּל முந்தைய அடியிலுள்ள ב־ என்பதற்கு இணையான கவிதைநடை முன்னிடைச்சொல்லாக இருந்து, ‘தேசங்களிடையே’ என்ற பொருளைத் தருகிறது.
- source_word: אֻמִּים
  choice: தேசங்கள்
  rationale: אֻמִּים என்பது நாடுகள் அல்லது மக்கள் கூட்டங்களைக் குறிக்கும். முதல் அடியின் עַמִּים என்பதிலிருந்து சொல்வேறுபாட்டைக் காத்தபடி இணை அமைப்பை வெளிப்படுத்த ‘தேசங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: אֲדֹנָי என்ற இறைப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: கர்த்தாவே
  rationale: எபிரெயத்தில் இங்கு உடன்படிக்கைப் பெயரான יהוה அல்ல, இறைப் பட்டமான אֲדֹנָי வருகிறது. நவீனத் தரமான தமிழில் பட்டத்தையும் அழைப்புத் தன்மையையும் இயல்பாக வெளிப்படுத்த ‘ஆண்டவரே’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான வழிபாட்டு மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமக்கு/உம்மை’ மரியாதை ஒருமையைக் காக்கின்றன; ‘மக்களினங்கள்’ மற்றும் ‘தேசங்கள்’ எபிரெயக் கவிதையின் இணை அமைப்பையும் சொல்வேறுபாட்டையும் பிரதிபலிக்கின்றன.
