  rationale: நிறைவுறா வினை வழக்கமான நிகழ்காலமாகவோ உறுதியான எதிர்காலமாகவோ புரிந்துகொள்ளப்படலாம். முதன்மை உரை தற்போதைய நம்பிக்கையை வெளிப்படுத்துகிறது; எதிர்கால வாசிப்பும் அடிக்குறிப்பில் வைக்கப்படுகிறது.
