  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
translation:
  language: ta
  text: 'யாவே தமக்கெனப் பக்தியுள்ளவரைத் தனிப்படுத்தியிருக்கிறார் என்பதை அறிந்துகொள்ளுங்கள்.[a]


    நான் அவரை நோக்கி கூப்பிடும்போது யாவே கேட்கிறார்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தமக்கென உண்மையுள்ளவரைத் தனிப்படுத்தியிருக்கிறார்’ என்றும் மொழிபெயர்க்கலாம். ‘பக்தியுள்ளவர்’ என்பதற்கான எபிரெயச் சொல் இறைப்பற்று, உடன்படிக்கைப் பற்றுறுதி, அல்லது விசுவாசம் ஆகிய நுணுக்கங்களை வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘நான் அவரை நோக்கி கூப்பிடும்போது யாவே கேட்பார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை வழக்கமான நிகழ்காலத்தையோ உறுதியான எதிர்காலத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
