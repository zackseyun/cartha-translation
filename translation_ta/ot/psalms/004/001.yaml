revisions:
- from: நான் கூப்பிடும்போது எனக்குப் பதிலளியும், என் நீதியின் தேவனே[a]. நெருக்கத்தில் எனக்கு இடம் விசாலமாக்கினீர்[b]. எனக்கு அருள்செய்து, என் விண்ணப்பத்தைக் கேளும்.
  to: நான் அழைக்கும்போது எனக்குப் பதிலளியும், என் நீதியின் தேவனே[a]. நெருக்கத்தில் எனக்காக விசாலமான இடம் உண்டாக்கினீர்[b]. எனக்கு அருள்புரிந்து, என் வேண்டுதலைக் கேளும்.
