base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/001.yaml
  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
translation:
  language: ta
  text: நான் அழைக்கும்போது எனக்குப் பதிலளியும், என் நீதியின் தேவனே[a]. நெருக்கத்தில் எனக்காக விசாலமான இடம் உண்டாக்கினீர்[b]. எனக்கு அருள்புரிந்து, என் வேண்டுதலைக் கேளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் நீதியுள்ள தேவனே’ அல்லது ‘எனக்கு நீதி வழங்கும் தேவனே.’ எபிரெய மொழியில் சொல்லுக்குச் சொல், ‘என் நீதியின் தேவன்.’
    reason: alternative_reading
  - marker: b
    text: 'அல்லது, ‘எனக்கு விடுதலை அளித்தீர்.’ எபிரெய மொழியின் உருவகம் இடவியல் சார்ந்தது: நெருக்கத்திலிருந்து ‘எனக்காக விசாலமான இடம் உண்டாக்கினீர்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  choice: நான் கூப்பிடும்போது
  rationale: בְּ + வினையெச்சப் பெயர் + முதலாம் நபர் ஒருமை பின்னொட்டு இங்கு காலப்பொருளில் வருகிறது. ‘நான் கூப்பிடும்போது’ என்பது மூலத்தின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; ‘கதறும்போது’ என்ற அதிக உணர்ச்சிப்பூர்வ நிழலைத் தேவையின்றி சேர்ப்பதில்லை.
- source_word: עֲנֵנִי
  choice: எனக்குப் பதிலளியும்
  rationale: ענה என்பதன் இச்சூழலுக்குரிய நேரடிப் பொருள் ‘பதிலளி’. வேண்டுதலாகவும் தேவனை நோக்கிய மரியாதையான ஒருமை அழைப்பாகவும் ‘பதிலளியும்’ பொருந்துகிறது.
- source_word: אֱלֹהֵי צִדְקִי
  choice: என் நீதியின் தேவனே
  rationale: எபிரெயக் கட்டமைப்பை நேரடியாகப் பேணி, நீதி தேவனுடைய பண்பா, அவர் அளிக்கும் நீதியா, அல்லது அவர் வழங்கும் நியாயத்தீர்ப்பு/விடுதலையா என்பதைத் தமிழ் உரை முன்கூட்டியே தீர்மானிக்காமல் விடுகிறது.
- source_word: בַּצָּר
  choice: நெருக்கத்தில்
  rationale: צַר துன்பத்தையும் இட நெருக்கத்தையும் குறிக்கக்கூடும். அடுத்துவரும் ‘விசாலமாக்கினீர்’ என்ற இடவியல் உருவகத்துடன் இணைப்பைத் தக்கவைக்க ‘நெருக்கத்தில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הִרְחַבְתָּ לִּי
  choice: எனக்கு இடம் விசாலமாக்கினீர்
  rationale: רחב என்பதன் ஹிஃபில் வடிவம் ‘அகலமாக்கு/விசாலமாக்கு’ என்று பொருள்படும். இத்தேர்வு நெருக்கத்திலிருந்து விடுவிக்கும் இடவியல் உருவகத்தைத் தக்கவைத்து, தமிழிலும் தெளிவாக ஒலிக்கிறது.
- source_word: חָנֵּנִי
  choice: எனக்கு அருள்செய்து
  rationale: חנן என்பதன் அடிப்படைப் பொருள் தயவு அல்லது அருள் காட்டுதல். ‘அருள்செய்து’ என்பது சுருக்கமான, கண்ணியமான வேண்டுதல் மொழி.
- source_word: וּשְׁמַע
  choice: கேளும்
  rationale: שׁמע இங்கு வெறுமனே ஒலி கேட்பதைவிட கவனித்துக் கேட்டு ஏற்றுக்கொள்வதைக் குறிக்கிறது; வேண்டுதல் சூழலில் ‘கேளும்’ இயல்பான சுருக்கமான வடிவம்.
- source_word: תְּפִלָּתִי
  choice: என் விண்ணப்பத்தை
  rationale: תְּפִלָּה என்பதற்கு ‘ஜெபம்/வேண்டுதல்/விண்ணப்பம்’ என்று மொழிபெயர்க்கலாம். இங்கு தேவனை நோக்கிய வேண்டுகோளை இயல்பாகவும் சமயப் பிரிவுசார் சொல்வழக்கைச் சாராமலும் தெரிவிக்க ‘விண்ணப்பம்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: ‘என் நீதியின் தேவன்’ என்ற தொடரின் பொருள்
  choice: ‘என் நீதியின் தேவனே’ என்ற மூலக் கட்டமைப்பை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘என் நீதியுள்ள தேவனே’ அல்லது ‘எனக்கு நீதி வழங்கும் தேவனே’
  rationale: எபிரெயக் கட்டமைப்பு ஒரே விளக்கத்தை கட்டாயப்படுத்தவில்லை. முறையான தொடரைத் தக்கவைப்பது, ‘நீதி’ தேவனுடைய பண்பைக் குறிக்கிறதா, சங்கீதக்காரனுக்குக் கடவுள் அளிப்பதைக் குறிக்கிறதா, அல்லது அவரை நியாயப்படுத்தும் தேவனுடைய செயலைக் குறிக்கிறதா என்ற இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான வேண்டுதல் நடையில் மொழிபெயர்க்கப்பட்டது. தேவனை நோக்கிய ஒருமை மரியாதை வினைமுற்றுகளான ‘பதிலளியும்’, ‘கேளும்’ பயன்படுத்தப்பட்டுள்ளன. ‘நெருக்கம்/விசாலம்’ என்ற கவிதை உருவக எதிரிணை தக்கவைக்கப்பட்டுள்ளது.
