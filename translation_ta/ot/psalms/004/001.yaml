review_pass:
  verdict: revise
  source_fidelity: The draft preserves the Hebrew clause order and the key ambiguity in “God of my righteousness.” It also retains the contrast between distress/constriction and spacious relief. However, “எனக்கு இடம் விசாலமாக்கினீர்” is not idiomatic Tamil syntax and needs recasting without losing the spatial image.
  naturalness: '“நான் கூப்பிடும்போது” is understandable but somewhat colloquial for this elevated prayer. “நான் அழைக்கும்போது” is more natural in modern standard Tamil. The second clause requires a natural object construction: “எனக்காக விசாலமான இடம் உண்டாக்கினீர்.” “வேண்டுதல்” is a more direct, broadly accessible equivalent for תפלה than “விண்ணப்பம்” in this prayer context.'
  terminology: “என் நீதியின் தேவனே” appropriately reproduces the Hebrew construct phrase without deciding whether it means God’s righteousness, the psalmist’s righteousness, or divine vindication. “அருள்புரிந்து” accurately conveys the plea for grace/favor, and the respectful imperative forms suit the address to God.
  issues:
  - severity: medium
    issue: The phrase “எனக்கு இடம் விசாலமாக்கினீர்” is syntactically unnatural.
    rationale: Tamil normally requires a clearer object or recasting for the causative idea. “எனக்காக விசாலமான இடம் உண்டாக்கினீர்” communicates that God made a broad space for the speaker while retaining the Hebrew spatial metaphor.
  - severity: low
    issue: “நான் கூப்பிடும்போது” has a colloquial/shouting nuance.
    rationale: קרא can mean call, including prayerful calling, but does not require an intensified or colloquial nuance. “நான் அழைக்கும்போது” is more neutral and fitting for the passage’s register.
  - severity: low
    issue: “என் விண்ணப்பம்” is acceptable but slightly narrower than the ordinary prayer term תפלה.
    rationale: “என் வேண்டுதல்” is natural modern standard Tamil and preserves the general sense of the psalmist’s prayer without bureaucratic or legal-petition overtones.
