  text: בְּ/שָׁל֣וֹם יַחְדָּו֮ אֶשְׁכְּבָ֪ה וְ/אִ֫ישָׁ֥ן כִּֽי אַתָּ֣ה יְהוָ֣ה לְ/בָדָ֑ד לָ֝/בֶ֗טַח תּוֹשִׁיבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/008.yaml
  text: In peace I will both lie down and sleep[a], for you alone, O Yahweh[b], make me dwell in safety.
translation:
  language: ta
  text: சமாதானத்துடன் நான் படுத்து உறங்குவேன்[a]; ஏனெனில் யாவே, நீர் ஒருவரே[b] என்னைப் பாதுகாப்பாகக் குடியிருக்கச் செய்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சமாதானத்துடன், ஒருசேர நான் படுத்து உறங்குவேன்.” எபிரெயச் சொல் “ஒன்றாக” அல்லது “ஒருசேர” என்று பொருள்படலாம்; இங்கு அது படுத்தல், உறங்குதல் ஆகிய இரு செயல்களையும் இணைப்பதாக இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “யாவே, நீர் என்னைப் பாதுகாப்பாகத் தனியே குடியிருக்கச் செய்கிறீர்.” எபிரெய மொழியில் “தனியே” என்பது சங்கீதக்காரர் குடியிருக்கும் விதத்தை விவரிப்பதாகவும் கொள்ளலாம்; முதன்மைப் பாடம் அதை “நீர்” என்பதுடன் இணைக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשָׁלוֹם
  choice: சமாதானத்துடன்
  rationale: שָׁלוֹם என்பது சமாதானம், நலம், முழுமை ஆகிய பொருள்களைக் கொண்டது. இங்கு நெருக்கடியின் நடுவிலும் நிம்மதியாக ஓய்வெடுப்பதைச் சூழல் வலியுறுத்துவதால், “சமாதானத்துடன்” என்பது இயல்பான தேர்வு.
- source_word: יַחְדָּו
  choice: படுத்து உறங்குவேன்
  rationale: இந்த வினையடை அடிப்படையில் “ஒன்றாக/ஒருசேர” என்று பொருள்படும். இங்கு அடுத்தடுத்து வரும் இரண்டு வினைகளையும் ஒருங்கிணைக்கிறது; தமிழில் “படுத்து உறங்குவேன்” என்ற இயல்பான இணைப்பு அதன் கருத்தை வெளிப்படுத்துகிறது. நேரடியான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶשְׁכְּבָה
  choice: நான் படுத்து
  rationale: இங்குள்ள imperfect வடிவம் மனவுறுதியையோ நம்பிக்கையுடன் கூறப்படும் எதிர்காலச் செயலையோ குறிக்கிறது. “நான் படுத்து” என்பது அடுத்த வினையுடன் இயல்பாக இணைகிறது.
- source_word: וְאִישָׁן
  choice: உறங்குவேன்
  rationale: ישן என்பதன் எளிய பொருள் “உறங்கு.” “படுத்து உறங்குவேன்” என்பது தமிழில் இயல்பானதும் மூலத்தின் சுருக்கத்தைப் பேணுவதுமாகும்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சங்கீதக்காரர் சமாதானத்துடன் உறங்குவதற்கான காரணத்தை இச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைத் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: לְבָדָד
  choice: நீர் ஒருவரே
  rationale: לְבָדָד என்பதற்கு “தனியாக/ஒருவரே” என்று பொருள். முதன்மை வாசிப்பில் இது இறைவனைச் சுட்டும் “நீர்” என்பதோடு இணைந்து, பாதுகாப்பளிப்பவர் யாவே ஒருவரே என்ற கருத்தைத் தருகிறது. வேறு இலக்கண இணைப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לָבֶטַח
  choice: பாதுகாப்புடன்
  rationale: בֶּטַח என்பது அச்சமற்ற பாதுகாப்பான நிலையைக் குறிக்கிறது. “பாதுகாப்புடன்” என்பது தமிழில் இயல்பாகவும் வினையோடு தெளிவாகவும் அமைகிறது.
- source_word: תּוֹשִׁיבֵנִי
  choice: என்னை ... வாழவைக்கிறீர்
  rationale: ישׁב என்பதன் Hiphil வடிவம் “குடியிருக்கச் செய்/வாழச் செய்” என்ற காரணவினைப் பொருளைக் கொண்டது. “வாழவைக்கிறீர்” என்பது அந்தக் காரணவினைத் தன்மையை இயல்பான நவீன தமிழில் பேணுகிறது.
theological_decisions:
- issue: לְבָדָד என்பதன் தொடர்பும் வலியுறுத்தலும்
  choice: பாதுகாப்புடன் வாழவைக்கும் இறைவன் யாவே ஒருவரே.
  alternative: யாவே சங்கீதக்காரரைத் தனியாகப் பாதுகாப்புடன் வாழவைக்கிறார்.
  rationale: சொல் வரிசையும் சூழலும் “ஒருவரே” என்பதை “நீர்” என்பதுடன் இணைப்பதற்கு ஆதரவளிக்கின்றன. இது உரை கூறும் இறைச் சார்பை மட்டும் வெளிப்படுத்துகிறது; இலக்கணரீதியாகச் சாத்தியமான மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிமையும் கவிதைத் தகுதியும் காக்கப்பட்டுள்ளன. மரியாதை ஒருமை வடிவங்கள் இறைவனைச் சுட்டுகின்றன. காரணவினை இயல்பாக வெளிப்படுத்த “வாழவைக்கிறீர்” பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
