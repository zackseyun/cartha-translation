  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
translation:
  language: ta
  text: நடுங்குங்கள்[a]; பாவம் செய்யாதீர்கள். படுக்கையில் இருக்கும்போது, உங்கள் மனதில் சொல்லிக்கொள்ளுங்கள்; அமைதியாயிருங்கள். சேலா.
  philosophy: optimal-equivalence
