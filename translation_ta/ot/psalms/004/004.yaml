lexical_decisions:
- source_word: רִגְזוּ
  choice: நடுங்குங்கள்
  rationale: רגז என்பது சூழலுக்கேற்ப நடுக்கம், மனக்கலக்கம், அல்லது கோபத்தைக் குறிக்கலாம். பாவம் செய்ய வேண்டாம் என்ற எச்சரிக்கையையும் தொடர்ந்து வரும் உள்ளார்ந்த சிந்தனையையும் அமைதியையும் கருத்தில் கொண்டு, பொருளை கோபம் என்று மட்டும் குறுக்காமல் ‘நடுங்குங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְאַל תֶּחֱטָאוּ
  choice: பாவம் செய்யாதீர்கள்
  rationale: חטא என்ற பொதுவான வினையுடன் வரும் நேரடியான தடையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: אִמְרוּ בִלְבַבְכֶם
  choice: உங்கள் உள்ளங்களோடு பேசிக்கொண்டு
  rationale: ‘உங்கள் இதயங்களில் சொல்லுங்கள்’ என்ற எபிரேய அமைப்பு உள்ளார்ந்த உரையாடல் அல்லது தன்னாய்வைக் குறிக்கிறது. אִמְרוּ என்பதன் ‘சொல்/பேசு’ என்ற வினைவலிமையைத் தக்கவைத்தபடி, தமிழில் இயல்பாக ‘உள்ளங்களோடு பேசிக்கொண்டு’ என வழங்கப்பட்டுள்ளது.
- source_word: עַל מִשְׁכַּבְכֶם
  choice: உங்கள் படுக்கைகளில்
  rationale: எபிரேயத்தில் உள்ள பன்மை உரிமைப்பின்னொட்டைத் தக்கவைத்து, தனிமையான இரவுநேரச் சிந்தனையின் இடத்தையும் நேரடியாகக் காட்டுகிறது.
- source_word: וְדֹמּוּ
  choice: அமைதியாயிருங்கள்
  rationale: דמם என்பது மௌனமாக அல்லது அசைவற்று அமைதியாக இருப்பதைக் குறிக்கலாம். ‘அமைதியாயிருங்கள்’ என்பது பேச்சின் நிறுத்தத்தையும் உள்ளார்ந்த அடக்கத்தையும் இயல்பாக உள்ளடக்குகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியற்றது; ஆகவே எபிரேய வழிபாட்டு அல்லது இசைக் குறியீட்டை மொழிபெயர்க்காமல் ஒலிபெயர்த்துத் தக்கவைக்கிறது.
theological_decisions:
- issue: רגזו என்ற கட்டளையின் பொருளும் பாவம் செய்யாதீர்கள் என்ற ஒழுக்க அறிவுறுத்தலுடனான தொடர்பும்
  choice: பாவத்திற்குச் செல்லாதபடி கட்டுப்படுத்தப்பட வேண்டிய நடுக்கம் அல்லது மனக்கலக்கத்துக்கான அறிவுறுத்தல்
  alternative: ‘கோபங்கொள்ளுங்கள்; ஆனால் பாவம் செய்யாதீர்கள்’
  rationale: רגז என்பது நடுக்கம், கலக்கம், கோபம் ஆகிய பொருள்களை ஏற்க முடியும். உடனடியான சூழல் உள்ளார்ந்த உரையாடலுக்கும் அமைதிக்கும் நகர்வதால், முதன்மை உரையில் ‘நடுங்குங்கள்’ என்பது பொருளை அளவுக்கு மீறிக் குறுக்காமல் காக்கிறது. ‘கோபங்கொள்ளுங்கள்’ என்ற பாரம்பரிய வாசகம் உண்மையான மாற்றுப் பொருளாக அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘உள்ளங்களோடு பேசிக்கொண்டு’ என்பது மூலத்தின் உள்ளார்ந்த பேச்சு உருவகத்தைத் தக்கவைத்தபடி தமிழ் இயல்பை நோக்குகிறது. கட்டளைகளின் பன்மை வடிவமும் ‘சேலா’ என்ற உறுதியற்ற வழிபாட்டு/இசைக் குறியீடும் பாதுகாக்கப்பட்டுள்ளன.
