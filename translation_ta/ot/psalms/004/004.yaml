  - marker: a
    text: அல்லது, “கோபப்படுங்கள்; பாவம் செய்யாதீர்கள்.” இந்த எபிரேய வினைச்சொல் மனக்கலக்கம், நடுக்கம், அல்லது கோபத்தைக் குறிக்கலாம்.
