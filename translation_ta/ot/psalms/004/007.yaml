  text: נָתַ֣תָּה שִׂמְחָ֣ה בְ/לִבִּ֑/י מֵ/עֵ֬ת דְּגָנָ֖/ם וְ/תִֽירוֹשָׁ֣/ם רָֽבּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/007.yaml
  text: You have put joy in my heart more than when their grain and their new wine abound[a].
translation:
  language: ta
  text: அவர்களுடைய தானியமும் புதுத் திராட்சரசமும் பெருகியபோது அவர்களுக்கு இருந்த மகிழ்ச்சியைவிட அதிகமான மகிழ்ச்சியை என் உள்ளத்தில் தந்தீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொற்சார்பாக: “அவர்களுடைய தானியமும் புதுத் திராட்சரசமும் பெருகிய காலத்திலிருந்து, என் உள்ளத்தில் மகிழ்ச்சியைத் தந்தீர்.” எபிரெயத் தொடர் பொதுவாக ஒப்பீடாகப் புரிந்துகொள்ளப்படுகிறது: பொருள் வளத்தால் உண்டாகும் மகிழ்ச்சியைவிடக் கடவுள் தரும் மகிழ்ச்சி மேலானது.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: வைத்தீர்
  rationale: נתן என்பதன் Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம்; கடவுளை நேரடியாக மரியாதையுடன் அழைக்கும் தமிழில் ‘வைத்தீர்’ என்பது நிறைவுற்ற செயலையும் அதன் தொடரும் விளைவையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: שִׂמְחָה
  choice: மகிழ்ச்சியை
  rationale: உள்ளார்ந்த களிப்பைக் குறிக்கும் பெயர்ச்சொல்; நவீனத் தமிழில் ‘மகிழ்ச்சி’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: בְלִבִּי
  choice: என் உள்ளத்தில்
  rationale: לֵב என்பது உடல் உறுப்பை மட்டும் அல்லாமல் உள்ளான மனிதரையும் குறிக்கலாம்; ‘உள்ளம்’ இங்கு அந்த உட்பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵעֵת
  choice: இருந்ததைவிட
  rationale: מִן + עֵת அமைப்பு பொதுவாக ஒப்பீட்டின் அளவுகோலை அறிமுகப்படுத்துகிறது; தமிழில் ‘...போது இருந்ததைவிட’ அந்த ஒப்பீட்டைத் தெளிவாகக் காட்டுகிறது.
- source_word: דְּגָנָם
  choice: அவர்களுடைய தானியம்
  rationale: דגן தானிய விளைபொருளைக் குறிக்கிறது; ‘தானியம்’ துல்லியமான, பொதுவாகப் புரியும் தமிழ்ச் சொல்.
- source_word: וְתִירוֹשָׁם
  choice: புதுத் திராட்சரசம்
  rationale: תירוש பொதுவாகப் புதிய அல்லது புதிதாக உற்பத்தியான திராட்சரசத்தைக் குறிக்கிறது; ‘புதுத் திராட்சரசம்’ வேளாண் செழிப்பின் படிமத்தைப் பாதுகாக்கிறது.
- source_word: רָבּוּ
  choice: பெருகியபோது
  rationale: רבה என்பதன் Qal perfect மூன்றாம் நபர் பன்மை வடிவம், பெருகுதல் அல்லது மிகுதியாகுதல் என்ற பொருளுடையது; சூழலில் விளைபொருட்களின் வளத்தை ‘பெருகியபோது’ இயல்பாகக் கூறுகிறது.
theological_decisions:
- issue: வசனத்தின் ஒப்பீட்டு தொடரமைப்பு
  choice: தானியமும் புதுத் திராட்சரசமும் பெருகும்போது கிடைக்கும் மகிழ்ச்சியைவிட, கடவுள் அளித்த உள்ளார்ந்த மகிழ்ச்சி அதிகம் என்று சங்கீதக்காரர் கூறுகிறார்.
  alternative: ‘அவர்களுடைய தானியமும் புதுத் திராட்சரசமும் பெருகிய காலத்திலிருந்து என் உள்ளத்தில் மகிழ்ச்சியை வைத்தீர்’ என்று சொற்சார்பாக வாசிக்கலாம்.
  rationale: מֵעֵת என்பதை ஒப்பீட்டின் அளவுகோலாகப் புரிந்துகொள்வது எபிரெய தொடருக்கும், கடவுளில் காணும் மகிழ்ச்சியையும் பொருள் வளத்தையும் எதிரெதிராக வைக்கும் சூழலுக்கும் நன்றாகப் பொருந்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் மரியாதைப் பன்மை ‘வைத்தீர்’ இடம்பெறுகிறது. ‘என் உள்ளத்தில்’ என்பது தமிழில் இயல்பாக இருக்கவும், எபிரெய மொழியின் உள்ளான மனிதர் என்ற பொருளைப் பாதுகாக்கவும் தேர்ந்தெடுக்கப்பட்டது.
