base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/006.yaml
  text: Many are saying[a], “Who will show us good? Lift up the light of your face upon us[c][b], O Yahweh.”
translation:
  language: ta
  text: பலர், “எங்களுக்குக் நன்மையைக் காண்பிப்பவர் யார்? யாவே,[c] உமது முகத்தின் ஒளியை எங்கள்மேல் உயர்த்தும்.”[b] என்று சொல்லிக்கொண்டிருக்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுக்குக் நன்மையைக் காணச் செய்பவர் யார்?” எபிரெய வினை காரணப்பொருளுடையது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “உமது முகத்தின் ஒளியை எங்கள்மேல் உயர்த்தும்.” ‘முகத்தின் ஒளி’ என்பது இறைவனின் அருளையும் அன்பான பிரசன்னத்தையும் குறிக்கும் கவிப்படிமம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் YHWH; மரபாக “கர்த்தர்” அல்லது “ஆண்டவர்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים אֹמְרִים
  choice: பலர் ... சொல்லிக்கொண்டிருக்கிறார்கள்
  rationale: רַבִּים என்பது குறிப்பிட்ட அடையாளமற்ற பலரைக் குறிக்கிறது; பங்கேற்புவினையான אֹמְרִים தொடரும் அல்லது அக்காலத்தில் நிலவும் பேச்சை உணர்த்துவதால், நவீனத் தமிழில் இயல்பான தொடர்நிலை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: מִי יַרְאֵנוּ טוֹב
  choice: நமக்கு நன்மையைக் காண்பிப்பவர் யார்?
  rationale: יַרְאֵנוּ என்பது ראה வேரின் காரணவினை வடிவம்; ஆகவே ‘காண்பிப்பவர்’ என்பது ‘காணச் செய்பவர்’ என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது. טוֹב என்பதை செழிப்பு என்று குறுக்காமல் பரந்த பொருளுடைய ‘நன்மை’ என வைத்திருக்கிறது.
- source_word: נְסָה עָלֵינוּ
  choice: எங்கள்மேல் எழச் செய்யும்
  rationale: ஒளியை எங்கள்மேல் உயர்த்துமாறு வேண்டுகிற எபிரெயக் கவிப்படிமத்தை முடிந்தவரை காக்கிறது; தமிழில் முற்றிலும் சொல்லுக்குச் சொல் அமைப்பான ‘ஒளியை உயர்த்தும்’ என்பதைக் காட்டிலும் இது புரிந்துகொள்ளத்தக்கது.
- source_word: אוֹר פָּנֶיךָ
  choice: உமது முகத்தின் ஒளி
  rationale: தெய்வீக அருளையும் அன்பான பிரசன்னத்தையும் சுட்டும் மனிதவடிவக் கவிப்படிமத்தை ‘அருள்’ என்று விளக்கி மாற்றாமல் நேரடியாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயராக மாற்றாமல், எபிரெயத் திருநாமமான YHWH-ஐ நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, நான்கெழுத்துத் திருநாமமே உள்ளது; ஆகவே தனிப்பட்ட இறைநாமத்தைப் பாதுகாக்கிறது.
- issue: ‘உமது முகத்தின் ஒளி’ என்ற மனிதவடிவக் கவிப்படிமம்
  choice: கவிப்படிமத்தை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: உமது அருள் / உமது பிரசன்னம்
  rationale: இந்த உருவகம் தெய்வீக அருளையும் அருகிருப்பையும் உணர்த்தினாலும், அதை விளக்கமாக மாற்றுவது மூலத்தின் கவித்துவத்தையும் திறந்த பொருளையும் குறைக்கும்.
- issue: נְסָה என்ற கட்டளையின் படிமம்
  choice: எழச் செய்யும்
  alternative: பிரகாசிக்கச் செய்யும் / உயர்த்தும்
  rationale: ‘பிரகாசிக்கச் செய்யும்’ என்பது ஒளியின் விளைவை விளக்குகிறது; ‘உயர்த்தும்’ என்பது தமிழில் இங்கு கடினமாக ஒலிக்கிறது. தேர்ந்த வடிவம் உயர்த்துதல் சார்ந்த மூலப் படிமத்தையும் தமிழின் வாசிப்புத்தன்மையையும் சமநிலைப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் சங்கீதத்திற்கேற்ற கண்ணியமும் வேண்டுதல் நயமும் கொண்ட நடை. இறைவனை நேரடியாக அழைக்கும் இடத்தில் மரியாதை ஒருமை (‘உமது’) பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் உரையாடல் எல்லை இரு வாக்கியங்களையும் உள்ளடக்குமாறு மேற்கோள் தொடர்கிறது.
