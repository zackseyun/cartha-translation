lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை வழிநடத்தும் பொறுப்பாளரைக் குறிக்கும் சொல்லாகப் புரிந்துகொள்ளப்படுகிறது. இன்றைய வாசகர்களுக்குத் தெளிவான, இயல்பான சொற்றொடர்.
- source_word: בִּנְגִינוֹת
  choice: நரம்பிசைக் கருவிகளுடன் பாடப்பட வேண்டியது
  rationale: நரம்புகளைக் கொண்ட இசைக்கருவிகளின் துணையுடன் நிகழ்த்துவதற்கான இசைக் குறிப்பைத் தெளிவாக வெளிப்படுத்துகிறது; குறிப்பிட்ட கருவி அல்லது நிகழ்த்தும் முறையைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையுடன் தொடர்புடைய இந்த எபிரெய இலக்கிய வகைக்குத் தமிழில் நிலைபெற்ற, மரியாதையான பெயர்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரெய முன்னொட்டு படைப்புரிமை, தொடர்பு, உடைமை அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதின்’ என்பது இவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் பரந்த தொடர்பைப் பாதுகாக்கிறது.
theological_decisions:
- issue: לְדָוִד என்பதில் குறிக்கப்படும் படைப்புரிமை அல்லது தொடர்பு
  choice: தாவீதின்
  alternative: தாவீதால் இயற்றப்பட்டது; தாவீதுக்காக
  rationale: மூல எபிரெயத் தொடர் தாவீது இயற்றினார் என்று மட்டும் திட்டவட்டமாகக் கூறவில்லை. எனவே வரலாற்று அல்லது இறையியல் முடிவை உரையில் திணிக்காமல் அதன் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் வகையில் இயல்பும் கண்ணியமும் காக்கப்பட்டுள்ளன. இசை நிகழ்த்துதல் குறித்த தலைப்பின் சுருக்கமான பாணியும், לְדָוִד என்பதன் பொருள் விரிவும் பாதுகாக்கப்பட்டுள்ளன.
