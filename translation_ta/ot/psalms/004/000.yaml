  text: 'For the choirmaster: with stringed instruments. A psalm of David[a].'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: தந்திக் கருவிகளுடன். தாவீதின் சங்கீதம்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீதால் இயற்றப்பட்ட சங்கீதம்’ அல்லது ‘தாவீதுக்காக அர்ப்பணிக்கப்பட்ட சங்கீதம்’ என்றும் பொருள்படலாம்; இங்குள்ள எபிரெயத் தொடர் ஆசிரியத்துவம், தொடர்பு அல்லது அர்ப்பணிப்பைக் குறிக்கக்கூடும்.
