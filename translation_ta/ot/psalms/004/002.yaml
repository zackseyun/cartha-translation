  yaml_path: translation/ot/psalms/004/002.yaml
  text: Sons of men[a], how long will my honor be turned into shame? Will you love emptiness and seek falsehood? Selah
translation:
  language: ta
  text: மனிதர்களே, எவ்வளவு காலம் என் மதிப்பை[a] அவமானமாக்குவீர்கள்? வெறுமையை நேசித்து, பொய்மையைத் தேடுவீர்களா? சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் மகிமையை.’ எபிரெயச் சொல் மதிப்பு, கௌரவம், மகிமை அல்லது கனம் ஆகியவற்றைக் குறிக்கலாம்; இங்கு சங்கீதக்காரரின் மதிப்பு பொதுவெளியில் அவமானப்படுத்தப்படுவதைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אִישׁ
  choice: மனிதர்களே
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘மனிதரின் மகன்களே’ என்றாலும், அது நவீன தமிழில் இயல்பற்றது. எதிரிகளாகிய மனிதர்களை நேரடியாக அழைக்கும் எபிரெயச் சொல்லாட்சியின் வலிமையை ‘மனிதர்களே’ இயல்பாகக் கடத்துகிறது.
- source_word: עַד מֶה
  choice: எவ்வளவு காலம்
  rationale: தொடர்ந்து நீடிக்கும் செயலுக்கு எதிரான காலவினாவைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: כְבוֹדִי
  choice: என் மதிப்பு
  rationale: כָּבוֹד என்பது மகிமை, கனம், மதிப்பு அல்லது கௌரவம் ஆகிய பொருள்களைக் கொள்ளலாம். பொதுவெளியில் அவமானப்படுத்தப்படும் சங்கீதக்காரரின் மதிப்பை இச்சூழலில் இயல்பாகக் குறிக்கிறது; ‘என் மகிமை’ என்பது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לִכְלִמָּה
  choice: அவமானமாக்குவீர்கள்
  rationale: ‘அவமானத்திற்கு’ என்ற எபிரெயச் சுருக்கமான அமைப்பில் உள்ள விளைவு அல்லது மாற்றக் கருத்தைத் தமிழில் தேவையான வினையுடன் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תֶּאֱהָבוּן
  choice: நேசித்து
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மை முற்றுப்பெறாத வினை, கண்டன வினாவின் தொடர்ச்சியான செயலைக் குறிக்கிறது. அடுத்த இணை வினையோடு தமிழில் இயல்பாக அமைய வினையெச்சமாக வழங்கப்பட்டுள்ளது.
- source_word: רִיק
  choice: வெறுமை
  rationale: பயனற்றது, சாரமற்றது அல்லது வீணானது என்ற பொருள் பரப்பைப் பாதுகாக்கும் தெளிவான நவீன தமிழ்ச் சொல்.
- source_word: תְּבַקְשׁוּ
  choice: தேடுவீர்களா
  rationale: בקשׁ என்பதன் நேரடியான பொருளையும் கண்டன வினாவின் தொனியையும் காக்கிறது.
- source_word: כָזָב
  choice: பொய்மை
  rationale: ‘வெறுமை’ என்பதற்கு இணையான அருவப்பெயராக நின்று கவிதை இணைவடிவைப் பாதுகாக்கிறது; பொய் அல்லது வஞ்சகம் என்ற பொருளையும் உள்ளடக்குகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருளும் வழிபாட்டுப் பயன்பாடும் உறுதியற்றவை; ஆகவே விளக்கமாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘என் மதிப்பு’ என்பதன் குறிப்பு
  choice: பேசுகிறவரின் மதிப்பு அல்லது கௌரவம் என்று பொதுவாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என் மகிமை’ அல்லது ‘கடவுள் எனக்குத் தந்த கௌரவம்’
  rationale: இது அரசருக்குரிய கௌரவத்தையா, சமூக மதிப்பையா, கடவுளிடமிருந்து பெற்ற மகிமையையா குறிக்கிறது என்பதை எபிரெயம் வெளிப்படையாக வரையறுக்கவில்லை. ஆகவே குறிப்பிட்ட இறையியல் விளக்கத்துக்குள் வசனம் சுருக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தையும் நேரடியான கண்டனத் தொனியையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் சொற்குறைவான முதல் வாக்கியத்தில் உள்ள மறைமுக வினை தமிழில் ‘அவமானமாக்குவீர்கள்’ என வெளிப்படுத்தப்பட்டுள்ளது. ‘மனிதரின் மகன்களே’ என்ற சொல்லுக்குச் சொல் வடிவம் இயல்பற்றதால் ‘மனிதர்களே’ என வழங்கப்பட்டுள்ளது.
