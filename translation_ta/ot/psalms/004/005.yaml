lexical_decisions:
- source_word: זִבְח֥וּ
  choice: செலுத்துங்கள்
  rationale: זבח என்பதன் பன்மை ஏவல் வடிவம் பலியிடும் செயலைக் கட்டளையிடுகிறது. தமிழில் ‘பலிகளைச் செலுத்துங்கள்’ என்பது இயல்பான வழிபாட்டுச் சொற்றொடராக இருந்து, ஒரே வேர்ச்சொல்லை வினையிலும் பெயரிலும் பயன்படுத்துவதால் ஏற்படும் செயற்கையான மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- source_word: זִבְחֵי
  choice: பலிகளை
  rationale: இது பலியிடப்படும் பலிப்பொருட்களைக் குறிக்கும் பெயர்ச்சொல். ‘காணிக்கைகள்’ என்பதைவிட ‘பலிகள்’ என்பது மூலத்தின் பலியிடுதல் சார்ந்த குறிப்பான பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: צֶדֶק
  choice: நீதியின்
  rationale: זִבְחֵי צֶדֶק என்ற இணைப்பை ‘நீதியின் பலிகள்’ என வடிவரீதியாகப் பாதுகாப்பதால், அறநேர்மை, உடன்படிக்கைச் செம்மை, முறையான வழிபாடு ஆகியவற்றில் எது முதன்மை என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல் விடுகிறது.
- source_word: וּבִטְחוּ
  choice: நம்புங்கள்
  rationale: בטח என்பதன் பன்மை ஏவல் வடிவம் சார்ந்திருக்கும் நம்பிக்கையை வெளிப்படுத்துகிறது. ‘நம்புங்கள்’ என்பது நேரான, இயல்பான தமிழ் கட்டளை வடிவம்.
- source_word: אֶל
  choice: -வை (நம்புங்கள் என்பதன் செயப்படுபொருள் உருபு)
  rationale: אֶל என்பதன் அடிப்படைத் திசைநோக்குப் பொருள் இங்கு בטח உடன் நம்பிக்கை யார்மீது வைக்கப்படுகிறது என்பதைக் காட்டுகிறது. தமிழில் ‘யாவேவை நம்புங்கள்’ என்பது இயல்பான உறவுசார் வெளிப்பாடு.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ‘Yahweh’ உச்சரிப்புக்கு ஏற்ற தமிழெழுத்துப் பெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: ‘நீதியின் பலிகள்’ என்பதன் பொருள்
  choice: நீதி அல்லது செம்மையால் பண்புபெற்ற பலிகளைச் செலுத்துமாறு அழைப்பதாக மொழிபெயர்த்து, அறநேர்மையா, முறையான வழிபாடா, அல்லது இரண்டுமா என்பதைத் திறந்தே வைத்தல்.
  alternative: ‘நீதியான பலிகளைச் செலுத்துங்கள்’ அல்லது ‘நியாயத்தின் பலிகளைச் செலுத்துங்கள்.’
  rationale: எபிரெயச் சொற்றொடர் அறநெறிசார் உண்மையையும் வழிபாட்டுச் செம்மையையும் உள்ளடக்கக்கூடும். ‘நீதியின் பலிகள்’ இந்த இறையியல் பரப்பையும் மூலத்தின் உண்மையான தெளிவின்மையையும் குறுக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டுக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நீதியின் பலிகள்’ சற்றுச் செறிவான வேதாகமச் சொற்றொடராக இருந்தாலும், மூல எபிரெயத்தின் வடிவத்தையும் பொருள் அகலத்தையும் காக்கிறது; மாற்று இயல்பான வாசிப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
