  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
translation:
  language: ta
  text: என் அலைந்து திரிதலை நீர் எண்ணியிருக்கிறீர்; என் கண்ணீரை உமது துருத்தியில் வைப்பீராக. அவை உமது நூலில் இருக்கின்றன அல்லவா?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹדִי
  choice: நான் அலைந்து திரிந்ததை
  rationale: נוּד என்பதன் அலைதல், இடம்விட்டு இடம் செல்லுதல் என்ற நேரடியான படிமத்தை இது இயல்பான நவீனத் தமிழில் காக்கிறது; ‘என் துயரத்தை’ என்பது அளவுக்கு மீறிய விளக்கமாகிவிடும்.
- source_word: סָפַרְתָּה
  choice: எண்ணியிருக்கிறீர்
  rationale: ספר என்பதன் முதன்மையான ‘எண்ணுதல்/கணக்கிடுதல்’ என்ற பொருளையும், தேவன் கவனமாக அறிந்திருக்கிறார் என்ற உட்பொருளையும் இது தக்கவைக்கிறது.
- source_word: שִׂימָה
  choice: வைத்துக்கொள்வீராக
  rationale: இது שׂים என்ற வினையின் கட்டளை வடிவத்தை, தேவனை நோக்கிய வேண்டுதலுக்கேற்ற கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דִמְעָתִי
  choice: என் கண்ணீரை
  rationale: எபிரேயச் சொல்லின் நேரடியான பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בְנֹאדֶךָ
  choice: உமது துருத்தியில்
  rationale: נֹאד என்பது விலங்குத் தோலால் செய்யப்பட்ட திரவக் கொள்கலனைக் குறிக்கிறது. ‘துருத்தி’ பழங்காலப் பொருளின் தன்மையைப் பொதுவான ‘குடுவை’ என்பதைக் காட்டிலும் துல்லியமாகக் காக்கிறது; அடிக்குறிப்பு அதைத் தெளிவுபடுத்துகிறது.
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: உறுதிப்படுத்தும் பதிலை எதிர்பார்க்கும் எபிரேய வினாவின் சொல்லாட்சியைத் தமிழிலும் வினாவாகவே காக்கிறது.
- source_word: בְסִפְרָתֶךָ
  choice: உமது பதிவேட்டில்
  rationale: இங்கு סִפְרָה எழுதப்பட்ட கணக்கு அல்லது பதிவைக் குறிக்கிறது. ‘பதிவேடு’ அந்தச் சூழற்பொருளை நவீன வாசகருக்கு இயல்பாகத் தெரிவிக்கிறது; அதன் உறுதியான பதிவு என்ற படிமத்தையும் காக்கிறது.
theological_decisions:
- issue: தேவன் கண்ணீரை ஒரு கொள்கலனில் வைத்து, பதிவேட்டில் பதிவு செய்வதாகக் கூறும் மனித உருவகப் படிமம்
  choice: கண்ணீர், துருத்தி, பதிவேடு ஆகிய உறுதியான படிமங்களை உரையிலேயே தக்கவைத்தல்
  alternative: ‘என் துயரங்கள் அனைத்தையும் நீர் நினைவில் வைத்திருக்கிறீர்’ என்று கருத்தை மட்டும் விளக்கிப் பெயர்த்தல்
  rationale: மூலவசனம் தேவன் சங்கீதக்காரரின் துன்பத்தைத் தனிப்பட்ட கவனத்துடன் அறிந்திருப்பதைத் தீவிரமான கவிதைப் படிமங்களால் கூறுகிறது. அவற்றை அரூபமான விளக்கமாக மாற்றாமல் இருப்பது அதன் கவிதை மற்றும் இறையியல் வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், தேவனை நோக்கிய கண்ணியமான ஒருமை மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் நேரடியான வேண்டுதலும் இறுதி சொல்லாட்சிக் கேள்வியும் காக்கப்பட்டுள்ளன.
