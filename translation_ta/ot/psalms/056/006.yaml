  edition: WLC
  text: יָג֤וּרוּ יצפינו הֵ֭מָּה עֲקֵבַ֣/י יִשְׁמֹ֑רוּ כַּ֝/אֲשֶׁ֗ר קִוּ֥וּ נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/006.yaml
  text: They gather together[a]; they hide themselves; they watch my steps[d][c][b], as they wait for my life.
translation:
  language: ta
  text: அவர்கள் ஒன்றுகூடுகிறார்கள்; பதுங்கியிருக்கிறார்கள்[a]; என் காலடிகளைக்[b] கண்காணிக்கிறார்கள்; என் உயிருக்காகக் காத்திருப்பதுபோல்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் மறைந்துகொள்கிறார்கள்” அல்லது “பதுங்கிக் காத்திருக்கிறார்கள்.” எபிரெய வினை தம்மை மறைத்துக்கொள்வதை, இச்சூழலில் பதுங்கியிருப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: நேர்ச்சொல்லாக, “என் குதிகால்களை”; இங்கு “என் காலடிகள்” அல்லது “என் நடமாட்டம்” என்பது பொருள்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெய வினையின் அடிப்படைப் பொருள் “காத்திருப்பது” அல்லது “எதிர்பார்ப்பது.” இங்குள்ள பகைமைச் சூழலில், அது பகை நோக்குடன் காத்திருப்பதைக் குறிக்கிறது. அல்லது, “என் உயிருக்காகக் காத்திருந்ததுபோல்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוּרוּ
  choice: ஒன்றுகூடுகிறார்கள்
  rationale: இந்தப் பகைமைச் சூழலில் வினைச்சொல் எதிரிகள் கூட்டமாகச் சேர்வதைக் குறிக்கிறது. வெளிப்படையான தாக்குதலைச் சேர்க்காமல் அந்தப் பொருளை இயல்பாகத் தருகிறது.
- source_word: יצפינו
  choice: பதுங்கியிருக்கிறார்கள்
  rationale: தங்களை மறைத்துக்கொண்டு வாய்ப்புக்காகக் காத்திருக்கும் பகைமைச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֲקֵבַי
  choice: என் காலடிகளை
  rationale: சொல்லுக்கு நேர் பொருள் ‘என் குதிகால்கள்’; இங்கு ஒருவரின் நடமாட்டம் அல்லது காலடித்தடங்களைக் கவனிப்பது என்ற மரபுத்தொடர்ப் பொருள் உள்ளது.
- source_word: יִשְׁמֹרוּ
  choice: கண்காணிக்கிறார்கள்
  rationale: பாதுகாப்பதைக் குறிக்காமல், பகை நோக்குடன் தொடர்ந்து கவனிப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: כַּאֲשֶׁר
  choice: …போல்
  rationale: ஒப்புமை அல்லது செய்முறையைக் குறிக்கும் எபிரெய இணைப்பைத் தக்கவைக்கிறது; காரணப் பொருளைத் தீர்மானமாக்கவில்லை.
- source_word: קִוּוּ
  choice: காத்திருப்பது
  rationale: வினையின் அடிப்படைப் பொருளான ‘காத்திரு/எதிர்பார்’ என்பதைக் காக்கிறது; பகைமைச் சூழல் தமிழில் ‘உயிரைப் பறிக்க’ என்ற சொற்றொடரால் தெளிவாகிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: இங்கு נֶפֶשׁ முழு மனிதரின் உயிரைக் குறிக்கிறது; ‘ஆத்துமா’ என்பதைவிட ‘உயிர்’ சூழலுக்குப் பொருத்தமானது.
theological_decisions:
- issue: எதிரிகள் ‘காத்திருப்பதன்’ நோக்கம்
  choice: என் உயிரைப் பறிக்கக் காத்திருப்பது
  alternative: என் உயிருக்காகக் காத்திருப்பது / என் உயிரை எதிர்பார்ப்பது
  rationale: קוה என்பதன் அடிப்படைப் பொருள் ‘காத்திரு’ என்றாலும், மறைந்து காலடிகளைக் கண்காணிக்கும் பகைவர்கள் பற்றிய சூழலில் உயிரைக் கொல்லும் வாய்ப்புக்காகக் காத்திருப்பதே இயல்பான பொருள். வினையின் சொற்பொருள் அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. குறுங்கூற்றுகளின் பதற்றமும் தொடர்ச்சியான பகைச் செயல்களும் அரைப்புள்ளிகளால் காக்கப்பட்டுள்ளன. ‘கண்காணிக்கிறார்கள்’ என்பது பாதுகாப்பான கவனிப்பை அல்ல, பகை நோக்குடைய உற்றுநோக்கலைக் காட்டுகிறது.
