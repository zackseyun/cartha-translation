base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[d][c][b], that I may walk before God in the light of life?
translation:
  language: ta
  text: ஏனெனில், நீர் என் உயிரை மரணத்திலிருந்து விடுவித்தீர்[a]; என் கால்களையும் இடறி விழாமல் காத்தீர்[d] அல்லவா? நான் கடவுளுக்கு முன்பாக வாழ்வின் ஒளியில்[c] நடக்கும்படி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்னை.’ எபிரெயச் சொல் ‘உயிர்,’ ‘முழு நபர்,’ அல்லது ஒருவரையே குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘உயிருள்ளோரின் ஒளியில்.’
    reason: lexical_alternative
  - marker: d
    text: ‘காத்தீர்’ என்பது எபிரெயத்தில் வெளிப்படையாக மீண்டும் வரவில்லை; முதல் கூற்றிலுள்ள ‘விடுவித்தீர்’ என்ற வினை இங்கும் பொருளில் தொடர்கிறது.
    reason: source_ellipsis
