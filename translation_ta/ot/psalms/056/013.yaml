- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: נֶפֶשׁ என்பது உயிர், தன்முழுமை அல்லது ஆள் என்பவற்றைக் குறிக்கலாம். மரணத்திலிருந்து விடுவித்தல் என்ற சூழலில் ‘என் உயிரை’ என்பது இயல்பாகவும் அகன்ற பொருளைத் திணிக்காமலும் உள்ளது.
- source_word: מִמָּוֶת
  choice: மரணத்திலிருந்து
  rationale: மரணத்தின் ஆபத்து அல்லது ஆட்சியிலிருந்து விடுவிக்கப்பட்டதை நேரடியாகத் தெரிவிக்கிறது.
- source_word: הֲלֹא
  choice: அல்லவா?
  rationale: உறுதியான ஆம் என்ற பதிலை எதிர்பார்க்கும் எபிரெய வினாவைத் தமிழிலும் வினாவாகவே காக்கிறது.
- source_word: רַגְלַי
  choice: என் கால்களையும்
  rationale: எபிரெய மொழியின் நேரடியான உடல் உருவகத்தைக் காத்து, முதல் விடுவிப்புச் செயலோடு உள்ள இணைப்பை ‘-யும்’ வெளிப்படுத்துகிறது.
- source_word: מִדֶּחִי
  choice: இடறி விழுவதிலிருந்து
  rationale: דֶּחִי என்பதில் இடறுதல், தள்ளுண்டு விழுதல் ஆகிய நிழற்பொருள்கள் உள்ளன; நடப்பது என்ற அடுத்த உருவகத்தோடும் இது இயல்பாக இணைகிறது.
- source_word: לְהִתְהַלֵּךְ
  choice: நடக்கும்படி
  rationale: לְ உடன் வரும் வினையெச்சத்தின் நோக்கப் பொருளைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי אֱלֹהִים
  choice: கடவுளுக்கு முன்பாக
  rationale: ‘கடவுளின் முகத்திற்கு முன்/சந்நிதியில்’ என்ற எபிரெயக் கருத்தைச் சுருக்கமாகவும் மரியாதையான நவீன தமிழிலும் தருகிறது.
- source_word: בְּאוֹר הַחַיִּים
  choice: வாழ்வின் ஒளியில்
  rationale: ஒளி மற்றும் வாழ்வு ஆகிய கவித்துவ உருவகங்களை அப்படியே காக்கிறது; ‘உயிருள்ளோரின் ஒளியில்’ என்பதும் இலக்கண ரீதியாகச் சாத்தியம்.
theological_decisions:
- issue: נַפְשִׁי என்பதன் மனித இயல்பியல் நுணுக்கம்
  choice: என் உயிரை
  alternative: என் ஆத்துமாவை; என்னை
  rationale: இவ்வசனம் மனிதனின் கூறுகளைப் பற்றிய தொழில்நுட்பக் கோட்பாட்டை நிர்ணயிப்பதில்லை. ‘என் உயிரை’ என்பது உயிர், முழு நபர் ஆகிய இரு சாத்தியங்களையும் திறந்தவையாக வைத்திருக்கிறது.
- issue: בְּאוֹר הַחַיִּים என்பதன் குறிப்பு
  choice: வாழ்வின் ஒளியில்
  alternative: உயிருள்ளோரின் ஒளியில்
  rationale: மசோரெட்டிக் உரை நேரடியாக ‘வாழ்வின் ஒளி’ என வாசிக்க இடமளிக்கிறது; அது இவ்வுலக உயிர்வாழ்வையா, கடவுளின் உயிரளிக்கும் பிரசன்னத்தையா குறிக்கிறது என்பதை மொழிபெயர்ப்பு கட்டாயமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடையைப் பயன்படுத்துகிறது. ‘நீர்/விடுவித்தீர்/காத்தீர்’ என்ற மரியாதை ஒருமை கடவுளை நோக்கிய உரைக்கு ஏற்றது. ‘ஆத்துமா’ என்ற சமயத் தொழில்நுட்பச் சாயலைத் தவிர்த்து, மூலச்சொல்லின் அகன்ற பொருளை இயல்பான ‘உயிர்’ காக்கிறது.
