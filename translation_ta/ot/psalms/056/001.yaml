  text: חָנֵּ֣/נִי אֱ֭לֹהִים כִּֽי שְׁאָפַ֣/נִי אֱנ֑וֹשׁ כָּל הַ֝/יּ֗וֹם לֹחֵ֥ם יִלְחָצֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/001.yaml
  text: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
translation:
  language: ta
  text: 'கடவுளே, எனக்கு அருள்புரியும்;


    ஏனெனில், மனிதன் என்னை விழுங்கத் துடிக்கிறான்.[a]


    நாளெல்லாம் போரிட்டு, என்னை நெருக்குகிறான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என்னை மிதிக்கிறான்,” “என்மேல் பாய்கிறான்,” அல்லது “என்னை விழுங்கிவிடப் பார்க்கிறான்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் பகைமையுடன் மூச்சிறைப்பதையோ பேராவலுடன் துரத்துவதையோ உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: எனக்கு அருள்புரியும்
  rationale: חנן என்பதன் பியேல் கட்டளை வடிவம் இறைவனுடைய அருளையும் தயவையும் வேண்டுகிறது. பாவமன்னிப்பை மட்டும் முன்னிறுத்தாமல், வேண்டுதலின் விரிந்த பொருளைப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: நேரடி அழைப்பின் விளியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: שְׁאָפַנִי
  choice: என்னை விழுங்கத் துடிக்கிறான்
  rationale: שׁאף பகைமையுடன் மூச்சிறைத்தல் அல்லது பேராவலுடன் துரத்துதல் என்ற உயிர்ப்பான படிமத்தைக் கொண்டது. தமிழில் 'விழுங்கத் துடிக்கிறான்' அந்தப் பகைமையான பேராவலை இயல்பாகத் தருகிறது; சொல்லின் வேறு சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: אֱנוֹשׁ
  choice: மனிதன்
  rationale: இங்கு ஒருமையிலுள்ள மனித எதிரியைக் குறிக்கிறது; மனிதனின் நிலையற்ற தன்மையை உணர்த்தும் எபிரெயச் சொல்லின் பொதுவான பொருளையும் தக்கவைக்கிறது.
- source_word: כָּל הַיּוֹם
  choice: நாளெல்லாம்
  rationale: தொடர்ச்சியான காலத்தைக் குறிக்கும் இயல்பான, சுருக்கமான தமிழாக்கம்.
- source_word: לֹחֵם
  choice: போரிட்டு
  rationale: தொடர்ந்து நிகழும் பகைச் செயலைச் சூழ்நிலை வினையாக வெளிப்படுத்துகிறது.
- source_word: יִלְחָצֵנִי
  choice: என்னை நெருக்குகிறான்
  rationale: לחץ என்பதிலுள்ள அழுத்துதல், ஒடுக்குதல், துன்புறுத்துதல் ஆகிய அர்த்தவளத்தை 'நெருக்குகிறான்' நேரடியாகவும் இயல்பாகவும் பாதுகாக்கிறது.
theological_decisions:
- issue: אֱנוֹשׁ என்பதன் மனிதரைக் குறிக்கும் ஒருமை
  choice: மனிதன்
  alternative: சாவுக்குரியவன் / மனிதகுலம்
  rationale: சூழல் பொதுவான மனிதகுலத்தை அல்ல, ஒருமையிலுள்ள மனித எதிரியைச் சித்தரிக்கிறது. ஆகவே இறைவனுக்கும் நிலையற்ற மனித எதிர்ப்புக்கும் இடையிலான மறைமுக வேறுபாட்டைத் தீர்க்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நடையும் எளிய சொற்றொடர்களும் பயன்படுத்தப்பட்டுள்ளன. எபிரெயக் கவிதையின் மூன்று அசைவுகளும் வரிப் பிரிப்பால் தெளிவாக்கப்பட்டுள்ளன.
