  text: שָׁאֲפ֣וּ שׁ֭וֹרְרַ/י כָּל הַ/יּ֑וֹם כִּֽי רַבִּ֨ים לֹחֲמִ֖ים לִ֣/י מָרֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/002.yaml
  text: My enemies pant after me all day long[a], for many fight against me from on high.
translation:
  language: ta
  text: என் பகைவர்கள் நாள் முழுவதும் என்னைப் பின்தொடர்ந்து மூச்சிரைக்கிறார்கள்; ஏனெனில், உயரத்திலிருந்து[a] பலர் எனக்கு எதிராகப் போரிடுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னதமானவரே.” இறுதி எபிரெயச் சொல் கடவுளை நோக்கிய அழைப்பாகவும் வாசிக்கப்படலாம்; சிலர் அதை “இறுமாப்புடன்” என்றும் பொருள்கொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאֲפוּ
  choice: தாக்கத் துடிக்கிறார்கள்
  rationale: இந்த வினைச்சொல் மூச்சிரைத்தல் அல்லது மோப்பம் பிடித்தல் என்ற உயிரோட்டமான படிமத்திலிருந்து, பகைமையுடன் ஆவலாகப் பின்தொடர்தல் அல்லது தாக்குதல் என்ற பொருளைக் கொடுக்கலாம். தமிழில் இயல்பற்ற சொற்சொல் மொழிபெயர்ப்பைத் தவிர்த்து, அதன் தீவிரமான பகைமை மற்றும் ஆவலை இத்தொடர் வெளிப்படுத்துகிறது.
- source_word: שׁוֹרְרַי
  choice: என் பகைவர்கள்
  rationale: சங்கீதக்காரனை எதிர்க்கும் பகைமையான நபர்களைத் தெளிவாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: כָּל הַיּוֹם
  choice: நாளெல்லாம்
  rationale: தொடர்ச்சியான செயலைக் குறிக்கும் இயல்பான நவீனத் தமிழ் மரபுத்தொடர்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புலம்பலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: רַבִּים
  choice: பலர்
  rationale: மனித எதிரிகளின் பெரும் எண்ணிக்கையைச் சுருக்கமாகக் குறிக்கிறது.
- source_word: לֹחֲמִים לִי
  choice: எனக்கு எதிராகப் போரிடுகிறார்கள்
  rationale: சங்கீதக்காரனுக்கு எதிராகத் தொடர்ந்து நடைபெறும் பகைமையான போராட்டத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מָרוֹם
  choice: உயரத்திலிருந்து
  rationale: எபிரெயச் சொல்லின் உயரம் அல்லது மேன்மை சார்ந்த படிமத்தைப் பாதுகாக்கிறது; அதன் சுருக்கமான தொடரமைப்பால் எழும் பிற வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: מָרוֹם என்பதன் பொருளாக்கம்
  choice: உயரத்திலிருந்து
  alternative: “உன்னதமானவரே” என்ற கடவுளை நோக்கிய அழைப்பு; அல்லது “இறுமாப்புடன்”
  rationale: இறுதிச் சொல் தொடரமைப்பில் பலவாறு பொருள்கொள்ள இடமளிக்கிறது. முதன்மை உரை உயரம் சார்ந்த பொருளைப் பாதுகாக்கிறது; கடவுளை நேரடியாக அழைக்கும் வாசிப்பையோ இறுமாப்பைக் குறிக்கும் வினையடை வாசிப்பையோ உறுதியாகத் தீர்மானிக்காமல் அடிக்குறிப்பில் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. “தாக்கத் துடிக்கிறார்கள்” என்பது மூல வினையின் தீவிரமான, வேட்டையாடும் ஆவலை இயல்பான தமிழில் எடுத்துரைக்கிறது; மָרוֹם என்பதிலுள்ள உண்மையான பொருள் மயக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
