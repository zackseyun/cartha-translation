revisions:
- from: என் பகைவர்கள் நாளெல்லாம் என்னைத் தாக்கத் துடிக்கிறார்கள்; ஏனெனில், உயரத்திலிருந்து[a] பலர் எனக்கு எதிராகப் போரிடுகிறார்கள்.
  to: என் பகைவர்கள் நாள் முழுவதும் என்னைப் பின்தொடர்ந்து மூச்சிரைக்கிறார்கள்; ஏனெனில், உயரத்திலிருந்து[a] பலர் எனக்கு எதிராகப் போரிடுகிறார்கள்.
  rationale: The revision restores the concrete panting-pursuit imagery of שָׁאֲפוּ while retaining a natural Tamil poetic register. The translation continues to render מָרוֹם spatially as “உயரத்திலிருந்து” and leaves the vocative and adverbial alternatives in the anchored footnote, without resolving the ambiguity doctrinally.
