- from: அப்போது, நான் கூப்பிடும் நாளில் என் பகைவர்கள் பின்வாங்குவார்கள். கடவுள் எனக்குத் துணையாக இருக்கிறார் என்பதை நான் அறிவேன்.[a]
  to: 'அப்போது, நான் கூப்பிடும் நாளில் என் பகைவர்கள் பின்வாங்குவார்கள். இதை[a] நான் அறிவேன்: கடவுள் எனக்குத் துணையாக இருக்கிறார்.'
  rationale: முதன்மை உரையில் “இதை” சேர்க்கப்பட்டதால் זֶה יָדַעְתִּי என்பதன் சுட்டுப்பொருள் வாசிப்பு வெளிப்படையாகப் பாதுகாக்கப்படுகிறது. அடிக்குறி அதே சொல்லில் வைக்கப்பட்டதால், மாற்று கருவிப் பொருள் வாசிப்புக்கான அதன் தொடர்பும் தெளிவாகிறது. மற்ற சொற்கள் மூலத்திற்கும் நவீன நிலையான தமிழ் நடைக்கும் ஏற்றவையாக உள்ளன.
