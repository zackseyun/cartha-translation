  text: אָ֥֨ז יָ֘שׁ֤וּבוּ אוֹיְבַ֣/י אָ֭חוֹר בְּ/י֣וֹם אֶקְרָ֑א זֶה יָ֝דַ֗עְתִּי כִּֽי אֱלֹהִ֥ים לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/009.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
translation:
  language: ta
  text: 'அப்போது, நான் கூப்பிடும் நாளில் என் பகைவர்கள் பின்வாங்குவார்கள். இதை[a] நான் அறிவேன்: கடவுள் எனக்குத் துணையாக இருக்கிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “இதனால் நான் அறிவேன்: கடவுள் எனக்குத் துணையாக இருக்கிறார்.”'
    reason: זֶה யை ‘இது’ என்ற சுட்டுப்பொருளாக அல்லாமல் ‘இதனால்’ என்ற கருவிப் பொருளில் எடுத்துக்கொள்ளும் சாத்தியமான மாற்று வாசிப்பு.
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: விண்ணப்பத்திற்கான விளைவை அறிமுகப்படுத்தும் கால வினையடை; எபிரெயச் சொல்லின் தொடர்ச்சிப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יָשׁוּבוּ ... אָחוֹר
  choice: பின்வாங்குவார்கள்
  rationale: שׁוב உடன் אָחוֹר சேர்ந்த சொற்றொடர் திரும்பிச் செல்லுதல் அல்லது தோல்வியுற்றுப் பின்வாங்குதலைக் குறிக்கிறது; ஒரே இயல்பான தமிழ் வினை இதைப் பிடிக்கிறது.
- source_word: אוֹיְבַי
  choice: என் பகைவர்கள்
  rationale: நேரடியான உடைமைப் பெயர்ச்சொல் அமைப்பைத் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: בְּיוֹם אֶקְרָא
  choice: நான் கூப்பிடும் நாளில்
  rationale: எபிரெய மொழியின் குறிப்பான கால அமைப்பைத் தக்கவைத்து, ஜெபச் சூழலில் קרא என்பதன் பரந்த ‘கூப்பிடு’ பொருளையும் பாதுகாக்கிறது.
- source_word: זֶה יָדַעְתִּי
  choice: இதை நான் அறிவேன்
  rationale: זֶה என்பதை சுட்டுப்பொருளாக வாசிக்கும் இயல்பான மொழிபெயர்ப்பு; கருவிப் பொருளான ‘இதனால்’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: சங்கீதக்காரன் அறிந்திருப்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்தும் இணைப்பாகத் தமிழில் இயல்பாக அமைகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமைப் பொருளில் வரும் பொதுவான எபிரெய இறைப்பெயருக்கான இயல்பான நவீனத் தமிழ் இணை.
- source_word: לִי
  choice: எனக்குத் துணையாக இருக்கிறார்
  rationale: இச்சூழலில் לִי உடைமையைவிட ஆதரவு அல்லது சாதக நிலையை வெளிப்படுத்துகிறது; எதிரிகள் பின்வாங்கும் சூழலோடு இது பொருந்துகிறது.
theological_decisions:
- issue: אֱלֹהִים לִי என்பதன் பொருள்
  choice: கடவுள் சங்கீதக்காரனுக்குத் துணையாக இருக்கிறார்
  alternative: கடவுள் எனக்குரியவர் / என்னுடையவர்
  rationale: எதிரிகள் ஜெபத்துக்குப் பின் பின்வாங்கும் சூழலில் இத்துணை வாக்கியம் கடவுளின் ஆதரவையும் சாதக நிலையையும் முதன்மையாகக் குறிக்கிறது; உடைமை வாசிப்பு இலக்கண ரீதியாக சாத்தியமானாலும் சூழலில் குறைவாகத் துல்லியமானது.
- issue: זֶה יָדַעְתִּי என்பதன் தொடர்பு
  choice: ‘இதை நான் அறிவேன்’—பின்வரும் கூற்றின் உள்ளடக்கத்தைச் சுட்டுகிறது
  alternative: ‘இதனால் நான் அறிவேன்’—எதிரிகள் பின்வாங்குவதையே அறிதலுக்கான சான்றாகக் காட்டுகிறது
  rationale: எபிரெயம் இரு தொடர்புகளையும் அனுமதிக்கிறது. முதன்மை உரையில் சுட்டுப்பொருள் வாசிப்பு இயல்பாக உள்ளது; உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘கூப்பிடும் நாளில்’ மூலத்தின் காலச் சொல்லாக்கத்தைத் தக்கவைக்கிறது; ‘பின்வாங்குவார்கள்’ இயக்கத்தையும் தோல்வியின் நிழற்பொருளையும் இயல்பாக இணைக்கிறது. அடிக்குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
