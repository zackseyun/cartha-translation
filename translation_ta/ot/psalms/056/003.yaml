base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/003.yaml
  text: When I am afraid[a], I will trust in you.
translation:
  language: ta
  text: நான் பயப்படும்போது[a], உம்மை நம்புவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு நெருக்கமாக: “நான் பயப்படும் நாளில், நான்—உம்மை நம்புவேன்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֥וֹם
  choice: பயப்படும்போது
  rationale: יוֹם என்பதன் அடிப்படைப் பொருள் ‘நாள்’ என்றாலும், இங்கு அது אִירָא உடன் சேர்ந்து காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது. ஆகவே இயல்பான நவீனத் தமிழில் ‘பயப்படும்போது’ என வழங்கப்பட்டது.
- source_word: אִירָ֑א
  choice: நான் பயப்படுகிறேன் / பயப்படும்போது
  rationale: ירא என்பதன் Qal imperfect முதலாம் நபர் ஒருமை வடிவம். இச்சூழலில் இறைப்பயபக்தியை அல்ல, சங்கீதக்காரரின் அச்ச அனுபவத்தைக் குறிக்கிறது; காலத்தொடரில் ‘பயப்படும்போது’ என்பது இயல்பான தமிழ்.
- source_word: אֲ֝נִ֗י
  choice: நான்
  rationale: வினை வடிவத்திலேயே நபர் குறிக்கப்பட்டிருந்தாலும், தனிப்பட்ட சுட்டுப்பெயர் வலியுறுத்தலைச் சேர்க்கிறது. அதைத் தமிழில் வெளிப்படையான ‘நான்’ என்பதன் மூலம் பேணுகிறோம்.
- source_word: אֵלֶ֥י/ךָ
  choice: உம்மை
  rationale: בטח உடன் வரும் אֶל நம்பிக்கை ஒருவரை நோக்கிச் செலுத்தப்படுவதைச் சுட்டுகிறது. தமிழில் ‘உம்மை நம்புவேன்’ என்பது இயல்பான வினைத் தொடர்பாகும்.
- source_word: אֶבְטָֽח
  choice: நம்புவேன்
  rationale: בטח என்பது ‘நம்புதல், நம்பிக்கை வைத்தல்’ எனப் பொருள்படும். இங்குள்ள imperfect வடிவம் அச்சத்தின் மத்தியில் எடுக்கப்படும் உறுதியான தீர்மானத்தை வெளிப்படுத்துவதால் ‘நம்புவேன்’ என மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: பயத்திற்கும் நம்பிக்கைக்கும் இடையிலான உறவு
  choice: பயம் ஏற்படும் வேளையில் சங்கீதக்காரர் திட்டவட்டமாகக் கடவுளை நம்புகிறார்; பயம் இல்லை என்று வசனம் கூறவில்லை.
  alternative: நம்பிக்கை பயத்தை முற்றிலும் அகற்றிவிட்டது என்று பொருள்விரித்தல்.
  rationale: எபிரெய உரை பய அனுபவத்தையும் நம்புவதற்கான தீர்மானத்தையும் அருகருகே வைக்கிறது. அவற்றுக்கிடையிலான பதற்றத்தைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமான ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது; மூலத்திலுள்ள אֲנִי-யின் வலியுறுத்தல் அடிக்குறிப்பில் தெளிவாக்கப்பட்டுள்ளது.
