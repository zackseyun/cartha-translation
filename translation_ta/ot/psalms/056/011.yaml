id: PSA.56.11
reference: Psalms 56:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בֵּֽ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/011.yaml
  text: In God I have trusted; I will not fear[a]. What can man do to me?
translation:
  language: ta
  text: 'கடவுள்மேல் நான் நம்பிக்கை வைத்திருக்கிறேன்;

    நான் அஞ்சமாட்டேன்.

    மனிதன்[a] எனக்கு என்ன செய்ய முடியும்?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மனிதன்’ என்பதற்கு ‘ஒரு மனிதர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் אָדָם ஒருமையில் வந்து, இங்கு ஒரு மனிதரைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: கடவுள்மேல்
  rationale: בְּ இங்கு நம்பிக்கையின் சார்பையும் நோக்கையும் குறிக்கிறது. இயல்பான தமிழில் ‘கடவுள்மேல்’ என்பது ‘கடவுளில்’ என்பதைவிட நம்பிக்கைச் சொல்லாட்சிக்கு ஏற்றது.
- source_word: בָּטַחְתִּי
  choice: நான் நம்பிக்கை வைத்திருக்கிறேன்
  rationale: בטח என்பதன் Qal முற்றுவினை, ஏற்கெனவே வைக்கப்பட்டு தொடர்ந்து நிலைக்கும் நம்பிக்கையைச் சுட்டுகிறது; இந்தத் தமிழ் வடிவம் அந்த நிலைபெற்ற நம்பிக்கையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא אִירָא
  choice: நான் அஞ்சமாட்டேன்
  rationale: மறுப்புடன் வரும் முற்றுப்பெறா வினை இச்சூழலில் நம்பிக்கையிலிருந்து எழும் உறுதியான எதிர்காலத் தீர்மானத்தைத் தெரிவிக்கிறது.
- source_word: מַה יַּעֲשֶׂה
  choice: என்ன செய்ய முடியும்?
  rationale: מַה என்பதன் அடிப்படைப் பொருள் ‘என்ன’; இங்கு வரும் வினாவியல் அமைப்பு இயலாமையை வலியுறுத்துவதால் தமிழில் ‘என்ன செய்ய முடியும்?’ என்பது அதன் நோக்கத்தை இயல்பாகத் தருகிறது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: எபிரெயச் சொல் ஒருமையில் இருந்தாலும் இங்கு எந்த மனித எதிரியையும் பிரதிநிதித்துவப்படுத்துகிறது. ‘மனிதன்’ ஒருமையையும் பொதுப்பிரதிநிதித்துவப் பொருளையும் காக்கிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: לְ உடன் முதலாம் நபர் ஒருமைப் பின்னொட்டு நேரடியாக ‘எனக்கு’ என்று பொருள்படும்; ‘செய்’ என்ற வினையுடன் இது தமிழிலும் இயல்பாக அமைகிறது.
theological_decisions:
- issue: אָדָם என்பதன் பிரதிநிதித்துவ ஒருமை
  choice: மனிதன்
  alternative: ஒரு மனிதர் / மனித இனம்
  rationale: இறைவனுக்கும் பலவீனமான மனித எதிர்ப்புக்கும் உள்ள முரணை வசனம் காட்டுகிறது. ஒருமை வடிவத்தைப் பாதுகாத்து, அதை ஒரு குறிப்பிட்ட ஆணுக்கு மட்டும் கட்டுப்படுத்தாமல் பொதுவான மனிதப் பிரதிநிதியாக வாசிக்க ‘மனிதன்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, எளிமையானதும் கண்ணியமானதும் ஆன நடையைப் பயன்படுத்துகிறது. எபிரெயச் செய்யுளின் மூன்று கருத்து அலகுகளும் தனித்தனி வரிகளாக வைக்கப்பட்டுள்ளன; ‘அஞ்சமாட்டேன்’ என்ற வடிவம் நம்பிக்கையிலிருந்து வரும் உறுதியைக் காக்கிறது.
