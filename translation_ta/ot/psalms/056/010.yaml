lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: தேவனில்
  rationale: בְּ முன்னிடைச்சொல்லின் ‘இல்/சார்ந்து’ என்ற உறவுசார் பொருளையும், இரண்டாம் அடியில் வரும் בַּיהוָה என்பதுடனான இணை அமைப்பையும் காக்கிறது.
- source_word: אֲהַלֵּל
  choice: நான் … புகழ்வேன்
  rationale: הלל என்பதன் பியேல் முற்றாதநிலை முதல் நபர் ஒருமை வடிவம் இங்கு கவிதைநடையில் உறுதி அல்லது எதிர்கால நோக்கை வெளிப்படுத்துகிறது.
- source_word: דָּבָר
  choice: அந்த வார்த்தையை
  rationale: דָּבָר என்பதன் அடிப்படைச் சொல்லுணர்வைக் காத்து, இரு அடிகளிலும் உள்ள மறுபதிப்பைத் தெளிவாக வெளிப்படுத்துகிறது; சூழலில் ‘வாக்குறுதி’ என்ற பொருளும் சாத்தியம்.
- source_word: בַּיהוָה
  choice: யாவேவில்
  rationale: בְּ முன்னிடைச்சொல்லை ‘இல்’ என்று இணையாகக் காத்து, יהוה என்ற உடன்படிக்கைப் பெயரை ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்து இறைப்பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல், அதன் தனிப்பெயர்த் தன்மையை ஒலிபெயர்ப்பால் காக்கிறது.
- issue: புகழப்படுவது தேவனா அல்லது அவரது வார்த்தையா?
  choice: இலக்கணப்படி ‘அந்த வார்த்தையை’ நேரடி செயப்படுபொருளாக வைத்தல்
  alternative: ‘தேவனை அவரது வார்த்தைக்காகப் புகழ்வேன்’ என்று விளக்குதல்
  rationale: எபிரெய உரையில் דָּבָר என்பது אֲהַלֵּל என்பதன் வெளிப்படையான செயப்படுபொருள்; விளக்கமான மாற்றம் செய்யாமல் அதன் கவித்துவ மற்றும் இறையியல் இறுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பும் கண்ணியமும் பேணப்பட்டுள்ளன. மூலத்தின் இரட்டை இணை அமைப்பும் ‘வார்த்தை’ என்ற மறுபதிப்பும் காக்கப்பட்டுள்ளன; ‘தேவனில்/யாவேவில்’ என்பது தமிழில் சற்றுக் கவிதைநடை கொண்டிருந்தாலும் எபிரெய முன்னிடைச்சொல்லின் திட்டமிட்ட இணைத்தன்மையைப் பாதுகாக்கிறது.
