revisions:
- from: அவர்களுடைய அக்கிரமத்தினால் அவர்கள் தப்பிவிட அனுமதிக்காதீர்[a]; சினத்துடன் மக்களினங்களை[b] வீழ்த்தும், கடவுளே!
  to: அக்கிரமத்தினிமித்தம் அவர்கள் தப்பிவிட அனுமதிக்காதீர்[a]; சினத்துடன் மக்களினங்களை[b] வீழ்த்தும், கடவுளே!
  rationale: The revision removes an unexpressed possessive from the main text, thereby retaining the Hebrew’s compact ambiguity while leaving the contextual reference clear through ‘அவர்கள்.’ Footnote a is adjusted to state the principal alternative more accurately and naturally in Tamil. No doctrinal interpretation is added.
