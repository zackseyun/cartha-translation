  text: עַל אָ֥וֶן פַּלֶּט לָ֑/מוֹ בְּ֝/אַ֗ף עַמִּ֤ים הוֹרֵ֬ד אֱלֹהִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/007.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
translation:
  language: ta
  text: அக்கிரமத்தினிமித்தம் அவர்கள் தப்பிவிட அனுமதிக்காதீர்[a]; சினத்துடன் மக்களினங்களை[b] வீழ்த்தும், கடவுளே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அக்கிரமத்தினிமித்தம் அவர்களை விடுவிக்காதீர்.” எபிரெயச் சொற்றொடர் கடினமானது; வினைச்சொல்லை “தப்புதல்” என்பதற்குப் பதிலாக “விடுவி, மீட்டு” என்ற பொருளில் நேரடியாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தேசங்களை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אָוֶן
  choice: அவர்களுடைய அக்கிரமத்தினால்
  rationale: עַל இங்கு காரணத்தைக் குறிக்கிறது; אָוֶן தீமை அல்லது அக்கிரமம் என்ற அறநெறிசார் பாரத்தை உடையது. தமிழ் வாக்கியத்தில் யாருடைய அக்கிரமம் என்பது தெளிவாக இருக்க ‘அவர்களுடைய’ என்பது சூழலிலிருந்து வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: פַּלֶּט לָמוֹ
  choice: அவர்கள் தப்பிவிட அனுமதிக்காதீர்
  rationale: פלט என்பதன் அடிப்படைப் பொருள் ‘தப்புதல்’ அல்லது ‘விடுவித்தல்.’ சங்கீதத்தின் நீதித்தீர்ப்புக் கோரும் சூழலிலும் அடுத்த வேண்டுதலுடனான இணைப்பிலும், அவர்கள் தண்டனையிலிருந்து தப்ப அனுமதிக்க வேண்டாம் என்ற எதிர்மறை வேண்டுதல் இயல்பாகப் பொருந்துகிறது. எபிரெய வாக்கியத்தின் சிக்கல் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: בְּאַף
  choice: சினத்துடன்
  rationale: אַף இங்கு கோபம் அல்லது சினத்தைக் குறிக்கிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘உமது’ என்பதைச் சேர்க்காமல், செயல் நிகழும் மனநிலையை ‘சினத்துடன்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַמִּים
  choice: மக்களினங்களை
  rationale: பன்மையான עַמִּים பல மக்கள் கூட்டங்களைக் குறிக்கிறது. ‘மக்களினங்கள்’ அந்தப் பன்மையையும், ‘தேசங்கள்’ என்ற மாற்றுப் பொருளுக்கு இடமளிக்கும் பரப்பையும் காக்கிறது.
- source_word: הוֹרֵד
  choice: வீழ்த்தும்
  rationale: ירד என்பதன் ஹிஃபீல் கட்டளை வடிவம் கீழிறக்குதல், தாழ்த்துதல் அல்லது முறியடித்தல் என்ற படிமத்தைக் கொண்டது. ‘வீழ்த்தும்’ என்பது வேண்டுதலின் வலிமையையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது நேரடி அழைப்பு; ‘கடவுளே’ தமிழில் அதன் விளி வேற்றுமையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சிக்கலான முதல் அரையடியில் எதிர்மறை வேண்டுதல் மறைமுகமாக உள்ளதா?
  choice: அக்கிரமத்தின் காரணமாக எதிரிகள் தப்ப அனுமதிக்க வேண்டாம் என்று கடவுளிடம் வேண்டுவதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘அக்கிரமத்திற்காக அவர்களை விடுவிக்காதீர்’ அல்லது, எதிர்மறையை வழங்காமல், ‘தீமையினால் அவர்கள் தப்புகிறார்கள்’ எனவும் எபிரெயத்தைப் புரிந்துகொள்ளலாம்.
  rationale: எபிரெய வாக்கியம் மிகச் சுருக்கமாகவும் தொடரியல் ரீதியில் கடினமாகவும் உள்ளது; குறிப்பாக פַּלֶּט என்பதன் செயப்படுபொருள்/பொருள் உறவும் எதிர்மறை வலிமையும் வெளிப்படையாக இல்லை. இருப்பினும் சங்கீதத்தின் சூழலும் தொடர்ந்து வரும் நீதித்தீர்ப்புக்கான வேண்டுதலும் ‘தப்ப அனுமதிக்காதீர்’ என்ற வாசிப்பை ஆதரிக்கின்றன. மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘அனுமதிக்காதீர்’ மற்றும் ‘வீழ்த்தும்’ ஆகிய மரியாதைமிக்க கட்டளை வடிவங்கள் கடவுளை நோக்கிய வேண்டுதலை இயல்பாக வெளிப்படுத்துகின்றன; மூலத்தில் இல்லாத ‘உமது’ சேர்க்கப்படவில்லை.
