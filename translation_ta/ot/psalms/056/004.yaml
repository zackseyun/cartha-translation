source:
  edition: WLC
  text: בֵּ/אלֹהִים֮ אֲהַלֵּ֪ל דְּבָ֫ר֥/וֹ בֵּ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה בָשָׂ֣ר לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/004.yaml
  text: In God I will praise his word[a]; in God I have trusted; I will not fear[c][b]. What can flesh do to me?
translation:
  language: ta
  text: தேவனில் அவருடைய வார்த்தையைப் புகழ்வேன்; தேவனில் நம்பிக்கை வைத்திருக்கிறேன்; நான் அஞ்சமாட்டேன். மாம்சம்[a] எனக்கு என்ன செய்ய முடியும்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மாம்சம்’ என்பது இங்கே தேவனோடு ஒப்பிடும்போது பலவீனமும் நிலையாமையும் உடைய மனிதர்களைக் குறிக்கிறது.
    reason: cultural_note
  - marker: b
    text: அல்லது, “மாம்சம் எனக்கு என்ன செய்யும்?” எபிரெயில் வினைச்சொல் எதிர்கால வடிவில் உள்ளது; இங்கே வினா, மனிதனால் எதுவும் செய்ய இயலாது என்ற நம்பிக்கையையும் உணர்த்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: தேவனில்
  rationale: בְּ என்ற முன்னிடைச்சொல் இங்கு தேவனே புகழ்ச்சிக்கும் நம்பிக்கைக்கும் உரிய சார்பும் அடித்தளமும் என்பதைத் தெரிவிக்கிறது. இரு இணையான கூறுகளிலும் ஒரே வடிவத்தை வைத்திருப்பது எபிரெயக் கவிதை அமைப்பைப் பாதுகாக்கிறது.
- source_word: אֲהַלֵּל
  choice: புகழ்வேன்
  rationale: Piel முற்றுப்பெறா வினை இங்கு எதிர்காலத்தையும் உறுதியான தீர்மானத்தையும் வெளிப்படுத்துகிறது.
- source_word: דְּבָרוֹ
  choice: அவருடைய வார்த்தையை
  rationale: דָּבָר என்பதன் அடிப்படைப் பொருளான ‘வார்த்தை’ பாதுகாக்கப்படுகிறது; அதை ‘வாக்குறுதி’ என்று குறுக்காமல், தேவன் சொன்னதன் பரந்த பொருளைத் திறந்தே வைக்கிறது.
- source_word: בָּטַחְתִּי
  choice: நம்பிக்கை வைத்திருக்கிறேன்
  rationale: Qatal வடிவம் முன்பே வைக்கப்பட்ட நம்பிக்கையையும் அதன் நிகழ்காலத் தொடர்ச்சியையும் காட்டுகிறது; தமிழ் நிறைநிலை வடிவம் இரண்டையும் இயல்பாக எடுத்துரைக்கிறது.
- source_word: לֹא אִירָא
  choice: நான் அஞ்சமாட்டேன்
  rationale: மறுப்புடன் வரும் முற்றுப்பெறா வினை, அஞ்சாதிருக்கும் தற்போதைய உறுதியையும் எதிர்காலத் தீர்மானத்தையும் தெரிவிக்கிறது.
- source_word: מַה יַּעֲשֶׂה
  choice: என்ன செய்ய முடியும்?
  rationale: எபிரெயில் வடிவரீதியாக ‘என்ன செய்யும்?’ என்று இருந்தாலும், இது மனிதரின் இயலாமையை உணர்த்தும் நம்பிக்கைமிக்க வினாவாக இருப்பதால் தமிழில் ‘என்ன செய்ய முடியும்?’ என்பது இயல்பாக உள்ளது; நேரடி எதிர்கால வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בָשָׂר
  choice: மாம்சம்
  rationale: ‘மாம்சம்’ என்ற உருவகச் சொல் தேவனுக்கு எதிராக நிற்கும் நிலையற்ற, பலவீனமான மனிதரைச் சுட்டுகிறது. ‘மனிதன்’ என்று சமப்படுத்தாமல் மூலத்தின் உருவகத்தையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: לְּ முன்னிடைச்சொல் இணைந்த முதலாம் நபர் ஒருமை பின்னொட்டு தமிழில் இயல்பாக ‘எனக்கு’ என வருகிறது.
theological_decisions:
- issue: தேவனுக்கும் בָשָׂר எனப்படும் மனித நிலையாமைக்கும் இடையிலான முரண்
  choice: மாம்சம்
  alternative: மனிதன் / நிலையற்ற மனிதர்
  rationale: ‘மாம்சம்’ என்பது உடலுடைய, பலவீனமான மனிதகுலத்தைக் குறிக்கும் எபிரெய உருவகத்தை வைத்திருக்கிறது. இதனால் மனிதரின் வரம்புக்கும் தேவன்மீது வைக்கப்படும் நம்பிக்கைக்கும் இடையிலான பதற்றம் குறைக்கப்படவில்லை.
- issue: דְּבָרוֹ என்பதன் பொருள்
  choice: அவருடைய வார்த்தை
  alternative: அவருடைய வாக்குறுதி / அவர் சொன்னது
  rationale: சூழலில் வாக்குறுதி உட்பொருளாக இருக்கலாம்; ஆனால் மூலச்சொல் அதைவிட விரிவானது. ஆகவே குறிப்பிட்ட இறையியல் விளக்கத்தைச் சேர்க்காமல் ‘வார்த்தை’ எனத் திறந்த நிலையில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified ஆன, சுருக்கமான சங்கீத நடையைப் பயன்படுத்துகிறது. ‘தேவனில்’ என்ற மீளுரை எபிரெய இணை அமைப்பையும் தேவனைச் சார்ந்திருக்கும் கருத்தையும் காக்கிறது. ‘மாம்சம்’ சாதாரண உரைநடையில் சற்று குறைவாக வந்தாலும், மூல உருவகத்தைக் காக்கப் பயன்படுத்தப்பட்டு அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
