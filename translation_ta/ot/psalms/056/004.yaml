  source_fidelity: மூல எபிரெயத்தின் மூன்று இணையான கூறுகளும் நம்பிக்கையூட்டும் வினாவும் துல்லியமாகக் காக்கப்பட்டுள்ளன. בֵּאלֹהִים என்பதன் மீளுரையாக ‘தேவனில்’ இருமுறையும் உள்ளது; אֲהַלֵּל-இன் தீர்மானத் தன்மை ‘புகழ்வேன்’ என்பதாலும், בָּטַחְתִּי-இன் நிறைவு/தொடர்நிலை ‘நம்பிக்கை வைத்திருக்கிறேன்’ என்பதாலும், לֹא אִירָא-இன் உறுதி ‘அஞ்சமாட்டேன்’ என்பதாலும் நன்றாக வெளிப்படுகிறது. மַה יַּעֲשֶׂה என்பதன் சொல்லளவிலான எதிர்கால வடிவமும் தமிழில் இயல்பான சொல்லாட்சியான ‘என்ன செய்ய முடியும்?’ என்பதன் சொல்லாடல் வினா அர்த்தமும் அடிக்குறிப்பில் முறையாகப் பாதுகாக்கப்படுகின்றன.
