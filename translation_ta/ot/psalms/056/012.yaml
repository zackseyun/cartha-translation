  text: עָלַ֣/י אֱלֹהִ֣ים נְדָרֶ֑י/ךָ אֲשַׁלֵּ֖ם תּוֹדֹ֣ת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/012.yaml
  text: Your vows are upon me[a], O God[b]; I will render thank offerings to you.
translation:
  language: ta
  text: உமது நேர்த்திக்கடன்கள் என்மேல் உள்ளன[a], கடவுளே; உமக்கு நன்றிப் பலிகளைச் செலுத்துவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இயல்பான பொருளில், “நான் உமக்குச் செய்த நேர்த்திக்கடன்கள் என்மேல் உள்ளன.” எபிரேயத்தில் எழுத்துப்படி “உமது நேர்த்திக்கடன்கள்”; அதாவது கடவுளுக்குச் செலுத்த வேண்டிய நேர்த்திக்கடன்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது “நன்றியறிவிப்புகளைச் செலுத்துவேன்.” எபிரேயச் சொல் நன்றியை வெளிப்படுத்தும் செயல்களையோ நன்றிப் பலிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: என்மேல் உள்ளன
  rationale: ஒருவர்மேல் ஓர் பொறுப்பு இருப்பதைக் குறிக்கும் எபிரேய உருவகத்தையும், அதை நிறைவேற்ற வேண்டிய கடப்பாட்டையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இங்கு நேரடி விளி இடம்பெறுவதால், தமிழ் விளிவேற்றுமையுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: נְדָרֶיךָ
  choice: உமது நேர்த்திக்கடன்கள்
  rationale: இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டை வெளிப்படையாகக் காக்கிறது. இவை கடவுளுக்குச் செலுத்த வேண்டிய நேர்த்திக்கடன்கள் என்ற பொருள் இருக்கலாம்; ஆனால் மூலத்தின் சற்றே அசாதாரணமான சொல்லமைப்பு முதன்மை உரையில் தீர்த்துவிடப்படவில்லை.
- source_word: אֲשַׁלֵּם
  choice: செலுத்துவேன்
  rationale: שלם என்பதன் பியேல் வடிவம் கடன், நேர்த்திக்கடன் அல்லது செலுத்த வேண்டிய ஒன்றை நிறைவேற்றுதல்/செலுத்துதல் என்ற பொருளைத் தருகிறது; பலிகளுடன் ‘செலுத்துவேன்’ இயல்பாக அமைகிறது.
- source_word: תּוֹדוֹת
  choice: நன்றிப் பலிகள்
  rationale: இச்சொல் நன்றியறிவிப்புகளையோ நன்றிப் பலிகளையோ குறிக்கலாம். நேர்த்திக்கடன்களும் ‘செலுத்துதல்’ என்ற வினையும் உள்ள சூழலில் பலிசார் பொருள் சாத்தியமானதால் இதை முதன்மை உரையில் எடுத்துக்கொண்டு, பரந்த பொருளை அடிக்குறிப்பில் வைத்துள்ளது.
- source_word: לָךְ
  choice: உமக்கு
  rationale: பெறுநரைக் குறிக்கும் ל முன்னொட்டின் நேரடியான, மரியாதைமிக்க தமிழ் வடிவம்.
theological_decisions:
- issue: ‘உமது நேர்த்திக்கடன்கள்’ என்பதற்கும் கடவுளுக்கும் உள்ள உறவு
  choice: மூல எபிரேயத்தின் இரண்டாம் நபர் உடைமை வடிவத்தை ‘உமது நேர்த்திக்கடன்கள்’ என்று முதன்மை உரையில் காத்தல்
  alternative: ‘நான் உமக்குச் செய்த நேர்த்திக்கடன்கள்’
  rationale: மாற்று வடிவம் பொருளைத் தமிழில் தெளிவாக்கினாலும், மூலத்தில் வெளிப்படையாக இல்லாத ‘நான் செய்த’ என்ற கூறைச் சேர்க்கிறது. ஆகவே மூலத்தின் உண்மையான மொழியியல் இறுக்கம் காக்கப்பட்டு, இயல்பான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: תּוֹדוֹת என்பது சொற்களால் வெளிப்படும் நன்றியா அல்லது பலியா
  choice: நன்றிப் பலிகள்
  alternative: நன்றியறிவிப்புகள்
  rationale: நேர்த்திக்கடன்களையும் அவற்றைச் செலுத்துவதையும் பற்றிய சூழல் பலிசார் பொருளை ஆதரிக்கிறது; எனினும் சொல்லின் பரந்த நன்றியறிவிப்பு பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையும் கடவுளை நோக்கிய மரியாதை ஒருமையும் பயன்படுத்தப்பட்டுள்ளன. ‘நேர்த்திக்கடன்’ மற்றும் ‘நன்றிப் பலி’ ஆகியவை வழிபாட்டுச் சூழலைத் தெளிவாகக் காட்டினாலும் சாதாரண வாசகருக்கும் புரியும் சொற்களாக உள்ளன.
