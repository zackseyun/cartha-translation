  text: நாளெல்லாம் என் வார்த்தைகளைத் திரித்துக் கூறுகிறார்கள்[a]; அவர்களுடைய எல்லா எண்ணங்களும் எனக்கு எதிராகத் தீங்கையே நோக்கி இருக்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் வார்த்தைகளுக்குத் துன்பம் விளைவிக்கிறார்கள்.” எபிரெய வினை கடினமானது; அது துன்பம் விளைவித்தல் அல்லது திரித்தல் என்ற பொருளைக் கொண்டிருக்கலாம். இச்சூழலில் பகைமை நோக்குடன் வார்த்தைகளைத் திரித்துக் கூறுதல் பொருத்தமாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய எல்லா திட்டங்களும் எனக்கு எதிராகத் தீமைக்கே.” “எண்ணங்கள்” என்பதற்கான எபிரெயச் சொல் திட்டங்கள் அல்லது சூழ்ச்சிகளையும் குறிக்கலாம்.
