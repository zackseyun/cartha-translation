- source_word: יְעַצֵּבוּ
  choice: திரித்துக் கூறுகிறார்கள்
  rationale: இந்த வினை கடினமானது; புண்படுத்துதல், துன்புறுத்துதல், திரித்தல் ஆகிய நுண்பொருள்களைத் தரக்கூடும். ‘என் வார்த்தைகள்’ என்ற செயப்படுபொருளுடன், தீய நோக்கில் தவறாக எடுத்துரைப்பதை இத்தேர்வு இயல்பாகக் காட்டுகிறது.
- source_word: עָלַי
  choice: எனக்கு எதிரான
  rationale: பகைமை நிறைந்த சூழலில் ‘என்மேல்’ என்பதைவிட எதிர்ப்புப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל מַחְשְׁבֹתָם
  choice: அவர்களுடைய எண்ணங்களெல்லாம்
  rationale: מַחְשְׁבוֹת என்பது எண்ணங்கள், திட்டங்கள், சூழ்ச்சிகள் எனப் பொருள்படலாம். ‘எண்ணங்கள்’ அடிப்படைப் பொருளைப் பாதுகாக்கிறது; தீய நோக்கை அடுத்த சொற்றொடர் தெளிவுபடுத்துகிறது.
- source_word: לָרָע
  choice: தீங்கு செய்வதற்கே
  rationale: தீய அல்லது கேடு விளைவிக்கும் நோக்கை இயல்பான தமிழில் காட்டுகிறது; ‘-க்கே’ என்பது அவர்களின் எண்ணங்கள் அனைத்தும் அந்த நோக்கையே கொண்டிருப்பதை வலியுறுத்துகிறது.
