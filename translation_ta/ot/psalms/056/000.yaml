source:
  edition: WLC
  text: לַ/מְנַצֵּ֤חַ עַל י֬וֹנַת אֵ֣לֶם רְ֭חֹקִים לְ/דָוִ֣ד מִכְתָּ֑ם בֶּֽ/אֱחֹ֨ז אֹת֖/וֹ פְלִשְׁתִּ֣ים בְּ/גַֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/000.yaml
  text: 'For the choir director: according to “The Silent Dove of Distant Places.” Of David[a]. A miktam[b], when the Philistines seized him in Gath.'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: “தொலைதூர இடங்களின் மௌனப் புறா”[a] என்ற மெட்டின்படி. தாவீதுக்கு உரியது. ஒரு மிக்தாம்[b]. பெலிஸ்தியர்கள் அவரைக் காத் நகரில் பிடித்தபோது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “தொலைதூர மௌனத்தின் புறா” என்றும் பொருள்கொள்ளலாம்; இது வேறொரு மெட்டின் தலைப்பாகவும் இருக்கக்கூடும். இச்சொற்றொடரின் துல்லியமான பொருள் உறுதியில்லை.
    reason: alternative_reading
  - marker: b
    text: “மிக்தாம்” என்பது சங்கீத முன்னுரைகளில் வரும் ஒரு தொழில்நுட்பச் சொல்; அதன் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீத முன்னுரைகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கும் வழக்குச் சொற்றொடர்; நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַל יוֹנַת אֵלֶם רְחֹקִים
  choice: “தொலைதூர இடங்களின் மௌனப் புறா” என்ற மெட்டின்படி
  rationale: עַל என்பதைக் கீதத்தின் இசை அல்லது மெட்டை அறிமுகப்படுத்துவதாக எடுத்துக்கொள்கிறது. பின்வரும் தெளிவற்ற சொற்றொடர் ஓர் இசைத் தலைப்பாக மேற்கோளுக்குள் வைக்கப்பட்டுள்ளது; אֵלֶם என்பதன் மௌனம்/பேசாமை சார்ந்த பொருளும் רְחֹקִים என்பதன் தொலைவு சார்ந்த பொருளும் காக்கப்பட்டுள்ளன.
- source_word: לְדָוִד
  choice: தாவீதுக்கு உரியது
  rationale: ஆசிரியத்துவம், அர்ப்பணிப்பு அல்லது தொடர்பு ஆகியவற்றில் ஒன்றைத் திட்டவட்டமாகத் தீர்மானிக்காமல் לְ என்ற உறவின் நெகிழ்வைத் தமிழில் காக்கிறது.
- source_word: מִכְתָּם
  choice: மிக்தாம்
  rationale: துல்லியமான பொருள் தெரியாத சங்கீதத் தலைப்புத் தொழில்நுட்பச் சொல் என்பதால் ஊகமாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּאֱחֹז אֹתוֹ
  choice: அவரைப் பிடித்தபோது
  rationale: בְּ உடன் வரும் infinitive construct காலச் சூழலைக் குறிக்கிறது; אחז என்பதன் பற்றிப் பிடித்தல்/கைப்பற்றுதல் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: פְלִשְׁתִּים בְּגַת
  choice: பெலிஸ்தியர்கள் ... காத் நகரில்
  rationale: இனப்பெயரும் இடப்பெயரும் வழக்கமான தமிழ் ஒலிபெயர்ப்பில் தரப்பட்டுள்ளன; בְּ இடத்தைக் குறிக்கிறது.
theological_decisions:
- issue: சங்கீத முன்னுரையின் நிலை
  choice: இசை மற்றும் வரலாற்றுக் குறிப்புகள் உட்பட முன்னுரையை வேதாகம உரையின் பகுதியாக மொழிபெயர்த்தல்
  alternative: அதை மொழிபெயர்க்கப்படாத ஆசிரியர் குறிப்பாக நடத்துதல்
  rationale: எபிரெய உரை இதைச் சங்கீத முன்னுரையாக அளிக்கிறது; அதன் தகவலைக் காக்கும் அதே வேளையில் தெளிவற்ற இசைச்சொற்களுக்கு உறுதியற்ற விளக்கத்தைத் திணிக்கவில்லை.
- issue: לְדָוִד என்பதன் உறவு
  choice: “தாவீதுக்கு உரியது” என்று உறவைத் திறந்த நிலையில் வைத்தல்
  alternative: “தாவீதால் எழுதப்பட்டது” என்று ஆசிரியத்துவத்தை மட்டும் உறுதிப்படுத்துதல்
  rationale: எபிரெய לְ பலவகை உறவுகளைக் குறிக்கக்கூடியதால் மூலத்தில் உள்ள உண்மையான பொருள் நெகிழ்வு காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தெளிவற்ற இசைத் தலைப்பு மேற்கோளுக்குள் வைக்கப்பட்டு அடிக்குறிப்பில் அதன் ஐயம் தெரிவிக்கப்பட்டுள்ளது; அறியப்படாத தொழில்நுட்பச் சொல் ஒலிபெயர்க்கப்பட்டுள்ளது.
