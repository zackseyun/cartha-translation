  source_fidelity: 'மூல எபிரெய முன்னுரையின் கூறுகள் அனைத்தும் காக்கப்பட்டுள்ளன: לַמְנַצֵּחַ இசை நிகழ்த்தலை வழிநடத்துபவருக்கான குறிப்பாகவும், עַל இசை/மெட்டைக் குறிக்கும் வகையிலும், தெளிவற்ற יוֹנַת אֵלֶם רְחֹקִים மேற்கோளிடப்பட்ட மெட்டுத் தலைப்பாகவும், לְדָוִד அதன் திறந்த உறவைத் தக்கவைக்கும் வகையிலும், מִכְתָּם ஒலிபெயர்ப்பாகவும், இறுதி வரலாற்றுக் குறிப்பு காலச்சூழலாகவும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘தொலைதூர இடங்களின் மௌனப் புறா’ என்பது ஆங்கில POB-இன் எச்சரிக்கையான நடையைப் பின்பற்றுகிறது; அடிக்குறிப்பு மாற்று புரிதலையும் உறுதியின்மையையும் சரியாகக் குறிக்கிறது.'
