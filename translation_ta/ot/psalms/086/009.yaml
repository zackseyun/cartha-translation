revisions:
- from: நீர் படைத்த எல்லா தேசங்களும் வந்து, ஆண்டவரே, உமக்கு முன்பாகப் பணிந்துகொள்வார்கள்[a]; உமது பெயரை மகிமைப்படுத்துவார்கள்[b].
  to: நீர் படைத்த எல்லாத் தேசங்களும் வந்து, ஆண்டவரே, உமக்கு முன்பாகத் தாழ்ந்து வணங்குவார்கள்[a]; உமது பெயரை மகிமைப்படுத்துவார்கள்[b].
