  yaml_path: translation/ot/psalms/086/009.yaml
  text: All the nations that you have made will come and bow down before you[a], Lord[b], and they will honor your name.
translation:
  language: ta
  text: நீர் படைத்த எல்லாத் தேசங்களும் வந்து, ஆண்டவரே, உமக்கு முன்பாகத் தாழ்ந்து வணங்குவார்கள்[a]; உமது பெயரை மகிமைப்படுத்துவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மை வழிபடுவார்கள்”; எபிரெய வினை மரியாதையுடன் உடலைத் தாழ்த்தி வணங்குவதையும், விரிவான பொருளில் வழிபடுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது பெயருக்கு மரியாதை செலுத்துவார்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: எல்லா தேசங்களும்
  rationale: முழுமையான பொதுப்பரப்பைக் குறிக்கும் כָּל என்பதையும், மக்கள் சமூகங்களைக் குறிக்கும் גּוֹיִם என்பதையும் இயல்பான நவீனத் தமிழில் கூட்டாக வெளிப்படுத்துகிறது; ‘புறஜாதியார்’ என்பது தேவையற்ற இஸ்ரவேல்–இஸ்ரவேலரல்லாதோர் வேறுபாட்டைச் சேர்க்கக்கூடும்.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: நீர் படைத்த
  rationale: עָשִׂיתָ என்பதன் அடிப்படைப் பொருள் ‘செய்தீர்/உண்டாக்கினீர்’; இங்கு தேசங்களைக் கடவுள் உண்டாக்கியவர் என்ற சூழலில் ‘படைத்த’ என்பது சுருக்கமாகவும் இயல்பாகவும் பொருளைத் தருகிறது.
- source_word: יָבֹאוּ
  choice: வந்து
  rationale: எதிர்கால எதிர்பார்ப்பைக் குறிக்கும் வினை; அடுத்த வினையுடன் தமிழில் இயல்பாக இணைக்க ‘வந்து’ எனத் தரப்பட்டு, எதிர்காலம் ‘பணிந்துகொள்வார்கள்’ என்பதில் வெளிப்படுகிறது.
- source_word: וְיִשְׁתַּחֲווּ
  choice: பணிந்துகொள்வார்கள்
  rationale: உடலைத் தாழ்த்தி வணங்குதல் மற்றும் அதிலிருந்து வரும் வழிபாட்டு அர்த்தம் இரண்டையும் தக்கவைக்கிறது; ‘வழிபடுவார்கள்’ என்று மட்டும் மொழிபெயர்ப்பதைவிட மூலத்தின் உடல் செயலைப் பாதுகாக்கிறது.
- source_word: לְפָנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: ‘உமது முகத்திற்கு முன்/உமது சந்நிதியில்’ என்ற எபிரெய வழக்கைத் தெளிவான, மரியாதையான தமிழில் வழங்குகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது கடவுளுக்குரிய மரியாதைத் தலைப்பாகவும், இவ்விடத்தில் நேரடி அழைப்பாகவும் உள்ளது; தமிழ் விளிவடிவான ‘ஆண்டவரே’ இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: וִיכַבְּדוּ לִשְׁמֶךָ
  choice: உமது பெயரை மகிமைப்படுத்துவார்கள்
  rationale: כבד என்பதன் பியேல் வடிவம் ‘கனப்படுத்துதல், மதிப்பளித்தல், மகிமைப்படுத்துதல்’ எனப் பொருள்படும். கடவுளின் பெயருடன் ‘மகிமைப்படுத்துதல்’ இயல்பான தமிழாகவும், அவருடைய வெளிப்படுத்தப்பட்ட தன்மைக்கும் புகழுக்கும் உரிய பெருமையை அளிப்பதையும் குறிக்கிறது.
theological_decisions:
- issue: தேசங்களின் பதிலின் பரப்பு
  choice: கடவுள் படைத்த எல்லா தேசங்களும் எதிர்காலத்தில் வந்து அவருக்கு முன்பாகப் பணிந்து, அவரது பெயரை மகிமைப்படுத்தும் என்ற உலகளாவிய உரை
  alternative: ‘எல்லா’ என்பது ஒவ்வொரு தேசத்தையும் விதிவிலக்கின்றி குறிக்காமல், பல தேசங்களைப் பற்றிய மிகைப்படுத்தப்பட்ட துதிமொழி
  rationale: மூல உரை כָּל גּוֹיִם என்று நேரடியாகக் கூறுகிறது. அதன் உலகளாவிய பரப்பைச் சுருக்காமலும், அது எவ்வாறு நிறைவேறும் என்பதை மொழிபெயர்ப்பில் கூடுதலாக விளக்காமலும் உரை தக்கவைக்கப்படுகிறது.
- issue: אֲדֹנָי என்ற தெய்வீகத் தலைப்பு
  choice: ஆண்டவரே
  alternative: என் ஆண்டவரே; எஜமானரே
  rationale: אֲדֹנָי பயன்பாட்டில் கடவுளுக்குரிய மரியாதைத் தலைப்பாகச் செயல்படுகிறது. ‘ஆண்டவரே’ என்பது அதை ஒலிபெயர்க்காமல் பொருள்பெயர்த்து, சங்கீதத்தின் நேரடி அழைப்பையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையும் கடவுளை நோக்கும் மரியாதைப் பன்மை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. வாக்கிய ஒழுங்கு தமிழில் இயல்பாக மாற்றப்பட்டாலும், ‘எல்லா தேசங்கள்,’ எதிர்கால வருகை, பணிதல், தெய்வீகத் தலைப்பு, பெயரை மகிமைப்படுத்துதல் ஆகிய மூலக் கூறுகள் அனைத்தும் பாதுகாக்கப்பட்டுள்ளன.
