  register: நவீன நிலையான தமிழில் இயல்பாகவும் சங்கீதத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. இறைவனை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; ‘ஷியோல்’ என்ற மூல உலகக் கருத்து குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
