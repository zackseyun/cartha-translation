  yaml_path: translation/ot/psalms/086/013.yaml
  text: For your steadfast love toward me is great[a], and you have delivered my soul from the lowest Sheol.
translation:
  language: ta
  text: ஏனெனில், என்மீது உமது மாறாத அன்பு பெரிது; ஷியோலின் அடியாழத்திலிருந்து[a] என் உயிரை மீட்டீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மிகத் தாழ்ந்த இறந்தோரின் உலகத்திலிருந்து” அல்லது “கீழேயுள்ள கல்லறையிலிருந்து.” “ஷியோல்” என்பது இறந்தோரின் உலகைக் குறிக்கும் எபிரெயச் சொல்.
    reason: שְׁאוֹל תַּחְתִּיָּה என்பதன் பண்டைய கீழுலகப் படிமத்தையும் அதன் சாத்தியமான பொருள் மாற்றுகளையும் விளக்குகிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புகழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: חַסְדְּךָ
  choice: உமது மாறாத அன்பு
  rationale: חֶסֶד என்பதிலுள்ள நிலைத்த, உறவுசார் அன்பையும் உண்மைத்தன்மையையும், ஒரு குறுகிய ‘இரக்கம்’ என்ற பொருளுக்குள் அடக்காமல் வெளிப்படுத்துகிறது.
- source_word: גָּדוֹל עָלָי
  choice: என்மீது ... பெரிது
  rationale: அன்பு சங்கீதக்காரரை நோக்கி அல்லது அவர்மீது செலுத்தப்படுவதையும் அதன் மகத்துவத்தையும் மூலமொழிக்கு நெருக்கமாகக் காக்கிறது.
- source_word: וְהִצַּלְתָּ
  choice: மீட்டீர்
  rationale: נצל என்பதன் விடுவித்தல் அல்லது காப்பாற்றுதல் என்ற செயற்பொருளையும் நிறைவுற்ற செயலையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: இச்சூழலில் נֶפֶשׁ என்பது மனிதரின் உயிரையோ அவரையே முழுமையாகவோ குறிக்கலாம். ‘உயிர்’ என்பது மரணம் மற்றும் ஷியோலிலிருந்து மீட்கப்படுதல் என்ற சூழலுக்கு இயல்பாகப் பொருந்துகிறது; பின்னைய தத்துவப் பொருளை தேவையின்றி திணிப்பதையும் தவிர்க்கிறது.
- source_word: מִשְּׁאוֹל תַּחְתִּיָּה
  choice: ஷியோலின் அடியாழத்திலிருந்து
  rationale: שְׁאוֹל என்ற எபிரெயக் கருத்தை ஒலிபெயர்ப்பால் காத்து, תַּחְתִּיָּה குறிக்கும் மிகக் கீழான அல்லது ஆழமான இடப்படிமத்தை இயல்பான தமிழில் ‘அடியாழம்’ என வெளிப்படுத்துகிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதைக் குறிப்பிட்ட பிற்கால நரகம் பற்றிய கோட்பாட்டுடன் ஒன்றாக்காமல் மொழிபெயர்த்தல்
  choice: ஷியோல்
  alternative: இறந்தோரின் உலகம்; கீழேயுள்ள கல்லறை
  rationale: ஒலிபெயர்ப்பு, மரணம் மற்றும் கீழுலகம் சார்ந்த பண்டைய எபிரெயப் படிமத்தின் தெளிவின்மையைப் பாதுகாக்கிறது. ‘நரகம்’ என்று மொழிபெயர்ப்பது மூலச்சொல்லைவிட அதிகமான பிற்காலக் கோட்பாட்டுத் துல்லியத்தைச் சேர்க்கக்கூடும்; விளக்கக் குறிப்பில் பொருள் மாற்றுகள் தரப்படுகின்றன.
