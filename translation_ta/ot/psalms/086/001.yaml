  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד הַטֵּֽה יְהוָ֣ה אָזְנְ/ךָ֣ עֲנֵ֑/נִי כִּֽי עָנִ֖י וְ/אֶבְי֣וֹן אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/001.yaml
  text: A prayer of David. Incline your ear[a], O Yahweh, and answer me, for I am poor and needy.
translation:
  language: ta
  text: 'தாவீதின் ஜெபம்.


    யாவே, உமது செவியைச் சாய்த்து, எனக்குப் பதிலளியும்; ஏனெனில் நான் ஏழையாகவும் தேவையுள்ளவனாகவும் இருக்கிறேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் துன்புற்றவனாகவும் தேவையுள்ளவனாகவும் இருக்கிறேன்.” எபிரெயச் சொல் עָנִי ஏழை, துன்புற்றவர், அல்லது தாழ்த்தப்பட்டவர் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: விண்ணப்பம்
  rationale: சங்கீதத் தலைப்பில் வரும் தனிப்பட்ட வேண்டுதல் அல்லது மன்றாட்டைக் குறிக்கும் வகைப்பெயராக இயல்பாக உள்ளது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: லְ முன்னொட்டு ஆசிரியத்துவம், உடைமை, அல்லது தொடர்பைக் குறிக்கக்கூடும்; “தாவீதின்” என்பது அதனை மிகையாகக் குறிப்பாக்காமல் பாதுகாக்கிறது.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: உமது செவியைச் சாய்த்து
  rationale: கவனித்துக் கேட்பதைக் குறிக்கும் எபிரெய உருவகத்தை இயல்பான தமிழ் நடையில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: עֲנֵנִי
  choice: எனக்குப் பதிலளியும்
  rationale: ஜெபச் சூழலில் ענה என்பதன் இயல்பான பொருள் “பதிலளி” என்பதாகும்; மரியாதை வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: விண்ணப்பத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: עָנִי
  choice: ஏழை
  rationale: வறுமை என்ற நேரடியான பொருளைத் தருகிறது; துன்புற்றவன் என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְאֶבְיוֹן
  choice: தேவையுள்ளவன்
  rationale: உதவி அல்லது ஆதரவு தேவைப்படும் நிலையைத் தெரிவித்து, עָנִי என்பதுடன் உள்ள இணைநிலையைப் பாதுகாக்கிறது.
- source_word: אָנִי
  choice: நான் ... இருக்கிறேன்
  rationale: எபிரெய பெயரெச்ச வாக்கியத்தில் வெளிப்படையாக இல்லாத இணைப்புவினை தமிழில் இயல்புக்காக வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், பட்டப்பெயரைப் பதிலிடாமல் ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான ஜெப நடையும், இறைவனை நோக்கிய மரியாதைப் பன்மை வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் செவி உருவகமும் காரணவாக்கியமும் தக்கவைக்கப்பட்டுள்ளன.
