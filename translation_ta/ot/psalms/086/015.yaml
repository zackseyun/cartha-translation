revisions:
- from: ஆனால் ஆண்டவரே, நீர் இரக்கமும் கிருபையும் உள்ள இறைவன்; கோபிக்கத் தாமதிப்பவர்; பேரன்பும் உண்மைத்தன்மையும்[a] நிறைந்தவர்.
  to: ஆனால், ஆண்டவரே, நீர் இரக்கமும் அருளும் கொண்ட இறைவன், கோபிக்கத் தாமதிப்பவர், மாறாத அன்பிலும் நம்பகத்தன்மையிலும்[a] மிகுந்தவர்.
  rationale: The revision keeps the source’s emphatic ‘But you,’ reverential direct address, and compact chain of attributes. It improves the rendering of חֶסֶד as ‘மாறாத அன்பு’ and of אֱמֶת as ‘நம்பகத்தன்மை,’ while retaining the legitimate alternative ‘உண்மை’ in a footnote. No disputed textual issue requires additional qualification.
