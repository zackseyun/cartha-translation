  text: וְ/אַתָּ֣ה אֲ֭דֹנָ/י אֵל רַח֣וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַ֝פַּ֗יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/015.yaml
  text: But you[a], Lord, are a compassionate and gracious God, slow to anger and abounding in steadfast love and faithfulness.
translation:
  language: ta
  text: ஆனால், ஆண்டவரே, நீர் இரக்கமும் அருளும் கொண்ட இறைவன், கோபிக்கத் தாமதிப்பவர், மாறாத அன்பிலும் நம்பகத்தன்மையிலும்[a] மிகுந்தவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உண்மையிலும்.’ இந்த உடன்படிக்கைச் சூத்திரத்தில் எபிரெயச் சொல் வெறும் கருத்தியல் உண்மையைவிட நம்பகத்தன்மை அல்லது விசுவாசத்தன்மை என்ற பொருளை அடிக்கடி தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: ஆனால் ... நீர்
  rationale: முந்தைய சூழலுடன் உள்ள மாறுபாட்டை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது; தனிப்பெயர்ச்சொல்லான ‘நீர்’ எபிரெய உரையின் வலியுறுத்தலைப் பேணுகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது இறைவனுக்குரிய மரியாதைத் தலைப்பு; விளிப்புமையிலுள்ள ‘ஆண்டவரே’ தமிழ் வாக்கியத்தில் இயல்பாக அமைகிறது.
- source_word: אֵל
  choice: இறைவன்
  rationale: இங்கு אֵל ஆண்டவரை இறைவனாக அடையாளப்படுத்துகிறது; ‘வல்லமையுள்ள இறைவன்’ என மொழிபெயர்ப்பது மூலத்தில் வெளிப்படையாக இல்லாத நுண்பொருளைச் சேர்க்கும்.
- source_word: רַחוּם וְ/חַנּוּן
  choice: இரக்கமும் கிருபையும் உள்ள
  rationale: 'இணைந்துள்ள இரு பண்புகளையும் வேறுபடுத்திப் பேணுகிறது: רַחוּם ஆழ்ந்த இரக்கத்தையும் חַנּוּן அருள்மிகு தயவையும் குறிக்கிறது.'
- source_word: אֶרֶךְ אַפַּיִם
  choice: கோபிக்கத் தாமதிப்பவர்
  rationale: ‘மூக்குகளில் நீண்டவர்’ என்ற எபிரெய மரபுத்தொடரின் பொருள், தூண்டுதலுக்கு உடனே கோபப்படாதவர் என்பதாகும்; இந்தத் தமிழ் வடிவம் அதன் உருவகப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: וְ/רַב חֶסֶד
  choice: பேரன்பும் ... நிறைந்தவர்
  rationale: רַב மிகுதியைக் குறிக்கிறது; חֶסֶד நிலைத்த, உடன்படிக்கை சார்ந்த அன்பு, இரக்கம், பற்றுறுதி ஆகியவற்றை உள்ளடக்குகிறது. ‘பேரன்பு’ சுருக்கமாகவும் இயல்பாகவும் அதன் மையத்தை வெளிப்படுத்துகிறது.
- source_word: וֶ/אֱמֶת
  choice: உண்மைத்தன்மை
  rationale: חֶסֶד உடன் வரும் இந்த உடன்படிக்கைச் சூத்திரத்தில் אֱמֶת வெறும் கருத்தியல் ‘உண்மை’ என்பதைவிட நம்பகத்தன்மை மற்றும் மாறாத பற்றுறுதியைக் குறிக்கிறது; மாற்று மொழிபெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: யாத்திராகமம் 34:6-ஐ எதிரொலிக்கும் உடன்படிக்கைச் சூத்திரத்தின் மொழியாக்கம்
  choice: ‘இரக்கமும் கிருபையும் உள்ள ... பேரன்பும் உண்மைத்தன்மையும் நிறைந்தவர்’ என்ற அணுகத்தக்க, மூலச்சார்ந்த சொற்றொடரைப் பயன்படுத்துதல்
  alternative: ‘இரக்கமும் அருளும் உள்ள ... கிருபையும் உண்மையும் மிகுந்தவர்’ போன்ற மரபுவழிச் சொற்களைப் பயன்படுத்துதல்
  rationale: அடிப்படையான இறைத் தன்னறிவிப்பின் எதிரொலியைப் பேணுவதோடு, இன்றைய தமிழ் வாசகருக்குத் தெளிவான மொழி பயன்படுத்தப்படுகிறது. ‘உண்மைத்தன்மை’ என்பது இச்சூழலில் நம்பகத்தன்மை மற்றும் பற்றுறுதி ஆகிய உறவுசார் நுண்பொருளை ‘உண்மை’ என்பதைவிடத் தெளிவாக வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் மரியாதையும் கவித்துவக் கண்ணியமும் பேணப்பட்டுள்ளன. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் இணை அமைப்பைத் தெளிவாக்க அரைப்புள்ளிகள் இடப்பட்டுள்ளன.
