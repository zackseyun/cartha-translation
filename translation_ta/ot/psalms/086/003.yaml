source:
  edition: WLC
  text: חָנֵּ֥/נִי אֲדֹנָ֑/י כִּ֥י אֵלֶ֥י/ךָ אֶ֝קְרָ֗א כָּל הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/003.yaml
  text: Be gracious to me[a], Lord, for I call to you all day long.
translation:
  language: ta
  text: ஆண்டவரே, எனக்கு அருள்காட்டும்[a]; ஏனெனில் நாள் முழுவதும் உம்மை நோக்கிக் கூப்பிடுகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு இரங்கும்.” எபிரெய வினைச்சொல் அருளான தயவை அல்லது இரக்கத்தைக் கோரும் வேண்டுதலை வெளிப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: எனக்கு அருள்காட்டும்
  rationale: חנן என்பதன் கட்டளை வடிவம், அருளான தயவு அல்லது இரக்கம் காட்டும்படி வேண்டுகிறது. “அருள்காட்டும்” என்பது அதன் அருள்/தயவு சார்ந்த பொருளை இயல்பான தமிழ் இறைவேண்டல் நடையில் காக்கிறது; “எனக்கு இரங்கும்” என்பதும் சூழலுக்கேற்ற மாற்றாகும்.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது கடவுளைக் குறிக்கும் אֲדֹנָי என்னும் தெய்வீகப் பட்டம். தமிழில் இறைவேண்டலுக்குப் பொருத்தமான அழைப்புவடிவமாக “ஆண்டவரே” பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துவதால், காரணத் தொடர்பைத் தெளிவாகக் காட்டும் “ஏனெனில்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֵלֶיךָ
  choice: உம்மை நோக்கி
  rationale: אֶל என்ற முன்னிடைச்சொல் அழைக்கப்படும் நபரை நோக்கிய திசையைச் சுட்டுகிறது. “உம்மை நோக்கி” என்பது இந்தத் திசைநோக்குப் பொருளைக் காக்கும் இயல்பான தமிழ்.
- source_word: אֶקְרָא
  choice: கூப்பிடுகிறேன்
  rationale: קרא என்பது “அழை/கூப்பிடு” என்று பொருள்படும். இங்கு ஜெபத்தில் கடவுளை அழைப்பதை இயல்பாக வெளிப்படுத்த “கூப்பிடுகிறேன்” பயன்படுத்தப்பட்டுள்ளது; மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் தீவிரத்தைச் சேர்க்கவில்லை.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: சொற்றொடரின் நேரடிப் பொருள் “நாள் முழுவதும்.” இது நீடித்த அல்லது மீண்டும் மீண்டும் செய்யப்படும் வேண்டுதலை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֲדֹנָי என்னும் தெய்வீகப் பட்டத்தை மொழிபெயர்த்தல்
  choice: ஆண்டவரே
  alternative: என் ஆண்டவரே; எஜமானரே
  rationale: வசனம் கடவுளை வழக்கமான தெய்வீகப் பட்டத்தால் நேரடியாக அழைக்கிறது. “ஆண்டவரே” என்பது பட்டத்தை மொழிபெயர்த்து, தமிழ் ஜெப நடையைப் பேணுகிறது; “என்” என்பதைத் தனியாகச் சேர்ப்பது இப்பயன்பாட்டில் தேவையற்ற மிகை மொழிபெயர்ப்பாக அமையலாம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் ஜெபத்திற்குரிய கண்ணியமும் கொண்ட நடை. கடவுளை நோக்கி “உம்மை” என்ற மரியாதை ஒருமை வடிவமும், வேண்டுதலில் “அருள்காட்டும்” என்ற வழக்கமான உயர்நடை வடிவமும் பயன்படுத்தப்பட்டுள்ளன.
