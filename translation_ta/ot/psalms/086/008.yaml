  text: אֵין כָּמ֖וֹ/ךָ בָ/אֱלֹהִ֥ים אֲדֹנָ֗/י וְ/אֵ֣ין כְּֽ/מַעֲשֶֽׂי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/008.yaml
  text: There is none like you among the gods[a], Lord[b], and there are no works like yours.
translation:
  language: ta
  text: ஆண்டவரே, தெய்வங்களுள்[a] உம்மைப் போன்றவர் எவரும் இல்லை; உமது செயல்களைப் போன்றவை[b] எதுவும் இல்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானுலக உயிரினங்களுள்.” எபிரெயத்தில் நேரடியாக “தெய்வங்களுள்” என்று உள்ளது; தெய்வீகமானவை எனக் கூறப்படும் எல்லா வல்லமைகளுக்கும் மேலாக ஆண்டவர் ஒப்பற்றவர் என்பதை அறிவிக்கும் பொதுவான வேதாகமச் சொல்லாட்சி இது.
    reason: alternative_reading
  - marker: b
    text: “செயல்கள்” என்பதற்கு “செய்கைகள்” அல்லது “நடப்புகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: எவரும் இல்லை / எவையும் இல்லை
  rationale: இருத்தலை மறுக்கும் எபிரெயச் சொல்லை, முதல் அடியில் நபரையும் இரண்டாம் அடியில் செயல்களையும் சார்ந்த இயல்பான தமிழில் முழுமையான மறுப்பாக வழங்குகிறது.
- source_word: כָּמוֹךָ
  choice: உம்மைப் போன்றவர்
  rationale: ஒப்புமையைக் குறிக்கும் முன்னொட்டையும் இரண்டாம் நபர் ஒருமை ஆண்பால் பின்னொட்டையும் நேரடியாகவும் மரியாதையான இறைமொழி நடையிலும் தருகிறது.
- source_word: בָאֱלֹהִים
  choice: தெய்வங்களுள்
  rationale: ב முன்னொட்டுடன் வரும் אֱלֹהִים என்பதன் பன்மை வடிவைத் தக்கவைத்து, எபிரெயக் கவிதையின் ஒப்பீட்டையும் இறைவனின் ஒப்பற்ற தன்மையையும் தேவையின்றி மென்மைப்படுத்தாமல் வெளிப்படுத்துகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: விளிவேற்றுமையில் வரும் இறைப்பட்டத்தைத் தமிழின் இயல்பான, கண்ணியமான செப மொழியில் வழங்குகிறது.
- source_word: וְאֵין
  choice: எவையும் இல்லை
  rationale: இணைப்புச் சொல்லுக்குப் பின் வரும் இருத்தல் மறுப்பை, பன்மைப் பொருளான செயல்களோடு இயல்பாக இணைக்கிறது; அரைப்புள்ளி எபிரெய இணைநிலைக் கவிதையின் இரு அடிகளையும் தெளிவாகச் சார்புபடுத்துகிறது.
- source_word: כְמַעֲשֶׂיךָ
  choice: உமது செயல்களுக்கு ஒப்பானவை
  rationale: מַעֲשֶׂה என்பதன் பரந்த பொருளான செயல், deed, act ஆகியவற்றை உள்ளடக்கி, ஒப்புமை முன்னொட்டின் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: “தெய்வங்களுள்” என்பதன் பொருள்
  choice: எபிரெய மூலத்தின் பன்மையைத் தக்கவைத்து, எல்லா தெய்வங்களோடும் அல்லது தெய்வீக வல்லமைகளோடும் ஒப்பிடுகையில் ஆண்டவர் ஒப்பற்றவர் என்ற கவிதைக் கூற்றாக மொழிபெயர்த்தல்.
  alternative: “வானுலக உயிர்களுள்” என்று விளக்கமாக மொழிபெயர்த்தல், அல்லது “உம்மைப் போன்ற வேறு கடவுள் இல்லை” என்று ஒருமைப்படுத்திப் பொழிப்புரை செய்தல்.
  rationale: மூலத்தில் אֱלֹהִים தெளிவாகப் பன்மையில் உள்ளது. அதை நேரடியாகத் தருவது பலதெய்வக் கொள்கையை உறுதிப்படுத்தாமல், வசனத்தின் உண்மையான மொழியியல் மற்றும் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், செபத்திற்கும் கவிதைப் புகழ்ச்சிக்கும் ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நேரடியாக அழைப்பதால் “ஆண்டவரே,” என்றும், மரியாதை ஒருமையாக “உம்மை/உமது” என்றும் வழங்கப்பட்டுள்ளது. எபிரெய இணைநிலையை அரைப்புள்ளியால் தெளிவாகப் பாதுகாத்துள்ளோம்.
