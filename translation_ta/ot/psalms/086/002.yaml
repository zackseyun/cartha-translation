  text: שָֽׁמְרָ֣/ה נַפְשִׁ/י֮ כִּֽי חָסִ֪יד אָ֥נִי הוֹשַׁ֣ע עַ֭בְדְּ/ךָ אַתָּ֣ה אֱלֹהַ֑/י הַ/בּוֹטֵ֥חַ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/002.yaml
  text: Guard my life[a], for I am faithful; save your servant, my God[b], who trusts in you.
translation:
  language: ta
  text: என் உயிரை[a] காத்தருளும்; ஏனெனில் நான் உமக்குப் பற்றுறுதியுள்ளவன்.[b] என் இறைவனே, உம்மை நம்பியிருக்கும் உமது ஊழியனைக் காப்பாற்றும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘என் நெஃபெஷ்’; இங்கு ‘என் உயிரை’ அல்லது ‘என்னை’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘பற்றுறுதியுள்ளவன்’ என்பதற்கு ‘பக்தியுள்ளவன்’ அல்லது ‘உண்மையுள்ளவன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் உடன்படிக்கைக்கு உண்மையாய் இருக்கும் பற்றுறுதியைக் குறிக்கிறது; பாவமற்ற நிறைவைக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרָה
  choice: காத்தருளும்
  rationale: கடவுளிடம் ஏறெடுக்கப்படும் பாதுகாப்புக்கான வேண்டுகோளை இயல்பான, மரியாதையான தமிழில் தருகிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: இச்சூழலில் נֶפֶשׁ என்பது உடலிலிருந்து வேறான ‘ஆத்துமா’ என்பதை முதன்மையாகக் குறிக்காமல், சங்கீதக்காரரின் உயிரையோ முழு ஆளுமையையோ குறிக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: חָסִיד
  choice: உமக்கு உண்மையாய் இருப்பவன்
  rationale: உடன்படிக்கை சார்ந்த பற்றுறுதியையும் பக்தியையும் தெரிவிக்கிறது; பாவமற்ற பரிசுத்தத்தைக் கோருவதாகத் தவறாக உணர்த்தாது.
- source_word: הוֹשַׁע
  choice: காப்பாற்றும்
  rationale: உடனடியான ஆபத்திலிருந்து விடுவிக்க வேண்டிய விண்ணப்பத்தையும், ‘இரட்சித்தல்’ என்ற விரிந்த பொருளையும் தாங்கக்கூடிய இயல்பான சொல்.
- source_word: עַבְדְּךָ
  choice: உமது ஊழியன்
  rationale: கடவுளுக்கு முன்பான தாழ்மையான உறவுநிலையைத் தமிழில் மரியாதையாகவும் வழக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: אַתָּה אֱלֹהַי
  choice: என் இறைவனே
  rationale: தனிப்பட்ட உறவைக் கொண்ட நேரடி அழைப்பாக இயல்பான தமிழில் வழங்குகிறது; אַתָּה தரும் வலியுறுத்தல் அழைப்பின் சூழலில் உட்பொருளாக உள்ளது.
- source_word: הַבּוֹטֵחַ אֵלֶיךָ
  choice: உம்மை நம்பியிருக்கும்
  rationale: தொடர்ந்த நம்பிக்கையைக் குறிக்கும் எபிரெயப் பங்கேற்பு வடிவத்தைப் பாதுகாத்து, ‘உமது ஊழியன்’ என்பதைக் குறிப்பதாகத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: חָסִיד என்ற சொல்லால் சங்கீதக்காரர் தன்னை விவரிப்பதன் பொருள்
  choice: கடவுளுக்கு உண்மையாய், பற்றுறுதியுடன் இருப்பதாக அவர் கூறுகிறார்
  alternative: நான் பரிசுத்தமானவன் / பாவமற்றவன்
  rationale: இந்தச் சொல் இங்கு பாவமற்ற நிறைவையோ இரட்சிப்பைப் பெற்றுத்தரும் தகுதியையோ வலியுறுத்தவில்லை. கடவுளுடனான உறவில் உள்ள உண்மையையும் பற்றுறுதியையும் முன்வைத்தபடியே, தன்னைக் காப்பாற்றும்படி அவர் கடவுளிடம் மன்றாடும் இறையியல் இழுவையை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்களுக்குப் புரியும் மரியாதையான ஜெபநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கி ‘உம்/நீர்’ மரியாதை வடிவங்களும், வேண்டுகோள்களில் ‘காத்தருளும்/காப்பாற்றும்’ என்பனவும் பயன்படுத்தப்பட்டுள்ளன.
