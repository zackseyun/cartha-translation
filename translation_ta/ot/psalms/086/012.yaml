lexical_decisions:
- source_word: אוֹדְךָ
  choice: உம்மைப் போற்றுவேன்
  rationale: ידה என்பதன் ஹிபில் வடிவம் நன்றி செலுத்துதல் அல்லது துதித்தல்/போற்றுதல் என்ற பொருள்களைக் கொள்ளலாம். கடவுளை நேரடியாக நோக்கிப் பேசும் வழிபாட்டுச் சூழலிலும், அவரது பெயரை மகிமைப்படுத்துவதுடன் இணைந்திருப்பதாலும், ‘போற்றுவேன்’ இங்கு இயல்பான தேர்வு. எபிரெய நிறைவுறா வினைவடிவத்தின் உறுதிமொழித் தன்மையை எதிர்கால வடிவம் வெளிப்படுத்துகிறது.
- source_word: אֲדֹנָי אֱלֹהַי
  choice: என் ஆண்டவராகிய கடவுளே
  rationale: இரண்டு இறைமுறை அழைப்புகளையும் முதலாம் நபர் உரிமைத் தொடர்பையும் தமிழில் இயல்பான நேரடி அழைப்பாகப் பாதுகாக்கிறது. ‘ஆகிய’ என்பது ஆண்டவரும் கடவுளும் ஒரே அழைக்கப்படுபவரைக் குறிக்கின்றனர் என்பதைத் தெளிவாக்குகிறது.
- source_word: בְּכָל לְבָבִי
  choice: என் முழு இதயத்தோடும்
  rationale: பிளவுபடாத முழுமையான உள்ளார்ந்த அர்ப்பணிப்பைக் குறிக்கும் எபிரெய உருவகத்தைத் தக்கவைத்துக்கொண்டு, நவீனத் தமிழில் இயல்பாக ஒலிக்கிறது.
- source_word: וַאֲכַבְּדָה
  choice: மகிமைப்படுத்துவேன்
  rationale: כבד என்பதன் பியேல் வடிவம் கனப்படுத்துதல் அல்லது மகிமைப்படுத்துதல் எனப் பொருள்படும். ‘உமது பெயரை’ என்பதுடன் வரும் வழிபாட்டுச் சூழலில் ‘மகிமைப்படுத்துவேன்’ பொருத்தமான உயர்நடைத் தேர்வு.
- source_word: שִׁמְךָ
  choice: உமது பெயரை
  rationale: ‘பெயர்’ என்பது வெளிப்படுத்தப்பட்ட பண்பையும் புகழையும் சுட்டலாம்; அந்த செறிவான எபிரெய உருவகத்தை விளக்கவுரையாக்காமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த நிரந்தரத்தைக் குறிக்கும் சொல்லை வழிபாட்டு உறுதிமொழிக்கு ஏற்ற, தெளிவான நவீனத் தமிழில் வழங்குகிறது.
theological_decisions:
- issue: אֲדֹנָי אֱלֹהַי என்ற இறை அழைப்பின் மொழிபெயர்ப்பு
  choice: என் ஆண்டவராகிய கடவுளே
  alternative: ஆண்டவரே, என் கடவுளே
  rationale: தலைப்புகள் இரண்டையும் தனிப்பட்ட உறவைக் காட்டும் பின்னொட்டையும் காக்கிறது. மாற்று மொழிபெயர்ப்பு இரட்டை விளிப்பாக ஒலிக்கலாம்; தேர்ந்த வடிவம் இரண்டு சொற்களும் ஒரே இறை அழைப்பை அமைப்பதை நவீனத் தமிழில் இயல்பாகக் காட்டுகிறது.
- issue: ידה என்ற வினையின் வழிபாட்டுச் சூழலிலான பொருள்
  choice: போற்றுவேன்
  alternative: நன்றி செலுத்துவேன்
  rationale: எபிரெயச் சொல் இரு பொருள்களையும் ஏற்கக்கூடும். அடுத்ததாக ‘உமது பெயரை மகிமைப்படுத்துவேன்’ வருவதால் போற்றுதல் இச்சூழலில் முதன்மையாகத் தேர்ந்தெடுக்கப்பட்டது; நன்றியறிதல் என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: மரியாதைமிக்க நவீன நிலையான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய உரையில் ‘உம்/உமது’ வடிவங்கள் கையாளப்பட்டுள்ளன. செய்யுளின் இரண்டு இணையான உறுதிமொழிகளும், ‘இதயம்’ மற்றும் ‘பெயர்’ என்ற எபிரெய உருவகங்களும் தக்கவைக்கப்பட்டுள்ளன.
