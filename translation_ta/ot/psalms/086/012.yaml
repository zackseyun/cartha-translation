  yaml_path: translation/ot/psalms/086/012.yaml
  text: I will praise you[a], Lord my God, with all my heart, and I will glorify your name forever.
translation:
  language: ta
  text: ஆண்டவரே, என் கடவுளே, என் முழு இதயத்தோடும் உம்மைப் போற்றுவேன்[a]; உமது பெயரை என்றென்றும் மகிமைப்படுத்துவேன்.
  philosophy: optimal-equivalence
