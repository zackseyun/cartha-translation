source:
  edition: WLC
  text: פְּנֵ֥ה אֵלַ֗/י וְ/חָ֫נֵּ֥/נִי תְּנָֽ/ה עֻזְּ/ךָ֥ לְ/עַבְדֶּ֑/ךָ וְ֝/הוֹשִׁ֗יעָ/ה לְ/בֶן אֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/016.yaml
  text: Turn to me and be gracious to me[a]; give your strength to your servant[b], and save the son of your maidservant.
translation:
  language: ta
  text: என்னை நோக்கித் திரும்பி, எனக்கு அருள்கூரும்; உமது ஊழியனுக்கு உமது வலிமையைத் தாரும்; உமது பணிப்பெண்ணின் மகனைக் காப்பாற்றும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: என் பக்கம் திரும்பி
  rationale: פנה என்ற கட்டளைச் சொல், சங்கீதக்காரரை நோக்கிக் கவனம் செலுத்துமாறு தேவனிடம் செய்யப்படும் வேண்டுகோள். ‘என் பக்கம் திரும்பி’ என்பது திசையையும் உறவுசார் வேண்டுதலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְחָנֵּנִי
  choice: எனக்கு அருள்கூரும்
  rationale: חנן என்பது இரக்கம் மட்டுமல்ல, அருளும் தயவும் காட்டுவதைக் குறிக்கிறது. ‘அருள்கூரும்’ என்பது செறிவான, மரியாதையான தமிழ் வேண்டுதல்.
- source_word: תְּנָה עֻזְּךָ
  choice: உமது வலிமையைத் தாரும்
  rationale: נתן என்பதன் நேரடியான பொருள் ‘கொடு’; עֹז என்பது வலிமை அல்லது ஆற்றல். வேண்டுதல் நடைக்கு ஏற்றவாறு ‘தாரும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְעַבְדֶּךָ
  choice: உமது ஊழியனுக்கு
  rationale: עבד அடிமை அல்லது ஊழியன் எனப் பொருள்படலாம். இச்சங்கீத வேண்டுதலில் தாழ்மையான கீழ்ப்படிதலும் தேவனைச் சார்ந்திருப்பதும் முன்னிலையில் இருப்பதால் ‘ஊழியன்’ இயல்பாகப் பொருந்துகிறது.
- source_word: וְהוֹשִׁיעָה
  choice: காப்பாற்றும்
  rationale: ישע மீட்பது, விடுவிப்பது, காப்பாற்றுவது ஆகிய பரந்த பொருள்களை உடையது. இங்கு ஆபத்திலிருந்து காக்கும்படி செய்யப்படும் நேரடி வேண்டுதலை ‘காப்பாற்றும்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְבֶן אֲמָתֶךָ
  choice: உமது பணிப்பெண்ணின் மகனை
  rationale: இந்த எபிரெயச் சொற்றொடர் நேரடியாக ‘உமது பெண் ஊழியரின் மகன்’ என்பதைக் குறிக்கிறது. ‘பணிப்பெண்’ பாலினத்தையும் தாழ்மையான பணிநிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: עבד / אמה என்னும் தாழ்மையான சுயஅடையாளச் சொற்கள்
  choice: ‘ஊழியன்’ மற்றும் ‘பணிப்பெண்’ என்று வேறுபடுத்தி மொழிபெயர்த்தல்
  alternative: ‘அடிமை’ மற்றும் ‘அடிமைப் பெண்’
  rationale: மூலத்தில் ஆண் ஊழியனுக்கும் பெண் பணியாளருக்கும் தனித்த சொற்கள் உள்ளன. அவற்றின் வேறுபாட்டைக் காத்தபடியே, இவ்வசனத்தின் ஜெபநடையில் முன்னிலையிலுள்ள தாழ்மையையும் தேவனைச் சார்ந்திருப்பதையும் இயல்பான தமிழில் தெரிவிக்க இச்சொற்கள் தேர்ந்தெடுக்கப்பட்டன. சமூக அடிமைத்தனத்தை தேவையின்றி முன்னிறுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத ஜெபத்திற்குரிய கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’, ‘தாரும்’, ‘காப்பாற்றும்’ ஆகிய வடிவங்கள் மரியாதையையும் கவிதைநடையையும் காக்கின்றன; மொழி தேவையற்ற பழமையாக்கமின்றி வாசிக்க எளிதாக உள்ளது.
