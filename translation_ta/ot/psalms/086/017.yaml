source:
  edition: WLC
  text: עֲשֵֽׂה עִמִּ֥/י א֗וֹת לְ/ט֫וֹבָ֥ה וְ/יִרְא֣וּ שֹׂנְאַ֣/י וְ/יֵבֹ֑שׁוּ כִּֽי אַתָּ֥ה יְ֝הוָ֗ה עֲזַרְתַּ֥/נִי וְ/נִחַמְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/017.yaml
  text: Show me a sign for good[a], so that those who hate me may see and be put to shame, because you, O Yahweh, have helped me and comforted me.
translation:
  language: ta
  text: நன்மைக்கான ஓர் அடையாளத்தை எனக்குக் காட்டும்[a]; என்னை வெறுப்பவர்கள் அதைக் கண்டு வெட்கமடையட்டும். ஏனெனில், யாவே, நீர் எனக்கு உதவியிருக்கிறீர்; எனக்கு ஆறுதலளித்திருக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னுடன் நன்மைக்கான ஓர் அடையாளத்தைச் செய்யும்.” எபிரெயச் சொற்றொடர் சொற்சொல்லாக, “என்னுடன் நன்மைக்காக ஓர் அடையாளத்தைச் செய்” என உள்ளது; இது கடவுளுடைய நன்மை அல்லது தயவைக் காட்டும் அடையாளத்தைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה עִמִּי
  choice: எனக்குக் காட்டும்
  rationale: எபிரெய மொழியில் சொற்சொல்லாக ‘என்னுடன் செய்/உருவாக்கு’ என்று இருந்தாலும், אוֹת (‘அடையாளம்’) என்பதுடன் வரும் இச்சொற்றொடர், சங்கீதக்காரருக்காக அல்லது அவரது வாழ்வில் கடவுள் காணக்கூடிய அடையாளம் ஒன்றை அளிக்க வேண்டும் என்ற வேண்டுதலைக் குறிக்கிறது. இயல்பான நவீன தமிழில் ‘எனக்குக் காட்டும்’ என்பது அந்தப் பொருளையும் கட்டளை வேண்டுதலின் வலிமையையும் தருகிறது; சொற்சொல் அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אוֹת לְטוֹבָה
  choice: நன்மைக்கான ஓர் அடையாளம்
  rationale: אוֹת என்பது ‘அடையாளம்’; לְטוֹבָה என்பது நன்மை, நலன் அல்லது தயவைக் குறிக்கக்கூடும். ‘நன்மைக்கான’ என்பது எபிரெயச் சொற்றொடரின் பரப்பை மிகையாகக் குறுக்காமல் தமிழில் தெளிவாக உள்ளது.
- source_word: וְיִרְאוּ
  choice: அதைக் கண்டு
  rationale: முந்தைய வேண்டுதலின் நோக்கம் அல்லது விளைவை இந்த வினை வெளிப்படுத்துகிறது. தமிழில் ‘அதைக் கண்டு’ என்று சொல்வது அடையாளமே அவர்கள் காண்பது என்பதை இயல்பாகத் தெளிவாக்குகிறது.
- source_word: שֹׂנְאַי
  choice: என்னை வெறுப்பவர்கள்
  rationale: இது சொற்சொல்லாக ‘என்னை வெறுப்பவர்கள்’ என்பதாகும். ‘என் பகைவர்கள்’ என்பதைவிட தனிப்பட்ட வெறுப்பைத் துல்லியமாகப் பாதுகாக்கிறது.
- source_word: וְיֵבֹשׁוּ
  choice: வெட்கமடையட்டும்
  rationale: בוש இங்கு தோல்வியால் வெட்கத்திற்கும் அவமானத்திற்கும் உள்ளாவதைக் குறிக்கிறது. ‘வெட்கமடையட்டும்’ என்பது விளைவு/விருப்ப நுணுக்கத்தை இயல்பாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குகிறது.
- source_word: עֲזַרְתַּנִי
  choice: எனக்கு உதவியிருக்கிறீர்
  rationale: நிறைவுற்ற செயல் தற்போதைய வேண்டுதலுக்கு அடிப்படையாக இருப்பதால், தமிழ் நிகழ்கால நிறைவு வடிவம் அதன் கடந்தகாலச் செயலையும் தற்போதைய பொருத்தத்தையும் வெளிப்படுத்துகிறது.
- source_word: וְנִחַמְתָּנִי
  choice: எனக்கு ஆறுதலளித்திருக்கிறீர்
  rationale: נחם இங்கு ஆறுதல் அல்லது தேற்றுதல் என்று பொருள்படும். ‘ஆறுதலளித்திருக்கிறீர்’ என்பது நவீன, புரிந்துகொள்ள எளிதான, கண்ணியமான தமிழ்.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ‘கர்த்தர்’ என்ற பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: לְטוֹבָה என்பதன் பொருள்
  choice: நன்மைக்கான
  alternative: தயவின் அடையாளம்
  rationale: இச்சொல் நன்மை, நலன் அல்லது சாதகமான தயவு ஆகியவற்றைக் குறிக்கலாம். ‘தயவு’ என்று மட்டும் தீர்மானிக்காமல் ‘நன்மை’ என்று மொழிபெயர்ப்பது மூலத்தின் பொருள் விரிவையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான ஒருமை மரியாதை நடை பயன்படுத்தப்பட்டுள்ளது. ‘காட்டும்,’ ‘வெட்கமடையட்டும்’ ஆகிய வடிவங்கள் கவிதைநயத்தையும் வேண்டுதலின் வலிமையையும் காக்கின்றன; அரிதான சமயச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
