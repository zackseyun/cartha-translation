  text: A prayer of David. Incline your ear[a], Yahweh; answer me, for I am poor and needy.
translation:
  language: ta
  text: 'தாவீதின் விண்ணப்பம்.


    யெகோவாவே, உமது செவியைச் சாய்த்து, எனக்குப் பதிலளியும்; ஏனெனில் நான் ஏழையும் தேவையுள்ளவனுமாய் இருக்கிறேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் துன்புற்றவனும் தேவையுள்ளவனுமாய் இருக்கிறேன்” என்றும் மொழிபெயர்க்கலாம். עָנִי என்ற எபிரெயச் சொல் ஏழை, துன்புற்றவர், அல்லது தாழ்த்தப்பட்டவர் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: விண்ணப்பம்
  rationale: இங்கு வரும் சங்கீதத் தலைப்பில், கடவுளிடம் உதவி கோரும் வேண்டுதலை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பைக் குறிக்கக்கூடியது; தமிழில் வழக்கமான சங்கீதத் தலைப்பாகச் சுருக்கமாக வழங்கப்பட்டுள்ளது.
- source_word: הַטֵּה ... אָזְנְךָ
  choice: உமது செவியைச் சாய்த்து
  rationale: செவிசாய்த்துக் கவனிக்குமாறு வேண்டுகிற எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இறைப்பெயரான நான்கு எழுத்துப் பெயரை பொதுவாக அறியப்பட்ட தமிழ்ப் பெயர்ப்பாட்டில் தனிப்பெயராக வழங்குகிறது.
- source_word: עָנִי
  choice: எளியவன்
  rationale: வறுமை, துன்பம், தாழ்ந்த நிலை ஆகிய அர்த்தப் பரப்பை முற்றிலும் ஒன்றாக முடிவுசெய்யாமல், தமிழில் dignified-ஆக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֶבְיוֹן
  choice: தேவையுள்ளவன்
  rationale: பற்றாக்குறையிலும் உதவி தேவைப்படும் நிலையையும் குறிக்கும் சொல்லை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: לְדָוִד என்பதன் தொடர்பு
  choice: தாவீதின்
  alternative: தாவீதுக்குரிய / தாவீதுக்காக
  rationale: முன்னொட்டின் இலக்கணத் தெளிவின்மையை ஒரு தனிப்பட்ட ஆசிரியத்துவக் கோட்பாடாக விரிவாக்காமல், தமிழ் சங்கீதத் தலைப்புகளின் இயல்பான வடிவத்தைப் பயன்படுத்துகிறது.
- issue: தெய்வீகப் பெயர் יהוה
  choice: யெகோவா
  alternative: யாவே / ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல் வெளிப்படையாகக் காட்டுகிறது; உச்சரிப்பின் பண்டைய வடிவம் உறுதியாக அறியப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் சங்கீதத்துக்குரிய கண்ணியமும் கொண்ட நடை. ‘செவியைச் சாய்த்து’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
