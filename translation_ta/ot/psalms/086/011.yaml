  yaml_path: translation/ot/psalms/086/011.yaml
  text: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
translation:
  language: ta
  text: 'யாவே, உமது வழியை எனக்குக் கற்பியும்;


    உமது உண்மையில்[a] நான் நடக்கும்படி,


    உமது பெயருக்கு அஞ்சுவதற்கு என் இதயத்தை ஒன்றாக்கும்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது உண்மைத்தன்மையில்.’ எபிரெயச் சொல் ‘உண்மை’ என்றும் ‘உண்மைத்தன்மை, நம்பகத்தன்மை’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் இதயத்தைப் பிளவில்லாததாகச் செய்யும்.’ எபிரெய வினைச்சொல் ‘ஒன்றாக்கு’ அல்லது ‘ஒன்றாகச் செய்’ என்று பொருள்பட்டு, பிளவுபட்ட பற்றுகளிலிருந்து விடுதலையான உள்ளத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: எனக்குக் கற்றுத்தாரும்
  rationale: ירה என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘எனக்குக் கற்பியும்/அறிவுறுத்தும்’ என்று பொருள்படும். மரியாதைமிக்க வேண்டுதலாக ‘கற்றுத்தாரும்’ இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: דַּרְכֶּךָ
  choice: உமது வழி
  rationale: דֶּרֶךְ என்பது நேரடியான பாதையையும் வாழ்வின் நெறியையும் குறிக்கலாம்; ‘வழி’ இரு சாத்தியங்களையும் தக்கவைக்கிறது.
- source_word: אֲהַלֵּךְ
  choice: நான் நடக்கும்படி
  rationale: முந்தைய கட்டளை வேண்டுதலைத் தொடர்ந்து வரும் இவ்வினை வடிவம் நோக்கம் அல்லது விளைவை வெளிப்படுத்துகிறது. ‘நடக்கும்படி’ அந்தத் தொடர்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: בַּאֲמִתֶּךָ
  choice: உமது உண்மையில்
  rationale: אֱמֶת என்பதற்கு ‘உண்மை,’ ‘உண்மைத்தன்மை,’ ‘நம்பகத்தன்மை’ ஆகிய பொருள்கள் உண்டு. ‘உண்மையில்’ என்பது நேரடியான மொழிபெயர்ப்பு; ‘உமது உண்மைத்தன்மைக்கு ஏற்ப’ என்பது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יַחֵד
  choice: ஒருமுகப்படுத்தும்
  rationale: יחד என்பதன் பியேல் கட்டளை வடிவம் ‘ஒன்றாக்கு’ என்று பொருள்படும். இதயத்தைப் பற்றிய தமிழ்ச் சூழலில் ‘ஒருமுகப்படுத்தும்’ என்பது பிளவுபடாத உள்ளார்ந்த பற்றை இயல்பாக வெளிப்படுத்துகிறது; நேரடியான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לְבָבִי
  choice: என் இதயம்
  rationale: לֵבָב என்பது விருப்பம், சிந்தனை, உணர்வு உள்ளிட்ட உள்ளான மனிதனைச் சுட்டுகிறது. ‘இதயம்’ என்ற வழக்கமான வேதாகமச் சொல் அந்த உருவகத்தைத் தக்கவைக்கிறது.
- source_word: לְיִרְאָה
  choice: அஞ்சுவதற்காக
  rationale: לְ உடன் வரும் ירא வினையின் பெயரெச்ச வடிவம் நோக்கத்தைத் தெரிவிக்கிறது. ‘அஞ்சு’ என்பது பயபக்தி, வியப்பு, அச்சம் ஆகிய எடையை ‘மதித்தல்’ என மென்மைப்படுத்தாமல் பாதுகாக்கிறது.
- source_word: שְׁמֶךָ
  choice: உமது பெயர்
  rationale: ‘பெயர்’ என்பது தேவனுடைய ஆளுமையையும் புகழையும் குறிக்கக்கூடும்; மூலத்தின் வழிபாட்டு மொழியையும் இறையியல் முக்கியத்துவத்தையும் நேரடியாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூல உரையில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே பட்டப்பெயரான ‘ஆண்டவர்’ என்பதைக் கொண்டு மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- issue: தேவனுடைய பெயருக்கு ‘அஞ்சுதல்’ என்பதன் பொருள்
  choice: உமது பெயருக்கு அஞ்சுதல்
  alternative: உமது பெயரைப் பயபக்தியுடன் மதித்தல்
  rationale: ירא என்பது அச்சம், வியப்பு, பயபக்தி ஆகியவற்றை உள்ளடக்குகிறது. ‘அஞ்சுதல்’ அதன் முழு வேதாகம எடையைத் தக்கவைக்கிறது; அதை வெறும் மரியாதையாக மட்டும் சுருக்கவில்லை.
- issue: இதயத்தை ஒன்றாக்குதல்
  choice: என் இதயத்தை ஒருமுகப்படுத்தும்
  alternative: என் இதயத்தை ஒன்றாக்கும்
  rationale: இந்த வேண்டுதல் பிளவுபட்ட பற்றுகளிலிருந்து விடுபட்ட, முழுமையாக தேவனை நோக்கிய உள்ளத்தை நாடுகிறது. ‘ஒருமுகப்படுத்தும்’ தமிழில் இயல்பாக இருந்தாலும், ‘ஒன்றாக்கும்’ என்ற மூல உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியமான வேண்டுதல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உமது,’ ‘கற்றுத்தாரும்,’ ‘ஒருமுகப்படுத்தும்’ போன்ற வடிவங்கள் உயர்வானதாயினும் பொதுவாசகர்களுக்குப் புரியும் வகையில் உள்ளன. மூலத்தின் மூன்று வேண்டுதல்/நோக்கக் கூறுகளும் கவிதை வரிகளாகப் பாதுகாக்கப்பட்டுள்ளன.
