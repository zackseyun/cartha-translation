review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the three Hebrew requests: teaching Yahweh''s way, walking in his אֱמֶת, and making the heart one/undivided for fearing his name. However, the first footnote’s alternative introduces an unnecessarily interpretive Tamil expression, and the second footnote’s explanation can be more idiomatic.'
  naturalness: The prayer register is natural modern standard Tamil. “எனக்குக் கற்றுத்தாரும்” and “ஒருமுகப்படுத்தும்” are understandable, though “எனக்குக் கற்பியும்” and “ஒன்றாக்கும்” are more direct correspondences to the Hebrew and maintain the compact poetic parallelism.
  terminology: “யாவே,” faithfully preserves the divine name. “உண்மையில்,” “இதயம்,” “அஞ்சுவதற்கு,” and “பெயர்” appropriately preserve the Hebrew wording and theological register. “ஒன்றாக்கும்” better retains the lexical image of יַחֵד than “ஒருமுகப்படுத்தும்.”
  issues:
  - severity: low
    issue: The wording “உமது உண்மைத்தன்மைக்கு ஏற்ப” in footnote a is not the closest lexical alternative.
    rationale: The Hebrew אֱמֶת may mean “truth” or “faithfulness/reliability”; “உமது உண்மைத்தன்மையில்” or “உமது நம்பகத்தன்மையில்” presents that alternative without adding the interpretive phrase “க்கு ஏற்ப.”
  - severity: low
    issue: “ஒருமுகப்படுத்தும்” narrows the image of יַחֵד.
    rationale: The Piel imperative directly asks God to unite/make one the psalmist’s heart. “என் இதயத்தை ஒன்றாக்கும்” is idiomatic enough in Tamil and preserves the source image, while the footnote can explain undivided loyalties.
