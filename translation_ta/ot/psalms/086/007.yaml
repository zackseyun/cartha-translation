  terminology: «நெருக்கம்», «கூப்பிடுகிறேன்», «பதிலளிக்கிறீர்» ஆகியவை இச்சூழலில் நடுநிலையான, கண்ணியமான சொற்கள். பெயர்கள் அல்லது சிறப்புக் கலைச்சொற்கள் தொடர்பான சிக்கல் இல்லை.
