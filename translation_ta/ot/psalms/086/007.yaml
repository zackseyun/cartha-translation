source:
  edition: WLC
  text: בְּ/י֣וֹם צָ֭רָתִ֥/י אֶקְרָאֶ֗/ךָּ כִּ֣י תַעֲנֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/007.yaml
  text: In the day of my distress I call to you, because you answer me.
translation:
  language: ta
  text: என் நெருக்கத்தின் நாளில் உம்மை நோக்கிக் கூப்பிடுகிறேன்; ஏனெனில் நீர் எனக்குப் பதிலளிக்கிறீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: என் நெருக்கத்தின் நாளில்
  rationale: צָרָה என்பது துன்பம், நெருக்கடி, இடுக்கண் ஆகிய பொருள்களை உடையது. எபிரெயச் சொற்றொடரின் வடிவத்தையும் சங்கீதத்தின் கண்ணியமான நடையையும் காக்கும் வகையில் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: אֶקְרָאךָ
  choice: உம்மை நோக்கிக் கூப்பிடுகிறேன்
  rationale: קרא உடன் நேரடி இரண்டாம் நபர் பின்னொட்டு வருவதால், உதவிக்காக தேவனை அழைக்கும் பொருள் இயல்பாக வெளிப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: அழைப்பதற்கான காரணத்தை அறிமுகப்படுத்தும் இயல்பான காரணப்பொருள் காக்கப்படுகிறது.
- source_word: תַעֲנֵנִי
  choice: நீர் எனக்குப் பதிலளிப்பீர்
  rationale: எபிரெய வினைமுற்றின் நிறைவுறாத வடிவம் இச்சூழலில் நம்பிக்கையுடன் எதிர்பார்க்கப்படும் பதிலைச் சுட்டுகிறது; அதைத் தமிழ் எதிர்கால வடிவம் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: தெய்வீகப் பதிலின் காலமும் உறுதியும்
  choice: நீர் எனக்குப் பதிலளிப்பீர்
  alternative: நீர் எனக்குப் பதிலளிக்கிறீர்
  rationale: תַעֲנֵנִי வடிவம் எதிர்காலச் செயல் அல்லது உறுதியான எதிர்பார்ப்பைக் குறிக்கக்கூடும். உடனிருக்கும் சூழலில் சங்கீதக்காரரின் நம்பிக்கையை வெளிப்படுத்தும் எதிர்கால வடிவம் தேர்ந்தெடுக்கப்பட்டது; ஏற்கெனவே தொடர்ந்து நிகழும் பதில் எனக் கட்டாயமாகத் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், ஜெபத்திற்குரிய கண்ணியத்தைப் பேணும் மரியாதை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வசனத்தின் எளிமை, காரணத் தொடர்பு, நம்பிக்கையான எதிர்பார்ப்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
