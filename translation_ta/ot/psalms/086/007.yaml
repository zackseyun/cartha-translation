  source_fidelity: எபிரெயத்தின் «בְּיוֹם צָרָתִי» (‘என் நெருக்கடியின்/துன்பத்தின் நாளில்’), «אֶקְרָאֶךָ» (‘உம்மைக் கூப்பிடுகிறேன்’), மற்றும் காரணப் பொருளுடைய «כִּי» ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. ஆனால் «תַעֲנֵנִי» இவ்விடத்தில் நிகழ்கால/வழக்கமான உறுதியைக் குறிக்க இயலும்; ஆங்கில POB-யும் “you answer me” என நிகழ்காலத்தில் உள்ளது. எதிர்காலமான «பதிலளிப்பீர்» மூலத்தில் கட்டாயமில்லாத காலத் துல்லியத்தைச் சேர்க்கிறது.
