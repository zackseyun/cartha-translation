id: PSA.86.10
reference: Psalms 86:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּֽי גָד֣וֹל אַ֭תָּה וְ/עֹשֵׂ֣ה נִפְלָא֑וֹת אַתָּ֖ה אֱלֹהִ֣ים לְ/בַדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/010.yaml
  text: For you are great and do wondrous things[a]; you alone are God.
translation:
  language: ta
  text: ஏனெனில், நீர் பெரியவர்; வியத்தகு செயல்களைச் செய்கிறவர்; நீர் ஒருவரே கடவுள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் மட்டுமே கடவுள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கும் புகழ்ச்சிக்கும் காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், அதன் காரணப்பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: גָדוֹל
  choice: பெரியவர்
  rationale: தேவனுடைய மேன்மையையும் வல்லமையையும் குறிக்கும் நேரடியான, இயல்பான தமிழ் சொல்; மரியாதைப் பன்மை நடையோடு பொருந்துகிறது.
- source_word: וְעֹשֵׂה
  choice: செய்கிறவர்
  rationale: எபிரெயப் பங்கேற்புவினை தேவனுடைய இயல்பான, தொடர்ச்சியான செயலைக் குறிக்கிறது; தமிழ் பண்புப்பெயர் வடிவம் அந்தப் பொதுவான தன்மையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: נִפְלָאוֹת
  choice: வியத்தகு செயல்களை
  rationale: வியப்பை உண்டாக்கும் அசாதாரண தெய்வீகச் செயல்களைக் குறிக்கும் பன்மைப் பொருளை, வெறும் உணர்வாக அல்லாமல் செயல்களாகத் தெளிவாக வழங்குகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இரண்டாம் நபர் அழைப்பும் தனித்தன்மையை வலியுறுத்தும் சொல்லும் ஒரே கடவுளைக் குறிப்பதால், ஒருமைப் பொருளுடைய வழக்கமான தமிழ் பதம் பொருத்தமானது.
- source_word: לְבַדֶּךָ
  choice: நீர் ஒருவரே
  rationale: இரண்டாம் நபரைச் சார்ந்த ‘தனியாக/ஒருவரே’ என்ற பொருளையும், இறுதிக் கூற்றின் தனித்தன்மை வலியுறுத்தலையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இறுதிக் கூற்றிலுள்ள கடவுளின் தனித்தன்மை
  choice: நீர் ஒருவரே கடவுள்
  alternative: நீர் மட்டுமே கடவுள்
  rationale: לְבַדֶּךָ என்பதன் வலியுறுத்தலை நேரடியாகக் காத்து, கடவுள் ஒருவரே என்ற கூற்றை எந்தத் தத்துவ விரிவாக்கமும் இன்றித் தெளிவாக வழங்குகிறது. மாற்று வடிவமும் அதே அடிப்படைப் பொருளைக் கொண்டது.
translation_notes:
  register: நவீன செந்தமிழில், வழிபாட்டு மரியாதையை வெளிப்படுத்தும் “நீர்” வடிவம் பயன்படுத்தப்பட்டுள்ளது. கவிதைத் தன்மைக்காகச் சுருக்கமான இணை அமைப்பும் அரைப்புள்ளிகளும் வைக்கப்பட்டுள்ளன; மொழிநடை பொதுவாசகர்களுக்குப் புரியத்தக்கதாக உள்ளது.
