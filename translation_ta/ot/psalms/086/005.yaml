  yaml_path: translation/ot/psalms/086/005.yaml
  text: For you[a], Lord, are good and forgiving, abounding in steadfast love to all who call on you.
translation:
  language: ta
  text: ஏனெனில், ஆண்டவரே, நீர் நல்லவரும் மன்னிக்கிறவரும், உம்மை நோக்கிக் கூப்பிடுகிற அனைவருக்கும் மாறாத அன்பு நிறைந்தவருமாய் இருக்கிறீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “ஏனெனில், ஆண்டவரே, நீர் நல்லவரும் மன்னிக்க ஆயத்தமாயிருப்பவரும், உம்மை நோக்கிக் கூப்பிடுகிற அனைவரிடமும் பேரன்புள்ளவருமாய் இருக்கிறீர்.”'
    reason: סַלָּח மற்றும் רַב חֶסֶד ஆகியவற்றின் சாத்தியமான மாற்று வெளிப்பாடுகளைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַתָּה
  choice: நீர்
  rationale: கடவுளை நேரடியாகவும் மரியாதையுடனும் விளிக்கும் வலியுறுத்தப்பட்ட முன்னிலைப் பெயரைத் தக்கவைக்கிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது יהוה என்ற திருப்பெயர் அல்ல, நேரடி விளியில் வரும் தெய்வீகப் பட்டம்; ஆகவே 'ஆண்டவரே' துல்லியமும் இயல்பும் உடையது.
- source_word: טוֹב
  choice: நல்லவர்
  rationale: கடவுளின் நன்மையை ஒரு குறிப்பிட்ட பண்பாகக் குறுக்காமல் அதன் பரந்த அடிப்படைப் பொருளைப் பாதுகாக்கிறது.
- source_word: סַלָּח
  choice: மன்னிக்கிறவர்
  rationale: மன்னிப்பது கடவுளின் நிலையான இயல்பு என்பதை இயல்பான தமிழில் பெயரடைப் பொருளுடன் தெரிவிக்கிறது.
- source_word: רַב חֶסֶד
  choice: மாறாத அன்பு நிறைந்தவர்
  rationale: רַב என்பதன் மிகுதி உணர்வையும் חֶסֶד என்பதன் நீடித்த, உண்மையுள்ள அன்பையும் வாசிக்க எளிய தமிழில் இணைக்கிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: வெறும் இரக்கம் என்பதைக் காட்டிலும் அன்பின் நிலைத்தன்மை மற்றும் உறுதிப்பாட்டைத் தக்கவைக்கிறது.
- source_word: לְכָל
  choice: அனைவருக்கும்
  rationale: கடவுளின் அன்பைப் பெறுகிறவர்களைக் குறிக்கும் לְ முன்னிடைச்சொல்லின் பயனாளர் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: קֹרְאֶיךָ
  choice: உம்மை நோக்கிக் கூப்பிடுகிற
  rationale: கடவுளை வேண்டி அழைப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இது வெறும் பெயரிட்டு அழைப்பதாகப் பொருள் குறுகுவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: אֲדֹנָי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: என் ஆண்டவரே; எஜமானரே
  rationale: மூலத்தில் יהוה இல்லை; எனவே கடவுளின் உடன்படிக்கைத் திருப்பெயருக்குரிய தனிப்பட்ட வடிவத்தைச் சேர்க்காமல் பட்டத்தையே நேரடி விளியாக மொழிபெயர்க்கிறது.
- issue: חֶסֶד என்பதன் பொருள்
  choice: மாறாத அன்பு
  alternative: உண்மையுள்ள அன்பு; இரக்கம்; பேரன்பு
  rationale: அன்பு, விசுவாசமான உறுதிப்பாடு, நீடித்த நன்மை ஆகியவற்றின் பொருள் அழுத்தத்தை வெறும் 'இரக்கம்' எனக் குறுக்காமல் பாதுகாக்கிறது.
- issue: סַלָּח என்பதன் பண்புப்பொருள்
  choice: மன்னிக்கிறவர்
  alternative: மன்னிக்க ஆயத்தமாயிருப்பவர்
  rationale: ஒற்றை எபிரெயப் பண்புச்சொல் கடவுளின் மன்னிக்கும் இயல்பைக் குறிக்கிறது. 'ஆயத்தம்' என்பது சாத்தியமான விளக்க விரிவாக்கம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீத ஜெபத்திற்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்/உம்மை/இருக்கிறீர்’ பயன்படுத்தப்பட்டுள்ளன; பழமையான அல்லது சமயப் பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
