    text: எபிரெயத்தில் “என் மன்றாட்டுகள்”; அதாவது, தயவு அல்லது இரக்கம் வேண்டி உருக்கமாகச் செய்யும் வேண்டுதல்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: செவிசாயும்
  rationale: கேட்பதற்காகக் காதைச் சாய்த்தல் என்ற எபிரெய உருவகத்தையும், ஜெபத்தில் வெளிப்படும் பணிவான வேண்டுகோளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பட்ட உடன்படிக்கைப் பெயர்; ஆகவே தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: תְּפִלָּתִי
  choice: என் ஜெபம்
  rationale: முதல் நபர் ஒருமை உரிமை விகுதியுடன் வரும் תְּפִלָּה என்பதன் நேரடியான, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் வடிவம்.
- source_word: וְהַקְשִׁיבָה
  choice: கவனித்துக் கேளும்
  rationale: קשב வெறும் ஒலி கேட்பதைவிட அக்கறையுடன் செவிகொடுப்பதைச் சுட்டுகிறது; இந்தத் தமிழ் சொற்றொடர் அந்த வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: בְּקוֹל
  choice: குரலை
  rationale: קוֹל என்பதன் ‘குரல்/ஒலி’ என்ற உணர்வை விடாமல், தமிழில் ‘குரலைக் கேள்’ என்ற இயல்பான தொடராக வழங்குகிறது.
- source_word: תַּחֲנוּנוֹתַי
  choice: என் இரக்க மன்றாட்டுகள்
  rationale: தயவு அல்லது இரக்கம் நாடி உருக்கமாக முன்வைக்கப்படும் வேண்டுதல்கள் என்ற சொல்லின் பொருளைத் தெளிவாகக் காட்டுகிறது; மூலத்தின் பன்மையும் காக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் சங்கீதக்காரர் கடவுளை அவரது தனிப்பட்ட பெயரால் நேரடியாக அழைக்கிறார். பட்டப்பெயரைப் பதிலிடாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது அந்த வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஜெபத்திற்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘செவிசாயும்’ மற்றும் ‘கவனித்துக் கேளும்’ என்பவை எபிரெயக் கவிதையின் இணைநிலையையும் இரண்டாவது வினையின் தீவிரத்தையும் காக்கின்றன.
