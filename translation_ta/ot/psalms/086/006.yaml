  text: Give ear[a], O Yahweh, to my prayer, and listen to the voice of my pleas for mercy.
translation:
  language: ta
  text: 'யாவே, என் ஜெபத்திற்குச் செவிசாயும்;

    என் இரக்கத்திற்கான மன்றாட்டுகளின்[a] குரலைக் கவனித்துக் கேளும்.'
  philosophy: optimal-equivalence
  footnotes:
