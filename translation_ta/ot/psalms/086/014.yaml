base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/014.yaml
  text: God[a], arrogant men have risen against me, and a band of ruthless men has sought my life[c][b]; they have not set you before them.
translation:
  language: ta
  text: கடவுளே, ஆணவக்காரர்கள் எனக்கு எதிராக எழும்பியிருக்கிறார்கள்; கொடியவர்களின் கூட்டம் என் உயிரைத் தேடியிருக்கிறது[a]. அவர்கள் உம்மைத் தங்கள் கண்முன் நிறுத்தவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லளவில், “என் உயிரைத் தேடியிருக்கிறது”; இது என்னைக் கொல்லத் தேடுவதைச் சுட்டும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
  - marker: b
    text: அல்லது, “அவர்கள் உம்மைத் தங்களுக்கு முன்பாக வைக்கவில்லை”; அதாவது, அவர்கள் கடவுளை கருத்தில் கொள்ளவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது இஸ்ரவேலின் கடவுளை நோக்கிய நேரடி அழைப்பு. நவீன தமிழில் அழைப்புவேற்றுமையான ‘கடவுளே’ இயல்பாகவும் மூலத்தின் அழைப்புச் செயல்பாட்டைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: זֵדִים
  choice: ஆணவக்காரர்கள்
  rationale: பெருமை, இறுமாப்பு, துணிகரமான அகந்தை ஆகிய பொருள்களை உடைய இச்சொல், இங்கு பகைமையுடன் செயல்படும் நபர்களைக் குறிக்கிறது.
- source_word: קָמוּ עָלַי
  choice: எனக்கு எதிராக எழும்பியிருக்கிறார்கள்
  rationale: קום על என்பது ஒருவருக்கு எதிராகப் பகைமையுடன் எழுவதைக் குறிக்கும் எபிரெய மரபுத்தொடர். நிறைவுற்ற செயல் தற்போதைய நெருக்கடியாகத் தொடர்வதை இவ்வடிவம் காட்டுகிறது.
- source_word: וַעֲדַת
  choice: கூட்டம்
  rationale: ஒன்றுகூடிய குழுவைச் சுட்டுகிறது; பகைமைச் சூழலில் இயல்பான தமிழ் சொல்லாக ‘கூட்டம்’ அமைகிறது.
- source_word: עָרִיצִים
  choice: கொடியவர்கள்
  rationale: வன்முறையுள்ள, இரக்கமற்ற, ஒடுக்குகிற ஆட்களைச் சுட்டும் சொல்லின் அச்சுறுத்தும் தன்மையை ‘கொடியவர்கள்’ இயல்பாக வெளிப்படுத்துகிறது; அரசியல் ‘கொடுங்கோலர்கள்’ என்ற குறுகிய பொருளைத் திணிக்கவில்லை.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: என் உயிரைப் பறிக்கத் தேடுகிறது
  rationale: சொல்லளவில் ‘என் உயிரைத் தேடினார்கள்’ என்றாலும், இம்மரபுத்தொடர் கொல்ல முயல்வதைக் குறிக்கிறது. தமிழில் தவறாகப் புரியாமல் இருக்க பொருள் தெளிவாக்கப்பட்டு, ‘உயிர்’ என்ற மூல உருவகம் பாதுகாக்கப்படுகிறது.
- source_word: וְלֹא שָׂמוּךָ לְנֶגְדָּם
  choice: அவர்கள் உம்மைத் தங்கள் கண்முன் நிறுத்தவில்லை
  rationale: ‘உம்மைத் தங்களுக்கு முன் வைக்கவில்லை’ என்ற மூல உருவகத்தை இயல்பான தமிழில் காத்து, அவர்கள் கடவுளைக் கருத்தில் கொள்ளாததைக் குறிக்கிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதை நேரடி அழைப்பாக வெளிப்படுத்துதல்
  choice: கடவுளே
  alternative: கடவுள்
  rationale: தனி அழைப்பிடைச்சொல் மூலத்தில் இல்லாவிட்டாலும், எபிரெயத்தில் இது அழைப்பாகச் செயல்படுகிறது. தமிழின் வேற்றுமை அமைப்பில் ‘கடவுளே’ என்பது கூடுதல் உணர்ச்சியைத் திணிக்காமல் அந்த இலக்கணச் செயல்பாட்டை வெளிப்படுத்துகிறது.
- issue: ‘என் உயிரைத் தேடினார்கள்’ என்ற மரபுத்தொடரின் கொலை நோக்கத்தை வெளிப்படையாக்குதல்
  choice: என் உயிரைப் பறிக்கத் தேடுகிறது
  alternative: என் உயிரைத் தேடுகிறது
  rationale: எபிரெய மரபுத்தொடர் உயிரைக் கொல்லத் தேடுவதைச் சுட்டுகிறது. நேரடி சொற்பெயர்ப்பு தமிழில் உயிரைக் கண்டுபிடிக்க முயல்வது போலத் தெளிவின்மையை உண்டாக்கலாம்; ஆகவே மரபுத்தொடரின் பொருள் வெளிப்படுத்தப்படுகிறது, அதேவேளை ‘உயிர்’ என்ற சொல் காக்கப்படுகிறது.
- issue: கடவுளைத் தங்களுக்கு முன் வைக்காதது என்ற உருவகத்தைப் பாதுகாத்தல்
  choice: உம்மைத் தங்கள் கண்முன் நிறுத்தவில்லை
  alternative: உம்மை அவர்கள் பொருட்படுத்தவில்லை
  rationale: மூலத்தின் இடவியல் உருவகத்தையும், கடவுளைக் கருத்தில் கொள்ளாமை என்ற உட்பொருளையும் ஒருங்கே வைத்திருக்கிறது; பொதுவான அவநம்பிக்கை போன்ற மேலதிக கோட்பாட்டு முடிவைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும், அதேவேளை சங்கீத ஜெபத்திற்கேற்ற கண்ணியமான நடை. கடவுளை நோக்கிய மரியாதை ஒருமைக்கு ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது. கூட்டு எழுவாயான ‘கூட்டம்’ என்பதற்கேற்ப ஒருமை வினை பயன்படுத்தப்பட்டுள்ளது.
