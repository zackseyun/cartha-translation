review_pass:
  verdict: revise
  source_fidelity: The direct address, hostile uprising, and the image of not placing God before oneself are conveyed faithfully. However, the Hebrew verb בִּקְשׁוּ is perfect and plural; the draft's present-tense singular “தேடுகிறது” loses the completed aspect. The main text also explicates the idiom as killing, while the source's idiom can be retained naturally with a clarifying note.
  naturalness: The Tamil is generally clear and suitably dignified. “என் உயிரைப் பறிக்கத் தேடுகிறது” is less idiomatic than a completed expression using “என் உயிரைத் தேடியிருக்கிறது,” especially when the footnote explains the Hebrew idiom.
  terminology: “கடவுளே,” “ஆணவக்காரர்கள்,” “கொடியவர்கள்,” and respectful “உம்மை” fit modern standard Tamil and the prayer register. “கண்முன் நிறுத்தவில்லை” is a natural rendering of the source metaphor, though “முன்பாக வைக்கவில்லை” is supplied in the note as a closer formal alternative.
  issues:
  - severity: medium
    issue: The verb for seeking the psalmist's life is present singular.
    rationale: בִּקְשׁוּ is a plural perfect. A collective Tamil subject may take singular agreement, but “தேடியிருக்கிறது” better represents the completed action than “தேடுகிறது.”
  - severity: low
    issue: The main text makes the lethal implication explicit rather than retaining the Hebrew idiom.
    rationale: The interpretation is well supported, but “என் உயிரைத் தேடியிருக்கிறது” preserves the source idiom and its measured ambiguity; the footnote can explain its usual lethal sense.
