id: PSA.86.4
reference: Psalms 86:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שַׂ֭מֵּחַ נֶ֣פֶשׁ עַבְדֶּ֑/ךָ כִּ֥י אֵלֶ֥י/ךָ אֲ֝דֹנָ֗/י נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/004.yaml
  text: Gladden the soul of your servant[a], for to you, Lord, I lift up my soul.
translation:
  language: ta
  text: உமது ஊழியனின் உள்ளத்தை மகிழ்விப்பீராக; ஏனெனில், ஆண்டவரே, உம்மிடம் என் உள்ளத்தை உயர்த்துகிறேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂמֵּחַ
  choice: மகிழ்வியும்
  rationale: பியேல் கட்டளை வடிவத்தின் நேரடியான வேண்டுதலையும், கடவுள் மகிழ்ச்சியை உண்டாக்க வேண்டும் என்ற பொருளையும் இயல்பான செந்தமிழ் இறைவேண்டல் நடையில் வெளிப்படுத்துகிறது.
- source_word: נֶפֶשׁ / נַפְשִׁי
  choice: உள்ளம் / என் உள்ளம்
  rationale: இச்சூழலில் נֶפֶשׁ முழு அகநபர், உயிர், ஆன்மா ஆகிய பொருள் பரப்பைக் கொண்டுள்ளது. நவீன தமிழில் “உள்ளம்” இறைவேண்டலின் அகநிலைப் பொருளை இயல்பாகத் தருகிறது; இரு இடங்களிலும் அதையே பயன்படுத்தி எபிரேய மறுபடியுரைத்தலைப் பேணுகிறது.
- source_word: עַבְדֶּךָ
  choice: உமது ஊழியன்
  rationale: கடவுளை நோக்கிய சங்கீத வேண்டுதலில் பணிவான அர்ப்பணிப்பையும் சேவையையும் குறிக்கிறது; சமூக அடிமைத்தனத்தை முன்னிறுத்தாமல் மரியாதையான உறவைப் பேணுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முதல் வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் தர்க்கத் தொடர்பைத் தெளிவாகப் பேணுகிறது.
- source_word: אֵלֶיךָ
  choice: உம்மிடமே
  rationale: கடவுளை நோக்கிய திசையை வெளிப்படுத்துகிறது; “-மே” கவிஞரின் ஒருமுகமான சார்பையும் வலியுறுத்துகிறது, ஆனால் புதிய கருத்தைச் சேர்ப்பதில்லை.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: தெய்வீக அழைப்புப் பெயரை மரியாதையான நேரடி விளிவடிவில் தருகிறது.
- source_word: אֶשָּׂא
  choice: உயர்த்துகிறேன்
  rationale: נשא என்பதன் உருவகத்தைப் பேணி, தன்னையே கடவுளிடம் வேண்டுதலுடனும் நம்பிக்கையுடனும் செலுத்தும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: נֶפֶשׁ என்பதன் மானுடவியல் பொருள்
  choice: இரு இடங்களிலும் “உள்ளம்”
  alternative: ஆத்துமா; உயிர்; என்னையே
  rationale: ஒரு தொழில்நுட்பமான உடல்–ஆத்துமா இருமையை உரையில் திணிக்காமல், இறைவேண்டலில் பேசுபவரின் அகநபரைச் சுட்டுகிறது. அடிக்குறிப்பு மூலச்சொல்லின் விரிந்த பொருள் பரப்பை வெளிப்படையாகப் பேணுகிறது.
- issue: עבד என்பதன் கடவுளுடனான உறவுப் பொருள்
  choice: உமது ஊழியன்
  alternative: உமது அடிமை
  rationale: இங்கு முன்னிலையில் இருப்பது பணிவான இறைப்பணியும் சார்பும்; சமூக அடிமை நிலை பிரதானமாக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையான இறைவேண்டல் நடையைப் பயன்படுத்துகிறது. “உமது/உம்மிடமே/ஆண்டவரே” என்ற வடிவங்கள் உயர்வான ஆனால் பொதுவாசகர்களுக்குப் புரியக்கூடிய சங்கீத மொழிநடையை வழங்குகின்றன; எபிரேயத்தின் נֶפֶשׁ மறுபடியுரைத்தல் “உள்ளம்” மூலம் பேணப்பட்டுள்ளது.
