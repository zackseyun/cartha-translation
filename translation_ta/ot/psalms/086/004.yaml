    text: “உள்ளம்” என மொழிபெயர்க்கப்பட்ட எபிரேயச் சொல், சூழலுக்கு ஏற்ப “ஆத்துமா,” “உயிர்,” அல்லது “தன் நபர்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
