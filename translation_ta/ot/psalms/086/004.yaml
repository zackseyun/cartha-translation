revisions:
- from: உமது ஊழியனின் உள்ளத்தை மகிழ்வியும்[a]; ஏனெனில், ஆண்டவரே, உம்மிடமே என் உள்ளத்தை உயர்த்துகிறேன்.
  to: உமது ஊழியனின் உள்ளத்தை மகிழ்விப்பீராக; ஏனெனில், ஆண்டவரே, உம்மிடம் என் உள்ளத்தை உயர்த்துகிறேன்.
  rationale: The revision modernizes the imperative while maintaining its direct prayerful force, removes an unwarranted emphasis from the directional phrase, and improves the lexical-alternative footnote. The repetition of נֶפֶשׁ remains visible through the repeated use of “உள்ளம்.”
