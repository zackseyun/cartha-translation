  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஓசையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆசாரியர்,’ ‘யாவே,’ ‘பெயரைச் சொல்லி அழைத்தல்’ ஆகியவை வேதாகமச் சூழலைக் காக்கின்றன; அதே நேரத்தில் வாக்கிய அமைப்பு சாதாரண வாசகருக்கும் தெளிவாக உள்ளது.
