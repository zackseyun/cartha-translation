base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/006.yaml
  text: Moses and Aaron were among his priests[a], and Samuel among those who called on his name; they called to Yahweh, and he answered them.
translation:
  language: ta
  text: 'மோசேயும் ஆரோனும் அவருடைய ஆசாரியர்களில் இருந்தனர்;

    சாமுவேல் அவருடைய பெயரைக் கூவி அழைத்தவர்களில் இருந்தான்.[a]

    அவர்கள் யாவேவை அழைத்தார்கள்;

    அவர் அவர்களுக்குப் பதிலளித்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய பெயரை வேண்டிக்கொண்டவர்களில்.” எபிரெயத்தில், “அவருடைய பெயரை அழைப்பவர்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹהֲנָיו
  choice: அவருடைய ஆசாரியர்களில் இருந்தனர்
  rationale: בְּ இங்கு ஒரு குழுவினுள் அடங்கியிருப்பதைக் குறிக்கும் பகுதிப்பொருளில் வருகிறது. ஆகவே மோசேயையும் ஆரோனையும் கடவுளுடைய ஆசாரியர்களில் உள்ளவர்களாக வகைப்படுத்தும் எபிரெயச் சொல்லமைப்பு காக்கப்படுகிறது; இருவரும் முற்றிலும் ஒரே வழிபாட்டு அலுவலை வகித்ததாக உரை மிகைப்படுத்தப்படவில்லை.
- source_word: בְּקֹרְאֵי שְׁמוֹ
  choice: அவருடைய பெயரைச் சொல்லி அழைத்தவர்களில் இருந்தான்
  rationale: முந்தைய ‘ஆசாரியர்களில்’ என்பதற்கு இணையான வகைப்படுத்தும் சொல்லமைப்பு இது. שְׁמוֹ என்பதிலுள்ள ‘அவருடைய பெயர்’ வெளிப்படையாகப் பாதுகாக்கப்பட்டு, கடவுளை வேண்டுதலிலும் வழிபாட்டிலும் அழைக்கும் பொருள் இயல்பான தமிழில் தரப்படுகிறது.
- source_word: קֹרִאים אֶל
  choice: நோக்கிக் கூப்பிட்டார்கள்
  rationale: אֶל என்பதன் ‘நோக்கி’ என்ற திசைப்பொருளையும், קרא என்பதன் அழைத்தல் அல்லது மன்றாடுதல் சார்ந்த பொருளையும் இது காக்கிறது. துன்பத்தில் எழுப்பும் கூக்குரலாக மட்டும் பொருளைக் குறுக்காமல் இருக்க ‘கதறினார்கள்’ போன்ற சொல் தவிர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயரால் மாற்றப்படாமல், எபிரெய மூலத்திலுள்ள இறைபெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தரப்படுகிறது.
- source_word: יַעֲנֵם
  choice: அவர் அவர்களுக்குப் பதிலளித்தார்
  rationale: சங்கீதம் நினைவுகூரும் கடந்தகால நிகழ்வுகளின் சுருக்கமாக இயல்பான இறந்தகாலம் பயன்படுத்தப்படுகிறது. எபிரெய முற்றுப்பெறா வினை கடந்தகால வழக்கநிலையையும் அனுமதிப்பதால் அந்த மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׁמוֹ
  choice: அவருடைய பெயர்
  rationale: மூலத்தில் உள்ள ‘அவருடைய பெயர்’ என்ற முக்கியமான வேதாகமச் சொல்லாட்சி ‘அவரை’ என்று சுருக்கப்படாமல் அப்படியே பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: மோசே, ஆரோன், சாமுவேல் ஆகியோரை நடுவுநிலையாளர்களாகக் காட்டும்போது அவர்களுடைய பணிகளை ஒன்றாக்கிவிடாமல் மொழிபெயர்ப்பது
  choice: மோசேயும் ஆரோனும் அவருடைய ஆசாரியர்களில் இருந்தனர்; சாமுவேல் அவருடைய பெயரைச் சொல்லி அழைத்தவர்களில் இருந்தான்
  alternative: மோசேயும் ஆரோனும் அவருடைய ஆசாரியர்கள்; சாமுவேல் அவருடைய பெயரை அழைத்தான்
  rationale: மூல எபிரெயம் இரண்டு இணையான குழுவகைப்படுத்தும் சொற்றொடர்களைப் பயன்படுத்துகிறது. ‘ஆசாரியர்களில்’ என்பது பகுதிப்பொருளைக் காத்து, மோசேயின் பங்கையும் ஆரோனின் குறிப்பிட்ட ஆசாரிய அலுவலையும் அமைதியாக ஒன்றாக்குவதைத் தவிர்க்கிறது. சாமுவேல் இறைபெயரைச் சொல்லி அழைத்தவர்களின் குழுவில் வைக்கப்படுகிறான்.
- issue: יַעֲנֵם என்பதன் கால அல்லது வழக்கநிலை நுணுக்கம்
  choice: அவர் அவர்களுக்குப் பதிலளித்தார்
  alternative: அவர் அவர்களுக்குப் பதிலளிப்பார்
  rationale: சூழலில் இது முன்னோர் குறித்த கடந்தகால நினைவுகூரலாக இயல்பாக வாசிக்கிறது. அதேவேளை எபிரெய முற்றுப்பெறா வடிவம் கடந்தகாலத்தில் மீண்டும் நிகழ்ந்த வழக்கத்தையும் சுட்டக்கூடும்; அந்த உண்மையான இலக்கண வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
