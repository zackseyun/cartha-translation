source:
  edition: WLC
  text: וְ/עֹ֥ז מֶלֶךְ֮ מִשְׁפָּ֪ט אָ֫הֵ֥ב אַ֭תָּה כּוֹנַ֣נְתָּ מֵישָׁרִ֑ים מִשְׁפָּ֥ט וּ֝/צְדָקָ֗ה בְּ/יַעֲקֹ֤ב אַתָּ֬ה עָשִֽׂיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/004.yaml
  text: The strength of the King loves justice[a]; you have established uprightness[b]; you have done justice and righteousness in Jacob.
translation:
  language: ta
  text: அரசரின் வல்லமை நீதியை நேசிக்கிறது[a]; நேர்மையை நீர் நிலைநாட்டினீர்[b]; யாக்கோபில் நீதியையும் நீதிமையையும் நீர் நிறைவேற்றினீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை இயல்பான முறையில், “வல்லமையுள்ள அரசர் நீதியை நேசிக்கிறார்” என்றும் மொழிபெயர்க்கலாம். எபிரேய மொழியின் தொடக்கத் தொடர் சுருக்கமாக இருப்பதால், அதை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “நேர்மை” என்பதை “சமநீதி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹז מֶלֶךְ
  choice: அரசரின் வல்லமை
  rationale: எபிரேயத் தொடரின் சுருக்கமான, கடினமான அமைப்பைத் தீர்த்துவிடாமல், עֹז என்பதன் ‘வல்லமை’ என்ற பெயர்ச்சொல் பொருளையும் מֶלֶךְ என்பதன் உறவையும் வெளிப்படையாக வைத்திருக்கிறது.
- source_word: מִשְׁפָּט
  choice: நீதி
  rationale: இங்கு தனிப்பட்ட தீர்ப்பை மட்டும் அல்லாமல், நீதியான ஆட்சியையும் சரியான ஒழுங்கையும் குறிக்கிறது; மீண்டும் வரும் சொல்லும் ஒரே விதமாக மொழிபெயர்க்கப்படுகிறது.
- source_word: אָהֵב
  choice: நேசிக்கிறது
  rationale: இறைவனுடைய நிலையான இயல்பைச் சுட்டும் பொதுநிகழ்காலப் பொருளைத் தருகிறது; ‘வல்லமை’ என்பதே வெளிப்படையான இலக்கண எழுவாயாக வைக்கப்பட்டுள்ளது.
- source_word: כּוֹנַנְתָּ
  choice: நீர் நிலைநாட்டினீர்
  rationale: உறுதியாக நிறுவுதல் என்ற பொருளையும், செய்து முடிக்கப்பட்ட செயலின் தொடரும் விளைவையும் இயல்பான தமிழில் தருகிறது.
- source_word: מֵישָׁרִים
  choice: நேர்மை
  rationale: நேரானது, சரியானது என்ற அற மற்றும் நீதித்துறை சார்ந்த பொருளைத் தக்கவைக்கிறது; ‘சமநீதி’ என்பதும் சூழலுக்கேற்ற மாற்றாகும்.
- source_word: וּ/צְדָקָה
  choice: நியாயம்
  rationale: צְדָקָה-வின் சரியான, நீதிமிக்க நடத்தை என்ற பொருளைத் தருகிறது; அருகிலுள்ள מִשְׁפָּט என்பதற்கான ‘நீதி’ என்பதிலிருந்து சொல்லியல் வேறுபாட்டையும் காக்கிறது.
- source_word: בְּ/יַעֲקֹב
  choice: யாக்கோபில்
  rationale: கவிதையில் வரும் உடன்படிக்கைப் பெயரை ‘இஸ்ரவேல்’ என விளக்கி மாற்றாமல் வைத்திருக்கிறது; בְ முன்னிடைச்சொல்லையும் நேரடியாகக் காட்டுகிறது.
- source_word: עָשִׂיתָ
  choice: நீர் செயல்படுத்தினீர்
  rationale: ‘நீதியையும் நியாயத்தையும் செய்தீர்’ என்ற சொல்லுக்குச் சொல் வடிவத்தைவிட, அவற்றை நடைமுறையில் நிறைவேற்றினார் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: וְעֹז מֶלֶךְ என்ற கடினமான தொடக்கத் தொடரை எவ்வாறு அமைப்பது
  choice: அரசரின் வல்லமை நீதியை நேசிக்கிறது
  alternative: வல்லமையுள்ள அரசர் நீதியை நேசிக்கிறார்; அரசர் தமது வல்லமையில் நீதியை நேசிக்கிறார்
  rationale: எபிரேயத்தின் சுருக்கமான தொடரமைப்பையும் அதிலுள்ள உண்மையான தெளிவின்மையையும் முதன்மை உரையில் பாதுகாக்கிறது. பெயர்ச்சொல்லான ‘வல்லமை’ என்பதை விளக்கமின்றி ‘வல்லமையுள்ள’ என்ற பெயரடையாக மாற்றாமல், இயல்பான மாற்று வாசிப்பை அடிக்குறிப்பில் தருகிறது.
