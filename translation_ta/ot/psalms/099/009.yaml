source:
  edition: WLC
  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ֭/הִֽשְׁתַּחֲווּ לְ/הַ֣ר קָדְשׁ֑/וֹ כִּֽי קָ֝ד֗וֹשׁ יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/009.yaml
  text: Exalt Yahweh our God[a], and bow down at his holy mountain, for Yahweh our God is holy.
translation:
  language: ta
  text: நம் கடவுளாகிய யாவேயை மேன்மைப்படுத்துங்கள்; அவருடைய பரிசுத்த மலையை நோக்கிப் பணிந்துகொள்ளுங்கள்[a]. ஏனெனில், நம் கடவுளாகிய யாவே பரிசுத்தமானவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய பரிசுத்த மலையில் வழிபடுங்கள்.” எபிரெய வினை பணிந்து வணங்குவதையும் வழிபடுவதையும் குறிக்கலாம்; முன்னிடைச்சொல் “மலையை நோக்கி” அல்லது “மலையில்” எனப் புரிந்துகொள்ளப்படலாம்.
    reason: வினைச்சொல்லிலும் முன்னிடைச்சொல்லிலும் உள்ள உண்மையான பொருள் இருமையைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: மேன்மைப்படுத்துங்கள்
  rationale: רום என்பதன் பன்மை ஏவல் வடிவம் உயர்த்துதல் அல்லது மேன்மையைப் போற்றுதல் என்ற பொருளைத் தருகிறது; கடவுளின் மேன்மையை அறிவித்துப் போற்றும் அழைப்பைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உடைமைப் பின்னொட்டுடன் உள்ள வடிவத்தின் நேரான பொருள் ‘நம் கடவுள்’ என்பதாகும்.
- source_word: וְהִשְׁתַּחֲווּ
  choice: பணிந்துகொள்ளுங்கள்
  rationale: שׁחה உடலைத் தாழ்த்திப் பணிதலைக் குறிக்கிறது; வழிபாட்டுச் சூழலையும் உள்ளடக்கினாலும், மூலத்தின் உடல்சார்ந்த படிமத்தை இந்தத் தேர்வு காக்கிறது.
- source_word: לְהַר קָדְשׁוֹ
  choice: அவருடைய பரிசுத்த மலையை நோக்கி
  rationale: לְ என்ற முன்னிடைச்சொல் திசையையோ இடத்துடனான தொடர்பையோ குறிக்கலாம். ‘நோக்கி’ என்பது மலையே வணக்கத்தின் பொருள் என்ற தவறான எண்ணத்தைத் தவிர்த்து, திசை சார்ந்த சாத்தியத்தைக் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன்னுள்ள ஏவல்களுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக இயல்பாகச் செயல்படுகிறது.
- source_word: קָדוֹשׁ
  choice: பரிசுத்தமானவர்
  rationale: சங்கீதத்தின் மையக் கருத்தான கடவுளின் பரிசுத்தத்தைக் குறிக்கும் நிலையான, கண்ணியமான தமிழ் சொல்.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை ஒரு பொதுப் பட்டப்பெயரை அல்ல, தனிப்பட்ட தெய்வீகப் பெயரையே பயன்படுத்துகிறது; ஆகவே பெயரின் ஒலிபெயர்ப்பு பாதுகாக்கப்படுகிறது.
- issue: הִשְׁתַּחֲווּ என்பதை வெளிப்படையாக ‘வழிபடுங்கள்’ என்று மொழிபெயர்க்க வேண்டுமா
  choice: பணிந்துகொள்ளுங்கள்
  alternative: வழிபடுங்கள்
  rationale: இந்த வினை பணிந்து விழும் உடல் நிலையையும், அதன் மூலம் செய்யப்படும் வழிபாட்டையும் குறிக்க முடியும். concrete imagery-ஐ காக்க ‘பணிந்துகொள்ளுங்கள்’ தேர்ந்தெடுக்கப்பட்டுள்ளது; மற்ற பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: לְהַר என்பதில் இடமா திசையா
  choice: மலையை நோக்கி
  alternative: மலையருகே / மலையில்
  rationale: לְ திசையையும் தொடர்புடைய இடத்தையும் குறிக்கக்கூடியதால், முதன்மை உரையில் திசைநுணுக்கம் வைக்கப்பட்டு இடவியல் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பரிசுத்த’ என்பது சங்கீதத்தின் மறுமொழித் தன்மையைத் தக்கவைக்கிறது; தெய்வீகப் பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
