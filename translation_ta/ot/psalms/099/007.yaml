  text: In a pillar of cloud he spoke to them[a]; they kept his testimonies and the statute he gave them.
translation:
  language: ta
  text: மேகத்தூணில் அவர் அவர்களிடம் பேசினார்[a]; அவர்கள் அவருடைய சாட்சிகளையும், அவர் அவர்களுக்குக் கொடுத்த நியமத்தையும் கடைப்பிடித்தார்கள்.
  philosophy: optimal-equivalence
