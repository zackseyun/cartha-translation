lexical_decisions:
- source_word: בְּעַמּוּד עָנָן
  choice: மேகத்தூணில்
  rationale: בְּ என்ற முன்னொட்டு இங்கு இடத்தையோ வழிமுறையையோ குறிக்கலாம். ‘மேகத்தூணில்’ என்பது முதன்மையாக இடப்பொருளைத் தக்கவைத்து, மேகத்தூணுக்குள் இருந்து கடவுள் பேசிய காட்சியையும் இயல்பான தமிழில் வழங்குகிறது.
- source_word: יְדַבֵּר
  choice: பேசினார்
  rationale: yiqtol வடிவம் தொடர்ச்சியான அல்லது வழக்கமான கடந்தகாலச் செயலைக் குறிக்கக்கூடும்; இருப்பினும் இவ்வரலாற்றுக் கவிதைச் சூழலில் எளிய இறந்தகாலம் இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: אֲלֵיהֶם
  choice: அவர்களிடம்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மோசே, ஆரோன், சாமுவேல் ஆகியோரைச் சுட்டும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: שָׁמְרוּ
  choice: கடைப்பிடித்தார்கள்
  rationale: உடன்படிக்கை மற்றும் கட்டளைச் சூழலில் שׁמר என்பது வெறுமனே பாதுகாப்பதைவிட கீழ்ப்படிந்து அனுசரிப்பதைக் குறிக்கிறது; ‘கடைப்பிடித்தார்கள்’ இதைத் தெளிவாக வழங்குகிறது.
- source_word: עֵדֹתָיו
  choice: அவருடைய சாட்சிக் கட்டளைகள்
  rationale: עֵדוֹת என்பது கடவுளுடைய சாட்சிகளாக அல்லது உடன்படிக்கைச் சான்றுகளாக நிற்கும் கட்டளைகளைக் குறிக்கிறது. ‘சாட்சிக் கட்டளைகள்’ என்ற சொல் அதன் தனித்துவத்தைத் தக்கவைத்து, அடுத்து வரும் חֹק என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: וְחֹק
  choice: நியமத்தையும்
  rationale: חֹק என்பது நிர்ணயிக்கப்பட்ட சட்டம் அல்லது விதியைக் குறிக்கிறது. எபிரெய மூலத்திலுள்ள ஒருமை தமிழிலும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: נָתַן לָמוֹ
  choice: அவர் அவர்களுக்குக் கொடுத்த
  rationale: இந்தத் தொடர் ‘நியமம்’ என்பதைக் குறிப்பதாக இயல்பாகப் புரிகிறது; தமிழ் உறவெச்ச அமைப்பு அந்தத் தொடர்பைத் தெளிவாகவும் சுருக்கமாகவும் காட்டுகிறது.
theological_decisions:
- issue: ‘அவர்’ மற்றும் ‘அவர்கள்’ என்பவற்றின் சுட்டுப்பொருள்
  choice: ‘அவர்’ என்பது ஆண்டவரையும், ‘அவர்கள்’ என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட மோசே, ஆரோன், சாமுவேல் ஆகியோரையும் குறிக்கின்றன.
  alternative: ‘அவர்கள்’ என்பது அந்தப் பிரதிநிதிகள் வழியாக இஸ்ரவேல் மக்களையும் பொதுவாகக் குறிக்கலாம்.
  rationale: உடனடி சூழலில் சங்கீதம் 99:6 மோசே, ஆரோன், சாமுவேல் ஆகியோரைப் பெயரிட்டு, அடுத்த வசனத்தில் அவர்களுடனான ஆண்டவரின் செயல்களைத் தொடர்கிறது. கவிதை ஓட்டத்தையும் சுட்டுப்பெயர்களின் பரப்பையும் தக்கவைக்க, பெயர்கள் முதன்மை உரையில் விரித்துச் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வாசிக்க எளிதானதாயும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘சாட்சிக் கட்டளைகள்’ மற்றும் ‘நியமம்’ ஆகியவை இரண்டு எபிரெயச் சட்டச் சொற்களுக்கிடையிலான வேறுபாட்டைத் தக்கவைக்கின்றன.
