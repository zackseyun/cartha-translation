  source_fidelity: The two plural imperatives, the communal possessive in “our God,” the footstool image, and the concluding declaration of holiness are retained. Rendering לַהֲדֹם as “பாதபீடத்தின் முன்” is a natural Tamil contextual rendering while leaving the image and its referent unspecified.
  naturalness: The draft is dignified and generally natural modern Tamil. “பாதபீடத்தின் முன்” is clearer and more idiomatic in this worship context than “பாதபீடத்தருகே.”
  terminology: “யாவே,” “கடவுள்,” “பாதபீடம்,” and “பரிசுத்தர்” appropriately preserve the divine name, the concrete metaphor, and the psalmic register. “பணிந்து வணங்குங்கள்” suitably expresses the bodily act of prostration/bowing without reducing it to an abstract term for worship.
