    issue: The main-text locative rendering “பாதபீடத்தருகே” is less direct than the worship-context sense expressed by “பாதபீடத்தின் முன்.”
    rationale: The Hebrew preposition permits contextual flexibility, but “முன்” is the more idiomatic Tamil formulation for bowing before a royal/divine footstool. The alternative remains appropriately noted in the footnote.
  - severity: low
    issue: The cultural footnote’s wording about the ark/sanctuary is syntactically awkward and can imply an unnecessarily specific identification.
    rationale: The source leaves the referent implicit. The note should present the ark and sanctuary only as possible associations and retain that restraint.
