  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְֽ֭/הִשְׁתַּחֲווּ לַ/הֲדֹ֥ם רַגְלָ֗י/ו קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/005.yaml
  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
translation:
  language: ta
  text: 'நம் கடவுளாகிய யாவேவை உயர்த்திப் போற்றுங்கள்;


    அவருடைய பாதபீடத்தின் முன்[a][b] பணிந்து வணங்குங்கள்;


    அவர் பரிசுத்தர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பாதபீடத்தின் முன்’ என்பதற்குப் பதிலாக ‘பாதபீடத்தருகே’ என்றும் மொழிபெயர்க்கலாம். இந்த வழிபாட்டுச் சூழலில் எபிரெய முன்னிடைச்சொல் ஒன்றுக்கு மேற்பட்ட பொருள்களை அனுமதிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவருடைய பாதபீடம்’ என்பது பூமியில் கடவுளுடைய ஆட்சியோடும் இருப்போடும் தொடர்புடைய உடன்படிக்கைப் பெட்டி அல்லது பரிசுத்த இடம் போன்றவற்றைக் குறிக்கலாம்; ஆனால் இவ்வசனம் அந்த உருவகத்தின் குறிப்பை வெளிப்படையாக அடையாளப்படுத்தவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: உயர்த்திப் போற்றுங்கள்
  rationale: רום என்பதன் பன்மை ஏவல் வடிவம் கடவுளை உயர்த்துதல் அல்லது மேன்மைப்படுத்துதல் என்ற பொருளைத் தருகிறது. தமிழில் ‘உயர்த்திப் போற்றுங்கள்’ என்பது அந்த உருவகத்தையும் வழிபாட்டுச் செயலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் தனிப்பட்ட இறைப்பெயர் இருப்பதை மறைக்காமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுளாகிய
  rationale: முதல் நபர் பன்மை உடைமைப் பின்னொட்டைத் தெளிவாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: וְהִשְׁתַּחֲווּ
  choice: பணிந்து வணங்குங்கள்
  rationale: שׁחה குறிக்கும் உடலைத் தாழ்த்தும் செயலையும் அதன் வழிபாட்டுப் பொருளையும் இரண்டையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לַהֲדֹם רַגְלָיו
  choice: அவருடைய பாதபீடத்தருகே
  rationale: הֲדֹם רַגְלָיו என்பதன் ‘அவருடைய கால்களின் பீடம்’ என்ற உருவகத்தை ‘பாதபீடம்’ எனத் தக்கவைக்கிறது. ל முன்னிடைச்சொல்லை இங்கு வழிபாடு நடைபெறும் இடத்தைக் குறிக்கும் ‘அருகே’ என மொழிபெயர்த்துள்ளது; பிற பொருள் வாய்ப்புகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: קָדוֹשׁ הוּא
  choice: அவர் பரிசுத்தர்
  rationale: பெயரடை-சுட்டுப்பெயர் அமைப்பின் வலியுறுத்தலைச் சுருக்கமான, கண்ணியமான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: ‘அவருடைய பாதபீடம்’ என்பதன் குறிப்பு
  choice: பிரதான உரையில் ‘பாதபீடம்’ என்ற உருவகத்தை விளக்கிக் குறுக்காமல் அப்படியே வைத்தல்
  alternative: அதை உடன்படிக்கைப் பெட்டி, சீயோன், ஆலயம் அல்லது பூமிக்குரிய பரிசுத்த இடம் என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: வசனம் பாதபீடத்தின் துல்லியமான குறிப்பைச் சொல்லவில்லை. எனவே ஒரு குறிப்பிட்ட விளக்கத்தை உரைக்குள் புகுத்தாமல், மூலத்தின் திறந்த உருவகத்தையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சங்கீத நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பணிந்து வணங்குங்கள்’ உடல் தாழ்த்துதலையும் வழிபாட்டையும் இணைக்கிறது; ‘பாதபீடம்’ மூல உருவகத்தைச் சுருக்காமல் காக்கிறது.
