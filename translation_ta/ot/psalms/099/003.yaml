  text: יוֹד֣וּ שִׁ֭מְ/ךָ גָּד֥וֹל וְ/נוֹרָ֗א קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/003.yaml
  text: Let them praise your great and fearsome name[c][b][a]; he is holy.
translation:
  language: ta
  text: அவர்கள் மகத்தானதும் அச்சமூட்டுவதுமான உமது பெயரைப் போற்றட்டும்[a][b]; அவர் பரிசுத்தர்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் மகத்தானதும் அச்சமூட்டுவதுமான உமது பெயருக்கு நன்றி செலுத்தட்டும்’; எபிரேய வினைச்சொல் ‘நன்றி செலுத்துதல்’ அல்லது ‘போற்றுதல்’ என்று பொருள்படலாம். இச்சூழலில் ‘போற்றுதல்’ சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அச்சமூட்டுவதுமான’ என்பதற்கு ‘பயபக்திக்குரிய’ என்றும் மொழிபெயர்க்கலாம்; எபிரேயச் சொல் பயமும் பயபக்தி கலந்த வியப்பும் எழச்செய்வதை விவரிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, எபிரேய சொல்வரிசைக்கு நெருக்கமாக, ‘பரிசுத்தர் அவர்.’
    reason: previous_rendering
lexical_decisions:
- source_word: יוֹדוּ
  choice: போற்றட்டும்
  rationale: ידה என்பதன் ஹிஃபில் முற்றுப்பெறாத பன்மை வடிவம் ‘நன்றி செலுத்துதல்’, ‘துதித்தல்/போற்றுதல்’ ஆகிய பொருள்களைத் தரலாம். இங்கு தேவனுடைய பெயர் செயப்படுபொருளாக இருப்பதால், பொதுவாக அவரது புகழை அறிவிக்கும் பொருளில் ‘போற்றட்டும்’ இயல்பாகப் பொருந்துகிறது; சூழலில் இது வேண்டுகோள்/கட்டளை நுணுக்கமுள்ள வடிவமாக எடுத்துக்கொள்ளப்படுகிறது.
- source_word: שִׁמְךָ
  choice: உமது ... பெயரை
  rationale: ‘பெயர்’ என்ற எபிரேய உருவகத்தை நேரடியாகத் தக்கவைக்கிறது; அது தேவனுடைய புகழ், வெளிப்படுத்தப்பட்ட இயல்பு ஆகிய விரிவான நுணுக்கங்களையும் சுமக்கிறது.
- source_word: גָּדוֹל
  choice: மகத்தான
  rationale: ‘பெரிய’ என்ற அடிப்படைப் பொருளை, தேவனுடைய பெயரைக் குறிக்கும் இச்சூழலில் இயல்பானதும் கண்ணியமானதுமான தமிழில் தருகிறது.
- source_word: וְנוֹרָא
  choice: அச்சம் ஊட்டுகிற
  rationale: ירא வேரிலிருந்து வந்த இச்சொல் பயத்தையும் பயபக்தி கலந்த வியப்பையும் தூண்டுவதைச் சுட்டுகிறது. ‘அச்சம் ஊட்டுகிற’ என்பது அதன் வலிமையான நுணுக்கத்தை மங்கச் செய்யாமல் நவீன தமிழில் தெளிவாக உள்ளது.
- source_word: קָדוֹשׁ
  choice: பரிசுத்தர்
  rationale: சங்கீதத்தின் வழிபாட்டு மற்றும் இறையியல் வலிமையைத் தக்கவைக்கும் நிலையான தமிழ் சொல்; தமிழில் மனிதரைக் குறிக்கும் உயர்திணை வாக்கிய அமைப்புக்கு ஏற்றவாறு பெயர்ப் பயனிலையில் வருகிறது.
- source_word: הוּא
  choice: அவர்
  rationale: தனி சுட்டுப்பெயர் தரும் வலியுறுத்தலைத் தக்கவைத்து, சூழலில் கர்த்தரையே சுட்டுகிறது. எபிரேயத்தின் சுருக்கமான தனி வாக்கிய அமைப்பும் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள הוּא (‘அவர்’) என்பதன் சுட்டுப்பொருள்
  choice: ‘அவர் பரிசுத்தர்’ என்று கர்த்தரைச் சுட்டுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதைத் தெய்வீகப் பெயருடன் இணைந்த வழிபாட்டு முழக்கமாக, ‘பரிசுத்தர் அவர்’ என்ற எபிரேய சொல்வரிசைக்கு நெருக்கமாகவும் தரலாம்.
  rationale: சங்கீதம் 99-இல் இது கர்த்தருடைய அரசாட்சியையும் இயல்பையும் மையப்படுத்தும் திரும்பவரும் முழக்கமாகச் செயல்படுகிறது. ‘அவர்’ என்பதை கர்த்தரைக் குறிக்கச் செய்வது உரையை விரிவுபடுத்தாமல் அதன் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சங்கீத நடையைப் பயன்படுத்துகிறது. ‘உமது’, ‘போற்றட்டும்’, ‘பரிசுத்தர்’ ஆகியவை வழிபாட்டு நயத்தைத் தக்கவைக்கின்றன; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை. எபிரேயத்தின் இரு சுருக்கமான கூறுகளுக்கிடையிலான உறவைத் தீர்மானிக்க ‘ஏனெனில்’ போன்ற இணைப்புச்சொல் சேர்க்காமல் அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
