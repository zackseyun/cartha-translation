source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵי/נוּ֮ אַתָּ֪ה עֲנִ֫יתָ֥/ם אֵ֣ל נֹ֭שֵׂא הָיִ֣יתָ לָ/הֶ֑ם וְ֝/נֹקֵ֗ם עַל עֲלִילוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/008.yaml
  text: O Yahweh our God[a], you answered them; you were a forgiving God to them[b], yet an avenger of their deeds.
translation:
  language: ta
  text: 'யாவே, எங்கள் கடவுளே,

    நீர் அவர்களுக்குப் பதிலளித்தீர்;

    அவர்களை மன்னிக்கும் கடவுளாக இருந்தீர்[a],

    ஆயினும் அவர்களுடைய செயல்களுக்காகப் பழிவாங்குபவராகவும் இருந்தீர்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்காகக் குற்றத்தைச் சுமந்து அகற்றும் கடவுளாக இருந்தீர்.” எபிரெயப் பங்கேற்புவினை, குற்றத்தைச் சுமந்து அகற்றுவதன் மூலம் மன்னித்தல் என்ற பொருளைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய செயல்களுக்காகப் பழிவாங்கிக்கொண்டும் இருந்தீர்.” எபிரெய வடிவத்தை ஒருவரைக் குறிக்கும் பெயர்ச்சொல் தன்மையிலோ, தொடர்ந்து நிகழும் செயலைக் குறிக்கும் வினைத் தன்மையிலோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலருக்கு வெளிப்படுத்தப்பட்ட இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהֵינוּ
  choice: எங்கள் கடவுளே
  rationale: முதலாம் நபர் பன்மை உடைமை விகுதியையும், இச்சூழலில் உள்ள விளிப்புத் தன்மையையும் தெளிவாகக் காட்டுகிறது.
- source_word: אַתָּה עֲנִיתָם
  choice: நீர் அவர்களுக்குப் பதிலளித்தீர்
  rationale: வலியுறுத்தப்பட்ட இரண்டாம் நபர் எழுவாயையும், ஜெப அழைப்புக்குப் பதிலளித்தல் என்ற சூழலுக்குப் பொருந்தும் ענה வினையின் அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: אֵל נֹשֵׂא הָיִיתָ לָהֶם
  choice: அவர்களை மன்னிக்கும் கடவுளாக இருந்தீர்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல்/சுமத்தல்’ என்றாலும், பாவம் அல்லது குற்றத்தை அகற்றி மன்னித்தல் என்ற அதன் வழக்குச் சார்ந்த பொருள் இங்கு இயல்பானது. היה + ל அமைப்பு அவர்களோடு கடவுள் கொண்டிருந்த உறவைச் சுட்டுகிறது.
- source_word: וְנֹקֵם
  choice: ஆயினும் ... பழிவாங்குபவராகவும்
  rationale: נקם பங்கேற்புவினை வடிவம் பழிவாங்குகிற ஒருவரைக் குறிக்கிறது. முந்தைய மன்னிப்புக் கூற்றோடு உள்ள பதற்றத்தை வெளிப்படுத்த וְ எதிர்மறை இணைப்பாக ‘ஆயினும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַל עֲלִילוֹתָם
  choice: அவர்களுடைய செயல்களுக்காக
  rationale: עֲלִילוֹת என்பது செயல்கள் அல்லது நடத்தைகளைக் குறிக்கலாம். பெயர்ச்சொல்லிலேயே ‘தீச்செயல்கள்’ என்று எதிர்மறையைச் சேர்க்காமல், பழிவாங்குதல் என்ற சூழல் அதன் குற்றத்தன்மையை வெளிப்படுத்த அனுமதிக்கிறது.
theological_decisions:
- issue: இறை மன்னிப்பும் பழிவாங்குதலும் ஒன்றாகக் கூறப்படுதல்
  choice: கடவுள் பதிலளித்து மன்னித்தார்; அதேவேளையில் அவர்களுடைய செயல்களுக்காகப் பழிவாங்குபவராகவும் இருந்தார் என்ற இரு கூற்றுகளும் தீர்க்கப்படாத பதற்றத்தோடு வைக்கப்பட்டுள்ளன.
  alternative: கடவுள் அவர்களை முழுமையாக மன்னித்து வேறு சிலரை மட்டுமே தண்டித்தார் என்று விளக்குவது; அல்லது மன்னிப்பைக் குற்றத்தைச் சுமத்தல் என்ற பொருளுக்கு மட்டும் கட்டுப்படுத்துவது.
  rationale: எபிரெய உரை மன்னிப்பையும் நீதியான பழிவாங்குதலையும் அருகருகே வைக்கிறது; அவற்றை யார்மீது அல்லது எவ்வாறு நிகழ்ந்தன என்று மொழிபெயர்ப்பிலேயே விளக்கித் தீர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதை ஒருமை வினைமுற்றுகளுடன் dignified ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கவிதை வரிப்பிரிப்புகள் எபிரெயக் கருத்துத் தொடர்களைப் பின்பற்றுகின்றன; ‘ஆயினும்’ என்பது மன்னிப்புக்கும் பழிவாங்குதலுக்கும் இடையிலான உண்மையான இறையியல் பதற்றத்தைத் தெளிவாக்குகிறது.
