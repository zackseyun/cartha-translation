id: PSA.99.1
reference: Psalms 99:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ יִרְגְּז֣וּ עַמִּ֑ים יֹשֵׁ֥ב כְּ֝רוּבִ֗ים תָּנ֥וּט הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/001.yaml
  text: Yahweh reigns[a]; let the peoples tremble. He sits enthroned upon the cherubim[b]; let the earth quake.
translation:
  language: ta
  text: யாவே அரசாளுகிறார்[a]; மக்களினங்கள் நடுங்கட்டும். அவர் கேருபீன்களின்மேல் வீற்றிருக்கிறார்[b]; பூமி அதிரட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களினங்கள் நடுங்குகின்றன ... பூமி அதிர்கிறது.” எபிரெய மொழியின் முற்றுப்பெறாத வினை வடிவங்களை விருப்பம் அல்லது கட்டளைப்போன்ற பொருளில் அல்லாமல், நிகழ்வைக் கூறும் வடிவமாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “கேருபீன்களின்மேல் வீற்றிருக்கிறார்” என்பதை “கேருபீன்களுக்கு மேலே வீற்றிருக்கிறார்” அல்லது “கேருபீன்களுக்கு இடையே வீற்றிருக்கிறார்” என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெயச் சொற்றொடர் யாவேக்கு உரிய அரச-ஆலயப் பட்டப்பெயராகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: מָלָךְ
  choice: அரசாளுகிறார்
  rationale: கவிதைநடையிலான அரசாட்சிப் பிரகடனத்தை இயல்பான நிகழ்காலத்தில் தருகிறது; ‘அரசரானார்’ என்ற தொடக்க அல்லது மாற்ற நுணுக்கத்தைத் தேவையின்றித் திணிக்கவில்லை.
- source_word: יִרְגְּזוּ
  choice: நடுங்கட்டும்
  rationale: யாவேயின் அரசாட்சிக்கான பதில்வினையாக வரும் வேண்டுதல் அல்லது கட்டளைப்போன்ற கவிதை வலிமையைப் பாதுகாக்கிறது; சுட்டுநிலை வாசிப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עַמִּים
  choice: மக்களினங்கள்
  rationale: பல மக்கள் குழுக்களைக் குறிக்கும் எபிரெயப் பன்மையை ‘நாடுகள்’ என்று அரசியல் பொருளில் மட்டும் சுருக்காமல் தருகிறது.
- source_word: יֹשֵׁב כְּרוּבִים
  choice: அவர் கேருபீன்களின்மேல் அரியணையில் வீற்றிருக்கிறார்
  rationale: வெறும் ‘அமர்ந்திருக்கிறார்’ என்பதைக் காட்டிலும் அரசர்-ஆலயப் பட்டத்தின் அரியணை நுணுக்கத்தை வெளிப்படுத்துகிறது; இடவுறவின் மாற்று விளக்கங்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
- source_word: כְּרוּבִים
  choice: கேருபீன்கள்
  rationale: இந்த விண்ணுலக உயிரினங்களுக்கான எபிரெயப் பன்மைப் பெயரைத் தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: תָּנוּט
  choice: அதிரட்டும்
  rationale: முந்தைய ‘நடுங்கட்டும்’ என்பதற்கு இணையான வேண்டுதல் அல்லது கட்டளைப்போன்ற கவிதை அமைப்பைப் பேணுகிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: இந்த அரசாட்சிச் சங்கீதத்தின் உலகளாவிய சூழலில் குறிப்பிட்ட ஒரு நாட்டைவிட முழு பூமியைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பட்டம் அல்ல, தேவனுடைய தனிப்பட்ட பெயரே உள்ளது. ஆகவே அதை மறைக்காமல் ஒலிபெயர்க்கிறது.
- issue: יִרְגְּזוּ மற்றும் תָּנוּט ஆகிய முற்றுப்பெறா வினைகளின் பொருள் வலிமை
  choice: 'வேண்டுதல் அல்லது கட்டளைப்போன்ற வாசிப்பு: ‘நடுங்கட்டும் ... அதிரட்டும்’'
  alternative: 'சுட்டுநிலை வாசிப்பு: ‘நடுங்குகின்றன ... அதிர்கிறது’'
  rationale: அரசாட்சிப் பிரகடனத்தைத் தொடர்ந்து வரும் கவிதைமிகு பதில்வினையை முதன்மை உரை வெளிப்படுத்துகிறது; எபிரெய இலக்கணத்தில் சாத்தியமான சுட்டுநிலை வாசிப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- issue: יֹשֵׁב כְּרוּבִים என்பதில் கேருபீன்களுடனான இடவுறவு
  choice: கேருபீன்களின்மேல் அரியணையில் வீற்றிருக்கிறார்
  alternative: கேருபீன்களுக்கு மேலே; கேருபீன்களுக்கு இடையே
  rationale: இது யாவேயின் அரசர்-ஆலயப் பட்டம். எபிரெயச் சொற்றொடர் துல்லியமான இடவுறவை முழுமையாக வரையறுக்காததால் மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அரியணையில் வீற்றிருக்கிறார்’ என்பது அரசாட்சியின் கருத்தை இயல்பாக வெளிப்படுத்துகிறது; ‘கேருபீன்கள்’ என்பது வழக்கமான வேதாகமச் சொல்லாட்சியாகப் பேணப்பட்டுள்ளது.
