source:
  edition: WLC
  text: יְ֭הוָה בְּ/צִיּ֣וֹן גָּד֑וֹל וְ/רָ֥ם ה֝֗וּא עַל כָּל הָֽ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/002.yaml
  text: Yahweh is great in Zion[a], and he is exalted above all the peoples.
translation:
  language: ta
  text: யாவே சீயோனில் மகத்தானவர்; மக்களினங்கள் அனைத்திற்கும் மேலாக அவர் உயர்ந்திருக்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களினங்கள் அனைத்தின்மீதும் அவர் உயர்ந்தவர்.”
    reason: עַל என்ற எபிரெய முன்னிடைச்சொல் ‘மேலாக’ என்றும் ‘மீதும்’ என்றும் பொருள்படக்கூடும்; இரண்டாவது வாசிப்பு மேலாதிக்கம் அல்லது ஆளுகை என்ற நுட்பத்தை அதிகம் வெளிப்படுத்துகிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּצִיּוֹן
  choice: சீயோனில்
  rationale: בְּ என்ற முன்னிடைச்சொல்லின் இடத்தைக் குறிக்கும் பொருளையும், சீயோனுடன் தொடர்புடைய யாவேயின் பிரசன்னம் மற்றும் அரசாட்சியையும் இயல்பாகக் காட்டுகிறது.
- source_word: גָּדוֹל
  choice: மகத்தானவர்
  rationale: அளவு மட்டுமல்லாமல் மேன்மையையும் புகழுக்குரிய பெருமையையும் குறிக்கும் கவிதைநடைக்கு ஏற்ற இயல்பான தமிழ் சொல்.
- source_word: וְרָם הוּא
  choice: அவர் உயர்ந்திருக்கிறார்
  rationale: רָם என்பதன் உயர்வு மற்றும் மேன்மை என்ற பொருளையும், הוּא தரும் வெளிப்படையான வலியுறுத்தலையும் தெளிவான தமிழில் காக்கிறது.
- source_word: עַל כָּל הָעַמִּים
  choice: மக்களினங்கள் அனைத்திற்கும் மேலாக
  rationale: עַל இங்கு மேன்மை அல்லது மேலாதிக்கத்தைக் குறிக்கிறது; עַמִּים என்பது அரசியல் நாடுகளை மட்டும் அல்லாமல் பல்வேறு மக்கள் குழுக்களைக் குறிப்பதால் ‘மக்களினங்கள்’ என்று மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரையில் ஒரு பொதுப் பட்டம் அல்ல, தேவனுடைய தனிப்பட்ட பெயரே உள்ளது. ஆகவே அதை ‘கர்த்தர்’ என்று மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: עַל என்பதிலுள்ள மேன்மை மற்றும் ஆளுகை சார்ந்த நுட்பம்
  choice: மக்களினங்கள் அனைத்திற்கும் மேலாக
  alternative: மக்களினங்கள் அனைத்தின்மீதும்
  rationale: இந்தச் சூழலில் சொல் உயர்ந்த நிலை மற்றும் மேலாதிக்கம் இரண்டையும் உணர்த்தலாம். முதன்மை உரை உயர்ந்த நிலையை இயல்பாகச் சொல்கிறது; மாற்று வாசிப்பு ஆளுகை சார்ந்த நுட்பத்தைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான புகழ்ச்சி நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘மகத்தானவர்’ மற்றும் ‘உயர்ந்திருக்கிறார்’ ஆகியவை கவிதைநடையின் இணை அமைப்பைக் காக்கின்றன; அரிதான சமயச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
