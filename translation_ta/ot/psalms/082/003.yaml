source:
  edition: WLC
  text: שִׁפְטוּ דַ֥ל וְ/יָת֑וֹם עָנִ֖י וָ/רָ֣שׁ הַצְדִּֽיקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/003.yaml
  text: Defend the weak and the fatherless; vindicate the afflicted and the poor.
translation:
  language: ta
  text: நலிந்தவனுக்கும் தந்தையற்றவனுக்கும் நீதி வழங்குங்கள்[a]; துன்புறுகிறவனுக்கும் வறியவனுக்கும் நியாயம் கிடைக்கச் செய்யுங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “நலிந்தவனுக்கும் தந்தையற்றவனுக்கும் நியாயமான தீர்ப்பளியுங்கள்.”'
    reason: שִׁפְטוּ என்பதன் அடிப்படைப் பொருள் ‘தீர்ப்பளியுங்கள்’; சூழலில் அது அவர்களுக்கு நீதி வழங்குவதைக் குறிக்கிறது.
  - marker: b
    text: 'அல்லது: “துன்புறுகிறவனையும் வறியவனையும் வழக்கில் நியாயப்படுத்துங்கள்.”'
    reason: הַצְדִּיקוּ என்பது ஒருவரை நீதிமன்றத் தீர்ப்பில் நியாயமானவர் அல்லது குற்றமற்றவர் என்று நிலைநாட்டுவதைக் குறிக்கலாம்.
lexical_decisions:
- source_word: שִׁפְטוּ
  choice: நீதி வழங்குங்கள்
  rationale: இது பன்மை ஏவல் வடிவில் ‘தீர்ப்பளியுங்கள்/நியாயம் செய்யுங்கள்’ என்று பொருள்படும். இச்சூழலில் நலிந்தவர்களின் வழக்கை நீதியாக விசாரித்து அவர்களுக்கு நீதி வழங்குவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: דַּל
  choice: நலிந்தவன்
  rationale: பொருளாதார வறுமையை மட்டும் அல்லாமல் பலமற்ற, தாழ்ந்த நிலையையும் குறிக்கக்கூடிய சொல்லின் பரப்பைத் தக்கவைக்கிறது.
- source_word: יָתוֹם
  choice: தந்தையற்றவன்
  rationale: எபிரெயச் சொல் குறிப்பாகத் தந்தையை இழந்த, பாதுகாப்பற்ற பிள்ளையைக் குறிக்கிறது; பொதுவான ‘அனாதை’ என்பதைக் காட்டிலும் மூலத்தின் குறிப்பைச் சுமக்கிறது.
- source_word: עָנִי
  choice: துன்புறுகிறவன்
  rationale: ‘ஏழை’ என்பதோடு துன்புறுத்தப்பட்ட அல்லது ஒடுக்கப்பட்ட நிலையையும் குறிக்கலாம்; அடுத்துள்ள רָשׁ என்பதிலிருந்து வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: רָשׁ
  choice: வறியவன்
  rationale: வசதியற்ற, ஏழ்மை நிலையில் உள்ளவரைக் குறிக்கும் நேரடியான இயல்பான தமிழ்.
- source_word: הַצְדִּיקוּ
  choice: நியாயம் கிடைக்கச் செய்யுங்கள்
  rationale: ஹிஃபீல் பன்மை ஏவல் வடிவின் ‘நீதிமானென்று தீர்ப்பளி/குற்றமற்றவர் என நிலைநாட்டு/வழக்கில் நியாயப்படுத்து’ என்ற நீதிமன்றப் பொருளை, தமிழில் தவறாக ‘செயலைச் சரியெனக் காட்டுங்கள்’ என்று புரியாதவாறு வெளிப்படுத்துகிறது.
theological_decisions:
- issue: הַצְדִּיקוּ என்பதன் நீதிமன்ற மற்றும் ஒழுக்கவியல் நுணுக்கம்
  choice: நியாயம் கிடைக்கச் செய்யுங்கள்
  alternative: நீதிமான்களென்று தீர்ப்பளியுங்கள்
  rationale: இவ்வசனம் பலவீனரின் உரிமையை நீதித்தீர்ப்பால் நிலைநாட்டும்படி அழைக்கிறது. அவர்கள் இயல்பாகவே ஒழுக்கரீதியில் நீதிமான்கள் என்று முன்கூட்டியே அறிவிப்பதாக மொழிபெயர்க்காமல், நீதிமன்றச் சூழலிலுள்ள ‘வழக்கில் நியாயப்படுத்துதல்/விடுவித்தல்’ என்ற திறந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க பன்மை ஏவல் வடிவம் பயன்படுத்தப்பட்டுள்ளது. இணையான இரு அரையடிகளின் அமைப்பு காக்கப்பட்டு, ‘நலிந்தவன்/துன்புறுகிறவன்’ மற்றும் ‘வறியவன்’ ஆகிய சொற்களின் நுண்ணிய வேறுபாடும் பாதுகாக்கப்பட்டுள்ளது.
