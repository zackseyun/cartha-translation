  text: אֲֽנִי אָ֭מַרְתִּי אֱלֹהִ֣ים אַתֶּ֑ם וּ/בְנֵ֖י עֶלְי֣וֹן כֻּלְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/006.yaml
  text: I said, “You are gods, and all of you are sons of the Most High.”
translation:
  language: ta
  text: 'நான் சொன்னேன்: “நீங்கள் தெய்வங்கள்; நீங்கள் அனைவரும் உன்னதமானவரின் மகன்கள்.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: தெய்வங்கள்
  rationale: இங்கு பன்மை முன்னிலைப் பெயரான אַתֶּם உடன் வரும்தால், வடிவத்தையும் சூழலின் நேரடி அழைப்பையும் காக்கும் வகையில் பன்மையாக மொழிபெயர்க்கப்பட்டது.
- source_word: בְנֵי עֶלְיוֹן
  choice: உன்னதமானவரின் மகன்கள்
  rationale: בְנֵי என்பதன் உறவுநிலைப் பன்மையையும், עֶלְיוֹן என்ற தெய்வீகப் பட்டத்தின் பொருளையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: כֻּלְּכֶם
  choice: நீங்கள் அனைவரும்
  rationale: இரண்டாம் நபர் ஆண்பால் பன்மையை உள்ளடக்கிய ‘உங்களெல்லாரும்’ என்ற வலியுறுத்தலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֱלֹהִים என்பதன் அடையாளம்
  choice: தெய்வங்கள்
  alternative: தேவர்கள் / கடவுள்கள் / ஆட்சியாளர்கள்
  rationale: எபிரேயச் சொல் இவ்வசனத்தில் யாரைக் குறிக்கிறது என்பதை மொழிபெயர்ப்பிலேயே தீர்மானிக்காமல், அதன் உண்மையான பொருள் மற்றும் விளக்கத் திறப்பைத் தக்கவைக்கிறது.
- issue: ‘உன்னதமானவரின் மகன்கள்’ என்ற சொற்றொடரின் இயல்பு
  choice: உறவைக் குறிக்கும் சொல்லாட்சியை அப்படியே வைத்தல்
  alternative: உன்னதமானவருக்குரியவர்கள்
  rationale: மூலத்தின் குடும்ப உருவகத்தையும் அதிலுள்ள இறையியல் அழுத்தத்தையும் விளக்கவுரையால் மெலிதாக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையான, கண்ணியமான கவிதைநடை. மூலத்தின் இரு நேரடி வாக்கியங்களும் அவற்றுக்கிடையிலான இணைப்பும் இயல்பாகப் பாதுகாக்கப்பட்டுள்ளன.
