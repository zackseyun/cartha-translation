source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/001.yaml
  text: A psalm of Asaph[a]. God stands in the divine assembly; in the midst of the gods he judges.
translation:
  language: ta
  text: 'ஆசாபின் சங்கீதம்.


    கடவுள் இறைச் சபையில் நிற்கிறார்;

    தெய்வங்களின்[a] நடுவில் அவர் நியாயந்தீர்க்கிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெய்வீக உயிர்கள்.” இங்குள்ள “தெய்வங்கள்” என்பது மனித நீதிபதிகள் அல்லது ஆட்சியாளர்களைக் குறிக்கிறது என்றும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: இரண்டாவது אֱלֹהִים என்பதற்கான முக்கிய மாற்றுப் புரிதல்களைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: சங்கீதத் தலைப்புகளில் வரும் வழக்கமான வகைப்பெயர்; தமிழில் மரபாக அறியப்பட்டும் இயல்பாகவும் உள்ளது.
- source_word: לְאָסָף
  choice: ஆசாபின்
  rationale: לְ குறிக்கும் ஆசிரியத்துவம், உரிமை அல்லது தொடர்பு ஆகியவற்றில் ஒன்றைத் திட்டவட்டமாக நிர்ணயிக்காமல், ஆசாபுடன் உள்ள தொடர்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים (முதல் occurrence)
  choice: கடவுள்
  rationale: இதனுடன் வரும் ஒருமை வடிவங்களான נִצָּב மற்றும் יִשְׁפֹּט, இங்கு ஒருமை எழுவாயாக இஸ்ரவேலின் கடவுளைக் குறிக்கின்றன.
- source_word: נִצָּב
  choice: நிற்கிறார்
  rationale: நீதித்தீர்ப்புக்கான சபையில் கடவுள் நிற்கும் காட்சியை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: בַּעֲדַת אֵל
  choice: இறைச் சபையில்
  rationale: கூடியிருக்கும் சபை என்ற עֵדָה-வின் பொருளையும், אֵל தரும் தெய்வீகச் சூழலையும் சுருக்கமாக வெளிப்படுத்துகிறது; அதை மனித நீதிமன்றம் என்று முன்கூட்டியே வரையறுக்கவில்லை.
- source_word: בְּקֶרֶב
  choice: நடுவில்
  rationale: ஒரு குழுவினருக்கு மத்தியில் கடவுள் நிற்பதைச் சுட்டும் இடவியல் படிமத்தைப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים (இரண்டாம் occurrence)
  choice: தெய்வங்கள்
  rationale: முதல் אֱלֹהִים-இலிருந்து வேறுபட்ட பன்மைக் குழுவை நேரடியாகக் காட்டுகிறது. இதை 'தெய்வீக உயிர்கள்' என்றோ மனித நீதிபதிகள் அல்லது ஆட்சியாளர்கள் என்றோ புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִשְׁפֹּט
  choice: நியாயந்தீர்க்கிறார்
  rationale: שפט என்பதன் நீதித்துறைச் செயல்பாட்டைத் தெளிவாகக் காட்டி, வசனத்தின் நீதிமன்றச் சூழலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இரண்டாவது אֱלֹהִים யாரைக் குறிக்கிறது?
  choice: முதன்மை உரையில் “தெய்வங்கள்”
  alternative: “தெய்வீக உயிர்கள்”; மனித நீதிபதிகள் அல்லது ஆட்சியாளர்கள்
  rationale: ஒருமைச் செயல்வடிவங்களுடன் வரும் முதல் אֱלֹהִים கடவுளைக் குறிக்கிறது; இரண்டாவது சொல் அவர் நடுவில் நின்று தீர்ப்பளிக்கும் பன்மைக் குழுவைக் குறிக்கிறது. மூலச்சொல்லின் வலிமையையும் வசனத்தின் தெய்வீகச் சபைச் சூழலையும் காக்க “தெய்வங்கள்” பயன்படுத்தப்படுகிறது; வேறு முக்கியப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. எபிரெயக் கவிதையின் இணை அமைப்பை இரண்டு வரிகளாக வைத்திருக்கிறது. “தெய்வங்கள்” ஏற்படுத்தும் உண்மையான பொருள் இழுபறியை முதன்மை உரையில் நீக்காமல், தேவையான விளக்கத்தை அடிக்குறிப்பில் வழங்குகிறது.
