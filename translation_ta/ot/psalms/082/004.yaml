  text: פַּלְּטוּ דַ֥ל וְ/אֶבְי֑וֹן מִ/יַּ֖ד רְשָׁעִ֣ים הַצִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/004.yaml
  text: Rescue the poor and needy[a]; deliver them from the hand of the wicked.
translation:
  language: ta
  text: 'ஏழைகளையும் தேவையுள்ளவர்களையும்[a] காப்பாற்றுங்கள்;

    பொல்லாதவர்களின் கையிலிருந்து அவர்களை விடுவியுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலவீனர்களையும் தேவையுள்ளவர்களையும்.” எபிரேயச் சொல் דַּל (தால்) ‘ஏழை’ அல்லது ‘பலவீனன்’ என்று பொருள்படலாம்; அது வறுமையோடு பாதுகாப்பின்மையையும் சமூக வலிமையின்மையையும் சுட்டலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְּטוּ
  choice: விடுவியுங்கள்
  rationale: פלט என்பதன் பன்மை ஏவல் வடிவம், ஆபத்திலுள்ள ஒருவரைப் பாதுகாப்பாக விடுவிக்கச் செயல்படுமாறு கட்டளையிடுகிறது. தமிழில் ‘விடுவியுங்கள்’ என்பது செயற்பூர்வமான தலையீட்டையும் அடுத்துவரும் இணை ஏவலிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: דַל
  choice: ஏழை
  rationale: דַּל என்பது ஏழை, பலவீனன், சமூக அதிகாரமற்றவன் ஆகிய பொருள்களைத் தரக்கூடும். אֶבְיוֹן உடன் நீதிசார் சூழலில் வருவதால் ‘ஏழை’ முதன்மைப் பொருளாகத் தேர்ந்தெடுக்கப்பட்டது; ‘பலவீனன்’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: אֶבְיוֹן
  choice: தேவையிலிருப்பவன்
  rationale: אֶבְיוֹן என்பது பற்றாக்குறையிலும் வறுமையிலும் இருப்பவரைக் குறிக்கிறது. ‘தேவையிலிருப்பவன்’ என்பது דַל என்பதற்கான ‘ஏழை’ என்பதுடன் முற்றிலும் ஒன்றாக்காமல் அதன் தனிப்பொருளைக் காக்கிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: எவருடைய அதிகாரம் அல்லது பிடியிலிருந்து விடுவித்தல் என்ற எபிரேய உருவகத்தை ‘கையிலிருந்து’ நேரடியாகவும் தமிழில் புரியத்தக்க வகையிலும் காக்கிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: ஒழுக்கரீதியாகக் குற்றமுள்ள, அநீதி செய்கிறவர்களைக் குறிக்கும் பன்மைச் சொல்லை பாலினத்தைச் சேர்க்காமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: הַצִּילוּ
  choice: மீட்டுக்கொள்ளுங்கள்
  rationale: נצל என்பதன் பன்மை ஏவல் வடிவம் ஆபத்து அல்லது பகைவரின் அதிகாரத்திலிருந்து மீட்பதைக் குறிக்கிறது. ‘மீட்டுக்கொள்ளுங்கள்’ முதல் ஏவலுடன் இணையாக இருந்து, இரண்டு தனித்த கட்டளைகளையும் காக்கிறது.
theological_decisions:
- issue: இணையாக வரும் இரண்டு எபிரேய ஏவல்களின் கவித்துவ வலிமையைப் பேணுதல்
  choice: ‘விடுவியுங்கள்; ... மீட்டுக்கொள்ளுங்கள்’ என இரண்டு ஒருங்கிணைந்த கட்டளைகளாக வழங்குதல்
  alternative: ‘பொல்லாதவர்களின் கையிலிருந்து ஏழையையும் தேவையிலிருப்பவனையும் மீட்டுக்கொள்ளுங்கள்’ என்று ஒரே கட்டளையாகச் சுருக்குதல்
  rationale: எபிரேயத்தில் இரண்டு ஏவல் வினைகள் உள்ளன. அவற்றைத் தனித்தனியாகக் காப்பது நலிந்தவர்களுக்காகச் செயல்பட வேண்டிய நீதிசார் அவசரத்தையும் கவிதை இணைநிலையையும் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான கட்டளை நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயத்தின் இரு இணை ஏவல்களும் ‘விடுவியுங்கள்’ மற்றும் ‘மீட்டுக்கொள்ளுங்கள்’ எனப் பேணப்பட்டுள்ளன; ‘கையிலிருந்து’ என்ற மூல உருவகமும் தக்கவைக்கப்பட்டுள்ளது.
