lexical_decisions:
- source_word: קוּמָה
  choice: எழுந்தருளும்
  rationale: קום என்பதன் கட்டளை வடிவம் கடவுளை நோக்கி, அவர் தலையிட வேண்டுமென்ற அவசர வேண்டுகோளாக வருகிறது. ‘எழுந்தருளும்’ என்பது மரியாதையான நேரடி அழைப்பையும் செயலில் இறங்கும் பொருளையும் இயல்பாகத் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: ஒருமை கட்டளைகளும் முன்னிலைப் பெயரும் இங்கு ஒருமை அழைப்பைக் காட்டுகின்றன. ‘கடவுளே’ என்பது தமிழில் இயல்பான நேரடி விளி.
- source_word: שָׁפְטָה
  choice: நீதி வழங்கும்
  rationale: שׁפט என்பதில் நீதித்தீர்ப்பும் அரசாட்சி சார்ந்த நியாயம் நிலைநாட்டுதலும் அடங்குகின்றன. ‘நீதி வழங்கும்’ என்பது வெறும் தீர்ப்பு அறிவிப்பதைவிட இச்சூழலின் பரந்த நீதிச் செயலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָאָרֶץ
  choice: பூமிக்கு
  rationale: ‘எல்லா நாடுகள்’ என்பதோடு இணையும் உலகளாவிய சூழல் காரணமாக ‘நாடு’ என்பதைவிட ‘பூமி’ பொருத்தமானது. தமிழில் ‘பூமிக்கு நீதி வழங்கும்’ என்பது இயல்பான வேற்றுமை அமைப்பு.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: אַתָּה
  choice: நீரே
  rationale: எபிரெய மொழியின் வெளிப்படையான முன்னிலைப் பெயரிலுள்ள வலியுறுத்தலை ‘நீரே’ காக்கிறது; கடவுளை நோக்கிய மரியாதை நடையும் பேணப்படுகிறது.
- source_word: תִנְחַל
  choice: உரிமைச் சொத்தாகப் பெறுவீர்
  rationale: נחל என்பது சுதந்தரமாகப் பெறுதல் அல்லது உரிமையாக உடைமையாக்குதல் என்ற பொருளைக் கொண்டது. ‘உரிமைச் சொத்தாகப் பெறுவீர்’ என்பது தமிழில் தெளிவாக இருந்து, மரபுரிமை மற்றும் அரசுரிமை நுட்பங்களையும் அளவுக்கு மீறாமல் காக்கிறது.
- source_word: בְּכָל הַגּוֹיִם
  choice: எல்லா நாடுகளையும்
  rationale: נחל உடன் வரும் இத்தொடர் பெறப்படும் உடைமையின் முழு பரப்பாக இயல்பாகப் புரிகிறது. ‘எல்லா நாடுகளையும்’ அதன் பன்மை மற்றும் உலகளாவிய தன்மையைப் பேணுகிறது.
theological_decisions:
- issue: תִנְחַל בְּכָל הַגּוֹיִם என்பதில் நாடுகளுடன் கடவுளுக்குள்ள உறவு
  choice: நீரே எல்லா நாடுகளையும் உரிமைச் சொத்தாகப் பெறுவீர்
  alternative: எல்லா நாடுகளும் உமக்குச் சொந்தமானவை
  rationale: பூமிக்கு நீதி வழங்கும்படி செய்யப்படும் வேண்டுகோளுக்கு, நாடுகள் அனைத்தின்மீதும் கடவுளுக்குள்ள உலகளாவிய உரிமையே காரணமாகக் கொடுக்கப்படுகிறது. எதிர்கால வினை வடிவத்தையும் נחל என்பதிலுள்ள பெறுதல்/உரிமையாக்குதல் நுட்பத்தையும் மொழிபெயர்ப்பு காக்கிறது; அதை நிலையான சொந்தம் என்ற கருத்தாக மட்டும் மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான மரியாதை நடை பயன்படுத்தப்பட்டுள்ளது. ‘எழுந்தருளும்’, ‘நீரே’, ‘பெறுவீர்’ ஆகியவை ஒரே மரியாதை நிலையைப் பேணுகின்றன. இரு அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
