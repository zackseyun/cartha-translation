  text: How long will you judge unjustly and show partiality to the wicked? Selah[a]
translation:
  language: ta
  text: 'எவ்வளவு காலம் நீங்கள் அநியாயமாகத் தீர்ப்பளிப்பீர்கள்,

    பொல்லாதவர்களுக்குப் பாரபட்சம் காட்டுவீர்கள்?[a]

    சேலா'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “பொல்லாதவர்களின் முகத்தை உயர்த்துதல்”; இது அவர்களுக்குச் சாதகம் காட்டுதல் அல்லது பாரபட்சம் காட்டுதல் என்ற மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: எவ்வளவு காலம்
  rationale: கண்டனத்துடன் கேட்கப்படும் கால வினாவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִּשְׁפְּטוּ
  choice: தீர்ப்பளித்து
  rationale: நீதித்துறைச் சூழலையும், தொடர்ந்து நடைபெறும் செயல்மீதான கண்டனத்தையும் தெளிவாகக் காக்கிறது.
- source_word: עָוֶל
  choice: அநியாயமாக
  rationale: பெயர்ச்சொல் இங்கு வினையடைப் பொருளில் வந்து தீர்ப்பின் அநீதியான தன்மையைக் குறிக்கிறது.
- source_word: וּפְנֵי רְשָׁעִים תִּשְׂאוּ
  choice: பொல்லாதவர்களுக்குப் பாரபட்சம் காட்டுவீர்கள்
  rationale: ‘பொல்லாதவர்களின் முகத்தை உயர்த்துதல்’ என்ற எபிரெய மொழிமரபின் நீதித்துறைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: ஒழுக்கரீதியாகக் குற்றமுள்ளவர்களைக் குறிக்கும் பொதுவான வேதாகமப் பதத்தை, சட்டரீதியான குற்றவாளிகள் என்று மிகையாகக் குறுக்காமல் வழங்குகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான பொருளும் செயல்பாடும் உறுதியற்றவை; ஆகவே விளக்கிப் பொருள்கூறாமல் ஒலிபெயர்ப்பு காக்கப்படுகிறது.
theological_decisions:
- issue: பொல்லாதவர்களுக்கு ஆதரவான நீதித்துறைப் பாரபட்சம்
  choice: பொல்லாதவர்களுக்குப் பாரபட்சம் காட்டுவீர்கள்
  alternative: பொல்லாதவர்களுக்கு ஆதரவு காட்டுவீர்கள்
  rationale: இந்த வசனம் ஊழலான தீர்ப்பைச் சாடுகிறது. ‘பாரபட்சம்’ என்பது நீதித்துறைச் சூழலையும் ஒழுக்கக் கண்டனத்தையும் கூடுதல் கோட்பாட்டுக் கருத்துகள் இன்றி தெளிவாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்கு எளிதில் புரியும், அதேவேளை சங்கீதத்தின் கண்ணியமான கண்டனத் தொனியைக் காக்கும் நடை. எபிரெய இணை அமைப்பை இயல்பான இரு அடிகளாக வழங்குகிறது.
