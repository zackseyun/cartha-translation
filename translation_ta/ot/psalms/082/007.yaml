source:
  edition: WLC
  text: אָ֭כֵן כְּ/אָדָ֣ם תְּמוּת֑וּ/ן וּ/כְ/אַחַ֖ד הַ/שָּׂרִ֣ים תִּפֹּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/007.yaml
  text: Nevertheless[a], you will die like men[b], and fall like one of the princes.
translation:
  language: ta
  text: 'ஆயினும், மனிதனைப் போல[a] நீங்கள் இறப்பீர்கள்;

    பிரபுக்களில்[b] ஒருவனைப் போல வீழ்வீர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இச்சொற்றொடர் பொதுவாக மனிதகுலத்தைக் குறிப்பதற்குப் பதிலாக முதல் மனிதனைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டால், “ஆதாமைப் போல.”
    reason: alternative_reading
  - marker: b
    text: “பிரபுக்கள்” என்பதற்குப் பதிலாக, “ஆட்சியாளர்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: ஆயினும்
  rationale: முந்தைய உயர்ந்த நிலை குறித்த அறிவிப்புக்கும் இங்கு வழங்கப்படும் மரணத் தீர்ப்புக்கும் இடையிலான வலுவான முரண்பாட்டை இயல்பான, கண்ணியமான தமிழில் காட்டுகிறது.
- source_word: כְּאָדָם
  choice: மனிதனைப் போல
  rationale: אָדָם என்ற ஒருமைச் சொல்லின் பிரதிநிதித்துவ வலிமையைத் தக்கவைத்து, சாதாரண மனிதருக்குரிய மரண நிலையைக் குறிக்கிறது. ‘ஆதாமைப் போல’ என்ற வாசிப்பும் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: תְּמוּתוּן
  choice: நீங்கள் இறப்பீர்கள்
  rationale: מות என்பதன் இரண்டாம் நபர் பன்மை வினை வடிவை, தீர்ப்பை முன்னறிவிக்கும் தெளிவான எதிர்கால வாக்கியமாக மொழிபெயர்க்கிறது.
- source_word: וּכְאַחַד
  choice: ஒருவனைப் போல
  rationale: ஒரு குழுவின் உறுப்பினர்களில் ஒருவரோடு செய்யப்படும் ஒப்பீட்டைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַשָּׂרִים
  choice: பிரபுக்கள்
  rationale: שׂרים குறிக்கும் உயர்நிலை ஆட்சியாளர்கள் அல்லது அதிகாரத் தலைவர்கள் என்ற பொருளையும், சங்கீதத்தின் அதிகாரிகள் மீதான தீர்ப்புச் சூழலையும் தக்கவைக்கிறது.
- source_word: תִּפֹּלוּ
  choice: வீழ்வீர்கள்
  rationale: נפל என்பதன் உருவகப் பொருளான தீர்ப்பின்கீழ் ஏற்படும் வீழ்ச்சியைத் தக்கவைக்கும் இயல்பான தமிழ் சொல்.
theological_decisions:
- issue: כְּאָדָם என்பதில் אָדָם-ஐ எவ்வாறு புரிந்துகொள்வது
  choice: பொதுமனிதனைப் பிரதிநிதித்துவப்படுத்தும் ‘மனிதன்’ என்ற வாசிப்பு
  alternative: முதல் மனிதனான ‘ஆதாம்’ பற்றிய குறிப்பாக வாசித்தல்
  rationale: ‘தேவர்கள்/உன்னதமானவரின் மகன்கள்’ என்று அழைக்கப்பட்டவர்களுக்கும் அவர்களுடைய உண்மையான மனித மரணநிலைக்கும் உள்ள முரண்பாடே உடனடிச் சூழலில் முதன்மையாக உள்ளது. இருப்பினும், ஆதாமைக் குறிக்கும் சாத்தியமான சொல்லாட்டத்தை அடிக்குறிப்பு மூலம் திறந்தவாறே வைக்கிறது.
- issue: הַשָּׂרִים என்பதன் அதிகாரப் பட்டம்
  choice: பிரபுக்கள்
  alternative: ஆட்சியாளர்கள்
  rationale: மூலச்சொல் உயர்நிலைப் பிரபுக்கள், ஆட்சியாளர்கள் அல்லது அதிகாரிகளைக் குறிக்கலாம். ‘பிரபுக்கள்’ அதன் பாரம்பரிய உயர்நிலைப் பொருளைத் தக்கவைக்கிறது; பரந்த மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெய மூலத்தின் இரண்டாம் நபர் பன்மை, ஒருமை ஒப்பீடுகள், மற்றும் ‘வீழ்தல்’ என்ற உருவகம் பாதுகாக்கப்பட்டுள்ளன.
