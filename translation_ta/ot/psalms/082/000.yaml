base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/000.yaml
  text: A psalm of Asaph[a]. God stands in the assembly of God; in the midst of the gods he judges.
translation:
  language: ta
  text: ஆசாபின் சங்கீதம். கடவுள் கடவுளின் சபையில் நிற்கிறார்; தெய்வங்களின்[a] நடுவில் அவர் தீர்ப்பளிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெய்வீக உயிர்கள்.” இங்கே “தெய்வங்கள்” என்பது மனித நீதிபதிகளையோ ஆட்சியாளர்களையோ குறிக்கிறது என்றும் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: ஆசாபின் சங்கீதம்
  rationale: לְ can mark authorship, association, or dedication; the concise conventional Tamil heading preserves the broad association without expanding beyond the source.
- source_word: אֱלֹהִים נִצָּב
  choice: கடவுள் ... நிற்கிறார்
  rationale: The first אֱלֹהִים is singular in sense, as indicated by the singular participle נִצָּב; ‘நிற்கிறார்’ retains the judicial scene and dignified register.
- source_word: בַּעֲדַת־אֵל
  choice: தெய்வ சபையில்
  rationale: Literally ‘in the assembly of El/God’; ‘தெய்வ சபை’ naturally conveys an assembly belonging to or characterized by the divine realm while avoiding the awkward repetition ‘கடவுளின் சபை’.
- source_word: בְּקֶרֶב אֱלֹהִים
  choice: தெய்வங்களின் நடுவில்
  rationale: Here אֱלֹהִים is grammatically and contextually plural; the rendering preserves the text’s genuine ambiguity about the identity of these beings.
- source_word: יִשְׁפֹּט
  choice: தீர்ப்பளிக்கிறார்
  rationale: The verb denotes judging or rendering judgment; the present tense suits the Hebrew poetic depiction and reads naturally in Tamil.
theological_decisions:
- issue: Identity of אֱלֹהִים in the final clause
  choice: தெய்வங்கள்
  alternative: தெய்வீக உயிர்கள்; மனித நீதிபதிகள் அல்லது ஆட்சியாளர்கள்
  rationale: The main text retains the direct plural sense and does not settle whether the referents are heavenly beings or human authorities; the alternatives are documented in a footnote.
- issue: Meaning of עֲדַת־אֵל
  choice: தெய்வ சபை
  alternative: கடவுளின் சபை
  rationale: Both are grammatically possible. ‘தெய்வ சபை’ preserves the heavenly-council resonance without forcing a specific doctrinal model.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவித்துவமும் நீதிமன்றக் காட்சியின் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘தெய்வங்கள்’ என்ற சொல்லின் சாத்தியமான தவறான புரிதலை அடிக்குறிப்பு விளக்குகிறது; மூலத்தின் தெளிவின்மை முதன்மை உரையில் தீர்த்துவைக்கப்படவில்லை.
