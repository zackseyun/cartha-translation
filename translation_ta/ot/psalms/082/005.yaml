  text: அவர்கள் அறிவதில்லை; புரிந்துகொள்வதுமில்லை. அவர்கள் இருளில் நடமாடுகிறார்கள்; பூமியின்[b] எல்லா அடித்தளங்களும் நிலைகுலைகின்றன[a].
