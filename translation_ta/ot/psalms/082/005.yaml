lexical_decisions:
- source_word: לֹא יָדְעוּ
  choice: அவர்கள் அறியவில்லை
  rationale: ידע என்பதன் அடிப்படைப் பொருள் ‘அறிதல்’. எபிரெய நிறைவுவினை வடிவம் இங்கு கடந்தகால நிகழ்வை மட்டும் அல்லாமல், தொடரும் அறியாமை நிலையைக் காட்டுவதால் இயல்பான தமிழ் நிகழ்நிலைப் பொருளில் மொழிபெயர்க்கப்பட்டது.
- source_word: וְלֹא יָבִינוּ
  choice: புரிந்துகொள்ளவும் இல்லை
  rationale: בין என்பதன் Hiphil வடிவம் ‘புரிந்துகொள், பகுத்துணர்’ எனப் பொருள்படும். முந்தைய ‘அறியவில்லை’ என்பதோடு உள்ள இணைநிலையைப் பாதுகாக்க ‘புரிந்துகொள்ளவும் இல்லை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בַּחֲשֵׁכָה
  choice: இருளில்
  rationale: முன்னொட்டுடன் கூடிய பெயர்ச்சொல் இடத்தைக் குறிக்கிறது. ‘இருளில்’ என்பது உருவகத்தையும் தமிழின் இயல்பான நடையையும் காக்கிறது.
- source_word: יִתְהַלָּכוּ
  choice: அலைந்து திரிகிறார்கள்
  rationale: הלך என்பதன் Hitpael வடிவம் தொடர்ந்து அல்லது இலக்கின்றி நடமாடும் நுண்ணுணர்வைக் கொண்டிருக்கலாம். ‘அலைந்து திரிகிறார்கள்’ அந்தச் செயலின் தொடர்ச்சியையும் இருள் உருவகத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִמּוֹטוּ
  choice: நிலைகுலைகின்றன
  rationale: מוט என்பதன் Niphal வடிவம் அசைக்கப்படுதல், தள்ளாடுதல், நிலை குலைதல் ஆகிய பொருட்களைக் கொண்டது. முழுமையான வீழ்ச்சியைச் சேர்க்காமல் அடித்தளங்களின் உறுதியிழப்பை ‘நிலைகுலைகின்றன’ தெளிவாகக் காட்டுகிறது.
- source_word: כָּל מוֹסְדֵי אָרֶץ
  choice: பூமியின் அடித்தளங்கள் அனைத்தும்
  rationale: מוֹסְדֵי என்பது ‘அடித்தளங்கள்’ அல்லது ‘அஸ்திவாரங்கள்’ என்பதைக் குறிக்கிறது. இக்கவிதைச் சூழலில் אָרֶץ உலகளாவிய விரிவைக் கொண்டிருக்கக் கூடுவதால் ‘பூமி’ முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டது; ‘அனைத்தும்’ இயல்பான தமிழ் சொல்வரிசையில் வைக்கப்பட்டது.
theological_decisions:
- issue: אָרֶץ என்பதன் பரப்பும் உலக ஒழுங்கு நிலைகுலையும் உருவகமும்
  choice: ‘பூமி’ என்று மொழிபெயர்த்து, நீதியின்மையால் படைக்கப்பட்ட உலக ஒழுங்கே நிலைகுலைவதைக் காட்டும் பரந்த கவிதை உருவகத்தைப் பாதுகாத்தல்
  alternative: ‘நாடு’ அல்லது ‘நிலம்’ என்று உள்ளூர் பரப்பில் புரிந்துகொள்ளுதல்
  rationale: சங்கீதம் 82 அநீதியான ஆட்சியாளர்களைச் சாடினாலும், இவ்வசனத்தின் மொழி முழுப் பூமியின் அடித்தளங்கள் வரை விரிகிறது. ‘பூமி’ என்பது அந்தப் பரந்த சாத்தியத்தைப் பாதுகாக்கிறது; அதேவேளை உள்ளூர் வாசிப்பும் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைச் செறிவும் கண்ணியமான தொனியும் காக்கப்பட்டுள்ளன. ‘அலைந்து திரிகிறார்கள்’ வழக்கமான வாசகருக்கு தெளிவாக இருந்து, எபிரெய வினையின் தொடர்ச்சியான நடமாட்ட நுண்ணுணர்வை வெளிப்படுத்துகிறது. மூலத்தின் அறியாமை—இருள்—உலக நிலைகுலைவு என்ற முன்னேற்றம் அப்படியே பேணப்பட்டுள்ளது.
