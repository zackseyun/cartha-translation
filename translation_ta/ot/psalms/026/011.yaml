revisions:
- from: ஆனால் நானோ என் நேர்மையில்[a] நடப்பேன்; என்னை மீட்டுக்கொள்ளும், எனக்கு அருள்காட்டும்[b].
  to: ஆனால் நானோ என் நேர்மையில்[a] நடப்பேன்; என்னை மீட்டருளும்; என்மேல் அருள்கூரும்[b].
  rationale: 'The revision makes the two Hebrew imperatives natural and reverent in modern standard Tamil while preserving their distinct senses: redemption (פדה) and gracious favor (חנן). The integrity wording and its alternatives are retained, preserving the contextual ethical claim without imposing absolute sinlessness.'
