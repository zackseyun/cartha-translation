  yaml_path: translation/ot/psalms/026/011.yaml
  text: But as for me[a], I will walk in my integrity[b]; redeem me and be gracious to me.
translation:
  language: ta
  text: ஆனால் நானோ என் நேர்மையில்[a] நடப்பேன்; என்னை மீட்டருளும்; என்மேல் அருள்கூரும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் குற்றமற்ற தன்மையில்’ அல்லது ‘என் நிரபராதத்தன்மையில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்மேல் தயவுகூரும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: வாவ் இணைப்பும் தனிப்பட்ட சுட்டுப்பெயரும் சேர்ந்து காட்டும் முரண்பாட்டையும் வலியுறுத்தலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּתֻמִּי
  choice: என் நேர்மையில்
  rationale: תֹּם/תֻּם என்பதன் ஒழுக்க ஒருமைப்பாடு, குற்றமற்ற தன்மை ஆகிய பொருள் பரப்பைத் தக்கவைக்கிறது; முழுமையான பாவமின்மையைத் தேவையின்றி வலியுறுத்துவதில்லை. בְּ என்ற முன்னிடைச்சொல்லின் வடிவமும் முடிந்தவரை பாதுகாக்கப்படுகிறது.
- source_word: אֵלֵךְ
  choice: நடப்பேன்
  rationale: ஒருவரின் வாழ்க்கை நடத்தையைக் குறிக்கும் எபிரெய உருவகத்தை ‘நடப்பேன்’ நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: פְּדֵנִי
  choice: என்னை மீட்டுக்கொள்ளும்
  rationale: פדה என்பதிலுள்ள மீட்பு அல்லது விடுவிப்பின் வலிமையைப் பொதுவான ‘காப்பாற்றும்’ என்பதைக் காட்டிலும் தெளிவாகத் தக்கவைக்கிறது.
- source_word: וְחָנֵּנִי
  choice: எனக்கு அருள்காட்டும்
  rationale: חנן என்பதன் தயவு அல்லது அருள் காட்டுதல் என்ற மையப் பொருளை இயல்பான விண்ணப்ப மொழியில் வெளிப்படுத்துகிறது; ‘இரங்கும்’ என்பது சாத்தியமான மாற்று.
theological_decisions:
- issue: சங்கீதக்காரர் தமது תֻם குறித்து கூறுவதன் பொருள்
  choice: தமது வாழ்க்கை நடத்தையின் நேர்மையை அவர் உறுதிப்படுத்துகிறார்; இது கட்டாயமாக முழுமையான பாவமின்மைக்கான உரிமைக்கோரல் அல்ல.
  alternative: குற்றமற்ற தன்மை அல்லது நிரபராதத்தன்மை குறித்த இன்னும் வலுவான உரிமைக்கோரல்.
  rationale: சூழலில் அவர் தமது நடத்தையைத் தீயோரின் நடத்தையிலிருந்து வேறுபடுத்துகிறார்; அதே நேரத்தில் மீட்பையும் அருளையும் வேண்டுகிறார். ‘நேர்மை’ எபிரெயச் சொல்லின் நேர்மறையான ஒழுக்க வலிமையையும் இந்த இறையியல் பதற்றத்தையும் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான வேண்டுதல் நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘நடப்பேன்’ என்ற வேதாகம உருவகம் தக்கவைக்கப்பட்டு, அளவுக்கு மீறிய பழமையான சொற்கள் தவிர்க்கப்பட்டன.
