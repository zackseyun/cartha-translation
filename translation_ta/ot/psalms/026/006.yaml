  text: אֶרְחַ֣ץ בְּ/נִקָּי֣וֹן כַּפָּ֑/י וַ/אֲסֹבְבָ֖ה אֶת מִזְבַּחֲ/ךָ֣ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/006.yaml
  text: I wash my hands in innocence[a], and go around your altar, O Yahweh[b],
translation:
  language: ta
  text: நான் குற்றமின்மையோடு[a] என் கைகளைக் கழுவுவேன்; யாவே, உமது பலிபீடத்தைச் சுற்றிவருவேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தூய்மையுடன்” அல்லது “சுத்தத்துடன்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் அறநெறிசார் குற்றமின்மையையும் சடங்குசார் தூய்மையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “சுற்றிவருகிறேன்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைவடிவம் தொடர்ச்சியான செயல் அல்லது உறுதியான நோக்கம் ஆகிய இரண்டின் நுணுக்கத்தையும் ஏற்கக்கூடும்.
    reason: grammatical_alternative
lexical_decisions:
- source_word: אֶרְחַץ
  choice: நான் ... கழுவி
  rationale: רחץ என்பதன் Qal imperfect முதலாம் நபர் ஒருமை வடிவம். கவிதைச் சூழலில் இது நிகழ்காலச் செயல் அல்லது உறுதியான நோக்கத்தைச் சுட்டலாம்; அடுத்துள்ள cohortative வினையுடன் இயல்பாக இணைக்கத் தமிழில் வினையெச்சமாக வழங்கப்பட்டது.
- source_word: בְּנִקָּיוֹן
  choice: குற்றமற்ற நிலையில்
  rationale: נִקָּיוֹן தூய்மை, சுத்தம், குற்றமின்மை ஆகிய தொடர்புடைய அர்த்தங்களை உடையது. இங்கு கை கழுவுதல் என்ற சடங்குசார் படிமத்துடன் அறநெறிசார் குற்றமின்மையும் ஒலிப்பதால், இரண்டையும் முற்றிலும் ஒன்றாகச் சுருக்காமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: כַּפָּי
  choice: என் கைகளை
  rationale: כף என்பதன் இருமை வடிவம் சொற்பொருளில் உள்ளங்கைகள் என்றாலும், கை கழுவுதல் என்ற தமிழ்ச் சொல்லாட்சியில் ‘கைகள்’ இயல்பானது.
- source_word: וַאֲסֹבְבָה
  choice: சுற்றிவருவேன்
  rationale: סבב என்பது சுற்றிச் செல்லுதல் அல்லது வலம் வருதல். paragogic/cohortative வடிவம் நோக்கம் அல்லது உறுதியை உணர்த்தக்கூடும்; ‘சுற்றிவருவேன்’ அதைத் தக்கவைத்து, குறிப்பிட்ட சடங்கு என்று தேவையின்றி முடிவுசெய்யாமல் உள்ளது.
- source_word: מִזְבַּחֲךָ
  choice: உமது பலிபீடத்தை
  rationale: מזבח என்பது பலியிடப்படும் பீடம்; இரண்டாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதி மரியாதையான ‘உமது’ என வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்கப்பட்டது.
theological_decisions:
- issue: בְּנִקָּיוֹן என்பதில் அறநெறிசார் குற்றமின்மையும் சடங்குசார் தூய்மையும்
  choice: குற்றமற்ற நிலையில்
  alternative: தூய்மையுடன் / சுத்தத்தில்
  rationale: சங்கீதத்தின் சூழல் அறநெறிசார் நேர்மையை முன்னிறுத்தினாலும், கை கழுவுதல் சடங்குத் தூய்மையின் படிமத்தையும் எழுப்புகிறது. முதன்மை உரை அறநெறிசார் நுணுக்கத்தை வெளிப்படுத்துகிறது; அடிக்குறிப்பு உண்மையான சொற்பொருள் விரிவைத் தக்கவைக்கிறது.
- issue: וַאֲסֹבְבָה வினையின் காலம் மற்றும் மனநிலை
  choice: சுற்றிவருவேன்
  alternative: சுற்றிவருகிறேன் / நான் சுற்றிவரட்டும்
  rationale: cohortative/paragogic வடிவத்தில் உறுதி அல்லது நோக்கத்தின் நுணுக்கம் இருக்கலாம். தமிழின் எதிர்கால வடிவம் இங்கு வெறும் காலத்தைக் காட்டுவதோடு மட்டுமல்லாமல் அந்தத் தீர்மானத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- issue: יהוה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலச் சான்றுக்கு நெருக்கமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்குரிய கண்ணியத்துடன் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘வலம் வருவேன்’ என்பது குறிப்பிட்ட சடங்குச் செயலை அதிகமாக முன்வைக்கக்கூடும் என்பதால், மூலத்தின் பரந்த பொருளைத் தக்கவைக்க ‘சுற்றிவருவேன்’ தேர்ந்தெடுக்கப்பட்டது.
