  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
translation:
  language: ta
  text: என் கால் சமதளத்தில் நிலைத்து நிற்கிறது[a]; கூட்டங்களில் நான் யாவேவை வாழ்த்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சமமான இடத்தில்’; எபிரெயச் சொல் ‘நேர்மை’ என்ற நிழற்பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלִי
  choice: என் கால்
  rationale: எபிரெயச் சொல் ஒருமையில் முதலாம் நபர் உடைமை விகுதியுடன் உள்ளது; கவிதையின் தனிப்பட்ட நிலைத்தன்மை உருவகத்தையும் ஒருமையிலேயே காக்கிறது.
- source_word: עָמְדָה
  choice: நிலைத்து நிற்கிறது
  rationale: பெண்பால் ஒருமை நிறைவுவினை இங்கு ஏற்பட்டுவிட்ட நிலையின் தற்போதைய தொடர்ச்சியை உணர்த்துகிறது; ‘நிலைத்து நிற்கிறது’ உறுதிப்பாட்டையும் இயல்பான தமிழையும் தருகிறது.
- source_word: בְּמִישׁוֹר
  choice: சமதளத்தில்
  rationale: முதன்மையான பொருள் சமமான அல்லது மேடுபள்ளமற்ற இடம். நேர்மை என்ற சாத்தியமான அறநெறி நிழற்பொருளை அடிக்குறிப்பில் காக்கிறது.
- source_word: בְּמַקְהֵלִים
  choice: கூடிவரும் சபைகளில்
  rationale: קהל என்பதன் பன்மை, ஒன்றுகூடிய மக்கள் கூட்டங்களைக் குறிக்கிறது. ‘கூடிவரும் சபைகள்’ பன்மையையும் ஒன்றுகூடுதல் என்ற அடிப்படை எண்ணத்தையும் தெளிவாக்குகிறது.
- source_word: אֲבָרֵךְ
  choice: நான் … வாழ்த்துவேன்
  rationale: ברך என்பதன் பியேல் வடிவை நேரடியாக ‘வாழ்த்துவேன்’ என்று தருகிறது; சூழலில் இது தேவனைப் போற்றிப் புகழ்வதைக் குறித்தாலும், ‘புகழ்வேன்’ என்று மட்டும் சுருக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. எனவே பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்து, மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: מִישׁוֹר என்பதில் உள்ள இடவியல் மற்றும் அறநெறி நிழற்பொருள்
  choice: முதன்மை உரையில் ‘சமதளம்’ என்ற concrete உருவகம்; அடிக்குறிப்பில் ‘நேர்மை’ என்ற நிழற்பொருள்
  alternative: முதன்மை உரையிலேயே ‘நேர்மையில்’
  rationale: சொல்லின் நேரடியான இடவியல் படிமத்தை அழிக்காமல் வைத்துக்கொண்டு, அதில் இருக்கக்கூடிய அறநெறி சார்ந்த இரட்டைப் பொருளையும் மறைக்காமல் அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் சங்கீதக் கவிதைக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘என் கால்’ என்ற மூல ஒருமையும், ‘சபைகளில்’ என்ற பன்மையும் காக்கப்பட்டுள்ளன.
