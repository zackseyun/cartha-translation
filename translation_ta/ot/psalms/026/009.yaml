    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  choice: சேர்த்து எடுத்துக்கொள்ளாதீர்
  rationale: אָסַף என்பதன் அடிப்படைப் பொருள் ‘சேகரித்தல்/சேர்த்தல்’; இங்கு நியாயத்தீர்ப்பில் தீயவர்களுடன் ஒருவரையும் சேர்த்து அகற்றும் பொருள்நிழல் உள்ளது. ‘சேர்த்து எடுத்துக்கொள்ளாதீர்’ என்பது இரண்டையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: נֶפֶשׁ என்பது உயிர், வாழ்க்கை, தன்னையே குறிக்கலாம். தமிழில் ‘என் உயிரை’ என்பது இயல்பாகவும் கவித்துவமாகவும் இருந்து, இதனைத் தொழில்நுட்பமான உடல்–ஆத்துமா பிரிவாக மாற்றாமல் காக்கிறது.
- source_word: חַטָּאִים
  choice: பாவிகள்
  rationale: பாவத்தால் அடையாளப்படுத்தப்படும் மக்களை நேரடியாகவும் சுருக்கமாகவும் குறிக்கிறது.
- source_word: אַנְשֵׁי דָמִים
  choice: இரத்தப்பழி உடையவர்கள்
  rationale: ‘இரத்தங்களின் மனிதர்கள்’ என்ற எபிரெய மரபுத்தொடர் வன்முறையாளர்களையோ இரத்தப்பழி சுமந்தவர்களையோ குறிக்கிறது. இந்தத் தேர்வு கொலைகாரர்கள் என்று மட்டும் பொருளைக் குறுக்காமல் அதன் தீவிரத்தைக் காக்கிறது.
- source_word: חַיָּי
  choice: என் வாழ்வை
  rationale: נַפְשִׁי என்பதற்கு இணையாக வரும் பன்மை வடிவம் சூழலில் ‘என் வாழ்க்கை/வாழ்வு’ என்று பொருள்படுகிறது. ‘உயிர்’ மற்றும் ‘வாழ்வு’ என இரு தொடர்புடைய கவித்துவச் சொற்கள் தக்கவைக்கப்படுகின்றன.
- source_word: אַל
  choice: எடுத்துக்கொள்ளாதீர் / சேர்க்காதீர்
  rationale: இறைவனை நோக்கிய எதிர்மறை வேண்டுதலை நவீன, மரியாதையான தமிழ் வினைமுற்றுகள் இயல்பாக வெளிப்படுத்துகின்றன.
theological_decisions:
- issue: נַפְשִׁי மற்றும் חַיָּי ஆகியவற்றின் மனித இயல்பு சார்ந்த நுணுக்கம்
  choice: ‘என் உயிர்’ மற்றும் ‘என் வாழ்வு’ என வேறுபட்ட, ஆனால் இணையான கவித்துவச் சொற்களாகத் தக்கவைத்தல்.
  alternative: ‘என்னை’ மற்றும் ‘என் வாழ்க்கையை’ என பொதுவாக மொழிபெயர்த்தல்; அல்லது ‘என் ஆத்துமா’ மற்றும் ‘என் வாழ்க்கை’ என வழங்குதல்.
  rationale: இவ்வசனம் தொழில்நுட்பமான உடல்–ஆத்துமா இருமையை கட்டாயப்படுத்தவில்லை. அதேவேளையில், எபிரெயம் திட்டமிட்டு பயன்படுத்தும் இரண்டு தொடர்புடைய சொற்களையும் ஒன்றாகச் சுருக்காமல் காப்பது கவித்துவ இணைநிலையையும் இறையியல் திறந்தநிலையையும் பேணுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரண்டு இணை அடிகளும் ‘என் உயிர் / என் வாழ்வு’ என்ற கவித்துவ வேறுபாடும் பாதுகாக்கப்பட்டுள்ளன. அனைத்து அடிக்குறிப்புக் குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
