    text: 'அல்லது: “பாவிகளோடு என் உயிரை வாரிக்கொண்டு போகாதீர்.” இந்த வினைச்சொல், நியாயத்தீர்ப்பில் தீயவர்களுடன் சேர்த்து அகற்றப்படுவதையும் குறிக்கலாம்.'
    reason: lexical_alternative
  - marker: b
