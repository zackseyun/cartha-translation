base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/009.yaml
  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
translation:
  language: ta
  text: 'பாவிகளோடு என் உயிரைச் சேர்த்து எடுத்துக்கொள்ளாதீர்[a];

    இரத்தப்பழி உடையவர்களோடு என் வாழ்வைச் சேர்க்காதீர்[b].'
  philosophy: optimal-equivalence
  footnotes:
