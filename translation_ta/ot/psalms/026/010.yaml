  text: in whose hands is wickedness[a], and whose right hand is full of bribes.
translation:
  language: ta
  text: 'அவர்களுடைய கைகளில் தீமை[a] இருக்கிறது;

    அவர்களுடைய வலக்கை கையூட்டுகளால் நிறைந்திருக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “குற்றம்,” “சீர்கேடு,” அல்லது “தீய திட்டம்” (זִמָּה).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בִּידֵיהֶם
  choice: அவர்களுடைய கைகளில்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களை விவரிக்கும் தொடர்புச் சொற்றொடராக இதை எடுத்துக்கொண்டு, கைகள் செயல்களின் கருவியாகக் காட்டப்படும் எபிரெயப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: זִמָּה
  choice: தீமை
  rationale: இச்சூழலில் இது பாலியல் சீர்கேட்டை மட்டும் குறிக்காமல், கையூட்டுடன் இணையாக நிற்கும் பொதுவான ஒழுக்கக்கேட்டைக் குறிக்கிறது; எனவே இயல்பான, பரந்த பொருளுடைய ‘தீமை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וִימִינָם
  choice: அவர்களுடைய வலக்கை
  rationale: எபிரெயத்தில் உள்ள ஒருமை வடிவத்தையும், செயல் மற்றும் ஆற்றலின் கருவியாக வலக்கையைச் சித்தரிக்கும் படிமத்தையும் பாதுகாக்கிறது.
- source_word: מָלְאָה
  choice: நிறைந்திருக்கிறது
  rationale: மூலத்தின் நிலைமையைக் குறிக்கும் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שֹׁחַד
  choice: கையூட்டுகளால்
  rationale: மூலத்தில் ஒருமை வடிவம் இருந்தாலும், இங்கு பொதுவாகவும் வழக்கமான ஊழல் நடத்தையைக் குறிக்கும் வகையிலும் வருவதால் தமிழில் பன்மை இயல்பாக உள்ளது.
theological_decisions: []
