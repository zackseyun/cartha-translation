  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கைகள்’ மற்றும் ‘வலக்கை’ என்ற எபிரெயப் படிமங்கள் அப்படியே தக்கவைக்கப்பட்டுள்ளன; இரு அடிகளின் இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளது.
