  text: כִּֽי חַ֭סְדְּ/ךָ לְ/נֶ֣גֶד עֵינָ֑/י וְ֝/הִתְהַלַּ֗כְתִּי בַּ/אֲמִתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/003.yaml
  text: For your steadfast love is before my eyes[b][a], and I have walked in your truth.
translation:
  language: ta
  text: ஏனெனில், உமது மாறாத அன்பு[a] என் கண்களுக்கு முன்பாக இருக்கிறது; உமது உண்மையில்[b] நான் நடந்து வந்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது உடன்படிக்கைப் பற்றுறுதி.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமது உண்மைத்தன்மையில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள கூற்றுக்கு அடிப்படையான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் விளக்கவுரைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חַסְדְּךָ
  choice: உமது மாறாத அன்பு
  rationale: חֶסֶד என்பதில் அன்பு, நிலைத்த நம்பகத்தன்மை, உடன்படிக்கை சார்ந்த பற்றுறுதி ஆகிய பொருள் நிழல்கள் உள்ளன. ‘மாறாத அன்பு’ என்பது அன்பையும் அதன் நிலைத்த தன்மையையும் இயல்பாக இணைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לְנֶגֶד עֵינַי
  choice: என் கண்களுக்கு முன்பாக
  rationale: எப்போதும் நினைவிலும் கவனத்திலும் வைத்திருப்பதைக் குறிக்கும் உருவகத்தைத் தமிழிலும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְהִתְהַלַּכְתִּי
  choice: நான் நடந்து வந்திருக்கிறேன்
  rationale: הלך என்பதன் வாழ்வியல் நடத்தை குறிக்கும் ‘நடத்தல்’ உருவகத்தைப் பாதுகாப்பதோடு, இதுவரை தொடர்ந்த வாழ்க்கை முறையையும் நிறைவுற்ற வினையின் தற்போதைய தொடர்பையும் வெளிப்படுத்துகிறது.
- source_word: בַּאֲמִתֶּךָ
  choice: உமது உண்மையில்
  rationale: אֱמֶת என்பதிலுள்ள உண்மை, உண்மைத்தன்மை, நம்பகத்தன்மை ஆகிய பரந்த பொருள் எல்லையை ‘உண்மை’ பாதுகாக்கிறது; ‘-இல்’ என்பது எபிரெய முன்னிடைச்சொல்லின் உருவகத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: חֶסֶד மற்றும் אֱמֶת என்னும் இறை உடன்படிக்கைச் சொற்களின் பொருள் வரம்பு
  choice: חֶסֶד என்பதை ‘மாறாத அன்பு’ என்றும் אֱמֶת என்பதை ‘உண்மை’ என்றும் மொழிபெயர்த்து, மாற்றுப் பொருள் நிழல்களை அடிக்குறிப்புகளில் சுட்டிக்காட்டுதல்
  alternative: חֶסֶד என்பதை ‘உடன்படிக்கைப் பற்றுறுதி’ என்றும் אֱמֶת என்பதை ‘உண்மைத்தன்மை’ என்றும் முதன்மை உரையிலேயே மொழிபெயர்த்தல்
  rationale: இவ்விரு சொற்களும் கடவுளின் அன்பு, பற்றுறுதி, நம்பகத்தன்மை, உண்மை ஆகிய ஒன்றோடொன்று தொடர்புடைய அம்சங்களைத் தாங்குகின்றன. முதன்மை உரை அவற்றை ஒரு குறுகிய கோட்பாட்டு விளக்கமாக முடிவுசெய்யாமல் பரந்த பொருளுடன் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனைச் சுட்டும் இடத்தில் மரியாதை ஒருமை ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘கண்களுக்கு முன்பாக’ மற்றும் ‘நடத்தல்’ ஆகிய உருவகங்கள் இயல்பான தமிழில் பாதுகாக்கப்பட்டுள்ளன.
