  register: நவீன தரத் தமிழில், சங்கீதத்தின் இருவரி இணைநிலையைத் தக்கவைக்கும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. முதல் வினையின் நேரடி உருவகம் காக்கப்பட்டு, இரண்டாம் வினை தமிழில் புரியும்படி சற்றே இயல்பாக்கப்பட்டது; எபிரெயச் சொல்லின் தெளிவின்மை அடிக்குறிப்பில் பதிவு செய்யப்பட்டது.
