source:
  edition: WLC
  text: לֹא יָ֭שַׁבְתִּי עִם מְתֵי שָׁ֑וְא וְ/עִ֥ם נַ֝עֲלָמִ֗ים לֹ֣א אָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/004.yaml
  text: I have not sat with men of falsehood[a], and I do not go in with those who conceal themselves.
translation:
  language: ta
  text: 'பொய்யர்களுடன் நான் உட்கார்ந்ததில்லை;

    தங்களை மறைத்துக்கொள்கிறவர்களுடன் நான் சேருவதுமில்லை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மறைந்திருப்பவர்களுடன் நான் நுழைவதுமில்லை.” எபிரெயச் சொல் தங்கள் உண்மை இயல்பை மறைப்பவர்களைக் குறிக்கலாம்; அதனால் மாய்மாலக்காரர்கள் அல்லது வேடதாரிகள் என்ற கருத்தும் இருக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: நான் உட்கார்ந்ததில்லை
  rationale: ישׁב என்பதன் அடிப்படைப் பொருள் ‘உட்கார்’; עִם (‘உடன்’) என்பதோடு இங்கு ஒருவருடன் பழகுவதையும் கூட்டுறவு கொள்வதையும் குறிக்கிறது. தமிழிலும் ‘ஒருவருடன் உட்காருதல்’ என்ற உருவகம் இயல்பாகப் புரிவதால் அது தக்கவைக்கப்பட்டது.
- source_word: מְתֵי שָׁוְא
  choice: பொய்யர்கள்
  rationale: מְתֵי என்பது ‘மனிதர்கள்/ஆட்கள்’ என்றும் שָׁוְא என்பது பொய், வஞ்சகம், வெறுமை என்றும் பொருள்படலாம். இச்சூழலில் ஒழுக்கரீதியான ‘பொய்’ என்ற கருத்தை இயல்பான தமிழில் ‘பொய்யர்கள்’ வெளிப்படுத்துகிறது.
- source_word: נַעֲלָמִים
  choice: தங்களை மறைத்துக்கொள்கிறவர்கள்
  rationale: עלם (‘மறை’) என்ற வேரிலிருந்து வந்த இவ்வடிவம் ‘மறைந்திருப்பவர்கள்’ அல்லது தங்கள் உண்மை இயல்பை மறைப்பவர்கள் எனப் பொருள்படலாம். ‘மாய்மாலக்காரர்கள்’ போன்ற அதிக விளக்கமளிக்கும் சொல்லைத் தவிர்த்து, மூலத்தின் மறைத்தல் என்ற கருத்தும் தெளிவின்மையும் காக்கப்பட்டன.
- source_word: אָבוֹא
  choice: நான் சேருவதுமில்லை
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வரு/போ/உள்நுழை’. இங்கு עִם (‘உடன்’) என்பதோடும் முதல் வரியின் ‘உட்காருதல்’ என்பதற்கு இணையாகவும் வருவதால், அவர்களது கூட்டத்தில் நுழைந்து இணைவதை இயல்பான தமிழில் ‘சேருதல்’ எனத் தருகிறது.
- source_word: וְעִם
  choice: …உடன் …உமில்லை
  rationale: இணைப்பிடைச்சொல்லும் ‘உடன்’ என்ற முன்னிடைச்சொல்லும் இரண்டாம் வரியை முதல் வரியுடன் இணைக்கின்றன. எதிர்மறை இணைப்பைத் தமிழில் ‘…உமில்லை’ இயல்பாக வெளிப்படுத்துகிறது.
