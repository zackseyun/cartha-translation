translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க கவிதைத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ சங்கீதத்தின் தேவனை நோக்கிய நேரடி உரையின் கண்ணியத்தைப் பேணுகிறது. எபிரெய காரணவினையின் உண்மையான நுணுக்கம் முதன்மை உரையில் காக்கப்பட்டு, இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
