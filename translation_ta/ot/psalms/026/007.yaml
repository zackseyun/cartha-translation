  text: to proclaim with a voice of thanksgiving[b][a], and to recount all your wondrous deeds.
translation:
  language: ta
  text: நன்றியின் குரலை ஒலிக்கச் செய்யவும்[a], உமது வியத்தகு செயல்கள் அனைத்தையும் எடுத்துரைக்கவும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நன்றியின் குரலைக் கேட்கும்படி செய்யவும்.’ எபிரெய வினைச்சொல் காரணவினை வடிவில் உள்ளது; அதன் நேரடிப் பொருள் ‘கேட்கச் செய்ய’ என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமது அதிசயங்கள் அனைத்தையும்’ அல்லது ‘உமது அற்புதமான செயல்கள் அனைத்தையும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשְׁמִעַ
  choice: கேட்கச் செய்யவும்
  rationale: שׁמע என்பதன் ஹிஃபில் வினையெச்சம் நேரடியாக ‘கேட்கச் செய்ய’ அல்லது ‘கேட்கும்படி செய்ய’ என்று பொருள்படும். தமிழிலும் இச்சொற்றொடர் இயல்பாகப் புரிவதால், ‘அறிவிக்க’ என்று விளக்கமாக மாற்றாமல் எபிரெய காரணவினை வடிவம் பாதுகாக்கப்படுகிறது.
- source_word: בְּקוֹל
  choice: குரலை
  rationale: בְּ + קוֹל இங்கு ‘குரலால்/குரலை’ என்ற கருவி அல்லது தொடர்புப் பொருளைக் கொண்டுள்ளது. காரணவினையான ‘கேட்கச் செய்ய’ என்பதுடன் தமிழில் ‘குரலை’ என்பது இயல்பாக இணைகிறது.
- source_word: תּוֹדָה
  choice: நன்றியின்
  rationale: תּוֹדָה நன்றி தெரிவித்தல், நன்றிப் புகழ்ச்சி, அல்லது நன்றிப் பாடலைக் குறிக்கலாம். இங்கு குரலுடன் வருவதால், வாய்மொழியாக அல்லது பாடலாக வெளிப்படும் நன்றியை ‘நன்றியின்’ எனச் சுருக்கமாகக் காட்டுகிறது.
- source_word: וּלְסַפֵּר
  choice: எடுத்துரைக்கவும்
  rationale: ספר என்பதன் பியேல் வடிவம் விவரித்துச் சொல்லுதல் அல்லது எண்ணிச் சொல்லுதல் என்ற பொருளைக் கொண்டது. ‘எடுத்துரைக்க’ என்பது வெறும் ‘சொல்ல’ என்பதைக் காட்டிலும் அந்த விரிவான அறிவித்தலை இயல்பான தமிழில் தருகிறது.
- source_word: כָּל
  choice: அனைத்தையும்
  rationale: כָּל என்பதன் முழுமை குறிக்கும் நேரடிப் பொருள் பாதுகாக்கப்படுகிறது.
- source_word: נִפְלְאוֹתֶיךָ
  choice: உமது வியத்தகு செயல்கள்
  rationale: נִפְלָאוֹת என்பது அதிசயங்கள் மட்டுமன்றி, தேவன் செய்த வியப்பூட்டும் செயல்களையும் குறிக்கிறது. ‘வியத்தகு செயல்கள்’ செயற்பொருளைத் தெளிவாக்கி, மரியாதையான நவீன தமிழில் இயல்பாக உள்ளது.
