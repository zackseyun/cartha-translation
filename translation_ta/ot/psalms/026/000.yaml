source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: ta
  text: 'தாவீதுக்கு உரியது.[a]


    யாவே, எனக்குத் தீர்ப்பளியும்.[b]


    ஏனெனில், நான் என் நேர்மையோடு நடந்திருக்கிறேன்;


    யாவே மீது நம்பிக்கை வைத்திருக்கிறேன்;


    நான் தடுமாற மாட்டேன்.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதின் பாடல்.” எபிரெயத் தலைப்பு தாவீதின் ஆசிரியத்துவத்தையோ, அவருக்கான அர்ப்பணிப்பையோ, அவரோடு உள்ள வேறொரு தொடர்பையோ குறிக்கலாம்.
    reason: source_ambiguity
  - marker: b
    text: சொல்லர்த்தமாக, “என்னை நியாயந்தீரும்.” இங்கு இது “என் சார்பில் தீர்ப்பளியும்” அல்லது “நான் நீதியுள்ளவன் என்று நிலைநாட்டும்” என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: d
    text: அல்லது, “நான் நிலைகுலைய மாட்டேன்.” எபிரெய உருவகம் கால் வழுக்குவதையோ உறுதியான நிலையிலிருந்து விலகுவதையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்கு உரியது
  rationale: לְ என்ற முன்னிடைச்சொல் ஆசிரியத்துவம், அர்ப்பணிப்பு, தொடர்பு ஆகியவற்றைக் குறிக்கக்கூடும்; சுருக்கமான இத்தலைப்பு அந்தத் தொடர்பைத் தேவையின்றி வரையறுக்காமல் வைக்கிறது.
- source_word: שָׁפְטֵנִי
  choice: எனக்கு நீதி வழங்கும்
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘என்னை நியாயந்தீரும்’ என்பதாக இருந்தாலும், இச்சூழலில் வேண்டுபவர் தனக்குச் சாதகமான நீதித்தீர்ப்பை நாடுகிறார்; இயல்பான தமிழில் அந்தச் சூழற்பொருள் வெளிப்படுத்தப்பட்டது.
- source_word: בְתֻמִּי
  choice: என் உத்தமத்தில்
  rationale: תֹּם என்பது முழுமை, நேர்மை, குற்றமற்ற நடத்தை ஆகிய பொருள் வட்டத்தைக் கொண்டது; ‘உத்தமம்’ இந்த நெறிசார் முழுமையைச் சுருக்கமாகத் தருகிறது.
- source_word: הָלַכְתִּי
  choice: நடந்துவந்தேன்
  rationale: எபிரெய ‘நடத்தல்’ உருவகம் ஒருவரின் வாழ்க்கை முறையைக் குறிக்கிறது; தமிழ் வேதாகம நடைக்கும் இயல்பான பயன்பாட்டுக்கும் ஏற்றவாறு உருவகம் காக்கப்பட்டது.
- source_word: לֹא אֶמְעָד
  choice: நான் தடுமாற மாட்டேன்
  rationale: מוּעַד கால்தடுமாறுதல் அல்லது நிலைகுலைதல் என்ற உருவகத்தைத் தருகிறது; எதிர்கால நம்பிக்கையைக் காட்டும் வகையில் மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைப் பெயரை ஒரு பட்டமாக மாற்றாமல், அதன் பொதுவாக ஏற்றுக்கொள்ளப்படும் ஒலிப்பைத் தமிழில் தருகிறது.
- issue: சங்கீதக்காரரின் உத்தமக் கூற்று
  choice: ‘என் உத்தமத்தில் நடந்துவந்தேன்’ என நேரடியாகப் பாதுகாக்கப்பட்டது
  alternative: முழுமையான பாவமின்மையல்ல என்று விளக்கி மென்மைப்படுத்துதல்
  rationale: மூலவசனம் கூறும் நெறிசார் தன்னறிக்கையையும் அதிலுள்ள இறையியல் பதற்றத்தையும் விளக்கத்தின் மூலம் குறைக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்துக்குரிய செறிவும் கண்ணியமும் காக்கப்பட்டுள்ளன. கவிதை வரிப்பிரிப்பு எபிரெய இணைச்சொற்றொடர்களைப் பின்பற்றுகிறது; பொதுவாசகர்களுக்குப் புரியாத அளவுக்கு பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
