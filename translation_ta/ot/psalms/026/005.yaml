  language: ta
  text: தீமை செய்பவர்களின் கூட்டத்தை நான் வெறுக்கிறேன்[a]; தீயவர்களோடு நான் அமர மாட்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமை செய்பவர்களின் கூட்டத்தை நான் வெறுத்திருக்கிறேன்.” எபிரெய நிறைவு வினை வடிவத்தை இறந்தகாலத்தை நோக்கியதாகவும் மொழிபெயர்க்கலாம்; ஆனால் இங்கு அது சங்கீதக்காரரின் நிலையான மனநிலையை வெளிப்படுத்துவதாகத் தெரிகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: நான் வெறுக்கிறேன்
  rationale: שׂנא என்பதன் Qal perfect முதல் நபர் ஒருமை வடிவம். இக்கவிதைச் சூழலில் இது சங்கீதக்காரரின் நிலையான மனநிலையை வெளிப்படுத்துவதால், இயல்பான நவீன தமிழில் நிகழ்காலமாக மொழிபெயர்க்கப்பட்டது; இறந்தகால நிறைவு அர்த்தமும் இலக்கணரீதியாகச் சாத்தியம்.
- source_word: קְהַל
  choice: கூட்டத்தை
  rationale: ஒன்றுகூடிய மக்களைக் குறிக்கும் சொல். வழிபாட்டுச் சார்ந்த பொருளைத் தேவையின்றி கொண்டுவரக்கூடிய ‘சபை’ என்பதற்குப் பதிலாக, இச்சூழலில் இயல்பான ‘கூட்டம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מְרֵעִים
  choice: தீமை செய்பவர்களின்
  rationale: רעע வேரிலிருந்து வந்த பெயர்ச்சொல் பண்பில் பயன்படும் வினையெச்சம்; தீய செயல்களால் அடையாளப்படுத்தப்படுகிறவர்களைச் சுட்டுகிறது. ‘தீமை செய்பவர்கள்’ அதன் செயற்பாட்டு அர்த்தத்தைத் தெளிவாகக் காக்கிறது.
- source_word: וְעִם
  choice: கொடியவர்களோடு
  rationale: இணைப்புச் சொல்லும் ‘உடன்’ என்னும் முன்னிடைச்சொல்லும் சேர்ந்த வடிவம். தமிழில் ‘-ஓடு’ மூலம் இரண்டாம் அடியின் தொடர்பு இயல்பாக வெளிப்படுத்தப்பட்டது.
- source_word: רְשָׁעִים
  choice: கொடியவர்கள்
  rationale: ஒழுக்கரீதியாகத் தீயவர்களைக் குறிக்கும் பெயர்ச்சொல் பண்பிலான அடைமொழி. முதல் அடியின் ‘தீமை செய்பவர்கள்’ என்பதுடன் கவிதை இணைநிலையைப் பேணும் இயல்பான தேர்வு.
- source_word: לֹא אֵשֵׁב
  choice: நான் அமர மாட்டேன்
  rationale: ישב என்பதன் மறுப்பு imperfect முதல் நபர் ஒருமை. இங்கு எதிர்கால நேரத்தை மட்டும் அல்லாமல் உறுதியான மறுப்பையும் தீர்மானத்தையும் தெரிவிக்கிறது. ‘அமர மாட்டேன்’ மூலத்தின் உருவகத்தையும் மனவுறுதியையும் காக்கிறது.
