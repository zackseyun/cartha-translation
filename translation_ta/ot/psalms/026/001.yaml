source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: ta
  text: 'தாவீதினுடையது.[a]


    யாவே, எனக்கு நீதி வழங்கும்;[b]


    ஏனெனில் நான் நேர்மையோடு நடந்தேன்;


    யாவே மீது நம்பிக்கை வைத்தேன்;


    நான் தடுமாற மாட்டேன்.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதுக்காக” அல்லது “தாவீதோடு தொடர்புடையது” என்றும் பொருள்கொள்ளலாம்.
    reason: தலைப்பிலுள்ள לְדָוִד ஆசிரியத்துவம், அர்ப்பணிப்பு, அல்லது வேறு தொடர்பைக் குறிக்கலாம்; அதன் துல்லியமான உறவு தீர்மானிக்கப்படவில்லை.
  - marker: b
    text: சொல்லெழுத்தாக, “என்னை நியாயந்தீரும்.” இச்சூழலில் அது “என் சார்பில் தீர்ப்பளித்து, என் நீதியை நிலைநாட்டும்” என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: שׁפט என்ற வினையின் அடிப்படை நீதித்தீர்ப்பு பொருளையும், இச்சூழலிலுள்ள சாதகத் தீர்ப்பு நுணுக்கத்தையும் காட்டுகிறது.
  - marker: c
    text: “நான் கால் வழுக்க மாட்டேன்” அல்லது “நிலைதடுமாற மாட்டேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: מעד என்பதில் கால் வழுக்குதல் அல்லது உறுதியான நிலையிலிருந்து தடுமாறுதல் என்ற படிமம் உள்ளது.
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்கு உரியது
  rationale: தனிப்பட்ட பெயருக்கு முன் வரும் לְ, சங்கீதத் தலைப்புகளில் ஆசிரியத்துவம், தொடர்பு, அர்ப்பணிப்பு ஆகிய பல உறவுகளைக் குறிக்கலாம். ‘தாவீதுக்கு உரியது’ இந்தத் தெளிவின்மையை ஓரளவு காக்கிறது.
- source_word: שָׁפְטֵנִי
  choice: எனக்கு நீதி வழங்கும்
  rationale: שׁפט என்பதன் அடிப்படைப் பொருள் ‘நியாயந்தீர்ப்பது’. இங்கு சங்கீதக்காரர் தன் நேர்மையை முன்வைத்து வேண்டுவதால், தனக்குச் சாதகமான நியாயத்தீர்ப்பை—நீதிநிலைநாட்டுதலை—கோருவது சூழலுக்கு ஏற்றது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה ஒரு பட்டப்பெயராக மாற்றப்படாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: בְּתֻמִּי
  choice: நேர்மையோடு
  rationale: תֹּם/תֻּמָּה முழுமை, களங்கமின்மை, உத்தமம், நேர்மை ஆகிய பொருள் வரம்பைக் கொண்டது. ‘நேர்மையோடு’ என்பது பாவமற்ற பரிபூரணத்தைத் தேவையின்றி உணர்த்தாமல் ஒழுக்க ஒருமைப்பாட்டை வெளிப்படுத்துகிறது.
- source_word: הָלַכְתִּי
  choice: நடந்தேன்
  rationale: ‘நடத்தல்’ என்பது வாழ்வின் போக்கைக் குறிக்கும் எபிரெய உருவகத்தைப் பாதுகாக்கிறது; தமிழிலும் வேதாகம நடையில் இயல்பாகப் புரிகிறது.
- source_word: בָּטַחְתִּי
  choice: நம்பிக்கை வைத்திருக்கிறேன்
  rationale: בטח நம்பிக்கையுடன் சார்ந்திருப்பதைக் குறிக்கிறது. நிறைவுற்ற செயல் தற்போதும் தொடரும் நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்த இவ்வடிவம் பயன்படுத்தப்பட்டது.
- source_word: לֹא אֶמְעָד
  choice: நான் தடுமாற மாட்டேன்
  rationale: מעד என்பது கால் வழுக்குதல், நிலைதடுமாறுதல் ஆகிய உருவகத்தைத் தருகிறது. ‘தடுமாற மாட்டேன்’ உடல் சார்ந்த படிமத்தையும் உறுதியான நம்பிக்கையையும் ஒருங்கே காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: சங்கீதக்காரரின் תֻם குறித்த கூற்று
  choice: நேர்மை
  alternative: குற்றமின்மை
  rationale: இது சட்ட/உடன்படிக்கைச் சூழலில் நேர்மையான நடத்தையை முன்வைக்கும் கூற்று. முழுமையான பாவமின்மையைத் தீர்மானமாகப் புகுத்தாமல் மூலத்தின் இறையியல் அழுத்தத்தைப் பாதுகாக்கிறது.
- issue: שָׁפְטֵנִי என்பதன் வேண்டுகோள்
  choice: எனக்கு நீதி வழங்கும்
  alternative: என்னை நியாயந்தீரும்
  rationale: ‘நியாயந்தீரும்’ என்பது சோதனை அல்லது தண்டனை என்ற எண்ணத்தை மட்டும் தரக்கூடும். சூழலில் பேசுபவர் தனக்குச் சாதகமான நீதித் தீர்ப்பைக் கோருகிறார்; எனினும் அடிப்படை ‘தீர்ப்பிடு’ பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கவிதைத் தன்மையும் கொண்ட எளிய நடையில் வடிவமைக்கப்பட்டது. ‘நடந்தேன்’ என்ற எபிரெய வாழ்வியல் உருவகம் பாதுகாக்கப்பட்டது; ‘நேர்மை’ என்பது பாவமற்ற பரிபூரணத்தைத் தேவையின்றி உணர்த்தாதவாறு தேர்ந்தெடுக்கப்பட்டது. கவிதை வரிப்பிரிப்பு மூலத்தின் கருத்துக் கூறுகளைத் தெளிவுபடுத்துகிறது.
