  text: בְּחָנֵ֣/נִי יְהוָ֣ה וְ/נַסֵּ֑/נִי צרופ/ה כִלְיוֹתַ֣/י וְ/לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/002.yaml
  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
translation:
  language: ta
  text: 'யாவே, என்னை ஆராயும்; என்னைச் சோதியும்;

    என் சிறுநீரகங்களையும்[a] என் இதயத்தையும் புடமிடும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘சிறுநீரகங்கள்.’ பண்டைய எபிரெயச் சிந்தனையில் இது ஒருவரின் ஆழ்ந்த எண்ணங்கள், உணர்வுகள் அல்லது உள்ளார்ந்த இயல்பைக் குறிக்கும் ஓர் உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָנֵנִי
  choice: என்னை ஆராயும்
  rationale: בחן ஒருவரின் உண்மைத்தன்மையை ஆராய்ந்து அறிதல் அல்லது நிரூபித்தல் என்ற நுண்பொருளைக் கொண்டது. அடுத்துவரும் נסה என்பதிலிருந்து வேறுபாட்டைப் பேண ‘ஆராயும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ என்று தரப்பட்டுள்ளது.
- source_word: וְנַסֵּנִי
  choice: என்னைச் சோதியும்
  rationale: נסה சோதனைக்கு உட்படுத்தி மெய்ப்பித்தல் என்ற பொருளைத் தருகிறது. இணை அமைப்பையும் בחן உடனான நுண்வேறுபாட்டையும் இது காக்கிறது.
- source_word: צרופה
  choice: புடமிடும்
  rationale: צרף உலோகத்தை உருக்கிச் சுத்திகரிக்கும் படிமத்தை உடையது. ‘புடமிடும்’ அந்த உலோகவியல் படிமத்தையும் உள்ளார்ந்த பரிசோதனையின் கவித்துவ வலிமையையும் பேணுகிறது.
- source_word: כִלְיוֹתַי
  choice: என் சிறுநீரகங்களையும்
  rationale: மூலத்தில் உள்ள உடல் உறுப்புப் படிமம் நேரடியாகப் பேணப்பட்டுள்ளது. பழைய எபிரெய பயன்பாட்டில் இது ஆழ்ந்த எண்ணங்கள், உணர்வுகள் அல்லது உள்ளார்ந்த இயல்பைக் குறிக்கலாம்; அந்த விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְלִבִּי
  choice: என் இதயத்தையும்
  rationale: לֵב என்பது சிந்தனை, விருப்பம், மனவுறுதி ஆகியவற்றை உள்ளடக்கிய உள்ளார்ந்த மனிதனைக் குறிக்கக்கூடும். கவிதை இணைப்பையும் நிலையான உடல் உறுப்புப் படிமத்தையும் ‘இதயம்’ பேணுகிறது.
theological_decisions:
- issue: எபிரெயக் கவிதையிலுள்ள மனித உள்ளார்ந்த இயல்பைக் குறிக்கும் உடல் உறுப்புப் படிமம்
  choice: ‘சிறுநீரகங்கள்’ மற்றும் ‘இதயம்’ என்ற மூலப் படிமங்களை முதன்மை உரையில் பேணுதல்
  alternative: ‘என் ஆழ்மனத்தையும் என் இதயத்தையும்’ அல்லது ‘என் எண்ணங்களையும் இதயத்தையும்’ என்று பொருள்விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனம் உள்ளார்ந்த மனிதனைச் சுட்டுவதற்கு உறுதியான உடல் உறுப்புப் படிமங்களைப் பயன்படுத்துகிறது. அவற்றை நேரடியாகப் பேணுவது மூலத்தின் கவித்துவத்தையும் பொருள் வெளிப்படைத்தன்மையையும் காக்கிறது; வாசகருக்குத் தேவையான பண்பாட்டு விளக்கம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் இறைவனை நோக்கிய வேண்டுதலுக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘ஆராயும் / சோதியும்’ என்பவை இணையான இரு எபிரெய வினைகளின் நுண்வேறுபாட்டைப் பேணுகின்றன; ‘புடமிடும்’ மூலத்தின் உலோகச் சுத்திகரிப்பு உருவகத்தைத் தக்கவைக்கிறது. அடிக்குறிப்பு குறியீடு விளக்கப்படும் சொல்லுக்குப் பிறகு இடப்பட்டுள்ளது.
