  text: שָׁמַ֣ע יְ֭הוָה תְּחִנָּתִ֑/י יְ֝הוָ֗ה תְּֽפִלָּתִ֥/י יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/009.yaml
  text: Yahweh has heard my plea[a]; Yahweh will receive my prayer.
translation:
  language: ta
  text: யாவே என் மன்றாட்டைக் கேட்டார்; யாவே என் ஜெபத்தை ஏற்றுக்கொள்வார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் ஜெபத்தைப் பெற்றுக்கொள்வார்’; எபிரெய வினைச்சொல்லின் நேர்ப்பொருள் ‘எடுத்துக்கொள்வார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: שָׁמַע
  choice: கேட்டார்
  rationale: நிறைவுற்ற செயலைக் குறிக்கும் எபிரெய வடிவத்தை இயல்பான தமிழில் தெரிவிக்கிறது; சூழலில், தன் வேண்டுதல் ஏற்கெனவே கேட்கப்பட்டது என்ற சங்கீதக்காரரின் உறுதியை வெளிப்படுத்துகிறது.
- source_word: תְּחִנָּה
  choice: மன்றாட்டு
  rationale: இரக்கத்தையும் தயவையும் நாடும் உருக்கமான வேண்டுதலைக் குறிக்கிறது; அடுத்துவரும் பொதுவான ‘ஜெபம்’ என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: תְּפִלָּה
  choice: ஜெபம்
  rationale: வழக்கமான தமிழில் புரியக்கூடிய பொதுவான பிரார்த்தனைச் சொல்; תְּחִנָּה என்பதுடன் உள்ள எபிரெய இணைநிலையின் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: לָקַח
  choice: பெற்றுக்கொள்வார்
  rationale: வினையின் அடிப்படைப் பொருள் ‘எடுத்துக்கொள்’; இங்கு ஜெபத்தைப் பொருளாகக் கொண்டிருப்பதால் ‘பெற்றுக்கொள்வார்’ என்பது இயல்பான தமிழில் அதன் சூழற்பொருளைத் தருகிறது. நிறைவுறாத வினைவடிவத்தின் எதிர்கால நம்பிக்கையும் காக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனுடைய தனிப்பெயரையே இருமுறை பயன்படுத்துகிறது. பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பெயரை ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது; ‘யாவே’ என்பது எபிரெயப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்பை நெருக்கமாகக் காட்டுகிறது.
- issue: לָקַח என்பதன் சூழற்பொருள்
  choice: பெற்றுக்கொள்வார்
  alternative: ஏற்றுக்கொள்வார்; எடுத்துக்கொள்வார்
  rationale: ‘ஏற்றுக்கொள்வார்’ என்பது இறைவன் ஜெபத்தை அங்கீகரிப்பார் என்ற கருத்தை வலுப்படுத்தலாம்; ‘எடுத்துக்கொள்வார்’ நேர்ப்பொருளாக இருந்தாலும் தமிழில் இச்சூழலில் இயல்பற்றது. ‘பெற்றுக்கொள்வார்’ மூல வினையின் உருவகத்தை ஓரளவு காத்தபடி திட்டவட்டமான மேலதிக விளக்கத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் சங்கீதத்திற்குரிய கண்ணியமும் கொண்ட சுருக்கமான நடை. ‘மன்றாட்டு’ மற்றும் ‘ஜெபம்’ என்ற வேறுபாடு எபிரெய இணைநிலையைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறி அது விளக்கும் לָקַח வினை இடம்பெறும் இரண்டாம் அரையடிக்குப் பின் வைக்கப்பட்டுள்ளது.
