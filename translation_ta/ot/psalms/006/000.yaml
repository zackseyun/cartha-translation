source:
  edition: WLC
  text: לַ/מְנַצֵּ֣חַ בִּ֭/נְגִינוֹת עַֽל הַ/שְּׁמִינִ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/000.yaml
  text: 'For the choirmaster: with stringed instruments, according to the Sheminith[a]. A psalm of David[b].'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: தந்திக் கருவிகளுடன், ஷெமினீத்தின்படி[a]. தாவீதின் சங்கீதம்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘ஷெமினீத்’; இது ‘எட்டாவது’ எனப்படும் ஓர் இசைமுறையையோ, ஓர் இசைச் சுருதிநிலையையோ, எட்டு தந்திகள் கொண்ட ஓர் இசைக்கருவியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘தாவீதால் இயற்றப்பட்ட சங்கீதம்’ அல்லது ‘தாவீதுக்கான சங்கீதம்’ என்றும் பொருள்கொள்ளலாம்; எபிரெயத் தொடர் ஆசிரியத்துவத்தையோ தொடர்பையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடும் நபரைக் குறிக்கிறது. ‘இசைத் தலைவர்’ என்பது இன்றைய தமிழில் இயல்பாகவும் பொதுமக்களுக்குப் புரியும்படியாகவும் உள்ளது.
- source_word: בִּנְגִינוֹת
  choice: நரம்பிசைக் கருவிகளுடன்
  rationale: இது நரம்புகளைக் கொண்ட இசைக்கருவிகளையோ அவற்றால் இசைக்கப்படும் இசையையோ குறிக்கிறது; கருவிகளைக் குறிப்பது இச்சூழலில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: עַל
  choice: முறைப்படி
  rationale: இசைத் தலைப்புகளில் இது ஓர் இசையமைப்பு, பாணி அல்லது நிகழ்த்தும் முறையை அறிமுகப்படுத்தலாம். ‘முறைப்படி’ என்பது குறிப்பிட்ட ஓர் இசைக்கருவி என்ற முடிவைத் திணிக்காமல் அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: הַשְּׁמִינִית
  choice: ஷெமினீத்
  rationale: இச்சொல்லின் துல்லியமான இசைத் தொழில்நுட்பப் பொருள் உறுதியில்லை. எனவே தவறான துல்லியத்தைத் தவிர்க்க எபிரெயச் சொல் ஒலிபெயர்க்கப்பட்டுள்ளது; சாத்தியமான பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையுடன் தொடர்புடைய பாடலைக் குறிக்கும் வழக்கமான எபிரெயச் சொல்; சங்கீத நூலின் தலைப்புகளில் ‘சங்கீதம்’ என்பது நிலைபெற்ற, பொருத்தமான தமிழ்ச் சொல்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரெய முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, அர்ப்பணிப்பு அல்லது தொகுப்புச் சார்பு ஆகியவற்றைக் குறிக்கக்கூடும். தமிழின் உடைமை வேற்றுமை இவற்றுள் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் தொடர்பைத் திறந்த நிலையில் வைக்கிறது.
theological_decisions:
- issue: לְדָוִד என்ற தொடரால் சுட்டப்படும் ஆசிரியத்துவம் அல்லது தொடர்பு
  choice: தாவீதின்
  alternative: தாவீதால் / தாவீதுக்காக
  rationale: மூலத் தலைப்பு தாவீது நேரடியாக இயற்றினார் என்பதை மட்டும் கட்டாயமாகக் கூறுவதில்லை. ‘தாவீதின்’ என்பது ஆசிரியத்துவம் அல்லது பிறவகைத் தொடர்பு என்ற எபிரெய மொழியின் நெகிழ்வை ஓரளவு பாதுகாக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வெளிப்படுத்தப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைத்தும் சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் மொழிநடை அமைக்கப்பட்டுள்ளது. அறியப்படாத இசைத் தொழில்நுட்பச் சொல் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் உரையில் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பு வைக்கப்பட்டுள்ளன.
