  text: כִּ֤י אֵ֣ין בַּ/מָּ֣וֶת זִכְרֶ֑/ךָ בִּ֝/שְׁא֗וֹל מִ֣י יֽוֹדֶה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/005.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
translation:
  language: ta
  text: ஏனெனில், மரணத்தில் உம்மை நினைவுகூருதல் இல்லை; ஷியோலில்[a] உமக்கு நன்றி செலுத்துபவர் யார்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஷியோல்” என்பதற்கு “கல்லறை” அல்லது “இறந்தோரின் உலகம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַּמָּוֶת
  choice: மரணத்தில்
  rationale: இடப்பொருள் சார்ந்த எபிரெய வெளிப்பாட்டைப் பாதுகாப்பதுடன், அடுத்த அடியிலுள்ள ‘ஷியோலில்’ என்பதுடனான கவிதை இணைநிலையையும் தக்கவைக்கிறது.
- source_word: זִכְרֶךָ
  choice: உம்மை நினைவுகூருதல்
  rationale: זכר என்ற சொல்லின் ‘நினைவுகூருதல்/குறிப்பிடுதல்’ என்ற பொருள் வரம்பில், சூழலுக்கும் அடுத்த அடியின் நன்றிசெலுத்துதலுக்கும் ஏற்ற பொதுவான பொருளை வழங்குகிறது; வெறும் மனநினைவாக மட்டுமே சுருக்கவில்லை.
- source_word: בִּשְׁאוֹל
  choice: ஷியோலில்
  rationale: எபிரெயக் கருத்தின் பண்பாட்டு மற்றும் இறையியல் தனித்தன்மையைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது; அதை ‘கல்லறை’ என்ற குறுகிய பொருளுக்குள் அடக்கவில்லை.
- source_word: מִי
  choice: யார்
  rationale: விடையை எதிர்பாராத வினாவை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יוֹדֶה לָּךְ
  choice: உமக்கு நன்றி செலுத்துபவர்
  rationale: ידה என்பதன் ஹிஃபில் வடிவத்திலுள்ள ‘நன்றி செலுத்துதல்/புகழ்தல்’ என்ற பொருள்களில் முதன்மையான நேரடிப் பொருளைத் தெரிவிக்கிறது; தமிழில் வினாவுடன் இயல்பாக அமைகிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷியோல்
  alternative: கல்லறை; இறந்தோரின் உலகம்
  rationale: இச்சொல் இறந்தோரின் இருப்பிடத்தைச் சுட்டும் எபிரெயக் கருத்தைத் தாங்குகிறது. ஒலிபெயர்ப்பு அந்தத் தெளிவின்மையையும் பண்பாட்டுச் சிறப்பையும் பாதுகாக்கிறது; மாற்று விளக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: மரணத்தில் தேவனை நினைவுகூருதல் இல்லை என்ற கவிதைக் கூற்று
  choice: கூற்றை அதன் முழு வலிமையுடன் அப்படியே வைத்தல்
  alternative: இதை ‘பொதுவாகத் தேவனைப் புகழ முடியாது’ அல்லது பிற்கால வாழ்வைப் பற்றிய குறிப்பிட்ட கோட்பாடாக விளக்குதல்
  rationale: இது புலம்பல் கவிதையின் வாதமாகவும் வினாவாகவும் உள்ளது. மரணத்திற்குப் பிந்தைய நிலை குறித்த ஒரு முழுமையான கோட்பாட்டை உரைக்குள் சேர்க்காமல், மூலத்தின் இறையியல் பதற்றத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதப் புலம்பலுக்கேற்ற சுருக்கமான மற்றும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உம்மை’, ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளன. ‘ஷியோல்’ வாசகர்களுக்கு அறிமுகமற்றதாக இருக்கக்கூடும் என்பதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
