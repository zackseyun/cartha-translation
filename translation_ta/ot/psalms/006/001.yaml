    text: எபிரேயத்தில் யாவே என்ற இறைப்பெயர் உள்ளது.
    reason: divine_name
  - marker: b
    text: அல்லது, “என்னைத் திருத்தாதீர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரை பட்டப்பெயராக மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்த்துள்ளது; நேரடி அழைப்பின் தன்மையைச் சொற்றொடர் அமைப்பு வெளிப்படுத்துகிறது.
- source_word: אַל ... תוֹכִיחֵנִי
  choice: என்னைக் கண்டிக்காதீர்
  rationale: אַל உடனான வினை வேண்டுதல் வடிவிலான மறுப்பைக் குறிக்கிறது; יכח என்பதன் இச்சூழலிலான கண்டித்தல்/குற்றம் உணர்த்துதல் என்ற பொருளை ‘கண்டிக்காதீர்’ இயல்பாகத் தருகிறது.
- source_word: בְּאַפְּךָ
  choice: உமது கோபத்தில்
  rationale: אַף என்பதன் சொற்பொருள் ‘மூக்கு’ என்றாலும், இங்கு அது கோபத்தைக் குறிக்கும் எபிரேய மரபுத்தொடர்; בְּ என்பதையும் சேர்த்து ‘கோபத்தில்’ என வழங்கப்பட்டுள்ளது.
- source_word: וְאַל
  choice: …ஆதீர்
  rationale: இணைப்புச் சொல் மற்றும் மறுப்புத் துகளின் இணை அமைப்பு, தமிழில் இரண்டாவது இணை வேண்டுதலின் எதிர்மறை வினைமுற்றால் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: בַּחֲמָתְךָ
  choice: உமது கடுஞ்சினத்தில்
  rationale: חֵמָה குறிக்கும் எரியும் தீவிர சினத்தை ‘கடுஞ்சினம்’ வெளிப்படுத்துகிறது; முதல் அடியின் ‘கோபம்’ என்பதிலிருந்து கவிதை நயமுள்ள வேறுபாடும் காக்கப்படுகிறது.
- source_word: תְיַסְּרֵנִי
  choice: என்னைத் தண்டித்துத் திருத்தாதீர்
  rationale: יסר என்பது வெறும் தண்டனையை மட்டும் அல்லாமல், தண்டித்தல் வழியான ஒழுக்கப்படுத்தல் அல்லது திருத்தத்தையும் குறிக்கலாம்; இருகூறு தமிழ் மொழிபெயர்ப்பு அந்தப் பொருள் அகலத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: தெய்வீகச் சினத்திற்கான இணைச் சொற்களின் வேறுபாடு
  choice: கோபம் / கடுஞ்சினம்
  alternative: கோபம் / கோபம்; சினம் / உக்கிரம்
  rationale: אַף மற்றும் חֵמָה தொடர்புடையவையாக இருந்தாலும் ஒரே சொல் அல்ல; இரண்டு தமிழ் சொற்கள் மூலம் இணைவடிவமும் தீவிரத்தின் நுண்வேறுபாடும் காக்கப்படுகின்றன.
- issue: வேண்டுதலின் நோக்கம்
  choice: கண்டித்தலோ திருத்துதலோ முற்றிலும் வேண்டாம் என்று அல்ல, அவை கோபத்திலும் கடுஞ்சினத்திலும் நிகழ வேண்டாம் என்ற வேண்டுதலாக அமைத்தல்
  alternative: எந்தக் கண்டிப்பையும் ஒழுக்கத் திருத்தத்தையும் முற்றாக மறுக்கும் வேண்டுதல்
  rationale: இரு வினைகளுக்கும் முன் வரும் בְּ சொற்றொடர்கள் தெய்வீகச் செயலின் சூழல் அல்லது நிலையைச் சுட்டுகின்றன; மூலத்தின் இறையியல் இழுபறியைத் தீர்த்துவிடாமல் வாக்கிய அமைப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க ஜெப மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’, ‘கண்டிக்காதீர்’ ஆகியவை கவிதைச் செறிவையும் தெய்வத்தை நோக்கிய நேரடி வேண்டுதலையும் தக்கவைக்கின்றன; அரிதான பழந்தமிழ்ச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
