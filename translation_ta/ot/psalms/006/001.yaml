  yaml_path: translation/ot/psalms/006/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], and do not discipline me in your wrath.
translation:
  language: ta
  text: யாவே[a], உமது கோபத்தில் என்னைக் கண்டிக்காதீர்; உமது கடுஞ்சினத்தில் என்னை ஒழுக்கப்படுத்தாதீர்.[b]
  philosophy: optimal-equivalence
  footnotes:
