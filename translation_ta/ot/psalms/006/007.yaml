source:
  edition: WLC
  text: עָֽשְׁשָׁ֣ה מִ/כַּ֣עַס עֵינִ֑/י עָֽ֝תְקָ֗ה בְּ/כָל צוֹרְרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/007.yaml
  text: My eye has wasted away from grief[a]; it has grown old because of all my enemies.
translation:
  language: ta
  text: துயரத்தால் என் கண் சோர்ந்துபோயிற்று[a]; என் எதிரிகள் அனைவராலும் அது முதுமையடைந்துவிட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனவேதனையால் என் கண் மங்கிவிட்டது; என்னை எதிர்க்கிற அனைவராலும் அது தேய்ந்துபோயிற்று.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשְׁשָׁה
  choice: சோர்ந்துபோயிற்று
  rationale: இந்த வினை தேய்ந்து போதல், வலுவிழத்தல், மங்குதல் ஆகிய பொருள்களைத் தருகிறது. ‘கண்’ என்பதுடன் ‘சோர்ந்துபோயிற்று’ என்பது உடல் பாதிப்பின் உருவகத்தை இயல்பான தமிழில் காக்கிறது; பார்வை மங்கியதாக மட்டும் பொருளைக் குறுக்கவில்லை.
- source_word: מִכַּעַס
  choice: துயரத்தால்
  rationale: כַּעַס என்பது துயரம், மனவேதனை, எரிச்சல் அல்லது சினம் எனச் சூழலுக்கேற்ப பொருள்படலாம். தனிப்பட்ட புலம்பல் சூழலில் ‘துயரத்தால்’ இயல்பான முதன்மைத் தேர்வு; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עֵינִי
  choice: என் கண்
  rationale: எபிரெயச் சொல் ஒருமையில் உள்ளது. பாதிக்கப்பட்ட உறுப்பைச் சுட்டும் மூலமொழியின் ஒருமையைத் தமிழிலும் காக்கிறது.
- source_word: עָתְקָה
  choice: முதுமையடைந்துவிட்டது
  rationale: இந்த வினை முதிர்தல், பழையதாகுதல் அல்லது தேய்ந்து வலுவிழத்தல் என்ற உருவகத்தைத் தருகிறது. ‘முதுமையடைந்துவிட்டது’ மூலத்தின் திடுக்கிடும் உருவகத்தை விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: בְּכָל
  choice: அனைவராலும்
  rationale: இங்கு முன்னிடைச்சொல் எதிரிகள் அனைவரையும் கண் தேய்ந்துபோனதற்கான காரணமாக அல்லது தூண்டுதலாகக் காட்டுகிறது. தமிழில் காரணப் பொருளை ‘அனைவராலும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צוֹרְרָי
  choice: என் எதிரிகள்
  rationale: இந்த வடிவம் பகைமையுடன் எதிர்த்து நிற்பவர்களைக் குறிக்கிறது. ‘என் எதிரிகள்’ என்பது புலம்பல் சூழலுக்கு ஏற்ற, தெளிவான நவீனத் தமிழ்.
