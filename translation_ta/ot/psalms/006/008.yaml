lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  choice: என்னைவிட்டு அகன்று போங்கள்
  rationale: பன்மை ஏவல் வினையின் வலிமையையும், சங்கீதக்காரரிடமிருந்து விலகிச் செல்ல வேண்டும் என்ற தனிப்பட்ட பிரிவையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: தீமை செய்கிறவர்களே, நீங்கள் அனைவரும்
  rationale: எபிரெயக் கட்டமைப்பிலுள்ள செயற்பாட்டு உருவகத்தையும் அனைவரையும் உள்ளடக்கும் כָּל என்பதன் வலிமையையும் காக்கிறது; ‘அக்கிரமக்காரர்கள்’ என்பதைவிட இது சாதாரண வாசகருக்கு நேரடியாகப் புரியும்.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கட்டளைக்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: שָׁמַע
  choice: கேட்டிருக்கிறார்
  rationale: முடிவுற்ற செயலும் அதன் தற்போதைய பொருத்தமும் கொண்ட எபிரெய நிறைவுநிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: קוֹל בִּכְיִי
  choice: என் அழுகையின் ஒலி
  rationale: ‘என் அழுகையின் குரல்/ஒலி’ என்ற எபிரெயச் சொற்றொடரின் கேட்கக்கூடிய புலம்பல் உருவகத்தைப் பாதுகாக்கிறது; ‘என் கண்ணீர்’ என்று மாற்றி காட்சியுருவமாக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை பொதுப் பட்டத்தை அல்ல, இறைவனின் தனிப்பெயரைப் பயன்படுத்துகிறது; ஆகவே அந்தப் பெயர் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: שָׁמַע என்பதன் காலநிலை மற்றும் சங்கீதக்காரரின் உறுதி
  choice: கேட்டிருக்கிறார்
  alternative: கேட்டார்
  rationale: கேட்கும் செயல் நிறைவேறிவிட்டது என்றும் அதன் விளைவு இப்போது பொருந்துகிறது என்றும் சங்கீதக்காரர் கொண்டுள்ள நம்பிக்கையை இது காட்டுகிறது; அதேவேளை அதற்கு மேலான விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியும் கண்ணியமுமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தீமை செய்கிறவர்களே’ என்பது மூலத்தின் செயற்பாட்டு வடிவத்தைத் தக்கவைக்கிறது; ‘அகன்று போங்கள்’ கட்டளையின் வலிமையை இயல்பாகக் கடத்துகிறது.
