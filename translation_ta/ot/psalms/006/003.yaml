  text: וְ֭/נַפְשִׁ/י נִבְהֲלָ֣ה מְאֹ֑ד ו/את יְ֝הוָ֗ה עַד מָתָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/003.yaml
  text: And my soul is greatly troubled—but you[a], O Yahweh[d][c][b], how long?
translation:
  language: ta
  text: என் உள்ளமும்[a] மிகவும் கலங்கிப்போயிருக்கிறது[b]. ஆனால் நீரோ[c], யாவே[d]—எதுவரை?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் உயிர்’ அல்லது ‘நானே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மிகவும் திகிலடைந்துள்ளது’ அல்லது ‘மிகவும் திகைத்துப்போயுள்ளது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் நேரடியாக ‘மற்றும் நீரோ’; புலம்பலில் ஏற்படும் திருப்பை வெளிப்படுத்த இங்கு ‘ஆனால் நீரோ’ என வழங்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: d
    text: எபிரெயத்தில் ‘YHWH’ (יהוה); மரபாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: என் உள்ளமும்
  rationale: נֶפֶשׁ என்பது சூழலுக்கேற்ப உயிர், தன்முழுமை, அல்லது உள்ளார்ந்த சுயம் எனப் பொருள்படும். இங்கு உடல் வேதனையோடு இணைந்த ஆழ்ந்த உள்ளக் கலக்கத்தைக் குறிக்க இயல்பான தமிழில் ‘என் உள்ளம்’ என மொழிபெயர்க்கப்பட்டுள்ளது; וְ என்பதன் தொடர்ச்சிப் பொருள் ‘-உம்’ மூலம் காக்கப்படுகிறது.
- source_word: נִבְהֲלָה
  choice: கலங்கிப்போயிருக்கிறது
  rationale: בהל வேர்ச்சொல் கடுமையாகக் கலங்குதல், திகிலடைதல், திகைத்துப்போதல் ஆகிய பொருள்களைத் தருகிறது. ‘கலங்கிப்போயிருக்கிறது’ என்பது புலம்பலின் தீவிரத்தையும் இயல்பான நவீன தமிழையும் இணைக்கிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: முன்னுள்ள வினையின் தீவிரத்தை வலுப்படுத்தும் வினையுரிச்சொல்; ‘மிகவும்’ அதன் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: וְאַתָּה
  choice: ஆனால் நீரோ
  rationale: וְ என்பதன் அடிப்படைப் பொருள் ‘மற்றும்/ஆனால்’; இங்கு புலம்புகிறவரின் நிலைமையிலிருந்து கடவுளை நேரடியாக நோக்கும் கூர்மையான திருப்பை ‘ஆனால்’ வெளிப்படுத்துகிறது. வலியுறுத்தப்பட்ட אַתָּה என்பதற்கு ‘நீரோ’ பொருந்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ வழங்கப்பட்டுள்ளது.
- source_word: עַד מָתָי
  choice: எதுவரை?
  rationale: ‘எப்போது வரை?’ என்ற புலம்பல் வினாவைச் சுருக்கமாகவும் உணர்ச்சித் தீவிரத்துடனும் வெளிப்படுத்தும் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல எபிரெய உரையில் ஒரு பொதுப் பட்டப்பெயர் அல்ல, יהוה என்ற தனிப்பெயரே உள்ளது. ஆகவே அதை மறைக்காமல் ஒலிபெயர்த்து, மரபுவழி மாற்றை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: ‘ஆனால் நீரோ, யாவே—எதுவரை?’ என்பதிலுள்ள முற்றுப்பெறாத வினா
  choice: மூலத்தின் விடுபட்ட வாக்கிய அமைப்பைத் தக்கவைத்தல்
  alternative: ‘ஆனால் நீர் எதுவரை தாமதிப்பீர்?’ என்று நிறைவு செய்தல்
  rationale: எபிரெயத்தில் கடவுள் என்ன செய்ய வேண்டும் அல்லது எதை எதுவரை செய்வார் என்பது வெளிப்படையாகச் சொல்லப்படவில்லை. அந்தத் துயரமிகு இடைநிறுத்தத்தையும் பொருள் திறப்பையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமும் உணர்ச்சித் தீவிரமும் பேணப்பட்டுள்ளன. ‘நீரோ’ என்ற மரியாதை ஒருமையும் இறுதியில் முற்றுப்பெறாமல் நிற்கும் வினாவும் மூலத்தின் நேரடி அழைப்பையும் பதற்றத்தையும் காக்கின்றன.
