  yaml_path: translation/ot/psalms/006/004.yaml
  text: Return, O LORD; rescue my life; save me for the sake of your steadfast love.
translation:
  language: ta
  text: ஆண்டவரே[a], திரும்பி வாரும்; என் உயிரை விடுவியும்; உமது மாறாத அன்பிற்காக என்னைக் காப்பாற்றும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இங்கு இறைவனுடைய தனிப்பெயரான YHWH (யாவே) உள்ளது.
    reason: ‘ஆண்டவர்’ என்ற மரபான மொழிபெயர்ப்பின் பின்னால் மூலத்தில் தனிப்பெயர் இருப்பதை வாசகருக்குத் தெரிவிக்கிறது; ஒரு குறிப்பிட்ட பின்னாளைய உச்சரிப்பைத் திணிக்காமல் பெயரை அடையாளப்படுத்துகிறது.
lexical_decisions:
- source_word: שׁוּבָה
  choice: திரும்பி வாரும்
  rationale: இறைவனை நோக்கிய வேண்டுகோளின் நேரடித் தன்மையையும், தமிழில் இயல்பான மரியாதை ஒருமை ஏவல் நடையையும் காக்கிறது.
- source_word: יְהוָה
  choice: ஆண்டவரே[a]
  rationale: தமிழ் வாசகர்களுக்குப் பரிச்சயமான மரியாதைமிக்க அழைப்பாக உள்ளது; இது மூலத்தில் வரும் இறைப் பெயர் என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: חַלְּצָה
  choice: விடுவியும்
  rationale: ஆபத்திலிருந்து பிடுங்கி மீட்பது அல்லது விடுவிப்பது என்ற வினையின் வலிமையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: இச்சூழலில் נֶפֶשׁ முழு உயிரையும் உயிர்வாழ்வையும் குறிக்கிறது; ‘ஆத்துமா’ என்று மட்டும் மொழிபெயர்த்து உடல்–ஆவி பிரிவைத் தேவையின்றி இறக்குமதி செய்வதைத் தவிர்க்கிறது.
- source_word: לְמַעַן חַסְדֶּךָ
  choice: உமது மாறாத அன்பினிமித்தம்
  rationale: חֶסֶד என்பதிலுள்ள உறுதியான, விசுவாசமிக்க அன்பை இயல்பான தமிழில் எடுத்துரைக்கிறது; மீட்புக்கான அடிப்படை இறைவனுடைய அன்பே என்பதையும் காக்கிறது.
theological_decisions:
- issue: נַפְשִׁי என்பதன் பொருள்
  choice: என் உயிரை
  alternative: என் ஆத்துமாவை
  rationale: சங்கீதக்காரர் தனது உயிர் அல்லது முழு நபரின் மீட்பைக் கேட்கிறார்; மூலச்சொல் கட்டாயப்படுத்தாத இருமைக் கோட்பாட்டை மொழிபெயர்ப்பு சேர்க்கவில்லை.
- issue: חֶסֶד என்பதன் பொருள் பரப்பு
  choice: மாறாத அன்பு
  alternative: கிருபை / உடன்படிக்கை அன்பு
  rationale: ‘மாறாத அன்பு’ என்ற சொற்றொடர் நிலைத்த அன்பும் விசுவாசமும் ஆகிய கருத்துகளைப் பொதுவாசகருக்குப் புரியும் வகையில் தருகிறது; ‘உடன்படிக்கை’ என்ற விளக்கச்சொல்லை மூலத்தில் வெளிப்படையாக இல்லாத இடத்தில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான மரியாதை ஒருமை நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று வேண்டுகோள்களின் சுருக்கமான இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
