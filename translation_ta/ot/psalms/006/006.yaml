translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. ‘படுக்கை/கட்டில்’ என்ற சொல்வேறுபாடு எபிரெய இணைவாக்கியத்தில் உள்ள מִטָּה/עֶרֶשׂ வேறுபாட்டைப் பிரதிபலிக்கிறது. முதல் அடியில் கண்ணீர் வெளிப்படையாக இல்லாவிட்டாலும், அடுத்த அடியின் ‘என் கண்ணீரால்’ என்பதன் அடிப்படையில் ‘கண்ணீரால் வெள்ளமாக்குகிறேன்’ என்று சூழலுக்கேற்ற வகையில் தெளிவுபடுத்தப்பட்டுள்ளது.
