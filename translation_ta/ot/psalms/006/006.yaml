source:
  edition: WLC
  text: יָגַ֤עְתִּי בְּֽ/אַנְחָתִ֗/י אַשְׂחֶ֣ה בְ/כָל לַ֭יְלָה מִטָּתִ֑/י בְּ֝/דִמְעָתִ֗/י עַרְשִׂ֥/י אַמְסֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/006.yaml
  text: I am weary with my groaning[a]; every night I drench my bed[b]; with my tears I soak my couch.
translation:
  language: ta
  text: என் பெருமூச்சினால் நான் களைத்துப்போனேன்; ஒவ்வோர் இரவும் என் படுக்கையைக் கண்ணீரால் நனைத்து மூழ்கடிக்கிறேன்[a]; என் கண்ணீரால் என் கட்டிலைத் தோய்க்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, “என் படுக்கையை நீந்தச் செய்கிறேன்”; கண்ணீரால் அதை முற்றிலும் நனைப்பதைக் குறிக்கும் கவித்துவ மிகைப்படுத்தல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: நான் களைத்துப்போனேன்
  rationale: நீடித்த துயரத்தாலும் புலம்பலாலும் ஏற்பட்ட ஆழ்ந்த களைப்பை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: בְּאַנְחָתִי
  choice: என் பெருமூச்சினால்
  rationale: אַנְחָה என்பது துயரத்தால் எழும் பெருமூச்சு அல்லது முனகலைக் குறிக்கிறது; இங்கு בְּ காரணம் அல்லது உடன்நிகழ்வைக் காட்டுகிறது.
- source_word: אַשְׂחֶה
  choice: வெள்ளமாக்குகிறேன்
  rationale: எபிரெய வினையின் நேர்ப்பொருள் படுக்கையை ‘நீந்தச் செய்வது’; கண்ணீரால் அதை முழுவதும் நனைப்பதைக் குறிக்கும் கவித்துவ மிகைப்படுத்தலை ‘வெள்ளமாக்குகிறேன்’ தக்கவைக்கிறது.
- source_word: בְכָל־לַיְלָה
  choice: ஒவ்வோர் இரவும்
  rationale: ஒரே இரவு முழுவதையும் விட, இரவுதோறும் திரும்பத் திரும்ப நிகழ்வதை இச்சொற்றொடர் இயல்பாகக் குறிக்கிறது.
- source_word: מִטָּתִי
  choice: என் படுக்கையை
  rationale: מִטָּה என்பதற்கான தெளிவான, பொதுவான நவீனத் தமிழ் இணைச்சொல்.
- source_word: בְּדִמְעָתִי
  choice: என் கண்ணீரால்
  rationale: கண்ணீரே நனைப்பதற்கான கருவி அல்லது வழி என்பதை בְּ இங்கு உணர்த்துகிறது.
- source_word: עַרְשִׂי
  choice: என் கட்டிலை
  rationale: עֶרֶשׂ என்பது படுக்கும் கட்டில் அல்லது மஞ்சத்தைக் குறிக்கலாம்; முந்தைய מִטָּה என்பதிலிருந்து வேறுபடுத்தி எபிரெய இணைவாக்கியத்தின் சொல்வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: אַמְסֶה
  choice: தோய்க்கிறேன்
  rationale: முழுமையாக நனைத்தல் என்ற சூழல்சார் பொருளைத் தெளிவாகவும் கவித்துவமாகவும் அளிக்கிறது; ‘கரையச் செய்கிறேன்’ என்ற நேர்ப்பொருள் இங்கு இயல்பற்றதாக இருக்கும்.
