  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
translation:
  language: ta
  text: யாவே, எனக்கு அருள்புரியும்; ஏனெனில் நான் வலுவிழந்திருக்கிறேன்[a]. யாவே, என்னைக் குணமாக்கும்; ஏனெனில் என் எலும்புகள் நடுங்குகின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நான் நலிந்திருக்கிறேன்” அல்லது “நான் மெலிந்துபோகிறேன்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் வலிமை குன்றி வாடும் நிலையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “என் எலும்புகள் கலங்கியுள்ளன” அல்லது “திகிலடைந்துள்ளன” என்றும் மொழிபெயர்க்கலாம்; “எலும்புகள்” என்பது ஆழ்ந்த உடல் வேதனையையோ உள்ளார்ந்த கலக்கத்தையோ வெளிப்படுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: எனக்கு அருள்புரியும்
  rationale: חנן என்ற வினையின் கட்டளை வடிவம் அருள் அல்லது தயவு காட்டும்படி வேண்டுகிறது. இத்தேர்வு எபிரெயச் சொல்லின் நேரடிப் பொருளையும் மன்றாட்டின் மாண்பான தொனியையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் நான்கு எழுத்துகளான יהוה ஒரு பட்டத்தால் மாற்றப்படாமல், தமிழில் எளிதாக உச்சரிக்கக்கூடிய தனிப்பெயராக ஒலிபெயர்க்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இரு மன்றாட்டுகளுக்கும் காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֻמְלַל
  choice: வலுவிழந்திருக்கிறேன்
  rationale: இச்சொல் தளர்ந்து, நலிந்து, வலிமை குன்றிய நிலையைக் குறிக்கிறது. இயல்பான நவீன தமிழில் அந்த நிலையை 'வலுவிழந்திருக்கிறேன்' தெளிவாகத் தெரிவிக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רְפָאֵנִי
  choice: என்னைக் குணமாக்கும்
  rationale: רפא என்பதன் நேரடிப் பொருள் குணமாக்குதல். உடல் சார்ந்ததோடு முழு மனிதரின் துயரையும் இங்கு உள்ளடக்கக்கூடும்; இருப்பினும் நேரடிப் பொருள் காக்கப்படுகிறது.
- source_word: נִבְהֲלוּ
  choice: நடுங்குகின்றன
  rationale: בהל திடுக்கிடுதல், கலங்குதல், பீதியடைதல் ஆகிய தீவிரமான நிலைகளைக் குறிக்கலாம். எலும்புகள் எழுவாயாக வருவதால், 'நடுங்குகின்றன' உடலில் உணரப்படும் துயரத்தை இயல்பாகவும் வலிமையாகவும் தெரிவிக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
- source_word: עֲצָמָי
  choice: என் எலும்புகள்
  rationale: எபிரெய மூலத்தின் உருவகத்தை விளக்கமாக மாற்றாமல் நேரடியாகக் காக்கிறது. இது ஆழ்ந்த உடல் அல்லது உள்ளார்ந்த துயரத்தையும் சுட்டக்கூடும்.
theological_decisions:
- issue: יהוה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருநாமமே உள்ளது. அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: எலும்புகள் நடுங்குதல் என்பதன் பொருள்
  choice: உருவகத்தை அப்படியே வைத்தல்
  alternative: என் உடல் முழுவதும் கலங்குகிறது
  rationale: עֲצָמָי என்பதைக் 'என் எலும்புகள்' என்று வைத்திருப்பது உடல்சார்ந்த மற்றும் உள்ளார்ந்த துயரத்துக்கு இடையிலான மூலத்தின் திறந்த தன்மையைக் காக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத மன்றாட்டுக்கேற்ற மாண்பான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இணையான இரு வேண்டுதல்களும் அவற்றின் காரணங்களும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன; இறுதி வாக்கியத்தின் உடல்சார்ந்த உருவகம் மாற்றப்படவில்லை.
