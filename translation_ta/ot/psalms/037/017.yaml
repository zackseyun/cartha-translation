source:
  edition: WLC
  text: כִּ֤י זְרוֹע֣וֹת רְ֭שָׁעִים תִּשָּׁבַ֑רְנָה וְ/סוֹמֵ֖ךְ צַדִּיקִ֣ים יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/017.yaml
  text: For the arms of the wicked will be broken[a], but Yahweh upholds the righteous.
translation:
  language: ta
  text: 'ஏனெனில், தீயவர்களின் புயங்கள்[a] முறிக்கப்படும்;

    ஆனால் நீதிமான்களை யாவே தாங்குகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் “புயங்கள்”; இங்கு அது தீயவர்களின் வலிமை அல்லது அதிகாரத்தைக் குறிக்கும் உருவகமாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள அறிவுரைக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: זְרוֹעוֹת
  choice: கைகள்
  rationale: எபிரெயச் சொல் நேரடியாக ‘புயங்கள்/கைகள்’ என்பதைக் குறிக்கிறது; கவிதையில் அது வலிமையையும் அதிகாரத்தையும் உருவகமாகக் குறிக்கலாம். தமிழில் concrete image இயல்பாகப் புரிய ‘கைகள்’ என வைத்து, துல்லியத்தை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: தீமை செய்கிற அல்லது தீய குணமுடையவர்களைக் குறிக்கும் பெயர்ச்சொல் பயன்பாட்டை நவீன, தெளிவான தமிழில் தருகிறது.
- source_word: תִּשָּׁבַרְנָה
  choice: முறிக்கப்படும்
  rationale: பெண்பால் பன்மை நிபால் வினையின் செயப்பாட்டு பொருளையும் எதிர்காலத் தன்மையையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְ
  choice: ஆனால்
  rationale: எழுத்துப்பூர்வமாக ‘மற்றும்’ என்றாலும், தீயவர்களின் முடிவுக்கும் நீதிமான்களின் பாதுகாப்புக்கும் இடையிலான எதிர்மறை ஒப்புமையைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: סוֹמֵךְ
  choice: தாங்குகிறார்
  rationale: தொடர்ந்து ஆதரித்து நிலைநிறுத்தும் பங்கேற்புவினையின் பொருளை இயல்பாகவும் கவித்துவமாகவும் தருகிறது.
- source_word: צַדִּיקִים
  choice: நீதிமான்கள்
  rationale: சங்கீத மற்றும் ஞான இலக்கியச் சூழலில் ஒழுக்கரீதியாக நேர்மையானவர்களைக் குறிக்கும் நிலையான, புரிந்துகொள்ளத்தக்க தமிழ் சொல்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: ‘கைகள் முறிக்கப்படும்’ என்ற உருவகத்தின் பொருள்
  choice: உருவகத்தை முதன்மை உரையில் அப்படியே வைத்தல்
  alternative: ‘வலிமை அழிக்கப்படும்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்தப் படம் தீயவர்களின் வலிமை அல்லது அதிகாரத்தைச் சுட்டலாம்; ஆனால் மூலத்தின் திட்டமிட்ட கவித்துவ உருவகத்தையும் அதன் பொருள் பரப்பையும் சுருக்காமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கைகள் முறிக்கப்படும்’ என்ற concrete image பாதுகாக்கப்பட்டு, அதன் உருவகப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
