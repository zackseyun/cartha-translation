source:
  edition: WLC
  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֗וֹב וּ/שְׁכֹ֥ן לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/027.yaml
  text: Turn away from evil and do good[a], and dwell forever.
translation:
  language: ta
  text: தீமையிலிருந்து விலகி, நன்மை செய்; என்றென்றும் குடியிரு[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இந்தச் சங்கீதத்தில் மீண்டும் மீண்டும் வரும் கருத்தைக் கவனத்தில் கொண்டால், இதை “தேசத்தில் என்றென்றும் குடியிரு” அல்லது “என்றென்றும் பாதுகாப்பாக வாழ்” என்றும் புரிந்துகொள்ளலாம். இங்கு எபிரெய உரை “தேசத்தில்” என்று வெளிப்படையாகக் கூறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: סוּר
  choice: விட்டு விலகி
  rationale: கட்டளை வடிவிலுள்ள இந்த வினைச்சொல் விலகுதல் அல்லது அகன்றுசெல்லுதல் என்பதைக் குறிக்கிறது. ‘விட்டு விலகி’ என்பது தீமையிலிருந்து மனவுறுதியுடன் அகல்வதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: מֵרָע
  choice: தீமையை
  rationale: מִן முன்னொட்டுடன் வரும் רַע, எதிலிருந்து விலக வேண்டும் என்பதைக் காட்டுகிறது. இங்குள்ள அறநெறிச் சூழலில் ‘தீமை’ பொருத்தமானது.
- source_word: וַעֲשֵׂה טוֹב
  choice: நன்மை செய்
  rationale: கட்டளை வினையையும் பெயர்ச்சொற்போல் பயன்படும் ‘நல்லது’ என்பதையும் சுருக்கமாகவும் இயல்பாகவும் எடுத்துரைக்கிறது; தீமையிலிருந்து விலகுதல் என்ற முந்தைய பகுதிக்கு இணையான அமைப்பையும் காக்கிறது.
- source_word: וּשְׁכֹן
  choice: குடியிரு
  rationale: இந்த வினை குடியிருத்தல், தங்கியிருத்தல், நிலையாக வசித்தல் ஆகிய பொருள்களைக் கொண்டது. ‘குடியிரு’ அதன் இடவாழ்வு மற்றும் நிலைத்திருப்பு நிழற்பொருளைக் காக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த அல்லது முடிவில்லாத தொடர்ச்சியைக் குறிக்கிறது. இங்கே ‘என்றென்றும்’ இயல்பான தமிழ் இணையாகும்.
theological_decisions:
- issue: וּשְׁכֹן לְעוֹלָם என்பதிலுள்ள அறிவுரை/வாக்குறுதியின் பொருள்
  choice: என்றென்றும் குடியிரு
  alternative: தேசத்தில் என்றென்றும் குடியிரு; என்றென்றும் பாதுகாப்பாக வாழ்; நீ என்றென்றும் குடியிருப்பாய்
  rationale: எபிரெய உரை தொடர்ச்சியான கட்டளைகளைக் கொண்டுள்ளது; குடியிருக்கும் இடத்தை இவ்வசனம் வெளிப்படையாகக் குறிப்பிடவில்லை. சங்கீதம் 37 முழுவதிலும் தேசத்தில் நிலைத்திருப்பது மீண்டும் மீண்டும் வருவதால் அந்தப் பொருள் சூழலில் சாத்தியம். எனினும், அதை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் தெளிவின்மையையும் காத்து, மாற்றுப் புரிதலை அடிக்குறிப்பில் தருகிறோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான கட்டளைத் தொனியுடனும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையுடனும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் மூன்று கட்டளைகளும் காக்கப்பட்டுள்ளன; வெளிப்படையாக இல்லாத ‘தேசத்தில்’ என்பது முதன்மை உரையில் சேர்க்கப்படவில்லை.
