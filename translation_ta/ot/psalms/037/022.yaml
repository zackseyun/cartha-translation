  text: For those blessed by him will inherit the land[a], but those cursed by him will be cut off.
translation:
  language: ta
  text: ஏனெனில், அவரால் ஆசீர்வதிக்கப்பட்டவர்கள் நாட்டை[a] உரிமையாகப் பெறுவார்கள்; ஆனால் அவரால் சபிக்கப்பட்டவர்கள் அறுத்து அகற்றப்படுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமியை.’ எபிரெய மொழியிலுள்ள אֶרֶץ என்ற சொல் ‘நாடு’ அல்லது ‘பூமி’ என்று பொருள்படலாம்; இங்கே சங்கீதத்தின் உடன்படிக்கைச் சூழலுக்கு ‘நாடு’ சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; சங்கீதத்தின் வாத ஓட்டத்திற்கு இயல்பாகப் பொருந்துகிறது.
- source_word: מְבֹרָכָיו
  choice: அவரால் ஆசீர்வதிக்கப்பட்டவர்கள்
  rationale: ברך என்பதன் செயல்பாட்டு எச்ச வடிவமும் மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டும் உள்ளன. சூழலில் கர்த்தரே செய்பவர் என்பதைத் தெளிவாக்கி, எபிரெயத்தின் செயப்பாட்டு உணர்வைப் பாதுகாக்கிறது.
- source_word: יִירְשׁוּ
  choice: உரிமையாகப் பெறுவார்கள்
  rationale: ירש என்பதன் ‘சுதந்தரித்தல்/உடைமையாக்குதல்’ என்ற பொருளையும், நிலம் அளிக்கப்படும் உடன்படிக்கைச் சார்ந்த ஒலிப்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָרֶץ
  choice: நாடு
  rationale: אֶרֶץ என்பது ‘நாடு’ அல்லது ‘பூமி’ எனப் பொருள்படலாம். சங்கீதம் 37-இல் மீண்டும் வரும் வாக்குறுதியின் உடன்படிக்கைச் சூழலுக்கு ‘நாடு’ சிறப்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּמְקֻלָּלָיו
  choice: ஆனால் அவரால் சபிக்கப்பட்டவர்கள்
  rationale: קלל என்பதன் செயப்பாட்டு எச்சத்தையும் மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டையும் வெளிப்படுத்துகிறது. இணைப்புச் சொல் இங்கு எதிர்மறை ஒப்புமையைக் குறிப்பதால் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִכָּרֵתוּ
  choice: அறுப்புண்டுபோவார்கள்
  rationale: כרת என்பதன் நிபால் வடிவம் ‘அறுக்கப்படுதல்/துண்டிக்கப்படுதல்’ என்ற எபிரெய உருவகத்தையும் அதன் நீதித்தீர்ப்பு வலிமையையும் காக்கிறது.
theological_decisions:
- issue: மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டுகளின் சுட்டுப்பொருள்
  choice: ‘அவரால்’ என்று வெளிப்படையாக மொழிபெயர்த்து, சூழலின்படி அது கர்த்தரைக் குறிப்பதாக வைத்தல்
  alternative: ‘அவருடைய ஆசீர்வதிக்கப்பட்டவர்கள் / அவருடைய சபிக்கப்பட்டவர்கள்’ என்று செய்பவரை வெளிப்படுத்தாமல் மொழிபெயர்த்தல்
  rationale: எபிரெயப் பின்னொட்டுகள் சூழலிலுள்ள ஒருமைச் சுட்டுப்பொருளான கர்த்தரை நோக்குகின்றன. ‘அவரால்’ என்பது செயப்பாட்டு எச்சத்தின் உறவைத் தெளிவாக்குகிறது; புதிய இறையியல் கூற்றைச் சேர்ப்பதில்லை.
- issue: אָרֶץ என்பதன் பரப்பு
  choice: நாடு
  alternative: பூமி
  rationale: சங்கீதம் 37 முழுவதும் நீதிமான்கள் אֶרֶץ-ஐ உரிமையாகப் பெறுவார்கள் என்ற வாக்குறுதி மீள்கிறது. ‘நாடு’ உடன்படிக்கை மற்றும் ஞான இலக்கியச் சூழலைக் காக்கிறது; பரந்த பொருளான ‘பூமி’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: இயல்பான, தற்போதைய, கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘உரிமையாகப் பெறுவார்கள்’ என்பது வாரிசுரிமை மற்றும் உடைமை ஆகிய இரு நுணுக்கங்களையும் இணைக்கிறது. ‘அறுப்புண்டுபோவார்கள்’ என்பது மூல எபிரெய உருவகத்தைத் தக்கவைத்தாலும் தமிழில் புரிந்துகொள்ளத்தக்கதாக உள்ளது.
