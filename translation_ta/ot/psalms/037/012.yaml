    text: அல்லது, ‘நீதிமானுக்கு எதிராகத் தீய திட்டம் வகுக்கிறான்.’
    reason: lexical_alternative
  - marker: b
    text: ‘பற்களை நெரித்துக் கடிப்பது’ என்பது கடும் கோபத்தையும் பகைமையையும் வெளிப்படுத்தும் மரபுத்தொடர்.
