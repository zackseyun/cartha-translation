  text: The wicked plots against the righteous and gnashes his teeth at him[a][b].
translation:
  language: ta
  text: தீயவன் நீதிமானுக்கு எதிராகச் சதித்திட்டம் தீட்டுகிறான்[a]; அவனுக்கு எதிராகப் பற்களை நெரித்துக் கடிக்கிறான்[b].
  philosophy: optimal-equivalence
