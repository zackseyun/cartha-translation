lexical_decisions:
- source_word: זֹמֵם
  choice: சதித்திட்டம் தீட்டுகிறான்
  rationale: இந்த எபிரெயப் பங்கேற்புவினை தீங்கான நோக்கத்துடன் திட்டமிடுவதைக் குறிக்கிறது. தொடர்ச்சியான செயற்பாட்டைத் தமிழில் இயல்பான நிகழ்கால வினை வெளிப்படுத்துகிறது.
- source_word: רָשָׁע
  choice: தீயவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட ஒருமைச் சொல்; தீமை செய்கிற ஒருவரைச் சுருக்கமாகவும் இயல்பாகவும் குறிக்கிறது.
- source_word: לַצַּדִּיק
  choice: நீதிமானுக்கு எதிராக
  rationale: לְ முன்னிடைச்சொல் இச்சூழலில் பகைமையின் இலக்கைக் குறிக்கிறது; ‘எதிராக’ அந்த உறவைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חֹרֵק
  choice: கடிக்கிறான்
  rationale: שִׁנָּיו என்பதுடன் சேர்ந்து கோபத்தாலும் பகைமையாலும் பற்களை நெரித்துக் கடிக்கும் எபிரெய மரபுத்தொடரை உருவாக்குகிறது.
- source_word: עָלָיו
  choice: அவனைப் பார்த்து
  rationale: செயலின் பகைமை யாரை நோக்கியது என்பதை நவீன தமிழில் இயல்பாகக் காட்டுகிறது; ‘அவனுக்கு எதிராக’ என்பதும் சாத்தியம்.
- source_word: שִׁנָּיו
  choice: பற்களை
  rationale: மூலத்தின் பன்மைப் பெயர்ச்சொல்லை நேரடியாகத் தருகிறது; தமிழில் உடலுறுப்பு உடைமை சூழலிலேயே தெளிவாக இருப்பதால் ‘தன்’ சேர்க்கப்படவில்லை.
