source:
  edition: WLC
  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
translation:
  language: ta
  text: நான் இளைஞனாக இருந்தேன்; இப்போது முதுமையடைந்துவிட்டேன். ஆனாலும், நீதிமான் கைவிடப்பட்டதையோ, அவனுடைய சந்ததி உணவுக்காக இரப்பதையோ[a] நான் கண்டதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில், “அப்பத்தைத் தேடுவதையோ” அல்லது “அப்பத்தைக் கேட்பதையோ.” இங்கு அடிப்படை உணவுக்காக இரப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: நான் இளைஞனாக இருந்தேன்
  rationale: இளமைப் பருவத்தைக் குறிக்கும் இயல்பான தமிழ் நடை; முதுமையுடன் வரும் சுயசரிதைத் தன்மையுள்ள எதிர்மறை ஒப்புமையைப் பாதுகாக்கிறது.
- source_word: גַּם זָקַנְתִּי
  choice: இப்போது முதுமையடைந்துவிட்டேன்
  rationale: גַּם என்பதன் இணைப்பு/முன்னேற்றப் பண்பை ‘இப்போது’ இயல்பாக வெளிப்படுத்துகிறது; வினைச்சொல் அடைந்த முதுமை நிலையைச் சுட்டுகிறது.
- source_word: וְלֹא רָאִיתִי
  choice: ஆனாலும் ... நான் கண்டதில்லை
  rationale: இளமை முதல் முதுமை வரையிலான பேச்சாளரின் அனுபவச் சாட்சியைக் காட்டுகிறது; இதை உலகளாவிய வாக்குறுதியாக வலுப்படுத்தவில்லை.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: எபிரெய ஆண்பால் ஒருமையின் பிரதிநிதித்துவப் பயன்பாட்டைப் பாதுகாக்கும், தமிழில் நிலைபெற்ற பொதுவான சொல்.
- source_word: נֶעֱזָב
  choice: கைவிடப்பட்டதை
  rationale: עזב என்பதன் செயல்பாட்டு வினை வடிவிலுள்ள கைவிடப்படுதல்/துறக்கப்படுதல் என்ற வலுவான பொருளை இயல்பாகத் தருகிறது.
- source_word: וְזַרְעוֹ
  choice: அவனுடைய சந்ததியினர்
  rationale: ‘அவனுடைய விதை’ என்ற சொல்லடிப் பொருளுக்குப் பதிலாக, இச்சூழலில் குறிக்கப்படும் பிள்ளைகள் அல்லது வழித்தோன்றல்களை இயல்பாகவும் பரந்த வகையிலும் தெரிவிக்கிறது.
- source_word: מְבַקֶּשׁ לָחֶם
  choice: உணவுக்காக இரந்து திரிவதை
  rationale: מְבַקֶּשׁ அடிப்படையில் ‘தேடுதல்/கேட்டல்’ என்றாலும், அப்பத்துடன் வரும் இச்சூழலில் அடிப்படை உணவுக்காக யாசிப்பதைக் குறிக்கிறது. ‘திரிவது’ தொடர்ச்சியான தேடலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இந்த வசனம் முழுமையான இறையியல் உத்தரவாதமா, சங்கீதக்காரரின் அனுபவக் கூற்றா?
  choice: ‘நான் கண்டதில்லை’ என்ற முதல் நபர் அனுபவக் கூற்றாகவே மொழிபெயர்க்கப்பட்டது.
  alternative: நீதிமான் அல்லது அவனுடைய சந்ததி ஒருபோதும் வறுமையை அனுபவிக்கமாட்டார்கள் என்ற நிபந்தனையற்ற பொதுவாக்குறுதி.
  rationale: எபிரெய உரை இளமை முதல் முதுமை வரையிலான பேச்சாளரின் சொந்தக் கவனிப்பாக வெளிப்படையாக அமைந்துள்ளது; ஆகவே உரையில் இல்லாத முழுமையான வாக்குறுதி சேர்க்கப்படவில்லை.
- issue: צַדִּיק மற்றும் זַרְעוֹ ஆகியவற்றின் எண் மற்றும் பாலின வடிவம்
  choice: ‘நீதிமான் ... அவனுடைய சந்ததியினர்’ என்று பிரதிநிதித்துவ ஒருமையைப் பாதுகாத்தல்.
  alternative: ‘நீதிமான்கள் ... அவர்களுடைய பிள்ளைகள்’ என்று முழுமையாகப் பன்மைப்படுத்துதல்.
  rationale: மூலத்தில் நீதிமான் ஆண்பால் ஒருமையில் பொதுவகைப் பிரதிநிதியாகவும், அதற்குரிய உடைமைப் பின்னொட்டு ஒருமையிலும் உள்ளது; தமிழ் வடிவம் அதைப் படிக்கத்தக்க முறையில் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடை. ‘நீதிமான்’ என்பது வேதாகமச் சூழலில் பரவலாக அறியப்பட்ட சொல். ‘அப்பம்’ என்ற சொல்லடிப் படிமத்தை விட, לֶחֶם இங்கு குறிக்கும் அடிப்படை வாழ்வாதாரப் பொருளை ‘உணவு’ தெளிவுபடுத்துகிறது; மாற்றுச் சொல்லடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
