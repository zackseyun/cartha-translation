source:
  edition: WLC
  text: וַ/עֲנָוִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ֝/הִתְעַנְּג֗וּ עַל רֹ֥ב שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/011.yaml
  text: But the humble will inherit the land and delight themselves in abundant peace[a][b].
translation:
  language: ta
  text: 'ஆனால் தாழ்மையானவர்கள்[a] நாட்டை[b] உரிமையாகப் பெறுவார்கள்;

    மிகுந்த சமாதானத்தில் மகிழ்ந்து திளைப்பார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சாந்தகுணமுள்ளவர்கள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பூமியை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: தாழ்மையானவர்கள்
  rationale: இந்தப் பன்மைச் சொல் தாழ்ந்த நிலையில் இருப்பவர்களையோ தாழ்மையுள்ளவர்களையோ குறிக்கலாம். சூழலில் உள்ள ஒழுக்கப் பொருளை இயல்பான நவீனத் தமிழில் ‘தாழ்மையானவர்கள்’ தெளிவாக எடுத்துரைக்கிறது; ‘சாந்தகுணமுள்ளவர்கள்’ என்பது ஏற்ற மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִירְשׁוּ
  choice: உரிமையாகப் பெறுவார்கள்
  rationale: ירשׁ என்பது ‘சுதந்தரித்துக்கொள், உரிமையாகப் பெறு, உடைமையாக்கு’ என்ற பொருள்களை உடையது. ‘உரிமையாகப் பெறுவார்கள்’ என்பது எதிர்காலப் பொருளையும் உடன்படிக்கை சார்ந்த உரிமையின் தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אָרֶץ
  choice: நாடு
  rationale: אֶרֶץ என்பதற்கு ‘நாடு/நிலம்’ என்றும் ‘பூமி’ என்றும் பொருள் உண்டு. இந்தச் சங்கீதத்தில் நாட்டை உரிமையாகப் பெறுதல் மற்றும் அதிலிருந்து அகற்றப்படுதல் மீண்டும் மீண்டும் வருவதால் ‘நாடு’ முதன்மைப் பொருளாகத் தேர்ந்தெடுக்கப்பட்டது; பரந்த பொருளான ‘பூமி’ அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְהִתְעַנְּגוּ
  choice: மகிழ்ந்து திளைப்பார்கள்
  rationale: ענג என்பதன் ஹித்பயேல் வடிவம் ஆழ்ந்து இன்புறுவதையோ மிகுந்த மகிழ்ச்சி அடைவதையோ குறிக்கிறது. ‘மகிழ்ந்து திளைப்பார்கள்’ அதன் தீவிரத்தையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: עַל
  choice: -த்தில்
  rationale: சொல்லுக்கு நேரடியாக ‘மேல்’ என்ற பொருள் இருந்தாலும், மகிழ்ச்சியையும் கருத்துப் பெயரையும் இணைக்கும் இவ்விடத்தில் தமிழில் ‘சமாதானத்தில்’ என்பதே இயல்பான உறவைக் காட்டுகிறது.
- source_word: רֹב
  choice: மிகுந்த
  rationale: இந்தப் பெயர்ச்சொல் மிகுதி, நிறைவு, பெருக்கம் ஆகியவற்றைக் குறிக்கிறது. தொடரும் பெயர்ச்சொல்லுடன் இயல்பாக அமைய ‘மிகுந்த’ என்று பெயரடையாக மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: שָׁלוֹם அமைதி மட்டுமல்லாமல் நல்வாழ்வு, முழுமை, பாதுகாப்பான செழிப்பு ஆகியவற்றையும் உள்ளடக்கலாம். இங்கு சுருக்கமாகவும் மரபாகவும் பரந்த ஒலிப்பையும் தரும் ‘சமாதானம்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: மத்தேயு 5:5-உடனான இடைநூல் தொடர்பும் ‘சாந்தகுணமுள்ளவர்கள் பூமியைச் சுதந்தரித்துக்கொள்வார்கள்’ என்ற மரபான வாசகமும்
  choice: எபிரெய மூலத்தின் இச்சூழலை முன்னிறுத்தி முதன்மை உரையில் ‘தாழ்மையானவர்கள் நாட்டை உரிமையாகப் பெறுவார்கள்’ என்று மொழிபெயர்த்து, ஏற்ற மாற்றுப் பொருள்களை அடிக்குறிப்புகளில் காப்பது.
  alternative: சாந்தகுணமுள்ளவர்கள் பூமியைச் சுதந்தரித்துக்கொள்வார்கள்.
  rationale: புதிய ஏற்பாட்டின் பிற்கால வரவேற்பை மூல எபிரெய உரையின் மேல் திணிக்காமல், அதே நேரத்தில் உண்மையான சொற்பொருள் வாய்ப்பையும் முக்கியமான இடைநூல் தொடர்பையும் மறைக்காமல் இத்தேர்வு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கவிதைநடையின் இணை அமைப்பைக் காக்க இரண்டு வரிகளாக வழங்கப்பட்டுள்ளது. ‘மகிழ்ந்து திளைப்பார்கள்’ என்பது மூல வினையின் தீவிரமான, தன்னிலை சார்ந்த மகிழ்ச்சியைத் தெரிவிக்கிறது; ‘சமாதானம்’ என்பது அமைதியோடு நல்வாழ்வின் பரந்த நிழற்பொருளையும் தக்கவைக்கிறது.
