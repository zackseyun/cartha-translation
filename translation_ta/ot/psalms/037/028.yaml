  text: כִּ֤י יְהוָ֨ה אֹ֘הֵ֤ב מִשְׁפָּ֗ט וְ/לֹא יַעֲזֹ֣ב אֶת חֲ֭סִידָי/ו לְ/עוֹלָ֣ם נִשְׁמָ֑רוּ וְ/זֶ֖רַע רְשָׁעִ֣ים נִכְרָֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/028.yaml
  text: For Yahweh loves justice and does not forsake his faithful ones[a]; they are kept forever[b], but the offspring of the wicked will be cut off.
translation:
  language: ta
  text: 'ஏனெனில், யாவே நீதியை நேசிக்கிறார்;

    தமக்கு உண்மையுள்ளவர்களை அவர் கைவிடமாட்டார்[a].

    அவர்கள் என்றென்றும் காக்கப்படுவார்கள்[b];

    ஆனால் தீயவர்களின் சந்ததி அறுத்தொழிக்கப்படும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தமக்கு உண்மையுள்ளவர்கள்’ என்பதற்கு ‘அவருடைய பரிசுத்தவான்கள்,’ ‘இறைப்பற்றுள்ளவர்கள்,’ அல்லது ‘அவரிடம் பற்றுறுதியுள்ளவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத் தொடரை இன்னும் நெருக்கமாக, ‘அவருடைய உண்மையுள்ளவர்கள் என்றென்றும் காக்கப்படுகிறார்கள்’ என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், எபிரெய உச்சரிப்புக்கு நெருக்கமான தமிழில் தருகிறது.
- source_word: אֹהֵב
  choice: நேசிக்கிறார்
  rationale: אהב என்பதன் நேரடியான பொருளை இயல்பான, கண்ணியமான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מִשְׁפָּט
  choice: நீதி
  rationale: இங்கு நியாயத்தீர்ப்பு என்ற தனிப்பட்ட செயலைவிட, நேர்மையான ஒழுங்கும் நியாயமும் என்ற அறநெறிப் பொருள் முதன்மையாக உள்ளது.
- source_word: יַעֲזֹב
  choice: கைவிடமாட்டார்
  rationale: עזב என்பதிலுள்ள விட்டுவிடுதல் அல்லது ஆதரவின்றிக் கைவிடுதல் என்ற உறவுசார் பொருளைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: חֲסִידָיו
  choice: தமக்கு உண்மையுள்ளவர்கள்
  rationale: חסד சார்ந்த பற்றுறுதி, பக்தி, விசுவாசம் ஆகிய உறவுசார் நிழற்பொருள்களை வெளிப்படுத்தி, பிற்கால சமயத் தொழில்நுட்பப் பொருளைத் தவிர்க்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: முடிவில்லாத அல்லது நிலைத்த காலநீட்சியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִשְׁמָרוּ
  choice: காக்கப்படுவார்கள்
  rationale: שמר என்ற வேரின் நிபால் வடிவிலுள்ள செயப்பாட்டு பொருளைப் பாதுகாத்து, சூழலில் உள்ள உறுதியளிக்கும் எதிர்காலத் தொனியையும் இயல்பாகத் தருகிறது.
- source_word: זֶרַע
  choice: சந்ததி
  rationale: இங்கு விதையைக் குறிக்காமல் வழித்தோன்றல்களை ஒருமைத் தொகுப்பாகக் குறிக்கும் பொருளுக்கு ஏற்றது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: அறநெறிக்கு எதிராக நடப்பவர்களைக் குறிக்கும் பன்மைக் குழுப் பொருளை எளிய நவீன தமிழில் தருகிறது.
- source_word: נִכְרָת
  choice: அழிக்கப்படும்
  rationale: சந்ததி தொடராமல் ஒழிக்கப்படும் என்ற כרת சொல்லின் விளைவை இயல்பான தமிழில் தெரிவிக்கிறது; சொற்சொல்லான ‘வெட்டப்படும்’ இச்சூழலில் தவறாகப் புரிந்துகொள்ளப்படலாம்.
theological_decisions:
- issue: חֲסִידָיו என்பதன் குறிப்பு மற்றும் பொருள்
  choice: ‘தமக்கு உண்மையுள்ளவர்கள்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது; இது யாவேயிடம் பற்றுறுதியும் இறைப்பற்றும் கொண்டவர்களைக் குறிக்கிறது.
  alternative: ‘அவருடைய பரிசுத்தவான்கள்,’ ‘அவரிடம் பற்றுறுதியுள்ளவர்கள்,’ அல்லது ‘இறைப்பற்றுள்ளவர்கள்.’
  rationale: இந்தச் சொல் חסד சார்ந்த உடன்படிக்கைப் பற்றுறுதியையும் பக்தியையும் சுமக்கிறது. தேர்ந்தெடுக்கப்பட்ட சொற்றொடர் அந்த உறவுசார் பொருளைக் காக்கிறது; ‘பரிசுத்தவான்கள்’ என்பதற்கு ஏற்படக்கூடிய பிற்காலத் தொழில்நுட்பச் சுருக்கத்தையும் தவிர்க்கிறது.
- issue: நடுவிலுள்ள இரண்டு கூறுகளின் தொடரியல் உறவு
  choice: ‘அவர் கைவிடமாட்டார்; அவர்கள் என்றென்றும் காக்கப்படுவார்கள்’ என்ற ஒன்றுக்கொன்று துணைநிற்கும் இரு உறுதிமொழிகளாக முதன்மை உரை அமைக்கப்பட்டுள்ளது.
  alternative: ‘தமக்கு உண்மையுள்ளவர்களை அவர் என்றென்றும் கைவிடாமல் காக்கிறார்’ என்பது போன்ற நெருக்கமான ஒரே தொடராகவும் புரிந்துகொள்ளலாம்.
  rationale: எபிரெயச் சொற்றொடர் இரண்டாவது கூறை முதலாவதன் விரிவாக்கமாகப் படிக்க இடமளிக்கிறது. தனி வாக்கியங்களாக அமைப்பது செயப்பாட்டு வினையை வெளிப்படையாக வைத்தபடியே அந்தத் தொடர்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் சங்கீதத்திற்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டுள்ளது. ‘யாவே’ என உடன்படிக்கைப் பெயர் பாதுகாக்கப்பட்டுள்ளது. கவிதை வரிப் பிரிப்பு எபிரெயக் கருத்து அலகுகளையும் எதிர்மறை ஒப்பீட்டையும் தெளிவாக்குகிறது.
