  text: אֲדֹנָ֥/י יִשְׂחַק ל֑/וֹ כִּֽי רָ֝אָ֗ה כִּֽי יָבֹ֥א יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/013.yaml
  text: The Lord laughs at him[b][a], for he sees that his day is coming.
translation:
  language: ta
  text: ஆண்டவர் அவனைப் பார்த்து நகைக்கிறார்[a]; ஏனெனில், அவனுடைய நாள் வருவதை அவர் காண்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவனை ஏளனம் செய்கிறார்’ அல்லது ‘அவனைப் பரிகசிக்கிறார்’ என்றும் பொருள் கொள்ளலாம்; எபிரெய வினை சொல்லுக்கு நேரடியாக ‘நகைக்கிறார்’ என்று பொருள், ஆனால் இச்சூழலில் அது ஏளன நுண்பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவனுடைய நாள்’ என்பது தீயவனுக்குக் குறிக்கப்பட்ட வீழ்ச்சி அல்லது நியாயத்தீர்ப்பு நாளைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: தெய்வீக ஆளுகையைக் குறிக்கும் எபிரெயத் தலைப்புக்கு இயல்பான, மரியாதைமிக்க நவீனத் தமிழ் இணை.
- source_word: יִשְׂחַק
  choice: நகைக்கிறார்
  rationale: שׂחק என்பதன் அடிப்படைப் பொருளான ‘சிரித்தல்/நகைத்தல்’ என்பதைக் காக்கிறது; சூழலில் இகழ்ச்சியான நுண்பொருள் இருப்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: לוֹ
  choice: அவனைப் பார்த்து
  rationale: இங்கு ל என்பது தீயவனை ஆண்டவரின் நகைப்புக்குரிய இலக்காகக் காட்டுகிறது; தமிழில் ‘அவனைப் பார்த்து நகைக்கிறார்’ என்பது இயல்பான வெளிப்பாடு.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முதல் כִּי ஆண்டவர் நகைப்பதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: רָאָה
  choice: காண்கிறார்
  rationale: வடிவில் நிறைவுக்கால வினையாக இருந்தாலும், வரவிருக்கும் முடிவை ஆண்டவர் தெளிவாகக் காணும் தற்போதைய பொருத்தத்தைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: כִּי
  choice: வருவதை
  rationale: இரண்டாவது כִּי, அவர் காண்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் வினையெச்சப் பெயராக்க அமைப்பு இயல்பானது.
- source_word: יָבֹא
  choice: வருவதை
  rationale: வரவிருக்கும் நிகழ்வைக் குறிக்கும் எபிரெய இறவாக்காலத்தின் எதிர்கால நோக்கைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יוֹמוֹ
  choice: அவனுடைய நாள்
  rationale: ‘அவனுடைய நாள்’ என்ற எபிரெயக் கவித்துவச் சுருக்கத்தை நேரடியாகக் காக்கிறது; அதன் சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தெய்வீக நகைப்பின் தன்மை
  choice: ஆண்டவர் தீயவனைப் பார்த்து நகைக்கிறார்
  alternative: ஆண்டவர் அவனை ஏளனம் செய்கிறார்
  rationale: எபிரெய வினையின் அடிப்படைப் பொருள் ‘நகைத்தல்’; நியாயத்தீர்ப்பு நெருங்குவதை முன்னிட்டு இது ஏளன நுண்பொருள் பெறுகிறது. முதன்மை உரை அடிப்படைச் சொல்லைப் பாதுகாத்து, நுண்பொருளை அடிக்குறிப்பில் குறிப்பிடுகிறது.
- issue: ‘அவனுடைய நாள்’ என்பதன் குறிப்பு
  choice: கவித்துவமான தெளிவின்மையை முதன்மை உரையில் வைத்திருத்தல்
  alternative: அவனுடைய அழிவின் நாள் / அவனுக்குக் குறிக்கப்பட்ட நியாயத்தீர்ப்பு நாள்
  rationale: மூலத்தில் ‘அவனுடைய நாள்’ என்றே உள்ளது. சங்கீதத்தின் சூழல் அதை தீயவனின் வீழ்ச்சி அல்லது நியாயத்தீர்ப்பு நாளாகச் சுட்டினாலும், மொழிபெயர்ப்பு அந்த விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவச் சுருக்கமும் கண்ணியமான வேதாகம நடையும் காக்கப்பட்டுள்ளன. ‘நகைக்கிறார்’ என்பது மூல வினையின் நேரடிப் பொருளைத் தக்கவைக்கிறது; ‘அவனுடைய நாள்’ என்ற உருவகம் விளக்கி விரிவாக்கப்படாமல் வைக்கப்பட்டுள்ளது.
