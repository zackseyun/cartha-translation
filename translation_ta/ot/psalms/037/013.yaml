  source_fidelity: 'மூல எபிரெய உரையின் முக்கிய கூறுகள் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன: אֲדֹנָי ‘ஆண்டவர்,’ יִשְׂחַק ‘நகைக்கிறார்,’ לוֹ என்பதன் இலக்குப் பொருள் ‘அவனைப் பார்த்து,’ மற்றும் ‘அவனுடைய நாள் வருதல்.’ רָאָה-வின் நிறைவுக்கால வடிவம் சூழலுக்கேற்ற தற்போதைய உணர்வுடன் ‘காண்கிறார்’ என இயல்பாகத் தரப்பட்டுள்ளது. இரண்டாவது כִּי-யின் உள்ளடக்கத் தொடர்பும் ‘வருவதை’ என்ற அமைப்பில் நன்றாக வெளிப்படுகிறது.'
