  text: גּ֣וֹל עַל יְהוָ֣ה דַּרְכֶּ֑/ךָ וּ/בְטַ֥ח עָ֝לָ֗י/ו וְ/ה֣וּא יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
translation:
  language: ta
  text: உன் வழியை யாவேயிடம் ஒப்படை[a]; அவரை நம்பு; அவரே செயல்படுவார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக, ‘உன் வழியை யாவே மீது உருட்டு.’ இந்த மரபுத்தொடர், ஒருவரின் வாழ்க்கைப் போக்கை அவரிடம் நம்பிக்கையுடன் ஒப்படைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர் அதைச் செய்வார்’ அல்லது ‘அவர் அதை நிறைவேற்றுவார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில் ‘அவர் செய்வார்/செயல்படுவார்’ என்று மட்டுமே உள்ளது; செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל
  choice: ஒப்படைத்துவிடு
  rationale: இந்தக் கட்டளைச்சொல் நேரடியாக ‘உருட்டு’ என்று பொருள்பட்டாலும், עַל יְהוָה மற்றும் ‘உன் வழி’ என்பவற்றுடன் வரும் இச்சொற்றொடர், ஒருவரின் வாழ்க்கைப் போக்கை யாவேயின் பொறுப்பில் ஒப்படைப்பதைக் குறிக்கிறது. ‘ஒப்படைத்துவிடு’ என்பது உருவகத்தின் நோக்கத்தையும் கட்டளையின் வலிமையையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: עַל
  choice: யிடம்
  rationale: גּוֹל என்பதுடன் இது நேரடியாக ‘மேல்’ எனப் பொருள்படும். ஆனால் ‘ஒப்படை’ என்ற தமிழ் வினையுடன் ‘யாவேயிடம்’ என்பது இயல்பான தொடர்புருபாக இருந்து, அவர்மீது பாரத்தை வைக்கும் அடிப்படை கருத்தை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலின் தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துப் பெயர். பட்டத்தால் மாற்றாமல், தமிழில் எளிதாக வாசிக்கக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: דַּרְכֶּךָ
  choice: உன் வழியை
  rationale: ‘வழி’ என்பது நேரடியான பொருள்; ஞான இலக்கியச் சூழலில் ஒருவரின் வாழ்க்கைப் போக்கு அல்லது நடத்தை என்பதையும் இயல்பாகக் குறிக்க முடியும்.
- source_word: וּבְטַח
  choice: நம்பு
  rationale: בטח என்ற வினையின் கட்டளை வடிவைச் சுருக்கமாகவும் நேரடியாகவும் தருகிறது; தனிப்பட்ட சார்பையும் நம்பிக்கையையும் வெளிப்படுத்துகிறது.
- source_word: עָלָיו
  choice: அவரை
  rationale: எபிரெயத்தில் ‘அவர்மேல்’ என்ற அமைப்பு இருந்தாலும், ‘அவரை நம்பு’ என்பதே நவீனத் தமிழின் இயல்பான வழக்கு; சார்ந்திருக்கும் கருத்து மாறாமல் உள்ளது.
- source_word: וְהוּא
  choice: அவரே
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட சுட்டுப்பெயர் எழுவாயை வலியுறுத்துகிறது. தமிழில் ‘அவரே’ என்பது யாவேதான் செயல்படுவார் என்ற வலியுறுத்தலை இயல்பாகப் பாதுகாக்கிறது.
- source_word: יַעֲשֶׂה
  choice: செயல்படுவார்
  rationale: עשה என்பது ‘செய், உண்டாக்கு, செயல்படு’ என்ற பரந்த பொருளுடையது; இங்கு செயப்படுபொருள் வெளிப்படையாக இல்லை. ‘செயல்படுவார்’ என்பது குறிப்பிடப்படாத ‘அதை’ சேர்க்காமல் மூலத்தின் திறந்த தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் தனிப்பெயரான நான்கெழுத்துப் பெயரே உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
- issue: יַעֲשֶׂה என்பதற்கான மறைந்த செயப்படுபொருளைக் குறிப்பிட வேண்டுமா
  choice: செயப்படுபொருளைச் சேர்க்காமல் ‘அவரே செயல்படுவார்’ என விடுதல்
  alternative: அவர் அதைச் செய்வார்; அவர் அதை நிறைவேற்றுவார்
  rationale: எபிரெய உரையில் செயப்படுபொருள் வெளிப்படையாகக் கூறப்படவில்லை. அதைக் குறிப்பிட்டுச் சேர்க்காமல் இருப்பது வாக்குறுதியை அளவுக்கு மீறி வரையறுக்காமல், மூலத்தின் பொருள் திறப்பையும் இறையியல் இழுவிசையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளை கண்ணியமான ஒருமை உரையாடல் நடை பயன்படுத்தப்பட்டுள்ளது. யாவே குறித்த சுட்டுப்பெயரும் வினையும் மரியாதைப் பன்மையில் அமைந்துள்ளன. முதல் அடியின் எபிரெய உருவகம் முதன்மை உரையில் இயல்பான தமிழாக்கமாகவும், அடிக்குறிப்பில் நேரடி வடிவமாகவும் பாதுகாக்கப்பட்டுள்ளது.
