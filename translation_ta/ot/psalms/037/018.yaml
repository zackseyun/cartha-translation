    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יוֹדֵעַ
  choice: அறிந்திருக்கிறார்
  rationale: தொடர்ந்து நிலவும் தனிப்பட்ட, கவனமுள்ள அறிவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘காத்துக்கொள்கிறார்’ போன்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: יְמֵי
  choice: வாழ்நாட்களை
  rationale: சொல்லளவில் ‘நாட்கள்’ என்றாலும், இங்கு ஒருவரின் வாழ்க்கைக் காலத்தைக் குறிக்கும் எபிரெய வழக்கைத் தெளிவான நவீன தமிழில் தருகிறது.
- source_word: תְמִימִם
  choice: குற்றமற்றவர்கள்
  rationale: முழுமை, நேர்மை, பழியற்ற நடத்தை ஆகிய பொருள்களைத் தாங்குகிறது; சங்கீதத்தின் நீதிமான்கள்–தீயவர்கள் வேறுபாட்டிற்கு ஏற்றது. இது முற்றிலும் பாவமற்றவர்கள் என்ற கட்டாயப் பொருளைச் சேர்ப்பதில்லை.
- source_word: נַחֲלָתָם
  choice: அவர்களுடைய உரிமைப்பங்கு
  rationale: மரபாகவோ ஒதுக்கீடாகவோ கிடைக்கும் சொத்து அல்லது பங்கை வெளிப்படுத்துகிறது; நவீன தமிழில் ‘சுதந்தரம்’ என்பதற்கு ஏற்படக்கூடிய ‘விடுதலை’ என்ற குழப்பத்தைத் தவிர்க்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: காலவரையற்ற நிலைத்தன்மையை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: תִּהְיֶה
  choice: இருக்கும்
  rationale: எளிய எதிர்காலப் பொருளைப் பாதுகாக்கிறது; மூலத்தில் வெளிப்படையாக இல்லாத ‘நிலைத்திருக்கும்’ என்ற விளக்கத்தை முதன்மை உரையில் சேர்க்கவில்லை.
theological_decisions:
- issue: ஞான இலக்கியச் சூழலில் תְמִימִם என்பதன் பொருள்
  choice: நேர்மையும் முழுமனதுமான வாழ்க்கையால் அறியப்படுகிறவர்கள்; முற்றிலும் பாவமற்றவர்கள் என்ற கூற்று அல்ல.
  alternative: முழுமையான ஒழுக்கக் குறையற்றவர்கள் அல்லது ‘நேர்மையானவர்கள்’.
  rationale: மூலச்சொல்லின் முழுமை/பழியின்மை சார்ந்த பொருளையும், சங்கீதத்தின் நீதிமான்–தீயவன் ஒப்பீட்டையும் பாதுகாக்கிறது; உரை கூறாத முழுமையான பாவமின்மைக் கோட்பாட்டைச் சேர்ப்பதில்லை.
- issue: தேவன் ‘அறிவது’ என்பதன் வலிமை
  choice: கவனமும் உறவுமிக்க அறிவை உள்ளடக்கக்கூடிய நேரடியான ‘அறிந்திருக்கிறார்’.
  alternative: ‘அங்கீகரிக்கிறார்’ அல்லது ‘கண்காணித்துக் காக்கிறார்’.
  rationale: சூழலில் வெறும் தகவலறிவை விட ஆழமான கருத்து இருக்கலாம்; எனினும் ידע என்ற சொல்லை மிகையாக விளக்காமல் அதன் செறிவை வாசகர் உணர இடமளிக்கிறது.
- issue: உரிமைப்பங்கு என்றென்றும் இருப்பதன் பொருள்
  choice: மூலத்தின் காலவரையற்ற கூற்றை அப்படியே வைத்தல்.
  alternative: அவர்கள் அதை எப்போதும் உடைமையாக வைத்திருப்பார்கள் அல்லது அது நிரந்தரமாக நிலைத்திருக்கும்.
  rationale: இவ்வாக்கியம் நீடித்த உடைமையையோ நிரந்தரத்தையையோ சுட்டலாம்; குறிப்பிட்ட விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல் உண்மையான பொருள் விரிவை வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைப் பயன்படுத்துகிறது. கவிதைச் சுருக்கத்தைப் பாதுகாக்க அரைப்புள்ளி இடப்பட்டுள்ளது. ‘சுதந்தரம்’ என்பதன் நவீன ‘விடுதலை’ சார்ந்த குழப்பத்தைத் தவிர்த்து ‘உரிமைப்பங்கு’ தேர்ந்தெடுக்கப்பட்டது.
