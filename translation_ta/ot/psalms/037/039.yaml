    text: ‘புகலிடம்’ அல்லது ‘கோட்டை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשׁוּעַת
  choice: மீட்பு
  rationale: תְּשׁוּעָה என்பது சூழலின்படி மீட்பு, காப்பாற்றுதல், வெற்றி ஆகிய பொருள்களைக் குறிக்கலாம். சங்கீதத்தின் இறையியல் நயத்தையும் உடனடியான ஆபத்திலிருந்து காக்கப்படுதலையும் இயல்பாகத் தாங்குவதால் ‘மீட்பு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: צַדִּיקִים
  choice: நீதிமான்கள்
  rationale: பன்மை பெயரடையாகிய இச்சொல் பெயர்ச்சொல் நிலையில், நீதியால் பண்பிடப்படுகிறவர்களைக் கூட்டாகக் குறிக்கிறது; ‘நீதிமான்கள்’ தமிழில் இயல்பானதும் மரியாதைமிக்கதுமாகும்.
- source_word: מֵיְהוָה
  choice: யாவேவிடமிருந்து
  rationale: מִן முன்னொட்டு மூலத்தைக் குறிக்கிறது. அதனால் மீட்பு யாவேவிடமிருந்து வருகிறது என்ற ஆதாரப் பொருள் தெளிவாக வைக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப் பெயரான יהוה ஒலிபெயர்த்து வழங்கப்பட்டது; பொதுப்பட்டப் பெயராக மாற்றப்படவில்லை.
- source_word: מָעוּזָּם
  choice: அவர்களுடைய அரண்
  rationale: מָעוֹז என்பது வலிமையும் பாதுகாப்பும் அளிக்கும் அரண் அல்லது புகலிடத்தைக் குறிக்கிறது. மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதி ‘அவர்களுடைய’ என்பதில் வெளிப்படுத்தப்பட்டது.
- source_word: בְּעֵת צָרָה
  choice: துன்பக் காலத்தில்
  rationale: காலத்தைக் குறிக்கும் בְּעֵת மற்றும் நெருக்கடி அல்லது இடுக்கண் எனப் பொருள்படும் צָרָה ஆகியவை இயல்பான நவீனத் தமிழில் ‘துன்பக் காலத்தில்’ என வழங்கப்பட்டன.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் உடன்படிக்கையின் தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதனைப் பொதுவான பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்த்தது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: வினையில்லா இரண்டாம் கூறின் தொடர்பு
  choice: அவரே அவர்களுடைய அரண்
  alternative: அவர்களுடைய அரண்
  rationale: எபிரெயத்தில் இரண்டாம் கூறு பெயர்ச்சொல் வாக்கியமாக உள்ளது. தமிழில் ‘அவரே’ என்பதைச் சேர்ப்பது முந்தைய கூறிலுள்ள யாவேதான் அரண் என்பதை இயல்பாகத் தெளிவாக்குகிறது; புதிய இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் சுருக்கமானதும் கண்ணியமானதும் ஆகிய நடையைப் பயன்படுத்துகிறது. எபிரெயக் கவிதையின் இரு இணைக் கூறுகளும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன; ‘அரண்’ என்ற சொல் பாதுகாப்பு மற்றும் வலிமை என்ற உருவகத்தைச் சுருக்கமாகப் பேணுகிறது.
