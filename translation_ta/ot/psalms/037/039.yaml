  yaml_path: translation/ot/psalms/037/039.yaml
  text: The salvation of the righteous is from Yahweh[c][b][a]; he is their stronghold in a time of trouble.
translation:
  language: ta
  text: நீதிமான்களின் மீட்பு[a] யாவேவிடமிருந்து[b] வருகிறது; துன்பக் காலத்தில் அவர் அவர்களுடைய அரண்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காப்பாற்றுதல்’ அல்லது ‘வெற்றி’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் மீட்பு, ஆபத்திலிருந்து காப்பாற்றுதல், வெற்றி ஆகிய பொருள்களைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘YHWH’; பாரம்பரியமாக ‘கர்த்தர்’ என்று வழங்கப்படுகிறது.
    reason: alternative_reading
