source:
  edition: WLC
  text: מֵ֭/יְהוָה מִֽצְעֲדֵי גֶ֥בֶר כּוֹנָ֗נוּ וְ/דַרְכּ֥/וֹ יֶחְפָּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
translation:
  language: ta
  text: ஆண்டவரிடமிருந்து ஒரு மனிதனின் நடைகள் உறுதிப்படுத்தப்படுகின்றன[b]; அவனுடைய வழியில் அவர் மகிழ்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவன் தன் வழியில் மகிழ்கிறான்’ என்றும் புரிந்துகொள்ளலாம்; எபிரெயத்தில் ‘மகிழ்கிறார்/மகிழ்கிறான்’ என்பதன் எழுவாய் வெளிப்படையாக இல்லை.
    reason: alternative_reading
  - marker: b
    text: ‘ஒரு மனிதனின் நடைகள் ஆண்டவரால் உறுதிப்படுத்தப்படுகின்றன’ என்றும் மொழிபெயர்க்கலாம்.
    reason: previous_rendering
lexical_decisions:
- source_word: מֵיְהוָה
  choice: ஆண்டவரிடமிருந்தே
  rationale: מִן மூலத்தையும் தோற்றத்தையும் குறிக்கிறது. ‘ஆண்டவரிடமிருந்தே’ என்பது எபிரெயச் சொல்லமைப்பை இயல்பான தமிழில் காத்து, காலடிகள் நிலைபெறுவதன் மூலம் ஆண்டவர் என்பதை வலியுறுத்துகிறது.
- source_word: מִצְעֲדֵי
  choice: காலடிகள்
  rationale: நடையின் அடிகளைக் குறிக்கும் உருவகத்தைப் பேணி, ஒருவரின் வாழ்க்கைப் பயணத்தையும் இயல்பாக உணர்த்துகிறது.
- source_word: גֶבֶר
  choice: ஒரு மனிதனின்
  rationale: இச்சொல் இலக்கணரீதியாக ஆண்பாலைக் குறிக்கிறது; ஞான இலக்கியச் சூழலில் பொதுவான மனிதனையும் சுட்டலாம். ‘மனிதன்’ இரு அம்சங்களையும் தேவையின்றி மிகைப்படுத்தாமல் தருகிறது.
- source_word: כּוֹנָנוּ
  choice: நிலைநிறுத்தப்படுகின்றன
  rationale: כון என்பதன் புறவினை வடிவம் உறுதிப்படுத்துதல் அல்லது நிலைபெறச் செய்தல் என்பதைக் குறிக்கிறது. தமிழ் மொழிபெயர்ப்பு அதன் புறவினை அமைப்பையும் உறுதியின் நுண்பொருளையும் காக்கிறது.
- source_word: וְדַרְכּוֹ
  choice: அவனுடைய வழியில்
  rationale: דרך என்பதன் நேரடியான ‘வழி’ என்ற உருவகத்தையும், வாழ்வின் நடத்தை அல்லது போக்கு என்ற விரிந்த பொருளையும் பேணுகிறது.
- source_word: יֶחְפָּץ
  choice: அவர் மகிழ்கிறார்
  rationale: חפץ இங்கு மகிழ்ச்சி அல்லது விருப்பம் கொள்வதைக் குறிக்கிறது. முதன்மை வாசிப்பில் மறைந்துள்ள எழுவாய் ஆண்டவர் என்பதால் மரியாதைப் பன்மையான ‘அவர்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: יֶחְפָּץ (‘மகிழ்கிறார்’) என்பதன் மறைந்துள்ள எழுவாய்
  choice: 'ஆண்டவர் எழுவாய்: ‘அவனுடைய வழியில் அவர் மகிழ்கிறார்.’'
  alternative: 'மனிதன் எழுவாய்: ‘அவன் தன் வழியில் மகிழ்கிறான்.’'
  rationale: எபிரெயத்தில் எழுவாய் வெளிப்படையாகக் கொடுக்கப்படவில்லை. முதல் அரையடியில் வரும் ஆண்டவரை எழுவாயாகக் கொள்வது தொடரமைப்புக்கும் கருத்தோட்டத்துக்கும் பொருத்தமான முதன்மை வாசிப்பு. ஆயினும் மனிதனையே எழுவாயாகக் கொள்வதும் இலக்கணரீதியாகச் சாத்தியமாதலால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் தொடக்கச் சொல் வரிசையும் மூலத்தைக் குறிக்கும் முன்னிலையும் ‘ஆண்டவரிடமிருந்தே’ என்பதில் பேணப்பட்டுள்ளன. முதன்மை வாசிப்பில் ‘அவர்’ ஆண்டவரைக் குறித்தாலும், மூலத்தின் உண்மையான எழுவாய் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகக் காக்கப்பட்டுள்ளது.
