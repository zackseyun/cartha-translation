source:
  edition: WLC
  text: כִּ֤י רְשָׁעִ֨ים יֹאבֵ֗דוּ וְ/אֹיְבֵ֣י יְ֭הוָה כִּ/יקַ֣ר כָּרִ֑ים כָּל֖וּ בֶ/עָשָׁ֣ן כָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/020.yaml
  text: For the wicked will perish[a], and the enemies of Yahweh are like the glory of the pastures; they vanish—like smoke they vanish away.
translation:
  language: ta
  text: 'ஏனெனில், பொல்லாதவர்கள் அழிந்துபோவார்கள்;

    யாவேயின் பகைவர்கள் மேய்ச்சல் நிலங்களின் பொலிவைப்போல் அழிந்துபோவார்கள்[a];

    அவர்கள் மறைந்துபோவார்கள்—

    புகையைப்போல் மறைந்துபோவார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, பாரம்பரிய விளக்கத்தின்படி: “செம்மறியாட்டுக் குட்டிகளின் கொழுப்பைப்போல்.” இந்த எபிரெயச் சொற்றொடரின் பொருள் உறுதியாக இல்லை.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்திற்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், அதன் காரணப்பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: சங்கீத ஞான இலக்கியச் சூழலில் ஒழுக்கரீதியாகத் தீமை செய்பவர்களைக் குறிக்கும் இயல்பான, தெளிவான தமிழ் சொல்.
- source_word: יֹאבֵדוּ
  choice: அழிந்துபோவார்கள்
  rationale: אָבַד என்பதன் அழிவடைதல் அல்லது முற்றிலும் ஒழிந்துபோதல் என்ற பொருளையும் எதிர்காலத் தன்மையையும் வெளிப்படுத்துகிறது.
- source_word: וְאֹיְבֵי יְהוָה
  choice: யாவேயின் பகைவர்கள்
  rationale: எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் நேரடியாகக் கொடுக்கிறது; தெய்வீகப் பெயர் பட்டமாக மாற்றப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: כִּיקַר כָּרִים
  choice: மேய்ச்சல் நிலங்களின் பொலிவைப்போல்
  rationale: சிக்கலான இச்சொற்றொடரில் יקר என்பதன் பொலிவு/மாட்சி என்ற பொருளையும் כרים என்பதன் மேய்ச்சல் நிலங்கள் என்ற கவிதைநடைப் பொருளையும் பின்பற்றுகிறது. விரைவில் மறையும் இயற்கைப் பொலிவு என்ற அடுத்த உருவகத்துடனும் பொருந்துகிறது.
- source_word: כָּלוּ ... כָּלוּ
  choice: மறைந்துபோவார்கள் ... மறைந்துபோவார்கள்
  rationale: כלה என்பதன் முற்றுப்பெறுதல் அல்லது ஒழிந்துபோதல் என்ற பொருளைத் தருவதோடு, மூலத்தின் வலியுறுத்தும் மறுபடியுரைத்தலையும் காக்கிறது.
- source_word: בֶעָשָׁן
  choice: புகையைப்போல்
  rationale: இங்கு בְ முன்னிடைச்சொல்லை ஒப்புமையாகப் புரிந்துகொள்வது புகை மறையும் உருவகத்தை இயல்பான தமிழில் தெளிவாக்குகிறது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: כִּיקַר כָּרִים என்ற சிக்கலான சொற்றொடரின் பொருள்
  choice: மேய்ச்சல் நிலங்களின் பொலிவைப்போல்
  alternative: செம்மறியாட்டுக் குட்டிகளின் கொழுப்பைப்போல்
  rationale: மசோரா உரையின் உயிர்க்குறிகளுக்கும் புகைபோல் மறையும் அடுத்த உருவகத்திற்கும் முதன்மை வாசிப்பு பொருந்துகிறது. எனினும், பாரம்பரிய மாற்றுப் பொருள் உண்மையான உரைவிளக்கச் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இருமுறை வரும் כָּלוּ தமிழிலும் இருமுறை தரப்பட்டு வலியுறுத்தல் காக்கப்பட்டுள்ளது; சிக்கலான உருவகம் அடிக்குறிப்பால் விளக்கப்பட்டுள்ளது.
