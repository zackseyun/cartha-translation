  text: וַ֭/יַּֽעֲבֹר וְ/הִנֵּ֣ה אֵינֶ֑/נּוּ וָֽ֝/אֲבַקְשֵׁ֗/הוּ וְ/לֹ֣א נִמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/036.yaml
  text: But he passed by[a], and behold, he was no more; I sought him, but he could not be found.
translation:
  language: ta
  text: அவன் கடந்துபோனான்[a]; இதோ, அவன் இல்லை! நான் அவனைத் தேடினேன்; ஆனால் அவன் கிடைக்கவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் கடந்து சென்றான்.” எபிரேய வினைச்சொல் கடந்து செல்வதையோ கடந்துபோவதையோ குறிக்கலாம்; இங்கே பொல்லாதவன் பார்வையிலிருந்து மறைந்துவிடுவதைச் சூழல் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: கடந்துபோனான்
  rationale: עבר என்பதன் அடிப்படைப் பொருள் ‘கடந்து செல்லுதல்.’ சூழலில் பொல்லாதவனின் திடீர் மறைவை இது சுட்டினாலும், மரணத்தைத் திட்டவட்டமாகச் சொல்லாமல் எபிரேயச் சொல்லின் இடம்சார் பொருளையும் மறைந்துபோகும் நிழற்பொருளையும் ‘கடந்துபோனான்’ தக்கவைக்கிறது.
- source_word: וְהִנֵּה
  choice: இதோ
  rationale: הִנֵּה எதிர்பாராத நிலைக்குக் கவனத்தை ஈர்க்கும் உரையாடல் துகள்; ‘இதோ’ அதன் சுருக்கமான வியப்பூட்டும் வலிமையைத் தக்கவைக்கிறது.
- source_word: אֵינֶנּוּ
  choice: அவன் இல்லை
  rationale: இந்த எபிரேய மரபுத்தொடர் அவன் அங்கு இனி காணப்படாததைச் சுருக்கமாகக் கூறுகிறது. ‘அவன் இல்லை’ மூலத்தின் திடீர்மையைக் காக்கிறது; அவன் முற்றிலும் அழிந்துவிட்டான் என்று கூடுதலாக விளக்குவதில்லை.
- source_word: וָאֲבַקְשֵׁהוּ
  choice: நான் அவனைத் தேடினேன்
  rationale: בקשׁ என்பதன் இயல்பான பொருளான ‘தேடுதல்’ என்பதைத் தெளிவாகவும் நேரடியாகவும் அளிக்கிறது.
- source_word: וְלֹא נִמְצָא
  choice: ஆனால் அவன் கிடைக்கவில்லை
  rationale: מצא என்பதன் நிபால் வடிவமான ‘காணப்படவில்லை’ என்ற விளைவை, தேடுதலைத் தொடர்ந்து வரும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது. ‘ஆனால்’ என்பது சூழலில் உள்ள எதிர்மறை முடிவை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: וַיַּעֲבֹר என்பது மரணத்தையா அல்லது பார்வையிலிருந்து மறைந்ததையா குறிக்கிறது
  choice: மரணத்தை வெளிப்படையாகக் குறிப்பிடாமல் ‘கடந்துபோனான்’ என்று மொழிபெயர்த்தல்
  alternative: ‘இறந்துபோனான்’ அல்லது ‘மறைந்துபோனான்’
  rationale: மூல வினைச்சொல் கடந்து செல்லுதல், கடந்துபோதல் ஆகிய பொருட்களை ஏற்கக்கூடும். இச்சூழல் பொல்லாதவனின் மறைவைச் சொன்னாலும், அது நிகழ்ந்த விதத்தைத் தீர்மானிக்காததால் அந்தத் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற சுருக்கமான கவித்துவ நடையும் கண்ணியமான தொனியும் பயன்படுத்தப்பட்டுள்ளன. ‘இதோ’ மூலத்தின் திடீர் வியப்பைத் தக்கவைக்கிறது; அரிதான அல்லது சமயப்பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
