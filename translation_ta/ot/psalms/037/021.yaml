source:
  edition: WLC
  text: לֹוֶ֣ה רָ֭שָׁע וְ/לֹ֣א יְשַׁלֵּ֑ם וְ֝/צַדִּ֗יק חוֹנֵ֥ן וְ/נוֹתֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/021.yaml
  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
translation:
  language: ta
  text: தீயவன் கடன் வாங்குகிறான்; அதைத் திருப்பிச் செலுத்துவதில்லை. ஆனால் நீதிமான் அருள் காட்டி, கொடுக்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அருள் காட்டுகிறான்” என்பதற்கு “தயவு காட்டுகிறான்” அல்லது “தாராளமாக இருக்கிறான்” என்றும் மொழிபெயர்க்கலாம். தொடர்ந்து வரும் “கொடுக்கிறான்” என்பதைச் சிலர் இச்சூழலில் “கடன் கொடுக்கிறான்” என்று புரிந்துகொள்கிறார்கள்; ஆனால் எபிரெய வினை பொதுவாக “கொடுக்கிறான்” என்றே பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוֶה
  choice: கடன் வாங்குகிறான்
  rationale: לוה என்பதன் Qal வினையெச்சம் கடன் வாங்குவதைக் குறிக்கிறது. தமிழில் பொதுவான, பழமொழித் தன்மையுள்ள நிகழ்காலத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רָשָׁע
  choice: தீயவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஆண்பால் ஒருமையைப் பாதுகாத்து, தீய மனித வகையைப் பிரதிநிதித்துவமாகக் குறிக்கிறது.
- source_word: לֹא יְשַׁלֵּם
  choice: அதைத் திருப்பிச் செலுத்துவதில்லை
  rationale: שלם என்பதன் Piel வடிவம் இங்கு வாங்கிய கடனைத் திருப்பிச் செலுத்துவதைச் சுட்டுகிறது; தமிழில் பொருளைத் தெளிவாக்க ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: רָשָׁע என்பதற்கு எதிராக நிற்கும் பெயர்ச்சொல் பயன்பாட்டிலுள்ள ஆண்பால் ஒருமையைத் தக்கவைத்து, சங்கீத ஞான இலக்கிய நடைக்கு ஏற்றதாக உள்ளது.
- source_word: חוֹנֵן
  choice: அருள் காட்டி
  rationale: חנן என்பதன் அடிப்படைப் பொருளான அருள் அல்லது தயவு காட்டுதலைப் பாதுகாக்கிறது; அடுத்துள்ள கொடுக்கும் செயல் அந்த அருளின் நடைமுறை வெளிப்பாடாக அமைகிறது.
- source_word: וְנוֹתֵן
  choice: கொடுக்கிறான்
  rationale: נתן என்பதன் இயல்பான விரிந்த பொருள் ‘கொடு’ என்பதே. சூழலை முன்னிட்டு ‘கடன் கொடுக்கிறான்’ என்று குறுக்காமல் மூலத்தின் பொருள் அகலத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஞான இலக்கிய எதிர்மறை ஒப்பீட்டில் பிரதிநிதித்துவ ஆண்பால் ஒருமை
  choice: ‘தீயவன்’ மற்றும் ‘நீதிமான்’ என்ற ஒருமை வகைப்பெயர்களைத் தக்கவைத்தல்
  alternative: ‘தீயவர்கள் ... நீதிமான்கள்’ அல்லது ‘தீய நபர் ... நீதியுள்ள நபர்’
  rationale: எபிரெய மூலத்தில் ஆண்பால் ஒருமை வடிவங்கள் பொதுவான மனித வகைகளைப் பிரதிநிதித்துவப்படுத்துகின்றன. தமிழிலும் இயல்பான ஒருமை எதிர்மறை ஒப்பீடு மூலத்தின் வடிவத்தையும் ஞான இலக்கியத் தொனியையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழில் சுருக்கமான ஞான இலக்கிய எதிர்மறை ஒப்பீடு. ‘அருள் காட்டி’ என்பது மூலத்தின் அருள்/தயவு நுண்ணுணர்வையும் ‘கொடுக்கிறான்’ என்பது נתן என்பதன் அகலத்தையும் காக்கின்றன.
