  yaml_path: translation/ot/psalms/037/008.yaml
  text: Let go of anger[a], and abandon wrath[b]; do not be provoked—it only leads to evil.
translation:
  language: ta
  text: கோபத்தை விட்டுவிடு; கடுஞ்சினத்தைக் கைவிடு. மனங்கொதிக்காதே[a]; அது தீமைக்கே வழிவகுக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எரிச்சலடையாதே’ அல்லது ‘கலக்கமடையாதே’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை மனம் கொதிப்பதையோ கிளர்ச்சியடைவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இறுதிக் கூறை இன்னும் சொல்லுக்குச் சொல்லாக, ‘தீமை செய்வதற்கே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶרֶף מֵאַף
  choice: கோபத்தை விட்டுவிடு
  rationale: רפה என்பதன் கட்டளை வடிவம் விடுதல் அல்லது நிறுத்துதல் என்ற பொருளைத் தருகிறது; אַף இங்கு உடல் உறுப்பான ‘மூக்கு’ என்பதல்ல, மரபான உருவகப் பொருளில் ‘கோபம்’ என்பதாகும். இயல்பான தமிழுக்காக מִן வேற்றுமைப் பொருள் ‘கோபத்தை விட்டுவிடு’ என்ற தொடரில் உட்பொதிக்கப்பட்டுள்ளது.
- source_word: וַעֲזֹב חֵמָה
  choice: கடுஞ்சினத்தைக் கைவிடு
  rationale: עזב என்பது விட்டுவிடுதல் அல்லது கைவிடுதல்; חֵמָה என்பது தீவிரமான, கொதிக்கும் சினத்தைக் குறிக்கிறது. ‘கடுஞ்சினம்’ முந்தைய ‘கோபம்’ என்பதிலிருந்து இதன் தீவிரத்தை வேறுபடுத்திக் காட்டுகிறது.
- source_word: אַל תִּתְחַר
  choice: மனங்கொதிக்காதே
  rationale: חרה என்பதன் இவ்வடிவம் சூடேறுதல், கலக்கமடைதல், எரிச்சலுறுதல் ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘மனங்கொதிக்காதே’ வெப்ப உருவகத்தையும் உள்ளக் கிளர்ச்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אַךְ
  choice: -க்கே
  rationale: இங்கு אַךְ கட்டுப்படுத்தும் வலியுறுத்தலைக் காட்டுகிறது. தமிழின் ‘-க்கே’ உருபு ‘தீமைக்கே’ என்று அந்த ‘மட்டுமே’ என்ற பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: לְהָרֵעַ
  choice: தீமைக்கே வழிவகுக்கும்
  rationale: רעע என்பதன் לְ சேர்ந்த வினையெச்ச அமைப்பு நோக்கமாகவோ விளைவாகவோ புரிந்துகொள்ளப்படலாம். சங்கீதத்தின் சூழலில் கோபமூட்டும் மனக்கிளர்ச்சி தீமையில் முடியும் என்ற விளைவு வாசிப்பு இயல்பாக உள்ளது; நேரடியான நோக்க வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறுதிக் கூறின் அறநெறிசார் வலிமை
  choice: கோபத்தால் மனங்கொதிப்பது தீமைக்கே வழிவகுக்கும் என்ற விளைவு எச்சரிக்கையாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: ‘தீமை செய்வதற்கே’ என்ற நோக்கம் அல்லது நேரடி வினை வாசிப்பு.
  rationale: לְ + வினையெச்ச அமைப்பு நோக்கத்தையோ விளைவையோ குறிக்கலாம். சூழலுக்கு ஏற்ற விளைவு வாசிப்பு முதன்மை உரையில் வைக்கப்பட்டாலும், எபிரெய மொழியின் சுருக்கமான மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஒருமை முன்னிலைக் கட்டளைகளுடன், கவிதைக்குரிய கண்ணியமும் இணை அமைப்பும் காக்கப்பட்டுள்ளன. ‘கோபம் / கடுஞ்சினம்’ என்ற சொல் இணை எபிரெய மூலத்தின் தீவிர வேறுபாட்டை வெளிப்படுத்துகிறது; ‘மனங்கொதித்தல்’ வெப்ப உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
