  text: யாவே அவனுடைய கையில்[b] அவனைக் கைவிடமாட்டார்[a]; அவன் நியாயந்தீர்க்கப்படும்போது, அவனைக் குற்றவாளி எனத் தீர்ப்பளிக்கமாட்டார்[c].
