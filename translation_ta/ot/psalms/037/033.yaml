lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய உச்சரிப்பைத் தமிழில் இயன்றவரை ஒலிபெயர்க்கிறது.
- source_word: יַעַזְבֶנּוּ
  choice: அவனைக் கைவிடமாட்டார்
  rationale: עזב என்பதன் ‘விட்டுவிடுதல், கைவிடுதல்’ என்ற பொருளை இச்சூழலில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: בְיָדוֹ
  choice: அவன் கையில்
  rationale: ‘அவன் கையில்’ என்ற எபிரெய உருவகத்தைப் பாதுகாக்கிறது; சூழலில் அந்தக் கை பொல்லாதவனுடைய அதிகாரத்தையோ கட்டுப்பாட்டையோ குறிக்கிறது.
- source_word: יַרְשִׁיעֶנּוּ
  choice: அவனைக் குற்றவாளி என்று தீர்க்கமாட்டார்
  rationale: רשע என்பதன் ஹிஃபில் வடிவிலுள்ள நீதிமன்றச் சார்ந்த ‘குற்றவாளி எனத் தீர்த்தல்’ என்ற பொருளை வெளிப்படையாகக் காட்டுகிறது.
- source_word: בְּהִשָּׁפְטוֹ
  choice: அவன் நியாயந்தீர்க்கப்படும்போது
  rationale: בְּ உடன் வரும் வினையெச்சக் கட்டமைப்பை காலப் பொருளில் மொழிபெயர்த்து, மூலத்தின் செயல்பாட்டு வடிவத்தையும் நீதித்துறைச் சூழலையும் காக்கிறது.
theological_decisions:
- issue: வசனத்திலுள்ள ஒருமை ஆண்பால் சுட்டுப்பெயர்களின் குறிப்பு
  choice: ‘அவனை’ என்பது சூழலில் வரும் நீதிமானையும், ‘அவன் கையில்’ என்பது பொல்லாதவனையும் குறிக்கும் வகையில் ஒருமை வடிவங்கள் பாதுகாக்கப்பட்டுள்ளன.
  alternative: சுட்டுப்பெயர்களை அகற்றி ‘நீதிமான்’, ‘பொல்லாதவன்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: முந்தைய சூழல் நீதிமானுக்கும் பொல்லாதவனுக்கும் இடையிலான எதிர்மறை உறவைத் தெளிவாக்கினாலும், எபிரெய மூலத்தில் இவ்வசனம் சுட்டுப்பெயர்களையே பயன்படுத்துகிறது. அவற்றைப் பாதுகாப்பது மூலத்தின் வடிவத்தையும் இயல்பான சூழல் சார்பையும் காக்கிறது.
- issue: இரண்டாம் அடியின் நீதித்துறைப் பொருள்
  choice: ‘குற்றவாளி என்று தீர்க்கமாட்டார்’ என்ற நீதிமன்றச் சார்ந்த மொழி பயன்படுத்தப்பட்டுள்ளது.
  alternative: ‘அவனைப் பொல்லாதவனாகக் கருதமாட்டார்’ அல்லது ‘அவன் குற்றவாளியாக்கப்பட விடமாட்டார்.’
  rationale: רשע என்பதன் ஹிஃபில் வடிவமும் שפט என்பதுடனான இணைப்பும் நீதித்துறைச் சூழலைக் காட்டுகின்றன. பிற்கால இறையியல் கருத்துகளைச் சேர்க்காமல் அந்தச் சட்டவியல் அழுத்தம் மட்டும் பாதுகாக்கப்படுகிறது.
