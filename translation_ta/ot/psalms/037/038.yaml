  yaml_path: translation/ot/psalms/037/038.yaml
  text: But transgressors are destroyed together[a]; the future of the wicked is cut off.
translation:
  language: ta
  text: 'ஆனால் மீறுபவர்கள் ஒருசேர அழிக்கப்படுவார்கள்;

    பொல்லாதவர்களின் எதிர்காலம்[a] துண்டிக்கப்படும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொல்லாதவர்களின் முடிவு துண்டிக்கப்படும்.” எபிரெயச் சொல் אַחֲרִית என்பதற்கு “எதிர்காலம்,” “இறுதி விளைவு,” அல்லது “முடிவு” என்று பொருள் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֹשְׁעִים
  choice: ஆனால் மீறுகிறவர்கள்
  rationale: פֹשְׁעִים என்பது கடவுளுடைய நெறியையோ கட்டளையையோ மீறி நடப்பவர்களைக் குறிக்கிறது. சூழலில் நீதிமான்களின் நிலைக்கு எதிர்மாறான நிலை கூறப்படுவதால், וּ என்ற இணைப்புச்சொல் ‘ஆனால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: נִשְׁמְדוּ
  choice: அழிக்கப்படுவார்கள்
  rationale: שׁמד என்பதன் நிஃபால் வடிவம் அழிக்கப்படுதல் அல்லது ஒழிக்கப்படுதல் என்ற கடுமையான தீர்ப்பைக் குறிக்கிறது. சங்கீதத்தின் எதிர்கால விளைவைச் சொல்லும் சூழலுக்கு ஏற்ப தமிழில் எதிர்கால வினையாக வழங்கப்பட்டது.
- source_word: יַחְדָּו
  choice: ஒருசேர
  rationale: இந்த வினையடை ‘ஒன்றாக’ அல்லது ‘முற்றிலும்’ எனப் பொருள்படலாம். மீறுகிறவர்கள் அனைவருக்கும் ஒரே முடிவு நேரும் கருத்தை ‘ஒருசேர’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אַחֲרִית
  choice: எதிர்காலம்
  rationale: இந்தச் சொல் எதிர்காலம், இறுதி விளைவு, முடிவு அல்லது சந்ததி ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு பொல்லாதவர்களுக்கு இனி என்ன நேரும் என்பதைக் ‘எதிர்காலம்’ தெளிவாகக் கூறுகிறது; ‘முடிவு’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: ஞான இலக்கியத்திலும் சங்கீதங்களிலும் அறநெறிக்கு எதிராக நடப்பவர்களைக் குறிக்கும் வழக்கமான ஒழுக்க வகைப்பாட்டை இச்சொல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נִכְרָתָה
  choice: அறுத்துப்போடப்படும்
  rationale: כרת என்பதன் நிஃபால் வடிவம் ‘அறுக்கப்படுதல்’ அல்லது ‘துண்டிக்கப்படுதல்’ என்பதைக் குறிக்கிறது. மூலத்தின் வலுவான நீதித்தீர்ப்பு உருவகத்தைத் தட்டையாக்காமல் இந்தத் தேர்வு காக்கிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்புச் சூழலில் אַחֲרִית என்பதன் பொருள்
  choice: பொல்லாதவர்களின் எதிர்காலம் அறுத்துப்போடப்படும்
  alternative: பொல்லாதவர்களின் முடிவு அறுத்துப்போடப்படும்
  rationale: இச்சொல் பிற்கால நிலை, இறுதி விளைவு, முடிவு அல்லது சந்ததி ஆகியவற்றைக் குறிக்கக்கூடும். இச்சங்கீதப் பகுதியில் நீதிமான்களுக்கும் பொல்லாதவர்களுக்கும் அமையும் வெவ்வேறு எதிர்கால நிலைகள் ஒப்பிடப்படுவதால் ‘எதிர்காலம்’ முதன்மை உரையில் பொருத்தமானது. ‘முடிவு’ என்பதும் மொழியியல் ரீதியாகச் சாத்தியமானதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது; ‘சந்ததி’ என்று மட்டும் குறுக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கவிதைநடையின் இரு இணை வரிகளும் காக்கப்பட்டுள்ளன. ‘ஒருசேர,’ ‘அறுத்துப்போடப்படும்’ ஆகிய சொற்கள் மூலத்தின் செறிவையும் தீர்ப்பின் கடுமையையும் சாதாரண வாசகருக்குப் புரியும் வகையில் தக்கவைக்கின்றன.
