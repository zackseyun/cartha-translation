  yaml_path: translation/ot/psalms/037/014.yaml
  text: The wicked have drawn the sword and bent their bow[a], to bring down the poor and needy[b], to slaughter those upright in way.
translation:
  language: ta
  text: 'தீயவர்கள் வாளை உருவி,

    தங்கள் வில்லை வளைத்துள்ளனர்—

    ஏழையையும்[a] தேவையுள்ளவரையும் வீழ்த்தவும்,

    நடத்தை நேர்மையானவர்களை[b] படுகொலை செய்யவும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஏழை” என்பதற்கு “துன்புறுத்தப்பட்டவர்” என்றும் பொருள் கொள்ளலாம்.
    reason: עָנִי என்ற சொல்லில் வறுமையோடு துன்புறுத்தப்பட்ட அல்லது ஒடுக்கப்பட்ட நிலை என்ற பொருளும் இருக்கக்கூடும்.
  - marker: b
    text: எபிரெயத்தில், “வழியில் நேர்மையானவர்கள்.”
    reason: יִשְׁרֵי דָרֶךְ என்ற எபிரெயக் கட்டமைப்பின் சொற்சார்ந்த வடிவத்தையும் அதன் சுருக்கமான உருவகத் தன்மையையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: חֶרֶב פָּתְחוּ
  choice: வாளை உருவி
  rationale: பதச்சொல்லாக ‘வாளைத் திறந்தனர்’ என்றாலும், வாளுடன் வரும் இந்த எபிரெய மரபுத்தொடர் அதை உறையிலிருந்து உருவுவதைக் குறிக்கிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: பாலினத்தைக் குறிப்பாக வரையறுக்காமல், சங்கீதத்தின் அறநெறி வகைப்பாட்டை நவீனத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: וְדָרְכוּ קַשְׁתָּם
  choice: தங்கள் வில்லை வளைத்துள்ளனர்
  rationale: வில் எய்ய ஆயத்தமாக அதை வளைப்பதைக் குறிக்கும் இராணுவச் சூழலைத் தெளிவாகப் பிரதிபலிக்கிறது; எபிரெய ஒருமை வடிவமும் காக்கப்படுகிறது.
- source_word: לְהַפִּיל
  choice: வீழ்த்தவும்
  rationale: ஹிஃபில் வடிவின் ‘விழச் செய்தல்’ என்ற காரணவினைப் பொருளைச் சுருக்கமாகக் காக்கிறது.
- source_word: עָנִי וְאֶבְיוֹן
  choice: ஏழையையும் தேவையில் இருப்பவனையும்
  rationale: 'இணைச்சொற்களின் வேறுபாட்டைக் காக்கிறது: עָנִי வறுமை அல்லது ஒடுக்கப்பட்ட நிலையைச் சுட்டலாம்; אֶבְיוֹן தேவையிலும் பற்றாக்குறையிலும் இருப்பவரைக் குறிக்கிறது.'
- source_word: לִטְבֹחַ
  choice: படுகொலை செய்யவும்
  rationale: பொதுவான ‘கொல்லுதல்’ என்பதைவிட வன்முறையின் கொடூரத்தை வலுவாக வெளிப்படுத்துகிறது.
- source_word: יִשְׁרֵי דָרֶךְ
  choice: நேர்மையான வழியில் நடப்பவர்கள்
  rationale: ‘வழியில் நேர்மையானவர்கள்’ என்ற எபிரெய அமைப்பின் வாழ்க்கைநடத்தைச் சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது; சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
