  text: שְׁמָר תָּ֭ם וּ/רְאֵ֣ה יָשָׁ֑ר כִּֽי אַחֲרִ֖ית לְ/אִ֣ישׁ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/037.yaml
  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
translation:
  language: ta
  text: குற்றமற்றவனைக் கவனித்துப் பார்[a]; நேர்மையானவனை நோக்கு. ஏனெனில் சமாதானமுள்ள மனிதனுக்கு[c] எதிர்காலம்[b] உண்டு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “குற்றமற்றவனைக் கவனத்தில் கொள்; நேர்மையானவனைப் பார்.”
    reason: lexical_alternative
  - marker: b
    text: “எதிர்காலம்” என்பதற்கான எபிரெயச் சொல் “முடிவு” அல்லது “இறுதி விளைவு” என்றும் பொருள்படலாம்; சிலர் இங்கு அதை “சந்ததி” எனப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “சமாதானத்தை நாடுகிற மனிதனுக்கு”; שָׁלוֹם என்ற சொல் நல்வாழ்வு அல்லது முழுமை என்ற பொருளையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  choice: கவனித்துப் பார்
  rationale: இங்கு இந்த ஏவல் வினை ‘காத்துக்கொள்’ என்பதைவிட ஒருவரைக் கூர்ந்து கவனிக்குமாறு அழைக்கிறது; இயல்பான தமிழில் ஏவலின் வலிமையையும் தருகிறது.
- source_word: תָּם
  choice: குற்றமற்றவன்
  rationale: பாவமே இல்லாத முழுநிறைவைக் குறிக்காமல், ஒழுக்க நேர்மையும் பழியற்ற தன்மையும் குறிக்கும் பெயரடைப் பொருளைத் தக்கவைக்கிறது.
- source_word: וּרְאֵה
  choice: நோக்கு
  rationale: முதல் ஏவலுக்கு இணையான இரண்டாம் ஏவலாக அமைந்து, எபிரெயக் கவிதையின் இணை அமைப்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יָשָׁר
  choice: நேர்மையானவன்
  rationale: ஒழுக்க ரீதியான செம்மை அல்லது நேர்மையைச் சுட்டுகிறது; பெயர்ச்சொல்லாகப் பயன்படும் எபிரெயப் பெயரடையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: אַחֲרִית
  choice: எதிர்காலம்
  rationale: பிந்தைய காலம், முடிவு, இறுதி விளைவு ஆகிய பொருள் வாய்ப்புகளில், இச்சூழலில் உள்ள நல்ல எதிர்நோக்கை இயல்பாகத் தெரிவிக்கிறது; மற்ற வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: לְאִישׁ
  choice: மனிதனுக்கு
  rationale: எபிரெயில் ஒருமை ஆண்பால் வடிவம் உள்ளது; தமிழில் ‘மனிதன்’ அதைப் பிரதிபலிக்கிறது.
- source_word: שָׁלוֹם
  choice: சமாதானமுள்ள
  rationale: அமைதி, நல்வாழ்வு, முழுமை ஆகிய பரந்த பொருள் வளத்தை ஓரளவு திறந்தவாறே வைத்து, அந்த மனிதனின் பண்பை இயல்பான தமிழில் குறிக்கிறது.
theological_decisions:
- issue: ஞான இலக்கியச் சூழலில் வரும் ஒருமை ஆண்பால் אִישׁ
  choice: மனிதன்
  alternative: ஒருவர் / நபர்
  rationale: மூலத்தின் ஒருமை ஆண்பால் வடிவத்தை மறைக்காமல் ‘மனிதன்’ என வைத்துள்ளது; அதே வேளையில் இந்த ஞானக் கோட்பாட்டின் பிரதிநிதித்துவப் பயன்பாட்டைத் தடைசெய்யவில்லை.
- issue: நேர்மையான மனிதனின் கதியுடன் தொடர்புடைய אַחֲרִית என்பதன் பொருள்
  choice: எதிர்காலம்
  alternative: முடிவு / இறுதி விளைவு / சந்ததி
  rationale: சுற்றியுள்ள வசனங்களில் நீதிமானின் இறுதிக் கதியும் மீறுகிறவர்களின் அழிவும் எதிரெதிராக நிறுத்தப்படுகின்றன. ‘எதிர்காலம்’ நல்ல எதிர்நோக்கைத் தெரிவிக்கிறது; குறிப்பிட்ட ஒரே பொருளைத் திணிக்காமல் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: אִישׁ שָׁלוֹם என்ற தொடரின் உறவு
  choice: சமாதானமுள்ள மனிதன்
  alternative: சமாதானத்தை நாடுகிற மனிதன் / நல்வாழ்வு பெற்ற மனிதன்
  rationale: שָׁלוֹם என்பதை வெறும் மனஅமைதியாகவோ, வெளிப்புற வளமாகவோ மட்டும் சுருக்காமல், மனிதனின் சமாதானப் பண்பையும் நலமுழுமையையும் திறந்த நிலையில் வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இரு ஏவல் வினைகளின் கவிதை இணை அமைப்பு காக்கப்பட்டுள்ளது; ‘குற்றமற்றவன்’ என்பது பாவமற்ற பரிபூரணத்தை அல்ல, ஒழுக்க ஒருமைப்பாட்டைக் குறிக்கிறது.
