  yaml_path: translation/ot/psalms/037/031.yaml
  text: The law of his God is in his heart[a]; his steps do not slip.
translation:
  language: ta
  text: அவனுடைய கடவுளின் சட்டம் அவன் இதயத்தில் இருக்கிறது[a]; அவனுடைய அடிகள் வழுக்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய கடவுளின் போதனை அவன் இதயத்தில் இருக்கிறது; அவனுடைய அடிகள் தடுமாறாது.”
    reason: תּוֹרָה என்பதற்கு “போதனை” அல்லது “அறிவுரை” என்ற பொருளும் உண்டு; תִמְעַד என்பதற்கு “தடுமாறுதல்” என்பது ஒரு பொருத்தமான மாற்று.
lexical_decisions:
- source_word: תּוֹרַת
  choice: போதனை
  rationale: תּוֹרָה என்பது ‘சட்டம்’ என்பதையும் ‘போதனை/அறிவுரை’ என்பதையும் குறிக்கலாம். இந்த ஞானசங்கீதச் சூழலில் கடவுளின் அதிகாரமுள்ள வழிகாட்டுதலை இயல்பான நவீன தமிழில் தெரிவிக்க ‘போதனை’ தேர்ந்தெடுக்கப்பட்டது; ‘திருச்சட்டம்’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֱלֹהָיו
  choice: அவனுடைய கடவுளின்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டைத் துல்லியமாகப் பிரதிபலித்து, கடவுளுடனான தனிப்பட்ட உறவையும் காக்கிறது.
- source_word: בְּלִבּוֹ
  choice: அவன் இதயத்தில் இருக்கிறது
  rationale: எபிரெய மொழியில் ‘இதயம்’ சிந்தனை, விருப்பம், மனவுறுதி உள்ளிட்ட உள்ளார்ந்த மனிதனைச் சுட்டுகிறது. ‘இதயத்தில்’ என்பது அந்த உள்ளார்ந்த பதித்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא תִמְעַד
  choice: வழுக்காது
  rationale: מעד என்பதற்கு வழுக்குதல், தடுமாறுதல் போன்ற பொருள்கள் உண்டு. ‘அடிகள்’ என்ற எழுவாயுடன் ‘வழுக்காது’ இயல்பாக இணைந்து, உறுதியான வாழ்க்கைப் பாதை என்ற உருவகத்தைக் காக்கிறது.
- source_word: אֲשֻׁרָיו
  choice: அவனுடைய அடிகள்
  rationale: இந்தப் பன்மைச் சொல் அடிகள் அல்லது காலடிகளைக் குறிக்கிறது. ‘அடிகள்’ சுருக்கமாகவும் வாழ்க்கை நடையின் உருவகத்துக்கு ஏற்றதாகவும் உள்ளது.
theological_decisions:
- issue: ஞான இலக்கியச் சூழலில் תּוֹרָה என்பதன் பொருள்
  choice: போதனை
  alternative: திருச்சட்டம்
  rationale: இங்கு நீதிமானின் உள்ளத்தில் பதிந்த கடவுளின் அதிகாரமுள்ள வழிகாட்டுதல் குறிப்பிடப்படுகிறது. நவீன தமிழில் பொருளை விரிவாகவும் இயல்பாகவும் தர ‘போதனை’ பயன்படுத்தப்பட்டது; உடன்படிக்கை சார்ந்த சட்டப் பொருளை மறைக்காமல் மாற்று வாசகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: לֹא תִמְעַד என்பதன் கால/விதப் பொருள்
  choice: வழுக்காது
  alternative: தடுமாறாது
  rationale: இந்தச் சங்கீதத்தின் பொதுநிலை ஞானக்கூற்றாக இதை வாசித்து, தமிழ் எதிர்மறை நிகழ்கால/பொதுநிலை வடிவம் பயன்படுத்தப்பட்டது. இந்தக் கூற்று முழுமையான துன்பமின்மையைச் சேர்த்துக் கூறாமல், வாழ்க்கை நடையின் நிலைத்தன்மை என்ற உருவகத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கண்ணியமான சங்கீத நடையில் மொழிபெயர்க்கப்பட்டது. ‘அவன்’ என்பது முந்தைய வசனத்தில் வரும் நீதிமானைக் குறிக்கிறது; மூலத்தின் ஆண்பால் ஒருமைச் சுட்டு காக்கப்பட்டது.
