- from: அவனுடைய கடவுளின் போதனை அவன் இதயத்தில் இருக்கிறது[a]; அவனுடைய அடிகள் வழுக்காது.
  to: அவனுடைய கடவுளின் சட்டம் அவன் இதயத்தில் இருக்கிறது[a]; அவனுடைய அடிகள் வழுக்காது.
