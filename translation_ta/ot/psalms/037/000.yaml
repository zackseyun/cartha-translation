base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/000.yaml
  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
translation:
  language: ta
  text: 'தாவீதுக்கு உரியது.[a]


    தீமை செய்கிறவர்களைக் கண்டு கலங்காதே;[b]

    அநீதி செய்கிறவர்கள்மீது பொறாமை கொள்ளாதே.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீதினுடையது’ அல்லது ‘தாவீதினால் இயற்றப்பட்டது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: superscription_ambiguity
  - marker: b
    text: எபிரெய வினை சொற்பட ‘சூடாகாதே’ என்று பொருள்பட்டு, கோபம், எரிச்சல் அல்லது மனக்கலக்கம் அடைவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘அக்கிரமம் செய்கிறவர்கள்மீது’ அல்லது ‘நேர்மையற்ற செயல்களைச் செய்கிறவர்கள்மீது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்கு உரியது
  rationale: לְ என்ற முன்னிடைச்சொல் ஆசிரியத்துவம், தொடர்பு, அர்ப்பணம் போன்ற உறவுகளைக் குறிக்கக்கூடும்; அவற்றில் ஒன்றைத் தேவையின்றி முடிவுசெய்யாமல், சங்கீதத் தலைப்பாக இயல்பாக ஒலிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: אַל תִּתְחַר
  choice: மனம் கொதிக்காதே
  rationale: חרה என்ற வினை சூடாதல், கோபம் அல்லது மனக்கலக்கம் அடைதல் என்ற உணர்வைத் தருகிறது. தமிழில் உள்ள உருவகத்தையும் கட்டளையின் வலிமையையும் இச்சொற்றொடர் காக்கிறது.
- source_word: בַמְּרֵעִים
  choice: தீமை செய்கிறவர்களைக் கண்டு
  rationale: முன்னிடைச்சொல் இங்கு தீமை செய்பவர்களால் தூண்டப்படும் மனக்கொதிப்பைக் குறிக்கிறது; இயல்பான தமிழில் காரணச் சூழலை ‘கண்டு’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: அநீதி செய்கிறவர்கள்மேல்
  rationale: עַוְלָה என்பது அநீதி, அக்கிரமம், நேர்மையின்மை ஆகியவற்றைக் குறிக்கும். ‘அநீதி செய்கிறவர்கள்’ என்பது செயற்பாட்டு வடிவையும் நெறியியல் பொருளையும் காக்கிறது.
- source_word: אַל תְּקַנֵּא
  choice: பொறாமைகொள்ளாதே
  rationale: קנא இச்சூழலில் தீமை செய்பவர்களின் நிலையை விரும்பிப் பொறாமைப்படுவதைச் சுட்டுகிறது; பொதுவாகப் புரியும் நேரடியான தமிழ் தெரிவு பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: தீமை செய்பவர்களுக்கான எதிர்வினையின் தன்மை
  choice: ‘மனம் கொதிக்காதே’ என்று, கோபம் மற்றும் மனக்கலக்கம் இரண்டையும் உள்ளடக்கக்கூடியதாக வைக்கப்பட்டது.
  alternative: ‘கோபப்படாதே’ அல்லது ‘கவலைப்படாதே’ என்று ஒரே உணர்வாகக் குறுக்குதல்.
  rationale: எபிரெய வினையின் வெப்பம், சினம், கலக்கம் ஆகிய பொருள் பரப்பை ஒரே குறிப்பிட்ட உளநிலையாகத் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. இணையான இரு தடை கட்டளைகளின் அமைப்பு பாதுகாக்கப்பட்டது; ‘மனம் கொதித்தல்’ என்ற இயல்பான தமிழ் உருவகம் எபிரெயச் சொல்லின் வெப்பம்/சினம் சார்ந்த படிமத்தைத் தக்கவைக்கிறது.
