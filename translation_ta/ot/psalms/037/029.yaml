id: PSA.37.29
reference: Psalms 37:29
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: צַדִּיקִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ/יִשְׁכְּנ֖וּ לָ/עַ֣ד עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
translation:
  language: ta
  text: நீதிமான்கள் நாட்டை உரிமையாகப் பெறுவார்கள்; அதில் என்றென்றும் குடியிருப்பார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமியை.’ எபிரெய மொழியிலுள்ள אֶרֶץ என்ற சொல்லுக்கு ‘நாடு’ அல்லது ‘பூமி’ என்று பொருள் கொள்ளலாம்; இங்கு சங்கீதம் 37-இல் மீண்டும் மீண்டும் வரும் சொல்வழக்குக்கு ‘நாடு’ என்பது பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  choice: நீதிமான்கள்
  rationale: பன்மை உரிச்சொல் பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டு, நீதியுள்ள மக்களை ஒரு வகுப்பாகக் குறிக்கிறது. ‘நீதிமான்கள்’ என்பது இயல்பான, கண்ணியமான தமிழ் வழக்கு.
- source_word: יִירְשׁוּ
  choice: உரிமையாகப் பெறுவார்கள்
  rationale: ירשׁ என்பது சுதந்தரித்தல் அல்லது உடைமையாக்கிக்கொள்ளுதல் என்னும் பொருள்களைக் கொண்டது. இங்கு ‘உரிமையாகப் பெறுவார்கள்’ என்பது வாக்குறுதி மற்றும் உடைமை ஆகிய இரு நுணுக்கங்களையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אָרֶץ
  choice: நாட்டை
  rationale: אֶרֶץ என்பதற்கு ‘நாடு/நிலம்’ என்றும் ‘பூமி’ என்றும் பொருள் வரலாம். சங்கீதம் 37-இல் திரும்பத் திரும்ப வரும் நாட்டை உரிமையாகப் பெறும் வாக்குறுதியுடன் ‘நாடு’ நன்கு பொருந்துகிறது; விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְיִשְׁכְּנוּ
  choice: குடியிருப்பார்கள்
  rationale: שׁכן நிலையாகத் தங்குதல் அல்லது வசித்தல் என்பதைக் குறிக்கிறது. ‘குடியிருப்பார்கள்’ என்பது நீடித்த வாழ்விடத்தின் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לָעַד
  choice: என்றென்றும்
  rationale: நீடித்து முடிவின்றி இருப்பதைக் குறிக்கும் இச்சொற்றொடரின் வலிமையை ‘என்றென்றும்’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: עָלֶיהָ
  choice: அதில்
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன் வரும் אֶרֶץ-ஐச் சுட்டுகிறது. தமிழில் ஒரு நாட்டில் வசிப்பதைச் சொல்ல ‘அதில்’ என்பது ‘அதன்மேல்’ என்பதைவிட இயல்பானது.
theological_decisions:
- issue: வாக்குறுதியின் சூழலில் אָרֶץ என்பதன் பொருள் எல்லை
  choice: நாடு
  alternative: பூமி
  rationale: சங்கீதம் 37-இன் உடனடிச் சூழலில் நாட்டை உரிமையாகப் பெறுதல் மீண்டும் மீண்டும் சொல்லப்படுவதால், முதன்மை உரையில் ‘நாடு’ தேர்ந்தெடுக்கப்படுகிறது. எபிரெயச் சொல்லின் விரிந்த ‘பூமி’ என்ற பொருள் சாத்தியமுள்ளதால், அதைத் தீர்மானமாக விலக்காமல் அடிக்குறிப்பில் தருகிறோம்.
translation_notes:
  register: நவீனத் தரமான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய இணைப்பைத் தமிழில் இயல்பாகக் காட்ட அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது; ‘நாடு/பூமி’ என்ற உண்மையான பொருள் இருமை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
