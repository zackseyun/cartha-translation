revisions:
- from: பல பொல்லாதவர்களின் மிகுதியைவிட, நீதிமானுக்குரிய கொஞ்சமே மேலானது[a][b].
  to: பல பொல்லாதவர்களிடம் உள்ள வளத்தைவிட, நீதிமானிடம் உள்ள கொஞ்சமே மேலானது[a][b].
  rationale: The revision resolves a Tamil ambiguity that could make the second term refer to the number of wicked people rather than their abundance. It also makes the implied possession on the righteous person’s side explicit in natural Tamil. The wording remains concise, proverbial, and appropriately broad for the Hebrew הָמוֹן.
  reviewer_model: gpt-5.6-terra
