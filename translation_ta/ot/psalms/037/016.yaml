  text: பல பொல்லாதவர்களிடம் உள்ள வளத்தைவிட, நீதிமானிடம் உள்ள கொஞ்சமே மேலானது[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிமானுக்குரிய கொஞ்சம்.” எபிரெய வாக்கியம் சுருக்கமாக உள்ளது; உடைமைப் பொருள் நேரடியாகச் சொல்லப்படாமல் உணர்த்தப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: “வளம்” என்பதை இங்கு “செல்வம்” அல்லது “பெருமளவான உடைமை” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: மேலானது
  rationale: ஒப்பீட்டுப் பழமொழி அமைப்பில் טוֹב என்பது வெறுமனே ‘நல்லது’ என்பதல்ல; ‘மேலானது’ என்ற பொருளில் வருகிறது.
- source_word: מְעַט
  choice: கொஞ்சம்
  rationale: சிறிய அளவைக் குறிக்கும் பெயர்ச்சொல்; எதிர்வரும் ‘மிகுதி’ என்பதோடு இயல்பான முரணை உருவாக்குகிறது.
- source_word: לַצַּדִּיק
  choice: நீதிமானுக்குரிய
  rationale: ל முன்னொட்டு இங்குள்ள சுருக்கமான வாக்கியத்தில் உடைமை அல்லது தொடர்பைக் குறிக்கலாம். ‘நீதிமானுக்குரிய’ என்பது அந்தப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; எபிரெய மூலத்தின் ஒருமை வடிவும் காக்கப்படுகிறது.
- source_word: מֵהֲמוֹן
  choice: மிகுதியைவிட
  rationale: הָמוֹן என்பது மிகுதி, திரள், வளம் போன்ற பரந்த பொருள் கொண்டது. ‘மிகுதி’ என்பது இதை ‘செல்வம்’ என்று பொருளாதார உடைமைகளுக்கு மட்டும் சுருக்காமல் ஒப்பீட்டைத் தக்கவைக்கிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை அடைமொழி; நவீனத் தமிழில் மனிதர்களைக் குறிக்கும் தெளிவான, இயல்பான வடிவம்.
- source_word: רַבִּים
  choice: பல
  rationale: பன்மை அடைமொழி இயல்பாக ‘பொல்லாதவர்கள்’ என்பதைக் குறிப்பதால் ‘பல பொல்லாதவர்கள்’ என்று மொழிபெயர்க்கப்படுகிறது.
