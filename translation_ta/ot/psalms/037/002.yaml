- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் அறிவுரைக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச்சொல்.
- source_word: כֶחָצִיר
  choice: புல்லைப்போல்
  rationale: חָצִיר என்பது இங்கு நிலையாமையைச் சித்தரிக்கும் புல்லைக் குறிக்கிறது.
- source_word: מְהֵרָה
  choice: விரைவில்
  rationale: அவர்கள் அழிவது சீக்கிரம் நிகழும் என்பதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: יִמָּלוּ
  choice: வாடிப்போவார்கள்
  rationale: இந்த வினைச்சொல் வெட்டப்படுதல் அல்லது வாடுதல் என்ற பொருள் வரம்பைக் கொண்டிருக்கலாம்; தாவர உருவகத்திற்கேற்ற இயல்பான முதன்மை மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּכְיֶרֶק דֶּשֶׁא
  choice: பசுமையான தளிரைப்போல்
  rationale: יֶרֶק דֶּשֶׁא என்பதிலுள்ள பசுமை மற்றும் இளமையான செழிப்பான வளர்ச்சி ஆகிய இரண்டையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: יִבּוֹלוּן
  choice: உலர்ந்துபோவார்கள்
  rationale: தாவரம் உயிர்ச்செழிப்பை இழந்து வாடி உலர்வதைக் குறிக்கும் இணை உருவகத்தைத் தெளிவாக வழங்குகிறது.
