translation:
  language: ta
  text: ஏனெனில் அவர்கள் புல்லைப்போல் விரைவில் வாடிவிடுவார்கள்; பசுமையான தாவரங்களைப்போல் உலர்ந்துபோவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மாற்றாக, ‘புல்லைப்போல் விரைவில் வெட்டப்படுவார்கள்; பசுமையான தாவரங்களைப்போல் வாடிப்போவார்கள்’ என்றும் மொழிபெயர்க்கலாம். இவ்வசனத்திலுள்ள எபிரெய வினைச்சொற்களின் பொருள் வரம்புகளில் வெட்டப்படுதல், வாடுதல், உலருதல் ஆகியவை ஒன்றோடொன்று தொடர்புடையவையாக உள்ளன.
    reason: lexical_alternative
