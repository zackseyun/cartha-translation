source:
  edition: WLC
  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/001.yaml
  text: Of David[a]. Do not be provoked by evildoers[b]; do not envy those who do wrong.
translation:
  language: ta
  text: 'தாவீதுடையது.[a]


    தீமை செய்கிறவர்களால் மனம் கொதிக்காதே;[b]

    அநீதி செய்கிறவர்கள்மீது பொறாமைப்படாதே.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீதால் இயற்றப்பட்டது” அல்லது “தாவீதுக்காக.” எபிரெயத் தலைப்பு ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும்.
    reason: source_ambiguity
  - marker: b
    text: அல்லது, “தீமை செய்கிறவர்களைக் கண்டு கலங்காதே.” எபிரெய வினை சூடேறுதல், கிளர்ச்சியடைதல், அல்லது சினமுறுதல் என்ற பொருள்களைத் தரக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “தவறு செய்கிறவர்கள்” அல்லது “நீதியற்ற செயல்களைச் செய்கிறவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்கு உரியது
  rationale: לְ என்ற முன்னிடைச்சொல் ஆசிரியத்துவம், தொடர்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். எந்த ஒரு பொருளையும் மட்டும் நிர்ணயிக்காமல், தலைப்பின் சுருக்கத்தையும் இயன்றவரை காக்கும் இயல்பான தமிழ் வடிவம் இது.
- source_word: אַל
  choice: —ஆதே
  rationale: אַל + முற்றுப்பெறாத வினை வடிவம் தடையை வெளிப்படுத்துகிறது. தமிழில் எதிர்மறை ஏவல் ஒருமை வடிவமான ‘—ஆதே’ நேரடியும் இயல்புமான இணையாகும்.
- source_word: תִּתְחַר
  choice: மனம் கொதிக்காதே
  rationale: חרה என்ற வினையின் இந்த வடிவம் உள்ளத்தில் சூடேறுதல், கிளர்ச்சியடைதல், சினமுறுதல் ஆகிய பொருட்களைத் தருகிறது. ‘மனம் கொதித்தல்’ அதன் உருவகத்தையும் உள்ளார்ந்த கலக்கத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בַּמְּרֵעִים
  choice: தீமை செய்கிறவர்களைக் கண்டு
  rationale: בְּ இங்கு மனக்கொதிப்பின் காரணம் அல்லது சந்தர்ப்பத்தைக் குறிக்கிறது. ‘—ஐக் கண்டு’ என்பது தீமை செய்பவர்களால் உண்டாகும் எதிர்வினையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תְּקַנֵּא
  choice: பொறாமைப்படாதே
  rationale: קנא சூழலின்படி பொறாமை அல்லது வைராக்கியத்தைக் குறிக்கலாம். இங்கு தீமை செய்பவர்களின் நிலையைக் கண்டு விரும்பும் மனப்பாங்குக்கு எதிரான எச்சரிக்கை என்பதால் ‘பொறாமைப்படாதே’ பொருத்தமானது.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: அநீதி செய்கிறவர்கள்மேல்
  rationale: עֹשֵׂי என்பது தொடர்ந்து செய்பவர்களைக் குறிக்கும் பங்கேற்பு வடிவம்; עַוְלָה தவறு, அநீதி, நீதியின்மை ஆகிய பொருட்களைக் கொண்டது. ‘அநீதி செய்கிறவர்கள்’ செயற்பாட்டு நுணுக்கத்தையும் அறநெறிசார் பொருளையும் தெளிவாகக் காக்கிறது.
