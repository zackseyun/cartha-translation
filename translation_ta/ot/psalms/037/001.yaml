translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை எதிர்மறை ஏவல் வடிவம் எபிரெய மூலத்தின் நேரடி அழைப்பை காக்கிறது; இரு இணை வரிகளின் செயற்பாட்டு அமைப்பும் தக்கவைக்கப்பட்டுள்ளது.
