  naturalness: ‘அவன் விழுந்தாலும், கீழே தள்ளப்படமாட்டான்’ என்பது நவீனத் தரத் தமிழில் தெளிவாகவும் சங்கீத நடைக்குப் பொருத்தமாகவும் உள்ளது. ‘அவன் கையைத் தாங்குகிறார்’ என்பது சற்றே கவிதைநடையான பயன்பாடாக இருந்தாலும், இச்சூழலில் இயல்பாகப் புரிகிறது; அடிக்குறிப்பிலுள்ள ‘அவன் கையைப் பிடித்திருக்கிறார்’ என்ற மாற்றும் வாசகனுக்கு உதவுகிறது.
