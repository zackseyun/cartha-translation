    reason: translation_alternative
lexical_decisions:
- source_word: כִּי
  choice: விழுந்தாலும்
  rationale: 'இச்சூழலில் முதல் כִּי விட்டுக்கொடுக்கும் பொருளைத் தருகிறது: அவன் விழக்கூடும், ஆனாலும் கீழே தள்ளப்பட்டுவிட மாட்டான். ‘-ஆலும்’ இந்த உறவை இயல்பான தமிழில் காட்டுகிறது; பிற சாத்தியமான பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.'
- source_word: יִפֹּל
  choice: விழுந்தாலும்
  rationale: נפל என்பதன் அடிப்படைப் பொருள் ‘விழுதல்’. இங்கு எந்த வகையான இடர் அல்லது தோல்வி என்று குறிப்பிடப்படாததால், உருவகத்தின் பரந்த பொருளைக் குறுக்காமல் ‘விழுதல்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יוּטָל
  choice: கீழே தள்ளப்படமாட்டான்
  rationale: טול வினையின் ஹொஃபால் வடிவம் பிறரால் கீழே எறியப்படுதல் அல்லது தள்ளப்படுதல் என்ற செயப்பாட்டு பொருளைக் கொண்டது. முந்தைய ‘விழுதல்’ என்பதிலிருந்து வேறுபாட்டையும் இது காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெயப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: סוֹמֵךְ
  choice: தாங்குகிறார்
  rationale: סמך என்பதன் பங்கேற்பு வடிவம் தொடர்ந்து ஆதரித்தல், தாங்குதல் என்ற பொருளைத் தருகிறது. தமிழில் ‘கையைத் தாங்குகிறார்’ என்பது அந்தச் செயற்பட்ட ஆதரவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יָדוֹ
  choice: அவன் கையை
  rationale: எபிரெயில் ‘அவன் கை’ என்பது நேரடிச் செயப்படுபொருளாக உள்ளது. யாவே நீதிமானின் கையைத் தாங்கும் உருவகம் அதேபடி வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘விழுதல்’ என்ற உருவகத்தின் வரம்பு
  choice: நீதிமான் சந்திக்கும் இடர், பின்னடைவு அல்லது வீழ்ச்சி என்று பொதுவாகவே வைக்கப்பட்டுள்ளது.
  alternative: இதைப் பாவம் அல்லது ஆவிக்குரிய வீழ்ச்சி என்று மட்டும், அல்லது உடல்சார்ந்த ஆபத்து என்று மட்டும் குறுக்கிப் புரிதல்.
  rationale: எபிரெயச் சொற்கள் இடரின் வகையைத் தெளிவுபடுத்தவில்லை. ஆகவே ஒரு குறிப்பிட்ட கோட்பாட்டுப் பொருளைச் சேர்க்காமல் மூலத்தின் பரந்த உருவகமும் இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் சங்கீதத்திற்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘விழுதல்’ மற்றும் ‘கீழே தள்ளப்படுதல்’ என்ற இரு வேறு எபிரெய வினைகளின் வேறுபாடு காக்கப்பட்டுள்ளது.
