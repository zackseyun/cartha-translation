  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
translation:
  language: ta
  text: அவன் விழுந்தாலும்[a], கீழே தள்ளப்படமாட்டான்; ஏனெனில் யாவே அவன் கையைத் தாங்குகிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் விழுந்தால், கீழே தள்ளப்படமாட்டான்.” இங்குள்ள எபிரெய இணைப்புச்சொல் சூழலுக்கேற்ப “ஏனெனில்,” “என்றால்,” அல்லது “விழுந்தாலும்” என்ற பொருள்களைத் தரலாம்.
    reason: lexical_alternative
  - marker: b
