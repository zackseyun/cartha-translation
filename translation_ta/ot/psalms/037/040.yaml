base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
translation:
  language: ta
  text: யாவே அவர்களுக்கு உதவுகிறார்; அவர்களை விடுவிக்கிறார்; பொல்லாதவர்களிடமிருந்து அவர்களை விடுவிக்கிறார்; அவர்களைக் காப்பாற்றுகிறார், ஏனெனில் அவர்கள் அவரிடம் அடைக்கலம் புகுகிறார்கள்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விடுவிக்கிறார்” என்பதற்குப் பதிலாக, இரண்டு இடங்களிலும் “மீட்கிறார்” என்றும் மொழிபெயர்க்கலாம்; வலியுறுத்துவதற்காக எபிரெயத்தில் ஒரே மீட்பு வினைச்சொல் மீண்டும் வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் அவரை நம்புகிறார்கள்”; எபிரெயம் இன்னும் நேரடியாக அவரிடம் அடைக்கலம் புகுவதைப் பற்றிப் பேசுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய வேதாகமத்தில் உள்ள இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஏற்கெனவே பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וַיַּעְזְרֵם
  choice: அவர்களுக்கு உதவி செய்து
  rationale: עזר என்பதன் ‘உதவி செய், துணைநில்’ என்ற நேரடியான பொருளைப் பாதுகாக்கிறது; அடுத்த வினையுடன் இயல்பான தமிழ் தொடராக அமைகிறது.
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  choice: அவர்களை விடுவிக்கிறார்; பொல்லாதவர்களிடமிருந்து அவர்களை விடுவித்து
  rationale: פלט வேரின் மீட்பு/தப்புவித்தல் பொருளையும், மூலத்தில் வலியுறுத்தலுக்காக வரும் வினைச்சொல் மறுபடியும் கூறப்படுவதையும் பாதுகாக்கிறது.
- source_word: מֵרְשָׁעִים
  choice: பொல்லாதவர்களிடமிருந்து
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் பன்மை அடைமொழியை பாலினத்தைச் சேர்க்காமல் இயல்பான தமிழில் தருகிறது.
- source_word: וְיוֹשִׁיעֵם
  choice: காப்பாற்றுகிறார்
  rationale: ישע என்பதன் பரந்த மீட்பு மற்றும் காப்பாற்றுதல் பொருளை இச்சூழலில் தெளிவாக வழங்குகிறது; முந்தைய פלט என்பதிலிருந்து சொல்லளவில் வேறுபாட்டையும் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யெகோவாவின் காப்பாற்றும் செயலுக்கான காரணத்தை அறிமுகப்படுத்தும் காரண இடைச்சொல்லாகத் தெளிவாக உள்ளது.
- source_word: חָסוּ בוֹ
  choice: அவர்கள் அவரிடம் அடைக்கலம் புகுந்தார்கள்
  rationale: חסה என்பதிலுள்ள பாதுகாப்பை நாடும் உருவகத்தை பொதுவான ‘நம்பினார்கள்’ எனச் சுருக்காமல் பாதுகாக்கிறது; எபிரெய நிறைவுநிலை வினையின் கடந்தகால அம்சத்தையும் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது. ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டமைக்கும் மற்றொரு ஏற்ற ஒலிபெயர்ப்பு.
- issue: פלט என்ற மீட்பு வினையின் மறுபடியான பயன்பாடு
  choice: இரண்டு இடங்களிலும் ‘விடுவி’ என்பதைத் தக்கவைத்தல்
  alternative: ஒரே விடுவிப்பு கூற்றாகச் சுருக்குதல்
  rationale: அடுத்தடுத்த கூறுகளில் வரும் மறுபயன்பாடு கவிதையின் வலியுறுத்தலைக் கொண்டிருப்பதால் அதைச் சீராக்கி நீக்கவில்லை.
- issue: חָסוּ בוֹ என்பதிலுள்ள உருவகம்
  choice: அவரிடம் அடைக்கலம் புகுந்தார்கள்
  alternative: அவரை நம்பினார்கள்
  rationale: நம்பிக்கை என்ற கருத்து உட்பொருளாக இருந்தாலும், மூலத்தின் பாதுகாப்பிட உருவகத்தை வெளிப்படையாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வினை மறுபயன்பாடு தக்கவைக்கப்பட்டு, நிறைவுநிலை חָסוּ கடந்தகாலத்தில் வழங்கப்பட்டுள்ளது; முன் வரும் செயல்கள் பொதுவான/உறுதியான செயலை உணர்த்தும் நிகழ்காலத்தில் இயல்பாக்கப்பட்டுள்ளன.
