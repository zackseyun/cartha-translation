source:
  edition: WLC
  text: כָּל הַ֭/יּוֹם חוֹנֵ֣ן וּ/מַלְוֶ֑ה וְ֝/זַרְע֗/וֹ לִ/בְרָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/026.yaml
  text: All day long he is gracious and lends[a], and his offspring are a blessing.
translation:
  language: ta
  text: 'நாளெல்லாம் அவன் தயவு காட்டுகிறான்; கடனும் கொடுக்கிறான்;

    அவனுடைய சந்ததியினர் ஓர் ஆசீர்வாதமாக இருக்கிறார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய சந்ததியினர் ஆசீர்வதிக்கப்பட்டவர்கள்.” எபிரேயத்தில் சொல்லுக்குச்சொல், “அவனுடைய சந்ததி ஆசீர்வாதத்திற்காக” என்று உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: நாளெல்லாம்
  rationale: “நாள் முழுவதும்” என்ற காலப் பொருளையும், சூழலில் காணப்படும் தொடர்ச்சியான அல்லது வழக்கமான செயலையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: חוֹנֵן
  choice: தயவுகாட்டி
  rationale: חנן என்பதன் ‘தயவு அல்லது ஆதரவு காட்டுதல்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; இதை வெறும் பொருளாதாரத் தாராள மனப்பான்மையாக மட்டும் சுருக்கவில்லை.
- source_word: וּמַלְוֶה
  choice: கடன் கொடுக்கிறான்
  rationale: இங்குள்ள לוה என்பதன் Hiphil வடிவம் ‘கடன் வாங்குதல்’ அல்ல, ‘கடன் கொடுத்தல்’ எனப் பொருள்படும். நிகழ்கால வடிவம் எபிரெயப் பங்கேற்பெயரின் வழக்கமான செயல் நுணுக்கத்தைத் தெரிவிக்கிறது.
- source_word: וְזַרְעוֹ
  choice: அவனுடைய சந்ததியினர்
  rationale: זֶרַע என்பதன் கூட்டு ஒருமைப் பொருளான சந்ததி அல்லது வழித்தோன்றல்களை இயல்பான தமிழில் தெரிவிக்கிறது; ‘விதை’ என்ற தவறாகப் புரிந்துகொள்ளக்கூடிய நேரடிச் சொல்லைத் தவிர்க்கிறது.
- source_word: לִבְרָכָה
  choice: ஓர் ஆசீர்வாதமாக இருக்கிறார்கள்
  rationale: எழுத்துப்படியான ‘ஆசீர்வாதத்திற்காக’ என்ற அமைப்பை இயல்பான தமிழில் விளைவையோ நிலையையோ குறிக்கும் வகையில் தருகிறது; அவர்கள் ஆசீர்வாதத்தைப் பெறுகிறவர்கள் என்று மட்டும் பொருளை மாற்றவில்லை.
theological_decisions:
- issue: לִבְרָכָה என்ற இறுதித் தொடரின் பொருள்
  choice: அவனுடைய சந்ததியினர் ஓர் ஆசீர்வாதமாக இருக்கிறார்கள்
  alternative: அவனுடைய சந்ததியினர் ஆசீர்வதிக்கப்பட்டவர்கள்
  rationale: בְּרָכָה என்பதுடன் வரும் ל முன்னிடைச்சொல் இயல்பாக ‘ஆசீர்வாதமாக/ஆசீர்வாதத்திற்காக’ என்ற நிலை அல்லது நியமிப்பைக் குறிக்கிறது. இருப்பினும் ‘ஆசீர்வதிக்கப்பட்டவர்கள்’ என்ற வாசிப்பும் சாத்தியமுள்ளதால் அதை அடிக்குறிப்பில் வைத்துப் பொருள் நெருக்கடியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘நாளெல்லாம்’ என்பது தொடர்ச்சியான பழக்கச் செயலை உணர்த்துகிறது; ‘சந்ததியினர்’ உடனடி பிள்ளைகளை மட்டும் அல்லாமல் வழித்தோன்றல்களையும் உள்ளடக்குகிறது. அடிக்குறிப்பு குறி பொருள் தொடர்புடைய இறுதித் தொடருக்குப் பின் வைக்கப்பட்டுள்ளது.
