  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
translation:
  language: ta
  text: இக்கட்டான காலத்தில் அவர்கள் அவமானத்திற்கு உள்ளாகமாட்டார்கள்[a][b]; பஞ்சம் நிலவும் நாட்களில் அவர்கள் திருப்தியடைவார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெட்கமடைய மாட்டார்கள்.’ எபிரெய வினைச்சொல் ஒருவர் வெட்கத்தை அனுபவிப்பதையோ அவமானத்திற்கு உள்ளாவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பேரிடர்க் காலத்தில்’ அல்லது ‘தீங்கான காலத்தில்.’ இங்கே ‘தீங்கு’ என்பது ஒழுக்கத் தீமையை அல்ல, இடரையோ துன்பத்தையோ குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘நிறைவடைவார்கள்’ அல்லது ‘போதுமான அளவு பெறுவார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: அவமானத்திற்கு உள்ளாகமாட்டார்கள்
  rationale: בושׁ என்பது எதிர்பார்ப்பு பொய்த்ததால் அல்லது பொதுவில் இழிவுற்றதால் ஏற்படும் வெட்கம் அல்லது அவமானத்தைக் குறிக்கலாம். இங்கு சங்கீதத்தின் உறுதிமொழிக்கு ஏற்ற விளைவுசார் பொருளை இந்தத் தேர்வு இயல்பான தமிழில் தருகிறது.
- source_word: בְּעֵת רָעָה
  choice: இக்கட்டுக் காலத்தில்
  rationale: עֵת என்பது ‘காலம்’; רָעָה இங்கு ஒழுக்கத் தீமையை அல்ல, துன்பம் அல்லது இடர்நிலையைக் குறிக்கிறது. ‘இக்கட்டுக் காலம்’ என்பது பரந்த பொருளைத் தக்கவைக்கும் இயல்பான நவீனத் தமிழ்.
- source_word: וּבִימֵי רְעָבוֹן
  choice: பஞ்ச நாட்களில்
  rationale: இந்தச் சொற்றொடர் கடுமையான உணவுப் பற்றாக்குறை நிலவும் நாட்களைக் குறிக்கிறது. ‘பஞ்ச நாட்கள்’ சுருக்கமாகவும் தெளிவாகவும் உள்ளது.
- source_word: רְעָבוֹן
  choice: பஞ்சம்
  rationale: רְעָבוֹן கடுமையான பசி அல்லது உணவுப் பற்றாக்குறையைக் குறிக்கும்; இச்சூழலில் சமூக அளவிலான பற்றாக்குறையை ‘பஞ்சம்’ துல்லியமாக வெளிப்படுத்துகிறது.
- source_word: יִשְׂבָּעוּ
  choice: நிறைவுபெறுவார்கள்
  rationale: שׂבע என்பது போதுமான அளவு பெற்று நிறைவடைவதைக் குறிக்கிறது. ‘நிறைவுபெறுவார்கள்’ தேவையான உணவு கிடைப்பதை உணர்த்துகிறது; ஆனால் அது எவ்வாறு கிடைக்கும் என்பதைச் சேர்த்துக் கூறுவதில்லை.
theological_decisions:
- issue: இக்கட்டிலும் பஞ்சத்திலும் கிடைக்கும் பாதுகாப்பு மற்றும் நிறைவு
  choice: எபிரெய உரை கூறும் உறுதிமொழியை நிபந்தனையோ நடைமுறை விளக்கமோ சேர்க்காமல் நேரடியாகத் தக்கவைத்தல்
  alternative: இந்த வாக்குறுதியை முழுமையான உடனடி பொருளாதாரப் பாதுகாப்பாக அல்லது ஆன்மிக நிறைவாக மட்டும் விளக்குதல்
  rationale: வசனம் உறுதியான பாதுகாப்பையும் நிறைவையும் கூறுகிறது; ஆனால் அதன் செயல்முறை அல்லது எல்லைகளை இங்கே விளக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் இழுபறியைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், ஆனால் சங்கீதத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவமானத்திற்கு உள்ளாகுதல்,’ ‘இக்கட்டுக் காலம்,’ ‘நிறைவுபெறுதல்’ ஆகியவை மூலத்தின் பொருள் அகலத்தையும் இயல்பான தமிழ் நடையையும் சமநிலைப்படுத்துகின்றன.
