lexical_decisions:
- source_word: פִּי צַדִּיק
  choice: நீதிமானின் வாய்
  rationale: எபிரெயச் சொற்றொடரின் ‘நீதிமானுடைய வாய்’ என்ற உடைமை அமைப்பையும், பேச்சைக் குறிக்கும் உடல் உறுப்புப் படிமத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יֶהְגֶּה
  choice: உரைக்கிறது
  rationale: הגה என்பது மெல்ல ஒலித்தல், முணுமுணுத்தல், தியானித்தல் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு ‘வாய்’ எழுவாயாகவும், இணைவரியில் ‘நாவு பேசுகிறது’ என்றும் வருவதால், குரலால் வெளிப்படுத்துதல் முதன்மையான பொருள்.
- source_word: חָכְמָה
  choice: ஞானத்தை
  rationale: חָכְמָה என்பதற்கான வழக்கமான, சூழலுக்கேற்ற தமிழ் இணைச்சொல்; இது நீதிமானின் பேச்சின் உள்ளடக்கமாக வருகிறது.
- source_word: וּלְשׁוֹנוֹ
  choice: அவனுடைய நாவு
  rationale: ‘அவனுடைய நாவு’ என்ற நேரடியான படிமத்தைப் பேணி, ‘வாய்’ என்பதுடன் உள்ள எபிரெயக் கவிதை இணைநிலையை காக்கிறது.
- source_word: תְּדַבֵּר
  choice: பேசுகிறது
  rationale: דבר என்பதன் இச்சூழலுக்கான நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு; ‘நாவு’ என்பதோடு கவிதைநயமாக பொருந்துகிறது.
- source_word: מִשְׁפָּט
  choice: நீதியை
  rationale: מִשְׁפָּט என்பது நீதி, தீர்ப்பு, நியாயமானது ஆகிய பொருள்களைக் கொள்ளும். ஞானப் பாடலின் இச்சூழலில் ‘நீதி’ சரியானதும் நியாயமானதுமான பேச்சைச் சுருக்கமாகக் குறிக்கிறது.
theological_decisions:
- issue: ஞான இலக்கியத்தில் ஆண்பால் ஒருமை பிரதிநிதித்துவப் பயன்பாடு
  choice: நீதிமான் … அவனுடைய
  alternative: நீதியுள்ளவர் … அவரது
  rationale: צַדִּיק என்பது இலக்கண ரீதியாக ஆண்பால் ஒருமை; தனிப்பட்ட ஒரு நீதிமானை முன்மாதிரியாகச் சித்தரிக்கும் மூலத்தின் வடிவைத் தமிழிலும் காக்க ‘நீதிமான்’ மற்றும் ‘அவனுடைய’ பயன்படுத்தப்பட்டன. இது கருத்தை ஆண்களுக்கு மட்டும் கட்டுப்படுத்துவதாக அவசியமில்லை.
- issue: מִשְׁפָּט என்பதன் பொருள் வரம்பு
  choice: நீதி
  alternative: தீர்ப்பு / நியாயமானது
  rationale: சட்டத் தீர்ப்பு என்ற குறுகிய பொருளைத் திணிக்காமல், நேர்மையும் நியாயமும் சார்ந்த பரந்த பொருளை ‘நீதி’ காக்கிறது; பிற சாத்தியங்களை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான கவிதைநடை பயன்படுத்தப்பட்டது. ‘வாய்/நாவு’ என்ற இணைநிலைப் படிமமும் எபிரெய ஆண்பால் ஒருமையும் பாதுகாக்கப்பட்டுள்ளன.
