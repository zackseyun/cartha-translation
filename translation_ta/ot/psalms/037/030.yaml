    text: அல்லது, “ஞானத்தைத் தியானிக்கிறது” அல்லது “ஞானத்தை முணுமுணுக்கிறது.” எபிரெய வினைச்சொல் மெல்ல உரைப்பதையோ மனத்தில் சிந்திப்பதையோ குறிக்கலாம்; ஆனால் இணைவரியில் “நாவு … பேசுகிறது” என்று வருவதால், இங்கு வாயால் வெளிப்படுத்துவதே அதிகம் பொருந்துகிறது.
