  text: חַ֭רְבָּ/ם תָּב֣וֹא בְ/לִבָּ֑/ם וְ֝/קַשְּׁתוֹתָ֗/ם תִּשָּׁבַֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/015.yaml
  text: Their sword will enter their own heart[a], and their bows will be broken.
translation:
  language: ta
  text: அவர்களுடைய வாள் அவர்களுடைய சொந்த இதயத்திற்குள் பாயும்[a]; அவர்களுடைய வில்லுகள் முறிக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய வாள் அவர்களுடைய சொந்த இதயங்களுக்குள் பாயும்.” எபிரெயில் பன்மை உடைமையுடன் “இதயம்” ஒருமையில் வருகிறது; இது பொதுவான கூட்டுப் பயன்பாடு.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבָּם
  choice: அவர்களுடைய வாள்
  rationale: எபிரெயில் ‘வாள்’ ஒருமையிலும், அதனோடு மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதியும் உள்ளது. கூட்டுப் பொருளையோ ஒவ்வொருவருக்கும் பகிர்ந்தளிக்கப்படும் பொருளையோ காக்க ஒருமை தக்கவைக்கப்பட்டது.
- source_word: תָּבוֹא
  choice: பாயும்
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்/செல்லுதல்’; இங்கு בְּ + ‘இதயம்’ என்ற அமைப்பில் வாள் உடலுக்குள் நுழைவதைக் குறிப்பதால், தமிழில் இயல்பாகவும் வலிமையாகவும் ‘பாயும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְלִבָּם
  choice: அவர்களுடைய சொந்த இதயத்திற்குள்
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவர்களுடைய இதயத்தில்/இதயத்திற்குள்.’ ஆயுதம் அதை வைத்திருப்பவர்களையே தாக்கும் எதிர்விளைவைத் தெளிவாக்க ‘சொந்த’ சேர்க்கப்பட்டது; ‘-க்குள்’ ஊடுருவலை இயல்பாகக் காட்டுகிறது.
- source_word: וְקַשְּׁתוֹתָם
  choice: அவர்களுடைய வில்லுகள்
  rationale: எபிரெயில் பெயர்ச்சொல் பன்மையில், மூன்றாம் நபர் ஆண்பால் பன்மை உடைமை விகுதியுடன் உள்ளது; ஆகவே நேரடியாகப் பன்மையில் மொழிபெயர்க்கப்பட்டது.
- source_word: תִּשָּׁבַרְנָה
  choice: முறிக்கப்படும்
  rationale: שבר என்பதன் நிஃபால் வடிவம் இங்கு செயல்பாட்டு எதிர்காலப் பொருளுடைய வினைப்பாட்டு வடிவம். ‘முறிக்கப்படும்’ என்பது ‘உடைக்கப்படும்’ என்பதைவிட வில்லுகளுக்குச் செம்மையாகவும், ‘நொறுக்கப்படும்’ என்பதைவிட மூலத்தின் தீவிரத்தை மிகைப்படுத்தாமலும் உள்ளது.
