translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வாள்—இதயம் மற்றும் வில்—முறிதல் ஆகிய இணை உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; எபிரெயின் ஒருமை–பன்மைத் தெளிவின்மை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
