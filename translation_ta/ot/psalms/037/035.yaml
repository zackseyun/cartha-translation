lexical_decisions:
- source_word: רָאִיתִי
  choice: நான் கண்டிருக்கிறேன்
  rationale: ראה என்பதன் Qal perfect முதலாம் நபர் ஒருமை வடிவம். சங்கீதக்காரரின் கடந்தகால அனுபவம் இப்போதும் பொருத்தமுடைய சாட்சியாகச் சொல்லப்படுவதால், தமிழ் நிறைவுநிலை வடிவம் இயல்பாக அமைகிறது; ‘நான் கண்டேன்’ என்பதும் சாத்தியம்.
- source_word: רָשָׁע
  choice: பொல்லாத
  rationale: ஒழுக்கரீதியாகத் தீய ஒருவரைக் குறிக்கும் ஞானநூல் சார்ந்த வழக்கமான சொல்; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: עָרִיץ
  choice: கொடுங்கோலன்
  rationale: வலிமையால் பிறரை ஒடுக்கி அச்சுறுத்தும் நபரை இச்சொல் குறிக்கிறது. ‘கொடுங்கோலன்’ அதன் அதிகாரம், ஒடுக்குமுறை, இரக்கமின்மை ஆகிய கூறுகளை உடல் வன்முறையாக மட்டும் குறுக்காமல் வெளிப்படுத்துகிறது.
- source_word: וּמִתְעָרֶה
  choice: தன்னைப் பரப்பிக்கொண்டிருப்பதை
  rationale: Hitpael பங்கேற்புவடிவத்தின் தன்வினை நுட்பத்தையும், செழிப்பால் விரிந்து படரும் உருவகத்தையும் தக்கவைக்கிறது.
- source_word: כְּאֶזְרָח
  choice: நாட்டுமரத்தைப்போல்
  rationale: אֶזְרָח வழக்கமாக ‘அந்த நாட்டுக்குரியவன்/அங்கே பிறந்தவன்’ எனப் பொருள்படும். இக்கவிதை உவமையில் மரம் உள்ளுறையாகக் கருதப்படுவதால், புரிதலுக்காக ‘மரம்’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: רַעֲנָן
  choice: தழைத்தோங்கும்
  rationale: பசுமை, புத்துணர்ச்சி, வலிமையான வளர்ச்சி ஆகியவற்றைக் குறிக்கும் சொல்லின் கவித்துவ ஆற்றலை இயல்பான தமிழில் எடுத்துரைக்கிறது.
