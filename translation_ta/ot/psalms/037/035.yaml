  text: I have seen a wicked[a], ruthless man spreading himself out like a flourishing native tree.
translation:
  language: ta
  text: பொல்லாத, இரக்கமற்ற ஒருவன் தழைத்தோங்கும் நாட்டுமரத்தைப்போல் செழித்து விரிந்திருப்பதை நான் கண்டிருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடர் பொருள் காண்பதற்குக் கடினமானது. சொற்சார்பாக, ‘பசுமையான நாட்டைச் சேர்ந்த ஒருவனைப்போல்’ என்றும் மொழிபெயர்க்கலாம். ஆனால், தன் சொந்த மண்ணில் செழித்து வளரும் மரத்தின் உவமை இங்கு குறிப்பாக இருக்கலாம்.
