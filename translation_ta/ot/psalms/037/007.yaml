  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
translation:
  language: ta
  text: யாவே முன்னிலையில் அமைதியாயிரு[a]; அவருக்காகப் பொறுமையுடன் காத்திரு[b]. தன் வழியில் செழிப்படைகிறவனைக் கண்டும், சூழ்ச்சிகளைச் செயல்படுத்துகிற மனிதனைக் கண்டும் கோபத்தில் கொதிக்காதே[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘யாவே முன்னிலையில் மௌனமாயிரு.’ எபிரேய வினை அமைதியுடன் இருப்பதையும் மௌனமாக இருப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவருக்காக ஏக்கத்துடன் காத்திரு.’ இந்த எபிரேய வினை பொறுமையான காத்திருப்போடு வேதனை கலந்த ஏக்கத்தையும் உணர்த்தக்கூடும்; பாரம்பரியமாக, ‘அவரில் இளைப்பாறு’ என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: பாரம்பரியமாக, ‘எரிச்சலடையாதே.’ எபிரேய மொழி இன்னும் நேரடியாகச் சூடாதல் அல்லது கோபத்தில் எரிதல் என்ற உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹם
  choice: அமைதியாயிரு
  rationale: דמם என்ற வினையின் கட்டளை வடிவம் அமைதியையும் அசைவற்ற அடக்கத்தையும் குறிக்கலாம். ‘அமைதியாயிரு’ என்பது இரு நுணுக்கங்களையும் இயல்பான நவீனத் தமிழில் தாங்குகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவின் முன்னிலையில்
  rationale: இங்கு ל முன்னிலைச் சொல், தெய்வீகப் பெயருடையவரின் சந்நிதியில் அல்லது அவரை நோக்கிய அமைதியைக் குறிக்கிறது. ‘முன்னிலையில்’ என்பது உறவுசார் பொருளைத் தெளிவாக்குகிறது.
- source_word: וְהִתְחוֹלֵל לוֹ
  choice: அவருக்காகப் பொறுமையுடன் காத்திரு
  rationale: חול என்பதன் hitpolel வடிவம் துடித்தல் அல்லது வேதனையுடன் ஏங்குதல் என்ற பின்னணியைக் கொண்டிருக்கலாம்; இச்சூழலில் அது கடவுளுக்காகப் பொறுமையுடன், ஆழ்ந்த எதிர்பார்ப்புடன் காத்திருப்பதை உணர்த்துகிறது.
- source_word: אַל תִּתְחַר
  choice: கோபத்தில் கொதிக்காதே
  rationale: חרה என்பதன் அடிப்படை உருவகம் சூடாதல் அல்லது எரிதல்; இங்கு அது கோபம் மூள்வதைக் குறிக்கிறது. தமிழ் மொழிபெயர்ப்பு அந்த உருவகத்தை வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  choice: தன் வழியில் செழிப்படைகிறவனைக் குறித்தும்
  rationale: מצליח என்பது வெற்றி அல்லது செழிப்பு அடைகிற ஒருவரையும், דרכו என்பது அவரது வழி அல்லது வாழ்க்கைப் போக்கையும் குறிக்கிறது. ‘தன் வழியில் செழிப்படைகிறவன்’ எபிரேய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בְּאִישׁ
  choice: மனிதனைக் குறித்தும்
  rationale: אִישׁ என்பது ஆண்பால் ஒருமை வடிவம். ‘மனிதன்’ என்பது தமிழில் ஆண்பால் ஒருமையையும் பிரதிநிதித்துவ நபரையும் இயல்பாகக் காட்டுகிறது.
- source_word: עֹשֶׂה מְזִמּוֹת
  choice: சூழ்ச்சிகளைச் செயல்படுத்துகிற
  rationale: מְזִמּוֹת என்பது திட்டங்கள் அல்லது சூழ்ச்சிகளைக் குறிக்கலாம்; சங்கீதத்தின் எதிர்மறைச் சூழல் ‘சூழ்ச்சிகள்’ என்பதற்கு ஆதரவளிக்கிறது. עֹשֶׂה அவற்றை நடைமுறைப்படுத்துவதைச் சுட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் உடன்படிக்கைப் பெயரான நான்கு எழுத்துத் தெய்வீகப் பெயர் நேரடியாக உள்ளது. தமிழில் பரவலாக அறியப்படும் பெயர்ப்பெயர்ப்பு ‘யெகோவா’; ஆயினும் அதன் வரலாற்றுச் சத்தமிடலுக்கு மாற்றாக ‘யாவே’ பயன்படுகிறது.
- issue: אִישׁ என்பதிலுள்ள பாலினக் குறிப்பு
  choice: மனிதன்
  alternative: ஒருவன் / ஒருவர்
  rationale: மூலச் சொல் ஆண்பால் ஒருமை. ‘மனிதன்’ அதைத் தக்கவைத்தபடியே இங்கு எடுத்துக்காட்டு நபரைக் குறிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மரியாதையும் கவிதைத் தன்மையும் காக்கப்பட்டுள்ளன. ஒருமை கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரேய மூலத்தின் ‘வழி,’ ‘கொதித்தல்’ ஆகிய உருவகங்கள் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன; கடினமான וְהִתְחוֹלֵל לוֹ என்பதின் வேதனை/ஏக்கம் சார்ந்த நுணுக்கம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
