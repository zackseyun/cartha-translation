source:
  edition: WLC
  text: קַוֵּ֤ה אֶל יְהוָ֨ה וּ/שְׁמֹ֬ר דַּרְכּ֗/וֹ וִֽ֭/ירוֹמִמְ/ךָ לָ/רֶ֣שֶׁת אָ֑רֶץ בְּ/הִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
translation:
  language: ta
  text: யெகோவாவை நம்பிக் காத்திரு; அவருடைய வழியைக் கடைப்பிடி. தேசத்தைச்[a] சுதந்தரித்துக்கொள்ள அவர் உன்னை உயர்த்துவார். பொல்லாதவர்கள் அறுத்தழிக்கப்படும்போது, நீ அதைக் காண்பாய்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமியைச்.’ எபிரெயச் சொல் אָרֶץ என்பது ‘தேசம்’ அல்லது ‘பூமி’ என்று பொருள்படலாம். சங்கீதம் 37-ல் உடன்படிக்கை சார்ந்த சுதந்தர மொழி திரும்பத் திரும்ப வருவதால் இங்கே ‘தேசம்’ எனத் தேர்ந்தெடுக்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: மத்தேயு 5:5-ஐ ஒப்பிடுக; அங்கே ‘பூமியைச் சுதந்தரித்துக்கொள்வார்கள்’ என்ற வாக்குறுதியில் இந்தக் கருத்து எதிரொலிக்கிறது.
    reason: cross_reference
lexical_decisions:
- source_word: קַוֵּה
  choice: நம்பிக்கையுடன் காத்திரு
  rationale: קוה என்பது பொறுமையோடும் எதிர்பார்ப்போடும் கூடிய நம்பிக்கையைக் குறிக்கிறது. ‘நம்பிக்கையுடன் காத்திரு’ என்பது காத்திருத்தல், நம்புதல் ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் நிலைபெற்றுள்ள ‘யெகோவா’ என்ற ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: שְׁמֹר דַּרְכּוֹ
  choice: அவருடைய வழியைக் கடைப்பிடி
  rationale: שׁמר என்பது காத்தல் அல்லது கடைப்பிடித்தலைக் குறிக்கும். ‘வழியைக் கடைப்பிடி’ என்பது தேவனுடைய வழிநடத்தலுக்கும் கட்டளைகளுக்கும் உண்மையாக நடப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וִירוֹמִמְךָ
  choice: அவர் உன்னை உயர்த்துவார்
  rationale: רום என்பதன் காரணவினை வடிவம் உயர்த்துதல் அல்லது மேன்மைப்படுத்துதல் என்று பொருள்படும். ‘உயர்த்துவார்’ கவிதைநடையையும் நியாயம் கிடைக்கும் சூழலையும் காக்கிறது.
- source_word: לָרֶשֶׁת אָרֶץ
  choice: தேசத்தைச் சுதந்தரித்துக்கொள்ள
  rationale: ירשׁ என்பது சுதந்தரித்தல் அல்லது உடைமையாக்குதல் என்றும், אָרֶץ என்பது தேசம் அல்லது பூமி என்றும் பொருள்படலாம். சங்கீதம் 37-ல் திரும்பத் திரும்ப வரும் உடன்படிக்கை சார்ந்த சுதந்தர மொழிக்கு ‘தேசம்’ பொருந்துகிறது; ‘சுதந்தரித்துக்கொள்ள’ அந்த வாக்குறுதி நுணுக்கத்தைக் காக்கிறது.
- source_word: בְּהִכָּרֵת רְשָׁעִים
  choice: பொல்லாதவர்கள் அறுப்புண்டு போகும்போது
  rationale: כרת என்பதன் நிபால் வடிவம் ‘அறுப்புண்டு போதல்’ என்ற நீதித்தீர்ப்பு சார்ந்த எபிரெய உருவகத்தைத் தக்கவைக்கிறது; בְּ காலச் சூழலைக் குறிப்பதால் ‘போகும்போது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תִּרְאֶה
  choice: நீ அதைக் காண்பாய்
  rationale: வினைச்சொல் நேரடியாக ‘நீ காண்பாய்’ என்று பொருள்படும். தமிழில் தெளிவுக்காக, பொல்லாதவர்கள் அறுப்புண்டு போவதைக் குறிப்பதாய் ‘அதை’ சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: உடன்படிக்கை–ஞான இலக்கியச் சூழலில் אָרֶץ என்பதன் பொருள்
  choice: தேசம்
  alternative: பூமி
  rationale: சங்கீதம் 37 இஸ்ரவேலின் உடன்படிக்கைச் சுதந்தர மொழியைப் பலமுறை எதிரொலிப்பதால் ‘தேசம்’ முதன்மை வாசிப்பாகத் தேர்ந்தெடுக்கப்பட்டது. இருப்பினும், אָרֶץ ‘பூமி’ என்றும் பொருள்படக்கூடிய உண்மையான இருபொருள்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; மத்தேயு 5:5-இன் எதிரொலியும் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நம்பிக்கையுடன் காத்திரு’ என்பது קוה-வின் பொறுமை மற்றும் எதிர்பார்ப்பு நுணுக்கங்களை வெளிப்படுத்துகிறது. ‘தேசம்/பூமி’ என்ற மூலமொழி இருபொருள்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; நீதித்தீர்ப்பு உருவகமான ‘அறுப்புண்டு போதல்’ மென்மையாக்கப்படவில்லை.
