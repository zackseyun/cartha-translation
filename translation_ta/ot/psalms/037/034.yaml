revisions:
- from: யெகோவாவுக்காக நம்பிக்கையுடன் காத்திருந்து, அவருடைய வழியைக் கடைப்பிடி; தேசத்தைச்[a] சுதந்தரித்துக்கொள்ள அவர் உன்னை உயர்த்துவார். பொல்லாதவர்கள் அறுப்புண்டு போகும்போது, நீ அதைக் காண்பாய்.[b]
  to: யெகோவாவை நம்பிக் காத்திரு; அவருடைய வழியைக் கடைப்பிடி. தேசத்தைச்[a] சுதந்தரித்துக்கொள்ள அவர் உன்னை உயர்த்துவார். பொல்லாதவர்கள் அறுத்தழிக்கப்படும்போது, நீ அதைக் காண்பாய்.[b]
  rationale: யெகோவாவை நோக்கிய பொறுமையான, நம்பிக்கையான காத்திருப்பை இயல்பான தமிழில் தருவதற்காக முதல் சொற்றொடர் திருத்தப்பட்டது. כרת-ன் வெட்டியகற்றும் நீதித்தீர்ப்பு உருவகத்தைத் தக்கவைத்தபடி, தமிழில் தெளிவாகப் புரிய ‘அறுத்தழிக்கப்படும்போது’ பயன்படுத்தப்பட்டது. தேசம்/பூமி என்ற உண்மையான இருபொருள்தன்மையும் குறுக்கு-மேற்கோளும் மாற்றமின்றி காக்கப்பட்டுள்ளன.
