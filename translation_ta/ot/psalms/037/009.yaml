base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/009.yaml
  text: For evildoers will be cut off[a], but those who wait for Yahweh—they will inherit the land.
translation:
  language: ta
  text: ஏனெனில், தீமை செய்கிறவர்கள் அறுத்து அகற்றப்படுவார்கள்; ஆனால் யாவேவை எதிர்நோக்கிக் காத்திருப்பவர்களோ—அவர்களே நாட்டை[a]ச் சுதந்தரிப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியை.” எபிரெய אָרֶץ என்ற சொல் “நாடு” அல்லது “பூமி” என்று பொருள்படலாம்; இங்கு சங்கீதத்தின் உடன்படிக்கை சார்ந்த சூழலுக்கு “நாடு” என்பது மிகப் பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய அறிவுறுத்தலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் விளக்கத் தன்மையை இயல்பான தமிழில் காக்கிறது.
- source_word: מְרֵעִים
  choice: தீமை செய்கிறவர்கள்
  rationale: தீய செயலில் ஈடுபடுகிறவர்களைக் குறிக்கும் பங்கேற்பு வடிவத்தைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יִכָּרֵתוּן
  choice: அகற்றப்படுவார்கள்
  rationale: כרת என்பதன் நிபால் வடிவம் இங்கு ஒரு சமூகத்திலிருந்தோ வாழ்விடத்திலிருந்தோ நீக்கப்படுதல் அல்லது ஒழிக்கப்படுதல் என்ற நீதித்தீர்ப்பு சார்ந்த பொருளைக் கொண்டுள்ளது. தமிழில் சொல்லுக்கு சொல் 'வெட்டப்படுவார்கள்' என்பது தவறாகப் புரியக்கூடும் என்பதால், அதன் சூழல்சார் விளைவை 'அகற்றப்படுவார்கள்' என வழங்குகிறது.
- source_word: וְקֹוֵי
  choice: ஆனால் ... காத்திருப்பவர்களோ
  rationale: קוה என்பது எதிர்பார்ப்புடனும் நம்பிக்கையுடனும் காத்திருப்பதைக் குறிக்கிறது. முந்தைய பிரிவுடனான முரண்பாட்டைத் தமிழில் 'ஆனால்' மற்றும் 'வர்களோ' இயல்பாக வெளிப்படுத்துகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது.
- source_word: הֵמָּה
  choice: அவர்களே
  rationale: தனித்து வரும் வலியுறுத்தும் சுட்டுப்பெயரின் அழுத்தத்தைத் தமிழின் '-ஏ' விகுதி இயல்பாகக் காக்கிறது.
- source_word: יִירְשׁוּ
  choice: சுதந்தரித்துக்கொள்வார்கள்
  rationale: ירשׁ என்பதிலுள்ள வாக்குத்தத்தம் மற்றும் உடைமையாக்குதல் சார்ந்த நுண்பொருளை, வெறுமனே 'பெறுவார்கள்' என்பதைவிடத் தெளிவாகக் காக்கிறது.
- source_word: אָרֶץ
  choice: நாடு
  rationale: சங்கீதம் 37-இல் திரும்பத் திரும்ப வரும் உடன்படிக்கை சார்ந்த வாக்குத்தத்தச் சூழலில் குறிப்பிட்ட நாட்டை முதன்மையாகச் சுட்டுகிறது; அதே நேரத்தில் 'பூமி' என்ற விரிந்த பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: אָרֶץ என்ற சொல்லின் வாக்குத்தத்த எல்லை
  choice: நாடு
  alternative: பூமி
  rationale: உடனடிச் சங்கீதச் சூழல் உடன்படிக்கையின் நாட்டைச் சுதந்தரிப்பதை நினைவூட்டுகிறது. எனினும், எபிரெயச் சொல் முழுப் பூமியையும் குறிக்கக்கூடும்; ஆகவே அந்த விரிந்த வாசிப்பை மறுக்காமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: כרת என்ற நீதித்தீர்ப்பு சொல்லின் தீவிரம்
  choice: அகற்றப்படுவார்கள்
  alternative: வெட்டுண்டுபோவார்கள் / அழிக்கப்படுவார்கள்
  rationale: '''அகற்றப்படுவார்கள்'' என்பது நீக்கப்படுதல் என்ற மையக் கருத்தைத் தெளிவாகத் தருகிறது; ''அழிக்கப்படுவார்கள்'' என்பது முழுமையான அழிவைத் தீர்மானித்து விடலாம், tandis que சொல்லுக்கு சொல் ''வெட்டுண்டுபோவார்கள்'' நவீன தமிழில் இயல்பற்றதாகவும் உடல் துண்டிப்பைக் குறிப்பதாகவும் ஒலிக்கலாம்.'
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்துக்குரிய கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எதிர்மறை இணை அமைப்பும் הֵמָּה தரும் வலியுறுத்தலும் 'ஆனால் ... அவர்களே' என்ற வடிவில் காக்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் 'நாடு' என்ற சொல்லுக்குப் பின் வைக்கப்பட்டுள்ளது.
