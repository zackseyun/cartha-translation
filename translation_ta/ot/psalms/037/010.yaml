  choice: முதன்மை உரையில் ‘பொல்லாதவன்’ என்ற ஆண்பால் ஒருமையை வைத்தல்
  alternative: ‘பொல்லாதவர்கள்’ என்று பொதுவான பன்மையில் மொழிபெயர்த்தல்
  rationale: மூலத்தின் இலக்கண ஒருமையைப் பாதுகாக்கிறது; அதே நேரத்தில் அது ஒரு வகையினரைப் பிரதிநிதித்துவமாகக் குறிக்கக்கூடிய தெளிவின்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
