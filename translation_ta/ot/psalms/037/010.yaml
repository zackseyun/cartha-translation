  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. ‘இல்லாமல் போவான்’ மற்றும் ‘அங்கே இருக்கமாட்டான்’ ஆகியவை மூலத்தின் இருமுறை வலியுறுத்தப்படும் மறைவை இயல்பாகக் காக்கின்றன.
