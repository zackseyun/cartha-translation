  text: Yet a little while[a], and the wicked will be no more; though you look carefully at his place, he will not be there.
translation:
  language: ta
  text: 'இன்னும் சிறிது காலத்தில், பொல்லாதவன்[a] இல்லாமல் போவான்; அவன் இருந்த இடத்தை நீ கூர்ந்து பார்த்தாலும், அவன் அங்கே இருக்கமாட்டான்.


    [a] எபிரெயத்தில் ஆண்பால் ஒருமை வடிவம் உள்ளது; அது பொல்லாதவர்களைப் பொதுவாகக் குறிக்கும் பிரதிநிதி ஒருமையாகவும் இருக்கலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ஆண்பால் ஒருமை வடிவம் உள்ளது; அது பொல்லாதவர்களைப் பொதுவாகக் குறிக்கும் பிரதிநிதி ஒருமையாகவும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד מְעַט
  choice: இன்னும் சிறிது காலமே
  rationale: ‘இன்னும் சிறிது’ என்ற காலக் குறிப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘காலமே’ குறுகிய காலத்தையும் எதிர்நோக்கிய நிலையையும் தெளிவாக்குகிறது.
- source_word: וְאֵין
  choice: இல்லாமல் போவான்
  rationale: எதிர்காலத்தை நோக்கும் சூழலில், அந்தப் பொல்லாதவன் இனி காணப்படமாட்டான் என்ற இருப்பின்மை கருத்தை இயல்பாகத் தருகிறது.
- source_word: רָשָׁע
  choice: பொல்லாதவன்
  rationale: எபிரெய ஆண்பால் ஒருமை பெயரடையைப் பெயர்ச்சொல்லாகப் பயன்படுத்தியிருப்பதைப் பாதுகாக்கிறது; இது ஒரு பிரதிநிதித்துவ ஒருமையாகவும் பொதுவான வகையைக் குறிக்கலாம்.
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: நீ கவனமாகப் பார்த்தாலும்
  rationale: இந்த வினை குறிக்கும் உன்னிப்பான கவனிப்பு அல்லது ஆராய்தலைத் தருகிறது; சூழலிலுள்ள விட்டுக்கொடுப்பு நயத்தை ‘பார்த்தாலும்’ வெளிப்படுத்துகிறது.
- source_word: עַל מְקוֹמוֹ
  choice: அவன் இருந்த இடத்தை
  rationale: அவன் முன்பு இருந்த இடத்தை நோக்கிக் கவனிப்பது என்ற தெளிவான இடக் காட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: וְאֵינֶנּוּ
  choice: அவன் அங்கே இருக்கமாட்டான்
  rationale: முன்பு குறிப்பிடப்பட்ட இடத்தில் அவன் காணப்படமாட்டான் என்ற இறுதி மறுப்பைத் தெளிவாகவும் மீளுரையின் வலிமையுடனும் தருகிறது.
