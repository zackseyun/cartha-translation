source:
  edition: WLC
  text: בְּטַ֣ח בַּֽ֭/יהוָה וַ/עֲשֵׂה ט֑וֹב שְׁכָן אֶ֝֗רֶץ וּ/רְעֵ֥ה אֱמוּנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/003.yaml
  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
translation:
  language: ta
  text: யாவேயை நம்பு; நன்மை செய்; நாட்டில் குடியிரு; உண்மைத்தன்மையைப் பேணி வளர்த்து.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மைத்தன்மையை உணவாகக் கொள்”; வேறொரு சாத்தியம், “பாதுகாப்பை அனுபவி.” எபிரேயச் சொற்றொடர் கடினமானது; அது மேய்தல் அல்லது உண்மைத்தன்மை/நம்பகத்தன்மையால் ஊட்டம் பெறுதல் என்ற உருவகத்தைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  choice: நம்பி
  rationale: בטח என்பதன் கட்டளை வடிவம் ஒருவர்மீது நம்பிக்கை வைப்பதைக் குறிக்கிறது. தொடரும் கட்டளைகளுடன் இயல்பாக இணையத் தமிழில் வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בַּיהוָה
  choice: யெகோவாவை
  rationale: ב முன்னொட்டு நம்பிக்கையின் இலக்கைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: וַעֲשֵׂה טוֹב
  choice: நன்மை செய்
  rationale: ‘நல்லதைச் செய்’ என்ற நேரடியான பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: שְׁכָן אֶרֶץ
  choice: நாட்டில் குடியிருந்து
  rationale: שׁכן என்பது குடியிருத்தல் அல்லது நிலைத்துத் தங்குதல்; இச்சங்கீதத்தின் நிலம் சார்ந்த சூழலில் אֶרֶץ என்பதற்கு ‘நாடு’ பொருத்தமானது.
- source_word: וּרְעֵה
  choice: பேணி வளர்
  rationale: רעה என்பதன் அடிப்படை உருவகம் மேய்தல், மேய்த்தல், உணவளித்தல் என்பதாகும். அருவப்பெயரான ‘உண்மைத்தன்மை’யுடன் வந்துள்ளதால், செயற்பாட்டுக் கட்டளையையும் உருவகத்தின் வளர்ப்புக் கருத்தையும் வாசிக்கத்தக்க தமிழில் இது தெரிவிக்கிறது.
- source_word: אֱמוּנָה
  choice: உண்மைத்தன்மை
  rationale: אֱמוּנָה உறுதி, நம்பகத்தன்மை, உண்மைத்தன்மை அல்லது பாதுகாப்பைக் குறிக்கலாம். சுற்றியுள்ள அறநெறிக் கட்டளைகளுக்கு ‘உண்மைத்தன்மை’ நன்கு பொருந்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே
  rationale: எபிரேய மூலத்தில் பொதுப்பட்டப் பெயருக்குப் பதிலாகத் தனிப்பட்ட உடன்படிக்கைப் பெயர் இருப்பதை மறைக்காமல், தமிழில் பரவலாக அறியப்படும் ஒலிவடிவம் பயன்படுத்தப்பட்டுள்ளது.
- issue: וּרְעֵה אֱמוּנָה என்பதன் பொருள்
  choice: உண்மைத்தன்மையைப் பேணி வளர்
  alternative: உண்மைத்தன்மையை உணவாகக் கொள்; பாதுகாப்புடன் வாழ்
  rationale: எபிரேயச் சொற்றொடர் கடினமானதும் பலவாறு புரிந்துகொள்ளக்கூடியதும் ஆகும். முதன்மை உரை அதன் செயற்பாட்டு, மேய்ப்பு சார்ந்த உருவகத்தை இயல்பான தமிழில் தருகிறது; உண்மையான மாற்று வாசிப்புகள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான கட்டளைநடை. எபிரேய வாக்கியத்தின் இணைநிலைக் கட்டளைகள் காக்கப்பட்டுள்ளன; தெளிவற்ற இறுதிச் சொற்றொடர் முதன்மை உரையில் இயல்பாக்கப்பட்டு, மாற்று அர்த்தங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
