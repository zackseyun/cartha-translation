lexical_decisions:
- source_word: וְהוֹצִיא
  choice: வெளிப்படச் செய்வார்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ஒன்றை வெளியே வரச் செய்வதையோ தெளிவாக வெளிப்படுத்துவதையோ குறிக்கிறது. தமிழில் இயல்பாகவும் காரணவினைப் பொருளைத் தக்கவைத்தும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כָאוֹר
  choice: ஒளியைப்போல
  rationale: כ ஒப்புமையைக் குறிக்கிறது; אוֹר என்பது ‘ஒளி.’ நீதியான நிலை தெளிவாகக் காணப்படுவது என்ற கவிதைப் படிமம் பாதுகாக்கப்படுகிறது.
- source_word: צִדְקֶךָ
  choice: உன் நீதியை
  rationale: צדק என்பது நீதி, நேர்மை, அல்லது ஒருவர் நீதிமான் என நிலைநாட்டப்படுதல் ஆகிய பொருள்களைக் கொள்ளலாம். மூலச்சொல்லின் பரந்த பொருளை முதன்மை உரை தக்கவைக்கிறது; சூழலுக்குரிய ‘நேர்மை நிரூபிக்கப்படுதல்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וּמִשְׁפָּטֶךָ
  choice: உன் நியாயத்தை
  rationale: משפט என்பது தீர்ப்பு, நீதி, நியாயமான உரிமை, அல்லது ஒருவரின் வழக்கு/தரப்பு எனப் பொருள்படலாம். இங்கு ஒருவரது தரப்பின் நியாயம் வெளிப்படுவது என்ற கவிதை இணைநிலைக்கு ‘நியாயம்’ இயல்பாகப் பொருந்துகிறது.
- source_word: כַצָּהֳרָיִם
  choice: நண்பகலைப்போல
  rationale: צָהֳרַיִם என்பது நண்பகலைக் குறிக்கிறது. முழு வெளிச்சமும் தெளிவும் நிறைந்த நேரம் என்ற ஒப்புமையை ‘நண்பகலைப்போல’ நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: צדק மற்றும் משפט ஆகியவை ஒழுக்கநீதியையா அல்லது பொதுமுன் நியாயம் நிலைநாட்டப்படுவதையா குறிக்கின்றன?
  choice: முதன்மை உரையில் ‘நீதி’ மற்றும் ‘நியாயம்’ என்ற பரந்த சொற்களைப் பயன்படுத்துதல்
  alternative: ‘உன் நேர்மையை நிரூபிப்பார்’ மற்றும் ‘உன் தரப்பின் நியாயத்தை வெளிப்படுத்துவார்’ என்று சூழலார்ந்த பொருளை வெளிப்படையாகக் கூறுதல்
  rationale: இந்த இணைவரிகள் பொதுமுன் நியாயம் நிலைநாட்டப்படுவதைக் குறிப்பதாக இருக்கலாம்; எனினும் எபிரெயச் சொற்களின் ஒழுக்க மற்றும் சட்டப் பொருள் அகலத்தைச் சுருக்காமல், அந்தச் சூழலார்ந்த சாத்தியத்தை அடிக்குறிப்புகளில் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை. ‘ஒளி—நண்பகல்’ என்ற எபிரெய இணை உருவகமும், காரணவினைப் பொருளும், צדק/משפט சொற்களின் உண்மையான பொருள் அகலமும் பாதுகாக்கப்பட்டுள்ளன.
