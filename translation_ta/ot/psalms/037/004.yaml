  text: וְ/הִתְעַנַּ֥ג עַל יְהוָ֑ה וְ/יִֽתֶּן לְ֝/ךָ֗ מִשְׁאֲלֹ֥ת לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/004.yaml
  text: Delight yourself in Yahweh[a], and he will give you the desires of your heart.
translation:
  language: ta
  text: யாவேயில் இன்பங்கொள்; அவர் உன் இதயத்தின் விருப்பங்களை[a] உனக்குத் தருவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் இதயத்தின் வேண்டுதல்களை.” இந்த எபிரெயப் பெயர்ச்சொல் உள்ளத்தில் விரும்பப்படுபவற்றையும் வேண்டிக்கேட்கப்படுபவற்றையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעַנַּג
  choice: மகிழ்ச்சிகொள்
  rationale: ஹித்பயேல் கட்டளை வடிவம், ஒருவர் தாமே யாவேயில் மகிழ்ந்து இன்பம் காண வேண்டும் என்ற பொருளைத் தருகிறது. ‘மகிழ்ச்சிகொள்’ என்பது இதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: யாவேயில்
  rationale: எழுத்துப்படி ‘மேல்’ எனப் பொருள்படலாம்; ஆனால் மகிழ்தலைக் குறிக்கும் இச்சூழலில் தமிழில் உள்ளுறவு சார்ந்த பொருளை இயல்பாகக் காட்ட ‘-இல்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெயத் திருப்பெயரான יהוה-ஐ தமிழில் பரவலாக அறியத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יִתֶּן
  choice: அவர் ... உனக்குத் தருவார்
  rationale: இணைப்புடன் வரும் கால் முற்றுப்பெறா வினை இங்கு ஞான அறிவுரையின் விளைவு அல்லது எதிர்கால வாக்குறுதியாக இயல்பாகப் புரிகிறது.
- source_word: מִשְׁאֲלֹת
  choice: விருப்பங்களை
  rationale: இந்தப் பன்மைப் பெயர்ச்சொல் உள்ளார்ந்த விருப்பங்களையும் கேட்டுக்கொள்ளப்படும் வேண்டுதல்களையும் குறிக்கலாம். ‘இதயம்’ என்பதுடன் வரும் இச்சேர்க்கையில் ‘விருப்பங்கள்’ இயல்பானது; மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: לִבֶּךָ
  choice: உன் இதயத்தின்
  rationale: எபிரெயத்தில் இதயம் விருப்பம், சித்தம், உள்ளான மனிதர் ஆகியவற்றை உள்ளடக்கலாம். மூல உருவகத்தை விரிவாக்கமின்றி ‘இதயம்’ எனப் பாதுகாக்கிறது.
theological_decisions:
- issue: இந்த வாக்குறுதியை செழிப்பு வாக்குறுதியாக மட்டும் தவறாகப் புரிந்துகொள்ளும் சாத்தியம்
  choice: மூலத்தில் உள்ளபடியே வாக்குறுதியை நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘தேவனுக்கேற்ற விருப்பங்கள்’ என்று வரையறுத்தல் அல்லது ‘அவர் உன் விருப்பங்களை மாற்றி நிறைவேற்றுவார்’ என்று விரித்துரைத்தல்
  rationale: எபிரெய உரை எந்த விளக்க வரம்பையும் வெளிப்படையாகச் சேர்க்கவில்லை. ஆகவே இறையியல் விளக்கத்தை வசனத்திற்குள் புகுத்தாமல், அதன் வலிமையையும் பதற்றத்தையும் அப்படியே பாதுகாக்கிறது.
- issue: தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் יהוה என்ற தனிப்பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் சுருக்கமான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ஒருமை முன்னிலை ‘உன்/உனக்கு’ மூலத்தின் இரண்டாம் நபர் ஆண்பால் ஒருமையை பாலினக் குறிப்பின்றி இயல்பாக வெளிப்படுத்துகிறது. அடிக்குறிப்பு குறி அதற்குரிய ஐயப்பாடுள்ள சொல்லான ‘விருப்பங்களை’ என்பதன் அருகில் வைக்கப்பட்டுள்ளது.
