    reason: lexical_alternative
lexical_decisions:
- source_word: צוֹפֶה
  choice: கண்காணித்து
  rationale: צפה என்பதன் அடிப்படைப் பொருள் கவனித்துப் பார்த்தல் அல்லது கண்காணித்தல். இங்கு தீங்கு செய்யும் நோக்கம் சூழலாலும் இணைச் செயலாலும் வெளிப்படுகிறது; எனவே அந்தப் பகைமைத் தொனியை மிகையாக விளக்காமல் ‘கண்காணித்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: רָשָׁע
  choice: தீயவன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஒருமைச் சொல் ஒரு தீய மனிதனைப் பிரதிநிதித்துவமாகக் குறிக்கிறது. நவீன தமிழில் ‘தீயவன்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: לַצַּדִּיק
  choice: நீதிமானை
  rationale: צַדִּיק சங்கீதத்தின் அறநெறிசார் பிரிவைச் சுட்டுகிறது. ‘நீதிமான்’ அந்தக் கருத்தைத் தெளிவாகவும் மரியாதையான வேதாகம நடையிலும் தருகிறது.
- source_word: וּמְבַקֵּשׁ
  choice: வகைதேடுகிறான்
  rationale: בקש என்பது பொதுவாக ‘தேடுதல்’ என்று பொருள்படும்; இச்சூழலில் கொலை செய்வதற்கான நோக்கத்தையும் முயற்சியையும் குறிக்கிறது. ‘வகைதேடுகிறான்’ என்பது இலக்கின் முன் இயல்பான தமிழாக இருந்து, நோக்கமுள்ள தேடலை வெளிப்படுத்துகிறது.
- source_word: לַהֲמִיתוֹ
  choice: அவனைக் கொன்றுபோட
  rationale: מות வினையின் ஹிஃபீல் வடிவம் ‘சாகச் செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. ‘கொன்றுபோட’ என்பது நவீன தமிழில் நேரடியான, வலிமையான இணைச்சொல்.
- source_word: וּ
  choice: -த்து
  rationale: எபிரெய இணைப்புச்சொல் இரண்டு செயல்களை இணைக்கிறது. தமிழில் முதற்செயலை வினையெச்சமாக அமைப்பது இயல்பான தொடர்ச்சியை உருவாக்குகிறது.
