  text: The wicked watches the righteous and seeks to put him to death[a][b].
translation:
  language: ta
  text: தீயவன் நீதிமானைக் கண்காணிக்கிறான்;[a] அவனுடைய உயிரைப் பறிக்கத் தேடுகிறான்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீதிமானை நோக்கிப் பதுங்கிக் காத்திருக்கிறான்.’ இங்கு வரும் எபிரெய வினைச்சொல், சூழலின்படி தீங்கு செய்யும் நோக்கத்தோடு கண்காணிப்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
