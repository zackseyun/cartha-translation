source:
  edition: WLC
  text: לְ֭/פָנָי/ו יִכְרְע֣וּ צִיִּ֑ים וְ֝/אֹיְבָ֗י/ו עָפָ֥ר יְלַחֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/009.yaml
  text: Before him the desert dwellers will bow down[a], and his enemies will lick the dust.
translation:
  language: ta
  text: அவருக்கு முன்பாகப் பாலைவனத்தில் வாழ்பவர்கள் மண்டியிடுவார்கள்[a]; அவருடைய பகைவர்கள் புழுதியை நக்குவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாலைவனக் குடிகள்” என்றும் மொழிபெயர்க்கலாம். צִיִּים என்ற எபிரெயச் சொல் பாலைவனப் பகுதிகளில் வாழ்கிறவர்களைக் குறிக்கலாம்; சில இடங்களில் அது வனாந்தர உயிரினங்களையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: அவருக்கு முன்பாக
  rationale: எபிரெய மொழியில் இது ‘அவருக்கு முன்பாக’ அல்லது ‘அவருடைய முன்னிலையில்’ என்ற பொருளைத் தரும் மரபுத்தொடர்; தமிழில் இயல்பாகவும் இடம் மற்றும் உறவு சார்ந்த பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: יִכְרְעוּ
  choice: பணிந்து வணங்குவார்கள்
  rationale: כרע என்பது மண்டியிடுதல் அல்லது குனிந்து வணங்குதலைக் குறிக்கிறது. அரசருக்குக் கீழ்ப்படிவதைக் காட்டும் இச்சூழலில் ‘பணிந்து வணங்குவார்கள்’ என்பது உடல் செய்கையையும் கீழ்ப்படிதலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִיִּים
  choice: பாலைவனவாசிகள்
  rationale: இச்சொல் பாலைவனப் பகுதிகளில் வாழும் மனிதர்களையோ, சில சூழல்களில் வனாந்தர உயிரினங்களையோ குறிக்கலாம். ‘அவருடைய பகைவர்கள்’ என்பதுடன் இணையாக வருவதால் மனிதர்களைக் குறிப்பதாக முதன்மை உரையில் எடுத்துக்கொள்ளப்பட்டது; குறிப்பிட்ட இனத்தை நிர்ணயிக்காமல் ‘பாலைவனவாசிகள்’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: וְאֹיְבָיו
  choice: அவருடைய பகைவர்கள்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் אויב என்பதன் நேரான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: עָפָר
  choice: புழுதி
  rationale: இங்கு தோல்வி மற்றும் இழிவின் கவித்துவப் படிமத்தில் வரும் ‘தூசி/புழுதி’ என்பதே பொருள். ‘புழுதி’ தமிழில் அந்தத் தெளிவான காட்சியைத் தக்கவைக்கிறது.
- source_word: יְלַחֵכוּ
  choice: நக்குவார்கள்
  rationale: לחך என்பதன் அடிப்படைப் பொருள் ‘நக்கு’. பகைவர்கள் முற்றிலும் தாழ்த்தப்படுவதைச் சித்தரிக்கும் மூலத்தின் வலுவான உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: பணிதல் மற்றும் புழுதியை நக்குதல் ஆகிய படிமங்களின் தன்மை
  choice: அரசனுக்கு முன் தோல்வியடைந்து பணிவதைக் காட்டும் கவித்துவப் படிமமாக நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஒவ்வொரு சந்தர்ப்பத்திலும் நிகழும் சொற்சொல் சார்ந்த மண்டியிடுதலும் புழுதியை நக்குதலும் என்று மட்டும் புரிந்துகொள்ளுதல்.
  rationale: இவை பண்டைய அரசியல் மற்றும் அரசவைக் கவிதைகளில் முழுமையான தோல்வியையும் கீழ்ப்படிதலையும் காட்டும் வலுவான படிமங்கள். அவற்றை அருவமான அரசியல் சொல்லாக்கமாக மாற்றாமல் மொழிபெயர்ப்பு அப்படியே தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்தின் கண்ணியமான கவித்துவத் தொனியைத் தக்கவைக்கும் வகையிலும் அமைக்கப்பட்டது. ‘பணிந்து வணங்குவார்கள்’ என்பது அரசருக்கு முன் நிகழும் உடல் வணக்கத்தையும் கீழ்ப்படிதலையும் இணைத்துக் காட்டுகிறது; ‘புழுதியை நக்குவார்கள்’ மூலத்தின் தீவிரமான உருவகத்தை மாற்றாமல் தருகிறது.
