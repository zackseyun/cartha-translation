  text: May he judge your people with righteousness[b][a], and your afflicted ones with justice.
translation:
  language: ta
  text: அவர் உமது மக்களை நீதியோடு நியாயந்தீர்ப்பாராக; உமது துன்புறுவோருக்கு நியாயம் வழங்குவாராக.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் உமது மக்களை நீதியோடு நியாயந்தீர்ப்பார்.” இங்குள்ள எபிரெய வினை வடிவம் வேண்டுதலாகவோ எதிர்காலக் கூற்றாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “துன்புறுவோர்” என்பதற்கான எபிரெயச் சொல் “ஏழைகள்,” “தேவையிலுள்ளவர்கள்,” அல்லது “ஒடுக்கப்பட்டவர்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדִין
  choice: தீர்ப்பளிப்பாராக
  rationale: Qal imperfect 3ms இங்கு வேண்டுதல் அல்லது எதிர்கால முன்னறிவிப்பு ஆகிய இரு நுணுக்கங்களையும் கொள்ளலாம். சங்கீதத்தின் அரசருக்கான மன்றாட்டு சூழலில் வேண்டுதல் நுணுக்கத்தை முதன்மைப்படுத்தி, நீதிநிர்வாகப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: עַמְּךָ
  choice: உமது மக்களுக்கு
  rationale: עם என்பதுடன் இரண்டாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதி சேர்ந்துள்ளது; ‘உமது மக்கள்’ என்பது அதன் கூட்டு மற்றும் உடன்படிக்கைச் சார்ந்த பொருளை இயல்பாகக் காக்கிறது.
- source_word: בְצֶדֶק
  choice: நீதியோடும்
  rationale: צדק என்பது நீதி, நேர்மை, நீதியான தன்மை ஆகியவற்றைக் குறிக்கலாம். தீர்ப்பளிக்கும் விதத்தின் ஒழுக்கநெறிச் சரித்தன்மையை ‘நீதியோடும்’ இயல்பாக வெளிப்படுத்துகிறது; பின்னரும் வரும் משפט என்பதிலிருந்து சொல் வேறுபாடும் காக்கப்படுகிறது.
- source_word: וַעֲנִיֶּיךָ
  choice: உமது ஒடுக்கப்பட்டவர்களுக்கு
  rationale: עני என்பது ஏழைகள், துன்புறுவோர், எளியோர் அல்லது ஒடுக்கப்பட்டோர் ஆகியோரைக் குறிக்கலாம். இச்சூழலில் ‘ஒடுக்கப்பட்டவர்கள்’ சமூகப் பாதிப்பையும் துன்பத்தையும் வெளிப்படுத்துகிறது; பொருளாதார ஏழ்மைக்கு மட்டும் சொல்லைக் குறுக்கவில்லை.
- source_word: בְמִשְׁפָּט
  choice: நியாயத்தோடும்
  rationale: משפט இங்கு நீதியான தீர்ப்பு அல்லது நியாயத்தைச் சுட்டுகிறது. ‘நியாயத்தோடும்’ என்பது தற்போதைய தமிழில் தெளிவாகவும், צדק என்பதற்கான ‘நீதி’யிலிருந்து பொருத்தமான சொல் வேறுபாட்டுடனும் உள்ளது.
theological_decisions:
- issue: அரசருக்கான மன்றாட்டில் தொடக்க imperfect வினையின் வேண்டுதல் அல்லது எதிர்காலப் பொருள்
  choice: வேண்டுதலாக ‘தீர்ப்பளிப்பாராக’
  alternative: எதிர்காலக் கூற்றாக ‘தீர்ப்பளிப்பார்’
  rationale: சங்கீதம் 72 அரசருக்கான விண்ணப்பமாகத் தொடங்குவதால், வேண்டுதல் நுணுக்கம் சூழலுக்கு நன்றாகப் பொருந்துகிறது. ஆயினும் எபிரெய imperfect எதிர்காலப் பொருளையும் கொள்ளக்கூடும் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடை; மரியாதைமிக்க ‘உமது’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. கவிதை இணைநிலையைப் பேண ‘நீதியோடும் / நியாயத்தோடும்’ மற்றும் ‘மக்களுக்கு / ஒடுக்கப்பட்டவர்களுக்கு’ என்ற சமச்சீர் அமைப்பு வைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் உரையின் இறுதியில் தொடர்புடைய முழு வசனத்திற்குப் பொருந்துமாறு இணைக்கப்பட்டுள்ளன.
