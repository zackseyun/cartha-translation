source:
  edition: WLC
  text: יְהִ֤י שְׁמ֨/וֹ לְֽ/עוֹלָ֗ם לִ/פְנֵי שֶׁמֶשׁ֮ ינין שְׁ֫מ֥/וֹ וְ/יִתְבָּ֥רְכוּ ב֑/וֹ כָּל גּוֹיִ֥ם יְאַשְּׁרֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/017.yaml
  text: May his name endure forever[a]; before the sun, may his name continue. May all nations be blessed in him[c][b]; may they call him blessed.
translation:
  language: ta
  text: அவருடைய பெயர் என்றென்றும் நிலைத்திருப்பதாக; சூரியனின் முன்னிலையில் அவருடைய பெயர் தழைத்தோங்குவதாக[a]. எல்லா நாடுகளும் அவரில் ஆசீர்வாதம் பெறுவார்களாக[b]; அவர்கள் அவரைப் பேறுபெற்றவர் என்று அழைப்பார்களாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சூரியன் உள்ளவரை அவருடைய பெயர் தொடர்வதாக.” “தழைத்தோங்குவதாக” என மொழிபெயர்க்கப்பட்ட எபிரெய வினை அரிதானது; அது “தொடர்வதாக,” “பெருகுவதாக,” அல்லது “பரவுவதாக” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எல்லா நாடுகளும் அவரைக் கொண்டு தங்களை ஆசீர்வதித்துக்கொள்வார்களாக.” எபிரெய வினைவடிவைத் தற்சார்பாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי שְׁמוֹ לְעוֹלָם
  choice: அவருடைய பெயர் என்றென்றும் நிலைத்திருப்பதாக
  rationale: வேண்டுதல் பொருளுடைய יְהִי என்பதையும், பெயரின் நீடித்த நிலைப்பைக் குறிக்கும் சூழலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִפְנֵי שֶׁמֶשׁ
  choice: சூரியனுக்கு முன்பாக
  rationale: எபிரெயக் கவிதைப் படிமத்தை நேரடியாகப் பாதுகாக்கிறது; காலநீடிப்பு சார்ந்த பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: ינין
  choice: தழைத்தோங்குவதாக
  rationale: அரிதான இவ்வினைச்சொல் தொடர்தல், பெருகுதல், தழைத்தல் ஆகிய நுண்பொருள்களை உடையது. பெயரை எழுவாயாகக் கொண்ட இச்சூழலில் ‘தழைத்தோங்கு’ அதன் தொடர்ச்சியையும் பெருக்கத்தையும் இயல்பாகத் தாங்குகிறது.
- source_word: וְיִתְבָּרְכוּ בוֹ
  choice: அவரில் ஆசீர்வாதம் பெறுவார்களாக
  rationale: Hitpael வடிவின் நடுநிலை/செயப்பாட்டு சாத்தியத்தை வெளிப்படுத்தி, முற்பிதாக்களின் ஆசீர்வாத வாக்குறுதியுடனான எதிரொலியைப் பாதுகாக்கிறது; தற்சார்பு வாசிப்பு அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: כָּל גּוֹיִם
  choice: எல்லா நாடுகளும்
  rationale: உலகளாவிய அரசச் சூழலில் גּוֹיִם என்பதற்கு இயல்பானதும் பரவலாகப் புரியக்கூடியதுமான மொழிபெயர்ப்பு.
- source_word: יְאַשְּׁרוּהוּ
  choice: அவர்கள் அவரைப் பேறுபெற்றவர் என்று அழைப்பார்களாக
  rationale: ஒருவரைப் பேறுபெற்றவர் அல்லது பாக்கியவான் என அறிவித்தல் என்ற Piel வினையின் பொருளைப் பாலினத் தனிச்சாய்வு குறைவாகவும் கண்ணியமாகவும் தருகிறது.
theological_decisions:
- issue: வசனத்தின் அரச/மேசியா சார்ந்த பரப்பு
  choice: உடனடி அரசக் குறிப்பையும் விரிவான மேசியா எதிரொலியையும் திறந்தவாறு வைத்தல்
  alternative: வரலாற்று அரசனை மட்டும் குறிக்கும் மிகைப்படுத்தப்பட்ட புகழ்ச்சி எனவோ, நேரடியாகவும் பிரத்தியேகமாகவும் மேசியாவை மட்டுமே குறிக்கும் தீர்க்கதரிசனம் எனவோ வெளிப்படையாகத் தீர்மானித்தல்
  rationale: சங்கீதம் 72 அரச சங்கீதமாக இருந்தாலும் அதன் உலகளாவிய மொழி சாதாரண அரசாட்சியைத் தாண்டி ஒலிக்கிறது. ‘அவரில் ஆசீர்வாதம் பெறுவார்களாக’ என்பது ஆபிரகாமிய வாக்குறுதியின் எதிரொலியைத் தக்கவைத்து, உரைக்குள் வெளிப்படையான கிறிஸ்தவ அடையாளத்தைச் சேர்க்காமல் இரு பரப்புகளையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சூரியனுக்கு முன்பாக’ என்ற மூலப் படிமம் பாதுகாக்கப்பட்டு அதன் காலநீடிப்பு பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. வேண்டுதல் வினைமுறை வசனம் முழுவதும் ஒருமையாக வைக்கப்பட்டுள்ளது.
