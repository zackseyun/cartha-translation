source:
  edition: WLC
  text: כִּֽי יַ֭צִּיל אֶבְי֣וֹן מְשַׁוֵּ֑עַ וְ֝/עָנִ֗י וְֽ/אֵין עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/012.yaml
  text: For he delivers the needy when he cries out[a], and the poor who has no helper.
translation:
  language: ta
  text: ஏனெனில், உதவிக்காகக் கூக்குரலிடும் தேவையுள்ளவரையும், உதவி செய்ய யாரும் இல்லாத துன்புறுபவரையும்[a] அவர் விடுவிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துன்புறுபவர்’ (עָנִי) என்பதை ‘வறியவர்’ என்றும் மொழிபெயர்க்கலாம்; இச்சொல் வறுமையையும் துன்புறுத்தப்படுதலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் அரசனைப் பற்றிய புகழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக இங்கு வருகிறது.
- source_word: יַצִּיל
  choice: விடுவிப்பார்
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்து மீட்பதையோ தப்புவிப்பதையோ குறிக்கிறது; குறிப்பாக ஆன்மீக இரட்சிப்பு என்ற பொருளைத் திணிக்காமல் மீட்புச் செயலைத் தெரிவிக்கிறது.
- source_word: אֶבְיוֹן
  choice: ஏழை
  rationale: பொருளாதாரத் தேவையிலும் பிறரது உதவியைச் சார்ந்தும் இருப்பவரைக் குறிக்கிறது; அடுத்துவரும் עָנִי என்பதிலிருந்து வேறுபடுத்த இயல்பான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: מְשַׁוֵּעַ
  choice: உதவிக்காகக் கூக்குரலிடும்
  rationale: שׁוע என்பதிலிருந்து வந்த இப்பெயரெச்சம் உதவி கேட்டு உரக்க முறையிடுவதைச் சுட்டுகிறது; தமிழில் அதன் தொடர்ச்சியான செயற்பண்பையும் நோக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְעָנִי
  choice: ஒடுக்கப்பட்டவரையும்
  rationale: עָנִי என்பது ஏழை, துன்புறுத்தப்பட்டவர், ஒடுக்கப்பட்டவர் எனப் பொருள்படலாம். אֶבְיוֹן உடன் வரும் இணை அமைப்பில் சொல்வேறுபாட்டையும் துன்புறுத்தல் நுணுக்கத்தையும் காக்க ‘ஒடுக்கப்பட்டவர்’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: וְאֵין עֹזֵר לוֹ
  choice: உதவுவார் யாருமில்லாத
  rationale: அந்த நபருக்கு உதவ ஒருவர் கூட இல்லாத கைவிடப்பட்ட நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘அவர்’ என்பதன் சுட்டுப்பொருள்
  choice: ‘அவர்’ என்ற ஒருமைச் சுட்டுப்பெயர் விளக்கமின்றித் தக்கவைக்கப்படுகிறது; சங்கீதத்தின் அரசச் சூழலில் புகழப்படும் அரசரைச் சூழல்படி குறிக்கிறது.
  alternative: பொதுவான நீதியுள்ள ஆட்சியாளர்; அல்லது முன்குறிப்பாகவோ தீர்க்கதரிசன முறையிலோ மேசிய அரசர்.
  rationale: எபிரெய உரையில் மூன்றாம் நபர் ஆண்பால் ஒருமை வினை மட்டுமே உள்ளது. இந்த வசனம் சுட்டப்படுபவரை அரசச் சூழலுக்கு அப்பால் வெளிப்படையாக அடையாளப்படுத்தாததால், மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ அரசருக்குரிய மரியாதை ஒருமையாக அமைந்துள்ளது; மூலத்தில் உள்ள அரச/மேசியச் சுட்டுப்பொருள் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
