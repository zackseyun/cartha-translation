  yaml_path: translation/ot/psalms/072/019.yaml
  text: And blessed be his glorious name forever[a], and may his glory fill the whole earth[b]. Amen and amen.
translation:
  language: ta
  text: அவரது மகிமையான பெயர் என்றென்றும் வாழ்த்தப்படுவதாக[a]; அவரது மகிமை பூமி முழுவதையும் நிரப்புவதாக[b]. ஆமென், ஆமென்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, “அவரது மகிமையின் பெயர்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பூமி முழுவதும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: வாழ்த்தப்படுவதாக
  rationale: துதிப்பாடல் சூழலில் வரும் செயல்பாட்டு ஆசிமொழியின் வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; வெறும் நிகழ்காலக் கூற்றாக மாற்றவில்லை.
- source_word: שֵׁם כְּבוֹדוֹ
  choice: அவருடைய மகிமைமிக்க பெயர்
  rationale: எபிரெயக் கட்டமைப்பு சொற்படியாக ‘அவருடைய மகிமையின் பெயர்’ என்றாலும், பெயர் மகிமையால் சிறப்பிக்கப்படுவதை இயல்பாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: முடிவில்லாத கால நீடிப்பை வழிபாட்டு நடைக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: וְיִמָּלֵא
  choice: நிரப்புவதாக
  rationale: இங்கு வரும் விருப்பம் அல்லது வேண்டுதலைத் தமிழின் ‘-வதாக’ வடிவம் காக்கிறது; தொடர்ந்து வரும் நேரடி செயப்படுபொருளுக்கு ஏற்ப மகிமையே பூமியை நிரப்புகிறது என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: כְבוֹדוֹ
  choice: அவருடைய மகிமை
  rationale: כבוד என்பதன் கனமும் மேன்மையும் வெளிப்படும் துதிப்பாடல் சார்ந்த முதன்மைப் பொருளை ‘மகிமை’ நன்கு தருகிறது.
- source_word: אֶת כֹּל הָאָרֶץ
  choice: பூமி முழுவதையும்
  rationale: כֹּל குறிக்கும் முழுமையையும், இத்துதிப்பாடலின் உலகளாவிய பரப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָמֵן וְאָמֵן
  choice: ஆமென், ஆமென்
  rationale: இருமுறை வரும் வழிபாட்டு உறுதிப்பாட்டை அதன் பரிச்சயமான ஒலிபெயர்ப்பு வடிவத்திலும் வலியுறுத்தலுடனும் காக்கிறது.
theological_decisions:
- issue: הָאָרֶץ என்பதன் பரப்பு
  choice: உலகளாவிய ‘பூமி’
  alternative: குறிப்பிட்ட ‘நாடு’ அல்லது ‘தேசம்’
  rationale: அரசரையும் உலக மக்களையும் உள்ளடக்கும் சங்கீதத்தின் பரந்த சூழலும் இறுதித் துதிப்பாடலும் இங்கு முழுப் பூமியைக் குறிப்பதை ஆதரிக்கின்றன.
- issue: וְיִמָּלֵא என்பதன் வேண்டுதல் சார்ந்த வலிமையும் வாக்கிய அமைப்பும்
  choice: அவருடைய மகிமை பூமியை நிரப்புவதாக
  alternative: பூமி அவருடைய மகிமையால் நிரப்பப்படுவதாக
  rationale: வடிவம் நிரப்பப்படுதலை உணர்த்தக்கூடியதாக இருந்தாலும், אֶת குறியிடும் ‘பூமி முழுவதையும்’ நேரடி செயப்படுபொருளாகக் கொண்ட வாக்கிய அமைப்பு மகிமையைச் செயலின் எழுவாயாக வாசிக்க ஆதரிக்கிறது. இருப்பினும் இரு வாசிப்புகளின் கருத்து நெருக்கமானது.
translation_notes:
  register: நவீன, தரமான, வழிபாட்டுக்கேற்ற கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஸ்தோத்திரிக்கப்படுவதாக’ போன்ற பழமையான சொல்லாட்சிக்குப் பதிலாக ‘வாழ்த்தப்படுவதாக’ தேர்ந்தெடுக்கப்பட்டது; மூலத்தின் இரட்டை ‘ஆமென்’ அப்படியே காக்கப்பட்டுள்ளது.
