source:
  edition: WLC
  text: יְהִ֤י פִסַּת בַּ֨ר בָּ/אָרֶץ֮ בְּ/רֹ֪אשׁ הָ֫רִ֥ים יִרְעַ֣שׁ כַּ/לְּבָנ֣וֹן פִּרְי֑/וֹ וְ/יָצִ֥יצוּ מֵ֝/עִ֗יר כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/016.yaml
  text: May there be an abundance of grain in the land[a]; on the tops of the mountains may its fruit wave like Lebanon; and may people blossom from the city like the grass of the earth.
translation:
  language: ta
  text: நாட்டில் தானியம் ஏராளமாய் இருக்கட்டும்[a]; மலைகளின் உச்சிகளிலும் அதன் விளைச்சல் லெபனோனைப்போல் அசைந்தாடட்டும்; நகரத்திலிருந்து மக்கள் நிலத்தின் புல்லைப்போல் தழைத்தோங்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாட்டில் ஒரு கைப்பிடியளவு தானியம் இருக்கட்டும்.” இதற்கான எபிரெயச் சொற்றொடர் அரிதானது; அது சிறிதளவு தானியம் அசாதாரணமாகப் பெருகுவதையோ, வெறுமனே ஏராளமான தானியத்தையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: இருக்கட்டும்
  rationale: வேண்டுதல் அல்லது வாழ்த்தைக் குறிக்கும் எபிரெய விருப்பவினையின் இயல்பான தமிழ் வடிவம்.
- source_word: פִסַּת בַּר
  choice: தானியம் ஏராளமாய்
  rationale: அரிதான பִסַּת என்ற சொல்லின் பொருள் உறுதியற்றது. சங்கீதத்தின் செழிப்பு உருவகத்துக்கு ஏற்றவாறு முதன்மை உரையில் மிகுதியைக் குறிக்கும் மொழிபெயர்ப்பு தேர்ந்தெடுக்கப்பட்டது; ‘ஒரு கைப்பிடியளவு’ என்ற சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: அரசனின் ஆட்சிக்குட்பட்ட வேளாண் நிலப்பரப்பே இச்சூழலில் முதன்மையாகக் குறிக்கப்படுவதால் ‘பூமியில்’ என்பதற்குப் பதிலாக ‘நாட்டில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בְּרֹאשׁ הָרִים
  choice: மலைகளின் உச்சிகளிலும்
  rationale: மலை உச்சிகள் போன்ற பயிரிடுவதற்கு அரிதான இடங்களில்கூட வளம் நிலவுவதை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது. ‘-இலும்’ என்பது அந்த வலியுறுத்தலைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: יִרְעַשׁ
  choice: அசைந்தாடட்டும்
  rationale: அடிப்படையில் அசைதல் அல்லது அதிர்தலைக் குறிக்கும் வினை. காற்றில் அசையும் செழிப்பான விளைச்சலின் காட்சியை இயல்பான தமிழில் தருகிறது.
- source_word: פִּרְיוֹ
  choice: அதன் விளைச்சல்
  rationale: சொல்லுக்குச் சொல் ‘அதன் கனி’ என்றாலும், தானியத்தைப் பற்றிய வேளாண் சூழலில் ‘விளைச்சல்’ இயல்பாகவும் பரந்த பொருளைத் தக்கவைத்தும் உள்ளது.
- source_word: כַּלְּבָנוֹן
  choice: லெபனோனைப்போல்
  rationale: லெபனோனின் செழுமையையும் கம்பீரத்தையும் விளக்கும் ஒப்பீட்டை விளக்கவுரையாக்காமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: וְיָצִיצוּ מֵעִיר
  choice: நகரத்திலிருந்து மக்கள் … தழைத்தோங்கட்டும்
  rationale: பன்மை வினையின் வெளிப்படையாகக் கூறப்படாத எழுவாய் நகரவாசிகள் எனச் சூழலிலிருந்து புரிகிறது. தமிழில் தெளிவுக்காக ‘மக்கள்’ சேர்க்கப்பட்டு, தாவர வளர்ச்சி உருவகம் ‘தழைத்தோங்கட்டும்’ என்பதில் காக்கப்பட்டது.
- source_word: כְּעֵשֶׂב הָאָרֶץ
  choice: நிலத்தின் புல்லைப்போல்
  rationale: எங்கும் பெருகி வளரும் தாவர வளர்ச்சியின் ஒப்புமையை நெருக்கமாகவும் இயல்பாகவும் அளிக்கிறது.
theological_decisions:
- issue: פִסַּת בַּר என்ற அரிதான சொற்றொடரின் பொருள்
  choice: தானியம் ஏராளமாய்
  alternative: ஒரு கைப்பிடியளவு தானியம்
  rationale: அரசனின் ஆட்சியில் உண்டாகும் பெருவளத்துக்கான வேண்டுதலாக இவ்வசனம் அமைந்துள்ளதாலும், தொடர்ந்து வரும் செழிப்பான விளைச்சல் உருவகத்தாலும் மிகுதியைக் குறிக்கும் வாசிப்பு முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது. சிறிதளவு தானியம் அசாதாரணமாகப் பெருகுவதைச் சுட்டலாம் என்ற உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- issue: וְיָצִיצוּ என்ற பன்மை வினையின் மறைந்த எழுவாய்
  choice: மக்கள்
  alternative: அவர்கள்
  rationale: எபிரெய உரையில் எழுவாய் வெளிப்படையாக இல்லை. ‘நகரத்திலிருந்து’ என்பதால் நகரவாசிகளே இயல்பான மறைந்த எழுவாய்; antecedent இல்லாத ‘அவர்கள்’ என்பதைவிட ‘மக்கள்’ சாதாரண தமிழ் வாசகருக்குத் தெளிவாக உள்ளது. இது தாவர உருவகத்தைத் தீர்க்காமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. வேண்டுதலின் கவிதைநடையை ‘-ட்டும்’ வடிவங்கள் காக்கின்றன; ‘அசைந்தாடட்டும்’, ‘தழைத்தோங்கட்டும்’ என்பவை மூலத்தின் உயிருள்ள வேளாண் உருவகங்களை இயல்பாக எடுத்துரைக்கின்றன.
