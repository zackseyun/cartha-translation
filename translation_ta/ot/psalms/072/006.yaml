  yaml_path: translation/ot/psalms/072/006.yaml
  text: May he come down like rain on mown grass[c][b][a], like showers that water the earth.
translation:
  language: ta
  text: அறுக்கப்பட்ட புல்லின்மேல் பெய்யும் மழையைப்போலவும், நிலத்தை நனைக்கும் மழைத்தாரைகளைப்போலவும் அவர் இறங்கி வருவாராக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் அறுக்கப்பட்ட புல்லின்மேல் பெய்யும் மழையைப்போலவும், நிலத்தை நனைக்கும் மழைத்தாரைகளைப்போலவும் இறங்கி வருவார்.’ எபிரெய நிறைவுறா வினையை இச்சூழலில் வேண்டுதலாகவோ எதிர்கால விவரிப்பாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרֵד
  choice: அவர் இறங்கி வருவாராக
  rationale: ירד என்பதன் கீழ்நோக்கிய இயக்கத்தைத் தக்கவைத்தபடி, அரசருக்கான வேண்டுதல்/ஆசீர்வாதச் சூழலில் எபிரெய நிறைவுறா வினையின் விருப்பப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּמָטָר
  choice: மழையைப்போல
  rationale: כ ஒப்புமைக் குறியையும் מָטָר என்பதன் நேரடியான பொருளையும் சுருக்கமாகத் தருகிறது.
- source_word: עַל
  choice: மீது
  rationale: மழை புல்லின்மேல் பெய்யும் படிமத்திற்கு இயல்பான தமிழ் இடச்சொல்.
- source_word: גֵּז
  choice: வெட்டப்பட்ட புல்
  rationale: இந்தச் சொல் வெட்டப்பட்ட அல்லது கத்தரிக்கப்பட்ட ஒன்றைக் குறிக்கலாம். மழை, நிலம் ஆகிய வேளாண்மைப் படிமங்களுடன் ‘வெட்டப்பட்ட புல்’ பொருத்தமாக உள்ளது; ‘கத்தரிக்கப்பட்ட கம்பளி’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כִּרְבִיבִים
  choice: மழைத்தாரைகளைப்போல
  rationale: רְבִיבִים என்பது பொழியும் மழைத் தாரைகளைக் குறிக்கிறது; முதல் அடியின் மழை ஒப்புமையுடன் இணையான கவிதை அமைப்பைத் தக்கவைக்கிறது.
- source_word: זַרְזִיף
  choice: நனைக்கும்
  rationale: சொட்டுதல் அல்லது பொழிதல் சார்ந்த இந்த அரிய வடிவத்தின் செயல்பாட்டை இயல்பான தமிழ் வினையெச்சப் பொருளில் தருகிறது; மழைத்தாரைகள் நிலத்தின்மேல் பொழிந்து அதை நனைக்கும் படிமம் வெளிப்படுகிறது.
- source_word: אָרֶץ
  choice: நிலம்
  rationale: אָרֶץ என்பதற்கு பூமி, நாடு, நிலம் ஆகிய பொருள்கள் உண்டு. இங்கு மழை விழும் தரையைக் குறிக்கும் கவிதைப் படிமத்தில் ‘நிலம்’ இயல்பாக உள்ளது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: அரசருக்கான வேண்டுதல் சங்கீதத்தில் יֵרֵד என்ற நிறைவுறா வினையின் வலிமை
  choice: 'விருப்பம்/வேண்டுதல்: ‘அவர் இறங்கி வருவாராக’'
  alternative: 'எதிர்கால விவரிப்பு: ‘அவர் இறங்கி வருவார்’'
  rationale: சங்கீதம் 72 அரசருக்கான வேண்டுதல்களையும் ஆசீர்வாத மொழியையும் கொண்டிருப்பதால், இங்கு விருப்பப் பொருள் இயல்பானது. அதேவேளையில், எபிரெய வடிவம் எதிர்கால விவரிப்பாகவும் புரிந்துகொள்ளப்படலாம் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அருகான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இணையான இரு ஒப்புமைகளையும் தெளிவாக்க இரண்டாம் அடியில் ‘வருவாராக’ மீண்டும் சேர்க்கப்பட்டுள்ளது; இது எபிரெயக் கவிதையின் பொருளை மாற்றாமல் தமிழில் முழுமையான ஓசையையும் வாக்கிய அமைப்பையும் தருகிறது.
