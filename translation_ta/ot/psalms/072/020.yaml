lexical_decisions:
- source_word: כָּלּוּ
  choice: முடிவுற்றன
  rationale: כלה என்பதன் புவால் நிறைவுநிலை மூன்றாம் நபர் பன்மை வடிவம்; இலக்கண எழுவாயான ‘விண்ணப்பங்கள்’ முடிந்துவிட்டன என்ற நிறைவுப்பொருளை இயல்பாகத் தருகிறது.
- source_word: תְפִלּוֹת
  choice: விண்ணப்பங்கள்
  rationale: תְּפִלָּה என்பதன் பன்மை. இங்கு தேவனை நோக்கிய வேண்டுதல்களைக் குறிக்கும்; ‘விண்ணப்பங்கள்’ என்பது சங்கீத மொழிநடைக்குப் பொருத்தமான, இன்றைய வாசகருக்கும் தெளிவான சொல்.
- source_word: דָּוִד
  choice: தாவீது
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்ற பெயர்வடிவம்.
- source_word: בֶּן יִשָׁי
  choice: ஈசாயின் மகனான
  rationale: தாவீதை அவரது தந்தைவழி அடையாளப்படுத்தும் எபிரெயக் கட்டுநிலைத்தொடரை இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: இந்த வசனம் சங்கீதத்தின் நேரடி விண்ணப்பத்தின் பகுதியா அல்லது தொகுப்பை முடிக்கும் குறிப்பா
  choice: தாவீதின் விண்ணப்பங்கள் முடிந்ததைத் தெரிவிக்கும் நேரடியான கூற்றாக மொழிபெயர்த்தல்
  alternative: பிற்காலத் தொகுப்பாசிரியரின் முடிவுக்குறிப்பு என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: எபிரெய உரை ஒரு எளிய அறிவிப்பை மட்டுமே தருகிறது; அதன் தொகுப்பு வரலாற்றைத் தீர்மானிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த வரலாற்றைப் பற்றி கூடுதல் முடிவைச் சேர்க்காமல் உரையின் நேர்ப்பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழ்; சுருக்கமான, கண்ணியமான சங்கீத முடிவுக்குறிப்பு நடை. ‘ஜெபங்கள்’ என்பதற்குப் பதிலாகத் தூயவும் பரவலாகப் புரிந்துகொள்ளத்தக்கதுமான ‘விண்ணப்பங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
