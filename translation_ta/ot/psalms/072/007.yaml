  text: יִֽפְרַח בְּ/יָמָ֥י/ו צַדִּ֑יק וְ/רֹ֥ב שָׁ֝ל֗וֹם עַד בְּלִ֥י יָרֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/007.yaml
  text: In his days the righteous will flourish[d][c][b][a], and there will be an abundance of peace until the moon is no more.
translation:
  language: ta
  text: அவருடைய நாட்களில் நீதிமான்கள் தழைத்தோங்குவார்கள்[a]; நிலா இல்லாமல் போகும்வரை சமாதானம் மிகுந்திருக்கும்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீதிமான் தழைத்தோங்குவான்.” இது நீதியுள்ள மக்களை ஒட்டுமொத்தமாகக் குறிக்காமல், அரசரையே அல்லது நீதியுள்ள ஒருவரையே குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: “சமாதானம்” என்பதற்கான எபிரெயச் சொல் நல்வாழ்வு, முழுமை, செழிப்பு ஆகிய பொருள்களையும் தாங்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “நிலா இல்லாதவரை.” இது நீடித்து நிலைக்கும் காலத்தைக் குறிக்கும் கவித்துவமான சொற்றொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרַח
  choice: தழைத்தோங்குவார்கள்
  rationale: פרח என்பதன் அடிப்படைப் படிமம் துளிர்த்தல் அல்லது மலர்தல்; நீதிமான்களின் செழிப்பைக் குறிக்கும் உருவகத்தை இயல்பான தமிழில் “தழைத்தோங்குவார்கள்” தக்கவைக்கிறது.
- source_word: בְּיָמָיו
  choice: அவருடைய நாட்களில்
  rationale: எபிரெய மொழியின் “அவருடைய நாட்களில்” என்ற காலக்குறிப்பை நெருக்கமாகத் தக்கவைத்து, சூழலில் அரசரின் ஆட்சிக்காலத்தைக் குறிக்கிறது.
- source_word: צַדִּיק
  choice: நீதிமான்கள்
  rationale: வடிவில் ஒருமையாக இருந்தாலும், பெயர்ச்சொல்லாகப் பயன்படும் இந்தச் சொல் நீதியுள்ள மக்களை ஒட்டுமொத்தமாகக் குறிக்கலாம். தமிழில் அந்தக் கூட்டுப்பொருளைத் தெளிவாகக் காட்ட பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְרֹב שָׁלוֹם
  choice: சமாதானம் மிகுந்திருக்கும்
  rationale: רֹב குறிக்கும் மிகுதி அல்லது ஏராளத்தை இயல்பான தமிழ் வாக்கியமாக வெளிப்படுத்துகிறது; எபிரெய மொழியில் வெளிப்படையாக இல்லாத ‘இருக்கும்’ என்பது பொருளில் உள்ளதாகக் கொள்ளப்பட்ட வினை.
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: இங்கு அரசாட்சியின் கீழ் நிலவும் அமைதியை நேரடியாகக் குறிக்கும் வழக்கமான தமிழ் சொல்; நல்வாழ்வு, முழுமை, செழிப்பு ஆகிய விரிவான பொருள் நிழல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: עַד בְּלִי יָרֵחַ
  choice: நிலா இல்லாமற்போகும்வரை
  rationale: “நிலா இல்லாதவரை” என்ற எபிரெயக் கவிப்படிமத்தை இயல்பான தமிழில் நெருக்கமாகத் தக்கவைத்து, நீடித்த காலத்தையும் உணர்த்துகிறது.
theological_decisions:
- issue: அரசரைப் பற்றிய சங்கீதத்தில் צַדִּיק என்பதன் வரம்பு
  choice: நீதியுள்ள மக்களைக் கூட்டாகக் குறிக்கும் “நீதிமான்கள்”
  alternative: அரசரையோ இலட்சிய ஆட்சியாளரையோ குறிக்கும் ஒருமை “நீதிமான்”
  rationale: ஒருமை வடிவம் கூட்டுப்பொருளில் வரக்கூடும்; அரசருடைய காலத்தில் பரவலான சமாதானம் நிலவும் என்ற இணைவரி, நீதியுள்ள மக்கள் பொதுவாகத் தழைப்பதற்கு ஆதரவாக உள்ளது. ஆயினும் ஒருமை வாசிப்பை வசனம் முற்றிலும் விலக்காததால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிநடை பயன்படுத்தப்பட்டுள்ளது. “தழைத்தோங்குதல்” மூலத்தின் தாவர உருவகத்தையும், “நிலா இல்லாமற்போகும்வரை” அதன் நீடித்த காலக் கவிப்படிமத்தையும் பாதுகாக்கின்றன. அரசரைச் சுட்டும் மரியாதைப் பன்மை “அவர்” தமிழ் நடைக்கு இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
