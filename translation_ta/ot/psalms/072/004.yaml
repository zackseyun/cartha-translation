source:
  edition: WLC
  text: יִשְׁפֹּ֤ט עֲֽנִיֵּי עָ֗ם י֭וֹשִׁיעַ לִ/בְנֵ֣י אֶבְי֑וֹן וִֽ/ידַכֵּ֣א עוֹשֵֽׁק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/004.yaml
  text: May he judge the poor of the people[a], save the children of the needy, and crush the oppressor.
translation:
  language: ta
  text: அவர் மக்களின் ஏழைகளுக்கு நியாயம் வழங்குவாராக[a]; வறியவர்களின் பிள்ளைகளை மீட்பாராக; ஒடுக்குபவனை நொறுக்குவாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் மக்களின் ஏழைகளுக்கு நியாயம் வழங்குவார்; வறியவர்களின் பிள்ளைகளை மீட்பார்; ஒடுக்குபவனை நொறுக்குவார்.” இச்சூழலில் எபிரெய நிறைவுறா வினைகள் எதிர்காலக் கூற்றாகவோ, வேண்டுதல் அல்லது விருப்பமாகவோ வாசிக்கப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: நீதி வழங்குவாராக
  rationale: שׁפט என்பதன் அடிப்படை நீதித்தீர்ப்பு சார்ந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. சங்கீதத்தின் வேண்டுதல் சூழலில் எபிரெய நிறைவுறா வினையின் விருப்பப் பொருளை ‘-வாராக’ காட்டுகிறது.
- source_word: עֲנִיֵּי עָם
  choice: மக்களிலுள்ள ஏழைகள்
  rationale: עֲנִיִּים என்பதில் இங்கு வறுமை மற்றும் ஒடுக்கப்பட்ட நிலை முன்னிலையாகிறது. எபிரெய கட்டமைப்பின் தொடர்பை இயல்பான தமிழில் ‘மக்களிலுள்ள’ என வழங்குகிறது.
- source_word: יוֹשִׁיעַ
  choice: மீட்டு
  rationale: ישׁע என்பதன் Hiphil வடிவம் ஆபத்திலிருந்து காப்பாற்றுதல் அல்லது விடுவித்தல் என்ற வலுவான பொருளைக் கொண்டது; ‘மீட்டு’ இச்சூழலில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: לִבְנֵי אֶבְיוֹן
  choice: வறியவர்களின் பிள்ளைகளை
  rationale: בני என்பது கூட்டாகப் பிள்ளைகளைக் குறிக்கிறது; ஆண்களுக்கு மட்டும் வரையறுக்கப்படவில்லை. אֶבְיוֹן என்பதற்கு ‘வறியவர்’ எனத் தேர்ந்தெடுத்து, முந்தைய இணைச் சொல்லுடன் பொருள் ஒற்றுமையைத் தக்கவைக்கிறது.
- source_word: וִידַכֵּא
  choice: நொறுக்குவாராக
  rationale: דכא இங்கு நசுக்குதல் அல்லது முறியடித்தல் என்ற வலுவான பொருளைத் தருகிறது. அநீதியைச் செய்பவனுக்கு எதிரான அரச நீதியின் தீவிரத்தை ‘நொறுக்கு’ பாதுகாக்கிறது.
- source_word: עוֹשֵׁק
  choice: ஒடுக்குகிறவன்
  rationale: עשׁק என்பதன் பங்கேற்பு வடிவம் பிறரைத் தொடர்ந்து ஒடுக்கி அல்லது சுரண்டிச் செயல்படுபவனைக் குறிக்கிறது. ‘ஒடுக்குகிறவன்’ தெளிவான, தற்போதைய தமிழ்ப் பயன்பாடு.
theological_decisions:
- issue: வசனம் முழுவதிலுமுள்ள வினைகளின் பாங்கு
  choice: வேண்டுதல்/விருப்பப் பாங்கு (‘-வாராக’)
  alternative: எளிய எதிர்காலம் (‘அவர் ... வழங்குவார்; ... மீட்பார்; ... நொறுக்குவார்’)
  rationale: சங்கீதம் 72 அரசனுக்கான மன்றாட்டாக அமைந்துள்ளதால், நிறைவுறா வினைகளை வேண்டுதலாக வாசிப்பது சூழலுக்கு ஏற்றது. அதேவேளை, அவை எதிர்காலக் கூற்றாகவும் வாசிக்கப்படலாம் என்பதால் அந்த உண்மையான இருமையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. நீதித்தீர்ப்பு, மீட்பு, ஒடுக்குபவனை முறியடித்தல் ஆகிய கவிதை இணைநிலைகள் தக்கவைக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறி முதன்மை உரையில் சேர்க்கப்பட்டுள்ளது.
