revisions:
- from: அவர் ஒரு கடலிலிருந்து மறு கடல்வரை ஆட்சி செய்வாராக[a]; அந்த நதியிலிருந்து[b] பூமியின் கடையெல்லைகள் வரை ஆட்சி செய்வாராக.
  to: அவர் கடலிலிருந்து கடல்வரை, அந்த நதியிலிருந்து பூமியின் கடையெல்லைகள் வரை ஆட்சி செய்வாராக[a][b].
  rationale: The revision removes the added ‘ஒரு’ and replaces the less natural ‘மறு கடல்’ with ‘கடலிலிருந்து கடல்வரை,’ preserving the Hebrew repetition and its poetic breadth without identifying particular seas. It retains the jussive prayer in the main text and the predictive reading in the footnote. The River remains unnamed in the text, while the cultural note cautiously gives the likely identification.
