  text: וְ֭/יֵרְדְּ מִ/יָּ֣ם עַד יָ֑ם וּ֝/מִ/נָּהָ֗ר עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/008.yaml
  text: May he rule from sea to sea[b][a], and from the River to the ends of the earth.
translation:
  language: ta
  text: அவர் கடலிலிருந்து கடல்வரை, அந்த நதியிலிருந்து பூமியின் கடையெல்லைகள் வரை ஆட்சி செய்வாராக[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் கடலிலிருந்து கடல்வரை, அந்த நதியிலிருந்து பூமியின் கடையெல்லைகள் வரை ஆட்சி செய்வார்.”
    reason: alternative_reading
  - marker: b
    text: “அந்த நதி” என்பது வேதாகமப் புவியியலில் ஒரு நிலையான எல்லையாகக் குறிப்பிடப்படும் யூபிராத்து நதியைக் குறிக்கலாம்.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: ஆட்சி செய்வாராக
  rationale: רדה என்பதன் பொருள் ‘ஆட்சி செய்/ஆதிக்கம் செலுத்து’. அரசனைப் பற்றிய வேண்டுதல் சூழலில், இங்குள்ள யுஸ்ஸிவ் நுணுக்கத்தை இயல்பான நவீனத் தமிழில் ‘ஆட்சி செய்வாராக’ வெளிப்படுத்துகிறது.
- source_word: מִיָּם ... עַד יָם
  choice: ஒரு கடலிலிருந்து மறு கடல்வரை
  rationale: ஆட்சியின் பரந்த எல்லையைக் குறிக்கும் கவிதைநயமுள்ள சொற்றொடர். எந்தக் கடல்கள் என்பதைத் தேவையின்றி வரையறுக்காமல் எபிரெய இணைநிலையையும் புவியியல் விரிவையும் காக்கிறது.
- source_word: וּמִנָּהָר
  choice: அந்த நதியிலிருந்து
  rationale: எபிரெயத்தில் குறிப்பிட்ட நதியைக் குறிக்கும் இச்சொல் வேதாகமப் புவியியலில் பெரும்பாலும் யூபிராத்து நதியைக் சுட்டுகிறது. ஆயினும் மூலத்தில் பெயர் வெளிப்படையாக இல்லாததால், முதன்மை உரையில் அதைச் சேர்க்காமல் ‘அந்த நதி’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: பூமியின் கடையெல்லைகள் வரை
  rationale: אַפְסֵי என்பது எல்லைப்புறங்கள் அல்லது கடைமுனைகளைக் குறிக்கிறது. ‘பூமியின் கடையெல்லைகள்’ என்பது மூலத்தின் உலகளாவிய புவியியல் விரிவைத் தெளிவாகவும் கவிதைநயத்துடனும் தருகிறது.
theological_decisions:
- issue: அரச சங்கீதத்தில் imperfect/jussive வினையின் வலிமை
  choice: 'வேண்டுதலாக: ‘ஆட்சி செய்வாராக’'
  alternative: 'முன்னறிவிப்பு அல்லது உறுதிக் கூற்றாக: ‘அவர் ஆட்சி செய்வார்’'
  rationale: சுற்றியுள்ள அரசருக்கான மன்றாட்டுச் சூழல் யுஸ்ஸிவ் வாசிப்பை ஆதரிக்கிறது. அதேவேளையில், வடிவம் எதிர்கால முன்னறிவிப்பாகவும் வாசிக்கப்படலாம்; அந்த உண்மையான இருமையை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘செய்வாராக’ வேண்டுதல் தொனியைக் காக்கிறது; மாற்று முன்னறிவிப்பு வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
