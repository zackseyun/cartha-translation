base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/015.yaml
  text: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
translation:
  language: ta
  text: 'அவர் வாழட்டும்!


    சேபாவிலிருந்து தங்கம் அவருக்குக் கொடுக்கப்படட்டும்.[a]


    அவருக்காக எப்போதும் மன்றாடட்டும்;[b]


    நாள் முழுவதும் அவரை வாழ்த்தட்டும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்கு நெருக்கமாக: “ஒருவன் அவருக்குச் சேபாவின் தங்கத்தைக் கொடுக்கட்டும்.” எபிரெயத்தில் வினை செய்வினை வடிவில் உள்ளது; ஆனால் செய்பவர் யார் என்பது குறிப்பிடப்படவில்லை.'
    reason: lexical_alternative
  - marker: b
    text: “ஒருவன் அவருக்காக மன்றாடட்டும்” அல்லது “அவர்கள் அவருக்காக மன்றாடட்டும்” என்றும் பொருள் கொள்ளலாம். எபிரெயம் எழுவாயை வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: அவர் வாழட்டும்
  rationale: חיה என்பதன் Qal விருப்பவினை வடிவம் வாழ்வு குறித்த வேண்டுதலை வெளிப்படுத்துகிறது. “வாழட்டும்” அதன் விருப்ப/ஆசீர்வாதத் தொனியை இயல்பான தமிழில் தக்கவைக்கிறது; எளிய எதிர்காலமாக மாற்றவில்லை.
- source_word: וְיִתֶּן לוֹ
  choice: அவருக்குக் கொடுக்கப்படட்டும்
  rationale: எபிரெய வினை செயப்பாட்டு வடிவில் இருந்தாலும், செய்பவர் குறிப்பிடப்படவில்லை. தமிழில் செயப்படுவினை அமைப்பு, யார் கொடுக்கிறார் என்று சேர்க்காமல் காணிக்கை அரசருக்குக் கிடைக்க வேண்டும் என்ற பொருளை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִזְּהַב שְׁבָא
  choice: சேபாவிலிருந்து தங்கம்
  rationale: מן இங்கு மூல இடத்தையோ அங்கிருந்து வரும் பொருளையோ குறிக்கிறது. “சேபாவிலிருந்து தங்கம்” புவியியல் தொடர்பையும் காணிக்கையின் தன்மையையும் தெளிவாகக் காக்கிறது.
- source_word: וְיִתְפַּלֵּל בַּעֲדוֹ
  choice: அவருக்காக ... மன்றாடட்டும்
  rationale: פלל என்பதன் Hitpael வடிவமும் בעד என்பதும் ஒருவருக்காக வேண்டுதல் செய்வதைக் குறிக்கின்றன. எழுவாய் குறிப்பிடப்படாத ஒருமை வினையைத் தமிழ் இயல்பாக எழுவாய் இல்லாமலேயே வெளிப்படுத்த முடிவதால், “மன்றாடட்டும்” என்ற வடிவம் அந்தத் தெளிவின்மையைக் காக்கிறது.
- source_word: תָמִיד
  choice: எப்போதும்
  rationale: தொடர்ந்த அல்லது தவறாத நிகழ்வைச் சுட்டும் சொல்லுக்கு, உயர்வான கவிதை நடையையும் பொதுவான புரிதலையும் இணைக்கும் இயல்பான தமிழ் இணை இது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: முழு நாளையும் குறிக்கும் எபிரெய காலச் சொற்றொடரின் இயல்பான நவீனத் தமிழ் வடிவம்.
- source_word: יְבָרֲכֶנְהוּ
  choice: அவரை வாழ்த்தட்டும்
  rationale: ברך என்பதன் Piel விருப்பவினை வடிவம் இங்கு அரசரைப் புகழ்ந்து நல்வாழ்த்து கூறுவதைக் குறிக்கலாம். “வாழ்த்தட்டும்” மனிதர்கள் அரசரிடம் செய்வதைக் காட்டும் இயல்பான சொல்; எழுவாயைக் குறிப்பிடாமல் மூலத்தின் அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: சங்கீதம் 72-இன் அரசருக்கான வேண்டுதல்கள் யாரைக் குறிக்கின்றன?
  choice: வசனத்தைத் தாவீதிய அரசருக்கான வாழ்த்தும் வேண்டுதலுமாக மொழிபெயர்த்து, மொழிபெயர்ப்பிலேயே வெளிப்படையான மேசியா அடையாளத்தைச் சேர்க்கவில்லை.
  alternative: இதை நேரடியாக மேசியாவைப் பற்றிய தீர்க்கதரிசனமாக மொழிபெயர்த்தல்.
  rationale: சங்கீதத்தின் உடனடி அரசச் சூழலை எபிரெய உரை ஆதரிக்கிறது; அதேவேளை அதன் விரிவான மேசியா சார்ந்த வாசிப்பையும் மொழிபெயர்ப்பு மறுப்பதில்லை. ஆகவே விளக்கத்தை உரைக்குள் திணிக்காமல் இறையியல் நெருக்கடியும் விரிவும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கவிதைக்குரிய கண்ணியமும் இணைந்த நடை பயன்படுத்தப்பட்டது. அரசரைக் குறிக்கும் ஒருமை ஆண்பால் பின்னொட்டுகளுக்கு மரியாதை ஒருமையான “அவர்/அவரை” பயன்படுத்தப்பட்டது. எழுவாய் குறிப்பிடப்படாத எபிரெய வினைகள், தமிழ் மொழியின் இயல்பான எழுவாய்-விடுபாட்டு வசதியால் முடிந்தவரை தெளிவுபடுத்தப்படாமல் வைக்கப்பட்டன.
