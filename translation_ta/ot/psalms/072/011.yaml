source:
  edition: WLC
  text: וְ/יִשְׁתַּחֲווּ ל֥/וֹ כָל מְלָכִ֑ים כָּל גּוֹיִ֥ם יַֽעַבְדֽוּ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/011.yaml
  text: May all kings bow down before him[a]; may all nations serve him.
translation:
  language: ta
  text: அரசர்கள் அனைவரும் அவர் முன் பணிந்து வணங்குவார்களாக[a]; நாடுகள் அனைத்தும் அவருக்குப் பணிபுரிவார்களாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரை வழிபடுவார்களாக’ என்றும் மொழிபெயர்க்கலாம்; ‘பணிந்து வணங்குதல்’ மற்றும் ‘பணிபுரிதல்’ என்பதற்கான எபிரெய வினைகள் அரசருக்குச் செலுத்தும் மரியாதையையும், சூழலைப் பொறுத்து, சமய வழிபாட்டையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁתַּחֲווּ
  choice: பணிந்து வணங்குவார்களாக
  rationale: שׁחה என்பதன் உடல்சார்ந்த குனிந்து வணங்குதல் மற்றும் அரசருக்குச் செலுத்தும் மரியாதை ஆகிய இரு நுட்பங்களையும் இயல்பான தமிழில் தக்கவைக்கிறது. சூழலில் உள்ள விருப்ப/வேண்டுதல் பொருளை ‘-வார்களாக’ வெளிப்படுத்துகிறது.
- source_word: לוֹ
  choice: அவர்முன்
  rationale: இந்த வினையுடன் வரும் ל־, வணக்கம் யாரை நோக்கிச் செலுத்தப்படுகிறது என்பதைக் குறிக்கிறது; ‘அவர்முன்’ என்பது தமிழில் இயல்பான இணைவு.
- source_word: כָל מְלָכִים
  choice: அரசர்கள் அனைவரும்
  rationale: அரசர்கள் யாவரையும் உள்ளடக்கும் மூலத்தின் முழுமையான பரப்பைத் தெளிவாகக் காக்கிறது.
- source_word: כָל גּוֹיִם
  choice: நாடுகள் அனைத்தும்
  rationale: גּוֹיִם இங்கு உலக நாடுகளைப் பரவலாகக் குறிக்கிறது; இணைவரியில் உள்ள ‘அரசர்கள் அனைவரும்’ என்பதற்கு ஏற்ற இணையாக அமைகிறது.
- source_word: יַעַבְדוּהוּ
  choice: அவருக்குப் பணிபுரிவார்களாக
  rationale: עבד என்பதன் அடிப்படைப் பொருளான சேவை செய்தலைக் காக்கிறது; அதேவேளையில் அரசியல் பணிவிடையும் சமய வழிபாடும் ஆகிய சாத்தியமான பொருள் நிழல்களைத் தேவையின்றி ஒன்றாக மட்டுப்படுத்தவில்லை.
theological_decisions:
- issue: அரசருக்குச் செலுத்தப்படுவது வெளிப்படையாக ‘வழிபாடு’ என்று மொழிபெயர்க்கப்பட வேண்டுமா?
  choice: ‘பணிந்து வணங்குதல்’, ‘பணிபுரிதல்’ என்ற விரிவான மரியாதை/சேவை மொழியைத் தக்கவைத்தல்
  alternative: ஒன்று அல்லது இரண்டு வினைகளையும் ‘வழிபடுதல்’ என்று மொழிபெயர்த்தல்
  rationale: இது அரசரைப் பற்றிய சங்கீதம்; எபிரெய வினைகள் அரச மரியாதையையும் சமய வழிபாட்டையும் குறிக்கக்கூடும். ‘வழிபாடு’ என்று மட்டும் மொழிபெயர்ப்பது மூலத்தில் நிலவும் அரசியல்-இறையியல் பொருள் அழுத்தத்தை முன்கூட்டியே தீர்த்துவிடும்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ‘-வார்களாக’ வடிவம் கவிதைச் சூழலுக்கேற்ற விருப்பத்தையும் வேண்டுதலையும் வெளிப்படுத்துகிறது; சாதாரண வாசகர்களுக்கும் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
