  yaml_path: translation/ot/psalms/072/014.yaml
  text: From oppression and violence he will redeem their life[b][a], and their blood will be precious in his eyes.
translation:
  language: ta
  text: ஒடுக்குமுறையிலிருந்தும் வன்முறையிலிருந்தும் அவர்களுடைய உயிரை[a] அவர்[b] மீட்பார்; அவர்களுடைய இரத்தம் அவருடைய பார்வையில் மதிப்புமிக்கதாக இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுடைய ஆத்துமாவை’ அல்லது ‘அவர்களுடைய உயிர்களை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லான நெஃபெஷ் சூழலுக்கேற்ப உயிர், ஆத்துமா, தானே, அல்லது நபர் எனப் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்/அவருடைய’ என்ற ஒருமை வடிவம் இச்சங்கீதத்தின் அரசனை மிக இயல்பாகத் தொடர்கிறது; எனினும், இம்மொழி ஒடுக்கப்பட்டோரை மீட்கும் கடவுளுடைய அக்கறையையும் எதிரொலிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: מִתּוֹךְ
  choice: ஒடுக்குமுறையிலிருந்து
  rationale: מִתּוֹךְ என்பதன் சொற்பொருள் ‘நடுவிலிருந்து’; இங்கு ஒடுக்குமுறையின் பிடியிலிருந்து விடுவிப்பதை இயல்பான தமிழில் ‘ஒடுக்குமுறையிலிருந்து’ எனத் தருகிறது.
- source_word: וּמֵחָמָס
  choice: வன்முறையிலிருந்தும்
  rationale: חָמָס என்பது வன்முறை, கொடுமை, அநியாயச் செயல் ஆகிய பொருள்களைக் கொண்டது; பாதிக்கப்படுவோரைக் குறிக்கும் இச்சூழலில் ‘வன்முறை’ நேரடியானதும் இயல்பானதும்.
- source_word: יִגְאַל
  choice: அவர் மீட்பார்
  rationale: גאל என்பது உரிமையுடன் மீட்டல் அல்லது விடுவித்தல் என்ற சட்ட மற்றும் உறவுசார் நுண்ணொலியைக் கொண்டுள்ளது; ‘மீட்பார்’ அந்தச் செறிவைத் தக்கவைக்கிறது.
- source_word: נַפְשָׁם
  choice: அவர்களுடைய உயிரை
  rationale: נֶפֶשׁ இங்கு பிரிந்திருக்கும் ஆத்துமாவை அவசியமாகக் குறிக்காமல் உயிர், நபர், தம்மையே குறிக்கலாம். எபிரெய ஒட்டுமொத்த ஒருமை வடிவை ‘உயிரை’ தக்கவைக்கிறது.
- source_word: וְיֵיקַר
  choice: அருமையானதாக இருக்கும்
  rationale: יקר என்பது மதிப்புமிக்கதாக, அருமையானதாக இருப்பதைக் குறிக்கிறது; ‘அருமையானதாக இருக்கும்’ அவர்களின் இரத்தம் அற்பமாகக் கருதப்படாது என்ற கருத்தை வெளிப்படுத்துகிறது.
- source_word: דָּמָם
  choice: அவர்களுடைய இரத்தம்
  rationale: דָּם என்பதன் தெளிவான இரத்தப் படிமத்தை விளக்கவுரையின்றி நேரடியாகத் தக்கவைக்கிறது.
- source_word: בְּעֵינָיו
  choice: அவருடைய பார்வையில்
  rationale: சொற்படியாக ‘அவருடைய கண்களில்’ என்ற எபிரெய மரபுத்தொடர் மதிப்பீடு அல்லது கருதுதலைக் குறிக்கிறது; நவீனத் தமிழில் ‘அவருடைய பார்வையில்’ இயல்பாக அதையே தெரிவிக்கிறது.
theological_decisions:
- issue: ஒருமை ஆண்பால் வினை மற்றும் பதிலிப்பெயரின் சுட்டுப்பொருள்
  choice: ‘அவர்/அவருடைய’ என்பது சங்கீதத்தின் உடனடிச் சூழலில் அரசனை இயல்பாகத் தொடருமாறு விடப்பட்டுள்ளது.
  alternative: மீட்டு, ஒடுக்கப்பட்டோரின் இரத்தத்தை மதிப்பவர் நேரடியாகக் கடவுள் என வாசித்தல்.
  rationale: எபிரெய ஒருமை வடிவங்கள் சங்கீதம் 72-இன் அரசனைத் தொடர்கின்றன; அதேவேளை இச்செயல்கள் ஒடுக்கப்பட்டோர்மீது கடவுள் காட்டும் மீட்புக் கவனத்தையும் எதிரொலிக்கின்றன. மொழிபெயர்ப்பு இந்த இறையியல் நெருக்கத்தைத் தீர்த்துவிடாமல் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதில் புரியும், கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மீட்பார்’, ‘இரத்தம்’, ‘அருமையானதாக’ ஆகிய சொற்கள் எபிரெயத்தின் சட்ட-உறவுசார் மீட்பு, தெளிவான இரத்தப் படிமம், உயர்ந்த மதிப்பு ஆகியவற்றைத் தக்கவைக்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
