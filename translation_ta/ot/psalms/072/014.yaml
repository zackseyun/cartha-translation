  terminology: ‘மீட்பார்’ suitably preserves the marked sense of גאל. ‘உயிரை’ appropriately avoids imposing an immaterial-soul meaning on נֶפֶשׁ. ‘மதிப்புமிக்கதாக’ is a more natural modern Tamil equivalent for the evaluative force of יקר than ‘அருமையானதாக’.
