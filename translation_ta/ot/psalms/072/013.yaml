base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/013.yaml
  text: He will have compassion on the poor and needy[a], and he will save the lives of the needy.
translation:
  language: ta
  text: ஏழைக்கும் வறியவருக்கும் அவர் இரக்கம் கொள்வார்; வறியவர்களின் உயிர்களை[a] காப்பாற்றுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயிர்கள்’ என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல், சூழலுக்கேற்ப ‘உயிர்,’ ‘தான்,’ ‘நபர்,’ அல்லது ‘ஆத்துமா’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֹס
  choice: இரங்குவார்
  rationale: חוס என்ற வினை இச்சூழலில் ஆதரவற்றோர்மீது இரக்கம்கொள்வதைக் குறிக்கிறது. ‘இரங்குவார்’ என்பது இயல்பான, சுருக்கமான தமிழாக்கம்; ‘தப்பவிடுவார்’ என்ற சாத்தியமான பொருள் இங்கு குறைவாகப் பொருந்துகிறது.
- source_word: דַּל
  choice: ஏழை
  rationale: דַּל என்பது ஏழ்மை, பலவீனம், சமூகத் தாழ்நிலை ஆகியவற்றில் உள்ளவரைக் குறிக்கலாம். இங்கு வறுமை சார்ந்த இணைச்சொல்லமைப்புக்கு ‘ஏழை’ தெளிவாகப் பொருந்துகிறது.
- source_word: אֶבְיוֹן / אֶבְיוֹנִים
  choice: வறியவர் / வறியவர்கள்
  rationale: אֶבְיוֹן என்பது தேவையில் உள்ள ஏழையைக் குறிக்கிறது. דַּל என்பதிலிருந்து மூலத்தின் சொல்வேறுபாட்டைக் காக்க ‘வறியவர்’ என மொழிபெயர்க்கப்பட்டுள்ளது; இரண்டாவது occurrence-இல் பன்மை காக்கப்பட்டுள்ளது.
- source_word: נַפְשׁוֹת
  choice: உயிர்களை
  rationale: נֶפֶשׁ இங்கு அரசரின் பாதுகாப்பும் மீட்பும் பற்றிய சூழலில் வறியவர்களின் உயிர்களைக் குறிக்கிறது. ‘ஆத்துமாக்கள்’ என்பது மூலத்தில் கட்டாயப்படுத்தப்படாத உடல்–ஆத்துமா வேறுபாட்டை உணர்த்தக்கூடும்; இருப்பினும் சொல்லின் பரந்த பொருள்வீச்சு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יוֹשִׁיעַ
  choice: காப்பாற்றுவார்
  rationale: ישׁע வினையின் Hiphil வடிவம் காப்பாற்றுதல் அல்லது விடுவித்தல் என்பதைக் குறிக்கிறது. இங்கு நேரடியான அபாயத்திலிருந்து உயிரைக் காக்கும் கருத்தை ‘காப்பாற்றுவார்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: נַפְשׁוֹת என்ற சொல்லின் மனித இயல்பு சார்ந்த பொருள்
  choice: ‘உயிர்களை’ என்று முதன்மை உரையில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆத்துமாக்களை’ அல்லது ‘நபர்களை’
  rationale: அரசரின் பாதுகாப்பையும் விடுதலையையும் பற்றிய இச்சூழலில் எபிரெயச் சொல் மக்களின் உயிர்கள் அல்லது அவர்களையே முழுமையாகக் குறிப்பது இயல்பானது. ‘ஆத்துமாக்கள்’ என்று மட்டும் மொழிபெயர்ப்பது மூலவசனம் தீர்மானிக்காத ஒரு குறிப்பிட்ட மனிதவியல் புரிதலை இறக்குமதி செய்யக்கூடும். சொல்லின் உண்மையான பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. மூல எபிரெயத்தின் இணைச்சொல்லமைப்பைக் காக்க דַּל என்பதற்கு ‘ஏழை’ என்றும் אֶבְיוֹן என்பதற்கு ‘வறியவர்’ என்றும் வேறுபடுத்தப்பட்டுள்ளது.
