id: PSA.72.10
reference: Psalms 72:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭/אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ מַלְכֵ֥י שְׁבָ֥א וּ֝/סְבָ֗א אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/010.yaml
  text: May the kings of Tarshish and of the coastlands bring tribute; may the kings of Sheba and Seba present gifts.
translation:
  language: ta
  text: தர்ஷீஸ் மற்றும் கடலோர நாடுகளின் அரசர்கள் திறையைக் கொண்டுவரட்டும்; சேபா, செபா ஆகிய நாடுகளின் அரசர்கள் பரிசுகளைச் சமர்ப்பிக்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַרְשִׁישׁ
  choice: தர்ஷீஸ்
  rationale: அடையாளம் உறுதியாகத் தெரியாத பண்டைய இடப்பெயர் என்பதால், ஊகமான புவியியல் விளக்கமின்றி ஒலிபெயர்க்கப்பட்டது.
- source_word: אִיִּים
  choice: தீவுப்பகுதிகள்
  rationale: இச்சொல் தீவுகளையும் கடற்கரை அல்லது கடல்சார் நிலப்பகுதிகளையும் குறிக்கக்கூடும்; தமிழில் இயல்பாகவும் போதிய பரப்புடனும் அமையும் தேர்வு.
- source_word: מִנְחָה
  choice: காணிக்கை
  rationale: அரசருக்குக் கொண்டுவரப்படும் பரிசு அல்லது திறையைக் குறிக்கலாம்; மூலத்தின் பரந்த பொருளை வைத்திருக்க ‘காணிக்கை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יָשִׁיבוּ
  choice: கொண்டுவரட்டும்
  rationale: சொற்பொருளில் ‘திருப்பிக் கொடுக்கட்டும்’ எனினும், இங்கு அரசருக்குத் திறை அல்லது காணிக்கை செலுத்தும் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שְׁבָא וּסְבָא
  choice: சேபா, செபா நாடுகள்
  rationale: இரண்டு தனித்த பண்டைய இடப்பெயர்களின் வேறுபாட்டைப் பேணும் ஒலிபெயர்ப்பு; ‘நாடுகள்’ என்பது அவற்றின் அரசர்களைக் குறிக்கும் தொடரைத் தெளிவாக்குகிறது.
- source_word: אֶשְׁכָּר
  choice: அன்பளிப்புகள்
  rationale: அரசருக்குச் செலுத்தப்படும் பரிசு அல்லது காணிக்கையைக் குறிக்கும் அரிய சொல்; முதல் அரையடியின் சொல்லுடன் தேவையற்ற ஒரேமாதிரித்தன்மையைத் தவிர்க்கிறது.
- source_word: יַקְרִיבוּ
  choice: செலுத்தட்டும்
  rationale: ‘அருகில் கொண்டுவருதல்/சமர்ப்பித்தல்’ என்ற பொருளை அரசருக்கான அன்பளிப்பு சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வினைச்சொற்களின் வேண்டுதல் வடிவம்
  choice: ‘கொண்டுவரட்டும் … செலுத்தட்டும்’ என்ற வேண்டுதல் வடிவம்
  alternative: ‘கொண்டுவருவார்கள் … செலுத்துவார்கள்’ என்ற எதிர்கால அறிவிப்பு
  rationale: எபிரெய வினை வடிவங்கள் இச்சங்கீதத்தின் சூழலில் விருப்பம் அல்லது வேண்டுதலை வெளிப்படுத்த இயலும்; அதை உறுதியான தீர்க்கதரிசன அறிவிப்பாக மாற்றாமல் பதற்றம் பேணப்பட்டது.
- issue: מִנְחָה என்பதன் அரசியல் அல்லது வழிபாட்டு நுணுக்கம்
  choice: காணிக்கை
  alternative: திறை
  rationale: ‘திறை’ அரசியல் கீழ்ப்படிதலை மட்டும் வலியுறுத்தக்கூடும்; ‘காணிக்கை’ பரிசு, மரியாதை, திறை ஆகிய சாத்திய நுணுக்கங்களை திறந்தவையாக வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை. இணையான இரண்டு அரையடிகளின் அமைப்பும் சேபா/செபா என்ற தனித்த பெயர்களும் பேணப்பட்டுள்ளன.
