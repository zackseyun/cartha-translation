source:
  edition: WLC
  text: לִ/שְׁלֹמֹ֨ה אֱֽלֹהִ֗ים מִ֭שְׁפָּטֶי/ךָ לְ/מֶ֣לֶךְ תֵּ֑ן וְ/צִדְקָתְ/ךָ֥ לְ/בֶן מֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/000.yaml
  text: Of Solomon.[a] O God, give your justice to the king, and your righteousness[b] to the king's son.
translation:
  language: ta
  text: 'சாலொமோனுக்குரியது.[a]


    இறைவனே, உமது நியாயத்தீர்ப்புகளை அரசனுக்கும்,

    உமது நீதியை[b] அரசனின் மகனுக்கும் தாரும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தலைப்பிலுள்ள இதை “சாலொமோனுக்காக” அல்லது “சாலொமோனுக்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “உமது நீதி” என்பதை “உமது நியாயம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: சாலொமோனுக்குரியது
  rationale: לְ முன்னொட்டு உடைமை, நோக்கம், பெறுநர் ஆகிய தொடர்புகளைக் குறிக்கக்கூடும். தலைப்பில் இயல்பாகவும் அதன் தெளிவின்மையை ஓரளவு காக்கவும் ‘சாலொமோனுக்குரியது’ என மொழிபெயர்க்கப்பட்டது; மாற்றுகள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: מִשְׁפָּטֶיךָ
  choice: உமது நியாயத்தீர்ப்புகளை
  rationale: எபிரெயச் சொல் பன்மையில் உள்ளது; அது அரசன் செயல்படுத்த வேண்டிய இறைவனுடைய நியாயமான தீர்ப்புகளையும் நீதிநெறிகளையும் குறிக்கலாம். பன்மையைத் தமிழிலும் காக்கிறது.
- source_word: צִדְקָתְךָ
  choice: உமது நீதியை
  rationale: צְדָקָה என்பது நேர்மை, நீதி, நீதியான செயல் ஆகிய பொருள் பரப்பைக் கொண்டது. இங்கு ‘நீதி’ சுருக்கமாகவும் இயல்பாகவும் இருந்து, இணையான מִשְׁפָּט உடனான வேறுபாட்டையும் காக்கிறது.
- source_word: בֶן־מֶלֶךְ
  choice: அரசனின் மகன்
  rationale: எபிரெயக் கட்டமைப்பை நேரடியாகவும் இயல்பான தமிழிலும் பிரதிபலிக்கிறது; இளவரசன் என்று விளக்கமாகக் குறுக்கிவிடவில்லை.
theological_decisions:
- issue: இறைவனுடைய நீதி அரசனுக்கு அளிக்கப்படுதல்
  choice: ‘உமது நியாயத்தீர்ப்புகளை… உமது நீதியை… தாரும்’ என்று வேண்டுதலாகவே வைக்கப்பட்டது
  alternative: அரசன் தெய்வீக நீதியை இயல்பாக உடையவன் என விளக்குதல்
  rationale: எபிரெய உரை அரசனுக்காக இறைவனிடம் செய்யப்படும் வேண்டுதல்; அரசனின் இயல்பு அல்லது அதிகாரம் பற்றிய கூடுதல் கோட்பாட்டை அது வெளிப்படையாகச் சொல்லவில்லை.
- issue: தலைப்பிலுள்ள לְ முன்னொட்டின் தொடர்பு
  choice: முதன்மை உரையில் ‘சாலொமோனுக்குரியது’; சாத்தியமான பிற தொடர்புகள் அடிக்குறிப்பில்
  alternative: ‘சாலொமோனால்’ அல்லது ‘சாலொமோனுக்காக’ என்பதை மட்டும் உறுதியாகத் தேர்ந்தெடுத்தல்
  rationale: முன்னொட்டு ஆசிரியர், பெறுநர் அல்லது அர்ப்பணிப்பு/சார்பு எனப் பலவாறு புரிந்துகொள்ளப்படலாம்; உண்மையான தெளிவின்மையை முழுமையாகத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான வேண்டுதல் நடையில் அமைக்கப்பட்டது. ‘தாரும்’ மரியாதைமிக்க இறைமுகப்பு வடிவமாகப் பயன்படுத்தப்பட்டது. கவிதை இணைநிலையைத் தெளிவாக்க வரி பிரிப்பு காக்கப்பட்டது.
