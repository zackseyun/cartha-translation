  source_fidelity: மூல எபிரெய உரையின் தலைப்பு לִשְׁלֹמֹה என்பதன் தொடர்புத் தெளிவின்மையை முதன்மை உரையில் காத்து, மாற்று வாய்ப்புகளை அடிக்குறிப்பில் சரியாகக் குறிக்கிறது. אֱלֹהִים என்பதற்கான நேரடி இறைமுகப்பு, מִשְׁפָּטֶיךָ-வின் பன்மை, צִדְקָתְךָ-வின் ஒருமை, மற்றும் לְמֶלֶךְ / לְבֶן־מֶלֶךְ ஆகிய இணைநிலை அமைப்பு அனைத்தும் உண்மையாகப் பிரதிபலிக்கப்பட்டுள்ளன.
  naturalness: நவீனத் தரத் தமிழில் கண்ணியமான சங்கீத வேண்டுதல் நடையாக உள்ளது. வரிப்பிரிப்பும் ‘தாரும்’ என்ற மரியாதைமிக்க இறைமுகப்பும் இயல்பானவை. ‘அரசனுக்கும் … அரசனின் மகனுக்கும்’ என்ற இணை அமைப்பு மூலத்தின் கவிதைச் சமநிலையை நன்கு காக்கிறது.
  terminology: ‘நியாயத்தீர்ப்புகளை’ மற்றும் ‘நீதியை’ என்பவை מִשְׁפָּטֶיךָ மற்றும் צִדְקָתְךָ இடையிலான சொல்வேறுபாட்டைத் தக்கவைக்கின்றன. ‘அரசனின் மகன்’ என்பது விளக்கவுரையாக ‘இளவரசன்’ என்று குறுக்காமல் בֶן־מֶלֶךְ-ஐ நேர்மையாக வழங்குகிறது. பெயர் வடிவமான ‘சாலொமோன்’ நிலையான தமிழ் பயன்பாட்டிற்கு ஏற்றது.
