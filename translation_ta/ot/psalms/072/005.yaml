  text: May they fear you as long as the sun endures[a], and before the moon[c][b], through all generations.
translation:
  language: ta
  text: சூரியன் இருக்கும் வரையிலும், சந்திரன் இருக்கும் வரையிலும், தலைமுறை தலைமுறையாக அவர்கள் உம்மை அஞ்சுவார்களாக.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் உம்மை அஞ்சுவார்கள்”; எபிரேய வினைவடிவத்தை வேண்டுதலாக மட்டுமல்லாமல் எதிர்காலக் கூற்றாகவும் வாசிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், “சூரியனுடன், சந்திரனின் முன்னிலையில்”; இவ்விணைத் தொடர்கள் நீடித்த காலத்தைக் குறிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירָאוּךָ
  choice: அவர்கள் உமக்கு அஞ்சி நடப்பார்களாக
  rationale: ירא என்பது ‘அஞ்சுதல், பயபக்தி கொள்ளுதல்’ என்னும் பொருளுடையது. இங்கு வெறும் திகிலைவிட மரியாதை கலந்த அச்சம் கருத்தாக இருப்பதால், இயல்பான தமிழில் ‘அஞ்சி நடப்பார்களாக’ எனத் தரப்பட்டது; சூழலில் உள்ள வேண்டுதல் சார்ந்த நுணுக்கத்தையும் இது தக்கவைக்கிறது.
- source_word: עִם שָׁמֶשׁ
  choice: சூரியன் நீடித்திருக்கும் வரையிலும்
  rationale: சொல்லளவில் ‘சூரியனுடன்’ என்றாலும், விண்பொருளோடு வரும் இத்தொடர் கால நீடிப்பைக் குறிக்கிறது. ஆகவே அதன் கருத்தைத் தெளிவாகவும் கவிதைநயத்துடனும் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְלִפְנֵי יָרֵחַ
  choice: சந்திரன் நிலைத்திருக்கும் வரையிலும்
  rationale: לִפְנֵי என்பதன் நேர்ப்பொருள் ‘முன்பாக/முன்னிலையில்’. ஆனால் சூரியனைப் பற்றிய இணையான முந்தைய அடியுடன் சேர்ந்து, சந்திரன் உள்ள காலமெல்லாம் என்ற நீடித்த காலத்தைக் குறிக்கிறது. தமிழில் தெளிவுக்காக கருத்துவழி மொழிபெயர்ப்பு பயன்படுத்தப்பட்டது.
- source_word: דּוֹר דּוֹרִים
  choice: தலைமுறை தலைமுறையாக
  rationale: ஒருமை–பன்மை மீளுருவாக்கம் தொடர்ந்து வரும் தலைமுறைகளைக் வலியுறுத்துகிறது. ‘தலைமுறை தலைமுறையாக’ என்பது அதன் மீளுருவாக்க வலிமையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: அஞ்சி நடப்பதற்குரிய ‘உமது’ என்பவரின் அடையாளம்
  choice: ‘உமக்கு’ என்ற நேரடி முன்னிலையை விளக்கமின்றித் தக்கவைத்தல்
  alternative: இது அரசனைக் குறிக்கிறது அல்லது தேவனைக் குறிக்கிறது என்று வெளிப்படையாக நிர்ணயித்தல்
  rationale: எபிரெய உரை நேரடியாக ‘உம்மை’ என்று மட்டுமே கூறுகிறது. அரச சங்கீதத்தின் சூழலில் அரசன், தாவீதிய ஆட்சியாளர், அல்லது தேவன் ஆகியோருடனான தொடர்பு பல அடுக்குகளில் புரிந்துகொள்ளப்படலாம்; மொழிபெயர்ப்பு இந்தத் தெளிவின்மையைத் தீர்மானித்து விடவில்லை.
- issue: יִירָאוּךָ என்பதன் வேண்டுதல் அல்லது எதிர்காலக் கூற்று
  choice: ‘அஞ்சி நடப்பார்களாக’ என்று வேண்டுதல் சார்ந்த வாசிப்பை முதன்மைப்படுத்துதல்
  alternative: ‘அவர்கள் உமக்கு அஞ்சி நடப்பார்கள்’ என்ற எதிர்காலக் கூற்று
  rationale: இவ்வடிவம் சூழலில் வேண்டுதல்/விருப்பப் பொருளாக வாசிக்கப்படலாம்; அதே நேரத்தில் எதிர்காலக் கூற்றாகவும் புரிந்துகொள்ள முடிவதால் மாற்றுவாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை. ‘உமக்கு’ என்பது மரியாதைமிக்க நேரடி அழைப்பைத் தக்கவைக்கிறது. இணையான இரு விண்பொருள் தொடர்களும் தமிழில் ஒரேபோன்ற காலவாசக அமைப்பில் தரப்பட்டுள்ளன.
