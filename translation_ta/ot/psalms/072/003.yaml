  text: יִשְׂא֤וּ הָרִ֓ים שָׁ֘ל֥וֹם לָ/עָ֑ם וּ֝/גְבָע֗וֹת בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/003.yaml
  text: May the mountains bring peace to the people[a], and the hills[c][b], in righteousness.
translation:
  language: ta
  text: மலைகள் மக்களுக்குச்[a] அமைதியைக் கொண்டுவரட்டும்; குன்றுகளும் அதை நீதியினால்[b] கொண்டுவரட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களுக்காக.”
    reason: lexical_alternative
  - marker: b
    text: “நீதியின்படி” அல்லது “நீதியின் மூலம்” என்றும் மொழிபெயர்க்கலாம். “நீதி” என்பதற்கு இங்கு “நேர்மை” என்ற நயமும் இருக்கலாம். இரண்டாம் அடியை, “குன்றுகள் நீதியைக் கொண்டுவரட்டும்” என்றும் புரிந்துகொள்ள வாய்ப்புள்ளது.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: கொண்டுவரட்டும்
  rationale: נָשָׂא என்பதன் அடிப்படைப் பொருள் ‘சுமத்தல்/தாங்குதல்/எடுத்துச் செல்லுதல்.’ மலைகள் சமாதானத்தைத் தாங்கி மக்களிடம் சேர்ப்பதாகக் கூறும் கவிதை உருவகத்தை இயல்பான தமிழில் ‘கொண்டுவரட்டும்’ எனத் தருகிறது. சங்கீதத்தின் வேண்டுதல் சூழலுக்கேற்ப வினை விருப்பவாக்கியமாக மொழிபெயர்க்கப்பட்டது.
- source_word: הָרִים
  choice: மலைகள்
  rationale: எபிரெயப் பன்மைப் பெயர்ச்சொல்லின் நேரான, இயல்பான தமிழ் இணை.
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: שָׁלוֹם என்பது அமைதி, நல்வாழ்வு, முழுமை ஆகிய பரந்த பொருட்களைக் கொண்டது. இங்கு ‘சமாதானம்’ முதன்மைப் பொருளைத் தருவதோடு சமூக நல்வாழ்வு என்ற விரிவான நயத்தையும் தாங்கக்கூடியது.
- source_word: לָעָם
  choice: மக்களுக்கு
  rationale: לְ முன்னிடைச்சொல் இலக்கையோ நன்மை பெறுபவரையோ குறிக்கலாம். சமாதானம் மக்களிடம் கொண்டுவரப்படுவதை ‘மக்களுக்கு’ இயல்பாக வெளிப்படுத்துகிறது; ‘மக்களுக்காக’ என்பதும் சாத்தியம் என அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וּגְבָעוֹת
  choice: குன்றுகளும்
  rationale: ‘மலைகள்’ என்பதற்கு இணையான கவிதைச் சொல்லாகவும், எபிரெய இணைப்புச் சொல்லையும் உள்ளடக்கியதாகவும் உள்ளது.
- source_word: בִּצְדָקָה
  choice: நீதியினால்
  rationale: בְ இங்கு வழிமுறை அல்லது கருவியைக் குறிக்கலாம். צְדָקָה என்பதற்கு ‘நீதி/நேர்மை’ என்ற பொருட்கள் உள்ளன. ‘நீதியினால்’ என்பது சமாதானம் வரும் வழியை இயல்பான தமிழில் காட்டுகிறது; எபிரெயின் சுருக்கத்திலுள்ள வேறு வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
