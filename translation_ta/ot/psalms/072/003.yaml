  choice: 'விருப்பம்/வேண்டுதல்: ‘கொண்டுவரட்டும்’'
  alternative: 'எதிர்கால முன்னறிவிப்பு: ‘கொண்டுவரும்’'
  rationale: சங்கீதம் 72 அரசரின் ஆட்சிக்கான வேண்டுதலும் ஆசீர்வாதமும் என்பதால், இவ்வினை எளிய எதிர்காலக் கூற்றைவிட விருப்பம் அல்லது மன்றாட்டை வெளிப்படுத்துவதாக எடுத்துக்கொள்ளப்பட்டது.
- issue: בִּצְדָקָה இரண்டாம் அடியில் வகிக்கும் இலக்கணப் பங்கு
  choice: சமாதானம் நீதியின் வழியாகக் கொண்டுவரப்படும் விதம்/கருவி
  alternative: ‘குன்றுகள் நீதியைக் கொண்டுவரட்டும்’ என்று צְדָקָה-வை இணையான நேரடிப் பொருளாக வாசித்தல்
  rationale: எபிரெயில் בְ வெளிப்படையாக இருப்பதால் அதன் வழிமுறை/கருவி நயத்தை முதன்மை உரை பாதுகாக்கிறது. முதல் அடியிலிருந்து விடுபட்ட வினையும் பொருளும் தொடர்வதைத் தமிழில் ‘அதை’ என வெளிப்படுத்தியுள்ளோம்; இணையான நேரடிப் பொருள் வாசிப்பு சாத்தியம் என்பதையும் அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. எபிரெயில் இரண்டாம் அடியில் விடுபட்டுள்ள வினை மற்றும் பொருளைத் தமிழில் இயல்பாக்க ‘அதை ... கொண்டுவரட்டும்’ என வெளிப்படுத்தியுள்ளோம்; அதனால் ஏற்படும் விளக்கத் தேர்வு அடிக்குறிப்பில் திறந்தவையாக வைக்கப்பட்டுள்ளது.
