  text: Of Solomon[a]. O God, give your judgments to the king[b], and your righteousness to the king’s son.
translation:
  language: ta
  text: 'சாலொமோனுக்குரியது.[a]


    கடவுளே, உமது நீதித்தீர்ப்புகளை அரசனுக்குத் தாரும்;

    உமது நீதியை அரசனின் மகனுக்குத் தாரும்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “சாலொமோனுக்காக” அல்லது “சாலொமோனுக்கு.” சங்கீதத் தலைப்பிலுள்ள எபிரெய முன்னொட்டு இவ்வாறான பல தொடர்புகளைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: “உமது நீதி” என்பதை “உமது நியாயம்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் ஒழுக்க நேர்மையையும் நியாயமான ஆட்சியையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: சாலொமோனைச் சார்ந்தது
  rationale: சங்கீதத் தலைப்பிலுள்ள לְ உரிமை, அர்ப்பணிப்பு, நோக்கம் அல்லது தொடர்பைக் குறிக்கலாம். ‘சார்ந்தது’ என்பது ஆசிரியர் யார் என்பதைத் திட்டவட்டமாக முடிவுசெய்யாமல் இந்தத் தொடர்பை இயல்பான தமிழில் காக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது மன்றாட்டில் வரும் நேரடி விளி; தமிழின் விளிவேற்றுமையான ‘கடவுளே’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁפָּטֶיךָ
  choice: உமது நீதித்தீர்ப்புகளை
  rationale: מִשְׁפָּטֶיךָ என்பது பன்மையில் கடவுளின் தீர்ப்புகள், நீதியான முடிவுகள் அல்லது நீதிநெறியைக் குறிக்கலாம். ‘நீதித்தீர்ப்புகள்’ பன்மையையும் அரசனின் நீதி வழங்கும் பணியையும் காக்கிறது.
- source_word: לְמֶלֶךְ
  choice: அரசனுக்கு
  rationale: கேட்கப்படும் கொடையைப் பெறுபவரைக் குறிக்கும் நேரடியான வேற்றுமை வடிவம்.
- source_word: תֵּן
  choice: தாரும்
  rationale: கடவுளிடம் நேரடியாக வைக்கப்படும் வேண்டுகோளை, நவீனமும் கண்ணியமுமான தமிழ் மன்றாட்டு நடையில் வெளிப்படுத்துகிறது.
- source_word: וְצִדְקָתְךָ
  choice: உமது நீதியை
  rationale: צְדָקָה இங்கு ஒழுக்க நேர்மையையும் நியாயமான ஆட்சியையும் உள்ளடக்கும். தமிழில் ‘நீதி’ இந்த அரசச் சூழலில் இயல்பாக இருந்து அந்த இரு பரிமாணங்களையும் தாங்குகிறது.
- source_word: לְבֶן־מֶלֶךְ
  choice: அரசனின் மகனுக்கு
  rationale: எபிரெயக் கட்டிணைப்பின் நேரடியான, இயல்பான தமிழாக்கம். இது அரச வாரிசையோ அரசனுக்கான இணைச் சொல்லையோ முன்கூட்டியே தீர்மானிப்பதில்லை.
theological_decisions:
- issue: ‘அரசன்’ மற்றும் ‘அரசனின் மகன்’ என்போரின் அடையாளம்
  choice: உடனடியான அரச மன்றாட்டின் சொற்களை அப்படியே வைத்து, முதன்மை உரையில் குறிப்பிட்ட ஒருவராகவோ மேசியாவாகவோ வெளிப்படையாக அடையாளப்படுத்தவில்லை.
  alternative: இது குறிப்பாக சாலொமோனுக்கான மன்றாட்டு; அல்லது சாலொமோனைத் தாண்டி தாவீதின் வம்சத்தையும் மேசியாவையும் நோக்கும் மன்றாட்டு.
  rationale: வசனம் வரலாற்று அரசச் சூழலையும் இலட்சிய அரசனைப் பற்றிய விரிந்த ஒலிப்பையும் அனுமதிக்கிறது. மொழிபெயர்ப்பு இந்தத் தெய்வியத் திறந்தநிலையைத் தீர்த்து வைக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைக்கும் எளிய மன்றாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’, ‘தாரும்’ என்பவை கண்ணியமான நேரடி விளியை வழங்குகின்றன; அளவுக்கு மீறிய தொன்மைநடை தவிர்க்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணை அமைப்பு இரண்டு வரிகளிலும் பாதுகாக்கப்பட்டுள்ளது.
