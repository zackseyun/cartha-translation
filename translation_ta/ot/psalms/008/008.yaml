  text: 'வானத்துப் பறவைகளையும்,


    கடலின் மீன்களையும்,


    கடல்களின் பாதைகளில் செல்லும் அனைத்தையும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִפּוֹר שָׁמַיִם
  choice: வானத்துப் பறவைகள்
  rationale: צִפּוֹר இலக்கண வடிவில் ஒருமையாக இருந்தாலும், இங்கு உயிரினங்களின் ஒரு வகையைக் கூட்டாகக் குறிக்கிறது; எனவே தமிழில் இயல்பான பன்மை பயன்படுத்தப்பட்டது. שָׁמַיִם இச்சூழலில் பறவைகள் பறக்கும் வானத்தைக் குறிக்கிறது.
- source_word: וּדְגֵי הַיָּם
  choice: கடலின் மீன்கள்
  rationale: இணைப்புச் சொல்லுடன் வரும் இந்த construct தொடரின் நேரான, இயல்பான தமிழ் வடிவம் இது; ‘மீன்கள்’ கூட்டுப் பொருளையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֹבֵר
  choice: கடந்து செல்பவை அனைத்தும்
  rationale: எபிரெயப் பங்கேற்புவினை ஒருமையில் இருந்தாலும், முன் கூறப்பட்ட கடல்வாழ் உயிரினங்களை விரிவாகத் தொகுத்துக் குறிக்கும் வாய்ப்பு உள்ளது. தமிழில் அஃறிணைப் பன்மையும் ‘அனைத்தும்’ என்பதும் அந்தக் கூட்டு விரிவை இயல்பாகத் தருகின்றன.
- source_word: אָרְחוֹת
  choice: பாதைகள்
  rationale: கடலில் உயிரினங்கள் செல்லும் வழித்தடங்களைச் சித்தரிக்கும் கவித்துவ உருவகத்தை ‘பாதைகள்’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: יַמִּים
  choice: கடல்கள்
  rationale: மூலத்தின் பன்மை வடிவத்தையும் அதன் கவித்துவ விரிவையும் பாதுகாக்கப் பன்மையாக மொழிபெயர்க்கப்பட்டது.
theological_decisions: []
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கவித்துவக் கண்ணியமும் இணைக்கப்பட்டுள்ளன. மூலத்தின் மூன்று கூறுகளும் இணையான அடிகளாக அமைக்கப்பட்டு, யַמִּים என்பதன் பன்மை பாதுகாக்கப்பட்டுள்ளது.
