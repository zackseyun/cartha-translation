revisions:
- from: உமது வானங்களை—உமது விரல்களின் படைப்பை—நிலவையும் நீர் நிலைநிறுத்திய விண்மீன்களையும் நான் காணும்போது,[a]
  to: உமது விரல்களின் படைப்பான உமது வானங்களை, நீர் நிலைநிறுத்திய நிலவையும் விண்மீன்களையும் நான் காணும்போது—
  rationale: 'The revision preserves the source sequence and imagery while removing a Tamil syntactic ambiguity: ‘நீர் நிலைநிறுத்திய’ now unambiguously governs both ‘நிலவு’ and ‘விண்மீன்கள்.’ The footnote is correspondingly corrected. The singular collective ‘படைப்பு’ is retained as idiomatic Tamil for the Hebrew expression ‘the work(s) of your fingers.’'
