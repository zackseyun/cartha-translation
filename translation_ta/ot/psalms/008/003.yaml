source:
  edition: WLC
  text: כִּֽי אֶרְאֶ֣ה שָׁ֭מֶי/ךָ מַעֲשֵׂ֣י אֶצְבְּעֹתֶ֑י/ךָ יָרֵ֥חַ וְ֝/כוֹכָבִ֗ים אֲשֶׁ֣ר כּוֹנָֽנְתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: When I look at your heavens[a], the work of your fingers, the moon and the stars, which you have set in place—
translation:
  language: ta
  text: உமது விரல்களின் படைப்பான உமது வானங்களை, நீர் நிலைநிறுத்திய நிலவையும் விண்மீன்களையும் நான் காணும்போது—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: போது
  rationale: அடுத்த வசனத்தில் வரும் சிந்தனைக்கான சூழலை இங்கு அறிமுகப்படுத்துகிறது; ‘ஏனெனில்’ என்ற காரணப் பொருளும் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶרְאֶה
  choice: நான் காணும்போது
  rationale: ראה என்பதன் கவனித்துப் பார்க்கும் அனுபவப் பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׁמֶיךָ
  choice: உமது வானங்களை
  rationale: எபிரேயப் பன்மையையும் உயர்ந்த அண்டவெளிப் பொருளையும் காக்கிறது.
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  choice: உமது விரல்களின் படைப்பை
  rationale: தெய்வீகப் படைப்புச் செயலைக் குறிக்கும் மனித உருவகத்தைச் சீராக்காமல் பாதுகாக்கிறது; מַעֲשֵׂי என்ற வடிவத்தின் கூட்டுப் பொருளைத் தமிழில் ஒருமைத் தொகுப்புச்சொல்லாக இயல்பாக வழங்குகிறது.
- source_word: יָרֵחַ וְכוֹכָבִים
  choice: நிலவையும் ... விண்மீன்களையும்
  rationale: குறிப்பிட்ட வான்பொருட்களை இயல்பான தமிழில் கூறுகிறது; இணைப்பு வாக்கிய அமைப்புக்குள் பொருத்தப்பட்டுள்ளது.
- source_word: אֲשֶׁר
  choice: நீர் ... நிலைநிறுத்திய
  rationale: எபிரேயத் தொடர்புச் சொல்லைத் தமிழின் இயல்பான பெயரெச்சத் தொடராக மாற்றுகிறது.
- source_word: כּוֹנָנְתָּה
  choice: நீர் நிலைநிறுத்திய
  rationale: כון என்பதிலுள்ள நிறுவுதல், உறுதிப்படுத்துதல், ஒழுங்காக அமைத்தல் ஆகிய நிழற்பொருள்களைத் தக்கவைக்கும் கண்ணியமான தமிழ்.
theological_decisions:
- issue: தெய்வீகப் படைப்புச் செயலுக்கான மனித உருவகம்
  choice: ‘உமது விரல்கள்’ என்ற உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘உமது கைவேலை’ அல்லது ‘நீர் படைத்தவை’
  rationale: எபிரேயக் கவிதை கடவுளின் நெருக்கமான, எளிதான படைப்பாற்றலை ‘விரல்கள்’ என்ற உருவகத்தால் வெளிப்படுத்துகிறது. அதைத் தக்கவைப்பது கடவுளுக்கு உடல் உண்டு என்ற கோட்பாட்டைச் சேர்க்காமல் மூலத்தின் கவித்துவ வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘நீர்’ பயன்படுத்தப்பட்டுள்ளன. அடுத்த வசனத்திற்குத் தொடரும் முடிவுறாத சிந்தனையை இறுதிக் காற்புள்ளி உணர்த்துகிறது.
