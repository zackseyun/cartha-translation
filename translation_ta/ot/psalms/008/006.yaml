  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
translation:
  language: ta
  text: உமது கைகளின் படைப்புகளை ஆளச் செய்தீர்[a][b]; எல்லாவற்றையும் அவனுடைய கால்களுக்குக் கீழே வைத்தீர்.
  philosophy: optimal-equivalence
  footnotes:
