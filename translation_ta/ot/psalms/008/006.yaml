  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதை ஒருமையான ‘உமது/நீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெய உரையின் கை, கால் உருவகங்கள் நேரடியாகத் தக்கவைக்கப்பட்டுள்ளன.
