    text: அல்லது, “உமது கைகளின் படைப்புகளின்மேல் அவனுக்கு ஆளுகை அளித்தீர்.”
    reason: lexical_alternative
  - marker: b
    text: “அவனை,” “அவனுடைய” என்ற ஒருமை ஆண்பால் வடிவங்கள் முந்தைய வசனத்தில் வரும் மனிதனைச் சுட்டும் பிரதிநிதித்துவ மொழியைத் தொடர்கின்றன; எபிரேய மொழிநடையில் இவை மனிதகுலத்தைக் கருத்தில் கொள்கின்றன.
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  choice: ஆளும்படி அவனை ஏற்படுத்தினீர்
  rationale: מָשַׁל என்பதன் ஹிஃபில் வடிவம் ஒருவனை ஆளச் செய்வது அல்லது ஆட்சிப் பொறுப்பில் வைப்பது என்ற காரணவினைப் பொருளைக் கொண்டது. ‘ஆளும்படி அவனை ஏற்படுத்தினீர்’ என்பது அந்தக் காரணவினைப் பொருளையும் கடவுள் அளித்த பொறுப்பையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: உமது கைகளின் படைப்புகளை
  rationale: מָשַׁל உடன் வரும் בְ ஆளுகைக்குரிய பொருளைக் குறிக்கிறது. ‘உமது கைகளின் படைப்புகள்’ என்பது கடவுளுடைய கைகள் என்ற மூலமொழியின் உருவகத்தைத் தக்கவைத்து, அவர் உண்டாக்கியவற்றைக் குறிக்கிறது.
- source_word: כֹּל
  choice: எல்லாவற்றையும்
  rationale: தனித்து வரும் כֹּל இச்சூழலில் மனித ஆளுகைக்குக் கீழ் வைக்கப்பட்ட படைப்புகள் அனைத்தையும் விரிவாகக் குறிக்கிறது.
- source_word: שַׁתָּה
  choice: வைத்தீர்
  rationale: שׁית என்பதன் கால் வடிவம் ‘வை, இடு, அமை’ என்று பொருள்படும். ‘வைத்தீர்’ என்பது நேரடியான, இயல்பான தமிழ்.
- source_word: תַחַת רַגְלָיו
  choice: அவனுடைய கால்களுக்குக் கீழே
  rationale: இது கீழ்ப்படுத்தப்படுதலையும் அதிகாரத்தின் கீழ் வைக்கப்படுதலையும் குறிக்கும் எபிரெய உருவகம். நேரடியான உடல் உருவகத்தையும் அதன் ஆளுகைப் பொருளையும் மொழிபெயர்ப்பு தக்கவைக்கிறது.
theological_decisions:
