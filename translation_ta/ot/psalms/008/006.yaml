  choice: ‘அவனை’, ‘அவனுடைய’ என்ற ஆண்பால் ஒருமை வடிவங்களைத் தக்கவைத்தல்
  alternative: ‘அவர்களை’, ‘அவர்களுடைய’ என்று பன்மையில் மொழிபெயர்த்தல்
  rationale: எபிரெய உரை முந்தைய வசனத்தின் ‘மனிதன் / மனிதகுமாரன்’ என்பதைக் தொடர்ந்து ஆண்பால் ஒருமை வடிவங்களைப் பயன்படுத்துகிறது; சூழலில் அந்த ஒருமை மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்துகிறது. இலக்கண வடிவத்தை மாற்றாமல் இந்த விரிவான பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
