  text: What is man that you remember him[c][b][a], and the son of man that you attend to him?
translation:
  language: ta
  text: மனிதன்[a] எம்மாத்திரம், நீர் அவனை நினைவில் கொள்கிறீர்? மனிதகுமாரன்[b] எம்மாத்திரம், நீர் அவனைக் கவனிக்கிறீர்?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிலையற்ற மனிதன்’ என்றும் மொழிபெயர்க்கலாம்; אֱנוֹשׁ என்ற எபிரெயச் சொல் மனிதரின் பலவீனத்தையும் நிலையாமையையும் அடிக்கடி உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘மனிதகுமாரன்’ என்பது இங்கு மனிதரைக் குறிக்கும் எபிரெய மரபுத்தொடர். பிற்கால வேதாகமப் பயன்பாட்டில் இத்தொடர் மேசியாவைக் குறிக்கும் முக்கியத்துவம் பெறலாம்; ஆனால் இச்சங்கீதத்தில் இது மனிதகுலத்தைக் குறிக்கும் கவிதை இணைச்சொல்லாக உள்ளது.
    reason: cross_reference
  - marker: c
    text: ‘அவனை விசாரிப்பது’, ‘அவன்மேல் அக்கறை கொள்வது’ அல்லது ‘அவனைக் காண வருவது’ என்றும் மொழிபெயர்க்கலாம்.
