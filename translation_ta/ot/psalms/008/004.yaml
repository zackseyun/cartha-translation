  rationale: எபிரெயச் சொல்லோவியத்தையும் ஒருமை வடிவையும் சுருக்கமான தமிழில் காக்கிறது; இங்கு இது பொதுவாக மனிதனைக் குறிக்கும் இணைச்சொல்.
- source_word: תִפְקְדֶנּוּ
  choice: நீர் அவனைக் கவனித்துக்கொள்வதற்கு
  rationale: פקד என்பதன் இச்சூழலுக்குரிய அக்கறையோடு கவனித்தல் என்ற பொருளை இயல்பாகத் தருகிறது; அதன் விரிந்த பொருள் எல்லை அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: மனிதகுலத்தைக் குறிக்கும் ஆண்பால் ஒருமை மொழி
  choice: ‘மனிதன்’, ‘மனுமகன்’ என்ற ஒருமை வடிவங்களைத் தக்கவைத்தல்
  alternative: ‘மனிதர்கள்’, ‘மனிதகுலம்’ என்று பன்மை அல்லது கூட்டுப்பெயராக மொழிபெயர்த்தல்
  rationale: மூலத்தின் பிரதிநிதித்துவ ஒருமையையும் கவிதை இணைப்பையும் காக்கிறது; இது ஆண்களை மட்டும் குறுக்கிக் காட்டுவதல்ல, மனிதரைப் பொதுவாகக் குறிக்கிறது.
- issue: ‘மனுமகன்’ என்பதை இங்கு மேசியாப் பட்டமாகப் புரிந்துகொள்வதா
  choice: இச்சங்கீதத்தின் உடனடிச் சூழலில் பொதுவான மனிதக் குறிப்பாக மொழிபெயர்த்தல்
  alternative: மேசியாவைக் குறிப்பதாக வெளிப்படையாகக் குறித்தல்
  rationale: பிற்கால வேதாகமப் பயன்பாட்டில் கிறிஸ்துவியல் முக்கியத்துவம் இருந்தாலும், இவ்வசனத்தின் எபிரெயக் கவிதையில் இது ‘மனிதன்’ என்பதற்கு இணையான பொதுமனிதக் குறிப்பாகச் செயல்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியத்தக்க வகையில் அமைக்கப்பட்டுள்ளது. ‘எம்மாத்திரம்’ கவிதைநயத்தையும் வியப்புடன் கூடிய வினாவையும் காக்கிறது; மரியாதை ஒருமையான ‘நீர்’ இறைவனை நோக்கிய உரைக்கு ஏற்ற கண்ணியமான பதிவை வழங்குகிறது.
