- from: மனிதன்[a] எம்மாத்திரம், நீர் அவனை நினைவில் கொள்வதற்கு? மனுமகன்[b] எம்மாத்திரம், நீர் அவனைக் கவனித்துக்கொள்வதற்கு?[c]
  to: மனிதன்[a] எம்மாத்திரம், நீர் அவனை நினைவில் கொள்கிறீர்? மனிதகுமாரன்[b] எம்மாத்திரம், நீர் அவனைக் கவனிக்கிறீர்?[c]
