  rationale: זכר என்பதன் அடிப்படைப் பொருளான நினைத்தல் அல்லது நினைவில் வைத்திருத்தலை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּבֶן־אָדָם
