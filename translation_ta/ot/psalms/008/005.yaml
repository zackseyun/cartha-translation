  text: וַ/תְּחַסְּרֵ֣/הוּ מְּ֭עַט מֵ/אֱלֹהִ֑ים וְ/כָב֖וֹד וְ/הָדָ֣ר תְּעַטְּרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/005.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
translation:
  language: ta
  text: ஆயினும், நீர் அவனைக் கடவுளைவிட[a] சற்றுத் தாழ்ந்தவனாக்கினீர்; மகிமையாலும் மாண்பாலும் அவனுக்கு முடிசூட்டினீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வானுலக உயிரினங்களைவிட’; செப்துவஜிந்தா ‘தேவதூதர்களைவிட’ என்று மொழிபெயர்க்கிறது; இந்த வாசிப்பு எபிரெயர் 2:7-ல் பிரதிபலிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  choice: அவனைத் தாழ்ந்தவனாக்கி
  rationale: חסר என்பதன் ஹிஃபில் வடிவம், ஒருவரை ஒப்பீட்டளவில் குறைந்த நிலையில் வைப்பதைக் குறிக்கிறது; தொடர்ந்து வரும் מן ஒப்பீட்டுத் தொடருடன் ‘தாழ்ந்தவனாக்கி’ என்பது இயல்பான தமிழாக்கம்.
- source_word: מְּעַט
  choice: சற்று
  rationale: இங்கு கால அளவைவிட நிலையின் சிறிய வேறுபாட்டைக் குறிக்கும் அளவுப் பொருளே எபிரெய உரைக்கு இயல்பானது.
- source_word: מֵאֱלֹהִים
  choice: கடவுளைவிட
  rationale: אֱלֹהִים என்பதன் நேரடியான எபிரெய வாசிப்பு இங்கு ‘கடவுள்’ எனப் புரிந்துகொள்ள இடமளிக்கிறது; ‘வானுலக உயிரினங்கள்’ மற்றும் கிரேக்க மரபின் ‘தேவதூதர்கள்’ ஆகியவை அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: וְכָבוֹד
  choice: மகிமையாலும்
  rationale: כָּבוֹד என்பது மகிமை, கனம், மதிப்பு ஆகிய பொருள்களைக் கொண்டது; உயர்ந்த கவிதை நடைக்கும் முடிசூட்டும் உருவகத்திற்கும் ‘மகிமை’ பொருந்துகிறது.
- source_word: וְהָדָר
  choice: மாண்பாலும்
  rationale: הָדָר என்பது மாட்சி, சிறப்பு, மாண்பு ஆகியவற்றைக் குறிக்கிறது; ‘மாண்பு’ என்பது அருளப்பட்ட உயரிய கண்ணியத்தை இயல்பாக வெளிப்படுத்தி, ‘மகிமை’ என்பதுடன் தேவையற்ற மறுபடியுரைத்தலைத் தவிர்க்கிறது.
- source_word: תְּעַטְּרֵהוּ
  choice: அவனுக்கு முடிசூட்டினீர்
  rationale: עטר என்பதன் பியேல் வடிவம் முடிசூட்டுதல் அல்லது சிறப்பால் சூழ்தல் என்ற பொருளைக் கொண்டது; இங்கு அரச மரியாதையின் உருவகத்தை ‘முடிசூட்டினீர்’ தெளிவாகக் கொண்டுவருகிறது.
theological_decisions:
- issue: ஒருமை ஆண்பால் சுட்டுப்பெயரின் குறிப்பு மற்றும் பிரதிநிதித்துவப் பொருள்
  choice: ‘அவன்’ என்ற ஒருமை வடிவத்தைத் தக்கவைத்தல்
  alternative: ‘அவர்கள்’ அல்லது ‘மனிதகுலம்’
  rationale: எபிரெய உரையில் ஒருமை சுட்டுப்பெயர் பின்னொட்டுகள் உள்ளன; முந்தைய சூழலில் ‘மனிதன்/மனிதமகன்’ பிரதிநிதித்துவமாக வருவதால், அதன் மனிதகுலப் பரப்பை விளக்கமாகச் சேர்க்காமல் ஒருமை வடிவம் பாதுகாக்கப்படுகிறது.
- issue: אֱלֹהִים என்பதன் பொருள்
  choice: கடவுள்
  alternative: வானுலக உயிரினங்கள்; தேவதூதர்கள்
  rationale: மூலமொழிக்கு முன்னுரிமை அளிக்கையில் ‘கடவுள்’ என்பது எபிரெய உரையின் நேரடியான வாசிப்பு. செப்துவஜிந்தாவின் ‘தேவதூதர்கள்’ என்ற வாசிப்பு எபிரெயர் 2:7-ல் பிரதிபலிப்பதால், அந்த முக்கிய மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்தின் உயர்ந்த கவிதைத் தன்மையைத் தக்கவைக்கும் மரியாதை ஒருமை நடை பயன்படுத்தப்பட்டுள்ளது. ‘சற்று’ அளவுப் பொருளைத் தெளிவாக்குகிறது; ‘மகிமை—மாண்பு’ இணை எபிரெயக் கவிதை இணையமைப்பை இயல்பாக வெளிப்படுத்துகிறது.
