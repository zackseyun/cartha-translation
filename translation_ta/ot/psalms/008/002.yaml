source:
  edition: WLC
  text: מִ/פִּ֤י עֽוֹלְלִ֨ים וְֽ/יֹנְקִים֮ יִסַּ֪דְתָּ֫ עֹ֥ז לְמַ֥עַן צוֹרְרֶ֑י/ךָ לְ/הַשְׁבִּ֥ית א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
translation:
  language: ta
  text: 'சிசுக்களின் மற்றும் பால்குடிக்கும் குழந்தைகளின் வாயிலிருந்து

    உமது எதிரிகளினிமித்தம் நீர் வல்லமையை[a] நிலைநாட்டினீர்,

    பகைவனையும் பழிவாங்குபவனையும் ஒழிப்பதற்காக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘புகழ்’; மத்தேயு 21:16-இல் பிரதிபலிக்கும் செப்துவஜிந்த் மரபின்படி. எபிரெய உரையில் ‘வல்லமை’ என்றுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: מִפִּי
  choice: வாயிலிருந்தும்
  rationale: מִן + פֶּה என்பதன் இயல்பான பொருள் ‘வாயிலிருந்து.’ அடுத்து வரும் இரண்டு குழுக்களோடும் இதை இணைத்து வழங்குவது எபிரெய மொழியின் பகிர்ந்தளிக்கும் பொருளைத் தமிழில் தெளிவாக்குகிறது.
- source_word: עוֹלְלִים
  choice: சிசுக்கள்
  rationale: மிக இளம் குழந்தைகளைக் குறிக்கிறது; ‘சிசுக்கள்’ என்பது நவீனத் தமிழில் தெளிவானதும் சுருக்கமானதும் ஆகும்.
- source_word: יֹנְקִים
  choice: பால்குடிக்கும் குழந்தைகள்
  rationale: பால் அருந்திக்கொண்டிருக்கும் குழந்தைகள் என்ற செயற்படிமத்தை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: יִסַּדְתָּ
  choice: நிலைநாட்டினீர்
  rationale: יסד என்பதன் ‘நிறுவுதல், உறுதியாக அமைத்தல்’ என்ற பொருளை ‘வல்லமை’ என்னும் கருத்தோடு இயல்பாக இணைக்கிறது; கடவுளை நோக்கிய மரியாதை ஒருமையும் காக்கப்படுகிறது.
- source_word: עֹז
  choice: வல்லமை
  rationale: எபிரெயச் சொல்லின் முதன்மைப் பொருள் ‘வலிமை/வல்லமை.’ கவிதை நடைக்கு ஏற்ற dignified சொல்லாக ‘வல்லமை’ தேர்ந்தெடுக்கப்பட்டது; கிரேக்க மரபின் ‘புகழ்’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְמַעַן
  choice: எதிரிகளினிமித்தம்
  rationale: இங்கு எதிரிகளால் ஏற்பட்ட காரணம் அல்லது அவர்களை முன்னிட்டு நிறைவேற்றப்படும் நோக்கம் ஆகிய இரண்டிற்கும் இடமளிக்கிறது.
- source_word: צוֹרְרֶיךָ
  choice: உமது எதிரிகள்
  rationale: விரோதமாக நிற்பவர்களைக் குறிக்கிறது. அடுத்துள்ள ஒருமை ‘பகைவன்’ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: לְהַשְׁבִּית
  choice: அடக்குவதற்காக
  rationale: ஹிபில் வடிவின் ‘ஓயச்செய்தல், நிறுத்துதல்’ என்ற பொருளைச் சூழலில் இயல்பாகக் கூறுகிறது; பேச்சை மட்டும் மௌனமாக்குதல் என்று தேவையின்றிக் குறுக்கவில்லை.
- source_word: אוֹיֵב
  choice: பகைவன்
  rationale: ஒரு வகுப்பை பிரதிநிதித்துவப்படுத்தும் பொதுவான ஒருமையைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: מִתְנַקֵּם
  choice: பழிவாங்குகிறவன்
  rationale: பழிவாங்கச் செயல்படுகிற ஒருவரைக் குறிக்கும் எபிரெயப் பெயரெச்சத்தின் நிகழ்ச் செயற்பொருளைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: எபிரெய עֹז என்பதற்கும் செப்துவஜிந்த்/மத்தேயு 21:16 மரபிலுள்ள ‘புகழ்’ என்பதற்கும் இடையிலான வேறுபாடு
  choice: முதன்மை உரையில் ‘வல்லமை’
  alternative: புகழ்
  rationale: மசோரெட்டிக் எபிரெய உரை தெளிவாக ‘வல்லமை/வலிமை’ என்று வாசிக்கிறது. மூலமொழி முன்னுரிமையால் அதுவே முதன்மை உரையில் தரப்படுகிறது; புதிய ஏற்பாட்டுடன் தொடர்புடைய கிரேக்க மரபின் ‘புகழ்’ வாசகம் முக்கியமானதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டது. ‘உமது/நீர்’ என்ற மரியாதை ஒருமை கடவுளை நேரடியாக அழைக்கும் சங்கீத நடையை காக்கிறது. கடைசி நோக்கவாக்கியம் எபிரெயக் கவிதையின் தொடர்ச்சியையும் சுருக்கத்தையும் பாதுகாக்கிறது.
