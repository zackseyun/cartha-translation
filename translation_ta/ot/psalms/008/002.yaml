  to: 'சிசுக்களின் மற்றும் பால்குடிக்கும் குழந்தைகளின் வாயிலிருந்து

    உமது எதிரிகளினிமித்தம் நீர் வல்லமையை[a] நிலைநாட்டினீர்,

    பகைவனையும் பழிவாங்குபவனையும் ஒழிப்பதற்காக.'
  rationale: The revision preserves the Hebrew syntax and poetic economy while making the Tamil opening smoother. It replaces ‘subdue’ language with ‘put an end to,’ which more closely represents לְהַשְׁבִּית. The footnote retains the significant Septuagint/Matthew-related alternative without displacing the Hebrew reading.
