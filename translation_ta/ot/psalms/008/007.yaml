  source_fidelity: 'மூல எபிரெயத்தின் பட்டியலமைப்பும் பொருளும் நன்றாகப் பாதுகாக்கப்பட்டுள்ளன: צֹנֶה மற்றும் וַאֲלָפִים ஆகியவை ‘ஆடுமாடுகள்’ எனவும், כֻּלָּם என்பதன் வலியுறுத்தல் ‘அவை அனைத்தும்’ எனவும், விலங்குப் பட்டியலின் விரிவாக்கம் ‘அத்துடன்’ எனவும் வெளிப்படுகின்றன. ‘வயல்வெளியின் விலங்குகள்’ שָׂדָי-யின் திறந்த வெளி/வயல் சார்ந்த உருவகத்தை ஏற்ற அளவில் தருகிறது.'
  naturalness: ‘ஆடுமாடுகள், அவை அனைத்தும்; அத்துடன் வயல்வெளியின் விலங்குகளும்’ என்பது சங்கீதத்தின் தொடர்வரிப் பட்டியலாக இயல்பாகவும் கண்ணியமாகவும் ஒலிக்கிறது. முற்பட்ட வசனத்தின் ‘அவனுடைய கால்களுக்குக் கீழ்ப்படுத்தினீர்’ போன்ற வினையுடன் இணைந்து வாசிக்கத்தக்க துணைவாக்கிய அமைப்பு இது.
  terminology: ‘ஆடுமாடுகள்’ நவீன நிலையான தமிழில் இயல்பான கூட்டுச்சொல்; மூலத்தின் சிறு கால்நடை/மாட்டின வேறுபாட்டைச் சூழலுக்கேற்றவாறு கொண்டுள்ளது. ‘விலங்குகள்’ என்பது בַּהֲמוֹת-க்கு மதச்சார்பற்ற, தெளிவான நவீன இணையாக உள்ளது. சிறப்பான இறையியல் சொல் தொடர்பான சிக்கல் இல்லை.
