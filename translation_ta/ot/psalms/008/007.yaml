translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற சுருக்கமானவும் கண்ணியமானவும் உள்ள நடை. ‘ஆடுமாடுகள்’ என்ற இயல்பான தமிழ்க் கூட்டுச்சொல் பயன்படுத்தப்பட்டாலும், ‘அவை அனைத்தும்’ என்பதால் மூலத்தின் வலியுறுத்தல் தனியே பாதுகாக்கப்படுகிறது.
