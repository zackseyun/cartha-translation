  text: ஆடுமாடுகள், அவை அனைத்தும்; அத்துடன் வயல்வெளியின் விலங்குகளும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹנֶה
  choice: ஆடுகள்
  rationale: இந்த எபிரெயச் சொல் செம்மறியாடுகள் மற்றும் வெள்ளாடுகள் அடங்கிய சிறிய கால்நடைகளைச் சுட்டுகிறது. தமிழில் இவ்விரண்டையும் பொதுவாக உள்ளடக்கக்கூடிய இயல்பான கவிதைநடைச் சொல் ‘ஆடுகள்’.
- source_word: וַאֲלָפִים
  choice: மாடுகள்
  rationale: இச்சொல் வளர்ப்பு மாட்டினத்தைக் குறிக்கிறது. ‘மாடுகள்’ என்பது காளைகள் மட்டும் என வரம்புபடுத்தாமல் அதன் பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: כֻּלָּם
  choice: அவை அனைத்தும்
  rationale: மூலத்தில் உள்ள மூன்றாம் நபர் பன்மைச் சுட்டுப்பின்னொட்டையும் முழுமையை வலியுறுத்தும் பொருளையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: וְגַם
  choice: அத்துடன் ... உம்
  rationale: வளர்ப்பு விலங்குகளுக்கு அப்பால் பட்டியலை விரிவாக்கும் சேர்க்கைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בַּהֲמוֹת
  choice: விலங்குகள்
  rationale: இவ்விடத்தில் பெரிய நிலவாழ் விலங்குகளைப் பொதுவாகக் குறிக்கிறது; ‘விலங்குகள்’ நவீனத் தமிழில் தெளிவாகவும் தேவையற்ற குறுக்கமின்றியும் உள்ளது.
- source_word: שָׂדָי
  choice: வயல்வெளியின்
  rationale: இச்சொல் வயல் அல்லது திறந்த நிலப்பரப்பைக் குறிக்கிறது. ‘வயல்வெளி’ வளர்ப்பு விலங்குகளுக்கு அப்பாலுள்ள திறந்த நாட்டுப் பகுதியின் உருவகத்தை இயல்பாகக் காக்கிறது.
