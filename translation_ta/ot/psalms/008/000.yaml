source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל הַ/גִּתִּ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/000.yaml
  text: For the choir director[a]; according to the Gittith[c][b]. A psalm of David.
translation:
  language: ta
  text: இசைத் தலைவருக்கு; கித்தீத்தின்படி.[a] தாவீதின் சங்கீதம்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான “கித்தீத்.” இது ஒருவேளை ஓர் இசை அல்லது வழிபாட்டுக் குறிப்பாக இருக்கலாம்; ஒரு மெட்டின் பெயராகவோ இசைக்கருவியின் பெயராகவோ இருக்கலாம்.
    reason: cultural_note
  - marker: b
    text: “தாவீதினால் இயற்றப்பட்ட சங்கீதம்” அல்லது “தாவீதுக்காக இயற்றப்பட்ட சங்கீதம்” என்றும் பொருள் கொள்ளலாம். எபிரெயத் தொடர் ஆசிரியத்துவத்தையோ தாவீதுடன் உள்ள வேறு தொடர்பையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கும் வழக்குச் சொல்லாக இது உள்ளது. நவீனத் தமிழில் தெளிவாகவும் வழிபாட்டு இசைச் சூழலுக்கு ஏற்றவாறும் மொழிபெயர்க்கப்பட்டது.
- source_word: עַל
  choice: என்பதன்படி
  rationale: இதற்குப் பின்வரும் உறுதியற்ற இசைக் குறிப்போடு சங்கீதத்தின் நிகழ்த்துதலைத் தொடர்புபடுத்துகிறது; அதன் துல்லியமான தொழில்நுட்பப் பொருளைத் தீர்மானிக்காமல் அந்த உறவை வெளிப்படுத்துகிறது.
- source_word: הַגִּתִּית
  choice: கித்தீத்
  rationale: இச்சொல்லின் துல்லியமான குறிப்பு தெரியவில்லை; இது ஒரு மெட்டு, இசைக்கருவி அல்லது வேறு இசை/வழிபாட்டுக் குறிப்பாக இருக்கலாம். எனவே ஊகப் பொருளைச் சேர்க்காமல் எபிரெய வடிவம் ஒலிபெயர்க்கப்பட்டது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இந்த இலக்கிய மற்றும் இசை வகைப்பாட்டுக்கான நிலைபெற்ற, துல்லியமான தமிழ்ச் சொல்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரெய לְ என்பது ஆசிரியத்துவம், தொடர்பு, அர்ப்பணம் அல்லது தொகுப்புச் சார்பு ஆகியவற்றில் ஒன்றைக் குறிக்கலாம். ‘தாவீதின்’ என்பது இவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் மூலத்தின் நெகிழ்வை ஓரளவு காக்கிறது.
theological_decisions:
- issue: לְדָוִד குறிக்கும் ஆசிரியத்துவம் அல்லது தொடர்பு
  choice: தாவீதின்
  alternative: தாவீதினால் இயற்றப்பட்ட / தாவீதுக்காக
  rationale: எபிரெயத் தலைப்பு தாவீதுக்கும் சங்கீதத்துக்கும் உள்ள உறவைத் துல்லியமாக ஒரே வகையில் வரையறுக்கவில்லை. ஆகவே ஆசிரியத்துவத்தை மட்டும் உறுதிப்படுத்தாமல் மூலத்தின் உண்மையான பொருள் நெகிழ்வு காக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான சங்கீதத் தலைப்பாக அமைக்கப்பட்டது. இசைச் சூழல் தெளிவாக வைக்கப்பட்டாலும் ‘கித்தீத்’ என்பதன் அறியப்படாத பொருள் ஊகித்து விளக்கப்படவில்லை. அரைப்புள்ளி இசைத் தலைவருக்கான அறிவுறுத்தலையும் கித்தீத் குறிப்பையும் இணைக்கிறது.
