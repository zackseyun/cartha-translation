source:
  edition: WLC
  text: יְהוָ֤ה אֲדֹנֵ֗י/נוּ מָֽה אַדִּ֣יר שִׁ֭מְ/ךָ בְּ/כָל הָ/אָ֑רֶץ אֲשֶׁ֥ר תְּנָ֥/ה ה֝וֹדְ/ךָ֗ עַל הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
translation:
  language: ta
  text: 'யாவே[a], எங்கள் ஆண்டவரே,


    பூமியெங்கும் உமது பெயர் எவ்வளவு மாட்சிமைமிக்கது!


    உமது மேன்மையை வானங்களுக்குமேல் வைத்திருக்கிறீர்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் YHWH; மரபாக “கர்த்தர்” என்றும், “யெகோவா” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: எபிரெய மசோரா உயிர்க்குறியீட்டின்படி இச்சொல் “வையுங்கள்” என்ற கட்டளை வடிவமாக உள்ளது. ஆனால் இவ்விடத்தின் எபிரெயத் தொடர் இலக்கண ரீதியாகக் கடினமானதால், சூழலுக்கு ஏற்ப “வைத்திருக்கிறீர்” என்றும் புரிந்துகொள்ளப்படுகிறது.
    reason: textual_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை, பட்டப்பெயராக மாற்றாமல் நவீனத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֲדֹנֵינוּ
  choice: எங்கள் ஆண்டவரே
  rationale: முதல் நபர் பன்மை உரிமை விகுதியையும் நேரடி அழைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָה אַדִּיר
  choice: எவ்வளவு மாட்சிமைமிக்கது
  rationale: מָה என்பதன் வியப்புணர்வையும் אַדִּיר என்பதன் மகத்துவம், மேன்மை சார்ந்த பொருளையும் காக்கிறது.
- source_word: שִׁמְךָ
  choice: உமது பெயர்
  rationale: தேவனுடைய வெளிப்பட்ட நற்பெயர் மற்றும் பிரசன்னத்தைச் சுட்டும் எபிரெய உருவகத்தை விளக்கவுரை செய்யாமல் அப்படியே காக்கிறது.
- source_word: בְּכָל־הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: அடுத்த வரியின் வானங்கள் என்ற அண்டவெளிப் பின்னணிக்கு ஏற்ற உலகளாவிய பரப்பைச் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: הוֹדְךָ
  choice: உமது மேன்மை
  rationale: הוֹד என்பதிலுள்ள ஒளிவீசும் மகிமை, கண்ணியம், மாட்சிமை ஆகிய கருத்துகளை இயல்பான கவிதைத் தமிழில் தருகிறது; முந்தைய வரியின் மாட்சிமைமிக்கது என்பதோடு தேவையற்ற ஒரேசொல் மறுபடியைத் தவிர்க்கிறது.
- source_word: עַל הַשָּׁמָיִם
  choice: வானங்களுக்குமேல்
  rationale: தேவனுடைய மேன்மை வானங்களையும் கடந்து உயர்ந்திருப்பதைக் காட்டும் עַל என்பதன் இடவியல் படிமத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக இருப்பதால் அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது. வாசக மரபில் பரவலான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: תְּנָה என்ற வடிவத்தின் இலக்கணச் சிக்கல்
  choice: வைத்திருக்கிறீர்
  alternative: வையுமே
  rationale: சூழலும் கவிதையின் புகழ்ச்சித் தொடரும் நிறைவேறிய தெய்வச் செயலைச் சுட்டுவதாகப் புரிந்துகொள்ள இடமளிக்கின்றன; எனினும் மசோரா உயிர்க்குறியீட்டுப்படி இது கட்டளை வடிவமாகத் தோன்றுவதால் அந்த உண்மையான உரைத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நேரடி அழைப்பை “ஆண்டவரே” என்றும் மரியாதை ஒருமையை “உமது/வைத்திருக்கிறீர்” என்றும் வழங்கி, வழிபாட்டுக்குரிய கண்ணியமான நவீனத் தமிழ் நடை பேணப்பட்டுள்ளது. மூன்று கவிதை வரிகளாக அமைத்து வியப்பும் உயர்வும் தெளிவாக ஒலிக்கச் செய்யப்பட்டுள்ளது.
