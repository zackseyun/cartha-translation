source:
  edition: WLC
  text: יְהוָ֥ה אֲדֹנֵ֑י/נוּ מָֽה אַדִּ֥יר שִׁ֝מְ/ךָ֗ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/009.yaml
  text: O Yahweh[a], our Lord[b], how majestic is your name in all the earth!
translation:
  language: ta
  text: யாவே[a], எங்கள் ஆண்டவரே, உமது பெயர் பூமியெங்கும் எவ்வளவு மாட்சிமையானது![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH.” மரபாக “கர்த்தர்” என்று மொழிபெயர்க்கப்படுகிறது; “யாவே” என்பது ஒலிபெயர்ப்பு.'
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உமது பெயர் பூமியெங்கும் எவ்வளவு சிறப்புமிக்கது!”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் நீண்டகாலமாக அறியப்பட்ட ஒலிபெயர்ப்பில் தருகிறது; மூலத்தின் நேரடி அழைப்பையும் காக்கிறது.
- source_word: אֲדֹנֵינוּ
  choice: எங்கள் ஆண்டவர்
  rationale: இறை அதிகாரத்தையும் ஆட்சியுரிமையையும் இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது; அழைப்புமுறையில் ‘எங்கள் ஆண்டவரே’ என வருகிறது.
- source_word: מָה
  choice: எவ்வளவு
  rationale: பெயரடையுடன் வரும் வியப்புக் கட்டமைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַדִּיר
  choice: மாட்சிமையானது
  rationale: இச்சூழலில் உள்ள மேன்மை, பெருமை, வல்லமை ஆகிய நிழற்பொருள்களைச் சுருக்கமாகக் காக்கிறது; ‘சிறப்பானது’ என்பதைக் காட்டிலும் அரசமிகு பெருமையை நன்கு தெரிவிக்கிறது.
- source_word: שִׁמְךָ
  choice: உமது பெயர்
  rationale: எபிரெய வெளிப்பாட்டை அப்படியே காத்து, பெயர் குறிக்கும் புகழ், கனத்தன்மை, வெளிப்படுத்தப்பட்ட தன்மை ஆகியவற்றை விளக்கவுரையாக முதன்மை உரையில் சேர்க்கவில்லை.
- source_word: בְּכָל הָאָרֶץ
  choice: பூமியெங்கும்
  rationale: சங்கீதத்தின் உலகளாவிய பரப்பை இயல்பான தமிழில் தெரிவிக்கிறது; உள்ளூர் ‘நாடு’ என்ற பொருளைத் தவிர்க்கிறது.
theological_decisions:
- issue: יְהוָה אֲדֹנֵינוּ என்ற இறைப்பெயர்–பட்ட வரிசையை மொழிபெயர்த்தல்
  choice: யெகோவாவே, எங்கள் ஆண்டவரே
  alternative: யாவே, எங்கள் ஆண்டவரே; கர்த்தாவே, எங்கள் ஆண்டவரே
  rationale: மூலத்தில் தனிப்பெயரும் அதனைத் தொடர்ந்து அதிகாரப் பட்டமும் வருகின்றன. இரண்டையும் வேறுபடுத்திக் காத்து, தமிழில் வழக்கமான நேரடி அழைப்பாக வழங்குகிறது. துல்லியமான பண்டைய உச்சரிப்பு உறுதியற்றிருப்பதால் மாற்று ஒலிபெயர்ப்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான இறை அழைப்புமுறைக்காக ‘உமது’ மற்றும் ‘ஆண்டவரே’ பயன்படுத்தப்பட்டுள்ளன. கவிதைமிக்க வியப்பையும் சுருக்கத்தையும் காக்க ‘பூமியெங்கும்’ மற்றும் ‘எவ்வளவு மாட்சிமையானது’ தேர்ந்தெடுக்கப்பட்டுள்ளன.
