source:
  edition: WLC
  text: סָבִ֗יב רְשָׁעִ֥ים יִתְהַלָּכ֑וּ/ן כְּ/רֻ֥ם זֻ֝לּ֗וּת לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/008.yaml
  text: The wicked walk all around[b][a], when vileness is exalted among the sons of man.
translation:
  language: ta
  text: 'மனிதர்களிடையே[a] இழிவானது உயர்த்தப்படும்போது,

    தீயவர்கள் எங்கும் நடமாடுகிறார்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “மனிதரின் பிள்ளைகளிடையே” என்று உள்ளது; இது பொதுவாக மனிதர்களை அல்லது மனிதகுலத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தீயவர்கள் எல்லாப் பக்கங்களிலும் சுற்றித் திரிகிறார்கள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: சூழ்ந்துள்ள எல்லாப் பக்கங்களிலும் நிகழும் நடமாட்டத்தைக் குறிக்கும் வினையடைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: தீமை செய்கிற நபர்களைக் குறிக்கும் பெயர்ச்சொல் தன்மையுள்ள பன்மையை, பாலினத்தைத் தேவையின்றிக் குறிப்பிடாமல் தெளிவாகத் தருகிறது.
- source_word: יִתְהַלָּכוּן
  choice: உலாவுகிறார்கள்
  rationale: הלך என்பதன் ஹித்பயேல் வடிவம் அங்குமிங்கும் அல்லது சுற்றித் திரிவதைக் குறிக்கிறது. ‘உலாவுகிறார்கள்’ அடிப்படை நடமாட்டப் படிமத்தைப் பேணுகிறது; ‘வேட்டையாடித் திரிகிறார்கள்’ போன்ற சொற்கள் மூலத்தைவிட வலுவான விளக்கத்தைச் சேர்க்கும்.
- source_word: כְּרֻם
  choice: உயர்த்தப்படும்போது
  rationale: கடினமான כְּ + רום அமைப்பை, தீயவர்கள் தடையின்றி நடமாடும் சூழ்நிலை அல்லது காலத்தைக் காட்டுவதாக எடுத்துரைக்கிறது; செயப்பாட்டு நுணுக்கத்தையும் பேணுகிறது.
- source_word: זֻלּוּת
  choice: இழிவானது
  rationale: மதிப்பற்ற, கீழ்த்தரமான, அருவருக்கத்தக்க ஒன்றைக் குறிக்கும் அரிய பெயர்ச்சொல்லின் பரந்த பொருளைத் திறந்தவாறே வைத்திருக்கிறது; ஒழுக்கக்கேடு என்று மட்டும் குறுக்கவில்லை.
- source_word: לִבְנֵי אָדָם
  choice: மனிதர்களிடையே
  rationale: எழுத்துப்படி ‘ஆதாமின்/மனிதனின் மக்களிடையே’ என்ற எபிரெய மரபுத்தொடர் பொதுவாக மனிதகுலத்தைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் அனைவரையும் உள்ளடக்கும் மூலப் பொருளோடும் தரப்படுகிறது.
theological_decisions:
- issue: לִבְנֵי אָדָם என்ற மனிதவியல் மரபுத்தொடர்
  choice: மனிதர்களிடையே
  alternative: மனுமக்களிடையே / மனிதகுலத்திடையே
  rationale: எபிரெயில் இலக்கண ரீதியாக ஆண்பால் வடிவம் இருந்தாலும் அதன் குறிப்பு பொதுவான மனிதர்களே. தமிழில் ‘மனிதர்களிடையே’ என்பது அந்தப் பொதுக் குறிப்பைத் துல்லியமாகவும் இயல்பாகவும் தருகிறது; அடிக்குறிப்பு சொல்லுக்குச் சொல் அமைப்பை வெளிப்படுத்துகிறது.
- issue: כְּרֻם என்பதன் தொடர்பு
  choice: உயர்த்தப்படும்போது
  alternative: உயர்த்தப்படுவதால் / உயர்த்தப்படுவதற்கேற்ப
  rationale: כְּ முன்னொட்டின் தொடர்பு காலம், சூழ்நிலை, அல்லது ஒப்புமை எனப் புரியக்கூடிய அளவுக்கு சுருக்கமானது. முதன்மை உரை இயல்பான கால-சூழ்நிலைப் பொருளைத் தருகிறது; காரணத் தொடர்பைத் தேவையின்றி உறுதிப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் கண்ணியமும் பேணப்பட்டுள்ளன. இரண்டு அடிகளாக அமைத்து எபிரெயக் கவிதையின் சூழ்நிலைத் தொடர்பைத் தெளிவாக்கியுள்ளது. ‘இழிவானது’ என்பது அரிய மூலச்சொல்லின் மதிப்பின்மை/கீழ்மை நுணுக்கத்தை மிகையாக விளக்காமல் தக்கவைக்கிறது.
