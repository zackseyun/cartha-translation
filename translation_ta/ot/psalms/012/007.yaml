id: PSA.12.7
reference: Psalms 12:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַתָּֽה יְהוָ֥ה תִּשְׁמְרֵ֑/ם תִּצְּרֶ֓/נּוּ מִן הַ/דּ֖וֹר ז֣וּ לְ/עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/007.yaml
  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
translation:
  language: ta
  text: 'யாவே, நீரே அவர்களைக் காப்பீர்;

    இந்தத் தலைமுறையிடமிருந்து அவனை[a] என்றென்றும் பாதுகாப்பீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் முதலில் பன்மை (‘அவர்களைக் காப்பீர்’) வந்த பின் ஒருமை (‘அவனைப் பாதுகாப்பீர்’) வருகிறது. சில மொழிபெயர்ப்புகள் இரண்டாவதையும் ‘அவர்களைப் பாதுகாப்பீர்’ என்று பன்மையாக்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: אַתָּה
  choice: நீரே
  rationale: தனியாகவும் வாக்கியத்தின் முன்னிலையிலும் வரும் இரண்டாம் நபர் ஒருமைப் பெயர்ப்பதிலி வலியுறுத்தலைக் காட்டுகிறது; மரியாதைமிக்க நவீன தமிழில் ‘நீரே’ அந்த வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பட்ட பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: תִּשְׁמְרֵם
  choice: அவர்களைக் காப்பீர்
  rationale: שׁמר என்பது ‘காத்தல், பாதுகாத்தல்’ என்று பொருள்படும்; மூன்றாம் நபர் பன்மை விகுதி ‘அவர்களை’ எனத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: תִּצְּרֶנּוּ
  choice: அவனைப் பாதுகாப்பீர்
  rationale: נצר என்பது ‘பாதுகாத்தல், பத்திரமாகக் காத்தல்’ என்று பொருள்படும். மசோரா உயிர்க்குறிப்பின்படி உள்ள மூன்றாம் நபர் ஆண்பால் ஒருமையை ‘அவனை’ எனப் பாதுகாத்து, முந்தைய பன்மையுடன் ஒத்திசைக்கவில்லை.
- source_word: מִן הַדּוֹר זּוּ
  choice: இந்தத் தலைமுறையிடமிருந்து
  rationale: מִן என்பதன் பிரித்தல்/விலக்கிக் காத்தல் பொருளையும், דור என்பதன் இயல்பான ‘தலைமுறை’ பொருளையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: கவிதை மற்றும் வேண்டுதல் சூழலில் நீடித்த காலத்தைக் குறிக்கும் இயல்பான தமிழ் சொல்.
theological_decisions:
- issue: முதல் வினையின் பன்மைப் பொருளுக்கும் இரண்டாம் வினையின் ஒருமைப் பொருளுக்கும் இடையிலான எண்ணிக்கை மாற்றம்
  choice: ‘அவர்களைக் காப்பீர் … அவனைப் பாதுகாப்பீர்’ என்று மசோரா வாசகத்தின் மாற்றத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘அவர்களைக் காப்பீர் … அவர்களைப் பாதுகாப்பீர்’ என்று இரண்டையும் பன்மையாக ஒத்திசைத்தல்
  rationale: எபிரெய உரையில் முதலில் பன்மையும் பின்னர் ஒருமையும் வருகிறது. ஒருமை ஏழைகளில் ஒவ்வொருவரையோ ஓர் பிரதிநிதியையோ குறிக்கலாம்; ஆனால் அந்த விளக்கத்தை முதன்மை உரையில் கட்டாயப்படுத்தாமல், உண்மையான இலக்கண இழுபறி பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற மரியாதைமிக்க எளிய நடையைப் பயன்படுத்துகிறது. ‘நீரே’ முன்னிலை வலியுறுத்தலைத் தக்கவைக்கிறது; இணையான இரு அடிகளில் ‘காப்பீர் / பாதுகாப்பீர்’ என இயல்பான கவிதை ஒத்தமைவு உள்ளது.
