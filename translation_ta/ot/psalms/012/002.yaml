  yaml_path: translation/ot/psalms/012/002.yaml
  text: They speak emptiness[a], each man to his neighbor; with flattering lips[b], with a double heart they speak.
translation:
  language: ta
  text: ஒவ்வொருவனும் தன் அயலானிடம் வெற்றுப் பேச்சைப் பேசுகிறான்; முகஸ்துதி பேசும் உதடுகளாலும், இரட்டை உள்ளத்தோடும் பேசுகிறான்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மென்மையான உதடுகளால்.’ எபிரெய உருவகம் வழுவழுப்பான, இனிமையான, அதனால் வஞ்சகமான பேச்சைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘உள்ளத்தோடும் உள்ளத்தோடும் பேசுகிறான்’; இது இரட்டை நோக்கம் அல்லது இருமுகத்தன்மையைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: வீணானவற்றை
  rationale: இந்தச் சொல் வெறுமையான, பயனற்ற, பொய்யானவற்றைக் குறிக்கக்கூடும். ‘வீணானவற்றை’ என்பது அதன் பரந்த பொருள் எல்லையைத் தக்கவைத்து, வெறும் உண்மைக்குப் புறம்பான கூற்றுகளாக மட்டும் குறுக்கவில்லை.
- source_word: יְדַבְּרוּ / יְדַבֵּרוּ
  choice: பேசுகிறான் / பேசுகிறார்கள்
  rationale: דבר என்பதன் நேரடியான பொருள் ‘பேசுதல்.’ முதல் வினைச்சொல் பகிர்ந்தளிக்கும் ஒருமையான ‘ஒவ்வொருவனும்’ என்பதற்கு ஏற்ப தமிழில் ஒருமையாகவும், இறுதி வினைச்சொல் எபிரெயச் செய்யுள் மீளுரையைப் பேணப் பன்மையாகவும் வழங்கப்பட்டுள்ளது.
- source_word: אִישׁ
  choice: ஒவ்வொருவனும்
  rationale: எபிரெயில் ஆண்பால் ஒருமைச் சொல் பகிர்ந்தளிக்கும் பொருளில் வந்துள்ளது. ‘ஒவ்வொருவனும்’ மூலத்தின் வடிவத்தையும் ‘ஆளுக்கு ஆள்’ என்ற வலியுறுத்தலையும் பேணுகிறது.
- source_word: רֵעֵהוּ
  choice: தன் அயலானிடம்
  rationale: רֵעַ என்பது அயலான், தோழன் அல்லது உடனிருப்பவன் எனப் பொருள்படலாம். இங்கு சமூக உறவின் பரந்த தன்மையை ‘அயலான்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: שְׂפַת חֲלָקוֹת
  choice: முகஸ்துதி செய்யும் உதடுகளால்
  rationale: சொல்லுக்கு சொல் ‘மென்மையானவற்றின் உதடு’ அல்லது ‘மிருதுவான உதடுகள்.’ சூழலில் வஞ்சகமான இனிய பேச்சைக் குறிப்பதால், ‘முகஸ்துதி செய்யும் உதடுகள்’ தமிழில் தெளிவாகவும் உருவகத்தைப் பேணியும் உள்ளது.
- source_word: בְּלֵב וָלֵב
  choice: இரட்டை உள்ளத்தோடு
  rationale: சொல்லுக்கு சொல் ‘உள்ளமும் உள்ளமும்’ என்ற இந்த மரபுத்தொடர் இரட்டை நோக்கம் அல்லது உள்ளார்ந்த இருமுகத்தன்மையைக் குறிக்கிறது. ‘இரட்டை உள்ளம்’ மூல உருவகத்தை விளக்கமாக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: בְּלֵב וָלֵב என்பதின் இருமுகத்தன்மை
  choice: இரட்டை உள்ளத்தோடு
  alternative: பிளவுபட்ட உள்ளத்தோடு / வஞ்சகமாக
  rationale: இது உள்ளார்ந்த பிளவைக் குறிக்கிறதா அல்லது திட்டமிட்ட இரட்டை நோக்கைக் குறிக்கிறதா என்பதை உரை முழுமையாகத் தீர்மானிக்கவில்லை. ஆகவே விளக்கவுரையான மாற்றுகளை விட மூல உருவகமே பேணப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘உதடுகள்’ மற்றும் ‘இரட்டை உள்ளம்’ ஆகிய உடலுறுப்பு உருவகங்கள் பேணப்பட்டுள்ளன; இறுதியில் ‘பேசுகிறார்கள்’ என்ற மீளுரையும் தக்கவைக்கப்பட்டுள்ளது.
