  text: 'For the choirmaster: according to The Eighth[a]. A psalm of David[b].'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: “எட்டாவதின்படி.” தாவீதின் சங்கீதம்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடும் நபரைக் குறிக்கும் வழக்கமான சொல்லாக இருப்பதால், அதன் இசை மற்றும் வழிபாட்டுச் செயல்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: என்பதன்படி
  rationale: இங்கு ஓர் இசைமுறை, மெட்டு, அல்லது நிகழ்த்தல் குறியீட்டை அறிமுகப்படுத்தக்கூடும்; மூலத்தில் உள்ள குறிப்பு சார்ந்த தொடர்பை மிகையாகத் தீர்மானிக்காமல் தமிழில் தெரிவிக்கிறது.
- source_word: הַשְּׁמִינִית
  choice: “எட்டாவது”
  rationale: எபிரெயச் சொல்லின் நேரடியான பொருளைத் தக்கவைத்து, இது ஒரு சிறப்புப் பெயர் அல்லது இசை/வழிபாட்டுக் குறியீடு என்பதை மேற்கோள் குறிகள் உணர்த்துகின்றன.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இந்த இலக்கிய மற்றும் வழிபாட்டு வகைப்பாட்டிற்கான நிலைபெற்ற, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ்ச் சொல்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: தாவீதுடனான உறவைச் சுருக்கமாகக் குறிக்கிறது; ஆசிரியத்துவம், அர்ப்பணம், உடைமை, அல்லது தொடர்பு ஆகியவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல், அடிக்குறிப்பில் மாற்று வாசிப்புகளை வழங்க இடமளிக்கிறது.
theological_decisions:
- issue: தலைப்பிலுள்ள לְדָוִד என்பது தாவீதின் ஆசிரியத்துவத்தையா, அவருக்கான அர்ப்பணிப்பையா, அல்லது அவருடனான தொடர்பையா குறிக்கிறது?
  choice: தாவீதின்
  alternative: தாவீதால் இயற்றப்பட்டது; தாவீதுக்காக; தாவீதுக்குரியது
  rationale: எபிரெய முன்விகுதி துல்லியமான ஒரே உறவை நிர்ணயிப்பதில்லை. ஆகவே விவாதத்துக்குரிய வரலாற்று அல்லது ஆசிரியத்துவக் கேள்வியை மொழிபெயர்ப்பிலேயே முடிவுசெய்யாமல் மூலத்தின் தெளிவின்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான சங்கீதத் தலைப்பு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. “எட்டாவது” என்ற மறைபொருளுள்ள இசைக் குறிப்பு விளக்கமாக மாற்றப்படாமல் தக்கவைக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; “தாவீதின்” என்பதன் உறவுசார் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளது.
