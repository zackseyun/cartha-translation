theological_decisions:
- issue: யாவேயின் சொற்களுடைய தூய்மையின் தன்மை
  choice: யாவேயின் சொற்கள் முற்றிலும் தூயவையாகவும் நம்பத்தக்கவையாகவும் இருப்பதை உலோகம் சுத்திகரிக்கப்படும் உருவகத்தின் மூலம் உரை கூறுகிறது.
  alternative: இதை அறத்தூய்மை பற்றி மட்டுமே பேசுவதாகக் குறுக்குதல், அல்லது பிற்கால வேதப்பாடப் பாதுகாப்புக் கோட்பாடுகளை இவ்வசனத்தில் சேர்த்தல்.
  rationale: எபிரெய உரை யாவேயின் சொற்களை முழுமையாகச் சுத்திகரிக்கப்பட்ட வெள்ளியுடன் ஒப்பிடுகிறது. அந்தக் கவித்துவக் கூற்றைப் பாதுகாத்து, வசனம் நேரடியாகக் கூறாத பிற்காலக் கோட்பாடுகளைச் சேர்க்கவில்லை.
