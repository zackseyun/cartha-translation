  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘புடமிடப்பட்டு’ என்பது உலோகவியல் உருவகத்தை இயல்பாகத் தக்கவைக்கிறது. அரிதான בַּעֲלִיל மற்றும் சிக்கலான לָאָרֶץ ஆகியவற்றின் நிச்சயமின்மை அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
