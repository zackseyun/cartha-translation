  yaml_path: translation/ot/psalms/012/006.yaml
  text: The words of Yahweh are pure words[a], like silver refined in a furnace on the earth[b], purified seven times.
translation:
  language: ta
  text: யாவேயின் சொற்கள் தூய சொற்கள்; உலையில்[a] புடமிடப்பட்ட வெள்ளியைப் போன்றவை, பூமியின்மேல்[b] ஏழு முறை சுத்திகரிக்கப்பட்டவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உருக்குப் பாத்திரத்தில்’ அல்லது ‘புடமிடும் கலத்தில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் அரிதானது; அது துல்லியமாக எதைக் குறிக்கிறது என்பது உறுதியில்லை. ஆனால் உலோகத்தைச் சுத்திகரிக்கும் செயலுடன் தொடர்புடையது என்பது தெளிவு.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘பூமியின்மேல்.’ இத்தொடர் சுத்திகரிப்பு நடைபெறும் இடத்தையோ சூழலையோ குறிக்கலாம்; அதன் துல்லியமான நுட்பம் உறுதியில்லை.
    reason: lexical_alternative
