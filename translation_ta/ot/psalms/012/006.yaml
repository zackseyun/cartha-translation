  rationale: அரிதான இச்சொல்லின் துல்லியமான பொருள் உறுதியில்லை; ஆயினும் வெள்ளியைச் சுத்திகரிக்கும் உலை அல்லது உருக்குப் பாத்திரம் என்னும் உலோகவியல் சூழலை இந்தத் தேர்வு தெளிவாக வைத்திருக்கிறது.
