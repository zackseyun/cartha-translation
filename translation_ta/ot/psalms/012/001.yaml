source:
  edition: WLC
  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save[a], O Yahweh, for the godly are gone[b]; for the faithful have vanished from among the sons of man.
translation:
  language: ta
  text: யாவே, காப்பாற்றும்! ஏனெனில் இறைப்பற்றுள்ளவர்[a] காணாமற்போய்விட்டார்; நம்பிக்கைக்குரியோர் மனிதர்களிடையே[b] இல்லாமற்போயினர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் ஒருமை: ‘இறைப்பற்றுள்ள ஒருவன்’; இது இறைப்பற்றுள்ளோர் என்ற தொகுப்புப் பொருளையும் குறிக்கலாம்.'
    reason: grammatical_ambiguity
  - marker: b
    text: எபிரெயத்தில் ‘மனிதரின் பிள்ளைகளிடமிருந்து’; மனித சமூகத்திலிருந்து அல்லது மனிதர்களிடையே என்பதைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: காப்பாற்றும்
  rationale: ישׁע என்பதன் வலியுறுத்தப்பட்ட வேண்டுகோள் வடிவம்; கடவுளை நேரடியாக நோக்கும் அவசரமான மன்றாட்டை இயல்பான தமிழ் வழிபாட்டு நடையில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டமல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துப் பெயர்; தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: כִּי
  choice: (தனி இணைப்புச்சொல் இன்றி காரணத் தொடராக)
  rationale: இரு இடங்களிலும் வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் அரைப்புள்ளிக்குப் பின் காரண நிலையை நேரடியாகச் சொல்வது இயல்பாகவும் கவிதைநயத்துடனும் உள்ளது.
- source_word: גָמַר חָסִיד
  choice: இறைப்பற்றுள்ளோர் இல்லாமற்போயினர்
  rationale: גמר என்பது முடிவுறுதல் அல்லது இல்லாமற்போதலைக் குறிக்கிறது; חָסִיד ஒருமை வடிவில் இருந்தாலும் ஒரு வகுப்பைத் தொகுப்பாகக் குறிக்கக்கூடும். தமிழில் மரியாதை/தொகுப்பு பன்மை சமூகத்திலிருந்து அத்தகையோர் மறைந்த நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פַסּוּ אֱמוּנִים
  choice: நம்பிக்கைக்குரியோர் மறைந்துபோயினர்
  rationale: פסס என்பது இல்லாமற்போதல் அல்லது மறைதலைக் குறிக்கிறது; אֱמוּנִים என்பது நம்பகத்தன்மை, உண்மைத்தன்மை உடையவர்களைச் சுட்டுகிறது. ‘நம்பிக்கைக்குரியோர்’ மனிதர்களின் ஒழுக்க மற்றும் சமூக நம்பகத்தன்மையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִבְּנֵי אָדָם
  choice: மனிதர்களிடையே
  rationale: சொல்லுக்கு சொல் ‘மனிதனின் மக்களிடமிருந்து’ என்ற எபிரெய மரபுத்தொடர் மனித சமூகத்தைச் சுட்டுகிறது; ‘மனிதர்களிடையே’ அதன் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பெயர் நேரடியாக உள்ளது; எனவே அதை பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: חָסִיד என்பதன் ஒருமை மற்றும் தொகுப்புப் பொருள்
  choice: இறைப்பற்றுள்ளோர்
  alternative: இறைப்பற்றுள்ள ஒருவன்
  rationale: எபிரெயச் சொல் இலக்கண ஒருமையாக இருந்தாலும் சமூகத்தில் ஒரு பண்புடைய வகுப்பைச் சுட்டும் தொகுப்பு ஒருமையாகப் புரிந்துகொள்ளலாம். உடன்வரும் அடுத்த அடியின் பன்மையும் இப்பொருளுக்கு ஆதரவாக உள்ளது; தனிநபர் வாசிப்பை முற்றிலும் நிராகரிக்காமல் மொழியாக்கம் சமூகப் புலம்பலை முன்னிறுத்துகிறது.
- issue: חָסִיד என்பதிலுள்ள உடன்படிக்கைச் சார்ந்த பற்றுறுதி
  choice: இறைப்பற்றுள்ளோர்
  alternative: பற்றுறுதியுள்ளோர்
  rationale: சொல் பக்தி, இறைப்பற்று, உண்மையான பற்றுறுதி ஆகிய பொருள்களை ஏந்துகிறது. சூழலில் இறைநெறி சார்ந்த மனிதர்களைக் குறிக்க ‘இறைப்பற்றுள்ளோர்’ தெளிவாக உள்ளது; குறிப்பிட்ட சமயக் கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சுருக்கமான புலம்பல்-மன்றாட்டு நடை. ‘காப்பாற்றும்’ என்ற உயர்நடை வேண்டுகோள் சங்கீதத் தொனிக்கு ஏற்றது. மூலத்தின் இரண்டு இணையான காரணக் கூறுகளும் அரைப்புள்ளியால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
