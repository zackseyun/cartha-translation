source:
  edition: WLC
  text: אֲשֶׁ֤ר אָֽמְר֨וּ לִ/לְשֹׁנֵ֣/נוּ נַ֭גְבִּיר שְׂפָתֵ֣י/נוּ אִתָּ֑/נוּ מִ֖י אָד֣וֹן לָֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/004.yaml
  text: who say[a], “With our tongue we will prevail[d][c][b]; our lips are with us—who is lord over us?”
translation:
  language: ta
  text: “எங்கள் நாவால் நாங்கள் மேலோங்குவோம்[a]; எங்கள் உதடுகள் எங்கள் வசம் உள்ளன[b]—எங்களுக்கு எஜமான் யார்?[c]” என்று சொல்கிறவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் நாவை வலிமையாக்குவோம்.” எபிரெயச் சொற்றொடரை நாவைச் செயலின் கருவியாகவோ, வலிமைப்படுத்தப்படும் பொருளாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “எங்கள் உதடுகள் எங்களுடன் இருக்கின்றன”; “எங்கள் உதடுகள் எங்களுக்குச் சொந்தம்” அல்லது “எங்கள் உதடுகள் எங்கள் பக்கம் இருக்கின்றன” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “எங்களை ஆளுகிறவர் யார்?”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: என்று சொல்கிறவர்கள்
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்டவர்களை விவரிக்கும் தொடர்புத் தொடராக உள்ளது. எபிரெயப் perfect இங்கு அவர்களின் தொடர்ந்த மனப்பான்மையை எடுத்துரைப்பதால் நிகழ்காலத் தன்மையுள்ள தமிழாக்கம் இயல்பாகிறது.
- source_word: לִלְשֹׁנֵנוּ
  choice: எங்கள் நாவால்
  rationale: לְ என்ற முன்னொட்டை இச்சூழலில் கருவிப்பொருளில் புரிந்துகொண்டு, பேச்சையே மேலோங்குவதற்கான கருவியாக அவர்கள் கருதுவதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: נַגְבִּיר
  choice: நாங்கள் மேலோங்குவோம்
  rationale: גבר என்பதன் Hiphil வடிவம் வலிமை காட்டுதல் அல்லது மேலாதிக்கம் பெறுதல் என்னும் பொருளைக் கொண்டது; தற்பெருமையான பேச்சின் சூழலில் ‘மேலோங்குவோம்’ பொருத்தமானது.
- source_word: שְׂפָתֵינוּ
  choice: எங்கள் உதடுகள்
  rationale: ‘பேச்சு’ என்று கருத்தாக்காமல், மூலத்தின் தெளிவான உடல் உறுப்புப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: אִתָּנוּ
  choice: எங்கள் வசம் உள்ளன
  rationale: சொல்லுக்குச் சொல் ‘எங்களுடன்’ என்றாலும், இங்கு தங்கள் பேச்சு தங்கள் கட்டுப்பாட்டிலேயே இருப்பதாகக் கூறும் தற்பெருமையை இயல்பான தமிழில் தெரிவிக்கிறது; நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מִי אָדוֹן לָנוּ
  choice: எங்களுக்கு எஜமான் யார்?
  rationale: எந்த அதிகாரத்திற்கும் தாங்கள் உட்பட்டவர்கள் அல்ல என்று மறுக்கும் கேள்வியாகும். ‘எஜமான்’ என்பது இங்கு பொதுவான ஆளுகையாளரைக் குறிக்கிறது; கடவுளின் தனிப்பட்ட பெயரையோ பட்டத்தையோ குறிக்கவில்லை.
theological_decisions:
- issue: אָדוֹן என்பதைக் கடவுளுக்குரிய சிறப்புப் பட்டமாகப் புரிந்துகொள்ளும் சாத்தியம்
  choice: எஜமான்
  alternative: ஆண்டவர்
  rationale: இங்கு אָדוֹן என்பது பொதுவாக அதிகாரம் செலுத்தும் எஜமானை அல்லது தலைவரைக் குறிக்கிறது. ‘ஆண்டவர்’ என்பது தமிழில் கடவுளைக் குறிப்பதாக எளிதில் புரிந்துகொள்ளப்படலாம்; ஆகவே மூலத்தில் இல்லாத குறிப்பிட்ட இறையியல் அடையாளத்தைச் சேர்க்காமல் ‘எஜமான்’ பயன்படுத்தப்பட்டது.
- issue: אִתָּנוּ வெளிப்படுத்தும் உறவு
  choice: எங்கள் வசம் உள்ளன
  alternative: எங்களுடனே இருக்கின்றன
  rationale: இந்தச் சொற்றொடர் உடனிருப்பை மட்டுமல்லாமல், தங்கள் உதடுகள் தங்கள் கட்டுப்பாட்டில் இருப்பதாகவும் தாங்கள் விரும்பியபடி பேசலாம் என்றும் தற்பெருமை கொள்வதைச் சுட்டலாம். எனினும் மூலத்தின் சுருக்கமான சொற்றொடரில் உள்ள பன்முகத்தன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய சுருக்கத்தையும் தற்பெருமையான குரலையும் தக்கவைத்துள்ளது. ‘நாவு’, ‘உதடுகள்’ என்ற இணையான மூலப் படிமங்கள் பாதுகாக்கப்பட்டுள்ளன. ‘எஜமான்’ பொதுவான அதிகார உறவைக் குறிக்கிறது; இறைப்பெயராகப் புரிந்துகொள்ள வேண்டியதில்லை.
