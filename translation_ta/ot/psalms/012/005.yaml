source:
  edition: WLC
  text: מִ/שֹּׁ֥ד עֲנִיִּים֮ מֵ/אַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝/יֵ֗שַׁע יָפִ֥יחַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
translation:
  language: ta
  text: '“ஏழைகள் அனுபவிக்கும் அழிவினாலும்,

    தேவையுள்ளவர்களின் பெருமூச்சினாலும்,

    இப்போது நான் எழுவேன்,” என்று யாவே சொல்கிறார்;

    “அவன் ஏங்கும் பாதுகாப்பில் அவனை வைப்பேன்.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இறுதித் தொடரின் எபிரெய வாசகம் பொருள் காண்பதற்குக் கடினமானது. சொல்லுக்குச் சொல் நெருக்கமாக, “பாதுகாப்பில் வைப்பேன்; அவன் அதற்காக மூச்சுவிடுகிறான்” என்றும் மொழிபெயர்க்கலாம். வேறு சிலர், “அவனை நோக்கிச் சீறுகிறவனிடமிருந்து அவனைப் பாதுகாப்பில் வைப்பேன்” என்பதுபோன்ற பொருளில் எடுத்துக்கொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  choice: ஏழைகள் அழிக்கப்படுவதாலும்
  rationale: מִן காரணத்தைக் குறிக்கிறது; שֹׁד அழிவை விளைவிக்கும் வன்முறை அல்லது சூறையாடலைக் குறிக்கலாம். இயல்பான தமிழில் பாதிக்கப்பட்டவர்களை முன்னிறுத்தி, கடுமையான ஒடுக்குதலின் விளைவை இந்த மொழிபெயர்ப்பு தெரிவிக்கிறது.
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  choice: தேவையிலுள்ளவர்கள் பெருமூச்சு விடுவதாலும்
  rationale: இணையான இரண்டாவது காரணத் தொடரைத் தக்கவைத்து, אֶבְיוֹנִים என்பதிலுள்ள வறுமை மட்டுமல்லாது தேவையுள்ள நிலை என்ற நுணுக்கத்தையும், אֲנָקָה என்பதிலுள்ள துயரத்தின் ஒலியையும் வெளிப்படுத்துகிறது.
- source_word: עַתָּה אָקוּם
  choice: இப்போது நான் எழுவேன்
  rationale: உடனடியாகச் செயல்பட முனையும் இறைத் தலையீட்டையும், ‘எழுதல்’ என்ற எபிரெய உருவகத்தையும் தக்கவைக்கிறது.
- source_word: יֹאמַר יְהוָה
  choice: என்று யாவே சொல்கிறார்
  rationale: தெய்வீகப் பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கிறது; உரையின் இயல்பான பேச்சுக் குறிப்பையும் காக்கிறது.
- source_word: אָשִׁית בְּיֵשַׁע
  choice: பாதுகாப்பில் அவனை வைப்பேன்
  rationale: שׂים என்பதன் ‘வை/நிறுத்து’ பொருளையும், יֵשַׁע இச்சூழலில் குறிக்கும் மீட்பினால் கிடைக்கும் பாதுகாப்பான நிலையையும் தெரிவிக்கிறது. எபிரெயத்தில் வெளிப்படையாக இல்லாத செயப்படுபொருள் சூழலிலிருந்து தமிழில் இயல்பாக அளிக்கப்படுகிறது.
- source_word: יָפִיחַ לוֹ
  choice: அவன் ஏங்கும்
  rationale: கடினமான இத்தொடரை ‘அவன் அதற்காக மூச்சுவிடுகிறான்/ஏங்குகிறான்’ என்று புரிந்துகொள்கிறது. இது துயரப்படுகிறவரின் விரும்பிய பாதுகாப்பைச் சுட்டுகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல், நவீன தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: יָפִיחַ לוֹ என்ற இறுதித் தொடரின் பொருள்
  choice: அவன் ஏங்கும் பாதுகாப்பு
  alternative: அவன் அதற்காக மூச்சுவிடுகிறான்; அவனை நோக்கிச் சீறுகிறவனிடமிருந்து பாதுகாப்பு
  rationale: எபிரெயத் தொடர் தெளிவற்றது. சூழலில் ஒடுக்கப்பட்டவர் விரும்பும் பாதுகாப்பு என்பது பொருத்தமான வாசிப்பு; எனினும் மற்ற இலக்கண/சொற்பொருள் வாய்ப்புகள் நிராகரிக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘ஏழைகள்’ மற்றும் ‘தேவையிலுள்ளவர்கள்’ என்று இணைச்சொற்களின் வேறுபாடு காக்கப்பட்டுள்ளது. கவிதை வரிப்பிரிப்பும் நேரடி உரையும் மூலத்தின் அமைப்பைத் தெளிவாக்குகின்றன.
