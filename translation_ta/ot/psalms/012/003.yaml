  rationale: The revision preserves the divine name, the prayer/imprecation force, the parallel objects, and the singular collective ‘tongue.’ It replaces an unnatural Tamil expression for ‘great things’ with a literal, idiomatic rendering and adjusts the notes to distinguish lexical alternatives from separate grammatical elements.
