lexical_decisions:
- source_word: יַכְרֵת
  choice: அறுத்துப்போடுவாராக
  rationale: כרת என்பதன் ‘அறுத்து அகற்றுதல்’ என்ற வலுவான உருவகத்தைத் தக்கவைத்தும், இச்சூழலில் உள்ள வேண்டுதல்/சாபவாக்கின் நுணுக்கத்தை ‘-வாராக’ எனவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துத் திருநாமத்தின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כָּל
  choice: எல்லா
  rationale: பன்மைச் சொற்றொடருடன் இயல்பாக அமையும் முழுமையைக் குறிக்கும் பகிர்வுப் பொருளை வெளிப்படுத்துகிறது.
- source_word: שִׂפְתֵי חֲלָקוֹת
  choice: முகஸ்துதி பேசும் ... உதடுகள்
  rationale: சொல்லுக்குச் சொல் ‘வழவழப்பான உதடுகள்’ என்ற உருவகம் சூழலில் வஞ்சகமான புகழ்ச்சிப் பேச்சைக் குறிக்கிறது; நவீன தமிழில் அதன் நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது, நேரடி உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָשׁוֹן
  choice: நாவை
  rationale: முந்தைய பன்மைச் சொற்றொடருக்குப் பின் வரும் எபிரெய ஒருமையையும் பேச்சுறுப்பின் உயிரோட்டமான உருவகத்தையும் தக்கவைக்கிறது.
- source_word: מְדַבֶּרֶת
  choice: பேசும்
  rationale: ‘நாவு’ என்பதை இயல்பான தமிழ் பெயரெச்சத் தொடராக விளக்குகிறது.
- source_word: גְּדֹלוֹת
  choice: பெருமையானவற்றை
  rationale: சொல்லின் நேரடியான ‘பெரிய/பெருமையான காரியங்கள்’ என்ற திறந்த பொருளைத் தக்கவைக்கிறது; சூழலில் உள்ள தற்பெருமைப் பேச்சு என்ற பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் திருநாமமே நேரடியாக உள்ளது; ஆகவே ‘ஆண்டவர்’ போன்ற பட்டப்பெயரைப் பதிலிடாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- issue: יַכְרֵת என்பதன் வினைநிலை
  choice: 'வேண்டுதல்/சாபவாக்கு: ‘அறுத்துப்போடுவாராக’'
  alternative: 'எதிர்கால உறுதிக்கூற்று: ‘அறுத்துப்போடுவார்’'
  rationale: எபிரெய முற்றுறா வினை இரு நுணுக்கங்களுக்கும் இடமளித்தாலும், சங்கீதச் சூழலில் இது இயல்பாக யாவேயிடம் முன்வைக்கப்படும் வேண்டுதலாக ஒலிக்கிறது; உறுதிக்கூற்றாக மட்டுமே முடிவுசெய்யாமல் வேண்டுதல் வடிவம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான சங்கீத நடையில் வடிவமைக்கப்பட்டது. ‘உதடுகள்’, ‘நாவு’, ‘அறுத்துப்போடுதல்’ ஆகிய எபிரெயக் கவிதை உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன; ‘முகஸ்துதி பேசும்’ என்பது ‘வழவழப்பான உதடுகள்’ என்ற நேரடி உருவகத்தின் இயல்பான தமிழ் வெளிப்பாடு.
