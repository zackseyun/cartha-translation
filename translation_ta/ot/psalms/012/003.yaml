  text: யாவே, முகஸ்துதி செய்யும் எல்லா உதடுகளையும்[a], பெரிய காரியங்களைப் பேசும் நாவையும்[b] அறுத்துப்போடுவாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வழவழப்பான உதடுகள்’; எபிரெய உருவகம் இனிமையாகவும் நயமாகவும் பேசி முகஸ்துதி செய்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
