  - severity: low
    issue: Compound-verb spacing
    rationale: 'Modern standard Tamil normally writes these verbal sequences as separate words: ‘ஒளித்து வைக்கிறீர்,’ ‘மறைத்து வைக்கிறீர்.’ This is orthographic and does not affect meaning.'
