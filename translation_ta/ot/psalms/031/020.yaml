source:
  edition: WLC
  text: תַּסְתִּירֵ֤/ם בְּ/סֵ֥תֶר פָּנֶי/ךָ֮ מֵֽ/רֻכְסֵ֫י אִ֥ישׁ תִּצְפְּנֵ֥/ם בְּ/סֻכָּ֗ה מֵ/רִ֥יב לְשֹׁנֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: You hide them in the shelter of your presence from the schemes of man[b][a]; you conceal them in a shelter from the strife of tongues.
translation:
  language: ta
  text: மனிதனின் சூழ்ச்சிகளிலிருந்து[a] அவர்களை உமது திருமுகத்தின் மறைவில் ஒளித்து வைக்கிறீர்; நாவுகளின் சச்சரவிலிருந்து[b] அவர்களை ஒரு புகலிடத்தில் மறைத்து வைக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மனிதனின் சதிகளிலிருந்து” அல்லது “மனிதனின் கூட்டுச்சூழ்ச்சிகளிலிருந்து.” இங்கு வரும் எபிரேயச் சொல் அரிதானது; அதன் துல்லியமான பொருள் உறுதியில்லை.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “நாவுகளின் சச்சரவிலிருந்து”; அதாவது, பகைமையான அல்லது அவதூறான பேச்சிலிருந்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵם
  choice: அவர்களை ... ஒளித்துவைக்கிறீர்
  rationale: סתר என்பதன் ஹிஃபில் வடிவம் ஒருவரை மறைவாக வைத்தல் அல்லது ஒளித்துவைத்தல் என்னும் செயற்பொருளைக் கொண்டது; இறைவனின் செயலில் வெளிப்படும் பாதுகாப்பை இது இயல்பான தமிழில் தருகிறது.
- source_word: בְּסֵתֶר פָּנֶיךָ
  choice: உமது திருமுகத்தின் மறைவிடத்தில்
  rationale: סֵתֶר என்பது மறைவிடம் அல்லது புகலிடம்; פָּנִים என்பது நேரடியாக ‘முகம்’ எனப் பொருள்படும். ‘திருமுகம்’ என்ற கவித்துவமான மரியாதைமிக்க சொல் மூல உருவகத்தையும் இறை அண்மையையும் காக்கிறது.
- source_word: מֵרֻכְסֵי אִישׁ
  choice: மனிதனின் சூழ்ச்சிகளிலிருந்து
  rationale: רֻכְסֵי அரியதும் பொருள் உறுதியாகாததுமான சொல்; இச்சூழலில் பகைமையான திட்டங்கள், சதிகள் அல்லது கூட்டுச்செயல்கள் எனக் குறிக்கலாம். ‘சூழ்ச்சிகள்’ முதன்மைப் பொருளை இயல்பாகத் தருகிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வைக்கப்படுகின்றன.
- source_word: תִּצְפְּנֵם
  choice: அவர்களை ... மறைத்துவைக்கிறீர்
  rationale: צפן என்பது மறைத்தல், சேமித்துவைத்தல் அல்லது பாதுகாப்பாக வைத்தல் என்பவற்றைக் குறிக்கலாம். இணைவரியின் பாதுகாப்புக் கருத்துடன் ஒத்திசைந்து, முதல் வினையுடன் தொடர்புடைய தனித்த தமிழ் சொல்லாக்கமாக இது அமைகிறது.
- source_word: בְּסֻכָּה
  choice: ஒரு புகலிடத்தில்
  rationale: סֻכָּה என்பது குடில் அல்லது தற்காலிகத் தங்குமிடம் என்ற நேரடிப் பொருளுடையது; இங்கு அதன் பாதுகாப்புச் செயல்பாடு முன்னிலையில் இருப்பதால் ‘புகலிடம்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: מֵרִיב לְשֹׁנוֹת
  choice: நாவுகளின் சச்சரவிலிருந்து
  rationale: רִיב என்பது சச்சரவு, வாதம் அல்லது பிணக்கு; לְשֹׁנוֹת என்பது பன்மையில் ‘நாவுகள்.’ பகைமையான அல்லது அவதூறான பேச்சைக் குறிக்கும் எபிரேய உருவகத்தைத் தமிழிலும் காக்கிறது.
theological_decisions:
- issue: אִישׁ என்பதன் மனிதவியல்/பாலினக் குறிப்பு
  choice: மனிதன்
  alternative: மக்கள்; மனிதர்கள்
  rationale: எபிரேயச் சொல் ஒருமை ஆண்பாலில் இருந்தாலும் இங்கு பிரதிநிதித்துவப் பொதுப்பொருளில் வருகிறது. ‘மனிதன்’ ஒருமை வடிவையும் பொதுமனிதக் குறிப்பையும் காக்கிறது.
- issue: פָּנֶיךָ என்பதில் ‘முகம்’ அல்லது ‘பிரசன்னம்’
  choice: உமது திருமுகம்
  alternative: உமது பிரசன்னம்; உமது சந்நிதி
  rationale: மூலத்தின் உடல்-உருவகத்தைத் தீர்த்துவிடாமல் காக்க ‘திருமுகம்’ தேர்ந்தெடுக்கப்பட்டது; அதே நேரத்தில் இறைவனின் பாதுகாப்பான அண்மையும் தமிழில் உணர்த்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க கவித்துவத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘திருமுகம்,’ ‘நாவுகள்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; அரிய רֻכְסֵי சொல்லின் உறுதியின்மை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்பட்டுள்ளது.
