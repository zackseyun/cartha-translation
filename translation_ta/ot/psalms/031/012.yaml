source:
  edition: WLC
  text: נִ֭שְׁכַּחְתִּי כְּ/מֵ֣ת מִ/לֵּ֑ב הָ֝יִ֗יתִי כִּ/כְלִ֥י אֹבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/012.yaml
  text: I am forgotten like a dead man[a], out of mind[b]; I have become like a vessel that is lost.
translation:
  language: ta
  text: இறந்த ஒருவனைப்போல் நான் உள்ளத்திலிருந்து மறக்கப்பட்டேன்[a]; அழிந்துபோகிற ஒரு பாத்திரத்தைப்போல் ஆனேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், “இதயத்திலிருந்து.” இங்கு அது நினைவில் இல்லாததாக, அல்லது நினைவிலிருந்து நீங்கிப்போனதாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “பாத்திரம்” என்பதற்கான எபிரெயச் சொல் ஒரு பொருளையோ கருவியையோ குறிக்கவும் முடியும்; “அழிந்துபோகிற” என்பதை “தொலைந்துபோன” அல்லது “பாழான” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  choice: நான் மறக்கப்பட்டேன்
  rationale: நிஃபால் நிறைவுவினை, பேச்சாளர் மறக்கப்பட்ட நிலையில் இருப்பதைக் காட்டுகிறது; தமிழில் செயப்பாட்டு வடிவம் இதை நேரடியாக வெளிப்படுத்துகிறது.
- source_word: כְּמֵת
  choice: இறந்துபோன ஒருவனைப்போல்
  rationale: כ ஒப்புமையையும் מֵת ஒருமையில் ‘இறந்த ஒருவர்’ என்பதையும் குறிக்கிறது; தனிப்பட்ட உருவகத்தை இத்தேர்வு காக்கிறது.
- source_word: מִלֵּב
  choice: உள்ளத்திலிருந்து
  rationale: சொல்லுக்குச் சொல் ‘இதயத்திலிருந்து/உள்ளத்திலிருந்து’; எபிரெய மொழிப்பயன்பாட்டில் நினைவு அல்லது மனத்திலிருந்து நீங்கியிருப்பதைக் குறிக்கலாம். மூல உருவகத்தைப் பாதுகாக்க ‘உள்ளத்திலிருந்து’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָיִיתִי
  choice: ஆனேன்
  rationale: היה என்பதன் நிறைவுவினை இங்கு ஒரு நிலைக்கு வந்ததைக் காட்டுகிறது; ‘ஆனேன்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: כִּכְלִי
  choice: ஒரு பாத்திரத்தைப்போல்
  rationale: כְּלִי என்பது பொருள், கருவி அல்லது பாத்திரம் எனப் பரந்த பொருளுடையது; சூழலில் ‘பாத்திரம்’ இயல்பான உருவகத்தை வழங்குகிறது, ஆனால் சொல்லின் பரப்பை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: אֹבֵד
  choice: தொலைந்துபோன
  rationale: אבד என்பதன் வினையெச்சம் ‘தொலைந்த, அழிந்த, பாழான’ என்ற பொருள் வரம்பைக் கொண்டது. ‘தொலைந்துபோன’ முதன்மைப் பொருளை இயல்பாகத் தருகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
