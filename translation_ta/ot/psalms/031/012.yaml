translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, பொதுவாசகர்களுக்குப் புரியும் கவிதைநடை. முதல் அடியில் மூலத்தின் ‘இதயம்’ உருவகம் பிரதான உரையில் காக்கப்பட்டு அதன் நினைவு சார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. இரண்டாம் அடியில் כְּלִי மற்றும் אֹבֵד ஆகியவற்றின் உண்மையான சொற்பொருள் நெகிழ்வு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
