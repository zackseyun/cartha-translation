  source_fidelity: மூல எபிரெயத்தின் வாக்கிய அமைப்பும் பொருளும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. בָּרוּךְ என்ற துதிவாழ்த்தை “போற்றப்படுவாராக” இயல்பாகத் தருகிறது; הִפְלִיא ... חַסְדּוֹ לִי என்பதன் ‘தமது அன்பை எனக்கு வியத்தகு முறையில் வெளிப்படுத்தினார்’ என்ற பொருளும் சரியாக உள்ளது. בְּעִיר מָצוֹר என்பதன் சாத்தியமான ‘முற்றுகையிடப்பட்ட நகரம்’ பொருள் முதன்மை உரையில் தரப்பட்டு, மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
