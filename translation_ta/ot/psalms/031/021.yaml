  text: בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥/וֹ לִ֝֗/י בְּ/עִ֣יר מָצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
translation:
  language: ta
  text: யாவே போற்றப்படுவாராக! ஏனெனில், முற்றுகையிடப்பட்ட நகரத்தில்[a] அவர் தமது மாறாத அன்பை எனக்கு வியத்தகு முறையில் வெளிப்படுத்தினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரணுள்ள நகரத்தில்.” எபிரெயச் சொற்றொடர் முற்றுகைக்கு உள்ளான நகரத்தையோ அரணிடப்பட்ட நகரத்தையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: கடவுளை நோக்கிய வாழ்த்துதலும் துதியும் கலந்த ஆசீர்வாத வியப்புரையாக வரும் எபிரெயச் சொல்லின் வலிமையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளாலான இறைப்பெயரை பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராக ஒலிபெயர்க்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: யாவே போற்றப்படுவதற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: הִפְלִיא
  choice: வியத்தகு முறையில் வெளிப்படுத்தினார்
  rationale: פלא என்பதன் ஹிஃபில் வடிவம் அசாதாரணமான அல்லது வியப்பூட்டும் செயலைக் குறிக்கிறது; חַסְדּוֹ இதன் செயப்படுபொருளாக இருப்பதால், அன்பை வியத்தகு விதத்தில் வெளிக்காட்டினார் என்பது தமிழில் இயல்பாக அமைகிறது.
- source_word: חַסְדּוֹ
  choice: தமது மாறாத அன்பை
  rationale: חסד குறிக்கும் பற்றுறுதியான, நிலைத்த உடன்படிக்கை அன்பை ஒரே குறிப்பிட்ட கோட்பாட்டு விளக்கமாகச் சுருக்காமல் தெரிவிக்கிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: அந்த அன்பின் தனிப்பட்ட பெறுநரைத் தெளிவாகக் குறிக்கிறது.
- source_word: בְּעִיר מָצוֹר
  choice: முற்றுகையிடப்பட்ட நகரத்தில்
  rationale: מָצוֹר என்பதன் முற்றுகை அல்லது நெருக்கடி சார்ந்த பொருளைச் சூழலுக்கு ஏற்றவாறு முதன்மைப்படுத்துகிறது; ‘அரணுள்ள நகரம்’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, இறைவனின் தனிப்பெயரே உள்ளது; ஆகவே அதனை ஒலிபெயர்த்து உடன்படிக்கைச் சுட்டைத் தக்கவைக்கிறது.
- issue: בְּעִיר מָצוֹר என்பதன் பொருள்
  choice: முற்றுகையிடப்பட்ட நகரத்தில்
  alternative: அரணுள்ள நகரத்தில்
  rationale: מָצוֹר என்பது முற்றுகையையும் அரணிடப்பட்ட இடத்தையும் குறிக்கக்கூடியதால் சொற்றொடர் உண்மையில் இருபொருள் வாய்ந்தது. சங்கீதத்தின் ஆபத்து மற்றும் விடுதலைச் சூழலுக்கு ஏற்ற முதல் பொருள் முதன்மை உரையில் தரப்பட்டு, மற்ற பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்குரிய கண்ணியத்துடனும் பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் இயல்புடனும் அமைக்கப்பட்டது. தொடக்க வியப்புரையின் கவித்துவத் தன்மை காக்கப்பட்டுள்ளது; மூலத்தின் இடவியல் இருபொருள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
