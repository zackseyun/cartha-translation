  text: For I have heard the whispering of many—terror on every side!—as they conspired together against me[a], plotting to take my life.
translation:
  language: ta
  text: ஏனெனில், பலருடைய பழிச்சொல்லை நான் கேட்டிருக்கிறேன்[a]—சுற்றிலும் திகில்! அவர்கள் எனக்கு எதிராக ஒன்றுகூடி ஆலோசித்தபோது, என் உயிரைப் பறிக்கத் திட்டமிட்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பலருடைய முணுமுணுப்பை” அல்லது “பலர் பரப்பிய வதந்தியை.” எபிரெயச் சொல் இரகசியப் பேச்சு, வதந்தி, அல்லது அவதூறான பழிச்சொல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள சூழலில் சங்கீதக்காரரின் துயரத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது; விளக்கக் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: שָׁמַעְתִּי
  choice: நான் கேட்டிருக்கிறேன்
  rationale: நிறைவுற்ற செயல் நிகழ்கால அனுபவத்தில் நீடிக்கும் தாக்கத்தை உணர்த்துவதால், தமிழ் நிகழ்நிறைவு வடிவம் பொருத்தமானது.
- source_word: דִּבַּת רַבִּים
  choice: பலருடைய பழிச்சொல்
  rationale: דִּבָּה என்பது வதந்தி, இரகசியப் பேச்சு, அல்லது அவதூறான பழிச்சொல் ஆகிய பொருட்களைத் தரலாம். பகைமையான சூழலில் ‘பழிச்சொல்’ இயல்பாகவும் வலுவாகவும் உள்ளது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: מָגוֹר מִסָּבִיב
  choice: சுற்றிலும் திகில்
  rationale: எல்லாப் பக்கங்களிலும் சூழ்ந்திருக்கும் அச்சத்தைச் சுருக்கமாகவும் கவித்துவமாகவும் வெளிப்படுத்தும் நிலையான எபிரெயச் சொல்லாட்சிக்கு இயல்பான தமிழ் இணை.
- source_word: בְּהִוָּסְדָם יַחַד עָלַי
  choice: அவர்கள் எனக்கு எதிராக ஒன்றுகூடி ஆலோசித்தபோது
  rationale: கூட்டு ஆலோசனையையும் அதன் பகைமை நோக்கையும் வெளிப்படுத்துகிறது; ‘சதி செய்தபோது’ என்று நோக்கத்தை அளவுக்கு மீறி முன்கூட்டியே முடிவுசெய்யாமல் மூலத்தின் வடிவத்தை காக்கிறது.
- source_word: לָקַחַת נַפְשִׁי
  choice: என் உயிரைப் பறிக்க
  rationale: נֶפֶשׁ இங்கு உடலிலிருந்து வேறான ‘ஆத்துமா’ அல்ல, பேசுகிறவரின் உயிரைக் குறிக்கிறது. உயிருக்கு எதிரான வன்முறை நோக்கத்தை ‘பறிக்க’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: זָמָמוּ
  choice: திட்டமிட்டார்கள்
  rationale: தீங்கிழைக்க எண்ணிச் செய்யப்படும் திட்டமிடுதலைக் குறிக்கிறது; முன் வரும் கூட்டு ஆலோசனையிலிருந்து வேறுபட்ட இறுதி நோக்கத்தையும் தெளிவாக்குகிறது.
