source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י צַ֫ר לִ֥/י עָשְׁשָׁ֖ה בְ/כַ֥עַס עֵינִ֗/י נַפְשִׁ֥/י וּ/בִטְנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/009.yaml
  text: Be gracious to me[a], O Yahweh, for I am in distress[c][b]; my eye has wasted away with grief—my soul and my belly as well.
translation:
  language: ta
  text: யாவே, எனக்கு அருள்புரியும்; ஏனெனில் நான் நெருக்கடியில் இருக்கிறேன். துயரத்தால்[a] என் கண் சோர்ந்துபோயிற்று[b]; என் உயிரும்[c] என் வயிறும்கூட[d] சோர்ந்துபோயின.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துயரத்தால்’ என்பதற்கு ‘மனக்கசப்பால்,’ ‘எரிச்சலால்’ அல்லது ‘கோபத்தால்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சோர்ந்துபோயிற்று’ என்பதற்கு ‘மங்கிப்போயிற்று,’ ‘மெலிந்துபோயிற்று’ அல்லது ‘செயலிழந்தது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘என் உயிர்’ என்பதற்கு ‘என் ஆத்துமா,’ ‘என் வாழ்வு’ அல்லது ‘என் தன்முழுவதும்’ என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: d
    text: எபிரெயத்தில் நேரடியாக ‘என் வயிறு’; இச்சொல் விரிவாக உள்ளுறுப்புகளையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: எனக்கு அருள்புரியும்
  rationale: חנן என்ற வினையின் கட்டளை வடிவம் அருள் அல்லது தயவு வேண்டுவதைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் வேண்டுதலின் கண்ணியத்துடனும் இதைத் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டமல்ல, எபிரெயத் திருமறையில் வரும் இறைநாமம். அதன் ஒலிப்பெயர்ப்பைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: כִּי צַר לִי
  choice: ஏனெனில் நான் நெருக்கடியில் இருக்கிறேன்
  rationale: כִּי வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; צַר לִי தனிப்பட்ட துன்பம் அல்லது நெருக்கடியான நிலையைக் குறிக்கிறது.
- source_word: עָשְׁשָׁה
  choice: சோர்ந்துபோயிற்று
  rationale: இவ்வினை மெலிதல், வலுவிழத்தல், மங்குதல் அல்லது செயலிழத்தல் ஆகிய நுண்பொருள்களைக் கொண்டது. கண் மற்றும் பிற உட்பகுதிகளைப் பற்றிய புலம்பலுக்கு ‘சோர்ந்துபோயிற்று’ இயல்பாகப் பொருந்துகிறது.
- source_word: בְכַעַס
  choice: துயரத்தால்
  rationale: כעס என்பது கோபம், மனக்கசப்பு, எரிச்சல் அல்லது வேதனை ஆகியவற்றைக் குறிக்கலாம். இப்புலம்பல் சூழலில் ‘துயரம்’ பொருத்தமானது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: עֵינִי
  choice: என் கண்
  rationale: எபிரெயத்தில் ஒருமையாக இருப்பதைப் பாதுகாக்கிறது; கவிதைநடையிலும் தமிழில் புரிந்துகொள்ளத்தக்கது.
- source_word: נַפְשִׁי
  choice: என் உயிர்
  rationale: נפש என்பது உயிர், ஆத்துமா அல்லது ஒருவரது முழுத் தன்னைக் குறிக்கலாம். உடல் சார்ந்த இணைச்சொற்களுடன் வரும் இவ்விடத்தில் ‘உயிர்’ இயல்பான தமிழாக இருந்து மூலத்தின் பரந்த பொருளையும் தக்கவைக்கிறது.
- source_word: וּבִטְנִי
  choice: என் வயிறும்கூட
  rationale: בטן என்பதன் நேரடிப் பொருள் வயிறு; விரிவாக உள்ளுறுப்புகளையும் குறிக்கலாம். ‘கூட’ என்பது கண், உயிர் ஆகியவற்றோடு இதுவும் சேர்க்கப்படுவதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிப்பெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: נַפְשִׁי குறிக்கும் மனித இயல்பு
  choice: என் உயிர்
  alternative: என் ஆத்துமா; என் தன்முழுவதும்
  rationale: இச்சொல்லை உடலுக்கு முற்றிலும் வேறான ஓர் அம்சமாக மட்டும் வரையறுக்காமல், உயிர், ஆத்துமா, தன் ஆகிய அதன் பொருள் அகலத்தை அடிக்குறிப்புடன் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான புலம்பல் நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் ஒருமை ‘என் கண்’ என்பதில் பாதுகாக்கப்பட்டுள்ளது; தொடரும் உறுப்புகளுக்கான மறைமுக வினை தமிழில் தெளிவுக்காக மீண்டும் கூறப்பட்டுள்ளது.
