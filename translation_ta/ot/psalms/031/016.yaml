  - marker: a
    text: அல்லது, ‘உமது மாறாத அன்பின்படி’ அல்லது ‘உமது மாறாத அன்பில்.’ இங்குள்ள எபிரெய முன்னொட்டை ஒன்றோடொன்று நெருங்கிய இப்பொருள்களில் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִירָה
  choice: ஒளிரச் செய்யும்
  rationale: אור என்பதன் ஹிஃபில் கட்டளை வடிவம் காரணவினைப் பொருளைக் கொண்டது. இறைவனை நோக்கிய வேண்டுதலுக்குரிய உயர்ந்த, இயல்பான தமிழில் கட்டளை வலிமையையும் ஒளியின் உருவகத்தையும் இத்தேர்வு காக்கிறது.
- source_word: פָנֶיךָ
  choice: உமது முகத்தை
  rationale: எபிரெயச் சொல்லின் நேர்ப்பொருள் ‘உமது முகம்.’ இது இறைவனின் சாதகமான பார்வையைக் குறிக்கும் சொல்லோவியம் என்றாலும், அதை ‘பிரசன்னம்’ என்று விளக்கிவிடாமல் மூலத்தின் தெளிவான உருவகம் தக்கவைக்கப்படுகிறது.
- source_word: עַל
  choice: மேல்
  rationale: இங்கு அருள்பார்வை அடியானை நோக்கித் திரும்புவதைக் குறிக்கிறது. ‘மேல்’ என்பது மூலத்தின் திசைசார் உறவை இயல்பான தமிழில் காக்கிறது.
- source_word: עַבְדֶּךָ
  choice: உமது அடியான்
  rationale: עבד என்பதற்கு ‘அடிமை’ என்றும் பொருள் வரலாம்; ஆனால் இறைவனை நோக்கிய ஜெப மொழியில் ‘அடியான்’ உறவையும் பணிவையும் இயல்பாக வெளிப்படுத்துகிறது, தேவையற்ற சமூக அடிமைத்தனச் சாயலை முன்னிறுத்தாது.
- source_word: הוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றும்
  rationale: ישע வேரிலிருந்து வந்த, முதலாம் நபர் ஒருமை பின்னொட்டுடன் கூடிய கட்டளை வடிவம். உடனடியான ஆபத்திலிருந்து விடுவித்தல் உட்பட விரிந்த மீட்புப் பொருளை ‘காப்பாற்றும்’ தெளிவாகக் கொண்டுவருகிறது.
- source_word: בְחַסְדֶּךָ
  choice: உமது மாறாத அன்பினால்
  rationale: חסד என்பது நிலைத்த உறவுப் பற்றையும் விசுவாசமான அன்பையும் குறிக்கும் செறிவான சொல். ‘மாறாத அன்பு’ சாதாரண வாசகருக்குப் புரியும்படி அந்த நிலைத்தன்மையை வெளிப்படுத்துகிறது. முன்னொட்டு ב இங்கு கருவிப்பொருளில் ‘-னால்’ என வழங்கப்பட்டுள்ளது; அதற்குரிய நெருங்கிய மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: חסד என்பதன் மொழிபெயர்ப்பு
  choice: மாறாத அன்பு
  alternative: இரக்கம்; பேரன்பு; உடன்படிக்கை அன்பு
  rationale: இச்சொல் வெறும் உணர்ச்சியையோ இரக்கத்தையோ மட்டுமல்லாமல், இறைவனின் நிலையான உறவுப் பற்றையும் உண்மைத்தன்மையையும் குறிக்கிறது. ‘மாறாத அன்பு’ எந்தச் சமயப்பிரிவின் தனிச் சொல்லாட்சியையும் இறக்குமதி செய்யாமல் அந்த இறையியல் நிறையைத் தெளிவாகக் காக்கிறது.
- issue: בְ முன்னொட்டின் தொடர்பு
  choice: மாறாத அன்பினால்
  alternative: மாறாத அன்பின்படி; மாறாத அன்பில்
  rationale: இங்கு இறைவனின் அன்பை மீட்பின் அடிப்படை அல்லது வழிமுறையாகப் புரிந்துகொள்ளலாம். முதன்மை உரை இயல்பான கருவிப்பொருளைத் தேர்கிறது; எபிரெயத்தில் உள்ள நெருங்கிய பொருள் வாய்ப்புகள் அடிக்குறிப்பில் திறந்தவையாக வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன வாசகருக்குப் புரியும் வகையில், இறைவனை நோக்கிய ஜெபத்திற்குரிய கண்ணியமான ஒருமை மரியாதை நடையாக ‘உமது’ மற்றும் வேண்டுதல் வினைமுற்றான ‘செய்யும்/காப்பாற்றும்’ பயன்படுத்தப்பட்டுள்ளன. ‘முகத்தை ஒளிரச் செய்தல்’ என்ற எபிரெயச் சொல்லோவியம் விளக்கவுரையாக மாற்றப்படாமல் தக்கவைக்கப்பட்டுள்ளது.
