  yaml_path: translation/ot/psalms/031/016.yaml
  text: Make your face shine on your servant[a]; save me in your steadfast love.
translation:
  language: ta
  text: உமது முகத்தை உமது அடியான் மேல் ஒளிரச் செய்யும்; உமது மாறாத அன்பினால்[a] என்னைக் காப்பாற்றும்.
  philosophy: optimal-equivalence
