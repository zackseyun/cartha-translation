  yaml_path: translation/ot/psalms/031/015.yaml
  text: My times are in your hand[a]; rescue me from the hand of my enemies and from my pursuers.
translation:
  language: ta
  text: என் காலங்கள் உமது கையில் இருக்கின்றன[a]; என் பகைவர்களின் கையிலிருந்தும் என்னைத் துரத்துவோரிடமிருந்தும் என்னை விடுவியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எனக்கென நியமிக்கப்பட்ட காலங்கள்’ அல்லது ‘என் சூழ்நிலைகள்.’ ‘என் காலங்கள்’ என்ற எபிரெயத் தொடர் ஒருவரின் வாழ்வுப் பருவங்களையும் நிகழ்வுகளையும் விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: உமது கையில்
  rationale: எபிரெய மொழியின் ‘கை’ உருவகத்தைத் தக்கவைத்து, அதிகாரம் மற்றும் கட்டுப்பாடு என்ற உட்பொருளை அளவுக்கு மீறி விளக்காமல் வெளிப்படுத்துகிறது; அடுத்த அடியில் வரும் பகைவர்களின் ‘கை’ என்பதுடனான கவித்துவ எதிரிணையும் பாதுகாக்கப்படுகிறது.
- source_word: עִתֹּתָי
  choice: என் காலங்கள்
  rationale: வாழ்வின் பருவங்கள், நிகழ்வுகள், நியமிக்கப்பட்ட வேளைகள் ஆகியவற்றை உள்ளடக்கக்கூடிய எபிரெயப் பன்மையின் விரிந்த கவித்துவப் பொருளைத் தக்கவைக்கிறது.
- source_word: הַצִּילֵנִי
  choice: என்னை விடுவியும்
  rationale: ஆபத்திலும் பகைவர்களின் பிடியிலும் இருந்து காப்பாற்றப்படுவதைத் தெளிவாகக் கூறும், கண்ணியமான வேண்டுதல் வடிவம்.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: மூலத்தின் ‘கை’ உருவகத்தைப் பாதுகாத்து, ‘உமது கையில்’ என்பதற்கும் ‘பகைவர்களின் கையிலிருந்து’ என்பதற்கும் இடையிலான நோக்கமுள்ள மாறுபாட்டை வெளிப்படுத்துகிறது.
- source_word: אֹיְבַי
  choice: என் பகைவர்கள்
  rationale: விரோதமான எதிரிகளைக் குறிக்கும் நேரடியான, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: וּמֵרֹדְפָי
  choice: என்னைத் துரத்துவோர்
  rationale: சங்கீதக்காரனைத் தொடர்ந்து துரத்துகிறவர்களைக் குறிக்கும் வினைச்செயல் சார்ந்த உருவகத்தைத் துல்லியமாகப் பாதுகாக்கிறது; ‘துன்புறுத்துவோர்’ என்று பொதுமைப்படுத்தவில்லை.
theological_decisions:
- issue: ‘என் காலங்கள்’ என்பதன் பொருள் வரம்பு
  choice: சங்கீதக்காரரின் வாழ்வுப் பருவங்களும் சூழ்நிலைகளும் இறைவனின் அதிகாரத்தில் இருப்பதை விரிவாகக் குறிக்கும் வாசிப்பு
  alternative: ‘என் விதி’ அல்லது ‘எனக்கென நியமிக்கப்பட்ட வேளைகள்’ என்று மட்டும் குறுக்குவது
  rationale: עִתֹּתָי கவித்துவமான விரிந்த பொருளைக் கொண்டுள்ளது. ‘விதி’ என்று மொழிபெயர்த்து முன்நியமனக் கருத்தைத் திணிக்காமலும், நியமிக்கப்பட்ட சில வேளைகளாக மட்டும் சுருக்காமலும் மூலத்தின் பொருள் நெகிழ்வை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை நேரடியாக அழைக்கும் கண்ணியமான ஒருமை மரியாதை நடையாக ‘உமது’ மற்றும் ‘விடுவியும்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இணை அமைப்பையும் ‘கை’ உருவகத்தின் மறுபயன்பாட்டையும் தக்கவைத்தபோதும், சாதாரண வாசகருக்குப் புரியும் இயல்பான சொற்றொடர் அமைப்பு பின்பற்றப்பட்டுள்ளது.
