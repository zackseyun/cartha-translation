  text: Bring me out of this net that they have hidden for me[a], for you are my stronghold.
translation:
  language: ta
  text: அவர்கள் எனக்கு மறைத்து வைத்திருக்கும் இந்த வலையிலிருந்து என்னை வெளியே கொண்டுவாரும்[a]; ஏனெனில் நீரே என் அரண்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் எனக்கு மறைத்து வைத்த வலையிலிருந்து.” எபிரேயச் சொல்லைத் தொடர்புச் சொல்லாகவும் புரிந்துகொள்ளலாம்; வலை மறைத்து வைக்கப்பட்டிருக்கிறது என்ற காட்சி இரு மொழிபெயர்ப்புகளிலும் நீடிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  choice: என்னை வெளியே கொண்டுவாரும்
  rationale: יצא என்பதன் ஹிஃபில் வடிவம் ‘வெளியே செல்லச் செய்/வெளியே கொண்டுவா’ எனும் காரணவினைப் பொருளைக் கொண்டது. மரியாதையான வேண்டுகோள் நடையில் இந்தத் தேர்வு அந்தப் பொருளை இயல்பாகக் காக்கிறது.
- source_word: מֵרֶשֶׁת
  choice: வலையிலிருந்து
  rationale: רֶשֶׁת என்பதன் நேரடிப் பொருள் ‘வலை’; உருவகமாக அது கண்ணியைக் குறிக்கலாம். எபிரேயத்தின் தெளிவான காட்சியைப் பாதுகாக்க ‘வலை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: זוּ
  choice: இந்த
  rationale: זוּ இங்கு குறிப்பிட்ட வலையைச் சுட்டுவதாகவோ தொடர்புச் சொல்லாகவோ புரிந்துகொள்ளப்படலாம். முதன்மை உரையில் ‘இந்த’ என மொழிபெயர்த்து சுட்டுப்பொருளைக் காத்துள்ளோம்; மாற்று அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: טָמְנוּ לִי
  choice: அவர்கள் எனக்காக மறைத்து வைத்திருக்கும்
  rationale: טמן என்பதன் அடிப்படைப் பொருள் ‘மறை/ஒளித்து வை.’ வலையை ‘விரித்தனர்’ என்பது இயல்பான விளக்க மொழிபெயர்ப்பாக இருந்தாலும், மூலத்தின் மறைத்தல் என்ற கூறை இத்தேர்வு காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: כִּי வேண்டுகோளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. ‘ஏனெனில்’ இந்தத் தர்க்கத் தொடர்பை நவீன நிலையான தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מָעוּזִּי
  choice: என் அரண்
  rationale: מָעוֹז என்பது வலிமையையும் பாதுகாப்பையும் அளிக்கும் உறுதியான இடத்தைக் குறிக்கிறது. ‘அரண்’ சுருக்கமாகவும் கவித்துவமாகவும் பாதுகாப்பு உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தேவனைப் பாதுகாப்பான வலிமையாகச் சித்தரிக்கும் உருவகம்
  choice: நீரே என் அரண்
  alternative: நீரே என் அடைக்கலம் / நீரே என் கோட்டை
  rationale: மூலம் தேவனைப் பாதுகாப்பும் வலிமையும் தரும் இடமாக உருவகிக்கிறது. ‘அரண்’ அந்த இராணுவ-பாதுகாப்புக் காட்சியைத் தக்கவைக்கிறது; உருவகத்தை ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாகச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவங்களான ‘கொண்டுவாரும்’, ‘நீரே’ பயன்படுத்தப்பட்டுள்ளன.
