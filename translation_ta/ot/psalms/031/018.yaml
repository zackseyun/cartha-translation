  text: תֵּ֥אָלַ֗מְנָה שִׂפְתֵ֫י שָׁ֥קֶר הַ/דֹּבְר֖וֹת עַל צַדִּ֥יק עָתָ֗ק בְּ/גַאֲוָ֥ה וָ/בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/018.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
translation:
  language: ta
  text: பொய்யுரைக்கும் உதடுகள் மௌனமாக்கப்படட்டும்[a]; அவை நீதிமானுக்கு[b] எதிராக ஆணவமாக[c], பெருமையோடும் இகழ்ச்சியோடும் பேசுகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மௌனமாகட்டும்’ அல்லது ‘ஊமையாக்கப்படட்டும்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை மௌனமாவதையோ மௌனமாக்கப்படுதலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நீதியுள்ள ஒருவருக்கு எதிராக’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய ஒருமை ஒரு தனிநபரையோ, பிரதிநிதித்துவமாக நீதியுள்ள ஒருவரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘ஆணவமாக’ என்பதற்கான எபிரெயச் சொல் இலக்கண வடிவில் ஒரு பெயர்ச்சொல்; அது ஆணவம் அல்லது செருக்கு என்ற பொருளில் இங்கு பேச்சின் முறையை விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  choice: மௌனமாக்கப்படட்டும்
  rationale: நிஃபால் வினை வடிவம் மௌனமாதல் அல்லது மௌனமாக்கப்படுதல் என்ற பொருளைத் தருகிறது; இங்கு வேண்டுதல்/சாபவேண்டுதலின் வலிமையை ‘-ப்படட்டும்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: பொய்யுரைக்கும் உதடுகள்
  rationale: சொல்லுக்குச் சொல் ‘பொய்மையின் உதடுகள்’; தமிழில் இயல்பாகவும் பொய்யான பேச்சின் செயல்பாட்டைத் தெளிவாகவும் காட்ட ‘பொய்யுரைக்கும் உதடுகள்’ என வழங்கப்பட்டது.
- source_word: הַדֹּבְרוֹת
  choice: அவை ... பேசுகின்றன
  rationale: ‘உதடுகள்’ என்பதோடு இயையும் பெண்பால் பன்மை நிகழ்கால வினையெச்சத்தின் உறவுநிலைப் பொருளை, தமிழில் தெளிவான தொடர்வாக்கியமாக வழங்குகிறது.
- source_word: עַל צַדִּיק
  choice: நீதிமானுக்கு எதிராக
  rationale: צַדִּיק என்பது ஒருமை பெயரடைப் பெயராக்கமாக இருந்து குறிப்பிட்ட நீதியுள்ள ஒருவரையோ பிரதிநிதித்துவ ஒருமையையோ குறிக்கலாம்; ‘நீதிமான்’ மரபாக அறியப்பட்ட, சுருக்கமான தமிழ் சொல்.
- source_word: עָתָק
  choice: அகந்தையாக
  rationale: இங்கு இச்சொல் துணிகரமான ஆணவம் அல்லது செருக்கான பேச்சைக் குறிக்கிறது. அடுத்துவரும் ‘பெருமை’ மற்றும் ‘இகழ்ச்சி’ ஆகியவற்றோடு எபிரெய உரையின் வலுப்படுத்தும் சொற்குவிப்பைத் தக்கவைக்கிறது.
- source_word: בְּגַאֲוָה
  choice: பெருமையோடும்
  rationale: בְּ முன்னொட்டு பேச்சின் முறையைக் குறிக்கிறது; גַאֲוָה இங்கு எதிர்மறையான தற்பெருமை அல்லது செருக்கைக் குறிக்கிறது.
- source_word: וָבוּז
  choice: இகழ்ச்சியோடும்
  rationale: בּוּז என்பதன் அவமதிப்பு, ஏளனம், இகழ்வு ஆகிய பொருள்களில், நவீன தமிழில் இயல்பான ‘இகழ்ச்சி’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: צַדִּיק என்ற ஒருமையின் குறிப்பு
  choice: நீதிமானுக்கு
  alternative: நீதியுள்ள ஒருவருக்கு / நீதியுள்ளவர்களுக்கு
  rationale: மூலத்தின் ஒருமையைப் பாதுகாத்து, அது தனிநபரையா பிரதிநிதித்துவமாக நீதியுள்ளவரையா குறிக்கிறது என்பதை உரையில் கட்டாயமாகத் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் சங்கீதத்துக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘அகந்தை—பெருமை—இகழ்ச்சி’ என்ற சொற்குவிப்பு சற்றே பொருள் ஒட்டியிருந்தாலும், மூல எபிரெயின் தீவிரமான வலியுறுத்தலைப் பாதுகாக்க நோக்கத்துடன் வைக்கப்பட்டது.
