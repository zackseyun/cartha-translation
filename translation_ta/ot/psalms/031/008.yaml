  text: and you have not delivered me into the hand of the enemy[b][a]; you have set my feet in a broad place.
translation:
  language: ta
  text: எதிரியின் கையில் என்னை ஒப்புக்கொடுக்கவில்லை; என் கால்களை விசாலமான இடத்தில் நிறுத்தினீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘விசாலமான இடம்’ என்பது அடைப்பு அல்லது நெருக்கடியிலிருந்து கிடைக்கும் விடுதலை, பாதுகாப்பு, நிம்மதி ஆகியவற்றை உணர்த்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  choice: என்னை ஒப்புக்கொடுக்காமல்
  rationale: சגר என்பதன் ஹிஃபில் வடிவம் இங்கு ஒருவரை மற்றொருவரின் கட்டுப்பாட்டில் ஒப்படைப்பதைக் குறிக்கிறது. ‘ஒப்புக்கொடுக்காமல்’ என்பது பகைவரின் அதிகாரத்திற்கு விட்டுக்கொடுக்காத பொருளை இயல்பாகத் தருகிறது.
- source_word: בְּיַד
  choice: கையில்
  rationale: எபிரெய மொழியில் ‘கையில்’ என்பது ஒருவரின் அதிகாரம் அல்லது கட்டுப்பாட்டுக்குள் இருப்பதைக் குறிக்கும் உருவக வழக்கு. கை என்ற நேரடி உருவகத்தையும் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אוֹיֵב
  choice: எதிரியின்
  rationale: கட்டுரையில்லாத ஒருமை வடிவம் சூழலில் பொதுவான அல்லது தொகுப்பான பகைமைச் சக்தியைக் குறிக்கிறது. ‘எதிரி’ தெளிவான, dignified modern Tamil equivalent.
- source_word: הֶעֱמַדְתָּ
  choice: நிலைநிறுத்தினீர்
  rationale: עמד என்பதன் ஹிஃபில் வடிவம் நிற்கச் செய்தல் அல்லது உறுதியாக வைத்தல் எனப் பொருள்படும். ‘நிலைநிறுத்தினீர்’ திட்டமிட்டு பாதுகாப்பாக நிற்கவைத்த கருத்தைத் தருகிறது.
- source_word: בַמֶּרְחָב
  choice: விசாலமான இடத்தில்
  rationale: מֶרְחָב நெருக்கடி அல்லது அடைப்புக்கு மாறான அகன்ற, திறந்த வெளியைக் குறிக்கிறது. ‘விசாலமான இடம்’ மூல உருவகத்தைப் பாதுகாத்து நவீன தமிழிலும் புரியத்தக்கதாக உள்ளது.
- source_word: רַגְלָי
  choice: என் கால்களை
  rationale: மூலத்தில் பன்மை இருப்பதால் ‘என் கால்களை’ என்று வழங்கப்படுகிறது; இது உறுதியாக நிற்பதையும் சுதந்திரமாக நகர்வதையும் உணர்த்துகிறது.
- source_word: וְלֹא
  choice: ஒப்புக்கொடுக்காமல்
  rationale: וְלֹא முந்தைய கருத்துடன் இணைந்து ‘அவ்வாறு செய்யவில்லை’ என்ற பொருளைத் தருகிறது. தமிழில் எதிர்மறை வினையெச்ச அமைப்பு இரு செயல்களையும் இயல்பாக இணைக்கிறது.
