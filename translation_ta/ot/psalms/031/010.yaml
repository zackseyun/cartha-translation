base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief[a], and my years with sighing; my strength has failed because of my iniquity[b], and my bones waste away.
translation:
  language: ta
  text: 'ஏனெனில், என் வாழ்வு துயரத்தில் தீர்ந்தது;

    என் ஆண்டுகள் பெருமூச்சில் கழிந்தன.

    என் அக்கிரமத்தினால்[b] என் வலிமை தளர்ந்தது[a];

    என் எலும்புகள் வலுவிழந்தன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் வலிமை தள்ளாடியது.’ எபிரெய வினைச்சொல் நேரடியாக ‘இடறியது’ அல்லது ‘தள்ளாடியது’ என்று பொருள்படும்; இங்கு அது உருவகமாகப் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் குற்றப்பழியினால்.’ எபிரெயச் சொல் அக்கிரமம், குற்றப்பழி, அல்லது குற்றத்தின் விளைவு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புலம்பலுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லின் விசையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: כָלוּ בְיָגוֹן חַיַּי
  choice: என் வாழ்நாள் துயரத்திலேயே கழிந்துபோகிறது
  rationale: כלה என்பதன் முடிவுறுதல், தீர்ந்துபோதல் என்ற உணர்வையும், יָגוֹן என்பதன் துயரத்தையும் இயல்பான நவீனத் தமிழில் தருகிறது; வடிவில் பன்மையான חַיַּי இங்கு ‘என் வாழ்நாள்’ என்ற ஒருமைப் பொருளுடைய எபிரெய மரபுத்தொடர்.
- source_word: וּשְׁנוֹתַי בַּאֲנָחָה
  choice: என் ஆண்டுகள் பெருமூச்சிலேயே கழிகின்றன
  rationale: אֲנָחָה குறிக்கும் ஆழ்ந்த பெருமூச்சு அல்லது முனகலை, முந்தைய அடியுடன் இணையான கவிதை நடையில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּשַׁל ... כֹחִי
  choice: என் வலிமை தளர்ந்துபோகிறது
  rationale: כשל என்பதன் அடிப்படை உருவகமான தடுமாறுதல் அல்லது தள்ளாடுதலைச் சூழலில் வலிமை குன்றுதல் என இயல்பாகத் தருகிறது; உருவகத்தின் நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּעֲוֺנִי
  choice: என் அக்கிரமத்தினால்
  rationale: עָוֹן என்பதிலுள்ள ஒழுக்கக் குற்றத்தின் பரிமாணத்தையும் ב முன்னிடைச்சொல்லின் காரணப் பொருளையும் பாதுகாக்கிறது; ‘குற்றப்பழி’ அல்லது அதன் விளைவு என்ற சாத்தியமும் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- source_word: וַעֲצָמַי עָשֵׁשׁוּ
  choice: என் எலும்புகள் தேய்ந்துபோகின்றன
  rationale: எலும்புகள் வலுவிழந்து அழிந்துவரும் உடல்சார் படிமத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: עָוֹן என்ற சொல்லில் பாவச்செயல், குற்றப்பழி, அதன் விளைவு ஆகிய பொருட்களின் உறவு
  choice: முதன்மை உரையில் ‘அக்கிரமம்’
  alternative: ‘என் குற்றப்பழியினால்’ அல்லது ‘என் அக்கிரமத்தின் விளைவினால்’
  rationale: ‘அக்கிரமம்’ ஒழுக்கக் குற்றத்தை நேரடியாகக் காக்கிறது; ஆனால் துன்பம் ஒரு குறிப்பிட்ட தெய்வீகத் தண்டனை என்று உரை கூறுவதாக முடிவுசெய்யாமல், எபிரெயச் சொல்லின் விரிவான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இணையான அடிகளின் ஓசையைப் பேண ‘கழிந்துபோகிறது / கழிகின்றன’ என்றும், உடல் சிதைவின் படிமத்திற்காக ‘தேய்ந்துபோகின்றன’ என்றும் தேர்ந்தெடுக்கப்பட்டது. அடிக்குறி [a] வலிமை தளர்வதற்குப் பின்னும் [b] அக்கிரமத்திற்குப் பின்னும் வைக்கப்பட்டு, அவற்றின் உண்மையான சொற்பொருள் மாற்றுகளுடன் சரியாக இணைக்கப்பட்டுள்ளது.
