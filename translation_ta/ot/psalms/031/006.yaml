  text: I hate those who keep worthless idols[a], but as for me, I trust in Yahweh.
translation:
  language: ta
  text: பயனற்ற சிலைகளைப்[a] பற்றிக்கொண்டிருப்பவர்களை நான் வெறுக்கிறேன்; நானோ யாவேவை நம்புகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
