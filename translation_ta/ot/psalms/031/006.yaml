    text: அல்லது, “வீணான பொய்மைகளைப் பேணுகிறவர்களை” அல்லது “வெறுமையான வீணானவற்றைப் பற்றிக்கொண்டிருப்பவர்களை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: நான் வெறுக்கிறேன்
  rationale: Qal perfect முதலாவது நபர் ஒருமை வடிவம். சங்கீதக் கவிதையில் இது நிலையான தற்போதைய மனநிலையைக் குறிக்க முடிவதால், இயல்பான தமிழில் நிகழ்காலமாக மொழிபெயர்க்கப்பட்டது.
- source_word: הַשֹּׁמְרִים
  choice: பற்றிக்கொண்டிருப்பவர்கள்
  rationale: שמר என்பதன் அடிப்படைப் பொருள் ‘காத்தல்/பேணுதல்/கடைப்பிடித்தல்.’ இங்கு பொய்யான வழிபாட்டுப் பொருட்கள்மீது கொண்ட தொடர்ச்சியான பற்றுதலைக் குறிக்கும் என்பதால், ‘பற்றிக்கொண்டிருப்பவர்கள்’ என வழங்கப்பட்டது.
- source_word: הַבְלֵי שָׁוְא
  choice: பயனற்ற சிலைகள்
  rationale: இந்தச் சொற்றொடர் வெறுமை, வீண்மை, பொய்மை ஆகிய நிழற்பொருள்களைக் கொண்டது; இச்சூழலில் நம்பிக்கை அல்லது வழிபாட்டுக்குரிய பொய்யான பொருட்களாகிய சிலைகளைக் குறிக்கிறது. மூலத்தின் பொருள் வரம்பை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: וַאֲנִי
  choice: நானோ
  rationale: முந்தையவர்களுக்கும் பேசுபவருக்கும் இடையிலான வலியுறுத்தப்பட்ட முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל יְהוָה בָּטָחְתִּי
  choice: யாவேவை நம்புகிறேன்
  rationale: בטח உடன் வரும் אֶל திசைநோக்கிய நம்பிக்கையைக் குறிக்கிறது; தமிழில் ‘ஒருவரை நம்புதல்’ என்பதே இயல்பான கட்டமைப்பு. Perfect வடிவம் நிலையான தற்போதைய நம்பிக்கையாக வழங்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான திருநாமத்தை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: הַבְלֵי שָׁוְא என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘பயனற்ற சிலைகள்’
  alternative: ‘வீணான பொய்மைகள்,’ ‘வெறுமையான வீணானவற்றை’ அல்லது ‘பொய்யான மாயைகளை’
  rationale: யாவேவை நம்புவதற்கு எதிராக அமைந்துள்ள சூழல் பொய்யான வழிபாட்டு அல்லது நம்பிக்கைப் பொருட்களைச் சுட்டுகிறது. இருப்பினும் எபிரெயச் சொற்றொடரின் உருவகமான வெறுமை/வீண்மைத் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமுள்ள ஆனால் பொதுவாசகர்களுக்குத் தெளிவான நடையில் அமைக்கப்பட்டது. ‘நானோ’ என்பது எபிரெய உரையின் வலியுறுத்தப்பட்ட முரண்பாட்டைப் பாதுகாக்கிறது.
