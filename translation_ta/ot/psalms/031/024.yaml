source:
  edition: WLC
  text: חִ֭זְקוּ וְ/יַאֲמֵ֣ץ לְבַבְ/כֶ֑ם כָּל הַ֝/מְיַחֲלִ֗ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/024.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
translation:
  language: ta
  text: 'வலிமையாயிருங்கள்;

    உங்கள் இதயம் துணிவடையட்டும்,

    யாவேக்காகக் காத்திருக்கும் அனைவரும்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவே மீது நம்பிக்கையோடு எதிர்நோக்கும் அனைவரும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் காத்திருத்தலையும் நம்பிக்கையுடன் எதிர்நோக்குதலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: வலிமையாயிருங்கள்
  rationale: חזק என்பதன் கால் கட்டளைப் பன்மை வடிவம் நேரடியான ஊக்கக் கட்டளையைத் தருகிறது; ‘வலிமையாயிருங்கள்’ என்பது அந்தக் கட்டளை வலிமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וְיַאֲמֵץ
  choice: துணிவுகொள்ளட்டும்
  rationale: אמץ என்பதன் ஹிஃபில் முற்றுப்பெறா வடிவம் இங்கு முந்தைய கட்டளையைத் தொடர்ந்து வேண்டுகோள்/ஊக்கப் பொருளில் வருகிறது. ‘துணிவுகொள்ளட்டும்’ என்பது வலிமை மற்றும் மனத்திடம் என்ற பொருளை வெளிப்படுத்துவதோடு முந்தைய சொல்லை அப்படியே மீண்டும் கூறுவதைத் தவிர்க்கிறது.
- source_word: לְבַבְכֶם
  choice: உங்கள் இதயம்
  rationale: לֵבָב இங்கு மனவுறுதி உட்பட உள்ளார்ந்த மனிதரைக் குறிக்கிறது; ‘உங்கள் இதயம்’ கவிதைநயத்தையும் மூல உருவகத்தையும் காக்கிறது.
- source_word: כָּל
  choice: அனைவரே
  rationale: כָּל அழைக்கப்படும் முழுக் குழுவையும் குறிக்கிறது; தமிழில் அழைப்புமுறையுடன் ‘அனைவரே’ என வழங்குவது இயல்பானது.
- source_word: הַמְיַחֲלִים
  choice: காத்திருக்கும்
  rationale: יחל என்ற வினை நம்பிக்கையுடன் காத்திருத்தல் அல்லது எதிர்நோக்குதல் என்ற இரு நெருங்கிய நுணுக்கங்களையும் கொண்டது. ‘காத்திருக்கும்’ மூலத்தின் செயற்படிமத்தை முதன்மையாகக் காக்கிறது; நம்பிக்கை நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்காக
  rationale: יחל உடன் வரும் לְ எதிர்பார்த்துக் காத்திருப்பவர் யார் என்பதைச் சுட்டுகிறது; ‘யெகோவாவுக்காக’ என்பது அந்த இலக்கண உறவைத் தெளிவாகக் காட்டுகிறது. יהוה உடன்படிக்கைப் பெயராக இருப்பதால் பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதில் பெயர்வடிவில் தரப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: எபிரெய மூலத்தில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல் தனிப்பெயராகக் காக்க ‘யெகோவா’ பயன்படுத்தப்படுகிறது; ‘யாவே’ என்பது மாற்று ஒலிப்புமுறை.
- issue: יחל என்பதில் காத்திருத்தலும் நம்பிக்கையும்
  choice: முதன்மை உரையில் ‘காத்திருக்கும்’; அடிக்குறிப்பில் ‘நம்பிக்கையோடு எதிர்நோக்கும்’
  alternative: முதன்மை உரையில் ‘நம்பிக்கை வைக்கும்’
  rationale: இந்தப் பங்கேற்பு வடிவம் காலத்துடன் தொடர்புடைய காத்திருத்தலையும் நம்பிக்கையான எதிர்பார்ப்பையும் ஒருங்கே சுமக்கலாம். ஒரே பொருளைத் தேர்ந்து மற்றதை அழிக்காமல், மூல உருவகம் உரையிலும் மற்ற நுணுக்கம் அடிக்குறிப்பிலும் காக்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கவிதைநடை. எபிரெய இணை அமைப்பை மூன்று குறும் வரிகளில் காத்து, பன்மை அழைப்பை ‘அனைவரே’ என இயல்பாக்கியுள்ளது.
