  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness deliver me.
translation:
  language: ta
  text: 'யாவே, உம்மிடம் அடைக்கலம் புகுந்தேன்;


    நான் ஒருபோதும் அவமானமடையாதபடி அருளும்.


    உமது நீதியின்படி[a] என்னை விடுவித்தருளும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது நியாயத்தின்படி என்னை விடுவித்தருளும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: உம்மிடம்
  rationale: בְּךָ என்பது அடைக்கலம் புகுவதற்கான நபரைச் சுட்டுகிறது. தமிழில் ‘உம்மிடம் அடைக்கலம் புகுந்தேன்’ என்பது இயல்பாகவும், எபிரெய மொழியின் அடைக்கல உருவகத்தைத் தெளிவாகவும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டம் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பட்ட திருப்பெயர். ஆகவே ‘ஆண்டவர்’ என்று மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: חָסִיתִי
  choice: அடைக்கலம் புகுந்தேன்
  rationale: இந்த நிறைவுற்ற வினை, ஏற்கெனவே மேற்கொள்ளப்பட்ட அல்லது நிலைபெற்ற அடைக்கலச் செயலைக் குறிக்கிறது. ‘நம்பினேன்’ என்பதைக் காட்டிலும் மூலத்தின் பாதுகாப்பிட உருவகத்தை இது காக்கிறது.
- source_word: אַל־אֵבוֹשָׁה לְעוֹלָם
  choice: நான் ஒருபோதும் அவமானமடைய விடாதிரும்
  rationale: אַל இங்கு வேண்டுதல் வடிவிலான எதிர்மறைக் கோரிக்கை; לְעוֹלָם எதிர்மறைச் சூழலில் ‘ஒருபோதும்’ என இயல்பாக அமைகிறது. בוש என்பது உள்ளார்ந்த வெட்கத்தை மட்டும் அல்ல, நம்பிக்கை பொய்த்ததால் நேரும் அவமானத்தையும் குறிக்கிறது.
- source_word: בְּצִדְקָתְךָ
  choice: உமது நீதியின்படி
  rationale: בְּ என்ற முன்னொட்டு இங்கு தேவனுடைய நீதியான இயல்பை விடுதலையின் அடிப்படையாக அல்லது செயல்முறையாகக் காட்டலாம். ‘நீதியின்படி’ இந்த இரு நுணுக்கங்களையும் தமிழில் இயல்பாகத் தாங்குகிறது.
- source_word: פַלְּטֵנִי
  choice: என்னை விடுவித்தருளும்
  rationale: பியேல் கட்டளை வடிவம் செயல்படுகிற மீட்பைக் கோருகிறது. ‘விடுவித்தருளும்’ என்பது வேண்டுதலின் மரியாதைத் தொனியையும் தீங்கிலிருந்து மீட்கும் பொருளையும் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது பெயருக்கும் பட்டத்திற்கும் உள்ள வேறுபாட்டைக் காக்கிறது.
- issue: צִדְקָה என்பதையும் தேவனுடைய விடுவிக்கும் செயலையும் இணைத்தல்
  choice: நீதி
  alternative: நியாயம்
  rationale: இச்சொல் தேவனுடைய நேர்மையான, உண்மையுள்ள இயல்பையும் அதற்கேற்ற செயற்பாட்டையும் உள்ளடக்குகிறது. ‘நீதி’ அந்த விரிவைத் தக்கவைக்கிறது; ‘நியாயம்’ என்பது சாத்தியமான, ஆனால் இங்கு சற்றுக் குறுகிய நுணுக்கம்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. குறுகிய கவிதை வரிகளும் அடைக்கலம், அவமானம், விடுதலை ஆகிய மூல உருவகங்களும் காக்கப்பட்டுள்ளன.
