source:
  edition: WLC
  text: בְּ/יָדְ/ךָ֮ אַפְקִ֪יד ר֫וּחִ֥/י פָּדִ֖יתָה אוֹתִ֥/י יְהוָ֗ה אֵ֣ל אֱמֶֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/005.yaml
  text: Into your hand I commit my spirit; you have redeemed me[a], O Yahweh, God of truth.
translation:
  language: ta
  text: உமது கையில் என் ஆவியை ஒப்படைக்கிறேன்; யாவே, சத்தியத்தின் இறைவனே[a], நீர் என்னை மீட்டீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மையுள்ள இறைவனே.” எபிரெயச் சொல் சத்தியம், நம்பகத்தன்மை, உண்மைத்தன்மை ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: உமது கையில்
  rationale: בְּ உடன் வரும் ‘கை’ என்ற உருவகத்தை நேரடியாகப் பாதுகாக்கிறது; ஒப்படைத்தல் என்ற வினையுடன் இது ஒருவரின் பாதுகாப்புக்கும் அதிகாரத்துக்கும் தன்னை அளிப்பதைக் குறிக்கிறது.
- source_word: אַפְקִיד
  choice: ஒப்படைக்கிறேன்
  rationale: פקד என்பதன் ஹிபில் வடிவம் இங்கு மற்றொருவரின் பொறுப்பிலும் பாதுகாப்பிலும் ஒப்புவிப்பதைக் குறிக்கிறது. ‘ஒப்படைக்கிறேன்’ என்பது இயல்பானதும் மரியாதைமிக்கதுமான நவீனத் தமிழ்.
- source_word: רוּחִי
  choice: என் ஆவியை
  rationale: רוּחַ என்பதற்கு ஆவி, மூச்சு போன்ற பொருள்கள் உண்டு. இந்த வேண்டுதல் சூழலில் ஒருவர் தமது உயிரையும் உள்ளார்ந்த தன்மையையும் இறைவனிடம் ஒப்படைப்பதை ‘என் ஆவி’ சிறப்பாக வெளிப்படுத்துகிறது; ‘மூச்சு’ என்பது சாத்தியமானாலும் இங்கு குறுகிய பொருளைத் தரலாம்.
- source_word: פָּדִיתָה
  choice: மீட்டீர்
  rationale: פדה என்பது மீட்பதையோ விலை கொடுத்து விடுவிப்பதையோ குறிக்கிறது. எபிரெய நிறைவு வினையின் முடிவுற்ற செயலைத் தமிழில் ‘மீட்டீர்’ தெளிவாகவும் சுருக்கமாகவும் தருகிறது.
- source_word: אוֹתִי
  choice: என்னை
  rationale: நேரடிச் செயப்படுபொருள் சுட்டுப்பெயர் இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֵל
  choice: இறைவன்
  rationale: אֵל இங்கு யாவே என்ற பெயருக்கு இணைப்பெயராக வருகிறது. ‘இறைவன்’ என்பது தெளிவான, மரியாதைமிக்க நவீனத் தமிழ் சொல்.
- source_word: אֱמֶת
  choice: சத்தியத்தின்
  rationale: אֱמֶת என்பது சத்தியம், நம்பகத்தன்மை, உண்மைத்தன்மை ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘சத்தியத்தின் இறைவன்’ என்ற வடிவம் எபிரெய இணைப்புத் தொடரை வெளிப்படையாகப் பாதுகாக்கிறது; ‘உண்மையுள்ள இறைவன்’ என்ற சூழல்சார் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: אֵל אֱמֶת என்பதில் אֱמֶת-இன் பொருள் நயம்
  choice: சத்தியத்தின் இறைவன்
  alternative: உண்மையுள்ள இறைவன்
  rationale: எபிரெயச் சொல் சத்தியத்தையும் நம்பகமான உண்மைத்தன்மையையும் குறிக்க முடியும். முதன்மை உரை இணைப்புத் தொடரின் வடிவத்தைப் பாதுகாக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டதால் பொருள் வரம்பு ஒரே விளக்கமாகச் சுருக்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் மரியாதைமிக்க வேண்டுதல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘நீர்’, ‘மீட்டீர்’ பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் ‘கை’ உருவகமும் அரைப்புள்ளியால் வெளிப்படும் இரு கூறுகளின் உறவும் பாதுகாக்கப்பட்டுள்ளன.
