  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
translation:
  language: ta
  text: ஆண்டவருக்கு உண்மையுள்ள அனைவரும், ஆண்டவரை நேசியுங்கள்! உண்மையுள்ளவர்களை ஆண்டவர் காத்துக்கொள்கிறார்; அகந்தையுடன் நடப்பவனுக்கோ முழுமையாகக் கைம்மாறு செய்கிறார்[b].
  philosophy: optimal-equivalence
