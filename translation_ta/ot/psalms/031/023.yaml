lexical_decisions:
- source_word: אֶהֱבוּ
  choice: அன்புகூருங்கள்
  rationale: אהב என்பதன் ஆண்பால் பன்மை கட்டளை வடிவம். வழிபாட்டுச் சமூகத்தாரை நேரடியாக அழைக்கும் கட்டளையின் வலிமையை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: எபிரெய வேதாகமத்தின் தெய்வீகப் பெயரைத் தமிழில் நிலைபெற்றுள்ள மரியாதைமிக்க பெயர்ப்பாக வழங்குகிறது.
- source_word: כָּל־חֲסִידָיו
  choice: அவருக்கு உண்மையுள்ளவர்களே, நீங்கள் அனைவரும்
  rationale: חסידיו என்பது ஆண்டவருடனான உடன்படிக்கை உறவில் பற்றுறுதியும் பக்தியும் கொண்டவர்களைக் குறிக்கிறது. விளிவேற்றுமையும் ‘நீங்கள் அனைவரும்’ என்பதும் மூலத்தின் நேரடி அழைப்பையும் כָּל என்பதையும் தெளிவாக்குகின்றன.
- source_word: אֱמוּנִים
  choice: உண்மையுள்ளவர்களை
  rationale: אמן வேரிலிருந்து வந்த இப்பன்மைச் சொல் நம்பகத்தன்மை அல்லது உண்மைத்தன்மை உடையவர்களைப் பெயர்ச்சொல் போலக் குறிப்பிடுகிறது.
- source_word: נֹצֵר
  choice: காத்துக்கொள்கிறார்
  rationale: கவனமாகக் காத்தல், பாதுகாத்தல் என்ற נצר சொல்லின் பொருளையும் சங்கீதத்தின் பாதுகாப்புக் கருப்பொருளையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמְשַׁלֵּם עַל־יֶתֶר
  choice: முழுமையாகக் கைம்மாறு செய்கிறார்
  rationale: שלם என்பதன் பீயேல் வடிவம் கைம்மாறு அல்லது பதிலீடு செய்வதைக் குறிக்கிறது; עַל־יֶתֶר அதன் நிறைவு அல்லது மிகுதியை வலுப்படுத்துகிறது.
- source_word: עֹשֵׂה גַאֲוָה
  choice: அகந்தையுடன் நடப்பவனுக்கு
  rationale: சொல்லுக்குச் சொல் ‘அகந்தையைச் செய்பவன்.’ செயலில் வெளிப்படும் ஆணவ நடத்தையைத் தமிழில் இயல்பாகவும், அதன் தொடர்ச்சியான பண்பை இழக்காமலும் தருகிறது.
theological_decisions:
- issue: חֲסִידָיו என்ற உடன்படிக்கை அடையாளச் சொல்லின் பெயர்ப்பு
  choice: அவருக்கு உண்மையுள்ளவர்கள்
  alternative: அவருடைய பரிசுத்தவான்கள் / அவரிடம் பற்றுறுதியுள்ளவர்கள்
  rationale: ‘உண்மையுள்ளவர்கள்’ என்பது ஆண்டவருடனான உறவிலுள்ள பற்றுறுதியையும் நடைமுறை உண்மைத்தன்மையையும் வெளிப்படுத்துகிறது; ‘பரிசுத்தவான்கள்’ எனும் பிற்கால சமயப் பொருளைத் தேவையின்றி இறக்குமதி செய்வதையும் தவிர்க்கிறது.
- issue: தெய்வீகப் பாதுகாப்பும் அகந்தைக்கான கைம்மாறும்
  choice: உண்மையுள்ளவர்களை ஆண்டவர் காத்துக்கொள்கிறார்; அகந்தையுடன் நடப்பவனுக்கோ முழுமையாகக் கைம்மாறு செய்கிறார்
  alternative: உண்மையுள்ளவர்களை ஆண்டவர் பாதுகாக்கிறார்; அகந்தையுடன் நடப்பவனை மிகுதியாகத் தண்டிக்கிறார்
  rationale: மூலம் பாதுகாப்பையும் கைம்மாறையும் அடுத்தடுத்து நிறுத்துகிறது. ‘தண்டிக்கிறார்’ என்று பொருளைச் சுருக்காமல், கைம்மாற்றின் தன்மையில் உள்ள நியாயத்தீர்ப்புச் சுமையையும் மூலத்தின் விரிவையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் மரியாதைமிக்க கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் அடியின் நேரடி அழைப்பு விளிவேற்றுமையால் தெளிவாக்கப்பட்டுள்ளது; இரண்டாம் அடியின் எதிர்மறை ஒப்புமை ‘-க்கோ’ மூலம் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
