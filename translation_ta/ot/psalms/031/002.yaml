translation_notes:
  register: நவீனத் தரத் தமிழில், இறைவனை நோக்கிய கண்ணியமான வேண்டுதல் நடையைப் பயன்படுத்துகிறது. எபிரேயத்தின் ‘செவி,’ ‘பாறை,’ ‘இல்லம்’ ஆகிய தெளிவான உருவகங்கள் தக்கவைக்கப்பட்டுள்ளன. ஆலோசனை அடுக்கிலிருந்த அடிக்குறிப்பு குறியீடுகளின் இடமாற்றம் திருத்தப்பட்டு, [a] பாறைச் சொற்றொடருக்கும் [b] இல்லம்/அரண் சொற்றொடருக்கும் இணைக்கப்பட்டுள்ளன.
