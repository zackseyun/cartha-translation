  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הַטֵּ֤ה אֵלַ֨/י אָזְנְ/ךָ֮ מְהֵרָ֪ה הַצִּ֫ילֵ֥/נִי הֱיֵ֤ה לִ֨/י לְֽ/צוּר מָ֭עוֹז לְ/בֵ֥ית מְצוּד֗וֹת לְ/הוֹשִׁיעֵֽ/נִי׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/002.yaml
  text: Incline your ear to me[a]; quickly rescue me. Be for me a rock of refuge[b], a fortified house to save me.
translation:
  language: ta
  text: 'உமது செவியை என்னிடம் சாய்த்து,

    விரைவாக என்னை மீட்டருளும்.

    என்னைக் காப்பாற்றுவதற்கு,

    எனக்கு அடைக்கலமான பாறையாகவும்[a]

    அரண்மிக்க இல்லமாகவும்[b] இரும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வலிமையான பாறையாக.’ எபிரேயச் சொற்றொடர் ‘பாறை’ என்பதுடன் பாதுகாப்பு அல்லது அரண் என்ற பொருளுடைய சொல்லை இணைக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஒரு கோட்டையாக’ அல்லது ‘அரண்களின் இல்லமாக.’ எபிரேயம் ‘இல்லம்’ என்ற உருவகத்தைத் தக்கவைத்தபடியே, அது வலுவாக அரணாக்கப்பட்டிருப்பதை விவரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: உமது செவியை என்னிடம் சாய்த்து
  rationale: ‘செவியைச் சாய்த்தல்’ என்ற எபிரேய உருவகத்தைத் தக்கவைத்து, கவனித்துக் கேட்கும்படியான வேண்டுதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְהֵרָה הַצִּילֵנִי
  choice: விரைவாக என்னை மீட்டருளும்
  rationale: מְהֵרָה வெளிப்படுத்தும் அவசரத்தையும், נצל குறிக்கும் ஆபத்திலிருந்து மீட்டெடுக்கும் செயலையும் தெளிவாகக் காட்டுகிறது. ‘அருளும்’ என்பது இறைவனை நோக்கிய வேண்டுதலுக்குரிய கண்ணியமான நவீனத் தமிழ் நடை.
- source_word: הֱיֵה לִי
  choice: எனக்கு ... இரும்
  rationale: היה என்ற கட்டளையின் நேரடியான உறவுசார் வலிமையைத் தக்கவைக்கிறது.
- source_word: לְצוּר מָעוֹז
  choice: அடைக்கலமான பாறையாக
  rationale: צוּר என்பதன் உறுதியான ‘பாறை’ உருவகத்தையும், מָעוֹז என்பதன் பாதுகாப்பு/அடைக்கலப் பொருளையும் இயல்பாக இணைக்கிறது.
- source_word: לְבֵית מְצוּדוֹת
  choice: அரண்மிக்க இல்லமாக
  rationale: בֵּית என்பதன் ‘இல்லம்’ உருவகத்தை நீக்காமல், מְצוּדוֹת குறிக்கும் வலுவான அரண் அல்லது கோட்டைப் பாதுகாப்பையும் வெளிப்படுத்துகிறது.
- source_word: לְהוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றுவதற்கு
  rationale: ישׁע வினையின் நோக்கப் பொருளைத் தெளிவாகக் காட்டி, முன்வரும் נצל என்பதற்குத் தேர்ந்த ‘மீட்டருளும்’ என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
