  text: כִּֽי סַלְעִ֣/י וּ/מְצוּדָתִ֣/י אָ֑תָּה וּ/לְמַ֥עַן שִׁ֝מְ/ךָ֗ תַּֽנְחֵ֥/נִי וּֽ/תְנַהֲלֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/003.yaml
  text: For you are my rock and my fortress[c][b][a]; and for your name’s sake you will lead me and guide me.
translation:
  language: ta
  text: ஏனெனில்[a] நீரே என் கற்பாறையும் என் அரணும்[b]; உமது பெயரின் பொருட்டு என்னை நடத்துவீர்; வழிகாட்டுவீர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நீர் என் கற்பாறையும் என் அரணுமாயிருப்பதால்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் כִּי காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘என் கோட்டை’ அல்லது ‘என் வலுவான அடைக்கலம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயக் கவிதையில் இவ்விரு வினைகளும் பொருள் நெருக்கமுள்ளவை. அவற்றை ஒரே சொல்லாகச் சுருக்காமல், ‘நடத்துவீர்’ என்றும் ‘வழிகாட்டுவீர்’ என்றும் தரப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இச்சொல் முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘ஏனெனில்’ காரணத் தொடர்பை இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: סַלְעִי
  choice: என் கற்பாறை
  rationale: பாதுகாப்பான அடைக்கலத்தைக் குறிக்கும் பாறை உருவகத்தை ‘கற்பாறை’ தெளிவாகப் பேணுகிறது.
- source_word: מְצוּדָתִי
  choice: என் அரண்
  rationale: பாதுகாப்பளிக்கும் கோட்டையையோ வலுவான இடத்தையையோ குறிக்கும் எபிரெயச் சொல்லுக்கு ‘அரண்’ சுருக்கமான, இயல்பான தமிழ் இணையாகும்.
- source_word: אָתָּה
  choice: நீரே
  rationale: தனித்து வரும் எபிரெயப் பதிலிப்பெயரின் வலியுறுத்தலை ‘நீரே’ பேணுகிறது; இறைவனை நோக்கிய கண்ணியமான ஒருமை அழைப்பாகவும் அமைகிறது.
- source_word: וּלְמַעַן שִׁמְךָ
  choice: உமது பெயரின் பொருட்டு
  rationale: இறைவனுடைய பெயர், மாண்பு, வெளிப்படுத்தப்பட்ட இயல்பு ஆகியவற்றின் அடிப்படையில் அவர் செயல்படுவதைச் சுட்டும் மூலமொழி மரபுத்தொடரை விளக்கிப் பெருக்காமல் பேணுகிறது.
- source_word: תַּנְחֵנִי
  choice: என்னை நடத்துவீர்
  rationale: ஹிபில் வினையின் வழிநடத்துதல் என்ற பொருளையும், இச்சூழலில் உள்ள நம்பிக்கையுடனான எதிர்கால எதிர்பார்ப்பையும் இயல்பான தமிழில் தருகிறது.
- source_word: וּתְנַהֲלֵנִי
  choice: எனக்கு வழிகாட்டுவீர்
  rationale: முந்தைய வினையுடன் பொருள் நெருக்கம் கொண்டிருந்தாலும் இரு வினைகளையும் ஒன்றாக்காமல், எபிரெயக் கவிதை இணைநிலையைப் பேணுகிறது.
theological_decisions:
- issue: ‘உமது பெயரின் பொருட்டு’ என்பதன் பொருள்
  choice: இறைவன் தமது பெயர்—அவரது வெளிப்படுத்தப்பட்ட இயல்பு, மாண்பு, உண்மைத்தன்மை—நிமித்தம் வழிநடத்துகிறார் என்ற மூலமொழி மரபுத்தொடர் அப்படியே வைக்கப்பட்டுள்ளது.
  alternative: பிறர் முன் இறைவனுடைய புகழை மட்டும் குறிக்கும் குறுகிய விளக்கம்.
  rationale: மூலவாசகம் ‘பெயர்’ என்பதன் பொருளை ஒரே அம்சமாகக் குறுக்கவில்லை; எனவே மொழிபெயர்ப்பும் அதன் செறிவையும் இறையியல் இழுவிசையையும் திறந்தவாறே வைக்கிறது.
- issue: இரு நிறைவுறா வினைகளின் காலம்/பாங்கு
  choice: நம்பிக்கையுடனான எதிர்காலமாக ‘நடத்துவீர், வழிகாட்டுவீர்’ என்று தரப்பட்டுள்ளது.
  alternative: வேண்டுகோளாக ‘என்னை நடத்தும், வழிகாட்டும்’ அல்லது நிகழ்காலமாக ‘நடத்துகிறீர், வழிகாட்டுகிறீர்’.
  rationale: ‘நீரே என் கற்பாறையும் என் அரணும்’ என்ற அறிக்கையிலிருந்து பிறக்கும் உறுதியான எதிர்பார்ப்பை எதிர்கால வடிவம் இயல்பாக வெளிப்படுத்துகிறது; எனினும் வேண்டுகோள் சார்ந்த வாசிப்பும் இலக்கணரீதியாக சாத்தியம்.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கி ‘நீர்/உமது’ என்ற மரியாதை ஒருமை வடிவங்கள் இடப்பட்டுள்ளன. உருவகங்களும் இரட்டை வினை இணைநிலையும் இயன்றவரை நேரடியாகப் பேணப்பட்டுள்ளன.
