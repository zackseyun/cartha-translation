base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/007.yaml
  text: I will rejoice and be glad in your steadfast love[a], because you have seen my affliction; you have known the distresses of my soul.
translation:
  language: ta
  text: உமது மாறாத அன்பில் நான் களிகூர்ந்து மகிழ்வேன்; ஏனெனில், நீர் என் துன்பத்தைக் கண்டீர்; என் ஆத்துமாவின் நெருக்கடிகளை அறிந்தீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என் உயிரின் நெருக்கடிகளை” அல்லது “எனக்கேற்பட்ட நெருக்கடிகளை” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் நெஃபெஷ் (נֶפֶשׁ) என்பது சூழலுக்கேற்ப “ஆத்துமா,” “உயிர்,” அல்லது “ஒருவரின் முழுத் தன்மை” என்று பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָגִילָה
  choice: நான் களிகூர்ந்து
  rationale: גיל என்பதன் முதலாம் நபர் ஒருமை விருப்ப/உறுதிப்பாட்டு வடிவம் தீவிரமான மகிழ்ச்சியை வெளிப்படுத்துகிறது; ‘நான் களிகூர்ந்து’ என்பது கவிதைநயத்தையும் முன்னோக்கிய உறுதியையும் காக்கிறது.
- source_word: וְאֶשְׂמְחָה
  choice: மகிழ்வேன்
  rationale: שמח, גיל என்பதோடு இணைந்து கவிதைத் தீவிரத்தை உருவாக்குகிறது; ‘களிகூர்ந்து மகிழ்வேன்’ என்ற இணைப்பு இயல்பான தமிழில் இரு வினைகளின் வேறுபாட்டைக் காக்கிறது.
- source_word: בְחַסְדֶּךָ
  choice: உமது மாறாத அன்பில்
  rationale: חסד என்பது அன்பு, பற்றுறுதி, நிலைத்த விசுவாசம் ஆகிய நுணுக்கங்களை உள்ளடக்குகிறது; ‘மாறாத அன்பு’ இவற்றை எளிய நவீன தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר
  choice: ஏனெனில்
  rationale: இங்கு தொடர்புச் சொல்லாக இருந்தாலும், முந்தைய மகிழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்துவதால் காரணப் பொருள் இயல்பாகிறது.
- source_word: רָאִיתָ אֶת עָנְיִי
  choice: நீர் என் துன்பத்தைக் கண்டீர்
  rationale: עֳנִי துன்பம், வேதனை, ஒடுக்கநிலை ஆகியவற்றைக் குறிக்கலாம்; ‘துன்பம்’ பொதுவாசகருக்குத் தெளிவாகவும் சங்கீத நடைக்கு ஏற்றதாகவும் உள்ளது.
- source_word: יָדַעְתָּ
  choice: அறிந்தீர்
  rationale: ידע வெறும் தகவலறிவை மட்டுமல்லாமல் கவனித்து உணரும் உறவுசார் அறிவையும் குறிக்கக்கூடும்; ‘அறிந்தீர்’ அதன் பரப்பைத் திறந்தே வைக்கிறது.
- source_word: בְּצָרוֹת נַפְשִׁי
  choice: என் ஆத்துமாவின் நெருக்கடிகளை
  rationale: צָרוֹת என்பதன் பன்மையை ‘நெருக்கடிகள்’ காக்கிறது; נֶפֶשׁ என்பதற்கு ஆத்துமா, உயிர், தன்முழுமை போன்ற பொருள்கள் உள்ளதால் முதன்மை உரையில் ‘ஆத்துமா’ வைக்கப்பட்டு மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: சங்கீதப் புலம்பலில் נֶפֶשׁ என்பதன் பொருள்
  choice: ஆத்துமா
  alternative: உயிர்; முழுத் தன்மை/நான்
  rationale: ‘ஆத்துமா’ என்ற மொழிபெயர்ப்பு உள்ளார்ந்த தனிப்பட்ட நெருக்கடியைத் தக்கவைக்கிறது; அதேவேளை எபிரெயச் சொல் உடல்–ஆத்துமா என்ற தொழில்நுட்பப் பிரிவை கட்டாயப்படுத்தாது. எனவே அதன் ‘உயிர்’ மற்றும் ‘முழுத் தன்மை’ பொருள்கள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்குரிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைச் சுட்டும் ‘நீர்/உமது’ மரியாதை வடிவங்கள் தொடர்ச்சியாகப் பேணப்பட்டுள்ளன; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
