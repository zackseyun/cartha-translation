source:
  edition: WLC
  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
translation:
  language: ta
  text: யாவே, என்னை அவமானமடைய விடாதேயும்; ஏனெனில் நான் உம்மை நோக்கிக் கூப்பிட்டிருக்கிறேன். தீயவர்கள் அவமானமடையட்டும்; அவர்கள் ஷியோலில்[a] மௌனமாக இருக்கட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஷியோலில் அசைவற்றிருக்கட்டும்’ அல்லது ‘மௌனமாக ஷியோலுக்குச் செல்லட்டும்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை மௌனத்தையோ அசைவின்மையையோ குறிக்கலாம். ‘ஷியோல்’ என்பது இறந்தோரின் உலகைக் குறிக்கிறது; அது கட்டாயமாக ‘நரகம்’ என்று பொருள்படாது.
    reason: יִדְּמוּ மற்றும் לִשְׁאוֹל ஆகியவற்றின் சொற்பொருள் மாற்றுகளையும், ‘ஷியோல்’ என்பதன் கருத்து எல்லையையும் பாதுகாத்தல்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரைப் பொதுப்பட்டப் பட்டப்பெயராக மாற்றாமல், எபிரெய வடிவத்திற்கு அண்மையான தமிழாக்கமாக ஒலிபெயர்க்கிறது; அழைப்புநிலை தமிழில் நேரடி விளியால் இயல்பாக வெளிப்படுகிறது.
- source_word: אַל אֵבוֹשָׁה
  choice: என்னை அவமானமடைய விடாதேயும்
  rationale: אַל உடன் வரும் வேண்டுதல் சார்ந்த எதிர்மறை வினைநிலையையும், בושׁ குறிக்கும் அவமானத்திற்குள்ளாதலையும் இயல்பான தமிழில் தருகிறது.
- source_word: כִּי קְרָאתִיךָ
  choice: நான் உம்மை நோக்கிக் கூப்பிட்டிருக்கிறேன்
  rationale: כִּי தரும் காரணத் தொடர்பை வாக்கிய வரிசையால் வெளிப்படுத்தி, நிறைவுற்ற எபிரெய வினையின் தற்போதைய வேண்டுதலுடன் தொடரும் பொருத்தத்தை ‘கூப்பிட்டிருக்கிறேன்’ எனக் காக்கிறது.
- source_word: יֵבֹשׁוּ רְשָׁעִים
  choice: தீயவர்கள் அவமானமடையட்டும்
  rationale: வேண்டுதல் அல்லது சாபவாக்கிய நுணுக்கமுள்ள யுஸ்ஸிவ் வினையை ‘-ட்டும்’ எனத் தருகிறது; முதல் அரையடியிலுள்ள בושׁ உடனான சொற்பொருள் இணைப்பையும் ‘அவமானமடைய’ என்று மீள்கிறது.
- source_word: יִדְּמוּ
  choice: மௌனமாயிருக்கட்டும்
  rationale: இவ்வினை குறிக்கக்கூடிய மௌனம் அல்லது அசைவின்மையில், காரணவினைப் பொருளைச் சேர்க்காமல் ‘மௌனமாயிரு’ என்ற அடிப்படை நுணுக்கத்தை முதன்மைப்படுத்துகிறது; மாற்றுப் புரிதல்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: לִשְׁאוֹל
  choice: ஷியோலில்
  rationale: שְׁאוֹל என்பதைக் ‘நரகம்’ அல்லது ஒரு தனிக் ‘கல்லறை’ என்று குறுக்காமல், இறந்தோரின் உலகைக் குறிக்கும் எபிரெயக் கருத்துச்சொல்லாக ஒலிபெயர்க்கிறது; ל முன்னொட்டை இச்சூழலில் இருப்பிடப் பொருளாக ‘-இல்’ என வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது; எந்த ஒரு சபை மரபின் தனிப்பட்ட வழக்கையும் கட்டாயப்படுத்தவில்லை.
- issue: שְׁאוֹל என்பதன் பொருள்
  choice: ஷியோல்
  alternative: பாதாளம் / இறந்தோரின் உலகம் / கல்லறை
  rationale: இச்சொல்லை பிற்கால ‘நரகம்’ என்ற கருத்துடன் ஒப்பாக்காமல், அதன் எபிரெயப் பண்பாட்டு மற்றும் இறையியல் விரிவைத் திறந்தவாறு வைக்கிறது.
- issue: יִדְּמוּ என்பதன் வேண்டுதல்
  choice: மௌனமாயிருக்கட்டும்
  alternative: அசைவற்றிருக்கட்டும் / மௌனமாக ஷியோலுக்குச் செல்லட்டும்
  rationale: வினையின் மௌனம்–அசைவின்மை சார்ந்த உண்மையான சொற்பொருள் தெளிவின்மையை ஓரளவு காத்து, வெளிப்படையான ‘அழிந்துபோகட்டும்’ என்ற பொருளை உரைக்குள் இறக்குமதி செய்யாமல் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் புரிந்துகொள்ள எளிதான, ஆனால் சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவமான ‘உம்மை’ மற்றும் ‘விடாதேயும்’ பயன்படுத்தப்பட்டுள்ளன; இரு அரையடிகளின் ‘அவமானமடைய’ என்ற இணைநடை காக்கப்பட்டுள்ளது.
