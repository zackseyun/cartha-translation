base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/019.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
translation:
  language: ta
  text: உமக்குப் பயப்படுகிறவர்களுக்காக நீர் சேமித்து வைத்திருக்கும் உமது நன்மை எவ்வளவு மிகுதியானது! உம்மிடம் அடைக்கலம் புகுகிறவர்களுக்காக, மனிதர்கள் அனைவரின் முன்னிலையில்[a] நீர் அதைச் செய்திருக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சார்ந்து, ‘மனுபுத்திரரின் முன்னிலையில்’; இது மனிதர்கள் அனைவரையும் குறிக்கும் மரபுத்தொடர்.
    reason: בְּנֵי אָדָם என்ற சொற்சார்ந்த வடிவத்தையும் அதன் பொதுவான மனிதகுலப் பொருளையும் பதிவு செய்கிறது.
lexical_decisions:
- source_word: מָה רַב
  choice: எவ்வளவு மிகுதியானது
  rationale: வியப்பை வெளிப்படுத்தும் מָה என்பதையும், அளவு அல்லது நிறைவைச் சுட்டும் רַב என்பதையும் இயல்பான தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: טוּבְךָ
  choice: உமது நன்மை
  rationale: இச்சொல் நற்குணத்தையும் அதனால் கிடைக்கும் நற்பயன்களையும் குறிக்கக்கூடும்; ‘நன்மை’ இந்த விரிவான பொருளைப் பாதுகாக்கிறது.
- source_word: צָפַנְתָּ
  choice: நீர் சேமித்து வைத்திருக்கும்
  rationale: ஒன்றைப் பிற்காலத்திற்காகப் பாதுகாத்து வைத்தல் அல்லது குவித்து வைத்தல் என்ற உருவகத்தைத் தெளிவாகத் தருகிறது.
- source_word: לִירֵאֶיךָ
  choice: உமக்குப் பயப்படுகிறவர்கள்
  rationale: கடவுளைக் குறித்த அச்சம் மட்டுமல்லாமல் பயபக்தியையும் உள்ளடக்கும் மூலச்சொல்லின் வழக்கமான வேதாகமப் பொருளைப் பாதுகாக்கிறது.
- source_word: פָּעַלְתָּ
  choice: நீர் அதைச் செய்திருக்கிறீர்
  rationale: இங்கு முன்பு குறிப்பிடப்பட்ட நன்மையைச் செயலில் நிறைவேற்றுதல் என்பதே கருத்து; தமிழில் ‘அதை’ சேர்ப்பது தொடர்பைத் தெளிவாக்குகிறது.
- source_word: לַחֹסִים בָּךְ
  choice: உம்மிடம் அடைக்கலம் புகுகிறவர்களுக்காக
  rationale: חסה என்பதிலுள்ள பாதுகாப்பை நாடும் தெளிவான உருவகத்தைப் பாதுகாக்கிறது; வெறும் ‘நம்புகிறவர்கள்’ என்பதைவிட மூலத்துக்கு நெருக்கமானது.
- source_word: נֶגֶד
  choice: முன்னிலையில்
  rationale: பிறர் காணும் வெளிப்படையான சூழலில் நிகழ்வதை இச்சொல் குறிக்கிறது.
- source_word: בְּנֵי אָדָם
  choice: மனிதர்கள்
  rationale: இது மனிதகுலத்தைக் குறிக்கும் எபிரெய பிரதிநிதித்துவ மரபுத்தொடர்; இயல்பான நவீன தமிழில் ‘மனிதர்கள்’ அதன் பொருளைத் துல்லியமாக வழங்குகிறது.
theological_decisions:
- issue: בְּנֵי אָדָם என்ற மனிதகுலத்தைக் குறிக்கும் மரபுத்தொடர்
  choice: மனிதர்கள்
  alternative: மனிதரின் மகன்கள் / ஆதாமின் பிள்ளைகள்
  rationale: இது ஆண்களை மட்டும் தனிப்படுத்தாமல் மனிதர்களைப் பொதுவாகக் குறிக்கும் எபிரெய மரபுத்தொடர். பிரதான உரையில் இயல்பான பொருள் தரப்பட்டு, சொற்சார்ந்த வடிவம் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
- issue: צָפַנְתָּ மற்றும் פָּעַלְתָּ ஆகியவற்றின் காலநிலை வேறுபாடு
  choice: ‘சேமித்து வைத்திருக்கும்’ என்றும் ‘செய்திருக்கிறீர்’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ஒரே இறந்தகால வடிவில் மொழிபெயர்த்தல்
  rationale: சேமித்து வைக்கப்பட்ட நன்மை இன்னும் இருப்பதையும், அது வெளிப்படையாகச் செயலாக்கப்பட்டதையும் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; இரு செயல்களுக்கிடையிலான கவிதைத் தொடர்பையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்குரிய கண்ணியமான நடையுடன் ‘நீர்/உமது/உம்மிடம்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. முதல் அரையடியின் வியப்பு வாக்கியமாகவும், இரண்டாம் அரையடியின் பொது வெளிப்பாட்டை ‘மனிதர்களின் முன்னிலையில்’ என்றும் காத்துள்ளது.
