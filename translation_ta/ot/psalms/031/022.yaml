  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me[a], I said in my alarm[b], “I am cut off from before your eyes.” Yet you heard the sound of my pleas when I cried to you for help.
translation:
  language: ta
  text: நானோ, என் பதற்றத்தில்[a], “உமது கண்களுக்கு முன்பிலிருந்து நான் அகற்றப்பட்டேன்[b]” என்று சொன்னேன். ஆனாலும், உதவிக்காக நான் உம்மை நோக்கிக் கூக்குரலிட்டபோது, என் மன்றாட்டின் குரலைக் கேட்டீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் அவசரத்தில்.” எபிரெயச் சொல் அவசரம், மனக்கலக்கம் அல்லது பீதி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது பார்வையிலிருந்து.” சொல்லர்த்தமாக, “உமது கண்களுக்கு முன்பிலிருந்து.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  choice: என் பதற்றத்தில்
  rationale: חפז என்பது அவசரம், மனக்கலக்கம், பீதி ஆகிய உணர்வுகளைக் குறிக்கலாம். புலம்பலின் சூழலில் வெறும் வேகத்தைவிட கலங்கிய பதற்றமே முன்னிலையாக இருப்பதால், இயல்பான நவீனத் தமிழில் இவ்வாறு மொழிபெயர்க்கப்பட்டது; ‘என் அவசரத்தில்’ என்ற சாத்தியமும் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: נִגְרַזְתִּי
  choice: நான் துண்டிக்கப்பட்டேன்
  rationale: גזר என்பதன் நிஃபால் வடிவம் இங்கு துண்டிக்கப்படுதல் அல்லது அகற்றப்படுதல் என்ற பொருளைத் தருகிறது. சங்கீதக்காரரின் அந்நேர உணர்வை நேரடிக் கூற்றாகவும் எபிரெய உருவகத்தைத் தக்கவைத்தும் இது காட்டுகிறது.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: உமது கண்களுக்கு முன்பிருந்து
  rationale: இது சொல்லர்த்தமாக ‘உமது கண்களுக்கு முன்பிருந்து’ என்பதாகும். தேவனுடைய பார்வைக்கு அப்பாற்பட்டதாகத் தாம் ஆகிவிட்டதாகப் பாடகர் உணர்ந்ததை, மூலத்தின் கண் சார்ந்த உருவகத்தை அழிக்காமல் வெளிப்படுத்துகிறது.
- source_word: אָכֵן
  choice: ஆனாலும்
  rationale: பாடகரின் அச்சமிக்க முடிவுக்கும் தேவன் உண்மையில் அவரைக் கேட்டதற்கும் இடையிலான வலுவான முரண்பாட்டை இச்சூழலில் אָכֵן குறிக்கிறது.
- source_word: קוֹל תַּחֲנוּנַי
  choice: என் மன்றாட்டுகளின் குரல்
  rationale: קוֹל என்பதன் ‘குரல்/ஒலி’ கூறையும், תַּחֲנוּנִים என்பதன் இரக்கம் வேண்டி மன்றாடுதல் என்ற கூறையும் இச்சொற்றொடர் தக்கவைக்கிறது.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: உதவிக்காக நான் உம்மை நோக்கிக் கூக்குரலிட்டபோது
  rationale: שׁוע என்பது உதவி நாடி எழுப்பும் கூக்குரலைக் குறிக்கிறது; אֵלֶיךָ அந்தக் கூக்குரல் தேவனை நோக்கியது என்பதைக் காட்டுகிறது. ‘உதவிக்காக’ என்பது வினையில் உள்ள நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேவன் கைவிட்டுவிட்டதாகத் தோன்றிய அனுபவமும் அவர் உண்மையில் கேட்டதும்
  choice: “உமது கண்களுக்கு முன்பிருந்து நான் துண்டிக்கப்பட்டேன்” என்ற பாடகரின் அனுபவக் கூற்றையும், “ஆனாலும்… கேட்டீர்” என்ற எதிர்மறைத் திருப்பத்தையும் அப்படியே தக்கவைத்தல்
  alternative: “நீர் என்னை நிராகரித்துவிட்டீர் என்று நினைத்தேன்” என விளக்கமாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை தேவன் நிராகரித்தார் என்று கோட்பாட்டுரீதியில் நேரடியாகக் கூறாமல், பாடகரின் அச்சமிக்க அனுபவத்தையும் அதற்கு மாறான தேவனுடைய செவிகொடுத்தலையும் அருகருகே வைக்கிறது. மொழிபெயர்ப்பு இந்த இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான பக்திநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘உம்மை’, ‘கேட்டீர்’ ஆகியவை தொடர்ச்சியாகப் பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் கண் உருவகமும் மனிதப் பதற்றத்துக்கும் தெய்வீகச் செவிகொடுத்தலுக்கும் இடையிலான எதிர்மறைத் திருப்பமும் பாதுகாக்கப்பட்டுள்ளன.
