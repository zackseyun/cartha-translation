reference: Psalms 31:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: מִ/כָּל צֹרְרַ֨/י הָיִ֪יתִי חֶרְפָּ֡ה וְ/לִ/שֲׁכֵנַ֨/י מְאֹד֮ וּ/פַ֪חַד לִֽ/מְיֻדָּ֫עָ֥/י רֹאַ֥/י בַּ/ח֑וּץ נָדְד֥וּ מִמֶּֽ/נִּי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[c][b]; those who see me in the street flee from me.
translation:
  language: ta
  text: என் பகைவர்கள் அனைவரின் காரணமாக நான் பழிச்சொல்லுக்கு இலக்கானேன்[a]; என் அயலாருக்கு நான் மிகவும் பழிச்சொல்லுக்கு இலக்கானேன்; என் அறிமுகமானவர்களுக்கு அச்சமூட்டுபவனாகிவிட்டேன். தெருவில்[b] என்னைக் காண்கிறவர்கள் என்னைவிட்டு ஓடி விலகினர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் பகைவர்கள் அனைவரிடமிருந்தும் நான் பழிச்சொல்லுக்கு இலக்கானேன்.’ தொடக்கச் சொற்றொடரை ஒப்பீடாகப் புரிந்துகொண்டால், ‘என் பகைவர்கள் அனைவரையும்விட நான் அதிகப் பழிச்சொல்லுக்கு இலக்கானேன்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: சொல்லர்த்தமாக, ‘வெளியே.’ இங்கு பொதுவெளியில் காணப்படுவது குறிக்கப்படுகிறது.
    reason: cultural_note
  - marker: c
    text: அல்லது, ‘என்னைவிட்டு விலகிச் சென்றனர்’ அல்லது ‘என்னைவிட்டு அலைந்து சென்றனர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  choice: என் பகைவர்கள் அனைவராலும்
  rationale: מִן இங்கு பகைவர்கள் அவரது பழிப்புக்குக் காரணமாக அல்லது அதற்கான பின்னணியாக இருந்ததைக் குறிக்கிறது. தமிழில் காரணத்தை இயல்பாக வெளிப்படுத்த ‘அனைவராலும்’ என மொழிபெயர்க்கப்பட்டது; மூலத்தில் சாத்தியமான வேறு தொடர்புகள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: הָיִיתִי חֶרְפָּה
  choice: நான் பழிப்புக்கு ஆளாகிவிட்டேன்
  rationale: היה என்பதன் நிறைவுற்ற வடிவமும் חֶרְפָּה என்பதும், ஒருவர் இகழ்ச்சிக்கும் பழிச்சொல்லுக்கும் இலக்கான விளைவுநிலையைச் சுட்டுகின்றன. ‘ஆளாகிவிட்டேன்’ நிகழ்வையும் அதன் நீடிக்கும் விளைவையும் வெளிப்படுத்துகிறது.
- source_word: וְלִשֲׁכֵנַי מְאֹד
  choice: குறிப்பாக என் அயலாரிடையே மிகுந்த பழிப்புக்கு ஆளானேன்
  rationale: מְאֹד அயலாரிடையே ஏற்பட்ட பழிப்பின் தீவிரத்தை வலியுறுத்துகிறது. முன் கூறிய ‘பழிப்பு’ தமிழில் தெளிவுக்காக மீண்டும் சொல்லப்பட்டுள்ளது.
- source_word: וּפַחַד לִמְיֻדָּעָי
  choice: என் அறிமுகமானவர்களுக்குத் திகிலாகிவிட்டேன்
  rationale: פַחַד என்பது பயம் அல்லது திகில்; מְיֻדָּעִים நெருங்கிய நண்பர்களை அவசியம் குறிக்காமல், அறிமுகமானவர்களைக் குறிக்கிறது.
- source_word: רֹאַי בַּחוּץ
  choice: தெருவில் என்னைக் காண்கிறவர்கள்
  rationale: בַּחוּץ என்பதன் சொற்பொருள் ‘வெளியே’; இச்சூழலில் பொதுவெளியில் அல்லது தெருவில் காணப்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נָדְדוּ מִמֶּנִּי
  choice: என்னைவிட்டு ஓடி விலகினர்
  rationale: נָדַד என்பதற்கு விலகிச் செல்லுதல், அலைந்து செல்லுதல், தப்பியோடுதல் ஆகிய பொருள்கள் உண்டு. ஒருவரைக் கண்டதும் தவிர்க்கும் இச்சூழலில் ‘ஓடி விலகினர்’ அதன் தீவிரத்தையும் தொலைவாகிச் செல்வதையும் காக்கிறது.
