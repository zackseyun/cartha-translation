translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைநயமும் சங்கீதத்தின் கண்ணியமான புலம்பல் தொனியும் காக்கப்பட்டுள்ளன. ‘அயலார்,’ ‘அறிமுகமானவர்கள்,’ ‘திகில்’ போன்ற சொற்கள் இயல்பாகவும் பரவலாகப் புரியக்கூடியவையாகவும் தேர்ந்தெடுக்கப்பட்டன. மூல எபிரெயச் சொற்றொடரின் உண்மையான பலபொருள் வாய்ப்புகள் முதன்மை உரையில் ஒரே விளக்கமாகத் திணிக்கப்படாமல் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
