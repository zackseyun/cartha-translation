  text: For the choirmaster. A psalm of David[a].
translation:
  language: ta
  text: இசைத் தலைவருக்கு. தாவீதின் சங்கீதம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீது இயற்றிய சங்கீதம்” அல்லது “தாவீதுக்கான சங்கீதம்” என்றும் இருக்கலாம்; எபிரெயத் தலைப்பு ஆசிரியத்துவம், தொடர்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும்.
