lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: இசை நிகழ்த்துதலை மேற்பார்வையிடும் நபரைக் குறிக்கும் சங்கீதத் தலைப்புச் சொல்லாக இதைப் புரிந்துகொள்கிறோம். முன்னொட்டு לַ־ இங்கே நோக்கம் அல்லது பெறுநரைக் காட்டுவதால் ‘-க்கு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசைக்கருவி துணையுடன் பாடப்படும் பாடலைக் குறிக்கும் வழக்கமான சங்கீதத் தலைப்புச் சொல். தமிழில் வேதாகமப் பாடல் வகையை இயல்பாகவும் மரபாகவும் குறிக்கும் சொல் ‘சங்கீதம்’.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: இந்த לְ־ முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, உரிமை அல்லது அர்ப்பணிப்பு ஆகிய பல உறவுகளைக் குறிக்கக்கூடும். ‘தாவீதின்’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் இருந்து, ‘தாவீது இயற்றியது’ என்று மட்டும் பொருளைச் சுருக்கிவிடாமல் ஓரளவு தெளிவின்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: தாவீதுடன் சங்கீதத்துக்கு உள்ள உறவு
  choice: தாவீதின்
  alternative: தாவீது இயற்றிய; தாவீதுக்கான; தாவீதுக்குரிய
  rationale: எபிரெயத் தலைப்பு தாவீதே ஆசிரியர் என்று கட்டாயமாகத் தீர்மானிப்பதில்லை; ஆசிரியத்துவம், தொடர்பு, தொகுப்புச் சார்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றுக்கு இடமளிக்கிறது. ஆகவே மூலத்தில் உள்ள நுட்பமான தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத் தலைப்புக்குரிய சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இசைத் தலைவர்’ என்பது பொதுவாசகருக்குப் புரியக்கூடியதாகவும், ‘சங்கீதம்’ என்பது நிலைபெற்ற இலக்கிய-வழிபாட்டு சொல்லாகவும் உள்ளது.
