theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூல உரை பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைத் தனிப்பெயரையே பயன்படுத்துகிறது. எனவே பட்டமாக மாற்றாமல் தமிழில் ஏற்கெனவே பரவலாக அறியப்படும் தனிப்பெயர் வடிவம் பயன்படுத்தப்பட்டது; ‘யாவே’ என்பது சாத்தியமான மாற்று ஒலிபெயர்ப்பு.
- issue: எபிரெய நிறைவுவினைகளின் காலநுட்பம்
  choice: நம்பியிருக்கிறேன் / கூறியிருக்கிறேன்
  alternative: நம்புகிறேன் / கூறுகிறேன்; நம்பினேன் / கூறினேன்
  rationale: בָטַחְתִּי, אָמַרְתִּי ஆகிய qatal வடிவங்கள் முடிந்த செயலைக் குறிக்கலாம்; இந்த ஜெபச் சூழலில் அவை நிகழ்காலத்திற்குத் தொடரும் நம்பிக்கையையும் அறிக்கையையும் குறிக்கவும் முடியும். நிகழ்கால நிறைவு வடிவம் இரு நுட்பங்களையும் பெருமளவு காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான ஜெபநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘உம்மை/நீர்’ வடிவங்கள் இடப்பட்டுள்ளன. கவிதைச் சுருக்கமும் ‘நானோ’, ‘நீரே’ என்ற எதிர்மறை மற்றும் வலியுறுத்தல் நுட்பங்களும் காக்கப்பட்டுள்ளன.
