- source_word: אָמַרְתִּי
  choice: கூறியிருக்கிறேன்
  rationale: எபிரெய நிறைவுவினை கடந்த செயல் அல்லது நிகழ்காலத்திற்குத் தொடரும் ஒப்புதல் என்ற இரு நுட்பங்களுக்கும் இடமளிக்கிறது. இங்கு ‘கூறியிருக்கிறேன்’ அந்த ஒப்புதலின் தொடர்ச்சியை இயல்பாகக் காட்டுகிறது.
- source_word: אֱלֹהַי אָתָּה
