    text: அல்லது, ‘குள்ளநரிகள்.’ எபிரெயச் சொல் நரிகளைக் குறிக்கலாம்; போர்க்களம் அல்லது பாழிடச் சூழலில் சிலர் இதை குள்ளநரிகள் எனப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘அவனை வாளின் வல்லமையால் ஊற்றிவிடுவார்கள்; அவர்கள் நரிகளின் பங்காவார்கள்.’ முதல் கூறில் ‘அவனை’ என்ற ஒருமையும், இரண்டாம் கூறில் ‘அவர்கள்’ என்ற பன்மையும் வருகின்றன.'
    reason: source_ambiguity
lexical_decisions:
- source_word: יַגִּירֻהוּ
  choice: அவர்கள் ஒப்புக்கொடுக்கப்படுவார்கள்
  rationale: இந்த வினைச்சொல் நேரடியாக ‘அவனைப் பாய்ந்தோடச் செய்வார்கள்/ஊற்றிவிடுவார்கள்’ என்ற வன்முறை உருவகத்தைக் கொண்டுள்ளது. ஆனால் அடுத்த கூறிலுள்ள பன்மையோடும் முந்தைய வசனத்தின் எதிரிகளோடும் தொடர்பைத் தெளிவாக வைத்திருக்க, தமிழில் இயல்பான செயப்பாட்டு வடிவம் பயன்படுத்தப்பட்டது; எபிரெய உரையின் ஒருமை–பன்மை இடர்ப்பாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: עַל יְדֵי חָרֶב
  choice: வாளின் வல்லமைக்கு
  rationale: சொல்லுக்குச் சொல் ‘வாளின் கைகளால்’ என்றிருந்தாலும், இத்தொடர் வாள் செலுத்தும் கொல்லும் ஆற்றல் அல்லது அதன் வசப்படுத்தலைக் குறிக்கும் மரபுத்தொடர். ‘வாளின் வல்லமைக்கு’ என்பது கவித்துவத்தையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: מְנָת
  choice: இரை
  rationale: மூலச்சொல்லின் அடிப்படைப் பொருள் ‘பங்கு/ஒதுக்கப்பட்ட பகுதி.’ இறந்த உடல்கள் காட்டு விலங்குகளுக்குரிய பங்காகும் சூழலில், ‘இரை’ அந்த விளைவை இயல்பாக வெளிப்படுத்துகிறது; நேரடி ‘பங்கு’ என்பதைக் காட்டிலும் தமிழில் தெளிவானது.
- source_word: שֻׁעָלִים
  choice: நரிகள்
  rationale: שׁוּעָלִים என்பதற்கான வழக்கமான இணைச்சொல் ‘நரிகள்.’ ஆயினும் பாழிடம் மற்றும் போர்க்களச் சூழலில் இது குள்ளநரிகளையும் குறிக்கலாம் என்பதால் அந்த மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: יִהְיוּ
  choice: ஆவார்கள்
  rationale: היה இங்கு வன்முறை மரணத்திற்குப் பின் ஏற்படும் நிலையைச் சுட்டுவதால், வெறும் ‘இருப்பார்கள்’ என்பதற்குப் பதில் விளைவுநிலையைக் காட்டும் ‘ஆவார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: முதல் கூறின் ஒருமைச் செயப்படுபொருளுக்கும் இரண்டாம் கூறின் பன்மை எழுவாய்க்கும் இடையிலான இலக்கண மாற்றம்
  choice: இரு கூறுகளிலும் எதிரிகளைப் பன்மையாகக் காட்டும் செயப்பாட்டு நடை
  alternative: ‘அவனை வாளின் வல்லமையால் ஊற்றிவிடுவார்கள்; அவர்கள் நரிகளுக்குப் பங்காவார்கள்’
  rationale: மூலத்தில் உள்ள பதற்றத்தை முற்றிலும் மறைக்காமல் அடிக்குறிப்பில் நேரடி அமைப்பு தரப்படுகிறது. முதன்மை உரையில் ‘அவர்கள்’ என்பது கொல்லப்படுகிற எதிரிகளையே குறிக்கிறது என்பதைத் தெளிவாக்குவது தவறான வாசிப்பைத் தவிர்க்கிறது; இது எந்தத் தனிப்பட்ட கோட்பாட்டையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘வாளின் வல்லமை’ சங்கீதக் கவித்துவத்தைத் தக்கவைக்கிறது; ‘இரையாவார்கள்’ சாதாரண வாசகருக்கு மரணத்திற்குப் பிந்தைய விளைவைத் தெளிவாகக் கூறுகிறது. அடிக்குறிப்பு குறிகள் அவை சார்ந்த சொற்றொடர்களுக்குப் பின் இடம்பெற்றுள்ளன.
