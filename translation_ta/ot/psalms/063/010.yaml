  text: They will be given over to the power of the sword[b][a]; they will become a portion for foxes.
translation:
  language: ta
  text: அவர்கள் வாளின் வல்லமையால் சிந்தப்படுவார்கள்[b]; நரிகளின் பங்காவார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
