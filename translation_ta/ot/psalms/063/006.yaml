lexical_decisions:
- source_word: אִם זְכַרְתִּיךָ
  choice: உம்மை நினைக்கும்போது
  rationale: இங்கு אִם என்பது நிபந்தனையைவிட காலப்பொருளில், மீண்டும் நிகழும் சூழலைக் குறிக்கிறது; ஆகவே இயல்பான தமிழில் ‘நினைக்கும்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עַל יְצוּעָי
  choice: என் படுக்கையில்
  rationale: יְצוּעַ என்பது படுக்கும் இடம் அல்லது படுக்கையைக் குறிக்கிறது; சூழலுக்கு ஏற்ற நேரடியான தமிழ் வடிவம்.
- source_word: בְּאַשְׁמֻרוֹת
  choice: இரவுக் காவல் வேளைகளில்
  rationale: ‘காவல் நேரங்கள்’ என்பது இரவைப் பிரித்த காவல் வேளைகளைக் குறிக்கிறது; வாசகருக்குத் தெளிவாக ‘இரவுக்’ சேர்க்கப்பட்டது.
- source_word: אֶהְגֶּה בָּךְ
  choice: உம்மைத் தியானிக்கிறேன்
  rationale: הגה என்பது மனத்தில் ஆழ்ந்து சிந்தித்தல் அல்லது தியானித்தலைக் குறிக்கிறது; தொடர்ச்சியான தனிப்பட்ட சிந்தனையை இயல்பாக வெளிப்படுத்துகிறது.
