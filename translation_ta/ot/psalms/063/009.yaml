  rationale: எபிரெயச் சொற்றொடர் இடம்சார் கீழ்ப்பகுதிகளையும் இறந்தோரின் நிலையையும் நினைவூட்டலாம்; வசனம் தெளிவுபடுத்தாத மறுமைக் கோட்பாட்டை மொழிபெயர்ப்பு திணிக்காமல் அதன் பொருள் நெகிழ்வைத் தக்கவைக்கிறது.
