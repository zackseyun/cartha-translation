source:
  edition: WLC
  text: כְּמ֤וֹ חֵ֣לֶב וָ֭/דֶשֶׁן תִּשְׂבַּ֣ע נַפְשִׁ֑/י וְ/שִׂפְתֵ֥י רְ֝נָנ֗וֹת יְהַלֶּל פִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/005.yaml
  text: My soul is satisfied as with fat and richness[b][a], and my mouth praises you with lips of joyful songs.
translation:
  language: ta
  text: கொழுப்பும் செழுமையும் நிறைந்த உணவைப் போல என் உள்ளம் நிறைவடைகிறது[a]; மகிழ்ச்சியின் ஆரவாரமுள்ள உதடுகளால் என் வாய் உம்மைப் புகழ்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொழுப்பும் செழுமையும் நிறைந்த உணவைப் போல என் உள்ளம் நிறைவடையும்.” எபிரெய வினைவடிவு நிகழ்காலமாகவும் எதிர்காலமாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: aspectual_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “களிப்பாரவாரங்களின் உதடுகளால்.” இதை “மகிழ்ச்சியின் முழக்கங்கள் ஒலிக்கும் உதடுகளால்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ חֵלֶב וָדֶשֶׁן
  choice: கொழுப்பும் செழுமையும் நிறைந்த உணவை உண்டதுபோல்
  rationale: כְּמוֹ ஒப்புமையை அறிமுகப்படுத்துகிறது. חֵלֶב என்பது கொழுப்பையும், דֶּשֶׁן என்பது செழுமை அல்லது வளமையையும் குறிக்கிறது; சங்கீதத்தின் உணவுப் படிமத்தை இயல்பான நவீன தமிழில் எடுத்துரைக்க ‘நிறைந்த உணவு’ எனச் சூழலுக்கேற்ற வகையில் வெளிப்படுத்தப்பட்டது.
- source_word: תִּשְׂבַּע
  choice: நிறைவடைகிறது
  rationale: இந்த எபிரெய நிறைவுறா வினைவடிவு கவிதையில் நிகழ்கால, வழக்கமான, அல்லது எதிர்கால நுணுக்கத்தைக் கொள்ளலாம். இங்கு அனுபவிக்கப்படும் மனநிறைவை இயல்பாகச் சொல்ல நிகழ்காலம் பயன்படுத்தப்பட்டது.
- source_word: נַפְשִׁי
  choice: என் உள்ளம்
  rationale: נֶפֶשׁ என்பது உயிர், தன்முழுமை, அல்லது உள்ளார்ந்த ஆளுமையைக் குறிக்கலாம். தேவனால் பெறும் ஆழ்ந்த நிறைவை நவீன தமிழில் இயல்பாகத் தெரிவிக்க ‘என் உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שִׂפְתֵי רְנָנוֹת
  choice: களிப்பொலி எழுப்பும் உதடுகளால்
  rationale: சொற்றொடர் நேரடியாக ‘களிப்பொலிகளின் உதடுகள்’ என்று அமைகிறது. மகிழ்ச்சியான குரலெழுப்புதலையும் ‘உதடுகள்’ என்ற உடல் உறுப்புப் படிமத்தையும் இத்தேர்வு காக்கிறது.
- source_word: יְהַלֶּל פִּי
  choice: என் வாய் உம்மைப் புகழ்கிறது
  rationale: פִּי என்பதன் நேரடிப் பொருளான ‘என் வாய்’ காக்கப்பட்டது. புகழ்ச்சியின் செயப்படுபொருள் எபிரெயத்தில் வெளிப்படையாக இல்லாவிட்டாலும், சங்கீதம் கடவுளை நேரடியாக நோக்கிப் பேசுவதால் தமிழில் இயல்புக்காக ‘உம்மை’ சேர்க்கப்பட்டது.
theological_decisions:
- issue: புகழ்ச்சியின் மறைமுகச் செயப்படுபொருள்
  choice: ‘என் வாய் உம்மைப் புகழ்கிறது’ என்று ‘உம்மை’ சேர்த்தல்
  alternative: ‘என் வாய் புகழ்கிறது’
  rationale: மூல எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை. ஆனால் சங்கீதத்தின் நேரடி இறைமுக உரையாடல் அதைத் தெளிவாக்குகிறது; ‘உம்மை’ என்பது புதிய இறையியல் கருத்தைச் சேர்க்காமல் தமிழை முழுமையாக்குகிறது.
- issue: கவிதை நிறைவுறா வினைவடிவுகளின் காலம்
  choice: 'நிகழ்காலம்: ‘நிறைவடைகிறது’, ‘புகழ்கிறது’'
  alternative: 'எதிர்காலம்: ‘நிறைவடையும்’, ‘புகழும்’'
  rationale: எபிரெய நிறைவுறா வினைவடிவுகள் கவிதையில் தொடர்ச்சி, வழக்கமான செயல், நிகழ்காலம், அல்லது எதிர்காலத்தைக் குறிக்கக்கூடும். சூழலில் சங்கீதக்காரரின் உயிரோட்டமான தற்போதைய அனுபவத்தை நிகழ்காலம் இயல்பாக வெளிப்படுத்துகிறது; மாற்று சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடையிலும் வடிவமைக்கப்பட்டது. ‘உம்மை’ மரியாதையான நேரடி இறைமுக அழைப்பைத் தக்கவைக்கிறது; மரபுசார் ‘ஆத்துமா’ என்பதற்குப் பதிலாக பொதுவாகப் புரியும் ‘உள்ளம்’ பயன்படுத்தப்பட்டது.
