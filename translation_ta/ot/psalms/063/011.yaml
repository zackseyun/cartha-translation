source:
  edition: WLC
  text: וְ/הַ/מֶּלֶךְ֮ יִשְׂמַ֪ח בֵּ/אלֹ֫הִ֥ים יִ֭תְהַלֵּל כָּל הַ/נִּשְׁבָּ֣ע בּ֑/וֹ כִּ֥י יִ֝סָּכֵ֗ר פִּ֣י דֽוֹבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/011.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak lies will be shut.
translation:
  language: ta
  text: ஆனால் அரசர் கடவுளில் மகிழ்வார்; அவர் பெயரில் சத்தியம் செய்கிற ஒவ்வொருவரும் பெருமை கொள்வார்கள்[a]; ஏனெனில் பொய் பேசுகிறவர்களின் வாய் அடைக்கப்படும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மேன்மை பாராட்டுவார்கள்’ அல்லது ‘மகிமைப்படுவார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை பெருமை கொள்வதையும் மரியாதையோடு களிகூருவதையும் குறிக்கலாம். ‘அவர் பெயரில் சத்தியம் செய்கிற’ என்பதிலுள்ள ‘அவர்’ கடவுளைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: ஆனால் அரசர்
  rationale: וְ என்பது அடிப்படையில் ‘மற்றும்’; முந்தைய வசனத்தில் கூறப்பட்ட தீயோரின் முடிவுக்கு மாறாக அரசரின் நிலையை எடுத்துரைப்பதால், நவீன தமிழில் ‘ஆனால்’ என்பது உரையோட்டத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִשְׂמַח בֵּאלֹהִים
  choice: கடவுளில் மகிழ்வார்
  rationale: שׂמח வினை மகிழ்ச்சியைக் குறிக்கிறது; בְּ இங்கு மகிழ்ச்சியின் பொருளையும் ஆதாரத்தையும் சுட்டுகிறது. ‘கடவுளில் மகிழ்வார்’ என்பது மூல உருவகத்தையும் இறையியல் உறவையும் காக்கிறது.
- source_word: כָּל הַנִּשְׁבָּע בּוֹ
  choice: அவர்மீது ஆணையிடுகிற ஒவ்வொருவரும்
  rationale: שׁבע என்பது ஒருவரைச் சாட்சியாகக் கொண்டு ஆணையிடுதலைக் குறிக்கிறது. בּוֹ என்பதிலுள்ள சுட்டுப்பெயர் சூழலில் மிக இயல்பாகக் கடவுளைக் குறிக்கிறது; ‘அவர்மீது ஆணையிடுதல்’ என்பது தமிழில் புரியக்கூடிய வழக்கு.
- source_word: יִתְהַלֵּל
  choice: பெருமிதம் கொள்வார்கள்
  rationale: הלל என்பதன் Hitpael வடிவம் இங்கு பெருமைபாராட்டுதல் அல்லது மேன்மையுடன் களிகூருதல் என்ற பொருளைக் கொண்டது. ‘பெருமிதம் கொள்வார்கள்’ என்பது எதிர்மறையான தற்பெருமையை மட்டும் உணர்த்தாமல், அங்கீகாரத்துடன் களிகூரும் நுண்ணுணர்வையும் தக்கவைக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முன் கூறப்பட்ட மகிழ்ச்சி மற்றும் பெருமிதத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது.
- source_word: יִסָּכֵר פִּי דֹבְרֵי שָׁקֶר
  choice: பொய் பேசுகிறவர்களின் வாய் அடைக்கப்படும்
  rationale: எபிரெயில் ‘வாய்’ ஒருமையில் இருந்தாலும், ‘பொய் பேசுகிறவர்கள்’ என்பது பன்மை. அந்தக் கூட்டு உருவகத்தை மாற்றாமல் தமிழிலும் ‘வாய் அடைக்கப்படும்’ என்று இயல்பாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அரசர்’ யாரைக் குறிக்கிறார்?
  choice: விளக்க விரிவாக்கமின்றி ‘அரசர்’ என்று தக்கவைத்தல்
  alternative: குறிப்பாகத் தாவீது அல்லது முன்னடையாள ரீதியில் மேசியா என்று அடையாளப்படுத்துதல்
  rationale: வசனம் அரசரை மேலும் வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே உரையில் இல்லாத தனிப்பட்ட அல்லது மேசிய விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் அதன் திறந்த தன்மை பாதுகாக்கப்படுகிறது.
- issue: בּוֹ (‘அவர்’) என்பதன் குறிப்பு
  choice: கடவுளைக் குறிப்பதாக மொழிபெயர்த்தல்
  alternative: அரசரைக் குறிப்பதாகப் புரிந்துகொள்ளுதல்
  rationale: அருகிலுள்ள தெளிவான முன்னிலைப் பெயர் ‘கடவுள்’; மேலும் கடவுள்மீது ஆணையிடுதல் வேதாகமத்தில் நிலையான கருத்து. இருப்பினும் சுட்டுப்பெயரின் இலக்கண வடிவம் தனியே பெயரை மீண்டும் கூறாததால், உரையின் வடிவம் மொழிபெயர்ப்பில் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified நடையில் அமைக்கப்பட்டது. ‘அரசர்’, ‘ஆணையிடுதல்’, ‘பெருமிதம் கொள்வது’ ஆகிய சொற்கள் கவிதைநயத்தையும் மூலத்தின் கருத்து நெருக்கத்தையும் சமநிலைப்படுத்துகின்றன. பிரதான உரையிலுள்ள [a], [b] குறிப்புக்குறிகள் அனைத்தும் தொடர்புடைய அடிக்குறிப்புகளுடன் பொருந்துகின்றன.
