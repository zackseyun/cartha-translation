base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/001.yaml
  text: God[a], you are my God; I seek you at dawn. My soul thirsts for you, my flesh longs for you[b], in a dry and weary land without water.
translation:
  language: ta
  text: 'தேவனே, நீரே என் தேவன்;

    விடியற்காலையில் உம்மைத் தேடுகிறேன்.[a]


    என் உயிர் உமக்காகத் தாகம் கொள்கிறது,

    என் உடல் உமக்காக ஏங்குகிறது[b]—

    தண்ணீரில்லாத வறண்ட, களைத்துப்போன நிலத்தில்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதிகாலையிலேயே உம்மைத் தேடுகிறேன்,” “மும்முரமாக உம்மைத் தேடுகிறேன்,” அல்லது விளக்கமாக, “ஆர்வத்துடன் உம்மைத் தேடுகிறேன்.” எபிரெய வினை விடியற்காலையில் தேடுவதை நேரடியாக நினைவூட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இறுதியிலுள்ள “தண்ணீரில்லாத வறண்ட, களைத்துப்போன நிலத்தில்” என்ற சொற்றொடரை, “என் உடல் உமக்காக ஏங்குகிறது” என்பதுடன் மட்டும் இணைத்தும் வாசிக்கலாம்.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: இங்கு பன்மை வடிவிலுள்ள பெயர்ச்சொல் ஒரே தேவனைக் குறிக்கிறது. தமிழில் நேரடி அழைப்பைக் காட்ட இயல்பான விளிவேற்றுமை வடிவம் பயன்படுத்தப்பட்டது; தனியான ‘ஓ’ போன்ற இடைச்சொல் சேர்க்கப்படவில்லை.
- source_word: אֵלִי אַתָּה
  choice: நீரே என் தேவன்
  rationale: ‘என் தேவன்’ என்ற தெய்வப் பட்டத்தையும், தனிப்பெயர்ச்சொல் தரும் வலியுறுத்தலையும் ‘நீரே’ என்பதன் மூலம் காக்கிறது.
- source_word: אֲשַׁחֲרֶךָּ
  choice: விடியற்காலையில் உம்மைத் தேடுகிறேன்
  rationale: שׁחר என்ற வினையின் விடியலில் தேடும் அடிப்படைப் படிமத்தைத் தெளிவாகப் பாதுகாக்கிறது; ‘ஆர்வமாக’ அல்லது ‘மும்முரமாக’ என்று மட்டும் பொருளாக்கவில்லை.
- source_word: צָמְאָה לְךָ נַפְשִׁי
  choice: என் உயிர் உமக்காகத் தாகம் கொள்கிறது
  rationale: נפשׁ இங்கு மனிதரின் உயிர்/உள்ளார்ந்த தன்மையைக் குறிக்கிறது. ‘உயிர்’ என்பது நவீன தமிழில் இயல்பாக இருந்து, ‘உடல்’ என்பதுடனான கவிதை இணைப்பையும் காக்கிறது; கடுமையான ஆன்மா–உடல் இருமையைத் திணிப்பதில்லை.
- source_word: כָּמַהּ לְךָ בְשָׂרִי
  choice: என் உடல் உமக்காக ஏங்குகிறது
  rationale: כָּמַהּ வெளிப்படுத்தும் தீவிர ஏக்கத்தை ‘ஏங்குகிறது’ தருகிறது. בשר இங்கு உடல்சார்ந்த மனித இருப்பைக் குறிப்பதால், இன்றைய தமிழில் இறைச்சி என்ற தவறான உணர்வைத் தரக்கூடிய ‘மாம்சம்’ என்பதற்குப் பதிலாக ‘உடல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף בְּלִי מָיִם
  choice: தண்ணீரில்லாமல் வறண்டு களைத்துப்போன நிலத்தில்
  rationale: நிலத்தின் வறட்சியையும் அதற்கு வழங்கப்பட்டுள்ள ‘களைத்துப்போன’ என்ற கவிதை மனிதப்படுத்தலையும் பாதுகாக்கிறது. இறுதி இடத்தொடர் முன்னுள்ள தாகம் மற்றும் ஏக்கம் ஆகிய இரண்டின் சூழலாகப் படிக்கும்படி தனி வரியிலும் கோட்டுக்குப் பின்னும் அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: נפשׁ / בשר இணைப்பிலுள்ள மனித இயல்பு மொழி
  choice: ‘என் உயிர்’ மற்றும் ‘என் உடல்’ என்று இரு கவிதைப் படிமங்களையும் தனித்தனியாகக் காத்தல்
  alternative: ‘என் முழு உள்ளமும்’ என்று ஒன்றிணைத்தல், அல்லது ‘என் ஆன்மா / என் மாம்சம்’ என்று மரபுசார் சொற்களைப் பயன்படுத்தல்
  rationale: எபிரெயக் கவிதை மனிதரின் உள்ளார்ந்த உயிரையும் உடல்சார்ந்த இருப்பையும் இணைத்துக் காட்டுகிறது. தேர்ந்தெடுக்கப்பட்ட சொற்கள் அந்த இலக்கிய அமைப்பைக் காக்கின்றன; அதே நேரத்தில் ஒரு குறிப்பிட்ட உடல்–ஆன்மா கோட்பாட்டை வசனத்தில் திணிப்பதில்லை.
- issue: இடத்தொடரின் தொடர்பு
  choice: ‘தண்ணீரில்லாமல்… நிலத்தில்’ என்பதை உயிரின் தாகமும் உடலின் ஏக்கமும் ஆகிய முழுக் கூற்றிற்கான சூழலாக அமைத்தல்
  alternative: அதை ‘என் உடல் உமக்காக ஏங்குகிறது’ என்ற இரண்டாவது கூற்றுடன் மட்டும் இணைத்துப் படித்தல்
  rationale: எபிரெயச் சொல் வரிசை இரண்டாவது கூற்றுடன் நெருக்கமாக இருந்தாலும், கவிதையின் மொத்த ஏக்கத்திற்கும் அந்த வறண்ட நிலம் சூழலாக இருக்கலாம். முதன்மை உரை பரந்த தொடர்பை வெளிப்படுத்துகிறது; குறுகிய தொடர்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கவிதை நயமும் மாண்பும் கொண்டதாயும் வடிவமைக்கப்பட்டது. தேவனை நோக்கிய மரியாதையான ஒருமை வடிவங்களான ‘நீர்/உம்மை/உமக்காக’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் வரி இணைவு மற்றும் வறண்ட நிலப் படிமம் பாதுகாக்கப்பட்டுள்ளன.
