  text: כִּי ט֣וֹב חַ֭סְדְּ/ךָ מֵֽ/חַיִּ֗ים שְׂפָתַ֥/י יְשַׁבְּחֽוּ/נְךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/003.yaml
  text: For your steadfast love is better than life[a]; my lips will praise you.
translation:
  language: ta
  text: ஏனெனில், உமது மாறாத அன்பு உயிரைவிட மேலானது[a]; என் உதடுகள் உம்மைப் புகழும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பற்றுறுதியான அன்பு’ அல்லது ‘உடன்படிக்கை அன்பு’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் חֶסֶד, பெரும்பாலும் உடன்படிக்கை உறவின் சூழலில் வெளிப்படும் மாறாத, நம்பிக்கைக்குரிய அன்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: தொடர்ந்து வரும் புகழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரேய இணைப்பை இயல்பான தமிழில் காரணத் தொடர்புடன் தருகிறது.
- source_word: טוֹב ... מֵחַיִּים
  choice: உயிரைவிட மேலானது
  rationale: מִן உடன் வரும் טוֹב ஒப்பீட்டுப் பொருள் தருவதால், வெறுமனே ‘நல்லது’ என்று அல்லாமல் ‘மேலானது’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: חַסְדְּךָ
  choice: உமது மாறாத அன்பு
  rationale: חֶסֶד என்பதில் அன்பு, பற்றுறுதி, நிலைத்த நம்பகத்தன்மை ஆகிய பொருள்நிழல்கள் உள்ளன; ‘மாறாத அன்பு’ அவற்றைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: מֵחַיִּים
  choice: உயிரைவிட
  rationale: חַיִּים வடிவத்தில் பன்மையாக இருந்தாலும் இங்கு வாழ்வு அல்லது உயிர் என்ற ஒருமையான கருத்தைக் குறிக்கிறது; கவிதையின் தனிப்பட்ட தீவிரத்தை ‘உயிர்’ காக்கிறது.
- source_word: שְׂפָתַי
  choice: என் உதடுகள்
  rationale: மூலத்தின் தெளிவான உடல்-உறுப்பு உருவகத்தை அருவமாக்காமல் அப்படியே காக்கிறது.
- source_word: יְשַׁבְּחוּנְךָ
  choice: உம்மைப் புகழும்
  rationale: פיעל வினையின் ‘புகழ்தல்’ என்ற பொருளையும், எபிரேய வினையின் நிறைவுறாத கால/உறுதிப்பாட்டு நுணுக்கத்தையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: வழிபாட்டுச் சூழலில் חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: மாறாத அன்பு
  alternative: பேரன்பு; உடன்படிக்கை அன்பு; இரக்கம்
  rationale: இச்சொல் அன்போடு நிலைத்த பற்றுறுதியையும் நம்பகத்தன்மையையும் சுமக்கிறது. ‘மாறாத அன்பு’ அந்த அகலத்தைக் காக்கிறது; ‘உடன்படிக்கை அன்பு’ என்று மட்டும் கூறி பொருளை ஒரு கோட்பாட்டுச் சொல்லுக்குள் குறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்தின் கவித்துவத் தன்மைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது/உம்மை’ காக்கப்பட்டுள்ளன; ‘என் உதடுகள்’ என்ற மூல உருவகமும் தக்கவைக்கப்பட்டுள்ளது.
