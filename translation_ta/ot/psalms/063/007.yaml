  yaml_path: translation/ot/psalms/063/007.yaml
  text: For you have been my help[a], and in the shadow of your wings I sing for joy.
translation:
  language: ta
  text: ஏனெனில், நீர் எனக்குத் துணையாக இருந்தீர்; உமது சிறகுகளின் நிழலில் நான் மகிழ்ந்து பாடுவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் மகிழ்ச்சியுடன் முழங்குவேன்.” எபிரெய வினைச்சொல் மகிழ்ச்சியுடன் பாடுவதையும் உரத்த மகிழ்ச்சி முழக்கத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள கருத்துடன் காரணத் தொடர்பை வெளிப்படுத்துகிறது; தமிழில் இயல்பாகவும் தெளிவாகவும் அந்தத் தொடர்பைக் காட்டுகிறது.
- source_word: הָיִיתָ
  choice: இருந்தீர்
  rationale: முன்னர் அனுபவித்து அறிந்த கடவுளின் உதவியை qatal வடிவம் சுட்டுகிறது. தமிழில் இறந்தகால வடிவமே இதை இயல்பாகத் தெரிவிக்கிறது; அதன் தற்போதைய பொருத்தம் சூழலால் விளங்குகிறது.
- source_word: עֶזְרָתָה לִּי
  choice: எனக்குத் துணையாக
  rationale: עֵזֶר என்ற உதவி/துணை என்னும் பொருளையும் לִי குறிக்கும் தனிப்பட்ட பயனையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: וּבְצֵל
  choice: நிழலில்
  rationale: בְּ என்னும் இடப்பொருளையும் צֵל என்னும் கவிதைமிகு பாதுகாப்புப் படிமத்தையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: כְּנָפֶיךָ
  choice: உமது சிறகுகளின்
  rationale: தெய்வீகப் பாதுகாப்பைச் சித்தரிக்கும் சிறகுகளின் உருவகத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: אֲרַנֵּן
  choice: நான் மகிழ்ந்து பாடுவேன்
  rationale: רנן என்பதன் Piel வடிவம் மகிழ்ச்சியை உரத்த குரலில் பாடுதல் அல்லது ஆரவாரித்தல் ஆகியவற்றைக் குறிக்கலாம். முதன்மை உரை அதன் இசைமிகு பொருளை இயல்பான தமிழில் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
theological_decisions:
- issue: கடவுளின் பாதுகாப்பைக் குறிக்கும் சிறகுகளின் நிழல் என்ற உருவகம்
  choice: “உமது சிறகுகளின் நிழலில்” என்று உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: “உமது பாதுகாப்பில்” என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: எபிரெயக் கவிதையின் தெளிவான உடல் சார்ந்த படிமம் கடவுளின் அடைக்கலத்தைச் சித்தரிக்கிறது. அதை அப்படியே வைத்திருப்பது அதன் இலக்கிய மற்றும் இறையியல் செறிவைச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய இரண்டாம் நபர் வடிவங்களில் மரியாதைப் பன்மை (“நீர்,” “உமது,” “இருந்தீர்”) பின்பற்றப்பட்டுள்ளது; மூலத்தின் சிறகுகள்–நிழல் உருவகம் மாற்றமின்றித் தக்கவைக்கப்பட்டுள்ளது.
