  text: தாவீதின் சங்கீதம்[a]; அவர் யூதாவின் வனாந்தரத்தில்[b] இருந்தபோது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீதால் இயற்றப்பட்ட சங்கீதம்’ அல்லது ‘தாவீதுக்கான சங்கீதம்’ என்றும் பொருள் கொள்ளலாம். எபிரெயத் தலைப்பு ஆசிரியத்துவம், அர்ப்பணம், உரிமை அல்லது தொடர்பைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: ‘பாலைநிலத்தில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வனாந்தரம், வறண்ட வெளி அல்லது பாலைநிலப் பகுதியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: சங்கீதத் தலைப்பில் வரும் இச்சொல் இசையுடன் தொடர்புடைய வழிபாட்டுப் பாடல் வகையைக் குறிக்கிறது; தமிழில் வழக்கமாகவும் துல்லியமாகவும் உள்ள தொழில்நுட்பச் சொல் ‘சங்கீதம்’.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், உரிமை, அர்ப்பணம் அல்லது தொடர்பைக் குறிக்கக்கூடும். ‘தாவீதின்’ என்பது ஆசிரியத்துவத்தை மட்டும் உறுதிப்படுத்தாமல் மூலத்தின் சுருக்கமான தெளிவின்மையை ஓரளவு காக்கிறது.
- source_word: בִּהְיוֹתוֹ
  choice: அவர் ... இருந்தபோது
  rationale: בְּ + היה என்பதன் infinitive construct மற்றும் மூன்றாம் நபர் ஒருமை பின்னொட்டு சேர்ந்து காலத்தைக் குறிக்கும் துணைவாக்கியத்தை உருவாக்குகின்றன; இத்தமிழாக்கம் இயல்பான காலத் தொடர்பைத் தருகிறது.
- source_word: בְּמִדְבַּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்பில்லாத வறண்ட வெளி, பாலைநிலம் அல்லது வனாந்தரப் பகுதியைக் குறிக்கலாம். ‘வனாந்தரம்’ அதன் பரந்த நிலவியல் பொருளைக் காக்கிறது.
- source_word: יְהוּדָה
  choice: யூதா
  rationale: பிரதேசம் அல்லது கோத்திரப் பகுதியின் பெயர் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: தாவீதுடன் தொடர்புடைய தலைப்பின் பொருள்
  choice: ‘தாவீதின்’ என்று மொழிபெயர்த்து தொடர்பின் வகையைத் திறந்தே வைத்தல்
  alternative: ‘தாவீதால் இயற்றப்பட்டது’ அல்லது ‘தாவீதுக்காக’
  rationale: சங்கீதத் தலைப்புகளில் לְ ஆசிரியத்துவம், அர்ப்பணம், தொகுப்புச் சார்பு அல்லது பொதுவான தொடர்பைக் குறிக்கலாம். எபிரெயச் சொற்றொடர் இவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாததால், மொழிபெயர்ப்பு வலுவான தனிப்பட்ட முடிவைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத் தலைப்புக்குரிய சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘சங்கீதம்’, ‘வனாந்தரம்’ ஆகியவை தமிழ் வேதாகமப் பயன்பாட்டில் அறிமுகமான சொற்களாக இருந்தாலும் இன்றைய வாசகருக்கும் புரியக்கூடியவை.
