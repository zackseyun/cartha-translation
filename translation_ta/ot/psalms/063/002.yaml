  text: So I have looked upon you in the sanctuary[a], to see your power and your glory.
translation:
  language: ta
  text: அவ்வாறே, உமது வல்லமையையும் உமது மகிமையையும் காண்பதற்காக, பரிசுத்த இடத்தில் உம்மை நோக்கிப் பார்த்தேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இவ்வாறு பரிசுத்த இடத்தில் உம்மைக் கண்டேன்.”
    reason: כֵּן என்பதற்கு ‘இவ்வாறு’ என்றும் חֲזִיתִיךָ என்பதற்கு ‘கண்டேன்’ என்றும் தரக்கூடிய சொற்பொருள் மாற்றைக் குறிக்கிறது.
lexical_decisions:
- source_word: כֵּן
  choice: அப்படியே
  rationale: முன்னுள்ள ஏக்கத்துடன் இவ்வசனத்தை இணைக்கும் ‘அவ்வாறு/அப்படியே’ என்ற வினையடைப் பொருளை இயல்பாகத் தருகிறது; தர்க்க உறவை அளவுக்கு மீறி விளக்கவில்லை.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: வழிபாட்டுச் சூழலில் קֹדֶשׁ என்பது அருவமான ‘பரிசுத்தம்’ என்பதைக் காட்டிலும் பரிசுத்த இடத்தைக் குறிப்பது இயல்பானது. ‘பரிசுத்த இடம்’ என்பது ‘பரிசுத்த ஸ்தலம்/ஆலயம்’ என மிகக் குறிப்பாக்காமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
- source_word: חֲזִיתִיךָ
  choice: உம்மை நோக்கிப் பார்த்தேன்
  rationale: חזה வெறும் கணநேரப் பார்வையைவிட கவனித்துப் பார்த்தல் அல்லது உணர்ந்து காணுதல் என்ற நுட்பத்தைக் கொண்டிருக்கலாம். தமிழில் ‘நோக்கிப் பார்த்தேன்’ அந்த தியானமிக்க பார்வையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לִרְאוֹת
  choice: காணும்படி
  rationale: இந்த வினையெச்சம் நோக்கத்தை வெளிப்படுத்துகிறது. ‘காணும்படி’ என்பது அந்த நோக்க உறவைத் தெளிவாகவும் கவிதைநடைக்கு ஏற்றவாறும் தருகிறது.
- source_word: עֻזְּךָ
  choice: உமது வல்லமை
  rationale: עֹז என்பதன் பலம், ஆற்றல், வல்லமை ஆகிய பொருள்களில், தேவனுடைய வெளிப்படும் ஆற்றலை ‘மகிமை’ என்பதுடன் இயல்பாக இணைக்கும் சொல்லாக ‘வல்லமை’ அமைகிறது.
- source_word: וּכְבוֹדֶךָ
  choice: உமது மகிமை
  rationale: தேவனைப் பற்றிய כָּבוֹד என்பதன் கனமும் வெளிப்படும் மாட்சியும் ‘மகிமை’ என்பதால் நிலையான, புரிந்துகொள்ளக்கூடிய தமிழில் வெளிப்படுகின்றன.
theological_decisions:
- issue: பரிசுத்த இடத்தில் தேவனைப் பார்த்ததன் தன்மை
  choice: ‘உம்மை நோக்கிப் பார்த்தேன்’ என்று மூலத்தின் நேரடிப் பொருளைப் பாதுகாத்து, அது தேவனுடைய சாரத்தை நேரடியாகக் கண்டதாக விளக்காமல் விடப்பட்டுள்ளது.
  alternative: தேவனை மறைஞான அல்லது தரிசன அனுபவத்தில் கண்டதாகத் தெளிவுபடுத்துதல்.
  rationale: எபிரெய உரை வழிபாட்டுச் சூழலில் காணுதலைக் குறிக்கும் சாதாரண வினைகளைப் பயன்படுத்துகிறது. ஆகவே தேவனை நேரடிப் பொருளாக வைத்திருக்கிறோம்; ஆனால் காணுதலின் இயல்பைத் தீர்மானித்து மொழிபெயர்க்காமல் கவிதை மற்றும் இறையியல் நெருக்கடியைப் பாதுகாக்கிறோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனை நோக்கும் இரண்டாம் நபருக்கு மரியாதை வடிவமான ‘உம்மை/உமது’ பயன்படுத்தப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
