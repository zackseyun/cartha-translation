revisions:
- from: ஆகவே, நான் உயிரோடிருக்கும் காலமெல்லாம் உம்மை ஆசீர்வதிப்பேன்[a]; உமது பெயரில் என் கைகளை உயர்த்துவேன்.
  to: ஆகவே, நான் உயிரோடிருக்கும் காலமெல்லாம் உம்மை வாழ்த்துவேன்[a]; உமது பெயரில் என் கைகளை உயர்த்துவேன்.
  rationale: The revision changes only the Tamil rendering of ברך in address to God. ‘வாழ்த்துவேன்’ is a natural, reverent modern Tamil equivalent that retains the source verb’s blessing/extolling sense without suggesting that the speaker grants God a blessing. The footnote transparently records both the praise alternative and the Hebrew verb’s more literal basic sense.
