  text: כֵּ֣ן אֲבָרֶכְ/ךָ֣ בְ/חַיָּ֑/י בְּ֝/שִׁמְ/ךָ אֶשָּׂ֥א כַפָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/004.yaml
  text: So I will bless you as long as I live[a]; in your name I will lift up my hands.
translation:
  language: ta
  text: ஆகவே, நான் உயிரோடிருக்கும் காலமெல்லாம் உம்மை வாழ்த்துவேன்[a]; உமது பெயரில் என் கைகளை உயர்த்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உம்மைத் துதிப்பேன்.’ எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள், ‘உம்மை ஆசீர்வதிப்பேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: ஆகவே
  rationale: முந்தைய வசனத்தின் கருத்திலிருந்து எழும் முடிவையும் உறுதியையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲבָרֶכְךָ
  choice: உம்மை ஆசீர்வதிப்பேன்
  rationale: ברך என்பதன் நேரடியான பொருளான ‘ஆசீர்வதித்தல்’ என்பதைக் காத்து, கடவுளை நோக்கிய வழிபாட்டு மொழியில் உள்ள மூலவாக்கியத்தின் தனித்தன்மையையும் பதற்றத்தையும் மறைக்காமல் வைக்கிறது.
- source_word: בְחַיָּי
  choice: நான் உயிரோடிருக்கும் காலமெல்லாம்
  rationale: சொல்லுக்குச் சொல் ‘என் வாழ்வில்’ என்றாலும், இங்கு சங்கீதக்காரரின் வாழ்நாள் முழுவதையும் குறிக்கும் நீடித்த காலப்பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: בְּשִׁמְךָ
  choice: உமது பெயரில்
  rationale: בְּ என்ற முன்னொட்டு வெளி, அடிப்படை அல்லது பெயரை அழைத்தல் ஆகிய நுண்ணிய பொருட்களைக் கொண்டிருக்கலாம்; ‘உமது பெயரில்’ அவற்றை அளவுக்கு மீறி விளக்காமல் காக்கிறது.
- source_word: אֶשָּׂא
  choice: உயர்த்துவேன்
  rationale: נשא என்பதன் ‘தூக்குதல்/உயர்த்துதல்’ என்ற பொருளையும், ஜெபம் அல்லது துதியின் உடல் சைகையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כַפָּי
  choice: என் கைகளை
  rationale: כף குறிப்பாக உள்ளங்கைகளைக் குறிக்கக்கூடியது; எனினும் இந்த வழிபாட்டுச் சைகையில் இயல்பான தமிழ்த் தொடர் ‘கைகளை உயர்த்துதல்’ என்பதாகும்.
theological_decisions:
- issue: கடவுளை நோக்கிப் பயன்படுத்தப்படும் ברך என்ற வழிபாட்டுச் சொல்
  choice: முதன்மை உரையில் ‘உம்மை ஆசீர்வதிப்பேன்’ என்று வைத்தல்
  alternative: ‘உம்மைத் துதிப்பேன்’
  rationale: எபிரெய வினைச்சொல் நேரடியாக ‘ஆசீர்வதித்தல்’ என்று பொருள்படும். கடவுளை மனிதன் ஆசீர்வதிப்பது தமிழில் வழக்கத்திற்கு மாறாகத் தோன்றினாலும், அதை ‘துதித்தல்’ என்று அமைதியாக விளக்கிவிடாமல் மூலத்தின் வழிபாட்டு நுணுக்கத்தை முதன்மை உரை காக்கிறது; இயல்பான பொருள் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. கடவுளை நோக்கி மரியாதைப் பன்மையான ‘உம்மை/உமது’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் இணைவரி அமைப்பும் எதிர்கால உறுதியும் காக்கப்பட்டுள்ளன.
