  text: My soul clings to you[b][a]; your right hand upholds me.
translation:
  language: ta
  text: என் ஆத்துமா உம்மை விடாமல் பின்தொடர்கிறது[a]; உமது வலக்கரம் என்னைத் தாங்குகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஆத்துமா உம்மைப் பற்றிக்கொண்டிருக்கிறது.” எபிரெயத்தில் சொல்லர்த்தமாக “உமக்குப் பின்னால்” அல்லது “உம்மைப் பின்தொடர்ந்து” என்று உள்ளது; இது நெருக்கமாகப் பின்தொடர்வதையோ உறுதியாகப் பற்றிக்கொள்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה
  choice: பற்றிக்கொண்டிருக்கிறது
  rationale: דבק என்பது ஒட்டிக்கொள்வது, உறுதியாகப் பற்றிக்கொள்வது என்ற பொருளுடையது. எபிரெய நிறைவுவினை இங்கு தொடரும் தற்போதைய நிலையை வெளிப்படுத்துவதால், ‘பற்றிக்கொண்டிருக்கிறது’ என்பது நெருக்கமான உறவையும் விடாப்பிடியான பற்றுதலையும் இயல்பாகக் காட்டுகிறது.
- source_word: נַפְשִׁי
  choice: என் ஆத்துமா
  rationale: נפשׁ என்பது ஆத்துமா, உயிர், தன்முழுமை அல்லது நபர் ஆகிய பொருள்களைக் கொள்ளலாம். சங்கீதத்தின் கவிதை மற்றும் பக்தி நடையில் ‘என் ஆத்துமா’ மூலத்தின் தனிப்பட்ட, ஆன்மிக ஒலியைத் தக்கவைக்கிறது; இதனால் ஒரு குறிப்பிட்ட மானிடவியல் கோட்பாடு திணிக்கப்படவில்லை.
- source_word: אַחֲרֶיךָ
  choice: உம்மைப்
  rationale: אחרי என்பதன் அடிப்படைப் பொருள் ‘உமக்குப் பின்னால்/உம்மைத் தொடர்ந்து’ என்பதாகும். ஆனால் דבק உடன் சேர்ந்த இச்சொற்றொடரின் நெருக்கமான பற்றுதலை இயல்பான தமிழில் ‘உம்மைப் பற்றிக்கொண்டிருக்கிறது’ என்று முதன்மை உரையில் கொடுத்து, பின்தொடர்தல் என்ற மூலப்படிமத்தை அடிக்குறிப்பில் பாதுகாக்கிறோம்.
- source_word: בִּי
  choice: என்னை
  rationale: תמך வினையுடன் வரும் בִּי இங்கு தாங்கப்படுகிற நபரைக் குறிக்கிறது. ‘என்னைத் தாங்குகிறது’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: תָּמְכָה
  choice: தாங்குகிறது
  rationale: תמך என்பது ஆதரித்தல், தாங்குதல், நிலைநிறுத்துதல் என்ற பொருளுடையது. ‘தாங்குகிறது’ என்பது கவிதை இணைப்பையும் தொடரும் பாதுகாப்பு நிலையும் தெளிவாகக் காட்டுகிறது.
- source_word: יְמִינֶךָ
  choice: உமது வலக்கரம்
  rationale: மூலத்தில் நேரடியாக ‘உமது வலக்கரம்’ என்று உள்ளது. வல்லமை, பாதுகாப்பு, செயற்படும் உதவி ஆகியவற்றைக் குறிக்கும் வேதாகமப் படிமத்தை விளக்கவுரையாக்காமல் அப்படியே பாதுகாக்கிறது.
theological_decisions:
- issue: נַפְשִׁי என்பதன் மானிடவியல் நுட்பம்
  choice: என் ஆத்துமா
  alternative: நான் / என் உயிர் / என் முழு உள்ளம்
  rationale: கவிதை மற்றும் பக்தி சூழலில் ‘என் ஆத்துமா’ மூலச்சொல்லின் ஆன்மிக, தனிப்பட்ட ஆழத்தைப் பாதுகாக்கிறது. அதேவேளை, ஆத்துமாவின் இயல்பைப் பற்றிய ஒரு குறிப்பிட்ட கோட்பாட்டை வசனத்தில் சேர்ப்பதில்லை.
- issue: தேவனுடைய வலக்கரம் என்ற மனித உருவக மொழி
  choice: உமது வலக்கரம்
  alternative: உமது வல்லமை / உமது பலம்
  rationale: எபிரெயம் concrete ஆன மனித உருவகத்தைப் பயன்படுத்துகிறது. அதை கருத்தாக்கமாக மாற்றாமல் நேரடியாகப் பாதுகாப்பதால் வாசகர் மூல வேதாகமப் படிமத்தை எதிர்கொள்கிறார்.
- issue: דבק + אחרי என்பதில் பற்றுதல் மற்றும் பின்தொடர்தல் இடையிலான பதற்றம்
  choice: முதன்மை உரையில் ‘உம்மைப் பற்றிக்கொண்டிருக்கிறது’; அடிக்குறிப்பில் ‘உமக்குப் பின்னால் நெருக்கமாகப் பற்றித் தொடர்கிறது’
  alternative: உம்மை விடாமல் பின்தொடர்கிறது
  rationale: דבק என்பதன் ‘ஒட்டிக்கொள்/பற்றிக்கொள்’ என்ற மையப் பொருளை முதன்மை உரை காக்கிறது; אחרי தரும் ‘பின்னால்/பின்தொடர்ந்து’ என்ற இயக்கப் படிமத்தை அடிக்குறிப்பு வெளிப்படுத்துகிறது. இவ்வாறு இரு கூறுகளும் மறைக்கப்படாமல், தமிழ் நடை செயற்கையாகாமல் இருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாக வாசிக்கக்கூடிய, அதேவேளை சங்கீதத்திற்குரிய கண்ணியமான கவிதை நடையைப் பயன்படுத்துகிறது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உம்மை’, ‘உமது’ பயன்படுத்தப்பட்டுள்ளன. ‘ஆத்துமா’ மற்றும் ‘வலக்கரம்’ ஆகிய மூலப் படிமங்கள் விளக்கவுரையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
