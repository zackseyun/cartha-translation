  yaml_path: translation/ot/psalms/074/000.yaml
  text: A Maskil of Asaph. Why[a], God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: ta
  text: 'ஆசாபின் மஸ்கீல்.[a]


    கடவுளே, ஏன் எங்களை என்றென்றைக்கும் தள்ளிவிட்டீர்? உமது மேய்ச்சல் நிலத்தின் ஆடுகளுக்கு எதிராக உமது கோபம் ஏன் புகைகிறது?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மஸ்கீல்” என்பது சங்கீதத் தலைப்பில் வரும் ஒரு தொழில்நுட்பச் சொல்; இது தியானத்துக்குரிய அல்லது அறிவுறுத்தும் பாடலைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: சங்கீதத் தலைப்பில் வரும் பொருள் உறுதியாகத் தெரியாத தொழில்நுட்பச் சொல்லை ஒலிபெயர்த்து, சாத்தியமான பொருளை அடிக்குறிப்பில் தருகிறது.
- source_word: לְאָסָף
  choice: ஆசாபின்
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, அல்லது தொகுப்பு சார்பைச் சுட்டக்கூடும்; தமிழில் இயல்பான தலைப்பாக உடைமை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: זָנַחְתָּ
  choice: புறக்கணித்துவிட்டீர்
  rationale: விலக்குதல் அல்லது நிராகரித்தல் என்ற வலுவான கருத்தையும், நிறைவேறிய செயலைக் குறிக்கும் எபிரெய வினை வடிவத்தையும் வெளிப்படுத்துகிறது.
- source_word: לָנֶצַח
  choice: என்றென்றைக்கும்
  rationale: தொடர்ந்து நீடிக்கும் அல்லது முடிவில்லாத காலம் என்ற புலம்பலின் தீவிரத்தைப் பாதுகாக்கிறது.
- source_word: יֶעְשַׁן אַפְּךָ
  choice: உமது கோபம் ... புகைகிறது
  rationale: אַף என்பதன் கோபம் என்ற உருவகப் பொருளையும், עָשַׁן என்பதன் திட்டவட்டமான புகை உருவகத்தையும் மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: צֹאן מַרְעִיתֶךָ
  choice: உமது மேய்ச்சலின் ஆடுகள்
  rationale: இறைவனுக்குச் சொந்தமான, அவரால் மேய்க்கப்படும் மக்களைச் சுட்டும் மேய்ப்பர் உருவகத்தை மூலத்துக்கு நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: சங்கீதக்காரரின் கேள்வியில் உள்ள ‘என்றென்றைக்கும்’
  choice: நிரந்தர நிராகரிப்பை உறுதிப்படுத்தும் கோட்பாட்டுக் கூற்றாக அல்லாமல், புலம்பலின் நேரடியான கேள்வியாக வைத்தல்
  alternative: ‘இவ்வளவு காலமாக’ என்று காலவரம்பை மென்மைப்படுத்துதல்
  rationale: மூலத்தின் לָנֶצַח என்ற தீவிரமான மொழியையும், தெய்வீக நிராகரிப்பைப் பற்றிய தீர்க்கப்படாத பதற்றத்தையும் காக்கிறது.
- issue: தெய்வீகக் கோபத்தின் புகை உருவகம்
  choice: ‘உமது கோபம் ... புகைகிறது’ என்று நேரடியாக வைத்தல்
  alternative: ‘உமது கோபம் கொழுந்துவிட்டு எரிகிறது’ அல்லது ‘சினம் மூண்டுள்ளது’
  rationale: மூல உருவகத்தை வேறு தீ உருவகமாக மாற்றாமல் அதன் அசாதாரண வலிமையைப் பாதுகாக்கிறது.
- issue: ‘ஆசாபின்’ என்பதன் தொடர்பு
  choice: தமிழில் மரபான உடைமைத் தலைப்பைப் பயன்படுத்துதல்
  alternative: ‘ஆசாபுக்குரிய’ அல்லது ‘ஆசாபுக்காக’
  rationale: எபிரெய לְ முன்னொட்டின் துல்லியமான தொடர்பு தெளிவற்றது; ‘ஆசாபின்’ என்பது ஆசிரியத்துவத்தைத் திட்டவட்டமாக விளக்காமல் இயல்பாகத் தொடர்பைக் காட்டுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் dignified இறைவேண்டல் நடையில் அமைக்கப்பட்டது. இறைவனை நோக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. தலைப்பின் தெளிவற்ற தொழில்நுட்பச் சொல் ஒலிபெயர்க்கப்பட்டு விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது; ‘கோபம் புகைகிறது’ என்ற மூல உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
