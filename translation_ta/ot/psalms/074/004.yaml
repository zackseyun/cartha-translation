revisions:
- from: உமக்கு எதிரானவர்கள் உமது குறிக்கப்பட்ட சந்திப்பிடத்தின் நடுவே கர்ஜித்தார்கள்; தங்கள் அடையாளங்களையே அடையாளங்களாக நிறுவினார்கள்.[a][b]
  to: உமது எதிரிகள் உமது கூடுகையிடத்தின் நடுவே கர்ஜித்தனர்; தங்கள் அடையாளங்களை அடையாளங்களாக நிறுவினர்.[a][b]
  rationale: The revision improves modern Tamil idiom while preserving the source’s locative cultic sense, hostile imagery, and repeated ‘signs’ construction. It does not resolve beyond the Hebrew whether the signs were standards, emblems, or other markers; that contextual possibility remains appropriately qualified in the note.
