    text: ‘உமது சந்திப்பிடத்திற்குள்’ என்றும் மொழிபெயர்க்கலாம். מוֹעֵד என்பது நியமிக்கப்பட்ட இடம், கூடுகை, அல்லது நியமிக்கப்பட்ட காலத்தைக் குறிக்கலாம்; இங்கே புனிதக் கூடுகையிடத்தைக் குறிப்பது மிகப் பொருத்தமாகத் தெரிகிறது.
