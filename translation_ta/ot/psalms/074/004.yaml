  text: உமது எதிரிகள் உமது கூடுகையிடத்தின் நடுவே கர்ஜித்தனர்; தங்கள் அடையாளங்களை அடையாளங்களாக நிறுவினர்.[a][b]
  philosophy: optimal-equivalence
