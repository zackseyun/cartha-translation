    text: 'எபிரேயத்தில் ‘அடையாளங்கள்’ என்பது இருமுறை வருகிறது: சொல்லுக்கு நெருக்கமாக, ‘தங்கள் அடையாளங்களை அடையாளங்களாக நிறுவினர்.’ இது தங்கள் சின்னங்கள் அல்லது கொடிகளை உடைமைக்கான அல்லது வெற்றிக்கான குறிகளாக நிறுவியதைக் குறிக்கலாம்.'
