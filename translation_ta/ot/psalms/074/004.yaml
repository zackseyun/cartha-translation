  choice: இடம்/வழிபாடு சார்ந்த ‘குறிக்கப்பட்ட சந்திப்பிடம்’
  alternative: குறிக்கப்பட்ட காலம்; சபை அல்லது பண்டிகை
  rationale: உடனடி சூழல் பகைவர்கள் புனித இடத்திற்குள் புகுந்ததை விவரிப்பதால் இடம் சார்ந்த பொருள் மிகவும் பொருத்தமானது. அதேவேளை ‘குறிக்கப்பட்ட சந்திப்பிடம்’ என்பது சொல்லின் வழிபாட்டுச் சார்ந்த பலபொருள் நுணுக்கத்தை ஓரளவு திறந்தே வைக்கிறது.
- issue: אוֹתֹתָם אֹתוֹת என்ற மறுபடியும் வரும் சொற்றொடர்
  choice: மறுபடியும் வரும் ‘அடையாளங்கள்’ என்ற சொல்லைப் பாதுகாத்தல்
  alternative: ‘தங்கள் சின்னங்களை வெற்றிக்கொடிகளாக நிறுவினார்கள்’ என்று பொருளை விளக்குதல்
  rationale: அவை உடைமை, வெற்றி அல்லது அதிகாரத்தின் சின்னங்கள் எனப் பொருள்படலாம்; ஆனால் மூலம் அதை வெளிப்படையாகத் தீர்மானிக்காததால் மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவமாக ‘உமது/உமக்கு’ வருகிறது. மூலத்தின் கர்ஜனை உருவகமும் ‘அடையாளங்கள்’ என்ற நோக்கமுள்ள மறுபடியும் வருதலும் பாதுகாக்கப்பட்டுள்ளன.
