source:
  edition: WLC
  text: אַל תִּתֵּ֣ן לְ֭/חַיַּת נֶ֣פֶשׁ תּוֹרֶ֑/ךָ חַיַּ֥ת עֲ֝נִיֶּ֗י/ךָ אַל תִּשְׁכַּ֥ח לָ/נֶֽצַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/019.yaml
  text: Do not give your dove to the ravenous beast; do not forget the lives of your afflicted ones forever.
translation:
  language: ta
  text: உமது புறாவின் உயிரைக் காட்டுமிருகத்திடம் ஒப்படைக்காதீர்; உமது துன்புறுவோரின் உயிரை என்றென்றும் மறந்துவிடாதீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹרֶךָ (toreka)
  choice: உமது புறா
  rationale: תּוֹר என்பது குறிப்பாக காட்டுப்புறா/டர்டில் டவ் என்பதைக் குறிக்கலாம்; தமிழில் கவிதை உருவகத்தை இயல்பாகவும் தெளிவாகவும் காக்க ‘புறா’ பயன்படுத்தப்பட்டது.
- source_word: לְחַיַּת (leḥayyat)
  choice: காட்டுமிருகத்திடம்
  rationale: חַיָּה இங்கு காட்டு விலங்கு அல்லது மிருகம் எனப் பொருள்படும். மூலத்தில் வெளிப்படையாக இல்லாத ‘இரைவிழுங்கும்’ போன்ற பண்பைச் சேர்க்காமல், அச்சுறுத்தும் விலங்கு உருவகம் காக்கப்பட்டது.
- source_word: נֶפֶשׁ (nefesh)
  choice: உயிரை
  rationale: இச்சூழலில் உயிர்/வாழ்வு என்பதே இயல்பான பொருள்; ‘ஆத்துமா’ என்று மொழிபெயர்ப்பது தேவையற்ற உடல்–ஆத்துமா பிரிவை இறக்குமதி செய்யக்கூடும்.
- source_word: חַיַּת עֲנִיֶּיךָ (ḥayyat ʿaniyyeka)
  choice: உமது துன்புறும் மக்களின் உயிர்களை
  rationale: עֲנִיֶּיךָ என்பது துன்புறுத்தப்பட்ட அல்லது ஒடுக்கப்பட்ட மக்களைக் குறிக்கிறது. எபிரெயத்தில் ‘உயிர்’ ஒருமையில் இருந்தாலும், பன்மையான மக்களைக் கூட்டாகக் குறிப்பதால் தமிழில் ‘உயிர்களை’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: לָנֶצַח (lanetsaḥ)
  choice: என்றென்றும்
  rationale: காலவரையற்ற நிரந்தரத்தை அல்லது முடிவில்லாத காலத்தை வெளிப்படுத்தும் வழக்கமான, கண்ணியமான தமிழ் வடிவம்.
theological_decisions:
- issue: ‘புறா’ யாரைக் குறிக்கிறது என்ற உருவக அடையாளம்
  choice: உருவகத்தை விளக்கமின்றி அப்படியே காத்தல்
  alternative: புறாவை நேரடியாக ‘உமது மக்கள்’ அல்லது ‘இஸ்ரவேல்’ என்று மாற்றுதல்
  rationale: சங்கீதத்தின் கவிதை உருவகம் நோக்கமுள்ளதாய் உள்ளது; அதன் குறிப்பை மொழிபெயர்ப்பிலேயே தீர்மானிப்பது மூலத்தின் திறந்த தன்மையைக் குறைக்கும்.
- issue: נֶפֶשׁ என்பதன் மானிடவியல் பொருள்
  choice: ‘உயிர்’
  alternative: ‘ஆத்துமா’
  rationale: இங்கு வேண்டுதல் உயிரைக் காட்டுமிருகத்திடம் ஒப்படைக்காதிருப்பதைப் பற்றியது. தனித்த உடலற்ற ஆத்துமா குறித்த கோட்பாட்டை வசனத்தில் சேர்க்காமல் மூலத்தின் பொருளை காக்கிறது.
translation_notes:
  register: நவீன தரமான தமிழில், வேண்டுதலுக்குரிய கண்ணியமான ‘ஒப்படைக்காதீர் / மறந்துவிடாதீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. கவிதை இணைநிலை காக்கப்பட்டு, மூலத்தில் இல்லாத சமயக் கோட்பாட்டு விளக்கங்கள் தவிர்க்கப்பட்டுள்ளன.
