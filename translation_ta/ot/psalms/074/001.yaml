  yaml_path: translation/ot/psalms/074/001.yaml
  text: A Maskil of Asaph. Why[a], O God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: ta
  text: 'ஆசாபின் மஸ்கீல்.[a]


    கடவுளே, ஏன் எங்களை என்றென்றைக்கும் தள்ளிவிட்டீர்? உமது மேய்ச்சல் நிலத்தின் ஆடுகளுக்கு எதிராக உமது கோபம் ஏன் புகைகிறது?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மஸ்கீல்” என்பது சங்கீதத் தலைப்பில் வரும் ஒரு தொழில்நுட்பச் சொல்; இது தியானத்துக்குரிய அல்லது போதனையளிக்கும் ஒரு பாடலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: சங்கீதத் தலைப்பில் வரும் இத்தொழில்நுட்பச் சொல்லின் துல்லியமான பொருள் உறுதியற்றது. பொருளை அளவுக்கு மீறித் தீர்மானிக்காமல் ஒலிபெயர்த்து, சாத்தியமான விளக்கங்களை அடிக்குறிப்பில் தருகிறது.
- source_word: לְאָסָף
  choice: ஆசாப்பின்
  rationale: לְ என்னும் முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, அர்ப்பணிப்பு ஆகியவற்றில் ஒன்றைக் குறிக்கலாம். இயல்பான தமிழ்த் தலைப்பாகிய ‘ஆசாப்பின்’ இந்தத் தொடர்பை மிகக் குறைவாகவே குறிப்பாக்குகிறது.
- source_word: לָמָה
  choice: ஏன்
  rationale: புலம்பலின் நேரடியான வினாவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இங்கு கடவுளை நேரடியாக அழைக்கும் விளிவேற்றுமை தெளிவாக இருப்பதால் ‘கடவுளே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: זָנַחְתָּ
  choice: புறக்கணித்துவிட்டீர்
  rationale: வினைச்சொல் தள்ளிவிடுதல் அல்லது நிராகரித்தல் என்ற பொருளைக் கொண்டது. ‘புறக்கணித்துவிட்டீர்’ என்பது உறவு முறிவையும் புலம்பலின் தீவிரத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: לָנֶצַח
  choice: என்றென்றைக்கும்
  rationale: நீடித்த அல்லது முடிவே இல்லாததுபோல் தோன்றும் காலத்தைப் புலம்பலின் வலிமையுடன் வெளிப்படுத்துகிறது.
- source_word: יֶעְשַׁן
  choice: புகைகிறது
  rationale: எபிரெய உருவகம் கோபம் புகைவதாக நேரடியாகச் சொல்கிறது. அதை ‘எரிகிறது’ என்று தட்டையாக்காமல் மூலப்படிமம் பாதுகாக்கப்பட்டது.
- source_word: אַפְּךָ
  choice: உமது கோபம்
  rationale: சொற்பொருளில் ‘மூக்கு/நாசி’ என்றாலும், இச்சூழலில் இது கோபத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘கோபம்’ பொருளைத் தெளிவாகத் தருகிறது; ‘புகைகிறது’ மூல உருவகத்தின் ஒரு பகுதியைத் தக்கவைக்கிறது.
- source_word: בְּצֹאן
  choice: ஆடுகளுக்கு எதிராக
  rationale: மக்களை கடவுளின் ஆடுகளாகச் சித்தரிக்கும் மேய்ப்பர் உருவகம் காக்கப்படுகிறது; בְ இங்கு கோபத்தின் எதிர்நோக்கிய திசையைச் சூழலுக்கேற்ப ‘எதிராக’ எனத் தருகிறது.
- source_word: מַרְעִיתֶךָ
  choice: உமது மேய்ச்சல்
  rationale: மேய்ச்சல் நிலம் அல்லது மேயும் இடம் என்ற பொருளைச் சுருக்கமாகத் தருகிறது. ‘உமது மேய்ச்சலின் ஆடுகள்’ என்ற இணைப்பு எபிரெய மேய்ப்பர் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: זָנַחְתָּ என்ற வடிவில் முதல் நபர் பன்மை செயப்படுபொருளை வெளிப்படுத்துதல்
  choice: எங்களை ... புறக்கணித்துவிட்டீர்
  alternative: உமது மக்களைப் புறக்கணித்துவிட்டீர்
  rationale: மசோரெட்டிக் வாசிப்பும் சங்கீதத்தின் சமூகப் புலம்பல் சூழலும் முதல் நபர் பன்மை செயப்படுபொருளை உணர்த்துகின்றன. ‘எங்களை’ என்பது கூடுதல் இறையியல் விளக்கமின்றி அதை நேரடியாகத் தருகிறது.
- issue: לְאָסָף என்பதில் உள்ள தொடர்பின் வகை
  choice: ஆசாப்பின்
  alternative: ஆசாப்புக்காக / ஆசாப்பைச் சேர்ந்த
  rationale: முன்னொட்டு ஆசிரியர், தொடர்புடையவர், அல்லது அர்ப்பணிப்புப் பெறுபவர் என்பவற்றில் எதைக் குறிக்கிறது என்பது உறுதியல்ல. தமிழில் வழக்கமான உடைமை வடிவம் தொடர்பை மட்டும் காட்டி அந்தத் தெளிவின்மையை ஓரளவு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபப் புலம்பலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. கடவுளை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் ‘கோபம் புகைகிறது’ என்ற வலுவான உருவகம் இயல்பாகத் தக்கவைக்கப்பட்டுள்ளது.
