base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/012.yaml
  text: Yet God is my King from of old[a], working acts of salvation in the midst of the earth.
translation:
  language: ta
  text: ஆனாலும், கடவுள் பண்டைக்காலம் முதலே என் அரசர்; பூமியின் மத்தியில் மீட்புச் செயல்களைச் செய்கிறவர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாட்டின் மத்தியில்.” எபிரெயச் சொல் முழுப் பூமியையோ ஒரு குறிப்பிட்ட நாடு அல்லது பிரதேசத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהִים
  choice: ஆனாலும், கடவுள்
  rationale: முன்னுள்ள அழிவின் புலம்பலுக்கு மாறாக இங்கு நம்பிக்கை வெளிப்படுவதால், வாவ் இணைப்பை எதிர்மறைத் திருப்பமாகக் காட்டும் ‘ஆனாலும்’ இயல்பானது.
- source_word: מַלְכִּי
  choice: என் அரசர்
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியைத் தெளிவாகப் பேணி, கடவுளின் அரசாட்சியைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல் பயன்படுத்தப்பட்டது.
- source_word: מִקֶּדֶם
  choice: பண்டைக்காலமுதலே
  rationale: மிகப் பழங்காலத்திலிருந்து நீடிக்கும் நிலையைச் சொல்கிறது; ‘தொடக்கமுதல்’ என்று முழுமையான ஆதியைத் தேவையின்றி வலியுறுத்தவில்லை.
- source_word: פֹּעֵל
  choice: செய்கிறவர்
  rationale: எபிரெயப் பெயரெச்சம் கடவுளின் தொடர்ந்த அல்லது இயல்பான செயற்பாட்டைக் காட்டுகிறது; தமிழில் உறவுப்பெயர் வடிவம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְשׁוּעוֹת
  choice: மீட்புச் செயல்களை
  rationale: பன்மையான மீட்புகள் அல்லது விடுவிப்புகளைத் தமிழில் இயல்பாகவும் அதன் பல்வேறு வல்ல செயல்கள் என்ற பொருளுடனும் வழங்குகிறது.
- source_word: בְּקֶרֶב
  choice: நடுவில்
  rationale: ‘மத்தியில்/உள்ளே’ என்ற இடவியல் பொருளைப் பேணும் சுருக்கமான, கவித்துவமான தமிழ்.
- source_word: הָאָרֶץ
  choice: பூமியின்
  rationale: אֶרֶץ என்பதன் பரந்த ‘பூமி’ பொருள் முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; ‘நாடு/தேசம்’ என்ற உள்ளூர் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: கடவுளின் மீட்புச் செயல்களின் பரப்பு
  choice: பூமி
  alternative: நாடு அல்லது தேசம்
  rationale: אֶרֶץ முழுப் பூமியையோ குறிப்பிட்ட நாட்டையோ குறிக்கலாம். சங்கீதத்தின் விரிந்த காட்சியால் ‘பூமி’ முதன்மைப்படுத்தப்படுகிறது; ஆனால் மூலமொழியின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் தக்கவைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் கவித்துவமும் கண்ணியமும் கொண்ட நடை. ‘பண்டைக்காலமுதலே’ காலப் பழமையைப் பேணுகிறது; ‘மீட்புச் செயல்கள்’ மூலத்தின் பன்மையையும் இறையியல் ஒலியையும் இயல்பாக வழங்குகிறது.
