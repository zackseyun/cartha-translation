  source_fidelity: 'மூலத்தின் முக்கியப் பொருள் நன்றாகக் காக்கப்பட்டுள்ளது: தேவனுடைய மக்களைப் பழங்காலத்தில் தமக்குரியவர்களாக்கிக் கொண்டதும், அவர்களை மீட்டதும், சீயோனில் குடியிருந்ததும் தெளிவாக உள்ளன. ஆனால் இறுதியிலுள்ள זֶה (‘இது/இந்த’) தற்போதைய சொல்வரிசையில் ‘சீயோன் மலை இதுவே’ என ஒரு தனி அறிவிப்புபோல் ஒலிக்கிறது; மூலத்தில் அது ‘நீர் குடியிருந்த இந்தச் சீயோன் மலை’ என்ற இணைப்புப் பகுதி. அதைச் சரிசெய்வது பாதுகாப்பானதும் நெருக்கமானதும் ஆகும்.'
  naturalness: ‘நீர் குடியிருந்த இந்தச் சீயோன் மலை’ என்பது நவீன தரத் தமிழில் இயல்பானது; அதே நேரத்தில் எபிரெயத்தின் சுட்டுப்பெயரையும் காக்கிறது. ‘பண்டைக்காலத்தில்’ என்பது தேவையற்ற வலியுறுத்தலின்றி קֶּדֶם என்பதன் காலக் குறிப்பை இயல்பாகத் தருகிறது.
