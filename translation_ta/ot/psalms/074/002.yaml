  text: זְכֹ֤ר עֲדָתְ/ךָ֨ קָ֘נִ֤יתָ קֶּ֗דֶם גָּ֭אַלְתָּ שֵׁ֣בֶט נַחֲלָתֶ֑/ךָ הַר צִ֝יּ֗וֹן זֶ֤ה שָׁכַ֬נְתָּ בּֽ/וֹ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
translation:
  language: ta
  text: பண்டைக்காலத்தில் நீர் உமக்குச் சொந்தமாக்கிக்கொண்ட[a] உமது சபையை நினைவுகூரும்; உமது உரிமைச் சொத்தான கோத்திரமாக[b] அதை மீட்டுக்கொண்டீர்—நீர் குடியிருந்த இந்தச் சீயோன் மலை[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமக்குச் சொந்தமாக்கிக்கொண்ட’ என்பதை ‘வாங்கிக்கொண்ட’ என்றும், சில சூழல்களில் ‘படைத்த’ என்றும் மொழிபெயர்க்கலாம்; இங்கு அந்தப் பொருள் சாத்தியம் குறைவு.
    reason: lexical_alternative
  - marker: b
    text: ‘கோத்திரம்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ‘கோல்’ அல்லது ‘செங்கோல்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: 'எபிரெயத்தில் சொல்லுக்கு சொல்: ‘இந்தச் சீயோன் மலை’; ‘இந்த’ என்பது சீயோன் மலையைக் சுட்டுகிறது.'
    reason: literal_clarification
lexical_decisions:
- source_word: זְכֹר
  choice: நினைவுகூரும்
  rationale: கடவுளை நோக்கிய ஆண்பால் ஒருமை ஏவல் வடிவம். புலம்பல் வேண்டுதலின் கண்ணியத்தையும் நேரடித் தன்மையையும் இவ்வடிவு இயல்பாகக் காக்கிறது.
- source_word: עֲדָתְךָ
  choice: உமது சபை
  rationale: கூடியிருக்கும் உடன்படிக்கை மக்களைக் குறிக்கும் கூட்டுப்பெயர். ‘சபை’ என்பது நவீன தமிழில் புரியக்கூடியதும் இங்கு ஒரு குறிப்பிட்ட நிறுவனப் பொருளைத் திணிக்காததும் ஆகும்.
- source_word: קָנִיתָ
  choice: நீர் உமக்குச் சொந்தமாக்கிக்கொண்ட
  rationale: קנה என்பதன் வாங்குதல், பெறுதல், உடைமையாக்குதல் ஆகிய பொருள் விரிவை மனதில் கொண்டு, வணிகப் பரிமாற்றத்தைத் தேவையின்றித் திணிக்காமல் கடவுள் மக்களைத் தமக்குரியவர்களாக ஏற்றுக்கொண்ட கருத்தை வெளிப்படுத்துகிறது.
- source_word: קֶדֶם
  choice: பண்டைக்காலத்திலேயே
  rationale: வெகுகாலத்திற்கு முந்திய காலத்தைக் குறிக்கிறது; சங்கீதத்தின் பழைய மீட்புச் செயல்களை நினைவூட்டும் வேண்டுதலுக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: גָּאַלְתָּ
  choice: மீட்டுக்கொண்டீர்
  rationale: உறவுரிமையுள்ள மீட்பரின் விடுவித்தல் மற்றும் தமக்குரியவர்களாக மீட்டல் ஆகிய நிறைகளைத் தக்கவைக்கிறது.
- source_word: שֵׁבֶט נַחֲלָתֶךָ
  choice: உமது உரிமைச் சொத்தான கோத்திரம்
  rationale: שֵׁבֶט என்பதற்கு கோத்திரம், கோல், செங்கோல் ஆகிய பொருள்கள் இருக்கலாம். சபை மற்றும் மீட்கப்பட்ட மக்கள் என்ற இணைப்பில் ‘கோத்திரம்’ மிகப் பொருத்தமானது; נַחֲלָה கடவுளுக்குரிய உரிமைப் பங்கைச் சுட்டுகிறது.
- source_word: הַר צִיּוֹן זֶה
  choice: சீயோன் மலை இதுவே
  rationale: ‘இது’ என்ற சுட்டுப்பெயரை அழிக்காமல், அது சீயோன் மலையைக் குறிப்பதை இயல்பான தமிழ் வாக்கிய அமைப்பில் வெளிப்படுத்துகிறது.
- source_word: שָׁכַנְתָּ בוֹ
  choice: நீர் குடியிருந்த
  rationale: שׁכן என்பதன் தங்கியிருத்தல் அல்லது வாசம்செய்தல் என்ற பொருளையும் கடவுளின் பிரசன்னம் சார்ந்த ஒலிநயத்தையும் எளிய, கண்ணியமான தமிழில் காக்கிறது.
theological_decisions:
- issue: קָנִיתָ என்பது படைத்தலைக் குறிக்கிறதா, உடன்படிக்கை மக்களைத் தமக்குச் சொந்தமாக்கிக்கொண்டதைக் குறிக்கிறதா?
  choice: உடன்படிக்கை மக்களைத் தமக்குச் சொந்தமாக்கிக்கொண்டது
  alternative: படைத்தீர்; வாங்கினீர்
  rationale: ‘உமது சபை’ என்ற செயப்படுபொருளும், அதற்கு இணையாக வரும் ‘மீட்டுக்கொண்டீர்’ என்பதும் இஸ்ரவேலை வரலாற்றில் தமது மக்களாக ஏற்றுக்கொண்ட செயலை வலியுறுத்துகின்றன. ஆயினும் வாங்குதல்/பெறுதல் சார்ந்த மூலச்சொல்லின் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: שֵׁבֶט என்பதை ‘கோத்திரம்’ என்றா, ‘கோல்/செங்கோல்’ என்றா மொழிபெயர்ப்பது?
  choice: கோத்திரம்
  alternative: கோல்; செங்கோல்
  rationale: மீட்கப்பட்ட சபையாகிய மக்களைக் குறிக்கும் உடனடிச் சூழலில் மக்கள் குழுவைக் குறிக்கும் ‘கோத்திரம்’ இயல்பாகப் பொருந்துகிறது. அரசாட்சி குறியீட்டைச் சூழல் கட்டாயப்படுத்தவில்லை; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: זֶה என்ற சுட்டுச்சொல்லை வெளிப்படையாக மொழிபெயர்ப்பதா?
  choice: ‘இதுவே’ என்று வெளிப்படையாகக் காத்தல்
  alternative: சீயோன் மலை என்று மட்டும் கூறுதல்
  rationale: எபிரெய உரையின் சுட்டிக் காட்டும் வலிமையையும் சீயோனுடன் அதன் அண்மைத் தொடர்பையும் காக்கிறது; தமிழில் ‘சீயோன் மலை இதுவே’ என்பது புரிந்துகொள்ளத்தக்கதாக உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பன்மை ஒருமையாகிய ‘நீர்/உமது’ வடிவங்கள் தொடர்ச்சியாகக் காக்கப்பட்டுள்ளன. எபிரெய வாக்கியத்தின் நெருக்கமான இணைப்புகளையும் இறுதியில் வரும் சுட்டுச் சொல்லையும் காக்க அரைப்புள்ளியும் நீள்கோடும் பயன்படுத்தப்பட்டுள்ளன; அதேவேளை சாதாரண வாசகருக்குப் பொருள் தெளிவாக இருக்க ‘அதை’ சூழலிலிருந்து நிரப்பப்பட்டுள்ளது.
