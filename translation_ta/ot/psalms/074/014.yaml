source:
  edition: WLC
  text: אַתָּ֣ה רִ֭צַּצְתָּ רָאשֵׁ֣י לִוְיָתָ֑ן תִּתְּנֶ֥/נּוּ מַ֝אֲכָ֗ל לְ/עָ֣ם לְ/צִיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/014.yaml
  text: You crushed the heads of Leviathan[a]; you gave him as food for the creatures of the desert.
translation:
  language: ta
  text: லிவியாதானின் தலைகளை நொறுக்கினீர்; அவனை வறண்ட நிலத்தின் உயிரினங்களுக்கு உணவாகக் கொடுத்தீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வறண்ட நிலவாசிகளின் ஒரு மக்களுக்காக.” எபிரெயச் சொற்றொடர் கடினமானது. “வறண்ட நிலவாசிகள்” என்பதற்கான சொல் வறண்ட பகுதிகளில் வாழும் மனிதர்களையோ பாலைவன உயிரினங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִצַּצְתָּ
  choice: நொறுக்கியவர்
  rationale: רצץ என்பதன் வன்மையான உடைத்தல் அல்லது நசுக்குதல் என்ற பொருளை இயல்பான, கவித்துவமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רָאשֵׁי
  choice: தலைகளை
  rationale: எபிரெய மூலத்தில் உள்ள பன்மை வடிவத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לִוְיָתָן
  choice: லிவியாதான்
  rationale: வேதாகமத்தின் கவித்துவமான பெயராக ஒலிபெயர்த்து, அது உயிரினமா, புராணக் குறியீடா, வரலாற்றுப் பகைவனின் உருவகமா என்பதை மொழிபெயர்ப்பிலேயே முடிவுசெய்யாமல் விடுகிறது.
- source_word: תִּתְּנֶנּוּ
  choice: அவனைக் ... கொடுத்தீர்
  rationale: נתן என்பதன் இயல்பான ‘கொடு’ என்ற பொருளையும், லிவியாதானைக் குறிக்கும் ஆண்பால் ஒருமை பின்னொட்டையும் பிரதிபலிக்கிறது.
- source_word: מַאֲכָל
  choice: உணவாக
  rationale: מַאֲכָל என்பதன் நேரடியான பொருளை தமிழில் இயல்பாக வழங்குகிறது.
- source_word: לְעָם לְצִיִּים
  choice: பாலைவன உயிரினங்களுக்கு
  rationale: சிக்கலான צִיִּים சொல்லை வறண்ட நிலத்து உயிரினங்கள் என எடுத்துக்கொள்கிறது; עַם இங்கு ஒரு கூட்டத்தைக் குறிக்கும் வகையில் புரிந்துகொள்ளப்படுகிறது. மனிதப் பாலைவனவாசிகள் என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: லிவியாதான் உருவகத்தின் இயல்பு
  choice: ‘லிவியாதான்’ என்ற பெயரையும் பல தலைகள் கொண்ட கவித்துவப் படிமத்தையும் அப்படியே வைத்தல்
  alternative: அதைக் கடல் அரக்கன், எகிப்து, அல்லது குழப்பத்தின் சக்திகள் என்று குறிப்பாக விளக்குதல்
  rationale: மூலவசனம் குறியீட்டின் சரியான அடையாளத்தைத் தீர்மானிக்கவில்லை; எனவே தேவனுடைய வெற்றியைச் சித்தரிக்கும் கவித்துவ-பிரபஞ்ச படிமத்தின் உண்மையான தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் மரியாதைமிக்க கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. சங்கீத உரைக்கு ஏற்றவாறு ‘நீரே/கொடுத்தீர்’ வடிவங்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன; அரிதான இறையியல் விளக்கங்கள் உரைக்குள் சேர்க்கப்படவில்லை.
