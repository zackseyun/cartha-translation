source:
  edition: WLC
  text: שִׁלְח֣וּ בָ֭/אֵשׁ מִקְדָּשֶׁ֑/ךָ לָ֝/אָ֗רֶץ חִלְּל֥וּ מִֽשְׁכַּן שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/007.yaml
  text: They set your sanctuary on fire[c][b][a]; they profaned the dwelling place of your name to the ground.
translation:
  language: ta
  text: உமது புனித இடத்திற்குத் தீ வைத்தார்கள்[a]; உமது பெயரின் உறைவிடத்தை[b] தரைவரை அவமதித்தார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “உமது புனித இடத்திற்குள் தீயை அனுப்பினார்கள்.” இங்கு எபிரேய மொழிநடை அதை எரித்தார்கள் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில், “உமது பெயரின் உறைவிடம்.” இது கடவுள் தமது பிரசன்னம் அறியப்படும்படி தேர்ந்துகொண்ட இடத்தைக் குறிக்கும் மொழிநடை.
    reason: cultural_note
  - marker: c
    text: அல்லது, “உமது பெயரின் உறைவிடத்தைத் தரைமட்டமாக்கி அதன் புனிதத்தைக் கெடுத்தார்கள்.”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: שִׁלְחוּ בָאֵשׁ
  choice: தீ வைத்தார்கள்
  rationale: சொல்லுக்குச் சொல் எனில் ‘தீயை அனுப்பினார்கள்’ என்றாலும், இச்சூழலில் இந்த எபிரேயச் சொற்றொடர் ஓர் இடத்தை எரியச் செய்ததைக் குறிக்கிறது. ‘தீ வைத்தார்கள்’ என்பது இயல்பான நவீனத் தமிழ்.
- source_word: מִקְדָּשֶׁךָ
  choice: உமது புனித இடம்
  rationale: מִקְדָּשׁ என்பது புனிதமாக்கப்பட்ட இடத்தைக் குறிக்கிறது. ‘ஆலயம்’ என்று மட்டும் குறுக்காமல், மூலச்சொல்லின் பரந்த பொருளை இத்தேர்வு காக்கிறது.
- source_word: לָאָרֶץ
  choice: தரைமட்டமாக்கி
  rationale: ‘தரைக்கு/நிலத்துக்கு’ என்ற அடிப்படைப் படிமத்தை இயல்பான தமிழில் வெளிப்படுத்தி, முழுமையான தாழ்த்தலையும் அழிவையும் சுட்டுகிறது. இது வினையுடன் எவ்வாறு இணைகிறது என்பதில் உள்ள சிறிய தெளிவின்மை அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חִלְּלוּ
  choice: அதன் புனிதத்தைக் கெடுத்தார்கள்
  rationale: חלל என்பதன் பியேல் வடிவம் புனிதமான ஒன்றை அவமதித்து அதன் புனிதத் தன்மையைக் கெடுப்பதைக் குறிக்கிறது. ‘தீட்டுப்படுத்தினார்கள்’ என்பதைக் காட்டிலும் இச்சொற்றொடர் பொதுவாசகருக்கு தெளிவாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: מִשְׁכַּן שְׁמֶךָ
  choice: உமது பெயரின் உறைவிடம்
  rationale: ‘உமது பெயரின் உறைவிடம்’ என்ற எபிரேய இறையியல் படிமத்தைச் சுருக்காமல் காக்கிறது; தேவனை அந்தக் கட்டடத்திற்குள் அடக்காமல், அவர் தம் பெயரை அங்கே நிலைநிறுத்தியிருப்பதைக் குறிக்கிறது.
theological_decisions:
- issue: מִקְדָּשׁ மற்றும் מִשְׁכַּן ஆகிய இணைச் சொற்களை வேறுபடுத்துதல்
  choice: ‘புனித இடம்’ மற்றும் ‘உறைவிடம்’
  alternative: இரண்டையும் ‘ஆலயம்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரேயம் தொடர்புடைய இரு வேறு சொற்களைப் பயன்படுத்துகிறது. இடம் புனிதமானதும், இறைபெயரின் உறைவிடமானதும் என்ற கவிதை மற்றும் இறையியல் நுணுக்கத்தை வேறு சொற்கள் காக்கின்றன.
- issue: ‘பெயரின் உறைவிடம்’ என்ற இறையியல் மொழிநடையைப் பாதுகாத்தல்
  choice: ‘உமது பெயரின் உறைவிடம்’
  alternative: ‘உமது உறைவிடம்’ அல்லது ‘நீர் உறையும் இடம்’
  rationale: மூலவசனம் தேவனே கட்டடத்தில் குடியிருக்கிறார் என்று எளிமைப்படுத்தாமல், அவருடைய ‘பெயர்’ உறையும் இடம் என்று கூறுகிறது. அந்தத் திட்டமிட்ட இறையியல் அழுத்தம் அப்படியே வைக்கப்படுகிறது.
- issue: לָאָרֶץ என்பதன் தொடரியல் தொடர்பு
  choice: உறைவிடத்தைத் தரைமட்டமாக்கிய செயலோடு இணைத்தல்
  alternative: ‘உமது பெயரின் உறைவிடத்தைத் தரைவரை அவமதித்தார்கள்’ என்று நேரடியாக அமைத்தல்
  rationale: எபிரேயச் சொல்வரிசையில் ‘தரைக்கு’ என்பது ‘புனிதத்தைக் கெடுத்தார்கள்’ என்பதற்கு முன் வருகிறது; அது அழிவின் அளவையோ கடுமையான அவமதிப்பையோ சுட்டலாம். இயல்பான தமிழுக்காக முதன்மை உரை அழிவை வெளிப்படுத்துகிறது; மாற்று அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: மரியாதைக்குரிய இறைமுகவரி வடிவமாக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. நடை நவீனமும் பொதுவாசகருக்குப் புரியத்தக்கதுமாக உள்ளது; அதேவேளை சங்கீதத்தின் புனிதமான, துயரமிக்க தொனி காக்கப்பட்டுள்ளது. ‘பரிசுத்த ஸ்தலம்’ போன்ற பழைய அல்லது சமயக்குழு சார்ந்த வழக்குகளுக்குப் பதிலாக ‘புனித இடம்’ பயன்படுத்தப்பட்டது.
