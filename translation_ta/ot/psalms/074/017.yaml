source:
  edition: WLC
  text: אַתָּ֣ה הִ֭צַּבְתָּ כָּל גְּבוּל֣וֹת אָ֑רֶץ קַ֥יִץ וָ֝/חֹ֗רֶף אַתָּ֥ה יְצַרְתָּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/017.yaml
  text: You established all the boundaries of the earth[b][a]; summer and winter—you formed them.
translation:
  language: ta
  text: பூமியின் எல்லா எல்லைகளையும் நீரே நிலைநிறுத்தினீர்; கோடையையும் குளிர்காலத்தையும் நீரே உருவாக்கினீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִצַּבְתָּ
  choice: நிலைநிறுத்தினீர்
  rationale: נצב என்பதன் ஹிஃபில் வடிவம் ஒன்றை நிலையாக நிறுத்துதல் அல்லது அதன் இடத்தில் அமைத்தல் என்ற பொருளைக் கொண்டது. ‘நிலைநிறுத்தினீர்’ என்பது அமைத்த செயலும் அதன் நிலைத்த தன்மையும் இரண்டையும் வெளிப்படுத்துகிறது.
- source_word: כָּל גְּבוּלוֹת אָרֶץ
  choice: பூமியின் எல்லா எல்லைகளையும்
  rationale: גְּבוּלוֹת என்பது எல்லைகள் அல்லது வரம்புகளைக் குறிக்கிறது. பருவங்களுடன் இணையும் படைப்பொழுங்குச் சூழலில் אָרֶץ என்பதற்கு ‘பூமி’ பொருத்தமானது; כָּל மற்றும் பன்மை வடிவமும் மொழிபெயர்ப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: קַיִץ וָחֹרֶף
  choice: கோடையையும் குளிர்காலத்தையும்
  rationale: இவை ஆண்டின் பருவங்களைக் குறிக்கும் வழக்கமான இணைச்சொற்கள். நவீனத் தமிழில் ‘கோடை’, ‘குளிர்காலம்’ என்பவை தெளிவான இயல்பான இணைகள்.
- source_word: יְצַרְתָּם
  choice: உருவாக்கினீர்
  rationale: יצר என்பது உருவமைத்தல், வடிவமைத்தல் என்ற பொருளைக் கொண்டது. தமிழில் ‘உருவாக்கினீர்’ இயல்பாகவும் தெளிவாகவும் உள்ளது; ஆண்பால் பன்மை பின்னொட்டு இங்கு கோடையையும் குளிர்காலத்தையும் சுட்டுவதால் இரண்டையும் நேரடியாகச் செயப்படுபொருளாகக் கூறுவது தெளிவைத் தருகிறது.
- source_word: אַתָּה ... אַתָּה
  choice: நீரே ... நீரே
  rationale: எபிரேயத்தில் மீண்டும் வரும் தனிப்பட்ட சுட்டுப்பெயர் வலியுறுத்தலை அளிக்கிறது. மரியாதையும் கவிதைநடையும் கொண்ட ‘நீரே’ என்பதை இரு கூறுகளிலும் மீண்டும் கூறுவது அந்த வலியுறுத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: பூமியின் ‘எல்லைகள்’ குறித்த படைப்புமொழியின் நோக்கம்
  choice: உலகைப் படைப்பொழுங்கில் அமைத்த இறைவனின் செயலைக் குறிக்கும் பிரபஞ்ச அளவிலான கூற்று
  alternative: நாடுகள் அல்லது நிலப்பகுதிகளின் ஆட்சிப்பரப்பு எல்லைகளைக் குறிக்கும் கூற்று
  rationale: ‘கோடையும் குளிர்காலமும்’ என்ற தொடர்ச்சி இந்த வசனத்தை அரசியல் நில எல்லைகளைவிடப் படைப்பொழுங்கின் சூழலில் வைக்கிறது. எனவே ‘நிலத்தின் எல்லைகள்’ என்பதற்குப் பதிலாக ‘பூமியின் எல்லைகள்’ என மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கும் மரியாதைப் பன்மையும் எபிரேய மூலத்தின் வலியுறுத்தலும் ‘நீரே’ என்ற மறுமொழியால் பாதுகாக்கப்பட்டுள்ளன.
