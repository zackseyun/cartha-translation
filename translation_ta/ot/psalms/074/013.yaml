- source_word: יָם
  choice: கடலை
  rationale: இங்கு குறிப்பிட்ட கடலை அல்லது கவிதையில் உருவகப்படுத்தப்படும் பெருங்கடலைக் குறிக்கிறது; தமிழில் ‘கடலை’ என்பது இரு சாத்தியங்களையும் திறந்துவைக்கிறது.
- source_word: שִׁבַּרְתָּ
  choice: நொறுக்கினீர்
  rationale: שׁבר என்பது உடைத்தல் என்று பொருள்; ‘நொறுக்கினீர்’ தலைகள்மீது நிகழும் வன்மையான, தீர்மானமான செயலைத் தமிழில் தெளிவாகத் தருகிறது.
- source_word: רָאשֵׁי
  choice: தலைகளை
  rationale: இது உடற்கூறு சார்ந்த பன்மை உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: תַנִּינִים
  choice: கடல் அரக்கர்களின்
  rationale: תַנִּינִים நீருடன் தொடர்புடைய பெரும் பாம்புருவ அல்லது பயங்கர உயிரினங்களைக் குறிக்கலாம். ‘கடல் அரக்கர்கள்’ கவிதையின் பேரச்சமூட்டும் கடல்-குழப்ப உருவகத்தை நவீன தமிழில் புரியும்படி தருகிறது.
- source_word: עַל הַמָּיִם
  choice: நீரின்மேல் இருந்த
  rationale: עַל என்பதன் அடிப்படை ‘மேல்’ என்ற இடப்பொருளைப் பாதுகாக்கிறது; தமிழில் பெயர்ச்சொல் தொடரோடு இயல்பாக இணைய ‘இருந்த’ சேர்க்கப்பட்டுள்ளது, ஆனால் ‘நீரில்’ என்று விளக்கமளித்து மாற்றப்படவில்லை.
theological_decisions:
- issue: கடலும் תַנִּינִים எனும் உயிரினங்களும் குறிக்கும் உருவகத்தின் இயல்பு
  choice: படைப்பின் குழப்பக் கடல்மீது இறைவன் பெறும் வெற்றியையும், யாத்திராகமக் கடல் விடுதலையின் எதிரொலியையும் சாத்தியமாக வைத்திருக்கும் கவித்துவ மொழியைப் பாதுகாத்தல்
  alternative: இதை யாத்திராகம நிகழ்வைக் குறிக்கும் வரலாற்றுச் சுட்டாக மட்டும் வாசித்தல்; அல்லது பண்டைய குழப்பப் போராட்ட உருவகமாக மட்டும் வாசித்தல்
  rationale: எபிரெய உரை இரண்டில் ஒன்றை மட்டும் வெளிப்படையாக நிர்ணயிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் மற்றும் கவித்துவ இழுவிசையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
