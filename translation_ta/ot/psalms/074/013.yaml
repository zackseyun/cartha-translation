  register: நவீன தரநிலைத் தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பன்மை வினைமுற்றுகள் வைக்கப்பட்டுள்ளன. மூலத்தின் இணைவாக்கிய அமைப்பும் ‘கடல்/நீர்’ மற்றும் ‘பிளத்தல்/நொறுக்குதல்’ ஆகிய கவித்துவ ஒத்திசைவும் பாதுகாக்கப்பட்டுள்ளன.
