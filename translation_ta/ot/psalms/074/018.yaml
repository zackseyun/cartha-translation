review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Hebrew imperative, the singular/collective enemy, the parallel accusations, the divine name, and the second-person suffix in “your name.” The semantic range of נָבָל and נאץ is handled responsibly, with alternatives retained in notes.
  naturalness: “நினைவுகூரும்” is a traditional elevated imperative, but it is not the clearest modern-standard Tamil form. “நினைவில் கொள்ளுங்கள்” gives a natural respectful direct plea to God while preserving the imperative force. “மூட மக்கள்” is understandable, though “மதிகெட்ட மக்கள்” more naturally conveys the moral, not merely intellectual, force of נָבָל in this context.
  terminology: “யாவே” consistently renders יהוה as required. “உமது பெயர்” preserves the Hebrew expression without interpretive expansion. The revised wording retains “இகழ்ந்தார்கள்” as a suitably broad rendering of נאץ.
