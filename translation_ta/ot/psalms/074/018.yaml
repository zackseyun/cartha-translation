  yaml_path: translation/ot/psalms/074/018.yaml
  text: 'Remember this: the enemy has mocked Yahweh[c][b][a], and a foolish people have despised your name.'
translation:
  language: ta
  text: 'இதை நினைவில் கொள்ளுங்கள்: பகைவன் யாவேவைப் பழித்தான்[a]; மதிகெட்ட மக்கள்[b] உமது பெயரை இகழ்ந்தார்கள்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிந்தித்தான்” அல்லது “ஏளனம் செய்தான்.”
    reason: lexical_alternative
  - marker: b
    text: இங்கு “மதிகெட்ட” என்பது வெறும் அறிவுக் குறைவை அல்ல; அறநெறி மற்றும் ஆன்மிகச் சீர்கேட்டைக் குறிக்கிறது; சங்கீதம் 14:1-ஐ ஒப்பிடுக.
    reason: cross_reference
  - marker: c
    text: அல்லது, “உமது பெயரை அவமதித்தார்கள்”; “உமது பெயரைத் தூஷித்தார்கள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר זֹאת
  choice: இதை நினைவுகூரும்
  rationale: זְכָר என்பது கடவுளை நோக்கிய ஆண்பால் ஒருமை கட்டளை வடிவம். தமிழில் கடவுளிடம் செய்யப்படும் கண்ணியமான வேண்டுதலாக “நினைவுகூரும்” இயல்பாக அமைகிறது; זֹאת என்பதன் நேரடியான சுட்டுப்பொருளும் “இதை” என்பதில் காக்கப்படுகிறது.
- source_word: אוֹיֵב
  choice: பகைவன்
  rationale: எபிரெயச் சொல் ஒருமையில் இருந்தாலும் சூழலில் எதிரியைப் பொதுவாக அல்லது கூட்டாகக் குறிக்கலாம். அந்த எண்ணிக்கைக் குழப்பத்தைத் தீர்க்காமல் ஒருமை வடிவமே வைக்கப்பட்டுள்ளது.
- source_word: חֵרֵף
  choice: பழித்தான்
  rationale: חרף இகழ்ச்சியுடன் பழித்தல், நிந்தித்தல், ஏளனம் செய்தல் ஆகிய பொருள் வட்டத்தைக் கொண்டது. “பழித்தான்” என்பது நவீன தமிழில் இயல்பாக இருந்து, கடவுளுக்கு எதிரான அவமதிப்பான பேச்சின் வலிமையையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் வரும் கடவுளின் தனிப்பெயர் ஒரு பட்டப்பெயரால் மாற்றப்படாமல், தமிழில் பொதுவாகப் புரிந்துகொள்ளத்தக்க ஒலிபெயர்ப்பாக வழங்கப்பட்டுள்ளது.
- source_word: וְעַם נָבָל
  choice: மூட மக்கள்
  rationale: עַם என்பது கூட்டுப் பொருளில் “மக்கள்.” נָבָל வெறும் அறிவுக் குறைவைக் காட்டாமல் ஒழுக்க மற்றும் ஆன்மிகச் சீர்கேட்டையும் சுட்டக்கூடும். “மூட” அந்தச் சொற்பொருளைச் சுருக்கமாகக் காக்கிறது; அதன் நுணுக்கம் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- source_word: נִאֲצוּ
  choice: இகழ்ந்தார்கள்
  rationale: נאץ என்பது அவமதித்தல், வெறுத்து ஒதுக்குதல், தூஷித்தல் ஆகிய வலுவான பொருள்களைக் கொண்டது. “இகழ்ந்தார்கள்” பரந்த அடிப்படைப் பொருளைக் காக்கிறது; அதிக விளக்கமுள்ள மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: שְׁמֶךָ
  choice: உமது பெயரை
  rationale: “பெயர்” என்பது இங்கு அடையாளம், புகழ், வெளிப்படுத்தப்பட்ட இயல்பு ஆகியவற்றையும் உள்ளடக்கலாம். எனினும் மூலத்தின் உருவகத்தையும் நேரடி இறையியல் மொழியையும் காக்க “உமது பெயர்” வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது உரையின் உடன்படிக்கை சார்ந்த தனிப்பட்ட அழைப்பை காக்கிறது.
- issue: נָבָל என்பதிலுள்ள அற மற்றும் ஆன்மிக நுணுக்கம்
  choice: மூட
  alternative: மதிகெட்ட; இறைப்பற்றற்ற; கீழ்மையான
  rationale: இந்தச் சொல் அறிவுத்திறன் குறைவைக் காட்டிலும் அறநெறி மற்றும் இறைநிலை சார்ந்த மூடத்தனத்தைச் சுட்டுகிறது. ஆனால் “இறைப்பற்றற்ற” போன்ற சொற்கள் மூலத்தில் மறைமுகமாக உள்ளதை வெளிப்படையாகத் தீர்மானித்துவிடும்; ஆகவே அடிப்படைச் சொல் பிரதான உரையில் வைக்கப்பட்டு நுணுக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: கடவுளின் பெயரை இகழ்தல் என்பதன் வலிமை
  choice: உமது பெயரை இகழ்ந்தார்கள்
  alternative: உமது பெயரை அவமதித்தார்கள்; உமது பெயரைத் தூஷித்தார்கள்
  rationale: “தூஷித்தார்கள்” இறைநிந்தை என்ற குறிப்பிட்ட இறையியல் வகையைத் தெளிவாகக் கூறினாலும், נאץ பரந்த இகழ்ச்சி அல்லது அவமதிப்பையும் குறிக்கலாம். எனவே பிரதான உரை அந்தப் பரப்பைத் திறந்தவாறு வைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஜெபப் பாணி பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதை “நினைவுகூரும்,” “உமது” என்பவற்றால் வெளிப்படுகிறது. கவிதைச் சமநிலை அரைப்புள்ளியால் காக்கப்பட்டுள்ளது; பகைவன் என்ற ஒருமையும் மக்கள் என்ற கூட்டுப் பன்மையும் மூலத்துக்கு ஏற்ப விடப்பட்டுள்ளன.
