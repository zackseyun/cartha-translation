  - severity: low
    issue: “மூட மக்கள்” can suggest mere intellectual deficiency.
    rationale: נָבָל regularly conveys culpable moral folly. “மதிகெட்ட மக்கள்,” supported by the explanatory footnote, better conveys this while not imposing the stronger interpretation “godless.”
