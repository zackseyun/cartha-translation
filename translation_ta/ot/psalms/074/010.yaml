  text: עַד מָתַ֣י אֱ֭לֹהִים יְחָ֣רֶף צָ֑ר יְנָ֘אֵ֤ץ אוֹיֵ֖ב שִׁמְ/ךָ֣ לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/010.yaml
  text: How long[a], O God, will the foe reproach? Will the enemy revile your name forever?
translation:
  language: ta
  text: கடவுளே, இன்னும் எவ்வளவு காலம் எதிரி நிந்திப்பான்? பகைவன் உமது பெயரை என்றென்றும் அவமதிப்பானா?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பகைவன் உமது பெயரை என்றென்றும் தூஷிப்பானா?”
    reason: יְנָאֵץ என்பது அவமதித்தல் அல்லது இகழ்தல் என்றும், இச்சூழலில் கடவுளின் பெயரைத் தூஷித்தல் என்றும் பொருள்படலாம்.
lexical_decisions:
- source_word: עַד מָתַי
  choice: இன்னும் எவ்வளவு காலம்
  rationale: நீடித்த துயரைக் குறித்த புலம்பலின் கேள்வியை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: நேரடி அழைப்பையும் மன்றாட்டின் தொனியையும் இயல்பாகப் பேணுகிறது.
- source_word: יְחָרֶף
  choice: நிந்திப்பான்
  rationale: ஏளனத்தோடு பழித்தல் அல்லது தூற்றுதல் என்னும் பீயேல் வினையின் பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: צָר
  choice: எதிரி
  rationale: எதிர்த்து நிற்பவனைக் குறிக்கிறது; அடுத்த இணைவரியில் வரும் אוֹיֵב என்பதிலிருந்து சொல் வேறுபாட்டையும் பேணுகிறது.
- source_word: יְנָאֵץ
  choice: அவமதிப்பானா
  rationale: கடவுளின் பெயரை இகழ்ச்சியுடன் நடத்துதல் என்ற பொருளைப் பேணுகிறது; பிரதான உரையில் ‘தூஷித்தல்’ என்ற குறிப்பான இறையியல் சொல்லைத் திணிக்கவில்லை.
- source_word: אוֹיֵב
  choice: பகைவன்
  rationale: பொதுவான ‘enemy’ பொருளைத் தருவதோடு צָר என்பதற்கான ‘எதிரி’ என்பதிலிருந்து கவிதைநடைச் சொல் வேறுபாட்டைப் பேணுகிறது.
- source_word: שִׁמְךָ
  choice: உமது பெயரை
  rationale: கடவுளின் மதிப்பு, கனம், வெளிப்படுத்தப்பட்ட அடையாளம் ஆகியவற்றை உள்ளடக்கும் எபிரெயச் சொல்லாட்சியை நேரடியாகப் பேணுகிறது.
- source_word: לָנֶצַח
  choice: என்றென்றும்
  rationale: முடிவில்லாததுபோல் தோன்றும் அவமதிப்பைக் குறித்த சங்கீதக்காரரின் வேதனையை இயல்பான கவிதைநடையில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கடவுளின் ‘பெயருக்கு’ எதிரான அவமதிப்பை நேரடியாகக் கடவுளுக்கு எதிரான தூஷணமாக விளக்க வேண்டுமா
  choice: ‘உமது பெயரை’ என்ற மூல உருவகத்தைப் பிரதான உரையில் வைத்தல்
  alternative: ‘உம்மை என்றென்றும் தூஷிப்பானா?’
  rationale: எபிரெய உரை வெளிப்படையாக ‘உமது பெயர்’ என்கிறது. கடவுளின் கனம் மற்றும் வெளிப்படுத்தப்பட்ட அடையாளம் சார்ந்த இறையியல் ஆழத்தை விளக்கவுரையால் குறுக்காமல் இது பேணுகிறது.
- issue: יְנָאֵץ என்பதைக் ‘அவமதித்தல்’ எனவா ‘தூஷித்தல்’ எனவா மொழிபெயர்ப்பது
  choice: பிரதான உரையில் ‘அவமதிப்பானா’; அடிக்குறிப்பில் ‘தூஷிப்பானா’
  alternative: பிரதான உரையிலேயே ‘தூஷிப்பானா’
  rationale: இந்த வினை இகழ்தல், அவமதித்தல் என்ற பரந்த பொருளையும், கடவுளின் பெயரை நோக்கிய சூழலில் தூஷித்தல் என்ற குறிப்பான நுட்பத்தையும் கொண்டிருக்கலாம்; அடிக்குறிப்பு அந்த உண்மையான பொருள் வாய்ப்பைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்பது மரியாதையையும் வழிபாட்டு மொழியின் இயல்பையும் பேணுகிறது; ‘எதிரி/பகைவன்’ என்ற இணைச்சொற்கள் எபிரெயக் கவிதையின் ஒத்த பொருள் கொண்ட சொல் வேறுபாட்டை வெளிப்படுத்துகின்றன. அடிக்குறிப்பு குறியீடு தொடர்புடைய இரண்டாவது கேள்வியின் முடிவில் இடப்பட்டுள்ளது.
