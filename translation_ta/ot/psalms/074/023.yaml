  yaml_path: translation/ot/psalms/074/023.yaml
  text: Do not forget the voice of your enemies[a], the uproar of those who rise against you[b], which goes up continually.
translation:
  language: ta
  text: உம்முடைய பகைவர்களின் குரலை மறந்துவிடாதீர்[a]; உமக்கு எதிராக எழுகிறவர்களின் ஆரவாரம் இடைவிடாமல் மேலெழுகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “குரல்” என்பதற்குப் பதிலாக “ஒலி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் குரலையோ பொதுவான ஒலி அல்லது சத்தத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் இக்கூற்று சுருக்கமாக உள்ளது. இதை, “உமக்கு எதிராக எழுகிறவர்களின் இடைவிடாமல் மேலெழும் ஆரவாரம்” என்றும் அமைக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁכַּח
  choice: மறந்துவிடாதேயும்
  rationale: எதிர்மறை வேண்டுதலாக அமைந்த எபிரெயச் சொற்றொடரின் நேரடிப் பொருளைத் தக்கவைத்து, தேவனை நோக்கிய விண்ணப்பத்திற்கு ஏற்ற மரியாதை வினைமுற்று பயன்படுத்தப்பட்டது.
- source_word: קוֹל
  choice: குரல்
  rationale: קוֹל என்பதன் முதன்மைப் பொருள் ‘குரல்’; சூழலில் ‘ஒலி’ என்றும் கொள்ள முடிவதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צֹרְרֶיךָ
  choice: உம்முடைய பகைவர்கள்
  rationale: எதிர்ப்பவர்களைச் சுட்டும் பன்மை வடிவத்தை இயல்பான நவீனத் தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: שְׁאוֹן
  choice: ஆரவாரம்
  rationale: உரத்த, குழப்பமான பகைமைச் சத்தத்தைக் குறிக்கும் சொல்லுக்கு இயல்பான தமிழ்ச் சொல்; ‘கொந்தளிப்பு’ என்ற நுணுக்கமும் சாத்தியம்.
- source_word: קָמֶיךָ
  choice: உமக்கு எதிராக எழுகிறவர்கள்
  rationale: קום என்ற வேரின் ‘எழுதல்’ உருவகத்தையும் எதிர்ப்பின் பொருளையும் தக்கவைக்கிறது.
- source_word: עֹלֶה
  choice: மேலெழுகிறது
  rationale: ‘மேலே செல்கிறது/எழுகிறது’ என்ற எபிரெய உருவகத்தைத் தமிழில் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
- source_word: תָמִיד
  choice: இடைவிடாமல்
  rationale: தொடர்ந்து நிகழ்வதை நவீனத் தமிழில் தெளிவாகக் குறிக்கிறது.
