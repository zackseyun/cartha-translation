  text: לְ/ךָ֣ י֭וֹם אַף לְ/ךָ֥ לָ֑יְלָה אַתָּ֥ה הֲ֝כִינ֗וֹתָ מָא֥וֹר וָ/שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/016.yaml
  text: The day is yours; the night also is yours[a]. You established the light and the sun.
translation:
  language: ta
  text: பகல் உமக்குரியது; இரவும் உமக்குரியது. ஒளியையும்[a] சூரியனையும் நீரே நிலைநிறுத்தினீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒளி’ என்பதற்குப் பதிலாக ‘ஒளி தரும் விண்பொருள்’ என்றும் மொழிபெயர்க்கலாம். பகல்–இரவு இணை அமைப்பினால் சிலர் இதைச் சந்திரனைக் குறிப்பதாகப் புரிந்துகொள்கிறார்கள்; ஆனால் எபிரெய் மூலத்தில் ‘சந்திரன்’ என்று வெளிப்படையாக இல்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: உமக்குரியது
  rationale: לְ־ உடன் இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு இங்கு உடைமையைச் சுட்டுகிறது. ‘உமக்குரியது’ என்பது வலியுறுத்தப்பட்ட உடைமைப் பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: יוֹם
  choice: பகல்
  rationale: ‘இரவு’ என்பதற்கு எதிரிணையாக இங்கு יוֹם என்பது பகற்பொழுதைக் குறிக்கிறது; அதனால் ‘பகல்’ துல்லியமான தேர்வு.
- source_word: אַף
  choice: -வும்
  rationale: אַף இரண்டாம் கூற்றைச் சேர்த்து வலியுறுத்துகிறது. தமிழில் ‘இரவும்’ என்ற இணைப்பு ‘பகல் மட்டுமல்ல, இரவும்’ என்ற பொருளை இயல்பாகத் தருகிறது.
- source_word: לָיְלָה
  choice: இரவு
  rationale: ‘பகல்’ என்பதற்கு எதிரிணையான வழக்கமான பொருள்.
- source_word: אַתָּה
  choice: நீரே
  rationale: எபிரெயில் வெளிப்படையாக வரும் இரண்டாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலை, தமிழில் மரியாதை ஒருமையுடன் ‘நீரே’ எனத் தக்கவைக்கிறது.
- source_word: הֲכִינוֹתָ
  choice: நிலைநிறுத்தியவர்
  rationale: Hiphil வடிவம் ஒன்றை உறுதியாக அமைத்தல் அல்லது நிலைபெறச் செய்தல் என்ற கருத்தைக் கொண்டது. படைப்பின் ஒழுங்கமைப்புச் சூழலில் ‘நிலைநிறுத்தியவர்’ இயல்பாகவும் வலிமையாகவும் உள்ளது.
- source_word: מָאוֹר
  choice: ஒளி
  rationale: מָאוֹר என்பது ஒளியையோ ஒளி தரும் விண்பொருளையோ குறிக்கலாம். அடுத்து சூரியன் தனியே குறிப்பிடப்படுவதால், ‘ஒளி’ என்பது எபிரெயின் சொல்லளவை மீறாமல் இயல்பாக அமைகிறது.
- source_word: וָשָׁמֶשׁ
  choice: சூரியனையும்
  rationale: இணைப்புச் சொல்லுடன் வரும் שֶׁמֶשׁ என்பதன் நேரடியான, இயல்பான தமிழாக்கம்.
theological_decisions:
- issue: מָאוֹר என்பதற்கும் שֶׁמֶשׁ என்பதற்கும் இடையிலான உறவு
  choice: מָאוֹר என்பதை ‘ஒளி’ என்றும், שֶׁמֶשׁ என்பதை ‘சூரியன்’ என்றும் வேறுபடுத்தி மொழிபெயர்த்தல்.
  alternative: பகல்–இரவு இணை அமைப்பின் அடிப்படையில் מָאוֹר என்பதை ‘சந்திரன்’ என்று பொருள்கொள்ளுதல்; அல்லது ‘ஒளி தரும் விண்பொருள்’ என்று மொழிபெயர்த்தல்.
  rationale: எபிரெய் மூலத்தில் ‘சந்திரன்’ என்று வெளிப்படையாக இல்லை. ‘ஒளி’ என்பது மூலத்தின் சொற்பொருள் வாய்ப்பையும் கவித்துவத் தெளிவின்மையையும் காக்கிறது; சூழலால் ஊகிக்கப்படும் சந்திரனை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமக்கு’, ‘நீரே’ பயன்படுத்தப்பட்டுள்ளன. உடைமை வலியுறுத்தலைப் பாதுகாக்க முதல் இரு கூறுகளிலும் ‘உமக்குரியது’ மீண்டும் வருகிறது.
