  rationale: எதிரிகள் தங்களுக்குள் கொண்ட தீர்மானத்தை அறிமுகப்படுத்தும் இறந்தகால வினை; அடுத்துள்ள ‘தங்கள் உள்ளத்தில்’ என்பதோடு இயல்பாகப் பொருந்துகிறது.
