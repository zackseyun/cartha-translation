- source_word: כָּל
  choice: எல்லாம்
  rationale: முழுமையைக் குறிக்கும் எபிரேயச் சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: מוֹעֲדֵי אֵל
  choice: கடவுளின் கூடுகை இடங்கள்
  rationale: מוֹעֵד என்பது நியமிக்கப்பட்ட காலத்தையோ இடத்தையோ குறிக்கலாம். ‘தீக்கிரையாக்கினார்கள்’ மற்றும் ‘நாட்டில்’ என்பதால் இங்கு மக்கள் கடவுளை வழிபடக் கூடும் இடங்கள் என்ற இடப்பொருள் அதிகம் பொருந்துகிறது; பிற்கால ‘ஜெப ஆலயங்கள்’ என்ற நிறுவனப் பெயரைத் திணிப்பதில்லை.
- source_word: בָּאָרֶץ
  choice: நாட்டிலுள்ள
  rationale: சூழலில் முழு பூமியைவிட இஸ்ரவேல் நாட்டைக் குறிக்கும் வாய்ப்பு அதிகம்; தமிழில் இடத்தொடர்பை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: מוֹעֲדֵי אֵל என்பதன் பொருள்
  choice: கடவுளுக்குரிய கூடுகை இடங்கள்
  alternative: கடவுளின் நியமிக்கப்பட்ட இடங்கள் அல்லது காலங்கள்; பாரம்பரியமாக, கடவுளின் ஜெப ஆலயங்கள்
  rationale: எரிக்கப்படக்கூடியவையாகவும் நாட்டில் அமைந்தவையாகவும் கூறப்படுவதால் இடப்பொருள் முன்னுரிமை பெறுகிறது. ஆயினும் எபிரேயச் சொல்லின் காலம்/இடம் சார்ந்த இருபொருள் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: נִינָם என்ற கடினமான வடிவத்தின் பொருள்
  choice: ‘அவர்களை அழித்துவிடுவோம்’ என்ற பகைமைத் தீர்மானம்
  alternative: ‘அவர்களை ஒடுக்கிவிடுவோம்’ அல்லது ‘அவர்களை அடக்கிவிடுவோம்’; வேறுபட்ட தொடரியல் கொண்ட பெயர்ச்சொல் வாசிப்பு
  rationale: சொல்லின் துல்லியமான பொருள் உறுதியற்றது. சங்கீதத்தின் உடனடி சூழல் முழுமையான அழிப்பு நோக்கத்தை ஆதரிக்கிறது; நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாகத் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கடவுள்’ என்பது பொதுவாகப் புரியும், பிரிவுசார் சாய்வற்ற சொல். ‘ஒரேயடியாக’ என்பது יחד என்பதின் மொத்த அழிப்பு வலிமையை இயல்பாக வெளிப்படுத்துகிறது; அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின்பே வைக்கப்பட்டுள்ளன.
