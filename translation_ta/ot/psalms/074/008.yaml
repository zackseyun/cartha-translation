  rationale: உள்ளார்ந்த பேச்சையும் நோக்கத்தையும் குறிக்கும் எபிரேய மரபுத்தொடரின் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: נִינָם
  choice: அவர்களை ... அழித்துவிடுவோம்
  rationale: இச்சொல் வடிவம் அரிதும் பொருள் உறுதியற்றதுமாகும். சூழலில் வெளிப்படும் முழுமையான அழிப்பு நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: יָחַד
  choice: ஒரேயடியாக
  rationale: இங்கு பகைவர்களின் ஒட்டுமொத்தமான, முழுமையான அழிப்பு நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׂרְפוּ
  choice: தீக்கிரையாக்கினார்கள்
