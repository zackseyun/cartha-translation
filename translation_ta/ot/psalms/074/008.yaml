base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/008.yaml
  text: They said in their hearts[b][a], “Let us destroy them all together.” They burned all the meeting places of God in the land.
translation:
  language: ta
  text: அவர்கள் தங்கள் உள்ளத்தில், “அவர்களை அனைவரையும் ஒன்றாக அழித்துவிடுவோம்[a]” என்று சொன்னார்கள். நாட்டிலுள்ள கடவுளுக்கான கூடுமிடங்கள் அனைத்தையும்[b] அவர்கள் எரித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழித்துவிடுவோம்’ என்று மொழிபெயர்க்கப்பட்டுள்ள נִינָם என்ற எபிரேயச் சொல் புரிந்துகொள்ளக் கடினமானது; ‘ஒடுக்கிவிடுவோம்,’ ‘அடக்கிவிடுவோம்’ அல்லது அழிக்கும் நோக்கத்தை வெளிப்படுத்தும் வேறொரு பொருள் இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கடவுளின் நியமிக்கப்பட்ட இடங்களையெல்லாம்.’ சில பாரம்பரிய மொழிபெயர்ப்புகளில், ‘கடவுளின் ஜெப ஆலயங்களையெல்லாம்.’
    reason: alternative_reading
