base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/022.yaml
  text: Rise up[a], O God; plead your case[b]. Remember your reproach from the fool all day long.
translation:
  language: ta
  text: எழுந்தருளும், கடவுளே; உமது வழக்கை நீரே வாதாடும்.[a] நாள் முழுவதும் மூடனிடமிருந்து[b] வரும் உமது இகழ்ச்சியை[c] நினைவுகூரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வழக்கு” மற்றும் “வாதாடும்” என்பவை சட்டத் தகராறு சார்ந்த சொற்கள்; கடவுள் தமது தரப்பை நிலைநாட்ட வேண்டும் என்பதே வேண்டுகோள்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “மூடன்” என்பது வெறும் அறிவுத்திறன் குறைந்தவரை அல்ல, ஒழுக்கக்கேடும் இறைமறுப்பும் கொண்டவரைக் குறிக்கிறது.
    reason: cultural_note
  - marker: c
    text: “உமது இகழ்ச்சி” என்பது முதன்மையாகக் கடவுளுக்கு எதிரான இகழ்ச்சியைக் குறிக்கலாம்; கடவுளுடைய மக்களுக்கு நேர்ந்த இகழ்ச்சியை அவருக்குரியதாகக் குறிப்பிடும் பொருளும் சூழலில் சாத்தியம்.
    reason: theological_ambiguity
lexical_decisions:
- source_word: קוּמָה
  choice: எழுந்தருளும்
  rationale: קום என்பதன் வலியுறுத்தலுள்ள கட்டளை வடிவம்; கடவுள் செயல்பட வேண்டும் என்ற அவசர வேண்டுகோளை, இயல்பான மரியாதைமிக்க தமிழ் இறைவேண்டல் நடையில் தருகிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: நேரடி விளிப்பைத் தெளிவாகவும் நவீன பொதுத்தமிழில் இயல்பாகவும் தருகிறது.
- source_word: רִיבָה רִיבֶךָ
  choice: உமது வழக்கிற்காக நீரே வாதாடும்
  rationale: வினையும் பெயர்ச்சொல்லும் சட்டத் தகராறு அல்லது நீதிமன்ற வழக்கு சார்ந்த மொழியைச் சேர்ந்தவை. இந்த மொழிபெயர்ப்பு அந்தச் சட்ட உருவகத்தைப் பாதுகாத்து, கடவுள் தமது தரப்பை நிலைநாட்ட வேண்டும் என்ற வேண்டுகோளைத் தெளிவாக்குகிறது.
- source_word: זְכֹר
  choice: நினைவுகூரும்
  rationale: மூலத்தின் கட்டளையை நேரடியாகப் பாதுகாக்கிறது; இங்கு நினைவுகூருதல் என்பது கவனத்தில் கொண்டு செயல்படுவதையும் உட்குறிக்கலாம், ஆனால் அந்தப் பொருள் உரையில் விரிவாக்கப்படவில்லை.
- source_word: חֶרְפָּתְךָ
  choice: உமது நிந்தையை
  rationale: சொல்லின் உடைமை வடிவத்தைப் பாதுகாப்பதால், கடவுளுக்கு எதிராகச் சொல்லப்படும் நிந்தை என்ற முதன்மைப் பொருளோடு, அவருடைய மக்களுக்கு நேர்ந்த நிந்தை அவருக்குரியதாகக் கருதப்படும் சாத்தியமும் திறந்தே இருக்கிறது.
- source_word: מִנִּי
  choice: இடமிருந்து வரும்
  rationale: நிந்தையின் மூலத்தை அல்லது தோற்றுவிப்பவரைக் குறிக்கும் מן முன்னிடைச்சொல்லின் செயல்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: נָבָל
  choice: அறிவிலி
  rationale: சங்கீதப் பயன்பாட்டில் இது வெறும் அறிவுத்திறன் குறைவைக் காட்டாமல், ஒழுக்கக்கேடும் இறைமறுப்பும் கொண்டவரைக் குறிக்கிறது. சுருக்கமான வேதாகம வகைப்பாட்டைத் தக்கவைத்து, அடிக்குறிப்பில் அதன் நெறிசார் பொருள் விளக்கப்படுகிறது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: தொடர்ந்து அல்லது நாள் நெடுக நிகழ்வதை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: “உமது நிந்தை” என்பதன் குறிப்பு
  choice: உடைமை வடிவத்தைப் பாதுகாத்து, நிந்தை கடவுளுக்கு எதிராக வருவதை முதன்மையாக உணர்த்துதல்
  alternative: கடவுளுடைய மக்களுக்கு நேர்ந்த நிந்தையை அவர் தம்முடையதாக ஏற்றுக்கொள்வது
  rationale: பின்னொட்டு நேரடியாகக் கடவுளைக் குறிக்கிறது; “உமது வழக்கு” என்ற முந்தைய சொற்றொடரும் இதை ஆதரிக்கிறது. எனினும் சங்கீதத்தின் விரிந்த சூழலில் மக்களும் பரிசுத்த இடமும் நிந்திக்கப்படுவதால், உடன்படிக்கை சார்ந்த அடையாளப்படுத்தலுக்கான சாத்தியத்தை மொழிபெயர்ப்பு மூடவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதைமிக்க இறைவேண்டல் நடை பயன்படுத்தப்பட்டுள்ளது. “நீர்/உமது” வடிவங்கள் கண்ணியத்தைப் பேணுகின்றன; சட்ட உருவகமும் மூலத்தின் உடைமைச் சொல்லாட்சியில் உள்ள பொருள் நெருக்கடியும் காக்கப்பட்டுள்ளன.
