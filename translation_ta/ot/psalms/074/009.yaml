lexical_decisions:
- source_word: אֹתֹתֵינוּ
  choice: எங்கள் அடையாளங்கள்
  rationale: אוֹת என்பதன் பொதுவான பொருள் ‘அடையாளம்’ அல்லது ‘குறி’. இங்கு அது கொடிகள், வழிபாட்டுச் சின்னங்கள், அல்லது கடவுளின் ஆதரவைக் காட்டும் அடையாளங்கள் ஆகியவற்றில் எதைக் குறிக்கிறது என்பது வெளிப்படையாக இல்லை; ஆகவே பரந்த பொருளைத் தக்கவைக்கும் ‘அடையாளங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לֹא רָאִינוּ
  choice: நாங்கள் காணவில்லை
  rationale: எபிரெய நிறைவுவினை புலம்பலின் சூழலில் தற்போது தொடரும் இல்லாமையைக் குறிக்கலாம். ‘காணவில்லை’ என்பது கடந்தகாலத்திலிருந்து தற்போதுவரை நிலவும் அனுபவத்தையும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: אֵין עוֹד
  choice: இனி ... இல்லை
  rationale: முன்பு இருந்த ஒன்று இப்போது இல்லாமல் போனதையும் அதன் இல்லாமை தொடர்வதையும் இச்சொற்றொடர் உணர்த்துகிறது.
- source_word: נָבִיא
  choice: தீர்க்கதரிசி
  rationale: נָבִיא என்பதற்கான வழக்கமான வேதாகமத் தமிழ்ச் சொல். ஒருமை இங்கு பொதுப்பொருளில் வந்து, தீர்க்கதரிசி எவருமே இல்லை என்பதைக் குறிக்கிறது.
- source_word: וְלֹא אִתָּנוּ יֹדֵעַ
  choice: எங்களில் ஒருவருக்கும் தெரியாது
  rationale: எங்களோடு இருப்பவர்களில் அறிந்தவர் யாரும் இல்லை என்ற சுருக்கமான எபிரெய அமைப்பை இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: עַד מָה
  choice: எவ்வளவு காலம்
  rationale: புலம்பல் சூழலில் இது காலநீளத்தைக் கேட்கும் வழக்குச் சொற்றொடர். தமிழில் ‘எவ்வளவு காலம்’ என்பது அதற்கு இயல்பான இணை.
theological_decisions:
- issue: ‘எங்கள் அடையாளங்கள்’ என்பதன் குறிப்பு
  choice: குறிப்பிட்ட வரலாற்று அல்லது வழிபாட்டுப் பொருளைச் சேர்க்காமல் ‘எங்கள் அடையாளங்கள்’ என்று பரந்ததாக வைக்கப்பட்டது.
  alternative: எங்கள் கொடிகள்; எங்களிடையே கடவுள் இருப்பதற்கான அடையாளங்கள்
  rationale: அடையாளங்கள் எவை என்பதை எபிரெய உரை வெளிப்படையாகக் கூறவில்லை. பரந்த சொல்லைத் தக்கவைப்பது உரையின் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: עַד מָה என்பதன் மறைமுகப் பொருள்
  choice: ‘இது எவ்வளவு காலம் நீடிக்கும்’ என்று, தொடரும் நிலையின் காலஅளவைக் குறிக்கும் விதத்தில் மொழிபெயர்க்கப்பட்டது.
  alternative: எதுவரை; எப்போது வரை
  rationale: எபிரெயத்தில் வினை வெளிப்படையாக இல்லாவிட்டாலும், இங்கு எவ்வளவு காலம் இந்த நிலை தொடரும் என்பதே சூழல்சார்ந்த கேள்வி. தமிழில் தனியாக ‘எவ்வளவு காலம்’ என்பது முழுமையற்றதாக ஒலிப்பதால், ‘இது ... நீடிக்கும்’ என்று குறைந்த அளவு வெளிப்படுத்தப்பட்டது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான புலம்பல் நடையில் வடிவமைக்கப்பட்டது. ‘தீர்க்கதரிசி’ என்ற நிலைபெற்ற வேதாகமச் சொல் தக்கவைக்கப்பட்டது; உரையின் குறிப்பற்ற தன்மை விளக்கத்தால் நிரப்பப்படவில்லை.
