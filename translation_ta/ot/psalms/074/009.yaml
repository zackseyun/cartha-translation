  text: We do not see our signs; there is no longer any prophet[a], and none among us knows how long.
translation:
  language: ta
  text: எங்கள் அடையாளங்களை நாங்கள் காணவில்லை; இனி ஒரு தீர்க்கதரிசியும் இல்லை; எவ்வளவு காலம் என்று எங்களில் யாருக்கும் தெரியாது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எங்கள் கொடிகள்’ அல்லது ‘எங்கள் குறிகள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் காணக்கூடிய அடையாளங்களையோ சின்னங்களையோ குறிக்கலாம்; இங்கு துல்லியமாக எதைக் குறிக்கிறது என்பது வெளிப்படையாக இல்லை.
