review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative addressed to God, the enduring devastation, and the enemy's comprehensive destruction within the holy place. However, காலடிகள் normally denotes footsteps/footprints in Tamil and is not naturally something one 'lifts'; the Hebrew image is better represented by பாதங்கள் (‘feet’).
  naturalness: The sentence is otherwise clear and suitably elevated for a psalm. Replacing காலடிகளை with பாதங்களை preserves the concrete poetic image while making the Tamil collocation natural.
  terminology: பரிசுத்த இடம் suitably renders בַּקֹּדֶשׁ without prematurely specifying the entire temple. பகைவன் and பாழாக்கிவிட்டான் are appropriate and do not add interpretive detail.
  issues:
  - severity: medium
    issue: ‘உமது காலடிகளை உயர்த்தும்’ is an unnatural Tamil collocation.
    rationale: காலடி ordinarily means a step, footfall, or footprint; Tamil speakers do not normally ‘lift’ footsteps. The Hebrew פְעָמֶיךָ permits the closely related and natural Tamil expression ‘உமது பாதங்களை,’ retaining the anthropomorphic movement image.
  revised_text: நீடித்த பாழிடங்களை நோக்கி உமது பாதங்களை உயர்த்தும்[a]; பரிசுத்த இடத்தில் பகைவன் அனைத்தையும் பாழாக்கிவிட்டான்.
