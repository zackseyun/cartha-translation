revisions:
- from: நீடித்த பாழிடங்களை நோக்கி உமது காலடிகளை உயர்த்தும்[a]; பரிசுத்த இடத்தில் பகைவன் அனைத்தையும் பாழாக்கிவிட்டான்.
  to: நீடித்த பாழிடங்களை நோக்கி உமது பாதங்களை உயர்த்தும்[a]; பரிசுத்த இடத்தில் பகைவன் அனைத்தையும் பாழாக்கிவிட்டான்.
  rationale: பாதங்கள் replaces காலடிகள் because it is the natural object of உயர்த்தும் in Tamil. This small revision preserves the Hebrew’s vivid appeal for God to advance toward the enduring ruins, without paraphrasing it as ‘come’ or adding a claim about speed.
