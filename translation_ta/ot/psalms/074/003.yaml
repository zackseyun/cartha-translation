lexical_decisions:
- source_word: הָרִימָה
  choice: உயர்த்தும்
  rationale: רוּם வினையின் கட்டளை வடிவம்; தேவனை நோக்கிய மரியாதைப் பன்மை வினைமுற்றாக அமைத்து, ‘வரும்’ என விளக்கவுரை செய்யாமல் எபிரெய உருவகத்தைத் தக்கவைக்கிறது.
- source_word: פְעָמֶיךָ
  choice: உமது காலடிகளை
  rationale: פעם இங்கு கால் அல்லது காலடி என்ற பொருளில் வருகிறது. ‘காலடிகள்’ தேவன் பாழடைந்த இடத்தை நோக்கி முன்னேறும் உயிரோட்டமான உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: לְמַשֻּׁאוֹת נֶצַח
  choice: நீடித்த பாழிடங்களை நோக்கி
  rationale: מַשֻּׁאוֹת அழிவால் உண்டான பாழிடங்களைக் குறிக்கிறது; נֶצַח அவற்றின் தொடர்ந்துநிற்கும் நிலையைச் சுட்டுகிறது. ‘நோக்கி’ இலக்கைத் தெளிவாக்குகிறது.
- source_word: כָּל
  choice: அனைத்தையும்
  rationale: பகைவன் செய்த அழிவின் முழுமையான பரப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הֵרַע
  choice: பாழாக்கிவிட்டான்
  rationale: רעע என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் தீங்கு செய்து அழித்தல் அல்லது பாழாக்குதல் என்று பொருள்படும்; நிறைவுற்ற கடுமையான சேதத்தை இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: אוֹיֵב
  choice: பகைவன்
  rationale: ஒருமை வடிவத்தைத் தக்கவைத்து, இஸ்ரவேலின் எதிரியைத் தனிப்பட்டோ கூட்டாகவோ குறிக்கக்கூடிய மூலத்தின் நெகிழ்வை பாதுகாக்கிறது.
- source_word: בַּקֹּדֶשׁ
  choice: பரிசுத்த இடத்தில்
  rationale: קֹדֶשׁ ஆலயத்தின் புனிதப் பகுதியைக் குறிக்கலாம். ‘பரிசுத்த இடம்’ என்பது ‘பரிசுத்த ஸ்தலம்’ என்பதைவிட இன்றைய பொதுவாசகருக்கு இயல்பாகவும், ‘ஆலயம்’ என்று குறிப்பைச் சுருக்காமல் விரிவைத் தக்கவைத்தும் உள்ளது.
theological_decisions:
- issue: தொடக்கக் கட்டளையில் தேவனை மனித இயக்க உருவகத்துடன் அழைத்தல்
  choice: ‘உமது காலடிகளை உயர்த்தும்’ என்ற நேரடியான உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘வாரும்’ அல்லது ‘விரைந்து வாரும்’
  rationale: மூலத்தின் கவித்துவமான, மனித இயக்கத்தை ஒத்த வேண்டுதலை விளக்கவுரையால் கரைக்காமல் பாதுகாக்கிறது; வேகம் போன்ற மூலத்தில் வெளிப்படாத கருத்தும் சேர்க்கப்படவில்லை.
- issue: נֶצַח என்பதன் காலநீட்சி
  choice: ‘நீடித்த’
  alternative: ‘என்றென்றைக்குமான’
  rationale: இங்கு நித்தியத்தைக் குறித்த தத்துவக் கூற்றாக மட்டுமே வாசிக்காமல், நீண்டகாலமாகத் தொடரும் பாழ்நிலையையும் குறிக்கக்கூடிய எபிரெயச் சொல்லின் சூழல்சார் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ‘உமது’ மற்றும் மரியாதைக் கட்டளை ‘உயர்த்தும்’ தக்கவைக்கப்பட்டுள்ளன; அரிதான சமயச் சொற்களைத் தவிர்த்து, மூலத்தின் செறிவான உருவகம் பாதுகாக்கப்பட்டுள்ளது.
