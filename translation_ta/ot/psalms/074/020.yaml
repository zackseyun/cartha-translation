source:
  edition: WLC
  text: הַבֵּ֥ט לַ/בְּרִ֑ית כִּ֥י מָלְא֥וּ מַחֲשַׁכֵּי אֶ֝֗רֶץ נְא֣וֹת חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/020.yaml
  text: Look to the covenant[c][b][a], for the dark places of the land are full of haunts of violence.
translation:
  language: ta
  text: உடன்படிக்கையை[a] நோக்கிப் பாரும்; ஏனெனில் நாட்டின்[b] இருண்ட இடங்கள் வன்முறையின் உறைவிடங்களால்[c] நிறைந்துள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது உடன்படிக்கையை.’ எபிரெய உரையில் ‘உடன்படிக்கையை’ என்றே உள்ளது; சூழலில் அது கடவுள் தம் மக்களுடன் செய்த உடன்படிக்கையைக் குறிக்கிறது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘பூமியின்.’ எபிரெயச் சொல் சூழலுக்கு ஏற்ப ‘நாடு’ அல்லது ‘பூமி’ எனப் பொருள்படும்.
    reason: lexical_alternative
  - marker: c
    text: ‘வன்முறையின் வாழிடங்களால்’ அல்லது ‘வன்முறை குடிகொண்ட இடங்களால்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט
  choice: நோக்கிப் பாரும்
  rationale: இது கடவுள் தம் கவனத்தை உடன்படிக்கையின்மேல் திருப்ப வேண்டும் என்ற மன்றாட்டை வெளிப்படுத்தும் கட்டளை வடிவம். தமிழில் வேண்டுதல் நிறைந்த, கண்ணியமான நடையைத் தருகிறது.
- source_word: לַבְּרִית
  choice: உடன்படிக்கையை
  rationale: எபிரெய உரையில் குறிப்பிட்ட உடன்படிக்கை சுட்டப்படுகிறது; உடைமைப் பெயரடை வெளிப்படையாக இல்லை. ஆகவே ‘உமது’ என்பதை முதன்மை உரையில் சேர்க்காமல் மூலத்தின் வடிவம் காக்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய மன்றாட்டிற்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச்சொல்.
- source_word: מָלְאוּ
  choice: நிறைந்துள்ளன
  rationale: நிரம்பியதன் விளைவாகத் தற்போது நிலவும் நிலையைக் காட்டும் எபிரெய வினை வடிவத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מַחֲשַׁכֵּי אֶרֶץ
  choice: நாட்டின் இருண்ட இடங்கள்
  rationale: சொற்றொடரின் நேரடியான பொருள் ‘நாடு/பூமியின் இருண்ட இடங்கள்.’ சங்கீதத்தின் தேச அழிவுச் சூழலில் ‘நாடு’ பொருத்தமாக உள்ளது; ‘இருண்ட இடங்கள்’ என்ற இடஞ்சார்ந்த படிமமும் காக்கப்படுகிறது.
- source_word: נְאוֹת
  choice: உறைவிடங்கள்
  rationale: இந்தப் பெயர்ச்சொல் மேய்ச்சல் நிலங்களையோ வாழிடங்களையோ குறிக்கலாம். ‘வன்முறை’ என்பதுடன் வரும் இச்சூழலில், வன்முறையால் அடையாளப்படுத்தப்படும் இடங்கள் என்ற இடஞ்சார்ந்த பொருளை ‘உறைவிடங்கள்’ காக்கிறது.
- source_word: חָמָס
  choice: வன்முறை
  rationale: இச்சொல் வன்முறையையும் வன்முறையான அநீதியையும் குறிக்கும்; இங்கு ‘வன்முறை’ நேரடியான, இயல்பான இணைச்சொல்.
theological_decisions:
- issue: உடன்படிக்கையை வெளிப்படையாகக் கடவுளுடையது என்று குறிப்பிட வேண்டுமா
  choice: உடன்படிக்கை
  alternative: உமது உடன்படிக்கை
  rationale: சூழலில் இது கடவுள் தம் மக்களுடன் செய்த உடன்படிக்கையைக் குறித்தாலும், எபிரெய உரையில் ‘உமது’ என்ற உடைமை விகுதி இல்லை. எனவே மூலத்திலுள்ள தெளிவின்மையை முதன்மை உரை காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத மன்றாட்டிற்கு ஏற்ற கண்ணியமான நடையாக அமைக்கப்பட்டுள்ளது. கடவுளை நோக்கிய கட்டளையில் மரியாதைத் தொனியுடைய ‘பாரும்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் ‘உடன்படிக்கை,’ ‘இருண்ட இடங்கள்,’ ‘உறைவிடங்கள்’ ஆகிய திடமான படிமங்கள் தேவையற்ற விளக்கமின்றிக் காக்கப்பட்டுள்ளன.
