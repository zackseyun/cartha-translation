revisions:
- from: மரப்புதரில் கோடரிகளை மேலே ஓங்குகிற ஒருவனைப்போல் அவன் அறியப்பட்டான்.[a]
  to: மரங்கள் அடர்ந்த புதரில் கோடரிகளை மேல்நோக்கி உயர்த்தும் ஒருவனைப்போல் அவன் அறியப்பட்டான்.[a]
  rationale: This revision improves modern Tamil idiom while preserving the Hebrew’s compact and syntactically difficult comparison. It retains the masculine-singular passive (“அவன் அறியப்பட்டான்”), the upward element, the wooded-thicket setting, and the plural chopping tools. The footnote continues to signal the formal alternative without resolving the source’s ambiguity beyond what the text supports.
  reviewer_model: gpt-5.6-terra
