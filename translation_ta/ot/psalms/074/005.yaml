lexical_decisions:
- source_word: יִוָּדַע
  choice: அவன் அறியப்பட்டான்
  rationale: ידע என்பதன் நிஃபால், மூன்றாம் ஆண்பால் ஒருமை வடிவம். கவிதைச் சூழலில் கடந்தகால விவரிப்பாக இருப்பதால், ஆண்பால் ஒருமையைத் தக்கவைத்து இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: כְּמֵבִיא
  choice: ஓங்குகிற ஒருவனைப்போல்
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது; בוא என்பதன் ஹிஃபில் வினையெச்சம் ‘மேலே கொண்டுவருகிற’ என்ற அடிப்படை எண்ணத்தைக் கொண்டது. கோடரியைப் பயன்படுத்தும் காட்சியில் ‘ஓங்குகிற’ என்பது இயல்பான தமிழ்.
- source_word: לְמָעְלָה
  choice: மேலே
  rationale: மேல்நோக்கிய இயக்கத்தை நேரடியாகக் குறிக்கும் வினையடை.
- source_word: בִּסֲבָךְ
  choice: புதரில்
  rationale: סבך என்பது அடர்ந்த புதர் அல்லது மரச்செறிவைக் குறிக்கிறது; בְּ இங்கு செயல் நடைபெறும் இடத்தைக் குறிக்கிறது.
- source_word: עֵץ
  choice: மரப்புதர்
  rationale: עץ என்பதற்கு ‘மரம்’ அல்லது ‘மரக்கட்டை’ எனப் பொருள் வரலாம். סבך உடன் இங்கு மரங்கள் செறிந்த புதர் என்ற காட்சி பொருத்தமானது.
- source_word: קַרְדֻּמּוֹת
  choice: கோடரிகளை
  rationale: மரங்களை வெட்டும் கருவிகளின் பன்மையைக் குறிக்கும் பொதுவாகப் புரியும் நவீனத் தமிழ்ச் சொல்.
