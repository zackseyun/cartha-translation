  text: He was known like one who lifts up axes in a thicket of trees[a][b][c].
translation:
  language: ta
  text: மரங்கள் அடர்ந்த புதரில் கோடரிகளை மேல்நோக்கி உயர்த்தும் ஒருவனைப்போல் அவன் அறியப்பட்டான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாசகம் சுருக்கமாகவும் பொருள் தெளிவற்றதாகவும் உள்ளது. இதை, “மரங்கள் அடர்ந்த புதரில் கோடரிகளை மேலே கொண்டுவருகிற ஒருவனைப்போல் அவன் அறியப்பட்டான்” என்றும் மொழிபெயர்க்கலாம்.
