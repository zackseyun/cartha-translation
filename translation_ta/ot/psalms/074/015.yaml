id: PSA.74.15
reference: Psalms 74:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַתָּ֣ה בָ֭קַעְתָּ מַעְיָ֣ן וָ/נָ֑חַל אַתָּ֥ה ה֝וֹבַ֗שְׁתָּ נַהֲר֥וֹת אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/015.yaml
  text: You split open springs and wadis; you dried up ever-flowing rivers.
translation:
  language: ta
  text: நீரே ஊற்றையும் ஓடையையும் பிளந்து திறந்தீர்; என்றும் ஓடும் ஆறுகளை வற்றச் செய்தீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָקַעְתָּ
  choice: பிளந்து திறந்தீர்
  rationale: ‘பிளத்தல்/பிளந்து வழி உண்டாக்குதல்’ என்ற எபிரெய வினையின் வலிமையையும், நீரூற்றை வெளிப்படுத்தும் சூழலையும் இயல்பான தமிழில் தருகிறது.
- source_word: מַעְיָן
  choice: ஊற்று
  rationale: நிலத்திலிருந்து பொங்கிவரும் நீரூற்றைக் குறிக்கும் வழக்கமான, தெளிவான தமிழ் சொல்.
- source_word: נָחַל
  choice: ஓடை
  rationale: பள்ளத்தாக்கில் பாயும் நீரோடை அல்லது பருவகால நீர்வழி என்ற பொருளைத் தமிழில் சுருக்கமாகத் தருகிறது; ‘வாடி’ என்ற அந்நிய நிலவியல் சொல்லைத் தவிர்க்கிறது.
- source_word: הוֹבַשְׁתָּ
  choice: வற்றச் செய்தீர்
  rationale: ஹிபில் வினை வடிவின் காரணவினைப் பொருளான ‘உலரச் செய்தீர்’ என்பதை நீர்நிலைகளுக்கேற்ற இயல்பான தமிழில் தருகிறது.
- source_word: נַהֲרוֹת אֵיתָן
  choice: என்றும் ஓடும் ஆறுகள்
  rationale: אֵיתָן என்பதன் நிலையான, வற்றாத ஓட்டம் என்ற சூழல் பொருளை எடுத்துரைக்கிறது; வலிமையான ஆறுகள் என்ற சாத்திய நிழற்பொருளும் அடிப்படையில் உள்ளது.
theological_decisions:
- issue: இந்தச் செயல்கள் படைப்புச் செயல்களையா அல்லது யாத்திராகமச் சம்பவங்களையா சுட்டுகின்றன?
  choice: வசனத்தின் கவித்துவமான பொதுவடிவத்தை அப்படியே வைத்தல்
  alternative: குறிப்பிட்ட வரலாற்றுச் சம்பவத்தை வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய உரை நிகழ்வை பெயரிட்டு விளக்கவில்லை; ஆகவே படைப்பு, யாத்திராகமம் அல்லது இரண்டையும் எதிரொலிக்கச் செய்யும் இயல்பான தெளிவின்மையை மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழ்; இறைவனை நோக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணையான கவித்துவ அடிகளை இயல்பாகவும் கண்ணியமாகவும் வைத்துள்ளது.
