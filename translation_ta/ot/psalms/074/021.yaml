  text: אַל יָשֹׁ֣ב דַּ֣ךְ נִכְלָ֑ם עָנִ֥י וְ֝/אֶבְי֗וֹן יְֽהַלְל֥וּ שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/021.yaml
  text: Do not let the oppressed turn back ashamed[b][a]; let the poor and needy praise your name.
translation:
  language: ta
  text: ஒடுக்கப்பட்டவர்[a] அவமானமடைந்து[b] திரும்பிச் செல்ல விடாதீர்; ஏழைகளும் வறியவர்களும் உமது பெயரைப் புகழட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நொறுக்கப்பட்டவர்” / “தாழ்த்தப்பட்டவர்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “வெட்கமடைந்து.” எபிரெயச் சொல் பிறர் முன்னிலையில் இழிவுபடுத்தப்படும் பொருளையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: விடாதீர்
  rationale: தொடர்ந்து வரும் வினையுடன் சேர்ந்து வேண்டுதலிலுள்ள எதிர்மறைக் கோரிக்கையைத் தெரிவிக்கிறது. கடவுளை நோக்கிய மரியாதையான வேண்டுதலாகத் தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: יָשֹׁב
  choice: திரும்பிச் செல்ல
  rationale: שוב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதைத் தக்கவைத்து, இச்சூழலில் வெறுங்கையோடு அல்லது அவமானத்தோடு பின்வாங்கிச் செல்வதைக் குறிக்கும் இயல்பான தமிழாக்கம்.
- source_word: דַּךְ
  choice: ஒடுக்கப்பட்டவர்
  rationale: ‘நொறுக்கப்பட்டவர், தாழ்த்தப்பட்டவர், ஒடுக்கப்பட்டவர்’ என்ற பொருள் வரம்பில், சமூக மற்றும் அனுபவ ரீதியான துன்பத்தை நவீன தமிழில் தெளிவாகத் தெரிவிக்கும் சொல்.
- source_word: נִכְלָם
  choice: அவமானமடைந்து
  rationale: כלם வேரிலிருந்து வரும் இச்சொல் வெட்கத்திற்கும் பிறர் முன்னிலையிலான அவமானத்திற்கும் இடமளிக்கிறது. ‘அவமானமடைந்து’ என்பது அதன் வலுவான சமூக நுண்ணுணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָנִי
  choice: ஏழைகள்
  rationale: இச்சொல் ஏழ்மை, துன்பம், தாழ்த்தப்பட்ட நிலை ஆகியவற்றைக் குறிக்கலாம். אֶבְיוֹן உடன் இணைந்திருப்பதால் பொருளாதார ஏழ்மை இங்கு முன்னிலைப்படுகிறது.
- source_word: אֶבְיוֹן
  choice: வறியவர்கள்
  rationale: தேவையிலும் பற்றாக்குறையிலும் இருப்பவரைக் குறிக்கிறது. ‘ஏழைகள்’ என்பதுடன் இயல்பான தமிழிணையாக அமைந்து, கடுமையான வறுமையின் நுண்ணுணர்வையும் தருகிறது.
- source_word: יְהַלְלוּ
  choice: புகழட்டும்
  rationale: வேண்டுதல் சூழலில் உள்ள பியேல் imperfect/jussive வடிவத்தின் விருப்ப அல்லது கோரிக்கை வலிமையைத் தக்கவைக்கிறது.
- source_word: שְׁמֶךָ
  choice: உமது பெயரை
  rationale: கடவுளின் வெளிப்பட்ட தன்மையையும் புகழையும் குறிக்கும் எபிரெய வழக்கை விளக்கவுரையாக்காமல் நேரடியாகவும் மரியாதையுடனும் தக்கவைக்கிறது.
theological_decisions:
- issue: இறுதி வேண்டுதலுக்கும் முதல் வேண்டுதலுக்கும் உள்ள உறவு
  choice: ஒடுக்கப்பட்டவர் அவமானத்துடன் திரும்பிச் செல்லாதிருக்கவும், ஏழைகளும் வறியவர்களும் கடவுளின் பெயரைப் புகழவும் சங்கீதக்காரர் வேண்டுவதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இறுதி வாக்கியத்தை மீட்பின் நேரடி விளைவு என்று வெளிப்படையாகக் காட்டலாம்; அல்லது ஏழைகளும் வறியவர்களும் தொடர்ந்து கடவுளைப் புகழ வேண்டும் என்ற பொதுவான விருப்பமாக மட்டும் வாசிக்கலாம்.
  rationale: எபிரெய மொழியின் இணையான வேண்டுதல் அமைப்பு இரண்டு கோரிக்கைகளையும் ஒன்றோடொன்று தொடர்புபடுத்துகிறது; ஆனால் வெளிப்படையான காரண–விளைவு இணைப்பைச் சேர்ப்பதில்லை. தமிழாக்கமும் அந்தத் திறந்த உறவைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு வாசிப்புக்கும் பொதுவாசிப்புக்கும் ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கி ‘விடாதீர்’, ‘உமது’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; எபிரெயச் செய்யுளின் இரண்டு இணையான வேண்டுதல்களும் அரைப்புள்ளியால் தெளிவாக இணைக்கப்பட்டுள்ளன.
