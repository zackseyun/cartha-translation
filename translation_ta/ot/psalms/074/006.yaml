- from: இப்போதோ, அவர்கள் அதன் செதுக்குவேலைகள் அனைத்தையும் கோடரியாலும் சம்மட்டிகளாலும்[a] அடித்து நொறுக்குகிறார்கள்.
  to: இப்போதோ, அவர்கள் அதன் செதுக்கப்பட்ட அலங்கார வேலைப்பாடுகள் அனைத்தையும் கோடரியாலும் சம்மட்டிகளாலும்[a] அடித்து நொறுக்குகிறார்கள்.
