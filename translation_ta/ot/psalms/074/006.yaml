  text: And now they smash all its carved work together with hatchet and hammers[a][b].
translation:
  language: ta
  text: இப்போதோ, அவர்கள் அதன் செதுக்கப்பட்ட அலங்கார வேலைப்பாடுகள் அனைத்தையும் கோடரியாலும் சம்மட்டிகளாலும்[a] அடித்து நொறுக்குகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வெட்டும் கருவியாலும் அடிக்கும் கருவிகளாலும்’; இங்கே வரும் எபிரெயக் கருவிப்பெயர்களுக்கு இணையான துல்லியமான நவீன கருவிகள் எவை என்பது உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַת
  choice: இப்போதோ
  rationale: இணைப்புச் சொல்லும் கால வினையடையும் சேர்ந்து, முந்தைய காட்சியிலிருந்து இப்போது நடைபெறும் அழிவுக்குத் திருப்பத்தைக் குறிக்கின்றன. ‘இப்போதோ’ அந்த மாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: פִּתּוּחֶיהָ
  choice: அதன் செதுக்குவேலைகள்
  rationale: இச்சொல் செதுக்கப்பட்ட அல்லது பொறிக்கப்பட்ட அலங்கார வேலைப்பாடுகளைக் கூட்டாகக் குறிக்கிறது; பெண்பால் ஒருமை பின்னொட்டு முன் குறிப்பிடப்பட்ட பரிசுத்த இடம் அல்லது கட்டமைப்பைக் குறிக்கிறது.
- source_word: יַחַד
  choice: அனைத்தையும்
  rationale: இங்கு அழிக்கப்படும் செதுக்குவேலை முழுவதையும் கூட்டாகக் குறிக்கும் பொருளை ‘அனைத்தையும்’ இயல்பான தமிழில் தருகிறது; தேவையற்ற இரட்டிப்பைத் தவிர்க்க தனியாக ‘ஒன்றாக’ சேர்க்கப்படவில்லை.
- source_word: בְּכַשִּׁיל
  choice: கோடரியாலும்
  rationale: மரத்தை வெட்ட அல்லது கொத்தப் பயன்படுத்தப்படும் ஒரு கருவியை இச்சொல் குறிக்கிறது. துல்லியமான நவீன கருவிப்பெயர் உறுதியல்ல என்றாலும், ‘கோடரி’ பொதுவாகப் புரியக்கூடிய நெருங்கிய இணை.
- source_word: וְכֵילַפּוֹת
  choice: சம்மட்டிகளாலும்
  rationale: பல அடிக்கும் கருவிகளைக் குறிக்கும் பன்மை வடிவம். ‘சம்மட்டிகள்’ அழிவை ஏற்படுத்தும் கனமான அடிக்கும் கருவிகளுக்கு இயல்பான தமிழ் சொல்.
- source_word: יַהֲלֹמוּן
  choice: அடித்து நொறுக்குகிறார்கள்
  rationale: வினைச்சொல் பலமாக அடிப்பதைக் குறிக்கிறது; செதுக்குவேலை அழிக்கப்படும் சூழலில் ‘அடித்து நொறுக்குகிறார்கள்’ அதன் செயலையும் அழிவு விளைவையும் தெளிவாகத் தருகிறது.
