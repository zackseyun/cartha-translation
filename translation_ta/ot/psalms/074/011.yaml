source:
  edition: WLC
  text: לָ֤/מָּה תָשִׁ֣יב יָ֭דְ/ךָ וִֽ/ימִינֶ֑/ךָ מִ/קֶּ֖רֶב חוק/ך כַלֵּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/011.yaml
  text: Why do you hold back your hand[a], your right hand? Draw it out from your bosom and consume them.
translation:
  language: ta
  text: ஏன் உமது கையை—உமது வலக்கையை—பின்வாங்குகிறீர்? உமது மார்பிலிருந்து உமது வலக்கையை வெளியே எடுத்து, அவர்களை அழித்துவிடுங்கள்![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இறுதி வினைக்குச் செயப்படுபொருள் வெளிப்படையாக இல்லை; சங்கீதத்தின் சூழலில் வரும் பகைவர்களைக் குறிக்க ‘அவர்களை’ என்பது சேர்க்கப்பட்டுள்ளது. இதற்கு முந்திய சொற்றொடர் சொல்லுக்குச் சொல், ‘உமது மார்பின் நடுவிலிருந்து’ எனலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ஏன்
  rationale: புலம்பல் நிறைந்த காரண வினாவை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: תָשִׁיב
  choice: பின்வாங்குகிறீர்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம்; ‘கை’ என்பதோடும் அடுத்துள்ள மார்பு உருவகத்தோடும் சேர்ந்து, செயலில் இறங்காமல் கையைப் பின்னுக்கு இழுத்து வைத்திருப்பதைக் குறிக்கிறது.
- source_word: יָדְךָ וִימִינֶךָ
  choice: உமது கையை—உமது வலக்கையை
  rationale: எபிரெயக் கவிதையின் இணைமொழியையும், வலக்கை குறிக்கும் வல்லமையான செயல் உருவகத்தையும் காக்கிறது.
- source_word: מִקֶּרֶב חֵיקֶךָ
  choice: உமது மார்பிலிருந்து
  rationale: கையை ஆடைக்குள் அல்லது மார்பருகே செயலற்றபடி வைத்திருக்கும் உருவகத்தை, நவீனத் தமிழில் இயல்பாகவும் புரியத்தக்கவாறும் தருகிறது.
- source_word: כַלֵּה
  choice: அழித்துவிடும்
  rationale: פיעל கட்டளை வடிவத்தின் ‘முடிவுக்குக் கொண்டுவா, அழித்துவிடு’ என்ற வலிமையைத் தருகிறது; சூழலிலுள்ள பகைவர்களே மறைந்த செயப்படுபொருள்.
theological_decisions:
- issue: இறுதிக் கட்டளை வினையின் வெளிப்படாத செயப்படுபொருள்
  choice: ‘அவர்களை அழித்துவிடும்’ என்று, பகைவர்களைக் குறிக்கும் செயப்படுபொருளைச் சூழலிலிருந்து வழங்குதல்
  alternative: செயப்படுபொருளைச் சேர்க்காமல் ‘அழித்துவிடும்’ என மட்டும் மொழிபெயர்த்தல்; அல்லது அச்சுறுத்தலைப் பொதுவாகக் குறித்தல்
  rationale: எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை. சங்கீதத்தின் சூழல் தேவாலயத்தைப் பாழாக்கி நிந்திக்கும் பகைவர்களுக்கு எதிராக இறைவன் செயல்பட வேண்டுமென்ற வேண்டுதலாக இருப்பதால், ‘அவர்களை’ என்பது குறைந்தபட்சச் சூழல் நிரப்புதலாகும்; இதன் மறைமுகத் தன்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை நோக்கிய மரியாதை ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது. கவிதை உருவகமான கை, வலக்கை, மார்பு ஆகியவை காக்கப்பட்டுள்ளன; கட்டளை இறுதியில் இயல்பான தமிழ் வலிமையுடன் தரப்பட்டுள்ளது.
