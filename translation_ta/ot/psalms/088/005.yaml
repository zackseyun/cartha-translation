translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பலுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான “நீர்,” “உமது” பயன்படுத்தப்பட்டுள்ளன. குறுகிய இணை வாக்கியங்கள் எபிரெய வசனத்தின் படிப்படியான இருள் நிறைந்த படிமங்களைத் தெளிவாக வைத்திருக்கின்றன.
