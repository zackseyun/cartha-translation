  text: I am set free among the dead[a], like the slain who lie in the grave, whom you remember no more[c][b], and they are cut off from your hand.
translation:
  language: ta
  text: இறந்தவர்களிடையே விடுபட்டவனாய் இருக்கிறேன்[a]; கல்லறையில் கிடக்கும் கொல்லப்பட்டவர்களைப் போல இருக்கிறேன். அவர்களை நீர் இனி நினைவுகூருவதில்லை[b]; அவர்கள் உமது கையிலிருந்து வெட்டிப் பிரிக்கப்பட்டிருக்கிறார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “இறந்தவர்களிடையே சுதந்திரமானவனாய்.” எபிரெயச் சொல் சுதந்திரமாக அல்லது விடுவிக்கப்பட்ட நிலையில் இருப்பதைக் குறிக்கிறது. இங்கே அது முரண்நயத்துடன் பயன்படுத்தப்பட்டிருக்கலாம்: சங்கீதக்காரன் உயிர்வாழ்வோரின் உலகத்திலிருந்து விடுவிக்கப்பட்டவன் போல, இறந்தவனைப் போல் இருக்கிறார்.'
    reason: lexical_alternative
  - marker: b
    text: இங்கே “நினைவுகூருதல்” என்பது மனத்தில் நினைத்துப் பார்ப்பதை மட்டும் அல்லாமல், ஒருவரைக் கவனித்து அவருக்காகச் செயல்படுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “கை” என்பது வல்லமை, கட்டுப்பாடு அல்லது பராமரிப்பைக் குறிக்கும் எபிரெய உருவகம். இத்தொடரை “உமது கையிலிருந்து அறுக்கப்பட்டிருக்கிறார்கள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
