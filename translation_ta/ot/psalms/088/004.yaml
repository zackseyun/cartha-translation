source:
  edition: WLC
  text: נֶ֭חְשַׁבְתִּי עִם י֣וֹרְדֵי ב֑וֹר הָ֝יִ֗יתִי כְּ/גֶ֣בֶר אֵֽין אֱיָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/004.yaml
  text: I am counted among those going down to the pit[b][a]; I have become like a man without strength.
translation:
  language: ta
  text: குழிக்குள் இறங்குகிறவர்களோடு நான் எண்ணப்பட்டேன்[a]; வலிமையற்ற ஒரு மனிதனைப்போல் ஆனேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கல்லறைக்குள் இறங்குகிறவர்களோடு.” இங்குள்ள “குழி” என்பது மரணத்தைக் குறிக்கும் பொதுவான எபிரெயக் கவிதைப் படிமம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஆற்றலற்ற வலிமைமிக்க மனிதனைப்போல்.” “மனிதன்” என்பதற்கான எபிரெயச் சொல் வலிமையின் உட்குறிப்பையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶחְשַׁבְתִּי
  choice: நான் எண்ணப்பட்டேன்
  rationale: நிஃபால் வடிவம், ஒரு குழுவைச் சேர்ந்தவனாகக் கருதப்படுவதைக் குறிக்கிறது. எபிரெய நிறைவுற்ற வினை வடிவத்தின் தீவிரத்தையும் தமிழில் இயல்பாகப் பேணுகிறது.
- source_word: עִם
  choice: -ஓடு
  rationale: அடிப்படையில் ‘உடன்’ எனப் பொருள்படும்; ‘எண்ணப்பட்டேன்’ என்பதுடன் சேர்ந்து ஒரு கூட்டத்தில் ஒருவனாகக் கருதப்பட்ட பொருளை இயல்பாகத் தருகிறது.
- source_word: יוֹרְדֵי בוֹר
  choice: குழிக்குள் இறங்குகிறவர்கள்
  rationale: பங்கேற்பு வினை வடிவம் தொடர்ந்து அல்லது உடனடியாக நிகழும் இறங்குதலைச் சித்தரிக்கிறது; மரணத்தைச் சுட்டும் எபிரெயக் கவிதைப் படிமமும் காக்கப்படுகிறது.
- source_word: בּוֹר
  choice: குழி
  rationale: இச்சூழலில் கல்லறை அல்லது மரண உலகை உணர்த்தும் கவிதைப் படிமம். நேரடியாக ‘கல்லறை’ என்று மாற்றாமல் மூல உருவகத்தைப் பேணுகிறது.
- source_word: הָיִיתִי
  choice: ஆனேன்
  rationale: ஒரு நிலைக்கு வந்துவிட்ட விளைவைச் சூழல் காட்டுவதால், வெறும் ‘இருந்தேன்’ என்பதைக் காட்டிலும் ‘ஆனேன்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: כְּגֶבֶר
  choice: ஒரு மனிதனைப்போல்
  rationale: גֶּבֶר என்பது ‘மனிதன்’ என்று பொருள்படுவதோடு வலிமையின் உட்குறிப்பையும் கொண்டிருக்கலாம்; அடுத்த சொற்றொடருடனான முரணை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- source_word: אֵין אֱיָל
  choice: வலிமையற்ற
  rationale: אֱיָל குறிக்கும் வலிமை அல்லது ஆற்றல் இல்லாத நிலையைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
