review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the direct address to God, divine wrath resting upon the speaker, the totality of God's sea-breakers, divine agency in affliction, and the untranslated Selah. However, ‘சாய்ந்துள்ளது’ ordinarily suggests leaning rather than coming to rest upon someone, and is less exact for סמכה in this context.
  naturalness: The overall poetic register is natural modern Tamil. Replacing ‘சாய்ந்துள்ளது’ with ‘தங்கியுள்ளது’ produces a more idiomatic and contextually fitting expression for wrath remaining upon the psalmist.
  terminology: ‘கடுஞ்சினம்’ suitably conveys חמתך, and ‘துன்புறுத்தினீர்’ appropriately renders the Piel of ענה without over-specifying the kind of suffering. ‘மோதியடிக்கும் ... அலைகள்’ communicates the breaking-wave imagery. The footnote should not offer ‘பெருக்கலைகள்,’ which can suggest swelling/surging waves rather than specifically breaking waves.
  issues:
  - severity: medium
    issue: ‘சாய்ந்துள்ளது’ for סמכה
    rationale: Although it preserves a spatial image, this Tamil wording commonly denotes leaning. In the present lament context, the Hebrew describes wrath as having come to rest/settled upon the speaker; ‘தங்கியுள்ளது’ is clearer and closer.
  - severity: low
    issue: Footnote alternative ‘பெருக்கலைகள்’
    rationale: This alternative is not a close lexical equivalent of משבר, which evokes breakers—waves that break or crash. The note should retain alternatives that preserve that imagery.
  revised_text: 'உமது கடுஞ்சினம் என்மேல் தங்கியுள்ளது;

    உமது மோதியடிக்கும் அலைகள் அனைத்தாலும்[a]

    என்னைத் துன்புறுத்தினீர். சேலா.'
  revised_footnotes:
  - marker: a
    text: எபிரெயச் சொல் உடைந்து மோதும் கடலலைகளைச் சித்தரிக்கிறது; ‘உடைந்து மோதும் அலைகள்’ அல்லது பொதுவாக ‘அலைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  revision_rationale: The revision makes the first clause more faithful and idiomatic by rendering the image of wrath resting upon the speaker as ‘தங்கியுள்ளது.’ It also tightens the lexical note to alternatives that genuinely reflect the Hebrew breaker imagery. The verse’s direct attribution of wrath and affliction to God, its poetic form, and the ambiguity of ‘சேலா’ are retained.
