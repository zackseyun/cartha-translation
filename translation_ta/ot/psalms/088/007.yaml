revisions:
- from: 'உமது கடுஞ்சினம் என்மேல் சாய்ந்துள்ளது;

    மோதியடிக்கும் உமது அலைகள் அனைத்தாலும்[a]

    என்னைத் துன்புறுத்தினீர். சேலா.'
  to: 'உமது கடுஞ்சினம் என்மேல் தங்கியுள்ளது;

    உமது மோதியடிக்கும் அலைகள் அனைத்தாலும்[a]

    என்னைத் துன்புறுத்தினீர். சேலா.'
  rationale: The revision makes the first clause more faithful and idiomatic by rendering the image of wrath resting upon the speaker as ‘தங்கியுள்ளது.’ It also tightens the lexical note to alternatives that genuinely reflect the Hebrew breaker imagery. The verse’s direct attribution of wrath and affliction to God, its poetic form, and the ambiguity of ‘சேலா’ are retained.
