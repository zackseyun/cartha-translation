  yaml_path: translation/ot/psalms/088/007.yaml
  text: Your wrath has rested on me[a], and with all your breakers you have afflicted me. Selah
translation:
  language: ta
  text: 'உமது கடுஞ்சினம் என்மேல் தங்கியுள்ளது;

    உமது மோதியடிக்கும் அலைகள் அனைத்தாலும்[a]

    என்னைத் துன்புறுத்தினீர். சேலா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் உடைந்து மோதும் கடலலைகளைச் சித்தரிக்கிறது; ‘உடைந்து மோதும் அலைகள்’ அல்லது பொதுவாக ‘அலைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָמְכָה
  choice: சாய்ந்துள்ளது
  rationale: סמך என்பதன் அடிப்படைப் படிமமான சாய்தல்/தாங்கப்படுதல் என்பதையும், கடுஞ்சினம் சங்கீதக்காரர்மேல் வந்து நிலைத்திருக்கும் சூழலையும் காக்கிறது; ‘பாரமாக அழுத்துகிறது’ என்ற விளக்கத்தை நேரடியாக உரைக்குள் சேர்க்கவில்லை.
- source_word: חֲמָתֶךָ
  choice: உமது கடுஞ்சினம்
  rationale: חֵמָה குறிக்கும் தீவிரமான கோபத்தையும் இறைத் தீர்ப்பின் கனத்தையும் நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִשְׁבָּרֶיךָ
  choice: மோதியடிக்கும் உமது அலைகள்
  rationale: இந்தச் சொல் பொதுவான அலைகளை மட்டும் அல்லாமல் உடைந்து மோதும் கடலலைகளைச் சுட்டுகிறது. தமிழில் ‘மோதியடிக்கும் அலைகள்’ அந்த இயக்கமுள்ள படிமத்தைத் தெளிவாகத் தருகிறது.
- source_word: עִנִּיתָ
  choice: என்னைத் துன்புறுத்தினீர்
  rationale: Piel வடிவில் இச்சொல் துன்புறுத்துதல், சிறுமைப்படுத்துதல் அல்லது ஒடுக்குதல் என்று பொருள்படலாம். இங்கு துன்பத்தை ஏற்படுத்தும் இறைச் செயலைக் குறுகலாக்காமல் ‘துன்புறுத்தினீர்’ எனத் தரப்பட்டுள்ளது; மறைந்திருக்கும் ‘என்னை’ என்ற செயப்படுபொருளும் தமிழில் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְכָל
  choice: அனைத்தாலும்
  rationale: כָּל தரும் முழுமையையும், அலைகள் துன்புறுத்தலுக்கான கருவியாக இருப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. கவிதை அமைப்பில் இணைப்பு தெளிவாக இருப்பதால் ו தனிச் சொல்லாக மொழிபெயர்க்கப்படவில்லை.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியில்லை; ஆகவே விளக்கமாக மொழிபெயர்க்காமல் வழிபாட்டு/இசைக் குறிப்பாக ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறைக் கோபமும் துன்பத்தில் கடவுளின் நேரடி செயல்பாடும்
  choice: கடவுளின் கடுஞ்சினம் சங்கீதக்காரர்மேல் சாய்ந்திருப்பதாகவும், கடவுள் தமது அலைகள் அனைத்தாலும் அவரைத் துன்புறுத்தியதாகவும் நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இறைச் செயல்பாட்டை மறைமுகமாக்குதல் அல்லது ‘கடுஞ்சினம்’ என்பதை பொதுவான மனவேதனையாக மென்மைப்படுத்துதல்.
  rationale: எபிரெய உரை கோபத்தையும் துன்புறுத்தும் செயலையும் நேரடியாகக் கடவுளுடன் இணைக்கிறது. புலம்பலிலுள்ள இந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தவோ தீர்க்கவோ கூடாது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான கவிதைநடையிலும் அமைக்கப்பட்டுள்ளது. ‘உமது/துன்புறுத்தினீர்’ என்ற மரியாதை வடிவங்கள் கடவுளை நேரடியாக அழைக்கும் நடையைத் தக்கவைக்கின்றன.
