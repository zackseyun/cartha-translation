base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/003.yaml
  text: For my soul is full of troubles[a], and my life draws near to Sheol.
translation:
  language: ta
  text: ஏனெனில் என் ஆத்துமா துன்பங்களால் நிறைந்திருக்கிறது; என் வாழ்க்கை ஷியோலை[a] நெருங்கி வருகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கல்லறை’ அல்லது ‘இறந்தோரின் உலகம்.’ எபிரெயச் சொல் ‘ஷியோல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள புலம்பலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் காரணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׂבְעָה
  choice: நிறைந்திருக்கிறது
  rationale: ‘திருப்தியடையும் அளவுக்கு நிரம்புதல்’ என்ற உருவகத்தை, துன்பங்கள் சூழ்ந்துள்ள இச்சூழலில் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בְרָעוֹת
  choice: துன்பங்களால்
  rationale: இங்கு ஒழுக்கத் தீமைகளைக் காட்டிலும் சங்கீதக்காரரை ஆட்கொண்ட வேதனைகள் மற்றும் இடர்களைக் குறிக்கிறது.
- source_word: נַפְשִׁי
  choice: என் ஆத்துமா
  rationale: נֶפֶשׁ என்பதன் ‘ஆத்துமா/உயிர்/தன்னிலை’ என்ற பொருள் வரம்பில், அடுத்த அரையடியில் வரும் חַיַּי (‘என் வாழ்க்கை’) என்பதிலிருந்து கவிதைநயமான சொல் வேறுபாட்டைப் பாதுகாக்கிறது.
- source_word: וְחַיַּי
  choice: என் வாழ்க்கை
  rationale: வடிவில் பன்மையாக இருந்தாலும் חַיִּים வழக்கமாக ஒருமைப் பொருளுடைய ‘வாழ்க்கை’ என்பதைக் குறிக்கிறது.
- source_word: לִשְׁאוֹל
  choice: பாதாளத்தை
  rationale: שְׁאוֹל குறிக்கும் இறந்தோரின் உலகத்தை, நரகம் போன்ற பிற்காலக் குறுகிய கோட்பாட்டுப் பொருளாக மாற்றாமல் தமிழில் பரவலாக அறியப்படும் வேதாகமச் சொல்லால் தருகிறது; அடிக்குறிப்பு பொருள் வரம்பைத் தெளிவுபடுத்துகிறது.
- source_word: הִגִּיעוּ
  choice: நெருங்கிவிட்டது
  rationale: அடையுதல் அல்லது எட்டுதல் என்ற வினையின் இச்சூழலிலான உடனடி அண்மையை இயல்பான தமிழில் காட்டுகிறது; ஏற்கெனவே சென்று சேர்ந்துவிட்டதாகக் கூறாது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: பாதாளம்
  alternative: கல்லறை; இறந்தோரின் உலகம்; ஷியோல்
  rationale: இச்சொல் இறந்தோரின் உலகைக் குறிக்கிறது. ‘பாதாளம்’ தமிழ் வேதாகம நடையில் அறியப்பட்ட சொல்லாக இருந்தாலும், அதை ‘நரகம்’ என்று குறுக்காமல் இருக்கவும் மூலச்சொல்லின் கருத்துலகைப் பாதுகாக்கவும் அடிக்குறிப்பில் மாற்றுப் பொருள்களும் எபிரெயப் பெயரும் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பலின் கண்ணியமான கவிதைத் தொனியைப் பேணும் நடை. ‘ஆத்துமா’ மற்றும் ‘வாழ்க்கை’ என்ற வேறுபாடு இணை அமைப்பில் பாதுகாக்கப்பட்டுள்ளது; ‘பாதாளம்’ அடிக்குறிப்பால் கோட்பாட்டுரீதியாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
