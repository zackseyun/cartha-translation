base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/010.yaml
  text: Do you work wonders for the dead? Do the departed spirits rise up to praise you? Selah[a]
translation:
  language: ta
  text: இறந்தவர்களுக்காக நீர் அதிசயங்கள் செய்வீரோ? இறந்தோரின் நிழல்கள்[a] எழுந்து உம்மைத் துதிக்குமோ? சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லான ரெப்பாயீம் என்பது பாதாளத்தில் உள்ள இறந்தோரைக் குறிக்கும் கவிதைச்சொல். இதை “பிரிந்த ஆவிகள்” என்றும் மொழிபெயர்க்கலாம்.
