lexical_decisions:
- source_word: הֲלַמֵּתִים
  choice: இறந்தவர்களுக்காக
  rationale: לַ முன்னிடைச்சொல்லின் ‘இறந்தவர்களுக்காக/இறந்தவர்களுக்கு’ என்ற பொருளையும் வினாவின் சொல்லாட்சியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: תַּעֲשֶׂה פֶּלֶא
  choice: நீர் அதிசயங்கள் செய்வீரோ?
  rationale: עשה + פלא என்பதன் ‘அதிசயச் செயல்களைச் செய்தல்’ என்ற இணைப்பொருளைத் தருகிறது; எபிரெயத்தில் ஒருமையாக இருந்தாலும் தமிழில் பன்மை இயல்பாக உள்ளது.
- source_word: אִם
  choice: …மோ?
  rationale: இங்கு நிபந்தனையைக் காட்டாமல், முதல் கேள்விக்கு இணையான இரண்டாவது வினாவை அறிமுகப்படுத்துகிறது.
- source_word: רְפָאִים
  choice: இறந்தோரின் நிழல்கள்
  rationale: பாதாளத்தில் உள்ள இறந்தவர்களைக் குறிக்கும் கவிதைச்சொல்லின் நிழலான, உயிரற்ற தோற்றத்தைத் தக்கவைக்கிறது; இனக்குழுவைக் குறிக்கும் ‘ரெப்பாயீம்’ என்ற தவறான புரிதலைத் தவிர்க்கிறது.
- source_word: יָקוּמוּ
  choice: எழுந்து
  rationale: קום என்பதன் எழுதல் அல்லது எழுந்து நிற்றல் என்ற தெளிவான காட்சியைப் பாதுகாக்கிறது; உயிர்த்தெழுதல் குறித்த பிற்காலக் கோட்பாட்டைத் தனியாகத் திணிக்கவில்லை.
- source_word: יוֹדוּךָ
  choice: உம்மைத் துதிக்குமோ
  rationale: ידה என்பதன் நன்றி செலுத்துதல்/புகழ்தல் என்ற வழிபாட்டு உணர்வை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியற்றதால் விளக்கமாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: கவிதைமிகு பாதாளச் சூழலில் רְפָאִים என்பதன் பொருள்
  choice: இறந்தோரின் நிழல்கள்
  alternative: பிரிந்த ஆவிகள்; இறந்தவர்கள்; ரெப்பாயீம்
  rationale: இச்சொல் இறந்தோரைக் குறிக்கும் கவிதைமிகு சொல்லாக இங்கு வருகிறது. ‘இறந்தோரின் நிழல்கள்’ என்பது பாதாளச் சாயலைக் காக்கிறது; அதேவேளை இடைநிலை நிலை குறித்த பிற்காலக் கோட்பாட்டு விவரங்களை வசனத்தில் சேர்க்கவில்லை.
- issue: இரண்டாவது கேள்வியில் ‘எழுதல்’ என்பதன் இறையியல் நுட்பம்
  choice: எழுந்து
  alternative: உயிர்த்தெழுந்து; எழுந்து நின்று
  rationale: மூலத்தின் காட்சியையும் திட்டமிட்ட தெளிவின்மையையும் காக்கிறது; இதை உயிர்த்தெழுதல் குறித்த நேரடி கோட்பாட்டு அறிக்கையாக மாற்றவில்லை.
