revisions:
- from: அவை நாள் முழுவதும் தண்ணீரைப்போல் என்னைச் சூழ்ந்துகொண்டன; ஒன்றாக என்மேல் வளைத்துக்கொண்டன.[a]
  to: அவை நாள் முழுவதும் தண்ணீரைப்போல் என்னைச் சூழ்ந்தன; ஒன்றுசேர்ந்து என்னைச் சுற்றிவளைத்தன.[a]
  rationale: The revision preserves the Hebrew’s two parallel verbs and its overwhelming-water simile while replacing unclear reflexive wording with natural Tamil verbs for surrounding and encircling. ‘ஒன்றுசேர்ந்து’ clearly renders the adverbial collective force of יָחַד. The footnote retains the valid lexical alternative and is aligned with the revised main text.
