translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்தின் துயர்மிகு கவித்துவத் தொனியையும் இரு இணையான வினைவரிகளையும் காக்கும் கண்ணியமான நடை. “அவை” என்ற அஃறிணைப் பன்மை, முந்தைய சூழலில் உள்ள துன்பங்கள் அல்லது அச்சுறுத்தல்களைக் குறிக்கும் எபிரெய பன்மை வினைகளுடன் பொருந்துகிறது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
