  text: סַבּ֣וּ/נִי כַ֭/מַּיִם כָּל הַ/יּ֑וֹם הִקִּ֖יפוּ עָלַ֣/י יָֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/017.yaml
  text: They surrounded me like water all day long[a]; together they closed in on me.
translation:
  language: ta
  text: அவை நாள் முழுவதும் தண்ணீரைப்போல் என்னைச் சூழ்ந்தன; ஒன்றுசேர்ந்து என்னைச் சுற்றிவளைத்தன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவை நாள் முழுவதும் தண்ணீரைப்போல் என்னைச் சுற்றிவளைத்தன; ஒன்றுசேர்ந்து என்னைச் சூழ்ந்தன.” இவ்வாறு மொழிபெயர்ப்பது இரண்டு எபிரெய வினைச்சொற்களுக்கிடையிலான நெருக்கமான சொற்பொருள் இணையைத் தெளிவாகக் காட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי
  choice: என்னைச் சூழ்ந்துகொண்டன
  rationale: סבב என்பதன் Qal வினை வடிவம் பேச்சாளரைச் சுற்றிவளைத்த செயலைக் குறிக்கிறது. “சூழ்ந்துகொண்டன” என்பது அச்சுறுத்தும் சூழ்தலையும் எபிரெய நிறைவுற்ற வினையின் தாக்கத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: כַמַּיִם
  choice: தண்ணீரைப்போல்
  rationale: כ ஒப்புமையைக் குறிக்கிறது. ஒருவரை எங்கும் சூழ்ந்து மூழ்கடிக்கும் உருவகத்தை “தண்ணீரைப்போல்” தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: நாள் நெடுகிலும் தொடர்ந்த நிலையைக் குறிக்கும் காலச் சொற்றொடருக்கு இது இயல்பான நவீனத் தமிழ் இணை.
- source_word: הִקִּיפוּ
  choice: வளைத்துக்கொண்டன
  rationale: முந்தைய வினையோடு இணையான சுற்றிவளைத்தலைக் குறிக்கிறது. அதே சொல்லை மீண்டும் பயன்படுத்தாமல், இறுக நெருங்கிவரும் தாக்கத்தை “வளைத்துக்கொண்டன” காக்கிறது.
- source_word: עָלַי
  choice: என்மேல்
  rationale: על என்பதன் அடிப்படை இட/திசைப் பொருளை “என்மேல்” காக்கிறது; இச்சூழலில் அச்சுறுத்தல்கள் பேச்சாளருக்கு எதிராக நெருங்குவதையும் உணர்த்துகிறது.
- source_word: יָחַד
  choice: ஒன்றாக
  rationale: அச்சுறுத்தும் சக்திகள் ஒருங்கிணைந்து செயல்படுவதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
