  text: הַ/יְסֻפַּ֣ר בַּ/קֶּ֣בֶר חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ בָּ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/011.yaml
  text: Is your steadfast love declared in the grave[a], your faithfulness in Abaddon?
translation:
  language: ta
  text: கல்லறையில் உமது மாறாத அன்பும் அபத்தோனில்[a] உமது நம்பகத்தன்மையும் எடுத்துரைக்கப்படுமோ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அழிவில்” அல்லது “அழிவின் இடத்தில்” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் “அபத்தோன்” என்பது அழிவு அல்லது மரண உலகைக் குறிக்கும் கவிதைச் சொல்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְסֻפַּר
  choice: எடுத்துரைக்கப்படுமோ
  rationale: שׂפר என்பதன் புஅல் வினைவடிவம், கேள்வி உருபுடன் சேர்ந்து, ‘எடுத்துரைக்கப்படுமா?’ என்ற எதிர்பார்க்கப்படும் மறுப்பு விடையைக் கொண்ட சொல்லாட்சிக் கேள்வியை உருவாக்குகிறது. இத்தேர்வு அதன் செயப்பாட்டு வடிவத்தையும் ‘சொல்லுதல்/விவரித்தல்’ என்ற பொருளையும் காக்கிறது.
- source_word: בַּקֶּבֶר
  choice: கல்லறையில்
  rationale: קבר என்பது கல்லறை அல்லது அடக்க இடத்தைக் குறிக்கிறது. இச்சூழலில் ‘கல்லறை’ இயல்பாகவும் கவிதைநயத்துடனும் உள்ளது.
- source_word: חַסְדֶּךָ
  choice: உமது மாறாத அன்பு
  rationale: חסד என்பது நீடித்த, பற்றுறுதியுள்ள அன்பைக் குறிக்கிறது. ‘மாறாத அன்பு’ அதன் உறுதியையும் அன்பின் தன்மையையும் எளிய நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱמוּנָתְךָ
  choice: உமது உண்மைத்தன்மை
  rationale: אֱמוּנָה இங்கு கடவுளின் நம்பகத்தன்மை மற்றும் உண்மையாய் நிலைத்திருக்கும் பண்பைக் குறிக்கிறது; இணைவரியான חסד-க்கும் பொருத்தமாக ‘உண்மைத்தன்மை’ அமைகிறது.
- source_word: בָּאֲבַדּוֹן
  choice: அபத்தோனில்
  rationale: אבדון என்பது ‘அழிவு’ என்பதையும், கவிதை வழக்கில் மரணம் அல்லது அழிவின் உலகையும் குறிக்கலாம். ‘அபத்தோன்’ என ஒலிபெயர்ப்பது மூல எபிரெயச் சொல்லின் தனித்துவமான கவிதைப் படிமத்தைப் பாதுகாக்கிறது; பொருள் மாற்றுகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: אבדון என்பதை பொதுப்பெயரான ‘அழிவு’ என்று மொழிபெயர்ப்பதா, மரண உலகைக் குறிக்கும் கவிதைச் சொல்லாக ‘அபத்தோன்’ என்று வைத்திருப்பதா
  choice: முதன்மைப் பிரதியில் ‘அபத்தோன்’ என்று ஒலிபெயர்த்தல்
  alternative: ‘அழிவு’ அல்லது ‘அழிவின் இடம்’
  rationale: ‘கல்லறை’ என்பதற்கு இணையாக வரும் இச்சொல் வெறும் அழிவுச் செயலைவிட மரணம்/அழிவின் உலகைக் குறிப்பதாக இருக்கலாம். ஒலிபெயர்ப்பு மூலத்தின் இலக்கிய மற்றும் இறையியல் ஒலிப்பைத் தக்கவைக்கிறது; மற்ற சாத்தியமான பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன, மரியாதைமிக்க, கவிதைநயம் கொண்ட பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைவரியமைப்பைக் காக்க, ஒரே செயப்பாட்டு வினை இரு கூறுகளுக்கும் பொருந்துமாறு வாக்கியம் அமைக்கப்பட்டுள்ளது; ‘-மோ?’ சொல்லாட்சிக் கேள்வியின் எதிர்பார்க்கப்படும் மறுப்பு விடையை இயல்பாக உணர்த்துகிறது.
