source:
  edition: WLC
  text: לָ/מָ֣ה יְ֭הוָה תִּזְנַ֣ח נַפְשִׁ֑/י תַּסְתִּ֖יר פָּנֶ֣י/ךָ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/014.yaml
  text: Why[a], O Yahweh[b], do you reject my soul? Why do you hide your face from me?
translation:
  language: ta
  text: ஏன், யாவே, என் உயிரைத் தள்ளிவிடுகிறீர்[a]? ஏன் உமது முகத்தை என்னிடமிருந்து மறைக்கிறீர்[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைத் தள்ளிவிடுகிறீர்.” எபிரெயத்தில் “என் உயிரை” என்பது “என்னை” அல்லது “என் வாழ்வை” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “முகத்தை மறைத்தல்” என்பது சாதகமான பிரசன்னத்தையோ கவனத்தையோ விலக்கிக்கொள்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָה
  choice: ஏன்
  rationale: காரணத்தை நேரடியாகக் கேட்கும் சொல்லாகவும் புலம்பலின் தீவிரத்தை இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் இடம்பெறும் இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: תִּזְנַח
  choice: தள்ளிவிடுகிறீர்
  rationale: வினைச்சொல்லின் ‘நிராகரித்தல்/ஒதுக்கித் தள்ளுதல்’ என்ற வலிமையைத் தெளிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: נֶפֶשׁ என்பதன் ‘உயிர், தன்முழுமை, நான்’ என்னும் பொருள் பரப்பை ஓரளவு காக்கிறது; ‘என் ஆத்துமாவை’ என்பதைவிட இயல்பான நவீன தமிழ். சூழலில் ‘என்னை’ என்றும் பொருள்படலாம் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
- source_word: תַּסְתִּיר
  choice: மறைக்கிறீர்
  rationale: ‘மறைத்தல்’ என்ற ஹிபீல் வினையின் நேரடியான, இயல்பான இணைச்சொல்.
- source_word: פָּנֶיךָ
  choice: உமது முகத்தை
  rationale: மூலத்தின் தெளிவான உருவகத்தைப் பாதுகாக்கிறது; இது தேவனுடைய சாதகமான பிரசன்னம் அல்லது கவனம் விலகுவதைக் குறிக்கும் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: מִמֶּנִּי
  choice: என்னிடமிருந்து
  rationale: உறவு மற்றும் விலகல் பொருளை இயல்பான தமிழில் துல்லியமாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, இறைத் திருப்பெயரே உள்ளது. ஆகவே பெயரைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: נַפְשִׁי என்பதன் மனித இயல்பு குறித்த பொருள்
  choice: என் உயிரை
  alternative: என்னை
  rationale: இதை உடலிலிருந்து தனியாக உள்ள ஓர் அங்கம் என்று கட்டாயமாக விளக்காமல், ‘உயிர்/தன்முழுமை/நான்’ என்ற எபிரெயச் சொல்லின் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், புலம்பலின் நேரடியான கேள்வித் தொனியும் கவிதை உருவகமும் காக்கப்பட்டுள்ளன. தேவனை நோக்கிய வினைகளில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; பழமையான ‘ஆத்துமா’ தவிர்க்கப்பட்டுள்ளது.
