source:
  edition: WLC
  text: עָ֘נִ֤י אֲנִ֣י וְ/גֹוֵ֣עַ מִ/נֹּ֑עַר נָשָׂ֖אתִי אֵמֶ֣י/ךָ אָפֽוּנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/015.yaml
  text: I am afflicted and near death from my youth[a]; I bear your terrors; I am overwhelmed.
translation:
  language: ta
  text: நான் இளமையிலிருந்தே துன்புற்று, சாகும் நிலையில் இருக்கிறேன்; உமது பயங்கரங்களைச் சுமந்திருக்கிறேன்; நிலைகுலைந்திருக்கிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பயங்கரங்களைச் சுமந்தேன்; திகைத்துப்போயிருக்கிறேன்.” கடைசி எபிரெய வினைச்சொல் பொருள் காண்பதற்குக் கடினமானது; அது நிலைகுலைதல், திகைத்துப்போதல் அல்லது முற்றிலும் ஒடுங்கிப்போதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  choice: துன்புற்று
  rationale: புலம்பல் சூழலில் இச்சொல் பொருளாதார ஏழ்மையைவிடத் துன்புறும், அவலமான நிலையைக் குறிக்கிறது.
- source_word: וְגֹוֵעַ
  choice: சாகும் நிலையில் இருக்கிறேன்
  rationale: גוע என்பதன் நிகழ்நிலைப் பெயரெச்சம் தொடர்ந்து கொண்டிருக்கும் சாகும் நிலையைக் குறிக்கிறது; இயல்பான தமிழில் அதன் நீடித்த தன்மையை இத்தொடர் வெளிப்படுத்துகிறது.
- source_word: מִנֹּעַר
  choice: இளமையிலிருந்தே
  rationale: வாழ்க்கையின் இளம்பருவத்திலிருந்து நீடிக்கும் நிலையைக் מִן முன்னொட்டு குறிக்கிறது.
- source_word: נָשָׂאתִי
  choice: சுமந்திருக்கிறேன்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் சுமத்தல் அல்லது சுமத்திக்கொண்டு செல்லுதல். நிறைவுற்ற எபிரெய வினையின் கடந்தகாலத்தையும் தற்போதைய விளைவையும் இத்தமிழ் வடிவம் இயல்பாகக் காக்கிறது.
- source_word: אֵמֶיךָ
  choice: உமது பயங்கரங்கள்
  rationale: பன்மைச் சொல் அச்சுறுத்தும் பயங்கரங்களைக் குறிக்கிறது; இரண்டாம் நபர் பின்னொட்டை ‘உமது’ என்று நேரடியாகப் பாதுகாக்கிறது.
- source_word: אָפוּנָה
  choice: நிலைகுலைந்திருக்கிறேன்
  rationale: இறுதி எபிரெய வடிவம் அரிதானதும் பொருள் உறுதியற்றதுமாகும்; அது திகைப்பு, மனக்கலக்கம் அல்லது முற்றிலும் ஒடுங்கிப்போதல் போன்ற நிலையைக் குறிக்கலாம். ‘நிலைகுலைந்திருக்கிறேன்’ இவற்றை அளவுக்கு மீறித் துல்லியப்படுத்தாமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘உமது பயங்கரங்கள்’ என்பதன் குறிப்பு
  choice: பயங்கரங்களை நேரடியாகக் கடவுளோடு தொடர்புபடுத்தும் இரண்டாம் நபர் உடைமை வடிவம் பாதுகாக்கப்பட்டது.
  alternative: இவை கடவுளின் முன்னிலையில் மட்டும் உணரப்பட்ட பயங்கள் என்று மென்மைப்படுத்துதல்.
  rationale: எபிரெய மொழியின் இரண்டாம் நபர் பின்னொட்டு இவற்றைக் கடவுளுக்குரிய அல்லது அவரிடமிருந்து வரும் பயங்கரங்களாக நேரடியாக முன்வைக்கிறது. புலம்பலிலுள்ள இறையியல் பதற்றத்தை மொழிபெயர்ப்பு தணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான புலம்பல் நடையைப் பயன்படுத்துகிறது. கடவுளை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘உமது’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் கடுமையும் தெளிவின்மையும் தக்கவைக்கப்பட்டுள்ளன.
