  yaml_path: translation/ot/psalms/088/008.yaml
  text: You have driven my companions far from me[a]; you have made me abhorrent to them[c][b]. I am confined and cannot go out.
translation:
  language: ta
  text: எனக்கு அறிமுகமானவர்களை[a] என்னிடமிருந்து வெகுதூரம் விலக்கிவிட்டீர்; அவர்களுக்கு என்னை அருவருப்புக்குரியவனாக[b] ஆக்கிவிட்டீர். நான் அடைபட்டிருக்கிறேன்; வெளியே செல்ல முடியவில்லை.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குத் தெரிந்தவர்களை”; அல்லது, “என் பரிச்சயமானவர்களை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுக்கு என்னை அருவருப்பான ஒன்றாக ஆக்கிவிட்டீர்.”
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “நான் அடைபட்டிருக்கிறேன்; வெளியே செல்வதில்லை.” சூழலில் இது வெளியே செல்ல இயலாத நிலையைக் குறிக்கலாம்.
    reason: source_ambiguity
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: வெகுதூரம் அகற்றிவிட்டீர்
  rationale: ரחק என்பதன் ஹிஃபில் வடிவம் தூரப்படுத்துதல் அல்லது விலக்குதல் என்ற காரணவினைப் பொருளைத் தருகிறது; தமிழில் இந்தத் தேர்வு அந்தச் செயற்பாட்டையும் புலம்பலின் வலிமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מְיֻדָּעַי
  choice: எனக்கு அறிமுகமானவர்களை
  rationale: ידע என்பதிலிருந்து வந்த இச்சொல் பேச்சாளரால் அறியப்பட்டவர்களைக் குறிக்கிறது. ‘அறிமுகமானவர்கள்’ என்பது ‘நண்பர்கள்’ என்று நெருக்கத்தை மிகைப்படுத்தாமல், மூலத்தின் பரந்த பொருளைப் பேணுகிறது.
- source_word: מִמֶּנִּי
  choice: என்னிடமிருந்து
  rationale: מן முன்னிடைச்சொல்லின் பிரிவைக் குறிக்கும் வழக்கமான பொருளைத் துல்லியமாகத் தருகிறது.
- source_word: שַׁתַּנִי
  choice: என்னை ... ஆக்கிவிட்டீர்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’; இங்குள்ள பயனிலை அமைப்பில் ஒருவரை ஒரு நிலைக்கு ஆக்குதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: תוֹעֵבוֹת
  choice: அருவருப்பானவனாக
  rationale: இது வடிவத்தில் பன்மை பெயர்ச்சொல்லாக இருந்தாலும் இங்கு பயனிலையாக வந்து, மற்றவர்களுக்குப் பேச்சாளர் கடும் வெறுப்புக்குரியவரானார் என்பதைக் குறிக்கிறது. ‘அருவருப்பானவன்’ அந்த வலுவான வெறுப்புணர்வைப் பேணுகிறது.
- source_word: לָמוֹ
  choice: அவர்களுக்கு
  rationale: முன்னர் குறிப்பிடப்பட்ட அறிமுகமானவர்களையே சுட்டுகிறது; பயனிலைத் தொடரில் ‘அவர்களுக்கு’ என்பது இயல்பான தமிழ்.
- source_word: כָּלֻא
  choice: நான் அடைபட்டிருக்கிறேன்
  rationale: כלא என்பதன் செயல்படுபொருள் அல்லது நிலைப் பொருள் அடைக்கப்பட்டு, கட்டுப்படுத்தப்பட்டிருப்பதைக் குறிக்கிறது. இது சிறைச்சாலையைத் தேவையின்றி குறிப்பாக்காமல் மூல உருவகத்தின் பரப்பைப் பேணுகிறது.
- source_word: וְלֹא אֵצֵא
  choice: வெளியே செல்ல முடியவில்லை
  rationale: சொல்லுக்குச் சொல் ‘நான் வெளியே செல்வதில்லை’ என்றாலும், ‘அடைபட்டிருக்கிறேன்’ என்பதற்குப் பின் வருவதால் இயலாமையே சூழல்சார் பொருள்; தமிழில் ‘முடியவில்லை’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
