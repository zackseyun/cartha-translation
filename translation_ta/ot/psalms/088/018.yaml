  text: הִרְחַ֣קְתָּ מִ֭מֶּ/נִּי אֹהֵ֣ב וָ/רֵ֑עַ מְֽיֻדָּעַ֥/י מַחְשָֽׁךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/018.yaml
  text: You have put far from me lover and friend[b][a]; my acquaintances are darkness.
translation:
  language: ta
  text: என்னை நேசிப்பவரையும் நண்பரையும் நீர் என்னைவிட்டு விலக்கிவிட்டீர்; எனக்கு அறிமுகமானவர்களோ இருளே.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு அறிமுகமானவர்கள் இருளில் இருக்கிறார்கள்”; அல்லது, “இருளே எனது ஒரே துணை.” எபிரெய மூலத்தின் முடிவு மிகவும் சுருக்கமாக இருப்பதால் பலவாறு புரிந்துகொள்ளப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: விலக்கிவிட்டீர்
  rationale: ரחק என்பதன் ஹிஃபில் வடிவம், சங்கீதக்காரரைச் சேர்ந்தவர்களைத் தேவன் தூரப்படுத்திய causative பொருளைக் காட்டுகிறது; ‘விலக்கிவிட்டீர்’ என்பது தமிழில் இயல்பாகவும் நேரடி அழைப்பை மரியாதை ஒருமையிலும் காக்கிறது.
- source_word: מִמֶּנִּי
  choice: என்னைவிட்டு
  rationale: מן முன்னொட்டும் முதலாம் நபர் ஒருமை பின்னொட்டும் பிரிவைச் சுட்டுகின்றன; ‘என்னைவிட்டு’ தமிழில் இயல்பான பிரிவுத்தொடர்.
- source_word: אֹהֵב
  choice: என்னை நேசிப்பவர்
  rationale: אהב என்பதன் பெயர்ச்சொல்லாகப் பயன்படும் செய்பெயர் வடிவம், சங்கீதக்காரரை நேசிப்பவரைக் குறிக்கிறது. ‘காதலர்’ என்று குறுகிய காதல் பொருளுக்கு வரையறுக்காமல் மூலத்தின் பரந்த உறவுப் பொருளைக் காக்கிறது.
- source_word: וָרֵעַ
  choice: நண்பர்
  rationale: רֵעַ இச்சூழலில் நெருங்கிய உறவுடைய நண்பர் அல்லது தோழரைக் குறிக்கிறது; ‘நண்பர்’ தெளிவான நவீனத் தமிழ்.
- source_word: מְיֻדָּעַי
  choice: எனக்கு அறிமுகமானவர்கள்
  rationale: ידע சார்ந்த இவ்வடிவம் பேச்சாளருக்குத் தெரிந்தவர்களைக் குறிக்கிறது. ‘அறிமுகமானவர்கள்’ என்பது நண்பர்களைக் காட்டிலும் பரந்த வட்டத்தைச் சுட்டி சொல்வேறுபாட்டைக் காக்கிறது.
- source_word: מַחְשָׁךְ
  choice: இருளாகிவிட்டார்கள்
  rationale: இறுதி எபிரெயச் சொற்றொடர் வினையில்லாமல் மிகச் சுருக்கமாக ‘எனக்கு அறிமுகமானவர்கள்—இருள்’ என நிற்கிறது. முதன்மை உரை சொல்வரிசையையும் உருவகத் தாக்கத்தையும் காக்க, தமிழில் தேவையான இணைப்பைச் சேர்த்து வழங்குகிறது.
theological_decisions:
- issue: முடிவிலுள்ள מְיֻדָּעַי מַחְשָׁךְ என்ற வினையற்ற சொற்றொடரின் தொடர்பு
  choice: ‘எனக்கு அறிமுகமானவர்கள் இருளாகிவிட்டார்கள்’ என முன்னுள்ள பன்மையை எழுவாயாகவும் ‘இருள்’ என்பதை பயனிலையாகவும் வாசித்தல்
  alternative: ‘இருளே எனது ஒரே துணை’ அல்லது ‘எனக்கு அறிமுகமானவர்கள் இருளில் இருக்கிறார்கள்’
  rationale: மசோரெட்டிக் உரையின் சொல்வரிசை ‘எனக்கு அறிமுகமானவர்கள்—இருள்’ என்ற வாசிப்பை இயல்பாக அனுமதிக்கிறது; ஆயினும் வினை மற்றும் முன்னிடைச்சொல் இல்லாததால் மற்ற வாசிப்புகளையும் உறுதியாகத் தள்ளிவிட முடியாது. எனவே மாற்று விளக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய இரண்டாம் நபர் ஒருமை மரியாதை வடிவமான ‘நீர்/விட்டீர்’ காக்கப்பட்டுள்ளது. மூலத்தின் கடுமையான இறுதி உருவகம் மென்மையாக்கப்படாமல், அதன் உண்மையான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் தெரிவிக்கப்பட்டுள்ளது.
