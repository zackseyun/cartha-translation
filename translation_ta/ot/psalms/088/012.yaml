  text: Is your wonder made known in the darkness[b][a], or your righteousness in the land of forgetfulness?
translation:
  language: ta
  text: இருளில் உமது வியத்தகு செயல் அறியப்படுமா? அல்லது மறதியின் நாட்டில்[a] உமது நீதி[b] அறியப்படுமா?
