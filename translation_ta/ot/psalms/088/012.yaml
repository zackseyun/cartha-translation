lexical_decisions:
- source_word: הֲיִוָּדַע
  choice: அறியப்படுமா?
  rationale: ידע என்பதன் நிஃபால் முற்றுப்பெறாத வினைவடிவத்தையும் வினாக்கூற்றையும் தமிழில் இயல்பான செயப்பாட்டு வினாவாகத் தருகிறது.
- source_word: בַּחֹשֶׁךְ
  choice: இருளில்
  rationale: முன்னிடைச்சொல் மற்றும் குறிப்புச் சுட்டுடன் வரும் எபிரெயச் சொல்லைச் சுருக்கமான இயல்பான தமிழில் தருகிறது; சூழலில் இது மரண உலகின் இருளையும் நினைவூட்டுகிறது.
- source_word: פִּלְאֶךָ
  choice: உமது வியத்தகு செயல்
  rationale: ஒருமை வடிவத்தைப் பேணுவதோடு, தேவனுடைய வியப்பூட்டும் செயலைக் குறிக்கும் சொல்லின் பொருளை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְצִדְקָתְךָ
  choice: உமது நீதி
  rationale: צדקה என்பதன் ‘நீதித்தன்மை/நியாயம்’ சார்ந்த பொருள் பரப்பை ‘நீதி’ இயல்பாகத் தாங்குகிறது. இணைப்புச்சொல்லைத் தனியே மொழிபெயர்க்காமல், இணையான இரண்டாம் வினாவாக அமைப்பது தமிழில் கவிதை நடையைப் பேணுகிறது.
- source_word: בְּאֶרֶץ נְשִׁיָּה
  choice: மறதியின் நாட்டில்
  rationale: ‘மறதி/மறக்கப்படுதல்’ என்ற உருவகத்தை விளக்கமாக மாற்றாமல், ‘நாடு’ என்ற கவித்துவப் படிமத்தையும் பேணுகிறது.
theological_decisions:
- issue: צדקה என்ற சொல்லை தேவனுடைய குணத்தையும் செயல்களையும் குறிக்கும் கவிதைச் சூழலில் மொழிபெயர்த்தல்
  choice: நீதி
  alternative: நியாயம்
  rationale: எபிரெயச் சொல் நீதித்தன்மையையும் நியாயத்தையும் குறிக்கக்கூடும். ‘நீதி’ இந்த இரு பொருள் நிழல்களையும் ஓரளவு தாங்குவதால் மூல உரையின் இறையியல் விரிவைச் சுருக்காமல் பிரதான உரையில் பயன்படுத்தப்படுகிறது; ‘நியாயம்’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்தின் கண்ணியமான கவிதை நடையையும் இணையான இரு வினாக்களின் அமைப்பையும் பேணும் மொழிபெயர்ப்பு. தேவனை நோக்கிய மரியாதைமிக்க ஒருமை வடிவமாக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது.
