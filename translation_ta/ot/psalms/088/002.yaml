  text: תָּב֣וֹא לְ֭/פָנֶי/ךָ תְּפִלָּתִ֑/י הַטֵּֽה אָ֝זְנְ/ךָ֗ לְ/רִנָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/002.yaml
  text: May my prayer come before you[b][a]; incline your ear to my cry.
translation:
  language: ta
  text: என் மன்றாட்டு உமது முன்னிலைக்கு வருவதாக[a][b]; என் கூக்குரலுக்கு உமது செவியைச் சாய்த்தருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மன்றாட்டு உமது முன்னிலைக்கு வரட்டும்.”
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், “உமது முகத்திற்கு முன்பாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: வருவதாக
  rationale: בוא என்பதன் Qal முற்றுப்பெறா வடிவம், இந்த மன்றாட்டுச் சூழலில் எதிர்காலக் கூற்றாக அல்லாமல் வேண்டுகோள் நயத்துடன் வருகிறது. தமிழ் மொழியில் ‘வருவதாக’ அந்த வேண்டுதல் நயத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְפָנֶיךָ
  choice: உமது முன்னிலைக்கு
  rationale: சொல்லுக்கு சொல் ‘உமது முகத்திற்கு முன்பாக’ என்றாலும், இது ஒருவரின் சந்நிதி அல்லது முன்னிலையை அடைவதைக் குறிக்கும் எபிரேய மரபுத்தொடர். ‘உமது முன்னிலைக்கு’ என்பது இயல்பான தமிழில் அந்த நேரடி அணுகுதலைத் தக்கவைக்கிறது.
- source_word: תְּפִלָּתִי
  choice: என் மன்றாட்டு
  rationale: תפלה என்பதன் அடிப்படைப் பொருள் ‘ஜெபம்/மன்றாட்டு.’ இப்புலம்பல் சங்கீதத்தின் வேண்டுதல் நயத்தை ‘மன்றாட்டு’ தெளிவாகக் காட்டுகிறது; அதேவேளையில் பொருளை ‘கெஞ்சுதல்’ என மிகைப்படுத்தவில்லை.
- source_word: הַטֵּה
  choice: சாய்த்தருளும்
  rationale: נטה என்பதன் Hiphil கட்டளை வடிவம் ‘சாய்த்தல், திருப்புதல், நீட்டுதல்’ என்பதைக் குறிக்கிறது. ‘செவி’ என்பதுடன் ‘சாய்த்தருளும்’ என்பது கவனமாகக் கேட்கும் உருவகத்தை இயல்பான, மதிப்புமிக்க தமிழில் காக்கிறது.
- source_word: אָזְנְךָ
  choice: உமது செவியை
  rationale: எபிரேய மூலத்திலுள்ள ஒருமை ‘செவி’ தக்கவைக்கப்பட்டுள்ளது; இது கவனித்துக் கேட்பதற்கான மரபான உருவகம்.
- source_word: לְרִנָּתִי
  choice: என் கூக்குரலுக்கு
  rationale: רנה என்பது ஒலித்தெழும் அழுகுரல், முழக்கம் அல்லது களிப்பொலி ஆகியவற்றைக் குறிக்கலாம். சங்கீதம் 88-ன் புலம்பல் சூழலில் ‘கூக்குரல்’ துயரத்திலிருந்து எழும் உரத்த அழைப்பை வெளிப்படுத்துகிறது; மகிழ்ச்சி என்ற பொருளைத் தேவையின்றி சேர்ப்பதில்லை.
