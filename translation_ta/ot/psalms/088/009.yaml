source:
  edition: WLC
  text: עֵינִ֥/י דָאֲבָ֗ה מִנִּ֫י עֹ֥נִי קְרָאתִ֣י/ךָ יְהוָ֣ה בְּ/כָל י֑וֹם שִׁטַּ֖חְתִּי אֵלֶ֣י/ךָ כַפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/009.yaml
  text: My eye grows weak because of affliction; I call on you every day[a], O Yahweh; I spread out my hands to you.
translation:
  language: ta
  text: துன்பத்தால் என் கண் வாடுகிறது[a]. யாவே, நாள்தோறும் உம்மை நோக்கிக் கூப்பிடுகிறேன்; உம்மை நோக்கி என் கைகளை விரிக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துன்பத்தால் என் கண் சோர்ந்து போகிறது”; அல்லது, “துயரத்தால் என் கண் வேதனையடைகிறது.”
    reason: דָאֲבָה என்பதற்கு வாடுதல், சோர்தல், வேதனையடைதல் ஆகிய அர்த்த நிழல்கள் இருக்கலாம்; மூலத்தின் சொற்பொருள் பரப்பைப் பாதுகாக்க மாற்று மொழியாக்கங்கள் தரப்படுகின்றன.
lexical_decisions:
- source_word: עֵינִי
  choice: என் கண்
  rationale: எபிரெய மூலத்தில் ஒருமை உள்ளது. பார்வையையோ ஒருவரின் உயிர்த்துடிப்பையோ குறிக்கும் கவித்துவமான சொல்லாட்சியைத் தமிழிலும் ஒருமையாகப் பாதுகாக்கிறது.
- source_word: דָאֲבָה
  choice: சோர்ந்துபோகிறது
  rationale: இவ்வினை துன்பத்தால் மெலிதல், வாடுதல், வேதனைப்படுதல் ஆகிய அர்த்த நிழல்களைக் கொண்டது. ‘சோர்ந்துபோகிறது’ என்பது உடல் வலியை மட்டும் குறிப்பதாகச் சுருக்காமல் பொதுவான நலிவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: מִנִּי עֹנִי
  choice: துன்பத்தினால்
  rationale: מִנִּי இங்கு காரணத்தையோ மூலத்தையோ சுட்டுகிறது; עֹנִי சங்கீதத்தின் வேதனைச் சூழலில் ‘துன்பம்’ என்று இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: קְרָאתִיךָ
  choice: உம்மை நோக்கிக் கூப்பிடுகிறேன்
  rationale: ‘நாள்தோறும்’ என்பதுடன் இச்செயல் வழக்கமாகத் தொடர்வதை நிகழ்காலம் காட்டுகிறது. ‘உம்மை நோக்கி’ என்பது வேண்டுதலாக அழைக்கும் திசையையும் உறவையும் தெளிவாக்குகிறது; மூலத்தில் இல்லாத கூடுதல் தீவிரத்தைச் சேர்க்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர். அதன் வழக்கமான ஒலிபெயர்ப்பைத் தமிழில் ‘யாவே’ என வழங்குகிறது.
- source_word: בְּכָל יוֹם
  choice: நாள்தோறும்
  rationale: ஒவ்வொரு நாளும் திரும்பத் திரும்ப நடைபெறும் செயலைச் சுட்டுகிறது; ஒரே நாளின் முழு நேரத்தையும் குறிக்கும் ‘நாள் முழுவதும்’ என்பதைக் காட்டிலும் துல்லியமானது.
- source_word: שִׁטַּחְתִּי
  choice: விரிக்கிறேன்
  rationale: மன்றாட்டில் கைகளை விரிக்கும் உடல் அசைவைக் குறிக்கிறது. தமிழில் ‘கைகளை விரிக்கிறேன்’ என்பது இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: כַפָּי
  choice: என் கைகளை
  rationale: சொல்லின் நேரடி பொருள் உள்ளங்கைகள் என்றாலும், ஜெபச் சைகையைத் தமிழில் இயல்பாகக் குறிப்பிட ‘கைகள்’ பொருத்தமானது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல், பரவலாக ஏற்கப்படும் உச்சரிப்பைத் தமிழில் ஒலிபெயர்த்து வழங்குவது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமான கண்ணியத்துடன், பொதுவாசகருக்கு எளிதாக அமைக்கப்பட்டது. எபிரெய ஒருமையான ‘என் கண்’ பாதுகாக்கப்பட்டுள்ளது. தேவனை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது; தொடர்ச்சியான தினசரி வேண்டுதலை இயல்பான தமிழ் நிகழ்காலம் வெளிப்படுத்துகிறது.
