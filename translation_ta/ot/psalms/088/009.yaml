  to: துன்பத்தால் என் கண் வாடுகிறது[a]. யாவே, நாள்தோறும் உம்மை நோக்கிக் கூப்பிடுகிறேன்; உம்மை நோக்கி என் கைகளை விரிக்கிறேன்.
