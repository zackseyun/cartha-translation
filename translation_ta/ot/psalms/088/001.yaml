source:
  edition: WLC
  text: יְ֭הוָה אֱלֹהֵ֣י יְשׁוּעָתִ֑/י יוֹם צָעַ֖קְתִּי בַ/לַּ֣יְלָה נֶגְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/001.yaml
  text: O Yahweh[a], God of my salvation, by day I cry out; at night I am before you.
translation:
  language: ta
  text: 'யாவே, என் மீட்பின் கடவுளே,


    பகலில் நான் கூக்குரலிட்டேன்;


    இரவில் உமக்கு முன்பாக இருக்கிறேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்படி, “இரவில் உமக்கு முன்பாக”; இத்தொடரில் வினைச்சொல் இல்லை. தமிழில் தெளிவுக்காக “இருக்கிறேன்” சேர்க்கப்பட்டுள்ளது.
    reason: மூலத்தின் வினையற்ற கவிதைத் தொடரையும் மொழிபெயர்ப்பில் சேர்க்கப்பட்ட வினையையும் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரைத் தலைப்புச் சொல்லாக மாற்றாமல், எபிரெய உச்சரிப்புக்கு நெருக்கமான நவீனத் தமிழ் வடிவில் நேரடியாக வழங்குகிறது.
- source_word: אֱלֹהֵי יְשׁוּעָתִי
  choice: என் மீட்பின் கடவுளே
  rationale: இணைப்புநிலைத் தொடரான ‘என் மீட்பின் கடவுள்’ என்பதைப் பாதுகாக்கிறது; ‘மீட்பு’ என்பது காப்பாற்றுதல், விடுவித்தல் ஆகிய பொருள் பரப்பை தேவையின்றிக் குறுக்காமல் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יוֹם
  choice: பகலில்
  rationale: அடுத்து வரும் ‘இரவில்’ என்பதுடன் உள்ள கால வேறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צָעַקְתִּי
  choice: நான் கூக்குரலிடுகிறேன்
  rationale: צעק என்பதிலுள்ள அவசரமும் வேதனையும் ‘கூக்குரலிடு’ என்பதால் வெளிப்படுகிறது. எபிரெய நிறைவுவினை வடிவம் கடந்த செயலைக் குறிக்கக்கூடியதாயினும், தொடரும் புலம்பல்-மன்றாட்டு சூழலில் நிகழ்காலம் பொருத்தமானது.
- source_word: בַלַּיְלָה
  choice: இரவில்
  rationale: ‘பகலில்’ என்பதற்கு இணையான இயல்பான காலக் குறிப்பாக வழங்கப்படுகிறது.
- source_word: נֶגְדֶּךָ
  choice: உமக்கு முன்பாக இருக்கிறேன்
  rationale: எபிரெயில் சொற்பட ‘உமக்கு முன்பாக’ என்றே உள்ளது. முழுமையான தமிழ் வாக்கியத்திற்காக ‘இருக்கிறேன்’ சேர்க்கப்பட்டுள்ளது; அது தனி அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பெயரை பொதுப் பட்டமாக மாற்றாமல் பாதுகாக்கிறது; ஒரு குறிப்பிட்ட சமய மரபின் வழக்கைத் திணிக்காமல், ஏற்றுக்கொள்ளப்பட்ட எபிரெய ஒலிப்புக்கு நெருக்கமான வடிவைப் பயன்படுத்துகிறது.
- issue: אֱלֹהֵי יְשׁוּעָתִי என்ற தொடரின் உறவு
  choice: என் மீட்பின் கடவுளே
  alternative: என்னை மீட்கும் கடவுளே; என் மீட்பாகிய கடவுளே
  rationale: மாற்றுகள் தேவன் மீட்பைச் செய்கிறார் அல்லது தேவனே மீட்பு என்று உறவைத் தெளிவுபடுத்துகின்றன; மூல இணைப்புநிலைத் தொடர் அந்த உறவை அவ்வளவு குறிப்பாக வரையறுக்காததால் அதன் இறுக்கத்தையும் திறந்த தன்மையையும் முதன்மை உரை காக்கிறது.
- issue: צָעַקְתִּי என்பதன் காலநிலை
  choice: நான் கூக்குரலிடுகிறேன்
  alternative: நான் கூக்குரலிட்டேன்
  rationale: எபிரெய நிறைவுவினை கடந்த அல்லது நிறைவுற்ற பார்வையை அனுமதிக்கிறது; ஆனால் சங்கீதப் புலம்பலில் தொடரும் அழுகுரலை நிகழ்காலத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது. மாற்று வாசிப்பு இலக்கண ரீதியாகச் சாத்தியமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனை நோக்கும் மரியாதை ஒருமைக்காக ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. கவிதை வரிப்பிரிப்பும் பகல்–இரவு இணை அமைப்பும் காக்கப்பட்டுள்ளன; பழமையான அல்லது குறிப்பிட்ட திருச்சபை மரபோடு மிக நெருக்கமாக இணைந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
