  source_fidelity: 'The translation accurately represents the Hebrew: the direct second-person divine agency in שַׁתַּנִי is retained; בּוֹר remains the non-interpretive image “குழி”; תַּחְתִּיּוֹת is conveyed as extreme depth; and the parallel locative images of darkness and depths are preserved. It does not prematurely identify the pit as a grave or underworld.'
  naturalness: “நீர் என்னை மிக ஆழமான குழியில், இருண்ட இடங்களில், ஆழங்களில் வைத்தீர்” is natural, dignified modern standard Tamil. The final verb appropriately governs all three locative phrases, and the sequence preserves the compact poetic parallelism.
  terminology: “குழி,” “இருண்ட இடங்கள்,” and “ஆழங்கள்” are suitable, clear terms that retain the Hebrew imagery and its ambiguity. The respectful address “நீர்/வைத்தீர்” fits the psalm’s prayer register without adding doctrinal interpretation.
