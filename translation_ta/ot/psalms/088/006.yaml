  text: שַׁ֭תַּ/נִי בְּ/ב֣וֹר תַּחְתִּיּ֑וֹת בְּ֝/מַחֲשַׁכִּ֗ים בִּ/מְצֹלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/006.yaml
  text: You have put me in the lowest pit[a], in dark places, in the depths.
translation:
  language: ta
  text: நீர் என்னை மிக ஆழமான குழியில்[a], இருண்ட இடங்களில், ஆழங்களில் வைத்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அடிமட்டக் குழியில், இருள்களில், ஆழமான இடங்களில் நீர் என்னை வைத்தீர்.’
    reason: ‘மிக ஆழமான’, ‘இருண்ட இடங்கள்’, ‘ஆழங்கள்’ என்பவற்றுக்குப் பின்னுள்ள எபிரெயப் பன்மை மற்றும் இடவியல் சொற்களை மேலும் சொல்லுக்குச் சொல் நெருக்கமாகக் காட்டும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: שַׁתַּנִי
  choice: நீர் என்னை … வைத்தீர்
  rationale: இது ‘வை, அமர்த்து’ என்ற பொருளுடைய வினையின் இரண்டாம் நபர் ஆண்பால் ஒருமை எழுவாயையும் முதலாம் நபர் ஒருமை செயப்படுபொருளையும் நேரடியாகக் காட்டுகிறது. தமிழில் இயல்பாக அமைய வினை வசனத்தின் இறுதியில் வைக்கப்பட்டுள்ளது; கடவுளை நோக்கிய நேரடி குற்றமுறையீடும் தக்கவைக்கப்பட்டுள்ளது.
- source_word: בְּבוֹר
  choice: குழியில்
  rationale: இந்தச் சொல் குழி, நீர்த்தொட்டி அல்லது சிறைபோன்ற பள்ளத்தைக் குறிக்கலாம். மரணம் மற்றும் பாதாளத்தை நினைவூட்டும் கவிதைப் பின்னணியைத் தக்கவைத்தபடியே, அதை நேரடியாக ‘கல்லறை’ அல்லது ‘பாதாளம்’ என்று விளக்கிவிடாமல் ‘குழி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: תַּחְתִּיּוֹת
  choice: மிக ஆழமான
  rationale: ‘கீழ்ப்பகுதிகள், மிகவும் கீழான இடங்கள்’ என்ற உச்ச ஆழத்தின் கருத்தை இயல்பான நவீன தமிழில் ‘மிக ஆழமான’ என்று குழியை விவரிக்கும் வகையில் வழங்குகிறது.
- source_word: בְּמַחֲשַׁכִּים
  choice: இருண்ட இடங்களில்
  rationale: எபிரெயச் சொல்லின் பன்மை வடிவம் சித்தரிக்கும் பல இருண்ட இடங்களின் படிமத்தைத் தக்கவைக்கிறது; அதை வெறும் கருத்தியல் ஒருமையான ‘இருளில்’ என்று சுருக்கவில்லை.
- source_word: בִּמְצֹלוֹת
  choice: ஆழங்களில்
  rationale: ஆழமான நீர்நிலைகளையோ அதலமான இடங்களையோ குறிக்கக்கூடிய பன்மைச் சொல்லின் கவிதைப் படிமத்தையும் தெளிவின்மையையும் ‘ஆழங்களில்’ என்பது சுருக்கமாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: புலம்பலில் கடவுளின் நேரடி செயலாண்மை
  choice: ‘நீர் என்னை … வைத்தீர்’ என்ற நேரடி இரண்டாம் நபர் உரை தக்கவைக்கப்பட்டது.
  alternative: கடவுளின் செயலாண்மையை மென்மைப்படுத்தும் செயப்பாட்டு அல்லது ஆளற்ற வடிவம்.
  rationale: சங்கீதக்காரரை இந்த நிலையில் வைத்தவர் கடவுளே என்று எபிரெயம் நேரடியாக உரைக்கிறது. புலம்பலின் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் அப்படியே பாதுகாக்க இந்த நேரடி உரை அவசியம்.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கவிதைத் தன்மையும் கண்ணியமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதை ஒருமையாக ‘நீர்/வைத்தீர்’ அமைந்துள்ளது; மூன்று இடக்குறிப்புகளையும் ஒரே எபிரெய வினையுடன் இணைக்க தமிழில் அந்த வினை இறுதியில் வைக்கப்பட்டுள்ளது.
