translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் வாசிப்புத் தெளிவும் கொண்ட சங்கீதத் தலைப்பு நடை பயன்படுத்தப்பட்டது. உறுதியற்ற இசைத் தொழில்நுட்பச் சொற்கள் ஒலிபெயர்க்கப்பட்டு, விளக்க மாற்றுகள் அடிக்குறிப்புகளில் வைக்கப்பட்டன. எல்லா அடிக்குறிப்பு குறியீடுகளும் அவற்றுக்குரிய சொற்றொடர்களுக்குப் பின்பே அமைக்கப்பட்டுள்ளன.
