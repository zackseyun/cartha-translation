  text: 'A song. A psalm of the sons of Korah. For the choirmaster: according to Mahalath Leannoth[a]. A Maskil[b] of Heman the Ezrahite.'
translation:
  language: ta
  text: 'ஒரு பாடல். கோராவின் மகன்களின் சங்கீதம். இசைத்தலைவருக்கு: மகலாத் லெயன்னோத்[a] முறைப்படி. எஸ்ராகியரான ஏமானின் மஸ்கீல்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகலாத் லெயன்னோத்” என்ற சொற்றொடரின் பொருள் உறுதியில்லை. அது ஓர் இசைமெட்டையோ இசைப்பாணியையோ குறிக்கலாம். “மகலாத் மெட்டில், மாறிமாறிப் பாடுவதற்காக” அல்லது “மகலாத் மெட்டில், துன்பத்தைப் பற்றி” என்பனவும் முன்மொழியப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: b
    text: “மஸ்கீல்” என்பது சங்கீதத் தலைப்புகளில் வரும் ஒரு தொழில்நுட்பச் சொல்; பொதுவாக அறிவுறுத்தும் அல்லது தியானத்துக்குரிய படைப்பு என்று புரிந்துகொள்ளப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: ஒரு பாடல்
  rationale: சங்கீதத் தலைப்பில் வரும் இலக்கிய வகைப்பாட்டுச் சொல்; இயல்பான நவீனத் தமிழில் நேரடியாக மொழிபெயர்க்கப்பட்டது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையுடன் பாடப்படும் சங்கீதத்தைக் குறிக்கும் வழக்கமான தலைப்புச் சொல்; தமிழில் நிலைபெற்றதும் தெளிவானதுமான இணைச்சொல்.
- source_word: לִבְנֵי קֹרַח
  choice: கோராகின் மகன்களுடைய
  rationale: לְ என்னும் முன்னொட்டு படைப்புரிமை, தொடர்பு அல்லது அர்ப்பணிப்பைக் குறிக்கக்கூடும்; “மகன்களுடைய” என்பது அந்த உறவை ஒரு பொருளுக்குள் மட்டுப்படுத்தாமல் சுருக்கமாகக் காட்டுகிறது.
- source_word: לַמְנַצֵּחַ
  choice: இசைத்தலைவருக்கு
  rationale: இசை நிகழ்த்தலை வழிநடத்துபவரைக் குறிக்கும் சங்கீதத் தலைப்பின் தொழில்நுட்பச் சொல்; புரிந்துகொள்ள எளிய தற்போதைய தமிழ்.
- source_word: עַל
  choice: முறைப்படி
  rationale: இசைத் தலைப்புகளில் இசைமெட்டு, பாணி அல்லது நிகழ்த்தும் முறையை அறிமுகப்படுத்தலாம்; துல்லியமான தொழில்நுட்பப் பொருளைத் தீர்மானிக்காமல் அதன் செயல்பாட்டைக் காட்டுகிறது.
- source_word: מָחֲלַת לְעַנּוֹת
  choice: மகலாத் லெயன்னோத்
  rationale: இச்சொற்றொடரின் துல்லியமான பொருள் உறுதியில்லை; ஊகமான மொழிபெயர்ப்பை முதன்மை உரையில் திணிக்காமல் ஒலிபெயர்த்து, மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டன.
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: பொருள் முழுமையாக உறுதிசெய்யப்படாத சங்கீதத் தலைப்புத் தொழில்நுட்பச் சொல்; அதன் தெளிவின்மையைப் பாதுகாக்க ஒலிபெயர்க்கப்பட்டது.
- source_word: לְהֵימָן
  choice: ஏமானின்
  rationale: לְ படைப்புரிமையையோ தொடர்பையையோ குறிக்கலாம்; தமிழ் உடைமை வடிவம் இந்த உறவை இயல்பாகவும் அளவுக்கு மீறித் தீர்மானிக்காமலும் வெளிப்படுத்துகிறது.
- source_word: הָאֶזְרָחִי
  choice: எஸ்ராகியனான
  rationale: ஏமானை அடையாளப்படுத்தும் இன/குடிப்பெயர் அல்லது பட்டம்; எபிரெய மெய்யெழுத்து வடிவத்தை ஒட்டிய ஒலிபெயர்ப்பு.
