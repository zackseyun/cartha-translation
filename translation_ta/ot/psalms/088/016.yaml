    issue: The phrase “வெள்ளம்போல்” adds a flood comparison absent from the Hebrew text.
    rationale: Although the context supports an overwhelming image, the source verb means “passed over/crossed over.” A flood simile is an additional concrete image and should not be placed in the main translation.
  - severity: low
    issue: “அழித்துவிட்டன” adds a slightly stronger completed-result nuance.
    rationale: The Hebrew perfect supports a past rendering, but plain “அழித்தன” is closer and retains the psalm’s poetic extremity without unnecessary aspectual expansion.
