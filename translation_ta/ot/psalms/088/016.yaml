  yaml_path: translation/ot/psalms/088/016.yaml
  text: Your burning anger swept over me[c][b][a]; your terrors destroyed me.
translation:
  language: ta
  text: உமது கொதிக்கும் கோபம் என்மேல் கடந்தது[a][b]; உமது பயங்கரங்கள் என்னை அழித்தன[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “என்மேல் கடந்தது” என்பதற்கு மாற்றாக, “என்மேல் வீசியடித்தது” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “கடந்தது,” ஆனால் சூழல் அடக்க முடியாத பேராற்றலை உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: “கொதிக்கும் கோபம்” என்பது வெம்மை அல்லது எரிதலோடு தொடர்புடைய எபிரெயச் சொல்லை மொழிபெயர்க்கிறது; இதை “கடும் சினம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “அழித்தன” என்பதற்கு மாற்றாக, “என்னை அறுத்துப்போட்டன” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי עָבְרוּ
  choice: என்மேல் வெள்ளம்போல் கடந்தது
  rationale: עָבְרוּ என்பதன் அடிப்படைப் பொருள் ‘கடந்தன’; சூழலில் கோபம் சங்கீதக்காரரை மூழ்கடிக்கும் வலிமையுடன் அவர்மேல் கடந்து செல்வதை உணர்த்துகிறது. ‘வெள்ளம்போல்’ என்பது இயக்க உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; அடிப்படை வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: חֲרוֹנֶיךָ
  choice: உமது கொதிக்கும் கோபம்
  rationale: חרון வெம்மை அல்லது எரிதலுடன் தொடர்புடைய தீவிரக் கோபத்தைக் குறிக்கிறது. எபிரெயப் பன்மை இங்கு தீவிரத்தைக் காட்டும் தொகுப்புப் பொருளாக இருப்பதால் தமிழில் ஒருமையாக மொழிபெயர்க்கப்படுகிறது.
- source_word: בִּעוּתֶיךָ
  choice: உமது பயங்கரங்கள்
  rationale: இந்தப் பெயர்ச்சொல் அச்சத்தையும் திகிலையும் உண்டாக்குபவற்றைக் குறிக்கிறது. ‘பயங்கரங்கள்’ மூலத்தின் பன்மையையும் கவிதைத் தீவிரத்தையும் காக்கிறது.
- source_word: צִמְּתוּתֻנִי
  choice: என்னை அழித்துவிட்டன
  rationale: צמת அழித்தல் அல்லது அறுத்துப்போடுதல் எனப் பொருள்படும். ‘அழித்துவிட்டன’ புலம்பலின் தீவிரத்தையும் நிறைவுற்ற அழிவுணர்வையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
