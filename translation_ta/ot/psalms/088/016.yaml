translation_notes:
  register: நவீன தரத் தமிழில், மரியாதைமிக்க இறைமுகப்பிற்காக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் தீவிரமான புலம்பல், இயக்க உருவகம், பன்மை ‘பயங்கரங்கள்’ ஆகியவை காக்கப்பட்டுள்ளன; வாசிப்பின் இயல்புக்காக வினைச்சொல் ஒத்திசைவு தமிழுக்கு ஏற்ப அமைக்கப்பட்டுள்ளது.
