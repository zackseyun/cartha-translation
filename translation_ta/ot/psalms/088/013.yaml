  text: But as for me[a], O Yahweh, I cry out to you; in the morning my prayer comes before you.
translation:
  language: ta
  text: ஆனால் நானோ, யாவே, உம்மை நோக்கி உதவிக்காகக் கூக்குரலிட்டேன்; காலையில் என் மன்றாட்டு உம்முன் வருகிறது.[a]
  philosophy: optimal-equivalence
