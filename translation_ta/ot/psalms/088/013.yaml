lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: இணைப்புச்சொல்லும் தனித்த சுட்டுப்பெயரும் சேர்ந்து முந்தைய சூழலுக்கு மாறான வலியுறுத்தலைத் தருகின்றன; ‘நானோ’ அந்த வலியுறுத்தலை இயல்பான தமிழில் காக்கிறது.
- source_word: אֵלֶיךָ
  choice: உம்மை நோக்கி
  rationale: கூக்குரலின் திசையும் அது யாவேக்கே உரியது என்பதும் தமிழில் தெளிவாக வெளிப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: שִׁוַּעְתִּי
  choice: உதவிக்காகக் கூக்குரலிடுகிறேன்
  rationale: இந்த வினை வெறும் அழைப்பை அல்ல, உதவி வேண்டி எழுப்பும் தீவிரக் கூக்குரலைக் குறிக்கிறது; சங்கீதத்தின் தொடரும் வேண்டுதலை நிகழ்கால வடிவம் இயல்பாகக் காட்டுகிறது.
- source_word: וּבַבֹּקֶר
  choice: காலையில்
  rationale: குறிப்பிட்ட காலப்பொழுதை நேரடியாகவும் இயல்பாகவும் தருகிறது; தமிழில் அரைப்புள்ளிக்குப் பின் இணைப்புச்சொல்லை மீண்டும் இடத் தேவையில்லை.
- source_word: תְּפִלָּתִי
  choice: என் மன்றாட்டு
  rationale: ஒருமையைத் தக்கவைத்து, தேவனை நோக்கிய வேண்டுதல் என்ற பொருளை dignified, பொதுவான தமிழில் தருகிறது.
- source_word: תְקַדְּמֶךָּ
  choice: உம்முன் வந்து சேர்கிறது
  rationale: קדם வேரின் ‘முன் வருதல், சந்தித்தல், முந்துதல்’ என்ற பொருள் வளையத்தில், மன்றாட்டு தேவனுடைய முன்னிலையை அடைவதைக் குறிக்கும் இயல்பான தமிழ் வடிவம் இது; பிற சாத்தியங்களை அடிக்குறிப்பு காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் ஒரு பட்டம் அல்ல, உடன்படிக்கையின் தனிப்பெயரே நேரடியாக உள்ளது; ஆகவே அதை பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: שִׁוַּעְתִּי வினையின் காலநிலை
  choice: கூக்குரலிடுகிறேன்
  alternative: கூக்குரலிட்டேன்
  rationale: எபிரெய நிறைவுவடிவம் கடந்த செயலைக் குறிக்கக்கூடியதாயினும், இங்குள்ள கவிதை வேண்டுதலில் சங்கீதக்காரரின் தொடரும் செயலை நிகழ்காலம் இயல்பாக வெளிப்படுத்துகிறது; கடந்தகாலச் சாத்தியத்தைத் தத்துவ முடிவால் நிராகரிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைக்கும் ‘உம்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘ஜெபம்’ என்பதற்குப் பதிலாகப் பரந்த வாசகர்களுக்கும் இயல்பான, செம்மையான ‘மன்றாட்டு’ தேர்ந்தெடுக்கப்பட்டுள்ளது; தீவிர உதவி வேண்டுதலைத் தெளிவாக்க ‘உதவிக்காகக் கூக்குரலிடுகிறேன்’ பயன்படுத்தப்பட்டுள்ளது.
