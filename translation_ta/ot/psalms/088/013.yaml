    text: அல்லது, “என் மன்றாட்டு உம்மைச் சந்திக்கிறது” அல்லது “உமக்கு முன்பாகச் செல்கிறது.” எபிரெய வினை முன் வருதல், சந்தித்தல், அல்லது முந்திச் செல்லுதல் ஆகிய பொருள்களைக் கொள்ளலாம்.
