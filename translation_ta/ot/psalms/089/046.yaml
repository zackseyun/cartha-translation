source:
  edition: WLC
  text: עַד מָ֣ה יְ֭הוָה תִּסָּתֵ֣ר לָ/נֶ֑צַח תִּבְעַ֖ר כְּמוֹ אֵ֣שׁ חֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/046.yaml
  text: How long[a], O Yahweh? Will you hide yourself forever? Will your wrath burn like fire?
translation:
  language: ta
  text: எவ்வளவு காலம், யாவே[a]? என்றென்றும் உம்மை மறைத்துக்கொள்வீரோ? உமது கடுஞ்சினம் நெருப்பைப்போல் எரியுமோ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “YHWH”; மரபாக “கர்த்தர்” அல்லது “ஆண்டவர்” என வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מָה
  choice: எதுவரை
  rationale: துன்பம் எவ்வளவு காலம் நீடிக்கும் என்று அவசரமாகக் கேட்கும் எபிரெயப் புலம்பல் மரபுத்தொடரை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் தேவனுடைய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: תִּסָּתֵר
  choice: உம்மை மறைத்துக்கொள்வீரோ
  rationale: நிஃபால் வடிவத்தின் இச்சூழலுக்குரிய தற்சார்பு உணர்வைத் தக்கவைத்து, தேவன் தம்மை மறைத்துக்கொண்டிருப்பதாகப் பாடகர் உணர்வதை இயல்பான தமிழில் கூறுகிறது.
- source_word: לָנֶצַח
  choice: என்றென்றும்
  rationale: முடிவில்லாத நீடிப்பைச் சுட்டும் சொல்லை புலம்பலின் தீவிரத்துடன் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: תִּבְעַר
  choice: எரியுமோ
  rationale: ‘எரி’ என்ற அடிப்படைப் பொருளையும் தொடரும் நெருப்பு உருவகத்தையும் தக்கவைக்கிறது; ‘அழிக்கும்’ என்று கூடுதல் பொருள் சேர்க்கவில்லை.
- source_word: כְּמוֹ אֵשׁ
  choice: நெருப்பைப்போல்
  rationale: எளிய உவமையை நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
- source_word: חֲמָתֶךָ
  choice: உமது கடுஞ்சினம்
  rationale: வெம்மைமிக்க தீவிரக் கோபத்தைக் குறிக்கும் எபிரெயச் சொல்லை, உயர்ந்தாலும் இன்றைய வாசகர்களுக்குப் புரியும் தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: YHWH என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / ஆண்டவர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கையின் தனிப்பெயரைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது; மரபுவழி மாற்றீடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: தேவன் மறைந்திருப்பதாகக் கூறும் புலம்பல்
  choice: உம்மை மறைத்துக்கொள்வீரோ
  alternative: மறைந்திருப்பீரோ
  rationale: தேவன் உண்மையில் இல்லாதவர் என்று முடிவுசெய்யாமல், அவர் தம்மை மறைத்துக்கொண்டதாகப் பாடகர் அனுபவிக்கும் வேதனையையும் மூலத்தின் தற்சார்பு/செயப்பாட்டு நுணுக்கத்தையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான நேரடி அழைப்பும் தொடர்ச்சியான வினாக்களும் பயன்படுத்தப்பட்டுள்ளன. ‘உமது/உம்மை’ என்ற மரியாதை ஒருமை இறைமுகப் பதிவை நிலைநிறுத்துகிறது. அடிக்குறிப்பு குறியீடு அதற்குரிய ‘யாவே’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
