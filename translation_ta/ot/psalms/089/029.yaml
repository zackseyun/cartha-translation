  text: וְ/שַׂמְתִּ֣י לָ/עַ֣ד זַרְע֑/וֹ וְ֝/כִסְא֗/וֹ כִּ/ימֵ֥י שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/029.yaml
  text: I will establish his offspring forever[a], and his throne as the days of heaven.
translation:
  language: ta
  text: அவருடைய சந்ததியை என்றென்றும் நிலைநிறுத்துவேன்; அவருடைய அரியணையை வானத்தின் நாட்களைப்போல்[a] நிலைநிறுத்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதை இயல்பான பொருளில், “வானம் நிலைத்திருக்கும் காலமெல்லாம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: நிலைநிறுத்துவேன்
  rationale: שׂים என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்’ என்றாலும், உடன்படிக்கை வாக்குறுதியின் சூழலில் சந்ததியை நீடித்து உறுதிப்படுத்துதல் என்ற பொருளை ‘நிலைநிறுத்துவேன்’ இயல்பாகத் தருகிறது.
- source_word: לָעַד
  choice: என்றென்றும்
  rationale: நீடித்த நிரந்தரத்தைக் குறிக்கும் לָעַד என்பதன் வலிமையை நவீனத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: זַרְעוֹ
  choice: அவருடைய சந்ததி
  rationale: זֶרַע ஒருமை வடிவில் இருந்தாலும் கூட்டுப்பொருளில் வழித்தோன்றல்களைக் குறிக்கலாம்; ‘சந்ததி’ அந்தக் கூட்டு ஒருமையையும் உடன்படிக்கைத் தொடர்பையும் காக்கிறது.
- source_word: וְכִסְאוֹ
  choice: அவருடைய அரியணை
  rationale: כִּסֵּא என்பதற்கான நேரான அரசாட்சிசார் தமிழ் இணை ‘அரியணை’.
- source_word: כִּימֵי
  choice: நாட்களைப்போல்
  rationale: כְּ ஒப்புமையையும் יְמֵי என்ற ‘நாட்கள்’ உருவகத்தையும் வெளிப்படையாகப் பேணுகிறது.
- source_word: שָׁמָיִם
  choice: வானம்
  rationale: எபிரெய வடிவம் பன்மையாக இருந்தாலும் இச்சூழலில் முழு வானவெளியைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் ‘வானம்’; ‘வானத்தின் நாட்கள்’ என்ற மூல உருவகமும் பேணப்படுகிறது.
theological_decisions:
- issue: தாவீதிய உடன்படிக்கை வாக்குறுதியின் காலநீட்சி
  choice: ‘என்றென்றும்’ என்றும் ‘வானத்தின் நாட்களைப்போல்’ என்றும் வலிமையான நீட்சி மொழியைப் பேணுதல்
  alternative: ‘வானம் நிலைத்திருக்கும் காலமெல்லாம்’ என்று முழுமையாகப் பொருள்விரித்தல் அல்லது குறிப்பிட்ட தலைமுறைகளாக வரையறுத்தல்
  rationale: வசனம் தரும் நிரந்தர வாக்குறுதியையும் கவித்துவ ஒப்புமையையும் எந்தக் குறிப்பிட்ட இறுதிக்கால அல்லது வம்சவழிக் கோட்பாட்டினாலும் தீர்மானிக்காமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் கண்ணியமான கவித்துவ நடை. முதல் அடியில் உள்ள ஒரே வினை இரண்டாம் அடியிலும் பொருந்தினாலும், தமிழில் தெளிவும் இயல்பும் அமைய ‘நிலைத்திருக்கச் செய்வேன்’ என்று நிரப்பப்பட்டுள்ளது; அடிக்குறி மூலத்தின் ‘வானத்தின் நாட்கள்’ என்ற காலநீட்சி உருவகத்திற்கான இயல்பான மாற்றை வழங்குகிறது.
