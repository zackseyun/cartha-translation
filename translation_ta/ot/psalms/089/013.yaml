  text: Yours is an arm with might[a]; your hand is strong; your right hand is exalted.
translation:
  language: ta
  text: வல்லமைமிக்க புயம் உமக்குரியது; உமது கை வலிமையானது; உமது வலக்கரம் உயர்ந்திருக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமக்கு வல்லமையுள்ள புயம் உண்டு; உமது கை வலிமையாயிருக்கிறது; உமது வலக்கரம் உயர்ந்து நிற்கிறது.”
    reason: 'சொற்பொருள் மாற்றுவாய்ப்பு: לְךָ, תָּעֹז, תָּרוּם ஆகியவற்றின் உடைமை, வலிமைநிலை, உயர்வு ஆகிய நிழற்பொருள்களைப் பதிவு செய்கிறது.'
lexical_decisions:
- source_word: לְךָ
  choice: உமக்குரியது
  rationale: வசனத்தின் தொடக்கத்தில் வலியுறுத்தப்பட்டுள்ள உடைமைப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘உம்மிடம் உள்ளது’ என்பதைக் காட்டிலும் கவிதைநயம் காக்கப்படுகிறது.
- source_word: זְרוֹעַ
  choice: புயம்
  rationale: இறைவனுடைய ஆற்றலைக் குறிக்கும் எபிரெய உருவகத்தை அருவமான ‘வல்லமை’ என்று மாற்றாமல், உடலுறுப்பு உருவகமாகவே காக்கிறது.
- source_word: עִם גְּבוּרָה
  choice: வல்லமையுள்ள
  rationale: புயத்துடன் இணைந்த வல்லமை அல்லது அதனைச் சிறப்பிக்கும் தன்மையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: תָּעֹז
  choice: வலிமையானது
  rationale: வினையின் ‘வலிமையாய் இருத்தல்’ என்ற predicative பொருளை, அடுத்துவரும் ‘உமது கை’ என்பதோடு இயல்பான தமிழில் இணைக்கிறது.
- source_word: יָדְךָ
  choice: உமது கை
  rationale: செயலாற்றும் வல்லமையைக் குறிக்கும் எபிரெய மனிதவுருவச் சித்திரத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: תָּרוּם
  choice: உயர்ந்தோங்கியுள்ளது
  rationale: רום என்பதிலுள்ள உயர்ந்திருத்தல், மேன்மைபெற்றிருத்தல் ஆகிய இரு நிழற்பொருள்களையும் கவிதைநயத்துடன் தக்கவைக்கிறது.
- source_word: יְמִינֶךָ
  choice: உமது வலக்கரம்
  rationale: வலிமை மற்றும் வெற்றியைக் குறிக்கும் மூலமொழியின் கவித்துவ இணை அமைப்பை அப்படியே காக்கிறது.
theological_decisions:
- issue: இறைவனுடைய வல்லமையை மனித உடலுறுப்புகளால் சித்தரித்தல்
  choice: ‘புயம்’, ‘கை’, ‘வலக்கரம்’ என்ற உருவகங்களை முதன்மை உரையில் தக்கவைத்தல்
  alternative: இவற்றை ‘ஆற்றல்’ அல்லது ‘வல்லமை’ போன்ற அருவச் சொற்களாக மாற்றுதல்
  rationale: மூலவசனம் இறைவனுடைய வல்லமையை மனிதவுருவக் கவிதைமொழியில் வெளிப்படுத்துகிறது. அதைத் தக்கவைப்பது எபிரெயச் சித்திரத்தையும் இணை அமைப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது/உமக்கு’ என்பது சங்கீதத்தில் இறைவனை நோக்கும் மரியாதை ஒருமையைத் தெளிவாகக் காக்கிறது; ‘புயம்’ என்ற இலக்கியமானதாயினும் பரவலாகப் புரியக்கூடிய சொல், மூலத்தின் arm imagery-ஐ பாதுகாக்கிறது.
