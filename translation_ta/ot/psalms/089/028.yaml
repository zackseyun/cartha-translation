source:
  edition: WLC
  text: לְ֭/עוֹלָ֗ם אשמור ל֣/וֹ חַסְדִּ֑/י וּ֝/בְרִיתִ֗/י נֶאֱמֶ֥נֶת לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/028.yaml
  text: Forever I will keep my steadfast love for him[a], and my covenant will remain faithful to him.
translation:
  language: ta
  text: என்றென்றும் அவனுக்காக என் மாறாத அன்பைக் காத்துக்கொள்வேன்; என் உடன்படிக்கை அவனுக்கு உறுதியானதாக இருக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உடன்படிக்கை அவனுக்கு உண்மையுள்ளதாக இருக்கும்.”
    reason: נֶאֱמֶנֶת என்பது ‘உறுதியானது’ என்றும் ‘உண்மையுள்ளது/நம்பத்தக்கது’ என்றும் பொருள்படக்கூடிய சொற்பொருள் மாற்றைச் சுட்டுகிறது.
lexical_decisions:
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவில்லாத காலத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶשְׁמֹר
  choice: காத்துக்கொள்வேன்
  rationale: שׁמר என்பதன் காத்தல், பேணுதல் என்ற செயற்பாட்டுப் பொருளை உடன்படிக்கைச் சூழலில் தக்கவைக்கிறது.
- source_word: לוֹ
  choice: அவனுக்காக / அவனுக்கு
  rationale: ל முன்னிடைச்சொல்லின் பயன் மற்றும் உறவு ஆகிய நுணுக்கங்களை இரு வாக்கியப் பகுதிகளுக்கும் ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: חַסְדִּי
  choice: என் மாறாத அன்பு
  rationale: חסד என்பதில் உள்ள அன்பையும் நிலையான பற்றுறுதியையும், ஒரு தனிப்பட்ட கோட்பாட்டுச் சொல்லைத் திணிக்காமல் வெளிப்படுத்துகிறது.
- source_word: וּבְרִיתִי
  choice: என் உடன்படிக்கை
  rationale: בְּרִית என்பதற்கான துல்லியமான, வழக்கிலுள்ள தமிழ் வேதாகமச் சொல்லாகும்.
- source_word: נֶאֱמֶנֶת
  choice: உறுதியானதாக இருக்கும்
  rationale: אמן நிஃபால் வடிவத்தின் நம்பத்தகுந்த தன்மை, நிலைத்தன்மை, உறுதிப்பாடு ஆகியவற்றை இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: தாவீதிய உடன்படிக்கையின் உடனடி பொருளை மீறி மெசியானிய நிறைவேற்றத்தை வெளிப்படையாகச் சேர்த்தல்
  choice: எபிரெய உரையிலுள்ள எளிய ஆண்பால் ஒருமைச் சுட்டான ‘அவன்’ என்பதையே வைத்தல்
  alternative: முதன்மை உரையில் மெசியாவையோ கிறிஸ்துவையோ வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: இவ்வசனம் தாவீதிய அரசனைப் பற்றிய நேரடி இறைவாக்காக அமைந்துள்ளது; விரிவான வேதநூல் நிறைவேற்றத்தை மொழிபெயர்ப்புக்குள் சேர்க்காமல் விளக்கத்திற்கு விடுகிறது.
- issue: נֶאֱמֶנֶת என்பதைக் உடன்படிக்கையின் விசுவாசம் அல்லது உறுதி எனப் புரிதல்
  choice: ‘உறுதியானதாக இருக்கும்’ என்று மொழிபெயர்த்து, மாற்று நுணுக்கத்தை அடிக்குறிப்பில் தருதல்
  alternative: ‘அவனுக்கு உண்மையுள்ளதாக இருக்கும்’
  rationale: எபிரெயச் சொல் நம்பகத்தன்மை, விசுவாசம், உறுதி ஆகிய நெருங்கிய கருத்துகளைத் தாங்குகிறது; முதன்மை உரை இயல்பான தமிழில் உறுதியைத் தெரிவிக்கிறது, அடிக்குறிப்பு உண்மைத்தன்மை என்ற மாற்றை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘மாறாத அன்பு’ என்பது חסד-இன் அன்பும் பற்றுறுதியும் சேர்ந்த கருத்தை இயல்பாக வழங்குகிறது; செய்யுள் வலிமைக்காக இரு இணை வாக்கியங்கள் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
