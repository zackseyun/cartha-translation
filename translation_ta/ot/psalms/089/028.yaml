  source_fidelity: 'எபிரெய மூலத்துடன் மொழிபெயர்ப்பு நன்றாக ஒத்துப்போகிறது: לְעוֹלָם ‘என்றென்றும்,’ אֶשְׁמֹר ‘காத்துக்கொள்வேன்,’ חַסְדִּי ‘என் மாறாத அன்பு,’ בְּרִיתִי ‘என் உடன்படிக்கை’ எனத் துல்லியமாக வழங்கப்பட்டுள்ளன. לוֹ-வின் உறவுப்/நலன் சார்ந்த நுணுக்கமும் ‘அவனுக்காக / அவனுக்கு’ என இயல்பாகப் பாதுகாக்கப்பட்டுள்ளது. נֶאֱמֶנֶת-க்கு ‘உறுதியானதாக இருக்கும்’ என்பது ‘உறுதியானது, நம்பத்தகுந்தது’ என்னும் பொருள்வளத்தைச் சரியாக வெளிப்படுத்துகிறது.'
