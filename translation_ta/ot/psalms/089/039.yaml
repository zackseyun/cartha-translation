  yaml_path: translation/ot/psalms/089/039.yaml
  text: You have renounced the covenant of your servant[b][a]; you have defiled his crown to the ground.
translation:
  language: ta
  text: உமது அடியானின் உடன்படிக்கையை நீர் நிராகரித்தீர்[a]; அவனுடைய கிரீடத்தைத் தரையில் வீழ்த்தித் தீட்டுப்படுத்தினீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தள்ளிவிட்டீர்” / “ஒதுக்கித்தள்ளினீர்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவனுடைய கிரீடத்தைத் தரையில் அவமதித்தீர்” / “புனிதத்தைக் குலைத்தீர்.” ‘கிரீடம்’ என்பதற்கான எபிரெயச் சொல் அர்ப்பணிப்பு அல்லது புனிதப்படுத்தல் என்ற நிழற்பொருளையும் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  choice: புறக்கணித்தீர்
  rationale: நאר என்பதன் பியேல் வடிவம் நிராகரித்தல் அல்லது தள்ளிவிடுதல் என்ற வலுவான பொருளைத் தருகிறது. இங்கு வெறும் கவனக்குறைவை அல்ல, உடன்படிக்கையை ஒதுக்கித் தள்ளியதாகப் புலம்பும் தொனியில் ‘புறக்கணித்தீர்’ இயல்பாக அமைகிறது; ‘நிராகரித்தீர்’ என்பதும் சாத்தியம் என்பதை அடிக்குறிப்பு காக்கிறது.
- source_word: בְּרִית עַבְדֶּךָ
  choice: உமது ஊழியனுடன் செய்த உடன்படிக்கை
  rationale: בְּרִית என்பது அரச-தாவீதிய சூழலில் முறையான, இறையியல் எடையுள்ள ‘உடன்படிக்கை’. எபிரெயச் சொற்றொடர் ‘உமது ஊழியனின் உடன்படிக்கை’ என இருந்தாலும், தமிழில் உறவைத் தெளிவாகவும் இயல்பாகவும் சொல்ல ‘உமது ஊழியனுடன் செய்த’ என வழங்கப்படுகிறது.
- source_word: חִלַּלְתָּ
  choice: அதன் புனிதத்தைக் கெடுத்தீர்
  rationale: חלל பியேல் வடிவம் புனிதமானதையோ மதிப்புக்குரியதையோ தீட்டுப்படுத்துதல், அவமதித்தல், புனிதத்தைக் கெடுத்தல் என்பதைக் குறிக்கிறது. נזר என்பதில் உள்ள அர்ப்பணிப்பு/புனிதப்படுத்தல் நிழற்பொருளை இத்தேர்வு வெளிப்படுத்துகிறது.
- source_word: לָאָרֶץ
  choice: தரையில் போட்டு
  rationale: சொல்லுக்கு நேர் பொருள் ‘பூமிக்கு/தரைக்கு’. தமிழில் மணிமுடி தாழ்த்தப்பட்டு அவமதிக்கப்படுவதை இயல்பாகக் காட்ட ‘தரையில் போட்டு’ என மொழிபெயர்க்கப்படுகிறது; மூலத்தில் ‘போட்டு’ என்ற தனி வினை இல்லாவிட்டாலும், לָאָרֶץ இணைந்த வினையின் விளைவை இது வெளிப்படுத்துகிறது.
- source_word: נִזְרוֹ
  choice: அவனுடைய மணிமுடி
  rationale: נזר என்பது அரசரின் முடி/மணிமுடியையும், அர்ப்பணிப்பு அல்லது புனிதப்படுத்தலின் தொடர்பையும் குறிக்கலாம். அரச சங்கீதச் சூழலில் ‘மணிமுடி’ தெளிவான முதன்மைத் தேர்வு; மற்ற நிழற்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: தாவீதிய ஊழியனைச் சார்ந்த அரச-உடன்படிக்கை உருவகம்
  choice: உடன்படிக்கை நிராகரிக்கப்பட்டதாகத் தோன்றும் புலம்பலையும் அரசரின் மணிமுடி அவமதிக்கப்பட்ட உருவகத்தையும் நேரடியாகப் பாதுகாத்தல்
  alternative: பிற்கால மெசியா நிறைவேற்றத்தை வசனத்திற்குள் விளக்கமாகச் சேர்த்தல், அல்லது இதை வெறும் அரசியல் தோல்வியாக மென்மைப்படுத்தல்
  rationale: இவ்வசனம் தேவனின் உடன்படிக்கைக்கும் காணப்படும் அரசவம்ச வீழ்ச்சிக்கும் இடையிலான தீராத இறையியல் பதற்றத்தை வெளிப்படுத்துகிறது. மொழிபெயர்ப்பு அந்தப் பதற்றத்தைத் தீர்த்து வைக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘நீர்’, ‘கெடுத்தீர்’ பயன்படுத்தப்பட்டுள்ளன. அரச உருவகத்திற்காக ‘மணிமுடி’ தேர்ந்தெடுக்கப்பட்டு, மூலத்தின் புனிதம் கெடுதல் என்ற வலுவான மொழி தணிக்கப்படாமல் வைக்கப்பட்டுள்ளது.
