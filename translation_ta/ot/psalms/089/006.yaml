  rationale: சொல்லாட்சியுள்ள வினாவில் வரும் வழக்கமான வினாப்பெயர்.
- source_word: בַשַּׁחַק
  choice: வானவெளியில்
  rationale: שׁחק குறிக்கும் வானம் அல்லது விண்ணுலகச் சூழலை, மேகங்கள் என்று மட்டும் குறுக்காமல் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יַעֲרֹךְ לַיהוָה
  choice: கர்த்தருக்கு ஒப்பானவர்
  rationale: ערך என்பதன் இச்சூழலிலான ‘ஒப்பிடுவதற்காக அருகில் நிறுத்துதல்’ என்ற கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: יִדְמֶה לַיהוָה
  choice: கர்த்தரைப் போன்றவர்
  rationale: דמה என்பதன் ஒற்றுமை அல்லது நிகர்த்தன்மைக் கருத்தைப் பேணி, முதல் அடியின் ஒப்பீட்டுடன் இணையான அமைப்பை உருவாக்குகிறது.
- source_word: בִּבְנֵי אֵלִים
  choice: தேவபுத்திரர்களில்
  rationale: எபிரெயச் சொற்றொடரின் ‘தேவன்/தேவர்களின் புத்திரர்கள்’ என்ற உருவகத்தைப் பேணி, அதை விளக்கவுரையாக ‘வானுலக உயிர்கள்’ என்று மட்டும் மாற்றவில்லை.
- source_word: יהוה
  choice: கர்த்தர்
  rationale: தமிழ் வேதாகம நடையில் தெய்வீகப் பெயரை மரியாதையுடன் குறிக்கும், பரவலாகப் புரிந்துகொள்ளப்படும் மரபான வடிவம்.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: கர்த்தர்
  alternative: யாவே
