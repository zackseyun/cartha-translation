  yaml_path: translation/ot/psalms/089/006.yaml
  text: For who in the skies can be compared to Yahweh? Who among the sons of God is like Yahweh?[a]
translation:
  language: ta
  text: ஏனெனில், வானவெளியில் கர்த்தருக்கு ஒப்பானவர் யார்? தேவபுத்திரர்களில் கர்த்தரைப் போன்றவர் யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானுலக உயிர்களிடையே,” “தெய்வீக உயிர்களிடையே,” அல்லது “வல்லவர்களின் புத்திரர்களில்.” எபிரெயச் சொற்றொடரைச் சொற்சொல்லாக மொழிபெயர்த்தால், “தேவன்/தேவர்களின் புத்திரர்களில்” என்று வரும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புகழ்ச்சிக்கான அடிப்படையை அறிமுகப்படுத்துகிறது; தொடர்ந்து வரும் வினாவாக்கியங்களுடன் இயல்பாக இணைகிறது.
- source_word: מִי
