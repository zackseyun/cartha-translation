- issue: בִּבְנֵי אֵלִים என்பதன் பொருள்
  choice: தேவபுத்திரர்களில்
  alternative: வானுலக உயிர்களிடையே; தெய்வீக உயிர்களிடையே; வல்லவர்களின் புத்திரர்களில்
  rationale: மூலத்தின் உருவகத்தையும் வானுலக மன்றம் குறித்த சாத்தியமான பின்னணியையும் பேணுகிறது; எந்த ஓர் விளக்கத்தையும் உரைக்குள் இறுதியாகத் தீர்மானிக்காமல் மாற்று வாசிப்புகளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையும் இணையான இரண்டு சொல்லாட்சியுள்ள வினாக்களும் பேணப்பட்டுள்ளன. ‘தேவபுத்திரர்கள்’ என்பது மூல உருவகத்தைத் தக்கவைக்கிறது; அதன் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
