base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/019.yaml
  text: Then you spoke in a vision to your faithful ones and said[a], “I have set help upon a mighty one[d][c][b]; I have exalted one chosen from the people.”
translation:
  language: ta
  text: அப்போது நீர் தரிசனத்தில் உமக்கு உண்மையுள்ளவர்களிடம்[a] பேசி, “வலிமைமிக்க ஒருவனுக்கு உதவியை அளித்தேன்[b]; மக்களிலிருந்து தேர்ந்தெடுக்கப்பட்ட ஒருவனை உயர்த்தினேன்[c]” என்று சொன்னீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறொரு வாசிப்பின்படி, “உமக்கு உண்மையுள்ள ஒருவரிடம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: textual_variant
  - marker: b
    text: “வலிமைமிக்க ஒருவன்” என்பதை “போர்வீரன்,” “வீரன்,” அல்லது “பலசாலி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “தேர்ந்தெடுக்கப்பட்ட ஒருவன்” என்பதற்கான எபிரெயச் சொல் “இளைஞன்” என்றும் பொருள்படலாம்; இங்கு கடவுள் மக்களிலிருந்து ஒருவரைத் தேர்ந்தெடுத்து உயர்த்தும் சூழல் முதலாவது பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: அப்போது
  rationale: கடவுளின் முந்தைய உரையை அறிமுகப்படுத்தும் காலக் குறிப்பு; நவீன தமிழில் இயல்பானது.
- source_word: בְחָזוֹן
  choice: தரிசனத்தில்
  rationale: வெளிப்பாடு நிகழ்ந்த வழியையோ சூழலையோ குறிக்கும் ב முன்னிடைச்சொல்லின் பொருளைப் பாதுகாக்கிறது.
- source_word: לַחֲסִידֶיךָ
  choice: உமக்கு உண்மையுள்ளவர்களிடம்
  rationale: கொடுக்கப்பட்ட WLC உரையிலுள்ள பன்மையைப் பின்பற்றி, חסיד என்பதன் பற்றுறுதி மற்றும் இறைப்பற்று சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: שִׁוִּיתִי עֵזֶר עַל גִּבּוֹר
  choice: வலிமைமிக்க ஒருவன்மேல் உதவியை வைத்தேன்
  rationale: ‘உதவி’, ‘மேல்’, ‘வைத்தேன்’ என்ற மூலக்கூறுகளைப் பாதுகாத்து, உதவி அந்த வலிமைமிக்கவனிடம் ஒப்படைக்கப்பட்டதா அல்லது அவனுக்கு அளிக்கப்பட்டதா என்ற கவித்துவச் செறிவைத் திறந்தே வைக்கிறது.
- source_word: גִּבּוֹר
  choice: வலிமைமிக்க ஒருவன்
  rationale: பலசாலி, போர்வீரன், வீரன் ஆகிய பொருள் வாய்ப்புகளை ஒரே இராணுவப் பொருளுக்குள் குறுக்காமல் வைத்திருக்கிறது.
- source_word: הֲרִימוֹתִי
  choice: உயர்த்தினேன்
  rationale: ராஜரீதியான உயர்வைக் குறிக்கக்கூடிய ஹிஃபில் வடிவத்தின் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: בָּחוּר
  choice: தேர்ந்தெடுக்கப்பட்ட ஒருவன்
  rationale: இச்சூழலில் மக்களிலிருந்து கடவுள் தேர்ந்தெடுத்து உயர்த்துவதை இணைவரி ஆதரிக்கிறது; ‘இளைஞன்’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מֵעָם
  choice: மக்களிலிருந்து
  rationale: מן குறிக்கும் மூலத்தையும், மக்களின் நடுவிலிருந்து செய்யப்படும் தேர்வையும் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சங்கீதத்தின் தாவீதிய உடன்படிக்கைச் சூழலில் வசனத்தின் சுட்டுப்பொருள்
  choice: மொழிபெயர்ப்பு உடனடியான தாவீதியச் சூழலிலேயே வைக்கப்படுகிறது.
  alternative: தாவீதைக் கடந்து மேசியாவை நேரடியாகச் சுட்டுவதாக மொழிபெயர்த்தல்.
  rationale: வசனம் கடவுள் ஒருவரை மக்களிலிருந்து தேர்ந்தெடுத்து உயர்த்தியதைச் சொல்கிறது; பின்னான நிறைவேற்ற வாசிப்பை மொழிபெயர்ப்புக்குள் சேர்க்காமல் வாசகருக்குத் திறந்துவைக்கிறது.
- issue: לַחֲסִידֶיךָ என்பதன் எண்
  choice: 'கொடுக்கப்பட்ட WLC உரைப்படி பன்மை: ‘உமக்கு உண்மையுள்ளவர்களிடம்’.'
  alternative: 'சில உரை/மொழிபெயர்ப்பு மரபுகளில் பிரதிபலிக்கும் ஒருமை: ‘உமக்கு உண்மையுள்ள ஒருவரிடம்’.'
  rationale: மூலமாக வழங்கப்பட்ட உரையின் பன்மையை முதன்மைப்படுத்தி, உண்மையான உரை வேறுபாட்டை அடிக்குறிப்பில் குறிப்பிடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமான மரியாதை ஒருமையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் ‘பேசினீர்/சொன்னீர்’ வேறுபாடும் இணைவரி அமைப்பும் பாதுகாக்கப்பட்டுள்ளன; வாசிப்புத் தெளிவுக்காக இயல்பான தமிழ் சொல்வரிசை பயன்படுத்தப்பட்டுள்ளது.
