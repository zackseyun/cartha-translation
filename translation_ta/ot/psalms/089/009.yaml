base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/009.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise[b], you still them.
translation:
  language: ta
  text: கடலின் பொங்கலை நீர் ஆள்கிறீர்[a]; அதன் அலைகள் எழும்பும்போது, அவற்றை நீர் அடக்குகிறீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடலின் பெருமையை / மாட்சிமையை.” எபிரெயச் சொல் உயர்வு, மாட்சிமை, அல்லது பொங்குதல் என்பவற்றைக் குறிக்கலாம்; இங்கு கடல் சீறிப் பொங்கும் காட்சி சூழலுக்கு மிகவும் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றை அமைதிப்படுத்துகிறீர்” அல்லது “அவற்றைக் கீழ்ப்படுத்துகிறீர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: ஆள்கிறீர்
  rationale: தொடர்ந்து நிகழும் இறையாண்மையையும் செயல்வாய்ந்த கட்டுப்பாட்டையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְּגֵאוּת
  choice: பொங்கியெழுதலை
  rationale: גֵּאוּת என்பதற்கு பெருமை, மாட்சிமை, பொங்கியெழுதல் ஆகிய பொருள்கள் உண்டு; கடலைச் சார்ந்த இச்சூழலில் நீர் சீறிப் பொங்கும் காட்சி மிகப் பொருத்தமானது.
- source_word: הַיָּם
  choice: கடலின்
  rationale: יָם என்பதற்கான இயல்பான, நிலையான தமிழ் இணைச்சொல் ‘கடல்’; உரிமைத் தொடர்பைத் தமிழில் இயல்பாகக் காட்ட ‘கடலின்’ என அமைக்கப்பட்டது.
- source_word: בְּשׂוֹא
  choice: எழும்பும்போது
  rationale: அலைகள் உயர்ந்து எழும் சூழ்நிலையை காலவாக்கியமாகத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: גַלָּיו
  choice: அதன் அலைகள்
  rationale: பின்னொட்டு கடலைக் குறிக்கிறது; ‘அதன்’ என்பது உயிரற்ற முன்னிலைக்கான இயல்பான தமிழ் சுட்டுப்பெயர்.
- source_word: תְשַׁבְּחֵם
  choice: அவற்றை நீர் அடக்குகிறீர்
  rationale: இங்கு Piel வடிவிலுள்ள שׁבח கொந்தளிக்கும் அலைகளை அமைதிப்படுத்துதல் அல்லது அடக்குதல் எனப் பொருள்படுகிறது; ‘அடக்குகிறீர்’ கட்டுப்பாடு மற்றும் அமைதிப்படுத்தல் ஆகிய இரு நுணுக்கங்களையும் சுருக்கமாகத் தருகிறது.
theological_decisions:
- issue: குழப்பத்தைச் சுட்டும் கடலின்மேல் இறைவனின் இறையாண்மை
  choice: கடலையும் அதன் அலைகளையும் கடவுள் நேரடியாக ஆள்கிறார் என்ற கவித்துவ அறிவிப்பு
  alternative: பிரபஞ்சக் குழப்பத்தின்மேல் கடவுள் பெற்ற வெற்றியைச் சுட்டும் புராணக் கவித்துவக் குறிப்பு
  rationale: எபிரெய உரை கடலின்மேல் கடவுளுக்குள்ள ஆட்சியையும் எழும் அலைகளை அவர் அடக்குவதையும் நேரடியாகச் சித்தரிக்கிறது. வெளிப்படையாக இல்லாத விரிவான புராணக் கட்டமைப்பை மொழிபெயர்ப்பில் சேர்க்காமல், அதன் சாத்தியமான ஒலிப்பைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கவித்துவமும் கண்ணியமும் கொண்ட நடை. கடவுளை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘பொங்கியெழுதல்—அலைகள் எழும்புதல்—அடக்குதல்’ என்ற உருவக இயக்கம் பாதுகாக்கப்பட்டுள்ளது.
