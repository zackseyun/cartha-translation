lexical_decisions:
- source_word: כְּיָרֵחַ
  choice: சந்திரனைப்போல்
  rationale: முன்னொட்டு כְּ ஒப்புமையைக் குறிக்கிறது; יָרֵחַ என்பது சந்திரன். இத்தேர்வு எபிரெய ஒப்புமையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: יִכּוֹן
  choice: நிலைநிறுத்தப்படும்
  rationale: כון என்பதன் நிஃபால் முற்றாத வினைவடிவம் நிலைபெறுதல் அல்லது உறுதியாக நிறுவப்படுதல் என்ற செயல்பாட்டு-விளைவு பொருளைத் தருகிறது. தமிழின் செயப்பாட்டு வடிவம் அந்த நுட்பத்தைக் காக்கிறது.
- source_word: עוֹלָם
  choice: என்றென்றும்
  rationale: உடன்படிக்கை சார்ந்த கவிதைச் சூழலில் நீடித்த நிரந்தரத்தைக் குறிக்கிறது; ‘என்றென்றும்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: וְעֵד
  choice: சாட்சி
  rationale: עֵד என்பதன் நேரடிப் பொருள் ‘சாட்சி’. எபிரெயத்தில் சுட்டுச் சொல் இல்லாததால் தமிழிலும் குறிப்பிட்ட அடையாளத்தைச் சேர்க்காமல் விடப்பட்டுள்ளது.
- source_word: בַּשַּׁחַק
  choice: வானத்தில் உள்ள
  rationale: שַׁחַק என்ற கவிதைச்சொல் வானம், விண்வெளி அல்லது மேகமண்டலத்தைக் குறிக்கலாம். ‘வானத்தில்’ என்பது சூழலுக்கு இயல்பானதும் அளவுக்கு மீறிக் குறிப்பாக்காததும் ஆகும்.
- source_word: נֶאֱמָן
  choice: நம்பகமானது
  rationale: இந்தச் சொல் உறுதியான, நம்பத்தகுந்த, உண்மையுள்ள என்ற பொருள்வட்டத்தைக் கொண்டது. இங்கு ஒரு வானியல் ‘சாட்சி’யின் சார்பில் ‘நம்பகமானது’ தெளிவான இயல்பான தமிழ்.
- source_word: סֶלָה
  choice: சேலா
  rationale: சொல்லின் துல்லியமான செயல்பாடு உறுதியற்றது; ஊகமாக மொழிபெயர்ப்பதற்குப் பதிலாக ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יִכּוֹן என்ற வினையின் மறைந்துள்ள எழுவாய்
  choice: ‘அது’ என்று மட்டும் கூறி முந்தைய வசனச் சூழலோடு தொடர்புபடுத்தப்பட்டது.
  alternative: ‘அவனுடைய அரியணை’ அல்லது ‘அவனுடைய சந்ததி’ என்று வெளிப்படையாக நிரப்புதல்.
  rationale: எபிரெய வசனத்தில் எழுவாய் வெளிப்படையாக இல்லை; முந்தைய சூழலிலிருந்து பெறப்படுகிறது. ‘அது’ மூலத்தின் சுருக்கத்தையும் அரியணை/சந்ததி இடையிலான விளக்கத் தேர்வைத் தீர்மானிக்காத தன்மையையும் காக்கிறது.
- issue: ‘வானத்தில் உள்ள சாட்சி’ என்பதன் அடையாளம்
  choice: முதன்மை உரையில் அடையாளம் குறிப்பிடப்படாமல் விடப்பட்டது.
  alternative: அந்தச் சாட்சி சந்திரனே என்று வெளிப்படையாக மொழிபெயர்த்தல்; அல்லது வேறு வானியல் அடையாளமாகக் கருதுதல்.
  rationale: எபிரெயம் சாட்சியின் அடையாளத்தை வெளிப்படையாகக் கூறவில்லை. சந்திரனாகப் புரிந்துகொள்வது சாத்தியமும் பொதுவுமானதுமாக இருந்தாலும், அதை முதன்மை உரையில் கட்டாயப்படுத்தாமல் அடிக்குறிப்பில் தருவது உண்மையான தெளிவின்மையைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான, சுருக்கமான நடை. ‘நிலைநிறுத்தப்படும்’ மூலத்தின் செயப்பாட்டு நுட்பத்தைக் காக்கிறது. ‘சேலா’ விளக்கம் இன்றி ஒலிபெயர்க்கப்பட்டுள்ளது.
