  - marker: a
    text: ‘வானத்தில் உள்ள சாட்சி’ என்பது சந்திரனையே குறிக்கலாம்; உடன்படிக்கையின் நிலைத்தன்மைக்கு நம்பகமான வானச் சாட்சியாக அது புரிந்துகொள்ளப்படுகிறது. ஆனால் எபிரெயம் அந்தச் சாட்சியை வெளிப்படையாக அடையாளப்படுத்தவில்லை.
