source:
  edition: WLC
  text: לְ/ךָ֣ שָׁ֭מַיִם אַף לְ/ךָ֥ אָ֑רֶץ תֵּבֵ֥ל וּ֝/מְלֹאָ֗/הּ אַתָּ֥ה יְסַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/011.yaml
  text: The heavens are yours; the earth also is yours[a]. The world and its fullness—you founded them.
translation:
  language: ta
  text: வானங்கள் உமக்குரியவை; பூமியும் உமக்குரியது. உலகத்தையும் அதில் நிறைந்துள்ள அனைத்தையும் நீர் அடித்தளமிட்டீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְךָ
  choice: உமக்குரியவை / உமக்குரியது
  rationale: לְךָ இங்கு உடைமையைக் குறிக்கிறது. தமிழில் இயல்பான பெயர்ப் பயனிலை வாக்கியமாகவும், வானங்கள்/பூமி என்பவற்றின் எண்ணுக்கேற்பவும் மொழிபெயர்க்கப்பட்டது.
- source_word: שָׁמַיִם
  choice: வானங்கள்
  rationale: எபிரேயப் பன்மை வடிவத்தையும் உயர்ந்த கவிதை நடையையும் காக்கிறது.
- source_word: אַף
  choice: -உம்
  rationale: வானங்கள் மட்டுமல்ல, பூமியும் தேவனுக்குரியது என்ற சேர்த்துக் கூறும் வலியுறுத்தலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָרֶץ
  choice: பூமி
  rationale: வானங்களோடும் உலகத்தோடும் அமைந்த பிரபஞ்ச இணைப்பில் இது ‘நிலம்’ என்பதைக் காட்டிலும் ‘பூமி’ எனப் பொருள்படுகிறது.
- source_word: תֵּבֵל
  choice: உலகம்
  rationale: ஒழுங்கமைந்த, வாழ்விடமான பூவுலகைக் குறிக்கும் சொல்லுக்கு இயல்பான நவீனத் தமிழ் இணை.
- source_word: מְלֹאָהּ
  choice: அதில் நிறைந்துள்ள அனைத்தும்
  rationale: சொல்லுக்குச் சொல் ‘அதன் நிறைவு’; சூழலில் உலகில் உள்ள அனைத்தையும் குறிக்கிறது. தேர்ந்த வடிவம் பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: יְסַדְתָּם
  choice: அடித்தளமிட்டு நிறுவினீர்
  rationale: יסד என்பதிலுள்ள அடித்தளம் அமைத்தல்/நிறுவுதல் என்ற படைப்பியல் உருவகத்தைத் தமிழில் காக்கிறது; பன்மை பின்னொட்டு உலகத்தையும் அதில் நிறைந்துள்ள அனைத்தையும் உள்ளடக்குகிறது.
theological_decisions:
- issue: தேவனுடைய உடைமையும் படைப்புச் செயலும்
  choice: வானங்களும் பூமியும் தேவனுக்குரியவை என்றும், உலகத்தையும் அதில் நிறைந்துள்ள அனைத்தையும் அவரே அடித்தளமிட்டு நிறுவினார் என்றும் உரையை நேரடியாக வழங்குதல்
  alternative: பிற்காலக் கோட்பாட்டு மொழியில் ‘ஒன்றுமில்லாமையிலிருந்து படைத்தார்’ என்று விரிவாக்குதல், அல்லது இதை படைப்புச் செயலின்றி ஆட்சியுரிமை மட்டும் எனச் சுருக்குதல்
  rationale: எபிரேய உரை உடைமையையும் (לְךָ), நிறுவும் படைப்புச் செயலையும் (יְסַדְתָּם) தெளிவாக இணைக்கிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டுக் கருத்தை மொழிபெயர்ப்பில் சேர்க்கக்கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதை நடை. இறைவனை நோக்கிய சங்கீதப் பேச்சுக்கு மரியாதைப் பன்மையான ‘உமக்கு/நீர்/நிறுவினீர்’ பயன்படுத்தப்பட்டுள்ளது. தேவையற்ற அடிக்குறிப்பு சேர்க்கப்படவில்லை; ஆங்கில அடிக்குறிப்பு குறி வாக்கிய அமைப்புடன் பொருந்தாத இடத்தில் இருந்ததுடன், மְלֹאָהּ என்பதன் பொருள் முதன்மை உரையிலேயே தெளிவாக்கப்பட்டுள்ளது.
