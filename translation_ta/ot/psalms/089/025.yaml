reference: Psalms 89:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י בַ/יָּ֣ם יָד֑/וֹ וּֽ/בַ/נְּהָר֥וֹת יְמִינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/025.yaml
  text: I will set his hand on the sea[a], and his right hand on the rivers.
translation:
  language: ta
  text: அவனுடைய கையை கடலின் மேல் வைப்பேன்; அவனுடைய வலக்கையை நதிகளின் மேல் வைப்பேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: வைப்பேன்
  rationale: இணைப்பிடைச்சொல்லுடன் வந்துள்ள Qal முற்றுவினை, வாக்குறுதி சார்ந்த எதிர்காலச் சூழலில் தமிழில் இயல்பாக எதிர்கால வினையாக மொழிபெயர்க்கப்படுகிறது. ‘வைப்பேன்’ என்பது மூலத்தின் திடமான உருவகத்தைத் தக்கவைக்கிறது.
- source_word: בַיָּם
  choice: கடலின்மேல்
  rationale: ב என்ற முன்னிடைச்சொல் இங்கு கடலைத் தன் ஆட்சிக்குட்பட்ட வெளியாகக் காட்டும் உருவகத்தில் வருகிறது. ‘கடலின்மேல்’ என்பது இடம்சார்ந்த படிமத்தைப் பாதுகாக்கிறது; ஆட்சி என்ற பொருளை நேரடியாகச் சேர்ப்பதில்லை.
- source_word: יָדוֹ
  choice: அவனுடைய கை
  rationale: எபிரேயத்தின் உடலுறுப்பு உருவகம் அப்படியே பாதுகாக்கப்படுகிறது; அது ஆற்றலையோ எட்டும் எல்லையையோ குறிப்பதாக இருந்தாலும், விளக்கவுரை முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
- source_word: וּבַנְּהָרוֹת
  choice: நதிகளின்மேல்
  rationale: נְהָרוֹת என்பதன் இயல்பான பன்மை ‘நதிகள்.’ கடலுடன் அமைந்த கவிதை இணைநிலையைத் தெளிவாகக் காட்ட முன்னிடைச்சொல் தமிழிலும் மீண்டும் வெளிப்படுத்தப்படுகிறது.
- source_word: יְמִינוֹ
  choice: அவனுடைய வலக்கை
  rationale: மூலத்தின் இணைநிலையையும் வலிமை மற்றும் அதிகாரத்தோடு தொடர்புடைய வலக்கை உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: அரசாட்சி/ஆட்சிப்பரப்பு உருவகம்
  choice: கடலின்மேலும் நதிகளின்மேலும் கை மற்றும் வலக்கை வைக்கப்படும் திடமான உருவகத்தைத் தக்கவைத்தல்
  alternative: அவனுடைய அதிகாரத்தைக் கடலின்மேலும் நதிகளின்மேலும் நிலைநாட்டுவேன்
  rationale: இது இறைவன் அளிக்கும் விரிவான அரசாட்சியைக் குறிக்கக்கூடும்; எனினும் மூல எபிரேயம் அந்தப் பொருளை உருவகமாகவே சொல்கிறது. ஆகவே முதன்மை உரை உருவகத்தைத் தக்கவைத்து, சாத்தியமான விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘கை/வலக்கை’ என்ற இணைநிலை உருவகம் நேரடியாக வைக்கப்பட்டுள்ளது; ‘ஆட்சி’ என்பது உரைக்குள் சேர்க்கப்படாமல் அடிக்குறிப்பில் மட்டுமே விளக்கப்பட்டுள்ளது.
