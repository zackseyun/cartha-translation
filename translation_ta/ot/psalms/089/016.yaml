  text: בְּ֭/שִׁמְ/ךָ יְגִיל֣וּ/ן כָּל הַ/יּ֑וֹם וּ/בְ/צִדְקָתְ/ךָ֥ יָרֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/016.yaml
  text: In your name they rejoice all day long[a], and in your righteousness they are exalted.
translation:
  language: ta
  text: உமது பெயரில் அவர்கள் நாள் முழுவதும் களிகூர்கிறார்கள்; உமது நீதியினால் அவர்கள் உயர்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது நீதியில் அவர்கள் உயர்கிறார்கள்.” எபிரெய முன்னிடைச்சொல் בְּ இங்கு ‘இல்’ அல்லது ‘ஆல்/மூலம்’ எனப் பொருள்படலாம். ‘நீதி’ என்பதற்கு ‘நீதித்தன்மை’ அல்லது ‘நியாயம்’ என்றும் பொருள் கொள்ளலாம்; வினைச்சொல் வெளிப்படையான செயப்பாட்டு வடிவம் அல்ல.
    reason: எபிரெய முன்னிடைச்சொல் மற்றும் צדקה என்பதன் சொற்பொருள் வரம்பையும், יָרוּמוּ வினை வடிவத்தின் தன்னிலைப் பொருளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: בְּשִׁמְךָ
  choice: உமது பெயரில்
  rationale: בְּ இங்கு மகிழ்ச்சியின் அடிப்படை அல்லது தளத்தைக் குறிக்கிறது. ‘பெயர்’ என்பது வெறும் அழைப்புப்பெயரை மட்டுமல்லாமல், கடவுளின் வெளிப்படுத்தப்பட்ட பண்பையும் புகழையும் குறிக்கிறது.
- source_word: יְגִילוּן
  choice: மகிழ்ந்து களிகூருகிறார்கள்
  rationale: גיל மிகுந்த மகிழ்ச்சியையும் களிப்பையும் குறிக்கிறது. இந்த இணைச்சொற்றொடர் அதன் வலிமையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: நாள் முழுவதும் தொடரும் மகிழ்ச்சியைச் சுட்டும் எபிரெய வழக்கை இயல்பான தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: וּבְצִדְקָתְךָ
  choice: உமது நீதியால்
  rationale: צדקה என்பதற்கு நீதி, நீதித்தன்மை ஆகிய அர்த்தங்கள் உள்ளன. இங்கு בְּ காரணம் அல்லது அடிப்படையைக் குறிக்கக்கூடும்; ‘நீதியால்’ என்பது கடவுளின் நீதியான செயற்பாட்டினால் அவர்கள் உயர்வதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது.
- source_word: יָרוּמוּ
  choice: அவர்கள் உயர்த்தப்படுகிறார்கள்
  rationale: רום உயர்தல் அல்லது மேன்மைப்படுதல் எனப் பொருள்படும். கடவுளின் நீதியே அவர்களுடைய உயர்வுக்குக் காரணம் என்ற சூழல்சார்ந்த பொருளைச் செயப்பாட்டு வடிவம் வெளிப்படுத்துகிறது; எபிரெய வடிவம் தன்னிலையாகவும் புரிந்துகொள்ளப்படலாம் என்பதால் மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: கடவுளுடைய צדקה என்பதன் பொருள்
  choice: நீதி
  alternative: நீதித்தன்மை
  rationale: சொல் ஒழுக்கச் செம்மையையும் நீதியான செயற்பாட்டையும் உள்ளடக்கக்கூடும். தமிழில் ‘நீதி’ இரண்டையும் ஓரளவு தாங்குவதோடு, சங்கீதத்தின் புகழ்ச்சிச் சூழலில் கடவுளின் நீதியான செயலையும் இயல்பாகக் குறிக்கிறது.
- issue: יָרוּמוּ என்பது உயர்த்தப்படுவதா அல்லது உயர்வதா
  choice: உயர்த்தப்படுகிறார்கள்
  alternative: உயர்கிறார்கள்
  rationale: கடவுளுடைய நீதியுடனான இணைப்பு, அவர்களது உயர்வுக்கு அவர் காரணம் என்ற பொருளை ஆதரிக்கிறது. ஆயினும் எபிரெய வினை வடிவமே வெளிப்படையான செயப்பாட்டு வடிவம் அல்ல; ஆகவே தன்னிலை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதையும் சங்கீதத்துக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது; மிகப் பழமையான அல்லது சமயப் பிரிவுக்கே உரிய சொற்கள் தவிர்க்கப்பட்டுள்ளன.
