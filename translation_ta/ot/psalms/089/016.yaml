revisions:
- from: உமது பெயரில் அவர்கள் நாள் முழுவதும் மகிழ்ந்து களிகூருகிறார்கள்; உமது நீதியால் அவர்கள் உயர்த்தப்படுகிறார்கள்.[a]
  to: உமது பெயரில் அவர்கள் நாள் முழுவதும் களிகூர்கிறார்கள்; உமது நீதியினால் அவர்கள் உயர்கிறார்கள்.[a]
  rationale: The revision removes an explicit passive not present in the Hebrew, streamlines the idiom for joyful exultation, and retains the lexical and syntactic alternatives in a focused footnote. No doctrinal interpretation is introduced.
