review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the verse's two clauses and temporal expression. However, יָרוּמוּ is Qal ('they rise/are high'), not an explicit passive; 'உயர்த்தப்படுகிறார்கள்' adds a passive causation not marked by the Hebrew. Rendering it as 'உயர்கிறார்கள்' best preserves the form while allowing the preceding prepositional phrase to express the relationship to God's righteousness.
  naturalness: ‘மகிழ்ந்து களிகூருகிறார்கள்’ is understandable but unnecessarily duplicates closely related expressions. ‘களிகூர்கிறார்கள்’ alone naturally conveys the joyful exultation of יְגִילוּן in modern standard Tamil. The revised wording is concise and suitably elevated for a psalm.
  terminology: ‘உமது பெயரில்’ appropriately preserves the Hebrew expression without reducing ‘name’ to a mere label. ‘நீதியினால்’ is a natural Tamil rendering of צדקה and can retain the Hebrew term's overlapping senses of righteousness and justice. The note retains the viable locative rendering and clarifies that the verb itself is not passive.
  issues:
  - severity: medium
    issue: The main text renders יָרוּמוּ as an explicit passive (‘உயர்த்தப்படுகிறார்கள்’).
    rationale: The Hebrew is Qal imperfect, not a passive stem. Although the context can imply that God's righteousness is the basis or cause of their elevation, an explicit Tamil passive over-specifies the grammar. ‘உயர்கிறார்கள்’ preserves the source wording more closely.
  - severity: low
    issue: ‘மகிழ்ந்து களிகூருகிறார்கள்’ is semantically repetitive.
    rationale: Both elements express joy, while the single verb ‘களிகூர்கிறார்கள்’ adequately conveys the intensive celebratory sense of גיל without redundancy.
  revised_text: உமது பெயரில் அவர்கள் நாள் முழுவதும் களிகூர்கிறார்கள்; உமது நீதியினால் அவர்கள் உயர்கிறார்கள்.[a]
