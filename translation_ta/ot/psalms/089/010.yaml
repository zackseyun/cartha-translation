source:
  edition: WLC
  text: אַתָּ֤ה דִכִּ֣אתָ כֶ/חָלָ֣ל רָ֑הַב בִּ/זְר֥וֹעַ עֻ֝זְּ/ךָ֗ פִּזַּ֥רְתָּ אוֹיְבֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/010.yaml
  text: You crushed Rahab like one slain[a]; with your mighty arm you scattered your enemies.
translation:
  language: ta
  text: கொல்லப்பட்ட ஒருவரைப்போல் ராகாபை நொறுக்கினீர்[a]; உமது வலிமைமிக்க புயத்தால் உமது பகைவர்களைச் சிதறடித்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ராகாப்’ என்பது எகிப்தையோ, கடவுளால் தோற்கடிக்கப்பட்ட குழப்ப அரக்கன் அல்லது குழப்பச் சக்தியையோ குறிக்கக்கூடிய கவிதைப் பெயர்.
    reason: alternative_reading
lexical_decisions:
- source_word: דִכִּאתָ
  choice: நொறுக்கினீர்
  rationale: வலுக்கட்டாயமாக உடைத்தல் அல்லது நசுக்குதல் என்ற வினையின் தீவிரத்தையும் போர்ச் சித்திரத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כֶחָלָל
  choice: கொல்லப்பட்ட ஒருவனைப்போல்
  rationale: כְּ ஒப்புமையையும், போரில் குத்தப்பட்டு அல்லது தாக்கப்பட்டுக் கொல்லப்பட்ட ஒருவரைக் குறிக்கும் חָלָל என்பதையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: רָהַב
  choice: ராகாபை
  rationale: எகிப்தையோ குழப்பத்தின் அரக்கன்/சக்தியையோ கவிதைமுறையில் குறிக்கக்கூடிய பெயரை ஒலிபெயர்த்து, அதன் திட்டமிட்ட பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: בִּזְרוֹעַ עֻזְּךָ
  choice: உமது வலிமைமிக்க புயத்தால்
  rationale: இது கருவிப் பொருளை வெளிப்படுத்துவதோடு, தெய்வீக வல்லமையை மனித உடல் உறுப்பின் உருவகத்தால் காட்டும் மூலப்படிமத்தையும் காக்கிறது.
- source_word: פִּזַּרְתָּ
  choice: சிதறடித்தீர்
  rationale: சிதறச் செய்தல் என்ற நேரடிப் பொருளை, போர்ச் சூழலுக்கு ஏற்ற தீவிரத்துடன் தருகிறது; மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் ராணுவக் கருத்தைச் சேர்ப்பதில்லை.
- source_word: אוֹיְבֶיךָ
  choice: உமது பகைவர்களை
  rationale: உடைமைப் பொருளுடைய பன்மைப் பெயர்ச்சொல்லின் நேரடியான, கண்ணியமான நவீனத் தமிழ் மொழிபெயர்ப்பு.
theological_decisions:
- issue: கவிதைச் சூழலில் רָהַב என்பதன் அடையாளம்
  choice: முதன்மை உரையில் தோற்கடிக்கப்பட்ட அண்ட/அரசியல் எதிரியைக் குறிக்கும் கவிதைப் பெயராக ‘ராகாப்’ என்பதைத் தக்கவைத்தல்.
  alternative: ‘எகிப்து’ என்று மொழிபெயர்த்தல், அல்லது புராணப் பாணியிலான கடல் அரக்கன்/குழப்பச் சக்தி என்று விளக்கி மொழிபெயர்த்தல்.
  rationale: இந்தப் பெயர் எகிப்தைக் கவிதைமுறையில் குறிக்கவும் குழப்பச் சக்தியின் படிமத்தை எழுப்பவும் முடியும். ஒரே பொருளாகத் தீர்மானிக்காமல் ஒலிபெயர்ப்பது மூலத்தின் கவிதைச் செறிவையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது; சாத்தியமான அடையாளங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய மரியாதைப் பன்மை பேணப்பட்டுள்ளது; ‘புயம்’ என்ற சொல் உயர்ந்த கவிதைநடையையும் உடல் உறுப்பின் மூல உருவகத்தையும் தக்கவைக்கிறது.
