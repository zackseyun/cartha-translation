id: PSA.89.24
reference: Psalms 89:24
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וֶֽ/אֶֽמוּנָתִ֣/י וְ/חַסְדִּ֣/י עִמּ֑/וֹ וּ֝/בִ/שְׁמִ֗/י תָּר֥וּם קַרְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/024.yaml
  text: And my faithfulness and my steadfast love will be with him[a], and in my name his horn will be exalted.
translation:
  language: ta
  text: என் நம்பகத்தன்மையும் என் நிலைத்த அன்பும் அவனோடு இருக்கும்; என் பெயரில் அவனுடைய கொம்பு உயர்ந்து நிற்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொம்பு’ என்பது வலிமை, கண்ணியம் அல்லது அரச அதிகாரத்தைக் குறிக்கும் எபிரெய உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: אֱמוּנָתִי
  choice: என் உண்மைத்தன்மை
  rationale: இங்கு אֱמוּנָה என்பது நம்பிக்கை வைக்கும் செயலை அல்ல, கடவுளின் நம்பகத்தன்மையையும் வாக்குத் தவறாத தன்மையையும் குறிக்கிறது.
- source_word: חַסְדִּי
  choice: என் மாறாத அன்பு
  rationale: உடன்படிக்கைச் சூழலில் חֶסֶד குறிக்கும் நிலையான, பற்றுறுதியுள்ள அன்பை இயல்பான நவீனத் தமிழில் எடுத்துரைக்கிறது.
- source_word: עִמּוֹ
  choice: அவனோடு
  rationale: உடனிருப்பையும் துணைநிற்பதையும் குறிக்கும் எபிரெய முன்னிடைச்சொல்லின் நேரான பொருள்.
- source_word: בִּשְׁמִי
  choice: என் பெயரால்
  rationale: בְּ இங்கு கடவுளின் பெயரிலிருந்து வரும் ஆற்றல் அல்லது ஆதாரத்தைக் குறிக்கக்கூடும்; தமிழில் ‘என் பெயரால்’ இயல்பாக இருந்து மூல மொழியின் தொடர்பையும் காக்கிறது.
- source_word: תָּרוּם
  choice: உயர்த்தப்படும்
  rationale: רוּם என்பதன் உயருதல் அல்லது உயர்த்தப்படுதல் என்ற பொருளை, ‘கொம்பு’ என்ற உருவகத்துடன் நேரடியாகப் பாதுகாக்கிறது.
- source_word: קַרְנוֹ
  choice: அவனுடைய கொம்பு
  rationale: கֶרֶן என்பதன் நேர்ப்பொருளான ‘கொம்பு’ என்பதைக் கவித்துவ உருவகமாகத் தக்கவைக்கிறது; அதன் குறியீட்டுப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: அரசாட்சிக்குரிய ‘கொம்பு’ உருவகத்தைத் தக்கவைத்தல்
  choice: அவனுடைய கொம்பு உயர்த்தப்படும்
  alternative: அவனுடைய வல்லமை மேன்மையடையும்
  rationale: வலிமை, கண்ணியம், அரச அதிகாரம் ஆகியவற்றைக் குறிக்கும் எபிரெயக் கவித்துவ உருவகத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- issue: בִשְׁמִי என்பதன் கருவி அல்லது சூழல் சார்ந்த நுண்பொருள்
  choice: என் பெயரால்
  alternative: என் பெயரில்
  rationale: இரு வாசிப்புகளும் சாத்தியம்; இச்சூழலில் அரசனின் உயர்வு கடவுளின் பெயரிலிருந்து வருவதை ‘பெயரால்’ இயல்பாகக் காட்டுகிறது, ஆனால் அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உண்மைத்தன்மை’, ‘மாறாத அன்பு’ ஆகியவை உடன்படிக்கைச் சூழலின் இணைச்சொற்களாக வைக்கப்பட்டுள்ளன; ‘கொம்பு’ என்ற மூல உருவகம் விளக்க அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
