revisions:
- from: என் உண்மைத்தன்மையும் என் மாறாத அன்பும் அவனோடு இருக்கும்; என் பெயரால் அவனுடைய கொம்பு உயர்த்தப்படும்.[a]
  to: என் நம்பகத்தன்மையும் என் நிலைத்த அன்பும் அவனோடு இருக்கும்; என் பெயரில் அவனுடைய கொம்பு உயர்ந்து நிற்கும்.[a]
  rationale: The revision retains the Hebrew parallelism and royal metaphor, improves modern Tamil idiom for divine faithfulness, renders the name phrase more literally, and avoids adding an implicit agent through a passive verb.
