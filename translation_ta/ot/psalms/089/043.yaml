source:
  edition: WLC
  text: אַף תָּ֭שִׁיב צ֣וּר חַרְבּ֑/וֹ וְ/לֹ֥א הֲ֝קֵימֹת֗/וֹ בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/043.yaml
  text: Indeed[a], you turn back the edge of his sword[b], and you have not made him stand in battle.
translation:
  language: ta
  text: மேலும், அவருடைய வாளின் கூர்மையை மழுங்கச் செய்தீர்[a]; போரில் அவர் நிலைத்து நிற்கும்படி செய்யவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பட, ‘அவருடைய வாளின் விளிம்பைத் திருப்பிவிட்டீர்.’ இதன் பொருள், வாளைப் பயனற்றதாக்கினீர் என்பதாகும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘போரில் அவரை நிலைநிறுத்தவில்லை’ அல்லது ‘போரில் அவர் நிற்கத் துணைசெய்யவில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: அதுமட்டுமல்ல
  rationale: இது புலம்பலின் தொடரில் முந்தைய குற்றச்சாட்டோடு இன்னொன்றை வலியுறுத்திச் சேர்க்கும் இடைச்சொல். ‘அதுமட்டுமல்ல’ என்பது அதன் சேர்க்கை மற்றும் வலியுறுத்தல் ஆகிய இரு நுணுக்கங்களையும் இயல்பான தமிழில் தருகிறது.
- source_word: תָּשִׁיב
  choice: மழுங்கச் செய்தீர்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் சொற்பட ‘திரும்பச் செய்தல்’ எனப் பொருள்படும். இங்கு வாளின் கூர்மையே அதன் பொருளாக இருப்பதால், வாள் பயனற்றதாக ஆக்கப்பட்ட விளைவை ‘மழுங்கச் செய்தீர்’ தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; சொற்படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: צוּר
  choice: கூர்மை
  rationale: חַרְבּוֹ என்பதுடன் இணைந்த இச்சொல் இங்கு ‘பாறை’ என்பதை அல்ல, வாளின் கூரிய விளிம்பு அல்லது கூர்மையைக் குறிக்கிறது. நவீன தமிழில் ‘வாளின் கூர்மை’ இயல்பான இணைச்சொல்.
- source_word: חַרְבּוֹ
  choice: அவருடைய வாள்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டு வெளிப்படையாக ‘அவருடைய’ என்று தரப்பட்டுள்ளது.
- source_word: הֲקֵימֹתוֹ
  choice: அவர் நிலைத்து நிற்கும்படி செய்யவில்லை
  rationale: קום என்பதன் ஹிஃபில் வடிவம் ‘நிற்கச் செய்தல், நிலைநிறுத்துதல்’ என்பதைக் குறிக்கும். போர்ச் சூழலில், அவர் தம் இடத்தைத் தக்கவைத்து நிற்க இயலுமாறு செய்யப்படவில்லை என்ற concrete படிமத்தை இத்தேர்வு பாதுகாக்கிறது.
- source_word: בַּמִּלְחָמָה
  choice: போரில்
  rationale: முன்னொட்டுடன் வரும் இச்சொல்லுக்கு சூழலில் இயல்பான, சுருக்கமான தமிழ் இணை ‘போரில்’ ஆகும்.
theological_decisions:
- issue: தாவீதிய அரசனுக்கு எதிராகக் கடவுள் நேரடியாகச் செயல்படுவதாகக் கூறும் புலம்பல்
  choice: ‘மழுங்கச் செய்தீர் … செய்யவில்லை’ என்ற நேரடி இரண்டாம் நபர் உரையை அப்படியே வைத்தல்
  alternative: கடவுளின் செயற்பாட்டைத் தணிக்கும் வகையில் செயப்பாட்டுவினை அல்லது ஆளில்லா வாக்கியமாக மாற்றுதல்
  rationale: எபிரெய உரை அரசனின் போர்த் தோல்வியை நேரடியாகக் கடவுளின் செயலோடு இணைக்கிறது. அந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தாமல் பாதுகாக்க வேண்டும்.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் நேரடியான குற்றச்சாட்டு தணிக்கப்படவில்லை.
