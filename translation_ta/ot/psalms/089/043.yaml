  source_fidelity: மூலத்தின் இரண்டு வினைச்சொற்களும், கடவுளை நேரடியாக நோக்கிய இரண்டாம் நபர் மரியாதைப் பன்மையும், அரசனைக் குறிக்கும் மூன்றாம் நபர் ஒருமையும் சரியாகப் பாதுகாக்கப்பட்டுள்ளன. எனினும் אַף என்பதன் சேர்க்கை-வலியுறுத்தல் நுணுக்கத்திற்கு ‘அதுமட்டுமல்ல’ ஓரளவு அதிகமான ‘not only that’ உணர்வைத் தருகிறது; ‘மேலும்’ இங்கு நெருக்கமானது. ‘மழுங்கச் செய்தீர்’ என்பது சூழலுக்கேற்ற விளைவுரையாக ஏற்கத்தக்கது; அடிக்குறிப்பு மூலத்தின் ‘திருப்புதல்’ படிமத்தைத் தெளிவாகத் தர வேண்டும்.
  naturalness: ‘மேலும்’ மற்றும் ‘போரில் அவர் நிலைத்து நிற்கும்படி செய்யவில்லை’ நவீன தரத் தமிழில் இயல்பாகவும் சங்கீதப் புலம்பலுக்குரிய கண்ணியமான நடையுடனும் உள்ளன. ‘வாளின் கூர்மையைத் திரும்பச் செய்தீர்’ என்ற அடிக்குறிப்பு நடை இயல்பற்றது; ‘திருப்பிவிட்டீர்’ எனத் திருத்தப்பட்டுள்ளது.
