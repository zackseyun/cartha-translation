id: PSA.89.18
reference: Psalms 89:18
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֣י לַֽ֭/יהוָה מָֽגִנֵּ֑/נוּ וְ/לִ/קְד֖וֹשׁ יִשְׂרָאֵ֣ל מַלְכֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/018.yaml
  text: For our shield belongs to Yahweh[a], and our king to the Holy One of Israel.
translation:
  language: ta
  text: ஏனெனில், நமது கேடயம் ஆண்டவருக்குரியது; நமது அரசன் இஸ்ரவேலின் பரிசுத்தருக்குரியவன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நமது கேடயம் ஆண்டவருடையது; நமது அரசன் இஸ்ரவேலின் பரிசுத்தருக்குரியவன்.” எபிரெய மொழிநடை சுருக்கமானதும் மிகுந்த இணை அமைப்புடையதும் ஆகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புகழ்ச்சிக்கும் நம்பிக்கைக்கும் காரணம் அல்லது அடிப்படையை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக உள்ளது.
- source_word: לַיהוָה
  choice: ஆண்டவருக்குரியது
  rationale: ל முன்னொட்டு இங்கு உடைமை அல்லது உறவைக் குறிக்கிறது. தமிழ் நடையில் இயல்பாகவும் எபிரெயச் சுருக்கத்தன்மையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது.
- source_word: מָגִנֵּנוּ
  choice: நமது கேடயம்
  rationale: பாதுகாப்பைக் குறிக்கும் கவிதை உருவகம் தெளிவானதால், அதை ‘பாதுகாவலன்’ என்று விளக்கிப் பொருளாக்காமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: நமது அரசன் இஸ்ரவேலின் பரிசுத்தருக்குரியவன்
  rationale: இரண்டாவது ל முதலாவது அடியின் உடைமை/உறவுக் கட்டமைப்புக்கு இணையாக உள்ளது; இயல்பான தமிழ் சொல்வரிசையில் அந்த இணைவு காக்கப்படுகிறது.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: இஸ்ரவேலின் பரிசுத்தர்
  rationale: இது எபிரெய வேதாகமத்தில் நிலையான இறைப் பட்டம்; அதன் கண்ணியமும் அடையாளப்படுத்தத்தக்க வடிவமும் பாதுகாக்கப்படுகின்றன.
- source_word: מַלְכֵּנוּ
  choice: நமது அரசன்
  rationale: ‘அரசன்’ என்பது நேரடியான பொருள்; அரசாட்சிப் படிமத்தையும் மனித அரசரைச் சுட்டக்கூடிய சாத்தியத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘நமது கேடயம்’ மற்றும் ‘நமது அரசன்’ என்பவற்றின் சுட்டுப்பொருள்
  choice: இரண்டு சொற்றொடர்களும் கடவுளுக்குரியதும் அவருடைய அதிகாரத்தின்கீழ் இருப்பதுமான இஸ்ரவேலின் மனித அரசப் பிரதிநிதியை இணையான கவிதை அமைப்பில் சுட்டக்கூடும்; மொழிபெயர்ப்பு இதைத் தீர்மானமாக விளக்காமல் மூலத்தின் அமைப்பைக் காக்கிறது.
  alternative: ‘நமது கேடயம்’ நேரடியாகக் கடவுளையும், ‘நமது அரசன்’ மனித அரசனையும் சுட்டுகிறது.
  rationale: இரு அடிகளிலும் ל முன்னொட்டுள்ள இணையான கட்டமைப்பு (‘ஆண்டவருக்குரியது’ // ‘இஸ்ரவேலின் பரிசுத்தருக்குரியவன்’) உள்ளது. அரச சங்கீதச் சூழலில் ‘கேடயம்’ பாதுகாக்கும் அரசனுக்கான உருவகமாக இருக்கலாம்; இருப்பினும் மூலத்தின் சுருக்கமும் பொருள் நெருக்கடியும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சங்கீத நடையைப் பயன்படுத்துகிறது. ‘கேடயம்’ என்ற கவிதை உருவகமும் ‘இஸ்ரவேலின் பரிசுத்தர்’ என்ற இறைப் பட்டமும் தக்கவைக்கப்பட்டுள்ளன; ஆண்டவர் என்ற வடிவம் יהוה-ஐக் குறிக்கிறது.
