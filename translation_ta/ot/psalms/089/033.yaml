  text: But my steadfast love I will not remove from him[b][a], nor will I deal falsely in my faithfulness.
translation:
  language: ta
  text: ஆனால் என் மாறாத அன்பை[a] அவனிடமிருந்து விலக்கமாட்டேன்; என் உண்மைத்தன்மையைப் பொய்யாக்கவும் மாட்டேன்.[b]
  philosophy: optimal-equivalence
