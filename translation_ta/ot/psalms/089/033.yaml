lexical_decisions:
- source_word: חַסְדִּי
  choice: என் மாறாத அன்பை
  rationale: חֶסֶד என்பது வெறும் உணர்ச்சியை அல்லாமல் நிலையான, உறவுப்பற்றுள்ள அன்பைக் குறிக்கிறது. ‘மாறாத அன்பு’ அதன் அன்பையும் உறுதியையும் இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது.
- source_word: אָפִיר
  choice: விலக்கமாட்டேன்
  rationale: இங்குள்ள פור என்பதன் ஹிஃபில் வடிவம் ஒருவரிடமிருந்து ஒன்றை அகற்றுதல் அல்லது திரும்பப் பெற்றுக்கொள்ளுதல் என்னும் பொருளைத் தருகிறது. מֵעִמּוֹ என்பதோடு ‘விலக்கமாட்டேன்’ இயல்பாகப் பொருந்துகிறது.
- source_word: מֵעִמּוֹ
  choice: அவனிடமிருந்து
  rationale: முன்னிடைச்சொல்லும் மூன்றாம் நபர் ஒருமை பின்னொட்டும் சேர்ந்து, குறிப்பிடப்பட்ட நபரிடமிருந்து பிரித்தல் என்ற பொருளைத் தெளிவாகத் தருகின்றன.
- source_word: אֲשַׁקֵּר
  choice: பொய்யாக நடந்துகொள்ளவும் மாட்டேன்
  rationale: שׁקר என்பதன் பியேல் வடிவம் வாயால் பொய் சொல்வதை மட்டும் அல்லாமல் பொய்மையாக அல்லது வஞ்சகமாக நடந்துகொள்வதையும் குறிக்கும். இத்தொடர் அந்த விரிந்த செயல்சார் பொருளைப் பாதுகாக்கிறது.
- source_word: בֶּאֱמוּנָתִי
  choice: என் உண்மைத்தன்மையில்
  rationale: אֱמוּנָה இங்கு நம்பகத்தன்மை, உறுதிப்பற்று ஆகியவற்றைக் குறிக்கிறது. ב முன்னிடைச்சொல்லின் சற்றே இடியம்சமான அமைப்பைத் தீர்த்துவிடாமல் ‘என் உண்மைத்தன்மையில்’ என்று வடிவத்தையும் பொருளையும் காக்கிறது.
- source_word: וְ
  choice: ஆனால்
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட தண்டனைக்கும் இங்கு உறுதிப்படுத்தப்படும் நிலையான அன்புக்கும் இடையிலான முரணைச் சூழல் காட்டுவதால், இணைப்புச் சொல் எதிர்மறைத் திருப்பாக மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: தாவீதிய அரசனுக்கான கடவுளின் உறுதிப்பாட்டை வெளிப்படுத்தும் உடன்படிக்கைச் சார்ந்த மொழி
  choice: ‘மாறாத அன்பு’ மற்றும் ‘உண்மைத்தன்மை’ என்று மொழிபெயர்த்து, தண்டனை இருந்தாலும் கடவுளின் உறவுப்பற்று நீங்காது என்ற பதற்றத்தைப் பாதுகாத்தல்
  alternative: ‘இரக்கம்’ மற்றும் ‘சத்தியம்’ என்ற பாரம்பரிய சொற்களைப் பயன்படுத்துதல்
  rationale: வசனம் தெய்வீகத் தண்டனை உடன்படிக்கைப் பற்றுறுதியை ரத்து செய்வதில்லை என்பதை வலியுறுத்துகிறது. தேர்ந்தெடுக்கப்பட்ட சொற்கள் பிற்காலக் கோட்பாட்டு அமைப்புகளைப் புகுத்தாமல் இந்த உறுதியையும் பதற்றத்தையும் இயல்பான தமிழில் காட்டுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில் எளிதாகப் புரியும், ஆனால் சங்கீதத்திற்குரிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றாமல் இயல்பான தமிழ் வாக்கிய அமைப்பு தரப்பட்டுள்ளது; அதேவேளை இரண்டாம் கூறின் உண்மையான இடியம்சத் தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
