base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/022.yaml
  text: No enemy will exact tribute from him[b][a], and no son of wickedness will afflict him.
translation:
  language: ta
  text: எந்தப் பகைவனும் அவனிடமிருந்து கப்பம் வசூலிக்கமாட்டான்[a]; அநீதியின் மகன்[b] அவனைத் துன்புறுத்தமாட்டான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்தப் பகைவனும் அவனை ஏமாற்றமாட்டான்” அல்லது “அவன்மேல் சுமை சுமத்தமாட்டான்.” எபிரெய வினைச்சொல் ஒன்றோடொன்று தொடர்புடைய பல பொருள்களைக் கொள்ளக்கூடும்; இங்கு பகைமையான ஒடுக்குமுறைச் சூழலுக்கு ஏற்ப “கப்பம் வசூலிக்கமாட்டான்” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “அநீதியின் மகன்”; இது அநீதி செய்பவனை அல்லது தீயவனைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשִּׁא
  choice: கப்பம் வசூலிக்கமாட்டான்
  rationale: இந்தச் சூழலில் נשׁא என்பதன் ஹிஃபில் வடிவம் பகைவர் அரசியல் அல்லது பொருளாதாரச் சுமையை விதித்து வசூலிப்பதைக் குறிக்கலாம். இணைவரியில் வரும் ‘துன்புறுத்துதல்’ என்பதும் அரசனுக்குக் கொடுக்கப்படும் பாதுகாப்பும் இப்பொருளை ஆதரிக்கின்றன; ஆயினும் ‘ஏமாற்றுதல்’ அல்லது ‘சுமத்துதல்’ என்ற சாத்தியங்களும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: אוֹיֵב
  choice: பகைவன்
  rationale: ஒருமை பெயர்ச்சொல்லின் இயல்பான நவீனத் தமிழ் வடிவம்; சங்கீதத்தின் அரச மற்றும் பகைமைச் சூழலுக்குப் பொருந்துகிறது.
- source_word: בּוֹ
  choice: அவனிடமிருந்து
  rationale: יַשִּׁא என்பதை ‘கப்பம் வசூலித்தல்’ என்று எடுத்துக்கொள்ளும்போது, בּוֹ என்பதற்கு தமிழில் இயல்பான உறவு ‘அவனிடமிருந்து’ ஆகும்.
- source_word: בֶן עַוְלָה
  choice: அநீதியின் மகன்
  rationale: எபிரெய உருவகச் சொற்றொடரையும் கவிதை நடையையும் வெளிப்படையாகப் பாதுகாக்கிறது. இது சொல்லுக்குச் சொல் உயிரியல் உறவைக் குறிக்காமல் அநீதி செய்பவனைக் குறிக்கும் மரபுத்தொடர்.
- source_word: עַוְלָה
  choice: அநீதி
  rationale: இச்சொல் அநியாயம், தீமை, தவறான செயல் ஆகிய பொருள்களைத் தாங்குகிறது; இங்கு ‘அநீதி’ மூல உருவகத்தைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: יְעַנֶּנּוּ
  choice: அவனைத் துன்புறுத்தமாட்டான்
  rationale: ענה என்பதன் பியேல் வடிவம் துன்புறுத்துதல் அல்லது ஒடுக்குதல் எனப் பொருள்படும். ‘துன்புறுத்துதல்’ பரந்த பொருளையும் இணைவரியின் பகைமைச் செயலையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: பாதுகாக்கப்படும் நபரின் அடையாளம்
  choice: ‘அவன்’ என்ற ஒருமைச் சுட்டுப்பெயரை விளக்க விரிவாக்கமின்றி வைத்தல்
  alternative: தாவீது; தாவீதிய அரசன்; முன்னடையாள முறையில் மேசியா
  rationale: உடனடியான எபிரெய உரை உடன்படிக்கைச் சூழலிலுள்ள ஒருமை அரச உருவைக் குறிக்கிறது. மொழிபெயர்ப்பு அவரை இன்னும் குறுகிய அல்லது பிற்கால இறையியல் அடையாளத்துடன் சமப்படுத்தாமல் மூலத்தின் பதற்றத்தையும் திறந்த தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘கப்பம்’ அரசியல்-பொருளாதாரச் சுரண்டலைத் தெளிவுபடுத்துகிறது; ‘அநீதியின் மகன்’ என்ற மூல உருவகம் அடிக்குறிப்பு விளக்கத்துடன் பாதுகாக்கப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
