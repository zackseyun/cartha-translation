source:
  edition: WLC
  text: פָּרַ֥צְתָּ כָל גְּדֵרֹתָ֑י/ו שַׂ֖מְתָּ מִבְצָרָ֣י/ו מְחִתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/040.yaml
  text: You have broken down all his walls[c][b][a]; you have made his strongholds a ruin.
translation:
  language: ta
  text: அவனுடைய பாதுகாப்புச் சுவர்கள் அனைத்தையும் நீர் தகர்த்தீர்[a]; அவனுடைய அரண்களை[b] பாழாக்கினீர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய தடுப்புகள் அனைத்தையும் உடைத்தீர்”; “சுற்று வேலிகள்” அல்லது “சுற்று அரண்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சுற்றிப் பாதுகாக்கும் பலவகை அமைப்புகளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கோட்டைகளை.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “பாழ்நிலையாக்கினீர்.” “அழிவுக்குள்ளாக்கினீர்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயப் பெயர்ச்சொல் சில சூழல்களில் “அச்சம்” அல்லது “திகில்” என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַצְתָּ
  choice: தகர்த்தீர்
  rationale: פרץ என்பது உடைத்தல் அல்லது பிளந்து வழி உண்டாக்குதல் என்னும் கருத்தைக் கொண்டது. பாதுகாப்புச் சுவர்களோடு வரும் இச்சூழலில், அழிவின் வலிமையை இயல்பான தமிழில் தெரிவிக்க ‘தகர்த்தீர்’ பொருத்தமானது.
- source_word: כָל
  choice: அனைத்தையும்
  rationale: அழிவு முழுமையானது என்பதை எபிரெய மூலத்தின்படி காக்கிறது.
- source_word: גְּדֵרֹתָיו
  choice: அவனுடைய பாதுகாப்புச் சுவர்கள்
  rationale: גדרה என்பது சுவர், வேலி, சுற்று அரண் அல்லது தடுப்பு எனப் பொருள்படலாம். அடுத்த அரையடியில் அரண்கள் குறிப்பிடப்படுவதால், இங்கு பாதுகாப்பு நோக்கமுள்ள சுற்றுச் சுவர்கள் என்ற பரந்த கருத்து இயல்பாக வெளிப்படுத்தப்படுகிறது.
- source_word: שַׂמְתָּ
  choice: பாழாக்கினீர்
  rationale: שים என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்/ஆக்குதல்.’ מְחִתָּה என்பதோடு சேர்ந்த இக்கட்டமைப்பு தமிழில் இயல்பாக இருக்க வினைச்சொல் வடிவில் மொழிபெயர்க்கப்பட்டது.
- source_word: מִבְצָרָיו
  choice: அவனுடைய அரண்கள்
  rationale: מבצר என்பது பாதுகாப்பாக வலுப்படுத்தப்பட்ட இடம் அல்லது கோட்டை. ‘அரண்கள்’ அதன் தற்காப்பு நுணுக்கத்தையும் கவிதை நடையையும் காக்கிறது.
- source_word: מְחִתָּה
  choice: பாழாக்கினீர்
  rationale: இச்சூழலில் இச்சொல் சிதைவு அல்லது பாழ்நிலையைக் குறிப்பதாகப் புரிகிறது. பாதுகாப்பு அமைப்புகள் தகர்க்கப்படுகின்ற இணைவாக்கியத்தோடு இது நன்கு பொருந்துகிறது; அச்சம் அல்லது திகில் என்ற பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மூன்றாம் ஆண்பால் ஒருமை உரிமை விகுதிகளின் குறிப்பு
  choice: ‘அவனுடைய’ என்பதை விளக்கமின்றித் தக்கவைத்தல்
  alternative: ‘அரசனுடைய’ என்று வெளிப்படையாகக் குறிப்பிடுதல் அல்லது சீயோன்/எருசலேமின் பாதுகாப்புகளாகக் கூட்டுப்பொருளில் விளக்குதல்
  rationale: எபிரெய உரை மூன்றாம் ஆண்பால் ஒருமை விகுதிகளை மட்டுமே பயன்படுத்துகிறது. அருகிலுள்ள சூழல் தாவீதிய அபிஷேகம் பெற்றவரின் வீழ்ச்சியைப் பற்றிப் புலம்பினாலும், முதன்மை உரையில் குறிப்பை வெளிப்படையாகத் தீர்மானிக்காமல் கவிதைசார் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய இரண்டாம் ஆண்பால் ஒருமை வடிவம் தமிழின் மரியாதை வழக்கின்படி ‘நீர்/தகர்த்தீர்/பாழாக்கினீர்’ என வழங்கப்பட்டுள்ளது. இணைவாக்கியத்தின் தற்காப்பு உருவகமும் மூலத்தின் ஆண்பால் ஒருமைக் குறிப்பும் காக்கப்பட்டுள்ளன.
