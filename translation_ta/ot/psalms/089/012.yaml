lexical_decisions:
- source_word: צָפוֹן
  choice: வடக்கு
  rationale: இச்சொல் பொதுவாக வடக்குத் திசையையோ வடபகுதியையோ குறிக்கிறது. יָמִין என்பதுடன் இணைந்து படைக்கப்பட்ட உலகின் எதிரெதிர்த் திசைகளைக் குறிக்கும் கவித்துவ இணையாக இங்கு வருகிறது.
- source_word: יָמִין
  choice: தெற்கு
  rationale: சொல்லடியாக ‘வலப்பக்கம்’ என்றாலும், கிழக்கு நோக்கி நின்று திசைகளைச் சுட்டும் எபிரெய வழக்கில் வலப்பக்கம் தெற்கைக் குறிக்கும். צָפוֹן (‘வடக்கு’) என்பதுடன் உள்ள இணைவும் இப்பொருளை உறுதிப்படுத்துகிறது.
- source_word: בְרָאתָם
  choice: நீரே படைத்தீர்
  rationale: இது Qal நிறைவுவினை, இரண்டாம் நபர் ஆண்பால் ஒருமை, மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் உள்ளது. தமிழில் இறைவனை நோக்கும் மரியாதை ஒருமையையும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்த ‘நீரே படைத்தீர்’ என வழங்கப்பட்டது.
- source_word: תָּבוֹר
  choice: தாபோர்
  rationale: மலையின் இடப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: חֶרְמוֹן
  choice: எர்மோன்
  rationale: மலையின் இடப்பெயர் என்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டது; தொடக்க எபிரெய மெய்யொலிக்கு இயல்பான தமிழ் ஒலிப்பைத் தேர்ந்தெடுத்துள்ளது.
- source_word: בְּשִׁמְךָ
  choice: உமது பெயரில்
  rationale: בְּ முன்னிடைச்சொல் இங்கு சூழல், அடிப்படை அல்லது காரணத்தை உணர்த்தக்கூடும். ‘உமது பெயரில்’ என்பது இறைவனின் வெளிப்பட்ட அடையாளமும் புகழும் சார்ந்த மகிழ்ச்சியைச் சுருக்கமாகக் காக்கிறது.
- source_word: יְרַנֵּנוּ
  choice: மகிழ்ந்து பாடுகின்றன
  rationale: רנן என்பதன் Piel வடிவம் ஒலித்தெழும் மகிழ்ச்சிக் குரலைக் குறிக்கிறது. மலைகள் மனிதப் பண்பு பெற்று இறைவனைப் புகழும் கவித்துவப் படிமத்திற்கு ‘மகிழ்ந்து பாடுகின்றன’ இயல்பாகப் பொருந்துகிறது; ‘மகிழ்ச்சி ஆரவாரம் செய்கின்றன’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: צָפוֹן உடன் இணைந்த יָמִין என்பதன் பொருள்
  choice: ‘வடக்கும் தெற்கும்’ என்ற திசைசார் முழுமை இணை
  alternative: சொல்லடியான ‘வடக்கும் வலப்பக்கமும்’
  rationale: இவ்வசனம் இறைவனின் படைப்பை விரிந்த நிலப்பரப்பாகப் போற்றுகிறது. எதிரெதிர்த் திசைகளான வடக்கு–தெற்கு என்ற வாசிப்பு கவித்துவ அமைப்பைக் காக்கிறது; சொல்லடியான ‘வலப்பக்கம்’ தமிழில் நோக்கப்பட்ட புவியியல் பொருளை மறைத்துவிடும். மாற்று சொல்லடி அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: தாபோர் மற்றும் எர்மோனின் செயல்
  choice: மலைகளே கவித்துவமாக மனிதப் பண்பு பெற்று மகிழ்ந்து பாடுகின்றன
  alternative: அந்த மலைப்பகுதிகளில் வாழும் மக்கள் பாடுகின்றனர்
  rationale: இரண்டு இடப்பெயர்களோடு பன்மை வினை வருவதும், படைப்பு இறைவனைப் புகழ்வதாகச் சங்கீதங்களில் வரும் கவித்துவ வழக்கமும், மலைகளை நேரடியாக எழுவாய்களாக வைத்திருக்க ஆதரிக்கின்றன. குடியிருப்போரைக் கொண்டு விளக்கும் கருத்தை முதன்மை உரைக்குள் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கவித்துவக் கண்ணியமும் இணைக்கப்பட்டுள்ளன. இறைவனை நோக்கி ‘நீர்/உமது’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. மலைகளின் மனிதப்படுத்தலைத் தெளிவாகக் காக்க ‘பாடுகின்றன’ என்ற அஃறிணைப் பன்மை வினை அமைக்கப்பட்டுள்ளது.
