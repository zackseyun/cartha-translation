lexical_decisions:
- source_word: אֲחַלֵּל
  choice: மீறமாட்டேன்
  rationale: חלל என்பதன் பியேல் வடிவம் இங்கு உடன்படிக்கையை அவமதித்து மீறுவதைக் குறிக்கிறது. நவீன தமிழில் ‘உடன்படிக்கையை மீறுதல்’ இயல்பாகவும் பொருள்தெளிவுடனும் உள்ளது.
- source_word: בְּרִיתִי
  choice: என் உடன்படிக்கையை
  rationale: בְּרִית என்பதற்கான வழக்கமான வேதாகமத் தமிழ் இணை ‘உடன்படிக்கை’; முதலாம் நபர் ஒருமை உரிமை விகுதி ‘என்’ எனத் தக்கவைக்கப்பட்டது.
- source_word: מוֹצָא שְׂפָתַי
  choice: என் உதடுகளிலிருந்து புறப்பட்டதை
  rationale: ‘என் உதடுகளின் புறப்பாடு’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் தக்கவைத்து, அது பேசப்பட்ட சொல்லைக் குறிக்கும் என்பதைச் சூழல் உணர்த்துகிறது.
- source_word: אֲשַׁנֶּה
  choice: மாற்றவும் மாட்டேன்
  rationale: பியேல் வடிவம் ‘மாற்றுதல்’ என்ற பொருளைத் தருகிறது; பேசிய வார்த்தையை மாற்றாதிருப்பதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֹא ... לֹא
  choice: மீறமாட்டேன் ... மாற்றவும் மாட்டேன்
  rationale: இருமுறை வரும் மறுப்பை இரண்டு இணையான வினைமுற்றுகளால் வெளிப்படுத்தி எபிரெய வலியுறுத்தலைப் பாதுகாக்கிறது.
theological_decisions:
- issue: இறைவனின் உறுதிப்பாட்டைக் குறிக்கும் மொழி
  choice: ‘உடன்படிக்கை’ மற்றும் உதடுகளிலிருந்து புறப்பட்ட சொல் என்ற நேரடியான உருவகங்களைத் தக்கவைத்தல்
  alternative: ‘என் வாக்குறுதியை முறிக்கமாட்டேன்’ அல்லது இறைவனின் மாறாத தன்மையை விளக்கும் விரிவாக்கம்
  rationale: மூலவசனம் குறிப்பாக உடன்படிக்கையையும் பேசப்பட்ட வார்த்தையையும் குறிப்பிடுகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விளக்கத்தை மொழிபெயர்ப்பில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கண்ணியமானதும் பொதுவாசகர்களுக்கு எளிதில் புரியக்கூடியதுமான நடை. எபிரெய இணைவாக்கிய அமைப்பும் உதடுகள் பற்றிய உருவகமும் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
