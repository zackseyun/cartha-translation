  yaml_path: translation/ot/psalms/089/017.yaml
  text: For you are the glory of their strength[b][a], and by your favor you exalt our horn.
translation:
  language: ta
  text: ஏனெனில், அவர்களுடைய வலிமையின் மகிமை[a] நீரே; உமது தயவினால் எங்கள் கொம்பை[b] உயர்த்துகிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய வலிமையின் அழகு/சிறப்பு.”
    reason: lexical_alternative
  - marker: b
    text: “கொம்பு” என்பது வல்லமை, ஆற்றல், அல்லது உயர்ந்த நிலையைக் குறிக்கும் எபிரெய உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்; சங்கீதத்தின் விளக்கத் தொடரை இயல்பாகக் காட்டுகிறது.
- source_word: תִפְאֶרֶת
  choice: மகிமை
  rationale: அழகு, சிறப்பு, மகிமை ஆகிய பொருள் பரப்பை உடையது. இங்கு வலிமைக்கு மதிப்பும் மேன்மையும் அளிப்பவர் கடவுள் என்பதைக் காட்ட ‘மகிமை’ பொருத்தமானது; மாற்றுப் பொருளை அடிக்குறிப்பு காக்கிறது.
- source_word: עֻזָּמוֹ
  choice: அவர்களுடைய வலிமை
  rationale: பெயர்ச்சொல் ‘வலிமை/பலம்’ எனப் பொருள்படும்; பின்னொட்டு மூன்றாம் நபர் ஆண்பால் பன்மை. ஆகவே எபிரெய உரையின் பன்மையையும் ‘அவர்கள்’ என்ற குறிப்பையும் காக்கிறது.
- source_word: אָתָּה
  choice: நீரே
  rationale: தனித்த சுட்டுப்பெயரின் வலியுறுத்தலை மரியாதையான நவீனத் தமிழில் ‘நீரே’ வெளிப்படுத்துகிறது.
- source_word: וּבִרְצֹנְךָ
  choice: உமது தயவினால்
  rationale: רָצוֹן என்பது தயவு, நல்லெண்ணம், அங்கீகாரம் ஆகியவற்றைக் குறிக்கலாம். בְּ முன்னொட்டின் கருவிப் பொருளை ‘-னால்’ தெளிவாகக் காட்டுகிறது.
- source_word: תרים
  choice: உயர்த்துகிறீர்
  rationale: רוּם வேரின் ஹிஃபில் வடிவம் ‘உயர்த்துதல்/மேன்மைப்படுத்துதல்’ எனப் பொருள்படும். ‘கொம்பு’ என்ற உருவகத்துடன் இயல்பாக அமைகிறது.
- source_word: קַרְנֵנוּ
  choice: எங்கள் கொம்பு
  rationale: சொற்பொருளான ‘எங்கள் கொம்பு’ என்பதைக் காத்து, வலிமை, அதிகாரம் அல்லது உயர்ந்த நிலை என்ற கவிதை உருவகத்தின் விளக்கத்தை அடிக்குறிப்பில் தருகிறது.
theological_decisions:
- issue: ‘கொம்பு’ உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் ‘எங்கள் கொம்பு’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தல்.
  alternative: எங்கள் வலிமை / எங்கள் அதிகாரம் / எங்கள் மேன்மை
  rationale: உருவகம் வலிமை, அதிகாரம், உயர்வு ஆகியவற்றை ஒருங்கே உணர்த்துவதால் அதை ஒரே விளக்கப் பொருளாகச் சுருக்காமல் காப்பது மூலத்தின் கவிதைச் செறிவையும் உண்மையான பொருள் பரப்பையும் பாதுகாக்கிறது.
- issue: ‘அவர்களுடைய’ என்பதிலிருந்து ‘எங்கள்’ என்பதற்கான சுட்டுப்பெயர் மாற்றம்
  choice: மூலத்தில் உள்ள மூன்றாம் நபர் பன்மையிலிருந்து முதலாம் நபர் பன்மைக்கான மாற்றத்தை அப்படியே காத்தல்.
  alternative: இரண்டையும் ‘எங்கள்’ என்று ஒத்திசைத்தல்
  rationale: எபிரெய உரையில் உண்மையான சுட்டுப்பெயர் மாற்றம் உள்ளது. வாசிப்பைச் சீராக்குவதற்காக அதை மறைப்பது ஆதாரமற்ற விளக்கத் தீர்வாகிவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைக்கும் dignified நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நீரே’, ‘உமது’, ‘உயர்த்துகிறீர்’ ஆகியவை கடவுளை நோக்கிய மரியாதை ஒருமையைப் பேணுகின்றன. அடிக்குறிப்பு குறிகள் தொடர்புடைய சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
