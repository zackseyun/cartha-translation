source:
  edition: WLC
  text: הֲ֭רִימוֹתָ יְמִ֣ין צָרָ֑י/ו הִ֝שְׂמַ֗חְתָּ כָּל אוֹיְבָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/042.yaml
  text: You have exalted the right hand of his foes[a]; you have made all his enemies rejoice.
translation:
  language: ta
  text: அவருடைய எதிரிகளின் வலக்கையை நீர் உயர்த்தினீர்[a]; அவருடைய பகைவர்கள் அனைவரையும் மகிழச் செய்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய எதிராளிகளின் வலக்கையை நீர் மேலோங்கச் செய்தீர்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרִימוֹתָ
  choice: உயர்த்தினீர்
  rationale: רוּם என்பதன் ஹிஃபில் முற்றுவினை, உயரச் செய்தல் அல்லது மேலோங்கச் செய்தல் என்ற பொருளைத் தருகிறது. வலக்கை என்பதுடன் வரும் உருவகப் பொருளான வலிமை அல்லது சாதக நிலையைத் தமிழில் இயல்பாகக் காக்கிறது.
- source_word: יְמִין
  choice: வலக்கை
  rationale: இச்சொல் நேரடியாக வலக்கையைக் குறித்தாலும், இங்கு ஆற்றல் மற்றும் வல்லமையின் உருவகமாகவும் உள்ளது; எபிரெய உருவகத்தை மொழிபெயர்ப்பில் தக்கவைக்கிறது.
- source_word: צָרָיו
  choice: அவருடைய எதிரிகள்
  rationale: இது அவருக்கு விரோதமாக நிற்கும் எதிராளிகளைக் குறிக்கிறது. அடுத்த அடியில் வரும் வேறொரு எபிரெயச் சொல்லிலிருந்து சொல் வேறுபாட்டைக் காட்ட ‘எதிரிகள்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: הִשְׂמַחְתָּ
  choice: மகிழச் செய்தீர்
  rationale: 'שׂמח என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளைத் தெளிவாகத் தருகிறது: அவர்கள் மகிழும்படி கடவுள் செய்தார்.'
- source_word: כָּל
  choice: அனைவரையும்
  rationale: பன்மை மனிதர்களைக் குறிக்கும் பெயருடன் வரும் முழுமைப் பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אוֹיְבָיו
  choice: அவருடைய பகைவர்கள்
  rationale: பொதுவாக பகைவர்களைக் குறிக்கும் சொல்லை நேரடியாக மொழிபெயர்க்கிறது; முந்தைய அடியின் צָרָיו என்பதிலிருந்து உள்ள அண்மைப் பொருளுடைய சொல் வேறுபாட்டையும் தக்கவைக்கிறது.
theological_decisions:
- issue: மூன்றாம் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுகளின் குறிப்பு
  choice: ‘அவருடைய’ என்று மொழிபெயர்த்து, சங்கீதத்தின் உடனடிச் சூழலில் தாவீதிய அரசன் அல்லது அபிஷேகம் பெற்றவரைக் குறிக்கும்படி இலக்கணக் குறிப்பைத் தக்கவைத்தல்.
  alternative: குறிப்பிட்ட நபரை வெளிப்படுத்தாமல் இன்னும் பொதுவாக மொழிபெயர்த்தல்.
  rationale: இரு அடிகளிலும் உள்ள பின்னொட்டுகள் மூன்றாம் ஆண்பால் ஒருமையாகும். சங்கீதம் 89-ன் சூழல் தாவீதின் அபிஷேகம் பெற்ற அரசனைச் சார்ந்த வாக்குறுதிகள் தலைகீழானதுபோல் தோன்றுவதைப் புலம்புகிறது. ‘அவருடைய’ என்பது இந்த இலக்கணத் தொடர்பைத் தக்கவைக்கிறது; மேலதிக இறையியல் அடையாளத்தைத் திணிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய இரண்டாம் நபர் ஒருமைக்கு மரியாதை வினைமுற்றான ‘நீர் ... செய்தீர்’ பயன்படுத்தப்பட்டுள்ளது. ‘வலக்கை’ என்ற எபிரெய உருவகம் விளக்கிப் பதிலிடப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
