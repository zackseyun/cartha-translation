  text: I will establish your offspring forever[a], and build your throne for generation after generation[b]. Selah
translation:
  language: ta
  text: உன் சந்ததியை என்றென்றும் நிலைநிறுத்துவேன்[a]; தலைமுறை தலைமுறையாக உன் அரியணையைக் கட்டியெழுப்புவேன்[b]. சேலா
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன் விதையை’; எபிரெய மொழியிலுள்ள ஒருமைச் சொல் வழித்தோன்றல்களை ஒட்டுமொத்தமாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சேலா’ என்பது இசை அல்லது வழிபாட்டு நிகழ்வைக் குறிக்கும் குறிப்பாக இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவில்லாத காலத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது; உடன்படிக்கைச் சூழலின் தொடர்ச்சியையும் காக்கிறது.
- source_word: אָכִין
  choice: நிலைநிறுத்துவேன்
  rationale: כון என்பதன் ஹிபில் வடிவிலுள்ள ‘உறுதியாக நிறுவுதல்’ என்ற பொருளை அரச உடன்படிக்கைச் சூழலில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: זַרְעֶךָ
  choice: உன் சந்ததியை
  rationale: எபிரெயச் சொல்லின் ஒருமை வடிவமும் கூட்டுப்பொருளும் தமிழின் ‘சந்ததி’ என்பதில் இயல்பாகப் பாதுகாக்கப்படுகின்றன.
- source_word: וּבָנִיתִי
  choice: கட்டியெழுப்புவேன்
  rationale: முந்தைய எதிர்கால வினையுடன் இணைந்து எதிர்காலப் பொருள் தருகிறது; அரியணையைப் பற்றிய கட்டிட உருவகத்தையும் தக்கவைக்கிறது.
- source_word: לְדֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: அடுத்தடுத்த தலைமுறைகள் முழுவதும் நீடிப்பதை இயல்பாகவும் கவித்துவமாகவும் தெரிவிக்கிறது.
- source_word: כִּסְאֲךָ
  choice: உன் அரியணையை
  rationale: அரசாட்சிச் சூழலில் உடல் இருக்கையை மட்டும் அல்லாமல் வம்ச அரசுரிமையையும் குறிக்கும் வழக்கமான தமிழ் சொல்.
- source_word: סֶלָה
  choice: சேலா
  rationale: சொல்லின் துல்லியமான பொருள் உறுதியற்றதால் விளக்கமாக மொழிபெயர்க்காமல் ஒலிபெயர்ப்பது வெளிப்படையானதும் குறைந்த தலையீடுடையதுமாகும்.
theological_decisions:
- issue: அரச உடன்படிக்கைச் சூழலிலுள்ள வம்ச வாக்குறுதி
  choice: தாவீதிய அரசனை நோக்கிய நேரடி உரையையும் ‘சந்ததி’, ‘அரியணை’ என்ற வம்ச மொழியையும் அப்படியே வைத்தல்
  alternative: மேசியா நிறைவேற்றத்தை வசனத்திலேயே வெளிப்படையாக்குதல் அல்லது இதை பொதுவான வழித்தோன்றல் வாக்குறுதியாக மாற்றுதல்
  rationale: எபிரெய உரை அரச வம்ச வாக்குறுதியை நேரடியாகக் கூறுகிறது. பிற்காலத் தத்துவ முடிவுகளை மொழிபெயர்ப்புக்குள் சேர்க்காமல் அதன் விரிந்த வேதாகம முக்கியத்துவம் மறைமுகமாகத் திறந்திருக்கச் செய்யப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சந்ததி’ உடன்படிக்கை மற்றும் வம்சப் பொருளைத் தக்கவைக்கிறது; ‘கட்டியெழுப்புவேன்’ அரியணையைச் சார்ந்த எபிரெயக் கட்டிட உருவகத்தைப் பாதுகாக்கிறது.
