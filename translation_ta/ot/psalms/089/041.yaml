source:
  edition: WLC
  text: שַׁ֭סֻּ/הוּ כָּל עֹ֣בְרֵי דָ֑רֶךְ הָיָ֥ה חֶ֝רְפָּ֗ה לִ/שְׁכֵנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/041.yaml
  text: All who pass by the way have plundered him[a]; he has become a reproach to his neighbors.
translation:
  language: ta
  text: வழியே கடந்து செல்கிற அனைவரும் அவனைக் கொள்ளையடித்தார்கள்[a]; அவன் தன் அண்டையவர்களுக்கு இகழ்ச்சிப் பொருளானான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வழியே கடந்து செல்கிற அனைவரும் அவனைச் சூறையாடினார்கள்.’ எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல், ‘வழியின் வழியே செல்கிற அனைவரும்’ என உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁסֻּהוּ
  choice: அவனைக் கொள்ளையிட்டார்கள்
  rationale: שסה என்னும் வினை கொள்ளையிடுதல் அல்லது சூறையாடுதலைக் குறிக்கிறது. நவீனத் தமிழில் பகைமையுடன் பொருளைப் பறித்துச் சென்றதன் konkreete force-ஐ ‘கொள்ளையிட்டார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: அனைவரும்
  rationale: பின்வரும் பங்கேற்பு சொற்றொடருடன் כָּל முழுமையான, கூட்டுப்பொருளைக் கொண்டுள்ளது; ‘அனைவரும்’ அந்த விரிவைத் தெளிவாகக் காக்கிறது.
- source_word: עֹבְרֵי דָרֶךְ
  choice: வழியில் செல்கிற
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘வழி/சாலையில் செல்கிறவர்கள்’ என்று பொருள்படும். ‘வழியில் செல்கிற அனைவரும்’ என்பது அதன் உருவகத்தையும் இயல்பான தமிழ் நடையையும் காக்கிறது.
- source_word: הָיָה
  choice: ஆனான்
  rationale: இறந்தகாலச் செயல் ஏற்படுத்திய நிலையைச் சூழல் காட்டுகிறது. ‘இகழ்ச்சிப் பொருளானான்’ என்பது அந்த நிலைமாற்றத்தையும் விளைவுநிலையையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: חֶרְפָּה
  choice: இகழ்ச்சிப் பொருள்
  rationale: חֶרְפָּה என்பது நிந்தை, அவமானம், இகழ்ச்சி ஆகிய பொருள்களைக் கொண்டது. ஒருவன் பிறரின் இகழ்ச்சிக்கு இலக்கான நிலையை ‘இகழ்ச்சிப் பொருள்’ தெளிவாகவும் கண்ணியமான நடையிலும் கூறுகிறது.
- source_word: לשכניו
  choice: தன் அண்டை வீட்டாருக்கு
  rationale: שָׁכֵן அருகில் வசிப்பவர் அல்லது அண்டை வீட்டார் என்பதைக் குறிக்கிறது; ל உறவுநிலையைச் சுட்டுகிறது. ‘தன் அண்டை வீட்டாருக்கு’ என்பது உடைமைத் தொடர்பையும் சமூக அவமானத்தையும் நேரடியாகக் காட்டுகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஒருமைச் சுட்டுப்பெயரின் குறிப்பு
  choice: குறிப்பிடப்படுகிறவர் யார் என்பதை விளக்கிச் சேர்க்காமல் ‘அவன்’ என்றே மொழிபெயர்த்தல்
  alternative: தாவீதிய அரசன், அபிஷேகம் செய்யப்பட்டவர், அல்லது அரசனால் பிரதிநிதித்துவப்படுத்தப்படும் மக்கள் என்று வெளிப்படையாகக் குறிப்பிடுதல்
  rationale: உடனடிச் சூழல் தாவீதிய அரசன் அல்லது அபிஷேகம் செய்யப்பட்டவரின் வீழ்ச்சியைப் பற்றினாலும், இவ்வசனம் ஒருமைச் சுட்டுப்பெயரை மட்டுமே பயன்படுத்துகிறது. மூலத்தின் தெளிவின்மையையும் இறையியல் பதற்றத்தையும் காக்க ‘அவன்’ என்றே விடப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இகழ்ச்சிப் பொருள்’ உடன்படிக்கைப் புலம்பலின் அவமான உணர்வைக் காக்கிறது; சுட்டுப்பெயரின் குறிப்பு விளக்கிச் சேர்க்கப்படவில்லை.
