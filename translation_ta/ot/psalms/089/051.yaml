translation:
  language: ta
  text: யாவே, உமது பகைவர்கள் நிந்தித்ததையும்—உமது அபிஷேகம் பெற்றவரின் அடிச்சுவடுகளை அவர்கள் நிந்தித்ததையும்—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵרְפוּ
  choice: நிந்தித்தார்கள் / நிந்தித்ததை
  rationale: חרף என்பது அவமதிப்புடன் பழித்தல் அல்லது ஏளனம் செய்தல் என்பதைக் குறிக்கிறது. இங்கு ‘நிந்தித்ததை’ என்பது அதன் கடுமையான பழிப்புணர்வையும், முந்தைய வசனத்தோடு தொடரும் எபிரெய உறவுத்தொடர் அமைப்பையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אוֹיְבֶיךָ
  choice: உமது பகைவர்கள்
  rationale: இரண்டாம் நபர் ஒருமை ஆண்பால் பின்னொட்டுடன் வந்துள்ள சொல்லின் நேரான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: יְהוָה
  choice: யெகோவாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயர். அழைப்புவேற்றுமையைத் தெரிவிக்க ‘-வே’ சேர்க்கப்பட்டுள்ளது.
- source_word: אֲשֶׁר
  choice: நிந்தித்ததை
  rationale: இங்கு אֲשֶׁר முந்தைய வசனத்திலுள்ள ‘நிந்தனை’ என்ற கருத்தோடு இவ்வசனத்தை இணைக்கிறது. சொல்லுக்குச் சொல் உறவுப்பெயரைப் பயன்படுத்துவதற்குப் பதிலாக, தமிழில் இயல்பாக அந்தத் தொடர்பை வினைப்பெயர் வடிவம் வெளிப்படுத்துகிறது.
- source_word: עִקְּבוֹת
  choice: காலடிகளை
  rationale: עקב என்பதன் பன்மை வடிவம் ‘குதிகால்கள், காலடிகள், அடிச்சுவடுகள்’ என்ற பொருட்களைத் தரலாம். ‘காலடிகள்’ என்ற சொல் மூலத்தின் திடமான உருவகத்தையும், ஒருவரின் நகர்வு அல்லது வருகையைக் குறிக்கக்கூடிய தெளிவின்மையையும் காக்கிறது.
- source_word: מְשִׁיחֶךָ
  choice: உம்மால் அபிஷேகம் செய்யப்பட்டவர்
  rationale: உடனடி அரசசங்கீதச் சூழலில் இது யெகோவாவால் அபிஷேகம் செய்யப்பட்ட தாவீதிய அரசரைக் குறிக்கிறது. ‘மேசியா’ என்ற பட்டத்தை நேரடியாக முதன்மை உரைக்குள் கொண்டுவராமல், எபிரெயச் சொல்லின் அடிப்படைப் பொருளையும் அதன் மேசியாவுக்குரிய எதிரொலியையும் காக்கிறது.
theological_decisions:
- issue: அரசசங்கீதத்தில் மְשִׁיחֶךָ என்பதன் மொழிபெயர்ப்பு
  choice: உம்மால் அபிஷேகம் செய்யப்பட்டவர்
  alternative: உமது மேசியா
  rationale: உடனடி இலக்கியச் சூழல் யெகோவாவால் அபிஷேகம் செய்யப்பட்ட தாவீதிய அரசரை முன்னிறுத்துகிறது. அதே நேரத்தில், இச்சொல் மேசியாவைக் குறிக்கும் சொல்லாகவும் இருப்பதால் அந்த எதிரொலி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; முதன்மை உரை அதை ஒரே விளக்கமாகத் தீர்மானிப்பதில்லை.
- issue: இவ்வசனத்தின் முழுமையற்ற வாக்கிய அமைப்பு
  choice: முந்தைய வசனத்தைச் சார்ந்த வினைப்பெயர் தொடர்களாக வைத்தல்
  alternative: தனித்து நிற்கும் முழு வாக்கியமாக மாற்றுதல்
  rationale: இரண்டு אֲשֶׁר தொடர்களும் முந்தைய வசனத்திலுள்ள ‘நினைவுகூரும்’ வேண்டுதலையும் ‘நிந்தனை’ என்ற கருத்தையும் சார்ந்துள்ளன. ஆகவே மூலத்தின் கவிதைத் தொடர்ச்சியையும் மீளுரையையும் காக்க, செயற்கையாக புதிய முதன்மை வினை சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் சங்கீதத்துக்குரிய கவித்துவமும் காக்கப்பட்டுள்ளன. ‘உமது,’ ‘யெகோவாவே’ போன்ற வடிவங்கள் கண்ணியமான வழிபாட்டு நடையை வழங்குகின்றன. எபிரெய மூலத்தின் இரட்டை ‘நிந்தித்த’ அமைப்பும், முந்தைய வசனத்தைச் சார்ந்துள்ள நிறைவுறாத தொடரும் நோக்கத்துடன் பாதுகாக்கப்பட்டுள்ளன.
