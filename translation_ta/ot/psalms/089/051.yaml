- from: யெகோவாவே, உமது பகைவர்கள் நிந்தித்ததை—உம்மால் அபிஷேகம் செய்யப்பட்டவரின்[a] காலடிகளை[b] அவர்கள் நிந்தித்ததை—
  to: யாவே, உமது பகைவர்கள் நிந்தித்ததையும்—உமது அபிஷேகம் பெற்றவரின் அடிச்சுவடுகளை அவர்கள் நிந்தித்ததையும்—
