source:
  edition: WLC
  text: וּ/פָקַדְתִּ֣י בְ/שֵׁ֣בֶט פִּשְׁעָ֑/ם וּ/בִ/נְגָעִ֥ים עֲוֺנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/032.yaml
  text: Then I will punish their transgression with the rod[a], and their iniquity with blows.
translation:
  language: ta
  text: 'அப்போது அவர்களுடைய மீறுதலைக் கோலால் தண்டிப்பேன்[a];

    அவர்களுடைய அக்கிரமத்தை அடிகளால் தண்டிப்பேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தண்டிப்பேன்’ என்பதற்கான எபிரெய வினைச்சொல், கவனித்து விசாரிப்பதையும் அதன்படி தண்டிப்பதையும் குறிக்கலாம். ‘அடிகள்’ என்பதை ‘வாதைகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: அப்போது ... தண்டிப்பேன்
  rationale: פקד என்பதற்கு ‘விசாரித்தல், கவனித்தல், தண்டித்தல்’ என்ற பொருள் வரம்பு உண்டு. கோலும் அடிகளும் குறிப்பிடப்படும் இந்த ஒழுக்கத் தண்டனையின் சூழலில் ‘தண்டிப்பேன்’ என்பது முதன்மைப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது. முந்தைய வசனத்தின் நிபந்தனைத் தொடரை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: בְשֵׁבֶט
  choice: கோலால்
  rationale: שׁבט என்பது கோல், தடி, செங்கோல் ஆகியவற்றைக் குறிக்கலாம். இங்கு அரசாட்சியின் அடையாளமாக அல்ல, ஒழுக்கத் தண்டனையின் கருவியாக வருவதால் ‘கோல்’ பொருத்தமானது.
- source_word: פִּשְׁעָם
  choice: அவர்களுடைய மீறுதலை
  rationale: פשׁע என்பது மீறுதல் அல்லது கலகம் எனப் பொருள்படும். இணைவரியில் வரும் ‘அக்கிரமம்’ என்பதோடு கவித்துவ இணைப்பைக் காத்து, அரசியல் கலகம் என்ற பொருளைத் தேவையின்றி வரையறுக்காமல் இருக்க ‘மீறுதல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּבִנְגָעִים
  choice: அடிகளால்
  rationale: נגע என்பது அடி, தாக்குதல், வாதை அல்லது கொள்ளைநோய் எனப் பொருள்படலாம். ‘கோல்’ என்பதற்கு இணையாகவும் ஒழுக்கத் தண்டனையின் சூழலிலும் ‘அடிகள்’ தெளிவான இயல்பான தெரிவாகும்; நோயை மட்டுமே குறிக்கும் வகையில் பொருளைச் சுருக்குவதில்லை.
- source_word: עֲוֺנָם
  choice: அவர்களுடைய அக்கிரமத்தை
  rationale: עון என்பது அக்கிரமம், குற்றப்பழி அல்லது குற்றத்தின் விளைவு ஆகியவற்றைக் குறிக்கலாம். ‘அக்கிரமம்’ ஒழுக்கப் பொருளின் கனத்தையும் ‘மீறுதல்’ என்பதுடனான இணை அமைப்பையும் காக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை மக்களின் பாவத்துக்கு இறைவன் அளிக்கும் பதிலின் தன்மை
  choice: உண்மையான ஒழுக்கத் தண்டனையைத் தெளிவாகக் காட்டும் மொழி பயன்படுத்தப்பட்டது.
  alternative: இதை வெறும் ‘திருத்துதல்’ அல்லது நடுநிலையான ‘விசாரித்தல்’ என்று மென்மைப்படுத்தலாம்.
  rationale: உடனடிச் சூழலில் ‘கோல்’, ‘அடிகள்’ என்ற உறுதியான தண்டனைப் படிமங்கள் உள்ளன. ஆகவே தண்டனையின் தீவிரம் மங்கச் செய்யப்படவில்லை; அதேவேளையில் இறுதி நிராகரிப்பு குறித்த எந்தக் கூடுதல் கோட்பாட்டு முடிவும் இந்த வசனத்தில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைவரி அமைப்பைத் தெளிவாக்க வினைச்சொல் இரு வரிகளிலும் மீண்டும் கூறப்பட்டுள்ளது; தண்டனையின் கோல்/அடி படிமம் காக்கப்பட்டுள்ளது.
