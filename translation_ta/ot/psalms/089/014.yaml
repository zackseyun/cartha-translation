revisions:
- from: நீதியும் நியாயமும் உமது அரியணையின் அடித்தளம்; மாறாத அன்பும் உண்மைத்தன்மையும் உமது திருமுகத்துக்கு முன்பாகச் செல்கின்றன.[a]
  to: நீதியும் நியாயமும் உமது அரியணையின் அடித்தளம்; மாறாத அன்பும் விசுவாசத்தன்மையும் உமது முன்னிலையில் செல்கின்றன.[a]
  rationale: The revision renders the Hebrew idiom פָנֶיךָ naturally as 'உமது முன்னிலையில்' in the main text, while preserving the literal 'face' imagery in the footnote. It also changes 'உண்மைத்தன்மை' to 'விசுவாசத்தன்மை' to convey the relational reliability of אֱמֶת in the חֶסֶד וֶאֱמֶת pairing. The verse's poetic parallelism, royal register, and lexical distinctions are retained.
