  text: Righteousness and justice are the foundation of your throne[a]; steadfast love and faithfulness go before you.
translation:
  language: ta
  text: நீதியும் நியாயமும் உமது அரியணையின் அடித்தளம்; மாறாத அன்பும் விசுவாசத்தன்மையும் உமது முன்னிலையில் செல்கின்றன.[a]
