    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק
  choice: நீதி
  rationale: מִשְׁפָּט என்பதிலிருந்து வேறுபடுத்தி, ஒழுக்க நேர்மையையும் சரியான ஒழுங்கையும் குறிக்கும் சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִשְׁפָּט
  choice: நியாயம்
  rationale: இறைவனுடைய ஆட்சியின் நீதித்தீர்ப்பு சார்ந்த பரிமாணத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; צֶדֶק உடனான இணைச்சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: מְכוֹן
  choice: அடித்தளம்
  rationale: நிலையான இடம் அல்லது தாங்கும் அடிப்படை என்ற பொருளை அரியணை உருவகத்தில் தெளிவாகத் தருகிறது.
- source_word: כִּסְאֶךָ
  choice: உமது அரியணை
  rationale: அரசாட்சியைக் குறிக்கும் எபிரெய உருவகத்தையும் இரண்டாம் நபர் ஒருமை உடைமைச் சுட்டையும் காக்கிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: நிலைத்த, விசுவாசமுள்ள உறவுசார் அன்பை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெறும் இரக்கம் என்ற பொருளுக்குள் சுருக்கவில்லை.
- source_word: אֱמֶת
  choice: உண்மைத்தன்மை
  rationale: חֶסֶד உடன் வரும் இவ்விணையில் உண்மை, நம்பகத்தன்மை, விசுவாசத்தன்மை ஆகிய நுண்ணுணர்வுகளை உள்ளடக்குகிறது.
- source_word: יְקַדְּמוּ
  choice: முன்பாகச் செல்கின்றன
  rationale: முன்னே செல்லுதல் அல்லது முன்னிலையில் வருதல் என்ற கவித்துவ இயக்கத்தைத் தமிழில் காக்கிறது.
- source_word: פָנֶיךָ
  choice: உமது திருமுகம்
  rationale: நேரடியான ‘உமது முகம்’ என்ற எபிரெய உருவகத்தை மரியாதையான, கவித்துவமான தமிழில் காக்கிறது; ‘உமது முன்னிலை’ என்ற இடியோமப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת என்ற இணைச்சொல்லின் மொழிபெயர்ப்பு
  choice: மாறாத அன்பும் உண்மைத்தன்மையும்
  alternative: இரக்கமும் உண்மையும்
  rationale: உறவுசார் நிலைத்த அன்பையும் நம்பகமான உண்மையையும் ஒருங்கே வெளிப்படுத்தி, இணைச்சொல்லின் செறிவை வெறும் அரூபப் பண்புகளாகத் தட்டையாக்காமல் காக்கிறது.
- issue: פָנֶיךָ என்பதை இடியோமமாகவா நேரடியான உருவகத்தோடா மொழிபெயர்ப்பது
  choice: உமது திருமுகத்துக்கு முன்பாக
  alternative: உமது முன்னிலையில்
  rationale: தெய்வீக அண்மையைச் சித்தரிக்கும் மூலமொழியின் முக உருவகத்தை முதன்மை உரையில் காக்கிறது; இயல்பான இடியோமப் பொருளை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கவித்துவமான கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘உமது,’ ‘அரியணை,’ ‘திருமுகம்’ ஆகியவை சங்கீதத்தின் அரச மற்றும் வழிபாட்டு நடைக்கு ஏற்ற மரியாதைச் சொற்கள்; அரிதான அல்லது சமயப்பிரிவு சார்ந்த கலைச்சொற்கள் தவிர்க்கப்பட்டன.
