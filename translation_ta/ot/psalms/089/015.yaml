base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/015.yaml
  text: Blessed are the people who know the joyful shout[a]; O Yahweh[b], they walk in the light of your face.
translation:
  language: ta
  text: 'மகிழ்ச்சி ஆரவாரத்தை அறிந்த மக்கள் பேறுபெற்றவர்கள்![a]


    யாவே, அவர்கள் உமது முகத்தின்[b] ஒளியில் நடப்பார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விழாக்கால ஆரவாரம்’; இது வழிபாட்டில் எழுப்பப்படும் எக்காள முழக்கத்தையும் உள்ளடக்கியிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘உமது முகம்’; இது உமது பிரசன்னத்தையோ தயவையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவர்கள்
  rationale: எபிரெய மொழியின் பன்மை வியப்புக்கூற்றை இயல்பான, உயர்வான தமிழில் வெளிப்படுத்துகிறது; வெறும் மனமகிழ்ச்சியைவிட இறைவனுடைய நல்வாழ்வைப் பெற்ற நிலையைக் குறிக்கிறது.
- source_word: הָעָם
  choice: மக்கள்
  rationale: அரசியல் சார்ந்த ‘நாடு’ என்பதைக் காட்டிலும், ஒரே சமூகமாகிய மக்களைக் குறிக்கும் சூழலுக்கு இது பொருத்தமானது.
- source_word: יוֹדְעֵי
  choice: அறிந்த
  rationale: இந்த ஆரவாரத்தை அறிந்து அதில் பங்குகொள்வதால் அடையாளப்படுத்தப்படும் மக்களைக் குறிக்கும் எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான தன்மையைச் சுருக்கமாகக் காக்கிறது.
- source_word: תְרוּעָה
  choice: மகிழ்ச்சி ஆரவாரம்
  rationale: வழிபாட்டு அல்லது விழாக்கால மகிழ்ச்சிக் கூக்குரலைக் காட்டுகிறது; சொல்லை எக்காள ஒலிக்கு மட்டும் வரையறுக்காமல் அதன் பரந்த பொருளைக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்புப் பெயரால் மாற்றாமல், எபிரெய வேதத்தில் உள்ள இறைவனின் தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: בְּאוֹר
  choice: ஒளியில்
  rationale: ஒளியை ஒரு கருவியாக மட்டுமல்லாமல், அவர்கள் நடக்கும் சூழலாக அல்லது நிலையாகக் காட்டும் בְּ முன்னிடைச்சொல்லின் பொருளைக் காக்கிறது.
- source_word: פָּנֶיךָ
  choice: உமது முகத்தின்
  rationale: ‘உமது பிரசன்னம்’ அல்லது ‘உமது தயவு’ என்று ஒரே விளக்கத்தில் சுருக்காமல், மூலத்தின் முகம் என்ற உறவுசார் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יְהַלֵּכוּן
  choice: நடப்பார்கள்
  rationale: தொடர்ந்து வாழ்வதையும் நடந்துகொள்வதையும் குறிக்கும் வேதாகம உருவகத்தை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: நேரடி அழைப்பாக ‘யாவே’
  alternative: ‘ஆண்டவர்’
  rationale: மூலத்தில் இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது உடன்படிக்கைப் பெயரைப் பாதுகாக்கிறது.
- issue: פָּנֶיךָ என்பதை சொல்லுருவத்தோடு மொழிபெயர்ப்பதா அல்லது பொருள்விளக்கமாக மொழிபெயர்ப்பதா
  choice: ‘உமது முகத்தின்’
  alternative: ‘உமது பிரசன்னத்தின்’ அல்லது ‘உமது தயவின்’
  rationale: முகம் என்ற எபிரெய உருவகம் பிரசன்னத்தையும் தயவையும் உணர்த்தலாம். எந்த ஒரு விளக்கத்தையும் மட்டும் பிரதான உரையில் நிர்ணயிக்காமல், உருவகத்தையும் அதன் இறையியல் செறிவையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்குரிய கண்ணியத்தையும் எளிய வாசிப்புத்தன்மையையும் இணைக்கும் நடை. ‘உமது’ என்ற மரியாதை ஒருமை இறைவனை நோக்கிய நேரடி அழைப்புக்கு ஏற்றதாகப் பயன்படுத்தப்பட்டுள்ளது; எபிரெய உருவகங்களான ‘முகத்தின் ஒளி’ மற்றும் ‘நடத்தல்’ பாதுகாக்கப்பட்டுள்ளன.
