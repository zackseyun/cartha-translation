  text: אַיֵּ֤ה חֲסָדֶ֖י/ךָ הָ/רִאשֹׁנִ֥ים אֲדֹנָ֑/י נִשְׁבַּ֥עְתָּ לְ֝/דָוִ֗ד בֶּ/אֱמוּנָתֶֽ/ךָ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/049.yaml
  text: Where are your former acts of steadfast love[a], Lord[b], which you swore to David in your faithfulness?
translation:
  language: ta
  text: ஆண்டவரே, உமது உண்மைத்தன்மையோடு[b] தாவீதுக்கு நீர் சத்தியம் செய்து உறுதியளித்த உமது முந்தைய மாறாத அன்பின் செயல்கள்[a] எங்கே?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது முந்தைய இரக்கங்கள்’ அல்லது ‘உமது முந்தைய பற்றுறுதியான அன்பின் செயல்கள்.’ எபிரெயத்தில் இச்சொல் பன்மையில் உள்ளது; சொல்லுக்குச் சொல், ‘உமது முந்தைய மாறாத அன்புகள்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமது உண்மைத்தன்மையால்.’ இச்சொற்றொடர் சத்தியம் செய்த விதத்தையோ அதன் அடிப்படையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: எங்கே?
  rationale: இது இடம் அல்லது இருப்பைக் குறித்து வினவும் சொல். பன்மையான ‘செயல்கள்’ என்பதுடன் இயல்பாகப் பொருந்துகிறது.
- source_word: חֲסָדֶיךָ
  choice: உமது மாறாத அன்பின் செயல்கள்
  rationale: חֶסֶד என்பது உறவிலும் உடன்படிக்கையிலும் நிலைத்திருக்கும் அன்பு, இரக்கம், பற்றுறுதி ஆகிய கருத்துகளைத் தாங்குகிறது. மூலத்தில் பன்மை இருப்பதால், தமிழில் இயல்பாகவும் தெளிவாகவும் இருக்க ‘செயல்கள்’ சேர்க்கப்பட்டது.
- source_word: הָרִאשֹׁנִים
  choice: முந்தைய
  rationale: கடந்த காலத்தில் வெளிப்பட்ட அன்பின் செயல்களையும் தற்போதைய துயரையும் இச்சூழல் வேறுபடுத்துவதால் ‘முந்தைய’ என்பது பொருத்தமானது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: கடவுளை நேரடியாக விளிக்கும் தெய்வீகப் பட்டத்தை இயல்பான தமிழ் விளிப்பாக அளிக்கிறது.
- source_word: נִשְׁבַּעְתָּ
  choice: நீர் ஆணையிட்டு வாக்களித்த
  rationale: வெறும் வாக்குறுதி அல்ல, உறுதிப்படுத்தப்பட்ட சத்தியம் என்ற எபிரெய வினையின் வலிமையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்கு
  rationale: ஆணைமொழி யாருக்கு அளிக்கப்பட்டது என்பதைக் குறிக்கும் மறைமுகச் செயப்படுபொருளை நேரடியாகக் காட்டுகிறது.
- source_word: בֶּאֱמוּנָתֶךָ
  choice: உமது உண்மைத்தன்மையோடு
  rationale: אֱמוּנָה என்பதன் உறுதி, நம்பகத்தன்மை, உண்மைத்தன்மை ஆகிய நுணுக்கங்களைத் தக்கவைக்கிறது; בְּ குறிக்கும் முறை அல்லது அடிப்படை முழுமையாகத் தீர்மானிக்கப்படாமல் விடப்படுகிறது.
theological_decisions:
- issue: உடன்படிக்கைப் புலம்பல் சூழலில் חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: மாறாத அன்பு
  alternative: இரக்கம் / பேரன்பு / பற்றுறுதியான அன்பு
  rationale: சங்கீதம் தாவீதுக்குக் கொடுக்கப்பட்ட தெய்வீக உறுதியை முன்வைப்பதால், உணர்ச்சி மட்டுமல்லாமல் நீடித்த உறவுப் பற்றையும் ‘மாறாத அன்பு’ எடுத்துரைக்கிறது.
- issue: חֲסָדֶיךָ என்ற எபிரெயப் பன்மையை வெளிப்படுத்துதல்
  choice: மாறாத அன்பின் செயல்கள்
  alternative: மாறாத அன்புகள் / இரக்கங்கள்
  rationale: ‘அன்புகள்’ என்பது நவீன தமிழில் இங்கு இயல்பாக இல்லை. ‘செயல்கள்’ என்பது கடவுளின் அன்பு பல உறுதியான வெளிப்பாடுகளாகக் காணப்படுவதைப் பன்மையுடன் காக்கிறது.
- issue: בֶּאֱמוּנָתֶךָ என்பதில் בְּ-இன் தொடர்பு
  choice: உமது உண்மைத்தன்மையோடு
  alternative: உமது உண்மைத்தன்மையால்
  rationale: இச்சொற்றொடர் ஆணையின் முறை அல்லது அதன் அடிப்படையைக் குறிக்கலாம். ‘-ஓடு’ முறை சார்ந்த வாசிப்பை முதன்மைப்படுத்தினாலும், காரணம் அல்லது கருவி என்று மிகையாக வரையறுக்கவில்லை; மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை விளிக்கும் இடத்தில் ‘ஆண்டவரே’ என்றும் மரியாதை ஒருமை வினைவடிவமாக ‘நீர்’ என்றும் வழங்கப்பட்டுள்ளது. மூலத்தின் பன்மையும் בְּ முன்னிடைச்சொல்லின் நுணுக்கத் தெளிவின்மையும் அடிக்குறிப்புகளோடு பாதுகாக்கப்பட்டுள்ளன.
