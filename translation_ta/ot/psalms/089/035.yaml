  text: Once I have sworn by my holiness[b][a]; I will not lie to David.
translation:
  language: ta
  text: 'என் பரிசுத்தத்தின்பேரில் ஒருமுறை சத்தியம் செய்தேன்[b]: தாவீதிடம் நான் பொய் சொல்லமாட்டேன்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொற்சொல்லாக, “தாவீதிடம் நான் பொய் சொன்னால்…” இது “தாவீதிடம் நான் பொய் சொல்லமாட்டேன்” அல்லது “தாவீதிடம் நான் உண்மையற்றவனாக இருக்கமாட்டேன்” என்று பொருள்படும் ஓர் ஆணைச் சூத்திரம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் பரிசுத்தத்தின்பேரில் ஒரே முறை சத்தியம் செய்தேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: ஒருமுறை
  rationale: இங்கு எபிரெயச் சொல் எண்ணிக்கையைக் குறிப்பிடும் ‘ஒன்று’ என்பதற்குப் பதிலாக, ஆணை ஒருமுறை செய்யப்பட்ட தீர்மானமான செயல் என்பதைக் குறிக்கும் வினையடையாக வருகிறது. ‘ஒருமுறை’ இயல்பான தமிழாகவும் மூலத்தின் சுருக்கத்தைக் காக்கும் வகையிலும் உள்ளது.
- source_word: נִשְׁבַּעְתִּי
  choice: ஆணையிட்டேன்
  rationale: שׁבע என்பதன் நிஃபால் வடிவம் ‘ஆணையிடுதல்’ என்று பொருள்படும். முடிந்த காலம் மூல எபிரெய வினையின் நிறைவு பெற்ற செயலையும் சூழலில் அதன் தொடர்ந்த கட்டுப்பாட்டையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְקָדְשִׁי
  choice: என் பரிசுத்தத்தின்மேல்
  rationale: בְּ இங்கு ஆணையின் உறுதிப்பாட்டிற்காக அழைக்கப்படும் அடிப்படையைக் குறிக்கிறது; קָדְשִׁי என்பது ‘என் பரிசுத்தம்.’ ‘என் பரிசுத்தத்தின்மேல்’ என்பது தமிழில் ஆணை மொழிக்கு ஏற்றதாக இருந்து, இறைவன் தமது பரிசுத்தத்தையே சான்றாக வைப்பதை வெளிப்படுத்துகிறது.
- source_word: אִם
  choice: நான் … மாட்டேன்
  rationale: ஆணைக்குப் பின் வரும் אִם சொற்சொல்லாக ‘என்றால்’ என இருந்தாலும், இது நிறைவு கூறப்படாத எதிர்மறை ஆணைச் சூத்திரம். அதன் பொருளைத் தமிழில் தெளிவாகச் சொல்ல ‘மாட்டேன்’ என்ற மறுப்பு பயன்படுத்தப்பட்டுள்ளது; சொற்சொல் அமைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְדָוִד
  choice: தாவீதிடம்
  rationale: לְ பொய்யுரையின் நோக்குநபரைக் குறிக்கிறது. தனிப்பட்ட ஒருவரிடம் பொய் கூறுவது என்ற தமிழ்ப் பயன்பாட்டில் ‘தாவீதிடம்’ இயல்பாக உள்ளது.
- source_word: אֲכַזֵּב
  choice: பொய் சொல்லமாட்டேன்
  rationale: כזב என்பதன் பியேல் வடிவம் இங்கு பொய் கூறுதல் அல்லது கொடுத்த வாக்கில் பொய்யாதல் என்ற பொருளைக் கொண்டுள்ளது. ‘பொய் சொல்லமாட்டேன்’ நேரடியானதும் தனிப்பட்ட நோக்குநபருடன் இயல்பானதும் ஆகும்; ‘பொய்யாக மாட்டேன்’ அல்லது ‘தவறமாட்டேன்’ என்பவை சாத்தியமானாலும் குறைவாக இயல்பானவை.
theological_decisions:
- issue: இறைவனின் ஆணைச் சூத்திரத்தை எபிரெயில் உள்ளதைவிட விரிவுபடுத்தாமல் மொழிபெயர்த்தல்
  choice: 'என் பரிசுத்தத்தின்மேல் ஒருமுறை ஆணையிட்டேன்: தாவீதிடம் நான் பொய் சொல்லமாட்டேன்.'
  alternative: 'என் பரிசுத்தத்தின்மேல் ஒருமுறை ஆணையிட்டேன்: தாவீதிடம் நான் பொய் சொன்னால்…'
  rationale: மூலத்தில் אִם கொண்டு தொடங்கும் நிபந்தனை வடிவம் முழுமையற்ற எதிர்மறை ஆணைச் சூத்திரமாக உள்ளது; அதன் உட்பொருள் ‘நிச்சயமாக நான் பொய் சொல்லமாட்டேன்.’ தமிழில் மறுப்பை வெளிப்படையாகக் கூறுவது பொருளைத் தெளிவாக்குகிறது; அதேவேளை மூலத்தின் தனித்துவமான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. ‘என் பரிசுத்தத்தின்மேல்’ என்பது இறைவனின் சொந்த பரிசுத்த இயல்பை ஆணையின் உறுதியாக வைத்திருக்கும் இறையியல் அழுத்தத்தைக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆணையிட்டேன்,’ ‘பரிசுத்தம்’ ஆகியவை சங்கீதத்தின் உயர்ந்த மொழிநடையைத் தக்கவைக்கின்றன; செயற்கையான பழந்தமிழ் தவிர்க்கப்பட்டுள்ளது. அடிக்குறி [b] ‘ஒருமுறை’ என்பதற்குப் பின்னும், [a] வெளிப்படுத்தப்பட்ட எதிர்மறை ஆணை வாக்கியத்தின் பின்னும் வைக்கப்பட்டுள்ளது.
