lexical_decisions:
- source_word: זַרְעוֹ
  choice: அவனுடைய சந்ததி
  rationale: זֶרַע என்பது சொல்லடியாக ‘விதை’ எனவும், உருவகமாக ஒருவரின் வழித்தோன்றல் அல்லது சந்ததி எனவும் பொருள்படும். அரச உடன்படிக்கைச் சூழலில் வம்சத் தொடர்ச்சியைக் குறிக்கும் கூட்டுப்பொருள் கொண்ட ஒருமை என்பதால் ‘சந்ததி’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: உடன்படிக்கை சார்ந்த இக்கவிதைச் சூழலில் முடிவில்லாத நீடித்த காலத்தைக் குறிக்கிறது; ‘என்றென்றும்’ நவீனத் தமிழில் இயல்பான, உயர்வான வடிவம்.
- source_word: יִהְיֶה
  choice: நிலைத்திருக்கும்
  rationale: எபிரெய வினை சொல்லடியாக ‘இருக்கும்’ என்றாலும், சந்ததி என்றென்றும் தொடர்ந்து இருப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்த ‘நிலைத்திருக்கும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְכִסְאוֹ
  choice: அவனுடைய அரியணை
  rationale: כִּסֵּא என்பதன் நேர்ப்பொருள் ‘அரியணை’; இங்கு அது அரசாட்சியையும் அரசுரிமையையும் சுட்டினாலும், மூலத்தின் தெளிவான கவித்துவப் படிமம் தக்கவைக்கப்பட்டது.
- source_word: כַשֶּׁמֶשׁ
  choice: சூரியனைப்போல்
  rationale: כ முன்னொட்டு உவமையைக் குறிக்கிறது; ‘சூரியனைப்போல்’ அந்த உவமையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: נֶגְדִּי
  choice: என் முன்னிலையில்
  rationale: נֶגֶד உடன் முதல் நபர் ஒருமை பின்னொட்டு ‘என் முன்/என் முன்னிலையில்’ எனப் பொருள்படும். ‘என் முன்னிலையில்’ நேரடியான தெய்வீகப் பேச்சையும் இருப்புச் சார்ந்த பொருளையும் காக்கிறது.
theological_decisions:
- issue: נֶגְדִּי என்பதிலுள்ள முதல் நபர் ஒருமை யாரைக் குறிக்கிறது
  choice: தேவன் நேரடியாகப் பேசுவதைத் தக்கவைத்து ‘என் முன்னிலையில்’ என மொழிபெயர்த்தல்
  alternative: ‘என் முன்’ என இன்னும் சொல்லடி நெருக்கமாக மொழிபெயர்த்தல்
  rationale: இந்தப் பகுதி ஆண்டவர் தாவீதையும் அவன் வம்சத்தையும் பற்றிப் பேசுவதாக அமைந்துள்ளது. முதல் நபரை மாற்றாமல் வைத்திருப்பது உடன்படிக்கையின் வலிமையைப் பாதுகாக்கிறது; அதற்கு மேலான கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
- issue: இரண்டாம் அடியில் வெளிப்படையான வினை இல்லாமை
  choice: தமிழின் தெளிவுக்காக ‘இருக்கும்’ என்பதை நிறைவு வினையாக வழங்குதல்
  alternative: ‘அவனுடைய அரியணை என் முன் சூரியனைப்போல்’ என்று வினையின்றி கவித்துவ நீக்கத்தைத் தக்கவைத்தல்
  rationale: எபிரெயத்தில் இரண்டாம் அடியின் வினை முதல் அடியிலிருந்து உணரப்படுகிறது. தமிழில் ‘இருக்கும்’ என்பதை வழங்குவது புதிய இறையியல் பொருளைச் சேர்க்காமல் ஒப்புமையைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைக்குரிய கண்ணியத்தையும் எளிய வாசிப்புத்தன்மையையும் இணைக்கிறது. ‘சந்ததி’, ‘அரியணை’, ‘என்றென்றும்’ ஆகியவை பொதுவாகப் புரியக்கூடிய இலக்கியச் சொற்கள். எபிரெயத்தின் இரு இணை அடிகளும் அரைப்புள்ளியால் தெளிவாகப் பிரிக்கப்பட்டுள்ளன.
