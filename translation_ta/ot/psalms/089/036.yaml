  text: His offspring will endure forever[c][b][a], and his throne will be like the sun before me.
translation:
  language: ta
  text: அவனுடைய சந்ததி[a] என்றென்றும் நிலைத்திருக்கும்; அவனுடைய அரியணை என் முன்னிலையில்[b] சூரியனைப்போல் இருக்கும்.[c]
  philosophy: optimal-equivalence
