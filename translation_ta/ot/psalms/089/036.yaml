  - marker: a
    text: அல்லது, ‘அவனுடைய விதை’. இங்கு எபிரெயச் சொல் ஒருவரின் வழித்தோன்றலைக் கூட்டாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் முன்’.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, வினையை வெளிப்படையாகச் சேர்க்காமல், ‘அவனுடைய அரியணை என் முன் சூரியனைப்போல்’ என மொழிபெயர்க்கலாம்.
