  text: But you have cast off and rejected[a]; you have become enraged with your anointed one.
translation:
  language: ta
  text: ஆனால் நீரோ அவரைத் தள்ளிவிட்டீர், வெறுத்தீர்; உமது அபிஷேகம் பெற்றவர்மீது கடுங்கோபம் கொண்டீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “உமது அபிஷேகம் பெற்றவர்” அல்லது “உமது மேசியா.” பின்னர் “மேசியா” என்று வழங்கப்படும் அதே சொல்லே இது; ஆனால் இங்கு இது உடனடியாகக் கடவுளின் உடன்படிக்கைக்குட்பட்ட தாவீதிய அரசனைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: ஆனால் நீரோ
  rationale: முந்தைய உடன்படிக்கை உறுதிமொழிகளுக்கு எதிரான வலுவான திருப்பத்தை இணைப்புச் சொல்லும் தனிப்பட்ட சுட்டுப்பெயரும் காட்டுகின்றன; ‘ஆனால் நீரோ’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: זָנַחְתָּ
  choice: தள்ளிவிட்டு
  rationale: இந்த வினை நிராகரித்து ஒதுக்கிவிடுதல் என்ற வலுவான படிமத்தைத் தருகிறது.
- source_word: וַ/תִּמְאָס
  choice: புறக்கணித்தீர்
  rationale: முந்தைய வினையுடன் சேர்ந்து நிராகரிப்பை வலுப்படுத்துகிறது; இகழ்ச்சியுடன் ஏற்க மறுக்கும் நுண்பொருளையும் கொண்டுள்ளது.
- source_word: הִתְעַבַּרְתָּ
  choice: கடுங்கோபம் கொண்டீர்
  rationale: இந்த வடிவம் மிகுந்த சினமடைதல் அல்லது கோபம் பொங்குதல் என்பதைச் சூழலில் குறிக்கிறது; தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: עִם
  choice: மீது
  rationale: எபிரெயத்தில் அடிப்படையாக ‘உடன்’ என்றாலும், கோபத்துடன் வரும் தமிழ்ச் சொல்லாட்சியில் அதன் இலக்கை ‘மீது’ என்பது இயல்பாகக் காட்டுகிறது.
- source_word: מְשִׁיחֶךָ
  choice: உமது அபிஷேகம் பெற்றவர்
  rationale: சொல் நேரடியாக ‘உம்மால் அபிஷேகம் பெற்றவர்’ என்பதைக் குறிக்கிறது. இச்சங்கீதத்தில் உடனடியான குறிப்பு தாவீதின் வம்சத்து அரசனைச் சார்ந்தது; அதேவேளை ‘மேசியா’ என்ற சொல்லுடனான தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: அரசரைப் பற்றிய புலம்பலில் மְשִׁיחֶךָ என்பதன் மேசியாவுக்குரிய ஒலிப்பு
  choice: உமது அபிஷேகம் பெற்றவர்
  alternative: உமது மேசியா
  rationale: எபிரெயச் சொல்லிலிருந்தே ‘மேசியா’ என்ற பெயர் வந்தாலும், இவ்வசனத்தில் அது உடனடியாக உடன்படிக்கைக்குட்பட்ட தாவீதிய அரசனைக் குறிக்கிறது. குறிப்பிட்ட கிறிஸ்தவ அடையாளத்தை வசனம் சொல்வதைவிட வெளிப்படையாகப் புகுத்தாமல், சொற்பொருள் மற்றும் மேசியாவுக்குரிய தொடர்பு இரண்டையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான புலம்பல் நடையைப் பேணுகிறது. இறைவனை நோக்கிய மரியாதைப் பன்மை ஒருமைப்படுத்தப்பட்டுள்ளது; எபிரெய வினைகளின் வலிமையும் மְשִׁיחֶךָ என்பதிலுள்ள அரசியல்-மேசியா சார்ந்த பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
