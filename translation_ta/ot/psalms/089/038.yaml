revisions:
- from: ஆனால் நீரோ அவரைத் தள்ளிவிட்டு, புறக்கணித்தீர்; உமது அபிஷேகம் பெற்றவர்மீது[a] கடுங்கோபம் கொண்டீர்.
  to: ஆனால் நீரோ அவரைத் தள்ளிவிட்டீர், வெறுத்தீர்; உமது அபிஷேகம் பெற்றவர்மீது கடுங்கோபம் கொண்டீர்.[a]
  rationale: முதல் இரண்டு எபிரெய வினைகள் நிராகரிப்பை வலுப்படுத்தும் இணைச்சொற்களாக உள்ளன. “தள்ளிவிட்டீர், வெறுத்தீர்” அவற்றின் வேறுபட்டாலும் இணைந்துள்ள வலிமையை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது. மற்ற சொற்களும் அடிக்குறிப்பும் மூலத்திற்கும் ஆங்கில ஆய்வுத் தடத்திற்கும் ஏற்ப உள்ளன.
