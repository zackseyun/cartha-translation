  text: You have brought his splendor to an end and cast his throne to the ground[a][b].
translation:
  language: ta
  text: அவருடைய பொலிவை முடிவுக்குக் கொண்டுவந்தீர்; அவருடைய அரியணையைத் தரையில் வீழ்த்தினீர்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய ஒளிர்வை/தூய்மையை ஓயச்செய்தீர்.” எபிரெயச் சொல் ஒளிர்வு, தூய்மை, அல்லது பொலிவு எனப் பொருள்படலாம்; இங்குள்ள அரசச் சூழலில் “பொலிவு” பொருத்தமாக உள்ளது.
    reason: lexical_alternative
