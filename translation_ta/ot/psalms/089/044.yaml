    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּתָּ
  choice: முடிவுக்குக் கொண்டுவந்தீர்
  rationale: שׁבת என்பதன் ஹிஃபில் வடிவம் ‘ஓயச்செய்தல், முடிவுக்குக் கொண்டுவருதல்’ என்ற காரணவினைப் பொருளைத் தருகிறது; இத்தமிழாக்கம் அதைப் பொருத்தமான நவீன நடையில் வெளிப்படுத்துகிறது.
- source_word: מִטְּהָרוֹ
  choice: அவருடைய மகிமையை
  rationale: טֹהַר என்பது ஒளிர்வு, தூய்மை, பொலிவு ஆகிய பொருள்களைக் குறிக்கலாம். அரசனைப் பற்றிய இச்சூழலில் அரச மேன்மையையும் பொலிவையும் குறிக்கும் ‘மகிமை’ இயல்பாகப் பொருந்துகிறது.
- source_word: וְכִסְאוֹ
  choice: அவருடைய அரியணையை
  rationale: כִּסֵּא என்பதற்கான நேரடியான பொருள் அரியணை; இணைப்புச் சொல் தமிழ் நிறுத்தக்குறி மற்றும் அடுத்த தொடரால் இயல்பாக வெளிப்படுகிறது.
- source_word: לָאָרֶץ
  choice: தரையில்
  rationale: אֶרֶץ அடிப்படையில் பூமி அல்லது நிலம் எனப் பொருள்படும்; அரியணை தாழ்த்தப்படும் உருவகத்தில் ‘தரையில்’ என்பது இயல்பான தமிழ்.
- source_word: מִגַּרְתָּה
  choice: வீழ்த்தினீர்
  rationale: இவ்வினை கீழே எறிதல் அல்லது தள்ளிவிடுதல் என்ற வலுவான பொருளைக் கொண்டது. ‘வீழ்த்தினீர்’ அரியணையின் தாழ்த்தப்படுதலையும் அவமானத்தையும் சுருக்கமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஒருமை உடைமை விகுதிகளின் குறிப்பு
  choice: ‘அவருடைய’ என்று மட்டும் மொழிபெயர்த்து, குறிக்கப்படுபவர் யார் என்பதை வசனத்தில் வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: தாவீதின் அரசன் அல்லது உடன்படிக்கையின் அபிஷேகம் பெற்றவர் என்று தெளிவுபடுத்துதல்.
  rationale: எபிரெய உரை இவ்வசனத்தில் முன்னிலையை மீண்டும் பெயரிட்டு கூறாமல் உடைமை விகுதிகளை மட்டுமே பயன்படுத்துகிறது. அதே மறைமுகத்தன்மையைப் பாதுகாப்பது விளக்கத்தை மொழிபெயர்ப்புக்குள் திணிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்தின் கண்ணியமான நேரடி உரையாடலைப் பேணும் வகையில் மரியாதை ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. ‘மகிமை’ அரச பொலிவைக் குறிக்கிறது; அதன் உண்மையான சொற்பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
