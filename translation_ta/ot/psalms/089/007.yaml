    reason: cultural_note
lexical_decisions:
- source_word: אֵל
  choice: கடவுள்
  rationale: இக்கவிதைச் சூழலில் இச்சொல் பொதுவான ஒரு தெய்வத்தைக் குறிக்காமல் இஸ்ரயேலின் கடவுளைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பான இணைச்சொல் ‘கடவுள்’.
- source_word: נַעֲרָץ
  choice: பெரிதும் அஞ்சப்படுகிறவர்
  rationale: நிபால் வினையெச்சம் அச்சமும் வியப்பும் கலந்த பயபக்தியுடன் நோக்கப்படுவதைத் தெரிவிக்கிறது. ‘அஞ்சப்படுகிறவர்’ அந்த நேரடிப் பொருளைக் காக்கிறது; ‘பெரிதும்’ என்பதுடன் சேர்ந்து தீவிரத்தையும் வெளிப்படுத்துகிறது.
- source_word: בְּסוֹד
  choice: மன்றத்தில்
  rationale: סוֹד என்பது நெருக்கமான ஆலோசனைக் குழுவையோ கூடுகையையோ குறிக்கலாம். இங்கு புனிதர்களுடன் வருவதால் விண்ணுலக மன்றம் மிகவும் சாத்தியம்; ‘மன்றம்’ இரு நுணுக்கங்களுக்கும் இடமளிக்கிறது.
- source_word: קְדֹשִׁים
  choice: புனிதர்கள்
  rationale: சொல்லின் அடிப்படைப் பொருளைத் தெளிவாகக் காக்கிறது. சூழலில் இது பெரும்பாலும் விண்ணுலகப் புனித உயிர்களைக் குறித்தாலும், முதன்மை உரை அதனை மிகையாகத் தெளிவுபடுத்தாமல் விடுகிறது.
- source_word: רַבָּה
  choice: பெரிதும்
  rationale: இங்கு வினையடைப் பயன்பாட்டில் வந்து அஞ்சப்படுதலின் அளவை வலுப்படுத்துகிறது.
- source_word: וְנוֹרָא
  choice: அவர் பயபக்திக்குரியவர்
  rationale: נוֹרָא அச்சமும் வியப்பும் தூண்டும் தன்மையைக் குறிக்கிறது. ‘பயபக்திக்குரியவர்’ தமிழில் எதிர்மறையான பயமென்று மட்டும் பொருள்படாமல், reverential awe என்ற நுணுக்கத்தைக் காக்கிறது.
- source_word: עַל כָּל סְבִיבָיו
  choice: அவரைச் சூழ்ந்திருக்கும் அனைவரையும்விட
  rationale: עַל இங்கு ஒப்பீட்டு மேன்மையைத் தெரிவிக்கிறது. கடவுளைச் சூழ்ந்திருப்போர் அனைவரைக் காட்டிலும் அவர் அதிக பயபக்திக்குரியவர் என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘புனிதர்கள்’ மற்றும் கடவுளைச் சூழ்ந்திருப்போரின் அடையாளம்
  choice: முதன்மை உரையில் ‘புனிதர்கள்’ என்று வைத்து, அடிக்குறிப்பில் விண்ணுலக உயிர்கள் என்பதே இங்கு மிகச் சாத்தியம் எனக் குறிப்பிடுதல்
  alternative: மனிதப் புனிதர்கள் அல்லது மனிதரும் விண்ணுலக உயிர்களும் சேர்ந்த வழிபாட்டுக் கூட்டம்
  rationale: சங்கீதம் 89-ன் அண்மைச் சூழல் வானங்களையும் மேலுலகக் கூட்டத்தையும் பேசுவதால் விண்ணுலக மன்ற வாசிப்பு வலுவானது. எனினும் எபிரெயச் சொல்லின் பரப்பை முதன்மை உரையில் குறுக்காமல் உண்மையான சாத்திய வேறுபாடு காக்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் அடியில் எபிரெய இணைச்சொற்களின் நேரடியான அச்சநுணுக்கமும், இரண்டாம் அடியில் பயமும் வியப்பும் கலந்த பயபக்தி நுணுக்கமும் காக்கப்பட்டுள்ளன.
