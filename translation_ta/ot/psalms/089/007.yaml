  - marker: a
    text: அல்லது, ‘கூட்டத்தில்’; எபிரெயச் சொல் நெருக்கமான ஆலோசனை மன்றத்தையோ ஆலோசனைக் கூட்டத்தையோ குறிக்கலாம்.
