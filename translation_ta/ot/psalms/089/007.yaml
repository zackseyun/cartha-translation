  text: God is greatly feared in the council of the holy ones[b][a], and awesome above all who surround him.
translation:
  language: ta
  text: 'புனிதர்களின்[b] மன்றத்தில்[a] கடவுள் பெரிதும் அஞ்சப்படுகிறவர்;

    தம்மைச் சூழ்ந்திருப்போர் அனைவரையும் விட அவர் பயபக்தி ஊட்டுகிறவர்.'
  philosophy: optimal-equivalence
