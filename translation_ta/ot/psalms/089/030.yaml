theological_decisions:
- issue: உடன்படிக்கை மற்றும் சட்டச் சூழலில் תּוֹרָה என்பதன் மொழிபெயர்ப்பு
  choice: என் சட்டத்தை
  alternative: என் போதனையை
  rationale: תּוֹרָה விரிவாக ‘போதனை’ எனப் பொருள்படக்கூடியதாயினும், உடனுள்ள ‘என் நீதிநியமங்கள்’ என்ற இணைவரி சட்ட மற்றும் உடன்படிக்கை நயத்தை முன்னிறுத்துகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: בָנָיו என்பதன் பாலினக் குறிப்பு
  choice: அவனுடைய மகன்கள்
  alternative: அவனுடைய பிள்ளைகள்
  rationale: எபிரெய மூலத்தில் ஆண்பால் பன்மை வெளிப்படையாக உள்ளது; தாவீதுடன் தொடர்புடைய சந்ததியாரைக் குறிக்கும் சூழலிலும் ‘மகன்கள்’ மூலத்தின் குறிப்பைத் துல்லியமாகக் காக்கிறது.
- issue: מִשְׁפָּטַי உடன் வரும் בְּ முன்னிடைச்சொல்லின் நடைமுறைப் பொருள்
  choice: என் நீதிநியமங்களின்படி
  alternative: என் நீதித்தீர்ப்புகளில்
  rationale: எபிரெய அமைப்பைச் சொற்படியாக ‘நீதித்தீர்ப்புகளில் நட’ எனக் கூறலாம்; ஆனால் கட்டளைகளுக்கு ஏற்ப ஒழுகுதல் என்பதே இச்சூழலின் இயல்பான பொருள். ‘-இன்படி’ அதைப் பொருள் தீர்மானத்தை மிகைப்படுத்தாமல் தெளிவாகத் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேதாகம நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நட’ என்ற எபிரெய வாழ்வொழுக்க உருவகம் தக்கவைக்கப்பட்டு, நிறைவடையாத நிபந்தனை வாக்கியமாக அடுத்த வசனத்துடன் தொடரும் அமைப்பும் இறுதிக் காற்புள்ளியால் பாதுகாக்கப்பட்டுள்ளது.
