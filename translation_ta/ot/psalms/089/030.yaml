  text: If his sons abandon my law and do not walk in my judgments[b][a],
translation:
  language: ta
  text: அவனுடைய மகன்கள் என் சட்டத்தைக்[a] கைவிட்டு, என் நியாயத்தீர்ப்புகளின்படி[b] நடக்காவிட்டால்,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் போதனையை.’ எபிரெய மொழியிலுள்ள தோரா (תּוֹרָה) என்பது சட்டம், போதனை, அல்லது அறிவுறுத்தல் என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் நியமங்களின்படி நடக்காவிட்டால்.’ சொற்படியாக, ‘என் நியாயத்தீர்ப்புகளில் நடக்காவிட்டால்.’
    reason: lexical_alternative
