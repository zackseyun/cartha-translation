  text: מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְ/לֹ֣א יִרְאֶה מָּ֑וֶת יְמַלֵּ֨ט נַפְשׁ֖/וֹ מִ/יַּד שְׁא֣וֹל סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/048.yaml
  text: What man can live and not see death? Can he deliver his soul from the hand of Sheol? Selah[a][b][c]
translation:
  language: ta
  text: எந்த மனிதன் சாவைக் காணாமல் உயிர்வாழ முடியும்?[a] அவன் தன் உயிரை ஷியோலின் கையிலிருந்து விடுவிக்க முடியுமா?[b][c] சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, “சாவை அனுபவிக்காமல்.” சொல்லுக்குச் சொல்: “சாவைக் காணாமல்.”'
    reason: lexical_alternative
  - marker: b
    text: “தன் உயிரை” என்பதற்கு “தன் ஆத்துமாவை” அல்லது “தன்னையே” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “ஷியோல்” என்பது இறந்தோரின் உலகத்தைக் குறிக்கும் எபிரெயச் சொல்; “கல்லறை” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: எந்த மனிதன்
  rationale: இது மனிதர் அனைவரின் இறப்புக்குரிய தன்மையைச் சுட்டும் வினாவுரை. גֶבֶר என்பதன் ஆண்பால் வடிவைத் துல்லியமாகப் பிரதிபலிக்கிறது.
- source_word: יִחְיֶה
  choice: உயிர்வாழ முடியும்
  rationale: வினாவுரையில் வரும் imperfect வடிவம் சாத்தியத்தைக் குறிக்கிறது; தமிழில் ‘முடியும்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְלֹא יִרְאֶה מָוֶת
  choice: சாவைக் காணாமல்
  rationale: ‘சாவைக் காணுதல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்தபடி, தமிழில் இயல்பான எதிர்மறைத் தொடர்பாக வழங்குகிறது.
- source_word: יְמַלֵּט
  choice: விடுவிக்க முடியுமா
  rationale: Piel வடிவின் ‘தப்புவித்தல்/விடுவித்தல்’ பொருளையும் வினாவுரையின் சாத்திய உணர்வையும் வெளிப்படுத்துகிறது.
- source_word: נַפְשׁוֹ
  choice: தன் உயிரை
  rationale: נפש இச்சூழலில் உயிர், தன்னையே, அல்லது ஆத்துமா எனப் பொருள்படலாம். மரணம் மற்றும் பாதாளத்தோடு உள்ள இணைப்பில் ‘உயிர்’ நவீன தமிழில் இயல்பாகவும் பொருள் அகலத்தை ஓரளவு காக்கும் வகையிலும் உள்ளது.
- source_word: מִיַּד
  choice: பிடியிலிருந்து
  rationale: ‘கையிலிருந்து’ என்ற சொற்படிமத்தின் அதிகாரம் அல்லது வசப்படுத்தும் பிடி என்ற பொருளை தமிழில் தெளிவாகத் தெரிவிக்கிறது.
- source_word: שְׁאוֹל
  choice: பாதாளம்
  rationale: தமிழ் வேதாகம நடையில் இறந்தோரின் உலகைக் குறிக்கும் பரந்த சொல்லாகப் புரிந்துகொள்ளப்படுகிறது; ‘நரகம்’ என்ற பிற்காலத் தண்டனை சார்ந்த பொருளைத் திணிக்காது. எபிரெயச் சொல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியில்லாததால், மொழிபெயர்க்காமல் ஒலிபெயர்ப்பு தக்கவைக்கப்படுகிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் பொருள்
  choice: பாதாளம்
  alternative: இறந்தோரின் உலகம்; கல்லறை; ஷியோல்
  rationale: இவ்வசனம் மரணத்தின் உலகளாவிய தன்மையையும் அதிலிருந்து மனிதன் தன்னை விடுவிக்க இயலாமையையும் பேசுகிறது. ‘நரகம்’ என வழங்குவது மூலத்தில் இல்லாத பிற்காலக் கோட்பாட்டு குறிப்பைச் சேர்க்கும்; ‘கல்லறை’ மட்டும் என வழங்குவது கருத்தை அளவுக்கு மீறிச் சுருக்கக்கூடும்.
- issue: גֶבֶר என்பதிலுள்ள பிரதிநிதித்துவ ஆண்பால்
  choice: மனிதன்
  alternative: மனிதர்; ஒருவர்
  rationale: மூலத்தின் ஆண்பால் சொல்லைத் துல்லியமாகக் காட்டுகிறது; அதேவேளையில் வினாவுரை மனிதர் அனைவரின் இறப்புக்குரிய நிலையைக் குறிக்கிறது.
- issue: נפש என்பதன் மனித இயல்பு சார்ந்த பொருள்
  choice: உயிர்
  alternative: ஆத்துமா; தன்னையே
  rationale: ஒரு குறிப்பிட்ட உடல்–ஆத்துமா கோட்பாட்டை வசனத்தில் திணிக்காமல், மரணத்திலிருந்து உயிரை மீட்பது என்ற உடனடிச் சூழலை முன்னிறுத்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான வினாவுரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘சாவைக் காணுதல்’ என்ற மூல உருவகம் காக்கப்பட்டுள்ளது. ‘கையிலிருந்து’ என்பதற்குப் பதிலாக இயல்பான ‘பிடியிலிருந்து’ பயன்படுத்தப்பட்டாலும் அதன் அதிகார/வசப்படுத்தல் உருவகம் தக்கவைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடுகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
