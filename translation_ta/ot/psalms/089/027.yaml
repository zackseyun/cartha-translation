  text: אַף אָ֭נִי בְּכ֣וֹר אֶתְּנֵ֑/הוּ עֶ֝לְי֗וֹן לְ/מַלְכֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/027.yaml
  text: Indeed[a], I will make him the firstborn, the highest of the kings of the earth.
translation:
  language: ta
  text: நிச்சயமாக, நான் அவனை முதற்பேறானவனாகவும்[a], பூமியின் அரசர்களுக்கெல்லாம் மேலானவனாகவும் ஆக்குவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இங்கு ‘முதற்பேறானவன்’ என்பது பிறப்பு வரிசையில் முதலாவதாகப் பிறந்தவனை மட்டுமே குறிக்க வேண்டியதில்லை; மிக உயர்ந்த பதவியும் சிறப்புரிமையும் பெற்றவனைக் குறிக்கலாம். அல்லது ‘தலைசிறந்தவனாகவும்’.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: ஆம்
  rationale: இங்கு இது வெறும் சேர்க்கைப் பொருளை மட்டும் தராமல், அடுத்து வரும் இறை உறுதிமொழியை வலியுறுத்துகிறது. நவீன தமிழில் ‘ஆம்’ அந்த வலியுறுத்தலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אָ֭נִי
  choice: நான்
  rationale: எபிரெயில் தனிப்பட்ட சுட்டுப்பெயர் வெளிப்படையாக இடம்பெற்று, பேசுகிறவரை வலியுறுத்துகிறது; தமிழிலும் அது நேரடியாகத் தக்கவைக்கப்பட்டுள்ளது.
- source_word: בְּכוֹר
  choice: முதற்பேறானவன்
  rationale: மூலச்சொல்லின் அடிப்படை உருவகத்தையும், அரச மரபில் அது குறிக்கும் முதன்மை நிலை மற்றும் உரிமையையும் தக்கவைக்கிறது.
- source_word: אֶתְּנֵהוּ
  choice: அவனை … ஆக்குவேன்
  rationale: இங்கு נתן என்பது ஒருவரை ஒரு குறிப்பிட்ட நிலைக்கு ஏற்படுத்துதல் அல்லது நியமித்தல் என்ற விளைவுப்பொருளில் வருகிறது; ‘ஆக்குவேன்’ அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֶלְיוֹן
  choice: மேலானவன்
  rationale: இங்கு இச்சொல் இறைப் பட்டமாக அல்லாமல் மற்ற அரசர்களோடு ஒப்பிடப்படும் உயர்ந்த பதவியைக் குறிக்கிறது.
- source_word: לְמַלְכֵי אָרֶץ
  choice: பூமியின் அரசர்களுக்கெல்லாம்
  rationale: לְ இங்கு தொடர்பு அல்லது ஒப்பீட்டைக் குறிக்கிறது. ‘அரசர்களுக்கெல்லாம் மேலானவன்’ என்பது அவர்களைவிட உயர்ந்த நிலையைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘முதற்பேறானவன்’ என்பதன் அரச மற்றும் சாத்தியமான மேசியா சார்ந்த பொருள்
  choice: அரசனுடைய முதன்மை நிலையையும் சிறப்புரிமையையும் தாங்கும் ‘முதற்பேறானவன்’ என்ற சொல்லைத் தக்கவைத்தல்; மேசியா சார்ந்த வாசிப்பை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்க்காதிருத்தல்.
  alternative: ‘தலைசிறந்தவன்’ அல்லது ‘வாரிசு’ என்று பொருளை மட்டும் வெளிப்படுத்துதல்.
  rationale: சூழலில் இது தாவீதிய அரசனைப் பற்றியது; வேதாகமத்தின் கிறிஸ்தவ முழுமைப் பார்வையில் மேசியா சார்ந்த முக்கியத்துவத்தையும் பெறுகிறது. எனினும், மூல எபிரெயச் சொல் கொண்டுள்ள உருவகத்தையும் அதன் இறையியல் ஆழத்தையும் மொழிபெயர்ப்பு தக்கவைத்து, குறிப்பிட்ட கோட்பாட்டு முடிவை உரைக்குள் திணிக்காமல் இருக்க வேண்டும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்துக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. இணையான இரு பதவிச் சொற்றொடர்களும் ‘-ஆகவும்’ என அமைக்கப்பட்டு எபிரெயக் கவிதை அமைப்பு இயன்றவரை தக்கவைக்கப்பட்டுள்ளது.
