source:
  edition: WLC
  text: כִּֽי אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה שָׁמַ֓יִם תָּכִ֖ן אֱמוּנָתְ/ךָ֣ בָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/002.yaml
  text: For I said[a], “Steadfast love will be built up forever; in the heavens you will establish your faithfulness.”
translation:
  language: ta
  text: 'ஏனெனில் நான் சொன்னேன்: “மாறாத அன்பு என்றென்றும் கட்டியெழுப்பப்படும்[a]; வானங்களில் உமது நம்பகத்தன்மையை நீர் நிலைநிறுத்துவீர்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாறாத அன்பு என்றென்றும் நிலைநிறுத்தப்படும்” என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல் ‘கட்டியெழுப்பப்படும்’ என்றும், பொதுவாக ‘நிலைநிறுத்தப்படும்’ என்றும் பொருள்படலாம்; முதன்மை உரை கவிதையின் கட்டிட உருவகத்தைப் பாதுகாக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சங்கீதக்காரரின் முந்தைய கூற்றுக்கு விளக்கமோ காரணமோ அளிக்கும் இணைப்புச் சொல்லாக இருப்பதால், அதன் உரையாடல் ஓட்டத்தையும் காரணப் பொருளையும் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אָמַרְתִּי
  choice: நான் சொன்னேன்
  rationale: கால் நிறைவுவினை முதல் நபர் ஒருமையை நேரடியாகவும் இயல்பான நவீனத் தமிழிலும் எடுத்துரைக்கிறது; ‘நான் அறிவிக்கிறேன்’ என்பது தேவையற்ற விளக்கத்தைச் சேர்க்கும்.
- source_word: עוֹלָם
  choice: என்றென்றும்
  rationale: காலவரம்பற்ற நீடித்த தன்மையை இயல்பான கவிதைநயமுள்ள தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: அன்பு, பற்றுறுதி, நிலைத்த விசுவாசம் ஆகியவற்றை ஒருங்கே தாங்கும் எபிரேயச் சொல்லின் செறிவை, இரக்கம் என்ற ஒரே பொருளுக்குள் சுருக்காமல் வெளிப்படுத்துகிறது.
- source_word: יִבָּנֶה
  choice: கட்டியெழுப்பப்படும்
  rationale: בנה என்ற வேரின் கட்டிட உருவகத்தையும் நிஃபால் வடிவத்தின் செயப்பாட்டு பொருளையும் எதிர்கால நோக்குள்ள கவிதைக் கூற்றையும் பாதுகாக்கிறது.
- source_word: שָׁמַיִם
  choice: வானங்களில்
  rationale: எபிரேயப் பன்மையைப் பிரதிபலிப்பதோடு, בָהֶם என்பதுடன் சேர்ந்த இடப்பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תָּכִין
  choice: நிலைநிறுத்துவீர்
  rationale: ஹிஃபில் இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவத்தின் ‘உறுதியாக நிலைபெறச் செய்தல்’ என்ற பொருளையும் கடவுளை நேரடியாக நோக்கும் உரையையும் பாதுகாக்கிறது.
- source_word: אֱמוּנָתְךָ
  choice: உமது உண்மைத்தன்மையை
  rationale: உறுதி, நம்பகத்தன்மை, விசுவாசம் ஆகிய பொருள் நிழல்களை இச்சூழலில் கடவுளின் நிலையான உண்மைத்தன்மையாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָהֶם
  choice: வானங்களில்
  rationale: இந்தப் பன்மைப் பதிலிடுபெயரின் முன்னிலைச் சொல் שָׁמַיִם என்பதால், தமிழில் குழப்பம் தவிர்க்க அதை வெளிப்படையாக மீண்டும் கூறுகிறது.
theological_decisions:
- issue: உடன்படிக்கை சார்ந்த கவிதைச் சூழலில் חֶסֶד என்பதன் இயல்பு
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கை அன்பு; இரக்கம்
  rationale: இந்தச் சொல் கடவுளின் நீடித்த அன்பையும் பற்றுறுதியையும் கொண்டாடுகிறது. ‘மாறாத அன்பு’ என்பது அதை வெறும் உணர்ச்சியாகவோ இரக்கமாகவோ சுருக்காமல், குறிப்பிட்ட கோட்பாட்டு சொல்லாட்சியையும் திணிக்காமல் காக்கிறது.
- issue: இரண்டாம் அடியை கடவுளிடம் நேரடியாக உரைப்பதாகப் புரிந்துகொள்வது
  choice: ‘உமது உண்மைத்தன்மையை நீர் நிலைநிறுத்துவீர்’ என்ற நேரடி உரை
  alternative: உண்மைத்தன்மை வானங்களில் நிலைநிறுத்தப்படும் என்ற ஆளில்லா கூற்று
  rationale: תָּכִין என்ற இரண்டாம் நபர் வினைவடிவமும் אֱמוּנָתְךָ என்பதிலுள்ள இரண்டாம் நபர் உரிமை விகுதியும் கடவுளை நேரடியாக நோக்கும் வாசிப்பை வலுவாக ஆதரிக்கின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக நோக்கும் ஒருமை வடிவத்தை ‘நீர்/உமது’ என மரியாதையுடன் காத்துள்ளோம்; எபிரேய இணைவாக்கியத்தின் சமநிலையும் கட்டிட உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
