source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹ֘הֵ֤י צְבָא֗וֹת מִֽי כָֽמ֖וֹ/ךָ חֲסִ֥ין יָ֑הּ וֶ֝/אֱמֽוּנָתְ/ךָ֗ סְבִיבוֹתֶֽי/ךָ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/008.yaml
  text: O Yahweh[a], God of hosts, who is mighty like you, O Yah? Your faithfulness surrounds you.
translation:
  language: ta
  text: சேனைகளின் கடவுளாகிய யாவே[a], உம்மைப் போன்ற வல்லவர் யார், யா[b]? உமது நம்பகத்தன்மை உம்மைச் சுற்றிலும் உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேய மொழியில்: יהוה (YHWH), இங்கு ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்ட கடவுளுடைய தனிப்பெயர்; பல மொழிபெயர்ப்புகள் இதை ‘ஆண்டவர்’ என்று வழங்குகின்றன.'
    reason: divine_name
  - marker: b
    text: 'எபிரேய மொழியில்: ‘யா’; இது ‘யாவே’ என்ற தெய்வீகப் பெயரின் சுருக்க வடிவம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், எபிரெய ஒலிப்புக்கு ஏற்ற தமிழ்ப் பெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: சேனைகளின் கடவுள்
  rationale: צְבָאוֹת என்பதன் ‘சேனைகள்/படைகள்’ என்ற பரந்த பொருளை, அவை மண்ணுலகப் படைகளா விண்ணுலகச் சேனைகளா என்று தேவையின்றிக் குறுக்காமல் காக்கிறது.
- source_word: מִי כָמוֹךָ חֲסִין
  choice: உம்மைப் போன்ற வல்லவர் யார்
  rationale: ஒப்பற்ற தன்மையை வலியுறுத்தும் எபிரெய வினாவையும் חֲסִין என்பதன் வலிமைப் பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: יָהּ
  choice: யா
  rationale: முன்னர் வரும் יְהוָה என்பதிலிருந்து வேறுபட்ட, தெய்வீகப் பெயரின் சுருக்க வடிவத்தைத் தமிழிலும் தனியே காக்கிறது.
- source_word: וֶאֱמוּנָתְךָ
  choice: உமது உண்மைத்தன்மை
  rationale: אֱמוּנָה இங்கு குறிக்கும் உறுதி, நம்பகத்தன்மை, மாறாத விசுவாசம் ஆகிய கருத்துகளை கடவுளின் பண்பாக இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סְבִיבוֹתֶיךָ
  choice: உம்மைச் சூழ்ந்துள்ளது
  rationale: ‘உம்மைச் சுற்றிலும்’ என்ற இடவியல் உருவகத்தை இயல்பான தமிழ் வாக்கியமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஒரே வசனத்தில் வரும் יְהוָה மற்றும் அதன் சுருக்க வடிவமான יָהּ ஆகியவற்றை வேறுபடுத்திக் காட்டுதல்
  choice: יְהוָה என்பதை ‘யாவே’ என்றும் יָהּ என்பதை ‘யா’ என்றும் வழங்குதல்
  alternative: இரண்டையும் ‘ஆண்டவர்’ என்றோ ‘யாவே’ என்றோ ஒரே வடிவில் வழங்குதல்
  rationale: மூல எபிரெயில் திட்டமிட்டு இடம்பெறும் இரு வேறுபட்ட வடிவங்களையும் காக்கிறது; தெய்வீகப் பெயரை ஒரு பொதுப் பட்டப்பெயரால் மாற்றுவதையும் தவிர்க்கிறது.
- issue: מִי כָמוֹךָ חֲסִין יָהּ என்பதன் தொடரியல்
  choice: ‘உம்மைப் போன்ற வல்லவர் யார், யா?’
  alternative: ‘வல்லவரான யாவே, உம்மைப் போன்றவர் யார்?’
  rationale: חֲסִין என்பதை ஒப்பீட்டு வினாவின் மையமாக வாசிக்கும் இயல்பான வாய்ப்பைப் பின்பற்றுகிறது; ‘யா’ என்பதை நேரடி அழைப்பாகக் காக்கிறது. எபிரெயக் கவிதையின் சுருக்கத்தால் பெயரடை எதனுடன் நெருக்கமாக இணைகிறது என்பதில் சிறிய தொடரியல் நெகிழ்வு உள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் ‘உமது/உம்மை’ என்ற மரியாதை வடிவங்கள் காக்கப்பட்டுள்ளன; அரிதான சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
