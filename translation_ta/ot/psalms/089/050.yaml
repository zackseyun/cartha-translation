source:
  edition: WLC
  text: זְכֹ֣ר אֲ֭דֹנָ/י חֶרְפַּ֣ת עֲבָדֶ֑י/ךָ שְׂאֵתִ֥/י בְ֝/חֵיקִ֗/י כָּל רַבִּ֥ים עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/050.yaml
  text: Remember[a], Lord, the reproach of your servants[b], which I bear in my bosom from many peoples.
translation:
  language: ta
  text: ஆண்டவரே, உமது ஊழியர்களுக்கு நேரிடும் நிந்தையை நினைவுகூரும்; பல மக்களினங்களிடமிருந்து வரும்[a] அந்த நிந்தையை நான் என் நெஞ்சில்[b] சுமக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பல மக்களினங்களின் நிந்தை முழுவதையும் நான் என் நெஞ்சில் சுமக்கிறேன்.” “என் நெஞ்சில்” என்பதற்குப் பின் வரும் எபிரெய தொடரமைப்பு நெருக்கமாக உள்ளது; அது நிந்தை வரும் மூலத்தையோ (“பல மக்களினங்களிடமிருந்து”), சுமக்கப்படும் நிந்தையின் உள்ளடக்கம் அல்லது அளவையோ (“பல மக்களினங்களின் நிந்தை முழுவதையும்”) குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: “என் நெஞ்சில்” என்பது ஒன்றை வெறுமனே உடலால் அல்ல, தனிப்பட்ட முறையிலும் உள்ளார்ந்த விதத்திலும் சுமப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: זְכֹר
  choice: நினைவுகூரும்
  rationale: זכר என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவம்; புலம்பல் விண்ணப்பத்தின் நேரடியான வேண்டுகோளையும், தேவனை நோக்கிய மரியாதைமிக்க தமிழ்நடையையும் இது காக்கிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இங்கு இது தேவனை நேரடியாக விளிக்கும் நிலையான தெய்வீகப் பட்டம்; வரலாற்றியல் வடிவத்தை வைத்து ‘என் ஆண்டவரே’ என்ற உடைமைப் பொருளைத் தேவையின்றி சேர்க்கவில்லை.
- source_word: חֶרְפַּת
  choice: நிந்தையை
  rationale: இச்சொல் பழிப்பு, இகழ்ச்சி, அவமானம் ஆகிய பொருட்களை ஏந்துகிறது. ‘நிந்தை’ புலம்பலின் செறிவான தொனியை வைத்திருக்கிறது; அதை வெறும் வாய்மொழி ஏளனமாக மட்டும் குறுக்கவில்லை.
- source_word: עֲבָדֶיךָ
  choice: உமது ஊழியர்களுக்கு
  rationale: עבד அடிமையையோ பணியாளரையோ குறிக்கலாம்; ஆனால் தேவனுடைய மக்களைக் குறிக்கும் சங்கீத விண்ணப்பச் சூழலில் ‘ஊழியர்கள்’ இயல்பானது. ‘நிந்தை’ அவர்களுக்கு நேரிடுவதாகத் தமிழில் தெளிவுபடுத்தப்பட்டுள்ளது.
- source_word: שְׂאֵתִי
  choice: நான் … சுமக்கிறேன்
  rationale: נשׂא என்பது தூக்குதல் அல்லது சுமத்தல். இங்கு சங்கீதக்காரர் நிந்தையைத் தனிப்பட்ட முறையில் தாங்குவதை ‘சுமக்கிறேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְחֵיקִי
  choice: என் நெஞ்சில்
  rationale: חֵיק என்பது சொற்பொருளில் மடி அல்லது மார்புப்பகுதி. ‘என் நெஞ்சில்’ என்ற தேர்வு அந்த எபிரெய உருவகத்தையும், ஒன்றை நெருக்கமாகவும் தனிப்பட்ட முறையிலும் தாங்கும் கருத்தையும் காக்கிறது.
- source_word: כָּל רַבִּים עַמִּים
  choice: பல மக்களினங்களிடமிருந்து வரும்
  rationale: எபிரெய தொடரமைப்பு நெருக்கமாகவும் சற்றுத் தெளிவற்றதாகவும் உள்ளது. עַמִּים பன்மை என்பதால் தனிநபர்களைக் குறிக்கும் ‘பல மக்கள்’ என்பதற்குப் பதில் மக்களினங்கள் அல்லது தேசக்குழுக்களைக் குறிக்கும் ‘பல மக்களினங்கள்’ தேர்ந்தெடுக்கப்பட்டது. ‘இடமிருந்து’ என்பது நிந்தையின் மூலத்தை வெளிப்படுத்தச் சூழலடிப்படையில் சேர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: אֲדֹנָי என்ற தெய்வீகப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: ஆண்டவரே
  alternative: என் ஆண்டவரே
  rationale: சங்கீதங்களில் இது தேவனை நோக்கி விளிக்கும் மரபான தெய்வீகப் பட்டம். ‘ஆண்டவரே’ அந்தப் பயன்பாட்டைக் காக்கிறது; தேவையற்ற உடைமை நுட்பத்தைச் சேர்க்காது.
- issue: כָּל רַבִּים עַמִּים என்ற நெருக்கமான தொடரின் தொடர்பு
  choice: நிந்தை பல மக்களினங்களிடமிருந்து வருகிறது
  alternative: பல மக்களினங்களின் நிந்தை முழுவதையும் நான் என் நெஞ்சில் சுமக்கிறேன்
  rationale: எபிரெய இலக்கணத் தொடரில் மூலத்தையும் சுமக்கப்படும் உள்ளடக்கம் அல்லது அளவையும் குறிக்கும் இரு வாய்ப்புகள் உள்ளன. முதன்மை உரை மூலத்தைக் குறிக்கும் வாசிப்பைத் தேர்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்குரிய கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. ‘நினைவுகூரும்’ என்பது தேவனை நோக்கிய மரியாதைமிக்க ஒருமைக் கட்டளை; ‘மக்களினங்கள்’ என்பது עַמִּים என்பதன் பன்மை மற்றும் தேசிய/இனக்குழு நுட்பத்தைக் காக்கிறது. எபிரெய மூலத்தின் உண்மையான தொடரமைப்புத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
