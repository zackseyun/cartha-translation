  yaml_path: translation/ot/psalms/089/005.yaml
  text: The heavens will praise your wonders[a], O Yahweh—indeed, your faithfulness in the assembly of the holy ones.
translation:
  language: ta
  text: 'யாவே, வானங்கள் உமது அற்புதங்களைப் புகழும்;

    பரிசுத்தமானோரின் சபையில் உமது நம்பகத்தன்மையையும் புகழும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֹודוּ
  choice: புகழும்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் இங்கு வானங்கள் தேவனுடைய அற்புதங்களை அறிவித்துப் போற்றுவதைச் சுட்டுகிறது. தொடர்ச்சியான கவிதைச் சூழலில் எபிரெய yiqtol வடிவத்தின் எதிர்கால நுணுக்கத்தையும் இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁמַיִם
  choice: வானங்கள்
  rationale: எபிரெய மொழியின் பன்மை வடிவத்தையும் உயர்ந்த கவிதை நடையையும் நேரடியாகப் பேணுகிறது.
- source_word: פִּלְאֲךָ
  choice: உமது அற்புதங்களை
  rationale: פלא என்பது வியப்பூட்டும் செயல்களையோ நிகழ்வுகளையோ குறிக்கிறது; இங்கு கூட்டுப்பொருளைத் தமிழில் பன்மையாகக் கொடுத்துள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைநாமத்தை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் அடையாளம் காணத்தக்க ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אַף
  choice: -யையும்
  rationale: இரண்டாவது கூறை முதலாவதுடன் வலியுறுத்திச் சேர்க்கும் אַף என்பதன் பொருள், தமிழில் இணைப்புப் பின்னொட்டான ‘-யையும்’ மூலம் இயல்பாக வெளிப்படுகிறது.
- source_word: אֱמוּנָתְךָ
  choice: உமது உண்மைத்தன்மையை
  rationale: இங்கு אֱמוּנָה தேவனுடைய நம்பகத்தன்மையையும் மாறாத உண்மையையும் குறிக்கிறது; ‘உண்மைத்தன்மை’ இதைத் தெளிவாகத் தெரிவிக்கிறது.
- source_word: בִּקְהַל
  choice: சபையில்
  rationale: קהל என்பது கூடியிருக்கும் ஒன்றுகூடல் அல்லது சபையைக் குறிக்கிறது; בְּ முன்னொட்டின் இடப்பொருளும் பேணப்படுகிறது.
- source_word: קְדֹשִׁים
  choice: பரிசுத்தமானவர்கள்
  rationale: இச்சொல் பரிசுத்தமாக்கப்பட்ட மனிதர்களையோ விண்ணுலக உயிர்களையோ குறிக்கக்கூடும். சூழல் விண்ணுலக உயிர்களைச் சுட்டினாலும், மொழிபெயர்ப்பு அதனை ‘தேவதூதர்கள்’ என்று மிகத் துல்லியமாகக் கட்டுப்படுத்தாமல் மூலத்தின் பரப்பைத் தக்கவைக்கிறது.
theological_decisions:
- issue: קְדֹשִׁים என்போரின் அடையாளம்
  choice: ‘பரிசுத்தமானவர்கள்’ என்று பொதுவாக மொழிபெயர்த்து, விண்ணுலக உயிர்கள் என்பது சூழலால் சாத்தியமான வாசிப்பு என அடிக்குறிப்பில் தெரிவித்தல்.
  alternative: ‘பரிசுத்தவான்கள்’ அல்லது ‘தேவதூதர்கள்’ என்று மொழிபெயர்த்தல்.
  rationale: சங்கீதம் 89-ன் உடனடிச் சூழலில் வானங்களும் விண்ணுலகச் சபையும் குறிப்பிடப்படுவதால் விண்ணுலக உயிர்கள் என்ற பொருள் வலுவாக உள்ளது. ஆயினும், எபிரெயச் சொல் அவர்களை நேரடியாக ‘தேவதூதர்கள்’ என்று அடையாளப்படுத்தாததால் அந்தத் தெளிவின்மை மூலவசனத்திலேயே பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் சங்கீதத்துக்கேற்ற கண்ணியமான கவிதை நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்ற மரியாதை ஒருமையும் வரிசை முறிவும் உயர்ந்த இறைமொழி நடையைப் பேணுகின்றன. இரண்டாம் அடியில் மூலத்தில் விடுபட்டுள்ள ‘புகழும்’ என்ற வினை தமிழின் தெளிவுக்காக மீண்டும் வழங்கப்பட்டுள்ளது.
