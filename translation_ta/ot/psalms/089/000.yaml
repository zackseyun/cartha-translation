  text: எஸ்ராகியனான ஏத்தானின் மஸ்கீல்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மஸ்கீல்” என்பது சங்கீதத் தலைப்பில் வரும் ஓர் எபிரெய இசை அல்லது இலக்கியக் குறிச்சொல். அதன் துல்லியமான பொருள் உறுதியில்லை; அது தியானப் பாடல் அல்லது அறிவுறுத்தும் படைப்பைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: இந்தத் தலைப்பு சேராகின் வழிவந்தவரைக் குறிப்பதாகப் புரிந்துகொள்ளப்பட்டால், “சேராகியனான ஏத்தான்” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: சங்கீதத் தலைப்புகளில் வரும் இச்சொல்லின் துல்லியமான பொருள் உறுதியற்றது. விவாதத்திற்குரிய ஒரு பொருளை முதன்மை உரையில் திணிக்காமல், எபிரெய இலக்கிய அல்லது இசைக் குறிச்சொல்லை ஒலிபெயர்த்துப் பாதுகாக்கிறது.
- source_word: לְ
  choice: -இன்
  rationale: சங்கீதத் தலைப்புகளில் לְ என்பது ஆசிரியத்துவம், உரிமை, அர்ப்பணம் அல்லது பொதுவான தொடர்பைக் குறிக்கலாம். தமிழில் இயல்பான உடைமைத் தொடர்பை வெளிப்படுத்தும் “-இன்” இவ்வுறவைச் சுருக்கமாகக் காட்டினாலும், அதன் துல்லிய இயல்பை முடிவுசெய்யவில்லை.
- source_word: אֵיתָן
  choice: ஏத்தான்
  rationale: எபிரெய தனிப்பெயரின் உச்சரிப்பை நவீனத் தமிழில் தெளிவாகப் பிரதிபலிக்கும் ஒலிபெயர்ப்பு.
- source_word: הָאֶזְרָחִי
  choice: எஸ்ராகியன்
  rationale: மசோரெட்டிய உரையில் உள்ள வடிவத்தை நேரடியாகப் பிரதிபலிக்கும் குல அல்லது வழிவந்த அடையாளப் பெயர். “சேராகியன்” என்ற மரபுவழி விளக்கம் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
