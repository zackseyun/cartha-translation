  text: Remember how short my lifetime is! For what vanity have you created all the sons of man?[a][b]
translation:
  language: ta
  text: என் வாழ்நாள் எவ்வளவு குறுகியது என்பதை நினைவில் கொள்ளும்! எதற்காக மனிதர்கள் அனைவரையும் வீணாகப் படைத்தீர்?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்படியாக, ‘மனிதனின் மகன்கள் அனைவரையும்’; பொருள், ‘மனிதகுலம் முழுவதையும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மனிதர்கள் அனைவரையும் வீண்மைக்காகப் படைத்தீர்.’
    reason: syntactic_alternative
lexical_decisions:
- source_word: זְכָר
  choice: நினைவில் கொள்ளும்
  rationale: கடவுளை நோக்கிய இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை. தமிழில் மரியாதையுடனான நேரடி வேண்டுதலாக இயல்பாக உள்ளது.
- source_word: אֲנִי מֶה חָלֶד
  choice: என் வாழ்நாள் எவ்வளவு குறுகியது
  rationale: חָלֶד என்பது வாழ்நாள் அல்லது வாழ்க்கைக் காலத்தைக் குறிக்கிறது. இச்சூழலில் מֶה அதன் குறுகிய தன்மையை வியப்பும் புலம்பலும் கலந்த முறையில் வெளிப்படுத்துகிறது; אֲנִי தமிழில் இயல்பாக முதலாம் நபர் உடைமையாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: עַל מַה
  choice: எதற்காக
  rationale: பின்வரும் படைப்புச் செயலை நோக்கி எழுப்பப்படும் நோக்கக் கேள்வியைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: שָּׁוְא
  choice: வீணாக
  rationale: வெறுமை, பயனின்மை, வீண் ஆகிய பொருள்களைத் தரும் சொல்லை, படைத்தல் என்ற வினையோடு இயல்பாக இணையும் வினையடையாக மொழிபெயர்க்கிறது.
- source_word: בָּרָאתָ
  choice: படைத்தீர்
  rationale: கடவுளைச் சுட்டும் இரண்டாம் நபர் ஆண்பால் ஒருமை வினை; தமிழில் மரியாதைப் பன்மை வடிவம் பொருத்தமானது.
- source_word: כָל בְּנֵי אָדָם
  choice: மனிதர்கள் அனைவரையும்
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘மனிதனின் மகன்கள் அனைவரும்’ என்றாலும், பொதுவாக மனிதகுலம் முழுவதையும் குறிக்கிறது. நவீனத் தமிழில் பொருளைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது; சொற்படியான வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: בְּנֵי אָדָם என்ற பொதுவான மனிதக் குறிப்பு
  choice: மனிதர்கள் அனைவரையும்
  alternative: மனிதனின் மகன்கள் அனைவரையும் / மனிதகுலம் முழுவதையும்
  rationale: இது ஆண்களை மட்டும் அல்லாமல் மனிதர்கள் அனைவரையும் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் பாலின வரம்பைத் தவறாக உணர்த்தாமல் அதன் பொதுப்பொருள் முதன்மை உரையில் தரப்பட்டு, சொற்படியான அமைப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: עַל מַה שָּׁוְא என்பதன் கேள்வி அல்லது கூற்று தன்மை
  choice: எதற்காக ... வீணாகப் படைத்தீர்?
  alternative: மனிதர்கள் அனைவரையும் வீணாகப் படைத்தீர்.
  rationale: עַל מַה இயல்பாக நோக்கத்தை வினவும் புலம்பல் கேள்வியை அறிமுகப்படுத்துகிறது. எனினும் எபிரெயச் சொல்லமைப்பை கூற்றுத் தன்மையுள்ள புலம்பலாகவும் வாசிக்க இயலும் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடவுளை நோக்கிய மரியாதைமிக்க நேரடி புலம்பல் நடையில் வடிவமைக்கப்பட்டுள்ளது. ‘நினைவில் கொள்ளும்’, ‘படைத்தீர்’ ஆகியவை உயர்வானதாயினும் பொதுவாசகர்களுக்குப் புரியும் வடிவங்கள். கவிதையின் வாழ்வுக் குறுகிய தன்மை மற்றும் மனிதப் படைப்பின் பயனின்மையைப் பற்றிய தீர்க்கப்படாத இறையியல் பதற்றம் அப்படியே வைக்கப்பட்டுள்ளது.
