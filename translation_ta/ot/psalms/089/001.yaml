  text: חַֽסְדֵ֣י יְ֭הוָה עוֹלָ֣ם אָשִׁ֑ירָה לְ/דֹ֥ר וָ/דֹ֓ר אוֹדִ֖יעַ אֱמוּנָתְ/ךָ֣ בְּ/פִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/001.yaml
  text: I will sing of the steadfast love of Yahweh forever[a]; from generation to generation I will make your faithfulness known with my mouth.
translation:
  language: ta
  text: யாவேயின் பேரன்பை என்றென்றும் பாடுவேன்[a]; தலைமுறை தலைமுறையாக உமது நம்பகத்தன்மையை என் வாயால் அறிவிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பேரன்பு” என்பதற்கு “இரக்கங்கள்,” “மாறாத அன்பு,” அல்லது “மாறாத அன்பின் செயல்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல்லின் பன்மை வடிவம், யாவேயின் உடன்படிக்கை சார்ந்த அன்பு மீண்டும் மீண்டும் இரக்கச் செயல்களாக வெளிப்படுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי
  choice: மாறாத அன்பின் செயல்கள்
  rationale: எபிரெயச் சொல் பன்மை வடிவில் இருப்பதால், உடன்படிக்கைக்குரிய நிலையான அன்பையும் அது வெளிப்படும் பல இரக்கச் செயல்களையும் இவ்வாக்கியம் எடுத்துக்காட்டுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இஸ்ரவேலின் தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயர்; ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: עוֹלָם
  choice: என்றென்றும்
  rationale: இங்கு வினையுடன் இணைந்து நீடித்த காலத்தைச் சுட்டுகிறது; நவீன தமிழில் இயல்பான கவிதைநடைச் சொல்.
- source_word: אָשִׁירָה
  choice: பாடுவேன்
  rationale: இச்சை அல்லது உறுதியை வெளிப்படுத்தும் cohortative வடிவத்தின் தீர்மானமான தொனியை எதிர்கால வினை காக்கிறது.
- source_word: לְדֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: தொடர்ந்து வரும் ஒவ்வொரு தலைமுறையிலும் அறிவிக்கப்படுவதைத் தெரிவிக்கும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
- source_word: אוֹדִיעַ
  choice: அறிவிப்பேன்
  rationale: ידע என்பதன் Hiphil வடிவம் ‘அறியச் செய்வேன்’ எனப் பொருள்படும்; ‘அறிவிப்பேன்’ அதன் காரணவினைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: אֱמוּנָתְךָ
  choice: உமது உண்மைத்தன்மை
  rationale: தேவனுடைய நம்பகத்தன்மை, உறுதி, வாக்குத் தவறாமை ஆகிய பொருள்களை உள்ளடக்குகிறது; חֶסֶד உடனான இணைப்பையும் காக்கிறது.
- source_word: בְּפִי
  choice: என் வாயால்
  rationale: குரலால் வெளிப்படையாக அறிவிப்பதைக் குறிக்கும் மூலமொழியின் உடற்கூறு உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலவசனம் நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டத்தால் மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பின் தமிழ் ஒலிபெயர்ப்பாக வழங்குவது பெயரின் தன்மையைப் பாதுகாக்கிறது.
- issue: חַסְדֵי என்பதன் பன்மை மற்றும் உடன்படிக்கைச் சார்பு
  choice: மாறாத அன்பின் செயல்கள்
  alternative: இரக்கங்கள்; பேரன்பு
  rationale: பன்மை வடிவம் நிலையான அன்பை ஒரு கருத்தாக மட்டும் அல்லாமல், மீண்டும் மீண்டும் வெளிப்படும் இரக்கச் செயல்களாகவும் குறிக்கலாம். ‘உடன்படிக்கை அன்பு’ என விளக்கச் சொல்லை நேரடியாகச் சேர்க்காமல் இந்தத் தத்துவப் பரப்பை வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்துக்குரிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்பது வழிபாட்டு மரியாதையைத் தக்கவைத்தாலும் மிகப் பழமையான நடையைத் தவிர்க்கிறது. இணைவரி அமைப்பும் ‘என் வாயால்’ என்ற மூல உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
