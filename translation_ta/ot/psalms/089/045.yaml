  text: You have shortened the days of his youth; you have covered him with shame[a]. Selah
translation:
  language: ta
  text: 'அவனுடைய இளமை நாட்களை நீர் குறைத்துவிட்டீர்;

    அவனை அவமானத்தால் மூடிவிட்டீர்.[a]

    சேலா'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன்மேல் அவமானத்தைப் போர்த்திவிட்டீர்.”
    reason: עטה என்பதற்கு மூடுதல் மட்டுமல்லாமல் போர்த்துதல் அல்லது ஆடையாக உடுத்துதல் என்ற பொருளும் இருக்கலாம்; மாற்று உருவகத்தைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: הִקְצַרְתָּ
  choice: நீர் குறைத்துவிட்டீர்
  rationale: குறுகச் செய்தல் அல்லது குறைத்தல் என்ற ஹிஃபில் வினையின் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; நிறைவுற்ற செயலின் தற்போதைய விளைவையும் உணர்த்துகிறது.
- source_word: יְמֵי
  choice: நாட்களை
  rationale: வாழ்வின் ஒரு காலப்பகுதியைக் குறிக்கும் எபிரெயச் சொற்றொடரின் 'நாட்கள்' என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: עֲלוּמָיו
  choice: அவனுடைய இளமை
  rationale: இளமைப் பருவத்தை நேரடியாகக் குறிக்கிறது; 'இளமை வலிமை' போன்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: הֶעֱטִיתָ
  choice: மூடிவிட்டீர்
  rationale: மூடுதல், போர்த்துதல், உடுத்துவித்தல் ஆகிய பொருள் வாய்ப்புகளில், அவமானம் ஒருவனை முழுவதும் சூழ்வதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָלָיו
  choice: அவனை
  rationale: சொல்லுக்கு சொல் 'அவன்மேல்' எனினும், 'அவனை அவமானத்தால் மூடுதல்' என்பது தமிழில் இயல்பான தொடராக இருப்பதால் முன்னிலையின் பொருள் வினைத் தொடருக்குள் காக்கப்படுகிறது.
- source_word: בּוּשָׁה
  choice: அவமானம்
  rationale: வெட்கம், இகழ்ச்சி, அவமதிப்பு ஆகியவற்றை உள்ளடக்கும் இச்சூழலின் பொது பொருளைத் தெளிவாகத் தருகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: துல்லியமான வழிபாட்டு அல்லது இசைச் செயல்பாடு உறுதியற்றதால், பொருள் நிர்ணயிக்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதிகளின் சுட்டுப்பொருள்
  choice: '''அவனுடைய'', ''அவனை'' என்று ஆண்பால் ஒருமையை மட்டும் தக்கவைத்தல்'
  alternative: தாவீதிய அரசன், தாவீதிய வம்சம், அல்லது உருவகப்படுத்தப்பட்ட அபிஷேகம் பெற்றவர் என்று வெளிப்படையாக அடையாளப்படுத்துதல்
  rationale: சங்கீதத்தின் சூழல் அவமானப்படுத்தப்பட்ட அபிஷேகம் பெற்ற அரசன் அல்லது வம்சத்தைச் சுட்டினாலும், இவ்வசனம் பெயரைக் குறிப்பிடாமல் ஆண்பால் ஒருமை விகுதிகளையே பயன்படுத்துகிறது. ஆகவே மூலத்தின் கவித்துவ மற்றும் இறையியல் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழில் இறைவனை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரண்டு இணையான அடிகளும் தனித்த வரிகளாக வைக்கப்பட்டுள்ளன; 'சேலா' விளக்கமின்றி ஒலிபெயர்க்கப்பட்டுள்ளது.
