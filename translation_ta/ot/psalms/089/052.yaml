id: PSA.89.52
reference: Psalms 89:52
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בָּר֖וּךְ יְהוָ֥ה לְ֝/עוֹלָ֗ם אָ֘מֵ֥ן וְ/אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/052.yaml
  text: Blessed be Yahweh forever[a]. Amen and amen.
translation:
  language: ta
  text: யாவே என்றென்றும் போற்றப்படுவாராக! ஆமென், ஆமென்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: இது வழிபாட்டில் பயன்படுத்தப்படும் வாழ்த்துரை/துதிப்புரை. சொற்சொல்லாக ‘ஆசீர்வதிக்கப்பட்டவர்’ என்பது தமிழில் இங்கு இயல்பற்றதாகவும் பொருள் குழப்புவதாகவும் இருக்கும்; ‘போற்றப்படுவாராக’ என்பது எபிரெய வடிவத்தின் துதிசார் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துப் பெயர்; ஆகவே அதை ‘ஆண்டவர்’ என்று மாற்றாமல் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலத்தைக் குறிக்கும் இச்சொற்றொடருக்கு இயல்பான, வழிபாட்டு நடைக்கு ஏற்ற நவீனத் தமிழ் இணை.
- source_word: אָמֵן וְאָמֵן
  choice: ஆமென், ஆமென்
  rationale: வழிபாட்டுச் சூழலையும் வலியுறுத்தும் இரட்டிப்பையும் காக்க, மரபாக நிலைபெற்ற ‘ஆமென்’ அப்படியே இருமுறை வழங்கப்பட்டுள்ளது; எபிரெய இணைப்புச்சொல் தமிழின் இயல்பான நிறுத்தற்குறியால் வெளிப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூல உரை தேவனுடைய தனிப்பெயரையே நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் அதை மாற்றாமல், பொதுவாக ஏற்கப்படும் ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என்று வழங்குவது மூலத்தின் வேறுபாட்டைக் காக்கிறது.
- issue: בָּרוּךְ என்பதன் துதிசார் பொருள்
  choice: போற்றப்படுவாராக
  alternative: ஆசீர்வதிக்கப்பட்டவராக இருப்பாராக
  rationale: தேவனை நோக்கிய இந்த வழிபாட்டு வாய்பாட்டில் மனிதருக்கு வழங்கப்படும் ஆசீர்வாதம் என்ற எண்ணத்தை வரவழைக்காமல், அவரைத் துதித்து மேன்மைப்படுத்தும் செயல்பாட்டை இயல்பான தமிழில் தெரிவிக்கிறது.
translation_notes:
  register: சங்கீத நூலின் நிறைவு வாழ்த்துரைக்கு ஏற்ற சுருக்கமான, கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. சாதாரண வாசகருக்குப் புரியும் நவீனத் தமிழாக இருந்தாலும், துதிப்பாட்டின் உயர்வும் ‘ஆமென்’ என்ற இரட்டிப்பு வலியுறுத்தலும் காக்கப்பட்டுள்ளன. ஆங்கில ஆலோசனை உரையிலுள்ள [a] குறிப்பு உண்மையான மாற்று வாசிப்பை வழங்காமல் அதே வாசகத்தையே மீண்டும் கூறுவதால், மூல எபிரெய உரையில் ஆதாரமில்லாத அந்தக் குறிப்பு சேர்க்கப்படவில்லை.
