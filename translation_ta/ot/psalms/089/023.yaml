source:
  edition: WLC
  text: וְ/כַתּוֹתִ֣י מִ/פָּנָ֣י/ו צָרָ֑י/ו וּ/מְשַׂנְאָ֥י/ו אֶגּֽוֹף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/023.yaml
  text: And I will crush his adversaries before him[b][a], and strike down those who hate him.
translation:
  language: ta
  text: அவனுக்கு முன்பாக[a] அவனுடைய எதிரிகளை நொறுக்குவேன்; அவனை வெறுப்பவர்களைத் தாக்கி வீழ்த்துவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனுடைய முன்னிலையிலிருந்து”; எதிரிகளை அவனுடைய முன்னிலையிலிருந்து அகற்றுவதை எபிரெய மொழியமைப்பு சொல்லுக்குச் சொல் இவ்வாறு குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அடிப்பேன்” அல்லது “வாதையால் தாக்குவேன்”; எபிரெய வினை போரிலோ தீர்ப்பிலோ வலிமையாகத் தாக்குவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַתּוֹתִי
  choice: நொறுக்குவேன்
  rationale: כתת என்ற வினை வலிமையாக முறியடிப்பதைக் குறிக்கிறது. இங்குள்ள இறை வாக்குறுதியின் தொடரில் இறந்தகால வடிவம் எதிர்காலப் பொருளுடன் வருகிறது; ‘நொறுக்குவேன்’ அதன் வலுவான போரியல் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: מִפָּנָיו
  choice: அவனுக்கு முன்பாக
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய முகத்துக்கு முன்பிருந்து’ என்பதாகும். எதிரிகள் அரசனுக்கு முன்னால் அகற்றப்பட்டு முறியடிக்கப்படுவதை ‘அவனுக்கு முன்பாக’ என்பது இயல்பாகத் தெரிவிக்கிறது; மூல மொழியின் ‘இருந்து’ கூறு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: צָרָיו
  choice: அவனுடைய எதிரிகள்
  rationale: צר என்பது பகைமையுடன் எதிர்த்து நிற்பவர்களைக் குறிக்கிறது. அடுத்த அடியில் வரும் ‘அவனை வெறுப்பவர்கள்’ என்பதிலிருந்து சொல் வேறுபாட்டைத் தக்கவைத்தபடி, ‘எதிரிகள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: וּמְשַׂנְאָיו
  choice: அவனை வெறுப்பவர்கள்
  rationale: שׂנא என்பதன் பங்கேற்பு வடிவம் தொடர்ச்சியான அல்லது குணவியல்பான வெறுப்பைக் காட்டுகிறது. பெயர்ச்சொல் வடிவை விட இந்த வினைசார் மொழியாக்கம் இயல்பாகவும் மூலத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: אֶגּוֹף
  choice: தாக்கி வீழ்த்துவேன்
  rationale: נגף என்பது போரிலோ தீர்ப்பிலோ வலிமையாகத் தாக்குதல், முறியடித்தல் அல்லது வாதித்தல் ஆகிய பொருள்களை ஏற்கலாம். ‘தாக்கி வீழ்த்துவேன்’ இச்சூழலின் போரியல் இணைநிலையையும் தீர்மானமான தோல்வியையும் தெளிவாகக் காட்டுகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: தாவீதிய அரசனுக்கான உடன்படிக்கை வாக்குறுதியில் இறைவனின் போர்வீரச் செயல்
  choice: அரசனுக்காக அவனுடைய எதிரிகளை இறைவன் நேரடியாகவும் வலிமையாகவும் முறியடிப்பதாக உள்ள போரியல் மொழியைத் தக்கவைத்தல்
  alternative: பொதுவாக ‘தோற்கடிப்பேன்’ அல்லது ‘மேற்கொள்வேன்’ என்று மென்மையாக்குதல்
  rationale: இரு எபிரெய வினைகளும் வலுவான நேரடிச் செயலைக் குறிக்கின்றன. அவற்றை மென்மையாக்காமல் மொழிபெயர்ப்பது அரச மற்றும் உடன்படிக்கைச் சூழலைப் பாதுகாக்கிறது; அதேவேளையில் பிற்காலக் கோட்பாட்டுச் சிறப்புரைகளை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு இணை அடிகளின் சொல் வேறுபாடும் வலுவான போரியல் உருவகமும் பாதுகாக்கப்பட்டுள்ளன; பழமையான ‘சங்கரிப்பேன்’ போன்ற சொற்கள் தவிர்க்கப்பட்டுள்ளன.
