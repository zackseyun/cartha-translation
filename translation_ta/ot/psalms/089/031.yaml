  text: אִם חֻקֹּתַ֥/י יְחַלֵּ֑לוּ וּ֝/מִצְוֺתַ֗/י לֹ֣א יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/031.yaml
  text: If they profane my statutes and do not keep my commandments,[a]
translation:
  language: ta
  text: என் நியமங்களைப் புனிதமற்றவைகளாக நடத்தி, என் கட்டளைகளைக் கடைப்பிடிக்காமல் போனால்,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நியமங்களை மீறி.” எபிரெய வினைச்சொல் புனிதமானதைத் தீட்டுப்படுத்துவது அல்லது சாதாரணமானதாக நடத்துவது என்ற பொருளையும் தரலாம்; பிரதான உரை அதன் வலுவான பொருளைக் காக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: போனால்
  rationale: இது நிபந்தனையை அறிமுகப்படுத்தும் இடைச்சொல். தமிழில் தொடரின் இறுதியில் வரும் ‘போனால்’ இயல்பாகவும், நிகழ்வு உறுதி எனக் காட்டாமல் நிபந்தனைப் பொருளையும் காக்கிறது.
- source_word: חֻקֹּתַי
  choice: என் நியமங்களை
  rationale: חֻקָּה என்பது விதிக்கப்பட்ட சட்டங்கள் அல்லது நியமங்களைக் குறிக்கிறது. ‘நியமங்கள்’ உயர்ந்த சட்ட/உடன்படிக்கைச் சூழலுக்குப் பொருந்துவதோடு, அடுத்துள்ள ‘கட்டளைகள்’ என்பதிலிருந்தும் வேறுபாட்டைக் காக்கிறது.
- source_word: יְחַלֵּלוּ
  choice: பரிசுத்தக்குலைவு செய்து
  rationale: חלל என்பதன் பியேல் வடிவம் பரிசுத்தமானதைத் தீட்டுப்படுத்துதல், அதன் பரிசுத்தத் தன்மையை அவமதித்தல் என்ற வலுவான பொருளைக் கொண்டது. ‘மீறி’ என்பதைவிட ‘பரிசுத்தக்குலைவு செய்து’ மூலத்தின் மத/உடன்படிக்கை சார்ந்த வலிமையைத் தெளிவாகக் காக்கிறது.
- source_word: וּמִצְוֺתַי
  choice: என் கட்டளைகளைக்
  rationale: מִצְוָה என்பதற்கு ‘கட்டளை’ இயல்பானவும் துல்லியமானவும் உள்ள தமிழ் இணை; இது ‘நியமங்கள்’ என்பதுடனான இணைநிலையையும் சொல்வேறுபாட்டையும் காக்கிறது.
- source_word: לֹא
  choice: -ஆமல்
  rationale: எதிர்மறையைத் தமிழின் இயல்பான வினையெச்ச அமைப்பில் ‘கடைப்பிடிக்காமல்’ என வெளிப்படுத்துகிறது.
- source_word: יִשְׁמֹרוּ
  choice: கடைப்பிடிக்க
  rationale: சட்ட/உடன்படிக்கைச் சூழலில் שׁמר என்பது கட்டளைகளைக் காத்து நடத்தல் அல்லது அனுசரித்தல் என்று பொருள்படும். நவீன தமிழில் ‘கடைப்பிடிக்க’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: חלל என்ற வினைச்சொல் நியமங்களுக்கு எதிரான குற்றத்தின் வலிமையை எவ்வாறு வெளிப்படுத்துவது
  choice: ‘பரிசுத்தக்குலைவு செய்து’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என் நியமங்களை மீறி’ அல்லது ‘தீட்டுப்படுத்தி’
  rationale: பியேல் வடிவிலுள்ள எபிரெயச் சொல் வெறும் கீழ்ப்படியாமையை மட்டும் அல்லாமல், பரிசுத்தமாகக் கருதப்பட வேண்டியவற்றை இழிவாக அல்லது சாதாரணமாக நடத்தும் பொருளையும் தருகிறது. பிரதான உரை அந்த வலிமையைக் காக்கிறது; பொதுவான சூழற்பொருளான ‘மீறி’ அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பரிசுத்தக்குலைவு’ வழக்குப் பேச்சில் அரிதானதாயினும், இங்கு மூல எபிரெயச் சொல்லின் வலுவான பரிசுத்தம் சார்ந்த பொருளைக் காக்கத் தேர்ந்தெடுக்கப்பட்டது; அடிக்குறிப்பு எளிய சூழற்பொருளை வழங்குகிறது.
