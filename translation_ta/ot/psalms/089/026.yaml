source:
  edition: WLC
  text: ה֣וּא יִ֭קְרָאֵ/נִי אָ֣בִ/י אָ֑תָּה אֵ֝לִ֗/י וְ/צ֣וּר יְשׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/026.yaml
  text: He will call to me[a], ‘You are my Father, my God, and the rock of my salvation.’
translation:
  language: ta
  text: அவன் என்னை நோக்கி, “நீரே என் தந்தை, என் கடவுள், என் மீட்பின் பாறை” என்று கூப்பிடுவான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் என்னை அழைப்பான்”; அல்லது, “அவன் என்னை நோக்கிக் கூக்குரலிடுவான்.” எபிரெய வினைச்சொல், குறிப்பாக வேண்டுதலில், அழைத்துக் கூப்பிடுதல் அல்லது கூக்குரலிடுதல் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: அவன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் எபிரெயத்தில் வலியுறுத்தலுடன் வெளிப்படையாக இருப்பதால் தமிழிலும் தக்கவைக்கப்பட்டது.
- source_word: יִקְרָאֵנִי
  choice: என்னை நோக்கிக் கூப்பிடுவான்
  rationale: קרא என்பது ‘அழை’ அல்லது ‘கூப்பிடு/கூக்குரலிடு’ என்று பொருள்படலாம். இங்கு கடவுளை நோக்கிய நேரடி வேண்டுதலாக இருப்பதால், முதலாம் நபர் ஒருமை விகுதியின் தொடர்பையும் அழைத்துக் கூப்பிடும் நுண்ணுணர்வையும் இயல்பான தமிழில் இச்சொற்றொடர் தருகிறது.
- source_word: אָבִי
  choice: என் தந்தை
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியுள்ள பெயர்ச்சொல்; கடவுளை நேரடியாக உறவுமுறைப்படி அழைப்பதைத் தெளிவாகக் காட்டுகிறது.
- source_word: אָתָּה
  choice: நீரே
  rationale: எபிரெயத்தில் சுட்டுப்பெயர் வெளிப்படையாக உள்ளது. தமிழில் ‘நீரே’ என்பது நேரடி அழைப்பையும் வலியுறுத்தலையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵלִי
  choice: என் கடவுள்
  rationale: אֵל என்பதற்கு ‘கடவுள்’ அல்லது ‘வல்லவர்’ என்ற பொருள் இருக்கலாம்; இச்சூழலில் அது கடவுளையே குறிக்கும் என்பதால் ‘என் கடவுள்’ தெளிவான தேர்வு.
- source_word: וְצוּר
  choice: என் ... பாறை
  rationale: צוּר என்பதன் நேர்ப்பொருள் ‘பாறை’; வலிமை, பாதுகாப்பு ஆகியவற்றுக்கான உருவகம். எபிரெயத்தில் ‘பாறை’ என்பதற்குத் தனி உடைமை விகுதி இல்லாவிட்டாலும், தொடர்ந்துவரும் ‘என் மீட்பின்’ என்ற அமைப்பு தமிழில் இயல்பாக ‘என் மீட்பின் பாறை’ என அமைகிறது.
- source_word: יְשׁוּעָתִי
  choice: என் மீட்பின்
  rationale: יְשׁוּעָה என்பது மீட்பு, விடுதலை, இரட்சிப்பு ஆகிய பொருட்களைத் தருகிறது. ‘மீட்பு’ என்பது இங்கு இயல்பான நவீனத் தமிழில் பொருளைத் தருவதோடு, ‘பாறை’ என்பதுடனான எபிரெயக் கட்டமைப்பையும் காக்கிறது.
theological_decisions:
- issue: அரச/மேசியா சார்ந்த சூழலில் கடவுளைத் ‘தந்தை’ என்று அழைத்தல்
  choice: ‘நீரே என் தந்தை, என் கடவுள், என் மீட்பின் பாறை’ எனக் கடவுளை நோக்கிய நேரடி அழைப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: இதை இறைத் தலைப்பாகத் தோன்றாதபடி மங்கலாக்குதல், அல்லது இறையியல் நிறையற்ற அரசவைக் மிகைக்கூற்றாக மட்டும் விளக்குதல்.
  rationale: சங்கீதம் 89 தாவீதிய அரசனையும் உடன்படிக்கையையும் பற்றியது; ஆனால் இவ்வசனம் உறவையும் உடன்படிக்கையையும் உணர்த்தும் மொழியில் கடவுளை நேரடியாக அழைக்கிறது. பின்னாளைய கோட்பாட்டு முடிவுகளைச் சொற்களுக்குள் புகுத்தாமல் அந்த இறையியல் அழுத்தம் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையைக் கையாளுகிறது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் ‘நீரே’ பயன்படுத்தப்பட்டு, எபிரெயத்தின் வலியுறுத்தல் இயல்பாகக் காக்கப்பட்டுள்ளது; ‘பாறை’ என்ற மூல உருவகமும் அப்படியே வைக்கப்பட்டுள்ளது.
