  text: 'I have made a covenant with my chosen one[a]; I have sworn to David my servant:'
translation:
  language: ta
  text: “என் தேர்ந்தெடுத்தவனுடன் ஓர் உடன்படிக்கை செய்திருக்கிறேன்[a]; என் ஊழியனாகிய தாவீதுக்கு நான் சத்தியம் செய்திருக்கிறேன்:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “என் தேர்ந்தெடுத்தவனுடன் ஓர் உடன்படிக்கையை வெட்டியிருக்கிறேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַתִּי
  choice: செய்திருக்கிறேன்
  rationale: כרת ברית என்பது சொற்சொல்லாக ‘உடன்படிக்கையை வெட்டுதல்’ என்றாலும், தமிழில் ‘உடன்படிக்கை செய்தல்’ என்பதே இயல்பான நிலையான மரபுத்தொடர். எபிரெய நிறைவுற்ற வினை இங்கு தொடரும் செல்லுபடியை உணர்த்துவதால் ‘செய்திருக்கிறேன்’ என வழங்கப்பட்டது.
- source_word: בְּרִית
  choice: ஓர் உடன்படிக்கை
  rationale: ברית என்பதன் உறவுசார், இறையியல் நிறையை ‘உடன்படிக்கை’ தக்கவைக்கிறது; ‘ஒப்பந்தம்’ என்பது இங்கு குறுகியதும் வணிகத் தன்மை கொண்டதுமாகத் தோன்றலாம்.
- source_word: לִבְחִירִי
  choice: நான் தேர்ந்தெடுத்தவனுடன்
  rationale: בחירי என்பதன் பொருளை நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் தெரிவிக்க வினைச்சொல் சார்ந்த வடிவம் பயன்படுத்தப்பட்டது. ברית உடனான ל இங்கு ‘உடன்’ எனப் பொருள்படுகிறது.
- source_word: נִשְׁבַּעְתִּי
  choice: நான் ஆணையிட்டிருக்கிறேன்
  rationale: שׁבע என்பதன் நிபால் வடிவம் ஆணையிடுதல் அல்லது சத்தியம் செய்தல் என்பதைக் குறிக்கிறது. ‘ஆணையிட்டிருக்கிறேன்’ அதன் பெருந்தன்மையையும் தொடரும் கட்டுப்பாட்டையும் இயல்பான தமிழில் தருகிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்கு
  rationale: נשבע என்பதற்குப் பின் வரும் ל, ஆணை யாருக்கு அளிக்கப்பட்டதோ அவரைக் குறிக்கிறது; ஆகவே ‘தாவீதுக்கு’ என்பது நேரடியான மொழிபெயர்ப்பு.
- source_word: עַבְדִּי
  choice: என் ஊழியனாகிய
  rationale: தாவீதின் அரச மற்றும் உடன்படிக்கைச் சூழலிலான நிலையை ‘ஊழியன்’ பொருத்தமாகக் குறிக்கிறது; ‘அடிமை’ இவ்வசனத்தில் முன்னிலையிலில்லாத கட்டுண்ட நிலையைக் கூடுதலாக வலியுறுத்தும்.
theological_decisions:
- issue: ‘நான் தேர்ந்தெடுத்தவன்’ என்பவரின் அடையாளம்
  choice: உடனடிச் சூழலில் தாவீதையே குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
  alternative: தாவீதைக் கடந்த நேரடி மேசியா அடையாளத்தை மொழிபெயர்ப்பிலேயே வெளிப்படுத்துதல்.
  rationale: இணையான அடுத்த சொற்றொடர் ‘என் ஊழியனாகிய தாவீது’ என்று கூறுவதால், வசனத்தின் வெளிப்படையான குறிப்பு தாவீதே. இதற்கு அப்பாற்பட்ட மாதிரிவழி அல்லது மேசியா சார்ந்த வாசிப்பு விளக்கவுரைக்குரியது; மொழிபெயர்ப்பில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. தெய்வீக நேரடிப் பேச்சின் நிறைவுற்ற செயல்களுக்கும் அவற்றின் தொடரும் வலிமைக்கும் ‘செய்திருக்கிறேன்’, ‘ஆணையிட்டிருக்கிறேன்’ ஆகிய வடிவங்கள் பயன்படுத்தப்பட்டன. வசனம் அடுத்த வரியில் தொடர்வதைச் சுட்ட இரட்டைப் புள்ளி வைக்கப்பட்டது.
