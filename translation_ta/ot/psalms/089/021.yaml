  text: אֲשֶׁ֣ר יָ֭דִ/י תִּכּ֣וֹן עִמּ֑/וֹ אַף זְרוֹעִ֥/י תְאַמְּצֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/021.yaml
  text: with whom my hand will be established[a]; indeed[c][b], my arm will strengthen him.
translation:
  language: ta
  text: அவனோடு என் கை உறுதியாக நிலைத்திருக்கும்[a]; மேலும், என் புயம்[b] அவனைப் பலப்படுத்தும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவனோடு என் கை உறுதிப்படுத்தப்படும்.”
    reason: lexical_alternative
  - marker: b
    text: “புயம்” என்பது வலிமையையும் அதிகாரத்தையும் குறிக்கும் கவிதைப் படிமம்.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר ... עִמּוֹ
  choice: அவனோடு
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட தேர்ந்தெடுக்கப்பட்ட அரசனைத் தொடர்புபடுத்தும் உறவுத்தொடரையும், עִמּוֹ என்பதன் ‘அவனோடு’ என்ற பொருளையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: יָדִי
  choice: என் கை
  rationale: தேவனுடைய செயல்வல்லமையையும் ஆதரவையும் குறிக்கும் எபிரெயக் கவிதைப் படிமத்தைச் சுருக்கிப் பொருளுரைக்காமல் அப்படியே காக்கிறது.
- source_word: תִּכּוֹן
  choice: உறுதியாக நிலைத்திருக்கும்
  rationale: כון என்பதன் நிஃபால் வடிவம் நிலைபெறுதல் அல்லது உறுதியாக இருத்தல் என்ற பொருளைக் கொண்டது. ‘உறுதியாக நிலைத்திருக்கும்’ என்பது அதன் விளைவுநிலையையும் வாக்குறுதி சார்ந்த எதிர்காலத் தன்மையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַף
  choice: ஆம்
  rationale: இரண்டாம் கவிதை அடியை வலியுறுத்தித் தொடரும் சொல்லாக இங்கு வருகிறது; ‘ஆம்’ அதன் உறுதிப்படுத்தும் வலிமையைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: זְרוֹעִי
  choice: என் புயம்
  rationale: வலிமை மற்றும் அதிகாரத்தைக் குறிக்கும் உடல் சார்ந்த கவிதைப் படிமத்தைப் பாதுகாக்கிறது; ‘கை’ என்பதுடனான இணை அமைப்பையும் வேறுபாட்டுடன் காட்டுகிறது.
- source_word: תְאַמְּצֶנּוּ
  choice: அவனைப் பலப்படுத்தும்
  rationale: אמץ என்பதன் பிஏல் வடிவம் ஒருவரை வலிமையாக்குதல் என்ற காரணவினைப் பொருளைத் தருகிறது; இந்தத் தேர்வு அதனைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: தேவனுடைய செயலுக்கான மனித உடல் உறுப்புப் படிமங்கள்
  choice: ‘என் கை’, ‘என் புயம்’ என்ற படிமங்களைத் தக்கவைத்தல்
  alternative: ‘என் வல்லமை’, ‘என் பலம்’ என்று கருத்துரைத்தல்
  rationale: மூல எபிரெயம் தேவன் தாவீதிய அரசனைத் தாங்கும் வல்லமையை உடல் உறுப்புப் படிமங்களால் கூறுகிறது. அவற்றை அருவமான சொற்களாக மாற்றாமல் வைத்திருப்பது கவிதைத் தன்மையையும் இறையியல் நுட்பத்தையும் காக்கிறது.
- issue: எதிர்கால வாக்குறுதியா அல்லது பொதுவான நிகழ்கால உண்மையா
  choice: ‘நிலைத்திருக்கும்’, ‘பலப்படுத்தும்’ என எதிர்கால வாக்குறுதியாக மொழிபெயர்த்தல்
  alternative: ‘நிலைத்திருக்கிறது’, ‘பலப்படுத்துகிறது’ என நிகழ்காலமாக மொழிபெயர்த்தல்
  rationale: இந்த உடன்படிக்கைச் சூழலில் எபிரெய நிறைவுறா வினைகள் தேவன் தொடர்ந்து நிறைவேற்றவிருக்கும் உறுதியான ஆதரவை வெளிப்படுத்துகின்றன; தமிழ் எதிர்கால வடிவம் அந்த வாக்குறுதித் தன்மையை நன்றாகக் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘புயம்’ கவிதை நடைக்கு ஏற்றதாயிருந்தும் பொதுவாகப் புரிந்துகொள்ளக்கூடியதாக உள்ளது; மூலத்தின் ‘கை/புயம்’ இணை அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
