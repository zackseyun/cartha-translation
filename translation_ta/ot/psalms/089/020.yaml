  text: I have found David my servant[a]; with my holy oil I have anointed him.
translation:
  language: ta
  text: என் ஊழியனாகிய தாவீதை நான் கண்டேன்[a]; என் பரிசுத்த எண்ணெயால் அவனை அபிஷேகம் செய்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் ஊழியனாகிய தாவீதை நான் கண்டிருக்கிறேன்; என் பரிசுத்த எண்ணெயால் அவனை அபிஷேகம் செய்திருக்கிறேன்.” எபிரெய நிறைவுவினை வடிவங்களைத் தமிழில் இவ்வாறும் மொழிபெயர்க்கலாம்.
