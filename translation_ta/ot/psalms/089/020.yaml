lexical_decisions:
- source_word: מָצָאתִי
  choice: கண்டடைந்தேன்
  rationale: מצא என்பதன் Qal perfect 1cs வடிவம். இறைவனின் நிறைவேறிய தேர்ந்தெடுக்கும் செயலை இயல்பான தமிழில் ‘கண்டடைந்தேன்’ எனத் தருகிறது; ‘கண்டேன்’ என்பதும் சாத்தியம்.
- source_word: דָּוִד עַבְדִּי
  choice: என் பணியாளனாகிய தாவீது
  rationale: עבד இங்கு அடிமை நிலையைக் காட்டுவதைவிட அரச உடன்படிக்கைச் சூழலில் இறைவனுக்குப் பணிபுரிபவர் என்ற மதிப்புமிக்க அடையாளமாக உள்ளது. ஆகவே ‘பணியாளன்’ பொருத்தமானது.
- source_word: בְּשֶׁמֶן קָדְשִׁי
  choice: என் பரிசுத்த எண்ணெயால்
  rationale: משח உடன் வரும் ב அபிஷேகத்திற்குப் பயன்படுத்தப்படும் கருவி/பொருளைக் குறிக்கிறது; தமிழில் ‘எண்ணெயால்’ இயல்பானது. קדשׁ என்பதன் இறைவனுக்கெனப் பிரித்துவைக்கப்பட்ட தன்மையை ‘பரிசுத்த’ காக்கிறது.
- source_word: מְשַׁחְתִּיו
  choice: அவனை அபிஷேகம் செய்தேன்
  rationale: משח என்பதன் Qal perfect 1cs மற்றும் 3ms பின்னொட்டு. அரசராக அர்ப்பணித்து நியமிக்கும் எண்ணெய்பூசும் செயலை ‘அபிஷேகம் செய்தேன்’ துல்லியமாகவும் வழக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: தாவீதின் அரச அபிஷேகமும் சாத்தியமான மேசியத் தொடர்பும்
  choice: தாவீதைக் குறித்த வரலாற்றுச் சொல்லை மட்டும் நேரடியாகத் தக்கவைத்தல்
  alternative: மேசியா அல்லது அபிஷேகம் பெற்றவர் என்ற typological பொருளை மொழிபெயர்ப்பிலேயே வெளிப்படையாகச் சேர்த்தல்
  rationale: எபிரெய உரை தாவீதைப் பெயரிட்டு, அவன் அபிஷேகம் செய்யப்பட்டதைச் சொல்கிறது. விரிவான வேதாகமத் தொடர்புகள் இருந்தாலும், அவற்றை இந்த வசனத்தின் மொழிபெயர்ப்புக்குள் சேர்ப்பது மூலத்தை மீறும்.
translation_notes:
  register: நவீன செந்தமிழும் பொதுவான வேதாகமச் சொல்லாட்சியும் இணைந்த கண்ணியமான நடை. ‘பணியாளன்’ என்பது ‘ஊழியன்’ என்பதைக் காட்டிலும் இன்றைய வாசகருக்கு நேரடியானது; ‘அபிஷேகம்’ அரச நியமனச் சூழலைத் தெளிவாகக் காக்கிறது.
