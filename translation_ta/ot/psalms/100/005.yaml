  text: כִּי ט֣וֹב יְ֭הֹוָה לְ/עוֹלָ֣ם חַסְדּ֑/וֹ וְ/עַד דֹּ֥ר וָ֝/דֹ֗ר אֱמוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/005.yaml
  text: For Yahweh is good[a]; his steadfast love is forever[d][c][b], and his faithfulness endures from generation to generation.
translation:
  language: ta
  text: ஏனெனில், யாவே நல்லவர்; அவருடைய மாறாத அன்பு என்றென்றும் நிலைத்திருக்கும்[a]; அவருடைய நம்பகத்தன்மை தலைமுறை தலைமுறையாக நீடிக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மாறாத அன்பு” என்பதற்கான எபிரேயச் சொல் இரக்கம், பற்றுறுதி, உண்மையுள்ள அன்பு ஆகிய பொருள் நிழல்களையும் கொண்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சங்கீதத்தின் முந்தைய அழைப்புகளுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: טוֹב
  choice: நல்லவர்
  rationale: யாவேயின் நற்குணத்தையும் நன்மை செய்வதையும் உள்ளடக்கும் பரந்த பொருளை நேரடியாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்க்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும் நிலைத்திருக்கும்
  rationale: நீடித்த காலத்தைத் தெளிவாகக் காட்டுகிறது; எபிரெயத்தில் விடுபட்டுள்ள இணைப்பை தமிழின் இயல்புக்காக வினைச்சொல்லால் வெளிப்படுத்துகிறது.
- source_word: חַסְדּוֹ
  choice: அவருடைய மாறாத அன்பு
  rationale: חֶסֶד என்பதிலுள்ள அன்பு, இரக்கம், உறுதியான பற்றுறுதி ஆகிய நிழற்பொருள்களை மிகையாகக் குறுக்காமல் தெரிவிக்கிறது.
- source_word: וְעַד דֹּר וָדֹר
  choice: தலைமுறை தலைமுறையாக நீடிக்கும்
  rationale: அடுத்தடுத்த தலைமுறைகள் முழுவதும் தொடரும் காலப்பொருளையும், எபிரெய மறுபடியுரைத்தலின் வலியுறுத்தலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: אֱמוּנָתוֹ
  choice: அவருடைய உண்மைத்தன்மை
  rationale: உறுதி, நம்பகத்தன்மை, விசுவாசமாய் இருப்பது ஆகிய பொருள்களை இங்கு இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறைப்பெயரைப் பட்டப்பெயராக மாற்றாமல் காக்கிறது.
- issue: חֶסֶד என்பதன் உடன்படிக்கை சார்ந்த நிழற்பொருள்
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கைப் பற்றுறுதி / இரக்கம்
  rationale: ஒரே கோட்பாட்டு விளக்கத்துக்குள் பொருளைக் குறுக்காமல், நிலையான அன்பையும் பற்றுறுதியையும் முதன்மைப்படுத்துகிறது.
- issue: வினையில்லா எபிரெய இணை அமைப்பு
  choice: இரு அரையடிகளிலும் ‘நிலைத்திருக்கும்/நீடிக்கும்’ என வெளிப்படுத்துதல்
  alternative: ‘அவருடைய மாறாத அன்பு என்றென்றும்; அவருடைய உண்மைத்தன்மை தலைமுறை தலைமுறைக்கும்’
  rationale: மூலத்தின் காலநீடிப்பு பொருளைக் காத்தபடி, நவீன தமிழில் முழுமையானதும் இயல்பானதுமான வாக்கியத்தை வழங்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. கவிதைநடையின் இணை அமைப்பு ‘என்றென்றும்’ மற்றும் ‘தலைமுறை தலைமுறையாக’ என்பவற்றால் நிலைநிறுத்தப்பட்டுள்ளது.
