  text: בֹּ֤אוּ שְׁעָרָ֨י/ו בְּ/תוֹדָ֗ה חֲצֵרֹתָ֥י/ו בִּ/תְהִלָּ֑ה הֽוֹדוּ ל֝֗/וֹ בָּרֲכ֥וּ שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/004.yaml
  text: Enter his gates with thanksgiving[a], his courts with praise; give thanks to him; bless his name.
translation:
  language: ta
  text: 'நன்றியோடு[a] அவருடைய வாசல்களுக்குள் நுழையுங்கள்;

    துதியோடு அவருடைய முற்றங்களுக்குள்;

    அவருக்கு நன்றி செலுத்துங்கள்;

    அவருடைய பெயரைப் போற்றுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்றிப் பலியோடு.” எபிரெயச் சொல் (בְּתוֹדָה) சூழலுக்கேற்ப நன்றியையோ நன்றிப் பலியையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: நுழையுங்கள் / வாருங்கள்
  rationale: בוא என்பது பன்மை ஏவல். வாசல்களுடன் ‘நுழையுங்கள்’ இயல்பானது; முற்றங்களுடன் இணையான இரண்டாம் வரியில் ‘வாருங்கள்’ தமிழில் இயல்பாக இருந்து, உள்ளே வரும் இயக்கத்தையும் காக்கிறது.
- source_word: שְׁעָרָיו
  choice: அவருடைய வாசல்கள்
  rationale: 3ஆம் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் ‘வாசல்கள்’; ஆலய வளாகத்திற்கான நுழைவிட உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: בְּתוֹדָה
  choice: நன்றியோடு
  rationale: תּוֹדָה இங்கு ‘நன்றி’ அல்லது ‘நன்றிப் பலி’ எனப் பொருள்படலாம். துதியுடன் அமைந்த இணைநிலை காரணமாக நன்றி செலுத்தும் மனப்பாங்கு முதன்மை உரையில் பொருத்தமாக உள்ளது; பலி என்ற வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: חֲצֵרֹתָיו
  choice: அவருடைய முற்றங்கள்
  rationale: ஆலயத்தின் முற்றங்கள் அல்லது வெளிப்பிரகாரங்களைக் குறிக்கிறது. ‘முற்றங்கள்’ என்பது இயல்பான நவீனத் தமிழில் இடவியல் உருவகத்தைத் தெளிவாகக் காக்கிறது.
- source_word: בִּתְהִלָּה
  choice: துதியோடு
  rationale: תְּהִלָּה என்பதன் ‘துதி’ பொருளையும், בְּ முன்னொட்டு காட்டும் உடன்நிலை அல்லது முறையையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: הוֹדוּ לוֹ
  choice: அவருக்கு நன்றி செலுத்துங்கள்
  rationale: வழிபாட்டுச் சூழலில் ידה என்பதன் ஹிஃபீல் வடிவம் நன்றி செலுத்துவதைச் சுட்டுகிறது. ‘நன்றி செலுத்துங்கள்’ என்பது தெளிவான, இயல்பான தமிழ்.
- source_word: בָּרֲכוּ
  choice: வாழ்த்துங்கள்
  rationale: ברך கடவுளுடைய பெயரை நோக்கிப் பயன்படுத்தப்படும்போது போற்றி வாழ்த்துதல் என்ற பொருள் தருகிறது. ‘ஆசீர்வதியுங்கள்’ என்ற தமிழ் சொல் மனிதன் கடவுளுக்கு வரம் அளிப்பது போன்ற தவறான இயல்புப் பொருளைத் தூண்டக்கூடும்; ‘வாழ்த்துங்கள்’ மூலத்தின் புகழ்ந்துரைக்கும் செயலைக் காக்கிறது.
- source_word: שְׁמוֹ
  choice: அவருடைய பெயர்
  rationale: எபிரெய வழிபாட்டு மொழியில் கடவுளின் வெளிப்பட்ட அடையாளத்தையும் புகழையும் குறிக்கும் ‘பெயர்’ என்ற சொல்லை விளக்கவுரை செய்யாமல் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: வாசல்கள் மற்றும் முற்றங்கள் குறிக்கும் வழிபாட்டு இட உருவகம்
  choice: ‘அவருடைய வாசல்கள்’, ‘அவருடைய முற்றங்கள்’ என்று நேரடியாக வைத்தல்
  alternative: ‘அவருடைய சந்நிதி’ அல்லது ‘அவருடைய ஆலயம்’ என்று பொதுமைப்படுத்தல்
  rationale: மூல எபிரெயம் புனித வளாகத்திற்குள் வழிபாட்டாளர்கள் நுழையும் படிமத்தைத் தெளிவாக முன்வைக்கிறது. அதை பொதுமைப்படுத்துவது மூலத்தில் இல்லாத இறையியல் விளக்கத்தைச் சேர்க்கும்.
- issue: בָּרֲכוּ שְׁמוֹ என்ற வழிபாட்டு மொழி
  choice: ‘அவருடைய பெயரை வாழ்த்துங்கள்’
  alternative: ‘அவருடைய பெயரை ஆசீர்வதியுங்கள்’ அல்லது ‘அவருடைய பெயரைத் துதியுங்கள்’
  rationale: ‘வாழ்த்துங்கள்’ என்பது கடவுளைப் போற்றிப் புகழ்ந்துரைப்பதைக் காட்டுகிறது; அதேவேளை முந்தைய ‘துதி’ என்ற சொல்லுடனான சொற்பொருள் வேறுபாட்டையும் இயன்றவரை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணைநிலை நான்கு குறு வரிகளால் வெளிப்படுத்தப்பட்டுள்ளது; ஆலய வாசல்கள் மற்றும் முற்றங்கள் பற்றிய நேரடி உருவகம் பாதுகாக்கப்பட்டுள்ளது.
