source:
  edition: WLC
  text: דְּע֗וּ כִּֽי יְהוָה֮ ה֤וּא אֱלֹ֫הִ֥ים הֽוּא עָ֭שָׂ/נוּ ו/לא אֲנַ֑חְנוּ עַ֝מּ֗/וֹ וְ/צֹ֣אן מַרְעִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/003.yaml
  text: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
translation:
  language: ta
  text: யாவேதான் கடவுள் என்பதை அறிந்துகொள்ளுங்கள். அவரே நம்மை உண்டாக்கினார்; நாமே நம்மை உண்டாக்கவில்லை.[a] நாம் அவருடைய மக்கள்; அவருடைய மேய்ச்சல் நிலத்தின் ஆடுகள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'பாரம்பரிய ஓர வாசகத்தின்படி: “அவரே நம்மை உண்டாக்கினார்; நாம் அவருக்குரியவர்கள்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּעוּ
  choice: அறிந்துகொள்ளுங்கள்
  rationale: ידע என்பதன் பன்மை ஏவல் வடிவம்; கேட்போர் இதை உறுதியான உண்மையாக அறிந்து ஏற்றுக்கொள்ளும்படி அழைக்கிறது. நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: כִּי
  choice: என்பதை
  rationale: அறிந்துகொள்ள வேண்டிய செய்தியை அறிமுகப்படுத்துகிறது; தமிழில் முந்தைய கருத்தை இயல்பாக நேரடி வினையின் பொருளாக்குகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் வழக்கமான தமிழாக்க ஒலிபெயர்ப்பாகப் பாதுகாக்கிறது.
- source_word: הוּא אֱלֹהִים
  choice: அவரே கடவுள்
  rationale: הוּא தரும் வலியுறுத்தலை ‘அவரே’ வெளிப்படுத்துகிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத கூடுதல் தனித்தன்மைக் கூற்றைச் சேர்க்கவில்லை.
- source_word: הוּא עָשָׂנוּ
  choice: அவரே நம்மை உண்டாக்கினார்
  rationale: சங்கீதத்தின் படைப்பு மற்றும் மக்களாக்குதல் சார்ந்த ஒப்புதலைத் தெளிவாகக் கூறுகிறது; ‘அவரே’ மூலத்தின் வலியுறுத்தலைத் தக்கவைக்கிறது.
- source_word: וְלֹא אֲנַחְנוּ
  choice: நாமே நம்மை உண்டாக்கிக்கொள்ளவில்லை
  rationale: எழுதப்பட்ட மசோரா வாசகமான לא (‘இல்லை/அல்ல’) என்பதன் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. எபிரெயத்தில் விடுபட்டுள்ள செயலை முந்தைய வினையிலிருந்து தமிழில் நிறைவு செய்கிறது.
- source_word: עַמּוֹ
  choice: அவருடைய மக்கள்
  rationale: கடவுளுக்குரிய உடன்படிக்கை மக்களைக் குறிக்கும் நேரடியான உடைமைத் தொடர்.
- source_word: וְצֹאן מַרְעִיתוֹ
  choice: அவருடைய மேய்ச்சல் நிலத்தின் ஆடுகள்
  rationale: צֹאן என்பதன் ஆட்டு மந்தை உருவகத்தையும் מַרְעִיתוֹ என்பதன் மேய்ச்சல் நிலப் படிமத்தையும் நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: நடுப்பகுதியில் உள்ள கெதீவ்/கெரே வேறுபாடு
  choice: முதன்மை உரை எழுதப்பட்ட வடிவமான לא என்பதைக் கொண்டு, ‘நாமே நம்மை உண்டாக்கிக்கொள்ளவில்லை’ என்று தருகிறது.
  alternative: பாரம்பரிய ஓர வாசகமான לו என்பதைக் கொண்டு, ‘அவரே நம்மை உண்டாக்கினார்; நாம் அவருக்குரியவர்கள்’ என்று வாசிக்கலாம்.
  rationale: மெய்யெழுத்து உரையின் לא இயல்பாக ‘இல்லை/அல்ல’ என்று பொருள்படும்; மசோரா ஓர வாசகமான לו ‘அவருக்குரியவர்கள்’ என்ற பொருளைத் தருகிறது. இரண்டும் பழமையான வாசிப்பு மரபில் முக்கியமானவை என்பதால், மூல உரைக்கு முன்னுரிமை கொடுத்து எழுதப்பட்ட வாசகம் முதன்மை உரையிலும், மற்ற வாசகம் அடிக்குறிப்பிலும் வைக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனைச் சுட்டும் இடங்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; எபிரெயத்தின் வலியுறுத்தல் ‘அவரே’, ‘நாமே’ என்பவற்றால் இயல்பாக வெளிப்படுத்தப்பட்டுள்ளது.
