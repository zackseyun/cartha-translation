- from: யாவே அவரே கடவுள் என்பதை அறிந்துகொள்ளுங்கள். அவரே நம்மை உண்டாக்கினார்; நாமே நம்மை உண்டாக்கிக்கொள்ளவில்லை.[a] நாம் அவருடைய மக்கள்; அவருடைய மேய்ச்சல் நிலத்தின் ஆடுகள்.
  to: யாவேதான் கடவுள் என்பதை அறிந்துகொள்ளுங்கள். அவரே நம்மை உண்டாக்கினார்; நாமே நம்மை உண்டாக்கவில்லை.[a] நாம் அவருடைய மக்கள்; அவருடைய மேய்ச்சல் நிலத்தின் ஆடுகள்.
  rationale: 'The revision makes two limited idiomatic corrections: it renders the emphatic clause as “யாவேதான் கடவுள்” and removes the potentially benefactive reflexive auxiliary from the ketiv clause. The main text still follows לֹא (“not”), and the traditional marginal לו (“his”) reading remains explicitly available at the existing footnote anchor.'
