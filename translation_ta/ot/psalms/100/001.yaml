  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: ta
  text: 'நன்றிசெலுத்துதலுக்கான சங்கீதம்.[a]


    பூமி முழுவதும், யாவேக்கு மகிழ்ச்சியோடு ஆர்ப்பரியுங்கள்!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நன்றிசெலுத்துதலுக்கான’ என்பது ‘நன்றிப்பலிக்கான’ அல்லது ‘நன்றிசெலுத்தும் சங்கீதம்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: சங்கீத நூலின் தலைப்புகளில் இசையுடன் பாடப்படும் பாடலைக் குறிக்கும் வழக்கமான சொல்லாதலால், தமிழில் நிலைபெற்றுள்ள ‘சங்கீதம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְתוֹדָה
  choice: நன்றிசெலுத்துதலுக்கான
  rationale: לְ என்ற முன்னொட்டின் ‘இதற்காக/இதனை நோக்கமாகக் கொண்ட’ என்ற வலுவை வெளிப்படுத்துகிறது. תּוֹדָה நன்றிசெலுத்துதல், துதி, அல்லது நன்றிப்பலி எனப் பொருள்படலாம்; பலிச் சூழலைத் தேவையின்றி உறுதிசெய்யாமல் பொதுவான பொருள் முதன்மை உரையில் வைக்கப்பட்டது.
- source_word: הָרִיעוּ
  choice: மகிழ்ச்சியுடன் ஆர்ப்பரியுங்கள்
  rationale: ரוע என்பதன் Hiphil கட்டளை வடிவம் உரத்த களிப்பொலியையோ வாழ்த்தொலியையோ எழுப்பும்படி அழைக்கிறது; ‘ஆர்ப்பரியுங்கள்’ அதன் ஒலி வலிமையையும் ‘மகிழ்ச்சியுடன்’ அதன் கொண்டாட்டத் தொனியையும் தருகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவை நோக்கி
  rationale: לְ இங்கு ஆர்ப்பரிப்பு யாரை நோக்கிச் செலுத்தப்படுகிறது என்பதைக் குறிக்கிறது. יהוה என்ற தனிப்பெயர் பொதுப்பட்டமாக மாற்றப்படாமல் தமிழில் பரவலாக அறியப்படும் ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டது.
- source_word: כָּל־הָאָרֶץ
  choice: பூமியெங்கும் உள்ளவர்களே
  rationale: சொல்லுக்குச் சொல் ‘பூமி முழுவதும்’ என்றாலும், உயிரற்ற நிலப்பரப்பை நேரடியாக அழைக்கும் எபிரேய உவமையை இயல்பான தமிழில் உலகமெங்குமுள்ள மக்களுக்கான அழைப்பாக வெளிப்படுத்துகிறது; உலகளாவிய பரப்பு காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே / கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக உள்ளது. அதை ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல் பெயராகவே வைத்தோம். தமிழ்க் கிறிஸ்தவ வாசகர்களிடையே பரவலாக அறியப்படும் ஒலிவடிவம் ‘யெகோவா’; ‘யாவே’ என்பது சாத்தியமான மற்றொரு ஒலிபெயர்ப்பு.
- issue: כָּל־הָאָרֶץ என்பதன் அழைப்புப் பொருள்
  choice: பூமியெங்கும் உள்ளவர்களே
  alternative: பூமி முழுவதுமே
  rationale: இலக்கணப்படி ‘பூமி முழுவதும்’ நேரடியாக அழைக்கப்படுகிறது. தமிழில் அழைப்பின் நடை இயல்பாக இருக்க மனித வாசகர்கள் வெளிப்படுத்தப்பட்டனர்; இதனால் உலகளாவிய வழிபாட்டு அழைப்பு தெளிவாகிறது, ஆனால் படைப்புலகை நோக்கிய கவித்துவ வாசிப்பும் சாத்தியமே.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டுக்கேற்ற கண்ணியமான நடையும் உரத்த அழைப்பின் கவித்துவ வலிமையும் காக்கப்பட்டுள்ளன. தலைப்பு தனியே வைக்கப்பட்டுள்ளது; மூலத்தின் சுருக்கத்தையும் தமிழின் இயல்பையும் சமநிலைப்படுத்தியுள்ளோம்.
