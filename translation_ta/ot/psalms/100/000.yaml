  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: ta
  text: 'நன்றிச் செலுத்துவதற்கான சங்கீதம்.[a]


    பூமியெங்கும் உள்ளவர்களே,[b] யாவேக்கு மகிழ்ச்சியுடன் ஆரவாரம் செய்யுங்கள்!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை “நன்றிப்பலிக்கான சங்கீதம்” அல்லது “நன்றியின் சங்கீதம்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “பூமி முழுவதும்”; பன்மை ஏவல் வினை பூமியின் மக்களை நோக்கி உரைக்கப்படுவதைச் சுட்டுகிறது.
    reason: literal_rendering
lexical_decisions:
- source_word: מִזְמוֹר לְתוֹדָה
  choice: நன்றிச் செலுத்துவதற்கான சங்கீதம்
  rationale: לְ என்ற முன்னொட்டு நோக்கம் அல்லது தொடர்பைக் குறிக்கலாம். இங்கு இயல்பான தமிழில் நன்றிச் செலுத்துவதற்குரிய சங்கீதம் என்ற பொருள் தரப்படுகிறது; பலிக்கான குறிப்பும் சாத்தியம் என்பதால் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הָרִיעוּ
  choice: மகிழ்ச்சியுடன் ஆரவாரம் செய்யுங்கள்
  rationale: இந்த வினை உரத்த வெற்றிக் குரல் அல்லது மகிழ்ச்சி ஆரவாரம் எழுப்புவதைக் குறிக்கிறது. சூழலில் வழிபாட்டு மகிழ்ச்சியை இயல்பாக வெளிப்படுத்தும் சொல்லாட்சி தேர்ந்தெடுக்கப்பட்டது.
- source_word: כָּל־הָאָרֶץ
  choice: பூமியெங்கும் உள்ளவர்களே
  rationale: எபிரெயச் சொற்றொடர் சொற்படியாக ‘பூமி முழுவதும்’ என இருந்தாலும், பன்மை ஏவல் வினையுடன் பூமியின் குடிமக்கள் நேரடியாக அழைக்கப்படுகிறார்கள். தமிழில் பொருள் தெளிவாகவும் இயல்பாகவும் இருக்க இந்த வடிவம் பயன்படுத்தப்பட்டது.
- source_word: יהוה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தின் தனிப்பட்ட இறைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் அதன் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: தலைப்பிலுள்ள תּוֹדָה என்பது பொதுவான நன்றியா அல்லது நன்றிப்பலியா
  choice: முதன்மை உரையில் ‘நன்றிச் செலுத்துதல்’
  alternative: ‘நன்றிப்பலிக்கான சங்கீதம்’ அல்லது ‘நன்றியின் சங்கீதம்’
  rationale: பெயர்ச்சொல் நன்றியறிதலையும் நன்றிப்பலியையும் குறிக்கக்கூடும். தலைப்பின் சுருக்கமான தன்மை இதைத் தீர்மானிக்கவில்லை; எனவே பரந்த பொருள் முதன்மை உரையிலும் குறிப்பான மாற்றுப் பொருள் அடிக்குறிப்பிலும் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டுக்குரிய கண்ணியத்தையும் அழைப்பின் உற்சாகத்தையும் காக்கும் நடை. தலைப்பு தனி வரியாக வைக்கப்பட்டுள்ளது; ஏவல் வாக்கியத்தில் இயல்பான தமிழ் அழைப்புமுறை பயன்படுத்தப்பட்டுள்ளது.
