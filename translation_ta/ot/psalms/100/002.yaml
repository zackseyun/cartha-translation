  yaml_path: translation/ot/psalms/100/002.yaml
  text: Serve Yahweh with gladness[a]; come before him with joyful shouting.
translation:
  language: ta
  text: யாவேக்கு மகிழ்ச்சியுடன் பணி செய்யுங்கள்; களிப்பொலியுடன்[a] அவர் முன்னிலையில் வாருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
