    text: அல்லது, “களிப்புப் பாடலுடன்”; எபிரெயச் சொல் ஆரவாரமாக எழுப்பப்படும் மகிழ்ச்சிக் குரலையோ களிப்புடன் பாடப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: பணிசெய்யுங்கள்
  rationale: עבד என்பதன் பன்மை ஏவல் வடிவம். யாவேக்கு அர்ப்பணிப்போடும் கீழ்ப்படிதலோடும் சேவை செய்வதைக் குறிக்கிறது; வழிபாட்டுச் செயல் என்ற பொருளுக்கு மட்டும் இதைச் சுருக்காமல், அடிப்படைச் ‘சேவை செய்’ பொருளையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּשִׂמְחָה
  choice: மகிழ்ச்சியுடன்
  rationale: בְּ இங்கு செயல் நடைபெறும் முறையைக் குறிக்கிறது; שִׂמְחָה என்பதன் மகிழ்ச்சி, களிப்பு ஆகிய உணர்வைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בֹּאוּ
  choice: வாருங்கள்
  rationale: בוא என்பதன் பன்மை ஏவல் வடிவம். ஆலயத்துக்குள் நுழைவது என்று வசனத்தில் இல்லாத குறிப்பைச் சேர்க்காமல், பொதுவான அணுகிவருதலைக் காட்டுகிறது.
- source_word: לְפָנָיו
  choice: அவர் முன்னிலையில்
  rationale: சொல்லடியாக ‘அவருடைய முகத்திற்கு/அவர் முன்’ என்று அமையும் எபிரெய மரபுத்தொடரின் உறவு மற்றும் முன்னிலைப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: בִּרְנָנָה
  choice: களிப்பொலியுடன்
  rationale: רְנָנָה என்பது மகிழ்ச்சிப் பேரொலி, ஆரவாரம் அல்லது களிப்புப் பாடலைக் குறிக்கலாம். ‘களிப்பொலி’ அதன் உரத்த, மகிழ்ச்சியான குரல்வெளிப்பாட்டைத் தக்கவைத்து, அது கட்டாயம் கூச்சலா பாடலா என்பதைத் தீர்மானிக்காமல் விடுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: இவ்வசனம் יהוה என்ற தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் பெயரியல் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பன்மை ஏவல் வடிவங்களுடனும் சங்கீதத்துக்கேற்ற கண்ணியமான தொனியுடனும் அமைக்கப்பட்டது. ‘களிப்பொலி’ என்பது மூலச்சொல்லின் கூச்சல்/பாடல் என்ற பரப்பைச் சுருக்காமல் காக்கிறது.
