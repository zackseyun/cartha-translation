source:
  edition: WLC
  text: פִּ֭רְיָ/מוֹ מֵ/אֶ֣רֶץ תְּאַבֵּ֑ד וְ֝/זַרְעָ֗/ם מִ/בְּנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/010.yaml
  text: You will destroy their fruit from the earth[a], and their offspring from among the sons of man.
translation:
  language: ta
  text: 'அவர்களுடைய கனியைப் பூமியிலிருந்து அழிப்பீர்;

    அவர்களுடைய சந்ததியை மனிதர்களின் நடுவிலிருந்து[a] அழிப்பீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “மனிதனின் மக்களிடமிருந்து”; அதாவது, மனிதகுலத்தினரிடமிருந்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּרְיָמוֹ
  choice: அவர்களுடைய கனி
  rationale: פְּרִי என்பதன் நேர்ப்பொருள் ‘கனி’ அல்லது ‘விளைச்சல்’. இங்கு அது சந்ததியைக் குறிக்கும் உருவகமாக இருந்தாலும், அடுத்த அடியில் வரும் ‘சந்ததி’ என்பதுடனான கவிதை இணைப்பைப் பாதுகாக்க ‘கனி’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מֵאֶרֶץ
  choice: பூமியிலிருந்து
  rationale: אֶרֶץ என்பது ‘பூமி’ அல்லது ‘நாடு’ எனப் பொருள்படலாம். இச்சங்கீதத்தின் விரிந்த நியாயத்தீர்ப்புச் சூழலில் குறிப்பிட்ட ஒரு நாட்டைவிடப் பரந்த பொருளை ‘பூமி’ தருகிறது.
- source_word: תְּאַבֵּד
  choice: அழித்துப்போடுவீர்
  rationale: אבד என்பதன் பியேல் வடிவம் ‘அழித்தல்’ அல்லது ‘அழியச் செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவத்தின் நேரடியான வலிமையை மரியாதை ஒருமையுடன் இச்சொல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְזַרְעָם
  choice: அவர்களுடைய சந்ததி
  rationale: זֶרַע என்பதன் நேர்ப்பொருள் ‘விதை’; மனிதர்களைக் குறிக்கும்போது ‘சந்ததி’ அல்லது ‘வழித்தோன்றல்கள்’ எனப் பொருள்படும். இங்கு தெளிவான, இயல்பான தமிழுக்காக ‘சந்ததி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מִבְּנֵי אָדָם
  choice: மனிதர்களின் நடுவிலிருந்து
  rationale: בְּנֵי אָדָם என்பது மனிதகுலத்தினரைக் குறிக்கும் வழக்கமான எபிரெயச் சொற்றொடர். தமிழில் ‘மனிதர்களின் நடுவிலிருந்து’ என்பது அதன் பொதுமையான மனிதக் குறிப்பையும் ‘among’ என்ற உறவையும் இயல்பாகத் தருகிறது; சொல்லுக்குச் சொல் வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: בְּנֵי אָדָם என்ற சொற்றொடரில் אָדָם-ஐ மொழிபெயர்த்தல்
  choice: மனிதர்களின் நடுவிலிருந்து
  alternative: மனிதனின் மக்களின் நடுவிலிருந்து
  rationale: இச்சொற்றொடர் இலக்கண வடிவில் ஆண்பாலாக இருந்தாலும், பொருளில் பொதுவாக மனிதகுலத்தைக் குறிக்கிறது. தமிழில் சொல்லுக்குச் சொல் ஆண்பால் வடிவம் இயல்பற்றதோடு பொருளையும் மங்கச் செய்யும்; ஆகவே பொதுமையான குறிப்பைப் பிரதான உரையில் வைத்து, எபிரெயச் சொல் வடிவத்தை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியமும் இணை அமைப்பும் பேணப்பட்டுள்ளன. தெய்வத்தை நோக்கிய இரண்டாம் நபர் ஒருமை வினைகள் தமிழின் மரியாதை ஒருமையில் வழங்கப்பட்டுள்ளன; ‘கனி’ என்ற மூல உருவகம் திட்டமிட்டு நிலைநிறுத்தப்பட்டுள்ளது.
