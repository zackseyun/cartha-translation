  yaml_path: translation/ot/psalms/021/011.yaml
  text: For they intended evil against you[a]; they devised a scheme[b], but they could not carry it out.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் உமக்கு எதிராகத் தீங்கைத் திட்டமிட்டார்கள்[a]; ஒரு சூழ்ச்சியை வகுத்தார்கள்[b]; ஆனால் அதைச் செயல்படுத்த அவர்களால் முடியவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘அவர்கள் உமக்கு எதிராகத் தீங்கை நீட்டினார்கள்.’ இந்த எபிரெய மரபுத்தொடர், உமக்கு எதிராகத் தீங்கை நோக்கமாகக் கொண்டார்கள் என்பதைக் குறிக்கிறது.'
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: ‘அவர்கள் ஒரு சதித்திட்டத்தைத் தீட்டினார்கள்; ஆனால் அவர்களால் அதை நிறைவேற்ற முடியவில்லை.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட தீர்ப்புக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נָטוּ עָלֶיךָ רָעָה
  choice: உமக்கு எதிராகத் தீங்கைத் திட்டமிட்டார்கள்
  rationale: நָטָה என்பதன் சொற்பொருள் ‘நீட்டுதல்/திருப்புதல்’ என்றாலும், רָעָה மற்றும் עַל உடன் இங்கு ஒருவருக்கு எதிராகத் தீமையை நோக்கமாகக் கொள்வதைச் சுட்டுகிறது. ‘தீங்கைத் திட்டமிட்டார்கள்’ என்பது பகைமையான நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: חָשְׁבוּ
  choice: வகுத்தார்கள்
  rationale: இச்சூழலில் חשׁב திட்டமிட்டு உருவாக்குவதைக் குறிக்கிறது; ‘சூழ்ச்சியை வகுத்தார்கள்’ என்பது திட்டமிட்ட சதிச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: מְזִמָּה
  choice: ஒரு சூழ்ச்சி
  rationale: מְזִמָּה என்பது திட்டம் அல்லது தந்திரத்தைக் குறிக்கலாம்; இங்குள்ள எதிர்மறையான சூழலில் ‘சூழ்ச்சி’ அதன் வஞ்சகமான பகைமைத் தன்மையைப் பாதுகாக்கிறது.
- source_word: בַּל יוּכָלוּ
  choice: ஆனால் அதைச் செயல்படுத்த அவர்களால் முடியவில்லை
  rationale: בַּל என்பது கவிதை நடையின் எதிர்மறைத் துகள்; יכל ‘முடிதல்’ என்று பொருள்படும். முன் கூறப்பட்ட சூழ்ச்சியே மறைமுகச் செயப்படுபொருள் என்பதால், ‘அதைச் செயல்படுத்த’ என இயல்பான தமிழில் தெளிவாக்கப்பட்டுள்ளது.
