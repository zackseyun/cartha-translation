  text: תִּמְצָ֣א יָ֭דְ/ךָ לְ/כָל אֹיְבֶ֑י/ךָ יְ֝מִֽינְ/ךָ תִּמְצָ֥א שֹׂנְאֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/008.yaml
  text: Your hand will find all your enemies[a]; your right hand will find those who hate you.
translation:
  language: ta
  text: உமது எதிரிகள் எல்லாரையும் உமது கை கண்டடையும்[a]; உம்மை வெறுப்பவர்களை உமது வலது கை கண்டடையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எட்டிப் பிடிக்கும்’ அல்லது ‘துரத்திப் பிடிக்கும்’; ‘கண்டடையும்’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெய வினைச்சொல், இச்சூழலில் எதிரிகளை வெற்றிகரமாகச் சென்றடைந்து பிடிப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: கண்டடையும்
  rationale: מצא என்பதன் அடிப்படைப் பொருள் ‘கண்டுபிடி/கண்டடை’ என்பதாகும். இங்குள்ள போர்ச் சூழலில் அது எதிரிகளைச் சென்றடைந்து பிடிக்கும் கருத்தையும் தரலாம். ‘கண்டடையும்’ என்பது எபிரெய உருவகத்தையும் சூழலுக்குரிய செயல்விளைவையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יָדְךָ
  choice: உமது கை
  rationale: அரசனின் செயலாற்றலையும் வல்லமையையும் குறிக்கும் உடல்சார் உருவகத்தைச் சுருக்காமல் நேரடியாகப் பேணுகிறது.
- source_word: לְכָל
  choice: எல்லாரையும்
  rationale: כל என்பதன் முழுமையான உள்ளடக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; மனித எதிரிகளைக் குறிப்பதால் உயர்திணைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֹיְבֶיךָ
  choice: உமது எதிரிகள்
  rationale: אֹיֵב என்பதற்கான தெளிவான நவீனத் தமிழ் இணை; இரண்டாம் நபர் ஒருமை உரிமை விகுதி மரியாதை நடையில் பேணப்பட்டுள்ளது.
- source_word: יְמִינְךָ
  choice: உமது வலதுகை
  rationale: எபிரெய இணைவாக்கிய அமைப்பையும் வலிமை மற்றும் வெற்றிகரமான செயலின் மரபான உருவகத்தையும் அப்படியே பேணுகிறது.
- source_word: שֹׂנְאֶיךָ
  choice: உம்மை வெறுப்பவர்கள்
  rationale: பெயரெச்ச வினை வடிவின் செயற்பொருளை ‘எதிரிகள்’ என்று பொதுப்படுத்தாமல், வெறுக்கும் செயலைத் தெளிவாகப் பேணுகிறது.
theological_decisions:
- issue: அரச அல்லது தெய்வ வல்லமையை மனித உடல் உறுப்புகளால் சித்தரிக்கும் மொழி
  choice: ‘கை’, ‘வலதுகை’ என்ற நேரடியான உருவகங்கள் தக்கவைக்கப்பட்டன.
  alternative: ‘உமது வல்லமை உமது எதிரிகள் எல்லாரையும் முறியடிக்கும்’
  rationale: மூல எபிரெயத்தின் உடல்சார் கவித்துவ உருவகமும் இணைவாக்கிய வலிமையும் முக்கியமானவை. அதை ‘வல்லமை’ என்று கருத்தாக்குவது மூலத்தின் உருவகத்தை இழக்கச் செய்யும். மேலும் சங்கீதத்தின் உடனடி முகவரி அரசனா அல்லது விரிவான இறையியல் வாசிப்பில் வேறுவிதமாகப் புரிந்துகொள்ளப்படுகிறதா என்பதை மொழிபெயர்ப்பு தேவையின்றித் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமானதும் பொதுவாசகர்களுக்குப் புரியத்தக்கதுமான மரியாதை ஒருமை நடை பயன்படுத்தப்பட்டுள்ளது. இரு அரையடிகளின் எபிரெய இணைவாக்கியமும் ‘கை/வலதுகை’ உருவகமும் பேணப்பட்டுள்ளன.
