source:
  edition: WLC
  text: כִּֽי הַ֭/מֶּלֶךְ בֹּטֵ֣חַ בַּ/יהוָ֑ה וּ/בְ/חֶ֥סֶד עֶ֝לְי֗וֹן בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
translation:
  language: ta
  text: ஏனெனில், அரசன் யாவேவை நம்புகிறான்; உன்னதமானவரின் மாறாத அன்பினால்[a] அவன் அசைக்கப்பட மாட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னதமானவரின் மாறாத அன்பில்.” இங்குள்ள எபிரெய முன்னொட்டு கருவி அல்லது காரணத்தையும், நிலை அல்லது சார்பையும் குறிக்கலாம். “மாறாத அன்பு” என்பதற்கு “உடன்படிக்கை உண்மைத்தன்மை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவன் நிலைகுலைய மாட்டான்” அல்லது “அவன் தடுமாற மாட்டான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அல்லது அடிப்படையை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இங்கு வருகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசன்
  rationale: சங்கீதத்தில் குறிப்பிடப்படும் குறிப்பிட்ட அரசரைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: בֹּטֵחַ
  choice: நம்புகிறான்
  rationale: Qal வினையெச்ச வடிவம் தொடர்ச்சியான அல்லது இயல்பான நம்பிக்கையைக் குறிக்கிறது; தமிழில் நிகழ்காலம் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּיהוָה
  choice: யாவேவை
  rationale: בְ முன்னொட்டு நம்பிக்கையின் பொருளைக் குறிக்கிறது. தமிழில் ‘யாவேவை நம்புகிறான்’ என்பது இயல்பான பயன்பாடு; יהוה என்ற இறைப் பெயர் பெயரெழுத்தாக்கமாகப் பாதுகாக்கப்படுகிறது.
- source_word: וּבְחֶסֶד
  choice: மாறாத அன்பினால்
  rationale: חֶסֶד என்பது நிலையான, உறவுப்பற்றுள்ள அன்பையும் உண்மைத்தன்மையையும் குறிக்கிறது. בְ இங்கு கருவி அல்லது காரணப் பொருளில் புரிந்துகொள்ளப்பட்டதால் ‘அன்பினால்’ என மொழிபெயர்க்கப்பட்டது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: இறைவனுக்குரிய பெயர்ப்பட்டமாகப் பயன்படுத்தப்பட்டுள்ளதால், இயல்பான மற்றும் மரியாதையான தமிழில் ‘உன்னதமானவர்’ என வழங்கப்படுகிறது.
- source_word: בַּל יִמּוֹט
  choice: அசைக்கப்பட மாட்டான்
  rationale: கவிதை நடையிலுள்ள மறுப்புடன், நிலைகுலைதல் அல்லது தடுமாறுதல் என்ற உருவகத்தை நவீன தமிழில் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய மூலத்தில் நான்கு எழுத்து இறைப் பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமாக மாற்றாமல், உடன்படிக்கைப் பெயராகப் பெயரெழுத்தாக்கம் செய்வது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: בְחֶסֶד என்பதிலுள்ள முன்னொட்டின் பொருள்
  choice: கருவி அல்லது காரணப் பொருள்—‘மாறாத அன்பினால்’
  alternative: சார்பு அல்லது நிலைப் பொருள்—‘மாறாத அன்பில்’
  rationale: அரசன் அசைக்கப்படாதிருப்பதற்கான அடிப்படையாக உன்னதமானவரின் חֶסֶד விளங்குகிறது. எனினும் எபிரெய முன்னொட்டு இடம் அல்லது சார்பையும் குறிக்கக்கூடும் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் மரியாதையான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் காரண இணைப்பு, அரசனின் தொடர்ச்சியான நம்பிக்கை, இறைப் பெயர், மற்றும் நிலைத்தன்மையைக் குறிக்கும் உருவகம் பாதுகாக்கப்பட்டுள்ளன.
