  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
translation:
  language: ta
  text: நீர் உமது பிரசன்னத்தின் நேரத்தில் அவர்களை நெருப்புச் சூளையைப்போல் ஆக்குவீர்; யாவே தமது கோபத்தில் அவர்களை விழுங்கிவிடுவார்; நெருப்பு அவர்களை எரித்தழிக்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் வெளிப்படும் நேரத்தில்”; சொல்லர்த்தமாக, “உமது முகத்தின் நேரத்தில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  choice: அவர்களை ... ஆக்குவீர்
  rationale: שׁית என்பதன் அடிப்படைப் பொருள் ‘வைத்தல்/அமைத்தல்’; இங்கு ஒப்புமைப் பயனிலையுடன் வருவதால் விளைவுநிலையை இயல்பாகத் தெரிவிக்க ‘ஆக்குவீர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: כְּתַנּוּר אֵשׁ
  choice: நெருப்புச் சூளையைப்போல்
  rationale: תנור என்பது அடுப்பு அல்லது சூளை; אֵשׁ உடனான இணைப்பு அழிவூட்டும் கடும் வெப்பத்தைச் சித்தரிப்பதால், நவீன தமிழில் இயல்பான ‘நெருப்புச் சூளை’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְעֵת פָּנֶיךָ
  choice: உமது பிரசன்னத்தின் நேரத்தில்
  rationale: சொல்லர்த்தமாக ‘உமது முகத்தின் நேரத்தில்.’ פנים இங்கு ஒருவரின் முன்னிருப்பு அல்லது வெளிப்பாட்டைக் குறிக்கலாம். ‘பிரசன்னம்’ மனித உருவகத்தின் கருத்தை மதிப்புடன் தக்கவைக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּאַפּוֹ
  choice: தமது கோபத்தில்
  rationale: אַף சொல்லர்த்தமாக ‘மூக்கு/நாசி’ என்றாலும், இங்கு கோபத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர்; ‘கோபத்தில்’ அதன் கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: יְבַלְּעֵם
  choice: அவர்களை விழுங்கிவிடுவார்
  rationale: בלע என்பதன் உயிரோட்டமான ‘விழுங்குதல்’ உருவகத்தைத் தக்கவைத்து, அடுத்துள்ள நெருப்பு எரித்தழிக்கும் செயலில் இருந்து வேறுபடுத்துகிறது.
- source_word: וְתֹאכְלֵם אֵשׁ
  choice: நெருப்பு அவர்களை எரித்தழிக்கும்
  rationale: אכל என்பதன் இச்சூழலிலான ‘உண்டுவிடுதல்/அழித்தல்’ கருத்தை, நெருப்பின் செயலைக் குறிக்கும் இயல்பான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: ‘உமது முகத்தின் நேரத்தில்’ என்ற மனித உருவக வெளிப்பாடு
  choice: உமது பிரசன்னத்தின் நேரத்தில்
  alternative: நீர் வெளிப்படும் நேரத்தில்
  rationale: இறைவனின் வெளிப்பட்ட முன்னிருப்பை உணர்த்துகிறது; இதை ஒரு குறிப்பிட்ட இறுதிக்காலத் தொழில்நுட்பச் சொல்லாக மிகையாக வரையறுக்காமல் எபிரெயின் பொருள் நெகிழ்வைத் தக்கவைக்கிறது.
- issue: יְהוָה என்ற இறைத் திருப்பெயர்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பெயரைப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: இரண்டாம் நபரிலிருந்து மூன்றாம் நபருக்கான மாறுதல்
  choice: ‘நீர்... ஆக்குவீர்; யாவே... விழுங்கிவிடுவார்’ என்று மூலத்தின் நபர் மாற்றத்தைத் தக்கவைத்தல்
  alternative: இரண்டு வினைகளையும் இரண்டாம் நபரில் ஒருமைப்படுத்துதல்
  rationale: எபிரெய உரையில் תְּשִׁיתֵמוֹ இரண்டாம் நபரிலும், יְהוָה ... יְבַלְּעֵם மூன்றாம் நபரிலும் உள்ளதால், அதன் கவித்துவ மற்றும் விளக்கவியல் பதற்றத்தைச் சீராக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற மதிப்பும் வலிமையும் கொண்ட நடை பயன்படுத்தப்பட்டது. இறைவனைச் சுட்டும் இடங்களில் ‘நீர்/உமது/தமது’ என்ற மரியாதை வடிவங்கள் அமைக்கப்பட்டன. அடிக்குறிப்பு குறி [a] முதன்மை உரையில் இடம்பெற்றுள்ளது.
