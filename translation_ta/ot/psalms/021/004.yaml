source:
  edition: WLC
  text: חַיִּ֤ים שָׁאַ֣ל מִ֭מְּ/ךָ נָתַ֣תָּה לּ֑/וֹ אֹ֥רֶךְ יָ֝מִ֗ים עוֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/004.yaml
  text: He asked life from you[b][a]; you gave it to him—length of days forever and ever.
translation:
  language: ta
  text: அவன் உம்மிடம் வாழ்வைக் கேட்டான்; நீர் அதை அவனுக்குக் கொடுத்தீர்—என்றென்றைக்கும் நீளும் ஆயுளை[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு மொழிபெயர்ப்பு: ‘நீண்ட ஆயுள்’; சொல்லுக்குச் சொல், ‘நாட்களின் நீளம்.’'
    reason: lexical_alternative
  - marker: b
    text: ‘என்றென்றைக்கும்’ என்பது அரசனின் நீடித்த வாழ்வையும் ஆட்சியையும் குறிக்கும் அரசவைக் கவிதை மிகைப்படுத்தலாக வாசிக்கப்படலாம்; அல்லது மேசியாவில் முழுமையான நிறைவேற்றம் பெறும் மொழியாகவும் வாசிக்கப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיִּים
  choice: வாழ்வு
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு இது ‘வாழ்வு’ என்னும் ஒருமைக் கருத்தைக் குறிக்கிறது. அதன் காலநீளம் அடுத்த சொற்றொடரில் தனியாக விரிவுபடுத்தப்படுகிறது.
- source_word: שָׁאַל מִמְּךָ
  choice: உம்மிடம் ... கேட்டான்
  rationale: מִן மூலத்தைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ஒருவர் இன்னொருவரிடமிருந்து ஒன்றைக் கேட்பதை ‘உம்மிடம் கேட்டான்’ என்று தெளிவாகச் சொல்லலாம்.
- source_word: נָתַתָּה לּוֹ
  choice: நீர் அதை அவனுக்குக் கொடுத்தீர்
  rationale: முந்தைய அடியில் உள்ள ‘வாழ்வு’ என்பதே கொடுக்கப்பட்ட பொருள் என்பதைத் தெளிவாக்க ‘அதை’ சேர்க்கப்பட்டுள்ளது. எபிரெய நிறைவேற்றப்பட்ட செயல்வடிவு கவிதை நடையில் இறந்தகாலமாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֹרֶךְ יָמִים
  choice: நீண்ட வாழ்நாள்
  rationale: சொல்லுக்குச் சொல் ‘நாட்களின் நீளம்’ என்றாலும், அது நீடித்த ஆயுளைக் குறிக்கும் மரபுத்தொடர். ‘நீண்ட வாழ்நாள்’ நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் கருத்துக்கு நெருக்கமாகவும் உள்ளது.
- source_word: עוֹלָם וָעֶד
  choice: என்றென்றைக்கும்
  rationale: இணைந்துள்ள எபிரெயச் சொற்கள் எல்லையற்ற காலநீளத்தை வலியுறுத்துகின்றன. தமிழில் ‘என்றென்றைக்கும்’ அந்த வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அரச சங்கீதத்தில் அரசனுக்குக் கொடுக்கப்பட்ட வாழ்வின் கால அளவு
  choice: கால அளவை ‘என்றென்றைக்கும்’ என்று நேரடியாக மொழிபெயர்த்து, அதன் பொருளை முதன்மை உரையில் குறுக்கவில்லை.
  alternative: இதை அரசனின் மிக நீண்ட வாழ்வையும் ஆட்சியையும் குறிக்கும் அரசவைக் கவிதை மிகைப்படுத்தலாகக் கொள்ளலாம்; அல்லது மேசியாவில் முழுமையாக நிறைவேறும் நிலையான வாழ்வாகவும் ஆட்சியாகவும் கொள்ளலாம்.
  rationale: எபிரெய உரை எல்லையற்ற காலநீளத்தை வெளிப்படுத்துகிறது. இது வரலாற்று அரசனைப் பற்றிய கவிதை மிகைப்படுத்தலா அல்லது மேசியாவில் ஆழ்ந்த நிறைவேற்றம் பெறும் மொழியா என்பதை மொழிபெயர்ப்பு தீர்மானிக்காமல், மூலத்தின் இறையியல் இழுபறியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் dignified கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் மரியாதை ஒருமையான ‘உம்மிடம்/நீர்’ பயன்படுத்தப்பட்டு, அரசனைச் சுட்டும் மூன்றாம் நபர் வடிவம் மூலத்துக்கு நெருக்கமாக ‘அவன்’ என வைக்கப்பட்டுள்ளது.
