  text: יְֽהוָ֗ה בְּ/עָזְּ/ךָ֥ יִשְׂמַח מֶ֑לֶךְ וּ֝/בִ/ישׁ֥וּעָתְ/ךָ֗ מַה יגיל מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/001.yaml
  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
translation:
  language: ta
  text: 'யாவே, உமது வல்லமையில் அரசன் மகிழ்கிறான்;


    உமது மீட்பில்[a] அவன் எவ்வளவு பெரிதாய்க் களிகூருகிறான்!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை “விடுதலை” அல்லது இச்சூழலில் “வெற்றி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய இறைப்பெயரை நேரடியாக ஒலிபெயர்த்து, விளிப்பாக வரும் இடத்துக்கு இயல்பான தமிழில் வழங்குகிறது.
- source_word: בְּעָזְּךָ
  choice: உமது வல்லமையில்
  rationale: בְּ முன்னிடைச்சொல் குறிக்கும் அடிப்படை அல்லது தளத்தைப் பாதுகாக்கிறது; עֹז என்பதன் வலிமை/வல்லமைப் பொருளை இயல்பாகத் தருகிறது.
- source_word: יִשְׂמַח
  choice: மகிழ்கிறான்
  rationale: கவிதையில் yiqtol நிகழ்கால அல்லது வழக்கமான செயலைக் குறிக்கக்கூடும்; மூலத்தின் காலத் திறப்பைத் தேவையின்றி கண்டிப்பான எதிர்காலமாக மாற்றாமல் வழங்குகிறது.
- source_word: מֶלֶךְ
  choice: அரசன்
  rationale: எபிரெயத்தில் சுட்டுப்பெயரடை இல்லாவிட்டாலும், சூழலில் குறிப்பிட்ட அரசனையே குறிக்கிறது.
- source_word: וּבִישׁוּעָתְךָ
  choice: உமது மீட்பில்
  rationale: יְשׁוּעָה என்பதன் பரந்த மீட்பு, விடுதலை, வெற்றி ஆகிய பொருள் வளையத்தை 'மீட்பு' தக்கவைக்கிறது; முதல் அடியுடனான இணைப்பையும் பேணுகிறது.
- source_word: מַה ... מְאֹד
  choice: எவ்வளவு மிகுதியாக
  rationale: மַה இங்கு வினாவாக அல்ல, வியப்பூட்டும் தீவிரத்தைக் காட்டுகிறது; מְאֹד உடன் சேர்ந்த வலியுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יגיל
  choice: களிகூருகிறான்
  rationale: גיל குறிக்கும் துள்ளலான, தீவிரமான மகிழ்ச்சியை வெளிப்படுத்தி, שמח என்பதிலிருந்து கவிதைநயமான வேறுபாட்டைப் பேணுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: יְשׁוּעָה என்பதன் பொருள் வரம்பு
  choice: மீட்பு
  alternative: விடுதலை அல்லது வெற்றி
  rationale: சங்கீதத்தின் அரசச் சூழலில் விடுதலையும் வெற்றியும் சாத்தியமான நிழற்பொருள்கள்; 'மீட்பு' அவற்றை முற்றிலும் நீக்காமல் பரந்த பொருளைத் தக்கவைக்கிறது, மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, மரியாதையும் கவிதைநயமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய உரையில் 'உமது' என வழங்கப்பட்டு, இணைவரிகளிலுள்ள மகிழ்ச்சிச் சொற்களின் தீவிர வேறுபாடு பேணப்பட்டுள்ளது.
