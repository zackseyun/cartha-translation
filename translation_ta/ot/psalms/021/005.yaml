  text: Great is his glory through your salvation[b][a]; you bestow splendor and majesty on him.
translation:
  language: ta
  text: உமது மீட்பினால்[a][b] அவனுடைய மகிமை பெரிது; மாட்சியையும் மகத்துவத்தையும் அவன்மேல் சூட்டுகிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது மீட்பின் மூலம்,’ ‘உமது மீட்பில்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய முன்னிடைச்சொல் கருவியையோ சூழலையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘மீட்பு’ என்பதை இங்கு ‘விடுதலை’ என்றும், இந்த அரசச் சூழலில் ‘வெற்றி’ என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: பெரிது
  rationale: வாக்கியத்தின் தொடக்கத்தில் வலியுறுத்தப்பட்டுள்ள பயனிலைப் பெயரடையின் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: כְּבוֹדוֹ
  choice: அவனுடைய மகிமை
  rationale: அரசனுக்குரிய கனத்தையும் உயர்வையும் குறிக்கும் כָּבוֹד என்பதற்கு ‘மகிமை’ பொருத்தமானது.
- source_word: בִּישׁוּעָתֶךָ
  choice: உமது மீட்பினால்
  rationale: יְשׁוּעָה என்பதன் விடுவித்தல்/காப்பாற்றுதல் என்ற அடிப்படைப் பொருளை ‘மீட்பு’ காக்கிறது; ב இங்கு கருவி அல்லது காரணத்தைச் சுட்டலாம் என்பதால் ‘-னால்’ பயன்படுத்தப்பட்டது.
- source_word: הוֹד
  choice: மாட்சி
  rationale: அரசருக்குரிய ஒளிவீசும் பெருமையையும் சிறப்பையும் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
- source_word: וְהָדָר
  choice: மகத்துவம்
  rationale: הוֹד உடன் வரும் கவிதை இணையில் அரச கண்ணியத்தையும் மேன்மையையும் உணர்த்துகிறது.
- source_word: תְּשַׁוֶּה
  choice: சூட்டுகிறீர்
  rationale: ஒருவர்மேல் ஒன்றை வைப்பது என்ற எபிரெய வினையின் உருவகத்தைப் பேணுவதோடு, அரசனுக்கு மாட்சியும் மகத்துவமும் அளிக்கப்படுவதை இயல்பான தமிழில் காட்டுகிறது.
- source_word: עָלָיו
  choice: அவன்மேல்
  rationale: עַל என்னும் முன்னிடைச்சொல்லின் இடவியல் உருவகத்தை நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: அரச சங்கீதத்தில் יְשׁוּעָה என்பதன் பொருள்
  choice: மீட்பு
  alternative: வெற்றி; விடுதலை; இரட்சிப்பு
  rationale: இச்சொல் பரந்த வகையில் காப்பாற்றுதலையோ விடுதலையையோ குறிக்கிறது; அரச மற்றும் போர்ச் சூழலில் வெற்றியையும் உள்ளடக்கலாம். ‘மீட்பு’ அதன் பரந்த பொருளைக் காத்து, போர்வெற்றிக்கு மட்டும் வசனத்தைச் சுருக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘மாட்சி—மகத்துவம்’ என்ற இணை, இரண்டு எபிரெயச் சொற்களின் நெருங்கிய ஆனால் வேறுபட்ட அரசச் சிறப்புப் பொருள்களைப் பேணுகிறது.
