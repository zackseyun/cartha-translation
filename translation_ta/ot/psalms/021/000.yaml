    issue: The footnote uses ‘படைப்புரிமை’ for the possible authorial sense of לְדָוִד.
    rationale: In modern standard Tamil, ‘படைப்புரிமை’ normally means copyright, which introduces an anachronistic legal sense. ‘ஆசிரியத்துவம்’ communicates authorship without that implication.
  revised_text: இசைத்தலைவருக்கு. தாவீதின் சங்கீதம்[a].
