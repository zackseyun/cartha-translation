  footnotes:
  - marker: a
    text: ‘தாவீது இயற்றிய சங்கீதம்’ அல்லது ‘தாவீதுக்காகிய சங்கீதம்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயத் தலைப்புச் சொல் ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பைக் குறிக்கக்கூடும்.
