lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத்தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்வை வழிநடத்தும் அல்லது மேற்பார்வையிடும் தலைவரைக் குறிக்கிறது. முன்சேர்க்கையான לַ என்பதன் இலக்கு/ஒப்படைப்பு நுணுக்கத்தை ‘-க்கு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இது இசைத் தொடர்புடைய பாடல் வகையைக் குறிக்கும் வழக்கமான எபிரெயத் தலைப்புச் சொல்; தமிழில் ‘சங்கீதம்’ என்பது தெளிவானதும் நிலைபெற்றதுமான இணைச்சொல்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: לְ என்ற முன்னிடைச்சொல் படைப்புரிமை, தொடர்பு, உடைமை அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதின்’ என்பது ஆசிரியத்துவத்தை மட்டும் உறுதியாக நிர்ணயிக்காமல் மூலத்தின் விரிவை ஓரளவு காக்கிறது; மீதமுள்ள தெளிவின்மை அடிக்குறிப்பில் விளக்கப்படுகிறது.
theological_decisions:
- issue: தாவீது தொடர்பான மேலெழுத்தின் பொருள்
  choice: தாவீதின்
  alternative: தாவீது இயற்றிய / தாவீதுக்காக
  rationale: לְדָוִד என்பதன் பொருள் நேரடி ஆசிரியத்துவத்துக்கு மட்டுமே வரையறுக்கப்படவில்லை. ஆகவே மூல எபிரெயம் கூறுவதைவிட வலுவான ஆசிரியத்துவ அல்லது அர்ப்பணிப்புக் கூற்றை மொழிபெயர்ப்பு திணிக்காமல், பொருள் விரிவை அடிக்குறிப்புடன் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான சங்கீத மேலெழுத்து நடை பயன்படுத்தப்பட்டுள்ளது. ‘இசைத்தலைவர்’ என்பது பொதுவாசகருக்குப் புரியும் வகையில் இசைச் செயல்பாட்டைத் தெளிவாக்குகிறது; ‘தாவீதின்’ மூலத்தின் நோக்கமுள்ள தெளிவின்மையை அடிக்குறிப்புடன் பாதுகாக்கிறது.
