  to: ஏனெனில், நன்மையான ஆசீர்வாதங்களுடன் நீர் அவனைச் சந்திக்கிறீர்[a]; அவன் தலையில் உயர்தரப் பொன்னாலான கிரீடத்தைச் சூட்டுகிறீர்[b].
  rationale: முக்கிய உரையில் ‘எதிர்கொள்கிறீர்’ என்பதற்குப் பதிலாக ‘அவனைச் சந்திக்கிறீர்’ என மாற்றப்பட்டுள்ளது; இது קדם வினையின் ‘meet’ பொருளை நவீன தமிழில் எதிர்மறைச் சாயலின்றி தருகிறது. ‘தூய பொன்னால் செய்யப்பட்ட’ என்பதற்குப் பதிலாக ‘உயர்தரப் பொன்னாலான’ என மாற்றி, פָּז-இன் உயர்தர/நேர்த்தியான பொன் என்ற பொருளைத் துல்லியமாகக் காக்கிறது. மாற்று நுணுக்கங்கள் அடிக்குறிப்புகளில் தொடர்ந்தும் வழங்கப்படுகின்றன.
