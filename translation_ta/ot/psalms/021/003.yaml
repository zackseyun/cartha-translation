  yaml_path: translation/ot/psalms/021/003.yaml
  text: For you meet him with blessings of good[c][b][a]; you set a crown of fine gold on his head.
translation:
  language: ta
  text: ஏனெனில், நன்மையான ஆசீர்வாதங்களுடன் நீர் அவனைச் சந்திக்கிறீர்[a]; அவன் தலையில் உயர்தரப் பொன்னாலான கிரீடத்தைச் சூட்டுகிறீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நன்மையான ஆசீர்வாதங்களுடன் நீர் அவனுக்கு முன்பாகச் செல்கிறீர்,” அல்லது “நன்மையான ஆசீர்வாதங்களுடன் நீர் அவனைச் சந்திக்க வருகிறீர்.” எபிரெய வினை, ஒருவரைச் சந்தித்தல் அல்லது அவருக்கு முன்பாகச் செல்லுதல் என்ற நுட்பத்தைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உயர்தரப் பொன்” என்பதை “தூய பொன்” அல்லது “புடமிட்ட பொன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் எபிரெயக் கவிதைத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תְקַדְּמֶנּוּ
  choice: நீர் அவனை எதிர்கொள்கிறீர்
  rationale: קדם என்பதன் பியேல் வடிவம், ஒருவரை முன்னதாகச் சந்தித்தல் அல்லது அவருக்கு முன்பாகச் செல்லுதல் என்ற நுட்பத்தைத் தருகிறது. முதன்மையாகச் செயல்படுவது தேவன் என்பதையும் இச்சொல் காக்கிறது.
- source_word: בִּרְכוֹת טוֹב
  choice: நன்மையான ஆசீர்வாதங்களுடன்
  rationale: பன்மையான ‘ஆசீர்வாதங்கள்’ என்பதையும், טוֹב என்பதன் பரந்த ‘நன்மை/நல்லது’ என்ற பொருளையும் காக்கிறது; அவை பொருளாதாரமானவையா ஆன்மிகமானவையா என்று குறுக்கவில்லை.
- source_word: תָּשִׁית
  choice: சூட்டுகிறீர்
  rationale: சொல்லடிப்படையில் ‘வைக்கிறீர்’ என்றாலும், தலையில் கிரீடத்தை வைப்பதைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ் வினை ‘சூட்டுகிறீர்’ ஆகும்.
- source_word: לְרֹאשׁוֹ
  choice: அவன் தலையில்
  rationale: வைத்தல் என்ற வினையுடன் לְ என்னும் முன்னொட்டு இங்கு ‘தலையில்’ என்ற இடப்பொருளை இயல்பாகத் தருகிறது.
- source_word: עֲטֶרֶת
  choice: கிரீடம்
  rationale: அரசரைப் பற்றிய சங்கீதச் சூழலில் ‘கிரீடம்’ என்பது அரச மரியாதையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: פָּז
  choice: தூய பொன்
  rationale: உயர்தரமான அல்லது சுத்திகரிக்கப்பட்ட பொன்னைச் சுட்டும் சொல்லுக்கு நவீன தமிழில் தெளிவான இணை; ‘புடமிட்ட பொன்’ என்பதும் சாத்தியம்.
theological_decisions:
- issue: அரசனுக்குக் கொடுக்கப்படும் ஆசீர்வாதங்களின் தன்மை
  choice: ‘நன்மையான ஆசீர்வாதங்கள்’ என்று பரந்த பொருளில் மொழிபெயர்த்தல்
  alternative: குறிப்பாகப் பொருளாதார வளம் என்றோ, குறிப்பாக உடன்படிக்கை சார்ந்த ஆன்மிக ஆசீர்வாதங்கள் என்றோ விளக்குதல்
  rationale: בִּרְכוֹת טוֹב என்ற எபிரெயச் சொற்றொடர் நன்மையின் உள்ளடக்கத்தைத் திட்டவட்டமாகக் குறுக்கவில்லை. ஆகவே மூலத்தில் உள்ள பரந்த இறையியல் பொருள் காக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய இரண்டாம் நபர் ஒருமைக்கு மரியாதை வடிவமான ‘நீர்/செய்கிறீர்’ கையாளப்பட்டுள்ளது. அரிதான சொற்களைத் தவிர்த்து, அரச சங்கீதத்தின் உயர்ந்த தொனி காக்கப்பட்டுள்ளது.
