  yaml_path: translation/ot/psalms/021/013.yaml
  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
translation:
  language: ta
  text: 'யாவே, உமது வல்லமையில் உயர்ந்தவராய் விளங்குவீராக![a]

    உமது பேராற்றலைப் பாடுவோம்; இசையால் உமது பேராற்றலைப் புகழ்வோம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே, உமது வல்லமையில் எழுந்தருளும்!” எபிரெய வினை, கடவுள் எழுந்து செயல்பட வேண்டும் என்ற அழைப்பாகவோ, அவர் உயர்ந்தவராக விளங்க வேண்டும் என்ற வேண்டுகோளாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּמָה
  choice: உயர்ந்து விளங்கும்
  rationale: רוּם வேரிலிருந்து வரும், கடவுளை நோக்கிய வேண்டுகோள் வடிவம். ‘உயர்ந்து விளங்கும்’ என்பது அவர் உயர்ந்தவராக வெளிப்பட வேண்டும் என்ற புகழ்ச்சிசார் வேண்டுகோளை இயல்பான, மதிப்புமிக்க தமிழில் தருகிறது; ‘எழுந்தருளும்’ என்ற செயல்சார் பொருளும் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: בְּעֻזֶּךָ
  choice: உமது வல்லமையில்
  rationale: בְּ என்பதன் தளம் அல்லது சூழல் சார்ந்த பொருளையும் עֹז என்பதன் வல்லமைப் பொருளையும் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: נָשִׁירָה
  choice: பாடுவோம்
  rationale: முதல் நபர் பன்மைக் cohortative வடிவத்தின் உறுதியான விருப்பம் அல்லது அழைப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּנְזַמְּרָה
  choice: இசையால் புகழ்வோம்
  rationale: זמר என்பதில் உள்ள இசை செய்தல் மற்றும் புகழ்ந்து பாடுதல் ஆகிய நுணுக்கங்களை ஒருங்கிணைக்கிறது; முந்தைய ‘பாடுவோம்’ என்பதைக் காரணமின்றி அப்படியே மறுபடியும் கூறுவதையும் தவிர்க்கிறது.
- source_word: גְּבוּרָתֶךָ
  choice: உமது பேராற்றலை
  rationale: முன்னுள்ள עֹז என்பதற்கு ‘வல்லமை’ பயன்படுத்தப்பட்டதால், தொடர்புடையதாயினும் தனித்த கவிதைச் சொல்லாகிய גְּבוּרָה-வின் வலிமைமிக்க ஆற்றல் அல்லது வீரச்செயல் சார்ந்த நுணுக்கத்தை ‘பேராற்றல்’ காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை பொதுவான பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்துள்ளோம்.
- issue: רוּמָה என்ற வேண்டுகோளின் பொருள்
  choice: உயர்ந்து விளங்கும்
  alternative: எழுந்தருளும்
  rationale: சூழல் புகழ்ச்சிப் பாடலின் நிறைவாக இருப்பதால் ‘உயர்ந்து விளங்கும்’ பொருத்தமானது; எனினும், கடவுள் செயல்பட எழ வேண்டும் என்ற அழைப்பாகவும் எபிரெய வினையைப் புரிந்துகொள்ள முடிவதால் அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், செய்யுளுக்கேற்ற சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. கடவுளை நோக்கிய உரையில் ‘உமது’ மற்றும் மரியாதை வேண்டுகோள் வடிவம் பயன்படுத்தப்பட்டுள்ளது; தொடர்புடைய עֹז / גְּבוּרָה சொற்கள் ‘வல்லமை’ / ‘பேராற்றல்’ என வேறுபடுத்தப்பட்டுள்ளன.
