translation_notes:
  register: நவீன பொதுத்தமிழில் புரியக்கூடிய, சங்கீதத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்/உமது/செய்வீர்’ என்ற மரியாதை ஒருமை இறைவனை நோக்கிய உரைக்கு ஏற்றவாறு ஒருமையாகப் பேணப்பட்டுள்ளது. இரு எபிரெய அரையடிகளுக்கிடையிலான தொடர்பு காரண அல்லது கால உறவாக வெளிப்படையாக மாற்றப்படாமல், மூலத்தின் கவித்துவ இணைப்பு மற்றும் ‘முதுகு—முகம்’ பதற்றம் தக்கவைக்கப்பட்டுள்ளது.
