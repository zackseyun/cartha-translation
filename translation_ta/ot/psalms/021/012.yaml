  to: ஏனெனில், நீர் அவர்களைப் புறமுதுகு காட்டச் செய்வீர்[a]; உமது வில் நாண்களால் அவர்களுடைய முகங்களுக்கு நேராகக் குறிவைப்பீர்[b].
