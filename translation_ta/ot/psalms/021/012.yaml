source:
  edition: WLC
  text: כִּ֭י תְּשִׁיתֵ֣/מוֹ שֶׁ֑כֶם בְּ֝/מֵֽיתָרֶ֗י/ךָ תְּכוֹנֵ֥ן עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/012.yaml
  text: For you will make them turn their back[c][b][a]; with your bowstrings you will aim at their faces.
translation:
  language: ta
  text: ஏனெனில், நீர் அவர்களைப் புறமுதுகு காட்டச் செய்வீர்[a]; உமது வில் நாண்களால் அவர்களுடைய முகங்களுக்கு நேராகக் குறிவைப்பீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘அவர்களைத் தோளாக வைப்பீர்.’ பகைவர்கள் பின்வாங்கிப் புறமுதுகு காட்டுவதையோ, தங்கள் தோள் அல்லது முதுகுப் பகுதியைக் குறியாக வெளிப்படுத்துவதையோ இந்த எபிரெய மரபுத்தொடர் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமது கயிறுகளால் அவர்களுடைய முகங்களுக்கு எதிராக ஆயத்தப்படுத்துவீர்.’ எபிரெயப் படிமம் சுருக்கமானது; வில் அல்லது அம்பு என்ற சொல் வெளிப்படையாக இடம்பெறவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தின் நம்பிக்கைக்கான காரணத்தை அறிமுகப்படுத்துவதால், காரணத் தொடர்பைக் காட்டும் ‘ஏனெனில்’ பொருத்தமானது.
- source_word: תְּשִׁיתֵמוֹ שֶׁכֶם
  choice: அவர்களைப் புறமுதுகிடச் செய்வீர்
  rationale: சொல்லுக்குச் சொல் ‘அவர்களைத் தோளாக வைப்பீர்’ என்ற எபிரெய உருவகம் இயல்பான தமிழில் தெளிவாகாது. பகைவர்கள் தோள் அல்லது முதுகைக் காட்டித் திரும்புவதைக் குறிக்கும் போர் மரபுத்தொடரை ‘புறமுதுகிடச் செய்வீர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּמֵיתָרֶיךָ
  choice: உமது வில் நாண்களால்
  rationale: מֵיתָר என்பது பொதுவாகக் கயிறு அல்லது நாண். போர் மற்றும் குறிவைத்தல் ஆகிய சூழலில் வில்லின் நாண்களே பெரும்பாலும் குறிக்கப்படுகின்றன.
- source_word: תְּכוֹנֵן
  choice: குறிவைப்பீர்
  rationale: இந்த வினை ஆயத்தப்படுத்துதல் அல்லது நிலைப்படுத்துதல் எனப் பொருள்படலாம்; வில் நாண்களும் எதிரிகளின் முகங்களும் இடம்பெறும் சூழலில் ‘குறிவைப்பீர்’ செயலின் நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: עַל־פְּנֵיהֶם
  choice: அவர்களுடைய முகங்களுக்கு நேராக
  rationale: பகைமைச் சூழலில் עַל־פְּנֵי என்பது முகங்களை நோக்கிய நேரடியான குறியைச் சித்தரிக்கிறது; ‘முகங்களுக்கு நேராக’ அந்தத் தீவிரமான படிமத்தைத் தக்கவைக்கிறது.
