translation:
  language: ta
  text: 'அவருடைய இதயத்தின் விருப்பத்தை அவருக்கு அளித்தீர்;


    அவருடைய உதடுகளின் வேண்டுகோளை[a] நீர் தடுத்துவைக்கவில்லை.


    சேலா[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேண்டுகோள்’ என மொழிபெயர்க்கப்பட்டுள்ள அரிதான எபிரேயச் சொல், ‘விருப்பம்’ அல்லது ‘விண்ணப்பம்’ என்றும் புரிந்துகொள்ளப்படலாம். இங்கு அது ‘இதயத்தின் விருப்பத்திற்கு’ இணையாக, வாயால் வெளிப்படுத்தப்பட்ட வேண்டுதலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சேலா’ என்பதன் துல்லியமான பொருள் அல்லது பணி உறுதியாகத் தெரியவில்லை; அது இசை அல்லது வழிபாட்டில் ஓர் இடைநிறுத்தத்தைக் குறித்திருக்கலாம். எனவே அது ஒலிபெயர்ப்பாகவே வைக்கப்பட்டுள்ளது.
    reason: cultural_note
lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  choice: அவருடைய இதயத்தின் விருப்பம்
  rationale: எபிரேயச் சொற்றொடர் உள்ளார்ந்த விருப்பம் அல்லது ஏக்கத்தைக் குறிக்கிறது. ‘இதயத்தின் விருப்பம்’ என்பது மூலத்தின் உருவகத்தையும் பொருளையும் இயல்பான தமிழில் காக்கிறது.
