- source_word: וַאֲרֶשֶׁת
  choice: வேண்டுகோள்
  rationale: அரிதாக வரும் இச்சொல், இணைவரியின் ‘இதயத்தின் விருப்பம்’ வாயால் வெளிப்படுத்தப்படுவதைக் குறிக்கும் வேண்டுதல் அல்லது விண்ணப்பம் எனப் பொதுவாகப் புரிந்துகொள்ளப்படுகிறது.
- source_word: שְׂפָתָיו
  choice: அவருடைய உதடுகளின்
  rationale: பேசப்பட்ட வேண்டுகோளைச் சித்தரிக்கும் எபிரேய உருவகத்தை நேரடியாகக் காக்கிறது.
- source_word: בַּל מָנַעְתָּ
  choice: நீர் மறுக்கவில்லை
  rationale: ‘கொடுக்காமல் தடுத்துவைக்கவில்லை’ என்ற மூலப் பொருளை இயல்பான, செறிவான தமிழில் தருகிறது.
- source_word: סֶּלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான பொருளும் வழிபாட்டு அல்லது இசைச் செயல்பாடும் உறுதியாகத் தெரியாததால், பொருள் ஊகித்து மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
