source:
  edition: WLC
  text: כִּֽי תְשִׁיתֵ֣/הוּ בְרָכ֣וֹת לָ/עַ֑ד תְּחַדֵּ֥/הוּ בְ֝/שִׂמְחָ֗ה אֶת פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/006.yaml
  text: For you make him blessings forever[b][a]; you gladden him with joy in your presence.
translation:
  language: ta
  text: ஏனெனில், நீர் அவரை என்றென்றும் ஆசீர்வாதங்கள் நிறைந்தவராக்குகிறீர்[a]; உமது முன்னிலையில் மகிழ்ச்சியால் அவரைக் களிகூரச் செய்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லளவில், “நீர் அவரை என்றென்றும் ஆசீர்வாதங்களாக ஆக்குகிறீர்.” “நீர் அவர்மேல் என்றென்றும் ஆசீர்வாதங்களை வைக்கிறீர்” என்றும், “நீர் அவரை என்றென்றும் ஓர் ஆசீர்வாதமாக்குகிறீர்” என்றும் பொருள் கொள்ளலாம். எபிரேயச் சொற்றொடர் செறிவானது; அரசன் ஆசீர்வாதங்களைப் பெறுவதையோ, அவரே ஆசீர்வாதத்தின் ஊற்றாக அல்லது உருவகமாக ஆக்கப்படுவதையோ இது சுட்டலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்பாக இயல்பாக அமைகிறது.
- source_word: תְשִׁיתֵהוּ בְרָכוֹת
  choice: அவரை ... ஆசீர்வாதங்கள் நிறைந்தவராக்குகிறீர்
  rationale: ‘அவரை ஆசீர்வாதங்களாக வைக்கிறீர்/ஆக்குகிறீர்’ என்ற எபிரேயச் சொற்றொடரின் செறிவையும் பன்மையையும் இயன்றவரை காத்து, நவீனத் தமிழில் புரியும்படி வழங்குகிறது. சொற்றொடரின் பிற சாத்தியமான நுணுக்கங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לָעַד
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவில்லாத காலத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: תְּחַדֵּהוּ
  choice: அவரைக் களிகூரச் செய்கிறீர்
  rationale: களிப்பை உண்டாக்கும் காரணவினைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְשִׂמְחָה
  choice: மகிழ்ச்சியால்
  rationale: மகிழ்ச்சியை களிகூரச் செய்யும் வழியாகவோ காரணமாகவோ காட்டும் בְ முன்னிடைச்சொல்லின் பொருளைப் பிரதிபலிக்கிறது.
- source_word: אֶת־פָּנֶיךָ
  choice: உமது முன்னிலையில்
  rationale: சொல்லளவில் ‘உமது முகத்துடன்/முகத்தின் முன்’ என்று உள்ள இறைமுகத்தைக் குறிக்கும் மொழிவழக்கை இயல்பான தமிழில் இறைசந்நிதி அல்லது முன்னிலை என வழங்குகிறது.
theological_decisions:
- issue: תְשִׁיתֵהוּ בְרָכוֹת என்ற செறிவான சொற்றொடரின் பொருள்
  choice: அரசன் மிகுதியாக ஆசீர்வதிக்கப்பட்டவராகச் சித்தரிக்கப்படுகிறார்; பன்மை வடிவம் முதன்மை உரையில் காக்கப்படுகிறது.
  alternative: நீர் அவர்மேல் என்றென்றும் ஆசீர்வாதங்களை வைக்கிறீர்; அல்லது நீர் அவரை என்றென்றும் ஓர் ஆசீர்வாதமாக்குகிறீர்.
  rationale: எபிரேயப் பன்மையான ‘ஆசீர்வாதங்கள்’ என்பது அரசனுக்கு அளிக்கப்படும் மிகுந்த ஆசீர்வாதத்தையோ, அவனே ஆசீர்வாதத்தின் வடிவமாக அல்லது ஊற்றாக ஆக்கப்படுவதையோ குறிக்கலாம். குறிப்பாக மேசியாவைப் பற்றியதாகவோ வெறும் பொருளாதார வளத்தைப் பற்றியதாகவோ இதைச் சுருக்காமல், அந்தத் திறந்த பொருளை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனை நோக்கும் மரியாதைப் பன்மையும் ‘உமது’ என்ற வடிவமும் பயன்படுத்தப்பட்டுள்ளன; எபிரேய மூலத்தின் அசாதாரணமான ‘ஆசீர்வாதங்கள்’ பன்மை முழுமையாகச் சீராக்கப்படாமல், வாசிக்கத்தக்க அளவில் காக்கப்பட்டுள்ளது.
