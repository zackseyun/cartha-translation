base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/005.yaml
  text: And of Zion it will be said[a], “This one and that one were born in her,” and the Most High himself will establish her.
translation:
  language: ta
  text: சீயோனைக் குறித்து, “இவரும் அவரும் அவளில் பிறந்தவர்கள்” என்று சொல்லப்படும்[a]; உன்னதமானவரே அவளை நிலைநிறுத்துவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒருவர்பின் ஒருவராக அவளில் பிறந்தவர்கள்.” எபிரெயத்தில் “மனிதனும் மனிதனும்” என்று மீண்டும் கூறப்படுவது, ஒவ்வொரு நபரையும் தனித்தனியாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלֲצִיּוֹן
  choice: சீயோனைக் குறித்து
  rationale: לְ இங்கு சீயோனைப் பேச்சின் பொருளாக அறிமுகப்படுத்துகிறது; ‘குறித்து’ என்பது இயல்பான நவீனத் தமிழ் வடிவம். וְ கவிதைத் தொடர்ச்சியில் தமிழில் தனியே வெளிப்படுத்தப்பட வேண்டியதில்லை.
- source_word: יֵאָמַר
  choice: என்று சொல்லப்படும்
  rationale: אמר என்பதன் நிஃபால் முற்றுப்பெறா வடிவத்தின் ஆளற்ற செயப்பாட்டு உணர்வை இது காக்கிறது.
- source_word: אִישׁ וְאִישׁ
  choice: இவரும் அவரும்
  rationale: மீண்டும் வரும் אִישׁ ஒவ்வொருவராகப் பகிர்ந்துரைக்கும் பொருளுடையது. ‘இவரும் அவரும்’ அந்தத் தனித்தனி நபர் உணர்வை இயல்பான தமிழில் காக்கிறது.
- source_word: יֻלַּד בָּהּ
  choice: அவளில் பிறந்தவர்கள்
  rationale: வினை எபிரெயத்தில் ஒருமையாக இருந்தாலும், பகிர்ந்துரைக்கும் இரு நபர்களுக்கு ஏற்ற தமிழ்ப் பயனிலையில் பன்மை அமைப்பு இயல்பானது; ‘அவளில்’ என்பது சீயோன் நகரத்தின் பெண்பால் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וְהוּא
  choice: அவரே
  rationale: தனிப்பெயர்ச்சொல்லின் வலியுறுத்தலை ஏகாரத்தால் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְכוֹנְנֶהָ
  choice: அவளை நிலைநிறுத்துவார்
  rationale: כון வேரின் நிறுவுதல், உறுதியாக்குதல் ஆகிய பொருள் பரப்பை ‘நிலைநிறுத்துவார்’ தெளிவாகவும் கவித்துவமாகவும் தருகிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: இது தேவனுக்குரிய பட்டப்பெயர்; ‘உன்னதமானவர்’ மரியாதையும் உயர்ந்த கவிதை நடையும் கொண்ட தெளிவான தமிழ் வடிவம்.
theological_decisions:
- issue: וְהוּא עֶלְיוֹן என்பதில் வலியுறுத்தப்பட்ட தனிப்பெயர்ச்சொல்லின் சுட்டுப்பொருள்
  choice: ‘உன்னதமானவரே’ என்று தேவனைக் குறிக்கும் வலியுறுத்தலாக மொழிபெயர்த்தல்
  alternative: ‘அவர், உன்னதமானவர், அவளை நிலைநிறுத்துவார்’
  rationale: எபிரெயச் சொற்றொடர் சீயோனின் நிலைத்தன்மையை உன்னதமானவரின் சொந்த செயலோடு இணைக்கிறது. ‘-ஏ’ வலியுறுத்தலைக் காக்கிறது; உரையில் இல்லாத மேலதிக கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை. சீயோன் பெண்பாலில் உருவகப்படுத்தப்படுவதால் ‘அவளில்’, ‘அவளை’ என்பவை தக்கவைக்கப்பட்டுள்ளன.
