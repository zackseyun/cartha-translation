base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/000.yaml
  text: A psalm of the sons of Korah[a]; a song[c][b]. Its foundation is in the holy mountains.
translation:
  language: ta
  text: 'கோராகின் மகன்களுக்குரிய சங்கீதம்; ஒரு பாடல்.[a]


    அதன் அடித்தளம் பரிசுத்த மலைகளில் உள்ளது.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கோராகின் மகன்களுக்காக” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் அவர்களுடனான தொடர்பைக் காட்டுகிறது, ஆனால் நேரடி ஆசிரியத்துவத்தைத் தெளிவாகக் கூறவில்லை.
    reason: lexical_alternative
  - marker: b
    text: “அதன்” என்பது பெயரால் குறிப்பிடப்படாத சீயோனை அல்லது எருசலேமைச் சுட்டுவதாகப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: கோராகின் மகன்களுக்குரிய
  rationale: לְ இங்கு உரிமை, அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிக்கலாம். ‘மகன்களால் இயற்றப்பட்டது’ என்று ஆசிரியத்துவத்தைத் தீர்மானிக்காமல், அந்தக் குழுவுடனான தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: מִזְמוֹר שִׁיר
  choice: சங்கீதம்; ஒரு பாடல்
  rationale: மூலத்தில் உள்ள இரு இசை/இலக்கிய வகைப்பாட்டுச் சொற்களையும் தனித்தனியாகப் பேணுகிறது; நிறுத்தக்குறி அவற்றை ஒரே தலைப்பின் கூறுகளாக இணைக்கிறது.
- source_word: יְסוּדָתוֹ
  choice: அதன் அடித்தளம்
  rationale: பெயரிடப்படாத ஒரு இடத்தைக் குறிக்கும் மூன்றாம் நபர் பின்னொட்டை அப்படியே வைத்திருக்கிறது; சீயோன் அல்லது எருசலேம் என்று முதன்மை உரையில் வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: பரிசுத்த மலைகளில்
  rationale: பன்மையான ‘மலைகள்’ என்பதையும், ‘பரிசுத்தம்’ என்ற பெயர்ச்சொல் தரும் பண்புப் பொருளையும் தெளிவான நவீன தமிழில் வழங்குகிறது.
theological_decisions:
- issue: கோராகின் மகன்களுக்கும் சங்கீதத்திற்கும் உள்ள உறவு
  choice: ‘மகன்களுக்குரிய’ என்று தொடர்பைத் திறந்த நிலையில் வைத்தல்
  alternative: ‘மகன்களால் இயற்றப்பட்ட’ அல்லது ‘மகன்களுக்காக’
  rationale: எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவம், பயன்பாடு அல்லது அர்ப்பணிப்பு ஆகியவற்றில் ஒன்றைத் தனியாக நிர்ணயிக்கவில்லை.
- issue: ‘அதன்’ என்பதன் மறைமுகக் குறிப்பு
  choice: முதன்மை உரையில் குறிக்கப்படும் இடத்தின் பெயரைச் சேர்க்காமல் வைத்தல்
  alternative: ‘சீயோனின் அடித்தளம்’ அல்லது ‘எருசலேமின் அடித்தளம்’
  rationale: சூழல் சீயோன்/எருசலேமைச் சுட்டக்கூடும்; ஆனால் இந்த வரியில் அந்தப் பெயர் நேரடியாக இல்லை. ஆகவே விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையையும் கவிதைத் தலைப்பின் சுருக்கத்தையும் பேணும் நடை. ‘சங்கீதம்’, ‘பரிசுத்த’ போன்ற பரவலாக அறியப்படும் வேதாகமச் சொற்கள் வைக்கப்பட்டுள்ளன; மறைமுகமான குறிப்புகள் விளக்கமாக முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
