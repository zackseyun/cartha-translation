id: PSA.87.7
reference: Psalms 87:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/שָׁרִ֥ים כְּ/חֹלְלִ֑ים כָּֽל מַעְיָנַ֥/י בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/007.yaml
  text: Singers and dancers alike say[b][a], “All my springs are in you.”
translation:
  language: ta
  text: பாடுவோரும் ஆடுவோரும்[a], “என் ஊற்றுகள் அனைத்தும் உன்னில் இருக்கின்றன”[b] என்று சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஆடுவோர்’ என்பதற்குப் பதிலாக ‘குழல் இசைப்போர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொதுவாக ஆடுதல் அல்லது சுழன்று ஆடுதலைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது; அது ஓர் இசைக்கருவியை இசைப்பதைக் குறிக்கலாம் என்றும் சிலர் கருதுகின்றனர்.
    reason: lexical_alternative
  - marker: b
    text: ‘என் ஊற்றுகள் அனைத்தும் உன்னில் இருக்கின்றன’ என்பது கவித்துவ உருவகம்; ‘என் நீரூற்றுகள் அனைத்தும்’ அல்லது ‘என் வாழ்வின் ஆதாரங்கள் அனைத்தும் உன்னில் இருக்கின்றன’ என்ற பொருளை இது தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרִים
  choice: பாடுவோரும்
  rationale: שׁיר (‘பாடு’) என்ற வினையின் பங்கேற்பு வடிவமாக இதைப் புரிந்துகொள்வது, இணையாக வரும் ஆடுவோரைக் குறிக்கும் சொல்லுடன் இயல்பாகப் பொருந்துகிறது. ‘தலைவர்கள்’ என்ற சாத்தியமான மெய்யெழுத்து வாசிப்பு இச்சூழலில் குறைவாகப் பொருந்துகிறது.
- source_word: כְּחֹלְלִים
  choice: ஆடுவோரும்
  rationale: இந்தச் சொல் ஆடுதல் அல்லது சுழன்று ஆடுதல் என்ற பொருளில் வரும் חול என்பதோடு தொடர்புடையதாகப் பாரம்பரியமாகப் புரிந்துகொள்ளப்படுகிறது. சுருக்கமான எபிரெயக் கவிநடையில் பாடுவோரும் ஆடுவோரும் ஒன்றாக உரைப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘குழல் இசைப்போர்’ என்ற மாற்று அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: כָּל
  choice: அனைத்தும்
  rationale: முழுமையைக் குறிக்கும் כָּל என்பதன் பொருளைத் தெளிவாகத் தருகிறது; தமிழ் கவிநடையிலும் இயல்பாக உள்ளது.
- source_word: מַעְיָנַי
  choice: என் ஊற்றுகள்
  rationale: מַעְיָן என்பது நீரூற்று அல்லது ஊற்றைக் குறிக்கிறது. ‘ஊற்றுகள்’ என்ற உருவகத்தை அப்படியே காத்து, ‘ஆதாரங்கள்’ அல்லது ‘ஆசீர்வாதங்கள்’ என்று விளக்கமாக மாற்றுவதைத் தவிர்க்கிறது.
- source_word: בָּךְ
  choice: உன்னில்
  rationale: בְּ என்ற முன்னிடைச்சொல்லின் அடிப்படை இடப்பொருளைத் தக்கவைக்கிறது. பெண்பால் ஒருமையில் அழைக்கப்படும் சீயோனை நோக்கிய கவித்துவ உரையாக இது உள்ளது.
theological_decisions:
- issue: சீயோனை நோக்கி உரைக்கப்படும் ‘என் ஊற்றுகள்’ என்ற உருவகத்தின் பொருள்
  choice: ‘என் ஊற்றுகள் அனைத்தும் உன்னில் இருக்கின்றன’ என்று உருவகத்தைத் தீர்மானமான விளக்கமின்றித் தக்கவைத்தல்
  alternative: ‘என் வாழ்வின் ஆதாரங்கள் அனைத்தும் உன்னில் உள்ளன’ அல்லது ‘என் ஆசீர்வாதங்கள் அனைத்தும் உன்னில் உள்ளன’
  rationale: சங்கீதம் சீயோனைச் சார்பு, உயிர் மற்றும் வளத்தின் மையமாகச் சித்தரிக்கக்கூடும்; ஆனால் எபிரெய உருவகம் பல பொருள்நிழல்களைத் தாங்குகிறது. ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கமாக அதைச் சுருக்காமல் கவித்துவத் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கவித்துவக் கண்ணியமும் இணைக்கப்பட்டுள்ளன. மூலத்தின் சுருக்கமான அமைப்பைத் தமிழில் தெளிவாக்க ‘என்று சொல்கிறார்கள்’ சேர்க்கப்பட்டுள்ளது; இது தனிப்பட்ட பேச்சாளரை நிர்ணயிக்காமல் பாடுவோர் மற்றும் ஆடுவோர் உரைப்பதாகக் காட்டுகிறது.
