  text: A psalm of the sons of Korah[a]; a song[c][b]. His foundation is in the holy mountains.
translation:
  language: ta
  text: கோராகின் மகன்களுக்குரிய சங்கீதமும் பாடலும்[a]. அவருடைய அடித்தளம் பரிசுத்த மலைகளில் உள்ளது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கோராகின் மகன்களுக்காக’ அல்லது ‘கோராகின் மகன்களைச் சேர்ந்த’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய முன்னொட்டு தொடர்பைக் குறிக்கிறது, நேரடி ஆசிரியத்துவத்தை மட்டும் கட்டாயப்படுத்துவதில்லை.
    reason: lexical_alternative
  - marker: b
    text: ‘அதன் அடித்தளம் பரிசுத்த மலைகளில் உள்ளது’ என்றும் மொழிபெயர்க்கலாம். எபிரெய பின்னொட்டு ஆண்பால் ஒருமையில் இருந்தாலும், அது யாரை அல்லது எதைச் சுட்டுகிறது என்பது இவ்வசனத்தில் வெளிப்படையாகக் கூறப்படவில்லை; சீயோன் அல்லது எருசலேம் மறைமுகக் குறிப்பாக இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: கோராகின் மகன்களுக்குரிய
  rationale: לְ முன்னொட்டு உரிமை, தொடர்பு அல்லது அர்ப்பணிப்பைக் குறிக்கலாம். ‘மகன்களுக்குரிய’ என்பது நேரடி ஆசிரியத்துவத்தைத் தீர்மானிக்காமல் அந்தத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: சங்கீத நூலின் இசை-இலக்கிய வகையைக் குறிக்கும் நிலைபெற்ற, புரிந்துகொள்ளத்தக்க தமிழ்ச் சொல்.
- source_word: שִׁיר
  choice: பாடல்
  rationale: எபிரெய உரையில் உள்ள இரட்டை வகைப்பாட்டைச் சுருக்காமல், מִזְמוֹר என்பதிலிருந்து தனியாக மொழிபெயர்க்கிறது.
- source_word: יְסוּדָתוֹ
  choice: அவருடைய அடித்தளம்
  rationale: יסד வேரிலிருந்து வந்த பெயர்ச்சொல் ‘அடித்தளம்’ என்று பொருள்படும்; 3ஆம் ஆண்பால் ஒருமை பின்னொட்டை ‘அவருடைய’ என வெளிப்படுத்தி, அதன் சுட்டுப்பொருளை முதன்மை உரையில் வெளிப்படையாக நிர்ணயிக்கவில்லை.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: பரிசுத்த மலைகளில்
  rationale: בְ என்பதன் இடப்பொருளையும், קֹדֶשׁ மலைகளைப் பரிசுத்தமானவை என வருணிப்பதையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְסוּדָתוֹ என்பதிலுள்ள சுட்டுப்பெயர் பின்னொட்டின் குறிப்பு
  choice: ‘அவருடைய அடித்தளம்’ என்று வைத்து, குறிக்கப்படுபவர் யார் என்பதை முதன்மை உரையில் சொல்லாமல் விடுதல்
  alternative: ‘அதன் அடித்தளம்’ என்று சீயோன் அல்லது எருசலேமைக் குறிப்பதாக மொழிபெயர்த்தல்; அல்லது ‘அவர் அதை நிறுவினார்’ என்று விரித்துரைத்தல்
  rationale: எபிரெய உரையில் ஆண்பால் ஒருமைப் பின்னொட்டு உள்ளது; ஆனால் இவ்வசனத்திற்குள் அதன் முன்னிலைப் பெயர் வெளிப்படையாக இல்லை. ஆகவே கடவுளை அல்லது சீயோனைத் திட்டவட்டமாகச் சேர்க்காமல் மூலத்தின் கவித்துவத் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைத்த எளிய நடை. தலைப்பிலுள்ள ‘சங்கீதம்; ஒரு பாடல்’ என்ற இரட்டை வகைப்பாடு பாதுகாக்கப்பட்டுள்ளது; அரைப்புள்ளி இரண்டையும் ஒரே தலைப்பாக இணைக்கிறது.
