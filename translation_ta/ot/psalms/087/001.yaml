- from: கோராகின் மகன்களுக்குரிய சங்கீதம்[a]; ஒரு பாடல். அவருடைய அடித்தளம் பரிசுத்த மலைகளில் உள்ளது[b].
  to: கோராகின் மகன்களுக்குரிய சங்கீதமும் பாடலும்[a]. அவருடைய அடித்தளம் பரிசுத்த மலைகளில் உள்ளது[b].
