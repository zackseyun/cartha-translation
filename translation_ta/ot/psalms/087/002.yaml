  rationale: இவ்வடிவம் சீயோனின் வாசல்களுக்கு அளிக்கப்படும் சிறப்பான நேசத்தை யாக்கோபின் மற்ற குடியிருப்புகளோடு ஒப்பிடுவதை வெளிப்படையாக்குகிறது; மாற்று வடிவம் அதே அடிப்படைப் பொருளைச் சற்றுக் கவிதைநயத்துடன் தருகிறது.
