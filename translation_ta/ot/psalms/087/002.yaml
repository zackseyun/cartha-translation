lexical_decisions:
- source_word: אֹהֵב
  choice: நேசிக்கிறார்
  rationale: אהב என்பதன் Qal வினையெச்சம் இங்கு யெகோவாவை எழுவாயாகக் கொண்டு வினையாகச் செயல்படுகிறது. ‘நேசிக்கிறார்’ என்பது அதன் தொடரும் பொதுவான பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது; ஆகவே ஒரு பட்டத்தால் மாற்றாமல் தமிழில் நிலைபெற்றுள்ள ‘யெகோவா’ என்ற ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: שַׁעֲרֵי
  choice: வாசல்களை
  rationale: שַׁעַר என்பதன் பன்மை இணைப்புவடிவம். இது நகரைக் குறிக்கும் ஆகுபெயராகவும் இருக்கக்கூடும்; எனினும் மூலத்தின் தெளிவான வாசல் உருவகம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- source_word: צִיּוֹן
  choice: சீயோன்
  rationale: இடப்பெயர் மொழிபெயர்க்கப்படாமல், தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: מִכֹּל
  choice: அனைத்தையும்விட அதிகமாக
  rationale: விருப்பம் அல்லது நேசத்தைக் குறிக்கும் வினைக்குப் பின் வரும் מִן + כֹּל ஒப்பீட்டுப் பொருளைத் தருகிறது. இத்தமிழ் வடிவம் சீயோனின் வாசல்களுக்கும் யாக்கோபின் மற்ற குடியிருப்புகளுக்கும் இடையிலான ஒப்பீட்டைத் தெளிவாக்குகிறது.
- source_word: מִשְׁכְּנוֹת
  choice: குடியிருப்புகள்
  rationale: מִשְׁכָּן என்பதன் பன்மை இங்கு வழிபாட்டுக்கூடாரங்களை அல்ல, வாழும் இடங்களைக் குறிக்கிறது. ‘குடியிருப்புகள்’ நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
