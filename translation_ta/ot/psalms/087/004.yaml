base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/004.yaml
  text: 'I will mention Rahab and Babylon among those who know me[a]; behold, Philistia and Tyre[c][b], along with Cush: this one was born there.'
translation:
  language: ta
  text: என்னை அறிந்தவர்களுள்[b] ராகாபையும்[a] பாபிலோனையும் நான் குறிப்பிடுவேன்; இதோ, பெலிஸ்தியாவும் தீருவும், அவற்றோடு கூஷும்—இவன் அங்கே[c] பிறந்தான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ராகாப்’ என்பது எகிப்துக்கான கவிதைப் பெயர்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘என்னை அறிந்தவர்களிடம்.’ எபிரெயத் தொடர், பேசுபவரை ஏற்றுக்கொள்கிறவர்களிடம் அவர் இந்நாடுகளைக் குறிப்பிடுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அதாவது, இச்சங்கீதத்தின் சூழலின்படி சீயோனில்.
    reason: cross_reference
lexical_decisions:
- source_word: אַזְכִּיר
  choice: நான் குறிப்பிடுவேன்
  rationale: זכר என்பதன் ஹிஃபில் வடிவம் இங்கு ‘குறிப்பிடுதல், பெயரெடுத்துச் சொல்லுதல்’ என்ற பொருளைத் தருகிறது. நாடுகளின் பட்டியலை அறிமுகப்படுத்தும் கவிதைச் சூழலில் ‘குறிப்பிடுவேன்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: רַהַב
  choice: ராகாப்
  rationale: கவிதை எபிரெயில் இது எகிப்தைக் குறிக்கும் பெயர். மூலத்தின் உருவகப் பெயரை முதன்மை உரையில் ஒலிபெயர்த்து, அதன் குறிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: וּבָבֶל
  choice: பாபிலோன்
  rationale: இது இடப்பெயர்; தமிழில் பரவலாக அறியப்பட்ட வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: לְיֹדְעָי
  choice: என்னை அறிந்தவர்களுள்
  rationale: לְ என்ற முன்னொட்டுடன் வரும் இச்சுருக்கமான கவிதைத் தொடர், பேசுபவரை அறிந்தோர் கூட்டத்தில் இந்நாடுகள் சேர்க்கப்படுவதைச் சுட்டலாம். ‘அறிந்தவர்களுள்’ அந்த வாசிப்பைத் தருகிறது; ‘அறிந்தவர்களிடம்’ என்ற மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தைத் திருப்பும் எபிரெயச் சொல்லின் வலிமையையும் கவிதை நடையையும் இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: פְלֶשֶׁת
  choice: பெலிஸ்தியா
  rationale: மூலம் மக்களை அல்ல, நிலப்பகுதியின் பெயரையே பயன்படுத்துவதால் இடப்பெயர் வடிவம் காக்கப்படுகிறது.
- source_word: וְצוֹר
  choice: தீரு
  rationale: இடப்பெயரின் வழக்கமான தமிழ் வேதாகம வடிவம்.
- source_word: עִם כּוּשׁ
  choice: அவற்றோடு கூஷும்
  rationale: עִם குறிக்கும் உடனிணைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது; கூஷ் முன் சொல்லப்பட்ட இடங்களோடு பட்டியலிடப்படுவதைத் தெளிவாக்குகிறது.
- source_word: כּוּשׁ
  choice: கூஷ்
  rationale: வரலாற்றுப் புவியியல் எல்லையை நவீன எத்தியோப்பியாவுடன் தவறாகச் சமப்படுத்தாமல், மூல இடப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: זֶה
  choice: இவன்
  rationale: எபிரெயில் ஆண்பால் ஒருமைச் சுட்டுப்பெயர் உள்ளது. பட்டியலிடப்பட்ட மக்களிலிருந்து ஒருவரைத் தனித்தனியாகச் சுட்டும் வலிமையை ‘இவன்’ காக்கிறது.
- source_word: יֻלַּד שָׁם
  choice: அங்கே பிறந்தவன்
  rationale: ילד என்பதன் செயப்பாட்டு வடிவமும் שָׁם என்ற இடவினையுரிச்சொல்லும் பிறந்த இடத்தைக் குறிக்கின்றன. தமிழ் பெயரெச்சத் தொடரான இவ்வடிவம் முன் வரும் ‘இவன்’ என்பதோடு இயல்பாக இணைகிறது.
theological_decisions:
- issue: ‘என்னை அறிந்தவர்கள்’ என்பதில் முதல் நபராகப் பேசுபவர் யார்?
  choice: முதல் நபர் வடிவத்தை அப்படியே வைத்து, பேசுபவரை முதன்மை உரையில் அடையாளப்படுத்தவில்லை.
  alternative: பேசுபவர் ஆண்டவர்; அல்லது சீயோன் ஆளுருவாக்கப்பட்டுப் பேசுகிறது.
  rationale: சங்கீதத்தின் சூழல் ஆண்டவரையும் சீயோனையும் முன்னிறுத்தினாலும், இவ்வரியின் எபிரெய உரை பேசுபவரை வெளிப்படையாகப் பெயரிடவில்லை. ஆகவே இலக்கிய-இறையியல் பதற்றம் சூழலுக்கே விடப்படுகிறது.
- issue: ‘அங்கே’ என்பதன் குறிப்பு
  choice: மூலத்திலுள்ள இடவினையுரிச்சொல்லை ‘அங்கே’ எனக் காத்து, சீயோனை முதன்மை உரையில் நேரடியாகச் சேர்க்கவில்லை.
  alternative: ‘சீயோனில்’ அல்லது ‘தேவனுடைய நகரத்தில்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: சங்கீதத்தின் சூழலில் ‘அங்கே’ என்பது சீயோனைச் சுட்டுவதாகத் தெரிந்தாலும், எபிரெய உரை இடப்பெயரை இவ்வரியில் மீண்டும் கூறவில்லை. விளக்கம் அடிக்குறிப்பில் வழங்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான கவிதை நடை பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ போன்ற உயர்நடைச் சொல் மூலத்தின் கவன ஈர்ப்பு வலிமையைத் தக்கவைக்கிறது. இடப்பெயர்கள் தமிழ் வாசகர்களுக்கு அறிமுகமான ஒலிபெயர்ப்பு வடிவங்களில் தரப்பட்டுள்ளன; மூலத்தின் சுருக்கமும் தெளிவின்மையும் தேவையின்றி விரிவாக்கப்படவில்லை.
