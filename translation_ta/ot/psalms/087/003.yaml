lexical_decisions:
- source_word: נִכְבָּדוֹת
  choice: மகிமையான காரியங்கள்
  rationale: כבד என்பதிலிருந்து வந்த பெண்பால் பன்மை வடிவம் இங்கு பெயர்ச்சொல் போலப் பயன்பட்டு, பெருமை, மேன்மை, மகிமை வாய்ந்தவற்றைக் குறிக்கிறது. சங்கீதத்தின் உயர்ந்த புகழ்ச்சித் தொனிக்கு “மகிமையான காரியங்கள்” இயல்பாகப் பொருந்துகிறது.
- source_word: מְדֻבָּר
  choice: பேசப்படுகின்றன
  rationale: דבר வேரின் புஅல் பங்கேற்பு வடிவம்; נִכְבָּדוֹת என்பதுடன் இணைந்து கூறப்படும் மகிமையான காரியங்களைப் பற்றிய தொடர்ந்த அல்லது நிலையான பேச்சை வெளிப்படுத்துகிறது. தமிழில் செயப்பாட்டு பன்மை வினை இதைத் தெளிவாகக் கொண்டுவருகிறது.
- source_word: בָּךְ
  choice: உன்னைக் குறித்து
  rationale: ב முன்னிடைச்சொல் இங்கு “உன்னைப் பற்றி/உன்னைக் குறித்து” என்ற பொருளை இயல்பாகக் கொடுக்கலாம்; அதேவேளை “உன்னில்” என்றும் எடுத்துக்கொள்ள முடிவதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עִיר הָאֱלֹהִים
  choice: கடவுளின் நகரமே
  rationale: இது “கடவுளின் நகரம்” என்ற உடைமைத் தொகை. முந்தைய இரண்டாம் நபர் ஒருமை வடிவத்துடன் சேர்ந்து நகரத்தை நேரடியாக விளிப்பதால், தமிழ் விளி வேற்றுமையான “நகரமே” இயல்பாகவும் கவித்துவமாகவும் உள்ளது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியற்றது; இது வழிபாட்டு அல்லது இசைக் குறியீடாக இருக்கலாம். பொருளை ஊகித்து மொழிபெயர்க்காமல் எபிரெய ஒலிப்பைத் தமிழில் எழுத்துப்பெயர்த்துள்ளோம்.
