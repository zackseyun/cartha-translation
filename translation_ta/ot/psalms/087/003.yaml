translation:
  language: ta
  text: மகிமையான காரியங்கள் உன்னைக் குறித்துப் பேசப்படுகின்றன[a], கடவுளின் நகரமே! சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன்னைப் பற்றிப் பேசப்படுகின்றன” அல்லது “உன்னில் பேசப்படுகின்றன.” இங்குள்ள எபிரெய முன்னிடைச்சொல்லை ஒன்றுக்கு மேற்பட்ட விதங்களில் மொழிபெயர்க்கலாம்; சூழலில் சீயோனைப் புகழ்ந்து கூறுவது முதன்மையாகத் தோன்றுவதால் “உன்னைக் குறித்து” என மொழிபெயர்க்கப்பட்டுள்ளது.
