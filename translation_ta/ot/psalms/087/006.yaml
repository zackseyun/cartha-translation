  yaml_path: translation/ot/psalms/087/006.yaml
  text: Yahweh will count[a], when he records the peoples, “This one was born there.” Selah
translation:
  language: ta
  text: 'யாவே மக்களினங்களைப் பதிவுசெய்யும்போது,


    “இந்த நபர் அங்கே[a] பிறந்தவர்” என்று கணக்கிடுவார்.


    சேலா'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, சூழலின்படி, “அவளில்”; இது சுற்றியுள்ள வசனங்களில் குறிப்பிடப்படும் சீயோனைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: יִסְפֹּר
  choice: கணக்கிடுவார்
  rationale: ספר என்ற வினையின் அடிப்படைப் பொருளான ‘எண்ணுதல்/கணக்கிடுதல்’ என்பதைக் காக்கிறது; மக்களினங்களைப் பதிவுசெய்வது என்ற தொடர்ச்சி இங்கு பதிவேட்டுச் சூழலைத் தெளிவாக்குகிறது.
- source_word: בִּכְתוֹב
  choice: பதிவுசெய்யும்போது
  rationale: בְּ + வினையெச்சப் பெயர் இங்கு காலப் பொருளில் வருவதால், ‘எழுதும்போது’ என்பதைக் காட்டிலும் பதிவேட்டுச் சூழலுக்கு இயல்பான ‘பதிவுசெய்யும்போது’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַמִּים
  choice: மக்களினங்களை
  rationale: பல தனித்த மக்கள் குழுக்களைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது; ‘தேசங்கள்’ என்பது அரசியல் நிலப்பரப்பை தேவையின்றி முன்னிறுத்தக்கூடும்.
- source_word: זֶה
  choice: இவன்
  rationale: ஆண்பால் ஒருமைச் சுட்டுப்பெயரைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; எபிரெயத்தில் இல்லாத கூடுதல் அடையாளத்தைச் சேர்ப்பதில்லை.
- source_word: יֻלַּד
  choice: பிறந்தவன்
  rationale: செயப்பாட்டு வடிவின் ‘பிறந்தான்/பிறந்தவன்’ என்ற நேரடியான பொருளை, பதிவேட்டில் சொல்லப்படும் அடையாளக் கூற்றாக இயல்பாகத் தருகிறது.
- source_word: שָׁם
  choice: அங்கே
  rationale: எபிரெயச் சொல்லின் நேரடியான இடவினையடைப் பொருளைக் காக்கிறது; சூழலில் அது சீயோனைக் குறித்தாலும், முதன்மை உரையில் அந்தப் பெயரை வெளிப்படையாகச் சேர்க்கவில்லை.
- source_word: סֶלָה
  choice: சேலா
  rationale: இசை அல்லது வழிபாட்டுக்குரிய இச்சொல்லின் துல்லியமான பொருள் உறுதியற்றதால், பொருளை ஊகித்து மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: உடன்படிக்கையின் தனிப்பட்ட இறைப் பெயரைப் பட்டமாக மாற்றாமல் காக்கிறது; குறிப்பிட்ட சமய மரபின் மாற்றீட்டையும் திணிக்கவில்லை.
- issue: שָׁם என்பதன் இடச்சுட்டை வெளிப்படையாக்க வேண்டுமா
  choice: அங்கே
  alternative: அவளில்; சீயோனில்
  rationale: சுற்றியுள்ள வசனங்களின்படி சீயோன் இதன் இடச்சுட்டாக இருப்பது தெளிவாக இருந்தாலும், எபிரெய உரை ‘அங்கே’ என்றே கூறுகிறது. ஆகவே உரையின் மறைமுகச் சுட்டை முதன்மை மொழிபெயர்ப்பு காக்கிறது; சூழல்சார்ந்த விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைக்குரிய கண்ணியத்துடன் வடிவமைக்கப்பட்டது. ‘பதிவுசெய்யும்போது … கணக்கிடுவார்’ என்பது மூலத்தின் பதிவேட்டு உருவகத்தையும் வினைகளின் வேறுபாட்டையும் காக்கிறது. வரி அமைப்பு எபிரெயக் கவிதையின் கூற்று மற்றும் மேற்கோளை வாசிக்க எளிதாக்குகிறது.
