translation:
  language: ta
  text: 'தங்கள் செல்வத்தை நம்பி,

    தங்கள் பெரும் செல்வவளத்தில் பெருமை பேசுகிறவர்கள்—[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் பெரும் செல்வவளத்தில் மேன்மை பாராட்டுகிறவர்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் חַיִל என்பதற்கு “வலிமை” அல்லது “வளங்கள்” என்றும் பொருள் வரலாம்; ஆனால் இங்கு இணையாக வரும் “செல்வம்” என்பதன் காரணமாக, பொருளாதாரச் செல்வமே குறிக்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים
  choice: நம்புகிறவர்கள்
  rationale: குறிப்பிட்ட பலரைக் குறிக்கும் Qal வினையெச்ச வடிவம்; தொடர்ந்து காணப்படும் இயல்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: -ஐ நம்பி
  rationale: בטח என்பதுடன் வரும் இம்முன்னிடைச்சொல் சார்ந்திருக்கும் பொருளைக் குறிக்கிறது; தமிழில் பொருளை நேரடியாக வேற்றுமை உருபால் கூறுவது இயல்பு.
- source_word: חֵילָם
  choice: தங்கள் செல்வத்தை
  rationale: חַיִל என்பதற்கு வலிமை, படை, வளங்கள், செல்வம் எனப் பல பொருள்கள் உண்டு; இணைவரியான עָשְׁרָם காரணமாக இங்கு பொருளாதாரச் செல்வமே சூழலுக்கு ஏற்றது.
- source_word: וּבְרֹב
  choice: பெரும்
  rationale: רֹב மிகுதி அல்லது ஏராளத்தைக் குறிக்கிறது. 'பெரும்' என்பது தமிழ்க் கவிதைநடையில் இயல்பாகவும் சுருக்கமாகவும் அந்த மிகுதியைத் தெரிவிக்கிறது.
- source_word: עָשְׁרָם
  choice: தங்கள் செல்வவளத்தை
  rationale: עֹשֶׁר செல்வம் அல்லது ஐசுவரியத்தைக் குறிக்கிறது. முதல் அடியின் 'செல்வம்' என்பதிலிருந்து ஓரளவு சொல்வேறுபாட்டைப் பேணி, செல்வத்தின் மிகுதியை உணர்த்த 'செல்வவளம்' தேர்ந்தெடுக்கப்பட்டது.
- source_word: יִתְהַלָּלוּ
  choice: பெருமை பேசுகிறவர்கள்
  rationale: הלל என்பதன் Hitpael வடிவம் இங்கு தற்பெருமை பாராட்டுதல் அல்லது மேன்மை பேசுதலைக் குறிக்கிறது; 'பெருமை பேசுதல்' சாதாரண நவீனத் தமிழில் தெளிவாக உள்ளது.
