  source_fidelity: மூல எபிரெயத்தின் காரணவியல் இணைப்பு (כִּי), மரணக் காலக்குறிப்பு, மறுப்புடன் வரும் ‘அனைத்தும்’ என்பதன் ‘எதையும் இல்லை’ என்ற இயல்பான பொருள், மற்றும் மகிமை/செல்வ-அந்தஸ்து ஆகிய பொருள் விரிவைத் துல்லியமாகக் காக்கிறது. ‘அவனைத் தொடர்ந்து கீழே இறங்காது’ என்பது יֵרֵד אַחֲרָיו என்பதன் கீழிறங்கும் உருவகத்தையும் குறிப்பிடப்படாத இலக்கையும் பாதுகாக்கிறது.
