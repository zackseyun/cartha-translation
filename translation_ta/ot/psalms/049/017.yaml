source:
  edition: WLC
  text: כִּ֤י לֹ֣א בְ֭/מוֹת/וֹ יִקַּ֣ח הַ/כֹּ֑ל לֹא יֵרֵ֖ד אַחֲרָ֣י/ו כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/017.yaml
  text: For at his death he will take nothing[c][b][a]; his glory will not go down after him.
translation:
  language: ta
  text: ஏனெனில், அவன் இறக்கும்போது எதையும் எடுத்துச் செல்லமாட்டான்[a]; அவனுடைய மகிமை[b] அவனைத் தொடர்ந்து கீழே இறங்காது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு வகையில்: ‘அதில் எதையும் அவன் எடுத்துக்கொள்ளமாட்டான்.’ சொல்லுக்கு சொல்: ‘அனைத்தையும் அவன் எடுத்துக்கொள்ளமாட்டான்.’'
    reason: lexical_alternative
  - marker: b
    text: ‘மகிமை’ என்பது அவனுடைய மரியாதை, பெருமை, செல்வச் செழிப்பு அல்லது அந்தஸ்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘கீழே இறங்காது’ என்பது மரணம், கல்லறை அல்லது பாதாளத்துக்குச் செல்வதைக் குறிக்கலாம்; ஆனால் எங்கு இறங்குவது என்பதை எபிரெய உரை வெளிப்படையாகச் சொல்லவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சிந்தனைக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்துகிறது; சங்கீதத்தின் வாத ஓட்டத்துக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: בְמוֹתוֹ
  choice: அவன் இறக்கும்போது
  rationale: ב முன்னொட்டும் ‘அவனுடைய மரணம்’ என்ற பெயர்ச்சொல்லும் இங்கு காலப் பொருளைக் கொடுக்கின்றன; நவீன தமிழில் இது இயல்பான வடிவம்.
- source_word: לֹא ... יִקַּח הַכֹּל
  choice: எதையும் எடுத்துச் செல்லமாட்டான்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘அனைத்தையும் எடுத்துக்கொள்ளமாட்டான்’; மறுப்புடன் வரும் הַכֹּל இச்சூழலில் ‘அதில் எதையும் எடுத்துக்கொள்ளமாட்டான்’ என்று பொருள்படும். மரணச் சூழலில் ‘எடுத்துச் செல்ல’ என்பது தமிழில் இயல்பாகவும் கருத்துத் தெளிவுடனும் உள்ளது.
- source_word: כְּבוֹדוֹ
  choice: அவனுடைய மகிமை
  rationale: כבוד என்பது மகிமை, கனம், மரியாதை, செல்வச் செழிப்பு அல்லது சமூக அந்தஸ்து ஆகிய பொருள் விரிவைக் கொண்டிருக்கலாம். ‘மகிமை’ அந்தப் பன்முகத்தன்மையையும் கவித்துவத்தையும் காக்கிறது.
- source_word: יֵרֵד אַחֲרָיו
  choice: அவனைத் தொடர்ந்து கீழே இறங்காது
  rationale: ירד என்பதன் கீழிறங்கும் உருவகத்தையும் אַחֲרָיו என்பதன் ‘அவனுக்குப் பின்/அவனைத் தொடர்ந்து’ என்ற பொருளையும் காக்கிறது; சேரும் இடத்தை மூலத்தைவிடத் தெளிவுபடுத்தவில்லை.
theological_decisions:
- issue: மரணத்துக்குப் பின் கீழிறங்குவதன் குறிப்பு
  choice: ‘அவனைத் தொடர்ந்து கீழே இறங்காது’ என்ற உருவகத்தை மட்டும் வைத்து, சேரும் இடத்தைக் குறிப்பிடாமல் விடுதல்
  alternative: ‘அவனோடு பாதாளத்துக்கு இறங்காது’ அல்லது ‘அவனோடு கல்லறைக்குச் செல்லாது’
  rationale: எபிரெயச் சொல் மரணம், கல்லறை அல்லது ஷியோலை நினைவூட்டினாலும், சேரும் இடத்தை வெளிப்படையாகக் கூறவில்லை. ஆகவே ஒரு குறிப்பிட்ட மறுமைநிலைக் கருத்தை உரையில் சேர்க்காமல் மூலத்தின் மறைபொருளையும் இறையியல் பதற்றத்தையும் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவித்துவ நடையைப் பயன்படுத்துகிறது. ‘எடுத்துச் செல்லமாட்டான்’ என்பது மரணத்தின் சூழலில் இயல்பான தமிழ்; ‘கீழே இறங்காது’ என்பது மூல எபிரெய உருவகத்தையும் அதன் திட்டமிட்ட மறைபொருளையும் காக்கிறது.
