  text: இதுதான் அவர்களுடைய வழி—அவர்களுடைய மூடத்தனம்[a]; ஆனாலும், அவர்களுக்குப் பின் வருகிறவர்கள் அவர்கள் சொல்வதை விரும்புகிறார்கள்[b]. சேலா.
