theological_decisions:
- issue: וְאַחֲרֵיהֶם என்பதன் குறிப்பு
  choice: அவர்களுக்குப் பின் வந்து, அவர்களைப் பின்பற்றுகிறவர்கள்
  alternative: அவர்களுடைய சந்ததியினர்
  rationale: எபிரெயத் தொடர் பொதுவான பின்வருவோரையோ குறிப்பாகச் சந்ததியினரையோ குறிக்கலாம். முதன்மை உரை அதை உயிரியல் உறவாக மட்டும் சுருக்காமல் திறந்த நிலையில் வைத்திருக்கிறது.
- issue: כֵּסֶל என்பதன் பொருள்
  choice: மூடத்தனம்
  alternative: தன்னம்பிக்கை அல்லது ஆதாரமற்ற நம்பிக்கை
  rationale: சங்கீதத்தின் சூழலில் செல்வத்தை நம்பும் வாழ்க்கைப் போக்கின்மீது தீர்ப்பு கூறப்படுவதால் ‘மூடத்தனம்’ பொருத்தமானது; சொல்லின் ‘நம்பிக்கை’ சார்ந்த மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
