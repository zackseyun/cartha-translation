- source_word: וְאַחֲרֵיהֶם
  choice: ஆனாலும், அவர்களுக்குப் பின் வருகிறவர்கள்
  rationale: காலத்தால் பின்னர் வருகிறவர்களையும் அவர்களைப் பின்பற்றுகிறவர்களையும் உள்ளடக்கக்கூடிய மூலமொழியின் விரிவைத் தக்கவைக்கிறது; உயிரியல் சந்ததியினர் என்று மட்டும் வரையறுக்கவில்லை.
- source_word: בְּפִיהֶם
  choice: அவர்கள் சொல்வதை
  rationale: சொல்லர்த்தமாக ‘அவர்களுடைய வாயில்’; இங்கு வாயால் கூறப்படுவதைக் குறிக்கும் ஆகுபெயராக இருப்பதால், நவீன தமிழில் இயல்பாக ‘அவர்கள் சொல்வதை’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יִרְצוּ
