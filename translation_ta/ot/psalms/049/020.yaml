source:
  edition: WLC
  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/020.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
translation:
  language: ta
  text: 'கண்ணியமுள்ள மனிதன், புரிதலின்றி,

    அழிந்துபோகும் விலங்குகளைப் போல இருக்கிறான்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இறுதி வினைச்சொல்லை ‘அழிந்துபோகின்றன’ என்பதற்குப் பதிலாக ‘ஒத்திருக்கின்றன’ என்ற பொருளில் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: மனிதன்
  rationale: ஒருமைச் சொல் இங்கு பொதுவான, நீதிமொழி சார்ந்த பொருளில் மனிதரைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பாகவும் கவிதைநயத்துடனும் உள்ளது.
- source_word: בִּיקָר
  choice: மதிப்பில் இருக்கும்
  rationale: יקר குறிக்கும் கண்ணியம், உயர்நிலை, செல்வாக்கு ஆகியவற்றை உள்ளடக்கி, மனிதனின் மேன்மையான நிலையையும் பின்னரும் வரும் புரிதலின்மையையும் எதிரெதிராக நிறுத்துகிறது.
- source_word: וְלֹא יָבִין
  choice: புரிந்துகொள்ளாவிட்டால்
  rationale: בין என்பதன் புரிதல்/பகுத்தறிதல் பொருளைத் தக்கவைத்து, முந்தைய நிலையோடு உள்ள முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נִמְשַׁל
  choice: போலாகிறான்
  rationale: நிபால் வடிவத்தின் ‘ஒப்பிடப்படுதல்/ஒத்துப்போதல்’ என்ற பொருளை இயல்பான தமிழ்க் கவிதை நடையில் தருகிறது.
- source_word: כַּבְּהֵמוֹת
  choice: விலங்குகளைப் போல
  rationale: בהמות இங்கு கால்நடைகளை மட்டும் அல்லாமல் விலங்குகளைப் பொதுவாகக் குறிக்கிறது; ‘விலங்குகள்’ நவீனத் தமிழில் தெளிவானது.
- source_word: נִדְמוּ
  choice: அழிந்துபோகும்
  rationale: சங்கீதத்தின் மரணம் சார்ந்த பின்னணிக்கும் இதே பல்லவியின் கருத்துக்கும் ஏற்ப, இவ்வடிவத்தை ‘அழிதல்’ என்ற பொருளில் எடுத்துக்கொள்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறுதி வினைச்சொல் נִדְמוּ என்பதன் பொருள்
  choice: விலங்குகளை விவரிக்கும் ‘அழிந்துபோகும்’ என்று எடுத்துரைத்தல்
  alternative: ‘விலங்குகளைப் போல ஒத்திருக்கிறான்/அவற்றுக்கு ஒப்பானவன்’ என்று எடுத்துரைத்தல்
  rationale: மனிதனின் மதிப்பு மரணத்தைத் தடுக்காது என்பது சங்கீதத்தின் மைய ஓட்டத்தோடு ‘அழிந்துபோகும் விலங்குகள்’ என்ற வாசிப்பு ஒத்துப்போகிறது. எனினும், எபிரெய வடிவத்துக்கு ஒத்திருத்தல் என்ற சாத்தியமான பகுப்பாய்வும் இருப்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான கவிதை நடை. எபிரெய வரியின் மனித மதிப்பு–புரிதலின்மை என்ற எதிர்மறை அழுத்தமும், இறுதி வினைச்சொல்லின் பொருள் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
