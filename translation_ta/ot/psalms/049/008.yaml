lexical_decisions:
- source_word: וְיֵקַר
  choice: மிக உயர்ந்தது
  rationale: יקר என்பது மதிப்புமிக்கது அல்லது விலை உயர்ந்தது என்று பொருள்படும். மீட்புக்கான விலையைப் பற்றிய சூழலில், ‘மிக உயர்ந்தது’ என்பது இயல்பாகவும் தெளிவாகவும் பொருளாதார உருவகத்தைத் தக்கவைக்கிறது; ‘செலுத்த முடியாதது’ என்ற விளக்கத்தை நேரடியாகச் சேர்ப்பதில்லை.
- source_word: פִּדְיוֹן
  choice: மீட்புவிலை
  rationale: இந்தப் பெயர்ச்சொல் விடுதலை பெறச் செலுத்தப்படும் விலையைக் குறிக்கிறது. ‘மீட்புவிலை’ என்பது வெறும் ‘மீட்பு’ என்பதைவிட பரிவர்த்தனை சார்ந்த பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: נַפְשָׁם
  choice: அவர்களுடைய உயிர்
  rationale: נפש இங்கு உடலற்ற ஆத்துமாவை மட்டும் அல்லாமல் மனிதரின் உயிரையோ வாழ்வையோ குறிக்கிறது. சங்கீதத்தின் மரணம் மற்றும் மீட்பு சார்ந்த சூழலுக்கு ‘உயிர்’ பொருத்தமானது.
- source_word: וְחָדַל
  choice: அது நின்றுபோகிறது
  rationale: חדל என்பதன் அடிப்படைப் பொருள் நிறுத்துதல், ஒழிதல் அல்லது தோல்வியுறுதல். எபிரெய வாக்கியம் சுருக்கமாகவும் அதன் எழுவாய் வெளிப்படாமலும் இருப்பதால், ‘அது நின்றுபோகிறது’ என்ற மொழிபெயர்ப்பு மூலத்தின் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: இந்தச் சொல் தொடர்ச்சியான அல்லது முடிவில்லாத காலத்தைக் குறிக்கிறது. ‘என்றென்றும்’ என்பது மறுப்பு அல்லது இயலாமையை விளக்கமாகச் சேர்க்காமல் அதன் நேரடியான காலப் பொருளைக் காக்கிறது.
theological_decisions:
- issue: மரணம் மற்றும் மீட்பு பற்றிய சூழலில் נפש என்பதன் பொருள்
  choice: உயிர்
  alternative: ஆத்துமா
  rationale: இந்தச் சங்கீதப் பகுதி மனித உயிரை மரணத்திலிருந்து மீட்க முடியாமையைப் பேசுகிறது. ‘உயிர்’ என்பது உடல்–ஆத்துமா குறித்த பிற்காலக் கருத்தை மூலச்சொல்லில் தேவையின்றி புகுத்தாமல் உடனடிச் சூழலுடன் பொருந்துகிறது.
- issue: וְחָדַל לְעוֹלָם என்ற சுருக்கமான சொற்றொடரின் விளக்கம்
  choice: அது என்றென்றும் நின்றுபோகிறது
  alternative: மீட்பு முயற்சி என்றென்றும் தோல்வியடைகிறது / அதை என்றென்றும் கைவிட வேண்டும்
  rationale: எபிரெயத்தில் எழுவாயும் துல்லியமான தொடர்பும் வெளிப்படையாக இல்லை. முதன்மை உரை அந்த இறுக்கத்தையும் தெளிவின்மையையும் காக்கிறது; சூழலால் சாத்தியமான விளக்கங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கவிதைநடையும் கொண்ட சுருக்கமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மீட்புவிலை’ என்ற கூட்டுச்சொல் மூலத்தின் பரிவர்த்தனைப் பொருளைக் காக்கிறது. கடினமான இரண்டாம் கூறு விளக்கமாகத் தீர்க்கப்படாமல், அதன் உண்மையான தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் பாதுகாக்கப்பட்டுள்ளது.
