base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/007.yaml
  text: Surely no man can redeem a brother[a], or give to God his ransom—
translation:
  language: ta
  text: எந்த மனிதனாலும் ஒரு சகோதரனை[a] எவ்வகையிலும் மீட்க முடியாது; அவனுக்கான மீட்புவிலையைக் கடவுளுக்குக் கொடுக்கவும் முடியாது—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிச்சயமாக, எந்த மனிதனாலும் [மற்றொருவரை] எவ்வகையிலும் மீட்க முடியாது.” எபிரெய மூலத்தின் தொடக்கச் சொல் “சகோதரன்” என்றும் “நிச்சயமாக” என்றும் புரிந்துகொள்ளப்படலாம்; வாக்கியத்தின் பொருள் விடுபட்டதாகவும் புரியலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: தன் சகோதரனை
  rationale: אָח என்பதன் அடிப்படைப் பொருள் ‘சகோதரன்.’ இங்கு அது உடன்பிறந்தவனை மட்டும் அல்லாமல் நெருங்கிய சக மனிதனையும் குறிக்கக்கூடும். எபிரெயச் சொற்றொடரின் அமைப்பு கடினமாக இருப்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: פָדֹה יִפְדֶּה
  choice: எவ்வகையிலும் மீட்க முடியாது
  rationale: வினைமுற்றுக்கு முன் வரும் வினையெச்ச முழுவடிவம் செயலை வலியுறுத்துகிறது. மறுப்புடன் சேர்ந்துள்ளதால், முற்றிலும் இயலாத தன்மையை இயல்பான தமிழில் ‘எவ்வகையிலும் ... முடியாது’ என்று வெளிப்படுத்துகிறது.
- source_word: אִישׁ
  choice: எந்த மனிதனாலும்
  rationale: אִישׁ என்பது ஒருமை ஆண்பால் ‘மனிதன்.’ மறுப்பு வாக்கியத்தில் அதன் பொதுப்படையான பொருளையும் மனிதரின் இயலாமையையும் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: לֵאלֹהִים
  choice: கடவுளிடம்
  rationale: இச்சங்கீதச் சூழலில் אֱלֹהִים ஒரே கடவுளைக் குறிக்கிறது. விலையை ஒருவரிடம் செலுத்துதல் என்ற தமிழ் வழக்குக்கு ‘கடவுளிடம் கொடுக்க’ இயல்பாக அமைகிறது.
- source_word: כָּפְרוֹ
  choice: அவனுக்கான மீட்புவிலை
  rationale: כֹּפֶר என்பது ஒருவரை விடுவிப்பதற்காகச் செலுத்தப்படும் விலை. ‘மீட்புவிலை’ பொருளாதார-விடுதலை உருவகத்தைப் பாதுகாக்கிறது; இங்கு கட்டாயமில்லாத பலிசார் பொருளைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: கடவுளிடம் கொடுக்கப்படும் כֹּפֶר என்பதன் பொருள்
  choice: ஒரு மனித உயிரை விடுவிப்பதற்கான மீட்புவிலை
  alternative: பாவநிவாரண விலை
  rationale: சாவிலிருந்து விடுதலையை மனிதன் விலை கொடுத்து வாங்க இயலாது என்பதே சூழலின் கருத்து. ‘மீட்புவிலை’ அந்தக் கருத்தைத் தக்கவைத்து, வசனம் வெளிப்படையாகக் கூறாத பலியியல் விளக்கத்தைத் திணிக்காமல் விடுகிறது.
- issue: כָּפְרוֹ என்ற ஆண்பால் ஒருமைப் பின்னொட்டின் தொடர்பு
  choice: மீட்கப்பட வேண்டிய மனிதனுக்கான விலை
  alternative: மீட்க முயலுகிற மனிதனின் சொந்த மீட்புவிலை
  rationale: எபிரெயில் பின்னொட்டின் தொடர்பு சுருக்கமாகவும் ஓரளவு தெளிவின்மையுடனும் உள்ளது. தொடரிணையின் கருத்துப்படி மீட்கப்பட வேண்டியவனுக்கான விலை என மொழிபெயர்க்கப்பட்டுள்ளது; தமிழில் தேவையற்ற அளவு அடையாளத்தைத் தீர்மானிக்காமல் ‘அவனுக்கான’ என்று வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘மீட்புவிலை’ என்பது மூலத்தின் சட்ட-பொருளாதார உருவகத்தைத் துல்லியமாகவும் இயல்பாகவும் எடுத்துரைக்கிறது. அடுத்த வசனத்துடன் வாக்கியம் தொடர்வதை இறுதிக் கோடு பாதுகாக்கிறது.
