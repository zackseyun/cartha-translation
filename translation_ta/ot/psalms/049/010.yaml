source:
  edition: WLC
  text: כִּ֤י יִרְאֶ֨ה חֲכָ֘מִ֤ים יָמ֗וּתוּ יַ֤חַד כְּסִ֣יל וָ/בַ֣עַר יֹאבֵ֑דוּ וְ/עָזְב֖וּ לַ/אֲחֵרִ֣ים חֵילָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/010.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
translation:
  language: ta
  text: 'ஏனெனில், ஞானிகள் இறப்பதையும்,

    மூடனும் பகுத்தறிவற்றவனும்[a] ஒருசேர அழிவதையும் அவன் காண்கிறான்;

    அவர்கள் அனைவரும் தங்கள் செல்வத்தை[b] மற்றவர்களுக்கு விட்டுச் செல்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பகுத்தறிவற்றவன்” என்பது சிந்தித்துணராத அல்லது மிருகத்தைப்போல் நடக்கும் ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “செல்வம்” என்பதற்கு “வளம்” அல்லது “உடைமைகள்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: יִרְאֶה
  choice: அவன் காண்கிறான்
  rationale: எபிரெய 3ஆம் நபர் ஆண்பால் ஒருமை வடிவைத் தக்கவைத்து, பொதுவாக நிகழ்வதைச் சுட்டும் நிகழ்காலமாக இயல்பாக வழங்குகிறது.
- source_word: חֲכָמִים
  choice: ஞானிகள்
  rationale: ஞானமுள்ள மனிதர்களைக் குறிக்கும் பன்மைப் பெயர்ச்சொல் பயன்பாட்டை இயல்பான தமிழில் தருகிறது; தமிழ்ச் சொல் தேவையற்ற பாலினக் கட்டுப்பாட்டைச் சேர்ப்பதில்லை.
- source_word: יָמוּתוּ
  choice: சாவதை
  rationale: மரணம் என்ற எளிய, நேரடியான வினைப் பொருளைத் தக்கவைக்கிறது.
- source_word: יַחַד
  choice: ஒருசேர
  rationale: மூடனுக்கும் பகுத்தறிவற்றவனுக்கும் ஏற்படும் ஒரே முடிவை வலியுறுத்துகிறது; அவர்கள் கட்டாயம் அதே நேரத்தில் சாகிறார்கள் என்ற கூடுதல் பொருளைச் சேர்ப்பதில்லை.
- source_word: כְּסִיל
  choice: மூடன்
  rationale: ஞான இலக்கியத்தில் அறிவார்ந்த குறை மட்டுமல்லாமல் ஒழுக்கநெறி சார்ந்த மூடத்தனத்தையும் குறிக்கும் வழக்கமான வகைப்பெயர்.
- source_word: בַעַר
  choice: பகுத்தறிவற்றவன்
  rationale: சிந்தித்துணரும் திறனற்ற, மிருகத்தன்மையான நபர் என்ற சொல்லின் மையப் பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: יֹאבֵדוּ
  choice: அழிந்து
  rationale: வெறுமனே சாவதைக் காட்டிலும் அழிவு அல்லது இல்லாமற்போதல் என்ற אבד வினையின் வலிமையைத் தக்கவைக்கிறது.
- source_word: וְעָזְבוּ
  choice: விட்டுச் செல்கிறார்கள்
  rationale: தாங்கள் இறக்கும்போது உடைமைகளைப் பிறரிடம் விட்டுப்போகும் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַאֲחֵרִים
  choice: மற்றவர்களுக்கு
  rationale: ‘அந்நியர்கள்’ என்ற வலுவான நுண்பொருளைச் சேர்க்காமல், குறிப்பிடப்படாத பிற மனிதர்களைச் சுட்டுகிறது.
- source_word: חֵילָם
  choice: தங்கள் செல்வத்தை
  rationale: இச்சூழலில் חֵילָם குறிக்கும் செல்வம், வளம் அல்லது உடைமைகள் என்பவற்றில் மிகத் தெளிவான நவீனத் தமிழ்ச் சொல்லைத் தேர்ந்தெடுக்கிறது.
theological_decisions:
- issue: חֲכָמִים, כְּסִיל, בַעַר ஆகிய மனித வகைப்பெயர்களின் பாலின வெளிப்பாடு
  choice: ஞானிகள் ... மூடன் ... பகுத்தறிவற்றவன்
  alternative: ஞானமுள்ள ஆண்கள் ... மூட ஆண் ... மிருகத்தனமான ஆண்
  rationale: எபிரெயத்தில் இலக்கண ஆண்பால் வடிவங்கள் இருந்தாலும், அவை இங்கு மனித வகைகளைப் பிரதிநிதித்துவப்படுத்துகின்றன. இயல்பான தமிழில் ‘ஞானிகள்’ பாலினத்தை வரையறுப்பதில்லை; ‘மூடன்’, ‘பகுத்தறிவற்றவன்’ ஆகிய ஒருமை வகைப்பெயர்கள் மூலத்தின் வடிவத்தையும் பிரதிநிதித்துவப் பொருளையும் காக்கின்றன. ‘ஆண்’ என்று வெளிப்படையாகச் சேர்ப்பது மூலத்தில் இல்லாத பாலின வரம்பை ஏற்படுத்தும்.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநடையின் சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘சாவதை’ மற்றும் ‘அழிந்து’ என்ற வேறுபாடு மூலத்தில் உள்ள מות / אבד வேறுபாட்டைப் பிரதிபலிக்கிறது. வரிப்பிரிப்பு எபிரெயக் கருத்து அலகுகளையும் மரணத்தில் அனைவருக்கும் ஏற்படும் ஒரே முடிவையும் தெளிவாக்குகிறது.
