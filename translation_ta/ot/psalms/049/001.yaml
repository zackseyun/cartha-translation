  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைநிலையை ‘கேளுங்கள் / செவிகொடுங்கள்’ என்றும், உலகளாவிய இரட்டை அழைப்பை ‘மக்களினங்களே / உலகில் வாழும் அனைவரும்’ என்றும் காத்துள்ளது.
