  rationale: ஒரு இடத்தில் குடியிருப்போர் அல்லது வாழ்வோர் அனைவரையும் குறிக்கும் பங்கேற்புச் சொல்லமைப்பை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
