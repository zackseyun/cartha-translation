  yaml_path: translation/ot/psalms/049/009.yaml
  text: that he should still live on forever and not see the Pit[a].
translation:
  language: ta
  text: 'அவன் என்றென்றும் தொடர்ந்து வாழவும்,


    படுகுழியைக்[a] காணாதிருக்கவும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘கல்லறை’ அல்லது ‘அழுகல்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: அவன் ... வாழவும்
  rationale: முந்தைய வரியின் கருத்தைத் தொடர்ந்து, அடைய முடியாத நோக்கம் அல்லது விளைவை வெளிப்படுத்தும் எபிரெய வினைநிலையைத் தமிழில் இணையான நோக்கத் தொடராக அளிக்கிறது.
- source_word: עוֹד
  choice: வாழவும் (தொடர்ந்து வாழும் பொருள் சூழலில் உட்பொதிந்துள்ளது)
  rationale: עוֹד தொடர்ந்திருப்பதைக் குறிக்கிறது. தமிழில் ‘என்றென்றும் வாழவும்’ என்பதிலேயே தொடர்ந்து வாழும் கருத்து இயல்பாக அடங்குவதால், தனியாக ‘இன்னும்’ என்று சேர்ப்பது தவறான காலநிழலை ஏற்படுத்தலாம்.
- source_word: לָנֶצַח
  choice: என்றென்றும்
  rationale: நிலையான, முடிவில்லாத காலத் தொடரை நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: לֹא
  choice: காணாதிருக்கவும்
  rationale: எதிர்மறையைத் தொடர்ந்து வரும் வினையுடன் இயல்பான தமிழ் வடிவில் இணைக்கிறது.
- source_word: יִרְאֶה
  choice: காண
  rationale: ‘அனுபவித்தல்’ என்ற விரிவான பொருள் சூழலில் சாத்தியமானாலும், எபிரெய மொழியின் ‘காணுதல்’ என்ற கவித்துவ மரபுத்தொடரை அப்படியே பாதுகாக்கிறது.
- source_word: הַשָּׁחַת
  choice: படுகுழி
  rationale: மரணம், கல்லறை, அழிவு ஆகியவற்றை உள்ளடக்கக்கூடிய எபிரெயக் கவித்துவ உருவகத்தை ஒரு தெளிவான குழி உருவமாகப் பாதுகாக்கிறது; பொருளை ஒரே விளக்கத்துக்குள் குறுக்கவில்லை.
theological_decisions:
- issue: மரணச் சூழலில் שחת என்பதன் பொருள்
  choice: படுகுழி
  alternative: கல்லறை; அழுகல்
  rationale: ‘படுகுழி’ என்பது மரணத்திற்குள் இறங்குதல், கல்லறை, அழிவு ஆகிய பொருள் நிழல்களைத் திறந்தவையாக வைத்திருக்கிறது. ‘கல்லறை’ அல்லது ‘அழுகல்’ என்று மட்டும் மொழிபெயர்த்தால் உருவகத்தின் பரப்பு தேவையின்றிக் குறுகிவிடும்; அவை அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன, மரியாதைமிக்க கவிதைநடை. முந்தைய வசனத்தைச் சார்ந்த தொடரமைப்பை ‘வாழவும் ... காணாதிருக்கவும்’ என்ற இணை வடிவங்கள் பாதுகாக்கின்றன.
