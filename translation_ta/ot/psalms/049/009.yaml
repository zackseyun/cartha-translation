  rationale: Added ‘தொடர்ந்து’ to represent עוֹד while retaining ‘என்றென்றும்’ for לָנֶצַח. The dependent poetic syntax, the literal ‘see’ idiom, and the open-ended death-image ‘படுகுழி’ are preserved.
