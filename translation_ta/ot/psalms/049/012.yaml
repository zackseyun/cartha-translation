  text: וְ/אָדָ֣ם בִּ֭/יקָר בַּל יָלִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/012.yaml
  text: But man in honor does not remain[c][b][a]; he is like the beasts that perish.
translation:
  language: ta
  text: ஆனால் கௌரவம் பெற்ற மனிதன் நிலைத்திருப்பதில்லை[a]; அவன் அழிந்துபோகும் விலங்குகளுக்கு ஒப்பானவன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'நேர்ப்பொருள்: ‘இரவு தங்குவதில்லை.’ அதாவது, கௌரவமான நிலையில் அவன் தொடர்ந்து நீடிப்பதில்லை.'
    reason: lexical_alternative
  - marker: b
    text: ‘அழிக்கப்படும் விலங்குகள்’ என்றும் மொழிபெயர்க்கலாம். இறுதி வினைச்சொல் இங்கு அழிந்துபோதலைக் குறிப்பதாகப் பாரம்பரியமாகப் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: மனிதன்
  rationale: இங்கு ஒருமை வடிவம் மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்துகிறது; நவீனத் தமிழில் இயல்பாகவும் பொதுப்பொருளுடனும் ‘மனிதன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בִּיקָר
  choice: மதிப்புடன் இருக்கும்
  rationale: יָקָר என்பது மதிப்பு, கௌரவம், சிறப்பு ஆகிய பொருள்களைக் கொண்டது. சங்கீதத்தின் சூழலில் செல்வத்தை மட்டும் குறுக்காமல் மனிதனின் உயர்ந்த நிலையைக் குறிக்க ‘மதிப்புடன் இருக்கும்’ பொருந்துகிறது.
- source_word: בַּל יָלִין
  choice: நிலைத்திருப்பதில்லை
  rationale: יָלִין என்பதன் நேர்ப்பொருள் ‘இரவு தங்குதல்’; இங்கு பெற்ற மதிப்பான நிலையில் தொடர்ந்து நீடிக்காததைச் சொல்லும் வழக்குப்பொருளில் உள்ளது.
- source_word: נִמְשַׁל
  choice: போல அவன் இருக்கிறான்
  rationale: நிபால் வடிவம் ஒப்புமையை வெளிப்படுத்துகிறது; தமிழில் இயல்பாக ஒப்புமை அமைப்பில் மொழிபெயர்க்கப்பட்டது.
- source_word: כַּבְּהֵמוֹת
  choice: விலங்குகளைப் போல
  rationale: בְּהֵמוֹת பொதுவாக விலங்குகளைக் குறிக்கிறது; ‘விலங்குகள்’ என்பது தெளிவான, நவீன, கண்ணியமான தமிழ்ச் சொல்.
- source_word: נִדְמוּ
  choice: அழிந்துபோகும்
  rationale: இவ்வடிவம் இங்கு மரித்தல் அல்லது அழிதல் என்ற பாரம்பரியப் புரிதலுக்கு ஏற்ப உள்ளது; சங்கீதத்தின் நிலையாமைச் சூழலுக்கும் பொருந்துகிறது.
