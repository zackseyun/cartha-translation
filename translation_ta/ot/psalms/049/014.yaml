  text: כַּ/צֹּ֤אן לִֽ/שְׁא֣וֹל שַׁתּוּ֮ מָ֤וֶת יִ֫רְעֵ֥/ם וַ/יִּרְדּ֘וּ בָ֤/ם יְשָׁרִ֨ים לַ/בֹּ֗קֶר ו/ציר/ם לְ/בַלּ֥וֹת שְׁא֗וֹל מִ/זְּבֻ֥ל לֽ/וֹ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are appointed for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol[d][c][b], far from its lofty dwelling.
translation:
  language: ta
  text: செம்மறியாடுகளைப்போல் அவர்கள் ஷெயோலுக்கு நியமிக்கப்பட்டிருக்கிறார்கள்; மரணம் அவர்களை மேய்க்கும். காலையில் நேர்மையானவர்கள் அவர்களை ஆள்வார்கள். அவர்களுடைய உருவம் ஷெயோலில்[a] அழிந்துபோகும்—அவர்களுடைய உயர்ந்த உறைவிடத்திலிருந்து அகன்று.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஷெயோல்’ என்பது இறந்தோரின் உலகைக் குறிக்கிறது; அது வெறும் ‘கல்லறை’ என்பதைக் காட்டிலும் விரிவான சொல். ‘அவர்களுடைய உருவம்’ என்பதற்கான எபிரெய வாசகம் கடினமானது; ‘அவர்களுடைய பாறை’ அல்லது ‘அவர்களுடைய வலிமை’ என்றும் பொருள் கொள்ளலாம்.
    reason: cultural_note_and_lexical_alternative
  - marker: b
    text: இறுதித் தொடர் கடினமான எபிரெய மொழிநடையில் உள்ளது. ‘ஷெயோல் அவர்களை அவர்களுடைய உயர்ந்த உறைவிடத்திலிருந்து அழித்துவிடும்’ என்பது மற்றொரு சாத்தியமான பொருள்.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  choice: செம்மறியாடுகளைப்போல்
  rationale: צֹאן என்பது ஆடுமந்தையைப் பொதுவாகக் குறிக்கிறது; இங்கு மரணம் மேய்ப்பவனாக வரும் உருவகத்தைத் தெளிவாகத் தொடர ‘செம்மறியாடுகளைப்போல்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לִשְׁאוֹל שַׁתּוּ
  choice: ஷெயோலுக்கு நியமிக்கப்பட்டிருக்கிறார்கள்
  rationale: שׁית என்பதன் ‘வைக்கப்படுதல்/ஒதுக்கப்படுதல்’ என்ற கருத்தையும் ל־ என்பதன் இலக்கு சார்ந்த பொருளையும் இணைத்து இயல்பான தமிழில் வழங்குகிறது.
- source_word: מָוֶת יִרְעֵם
  choice: மரணம் அவர்களை மேய்க்கும்
  rationale: רעה என்பதன் அடிப்படைப் பொருளான ‘மேய்த்தல்’ என்பதைக் காத்து, மரணத்தை மேய்ப்பவனாகச் சித்தரிக்கும் முரண்பாடான உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַיִּרְדּוּ בָם יְשָׁרִים
  choice: நேர்மையானவர்கள் அவர்கள்மேல் ஆளுகை செய்வார்கள்
  rationale: רדה/רדד சார்ந்த ஆளுகைக் கருத்தையும் יְשָׁרִים என்பதன் ‘நேர்மையானவர்கள்’ என்ற துல்லியத்தையும் காக்கிறது; ‘மிதிப்பார்கள்’ என்ற சாத்தியத்தைத் தேவையின்றி முன்னிறுத்தவில்லை.
- source_word: לַבֹּקֶר
  choice: காலையில்
  rationale: எபிரெயத்தின் காலக் குறிப்பை எளிமையாகக் காக்கிறது; ‘காலை’ எதைக் குறிக்கிறது என்பதை விளக்கவுரையாகத் தீர்மானிக்கவில்லை.
- source_word: וְצוּרָם
  choice: அவர்களுடைய உருவம்
  rationale: மெய்யெழுத்து வாசகமும் சொல்லின் பொருளும் கடினமானவை. சூழலில் ‘உருவம்/வடிவம்’ என்பது அடுத்து வரும் அழிவுக் கருத்துடன் பொருந்துவதால் முதன்மை உரையில் எடுத்துக்கொள்ளப்பட்டது; மாற்று சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לְבַלּוֹת שְׁאוֹל
  choice: ஷெயோலில் அழிந்துபோகும்
  rationale: בלה என்பதன் தேய்தல், சிதைதல், அழிதல் ஆகிய பொருட்களை இயல்பான தமிழில் தருகிறது; שְׁאוֹל என்பதை வெறும் கல்லறையாகக் குறுக்கவில்லை.
- source_word: מִזְּבֻל לוֹ
  choice: அதன் உயர்ந்த உறைவிடத்திலிருந்து வெகுதொலைவில்
  rationale: זְבֻל என்பதன் உயர்ந்த உறைவிடம் என்ற சாத்தியத்தைப் பின்பற்றுகிறது. தொடரின் இலக்கணம் கடினமானதால் உறுதியற்ற தன்மை அடிக்குறிப்பில் வெளிப்படையாகக் குறிப்பிடப்படுகிறது.
theological_decisions:
- issue: שְׁאוֹל என்பதன் மொழிபெயர்ப்பு
  choice: ஷெயோல்
  alternative: கல்லறை / இறந்தோரின் உலகம்
  rationale: இச்சொல் ஒரு தனிப்பட்ட கல்லறையைவிட விரிவான இறந்தோர் உறைவிடக் கருத்தைக் கொண்டிருப்பதால் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டது; பிற்கால நரகம் குறித்த குறிப்பிட்ட கோட்பாட்டை உரையில் இறக்குமதி செய்யவில்லை.
- issue: ‘காலையில்’ என்பதன் கால-இறையியல் குறிப்பு
  choice: காலையில்
  alternative: உயிர்த்தெழுதலின் காலையில் / நியாயத்தீர்ப்பின் காலையில்
  rationale: மூல உரை ‘காலை’ என்று மட்டுமே கூறுகிறது. அது இறுதி வெற்றியையோ உயிர்த்தெழுதலையோ குறிக்கலாம் என்ற விளக்கத்தை மொழிபெயர்ப்பில் கட்டாயப்படுத்தாமல் உண்மையான திறந்தநிலையைப் பாதுகாக்கிறது.
- issue: מִזְּבֻל לוֹ என்ற கடினத் தொடரின் பொருள்
  choice: அதன் உயர்ந்த உறைவிடத்திலிருந்து வெகுதொலைவில்
  alternative: ஷெயோல் அவர்களை அவர்களுடைய உயர்ந்த உறைவிடத்திலிருந்து அழித்துவிடும்
  rationale: முதன்மை வாசகம் சூழலோடு பொருந்தும் ஒரு சாத்தியமான அமைப்பைப் பின்பற்றுகிறது; எனினும் எபிரெயத் தொடரின் நிச்சயமின்மையை அடிக்குறிப்பில் மறைக்காமல் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு புரியும் கண்ணியமான நடையைக் கடைப்பிடிக்கிறது. ‘ஷெயோல்’ என்ற அறிமுகமற்ற சொல்லுக்கு அடிக்குறிப்பு தரப்பட்டுள்ளது. ஆடு–மேய்ப்பவன் உருவகம், மரணத்தின் ஆளுமைப்படுத்தல், ‘காலை’ குறித்த திறந்த பொருள், கடினமான இறுதித் தொடர் ஆகியவை மிகைப்படுத்தப்பட்ட விளக்கமின்றிப் பாதுகாக்கப்பட்டுள்ளன.
