  source_fidelity: 'முதல் மூன்று கூறுகளும் எபிரெய மூலத்திற்கு நெருக்கமாக உள்ளன: ஆடுகள்–மேய்ப்பவன் உருவகம், மரணத்தின் ஆளுமைப்படுத்தல், நேர்மையானவர்களின் ஆட்சி, மற்றும் ‘காலையில்’ என்ற காலக் குறிப்பு ஆகியவை காக்கப்பட்டுள்ளன. ஆனால் מִזְּבֻל לוֹ என்ற மிகக் கடினமான இறுதித் தொடரை ‘அதன் உயர்ந்த உறைவிடத்திலிருந்து வெகுதொலைவில்’ என வழங்குவது தமிழில் முன்னிலைத் தொடர்பைத் தெளிவற்றதாக்குகிறது; ‘வெகுதொலைவில்’ என்பதும் மூலத்தில் வெளிப்படையாக இல்லாத வலுப்படுத்தல். திருத்தம் மூலத்தின் நிச்சயமின்மையை அடிக்குறிப்பில் தக்கவைத்தபடி இயல்பான தொடரை வழங்குகிறது.'
