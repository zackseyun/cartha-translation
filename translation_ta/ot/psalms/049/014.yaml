  to: செம்மறியாடுகளைப்போல் அவர்கள் ஷெயோலுக்கு நியமிக்கப்பட்டிருக்கிறார்கள்; மரணம் அவர்களை மேய்க்கும். காலையில் நேர்மையானவர்கள் அவர்களை ஆள்வார்கள். அவர்களுடைய உருவம் ஷெயோலில்[a] அழிந்துபோகும்—அவர்களுடைய உயர்ந்த உறைவிடத்திலிருந்து அகன்று.[b]
