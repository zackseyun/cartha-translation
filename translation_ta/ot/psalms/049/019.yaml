  text: He will go to the generation of his fathers[c][b][a]; they will never again see the light.
translation:
  language: ta
  text: அவன் தன் முன்னோர்களின்[b] தலைமுறையோடு சேர்வான்[a]; அவர்கள் இனி ஒருபோதும் ஒளியைக் காணமாட்டார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய உரையில் நபர்/எண் மாறுபாடு உள்ளது: முதல் வினை எழுதப்பட்டுள்ள வடிவில் இரண்டாம் நபர் ஆண்பால் ஒருமை (‘நீ செல்வாய்/வருவாய்’); பிந்தைய வினையோ பன்மை (‘அவர்கள் காண்பார்கள்’). பல மொழிபெயர்ப்புகள் முழு வசனத்தையும் ஒருமையாகச் சீராக்குகின்றன; இங்குள்ள மொழிபெயர்ப்பு சூழலுக்கேற்ப முதல் பகுதியை ‘அவன்’ என்று கொடுத்தாலும், பிந்தைய பன்மையைப் பாதுகாக்கிறது.'
    reason: alternative_reading
  - marker: b
    text: ‘முன்னோர்கள்’ என்பதற்கான எபிரெயச் சொல் நேரடியாக ‘தந்தையர்’ என்று பொருள்படும்.
    reason: lexical_alternative
  - marker: c
    text: ‘ஒளியைக் காணுதல்’ என்பது வாழ்வை அனுபவிப்பதைக் குறிக்கும் எபிரெய மரபுத்தொடர்; இங்கு அவர்கள் இவ்வுலக வாழ்வுக்கு இனி ஒருபோதும் திரும்பமாட்டார்கள் என்பது பொருள்.
    reason: cultural_note
lexical_decisions:
- source_word: תָּבוֹא
  choice: அவன் செல்வான்
  rationale: வடிவியல் அடிப்படையில் இது இரண்டாம் நபர் ஆண்பால் ஒருமை (‘நீ செல்வாய்/வருவாய்’). ஆனால் முந்தைய வசனத்திலிருந்து தொடரும் செல்வந்தனைச் சுட்டும் சூழலில் மூன்றாம் நபர் ஒருமையாக மொழிபெயர்ப்பது உரையோட்டத்துக்கு ஏற்றது; மூலத்தில் உள்ள நபர் மாறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עַד
  choice: இடம்/நோக்கம் குறிக்கும் ‘-இடம்’
  rationale: דּוֹר אֲבוֹתָיו என்பதுடன் சேர்ந்து செல்லும் இலக்கை அல்லது எட்டும் எல்லையைக் குறிக்கிறது.
- source_word: דּוֹר
  choice: தலைமுறை
  rationale: அடிப்படைப் பொருளான ‘தலைமுறை’ பாதுகாக்கப்படுகிறது; இங்கு அது இறந்த முன்னோர்களின் தலைமுறையை அல்லது அவர்களின் கூட்டத்தைச் சுட்டுகிறது.
- source_word: אֲבוֹתָיו
  choice: தன் முன்னோர்கள்
  rationale: சொல்லுக்குச் சொல் ‘அவனுடைய தந்தையர்’ என்றாலும், இச்சூழலில் மரபுவழி முந்திய தலைமுறையினரைக் குறிக்கும் இயல்பான நவீனத் தமிழ்ச் சொல் ‘முன்னோர்கள்’.
- source_word: עַד נֵצַח
  choice: இனி ஒருபோதும்
  rationale: மறுப்புடன் இணைந்த இச்சொற்றொடர், அந்தச் செயல் மீண்டும் என்றும் நிகழாது என்பதைக் கூறுகிறது.
- source_word: לֹא יִרְאוּ
  choice: அவர்கள் காணமாட்டார்கள்
  rationale: எபிரெய வினை மூன்றாம் நபர் ஆண்பால் பன்மையில் உள்ளது. தனிநபரிலிருந்து அவன் சேரும் இறந்தோர் கூட்டத்துக்கான பார்வை மாற்றத்தைப் பன்மை வெளிப்படுத்துகிறது.
- source_word: אוֹר
  choice: ஒளி
  rationale: நேரடி ஒளியையும் வாழ்வின் அனுபவத்தையும் குறிக்கக்கூடிய எபிரெய உருவகம் தமிழிலும் அப்படியே பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: வசனத்திலுள்ள நபர் மற்றும் எண் மாறுபாடு
  choice: முதல் பகுதியில் சூழலுக்கேற்ப ‘அவன் ... செல்வான்’ என்றும், இரண்டாம் பகுதியில் மூலத்தின் பன்மையைப் பின்பற்றி ‘அவர்கள் ... காணமாட்டார்கள்’ என்றும் தரப்பட்டுள்ளது.
  alternative: ‘நீ ... செல்வாய்’ என்று எபிரெய வினையின் நேரடி இரண்டாம் நபர் வடிவைப் பின்பற்றலாம்; அல்லது இரு பகுதிகளையும் ஒருமையில் ‘அவன் ... காணமாட்டான்’ என்று சீராக்கலாம்.
  rationale: மசோரெட்டிக் உரையில் முதல் வினை இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவிலும், பிந்தைய வினை மூன்றாம் நபர் ஆண்பால் பன்மையிலும் உள்ளது. சூழலுக்கேற்ற ஒருமையை முதல் பகுதியில் பயன்படுத்தியபோதும், இரண்டாம் பகுதியின் பன்மையைப் பாதுகாப்பது தனிநபர் இறந்த முன்னோர்களின் கூட்டத்தில் சேர்வதை வெளிப்படுத்துவதுடன் மூலத்தின் பதற்றத்தையும் முழுமையாக அழிக்காமல் வைக்கிறது.
- issue: ‘ஒளியைக் காணுதல்’ என்ற உருவகம்
  choice: உருவகத்தை முதன்மை உரையில் விளக்காமல் ‘ஒளியைக் காணமாட்டார்கள்’ என்று பாதுகாத்தல்.
  alternative: ‘மீண்டும் உயிர்வாழமாட்டார்கள்’ என்று பொருளை நேரடியாகத் தரலாம்.
  rationale: மூலத்தின் கவித்துவ உருவகம் வாழ்வு மற்றும் மரணம் பற்றிய உட்பொருளைத் தாங்குகிறது; அதை நேரடிக் கோட்பாட்டு வாக்கியமாக மாற்றாமல், விளக்கத்தை அடிக்குறிப்பில் தருவது ஏற்றது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் இயல்பான ஆனால் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. ‘தலைமுறை’ மற்றும் ‘ஒளியைக் காணுதல்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன; ‘தந்தையர்’ என்பதற்குப் பதிலாக இச்சூழலில் இயல்பான ‘முன்னோர்கள்’ பயன்படுத்தப்பட்டு அதன் நேரடிப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
