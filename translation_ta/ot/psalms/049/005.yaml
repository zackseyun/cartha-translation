source:
  edition: WLC
  text: לָ֣/מָּה אִ֭ירָא בִּ֣/ימֵי רָ֑ע עֲוֺ֖ן עֲקֵבַ֣/י יְסוּבֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/005.yaml
  text: Why should I fear in days of evil[a], when the iniquity of my pursuers surrounds me?
translation:
  language: ta
  text: தீமையான நாட்களில், என்னை இடறச் செய்ய முயல்வோரின்[a] அக்கிரமம் என்னைச் சூழும்போது, நான் ஏன் அஞ்ச வேண்டும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு சொல், “என் குதிகால்களின் அக்கிரமம் என்னைச் சூழ்கிறது.” இந்த எபிரேயச் சொற்றொடர் “என் குதிகால்களைப் பின்தொடரும் அக்கிரமம்” என்றும், என்னை இடறச் செய்ய அல்லது பின்தொடர முயல்வோரின் அக்கிரமம் என்றும் புரிந்துகொள்ளப்படலாம்; என் சொந்த அக்கிரமம் என்னைப் பின்தொடர்கிறது என்ற வாசிப்பும் சாத்தியம்.
    reason: மூல எபிரேயச் சொற்றொடரின் உண்மையான தெளிவின்மையையும் முக்கிய மாற்று வாசிப்புகளையும் காக்கிறது.
lexical_decisions:
- source_word: לָמָּה אִירָא
  choice: நான் ஏன் அஞ்ச வேண்டும்?
  rationale: לָמָּה உடன் வரும் முதலாம் நபர் முற்றாத வினைச்சொல் இங்கு வினாவடிவில் அச்சத்தின் நியாயத்தை மறுக்கிறது; நவீனத் தமிழில் இயல்பாகவும் வலிமையாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: בִּימֵי רָע
  choice: தீமையான நாட்களில்
  rationale: எபிரேயச் சொற்றொடரின் ‘தீமை/தீங்கு நிறைந்த நாட்கள்’ என்ற பரந்த பொருளைப் பேணுகிறது; அதை வெறும் துன்பம் அல்லது ஆபத்து என்று குறுக்கவில்லை.
- source_word: עֲוֹן
  choice: அக்கிரமம்
  rationale: இச்சொல் அக்கிரமம், குற்றப்பழி அல்லது அதன் விளைவு ஆகியவற்றைக் குறிக்கலாம். சூழலில் எதிரிகளின் ஒழுக்கக்கேடான செயலைக் காட்ட ‘அக்கிரமம்’ பொருத்தமானது; அதேவேளை அதன் நெறிசார் கனத்தையும் காக்கிறது.
- source_word: עֲקֵבַי
  choice: என்னை இடறச்செய்ய முயல்வோர்
  rationale: சொல்லடியாக ‘என் குதிகால்கள்’ என்றாலும், குதிகாலைப் பிடித்து இடறச்செய்தல் அல்லது பின்னிருந்து தாக்குதல் சார்ந்த சொல்லாட்சியாகப் புரிந்துகொள்ளலாம். பிரதான உரை இந்தச் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது; மூலத்தின் தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יְסוּבֵּנִי
  choice: என்னைச் சூழ்ந்திருக்கும்போது
  rationale: סבב என்பதன் ‘சூழ்தல்/வளைத்துக்கொள்ளுதல்’ என்ற பொருளைத் தக்கவைக்கிறது. தமிழ்ச் சொற்றொடரின் தொடர்பை இயல்பாக்க காலச்சார்பு வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: עֲוֹן עֲקֵבַי என்ற தெளிவற்ற சொற்றொடரின் பொருள்
  choice: சங்கீதக்காரரை இடறச்செய்ய முயலும் பகைவர்களின் அக்கிரமம்
  alternative: ‘என் குதிகால்களின் அக்கிரமம்’, ‘என் பின்னால் தொடரும் என் சொந்த அக்கிரமம்’, அல்லது ‘என்னைப் பின்தொடருவோரின் குற்றம்’
  rationale: சங்கீதம் 49-ன் சூழலில் செல்வமும் அதிகாரமும் உடைய ஒடுக்குவோரைக் குறித்த அச்சமே பேசப்படுவதால், பகைவர்களைக் குறிக்கும் வாசிப்பு பொருந்துகிறது. ஆயினும் எபிரேயத்தில் ‘என் குதிகால்கள்’ என்ற சொல்லடியான வடிவம் இருப்பதால், மாற்று வாசிப்புகள் அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘அஞ்ச வேண்டும்’ என்பது வினாவின் வலிமையைத் தருகிறது; கடினமான எபிரேய உருவகம் பிரதான உரையில் புரியும்படி மொழிபெயர்க்கப்பட்டு, அதன் சொல்லடியான வடிவமும் மாற்று விளக்கங்களும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
