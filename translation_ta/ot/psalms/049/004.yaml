  text: 'பழமொழிக்குச் செவிசாய்ப்பேன்[a];

    யாழுடன் என் புதிரைத் திறப்பேன்[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பழமொழி” என்பதற்கு “உவமை” அல்லது “ஞானமொழி” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: “யாழுடன்” என்பதை “யாழில்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் லைர் வகையைச் சேர்ந்த ஒரு நரம்பிசைக் கருவியைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “என் புதிரை” என்பதற்கு “என் மறைபொருள் கூற்றை” அல்லது “என் புதிர்மொழியை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַטֶּה ... אָזְנִי
  choice: செவிசாய்ப்பேன்
  rationale: எபிரெயச் சொற்றொடர் காதைத் திருப்பி உன்னிப்பாகக் கேட்பதைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பான ‘செவிசாய்’ அதே நோக்கமுள்ள கவனத்தைக் காக்கிறது; ஒருமை ‘காது’ என்பதைத் தனியே கூறாமல் தமிழ்ச் சொல்லுக்குள் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְמָשָׁל
  choice: பழமொழிக்கு
  rationale: מָשָׁל என்பது பழமொழி, உவமைக்கதை, அல்லது ஞானமொழி எனப் பொருள்படலாம். ஞானச் சங்கீதச் சூழலில் ‘பழமொழி’ முதன்மைப் பொருத்தம்; வேறு உண்மையான வாய்ப்புகள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- source_word: אֶפְתַּח
  choice: திறப்பேன்
  rationale: פתח என்பதன் அடிப்படை உருவகமான ‘திறத்தல்’ காக்கப்படுகிறது. ‘விளக்குவேன்’ என்று மொழிபெயர்த்தால் மூலத்தில் உள்ள உருவகத்தையும் புதிர்த்தன்மையையும் முன்கூட்டியே தீர்த்துவிடும்.
- source_word: בְּכִנּוֹר
  choice: யாழுடன்
  rationale: כִּנּוֹר என்பது லயர் வகையைச் சேர்ந்த நரம்பிசைக் கருவி. தமிழில் dignified மற்றும் புரிந்துகொள்ளத்தக்க ஒப்புமையாக ‘யாழ்’ தேர்ந்தெடுக்கப்பட்டது; ב கருவியைக் குறிக்கும் ‘உடன்’ என வழங்கப்பட்டது.
- source_word: חִידָתִי
  choice: என் புதிரை
  rationale: חִידָה என்பது புரிந்துகொள்ளத் தேவைப்படும் புதிர் அல்லது மறைபொருளுள்ள கூற்று. ‘புதிர்’ நவீனத் தமிழில் தெளிவானதும் மூலத்தின் பொருள் நெருக்கடியைக் காப்பதும் ஆகும்.
