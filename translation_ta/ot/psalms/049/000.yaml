- source_word: לַמְנַצֵּחַ
  choice: இசைக்குழுத் தலைவருக்காக
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்த்துதலை வழிநடத்தும் தலைவரோடு தொடர்புடைய அறிவுறுத்தல் அல்லது ஒப்படைப்பைக் குறிக்கிறது. ‘இசைக்குழுத் தலைவர்’ என்பது நவீனத் தமிழில் இயல்பாகவும் விரிவான இசைச்சூழலை உள்ளடக்குவதாகவும் உள்ளது; לַ முன்னொட்டின் நோக்கம் அல்லது பெறுநர் சார்ந்த நெகிழ்வை ‘-க்காக’ தக்கவைக்கிறது.
- source_word: לִבְנֵי קֹרַח
  choice: கோராகின் மக்களின்
  rationale: லְ முன்னொட்டு ஆசிரியர், பயன்பாடு, ஒப்படைப்பு, அல்லது குழுவோடு தொடர்பு ஆகியவற்றுள் எதைக் குறிக்கிறது என்பது உறுதியில்லை. தமிழ் ஆறாம் வேற்றுமை ‘மக்களின்’ இந்தத் தொடர்பை ஆசிரியத்துவமாக மட்டும் முடிவுசெய்யாமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையுடன் பாடப்படும் புனிதப் பாடலுக்கான நிலையான வகைப்பெயர். சங்கீத நூலின் தலைப்புச் சூழலில் ‘சங்கீதம்’ தெளிவாகவும் மரியாதையான நடையிலும் உள்ளது.
- source_word: קֹרַח
  choice: கோராகு
  rationale: எபிரெயப் பெயர் קֹרַח தமிழில் வழக்கமான வேதாகம ஒலிபெயர்ப்பான ‘கோராகு’ என வழங்கப்படுகிறது; உருபு சேரும் இடத்தில் ‘கோராகின்’ ஆகிறது.
