    text: ‘இசைக்குழுத் தலைவருக்கு’ என்றும் மொழிபெயர்க்கலாம். சங்கீதத் தலைப்புகளில் வரும் எபிரெய முன்னிடைச்சொல் நோக்கம் அல்லது பெறுநர் ஆகிய இரு பொருள்களையும் தரக்கூடும்.
