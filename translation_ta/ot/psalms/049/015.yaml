lexical_decisions:
- source_word: אַךְ
  choice: ஆனால்
  rationale: முந்தைய சூழலில் கூறப்பட்ட மனிதரின் மரண முடிவுக்கு மாறாக, இங்கு தேவன்மீது கொண்ட நம்பிக்கையை முன்னிறுத்தும் எதிர்மறைத் திருப்பத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: இங்கு இஸ்ரவேலின் ஒரே தேவனைக் குறிக்கும் வழக்கமான ஒருமைச் சுட்டாக உள்ளது; நவீனத் தமிழ் வேதாகம நடைக்கு ஏற்ற பொதுவான இணைச்சொல்.
- source_word: יִפְדֶּה
  choice: மீட்பார்
  rationale: פדה என்பதிலுள்ள விடுவித்தல் அல்லது விலைகொடுத்து மீட்டல் என்ற கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: இச்சூழலில் נפש என்பது உடலிலிருந்து தனித்த ஓர் ஆத்துமாவை மட்டும் அல்லாமல் உயிரையோ முழு நபரையோ குறிக்கிறது; மரணம் மற்றும் விடுதலை பற்றிய சங்கீதத்தின் கருத்தோட்டத்துக்கு ‘என் உயிரை’ பொருந்துகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: எபிரெய உருவகத்தைத் தக்கவைத்து, ஷியோலின் பிடி அல்லது அதிகாரத்திலிருந்து விடுவிக்கப்படுதல் என்ற கருத்தையும் புரியவைக்கிறது.
- source_word: שְׁאוֹל
  choice: ஷியோல்
  rationale: இறந்தோரின் உலகைக் குறிக்கும் தனித்த எபிரெயச் சொல்லை ‘கல்லறை’ என்று குறுக்காமலும், பின்னாளைய குறிப்பிட்ட நரகக் கருத்துடன் ஒன்றாக்காமலும் ஒலிபெயர்த்துள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய நம்பிக்கைக் கூற்றுக்கான காரணம் அல்லது அடிப்படையைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: יִקָּחֵנִי
  choice: அவர் என்னை எடுத்துக்கொள்வார்
  rationale: לקח என்பதன் அடிப்படைப் பொருளான ‘எடுத்துக்கொள்’ என்பதைப் பாதுகாத்து, தேவன் தம்மிடம் ஏற்றுக்கொள்வார் என்ற சாத்தியமான உட்பொருளை வெளிப்படையாகத் தீர்மானிக்காமல் விடுகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் சரியான பொருளும் வழிபாட்டு அல்லது இசைச் செயல்பாடும் உறுதியற்றவை என்பதால் மரபான ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: נַפְשִׁי என்பது மரணம் மற்றும் விடுதலையுடன் எவ்வாறு தொடர்புடையது
  choice: ‘என் ஆத்துமாவை’ என்பதற்குப் பதிலாக ‘என் உயிரை’
  alternative: ‘என் ஆத்துமாவை’ அல்லது ‘என்னையே’
  rationale: எபிரெயக் கவிதையில் נפש பல நேரங்களில் முழு நபரையோ உயிரையோ குறிக்கிறது. ஆகவே உடல்–ஆத்துமா இருமையை உரைக்குள் தேவையின்றி புகுத்தாமல், உடனடிச் சூழலைப் பாதுகாக்கிறது.
- issue: ஷியோலிலிருந்து கிடைக்கும் விடுதலையின் தன்மை
  choice: ‘என் உயிரை ஷியோலின் கையிலிருந்து மீட்பார்; ... என்னை எடுத்துக்கொள்வார்’ என்ற விரிவான, திறந்த சொல்லாக்கம்
  alternative: உயிர்த்தெழுதலை வெளிப்படையாகக் குறிப்பிடுதல் அல்லது அகால மரணத்திலிருந்து தப்புதல் என்று மட்டும் கூறுதல்
  rationale: தேவனால் இறுதியாக விடுவிக்கப்படுவேன் என்ற நம்பிக்கையை எபிரெயம் உறுதியாகச் சொன்னாலும், அது உயிர்த்தெழுதல், மரணத்திற்குப் பிந்தைய தேவசமூகம், அல்லது இவ்வாழ்வில் மரணத்திலிருந்து காப்பு ஆகியவற்றில் ஒன்றைத் தெளிவாக வரையறுக்கவில்லை. மொழிபெயர்ப்பு அந்தத் தெய்வவியல் அழுத்தத்தையும் தெளிவின்மையையும் தக்கவைக்கிறது.
- issue: יִקָּחֵנִי என்பதிலுள்ள தேவனுடைய செயல்
  choice: ‘அவர் என்னை எடுத்துக்கொள்வார்’
  alternative: ‘அவர் என்னை ஏற்றுக்கொள்வார்’
  rationale: ‘ஏற்றுக்கொள்வார்’ என்பது தேவன் தம்மிடம் சேர்த்துக்கொள்வார் என்ற பொருளைத் தெளிவாக்கலாம்; ஆனால் எபிரெய வினையின் விரிவான ‘எடுத்துக்கொள்’ என்ற பொருளே மூலத்தின் உண்மையான தெளிவின்மையைச் சிறப்பாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதக் கவிதைக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘ஷியோல்’ மற்றும் ‘சேலா’ ஒலிபெயர்க்கப்பட்டு, முதலாவது சொல்லின் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. எபிரெய உருவகமான ‘கையிலிருந்து’ தக்கவைக்கப்பட்டுள்ளது.
