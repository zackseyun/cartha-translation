  text: קִרְבָּ֤/ם בָּתֵּ֨י/מוֹ לְֽ/עוֹלָ֗ם מִ֭שְׁכְּנֹתָ/ם לְ/דֹ֣ר וָ/דֹ֑ר קָֽרְא֥וּ בִ֝/שְׁמוֹתָ֗/ם עֲלֵ֣י אֲדָמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/011.yaml
  text: Their inward thought is that their houses will last forever[a], their dwelling places from generation to generation[b]; they have called lands by their own names.
translation:
  language: ta
  text: தங்கள் வீடுகள் என்றென்றும் நிலைத்திருக்கும் என்றும், தங்கள் குடியிருப்புகள் தலைமுறை தலைமுறையாக நீடிக்கும் என்றும் அவர்கள் உள்ளத்தில் எண்ணுகிறார்கள்[a]; நிலங்களுக்குத் தங்கள் பெயர்களையே சூட்டியிருக்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு ஓர் உரைப் புரிதலின்படி: “அவர்களுடைய கல்லறைகளே என்றென்றும் அவர்களுடைய வீடுகள்; தலைமுறை தலைமுறைக்கும் அவையே அவர்களுடைய குடியிருப்புகள்.”'
    reason: textual_variant
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “நிலங்களின்மேல் தங்கள் பெயர்களால் அழைத்தார்கள்.” தங்கள் பெயர்களை நிலங்களுக்கு அல்லது சொத்துகளுக்குச் சூட்டினார்கள் என்பதே இதன் பொருள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבָּם
  choice: அவர்கள் உள்ளத்தில் எண்ணுகிறார்கள்
  rationale: மசோரா உயிர்க்குறிகளுடன் உள்ள வடிவம் ‘அவர்களுடைய உள்ளம்/உட்பகுதி’ என்று பொருள்படும். வினையில்லாத எபிரெயக் கூற்றை இயல்பான தமிழில் உள்ளார்ந்த எண்ணமாக வெளிப்படுத்துகிறது; ‘கல்லறைகள்’ என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בָּתֵּימוֹ
  choice: தங்கள் வீடுகள்
  rationale: בית என்பதன் வழக்கமான பொருளான ‘வீடு’ இங்கு குடியிருப்புகளுடனான இணைப்புக்கும் சொத்துகளின் நிலைத்தன்மை பற்றிய சூழலுக்கும் பொருந்துகிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும் நிலைத்திருக்கும்
  rationale: நிரந்தரமாகத் தொடரும் என்ற கருத்தைத் தெரிவிக்கிறது. எபிரெயில் வினையில்லாத கூற்றைத் தமிழில் தெளிவாக்க ‘நிலைத்திருக்கும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: מִשְׁכְּנֹתָם
  choice: தங்கள் குடியிருப்புகள்
  rationale: வசிக்கும் இடங்களைக் குறிக்கும் பொதுச் சொல்; ‘வீடுகள்’ என்பதுடன் உள்ள இணைநிலையைத் தக்கவைக்கிறது.
- source_word: לְדֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: அடுத்தடுத்த தலைமுறைகள் முழுவதும் தொடர்வதைச் சுட்டும் எபிரெய மரபுத்தொடருக்கான இயல்பான தமிழ் வடிவம்.
- source_word: קָרְאוּ
  choice: சூட்டியிருக்கிறார்கள்
  rationale: קרא இங்கு ‘பெயரிடுதல்’ என்று பொருள்படுகிறது; நிலங்களுக்குப் பெயர் சூட்டுவதைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: בִּשְׁמוֹתָם
  choice: தங்கள் பெயர்களையே
  rationale: தங்கள் சொந்தப் பெயர்களைக் கொண்டு நிலங்களுக்கு பெயரிட்டதை ‘-ஏ’ வலியுறுத்தலுடன் தெளிவாகக் காட்டுகிறது.
- source_word: עֲלֵי אֲדָמוֹת
  choice: நிலங்களுக்கு
  rationale: சொந்த நிலப்பரப்புகள் அல்லது காணிகளைக் குறிக்கும் பன்மைச் சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: קִרְבָּם என்பதன் வாசிப்பும் மனிதரின் நிரந்தரத்தன்மை பற்றிய எண்ணமும்
  choice: மசோரா உரையைப் பின்பற்றி ‘அவர்கள் உள்ளத்தில் எண்ணுகிறார்கள்’ என முதன்மை உரையில் வழங்கப்பட்டது.
  alternative: ‘அவர்களுடைய கல்லறைகளே என்றென்றும் அவர்களுடைய வீடுகள்’ என்ற மாற்று உரைப் புரிதல்.
  rationale: WLC உயிர்க்குறிப்பிட்ட உரை உள்ளார்ந்த எண்ணத்தை ஆதரிக்கிறது. ஆனால் பழமையான மாற்றுப் புரிதல் சங்கீதத்தின் மரணப் பின்னணியில் பொருத்தமுடையதால், அதைத் தீர்மானமாக நிராகரிக்காமல் அடிக்குறிப்பில் வைத்துள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைநிலையும் நிரந்தரத்தன்மை குறித்த மனித எண்ணத்தின் நையாண்டித் தொனியும் காக்கப்பட்டுள்ளன.
