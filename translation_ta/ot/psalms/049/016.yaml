lexical_decisions:
- source_word: אַל תִּירָא
  choice: அஞ்சாதே
  rationale: אַל உடன் வரும் வினை வடிவம் தடையைத் தெரிவிக்கிறது; சுருக்கமான, கவிதைநயமுள்ள இயல்பான தமிழாக ‘அஞ்சாதே’ பொருந்துகிறது.
- source_word: כִּי
  choice: -போது / -போதும்
  rationale: இரு இடங்களிலும் כִּי அஞ்சுதலுக்குக் காரணமாகத் தோன்றும் சூழ்நிலையை அறிமுகப்படுத்துகிறது; தமிழில் காலச்சூழலை இயல்பாகக் காட்ட ‘-போது’ பயன்படுத்தப்பட்டது.
- source_word: יַעֲשִׁר אִישׁ
  choice: ஒருவன் செல்வந்தனாகும்போது
  rationale: יַעֲשִׁר இங்கு ‘செல்வந்தனாகுதல்’ என்ற நிலைமாற்றத்தையும், אִישׁ ஆண்பால் ஒருமையையும் தெரிவிக்கிறது; நீதிமொழித் தன்மையை ‘ஒருவன்’ காக்கிறது.
- source_word: יִרְבֶּה
  choice: பெருகும்போது
  rationale: רבה என்பதன் ‘அதிகரித்தல், பெருகுதல்’ என்ற பொருளைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: כְּבוֹד
  choice: மகிமை
  rationale: כבוד என்பதில் செல்வம் மட்டுமல்லாமல் கனம், சிறப்பு, செழிப்பால் வரும் மேன்மை ஆகிய பொருள் நிழல்களும் உள்ளன; ‘மகிமை’ மூல உருவகத்தின் அகலத்தைப் பாதுகாக்கிறது.
- source_word: בֵּיתוֹ
  choice: அவனுடைய வீடு
  rationale: בַּיִת என்பது கட்டிடமான வீட்டையும் குடும்பம் அல்லது வீட்டுச் செல்வாக்கையும் குறிக்கலாம்; ‘வீடு’ மூலச்சொல்லின் உருவகத்தையும் அதன் சாத்தியமான விரிவையும் காக்கிறது.
