translation_notes:
  register: நவீன நிலையான தமிழில் dignified ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. இரு கூறுகளிலும் வரும் ‘…இனாலும்’ அடுத்த வசனத்தில் நிறைவுபெறும் எபிரேய வாக்கிய ஓட்டத்தைப் பாதுகாக்கிறது; இறுதி நீண்ட கோடு அந்தத் தொடர்ச்சியை உணர்த்துகிறது. இரண்டாம் நபர் ‘நீ’ பொதுவான மனிதரை நேரடியாகச் சுட்டும் மூலத்தின் திடீர் நபர்மாற்றத்தை அப்படியே காக்கிறது.
