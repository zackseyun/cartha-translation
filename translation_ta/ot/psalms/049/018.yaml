  text: כִּֽי נַ֭פְשׁ/וֹ בְּ/חַיָּ֣י/ו יְבָרֵ֑ךְ וְ֝/יוֹדֻ֗/ךָ כִּי תֵיטִ֥יב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/018.yaml
  text: For his soul blesses itself during his life[a], and they praise you when you do well for yourself.
translation:
  language: ta
  text: 'அவன் வாழும் காலத்தில் தன்னையே ஆசீர்வதிக்கப்பட்டவன் என்று கருதினாலும்[a],

    நீ உனக்கு நன்மை செய்துகொள்ளும்போது மக்கள் உன்னைப் புகழ்ந்தாலும்—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: ‘அவன் வாழும் காலத்தில் தன்னைப் பாக்கியவனாகப் பாராட்டிக்கொண்டாலும்’.'
    reason: எபிரேய மரபுத்தொடர் தன்னை ஆசீர்வதித்துக்கொள்வது, தன்னைப் பாக்கியவனாகக் கருதுவது, அல்லது தன்னைப் பாராட்டிக்கொள்வது ஆகிய நெருங்கிய பொருள்களை அனுமதிக்கிறது.
lexical_decisions:
- source_word: כִּי (முதல் பயன்பாடு)
  choice: …இனாலும்
  rationale: 'முந்தைய மற்றும் அடுத்த வசனங்களோடு சேர்ந்த வாத ஓட்டத்தில் இது ஒப்புக்கொடுத்தல் அல்லது எதிர்மறை நிலையைக் குறிக்கிறது: செல்வன் வாழும்போது தன்னைப் பாக்கியவனாகக் கருதினாலும், இறுதியில் தன் முன்னோர்களிடம் செல்வான். தனித்து ‘ஏனெனில்’ என மொழிபெயர்ப்பதைவிட இச்சூழல்சார் தொடர்பு இயல்பானது.'
- source_word: נַפְשׁוֹ
  choice: தன்னையே
  rationale: נֶפֶשׁ இங்கு ஒருவரையே சுட்டும் பிரதிபெயர்ச்சிப் பொருளில் வருகிறது. வினை ஆண்பால் ஒருமையில் இருப்பதால் ‘அவனுடைய ஆத்துமா’ வினையின் எழுவாய் அல்ல; ‘அவன்’ மறைந்த எழுவாயாகவும் נַפְשׁוֹ செயப்படுபொருளாகவும் புரிகிறது.
- source_word: בְּחַיָּיו
  choice: அவன் வாழும் காலத்தில்
  rationale: செயல் அவனுடைய வாழ்நாளில் நடைபெறுவதைத் தெளிவாகவும் இயல்பான நவீன தமிழிலும் தெரிவிக்கிறது.
- source_word: יְבָרֵךְ
  choice: ஆசீர்வதிக்கப்பட்டவன் என்று கருதுகிறான்
  rationale: ‘தன் உயிரை ஆசீர்வதிக்கிறான்’ என்ற எபிரேய மரபுத்தொடர் இச்சூழலில் தன்னைப் பாக்கியவனாக எண்ணுதல் அல்லது பாராட்டிக்கொள்ளுதல் என்ற பொருளைக் கொண்டது. தமிழில் தவறான சடங்குசார் பொருள் தோன்றாமல் அதன் கருத்து வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: וְיוֹדֻךָ
  choice: மக்கள் உன்னைப் புகழ்கிறார்கள்
  rationale: பன்மை வினையின் குறிப்பிடப்படாத எழுவாய் பொதுவாக மக்களைக் குறிக்கிறது. ידה இங்கு நன்றி கூறுவதைவிட சமூக அங்கீகாரமான ‘புகழ்தல்’ என்ற பொருளுக்கு ஏற்றது.
- source_word: כִּי (இரண்டாம் பயன்பாடு)
  choice: …போது
  rationale: ஒருவர் தனக்கு நன்மை செய்துகொள்ளும் அல்லது செழிக்கும் சூழ்நிலையில்தான் மக்கள் புகழ்வதை இது குறிக்கிறது.
- source_word: תֵיטִיב לָךְ
  choice: நீ உனக்கு நன்மை செய்துகொள்கிறாய்
  rationale: ‘நீ செழிப்படைகிறாய்’ என்பதும் சாத்தியம்; ஆனால் எபிரேயத்தின் ‘நன்மை செய்’ என்ற வினையையும் לָךְ என்பதன் தன்னலம்/தனக்கான பயன் நுணுக்கத்தையும் இத்தேர்வு காக்கிறது.
