- source_word: פִּי
  choice: என் வாய்
  rationale: பேச்சு வாயிலிருந்து வெளிப்படுகிறது என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: יְדַבֵּר
  choice: பேசும்
  rationale: இச்சூழலில் imperfect வடிவம் சங்கீதக்காரரின் நோக்கத்தை அறிவிக்கும் எதிர்காலப் பொருளில் வருகிறது; தமிழில் ‘பேசும்’ என்பது இயல்பாக உள்ளது.
- source_word: חָכְמוֹת
  choice: ஞானத்தை
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும் இது கருத்துப்பெயரான பன்மையாகச் செயல்படுகிறது; தமிழில் ஒருமை ‘ஞானம்’ இயல்பான இணை.
- source_word: הָגוּת
  choice: தியானம்
  rationale: உள்ளார்ந்த சிந்தனை அல்லது ஆழ்ந்த மனனம் என்பதைக் குறிக்கிறது; வாயின் பேச்சுடன் இணையாக, இதயத்தில் உருவாகும் சிந்தனையைச் சுட்டுகிறது.
- source_word: לִבִּי
  choice: என் இதயத்தின்
  rationale: எபிரெய மொழியின் உடைமைத் தொடர்பையும், சிந்தனையின் உள்மையமாக இதயம் அமையும் வேதாகமப் படிமத்தையும் பாதுகாக்கிறது.
- source_word: תְבוּנוֹת
  choice: புரிந்துணர்வாக
  rationale: இச்சொல்லும் வடிவத்தில் பன்மையான கருத்துப்பெயராக உள்ளது; ‘புரிந்துணர்வு’ ஞானத்துடனான இணைநிலையைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
