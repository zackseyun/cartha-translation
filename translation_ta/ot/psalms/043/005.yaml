  yaml_path: translation/ot/psalms/043/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: ta
  text: என் உள்ளமே, நீ ஏன் சோர்ந்து தாழ்ந்திருக்கிறாய்? எனக்குள் ஏன் கலங்குகிறாய்? கடவுளை நம்பிக்கையுடன் எதிர்நோக்கு; ஏனெனில், என் முகத்துக்கு மீட்பாகவும் என் கடவுளாகவும் இருப்பவரை[a] நான் இன்னும் துதிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் சொற்சொல்லாக, ‘என் முகத்தின் மீட்புகள், என் கடவுள்.’ இது துயரத்தால் தாழ்ந்த முகத்தை மீண்டும் உயர்த்தி மலரச்செய்கிறவர் கடவுள் என்பதைக் குறிக்கலாம். ‘என் முகத்தின் உதவியும் என் கடவுளுமாகியவர்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: சோர்ந்து தாழ்ந்திருக்கிறாய்
  rationale: வினைச்சொல்லில் உடல் தாழ்வதன் உருவகமும் மனச்சோர்வின் பொருளும் உள்ளன. இரண்டையும் இயல்பான நவீனத் தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: נַפְשִׁי
  choice: என் உள்ளமே
  rationale: இங்கு பேசுபவர் தமது உள்ளார்ந்த தன்மையையே நோக்கிப் பேசுகிறார். ‘என் உள்ளமே’ என்பது சங்கீதத்தின் தற்சுட்டுப் பேச்சை இயல்பாகக் காக்கிறது.
- source_word: תֶּהֱמִי
  choice: கலங்குகிறாய்
  rationale: உள்ளத்தில் எழும் அமைதியின்மை, குழப்பம், கொந்தளிப்பு ஆகியவற்றை பொதுவாகப் புரியும் தமிழில் தெரிவிக்கிறது.
- source_word: עָלָי
  choice: எனக்குள்
  rationale: சொல்லுக்கு நேரடியாக ‘என்மேல்’ என்ற பொருள் இருந்தாலும், இங்குள்ள உள்ளார்ந்த கலக்கத்தைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘எனக்குள்’ பொருத்தமானது.
- source_word: הוֹחִילִי
  choice: நம்பிக்கையுடன் எதிர்நோக்கு
  rationale: இது வெறும் நம்பிக்கையை மட்டுமல்லாமல் பொறுமையுடன் எதிர்பார்ப்பதையும் குறிக்கிறது.
- source_word: לֵאלֹהִים
  choice: கடவுளை
  rationale: எதிர்நோக்குதலின் இலக்காகக் கடவுளைக் காட்டும் இயல்பான தமிழ் வேற்றுமை அமைப்பு.
- source_word: עוֹד
  choice: இன்னும்
  rationale: இப்போதைய துயரத்துக்கு மாறாக வருங்காலத்திலும் துதி எழும் என்ற தொடர்ச்சியையும் எதிர்பார்ப்பையும் காக்கிறது.
- source_word: אוֹדֶנּוּ
  choice: அவரை நான் துதிப்பேன்
  rationale: ידה என்பதன் சங்கீதச் சூழலிலான துதி அல்லது நன்றியறிவித்தல் என்ற பொருளில் ‘துதிப்பேன்’ பொருத்தமானது.
- source_word: יְשׁוּעוֹת
  choice: மீட்பு
  rationale: எபிரேயப் பன்மை இங்கு தீவிர அல்லது தொகுப்புப் பொருளுடையதாக இருக்கலாம்; தமிழில் ஒருமை ‘மீட்பு’ தெளிவாகவும் மூலத்தின் மையப் பொருளுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: פָּנַי
  choice: என் முகத்தின்
  rationale: மூலத்தின் தெளிவான ‘என் முகம்’ என்ற உருவகத்தை விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- source_word: וֵאלֹהָי
  choice: என் கடவுளுமாகிய
  rationale: மீட்பளிப்பவரும் ‘என் கடவுள்’ என்பவரும் ஒருவரே என்பதை மூலத்தின் இணைப்புடன் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְשׁוּעוֹת פָּנַי என்பதன் விளக்கம்
  choice: என் முகத்தின் மீட்பு
  alternative: என் முகத்தை மலரச்செய்கிற மீட்பர் / என் முகத்தின் உதவி
  rationale: மசோரா உரையின் ‘என் முகத்தின் மீட்புகள்’ என்ற சுருக்கமான, பலவாறு புரிந்துகொள்ளக்கூடிய உருவகத்தைத் திருத்தவோ முழுமையாக விளக்கிப் பரவசப்படுத்தவோ செய்யாமல் காக்கிறது. கடவுளுடைய மீட்பு தாழ்ந்த முகத்தை மீண்டும் உயர்த்துகிறது என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் வழங்கப்படுகிறது.
