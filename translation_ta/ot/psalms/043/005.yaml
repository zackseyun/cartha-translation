  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் கண்ணியமான சங்கீத நடையில் அமைக்கப்பட்டுள்ளது. ‘என் உள்ளமே’ என்பது இயல்பான தற்சுட்டுப் பேச்சைத் தருகிறது; இறுதி எபிரேய உருவகத்தின் உண்மையான தெளிவின்மை அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
