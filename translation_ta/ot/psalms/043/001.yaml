  to: தேவனே, எனக்கு நீதி வழங்கும்; விசுவாசமற்ற[a] ஒரு இனத்திற்கு எதிராக என் வழக்கை வாதாடும்; வஞ்சகமும் அநீதியும் உடைய மனிதனிடமிருந்து என்னை விடுவியும்.
  rationale: 'திருத்தம் பொருளை மாற்றாமல் இரண்டு அம்சங்களைச் சீர்செய்கிறது: ‘ஓர் இனத்தாருக்கு’ என்பதன் எண்/இலக்கணத் தளர்வை ‘ஒரு இனத்திற்கு’ என்று மாற்றுகிறது; மேலும், பொதுவாசகர்களுக்கு இயல்பான ‘விசுவாசமற்ற’ என்பதை முதன்மை உரையாகக் கொண்டு, חָסִיד-இன் விரிவான பொருள் வரம்பை அடிக்குறிப்பில் பாதுகாக்கிறது. இறுதி மனிதனைச் சுட்டும் ஒருமை, சட்டவியல் உருவகம், மற்றும் மீட்புக்கான வேண்டுதல் அனைத்தும் தக்கவைக்கப்பட்டுள்ளன.'
