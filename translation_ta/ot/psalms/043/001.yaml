  source_fidelity: 'மூலத்தின் சட்டவியல் வேண்டுதலை வரைவு நன்றாகக் காக்கிறது: שָׁפְטֵנִי என்பதற்கு ‘எனக்கு நீதி வழங்கும்,’ וְרִיבָה רִיבִי என்பதற்கு ‘என் வழக்கை வாதாடும்,’ மற்றும் תְפַלְּטֵנִי என்பதற்கு ‘என்னை விடுவியும்’ பொருத்தமானவை. ஆனால் מִגּוֹי לֹא חָסִיד என்பதில் ‘ஓர் இனத்தாருக்கு’ என்பது இலக்கண/எண் ஒத்திசைவில் தளர்வாக உள்ளது; மூலத்தின் ஒருமை-கூட்டுப்பொருளை ‘ஒரு இனத்திற்கு’ என்று தெளிவுபடுத்துவது பாதுகாப்பானது.'
  naturalness: ‘பற்றுறுதியற்ற’ என்பது தனித்து நிற்கும்போது நவீன பொதுத்தமிழில் சற்றே செயற்கையாக ஒலிக்கிறது. ‘விசுவாசமற்ற’ இயல்பானது; அடிக்குறிப்பு மூலம் חָסִיד-இன் இறைப்பற்று/விசுவாசப்பற்று சார்ந்த மாற்றுப் பொருளைத் தக்கவைக்கலாம். ‘வஞ்சகமும் அநீதியும் உடைய மனிதன்’ என்பது மூலத்தின் ‘வஞ்சகமும் அநீதியும் உடைய மனிதன்’ என்ற பண்புரையை நேரடியாகவும் இயல்பாகவும் தருகிறது.
  terminology: ‘தேவனே,’ ‘நீதி,’ ‘வழக்கு,’ ‘வாதாடும்,’ ‘விடுவியும்’ ஆகியவை கண்ணியமான நவீன வேதாகம நடைக்கும் மூலத்தின் நீதிமன்ற உருவகத்திற்கும் ஏற்றவை. חָסִיד-க்கு ‘விசுவாசமற்ற’ முதன்மை உரையாகத் தரப்பட்டு, ‘இறைப்பற்றில்லாத’ மாற்றாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
