  text: שָׁפְטֵ֤/נִי אֱלֹהִ֨ים וְ/רִ֘יבָ֤/ה רִיבִ֗/י מִ/גּ֥וֹי לֹא חָסִ֑יד מֵ֤/אִישׁ מִרְמָ֖ה וְ/עַוְלָ֣ה תְפַלְּטֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/001.yaml
  text: Vindicate me[a], O God, and plead my cause against an unfaithful nation; deliver me from the deceitful and unjust man.
translation:
  language: ta
  text: தேவனே, எனக்கு நீதி வழங்கும்; விசுவாசமற்ற[a] ஒரு இனத்திற்கு எதிராக என் வழக்கை வாதாடும்; வஞ்சகமும் அநீதியும் உடைய மனிதனிடமிருந்து என்னை விடுவியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைப்பற்றில்லாத”; எபிரெயத்தில், “பற்றுறுதியுள்ள/விசுவாசமுள்ளதல்லாத ஒரு இனம்.”
    reason: חָסִיד என்ற சொல்லின் மறுப்பு வடிவம் இறைப்பற்று இல்லாமையையோ, உறவுசார் அல்லது உடன்படிக்கைச் சார்ந்த விசுவாசப்பற்று இல்லாமையையோ குறிக்கக்கூடும்.
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: எனக்கு நீதி வழங்கும்
  rationale: தனிப்பட்ட நபரைச் செயப்படுபொருளாகக் கொண்ட இந்த வேண்டுதல், வெறுமனே அவரை நியாயந்தீர்ப்பதை அல்லாமல், அவரது சார்பாக நீதியான தீர்ப்பு வழங்குவதைச் சுட்டுகிறது. தமிழில் சட்டவியல் பொருளையும் வேண்டுதலின் இயல்பையும் இது தெளிவாகக் காட்டுகிறது.
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: இது ஜெபத்தில் வரும் நேரடி அழைப்பு; ‘தேவனே’ என்பது இயல்பான, கண்ணியமான தமிழ் விளி வடிவம்.
- source_word: וְרִיבָה רִיבִי
  choice: என் வழக்கை வாதாடும்
  rationale: வினைச்சொல்லும் அதே வேருடைய பெயர்ச்சொல்லும் சேர்ந்த இத்தொடர், ஒருவருடைய சட்ட வழக்கை ஏற்று நடத்துவதைக் குறிக்கும். ‘என் வழக்கை வாதாடும்’ என்பது அந்த நீதிமன்ற உருவகத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: מִגּוֹי לֹא חָסִיד
  choice: பற்றுறுதியற்ற ஓர் இனத்தாருக்கு எதிராக
  rationale: சட்ட வழக்கின் சூழலில் מִן எதிர்த்தரப்பைக் குறிக்கிறது. חָסִיד என்பது உண்மைப்பற்று, விசுவாசம் அல்லது உடன்படிக்கைச் சார்ந்த பற்றுறுதி உடையவரைக் குறிக்கக்கூடும்; அதன் மறுப்பு ‘பற்றுறுதியற்ற’ என்று மொழிபெயர்க்கப்பட்டுள்ளது. גּוֹי இங்கு ஒரு மக்கள் இனத்தைக் குறிக்கிறது.
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  choice: வஞ்சகமும் அநீதியும் நிறைந்த மனிதனிடமிருந்து
  rationale: பின்வரும் பண்புப் பெயர்கள் அந்த மனிதனை வஞ்சகமும் அநீதியும் இயல்பாகக் கொண்டவனாக விவரிக்கின்றன. மூலத்தின் ஒருமையையும் சட்டவியல் சூழலையும் இம்மொழிபெயர்ப்பு காக்கிறது.
- source_word: תְפַלְּטֵנִי
  choice: என்னை விடுவியும்
  rationale: פלט என்பதன் தீவிர வினைவடிவம் ஆபத்திலிருந்து ஒருவரைப் பாதுகாப்பாக மீட்பதைக் குறிக்கிறது. ‘விடுவியும்’ என்பது ஜெபத்திற்கேற்ற கண்ணியமான நடையில் இந்த வேண்டுதலைத் தெரிவிக்கிறது.
theological_decisions:
- issue: மறுப்பு வடிவில் வரும் חָסִיד என்பதன் பொருள்
  choice: பற்றுறுதியற்ற
  alternative: இறைப்பற்றில்லாத; உடன்படிக்கை விசுவாசமில்லாத
  rationale: חָסִיד என்பது חֶסֶד உடன் தொடர்புடையதால், வெறும் பொதுவான பக்தியின்மையைவிட உண்மைப்பற்று அல்லது உறவுசார் விசுவாசம் இல்லாததைக் குறிக்கலாம். ‘பற்றுறுதியற்ற’ என்பது அந்த உறவு மற்றும் அறநெறிப் பரிமாணத்தைப் பாதுகாக்கிறது; பிற சாத்தியப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஜெப நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘வழக்கு’, ‘நீதி’ ஆகிய சொற்கள் மூலத்தின் நீதிமன்ற உருவகத்தைத் தெளிவாக வைத்திருக்கின்றன; இறுதி வினைகள் ஜெபத்திற்குரிய மரியாதையான ஏவல் வடிவில் உள்ளன.
