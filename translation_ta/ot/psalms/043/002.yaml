source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה אֱלֹהֵ֣י מָֽעוּזִּ/י֮ לָ/מָ֪ה זְנַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֶתְהַלֵּ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/002.yaml
  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression of the enemy?
translation:
  language: ta
  text: ஏனெனில், நீரே எனக்கு அடைக்கலமான கடவுள்[a]; ஏன் என்னைத் தள்ளிவிட்டீர்? எதிரியின் ஒடுக்குதலின்கீழ் நான் ஏன் துயருடன் நடக்கிறேன்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “எனக்கு அரணான கடவுள்” அல்லது “என் வலிமையின் கடவுள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பெயர்ச்சொல் சூழலுக்கேற்ப அடைக்கலம், அரண், அல்லது வலிமையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “எதிரியின் ஒடுக்குதலின்கீழ் நான் ஏன் இருண்ட நிலையில் நடக்கிறேன்?” என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் சொல்லடிப்படையாக ‘இருண்ட நிலையில்’ நடப்பது துக்கத்தைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי מָעוּזִּי
  choice: என் அடைக்கலத்தின் கடவுள்
  rationale: מָעוֹז என்பது பாதுகாப்பளிக்கும் அடைக்கலம், அரண், அல்லது வலிமையைக் குறிக்கக்கூடும். இங்கு பாதுகாப்பின் உருவகத்தைத் தக்கவைத்து, எபிரெயக் கட்டமைப்பையும் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: לָמָה
  choice: ஏன்
  rationale: புலம்பலின் கவித்துவ வலிமையைத் தக்கவைக்க, இரு இடங்களிலும் மீண்டும் வரும் வினாச்சொல் அப்படியே மீளுரைக்கப்படுகிறது.
- source_word: זְנַחְתָּנִי
  choice: என்னைத் தள்ளிவிட்டீர்
  rationale: זנח என்பதன் நிராகரித்தல் அல்லது ஒதுக்கித் தள்ளுதல் என்ற கடுமையான பொருளை நவீனத் தமிழில் தெளிவாகக் காட்டுகிறது; முற்றிலும் கைவிடுதல் என்ற கூடுதல் பொருளைத் திணிக்கவில்லை.
- source_word: קֹדֵר
  choice: துக்கத்தோடு
  rationale: சொல்லடிப்படையில் இருண்ட நிலையில் இருப்பதைக் குறித்தாலும், புலம்பல் சூழலில் அது துக்கத்தை வெளிப்படுத்தும் மரபுத்தொடராக உள்ளது.
- source_word: אֶתְהַלֵּךְ
  choice: அலைந்து திரிகிறேன்
  rationale: தொடர்ந்து நடந்துகொண்டிருப்பதையோ ஒரு நிலையில் சுற்றித் திரிவதையோ குறிக்கும் வினை வடிவத்தின் நீடித்த தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּלַחַץ אוֹיֵב
  choice: எதிரியின் ஒடுக்குதலால்
  rationale: לַחַץ குறிக்கும் அழுத்தம் அல்லது ஒடுக்குதலையும், בְּ இங்கு காட்டும் காரணம் அல்லது சூழ்நிலையையும் சுருக்கமான இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: புலம்பலில் கடவுள் தள்ளிவிட்டதாகக் கூறும் மொழி
  choice: “ஏன் என்னைத் தள்ளிவிட்டீர்?” என்ற நேரடியான முறையீட்டைத் தக்கவைத்தல்
  alternative: “ஏன் என்னைக் கைவிட்டீர்?” அல்லது குற்றச்சாட்டை மென்மையாக்கிய மொழிபெயர்ப்பு
  rationale: வசனம் கடவுள் தொலைவில் இருப்பதாகப் பாடகர் உணரும் உடன்படிக்கைப் புலம்பலின் பதற்றத்தை வெளிப்படுத்துகிறது. அதை கோட்பாட்டு விளக்கத்தால் தீர்க்காமலும், உணர்ச்சியாக மட்டும் மென்மையாக்காமலும் மூலத்தின் நேரடித் தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: மொழிநடை நவீன, செம்மையான, வழிபாட்டு வாசிப்பிற்கேற்ற பொதுத்தமிழாக வைக்கப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான “நீரே/தள்ளிவிட்டீர்” பயன்படுத்தப்பட்டுள்ளது; புலம்பலின் இரு “ஏன்” கேள்விகளும் கவித்துவ அழுத்தத்திற்காகப் பாதுகாக்கப்பட்டுள்ளன.
