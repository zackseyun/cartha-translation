  text: שְׁלַח אוֹרְ/ךָ֣ וַ֭/אֲמִתְּ/ךָ הֵ֣מָּה יַנְח֑וּ/נִי יְבִיא֥וּ/נִי אֶל הַֽר קָ֝דְשְׁ/ךָ֗ וְ/אֶל מִשְׁכְּנוֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/003.yaml
  text: Send out your light and your truth[a]; let them lead me[b]; let them bring me to your holy mountain and to your dwelling places.
translation:
  language: ta
  text: உமது ஒளியையும் உமது உண்மையையும்[a] அனுப்பியருளும்; அவையே என்னை வழிநடத்தட்டும்; அவை என்னை உமது புனித மலைக்கும் உமது உறைவிடங்களுக்கும்[b] கொண்டுசெல்லட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது உண்மைத்தன்மை’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் (אֱמֶת) உண்மை, நம்பகத்தன்மை அல்லது உண்மைத்தன்மையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உறைவிடங்கள்’ என்பது எபிரெய மொழியின் பன்மை வடிவத்தை மொழிபெயர்க்கிறது; மரபாக, ‘உமது கூடாரங்கள்’ என்றும் மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: அனுப்பியருளும்
  rationale: שלח என்பதன் இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை வடிவம். இறைவனை நோக்கிய வேண்டுதலுக்குரிய இயல்பான, கண்ணியமான தமிழ் நடையில் கட்டளையின் வேண்டுதல் வலிமையைத் தக்கவைக்கிறது.
- source_word: אוֹרְךָ
  choice: உமது ஒளி
  rationale: אוֹר என்பதன் நேரடிப் பொருளான ‘ஒளி’ தக்கவைக்கப்படுகிறது; வழிநடத்தல் அல்லது மீட்பு என்னும் உட்பொருளை முதன்மை உரையிலேயே விளக்கமாக மாற்றவில்லை.
- source_word: אֲמִתְּךָ
  choice: உமது உண்மை
  rationale: אֱמֶת என்பது உண்மை, நம்பகத்தன்மை, உண்மைத்தன்மை ஆகிய பொருட்களை ஏற்கக்கூடும். ‘உண்மை’ நேரடியான பொருளைத் தக்கவைக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: הֵמָּה
  choice: அவையே
  rationale: எபிரெயத் தனிப்பட்ட பன்மைச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் ‘அவையே’ என்பதால் வெளிப்படுத்துகிறது; இது ஒளியையும் உண்மையையும் கவித்துவமான செயல்பாட்டாளர்களாகக் காட்டுகிறது.
- source_word: יַנְחוּנִי
  choice: என்னை வழிநடத்தட்டும்
  rationale: נחה என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் வேண்டுதல் சார்ந்த பொருளைக் கொண்டது. ‘வழிநடத்தட்டும்’ என்பது வழிகாட்டும் உருவகத்தையும் வினையின் வலிமையையும் இயல்பாகக் காக்கிறது.
- source_word: יְבִיאוּנִי
  choice: என்னை … கொண்டுசெல்லட்டும்
  rationale: בוא என்பதன் ஹிஃபில் வடிவம் இலக்கை நோக்கி அழைத்துச் செல்லும் இயக்கத்தைக் குறிக்கிறது. தமிழில் ‘கொண்டுசெல்லட்டும்’ அந்த இயக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַר קָדְשְׁךָ
  choice: உமது புனித மலை
  rationale: ‘உமது பரிசுத்தத்தின் மலை’ என்ற சொற்படியான அமைப்பை இயல்பான தமிழில் ‘உமது புனித மலை’ என வழங்குகிறது; சீயோன் என்று மூலத்தைவிடக் குறிப்பாக்கவில்லை.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: உமது உறைவிடங்கள்
  rationale: מִשְׁכָּן என்பதன் பன்மையைப் பாதுகாத்து, பழமையான அல்லது அளவுக்கு மீறிய தொழில்நுட்பச் சொல்லைத் தவிர்த்து, நவீன தமிழில் தெளிவாக வழங்குகிறது.
theological_decisions:
- issue: ‘ஒளி’ மற்றும் ‘உண்மை’ ஆகியவற்றை இறைபண்புகளாக மட்டும் விளக்குவதா அல்லது செயல்படும் கவித்துவ உருவகங்களாகத் தக்கவைப்பதா
  choice: ‘அவையே என்னை வழிநடத்தட்டும்; அவை என்னை … கொண்டுசெல்லட்டும்’ என்று பன்மை வினைகளுடன் கவித்துவ ஆளுருவாக்கத்தைத் தக்கவைத்தல்
  alternative: இவற்றை ‘உமது மீட்பளிக்கும் வழிகாட்டுதல்’ என்று விளக்கமாக மாற்றுதல்
  rationale: எபிரெயத்தில் இவ்விரு பெயர்களையும் சுட்டும் வலியுறுத்தப்பட்ட பன்மைச் சுட்டுப்பெயரும் பன்மை வினைகளும் உள்ளன. அவற்றைத் தக்கவைப்பது மூலக் கவிதையையும் அதன் இறையியல் திறந்தநிலையையும் பாதுகாக்கிறது.
- issue: மலையையும் உறைவிடங்களையும் சீயோன் மற்றும் ஆலயம் என்று நேரடியாக அடையாளப்படுத்துவதா
  choice: ‘உமது புனித மலை’ மற்றும் ‘உமது உறைவிடங்கள்’ என்ற மூலத்தின் விரிவான கவித்துவச் சொற்களையே பயன்படுத்துதல்
  alternative: ‘சீயோன்’ அல்லது ‘உமது ஆலயம்’ என்று குறிப்பாக்குதல்
  rationale: சூழலில் சீயோனும் திருத்தலமும் குறிக்கப்படலாம்; ஆயினும் எபிரெய உரை அவற்றை அப்பெயர்களால் நேரடியாகக் குறிப்பிடவில்லை. மொழிபெயர்ப்பு மூலத்தைவிடக் குறிப்பான இறையியல் அடையாளத்தைச் சேர்க்காது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை நோக்கிய கண்ணியமான வேண்டுதல் நடையாக ‘உமது’ மற்றும் ‘அனுப்பியருளும்’ பயன்படுத்தப்பட்டுள்ளன. தொடர்ச்சியான வேண்டுதல்களை அரைப்புள்ளிகள் பிரிக்கின்றன. ‘அவையே’ என்பது எபிரெய வலியுறுத்தலையும் கவித்துவ ஆளுருவாக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது; ‘புனித மலை’ மற்றும் ‘உறைவிடங்கள்’ மூலத்தின் உருவகங்களை அதிகமாக விளக்காமல் காக்கின்றன.
