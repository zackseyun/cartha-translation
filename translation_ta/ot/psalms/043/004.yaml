  text: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
translation:
  language: ta
  text: 'அப்போது நான் கடவுளின் பலிபீடத்திற்குச் செல்வேன்,

    என் களிப்பின் மகிழ்ச்சியான கடவுளிடம்[a];

    யாழோடு உம்மைப் புகழ்வேன்—

    கடவுளே, என் கடவுளே!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பேரானந்தமான கடவுளிடம்.” எபிரேயத்தில் சொற்சொல்லாக “என் களிப்பின் மகிழ்ச்சி” என்று கூறி, மகிழ்ச்சியைக் குறிக்கும் இரு சொற்களால் வலியுறுத்தப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹאָה
  choice: அப்போது நான் … செல்வேன்
  rationale: முந்தைய வேண்டுதல்களின் விளைவாக வரும் தீர்மானத்தையும் நோக்கத்தையும், நவீன தமிழில் இயல்பான எதிர்காலத் தொடராக வெளிப்படுத்துகிறது.
- source_word: אֶל מִזְבַּח אֱלֹהִים
  choice: கடவுளின் பலிபீடத்திற்குச்
  rationale: எபிரேய இணைப்புத் தொடரைத் தெளிவாகவும் வழிபாட்டுச் சூழலுக்கு ஏற்ற கண்ணியத்துடனும் தருகிறது.
- source_word: אֶל אֵל
  choice: கடவுளிடம்
  rationale: אֵל இங்கு אֱלֹהִים என்பதற்கு இணையான இறைப்பட்டமாக வருகிறது; தேவையற்ற பெயர் அல்லது பண்புவேறுபாட்டை உருவாக்காமல் ஒரே குறிப்பைத் தக்கவைக்கிறது.
- source_word: שִׂמְחַת גִּילִי
  choice: என் களிப்பின் மகிழ்ச்சி
  rationale: மகிழ்ச்சியைக் குறிக்கும் இரு நெருங்கிய சொற்களால் உருவாகும் எபிரேய வலியுறுத்தலைத் தமிழிலும் இரட்டை மகிழ்ச்சி மொழியால் பாதுகாக்கிறது.
- source_word: וְאוֹדְךָ
  choice: உம்மைப் புகழ்வேன்
  rationale: ידה என்பதற்கு ‘நன்றி செலுத்துதல்’ என்றும் பொருள் இருக்கலாம்; இசையோடு நடைபெறும் பொதுவழிபாட்டுச் சூழலில் ‘புகழ்வேன்’ பொருத்தமானது.
- source_word: בְכִנּוֹר
  choice: யாழை இசைத்து
  rationale: כִּנּוֹר என்பது பண்டைய நரம்பிசைக் கருவி. ‘யாழ்’ அதன் பொதுவான கருவிவகையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘இசைத்து’ என்பது கருவியுடன் புகழ்வதைக் தெளிவாக்குகிறது.
- source_word: אֱלֹהִים אֱלֹהָי
  choice: கடவுளே, என் கடவுளே
  rationale: நேரடி அழைப்பையும், மீளுரையையும், தனிப்பட்ட உறவையும் தக்கவைக்கிறது.
theological_decisions:
- issue: אֱלֹהִים / אֵל என்ற இறைப்பட்டங்களின் மீளுரை
  choice: இரண்டையும் ‘கடவுள்’ என்று மொழிபெயர்த்து, மீளுரையைத் தக்கவைத்தல்
  alternative: אֵל என்பதை ‘வல்லமையுள்ள கடவுள்’ என்றோ ‘ஏல்’ என்றோ வேறுபடுத்துதல்
  rationale: இவ்வசனத்தில் இச்சொற்கள் வெவ்வேறு இறை ஆள்களையோ தனித்த கோட்பாட்டுப் பண்புகளையோ சுட்டாமல், கவிதைநயமான இணைச்சொற்களாக ஒரே கடவுளைக் குறிக்கின்றன.
translation_notes:
  register: நவீன செந்தமிழுக்கு அணுக்கமான, வழிபாட்டுக்குரிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உம்மை’ என்ற மரியாதை ஒருமை, தமிழில் கடவுளை நேரடியாக அழைக்கும் இயல்பான வழக்கைத் தொடர்கிறது. கவிதை இணைநிலையைத் தெளிவாக்க வரிப் பிரிப்பு செய்யப்பட்டுள்ளது.
