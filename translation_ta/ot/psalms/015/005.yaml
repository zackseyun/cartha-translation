id: PSA.15.5
reference: Psalms 15:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כַּסְפּ֤/וֹ לֹא נָתַ֣ן בְּ/נֶשֶׁךְ֮ וְ/שֹׁ֥חַד עַל נָקִ֗י לֹ֥א לָ֫קָ֥ח עֹֽשֵׂה אֵ֑לֶּה לֹ֖א יִמּ֣וֹט לְ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
translation:
  language: ta
  text: தன் பணத்தை வட்டிக்குக் கடன் கொடுக்காதவன்[a]; குற்றமற்றவனுக்கு எதிராகக் கையூட்டு வாங்காதவன். இவற்றைச் செய்கிறவன் ஒருபோதும் அசைக்கப்படமாட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் கடனுக்காக வாங்கப்படும் வட்டியைக் குறிக்கலாம்; அது அளவுக்கு மீறிய வட்டிக்கு மட்டும் வரையறுக்கப்படவில்லை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்றென்றும் நிலைகுலையமாட்டான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפּוֹ
  choice: தன் பணத்தை
  rationale: כֶּסֶף என்பதன் நேர்ப்பொருள் ‘வெள்ளி’ என்றாலும், கடனும் வட்டியும் குறித்த இச்சூழலில் அது பணத்தைக் குறிக்கிறது.
- source_word: נָתַן בְּנֶשֶׁךְ
  choice: வட்டிக்குக் கடன் கொடுக்காதவன்
  rationale: இந்தச் சொற்றொடர் கடனுக்கு வட்டி வாங்குவதைக் குறிக்கிறது. ‘வட்டிக்குக் கடன் கொடுத்தல்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ்; மூலத்தில் இல்லாத ‘அளவுக்கு மீறிய வட்டி’ என்ற வரம்பை இது சேர்ப்பதில்லை.
- source_word: שֹׁחַד
  choice: கையூட்டு
  rationale: நீதியைப் பிறழச் செய்வதற்காகப் பெறப்படும் லஞ்சத்தை இச்சொல் குறிக்கிறது; ‘கையூட்டு’ அதன் அறவியல் மற்றும் நீதித்துறை வலிமையைத் தக்கவைக்கிறது.
- source_word: עַל נָקִי
  choice: குற்றமற்றவனுக்கு எதிராக
  rationale: נָקִי என்பது குற்றமற்ற அல்லது பழியற்ற ஒருவரைக் குறிக்கிறது. עַל என்பதன் எதிர்நிலைத் தொடர்பை ‘எதிராக’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: עֹשֵׂה אֵלֶּה
  choice: இவற்றைச் செய்கிறவன்
  rationale: எபிரெயப் பெயரெச்சம் இத்தகைய செயல்களால் அடையாளப்படுத்தப்படும் ஒருவரைக் குறிக்கிறது; ஒருமைத் தன்மையும் பொதுப்பொருளும் தக்கவைக்கப்பட்டுள்ளன.
- source_word: לֹא יִמּוֹט לְעוֹלָם
  choice: ஒருபோதும் அசைக்கப்படமாட்டான்
  rationale: מוֹט என்பதன் நிலைகுலைதல் அல்லது அசைக்கப்படுதல் என்ற உருவகத்தையும், மறுப்புடன் வரும் לְעוֹלָם என்பதன் ‘ஒருபோதும் இல்லை’ என்ற கால வலிமையையும் இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: வட்டி வாங்குவதற்கான அறவியல் கண்டனத்தின் பரப்பு
  choice: נֶשֶׁךְ என்பதை பொதுவாக ‘வட்டி’ என்று மொழிபெயர்த்தல்
  alternative: ‘கந்துவட்டி’ அல்லது ‘அளவுக்கு மீறிய வட்டி’ என்று குறுக்குதல்
  rationale: மூலச்சொல் கடனுக்கான வட்டியைக் குறிக்கக்கூடும்; அதை அளவுக்கு மீறிய அல்லது சட்டவிரோத வட்டிக்கு மட்டும் வரையறுப்பது பிற்காலப் பொருளாதார வேறுபாட்டை வசனத்துக்குள் புகுத்திவிடும்.
- issue: இறுதி வாக்குறுதியின் தன்மை
  choice: நிலைத்தன்மையைச் சித்தரிக்கும் ‘ஒருபோதும் அசைக்கப்படமாட்டான்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: உலக வாழ்வில் எந்தத் துன்பமும் ஏற்படாது என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலம் நிலைகுலையாமையை உருவகமாகக் கூறுகிறது; அதன் துல்லியமான நடைமுறை அல்லது இறையியல் எல்லையை வசனமே இங்கு விளக்காததால், மொழிபெயர்ப்பு அதைச் சுருக்கி முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குத் தெளிவான நடை பயன்படுத்தப்பட்டுள்ளது. முந்தைய வசனங்களின் பண்புப் பட்டியலைத் தொடரும் எபிரெய அமைப்பு, ‘...கொடுக்காதவன்; ...வாங்காதவன்’ என்ற இணைநடையில் பாதுகாக்கப்பட்டுள்ளது.
