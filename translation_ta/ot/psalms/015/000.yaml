  text: A psalm of David[a]. Yahweh[b], who may dwell in your tent? Who may live on your holy mountain?
translation:
  language: ta
  text: 'தாவீதின் சங்கீதம்.[a]


    யெகோவாவே, உமது கூடாரத்தில் யார் தங்க முடியும்?[b]


    உமது பரிசுத்த மலையில் யார் குடியிருக்க முடியும்?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதால் இயற்றப்பட்ட சங்கீதம்” அல்லது “தாவீதுக்கான சங்கீதம்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தலைப்பிலுள்ள சொற்றொடர் ஆசிரியர், தொடர்பு, அல்லது அர்ப்பணிப்பு ஆகியவற்றில் எதைக் குறிக்கிறது என்பது தெளிவாக இல்லை.
    reason: alternative_reading
  - marker: b
    text: “திருக்கூடாரம்” என்றும் கொள்ளலாம். எபிரெய மொழியில் நேரடியாக “கூடாரம்” என்றுள்ளது; இது தேவன் வாசம் செய்யும் பரிசுத்த இடத்தைச் சுட்டுவதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: பாடலாகப் பாடப்படும் துதியைக் குறிக்கும் எபிரெயச் சொல்லுக்கான பரவலாக அறியப்பட்ட, இயல்பான வேதாகமத் தமிழ் சொல்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரைப் பொதுப்பட்ட பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட வடிவில் தருகிறது.
- source_word: יָגוּר
  choice: தங்கியிருப்பவன்
  rationale: ஒருவரிடம் அல்லது ஓரிடத்தில் விருந்தாளியாகத் தங்குதல்/வசித்தல் என்ற சொல்லின் நுண்பொருளை இயல்பான தமிழில் காட்டுகிறது.
- source_word: בְּאָהֳלֶךָ
  choice: உமது கூடாரத்தில்
  rationale: אָהֶל என்பதன் நேரடிப் பொருளான ‘கூடாரம்’ என்பதைக் காத்து, இங்கு தேவனுடைய பரிசுத்த இருப்பிடத்தைக் குறிக்கும் உருவகத்தை நிலைநிறுத்துகிறது.
- source_word: יִשְׁכֹּן
  choice: குடியிருப்பவன்
  rationale: நிலையாக வசித்தல் என்ற பொருளைத் தருவதுடன், முதல் கேள்வியின் வினையிலிருந்து காணப்படும் எபிரெய இணைநிலையின் வேறுபாட்டையும் காக்கிறது.
- source_word: הַר קָדְשֶׁךָ
  choice: உமது பரிசுத்த மலை
  rationale: மூலத்தின் உரிமைத் தொடர்பையும் பரிசுத்த இடம் என்ற பொருளையும் நேரடியாகக் காக்கிறது.
theological_decisions:
- issue: לְדָוִד என்ற தலைப்பின் உறவு
  choice: தாவீதின் சங்கீதம்
  alternative: தாவீதால் இயற்றப்பட்ட சங்கீதம் / தாவீதுக்கான சங்கீதம்
  rationale: לְ என்ற முன்னொட்டு ஆசிரியர், தொடர்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும்; முதன்மை உரையில் இயல்பான மரபுவழி வடிவத்தை வைத்து, தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
- issue: கூடாரம் குறிக்கும் பரிசுத்த இடம்
  choice: கூடாரம்
  alternative: திருக்கூடாரம்
  rationale: மூலத்தில் ‘கூடாரம்’ என்றே உள்ளதால் அதை நேரடியாக வைத்திருக்கிறது; அது தேவனுடைய சரணாலயத்தைச் சுட்டலாம் என்பதை அடிக்குறிப்பு விளக்குகிறது, ஆனால் உரையிலேயே விளக்கத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’ என்பது சங்கீதத்தின் வழிபாட்டு நயத்தைத் தக்கவைக்கிறது; இரண்டு இணையான கேள்விகளிலும் வேறுபட்ட எபிரெய வினைகளுக்கேற்ப ‘தங்கியிருப்பவன்’ மற்றும் ‘குடியிருப்பவன்’ என வேறுபாடு காக்கப்பட்டுள்ளது.
