  text: הוֹלֵ֣ךְ תָּ֭מִים וּ/פֹעֵ֥ל צֶ֑דֶק וְ/דֹבֵ֥ר אֱ֝מֶ֗ת בִּ/לְבָבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/002.yaml
  text: He who walks blamelessly[a], and does what is right[b], and speaks truth in his heart.
translation:
  language: ta
  text: நேர்மையுடன் நடந்து[a], நீதியானதைச் செய்து[b], தன் உள்ளத்தில் உண்மையைப் பேசுகிறவன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குறைவில்லாமல்.’ எபிரெயச் சொல் நடத்தையில் முழுமை அல்லது நேர்மையைக் குறிக்கலாம்; முழுமையான பாவமின்மையை அவசியம் குறிக்காது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீதியைச் செய்து’ / ‘நியாயத்தைச் செய்து.’ எபிரெயப் பெயர்ச்சொல் ‘சரியானது’ என்பதோடு நீதித்தன்மை அல்லது நியாயம் என்ற பொருளையும் தரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: நடந்து
  rationale: הלך என்பதன் பங்கேற்புவினை இங்கு ஒருவரின் வாழ்க்கை முறையைக் குறிக்கும் உருவகமாக உள்ளது. ‘நடந்து’ என்பது அந்த எபிரெய உருவகத்தைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: תָּמִים
  choice: குற்றமற்றவனாய்
  rationale: இச்சொல் முழுமை, பழுதின்மை, ஒழுக்க நேர்மை ஆகிய கருத்துகளைக் குறிக்கிறது; இங்கு முழுமையான பாவமின்மையை அவசியம் குறிக்கவில்லை. ‘குற்றமற்றவனாய்’ என்பது அதன் ஒழுக்க வலிமையைப் பாதுகாக்கிறது.
- source_word: וּפֹעֵל
  choice: செய்து
  rationale: פעל என்பதன் பங்கேற்புவினை தொடர்ந்து செய்வதையோ நடைமுறைப்படுத்துவதையோ குறிக்கிறது. இணையான மூன்று செயல்களைக் கொண்ட எபிரெய அமைப்பை ‘செய்து’ இயல்பாகத் தொடர்கிறது.
- source_word: צֶדֶק
  choice: நீதியானதை
  rationale: צדק என்பது நீதி, நீதித்தன்மை, சரியானது ஆகிய பொருள்களைக் கொண்டது. ‘நீதியானதைச் செய்து’ என்பது நடைமுறை ஒழுக்கச் செயலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: וְדֹבֵר
  choice: பேசுகிறவன்
  rationale: דבר இங்கு ‘பேசுதல்’ என்ற நேரடிப் பொருளில் வருகிறது. இறுதி பங்கேற்புவினையைத் தொடர்பெயர் வடிவில் மொழிபெயர்ப்பது முழு வரியையும் ஒரே நபரை விவரிக்கும் இயல்பான தமிழ் வாக்கியமாக்குகிறது.
- source_word: אֱמֶת
  choice: உண்மையை
  rationale: אמת நம்பகத்தன்மையையும் உண்மைத்தன்மையையும் குறிக்கலாம்; ‘பேசுதல்’ என்பதுடன் இங்கு முதன்மையாக உண்மையான பேச்சைக் குறிக்கிறது.
- source_word: בִּלְבָבוֹ
  choice: தன் உள்ளத்தில்
  rationale: எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘அவனுடைய இருதயத்தில்’ எனப் பொருள்படும். ‘தன் உள்ளத்தில்’ என்பது உள்மன நேர்மையையும் உள்ளார்ந்த உண்மையையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பிரதிநிதித்துவ ஆண்பால் ஒருமை
  choice: குற்றமற்றவனாய் … பேசுகிறவன்
  alternative: குற்றமின்றி நடப்பவர் … பேசுபவர்
  rationale: எபிரெயம் ஆண்பால் ஒருமைப் பங்கேற்புவினைகளையும் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டையும் பயன்படுத்துகிறது. தமிழ் ஆண்பால் ஒருமை வடிவம் மூலத்தின் இலக்கண வடிவத்தையும் சங்கீதத்தின் கேள்விக்கான தனிநபர் பதிலையும் பாதுகாக்கிறது.
- issue: ஒழுக்க நேர்மையா அல்லது முழுமையான பாவமின்மையா
  choice: குற்றமற்றவனாய்
  alternative: நேர்மையுடன் / பூரணமானவனாய்
  rationale: תָּמִים இங்கு வாழ்க்கை நடத்தையின் முழுமையையும் நேர்மையையும் விவரிக்கிறது; முழுமையான பாவமின்மையைத் தெளிவாக வலியுறுத்துவதில்லை. தேர்ந்த சொல் ஒழுக்கக் கருத்தைப் பாதுகாக்கிறது; அடிக்குறிப்பு அதன் வரம்பை விளக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. மூலத்தின் ‘நடத்தல்’ உருவகம், மூன்று இணையான செயல்கள், ஆண்பால் ஒருமை, உள்ளார்ந்த உண்மை ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ‘இதயம்’ என்பதற்குப் பதிலாக உள்நபரைக் குறிக்கும் இயல்பான ‘உள்ளம்’ பயன்படுத்தப்பட்டுள்ளது.
