base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/003.yaml
  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
translation:
  language: ta
  text: தன் நாவினால் புறங்கூறாதவன்[a], தன் அயலானுக்குத் தீமை செய்யாதவன்[b], தனக்கு நெருக்கமானவன்மீது பழிச்சொல்லைச் சுமத்தாதவன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் நாவினால் பழிச்செய்திகளைப் பரப்பித் திரியாதவன்.’
    reason: lexical_alternative
  - marker: b
    text: ‘அயலான்’ என்பதற்கான எபிரெயச் சொல் நண்பன் அல்லது தோழன் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், ‘தனக்கு அருகானவன்’; இது உறவினர், நெருங்கிய தொடர்புடையவர், அல்லது தன் சமூகத்தில் அருகிலிருப்பவர் ஆகியோரைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל עַל לְשֹׁנוֹ
  choice: தன் நாவினால் புறங்கூறாதவன்
  rationale: רָגַל என்பதன் அடிப்படைப் பொருள் சுற்றித் திரிதல் அல்லது உளவறிதல்; நாவுடன் வரும் இத்தொடரில், ஒருவருக்கு எதிராகப் பழிச்செய்தியைப் பரப்புவதைக் குறிக்கிறது. ‘புறங்கூறு’ என்பது பிறரைப் பற்றி அவர்களுக்குப் பின்னால் தீங்காகப் பேசும் கருத்தை இயல்பாக வெளிப்படுத்துகிறது; ‘நாவினால்’ என்ற சொல் மூலத்தின் உடல் உறுப்புச் சித்திரத்தையும் காக்கிறது.
- source_word: עָשָׂה ... רָעָה
  choice: தீமை செய்யாதவன்
  rationale: רָעָה என்பது தீமை, கேடு, அல்லது தீங்கு எனப் பரந்த பொருளுடையது. ‘தீமை செய்’ அதன் அறநெறி சார்ந்த பரப்பைச் சுருக்காமல் நேரடியாகக் காக்கிறது.
- source_word: לְרֵעֵהוּ
  choice: தன் அயலானுக்கு
  rationale: רֵעַ என்பது நண்பன், தோழன், அல்லது சமூகத்தில் அருகிலிருப்பவன் எனக் குறிக்கலாம். இங்கு ‘அயலான்’ பரந்த சமூக உறவை இயல்பாகக் குறிக்கிறது; நெருங்கிய நட்புக்கு மட்டும் பொருளை மட்டுப்படுத்தவில்லை.
- source_word: חֶרְפָּה
  choice: பழிச்சொல்
  rationale: חֶרְפָּה என்பது நிந்தை, இகழ்ச்சி, பழி, அவமானம் ஆகிய தொடர்புடைய கருத்துகளை உடையது. பேச்சு சார்ந்த இச்சூழலில் ‘பழிச்சொல்’ முதல் உறுப்பின் புறங்கூறுதலுடன் உள்ள இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: נָשָׂא ... עַל
  choice: '...மீது ... சுமத்துதல்'
  rationale: נָשָׂא என்பதன் ‘தூக்குதல்/சுமத்துதல்’ உருவகத்தை ‘சுமத்து’ காக்கிறது. தமிழில் ‘ஒருவர்மீது பழிச்சொல்லைச் சுமத்துதல்’ என்பது அவருக்கு எதிராகப் பழியை எடுத்துரைப்பது அல்லது ஏற்றுவது என்ற செயற்பாட்டுப் பொருளைத் தருகிறது; பழியைத் தானே பொறுத்துக்கொள்வது என்ற தவறான பொருளைத் தவிர்க்கிறது.
- source_word: קְרֹבוֹ
  choice: தனக்கு நெருக்கமானவன்
  rationale: קָרוֹב என்பது அருகிலிருப்பவர், உறவினர், அல்லது நெருங்கிய தொடர்புடையவர் என அமையலாம். ‘நெருக்கமானவன்’ இந்த உறவுநிலையின் நெகிழ்வை வைத்திருக்கிறது; இரத்த உறவாக மட்டும் வரையறுக்கவில்லை.
