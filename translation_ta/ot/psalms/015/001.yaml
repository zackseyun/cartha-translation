base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/001.yaml
  text: A psalm of David[a]. O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
translation:
  language: ta
  text: 'தாவீதின் சங்கீதம்.[a]


    யாவே, உமது கூடாரத்தில்[b] யார் விருந்தினனாகத் தங்கலாம்? உமது பரிசுத்த மலையில் யார் குடியிருக்கலாம்?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீதினால் இயற்றப்பட்டது’ அல்லது ‘தாவீதுக்காக’ என்றும் பொருள்கொள்ளலாம்; எபிரெயத் தலைப்பு ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பைக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது ‘திருக்கூடாரம்’; எபிரெயத்தில் நேரடியாக ‘கூடாரம்’ என்று உள்ளது; இது தேவனுடைய வாசஸ்தலமாகிய பரிசுத்த இடத்தை நினைவூட்டக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: பாடல் என்ற பொதுப் பொருள் இருந்தாலும், சங்கீதத் தலைப்பில் வரும் இந்த இசைப்பாடல் வகைக்கான இயல்பான, நிலைபெற்ற தமிழ் சொல்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும்; ‘தாவீதின்’ என்பது அவற்றில் ஒன்றை மட்டும் முடிவாக நிர்ணயிக்காமல் ஓரளவு தெளிவின்மையைப் பேணுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பொன்றால் மாற்றாமல், எபிரெய மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: יָגוּר
  choice: விருந்தினனாகத் தங்கக்கூடியவன்
  rationale: גור என்பது நிரந்தரமாகக் குடியேறுவதைவிட அந்நியனாக அல்லது விருந்தினனாகத் தங்கும் நுண்பொருளைக் கொண்டது; இணைவரியில் வரும் குடியிருத்தலிலிருந்து இதை வேறுபடுத்துகிறது.
- source_word: בְּאָהֳלֶךָ
  choice: உமது கூடாரத்தில்
  rationale: אֹהֶל என்பதன் நேரடியான concrete பொருள் ‘கூடாரம்’; இங்கு அது தேவனுடைய பரிசுத்த இடத்தையும் நினைவூட்டுகிறது.[b]
- source_word: יִשְׁכֹּן
  choice: குடியிருக்கக்கூடியவன்
  rationale: שׁכן என்பது தங்குதல் அல்லது குடியிருத்தலைக் குறிக்கிறது; முதல் வரியின் விருந்தினனாகத் தங்குதலுடன் உள்ள இணைமையையும் வேறுபாட்டையும் இயல்பாகப் பேணுகிறது.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: உமது பரிசுத்த மலையில்
  rationale: הַר என்பதற்கு இயல்பான பொருள் ‘மலை’; קָדְשֶׁךָ என்பதை இயல்பான தமிழில் பெயரடையாக ‘உமது பரிசுத்த’ என்று வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தேவனுடைய தனிப்பெயரை நேரடியாகக் கொண்டிருப்பதால், ஒரு பட்டத்தால் மாற்றாமல் பொதுவாக ஏற்கப்படும் ஒலிபெயர்ப்பை வழங்குகிறது.
- issue: לְדָוִד என்பதில் உள்ள தொடர்பின் தன்மை
  choice: தாவீதின்
  alternative: தாவீதினால் / தாவீதுக்காக
  rationale: எபிரெய முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பைக் குறிக்கலாம்; உரை தீர்மானிக்காததை மொழிபெயர்ப்பு தீர்மானிக்காமல் இருக்கிறது.
- issue: கூடாரம் மற்றும் பரிசுத்த மலை ஆகிய ஆலய உருவகங்கள்
  choice: நேரடியான இட உருவகங்களைப் பேணுதல்
  alternative: திருக்கூடாரம் / ஆலயம் என்று விளக்கி மொழிபெயர்த்தல்
  rationale: இந்தச் சொற்கள் தேவசந்நிதி மற்றும் சீயோனை நினைவூட்டினாலும், மூலத்தின் கவித்துவமான ‘கூடாரம்’, ‘மலை’ என்ற உருவகங்களைத் தெளிவுரையாக மாற்றவில்லை.
translation_notes:
  register: நவீனச் செந்தமிழ் சார்ந்த, மரியாதையும் கவித்துவமும் கொண்ட நடை. ‘உமது’ என்பது தேவனை நேரடியாக விளிக்கும் சங்கீத நடைக்கு ஏற்ற மரியாதை வடிவம். ‘விருந்தினனாகத் தங்குதல்’ மற்றும் ‘குடியிருத்தல்’ மூலம் இரு எபிரெய வினைகளின் நுண்வேறுபாடு பேணப்பட்டுள்ளது. அனைத்து அடிக்குறிப்பு குறிகளும் உரையில் இடம்பெறுகின்றன.
