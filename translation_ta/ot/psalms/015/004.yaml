- source_word: יָמִר
  choice: அதை மாற்றுவதில்லை
  rationale: மாற்றுதல் அல்லது பரிமாற்றுதல் என்ற ஹிஃபில் வினைப் பொருளைப் பேணி, மறைந்துள்ள செயப்படுபொருள் ஆணை என்பதைத் தமிழில் தெளிவாக்குகிறது.
