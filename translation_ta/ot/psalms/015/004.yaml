  rationale: மதிப்பீட்டைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான நவீன தமிழில் வழங்குகிறது.
- source_word: נִמְאָס
  choice: நிராகரிக்கப்படுகிறான்
  rationale: ஏற்றுக்கொள்ளப்படாதிருத்தல் அல்லது ஒதுக்கப்படுதல் என்ற பொருளைப் பேணுகிறது; முந்தைய ‘இகழப்பட்டவன்’ என்பதையே மீண்டும் கூறுவதைத் தவிர்க்கிறது.
- source_word: יִרְאֵי יְהוָה
  choice: யாவேவுக்கு அஞ்சுகிறவர்கள்
  rationale: பயபக்தியுடன் வாழ்பவர்களைக் குறிக்கும் உடன்படிக்கைச் சொற்றொடரில் உள்ள ‘அஞ்சுதல்’ என்ற வலிமையை மென்மைப்படுத்தாமல் பேணுகிறது.
- source_word: יְהוָה
