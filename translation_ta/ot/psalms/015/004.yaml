  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. முதல் எபிரெயத் தொடரின் சுருக்கமும் இரட்டைப் செயப்பாட்டு நயமும் இயன்றவரை பேணப்பட்டுள்ளன. ‘யாவே’ என்பது இறைத் திருப்பெயரின் தமிழ் ஒலிபெயர்ப்பு; ‘அஞ்சுகிறவர்கள்’ என்பது பயபக்தி மற்றும் கீழ்ப்படிதல் ஆகிய இரு நயங்களையும் திறந்தவையாக வைத்திருக்கிறது.
