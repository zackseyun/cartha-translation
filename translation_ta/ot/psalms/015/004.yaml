base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/004.yaml
  text: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
translation:
  language: ta
  text: அவன் பார்வையில் இகழப்பட்டவன் நிராகரிக்கப்படுகிறான்[a]; ஆனால் யாவேவுக்கு அஞ்சுகிறவர்களை அவன் மதிக்கிறான். தனக்கே தீங்கு நேர்ந்தாலும், அவன் செய்த சத்தியத்தை மாற்றுவதில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, “இழிவானவன் அவன் பார்வையில் இகழப்படுகிறான்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடர் மிகவும் சுருக்கமாக இருப்பதால், நெருங்கிய தொடர்புள்ள ஒன்றுக்கு மேற்பட்ட விதங்களில் இதைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: சொல்லர்த்தமாக, “தீங்குக்காகச் சத்தியம் செய்கிறான்; மாற்றுவதில்லை.” இது பொதுவாக, தான் செய்த சத்தியம் தனக்கே இழப்பாக முடிந்தாலும் அதை மாற்றாமல் காப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
