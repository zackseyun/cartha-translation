  choice: அவன் பார்வையில் இகழப்பட்டவன் நிராகரிக்கப்படுகிறான்
  alternative: இழிவானவன் அவன் பார்வையில் இகழப்படுகிறான்
  rationale: தேர்ந்த வடிவம் இரண்டு எபிரெயச் சொற்களின் செயப்பாட்டு நயத்தைப் பேணுகிறது; அந்த நபரின் ஒழுக்கநிலையை ‘இழிவானவன்’ என்று வெளிப்படையாகத் தீர்மானிப்பதைத் தவிர்க்கிறது. மரபான மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: לְהָרַע என்பதில் தீங்கு யாருக்கு என்பது
  choice: ஆணையிட்டவனுக்கே தீங்கு நேர்ந்தாலும் அவன் அதை மாற்றுவதில்லை
  alternative: தீங்கு செய்யும்படி ஆணையிட்டாலும் அவன் மாற்றுவதில்லை
  rationale: சங்கீதத்தின் நேர்மையான மனிதரை விவரிக்கும் சூழலில், தனக்கே இழப்பு ஏற்பட்டாலும் ஆணையை நிறைவேற்றுதல் என்பதே பொருத்தமான புரிதல்; இருப்பினும் எபிரெயில் ‘தனக்கே’ என்பது வெளிப்படையாக இல்லை என்பதால் அடிக்குறிப்பு இதைச் சுட்டுகிறது.
