  source_fidelity: மூல எபிரெயத்தின் மூன்று கட்டளை வேண்டுதல்களும்—קוּמָה, הִנָּשֵׂא, וְעוּרָה—மற்றும் இறுதியிலுள்ள நிறைவு வினைத் தொடரும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. “உமது கோபத்தில்,” “என் எதிரிகளின் சீற்றத்துக்கு எதிராக,” “எனக்காக,” “நீதித்தீர்ப்பைக் கட்டளையிட்டிருக்கிறீர்” என்பவை மூலத்தின் பொருள்வீச்சுக்கும் தொடரியலுக்கும் ஏற்றவை. இறுதித் தொடரை முந்தைய வேண்டுதலோடு இணைக்கும் சாத்தியமான மாற்று வாசிப்பு அடிக்குறிப்பில் முறையாகக் காக்கப்பட்டுள்ளது.
  naturalness: நவீன நிலையான தமிழில் கண்ணியமான கவிநடை இயல்பாக உள்ளது. “எழுந்தருளும்,” “உயர்ந்தெழும்,” “விழித்தெழும்” ஆகியவை இறைவனை நோக்கிய சங்கீத வேண்டுதலுக்கு ஏற்ற மரியாதைமிக்க வடிவங்கள்; மூலத்தின் இணைநிலைத் தீவிரத்தையும் தக்கவைக்கின்றன. நிறுத்தற்குறிகளும் வரிப்பிரிப்பும் வாசிப்பைத் தெளிவாக்குகின்றன.
