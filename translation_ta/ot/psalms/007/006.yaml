  variant: modern standard Tamil
source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה בְּ/אַפֶּ֗/ךָ הִ֭נָּשֵׂא בְּ/עַבְר֣וֹת צוֹרְרָ֑/י וְ/ע֥וּרָ/ה אֵ֝לַ֗/י מִשְׁפָּ֥ט צִוִּֽיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
translation:
  language: ta
  text: 'யாவே, உமது கோபத்தில் எழுந்தருளும்;

    என் எதிரிகளின் சீற்றத்துக்கு எதிராக உயர்ந்தெழும்[a];

    எனக்காக[b] விழித்தெழும்;

    நீர் நீதித்தீர்ப்பைக் கட்டளையிட்டிருக்கிறீர்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் எதிரிகளின் சீற்றத்துக்கு எதிராக உம்மை உயர்த்தும்.” இந்த எபிரெய வினை ‘மேன்மைப்படும்’ என்ற உணர்வையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என்னை நோக்கி”; இச்சூழலில் இது “என் சார்பாக” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, முந்தைய சொற்களுடன் இணைத்து, “நீர் கட்டளையிட்ட நீதித்தீர்ப்புக்காக எனக்காக விழித்தெழும்” என்று வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: எழுந்தருளும்
  rationale: קום என்ற வினையின் கட்டளை வடிவம் கடவுள் நடவடிக்கை எடுக்க எழுமாறு அழைக்கிறது. நவீனத் தமிழில் தெய்வத்தை நேரடியாக அழைக்கும் கண்ணியமான கவிநடையை இது தருகிறது; ‘நடவடிக்கை எடும்’ என்று உருவகத்தை விளக்கிப் பரவலாக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பில் தருகிறது.
- source_word: בְּאַפֶּךָ
  choice: உமது கோபத்தில்
  rationale: אַף என்பதன் அடிப்படைப் பொருள் ‘மூக்கு’ என்றாலும், இங்கு அது கோபத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர். தமிழில் பொருளைத் தெளிவாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: הִנָּשֵׂא
  choice: உயர்ந்தெழும்
  rationale: נשׂא என்பதன் நிஃபால் கட்டளை வடிவத்தின் ‘உயர்த்தப்படுதல்/உயர்தல்’ உணர்வையும், இணையான קום சொல்லின் செயல்முக இயக்கத்தையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: בְּעַבְרוֹת
  choice: சீற்றத்துக்கு எதிராக
  rationale: עֶבְרָה தீவிரமான, பொங்கியெழும் சினத்தைக் குறிக்கிறது. இச்சூழலில் בְּ எதிர்ப்புற உறவைக் குறிக்கக்கூடியதால், ‘எதிராக’ என்று இயல்பாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: צוֹרְרָי
  choice: என் எதிரிகளின்
  rationale: צרר வேரிலிருந்து வந்த பெயர்ச்சொல் பயன்பாடு சங்கீதக்காரனை எதிர்ப்பவர்களைக் குறிக்கிறது; ‘எதிரிகள்’ என்பது தெளிவான நவீனத் தமிழ்.
- source_word: וְעוּרָה
  choice: விழித்தெழும்
  rationale: עור என்ற கட்டளை வடிவத்தின் விழிப்பு உருவகத்தைத் தக்கவைத்து, முந்தைய எழுச்சி வேண்டுதல்களுடன் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: אֵלַי
  choice: எனக்காக
  rationale: சொல்லுக்கு ‘என்னிடம்/என்னை நோக்கி’ என்ற நேரடிப் பொருள் இருக்கலாம்; நீதிக்கான வேண்டுதலில் பயனாளரைக் குறிக்கும் ‘எனக்காக’ என்பது சூழலுக்கு இயல்பானது. நேரடிப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִשְׁפָּט
  choice: நீதித்தீர்ப்பு
  rationale: மִשְׁפָּט இங்கு நீதித்துறை சார்ந்த தீர்ப்பையோ நடவடிக்கையையோ குறிக்கிறது. ‘நீதி’ என்பதைவிட ‘நீதித்தீர்ப்பு’ சட்டமன்றச் சூழலைத் தெளிவாகக் காட்டுகிறது.
- source_word: צִוִּיתָ
  choice: கட்டளையிட்டிருக்கிறீர்
  rationale: צוה என்பதன் வழக்கமான ‘கட்டளையிடு’ பொருளை நேரடியாகத் தக்கவைக்கிறது; ‘நியமித்தீர்’ என்று பொருளைச் சற்றே விரிவாக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் பட்டமல்ல, இறைவனுடைய தனிப்பெயரே உள்ளது. ஆகவே பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: கடவுளை நோக்கிய மனிதப் பண்புருவக் கட்டளைகள்
  choice: ‘எழுந்தருளும்… உயர்ந்தெழும்… விழித்தெழும்’ என்ற உருவகங்களைத் தக்கவைத்தல்
  alternative: ‘தலையிடும்’ அல்லது ‘நடவடிக்கை எடும்’ என்று வெளிப்படையாக விளக்குதல்
  rationale: எபிரெயக் கவிதையின் தீவிரமான வேண்டுதலைத் தக்கவைக்கிறது; கடவுள் உண்மையில் செயலற்றவர் அல்லது உறங்குபவர் என்ற கோட்பாட்டுக் கருத்தை உரையில் சேர்ப்பதில்லை.
- issue: מִשְׁפָּט צִוִּיתָ என்பதன் தொடரியல் உறவு
  choice: ‘நீர் நீதித்தீர்ப்பைக் கட்டளையிட்டிருக்கிறீர்’ என்ற தனி வாக்கியம்
  alternative: ‘நீர் கட்டளையிட்ட நீதித்தீர்ப்புக்காக … விழித்தெழும்’ என்று முந்தைய வேண்டுதலுடன் இணைத்தல்
  rationale: மசோரா உரையின் சொல் வரிசையையும் இறுதி வினையின் நிறைவையும் காக்கும் வாசிப்பு இது; எனினும் தொடரை முந்தைய கட்டளையுடன் இணைப்பதும் இலக்கண ரீதியாகச் சாத்தியமாதலால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நேரடியாக அழைக்கும் இடங்களில் ‘உமது/நீர்’ மற்றும் மரியாதைக் கட்டளை வடிவங்கள் ஒருமையாகப் பேணப்பட்டுள்ளன. மூலத்தின் இணைநிலை அமைப்பும் மனிதப் பண்புருவ உருவகங்களும் பாதுகாக்கப்பட்டுள்ளன.
