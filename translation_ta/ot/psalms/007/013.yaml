  yaml_path: translation/ot/psalms/007/013.yaml
  text: And for him he has prepared weapons of death[a]; he makes his arrows fiery.
translation:
  language: ta
  text: அவனுக்காக அவர் கொல்லும் ஆயுதங்களை ஆயத்தம் செய்திருக்கிறார்; தம் அம்புகளைத் தீப்பற்றியவையாக ஆக்குகிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “துரத்துகிறவர்களுக்காகத் தம் அம்புகளைச் செய்கிறார்” அல்லது “துரத்துகிறவர்களுக்கு எதிராகத் தம் அம்புகளைச் செய்கிறார்.” இங்குள்ள எபிரெயச் சொல்லை ‘எரி’ என்னும் வினையிலிருந்தும் ‘துரத்து’ என்னும் வினையிலிருந்தும் புரிந்துகொள்ளலாம். முதன்மை உரை, போரில் பயன்படுத்தப்படும் தீப்பற்றிய அம்புகள் என்ற பொதுவான காட்சியைப் பின்பற்றுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: அவனுக்காக
  rationale: לְ முன்னொட்டும் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டும் சேர்ந்து ‘அவனுக்காக’ எனப் பொருள்படுகின்றன. முந்தைய வசனத்தின் தீயவனையே இது குறிக்கிறது; ஆயுதங்களை ஆயத்தப்படுத்துபவர் கடவுள் என்பதையும் சூழல் காட்டுகிறது.
- source_word: הֵכִין
  choice: ஆயத்தம் செய்திருக்கிறார்
  rationale: כון என்பதன் ஹிப்ஃபீல் வடிவம் ‘ஆயத்தப்படுத்து, தயார்செய்’ எனப் பொருள்படும். முடிக்கப்பட்ட செயல் தற்போது பொருத்தமுடையதாக இருப்பதை இந்தத் தமிழ் வினைவடிவு இயல்பாகத் தெரிவிக்கிறது.
- source_word: כְּלֵי מָוֶת
  choice: கொல்லும் ஆயுதங்கள்
  rationale: כְּלִי என்பது கருவி அல்லது ஆயுதத்தைக் குறிக்கலாம். தொடர்ந்து அம்புகள் குறிப்பிடப்படுவதால் ‘ஆயுதங்கள்’ பொருத்தமானது; ‘கொல்லும்’ என்பது ‘மரணத்தின்’ என்ற எபிரெய மரபுத்தொடரின் உயிர்க்கொல்லும் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: חִצָּיו
  choice: தம் அம்புகளை
  rationale: ‘அவருடைய அம்புகள்’ என்ற நேரடிப் பொருள். கடவுளைக் குறிக்கும் ஒருமை மரியாதை நடையில் ‘தம்’ இயல்பாக உள்ளது.
- source_word: לְדֹלְקִים
  choice: தீப்பற்றிய அம்புகளாக
  rationale: דלק என்பதற்கு ‘எரி’ என்றும் ‘துரத்து’ என்றும் பொருள் கொள்ள முடியும். அம்புகளுடன் வரும் போர்க்காட்சியில் எரியும் அம்புகள் என்ற வாசிப்பு இயல்பானதால் முதன்மை உரையில் அது தேர்ந்தெடுக்கப்பட்டுள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יִפְעָל
  choice: ஆக்குகிறார்
  rationale: פעל என்பதன் கால் வடிவம் ‘செய், உருவாக்கு’ எனப் பொருள்படும். அம்புகளைத் தீப்பற்றியவையாகச் செய்வதை ‘ஆக்குகிறார்’ தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ஆயுதங்களை ஆயத்தப்படுத்துபவர் யார்?
  choice: ‘அவர்’ என்பது முந்தைய சூழலின்படி கடவுளைக் குறிக்கிறது; ‘அவன்’ என்பது தீயவனைக் குறிக்கிறது.
  alternative: தீயவன் தனக்காகவே ஆயுதங்களை ஆயத்தப்படுத்துகிறான் என்று வாசித்தல்.
  rationale: எபிரெய வாக்கியத்தின் வெளிப்படையான எழுவாயும் முந்தைய வசனங்களின் தொடர்ச்சியும் கடவுளையே செய்பவராகவும், לֹו என்பதன் பின்னொட்டு தீயவனைப் பெறுபவராகவும் காட்டுகின்றன. இருப்பினும் வசனம் தனியாக நிற்கும்போது ஏற்படக்கூடிய சுட்டுப்பெயர் குழப்பத்தை மொழிபெயர்ப்பு தெளிவாக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதையும் கவித்துவச் செறிவும் காக்கப்பட்டுள்ளன. கடவுளைக் குறிக்கும் வினைகளில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ‘மரணத்தின் கருவிகள்’ என்ற சொற்சொல் வடிவத்திற்கு பதிலாக, அடுத்துவரும் அம்புக் காட்சியோடு இயல்பாக இணைய ‘கொல்லும் ஆயுதங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
