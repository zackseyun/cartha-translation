  text: הִנֵּ֥ה יְחַבֶּל אָ֑וֶן וְ/הָרָ֥ה עָ֝מָ֗ל וְ/יָ֣לַד שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/014.yaml
  text: 'Look: he labors with wickedness, conceives trouble, and gives birth to falsehood.[a]'
translation:
  language: ta
  text: இதோ, அவன் தீமையால் பிரசவ வேதனையில் துடிக்கிறான்; துன்பத்தைக் கருவுறுகிறான்; பொய்யைப் பெற்றெடுக்கிறான்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரை பிரசவ வேதனை, கருவுறுதல், பெற்றெடுத்தல் ஆகிய படிமங்களை ஒன்றன்மேல் ஒன்றாக அடுக்குகிறது. முதல் வினைச்சொல்லை ‘பிரசவ வேதனையில் துடிக்கிறான்’ அல்லது ‘பிரசவ வேதனை கொள்கிறான்’ என்றும் மொழிபெயர்க்கலாம்; ‘தீமை,’ ‘துன்பம்’ ஆகிய சொற்களின் பொருள்களும் ஓரளவு ஒன்றோடொன்று கலக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, தொடர்ந்து வரும் உயிரோட்டமான உருவகத்தை அறிமுகப்படுத்தும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: יְחַבֶּל
  choice: பிரசவ வேதனைப்படுகிறான்
  rationale: இந்த வினை பிரசவ வேதனையில் துடித்தல் அல்லது கடும் வேதனைப்படுதல் என்ற உருவகத்தைத் தருகிறது. அதை ‘கருவுறுகிறான்’ என்று மாற்றாமல், எபிரெயச் சொல்லின் தனித்துவமான வலியைப் பிரதான உரையில் காக்கிறது.
- source_word: אָוֶן
  choice: தீமை
  rationale: இச்சொல்லிலுள்ள ஒழுக்கக்கேடு மற்றும் தீங்கான செயல் ஆகிய பொருள் நிழல்களைத் தாங்குகிறது; அடுத்துவரும் עָמָל என்பதிலிருந்து ஓரளவு வேறுபடுத்துகிறது.
- source_word: הָרָה
  choice: கருவுறுகிறான்
  rationale: கருத்தரித்தல் அல்லது கர்ப்பமாதல் என்பதே இங்குள்ள நேரடிப் பொருள். எபிரெயக் கவிதையின் சுருக்கமான, உயிரியல் வரிசைக்கு உட்படாத படிமத்தை அப்படியே காக்கிறது.
- source_word: עָמָל
  choice: துன்பம்
  rationale: தீய செயலால் உருவாக்கப்படும் தொல்லை, துயரம், தீங்கு ஆகிய ஒன்றோடொன்று தொடர்புடைய பொருள்களை இயல்பான தமிழில் தருகிறது.
- source_word: יָלַד שָׁקֶר
  choice: பொய்யைப் பெற்றெடுக்கிறான்
  rationale: பிறப்பு உருவகத்தை நிறைவுசெய்து, שָׁקֶר என்பதன் பொய் அல்லது வஞ்சகம் சார்ந்த பொருளைத் தெளிவாகத் தெரிவிக்கிறது.
