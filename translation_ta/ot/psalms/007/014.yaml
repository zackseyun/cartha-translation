translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. மூன்று இனப்பெருக்கப் படிமங்களும் எபிரெயத்தில் உள்ள இயல்புக்கு மாறான வரிசையும் மென்மையாக்கப்படாமல் காக்கப்பட்டுள்ளன; அதனால் முதல் சொற்றொடரின் திட்டமிட்ட சுருக்கமும் சிறு இயல்பின்மையும் தொடர்கிறது.
