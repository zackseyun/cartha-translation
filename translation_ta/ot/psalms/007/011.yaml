source:
  edition: WLC
  text: אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק וְ֝/אֵ֗ל זֹעֵ֥ם בְּ/כָל יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/011.yaml
  text: God is a righteous judge[b][a], and a God who is indignant every day.
translation:
  language: ta
  text: கடவுள் நீதியுள்ள நீதிபதி[a]; நாள்தோறும் சினம் கொள்கிற இறைவனும் அவரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் நீதியோடு தீர்ப்பளிக்கிறார்; இறைவன் நாள்தோறும் சினம் கொள்கிறார்.”
    reason: 'இலக்கண மாற்றுவாசிப்பு: שׁוֹפֵט என்பதை ‘நீதிபதி’ என்ற பெயராக அல்லாமல் ‘தீர்ப்பளிக்கிறார்’ என்ற வினையாகவும் புரிந்துகொள்ளலாம்.'
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சங்கீதச் சூழலில் இலக்கண வடிவம் பன்மையாக இருந்தாலும், அது ஒரே கடவுளைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாக ‘கடவுள்’ என வழங்கப்பட்டது.
- source_word: שׁוֹפֵט צַדִּיק
  choice: நீதியுள்ள நீதிபதி
  rationale: שׁוֹפֵט என்னும் பங்கேற்புவினை இங்கு பெயர்ப்பயனிலையில் ‘நீதிபதி’ என்றும், צַדִּיק ‘நீதியுள்ள’ என்றும் புரிந்துகொள்ளப்பட்டது. வினைமுறை வாசிப்பும் சாத்தியமாதலால் அது அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וְאֵל
  choice: இறைவனும் அவரே
  rationale: אֵל இங்கு முந்தைய אֱלֹהִים குறிப்பிடும் அதே கடவுளையே தொடர்கிறது. எபிரெய இணைப்பை ‘-உம்’ தக்கவைக்கிறது; ‘அவரே’ என்பது தமிழில் இரு கூறுகளையும் இயல்பாக இணைக்கிறது.
- source_word: זֹעֵם
  choice: சினம் கொள்கிற
  rationale: இச்சொல் கடவுளின் தொடர்ந்த தார்மிகக் கோபத்தை வெளிப்படுத்துகிறது. ‘சினம் கொள்கிற’ என்பது கருத்தை மென்மைப்படுத்தாமல், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் தருகிறது.
- source_word: בְּכָל־יוֹם
  choice: நாள்தோறும்
  rationale: இத்தொடர் ஒரே நாள் முழுவதையும் விட, ஒவ்வொரு நாளும் நிகழ்வதை அல்லது தொடர்ச்சியான ஒழுங்கை இயல்பாகக் குறிக்கிறது.
theological_decisions:
- issue: கடவுளின் சினத்தைக் குறிக்கும் மொழி
  choice: நாள்தோறும் சினம் கொள்கிற
  alternative: நாள்தோறும் கடுங்கோபம் கொள்கிற
  rationale: மூலவசனம் கடவுளுக்குத் தொடர்ந்த சினத்தை வெளிப்படையாகக் கூறுகிறது. அதை மென்மைப்படுத்தாமல் தக்கவைத்தாலும், மூலத்தில் இல்லாத தீவிரத்தைச் சேர்க்கக்கூடிய ‘கடுங்கோபம்’ தவிர்க்கப்பட்டது.
- issue: שׁוֹפֵט צַדִּיק என்பதன் இலக்கணப் பொருள்
  choice: நீதியுள்ள நீதிபதி
  alternative: நீதியோடு தீர்ப்பளிக்கிறார்
  rationale: மெய்யெழுத்து மற்றும் மசோரா உச்சரிப்பின் அடிப்படையில் பண்புப்பெயர்–பெயர் வாசிப்பு வலுவானது. ஆயினும் பங்கேற்புவினையை வினையாகப் புரிந்துகொள்ளும் சாத்தியத்தை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்துக்குரிய கண்ணியத்தையும் சுருக்கத்தையும் காக்கும் நடை. ‘நாள்தோறும்’, ‘சினம் கொள்கிற’ ஆகியவை பொதுவாசகருக்கு இயல்பானவை; ‘இறைவனும் அவரே’ என்பது எபிரெய இணைப்பையும் இணை அமைப்பையும் தமிழில் தடையின்றி வெளிப்படுத்துகிறது.
