- from: தாவீதின் சிக்காயோன்[a]; பென்யமீன் குலத்தைச் சேர்ந்த கூஷின் வார்த்தைகளைக் குறித்து அவர் யாவேக்குப் பாடியது.
  to: பென்யமீன் குலத்தைச் சேர்ந்த கூஷின் வார்த்தைகளைக் குறித்து அவர் யாவேவுக்குப் பாடிய தாவீதின் ஷிக்காயோன்[a].
  rationale: The revision preserves every lexical component and avoids assigning a disputed meaning to שִׁגָּיוֹן. It uses a natural Tamil relative-participial construction for ‘which he sang’ and a standard euphonic dative form with யாவே. No theological or interpretive expansion has been introduced.
