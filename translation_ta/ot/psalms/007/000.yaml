base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/000.yaml
  text: A Shiggaion of David[a], which he sang to Yahweh concerning the words of Cush, a Benjaminite.
translation:
  language: ta
  text: பென்யமீன் குலத்தைச் சேர்ந்த கூஷின் வார்த்தைகளைக் குறித்து அவர் யாவேவுக்குப் பாடிய தாவீதின் ஷிக்காயோன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது ஓர் இசை அல்லது கவிதைக் கலைச்சொல்லாக இருக்கலாம்; ‘புலம்பல்’ அல்லது ‘கட்டற்ற உணர்ச்சிப் பாடல்’ போன்ற பொருள்களும் முன்வைக்கப்படுகின்றன. அரிதாக வரும் இந்த எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁגָּיוֹן
  choice: சிக்காயோன்
  rationale: இது அரிதாக வரும், பொருள் உறுதியாகத் தெரியாத இசை அல்லது கவிதைக் கலைச்சொல். ஒரு குறிப்பிட்ட பொருளைத் திணிக்காமல் அதன் தலைப்புத் தன்மையைப் பாதுகாக்க ஒலிபெயர்க்கப்பட்டுள்ளது; சாத்தியமான பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: சங்கீதத் தலைப்புகளில் ל என்பது ஆசிரியத்துவம், தொடர்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதின்’ என்பது அந்த உறவைச் சுருக்கமாகக் காட்டி, அதன் துல்லியமான நுட்பத்தைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: אֲשֶׁר שָׁר
  choice: அவர் ... பாடியது
  rationale: உறவுப்பெயரெச்சத் தொடரையும் שׁיר வினையின் இறந்தகாலச் செயலையும் இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை பொதுப்பட்டமாக மாற்றாமல், தமிழில் அறியப்பட்ட ‘யாவே’ என்ற வடிவில் வழங்குகிறது.
- source_word: עַל
  choice: குறித்து
  rationale: இங்கு தலைப்பு அல்லது நிகழ்வுக்கான பின்னணியைக் குறிக்கலாம். காரணத் தொடர்பைத் தேவையின்றி உறுதிப்படுத்தாமல், பொதுவான பொருளைத் தக்கவைக்கிறது.
- source_word: דִּבְרֵי
  choice: வார்த்தைகள்
  rationale: דָּבָר என்பதன் பன்மை இணைநிலை வடிவை வெளிப்படையாக மொழிபெயர்க்கிறது. ‘குற்றச்சாட்டுகள்’ அல்லது ‘விவகாரம்’ போன்ற சூழல் சார்ந்த விளக்கங்களை உரைக்குள் சேர்க்கவில்லை.
- source_word: כּוּשׁ
  choice: கூஷ்
  rationale: இது ஒருவரின் பெயராக இருப்பதால் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בֶּן יְמִינִי
  choice: பென்யமீன் குலத்தைச் சேர்ந்த
  rationale: இது பென்யமீன் கோத்திரத்தைச் சேர்ந்த ஒருவரைக் குறிக்கும் இனக்குழு அடையாளம். சொற்குச் சொல் வடிவத்தைவிட இதன் பொருளைத் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை יהוה என்ற தனிப்பட்ட உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதனை ஒரு பொதுப்பட்டமாக மாற்றாமல் பெயராகவே வழங்குவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத் தலைப்புக்கேற்ற சுருக்கமானதும் கண்ணியமானதுமான நடை பயன்படுத்தப்பட்டுள்ளது. அரிதான கலைச்சொல் ஒலிபெயர்க்கப்பட்டு அதன் நிச்சயமற்ற பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; ‘தாவீதின்’ என்பது ஆசிரியத்துவம் அல்லது தொடர்பு என்ற இரு சாத்தியங்களையும் திறந்தே வைக்கிறது.
