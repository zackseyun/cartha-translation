lexical_decisions:
- source_word: בּוֹר
  choice: குழி
  rationale: בּוֹר என்பது குழி அல்லது நீர்த்தொட்டியைக் குறிக்கலாம்; இங்கு பொறியாகத் தோண்டப்படும் இடம் என்பதால் பொதுவான ‘குழி’ இயல்பானது.
- source_word: כָּרָה
  choice: தோண்டி
  rationale: כָּרָה என்பதன் நேரடியான பொருளான தோண்டுதலை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: וַיַּחְפְּרֵהוּ
  choice: அதை ஆழமாக்கினான்
  rationale: חפר இங்கு முந்தைய தோண்டுதலைத் தொடர்ந்து மேலும் அகழ்வதைக் குறிக்கிறது; ‘ஆழமாக்கினான்’ செயல் முன்னேற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וַיִּפֹּל
  choice: அவன் விழுந்தான்
  rationale: நிகழ்வுகளின் எளிய தொடரையும் எபிரெயக் கவிதையின் சுருக்கத்தையும் காக்கிறது.
- source_word: שַׁחַת
  choice: பள்ளம்
  rationale: தோண்டப்பட்ட பொறி போன்ற குழிவை இங்கு concrete ஆகக் குறிக்கிறது; בּוֹר-க்கு ‘குழி’ பயன்படுத்தப்பட்டதால் தேவையற்ற சொல் மறுபடியையும் தவிர்க்கிறது.
- source_word: יִפְעָל
  choice: தான் உருவாக்கிய
  rationale: פעל என்பது செய்தல் அல்லது உருவாக்குதல் என்ற பரந்த பொருளுடையது; இங்கு தோண்டுதலால் அவன் ஏற்படுத்திய பள்ளத்தைக் குறிக்கிறது. ‘தான்’ என்பதன் மூலம் செயலும் அதன் விளைவும் அதே நபருக்குரியது என்பது இயல்பாகத் தெளிவாகிறது.
