  yaml_path: translation/ot/psalms/007/016.yaml
  text: His trouble returns on his own head[b][a], and his violence descends on his own skull.
translation:
  language: ta
  text: 'அவனுடைய தீங்கு[a] அவனுடைய தலைமேல் திரும்பும்;

    அவனுடைய வன்முறை அவனுடைய உச்சந்தலையின்மேல்[b] இறங்கும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தீங்கு” என்பதற்கு “தொல்லை” அல்லது “தீச்செயல்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் עָמָל சூழலுக்கேற்ப துன்பம், தொல்லை அல்லது தீய செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “உச்சந்தலை” என்பதற்கு “தலையின் உச்சி” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் קָדְקֹד தலையின் மேற்பகுதியைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: திரும்பும்
  rationale: שוב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதையும், தீயவனின் செயல் அவனிடமே திரும்பிவரும் கவித்துவ நீதியையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲמָלוֹ
  choice: அவன் செய்த தீங்கு
  rationale: עָמָל இச்சூழலில் நடுநிலையான உழைப்பைக் குறிக்காமல், ஒருவன் விளைவித்த தொல்லை, தீமை அல்லது கேட்டைச் சுட்டுகிறது. ‘செய்த தீங்கு’ என்பது செய்பவனுக்கும் அவன் மீது திரும்பும் விளைவுக்கும் உள்ள தொடர்பைத் தெளிவாக்குகிறது; சொல்லின் பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: בְרֹאשׁוֹ
  choice: அவனுடைய தலையின்மேலேயே
  rationale: בְּ இங்கு திரும்பிவரும் தீங்கு அவன் தலைமேல் விழும் படிமத்தைத் தருகிறது. ‘-ஏ’ அவனுக்கே அது திரும்புகிறது என்ற சூழல்சார் வலியுறுத்தலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעַל
  choice: அவனுடைய ... மேலேயே
  rationale: இணையான இரண்டாம் அடியை முதல் அடியுடன் இணைத்து, ‘மேல்’ என்ற இடப்பொருளையும் தமிழ்க் கவிதை நடையில் தக்கவைக்கிறது.
- source_word: קָדְקֳדוֹ
  choice: அவனுடைய உச்சந்தலை
  rationale: קָדְקֹד என்பது தலையின் உச்சி அல்லது உச்சந்தலையைக் குறிக்கிறது. ‘உச்சந்தலை’ என்பது நவீன தமிழில் இயல்பாகவும், முதல் அடியிலுள்ள ‘தலை’ என்பதைக் காட்டிலும் குறிப்பாகவும் உள்ளது.
- source_word: חֲמָסוֹ
  choice: அவனுடைய வன்முறை
  rationale: חָמָס வன்முறை, கொடுமை, வன்முறையான அநீதி ஆகியவற்றைக் குறிக்கும். ‘வன்முறை’ நேரடியான பொருளைத் தக்கவைக்கிறது.
- source_word: יֵרֵד
  choice: இறங்கும்
  rationale: ירד என்பதன் ‘கீழே இறங்குதல்’ என்ற செங்குத்துப் படிமத்தைப் பாதுகாத்து, வன்முறை அவன் உச்சந்தலைமேல் வந்து சேர்வதைக் கவித்துவமாகச் சொல்கிறது.
theological_decisions:
- issue: கவித்துவ நீதியில் தீய செயல் செய்தவனிடமே திரும்புதல்
  choice: தீயவன் செய்த தீங்கும் வன்முறையும் அவன் மீதே திரும்புகின்றன என்ற படிமம் பாதுகாக்கப்பட்டது.
  alternative: பொதுவாக ஒருவனுடைய துன்பம் அவன் மீது திரும்புகிறது என்று அறநெறிசார் காரணத் தொடர்பை மங்கலாக மொழிபெயர்க்கலாம்.
  rationale: ‘அவனுடைய’ என மீள வரும் உடைமை வடிவங்களும், ‘திரும்பும்/இறங்கும்’ என்ற இணை வினைகளும், அவன் விளைவித்த தீமை அவனையே வந்தடையும் கவித்துவ நீதியைச் சுட்டுகின்றன. இதற்கு அப்பாற்பட்ட கோட்பாட்டுக் கூற்று எதுவும் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான இருவரி இணைநடை பயன்படுத்தப்பட்டுள்ளது. ‘தலையின்மேலேயே / உச்சந்தலையின்மேலேயே’ மற்றும் ‘திரும்பும் / இறங்கும்’ என்ற இணைகள் மூலத்தின் ஒத்திசைவையும் வலியுறுத்தலையும் தக்கவைக்கின்றன.
