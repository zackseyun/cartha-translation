  edition: WLC
  text: וַ/עֲדַ֣ת לְ֭אֻמִּים תְּסוֹבְבֶ֑/ךָּ וְ֝/עָלֶ֗י/הָ לַ/מָּר֥וֹם שֽׁוּבָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/007.yaml
  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
translation:
  language: ta
  text: மக்களினங்களின்[a] கூட்டம் உம்மைச் சூழ்ந்துகொள்ளட்டும்; அதன் மேல், உயர்ந்த இடத்திற்குத் திரும்புவீராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மக்களினங்கள்’ என்பதற்கு ‘நாடுகள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת
  choice: கூட்டம்
  rationale: கூடியிருக்கும் ஒரு குழுவைக் குறிக்கிறது. திருச்சபை சார்ந்த தனிப்பொருளைத் தவிர்த்து, இச்சூழலில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְאֻמִּים
  choice: மக்களினங்கள்
  rationale: பல இன அல்லது மக்கள் குழுக்களைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது; ‘நாடுகள்’ என்பதும் சாத்தியம்.
- source_word: תְּסוֹבְבֶךָּ
  choice: உம்மைச் சூழ்ந்துகொள்ளட்டும்
  rationale: סבב என்பதன் ‘சூழ்தல்’ என்ற பொருளையும், இங்கு உள்ள வேண்டுதல் அல்லது விருப்பநிலை நயத்தையும் வெளிப்படுத்துகிறது.
- source_word: וְעָלֶיהָ
  choice: அதற்கு மேலாக
  rationale: பெண்பால் ஒருமை பின்னொட்டு முன்வரும் கூட்டத்தை ஒருமையான முழுத்தொகுதியாகச் சுட்டுவதைக் காக்கிறது. கூட்டத்தில் உள்ள மக்களை முன்னிறுத்தி பன்மையாகவும் புரிந்துகொள்ளலாம்.
- source_word: לַמָּרוֹם
  choice: உயரிடத்திற்கு
  rationale: மָרוֹם குறிக்கும் உயர்ந்த இடம் அல்லது மேன்மையான நிலையைப் பாதுகாக்கிறது; ‘வானத்திற்கு’ அல்லது ‘அரியணைக்கு’ என்று மிகையாக விளக்கவில்லை.
- source_word: שׁוּבָה
  choice: திரும்புவீராக
  rationale: שוב என்பதன் கட்டளை வடிவை மதிப்புமிக்க வேண்டுதல் நடையில் நேரடியாக வழங்குகிறது; ‘மீண்டும் அரியணையில் அமர்வீராக’ போன்ற விளக்கச் சேர்க்கையைத் தவிர்க்கிறது.
theological_decisions:
- issue: இவ்வசனம் உயர்ந்த இடத்திலிருந்து நிகழும் இறைநீதித் தீர்ப்பைச் சித்தரிக்கிறதா அல்லது மேல்நோக்கிய நேரடியான நகர்வைக் குறிக்கிறதா
  choice: கூடிய மக்களினங்களுக்கு மேலாக உயர்ந்த நிலைக்குத் திரும்பும்படி இறைவனிடம் செய்யப்படும் கவித்துவ வேண்டுதலாக மொழிபெயர்க்கப்பட்டது.
  alternative: கூட்டத்திற்கு மேலாக இறைவன் வானத்திற்கு உடல்ரீதியாக ஏறும்படி செய்யப்படும் வேண்டுதல்; அல்லது எதிர்கால நிகழ்வைக் கூறும் வாக்கியம்.
  rationale: שׁוּבָה என்பது கட்டளை வடிவில் இருப்பதால் வேண்டுதல் வாசிப்பு வலுவானது. ‘உயரிடம்’ என்ற சொல் ஆட்சி அல்லது நீதித்தீர்ப்பின் மேன்மை என்ற உருவகத்திற்கும் இடமளிக்கிறது; அதேவேளையில் அதைப் பிரத்யேகமாக நிர்ணயிப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், இறைவனை நோக்கிய மதிப்புமிக்க ‘உம்மை/திரும்புவீராக’ நடையைப் பயன்படுத்துகிறது. கவிதைச் சுருக்கத்தையும் மூலத்தின் இடவியல் மற்றும் மேன்மை சார்ந்த இரட்டைப் பொருள் வாய்ப்பையும் பாதுகாக்கிறது.
