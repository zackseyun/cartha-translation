  yaml_path: translation/ot/psalms/007/001.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
translation:
  language: ta
  text: யாவே, என் தேவனே, உம்மிடம் அடைக்கலம் புகுந்திருக்கிறேன்[a]. என்னைத் துரத்துகிற அனைவரிடமிருந்தும் என்னைக் காப்பாற்றும்; என்னை விடுவியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மிடம் அடைக்கலம் புகுகிறேன்.” ஜெபச் சூழலில் எபிரேய வினைமுற்று வடிவத்தை நிகழ்காலமாகவும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான YHWH-ஐ பட்டப்பெயராக மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהַי
  choice: என் தேவனே
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியையும் நேரடி அழைப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּךָ
  choice: உம்மிடம்
  rationale: அடைக்கலம் புகுதல் என்பதுடன் இயல்பாக இணையும் தமிழ் இடச்சொல்; மூலத்தில் இல்லாத ‘உம்மிடம் மட்டுமே’ என்ற பொருளைச் சேர்க்கவில்லை.
- source_word: חָסִיתִי
  choice: அடைக்கலம் புகுந்திருக்கிறேன்
  rationale: Qal perfect வடிவத்தின் நிகழ்காலத் தொடர்புள்ள நிறைவு நிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது; ஜெபச் சூழலில் நிகழ்கால வாசிப்பும் சாத்தியம்.
- source_word: הוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றி
  rationale: ישׁע என்பதன் Hiphil கட்டளையைப் பொதுவான ஜெப மொழியில் தருகிறது; அடுத்த வினையிலிருந்து ஓரளவு வேறுபாட்டையும் காக்கிறது.
- source_word: מִכָּל רֹדְפַי
  choice: என்னைத் துரத்துகிற அனைவரிடமிருந்தும்
  rationale: தொடர்ந்து நடக்கும் துரத்துதலைப் பங்கேற்பு வடிவத்திற்கேற்ப வினைத் தொடராகக் காட்டுகிறது; ‘துன்புறுத்துவோர்’ என்று நோக்கத்தை மிகைப்படுத்தவில்லை.
- source_word: וְהַצִּילֵנִי
  choice: என்னை விடுவியும்
  rationale: נצל என்பதன் Hiphil கட்டளையிலுள்ள ஆபத்திலிருந்து பிரித்தெடுத்து விடுவிக்கும் பொருளைத் தருகிறது; ‘காப்பாற்று’ என்ற முந்தைய வினையுடன் முழுமையாக ஒன்றாக்கவில்லை.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூல வசனம் நான்கெழுத்துத் திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கைப் பெயரின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: חָסִיתִי என்ற perfect வடிவத்தின் காலநிலை
  choice: அடைக்கலம் புகுந்திருக்கிறேன்
  alternative: அடைக்கலம் புகுகிறேன்
  rationale: முடிந்த செயலும் அதன் தற்போதைய விளைவும் இணைந்திருப்பதை முதன்மை உரை காட்டுகிறது; எனினும் ஜெபச் சூழல் நிகழ்காலப் பொருளையும் அனுமதிப்பதால் அதை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘உம்மிடம்’ மற்றும் ‘விடுவியும்’ என்பவை இறைவனை நோக்கிய மரியாதையைத் தருகின்றன; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன. அடிக்குறிப்பு குறி அது விளக்கும் חָסִיתִי என்ற சொல்லுக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
