  yaml_path: translation/ot/psalms/007/010.yaml
  text: My shield is with God[b][a], who saves the upright in heart.
translation:
  language: ta
  text: என் கேடயம் கடவுளைச் சார்ந்ததே[a]; அவர் நேர்மையான உள்ளத்தாரைக் காப்பாற்றுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளே என் கேடயம்.” எபிரெயச் சொற்றொடர் சுருக்கமானது; இவ்வாறும் பொருள் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנִּי
  choice: என் கேடயம்
  rationale: ‘கேடயம்’ என்ற நேரடியான உருவகத்தைத் தக்கவைத்து, ‘பாதுகாப்பு’ போன்ற கருத்தாக்கச் சொல்லாக மாற்றாமல் வழங்குகிறது.
- source_word: עַל
  choice: கடவுளிடமே உள்ளது
  rationale: இங்கு עַל என்பது கடவுளைச் சார்ந்திருப்பதையோ பாதுகாப்பு அவரிடத்தில் இருப்பதையோ குறிக்கிறது. தமிழில் இயல்பாகவும், எபிரெயச் சொற்றொடரின் சுருக்கத்தையும் ஓரளவு காக்கும் வகையிலும் இவ்வாறு வழங்கப்பட்டுள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இச்சூழலில் இஸ்ரவேலின் ஒரே கடவுளையே குறிக்கிறது.
- source_word: מוֹשִׁיעַ
  choice: காப்பாற்றுகிறவர்
  rationale: வினையெச்ச வடிவம் கடவுளின் வழக்கமான, பண்புரீதியான செயலைக் காட்டுவதால் நிகழ்காலப் பண்புப்பெயர் வடிவில் வழங்கப்பட்டுள்ளது.
- source_word: יִשְׁרֵי
  choice: நேர்மையானவர்கள்
  rationale: ישר என்பதன் ஒழுக்கநெறிசார் ‘நேரானவர், நேர்மையானவர்’ என்ற பொருளைத் தருகிறது; வேறு சொற்பொருள் வட்டத்தைச் சேர்ந்த ‘நீதிமான்கள்’ என்பதைத் தவிர்க்கிறது.
- source_word: לֵב
  choice: உள்ளத்தார்
  rationale: ‘இதயம்’ என்பது உள்ளான மனிதரைச் சுட்டும் எபிரெய மரபுச்சொல்; ‘நேர்மையான உள்ளத்தார்’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் அதைப் பிரதிபலிக்கிறது.
theological_decisions:
- issue: முதல் அரையடியின் தொடரியல் உறவு
  choice: ‘என் கேடயம் கடவுளிடமே உள்ளது’ என்று மொழிபெயர்த்து, சங்கீதக்காரரின் பாதுகாப்பு கடவுளிடத்தில் இருப்பதை வெளிப்படுத்துதல்
  alternative: ‘கடவுளே என் கேடயம்’
  rationale: எபிரெயத்தில் வெளிப்படையான வினைச்சொல் இல்லாததால் இரு அமைப்புகளுக்கும் இடமுண்டு. முதன்மை உரை மூலத்தின் சொல் அமைப்புக்கு அணுக்கமாக உள்ளது; அதிகம் விளக்கமளிக்கும் இயல்பான மாற்று அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், ஆனால் சங்கீதத்துக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘கேடயம்’ என்ற கவித்துவ உருவகம் பாதுகாக்கப்பட்டுள்ளது; முதல் அரையடியின் எபிரெயத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகச் சுட்டப்பட்டுள்ளது.
