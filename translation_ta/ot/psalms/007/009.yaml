source:
  edition: WLC
  text: יִגְמָר נָ֬א רַ֨ע רְשָׁעִים֮ וּ/תְכוֹנֵ֪ן צַ֫דִּ֥יק וּ/בֹחֵ֣ן לִ֭בּ֗וֹת וּ/כְלָי֗וֹת אֱלֹהִ֥ים צַדִּֽיק־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/009.yaml
  text: Please let the evil of the wicked come to an end, but establish the righteous—O righteous God who examines hearts and kidneys.
translation:
  language: ta
  text: 'தீயவர்களின் தீமை தயவுசெய்து முடிவுக்கு வரட்டும்;


    நீதிமானை நிலைநிறுத்துவீராக,


    இதயங்களையும் சிறுநீரகங்களையும் ஆராய்கிற


    நீதியுள்ள கடவுளே.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “இதயங்களும் சிறுநீரகங்களும்” என்பது ஒருவரின் சிந்தனைகள், நோக்கங்கள், உணர்வுகள் உள்ளிட்ட ஆழ்ந்த உள்ளத்தைச் சுட்டும் எபிரேய உருவகம்.
    reason: நவீன தமிழ் வாசகருக்கு ‘சிறுநீரகங்கள்’ என்ற நேரடி மொழிபெயர்ப்பின் உருவகப் பொருள் உடனடியாகத் தெளிவாக இருக்காது.
lexical_decisions:
- source_word: יִגְמָר נָא
  choice: முடிவுக்கு வரட்டும்
  rationale: வினையின் ‘முற்றுப்பெறு/ஒழிந்துபோ’ என்ற பொருளையும் נָא வெளிப்படுத்தும் வேண்டுகோள் நயத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: רַע רְשָׁעִים
  choice: தீயவர்களின் தீமை
  rationale: ‘தீமை’ மற்றும் ‘தீயவர்கள்’ என்ற எபிரேயச் சொல் தொடர்பைத் தமிழிலும் இயன்றவரைத் தக்கவைக்கிறது.
- source_word: וּתְכוֹנֵן צַדִּיק
  choice: நீதிமானை நிலைநிறுத்தும்
  rationale: כונן என்பதன் உறுதிப்படுத்து, நிலைப்படுத்து என்ற கருத்தைத் தருகிறது; צַדִּיק இங்கு ஒருமை பொதுப்பெயராக உள்ளது.
- source_word: לִבּוֹת וּכְלָיוֹת
  choice: இதயங்களையும் சிறுநீரகங்களையும்
  rationale: உள்ளார்ந்த சிந்தனை, உணர்வு ஆகியவற்றைக் குறிக்கும் எபிரேய உடலுறுப்பு உருவகங்களை விளக்கமாக மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים צַדִּיק
  choice: நீதியுள்ள கடவுள்
  rationale: ‘நீதியுள்ள கடவுள்’ என்ற விளிப்பாகவோ முன் வரியின் எழுவாயாகவோ அமையக்கூடிய மூலத்தின் சுருக்கத்தையும் பதற்றத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: אֱלֹהִים צַדִּיק என்பதன் தொடரியல் தொடர்பு
  choice: தனி இறுதி வரியாக ‘நீதியுள்ள கடவுள்’
  alternative: ‘நீதியுள்ள கடவுளே’ அல்லது ‘நீதியுள்ள கடவுள் ... நிலைநிறுத்துகிறார்’
  rationale: எபிரேயத்தில் விளி வேற்றுமைக்கு தனி வடிவம் இல்லாததால், வேண்டுதலின் விளியாகவும் கடவுளைப் பற்றிய கூற்றாகவும் வாசிக்க முடியும். ‘கடவுளே’ என்று சேர்த்து ambiguity-ஐத் தீர்க்காமல் மூலத்தின் திறந்த அமைப்பைப் பாதுகாக்கிறது.
- issue: כְלָיוֹת என்ற உள்ளுறுப்பு உருவகம்
  choice: சிறுநீரகங்கள்
  alternative: மனங்கள் / உள்ளத்தின் ஆழங்கள்
  rationale: மூலத்தின் மனிதவியல் உருவகத்தையும் ‘இதயங்கள்—சிறுநீரகங்கள்’ என்ற இணைப்பையும் மறைக்காமல் பாதுகாக்கிறது; பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்குரிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீதிமான்’, ‘நிலைநிறுத்தும்’ போன்ற பரவலாகப் புரியும் வேதாகமச் சொற்கள் தக்கவைக்கப்பட்டுள்ளன; அரிதான உருவகம் மட்டும் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
