  text: יְהוָ֣ה אֱ֭לֹהַ/י אִם עָשִׂ֣יתִי זֹ֑את אִֽם יֶשׁ עָ֥וֶל בְּ/כַפָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/003.yaml
  text: O Yahweh my God[a], if I have done this, if there is injustice in my hands—
translation:
  language: ta
  text: யாவே, என் கடவுளே, நான் இதைச் செய்திருந்தால், என் கைகளில் அநீதி இருந்தால்[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கைகளில் தவறு இருந்தால்”; இந்த எபிரெயச் சொற்றொடர் ஒழுக்கக் குற்றத்தையோ குற்றப்பொறுப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலின் கடவுளுடைய உடன்படிக்கைப் பெயரைப் பொதுவாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பில் நேரடியாக வழங்குகிறது.
- source_word: אֱלֹהַי
  choice: என் கடவுளே
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியையும் நேரடி அழைப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אִם
  choice: —ஆல்
  rationale: தொடர்ந்து வரும் நிபந்தனை சார்ந்த தற்கண்டனைச் சொல்லமைப்பைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: עָשִׂיתִי זֹאת
  choice: நான் இதைச் செய்திருந்தால்
  rationale: ‘இதை நான் செய்தேன்’ என்ற நிறைவுற்ற செயலையும் தற்போதைய குற்றச்சாட்டுடன் அதன் தொடர்பையும் காக்கிறது.
- source_word: יֶשׁ
  choice: இருந்தால்
  rationale: இருப்பைக் குறிக்கும் எபிரெயச் சொல்லை நிபந்தனை வாக்கியத்தோடு இயல்பாக இணைக்கிறது.
- source_word: עָוֶל
  choice: அநீதி
  rationale: நீதித்துறைச் சூழலையும் ஒழுக்கக்கேடு அல்லது தவறு என்ற பொருள் எல்லையையும் சுருக்கமாகக் காக்கிறது.
- source_word: בְּכַפָּי
  choice: என் கைகளில்
  rationale: சொற்பொருளான கை என்ற உருவகத்தைத் தக்கவைத்து, ஒருவருடைய செயலில் உள்ள குற்றப்பொறுப்பையும் உணர்த்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, அதன் தனித்துவத்தைப் பாதுகாக்கிறது.
- issue: கைகளில் அநீதி இருப்பது என்ற உருவகம்
  choice: உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: நான் குற்றம் செய்திருந்தால்
  rationale: குற்றச்செயல் அல்லது குற்றப்பொறுப்பைக் குறிக்கும் எபிரெய உருவகத்தின் உண்மையான விரிவையும் கவிதைத் தன்மையையும் முன்கூட்டியே விளக்கித் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்தின் நேரடி வேண்டுதல் மற்றும் நீதித்துறைத் தொனியைத் தக்கவைக்கும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. தொடரும் தற்கண்டனை நிபந்தனை இன்னும் நிறைவடையவில்லை என்பதை இறுதி நீள்கோடு காட்டுகிறது.
