  terminology: “யாவே” மூல இறைப்பெயரை ஒலிபெயர்ப்பாகத் தக்கவைக்கிறது. “அநீதி” עָוֶל-இன் நீதித்துறை மற்றும் ஒழுக்கப் பொருள் வரம்பைச் சரியாகக் காக்கிறது. அடிக்குறிப்பு “தவறு” மற்றும் ஒழுக்கக் குற்றம்/குற்றப்பொறுப்பு ஆகிய மாற்றுப் பொருள் சாத்தியங்களைத் தகுந்தவாறு விளக்குகிறது.
