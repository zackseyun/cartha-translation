  source_fidelity: யְהוָה אֱלֹהַי என்பதன் நேரடி அழைப்பு “யாவே, என் கடவுளே” எனத் துல்லியமாக உள்ளது. இரு אִם-நிபந்தனைகளும் காக்கப்பட்டுள்ளன; עָשִׂיתִי זֹאת-இன் நிறைவுற்ற செயலும், יֶשׁ עָוֶל בְּכַפָּי-இன் ‘என் கைகளில்’ என்ற உருவகமும் பொருளோடு வழங்கப்பட்டுள்ளன. இறுதி நீள்கோடு மூலத்தில் தொடரும் தற்கண்டனைத் தொடரைக் குறிக்க ஏற்றது.
