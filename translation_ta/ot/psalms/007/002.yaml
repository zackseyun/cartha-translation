revisions:
- from: இல்லையெனில், அவன் சிங்கம்போல் என் உயிரை[a]க் கிழித்து, மீட்பவர் யாருமில்லாதபடி என்னைத் துண்டுதுண்டாக்கிவிடுவான்.
  to: இல்லையெனில், அவன் சிங்கம்போல் என் உயிரைக் கிழித்துத் துண்டுதுண்டாக்குவான்; மீட்பவர் யாரும் இருக்கமாட்டார்.[a]
  rationale: The revision preserves the predatory imagery and the lexical choice ‘உயிர்,’ while rendering the final Hebrew existential clause directly and avoiding an unnecessary change from ‘my life’ to ‘me.’ The footnote remains appropriately anchored to ‘என் உயிரை’ and preserves the lexical breadth of נַפְשִׁי.
