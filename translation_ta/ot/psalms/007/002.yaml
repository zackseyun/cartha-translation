translation:
  language: ta
  text: இல்லையெனில், அவன் சிங்கம்போல் என் உயிரைக் கிழித்துத் துண்டுதுண்டாக்குவான்; மீட்பவர் யாரும் இருக்கமாட்டார்.[a]
  philosophy: optimal-equivalence
  footnotes:
