    text: அல்லது, “என்னையே.” எபிரெயச் சொல் (נַפְשִׁי) இங்கு ஆபத்துக்குள்ளான சங்கீதக்காரரின் உயிரையோ அவரது முழு நபரையோ குறிக்கலாம்.
