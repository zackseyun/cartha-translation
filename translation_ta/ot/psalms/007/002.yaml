lexical_decisions:
- source_word: פֶּן
  choice: இல்லையெனில்
  rationale: அஞ்சப்படும் விளைவை அறிமுகப்படுத்தும் எதிர்மறைச் சொல்லாக இங்கு வருகிறது; முந்தைய வேண்டுதலோடு இயல்பாக இணையும் நவீனத் தமிழ் வடிவம்.
- source_word: יִטְרֹף
  choice: கிழித்து
  rationale: இரைகொல்லும் விலங்கு தனது இரையைக் கிழிக்கும் வன்மையான படிமத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: כְּאַרְיֵה
  choice: சிங்கம்போல்
  rationale: כְּ என்ற ஒப்புமைக் கூறை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: இங்கு ஆபத்தில் இருப்பது சங்கீதக்காரரின் உயிர் அல்லது முழு நபரே; உடலிலிருந்து வேறான ‘ஆத்துமா’ என்ற குறுகிய பொருளைத் தேவையின்றி புகுத்தாமல் உள்ளது.
- source_word: פֹּרֵק
  choice: என்னைத் துண்டுதுண்டாக்கிவிடுவான்
  rationale: சிங்கம் இரையைக் கிழித்துச் சிதைக்கும் படிமத்தை வலுப்படுத்தும் தொடர்ச்சியான செயலை வெளிப்படுத்துகிறது. எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாததால், நபரைக் குறிக்கும் נַפְשִׁי என்பதற்கேற்ப ‘என்னை’ என இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: וְאֵין מַצִּיל
  choice: மீட்பவர் யாருமில்லாதபடி
  rationale: ஆபத்திலிருந்து விடுவிக்க ஒருவர் கூட இல்லாத நிலையைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
