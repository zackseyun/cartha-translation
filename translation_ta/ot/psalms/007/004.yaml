  text: if I have repaid the one at peace with me with evil[a], or delivered my enemy for nothing—
translation:
  language: ta
  text: 'என்னோடு சமாதானமாக இருந்தவனுக்குத் தீமையை கைம்மாறாகச் செய்திருந்தாலோ,

    காரணமின்றி என் பகைவனை விடுவித்திருந்தாலோ[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “காரணமின்றி என் பகைவனைக் கொள்ளையிட்டிருந்தாலோ.” எபிரெய வினைச்சொல்லை ‘விடுவி/மீட்டு’ என்பதற்குப் பதிலாக, சூறையாடுதல் அல்லது பறித்தல் என்ற எதிர்மறைப் பொருளிலும் சிலர் புரிந்துகொள்கின்றனர்.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: செய்திருந்தாலோ
  rationale: சுயசாப உறுதிமொழியின் நிபந்தனைத் தொடக்கத்தைத் தமிழில் இயல்பாக வெளிப்படுத்த, இரு வினைகளிலும் ‘-இருந்தாலோ’ அமைப்பு பயன்படுத்தப்பட்டது.
- source_word: גָּמַלְתִּי
  choice: கைம்மாறு செய்திருந்தாலோ
  rationale: גמל என்பதிலுள்ள ஒருவரது செயலுக்கு ஏற்றபடி திருப்பிச் செய்தல் அல்லது பலனளித்தல் என்ற பரஸ்பர நுணுக்கத்தை இது காக்கிறது.
- source_word: שׁוֹלְמִי
  choice: என்னோடு சமாதானமாக இருந்தவன்
  rationale: ‘நண்பன்’ அல்லது ‘கூட்டாளி’ என்று உறவை மிகத் துல்லியமாக வரையறுக்காமல், பேச்சாளரோடு அமைதியான உறவில் இருப்பவர் என்ற எபிரெயச் சொல்லின் பொருளை நேரடியாகத் தருகிறது.
- source_word: רָע
  choice: தீமையால்
  rationale: கைம்மாறாக அளிக்கப்பட்டது தீமை என்பதையும் அதன் அறநெறிசார் வலிமையையும் வெளிப்படுத்துகிறது.
- source_word: וָאֲחַלְּצָה
  choice: கொள்ளையிட்டிருந்தாலோ
  rationale: இந்தச் சூழலில் חלץ என்பதற்கு உடைமையைப் பறித்தல் அல்லது சூறையாடுதல் என்ற எதிர்மறைப் பொருள் கொள்ளப்பட்டது; இது மறுக்கப்படும் இரண்டு குற்றங்களின் இணை அமைப்பைக் காக்கிறது. ‘விடுவித்தேன்/மீட்டேன்’ என்ற பொதுவான வேறொரு பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: צוֹרְרִי
  choice: என் பகைவன்
  rationale: பேச்சாளரை எதிர்த்து நிற்பவரைக் குறிக்கும் சொல்லுக்கு நவீனத் தமிழில் தெளிவான, இயல்பான இணை.
- source_word: רֵיקָם
  choice: காரணமின்றி
  rationale: இங்கு அநியாயமாக அல்லது தக்க காரணமில்லாமல் செய்த செயல் என்ற பொருள் நிபந்தனை உறுதிமொழியின் சூழலுக்கு நன்கு பொருந்துகிறது.
theological_decisions:
- issue: וָאֲחַלְּצָה צוֹרְרִי רֵיקָם என்பதன் பொருள்
  choice: 'எதிர்மறையான இணை வாசிப்பு: ‘காரணமின்றி என் பகைவனைக் கொள்ளையிட்டிருந்தாலோ’'
  alternative: 'நேர்மறையான விட்டுக்கொடுப்பு வாசிப்பு: ‘காரணமின்றி எனக்குப் பகைவனாக இருந்தவனை நான் விடுவித்திருந்தபோதிலும்’'
  rationale: חלץ என்ற வினை பொதுவாக ‘விடுவி/மீட்டு’ என்றும் பொருள்படும்; ஆனால் இங்கு அப்பொருள் முந்தைய குற்றச்சாட்டோடு நேரான இணைப்பைத் தடுக்கும். ‘கொள்ளையிடு’ என்ற எதிர்மறைப் பொருள், சங்கீதக்காரன் தான் செய்யவில்லை என்று மறுக்கும் இரண்டு அநீதிகளின் இணை அமைப்பைத் தெளிவாக்குகிறது. இருப்பினும் எபிரெயின் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சமாதானமாக இருந்தவன்’ என்பது மூலத்தின் உறவுநிலையைத் துல்லியமாகக் காக்கிறது; ‘கைம்மாறு’ சற்றே உயர்ந்த நடையாயினும் பொதுவாகப் புரியக்கூடியது. அடுத்த வசனத்தில் நிறைவடையும் நிபந்தனை அமைப்பைக் காட்ட இறுதியில் நீண்ட கோடு வைக்கப்பட்டுள்ளது.
