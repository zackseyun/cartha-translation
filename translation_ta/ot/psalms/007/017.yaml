  text: אוֹדֶ֣ה יְהוָ֣ה כְּ/צִדְק֑/וֹ וַ֝/אֲזַמְּרָ֗ה שֵֽׁם יְהוָ֥ה עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
translation:
  language: ta
  text: 'யாவேக்கு அவருடைய நீதியின்படி[a] நன்றி செலுத்துவேன்;


    உன்னதரான யாவேயின் பெயரைப் புகழ்ந்து பாடுவேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய நீதியின் காரணமாக” அல்லது “அவருடைய நியாயத்தின்படி.” இங்குள்ள எபிரெயச் சொல் நீதி மற்றும் நியாயம் ஆகிய இரு நுணுக்கங்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדֶה
  choice: நன்றி செலுத்துவேன்
  rationale: சங்கீத வழிபாட்டுச் சூழலில் ידה என்பதன் ஹிஃபில் வடிவம் நன்றி செலுத்துதல் அல்லது துதித்தல் என்ற பொருளைக் கொண்டது. இங்கு யாவே நேரடியாக நோக்கப்படுவதால் ‘நன்றி செலுத்துவேன்’ இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத்தலைப்பால் மாற்றாமல், எபிரெய தனிப்பெயரான יהוה என்பதைக் குறிக்கும் பரவலான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: כְצִדְקוֹ
  choice: அவருடைய நீதியின்படி
  rationale: כְ முன்னொட்டு ‘அதற்கேற்ப/அதன்படி’ என்ற தொடர்பைத் தருகிறது. צדק என்பதில் நேர்மை மற்றும் நியாயம் ஆகிய இரு நுணுக்கங்களும் உள்ளதால், தமிழில் அவற்றை விரிவாகத் தாங்கக்கூடிய ‘நீதி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַאֲזַמְּרָה
  choice: புகழ்ந்து பாடுவேன்
  rationale: זמר என்பது இசையுடன் பாடுவதையும் குறிப்பாக இறைப்புகழைப் பாடுவதையும் குறிக்கிறது. விருப்பம் அல்லது உறுதியை வெளிப்படுத்தும் எபிரெய வடிவம் தமிழில் எதிர்கால உறுதிமொழியாக வழங்கப்பட்டுள்ளது.
- source_word: שֵׁם
  choice: பெயர்
  rationale: கடவுளின் வெளிப்படுத்தப்பட்ட அடையாளத்தையும் புகழையும் உள்ளடக்கும் மூல உருவகத்தை ‘பெயர்’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதரான
  rationale: ‘மிக உயர்ந்தவர்’ என்ற இறைத்தலைப்பின் பொருளை இயல்பான தமிழில் தருகிறது; மூலத்தில் இல்லாத ‘தேவன்’ என்ற சொல்லைச் சேர்க்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரையே பயன்படுத்துவதால் அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: צדק என்பதன் நீதி/நியாயம் சார்ந்த பொருள்
  choice: நீதி
  alternative: நியாயம்
  rationale: இந்த இடத்தில் சொல் கடவுளின் நேர்மையான இயல்பையும் நீதியான செயலையும் ஒருங்கே சுட்டலாம். ‘நீதி’ அந்த விரிவைத் தக்கவைக்கிறது; காரணப் பொருள் மற்றும் நியாய நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டுக்குரிய கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நீதியின்படி’ என்ற சற்றே முறையான சொற்றொடர் எபிரெய כְ என்பதின் தொடர்பை வெளிப்படையாகத் தக்கவைக்கிறது; இரண்டாம் அடியில் இயல்பான தமிழ் சொல்வரிசை பயன்படுத்தப்பட்டுள்ளது.
