base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples[a]; judge me, O Yahweh[c][b], according to my righteousness and according to my integrity that is upon me.
translation:
  language: ta
  text: 'யாவே மக்களினங்களை நியாயந்தீர்க்கிறார்;


    யாவே, என் நீதியின்படியும்


    என்னிலுள்ள நேர்மையின்படியும்[b][c]


    என்னை நியாயந்தீரும்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு நீதி வழங்கும்.” “என்னை நியாயந்தீரும்” என்ற எபிரெய கட்டளை, தனக்குச் சாதகமான நீதித்தீர்ப்பை வழங்கும்படி வேண்டுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நேர்மை” என்பதற்கு மாற்றாக, “குற்றமற்ற தன்மை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: சொற்சொல்லாக, “என்மேல் உள்ள என் நேர்மையின்படி.”
    reason: literal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יָדִין
  choice: நியாயந்தீர்க்கிறார்
  rationale: இங்கு imperfect வடிவம் யாவேயின் தொடர்ந்த அல்லது பொதுவான நீதிபதி செயல்பாட்டைக் குறிக்கலாம்; நிகழ்காலம் அந்தக் கவிதைச் சூழலுக்கு ஏற்றது.
- source_word: עַמִּים
  choice: மக்களினங்களை
  rationale: பல மனித மக்கள் குழுக்களைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது; அரசியல் அமைப்புகளான ‘நாடுகள்’ என்று பொருளைக் குறுக்கவில்லை.
- source_word: שָׁפְטֵנִי
  choice: என்னை நியாயந்தீரும்
  rationale: שפט என்பதன் நேரடியான நீதித்துறைப் பொருளையும், முந்தைய ‘நியாயந்தீர்க்கிறார்’ என்பதுடனான சொல் தொடர்பையும் காக்கிறது; சாதகமான தீர்ப்பு என்ற சூழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כְּצִדְקִי
  choice: என் நீதியின்படி
  rationale: சங்கீதக்காரரின் நீதியான நிலை அல்லது நடத்தையை வெளிப்படையாகப் பாதுகாக்கிறது; כ முன்னொட்டின் அளவுகோல் சார்ந்த பொருளை ‘இன்படி’ தெரிவிக்கிறது.
- source_word: וּכְתֻמִּי
  choice: என் நேர்மையின்படி
  rationale: תֻּם குறிக்கும் முழுமை, உத்தமம், குற்றமற்ற தன்மை ஆகியவற்றில், நவீன தமிழில் இயல்பாகவும் பாவமற்ற முழுநிறைவை மிகைப்படுத்தாமலும் ‘நேர்மை’ அமைகிறது.
- source_word: עָלָי
  choice: எனக்குரிய
  rationale: எபிரெய ‘என்மேல்’ என்ற உருவகத்தைத் தமிழில் இயல்பாக, அந்த நேர்மை பேச்சாளருக்குரியது அல்லது அவரைப் பற்றியது என வெளிப்படுத்துகிறது; சொற்சொல்லான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: சங்கீதக்காரர் தமது நீதியையும் நேர்மையையும் கூறுவது முழுமையான பாவமின்மையைக் குறிக்கிறதா
  choice: ‘என் நீதி’, ‘என் நேர்மை’ என்ற முதல் நபர் உரிமைக்கூற்றைத் தணிக்காமல் நேரடியாக வைத்தல்
  alternative: முதன்மை உரையில் ‘இந்த விவகாரத்தில் என் குற்றமின்மை’ அல்லது ‘என் நியாயமான வழக்கு’ என்று சூழலுக்குள் மட்டும் வரையறுத்தல்
  rationale: எபிரெய உரை உரிமைக்கூற்றை வெளிப்படையாக முன்வைக்கிறது. அதை முழுமையான பாவமின்மை என்றும் வெறும் ஒப்பீட்டு குற்றமின்மை என்றும் மொழிபெயர்ப்பே தீர்மானிக்காமல், உரையின் இறையியல் பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்தையும் எபிரெய இணை அமைப்பையும் காக்கும் வகையில் வரிகள் பிரிக்கப்பட்டுள்ளன. ‘நியாயந்தீரும்’ என்பது செம்மையான வேண்டுகோள் வடிவமாக இருந்தாலும் பொதுவாகப் புரியக்கூடியது. இறைப்பெயர் பட்டமாக மாற்றப்படாமல் ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
