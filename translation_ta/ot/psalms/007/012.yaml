source:
  edition: WLC
  text: אִם לֹ֣א יָ֭שׁוּב חַרְבּ֣/וֹ יִלְט֑וֹשׁ קַשְׁתּ֥/וֹ דָ֝רַ֗ךְ וַֽ/יְכוֹנְנֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/012.yaml
  text: If he does not turn back[a], he will sharpen his sword[c][b]; he has bent his bow and made it ready.
translation:
  language: ta
  text: அவன் திரும்பாவிட்டால்[a], அவர் தமது வாளைக் கூர்தீட்டுவார்[b]; தமது வில்லை வளைத்து, அதை ஆயத்தமாக்கியுள்ளார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் மனந்திரும்பாவிட்டால்.’ எபிரெய வினைச்சொல் ‘திரும்புதல்’ என்று பொருள்படும்; இச்சூழலில் அது மனந்திரும்புவதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘அவர்’ என்பது தீர்ப்பின் ஆயுதங்களை ஆயத்தப்படுத்தும் கடவுளைக் குறிப்பதாகப் பெரும்பாலும் புரிந்துகொள்ளப்படுகிறது. ஆனால் எபிரெய உரையில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படாததால், ஆயுதங்களை ஆயத்தப்படுத்துவது அந்தத் தீய மனிதனே என்றும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: திரும்பாவிட்டால்
  rationale: எபிரெய மொழியின் எதிர்மறை நிபந்தனையைத் தமிழில் இயல்பான ‘-ஆவிட்டால்’ அமைப்பால் தருகிறது.
- source_word: יָשׁוּב
  choice: திரும்பாவிட்டால்
  rationale: שׁוּב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதைக் காக்கிறது; சூழலில் உள்ள மனந்திரும்புதலின் பொருளை அடிக்குறிப்பு விளக்குகிறது.
- source_word: חַרְבּוֹ יִלְטוֹשׁ
  choice: தமது வாளைக் கூர்தீட்டுவார்
  rationale: வாளைக் கூர்மைப்படுத்துதல் என்ற ஆயுதத் தயாரிப்பைத் துல்லியமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: קַשְׁתּוֹ דָרַךְ
  choice: தமது வில்லை வளைத்து
  rationale: வில்லைப் போருக்காக வளைத்து ஆயத்தப்படுத்தும் எபிரெயப் படிமத்தை நெருக்கமாகக் காக்கிறது.
- source_word: וַיְכוֹנְנֶהָ
  choice: அதை ஆயத்தமாக்கியுள்ளார்
  rationale: பெண்பால் பின்னொட்டு குறிக்கும் வில்லைத் தயார்நிலையில் வைத்திருப்பது என்ற பொருளைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஒருமை வினைகளின் எழுவாய்
  choice: நிபந்தனைப் பகுதியில் ‘அவன்’ என்பது திரும்பாத மனிதனையும், ஆயுதங்களை ஆயத்தப்படுத்துபவர் ‘அவர்’ என்பது நீதிபதியாகிய கடவுளையும் சுட்டுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ஆயுதங்களை ஆயத்தப்படுத்துபவனும் அந்தத் தீய மனிதனே என்று வாசிக்கலாம்.
  rationale: உடனடிச் சூழலில் கடவுள் நீதியுள்ள நீதிபதியாகத் தீர்ப்பின் ஆயுதங்களை ஆயத்தப்படுத்துவது முதன்மையான வாசிப்பு. இருப்பினும், எபிரெய உரை எழுவாயைப் பெயரிட்டு வெளிப்படுத்தாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. கடவுளைக் குறிக்கும் முதன்மை வாசிப்பில் மரியாதைப் பன்மையான ‘அவர்/தமது’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் உண்மையான எழுவாய் ஐயம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
