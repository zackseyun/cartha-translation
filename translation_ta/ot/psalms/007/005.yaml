base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/005.yaml
  text: let the enemy pursue my life and overtake it[a]; let him trample my life to the ground and make my glory dwell in the dust[b]. Selah
translation:
  language: ta
  text: எதிரி என் உயிரைத் துரத்திப் பிடிக்கட்டும்[a]; என் உயிரைத் தரையில் மிதித்து, என் மகிமையைப் புழுதியில் குடியிருக்கச் செய்யட்டும்[b]. சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் உயிரை’ என்பதற்குப் பதிலாக ‘என் ஆத்துமாவை’ என்றும் மொழிபெயர்க்கலாம் (נַפְשִׁי); எபிரெயச் சொல் சூழலுக்கேற்ப ஒருவரின் உயிர், தன்னையே, அல்லது ஆத்துமாவைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘என் மகிமையை’ என்பதற்குப் பதிலாக ‘என் மரியாதையை’ அல்லது ‘என் கண்ணியத்தை’ என்றும் மொழிபெயர்க்கலாம் (כְבוֹדִי).
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרַדֹּף
  choice: துரத்தட்டும்
  rationale: முந்தைய வசனத்தின் நிபந்தனை உறுதிமொழியைத் தொடர்ந்து வரும் சுயசாப வேண்டுதல் வலிமையையும், பகைமையுடன் பின்தொடரும் அடிப்படைப் பொருளையும் காக்கிறது.
- source_word: אוֹיֵב
  choice: எதிரி
  rationale: எபிரெயச் சொல் ஒருமையில் உள்ளது; தமிழில் சுட்டுப்பெயர் இல்லாத ‘எதிரி’ இயல்பாகவும், குறிப்பிட்ட எதிரி அல்லது பொதுவான பகைவன் என்ற நுண்மையான தெளிவின்மையை ஓரளவு காப்பதாகவும் உள்ளது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: இங்கு נֶפֶשׁ என்பது பிரித்துக் காணப்படும் ‘ஆத்துமா’ என்பதைவிட உயிர் அல்லது உயிருள்ள நபரைக் குறிக்கிறது; துரத்திப் பிடிக்கும் சூழலில் ‘உயிர்’ இயல்பானது.
- source_word: וְיַשֵּׂג
  choice: பிடிக்கட்டும்
  rationale: துரத்திச் சென்று எட்டிப்பிடித்தல் என்ற தொடர்ச்சியான செயல்பாட்டைச் செறிவான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: וְיִרְמֹס
  choice: மிதித்து
  rationale: காலால் நசுக்கும் வன்மையான கவித்துவப் படிமத்தை நேரடியாகக் காக்கிறது; முதல் வினையின் வேண்டுதல் வலிமை இறுதி வினையுடன் இணைந்து முழுத் தொடரையும் ஆளுகிறது.
- source_word: לָאָרֶץ
  choice: தரையில்
  rationale: மிதித்தல் என்ற இணைப்பில் ‘பூமிக்கு’ என்பதைக் காட்டிலும் ‘தரையில்’ இயல்பான தமிழ்; கீழே வீழ்த்தி அவமதிக்கும் படிமமும் நிலைக்கிறது.
- source_word: חַיָּי
  choice: என் உயிரை
  rationale: எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், இங்கு வழக்காற்றில் ஒருவருடைய வாழ்வு அல்லது உயிரைக் குறிக்கிறது.
- source_word: וּכְבוֹדִי
  choice: என் மகிமையை
  rationale: ‘மரியாதை’, ‘கண்ணியம்’ ஆகிய பொருள்களையும் உள்ளடக்கக்கூடிய கவித்துவ விரிவைச் சுருக்காமல் காக்கிறது.
- source_word: לֶעָפָר
  choice: புழுதியில்
  rationale: தாழ்வு மற்றும் மரணம் சார்ந்த படிமத்தைத் தக்கவைக்கிறது; ‘குடியிருக்க’ என்பதுடன் இடவெற்றுமை இயல்பாக அமைகிறது.
- source_word: יַשְׁכֵּן
  choice: குடியிருக்கச் செய்யட்டும்
  rationale: שׁכן என்பதன் ஹிஃபீல் காரணவினைப் பொருளான ‘குடியிருக்கச் செய்தல்’ என்பதைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: சொல்லின் துல்லியமான பொருள் உறுதியில்லாததால் மொழிபெயர்த்து அதிக நிச்சயத்தைச் சுமத்தாமல் மரபான ஒலிபெயர்ப்பு வைக்கப்படுகிறது.
theological_decisions:
- issue: נַפְשִׁי என்பதன் மனித இயல்பியல் பொருள்
  choice: என் உயிரை
  alternative: என் ஆத்துமாவை
  rationale: துரத்துதல், பிடித்தல், மிதித்தல் ஆகிய உடனடிச் சூழல் உயிரையே முன்னிறுத்துகிறது. ‘ஆத்துமா’ என மொழிபெயர்ப்பது எபிரெயம் கட்டாயப்படுத்தாத உடல்–ஆத்துமா பிரிவை இறக்குமதி செய்யக்கூடும்; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: כְבוֹדִי என்பதன் கவித்துவமான சுயக்குறிப்பு
  choice: என் மகிமையை
  alternative: என் மரியாதையை / என் கண்ணியத்தை
  rationale: மூலத்தின் உயர்ந்த கவித்துவப் படிமத்தையும் அதன் பொருள் விரிவையும் ‘மகிமை’ காக்கிறது; மரியாதை அல்லது கண்ணியம் என்ற சாத்தியங்கள் அடிக்குறிப்பில் வெளிப்படுத்தப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கவித்துவக் கண்ணியமும் இணைக்கப்பட்டுள்ளன. ‘துரத்திப் பிடிக்கட்டும்’ என்பது எபிரெய வினைத் தொடரின் இயக்கத்தை இயல்பாகத் தருகிறது; ‘புழுதியில் குடியிருக்கச் செய்யட்டும்’ என்பது நோக்கமுள்ள அசாதாரணக் கவிப்படிமத்தைச் சமப்படுத்தாமல் பாதுகாக்கிறது.
