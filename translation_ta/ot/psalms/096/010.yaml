id: PSA.96.10
reference: Psalms 96:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אִמְר֤וּ בַ/גּוֹיִ֨ם יְה֘וָ֤ה מָלָ֗ךְ אַף תִּכּ֣וֹן תֵּ֭בֵל בַּל תִּמּ֑וֹט יָדִ֥ין עַ֝מִּ֗ים בְּ/מֵישָׁרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/010.yaml
  text: Say among the nations[a], “Yahweh reigns! Indeed, the world is established; it shall not be moved[c][b]. He will judge the peoples with equity.”
translation:
  language: ta
  text: 'நாடுகளிடையே அறிவியுங்கள்: “யாவே அரசாளுகிறார்![a] ஆம், உலகம்[b] உறுதியாக நிலைபெற்றுள்ளது; அது அசைக்கப்படாது. அவர் மக்களினங்களை நேர்மையாக[c] நியாயந்தீர்ப்பார்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே அரசர்,” அல்லது “யாவே அரசரானார்.” எபிரெய வாசகத்தை தற்போதைய அரசாட்சியின் பிரகடனமாகவோ அரியணையேற்ற அறிவிப்பாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “மக்கள் வாழும் உலகம்.”
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “செம்மையாக” அல்லது “பாரபட்சமின்றி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: அறிவியுங்கள்
  rationale: இது אמר என்பதன் பன்மை ஏவல்வினை. நாடுகளிடையே வெளிப்படையாகச் சொல்ல வேண்டிய அறிவிப்பாக இருப்பதால், வெறும் ‘சொல்லுங்கள்’ என்பதைவிட ‘அறிவியுங்கள்’ சூழலுக்கு இயல்பாகப் பொருந்துகிறது.
- source_word: בַגּוֹיִם
  choice: நாடுகளிடையே
  rationale: ב முன்னொட்டு இங்கு சமூக/இடச் சூழலைக் குறிக்கிறது; גּוֹיִם என்பதன் பன்னாட்டு விரிவை ‘நாடுகள்’ காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מָלָךְ
  choice: அரசாளுகிறார்
  rationale: அரியணையேற்றப் பாணியிலுள்ள இந்நிறைவுவினை நிகழ்கால அரசாட்சிப் பிரகடனமாக இயல்பாகப் புரிந்துகொள்ளலாம்; தொடக்க நேரத்தைத் தீர்மானிக்காமல் ஆட்சிசெய்யும் நிலையை வெளிப்படுத்துகிறது.
- source_word: אַף
  choice: ஆம்
  rationale: முந்தைய அரசாட்சிப் பிரகடனத்தை உறுதிப்படுத்தி அடுத்த கூற்றுடன் இணைக்கும் வலியுறுத்தலைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: תִּכּוֹן
  choice: உறுதியாக நிலைநிறுத்தப்பட்டுள்ளது
  rationale: כון என்பதன் நிஃபால் வடிவிலுள்ள நிலைநிறுத்தப்பட்ட, உறுதிப்படுத்தப்பட்ட விளைவு நிலையைத் தெளிவாகக் காக்கிறது.
- source_word: תֵּבֵל
  choice: உலகம்
  rationale: ஒழுங்குபடுத்தப்பட்ட, குடியிருக்கும் உலகைக் குறிக்கும் சொல்லுக்கு இயல்பான தமிழ் இணை; அதன் குறிப்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בַּל תִּמּוֹט
  choice: அது அசைக்கப்படாது
  rationale: கவித்துவ எதிர்மறையுடன், நிலைத்தன்மையிலிருந்து குலைக்கப்படாமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יָדִין
  choice: நியாயந்தீர்ப்பார்
  rationale: அரசரின் ஆட்சிச் சூழலையும் உள்ளடக்கக்கூடிய நீதித்தீர்ப்புப் பொருளை நேரடியாகக் காக்கிறது.
- source_word: עַמִּים
  choice: மக்களினங்களை
  rationale: முன்னர் வந்த ‘நாடுகள்’ என்பதிலிருந்து எபிரெயச் சொல் வேறுபாட்டைக் காத்து, பல்வேறு மக்கள் கூட்டங்களைக் குறிக்கிறது.
- source_word: בְּמֵישָׁרִים
  choice: நேர்மையுடன்
  rationale: ‘நேர்மை, செம்மை, பாரபட்சமின்மை’ ஆகிய பொருள் பரப்பைக் கொண்ட சொல்லை நீதித்தீர்ப்புச் சூழலில் இயல்பாக வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: מָלָךְ என்பதன் கால/தோற்றப் பொருள்
  choice: யாவே அரசாளுகிறார்
  alternative: யாவே அரசர்; யாவே அரசரானார்
  rationale: இது நிகழ்கால அரசாட்சிப் பிரகடனமாகவோ அரியணையேற்ற அறிவிப்பாகவோ புரிந்துகொள்ளப்படலாம். முதன்மை உரை தொடக்கநேரம் குறித்த முடிவைத் திணிக்காமல் நிகழும் அரசாட்சியைச் சொல்கிறது; உண்மையான மாற்று வாசிப்புகள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
- issue: உலகத்தின் நிலைத்தன்மை
  choice: உலகம் உறுதியாக நிலைநிறுத்தப்பட்டுள்ளது; அது அசைக்கப்படாது
  alternative: உலகம் நிலைபெற்றுள்ளது; அது குலையாது
  rationale: இது யாவேயின் அரசாட்சியுடன் இணைக்கப்பட்ட ஒழுங்கும் நிலைத்தன்மையும் குறித்த கவித்துவப் பிரகடனம்; அதன் இலக்கியத் தீவிரத்தைத் தளர்த்தாமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு/கவித்துவ நடையுடன் வடிவமைக்கப்பட்டது. ‘அறிவியுங்கள்’ பொதுப் பிரகடனத் தன்மையை வெளிப்படுத்துகிறது; ‘உறுதியாக நிலைநிறுத்தப்பட்டுள்ளது’ மூலத்தின் செயப்பாட்டு விளைவு நிலையைக் காக்கிறது. இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடுகள் அவை விளக்கும் சொற்றொடர்களின் உடனடிப் பின்னர் வைக்கப்பட்டுள்ளன.
