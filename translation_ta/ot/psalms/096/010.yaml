  source_fidelity: முதன்மை உரை எபிரெயத்தின் கட்டளை, யாவேயின் அரசாட்சிப் பிரகடனம், உலகத்தின் உறுதிநிலை, மற்றும் மக்களினங்களுக்கான சமநீதியான தீர்ப்பைத் துல்லியமாகக் கொண்டுள்ளது. ஆயினும், நேர்மையைக் குறிக்கும் அடிக்குறிப்பு குறியீடு தீர்ப்புச் சொற்றொடருக்குப் பதிலாக முழு மேற்கோளின் இறுதியில் உள்ளது; அது விளக்கும் சொல்லுடன் இணைக்கப்பட வேண்டும்.
