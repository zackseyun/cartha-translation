  to: யாவேக்கு அவருடைய பெயருக்குரிய மகிமையைச் செலுத்துங்கள்; காணிக்கையைக்[a] கொண்டு வந்து அவருடைய பிராகாரங்களுக்குள் வாருங்கள்.
