  text: הָב֣וּ לַ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ שְׂאֽוּ מִ֝נְחָ֗ה וּ/בֹ֥אוּ לְ/חַצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/008.yaml
  text: Ascribe to Yahweh the glory of his name[a]; bring an offering and come into his courts.
translation:
  language: ta
  text: யாவேக்கு அவருடைய பெயருக்குரிய மகிமையைச் செலுத்துங்கள்; காணிக்கையைக்[a] கொண்டு வந்து அவருடைய பிராகாரங்களுக்குள் வாருங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அன்பளிப்பைக் கொண்டு வந்து’ அல்லது ‘கப்பத்தைக் கொண்டு வந்து.’ எபிரெயச் சொல் சூழலுக்கேற்ப அன்பளிப்பு, கப்பம் அல்லது காணிக்கை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: செலுத்துங்கள்
  rationale: יהב என்பதன் அடிப்படைப் பொருள் ‘கொடுங்கள்.’ ஆனால் இச்சங்கீத வழிபாட்டு அழைப்பில், யாவேக்குரிய மகிமையை ஏற்றுக்கொண்டு அவருக்குச் செலுத்தும்படி இது கட்டளையிடுகிறது. ‘செலுத்துங்கள்’ என்பது இந்தச் சொற்றொடரை இயல்பான தமிழில் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה என்பதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், ‘யாவே’ என ஒலிபெயர்த்துள்ளது.
- source_word: כְּבוֹד שְׁמוֹ
  choice: அவருடைய பெயரின் மகிமை
  rationale: எபிரெயக் கட்டமைப்பான ‘அவருடைய பெயரின் மகிமை’ என்பதை நேரடியாகப் பாதுகாக்கிறது; ‘பெயர்’ என்பது அவரது வெளிப்படுத்தப்பட்ட தன்மையையும் புகழையும் குறிக்கக்கூடிய அதன் செறிவை விளக்கிச் சுருக்கவில்லை.
- source_word: שְׂאוּ
  choice: கொண்டுவந்து
  rationale: נשׂא என்பதற்கு அடிப்படையில் ‘தூக்குதல்/சுமத்தல்’ என்ற பொருள் இருந்தாலும், מִנְחָה உடன் இது ஒரு காணிக்கையைக் கொண்டுவருவதைக் குறிக்கிறது.
- source_word: מִנְחָה
  choice: காணிக்கை ஒன்று
  rationale: מִנְחָה என்பது சூழலுக்கேற்ப அன்பளிப்பு, கப்பம் அல்லது வழிபாட்டுக் காணிக்கை ஆகியவற்றைக் குறிக்கலாம். இங்கு ‘காணிக்கை’ என்பது வழிபாட்டுச் சூழலுக்கு ஏற்ற, தேவையற்ற குறிப்பாக்கம் இல்லாத பொதுவான மொழிபெயர்ப்பு.
- source_word: לְחַצְרוֹתָיו
  choice: அவருடைய பிராகாரங்களுக்குள்
  rationale: חֲצֵרוֹת என்பது ஆலயத்தைச் சேர்ந்த வெளிமுற்றங்கள் அல்லது பிராகாரங்களைக் குறிக்கிறது. இயக்கத்தைக் குறிக்கும் בוא உடன் ‘பிராகாரங்களுக்குள் வாருங்கள்’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: வசனம் יהוה என்ற தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பொதுப் பட்டத்தால் மாற்றாமல் பாதுகாக்கிறது.
- issue: כְּבוֹד שְׁמוֹ என்ற தொடரின் உறவு
  choice: அவருடைய பெயரின் மகிமை
  alternative: அவருடைய பெயருக்குரிய மகிமை
  rationale: ‘பெயருக்குரிய’ என்பது பொருளில் சாத்தியமான விளக்கமாயினும், மூலத்தின் இணைப்பை ‘பெயரின் மகிமை’ இன்னும் நேரடியாகப் பாதுகாத்து அதன் செறிவைத் திறந்தவையாக வைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டுக்குரிய கண்ணியமான நடையைப் பேணுகிறது. ‘பிராகாரங்கள்’ என்பது ஆலயச் சூழலைத் தெளிவாகக் காட்டும் நிலையான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; கட்டளை வினைகள் பன்மை மரியாதை வடிவில் உள்ளன.
