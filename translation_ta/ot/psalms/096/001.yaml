id: PSA.96.1
reference: Psalms 96:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שִׁ֣ירוּ לַ֭/יהוָה שִׁ֣יר חָדָ֑שׁ שִׁ֥ירוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/001.yaml
  text: Sing to Yahweh a new song; sing to Yahweh[a], all the earth.
translation:
  language: ta
  text: 'யாவேக்குப் புதிய பாடலைப் பாடுங்கள்;

    பூமி முழுவதும், யாவேக்குப்[a] பாடுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் יהוה (YHWH) என்ற இறைப் பெயர்; அதன் பண்டைய உச்சரிப்பு முழுமையாக உறுதியாகத் தெரியவில்லை. இங்கு ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது; மரபாக ‘கர்த்தர்’ என்றும், மாற்றாக ‘யெகோவா’ என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁירוּ
  choice: பாடுங்கள்
  rationale: שׁיר என்பதன் ஆண்பால் பன்மை ஏவல் வடிவம்; கூடுதல் பொருளைச் சேர்க்காமல் நேரடியான அழைப்பாகத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: לַיהוָה
  choice: யாவேக்குப்
  rationale: ל முன்னொட்டு பாடல் யாரை நோக்கி அல்லது யாருக்குப் பாடப்படுகிறது என்பதைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் யாவே என ஒலிபெயர்க்கப்படுகிறது.
- source_word: שִׁיר חָדָשׁ
  choice: புதியதொரு பாடலை
  rationale: שִׁיר என்பது ‘பாடல்,’ חָדָשׁ என்பது ‘புதிய’; இயல்பான நவீனத் தமிழுக்காக ஒருமையை ‘ஒரு’ உணர்த்துகிறது, எபிரெயச் சொல்லிணையின் பொருளை மாற்றவில்லை.
- source_word: כָּל הָאָרֶץ
  choice: பூமியனைத்தும்
  rationale: இந்தச் சங்கீதத்தின் உலகளாவிய அழைப்பில் הָאָרֶץ என்பது ‘நிலம்’ என்பதைக் காட்டிலும் ‘பூமி’ எனப் பொருந்துகிறது; כָּל முழுமையைக் குறிக்கிறது. எபிரெயத்தின் கவிதைமிகு நேரடி அழைப்பைத் தக்கவைக்க ‘பூமியனைத்தும்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் இறைவனின் நான்கெழுத்துத் தனிப்பெயர் நேரடியாக உள்ளது. அதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட உச்சரிப்பைத் தமிழில் ‘யாவே’ என ஒலிபெயர்ப்பது பெயரின் தன்மையைப் பாதுகாக்கிறது; துல்லியமான பண்டைய உச்சரிப்பு முழுமையாக உறுதிசெய்யப்படாததை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை. எபிரெயத்தின் இருமுறை வரும் ஏவலையும் ‘பூமி முழுவதையும்’ நேரடியாக அழைக்கும் கவித்துவத்தையும் தக்கவைக்கிறது.
