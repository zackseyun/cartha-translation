base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/007.yaml
  text: Ascribe to Yahweh[a], families of the peoples[c][b], ascribe to Yahweh glory and strength.
translation:
  language: ta
  text: மக்களினங்களின் குலங்களே[b], யாவேவுக்கு[a] மகிமையையும் வல்லமையையும் செலுத்துங்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே” என்பது எபிரெய மொழியிலுள்ள יהוה என்ற இறைத் திருப்பெயரின் ஒலிபெயர்ப்பு; சில மொழிபெயர்ப்புகள் இதை “கர்த்தர்” என வழங்குகின்றன.
    reason: alternative_reading
  - marker: b
    text: அல்லது “மக்களினங்களின் குடும்பங்களே.”
    reason: lexical_alternative
  - marker: c
    text: 'சொல்லுக்கு சொல்: “கொடுங்கள்.” இங்கு, யாவேவுக்குரிய மகிமையையும் வல்லமையையும் அவருக்கு உரியவை என்று ஏற்றறிவித்து வழங்குமாறு அழைக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: உரித்தாக்குங்கள்
  rationale: יהב என்பதன் கட்டளை வடிவம் சொற்பொருளில் ‘கொடுங்கள்’ என இருந்தாலும், இந்த வழிபாட்டு அழைப்பில் கடவுளுக்குரியதை அவருக்கே உரியதாக ஏற்றறிவிப்பதைக் குறிக்கிறது. ‘உரித்தாக்குங்கள்’ அந்தச் சூழல்சார் பொருளையும் மீண்டும் வரும் கட்டளை அமைப்பையும் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேவுக்கு
  rationale: לְ என்பது செயல் சென்றடையும் நபரைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் தமிழில் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: மக்களினங்களின் குடும்பங்களே
  rationale: מִשְׁפָּחוֹת என்பது குடும்பங்கள் அல்லது குலங்களையும், עַמִּים பல்வேறு மக்களினங்களையும் குறிக்கிறது. எபிரெய மூலத்தின் இரு பன்மைகளையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: כָּבוֹד
  choice: மகிமை
  rationale: வழிபாட்டுச் சூழலில் כָּבוֹד கடவுளுக்குரிய மகிமை அல்லது மாட்சியைக் குறிக்கிறது; ‘மகிமை’ இயல்பான உயர்நடைத் தேர்வு.
- source_word: וָעֹז
  choice: வல்லமை
  rationale: עֹז என்பது பலம், வலிமை அல்லது வல்லமை. கடவுளின் ஆற்றலை ஏற்றறிவிக்கும் இச்சூழலில் ‘வல்லமை’ இயல்பாகப் பொருந்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, יהוה என்ற தனிப்பெயரே உள்ளது. எனவே அதை பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்தது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் மீண்டும் வரும் கட்டளை தமிழிலும் காக்கப்பட்டுள்ளது; ‘குடும்பங்கள்’ என்ற சொல் மூலத்தின் சமூக/உறவுக் குழு நுணுக்கத்தைப் பாதுகாக்கிறது.
