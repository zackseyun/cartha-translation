  text: כִּ֥י גָ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד נוֹרָ֥א ה֝֗וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/004.yaml
  text: For Yahweh is great and greatly to be praised[c][b][a]; he is to be feared above all gods.
translation:
  language: ta
  text: ஏனெனில், யாவே பெரியவர்; அவர் மிகவும் போற்றப்படத்தக்கவர்[a]. எல்லாத் தெய்வங்களுக்கும்[c] மேலாக அஞ்சத்தக்கவர்[b] அவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மற்றொரு மொழிபெயர்ப்பு: “அவர் மிகவும் போற்றப்பட்டவர்.” எபிரேயப் பங்கெச்சத் தொடர் சொல்லுக்கு நெருக்கமாக “மிகவும் போற்றப்பட்டவர்” என உள்ளது; இங்கு அது இயல்பான தமிழில் “மிகவும் போற்றப்படத்தக்கவர்” எனத் தரப்பட்டுள்ளது.'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பயபக்தியைத் தூண்டுகிறவர்” / “அச்சமூட்டுகிறவர்.” எபிரேயச் சொல் அவர் பயபக்தியுடன் கூடிய அச்சத்தைத் தூண்டுகிறார் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “தெய்வங்கள்” என்பது பிற மக்களின் தெய்வங்களைக் குறிக்கலாம்; அடுத்த வசனம் அவற்றைப் பயனற்ற சிலைகள் என்று கூறுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வழிபாட்டு அழைப்பிற்கான காரணத்தை அறிமுகப்படுத்தும் எபிரேய இணைப்புச்சொல்லின் விளக்கத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: גָדוֹל
  choice: பெரியவர்
  rationale: நிலை, மாட்சிமை ஆகியவற்றில் உள்ள பெருமையைச் சுட்டுகிறது; வெறும் வல்லமையாக மட்டும் பொருளைக் குறுக்காமல் இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தைப் பதிலாக இடாமல், எபிரேய நான்கெழுத்துத் திருப்பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וּמְהֻלָּל מְאֹד
  choice: மிகவும் போற்றப்படத்தக்கவர்
  rationale: ‘மிகவும் போற்றப்பட்டவர்’ என்ற சொல்லுக்கு நெருக்கமான வடிவத்தின் பொருளை, இச்சூழலில் உரிய புகழைப் பெறத் தக்கவர் என்ற இயல்பான தமிழ் கூறாக அளிக்கிறது; பங்கெச்சத்தின் சிறு பொருள் நிழலை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: נוֹרָא הוּא
  choice: அஞ்சத்தக்கவர் அவர்
  rationale: அவர் பயபக்தியைத் தூண்டுகிறவர் என்ற வலிமையைப் பாதுகாக்கிறது; நவீன பயன்பாட்டில் வலுக்குறைந்த ‘பிரமிப்பூட்டுகிறவர்’ என்பதைத் தவிர்க்கிறது.
- source_word: עַל כָּל אֱלֹהִים
  choice: எல்லாத் தெய்வங்களுக்கும் மேலாக
  rationale: עַל என்பதன் மேன்மை/ஒப்பீட்டு உறவை இயல்பாக வெளிப்படுத்தி, אֱלֹהִים என்பதை விளக்கமாக ‘சிலைகள்’ என்று மாற்றாமல் ‘தெய்வங்கள்’ என வைத்திருக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், ஒரு பட்டத்தால் மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் வழங்கப்படுகிறது.
- issue: இந்தச் சூழலில் אֱלֹהִים என்பதன் பொருள்
  choice: தெய்வங்கள்
  alternative: தெய்வீக உயிர்கள் / சிலைகள்
  rationale: வசனம் கூறும் நேரடி சொல்லைத் தக்கவைக்கிறது. அடுத்த வசனம் அவற்றை பயனற்ற சிலைகளாக அடையாளப்படுத்தினாலும், அந்த விளக்கத்தை இவ்வசனத்திற்குள் முன்கூட்டியே புகுத்தவில்லை.
- issue: נוֹרָא என்பதில் பயமும் பயபக்தியும்
  choice: அஞ்சத்தக்கவர்
  alternative: பிரமிப்பூட்டுகிறவர் / பயங்கரமானவர்
  rationale: இச்சொல் தூண்டும் பயபக்தியையும் அச்சத்தையும் ஒன்றாகத் தக்கவைக்கிறது; அதை வெறும் வியப்பாகவோ கொடூரமான பயமாகவோ ஒருதலைப்பட்சமாக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டுக்கேற்ற கண்ணியமான நடையுடன் வடிவமைக்கப்பட்டது. “பெரியவர்,” “போற்றப்படத்தக்கவர்,” “அஞ்சத்தக்கவர்” என்ற இணையான பயனிலைகள் எபிரேயக் கவிதையின் வலியுறுத்தலைத் தக்கவைக்கின்றன; இறுதியில் வரும் “அவர்” மூலத்தின் வெளிப்படையான הוּא என்பதையும் வலியுறுத்தலையும் பிரதிபலிக்கிறது.
