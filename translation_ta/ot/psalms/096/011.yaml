  text: יִשְׂמְח֣וּ הַ֭/שָּׁמַיִם וְ/תָגֵ֣ל הָ/אָ֑רֶץ יִֽרְעַ֥ם הַ֝/יָּ֗ם וּ/מְלֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/011.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; let the sea thunder, and all that fills it.
translation:
  language: ta
  text: வானங்கள் மகிழட்டும்; பூமி களிகூரட்டும்; கடலும் அதில் உள்ள அனைத்தும் முழங்கட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முழங்கட்டும்’ என்பதற்கான எபிரெயச் சொல், ‘இடிமுழக்கம் செய்யட்டும்’ அல்லது ‘பேரொலி எழுப்பட்டும்’ என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: மகிழட்டும்
  rationale: שׂמח என்ற வினையின் கவிதைநடை விருப்பவியல்/அழைப்புத் தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: הַשָּׁמַיִם
  choice: வானங்கள்
  rationale: எபிரெயப் பன்மை வடிவத்தையும், படைப்பனைத்தையும் உள்ளடக்கும் உயர்ந்த கவிதைநடையையும் காக்கிறது.
- source_word: וְתָגֵל
  choice: களிகூரட்டும்
  rationale: גיל என்பதிலுள்ள பொங்கும் மகிழ்ச்சியை வெளிப்படுத்துவதோடு, முந்தைய ‘மகிழட்டும்’ என்பதிலிருந்து கவிதைநடை வேறுபாட்டையும் காக்கிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: வானங்கள்–பூமி–கடல் என்ற பிரபஞ்ச அளவிலான இணைப்பில் ‘நாடு’ என்பதைக் காட்டிலும் ‘பூமி’ பொருத்தமானது.
- source_word: יִרְעַם
  choice: முழங்கட்டும்
  rationale: רעם குறிக்கும் இடி போன்ற பேரொலி அல்லது முழக்கத்தை இயல்பான, கவிதைநயமுள்ள தமிழில் தருகிறது; அதன் பொருள் விரிவை அடிக்குறிப்பு சுட்டுகிறது.
- source_word: הַיָּם וּמְלֹאוֹ
  choice: கடலும் அதில் உள்ள அனைத்தும்
  rationale: சொல்லுக்கு சொல் ‘கடலும் அதன் நிறைவும்’ என்ற எபிரெய மரபுத்தொடரின் பொருளான கடலில் அடங்கியுள்ள அனைத்தையும் தெளிவான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கவிதை வினைகளின் விருப்பவியல் தன்மை
  choice: ‘மகிழட்டும் … களிகூரட்டும் … முழங்கட்டும்’ என்ற படைப்புக்கான அழைப்பாக மொழிபெயர்த்தல்
  alternative: ‘மகிழும் … களிகூரும் … முழங்கும்’ என்ற எதிர்கால முன்னறிவிப்பாக மொழிபெயர்த்தல்
  rationale: சங்கீதத்தின் சுற்றியுள்ள அழைப்புச் சூழலும் இணையான வினை அமைப்பும் இவற்றை வெறும் எதிர்காலக் கூற்றுகளாக அல்லாமல், படைப்பு மகிழ்ந்து துதிக்க வேண்டும் என்ற கவிதைநடை அழைப்பாகப் புரிந்துகொள்ள ஆதரிக்கின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும்படியும், சங்கீதத்திற்குரிய கண்ணியமான கவிதைநடையைப் பேணும்படியும் அமைக்கப்பட்டுள்ளது. ‘களிகூரட்டும்’ உயர்நடைச் சாயல் கொண்டிருந்தாலும் இன்றைய வாசகருக்குப் புரியக்கூடியதாகவும் גיל என்பதின் வலிமையான மகிழ்ச்சியைத் தக்கவைத்ததாகவும் உள்ளது.
