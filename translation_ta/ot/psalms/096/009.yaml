  yaml_path: translation/ot/psalms/096/009.yaml
  text: Worship Yahweh in the splendor of holiness; tremble before him[a], all the earth.
translation:
  language: ta
  text: 'பரிசுத்தத்தின் பேரழகில்[a] யாவேவை வணங்குங்கள்;


    பூமி முழுவதும், அவர் முன்னிலையில் நடுங்குங்கள்!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “புனித ஆடை அணிந்து” அல்லது “புனிதப் பொலிவில்.” எபிரெயச் சொற்றொடர் பரிசுத்தத்துக்குரிய பேரழகையோ, வழிபாட்டின்போது அணியும் புனித ஆடை அல்லது அணிகலனையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁתַּחֲווּ
  choice: வணங்குங்கள்
  rationale: இந்த வினை பணிவுடன் குனிதல் அல்லது சாஷ்டாங்கமாக விழுதல் என்ற உடல்சார் பொருளையும், வழிபடுதல் என்ற சமயப் பொருளையும் கொண்டது. இச்சூழலில் ‘வணங்குங்கள்’ என்பது இரண்டையும் இயல்பான நவீனத் தமிழில் இணைக்கிறது.
- source_word: לַיהוָה
  choice: யாவேவை
  rationale: மூலத்தில் வரும் உடன்படிக்கைப் பெயரான יהוה என்பதை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், ‘யாவே’ என ஒலிபெயர்த்துள்ளது.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: பரிசுத்தத்தின் பேரழகில்
  rationale: הדרה என்பது அழகு, மேன்மை, பொலிவு அல்லது அலங்காரம் ஆகிய பொருள்களைக் கொண்டது. ‘பேரழகு’ அதன் கவித்துவ மேன்மையை வெளிப்படுத்துகிறது; קֹדֶשׁ இங்கு ‘பரிசுத்தம்’ என்ற அருவப் பொருளில் கொள்ளப்பட்டுள்ளது. புனித ஆடை அல்லது அணிகலன் என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חִילוּ
  choice: நடுங்கு
  rationale: இந்த வினை நடுக்கம், திகில் அல்லது ஆழ்ந்த கலக்கம் என்பவற்றைக் குறிக்கலாம். தெய்வீக முன்னிலையிலான பயபக்தியை ‘நடுங்கு’ நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: מִפָּנָיו
  choice: அவர் முன்னிலையில்
  rationale: எழுத்துப்படி ‘அவருடைய முகத்திற்கு முன்பாக’ எனும் சொற்றொடர், இங்கு அவருடைய பிரசன்னத்தை எதிர்கொள்வதைக் குறிக்கிறது. ‘அவர் முன்னிலையில்’ என்பது இயல்பான தமிழ் வடிவம்.
- source_word: כָּל־הָאָרֶץ
  choice: பூமியனைத்துமே
  rationale: சங்கீதத்தின் உலகளாவிய அழைப்பின்படி הָאָרֶץ என்பதை குறிப்பிட்ட ‘நாடு’ என்று அல்லாமல் முழுப் ‘பூமி’ என்று மொழிபெயர்த்துள்ளது. வலியுறுத்தும் ஏகாரமும் நேரடி அழைப்பும் எபிரெயக் கட்டளையின் கவித்துவத் தாக்கத்தைத் தக்கவைக்கின்றன.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை தனிப்பட்ட இறைப் பெயரை நேரடியாகப் பயன்படுத்துவதால், பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: בְּהַדְרַת קֹדֶשׁ என்ற சொற்றொடரின் பொருள்
  choice: பரிசுத்தத்தின் பேரழகில்
  alternative: புனித ஆடை அணிந்து; புனிதப் பொலிவில்
  rationale: இச்சொற்றொடர் பரிசுத்தத்துக்குரிய அழகு அல்லது மேன்மையைக் குறிக்கலாம்; அதேவேளை வழிபாட்டாளர்களின் புனித ஆடை அல்லது அலங்காரத்தையும் குறிக்கக்கூடும். விரிந்த கவித்துவப் பொருள் முதன்மை உரையில் வைக்கப்பட்டு, மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமும் வழிபாட்டுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. முதல் வரியில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; இரண்டாம் வரியில் ‘பூமியனைத்துமே’ என்ற ஒருமை உருவகத்துக்கு ஏற்ற நேரடி ஒருமைக் கட்டளை மூலத்தின் கவித்துவ அழைப்பைப் பாதுகாக்கிறது.
