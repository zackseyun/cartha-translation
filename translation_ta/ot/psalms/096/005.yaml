  text: ஏனெனில், மக்களினங்களின் தெய்வங்கள் அனைத்தும் சிலைகளே[a]; ஆனால் யாவே[b] வானங்களை உண்டாக்கினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சிலைகள்” என்பதற்கான எபிரெயச் சொல் வெறுமை அல்லது மதிப்பின்மை என்ற இகழ்ச்சிநயத்தையும் கொண்டிருக்கலாம்; “பயனற்ற சிலைகள்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
