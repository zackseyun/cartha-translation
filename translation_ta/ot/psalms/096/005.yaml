- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: மக்களினங்களின் தெய்வங்கள் அனைத்தும்
  rationale: כָּל என்பதன் முழுமையான விரிவையும், עַמִּים என்பதன் பன்மை மக்கள்/இனங்கள் என்ற பொருளையும் காக்கிறது.
- source_word: אֱלִילִים
  choice: சிலைகளே
  rationale: வழிபாட்டுக்குரிய சிலைகளைக் குறிக்கும் நேரடியான தமிழ் சொல்; எபிரெயச் சொல்லிலுள்ள வெறுமை அல்லது மதிப்பின்மை சார்ந்த இகழ்ச்சிநயம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: וַיהוָה
  choice: ஆனால் யாவே
  rationale: וְ இங்கு பொய்த் தெய்வங்களுக்கும் படைப்பாளரான யாவேக்கும் இடையிலான வலுவான எதிர்மறை ஒப்புமையைச் சுட்டுகிறது; יהוה என்ற தனிப்பெயர் ஒலிபெயர்க்கப்படுகிறது.
- source_word: שָׁמַיִם
  choice: வானங்களை
  rationale: எபிரெயப் பன்மை வடிவத்தைத் தமிழ் பன்மையால் காக்கிறது.
- source_word: עָשָׂה
  choice: உண்டாக்கினார்
  rationale: עשה என்பதன் பொதுவான ‘செய்/உண்டாக்கு’ பொருளைத் தருகிறது; மூலத்தில் இல்லாத குறிப்பான ‘படைத்தார்’ என்ற வினையைத் திணிக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் இறைவனின் தனிப்பெயரான יהוה நேரடியாக உள்ளது; பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- issue: אֱלִילִים என்பதிலுள்ள இகழ்ச்சிநயம்
  choice: முதன்மை உரையில் ‘சிலைகள்’; மதிப்பின்மை நயம் அடிக்குறிப்பில்
  alternative: பயனற்ற சிலைகள் / வெறும் பொருட்கள்
  rationale: சொல்லின் அடிப்படை குறிப்பு மற்றும் இகழ்ச்சிநயம் இரண்டையும் காக்கிறது; முதன்மை உரையில் பொருளை அளவுக்கு மீறி விளக்கவில்லை.
