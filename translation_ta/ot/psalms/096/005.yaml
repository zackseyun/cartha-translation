  register: நவீன தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடன் அமைக்கப்பட்டது. ‘மக்களினங்கள்’ என்பது עַמִּים என்பதன் மக்கள்/தேசங்கள் என்ற கூட்டுப் பொருளை இயல்பாக எடுத்துரைக்கிறது; ‘ஆனால்’ இரு அரையடிகளின் கூரிய இறையியல் எதிர்மறை ஒப்புமையை வெளிப்படுத்துகிறது.
