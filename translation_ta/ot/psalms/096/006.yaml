  text: הוֹד וְ/הָדָ֥ר לְ/פָנָ֑י/ו עֹ֥ז וְ֝/תִפְאֶ֗רֶת בְּ/מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/006.yaml
  text: Splendor and majesty are before him[a]; strength and beauty are in his sanctuary.
translation:
  language: ta
  text: மாட்சியும் மகத்துவமும் அவருக்கு முன்பாக இருக்கின்றன; வல்லமையும் அழகும் அவரது பரிசுத்த இடத்தில் இருக்கின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவரது பரிசுத்த இடத்தில் வல்லமையும் மகிமையும் இருக்கின்றன’ என்றும் மொழிபெயர்க்கலாம். תִפְאֶרֶת என்ற எபிரெயச் சொல் ‘மகிமை’ அல்லது ‘பொலிவு’ என்றும் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: மாட்சி
  rationale: அரசருக்குரிய மேன்மையையும் கண்கவர் சிறப்பையும் குறிக்கும் சொல்லாக, הָדָר என்பதிலிருந்து வேறுபடுத்தி இயல்பான கவிதை நடையில் தருகிறது.
- source_word: הָדָר
  choice: மகத்துவம்
  rationale: மேன்மை, கம்பீரம், அரசருக்குரிய உயர்வு ஆகிய உணர்வுகளைத் தந்து, הוֹד உடனான இணைச்சொல் அமைப்பைப் பாதுகாக்கிறது.
- source_word: לְפָנָיו
  choice: அவருக்கு முன்பாக
  rationale: எபிரெயச் சொற்றொடரின் இடம் மற்றும் சந்நிதி சார்ந்த உருவகத்தை விளக்கமாக மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: עֹז
  choice: வல்லமை
  rationale: பலத்தையும் ஆற்றலையும் குறிக்கும் עֹז என்பதற்கு, உயர்நடைப் பாடல் சூழலில் இயல்பான தமிழ்ச் சொல்.
- source_word: תִפְאֶרֶת
  choice: அழகு
  rationale: இச்சொல்லுக்குள்ள அழகு, மகிமை, பொலிவு ஆகிய பொருள் வாய்ப்புகளில், עֹז உடன் அமைந்த கவிதை இணைப்பையும் முதல் அடியின் சொற்களிலிருந்து வேறுபாட்டையும் பாதுகாக்கிறது.
- source_word: בְּמִקְדָּשׁוֹ
  choice: அவரது பரிசுத்த இடத்தில்
  rationale: מִקְדָּשׁ என்பதன் பரந்த ‘புனித/பரிசுத்த இடம்’ என்ற பொருளைப் பாதுகாத்து, குறிப்பாக ஆலயக் கட்டடம் என்று தேவையின்றி வரையறுக்காமல் விடுகிறது.
theological_decisions:
- issue: ‘அவர்’, ‘அவரது’ என்ற சுட்டுப்பெயர்களின் குறிப்பு
  choice: சங்கீதத்தின் சூழலில் அவை கர்த்தரைக் குறிக்கின்றன; இருப்பினும் மூலத்தின் சுட்டுப்பெயர் வடிவமே மொழிபெயர்ப்பில் வைக்கப்பட்டது.
  alternative: சுட்டுப்பெயர்களுக்குப் பதிலாக ‘கர்த்தர்’, ‘கர்த்தருடைய’ என்று வெளிப்படையாகக் குறிப்பிடுதல்.
  rationale: உடனடி சூழல் கர்த்தரையே குறித்தாலும், இந்த வசனத்தில் இறைப்பெயரைச் சேர்க்காமல் இருப்பது எபிரெயக் கவிதை ஓட்டத்தையும் மூலத்தின் வடிவத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டு வாசிப்புக்கேற்ற கண்ணியமான கவிதை நடை. ‘மாட்சி/மகத்துவம்’ மற்றும் ‘வல்லமை/அழகு’ என்ற இணைகள் மூலத்தின் கவிதைச் சமநிலையைப் பாதுகாக்கின்றன; ‘பரிசுத்த இடம்’ என்பது ‘ஆலயம்’ என்பதைக் காட்டிலும் மூலச்சொல்லின் பொருள் பரப்பைத் திறந்தவையாக வைத்திருக்கிறது.
