  yaml_path: translation/ot/psalms/096/012.yaml
  text: Let the field exult[a], and all that is in it; then all the trees of the forest will sing for joy.
translation:
  language: ta
  text: வயல்வெளியும் அதிலுள்ள அனைத்தும் மகிழ்ந்து களிகூரட்டும்; அப்போது காட்டிலுள்ள மரங்களெல்லாம் மகிழ்ச்சியுடன் முழங்கும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மகிழ்ச்சியுடன் பாடும்.’ எபிரெய வினை மகிழ்ச்சியின் ஒலிமிக்க கூக்குரலையோ பாடலையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֹז
  choice: மகிழ்ந்து களிகூரட்டும்
  rationale: வினையின் விருப்பம் அல்லது அழைப்பைக் குறிக்கும் ஆற்றலையும் தீவிரமான மகிழ்ச்சியையும் இயல்பான கவித்துவத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שָׂדַי
  choice: வயல்வெளி
  rationale: ஒருமை வடிவில் இருந்தாலும் கூட்டுப் பொருளில் வரும் திறந்த வயற்பரப்பை இயல்பாகக் குறிக்கிறது.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: அதிலுள்ள அனைத்தும்
  rationale: வயல்வெளிக்குள் உள்ள யாவற்றையும் உள்ளடக்கும் எபிரெயச் சொற்றொடரின் முழுமைப் பொருளைப் பாதுகாக்கிறது.
- source_word: אָז
  choice: அப்போது
  rationale: அடுத்த கவித்துவ நகர்வையும் நிகழ்வுகளின் தொடர்ச்சியையும் சுருக்கமாகக் காட்டுகிறது.
- source_word: יְרַנְּנוּ
  choice: மகிழ்ச்சியுடன் முழங்கும்
  rationale: எபிரெய வினை மகிழ்ச்சியின் ஒலிமிக்க கூக்குரல் அல்லது பாடலைக் குறிக்கலாம்; மரங்களின் கவித்துவ ஆளுருவாக்கத்திற்கு ‘முழங்கும்’ இயல்பாகப் பொருந்தி, அந்த ஒலிமிக்க தன்மையையும் காக்கிறது.
- source_word: כָּל עֲצֵי יָעַר
  choice: காட்டிலுள்ள மரங்களெல்லாம்
  rationale: כָּל என்பதன் முழுமையையும் காடு முழுவதும் புகழ்ச்சியில் கலக்கும் படிமத்தையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: படைப்பு மகிழ்ந்து துதிப்பதாகச் சித்தரிக்கப்படுதல்
  choice: மனிதரல்லாத படைப்பும் நேரடியாக மகிழ்ந்து முழங்குவதாக வரும் கவித்துவ ஆளுருவாக்கத்தை அப்படியே வைத்தல்
  alternative: இயற்கையின் அழகு அல்லது செழிப்பைப் பற்றிய உருவக விளக்கமாக மாற்றுதல்
  rationale: சங்கீதம் வயல்வெளியையும் மரங்களையும் மகிழ்ச்சியான பதிலில் பங்கேற்பவையாக நேரடியாகச் சித்தரிக்கிறது; அதை விளக்கவுரையாக மாற்றாமல் வைத்திருப்பது படைப்பு முழுவதும் துதிப்பதில் பங்குபெறும் பரப்பை காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, வாசிக்க எளிய, அதே நேரத்தில் கண்ணியமான கவித்துவத் தமிழ். முதல் வினையில் அழைப்பு/விருப்ப ஆற்றலும், இரண்டாவது வினையில் எதிர்கால நகர்வும் வேறுபடுத்தப்பட்டுள்ளன; படைப்பின் ஆளுருவாக்கம் நேரடியாகப் பாதுகாக்கப்பட்டுள்ளது.
