source:
  edition: WLC
  text: סַפְּר֣וּ בַ/גּוֹיִ֣ם כְּבוֹד֑/וֹ בְּ/כָל הָֽ֝/עַמִּ֗ים נִפְלְאוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/003.yaml
  text: Declare his glory among the nations[a], his wondrous deeds among all the peoples.
translation:
  language: ta
  text: தேசங்களிடையே அவருடைய மகிமையையும், எல்லா மக்களிடையே அவருடைய வியத்தகு செயல்களையும்[a] அறிவியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய அதிசயங்களை’ அல்லது ‘அவருடைய அற்புதமான செயல்களை’.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַפְּרוּ
  choice: அறிவியுங்கள்
  rationale: פיעל கட்டளையின் பன்மை வடிவம்; பொதுவாக எடுத்துரைத்துப் பிரகடனம் செய்யும் அழைப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַגּוֹיִם
  choice: தேசங்களிடையே
  rationale: גּוֹיִם என்பதன் விரிவான பன்னாட்டு பொருளைப் பாதுகாக்கிறது; இங்கு பிற்கால மத-இனப் பொருளுடைய ‘புறஜாதியார்’ என்பதைத் தவிர்க்கிறது.
- source_word: כְּבוֹדוֹ
  choice: அவருடைய மகிமை
  rationale: כָּבוֹד குறிக்கும் கனமிக்க மேன்மை, மாட்சி, ஒளிமை ஆகியவற்றைத் துதிப்பாடல் சூழலில் ‘மகிமை’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: בְּכָל הָעַמִּים
  choice: எல்லா மக்களிடையே
  rationale: עַמִּים என்பதை ‘மக்கள்’ என மொழிபெயர்ப்பது முதல் அடியின் גּוֹיִם (‘தேசங்கள்’) என்பதிலிருந்து உள்ள சொல் வேறுபாட்டையும் கவிதை இணைப்பையும் காக்கிறது.
- source_word: נִפְלְאוֹתָיו
  choice: அவருடைய வியத்தகு செயல்கள்
  rationale: פלא வேரிலிருந்து வரும் இச்சொல் வியப்பை எழுப்பும் அசாதாரண செயல்களைக் குறிக்கிறது; ‘வியத்தகு செயல்கள்’ அதன் அற்புதத் தன்மையையும் செயல் சார்ந்த பொருளையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அறிவிப்பின் உலகளாவிய பரப்பு
  choice: ஆண்டவருடைய மகிமையும் செயல்களும் தேசங்களிடையேயும் எல்லா மக்களிடையேயும் அறிவிக்கப்பட வேண்டும் என்ற விரிவான கட்டளையாக மொழிபெயர்க்கப்பட்டது.
  alternative: இஸ்ரவேலின் உடனடி அண்டைத் தேசங்களுக்கு மட்டுமே முதன்மையாக உரிய குறுகிய குறிப்பு.
  rationale: גּוֹיִם மற்றும் כָּל הָעַמִּים என்ற இணைச் சொற்றொடர்கள் பரந்த பன்னாட்டு பரப்பை வலியுறுத்துகின்றன. வசனத்தில் வெளிப்படையாக இல்லாத பிற்கால இறையியல் வடிவங்களைச் சேர்க்காமல் அந்தப் பரப்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், துதிப்பாடலுக்குரிய கண்ணியமான கட்டளைத் தொனியுடனும் அமைக்கப்பட்டது. எபிரெயக் கவிதையின் ‘தேசங்கள் / மக்கள்’ என்ற இணைவேறுபாடும் ஒரே கட்டளை வினை இரு கூறுகளையும் ஆளும் அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
