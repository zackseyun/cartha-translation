  text: before Yahweh[a], for he is coming, for he is coming to judge the earth. He will judge the world with righteousness[c][b], and the peoples with his faithfulness.
translation:
  language: ta
  text: யாவேவின் முன்னிலையில்; ஏனெனில் அவர் வருகிறார், பூமியை நியாயந்தீர்க்க அவர் வருகிறார். அவர் உலகத்தை நீதியோடு நியாயந்தீர்ப்பார்; மக்களைத் தம் நம்பகத்தன்மையோடு நியாயந்தீர்ப்பார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: פָּנִים என்பதுடன் வரும் לְ என்ற சொல்லிணைவு ‘முன்பாக’ அல்லது ‘சந்நிதியில்’ என்று பொருள்படும். இங்கு ‘முன்பாக’ என்பது சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், அதன் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: כִּי בָא ... כִּי בָא
  choice: ஏனெனில் அவர் வருகிறார், அவர் வருகிறார்
  rationale: கவிதைச் சூழலில் בוא என்பதன் வடிவம் நிச்சயமாகவும் நெருங்கியும் நிகழவிருக்கும் வருகையை உயிரோட்டமாக அறிவிக்கிறது. வலியுறுத்தும் மறுபதிப்பு அப்படியே காக்கப்பட்டுள்ளது.
- source_word: לִשְׁפֹּט / יִשְׁפֹּט
  choice: நியாயந்தீர்க்க / நியாயந்தீர்ப்பார்
  rationale: שׁפט ஆட்சி செய்வதையும் குறிக்கக்கூடும்; ஆனால் நீதி மற்றும் உண்மைத்தன்மை குறித்த இணைச்சொற்கள் இங்கு நீதித்தீர்ப்பையே முன்னிறுத்துகின்றன.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: תֵּבֵל என்பதுடன் இணையாக வருவதால், ஒரு குறிப்பிட்ட நாட்டை அல்லாமல் முழுப் பூமியைக் குறிக்கிறது.
- source_word: תֵּבֵל
  choice: உலகம்
  rationale: மக்கள் வாழும் ஒழுங்கமைந்த உலகைக் குறிக்கும் எபிரெயச் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: בְּצֶדֶק
  choice: நீதியுடன்
  rationale: צֶדֶק குறிக்கும் நேர்மையான, நீதியான தரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְעַמִּים
  choice: மக்களினங்கள்
  rationale: பன்மையில் உள்ள עַמִּים பல்வேறு மக்கள் குழுக்களைக் குறிக்கிறது; ‘மக்களினங்கள்’ அந்தப் பன்மைத்தன்மையைத் தெளிவாகக் காக்கிறது.
- source_word: בֶּאֱמוּנָתוֹ
  choice: தமது உண்மைத்தன்மையுடன்
  rationale: אֱמוּנָה உறுதிப்பாடு, நம்பகத்தன்மை, மாறாத உண்மை ஆகிய பொருள்களைத் தருகிறது. ‘உண்மைத்தன்மை’ என்பது அவர் நம்பத்தகுந்த விதத்தில் தீர்ப்பளிப்பதை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கவிதைச் சூழலில் இறைவனின் தீர்ப்பின் தன்மை
  choice: ‘நியாயந்தீர்ப்பார்’ என்ற சொல் தக்கவைக்கப்பட்டது.
  alternative: ‘ஆட்சிசெய்வார்’ என்று மொழிபெயர்த்தல் அல்லது இறுதித் தீர்ப்பைப் பற்றிய விரிவான விளக்கத்தை மொழிபெயர்ப்புக்குள் சேர்த்தல்.
  rationale: இந்த வசனம் உலகளாவிய நீதித்தீர்ப்பை அறிவிக்கிறது; ஆனாலும் எபிரெய உரை கூறுவதைக் கடந்த இறுதிக்காலக் கோட்பாட்டு விளக்கம் சேர்க்கப்படவில்லை.
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையிலுள்ள தனிப்பட்ட தெய்வீகப் பெயரை ஒரு பொதுப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துக் காக்கிறது.
- issue: אֱמוּנָה என்பதன் பொருள் நிழல்கள்
  choice: உண்மைத்தன்மை
  alternative: உண்மை; நம்பகத்தன்மை
  rationale: இறைவனின் தீர்ப்பு அவரது உறுதியான, நம்பத்தகுந்த குணத்துடன் ஒத்திருப்பதை முதன்மை உரை வெளிப்படுத்துகிறது; ‘உண்மை’ என்ற சாத்தியமும் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் வலியுறுத்தும் மறுபதிப்பும், ‘உலகம் / மக்களினங்கள்’ என்ற இணை அமைப்பும் காக்கப்பட்டுள்ளன. ‘நியாயந்தீர்த்தல்’ என்பது ஆட்சியும் நீதித் தீர்ப்பும் கொண்ட எபிரெயச் சொல்லின் இச்சூழலுக்குரிய நீதிசார் வலிமையைத் தருகிறது.
