  rationale: ישׁועה இரட்சிப்பு, விடுதலை, மீட்பு ஆகிய பொருள் பரப்பைக் கொண்டது. இங்கு ‘மீட்பு’ தெளிவான நவீனத் தமிழாகவும் தேவன் நிகழ்த்தும் விடுவிப்பைச் சுட்டுவதாகவும் உள்ளது; உடைமைத் தொடர்பு ‘மீட்பின் நற்செய்தி’ என்று இயல்பாக்கப்பட்டது.
