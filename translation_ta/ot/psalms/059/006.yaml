  yaml_path: translation/ot/psalms/059/006.yaml
  text: They return at evening[c][b][a]; they growl like dogs and go around the city.
translation:
  language: ta
  text: அவர்கள் மாலையில் திரும்பி வருகிறார்கள்; நாய்களைப்போல் உறுமிக்கொண்டு நகரத்தைச் சுற்றித் திரிகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நாய்களைப்போல் ஊளையிட்டுக்கொண்டு நகரத்தைச் சுற்றி வருகிறார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய் வினைச்சொல் உரத்த விலங்கொலியைக் குறிக்கக்கூடும்; மேலும் “சுற்றித் திரிகிறார்கள்” என்பது “சுற்றி வருகிறார்கள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: திரும்பி வருகிறார்கள்
  rationale: שוב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்/மீண்டும் வருதல்’ என்பதையும், இங்கு எதிரிகளின் தொடர்ச்சியான நடமாட்டத்தையும் இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לָעֶרֶב
  choice: மாலையில்
  rationale: ל + עֶרֶב இங்கு காலத்தைக் குறிக்கிறது; ‘மாலையில்’ என்பது நேரடியான, இயல்பான தமிழ்.
- source_word: יֶהֱמוּ
  choice: உறுமிக்கொண்டு
  rationale: המה உரத்த விலங்கொலியை—உறுமுதல் அல்லது ஊளையிடுதல்—குறிக்கலாம். நாய் உவமையின் அச்சுறுத்தும் சூழலில் ‘உறுமுதல்’ பொருத்தமானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כַכָּלֶב
  choice: நாய்களைப்போல்
  rationale: எபிரெயில் ஒருமை வடிவம் பொதுப்படையாகப் பயன்படுத்தப்பட்டுள்ளது. பன்மை எழுவாயுடன் இயல்பான தமிழிலும் கூட்டமாகச் செயல்படும் படிமத்தையும் தருவதற்கும் பன்மை பயன்படுத்தப்படுகிறது.
- source_word: וִיסוֹבְבוּ
  choice: சுற்றித் திரிகிறார்கள்
  rationale: סבב என்பதன் ‘சுற்றுதல், சுற்றிச் செல்லுதல்’ என்ற பொருளைத் தக்கவைத்து, கொள்ளையாடும் நோக்கம் போன்ற கூடுதல் கருத்தைச் சேர்க்காமல் இயல்பான தமிழில் வழங்குகிறது.
- source_word: עִיר
  choice: நகரத்தை
  rationale: எபிரெய் செய்யுளில் சுட்டுருபு இல்லாவிட்டாலும், சூழல் குறிப்பிட்ட நகரத்தைக் காட்டுகிறது; தமிழில் குறிக்கப்பட்ட செயப்படுபொருளாக ‘நகரத்தை’ இயல்பானது.
