  source_fidelity: 'மூல எபிரெயத்தின் தொடர்ச்சியான மூன்று செயல்களும் நம்பகமாகத் தரப்பட்டுள்ளன: மாலையில் திரும்பிவருதல், நாய்களைப் போல உரத்த ஒலி எழுப்புதல், நகரத்தைச் சுற்றிச் செல்லுதல். כַּכָּלֶב என்ற பொதுப்படையான ஒருமை தமிழில் இயல்பாகப் பன்மையான “நாய்களைப்போல்” என வழங்கப்பட்டுள்ளது; இது பொருளை மாற்றுவதில்லை.'
  naturalness: “அவர்கள் மாலையில் திரும்பி வருகிறார்கள்; நாய்களைப்போல் உறுமிக்கொண்டு நகரத்தைச் சுற்றித் திரிகிறார்கள்” என்பது நவீனத் தரமான தமிழில் இயல்பாகவும் செய்யுள்-வசனத் தொனிக்கு ஏற்றதாகவும் உள்ளது. “உறுமிக்கொண்டு” இணைச்செயல் வடிவம் மூலத்தின் தொடர்ச்சியான அச்சுறுத்தும் இயக்கத்தைத் தெளிவாகக் காட்டுகிறது.
