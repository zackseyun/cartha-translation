  text: They wander about for food[a]; if they are not satisfied[b], they spend the night.
translation:
  language: ta
  text: அவர்கள் உணவைத் தேடி அலைகிறார்கள்; திருப்தியடையாவிட்டால், இரவைக் கழிக்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் உறுமுகிறார்கள்.” எபிரெய வினை பொதுவாக “இரவைக் கழித்தல்” அல்லது “தங்குதல்” என்பதைக் குறிக்கிறது. ஆனால் இச்சங்கீதத்தில் வரும் பசியுள்ள நாய்களின் உருவகத்தை முன்னிட்டு சிலர் இதை “உறுமுதல்” எனப் புரிந்துகொள்கிறார்கள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: அவர்கள்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மைத் தனிப்பெயர்; சூழலில் எதிரிகளை இயல்பாகச் சுட்டுகிறது. எபிரெயத்தில் உள்ள வலியுறுத்தலை தமிழில் தனியாக மிகைப்படுத்தத் தேவையில்லை.
- source_word: ינועון
  choice: அலைகிறார்கள்
  rationale: נוּעַ என்பது அங்குமிங்கும் அசைதல் அல்லது சுற்றித்திரிதலைக் குறிக்கிறது; பசியுடன் இரை தேடும் நாய்களின் உருவகத்துக்கு ‘அலைகிறார்கள்’ இயல்பாகப் பொருந்துகிறது.
- source_word: לֶאֱכֹל
  choice: உணவைத் தேடி
  rationale: אָכַל என்பதன் நோக்கத்தைக் குறிக்கும் வினையெச்ச வடிவம் நேரடியாக ‘சாப்பிடுவதற்காக’ எனப் பொருள்படும்; தமிழில் தேடிச் சுற்றும் சூழலைத் தெளிவாக வெளிப்படுத்த ‘உணவைத் தேடி’ என வழங்கப்பட்டது.
- source_word: אִם לֹא יִשְׂבְּעוּ
  choice: திருப்தியடையாவிட்டால்
  rationale: שָׂבַע என்பது உணவால் நிறைவடைதல் அல்லது திருப்தியடைதலைக் குறிக்கிறது; நிபந்தனை அமைப்பைச் சுருக்கமாகவும் இயல்பாகவும் பாதுகாக்கிறது.
- source_word: וַיָּלִינוּ
  choice: இரவெல்லாம் உறுமுகிறார்கள்
  rationale: இந்த வடிவம் ‘இரவைக் கழித்தல்/தங்குதல்’ என்ற לוּן வேருடனும், ‘முணுமுணுத்தல்/உறுமுதல்’ என்ற பொருளுடனும் தொடர்புபடுத்தப்படலாம். சங்கீதம் 59:6,14-இல் வரும் நாய்களின் ஒலி உருவகமும் பசியால் திருப்தியடையாத நிலையும் இங்கு ‘உறுமுகிறார்கள்’ என்பதை வலுப்படுத்துகின்றன; ‘இரவெல்லாம்’ என்பது திரும்பத் திரும்ப வரும் இரவுக்காலக் காட்சியை இயல்பாக இணைக்கிறது.
