  yaml_path: translation/ot/psalms/059/008.yaml
  text: But you[a], O Yahweh, laugh at them; you mock all the nations.
translation:
  language: ta
  text: ஆனால், யாவே, நீர் அவர்களைப் பார்த்துச் சிரிக்கிறீர்; எல்லா நாடுகளையும் ஏளனம் செய்கிறீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: ஆனால் … நீர்
  rationale: இணைப்புச் சொல்லுடன் தனிப்பட்ட பதிலிப்பெயர் வருவது, முந்தைய சூழலுக்கு மாறான திருப்பை வலியுறுத்துகிறது. தமிழில் ‘ஆனால் … நீர்’ என்பது அந்த எதிர்மறைத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர்; அதனால் தமிழில் ஒலிபெயர்த்து ‘யாவே’ என்று வழங்கப்பட்டுள்ளது.
- source_word: תִּשְׂחַק לָמוֹ
  choice: அவர்களைப் பார்த்துச் சிரிக்கிறீர்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருளான ‘சிரி’ என்பதையும், לָמוֹ குறிக்கும் சிரிப்பின் இலக்காகிய ‘அவர்கள்’ என்பதையும் இயல்பான தமிழில் பாதுகாக்கிறது; ‘இகழ்கிறீர்’ என்று பொருளை முன்கூட்டியே தீவிரப்படுத்தவில்லை.
- source_word: תִּלְעַג
  choice: ஏளனம் செய்கிறீர்
  rationale: இவ்வினை கேலி அல்லது இகழ்ச்சியைக் குறிக்கிறது. ‘ஏளனம் செய்கிறீர்’ என்பது தெளிவான, தற்போதைய, கண்ணியமான தமிழில் அதன் வலிமையை வெளிப்படுத்துகிறது.
- source_word: לְ/כָל גּוֹיִם
  choice: எல்லா நாடுகளையும்
  rationale: גּוֹיִם இங்கு இனப் புறஜாதியாருக்கான பிற்காலத் தொழில்நுட்பச் சொல்லாக அல்லாமல், பரந்த பொருளில் நாடுகளைக் குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. பட்டப்பெயரால் மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையும் பொதுவாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. இறைவனை நோக்கி மரியாதைப் பன்மையான ‘நீர்/சிரிக்கிறீர்/செய்கிறீர்’ வடிவங்கள் வழங்கப்பட்டுள்ளன.
