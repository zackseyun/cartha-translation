  yaml_path: translation/ot/psalms/059/012.yaml
  text: The sin of their mouth is the word of their lips[a]; let them be caught in their pride[b], because of the curse and the lie that they tell.
translation:
  language: ta
  text: 'அவர்களுடைய வாயின் பாவம்

    அவர்களுடைய உதடுகளின் வார்த்தையே;

    அவர்கள் தங்கள் அகந்தையில்,

    அவர்கள் சொல்லும் சாபத்தினாலும் பொய்யினாலும் சிக்கிக்கொள்ளட்டும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַטַּאת
  choice: பாவம்
  rationale: இங்கு சடங்குசார் ‘பாவநிவாரணப் பலி’ அல்ல, வாய்மொழியில் வெளிப்படும் ஒழுக்கக் குற்றத்தையே குறிக்கிறது.
- source_word: פִּימוֹ
  choice: அவர்களுடைய வாய்
  rationale: எபிரெயச் சொல்லின் ஒருமை வடிவத்தையும், ஒரு குழுவினரைக் கூட்டாகக் குறிக்கும் கவித்துவப் பயன்பாட்டையும் காக்கிறது.
- source_word: דְּבַר שְׂפָתֵימוֹ
  choice: அவர்களுடைய உதடுகளின் வார்த்தை
  rationale: ‘வாய்—உதடுகள்’ என்ற இணை உருவகத்தையும் மூலத்தின் கவித்துவமான உடற்பாக மொழியையும் நேரடியாகப் பேணுகிறது.
- source_word: וְיִלָּכְדוּ
  choice: சிக்கிக்கொள்ளட்டும்
  rationale: இச்சூழலில் இந்தச் செயல்வடிவம் வேண்டுதல் அல்லது சாபவாக்கிய வலிமையுடையது; தமிழ் வியங்கோள் வடிவம் அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בִגְאוֹנָם
  choice: தங்கள் அகந்தையில்
  rationale: גאון இங்கு செருக்கான சுயமேன்மையைக் குறிக்கிறது. בְ முன்னிடைச்சொல்லின் ‘அதில்/அதற்குள்’ என்ற நிழலையும், அவர்களுடைய அகந்தையே அவர்கள் சிக்கிக்கொள்ளும் களமாக இருப்பதையும் இத்தேர்வு காக்கிறது.
- source_word: מֵאָלָה
  choice: சாபத்தினாலும்
  rationale: מִן முன்னிடைச்சொல் இங்கு காரணத்தைக் குறிக்கிறது; கருவி/காரண வேற்றுமை வடிவம் ‘அவர்கள் சொல்லும் சாபத்தின் காரணமாக’ என்ற பொருளைச் சுருக்கமாகத் தருகிறது.
- source_word: מִכַּחַשׁ
  choice: பொய்யினாலும்
  rationale: כחש என்பது பொய் அல்லது வஞ்சகத்தைக் குறிக்கும்; ‘பொய்’ எளிமையாகவும் இணைச்சொல்லான ‘சாபம்’ என்பதோடு இயல்பாகவும் அமைகிறது.
- source_word: יְסַפֵּרוּ
  choice: அவர்கள் சொல்லும்
  rationale: ספר என்பதன் அடிப்படைப் பொருள் ‘எடுத்துரைத்தல்/சொல்லுதல்’; இங்கு தொடர்ந்து உச்சரிக்கப்படும் சாபத்தையும் பொய்யையும் இயல்பாகக் குறிக்க ‘சொல்லும்’ பொருத்தமானது.
theological_decisions:
- issue: முதல் அரையடியின் வாக்கிய அமைப்பும் இறுதி காரணத் தொடரின் இணைப்பும்
  choice: ‘வாயின் பாவம்’ என்பதை ‘உதடுகளின் வார்த்தை’ என அடையாளப்படுத்தி, சாபமும் பொய்யும் அவர்கள் சிக்குவதற்கான காரணங்களாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்களுடைய வாயின் பாவத்திற்காக—அவர்களுடைய உதடுகளின் வார்த்தைக்காக—அவர்கள் தங்கள் அகந்தையில் சிக்கிக்கொள்ளட்டும்; அவர்கள் சொல்லும் சாபத்திற்காகவும் பொய்க்காகவும் [சிக்கிக்கொள்ளட்டும்]’ என்று முழுத் தொடரையும் காரணத் தொடர்களாக அமைக்கலாம்.
  rationale: எபிரெய மூலத்தில் இணைப்புச் சொல் இல்லாத பெயர்த்தொடர்கள் இருப்பதால் இரு பகுப்புகளும் இலக்கணரீதியாகச் சாத்தியம். முதன்மை உரை இயல்பான அடையாள வாக்கிய வாசிப்பைப் பின்பற்றுகிறது; அடிக்குறிப்பு மாற்று தொடரமைப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடையில் அமைக்கப்பட்டது. ‘வாய்—உதடுகள்’ என்ற எபிரெய இணை உருவகம் காக்கப்பட்டுள்ளது. ‘அகந்தை’ என்பது பொதுவாகப் புரியும் தற்போதைய சொல்; ‘சிக்கிக்கொள்ளட்டும்’ வேண்டுதல்/நியாயத்தீர்ப்பு வலிமையை இயல்பாக வெளிப்படுத்துகிறது.
