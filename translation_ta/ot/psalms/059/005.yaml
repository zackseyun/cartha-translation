  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
translation:
  language: ta
  text: ஆனால் நீரோ, படைகளின் தேவனாகிய யாவே, இஸ்ரவேலின் தேவனே, எல்லா நாடுகளையும் தண்டிக்க[a] விழித்தெழும்; தீமைசெய்யும் துரோகிகள் எவர்மேலும் தயவு காட்டாதிரும்.[b] சேலா.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எல்லா நாடுகளையும் பார்வையிட” அல்லது “கணக்குக் கேட்க.” எபிரேய வினைச்சொல் פקד சூழலுக்கேற்ப பார்வையிடுதல், கவனித்தல், கணக்குக் கேட்டல் அல்லது தண்டித்தல் எனப் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “இரக்கம் காட்டாதிரும்.” எபிரேய வினைச்சொல் חנן என்பதன் நேரடிப் பொருள் “தயவு காட்டுதல்” அல்லது “அருள்புரிதல்.”
    reason: lexical_alternative
  - marker: c
    text: “சேலா” என்பது இசை அல்லது வழிபாட்டு நிகழ்த்தலுக்கான ஒரு குறியீடாக இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரை எபிரேய உச்சரிப்புக்கு நெருக்கமான தமிழெழுத்துப் பெயர்ப்பாக வழங்குகிறது; பொதுப்பட்டப் பெயராக மாற்றவில்லை.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: படைகளின் தேவன்
  rationale: צְבָאוֹת என்பதன் படைகள்/சேனைகள் என்ற அடிப்படைப் பொருளை நவீனத் தமிழில் தெளிவாகக் காக்கிறது; அவை மனிதப் படைகளா விண்ணுலகப் படைகளா என்பதைத் தேவையின்றி வரையறுக்கவில்லை.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் தேவன்
  rationale: எபிரேய இணைப்புத் தொடரையும் உடன்படிக்கை சார்ந்த பட்டத்தையும் நேரடியாகக் காக்கிறது.
- source_word: הָקִיצָה
  choice: விழித்தெழும்
  rationale: தேவன் உறக்கத்திலிருந்து எழுவதுபோன்ற சங்கீத உருவகத்தைச் செயற்படு போன்ற பொதுவான சொல்லால் தட்டையாக்காமல் காக்கிறது; வேண்டுதல் சார்ந்த மரியாதை ஒருமை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: לִפְקֹד
  choice: தண்டிக்க
  rationale: פקד என்பதற்கு சந்திக்க, கவனிக்க, கணக்குக் கேட்க, தண்டிக்க ஆகிய பொருட்கள் உண்டு. நாடுகள்மீதான நியாயத்தீர்ப்பும் தொடர்ந்து வரும் தயவு காட்டாதீர் என்ற வேண்டுதலும் இங்கு ‘தண்டிக்க’ என்பதைச் சூழலுக்கு ஏற்றதாக்குகின்றன; விரிவான பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: כָּל הַגּוֹיִם
  choice: எல்லா நாடுகளையும்
  rationale: גּוֹיִם என்பதன் அரசியல்-மக்கள் கூட்டப் பொருளை வழங்குகிறது; பிற்கால யூதர்/புறவினர் வேறுபாட்டை வசனத்திற்குள் இறக்குமதி செய்யவில்லை.
- source_word: אַל תָּחֹן
  choice: தயவு காட்டாதேயும்
  rationale: חנן என்பதன் தயவு அல்லது அருள் காட்டுதல் என்ற பொருளை இயல்பான தமிழில் தருகிறது; ‘இரக்கம் காட்டாதீர்’ என்ற சாத்தியமான நிழற்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בֹּגְדֵי אָוֶן
  choice: தீமைசெய்யும் துரோகிகள்
  rationale: בגד கூறும் நம்பிக்கைத் துரோகத்தையும் און கூறும் தீமை/அக்கிரமத்தையும் சுருக்கமான, இயல்பான தமிழில் ஒன்றாகக் காக்கிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியாகத் தெரியாததால் விளக்கிப் பெயர்க்காமல் தமிழெழுத்தில் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: சாப வேண்டுதல் சூழலில் כָּל הַגּוֹיִם என்பதன் பரப்பு
  choice: எல்லா நாடுகளையும்
  alternative: புறவினர் அனைவரையும்
  rationale: இவ்வசனம் பகைமை கொண்ட மக்கள் கூட்டங்கள்மீது தேவனுடைய நியாயத்தீர்ப்பை விரிவாக வேண்டுகிறது. ‘புறவினர்’ என்பது பிற்கால இன-சமய எதிர்மறை வேறுபாட்டை வலுப்படுத்தக்கூடும்; ‘நாடுகள்’ மூலத்தின் கூட்டரசியல் பொருளையும் வசனத்தின் பதற்றத்தையும் காக்கிறது.
- issue: פקד என்பதிலுள்ள வருகை/கணக்குக் கேட்டல்/தண்டனை என்ற தெளிவின்மை
  choice: முதன்மை உரையில் ‘தண்டிக்க’; அடிக்குறிப்பில் ‘விசாரிக்க அல்லது கணக்குக் கேட்க’
  alternative: எல்லா நாடுகளையும் விசாரிக்க
  rationale: அடுத்த வேண்டுதலான ‘தயவு காட்டாதேயும்’ நியாயத்தீர்ப்பின் தண்டனைத் திசையை ஆதரிக்கிறது. ஆயினும் வினைச்சொல்லின் விரிவான பொருளை அடிக்குறிப்பு வழியாக மறைக்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையும் சங்கீதத்தின் நேரடி வேண்டுதல் வலிமையும் இணையும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘விழித்தெழும்’, ‘காட்டாதேயும்’ ஆகியவை புரிந்துகொள்ளக்கூடிய மரியாதை ஒருமை வேண்டுதல் வடிவங்கள். பழமையான ‘சேனைகள்’ என்பதற்குப் பதிலாக மூலத்தின் படைச்சார்ந்த பரப்பைத் தெளிவாகக் காட்ட ‘படைகள்’ தேர்ந்தெடுக்கப்பட்டது.
