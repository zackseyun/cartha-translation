  yaml_path: translation/ot/psalms/059/001.yaml
  text: Deliver me from my enemies[a], my God[b]; set me on high above those who rise up against me.
translation:
  language: ta
  text: என் இறைவனே, என் பகைவர்களிடமிருந்து என்னை விடுவித்தருளும்; எனக்கு எதிராக எழுகிறவர்களுக்கு எட்டாத உயரத்தில் என்னை வைத்தருளும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு எதிராக எழுகிறவர்களிடமிருந்து என்னைப் பாதுகாத்தருளும்.” எபிரெய வினை, எட்ட முடியாத உயரமான இடத்தில் ஒருவரை வைப்பதையும் அதனால் அவரைப் பாதுகாப்பதையும் குறிக்கலாம்.
