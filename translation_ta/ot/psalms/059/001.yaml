lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: என்னை விடுவித்தருளும்
  rationale: נצל என்பதன் ஹிஃபில் கட்டளை வடிவம் ஆபத்திலிருந்து விடுவிக்கும்படி வேண்டுவதைக் குறிக்கிறது. ‘விடுவித்தருளும்’ என்பது மீட்புக்கான மன்றாட்டை இயல்பாகவும் கண்ணியமாகவும் வெளிப்படுத்துகிறது; தேவையற்ற கோட்பாட்டுச் சுமையையும் சேர்ப்பதில்லை.
- source_word: מֵאֹיְבַי
  choice: என் பகைவர்களிடமிருந்து
  rationale: אֹיֵב என்பதன் வழக்கமான பொருள் ‘பகைவன்’; מִן பிரிவை அல்லது ஒருவரிடமிருந்து தப்புவிப்பதைச் சுட்டுகிறது.
- source_word: אֱלֹהָי
  choice: என் இறைவனே
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் வரும் நேரடி அழைப்பு. நவீனத் தமிழில் இயல்பான விளிவடிவில் மொழிபெயர்க்கப்பட்டது.
- source_word: מִּמִתְקוֹמְמַי
  choice: எனக்கு எதிராக எழுகிறவர்களுக்கு
  rationale: קום வேரிலிருந்து வந்த இவ்வடிவம் சங்கீதக்காரருக்கு எதிராகத் தங்களை நிறுத்துகிறவர்களைக் குறிக்கிறது. அடுத்த வினையின் உயரமான, எட்டாத இடம் என்ற உருவகத்துடன் தமிழில் ‘அவர்களுக்கு எட்டாத’ என்று இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: תְּשַׂגְּבֵנִי
  choice: எட்டாத உயரத்தில் என்னை வைத்தருளும்
  rationale: שׂגב என்பதன் பியேல் வடிவம் ஒருவரை உயரத்தில் வைத்து அணுக முடியாதவராக்குதல், அதனால் பாதுகாத்தல் என்ற பொருளைக் கொண்டுள்ளது. தமிழாக்கம் உயரத்தின் உருவகத்தையும் அதன் பாதுகாப்புப் பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: אֱלֹהָי என்ற தெய்வீக அழைப்பின் மொழிபெயர்ப்பு
  choice: என் இறைவனே
  alternative: என் தேவனே
  rationale: தனிப்பட்ட உடைமையையும் நேரடி மன்றாட்டையும் எளிமையாகத் தக்கவைக்கிறது. எந்தத் தனிப்பிரிவின் கோட்பாட்டுச் சொல்லாட்சியையும் சேர்க்கவில்லை.
- issue: שׂגב என்ற வினையில் உயர்த்துதல் மற்றும் பாதுகாத்தல் ஆகிய பொருட்களின் தொடர்பு
  choice: எட்டாத உயரத்தில் என்னை வைத்தருளும்
  alternative: என்னைப் பாதுகாத்தருளும்
  rationale: மூல எபிரெயத்தின் உயரமான, அணுக முடியாத இடம் என்ற concrete உருவகத்தை முதன்மை உரை தக்கவைக்கிறது; பாதுகாப்பு என்பது அந்த உருவகத்தின் இயல்பான விளைவு. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத மன்றாட்டுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அருளும்’ துணைவினை வேண்டுகோளின் மரியாதைத் தொனியைத் தருகிறது. எபிரெயத்தில் உள்ள உயரமான, அணுக முடியாத பாதுகாப்பிடம் என்ற கவித்துவ உருவகம் நேரடியாகப் பேணப்பட்டுள்ளது.
