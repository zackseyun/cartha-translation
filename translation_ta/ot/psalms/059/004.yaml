  yaml_path: translation/ot/psalms/059/004.yaml
  text: Without guilt[a], they run and set themselves in place; awake to meet me and see.
translation:
  language: ta
  text: நான் எந்தக் குற்றமும் செய்யாதபோதும், அவர்கள் ஓடி நிலைகொள்கிறார்கள்[a]; விழித்தெழுந்து, என்னைச் சந்தித்து, பாரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் விரைந்து ஓடி தங்களை ஆயத்தப்படுத்துகிறார்கள்.” இரண்டாவது வினைச்சொல், தங்களை நிலைநிறுத்திக்கொள்வதையோ செயலுக்குத் தயாராவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלִי עָוֺן
  choice: நான் எந்தக் குற்றமும் செய்யாதபோதும்
  rationale: இச்சூழலில் சங்கீதக்காரர் தம்மிடம் குற்றம் இல்லையென்று முறையிடுகிறார். எபிரெய மொழியின் சுருக்கமான தொடரில் மறைந்துள்ள முதலாம் நபர் தொடர்பைத் தமிழில் இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: יְרוּצוּן
  choice: அவர்கள் ஓடிவந்து
  rationale: רוץ என்பதன் ஓடுதல் அல்லது விரைதல் என்ற உயிரோட்டமான படிமத்தைப் பேணுகிறது; அடுத்த செயலை நோக்கி அவர்கள் வருவதையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: וְיִכּוֹנָנוּ
  choice: நிலைகொள்கிறார்கள்
  rationale: כון என்பதன் தங்களை நிலைநிறுத்துதல் அல்லது ஒரு செயலுக்குத் தயாராதல் என்ற பொருள் வீச்சை, தாக்குதலை வெளிப்படையாகச் சேர்க்காமல், சுருக்கமாகப் பேணுகிறது.
- source_word: עוּרָה
  choice: விழித்தெழுந்து
  rationale: தேவனை நோக்கிய மானுடப் படிமமுள்ள கட்டளையை நீக்காமல் வைத்திருக்கிறது; சொல்லர்த்தமான உறக்கத்தை வலியுறுத்தாமல் செயல்படுமாறு வேண்டுகிற கவித்துவத்தைத் தருகிறது.
- source_word: לִקְרָאתִי
  choice: என்னைச் சந்திக்க
  rationale: எபிரெய மரபுத்தொடரின் நேரான பொருளைப் பேணுகிறது; உதவிக்கு வருதல் என்ற சூழல்பொருளை வாசகர் உணர இடமளிக்கிறது.
- source_word: וּרְאֵה
  choice: பாரும்
  rationale: ראה என்ற கட்டளையின் சுருக்கத்தையும் வேண்டுதல் நடையையும் இயல்பான, கண்ணியமான தமிழில் தருகிறது.
theological_decisions:
- issue: தேவனை நோக்கி கூறப்படும் மானுடப் படிமமுள்ள ‘விழித்தெழு’ என்ற கட்டளை
  choice: ‘விழித்தெழுந்து’ என்ற படிமத்தைத் தக்கவைத்தல்
  alternative: ‘எழுந்து செயல்படும்’ அல்லது ‘உம்மைத் தூண்டிக்கொள்ளும்’ என்று விளக்கமாக மாற்றுதல்
  rationale: புலம்பல் வேண்டுதலின் கவித்துவ வலிமையையும், தேவன் தலையிட வேண்டுமென்ற அவசரத்தையும் இது பேணுகிறது; தேவன் உண்மையில் உறங்குகிறார் என்று உரை தீர்மானிப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நிலைகொள்கிறார்கள்’ என்பது மூலத்தின் சுருக்கத்தையும் பொருள் தெளிவின்மையையும் ஓரளவு பேணுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
