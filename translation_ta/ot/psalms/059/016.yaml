source:
  edition: WLC
  text: וַ/אֲנִ֤י אָשִׁ֣יר עֻזֶּ/ךָ֮ וַ/אֲרַנֵּ֥ן לַ/בֹּ֗קֶר חַ֫סְדֶּ֥/ךָ כִּֽי הָיִ֣יתָ מִשְׂגָּ֣ב לִ֑/י וּ֝/מָנ֗וֹס בְּ/י֣וֹם צַר לִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/016.yaml
  text: But I will sing of your strength[a]; I will sing aloud of your steadfast love in the morning, for you have been a stronghold for me[c][b], and a refuge in the day of my distress.
translation:
  language: ta
  text: 'ஆனால் நான் உமது வல்லமையைப் பாடுவேன்;

    காலையில் உமது மாறாத அன்பைக் குறித்து மகிழ்ந்து பாடுவேன்[a].

    ஏனெனில் நீர் எனக்கு அரணாகவும்,

    என் நெருக்கடியின் நாளில் புகலிடமாகவும் இருந்தீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மகிழ்ந்து பாடுவேன்” என்பதற்கு “மகிழ்ச்சியுடன் ஆர்ப்பரிப்பேன்” என்றும் பொருள் கொள்ளலாம்; எபிரெய வினைச்சொல் பாடுவதையும் உரத்த மகிழ்ச்சிக் குரல் எழுப்புவதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நான்
  rationale: முந்தைய வசனங்களில் வரும் பகைவர்களின் நடத்தைக்கு மாறாகச் சங்கீதக்காரரின் தீர்மானத்தைத் தனிப்பட்ட சுட்டுப்பெயருடன் வலியுறுத்துகிறது.
- source_word: אָשִׁיר עֻזֶּךָ
  choice: உமது வல்லமையைப் பாடுவேன்
  rationale: עֹז என்பது இங்கு தேவனுடைய வலிமையான பாதுகாப்பைக் குறிக்கிறது; ‘வல்லமை’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: וַאֲרַנֵּן
  choice: மகிழ்ந்து பாடுவேன்
  rationale: רנן என்பது இசையுடன் கூடிய உரத்த மகிழ்ச்சிக் குரலைக் குறிக்கலாம்; ‘மகிழ்ந்து பாடுவேன்’ அதன் பாடல் மற்றும் களிப்பு ஆகிய இரு அம்சங்களையும் தெரிவிக்கிறது.
- source_word: לַבֹּקֶר
  choice: காலையில்
  rationale: இது காலத்தைக் குறிக்கும் இயல்பான தமிழாக்கம்; சுற்றியுள்ள இரவுப் பின்னணியுடனான வேறுபாட்டையும் தக்கவைக்கிறது.
- source_word: חַסְדֶּךָ
  choice: உமது மாறாத அன்பு
  rationale: חֶסֶד என்பதில் உறுதியான, விசுவாசமுள்ள, உறவுசார் அன்பின் கருத்துகள் அடங்குகின்றன; ‘மாறாத அன்பு’ அவற்றை எளிய நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: הָיִיתָ מִשְׂגָּב לִי
  choice: நீர் எனக்கு அரணாக இருந்தீர்
  rationale: מִשְׂגָּב என்பது உயர்ந்த பாதுகாப்பிடம் அல்லது கோட்டையைக் குறிக்கிறது; ‘அரண்’ சுருக்கமாக அந்தப் பாதுகாப்புப் படிமத்தைத் தருகிறது.
- source_word: וּמָנוֹס
  choice: புகலிடமாகவும்
  rationale: מָנוֹס என்பது ஆபத்திலிருந்து தப்பி அடைக்கலம் புகும் இடம்; ‘புகலிடம்’ அந்தச் சிறப்புப் பொருளைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּיוֹם צַר לִי
  choice: என் நெருக்கடியின் நாளில்
  rationale: எபிரெய மொழியின் ‘நாள்’ என்ற காலப் படிமத்தையும் தனிப்பட்ட துன்ப அனுபவத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: தெய்வீக மீட்பின் சூழலில் חֶסֶד என்பதன் தமிழாக்கம்
  choice: உமது மாறாத அன்பு
  alternative: உமது உடன்படிக்கை அன்பு / உமது இரக்கம்
  rationale: இச்சொல் தேவன் காட்டும் உறுதியான, பற்றுமாறாத நன்மையையும் அன்பையும் குறிக்கிறது. ‘உடன்படிக்கை அன்பு’ என்பது பொருளின் ஒரு பரிமாணத்தை வெளிப்படையாகச் சேர்க்கிறது; ‘இரக்கம்’ அதன் பரப்பைக் குறைக்கலாம். ‘மாறாத அன்பு’ எந்தக் குறிப்பிட்ட சமய மரபின் விளக்கத்தையும் திணிக்காமல் முக்கிய கருத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கும் மரியாதைப் பன்மை வடிவங்கள் (‘உமது’, ‘நீர்’, ‘இருந்தீர்’) தொடர்ச்சியாகப் பேணப்பட்டுள்ளன; இணைவரி அமைப்பும் மூலத்தின் பாதுகாப்புப் படிமங்களும் தக்கவைக்கப்பட்டுள்ளன.
