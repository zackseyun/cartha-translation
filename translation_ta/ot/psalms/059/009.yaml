source:
  edition: WLC
  text: עֻ֭זּ/וֹ אֵלֶ֣י/ךָ אֶשְׁמֹ֑רָה כִּֽי אֱ֝לֹהִ֗ים מִשְׂגַּבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/009.yaml
  text: O my strength[a], I will watch for you[c][b], for God is my stronghold.
translation:
  language: ta
  text: அவனுடைய வலிமை[a]—உம்மை எதிர்நோக்கிக் காத்திருப்பேன்[b]; ஏனெனில், இறைவன் எனது பாதுகாப்பு அரண்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மூலத்தில் நேரடியாக, “அவனுடைய வலிமை.” இவ்வரி இலக்கண ரீதியாகக் கடினமானது. பொதுவான பாரம்பரியப் புரிதல்: “என் வலிமையே, உம்மை நோக்கிக் காத்திருப்பேன்”; சிலர் கடைசி வினையை “பாடுவேன்” என்றும் வாசிக்கின்றனர்.'
    reason: alternative_reading
  - marker: b
    text: “காத்திருப்பேன்” என்பதை “கவனித்திருப்பேன்” அல்லது “காவல் காப்பேன்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזּוֹ
  choice: அவனுடைய வலிமை
  rationale: WLC உயிர்க்குறிப்பின்படி இச்சொல் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியைக் கொண்டதால், அதன் நேரடியான பொருள் ‘அவனுடைய வலிமை.’ எபிரெய வரி இவ்விடத்தில் திடீரெனவும் இலக்கண ரீதியாகச் சிக்கலாகவும் இருப்பதைத் தமிழ் முதன்மை உரை மறைக்கவில்லை; பொதுவான அழைப்புமுறை வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אֵלֶיךָ
  choice: உம்மை எதிர்நோக்கி
  rationale: אֶל என்பது அடிப்படையில் ‘உம்மிடம்/உம்மை நோக்கி’ என்ற திசைப்பொருளைத் தருகிறது. அடுத்துள்ள ‘காவல் காத்தல்’ வினையுடன் இயல்பான தமிழில் நம்பிக்கையுடன் எதிர்பார்த்திருக்கும் மனநிலையை ‘உம்மை எதிர்நோக்கி’ வெளிப்படுத்துகிறது.
- source_word: אֶשְׁמֹרָה
  choice: காத்திருப்பேன்
  rationale: שׁמר என்பதன் அடிப்படைப் பொருள் காத்தல், காவல் செய்தல், கவனித்திருத்தல். இச்சூழலில் எதிர்நோக்கிக் கவனமாகக் காத்திருப்பது பொருத்தமானது; ‘காவல் காப்பேன்’ என்ற நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சங்கீதக்காரர் இறைவனை எதிர்நோக்கிக் காத்திருப்பதற்கான காரணத்தை இவ்விணைப்புச்சொல் அறிமுகப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: இறைவன்
  rationale: இஸ்ரவேலின் ஒரே இறைவனைக் குறிக்கும் ஒருமைப் பொருளில் இச்சொல் இங்கு வருகிறது.
- source_word: מִשְׂגַּבִּי
  choice: எனது பாதுகாப்பு அரண்
  rationale: מִשְׂגָּב என்பது பகைவரால் எளிதில் அடைய முடியாத உயர்ந்த, பாதுகாப்பான இடம் அல்லது கோட்டையைக் குறிக்கிறது. ‘பாதுகாப்பு அரண்’ அதன் தற்காப்புப் படிமத்தை இயல்பான நவீன தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: தொடக்கச் சொல்லை ‘அவனுடைய வலிமை’ என்று வாசிப்பதா, ‘என் வலிமையே’ என்ற நேரடி அழைப்பாக வாசிப்பதா
  choice: WLC-யில் தரப்பட்ட மூன்றாம் நபர் உடைமை வடிவத்தைப் பின்பற்றி முதன்மை உரையில் ‘அவனுடைய வலிமை’ என்று வைத்தல்
  alternative: ‘என் வலிமையே, உம்மை நோக்கிக் காத்திருப்பேன்’
  rationale: தரப்பட்ட எபிரெய மூலத்தின் உயிர்க்குறிப்பு மூன்றாம் நபர் ஆண்பால் ஒருமையைக் காட்டுகிறது. இருப்பினும், இவ்வரி கடினமானது; சூழலையும் பாரம்பரிய வாசிப்பையும் பின்பற்றி பலர் இதை இறைவனுக்கான ‘என் வலிமையே’ என்ற அழைப்பாகப் புரிந்துகொள்கின்றனர். மூலவடிவத்தை முதன்மை உரையில் காத்து, மாற்று வாசிப்பை அடிக்குறிப்பில் தருவது தெளிவின்மையையும் இறையியல் நெருக்கடியையும் செயற்கையாகத் தீர்க்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய ஆனால் சங்கீதத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடினமான எபிரெய தொடக்கம் மென்மையாக்கப்படாமல் அதன் திடீர் அமைப்புடன் வைக்கப்பட்டுள்ளது; மரியாதை ஒருமையான ‘உம்மை’ இறைவனை நோக்கிய உரையைத் தெளிவாக்குகிறது.
