  rationale: மூலத்தின் சற்றே அசாதாரணமான கட்டமைப்பையும் உடைமை விகுதியையும் காக்கும்போதே, தமிழில் தவறாகப் புரியக்கூடிய ‘அன்பின் கடவுள்’ அமைப்பு ‘மாறாத அன்புடைய கடவுள்’ எனத் தெளிவாக்கப்பட்டது. ‘முன்பாக வருவார்’ என்பது קדם வினையின் முன்வருதல்/முன்னதாக வருதல் நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது. இரண்டாம் வாக்கியத்தில் எபிரெய காரணவினை, கூடுதலான வெற்றி அல்லது பழிவாங்குதல் பொருளைச் சேர்க்காமல், ‘காணச் செய்வார்’ என வெளிப்படுத்தப்பட்டுள்ளது. மாற்று வாசகமும் lexical குறிப்பு அடிக்குறிப்பும் மூல வரிசையிலுள்ள குறிகளுடன் முழுமையாகத் தக்கவைக்கப்பட்டுள்ளன.
