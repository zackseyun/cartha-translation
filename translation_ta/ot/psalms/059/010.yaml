source:
  edition: WLC
  text: אֱלֹהֵ֣י חסד/ו יְקַדְּמֵ֑/נִי אֱ֝לֹהִ֗ים יַרְאֵ֥/נִי בְ/שֹׁרְרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/010.yaml
  text: The God of his steadfast love will go before me[b][a]; God will let me look on my enemies.
translation:
  language: ta
  text: தமது மாறாத அன்புடைய கடவுள் எனக்கு முன்பாக வருவார்[a][b]; கடவுள் என் பகைவர்களை நான் காணச் செய்வார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறொரு உயிர்க்குறிப்பின்படியோ மொழிபெயர்ப்பு மரபின்படியோ வாசித்தால்: “என் கடவுள் தமது மாறாத அன்பில் எனக்கு முன்பாக வருவார்” அல்லது “மாறாத அன்புடைய என் கடவுள் எனக்கு முன்பாக வருவார்.”'
    reason: alternative_reading
  - marker: b
    text: “மாறாத அன்பு” என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ஹெசெத்; இது பெரும்பாலும் பற்றுறுதியுள்ள அன்பு, உடன்படிக்கைக்குரிய அன்பு, அல்லது இரக்கம் என்பவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: கடவுள்
  rationale: இது அடுத்த சொல்லோடு இணையும் சார்பு வடிவம். தமிழில் ‘தமது மாறாத அன்பின் கடவுள்’ என்று இயல்பாக அமைத்து அந்த உறவு காக்கப்படுகிறது.
- source_word: חסדו
  choice: தமது மாறாத அன்பின்
  rationale: חֶסֶד என்பது நிலைத்த, பற்றுறுதியுள்ள அன்பையோ இரக்கத்தையோ குறிக்கலாம். மூன்றாம் நபர் ஆண்பால் ஒருமை விகுதி ‘தமது’ என்று தக்கவைக்கப்பட்டுள்ளது; ‘மாறாத அன்பு’ அதன் நிலைத்தன்மையையும் அன்பையும் மிகையாகக் கோட்பாட்டாக்காமல் தெரிவிக்கிறது.
- source_word: יְקַדְּמֵנִי
  choice: எனக்கு முன்செல்வார்
  rationale: קדם என்பதன் பியேல் வடிவம் முன்வருதல், எதிர்கொள்ளுதல் அல்லது முன்னே செல்லுதல் எனப் பொருள்படலாம். இங்கு கடவுள் முன்னதாகவே உதவ வருவதை ‘முன்செல்வார்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: எபிரெய உரையில் பெயர் மீண்டும் வருவதால், வலியுறுத்தலைக் காக்க தமிழிலும் பதிலிப்பெயருக்குப் பதிலாக ‘கடவுள்’ மீண்டும் வழங்கப்படுகிறது.
- source_word: יַרְאֵנִי
  choice: நான் காணும்படி செய்வார்
  rationale: ראה என்பதன் ஹிஃபில் வடிவம் ‘காணச் செய்’ அல்லது ‘காண விடு’ என்ற காரணவினைப் பொருளுடையது. பகைவர்கள்மேல் வெற்றி காண்பார் என்று வெளிப்படையாகச் சேர்க்காமல் அதன் காரணவினை நுணுக்கம் காக்கப்படுகிறது.
- source_word: בְשֹׁרְרָי
  choice: என் பகைவர்களை
  rationale: שׁורר பகைமை கொண்ட எதிரிகளைக் குறிக்கிறது. ‘என் பகைவர்கள்’ என்பது தெளிவான, இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: חסדו என்பதிலுள்ள பதிலிட விகுதி
  choice: தமது மாறாத அன்பின்
  alternative: என் கடவுள் தமது மாறாத அன்புடன் / மாறாத அன்பின் என் கடவுள்
  rationale: மசோரா உயிர்க்குறிப்பின்படி இங்கு மூன்றாம் நபர் ஆண்பால் ஒருமை, ‘அவருடைய/தமது’ என்ற வாசகம் உள்ளது; அதையே மூல உரைக்கு முன்னுரிமை அளித்து முதன்மை உரையில் பின்பற்றுகிறோம். வேறு உயிர்ப்பிக்கும் அல்லது மொழிபெயர்ப்பு மரபின்படி ‘என் கடவுள்’ என வாசிக்கப்படும் முக்கிய மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: பகைவர்களைக் காணுதல் என்ற சொற்றொடரின் விளைவு
  choice: என் பகைவர்களை நான் காணும்படி
  alternative: என் பகைவர்கள்மேல் என் விருப்பம் நிறைவேறுவதை நான் காணும்படி
  rationale: சூழலில் வெற்றியைக் காணுதல் உட்பொருளாக இருக்கக்கூடும்; ஆனால் எபிரெய உரை அதை வெளிப்படையாகச் சொல்லாததால், முதன்மை உரை அந்த உட்பொருளைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் சாதாரண வாசகர்களுக்குப் புரியும் நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தின் அசாதாரணமான ‘தமது மாறாத அன்பின் கடவுள்’ அமைப்பு முற்றிலும் வழுவழுப்பாக்கப்படாமல் காக்கப்பட்டு, முக்கிய மாற்று வாசகம் அடிக்குறிப்பில் தரப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெறுகின்றன.
