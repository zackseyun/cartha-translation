  yaml_path: translation/ot/psalms/059/007.yaml
  text: Look[a], they pour out from their mouths; swords are on their lips, for they say[b], “Who hears?”
translation:
  language: ta
  text: இதோ, அவர்கள் தங்கள் வாயிலிருந்து பொங்கிப் பேசுகிறார்கள்[a]; அவர்களுடைய உதடுகளில் வாள்கள் உள்ளன. ஏனெனில், “யார் கேட்கிறார்?”[b] என்று அவர்கள் சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் தங்கள் வாயிலிருந்து பெருக்கெடுத்துப் பேசுகிறார்கள்’; எபிரெய வினைச்சொல் பேச்சு குமிழ்த்தெழுவது அல்லது பெருக்கெடுத்துப் பாய்வது போன்ற படிமத்தைத் தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் வெறுமனே, ‘யார் கேட்கிறார்?’ என்றே உள்ளது. எதைக் கேட்கிறார் என்பது சொல்லப்படாததால், அவர்களுடைய அகந்தையான கூற்று வேண்டுமென்றே திறந்த நிலையில் உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெய இடைச்சொல்லின் சுட்டிக்காட்டும் வலிமையை இயல்பான, கண்ணியமான தமிழில் காக்கிறது.
- source_word: יַבִּיעוּן
  choice: கொட்டுகிறார்கள்
  rationale: குமிழ்த்தெழுதல் அல்லது பெருக்கெடுத்துப் பாய்தல் என்ற உருவகத்தை, கட்டுப்பாடின்றி மிகுதியாக வெளிவரும் பேச்சாக இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּפִיהֶם
  choice: தங்கள் வாயிலிருந்து
  rationale: எபிரெய முன்னிடைச்சொல் சொற்படியாக ‘வாயில்/வாயால்’ என அமையலாம்; ஆனால் திரவம்போல் வெளிப்படும் வினையுருவகத்துடன் தமிழில் ‘வாயிலிருந்து’ இயல்பாகிறது.
- source_word: חֲרָבוֹת
  choice: வாள்கள்
  rationale: தீங்கு விளைவிக்கும் பேச்சைக் குறிக்கும் மூல உருவகத்தை விளக்கமாக மாற்றாமல் அப்படியே காக்கிறது.
- source_word: בְּשִׂפְתוֹתֵיהֶם
  choice: அவர்களுடைய உதடுகளில்
  rationale: ‘வாயிலிருந்து’ என்பதற்கு இணையான கவிதைநடை அமைப்பையும், வெளிப்படத் தயாராக உள்ள வன்மையான பேச்சின் உருவகத்தையும் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில் ... என்கிறார்கள்
  rationale: காரணத்தை அறிமுகப்படுத்தும் இணைப்பை வெளிப்படுத்தி, பின்னரும் நேரடி வினாவை பேச்சாகத் தெளிவாக இணைக்கிறது; ‘என்கிறார்கள்’ என்பது சூழலிலிருந்து நிறைவு செய்யப்படுகிறது.
- source_word: מִי שֹׁמֵעַ
  choice: யார் கேட்கிறார்?
  rationale: எபிரெய நிகழ்காலப் பங்கேற்புவினையின் சுருக்கத்தையும், கேட்பதற்கான பொருள் குறிப்பிடப்படாத அகந்தையான வினாவின் திறந்த நிலையையும் காக்கிறது.
theological_decisions:
- issue: ‘யார் கேட்கிறார்?’ என்ற வினாவில் கேட்கப்படும் பொருள் மறைவாக இருப்பது
  choice: ‘யார் கேட்கிறார்?’ என்று பொருளைச் சேர்க்காமல் விடப்பட்டுள்ளது.
  alternative: ‘நாங்கள் சொல்வதை யார் கேட்கிறார்?’ அல்லது ‘இதைக் கேட்பவர் யார்?’
  rationale: எபிரெய உரையில் கேட்கப்படுவது எது அல்லது யாருடைய பேச்சு என்பது குறிப்பிடப்படவில்லை. யாரும்—தேவன்கூட—கேட்பதில்லை என்பதுபோன்ற அவர்களுடைய அகந்தையான மனப்பான்மையை உணர்த்தும் திறந்த இறையியல் பதற்றத்தை உரை அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வாள்கள்’ என்ற மூல உருவகம் விளக்கிப் பொருளாக்கப்படாமல் காக்கப்பட்டுள்ளது. ஓட்டத்தின் இயல்புக்காக ‘வார்த்தைகளைக்’ என்பது வெளிப்படையாகச் சேர்க்கப்பட்டாலும், வாள்கள் கொட்டப்படுகின்றன என்ற தவறான இலக்கணத் தொடர்பு தவிர்க்கப்பட்டுள்ளது.
