  text: Deliver me from workers of wickedness[b][a], and save me from men of blood.
translation:
  language: ta
  text: தீமை செய்பவர்களிடமிருந்து[a] என்னை விடுவியும்; இரத்தம் சிந்தும் ஆட்களிடமிருந்து[b] என்னைக் காப்பாற்றும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீச்செயல் புரிபவர்களிடமிருந்து.” எபிரெயத்தில் நேரடியாக, “தீமையைச் செய்பவர்களிடமிருந்து.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் நேரடியாக, “இரத்தங்களின் ஆட்களிடமிருந்து”; இது இரத்தவெறியுள்ளவர்களையோ இரத்தப்பழிக்குக் குற்றமுள்ளவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: என்னை விடுவியும்
  rationale: נצל என்பதன் கட்டளை வடிவம் ஆபத்திலிருந்து மீட்டு விடுவிக்குமாறு வேண்டுகிறது; தமிழ் இறைவேண்டல் நடைக்கு ஏற்ற மரியாதையான ஒருமை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது.
- source_word: מִפֹּעֲלֵי אָוֶן
  choice: தீமை செய்பவர்களிடமிருந்து
  rationale: פעל என்ற செய்பவர் வடிவத்தையும், இச்சூழலில் אָוֶן குறிக்கும் ஒழுக்கத் தீமையையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: וּמֵאַנְשֵׁי דָמִים
  choice: இரத்தம் சிந்தும் மனிதர்களிடமிருந்து
  rationale: ‘இரத்தத்தின் மனிதர்கள்’ என்ற எபிரெய மரபுத்தொடரைத் தமிழில் புரியும்படி தருகிறது; அதேவேளை வன்முறைமிக்க ஆண் எதிரிகளைச் சுட்டும் மூலத்தின் ஆண்பால் குறிப்பையும் காக்கிறது.
- source_word: הוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றும்
  rationale: ישע என்பதன் கட்டளை வடிவம் இங்கு எதிரிகளால் நேரும் ஆபத்திலிருந்து காப்பாற்றப்படுவதைக் குறிக்கிறது; ‘காப்பாற்றும்’ என்பது இயல்பான, பரந்த பொருளுள்ள தமிழ் சொல்.
theological_decisions:
- issue: אַנְשֵׁי என்பதிலுள்ள ஆண்பால் குறிப்பு
  choice: மனிதர்கள்
  alternative: ஆட்கள் / மக்கள்
  rationale: எபிரெயச் சொல் இலக்கண ரீதியாக ஆண்பாலும், சூழலில் வன்முறைமிக்க ஆண் எதிரிகளையும் குறிக்கிறது; ‘மனிதர்கள்’ இதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- issue: דָמִים என்ற பன்மை வடிவத்தின் மரபுத்தொடர்ப் பொருள்
  choice: இரத்தம் சிந்தும் மனிதர்கள்
  alternative: இரத்தவெறியர்கள் / இரத்தப்பழியுள்ள மனிதர்கள் / இரத்தத்தின் மனிதர்கள்
  rationale: மூல மரபுத்தொடர் இரத்தவெறியையும் இரத்தப்பழியையும் உள்ளடக்கக்கூடும். முதன்மை உரை வன்முறைச் செயலைத் தெளிவாகக் காட்டுகிறது; அதன் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் இறைவேண்டலுக்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘விடுவியும்’, ‘காப்பாற்றும்’ ஆகிய மரியாதையான ஒருமை கட்டளை வடிவங்கள் சங்கீத வேண்டுதலின் நேரடியான தொனியைக் காக்கின்றன; எபிரெய மரபுத்தொடரின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
