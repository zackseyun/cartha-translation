    text: 'சொல்லுக்குச் சொல்: “நாயைப் போல.” எபிரெயம் ஒப்புமையில் ஒருமையைப் பொதுப்படையாகப் பயன்படுத்துகிறது.'
    reason: source_form
lexical_decisions:
- source_word: וְיָשׁוּבוּ
  choice: அவர்கள் திரும்பி வருகிறார்கள்
  rationale: שׁוב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்/திரும்பி வருதல்’ என்பதையும், மாலைதோறும் மீண்டும் நிகழும் செயலையும் இயல்பான தமிழில் தருகிறது. எபிரெய வினைவடிவில் அனுமதி அல்லது விருப்பக் கட்டளை நிழலும் இருக்கக்கூடும் என்பதால் மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: לָעֶרֶב
  choice: மாலையில்
  rationale: עֶרֶב குறிக்கும் மாலை நேரத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יֶהֱמוּ
  choice: உறுமியபடி
  rationale: המה என்பது உரத்த விலங்கொலி, உறுமல் அல்லது ஊளை போன்ற ஒலியைக் குறிக்கலாம். உடனடியாக வரும் நாய் உவமைக்கு ‘உறுமுதல்’ பொருத்தமானது; அதன் பரந்த ஒலிப்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: כַכָּלֶב
  choice: நாய்களைப் போல
  rationale: எபிரெயத்தில் ஒருமை ‘நாயைப் போல’ என்று இருந்தாலும், பன்மை எழுவாயுடன் கூட்டமாகச் செயல்படும் பகைவர்களை விவரிக்கும் தமிழில் ‘நாய்களைப் போல’ இயல்பாக உள்ளது. மூலத்தின் ஒருமை அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: וִיסוֹבְבוּ עִיר
  choice: நகரைச் சுற்றித் திரிகிறார்கள்
  rationale: סבב என்பதன் ‘சுற்றுதல்/வலம் வருதல்’ என்ற பொருளையும், நகரில் இரைதேடுவது போல அலைந்து திரியும் நாய் உருவகத்தையும் அளவுக்கு மீறி விளக்காமல் வெளிப்படுத்துகிறது.
