  text: They return at evening[c][b][a]; they growl like dogs and prowl around the city.
translation:
  language: ta
  text: அவர்கள் மாலையில் திரும்பி வருகிறார்கள்; நாய்களைப் போல[c] உறுமுகிறார்கள்[b]; நகரைச் சுற்றித் திரிகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
