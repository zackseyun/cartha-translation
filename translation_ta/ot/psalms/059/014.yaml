    text: அல்லது, “ஊளையிடுகிறார்கள்.” இங்குள்ள எபிரெய வினைச்சொல் விலங்கு எழுப்பும் உரத்த ஒலியைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
