  text: אַל תַּהַרְגֵ֤/ם פֶּֽן יִשְׁכְּח֬וּ עַמִּ֗/י הֲנִיעֵ֣/מוֹ בְ֭/חֵילְ/ךָ וְ/הוֹרִידֵ֑/מוֹ מָֽגִנֵּ֣/נוּ אֲדֹנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/011.yaml
  text: Do not kill them[a], lest my people forget; make them wander by your power and bring them down[b], O Lord our shield.
translation:
  language: ta
  text: அவர்களைக் கொல்லாதீர்; இல்லையெனில் என் மக்கள் மறந்துவிடுவார்கள். உமது வல்லமையால்[b] அவர்களை அலையச் செய்து[a], அவர்களை வீழ்த்தும், எங்கள் கேடயமாகிய ஆண்டவரே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘அவர்களை அலைக்கழித்து’, ‘அவர்களைத் தடுமாறச் செய்து’; எபிரேய வினை அமைதியற்ற அசைவையோ நிலையின்மையையோ ஏற்படுத்துவதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘உமது பலத்தால்’; எபிரேயச் சொல் பலம், வல்லமை அல்லது படை வலிமையைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּהַרְגֵם
  choice: அவர்களைக் கொன்றுவிடாதீர்
  rationale: தடைப் பொருளுடைய אַל என்பதையும், ‘கொல்லுதல்’ என்ற இயல்பான பொருளுடைய הרג வினையையும் நேரடியாகவும் கண்ணியமான வேண்டுதல் நடையிலும் தருகிறது.
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  choice: இல்லையெனில் என் மக்கள் மறந்துவிடுவார்கள்
  rationale: פֶּן குறிக்கும் அஞ்சப்படும் விளைவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; மக்கள் எதை மறப்பார்கள் என்பதை மூலமும் குறிப்பிடாததால் மொழிபெயர்ப்பும் நிரப்பவில்லை.
- source_word: הֲנִיעֵמוֹ
  choice: அவர்களை அலையச் செய்து
  rationale: காரணவினை வடிவம் அசைவு அல்லது நிலையின்மையை ஏற்படுத்துவதைக் குறிக்கிறது. உடனடியாகக் கொல்வதற்கு மாறாகத் தொடர்ந்து அலைக்கழிக்கப்படும் நிலையை ‘அலையச் செய்து’ இயல்பாகத் தருகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளன.
- source_word: בְחֵילְךָ
  choice: உமது வல்லமையால்
  rationale: חַיִל இங்கு பலம், வல்லமை அல்லது படை வலிமையைக் குறிக்கலாம். கருவிப் பொருளுடைய בְּ உடன், கடவுளுடைய செயலாற்றலைக் குறிக்கும் ‘உமது வல்லமையால்’ சூழலுக்கு மிகவும் இயல்பானது.
- source_word: וְהוֹרִידֵמוֹ
  choice: அவர்களை வீழ்த்தும்
  rationale: ירד என்பதன் காரணவினை ‘கீழிறங்கச் செய்’ என்பதாகும். ‘வீழ்த்தும்’ என்ற தேர்வு அவர்களைத் தாழ்ந்த நிலைக்குக் கொண்டுவரும் உருவகத்தைப் பாதுகாக்கிறது; எவ்வகையில் என்பது குறித்து மேலதிக விளக்கம் சேர்க்கவில்லை.
- source_word: מָגִנֵּנוּ
  choice: எங்கள் கேடயமாகிய
  rationale: ‘கேடயம்’ என்ற சங்கீதங்களில் முக்கியமான பாதுகாப்பு உருவகத்தை ‘பாதுகாவலர்’ போன்ற கருத்தாக்கச் சொல்லாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது நேரடி அழைப்பிலுள்ள தெய்வீகப் பட்டம்; தமிழின் விளி வடிவமான ‘ஆண்டவரே’ அதைக் கண்ணியமாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கோரப்படும் நியாயத்தீர்ப்பின் தன்மை
  choice: எதிரிகளை உடனே கொல்லாமல், மக்கள் மறந்துவிடாதபடி அவர்களை அலைக்கழித்து வீழ்த்துமாறு வேண்டுதல்
  alternative: குறிப்பிட்ட அலைதலைச் சொல்லாமல், அவர்களை நிலையிழக்கச் செய்து தாழ்த்துமாறு பொதுவாக வேண்டுதல்
  rationale: ‘கொன்றுவிடாதீர் ... அலையச் செய்து ... வீழ்த்தும்’ என்ற தொடர்ச்சி உடனடி மரணத்திற்கும் நீடித்த, வெளிப்படையான தாழ்வுக்கும் இடையிலான பதற்றத்தை உருவாக்குகிறது. எந்தக் குறிப்பிட்ட கோட்பாட்டு விளக்கத்தையும் சேர்க்காமல் அந்தப் பதற்றம் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘கேடயம்’ என்ற மூல உருவகம் தக்கவைக்கப்பட்டுள்ளது. அடிக்குறி [a] தொடர்புடைய ‘அலையச் செய்து’ என்பதற்குப் பின்னும், [b] தொடர்புடைய ‘வல்லமையால்’ என்பதற்குப் பின்னும் பொருத்தமாக வைக்கப்பட்டுள்ளன.
