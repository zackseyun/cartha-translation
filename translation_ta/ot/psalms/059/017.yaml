source:
  edition: WLC
  text: עֻ֭זִּ/י אֵלֶ֣י/ךָ אֲזַמֵּ֑רָה כִּֽי אֱלֹהִ֥ים מִ֝שְׂגַּבִּ֗/י אֱלֹהֵ֥י חַסְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/017.yaml
  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
translation:
  language: ta
  text: என் வல்லமையே, உம்மைப் புகழ்ந்து பாடுவேன்; ஏனெனில், கடவுள் எனது அரண், என் மாறாத அன்பின் கடவுள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு அருள் புரியும் கடவுள்” அல்லது “எனக்கு மாறாத அன்பு காட்டும் கடவுள்.” எபிரெயத்தில் சொல்லுக்குச் சொல், “என் மாறாத அன்பின் கடவுள்.”
    reason: alternative_reading
lexical_decisions:
- source_word: עֻזִּי
  choice: என் வல்லமையே
  rationale: עֹז என்பது ‘வலிமை, வல்லமை’ என்று பொருள்படும். இங்கு கடவுளை நேரடியாக அழைக்கும் விளிவேற்றுமைச் சூழலைத் தமிழின் ‘-ஏ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵלֶיךָ
  choice: உம்மைப்
  rationale: אֶל திசை அல்லது நோக்கைக் குறிக்கிறது. זמר உடன் தமிழில் ‘உம்மைப் புகழ்ந்து பாடுவேன்’ என்பது பாடலின் நோக்கத்தையும் கடவுளை நோக்கிய புகழையும் இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲזַמֵּרָה
  choice: புகழ்ந்து பாடுவேன்
  rationale: זמר என்பதன் பியேல் வடிவம் சங்கீதங்களில் இசையுடன் புகழ்ந்து பாடுவதைக் குறிக்கிறது; வெறும் ‘பாடுவேன்’ என்பதைவிட வழிபாட்டுச் சூழலை இது தெளிவாகக் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: இங்கு כִּי, புகழ்ந்து பாடுவதற்கான காரணத்தை அறிமுகப்படுத்துகிறது. ‘ஏனெனில்’ அந்தக் காரணத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கும் ஒருமைப் பொருளிலேயே உள்ளது.
- source_word: מִשְׂגַּבִּי
  choice: எனது அரண்
  rationale: מִשְׂגָּב என்பது உயர்ந்த, பாதுகாப்பான இடத்தையும் உறுதியான பாதுகாப்பையும் குறிக்கிறது. ‘அரண்’ அந்தத் தற்காப்பு உருவகத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֱלֹהֵי חַסְדִּי
  choice: என் மாறாத அன்பின் கடவுள்
  rationale: எபிரெயச் சேர்க்கைச் சொற்றொடர் சொற்பட ‘என் חֶסֶד-இன் கடவுள்’ என உள்ளது. חֶסֶד-இன் உறுதியான, விசுவாசமுள்ள அன்பு என்ற கருத்தையும் மூலத்தின் செறிவான தெளிவின்மையையும் ‘என் மாறாத அன்பின் கடவுள்’ காக்கிறது.
theological_decisions:
- issue: חַסְדִּי என்பது கடவுளுடன் எவ்வாறு தொடர்புபடுகிறது
  choice: ‘என் மாறாத அன்பின் கடவுள்’ என்ற சேர்க்கை அமைப்பைப் பாதுகாத்தல்
  alternative: ‘எனக்கு மாறாத அன்பு காட்டும் கடவுள்’ அல்லது ‘என் கிருபையுள்ள கடவுள்’
  rationale: இச்செறிவான எபிரெயச் சொற்றொடர், கடவுள் சங்கீதக்காரருக்கு மாறாத அன்பு காட்டுகிறார் என்ற பொருளையோ, அந்த அன்பின் ஊற்றாகவும் உருவக நிறைவாகவும் அவர் இருக்கிறார் என்ற பொருளையோ தாங்கலாம். முதன்மை உரை இந்த இறையியல் இழுபறியைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சங்கீத நடையைப் பயன்படுத்துகிறது. கடவுளை நோக்கிய உரையில் மரியாதைப் பன்மை காக்கப்பட்டுள்ளது; எபிரெயக் கவிதையின் சுருக்கமும் இறுதி சொற்றொடரின் உண்மையான பொருள் விரிவும் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளன.
