id: PSA.59.3
reference: Psalms 59:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה אָֽרְב֡וּ לְ/נַפְשִׁ֗/י יָג֣וּרוּ עָלַ֣/י עַזִ֑ים לֹא פִשְׁעִ֖/י וְ/לֹא חַטָּאתִ֣/י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/003.yaml
  text: For look, they lie in wait for my life; fierce men gather against me, for no transgression or sin of mine, O LORD.
translation:
  language: ta
  text: ஏனெனில், இதோ, அவர்கள் என் உயிரைக் குறிவைத்து பதுங்கிக் காத்திருக்கிறார்கள்; வலிமைமிக்கோர் எனக்கு எதிராகத் திரள்கிறார்கள்; யெகோவாவே, என் மீறுதலோ என் பாவமோ இல்லாதபோதும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: ஏனெனில், இதோ
  rationale: כִּי முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; הִנֵּה அவசரமாகக் கவனம் ஈர்க்கும் சொல்லாக இருப்பதால் ‘இதோ’ என்று தக்கவைக்கப்பட்டது.
- source_word: אָרְבוּ לְנַפְשִׁי
  choice: என் உயிரைப் பறிக்கப் பதுங்கியிருக்கிறார்கள்
  rationale: אָרב என்பது பதுங்கிக் காத்திருப்பதையும், נֶפֶשׁ இச்சூழலில் உயிரையோ நபரையோ குறிக்கிறது; தமிழில் தாக்குதல் நோக்கம் இயல்பாகத் தெளிவதற்காக இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יָגוּרוּ עָלַי
  choice: எனக்கு எதிராக ஒன்றுகூடுகிறார்கள்
  rationale: גור இவ்வடிவிலும் சூழலிலும் தாக்குவதற்காகக் கூடுதல் அல்லது திரளுதல் என்ற பொருளைக் கொண்டது; עָלַי எதிர்ப்பை வெளிப்படுத்துகிறது.
- source_word: עַזִּים
  choice: வலிமைமிக்கவர்கள்
  rationale: இந்தப் பன்மைப் பெயரடை பலமிக்க அல்லது கொடிய மனிதர்களைக் குறிக்கலாம். மூலத்தின் முதன்மையான வலிமைச் சார்ந்த பொருளைத் தக்கவைத்து ‘வலிமைமிக்கவர்கள்’ என வழங்கப்பட்டது.
- source_word: פִשְׁעִי ... חַטָּאתִי
  choice: என் மீறுதல் ... என் பாவம்
  rationale: פֶּשַׁע என்பது மீறுதல்/கலகச்செயல் என்றும் חַטָּאת் என்பது பாவம் என்றும் வேறுபடுத்திக் காட்டப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவாவே
  rationale: மூலத்தில் உள்ள தெய்வீகத் திருப்பெயரைப் பொதுப்பட்ட ‘கர்த்தர்’ என்ற பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பால் வழங்குகிறது.
theological_decisions:
- issue: சங்கீதக்காரரின் குற்றமின்மை வாதத்தின் வரம்பு
  choice: ‘இது என் மீறுதலினாலோ என் பாவத்தினாலோ அல்ல’
  alternative: ‘என்னிடம் மீறுதலும் பாவமும் இல்லை’
  rationale: לֹא פִשְׁעִי וְלֹא חַטָּאתִי என்பது இத்தாக்குதல் தன் குற்றத்தால் ஏற்பட்டதல்ல என்ற சூழல்சார் வாதமாக வாசிக்கப்படலாம். முழுமையான பாவமின்மையைப் போதிப்பதாகத் தேவையின்றி விரிவாக்காமல் அந்தத் தொடர்பை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வேண்டுதல் மற்றும் ஆபத்தின் தீவிரத்துக்கு ஏற்ற கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டது. ‘இதோ’ என்ற கவன ஈர்ப்புச் சொல் மூலத்தின் வலியுறுத்தலைக் காக்கிறது; சொற்சொல் கடினத்தன்மையைத் தவிர்த்து காரணத் தொடர்பு இயல்பாக வெளிப்படுத்தப்பட்டது.
