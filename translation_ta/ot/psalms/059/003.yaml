revisions:
- from: ஏனெனில், இதோ, அவர்கள் என் உயிரைப் பறிக்கப் பதுங்கியிருக்கிறார்கள்; வலிமைமிக்கவர்கள் எனக்கு எதிராக ஒன்றுகூடுகிறார்கள். யெகோவாவே, இது என் மீறுதலினாலோ என் பாவத்தினாலோ அல்ல.
  to: ஏனெனில், இதோ, அவர்கள் என் உயிரைக் குறிவைத்து பதுங்கிக் காத்திருக்கிறார்கள்; வலிமைமிக்கோர் எனக்கு எதிராகத் திரள்கிறார்கள்; யெகோவாவே, என் மீறுதலோ என் பாவமோ இல்லாதபோதும்.
  rationale: The revision removes the explicit added notion of taking life, renders the ambush idiomatically, and reshapes the final clause to retain its source-based connection to the psalmist’s lack of transgression or sin. It does not turn the verse into a general doctrinal assertion of absolute sinlessness.
