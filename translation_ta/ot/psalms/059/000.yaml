base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/000.yaml
  text: 'For the choir director: “Do Not Destroy.” Of David[a]. A miktam, when Saul sent men[d][c][b], and they watched the house to kill him.'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: “அழிக்காதே.” தாவீதுக்குரியது.[b] மிக்தாம்.[c] சவுல் ஆட்களை அனுப்பியபோது, அவர்கள் தாவீதைக் கொல்வதற்காக அந்த வீட்டைக் கண்காணித்தார்கள்.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “தாவீதுக்குரியது” என்பதற்கான எபிரேயச் சொற்றொடர், தாவீது இயற்றியது, அவரோடு தொடர்புடையது, அல்லது அவருக்காக அர்ப்பணிக்கப்பட்டது ஆகிய பொருள்களில் அமையலாம்.
    reason: lexical_alternative
  - marker: c
    text: “மிக்தாம்” என்பதன் துல்லியமான பொருள் உறுதியாகத் தெரியாததால், அது மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: d
    text: சொல்லுக்கு நெருக்கமாக, “சவுல் அனுப்பியபோது, அவர்கள் அவனைக் கொல்வதற்காக அந்த வீட்டைக் கண்காணித்தார்கள்.” எபிரேயத்தில் “ஆட்களை” என்பது வெளிப்படையாக இல்லை; பன்மை வினை அனுப்பப்பட்ட நபர்களைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை வழிநடத்தும் பொறுப்பாளரைக் குறிக்கும் வழக்குச் சொற்றொடர்; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אַל תַּשְׁחֵת
  choice: “அழிக்காதே” என்ற மெட்டில்
  rationale: இது சங்கீதத்தின் நேரடி கட்டளையாக அல்லாமல், பெரும்பாலும் ஒரு மெட்டு அல்லது இசைக் குறிப்பு பெயராகப் புரிந்துகொள்ளப்படுகிறது; அந்த வாய்ப்பை உரையிலேயே தெளிவாக்குகிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்குரியது
  rationale: எபிரேய לְ என்பது ஆசிரியத்துவம், தொடர்பு அல்லது அர்ப்பணம் ஆகியவற்றைக் குறிக்கக்கூடும்; ‘தாவீது எழுதியது’ என்று தேவையின்றி வரையறுக்காமல் அந்தத் தெளிவின்மையைப் பேணுகிறது.
- source_word: מִכְתָּם
  choice: மிக்தாம்
  rationale: இச்சொல்லின் துல்லியமான பொருள் உறுதியற்றது; ஊகமான மொழிபெயர்ப்புக்குப் பதிலாக ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: בִּשְׁלֹחַ שָׁאוּל
  choice: சவுல் ஆட்களை அனுப்பியபோது
  rationale: காலப் பொருளுடைய அமைப்பு ‘சவுல் அனுப்பியபோது’ என்கிறது. ‘ஆட்களை’ என்பது எபிரேயத்தில் வெளிப்படையாக இல்லை; தொடர்ந்து வரும் பன்மை வினை உணர்த்தும் அனுப்பப்பட்ட நபர்களை இயல்பான தமிழுக்காக வெளிப்படுத்துகிறது.
- source_word: וַיִּשְׁמְרוּ אֶת הַבַּיִת
  choice: அவர்கள் ... அந்த வீட்டைக் கண்காணித்தார்கள்
  rationale: கொலை நோக்கத்துடன் வீட்டைக் கவனித்திருப்பதால், பாதுகாத்தல் என்பதற்குப் பதிலாக பகைமையான கண்காணிப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: לַהֲמִיתוֹ
  choice: தாவீதைக் கொல்வதற்காக
  rationale: நோக்கத்தைக் குறிக்கும் வினையெச்சமும் ஆண்பால் ஒருமை பின்னொட்டும் உள்ளன. தமிழில் தெளிவுக்காக ‘அவனை’ என்பதற்குப் பதிலாக குறிக்கப்படுபவரான தாவீதின் பெயர் தரப்படுகிறது.
theological_decisions:
- issue: לְדָוִד என்பதன் உறவு
  choice: தாவீதுக்குரியது
  alternative: தாவீது எழுதியது / தாவீதுக்காக
  rationale: மூலத்தில் ஆசிரியத்துவம் மட்டும் கட்டாயப்படுத்தப்படவில்லை; தொடர்பு, அர்ப்பணம், ஆசிரியத்துவம் ஆகிய சாத்தியங்களைத் திறந்தே வைக்கிறது.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான சங்கீதத் தலைப்பு நடையைப் பேணுகிறது. அரிதான தொழில்நுட்பச் சொல் ‘மிக்தாம்’ ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்படுகிறது. மூலத்தின் வரலாற்றுச் சூழல் தமிழில் இயல்பாகத் தெளிவுபடுத்தப்பட்டாலும், லְדָוִד என்பதன் உண்மையான பொருள் விரிவு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
