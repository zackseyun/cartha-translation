  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடையில் அமைக்கப்பட்டது. தேவனை நோக்கிய உரையில் ‘உம்’ மரியாதை வடிவமும், பிரதிநிதி ஒருமை நபருக்கு பாலினத்தை முன்னிறுத்தாத ‘அவர்’ வடிவமும் பயன்படுத்தப்பட்டுள்ளன. சமயப் பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டன.
