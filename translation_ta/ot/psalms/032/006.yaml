  yaml_path: translation/ot/psalms/032/006.yaml
  text: Therefore let every godly one pray to you at a time when you may be found[a]; surely when the great floodwaters come[b], they will not reach him.
translation:
  language: ta
  text: ஆகையால், உம்மைக் கண்டடைய முடியும் வேளையில் இறைப்பற்று கொண்ட ஒவ்வொருவரும் உம்மிடம் மன்றாடட்டும்[a]; நிச்சயமாக, திரளான நீரின் பெருக்கிலும் அவை அவரை எட்டாது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதற்காக, உண்மையுள்ள ஒவ்வொருவரும் உம்மைக் கண்டடைய முடியும் வேளையில் உம்மிடம் மன்றாடட்டும்.”
    reason: עַל־זֹאת என்பதற்கு “இதற்காக” என்ற மாற்றையும், חָסִיד என்பதற்கு “உண்மையுள்ளவர்” என்ற மாற்றையும், לְעֵת מְצֹא என்பதன் சுருக்கமான காலக் குறிப்பையும் காக்கிறது.
  - marker: b
    text: 'சொல்லுக்குச் சொல்: “திரளான நீரின் பெருக்கில்.”'
    reason: לְשֵׁטֶף מַיִם רַבִּים என்ற எபிரெயப் பெயர்ச்சொல் அமைப்பையும் வெள்ள உருவகத்தையும் நேரடியாகக் காட்டுகிறது.
lexical_decisions:
- source_word: עַל זֹאת
  choice: ஆகையால்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட பாவ அறிக்கையையும் மன்னிப்பையும் இவ்வசனத்தின் அறிவுறுத்தலோடு இயல்பாக இணைக்கும் காரணவிளைவுப் பொருள்.
- source_word: יִתְפַּלֵּל
  choice: மன்றாடட்டும்
  rationale: இச்சூழலில் imperfect வடிவம் அறிவுறுத்தல் அல்லது ஊக்குவித்தல் வலிமையைக் கொண்டுள்ளது; ‘மன்றாடட்டும்’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: כָּל חָסִיד
  choice: இறைப்பற்றுள்ள ஒவ்வொருவரும்
  rationale: חָסִיד என்பது உடன்படிக்கைப் பற்றுறுதியும் இறைபக்தியும் உடையவரைக் குறிக்கிறது. சமயப் பிரிவு சார்ந்த ‘புனிதர்’ என்பதைக் காட்டிலும் இது இயல்பானதும் பரந்ததுமான தமிழ்.
- source_word: אֵלֶיךָ
  choice: உம்மிடம்
  rationale: மன்றாட்டின் திசையைச் சுட்டுகிறது; எபிரெயத்தில் இல்லாத ‘தேவனே’ என்ற அழைப்பைச் சேர்க்கவில்லை.
- source_word: לְעֵת מְצֹא
  choice: உம்மைக் கண்டடையக்கூடிய வேளையில்
  rationale: ‘கண்டடையும் காலத்தில்’ என்ற அடிப்படைச் சொல்லமைப்பை இயல்பான தமிழில் தருகிறது; தேவனை அணுகி நாடுவதற்குரிய வேளையைக் குறிக்கும் பொதுவான புரிதலையும் காக்கிறது.
- source_word: רַק
  choice: —ஆலும்
  rationale: இங்கு வலியுறுத்தல் அல்லது எதிர்மறைத் திருப்பத்தைத் தரும் துகளின் செயல்பாடு, ‘புரண்டுவந்தாலும் ... எட்டாது’ என்ற தமிழ்ச் சொல்லமைப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  choice: பெருவெள்ளமாய் நீர் புரண்டுவந்தாலும்
  rationale: ‘திரளான நீரின் பெருக்கு’ என்ற கவித்துவ உருவகத்தை, மிகுந்த நீர் வெள்ளமாய் பாய்ந்து வருவதாகத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֵלָיו
  choice: அவரை
  rationale: முன்னர் குறிப்பிடப்பட்ட இறைப்பற்றுள்ள நபரையே ஒருமை பிரதிநிதியாகச் சுட்டுகிறது; பாலினத்தைத் தேவையின்றி முன்னிறுத்தாத மரியாதை ஒருமைத் தமிழ்.
- source_word: לֹא יַגִּיעוּ
  choice: எட்டாது
  rationale: נגע என்பதன் ‘சென்றடைதல்/தொடுதல்’ பொருளை வெள்ள உருவகத்துக்கு ஏற்ற சுருக்கமான தமிழில் தருகிறது.
theological_decisions:
