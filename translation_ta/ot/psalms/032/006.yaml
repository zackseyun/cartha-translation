  rationale: אֵלָיו என்ற ஆண்பால் ஒருமைச் சுட்டுப்பெயர் அருகிலுள்ள חָסִיד என்பவரையே இயல்பாகக் குறிக்கிறது. வெள்ளம் துன்பம் அல்லது நியாயத்தீர்ப்பைக் குறிக்கலாம்; மொழிபெயர்ப்பு அதனை விளக்கமாகச் சேர்க்காமல் கவித்துவத் தெளிவின்மையைப் பாதுகாக்கிறது.
- issue: לְעֵת מְצֹא என்பதன் இலக்கணத் தெளிவின்மை
  choice: ‘உம்மைக் கண்டடையக்கூடிய வேளையில்’
  alternative: ‘கண்டடையும் வேளையில்’ அல்லது ‘உம்மைக் கண்டடைய முடியும் வரை’
  rationale: பலர் இதனை தேவன் கண்டடையப்படக்கூடிய காலம் எனப் புரிந்துகொள்கிறார்கள். அதேவேளை எபிரெயச் சொற்றொடரின் சுருக்கத்தால் எழும் சிறிய தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
