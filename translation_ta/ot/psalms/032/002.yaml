  text: אַ֥שְֽׁרֵי אָדָ֗ם לֹ֤א יַחְשֹׁ֬ב יְהוָ֣ה ל֣/וֹ עָוֺ֑ן וְ/אֵ֖ין בְּ/רוּח֣/וֹ רְמִיָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
translation:
  language: ta
  text: யாருடைய அக்கிரமத்தை யாவே அவருடைய கணக்கில் சேர்ப்பதில்லையோ[a], யாருடைய ஆவியில் வஞ்சகம் இல்லையோ[b], அவர் பேறுபெற்றவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அக்கிரமம்” என்பதற்கு “பாவம்” அல்லது “குற்றப்பொறுப்பு” என்றும் பொருள் கொள்ளலாம். “அவருடைய கணக்கில் சேர்ப்பதில்லை” என்பது அவருக்கு உரிய குற்றமாகக் கணக்கிடுவதில்லை என்ற கணக்குப் பதிவு உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: “வஞ்சகம்” என்பதற்கு “கபடம்” என்றும் மொழிபெயர்க்கலாம்; “ஆவி” என்பது இங்கு ஒருவரின் உள்ளார்ந்த மனப்பாங்கைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவர்
  rationale: எபிரெய மொழியின் வாழ்த்துரைப் பாங்கை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது; இது வெறும் மனநிலையான ‘மகிழ்ச்சி’ என்பதைவிட நல்வாழ்வு பெற்ற நிலையைச் சுட்டுகிறது.
- source_word: אָדָם
  choice: யார் ... அவர்
  rationale: இங்கு ஒருமை வடிவம் பொதுவாக எந்த மனிதரையும் குறிக்கிறது. தமிழின் இயல்பான பொதுமை ஒருமைக் கட்டமைப்பு, ஆண் பாலினத்தவருக்கு மட்டும் பொருளைக் கட்டுப்படுத்தாமல் மூலத்தின் பிரதிநிதித்துவ ஒருமையைப் பேணுகிறது.
- source_word: יַחְשֹׁב ... לּוֹ
  choice: அவருடைய கணக்கில் சேர்ப்பதில்லை
  rationale: חשב என்ற வினையின் கணக்கிடுதல் அல்லது ஒருவருக்குரியதாகக் கருதுதல் என்ற உருவகத்தை வாசகருக்குப் புரியும் தமிழில் காக்கிறது; பிற்கால இறையியல் தொழில்நுட்பச் சொல்லைத் திணிக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான יהוה-ஐ ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பு வடிவில் தருகிறது.
- source_word: עָוֺן
  choice: அக்கிரமம்
  rationale: இச்சொல்லின் பாவச் செயல், குற்றம், குற்றப்பொறுப்பு ஆகிய தொடர்புடைய பொருள் நிழல்களில், இங்கு ஒழுக்கத் தவறும் கணக்கிடப்படும் குற்றமும் இணைந்திருப்பதை ‘அக்கிரமம்’ ஓரளவு காக்கிறது.
- source_word: בְּרוּחוֹ
  choice: அவருடைய ஆவியில்
  rationale: רוּחַ என்பதன் நேரடியான உருவத்தைப் பேணுவதோடு, இங்கு மனிதரின் உள்ளார்ந்த மனப்பாங்கைக் குறிக்க இடமளிக்கிறது.
- source_word: רְמִיָּה
  choice: வஞ்சகம்
  rationale: ஏமாற்றம், கபடம் ஆகிய பொருள்களைத் தரும் இச்சொல்லுக்கு ‘வஞ்சகம்’ இயல்பானதும் கண்ணியமானதும் ஆகும்.
theological_decisions:
- issue: பொதுமைப் பொருளுடைய ஒருமை மனிதக் குறிப்பு
  choice: யார் ... அவர்
  alternative: மனிதன்
  rationale: אָדָם இலக்கணத்தில் ஒருமையாக இருந்தாலும் இங்கு ஆண்களை மட்டும் அல்ல, எந்த மனிதரையும் பிரதிநிதித்துவமாகக் குறிக்கிறது. தமிழில் ‘யார் ... அவர்’ என்பது ஒருமையையும் பொதுமையையும் இயல்பாகப் பேணுகிறது.
- issue: குற்றத்தைக் கணக்கிடாத இறைச் செயல்
  choice: அவருடைய கணக்கில் சேர்ப்பதில்லை
  alternative: அக்கிரமத்தைச் சுமத்துவதில்லை
  rationale: வசனத்தின் கணக்குப் பதிவுச் சார்ந்த உருவகத்தைத் தெளிவாகக் காக்கிறது; அதேவேளை அதை ஒரு குறிப்பிட்ட பிற்காலக் கோட்பாட்டு வரையறையாகச் சுருக்கவில்லை.
- issue: רוּחַ என்பதன் உள்ளார்ந்த பொருள்
  choice: ஆவி
  alternative: உள்ளம்
  rationale: மூலச்சொல்லின் உருவத்தைப் பேணி, அது இங்கு மனிதரின் உள்ளார்ந்த நிலை அல்லது மனப்பாங்கைக் குறிக்கலாம் என்ற பொருள் விரிவை மூடாமல் வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத வாழ்த்துரைக்கு ஏற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘யார் ... அவர்’ அமைப்பு பாலினக் கட்டுப்பாடின்றி மூலத்தின் பொதுமை ஒருமையைப் பேணுகிறது; கணக்கிடுதல் என்ற உருவகமும் ‘ஆவி’ என்ற உள்ளார்ந்த சொல்லுருவமும் திட்டமிட்டு நிலைநிறுத்தப்பட்டுள்ளன.
