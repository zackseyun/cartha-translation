  yaml_path: translation/ot/psalms/032/000.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: ta
  text: 'தாவீதுக்குரியது[a]. ஒரு மஸ்கீல்[b].


    யாருடைய மீறுதல் மன்னிக்கப்பட்டதோ[c],

    யாருடைய பாவம் மூடப்பட்டதோ,

    அவர் பேறுபெற்றவர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத் தலைப்பு ‘தாவீதினுடையது,’ ‘தாவீதுக்காக,’ அல்லது ‘தாவீதுடன் தொடர்புடையது’ என்று பொருள்படக்கூடும்.
    reason: textual_ambiguity
  - marker: b
    text: எபிரெயத்தில் மஸ்கீல். இதன் துல்லியமான பொருள் உறுதியில்லை; போதனை சார்ந்த அல்லது தியானத்துக்குரிய பாடலைக் குறிக்கக்கூடும்.
    reason: cultural_note
  - marker: c
    text: 'சொல்லுக்குச் சொல்: ‘தூக்கப்பட்டதோ’ அல்லது ‘சுமந்து அகற்றப்பட்டதோ.’ இங்கு அது மன்னிப்பைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்குரியது
  rationale: לְ என்ற முன்னொட்டு ஆசிரியர், தொடர்பு, அர்ப்பணம் ஆகிய பல உறவுகளைக் குறிக்கக்கூடும்; ‘தாவீதுக்குரியது’ என்பது தலைப்பின் சுருக்கத்தையும் அடிப்படைத் தெளிவின்மையையும் காக்கிறது.
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: இது சங்கீதத் தலைப்பில் வரும் தொழில்நுட்பச் சொல்; அதன் துல்லியமான பொருள் உறுதியில்லை. ஊகப் பொருளை முதன்மை உரையில் திணிக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவர்
  rationale: இச்சொல் கடவுளின் ஆசீர்வாத அறிவிப்பை மட்டும் அல்லாமல் ஒருவரின் நல்வாய்ந்த, விரும்பத்தக்க நிலையையும் சுட்டுகிறது; தமிழில் இயல்பான, கண்ணியமான வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: נְשׂוּי פֶּשַׁע
  choice: மீறுதல் மன்னிக்கப்பட்டதோ
  rationale: எபிரெயச் சொல்லின் நேரடிப் படிமம் ‘மீறுதல் தூக்கப்பட்டது/சுமந்து அகற்றப்பட்டது’ என்பதாகும்; சூழலில் அதன் பொருள் மன்னிப்பு என்பதால் முதன்மை உரையில் இயல்பாகத் தரப்பட்டு, படிமம் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
- source_word: כְּסוּי חֲטָאָה
  choice: பாவம் மூடப்பட்டதோ
  rationale: ‘மூடப்பட்டது’ என்ற மூல உருவகத்தைத் தக்கவைத்து, மன்னிப்பின் இணைச் சொல்லாட்சியாக அதன் இறையியல் வலிமையையும் பதற்றத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: மன்னிப்பை விவரிக்கும் இரு உருவகங்கள்
  choice: ‘மன்னிக்கப்பட்டது’ மற்றும் ‘மூடப்பட்டது’ என்ற வேறுபட்ட இணை வரிகளைத் தக்கவைத்தல்
  alternative: இரண்டையும் ‘மன்னிக்கப்பட்டது’ என்று ஒரே விதமாக மொழிபெயர்த்தல்
  rationale: மூலத்தில் ‘தூக்கப்பட்டது’ மற்றும் ‘மூடப்பட்டது’ என்ற இரு தனித்த உருவகங்கள் உள்ளன; அவற்றை ஒரே சொல்லாகச் சமப்படுத்துவது கவிதை மற்றும் இறையியல் பதற்றத்தை இழக்கச் செய்யும்.
- issue: לְדָוִד என்ற தலைப்பின் தொடர்பு
  choice: ‘தாவீதுக்குரியது’ என மொழிபெயர்த்து அடிக்குறிப்பில் சாத்தியங்களைத் தெரிவித்தல்
  alternative: ‘தாவீது இயற்றியது’ என்று ஆசிரியத்துவத்தைத் திட்டவட்டமாக்குதல்
  rationale: எபிரெய முன்னொட்டு ஆசிரியத்துவத்தைக் குறிக்கலாம்; ஆனால் அதற்கு மட்டுமே கட்டுப்பட்டதல்ல. ஆகவே மூலத்தின் உண்மையான தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமும் கவிதை இணைநடையும் காக்கப்பட்டுள்ளன. புரியாத தலைப்புச் சொல்லுக்கு ஊகமான பொருளைத் திணிக்காமல் ‘மஸ்கீல்’ என ஒலிபெயர்த்து விளக்கம் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளது.
