  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: ta
  text: 'தாவீதுக்குரியது. மஸ்கீல்[a].


    மீறுதல் மன்னிக்கப்பட்டு[b],

    பாவம் மூடப்பட்டவர் பேறுபெற்றவர்!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மஸ்கீல்.’ இது ஒரு சங்கீதத் தலைப்பு; இதன் துல்லியமான பொருள் உறுதியில்லை. அறிவுறுத்தும் அல்லது தியானத்துக்குரிய பாடலைக் குறிக்கலாம்.
    reason: cultural_note
  - marker: b
