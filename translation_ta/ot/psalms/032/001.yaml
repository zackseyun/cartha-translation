    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்குரியது
  rationale: சங்கீதத் தலைப்புகளில் לְ என்ற முன்னொட்டு ஆசிரியத்துவம், அர்ப்பணம், அல்லது தொடர்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதுக்குரியது’ என்பது இவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் இயல்பான தமிழில் அந்த நெகிழ்வைத் தக்கவைக்கிறது.
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: இந்தத் தலைப்புச் சொல்லின் துல்லியமான பொருளும் வழிபாட்டு அல்லது இலக்கியச் செயல்பாடும் உறுதியற்றவை. எனவே ஊகமான பொருளை முதன்மை உரையில் புகுத்தாமல் ஒலிபெயர்க்கப்பட்டுள்ளது; சாத்தியமான விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவர்
  rationale: எபிரெய மொழியில் இது நற்பேற்றை வலியுறுத்தும் மரபுத்தொடர். ‘பேறுபெற்றவர்’ என்பது வெறும் மனமகிழ்ச்சியைக் காட்டிலும் ஆழமான நல்வாழ்வையும் அருள்நிலையையும் வெளிப்படுத்தும் இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: נְשׂוּי
  choice: மன்னிக்கப்பட்டு
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல்’ அல்லது ‘சுமந்து அகற்றுதல்.’ மீறுதலுடன் வரும் இச்சூழலில் அதன் வழக்குப் பொருள் ‘மன்னிக்கப்படுதல்’; அடிப்படை உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: פֶּשַׁע
  choice: மீறுதல்
  rationale: இச்சொல் அறிந்தே எல்லையை மீறுதல் அல்லது கிளர்ச்சி செய்தல் என்ற கருத்தைக் கொண்டது. ‘மீறுதல்’ என்பது இணைவரியில் வரும் ‘பாவம்’ என்பதிலிருந்து வேறுபாட்டைத் தக்கவைத்தபடி தமிழில் தெளிவாக உள்ளது.
- source_word: כְּסוּי
  choice: மூடப்பட்டவர்
  rationale: כסה என்பதன் செயப்பாட்டு வடிவம் நேரடியாக ‘மூடப்பட்ட’ எனப் பொருள்படும். மன்னிப்பைச் சித்தரிக்கும் மூடுதல் என்ற கவித்துவ உருவகம் அப்படியே பாதுகாக்கப்படுகிறது.
- source_word: חֲטָאָה
  choice: பாவம்
  rationale: மீறுதலுக்கு இணையாக வரும் இச்சூழலில் இது ஒழுக்கக் குற்றமான பாவத்தையே குறிக்கிறது; ‘பாவப்பலி’ என்பதல்ல.
