lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட துயரத்திற்கான காரணத்தை அறிமுகப்படுத்துகிறது; காரணத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יוֹמָם וָלַיְלָה
  choice: இரவும் பகலும்
  rationale: தொடர்ச்சியான காலத்தைக் குறிக்கும் இணைச்சொல்; தமிழில் வழக்கமான வரிசையில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: תִּכְבַּד ... יָדֶךָ
  choice: உமது கை என்மேல் பாரமாக இருந்தது
  rationale: இறைவனின் கை அழுத்தமாக இருப்பதைக் குறிக்கும் எபிரெய உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: לְשַׁדִּי
  choice: என் உயிராற்றல்
  rationale: உடலின் ஈரம் அல்லது உயிர்ச்சாற்றைக் குறிக்கக்கூடிய அரிய சொல்லை, இச்சூழலில் உயிர் வலிமை தளர்வதாக இயல்பான தமிழில் தருகிறது; நேரடியான படிமம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נֶהְפַּךְ
  choice: வற்றிப்போனது
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘மாறியது’ என்றாலும், கோடை வறட்சியின் சூழலில் ஏற்பட்ட உடல்-உள்ளச் சோர்வை தமிழில் இயல்பாக வெளிப்படுத்துகிறது; நேரடி மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: בְּחַרְבֹנֵי קַיִץ
  choice: கோடைக்கால வறட்சியில்
  rationale: கடும் வெப்பத்தால் உண்டாகும் வறட்சிப் படிமத்தைச் சுருக்கமாகவும் தெளிவாகவும் வழங்குகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: துல்லியமான பொருள் உறுதியாகத் தெரியாத வழிபாட்டு அல்லது இசைக் குறியீடாக இருப்பதால் ஒலிபெயர்த்து விடப்பட்டுள்ளது.
theological_decisions:
- issue: துன்பத்தில் இறைச் செயல்பாடு
  choice: ‘உமது கை என்மேல் பாரமாக இருந்தது’ என்று நேரடியாக வழங்கப்பட்டது.
  alternative: இது பொதுவான துன்பம் என்று மட்டும் மென்மைப்படுத்துதல், அல்லது குறிப்பிட்ட தண்டனைக் கோட்பாடாக வலுப்படுத்துதல்.
  rationale: இறைவனுடைய கை சங்கீதக்காரர்மேல் பாரமாக இருந்ததாக எபிரெய உரை வெளிப்படையாகக் கூறுகிறது; ஆனால் அந்தச் செயலின் முழு இறையியல் இயங்குமுறையை வசனம் வரையறுப்பதில்லை. ஆகவே உருவகமும் அதன் இறையியல் அழுத்தமும் தீர்மானிக்கப்படாமல் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘உமது கை’ என்ற மூல உருவகமும் ‘சேலா’ என்ற தெளிவற்ற வழிபாட்டு/இசைக் குறியீடும் பாதுகாக்கப்பட்டுள்ளன.
