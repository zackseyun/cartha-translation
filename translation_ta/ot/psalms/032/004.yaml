  text: ஏனெனில், பகலும் இரவும் உமது கை என்மேல் பாரமாக இருந்தது; என் உயிராற்றல்[a] கோடைக்கால வறட்சியில் வற்றிப்போனது.[b] சேலா.
  philosophy: optimal-equivalence
