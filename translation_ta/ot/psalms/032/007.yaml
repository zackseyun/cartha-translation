  yaml_path: translation/ot/psalms/032/007.yaml
  text: You are a hiding place for me[a]; from distress you preserve me; you surround me with shouts of deliverance[b]. Selah
translation:
  language: ta
  text: நீரே எனக்கு மறைவிடம்; நெருக்கடியிலிருந்து என்னைக் காக்கிறீர்; விடுதலையின் முழக்கங்களால்[a] என்னைச் சூழ்கிறீர். சேலா[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விடுதலைப் பாடல்கள்’ அல்லது ‘மீட்பின் ஒலிக்கும் கூக்குரல்கள்.’
    reason: lexical_alternative
  - marker: b
    text: ‘சேலா’ என்பது இசை அல்லது வழிபாட்டுமுறை சார்ந்த ஒரு குறிப்பாக இருக்கலாம்; அதன் துல்லியமான பொருள் உறுதியற்றது.
    reason: cultural_note
lexical_decisions:
- source_word: סֵתֶר
  choice: மறைவிடம்
  rationale: மறைந்து பாதுகாப்புப் பெறும் இடத்தைக் குறிக்கும் உருவகத்தை இயல்பான நவீனத் தமிழில் நேரடியாகத் தக்கவைக்கிறது.
- source_word: מִצַּר
  choice: நெருக்கடியிலிருந்து
  rationale: צַר என்பதன் துன்பம், இடுக்கண், நெருக்கடி என்ற பரப்பைத் தக்கவைத்து, குறிப்பிட்ட பகைவனைத் தேவையின்றி முன்வைக்காமல் உள்ளது.
- source_word: תִּצְּרֵנִי
  choice: என்னைக் காக்கிறீர்
  rationale: נצר என்பதன் காத்தல், பாதுகாத்தல் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: רָנֵּי
  choice: மகிழ்ச்சி முழக்கங்கள்
  rationale: ஒலித்து எழும், பொதுவாக மகிழ்ச்சியுடனான கூக்குரல்களைக் குறிக்கும் எபிரேயப் பன்மையின் செறிவை வெளிப்படுத்துகிறது.
- source_word: פַלֵּט
  choice: விடுதலை
  rationale: மீட்பு அல்லது தப்புவித்தல் என்ற கருத்தைத் தருகிறது; பிற்கால இறையியல் சொற்பொருளைத் தேவையின்றி ஏற்றாமல் சூழலுக்கு ஏற்றதாக உள்ளது.
- source_word: תְּסוֹבְבֵנִי
  choice: என்னைச் சூழ்கிறீர்
  rationale: சுற்றிலும் இருத்தல் என்ற கவித்துவப் படிமத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியற்றதால், விளக்கப் பொருளைத் திணிக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: சங்கீதக்காரரைச் சூழும் விடுதலை முழக்கங்களின் இயல்பு மற்றும் மூலம்
  choice: ‘விடுதலையின் மகிழ்ச்சி முழக்கங்கள்’ என்று பொருள் தரப்பட்டு, அவற்றின் மூலத்தைச் சுட்டாமல் விடப்பட்டுள்ளது.
  alternative: வெற்றிப் பாடல்கள்; விடுதலையைப் பற்றிய பாடல்கள்; மீட்பின் ஒலிக்கும் கூக்குரல்கள்
  rationale: רָנֵּי פַלֵּט என்பது செறிவான, பலவாறு புரிந்துகொள்ளத்தக்க சொற்றொடர். கடவுளா, வழிபடுவோரா, சங்கீதக்காரரா அந்த முழக்கங்களின் மூலம் என்பதை உரை தெரிவிக்காததால், மொழிபெயர்ப்பும் அதைத் தீர்மானிக்கவில்லை.
translation_notes:
  register: மரியாதைப் பன்மையுடன் கூடிய நவீன செந்தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. கவிதையின் பாதுகாப்பு உருவகமும் சுருக்கமான இணைநிலைகளும் காக்கப்பட்டுள்ளன; அரிதான ‘சேலா’ மட்டும் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
