  text: I will instruct you and teach you in the way you should go[c][b][a]; I will counsel you with my eye upon you.
translation:
  language: ta
  text: நான் உனக்கு அறிவுறுத்துவேன்; நீ செல்ல வேண்டிய வழியை உனக்குக் கற்பிப்பேன்[a][c]. என் கண் உன்மேல் இருக்கும்போது, உனக்கு ஆலோசனை கூறுவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு விதமாக, “நீ செல்லும் வழியை” அல்லது “இந்த வழியில் நீ செல்வாய்” என மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் நேரடியான எதிர்காலப் பொருளை அனுமதிக்கிறது; ஆனால் அறிவுறுத்தும் சூழல் “நீ செல்ல வேண்டிய வழி” என்ற பொருளை ஆதரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு நெருக்கமாக, “உன்மேல் என் கண்.” இது கவனமான வழிகாட்டுதலையோ அக்கறையுள்ள கண்காணிப்பையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: பேசுபவர் ஆண்டவராகவோ சங்கீதக்காரராகவோ புரிந்துகொள்ளப்படலாம்; இவ்வசனத்தின் எபிரெய உரை பேசுபவர் யார் என்பதை வெளிப்படையாகக் குறிப்பிடவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׂכִּילְךָ
  choice: உனக்கு அறிவூட்டி
  rationale: שׂכל என்பதன் ஹிஃபில் வடிவம் ஒருவருக்குப் புரிதல் அல்லது நுண்ணறிவு உண்டாகச் செய்வதைக் குறிக்கிறது. அடுத்துவரும் ‘கற்பிப்பேன்’ என்பதுடன் இயல்பாக இணையும் வகையில் காரணவினை நுணுக்கத்தை இது காக்கிறது.
- source_word: וְאוֹרְךָ
  choice: உனக்குக் கற்பிப்பேன்
  rationale: ירה என்பதன் ஹிஃபில் வடிவம் கற்பித்தல், அறிவுறுத்தல், வழிகாட்டுதல் ஆகிய பொருள்களை உடையது. ‘வழி’ என்ற தொடருடன் வழிகாட்டும் நுணுக்கமும் நிலைத்திருக்கிறது.
- source_word: בְּדֶרֶךְ זוּ תֵלֵךְ
  choice: நீ செல்ல வேண்டிய வழியை
  rationale: சொல்லுக்கு நெருக்கமாக இது ‘நீ செல்லும்/செல்வாய் என்ற வழியில்’ என அமையலாம். அறிவுறுத்தல் சூழலில் நோக்கமுள்ள வழிகாட்டுதலை இயல்பான தமிழில் வெளிப்படுத்த ‘செல்ல வேண்டிய வழி’ எனத் தரப்பட்டுள்ளது; மாற்று எதிர்கால வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אִיעֲצָה
  choice: ஆலோசனை கூறுவேன்
  rationale: יעץ என்பது ஆலோசனை அல்லது அறிவுரை வழங்குவதைக் குறிக்கிறது. சங்கீதத்தின் மதிப்புமிக்க ஞானநடை தமிழில் ‘ஆலோசனை கூறுவேன்’ என்று இயல்பாக வெளிப்படுகிறது.
- source_word: עָלֶיךָ עֵינִי
  choice: என் கண் உன்மேல் இருக்க
  rationale: ‘உன்மேல் என் கண்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, கவனமான வழிகாட்டுதல் அல்லது அக்கறையுள்ள கண்காணிப்பு என்ற இரு சாத்தியங்களையும் திறந்தவையாக வைக்கிறது.
theological_decisions:
- issue: சங்கீதம் 32:8-இல் பேசுபவர் யார்?
  choice: முதலாம் நபர் கூற்றை அப்படியே வைத்து, பேசுபவர் யார் என்பதை முதன்மை உரையில் குறிப்பிடவில்லை.
  alternative: பேசுபவர் ஆண்டவர் என்று வெளிப்படையாகக் குறிப்பிடுதல், அல்லது சங்கீதக்காரர் கேட்பவரிடம் பேசுகிறார் என்று குறிப்பிடுதல்.
  rationale: இவ்வசனத்தின் எபிரெய உரை பேசுபவரை வெளிப்படையாக அடையாளப்படுத்தவில்லை. ஆகவே இறையியல் சார்ந்த அந்தத் திறந்த நிலையை மொழிபெயர்ப்பு தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும், அதேவேளையில் சங்கீதத்திற்குரிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘கண்’ உருவகம் தக்கவைக்கப்பட்டு, பேசுபவரின் அடையாளமும் வழியைப் பற்றிய இலக்கணத் தெளிவின்மையும் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
