  text: For when I kept silent[a], my bones wasted away through my groaning all day long.
translation:
  language: ta
  text: ஏனெனில், நான் மௌனமாக இருந்தபோது, நாள் முழுவதும் என் கதறலினால் என் எலும்புகள் தேய்ந்துபோயின.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுடன் இவ்வசனத்தை விளக்க உறவில் இணைக்கிறது. தொடர்ந்து வரும் ‘இருந்தபோது’ என்பதுடன் சேர்ந்து, எபிரெயச் சொல்லின் சூழல்சார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הֶחֱרַשְׁתִּי
  choice: நான் மௌனமாக இருந்தபோது
  rationale: חרשׁ என்பதன் ‘மௌனமாக இரு’ என்ற பொருளையும், இங்கு நீடித்திருந்த நிலையையும் வெளிப்படுத்துகிறது; எதைப் பற்றிய மௌனம் என்பது மூலத்தில் கூறப்படாததால் அதைச் சேர்க்கவில்லை.
- source_word: בָּלוּ
  choice: தேய்ந்துபோயின
  rationale: בלה குறிக்கும் தேய்தல் அல்லது சிதைவடைதலை, எலும்புகளை மையமாகக் கொண்ட கவித்துவ உருவகத்துடன் இயல்பாகத் தக்கவைக்கிறது.
- source_word: עֲצָמַי
  choice: என் எலும்புகள்
  rationale: உள்ளார்ந்த துயரத்தை உடல் சார்ந்த படிமத்தின் வழியாகச் சொல்லும் எபிரெயக் கவிதை மொழியை நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּשַׁאֲגָתִי
  choice: எழுப்பிய என் கதறலால்
  rationale: שׁאגה என்பது கர்ஜனை போன்ற உரத்த ஓசையைக் குறிக்கலாம்; இச்சூழலில் வேதனையுடன் வெளிப்படும் உரத்த அழுகையை ‘கதறல்’ இயல்பாக உணர்த்துகிறது. בְּ இங்குக் காரணம் அல்லது உடன்நிகழும் வழிமுறையைக் குறிக்கிறது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: தொடர்ச்சியான கால நீளத்தை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: மௌனம் ஒப்புக்கொள்ளப்படாத பாவத்தைப் பற்றியது என்பதை வெளிப்படையாகச் சொல்வதா
  choice: முதன்மை உரையில் மறைபொருளாகவே விடப்பட்டது
  alternative: ‘என் பாவத்தைப் பற்றிப் பேசாமல் நான் மௌனமாக இருந்தபோது’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சுற்றியுள்ள வசனங்கள் அந்த மௌனத்தின் பொருளைத் தெளிவுபடுத்தினாலும், இவ்வசனத்தின் எபிரெய மூலத்தில் ‘பாவம்’ என்ற செயப்படுபொருள் இல்லை. எனவே விளக்கத்தை உரைக்குள் சேர்க்காமல் மூலத்தின் சுருக்கத்தையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எலும்புகள் தேய்ந்துபோயின’ என்ற உடல் சார்ந்த உருவகம் மாற்றமின்றித் தக்கவைக்கப்பட்டுள்ளது.
