  yaml_path: translation/ot/psalms/032/011.yaml
  text: Be glad in Yahweh and rejoice[a], you righteous; shout for joy[b], all you upright in heart.
translation:
  language: ta
  text: 'நீதிமான்களே, யாவேயில் மகிழ்ந்து களிகூருங்கள்;


    உள்ளம் நேர்மையான அனைவரே, மகிழ்ச்சியுடன் ஆர்ப்பரியுங்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘மகிழ்ச்சியுடன் பாடுங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை, கூவியோ பாடியோ வெளிப்படும் ஒலித்தெழும் மகிழ்ச்சியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: மகிழ்ந்து
  rationale: שׂמח என்ற வினையின் பன்மை ஏவல் வடிவம் மகிழ்ச்சிக்கான அழைப்பைத் தருகிறது. அடுத்துள்ள גיל என்பதிலிருந்து வேறுபடுத்தி, இயல்பான தமிழில் இணை ஏவலாக அமைக்கப்பட்டது.
- source_word: בַיהוָה
  choice: யாவேயில்
  rationale: ב இங்கு மகிழ்ச்சியின் தளத்தையோ மையத்தையோ குறிக்கிறது; ‘யாவேயில்’ என்பது ‘in YHWH’ என்ற தொடர்பைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய உரையில் வரும் இறைநாமமான יהוה, ஒரு பொதுப் பட்டத்தால் மாற்றப்படாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- source_word: וְגִילוּ
  choice: களிகூருங்கள்
  rationale: גיל மிகுந்த, வெளிப்படையான மகிழ்ச்சியைக் குறிக்கிறது. ‘களிகூருங்கள்’ அதன் ஏவல் வலிமையையும் שׂמח என்பதிலிருந்து உள்ள நுண்ணிய வேறுபாட்டையும் காக்கிறது.
- source_word: צַדִּיקִים
  choice: நீதிமான்களே
  rationale: இது ஏவல்களைப் பெறுவோரைக் கூப்பிட்டு அழைக்கும் பன்மைச் சொல்; தமிழ் விளிவேற்றுமை நேரடி அழைப்பைத் தெளிவாக்குகிறது.
- source_word: וְהַרְנִינוּ
  choice: மகிழ்ச்சியுடன் ஆர்ப்பரியுங்கள்
  rationale: רנן ஒலித்தெழும் மகிழ்ச்சிக் கூக்குரலையோ மகிழ்ச்சிப் பாடலையோ குறிக்கலாம். ‘ஆர்ப்பரியுங்கள்’ அதன் கேட்கத்தக்க, உற்சாகமான தன்மையை வெளிப்படுத்துகிறது; மாற்று நுண்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל
  choice: அனைவரே
  rationale: அழைக்கப்படும் முழுக் குழுவையும் உள்ளடக்கும் כָּל என்பதன் பரப்பை இயல்பான தமிழ் அழைப்பு வடிவில் தருகிறது.
- source_word: יִשְׁרֵי לֵב
  choice: உள்ளத்தில் நேர்மையான
  rationale: இது உள்ளார்ந்த ஒழுக்க நேர்மையைக் குறிக்கும் எபிரெய மொழிவழக்கு. ‘உள்ளத்தில் நேர்மையான’ என்பது ‘இதயம்’ சார்ந்த உள்நிலையைப் பாதுகாத்து நவீன தமிழில் இயல்பாக உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல எபிரெய உரை יהוה என்ற தனிப்பட்ட இறைநாமத்தை நேரடியாகப் பயன்படுத்துகிறது. அதை ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது; ‘ஆண்டவர்’ என்பது பெயருக்குப் பதிலாக ஒரு பட்டத்தை வழங்கும்.
- issue: בַיהוָה என்பதில் ב குறிக்கும் உறவு
  choice: யாவேயில்
  alternative: யாவேவை முன்னிட்டு
  rationale: ב என்பது இங்கு மகிழ்ச்சியின் தளம், மையம் அல்லது பொருள் என்ற தொடர்பைத் தரக்கூடும். ‘யாவேயில்’ மூலத்தின் சுருக்கத்தையும் திறந்த நுண்பொருளையும் பாதுகாக்கிறது; காரணம் அல்லது பொருள் என்று மட்டும் தீர்மானிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. இணையான இரு அழைப்புகளும் அரைப்புள்ளியால் பிரிக்கப்பட்டு எபிரெயச் செய்யுளின் சமச்சீர் அமைப்பு காக்கப்பட்டது.
