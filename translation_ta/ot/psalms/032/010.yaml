    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: பல
  rationale: எண்ணிக்கையின் மிகுதியைத் தெரிவிக்கும் சொல்லை இயல்பான நவீன தமிழில் வழங்குகிறது; எபிரெய மூலத்தின் வலியுறுத்தலையும் காக்கிறது.
- source_word: מַכְאוֹבִים
  choice: வேதனைகள்
  rationale: உடல் வலி, மனத் துயரம், வாழ்வுத் துன்பம் ஆகிய பரந்த பொருள் எல்லையையும் ஓரளவு தக்கவைக்கிறது; பிற சாத்தியங்களை அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: לָרָשָׁע
  choice: தீயவனுக்கு
  rationale: לְ முன்னிடைச்சொல்லின் தொடர்பு/உடைமைப் பொருளை சுருக்கமாகக் காட்டுகிறது. எபிரெய ஒருமை பிரதிநிதித்துவப் பொதுமையாக இருப்பதால் ஒரு குறிப்பிட்ட ஆணை மட்டும் சுட்டுவதில்லை.
- source_word: וְהַבּוֹטֵחַ
  choice: ஆனால் … நம்பிக்கை வைக்கிறவனை
  rationale: பெயர்ச்சொல் போலச் செயல்படும் நிகழ்காலப் பங்கேற்புச் சொல்லை இயல்பாக வழங்குகிறது; இரு அரையடிகளின் முரண்பாட்டால் וְ என்பதை ‘ஆனால்’ என மொழிபெயர்க்கிறது.
- source_word: בַּיהוָה
  choice: யாவேமீது
  rationale: בטח உடன் வரும் בְ நம்பிக்கையின் சார்பிடத்தைக் குறிக்கிறது; ‘மீது நம்பிக்கை வைத்தல்’ என்பது இயல்பான தமிழ். திருப்பெயர் ஒலிபெயர்ப்பாகத் தக்கவைக்கப்படுகிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: நிலைத்தன்மை, பற்றுறுதி, இரக்கம் ஆகியவற்றை உள்ளடக்கும் சொல்லின் செறிவை வாசிக்க எளிய தமிழில் தெரிவிக்கிறது; அதன் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: יְסוֹבְבֶנּוּ
  choice: சூழ்ந்துகொள்ளும்
  rationale: சுற்றிலும் இருப்பது அல்லது அரணாக வளைத்துக்கொள்வது என்ற வினையின் உருவகத்தைத் தக்கவைக்கிறது; மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு நம்புகிறவரைக் குறிக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் நேரடியாக வரும் நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பால் வழங்குகிறது.
- issue: רָשָׁע என்ற ஆண்பால் ஒருமையின் பிரதிநிதித்துவத் தன்மை
  choice: தீயவன்
  alternative: தீய மனிதன் / தீயவர்கள்
  rationale: எபிரெய ஒருமை வடிவத்தைத் தக்கவைத்தாலும், அது ஒரு குறிப்பிட்ட ஆணை மட்டுமல்லாமல் தீமை செய்கிற எவரையும் பொதுவாகக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது.
- issue: חֶסֶד என்பதன் இறையியல் செறிவு
  choice: மாறாத அன்பு
  alternative: இரக்கம் / பற்றுறுதியுள்ள அன்பு / உடன்படிக்கை அன்பு
  rationale: ஒரே குறிப்பிட்ட இறையியல் விளக்கத்துக்குள் சொல்லைச் சுருக்காமல், அதன் நிலைத்த அன்பும் பற்றுறுதியும் முன்னிலைப்படுத்தப்படுகின்றன; பிற நியாயமான பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான ஓசையுடனும் அமைக்கப்பட்டது. ‘வேதனைகள் பல’ என்ற சொல்வரிசை மூலத்தின் வலியுறுத்தலை மென்மையாகத் தக்கவைக்கிறது; ‘சூழ்ந்துகொள்ளும்’ என்பது கவித்துவ உருவகத்தைப் பாதுகாக்கிறது.
