source:
  edition: WLC
  text: רַבִּ֥ים מַכְאוֹבִ֗ים לָ/רָ֫שָׁ֥ע וְ/הַ/בּוֹטֵ֥חַ בַּ/יהוָ֑ה חֶ֝֗סֶד יְסוֹבְבֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/010.yaml
  text: Many pains belong to the wicked[b][a], but steadfast love surrounds the one who trusts in Yahweh.
translation:
  language: ta
  text: 'தீயவனுக்கு வேதனைகள் பல[a]; ஆனால் யாவேமீது நம்பிக்கை வைக்கிறவனை மாறாத அன்பு[b] சூழ்ந்துகொள்ளும்.


    [a] “வேதனைகள்” என்பதற்கான எபிரெயச் சொல் துயரங்கள், வலிகள் அல்லது துன்பங்கள் என்றும் பொருள்படலாம்.

    [b] “மாறாத அன்பு” என்பதற்கான எபிரெயச் சொல் חֶסֶד (ஹெசெத்); சூழலுக்கேற்ப இது இரக்கம், பற்றுறுதியுள்ள அன்பு அல்லது உடன்படிக்கை அன்பு என்றும் மொழிபெயர்க்கப்படலாம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வேதனைகள்” என்பதற்கான எபிரெயச் சொல் துயரங்கள், வலிகள் அல்லது துன்பங்கள் என்றும் பொருள்படலாம்.
    reason: lexical_alternative
