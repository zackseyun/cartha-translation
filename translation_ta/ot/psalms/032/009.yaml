source:
  edition: WLC
  text: אַל תִּֽהְי֤וּ כְּ/ס֥וּס כְּ/פֶרֶד֮ אֵ֤ין הָ֫בִ֥ין בְּ/מֶֽתֶג וָ/רֶ֣סֶן עֶדְי֣/וֹ לִ/בְל֑וֹם בַּ֝֗ל קְרֹ֣ב אֵלֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
translation:
  language: ta
  text: அறிவில்லாத குதிரையையோ கோவேறு கழுதையையோ போல நீங்கள் இருக்காதீர்கள். அதைக் கட்டுப்படுத்த, அதன் அணிகலனாக வாய்க்கடிவாளமும் தலைக்கடிவாளமும் பூட்ட வேண்டும்; இல்லையெனில் அது உன்னிடம் நெருங்காது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அது உன்னிடம் நெருங்காதபடி.” எபிரெயத்தில் கடைசிக் கூற்று கடினமானது. கட்டுப்படுத்தினால்தான் விலங்கு நெருங்கும் என்றும், அது உன்னிடம் நெருங்காதபடி அதைக் கட்டுப்படுத்த வேண்டும் என்றும் இதைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: நீங்கள் இருக்காதீர்கள்
  rationale: אַל உடன் வரும் היה வினையின் பன்மை வடிவம் தடையைத் தெரிவிக்கிறது. தமிழில் இயல்பான பன்மைத் தடை வடிவமாக மொழிபெயர்க்கப்பட்டது.
- source_word: כְּסוּס כְּפֶרֶד
  choice: குதிரையையோ கோவேறு கழுதையையையோ போல
  rationale: כְּ ஒப்புமையையும், סוּס ‘குதிரை’ என்பதையும், פֶרֶד ‘கோவேறு கழுதை/மியூல்’ என்பதையும் குறிக்கிறது. நவீனத் தமிழில் விலங்கைத் தெளிவாக அடையாளப்படுத்த ‘கோவேறு கழுதை’ பயன்படுத்தப்பட்டது.
- source_word: אֵין הָבִין
  choice: அறிவில்லாத
  rationale: புரிந்துகொள்ளுதல் அல்லது பகுத்தறிவு இல்லாமையைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: בְּמֶתֶג וָרֶסֶן
  choice: வாய்க்கடிவாளமும் தலைக்கடிவாளமும்
  rationale: מֶתֶג என்பது வாயில் பொருத்தப்படும் கட்டுப்பாட்டுக் கருவியையும், רֶסֶן என்பது கடிவாளம் அல்லது தலைப்பகுதியில் இடப்படும் கட்டுப்பாட்டையும் குறிக்கிறது. இரண்டு வேறுபட்ட உபகரணங்கள் தமிழில் தெளிவாகத் தெரியும் வகையில் மொழிபெயர்க்கப்பட்டன.
- source_word: עֶדְיוֹ
  choice: அதன் அணிகலனாக
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘அணி/அலங்காரம்’. இங்கு விலங்கின்மேல் பூட்டப்படும் கடிவாளச் சாதனங்களைச் சுட்டுவதால், உருவகத்தை அழிக்காமல் ‘அணிகலனாக’ என வைக்கப்பட்டது.
- source_word: לִבְלֹם
  choice: அதைக் கட்டுப்படுத்த
  rationale: בלם என்பது அடக்குதல், தடுத்தல், கட்டுப்பாட்டில் வைத்தல் என்ற பொருளுடையது. கடிவாளச் சூழலில் ‘கட்டுப்படுத்த’ இயல்பான தமிழாகும்.
- source_word: בַּל קְרֹב אֵלֶיךָ
  choice: இல்லையெனில் அது உன்னிடம் நெருங்காது
  rationale: கடைசிக் கூற்று எபிரெயத்தில் கடினமும் இருபொருள் வாய்ந்ததுமாக உள்ளது. முதன்மை உரை, விலங்கு கட்டுப்படுத்தப்படாவிட்டால் கையாளுபவரிடம் நெருங்காது என்ற புரிதலைப் பின்பற்றுகிறது; மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது. אֵלֶיךָ ஒருமை என்பதால் ‘உன்னிடம்’ வைக்கப்பட்டது.
theological_decisions:
- issue: கடைசிக் கூற்றில் கடிவாளத்தின் நோக்கம்
  choice: கட்டுப்படுத்தப்படாவிட்டால் விலங்கு உன்னிடம் நெருங்காது
  alternative: விலங்கு உன்னிடம் நெருங்காதபடி அதைக் கட்டுப்படுத்த வேண்டும்
  rationale: בַּל קְרֹב אֵלֶיךָ என்பதன் தொடரியல் உறவு உறுதியற்றது. இரண்டு வாசிப்புகளும் சாத்தியம்; எந்தத் தெய்வவியல் விளக்கத்தையும் திணிக்காமல் முதன்மை வாசிப்பும் மாற்று வாசிப்பும் தனித்தனியாகக் கொடுக்கப்பட்டன.
translation_notes:
  register: நவீன, மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டது. எபிரெயத்தில் தொடக்கக் கட்டளை பன்மையாகவும் இறுதியிலுள்ள ‘உன்னிடம்’ ஒருமையாகவும் இருப்பதால் அந்த இலக்கண மாற்றம் மொழிபெயர்ப்பிலும் பாதுகாக்கப்பட்டது. விலங்கு குறித்த ஒருமை உருவகமும் தொடர்கிறது.
