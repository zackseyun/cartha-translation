base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/005.yaml
  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
translation:
  language: ta
  text: என் பாவத்தை உமக்கு அறிவித்தேன்; என் அக்கிரமத்தை நான் மறைக்கவில்லை. “என் மீறுதல்களை யாவேவிடம் ஒப்புக்கொள்வேன்” என்று சொன்னேன்; நீரோ என் பாவக் குற்றத்தை மன்னித்தீர்.[a] சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில், “என் பாவக் குற்றத்தைத் தூக்கினீர்” அல்லது “சுமந்தீர்.” குற்றச்சுமையைத் தூக்கும் உருவகத்தைக் கொண்ட இவ்வினைச்சொல் இங்கே “மன்னித்தீர்” என்று பொருள்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטָּאתִי
  choice: என் பாவம்
  rationale: חטאת என்பதன் நேரடியான, இயல்பான பொருள் ‘பாவம்’; இவ்வசனத்திலுள்ள மூன்று பாவச் சொற்களின் வேறுபாட்டையும் இது காக்கிறது.
- source_word: אוֹדִיעֲךָ
  choice: உமக்கு அறிவித்தேன்
  rationale: ידע என்பதன் ஹிப்இல் வடிவம் ‘அறியச் செய்தல்’ என்று பொருள்படும்; தமிழில் ‘அறிவித்தேன்’ என்பது அந்தச் செயப்படுத்தும் உணர்வை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲוֺנִי
  choice: என் அக்கிரமம்
  rationale: עון என்பது அக்கிரமம், குற்றம் அல்லது அதன் குற்றச்சுமை ஆகியவற்றைக் குறிக்கலாம்; இங்கு חטאת, פשע என்பவற்றிலிருந்து சொற்பொருள் வேறுபாட்டைக் காக்க ‘அக்கிரமம்’ பயன்படுத்தப்பட்டது.
- source_word: כִסִּיתִי
  choice: மறைக்கவில்லை
  rationale: כסה என்பதன் அடிப்படைப் பொருள் ‘மூடுதல்’; பாவத்தை மூடி வைக்காமல் வெளிப்படுத்துதல் என்ற உருவகத்தை நவீன தமிழில் ‘மறைக்கவில்லை’ தெளிவாகத் தருகிறது.
- source_word: אוֹדֶה
  choice: அறிக்கையிடுவேன்
  rationale: ידה என்பதன் ஹிப்இல் வடிவம் சூழலுக்கேற்ப துதித்தல் அல்லது அறிக்கையிடுதல் எனப் பொருள்படும்; ‘என் மீறுதல்கள்’ என்பதே பொருளாக வருவதால் இங்கு பாவ அறிக்கைதான் குறிக்கப்படுகிறது.
- source_word: עֲלֵי פְשָׁעַי
  choice: என் மீறுதல்களை
  rationale: அறிக்கையிடப்படும் காரியத்தை על சுட்டுகிறது; தமிழில் இயல்பாக நேரடிச் செயப்படுபொருளாக வழங்கப்பட்டது.
- source_word: לַיהוָה
  choice: யாவேவிடம்
  rationale: יהוה என்ற உடன்படிக்கைப் பெயர் மொழிபெயர்க்கப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது; அறிக்கையிடுதலின் நோக்குநரைத் தமிழில் ‘-விடம்’ இயல்பாகக் குறிக்கிறது.
- source_word: נָשָׂאתָ
  choice: மன்னித்தீர்
  rationale: נשא என்பதற்கு ‘தூக்குதல், சுமத்தல்/சுமத்திச் செல்லுதல்’ என்ற அடிப்படைப் பொருள் உண்டு; அக்கிரமத்தோடு வரும்போது அது மன்னிப்பை மரபுத்தொடராகக் குறிக்கிறது. மூல உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: עֲוֺן חַטָּאתִי
  choice: என் பாவத்தின் குற்றம்
  rationale: இந்த இணைப்புத் தொடரைத் தட்டையாக்காமல், பாவத்தால் உண்டான குற்றநிலையை வெளிப்படுத்தும் வகையில் மொழிபெயர்க்கப்பட்டது; அதேவேளை தமிழில் இயல்பாக உள்ளது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான செயல்பாடு உறுதியற்றதால் விளக்கப் பொருள் திணிக்காமல் ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இருப்பதால் அதை பொதுப்பட்டமாக மாற்றாமல் ‘யாவே’ என வழங்குவது மூல வேறுபாட்டைக் காக்கிறது.
- issue: נָשָׂאתָ עֲוֺן என்பதிலுள்ள உருவகத்தையா மரபுத்தொடரின் பொருளையா முதன்மைப்படுத்துவது
  choice: முதன்மை உரையில் ‘மன்னித்தீர்’; அடிக்குறிப்பில் ‘தூக்கி அகற்றினீர்/சுமந்து அகற்றினீர்’
  alternative: என் பாவத்தின் குற்றத்தைத் தூக்கி அகற்றினீர்
  rationale: சூழலில் இறைமன்னிப்பே தெளிவான கருத்து. இயல்பான தமிழுக்காக அந்தப் பொருள் முதன்மை உரையில் தரப்பட்டாலும், குற்றச்சுமை அகற்றப்படும் மூல உருவகம் அடிக்குறிப்பில் விடப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழை அடிப்படையாகக் கொண்ட, பொதுவாசகர்களுக்கு விளங்கும் கண்ணியமான நடை. சங்கீதப் பேச்சின் மரியாதையைப் பேண இறைவனை நோக்கி ‘உமக்கு/நீரோ/மன்னித்தீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. חטאת, עון, פשע ஆகியவற்றின் வேறுபாடு முறையே ‘பாவம், அக்கிரமம்/குற்றம், மீறுதல்’ என இயன்றவரை காக்கப்பட்டுள்ளது.
