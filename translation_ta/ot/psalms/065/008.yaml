source:
  edition: WLC
  text: וַ/יִּ֤ירְא֨וּ יֹשְׁבֵ֣י קְ֭צָוֺת מֵ/אוֹתֹתֶ֑י/ךָ מ֤וֹצָֽאֵי בֹ֖קֶר וָ/עֶ֣רֶב תַּרְנִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/008.yaml
  text: Those who dwell at the ends of the earth fear because of your signs[b][a]; you make the dawn and the evening shout for joy.
translation:
  language: ta
  text: பூமியின் கடையெல்லைகளில் வாழ்கிறவர்கள் உமது அடையாளங்களைக் கண்டு அஞ்சுகின்றனர்[a]; விடியலையும் மாலையையும் நீர் மகிழ்ச்சியுடன் ஆர்ப்பரிக்கச் செய்கிறீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது அடையாளங்களைக் கண்டு பயபக்தியுடன் வியந்து நிற்கின்றனர்.” எபிரெய வினை அச்சம், திகில், அல்லது பயபக்தியுடன் கூடிய வியப்பு ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “காலை மற்றும் மாலையின் புறப்பாடுகள்.” இந்தக் கவிதைச் சொற்றொடர் விடியலையும் அந்தியையும், அல்லது காலையும் மாலையும் தோன்றும் இடங்களையோ நேரங்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: அஞ்சுகின்றனர்
  rationale: יָרֵא என்ற வினை அச்சம், திகில், பயபக்தியுடன் கூடிய வியப்பு ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘அஞ்சுகின்றனர்’ என்பது அவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் அதன் பரந்த பொருளைப் பேணுகிறது.
- source_word: יֹשְׁבֵי קְצָוֺת
  choice: பூமியின் கடையெல்லைகளில் வாழ்கிறவர்கள்
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘எல்லைகளில்/கோடிகளில் குடியிருப்போர்’ என்று பொருள்பட்டு, உலகின் மிகத் தொலைவான பகுதிகளில் வாழ்வோரைக் குறிக்கிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘பூமியின்’ சேர்க்கப்பட்டுள்ளது.
- source_word: מֵאוֹתֹתֶיךָ
  choice: உமது அடையாளங்களைக் கண்டு
  rationale: அச்சத்தைக் குறிக்கும் வினைக்குப் பின் வரும் מִן காரணத்தையோ தூண்டுதலையோ குறிக்கலாம். ‘கண்டு’ என்பது தேவனுடைய அடையாளச் செயல்களால் அவர்களிடம் இந்த எதிர்வினை உண்டாவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אוֹתֹתֶיךָ
  choice: உமது அடையாளங்கள்
  rationale: אוֹת என்பது முதன்மையாக ‘அடையாளம்’; இங்கு அது தேவ வல்லமையை வெளிப்படுத்தும் செயல்களைக் குறிக்கிறது. ‘அற்புதங்கள்’ என்பதைவிட ‘அடையாளங்கள்’ மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: காலையின் உதயத்தையும் மாலையின் வரவையும்
  rationale: מוֹצָאֵי என்பதற்கு ‘புறப்பாடுகள்/வெளிப்படுதல்கள்’ என்பது நேரடிப் பொருள். காலை தோன்றுவதையும் மாலை வந்தடைவதையும் குறிக்கும் கவிதைமிகு இயல்பான தமிழாக இவ்வாறு தரப்பட்டுள்ளது; இடம் அல்லது கால எல்லை என்ற சாத்தியம் அடிக்குறிப்பில் பேணப்படுகிறது.
- source_word: תַּרְנִין
  choice: மகிழ்ச்சியால் ஆர்ப்பரிக்கச் செய்கிறீர்
  rationale: רנן என்பதன் ஹிஃபில் வடிவம் மகிழ்ச்சியுடன் முழங்கவோ பாடவோ செய்வித்தலைக் குறிக்கிறது. இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் தேவனையே செய்பவராகக் காட்டுகிறது; ‘ஆர்ப்பரிக்கச் செய்கிறீர்’ அதன் உயிரோட்டமான மகிழ்ச்சியைப் பேணுகிறது.
theological_decisions:
- issue: தேவனுடைய அடையாளங்களுக்கு மனிதர்கள் காட்டும் எதிர்வினையின் தன்மை
  choice: அது வெறும் திகிலா அல்லது பயபக்தியுடன் கூடிய வியப்பா என்று வரையறுக்காமல் ‘அஞ்சுகின்றனர்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘வியந்து நிற்கின்றனர்’ என்று கொடுத்து பயபக்தியை வலியுறுத்துதல், அல்லது ‘திகிலடைகின்றனர்’ என்று கொடுத்து அச்சத்தை வலியுறுத்துதல்.
  rationale: எபிரெய வினை அச்சம் முதல் பயபக்தியுள்ள வியப்பு வரையிலான பொருட்களை அனுமதிக்கிறது. சூழல் தீர்மானிக்காத வேறுபாட்டை மொழிபெயர்ப்பு செயற்கையாகத் தீர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையிலும் சங்கீதத்திற்குரிய கண்ணியமான கவிதைத் தொனியுடனும் அமைக்கப்பட்டது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘செய்கிறீர்’ பயன்படுத்தப்பட்டுள்ளன.
