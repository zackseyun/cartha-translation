  register: நவீனத் தரத் தமிழில் கவிதைநயமும் நிலப்பரப்பு உருவகமும் பேணப்பட்டுள்ளன. ‘வனாந்தரம்’ என்பது முழுமையான மணற்பாலையைக் கட்டாயப்படுத்தாமல் பயிரிடப்படாத புறநிலத்தைக் குறிக்கிறது; ‘அரைக்கச்சையாகக் கட்டிக்கொள்கின்றன’ மூலத்தின் மனிதப்படுத்தலையும் חגר வினையின் உடல் சார்ந்த படிமத்தையும் காக்கிறது.
