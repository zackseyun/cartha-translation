  yaml_path: translation/ot/psalms/065/012.yaml
  text: The pastures of the wilderness drip[b][a], and the hills gird themselves with rejoicing.
translation:
  language: ta
  text: வனாந்தரத்தின் மேய்ச்சல் நிலங்கள் சொட்டுகின்றன[a]; குன்றுகள் மகிழ்ச்சியை இடுப்பில் கட்டிக்கொள்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிறைவாகப் பொழிகின்றன”; எபிரெய வினைச்சொல் ஈரம் சொட்டுவதையோ மிகுதியாகப் பொழிவதையோ சித்தரிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “குன்றுகள் மகிழ்ச்சியை அணிந்துகொள்கின்றன.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעֲפוּ
  choice: செழிப்பைப் பொழிகின்றன
  rationale: רָעַף என்பது சொட்டுதல், வடிதல் அல்லது பொழிதல் என்ற உயிரோட்டமான படிமத்தைத் தருகிறது. இங்கு மழையால் உண்டாகும் வளம் சூழலில் உள்ளதால், ‘செழிப்பைப் பொழிகின்றன’ என்பது உருவகத்தையும் மிகுதியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: נְאוֹת
  choice: மேய்ச்சல் நிலங்கள்
  rationale: נָוֶה இச்சூழலில் கால்நடைகள் மேயும் புல்வெளிகளைக் குறிக்கிறது; ‘மேய்ச்சல் நிலங்கள்’ தெளிவான நவீனத் தமிழ்.
- source_word: מִדְבָּר
  choice: வனாந்தரம்
  rationale: מִדְבָּר என்பது மணற்பாலை மட்டும் அல்லாமல் பயிரிடப்படாத வறண்ட புறநிலத்தையும் குறிக்கலாம். ‘வனாந்தரம்’ அந்த விரிவைத் தக்கவைக்கிறது.
- source_word: גִיל
  choice: மகிழ்ச்சி
  rationale: גִּיל பேருவகை அல்லது களிப்பைக் குறிக்கும் பெயர்ச்சொல். ‘மகிழ்ச்சி’ மலைகளை மனிதர்போல் சித்தரிக்கும் உருவகத்தில் இயல்பாக அமைகிறது.
- source_word: גְּבָעוֹת
  choice: குன்றுகள்
  rationale: גְּבָעוֹת என்பதற்கான நேரடியான, பொதுவாகப் புரியும் தமிழ் இணை ‘குன்றுகள்’.
- source_word: תַּחְגֹּרְנָה
  choice: அரைக்கச்சையாகக் கட்டிக்கொள்கின்றன
  rationale: חָגַר என்பதன் அடிப்படைப் பொருள் இடுப்பைச் சுற்றிக் கட்டுதல் அல்லது அரைக்கச்சை கட்டுதல். பொதுவான ‘அணிந்துகொள்கின்றன’ என்பதைவிட இத்தேர்வு மூல உருவகத்தைத் தெளிவாகக் காக்கிறது.
