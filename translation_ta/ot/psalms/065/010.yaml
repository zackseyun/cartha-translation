id: PSA.65.10
reference: Psalms 65:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: תְּלָמֶ֣י/הָ רַ֭וֵּה נַחֵ֣ת גְּדוּדֶ֑י/הָ בִּ/רְבִיבִ֥ים תְּ֝מֹגְגֶ֗/נָּה צִמְחָ֥/הּ תְּבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/010.yaml
  text: Saturate its furrows; settle its ridges. With showers you soften it; you bless its growth.
translation:
  language: ta
  text: 'அதன் சால்களை நிறைவாக நனைக்கிறீர்;

    அதன் மண் மேடுகளை அமரச் செய்கிறீர்.

    மழைப்பொழிவுகளால் அதை மென்மையாக்குகிறீர்;

    அதன் விளைச்சலை ஆசீர்வதிக்கிறீர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּלָמֶיהָ
  choice: அதன் சால்களை
  rationale: உழுத நிலத்தில் உருவாகும் வரப்புகளுக்கு இடையிலான நீண்ட பள்ளங்கள் அல்லது உழவுச்சால்கள் என்பதைக் குறிக்கிறது; வேளாண்மைச் சூழலை இயல்பாகத் தருகிறது.
- source_word: רַוֵּה
  choice: நிறைவாக நனைக்கிறீர்
  rationale: நீர் ஊறுமளவு செறிவாக நனைத்தல் என்ற causative பொருளை வெளிப்படுத்துகிறது.
- source_word: נַחֵת גְּדוּדֶיהָ
  choice: அதன் மண் மேடுகளைத் தணியச் செய்கிறீர்
  rationale: נחת என்பதன் 'தாழ்த்துதல்/அடங்கச் செய்தல்' என்ற கருத்தையும், גְּדוּדִים என்பதன் உழுத நிலத்தின் மேடுகள் அல்லது கட்டிகள் என்ற சூழல்சார் பொருளையும் காக்கிறது; மழையால் அவை அமர்ந்து தணிவதைச் சுட்டுகிறது.
- source_word: בִּרְבִיבִים
  choice: மழைத்துளிகளால்
  rationale: அடிக்கடி பெய்யும் மழை அல்லது மழைப்பொழிவுகளைச் சுட்டும் சொல்லை எளிய நவீன தமிழில் தருகிறது.
- source_word: תְּמֹגְגֶנָּה
  choice: அதை மென்மையாக்குகிறீர்
  rationale: மழை மண்ணைக் கரையச்செய்து இளக வைப்பதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: צִמְחָהּ
  choice: அதன் விளைச்சலை
  rationale: முளைப்பு அல்லது வளர்ச்சி என்ற அடிப்படைப் பொருளில், பயிர்நிலச் சூழலில் உருவாகும் வளர்ச்சியையும் விளைவையும் குறிக்கிறது.
- source_word: תְּבָרֵךְ
  choice: ஆசீர்வதிக்கிறீர்
  rationale: தெய்வீக அருளும் செழிப்பளித்தலும் அடங்கிய வினையை நேரடியாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: படைப்பில் தேவனுடைய தொடர்ச்சியான செயற்பாடு
  choice: எல்லா வினைகளும் இரண்டாம் நபர் ஒருமை மரியாதை வடிவில் நேரடியாக தேவனுடைய செயல்களாக மொழிபெயர்க்கப்பட்டன
  alternative: இயற்கை நிகழ்வுகளாக மறைமுகமாகக் கூறுதல்
  rationale: எபிரெய உரை மழை, மண், வளர்ச்சி ஆகியவற்றின் செயல்பாட்டை நேரடியாக தேவனுக்கே உரியதாகக் கூறுகிறது; அந்த இறையியல் வலியுறுத்தல் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் மரியாதையான இறைமுகப்பும் காக்கப்பட்டுள்ளன. வேளாண்மைச் சொற்கள் பொதுவாசகருக்குப் புரியுமாறு தேர்ந்தெடுக்கப்பட்டன; எபிரெய இணைவரி அமைப்பை நான்கு சுருக்கமான வரிகளாகப் பேணியுள்ளது.
