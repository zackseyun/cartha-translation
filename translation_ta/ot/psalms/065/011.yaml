  text: You crown the year with your goodness[b][a], and your paths drip with abundance.
translation:
  language: ta
  text: உமது நன்மையால் ஆண்டை முடிசூட்டுகிறீர்; உமது பாதைகள்[a] செழுமையைச் சொரிகின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது தடங்கள்”; எபிரெயச் சொல் பாதை, தடம் அல்லது பயணப் போக்கைக் குறிக்கலாம். கடவுளின் பயணம் வளத்தை விட்டுச் செல்கிறது என்ற காட்சியையும் இது உணர்த்தக்கூடும்.
