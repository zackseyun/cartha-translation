  - marker: b
    text: நேர்ச்சொல்லாக, “கொழுமை”; எபிரெய மொழியில் இது வளமான நிலம், செழிப்பான விளைச்சல், மிகுதியான வழங்கல் ஆகியவற்றைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  choice: முடிசூட்டுகிறீர்
  rationale: ‘முடிசூட்டுதல், சூழ்தல், அழகுபடுத்துதல்’ என்ற பொருள்களைக் கொண்ட எபிரெய வினைச்சொல்லின் உயிரோட்டமான உருவகத்தைத் தக்கவைக்கிறது; தமிழ்க் கவிதை நடையிலும் இயல்பாக உள்ளது.
- source_word: שְׁנַת טוֹבָתֶךָ
  choice: உமது நன்மையால் ஆண்டுக்கு
  rationale: சொல்லுக்குச் சொல் அமைப்பு ‘உமது நன்மையின் ஆண்டு’ என இருந்தாலும், இங்கு கடவுளுடைய நன்மையே ஆண்டை நிறைவுறச் செய்யும் கருவி அல்லது அருளாகப் புரிகிறது. ‘நன்மை’ என்பது வளம், அருள், நற்கொடை ஆகிய விரிந்த பொருள் வாய்ப்புகளைத் திறந்தே வைக்கிறது.
- source_word: וּמַעְגָּלֶיךָ
  choice: உமது பாதைச் சுவடுகள்
  rationale: מַעְגָּל என்பது பாதை, தடம், சுவடு அல்லது பயணப் போக்கைக் குறிக்கலாம். ‘பாதைச் சுவடுகள்’ என்பது கடவுள் நிலத்தின் வழியே செல்லும் கவித்துவக் காட்சியையும் அவர் சென்ற இடத்தில் வளம் மிஞ்சுவதையும் உணர்த்துகிறது.
- source_word: יִרְעֲפוּן
  choice: சொரிகின்றன
  rationale: துளித்தல், வடிதல், பொழிதல் என்ற காட்சியை இயல்பான தமிழில் தருகிறது; வெறும் ‘நிரம்புகின்றன’ என்பதைக் காட்டிலும் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: דָּשֶׁן
  choice: செழுமை
  rationale: இதன் அடிப்படைப் படம் ‘கொழுமை’; வேளாண் சூழலில் அது வளமான விளைச்சல், செழிப்பு, நிறைவான வழங்கல் ஆகியவற்றைக் குறிக்கிறது. ‘செழுமை’ நவீன வாசகருக்குத் தெளிவாகவும் கவிதைநயத்துடனும் உள்ளது.
theological_decisions:
- issue: வேளாண் ஆசீர்வாதத்தின் உருவகத்தை உரைநடையாகத் தட்டையாக்காமல் மொழிபெயர்த்தல்
  choice: கடவுள் ஆண்டுக்கு முடிசூட்டுகிறார்; அவருடைய பாதைச் சுவடுகள் செழுமையைச் சொரிகின்றன என்ற உருவகங்களைத் தக்கவைத்தல்
  alternative: கடவுள் அறுவடைக் காலத்தை மிகுதியாக ஆசீர்வதிக்கிறார் என்று விளக்கவுரையாக மொழிபெயர்த்தல்
  rationale: மூல வசனம் இயற்கை வளத்தை கடவுளுடைய நன்மையான செயலுடன் இணைக்கும் கவிதை. உருவகத்தை அப்படியே காப்பது அதன் இறையியல் வலிமையையும் உண்மையான படிமத் திறந்தநிலையையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதை ஒருமை இறைமுகப்புடன் அமைந்த கவிதைநடை. ‘முடிசூட்டுகிறீர்’, ‘பாதைச் சுவடுகள்’, ‘சொரிகின்றன’ ஆகிய சொற்கள் மூலத்தின் செறிவான உருவகங்களைத் தக்கவைத்தபடியே சாதாரண வாசகருக்கும் புரியும் வகையில் தேர்ந்தெடுக்கப்பட்டன.
