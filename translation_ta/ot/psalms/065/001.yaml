source:
  edition: WLC
  text: לְ/ךָ֤ דֻֽמִיָּ֬ה תְהִלָּ֓ה אֱלֹ֘הִ֥ים בְּ/צִיּ֑וֹן וּ֝/לְ/ךָ֗ יְשֻׁלַּם נֶֽדֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/001.yaml
  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
translation:
  language: ta
  text: 'சீயோனில், கடவுளே,

    உமக்கு மௌனமே துதி[a];

    உமக்கு நேர்த்திக்கடன் நிறைவேற்றப்படும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சீயோனில், கடவுளே, துதி உமக்காக மௌனமாய்க் காத்திருக்கிறது”; அல்லது, “சீயோனில், கடவுளே, மௌனமான துதி உமக்குரியது.” எபிரெயச் சொற்றொடர் வினைச்சொல் இல்லாமல் சுருக்கமாக அமைந்துள்ளதால், அதை ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: דֻמִיָּה
  choice: மௌனம்
  rationale: இப்பெயர்ச்சொல் அடிப்படையாக மௌனம் அல்லது அமைதியைக் குறிக்கிறது. கவிதையின் செறிவான, வியப்பூட்டும் சொல்லமைப்பை விளக்கவுரையாக மாற்றாமல் காக்கிறது.
- source_word: תְהִלָּה
  choice: துதி
  rationale: இச்சொல்லின் இயல்பான பொருள் ‘துதி’. வினைச்சொல் இல்லாத எபிரெய அமைப்பில் ‘மௌனம்’ என்பதுடன் நேரடியாக இணைகிறது.
- source_word: לְךָ דֻמִיָּה תְהִלָּה
  choice: உமக்கு மௌனமே துதி
  rationale: எபிரெயத்தில் வெளிப்படையான வினைச்சொல் இல்லை. இரு பெயர்ச்சொற்களையும் காத்து, மௌனமே கடவுளுக்கான துதியாக இருப்பதாகக் கூறும் கவித்துவ முரணையும் உண்மையான தெளிவின்மையையும் நிலைநிறுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இங்கு வடிவம் பன்மையாக இருந்தாலும் இஸ்ரவேலின் ஒரே கடவுளைக் குறிக்கிறது; விளிவேற்றுமை தமிழ் அழைப்புமுறையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּצִיּוֹן
  choice: சீயோனில்
  rationale: בְּ என்ற முன்னொட்டின் இடப்பொருளை நேரடியாகக் காக்கிறது.
- source_word: יְשֻׁלַּם
  choice: நிறைவேற்றப்படும்
  rationale: שלם என்பதன் புஅல் வடிவம் நேர்த்திக்கடனைச் செலுத்துதல் அல்லது நிறைவேற்றுதல் எனப் பொருள்படும். தமிழில் நேர்த்திக்கடனுடன் ‘நிறைவேற்றப்படும்’ இயல்பாகவும் தெளிவாகவும் அமைகிறது.
- source_word: נֶדֶר
  choice: நேர்த்திக்கடன்
  rationale: கடவுளிடம் வேண்டிக்கொண்டு அல்லது உறுதியளித்துச் செய்யப்படும் பொருத்தனையைச் செலுத்த வேண்டிய கடமையாக இச்சொல் குறிக்கிறது. நவீன தமிழில் ‘நேர்த்திக்கடன்’ பரவலாகப் புரிந்துகொள்ளப்படுகிறது.
theological_decisions:
- issue: לְךָ דֻמִיָּה תְהִלָּה என்ற வினையற்ற, சுருக்கமான சொற்றொடரின் பொருள்
  choice: மௌனமே கடவுளுக்குச் செலுத்தப்படும் துதி என முன்வைக்கப்படுகிறது.
  alternative: ‘சீயோனில் துதி உமக்காக மௌனமாய்க் காத்திருக்கிறது’ அல்லது ‘சீயோனில் மௌனமான துதி உமக்குரியது.’
  rationale: மூல எபிரெயத்தில் வினைச்சொல் இல்லாததால் பல இலக்கணத் தொடர்புகள் சாத்தியம். முதன்மை வாசகம் இரு பெயர்ச்சொற்களையும் வெளிப்படையாகக் காத்து, ஒரு குறிப்பிட்ட விளக்கத்தை அளவுக்கு மீறித் திணிக்காமல் கவித்துவத் த tensionை பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை நோக்கிய கவிதைக்கு ஏற்ற கண்ணியமான ‘உமக்கு’ வடிவம் பயன்படுத்தப்பட்டது. ‘மௌனமே துதி’ என்ற செறிவான அமைப்பு மூலத்தின் கவித்துவச் சிக்கலையும் முரணையும் காக்கிறது; அடிக்குறிப்பு உண்மையான மாற்று வாசிப்புகளைப் பதிவு செய்கிறது.
