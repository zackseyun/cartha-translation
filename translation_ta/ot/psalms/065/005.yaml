base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/005.yaml
  text: With awesome deeds in righteousness you answer us[a], O God of our salvation[b], the confidence of all the ends of the earth and of the distant sea.
translation:
  language: ta
  text: நீதியோடு வியப்பூட்டும் செயல்களால் எங்களுக்குப் பதிலளிக்கிறீர்[a], எங்கள் மீட்பின் கடவுளே; பூமியின் எல்லா முனைகளிலும் தொலைதூரக் கடற்பகுதியிலும் வாழ்பவர்களின் நம்பிக்கையானவரே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நேர்மையோடு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “தொலைதூரக் கடல்” என ஒருமை உள்ளது. அது கூட்டுப்பொருளில் வரக்கூடும்; எனவே “தொலைதூரக் கடற்பகுதிகளில் வாழ்பவர்களின் நம்பிக்கை” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  choice: அச்சமூட்டும் செயல்கள்
  rationale: இச்சொல் அச்சத்தையும் ஆழ்ந்த வியப்பையும் உண்டாக்கும் காரியங்களைக் குறிக்கிறது. இரட்சிக்கும் இறைச்செயல்கள் என்ற சூழலில், அதன் தீவிரத்தை மங்கச் செய்யாமல் இயல்பான தமிழில் இவ்வாறு வழங்கப்பட்டது; ‘செயல்கள்’ என்பது எபிரெய மறைபொருளைத் தெளிவாக்குகிறது.
- source_word: בְּצֶ֣דֶק
  choice: நீதியுடன்
  rationale: בְּ முன்னொட்டு செயல் நடைபெறும் முறை அல்லது பண்பைக் குறிக்கிறது. צֶדֶק என்பதில் நீதி, நேர்மை, சரியான தன்மை ஆகிய பரப்புகள் உள்ளதால் ‘நீதியுடன்’ என்பது இங்கு இயல்பாகவும் பரந்த பொருளுடனும் அமைகிறது.
- source_word: תַּ֭עֲנֵנוּ
  choice: நீர் எங்களுக்குப் பதிலளிக்கிறீர்
  rationale: வினைச்சொல் ‘பதிலளித்தல்’ என்றும், பின்னொட்டு முதலாம் நபர் பன்மை ‘எங்களுக்கு/எங்களை’ என்றும் பொருள்படும். மரியாதையான நேரடி இறைமுகப்பைத் தமிழில் காக்க ‘நீர்’ பயன்படுத்தப்பட்டது.
- source_word: אֱלֹהֵ֣י יִשְׁעֵ֑נוּ
  choice: எங்கள் மீட்பின் கடவுளே
  rationale: எபிரெய இணைப்புத்தொடரின் அமைப்பைத் தக்கவைத்து, יֵשַׁע என்பதன் விடுதலை/மீட்பு சார்ந்த பரந்த பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. அழைப்புமுறை ‘கடவுளே’ எனக் காட்டப்பட்டது.
- source_word: מִבְטָ֥ח
  choice: நம்பிக்கை
  rationale: நம்பப்படுபவர் அல்லது நம்பிக்கை வைக்கப்படும் ஆதாரம் என்பதே இச்சொல்லின் மையம். இங்கு கடவுளே உலகின் தொலைவான பகுதிகளில் வாழ்பவர்களின் நம்பிக்கையாக இருப்பதை ‘நம்பிக்கை நீரே’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל קַצְוֵי אֶ֝֗רֶץ
  choice: பூமியின் எல்லா முனைகளிலும் உள்ளவர்கள்
  rationale: இது உலகின் மிகத் தொலைவான பகுதிகளைக் குறிக்கும் எபிரெய மரபுத்தொடர். מִבְטָח உடன் தொடர்புடைய மனிதர்களைத் தமிழில் தெளிவாக்க ‘உள்ளவர்கள்’ சேர்க்கப்பட்டது.
- source_word: וְיָ֣ם רְחֹקִֽים
  choice: தொலைதூரக் கடலிலும் உள்ளவர்கள்
  rationale: יָם இலக்கண ரீதியாக ஒருமை; ஆகவே முதன்மை உரையில் ‘கடல்’ எனத் தக்கவைக்கப்பட்டது. பன்மை உரிச்சொல் தொலைவான கடற்பகுதிகள் அல்லது கூட்டுப்பொருள் வாசிப்பை அனுமதிப்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: צֶדֶק என்பதன் நீதி/நேர்மை பொருள்
  choice: நீதியுடன்
  alternative: நேர்மையுடன்
  rationale: இச்சூழலில் கடவுள் பதிலளிக்கும் செயல் அவருடைய நீதிக்கும் சரியான தன்மைக்கும் ஏற்றதாக இருப்பதைச் சொல்கிறது. ‘நீதியுடன்’ சட்டத் தீர்ப்பை மட்டும் குறுக்காமல் தமிழில் ஒழுக்கநீதியையும் உள்ளடக்குகிறது.
- issue: מִבְטָח என்பதில் கடவுளின் பங்கு
  choice: நம்பிக்கை நீரே
  alternative: அடைக்கலம் நீரே
  rationale: மூலச்சொல் முதன்மையாக நம்பிக்கை வைக்கப்படும் ஆதாரத்தைச் சுட்டுகிறது. ‘அடைக்கலம்’ சாத்தியமான சூழல்சார் விரிவாக்கம் என்றாலும், இங்கு வேர் சார்ந்த நம்புதல் பொருளைத் தக்கவைத்தது.
- issue: יָם ஒருமையா கூட்டுப்பொருளா
  choice: தொலைதூரக் கடல்
  alternative: தொலைதூரக் கடல்கள்
  rationale: பெயர்ச்சொல்லின் எபிரெய ஒருமையை முதன்மை உரை காக்கிறது; அதனுடன் வரும் பன்மை உரிச்சொல் காரணமாக கூட்டுப்பொருள் அல்லது பல தொலைகடற்பகுதிகள் என்ற சாத்தியம் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘நீர்/நீரே’ பயன்படுத்தப்பட்டது. மூலத்தின் சுருக்கமான கவித்துவத்தைப் பாதுகாத்தபடியே, ‘பூமியின் முனைகள்’ மற்றும் ‘கடல்’ என்பவை அங்குள்ள மக்களைக் குறிக்கும் ஆகுபெயர்கள் என்பதைத் தமிழில் ‘உள்ளவர்கள்’ என மெதுவாக வெளிப்படுத்தியது.
