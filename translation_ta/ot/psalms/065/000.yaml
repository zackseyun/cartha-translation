  yaml_path: translation/ot/psalms/065/000.yaml
  text: For the choirmaster[a]. A psalm of David[b]; a song.
translation:
  language: ta
  text: இசைத் தலைவருக்கு.[a] தாவீதுக்குரிய[b] சங்கீதம்; ஒரு பாடல்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல் இசை நிகழ்த்துதலை மேற்பார்வையிடும் தலைவரையோ இயக்குநரையோ குறிக்கலாம்.
    reason: lexical_clarification
  - marker: b
    text: ‘தாவீதுக்குரிய’ என்பது தாவீது இயற்றியது, அவருக்கு அர்ப்பணிக்கப்பட்டது அல்லது அவருடன் தொடர்புடையது என்று பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதங்களின் தலைப்புகளில், இசை நிகழ்த்துதலை மேற்பார்வையிடும் நபரைக் குறிக்கும் மரபுச் சொல் இது. முன்னொட்டு לַ־ என்பதன் நோக்குவிப்பு பொருளை ‘-க்கு’ வெளிப்படுத்துகிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையுடன் பாடப்படும் சங்கீதத்தைக் குறிக்கும் வழக்கமான தலைப்புச் சொல்; தமிழில் நிலைபெற்ற, இயல்பான இணைச்சொல் ‘சங்கீதம்’.
- source_word: לְדָוִד
  choice: தாவீதுக்குரிய
  rationale: தாவீதுடனான தொடர்பைச் சுட்டும் לְ־ முன்னொட்டு ஆசிரியத்துவம், அர்ப்பணம் அல்லது தொடர்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதுக்குரிய’ என்பது ‘தாவீது எழுதியது’ என்று ஒரே பொருளில் முடிவுசெய்யாமல் அந்தத் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: שִׁיר
  choice: ஒரு பாடல்
  rationale: מִזְמוֹר என்பதிலிருந்து வேறுபட்ட தலைப்புச் சொல்லாக இருப்பதால் அதைத் தனியே மொழிபெயர்த்து, எபிரெயத் தலைப்பின் முழு வடிவத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: לְדָוִד என்பதில் தாவீதுடனான உறவின் தன்மை
  choice: தாவீதுக்குரிய
  alternative: தாவீது இயற்றிய
  rationale: எபிரெய முன்னொட்டு ஆசிரியத்துவத்தை மட்டும் கட்டாயப்படுத்தாது; ஆசிரியத்துவம், அர்ப்பணம் அல்லது தொடர்பு என்ற உண்மையான பொருள் விரிவை மொழிபெயர்ப்பு திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத் தலைப்புக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சங்கீதம்’ மற்றும் ‘பாடல்’ என்ற இரு வேறுபட்ட எபிரெயச் சொற்களும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன.
