translation:
  language: ta
  text: 'கடல்களின் இரைச்சலையும்,

    அவற்றின் அலைகளின் இரைச்சலையும்,

    மக்களினங்களின் கொந்தளிப்பையும் அடக்குகிறவர்.[a]'
  philosophy: optimal-equivalence
  footnotes:
