lexical_decisions:
- source_word: מַשְׁבִּיחַ
  choice: அடக்குகிறவர்
  rationale: שׁבח என்பதன் ஹிஃபில் வினையெச்ச வடிவம், எழும் பேரொலியையோ கொந்தளிப்பையோ ஓயச் செய்பவரைக் குறிக்கிறது. தமிழ் தொடரமைப்பில் வினையெச்சத்தின் விளக்கத் தன்மையை இயல்பாகத் தக்கவைக்க ‘அடக்குகிறவர்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שְׁאוֹן
  choice: இரைச்சல்
  rationale: இந்தச் சொல் பேரொலி, ஆரவாரம், கொந்தளிப்பு ஆகியவற்றைக் குறிக்கலாம். கடல்களும் அலைகளும் எழுப்பும் ஒலியை இயல்பாகக் காட்ட ‘இரைச்சல்’ தேர்ந்தெடுக்கப்பட்டது; எபிரெயத்தில் இருமுறை வரும் சொல்லும் தமிழில் இருமுறை அப்படியே வழங்கப்பட்டுள்ளது.
- source_word: יַמִּים
  choice: கடல்கள்
  rationale: எபிரெயத்தில் பன்மையாக இருப்பதால் ‘கடல்கள்’ எனப் பன்மை தக்கவைக்கப்பட்டது.
- source_word: גַּלֵּיהֶם
  choice: அவற்றின் அலைகள்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை உடைமைப் பின்னொட்டு, முன்வரும் ‘கடல்கள்’ என்பதைக் குறிப்பதால் ‘அவற்றின்’ என நேரடியாக இணைக்கப்பட்டது.
- source_word: הֲמוֹן
  choice: கொந்தளிப்பு
  rationale: எண்ணிக்கையான திரளை மட்டும் அல்லாமல், மக்களிடையே எழும் சத்தமுள்ள குழப்பத்தையும் ஆரவாரத்தையும் இங்கு குறிக்கிறது. கடலின் இரைச்சலுடனான கவிதை இணைப்பை ‘கொந்தளிப்பு’ நன்கு வெளிப்படுத்துகிறது.
- source_word: לְאֻמִּים
  choice: மக்களினங்கள்
  rationale: இந்தச் சொல் பல்வேறு மக்கள் குழுக்களையோ தேச மக்களையோ குறிக்கிறது. நவீன அரசியல் நாடுகள் என்ற வரம்பைத் தவிர்த்து, பன்மை அர்த்தத்தைத் தெளிவாகக் காட்ட ‘மக்களினங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: இயற்கைக் குழப்பத்துக்கும் மனிதக் குழப்பத்துக்கும் இடையிலான இணைப்பின் பரப்பு
  choice: கடல்களின் இரைச்சலையும் மக்களினங்களின் கொந்தளிப்பையும் அடக்குகிறவராகக் கடவுளை வசனம் சித்தரிக்கிறது; இதற்கு அப்பாற்பட்ட அரசியல் அல்லது இறுதிக்கால விளக்கம் சேர்க்கப்படவில்லை.
  alternative: இயற்கை நிகழ்வுகளை மட்டுமே குறிக்கும் குறுகிய வாசிப்பு; அல்லது தேசங்களை அரசியல் ரீதியாகக் கீழ்ப்படுத்துவதைக் குறிப்பாக வலியுறுத்தும் வாசிப்பு.
  rationale: எபிரெயக் கவிதை இணைவு கடல்களின் பேரொலியையும் மக்களினங்களின் கொந்தளிப்பையும் ஒன்றோடொன்று இணைக்கிறது. மொழிபெயர்ப்பு இந்த அகலத்தையும் பதற்றத்தையும் தக்கவைத்து, மூலத்தில் வெளிப்படையாக இல்லாத கோட்பாட்டைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடன் அமைக்கப்பட்டுள்ளது. மூலத்தின் மூன்று இணையான கூறுகளும், ‘இரைச்சல்’ என்ற சொல்லின் மறுபடியும் வருதலும், பன்மை வடிவங்களும் இயன்றவரை தக்கவைக்கப்பட்டுள்ளன.
