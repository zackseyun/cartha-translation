    reason: כֹּחַ மற்றும் גְּבוּרָה ஆகிய நெருங்கிய வலிமைச் சொற்களை முறையே ‘ஆற்றல்’ மற்றும் ‘வல்லமை’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: מֵכִין
  choice: நிலைநிறுத்துகிறவர்
  rationale: כּון என்பதன் ஹிஃபில் வினையெச்சம் ஒன்றை உறுதியாக நிலைபெறச் செய்வதைக் குறிக்கிறது. மலைகளின் உறுதித்தன்மையை வெளிப்படுத்தும் ‘நிலைநிறுத்து’ என்பது இயல்பான தமிழ்; படைப்பின் முறையைத் தேவையின்றி அதிகமாக விளக்குவதில்லை.
- source_word: הָרִים
  choice: மலைகளை
  rationale: הָרִים என்பதன் நேரான பொருள் ‘மலைகள்’. எபிரெயச் சுட்டுத்தன்மை தமிழில் தனிச் சுட்டுச்சொல் இல்லாமலேயே இங்கு இயல்பாக வெளிப்படுகிறது.
- source_word: בְּכֹחוֹ
  choice: தம் வல்லமையால்
  rationale: כֹּחַ என்பது வலிமை அல்லது ஆற்றலைக் குறிக்கிறது; முன்னொட்டு ב இங்கு கருவி அல்லது செயலின் வழிமுறையைக் காட்டுவதால் ‘-ஆல்’ பயன்படுத்தப்பட்டுள்ளது. இறைவனைச் சுட்டும் மரியாதைத் தன்னிலை வடிவமாக ‘தம்’ அமைந்துள்ளது.
- source_word: נֶאְזָר
  choice: இடைக்கச்சையாக அணிந்திருக்கிறார்
  rationale: אזר என்பதன் நிஃபால் வடிவம் இடுப்பில் கட்டிக்கொள்ளுதல் அல்லது அதனால் ஆயத்தமாயிருத்தல் என்ற உருவகத்தைத் தக்கவைக்கிறது. ‘அணிந்திருக்கிறார்’ தொடர்நிலையையும், ‘இடைக்கச்சையாக’ மூல உருவகத்தையும் தமிழில் தெளிவாக்குகிறது.
- source_word: בִּגְבוּרָה
  choice: பேராற்றலை
  rationale: גְּבוּרָה வலிமை, பேராற்றல், வீரமிக்க ஆற்றல் ஆகிய பொருள்களைக் கொண்டது. முன்னைய כֹּחַ உடன் தேவையற்ற சொல் மீளலைத் தவிர்த்து, இடைக்கச்சை உருவகத்தின் வலிமையைப் பேண ‘பேராற்றல்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
