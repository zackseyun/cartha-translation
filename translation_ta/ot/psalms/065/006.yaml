  rationale: எபிரெயத்தில் அடுத்தடுத்து வரும் இரு வினையெச்சங்களும் இறைவனின் வழக்கமான செயலும் நிலையான வல்லமையும் விவரிக்கின்றன. தமிழில் வாசிக்க இயல்பாக இருக்கும்படி வாக்கிய ஓட்டம் அமைக்கப்பட்டாலும், இரண்டிற்கிடையில் காரணம் அல்லது காலவரிசை போன்ற தொடர்பு சேர்க்கப்படவில்லை.
- issue: இறைவனுடைய வல்லமையைச் சித்தரிக்கும் உடல் சார்ந்த உருவகம்
  choice: ‘பேராற்றலை இடைக்கச்சையாக அணிந்திருக்கிறார்’ என்று உருவகத்தைப் பேணுதல்
  alternative: ‘முழு வல்லமை உடையவர்’ என்று கருத்தை மட்டும் வெளிப்படுத்துதல்
  rationale: மூலத்தில் வல்லமையை இடுப்பில் கட்டிக்கொண்டு ஆயத்தமாயிருக்கும் உயிரோட்டமான உருவகம் உள்ளது. அதை கருத்துச் சுருக்கமாக மாற்றாமல் பேணுவது கவித்துவ வலிமையையும் மூலத்தின் இறையியல் திறந்தநிலையையும் காக்கிறது.
