base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/004.yaml
  text: Blessed is the one you choose and bring near to dwell in your courts[a]; we will be satisfied with the goodness of your house[b], the holiness of your temple.
translation:
  language: ta
  text: நீர் தேர்ந்தெடுத்து, உமது முற்றங்களில் குடியிருக்கும்படி அருகில் கொண்டுவரும் மனிதன் பேறுபெற்றவன்![a] உமது வீட்டின் நன்மையாலும்[b] உமது ஆலயத்தின் பரிசுத்தத்தாலும் நாங்கள் நிறைவடைவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் தேர்ந்தெடுத்து அருகில் கொண்டுவரும் மனிதன்—அவன் உமது முற்றங்களில் குடியிருப்பான்—எவ்வளவு பேறுபெற்றவன்!”
    reason: எபிரெய வினைத்தொடரின் நோக்கம் அல்லது விளைவுறவை வேறுவிதமாக அமைக்க முடியும்.
  - marker: b
    text: “நன்மை” என்பதை “நல்ல பொருட்கள்” அல்லது “வளம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: טוּב என்ற சொல்லின் பொருள் வரம்பைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவன்
  rationale: எபிரெயச் சொல்லின் வாழ்த்துப்பாங்கையும், வெறும் மனநிலை சார்ந்த ‘மகிழ்ச்சி’யைக் கடந்த இறை அருள் பெற்ற நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תִּבְחַר
  choice: நீர் தேர்ந்தெடுத்து
  rationale: இறைவனுடைய முன்னெடுப்பைத் தெளிவாக வைத்துக்கொண்டு, பிற்காலக் கோட்பாட்டுச் சொற்களை உரைக்குள் இறக்காமல் בחר என்பதன் அடிப்படைப் பொருளைத் தருகிறது.
- source_word: וּתְקָרֵב
  choice: அருகில் கொண்டுவருகிறவன்
  rationale: ஹிஃபில் வினையின் காரணவினைப் பொருளை—அந்த நபரை இறைவனே அருகில் வரச்செய்கிறார்—தமிழில் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יִשְׁכֹּן
  choice: குடியிருக்கும்படி
  rationale: மூன்றாம் நபர் ஒருமை வினையின் நோக்கம் அல்லது விளைவைக் காட்டும் உறவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: חֲצֵרֶיךָ
  choice: உமது முற்றங்களில்
  rationale: ஆலய வளாகத்தின் முற்றங்களைச் சுட்டும் உறுதியான வழிபாட்டிடப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: נִשְׂבְּעָה
  choice: நாங்கள் நிறைவடைவோம்
  rationale: கோஹோர்டேட்டிவ் வடிவிலுள்ள ஆவல் அல்லது நம்பிக்கையான எதிர்பார்ப்பு இரண்டையும் உள்ளடக்கக்கூடிய இயல்பான தமிழ் வடிவம்.
- source_word: בְּטוּב
  choice: உமது வீட்டின் நன்மையாலும்
  rationale: טוּב என்பதன் ‘நன்மை’, ‘நல்ல பொருட்கள்’, ‘வளம்’ ஆகிய பொருள் சாத்தியங்களை மிகையாகக் குறுக்காமல் தருகிறது.
- source_word: בֵּיתֶךָ
  choice: உமது வீட்டின்
  rationale: ‘ஆலயம்’ என்பதுடன் இணையாக நிற்கும் இறைவனுடைய இல்லம் என்ற ஆலயக் குறிப்பை நேரடியாகப் பாதுகாக்கிறது.
- source_word: קְדֹשׁ
  choice: பரிசுத்தத்தாலும்
  rationale: הֵיכָלֶךָ உடன் இணைந்துள்ள புனிதத் தன்மையை தமிழில் பெயர்ச்சொல் வடிவில் இயல்பாக வெளிப்படுத்துகிறது; எபிரெயத் தொடரின் இலக்கணச் சுருக்கம் காரணமாக ‘பரிசுத்தமான இடம்’ என்பதும் சாத்தியம்.
- source_word: הֵיכָלֶךָ
  choice: உமது ஆலயத்தின்
  rationale: வழிபாட்டுச் சூழலும் ‘வீடு’, ‘முற்றங்கள்’ என்ற இணைச் சொற்களும் இங்கு ‘அரண்மனை’ அல்ல, ஆலயத்தையே குறிக்கின்றன.
theological_decisions:
- issue: இறைவன் தேர்ந்தெடுத்து அருகில் கொண்டுவருதல்
  choice: இறைவனுடைய முன்னெடுப்பை நேரடியாகக் கூறும் மொழி தக்கவைக்கப்பட்டது.
  alternative: ஒரு குறிப்பிட்ட முன்நியமனக் கோட்பாட்டை வெளிப்படையாகச் சேர்த்தல், அல்லது இதைச் சடங்குப் பணிக்கான தேர்வாக மட்டும் குறுக்குதல்.
  rationale: மூலவசனம் அணுகலை வழங்கும் இறை முன்னெடுப்பைத் தெளிவாகக் கூறுகிறது; ஆனால் அதன் கோட்பாட்டு எல்லைகளைத் தானே வரையறுக்கவில்லை.
- issue: ஆலய அணுகல் குறித்த மொழி
  choice: ‘முற்றங்கள்’, ‘வீடு’, ‘ஆலயம்’ என்ற உறுதியான இடச்சொற்கள் தக்கவைக்கப்பட்டன.
  alternative: அனைத்தையும் ‘பிரசன்னம்’ போன்ற உருவக அல்லது ஆன்மிக மொழியாக மாற்றுதல்.
  rationale: சங்கீதத்தின் இஸ்ரவேலிய வழிபாட்டுச் சூழலை உரை முதலில் நேரடியாகக் காட்ட வேண்டும்.
- issue: קְדֹשׁ הֵיכָלֶךָ என்ற தொடரின் பொருள்
  choice: ‘உமது ஆலயத்தின் பரிசுத்தம்’ என்ற பண்புப் பொருள் தேர்ந்தெடுக்கப்பட்டது.
  alternative: ‘உமது ஆலயத்தின் பரிசுத்தமான இடம்’ அல்லது ‘உமது பரிசுத்த ஆலயம்’.
  rationale: மெய்யெழுத்து உரையின் சுருக்கமான இணைவை பண்புத் தன்மையாகப் புரிந்துகொள்ளலாம்; இடத்தைக் குறிக்கும் வாசிப்பும் சாத்தியமாதலால் அதனை முற்றிலும் மறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்கேற்ற கண்ணியமான நடையும் பொதுவாசகர்களுக்குப் புரியும் சொற்களும் பயன்படுத்தப்பட்டுள்ளன. இறைவனை நோக்கும் ஒருமை மரியாதை வடிவமாக ‘நீர்/உமது’ ஒரேபடியாகக் கையாளப்பட்டது; ஆலயப் படிமம் ஆன்மிகமயமாக்கப்படாமல் தக்கவைக்கப்பட்டது.
