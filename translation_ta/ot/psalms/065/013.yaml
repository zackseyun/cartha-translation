  text: לָבְשׁ֬וּ כָרִ֨ים הַ/צֹּ֗אן וַ/עֲמָקִ֥ים יַֽעַטְפוּ בָ֑ר יִ֝תְרוֹעֲע֗וּ אַף יָשִֽׁירוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/013.yaml
  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes[b], they sing.
translation:
  language: ta
  text: மேய்ச்சல் நிலங்கள் மந்தைகளைத் தம்மேல் அணிந்துள்ளன[a]; பள்ளத்தாக்குகள் தானியத்தால் தம்மைப் போர்த்திக்கொண்டுள்ளன. அவை மகிழ்ச்சியுடன் ஆர்ப்பரிக்கின்றன; ஆம்[b], பாடுகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “புல்வெளிகள்” என்றும் மொழிபெயர்க்கலாம். இச்சூழலில் எபிரெயப் பெயர்ச்சொல் மேய்ச்சல் நிலங்களையோ புல்வெளிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'இங்கு நிலப்பரப்பு உயிருள்ளதுபோல் கவித்துவமாகச் சித்தரிக்கப்படுகிறது: மேய்ச்சல் நிலங்கள் மந்தைகளை அணிகின்றன; பள்ளத்தாக்குகள் தானியத்தால் தம்மைப் போர்த்திக்கொள்கின்றன.'
    reason: cultural_note
lexical_decisions:
- source_word: לָבְשׁוּ
  choice: ஆடையாக அணிந்துள்ளன
  rationale: ‘அணிதல்/உடுத்துதல்’ என்ற எபிரெய உருவகத்தைத் தக்கவைத்து, நிலப்பரப்பு மந்தைகளால் மூடப்பட்டிருப்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָרִים
  choice: மேய்ச்சல் நிலங்கள்
  rationale: இணைவாக்கியத்தில் வரும் பள்ளத்தாக்குகளுக்கும், உடன் வரும் மந்தைகளுக்கும் பொருந்துவதால், இங்கு ‘ஆட்டுக்கடாக்கள்’ என்பதல்லாமல் மேய்ச்சல் நிலங்களையே குறிக்கிறது.
- source_word: הַצֹּאן
  choice: மந்தைகள்
  rationale: செம்மறியாடுகள், வெள்ளாடுகள் போன்ற சிறு கால்நடைகளைக் குறிக்கும் கூட்டுப்பெயரை இயல்பான பன்மையாக வழங்குகிறது.
- source_word: וַעֲמָקִים
  choice: பள்ளத்தாக்குகள்
  rationale: நில அமைப்பைக் குறிக்கும் எபிரெயப் பன்மைக்கான நேரான, இயல்பான தமிழ் இணை.
- source_word: יַעַטְפוּ
  choice: போர்த்திக்கொண்டுள்ளன
  rationale: பள்ளத்தாக்குகளே செயப்படுபொருளாக இல்லாமல் எழுவாயாக வரும் உயிரூட்டப்பட்ட கவித்துவப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: בָר
  choice: தானியம்
  rationale: குறிப்பிட்ட ஓர் பயிராகச் சுருக்காமல், பொதுவாகத் தானிய விளைச்சலைக் குறிக்கும் சொல்.
- source_word: יִתְרוֹעֲעוּ
  choice: மகிழ்ச்சியுடன் ஆர்ப்பரிக்கின்றன
  rationale: மகிழ்ச்சியான பெருமுழக்கத்தைக் குறிக்கும் வினையின் சூழல்சார் நேர்மறை வலிமையை வெளிப்படுத்துகிறது.
- source_word: אַף
  choice: ஆம்
  rationale: இரண்டாவது கவித்துவக் கூறை வெறும் சேர்க்கையாக அல்லாமல் வலியுறுத்தும் தொடர்ச்சியாகக் காட்டுகிறது.
- source_word: יָשִׁירוּ
  choice: பாடுகின்றன
  rationale: ஆர்ப்பரித்தலுடன் இணையும் உச்சநிலைக் கவித்துவ இணைப்பை எளிமையாகப் பாதுகாக்கிறது.
