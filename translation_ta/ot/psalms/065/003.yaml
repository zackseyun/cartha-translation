    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றை நீக்குவீர்.” எபிரெய வினை பாவங்களுக்குப் பரிகாரம் செய்வதையும் அவற்றின் குற்றத்தை அகற்றுவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: காரியங்கள்
  rationale: דָּבָר என்பதன் பன்மைத் தொகைநிலை வடிவம் இங்கு ‘சொற்கள்’ என்பதைக் காட்டிலும் பாவத்துக்குரிய காரியங்கள் அல்லது விவகாரங்கள் என்ற சுருக்கமான பொருளைத் தருகிறது.
- source_word: עֲוֺנֹת
  choice: தீவினை
  rationale: עָוֹן என்பது அக்கிரமம், குற்றம், குற்றப்பழி ஆகிய பரப்பைக் கொண்டது. இங்கு ‘தீவினை’ அதன் அறச்சுமையைத் தக்கவைத்தபடி தமிழில் இயல்பாக இணைகிறது.
- source_word: גָּבְרוּ מֶנִּי
  choice: என்னைவிட வலிமைமிக்கவையாகிவிட்டன
  rationale: גבר உடன் מן ஒப்பீட்டையோ மேலோங்குதலையோ குறிக்கலாம். இந்த மொழிபெயர்ப்பு ‘எனக்கு மிகுந்துவிட்டன/என்னை மேற்கொண்டன’ என்ற உருவகத்தைத் தீர்மானமாகக் குறுக்காமல் பாதுகாக்கிறது.
- source_word: פְּשָׁעֵינוּ
  choice: எங்கள் மீறுதல்கள்
  rationale: פֶּשַׁע எல்லை அல்லது கட்டளையை மீறுதல், கலகம் செய்தல் என்ற அற-உறவுசார் பொருளைக் கொண்டது; ‘மீறுதல்கள்’ தெளிவாகவும் அளவுக்கு மீறிய விளக்கமின்றியும் உள்ளது.
- source_word: אַתָּה
  choice: நீரே
  rationale: வெளிப்படையாக வரும் இரண்டாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலை ‘ஏ’ விகுதி பிரதிபலிக்கிறது; இறைவனை நோக்கிய நவீன மரியாதை ஒருமையாக ‘நீர்’ பயன்படுத்தப்படுகிறது.
- source_word: תְכַפְּרֵם
  choice: அவற்றிற்குப் பரிகாரம் செய்வீர்
  rationale: כפר என்பதன் பியேல் வடிவம் பாவத்திற்குப் பரிகாரம் செய்தல் அல்லது அதன் குற்றத்தை நீக்குதல் என்ற பொருளைக் கொண்டது. ‘பரிகாரம் செய்வீர்’ இறையியல் எடையைத் தக்கவைக்கிறது; வெறுமனே மறைத்தல் என்று பொருளைக் குறுக்கவில்லை.
theological_decisions:
- issue: பாவம் தொடர்பான כפר என்பதன் மொழிபெயர்ப்பு
  choice: அவற்றிற்குப் பரிகாரம் செய்வீர்
  alternative: அவற்றை நீக்குவீர் / அவற்றை மூடுவீர்
  rationale: வினைச்சொல்லின் பரிகார/குற்றநீக்க வலிமையைத் தக்கவைத்து, பரிகாரம் எவ்வாறு நிகழ்கிறது என்பதற்கான குறிப்பிட்ட கோட்பாட்டை வசனத்திற்குள் புகுத்தாமல் இருக்கிறது.
- issue: தனிநபர் நிலையிலிருந்து சமூக அறிக்கைக்கான மாற்றம்
  choice: என்னைவிட … எங்கள் மீறுதல்கள்
  alternative: எங்களைவிட … எங்கள் மீறுதல்கள்
  rationale: மசோரெட்டிக் உரையின் מֶנִּי முதல்நபர் ஒருமையையும் פְשָׁעֵינוּ முதல்நபர் பன்மையையும் அப்படியே பாதுகாக்கிறது; இந்த பதற்றத்தை ஒற்றுமைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நீரே’ தெய்வத்தை நோக்கிய மரியாதையையும் எபிரெயச் சுட்டுப்பெயரின் வலியுறுத்தலையும் தருகிறது. எபிரெயத்தின் சுருக்கத்தையும் ஒருமை–பன்மை மாற்றத்தையும் பாதுகாக்க அடிக்குறிப்புகள் பயன்படுத்தப்பட்டுள்ளன.
