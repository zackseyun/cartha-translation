  text: Words of iniquity have prevailed against me[b][a]; our transgressions—you will atone for them.
translation:
  language: ta
  text: பாவச் செயல்கள் என்னை மேற்கொண்டுவிட்டன[a]; எங்கள் மீறுதல்களுக்கோ—நீரே பரிகாரம் செய்வீர்[b].
  philosophy: optimal-equivalence
