- from: தீவினைக் காரியங்கள் என்னைவிட வலிமைமிக்கவையாகிவிட்டன[a]; எங்கள் மீறுதல்களையோ—நீரே அவற்றிற்குப் பரிகாரம் செய்வீர்[b].
  to: பாவச் செயல்கள் என்னை மேற்கொண்டுவிட்டன[a]; எங்கள் மீறுதல்களுக்கோ—நீரே பரிகாரம் செய்வீர்[b].
  rationale: The revision replaces a potentially flat comparative expression with an idiomatic Tamil expression for sins prevailing over the speaker. It also smooths the compressed opening phrase while retaining its reference to sinful matters. The singular ‘என்னை’ and plural ‘எங்கள்’ are intentionally retained, as is the emphatic ‘நீரே’ and the atonement terminology.
