source:
  edition: WLC
  text: שֹׁמֵ֥עַ תְּפִלָּ֑ה עָ֝דֶ֗י/ךָ כָּל בָּשָׂ֥ר יָבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/002.yaml
  text: O you who hear prayer[a], to you all flesh will come.
translation:
  language: ta
  text: 'மன்றாட்டைக் கேட்பவரே,

    மனிதர் அனைவரும்[a] உம்மிடம் வருவார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், ‘எல்லா மாம்சமும்’; இது மனிதகுலம் முழுவதையும் குறிக்கும் கவித்துவச் சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵעַ
  choice: கேட்பவரே
  rationale: שׁמע என்பதன் Qal வினையெச்சம் இங்கு கடவுளை நேரடியாக அழைக்கும் பெயர்ச்சொல் தன்மையில் வருகிறது. ‘கேட்பவரே’ என்பது அந்த அழைப்பையும் தொடர்ச்சியான பண்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: תְּפִלָּה
  choice: மன்றாட்டை
  rationale: ஒருமைச் சொல் இங்கு ஒரு குறிப்பிட்ட வேண்டுதலை அல்ல, பொதுவாகக் கடவுளிடம் செய்யப்படும் மன்றாட்டைக் குறிக்கிறது. ‘மன்றாட்டு’ என்பது நவீன, கண்ணியமான தமிழில் வேண்டுதல் நிறைந்த ஜெபத்தைத் தெளிவாக உணர்த்துகிறது.
- source_word: עָדֶיךָ
  choice: உம்மிடம்
  rationale: עַד மற்றும் இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு, வருதல் என்ற இயக்க வினையுடன் சேர்ந்து இலக்கைச் சுட்டுகிறது. கடவுளை நோக்கிய மரியாதையான தமிழில் ‘உம்மிடம்’ இயல்பானது.
- source_word: כָּל־בָּשָׂר
  choice: மனிதர் அனைவரும்
  rationale: சொல்லுக்குச் சொல் ‘எல்லா மாம்சமும்’ என்ற எபிரெயக் கவித்துவ மரபுத்தொடர் இங்கு மனிதகுலம் முழுவதையும் குறிக்கிறது. முதன்மை உரையில் தெளிவான நவீன தமிழைப் பயன்படுத்தி, மூல உருவகத்தை அடிக்குறிப்பில் பதிவு செய்துள்ளது.
- source_word: יָבֹאוּ
  choice: வருவார்கள்
  rationale: மூன்றாம் நபர் பன்மை imperfect வடிவம் எதிர்கால அல்லது இன்னும் நிறைவுறாத செயலைக் குறிக்கிறது. இச்சூழலில் ‘வருவார்கள்’ அந்த எதிர்நோக்கும் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: כָּל־בָּשָׂר என்பதன் வரம்பு
  choice: மனிதகுலம் முழுவதையும் குறிக்கும் ‘மனிதர் அனைவரும்’
  alternative: ‘எல்லா மாம்சமும்’ அல்லது ‘உயிருள்ள அனைவரும்’
  rationale: இம்மரபுத்தொடர் மனிதர் அனைவரையும் விரிவாகக் குறிக்கிறது. ‘மனிதர் அனைவரும்’ அதன் உலகளாவிய மனித வரம்பைக் குறுக்காமல் தெளிவுபடுத்துகிறது; ‘உயிருள்ள அனைவரும்’ என மொழிபெயர்ப்பது விலங்குகளையும் சேர்த்துக் கொள்ளும் பொருளைத் தேவையின்றி உருவாக்கலாம். மூலத்தின் கவித்துவச் சொல்லாட்சி அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு கண்ணியத்துடன் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைப்பதால் ‘கேட்பவரே’ என்றும், மரியாதை ஒருமைக்காக ‘உம்மிடம்’ என்றும் அமைக்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரு அலகுகளையும் காட்ட வரி பிரிப்பு வைக்கப்பட்டுள்ளது.
