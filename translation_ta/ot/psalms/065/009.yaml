base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/009.yaml
  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
translation:
  language: ta
  text: 'நீர் பூமியை நாடிவந்து அதற்கு நீரூட்டுகிறீர்;

    அதை மிகுதியாகச் செழிக்கச் செய்கிறீர்.

    தேவனுடைய ஆறு[a] நீரால் நிறைந்திருக்கிறது;

    அவர்களுடைய தானியத்தை[b] நீர் ஆயத்தப்படுத்துகிறீர்;

    ஏனெனில் இவ்வாறே பூமியை ஆயத்தப்படுத்துகிறீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தேவனுடைய ஓடை’ அல்லது ‘தேவனுடைய நீர்க்கால்’ என்றும் மொழிபெயர்க்கலாம். இந்த எபிரேயக் கவித்துவத் தொடர், மழைக்கும் வளத்திற்கும் உரிய விண்ணக நீராதாரத்தை நினைவூட்டக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களுடைய தானியத்தை வழங்குகிறீர்’ அல்லது ‘அவர்களுடைய தானியத்தை நிலைபெறச் செய்கிறீர்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வினைச்சொல் ‘ஆயத்தப்படுத்து,’ ‘தயார் செய்,’ அல்லது ‘நிலைநிறுத்து’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  choice: நீர் பூமியை நாடிவந்து
  rationale: פָּקַד என்பது கவனிக்க, நாடிவர, அக்கறையுடன் அணுக என்பவற்றை உள்ளடக்கும். வளமளிக்கும் சூழலில், இறைவன் அருளுடன் பூமியை அணுகுவதைக் காட்டும் எபிரேய உருவகத்தை ‘நாடிவந்து’ காக்கிறது.
- source_word: וַתְּשֹׁקְקֶהָ
  choice: அதற்கு நீரூட்டுகிறீர்
  rationale: இங்கு நிலத்துக்கு நீர் வழங்கி ஈரப்படுத்துவது பொருள். ‘நீரூட்டுகிறீர்’ என்பது வேளாண்மைச் சூழலுக்கு இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: רַבַּת תַּעְשְׁרֶנָּה
  choice: அதை மிகுதியாகச் செழிப்பாக்குகிறீர்
  rationale: רַבַּת தரும் மிகுதியையும், עשר என்பதன் காரணவினைப் பொருளான ‘செழிப்படையச் செய்தல்’ என்பதையும் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: פֶּלֶג אֱלֹהִים
  choice: தேவனுடைய ஆறு
  rationale: פֶּלֶג என்பது ஆறு, ஓடை அல்லது நீர்க்கால் எனப் பொருள்படலாம். אֱלֹהִים உடனான இணைப்பை நேரடியாகக் காத்து, உயர்ந்த கவித்துவப் படிமத்தை ‘தேவனுடைய ஆறு’ வெளிப்படுத்துகிறது.
- source_word: מָלֵא מָיִם
  choice: நீரால் நிறைந்திருக்கிறது
  rationale: நீரின் பெருக்கைத் தெளிவாகவும் இயல்பான தமிழிலும் காட்டும் நேரடியான மொழிபெயர்ப்பு.
- source_word: תָּכִין דְּגָנָם
  choice: அவர்களுடைய தானியத்தை நீர் ஆயத்தப்படுத்துகிறீர்
  rationale: כון என்பதன் ஹிஃபில் வடிவம் ஆயத்தப்படுத்துதல், நிலைநிறுத்துதல் அல்லது ஏற்பாடு செய்தல் என்று பொருள்படும். דְּגָנָם-இல் உள்ள ஆண்பால் பன்மை உடைமைப் பின்னொட்டை ‘அவர்களுடைய’ என்று வெளிப்படையாகக் காக்கிறது.
- source_word: כִּי כֵן תְּכִינֶהָ
  choice: ஏனெனில் இவ்வாறே பூமியை ஆயத்தப்படுத்துகிறீர்
  rationale: பெண்பால் ஒருமைப் பின்னொட்டு ‘பூமி’யைக் குறிக்கிறது. முந்தைய כון வினையுடனான சொல் தொடர்பை ‘ஆயத்தப்படுத்துகிறீர்’ என்று மீண்டும் பயன்படுத்திக் காக்கிறது.
theological_decisions:
- issue: ‘அவர்களுடைய தானியம்’ என்பதிலுள்ள பன்மைப் பின்னொட்டின் குறிப்பு
  choice: மூலத்தின் ஆண்பால் பன்மைப் பின்னொட்டை ‘அவர்களுடைய தானியம்’ என்று அப்படியே காத்தல்.
  alternative: மக்களைக் குறிப்பதாக வெளிப்படையாக விளக்குதல் அல்லது பொதுவாக ‘பூமியின் விளைச்சல்’ என்று மொழிபெயர்த்தல்.
  rationale: எபிரேயப் பின்னொட்டு பெண்பால் ஒருமையான ‘பூமி’யுடன் இலக்கண ரீதியாக ஒன்றல்ல. அது நிலத்தின் பயனைப் பெறும் மக்களைக் குறிக்கக்கூடும்; ஆயினும் மூலத்தில் அந்தக் குறிப்பு வெளிப்படையாகச் சொல்லப்படவில்லை. எனவே அதன் நுண்ணிய தெளிவின்மையை மொழிபெயர்ப்பு காக்கிறது.
- issue: ‘தேவனுடைய ஆறு’ என்ற கவித்துவத் தொடரின் பொருள்
  choice: இறைவனுக்குரிய நீராதாரம் என்ற நேரடிக் கவித்துவ வடிவத்தை வைத்தல்.
  alternative: ‘வானத்தின் நீரோடை’ அல்லது ‘மிகப் பெரும் ஆறு’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: இந்தத் தொடர் மழை மற்றும் வளத்தின் விண்ணக மூலத்தை நினைவூட்டலாம்; ஆனால் எபிரேய உரை அதைத் தெளிவாக விளக்கவில்லை. நேரடி வடிவம் கவித்துவத்தையும் பொருள் விரிவையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைச் சுட்டும் வினைகளில் மரியாதைப் பன்மை கையாளப்பட்டுள்ளது. எபிரேய வரிகளின் இணைநிலையும் ‘ஆயத்தப்படுத்து’ என்ற மீளுரையும் பாதுகாக்கப்பட்டுள்ளன.
