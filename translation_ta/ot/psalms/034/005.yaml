  yaml_path: translation/ot/psalms/034/005.yaml
  text: They looked to him and were radiant[b][a], and their faces were not put to shame.
translation:
  language: ta
  text: அவர்கள் அவரை நோக்கினார்கள்; ஒளிர்ந்தார்கள்[b][a]; அவர்களுடைய முகங்கள் அவமானப்படவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேய மெய்யெழுத்து உரையில் ‘என்னை’ என்றும், வாசிப்பு மரபில் ‘அவரை’ என்றும் உள்ளது. சூழலுக்கு ஏற்ப முதன்மை உரை வாசிப்பு மரபிலுள்ள ‘அவரை’ என்பதைப் பின்பற்றுகிறது; ‘என்னை’ என்பது மாற்று வாசிப்பு.
    reason: textual_variant
  - marker: b
    text: அல்லது, ‘பிரகாசித்தார்கள்.’ இச்சூழலில் எபிரேய வினை ஒளிர்தல் அல்லது பிரகாசமாதலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: நோக்கிப் பார்த்தவர்கள்
  rationale: நבט என்பதன் ஹிஃபில் வடிவம் ஒருவரை நோக்கிப் பார்ப்பதைக் குறிக்கிறது. தமிழில் இயல்பாகவும், எபிரெய வினையின் பன்மை எழுவாயைத் தெளிவாகவும் வெளிப்படுத்த இவ்வாறு பெயரெச்சத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: אֵלָיו
  choice: அவரை
  rationale: எழுத்து/வாசிப்பு மரபில் ‘என்னை’ மற்றும் ‘அவரை’ என்ற வேறுபாடு உள்ளது. சூழலில் மக்கள் கர்த்தரை நோக்கிப் பார்ப்பதாக வரும் மூன்றாம் நபர் வாசிப்புக்கு ‘அவரை’ பொருந்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְנָהָרוּ
  choice: ஒளிபெற்றார்கள்
  rationale: இந்தச் சூழலில் வினை ஒளிர்தல் அல்லது முகம் பிரகாசமடைதல் என்ற பொருளைத் தருகிறது. ‘ஒளிபெற்றார்கள்’ என்பது அந்த விளைவுநிலையை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: וּפְנֵיהֶם
  choice: அவர்களுடைய முகங்கள்
  rationale: எபிரெய மூலத்தின் தெளிவான ‘முகங்கள்’ என்ற உருவகத்தைச் சுருக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: אַל יֶחְפָּרוּ
  choice: வெட்கத்திற்கு உள்ளாகவில்லை
  rationale: இங்கு אַל என்பதைத் தடைக் கட்டளையாக அல்லாமல், ஏற்பட்ட விளைவை வலுவாக மறுக்கும் சொல்லாகப் புரிந்துகொள்கிறோம். חפר என்பதிலுள்ள அவமானம் அல்லது பழிக்கு உள்ளாதல் என்ற சமூகப் பரிமாணத்தையும் இச்சொற்றொடர் தக்கவைக்கிறது.
theological_decisions:
- issue: אֵלָי/ו என்பதில் எழுத்து மற்றும் வாசிப்பு மரபின் வேறுபாடு
  choice: அவரை
  alternative: என்னை
  rationale: பன்மை வினைகளும் அடுத்துவரும் பன்மைக் கூற்றும் மக்களைக் குறிக்க, அவர்கள் கர்த்தரை நோக்குவதாகப் புரியும் மூன்றாம் நபர் வாசிப்பு சூழலுக்கு இயல்பாக உள்ளது. எனினும், பேச்சாளரின் பார்வையை மாற்றும் முதல் நபர் வாசிப்பு உண்மையான உரைமாற்றாக இருப்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைத் தன்மையையும் ‘முகங்கள்’ என்ற எபிரெய உருவகத்தையும் காக்கும் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் நடை. அடிக்குறிப்பு குறிகள் ஆங்கில ஆலோசனை உரையிலுள்ள வரிசைப்படியே [b][a] என உரையில் வைக்கப்பட்டுள்ளன.
