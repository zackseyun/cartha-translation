revisions:
- from: அவருடைய பரிசுத்தர்களே, யாவேக்கு அஞ்சுங்கள்; அவருக்கு அஞ்சுகிறவர்களுக்கு ஒரு குறையும் இல்லை.
  to: யாவேயின் பரிசுத்தர்களே, அவருக்கு அஞ்சுங்கள்; அவருக்கு அஞ்சுகிறவர்களுக்கு எந்தக் குறையும் இல்லை.
  rationale: The revision clarifies that the holy ones belong to Yahweh by replacing an initially unanchored pronoun with the divine name. It retains the Hebrew's vocative force, repeated fear vocabulary, and unqualified statement that those who fear him lack nothing.
