id: PSA.34.9
reference: Psalms 34:9
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יְר֣אוּ אֶת יְהוָ֣ה קְדֹשָׁ֑י/ו כִּי אֵ֥ין מַ֝חְס֗וֹר לִ/ירֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/009.yaml
  text: Fear Yahweh[a], his holy ones[b], for those who fear him lack nothing.
translation:
  language: ta
  text: யாவேயின் பரிசுத்தர்களே, அவருக்கு அஞ்சுங்கள்; அவருக்கு அஞ்சுகிறவர்களுக்கு எந்தக் குறையும் இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְר֣אוּ
  choice: அஞ்சுங்கள்
  rationale: ירא வினையின் இரண்டாம் நபர் பன்மை ஏவல் வடிவம். “அஞ்சுங்கள்” என்பது பயபக்தியையும் உண்மையான அச்சத்தையும் உள்ளடக்கி, சங்கீத ஞானப்போதனையின் வலிமையைத் தக்கவைக்கிறது.
- source_word: אֶת יְהוָה
  choice: யாவேக்கு
  rationale: את என்பது நேரடி செயப்படுபொருள் குறியீடு; יְהוָה என்ற உடன்படிக்கைப் பெயர் தமிழில் “யாவே” என ஒலிபெயர்க்கப்படுகிறது. தமிழ் வினைத்தொடருக்கு இயல்பாக நான்காம் வேற்றுமை உருபு சேர்க்கப்பட்டுள்ளது.
- source_word: קְדֹשָׁיו
  choice: அவருடைய பரிசுத்தர்களே
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் பன்மை பெயரடைப் பெயராக்கம். அழைக்கப்படும் தேவனுடைய மக்களைக் குறிக்கும் சொல் என்பதால் விளிப்புமைத் தொனியுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில் என்பதற்குரிய விளக்க உறவு; தமிழில் அரைப்புள்ளி வழியாக இயல்பாக வெளிப்படுத்தப்பட்டது
  rationale: இச்சொல் முந்தைய கட்டளைக்கான காரணத்தை அறிமுகப்படுத்துகிறது. தனியாக “ஏனெனில்” சேர்ப்பதைவிட அரைப்புள்ளிக்குப் பின் வரும் காரணவாக்கியம் தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֵין מַחְסוֹר
  choice: ஒரு குறையும் இல்லை
  rationale: குறைபாடு அல்லது தேவை இல்லாமையைச் சொல்லும் எபிரெய மொழிமரபை இயல்பான நவீனத் தமிழில் தருகிறது; இது எல்லா விருப்பங்களும் நிறைவேறும் என்று மிகைப்படுத்தாது.
- source_word: לִירֵאָיו
  choice: அவருக்கு அஞ்சுகிறவர்களுக்கு
  rationale: לְ முன்னொட்டும், ירא என்பதன் பன்மைப் பெயரெச்ச வடிவமும், மூன்றாம் நபர் ஆண்பால் ஒருமைப் பின்னொட்டும் இயல்பான தமிழ்ப் பெயரெச்சத் தொடராகத் தரப்பட்டுள்ளன. தொடக்க வினையுடனான சொல்லிணைப்பைக் காக்க “அஞ்சு” மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பொதுப்பட்டப் பெயர் அல்ல, நான்கெழுத்துத் தெய்வீகப் பெயரே உள்ளது. ஆகவே உடன்படிக்கைப் பெயரை மறைக்காமல் தமிழில் நேரடியாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: “ஒரு குறையும் இல்லை” என்ற வாக்குறுதியின் பரப்பு
  choice: மூலத்தின் முழுமையான வலியுறுத்தலை அப்படியே வைத்தல்
  alternative: “தேவையான நன்மை ஒன்றிலும் குறைவுபடமாட்டார்கள்” என்று விளக்கமாகக் கட்டுப்படுத்துதல்
  rationale: מַחְסוֹר என்பது குறைவு/தேவை என்பதைக் குறிக்கிறது; இவ்வசனம் தனியாக எந்த வகைக் குறைவு என்று வரையறுக்கவில்லை. ஆகவே சூழலிலிருந்து ஒரு விளக்கத்தை உரைக்குள் இறக்காமல் அதன் இறையியல் அழுத்தமும் திறந்த தன்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதத்துக்குரிய கண்ணியமான, நேரடியான அழைப்புத் தொனி. “பரிசுத்தர்களே” என்பது மரபில் புரிந்துகொள்ளத்தக்கதாய் இருப்பதோடு קְדֹשָׁיו என்பதன் சொற்பொருளையும் காக்கிறது. மூலத்தில் இல்லாத விளக்கங்களைத் தவிர்த்து, சுருக்கமான இணைநடை பேணப்பட்டுள்ளது.
