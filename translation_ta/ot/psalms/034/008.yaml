  yaml_path: translation/ot/psalms/034/008.yaml
  text: Taste and see that Yahweh is good[a]; blessed is the man who takes refuge in him.
translation:
  language: ta
  text: 'யாவே நல்லவர் என்பதைச் சுவைத்துப் பாருங்கள்;

    அவரிடம் அடைக்கலம் புகுகிற மனிதன்[a] பேறுபெற்றவன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் நேரடியாக ‘அந்த மனிதன்’; இங்குள்ள ஆண்பால் ஒருமை, யாவேயிடம் அடைக்கலம் புகும் எவரையும் பிரதிநிதித்துவமாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַעֲמוּ וּרְאוּ
  choice: சுவைத்துப் பாருங்கள்
  rationale: இரண்டு பன்மை ஏவல் வினைகளின் உணர்வுப் புல உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது. இது வெறும் ‘அனுபவியுங்கள்’ என்று கருத்தை மட்டும் கூறாமல், சுவைத்தல்–காணுதல் என்ற கவிதைச் சொல்லாட்சியையும் பாதுகாக்கிறது.
- source_word: כִּי טוֹב
  choice: நல்லவர் என்பதை
  rationale: כִּי இங்கு அறியப்பட வேண்டிய உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; טוֹב என்பது யாவேயின் இயல்பையும் நன்மை செய்வதையும் உள்ளடக்கும் பரந்த சொல். தமிழில் நபரைக் குறிக்கும் மரியாதை ஒருமைக்கு ஏற்றவாறு ‘நல்லவர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவன்
  rationale: விரும்பத்தக்க நல்வாழ்வு நிலையில் இருப்பதை அறிவிக்கும் வாழ்த்துரைத் தன்மையைத் தருகிறது; வெறும் மனநிலையாகிய ‘மகிழ்ச்சியானவன்’ என்பதைக் காட்டிலும் மூலத்தின் பரப்பை நன்கு காக்கிறது.
- source_word: הַגֶּבֶר
  choice: மனிதன்
  rationale: மூலத்தில் உள்ள ஆண்பால் ஒருமையைத் தமிழில் இயல்பாகக் காட்டுகிறது; இங்கு அது யாவேயிடம் அடைக்கலம் புகும் எவரையும் பிரதிநிதித்துவமாகக் குறிக்கிறது என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: יֶחֱסֶה בּוֹ
  choice: அவரிடம் அடைக்கலம் புகுகிற
  rationale: חסה என்பதிலுள்ள பாதுகாப்பை நாடும் உருவகத்தை ‘நம்புகிற’ என்று பொதுமைப்படுத்தாமல் பாதுகாக்கிறது; בּוֹ என்ற சுட்டுப்பெயர் யாவேயையே குறிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, இஸ்ரவேலின் தேவனுடைய தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: הַגֶּבֶר என்பதின் ஆண்பால் ஒருமையும் பிரதிநிதித்துவப் பொருளும்
  choice: மனிதன்
  alternative: ஒருவர்
  rationale: எபிரெயச் சொல்லின் ஆண்பால் ஒருமை வடிவத்தை முதன்மை உரையில் தக்கவைத்தபடியே, அதன் பிரதிநிதித்துவமான பொதுப் பொருளை அடிக்குறிப்பில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சுவைத்துப் பாருங்கள்’ என்ற இயல்பான தமிழ் தொடரில் மூலத்தின் இரு உணர்வுப் புல வினைகளும் இணைக்கப்பட்டுள்ளன; பாதுகாப்பு உருவகத்திற்காக ‘அடைக்கலம் புகுகிற’ தக்கவைக்கப்பட்டுள்ளது.
