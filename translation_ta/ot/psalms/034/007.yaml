  yaml_path: translation/ot/psalms/034/007.yaml
  text: The angel of Yahweh encamps around those who fear him[a], and rescues them.
translation:
  language: ta
  text: யாவேயின் வானதூதர் அவருக்கு அஞ்சுகிறவர்களைச் சுற்றிலும் முகாமிட்டு, அவர்களை மீட்கிறார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவேயின் தூதர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய மொழியில் מַלְאָךְ என்ற சொல் ‘தூதர்’ அல்லது ‘வானதூதர்’ எனப் பொருள்படலாம்; இங்கு ‘வானதூதர்’ என்பதே அதிகம் சாத்தியமான பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  choice: முகாமிட்டு
  rationale: חנה என்பதன் Qal வினையெச்சம் முகாமிடுதலைக் குறிக்கிறது. பாதுகாப்புக்காகச் சுற்றிலும் படை முகாமிடும் உருவகத்தைத் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: מַלְאַךְ יְהוָה
  choice: யாவேயின் தூதர்
  rationale: מַלְאַךְ என்பது மனிதத் தூதரையோ விண்ணுலகத் தூதரையோ குறிக்கலாம். இச்சொற்றொடரில் விண்ணுலகத் தூதர் என்பது அதிகம் இயல்பான வாசிப்பு; இருப்பினும் ‘தூதர்’ என்ற தமிழ் சொல் மூலத்தின் பொருள் விரிவைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தால் மாற்றாமல், எபிரெய இறைப்பெயரான יהוה என்பதைத் தமிழில் ‘யாவே’ என்று ஒலிபெயர்த்துள்ளது.
- source_word: סָבִיב
  choice: சுற்றிலும்
  rationale: சூழ்ந்திருக்கும் இடநிலையையும் பாதுகாப்பு உணர்வையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִירֵאָיו
  choice: அவருக்கு அஞ்சுகிறவர்கள்
  rationale: இது யாவேயிடம் அச்சமும் ஆழ்ந்த மரியாதையும் கொண்டவர்களைக் குறிக்கிறது. ‘அஞ்சுகிறவர்கள்’ என்பது மூலத்தின் வலிமையையும் வழக்கமான வேதாகமச் சொல்லாட்சியையும் காக்கிறது.
- source_word: וַיְחַלְּצֵם
  choice: அவர்களை மீட்கிறார்
  rationale: חלץ இச்சூழலில் ஆபத்திலிருந்து விடுவித்தல் அல்லது காப்பாற்றுதல் எனப் பொருள்படும். ‘மீட்கிறார்’ என்பது சுருக்கமாகவும் இயல்பாகவும் பாதுகாப்பு உருவகத்தோடு பொருந்துகிறது.
theological_decisions:
- issue: מַלְאַךְ יְהוָה என்பது பொதுவான ‘தூதரா,’ விண்ணுலகத் தூதரா, அல்லது இறைத்தோற்றமாக அடையாளப்படுத்தப்பட வேண்டுமா?
  choice: ‘யாவேயின் தூதர்’ என்று மொழிபெயர்த்து, அவருடைய அடையாளத்தை மேலும் வரையறுக்காமல் விடுதல்.
  alternative: ‘யாவேயின் வானதூதர்’; அல்லது இதை ஓர் இறைத்தோற்றம்/கிறிஸ்துவின் முன்தோற்றம் என்று வெளிப்படையாக அடையாளப்படுத்துதல்.
  rationale: சூழலில் விண்ணுலகத் தூதர் என்ற வாசிப்பு இயல்பானது. ஆனால் எபிரெயச் சொல் ‘தூதர்’ என்ற விரிந்த பொருளையும் கொண்டிருப்பதால், தமிழ் முதன்மை உரை அந்தச் சாத்தியத்தையும் இறையியல் பதற்றத்தையும் தீர்மானிக்காமல் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை. ‘முகாமிட்டு’ என்பது மூலத்தின் பாதுகாப்பு மற்றும் படைசார் உருவகத்தைத் தக்கவைக்கிறது; ‘அஞ்சுகிறவர்கள்’ என்பது வெறும் மரியாதை என்று மெலிதாக்காமல் மூலத்தின் பல்பொருள் நயத்தைக் காக்கிறது. இறைப்பெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
