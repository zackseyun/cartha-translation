  language: ta
  text: நீதிமானுக்கு[b] துன்பங்கள்[a] பல; ஆனாலும், அவை அனைத்திலிருந்தும் யாவே அவனை விடுவிக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
