    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: பல
  rationale: பெண்பால் பன்மை பெயரெச்சமாகிய இதை, தொடர்ந்து வரும் ‘துன்பங்கள்’ என்பதன் எண்ணிக்கையை வலியுறுத்தும் இயல்பான தமிழ்ச் சொல்லாக மொழிபெயர்க்கிறது.
- source_word: רָעוֹת
  choice: துன்பங்கள்
  rationale: இச்சூழலில் நீதிமானுக்கு நேரிட்டு, அவற்றிலிருந்து அவர் மீட்கப்படுகிற இடர்களைக் குறிக்கிறது; ‘தீமைகள்’ என்ற பொருளும் எபிரெயச் சொல்லில் இருப்பதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஆண்பால் ஒருமை வடிவைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது; இது நீதியுள்ள ஒருவரைப் பிரதிநிதித்துவ முறையில் குறிக்கலாம்.
- source_word: וּמִכֻּלָּם
  choice: ஆனாலும் அவை அனைத்திலிருந்தும்
  rationale: வாவ் இணைப்பின் சூழல்சார் முரண்பாட்டையும், כֻּלָּם என்பதன் முழுமையான பரப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יַצִּילֶנּוּ
  choice: அவனை விடுவிக்கிறார்
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் இங்கு ஆபத்திலிருந்து மீட்பதையோ விடுவிப்பதையோ குறிக்கிறது; தொடர்ச்சியான பொதுமெய்மையை நிகழ்காலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: צַדִּיק என்பதிலுள்ள பிரதிநிதித்துவ ஆண்பால் ஒருமை
  choice: நீதிமான்
  alternative: நீதியுள்ளவர்
  rationale: மூலத்தின் ஆண்பால் ஒருமையைப் பாதுகாக்கிறது; அதேவேளை இது ஆண்களுக்கு மட்டும் வரையறுக்கப்படாத பிரதிநிதித்துவப் பயன்பாடாக இருக்கலாம் என்பதை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: רָעוֹת என்பதன் பொருள்
  choice: துன்பங்கள்
  alternative: தீமைகள் / இடர்கள்
  rationale: நீதிமான் செய்கிற ஒழுக்கத் தீமையைக் குறிக்காமல், அவருக்கு நேரிடும் கடின அனுபவங்களையே சூழல் சுட்டுகிறது; எனினும் மூலச்சொல்லின் விரிந்த பொருளை அடிக்குறிப்பு மறைக்கவில்லை.
- issue: יְהוָה என்ற இறைப் பெயர்
  choice: யாவே
  alternative: யெகோவா / கர்த்தர்
  rationale: மூலத்தில் நேரடியாக உள்ள தனிப்பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘நீதிமான்’ என்ற வேதாகமப் பயன்பாடு மூலத்தின் ஒருமை வடிவைத் தக்கவைக்கிறது; ‘துன்பங்கள் பல’ என்ற அமைப்பு எபிரெய வசனத்தின் தொடக்க வலியுறுத்தலை இயல்பான தமிழில் பிரதிபலிக்கிறது.
