    text: “தீமைகள்,” “இடர்கள்,” அல்லது “பேரிடர்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் இங்கு நீதிமானுக்கு நேரிடும் துன்பங்களைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
