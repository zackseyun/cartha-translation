id: PSA.34.20
reference: Psalms 34:20
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שֹׁמֵ֥ר כָּל עַצְמוֹתָ֑י/ו אַחַ֥ת מֵ֝/הֵ֗נָּה לֹ֣א נִשְׁבָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/020.yaml
  text: He keeps all his bones[b][a]; not one of them is broken.
translation:
  language: ta
  text: அவருடைய எலும்புகள் அனைத்தையும் அவர் காக்கிறார்[a]; அவற்றில் ஒன்றும் முறிக்கப்படவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பாதுகாக்கிறார்” அல்லது “பேணிக் காக்கிறார்.”
    reason: lexical_alternative
  - marker: b
    text: இயேசு சிலுவையில் அறையப்பட்டதுடன் தொடர்புபடுத்தி இந்த வரி யோவான் 19:36-ல் மேற்கோள் காட்டப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: שֹׁמֵר
  choice: காக்கிறார்
  rationale: שׁמר என்பதன் பங்கேற்புவினை வடிவம் பாதுகாத்தல், காத்தல் என்ற தொடர்ச்சியான செயலைக் குறிக்கிறது; ‘காக்கிறார்’ என்பது இயல்பான நவீனத் தமிழில் பாதுகாப்பையும் பராமரிப்பையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: כָּל עַצְמוֹתָיו
  choice: அவருடைய எலும்புகள் அனைத்தையும்
  rationale: כָּל என்பது முழுத்தொகுதியையும், עַצְמוֹתָיו என்பது மூன்றாம் ஆண்பால் ஒருமை உடைமை விகுதியுடன் ‘அவருடைய எலும்புகள்’ என்பதையும் குறிக்கிறது.
- source_word: אַחַת מֵהֵנָּה
  choice: அவற்றில் ஒன்றும்
  rationale: מן உடன் வரும் சுட்டுப்பெயர் பகுதியைக் குறிக்கும் பொருளில் ‘அவற்றில்’ எனவும், மறுப்புடன் אַחַת ‘ஒன்றும்’ எனவும் இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: לֹא נִשְׁבָּרָה
  choice: முறிக்கப்படவில்லை
  rationale: שׁבר என்பதன் நிஃபால் நிறைவுவினை ‘முறிக்கப்படவில்லை’ என்ற செயப்பாட்டு பொருளைத் தருகிறது; எபிரெய நிறைவுவினையின் வடிவத்தையும் வசனத்தின் உறுதியான கூற்றையும் இது காக்கிறது.
theological_decisions:
- issue: ஒருமை உடைமை விகுதியின் சுட்டுப்பொருள்
  choice: ‘அவருடைய’ என்று ஒருமையில் மொழிபெயர்த்து, சங்கீதத்தின் உடனடிச் சூழலில் நீதிமானைக் குறிக்குமாறு விடப்பட்டுள்ளது.
  alternative: ‘நீதிமானுடைய எலும்புகள்’ என்று வெளிப்படையாகக் கூறுதல் அல்லது யோவான் 19:36-இன் ஒளியில் பிரதான உரையிலேயே கிறிஸ்துவைக் குறிப்பிடுதல்.
  rationale: எபிரெய உரையில் ஆண்பால் ஒருமை விகுதி உள்ளது; உடனடிச் சூழல் ஆண்டவர் விடுவிக்கும் நீதிமானைப் பற்றியது. பின்னைய கிறிஸ்தவ வேதப் பயன்பாட்டை பிரதான உரைக்குள் இறக்காமல், அடிக்குறிப்பில் குறுக்குக்குறிப்பு தரப்படுகிறது.
- issue: வினையின் காலம் மற்றும் கூற்றின் தன்மை
  choice: ‘முறிக்கப்படவில்லை’ என எபிரெய நிறைவுவினைக்கு நெருக்கமாக மொழிபெயர்க்கப்பட்டது.
  alternative: பொதுவான அல்லது எதிர்காலப் பொருளில் ‘முறிக்கப்படுவதில்லை’ / ‘முறிக்கப்படாது’ என்று மொழிபெயர்த்தல்.
  rationale: נִשְׁבָּרָה என்பது நிறைவுவினை; கவிதைச் சூழல் பொதுவான பாதுகாப்பைக் குறிக்கக்கூடியதாக இருந்தாலும், காலத் தெளிவின்மையை ஒரே விளக்கத்தால் தீர்க்காமல் மூல வடிவத்துக்கு நெருக்கமான தமிழ் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்’ என்ற மரியாதை ஒருமை இயல்பான தமிழுக்காகப் பயன்படுத்தப்பட்டாலும், எபிரெய உரையின் ஒருமைச் சுட்டு பாதுகாக்கப்பட்டுள்ளது.
