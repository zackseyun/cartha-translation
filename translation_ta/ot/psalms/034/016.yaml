  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் அனைத்தும் சரியாக உள்ளன: யாவேயின் ‘முகம்,’ தீமை செய்பவர்களுக்கெதிரான நிலைப்பாடு, அவர்களின் நினைவை பூமியிலிருந்து அகற்றும் நோக்கம், மற்றும் אֶרֶץ என்பதற்கான ‘நாடு’ மாற்றுவாசிப்பு ஆகியவை பாதுகாக்கப்பட்டுள்ளன. ஆனால் ‘நினைவை ... அறுத்துப்போடுதல்’ தமிழில் இயல்பற்ற இணைப்பாக இருப்பதால், כרת-இன் இச்சூழல் விளைவான ‘அழித்தொழித்தல்’ மூலம் பொருளைத் தெளிவாகக் கொடுப்பது சிறந்தது.'
