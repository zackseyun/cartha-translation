lexical_decisions:
- source_word: פְּנֵי
  choice: முகம்
  rationale: எபிரெய மொழியின் உருவகத்தை நேரடியாகத் தக்கவைக்கிறது. இங்கு ‘முகம்’ என்பது தீமை செய்கிறவர்களுக்கு எதிராகத் திரும்பியிருக்கும் யாவேயின் செயல்மிக்க தனிப்பட்ட எதிர்ப்பைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைபெயராகிய நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּעֹשֵׂי רָע
  choice: தீமை செய்கிறவர்களுக்கு எதிராக
  rationale: செயற்பெயரெச்சத் தன்மையைத் தக்கவைத்து, இச்சூழலில் בְּ குறிக்கும் பகைமையான நோக்குநிலையைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְהַכְרִית
  choice: அறுத்துப்போடுவதற்காக
  rationale: כרת என்பதன் வலிமையான ‘அறுத்து அகற்றுதல்’ என்ற படிமத்தையும், இங்குள்ள நோக்கப் பொருளையும் தக்கவைக்கிறது.
- source_word: מֵאֶרֶץ
  choice: பூமியிலிருந்து
  rationale: אֶרֶץ என்பதன் பரந்த, உலகளாவிய பொருள் இஞ்ஞானச் சங்கீதத்தின் பொதுவான கூற்றுக்கு ஏற்றது; ‘நாட்டிலிருந்து’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: זִכְרָם
  choice: அவர்களுடைய நினைவை
  rationale: மூலத்தின் பெயர்ச்சொல்லையும் உடைமைப் பின்னொட்டையும் இயல்பான நவீன தமிழில் நேரடியாகக் காட்டுகிறது; அவர்களைப் பற்றிய நினைவு நிலைத்திராதிருப்பதே கருத்து.
theological_decisions:
- issue: ‘யாவேயின் முகம்’ என்னும் இறை எதிர்ப்பு உருவகம்
  choice: யாவேயின் முகம் தீமை செய்கிறவர்களுக்கு எதிராக இருக்கிறது என்ற உடல்சார்ந்த கவித்துவப் படிமம் தக்கவைக்கப்பட்டது.
  alternative: ‘யாவே தீமை செய்கிறவர்களுக்கு எதிராக இருக்கிறார்’ அல்லது ‘யாவேயின் பிரசன்னம் அவர்களுக்கு எதிராக இருக்கிறது’ என உருவகத்தை விரித்துரைத்தல்.
  rationale: மூல எபிரெயம் இறைவனின் செயல்மிக்க எதிர்ப்பை ‘முகம்’ என்ற தெளிவான மனிதவுருவக மொழியில் கூறுகிறது. அதைச் சுருக்காமல் தக்கவைப்பது கவித்துவ வலிமையையும் உண்மையான இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
- issue: אֶרֶץ என்பதன் பரப்பு
  choice: பூமி
  alternative: நாடு
  rationale: வசனம் தீமை செய்கிறவர்களின் முடிவைப் பற்றிய பொதுவான ஞானக் கூற்றாக வாசிக்கப்படுவதால் ‘பூமி’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; உள்ளூர் நிலப்பரப்பைக் குறிக்கும் ‘நாடு’ என்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமும் கண்ணியமும் கொண்ட நடையில் மொழிபெயர்க்கப்பட்டது. ‘யாவேயின் முகம்’ என்ற எபிரெய உருவகம் திட்டமிட்டு தக்கவைக்கப்பட்டுள்ளது; ‘அறுத்துப்போடுதல்’ மூலத்தின் வலிமையை எடுத்துரைக்கிறது.
