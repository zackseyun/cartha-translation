translation:
  language: ta
  text: தீமை செய்கிறவர்களுக்கு எதிராக யாவேயின் முகம் உள்ளது; அவர்களுடைய நினைவைப் பூமியிலிருந்து[a] அழித்தொழிப்பதற்காக.
