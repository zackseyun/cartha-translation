reference: Psalms 34:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: גַּדְּל֣וּ לַ/יהוָ֣ה אִתִּ֑/י וּ/נְרוֹמְמָ֖ה שְׁמ֣/וֹ יַחְדָּֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/003.yaml
  text: Magnify Yahweh with me[a], and let us exalt his name together.
translation:
  language: ta
  text: 'என்னுடன் சேர்ந்து யாவேயை[a] மேன்மைப்படுத்துங்கள்;

    நாம் ஒன்றாக அவருடைய பெயரை உயர்த்துவோம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “YHWH” (יהוה). தமிழில் இது மரபாக “கர்த்தர்” என்றும் வழங்கப்படுகிறது.'
    reason: தேவனுடைய தனிப்பெயரின் மூல வடிவத்தையும் மரபுவழி மாற்று மொழிபெயர்ப்பையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: גַּדְּלוּ
  choice: மேன்மைப்படுத்துங்கள்
  rationale: גדל என்பதன் பன்மை ஏவல் வடிவம், புகழ்ச்சியில் யாவேயின் மகத்துவத்தை அறிவித்து அவரை உயர்வாகப் போற்றும்படி அழைக்கிறது. ‘மேன்மைப்படுத்துங்கள்’ என்பது சொல்லர்த்தத்தைத் தவறாக உடலளவில் பெரிதாக்குதல் என்று உணர்த்தாமல், அந்தப் புகழ்ச்சி சார்ந்த பொருளை இயல்பாகத் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேயை
  rationale: எபிரெய மூலத்தில் தேவனுடைய தனிப்பெயரான יהוה நேரடியாக வருகிறது; அதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல், ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: אִתִּי
  choice: என்னுடன் சேர்ந்து
  rationale: முதல் நபர் ஒருமை பின்னொட்டுடன் வந்துள்ள முன்னிடைச்சொல், சங்கீதக்காரரோடு மற்றவர்களும் புகழ்ச்சியில் பங்குகொள்ள வேண்டும் என்ற பொருளைத் தருகிறது.
- source_word: וּנְרוֹמְמָה
  choice: நாம் … உயர்த்துவோம்
  rationale: רום வேரிலிருந்து வந்த முதல் நபர் பன்மை விருப்ப/அழைப்பு வடிவம் இது. சாதாரண எதிர்காலக் கூற்றாக அல்லாமல், அனைவரையும் உள்ளடக்கும் அழைப்பாக ‘நாம் … உயர்த்துவோம்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁמוֹ
  choice: அவருடைய பெயரை
  rationale: ‘பெயர்’ என்பது இங்கு தேவனுடைய வெளிப்படுத்தப்பட்ட அடையாளத்தையும் புகழையும் சுட்டுகிறது; மூலத்தின் உருவகமும் இறையியல் நிறையும் தக்கவைக்கப்பட்டுள்ளன.
- source_word: יַחְדָּו
  choice: ஒன்றாக
  rationale: ஒருங்கிணைந்த, கூட்டான செயலைக் குறிக்கும் வினையடை; நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் ‘ஒன்றாக’ என வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல எபிரெய உரை பொதுப்பட்டத்தை அல்ல, நான்கு எழுத்துகளைக் கொண்ட தேவனுடைய தனிப்பெயரையே பயன்படுத்துகிறது. எனவே பெயரை மறைக்காமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என்று வழங்கி, மரபுவழி மாற்றீட்டை அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான புகழ்ச்சி நடையைப் பயன்படுத்துகிறது. இரு பன்மை அழைப்புகளின் வேறுபாடு—முதலில் கேட்போருக்கான ஏவல், பின்னர் பேசுபவரையும் சேர்த்த கூட்டு அழைப்பு—தக்கவைக்கப்பட்டுள்ளது.
