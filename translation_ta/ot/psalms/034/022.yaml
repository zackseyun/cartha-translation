source:
  edition: WLC
  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
translation:
  language: ta
  text: 'யாவே தம் ஊழியர்களின் உயிரை[a] மீட்கிறார்;

    அவரிடம் அடைக்கலம் புகுகிறவர்களில் எவரும் குற்றவாளி என்று தீர்க்கப்பட மாட்டார்கள்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயிர்’ என்பதற்குப் பதிலாக ‘ஆத்துமா’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் நெஃபெஷ் உயிருள்ள முழு நபரைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘குற்றம் சுமக்க மாட்டார்கள்’ அல்லது ‘தண்டனைத் தீர்ப்புக்கு உள்ளாக மாட்டார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை குற்றப்பொறுப்பையும் நீதித்தீர்ப்பையும் குறிக்கும் மொழியை உடையது.
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  choice: மீட்கிறார்
  rationale: פדה என்பதன் மீட்டல், விலைகொடுத்து விடுவித்தல், ஆபத்திலிருந்து காத்தல் ஆகிய பொருள் வளத்தை ‘மீட்கிறார்’ இயல்பாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பாக மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரின் பொதுவாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: இங்கு נֶפֶשׁ உடலற்ற ஓர் அம்சத்தை மட்டும் அல்லாமல், உயிரையோ உயிருள்ள முழு நபரையோ குறிக்கிறது; ‘உயிர்’ இதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: עֲבָדָיו
  choice: தம் ஊழியர்கள்
  rationale: சங்கீதச் சூழலில் கடவுளுக்குச் சேவை செய்து அவரைச் சார்ந்திருப்பவர்களைக் குறிக்க ‘ஊழியர்கள்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: יֶאְשְׁמוּ
  choice: குற்றவாளி என்று தீர்க்கப்பட மாட்டார்கள்
  rationale: אשם வினையின் குற்றப்பொறுப்பு அல்லது நீதித்தீர்ப்புசார் பொருளைத் தக்கவைக்கிறது; இறுதி நியாயத்தீர்ப்பைப் பற்றிய தேவையற்ற கூடுதல் விளக்கத்தைச் சேர்க்கவில்லை.
- source_word: הַחֹסִים בּוֹ
  choice: அவரிடம் அடைக்கலம் புகுகிறவர்கள்
  rationale: חסה என்பதில் உள்ள பாதுகாப்பை நாடி அடைக்கலம் புகும் உருவகத்தை, பொதுவான ‘நம்புகிறவர்கள்’ என்பதைக் காட்டிலும் துல்லியமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: இரட்சிப்புச் சூழலில் נֶפֶשׁ என்பதன் பொருள்
  choice: ‘உயிர்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘ஆத்துமா’ அல்லது ‘நபர்’ என்று மொழிபெயர்த்தல்.
  rationale: இச்சொல் இங்கு முழு உயிருள்ள நபரையோ அவரது உயிரையோ குறிக்கக்கூடும். ‘உயிர்’ என்பது மூலத்தில் இல்லாத உடல்–ஆத்துமா இருமைப் புரிதலைத் திணிக்காது.
- issue: יֶאְשְׁמוּ என்பதன் வலிமை
  choice: ‘குற்றவாளி என்று தீர்க்கப்பட மாட்டார்கள்’ என்ற நீதித்தீர்ப்புசார் மொழி பயன்படுத்தப்பட்டது.
  alternative: ‘குற்றம் சுமக்க மாட்டார்கள்’ அல்லது வலிமையாக ‘தண்டனைத் தீர்ப்புக்கு உள்ளாக மாட்டார்கள்.’
  rationale: இந்த வினை குற்றம், குற்றப்பொறுப்பு, குற்றத்தீர்ப்பு ஆகிய பொருட்களைத் தரக்கூடும். தேர்ந்த சொற்றொடர் நீதிசார் தன்மையைப் பாதுகாத்து, குறிப்பிட்ட இறுதிக்காலத் தீர்ப்பை வாசகத்தில் திணிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டது. ‘அடைக்கலம் புகுதல்’ என்ற மூல உருவகமும், மீட்பு மற்றும் குற்றத்தீர்ப்பு இடையிலான பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
