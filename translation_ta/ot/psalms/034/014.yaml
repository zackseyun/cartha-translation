  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֑וֹב בַּקֵּ֖שׁ שָׁל֣וֹם וְ/רָדְפֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/014.yaml
  text: Turn away from evil and do good[a]; seek peace and pursue it.
translation:
  language: ta
  text: தீமையை விட்டு விலகு; நன்மை செய். சமாதானத்தை[a] நாடு; அதைப் பின்தொடர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சமாதானம்” என்பதற்கான எபிரெயச் சொல் ஷாலோம்; இது மோதல் இல்லாத நிலையை மட்டுமன்றி முழுமையையும் நல்வாழ்வையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּר
  choice: விட்டு விலகு
  rationale: கட்டளை வடிவிலுள்ள இந்த வினை, ஒன்றிலிருந்து விலகிச் செல்வதையோ திரும்புவதையோ குறிக்கிறது. ‘விட்டு விலகு’ என்பது தீமையுடனான தொடர்பைத் துண்டிக்கும் செயற்பாட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מֵרָע
  choice: தீமையை
  rationale: מִן என்னும் முன்னொட்டு விலகுதலைக் குறிக்கிறது; רַע இங்குள்ள ஞான அறிவுரையின் சூழலில் ஒழுக்கத் தீமையைக் குறிக்கிறது. தமிழில் ‘தீமையை விட்டு’ என்று அமைப்பது மூலத்தின் பொருளை இயல்பாகத் தருகிறது.
- source_word: וַעֲשֵׂה טוֹב
  choice: நன்மை செய்
  rationale: தீமையிலிருந்து விலகுதல்—நன்மை செய்தல் என்ற மூலத்தின் சுருக்கமான எதிரிணையை நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: בַּקֵּשׁ
  choice: நாடு
  rationale: ஆர்வத்தோடும் நோக்கத்தோடும் தேடுவதைக் குறிக்கும் கட்டளைக்கு ‘நாடு’ என்பது சுருக்கமான, கண்ணியமான தமிழ் இணை.
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: שָׁלוֹם என்பது சமாதானம், முழுமை, நல்வாழ்வு ஆகிய விரிந்த பொருள்களைக் கொண்டது. இவ்வறிவுரையில் ‘சமாதானம்’ சிறந்த முதன்மை மொழிபெயர்ப்பு; அதன் விரிந்த பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְרָדְפֵהוּ
  choice: அதைப் பின்தொடர்
  rationale: רדף என்பது தொடர்ச்சியாகத் துரத்திச் செல்லுதல் அல்லது பின்தொடருதல் என்று பொருள்படும். ஆண்பால் ஒருமை பின்னொட்டு முன் வரும் שָׁלוֹם என்பதைக் குறிக்கிறது; ‘அதைப் பின்தொடர்’ அதன் செயற்பாட்டுத் தீவிரத்தையும் குறிப்பையும் காக்கிறது.
