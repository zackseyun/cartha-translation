  register: நவீன பொதுத்தமிழில், ஆசிரியர் மாணவர்களை அன்புடனும் அதிகாரத்துடனும் அழைக்கும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘செவிகொடுங்கள்’ என்பது கவனத்துடன் கேட்பதைக் குறிக்கிறது; ‘பயப்படுதல்’ மூலத்தின் இறையியல் பதற்றத்தைத் தக்கவைக்கிறது.
