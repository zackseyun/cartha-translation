theological_decisions:
- issue: יִרְאַת יְהוָה என்ற ஞான இலக்கியச் சொற்றொடர்
  choice: யாவேக்குப் பயப்படுதல்
  alternative: யாவேமீது பக்தி
  rationale: மூலத்தின் ‘பயம்’ என்பதில் உள்ள மரியாதை, வியப்பு, கீழ்ப்படிதல், உரிய அச்சம் ஆகிய இறையியல் அழுத்தங்களைத் தக்கவைக்கிறது; அதை ‘பக்தி’ என்று மட்டும் குறுக்கவில்லை.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரையில் நேரடியாக உள்ள உடன்படிக்கைப் பெயரைப் பொதுப்பட்டப் பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
