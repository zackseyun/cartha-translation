  rationale: எபிரெய மூலத்தில் வரும் கடவுளின் தனிப்பெயர் ஒலிபெயர்த்து வழங்கப்பட்டது.
- source_word: אֲלַמֶּדְכֶם
  choice: நான் உங்களுக்குக் கற்பிப்பேன்
