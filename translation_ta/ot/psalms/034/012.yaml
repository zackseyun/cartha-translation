  text: Who is the man who delights in life[b][a], loving days to see good?
translation:
  language: ta
  text: வாழ்வை விரும்பி, நன்மையைக் காண[b] நாட்களை நேசிக்கிற மனிதன்[a] யார்?
  philosophy: optimal-equivalence
  footnotes:
