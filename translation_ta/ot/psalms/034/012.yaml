lexical_decisions:
- source_word: מִי
  choice: யார்?
  rationale: வினாவைத் தொடங்கும் எபிரெய வினாப்பெயரை இயல்பான தமிழ் வாக்கிய அமைப்பின்படி இறுதியில் வைத்துள்ளோம்.
- source_word: הָאִישׁ
  choice: மனிதன்
  rationale: ஆண்பால் ஒருமை வடிவத்தையும், சூழலில் அதற்குள்ள பொதுப்படையான பிரதிநிதித்துவப் பொருளையும் தக்கவைக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: הֶחָפֵץ
  choice: விரும்பி
  rationale: חפץ என்பது வெறும் ஆசையை மட்டுமல்ல, மனமுவந்த நாட்டத்தையும் குறிக்கலாம்; இங்கு ‘விரும்பி’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: חַיִּים
  choice: வாழ்வை
  rationale: எபிரெயத்தில் வடிவளவில் பன்மையாக இருந்தாலும், இச்சொல் வழக்கமாக ‘வாழ்வு’ என்ற ஒருமைப் பொருளில் பயன்படுகிறது.
- source_word: אֹהֵב
  choice: நேசிக்கிற
  rationale: முந்தைய பங்கேற்பு வடிவத்துடன் இணையாக வரும் தொடர்ச்சியான பண்பை வெளிப்படுத்துகிறது.
- source_word: יָמִים
  choice: நாட்களை
  rationale: ‘வாழ்வு’ என்பதோடு உள்ள எபிரெய இணைத்தொடரையும் பன்மை வடிவத்தையும் நேரடியாகத் தக்கவைக்கிறது.
- source_word: לִרְאוֹת
  choice: காண
  rationale: ראה என்பதன் நேரடியான பொருளைத் தக்கவைத்து, ‘நன்மையைக் காண’ என்ற எபிரெய மரபுத்தொடரின் திறந்த பொருளையும் பாதுகாக்கிறது.
- source_word: טוֹב
  choice: நன்மை
  rationale: பொருளாதார வளம் எனக் குறுக்காமல், நல்லது அல்லது நன்மை என்ற விரிவான பொருளைத் தக்கவைக்கிறது.
theological_decisions:
- issue: பொதுப்படையான ஆண்பால் ஒருமை
  choice: மனிதன்
  alternative: ஒருவர் / எவராயினும்
  rationale: הָאִישׁ இலக்கணத்தில் ஆண்பால் ஒருமையாக இருந்தாலும், ஞான இலக்கிய வினாவில் பொதுவாக எந்த மனிதரையும் பிரதிநிதித்துவப்படுத்துகிறது. ‘மனிதன்’ மூலவடிவத்தைத் தக்கவைத்தபடியே தமிழில் இப்பொதுப்பொருளை வழங்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்தின் ஞானமொழி நடைக்கு ஏற்ற கண்ணியமான வினா வடிவம் பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் சொல் வரிசையை அப்படியே பின்பற்றாமல் இயல்பான தமிழ் வாக்கிய ஒழுங்கு அமைக்கப்பட்டுள்ளது; ‘வாழ்வு—நாட்கள்’ என்ற இணைநிலை மட்டும் பாதுகாக்கப்பட்டுள்ளது.
