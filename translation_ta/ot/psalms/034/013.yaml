  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: נְצֹ֣ר לְשׁוֹנְ/ךָ֣ מֵ/רָ֑ע וּ֝/שְׂפָתֶ֗י/ךָ מִ/דַּבֵּ֥ר מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/013.yaml
  text: Guard your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: ta
  text: தீமையிலிருந்து உன் நாவைக் காத்துக்கொள்; வஞ்சகம் பேசாதபடி உன் உதடுகளைக் காத்துக்கொள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצֹר
  choice: காத்துக்கொள்
  rationale: இந்தக் கட்டளைச் சொல் காத்தல், பாதுகாத்தல், கண்காணித்தல் ஆகிய பொருள்களைத் தருகிறது. பேச்சைத் தீமையிலிருந்து விலக்கிக் கட்டுப்படுத்த வேண்டும் என்ற அறிவுறுத்தலை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְשׁוֹנְךָ
  choice: உன் நாவை
  rationale: எபிரெய மொழியின் உடலுறுப்பு சார்ந்த கவித்துவப் படிமத்தையும், பேச்சைக் குறிக்கும் தமிழின் இயல்பான வழக்கையும் தக்கவைக்கிறது.
- source_word: מֵרָע
  choice: தீமையிலிருந்து
  rationale: רַע இங்கு வெறும் தீங்கைக் காட்டிலும் ஒழுக்கரீதியான தீமையைக் குறிக்கிறது; அதனால் அதன் அறநெறி வலிமை பாதுகாக்கப்படுகிறது.
- source_word: וּשְׂפָתֶיךָ
  choice: உன் உதடுகளை
  rationale: ‘நாவு’ என்பதோடு அமைந்த கவித்துவ இணைநிலையைப் பாதுகாத்து, பேச்சைக் குறிக்கும் தெளிவான உடலுறுப்பு படிமத்தைத் தக்கவைக்கிறது.
- source_word: מִדַּבֵּר
  choice: பேசாதபடி
  rationale: எபிரெய முன்னிடைச்சொல் மற்றும் வினையெச்ச அமைப்பின் தடுக்கும் பொருளை தமிழில் இயல்பாக வெளிப்படுத்துகிறது; முன் வரும் ‘காத்துக்கொள்’ என்பதை இணைவரியில் பொருளால் நிறைவு செய்கிறது.
- source_word: מִרְמָה
  choice: வஞ்சகம்
  rationale: ஏமாற்றும் அல்லது கபடமான பேச்சைக் குறிக்கும் מִרְמָה என்பதன் பொருளை நவீன, புரிந்துகொள்ள எளிய தமிழில் தருகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், நேரடியான அறநெறிக் கட்டளையாகவும் கவித்துவ இணைநிலையைப் பாதுகாக்கும் வகையிலும் மொழிபெயர்க்கப்பட்டது. இரண்டாம் ஒருமை உரிமை வடிவமான ‘உன்’ தக்கவைக்கப்பட்டுள்ளது; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கம் சேர்க்கப்படவில்லை.
