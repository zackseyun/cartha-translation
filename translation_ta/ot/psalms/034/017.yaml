  yaml_path: translation/ot/psalms/034/017.yaml
  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
translation:
  language: ta
  text: அவர்கள் கூக்குரலிட்டார்கள்; யாவே[a] கேட்டார்; அவர்களுடைய எல்லா நெருக்கடிகளிலிருந்தும் அவர்களை விடுவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
