lexical_decisions:
- source_word: צָעֲקוּ
  choice: அவர்கள் உதவிக்காகக் கூக்குரலிட்டார்கள்
  rationale: צעק என்பது நெருக்கடியில் உதவி நாடி எழுப்பும் அவசரக் கூக்குரலைக் குறிக்கிறது. தமிழில் வினையின் நோக்கத்தை இயல்பாக வெளிப்படுத்த ‘உதவிக்காகக் கூக்குரலிட்டார்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பொதுவாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: שָׁמֵעַ
  choice: கேட்டார்
  rationale: இது வடிவியல் அடிப்படையில் ஒரு பங்கேற்பு வடிவமாக இருந்தாலும், சுற்றியுள்ள நிறைவுற்ற வினைகளுடன் கவிதைத் தொடரில் கடந்தகாலச் செயலாக இயங்குகிறது; ஆகவே ‘கேட்டார்’ இயல்பானது.
- source_word: מִכָּל צָרוֹתָם
  choice: அவர்களுடைய எல்லா நெருக்கடிகளிலிருந்தும்
  rationale: מן உடன் כָּל என்பது அவர்களுடைய நெருக்கடிகள் அனைத்திலிருந்தும் விடுவித்ததைத் தெரிவிக்கிறது. צָרוֹת என்பது இங்கு உடல், சமூக அல்லது பிற துன்பநிலைகளை உள்ளடக்கக்கூடியதால் ‘நெருக்கடிகள்’ என்று பரந்த பொருளில் தரப்பட்டுள்ளது.
- source_word: הִצִּילָם
  choice: அவர்களை விடுவித்தார்
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்து மீட்டல் அல்லது விடுவித்தலைக் குறிக்கிறது. ‘விடுவித்தார்’ அதன் பரந்த பொருளையும் சங்கீதத்திற்குரிய கண்ணியமான நடையையும் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் இறைவனுடைய தனிப்பெயரான יהוה நேரடியாக உள்ளது. அதைப் பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது; வழக்கமான மாற்றீடு அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதாகப் புரியும், அதேவேளை சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் மூன்று அடுத்தடுத்த செயல்களும் அரைப்புள்ளிகளால் தெளிவாக இணைக்கப்பட்டுள்ளன. மூலத்தில் வெளிப்படையாக இல்லாத ‘உதவிக்காக’ என்பது צעק என்பதிலுள்ள அவசர வேண்டுகோள் உணர்வை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
