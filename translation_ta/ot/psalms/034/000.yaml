  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
translation:
  language: ta
  text: 'தாவீதுடையது[a]: அவன் அபிமெலேக்கின் முன்னிலையில் தன் நடத்தையை மாற்றிக்கொண்டபோது, அபிமெலேக்கு அவனைத் துரத்திவிட்டார்; அவன் சென்றான்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 சாமுவேல் 21:10–15-இல் இந்த அரசன் அகீஸ் என்று குறிப்பிடப்படுகிறார்; இங்குள்ள ‘அபிமெலேக்கு’ என்பது அவருடைய மாற்றுப் பெயராகவோ ஓர் அரச பட்டமாகவோ இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுடையது
  rationale: சங்கீதத் தலைப்புகளில் ஒருவரின் பெயருக்கு முன் வரும் לְ, ஆசிரியர், தொடர்பு, அர்ப்பணம் ஆகியவற்றில் ஒன்றைத் திட்டவட்டமாக நிர்ணயிக்காது. ‘தாவீதுடையது’ அந்தப் பரந்த தொடர்பைச் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: בְּשַׁנּוֹתוֹ
  choice: அவன் ... மாற்றிக்கொண்டபோது
  rationale: בְּ உடன் வரும் infinitive construct இங்கு காலப்பொருளைத் தருகிறது; நவீன தமிழில் ‘மாற்றிக்கொண்டபோது’ இயல்பாக உள்ளது.
- source_word: טַעְמוֹ
  choice: தன் நடத்தையை
  rationale: இச்சொல் அடிப்படையில் ‘சுவை,’ ‘பகுத்தறிவு,’ அல்லது ‘அறிவுநிலை’ என்பதைக் குறிக்கக்கூடும்; இச்சூழலில் வெளிப்படையாகக் காட்டிய நடத்தை அல்லது தோற்றத்தைக் குறிக்கும் மரபுத்தொடராக உள்ளது. ‘நடத்தை’ மருத்துவப் பொருளைத் தேவையின்றி சேர்க்காமல் சூழற்பொருளைத் தருகிறது.
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  choice: அபிமெலேக்கின் முன்னிலையில்
  rationale: மூலமொழியின் இடம்/சந்நிதி சார்ந்த பொருளை நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיְגָרֲשֵׁהוּ
  choice: அபிமெலேக்கு அவனைத் துரத்திவிட்டார்
  rationale: வினைச்சொல் ‘துரத்துதல், வெளியேற்றுதல்’ என்று பொருள்படும். எபிரெய உரையில் பெயர்ச்சுட்டுகள் மட்டுமே இருந்தாலும், தமிழில் இரு ஆண் ஒருமைப் பெயர்ச்சுட்டுகளால் ஏற்படும் குழப்பத்தைத் தவிர்க்கச் சூழலால் தெளிவாகும் அபிமெலேக்கின் பெயர் மீண்டும் கூறப்பட்டுள்ளது.
- source_word: וַיֵּלַךְ
  choice: அவன் அங்கிருந்து சென்றான்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘சென்றான்.’ துரத்தப்பட்டபின் அங்கிருந்து புறப்பட்டதைக் ‘அங்கிருந்து’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: אֲבִימֶלֶךְ
  choice: அபிமெலேக்கு
  rationale: எபிரெய உரையில் உள்ள பெயரையே தமிழில் ஒலிபெயர்த்து வைத்திருக்கிறது; 1 சாமுவேலில் வரும் அகீஸ் என்ற அடையாளம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: அபிமெலேக்கின் வரலாற்று அடையாளம்
  choice: மூல எபிரெய உரையிலுள்ள ‘அபிமெலேக்கு’ என்பதையே முதன்மை உரையில் வைத்தல்.
  alternative: அவரை காத் நகரத்து அகீஸ் என்று நேரடியாகக் குறிப்பிடுதல், அல்லது ‘அபிமெலேக்கு’ என்பதை அரச பட்டமாகப் புரிந்துகொள்ளுதல்.
  rationale: 1 சாமுவேல் 21:10–15-இல் அரசன் அகீஸ் என்று அழைக்கப்பட்டாலும், இத்தலைப்பின் எபிரெய வாசகத்தை ஒத்திசைப்பதற்காக மாற்றாமல், அடையாள வேறுபாட்டையும் அதனால் எழும் வரலாற்றுத் த tension-ஐயும் அடிக்குறிப்பில் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான சங்கீதத் தலைப்பு நடையைக் கடைப்பிடிக்கிறது. ‘நடத்தை’ என்பது எளிதில் புரியும் சொல்லாகவும், ‘பைத்தியம்’ அல்லது ‘மனநலம்’ போன்ற அளவுக்கு மீறிய விளக்கங்களைத் தவிர்ப்பதாகவும் உள்ளது. அபிமெலேக்கைக் குறிக்க மரியாதை ஒருமை பயன்படுத்தப்பட்டாலும், தாவீதைக் குறிக்கும் ‘அவன்’ மூலம் வாக்கியப் பாத்திரங்கள் தெளிவாக்கப்பட்டுள்ளன.
