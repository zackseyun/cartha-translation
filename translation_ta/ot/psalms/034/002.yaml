id: PSA.34.2
reference: Psalms 34:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בַּ֭/יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑/י יִשְׁמְע֖וּ עֲנָוִ֣ים וְ/יִשְׂמָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/002.yaml
  text: In Yahweh my soul will boast[b][a]; the humble will hear and rejoice.
translation:
  language: ta
  text: யாவேயில் என் உயிர் பெருமை பாராட்டும்; தாழ்மையானவர்கள் கேட்டு மகிழ்வார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיהוָה
  choice: யெகோவாவில்
  rationale: בְּ முன்னொட்டு, பெருமைபாராட்டுதலின் அடிப்படை அல்லது மையமாக யெகோவாவைக் குறிக்கிறது. יהוה என்ற தனிப்பெயர் பொதுப்பட்டமாக மாற்றப்படாமல் தமிழில் ஒலிபெயர்க்கப்படுகிறது.
- source_word: תִּתְהַלֵּל
  choice: பெருமைபாராட்டும்
  rationale: הלל என்பதன் ஹித்பயேல் வடிவம் இங்கு ‘பெருமை பேசுதல்/பெருமைபாராட்டுதல்’ என்ற பொருளைக் கொண்டது; சாதாரணமாக ‘துதித்தல்’ என்று மட்டும் மொழிபெயர்ப்பது தன்னிலை சார்ந்த நுணுக்கத்தை இழக்கும்.
- source_word: נַפְשִׁי
  choice: என் உயிர்
  rationale: נפשׁ இங்கு முழு மனிதத் தன்மையையும் உள்ளார்ந்த தன்னையும் குறிக்கிறது. ‘நான்’ என்று சுருக்காமல், எபிரெயக் கவிதை உருவகத்தை இயல்பான தமிழில் காக்க ‘என் உயிர்’ பயன்படுத்தப்படுகிறது.
- source_word: יִשְׁמְעוּ
  choice: கேட்பார்கள்
  rationale: שׁמע என்பதன் கால் முற்றுப்பெறாத வடிவத்தின் எதிர்கால/அறிவிப்பு நுணுக்கம் தமிழில் ‘கேட்பார்கள்’ என வெளிப்படுகிறது.
- source_word: עֲנָוִים
  choice: தாழ்மையானவர்கள்
  rationale: ענוים என்பது தாழ்மையானோர், சாந்தமானோர் அல்லது ஒடுக்கப்பட்டோர் எனப் பொருள்படலாம். சூழலில் ‘தாழ்மையானவர்கள்’ இயல்பாகப் பொருந்துகிறது; மற்ற உண்மையான சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: וְיִשְׂמָחוּ
  choice: மகிழ்வார்கள்
  rationale: שׂמח என்பதன் பொருள் ‘மகிழ்தல்’. வாவ் இணைப்பையும் இணையான எதிர்கால நுணுக்கத்தையும் தமிழ் வாக்கிய ஓட்டத்தில் இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழியாக்கம்
  choice: யெகோவா
  alternative: யாவே
  rationale: மூலத்தில் வரும் நான்கெழுத்து இறைப் பெயரை ‘கர்த்தர்’ போன்ற பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராகக் காக்கிறது. தமிழ் வாசகர்களிடையே நிலைபெற்ற ‘யெகோவா’ வடிவம் தேர்ந்தெடுக்கப்பட்டது; ‘யாவே’ என்பது சாத்தியமான மாற்று ஒலிபெயர்ப்பு.
- issue: நפשׁி என்பதன் மனிதவியல் நுணுக்கம்
  choice: என் உயிர்
  alternative: நான் / என் உள்ளம்
  rationale: பேசுபவரின் முழுத் தன்னையே குறிக்கும் கவிதைச் சொல்லாட்சியைத் தக்கவைக்கிறது; அதை உடலிலிருந்து பிரிந்த ஓர் அங்கம் என்ற குறிப்பிட்ட கோட்பாட்டாக விளக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சொல்வரிசைச் சாயலும் இரு பகுதி இணைநிலையும் பெரும்பாலும் காக்கப்பட்டுள்ளன; ‘அதைக்’ என்பது கேட்பதற்கான இயல்பான தமிழ் தொடர்பை வெளிப்படுத்தச் சேர்க்கப்பட்டுள்ளது.
