- from: யெகோவாவில் என் உயிர் பெருமைபாராட்டும்; தாழ்மையானவர்கள்[a] அதைக் கேட்டு மகிழ்வார்கள்.
  to: யாவேயில் என் உயிர் பெருமை பாராட்டும்; தாழ்மையானவர்கள் கேட்டு மகிழ்வார்கள்.
  rationale: The revision aligns the divine name with the stated POB “Yahweh” policy, preserves the Hebrew poetic expression “my soul,” retains the imperfect sense naturally in Tamil, and avoids adding an explicit object not present in the source. The lexical ambiguity of עֲנָוִים remains represented in the footnote.
