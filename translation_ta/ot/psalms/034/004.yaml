  text: דָּרַ֣שְׁתִּי אֶת יְהוָ֣ה וְ/עָנָ֑/נִי וּ/מִ/כָּל מְ֝גוּרוֹתַ֗/י הִצִּילָֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/004.yaml
  text: I sought Yahweh[a], and he answered me; he delivered me from all my fears.
translation:
  language: ta
  text: நான் யாவேயை நாடினேன்; அவர் எனக்குப் பதிலளித்தார்; என் எல்லா அச்சங்களிலிருந்தும்[a] என்னை விடுவித்தார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எனக்கு அச்சமூட்டிய எல்லாவற்றிலிருந்தும்’ அல்லது ‘என் எல்லா திகில்களிலிருந்தும்.’
    reason: מְגוּרוֹתַי என்பது உள்ளார்ந்த ‘அச்சங்கள்’ என்பதையும், அஞ்சப்பட்ட காரியங்கள் அல்லது ‘திகில்கள்’ என்பதையும் குறிக்கக்கூடிய சொற்பொருள் வாய்ப்பைக் கொண்டுள்ளது.
lexical_decisions:
- source_word: דָּרַשְׁתִּי
  choice: நான் நாடினேன்
  rationale: இச்சூழலில் דרשׁ என்பது வெறுமனே விசாரிப்பதை அல்ல, வேண்டுதலுடனும் சார்ந்திருக்கும் மனநிலையுடனும் யாவேயைத் தேடுவதைக் குறிக்கிறது. ‘நாடினேன்’ என்பது சங்கீதத்தின் சாட்சியத் தொனிக்கு ஏற்ற இயல்பான தமிழ்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் கடவுளின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ என்று தரப்பட்டுள்ளது; வேற்றுமை உருபுடன் உரையில் ‘யாவேயை’ என வருகிறது.
- source_word: וְעָנָנִי
  choice: அவர் எனக்குப் பதிலளித்தார்
  rationale: ענה என்பதும் முதலாம் நபர் ஒருமை பின்னொட்டும் சேர்ந்து ‘எனக்குப் பதிலளித்தார்’ எனப் பொருள்படுகின்றன. மரியாதையான ‘அவர்’ முந்தைய யாவேயைக் குறிக்கிறது.
- source_word: מִכָּל
  choice: எல்லா ... இலிருந்தும்
  rationale: מן உடன் כל சேர்வது குறிப்பிடப்படும் வகையிலுள்ள அனைத்திலிருந்தும் முழுமையான விடுதலையைக் குறிக்கிறது.
- source_word: מְגוּרוֹתַי
  choice: என் எல்லா அச்சங்கள்
  rationale: இங்கு מְגוּרוֹת என்பது தங்கியிருக்கும் இடங்களைக் குறிக்காமல், அஞ்சப்படும் காரியங்கள் அல்லது மனத்தில் எழும் பயங்களைக் குறிக்கிறது. ‘அச்சங்கள்’ இயல்பாகவும் பொருளின் பரப்பைத் திறந்தவாறும் உள்ளது.
- source_word: הִצִּילָנִי
  choice: என்னை விடுவித்தார்
  rationale: Hiphil வடிவிலுள்ள נצל ஆபத்திலிருந்து மீட்பதை அல்லது விடுவிப்பதைக் குறிக்கிறது. ‘விடுவித்தார்’ என்பது உடல்சார்ந்த மீட்புக்கு மட்டும் பொருளைச் சுருக்காமல் அதன் பரந்த அர்த்தத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: மூலவசனம் நான்கெழுத்து இறைப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதைப் ‘ஆண்டவர்’ போன்ற பட்டமாக மாற்றாமல் தனிப்பெயராகப் பாதுகாக்க ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரமான, மரியாதையும் கவித்துவச் சுருக்கமும் கொண்ட தமிழ் பயன்படுத்தப்பட்டுள்ளது. சாதாரண வாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் வாக்கிய அமைப்பு நேரடியாக வைக்கப்பட்டுள்ளது; மூலத்தின் மூன்று தொடர் செயல்களும் அரைப்புள்ளிகளால் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
