lexical_decisions:
- source_word: תְּמוֹתֵת
  choice: கொன்றுபோடும்
  rationale: מות என்பதன் ஹிஃபில் வடிவம் ‘சாகச் செய்யும்’ என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது. ‘கொன்றுபோடும்’ என்பது அந்த வலிமையையும், தீமை செயற்படும் ஓர் ஆற்றலாக உருவகிக்கப்படுவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רָשָׁע
  choice: பொல்லாதவனை
  rationale: ஒருமை அடைமொழி பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டு, ஒரு வகையைப் பிரதிநிதித்துவப்படுத்தும் நபரைக் குறிக்கிறது. ‘பொல்லாதவன்’ பாலினத்தைக் குறிப்பதுபோல் இலக்கண வடிவம் கொண்டிருந்தாலும், இங்கு பொதுவான ஒழுக்க வகையைக் குறிக்கும் வழக்கமான தமிழ்ச் சொல்.
- source_word: רָעָה
  choice: தீமை
  rationale: இந்தச் சொல் ஒழுக்கத் தீமை, தீங்கு, பேரழிவு ஆகிய பொருள்களை ஏற்கக்கூடும். ‘தீமை’ மூலத்தின் சுருக்கத்தையும், பொல்லாதவனை அவனுடைய தீமையே அழிக்கும் என்ற அறநெறி முரணையும் காக்கிறது; ‘பேரழிவு’ என்ற சூழல்சார் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שֹׂנְאֵי
  choice: வெறுப்பவர்கள்
  rationale: שׂנא என்பதன் பன்மை நிகழ்காலப் பங்கேற்பு வடிவம், தொடர்ந்த பண்பைக் குறிக்கிறது. ‘வெறுப்பவர்கள்’ இயல்பான தமிழில் அதைப் பாதுகாக்கிறது.
- source_word: צַדִּיק
  choice: நீதிமானை
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட ஒருமை அடைமொழி. ‘நீதிமான்’ என்பது நீதியாக வாழும் ஒருவரைக் குறிக்கும் மதிப்புமிக்க, பரவலாகப் புரிந்துகொள்ளப்படும் தமிழ் நடை.
- source_word: יֶאְשָׁמוּ
  choice: குற்றவாளிகளாகத் தீர்க்கப்படுவார்கள்
  rationale: אשם என்பதன் வடிவம் குற்றம் சுமத்தப்படுதல் அல்லது குற்றப்பொறுப்புக்கு உள்ளாதல் என்ற பொருளைக் கொண்டுள்ளது. இந்த மொழிபெயர்ப்பு நீதித்துறை சார்ந்த பொறுப்பைத் தெளிவாகக் காட்டுகிறது; தண்டனையின் தன்மையைச் சேர்த்துக் கூறுவதில்லை.
theological_decisions:
- issue: רָעָה என்பது ஒழுக்கத் ‘தீமை’யைக் குறிக்கிறதா அல்லது நிகழும் ‘பேரழிவு/துன்பம்’ என்பதைக் குறிக்கிறதா?
  choice: தீமை
  alternative: பேரழிவு
  rationale: மூலத்தில் רָעָה பொல்லாதவனைக் கொல்லும் செயற்பாட்டாளராக உருவகிக்கப்படுகிறது. ‘தீமை’ என்பது மூலச்சொல்லின் பரந்த பொருளையும், பொல்லாதவனைத் தீமையே அழிக்கும் என்ற உள்ளார்ந்த முரணையும் காக்கிறது. சூழலுக்கு ஏற்ற ‘பேரழிவு’ என்ற வாசிப்பைத் தீர்மானமாக நிராகரிக்காமல் அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கவிதை வரியின் சுருக்கமும் இரு இணை வாக்கியங்களின் சமநிலையும் காக்கப்பட்டுள்ளன; ரָעָה என்பதிலுள்ள உண்மையான பொருள் இருமை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
