lexical_decisions:
- source_word: כְּפִירִים
  choice: இளம் சிங்கங்கள்
  rationale: இந்த எபிரெயச் சொல் பொதுவாகச் சிங்கங்களைக் குறிப்பிடாமல், வலிமைமிக்க இளம் சிங்கங்களைக் குறிக்கிறது. இயல்பாகவே உணவைப் பெற்றுக்கொள்ளும் வலிமையுடையவையும் தேவைக்குள்ளாகலாம் என்ற கவித்துவ முரணை இத்தேர்வு காக்கிறது.
- source_word: רָשׁוּ
  choice: வறுமையுற்று
  rationale: இந்த வினைச்சொல் தேவைக்குள்ளாதல் அல்லது வறியவர்களாதல் என்ற பொருளைக் கொண்டது. தொடரும் ‘பசியடைகின்றன’ என்பதோடு ஒன்றாகக் கலந்துவிடாமல், பொருள் பற்றாக்குறையைத் தனியாக வெளிப்படுத்துகிறது.
- source_word: וְרָעֵבוּ
  choice: பசியடைகின்றன
  rationale: மூல வினை பசியாய் இருத்தலைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் கவித்துவ இணைப்பைத் தெளிவாகவும் தருகிறது.
- source_word: וְדֹרְשֵׁי יְהוָה
  choice: ஆனால் யாவேயைத் தேடுகிறவர்கள்
  rationale: எபிரெயப் பங்கேற்பு வடிவம் யாவேயைத் தொடர்ந்து நாடுவதைத் தங்கள் இயல்பாகக் கொண்டவர்களைக் குறிக்கிறது. ‘தேடுகிறவர்கள்’ என்பது இந்தத் தொடர்ச்சியான பண்பை இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கெழுத்துப் பெயர். எனவே பெயரின் ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
- source_word: לֹא יַחְסְרוּ
  choice: குறைவுபடாது
  rationale: இங்குள்ள நிறைவுறா வினைவடிவம் பொதுவான உண்மை அல்லது உறுதியைத் தெரிவிக்கிறது. தமிழில் ஒருமைக் கூட்டுப்பெயர்ச் சொற்றொடருடன் ‘குறைவுபடாது’ இயல்பாக அமைகிறது.
- source_word: כָל טוֹב
  choice: எந்த நன்மையும்
  rationale: இந்தச் சொற்றொடர் ‘எந்த ஒரு நன்மையும்/எல்லா நன்மையும்’ என்ற முழுமையான பொருளைக் கொண்டது. எதிர்மறை வினையுடன் ‘எந்த நன்மையும்’ என்பது இயல்பான தமிழில் அதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்குவது மூலத்தின் தனிப்பெயர்த் தன்மையைப் பாதுகாக்கிறது.
- issue: לֹא יַחְסְרוּ כָל טוֹב என்பதன் வாக்குறுதி இயல்பு
  choice: எந்த நன்மையும் குறைவுபடாது
  alternative: எல்லா விரும்பத்தக்க பொருள்களும் கிடைக்கும்
  rationale: மூலம் ‘நன்மை’ என்பதைக் குறிப்பிட்டாலும் அது எவ்வாறு வரையறுக்கப்படுகிறது என்பதை விரிவுபடுத்தவில்லை. ஆகவே இதை எல்லா ஆசைகளும் நிறைவேறும் என்ற பொருளாக மாற்றாமல், மூலத்தின் பொதுவான உறுதியையும் அதன் இறையியல் பதற்றத்தையும் அப்படியே வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற சுருக்கமான மற்றும் கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. ‘வறுமையுற்று’ என்பது சற்றே உயர்ந்த நடையாயினும் சாதாரண வாசகர்களுக்குப் புரியக்கூடியது; அது முதல் எபிரெய வினையின் பொருளை ‘பசி’ என்பதோடு கலக்காமல் காக்கிறது. எதிர்மறை ஒப்புமையைத் தெளிவாக்க ‘ஆனால்’ பயன்படுத்தப்பட்டுள்ளது.
