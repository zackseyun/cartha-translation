  language: ta
  text: இளம் சிங்கங்களும் வறுமையுற்றுப் பசியடைகின்றன[a]; ஆனால் யாவேயைத் தேடுகிறவர்களுக்கு எந்த நன்மையும் குறைவுபடாது.
