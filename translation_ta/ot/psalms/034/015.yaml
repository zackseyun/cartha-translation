  yaml_path: translation/ot/psalms/034/015.yaml
  text: The eyes of Yahweh are toward the righteous[a], and his ears toward their cry for help.
translation:
  language: ta
  text: யாவேவின் கண்கள் நீதிமான்களை நோக்கி உள்ளன; அவருடைய செவிகள் அவர்களுடைய உதவிக் கூக்குரலை[a] நோக்கி உள்ளன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களுடைய உதவிக்கான மன்றாட்டு.’ எபிரெயச் சொல் துன்பத்திலிருந்து எழும் உதவிக்கான கூக்குரலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: கண்கள்
  rationale: எபிரெய மூலத்தின் பன்மை உருவகத்தை நேரடியாகப் பேணி, கடவுளின் கவனமான பார்வையை விளக்கவுரையாக மாற்றாமல் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֶל
  choice: நோக்கி
  rationale: திசையையும் கவனம் செலுத்தப்படுவதையும் குறிக்கும் முன்னிடைச்சொல்லின் பொருளை இரு கவிதை அடிகளிலும் பேணுகிறது.
- source_word: צַדִּיקִים
  choice: நீதிமான்கள்
  rationale: பன்மையில் பெயர்ச்சொல்லாகப் பயன்படும் அடைமொழியின் ஒழுக்க மற்றும் உடன்படிக்கை சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: וְאָזְנָיו
  choice: அவருடைய செவிகள்
  rationale: ‘கண்கள்’ என்பதற்கு இணையான உடலுறுப்பு உருவகத்தையும் மூலத்தின் பன்மையையும் பேணுகிறது.
- source_word: שַׁוְעָתָם
  choice: உதவிக்காக அவர்கள் எழுப்பும் கூக்குரல்
  rationale: இது சாதாரணக் குரல் அல்லாமல், துன்பத்தில் உதவி நாடி எழுப்பப்படும் கூக்குரல் என்பதைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் நேரடியாக இடம்பெறும் தனிப்பட்ட இறைத் திருப்பெயரைப் பேணி, அதை ஒரு பட்டப்பெயரால் மாற்றவில்லை.
- issue: கடவுளின் உணர்வுப் புலன்களைக் குறிக்கும் மனித உருவக மொழி
  choice: ‘கண்கள்’, ‘செவிகள்’ என்ற உருவகங்களை அப்படியே பேணுதல்
  alternative: ‘யாவே கவனிக்கிறார்’, ‘யாவே கேட்கிறார்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூலத்தின் கவிதை வலிமையையும் இணை அமைப்பையும் பேணி, உருவகத்தை விளக்கவுரையாகச் சுருக்குவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை. எபிரெய இணை அமைப்பும் ‘கண்கள்/செவிகள்’ உருவகமும் பேணப்பட்டுள்ளன.
