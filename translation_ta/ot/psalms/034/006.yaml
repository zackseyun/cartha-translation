id: PSA.34.6
reference: Psalms 34:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: זֶ֤ה עָנִ֣י קָ֭רָא וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗י/ו הוֹשִׁיעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/006.yaml
  text: This poor man cried out[a], and Yahweh heard[b], and saved him from all his troubles.
translation:
  language: ta
  text: இந்த ஏழை[a] கூக்குரலிட்டான்; யாவே கேட்டார்; அவனுடைய எல்லாத் துன்பங்களிலிருந்தும் அவனை மீட்டார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஒடுக்கப்பட்டவன்,’ ‘துன்புறுகிறவன்’ அல்லது ‘தாழ்மையானவன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் வறுமை, ஒடுக்கம் அல்லது தாழ்நிலை ஆகியவற்றைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘காப்பாற்றினார்’ அல்லது ‘விடுவித்தார்’ என்றும் மொழிபெயர்க்கலாம். இவ்வினை ஆபத்து அல்லது துன்பத்திலிருந்து மீட்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: இந்த
  rationale: குறிப்பிட்ட ஒருவனைச் சுட்டிக்காட்டும் எபிரெயச் சுட்டுப்பெயரை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עָנִי
  choice: ஏழை
  rationale: இச்சொல் வறுமை, ஒடுக்கம் அல்லது தாழ்நிலையைக் குறிக்கலாம். சங்கீதக்காரனின் தனிப்பட்ட சாட்சியையும் பொதுவாகத் துன்புறும் ஒருவனையும் குறிக்கக்கூடிய சுருக்கமான இயல்பான சொல் ‘ஏழை’.
- source_word: קָרָא
  choice: கூக்குரலிட்டான்
  rationale: துன்பத்தின் நடுவே உதவிக்காக அழைப்பதைச் சூழல் காட்டுவதால், பொதுவான ‘அழைத்தான்’ என்பதைவிட வேண்டுதலின் தீவிரத்தை இது தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יהוה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் தேவனுடைய உடன்படிக்கைப் பெயரை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: שָׁמֵעַ
  choice: கேட்டார்
  rationale: சாட்சியாக விவரிக்கப்படும் நிறைவேறிய செயலை இயல்பான தமிழ் இறந்தகாலத்தில் தருகிறது; தேவனைப் பற்றிய மரியாதையான தமிழ் வினைமுற்றும் காக்கப்படுகிறது.
- source_word: מִכָּל צָרוֹתָיו
  choice: அவனுடைய எல்லாத் துன்பங்களிலிருந்தும்
  rationale: מִן உடன் வரும் כֹּל விடுதலையின் முழுமையையும், צָרוֹתָיו அவனுக்குரிய நெருக்கடிகள் அல்லது துன்பங்களையும் குறிக்கின்றன.
- source_word: הוֹשִׁיעוֹ
  choice: அவனை மீட்டார்
  rationale: ஆபத்து அல்லது துன்பத்திலிருந்து காப்பாற்றுதல் என்ற ஹிபில் வினையின் பொருளை இச்சூழலில் இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் பொதுப்பட்டப்பெயரை அல்ல, தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரையே பயன்படுத்துகிறது; ஆகவே அதனைத் தமிழில் ஒலிபெயர்த்துக் காக்கிறது.
- issue: עָנִי என்பதின் ஆண்பால் ஒருமையும் பிரதிநிதித்துவப் பயன்பாடும்
  choice: இந்த ஏழை ... அவன்
  alternative: இந்த ஏழையானவர் / இந்த ஏழை மனிதர்
  rationale: எபிரெயின் ஆண்பால் ஒருமையை மறைக்காமல், சங்கீதக்காரன் தன்னைச் சுட்டும் தனிப்பட்ட சாட்சியாகவும் இதே நிலையிலுள்ள ஒருவனைப் பிரதிநிதித்துவப்படுத்தும் சொல்லாகவும் வாசிக்க இடமளிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் சுருக்கமான சங்கீதச் சாட்சிநடை பயன்படுத்தப்பட்டுள்ளது. ‘கூக்குரலிட்டான்’ வேண்டுதலின் தீவிரத்தைத் தருகிறது; ‘கேட்டார்,’ ‘மீட்டார்’ என்பவை தேவனைப் பற்றிய இயல்பான மரியாதை நடையைப் பேணுகின்றன. அரைப்புள்ளிகள் எபிரெய வாக்கியத்தின் தொடர்ச்சியான மூன்று செயல்களைத் தெளிவாகப் பிரிக்கின்றன.
