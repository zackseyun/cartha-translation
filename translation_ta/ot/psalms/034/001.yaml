source:
  edition: WLC
  text: אֲבָרֲכָ֣ה אֶת יְהוָ֣ה בְּ/כָל עֵ֑ת תָּ֝מִ֗יד תְּֽהִלָּת֥/וֹ בְּ/פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/001.yaml
  text: I will bless Yahweh at all times[a]; his praise will continually be in my mouth.
translation:
  language: ta
  text: எல்லா வேளைகளிலும் யாவேவை[a] வாழ்த்துவேன்; அவருடைய துதி எப்போதும் என் வாயில் இருக்கும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேயத்தில்: ‘YHWH’; ‘யெகோவா’ என்றும் ஒலிபெயர்க்கப்படுகிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲבָרֲכָה
  choice: வாழ்த்துவேன்
  rationale: ברך என்ற வேரிலிருந்து வந்த முதலாம் நபர் ஒருமை வினை. இறுதியில் சேரும் paragogic he இங்கு உறுதியான மனத்தீர்மானத்தை வெளிப்படுத்துவதால், எதிர்கால/விருப்பத் தொனியுடன் ‘வாழ்த்துவேன்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்த்து தனிப்பெயராகப் பாதுகாக்கிறது.
- source_word: בְּכָל עֵת
  choice: எல்லா வேளைகளிலும்
  rationale: ‘எல்லா’ + ‘வேளை’ என்ற காலவிரிவைக் காத்து, தொடர்ந்த நிலைத்தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: תָּמִיד
  choice: எப்போதும்
  rationale: துதியின் இடையறாத தன்மையைத் தெளிவாகத் தெரிவிக்கிறது; முதல் அரையடியிலுள்ள ‘எல்லா வேளைகளிலும்’ என்பதுடன் கவிதைநயமான இணைநிலையையும் காக்கிறது.
- source_word: תְּהִלָּתוֹ
  choice: அவருடைய துதி
  rationale: ‘துதி’ என்ற பெயர்ச்சொல்லையும் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டையும் நேரடியாகக் காக்கிறது; அது அவருக்குச் செலுத்தப்படும் அல்லது அவரைப் பொருளாகக் கொண்ட துதி என்ற இயல்பான பொருளைத் தருகிறது.
- source_word: בְּפִי
  choice: என் வாயில்
  rationale: பேசப்படும் துதியை உடல் சார்ந்த தெளிவான படிமமாகக் காட்டும் எபிரேயச் சொல்லாட்சியை நெருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலவசனம் தெய்வீகத் தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட பெயரைப் பாதுகாக்கிறது; மாற்று உச்சரிப்புகள் இருப்பதை அடிக்குறிப்பு சுட்டுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான மற்றும் எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. ‘எல்லா வேளைகளிலும் / எப்போதும்’ என்ற இணைநிலை எபிரேயக் கவிதையின் வலியுறுத்தலைக் காக்கிறது; ‘அவருடைய துதி’ என்ற சொற்றொடர் மூலத்தின் இயல்பான உடைமை/பொருள் சார்ந்த நெகிழ்வைத் தீர்மானித்து விடாமல் வைத்திருக்கிறது.
