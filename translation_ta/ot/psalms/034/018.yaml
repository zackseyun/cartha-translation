  source_fidelity: 'மூல எபிரெய உரையின் இரு இணை உறுப்புகளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: யாவே அருகில் இருப்பதும், ஆவியில் நொறுங்கியவர்களைக் காப்பாற்றுவதும் தெளிவாக வெளிப்படுகின்றன. לְנִשְׁבְּרֵי לֵב என்பதன் பெறுநர்ப் பொருளும், וְאֶת குறிக்கும் இரண்டாம் வினைப்பொருளும் தமிழில் சரியாக அமைந்துள்ளன.'
