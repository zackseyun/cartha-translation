base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/018.yaml
  text: Yahweh is near to the brokenhearted[a], and he saves those crushed in spirit.
translation:
  language: ta
  text: உள்ளம் உடைந்தவர்களுக்கு யாவே அருகில் இருக்கிறார்; ஆவி நொறுங்கியவர்களை[a] அவர் காப்பாற்றுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவியில் தாழ்ந்தவர்கள்.” எபிரெயச் சொல், உள்ளார்ந்து நொறுங்கியவர்களையோ தாழ்த்தப்பட்டவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: அருகில் இருக்கிறார்
  rationale: எபிரெயப் பெயரடை ‘அருகில்/நெருக்கமாக’ இருப்பதைக் குறிக்கிறது. தமிழில் இயல்பான பயனிலை வாக்கியமாகத் தரப்பட்டு, இட மற்றும் உறவு சார்ந்த இரு நுணுக்கங்களும் காக்கப்படுகின்றன.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பெயராகிய நான்கெழுத்துப் பெயரின் தமிழ் ஒலிபெயர்ப்பு; ஒரு பட்டத்தால் மாற்றப்படவில்லை.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: உள்ளம் உடைந்தவர்களுக்கு
  rationale: சொல்லடிப்படையில் ‘இதயம் உடைந்தவர்கள்’ என்பதைக் குறிக்கும் உருவகம். நவீன தமிழில் உள்ளார்ந்த ஆழ்ந்த துயரத்தை இயல்பாக வெளிப்படுத்த ‘உள்ளம் உடைந்தவர்கள்’ எனத் தரப்பட்டுள்ளது.
- source_word: דַּכְּאֵי רוּחַ
  choice: ஆவி நொறுங்கியவர்களை
  rationale: דכא என்பது நசுக்கப்படுதல், நொறுக்கப்படுதல் அல்லது தாழ்த்தப்படுதல் என்ற தீவிரமான பொருளைக் கொண்டது; רוּחַ என்பதற்கு இங்கு ‘ஆவி’ எனத் தருவது மூல உருவகத்தையும் அதன் பொருள் விரிவையும் காக்கிறது.
- source_word: יוֹשִׁיעַ
  choice: காப்பாற்றுகிறார்
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவம் ‘காப்பாற்றுதல்/விடுவித்தல்’ என்பதைக் குறிக்கிறது. ‘காப்பாற்றுகிறார்’ என்பது உடனடியான மீட்பையும் விரிவான இரட்சிப்பு மொழியுடனான தொடர்பையும் இயல்பாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா அல்லது கர்த்தர்
  rationale: மூல உரையில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் தருவது உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: דַּכְּאֵי רוּחַ என்பதன் நுணுக்கம்
  choice: ஆவி நொறுங்கியவர்கள்
  alternative: ஆவியில் தாழ்ந்தவர்கள் / மனம் வருந்தித் தாழ்ந்தவர்கள்
  rationale: இச்சொற்றொடர் உள்ளார்ந்து நசுக்கப்பட்ட நிலையையும் தாழ்த்தப்பட்ட நிலையையும் குறிக்கலாம்; மனந்திரும்புதலை மட்டும் குறிப்பதாக உரையைச் சுருக்காமல், பரந்த துயர்நிலையை முதன்மை உரை காக்கிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு அண்மையான, எளிதில் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உள்ளம் உடைந்தவர்கள்’ மற்றும் ‘ஆவி நொறுங்கியவர்கள்’ என்ற இணை அமைப்பு எபிரெயக் கவிதையின் இதயம்–ஆவி ஒத்திசைவைக் காக்கிறது.
