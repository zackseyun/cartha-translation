  language: ta
  text: அப்போது நீதியான பலிகளிலும்[a], தகனபலியிலும் முழுமையான பலியிலும்[b] நீர் மகிழ்வீர்; அப்போது உமது பலிபீடத்தின்மேல் காளைகள் பலியிடப்படும்.
