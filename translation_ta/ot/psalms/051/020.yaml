- source_word: וְכָלִיל
  choice: முற்றிலும் எரிக்கப்படும் பலி
  rationale: כָלִיל வலியுறுத்தும் முழுமையை வெளிப்படுத்துகிறது; அதேவேளையில் עוֹלָה என்பதிலிருந்து உரையில் காணப்படும் சொல் வேறுபாட்டையும் காக்கிறது.
- source_word: יַעֲלוּ
  choice: பலியிடப்படும்
  rationale: பலிச் சூழலில் עלה என்பதன் ஹிஃபில் வடிவம் பலிபீடத்தின் மேல் ஏற்றிப் பலியிடுவதைக் குறிக்கிறது; தமிழில் ‘பலியிடப்படும்’ இயல்பான செயப்பாட்டு வடிவம்.
- source_word: מִזְבַּחֲךָ
  choice: உமது பலிபீடத்தின்மேல்
