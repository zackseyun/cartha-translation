  rationale: חפץ என்பது ஒன்றில் விருப்பமும் மகிழ்ச்சியும் கொள்வதைக் குறிக்கிறது; மீண்டும் ஏற்றுக்கொள்ளப்படும் வழிபாட்டின் சூழலில் ‘மகிழ்வீர்’ இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: זִבְחֵי צֶדֶק
  choice: நீதியான பலிகள்
  rationale: ‘நீதியின் பலிகள்’ என்ற நேரடியான அமைப்பின் அறச்சார்ந்த மற்றும் உடன்படிக்கைச் சார்ந்த வலிமையைத் தெளிவான நவீன தமிழில் பெயரடையாக வெளிப்படுத்துகிறது.
- source_word: עוֹלָה
