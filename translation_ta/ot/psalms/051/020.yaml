theological_decisions:
- issue: நொறுங்கிய உள்ளத்தை வலியுறுத்தும் முந்தைய வசனங்களுக்குப் பிறகு பலிகள் ஏற்றுக்கொள்ளப்படுவதன் பொருள்
  choice: மனந்திரும்புதலுக்கும் மீட்புக்கும் பின்னர் மீண்டும் ஏற்றுக்கொள்ளப்படும் உண்மையான பலிவழிபாட்டைப் பற்றியே வசனம் பேசுகிறது.
  alternative: இது ஆலயப் பலியை வலியுறுத்தும் பிற்காலச் சேர்க்கை; அல்லது பலி முழுவதும் உள்ளார்ந்த நீதிக்கான உருவகம்.
  rationale: சங்கீதத்தின் ஓட்டத்தில் பலிகள் முற்றாக மறுக்கப்படவில்லை; மனந்திரும்புதல் இல்லாத பலியே ஏற்கப்படாதது. ஆகவே உள்ளார்ந்த மனந்திரும்புதலுக்கும் வெளிப்படையான பலிவழிபாட்டுக்கும் இடையிலுள்ள பதற்றத்தைத் தீர்த்துவிடாமல், பலி குறித்த திடமான மொழி காக்கப்படுகிறது.
- issue: עוֹלָה וְכָלִיל என்பவை ஒரே பலியின் இரட்டை விளக்கமா அல்லது தொடர்புடைய தனித்த சொற்களா
  choice: ‘தகனபலி’ மற்றும் ‘முற்றிலும் எரிக்கப்படும் பலி’ என்று இரு சொற்களின் வேறுபாட்டை முதன்மை உரையில் காத்தல்.
  alternative: ‘முழுத் தகனபலி’ என்று ஒரே கூட்டுச் சொல்லாக எடுத்தல்.
  rationale: இணைப்பு ஒரே முழுத் தகனபலியை வலியுறுத்துவதாக இருக்கக்கூடும்; இருப்பினும் எபிரேயத்தில் இரு சொற்கள் உள்ளதால் அந்த அமைப்பை உரையில் காத்து, மாற்று புரிதலை அடிக்குறிப்பில் தருவது உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளது. ‘தகனபலி’, ‘பலிபீடம்’ ஆகியவை வாசகர்களுக்குப் பரிச்சயமான வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன; அரிதான ‘சர்வாங்க தகனபலி’ போன்ற வடிவம் தவிர்க்கப்பட்டுள்ளது.
