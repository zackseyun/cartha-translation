lexical_decisions:
- source_word: הָשִׁיבָה
  choice: மீண்டும் அளியும்
  rationale: ஹிஃபில் கட்டளை வடிவம், முன்பு அனுபவித்த ஒன்றைத் திரும்பக் கிடைக்கச் செய்யும்படி கடவுளிடம் வேண்டுவதைக் குறிக்கிறது. ‘மீண்டும் அளியும்’ என்பது இதை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: לִּי
  choice: எனக்கு
  rationale: மீட்டளிக்கப்படுவதன் பெறுநரை முதல் நபர் ஒருமையில் தெளிவாகக் குறிக்கிறது.
- source_word: שְׂשׂוֹן
  choice: மகிழ்ச்சி
  rationale: இச்சொல் மகிழ்ச்சி, களிப்பு ஆகிய பொருள்களைக் கொண்டது; இவ்வேண்டுதலில் ‘மகிழ்ச்சி’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: יִשְׁעֶךָ
  choice: உமது மீட்பு
  rationale: יֶשַׁע மீட்பு அல்லது விடுவித்தல் என்ற பரந்த பொருள் கொண்டது. ‘உமது மீட்பு’ தெய்வீகமான காப்பின் பரப்பைத் தக்கவைத்து, குறிப்பிட்ட கோட்பாட்டு விளக்கத்துக்குள் பொருளைச் சுருக்கவில்லை.
- source_word: וְרוּחַ
  choice: ஆவி
  rationale: இக்கவிதை மற்றும் மனித உள்ளநிலை சார்ந்த சூழலில் רוּחַ என்பதற்கு ‘காற்று’ அல்லது ‘மூச்சு’ என்பதைக் காட்டிலும் ‘ஆவி’ பொருத்தமானது. தமிழில் இரண்டாம் வேண்டுதல் அரைப்புள்ளியால் இயல்பாக இணைக்கப்பட்டுள்ளது.
- source_word: נְדִיבָה
  choice: மனமுவந்த
  rationale: இந்தப் பெயரடை மனமுவந்த, தாராளமான, மேன்மையான ஆகிய பொருள்களை ஏற்கக்கூடும். ஒழுக்கநிலை உறுதிப்பட வேண்டுகிற சூழலில், ஆயத்தமாகவும் விருப்பத்தோடும் செயல்படும் தன்மையை ‘மனமுவந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִסְמְכֵנִי
  choice: என்னைத் தாங்கட்டும்
  rationale: סמך என்பதன் தாங்குதல், ஆதரித்தல், நிலைநிறுத்துதல் ஆகிய பொருள்களை இது வெளிப்படுத்துகிறது. வேண்டுதலைக் குறிக்கும் எபிரெய நிறைவுறா வினைக்கு ‘தாங்கட்டும்’ இயல்பான தமிழ் வடிவமாகும்.
theological_decisions:
- issue: மனந்திரும்புதல் சார்ந்த சங்கீதத்தில் ‘உமது மீட்பு’ என்பதன் பொருள்
  choice: உமது மீட்பு
  alternative: உமது விடுவித்தல்
  rationale: எபிரெயச் சொல் மீட்பையும் விடுவித்தலையும் குறிக்கலாம். பாவம், தூய்மைப்படுத்துதல், புதுப்பித்தல் ஆகிய சூழலில் ‘மீட்பு’ முழுமையான இறையியல் பரப்பைத் தக்கவைக்கிறது; ஆனால் பிற்காலக் கோட்பாட்டு விவரங்களை வசனத்திற்குள் புகுத்தவில்லை.
- issue: ‘மனமுவந்த ஆவி’ யாருடையது மற்றும் அதன் தன்மை என்ன
  choice: மனமுவந்த ஆவி
  alternative: தாராளமான ஆவி; மேன்மையான ஆவி
  rationale: இது கடவுளுடைய ஆவியா அல்லது சங்கீதக்காரனின் புதுப்பிக்கப்பட்ட உள்ளார்ந்த ஆவியா என்பதை மொழிபெயர்ப்பு குறிப்பிட்டு முடிவுசெய்யவில்லை. ‘மனமுவந்த’ என்பது ஆயத்தம் மற்றும் விருப்பம் என்ற கருத்தை முன்னிறுத்தியபடியே மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
