source:
  edition: WLC
  text: לֵ֣ב טָ֭הוֹר בְּרָא לִ֣/י אֱלֹהִ֑ים וְ/ר֥וּחַ נָ֝כ֗וֹן חַדֵּ֥שׁ בְּ/קִרְבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/011.yaml
  text: Create in me a clean heart[a], O God[b], and renew a steadfast spirit within me.
translation:
  language: ta
  text: 'கடவுளே, தூய உள்ளத்தை[a] எனக்குள் படைத்தருளும்;

    உறுதியான ஆவியை[b] என் உள்ளத்தில் புதுப்பித்தருளும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சுத்தமான உள்ளம்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நிலைபெற்ற ஆவி.” எபிரெயச் சொல் உறுதியாக நிலைநிறுத்தப்பட்டிருப்பதையும் குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב
  choice: உள்ளம்
  rationale: எபிரெய மொழியில் இச்சொல் சிந்தனை, விருப்பம், உணர்வு ஆகியவற்றை உள்ளடக்கிய அக மனிதனைக் குறிக்கிறது. நவீனத் தமிழில் ‘உள்ளம்’ இயல்பாகவும் பரந்த பொருளுடனும் அமைகிறது; ‘மனம்’ என்பது பொருளைச் சுருக்கிவிடும்.
- source_word: טָהוֹר
  choice: தூய
  rationale: சங்கீதத்தின் சுத்திகரிப்பு பின்னணியையும் ஒழுக்க மற்றும் வழிபாட்டுத் தூய்மையின் நிழற்பொருளையும் ‘தூய’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְּרָא
  choice: படைத்தருளும்
  rationale: ברא குறிப்பாகக் கடவுளின் படைப்புச் செயலைக் குறிக்கும் வலிமையான வினை. ‘படை’ அந்த வலிமையைப் பாதுகாக்கிறது; ‘தருளும்’ தமிழின் மரியாதையான மன்றாட்டு நடைக்கு ஏற்றது.
- source_word: לִי
  choice: எனக்குள்
  rationale: சொல்லுக்குச் சொல் ‘எனக்காக/எனக்கு’ என்றாலும், உள்ளத்தைப் படைக்கும் அகமாற்றத்தைத் தமிழில் இயல்பாக ‘எனக்குள்’ வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது நேரடி அழைப்பு. ‘கடவுளே’ நவீனத் தமிழில் இயல்பான விளிவேற்றுமை வடிவம்.
- source_word: רוּחַ
  choice: ஆவி
  rationale: ‘ஆவி’ என்பது எபிரெயச் சொல்லின் பரந்த பொருளைப் பாதுகாத்து, ‘உள்ளம்’ என்பதுடன் அமைந்துள்ள கவிதை இணைப்பையும் தக்கவைக்கிறது.
- source_word: נָכוֹן
  choice: உறுதியான
  rationale: இச்சொல் நிலைநிறுத்தப்பட்ட, உறுதியான, அசையாத தன்மையைச் சுட்டுகிறது. ‘உறுதியான’ என்பது ஒழுக்க ரீதியான ‘சரியான’ என்ற பொருளுக்கு மட்டும் இதைச் சுருக்காமல் நிலைத்தன்மையைத் தெரிவிக்கிறது.
- source_word: חַדֵּשׁ
  choice: புதுப்பித்தருளும்
  rationale: அகநிலையின் மீட்பையும் புதிய உயிர்ப்பையும் ‘புதுப்பி’ இயல்பாக வெளிப்படுத்துகிறது; மரியாதையான மன்றாட்டு நடைக்காக ‘தருளும்’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְּקִרְבִּי
  choice: என் உள்ளத்தில்
  rationale: உள்புறத்தைக் குறிக்கும் எபிரெயத் தொடரை நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: רוּחַ נָכוֹן என்ற தொடரிலுள்ள נָכוֹן என்பதன் பொருள்
  choice: உறுதியான ஆவி
  alternative: சரியான ஆவி; நிலைபெற்ற ஆவி
  rationale: எபிரெயச் சொல் ஒழுக்க ரீதியான சரியான தன்மையை மட்டும் அல்லாமல் உறுதி, நிலைத்தன்மை, நிலைநிறுத்தப்பட்ட தன்மை ஆகியவற்றை முதன்மையாகச் சுட்டுகிறது. ‘உறுதியான’ இந்தப் பரப்பைப் பாதுகாத்து, பாவத்திற்குப் பின் தொடர்ந்து உண்மையாய் நிலைக்க வேண்டிய மன்றாட்டை அளவுக்கு மீறி விளக்காமல் தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தமிழில் இயல்பாகப் புரியும், அதே நேரத்தில் மன்றாட்டுக்குரிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘படைத்தருளும்’, ‘புதுப்பித்தருளும்’ என்பவை பழமையான நடையின்றி மரியாதையான வேண்டுதலை வெளிப்படுத்துகின்றன. எபிரெய இணைநிலையைப் பாதுகாக்க உரை இரண்டு அடிகளாக அமைக்கப்பட்டுள்ளது.
