lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: என்னைத் தள்ளிவிடாதேயும்
  rationale: ஹிபில் வடிவின் ‘தள்ளிவிடுதல்/அகற்றிவிடுதல்’ என்ற வலிமையை இயல்பான தமிழ் வேண்டுதல் நடையில் காக்கிறது.
- source_word: מִלְּפָנֶיךָ
  choice: உமது முன்னிலையிலிருந்து
  rationale: எழுத்துப்படி ‘உமது முகத்துக்கு முன்பிருந்து’ என்றாலும், இச்சூழலில் தேவனுடைய சந்நிதி அல்லது முன்னிலையிலிருந்து அகற்றப்படுதலை இயல்பாகக் குறிக்கிறது.
- source_word: רוּחַ קָדְשְׁךָ
  choice: உமது பரிசுத்த ஆவியை
  rationale: ‘உமது பரிசுத்தத்தின் ஆவி’ அல்லது ‘உமது பரிசுத்த ஆவி’ என்ற எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் மரபுவழி தமிழ் வேதாகமச் சொல்லாட்சியுடனும் வழங்குகிறது; மூலத்தின் வடிவியல் மாற்று அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: תִּקַּח
  choice: எடுத்துக்கொள்ளாதேயும்
  rationale: לקח என்பதன் நேரடியான ‘எடு/எடுத்துக்கொள்’ பொருளைக் காக்கிறது; ‘விலக்கிக்கொள்ளுதல்’ என்று விளக்கமாக விரிவுபடுத்தவில்லை.
- source_word: מִמֶּנִּי
  choice: என்னிடமிருந்து
  rationale: மூலத்தின் ‘என்னிடமிருந்து’ என்ற பிரிவுப் பொருளை இயல்பான தமிழில் நேரடியாக வழங்குகிறது.
theological_decisions:
- issue: רוּחַ קָדְשְׁךָ என்பதன் ஆள்தன்மை மற்றும் மொழிபெயர்ப்பு
  choice: உமது பரிசுத்த ஆவி
  alternative: உமது பரிசுத்தத்தின் ஆவி; உமது பரிசுத்த ஆவி (பொதுப்பெயர் வாசிப்பு)
  rationale: இத்தொடர் தேவனுக்குரிய ஆவியைக் குறிக்கிறது; ‘பரிசுத்த ஆவி’ என்பது இயல்பான தமிழ் இணை. அதேவேளை, எபிரெயக் கட்டமைப்பு மட்டும் பின்னாளைய முழுமையான கோட்பாட்டு வரையறையை வெளிப்படையாகத் தீர்மானிக்காததால், எழுத்துப்படியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான ‘உமது/எடுத்துக்கொள்ளாதேயும்’ நடை பயன்படுத்தப்பட்டுள்ளது. ‘சந்நிதி’ என்பதற்குப் பதில் பொதுவாக எளிதில் புரியும் ‘முன்னிலை’ தேர்ந்தெடுக்கப்பட்டது; இரு மறுப்பு வேண்டுதல்களின் இணை அமைப்பு காக்கப்பட்டுள்ளது.
