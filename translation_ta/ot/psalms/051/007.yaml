    reason: translation_alternative
lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, கூற்றை வலியுறுத்தும் எபிரெயக் கவிதைச் சொல்லின் ஆற்றலைத் தக்கவைக்கிறது.
- source_word: אֱמֶת
  choice: உண்மை
  rationale: இங்கு கடவுளுக்கு முன்பாக உள்ளத்தில் இருக்க வேண்டிய மெய்மையையும் நேர்மையையும் குறிக்கிறது; ‘உண்மை’ இந்தப் பொருள் விரிவைச் சுருக்காமல் காக்கிறது.
- source_word: חָפַצְתָּ
  choice: நீ விரும்புகிறாய்
  rationale: விரும்புதல் அல்லது மகிழ்ச்சி கொள்ளுதல் என்ற பொருளுடைய வினையைச் சூழலுக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: בַטֻּחוֹת
  choice: உள்ளத்தின் ஆழங்களில்
  rationale: அரிதான இச்சொல் மனிதனின் உட்புற அல்லது மறைவான பகுதிகளைக் கவிதையாகக் குறிக்கிறது. உடல் உறுப்புகள் என்ற தவறான எண்ணத்தைத் தவிர்த்து, உள்ளான மனிதனைச் சுட்டுகிறது.
- source_word: וּבְסָתֻם
  choice: மறைவான இடத்தில்
  rationale: மறைக்கப்பட்ட அல்லது புலப்படாத இடம் என்ற இடவுருவகத்தைப் பாதுகாத்து, முந்தைய அடியுடன் உள்ள இணைப்பைத் தக்கவைக்கிறது.
- source_word: חָכְמָה
  choice: ஞானம்
  rationale: இச்சூழலில் கடவுள் அளிக்கும் ஒழுக்க மற்றும் ஆன்மிக அறிவைச் சுட்டும் வழக்கமான, பொருத்தமான மொழிபெயர்ப்பு.
- source_word: תוֹדִיעֵנִי
  choice: எனக்கு அறியச் செய்கிறாய்
  rationale: ידע என்பதன் காரணவினை வடிவத்தை நேரடியாகப் பிரதிபலிக்கிறது; ‘எனக்குக் கற்பிக்கிறாய்’ என்பதைக் காட்டிலும் மூலத்தின் ‘அறியச் செய்தல்’ என்ற வடிவத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுள் விரும்பும் உள்ளார்ந்த உண்மையின் இயல்பு
  choice: ஒருவரின் உள்ளத்தின் ஆழத்தில் கடவுள் உண்மையை விரும்புவதையும் அங்கே ஞானத்தை வெளிப்படுத்துவதையும் பொதுவான ஒழுக்க-ஆன்மிக மொழியில் தருதல்
  alternative: ‘உண்மை’ என்பதை உடன்படிக்கை விசுவாசம் என்றோ, உளவியல் சுயவிழிப்புணர்வு என்றோ குறிப்பாக விளக்குதல்
  rationale: எபிரெயக் கவிதை உள்ளார்ந்த உண்மையையும் மறைவில் அளிக்கப்படும் ஞானத்தையும் இணைக்கிறது; குறிப்பிட்ட பிற்காலக் கோட்பாட்டுக்குள் பொருளைச் சுருக்காமல் அந்த இறையியல் அழுத்தத்தை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க சங்கீத நடையைப் பயன்படுத்துகிறது. ‘உள்ளுறுப்புகள்’ என்ற உடற்கூறு சார்ந்த சொல்லைத் தவிர்த்து, மூலத்தின் உள்ளார்ந்த இடவுருவகத்தை ‘உள்ளத்தின் ஆழங்கள்’ என இயல்பாக வெளிப்படுத்துகிறது; இரண்டாம் அடியில் ‘மறைவான இடம்’ என்ற இணை உருவகமும் காக்கப்படுகிறது.
