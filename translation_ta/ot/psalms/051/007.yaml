    text: ‘நிச்சயமாக’ அல்லது ‘மெய்யாகவே’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் உள்ளான அல்லது மறைவான பகுதிகளைக் குறிக்கும் அரிய கவிதைச் சொல்; ‘உள்ளார்ந்த பகுதிகளில்’ என்றும் மொழிபெயர்க்கலாம்.
