translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத் தலைப்புக்குரிய சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர் தமிழில் தவறாகப் புரிந்துகொள்ளப்படாதபடி முதன்மை உரையில் தெளிவாக்கப்பட்டு, அதன் சொற்சொல் வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
