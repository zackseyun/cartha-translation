source:
  edition: WLC
  text: בְּֽ/בוֹא אֵ֭לָי/ו נָתָ֣ן הַ/נָּבִ֑יא כַּֽ/אֲשֶׁר בָּ֝֗א אֶל בַּת שָֽׁבַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/001.yaml
  text: when Nathan the prophet came to him[a], after he had gone in to Bathsheba.
translation:
  language: ta
  text: அவன் பத்சேபாவுடன் உடலுறவு கொண்ட பிறகு[a], இறைவாக்கினரான நாத்தான் அவனிடம் வந்தபோது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்சொல்லாக, “பத்சேபாவிடம் சென்றான்”; இது பாலுறவைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: வந்தபோது
  rationale: בְּ + בוא என்பதன் வினையெச்ச வடிவம் காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது; நவீனத் தமிழில் “வந்தபோது” இயல்பாக இதைத் தெரிவிக்கிறது.
- source_word: אֵלָיו
  choice: அவனிடம்
  rationale: אֶל என்பதுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு சேர்ந்திருப்பதால், திசை மற்றும் அணுகுதலை இயல்பான தமிழில் “அவனிடம்” என வழங்குகிறது.
- source_word: נָתָן
  choice: நாத்தான்
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு.
- source_word: הַנָּבִיא
  choice: இறைவாக்கினரான
  rationale: நாத்தானின் அடையாளப் பணியைத் தெரிவிக்கும் definite title; “இறைவாக்கினர்” என்பது நவீன, கண்ணியமான தமிழில் נָבִיא என்பதன் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: כַּאֲשֶׁר
  choice: பிறகு
  rationale: இச்சூழலில் நாத்தானின் வருகைக்கு முன் நிகழ்ந்த சம்பவத்தைக் குறிக்கும் காலவரிசையை “பிறகு” தெளிவாகக் காட்டுகிறது; “போது” என்பதும் இலக்கணரீதியாக சாத்தியம்.
- source_word: בָּא אֶל בַּת שָׁבַע
  choice: பத்சேபாவுடன் உடலுறவு கொண்ட
  rationale: בוא אֶל + பெண் என்பது இங்கு பாலுறவைக் குறிக்கும் எபிரெய மரபுத்தொடர். சொற்சொல்லான வடிவம் தமிழில் அந்தப் பொருளைத் தெரிவிக்காததால், உட்கருத்தை நேரடியாகவும் கண்ணியமாகவும் வழங்குகிறது; சொற்சொல் வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּת שָׁבַע
  choice: பத்சேபா
  rationale: எபிரெயத் தனிப்பெயரின் தமிழில் வழக்கமான ஒலிபெயர்ப்பு.
