base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/017.yaml
  text: For you do not delight in sacrifice[a], or I would give it; you do not take pleasure in burnt offering.
translation:
  language: ta
  text: ஏனெனில், நீர் பலியை விரும்புவதில்லை[a]; இல்லையென்றால், நான் அதைச் செலுத்தியிருப்பேன். தகனபலியில் நீர் மகிழ்வதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் பலியை விரும்புவதில்லை; இல்லையென்றால் நான் அதைச் செலுத்தியிருப்பேன்.” எபிரெய இணைப்புச் சொல்லும் சொல் வரிசையும் சற்றே முறையான இந்த வாசிப்பை அனுமதிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; சங்கீதத்தின் வாத ஓட்டத்தில் இயல்பாக உள்ளது.
- source_word: לֹא תַחְפֹּץ
  choice: நீர் விரும்புவதில்லை
  rationale: חפץ என்பது வெறுமனே வேண்டுதல் மட்டுமல்லாமல் விருப்பம் அல்லது மனமகிழ்ச்சியைக் குறிக்கலாம். இங்கு இயல்பான தமிழில் அதன் உணர்வைத் தக்கவைக்கிறது.
- source_word: זֶבַח
  choice: பலி
  rationale: பலியிடப்படும் காணிக்கையைக் குறிக்கும் வழக்கமான வழிபாட்டுச் சொல்; இச்சூழலில் தெளிவான, இயல்பான தமிழ்ச் சொல்.
- source_word: וְאֶתֵּנָה
  choice: இல்லையெனில், நான் அதைச் செலுத்துவேன்
  rationale: וְ என்னும் இணைப்பை இச்சூழலில் எதிர்நிலை அல்லது விளைவு உறவாகப் புரிந்துகொள்கிறது. முந்தைய ‘பலி’ என்பதே மறைமுகச் செயப்படுபொருள்; தமிழில் தெளிவுக்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது. பலியைப் பற்றிய வழிபாட்டுச் சூழலில் ‘கொடுப்பேன்’ என்பதைவிட ‘செலுத்துவேன்’ இயல்பானது.
- source_word: עוֹלָה
  choice: தகனபலி
  rationale: முழுவதுமாக எரித்துச் செலுத்தப்படும் பலிக்கான தொழில்நுட்பச் சொல்; நவீனத் தமிழில் சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: לֹא תִרְצֶה
  choice: நீர் பிரியப்படுவதில்லை
  rationale: רצה இங்கு ஒரு பலியின்மீது சாதகமான விருப்பம் அல்லது மனமகிழ்ச்சி கொள்வதைக் குறிக்கிறது. முதல் வினையுடன் தொடர்பைத் தக்கவைத்தபடியே சிறிய சொற்பொருள் வேறுபாட்டையும் காட்டுகிறது.
theological_decisions:
- issue: பலியைப் பற்றிய வசனத்தின் பொருள்
  choice: சங்கீதக்காரரின் மனந்திரும்பும் சூழலில் பலி மட்டும் கடவுள் விரும்புவது அல்ல என்று நேரடியாகக் கூறும் வாசகம்
  alternative: எல்லா பலி வழிபாட்டையும் உலகளாவிய முறையில் முற்றிலும் நிராகரிக்கும் வாசகம்
  rationale: வசனத்தின் சொற்களை வலுப்படுத்தி ஒரு பொதுவான கோட்பாட்டுத் தீர்ப்பாக மாற்றாமல் அதன் பதற்றத்தை அப்படியே வைத்திருக்கிறது. சங்கீதம் 51-ன் சூழலில் உள்ளார்ந்த மனநிலையில்லாத சடங்கு போதாது என்பது வெளிப்படுகிறது; இருப்பினும் இந்த விளக்கம் மொழிபெயர்ப்புக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கடவுளை நோக்கிய மரியாதை ஒருமையாக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. வழிபாட்டுச் சொற்களான ‘பலி’, ‘செலுத்துதல்’, ‘தகனபலி’ ஆகியவை தெளிவுக்காகவும் சங்கீதத்துக்குரிய கண்ணியமான நடைக்காகவும் தேர்ந்தெடுக்கப்பட்டன.
