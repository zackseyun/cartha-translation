  text: תְּחַטְּאֵ֣/נִי בְ/אֵז֣וֹב וְ/אֶטְהָ֑ר תְּ֝כַבְּסֵ֗/נִי וּ/מִ/שֶּׁ֥לֶג אַלְבִּֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/008.yaml
  text: Purify me with hyssop[a], and I will be clean; wash me, and I will be whiter than snow.
translation:
  language: ta
  text: ஈசோப்பினால்[a] என்னைத் தூய்மைப்படுத்தும்; நான் தூய்மையாவேன். என்னைக் கழுவும்; நான் பனியைவிட வெண்மையாவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஈசோப்பினால் என்னைச் சுத்திகரியும்.’ இங்குள்ள எபிரெய வினைச்சொல் பாவம் மற்றும் தூய்மைப்படுத்துதல் சார்ந்த சொல்லுடன் தொடர்புடையது; அது சடங்குமுறைத் தூய்மைப்படுத்தலை நினைவூட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  choice: என்னைத் தூய்மைப்படுத்தும்
  rationale: חטא என்பதன் பியேல் வடிவம் இங்கு ‘பாவம் செய்யவை’ என்று அல்லாமல், பாவம் அல்லது தீட்டிலிருந்து தூய்மைப்படுத்துவதைக் குறிக்கிறது. ஈசோப்புடன் வரும் சடங்கு சார்ந்த பின்னணியையும் இயல்பான தமிழையும் இத்தேர்வு காக்கிறது.
- source_word: בְאֵזוֹב
  choice: ஈசோப்பினால்
  rationale: בְ என்ற முன்னொட்டு இங்கு தூய்மைப்படுத்தப் பயன்படும் கருவியைச் சுட்டுகிறது. ‘ஈசோப்பு’ என்பது எபிரெய வேதாகமத் தூய்மைச் சடங்குகளோடு தொடர்புடைய செடியின் பெயரைத் தக்கவைக்கிறது.
- source_word: וְאֶטְהָר
  choice: நான் தூய்மையாவேன்
  rationale: טהר என்பது சடங்கு அல்லது அறநெறிசார் சூழலில் தூய்மையாதலைக் குறிக்கும். முதல் அரையடியின் விளைவை எதிர்கால உறுதியாகத் தெளிவாகச் சொல்கிறது.
- source_word: תְּכַבְּסֵנִי
  choice: என்னைக் கழுவும்
  rationale: כבס அடிப்படையில் துணியைத் துவைப்பதைக் குறித்தாலும், இக்கவிதை வேண்டுதலில் பேசுபவரை ஆழமாகக் கழுவித் தூய்மைப்படுத்தும் உருவகமாக வருகிறது. ‘கழுவும்’ என்பது உருவகத்தை இயல்பாகக் காக்கிறது.
- source_word: וּמִשֶּׁלֶג
  choice: பனியைவிட
  rationale: מן இங்கு ஒப்பீட்டுப் பொருளில் வந்து, பனியை மிஞ்சும் வெண்மையை வெளிப்படுத்துகிறது.
- source_word: אַלְבִּין
  choice: நான் வெண்மையாவேன்
  rationale: לבן என்பதன் ஹிபீல் வடிவம் வெண்மையாதல் அல்லது வெண்மையாக்கப்படுதல் என்ற விளைவைக் குறிக்கிறது. ‘பனியைவிட’ என்பதுடன் சேர்ந்து எபிரெய ஒப்பீட்டை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ஒழுக்கப் பாவத்திற்குப் பயன்படுத்தப்படும் சடங்குத் தூய்மைப்படுத்தல் உருவகம்
  choice: ‘ஈசோப்பினால் என்னைத் தூய்மைப்படுத்தும்’ என்று சடங்கு உருவகத்தை வெளிப்படையாகத் தக்கவைத்தல்
  alternative: ‘ஈசோப்பினால் என்னைச் சுத்திகரியும்’ அல்லது சடங்கு உருவகத்தை நீக்கி பொதுவாக மன்னிப்பைக் கோருவதாக மொழிபெயர்த்தல்
  rationale: இவ்வசனம் இஸ்ரவேலின் தூய்மைப்படுத்தும் சடங்குகளின் படிமத்தைப் பயன்படுத்தி பாவத்திலிருந்து தூய்மை பெறும் வேண்டுதலை வெளிப்படுத்துகிறது. ‘ஈசோப்பு’ என்பதையும் தூய்மை மொழியையும் தக்கவைப்பது, பின்னாளைய கோட்பாடுகளைச் சேர்க்காமல் சடங்குத் தூய்மைக்கும் உள்ளார்ந்த மீட்புக்கும் இடையிலான தொடர்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வேண்டுதல் சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனை நோக்கிய கட்டளை/வேண்டுதல் வடிவத்திற்கு மரியாதைத் தொனியுள்ள ‘தூய்மைப்படுத்தும்’, ‘கழுவும்’ பயன்படுத்தப்பட்டுள்ளன. ‘ஈசோப்பு’ என்ற சடங்கு சார்ந்த தாவரப்பெயர் அடிக்குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
