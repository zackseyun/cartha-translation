id: PSA.51.4
reference: Psalms 51:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּֽי פְ֭שָׁעַ/י אֲנִ֣י אֵדָ֑ע וְ/חַטָּאתִ֖/י נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/004.yaml
  text: For I know my transgressions, and my sin is always before me.
translation:
  language: ta
  text: ஏனெனில், என் மீறுதல்களை நான் அறிவேன்; என் பாவம் எப்போதும் என் கண்முன் இருக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் விளக்கக் காரணத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: פְשָׁעַי
  choice: என் மீறுதல்களை
  rationale: தேவனுக்கு எதிரான கலகம் அல்லது வரம்புமீறிய குற்றச்செயல்கள் என்ற பொருளைத் தாங்குகிறது; எபிரெய் பன்மையும் காக்கப்படுகிறது.
- source_word: אֲנִי אֵדָע
  choice: நான் அறிவேன்
  rationale: தன் குற்றத்தைத் தனிப்பட்ட முறையில் உணர்ந்திருப்பதை நேரடியாகக் கூறுகிறது; வெளிப்படையான אֲנִי தரும் வலியுறுத்தலும் தமிழில் தனிப்பெயரால் பிரதிபலிக்கப்படுகிறது.
- source_word: וְחַטָּאתִי
  choice: என் பாவம்
  rationale: ஒப்புதல் சூழலில் חטאת என்பது பாவத்தையே குறிக்கிறது; மூலத்தின் ஒருமை தக்கவைக்கப்படுகிறது.
- source_word: נֶגְדִּי
  choice: என் கண்முன்
  rationale: தனக்கு எதிரே அல்லது முன்பாகத் தொடர்ந்து நிற்பது என்ற காட்சியுருவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: תָמִיד
  choice: எப்போதும்
  rationale: இடைவிடாத தொடர்ச்சியான விழிப்புணர்வை எளிய, இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘மீறுதல்கள்’ மற்றும் ‘பாவம்’ ஆகியவற்றின் தொடர்பு
  choice: இரு வேறுபட்ட சொற்களையும் தனித்தனியாகத் தக்கவைத்தல்
  alternative: இரண்டையும் ‘பாவங்கள்’ என்ற ஒரே சொல்லால் மொழிபெயர்த்தல்
  rationale: எபிரெய் உரை פשע மற்றும் חטאת என்ற தொடர்புடைய ஆனால் வேறுபட்ட சொற்களைப் பயன்படுத்துகிறது; அவற்றை வேறுபடுத்துவது ஒப்புதலின் கவித்துவ மற்றும் இறையியல் செறிவைச் சமப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், அதேவேளை சங்கீத ஒப்புதலுக்கேற்ற கண்ணியமான நடை. ‘என் கண்முன்’ என்பது மூல உருவகத்தை இயல்பாகக் காக்கிறது.
