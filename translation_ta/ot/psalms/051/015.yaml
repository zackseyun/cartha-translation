id: PSA.51.15
reference: Psalms 51:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הַצִּ֘ילֵ֤/נִי מִ/דָּמִ֨ים אֱֽלֹהִ֗ים אֱלֹהֵ֥י תְּשׁוּעָתִ֑/י תְּרַנֵּ֥ן לְ֝שׁוֹנִ֗/י צִדְקָתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
translation:
  language: ta
  text: 'இரத்தப்பழியிலிருந்து[a] என்னை விடுவியும், தேவனே,

    என் மீட்பின் தேவனே;

    அப்போது என் நாவு உமது நீதியை[b] உரக்கப் பாடும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரத்தம் சிந்துதலிலிருந்து” அல்லது “இரத்தக்குற்றத்திலிருந்து.” எபிரெயத்தில் சொற்பட “இரத்தங்களிலிருந்து”; இது பெரும்பாலும் இரத்தம் சிந்தியதால் உண்டான குற்றப்பழியைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது நியாயத்தை.” எபிரெயச் சொல் ஒழுக்க நேர்மை, நீதியான தீர்ப்பு, மீட்பளிக்கும் நீதி ஆகிய நுண்ணுணர்வுகளைத் தாங்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: என்னை விடுவியும்
  rationale: נצל என்ற வினையின் கட்டளை வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும் சேர்ந்த வேண்டுதல். ஆபத்திலிருந்தோ குற்றப்பொறுப்பிலிருந்தோ மீட்பதை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִדָּמִים
  choice: இரத்தப்பழியிலிருந்து
  rationale: דמים என்பதன் சொற்பொருள் பன்மையான ‘இரத்தங்கள்’; ஆனால் இங்கு இரத்தம் சிந்தியதால் உண்டான குற்றப்பழி என்ற எபிரெய மரபுத்தொடர்ப் பொருள் சூழலுக்கு மிகவும் பொருந்துகிறது.
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: நேரடி விளிப்பைத் தெளிவாகவும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் தருகிறது.
- source_word: אֱלֹהֵי תְּשׁוּעָתִי
  choice: என் மீட்பின் தேவனே
  rationale: எபிரெய இணைப்புத் தொடரை நெருக்கமாகப் பேணுகிறது; תְּשׁוּעָה என்பதிலுள்ள காப்பு மற்றும் விடுதலை ஆகிய விரிவான பொருள்களையும் ‘மீட்பு’ இயல்பாகக் கொண்டுள்ளது.
- source_word: תְּרַנֵּן
  choice: உரக்கப் பாடும்
  rationale: רנן மகிழ்ச்சியுடன் ஒலியெழுப்பிப் பாடுவதைக் குறிக்கிறது. வேண்டுதலின் விளைவாக நிகழப்போவதை எதிர்கால வடிவில் தருகிறது.
- source_word: לְשׁוֹנִי
  choice: என் நாவு
  rationale: புகழ்ச்சியின் கருவியாக நாவை நேரடியாகக் குறிப்பிடும் எபிரெயக் கவித்துவ உருவகத்தைப் பேணுகிறது.
- source_word: צִדְקָתֶךָ
  choice: உமது நீதியை
  rationale: צדקה என்பதில் ஒழுக்க நேர்மையும் நியாயம் வழங்கும் நீதியும் அடங்கலாம். தமிழின் ‘நீதி’ இந்த இரு நுண்ணுணர்வுகளுக்கும் இடமளிக்கிறது.
theological_decisions:
- issue: דמים (‘இரத்தங்கள்’) என்பதன் பொருள்
  choice: இரத்தப்பழி
  alternative: இரத்தம் சிந்துதல்; இரத்தச் செயல்கள்
  rationale: மனந்திரும்புதலின் சூழலில், இச்சொல் வெறும் வன்முறையையோ அதிலிருந்து வரும் ஆபத்தையோ அல்லாமல், இரத்தம் சிந்தியதற்கான குற்றப்பொறுப்பைக் குறிக்கும் வாய்ப்பு அதிகம். மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பேணப்பட்டுள்ளன.
- issue: צִדְקָתֶךָ என்பதன் நுண்ணுணர்வு
  choice: உமது நீதி
  alternative: உமது நியாயம்; உமது மீட்பளிக்கும் நீதி
  rationale: மூலச்சொல் தேவனுடைய நேர்மையையும் நியாயத்தீர்ப்பையும் மீட்புச் செயலையும் ஒருங்கே சுட்டக்கூடும். முதன்மை உரை இந்த இறையியல் அழுத்தத்தை ஒரு குறுகிய விளக்கத்துக்குள் அடக்காமல் ‘நீதி’ என்று தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘என்னை விடுவியும்’ மற்றும் ‘உமது’ ஆகிய வடிவங்கள் சங்கீத வேண்டுதலின் மரியாதைத் தொனியைப் பேணுகின்றன. மூலத்தின் வரியமைப்பையும் ‘என் நாவு’ என்ற உருவகத்தையும் காக்க மூன்று குறும் வரிகளாக அமைக்கப்பட்டுள்ளது.
