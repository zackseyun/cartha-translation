base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/014.yaml
  text: I will teach transgressors your ways[a], and sinners will return to you.
translation:
  language: ta
  text: மீறுகிறவர்களுக்கு உமது வழிகளைக் கற்பிப்பேன்; பாவிகள் உம்மிடம் திரும்புவார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உம்மை நோக்கித் திரும்புவார்கள்’ அல்லது ‘உம்மிடம் மீண்டும் வருவார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை திரும்புவதையும் மீண்டும் வருவதையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלַמְּדָה
  choice: கற்பிப்பேன்
  rationale: למד என்பதன் ஹிஃபில் முதலாம் நபர் ஒருமை வடிவம் நோக்கத்தையோ உறுதியையோ வெளிப்படுத்துகிறது. சூழலில், மீட்கப்பட்ட பின் தான் செய்யப்போவதைச் சங்கீதக்காரன் கூறுவதால், இயல்பான தமிழில் ‘கற்பிப்பேன்’ என வழங்கப்பட்டது.
- source_word: פֹשְׁעִים
  choice: மீறுகிறவர்கள்
  rationale: פשע என்பது சாதாரணத் தவறை மட்டுமல்ல, தெரிந்தே மீறுதல் அல்லது கலகம் செய்தல் என்ற வலுவான பொருளைக் கொண்டது. ‘மீறுகிறவர்கள்’ அந்த ஒழுக்க மற்றும் உடன்படிக்கை சார்ந்த நுண்ணுணர்வைப் பொதுவாசகர்களுக்குப் புரியும் தமிழில் தருகிறது.
- source_word: דְּרָכֶיךָ
  choice: உமது வழிகள்
  rationale: דרך என்பதன் பன்மை இங்கு தேவனுடைய நெறிகள், செயல்முறைகள் அல்லது அவர் காட்டும் வாழ்க்கைப்பாதைகளைக் குறிக்கலாம். உருவகத்தையும் மூலத்தின் பொருள் அகலத்தையும் காக்க ‘உமது வழிகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חַטָּאִים
  choice: பாவிகள்
  rationale: חטאים என்பதற்கான நேரடியான, சுருக்கமான, வழக்கிலுள்ள தமிழ் இணை ‘பாவிகள்’; இது ‘மீறுகிறவர்கள்’ என்பதுடன் உள்ள இணை அமைப்பையும் காக்கிறது.
- source_word: אֵלֶיךָ
  choice: உம்மிடம்
  rationale: אֶל என்ற முன்னிடைச்சொல் ‘நோக்கி/இடம்’ என்ற திசைப் பொருளைக் குறிக்கிறது. தமிழில் நபரை நோக்கித் திரும்புவதை இயல்பாகச் சொல்ல ‘உம்மிடம்’ பயன்படுத்தப்பட்டது.
- source_word: יָשׁוּבוּ
  choice: திரும்புவார்கள்
  rationale: שוב என்பது ‘திரும்புதல்’, ‘மீண்டும் வருதல்’ ஆகிய இரு நுண்ணுணர்வுகளையும் கொண்டிருக்கலாம். ‘திரும்புவார்கள்’ என்பது தமிழில் இவ்விரண்டையும் ஓரளவு திறந்தவையாக வைத்திருந்து, மனந்திரும்புதலையும் தேவனை நோக்கிய மீள்வருகையையும் இயல்பாக உணர்த்துகிறது.
theological_decisions:
- issue: שוב என்பதில் உள்ள மனந்திரும்புதல்/மீள்வருதல் மொழி
  choice: உம்மிடம் திரும்புவார்கள்
  alternative: உம்மை நோக்கித் திரும்புவார்கள்; உம்மிடம் மீண்டும் வருவார்கள்
  rationale: எபிரெய வினை ஒருவரை நோக்கித் திரும்புவதையோ முன்பு இருந்த உறவுக்குத் திரும்பி வருவதையோ குறிக்கலாம். சங்கீதத்தின் பாவமன்னிப்பு மற்றும் மீட்பு சூழலில் ‘உம்மிடம் திரும்புவார்கள்’ இரு சாத்தியங்களையும் தேவையின்றி ஒரு குறிப்பிட்ட கோட்பாட்டுக்குள் சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனைச் சுட்டும் இடங்களில் மரியாதை ஒருமையான ‘உமது/உம்மிடம்’ வடிவங்கள் வைக்கப்பட்டுள்ளன. கவிதை இணை அமைப்பும் சுருக்கமும் பாதுகாக்கப்பட்டுள்ளன.
