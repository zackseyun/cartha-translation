lexical_decisions:
- source_word: הֵן
  choice: இதோ
  rationale: வலியுறுத்தும் தொடக்க இடைச்சொல்லின் கவித்துவமான, திடமான தொனியைத் தக்கவைக்கிறது. தமிழில் இது கவனத்தை ஈர்க்கும் அறிவிப்பாக இயல்பாகப் புரிகிறது.
- source_word: בְּעָוֹן
  choice: அக்கிரமத்திலே
  rationale: עָוֹן என்பதன் ஒழுக்கக்கேடு, குற்றம் ஆகிய பொருள் பரப்பை ‘அக்கிரமம்’ தக்கவைக்கிறது; בְּ என்ற முன்னொட்டும் இணைவரியின் அமைப்பும் ‘-த்திலே’ என்பதால் பாதுகாக்கப்படுகின்றன.
- source_word: חוֹלָלְתִּי
  choice: நான் பிறந்தேன்
  rationale: இந்தச் சூழலில் வினை பிறப்பிக்கப்படுதல் அல்லது பிறத்தலைக் குறிக்கிறது. ‘பிறந்தேன்’ என்பது சாதாரண நவீன தமிழில் இயல்பானது; பிறப்பின் படிமத்தையும் தெளிவாகக் காக்கிறது.
- source_word: וּבְחֵטְא
  choice: பாவத்திலே
  rationale: חֵטְא என்பதற்கு நேரான ‘பாவம்’ பயன்படுத்தப்பட்டு, முதல் அரையடியின் ‘அக்கிரமத்திலே’ என்பதோடு உள்ள கவித்துவ இணைநிலை காக்கப்படுகிறது.
- source_word: יֶחֱמַתְנִי
  choice: என்னைக் கருத்தரித்தாள்
  rationale: இங்கு வினை கருத்தரித்தலைக் குறிக்கிறது; பிறப்பைக் கூறும் முதல் அரையடியோடு காலரீதியான இணைப்பை இது இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אִמִּי
  choice: என் தாய்
  rationale: எளிய உடைமைப் பெயர்ச்சொல் நேரடியாகவும் இயல்பாகவும் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இவ்வசனம் தாயின் தனிப்பட்ட பாவத்தையா, கருத்தரிப்பிலிருந்தே சங்கீதக்காரனின் பாவநிலையையா, அல்லது மனந்திரும்புதலின் கவித்துவ மிகைப்படுத்தலையா குறிக்கிறது?
  choice: சங்கீதக்காரன் தனது பிறப்பையும் கருத்தரிப்பையும் அக்கிரமம் மற்றும் பாவத்தோடு தொடர்புபடுத்திப் பேசுவதை மட்டும் நேரடியாக மொழிபெயர்த்து, அந்தத் தொடர்புக்கான கோட்பாட்டு விளக்கத்தைத் திறந்தவாறே வைத்தல்.
  alternative: இது தாயின் பாவச்செயலைக் குறிக்கிறது; அல்லது கருத்தரிப்பிலிருந்தே சங்கீதக்காரனுக்கிருந்த உள்ளார்ந்த பாவநிலையைப் போதிக்கிறது; அல்லது இது கோட்பாட்டு வரையறை அல்ல, மனந்திரும்புதலின் கவித்துவ மிகைப்படுத்தல்.
  rationale: எபிரேய உரை பிறப்பையும் கருத்தரிப்பையும் עָוֹן மற்றும் חֵטְא ஆகியவற்றோடு இணைக்கிறது; ஆனால் அந்தத் தொடர்பின் தன்மையையோ பின்னைய கோட்பாட்டு அமைப்பையோ வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைத் தீர்க்காமல் பாதுகாக்கிறது.
