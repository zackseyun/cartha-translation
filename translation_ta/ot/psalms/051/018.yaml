lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  choice: தேவனின் பலிகள்
  rationale: எபிரெயக் கட்டமைப்பை நேரடியாகப் பாதுகாக்கிறது. சூழலில் இவை தேவன் விரும்பி ஏற்றுக்கொள்ளும் பலிகளைக் குறித்தாலும், அந்த விளக்கத்தை மொழிபெயர்ப்பிலேயே சேர்க்கவில்லை.
- source_word: רוּחַ נִשְׁבָּרָה
  choice: நொறுங்கிய ஆவி
  rationale: רוּחַ என்பதற்கு ‘ஆவி’ என்றும், שבר வேரிலிருந்து வந்த சொல் ‘நொறுங்கிய’ என்றும் நேரடியாகப் பொருள் தருகிறது; மனந்திரும்புதலை விளக்கும் உருவகத்தையும் இது பாதுகாக்கிறது.
- source_word: לֵב נִשְׁבָּר
  choice: நொறுங்கிய இதயம்
  rationale: ‘இதயம்’ மற்றும் ‘நொறுங்கிய’ என்ற எபிரெயச் சொற்களின் இயல்பான, நேரடியான தமிழ் வடிவம்.
- source_word: וְנִדְכֶּה
  choice: நசுங்கிய
  rationale: דכה வேரின் ‘நசுக்கப்பட்ட, நசுங்கிய’ என்ற வலுவான உருவகத்தைப் பாதுகாத்து, ‘நொறுங்கிய’ என்பதுடன் இணையாக அமைகிறது.
- source_word: לֹא תִבְזֶה
  choice: நீர் இகழமாட்டீர்
  rationale: בזה என்பதிலுள்ள ‘அற்பமாக எண்ணுதல், இகழ்தல்’ என்ற பொருளை நேரடியாக வெளிப்படுத்துகிறது; ‘நிராகரிக்கமாட்டீர்’ என்பதைவிட மூலச்சொல்லுக்கு நெருக்கமானது.
- source_word: אֱלֹהִים
  choice: தேவன் / தேவனே
  rationale: முதல் இடத்தில் உடைமைத் தொடர்பிலும், இரண்டாம் இடத்தில் நேரடி அழைப்பாகவும் உள்ள אֱלֹהִים என்பதற்கான நிலையான தமிழ் வடிவங்கள்.
theological_decisions:
- issue: மனந்திரும்புதலின் சூழலில் பலி என்ற உருவகம்
  choice: நொறுங்கிய ஆவியையும் நொறுங்கி நசுங்கிய இதயத்தையும் ‘தேவனின் பலிகள்’ என்று வசனம் அடையாளப்படுத்துகிறது.
  alternative: இந்த வசனம் வெளிப்புறப் பலிகளை முற்றிலும் ஒழிக்கிறது என்று விளக்குவது; அல்லது மனந்திரும்புதலுடன் தொடர்பில்லாத உணர்ச்சித் துயரத்தை மட்டும் குறிப்பதாகக் கொள்வது.
  rationale: எபிரெய உரை உள்ளார்ந்த நிலையையே தேவனின் பலிகளாக முன்வைக்கிறது. ஆனால் பலிமுறையைப் பற்றிய முழுமையான கோட்பாட்டுத் தீர்ப்பை இந்த வசனத்தில் சேர்க்கவில்லை; மூலத்தின் உருவகமும் இறையியல் பதற்றமும் அப்படியே பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன செந்தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. ‘நொறுங்கிய,’ ‘நசுங்கிய’ ஆகிய சொற்கள் மூலத்தின் வலுவான இணை உருவகங்களைத் தக்கவைக்கின்றன; மரியாதை ஒருமைக்காக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
