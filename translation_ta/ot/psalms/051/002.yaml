base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/002.yaml
  text: Be gracious to me[a], God, according to your steadfast love; according to your abundant mercies[c][b], blot out my transgressions.
translation:
  language: ta
  text: இறைவனே, என்மேல் அருள்கூரும்[a]; உமது மாறாத அன்பின்படி[b], உமது மிகுந்த இரக்கங்களின்படி[c], என் மீறுதல்களைத் துடைத்தழியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இறைவனே, என்மேல் இரக்கமாயிரும்.” எபிரெய வினையை இரக்கம் சார்ந்த சொல்லால் மொழிபெயர்க்கலாம்; ஆனால் பின்னர் வரும் மாறாத அன்பு, இரக்கங்கள் ஆகிய சொற்களிலிருந்து இதை வேறுபடுத்த முதன்மைப் பாடம் “அருள்கூரும்” என்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “மாறாத அன்பு” என்பது எபிரெய மொழியின் חֶסֶד (ஹெசெத்) என்ற சொல்லை மொழிபெயர்க்கிறது; அது பற்றுமாறாத, உறவுக்கும் உடன்படிக்கைக்கும் உண்மையான அன்பை அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உமது இரக்கங்களின் பெருக்கின்படி” அல்லது “உமது இரக்கங்களின் மிகுதியின்படி.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: எனக்கு அருள்புரியும்
  rationale: חנן என்ற வினையின் கட்டளை வடிவம் இறைவனுடைய தயவையும் அருளையும் வேண்டுகிறது. பின்னர் வரும் רחמים என்பதிலிருந்து இதை வேறுபடுத்தி, செய்யுளில் உள்ள தொடர்புடைய ஆனால் தனித்த சொற்களைப் பாதுகாக்கிறது.
- source_word: אֱלֹהִים
  choice: இறைவனே
  rationale: இது இஸ்ரவேலின் கடவுளை நேரடியாக அழைக்கும் விளிவடிவம். நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் ஒலிக்க ‘இறைவனே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כְּחַסְדֶּךָ
  choice: உமது மாறாத அன்பின்படி
  rationale: חסד என்பது உறுதியான, பற்றுமாறாத, உடன்படிக்கைச் சார்ந்த அன்பையும் நன்மையையும் குறிக்கிறது. ‘மாறாத அன்பு’ அதன் நிலைத்த விசுவாசத் தன்மையைத் தெளிவாகச் சொல்கிறது; כְּ என்பதற்கு ‘-இன்படி’ பொருந்துகிறது.
- source_word: כְּרֹב
  choice: உமது மிகுந்த
  rationale: רֹב என்பது மிகுதி, பெருக்கம் அல்லது திரள் என்ற பொருளுடையது. இரக்கங்களுடன் இயல்பாக இணையும் வகையில் ‘மிகுந்த’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: רַחֲמֶיךָ
  choice: இரக்கங்கள்
  rationale: רחמים என்ற பன்மை வடிவம் கனிவான இரக்கச் செயல்களின் நிறைவைக் காட்டுகிறது. எபிரெய பன்மையையும் חסד உடனான கவிதை இணைப்பையும் காக்க ‘இரக்கங்கள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: מְחֵה
  choice: துடைத்தழியும்
  rationale: מחה என்பது துடைத்துப்போடுதல், அழித்தல் அல்லது பதிவிலிருந்து நீக்குதல் எனப் பொருள்படும். ‘துடைத்தழியும்’ என்பது அழித்துநீக்கும் உருவகத்தைத் தக்கவைக்கிறது.
- source_word: פְשָׁעַי
  choice: என் மீறுதல்கள்
  rationale: פשע என்பது அதிகாரத்துக்கு எதிரான மீறல், கலகம் அல்லது குற்றச் செயலைக் குறிக்கிறது. ‘மீறுதல்கள்’ அதன் அறநெறி மற்றும் உறவுசார் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חנן / חסד / רחמים ஆகிய தொடர்புடைய அருள்–அன்பு–இரக்கச் சொற்களை மொழிபெயர்த்தல்
  choice: ‘அருள்புரியும்’, ‘மாறாத அன்பு’, ‘இரக்கங்கள்’ என்று வேறுபட்ட சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
  alternative: மூன்றையும் பொதுவாக ‘இரக்கம்’ சார்ந்த ஒரே சொல்லால் மொழிபெயர்த்தல்.
  rationale: எபிரெய செய்யுள் இறைவனுடைய தயவு, பற்றுமாறாத அன்பு, கனிவான இரக்கங்கள் ஆகிய தொடர்புடைய ஆனால் தனித்த பரிமாணங்களை அடுக்குகிறது. அவற்றை வேறுபடுத்துவது செய்யுளின் சொல்வளத்தையும் இறைவனுடைய அருளுள்ள பண்பைப் பற்றிய அதன் செறிவையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை நோக்கிய கண்ணியமான வேண்டுதல் நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உமது’, ‘அருள்புரியும்’, ‘துடைத்தழியும்’ ஆகிய வடிவங்கள் செய்யுளின் உயர்ந்த பதிவைத் தக்கவைக்கின்றன; அரிதான சமயக் கலைச்சொற்கள் தவிர்க்கப்பட்டுள்ளன.
