  text: Hide your face from my sins[b][a], and blot out all my iniquities.
translation:
  language: ta
  text: என் பாவங்களிலிருந்து உமது முகத்தை மறைத்துக்கொள்ளும்; என் அக்கிரமங்கள்[b] அனைத்தையும் துடைத்தழித்திடும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘துடைத்தழித்திடும்’ என்பதற்கு ‘துடைத்துப்போடும்’ அல்லது ‘அழித்துவிடும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘அக்கிரமங்கள்’ என மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், அக்கிரமத்தால் உண்டாகும் ‘குற்றப்பொறுப்பு’ என்ற பொருளையும் தரக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְתֵּר
  choice: மறைத்துக்கொள்ளும்
  rationale: סתר என்பதன் ஹிஃபில் கட்டளை வடிவம். கடவுள் தமது முகத்தைப் பாவங்களிலிருந்து மறைக்க வேண்டும் என்ற மன்றாட்டின் நேரடியான உருவகத்தையும் கட்டளை வலிமையையும் இது காக்கிறது.
- source_word: פָּנֶיךָ
  choice: உமது முகத்தை
  rationale: פנים என்பதன் அடிப்படைப் பொருள் ‘முகம்’; இங்கு அது கடவுளின் தனிப்பட்ட கவனத்தை மனித உருவகத்தில் வெளிப்படுத்துகிறது. ‘முகம்’ என்ற மொழிபெயர்ப்பு எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: מֵחֲטָאָי
  choice: என் பாவங்களிலிருந்து
  rationale: חטא என்பது பாவங்கள் அல்லது குற்றச்செயல்களைக் குறிக்கிறது. מן முன்னிடைச்சொல்லையும் எபிரெயக் கட்டமைப்பையும் இயல்பான தமிழில் வெளிப்படுத்த ‘பாவங்களிலிருந்து’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְכָל
  choice: அனைத்தையும்
  rationale: וְכָל இரண்டாவது மன்றாட்டை முதலாவதுடன் இணைத்து முழுமையை வலியுறுத்துகிறது. தமிழில் வாக்கிய ஓட்டத்திற்கேற்ப ‘என் அக்கிரமங்கள் அனைத்தையும்’ என அமைக்கப்பட்டது; இணைப்பின் பொருள் அரைப்புள்ளி வழியாகத் தெளிவாகிறது.
- source_word: עֲוֺנֹתַי
  choice: என் அக்கிரமங்கள்
  rationale: עָוֹן என்பது அக்கிரமம் மட்டுமன்றி அதனால் உண்டாகும் குற்றப்பொறுப்பையும் குறிக்கக்கூடும். முந்தைய חטא என்பதிலிருந்து சொல்வேறுபாட்டைக் காக்க ‘அக்கிரமங்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: מְחֵה
  choice: துடைத்தழியும்
  rationale: מחה என்பது துடைத்துவிடுதல் அல்லது அழித்தல் என்ற படிமத்தைக் கொண்ட கட்டளை வடிவம். ‘துடைத்தழியும்’ என்பது பதிவிலிருந்து முற்றாக நீக்கும் படிமத்தையும் மன்றாட்டின் வலிமையையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: இருவகைப் பாவச் சொற்களின் வேறுபாடு
  choice: חטא என்பதை ‘பாவங்கள்’ என்றும் עון என்பதை ‘அக்கிரமங்கள்’ என்றும் மொழிபெயர்த்தல்
  alternative: இரண்டையும் ‘பாவங்கள்’ என மொழிபெயர்த்தல்; அல்லது עון என்பதை ‘குற்றப்பொறுப்பு’ என மொழிபெயர்த்தல்
  rationale: எபிரெய உரை இணைநிலையில் இரு வேறு சொற்களைப் பயன்படுத்துகிறது. அவற்றை வேறுபடுத்துவது கவிதைச் செறிவைக் காக்கிறது; அதேவேளை அவற்றுக்கிடையில் உரை கூறாத தொழில்நுட்ப இறையியல் வேறுபாட்டைத் திணிப்பதில்லை.
- issue: முகத்தை மறைத்தல் என்ற மனித உருவகம்
  choice: ‘உமது முகத்தை மறைத்துக்கொள்ளும்’ என்ற நேரடி உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘என் பாவங்களைப் பார்க்காதிரும்’ அல்லது ‘என் பாவங்களிலிருந்து திரும்பிக்கொள்ளும்’ என விளக்கமாக மொழிபெயர்த்தல்
  rationale: நேரடி உருவகம் கடவுளின் கவனத்திலிருந்து பாவங்கள் அகற்றப்பட வேண்டும் என்ற மன்றாட்டைத் திறந்த நிலையில் வைக்கிறது; விளக்க மொழிபெயர்ப்பு அதன் கவிதைத் தீவிரத்தைச் சுருக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீத மன்றாட்டுக்கேற்ற கண்ணியமான நடை. ‘உமது’ மற்றும் மரியாதைக் கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயக் கவிதையின் முகம் மறைத்தல், துடைத்தழித்தல் ஆகிய உருவகங்களும் இருவகைப் பாவச் சொற்களின் வேறுபாடும் காக்கப்பட்டுள்ளன.
