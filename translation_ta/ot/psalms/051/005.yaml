  text: לְ/ךָ֤ לְ/בַדְּ/ךָ֨ חָטָאתִי֮ וְ/הָ/רַ֥ע בְּ/עֵינֶ֗י/ךָ עָ֫שִׂ֥יתִי לְ֭מַעַן תִּצְדַּ֥ק בְּ/דָבְרֶ֗/ךָ תִּזְכֶּ֥ה בְ/שָׁפְטֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/005.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
translation:
  language: ta
  text: உமக்கு விரோதமாக—உமக்கு மட்டுமே விரோதமாக—நான் பாவம் செய்தேன்[a]; உமது பார்வையில் தீமையானதைச் செய்தேன். அதனால், நீர் பேசும்போது நீதியுள்ளவர் என்று விளங்கவும், நீர் தீர்ப்பிடும்போது குற்றமற்றவர் என்று விளங்கவும் செய்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமக்கு மட்டுமே விரோதமாக நான் பாவம் செய்தேன்.” பாவத்தால் இறுதியில் அவமதிக்கப்பட்டவர் கடவுளே என்பதை எபிரெயச் சொல்லமைப்பு வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'இன்னொரு நெருக்கமான மொழிபெயர்ப்பு: “நீர் பேசும்போது நீதியுள்ளவர் எனத் தீர்க்கப்படவும், நீர் தீர்ப்பிடும்போது தூயவர் எனக் காணப்படவும்.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  choice: உமக்கு விரோதமாக—உமக்கு மட்டுமே விரோதமாக—
  rationale: ஒப்புதல் சூழலில் לְ என்பது பாவத்தால் பாதிக்கப்பட்ட தரப்பைச் சுட்டுகிறது. לְבַדְּךָ தரும் வலியுறுத்தலை இடைக்கோடுகளும் ‘மட்டுமே’ என்பதும் காக்கின்றன.
- source_word: חָטָאתִי
  choice: நான் பாவம் செய்தேன்
  rationale: எபிரெய நிறைவுவினையை இயல்பான தமிழில் நேரடியான பாவ ஒப்புதலாக வழங்குகிறது.
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  choice: உமது பார்வையில் தீமையானதைச் செய்தேன்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் הָרַע என்பதை ‘தீமையானது’ என்றும், எபிரெயக் காட்சியுருவான ‘உமது கண்களில்’ என்பதை இயல்பான தமிழில் ‘உமது பார்வையில்’ என்றும் வழங்குகிறது.
- source_word: לְמַעַן
  choice: ஆகவே ... இது நிகழ்ந்தது
  rationale: இந்த இணைப்புச்சொல்லில் நோக்கமும் விளைவும் ஒன்றோடொன்று நெருங்கியுள்ளன. பாவம் கடவுளை நீதியுள்ளவராக்கியது என்ற பொருளைத் தவிர்த்து, முந்திய ஒப்புதலினால் அவரது நீதி வெளிப்படுகிறது என்ற தொடர்பைத் தமிழ் வாக்கியம் காக்கிறது.
- source_word: תִּצְדַּק בְדָבְרֶךָ
  choice: நீர் பேசும்போது நீதியுள்ளவர் என்று விளங்கவும்
  rationale: צדק என்பதன் ‘சரியானவர்/நீதியுள்ளவர் என நிரூபிக்கப்படுதல்’ என்ற நீதிமன்ற நுண்பொருளை ‘விளங்குதல்’ இயல்பாகக் காட்டுகிறது; בְדָבְרֶךָ என்பதை காலவினைத் தொடராக மொழிபெயர்க்கிறது.
- source_word: תִּזְכֶּה בְשָׁפְטֶךָ
  choice: நீர் தீர்ப்பிடும்போது குற்றமற்றவர் என்று விளங்கவும்
  rationale: זכה என்பதிலுள்ள தூய்மை, குற்றமின்மை, சரியென மெய்ப்பிக்கப்படுதல் ஆகிய நீதிமன்றப் பொருள்களை ‘குற்றமற்றவர்’ எடுத்துரைக்கிறது; בְשָׁפְטֶךָ என்பதை இயல்பாக ‘நீர் தீர்ப்பிடும்போது’ என வழங்குகிறது.
theological_decisions:
- issue: மனிதர்களும் பாதிக்கப்பட்டிருக்கையில் ‘உமக்கு மட்டுமே விரோதமாக’ என்று கூறுவதன் பொருள்
  choice: மூலத்தின் முழுமையான கடவுள்-நோக்கிய சொல்லாட்சியை மென்மைப்படுத்தாமல் வைத்தல்
  alternative: ‘எல்லாரையும்விட உமக்கு அதிகமாக விரோதமாக’ அல்லது ‘முக்கியமாக உமக்கு விரோதமாக’
  rationale: எபிரெய உரை வலுவாகவும் முழுமையாகவும் பேசுகிறது. பாவம் அடிப்படையில் கடவுளுக்கு விரோதமானது என்ற இறையியல் அழுத்தத்தையும், மனிதர்கள் பாதிக்கப்பட்டுள்ளனர் என்ற உண்மையோடு காணப்படும் பதற்றத்தையும் மொழிபெயர்ப்பு தீர்த்துவிடாமல் காக்கிறது.
- issue: இறுதிப் பகுதியில் கடவுளின் நீதிக்குரிய நீதிமன்ற நுண்பொருள்
  choice: ‘நீதியுள்ளவர் என்று விளங்கவும் ... குற்றமற்றவர் என்று விளங்கவும்’
  alternative: ‘நீதியுள்ளவர் எனத் தீர்க்கப்படவும் ... தூயவர் எனக் காணப்படவும்’
  rationale: இறைவனின் சொற்களும் தீர்ப்பும் சரியானவை என்பது வெளிப்படுவதை இது காட்டுகிறது; ‘நீதிமானாக்கப்படுதல்’ போன்ற தவறாகப் புரியக்கூடிய கோட்பாட்டுச் சொல்லைத் தவிர்க்கிறது.
- issue: לְמַעַן என்பதில் நோக்கமா விளைவா
  choice: ‘ஆகவே ... இது நிகழ்ந்தது’ என்று நோக்கம்–விளைவு தொடர்பைத் திறந்த நிலையில் வைத்தல்
  alternative: ‘அதனால்’ அல்லது ‘அவ்வாறு ... செய்வதற்காக’
  rationale: பாவம் செய்வதன் நோக்கம் கடவுளின் நீதியை நிரூபிப்பது என்று கூறுவது போலத் தமிழில் ஒலிக்காமல், ஒப்புதலுக்கும் கடவுளின் நீதி வெளிப்படுவதற்கும் இடையிலான மூலத் தொடர்பை வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத ஒப்புதலுக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் இரண்டாம் நபர் வடிவங்கள் ‘உமக்கு/உமது/நீர்’ என மரியாதையுடன் ஒருமைப்படுத்தப்பட்டுள்ளன. எபிரெய இணைநிலையும் வலியுறுத்தலும் காக்கப்பட்டாலும், தமிழில் கடினமாக ஒலிக்கும் சொற்சொல் அமைப்பு தவிர்க்கப்பட்டுள்ளது.
