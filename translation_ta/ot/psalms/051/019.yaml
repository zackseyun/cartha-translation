  text: In your good pleasure[a], do good to Zion[b]; build up the walls of Jerusalem.
translation:
  language: ta
  text: உமது நல்விருப்பத்தால்[a] சீயோனுக்கு நன்மை செய்வீராக; எருசலேமின் மதில்களைக் கட்டியெழுப்புவீராக[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது தயவால்’ அல்லது ‘உமது சித்தத்தின்படி.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘கட்டுவீராக’; மீட்டமைக்கும் பொருளில், ‘மீண்டும் கட்டுவீராக.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: நன்மை செய்யும்
  rationale: יטב என்பதன் ஹிஃபில் வேண்டுகோள் வடிவம், கடவுள் நன்மை செய்யும்படி நேரடியாக மன்றாடுகிறது. ‘செழிக்கச் செய்யும்’ என்பதைவிட மூலத்தின் பரந்த பொருளையும் வேண்டுதல் தொனியையும் இது காக்கிறது.
- source_word: בִּרְצוֹנְךָ
  choice: உமது நல்லெண்ணத்தின்படி
  rationale: רָצוֹן என்பது விருப்பம், தயவு, நல்லெண்ணம் ஆகிய பொருட்களைத் தாங்குகிறது. ‘நல்லெண்ணத்தின்படி’ என்பது கடவுளின் சாதகமான மனப்பாங்கையும் சித்தத்தையும் இணைத்துப் பாதுகாக்கிறது.
- source_word: אֶת צִיּוֹן
  choice: சீயோனுக்கு
  rationale: நேரடிச் செயப்படுபொருள் குறியீடு சீயோனை வேண்டப்படும் நன்மையின் இலக்காகக் காட்டுகிறது; தமிழில் ‘சீயோனுக்கு நன்மை செய்யும்’ என்பது இயல்பான அமைப்பு.
- source_word: תִּבְנֶה
  choice: கட்டியெழுப்பும்
  rationale: கால் முற்றாத வினை இங்கு வேண்டுதல் அல்லது விருப்பமாக வருகிறது. ‘கட்டியெழுப்பும்’ என்பது கட்டுதல் மற்றும் மீட்டமைத்தல் ஆகிய இரு சாத்தியங்களுக்கும் இடமளிக்கிறது.
- source_word: חוֹמוֹת
  choice: மதில்கள்
  rationale: நகரைச் சூழும் பாதுகாப்புச் சுவர்களைக் குறிக்கும் பன்மைச் சொல்லுக்கு ‘மதில்கள்’ துல்லியமும் இயல்பும் உடையது.
- source_word: יְרוּשָׁלִָם
  choice: எருசலேம்
  rationale: தமிழில் பரவலாக நிலைபெற்றுள்ள இடப்பெயர் வடிவம்.
theological_decisions:
- issue: இறைவனின் நல்லெண்ணத்துக்கும் நகரத்தின் மீட்டமைப்புக்கும் உள்ள தொடர்பு
  choice: இறைவனின் நல்லெண்ணம் சீயோனுக்கான நன்மையாகவும் எருசலேமின் மதில்களைக் கட்டியெழுப்புவதாகவும் வெளிப்பட வேண்டுமென்ற மன்றாட்டாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உமது சித்தத்தின்படி சீயோனுக்கு நன்மை செய்யும்’ என்ற முழுக்க விருப்பம் அல்லது சித்தத்தை முன்னிறுத்தும் வாசிப்பு.
  rationale: רָצוֹן என்பது தயவு அல்லது நல்லெண்ணத்தையும் சித்தம் அல்லது விருப்பத்தையும் குறிக்கலாம். ‘நல்லெண்ணத்தின்படி’ இரண்டையும் முற்றிலும் பிரிக்காமல், மூலத்திலுள்ள இறையியல் இழுவிசையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத மன்றாட்டிற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. இறைவனை நோக்கிய மரியாதை ஒருமை வினைமுற்றான ‘செய்யும்/கட்டியெழுப்பும்’ பயன்படுத்தப்பட்டுள்ளது; ‘சீயோன்,’ ‘எருசலேம்,’ ‘மதில்கள்’ ஆகியவை பொதுவாக அறியப்பட்ட வேதாகமச் சொற்களாக வைக்கப்பட்டுள்ளன.
