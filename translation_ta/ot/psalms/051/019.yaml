    reason: lexical_alternative
  revision_rationale: The revision explicitly marks both clauses as reverent petitions, matching the Hebrew imperative followed by a petitionary imperfect. “நல்விருப்பத்தால்” is a natural modern Tamil expression for divine good pleasure/favor and leaves room for the alternative sense of will in the footnote. The established names and concrete term “மதில்கள்” are retained.
