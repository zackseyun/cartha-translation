    என் பாவம் நீங்க, என்னைத் தூய்மைப்படுத்தும்.'
  rationale: ‘முற்றிலும்’ என்பதற்குப் பதிலாக ‘நன்கு’ பயன்படுத்தப்பட்டுள்ளது. இது הַרְבֵּה என்பதன் கழுவுதலைத் தீவிரப்படுத்தும் பொருளை நவீன இயல்பான தமிழில் தெரிவிக்கிறது; முழுமையான முடிவையோ வெளிப்படையான மறுமுறையையோ முதன்மை உரையில் திணிப்பதில்லை. மற்ற சொற்களும் இணை அமைப்பும் மூலத்துக்கு உண்மையாக இருப்பதால் மாற்றப்படவில்லை.
