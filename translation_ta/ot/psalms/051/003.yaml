translation:
  language: ta
  text: 'என் அக்கிரமம் நீங்க, என்னை நன்கு கழுவும்[a];


    என் பாவம் நீங்க, என்னைத் தூய்மைப்படுத்தும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்னை மிகுதியாகக் கழுவும்,’ ‘என்னை மீண்டும் மீண்டும் கழுவும்’; எபிரெயத் தீவிரச்சொல் கழுவுதலின் மிகுதியையோ தீவிரத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה
  choice: முற்றிலும்
  rationale: רבה என்பதன் இவ்வடிவம் அடுத்து வரும் கட்டளையைத் தீவிரப்படுத்துகிறது. ‘முற்றிலும்’ என்பது கழுவுதலின் முழுமையையும் தீவிரத்தையும் இயல்பான நவீன தமிழில் தெரிவிக்கிறது; வெளிப்படையாகக் கூறப்படாத மறுமறுச் செயலைத் திணிப்பதில்லை.
- source_word: כַּבְּסֵנִי
  choice: என்னைக் கழுவும்
  rationale: כבס என்பது முதன்மையாக ஆடையைத் துவைப்பது அல்லது நன்கு கழுவுவது குறித்த சொல். இங்கு உருவகமான ஆழ்ந்த சுத்திகரிப்பை ‘என்னைக் கழுவும்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: מֵעֲוֺנִי
  choice: என் அக்கிரமம் நீங்க
  rationale: עָוֹן என்பது அக்கிரமம், குற்றம், குற்றப்பழி ஆகிய பரப்பைக் கொண்டது. ‘அக்கிரமம்’ செய்கையின் ஒழுக்கக் கனத்தைப் பாதுகாக்கிறது; ‘நீங்க’ என்பது מן என்ற முன்னொட்டின் பிரித்தகற்றும் பொருளைத் தெளிவான தமிழில் தருகிறது.
- source_word: וּמֵחַטָּאתִי
  choice: என் பாவம் நீங்க
  rationale: חַטָּאת மனந்திரும்புதலின் இச்சூழலில் நேரடியாக ‘பாவம்’ எனப் பொருள்படும். עָוֹן என்பதிலிருந்து வேறுபட்ட சொல்லாக வைத்திருப்பது எபிரெய இணைப்பாட்டின் சொல்வளத்தைப் பாதுகாக்கிறது.
- source_word: טַהֲרֵנִי
  choice: என்னைத் தூய்மைப்படுத்தும்
  rationale: טהר என்பது தூய்மையாக்குதல் அல்லது சுத்தமாக்குதல்; சடங்கு மற்றும் ஒழுக்கம் ஆகிய இரு எதிரொலிகளையும் கொண்டிருக்கலாம். ‘தூய்மைப்படுத்தும்’ இந்த விரிவைத் தமிழில் காக்கிறது.
theological_decisions:
- issue: עָוֹן மற்றும் חַטָּאת என்னும் இணையான மனந்திரும்புதல் சொற்களை மொழிபெயர்த்தல்
  choice: முதன்மை உரையில் முறையே ‘அக்கிரமம்’ மற்றும் ‘பாவம்’ என்று வேறுபடுத்துதல்
  alternative: இரண்டையும் பொதுவாக ‘தீச்செயல்/பாவம்’ என மொழிபெயர்த்தல், அல்லது עָוֹן என்பதை ‘குற்றப்பழி’ என மொழிபெயர்த்தல்
  rationale: எபிரெய உரை தொடர்புடைய ஆனால் ஒரே பொருளல்லாத இரு சொற்களைப் பாடல் இணைப்பாட்டில் பயன்படுத்துகிறது. அவற்றை வேறுபடுத்துவது மூலத்தின் கவித்துவ மற்றும் பொருளியல் இறுக்கத்தைப் பாதுகாக்கிறது; עָוֹן என்பதை குற்றப்பழி என்ற ஒரே அம்சத்துக்குள் சுருக்குவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். வேண்டுதல்/கட்டளைச் சாயலைத் தக்கவைக்க ‘கழுவும்’, ‘தூய்மைப்படுத்தும்’ என்ற இலக்கிய வழக்கிலுள்ள ஏவல் வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘என் அக்கிரமத்திலிருந்து’ என்ற சொற்சொல் அமைப்பைவிட இயல்பான ‘என் அக்கிரமம் நீங்க’ தேர்ந்தெடுக்கப்பட்டது.
