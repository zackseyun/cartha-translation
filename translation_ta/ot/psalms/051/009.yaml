base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/009.yaml
  text: Let me hear joy and gladness[c][b][a]; let the bones you have crushed rejoice.
translation:
  language: ta
  text: மகிழ்ச்சியையும் களிப்பையும் எனக்குக் கேட்கச் செய்யும்[a]; நீர் நொறுக்கிய[b] எலும்புகள்[c] களிகூரட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மகிழ்ச்சியையும் களிப்பையும் நான் கேட்குமாறு செய்யும்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நீர் முறித்த.’
    reason: alternative_reading
  - marker: c
    text: எபிரெயில் ‘எலும்புகள்’; சூழலில் சங்கீதக்காரரின் சொந்த எலும்புகள் குறிக்கப்படுகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁמִיעֵנִי
  choice: நான் கேட்கும்படி செய்யும்
  rationale: שׁמע என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளில் ‘என்னைக் கேட்கச் செய்’ என்று வருகிறது. தமிழில் வேண்டுதலின் இயல்பையும் காரணவினைப் பொருளையும் தெளிவாகக் காக்க ‘நான் கேட்கும்படி செய்யும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: שָׂשׂוֹן
  choice: மகிழ்ச்சி
  rationale: மகிழ்வு அல்லது பேருவகையைக் குறிக்கும் சொல்லுக்கு இயல்பான, சுருக்கமான நவீனத் தமிழ் இணை.
- source_word: וְשִׂמְחָה
  choice: களிப்பு
  rationale: மகிழ்ச்சி, களிகூருதல் என்ற பொருளுடைய இச்சொல், அருகிலுள்ள இணைச்சொல்லை அப்படியே மீண்டும் கூறாமல் எபிரெயக் கவிதையின் சொல் இணையைப் பேணுகிறது.
- source_word: תָּגֵלְנָה
  choice: களிகூரட்டும்
  rationale: மூன்றாம் நபர் பெண்பால் பன்மை முற்றுப்பெறா வடிவம் இங்கு வாழ்த்து அல்லது வேண்டுதல் சார்ந்த ஏவல் நுணுக்கத்தைக் கொண்டுள்ளது; ‘களிகூரட்டும்’ அதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲצָמוֹת
  choice: எலும்புகள்
  rationale: எபிரெயில் ‘எலும்புகள்’ என்று மட்டுமே உள்ளது; முதலாம் நபர் உரிமை விகுதி இல்லை. சூழலில் சங்கீதக்காரரின் எலும்புகள் எனப் புரிந்தாலும், முதன்மை உரை மூலத்தின் வடிவத்தைப் பேணுகிறது.
- source_word: דִּכִּיתָ
  choice: நீர் நொறுக்கிய
  rationale: דכה ஆழமாக நசுக்குதல் அல்லது உடைத்தல் என்ற வலுவான உருவகத்தைக் கொண்டது. ‘நொறுக்கிய’ அந்தத் தீவிரத்தையும், இறைவனை நேரடியாகக் குறிக்கும் இரண்டாம் நபர் வினையையும் காக்கிறது.
theological_decisions:
- issue: துன்புறுத்தும் செயல் நேரடியாக இறைவனுக்குச் சாட்டப்படுதல்
  choice: ‘நீர் நொறுக்கிய’ என்ற நேரடி இரண்டாம் நபர் வடிவத்தைப் பேணுதல்
  alternative: ‘நொறுக்கப்பட்ட’ அல்லது ‘நீர் முறித்த’
  rationale: எபிரெயின் இரண்டாம் நபர் ஆண்பால் ஒருமை நிறைவுவினை, நொறுக்கிய செயலை இறைவனுக்கே நேரடியாக உரியதாக்குகிறது. அந்த இறையியல் அழுத்தத்தை மறைமுகமாக்காமல் மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை மரியாதையுடன் ஒருமையில் ‘நீர்’ என நேரடியாக அழைக்கும் கவித்துவ வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கேட்கும்படி செய்யும்’ என்பது மூலத்தின் காரணவினை அமைப்பைப் பேணுகிறது; ‘நொறுக்கிய’ என்பது உருவகத்தின் தீவிரத்தை மென்மையாக்காமல் தருகிறது.
