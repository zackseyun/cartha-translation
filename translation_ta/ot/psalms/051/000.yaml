  text: For the choirmaster[a]. A psalm of David[b].
translation:
  language: ta
  text: இசைத் தலைவருக்கு[a]. தாவீதின் சங்கீதம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இசைத் தலைவரிடம்.’
    reason: לַמְנַצֵּחַ என்பதிலுள்ள לַ முன்னொட்டு, தலைப்பின் சூழலில் ‘-க்கு’ அல்லது ‘-ிடம்’ எனப் புரிந்துகொள்ளப்படலாம்.
  - marker: b
    text: எபிரெயத்தில் ‘தாவீதின்’; இது தாவீது இயற்றியது, தாவீதுடன் தொடர்புடையது அல்லது தாவீதுக்காக அர்ப்பணிக்கப்பட்டது என்பவற்றில் ஒன்றைக் குறிக்கலாம். ‘தாவீது இயற்றிய சங்கீதம்’ அல்லது ‘தாவீதுக்கான சங்கீதம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: தாவீதின் பெயருக்கு முன் வரும் לְ பலவகையான உறவுகளைக் குறிக்கக்கூடும்; அதன் பொருள் இங்கு முழுமையாகத் தீர்மானிக்கப்படவில்லை.
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதங்களின் தலைப்புகளில் இச்சொல் இசையை வழிநடத்தும் அல்லது மேற்பார்வையிடும் ஒருவரைக் குறிக்கிறது. ‘இசைத் தலைவர்’ என்பது இயல்பான நவீனத் தமிழில் அந்தப் பணியைத் தெளிவாகக் காட்டுகிறது; முன்னொட்டு לַ இங்கு ‘-க்கு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இது இசைக்கருவிகளின் துணையுடன் பாடப்பட்டிருக்கக்கூடிய சங்கீத வகையைக் குறிக்கும் வழக்கமான எபிரெயச் சொல். தமிழில் நிலைபெற்றுள்ள ‘சங்கீதம்’ அதன் இலக்கிய மற்றும் இசை வகையைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: தனிப்பெயருடன் வரும் לְ ஆசிரியத்துவம், தொடர்பு, உடைமை அல்லது அர்ப்பணிப்பு ஆகியவற்றில் ஒன்றைக் குறிக்கலாம். ‘தாவீதின்’ என்பது ‘தாவீது எழுதியது’ என்று தேவையின்றி உறுதிப்படுத்தாமல் அந்த உறவின் அகலத்தை ஓரளவு காக்கிறது.
theological_decisions:
- issue: தாவீதுடன் சங்கீதத்திற்குள்ள உறவு
  choice: தாவீதின்
  alternative: தாவீது இயற்றியது / தாவீதுக்காக
  rationale: எபிரெயத் தலைப்பு தாவீது ஆசிரியர் என்பதையே மட்டும் கட்டாயப்படுத்தவில்லை; ஆசிரியத்துவம், தொடர்பு அல்லது அர்ப்பணிப்பு ஆகிய அர்த்தங்கள் சாத்தியம். ஆகவே மூலத்தில் உள்ள உண்மையான தெளிவின்மையைத் தீர்த்துவிடாமல் ‘தாவீதின்’ என வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான சங்கீதத் தலைப்பு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இசைத் தலைவர்’ பொதுவாசகர்களுக்குப் புரியும் இயல்பான சொல்லாகத் தேர்ந்தெடுக்கப்பட்டது; ‘தாவீதின்’ மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
