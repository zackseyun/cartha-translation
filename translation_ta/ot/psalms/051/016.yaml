  yaml_path: translation/ot/psalms/051/016.yaml
  text: Lord, open my lips, and my mouth will declare your praise.
translation:
  language: ta
  text: ஆண்டவரே, என் உதடுகளைத் திறந்தருளும்; என் வாய் உமது புகழை அறிவிக்கும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இறைவனை நேரடியாக அழைக்கும் மரியாதைக்குரிய ஆட்சியுரிமைப் பட்டம். «ஆண்டவரே» என்பது நவீனத் தமிழில் இயல்பாகவும் உயர்வாகவும் ஒலிக்கிறது; மூலத்தில் இல்லாத «தேவன்» என்பதையும் உடன்படிக்கைப் பெயரையும் சேர்ப்பதில்லை.
- source_word: שְׂפָתַי
  choice: என் உதடுகளை
  rationale: முதல் நபர் ஒருமை உடைமை விகுதியுடன் வரும் பன்மை உடற்பாகச் சொல்லை நேரடியாகக் கொண்டு, பேச்சை இறைவன் இயலச் செய்யும் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: תִּפְתָּח
  choice: திறந்தருளும்
  rationale: פתח என்பதன் Qal imperfect வடிவம் இங்கு வேண்டுதல் பொருளில் வருகிறது. «திறந்தருளும்» என்பது கட்டளையாகக் கடுமையாக ஒலிக்காமல், இறைவனை நோக்கிய மன்றாட்டை இயல்பான தமிழ் பக்திமொழியில் வெளிப்படுத்துகிறது.
- source_word: וּפִי
  choice: என் வாய்
  rationale: «என் உதடுகள்» என்பதுடன் உள்ள எபிரெய இணைநிலையைப் பாதுகாக்கிறது. வாவ் இணைப்பின் தொடர்பை அரைப்புள்ளி இயல்பாகக் காட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத «அப்பொழுது» சேர்க்கப்படவில்லை.
- source_word: יַגִּיד
  choice: அறிவிக்கும்
  rationale: נגד என்பதன் Hiphil imperfect வடிவத்தின் ‘அறிவித்தல்/வெளிப்படுத்தல்’ பொருளையும், வேண்டுதலுக்குப் பின்வரும் விளைவாகிய எதிர்கால நுணுக்கத்தையும் தருகிறது.
- source_word: תְּהִלָּתֶךָ
  choice: உமது புகழை
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதியுடன் வரும் ‘புகழ்/துதி’ என்ற பெயர்ச்சொல்லை இயல்பான தமிழில் தருகிறது. «உமது» நேரடி அழைப்புக்கேற்ற மரியாதை வடிவம்.
theological_decisions:
- issue: இறைவனுக்குரிய אֲדֹנָי பட்டத்தை நேரடி அழைப்பில் மொழிபெயர்த்தல்
  choice: ஆண்டவரே
  alternative: என் ஆண்டவரே
  rationale: אֲדֹנָי இறைவனுக்குரிய மரியாதைப் பட்டமாக உள்ளது. «ஆண்டவரே» அதன் ஆட்சியுரிமை நுணுக்கத்தைத் தக்கவைக்கிறது; மூல வடிவத்தில் முதல் நபர் உடைமை விகுதி தனியே வெளிப்படையாக இல்லாததால் «என்» சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான மன்றாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் «உதடுகள் / வாய்» இணைநிலை பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
