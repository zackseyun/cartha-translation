  - marker: b
    text: அல்லது, “உமது புகழில் பெருமகிழ்ச்சி கொள்ளவும்”; “உமது புகழை மேன்மைபாராட்டவும்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
  choice: எங்களைக் காப்பாற்றும்
  rationale: ישׁע என்பதன் ஹிஃபில் கட்டளை வடிவம் ஆபத்திலிருந்து காப்பாற்றுதல் அல்லது விடுவித்தல் என்ற நேரடியான வேண்டுதலைக் குறிக்கிறது. நவீன தமிழில் ‘காப்பாற்றும்’ என்பது இயல்பாகவும் செபத்திற்குரிய கண்ணியத்துடனும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப்பெயரை ஒரு பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אֱלֹהֵינוּ
  choice: எங்கள் கடவுள்
  rationale: முதலாம் நபர் பன்மை உடைமைப் பின்னொட்டை நேரடியாகப் பிரதிபலித்து, ‘எங்கள் கடவுள்’ என்ற உடன்படிக்கை சார்ந்த அழைப்பைத் தக்கவைக்கிறது.
- source_word: וְקַבְּצֵנוּ
  choice: எங்களைக் கூட்டிச்சேர்த்தருளும்
  rationale: קבץ என்பதன் பியேல் வடிவம் சிதறியிருப்பவர்களைத் திரட்டிச் சேர்ப்பதைக் குறிக்கிறது. ‘கூட்டிச்சேர்த்தருளும்’ இந்தச் சூழலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִן הַגּוֹיִם
  choice: நாடுகளின் நடுவிலிருந்து
  rationale: இஸ்ரவேலர் சிதறியிருந்த பிற மக்களினங்களின் மத்தியிலிருந்து சேர்க்கப்படுவதை ‘நடுவிலிருந்து’ தெளிவாக்குகிறது; ‘புறவினத்தார்’ போன்ற பிற்கால சமயச் சுமையுள்ள சொல்லைத் தவிர்க்கிறது.
- source_word: לְהוֹדוֹת
  choice: நன்றி செலுத்தி
  rationale: ידה என்பதன் ஹிஃபில் இங்கு நன்றி கூறுதல் அல்லது புகழ்ந்து அறிக்கையிடுதல் என்ற பொருள் தருகிறது. தொடர்ந்து வரும் புகழ்ச்சிச் சொல்லிலிருந்து வேறுபடுத்த ‘நன்றி செலுத்தி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: உமது பரிசுத்தப் பெயருக்கு
  rationale: ‘உமது பரிசுத்தப் பெயர்’ என்ற எபிரெய வலியுறுத்தலைத் தக்கவைத்து, לְ குறிக்கும் தொடர்பை இயல்பான தமிழில் ‘பெயருக்கு’ என்று வழங்குகிறது.
- source_word: לְהִשְׁתַּבֵּחַ
  choice: பெருமை கொள்வோம்
  rationale: שׁבח என்பதன் ஹித்பயேல் வடிவம் பெருமை கொள்ளுதல், மேன்மை பாராட்டுதல், மகிழ்ந்து களித்தல் ஆகிய நுணுக்கங்களைக் கொண்டது. ‘பெருமை கொள்வோம்’ அதன் தன்னிலை சார்ந்த வலிமையை மென்மையாக்காமல் தக்கவைக்கிறது.
- source_word: בִּתְהִלָּתֶךָ
  choice: உமது புகழில்
  rationale: בְּ குறிக்கும் தளம் அல்லது பொருளையும், תְּהִלָּה என்ற பெயர்ச்சொல்லின் ‘புகழ்/துதி’ பொருளையும் சுருக்கமாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ என்பதன் நுணுக்கம்
  choice: உமது புகழில் பெருமை கொள்வோம்
  alternative: உமது புகழில் பெருமகிழ்ச்சி கொள்வோம்
  rationale: இந்தச் சொற்றொடர் மனித சாதனையைப் பற்றிய செருக்கை அல்ல, கடவுளின் புகழை மையமாகக் கொண்ட மேன்மைபாராட்டுதலைக் குறிக்கிறது. ‘பெருமை கொள்வோம்’ வினையின் வலுவான தன்னிலை நுணுக்கத்தைப் பாதுகாக்கிறது; ‘பெருமகிழ்ச்சி கொள்வோம்’ அதன் களிப்பைத் தெளிவாக்கினாலும் ‘boast/glory’ என்ற அம்சத்தைச் சற்றே மென்மையாக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், செபத்திற்கும் சங்கீத நடைக்கும் ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’, ‘அருளும்’ போன்ற வடிவங்கள் மரியாதையைக் காக்கின்றன; அளவுக்கு மீறிய பழந்தமிழ் தவிர்க்கப்பட்டுள்ளது. எபிரெய நோக்கத்தைக் குறிக்கும் இரு infinitive வடிவங்களும் தமிழில் ‘அப்போது ... செலுத்தி ... கொள்வோம்’ என்ற இயல்பான விளைவு/நோக்க அமைப்பில் வழங்கப்பட்டுள்ளன.
