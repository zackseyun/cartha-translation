  yaml_path: translation/ot/psalms/106/047.yaml
  text: Save us[a], O Yahweh our God, and gather us from among the nations[b], that we may give thanks to your holy name and glory in your praise.
translation:
  language: ta
  text: எங்கள் கடவுளாகிய யாவே, எங்களைக் காப்பாற்றும்[a]; நாடுகளின் நடுவிலிருந்து எங்களைக் கூட்டிச்சேர்த்தருளும்; உமது பரிசுத்தப் பெயருக்கு நாங்கள் நன்றி செலுத்தவும், உமது புகழில் பெருமை கொள்ளவும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களை விடுவித்தருளும்.”
