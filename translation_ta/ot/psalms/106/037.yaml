revisions:
- from: அவர்கள் தங்கள் மகன்களையும் தங்கள் மகள்களையும் பேய்களுக்குப் பலியிட்டார்கள்.[a]
  to: அவர்கள் தங்கள் மகன்களையும் தங்கள் மகள்களையும் தீய ஆவிகளுக்குப் பலியிட்டார்கள்.[a]
  rationale: The revision changes only the term for שֵׁדִים. “தீய ஆவிகள்” is a more source-faithful and less ambiguous modern Tamil expression than “பேய்கள்”; all other elements of the draft accurately and naturally represent the Hebrew.
