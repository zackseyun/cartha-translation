id: PSA.106.37
reference: Psalms 106:37
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ אֶת בְּ֭נֵי/הֶם וְ/אֶת בְּנֽוֹתֵי/הֶ֗ם לַ/שֵּֽׁדִים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/037.yaml
  text: They sacrificed their sons and their daughters to demons[a].
translation:
  language: ta
  text: அவர்கள் தங்கள் மகன்களையும் தங்கள் மகள்களையும் தீய ஆவிகளுக்குப் பலியிட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்தத் தீய ஆவிகளுக்கு.’
    reason: எபிரெய לַשֵּׁדִים வடிவில் உள்ள குறித்த சுட்டுப்பொருளால், ‘அந்தத் தீய ஆவிகளுக்கு’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: பலியிட்டார்கள்
  rationale: זבח என்பது பலிக்காகக் கொல்வதையோ பலியாகச் செலுத்துவதையோ குறிக்கிறது. ‘பலியிட்டார்கள்’ என்பது வழிபாட்டுச் சூழலை இயல்பாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: אֶת
  choice: '[நேரடிச் செயப்படுபொருள் குறியீடு; மொழிபெயர்க்கப்படவில்லை]'
  rationale: எபிரெய நேரடிச் செயப்படுபொருள் குறியீட்டிற்குத் தமிழில் தனியான இணைச்சொல் தேவையில்லை; ‘மகன்களையும்’ என்ற வேற்றுமை வடிவில் அதன் இலக்கணச் செயல்பாடு வெளிப்படுகிறது.
- source_word: בְּנֵיהֶם
  choice: தங்கள் மகன்களை
  rationale: בֵּן என்பதன் பன்மை இங்கு குறிப்பாக ‘மகன்கள்’ எனப் பொருள்படுகிறது; பாலினத்தைக் குறிப்பிடும் மூலச்சொல்லை இது பாதுகாக்கிறது.
- source_word: וְאֶת
  choice: -யும் [நேரடிச் செயப்படுபொருள் குறியீடு தனியாக மொழிபெயர்க்கப்படவில்லை]
  rationale: வְ இணைப்பின் பொருள் தமிழில் ‘மகன்களையும் ... மகள்களையும்’ என்னும் இணை அமைப்பால் வெளிப்படுகிறது; אֶת தனியாக மொழிபெயர்க்கப்படவில்லை.
- source_word: בְּנוֹתֵיהֶם
  choice: தங்கள் மகள்களை
  rationale: בַּת என்பதன் பன்மை குறிப்பாக ‘மகள்கள்’ எனப் பொருள்படுகிறது. மகன்களும் மகள்களும் என்று தனித்தனியாகக் கூறும் மூலத்தின் வலியுறுத்தலை இது காக்கிறது.
- source_word: לַשֵּׁדִים
  choice: பேய்களுக்கு
  rationale: שֵׁדִים என்பது தீய ஆவிக்குரிய உயிர்களைக் குறிக்கிறது. நவீனத் தமிழில் ‘பேய்கள்’ தெளிவான, பொதுவாகப் புரியும் இணைச்சொல்; לְ பெறுநரை ‘-க்கு’ எனக் குறிக்கிறது. எபிரெய வடிவிலுள்ள குறித்த சுட்டைத் தமிழில் இயல்பாகச் சொல்ல வேண்டிய அவசியமில்லை.
theological_decisions:
- issue: שֵׁדִים என்பதன் மொழிபெயர்ப்பு
  choice: பேய்கள்
  alternative: தீய ஆவிகள்; பொய்த் தெய்வங்கள்
  rationale: இந்த எபிரெயச் சொல் வெறும் சிலைகளையோ கருத்தளவிலான பொய்த் தெய்வங்களையோ அல்லாமல் ஆவிக்குரிய உயிர்களைக் குறிக்கிறது. ‘பேய்கள்’ என்பது பிற்கால ஊக விவரங்களைச் சேர்க்காமல் மூலத்தின் இயற்கைக்கு அப்பாற்பட்ட கூற்றைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை. ‘தங்கள்’ என்பது எழுவாயான ‘அவர்கள்’ என்பதையே உடைமையாளராகத் தெளிவுபடுத்துகிறது. ‘பலியிட்டார்கள்’ வழிபாட்டுச் சார்ந்த பலிக்கொலையின் பொருளைப் பாதுகாக்கிறது.
