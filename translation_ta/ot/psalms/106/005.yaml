  text: that I may see the good of your chosen ones[a], rejoice in the joy of your nation[b], and glory with your inheritance.
translation:
  language: ta
  text: 'உம்மால் தேர்ந்துகொள்ளப்பட்டவர்களின் நலனை நான் காணவும்,


    உமது தேசத்தின் மகிழ்ச்சியில் மகிழவும்,


    உமது சுதந்தரத்தோடு சேர்ந்து பெருமை கொள்ளவும் செய்வீராக.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְאוֹת
  choice: நான் காணவும்
  rationale: முந்தைய வசனத்தின் வேண்டுதலைத் தொடரும் நோக்கப் பொருளுடைய வினையெச்சமாக எடுத்துக்கொள்ளப்பட்டது; எபிரெயச் சொல்லின் நேரடியான ‘காணுதல்’ உருவகம் காக்கப்படுகிறது.
- source_word: בְּטוֹבַת
  choice: நலனை
  rationale: טוֹבָה இங்கு தேர்ந்துகொள்ளப்பட்டோர் அனுபவிக்கும் நன்மை, நல்வாழ்வு, செழிப்பு ஆகியவற்றை உள்ளடக்குகிறது. ‘நலன்’ இந்தப் பரப்பை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது.
- source_word: בְּחִירֶיךָ
  choice: உம்மால் தேர்ந்துகொள்ளப்பட்டவர்களின்
  rationale: தேவன் தேர்ந்தெடுத்தவர்களைக் குறிக்கும் சொல்; பிற்காலக் கோட்பாட்டுச் சுமை ஏற்படக்கூடிய தொழில்நுட்பச் சொல்லைத் தவிர்த்து செயற்பொருள் தெளிவாக வெளிப்படுத்தப்படுகிறது.
- source_word: לִשְׂמֹחַ
  choice: மகிழவும்
  rationale: தொடர்ச்சியான நோக்க வினையெச்சம். அடுத்துள்ள அதே வேர்ச்சொல் சார்ந்த ‘மகிழ்ச்சி’ என்பதுடனான சொல்லொலித் தொடர்பையும் காக்கிறது.
- source_word: בְּשִׂמְחַת
  choice: மகிழ்ச்சியில்
  rationale: בְּ பங்கேற்பையோ சூழலையோ குறிக்கிறது; ‘மகிழ்ச்சியில் மகிழ’ என்பது அந்தக் கூட்டுப் பங்கேற்பை நேரடியாகத் தருகிறது.
- source_word: גּוֹיֶךָ
  choice: உமது தேசத்தின்
  rationale: גּוֹי என்பதன் அடிப்படைப் பொருளான ‘தேசம்’ காக்கப்படுகிறது; இங்கு அது தேவனுக்குரிய இஸ்ரவேல் மக்களின் கூட்டடையாளத்தைக் குறிக்கிறது.
- source_word: לְהִתְהַלֵּל
  choice: பெருமகிழ்ச்சி கொள்ளவும்
  rationale: ஹித்பயேல் வடிவம் சூழலில் பெருமைப்படுதல், களிகூருதல், மேன்மை பாராட்டுதல் ஆகிய நேர்மறை நிழற்பொருள்களைக் கொண்டது. தமிழில் எதிர்மறையான தற்பெருமைத் தொனி வராமல், உடன்படிக்கை மக்களோடு களிகூரும் கருத்து வெளிப்படுத்தப்படுகிறது.
- source_word: עִם
  choice: சேர்ந்து
  rationale: உடனிருப்பையும் பங்கேற்பையும் குறிக்கும் ‘உடன்’ என்ற பொருளை இயல்பான தமிழ் தொடராகத் தருகிறது.
- source_word: נַחֲלָתֶךָ
  choice: உமது உரிமைச்சொத்தோடு
  rationale: தேவனுக்குச் சொந்தமான உடன்படிக்கை மக்களைக் குறிக்கும் மரபுருவகம். ‘உரிமைச்சொத்து’ என்பது வெறும் வாரிசுரிமையைவிட இங்கு தேவனுடைய சொந்த மக்களாக இருப்பதைக் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: உடன்படிக்கை மக்களைக் குறிக்கும் மூன்று வேறுபட்ட அடையாளச் சொற்களைப் பாதுகாத்தல்
  choice: உம்மால் தேர்ந்துகொள்ளப்பட்டவர்கள் ... உமது தேசம் ... உமது உரிமைச்சொத்து
  alternative: உமது தெரிந்துகொள்ளப்பட்டவர்கள் ... உமது மக்கள் ... உமது சுதந்தரம்
  rationale: வசனம் בְּחִירֶיךָ, גּוֹיֶךָ, נַחֲלָתֶךָ என வேறுபட்ட மூன்று சொற்களை அடுக்குகிறது. அவற்றை ஒரே ‘மக்கள்’ என்ற சொல்லில் சமப்படுத்தாமல், பிற்காலத் தனிப்பட்ட கோட்பாட்டையும் புகுத்தாமல் வேறுபாடு காக்கப்படுகிறது.
- issue: לְהִתְהַלֵּל என்பதின் நேர்மறை அல்லது எதிர்மறைத் தொனி
  choice: பெருமகிழ்ச்சி கொள்ளவும்
  alternative: பெருமை கொள்ளவும்
  rationale: இங்கு தேவனுடைய மக்களோடு இணைந்து களிகூரும் நேர்மறைச் சூழல் உள்ளது. ‘பெருமை கொள்ளுதல்’ சாத்தியமான நேரடி மாற்றாக இருந்தாலும், தமிழில் தற்பெருமை என்ற எதிர்மறை உணர்வு எழக்கூடும்; ஆகவே நேர்மறை மகிழ்ச்சி நிழற்பொருள் முன்னிலைப்படுத்தப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வேண்டுதல் தொடரை உணர்த்தும் ‘நான் ... செய்யவும் ... செய்வீராக’ அமைப்பு பயன்படுத்தப்பட்டுள்ளது. இறைமரியாதைக்குரிய ‘உமது/உம்மால்’ வடிவங்கள் காக்கப்பட்டுள்ளன. கவிதைநடைக்காக மூன்று இணைவரி அமைப்பு பேணப்பட்டுள்ளது.
