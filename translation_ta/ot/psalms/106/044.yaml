lexical_decisions:
- source_word: וַיַּרְא
  choice: கண்டார்
  rationale: ראה என்பதன் நேரடியான பொருள் ‘காணுதல்.’ இச்சூழலில் அது வெறும் பார்வையைக் காட்டிலும் கவனித்தறிதலைக் குறித்தாலும், எபிரெய மொழிநடையைத் தெளிவாகப் பாதுகாக்க ‘கண்டார்’ பொருத்தமானது.
- source_word: בַּצַּר לָהֶם
  choice: அவர்களுடைய நெருக்கடியை
  rationale: צַר என்பது நெருக்கடி அல்லது துன்ப நிலையைச் சுட்டுகிறது; தொடர்ந்து வரும் לָהֶם உடன் சேர்ந்து ‘அவர்களுடைய நெருக்கடி’ என இயல்பாகப் பொருள்படுகிறது.
- source_word: בְּשָׁמְעוֹ
  choice: அவர் கேட்டபோது
  rationale: בְּ உடன் வரும் வினையெச்ச வடிவம் இங்கே காலத்தைக் குறிக்கும் துணைவாக்கியமாகச் செயல்படுகிறது; ‘கேட்டபோது’ என்பது இயல்பான தமிழாக்கம்.
- source_word: רִנָּתָם
  choice: அவர்களுடைய கூக்குரலை
  rationale: רִנָּה சில சூழல்களில் மகிழ்ச்சி ஆரவாரத்தைக் குறிக்கலாம்; இங்கு நெருக்கடியின் சூழலில் உதவிக்கான உரத்த அழுகுரல் அல்லது கூக்குரலைக் குறிக்கிறது. ‘கூக்குரல்’ அந்த அவசரத்தையும் ஒலியையும் காக்கிறது.
- source_word: וַ
  choice: ஆனாலும்
  rationale: இணைப்பிடைச்சொல் அடிப்படையில் ‘மேலும்/அப்போது’ என வரலாம்; ஆனால் முந்தைய கலகமும் தண்டனையும் தொடர்ந்து வரும் இறை இரக்கத்துடன் முரண்படுவதால், இங்கு எதிர்மறைத் திருப்பத்தை ‘ஆனாலும்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்புக்குப் பின் வரும் இரக்கச் சூழலில் தொடக்க இணைப்பிடைச்சொல்லின் உரையாடல் வலிமை
  choice: எதிர்மறைத் திருப்பமாக ‘ஆனாலும்’
  alternative: எளிய இணைப்பாக ‘மேலும்’ அல்லது காலவரிசையாக ‘அப்போது’
  rationale: எபிரெய வாவ் ஒரு சாதாரண இணைப்பாக இருக்கக்கூடும். ஆயினும், சங்கீதத்தின் ஓட்டத்தில் மக்களின் கலகத்திற்கும் ஒடுக்குதலுக்கும் மத்தியிலும் தேவன் இரக்கத்துடன் செவிசாய்ப்பதை இந்த வசனம் காட்டுகிறது. ‘ஆனாலும்’ என்பது நியாயத்தீர்ப்புக்கும் இரக்கத்துக்கும் இடையிலான பதற்றத்தை கூடுதல் கருத்தைச் சேர்க்காமல் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை. ‘கூக்குரல்’ துயரத்தில் எழும் அவசர அழைப்பை வெளிப்படுத்துகிறது; ‘நெருக்கடி’ צַר என்பதன் பரந்த துன்பநிலையை இயல்பாகக் கடத்துகிறது. அடிக்குறிப்பு மாற்று தொடரமைப்பில் לָהֶם என்பதன் ‘அவர்களுக்கு’ என்ற வடிவை வெளிப்படையாகப் பாதுகாக்கிறது.
