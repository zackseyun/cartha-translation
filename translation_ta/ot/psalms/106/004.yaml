  text: זָכְרֵ֣/נִי יְ֭הוָה בִּ/רְצ֣וֹן עַמֶּ֑/ךָ פָּ֝קְדֵ֗/נִי בִּ/ישׁוּעָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/004.yaml
  text: Remember me[a], O Yahweh, when you show favor to your people[b]; attend to me with your salvation.
translation:
  language: ta
  text: யாவே, உமது மக்களுக்கு நீர் தயவு காட்டும்போது[a] என்னை நினைத்தருளும்; உமது மீட்புடன் என்னைக் கவனித்தருளும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது மக்களுக்குக் காட்டும் தயவோடு என்னை நினைத்தருளும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது மீட்புடன் என்னைச் சந்தித்தருளும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרֵנִי
  choice: என்னை நினைத்தருளும்
  rationale: זכר என்பதன் Qal கட்டளை வடிவத்தையும் முதல் நபர் ஒருமை பின்னொட்டையும் நேரடியான வேண்டுதலாகத் தருகிறது. ‘அருளும்’ என்பது பொருளை விரிவாக்காமல், தமிழில் இறைவனை நோக்கிய மரியாதையான வேண்டுகோள் நடையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான יהוה-ஐ ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ என்று தருகிறது.
- source_word: בִּרְצוֹן עַמֶּךָ
  choice: உமது மக்களுக்கு நீர் தயவு காட்டும்போது
  rationale: רָצוֹן இங்கு தயவு அல்லது நல்லெண்ணத்தைக் குறிக்கிறது. בְּ முன்னிடைச்சொல்லைச் சூழ்நிலை/காலப் பொருளில் எடுத்துக்கொள்வது, சங்கீதக்காரர் கடவுள் தம் மக்களுக்குத் தயவு காட்டும் வேளையில் தன்னையும் நினைக்குமாறு வேண்டுவதை இயல்பான தமிழில் தெளிவாக்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: פָּקְדֵנִי
  choice: என்னைக் கவனித்தருளும்
  rationale: פקד இச்சூழலில் ஒருவரைக் கவனித்து அவருக்காகச் செயல்படுதல் என்ற பொருளைக் கொள்ளலாம். ‘கவனித்தருளும்’ வெறும் இடம்சார் வருகையாகக் குறுக்காமல், இறைவனின் நன்மையான தலையீட்டைக் குறிக்கிறது.
- source_word: בִּישׁוּעָתֶךָ
  choice: உமது மீட்புடன்
  rationale: יְשׁוּעָה என்பதன் மீட்பு/இரட்சிப்பு என்ற பெயர்ச்சொல் வடிவத்தையும் בְּ முன்னிடைச்சொல்லையும் காக்கிறது; உடனடி ஆபத்திலிருந்து விடுவிப்பதாக மட்டும் பொருளைக் குறுக்கவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: எபிரெய உரை திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கிறது.
- issue: בִּרְצוֹן עַמֶּךָ என்பதன் தொடரியல் பொருள்
  choice: 'கால/சூழ்நிலைப் பொருள்: ‘உமது மக்களுக்கு நீர் தயவு காட்டும்போது’'
  alternative: 'இணைவு/உடனிகழ்வுப் பொருள்: ‘உமது மக்களுக்குக் காட்டும் தயவோடு’'
  rationale: சுருக்கமான எபிரெயத் தொடர் இரு புரிதல்களுக்கும் இடமளிக்கிறது. வேண்டுதல் சூழலில் கால/சூழ்நிலைப் பொருள் இயல்பாக இருப்பதால் அது முதன்மை உரையில் தரப்படுகிறது; உண்மையான மாற்றுப் புரிதல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: פָּקְדֵנִי என்பதன் வேண்டுதல் சார்ந்த நுண்பொருள்
  choice: என்னைக் கவனித்தருளும்
  alternative: என்னைச் சந்தித்தருளும்
  rationale: இங்கு வேண்டப்படுவது வெறும் வருகை அல்ல, மீட்பைச் செயல்படுத்தும் இறைக் கவனிப்பாகவும் இருக்கலாம். இருப்பினும் ‘சந்தித்தருளும்’ என்ற நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் மரியாதையான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது’, ‘நீர்’, ‘அருளும்’ ஆகிய வடிவங்கள் கவிதைநயத்தையும் இறைவனை நோக்கிய மரியாதையையும் காக்கின்றன; தேவையற்ற பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
