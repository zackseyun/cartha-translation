  text: וַ/יֹּ֗אמֶר לְֽ/הַשְׁמִ֫ידָ֥/ם לוּלֵ֡י מֹ֘שֶׁ֤ה בְחִיר֗/וֹ עָמַ֣ד בַּ/פֶּ֣רֶץ לְ/פָנָ֑י/ו לְ/הָשִׁ֥יב חֲ֝מָת֗/וֹ מֵֽ/הַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/023.yaml
  text: So he said he would destroy them—had not Moses[a], his chosen one, stood in the breach before him to turn back his wrath from destroying.
translation:
  language: ta
  text: எனவே, அவர் அவர்களை அழித்துவிடுவதாகக் கூறினார்—அவரால் தேர்ந்தெடுக்கப்பட்ட மோசே, அவருக்கு முன்பாக உடைப்பில்[a] நின்று, அவர்களை அழிக்கவிடாமல் அவருடைய கடுஞ்சினத்தைத் திருப்பியிருக்காவிட்டால், அவர் அவர்களை அழித்திருப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இடைவெளியில்.” எபிரேய உருவகம் உடைந்த மதிலின் திறப்பில் ஒருவர் நின்று அதைக் காப்பதைச் சுட்டுகிறது; இங்கு அது மோசேயின் பரிந்துபேசுதலைச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ஆகவே ... அவர் கூறினார்
  rationale: வாவ் தொடர்நிலை கதையின் விளைவுச் சார்ந்த முன்னேற்றத்தைக் காட்டுகிறது; ‘ஆகவே’ அதை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְהַשְׁמִידָם
  choice: அவர்களை அழித்துவிடுவதாக
  rationale: ‘கூறினார்’ என்பதுடன் வரும் לְ விகுதியுடைய வினையெச்சம் நோக்கமுள்ள செயலைக் குறிக்கிறது; ‘அழித்துவிடு’ என்பது השמיד என்பதன் தீர்ப்புச் சூழலை மிகைப்படுத்தாமல் எடுத்துரைக்கிறது.
- source_word: לוּלֵי
  choice: நின்றிராவிட்டால் ... அழித்திருப்பார்
  rationale: இது நிகழாத எதிர்நிலையை அறிமுகப்படுத்துகிறது; தமிழில் நிபந்தனையையும் அதன் மறைமுக விளைவையும் வெளிப்படையாக அமைத்தது பொருளைத் தெளிவாக்குகிறது.
- source_word: בְחִירוֹ
  choice: அவரால் தேர்ந்தெடுக்கப்பட்ட
  rationale: மோசே தேவனால் தேர்ந்தெடுக்கப்பட்டவர் என்பதைத் தெளிவாகத் தருகிறது; பிற்கால இறையியல் சொற்பயன்களை ஏற்றாமல் உள்ளது.
- source_word: עָמַד
  choice: நின்றிராவிட்டால்
  rationale: לוּלֵי உடன் எதிர்நிலை நிபந்தனையைச் சேர்ந்த ‘நின்றான்’ என்ற நேரடியான உருவகச் செயலைக் காக்கிறது.
- source_word: בַּפֶּרֶץ
  choice: மதிலின் உடைப்பில்
  rationale: உடைந்த மதிலின் திறப்பில் ஒருவர் தம்மை நிறுத்திக்கொள்ளும் எபிரேய உருவகத்தைத் தெளிவாக்க ‘மதில்’ சேர்க்கப்பட்டுள்ளது; பரிந்துபேசும் செயல் என்று மட்டும் பொழிப்புரை செய்யப்படவில்லை.
- source_word: לְפָנָיו
  choice: அவருக்கு முன்பாக
  rationale: பின்னொட்டு சூழலில் தேவனைக் குறிக்கிறது; அவருடைய முன்னிலையில் மோசே நிற்பதை நேரடியாகக் காக்கிறது.
- source_word: לְהָשִׁיב
  choice: திருப்புவதற்காக
  rationale: שוב என்பதன் ஹிஃபில் வடிவிலுள்ள ‘திரும்பச் செய்தல்’ என்ற இயக்கப்படிமத்தைத் தக்கவைக்கிறது.
- source_word: חֲמָתוֹ
  choice: அவருடைய கடுஞ்சினத்தை
  rationale: חֵמָה குறிக்கும் தீவிரமான, எரியும் சினத்தை ‘கடுஞ்சினம்’ இயல்பாகவும் கனத்துடனும் தெரிவிக்கிறது.
- source_word: מֵהַשְׁחִית
  choice: அழிவு நேராதபடி
  rationale: מִן உடனான வினையெச்சம் அழித்தலைத் தடுத்தலைக் குறிக்கிறது; தமிழில் மூலத்திலுள்ள செய்பவர் மாறுபாட்டைத் தவிர்த்து, அழிவு நிகழாமல் தடுப்பது என இயல்பாகத் தரப்பட்டுள்ளது.
theological_decisions:
- issue: தேவனுடைய தீர்ப்பைப் பற்றிய மனித உணர்வுச் சொற்படிமம்
  choice: ‘அவருடைய கடுஞ்சினம்’ என்பதைத் தக்கவைத்தல்
  alternative: ‘அவருடைய தீர்ப்பு’ என்று மென்மைப்படுத்துதல்
  rationale: மூலம் தேவனுடைய חֵמָה திருப்பப்படுவதாகத் தெளிவாகச் சொல்கிறது; அந்த இறையியல் நெருக்கடியை விளக்கி அகற்றாமல் காக்கிறது.
- issue: மோசே ‘உடைப்பில் நிற்கும்’ பரிந்துபேசும் உருவகம்
  choice: ‘மதிலின் உடைப்பில் நின்றார்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘அவர்களுக்காகப் பரிந்துபேசினார்’ என்று பொழிப்புரை செய்தல்
  rationale: மத்தியஸ்தராக மோசே செயல்படுவதை உடைந்த மதிலைக் காக்கும் concrete உருவகத்தின் வழியே வசனம் காட்டுகிறது; அதனை வெறும் கருத்தாக மாற்றவில்லை.
- issue: எதிர்நிலை நிபந்தனையில் மறைந்துள்ள விளைவு
  choice: ‘அவர் அவர்களை அழித்திருப்பார்’ என்பதைத் தமிழில் வெளிப்படுத்துதல்
  alternative: மூல வரிசையை மட்டும் பின்பற்றி விளைவைக் கூறாமல் விடுதல்
  rationale: எபிரேயத்தில் ‘அழிப்பதாகக் கூறினார்—மோசே நின்றிராவிட்டால்’ என்ற அமைப்பு விளைவை மறைமுகமாகத் தருகிறது. தமிழில் தெளிவுக்காக அதை வெளிப்படுத்துவது பொருளைத் தீர்க்காமல் இலக்கணத் தொடர்பை மட்டும் விளக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வேதாகம நடையைப் பயன்படுத்தியுள்ளது. நீண்ட எபிரேய எதிர்நிலை வாக்கியத்தை தமிழில் இரண்டு தொடர்புடைய வாக்கியங்களாக அமைத்து வாசிப்புத் தெளிவை உயர்த்தியுள்ளது; உருவகமும் தேவனுடைய கடுஞ்சினம் குறித்த இறையியல் நெருக்கடியும் காக்கப்பட்டுள்ளன.
