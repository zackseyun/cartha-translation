- from: ஆகவே, அவர்களை அழித்துவிடுவதாக அவர் கூறினார். ஆனால் அவரால் தேர்ந்தெடுக்கப்பட்ட மோசே, அழிவு நேராதபடி அவருடைய கடுஞ்சினத்தைத் திருப்புவதற்காக, அவருக்கு முன்பாக மதிலின் உடைப்பில்[a] நின்றிராவிட்டால், அவர் அவர்களை அழித்திருப்பார்.
  to: எனவே, அவர் அவர்களை அழித்துவிடுவதாகக் கூறினார்—அவரால் தேர்ந்தெடுக்கப்பட்ட மோசே, அவருக்கு முன்பாக உடைப்பில்[a] நின்று, அவர்களை அழிக்கவிடாமல் அவருடைய கடுஞ்சினத்தைத் திருப்பியிருக்காவிட்டால், அவர் அவர்களை அழித்திருப்பார்.
