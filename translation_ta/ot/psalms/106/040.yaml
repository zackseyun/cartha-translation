  yaml_path: translation/ot/psalms/106/040.yaml
  text: So Yahweh’s anger burned against his people[b][a], and he abhorred his inheritance.
translation:
  language: ta
  text: யாவேயின் கோபம் தம் மக்கள்மீது மூண்டது[a]; அவர் தம் சுதந்தரத்தை அருவருத்தார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தம் மக்களுக்கு எதிராக யாவேயின் கடுங்கோபம் பற்றியெரிந்தது.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தமக்குரிய உரிமைப் பங்கை அவர் வெறுத்தார்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: கோபம் மூண்டது
  rationale: חרה אף என்பது கோபம் சூடேறுவதையோ பற்றியெரிவதையோ குறிக்கும் எபிரேயச் சொற்றொடர். ‘கோபம் மூண்டது’ என்பது அதன் வெப்ப உருவகத்தையும் வலிமையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பட்ட உடன்படிக்கைப் பெயரைக் குறிக்கும் நான்கு எழுத்துப் பெயர்; ஆகவே தமிழில் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּעַמּוֹ
  choice: தமது மக்கள்மீது
  rationale: கோபத்தைக் குறிக்கும் வினையுடன் ב அதன் இலக்கைச் சுட்டுகிறது. ‘மக்கள்மீது’ என்பது அந்த உறவைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: וַיְתָעֵב
  choice: அருவருத்தார்
  rationale: תעב கடுமையான வெறுப்பையும் அருவருப்பையும் குறிக்கிறது. ‘அருவருத்தார்’ அந்த வலிமையைச் செம்மையான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: נַחֲלָתוֹ
  choice: தமது சுதந்தரத்தை
  rationale: נחלה என்பது ஒருவருக்குப் பங்காகக் கிடைத்த சுதந்தரத்தையோ உரிமைப் பங்கையோ குறிக்கும். இங்கு மக்களே யாவேக்கு உரிய சுதந்தரம் என்ற உடன்படிக்கைச் சித்திரத்தை இது காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுவான பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பட்ட பெயரே உள்ளது. எனவே பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: தேவகோபத்தின் வெப்ப உருவகம்
  choice: கோபம் மூண்டது
  alternative: கோபமடைந்தார்
  rationale: எபிரேயம் கோபத்தை வெப்பம் அல்லது நெருப்பு மூள்வதுபோல் சித்தரிக்கிறது. அதை வெறும் ‘கோபமடைந்தார்’ என்று தட்டையாக்காமல், உரையின் தீவிரத்தையும் இறைக் கோபத்தைப் பற்றிய அதன் நேரடியான மொழியையும் தக்கவைக்கிறது.
- issue: இஸ்ரவேலை யாவேயின் சுதந்தரமாகக் குறிப்பிடுதல்
  choice: தமது சுதந்தரம்
  alternative: தமக்குரிய மக்கள்
  rationale: மூலத்தின் உடைமை மற்றும் பங்குரிமை உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கோபம் மூண்டது’ என்ற இயல்பான சொற்றொடர் எபிரேய வெப்ப உருவகத்தைத் தக்கவைக்கிறது; ‘சுதந்தரம்’ என்பது மக்களைக் குறித்த உடன்படிக்கை உருவகத்தை விளக்கித் தீர்க்காமல் பாதுகாக்கிறது.
