    issue: 'Nonstandard dative inflection: ‘யாவேக்கு’.'
    rationale: 'For a name ending in ஏ, modern standard Tamil normally uses the oblique/linking consonant before the dative suffix: ‘யாவேவுக்கு’. This correction improves grammatical naturalness without altering the divine name or the source meaning.'
