  text: הַֽלְלוּ יָ֨הּ הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/001.yaml
  text: Praise Yah! Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: ta
  text: 'யாவைப் புகழுங்கள்![a]


    யாவேவுக்கு நன்றி செலுத்துங்கள்;


    ஏனெனில் அவர் நல்லவர்;


    அவரது மாறாத அன்பு என்றென்றும் நிலைத்திருக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் இது “ஹல்லெலூ-யா”; “யாவைப் புகழுங்கள்” என்று பொருள்படும் வழிபாட்டு முழக்கம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: புகழுங்கள்
  rationale: הלל என்பதன் பன்மை ஏவல் வடிவம். பொதுமக்களுக்கு இயல்பாகப் புரியும் நேரடியான அழைப்பாகத் தமிழில் தரப்பட்டுள்ளது.
- source_word: יָהּ
  choice: யா
  rationale: இது יהוה என்ற இறைப்பெயரின் சுருக்கமான கவிதை வடிவம். முழுப் பெயரிலிருந்து இதை வேறுபடுத்திக் காட்ட ஒலிபெயர்ப்பு செய்யப்பட்டுள்ளது.
- source_word: הוֹד֣וּ
  choice: நன்றி செலுத்துங்கள்
  rationale: சங்கீத வழிபாட்டுச் சூழலில் ידה என்பதன் Hiphil வடிவம் நன்றி செலுத்த அல்லது நன்றியுடன் துதிக்க அழைக்கிறது.
- source_word: לַ/יהוָ֣ה
  choice: யாவேக்கு
  rationale: לְ முன்னிடைச்சொல் நன்றி செலுத்தப்படுபவரைக் குறிக்கிறது; יהוה என்ற இறைப்பெயர் அதன் எபிரெய வடிவுக்கு நெருக்கமாக ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: כִּי טוֹב
  choice: ஏனெனில் அவர் நல்லவர்
  rationale: כִּי காரணத்தைக் குறிக்கிறது; טוֹב என்பது வெளிப்படையாகச் சொல்லப்படாத יהוה-வை எழுவாயாகக் கொண்ட பயனிலைப் பெயரடை.
- source_word: לְ/עוֹלָ֣ם
  choice: என்றென்றும் நிலைத்திருக்கிறது
  rationale: சொல்லுக்குச் சொல் ‘என்றென்றும்’ என்று பொருள். חסד உடன் சேரும்போது அதன் நீடித்திருக்கும் தன்மையை இயல்பான தமிழில் வெளிப்படுத்த ‘நிலைத்திருக்கிறது’ சேர்க்கப்பட்டுள்ளது.
- source_word: חַסְדּֽ/וֹ
  choice: அவரது மாறாத அன்பு
  rationale: חסד அன்பு, இரக்கம், பற்றுறுதி ஆகிய கூறுகளை உள்ளடக்கியது. ‘மாறாத அன்பு’ அதன் உறுதியான, தொடரும் தன்மையை எளிய நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறைப்பெயரை பொதுப்பட்டத்தால் மாற்றாமல், அதன் ஒலிக்கு நெருக்கமாகப் பாதுகாக்கிறது.
- issue: יָהּ என்ற சுருக்கமான இறைப்பெயர் வடிவம்
  choice: யா
  alternative: யாவே
  rationale: இந்த வழிபாட்டு முழக்கத்தில் உள்ள சுருக்க வடிவத்தையும், இதே வசனத்தில் பின்னர் வரும் முழு வடிவமான יהוה-வையும் வேறுபடுத்திக் காட்டுகிறது.
- issue: חסד என்பதன் பொருள்
  choice: மாறாத அன்பு
  alternative: உறுதியான அன்பு; இரக்கம்
  rationale: ஒரே குறிப்பிட்ட உடன்படிக்கை விளக்கத்தைத் திணிக்காமல், அன்பும் நீடித்த பற்றுறுதியும் சேர்ந்த மூலச்சொல்லின் பொருள் பரப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், வழிபாட்டுக்குரிய கண்ணியத்துடனும் எபிரெயக் கவிதையின் இணை அமைப்புடனும் வடிவமைக்கப்பட்டது. ‘யா’ மற்றும் ‘யாவே’ என்ற இரு தொடர்புடைய இறைப்பெயர் வடிவங்களின் வேறுபாடு பாதுகாக்கப்பட்டுள்ளது.
