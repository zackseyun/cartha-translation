revisions:
- from: அவர்கள் தங்கள் சிலைகளைச் சேவித்தார்கள்; அவை அவர்களுக்குக் கண்ணியாகின.[a]
  to: அவர்கள் தங்கள் விக்கிரகங்களை வழிபட்டார்கள்; அவை அவர்களுக்குக் கண்ணியாகின.[a]
  rationale: The revision maintains the Hebrew clause structure, plural referent, and metaphor while replacing an awkwardly literal Tamil expression with the normal idiom for idol worship. The footnote preserves the lexical ‘served’ alternative and the ‘trap’ alternative without changing the main translation’s meaning.
