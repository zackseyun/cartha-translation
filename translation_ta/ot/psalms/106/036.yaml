review_pass:
  verdict: revise
  source_fidelity: The draft correctly takes עֲצַבֵּיהֶם as the objects of devotion and understands the plural subject of וַיִּהְיוּ as the idols, which became a snare to the people. However, ‘சிலைகளைச் சேவித்தார்கள்’ is an overly literal and unnatural Tamil collocation for religious devotion, and ‘சிலைகள்’ can readily denote non-cultic statues.
  naturalness: ‘விக்கிரகங்களை வழிபட்டார்கள்’ is idiomatic, clear modern standard Tamil in this polemical religious context. ‘அவை அவர்களுக்குக் கண்ணியாகின’ is concise and naturally preserves the resultative force of the Hebrew.
  terminology: ‘விக்கிரகங்கள்’ appropriately identifies cultic idols without adding theological explanation. ‘வழிபட்டார்கள்’ is the natural Tamil equivalent for religious service here; the more formally literal alternative ‘சேவித்தார்கள்’ can be retained in a footnote. ‘கண்ணி’ accurately conveys מוֹקֵשׁ.
  issues:
  - severity: medium
    issue: ‘சிலைகளைச் சேவித்தார்கள்’ is not idiomatic Tamil for worship of idols.
    rationale: Although it reflects the lexical sense of עבד, it can sound as though the people performed ordinary service for physical statues. Tamil normally uses ‘வழிபட்டார்கள்’ for this religious act.
  - severity: low
    issue: ‘சிலைகள்’ is potentially broader than the source-contextual sense of cultic idols.
    rationale: In modern Tamil, ‘சிலை’ can refer simply to a statue. ‘விக்கிரகம்’ more clearly communicates the referent intended by עֲצַבִּים in this context.
  revised_text: அவர்கள் தங்கள் விக்கிரகங்களை வழிபட்டார்கள்; அவை அவர்களுக்குக் கண்ணியாகின.[a]
