id: PSA.106.36
reference: Psalms 106:36
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יַּעַבְד֥וּ אֶת עֲצַבֵּי/הֶ֑ם וַ/יִּהְי֖וּ לָ/הֶ֣ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/036.yaml
  text: They served their idols[a], and they became a snare to them.
translation:
  language: ta
  text: அவர்கள் தங்கள் விக்கிரகங்களை வழிபட்டார்கள்; அவை அவர்களுக்குக் கண்ணியாகின.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கள் விக்கிரகங்களைச் சேவித்தார்கள்; அவை அவர்களுக்குப் பொறியாகின.”
    reason: ‘வழிபட்டார்கள்’ என்பதற்குப் பொருத்தமான, மூல வினையின் சொல்லளவிலான மாற்றாக ‘சேவித்தார்கள்’ என்றும், ‘கண்ணி’ என்பதற்கு ‘பொறி’ என்றும் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: சேவித்தார்கள்
  rationale: עבד என்பதன் கால் வடிவம் இங்கு பொய்த் தெய்வங்களுக்குச் செய்யப்படும் மதச்சார்ந்த பணிவிடையைக் குறிக்கிறது. ‘சேவித்தார்கள்’ என்பது மூல வினையின் அடிப்படைப் பொருளைப் பாதுகாக்கிறது; ‘வழிபட்டார்கள்’ என்பது இயல்பான மாற்றாக இருந்தாலும் சற்றுக் கூடுதல் விளக்கமுடையது.
- source_word: עֲצַבֵּיהֶם
  choice: தங்கள் சிலைகளை
  rationale: עֲצַבִּים என்பது இச்சூழலில் வழிபாட்டுக்குரிய பொய்த் தெய்வச் சிலைகளைக் குறிக்கிறது. நவீன தமிழில் ‘சிலைகள்’ என்பது பொருளைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: וַיִּהְיוּ
  choice: அவை ... கண்ணியாகின
  rationale: 'היה இங்கு לְמוֹקֵשׁ என்பதுடன் விளைவைக் காட்டுகிறது: அந்தச் சிலைகள் அவர்களை அகப்படுத்தும் ஒன்றாக மாறின. ‘ஆகின’ அந்த விளைவுப் பொருளைத் தக்கவைக்கிறது.'
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: לְ என்ற முன்னொட்டு இங்கு பாதிக்கப்படுகிறவர்களுடனான உறவைச் சுட்டுகிறது; தமிழில் ‘அவர்களுக்குக் கண்ணியாகின’ என்பது இயல்பான அமைப்பு.
- source_word: לְמוֹקֵשׁ
  choice: கண்ணி
  rationale: מוֹקֵשׁ என்பது பிடிப்பதற்கான பொறி அல்லது கண்ணியையும், உருவகமாக ஆவிக்குரிய அல்லது ஒழுக்கநெறிசார் அகப்படுத்துதலையும் குறிக்கிறது. ‘கண்ணி’ இவ்விரு அடுக்குகளையும் சுருக்கமாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அவை அவர்களுக்குக் கண்ணியாகின’ என்பதில் ‘அவை’ என்பதன் குறிப்பு
  choice: ‘அவை’ என்பது மக்கள் சேவித்த சிலைகளைக் குறிக்கிறது.
  alternative: சிலைகளைச் சேவித்த செயல் அவர்களுக்குக் கண்ணியானது.
  rationale: எபிரெய வாக்கியத்தில் மிக அருகிலுள்ள இயல்பான முன்னிலைச் சொல் பன்மையிலுள்ள ‘அவர்களுடைய சிலைகள்’ என்பதே. தமிழில் ‘அவை’ என்று வெளிப்படையாகக் கொடுப்பது இந்த இலக்கணத் தொடர்பைத் தெளிவாக்குகிறது; அதேவேளை சிலைகள் எவ்வாறு கண்ணியானது என்பதை விளக்கிச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான சங்கீத நடையையும் மூலத்தின் இரண்டு இணை வாக்கியங்களையும் காக்கும் கண்ணியமான மொழிநடை பயன்படுத்தப்பட்டுள்ளது. அடிக்குறிப்பு குறி பிரதான உரையில் சேர்க்கப்பட்டுள்ளது.
