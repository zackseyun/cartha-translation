  text: אֲב֘וֹתֵ֤י/נוּ בְ/מִצְרַ֨יִם לֹא הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗י/ךָ לֹ֣א זָ֭כְרוּ אֶת רֹ֣ב חֲסָדֶ֑י/ךָ וַ/יַּמְר֖וּ עַל יָ֣ם בְּ/יַם סֽוּף׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/007.yaml
  text: Our fathers in Egypt did not understand your wondrous deeds[a]; they did not remember the abundance of your steadfast love[b], but rebelled at the sea—the Red Sea.
translation:
  language: ta
  text: எகிப்தில் இருந்த எங்கள் தந்தையர் உமது வியத்தகு செயல்களைப் புரிந்துகொள்ளவில்லை; உமது மாறாத அன்பின் மிகுதியை அவர்கள் நினைவுகூரவில்லை; மாறாக, கடலருகே—செங்கடலருகே[a]—கலகம் செய்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாணல் கடல்.” יַם סוּף (யாம் சூஃப்) என்பது மரபாக “செங்கடல்” என்று மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבוֹתֵינוּ
  choice: எங்கள் தந்தையர்
  rationale: எபிரெயச் சொல் நேரடியாக ‘எங்கள் தந்தையர்’ என்று பொருள்பட்டு, இஸ்ரவேலின் முந்தைய தலைமுறையினரைக் கூட்டாகக் குறிக்கிறது.
- source_word: הִשְׂכִּילוּ
  choice: புரிந்துகொள்ளவில்லை
  rationale: שׂכל என்பதன் Hiphil வடிவம் அறிவோடு உணர்தல் அல்லது உட்பொருளைப் புரிந்துகொள்ளுதல் என்ற கருத்தைத் தருகிறது; இங்கு தேவனுடைய செயல்களின் முக்கியத்துவத்தை அவர்கள் உணரத் தவறியதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נִפְלְאוֹתֶיךָ
  choice: உமது வியத்தகு செயல்கள்
  rationale: இந்தப் பெயர்ச்சொல் வியப்பூட்டும் அசாதாரண செயல்களைக் குறிக்கிறது; ‘செயல்கள்’ என்பது வெறும் காட்சிகளாக அல்லாமல் தேவனுடைய செயல்பாடுகளாக அவற்றைத் தெளிவுபடுத்துகிறது.
- source_word: רֹב חֲסָדֶיךָ
  choice: உமது மாறாத அன்பின் மிகுதி
  rationale: רֹב மிகுதி அல்லது பெருக்கத்தையும், חֶסֶד உறுதியான, விசுவாசமுள்ள அன்பையும் குறிக்கிறது. ‘மாறாத அன்பு’ அதன் நிலைத்த தன்மையை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: וַיַּמְרוּ
  choice: மாறாக, ... கலகம் செய்தார்கள்
  rationale: מרה என்பது கலகம் செய்தல் அல்லது கீழ்ப்படிய மறுத்தல். முன் கூறப்பட்ட தேவசெயல்களுக்கும் அன்புக்கும் எதிரான அவர்களுடைய பதிலை ‘மாறாக’ வெளிப்படுத்துகிறது.
- source_word: עַל יָם בְּיַם סוּף
  choice: கடலருகே—செங்கடலருகே
  rationale: இரு இடக்குறிப்புகளும் இரண்டாவது சொற்றொடர் முதலாவதை விளக்கும் வகையில் அமைந்துள்ளன. கோடு அந்த விளக்க உறவைத் தெளிவாக்குகிறது; ‘செங்கடல்’ பரவலாக அறியப்பட்ட இடப்பெயர்.
theological_decisions:
- issue: חֶסֶד என்பதன் மொழிபெயர்ப்பு
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கைப் பேரன்பு; இரக்கம்; உண்மையுள்ள அன்பு
  rationale: இச்சொல் தேவனுடைய உறுதியான, விசுவாசமுள்ள நன்மையை உள்ளடக்குகிறது. ‘மாறாத அன்பு’ அதன் நீடித்த தன்மையைப் பாதுகாக்கிறது; ஆனால் மூலத்தில் வெளிப்படையாக இல்லாத ‘உடன்படிக்கை’ என்ற சொல்லை உரைக்குள் சேர்ப்பதில்லை.
- issue: יַם סוּף என்ற இடப்பெயர்
  choice: செங்கடல்
  alternative: நாணல் கடல்
  rationale: ‘செங்கடல்’ என்பது தமிழில் பரவலாக அறியப்பட்ட மரபுவழி இடப்பெயர். סוּף என்பதன் சொற்பொருள் நாணல் அல்லது நீர்ச்செடியைச் சுட்டக்கூடும் என்பதால் அந்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. இறைவனை நோக்கிய இரண்டாம் நபர் வடிவமாக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. எபிரெய உரையின் இணை அமைப்பும், எதிர்மறைத் திருப்பமும், கடல் குறித்த விளக்க மறுபெயரிடலும் காக்கப்பட்டுள்ளன.
