  text: וַ/יַּאֲמִ֥ינוּ בִ/דְבָרָ֑י/ו יָ֝שִׁ֗ירוּ תְּהִלָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/012.yaml
  text: Then they believed his words[a]; they sang his praise.
translation:
  language: ta
  text: அப்போது அவர்கள் அவருடைய வார்த்தைகளை நம்பினார்கள்[a]; அவரைப் புகழ்ந்து பாடினார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் அவருடைய வார்த்தைகளை நம்பினார்கள்.’ எபிரெயக் கதைத் தொடர் வடிவத்தை இணைப்புச் சொல் இல்லாமலும், நிகழ்வின் வரிசையைத் தெளிவாக்கும் ‘அப்போது’ என்பதுடனும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: அப்போது அவர்கள் நம்பினார்கள்
  rationale: אמן என்பதன் ஹிஃபில் வடிவம் இங்கு நம்பிக்கை வைப்பதைக் குறிக்கிறது. வாவ் இணைந்த தொடர் வினைவடிவம் நிகழ்வுகளின் தொடர்ச்சியை முன்னெடுப்பதால், இயல்பான தமிழில் ‘அப்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בִדְבָרָיו
  choice: அவருடைய வார்த்தைகளை
  rationale: דבר என்பது மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமைப் பின்னொட்டுடன் பன்மையில் இருப்பதால், அதன் பன்மை வடிவத்தைத் தக்கவைத்து ‘அவருடைய வார்த்தைகளை’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יָשִׁירוּ
  choice: பாடினார்கள்
  rationale: முந்தைய தொடர் வினைக்குப் பின் வரும் இந்தக் கால் முற்றுப்பெறா வடிவம் கதைத் தொடரில் கடந்த நிகழ்வாகச் செயல்படுவதால், தமிழில் இறந்தகாலமாக மொழிபெயர்க்கப்பட்டது.
- source_word: תְּהִלָּתוֹ
  choice: அவரைப் புகழ்ந்து
  rationale: תְּהִלָּה என்பதன் பொருள் ‘புகழ்’; மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு அந்தப் புகழ் அவருக்குரியது என்பதைக் காட்டுகிறது. ‘அவருடைய புகழைப் பாடினார்கள்’ என்பதைவிட ‘அவரைப் புகழ்ந்து பாடினார்கள்’ என்பது அதே கருத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
