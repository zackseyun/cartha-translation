  source_fidelity: வַיַּאֲמִינוּ என்பதன் கதைத் தொடர்ச்சியை ‘அப்போது’ இயல்பாக வெளிப்படுத்துகிறது; ‘அவருடைய வார்த்தைகளை நம்பினார்கள்’ என்பது பன்மை உடைமை வடிவான בִּדְבָרָיו-க்கு துல்லியமானது. யָשִׁירוּ கதைச்சூழலுக்கு ஏற்ப இறந்தகால ‘பாடினார்கள்’ எனச் சரியாக வழங்கப்பட்டுள்ளது. ‘அவரைப் புகழ்ந்து பாடினார்கள்’ என்பது תְּהִלָּתוֹ (‘அவருடைய புகழ்’) என்ற பொருளைத் தமிழில் இயல்பாகவும் பொருளிழப்பின்றியும் தருகிறது.
