  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘அவரைப் புகழ்ந்து பாடினார்கள்’ என்பது இயல்பான தமிழ் வழக்கைத் தக்கவைத்தபடியே எபிரெயச் சொல்லின் கருத்தை வெளிப்படுத்துகிறது.
