- from: அவர்கள் குற்றமற்ற இரத்தத்தைச் சிந்தினார்கள்[a]—கானானின் சிலைகளுக்குப் பலியிட்ட தங்கள் மகன்கள், மகள்களின் இரத்தத்தையே சிந்தினார்கள். அதனால் அந்த நாடு இரத்தத்தால்[b] தீட்டுப்பட்டது[c].
