- issue: பலியிடப்பட்ட பிள்ளைகளின் அறநெறி நிலை
  choice: அவர்களின் கொலை ‘குற்றமற்ற இரத்தத்தைச் சிந்துதல்’ என்று வெளிப்படையாகக் கண்டிக்கப்படுகிறது.
  alternative: ‘குற்றமற்றவர்களின் இரத்தம்’ என்று மொழிபெயர்த்தல்.
  rationale: דָם נָקִי என்ற மூலச்சொற்றொடரின் அறநெறித் தீர்ப்பை எந்த மேலதிக கோட்பாட்டு விளக்கமும் சேர்க்காமல் நேரடியாகப் பாதுகாக்கிறது.
- issue: இரத்தத்தால் நாட்டிற்கு ஏற்பட்ட மாசு
  choice: அந்த நாடு இரத்தத்தால் தீட்டுப்பட்டதாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: அந்த நாடு இரத்தப்பழியால் தீட்டுப்பட்டது.
  rationale: בַּדָּמִים என்பது இரத்தம், இரத்தச்சிந்துதல், இரத்தப்பழி ஆகியவற்றின் பொருள் எல்லையைத் தாங்குகிறது. முதன்மை மொழிபெயர்ப்பு மூலத்தின் திரும்பத் திரும்ப வரும் ‘இரத்தம்’ என்ற சொல்லைத் தக்கவைத்து, ‘இரத்தப்பழி’ என்ற சாத்தியத்தை அடிக்குறிப்பில் பாதுகாக்கிறது.
