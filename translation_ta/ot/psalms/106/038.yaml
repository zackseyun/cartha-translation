  text: וַ/יִּֽשְׁפְּכ֨וּ דָ֪ם נָקִ֡י דַּם בְּנֵ֘י/הֶ֤ם וּֽ/בְנוֹתֵי/הֶ֗ם אֲשֶׁ֣ר זִ֭בְּחוּ לַ/עֲצַבֵּ֣י כְנָ֑עַן וַ/תֶּחֱנַ֥ף הָ֝/אָ֗רֶץ בַּ/דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/038.yaml
  text: They poured out innocent blood—the blood of their sons and daughters[c][b][a], whom they sacrificed to the idols of Canaan—and the land was polluted with blood.
translation:
  language: ta
  text: அவர்கள் குற்றமற்ற இரத்தத்தைச் சிந்தினார்கள்[a]—அது கானானின் சிலைகளுக்குப் பலியிட்ட தங்கள் மகன்கள் மகள்களின் இரத்தம். அந்த நிலம் இரத்தத்தால்[b] தீட்டுப்பட்டது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்குச் சொல்: ‘இரத்தத்தை ஊற்றினார்கள்.’'
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘இரத்தங்கள்’ என்ற பன்மை வடிவம் உள்ளது; இது இரத்தச்சிந்துதலையோ இரத்தப்பழியையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அந்த நிலம் இரத்தப்பழியால் தீட்டுப்பட்டது.’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁפְּכוּ
  choice: சிந்தினார்கள்
  rationale: שׁפך என்பதன் அடிப்படைப் பொருள் ‘ஊற்று’ என்பதாக இருந்தாலும், இரத்தத்துடன் வரும்போது வன்முறையாகக் கொல்வதைக் குறிக்கிறது. ‘இரத்தத்தைச் சிந்தினார்கள்’ என்பது நவீனத் தமிழில் இயல்பாகவும் மூலத்தின் வன்மையான படிமத்தைத் தக்கவைத்தும் உள்ளது.
- source_word: דָם נָקִי
  choice: குற்றமற்ற இரத்தம்
  rationale: இந்த எபிரெயச் சொற்றொடர் அநியாயமாகக் கொல்லப்பட்டவர்களின் இரத்தத்தைக் குறிக்கிறது. ‘குற்றமற்ற இரத்தம்’ அதன் அறநெறித் தீர்ப்பைத் தெளிவாகக் காக்கிறது.
- source_word: דַּם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: தங்கள் மகன்கள், மகள்களின் இரத்தம்
  rationale: முந்தைய ‘குற்றமற்ற இரத்தம்’ யாருடையது என்பதை விளக்கும் மறுகூற்றைத் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: אֲשֶׁר זִבְּחוּ
  choice: பலியிட்ட
  rationale: זבח இங்கு வழிபாட்டுச் சூழலில் பலியாகக் கொடுப்பதைக் குறிக்கிறது; தொடர்புச் சொற்றொடர் மகன்களையும் மகள்களையும் குறிக்குமாறு இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: לַעֲצַבֵּי כְנָעַן
  choice: கானானின் சிலைகளுக்கு
  rationale: עֲצַבִּים வழிபாட்டுக்குரிய பொய்த் தெய்வச் சிலைகளைக் குறிக்கும் இழிவுச் சாயலுடைய சொல். ‘சிலைகள்’ மூலத்தின் காட்சியையும் எதிர்மறை மதிப்பீட்டையும் மிகைப்படுத்தாமல் தருகிறது.
- source_word: וַתֶּחֱנַף
  choice: தீட்டுப்பட்டது
  rationale: இரத்தப்பழியால் நாட்டிற்கு ஏற்படும் அறநெறி மற்றும் வழிபாட்டு மாசை இந்த வினை குறிக்கிறது. ‘தீட்டுப்பட்டது’ அந்தக் கருத்தைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
- source_word: הָאָרֶץ
  choice: அந்த நாடு
  rationale: சூழலில் உலகம் முழுவதையும் அல்ல, கானானுடன் தொடர்புடைய குறிப்பிட்ட நிலப்பரப்பைக் குறிக்கிறது. தமிழில் ‘அந்த நாடு’ இந்தச் சூழல்சார் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּדָּמִים
  choice: இரத்தத்தால்
  rationale: எபிரெயத்தில் ‘இரத்தங்கள்’ என்ற பன்மை வடிவம் உள்ளது; அது சிந்தப்பட்ட இரத்தம், இரத்தச்சிந்துதல் அல்லது இரத்தப்பழி ஆகிய நெருங்கிய கருத்துகளைத் தாங்கலாம். முதன்மை உரை தெளிவான நேரடிப் பொருளை வைத்திருக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
