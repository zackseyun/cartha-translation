source:
  edition: WLC
  text: וַ/תִּבְעַר אֵ֥שׁ בַּ/עֲדָתָ֑/ם לֶ֝הָבָ֗ה תְּלַהֵ֥ט רְשָׁעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/018.yaml
  text: And fire burned among their company[c][b][a]; a flame consumed the wicked.
translation:
  language: ta
  text: அவர்களுடைய கூட்டத்தின் நடுவே நெருப்பு பற்றியெரிந்தது[a][b]; தீச்சுடர் பொல்லாதவர்களை எரித்தழித்தது[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நெருப்பு மூண்டது’; எபிரெய வினை நெருப்பு பற்றுவதையோ திடீரென மூள்வதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுடைய சபைக்குள்’; எபிரெயச் சொல் ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘பொல்லாதவர்களைச் சுட்டெரித்தது’; எபிரெய வினை தீவிரமான, அழிவுண்டாக்கும் எரிப்பைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְעַר
  choice: பற்றியெரிந்தது
  rationale: בער என்ற வினை நெருப்பு பற்றுவதையும் தொடர்ந்து எரிவதையும் குறிக்கலாம். ‘பற்றியெரிந்தது’ என்பது இரு நுணுக்கங்களையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: இச்சொல்லின் அடிப்படை, நேரடியான பொருள் ‘நெருப்பு’; சூழலும் வரலாற்றுத் தீர்ப்பை நினைவுகூர்கிறது.
- source_word: בַּעֲדָתָם
  choice: அவர்களுடைய கூட்டத்தின் நடுவே
  rationale: עֵדָה என்பது ஒன்றுகூடிய சமூகத்தைக் குறிக்கிறது. בְּ முன்னொட்டு இங்கு அந்தக் கூட்டத்திற்குள் நெருப்பு ஏற்பட்டதைச் சுட்டுவதால் ‘நடுவே’ இயல்பாக உள்ளது.
- source_word: לֶהָבָה
  choice: தீச்சுடர்
  rationale: இது சுடர் அல்லது கொழுந்தைக் குறிக்கிறது; ‘தீச்சுடர்’ முதல் அடியின் ‘நெருப்பு’ என்பதுடன் உள்ள கவிதை இணைப்பைப் பேணுகிறது.
- source_word: תְּלַהֵט
  choice: எரித்தழித்தது
  rationale: להט என்பதன் தீவிர வடிவம் கடுமையாக, அழிவுண்டாக்கும் விதத்தில் எரிப்பதைச் சுட்டுகிறது. ‘எரித்தழித்தது’ அந்த வலிமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்களை
  rationale: இது ஒழுக்கரீதியாகத் தீயவர்களைக் குறிக்கும் பெயரடைசார் பன்மைப் பெயர். ‘பொல்லாதவர்கள்’ பாலினத்தைச் சேர்க்காமல் அந்த மதிப்பீட்டைப் பேணுகிறது.
theological_decisions:
- issue: தீர்ப்பைக் குறிக்கும் நெருப்பின் பொருள்
  choice: இஸ்ரவேலின் கூட்டத்திலிருந்த பொல்லாதவர்கள்மீது நிகழ்ந்த நேரடியான நெருப்புத் தீர்ப்பாக மொழிபெயர்க்கப்பட்டது.
  alternative: தெய்வீகத் தீர்ப்புக்கான பொதுவான உருவகமாக மட்டும் புரிந்துகொள்வது.
  rationale: சங்கீதம் 106-ன் உடனடிச் சூழல் வரலாற்றுக் கலகங்களையும் அவற்றின்மேல் வந்த தீர்ப்புகளையும் நினைவுகூர்கிறது. எபிரெய உரை சாதாரண நெருப்பு சார்ந்த சொற்களைப் பயன்படுத்துவதால் உருவகமாக மாற்றாமல் அதன் நேரடித் தன்மை பேணப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதாகவும் சங்கீதக் கவிதைக்கேற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘கூட்டம்’, ‘நடுவே’, ‘தீச்சுடர்’ ஆகிய சொற்கள் இயல்புத்தன்மையையும் எபிரெயக் கவிதை இணைப்பையும் சமநிலைப்படுத்துகின்றன.
