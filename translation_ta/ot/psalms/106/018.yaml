  source_fidelity: 'மூல எபிரெயத்தின் இரண்டு கவிதை அடிகளும் துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன: நெருப்பு அவர்களுடைய கூடிவந்த குழுவிற்குள் பற்றியெரிந்தது; தீச்சுடர் பொல்லாதவர்களை அழிவுறும் வகையில் எரித்தது. ‘பற்றியெரிந்தது’ בער வினையின் பற்றுதல்/எரிதல் நுணுக்கத்தை இயல்பாகக் காக்கிறது; ‘எரித்தழித்தது’ להט வினையின் தீவிரமான எரிப்பைச் சூழலுக்கு ஏற்றவாறு வெளிப்படுத்துகிறது.'
