  yaml_path: translation/ot/psalms/106/033.yaml
  text: For they embittered his spirit[b][a], and he spoke rashly with his lips.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் அவருடைய மனதை எரிச்சலடையச் செய்தார்கள்[a][b]; அவரோ தம் உதடுகளால் அவசரமாகப் பேசினார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவருடைய ஆவிக்கு எதிராகக் கலகம் செய்தார்கள்’ அல்லது ‘அவருடைய ஆவியைத் தூண்டிவிட்டார்கள்’; எபிரெய வினை கலகம் செய்தல் அல்லது தூண்டிவிடுதல் என்ற பொருளைக் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, மெரிபாவில் மோசே அவசரமாகப் பேசினார்; எண்ணாகமம் 20:10–12-ஐ ஒப்பிடுக.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லின் விளக்கத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הִמְרוּ
  choice: கசப்படையச் செய்தார்கள்
  rationale: மரா என்ற வினையின் ஹிஃபில் வடிவம் கசப்புறச் செய்தல் அல்லது தூண்டிவிடுதல் என்ற பொருளைக் கொள்ளலாம். ‘உள்ளம்’ நேரடிச் செயப்படுபொருளாக இருப்பதால், காரணவினைப் பொருளை இத்தேர்வு தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֶת רוּחוֹ
  choice: அவருடைய உள்ளத்தை
  rationale: இங்கு רוּחַ என்பது பரிசுத்த ஆவியைக் குறிக்காமல் மோசேயின் அகநிலையைக் குறிக்கிறது. ‘உள்ளம்’ என்பது தவறான தெய்வீகச் சுட்டைத் தவிர்த்து, இச்சூழலில் இயல்பான நவீனத் தமிழாக அமைகிறது.
- source_word: וַיְבַטֵּא
  choice: அவசரப்பட்டுப் பேசினார்
  rationale: இவ்வினை பேசுதல் அல்லது உதிர்த்தல் என்பதைக் குறிக்கிறது; மெரிபாவில் நிகழ்ந்த தவறைச் சுட்டும் சூழல், யோசனையின்றி அல்லது உணர்ச்சிவசப்பட்டுப் பேசிய எதிர்மறை நுண்பொருளை அளிக்கிறது.
- source_word: בִּשְׂפָתָיו
  choice: தம் உதடுகளால்
  rationale: எபிரெய மொழியின் உடல் உறுப்பை மையப்படுத்திய பேச்சுப் படிமத்தைத் தமிழிலும் தக்கவைக்கிறது; எழுவாய் மோசே என்பதால் ‘தம்’ இயல்பாக உள்ளது.
theological_decisions:
- issue: ‘அவருடைய உள்ளம்’, ‘தம் உதடுகள்’ என்பவற்றின் சுட்டுப்பொருள்
  choice: இரு சுட்டுகளும் மோசேயைக் குறிக்கின்றன.
  alternative: அவை மக்களைக் கூட்டாகவோ வேறொரு முன்னிலையையோ குறிக்கலாம்.
  rationale: 'சங்கீதம் 106:32–33 மெரிபா நிகழ்வை விவரிக்கிறது: மக்கள் மோசேயைத் தூண்டியதால் அவர் அவசரப்பட்டுப் பேசினார். இது எண்ணாகமம் 20:10–12 உடன் பொருந்துகிறது; இங்கு பரிசுத்த ஆவியைச் சுட்டுவதாக வாசிப்பதற்கு சூழல் ஆதாரமளிக்கவில்லை.'
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘ஆவி’ என மொழிபெயர்த்தால் பரிசுத்த ஆவி என்ற தவறான எண்ணம் ஏற்படக்கூடும் என்பதால், இச்சூழலில் மனித அகநிலையைக் குறிக்கும் ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது. ‘உதடுகளால்’ என்ற சொல் மூலத்தின் தெளிவான படிமத்தைப் பாதுகாக்கிறது.
