translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்தின் கவிதை இணைநிலையைத் தக்கவைக்கும் கண்ணியமான நடை. இரு அரையடிகளிலும் மூலத்தில் வெளிப்படையாக இல்லாத செய்பவரும் வினையும் சூழலின் அடிப்படையில் தமிழின் தெளிவுக்காக ‘அவர் செய்த’ என நிரப்பப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
