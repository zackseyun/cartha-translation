lexical_decisions:
- source_word: נִפְלָאוֹת
  choice: அதிசயங்கள்
  rationale: פלא என்பதிலிருந்து வந்த பன்மை வடிவம் வியப்பூட்டும் அசாதாரண செயல்களைக் குறிக்கிறது; இயல்பான தமிழில் கவிதைநயத்துடன் இதை எடுத்துரைக்கிறது.
- source_word: בְּאֶרֶץ
  choice: நாட்டில்
  rationale: ב முன்னொட்டுடன் வரும் אֶרֶץ இங்கு இடத்தைக் குறிக்கிறது; ‘நாட்டில்’ என்பது சுருக்கமான, இயல்பான தமிழ்.
- source_word: חָם
  choice: காம்
  rationale: எபிரெய மூலத்தில் உள்ள இயற்பெயரைத் தக்கவைக்கிறது; இச்சூழலில் அது எகிப்தைக் குறிக்கும் என்பது அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: נ֝וֹרָאוֹת
  choice: அச்சமூட்டும் செயல்கள்
  rationale: ירא வேரிலிருந்து வந்த இச்சொல் பயபக்தியும் பேரச்சமும் எழுப்பும் செயல்களைக் குறிக்கிறது; ‘பயங்கரமானவை’ என்பதில் தோன்றக்கூடிய தீமை சார்ந்த தவறான பொருளை இது தவிர்க்கிறது.
- source_word: עַל
  choice: அருகே
  rationale: நீர்நிலையுடன் வரும் עַל இங்கு ‘அருகில்/அண்டையில்’ என்ற இடப்பொருளைக் கொள்ளலாம்; தமிழில் ‘அருகே’ இயல்பாக உள்ளது.
- source_word: יַם סוּף
  choice: செங்கடல்
  rationale: பாரம்பரியமாகவும் பரவலாகவும் அறியப்பட்ட பெயர் முதன்மை உரையில் வைக்கப்படுகிறது; ‘நாணற்கடல்’ என்ற சாத்தியமான நேரடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
