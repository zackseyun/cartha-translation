  yaml_path: translation/ot/psalms/106/031.yaml
  text: And it was counted to him as righteousness from generation to generation forever[a][b].
translation:
  language: ta
  text: அது அவனுக்கு நீதியாகக் கணக்கிடப்பட்டது; தலைமுறை தலைமுறையாக என்றென்றும்.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கணக்கிடப்பட்டது” என்பதற்கு “கருதப்பட்டது” அல்லது “மதிக்கப்பட்டது” என்றும் மொழிபெயர்க்கலாம். எபிரெயத்தில், ஒன்றை நீதியாகக் கருதுவதைக் குறிக்கும் வழக்கமான சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: சொற்படி, “தலைமுறைக்கும் தலைமுறைக்கும்”; இது எல்லாத் தலைமுறைகளிலும் தொடர்வதைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּחָשֶׁב
  choice: கணக்கிடப்பட்டது
  rationale: נפעל வடிவின் ‘எண்ணப்பட்டது / மதிக்கப்பட்டது’ என்ற பொருளைத் தக்கவைக்கிறது. தமிழில் ‘கணக்கிடப்பட்டது’ என்பது கணக்கு அல்லது மதிப்பீட்டு நுண்ணுணர்வை வெளிப்படுத்துகிறது; ‘கருதப்பட்டது’ என்பதும் சாத்தியம்.
- source_word: לוֹ
  choice: அவனுக்கு
  rationale: ל முன்னொட்டுடன் கூடிய மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு, அது யாருக்கு நீதியாகக் கணக்கிடப்பட்டது என்பதைக் குறிக்கிறது.
- source_word: לִצְדָקָה
  choice: நீதியாக
  rationale: חשב + ל என்ற எபிரெயச் சொற்றொடரின் மதிப்பீட்டு உறவை இயல்பான தமிழில் காட்டுகிறது. இதை ‘நீதியான செயலாக’ எனக் குறுக்காமல், צְדָקָה என்பதன் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לְדֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: ‘தலைமுறைக்கும் தலைமுறைக்கும்’ என்ற சொற்படி அமைப்பை இயல்பான தமிழ் மரபுத்தொடராக வழங்கி, அடுத்தடுத்த எல்லாத் தலைமுறைகளையும் குறிக்கிறது.
- source_word: עַד עוֹלָם
  choice: என்றென்றும்
  rationale: ‘என்றும் வரையிலும் / நிலையாக’ என்ற கால நீட்சியை இயல்பான, கவிதைநயமுள்ள தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ஆதியாகமம் 15:6-இன் ‘நீதியாகக் கணக்கிடுதல்’ என்ற சொல்லாட்சியுடனான தொடர்பு
  choice: ‘அவனுக்கு நீதியாகக் கணக்கிடப்பட்டது’ என்ற சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: ‘அது அவனுடைய நீதியான செயலாகக் கருதப்பட்டது’
  rationale: எபிரெய உரையிலுள்ள கணக்கிடுதல்/மதிப்பிடுதல் என்ற இறையியல் ஒலிப்பைத் தக்கவைத்து, அந்தச் செயல் மட்டும் நீதியானது என்ற குறுகிய விளக்கத்தையோ பிற்கால கோட்பாட்டு விரிவாக்கத்தையோ உரைக்குள் சேர்க்கவில்லை.
- issue: நீடிக்கும் பொருள் எது என்பதில் உள்ள மறைமுகத் தன்மை
  choice: தமிழில் பொருள் நிறைவுக்காக ‘அவ்வாறே இருக்கும்’ என வெளிப்படுத்துதல்
  alternative: ‘தலைமுறை தலைமுறையாக என்றென்றும்’ என வினையில்லாமல் நேரடியாக நிறுத்துதல்
  rationale: எபிரெயத்தில் காலச் சொற்றொடர், கணக்கிடப்பட்ட நீதியின் நிலையான செல்லுபடியைச் சுருக்கமாகத் தொடர்கிறது. இயல்பான தமிழுக்காகக் குறைந்த அளவு வெளிப்படுத்தப்பட்டாலும், புதிய இறையியல் உள்ளடக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீதியாகக் கணக்கிடப்பட்டது’ என்ற வேதாகமச் சொல்லாட்சி, மூலத்தின் மதிப்பீட்டு நுண்ணுணர்வையும் இறையியல் எதிரொலியையும் காக்கிறது.
