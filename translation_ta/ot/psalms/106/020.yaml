source:
  edition: WLC
  text: וַ/יָּמִ֥ירוּ אֶת כְּבוֹדָ֑/ם בְּ/תַבְנִ֥ית שׁ֝֗וֹר אֹכֵ֥ל עֵֽשֶׂב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/020.yaml
  text: They exchanged their glory for the image of an ox that eats grass[a][b].
translation:
  language: ta
  text: அவர்கள் தங்கள் மகிமையை[a] புல் உண்ணும் ஓர் எருதின்[b] உருவத்திற்காகப் பரிமாறிக்கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் மகிமையான கடவுளை.’ எபிரெயத்தில் நேரடியாக ‘தங்கள் மகிமையை’ என்று உள்ளது; இங்கு அது கடவுளை மரியாதையுடன் மறைமுகமாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘காளை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  choice: பரிமாறிக்கொண்டார்கள்
  rationale: מוּר வினை ஒன்று மற்றொன்றால் மாற்றப்படுவதையோ, ஒன்றுக்குப் பதிலாக மற்றொன்றை ஏற்றுக்கொள்வதையோ குறிக்கிறது. சிலைவழிபாட்டில் நிகழ்ந்த மாற்றீட்டைத் தமிழில் தெளிவாகக் காட்டுகிறது.
- source_word: כְּבוֹדָם
  choice: தங்கள் மகிமையை
  rationale: எபிரெய உரையின் நேரடியான, பொருள்செறிந்த சொல்லாட்சியைப் பாதுகாக்கிறது. சூழலில் இது கடவுளைக் குறித்தாலும், முதன்மை உரையில் ‘கடவுள்’ என்று வெளிப்படையாகச் சேர்த்து ambiguity-ஐ நீக்கவில்லை.
- source_word: בְּתַבְנִית
  choice: உருவத்துடன்
  rationale: תַּבְנִית என்பது வடிவம், சாயல் அல்லது உருவம் என்பதைக் குறிக்கும். இங்கு சிலை வடிவத்தைக் குறிப்பதால் ‘உருவம்’ இயல்பான தமிழ் இணையாகும்; בְּ முன்னொட்டின் மாற்றீட்டுச் சார்பை ‘உருவத்துடன்’ வெளிப்படுத்துகிறது.
- source_word: שׁוֹר
  choice: ஓர் எருது
  rationale: שׁוֹר மாட்டினத்தைச் சேர்ந்த எருது அல்லது காளையைக் குறிக்கலாம். ‘எருது’ முதன்மைத் தேர்வாக வைக்கப்பட்டு, ‘காளை’ அடிக்குறிப்பில் மாற்றாகக் கொடுக்கப்படுகிறது.
- source_word: אֹכֵל עֵשֶׂב
  choice: புல் தின்னும்
  rationale: எபிரெயப் பங்கேற்புவினை மற்றும் அதன் செயப்படுபொருளை இயல்பான தமிழ்ப் பெயரெச்சத் தொடராக வழங்குகிறது. மகிமைக்குப் பதிலாகப் புல் உண்ணும் உயிரினத்தின் உருவத்தை ஏற்றுக்கொண்ட முரண்பாட்டையும் காக்கிறது.
theological_decisions:
- issue: ‘தங்கள் மகிமை’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘தங்கள் மகிமை’ என்ற நேரடிச் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: தங்கள் மகிமையான கடவுள்
  rationale: சூழல் இது இஸ்ரவேலின் கடவுளைக் குறிப்பதைத் தெளிவாக்குகிறது. ஆயினும், எபிரெயம் கடவுளை நேரடியாகப் பெயரிடாமல் ‘அவர்களுடைய மகிமை’ எனக் கூறுவதால், அதன் இறையியல் செறிவையும் உள்ளார்ந்த மறைமுகத்தன்மையையும் முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்தின் கண்ணியமான குற்றச்சாட்டுத் தொனியைத் தக்கவைக்கும் வகையிலும் அமைக்கப்பட்டுள்ளது. ‘பரிமாறிக்கொண்டார்கள்’ என்பது வெறும் உருவமாற்றம் அல்ல, ஒன்றுக்குப் பதிலாக மற்றொன்றை ஏற்றுக்கொண்ட செயலைக் காட்டுகிறது.
