  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பாகால்’ மற்றும் ‘பேயோர்’ பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; மூலத்தின் சுருக்கமும் ‘இறந்தோர்’ குறித்த தெளிவின்மையும் காக்கப்பட்டுள்ளன.
