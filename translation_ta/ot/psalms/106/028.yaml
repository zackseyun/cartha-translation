  text: They joined themselves to Baal of Peor and ate sacrifices of the dead[a][b].
translation:
  language: ta
  text: அவர்கள் பேயோரின் பாகாலோடு தங்களை இணைத்துக்கொண்டு[a], இறந்தோரின் பலிகளை உண்டார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பேயோரின் பாகாலோடு தங்களைப் பிணைத்துக்கொண்டு.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “இறந்தோரின் பலிகள்.” இந்தச் சொற்றொடர் உயிரற்ற சிலைகளுக்குச் செலுத்தப்பட்ட பலிகளையோ, இறந்தவர்களுடன் தொடர்புடைய சடங்குகளையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצָּמְדוּ
  choice: தங்களை இணைத்துக்கொண்டு
  rationale: צמד என்பது நெருக்கமாக இணைதல் அல்லது பிணைத்துக்கொள்ளுதல் என்ற பொருளைக் கொண்டது. இங்கு வழிபாட்டுச் சார்பை உணர்த்தும் தன்னிலைப் பொருளை இயல்பான நவீனத் தமிழில் இது காக்கிறது.
- source_word: לְבַעַל פְּעוֹר
  choice: பேயோரின் பாகாலோடு
  rationale: இந்தச் சொற்றொடர் பேயோர் என்னும் இடத்துடன் தொடர்புடைய பாகால் தெய்வத்தைக் குறிக்கிறது. பெயர்கள் ஒலிபெயர்க்கப்பட்டு, அவற்றுக்கிடையேயான உறவு தமிழ் உடைமைத் தொடரால் இயல்பாக வெளிப்படுத்தப்படுகிறது.
- source_word: וַיֹּאכְלוּ
  choice: உண்டார்கள்
  rationale: வினைச்சொல்லின் எளிய நேரடிப் பொருளையும் எபிரெயக் கதைத் தொடரையும் சுருக்கமாகக் காக்கிறது.
- source_word: זִבְחֵי
  choice: பலிகளை
  rationale: זֶבַח என்பது பலி அல்லது பலிப்பொருள். சூழலில் அவற்றை உண்பது கூறப்பட்டுள்ளதால், கூடுதல் விளக்கமின்றி ‘பலிகள்’ என்பது போதுமானதும் மூலத்திற்கு நெருக்கமானதும் ஆகும்.
- source_word: מֵתִים
  choice: இறந்தோரின்
  rationale: எபிரெயச் சொல் ‘இறந்தவர்கள்/இறந்தவை’ என்று பொருள்படும். உயிரற்ற சிலைகளையோ இறந்த மனிதர்களோடு தொடர்புடைய சடங்குகளையோ குறிக்கக்கூடிய தெளிவின்மையை ‘இறந்தோர்’ காக்கிறது.
theological_decisions:
- issue: ‘இறந்தோர்’ என்பதன் குறிப்பு
  choice: யாரைக் குறிக்கிறது என்பதை முதன்மை உரையில் வரையறுக்காமல் ‘இறந்தோரின் பலிகள்’ என்று வைத்தல்
  alternative: உயிரற்ற தெய்வங்களுக்குச் செலுத்தப்பட்ட பலிகள்; இறந்த மனிதர்களுக்கான பலிகள்
  rationale: מֵתִים என்ற எபிரெயச் சொல் இங்கு உயிரற்ற விக்கிரகங்களையா அல்லது இறந்தவர்களுடன் தொடர்புடைய சடங்குகளையா குறிக்கிறது என்பதை வெளிப்படையாகத் தீர்மானிக்கவில்லை. ஆகவே மூலத்தின் உண்மையான இறையியல் தெளிவின்மை காக்கப்படுகிறது.
