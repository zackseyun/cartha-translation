source:
  edition: WLC
  text: אַ֭שְׁרֵי שֹׁמְרֵ֣י מִשְׁפָּ֑ט עֹשֵׂ֖ה צְדָקָ֣ה בְ/כָל עֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/003.yaml
  text: Blessed are those who keep justice[a], who do righteousness at all times.
translation:
  language: ta
  text: 'நியாயத்தைக்[a] கடைப்பிடித்து,

    எக்காலத்திலும் நீதியானதைச் செய்கிறவர்கள் பேறுபெற்றவர்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நியாயத்தைக் கடைப்பிடித்து, எக்காலத்திலும் சரியானதைச் செய்கிறவர்கள் மகிழ்ச்சியானவர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவர்கள்
  rationale: பலரைக் குறிக்கும் வியப்புரை வடிவத்தின் வாழ்த்துரைத் தொனியையும் சங்கீதத்திற்குரிய உயர்ந்த நடையையும் இது இயல்பாகத் தருகிறது; வெறும் மனநிலையைக் குறிக்கும் ‘மகிழ்ச்சியானவர்கள்’ என்பதைக் காட்டிலும் எபிரெயச் சொல்லின் பொருள்விரிவை நன்றாகக் காக்கிறது.
- source_word: שֹׁמְרֵי
  choice: கடைப்பிடித்து
  rationale: தொடர்ந்து ஒழுகும் பழக்கத்தைக் குறிக்கும் எபிரெயப் பங்கேற்புவினையின் பொருளை, நியாயத்தை வாழ்வில் பின்பற்றுதல் என்ற இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִשְׁפָּט
  choice: நியாயம்
  rationale: இச்சூழலில் நீதிமன்றத் தீர்ப்பை அல்ல, நியாயமான ஒழுக்கத்தையும் நடத்தையையும் குறிக்கிறது. அடுத்துவரும் צְדָקָה என்பதிலிருந்து வேறுபாட்டையும் இது காக்கிறது.
- source_word: עֹשֵׂה
  choice: செய்கிறவர்கள்
  rationale: எபிரெயில் ஒருமை வடிவம் இருந்தாலும் அது பொதுவான அல்லது கூட்டுப் பொருளில் முன்வரும் பன்மையோடு இணைகிறது; தமிழில் பன்மை உறவுவாக்கியமாக வழங்குவது இயல்பானதுடன் தொடர்ச்சியான செயற்பாட்டையும் உணர்த்துகிறது.
- source_word: צְדָקָה
  choice: நீதியானதை
  rationale: நேர்மையான, நீதியுள்ள செயலைக் குறிக்கிறது. ‘நீதி செய்’ என்ற இறுக்கமான சொல்லாக்கத்தைவிட ‘நீதியானதைச் செய்’ நவீன தமிழில் இயல்பாக உள்ளது; அதேவேளையில் முந்திய ‘நியாயம்’ என்பதோடு இதை ஒன்றாக்காமல் காக்கிறது.
- source_word: בְּכָל עֵת
  choice: எக்காலத்திலும்
  rationale: எல்லா வேளைகளிலும் தொடர்ச்சியாக நடப்பதைக் குறிக்கும் மூலமொழியின் வலியுறுத்தலைச் சுருக்கமாகவும் உயர்ந்த இயல்பான தமிழிலும் தருகிறது.
theological_decisions:
- issue: מִשְׁפָּט மற்றும் צְדָקָה ஆகியவற்றின் உறவு
  choice: இரண்டையும் முறையே ‘நியாயம்’ மற்றும் ‘நீதியானது’ என்று வேறுபடுத்தி மொழிபெயர்த்தல்.
  alternative: இரண்டையும் ‘நீதி’ சார்ந்த ஒரே சொல்லால் மொழிபெயர்த்தல்.
  rationale: எபிரெயில் இவை தொடர்புடையவையாக இருந்தாலும் ஒரே பொருளுடையவை அல்ல. வேறுபடுத்துவது கவிதை இணைநிலையையும் இரண்டு ஒழுக்கக் கருத்துகளுக்கிடையேயான நுண்ணிய வேறுபாட்டையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான வாழ்த்துரை நடை பயன்படுத்தப்பட்டுள்ளது. ‘பேறுபெற்றவர்கள்’ உயர்ந்த வேதாகமத் தொனியைத் தக்கவைக்கிறது; வாக்கிய அமைப்பு சாதாரண வாசகருக்கும் தெளிவாக இருக்கிறது.
