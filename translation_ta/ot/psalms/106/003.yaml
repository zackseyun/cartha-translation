  source_fidelity: மூல எபிரெயத்தின் வாழ்த்துரைத் தொடக்கம் (אַשְׁרֵי), தொடர்ச்சியான ஒழுக்கநடை குறிக்கும் பங்கேற்பு வடிவங்கள், מִשְׁפָּט–צְדָקָה என்ற வேறுபட்ட இணைச்சொற்கள், மற்றும் ‘எல்லாக் காலங்களிலும்’ என்ற வலியுறுத்தல் ஆகியவை துல்லியமாகக் காக்கப்பட்டுள்ளன. தமிழில் வாக்கிய வரிசை மாற்றப்பட்டிருந்தாலும் பொருள் அல்லது வலியுறுத்தல் மாறவில்லை.
  naturalness: ‘நியாயத்தைக் கடைப்பிடித்து, எக்காலத்திலும் நீதியானதைச் செய்கிறவர்கள் பேறுபெற்றவர்கள்’ என்பது நவீன பொதுத்தமிழில் தெளிவாகவும் சங்கீதத்திற்குரிய கண்ணியமான நடையுடனும் உள்ளது. ‘பேறுபெற்றவர்கள்’ வாழ்த்துரைத் தொனிக்கு ஏற்றது.
  terminology: மִשְׁפָּט என்பதற்கு ‘நியாயம்’, צְדָקָה என்பதற்கு ‘நீதியானது’ என வேறுபடுத்தியிருப்பது மூலத்தின் இணைநிலையையும் கருத்து வேறுபாட்டையும் காக்கிறது. அடிக்குறிப்பில் ‘மகிழ்ச்சியானவர்கள்’ மற்றும் ‘சரியானது’ ஆகிய மாற்றுகள் புரிந்துகொள்ளத்தக்கவை; அடிக்குறி இடமும் வழங்கப்பட்ட ஆங்கில ஆய்வுத்தடத்துடன் ஒத்துள்ளது.
