  text: פְּעָמִ֥ים רַבּ֗וֹת יַצִּ֫ילֵ֥/ם וְ֭/הֵמָּה יַמְר֣וּ בַ/עֲצָתָ֑/ם וַ֝/יָּמֹ֗כּוּ בַּ/עֲוֺנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/043.yaml
  text: Many times he delivered them[b][a], but they were rebellious in their counsel, and they were brought low by their iniquity.
translation:
  language: ta
  text: பலமுறை அவர் அவர்களை விடுவித்தார்; ஆனால் அவர்களோ தங்கள் ஆலோசனையின்படி கலகம் செய்தார்கள்[a]; தங்கள் அக்கிரமத்தால் தாழ்ந்துபோனார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தங்கள் திட்டத்தின்படி கலகம் செய்தார்கள்’ அல்லது ‘தங்கள் நோக்கத்தின்படி கலகம் செய்தார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் ஆலோசனை, திட்டம் அல்லது நோக்கம் என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சரிந்துபோனார்கள்’ அல்லது ‘தங்கள் அக்கிரமத்தால் நலிந்துபோனார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரேய வினை தாழ்வடைதல், சரிதல் அல்லது நலிவடைதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעָמִים רַבּוֹת
  choice: பலமுறை
  rationale: பல நிகழ்வுகளையும் மீண்டும் மீண்டும் நடந்த செயலையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יַצִּילֵם
  choice: அவர்களை விடுவித்தார்
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்து மீட்பதை அல்லது விடுவிப்பதைக் குறிக்கிறது. இங்கு ‘விடுவித்தார்’ என்பது பொருளைத் தெளிவாகக் கொடுத்து, தேவையற்ற விரிவான இறையியல் கருத்தைச் சேர்க்கவில்லை.
- source_word: וְהֵמָּה
  choice: ஆனால் அவர்களோ
  rationale: தனி சுட்டுப்பெயர் தரும் வலியுறுத்தலையும், முந்தைய இறை விடுதலைக்கும் மக்களின் எதிர்வினைக்கும் இடையிலான முரண்பாட்டையும் ‘அவர்களோ’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יַמְרוּ
  choice: கலகம் செய்தார்கள்
  rationale: מרה என்பது எதிர்த்தல் அல்லது கலகம் செய்தல் என்பதைக் குறிக்கிறது. வினைச்சொல் வடிவைத் தக்கவைத்தபடி தொடர்ந்து வெளிப்பட்ட எதிர்ப்பையும் இத்தொடர் உணர்த்த முடியும்.
- source_word: בַעֲצָתָם
  choice: தங்கள் திட்டத்தின்படி
  rationale: עֵצָה என்பதற்கு ஆலோசனை, திட்டம், நோக்கம் ஆகிய பொருள்கள் உண்டு. சூழலில் அவர்களுடைய சொந்தத் திட்டம் அல்லது தீர்மானத்தின்படி நடந்ததை இயல்பான தமிழில் இது தெரிவிக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וַיָּמֹכּוּ
  choice: தாழ்ந்துபோனார்கள்
  rationale: מוך என்பது தாழ்வடைதல், சரிந்துபோதல் அல்லது நலிவடைதல் ஆகியவற்றைக் குறிக்கலாம். ‘தாழ்ந்துபோனார்கள்’ காரணகர்த்தாவைத் தேவையின்றி குறிப்பாக்காமல் விளைவைப் பாதுகாக்கிறது.
- source_word: בַּעֲוֺנָם
  choice: தங்கள் அக்கிரமத்தால்
  rationale: עָוֹן என்பது அக்கிரமம், குற்றப்பழி அல்லது அதன் விளைவு ஆகியவற்றைக் குறிக்கலாம். ‘அக்கிரமத்தால்’ அதன் அறநெறி கனத்தையும் இங்குள்ள காரணப் பொருளையும் தக்கவைக்கிறது.
theological_decisions:
- issue: விடுவிப்பவரின் அடையாளம்
  choice: எபிரெய வினையில் உள்ள மூன்றாம் நபர் ஆண்பால் ஒருமையை ‘அவர்’ என்று மொழிபெயர்த்து, அதன் குறிப்பு சூழலிலிருந்து கடவுளைச் சுட்டுவதாக விடப்பட்டுள்ளது.
  alternative: ‘ஆண்டவர் அவர்களை விடுவித்தார்’ என்று இறைப் பெயரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: இவ்வசனத்தில் இறைப் பெயர் மீண்டும் வெளிப்படையாக வரவில்லை; சங்கீதத்தின் சூழல் செய்பவரைத் தெளிவாக்குகிறது. ஆகவே மூலத்தின் சுருக்கத்தன்மை பாதுகாக்கப்படுகிறது.
- issue: עָוֹן என்ற அறநெறிச் சொல்
  choice: அக்கிரமம்
  alternative: குற்றம்; தீச்செயல்; குற்றப்பழி
  rationale: ‘அக்கிரமம்’ மூலச்சொல்லின் அறநெறி மற்றும் இறையியல் கனத்தைத் தக்கவைக்கிறது; அதேவேளை குற்றமா, குற்றப்பழியா, தண்டனைக்குரிய நிலைமையா என்பதைத் தேவையின்றி முழுமையாகத் தீர்மானிப்பதில்லை.
- issue: וַיָּמֹכּוּ என்பதில் செயப்படுபொருள் அல்லது நிலைமாற்ற நுணுக்கம்
  choice: தாழ்ந்துபோனார்கள்
  alternative: தாழ்த்தப்பட்டார்கள்; சரிந்துபோனார்கள்; நலிந்துபோனார்கள்
  rationale: எபிரெயச் சொல் தாழ்ந்த நிலைக்கு வந்ததைக் கூறுகிறது; அதை யார் நேரடியாக நிகழ்த்தினார் என்பதை வசனம் வெளிப்படையாகச் சொல்லாததால், தமிழ் மொழிபெயர்ப்பும் அந்தத் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்துக்குரிய கண்ணியமான நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. ‘அவர்களோ’ என்பது எபிரெய மூலத்தின் வலியுறுத்தலையும் முரண்பாட்டையும் தக்கவைக்கிறது; இரு விளைவுக் கூறுகளுக்கிடையே அரைப்புள்ளி பயன்படுத்தப்பட்டுள்ளது.
