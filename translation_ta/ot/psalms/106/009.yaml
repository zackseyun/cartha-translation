lexical_decisions:
- source_word: וַיִּגְעַר
  choice: அதட்டினார்
  rationale: גער என்பதன் ‘கடிந்துகொள்/அதட்டு’ என்ற பொருளையும், கடலை ஆளுமையுள்ள ஒன்றுபோல் சித்தரிக்கும் கவித்துவ உருவகத்தையும் ‘அதட்டினார்’ இயல்பாகப் பாதுகாக்கிறது.
- source_word: בְּיַם סוּף
  choice: செங்கடலை[a]
  rationale: யாம் சூஃப் என்பது யாத்திராகம நிகழ்வைக் குறிக்கும் வழக்கமான வேதாகமப் பெயர்; தமிழில் பரவலாக அறியப்படும் ‘செங்கடல்’ முதன்மை உரையில் வைக்கப்பட்டு, சொற்பிறப்பை நெருக்கமாகப் பிரதிபலிக்கும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַיֶּחֱרָב
  choice: அது வறண்டுபோனது
  rationale: חרב வினையின் தன்னிகழ்வான ‘வறண்டுபோதல்’ என்ற பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַיּוֹלִיכֵם
  choice: அவர்களை நடத்திச் சென்றார்
  rationale: הלך என்பதன் ஹிஃபீல் வடிவம் இங்கு வழிநடத்துதலைக் குறிக்கிறது; ‘நடத்திச் சென்றார்’ இயக்கத்தையும் தெய்வீக வழிநடத்துதலையும் தெளிவாகத் தருகிறது.
- source_word: בַּתְּהֹמוֹת
  choice: ஆழங்களின் வழியாக
  rationale: תְּהֹמוֹת என்ற பன்மைச் சொல் பெரும் நீராழங்களை நினைவூட்டுகிறது; ‘ஆழங்கள்’ அதன் பன்மையையும் கவித்துவ வலிமையையும் காக்கிறது.
- source_word: כַּמִּדְבָּר
  choice: பாலைவனத்தின் வழியாக நடத்திச் செல்வதுபோல்
  rationale: கடலின் ஆழங்களினூடான பயணம் பாலைவனத்தைக் கடக்கும் பயணம்போல் இருந்தது என்ற ஒப்புமையை, ‘நடத்தினார்’ என்பதிலுள்ள இயக்கத்தோடு இணைத்து இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: யாத்திராகமக் குறிப்பில் יַם סוּף என்பதன் மொழிபெயர்ப்பு
  choice: செங்கடல்
  alternative: நாணற்கடல்
  rationale: ‘செங்கடல்’ தமிழ் வேதாகமப் பயன்பாட்டில் யாத்திராகம நிகழ்வை உடனடியாக அடையாளப்படுத்துகிறது. எனினும் எபிரெயச் சொல்லின் கூறுகளை நேரடியாகப் பிரதிபலிக்கும் ‘நாணற்கடல்’ என்ற வாசிப்பு சாத்தியமானதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்குரிய கண்ணியமும் சுருக்கமான இணைநடையும் காக்கப்பட்டுள்ளன. ‘அதட்டினார்’ என்பது கடலை மனிதர்போல் சித்தரிக்கும் மூலக் கவித்துவத்தைப் பாதுகாக்கிறது; ‘ஆழங்கள்’ மூலத்தின் பன்மையைத் தக்கவைக்கிறது.
