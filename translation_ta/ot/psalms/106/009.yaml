  text: அவர் செங்கடலை[a] அதட்டினார்; அது வறண்டுபோனது. பாலைவனத்தின் வழியாகச் செல்வதுபோல், அவர் அவர்களை ஆழங்களின் வழியாக நடத்திச் சென்றார்.
