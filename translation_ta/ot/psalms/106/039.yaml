  text: וַ/יִּטְמְא֥וּ בְ/מַעֲשֵׂי/הֶ֑ם וַ֝/יִּזְנוּ֗ בְּ/מַֽעַלְלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/039.yaml
  text: So they became unclean by their deeds[a], and they prostituted themselves by their acts.
translation:
  language: ta
  text: அவர்கள் தங்கள் செயல்களால் தீட்டடைந்தார்கள்; தங்கள் நடத்தைகளால் வேசித்தனம் புரிந்தார்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தங்கள் நடத்தைகளால் உண்மையற்றவர்களாய் நடந்தார்கள்.” ஒழுக்க மற்றும் உடன்படிக்கைத் துரோகத்தைச் சித்தரிக்க எபிரெய மொழி பாலியல் உருவகத்தைப் பயன்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטְמְאוּ
  choice: தீட்டுப்பட்டார்கள்
  rationale: טמא என்ற வினை தீட்டடைவதை அல்லது தீட்டுள்ள நிலைக்கு வருவதைக் குறிக்கிறது. வெளிப்புறச் செய்பவரைச் சேர்க்காமல், விளைவுநிலையை இயல்பான தமிழில் இது தெரிவிக்கிறது.
- source_word: בְּמַעֲשֵׂיהֶם
  choice: தங்கள் செயல்களால்
  rationale: מַעֲשֶׂה என்பது செயல்கள் அல்லது செய்கைகள். இங்குள்ள בְּ காரணத்தையோ கருவியையோ குறிக்கிறது; அவர்களுடைய செயல்களே அவர்கள் தீட்டுப்படக் காரணமாயின என்பதை ‘செயல்களால்’ தெளிவாகக் காட்டுகிறது.
- source_word: וַיִּזְנוּ
  choice: வேசித்தனம் செய்தார்கள்
  rationale: זנה என்பதன் பாலியல் உருவகத்தைத் தக்கவைத்து, சிலைவழிபாட்டினாலும் உடன்படிக்கைத் துரோகத்தினாலும் ஏற்பட்ட உண்மையின்மையை நேரடியாக விளக்கிவிடாமல் மூலத்தின் வலிமையையும் பதற்றத்தையும் பாதுகாக்கிறது.
- source_word: בְּמַעַלְלֵיהֶם
  choice: தங்கள் நடத்தைகளால்
  rationale: מַעֲלָל என்பது ஒழுக்கச் சாயல் கொண்ட செயல்கள், நடைமுறைகள் அல்லது நடத்தைகளைக் குறிக்கலாம். முந்தைய ‘செயல்கள்’ என்பதையே மீண்டும் கூறாமல் எபிரெயக் கவிதையின் சொல் வேறுபாட்டை ‘நடத்தைகள்’ தக்கவைக்கிறது.
theological_decisions:
- issue: זנה என்பதை உடன்படிக்கைத் துரோகம் என்று நேரடியாக விளக்குவதா, பாலியல் உருவகத்தைத் தக்கவைப்பதா
  choice: முதன்மை உரையில் ‘வேசித்தனம் செய்தார்கள்’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உண்மையற்றவர்களாய் நடந்தார்கள்’
  rationale: சங்கீதத்தின் சூழலில் இது சிலைவழிபாட்டால் ஏற்பட்ட ஒழுக்க மற்றும் உடன்படிக்கைத் துரோகத்தைக் குறிக்கிறது. ஆயினும், மூல எபிரெயம் அந்தப் பொருளைப் பாலியல் உருவகத்தின் வழியே வெளிப்படுத்துவதால், விளக்கத்தை முதன்மை உரைக்குள் புகுத்தாமல் உருவகத்தைப் பாதுகாத்து, மாற்றுப் பொருளை அடிக்குறிப்பில் தருவது பொருத்தமானது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘வேசித்தனம்’ என்ற வலுவான சொல் மூலத்தின் திட்டமிட்ட பாலியல் உருவகத்தைத் தக்கவைக்கிறது; அடிக்குறிப்பு அதன் உடன்படிக்கை சார்ந்த பொருளை விளக்குகிறது.
