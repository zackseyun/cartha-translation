  yaml_path: translation/ot/psalms/106/042.yaml
  text: Their enemies oppressed them[a], and they were subdued under their hand.
translation:
  language: ta
  text: அவர்களுடைய பகைவர்கள் அவர்களை ஒடுக்கினார்கள்; அவர்கள் பகைவர்களின் கைக்குக் கீழ் அடக்கப்பட்டார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
