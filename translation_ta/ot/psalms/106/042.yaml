  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரேய உருவகமான ‘கைக்குக் கீழ்’ முதன்மை உரையில் தக்கவைக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
