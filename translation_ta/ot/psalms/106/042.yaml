    text: அதாவது, ‘அவர்களுடைய அதிகாரத்தின் கீழ்’ அல்லது ‘அவர்களுடைய கட்டுப்பாட்டின் கீழ்’; சொல்லர்த்தமாக, ‘அவர்களுடைய கைக்குக் கீழ்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחָצוּם
  choice: அவர்களை ஒடுக்கினார்கள்
  rationale: לחץ என்பதன் Qal வடிவம் இங்கு தொடர்ச்சியான பகைமை அழுத்தத்தையும் ஒடுக்குதலையும் குறிக்கிறது; நவீனத் தமிழில் ‘ஒடுக்கினார்கள்’ இயல்பாகவும் சூழலுக்குப் பொருத்தமாகவும் உள்ளது.
- source_word: אֹיְבֵיהֶם
  choice: அவர்களுடைய பகைவர்கள்
  rationale: אויב என்பதன் நேரடியான சூழல்சார் பொருள் ‘பகைவர்கள்’; பின்னர் வரும் பன்மை உரிமைப்பெயரின் குறிப்பைத் தெளிவுபடுத்தவும் இதே சொல் மீண்டும் பயன்படுத்தப்பட்டுள்ளது.
- source_word: וַיִּכָּנְעוּ
  choice: அடக்கப்பட்டார்கள்
  rationale: כנע என்பதன் Niphal வடிவம் அடங்கச் செய்யப்படுதல் அல்லது கீழ்ப்படுத்தப்படுதல் என்ற செயப்பாட்டு விளைவைக் காட்டுகிறது; ‘அடக்கப்பட்டார்கள்’ அந்த வலிமையைத் தெளிவாகத் தருகிறது.
- source_word: תַּחַת יָדָם
  choice: பகைவர்களின் கைக்குக் கீழ்
  rationale: எபிரேயத்தின் ‘அவர்களுடைய கைக்குக் கீழ்’ என்ற உருவகத்தைப் பாதுகாக்கிறது. தமிழில் பிரதிப்பெயர் குழப்பம் ஏற்படாமல் ‘பகைவர்களின்’ என்று தெளிவுபடுத்தப்பட்டுள்ளது; இது அவர்களுடைய அதிகாரம் அல்லது கட்டுப்பாட்டின் கீழ் என்பதைக் குறிக்கும் மரபுத்தொடர்.
