    text: ‘ஆனாலும்’ என்பதை ‘அவர் அவர்களைக் காப்பாற்றினார்’ அல்லது ‘ஆனால் அவர் அவர்களைக் காப்பாற்றினார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய இணைப்புச்சொல் பலவகையில் வழங்கப்படலாம்; இங்கு அது முந்தைய வசனத்துடனான முரண்பாட்டை உணர்த்துகிறது.
