lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: ஆனாலும் அவர் ... அவர்களை மீட்டார்
  rationale: ישׁע என்பதன் பொருள் ‘காப்பாற்றுதல்/விடுவித்தல்’. முந்தைய வசனத்தில் கூறப்பட்ட கலகத்துடன் இங்கு முரண்பாடு இருப்பதால், וַ־ என்பதை இயல்பான தமிழில் ‘ஆனாலும்’ என வழங்குவது பொருத்தம்; ‘மீட்டார்’ என்பது ஆபத்திலிருந்து விடுவித்த செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: לְמַעַן
  choice: பொருட்டு
  rationale: இச்சொல் நோக்கம் அல்லது செயலுக்கான காரணத்தை உணர்த்துகிறது. ‘தமது பெயரின் பொருட்டு’ என்பது சுருக்கமான, இயல்பான தமிழ் மரபுத்தொடராகும்.
- source_word: שְׁמוֹ
  choice: தமது பெயரின்
  rationale: ‘பெயர்’ என்ற நேரடிப் படிமம் தேவனுடைய வெளிப்படுத்தப்பட்ட தன்மை, மாண்பு, புகழ் ஆகிய விரிவான பொருள்களைத் தாங்குவதால் அதைப் பராபரையாகச் சுருக்கவில்லை.
- source_word: לְהוֹדִיעַ
  choice: தெரியப்படுத்துவதற்காக
  rationale: ידע என்பதன் ஹிஃபில் வினையெச்ச வடிவம் ‘அறியச் செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டது. இத்தமிழ் வடிவம் நோக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֶת
  choice: '[தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: இது நேரடிச் செயப்படுபொருளைக் குறிக்கும் இலக்கணத் துகள்; தமிழில் தனிச் சொல் தேவையில்லை.
- source_word: גְּבוּרָתוֹ
  choice: தமது வல்லமையை
  rationale: גְּבוּרָה என்பது வலிமை, வல்லமை, அல்லது வல்ல செயல்களைக் குறிக்கலாம். இங்கு ஒருமை அருவப்பொருளாக ‘வல்லமை’ என்பது தேவனுடைய ஆற்றலை இயல்பாகவும் மாண்புடனும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘தமது பெயரின் பொருட்டு’ என்பதன் பொருள்
  choice: தேவன் தமது பெயரின் மாண்பையும் வெளிப்படுத்தப்பட்ட தன்மையையும் முன்னிட்டு மீட்டார் என்ற விரிவான பொருளைத் தக்கவைத்தல்
  alternative: தமது புகழின் பொருட்டு
  rationale: எபிரெய ‘பெயர்’ என்பது வெறும் பொதுப் புகழைவிட விரிவானது; அது தேவனுடைய வெளிப்படுத்தப்பட்ட தன்மையையும் மாண்பையும் உள்ளடக்குகிறது. ஆகவே ‘பெயர்’ என்பதையே வைத்திருப்பது மூலத்தின் இறையியல் ஆழத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் மாண்பான நடையில் மொழிபெயர்க்கப்பட்டது. தேவனைச் சுட்டும் இடங்களில் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. ‘பெயர்’ என்ற மூலப் படிமமும், முந்தைய வசனத்துடனான ‘ஆனாலும்’ என்ற முரண்பாடும் பாதுகாக்கப்பட்டுள்ளன.
