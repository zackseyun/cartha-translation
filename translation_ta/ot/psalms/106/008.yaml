  text: Yet he saved them for the sake of his name[c][b][a], to make his might known.
translation:
  language: ta
  text: ஆனாலும்[a], அவர் தமது பெயரின் பொருட்டு[b] அவர்களைக் காப்பாற்றினார்; தமது வல்லமையை அறியச் செய்வதற்காக[c].
  philosophy: optimal-equivalence
