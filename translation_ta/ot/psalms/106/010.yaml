lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: அவர் அவர்களைக் காப்பாற்றினார்
  rationale: ישע என்ற வினை ஆபத்திலிருந்து காப்பாற்றுதல் அல்லது விடுவித்தல் என்ற பொருளைக் கொண்டது. ‘காப்பாற்றினார்’ என்பது இயல்பான நவீனத் தமிழில் அந்த மீட்புச் செயலைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִיַּד
  choice: கையிலிருந்து
  rationale: ஒருவருடைய அதிகாரம் அல்லது பிடியிலிருந்து விடுவிக்கப்படுவதைக் குறிக்கும் எபிரெய உருவகத்தைத் தமிழிலும் புரியத்தக்க வகையில் அப்படியே தக்கவைக்கிறது.
- source_word: שׂוֹנֵא
  choice: பகைத்தவன்
  rationale: எபிரெய மூலத்திலுள்ள ஒருமை வினையெச்சப் பெயரின் வடிவத்தைப் பாதுகாக்கிறது; இதை பன்மையாக மாற்றிச் சீராக்கவில்லை.
- source_word: וַיִּגְאָלֵם
  choice: அவர்களை மீட்டார்
  rationale: גאל என்பது உரிமையுடன் தலையிட்டு ஒருவரை மீட்பது அல்லது விடுவிப்பது என்ற நுண்பொருளைக் கொண்டது. ‘மீட்டார்’ அந்தப் பொருளையும் கவிதை இணைநிலையையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אוֹיֵב
  choice: எதிரி
  rationale: மூலத்திலுள்ள ஒருமையைப் பாதுகாத்து, முந்தைய ‘பகைத்தவன்’ என்பதற்கு இணையான பகைமைச் சொல்லாக அமைகிறது.
theological_decisions:
- issue: ישע, גאל ஆகிய இரண்டு தொடர்புடைய மீட்பு வினைகளையும் ஒரே சொல்லாகச் சீராக்கலாமா என்பது
  choice: ‘காப்பாற்றினார்’, ‘மீட்டார்’ என இரண்டு வேறுபட்ட சொற்கள் பயன்படுத்தப்பட்டன
  alternative: இரண்டையும் ‘விடுவித்தார்’ என்று பொதுவாக மொழிபெயர்த்தல்
  rationale: மூலவசனம் தொடர்புடையதாயினும் வேறுபட்ட இரண்டு செயல்சொற்களைப் பயன்படுத்துகிறது. அவற்றின் கவிதை இணைநிலையையும் இரட்சித்தல், மீட்டல் ஆகிய நுண்பொருள் வேறுபாட்டையும் தேவையற்ற கோட்பாட்டு விளக்கமின்றிப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘கையிலிருந்து’ என்ற எபிரெய உருவகம் தக்கவைக்கப்பட்டுள்ளது; ஒருமை பகைவர் வடிவங்களும் சீராக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
