  text: They did not destroy the peoples whom Yahweh had told them to destroy[a].
translation:
  language: ta
  text: யாவே அவர்களிடம் அழித்துவிடும்படி கூறிய அந்த மக்களை அவர்கள் அழிக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் சொல்லுக்குச் சொல்: ‘யாவே அவர்களிடம் கூறிய அந்த மக்களை அவர்கள் அழிக்கவில்லை.’ கூறியதன் உள்ளடக்கம் மூலத்தில் வெளிப்படையாக இல்லை; ஆனால் சூழலால் தெளிவாக இருப்பதால், ‘அழித்துவிடும்படி’ என்பது உரையில் சேர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: இல்லை
  rationale: எபிரெய எதிர்மறையை இயல்பான தமிழ் இறந்தகால எதிர்மறை வினைமுற்றான ‘அழிக்கவில்லை’ என்பதில் வெளிப்படுத்துகிறது.
- source_word: הִשְׁמִידוּ
  choice: அழிக்கவில்லை
  rationale: שׁמד என்பதன் ஹிஃபில் வடிவம் முற்றாக அழித்தல் அல்லது அகற்றுதல் என்ற வலுவான பொருளைக் கொண்டது; ‘அழிக்கவில்லை’ இயல்பாகவும் போதிய வலிமையுடனும் உள்ளது.
- source_word: אֶת הָעַמִּים
  choice: மக்களை
  rationale: עַמִּים என்பது பல மக்கள் இனக்குழுக்களைக் குறிக்கிறது. இச்சூழலில் ‘மக்களை’ என்பது இயல்பான தமிழாக இருந்து அந்தப் பன்மைப் பொருளையும் தருகிறது.
- source_word: אֲשֶׁר
  choice: '...கூறிய'
  rationale: எபிரெய தொடர்புச் சொல்லைத் தமிழில் இயல்பான பெயரெச்சத் தொடராக அமைக்கிறது.
- source_word: אָמַר
  choice: கூறிய
  rationale: மூல வினையின் அடிப்படைப் பொருள் ‘சொன்னார்/கூறினார்’; ‘கட்டளையிட்டார்’ என்று வலுப்படுத்தாமல் சூழலுக்கேற்ற ‘கூறிய’ பயன்படுத்தப்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் ஏற்ற ஒலிபெயர்ப்பாக ‘யாவே’ வழங்கப்படுகிறது.
- source_word: לָהֶם
  choice: தங்களிடம்
  rationale: வாக்கியத்தின் இறுதியில் வரும் ‘அவர்கள்’ என்பதையே குறிக்கும் மறுபெயர்ச்சுட்டைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘தங்களிடம்’ பயன்படுத்தப்படுகிறது.
theological_decisions:
- issue: ‘யாவே அவர்களிடம் கூறிய’ என்பதற்குப் பின் மூலத்தில் விடுபட்டுள்ள கட்டளையின் உள்ளடக்கம்
  choice: ‘அழித்துவிடும்படி’ என்று உரையில் வெளிப்படையாக வழங்கப்பட்டது
  alternative: ‘யாவே தங்களிடம் கூறிய மக்களை அவர்கள் அழிக்கவில்லை’
  rationale: எபிரெய உரை சொல்லுக்குச் சொல் ‘யாவே அவர்களிடம் சொன்ன மக்களை’ என்று முடிவதால் உள்ளடக்கம் இலக்கணரீதியாக விடுபட்டுள்ளது. முந்தைய ‘அழித்தல்’ வினையும் விரிந்த சூழலும் அந்த மறைபொருளைத் தெளிவாக்குகின்றன. தமிழில் வாக்கியம் தெளிவாக அமைய ‘அழித்துவிடும்படி’ சேர்க்கப்பட்டாலும், மூலத்தின் சுருக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை. மூலத்தின் வன்மையான ‘அழித்தல்’ கருத்து மென்மையாக்கப்படவில்லை; அதேவேளை ‘நிர்மூலமாக்குதல்’ போன்ற தேவையற்ற மிகைச் சொல் தவிர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
