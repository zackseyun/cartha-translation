id: PSA.106.46
reference: Psalms 106:46
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אוֹתָ֣/ם לְ/רַחֲמִ֑ים לִ֝/פְנֵ֗י כָּל שׁוֹבֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/046.yaml
  text: He caused them to receive compassion before all who had taken them captive.
translation:
  language: ta
  text: அவர்களைச் சிறைப்பிடித்துச் சென்ற அனைவரின் முன்னிலையிலும் அவர்களுக்கு இரக்கம் கிடைக்கும்படி செய்தார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கிடைக்கும்படி செய்தார்
  rationale: எழுவாயான கடவுள், சிறைப்பிடிக்கப்பட்ட மக்கள் இரக்கத்தைப் பெறும்படி செய்தார் என்ற காரணச்செயல் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְרַחֲמִים
  choice: இரக்கம்
  rationale: רַחֲמִים என்பதன் பரிவு, கனிவு சார்ந்த பொருளைச் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்னிலையிலும்
  rationale: நேரடியான ‘முன்’ என்ற கருத்தைத் தக்கவைத்தபடி, அந்த இரக்கம் சிறைப்பிடித்தவர்களிடையே வெளிப்பட்டது என்ற உறவையும் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: כָּל־שׁוֹבֵיהֶם
  choice: அவர்களைச் சிறைப்பிடித்துச் சென்ற அனைவரின்
  rationale: שבה என்ற வேரின் சிறைப்பிடித்துக் கொண்டுசெல்லுதல் என்ற பொருளையும் כָּל என்பதன் முழுமையையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இரக்கம் கிடைத்ததில் கடவுளின் செயற்பாடு
  choice: அவர்களுக்கு இரக்கம் கிடைக்கும்படி செய்தார்
  alternative: அவர்கள் இரக்கம் பெறச் செய்தார்
  rationale: வசனம் இரக்கத்தின் இறுதி மூலமாகக் கடவுளின் செயலைக் காட்டுகிறது; அதே நேரத்தில் சிறைப்பிடித்தவர்கள் அந்த இரக்கத்தை வெளிப்படுத்திய மனித முகவர்களாக இருப்பதையும் இந்த வடிவம் மறைக்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், வழிபாட்டு மரியாதையையும் பொதுவாசகர்களுக்கான தெளிவையும் இணைக்கும் மொழிபெயர்ப்பு. எபிரெயச் சொற்கட்டின் பொருள் தக்கவைக்கப்பட்டாலும், தமிழில் செயற்கையாக ஒலிக்கும் ‘இரக்கங்களுக்காக வைத்தார்’ போன்ற நேரடி வடிவம் தவிர்க்கப்பட்டது.
