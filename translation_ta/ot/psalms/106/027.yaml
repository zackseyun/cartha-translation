  text: and to make their offspring fall among the nations[b][a], and to scatter them through the lands.
translation:
  language: ta
  text: அவர்களுடைய சந்ததியை[a] பிற நாடுகளின் நடுவே வீழச் செய்யவும், நாடுகளில் அவர்களைச் சிதறடிக்கவும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, ‘அவர்களுடைய விதையை.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘நிலப்பகுதிகளில் அவர்களைச் சிதறடிக்கவும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהַפִּיל
  choice: வீழச் செய்யவும்
  rationale: נפל என்பதன் ஹிஃபீல் வினையெச்ச வடிவம் ‘விழும்படி செய்தல்’ என்ற காரணவினைப் பொருளைக் கொண்டுள்ளது. மரணம் அல்லது படைத்தோல்வை என்று பொருளைக் குறுக்காமல், நியாயத்தீர்ப்பால் உண்டாகும் வீழ்ச்சியை இச்சொல் காக்கிறது.
- source_word: זַרְעָם
  choice: அவர்களுடைய சந்ததியை
  rationale: זֶרַע என்பதன் நேர்ப்பொருள் ‘விதை’; இங்கு அது பின்வரும் தலைமுறையினரைச் சுட்டுகிறது. ‘சந்ததி’ என்பது இயல்பான, கண்ணியமான தமிழ் வழக்கு.
- source_word: בַּגּוֹיִם
  choice: பிற நாடுகளின் நடுவே
  rationale: גּוֹיִם இங்கு இஸ்ரவேலுக்கு வெளியேயுள்ள நாடுகளைச் சுட்டுகிறது. ‘புறவினத்தார்’ போன்ற பிற்கால சமய நுண்பொருளை ஏற்றாமல், சூழலுக்குரிய அந்நியத் தன்மையை ‘பிற நாடுகள்’ வெளிப்படுத்துகிறது.
- source_word: וּלְזָרוֹתָם
  choice: அவர்களைச் சிதறடிக்கவும்
  rationale: זרה என்பதற்கு ‘தூற்றுதல்’ அல்லது ‘சிதறடித்தல்’ என்று பொருள் வரலாம். பல தேசங்களுக்கு இடையே பரப்பப்படுவதைக் குறிக்கும் இச்சூழலில் ‘சிதறடிக்க’ பொருத்தமானது.
- source_word: בָּאֲרָצוֹת
  choice: பல தேசங்களில்
  rationale: אֶרֶץ என்பதன் பன்மை பல நிலப்பகுதிகள் அல்லது நாடுகளைக் குறிக்கிறது. ‘பல தேசங்களில்’ என்பது பரந்த புவியியல் சிதறலை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: கூறப்படும் நியாயத்தீர்ப்பின் தன்மை
  choice: இந்த வசனம் சந்ததியினரின் வீழ்ச்சியையும் பிற நாடுகள் மற்றும் தேசங்களுக்கிடையேயான சிதறலையும் கூறுகிறது.
  alternative: முதல் கூறை, அவர்களுடைய சந்ததியினர் பிற நாடுகளிடையே இறக்கச் செய்தல் அல்லது தோற்கடிக்கப்படுதல் என்று மேலும் குறிப்பாகப் புரிந்துகொள்ளலாம்.
  rationale: נפל என்பதன் காரணவினை உடல் மரணத்தை மட்டும் குறிக்காமல் விரிந்த பொருளைக் கொண்டது. அடுத்த இணைக் கூறு சிதறடித்தலைச் சொல்வதால், மொழிபெயர்ப்பு பொருளை மரணம் அல்லது படைத்தோல்வு என்று குறுக்காமல் மூலத்தின் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. காரணவினை அமைப்பும் இரு இணையான நோக்கக் கூறுகளும் காக்கப்பட்டுள்ளன; தேவையற்ற சமய மரபுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
