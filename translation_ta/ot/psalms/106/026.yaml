source:
  edition: WLC
  text: וַ/יִּשָּׂ֣א יָד֣/וֹ לָ/הֶ֑ם לְ/הַפִּ֥יל א֝וֹתָ֗/ם בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/026.yaml
  text: So he raised his hand against them[a], to make them fall in the wilderness.
translation:
  language: ta
  text: ஆகவே, அவர்களைப் பாழ்நிலத்தில் வீழ்த்துவதற்காக அவர்களுக்கு எதிராகத் தமது கையை உயர்த்தினார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுக்கு எதிராகச் சத்தியம் செய்தார்.” “கையை உயர்த்துதல்” என்ற எபிரேய மரபுத்தொடர், குறிப்பாக நியாயத்தீர்ப்புச் சூழலில், சத்தியம் செய்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: உயர்த்தினார்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘உயர்த்துதல்’. ‘கையை உயர்த்தினார்’ என்ற எபிரேய உருவகத்தை முதன்மை உரையில் தக்கவைக்கிறது.
- source_word: יָדוֹ
  choice: தமது கையை
  rationale: ஒருமை உடைமைப் பின்னொட்டு சூழலில் தேவனைக் குறிக்கிறது; மரியாதை ஒருமைக்கேற்ப ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לָהֶם
  choice: அவர்களுக்கு எதிராக
  rationale: לְ என்பதன் அடிப்படை உறவுப்பொருள் ‘அவர்களுக்கு’ என்றாலும், கை உயர்த்தும் இச்சூழலில் எதிரான நியாயத்தீர்ப்பு நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்த ‘எதிராக’ தேவைப்படுகிறது.
- source_word: לְהַפִּיל
  choice: வீழ்த்துவதற்காக
  rationale: נפל வினையின் ஹிஃபில் வடிவம் காரணவினைப் பொருளான ‘விழச் செய்தல்/வீழ்த்துதல்’ என்பதைக் கொண்டது; நோக்கத்தைக் காட்டும் לְ முன்னொட்டையும் ‘-வதற்காக’ வெளிப்படுத்துகிறது.
- source_word: אוֹתָם
  choice: அவர்களை
  rationale: நேரடிச் செயப்படுபொருள் பன்மைப் பெயர்ப்பதிலியை இயல்பாக மொழிபெயர்க்கிறது.
- source_word: בַּמִּדְבָּר
  choice: பாழ்நிலத்தில்
  rationale: מִדְבָּר என்பது குடியிருப்பற்ற வனாந்தரப் பகுதியைக் குறிக்கிறது. ‘பாழ்நிலம்’ நவீனத் தமிழில் தெளிவாக இருந்து, மணற்பாலை என்ற அளவுக்கு பொருளைக் குறுக்காது.
theological_decisions:
- issue: ‘கையை உயர்த்தினார்’ என்ற சொற்றொடரின் இடியோமப் பொருள்
  choice: எபிரேய உருவகத்தை முதன்மை உரையில் தக்கவைத்து, சத்தியம் செய்தார் என்ற சாத்தியத்தை அடிக்குறிப்பில் தருதல்
  alternative: அவர்களுக்கு எதிராகச் சத்தியம் செய்தார்
  rationale: இச்சொற்றொடர் தேவன் வழங்கிய கடுமையான தீர்ப்பை உறுதிப்படுத்தும் சத்தியச் சைகையைக் குறிக்கக்கூடும். ஆனால் எபிரேய உரை வெளிப்படையாக ‘சத்தியம் செய்தார்’ என்று சொல்லாததால், உண்மையான பொருள் நிச்சயமின்மையைத் தீர்த்துவிடாமல் உருவகம் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான நடை. தேவனைக் குறிக்கும் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. எபிரேயச் சொற்றொடரின் உருவகமும் அதன் சத்தியம்/நியாயத்தீர்ப்பு சார்ந்த பொருள் நிச்சயமின்மையும் பாதுகாக்கப்பட்டுள்ளன.
