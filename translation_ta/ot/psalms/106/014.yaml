  text: וַ/יִּתְאַוּ֣וּ תַ֭אֲוָה בַּ/מִּדְבָּ֑ר וַ/יְנַסּוּ אֵ֝֗ל בִּֽ/ישִׁימֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/014.yaml
  text: But they craved intensely in the wilderness[b][a], and tested God in the wasteland.
translation:
  language: ta
  text: ஆனால் அவர்கள் வனாந்தரத்தில் தீவிரமாக ஆசைப்பட்டார்கள்[a]; பாழ்நிலத்தில் கடவுளைச் சோதித்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “ஓர் ஆசையை ஆசைப்பட்டார்கள்”; ஒரே வேரைச் சேர்ந்த வினைச்சொல்லும் பெயர்ச்சொல்லும் சேர்ந்து அவர்களுடைய ஆசையின் தீவிரத்தை வலியுறுத்துகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  choice: தீவிரமாக ஆசைப்பட்டார்கள்
  rationale: வினைச்சொல்லுடன் அதே வேரைச் சேர்ந்த பெயர்ச்சொல் சேர்ந்து ஆசையின் தீவிரத்தை வலியுறுத்துகிறது. தமிழில் இயல்பாகவும் மூலத்தின் வலிமையுடனும் இருக்க ‘தீவிரமாக ஆசைப்பட்டார்கள்’ என மொழிபெயர்க்கப்பட்டது; பாலியல் பொருளைத் தேவையின்றி உணர்த்தக்கூடிய சொல்லைத் தவிர்க்கிறது.
- source_word: בַּמִּדְבָּר
  choice: வனாந்தரத்தில்
  rationale: מִדְבָּר என்பது மக்கள் குடியிருப்பு குறைந்த வறண்ட வனாந்தரப் பகுதியைக் குறிக்கிறது. இஸ்ரவேலின் வனாந்தர அனுபவத்துடனான வேதாகமத் தொடர்பையும் இச்சொல் காக்கிறது.
- source_word: וַיְנַסּוּ
  choice: சோதித்தார்கள்
  rationale: נסה இங்கு ஒருவரைச் சோதனைக்கு உட்படுத்துதல் அல்லது பரிசோதித்தல் என்ற பொருளுடையது. ‘சோதித்தார்கள்’ என்பது சுருக்கமாகவும் சூழலின் எதிர்மறைத் தொனியை அளிக்கவும் செய்கிறது.
- source_word: אֵל
  choice: கடவுளை
  rationale: אֵל என்பது இங்கு பொதுவான தெய்வீகப் பட்டமாக இருப்பதால் நவீனத் தமிழில் தெளிவான ‘கடவுள்’ பயன்படுத்தப்பட்டது.
- source_word: בִּישִׁימוֹן
  choice: பாழ்நிலத்தில்
  rationale: יְשִׁימוֹן பாழான, வெறிச்சோடிய நிலப்பகுதியைக் குறிக்கிறது. முந்தைய מִדְבָּר என்பதிலிருந்து மூலத்தில் உள்ள சொல்வேறுபாட்டைக் காக்க ‘பாழ்நிலம்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: எபிரெய cognate accusative அமைப்பைச் சொல்லுக்குச் சொல் தருவதா அல்லது இயல்பான தீவிரப்பொருளாகத் தருவதா
  choice: ‘தீவிரமாக ஆசைப்பட்டார்கள்’ என்று இயல்பான வலியுறுத்தலாக மொழிபெயர்த்தல்
  alternative: ‘ஓர் ஆசையை ஆசைப்பட்டார்கள்’ அல்லது ‘பேராசைப்பட்டார்கள்’
  rationale: எபிரெயச் சொற்றொடர் ஆசையின் தீவிரத்தை வலியுறுத்துகிறது. இயல்பற்ற மறுபடியுரைத்தலைத் தவிர்த்து அந்த வலிமையைத் தமிழில் காக்கிறது; ‘பேராசை’ என மொழிபெயர்த்து பேராசைத் தன்மையை மூலத்தைவிட வெளிப்படையாகச் சேர்ப்பதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான வேதாகம நடையைப் பயன்படுத்துகிறது. ‘வனாந்தரம்’ மற்றும் ‘பாழ்நிலம்’ மூலம் இரு வேறு எபிரெய இடச்சொற்களின் வேறுபாடு காக்கப்பட்டுள்ளது.
