source:
  edition: WLC
  text: מִ֗י יְ֭מַלֵּל גְּבוּר֣וֹת יְהוָ֑ה יַ֝שְׁמִ֗יעַ כָּל תְּהִלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/002.yaml
  text: Who can recount the mighty deeds of Yahweh[b][a], or proclaim all his praise?
translation:
  language: ta
  text: யாவேயின் வல்லமைமிக்க செயல்களை யாரால் விவரித்துச் சொல்ல முடியும்? அவருக்குரிய புகழை முழுவதும் யாரால் அறிவிக்க முடியும்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அறிவிக்க” என்பதன் நேரடிப் பொருள் “கேட்கச் செய்ய” என்பதாகும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: யாரால் ... முடியும்?
  rationale: எபிரெய வினாவிடைச் சொல் இங்கு மனிதரின் இயலாமையை உணர்த்தும் சொல்லாட்சிக் கேள்வியைத் தொடங்குகிறது; நவீன தமிழில் திறனை இயல்பாக வெளிப்படுத்தும் வடிவம்.
- source_word: יְמַלֵּל
  choice: விவரித்துச் சொல்ல
  rationale: Piel வடிவம் வெளிப்படையாக எடுத்துரைத்தல் அல்லது வரிசையாகச் சொல்லுதல் என்ற பொருளைத் தருகிறது; வல்லமைமிக்க செயல்களைப் பற்றிய சூழலில் இத்தேர்வு இயல்பானது.
- source_word: גְּבוּרוֹת
  choice: வல்லமைமிக்க செயல்கள்
  rationale: பன்மைச் சொல் வலிமையின் வெளிப்பாடுகளான வல்ல செயல்களைக் குறிக்கிறது; வெறும் பண்பாக அல்லாமல் செயல்களாகவே மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றாக இடாமல், எபிரெய தனிப்பெயரான நான்கெழுத்துப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: יַשְׁמִיעַ
  choice: அறிவிக்க
  rationale: Hiphil வடிவத்தின் நேரடிப் பொருள் ‘கேட்கச் செய்தல்’; பொதுவாக வெளிப்படையாகச் சொல்லும் கருத்தைத் தமிழில் ‘அறிவிக்க’ இயல்பாகக் கடத்துகிறது.
- source_word: כָּל
  choice: முழுவதும்
  rationale: இறைவனுக்குரிய புகழின் முழுமையை மனிதனால் முற்றிலும் எடுத்துரைக்க இயலாது என்ற எபிரெயச் சொல்லின் மொத்தப்படுத்தும் வலிமையைப் பாதுகாக்கிறது.
- source_word: תְּהִלָּתוֹ
  choice: அவருக்குரிய புகழை
  rationale: ஒருமை வடிவத்தைப் பாதுகாத்து, அவரைப் புகழ்வதற்குரிய அனைத்தையும் கூட்டாகக் குறிக்கும் இயல்பான தமிழை வழங்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அந்த வேறுபாட்டைப் பாதுகாக்கத் தமிழில் ஒலிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் சாதாரண வாசகருக்கும் தெளிவான நடை. இணையான இரு சொல்லாட்சிக் கேள்விகளும் மூலத்தின் கவிதை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
