translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘மூடிக்கொண்டது’ என்ற சொல் செங்கடல் நிகழ்வின் காட்சியையும் எபிரெய வினையின் அடிப்படைப் பொருளையும் காக்கிறது.
