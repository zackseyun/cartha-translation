    reason: lexical_alternative
  - marker: b
    text: சொல்லாட்சிப்படி, “அவர்களில் ஒருவர் மீந்திருக்கவில்லை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַסּוּ
  choice: மூடிக்கொண்டது
  rationale: כסה என்பதன் அடிப்படைப் பொருளான ‘மூடுதல்’ என்பதைக் காக்கிறது; ‘மூழ்கடித்தது’ என்பது சூழலுக்குப் பொருத்தமானாலும் சற்றே விளக்கமளிக்கும் மொழிபெயர்ப்பு.
- source_word: מַיִם
  choice: நீர்
  rationale: எபிரெயத்தில் பன்மை வடிவம் இருந்தாலும், குறிப்பிட்ட கடல்நீரைக் குறிக்க நவீனத் தமிழில் ‘நீர்’ என்பது இயல்பான கூட்டுப்பெயர்.
- source_word: צָרֵיהֶם
  choice: அவர்களுடைய பகைவர்கள்
  rationale: צר என்பது பகைமை கொண்ட எதிராளிகளைக் குறிக்கிறது; ‘பகைவர்கள்’ இயல்பாகவும் மூலத்தின் பகைமைப் பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: אֶחָד מֵהֶם
  choice: அவர்களில் ஒருவர்கூட
  rationale: சொல்லாட்சிப்படி ‘அவர்களில் ஒருவர்’; எதிர்மறை வாக்கியத்தில் ‘ஒருவர்கூட’ என்பது ஒருவரும் விதிவிலக்காக இல்லை என்ற முழுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לֹא נוֹתָר
  choice: மீந்திருக்கவில்லை
  rationale: יתר என்பதன் நிஃபால் வடிவம் ‘மீதியாக இருத்தல், மீந்திருத்தல்’ என்று பொருள்படும்; ‘உயிர்தப்பவில்லை’ என்பதைவிட இது மூலச் சொல்லுக்கு நெருக்கமானது.
