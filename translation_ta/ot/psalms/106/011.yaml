  yaml_path: translation/ot/psalms/106/011.yaml
  text: The waters covered their adversaries[b][a]; not one of them remained.
translation:
  language: ta
  text: நீர் அவர்களுடைய பகைவர்களை[a] மூடிக்கொண்டது; அவர்களில் ஒருவர்கூட மீந்திருக்கவில்லை.[b]
  philosophy: optimal-equivalence
