  yaml_path: translation/ot/psalms/106/013.yaml
  text: They quickly forgot his works[a]; they did not wait for his counsel.
translation:
  language: ta
  text: அவர்கள் விரைவிலேயே அவருடைய செயல்களை மறந்தார்கள்; அவருடைய ஆலோசனைக்காகக் காத்திருக்கவில்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவருடைய திட்டத்திற்காக’ அல்லது ‘அவருடைய நோக்கத்திற்காக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהֲרוּ
  choice: விரைவிலேயே
  rationale: מהר என்பதன் வேகம் அல்லது அவசரத்தை இயல்பான தமிழில் வினையடைபோல் வெளிப்படுத்துகிறது; வெறும் காலவரிசையைக் காட்டும் ‘சீக்கிரமே’ என்பதைவிட செயலில் இருந்த அவசரத்தையும் உணர்த்துகிறது.
- source_word: שָׁכְחוּ
  choice: மறந்தார்கள்
  rationale: שכח என்பதன் Qal perfect 3cp வடிவத்திற்கான நேரடியான, இயல்பான இறந்தகால மொழிபெயர்ப்பு.
- source_word: מַעֲשָׂיו
  choice: அவருடைய செயல்களை
  rationale: מעשה என்பது செயல்கள் அல்லது கிரியைகள் என்பதைக் குறிக்கிறது. ‘செயல்கள்’ நவீனத் தமிழில் தெளிவாகவும், கடவுள் செய்தவற்றைக் குறிக்கும் அளவுக்குப் பரந்ததாகவும் உள்ளது.
- source_word: לֹא
  choice: இல்லை
  rationale: இறந்தகால வினையுடன் இணைந்து எபிரேய மறுப்பை இயல்பான தமிழில் ‘காத்திருக்கவில்லை’ என வெளிப்படுத்துகிறது.
- source_word: חִכּוּ
  choice: காத்திருக்கவில்லை
  rationale: חכה என்பதன் முதன்மைப் பொருளான ‘காத்திருத்தல்’ என்பதைத் தக்கவைக்கிறது; இச்சூழலில் ‘நம்பிக்கையாயிருத்தல்’ என்பதைக் காட்டிலும் பொருத்தமானது.
- source_word: לַעֲצָתוֹ
  choice: அவருடைய ஆலோசனைக்காக
  rationale: עצה என்பதிலுள்ள ஆலோசனை, திட்டம், நோக்கம் ஆகிய பொருள் வாய்ப்புகளில் ‘ஆலோசனை’ அதன் உறவுசார் வழிநடத்தல் நுணுக்கத்தையும் பொருள் அகலத்தையும் தக்கவைக்கிறது.
theological_decisions:
- issue: இச்சூழலில் கடவுளுடைய עֵצָה என்பதன் பொருள்
  choice: அவருடைய ஆலோசனை
  alternative: அவருடைய திட்டம் / அவருடைய நோக்கம்
  rationale: இஸ்ரவேலர் கடவுளுடைய வழிநடத்தலுக்காகக் காத்திருக்காததையே வசனம் கண்டிக்கிறது. ‘ஆலோசனை’ என்பது கடவுளுடைய தீர்மானத்தை ஒரு குறிப்பிட்ட கோட்பாட்டுப் பொருளுக்குள் சுருக்காமல், உறவுசார் வழிநடத்தலையும் திட்டம் அல்லது நோக்கம் என்ற சாத்தியங்களையும் திறந்தவையாக வைத்திருக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழ் நடையில், கவிதைச் சுருக்கத்தையும் இரண்டு இணையான வாக்கியப் பகுதிகளையும் காக்கும் மொழிபெயர்ப்பு. ‘அவருடைய’ என்ற மரியாதை ஒருமை வடிவம் கடவுளைக் குறிக்க இயல்பாகப் பயன்படுத்தப்பட்டுள்ளது.
