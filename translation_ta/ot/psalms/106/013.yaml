  source_fidelity: மִהֲרוּ–שָׁכְחוּ என்பதன் ‘விரைவிலேயே ... மறந்தார்கள்’ என்ற பொருளையும், מַעֲשָׂיו என்பதன் பன்மை ‘அவருடைய செயல்களை’ என்பதையும் மொழிபெயர்ப்பு துல்லியமாகக் காக்கிறது. לֹא חִכּוּ לַעֲצָתוֹ என்பதும் ‘அவருடைய ஆலோசனைக்காகக் காத்திருக்கவில்லை’ என இயல்பாகவும், மூலத்தின் திறந்த பொருள் வரம்பைச் சுருக்காமலும் தரப்பட்டுள்ளது.
