source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד פִּֽ֭ינְחָס וַ/יְפַלֵּ֑ל וַ֝/תֵּעָצַ֗ר הַ/מַּגֵּפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/030.yaml
  text: Then Phinehas stood up and interceded[a], and the plague was stopped.
translation:
  language: ta
  text: அப்போது பினெகாஸ் எழுந்து தலையிட்டார்[a]; கொள்ளைநோய் நிறுத்தப்பட்டது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நியாயத்தீர்ப்பை நிறைவேற்றினார்’; வேறொரு பொருள், ‘மன்றாடினார்.’ இங்குள்ள எபிரெய வினைச்சொல் நீதித்தீர்ப்பு சார்ந்த அல்லது பரிந்து மன்றாடுதல் சார்ந்த பொருளைக் கொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: எழுந்து
  rationale: עמד என்பதன் அடிப்படைப் பொருள் ‘நிற்றல்’ அல்லது ‘எழுதல்.’ இக்கதைத் தொடரில் உறுதியான செயலில் இறங்குவதை இயல்பான தமிழில் ‘எழுந்து’ வெளிப்படுத்துகிறது.
- source_word: פִּינְחָס
  choice: பினெகாஸ்
  rationale: எபிரெய தனிப்பெயருக்கான தமிழாக்க ஒலிபெயர்ப்பு.
- source_word: וַיְפַלֵּל
  choice: தலையிட்டார்
  rationale: இந்த வினைச்சொல் இவ்விடத்தில் நீதித்தீர்ப்பு நிறைவேற்றுதல் அல்லது ஒருவருக்காக மன்றாடுதல் சார்ந்த பொருளைக் கொள்ளக்கூடும். எண்ணாகமம் 25:7–8-ஐச் சுட்டும் பின்னணியில், எந்த ஒரு பொருளையும் மட்டும் திணிக்காமல் இரு சாத்தியங்களையும் உள்ளடக்கக்கூடிய இயல்பான தமிழ்ச் சொல்லாக ‘தலையிட்டார்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וַתֵּעָצַר
  choice: நிறுத்தப்பட்டது
  rationale: עצר என்பதன் நிபால் வடிவம் இங்கு தடுத்து நிறுத்தப்படுதலைக் குறிக்கிறது; ‘நிறுத்தப்பட்டது’ தெளிவான நவீனத் தமிழ்.
- source_word: הַמַּגֵּפָה
  choice: கொள்ளைநோய்
  rationale: מגפה என்பது உயிர்க்கொல்லி நோய்ப்பரவல் அல்லது வாதையைக் குறிக்கிறது. எண்ணாகமம் 25 பின்னணிக்கும் பொதுவாசகருக்கும் ‘கொள்ளைநோய்’ பொருத்தமானது.
theological_decisions:
- issue: פָּלַל வினைச்சொல்லின் பொருளும் பினெகாஸின் செயலும்
  choice: முதன்மை உரையில் விரிவான பொருளுடைய ‘தலையிட்டார்’
  alternative: ‘நியாயத்தீர்ப்பை நிறைவேற்றினார்’ அல்லது ‘மன்றாடினார்’
  rationale: சங்கீதம் எண்ணாகமம் 25-ஐ நினைவூட்டுகிறது; அங்கு பினெகாஸின் உறுதியான செயல் கொள்ளைநோயை நிறுத்துகிறது. எனினும் இங்குள்ள எபிரெயச் சொல் நீதித்தீர்ப்பு சார்ந்த அல்லது பரிந்து மன்றாடுதல் சார்ந்த பொருளைக் கொள்ளலாம். அந்த விளக்க இறுக்கத்தைத் தீர்த்துவிடாமல் முதன்மை உரையில் பொதுவான சொல்லும் அடிக்குறிப்பில் மாற்றுப் பொருள்களும் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன தரநிலைத் தமிழில் சுருக்கமான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘எழுந்து தலையிட்டார்’ என்பது செயலின் உறுதியை இயல்பாகக் காட்டுகிறது; அடிக்குறிப்பு மூலமொழியின் உண்மையான பொருள் மயக்கத்தைப் பாதுகாக்கிறது.
