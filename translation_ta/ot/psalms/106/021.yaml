  yaml_path: translation/ot/psalms/106/021.yaml
  text: They forgot God their Savior[a], who had done great things in Egypt.
translation:
  language: ta
  text: அவர்கள் எகிப்தில் மகத்தான செயல்களைச் செய்த தங்கள் மீட்பரான கடவுளை[a] மறந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்களை விடுவிப்பவரான கடவுளை.’ எபிரேய வினையெச்சம் கடவுளை அவர்களை மீட்பவராக, அல்லது விடுவிப்பவராக, அடையாளப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְחוּ
  choice: அவர்கள் மறந்தார்கள்
  rationale: שׁכח என்பதன் Qal perfect 3cp வடிவம், சங்கீதத்தின் வரலாற்று விவரிப்பில் முடிந்துபோன கடந்தகாலச் செயலைக் குறிக்கிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இச்சூழலில் אֵל இஸ்ரயேலின் கடவுளைக் குறிக்கும் தெய்வப் பெயராக வருகிறது; தனியாக ‘வல்லவர்’ என்ற வலியுறுத்தலைச் சேர்க்காமல் இயல்பாக மொழிபெயர்க்கிறது.
- source_word: מוֹשִׁיעָם
  choice: தங்கள் மீட்பரான
  rationale: ישׁע என்பதன் Hiphil participle, மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன், ‘அவர்களை மீட்பவர்’ அல்லது ‘அவர்களின் மீட்பர்’ எனப் பொருள்படும். ‘மீட்பர்’ என்பது கடவுளின் தொடர்ந்த பண்பையும் பங்கையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: עֹשֶׂה
  choice: அவரே ... செய்தவர்
  rationale: עשה என்பதன் Qal participle கடவுளை விவரிக்கிறது. தமிழில் ‘செய்தவர்’ என்ற தொடர்புடைய பெயரெச்ச அமைப்பு, அவர்கள் மறப்பதற்கு முன் எகிப்தில் நிகழ்ந்த செயல்களை இயல்பாகக் குறிக்கிறது; ‘அவரே’ முன்சொல்லுடன் உள்ள தொடர்பைத் தெளிவாக்குகிறது.
- source_word: גְדֹלֹות
  choice: பெரிய செயல்கள்
  rationale: גדול என்பதன் பெயர்ச்சொல்லாகப் பயன்படும் பன்மை வடிவம்; கடவுளின் மகத்தான செயல்களை இயல்பான நவீன தமிழில் குறிக்கிறது.
- source_word: בְּמִצְרָיִם
  choice: எகிப்தில்
  rationale: בְּ இங்கு இடத்தைக் குறிக்கிறது; ஆகவே ‘எகிப்தில்’ என்பது நேரடியான இயல்பான மொழிபெயர்ப்பு.
theological_decisions:
- issue: אֵל என்ற தெய்வப் பெயரின் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: வல்லவர் / வல்லமையுள்ள கடவுள்
  rationale: இவ்வசனத்தில் தனிப்பட்ட தெய்வீக வல்லமையைப் பட்டப்பெயராக வலியுறுத்துவதைவிட, இஸ்ரயேல் மறந்த கடவுளை அடையாளப்படுத்துவதே முதன்மை. எனவே கூடுதல் வலியுறுத்தலை இறக்குமதி செய்யாமல் ‘கடவுள்’ என வழங்கப்பட்டுள்ளது.
- issue: מוֹשִׁיעָם என்பதில் மீட்பு அல்லது விடுதலை என்ற நுணுக்கம்
  choice: தங்கள் மீட்பர்
  alternative: தங்களை விடுவிப்பவர்
  rationale: எபிரேய participle கடவுளை அவர்களை மீட்பவராக அடையாளப்படுத்துகிறது. ‘மீட்பர்’ அந்தப் பங்கைக் கண்ணியமாகவும் சுருக்கமாகவும் தருகிறது; ‘விடுவிப்பவர்’ என்ற நிகழ்வுசார் நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேய வாக்கியத்தின் கடவுள்—மீட்பர்—பெரிய செயல்களைச் செய்தவர் என்ற தொடர்பு இயல்பான தமிழ் தொடரில் பாதுகாக்கப்பட்டுள்ளது.
