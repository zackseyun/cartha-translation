  source_fidelity: 'மூல எபிரெயத்தின் கூறுகள் அனைத்தும் துல்லியமாகக் காக்கப்பட்டுள்ளன: וַיֵּרָגְנוּ என்பதன் அதிருப்தியான முணுமுணுப்பு, בְאָהֳלֵיהֶם என்பதன் ‘தங்கள் கூடாரங்களில்’ என்ற நேரடிக் காட்சி, மற்றும் לֹא שָׁמְעוּ בְּקוֹל יְהוָה என்பதன் ‘யாவேயின் குரலுக்குச் செவிகொடுக்கவில்லை’ என்ற செவிவழி உருவகம். ‘செவிகொடுக்கவில்லை’ கீழ்ப்படியாமையை வலுக்கட்டாயமாக வெளிப்படையாக்காமல் உட்கருத்தாகத் தக்கவைக்கிறது.'
