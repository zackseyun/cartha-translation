reference: Psalms 106:25
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יֵּרָגְנ֥וּ בְ/אָהֳלֵי/הֶ֑ם לֹ֥א שָׁ֝מְע֗וּ בְּ/ק֣וֹל יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/025.yaml
  text: So they grumbled in their tents[b][a]; they did not listen to the voice of Yahweh.
translation:
  language: ta
  text: அவர்கள் தங்கள் கூடாரங்களில் முறுமுறுத்தினர்[a]; யாவேயின் குரலுக்குச் செவிகொடுக்கவில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘முணுமுணுத்தனர்’ அல்லது ‘குறைசொன்னார்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் அதிருப்தியுடன் மெதுவாகக் குறைகூறுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘யாவேயின் குரலுக்குக் கீழ்ப்படியவில்லை’ என்றும் மொழிபெயர்க்கலாம். ‘குரலுக்குச் செவிகொடு’ என்ற எபிரெய மரபுத்தொடர் கவனித்து ஏற்றுக்கொள்வது அல்லது கீழ்ப்படிவது என்ற பொருளையும் தரலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרָגְנוּ
  choice: முறுமுறுத்தினர்
  rationale: רגן என்பது அதிருப்தியுடன் முணுமுணுத்துக் குறைகூறுவதைக் குறிக்கிறது. ‘முறுமுறுத்தினர்’ அதன் அடக்கமான எதிர்ப்புணர்வையும் எதிர்மறைத் தொனியையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְאָהֳלֵיהֶם
  choice: தங்கள் கூடாரங்களில்
  rationale: אֹהֶל என்பதன் நேர்ப்பொருள் ‘கூடாரம்.’ வனாந்தரச் சூழலின் தெளிவான உருவகத்தைப் பொதுமைப்படுத்தாமல் காக்கிறது.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: குரலுக்குச் செவிகொடுக்கவில்லை
  rationale: שׁמע בקול என்ற எபிரெய மரபுத்தொடர் கேட்டல் மட்டுமல்ல, கவனித்து ஏற்றுக்கொள்ளுதல் அல்லது கீழ்ப்படிதல் என்ற கருத்தையும் தாங்குகிறது. ‘செவிகொடுக்கவில்லை’ குரல் சார்ந்த உருவகத்தையும் உட்கருத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப் பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: שׁמע בקול என்பதிலுள்ள கேட்டல்–கீழ்ப்படிதல் தொடர்பு
  choice: குரலுக்குச் செவிகொடுக்கவில்லை
  alternative: குரலுக்குக் கீழ்ப்படியவில்லை
  rationale: ‘செவிகொடுக்கவில்லை’ என்பது மூலத்தின் செவிவழி உருவகத்தைத் தக்கவைத்து, கவனித்து நடக்க மறுத்ததையும் உணர்த்துகிறது; ‘கீழ்ப்படியவில்லை’ என்பது உட்கருத்தை வெளிப்படையாக்கினாலும் மூல உருவகத்தை நீக்கிவிடும்.
- issue: יהוה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனம் பட்டப்பெயரை அல்ல, தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துகிறது. ஆகவே அந்த வேறுபாடு ஒலிபெயர்ப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, பொதுவாகப் புரியக்கூடிய, மரியாதைமிக்க தமிழ் நடை பயன்படுத்தப்பட்டுள்ளது. ‘கூடாரங்கள்’ என்ற concrete wilderness image காக்கப்பட்டுள்ளது; ‘செவிகொடுக்கவில்லை’ மூலம் மூல மொழியின் உருவகமும் கீழ்ப்படியாமையின் உட்கருத்தும் ஒன்றாகப் பாதுகாக்கப்பட்டுள்ளன.
