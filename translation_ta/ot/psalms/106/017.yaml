lexical_decisions:
- source_word: תִּפְתַּח
  choice: பிளந்து
  rationale: פתח என்பதன் அடிப்படைப் பொருள் ‘திறத்தல்’. இங்கு பூமி தன்னைத் திறந்த நிகழ்வை இயல்பான நவீனத் தமிழில் ‘பிளந்து’ என்பது தெளிவாகவும் சூழலுக்கு ஏற்றவாறும் வெளிப்படுத்துகிறது; ‘திறந்து’ என்பதும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֶרֶץ
  choice: பூமி
  rationale: இங்கு நிலப்பரப்பையோ நாட்டையோ அல்ல, கலகக்காரர்களின் கீழ் திறந்த பூமி/தரையையே குறிக்கிறது. ‘பூமி’ கவிதைநயத்தையும் நிகழ்வின் தீவிரத்தையும் காக்கிறது.
- source_word: וַתִּבְלַע
  choice: விழுங்கியது
  rationale: בלע என்பதன் நேரடியான பொருள் ‘விழுங்குதல்’; தொடர்ச்சியாக நிகழ்ந்த இறந்தகாலச் செயலைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: דָּתָן
  choice: தாத்தான்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழ் எழுத்துமுறையில் அண்மையாகப் பெயர்த்தெழுதுகிறது.
- source_word: וַתְּכַס עַל
  choice: மூடியது
  rationale: כסה உடன் עַל வருவது ஒருவர்மேல் மூடப்படுதலைக் குறிக்கிறது. ‘மூடியது’ தமிழில் இயல்பானது; பூமி அவர்கள்மேல் மூடியது என்ற கருத்து சூழலால் தெளிவாகிறது.
- source_word: עֲדַת
  choice: கூட்டம்
  rationale: עֵדָה என்பதன் construct வடிவம் ஒரு குறிப்பிட்ட குழு அல்லது கூட்டத்தைக் குறிக்கிறது. ‘கூட்டம்’ என்பது திருச்சபை சார்ந்த சிறப்புப் பொருளைத் தேவையின்றி புகுத்தாமல், சாதாரண வாசகருக்குத் தெளிவாக உள்ளது.
- source_word: אֲבִירָם
  choice: அபிராம்
  rationale: எபிரெயத் தனிப்பெயரின் ஒலியைத் தமிழ் எழுத்துமுறையில் அண்மையாகப் பெயர்த்தெழுதுகிறது.
theological_decisions:
- issue: எண்ணாகமம் 16-இல் உள்ள விரிவான நிகழ்வுடன் இவ்வசனத்தின் உறவு
  choice: சங்கீதத்தின் சுருக்கமான கவிதை விவரிப்பை மட்டும் மொழிபெயர்த்தல்
  alternative: எண்ணாகமத்தின் அடிப்படையில் குடும்பத்தார் அல்லது மற்ற கலகக்காரர்கள் பற்றிய விவரங்களைச் சேர்த்தல்
  rationale: எபிரெய வசனம் தாத்தானையும் அபிராமின் கூட்டத்தையும் மட்டுமே குறிப்பிடுகிறது. மூலத்தில் இல்லாத விவரங்களை மொழிபெயர்ப்பில் சேர்க்காமல், தொடர்புடைய பின்னணியை அடிக்குறிப்பில் சுட்டுவது பொருத்தமானது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரண்டு இணையான செயல்களும் இறந்தகாலத்தில் தரப்பட்டுள்ளன. ‘பிளந்து’ என்பது தமிழ் வழக்கில் இயல்பாக இருக்க, ‘திறந்து’ என்ற நேரடி மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
