lexical_decisions:
- source_word: וַיִּתֵּן
  choice: கொடுத்தார்
  rationale: נתן என்பதன் நேரடியான பொருள் ‘கொடு’; சூழலில் ‘அருளினார்’ அல்லது ‘வழங்கினார்’ என்பதைவிட ‘கொடுத்தார்’ மூலத்தின் எளிமையைப் பேணுகிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் குறிக்கிறது.
- source_word: שֶׁאֱלָתָם
  choice: அவர்கள் கேட்டதை
  rationale: שאלה என்பது ‘வேண்டுகோள்’ அல்லது ‘கேட்ட பொருள்’ எனப் பொருள்படும். ‘அவர்கள் கேட்டதை’ என்பது தமிழில் தெளிவாகவும் இயல்பாகவும் இருந்து, வேண்டுகோள் நிறைவேற்றப்பட்டதையும் காட்டுகிறது.
- source_word: וַיְשַׁלַּח
  choice: ஆனால் ... அனுப்பினார்
  rationale: எழுத்துப்படி ‘அனுப்பினார்’; முதல் கூற்றுக்கும் அடுத்த நியாயத்தீர்ப்புக்கும் உள்ள எதிர்மறைத் தொடர்பை ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רָזוֹן
  choice: மெலிவு
  rationale: இச்சொல் மெலிவு, உடல் தேய்வு, வற்றிப்போதல் ஆகிய பொருள்களை உடையது. ‘மெலிவு’ உருவகத்தின் அகலத்தையும் மூலத்தின் சுருக்கத்தையும் பேணுகிறது.
- source_word: בְּנַפְשָׁם
  choice: அவர்களுடைய உயிரில்
  rationale: נפש என்பது உயிர், தன்னிலை, முழு ஆளுமை அல்லது பாரம்பரியமாக ‘ஆத்துமா’ எனப் பொருள்படலாம். இங்கு ‘உயிரில்’ என்பது நவீன தமிழில் இயல்பாக இருந்து, உடலற்ற ஆத்துமா என்ற குறுகிய கருத்தைத் திணிக்காமல் மூலத்தின் பரந்த பொருளைப் பேணுகிறது.
theological_decisions:
- issue: நியாயத்தீர்ப்புச் சூழலில் נֶפֶשׁ என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘உயிரில்’
  alternative: ‘ஆத்துமாவில்’, ‘அவர்களின் உள்ளார்ந்த வாழ்வில்’, அல்லது ‘அவர்களுக்குள்’
  rationale: எபிரெயச் சொல் மனிதனின் உயிர், தன்னிலை, முழு இருப்பு ஆகியவற்றைக் குறிக்க முடியும். ‘உயிரில்’ என்பது அதன் பரப்பை ஓரளவு காத்து, உடல்–ஆத்துமா பிரிவை உரைக்குள் தேவையின்றி இறக்குமதி செய்வதைத் தவிர்க்கிறது; அடிக்குறிப்பு மாற்றுப் பொருள்களைக் காட்டுகிறது.
- issue: இணைப்புச் சொல்லின் நியாயத்தீர்ப்பு சார்ந்த எதிர்மறைத் தொடர்பு
  choice: ‘ஆனால்’
  alternative: ‘மேலும்’ அல்லது ‘அப்பொழுது’
  rationale: எபிரெயில் வாவ் இணைப்பு இருந்தாலும், அவர்கள் கேட்டது கொடுக்கப்பட்டதற்கும் அதனுடன் வந்த மெலிவுக்கும் இடையே சூழல் தெளிவான எதிர்மறைத் திருப்பத்தை உருவாக்குகிறது. ‘ஆனால்’ அந்தத் தொடர்பை வெளிப்படுத்துகிறது; காரணத்தை மேலதிகமாக விளக்குவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடையில் வடிவமைக்கப்பட்டது. ‘ஆத்துமா’ என்பதற்குப் பதிலாக ‘உயிர்’ தேர்ந்தெடுக்கப்பட்டதால் மூலச் சொல்லின் பரந்த மனித-உயிர் பொருள் பாதுகாக்கப்படுகிறது. எதிர்மறைத் திருப்பைத் தெளிவாக்க அரைப்புள்ளியும் ‘ஆனால்’ என்பதும் பயன்படுத்தப்பட்டுள்ளன.
