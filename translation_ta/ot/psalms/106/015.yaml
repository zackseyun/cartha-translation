  text: So he gave them what they asked for[c][b][a], but sent leanness into their soul.
translation:
  language: ta
  text: அவர் அவர்களுக்கு அவர்கள் கேட்டதைக் கொடுத்தார்; ஆனால் அவர்களுடைய உயிரில்[a] மெலிவை[b] அனுப்பினார்.
  philosophy: optimal-equivalence
