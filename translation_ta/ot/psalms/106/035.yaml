  yaml_path: translation/ot/psalms/106/035.yaml
  text: but they mixed with the nations and learned their practices[a][b].
translation:
  language: ta
  text: ஆனால் அவர்கள் பிற இனத்தாரோடு கலந்துகொண்டு,[a] அவர்களுடைய செயல்களைக் கற்றார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பிற இனத்தாரிடையே கலந்து வாழ்ந்தார்கள்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், ‘அவர்களுடைய செயல்கள்’ அல்லது ‘அவர்களுடைய செய்கைகள்’; இங்கே பிற இனத்தாரின் வழக்கமான நடத்தைகளையும் செய்கைகளையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעָרְבוּ
  choice: கலந்துகொண்டு
  rationale: התפעל வடிவம் இங்கு சுற்றியிருந்த மக்களோடு சமூகமாகக் கலந்து உறவாடியதைக் குறிக்கிறது. நவீனத் தமிழில் ‘கலந்துகொண்டு’ என்பது இயல்பாகவும் சுருக்கமாகவும் உள்ளது; ஒருங்கிணைந்து அவர்களோடு கலந்து போன நுண்ணுணர்வையும் தக்கவைக்கிறது.
- source_word: בַגּוֹיִם
  choice: பிற இனத்தாரோடு
  rationale: גּוֹיִם என்பது இச்சூழலில் இஸ்ரவேலைச் சுற்றியிருந்த இஸ்ரவேலரல்லாத மக்கள் இனங்களைக் குறிக்கிறது. ‘பிற இனத்தார்’ என்பது பிற்கால சமயச் சாயலைத் தவிர்த்து, தமிழில் மனிதக் குழுக்களைக் குறிக்கும் இயல்பான சொற்றொடராக உள்ளது.
- source_word: וַיִּלְמְדוּ
  choice: பின்பற்றக் கற்றுக்கொண்டார்கள்
  rationale: קַל வடிவம் செய்பொருள் சார்ந்த ‘கற்றார்கள்’ என்ற பொருளைத் தருகிறது. தமிழில் ‘செயல்களைக் கற்றார்கள்’ என்பது தெளிவற்றதாக இருப்பதால், அந்த நடத்தைகளை ஏற்றுச் செய்வதைக் குறிக்க ‘பின்பற்றக் கற்றுக்கொண்டார்கள்’ என வழங்கப்பட்டது; செயலில் ஈடுபட்ட அவர்களுடைய பொறுப்பும் தக்கவைக்கப்படுகிறது.
- source_word: מַעֲשֵׂיהֶם
  choice: அவர்களுடைய செயல்களை
  rationale: מַעֲשִׂים என்பதன் நேரடியான பொருள் ‘செயல்கள்’ அல்லது ‘செய்கைகள்.’ அடுத்துவரும் வசனங்கள் அவை வழக்கமான சமய நடத்தைகளையும் உள்ளடக்கியதாகக் காட்டினாலும், மூலத்தின் பரந்த பொருளையும் பதற்றத்தையும் காக்க ‘செயல்கள்’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: பிற இனத்தாரோடு இஸ்ரவேலர் கொண்ட தொடர்பின் அற-சமயப் பொருள்
  choice: ‘கலந்துகொண்டு ... பின்பற்றக் கற்றுக்கொண்டார்கள்’ என்று, குற்றத்துக்குரிய ஒத்துப்போதலைச் சூழல் உணர்த்தும் வகையில் மொழிபெயர்த்தல்
  alternative: நடுநிலையாக ‘பிற இனத்தாரிடையே வாழ்ந்தார்கள்’ என்று கூறுதல் அல்லது தீவிரப்படுத்தி ‘தங்களைத் தீட்டுப்படுத்திக்கொண்டார்கள்’ என்று கூறுதல்
  rationale: எபிரெய உரை கலந்துகொண்டதையும் அவர்களுடைய செயல்களைக் கற்றதையும் மட்டும் நேரடியாகக் கூறுகிறது; எதிர்மறையான மதிப்பீட்டை சங்கீதத்தின் விரிந்த சூழல் அளிக்கிறது. ஆகவே மூலத்தில் இல்லாத கண்டனத்தைச் சேர்க்காமலும் அதன் குற்றப்பொறுப்பை மெலிதாக்காமலும் மொழிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. ‘புறஜாதியார்’ போன்ற பிற்கால சமயச் சாயலுள்ள சொல்லைத் தவிர்த்து ‘பிற இனத்தார்’ பயன்படுத்தப்பட்டது. முதன்மை உரையில் இயல்பான தமிழுக்காக ‘பின்பற்றக்’ சேர்க்கப்பட்டாலும், அடிக்குறிப்பில் எபிரெயின் நேரடி அமைப்பு தரப்பட்டுள்ளது.
