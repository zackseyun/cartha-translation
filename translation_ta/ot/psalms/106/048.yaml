base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/048.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. And let all the people say[b], “Amen!” Praise Yah!
translation:
  language: ta
  text: இஸ்ரவேலின் கடவுளாகிய யாவே[a], எக்காலத்திலிருந்தும் எக்காலம்வரை[b] போற்றப்படுவாராக! மக்கள் அனைவரும், “ஆமென்!” என்று சொல்லட்டும்.[c] யாவைப் போற்றுங்கள்![d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் யாவே என்பது கடவுளின் தனிப்பெயர்; பல மொழிபெயர்ப்புகள் இதை ‘ஆண்டவர்’ என்று வழங்குகின்றன.
    reason: divine_name
  - marker: b
    text: அல்லது, ‘நித்தியத்திலிருந்து நித்தியம் வரை’; ‘காலங்காலமாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “மக்கள் அனைவரும், ‘ஆமென்!’ என்று சொன்னார்கள்.” எபிரெய வினை வடிவம் இந்த வாசிப்பையும் அனுமதிக்கிறது; சூழல் அதை ஒரு வழிபாட்டு அழைப்பாகப் புரிந்துகொள்ள இடமளிக்கிறது.
    reason: textual_ambiguity
  - marker: d
    text: எபிரெயத்தில் ஹல்லெலூ யாஹ்; இது பாரம்பரியமாக ‘அல்லேலூயா’ என்று ஒலிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: கடவுளை நோக்கிய துதிப்பாடல் சூழலில் வரும் செயப்பாட்டு ஆசீர்வாத வாய்பாட்டை, இயல்பான நவீனத் தமிழில் அதன் வழிபாட்டு வலிமை குன்றாமல் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுள்
  rationale: இணைப்புநிலைத் தொடரின் பொருளை நேரடியாகவும் இயல்பான தமிழிலும் வெளிப்படுத்துகிறது.
- source_word: מִן הָעוֹלָם וְעַד הָעוֹלָם
  choice: என்றென்றைக்கும்
  rationale: எல்லையற்ற கால விரிவைக் குறிக்கும் துதிவாய்பாட்டை இயல்பான தமிழில் சுருக்கமாகத் தருகிறது; சொற்சொல்லான ‘ஒரு காலத்திலிருந்து ஒரு காலம்வரை’ என்ற அமைப்பு தமிழில் செயற்கையாக ஒலிக்கும்.
- source_word: וְאָמַר כָּל הָעָם
  choice: மக்கள் அனைவரும் ... சொல்லட்டும்
  rationale: வினை வடிவம் நிறைவினையாக இருந்தாலும், வழிபாட்டு மறுமொழிச் சூழலில் உள்ள அழைப்பு அல்லது வேண்டுகோள் செயல்பாட்டைத் தமிழில் தெளிவாகப் பிரதிபலிக்கிறது.
- source_word: אָמֵן
  choice: ஆமென்
  rationale: சமூக வழிபாட்டின் நிலையான மறுமொழியை வழக்கமான தமிழ் ஒலிபெயர்ப்பில் பாதுகாக்கிறது.
- source_word: הַלְלוּ יָהּ
  choice: யாவைப் போற்றுங்கள்
  rationale: பன்மை ஏவல் வினையையும், முழு திருப்பெயரிலிருந்து வேறுபடும் יָהּ என்ற குறுவடிவையும் வெளிப்படையாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற முழு திருப்பெயரையும் יָהּ என்ற குறுவடிவையும் வேறுபடுத்திக் காட்டுதல்
  choice: יְהוָה என்பதை ‘யாவே’ என்றும் יָהּ என்பதை ‘யா’ என்றும் வழங்குதல்
  alternative: இரண்டையும் ‘ஆண்டவர்’ என்று வழங்குதல் அல்லது இறுதி தொடரை ‘அல்லேலூயா’ என மட்டும் ஒலிபெயர்த்தல்
  rationale: மூல வசனம் பயன்படுத்தும் இரு வடிவங்களுக்கிடையிலான வேறுபாட்டைப் பாதுகாத்து, இறுதிக் கட்டளையின் பொருளையும் வாசகருக்குத் தெளிவாக்குகிறது.
- issue: וְאָמַר என்பதன் உரைநடை வலிமை
  choice: வழிபாட்டு அழைப்பாக ‘சொல்லட்டும்’
  alternative: நிகழ்ந்த செயலாக ‘சொன்னார்கள்’
  rationale: சங்கீத முடிவிலுள்ள பொதுமக்களின் மறுமொழிக்கான அழைப்பே சூழலுக்கு நன்கு பொருந்துகிறது; இருப்பினும் எபிரெய வினையின் வடிவத்தால் கடந்தகால வாசிப்பும் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன, பொதுமக்கள் புரிந்துகொள்ளும், மரியாதைமிக்க வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. பழமையான ‘ஸ்தோத்திரம்’ போன்ற சொற்களுக்கு மாற்றாக ‘போற்றுதல்’ தேர்ந்தெடுக்கப்பட்டாலும், துதிப்பாடலின் உயர்ந்த தொனி காக்கப்பட்டுள்ளது. ‘யாவே’ மற்றும் ‘யா’ ஆகிய வடிவங்கள் மூலத்தில் உள்ள திருப்பெயர் வேறுபாட்டைப் பாதுகாக்கின்றன.
