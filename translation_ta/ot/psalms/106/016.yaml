source:
  edition: WLC
  text: וַ/יְקַנְא֣וּ לְ֭/מֹשֶׁה בַּֽ/מַּחֲנֶ֑ה לְ֝/אַהֲרֹ֗ן קְד֣וֹשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/016.yaml
  text: They became jealous of Moses in the camp[a], and of Aaron, the holy one of Yahweh.
translation:
  language: ta
  text: முகாமில் மோசேமீதும், யாவேவின் பரிசுத்தமானவரான ஆரோன்மீதும்[a] அவர்கள் பொறாமை கொண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேக்குப் பரிசுத்தமானவரான ஆரோன்மீதும்.”
    reason: கְדוֹשׁ יְהוָה என்ற சொல்லிணை, யாவேவுக்குரிய பரிசுத்தமானவர் அல்லது யாவேக்குப் பரிசுத்தமானவர் என்ற இரு நெருங்கிய வாசிப்புகளையும் அனுமதிக்கிறது.
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: அவர்கள் பொறாமைகொண்டார்கள்
  rationale: קנא இச்சூழலில் மோசேக்கும் ஆரோனுக்கும் எதிராக எழுந்த பொறாமையைக் குறிக்கிறது. தமிழில் ‘பொறாமைகொண்டார்கள்’ என்பது இயல்பாகவும் நேரடியாகவும் உள்ளது; நிகழ்வின் தொடக்கத்தை வலியுறுத்த ‘பொறாமைகொள்ளத் தொடங்கினார்கள்’ என விரிவாக்க வேண்டிய அவசியம் இல்லை.
- source_word: לְמֹשֶׁה ... לְאַהֲרֹן
  choice: மோசேமீதும் ... ஆரோன்மீதும்
  rationale: קנא உடன் வரும் לְ பொறாமையின் இலக்கைக் குறிக்கிறது. இணையான இரு தொடர்களையும் ‘-மீதும்’ என்று வழங்குவது எபிரெய அமைப்பையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: בַּמַּחֲנֶה
  choice: முகாமில்
  rationale: מַחֲנֶה வனாந்தரத்தில் இஸ்ரவேலர் தங்கியிருந்த முகாமைக் குறிக்கிறது; ‘முகாமில்’ என்பது சுருக்கமான நேரடி மொழிபெயர்ப்பு.
- source_word: קְדוֹשׁ יְהוָה
  choice: யெகோவாவின் பரிசுத்தமானவர்
  rationale: இத்தொடர் ஆரோனை யெகோவாவுக்கென்று பிரித்தெடுக்கப்பட்டவராக அடையாளப்படுத்துகிறது. ‘யெகோவாவுக்குப் பரிசுத்தமானவர்’ என்பதும் இலக்கண ரீதியாகச் சாத்தியமானதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் தனிப்பெயர் வடிவமான ‘யெகோவா’ என்று வழங்குகிறது.
theological_decisions:
- issue: קְדוֹשׁ יְהוָה என்ற ஆரோனின் அடையாளமொழி
  choice: ஆரோன் ‘யெகோவாவின் பரிசுத்தமானவர்’ என்று விவரிக்கப்படுகிறார்.
  alternative: ஆரோன் ‘யெகோவாவுக்குப் பரிசுத்தமானவர்’ என்று விவரிக்கப்படுகிறார்.
  rationale: முதன்மை வாசகம் ஆரோனின் யெகோவாவுக்குரிய சிறப்பான அர்ப்பணிப்பு நிலையை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ஆனால் எபிரெய தொடர் உடைமை அல்லது நோக்கி அர்ப்பணிக்கப்பட்ட நிலை ஆகிய இரண்டையும் அனுமதிப்பதால் மாற்று வாசகம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான தமிழ். கவிதை வரியின் இணை அமைப்பு ‘மோசேமீதும் ... ஆரோன்மீதும்’ என்பதன் மூலம் காக்கப்பட்டுள்ளது; உண்மையான எபிரெயத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
