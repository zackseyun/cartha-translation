    issue: The divine name is rendered “யெகோவா” rather than “யாவே.”
    rationale: The source has יהוה, and the English POB audit trail explicitly adopts “Yahweh” as its rendering. “யாவே” supplies the corresponding Tamil transliteration and maintains project consistency.
  - severity: low
