  text: They made a calf at Horeb and bowed down to a cast image[a][b].
translation:
  language: ta
  text: அவர்கள் ஓரேபில் ஒரு கன்றுக்குட்டியைச் செய்தார்கள்; வார்ப்புச் சிலைக்குப் பணிந்தார்கள்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உருக்கி வார்த்த சிலை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல், பெரும்பாலும் உலோகத்தை உருக்கி வார்த்து உருவாக்கப்பட்ட சிலையைக் குறிப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இது யாத்திராகமம் 32-இல் ஓரேபு/சீனாய் மலையில் செய்யப்பட்ட கன்றுக்குட்டியை நினைவுபடுத்துகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: יַעֲשׂוּ
  choice: செய்து
  rationale: עשה என்பதன் பொதுவான பொருளான ‘செய்/உருவாக்கு’ என்பதை நேரடியாகத் தருகிறது; எபிரெயத்தில் இல்லாத கூடுதல் செய்முறை நுணுக்கத்தைச் சேர்க்கவில்லை.
- source_word: עֵגֶל
  choice: ஒரு கன்றுக்குட்டியை
  rationale: עֵגֶל இளம் மாட்டைக் குறிக்கிறது. ‘கன்றுக்குட்டி’ இயல்பான நவீனத் தமிழ்; இவ்வசனத்தில் சொல்லப்படாத ‘தங்க’ என்ற விவரத்தைச் சேர்க்கவில்லை.
- source_word: בְּחֹרֵב
  choice: ஓரேபில்
  rationale: ב என்ற முன்னொட்டின் இடப்பொருளைத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: பணிந்துகொண்டார்கள்
  rationale: שחה குறிக்கும் உடலைத் தாழ்த்திப் பணியும் செயலைப் பாதுகாக்கிறது; சூழலில் உள்ள வழிபாட்டு அர்த்தத்தைத் தனியே மிகைப்படுத்தித் தீர்மானிக்கவில்லை.
- source_word: לְמַסֵּכָה
  choice: வார்ப்புச் சிலையை
  rationale: מַסֵּכָה உருக்கி வார்க்கப்பட்ட உருவத்தைக் குறிப்பாகக் குறிக்கிறது. ‘வார்ப்புச் சிலை’ இந்த உருவாக்க முறையைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: உருவத்தை ‘தங்கக் கன்றுக்குட்டி’ என்று வெளிப்படையாகக் குறிப்பிடலாமா
  choice: மூலவசனத்தைப் பின்பற்றி ‘ஒரு கன்றுக்குட்டி’ என்று மட்டும் மொழிபெயர்க்கப்பட்டது.
  alternative: ஒரு தங்கக் கன்றுக்குட்டி
  rationale: யாத்திராகமம் 32-இல் அது தங்கத்தால் செய்யப்பட்டதாக இருந்தாலும், இவ்வசனத்தில் ‘தங்கம்’ என்று இல்லை; ஆகவே சூழலிலிருந்து அந்த விவரம் முதன்மை உரைக்குள் சேர்க்கப்படவில்லை.
- issue: וַיִּשְׁתַּחֲווּ என்பதை ‘வழிபட்டார்கள்’ எனப் பொருளாக்கலாமா
  choice: பணிந்துகொண்டார்கள்
  alternative: வழிபட்டார்கள்
  rationale: எபிரெயச் சொல் உடலைத் தாழ்த்திப் பணிதலைக் குறிக்கிறது; சிலை வழிபாட்டுச் சூழல் தெளிவாக இருந்தாலும், செயல் மற்றும் வழிபாடு இடையிலான அர்த்தவிரிவை மொழிபெயர்ப்பு முற்றிலும் ஒற்றைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் சங்கீதத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வார்ப்புச் சிலை’ என்பது தொழில்நுட்ப நுணுக்கத்தைத் தக்கவைத்தும் வழக்கற்ற சொற்றொடரைத் தவிர்த்தும் உள்ளது.
