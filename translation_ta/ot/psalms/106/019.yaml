revisions:
- from: அவர்கள் ஓரேபில் ஒரு கன்றுக்குட்டியைச் செய்து, வார்ப்புச் சிலையைப் பணிந்துகொண்டார்கள்[a][b].
  to: அவர்கள் ஓரேபில் ஒரு கன்றுக்குட்டியைச் செய்தார்கள்; வார்ப்புச் சிலைக்குப் பணிந்தார்கள்[a][b].
  rationale: The revision corrects the Tamil case construction, improves clause naturalness, and preserves the Hebrew distinction between making a calf and bowing to a cast image. The cross-reference note is adjusted to avoid an unnecessary categorical identification of Horeb with Sinai.
  reviewer_model: gpt-5.6-terra
