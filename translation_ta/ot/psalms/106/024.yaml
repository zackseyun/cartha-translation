source:
  edition: WLC
  text: וַֽ֭/יִּמְאֲסוּ בְּ/אֶ֣רֶץ חֶמְדָּ֑ה לֹֽא הֶ֝אֱמִ֗ינוּ לִ/דְבָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/024.yaml
  text: Then they despised the pleasant land[b][a]; they did not believe his word.
translation:
  language: ta
  text: பின்னர் அவர்கள் விரும்பத்தக்க நாட்டை[a] இகழ்ந்தார்கள்; அவருடைய வார்த்தையை[b] நம்பவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இன்பமான நாட்டை” அல்லது “மனதுக்கு இனிய நாட்டை.”
    reason: lexical_alternative
  - marker: b
    text: “அவருடைய வார்த்தையை நம்பவில்லை” என்பதை “அவருடைய வார்த்தையில் நம்பிக்கை வைக்கவில்லை” என்றும் மொழிபெயர்க்கலாம்; இங்கு “அவருடைய வார்த்தை” என்பது “அவருடைய வாக்குறுதி” என்றும் புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: பின்னர் அவர்கள் … இகழ்ந்தார்கள்
  rationale: מָאַס என்பது புறக்கணித்தல், நிராகரித்தல், இகழ்தல் ஆகிய வலுவான அர்த்தங்களைக் கொண்டது. இச்சங்கீதத்தின் கண்டனத் தொனியைத் தக்கவைக்க ‘இகழ்ந்தார்கள்’ பயன்படுத்தப்பட்டுள்ளது; வாவ் தொடர்கதையின் முன்னேற்றத்தை ‘பின்னர்’ காட்டுகிறது.
- source_word: בְּאֶרֶץ חֶמְדָּה
  choice: விரும்பத்தக்க நாட்டை
  rationale: אֶרֶץ இங்கு வாக்குறுதியளிக்கப்பட்ட நாட்டைக் குறிக்கிறது. חֶמְדָּה அதன் விரும்பத்தக்க, மனதுக்கு இனிய தன்மையைச் சுட்டுகிறது. ‘விரும்பத்தக்க நாடு’ எபிரெயச் சொல்லமைப்பையும் பொருளையும் இயல்பான தமிழில் நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: הֶאֱמִינוּ
  choice: நம்பவில்லை
  rationale: אָמַן என்பதன் ஹிஃபில் வடிவம் இங்கு நம்புதல் அல்லது நம்பிக்கை வைத்தல் என்று பொருள்படும். ‘வார்த்தை’ என்ற தொடருடன் ‘நம்பவில்லை’ இயல்பாக அமைந்து, மூலத்தின் பரந்த பொருளைத் தக்கவைக்கிறது.
- source_word: לִדְבָרוֹ
  choice: அவருடைய வார்த்தையை
  rationale: דָּבָר என்பதற்கு ‘வார்த்தை,’ ‘கூற்று,’ அல்லது சூழலில் ‘வாக்குறுதி’ என்று பொருள் இருக்கலாம். மூலத்தில் உள்ள பரந்த சொல்லை முதன்மை உரையில் பாதுகாக்க ‘அவருடைய வார்த்தை’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அவருடைய வார்த்தை’ என்பது நாட்டைப் பற்றிய கடவுளின் வாக்குறுதியை வெளிப்படையாகக் குறிக்க வேண்டுமா?
  choice: முதன்மை உரையில் ‘அவருடைய வார்த்தை’ என்ற பரந்த மொழியைத் தக்கவைத்தல்
  alternative: ‘அவருடைய வாக்குறுதி’
  rationale: சூழல் கடவுளின் வாக்குறுதியைச் சுட்டினாலும், எபிரெய உரை דְבָרוֹ, அதாவது ‘அவருடைய வார்த்தை’ என்றே கூறுகிறது. பொருளைத் தேவையின்றிக் குறுக்காமல், சூழல்சார் மாற்றை அடிக்குறிப்பில் தருவது மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்குரிய கண்ணியமான கண்டனத் தொனியுடன் வடிவமைக்கப்பட்டுள்ளது. ‘தேசம்’ என்பதற்குப் பதிலாக ordinary geographical usage-க்கு இயல்பான ‘நாடு’ பயன்படுத்தப்பட்டுள்ளது; ‘வார்த்தை’ மூலத்தின் பரந்த இறையியல் மற்றும் சூழல்சார் பொருளைத் தக்கவைக்கிறது.
