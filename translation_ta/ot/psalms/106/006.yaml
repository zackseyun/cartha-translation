  text: We have sinned with our fathers[a]; we have done wrong[b]; we have acted wickedly.
translation:
  language: ta
  text: எங்கள் தந்தையரோடு[a] நாங்களும் பாவம் செய்தோம்; நெறிதவறினோம்[b]; தீமை செய்தோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எங்கள் முன்னோர்களோடு.’ எபிரெய மொழியில் சொல்லர்த்தமாக ‘எங்கள் தந்தையரோடு.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அக்கிரமம் செய்தோம்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: பாவம் செய்தோம்
  rationale: חטא என்பதன் Qal perfect முதலாம் நபர் பன்மை வடிவம் பாவம் செய்ததை ஒப்புக்கொள்கிறது. தமிழில் இயல்பான இறந்தகால வடிவம் எபிரெய நிறைவேற்ற வினையின் ஒப்புதல் சார்ந்த பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: עִם
  choice: -ஓடு … நாங்களும்
  rationale: עִם முன்னோர்களுடனான தொடர்பையும் ஒருமைப்பாட்டையும் குறிக்கிறது. ‘தந்தையரோடு நாங்களும்’ என்பது வெறும் ஒப்புமையாக மாற்றாமல், அவர்களுடன் சேர்ந்த பாவ ஒப்புதலை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֲבוֹתֵינוּ
  choice: எங்கள் தந்தையர்
  rationale: எபிரெயச் சொல் சொல்லர்த்தமாக ‘எங்கள் தந்தையர்’ என்பதாகும். தலைமுறைக்கு முந்தியவர்களைச் சூழலில் குறிக்கக்கூடியதால் ‘முன்னோர்’ என்பது அடிக்குறிப்பில் மாற்றாக வழங்கப்படுகிறது.
- source_word: הֶעֱוִינוּ
  choice: நெறிதவறினோம்
  rationale: עוה என்பதன் Hiphil perfect முதலாம் நபர் பன்மை வடிவம் தவறாக அல்லது கோணலாக நடந்துகொண்டதை உணர்த்துகிறது. ‘நெறிதவறினோம்’ அதன் ஒழுக்கப் பொருளை தற்போதைய, கண்ணியமான தமிழில் காக்கிறது; ‘அக்கிரமம் செய்தோம்’ என்பதும் சாத்தியமான மாற்று.
- source_word: הִרְשָׁעְנוּ
  choice: பொல்லாப்பாக நடந்துகொண்டோம்
  rationale: רשע என்பதன் Hiphil perfect முதலாம் நபர் பன்மை வடிவம் பொல்லாத விதத்தில் செயல்பட்டதைச் சுட்டுகிறது. இத்தேர்வு வினைச்செயலின் வலிமையையும் மூன்று அடுக்கான ஒப்புதலின் உச்சத்தையும் காக்கிறது.
theological_decisions:
- issue: பாவ ஒப்புதலில் தலைமுறைகளுக்கிடையிலான ஒருமைப்பாடு
  choice: ‘எங்கள் தந்தையரோடு நாங்களும்’ என்று மொழிபெயர்த்து, பேசுபவர்கள் முந்திய தலைமுறையினருடன் தொடர்ச்சியாகத் தங்கள் பாவத்தை ஒப்புக்கொள்வதை வெளிப்படுத்துதல்.
  alternative: ‘எங்கள் தந்தையரைப் போல’ என்று மொழிபெயர்த்து ஒற்றுமையைவிட ஒப்புமையை வலியுறுத்துதல்.
  rationale: עִם என்பது இயல்பாக ‘உடன்/ஓடு’ என்ற தொடர்பைக் குறிக்கிறது; ‘போல’ என்ற ஒப்புமையை மட்டும் குறிக்காது. வசனம் கூறுவதற்கும் மேலாக ஒரு குறிப்பிட்ட கோட்பாட்டை உருவாக்காமல், கூட்டு மற்றும் தலைமுறைதோறும் தொடரும் ஒப்புதலை மொழிபெயர்ப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான ஒப்புதல் நடையைப் பயன்படுத்துகிறது. மூன்று தொடர்ச்சியான வினைச்சொற்களும் மூலத்தின் படிப்படியான ஒழுக்க வலிமையைப் பேணுகின்றன; ‘தந்தையர்’ என்ற சொல்லர்த்த வடிவம் முதன்மை உரையில் வைக்கப்பட்டு, சூழல்சார் ‘முன்னோர்’ அடிக்குறிப்பில் தரப்படுகிறது.
