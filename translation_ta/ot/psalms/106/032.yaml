  text: They provoked anger at the waters of Meribah[b][a], and it went badly for Moses because of them.
translation:
  language: ta
  text: அவர்கள் மெரிபாவின் நீர்நிலைகளில்[b] கோபத்தைத் தூண்டினார்கள்[a]; அவர்களால் மோசேக்குக் கேடு நேர்ந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் அவருக்குக் கோபமூட்டினார்கள்.” எபிரெய மொழியில் யாருடைய கோபம் தூண்டப்பட்டது என்பது இந்த வரியில் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: lexical_alternative
  - marker: b
