id: PSA.106.45
reference: Psalms 106:45
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/יִּזְכֹּ֣ר לָ/הֶ֣ם בְּרִית֑/וֹ וַ֝/יִּנָּחֵ֗ם כְּ/רֹ֣ב חסד/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/045.yaml
  text: He remembered his covenant for their sake[a], and relented according to the abundance of his steadfast love.
translation:
  language: ta
  text: அவர்களுக்காகத் தமது உடன்படிக்கையை நினைவுகூர்ந்தார்; தமது மாறாத பேரன்பின் மிகுதிக்கேற்ப மனம் மாறினார்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இரங்கினார்.” எபிரெய வினைச்சொல் மனம் மாறுவதையோ, மேற்கொள்ளவிருந்த செயலில் இருந்து விலகுவதையோ, இரக்கத்தால் நெகிழ்வதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: நினைவுகூர்ந்தார்
  rationale: זכר என்பது இங்கு வெறும் மன நினைவை மட்டுமல்ல, முன்பு செய்த உடன்படிக்கையைக் கருத்தில்கொண்டு அதற்கேற்ப செயல்படுவதையும் உணர்த்துகிறது. ‘நினைவுகூர்ந்தார்’ அந்த உடன்படிக்கைச் சார்ந்த ஒலிப்பைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: לָהֶם
  choice: அவர்களுக்காக
  rationale: לָהֶם என்பது உடன்படிக்கையை நினைவுகூருதல் மக்களோடு தொடர்புடையதாகவும் அவர்களுடைய நன்மைக்காகவும் இருந்ததை இங்கு குறிக்கிறது. ‘அவர்களுக்காக’ என்பது இயல்பான தமிழில் இதை வெளிப்படுத்துகிறது.
- source_word: בְּרִיתוֹ
  choice: தமது உடன்படிக்கையை
  rationale: בְּרִית என்பதற்கான நிலையான வேதாகமச் சொல் ‘உடன்படிக்கை.’ ‘தமது’ என்பது எழுவாயாகிய கடவுளையே சுட்டி, தமிழில் மரியாதையுடனும் தெளிவுடனும் அமைகிறது.
- source_word: וַיִּנָּחֵם
  choice: மனம் மாறினார்
  rationale: נחם என்பதன் நிபால் வடிவம் மனம் மாறுதல், மேற்கொள்ளவிருந்த செயலில் இருந்து விலகுதல், அல்லது இரக்கத்தால் நெகிழ்தல் ஆகிய பொருள்களைத் தரக்கூடும். ‘மனம் மாறினார்’ மூலத்தின் வலிமையையும் இறைவனைப் பற்றிய மனித உணர்வுச் சொல்லாட்சியில் உள்ள இறையியல் பதற்றத்தையும் மறைக்காமல் காக்கிறது.
- source_word: כְּרֹב
  choice: மிகுதிக்கேற்ப
  rationale: כ + רֹב அளவு அல்லது விகிதத்தைக் குறிக்கிறது. ‘மிகுதிக்கேற்ப’ என்பது அதனைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: חסדו
  choice: தமது மாறாத பேரன்பின்
  rationale: חסד என்பது இரக்கம் மட்டும் அல்லாமல் உறுதியான, பற்றுமாறாத, உடன்படிக்கை சார்ந்த அன்பையும் குறிக்கிறது. ‘மாறாத பேரன்பு’ அதன் அன்பு மற்றும் நிலைத்த விசுவாசம் ஆகிய இரு கூறுகளையும் தமிழில் இயல்பாகக் கொண்டுவருகிறது.
theological_decisions:
- issue: וַיִּנָּחֵם என்பதில் கடவுளுக்குப் பயன்படுத்தப்படும் மனித உணர்வுச் சொல்லாட்சி
  choice: மனம் மாறினார்
  alternative: இரங்கினார்
  rationale: மூல எபிரெயம் கடவுள் மக்களிடம் நடந்துகொண்ட விதத்தில் உண்மையான மாற்றத்தை மனித அனுபவ மொழியில் விவரிக்கிறது. ‘மனம் மாறினார்’ அந்த உரை வலிமையையும் இறையியல் பதற்றத்தையும் காக்கிறது; அதேவேளை, எபிரெயச் சொல்லில் உள்ள இரக்கத்தால் நெகிழ்தல் என்ற சாத்தியத்தை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கவிதைச் சமநிலையைத் தக்கவைக்க இரண்டு இணை வாக்கியங்கள் அரைப்புள்ளியால் பிரிக்கப்பட்டுள்ளன. ‘மனம் மாறினார்’ என்ற நேரடியான மொழிபெயர்ப்பு மூலத்தின் உண்மையான பல்பொருளையும் இறையியல் பதற்றத்தையும் தணிக்காமல் வைத்திருக்கிறது.
