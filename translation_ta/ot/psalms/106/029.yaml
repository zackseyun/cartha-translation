source:
  edition: WLC
  text: וַ֭/יַּכְעִיסוּ בְּ/מַֽעַלְלֵי/הֶ֑ם וַ/תִּפְרָץ בָּ֝֗/ם מַגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/029.yaml
  text: They provoked him to anger by their deeds[a], and a plague broke out among them.
translation:
  language: ta
  text: அவர்கள் தங்கள் செயல்களால் அவருக்குக் கோபமூட்டினார்கள்[a]; அவர்களிடையே கொள்ளைநோய் வெடித்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தங்கள் செய்கைகளால் அவரைக் கோபப்படுத்தினார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּ
  choice: அவருக்குக் கோபமூட்டினார்கள்
  rationale: כעס என்பதன் ஹிஃபில் வடிவம் ஒருவரைக் கோபப்படுத்துதல் அல்லது கோபமூட்டுதல் என்று பொருள்படும். எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், சங்கீதத்தின் சூழலில் அது கடவுளைக் குறிக்கிறது; ஆகவே இயல்பான தமிழுக்காக ‘அவருக்கு’ சேர்க்கப்பட்டுள்ளது.
- source_word: בְּמַעַלְלֵיהֶם
  choice: தங்கள் செயல்களால்
  rationale: מַעֲלָלִים என்பது சூழலின்படி அறநெறிச் சாயல் கொண்ட செயல்களையோ செய்கைகளையோ குறிக்கிறது; בְּ இங்கு கருவி அல்லது காரணத்தைக் காட்டுவதால் ‘செயல்களால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וַתִּפְרָץ
  choice: வெடித்தது
  rationale: פרץ திடீரெனப் பீறிட்டுத் தோன்றுதல் அல்லது உடைத்துக்கொண்டு வெளிப்படுதல் என்ற படிமத்தைக் கொண்டது. நோயுடன் ‘வெடித்தது’ என்பது அதன் திடீர் தொடக்கத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בָּם
  choice: அவர்களிடையே
  rationale: குழுவினரின் நடுவில் நிகழ்ந்ததை בָּם இங்கு குறிக்கலாம். சமூகத்தில் நோய் பரவியதைக் காட்ட ‘அவர்களிடையே’ இயல்பான தமிழ்.
- source_word: מַגֵּפָה
  choice: கொள்ளைநோய்
  rationale: מַגֵּפָה என்பது பெரும்பாலும் மரணத்தை விளைவிக்கும் பெருந்தொற்று அல்லது தண்டனைத் தாக்கைக் குறிக்கிறது. இங்கு ‘கொள்ளைநோய்’ தெளிவான, dignified நவீனத் தமிழ் இணை.
theological_decisions:
- issue: ‘கோபமூட்டினார்கள்’ என்பதன் மறைந்துள்ள தெய்வீகச் செயப்படுபொருள்
  choice: சூழலில் கடவுளைக் குறிக்கும் ‘அவருக்கு’ சேர்க்கப்பட்டது.
  alternative: செயப்படுபொருளைக் கூறாமல் ‘கோபமூட்டினார்கள்’ என மொழிபெயர்ப்பது; அல்லது ‘கடவுளுக்குக் கோபமூட்டினார்கள்’ என வெளிப்படையாகக் கூறுவது.
  rationale: எபிரெய மூலத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை. ஆனால் உடனடிச் சூழல் இஸ்ரவேலர் கடவுளுக்கு எதிராகக் கலகம் செய்ததைக் கூறுகிறது. ‘அவருக்கு’ என்பது அந்தச் சூழல் குறிப்பைத் தக்கவைத்தபடி, மூலத்தைவிட அதிகமாகப் பெயரிட்டு விளக்குவதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. ‘கோபமூட்டினார்கள்’ காரணவினைத் தன்மையைத் தக்கவைக்கிறது; ‘கொள்ளைநோய் வெடித்தது’ திடீர் நோய்ப்பரவலை இயல்பாகக் கூறுகிறது.
