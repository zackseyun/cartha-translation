  text: וַ/יִּתְּנֵ֥/ם בְּ/יַד גּוֹיִ֑ם וַֽ/יִּמְשְׁל֥וּ בָ֝/הֶ֗ם שֹׂנְאֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/041.yaml
  text: He gave them into the hand of the nations[b][a], and those who hated them ruled over them.
translation:
  language: ta
  text: அவர் அவர்களைப் பிற தேசங்களின் கையில் ஒப்படைத்தார்[a]; அவர்களை வெறுத்தவர்கள் அவர்களை ஆண்டார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பிற தேசங்களின் கையில்’ என்பது ‘பிற தேசங்களின் அதிகாரத்தில்’ என்று பொருள்படும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: அவர் அவர்களை ஒப்படைத்தார்
  rationale: נתן என்பதன் எளிய பொருள் ‘கொடுத்தார்’ என்றாலும், בְּיַד உடன் இது ஒருவரின் அதிகாரத்திற்கு ஒப்புவித்தலைக் குறிக்கிறது. ‘ஒப்படைத்தார்’ என்பது அந்தச் சூழ்நிலைப் பொருளை இயல்பான தமிழில் தருகிறது; இறைச் செயலை வெறும் அனுமதியாக மென்மைப்படுத்தவில்லை.
- source_word: בְּיַד
  choice: கையில்
  rationale: எபிரெய மொழியின் ‘கையில்’ என்ற அதிகார உருவகத்தைத் தமிழிலும் இயல்பாகப் பாதுகாக்கிறது. இங்கு அது ‘அதிகாரத்தில்’ என்பதைக் குறிக்கிறது; இதனை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
- source_word: גּוֹיִם
  choice: பிற தேசத்தார்
  rationale: இச்சூழலில் இஸ்ரவேலைச் சுற்றியிருந்த அந்நிய தேச மக்களைக் குறிக்கிறது. ‘புறஜாதியார்’ என்பதைவிட ‘பிற தேசத்தார்’ நவீன வாசகருக்கு இயல்பாகவும் குறைந்த மரபுசார் சுமையுடனும் உள்ளது.
- source_word: וַיִּמְשְׁלוּ
  choice: ஆளுகை செய்தார்கள்
  rationale: משל என்பதன் ‘ஆளுதல்’ என்ற பொருளைத் துல்லியமாகத் தருகிறது. ‘அடக்கி ஆண்டார்கள்’ என்பது பகைமைக் கருத்தை வலுப்படுத்தி மூலத்தைவிட கூடுதல் பொருள் சேர்க்கக்கூடும்.
- source_word: שֹׂנְאֵיהֶם
  choice: அவர்களை வெறுத்தவர்கள்
  rationale: செயற்பெயரெச்சத்தின் நேரடியான பொருளான ‘அவர்களை வெறுப்பவர்கள்/வெறுத்தவர்கள்’ என்பதைப் பாதுகாக்கிறது. ‘எதிரிகள்’ என்பது இயல்பானதாயினும், வெறுத்தல் என்ற சொற்பொருளை மங்கச் செய்யும்.
theological_decisions:
- issue: இஸ்ரவேலர்மீது வந்த தீர்ப்பில் இறைவனின் செயலாண்மை
  choice: ‘அவர் ... ஒப்படைத்தார்’ என்று இறைவனின் நேரடிச் செயலைப் பாதுகாத்தல்
  alternative: இறைவன் அவர்களை ஒப்படைக்க அனுமதித்தார் என்று மென்மைப்படுத்துதல்
  rationale: மறைமுக எழுவாயாக இறைவனைக் கொண்ட נתן வினை, அவர் அவர்களை நேரடியாகப் பிற தேசத்தாரின் அதிகாரத்திற்கு ஒப்படைத்ததாகக் கூறுகிறது. வெறும் அனுமதி என்று மாற்றுவது மூலத்தில் இல்லாத விளக்கத்தைச் சேர்க்கும்.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை. ‘கையில்’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; ‘ஒப்படைத்தார்’ அதன் சூழ்நிலைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
