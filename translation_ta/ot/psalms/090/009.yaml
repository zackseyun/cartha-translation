theological_decisions:
- issue: தெய்வீக கோபத்தைக் குறிக்கும் சொல்
  choice: உமது கடுஞ்சினத்தில்
  alternative: உமது கோபத்தில்
  rationale: மனித வாழ்நாட்கள் தேவனுடைய עֶבְרָה-வில் கடந்துபோகின்றன என்று வசனம் நேரடியாகக் கூறுகிறது. “கடுஞ்சினம்” அதன் தீவிரத்தையும் இறையியல் அழுத்தத்தையும் மென்மைப்படுத்தாமல் காக்கிறது.
- issue: הֶגֶה என்பதிலுள்ள பொருள் தெளிவின்மை
  choice: பெருமூச்சு
  alternative: முணுமுணுப்பு அல்லது முனகல்
  rationale: சூழலில் “பெருமூச்சு” வாழ்வின் கணநேரத் தன்மையை இயல்பாக உணர்த்தினாலும், எபிரேயச் சொல் பொதுவாக ஒரு தாழ்ந்த ஒலியைக் குறிப்பதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. “உமது” சங்கீதத்தின் உயர்ந்த நேரடி அழைப்புத் தொனியைத் தக்கவைக்கிறது; “கடுஞ்சினம்” மூலத்தின் தீவிரத்தைப் பாதுகாக்கிறது. அடிக்குறிப்பு குறி அது விளக்கும் “பெருமூச்சு” என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
