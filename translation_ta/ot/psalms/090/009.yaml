  text: ஏனெனில் எங்கள் நாட்களெல்லாம் உமது கடுங்கோபத்தில் கடந்துபோகின்றன; எங்கள் ஆண்டுகளை ஒரு பெருமூச்சைப்போல் முடிக்கிறோம்.[a]
  philosophy: optimal-equivalence
