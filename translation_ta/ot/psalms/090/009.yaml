    text: அல்லது, “ஒரு முணுமுணுப்பைப்போல்” அல்லது “ஒரு முனகலைப்போல்.” எபிரேயச் சொல் தாழ்ந்த ஓர் ஒலியைக் குறிக்கிறது; இங்கு வாழ்வின் விரைவாகக் கடந்துபோகும் தன்மையை வலியுறுத்துவதற்காக “பெருமூச்சு” என்று மொழிபெயர்க்கப்பட்டுள்ளது.
