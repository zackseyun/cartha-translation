id: PSA.90.15
reference: Psalms 90:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שַׂ֭מְּחֵ/נוּ כִּ/ימ֣וֹת עִנִּיתָ֑/נוּ שְׁ֝נ֗וֹת רָאִ֥ינוּ רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/015.yaml
  text: Make us glad for as many days as you have afflicted us[a], for as many years as we have seen trouble.
translation:
  language: ta
  text: 'நீர் எங்களைத் துன்புறுத்திய நாட்களின் அளவுக்கு,

    நாங்கள் துயரத்தைக் கண்ட ஆண்டுகளின் அளவுக்கு,

    எங்களை மகிழச் செய்யும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂמְּחֵנוּ
  choice: எங்களை மகிழச் செய்யும்
  rationale: שׂמח என்பதன் பியேல் கட்டளை வடிவமும் முதலாம் நபர் பன்மை பின்னொட்டும், தேவனை நோக்கிய காரணவினைப் பொருளுள்ள வேண்டுதலைக் காட்டுகின்றன. ‘மகிழச் செய்யும்’ என்பது இதை இயல்பாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: כִּימוֹת
  choice: நாட்களுக்கு ஈடாகவும்
  rationale: כְּ + ימות இங்கு முந்தைய துன்பத்தின் அளவுக்கு ஒத்த மகிழ்ச்சியைக் கோரும் அளவு/ஒப்புமைப் பொருளைக் கொண்டுள்ளது. ‘ஈடாக’ என்பது அந்த விகிதத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: עִנִּיתָנוּ
  choice: நீர் எங்களைத் துன்புறுத்திய
  rationale: ענה என்பதன் பியேல் வடிவம் ‘துன்புறுத்துதல்/சிறுமைப்படுத்துதல்’ எனப் பொருள்படலாம். இணைவரியில் வரும் துயரத்துடன் பொருந்துவதாலும், உள்ளார்ந்த தாழ்மையையோ வெளிப்புற ஒடுக்குதலையோ மட்டும் குறுக்காததாலும் ‘துன்புறுத்திய’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: שְׁנוֹת
  choice: ஆண்டுகளுக்கு ஈடாகவும்
  rationale: இது முதல் வரியின் ‘நாட்கள்’ என்பதற்கு இணையான பன்மை இணைப்புவடிவம். தமிழில் ‘ஈடாகவும்’ என்பதை மீண்டும் தருவது எபிரெயக் கவிதையின் இணை அமைப்பையும் அளவுச் சமத்துவ வேண்டுதலையும் வெளிப்படுத்துகிறது.
- source_word: רָאִינוּ
  choice: நாங்கள் ... கண்ட
  rationale: ‘காணுதல்’ என்ற எபிரெய உருவகத்தை நேரடியாகக் காத்து, அனுபவித்த துன்பத்தைக் குறிக்கும் இயல்பான தமிழாக உள்ளது.
- source_word: רָעָה
  choice: துயரம்
  rationale: רָעָה என்பது சூழலின்படி தீமை, இடர், பேரழிவு அல்லது துன்பம் என அமையலாம். இங்கு மக்கள் செய்த அறத் தீமையை அல்ல, அவர்கள் அனுபவித்த இடரைச் சுட்டுவதால் ‘துயரம்’ பொருத்தமானது.
theological_decisions:
- issue: רָעָה என்பதற்கும் தேவனுடைய செயலுக்கும் இடையிலான பொருள்
  choice: அனுபவிக்கப்பட்ட இடர் என்ற பொருளில் ‘துயரம்’
  alternative: ‘தீமை’, ‘பேரிடர்’, அல்லது ‘துன்பம்’
  rationale: இந்த வசனம் முன்பு ஏற்பட்ட துன்பத்துக்கு ஈடாக மகிழ்ச்சியை வேண்டுகிறது. ஆகவே רָעָה இங்கு பேசுவோர் செய்த ஒழுக்கத் தீமையைவிட அவர்கள் கண்ட இடரையே குறிக்கிறது; அதேவேளை புலம்பலின் கூர்மையை மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழ்; பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேண்டுதல் நடை. எபிரெய இணைவரிகளின் ‘நாட்கள்/ஆண்டுகள்’ அமைப்பும், துன்பத்தின் கால அளவுக்கு ஈடான மகிழ்ச்சி வேண்டுதல் என்ற பதற்றமும் காக்கப்பட்டுள்ளன. ‘செய்யும்’ என்பது மரியாதை ஒருமை கட்டளை/வேண்டுதல் வடிவமாகப் பயன்படுத்தப்பட்டுள்ளது.
