  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/001.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: ta
  text: 'தேவனுடைய மனிதரான மோசேயின்[a] ஜெபம்.


    ஆண்டவரே, தலைமுறை தலைமுறையாக நீரே எங்களுக்கு உறைவிடமாக இருந்தீர்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தலைப்பிலுள்ள எபிரெய முன்னொட்டு, “மோசே இயற்றியது,” “மோசேக்குரியது” அல்லது “மோசேக்காக அர்ப்பணிக்கப்பட்டது” என்றும் பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “உறைவிடம்” என்பதற்கு “வாழிடம்” அல்லது, பொருள் விரிவாக, “அடைக்கலம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: மன்றாட்டு
  rationale: சங்கீதத் தலைப்பில் வரும் ஜெப வகையை இயல்பாகவும் கண்ணியமாகவும் குறிக்கிறது; இது சாதாரண வேண்டுதலைவிட தேவனை நோக்கிய விண்ணப்பத்தைத் தெளிவாக உணர்த்துகிறது.
- source_word: לְמֹשֶׁה
  choice: மோசேயின்
  rationale: தமிழில் தலைப்புக்கேற்ற இயல்பான வடிவம். எபிரெய לְ என்பது இயற்றியவர், தொடர்பு, அர்ப்பணம் ஆகியவற்றைக் குறிக்கக்கூடும் என்பதால் அடிக்குறிப்பில் அதன் பரப்பைத் தக்கவைக்கிறது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: தேவனுடைய மனிதன்
  rationale: மோசேக்குரிய திட்டமான பட்டத்தை நேரடியாகப் பாதுகாக்கிறது; வாக்கிய இணைப்பில் ‘தேவனுடைய மனிதனாகிய’ என அமைக்கப்பட்டது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: தெய்வீக அழைப்புப் பெயரை மரியாதையான தமிழ் விளிவடிவில் இயல்பாக வழங்குகிறது.
- source_word: מָעוֹן
  choice: உறைவிடம்
  rationale: வசிப்பிடம் என்ற இடவியல் உருவகத்தைப் பாதுகாக்கிறது; ‘அடைக்கலம்’ என்பது பாதுகாப்பு என்னும் பொருளை மட்டும் முன்னிறுத்தி உருவகத்தைச் சுருக்கக்கூடும்.
- source_word: הָיִיתָ לָּנוּ
  choice: நீரே எங்களுக்கு ... இருந்தீர்
  rationale: கடந்த தலைமுறைகளிலிருந்து தொடரும் தேவனுடைய உறவை மரியாதை ஒருமை வடிவில் இயல்பாகக் கூறுகிறது; ‘நீரே’ வாக்கியத்தின் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: בְּדֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: அடுத்தடுத்து வரும் எல்லாத் தலைமுறைகளிலும் தொடர்வதை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: சங்கீதத் தலைப்பிலுள்ள לְמֹשֶׁה என்பதன் பொருள்
  choice: மோசேயின்
  alternative: மோசே இயற்றியது; மோசேக்காக அர்ப்பணிக்கப்பட்டது; மோசேயுடன் தொடர்புடையது
  rationale: எபிரெய முன்னொட்டு பல உறவுகளைச் சுட்டக்கூடும். முதன்மை உரையில் சுருக்கமான தமிழ் தலைப்பு தரப்பட்டாலும், அடிக்குறிப்பு ஆசிரியத்துவத்தைத் தீர்மானமாக்காமல் உண்மையான தெளிவின்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; தேவனை நோக்கிய மரியாதை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. சங்கீதத் தலைப்பு சுருக்கமாகவும், முதன்மை வரி வாசிப்புக்கு இயல்பாகவும், மூல உருவகத்தைப் பாதுகாக்கும் வகையிலும் அமைந்துள்ளது.
