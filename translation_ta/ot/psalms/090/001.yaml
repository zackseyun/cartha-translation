  source_fidelity: 'மூல எபிரெயத்தின் தலைப்பு அமைப்பும் முக்கியச் சொற்களும் பெரும்பாலும் துல்லியமாக உள்ளன: לְמֹשֶׁה-யின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; אֲדֹנָי-க்கு மரியாதை விளிவடிவமும், מָעוֹן-க்கு இடவியல் உருவகமும், בְּדֹר וָדֹר-க்கு தொடர்ச்சியான தலைமுறைகளின் பொருளும் தக்கவைக்கப்பட்டுள்ளன. ஆனால் תְּפִלָּה என்பது ஒரு குறிப்பிட்ட வேண்டுகோளை மட்டும் அல்லாமல் சங்கீதத் தலைப்பின் பரந்த ‘ஜெபம்’ என்னும் வகைப்பாட்டைக் குறிக்கிறது; ‘மன்றாட்டு’ அதைச் சற்றுக் குறுக்குகிறது.'
