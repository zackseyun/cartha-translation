  text: וִ/יהִ֤י נֹ֤עַם אֲדֹנָ֥/י אֱלֹהֵ֗י/נוּ עָ֫לֵ֥י/נוּ וּ/מַעֲשֵׂ֣ה יָ֭דֵי/נוּ כּוֹנְנָ֥/ה עָלֵ֑י/נוּ וּֽ/מַעֲשֵׂ֥ה יָ֝דֵ֗י/נוּ כּוֹנְנֵֽ/הוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/017.yaml
  text: May the favor of the Lord our God be upon us[a], and establish the work of our hands upon us; yes[c][b], establish the work of our hands.
translation:
  language: ta
  text: எங்கள் கடவுளாகிய ஆண்டவரின் அருள்[a] எங்கள்மேல் இருப்பதாக! எங்கள் கைகளின் வேலையை எங்களுக்காக[b] நிலைநிறுத்துவீராக; ஆம், எங்கள் கைகளின் வேலையை நிலைநிறுத்துவீராக.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அழகு,’ ‘இனிமை’ அல்லது ‘மகிழ்ச்சி’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படி, ‘எங்கள்மேல்.’ இங்கு அது ‘எங்களுக்காக’ அல்லது ‘எங்கள் நன்மைக்காக’ என்ற பொருளைக் கொள்ளலாம்.
    reason: source_ambiguity
  - marker: c
    text: எபிரேயத்தில், ‘எங்கள் கைகளின் வேலையை நிலைநிறுத்துவீராக’ என்ற வேண்டுதல் வலியுறுத்தலுக்காக மீண்டும் சொல்லப்படுகிறது.
    reason: literary_feature
lexical_decisions:
- source_word: וִיהִי
  choice: இருப்பதாக
  rationale: היה என்பதன் வேண்டுதல் பொருளைத் தமிழில் இயல்பான விருப்பவினை வடிவில் வெளிப்படுத்துகிறது.
- source_word: נֹעַם
  choice: அருள்
  rationale: இச்சூழலில் கடவுளின் தயவும் அங்கீகாரமும் மக்கள்மேல் தங்க வேண்டும் என்ற வேண்டுதலை இயல்பாகக் காட்டுகிறது; மூலச்சொல்லிலுள்ள இனிமை, அழகு, மகிழ்ச்சி ஆகிய பொருள் நிழல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: எங்கள் கடவுளாகிய ஆண்டவர்
  rationale: ஆண்டவரின் அதிகாரத்தையும் ‘எங்கள் கடவுள்’ என்ற உறவுமொழியையும் தனித்தனியாகப் பாதுகாக்கிறது.
- source_word: עָלֵינוּ
  choice: எங்கள்மேல்
  rationale: அருள் மக்கள்மேல் தங்கியிருக்கும் எபிரேயப் படிமத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מַעֲשֵׂה יָדֵינוּ
  choice: எங்கள் கைகளின் வேலை
  rationale: மனித உழைப்பையும் முயற்சியையும் குறிக்கும் மூலமொழியின் தெளிவான கைப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: כּוֹנְנָה / כּוֹנְנֵהוּ
  choice: நிலைநிறுத்துவீராக
  rationale: வேலைக்கு உறுதியும் நீடிப்பும் அளிக்க வேண்டும் என்ற כון வேர்ச்சொல்லின் பொருளை, கடவுளை நோக்கிய மரியாதையான வேண்டுதலாக வழங்குகிறது.
- source_word: עָלֵינוּ (second occurrence)
  choice: எங்களுக்காக
  rationale: வேலையை ‘எங்கள்மேல்’ நிலைநிறுத்துதல் என்பது தமிழில் தெளிவற்றதாக இருப்பதால், இங்கு உள்ள பயன்நோக்குப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; சொற்படியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: கடவுளின் நֹעַם மனித உழைப்புடன் கொண்டுள்ள உறவு
  choice: அருள்
  alternative: அழகு / இனிமை / மகிழ்ச்சி
  rationale: மனித உழைப்பை கடவுள் நிலைநிறுத்த வேண்டும் என்ற ஜெபச் சூழலில் ‘அருள்’ உறவுசார் பொருளைத் தெளிவாக்குகிறது; ஆனால் அழகியல் பொருள் நிழல்களை நீக்காமல் அடிக்குறிப்பில் வைக்கிறது.
- issue: மனிதரின் வேலையை நிலைநிறுத்துவது
  choice: கடவுளிடம் நேரடியாக வேண்டுதல்
  alternative: வேலை தானாக நிலைபெற வேண்டும் என்ற பொதுவான விருப்பம்
  rationale: כּוֹנְנָה மற்றும் כּוֹנְנֵהוּ இரண்டும் கடவுளை நோக்கிய கட்டளை/வேண்டுதல் வடிவங்கள்; ஆகவே கடவுளே மனித முயற்சிக்கு உறுதியளிக்க வேண்டுமென்ற தொடர்பு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுமக்களுக்கு விளங்கும் வகையிலும் சங்கீத ஜெபத்திற்குரிய கண்ணியமான ஓசையுடனும் மொழிபெயர்க்கப்பட்டது. ‘நிலைநிறுத்துவீராக’ என்ற மரியாதையான வேண்டுதல் வடிவம், மூலத்தின் நேரடி விண்ணப்பத் தன்மையைப் பாதுகாக்கிறது; எபிரேய இணைப்புச் சொல்லின் வலியுறுத்தலை இயல்பாக்க ‘ஆம்’ பயன்படுத்தப்பட்டுள்ளது.
