  source_fidelity: மூல எபிரேயத்தின் வேண்டுதல்-விருப்பத் தன்மை (‘இருப்பதாக’), נֹעַם என்பதன் சூழல்சார் ‘அருள்’ பொருள், ‘எங்கள் கடவுளாகிய ஆண்டவர்’ என்ற இறைத் தலைப்பு, மற்றும் ‘எங்கள் கைகளின் வேலை’ என்ற மனித உழைப்புப் படிமம் ஆகியவை உண்மையுடன் வெளிப்படுத்தப்பட்டுள்ளன. இரண்டாம் עָלֵינוּ-வை ‘எங்களுக்காக’ என வழங்குவது தமிழில் தெளிவானதும், அதன் சொற்படியான மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளதுமாகும். இறுதி வினைச்சொல்லின் ஒருமைச் சுட்டு பொருளை மீண்டும் முழுச் சொற்றொடராகக் கூறுவது எபிரேய வலியுறுத்தலைத் தெளிவாகக் காட்டுகிறது.
  naturalness: நவீனத் தரத் தமிழில் இயல்பாகவும், சங்கீத ஜெபத்திற்குரிய மரியாதையான நடையுடனும் உள்ளது. ‘நிலைநிறுத்துவீராக’ கடவுளை நோக்கிய விண்ணப்பத்திற்கு ஏற்ற வடிவம். ‘ஆம்’ என்பது மீள்விண்ணப்பத்தின் வலியுறுத்தலை இயல்பாகக் குறிக்கிறது.
