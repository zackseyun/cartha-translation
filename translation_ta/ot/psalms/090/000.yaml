source:
  edition: WLC
  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/000.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: ta
  text: 'இறைவனுடைய மனிதரான மோசேயின்[a] வேண்டுதல்.


    ஆண்டவரே, தலைமுறைதோறும் நீரே எங்களுக்கு உறைவிடமாய் இருந்தீர்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: தலைப்பிலுள்ள எபிரெய முன்னிடைச்சொல் “மோசேயால்,” “மோசேயுடன் தொடர்புடைய,” அல்லது “மோசேக்கான” என்றும் பொருள்படலாம்.
    reason: alternative_reading
  - marker: b
    text: “உறைவிடம்” என்பதற்கு “அடைக்கலம்” அல்லது “வாழ்விடம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: மன்றாட்டு
  rationale: இது இறைவனை நோக்கி ஏறெடுக்கப்படும் வேண்டுதலைக் குறிக்கிறது; நவீனத் தமிழில் இயல்பாகவும் சங்கீதத் தலைப்புக்குரிய மாண்புடனும் உள்ளது.
- source_word: אִישׁ הָאֱלֹהִים
  choice: இறைவனின் மனிதர்
  rationale: மோசே இறைவனுக்குரியவர் மற்றும் அவரது ஊழியர் என்பதைக் குறிக்கும் எபிரெய மரபுத் தொடரை அதன் வேதாகமத் தன்மையுடன் காக்கிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது אֲדֹנָי என்ற அழைப்புமுறை; தமிழில் நேரடி அழைப்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מָעוֹן
  choice: உறைவிடம்
  rationale: முதன்மையாக ‘வாழும் இடம்/வாசஸ்தலம்’ என்று பொருள்படும் சொல்லை நேரடியாகத் தருகிறது; ‘அடைக்கலம்’ என்ற கருத்து சாத்தியமான நிழற்பொருளாக அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: בְּדֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: ஒவ்வொரு தலைமுறையிலும் தொடர்ச்சியாக என்ற எபிரெய மொழிநடையை இயல்பான தமிழில் பிரதிபலிக்கிறது.
theological_decisions:
- issue: לְמֹשֶׁה என்ற முன்னிடைச்சொல் மோசேயின் ஆசிரியத்துவத்தையா, தொடர்பையா, அர்ப்பணிப்பையா குறிக்கிறது?
  choice: மோசேயின்
  alternative: மோசேயால் / மோசேக்கான
  rationale: தலைப்பில் இயல்பான முதன்மை வாசிப்பைத் தருகிறது; எபிரெய முன்னிடைச்சொல்லின் உண்மையான பலபொருள் தன்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: מָעוֹן என்பதில் உறைவிடமா அல்லது பாதுகாப்பான அடைக்கலமா முன்னிலைப்படுத்தப்பட வேண்டும்?
  choice: உறைவிடம்
  alternative: அடைக்கலம் / வாசஸ்தலம்
  rationale: சொல்லின் அடிப்படை இடவாசப் பொருளை முதன்மை உரையில் காக்கிறது; இறைவன் பாதுகாப்பளிப்பவர் என்ற நிழற்பொருளை மொழிபெயர்ப்பில் கட்டாயமாக்காமல் மாற்றாகக் குறிப்பிடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியக்கூடிய, ஆனால் சங்கீதத்துக்கேற்ற மாண்பான நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மை வினை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; எபிரெய உரையின் கவித்துவச் சுருக்கமும் தலைமுறைத் தொடர்ச்சியும் காக்கப்பட்டுள்ளன.
