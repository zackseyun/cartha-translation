  to: 'இறைவனுடைய மனிதரான மோசேயின்[a] வேண்டுதல்.


    ஆண்டவரே, தலைமுறைதோறும் நீரே எங்களுக்கு உறைவிடமாய் இருந்தீர்.[b]'
  rationale: 'The revision makes only safe stylistic and lexical improvements: it renders the superscription in more idiomatic modern Tamil, uses a broad and natural equivalent for ‘prayer,’ and modernizes one footnote alternative. The source’s ambiguity concerning לְמֹשֶׁה remains explicitly preserved in the footnote, and the primary sense of מָעוֹן remains ‘dwelling place.’'
