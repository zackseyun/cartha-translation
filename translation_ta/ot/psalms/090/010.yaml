translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ ஓசையுடன் வடிவமைக்கப்பட்டது. சொற்சொறான எபிரெய அமைப்பு தமிழில் செயற்கையாக ஒலிக்கும் இடங்களில் பொருள் தெளிவுக்காக மிதமான இயல்பாக்கம் செய்யப்பட்டது; ‘பெருமை’ மற்றும் ‘பறந்துபோகிறோம்’ ஆகிய மூல உருவகங்கள் பாதுகாக்கப்பட்டன.
