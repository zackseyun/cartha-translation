  text: יְמֵֽי שְׁנוֹתֵ֨י/נוּ בָ/הֶ֥ם שִׁבְעִ֪ים שָׁנָ֡ה וְ/אִ֤ם בִּ/גְבוּרֹ֨ת שְׁמ֘וֹנִ֤ים שָׁנָ֗ה וְ֭/רָהְבָּ/ם עָמָ֣ל וָ/אָ֑וֶן כִּי גָ֥ז חִ֝֗ישׁ וַ/נָּעֻֽפָ/ה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/010.yaml
  text: The days of our years are seventy years[a], or if by strength, eighty years; yet their pride is toil and trouble, for it is soon gone[b], and we fly away.
translation:
  language: ta
  text: 'எங்கள் வாழ்நாளின் காலம் எழுபது ஆண்டுகள்;

    வலிமை இருந்தாலோ எண்பது ஆண்டுகள்.

    ஆனாலும் அவற்றின் பெருமை[a] உழைப்பும் துன்பமுமே;

    ஏனெனில் அது விரைவில் கடந்துபோகிறது[b],

    நாமும் பறந்துபோகிறோம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றில் சிறந்ததுகூட உழைப்பும் துன்பமுமே.” “அவற்றின் பெருமை” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல், அந்த ஆண்டுகளில் மிகவும் குறிப்பிடத்தக்க அல்லது வலிமையான பகுதியையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “ஏனெனில் அது வேகமாகக் கடந்துபோகிறது”; அல்லது, “ஏனெனில் அது விரைவில் வெட்டுண்டுபோகிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  choice: எங்கள் வாழ்நாளின் நாட்கள்
  rationale: எபிரெய மொழியின் ‘எங்கள் ஆண்டுகளின் நாட்கள்’ என்ற கவித்துவச் சொல்லாட்சியை, தமிழில் புரியத்தக்க வகையில் ‘வாழ்நாளின் நாட்கள்’ என்று வழங்குகிறது.
- source_word: בָהֶם שִׁבְעִים שָׁנָה
  choice: எழுபது ஆண்டுகள்
  rationale: மனித வாழ்நாளின் வழக்கமான மொத்தக் காலத்தைச் சுட்டும் எபிரெய மொழிவழக்கை இயல்பான தமிழில் தருகிறது.
- source_word: וְאִם בִּגְבוּרֹת
  choice: வலிமை இருந்தால்
  rationale: வலிமையால் வாழ்நாள் நீள்வதை ஒரு நிபந்தனைக்குரிய விதிவிலக்காகக் காட்டும் பொருளைப் பாதுகாக்கிறது.
- source_word: וְרָהְבָּם
  choice: அவற்றின் பெருமை
  rationale: இந்தச் சொல் பெருமை, பெருமிதத்துக்குரியது, அல்லது மிகவும் குறிப்பிடத்தக்க பகுதி எனப் பொருள்படலாம். ‘அவற்றின் பெருமை’ அதன் சொற்பொருளையும் வசனத்திலுள்ள முரண்நயத்தையும் காக்கிறது.
- source_word: עָמָל וָאָוֶן
  choice: உழைப்பும் துன்பமுமே
  rationale: இங்கு மனித வாழ்வின் கடின உழைப்பையும் துயர அனுபவத்தையும் குறிக்கிறது; ஒழுக்கக்கேடு என்ற சாத்தியப் பொருளைச் சூழல் ஆதரிக்கவில்லை.
- source_word: כִּי גָז חִישׁ
  choice: ஏனெனில் அது விரைவில் கடந்துபோகிறது
  rationale: גוז என்பதன் ‘கடந்துபோதல்’ அல்லது ‘வெட்டுண்டுபோதல்’ என்ற பொருள் வரம்புக்குள், வாழ்வின் குறுகிய தன்மையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַנָּעֻפָה
  choice: நாமும் பறந்துபோகிறோம்
  rationale: மூலத்திலுள்ள பறந்துபோகும் உயிரோட்டமான கவித்துவ உருவகத்தையும் தன்மைப் பன்மையையும் காக்கிறது.
