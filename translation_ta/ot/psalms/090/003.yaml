  text: תָּשֵׁ֣ב אֱ֭נוֹשׁ עַד דַּכָּ֑א וַ֝/תֹּ֗אמֶר שׁ֣וּבוּ בְנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/003.yaml
  text: You return man to dust[a], and say, “Return[b], sons of man.”
translation:
  language: ta
  text: நீர் மனிதனைப் புழுதிக்குத் திரும்பச் செய்கிறீர்[a]; “மனிதர்களே[b], திரும்புங்கள்” என்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நொறுங்கிய நிலைக்கு” அல்லது “நொறுக்கப்படுவதற்கு.” இபிரெயச் சொல் நொறுக்கப்பட்டதையோ பொடியாக்கப்பட்டதையோ குறிக்கிறது; இச்சூழலில் “புழுதி” அதன் கருத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, “ஆதாமின் மக்களே” அல்லது “மனிதனின் மக்களே”; இச்சொற்றொடர் மனிதர்களைப் பொதுவாகக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשֵׁב
  choice: திரும்பச் செய்து
  rationale: שׁוב என்பதன் காரணவினை வடிவை வெளிப்படுத்தி, மனிதனைத் திரும்பச் செய்பவர் கடவுள் என்பதையும், பின்னரும் வரும் שׁוּבוּ என்பதுடனான சொல்லிணைப்பையும் காக்கிறது.
- source_word: אֱנוֹשׁ
  choice: மனிதனை
  rationale: இங்கு இச்சொல் நிலையற்ற, சாவுக்குரிய மனிதகுலத்தை ஒருமைத் தொகுப்பாகக் குறிக்கிறது. ‘மனிதனை’ என்பது தமிழில் இயல்பாகவும் கவிதைநடைக்கு ஏற்றவாறும் உள்ளது.
- source_word: עַד דַּכָּא
  choice: புழுதிக்கு
  rationale: דַּכָּא என்பது நொறுக்கப்பட்ட அல்லது பொடியாக்கப்பட்ட நிலையைக் குறிக்கலாம். மனிதனின் இறப்பையும் மண்ணுக்குத் திரும்புவதையும் குறிக்கும் இச்சூழலில் ‘புழுதி’ அதன் கருத்தை இயல்பான தமிழில் தெரிவிக்கிறது; வேறு சாத்தியங்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
- source_word: וַתֹּאמֶר
  choice: என்கிறீர்
  rationale: கடவுளை நேரடியாக முன்னிலைப்படுத்தும் சங்கீதத்தின் நடையையும், பொதுவாக நிகழும் செயலைக் காட்டும் நிகழ்காலத் தொனியையும் காக்கிறது.
- source_word: שׁוּבוּ
  choice: திரும்புங்கள்
  rationale: பன்மை ஏவல் வடிவத்தைத் துல்லியமாகத் தருவதோடு, תָּשֵׁב உடனான ஒரே வேர்ச்சொல் தொடர்பையும் தமிழில் காக்கிறது.
- source_word: בְנֵי אָדָם
  choice: மனிதர்களே
  rationale: இபிரெயச் சொற்றொடர் சொற்படியாக ‘மனிதனின்/ஆதாமின் மக்களே’ என்றாலும், வழக்கில் மனிதகுலத்தைக் குறிக்கிறது. ‘மனிதர்களே’ என்பது நவீனத் தமிழில் இயல்பான அழைப்புமுறை; சொற்படியான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: בְנֵי אָדָם என்பதிலுள்ள ஆதாம்/மனிதன் தொடர்பு
  choice: முதன்மை உரையில் ‘மனிதர்களே’; அடிக்குறிப்பில் ‘ஆதாமின் மக்களே’
  alternative: ஆதாமின் மக்களே
  rationale: இச்சொற்றொடர் மனிதகுலத்தைப் பொதுவாகக் குறிக்கிறது. முதன்மை உரை இயல்பான நவீனத் தமிழைப் பயன்படுத்துகிறது; அதேவேளை ஆதாம், மனிதத் தோற்றம், மரணம் ஆகியவற்றுக்கிடையிலான சாத்தியமான சொல்லியல் தொடர்பை அடிக்குறிப்பு மறைக்காமல் காக்கிறது.
- issue: דַּכָּא என்பதன் பொருள்
  choice: புழுதி
  alternative: நொறுங்கிய நிலை / நொறுக்கப்படுதல்
  rationale: மனிதன் மீண்டும் மண்ணுக்குச் செல்லும் இறப்புச் சூழலில் ‘புழுதி’ தெளிவாகப் பொருந்துகிறது. எனினும் இபிரெயச் சொல் நேரடியாக நொறுக்கப்பட்ட அல்லது பொடியாக்கப்பட்ட நிலையைக் குறிக்கக்கூடும் என்பதால் அந்தத் தெளிவின்மை அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மற்றும் கவிதைநடைக்கு ஏற்ற கண்ணியமான மொழி பயன்படுத்தப்பட்டுள்ளது. ‘நீர்/என்கிறீர்’ என்ற மரியாதை ஒருமை கடவுளை நோக்கிய நேரடி உரையைத் தக்கவைக்கிறது. ‘திரும்பச் செய்து/திரும்புங்கள்’ மூலம் இபிரெய மூலத்தின் சொல்லியல் மறுமொழி பாதுகாக்கப்பட்டுள்ளது.
