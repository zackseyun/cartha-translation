source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה עַד מָתָ֑י וְ֝/הִנָּחֵ֗ם עַל עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/013.yaml
  text: Return[a], O Yahweh—how long? And have compassion on your servants.
translation:
  language: ta
  text: யாவே, திரும்பி வாரும்—எவ்வளவு காலம்? உமது ஊழியர்கள்மேல் மனமிரங்கும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது ஊழியர்களைக் குறித்து மனம் மாறும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: திரும்பி வாரும்
  rationale: இறைவனை நோக்கிய שוב வினையின் கட்டளை வடிவத்தை நேரடியாகவும் இயல்பான தமிழ் வேண்டுதல் நடையிலும் தருகிறது; ‘மனம் மாறும்’ என்ற பொருளை இங்கே முன்கூட்டியே புகுத்தவில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עַד מָתָי
  choice: இன்னும் எவ்வளவு காலம்?
  rationale: எபிரெயப் புலம்பல் மொழியின் அவசரத்தையும் நீடிக்கும் காத்திருப்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְהִנָּחֵם
  choice: மனமிரங்கும்
  rationale: נחם என்ற வினையின் இரக்கம் கொள்ளுதல், மனம் நெகிழ்தல், நடவடிக்கையை மாற்றுதல் ஆகிய பொருள் நிழல்களில், இச்சூழலின் வேண்டுதலுக்கு ஏற்ற இரக்கப் பரிமாணத்தைத் தருகிறது; தெய்வம் ஒழுக்கத் தவறிலிருந்து மனந்திரும்புவதாகத் தவறாக உணர்த்தாது.
- source_word: עַל
  choice: குறித்து
  rationale: נחם உடன் வரும் עַל, இரக்கம் அல்லது தணிதல் எவரைப் பற்றியது என்பதைச் சுட்டுகிறது; ‘ஊழியர்களைக் குறித்து மனமிரங்கும்’ என்பது மூலத்தின் தொடர்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: עֲבָדֶיךָ
  choice: உமது ஊழியர்கள்
  rationale: இறைவனோடு உள்ள பணிவான உடன்படிக்கை உறவை இச்சூழலில் இயல்பாகக் காட்டுகிறது; ‘அடிமைகள்’ என்பதைக் காட்டிலும் வழிபாட்டு வேண்டுதல் நடைக்கு ஏற்றது.
theological_decisions:
- issue: இறைவனைச் சார்ந்து வரும் נחם என்பதன் மொழிபெயர்ப்பு
  choice: மனமிரங்கும்
  alternative: உமது ஊழியர்களைக் குறித்துத் தணியும் / மனம் மாறும்
  rationale: எபிரெயச் சொல் இரக்கத்தால் உந்தப்பட்டு நடவடிக்கையை மாற்றுதல் அல்லது தணிதல் என்ற அழுத்தத்தையும் கொண்டிருக்கலாம். முதன்மை உரை அதன் இரக்கப் பரிமாணத்தை இயல்பாகத் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டு மூலத்தின் இறையியல் இழுவை மறைக்காமல் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான வேண்டுதல் நடை. ‘வாரும்’, ‘உமது’, ‘மனமிரங்கும்’ ஆகிய மரியாதை வடிவங்கள் வழிபாட்டு சூழலுக்கு ஏற்றவையாகவும் சாதாரண வாசகர்களுக்கு புரியத்தக்கவையாகவும் உள்ளன. அடிக்குறி [a] அது விளக்கும் ‘மனமிரங்கும்’ என்பதற்குப் பின் வைக்கப்பட்டுள்ளது.
