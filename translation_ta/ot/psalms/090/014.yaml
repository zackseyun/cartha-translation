source:
  edition: WLC
  text: שַׂבְּעֵ֣/נוּ בַ/בֹּ֣קֶר חַסְדֶּ֑/ךָ וּֽ/נְרַנְּנָ֥ה וְ֝/נִשְׂמְחָ֗ה בְּ/כָל יָמֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/014.yaml
  text: Satisfy us in the morning with your steadfast love[a], and we will sing for joy and be glad all our days.
translation:
  language: ta
  text: காலையில் உமது மாறாத அன்பால்[a] எங்களைத் திருப்திப்படுத்தும்; அப்பொழுது எங்கள் நாட்களெல்லாம் நாங்கள் மகிழ்ச்சியுடன் பாடிக் களிகூருவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது உடன்படிக்கை அன்பால்’ அல்லது ‘உமது இரக்கத்தால்.’ எபிரெயச் சொல் חֶסֶד உண்மையுள்ள, நிலைத்த அன்பையும் கனிவையும் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂבְּעֵנוּ
  choice: எங்களைத் திருப்தியாக்கும்
  rationale: שבע என்பதன் பியேல் கட்டளை வடிவம், முதலாம் நபர் பன்மை பின்னொட்டுடன், முழுமையாக நிறைவடையச் செய்வதை வேண்டுகிறது. ‘திருப்தியாக்கும்’ என்பது நவீன தமிழில் இயல்பாகவும் நிறைவின் கருத்தைத் தெளிவாகவும் தருகிறது.
- source_word: בַבֹּקֶר
  choice: காலையில்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான காலப்பொருளைத் தக்கவைக்கிறது; ‘ஒவ்வொரு காலையிலும்’ என்ற தொடர்ச்சியையோ ‘காலைக்குள்’ என்ற காலக்கெடுவையோ உரையில் சேர்க்கவில்லை.
- source_word: חַסְדֶּךָ
  choice: உமது மாறாத அன்பால்
  rationale: חֶסֶד குறிக்கும் நிலையான, உண்மையுள்ள அன்பையும் இரக்கமிக்க நற்குணத்தையும் ‘மாறாத அன்பு’ இயல்பான தமிழில் எடுத்துரைக்கிறது; அதன் உடன்படிக்கை சார்ந்த நுணுக்கத்தை மட்டும் கட்டாயப்படுத்தவில்லை.
- source_word: וּנְרַנְּנָה
  choice: நாங்கள் மகிழ்ச்சியுடன் பாடி
  rationale: רנן என்பது மகிழ்ச்சி பொங்கும் குரல் அல்லது பாடலைக் குறிக்கிறது. ‘மகிழ்ச்சியுடன் பாடி’ அதன் குரல்வழி வெளிப்பாட்டைத் தக்கவைக்கிறது.
- source_word: וְנִשְׂמְחָה
  choice: களிகூருவோம்
  rationale: שמח என்பதன் மகிழ்தல் அல்லது களிகூர்தல் என்ற பொருளைத் தருகிறது. முந்தைய வினையுடன் இணைந்து எபிரெயப் பாவனையின் இணைநிலையை இயல்பான தமிழில் காக்கிறது.
- source_word: בְּכָל יָמֵינוּ
  choice: எங்கள் நாட்களெல்லாம்
  rationale: பேசுவோரின் வாழ்நாள் முழுவதையும் குறிக்கும் காலச் சொற்றொடரைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தேவனுடைய חֶסֶד என்பதை வேண்டுதலின் சூழலில் மொழிபெயர்த்தல்
  choice: உமது மாறாத அன்பு
  alternative: உமது உடன்படிக்கை அன்பு; உமது இரக்கம்
  rationale: இச்சொல் நிலைத்த, உண்மையுள்ள அன்பையும் கருணையையும் உள்ளடக்குகிறது. ‘மாறாத அன்பு’ அதன் பரந்த இறையியல் செறிவைத் தக்கவைக்கிறது; ‘உடன்படிக்கை அன்பு’ என்ற ஒரே விளக்கத்திற்கோ வெறும் ‘இரக்கம்’ என்ற குறுகிய பொருளுக்கோ அதைச் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘உமது’ மற்றும் கட்டளை வேண்டுதல் வடிவமான ‘திருப்தியாக்கும்’ இலக்கிய மரியாதையைத் தருகின்றன; மொழி பொதுவாசகர்களுக்கும் புரியுமாறு வைக்கப்பட்டுள்ளது.
