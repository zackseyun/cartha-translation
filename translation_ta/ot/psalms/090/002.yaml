  text: בְּ/טֶ֤רֶם הָ֘רִ֤ים יֻלָּ֗דוּ וַ/תְּח֣וֹלֵֽל אֶ֣רֶץ וְ/תֵבֵ֑ל וּֽ/מֵ/עוֹלָ֥ם עַד ע֝וֹלָ֗ם אַתָּ֥ה אֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/002.yaml
  text: Before the mountains were born[a], and you brought forth the earth and the world, from everlasting to everlasting you are God.
translation:
  language: ta
  text: மலைகள் பிறக்குமுன்னும், பூமியையும் உலகத்தையும் நீர் பெற்றெடுக்குமுன்னும், ஆதியற்ற காலம் முதல் முடிவற்ற காலம் வரை நீரே கடவுள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: முன்பே
  rationale: படைப்புக்கு முந்திய காலத்தைச் சுட்டும் எபிரெயச் சொல்லின் temporal force-ஐ இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: הָרִים
  choice: மலைகள்
  rationale: எபிரெய மூலத்தின் பன்மையையும் படைப்புக் கவிதையின் முதன்மையான காட்சியையும் நேரடியாகப் பேணுகிறது.
- source_word: יֻלָּדוּ
  choice: பிறப்பதற்கும்
  rationale: ילד என்ற வேரின் பிறப்பு உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது; ‘உருவாக்கப்படுவதற்கும்’ என்று பொதுமைப்படுத்தவில்லை.
- source_word: וַתְּחוֹלֵל
  choice: நீர் பெற்றெடுப்பதற்கும்
  rationale: பிரசவம்/பிறப்பு சார்ந்த எபிரெய உருவகத்தை இயல்பான தமிழில் பேணுகிறது. மரியாதை ஒருமையான ‘நீர்’ சங்கீதத்தின் நேரடி இறைமுகப்புக்கு ஏற்றது.
- source_word: אֶרֶץ
  choice: பூமி
  rationale: תֵבֵל என்பதோடு இணைந்த அண்டளாவிய படைப்புச் சூழலில், உள்ளூர் ‘நாடு’ என்பதைக் காட்டிலும் ‘பூமி’ பொருத்தமானது.
- source_word: וְתֵבֵל
  choice: உலகம்
  rationale: ஒழுங்குபெற்ற அல்லது குடியிருக்கும் உலகைக் குறிக்கும் சொல்லைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: וּמֵעוֹלָם עַד עוֹלָם
  choice: ஆதியற்ற காலம் முதல் முடிவற்ற காலம் வரை
  rationale: இரு திசைகளிலும் எல்லையற்ற காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரின் பொருளை தெளிவான தமிழில் வெளிப்படுத்துகிறது; வெறும் எதிர்காலத் தொடர்ச்சியாகக் குறுக்கவில்லை.
- source_word: אַתָּה
  choice: நீரே
  rationale: வெளிப்படையாக வரும் இரண்டாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலை ‘-ஏ’ மூலம் பேணுகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு இறைப் பெயராகச் செயல்படும் אֵל என்பதற்கான தெளிவான, பொதுவாகப் புரியும் நவீனத் தமிழ் இணை.
theological_decisions:
- issue: படைப்பை பிறப்பு/பிரசவ உருவகத்தில் கூறுதல்
  choice: மலைகள் ‘பிறப்பதும்’, கடவுள் பூமியையும் உலகத்தையும் ‘பெற்றெடுப்பதும்’ என்ற உருவகத்தைப் பேணுதல்
  alternative: ‘படைத்தல்’ அல்லது ‘உருவாக்குதல்’ என்று உருவகத்தை நீக்குதல்
  rationale: எபிரெய உரை படைப்பின் தொடக்கத்தையும் அதற்கு முன்பே கடவுள் இருப்பதையும் பிறப்பு சார்ந்த கவித்துவ மொழியில் கூறுகிறது. அந்த உருவகத்தைப் பேணுவது படைப்பின் முறை குறித்து கூடுதல் கோட்பாட்டைச் சேர்ப்பதல்ல.
- issue: கடவுளின் நித்திய இருப்பை மொழிபெயர்த்தல்
  choice: ஆதியற்ற காலம் முதல் முடிவற்ற காலம் வரை நீரே கடவுள்
  alternative: என்றென்றைக்கும் நீரே கடவுள்
  rationale: ‘என்றென்றைக்கும்’ என்பது தமிழில் பெரும்பாலும் எதிர்காலத் தொடர்ச்சியாக மட்டும் கேட்கலாம். தேர்ந்த சொற்றொடர் מֵעוֹלָם עַד עוֹלָם என்பதன் பின்னோக்கும் முன்னோக்கும் எல்லையற்ற கால வீச்சைப் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்குரிய கண்ணியமான கவித்துவ நடையிலும் அமைக்கப்பட்டது. கடவுளை நேரடியாகச் சுட்டும் இடத்தில் மரியாதை ஒருமையான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது; பிறப்பு உருவகம் மென்மைப்படுத்தப்பட்டாலும் நீக்கப்படவில்லை.
