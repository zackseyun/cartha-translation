  text: In the morning it sprouts and flourishes[c][b][a]; by evening it withers and dries up.
translation:
  language: ta
  text: காலையில் அது முளைத்து[a] செழிக்கிறது[b]; மாலையில் அது வாடி[c] உலர்ந்து போகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பூக்கிறது” என்றும் மொழிபெயர்க்கலாம். יָצִיץ என்னும் எபிரெய வினை முளைப்பதையோ பூப்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல் முறையில், “கடந்துபோகிறது” அல்லது “மாறுகிறது” என்றும் பொருள் கொள்ளலாம். וְחָלָף இச்செடி உருவகத்தில் செழித்து வளர்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “வெட்டப்படுகிறது” என்றும் மொழிபெயர்க்கலாம். יְמוֹלֵל இச்சூழலில் வாடுவதையோ வெட்டப்படுவதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: புல்லின் குறுகிய வாழ்வில் உயிர்ப்பும் வளர்ச்சியும் காணப்படும் நேரத்தைக் குறிக்கும் இயல்பான தமிழ்ச் சொற்றொடர்.
- source_word: יָצִיץ
  choice: அது முளைத்து
  rationale: צוץ என்னும் வினை முளைத்தல் அல்லது பூத்தல் என்னும் பொருளைத் தரலாம். இங்கு செடியின் வாழ்க்கைச் சுழற்சியின் தொடக்கத்தைத் தெளிவாகக் காட்டுவதால் ‘முளைத்து’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְחָלָף
  choice: செழிக்கிறது
  rationale: חלף என்பதன் அடிப்படைப் பொருள் கடந்துசெல்லுதல் அல்லது மாறுதல்; தாவர உருவகத்தில் காலைப் பொழுதில் புல் புதிதாக வளர்ந்து நிற்பதைக் குறிக்கலாம். இயல்பான தமிழில் சூழலுக்கேற்றவாறு ‘செழிக்கிறது’ என வழங்கப்பட்டது; மூலத்தின் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לָעֶרֶב
  choice: மாலைக்குள்
  rationale: காலைக்கும் மாலைக்கும் இடையிலான விரைவான மாற்றத்தைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: יְמוֹלֵל
  choice: அது வாடி
  rationale: இந்த வினை வாடுதல் அல்லது வெட்டப்படுதல் எனப் பொருள்படலாம். அடுத்துவரும் ‘உலர்ந்துபோகிறது’ என்பதுடன் இயல்பாக இணைவதால் ‘வாடி’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְיָבֵשׁ
  choice: உலர்ந்துபோகிறது
  rationale: தாவரம் ஈரத்தன்மையை இழந்து காய்ந்துவிடும் இறுதி நிலையை இயல்பான நவீன தமிழில் காட்டுகிறது.
