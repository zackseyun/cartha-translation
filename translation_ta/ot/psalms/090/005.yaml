id: PSA.90.5
reference: Psalms 90:5
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: זְ֭רַמְתָּ/ם שֵׁנָ֣ה יִהְי֑וּ בַּ֝/בֹּ֗קֶר כֶּ/חָצִ֥יר יַחֲלֹֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/005.yaml
  text: You sweep them away[a]; they are like a dream[c][b]. In the morning they are like grass that sprouts anew.
translation:
  language: ta
  text: நீர் அவர்களை அடித்துச் செல்கிறீர்[a]; அவர்கள் ஒரு கனவைப்போல் இருக்கிறார்கள்[b]. காலையில், அவர்கள் புதிதாகத் துளிர்க்கும் புல்லைப் போன்றவர்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் அவர்களை வெள்ளம்போல் வாரிக்கொண்டு போகிறீர்.” இந்த வினை பெருக்கெடுத்த நீரோட்டத்தில் அடித்துச் செல்லப்படுவதை உணர்த்தலாம்.
    reason: alternative_reading
  - marker: b
    text: நேரடியாக, “அவர்கள் உறக்கமாக இருப்பார்கள்.” எபிரெயச் சொற்றொடர் மிகவும் சுருக்கமானது; “உறக்கத்தைப்போல்” என்றும் புரிந்துகொள்ளலாம்.
    reason: source_clarity
  - marker: c
    text: “புல் புதிதாகத் துளிர்க்கிறது” என்றும் மொழிபெயர்க்கலாம். இறுதி வினை ஒருமையில் வந்து ‘புல்’ என்பதுடன் இலக்கணப்படி பொருந்துகிறது. அந்த வினைக்கு “கடந்து போகிறது” என்ற பொருளும் இருக்கலாம்; ஆனால் அடுத்த வசனத்தின் காலைநேர வளர்ச்சிப் படிமம் இங்கு புதிதாகத் துளிர்ப்பதைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: זְרַמְתָּם
  choice: நீர் அவர்களை அடித்துச் செல்கிறீர்
  rationale: זָרַם என்ற வினை, பெருக்கெடுத்த நீரோட்டத்தில் வாரிக்கொண்டு போவதை உணர்த்துகிறது. தமிழில் இயல்பாக ஒலிக்கும்படியும் திடீரென அகற்றப்படும் படிமத்தைப் பாதுகாக்கும்படியும் ‘அடித்துச் செல்கிறீர்’ என மொழிபெயர்க்கப்பட்டது; நீர்ப்படிமம் அடிக்குறிப்பில் தெளிவாக்கப்படுகிறது.
- source_word: שֵׁנָה יִהְיוּ
  choice: அவர்கள் ஒரு கனவைப்போல் இருக்கிறார்கள்
  rationale: எபிரெய உரை சொற்பட ‘அவர்கள் உறக்கமாக இருப்பார்கள்’ என்று மிகவும் சுருக்கமாக உள்ளது. மனித வாழ்வின் நிலையாமையை இயல்பான தமிழில் வெளிப்படுத்த ‘ஒரு கனவைப்போல்’ எனக் கொடுக்கப்பட்டுள்ளது; ‘உறக்கம்’ என்ற நேரடி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: காலை நேரத்தைக் குறிக்கும் எளிய, இயல்பான தமிழ் வடிவம்; அடுத்த வசனத்தின் மாலைநேர வாடுதலுடன் உள்ள கவித்துவ எதிர்மறையையும் தக்கவைக்கிறது.
- source_word: כֶּחָצִיר
  choice: புல்லைப் போன்றவர்கள்
  rationale: חָצִיר என்பது இங்கு விரைவில் வளர்ந்து வாடும் புல் அல்லது பசுந்தழையைக் குறிக்கிறது. ‘புல்’ என்பது தெளிவான, பொதுவாகப் புரியும் இணைச்சொல்.
- source_word: יַחֲלֹף
  choice: புதிதாகத் துளிர்க்கும்
  rationale: חלף என்பதற்கு மாறுதல், கடந்து போதல், புதுப்பித்தல் போன்ற பொருள் வரம்பு உள்ளது. 6ஆம் வசனத்தின் ‘பூக்கிறது’ என்பதோடு இணைந்த காலைநேரப் படிமம் காரணமாக இங்கு ‘புதிதாகத் துளிர்க்கும்’ எனத் தேர்ந்தெடுக்கப்பட்டது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மனித வாழ்வின் நிலையாமையை உறக்கம் அல்லது கனவு என்ற படிமத்தில் எடுத்துரைத்தல்
  choice: முதன்மை உரையில் ‘ஒரு கனவைப்போல்’
  alternative: ‘உறக்கத்தைப்போல்’
  rationale: முதன்மை வடிவம் நவீன தமிழில் படிமத்தின் நோக்கத்தைத் தெளிவாகச் சொல்கிறது; அதேவேளை மூலத்தின் நேரடி ‘உறக்கம்’ வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டதால் கவித்துவத் தெளிவின்மை மறைக்கப்படவில்லை.
- issue: יַחֲלֹף என்பதன் பொருள்
  choice: ‘புதிதாகத் துளிர்க்கும்’
  alternative: ‘கடந்து போகும்’ அல்லது ‘மறைந்துபோகும்’
  rationale: அடுத்த வசனத்தில் புல் காலையில் வளர்ந்து பூத்து, மாலையில் வாடும் தொடர்ச்சி காணப்படுவதால் புதிதாக வளர்தல் என்ற பொருள் சூழலுக்கு ஏற்றது. இருப்பினும் வேர்ச்சொல்லின் பரந்த பொருள் வரம்பும் மரபான மாற்று வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான கவித்துவ நடையுடன் வடிவமைக்கப்பட்டது. ‘நீர்’ என்ற மரியாதை ஒருமை இறைவனை நோக்கிய உரையைத் தக்கவைக்கிறது. மூல எபிரெயின் சுருக்கம் தமிழில் புரியாதபடி விடப்படாமல், அதன் உண்மையான சொற்பொருள் மற்றும் மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
