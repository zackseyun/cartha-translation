  text: כִּ֤י אֶ֪לֶף שָׁנִ֡ים בְּֽ/עֵינֶ֗י/ךָ כְּ/י֣וֹם אֶ֭תְמוֹל כִּ֣י יַעֲבֹ֑ר וְ/אַשְׁמוּרָ֥ה בַ/לָּֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/004.yaml
  text: For a thousand years in your sight are like yesterday when it is past[c][b][a], or like a watch in the night.
translation:
  language: ta
  text: ஏனெனில், உமது பார்வையில் ஆயிரம் ஆண்டுகள் கடந்துபோன நேற்றைப் போலவும்[a], இரவின் ஒரு காவல் வேளையைப்போலவும்[b] இருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அது கடந்துபோகும்போது” அல்லது “அது கடந்து போவதால்” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் காலத் தொடர்பையோ காரணத் தொடர்பையோ சுட்டலாம்.
    reason: lexical_alternative
  - marker: b
    text: “காவல் வேளை” என்பது இரவில் காவல் காப்பதற்காகப் பிரிக்கப்பட்ட ஒரு காலப்பகுதி.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்திற்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பாக இங்கு இயல்பாக அமைகிறது.
- source_word: אֶלֶף שָׁנִים
  choice: ஆயிரம் ஆண்டுகள்
  rationale: எண்ணிக்கையை நேரடியாகத் தக்கவைத்து, இறைவனின் பார்வையிலுள்ள காலத்துக்கும் மனித அனுபவத்திலுள்ள காலத்துக்கும் இடையேயான கவிதை ஒப்புமையைப் பாதுகாக்கிறது.
- source_word: בְּעֵינֶיךָ
  choice: உமது பார்வையில்
  rationale: சொல்லுக்குச் சொல் 'உமது கண்களில்' என்ற உருவகத்தை, நவீனத் தமிழில் இயல்பாகப் புரியும் விதத்தில் பார்வை அல்லது மதிப்பீடு என்ற பொருளோடு வழங்குகிறது.
- source_word: כְּיוֹם אֶתְמוֹל
  choice: நேற்றைய நாளைப்போல
  rationale: '''நேற்று'' என்பதிலுள்ள அண்மையும் விரைவில் மறைந்துபோகும் தன்மையும் தக்கவைக்கப்படுகிறது; ''நேற்றின் நாள்'' போன்ற செயற்கையான அமைப்பு தவிர்க்கப்படுகிறது.'
- source_word: כִּי יַעֲבֹר
  choice: கடந்துபோன
  rationale: '''நேற்றைய நாள்'' ஏற்கெனவே கடந்துவிட்டது என்ற சூழலைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது; எபிரெயச் சொற்றொடரின் கால/காரண நுணுக்கம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.'
- source_word: וְאַשְׁמוּרָה
  choice: …போலவும்
  rationale: இரண்டாவது ஒப்புமையைத் தொடர்கிறது. வெளிப்படையாக 'மற்றும்' அல்லது 'அல்லது' என்று தீர்மானிக்காமல், இணையான இரு உவமைகளையும் தமிழின் '-போலவும்' அமைப்பு இயல்பாக இணைக்கிறது.
- source_word: אַשְׁמוּרָה בַלָּיְלָה
  choice: இரவின் ஒரு காவல் வேளை
  rationale: இரவில் காவல் காப்பதற்காகப் பிரிக்கப்பட்ட ஒரு காலப்பகுதியைக் குறிக்கிறது; வெறும் காவல் செயலை அல்ல, குறிப்பிட்ட நேரப் பிரிவைத் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: காலத்தைப் பற்றிய இறைவனின் பார்வையை மனித உருவக மொழியில் கூறுதல்
  choice: '''உமது பார்வையில்'' என்ற உருவகத்தையும் கால ஒப்புமைகளையும் விரிவாக்கமின்றித் தக்கவைத்தல்'
  alternative: இறைவனுக்கு ஆயிரம் ஆண்டுகள் ஒன்றுமே இல்லை அல்லது இறைவன் காலத்திற்கு அப்பாற்பட்டவர் என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: வசனம் இறைவனின் கால இயல்பைப் பற்றிய முழுமையான தத்துவ வரையறையை அளிக்காமல், மனித கால அனுபவத்துடன் அவரது பார்வையை கவிதைமயமாக ஒப்பிடுகிறது. ஆகவே பிற்கால இறையியல் முடிவுகள் உரைக்குள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. 'உமது' என்ற மரியாதை ஒருமை இறைவனை நேரடியாக அழைக்கும் சூழலைத் தக்கவைக்கிறது. இரு உவமைகளையும் '-போலவும்' என்ற இணை அமைப்பு சமநிலையுடன் வழங்குகிறது.
