  yaml_path: translation/ot/psalms/090/008.yaml
  text: You have set our iniquities before you[b][a], our hidden sins in the light of your face.
translation:
  language: ta
  text: 'எங்கள் அக்கிரமங்களை உமக்கு முன்பாக வைத்திருக்கிறீர்;

    எங்கள் மறைவான பாவங்களை உமது முகத்தின் ஒளியில் வைத்திருக்கிறீர்.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘எங்கள் மறைவான பாவங்கள்’ என்பதற்கு ‘எங்கள் மறைவானவை’ அல்லது ‘எங்கள் இரகசியப் பாவங்கள்’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொல் மறைக்கப்பட்ட அல்லது இரகசியமானவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘உமது முகத்தின் ஒளி’ என்பது கடவுளுடைய முன்னிலையில் அனைத்தும் முழுமையாக வெளிப்படுவதைக் காட்டும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתָּה / שת
  choice: வைத்திருக்கிறீர்
  rationale: שִׁית என்பதன் பொருள் ‘வை’ அல்லது ‘நிறுத்து’. நிறைவேறிய தெய்வச் செயல் தற்போதும் விளைவுடையதாக இருப்பதைத் தமிழின் நிகழ்கால நிறைவுப் பயன்பாடு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עֲוֺנֹתֵינוּ
  choice: எங்கள் அக்கிரமங்களை
  rationale: עָוֹן என்பது குற்றச்செயல், பாவக்கேடு, குற்றப்பழி ஆகிய பொருள் நிழல்களைக் கொண்டது. இங்கு பன்மையில் வரும் ஒழுக்கக் குற்றங்களின் கனத்தை ‘அக்கிரமங்கள்’ காக்கிறது.
- source_word: לְנֶגְדֶּךָ
  choice: உமக்கு முன்பாக
  rationale: இச்சொற்றொடர் நேரடியாக ‘உமக்கு எதிரில்/முன்பாக’ என்று பொருள்பட்டு, கடவுளின் பார்வைக்கு வெளிப்பட்டிருப்பதைக் காட்டுகிறது.
- source_word: עֲלֻמֵנוּ
  choice: எங்கள் மறைவான பாவங்களை
  rationale: இச்சொல் மறைக்கப்பட்ட அல்லது இரகசியமானவற்றைக் குறிக்கிறது. ‘எங்கள் அக்கிரமங்கள்’ என்ற இணைவரியால் இங்கு மறைக்கப்பட்ட பாவங்களே குறிக்கப்படுகின்றன; தமிழில் பொருளைத் தெளிவாக்க ‘பாவங்கள்’ வெளிப்படையாகச் சேர்க்கப்படுகிறது.
- source_word: לִמְאוֹר
  choice: ஒளியில்
  rationale: மறைந்திருப்பது வெளிச்சத்தில் முழுமையாக வெளிப்படுகிறது என்ற கவித்துவப் படிமத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: פָּנֶיךָ
  choice: உமது முகத்தின்
  rationale: ‘முகம்’ என்ற நேரடியான உருவகத்தைப் பாதுகாக்கிறது; இதை ‘சந்நிதி’ என்று கருத்தாக்காமல், எபிரேயக் கவித்துவத்தின் தெய்வீகப் பார்வை படிமத்தை நிலைநிறுத்துகிறது.
theological_decisions:
- issue: עֲלֻמֵנוּ என்பதில் மறைந்திருக்கும் பொருளை வெளிப்படையாகக் கூறுவதா
  choice: ‘எங்கள் மறைவான பாவங்கள்’ என்று மொழிபெயர்த்தல்
  alternative: ‘எங்கள் மறைவானவை’ அல்லது ‘எங்கள் இரகசியங்கள்’
  rationale: முதல் அரையடியிலுள்ள ‘எங்கள் அக்கிரமங்கள்’ என்பதோடு அமைந்த இணைநிலை, நடுநிலையான இரகசிய காரியங்களை அல்ல, மறைக்கப்பட்ட பாவங்களையே குறிக்கிறது. ‘பாவங்கள்’ என்பது சூழலால் உணர்த்தப்படும் சொல்லைத் தெளிவாக்குகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
- issue: ‘உமது முகத்தின் ஒளி’ என்ற உருவகத்தை கருத்துரையாக மாற்றுவதா
  choice: முகம் மற்றும் ஒளி ஆகிய இரு மூல உருவகங்களையும் காத்தல்
  alternative: ‘உமது பிரசன்னத்தின் முழு வெளிச்சத்தில்’
  rationale: மூலத்தின் செறிவான உருவகம் கடவுளின் முன்னிலையில் எதுவும் மறையாது என்ற பொருளைத் தாங்குகிறது. அதை விளக்கவுரையாக மட்டும் மாற்றுவது கவித்துவத்தைக் குறைக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்தின் கண்ணியமான கவித்துவ நடையைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. கடவுளை நோக்கிய மரியாதைப் பன்மை (‘உமது’, ‘வைத்திருக்கிறீர்’) பயன்படுத்தப்பட்டுள்ளது. எபிரேய இணைநிலையும் ‘முகத்தின் ஒளி’ என்ற மூல உருவகமும் காக்கப்பட்டுள்ளன.
