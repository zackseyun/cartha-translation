revisions:
- from: 'எங்கள் அக்கிரமங்களை உமக்கு முன்பாகவும்,

    எங்கள் மறைவான பாவங்களை உமது முகத்தின் ஒளியிலும் வைத்திருக்கிறீர்.[a]'
  to: 'எங்கள் அக்கிரமங்களை உமக்கு முன்பாக வைத்திருக்கிறீர்;

    எங்கள் மறைவான பாவங்களை உமது முகத்தின் ஒளியில் வைத்திருக்கிறீர்.[a][b]'
  rationale: 'The revision uses two parallel Tamil clauses to map the Hebrew parallelism clearly: the iniquities are set before God, and the hidden sins are set in the light of God’s face. It retains the draft’s source-faithful theological vocabulary and concrete imagery. The footnotes are divided so that the lexical alternative and the poetic image have distinct anchors.'
