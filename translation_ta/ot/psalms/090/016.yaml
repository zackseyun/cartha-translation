language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יֵרָאֶ֣ה אֶל עֲבָדֶ֣י/ךָ פָעֳלֶ֑/ךָ וַ֝/הֲדָרְ/ךָ֗ עַל בְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/016.yaml
  text: Let your work appear to your servants, and your splendor upon their children.
translation:
  language: ta
  text: 'உமது செயல் உமது பணியாளர்களுக்குக் காணப்படட்டும்;

    உமது மாட்சிமை அவர்களுடைய பிள்ளைகள்மேல் விளங்கட்டும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָעֳלֶךָ
  choice: உமது செயல்
  rationale: இச்சொல் கடவுளின் செயல் அல்லது செயல்பாட்டைக் குறிக்கிறது; ஒருமை வடிவத்தையும் சூழலின் பரந்த பொருளையும் தக்கவைக்கிறது.
- source_word: עֲבָדֶיךָ
  choice: உமது பணியாளர்கள்
  rationale: עֶבֶד என்பதன் அடிப்படைப் பொருள் சேவை செய்பவர்; சங்கீதச் சூழலில் இயல்பாகவும் கண்ணியமாகவும் ஒலிக்க ‘பணியாளர்கள்’ எனத் தரப்பட்டுள்ளது.
- source_word: הֲדָרְךָ
  choice: உமது மாட்சிமை
  rationale: הָדָר குறிக்கும் பெருமை, கம்பீரம், ஒளிவிளக்கம் ஆகிய பொருள் வளத்தை ‘மாட்சிமை’ இயல்பாக எடுத்துரைக்கிறது.
- source_word: עַל־בְּנֵיהֶם
  choice: அவர்களுடைய பிள்ளைகள்மேல்
  rationale: עַל என்பதன் ‘மேல்’ என்ற இடைச்சொல் உறவை வெளிப்படையாகப் பாதுகாக்கிறது; בנים இங்கு சந்ததி/பிள்ளைகள் எனப் பொருள்படுகிறது.
- source_word: יֵרָאֶה
  choice: காணப்படட்டும்
  rationale: נראה என்ற நிஃபால் வடிவத்தின் ‘காணப்படுதல்/வெளிப்படுதல்’ என்ற பொருளையும் வேண்டுதல் நயத்தையும் பாதுகாக்கிறது.
theological_decisions:
- issue: இரண்டாம் அடியில் தனி வினைச்சொல் இல்லாமை
  choice: ‘விளங்கட்டும்’ என்பதைச் சேர்த்து இணைநிலை வேண்டுதலாக மொழிபெயர்த்தல்
  alternative: ‘உமது மாட்சிமை அவர்களுடைய பிள்ளைகள்மேல் [காணப்படட்டும்]’
  rationale: எபிரெயக் கவிதையில் முதல் அடியின் வினை இரண்டாம் அடியிலும் தொடர்கிறது. தமிழில் முழுமையான, இயல்பான வாக்கியமாக அமைய ‘விளங்கட்டும்’ பயன்படுத்தப்படுகிறது; இது மாட்சிமை வெளிப்படுவதைத் தவிர கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; வேண்டுதல் நயமுள்ள கண்ணியமான கவிதைநடை. ‘உமது’ என்ற மரியாதை வடிவம் முழுவதும் ஒருமையாகப் பேணப்பட்டுள்ளது.
