  source_fidelity: எபிரெய மூலத்தின் வேண்டுதல் நயமும் இணைவரிசையும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. יֵרָאֶה என்பதன் ‘காணப்படுதல்/வெளிப்படுதல்’ பொருள் முதல் அடியில் ‘காணப்படட்டும்’ எனத் தரப்பட்டுள்ளது; இரண்டாம் அடியில் மூலத்தில் உட்கிடையாகத் தொடரும் வினையைத் தமிழ் கவிதைநடைக்கு ஏற்ப ‘விளங்கட்டும்’ என வெளிப்படுத்துவது பாதுகாப்பானது. פָעֳלֶךָ, עֲבָדֶיךָ, הֲדָרְךָ, עַל־בְּנֵיהֶם ஆகியவற்றின் உறவுகளும் பன்மைகளும் காக்கப்பட்டுள்ளன.
