source:
  edition: WLC
  text: מִֽי י֭וֹדֵעַ עֹ֣ז אַפֶּ֑/ךָ וּ֝/כְ/יִרְאָתְ/ךָ֗ עֶבְרָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/011.yaml
  text: Who knows the power of your anger[a], and your wrath according to the fear due to you?
translation:
  language: ta
  text: உமது கோபத்தின் வல்லமையையும், உமக்குச் செலுத்த வேண்டிய பயபக்திக்கு ஏற்ப உமது கடுஞ்சினத்தையும் அறிந்தவர் யார்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமக்குரிய பயத்திற்கு ஏற்ப உமது கடுஞ்சினம் இருக்கிறது”; அல்லது, “உமக்குரிய பயம் எப்படியோ, அப்படியே உமது கடுஞ்சினமும் இருக்கிறது.” எபிரெயத் தொடர் சுருக்கமாக இருப்பதால், அதை ஒன்றுக்கு மேற்பட்ட விதங்களில் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: யார்
  rationale: வினாவுணர்வுடன் கூடிய சொல்லாட்சியை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: יוֹדֵעַ
  choice: அறிந்தவன்
  rationale: ידע என்பதன் அடிப்படைப் பொருளான அறிதலைப் பாதுகாக்கிறது; ஒருமை வினாவுடன் தமிழில் இயல்பாக அமைகிறது.
- source_word: עֹז
  choice: வல்லமை
  rationale: கோபத்தின் செயலாற்றும் வலிமையை எடுத்துரைக்கிறது; சங்கீதத்தின் உயர்ந்த நடைக்கும் ஏற்றது.
- source_word: אַפֶּךָ
  choice: உமது கோபம்
  rationale: אַף இங்கு உடலுறுப்பைக் குறிக்காமல் கோபத்தைக் குறிக்கும் மரபுத்தொடராகப் பயன்படுகிறது.
- source_word: וּכְיִרְאָתְךָ
  choice: உமக்குச் செலுத்தவேண்டிய பயபக்திக்கு ஏற்ப
  rationale: כְּ என்பதன் ஒப்புமை அல்லது அளவுத்தொடர்பைத் தக்கவைத்து, יִרְאָה என்பதன் சூழல்சார் பொருளை நவீன தமிழில் தெளிவாகக் கூறுகிறது; எபிரெயச் சுருக்கத்தின் பிற வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: עֶבְרָתֶךָ
  choice: உமது கடுஞ்சினம்
  rationale: עֶבְרָה குறிக்கும் தீவிரமான சினத்தை வெளிப்படுத்தி, முன்னுள்ள אַף என்பதற்கான ‘கோபம்’ என்பதிலிருந்து சொல்வேறுபாட்டையும் காக்கிறது.
theological_decisions:
- issue: וּכְיִרְאָתְךָ עֶבְרָתֶךָ என்பதில் கடுஞ்சினத்துக்கும் பயபக்திக்கும் உள்ள தொடர்பு
  choice: உமக்குச் செலுத்தவேண்டிய பயபக்திக்கு ஏற்ப உமது கடுஞ்சினத்தை அறிந்தவன் யார்?
  alternative: உம்மீதுள்ள பயத்திற்கு ஏற்ப உமது கடுஞ்சினம் இருக்கிறது; அல்லது, உம்மீதுள்ள பயம் எப்படியோ, அப்படியே உமது கடுஞ்சினமும் இருக்கிறது.
  rationale: எபிரெயத் தொடர் சுருக்கமானதும் ஒன்றுக்கு மேற்பட்ட வகையில் வாசிக்கத்தக்கதுமாக உள்ளது. முதன்மை உரை இரு பெயர்ச்சொற்களையும் יוֹדֵעַ என்பதோடு இணைத்து, மனிதர் தேவகோபத்தின் வல்லமையையும் அதற்கேற்ற பயபக்தியையும் உண்மையில் அறிகிறார்களா என்ற சொல்லாட்சிக் கேள்வியாக வழங்குகிறது; மாற்று இலக்கணத் தொடர்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில் மரியாதை ஒருமையான ‘உமது/உமக்கு’ பயன்படுத்தப்பட்டுள்ளது. ‘வல்லமை’, ‘பயபக்தி’, ‘கடுஞ்சினம்’ ஆகியவை எளிதில் புரியும் உயர்ந்த சங்கீத நடையைத் தருகின்றன. எபிரெய இணைப்புச் சொல் தமிழில் இரண்டு இணையான வினாக்களாக இயல்பாக்கப்பட்டுள்ளது; அடிக்குறிப்பு குறியீடு முதன்மை உரையில் இடம்பெற்றுள்ளது.
