  text: כִּֽי כָלִ֥ינוּ בְ/אַפֶּ֑/ךָ וּֽ/בַ/חֲמָתְ/ךָ֥ נִבְהָֽלְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/007.yaml
  text: For we are consumed by your anger[b][a], and by your wrath we are terrified.
translation:
  language: ta
  text: ஏனெனில், உமது கோபத்தால் நாங்கள் அழிந்துபோகிறோம்[a]; உமது கடுஞ்சினத்தால் திகிலடைகிறோம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது கோபத்தால் நாங்கள் முடிவுக்கு வருகிறோம்.” எபிரெய வினைச்சொல் தீர்ந்துபோதல், அழிந்துபோதல் அல்லது முடிவுக்குக் கொண்டுவரப்படுதல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கலங்கிப்போகிறோம்” அல்லது “பதறிப்போகிறோம்.” எபிரெய வினைச்சொல் கலக்கம், பதற்றம் அல்லது திகில் ஆகியவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான காரணத்தை அறிமுகப்படுத்துகிறது; சங்கீதத்தின் விளக்க ஓட்டத்தை இயல்பாகத் தொடர்கிறது.
- source_word: כָלִינוּ
  choice: நாங்கள் அழிந்துபோகிறோம்
  rationale: כלה என்ற வினை முற்றுப்பெறுதல், தீர்ந்துபோதல், அழிந்துபோதல் ஆகிய பொருள்களைத் தருகிறது. இங்கு இறைக் கோபத்தின் விளைவாக அழிவுறுவதைத் தெளிவாகவும் இயல்பாகவும் கூறுகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: בְאַפֶּךָ
  choice: உமது கோபத்தால்
  rationale: ב என்ற முன்னொட்டு இங்கு கருவி அல்லது காரணப் பொருளில் உள்ளது; கோபமே அவர்கள் அழிவுறுவதற்கான காரணம் என்பதை வெளிப்படுத்துகிறது.
- source_word: חֲמָתְךָ
  choice: உமது கடுஞ்சினத்தால்
  rationale: חֵמָה எரியும் தீவிரமான சினத்தைக் குறிக்கிறது. 'கடுஞ்சினம்' என்பது אַף என்பதற்கான 'கோபம்' என்பதிலிருந்து வேறுபாட்டைக் காத்து, கவிதைச் செறிவையும் வெளிப்படுத்துகிறது.
- source_word: נִבְהָלְנוּ
  choice: திகிலடைகிறோம்
  rationale: בהל கலங்குதல், பதறுதல், திகிலுறுதல் ஆகியவற்றைக் குறிக்கிறது. இறைக் கடுஞ்சினத்தின் முன்னிலையில் ஏற்படும் தீவிர அச்சத்தை இச்சூழலில் இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: இறைவனுடைய கோபத்தைக் குறிக்கும் இணைச் சொற்களை மொழிபெயர்த்தல்
  choice: אַף என்பதை 'கோபம்' என்றும் חֵמָה என்பதை 'கடுஞ்சினம்' என்றும் வேறுபடுத்திக் காட்டுதல்
  alternative: இரண்டையும் 'கோபம்' என்ற ஒரே சொல்லால் மொழிபெயர்த்தல்; அல்லது இரண்டாவதை 'சீற்றம்' என மொழிபெயர்த்தல்
  rationale: எபிரெய மூலத்தில் தொடர்புடையதாயினும் வேறுபட்ட இரண்டு சொற்கள் உள்ளன. அவற்றின் வேறுபாட்டைக் காப்பது கவிதையின் தீவிரப்படுத்தும் இணை அமைப்பைத் தக்கவைக்கிறது; கூடுதல் கோட்பாட்டுப் பொருளைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு உரைக்கு ஏற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய மரியாதைப் பன்மை வடிவமான 'உமது' காக்கப்பட்டுள்ளது. இரு இணை அரையடிகளின் காரணவியல் அமைப்பும், 'கோபம்/கடுஞ்சினம்' என்ற கவிதைத் தீவிரமும் பாதுகாக்கப்பட்டுள்ளன.
