  text: לִ/מְנ֣וֹת יָ֭מֵי/נוּ כֵּ֣ן הוֹדַ֑ע וְ֝/נָבִ֗א לְבַ֣ב חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/012.yaml
  text: Teach us to number our days[a], that we may gain a heart of wisdom.
translation:
  language: ta
  text: எங்கள் நாட்களை எண்ண எங்களுக்குக் கற்பியும்[a]; அப்பொழுது நாங்கள் ஞானமுள்ள இதயத்தைப் பெறுவோம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, இன்னும் சொல்லுக்கு நெருக்கமாக: “எங்கள் நாட்களை இவ்வாறு எண்ண எங்களுக்கு அறிவியும்; நாங்கள் ஞானத்தின் இதயத்தைக் கொண்டுவருவோம்.” இறுதிக் கூற்றின் எபிரெய வாசகம் கடினமானது; பலர் அதை, “நாங்கள் ஞானமுள்ள இதயத்தைப் பெறும்படி” என்று புரிந்துகொள்கிறார்கள்.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְנוֹת
  choice: எண்ணுவதற்கு
  rationale: מנה என்ற வினை நாட்களை ‘எண்ணுதல்/கணக்கிடுதல்’ என்னும் நேரடியான உருவகத்தைத் தருகிறது; ‘எண்ணுவதற்கு’ என்பது இயல்பான தமிழில் அதைப் பாதுகாக்கிறது.
- source_word: יָמֵינוּ
  choice: எங்கள் நாட்களை
  rationale: முதல் நபர் பன்மை உரிமை விகுதியுடன் உள்ள சொற்றொடரை நேரடியாகக் காட்டுகிறது; சூழலில் இது மனித வாழ்நாளின் வரையறுக்கப்பட்ட நாட்களைக் குறிக்கிறது.
- source_word: כֵּן
  choice: அப்பொழுது
  rationale: כֵּן என்பதன் அடிப்படைப் பொருள் ‘இவ்வாறு/அவ்வாறு’. எபிரெய வாக்கியத்தின் சுருக்கமான தொடர்பை இயல்பான தமிழில் விளைவு நோக்கி இணைக்க ‘அப்பொழுது’ பயன்படுத்தப்படுகிறது; அதன் மாற்று நேரடி வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: הוֹדַע
  choice: எங்களுக்குக் கற்பியும்
  rationale: ידע என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘அறியச் செய்’ என்று பொருள்படும். இறைவனை நோக்கிய வேண்டுதலில் ‘கற்பியும்’ என்பது causative பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְנָבִא
  choice: நாங்கள் ... பெறுவோம்
  rationale: בוא வடிவத்தின் அடிப்படைப் பொருள் ‘கொண்டுவருதல்’ என்றாலும், இக்கடைசிக் கூற்று கடினமானது. சூழலில் ஞானமுள்ள இதயத்தை அடைதல் எனப் புரிந்துகொள்வது இயல்பானது; நேரடி மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְבַב חָכְמָה
  choice: ஞானமுள்ள இதயத்தை
  rationale: சொல்லுக்கு சொல் ‘ஞானத்தின் இதயம்’ என்றாலும், பண்பு உறவை இயல்பான நவீன தமிழில் ‘ஞானமுள்ள இதயம்’ என வழங்குவது உள்ளார்ந்த ஞானநிலையைத் தெளிவாகத் தருகிறது.
theological_decisions:
- issue: இரண்டாம் அடியின் நோக்கம் அல்லது விளைவைக் குறிக்கும் வாசிப்பு
  choice: வாழ்வின் நாட்களை எண்ண இறைவன் கற்பிப்பதால் மக்கள் ஞானமுள்ள இதயத்தைப் பெறுவார்கள் என்ற விளைவு வாசிப்பு.
  alternative: ‘எங்கள் நாட்களை இவ்வாறு எண்ணுவதற்கு எங்களுக்கு அறிவியும்; அப்போது நாங்கள் ஞானத்தின் இதயத்தைக் கொண்டுவருவோம்’ என்ற அதிக நேரடியான வாசிப்பு.
  rationale: இறுதிக் கூற்றின் எபிரெய இலக்கண அமைப்பு சுருக்கமாகவும் கடினமாகவும் உள்ளது. சங்கீதத்தின் மரணநிலைச் சூழலில் ஞானத்தை அடைவது என்ற வாசிப்பு பொருத்தமானது; எனினும் வேறு சாத்தியத்தை மறைக்காமல் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், இறைவேண்டுதலுக்குரிய கண்ணியமான நடையைப் பயன்படுத்துகிறது. ‘கற்பியும்’ என்ற மரியாதைமிக்க வேண்டுகோள் வடிவமும் ‘ஞானமுள்ள இதயம்’ என்ற பொதுவாகப் புரியும் சொற்றொடரும் தேர்ந்தெடுக்கப்பட்டுள்ளன; மூலத்தின் கடினமான இறுதிக் கூற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
