source:
  edition: WLC
  text: אֲרוֹמִמְ/ךָ֣ יְ֭הוָה כִּ֣י דִלִּיתָ֑/נִי וְ/לֹא שִׂמַּ֖חְתָּ אֹיְבַ֣/י לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/001.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
translation:
  language: ta
  text: யாவே, உம்மை உயர்த்திப் போற்றுவேன்; ஏனெனில், நீர் என்னை மேலே இழுத்தெடுத்தீர்[a]; என் பகைவர்கள் என்னைக் குறித்து மகிழ விடவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் என்னை மேலே தூக்கினீர்”; எபிரெய வினைச்சொல் கிணற்றிலிருந்து தண்ணீரை இழுத்தெடுப்பதுபோன்ற காட்சியை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  choice: உம்மை உயர்த்திப் போற்றுவேன்
  rationale: רוּם என்பதன் உயர்த்துதல் என்ற உருவகத்தையும், தேவனைப் புகழ்தல் என்ற சூழல்சார் பொருளையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துக் கொடுக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சங்கீதக்காரர் ஏன் புகழ்கிறார் என்பதற்கான காரணத்தைத் தெளிவாக அறிமுகப்படுத்துகிறது.
- source_word: דִלִּיתָנִי
  choice: என்னைக் ... மேலே தூக்கினீர்
  rationale: דלה என்பது கிணறு அல்லது குழியிலிருந்து ஒன்றை இழுத்து மேலே எடுக்கும் தெளிவான உருவகத்தைக் கொண்டது; முதன்மை உரையில் இயல்பான தமிழ் தரப்பட்டு, அதன் குறிப்பான உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְלֹא שִׂמַּחְתָּ
  choice: மகிழ விடவில்லை
  rationale: எதிரிகள் சங்கீதக்காரரின் வீழ்ச்சியைக் கண்டு மகிழ்வதற்கு தேவன் இடமளிக்கவில்லை என்ற எபிரெயக் காரணவினைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֹיְבַי
  choice: என் பகைவர்கள்
  rationale: பன்மை உடைமை வடிவின் நேரடியான, இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: לִי
  choice: என்னைக் குறித்து
  rationale: இங்கு לִי என்பது சங்கீதக்காரரின் துன்பம் அல்லது தோல்வியை முன்னிட்டு எதிரிகள் மகிழ்வதைக் குறிக்கிறது; எபிரெயின் தொடர்புப் பொருளை அதிகமாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் பட்டமல்ல, தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல், பரவலாக ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- issue: எதிரிகள் மகிழ்வதன் தன்மை
  choice: என்னைக் குறித்து மகிழ
  alternative: என்மேல் வெற்றிக்களிப்படைய
  rationale: לִי என்பதற்கு சூழலில் வெற்றிக்களிப்பு என்ற நுணுக்கம் இருக்கலாம்; ஆனால் ‘என்னைக் குறித்து’ என்பது மூலத்தின் சுருக்கத்தையும் ஓரளவு தெளிவின்மையையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், தேவனை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. கவிதைநயத்தையும் பொதுவாசகருக்கான தெளிவையும் சமநிலைப்படுத்தும் வகையில் ‘உயர்த்திப் போற்றுவேன்’ என வழங்கப்பட்டுள்ளது; மீட்பின் செங்குத்தான உருவகம் அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
