  text: הָפַ֣כְתָּ מִסְפְּדִ/י֮ לְ/מָח֪וֹל לִ֥/י פִּתַּ֥חְתָּ שַׂקִּ֑/י וַֽ/תְּאַזְּרֵ֥/נִי שִׂמְחָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/011.yaml
  text: You turned my mourning into dancing for me; you untied my sackcloth and clothed me with joy.
translation:
  language: ta
  text: என் புலம்பலை எனக்காக நடனமாக மாற்றினீர்; என் சாக்குத்துணியை அவிழ்த்து, மகிழ்ச்சியை எனக்கு இடைக்கச்சையாகக் கட்டினீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפְּדִי
  choice: என் புலம்பலை
  rationale: இச்சொல் மரணம் அல்லது துயரத்தை வெளிப்படுத்தும் புலம்புதலைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் மூலத்தின் தீவிரத்துடனும் உள்ளது.
- source_word: לְמָחוֹל לִי
  choice: எனக்காகக் களிப்புக் கூத்தாக
  rationale: מָחוֹל என்பது மகிழ்ச்சியை வெளிப்படுத்தும் வட்டநடனம் அல்லது கூத்தைக் குறிக்கிறது; לִי என்ற ‘எனக்காக/எனக்கு’ பொருளையும் வெளிப்படையாகப் பாதுகாக்கிறது.
- source_word: שַׂקִּי
  choice: என் துக்கவுடையை
  rationale: சாக்குத்துணி துக்கத்தின் அடையாளமாக அணியப்பட்டதை வாசகருக்குத் தெளிவாக்கும் இயல்பான தமிழ்; பொருளின் பண்பாட்டு செயல்பாட்டைப் பாதுகாக்கிறது.
- source_word: פִּתַּחְתָּ
  choice: அவிழ்த்து
  rationale: கட்டப்பட்ட அல்லது அணியப்பட்ட துக்கவுடையைத் திறத்தல்/அவிழ்த்தல் என்ற மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  choice: மகிழ்ச்சியை எனக்கு இடைக்கச்சாகக் கட்டினீர்
  rationale: אזר என்ற வினை இடையைச் சுற்றிக் கட்டுதல் அல்லது கச்சணிவித்தல் எனும் உடை உருவகத்தைக் கொண்டது; பொதுவான ‘அணிவித்தீர்’ என்பதைவிட மூல உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: துக்கவுடையை அகற்றி மகிழ்ச்சியைக் கட்டும் உருவகம்
  choice: இரண்டு உடை சார்ந்த உருவகங்களையும் வெளிப்படையாகப் பாதுகாத்தல்
  alternative: ‘துக்கத்தை நீக்கி மகிழ்ச்சியால் நிரப்பினீர்’ என்று கருத்தாக்கமாக மொழிபெயர்த்தல்
  rationale: மூல எபிரெயத்தில் துக்கவுடையை அவிழ்த்தலும் மகிழ்ச்சியை இடையைச் சுற்றிக் கட்டுதலும் இணையான படிமங்களாக உள்ளன; அவற்றை கருத்தாக்கமாக மாற்றுவது கவிதைத் தீவிரத்தைக் குறைக்கும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதத்தில் தேவனை நேரடியாக மரியாதையுடன் அழைக்கும் ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. கவிதை உருவகங்கள் இயன்றவரை காக்கப்பட்டாலும், ‘சாக்குத்துணி’ என்பதற்குப் பதில் அதன் துக்கச் செயல்பாட்டை உடனடியாக உணர்த்தும் ‘துக்கவுடை’ தேர்ந்தெடுக்கப்பட்டது.
