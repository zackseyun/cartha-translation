lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையோடு தொடர்புடைய புனிதப் பாடலைக் குறிக்கும் வழக்கமான, இயல்பான தமிழ் சொல்.
- source_word: שִׁיר
  choice: பாடல்
  rationale: எபிரெய மூலத்தில் உள்ள இணை வகைப்பெயரைத் தனியாகப் பாதுகாக்கிறது.
- source_word: חֲנֻכַּת
  choice: அர்ப்பணிப்புக்கான
  rationale: அர்ப்பணிப்பு அல்லது திறப்புவிழா நிகழ்வுக்காக அமைந்த பாடல் என்ற தலைப்பின் நோக்கத்தை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הַבַּיִת
  choice: வீட்டின்
  rationale: மூலத்தின் பொதுவான சொல்லை அப்படியே வைத்துத் திருக்கோவில் அல்லது அரண்மனை என்று குறிப்பாக்காமல் அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்குரிய
  rationale: ஆசிரியத்துவம், தொடர்பு, உரிமை அல்லது அர்ப்பணம் ஆகிய சாத்தியங்களை ‘தாவீது எழுதியது’ என்று ஒரே பொருளில் சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: ‘வீடு’ என்பதன் குறிப்பு
  choice: வீடு
  alternative: திருக்கோவில் அல்லது தாவீதின் அரண்மனை
  rationale: בַּיִת என்ற எபிரெயச் சொல் பரந்த பொருளுடையது; இத்தலைப்பு எந்தக் கட்டடம் என்பதைத் தெளிவுபடுத்தாததால் விளக்கத் தீர்ப்பை மொழிபெயர்ப்புக்குள் புகுத்தவில்லை.
- issue: לְדָוִד என்பதன் தொடர்பு
  choice: தாவீதுக்குரிய
  alternative: தாவீது எழுதியது / தாவீதுக்காக
  rationale: எபிரெய முன்னொட்டு ஆசிரியத்துவம் மட்டுமல்லாமல் தொடர்பு, உரிமை அல்லது அர்ப்பணத்தையும் குறிக்கக்கூடும்; தேர்ந்த வடிவம் அந்தத் திறந்த பொருளைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான சங்கீதத் தலைப்பு. எபிரெயத் தலைப்பின் கூறுகள் இயல்பாக வாசிக்கும்படி அமைக்கப்பட்டுள்ளன; அதேவேளை ‘வீடு’ மற்றும் ‘தாவீதுக்குரிய’ என்பவற்றின் மூலமொழித் தெளிவின்மை பாதுகாக்கப்பட்டுள்ளது.
