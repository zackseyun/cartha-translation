base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
translation:
  language: ta
  text: ஏனெனில், அவருடைய கோபம் ஒரு கணமே; அவருடைய தயவில் வாழ்வு உள்ளது. மாலையில் அழுகை தங்கும்[a]; காலையிலோ களிப்பின் ஆரவாரம் எழும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மாலையில் அழுகை இரவுக்குத் தங்கும்.” எபிரெய வினை இரவைக் கழிக்கத் தங்குவதை, விருந்தினர் அல்லது தங்குபவரைப் போல, குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “களிப்பின் ஆரவாரம்” என்பதற்கு “மகிழ்ச்சிக் கூச்சல்” அல்லது “களிப்புப் பாடல்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய சூழலுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பாக இயல்பாக அமைகிறது.
- source_word: רֶגַע בְּאַפּוֹ
  choice: அவருடைய கோபம் ஒரு கணமே
  rationale: אַף என்பதன் உருவகப் பொருளான ‘கோபம்’ என்பதையும், רֶגַע குறிக்கும் மிகக் குறுகிய காலத்தையும் சுருக்கமான தமிழில் காக்கிறது.
- source_word: חַיִּים בִּרְצוֹנוֹ
  choice: அவருடைய தயவில் வாழ்வு உள்ளது
  rationale: חַיִּים இங்கு ‘வாழ்வு’ என்ற கருத்துப்பெயராகவும், רָצוֹן இறைத் தயவு அல்லது சாதக மனநிலையாகவும் வருகிறது; எபிரெய இணைநிலையை முடிந்தவரை காக்கிறது.
- source_word: בָּעֶרֶב יָלִין בֶּכִי
  choice: மாலையில் அழுகை இரவுத் தங்கலாம்
  rationale: לין என்ற வினையின் ‘இரவு தங்குதல்’ என்ற விருந்தினர் சார்ந்த உருவகத்தையும், அழுகையின் தற்காலிகத்தன்மையையும் காக்கிறது.
- source_word: וְלַבֹּקֶר רִנָּה
  choice: காலையிலோ மகிழ்ச்சி ஆரவாரம் எழும்
  rationale: மாலைக்கும் காலைக்கும் இடையிலான முரண்பாட்டை ‘-லோ’ காட்டுகிறது; רִנָּה-வின் கேட்கக்கூடிய மகிழ்ச்சிக் கூச்சல் அல்லது பாடல் நுணுக்கத்தை ‘மகிழ்ச்சி ஆரவாரம்’ வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘அவருடைய கோபம்’, ‘அவருடைய தயவு’ என்பவற்றிலுள்ள சுட்டுப்பெயரின் குறிப்பு
  choice: சங்கீதத்தின் சூழலின்படி அவை கர்த்தராகிய தேவனைக் குறிக்கின்றன; வசனத்தில் பெயரை விரிவாகச் சேர்க்காமல் ‘அவருடைய’ எனவே வைக்கப்பட்டது.
  alternative: ‘தேவனுடைய கோபம்’, ‘தேவனுடைய தயவு’ என்று வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: மூலத்தின் சுட்டுப்பெயர் வடிவத்தைக் காக்கும்போதே சூழலிலுள்ள இறைக் குறிப்பும் தெளிவாக இருக்கிறது; அவருடைய கோபத்தின் உண்மையையும் அதன் குறுகிய காலத்தையும், தயவில் உள்ள வாழ்வையும் உரை கூறும் பதற்றத்தோடு அப்படியே வைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘ஒரு கணமே’, ‘மாலையில்/காலையிலோ’ ஆகியவை மூலத்தின் சுருக்கத்தையும் எதிரிணையையும் காக்கின்றன; ‘இரவுத் தங்கலாம்’ என்ற ஆளுருவாக்கம் எபிரெயச் சொல்லோவியத்தைத் தக்கவைக்கிறது.
