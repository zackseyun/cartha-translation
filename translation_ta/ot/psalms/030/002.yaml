source:
  edition: WLC
  text: יְהוָ֥ה אֱלֹהָ֑/י שִׁוַּ֥עְתִּי אֵ֝לֶ֗י/ךָ וַ/תִּרְפָּאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/002.yaml
  text: O Yahweh my God[a], I cried out to you[c][b], and you healed me.
translation:
  language: ta
  text: யாவே, என் கடவுளே[a], உம்மை நோக்கிக் கூக்குரலிட்டேன்[b]; நீர் என்னைக் குணமாக்கினீர்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் “YHWH”; மரபாக “கர்த்தர்” அல்லது “ஆண்டவர்” என்று வழங்கப்படுகிறது. “யெகோவா” என்பது மற்றொரு ஒலிபெயர்ப்பு.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “உம்மிடம் உதவிக்காகக் கூக்குரலிட்டேன்.” இந்த வினைச்சொல் உதவி வேண்டிய அவசரக் கூக்குரலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: c
    text: “குணமாக்கினீர்” என்பது உடல் குணமடைதலையோ, சூழலின்படி விரிவான மீட்பு அல்லது மீள்நிலைப்படுத்துதலையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் தேவனுடைய தனிப்பெயரான YHWH-ஐ மறைக்காமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהָי
  choice: என் கடவுளே
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியையும் நேரடி அழைப்பின் உணர்வையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׁוַּעְתִּי
  choice: உதவிக்காகக் கூக்குரலிட்டேன்
  rationale: שׁוע என்பது சாதாரணமாக அழைப்பதைவிட, உதவி வேண்டி எழுப்பும் அவசரமான கூக்குரலைக் குறிக்கிறது.
- source_word: אֵלֶיךָ
  choice: உம்மை நோக்கி
  rationale: אֶל என்ற திசைச்சொல்லின் பொருளை மரியாதையான, இயல்பான தமிழில் தருகிறது.
- source_word: וַתִּרְפָּאֵנִי
  choice: நீர் என்னைக் குணமாக்கினீர்
  rationale: רפא என்பதன் நேரடியான பொருளைத் தருவதுடன், உடல் நலமடைதலா அல்லது விரிவான மீட்பா என்பதை முதன்மை உரையில் குறுக்காமல் விடுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையிலுள்ள தனிப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல் பாதுகாக்கிறது; அதேவேளை மரபுவழி மாற்றுகளை அடிக்குறிப்பில் தெரிவிக்கிறது.
- issue: רפא குறிக்கும் குணமாக்குதலின் பரப்பு
  choice: குணமாக்கினீர்
  alternative: நலம்பெறச் செய்தீர்; மீட்டீர்
  rationale: இது உடல் குணமடைதலையோ, சூழலில் விரிவான மீட்பு அல்லது மீள்நிலைப்படுத்துதலையோ குறிக்கக்கூடும். ‘குணமாக்கினீர்’ மூலச்சொல்லுக்கு நெருக்கமாக இருந்து அந்தத் திறந்த பொருளைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான “உம்மை,” “நீர்,” “குணமாக்கினீர்” ஆகிய வடிவங்கள் கையாளப்பட்டுள்ளன; கவிதையின் அவசரமும் நன்றியுணர்வும் சுருக்கமாகப் பாதுகாக்கப்பட்டுள்ளன.
