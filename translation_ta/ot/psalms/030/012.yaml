  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
translation:
  language: ta
  text: என் மகிமை[a] உம்மைப் புகழ்ந்து பாடி மௌனமாயிராதபடி. யாவே, என் கடவுளே, என்றென்றும் உமக்கு நன்றி செலுத்துவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் முழு உள்ளமும் உம்மைப் புகழ்ந்து பாடி மௌனமாயிராதபடி.” எபிரெயத்தில், “என் மகிமை.” இது சங்கீதக்காரரின் உள்ளான தன்மையையோ நாவையோ குறிக்கும் கவிதைச் சொல்லாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: —படி
  rationale: நோக்கம் அல்லது விளைவைக் குறிக்கும் எபிரெய இணைப்பை, முந்தைய வசனத்துடன் இயல்பாகத் தொடர்புபடுத்தும் தமிழ்ச் சொல்லமைப்பு.
- source_word: יְזַמֶּרְךָ
  choice: உம்மைப் புகழ்ந்து பாடி
  rationale: זמר என்பதன் இசை சார்ந்த பொருளையும் புகழ்ச்சியின் நோக்கத்தையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: כָבוֹד
  choice: என் மகிமை
  rationale: ‘மகிமை/மாண்பு’ என்ற எபிரெய உருவகத்தை விளக்கமாக மாற்றாமல் முதன்மை உரையில் தக்கவைக்கிறது; முதல் நபர் உடைமைப் பொருள் சூழலால் உணரப்படுகிறது.
- source_word: וְלֹא יִדֹּם
  choice: மௌனமாயிராத
  rationale: பாடுவதற்கு எதிர்நிலையாக இங்கு דמם என்பது ‘மௌனமாயிருத்தல்’ என்று இயல்பாகப் பொருள்படுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பட்டத்தால் மாற்றாமல், எபிரெய இறைப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אֱלֹהַי
  choice: என் கடவுளே
  rationale: முதல் நபர் உடைமையையும் நேரடி விளிப்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: தொடர்ந்து நிலைக்கும் காலத்தைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ்ச் சொல்.
- source_word: אוֹדֶךָּ
  choice: உமக்கு நன்றி செலுத்துவேன்
  rationale: ידה என்பதன் நன்றியறிதல் மற்றும் புகழறிக்கை சார்ந்த பொருள்களில், இச்சங்கீதத்தின் நன்றிப் பின்னணிக்கு மிகவும் பொருத்தமான தெரிவு.
theological_decisions:
- issue: புகழ்ந்து பாடும் எழுவாயாக כָבוֹד என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘என் மகிமை’ என்ற நேரடி உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘என் முழு உள்ளமும்’ அல்லது ‘என் நாவும்’
  rationale: எபிரெயக் கவிதைச் சொல்லின் குறிப்பு விவாதத்திற்குரியது. எனவே அதன் தெளிவின்மையை முதன்மை உரையில் பாதுகாத்து, விளக்கமான வாசிப்பை அடிக்குறிப்பில் தருகிறது.
- issue: יְהוָה என்ற இறைப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: யெகோவா அல்லது ஆண்டவர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரை ஒரு பட்டத்தால் மறைக்காமல் ஒலிபெயர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான பக்தி நடையைப் பயன்படுத்துகிறது. இறைவனை நேரடியாக விளிக்கும்போது மரியாதைப் பன்மையான ‘உம்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயக் கவிதையின் நோக்கத் தொடரையும் ‘என் மகிமை’ என்ற திட்டமிட்ட உருவகத் தெளிவின்மையையும் பாதுகாக்கிறது.
