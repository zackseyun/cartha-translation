id: PSA.30.10
reference: Psalms 30:10
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: שְׁמַע יְהוָ֥ה וְ/חָנֵּ֑/נִי יְ֝הוָה הֱֽיֵה עֹזֵ֥ר לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/010.yaml
  text: Hear[a], O Yahweh, and be gracious to me; O Yahweh, be my helper.
translation:
  language: ta
  text: யாவே, கேளும்; எனக்கு அருள்கூரும்[a]; யாவே, எனக்குத் துணைபுரிபவராக இரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்மேல் இரக்கம் காட்டும்.” தெய்வீக உதவிக்கான வேண்டுதலில் இந்த எபிரெய வினை அருளான தயவையோ இரக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: கேளும்
  rationale: שׁמע என்பதன் இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை வடிவம். எபிரெயத்தில் கேட்கப்படுவது வெளிப்படையாகக் குறிப்பிடப்படாததால், தமிழிலும் பொருளைச் சேர்க்காமல் நேரடியான வேண்டுதலாக மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: וְחָנֵּנִי
  choice: எனக்கு அருள்கூரும்
  rationale: חנן வினையின் கட்டளை வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும் இணைந்த சொல். அருளான தயவு காட்டுதல் என்ற மையப் பொருளை இது இயல்பான, கண்ணியமான தமிழில் தருகிறது; சூழலில் இரக்கம் காட்டுதல் என்பதும் சாத்தியம்.
- source_word: הֱיֵה
  choice: இரும்
  rationale: היה என்பதன் கட்டளை வடிவம் இங்கு ‘ஆகிவிடும்’ என்பதைக் காட்டிலும், வேண்டுதலில் ‘இரும்’ என்ற நிலை/பங்கு சார்ந்த பொருளில் வருகிறது.
- source_word: עֹזֵר לִי
  choice: எனக்குத் துணைபுரிபவராக
  rationale: עזר என்பதன் வினையெச்சப் பெயர்ச்சொல் வடிவத்தையும் ‘எனக்கு’ என்ற உறவையும் காக்கிறது. தொடர்ந்து உதவி செய்கிற தனிப்பட்ட துணையாளர் என்ற நுண்ணுணர்வை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் இறைவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல், ‘Yahweh’ என்பதற்குரிய தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குவது மூலத்தின் தனிப்பெயர் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நேரடி நடையைப் பயன்படுத்துகிறது. ‘கேளும்’, ‘அருள்கூரும்’, ‘இரும்’ ஆகிய மரியாதைமிக்க வேண்டுதல் வடிவங்கள் இயல்பான இலக்கியத் தன்மையைத் தக்கவைக்கின்றன; தேவையற்ற விளக்கச் சொற்கள் சேர்க்கப்படவில்லை.
