  text: יְֽהוָ֗ה הֶֽעֱלִ֣יתָ מִן שְׁא֣וֹל נַפְשִׁ֑/י חִ֝יִּיתַ֗/נִי מ/יורדי בֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh[a], you brought up my soul from Sheol[c][b]; you kept me alive from among those going down to the pit.
translation:
  language: ta
  text: 'யாவே, என் உயிரை[b] ஷியோலிலிருந்து[a] மேலே கொண்டுவந்தீர்;

    குழியில் இறங்குகிறவர்களிடமிருந்து என்னை உயிரோடு காத்தீர்.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ஷியோல்’ என்பது மரித்தோரின் உலகைக் குறிக்கும் எபிரெயச் சொல்; ‘கல்லறை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் ஆத்துமாவை.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘குழியில் இறங்குகிறவர்களிடமிருந்து என்னை மீண்டும் உயிர்ப்பித்தீர்’; வேறொரு இலக்கணப் புரிதலின்படி, ‘நான் குழியில் இறங்காதபடி என்னை உயிரோடு காத்தீர்.’
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: הֶעֱלִיתָ
  choice: மேலே கொண்டுவந்தீர்
  rationale: மரித்தோரின் உலகிலிருந்து மேலே வரச்செய்யும் செங்குத்தான கவித்துவப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: מִן שְׁאוֹל
  choice: ஷியோலிலிருந்து
  rationale: எபிரெயச் சொல்லை ‘கல்லறை’ என்று மட்டும் குறுக்காமல், மரித்தோரின் உலகைக் குறிக்கும் அதன் பரந்த கவித்துவப் பொருளைப் பாதுகாக்கிறது; விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: נַפְשִׁי
  choice: என் உயிரை
  rationale: இந்தச் சூழலில் נֶפֶשׁ என்பது உயிரையோ ஒருவரின் முழு ஆளுமையையோ குறிக்கலாம். ‘என் உயிரை’ என்பது இயல்பான தமிழில் மரணத்திலிருந்து மீட்கப்பட்டதைக் கூறுகிறது; ‘என் ஆத்துமாவை’ என்ற வடிவம் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: חִיִּיתַנִי
  choice: என்னை உயிரோடு காத்தீர்
  rationale: உயிரைப் பாதுகாத்தல் அல்லது மீட்டளித்தல் ஆகிய இரு நுண்ணர்த்தங்களுக்கும் இடமளித்து, வெளிப்படையாக உயிர்த்தெழுதல் என்ற கருத்தைத் திணிக்காது.
- source_word: מִיּוֹרְדֵי בוֹר
  choice: குழியில் இறங்குகிறவர்களிடமிருந்து
  rationale: மரணக் குழிக்குள் இறங்குவோரின் கூட்டத்திலிருந்து பிரித்துக் காத்தார் என்ற எபிரெய இலக்கணப் புரிதலையும் கவித்துவப் படிமத்தையும் பாதுகாக்கிறது.
- source_word: בּוֹר
  choice: குழி
  rationale: மரணம் அல்லது கல்லறையுடன் தொடர்புடைய அசல் உருவகத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: இந்த வசனம் முழுமையாக வளர்ந்த மறுமை அல்லது உயிர்த்தெழுதல் கோட்பாட்டைக் குறிப்பதாக மொழிபெயர்க்க வேண்டுமா?
  choice: ஷியோல் மற்றும் குழி என்னும் எபிரெயக் கவித்துவப் படிமங்களைப் பாதுகாத்து, மரணத்திலிருந்தோ மரண நெருக்கத்திலிருந்தோ கிடைத்த விடுதலை என்ற பதற்றத்தைத் திறந்தவண்ணம் வைப்பது.
  alternative: ‘கல்லறையிலிருந்து உயிர்த்தெழச் செய்தீர்’ அல்லது ‘நரகத்திலிருந்து மீட்டீர்’ என்று வெளிப்படையாகக் குறிப்பிடுவது.
  rationale: மூலவசனம் மரணம் மற்றும் மரண நெருக்கடியிலிருந்து மீட்கப்பட்டதைப் பாரம்பரிய எபிரெயப் படிமங்களால் கூறுகிறது; அதைவிடத் துல்லியமான பிற்காலக் கோட்பாட்டை மொழிபெயர்ப்பில் சேர்க்கக் கூடாது.
- issue: חִיִּיתַנִי מִיּוֹרְדֵי בוֹר என்ற தொடரின் இலக்கணத் தொடர்பு
  choice: ‘குழியில் இறங்குகிறவர்களிடமிருந்து என்னை உயிரோடு காத்தீர்’ என்று, இறங்குவோரின் கூட்டத்திலிருந்து பிரித்துக் காத்ததாக மொழிபெயர்ப்பது.
  alternative: ‘நான் குழியில் இறங்காதபடி என்னை உயிரோடு காத்தீர்’ அல்லது ‘குழியில் இறங்குகிறவர்களிடமிருந்து என்னை மீண்டும் உயிர்ப்பித்தீர்.’
  rationale: מן முன்னிடைச்சொல் பிரித்தலைக் குறிக்கும் வாசிப்பு நேரடியானது; இருப்பினும் நோக்கம்/தடுப்பு அல்லது உயிர்ப்பித்தல் என்ற சாத்தியமான புரிதல்களும் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்குரிய கண்ணியமான கவித்துவ நடையைப் பேணுகிறது. மரியாதைப் பன்மை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. ‘ஷியோல்’ ஒலிபெயர்ப்பாக வைக்கப்பட்டு உடனடியான விளக்கம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
