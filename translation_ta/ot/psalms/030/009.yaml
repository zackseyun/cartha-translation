source:
  edition: WLC
  text: מַה בֶּ֥צַע בְּ/דָמִ/י֮ בְּ/רִדְתִּ֪/י אֶ֫ל שָׁ֥חַת הֲ/יוֹדְ/ךָ֥ עָפָ֑ר הֲ/יַגִּ֥יד אֲמִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/009.yaml
  text: What profit is there in my blood[c][b][a], in my going down to the pit? Will the dust praise you? Will it declare your faithfulness?
translation:
  language: ta
  text: என் இரத்தத்தால் என்ன பயன்[a]—நான் படுகுழிக்குள் இறங்குவதால் என்ன பயன்[b]? புழுதி உம்மைத் துதிக்குமா? அது உமது உண்மைத்தன்மையை அறிவிக்குமா[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மரணத்தால் என்ன பயன்?” எபிரெய மொழியில் சொல்லுக்குச் சொல், “என் இரத்தத்தால் என்ன பயன்?”
    reason: lexical_alternative
  - marker: b
    text: “படுகுழி” என்பதற்குப் பதிலாக “கல்லறை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “உமது உண்மையை.” எபிரெயச் சொல் ‘உண்மை’ அல்லது ‘உண்மைத்தன்மை’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה בֶּצַע
  choice: என்ன பயன்
  rationale: ஆதாயம் அல்லது நன்மை என்ன கிடைக்கும் என்று கேட்கும் எபிரெயச் சொல்லாட்சியின் சுருக்கத்தையும் வினாவலிமையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: בְּדָמִי
  choice: என் இரத்தத்தால்
  rationale: மரணம் அல்லது இரத்தம் சிந்தப்படுதல் என்பதைக் குறிப்பிட்டாலும், மூலத்தின் கண்முன் நிற்கும் ‘இரத்தம்’ என்ற உருவகத்தை விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: בְּרִדְתִּי אֶל שָׁחַת
  choice: நான் படுகுழிக்குள் இறங்குவதால்
  rationale: மரணத்தை நோக்கிய இறக்கத்தைச் சுட்டும் இயக்கத்தையும், அதனுடன் இணைந்த படுகுழி உருவகத்தையும் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: שָׁחַת
  choice: படுகுழி
  rationale: இங்கு ஒழுக்கக்கேட்டைக் குறிக்காமல், மரணம் அல்லது கல்லறை உலகைச் சுட்டும் குழி உருவகமாக உள்ளது; ‘படுகுழி’ இறங்குதல் என்ற படிமத்துடன் நன்றாக இணைகிறது.
- source_word: הֲיוֹדְךָ עָפָר
  choice: புழுதி உம்மைத் துதிக்குமா
  rationale: ידה என்பதன் தேவனை நோக்கிய சங்கீதப் பயன்பாட்டை ‘துதித்தல்’ இயல்பாக வெளிப்படுத்துகிறது; ‘புழுதி’ மரித்த மனித உடலைக் குறிக்கும் மூல உருவகத்தைப் பாதுகாக்கிறது.
- source_word: הֲיַגִּיד
  choice: அறிவிக்குமா
  rationale: வெளிப்படையாக எடுத்துரைத்தல் அல்லது பிரகடனம் செய்தல் என்ற பொருளை, உயர்வான ஆனால் எளிதில் புரியும் தமிழில் தருகிறது.
- source_word: אֲמִתֶּךָ
  choice: உமது உண்மைத்தன்மையை
  rationale: אמת என்பதில் உள்ள உண்மை, நம்பகத்தன்மை, மாறாத விசுவாசம் ஆகிய பொருள் பரப்பில், இச்சூழலில் தேவனுடைய நம்பத்தகுந்த தன்மையை முன்னிறுத்துகிறது; ‘உண்மை’ என்ற மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: மரணப் படிமங்களை வெளிப்படையான விளக்கமாக மாற்றுவதா அல்லது கவிதை உருவகங்களாகவே காப்பதா
  choice: ‘இரத்தம்,’ ‘படுகுழி,’ ‘புழுதி’ என்ற மூலத்தின் கண்கூடான படிமங்களை முதன்மை உரையில் காத்தல்
  alternative: ‘மரணம்,’ ‘கல்லறை,’ ‘இறந்தவர்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: சங்கீதக்காரரின் மரணம் தேவனைத் துதித்து அவரது உண்மைத்தன்மையை அறிவிப்பதை முடிவுக்குக் கொண்டுவரும் என்ற வாதத்தை எபிரெய உரை உயிருள்ள மரணப் படிமங்களால் முன்வைக்கிறது. அவற்றைக் காப்பது கவிதைத் தீவிரத்தையும் இறையியல் பதற்றத்தையும் விளக்கத்தால் தணிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியத்துடன் எளிதில் புரியும் கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கும் ஒருமை மரியாதை வடிவங்களான ‘உம்மை,’ ‘உமது’ பயன்படுத்தப்பட்டுள்ளன. இரு இணை வினாக்களுக்கிடையிலான நெருக்கத்தை நீண்ட கோடு காட்டுகிறது; மூலத்தின் மரண உருவகங்கள் விளக்கமாகச் சமப்படுத்தப்படவில்லை.
