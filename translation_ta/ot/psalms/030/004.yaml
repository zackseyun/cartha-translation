source:
  edition: WLC
  text: זַמְּר֣וּ לַ/יהוָ֣ה חֲסִידָ֑י/ו וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/004.yaml
  text: Sing praise to Yahweh[a], you his faithful ones[c][b], and give thanks to the remembrance of his holiness.
translation:
  language: ta
  text: யாவேவைப் புகழ்ந்து பாடுங்கள், அவருக்கு உண்மையுள்ளவர்களே[a]; அவருடைய பரிசுத்தத்தை நினைவுகூர்ந்து அவருக்கு நன்றி செலுத்துங்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய பக்தியுள்ளவர்களே”; “அவருடைய தூயவர்களே.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொற்றொடரை “அவருடைய பரிசுத்தத்தின் நினைவுக்காக நன்றி செலுத்துங்கள்” அல்லது “அவருடைய பரிசுத்தம் குறிப்பிடப்படும்போது நன்றி செலுத்துங்கள்” என்றும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: புகழ்ந்து பாடுங்கள்
  rationale: זמר என்பதன் பியேல் கட்டளை வடிவம் இசையுடன் பாடுவதையும் புகழ்வதையும் குறிக்கிறது; ‘புகழ்ந்து பாடுங்கள்’ இரு கூறுகளையும் இயல்பாகத் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேவைப்
  rationale: יהוה என்ற இறைத் திருப்பெயரைப் பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், ‘யாவே’ என ஒலிபெயர்த்து வழங்குகிறது.
- source_word: חֲסִידָיו
  choice: அவருக்கு உண்மையுள்ளவர்களே
  rationale: חסיד என்பது உடன்படிக்கைச் சார்ந்த பற்றுறுதி, பக்தி, உண்மைத்தன்மை ஆகியவற்றைக் குறிக்கலாம். நேரடி அழைப்பைத் தமிழில் ‘-களே’ தெளிவாக்குகிறது.
- source_word: וְהוֹדוּ
  choice: அவருக்கு நன்றி செலுத்துங்கள்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் நன்றி செலுத்துதல் அல்லது புகழ்தல் என்று பொருள்படும். தமிழில் செயப்படுபொருள் தெளிவாக இருக்க ‘அவருக்கு’ மீண்டும் சேர்க்கப்பட்டுள்ளது.
- source_word: לְזֵכֶר קָדְשׁוֹ
  choice: அவருடைய பரிசுத்தத்தை நினைவுகூர்ந்து
  rationale: זֵכֶר என்பது நினைவு, நினைவுகூருதல், அல்லது குறிப்பிடுதல் எனப் பொருள்படலாம். இங்கு உள்ள எபிரெயச் சொற்றொடரின் தொடர்பை இயல்பான தமிழில் தரும் வகையில் வினையெச்சமாக வழங்கப்பட்டுள்ளது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைத் திருப்பெயர் நேரடியாக உள்ளது. பொதுப்பட்டத்தால் அதை மாற்றாமல், நவீன தமிழில் ஏற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- issue: קָדְשׁוֹ என்பதன் பொருள்
  choice: அவருடைய பரிசுத்தம்
  alternative: அவருடைய பரிசுத்த நாமம்
  rationale: மூலத்தில் ‘நாமம்’ என்ற சொல் இல்லை. ஆகவே அதைச் சேர்க்காமல், ‘அவருடைய பரிசுத்தம்’ என்ற நேரடிப் பொருள் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன, மரியாதைமிக்க, வழிபாட்டுக்கேற்ற பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. பன்மைக் கட்டளை வடிவங்களும் ‘-களே’ என்ற விளிப்பும் எபிரெய மூலத்தின் நேரடி அழைப்பைத் தெளிவாகக் காட்டுகின்றன.
