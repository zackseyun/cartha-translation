source:
  edition: WLC
  text: וַ֭/אֲנִי אָמַ֣רְתִּי בְ/שַׁלְוִ֑/י בַּל אֶמּ֥וֹט לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/006.yaml
  text: As for me[a], I said in my prosperity[b], “I will never be shaken.”
translation:
  language: ta
  text: நானோ, என் நல்வாழ்வில்[a], “நான் என்றென்றும் நிலைகுலைய மாட்டேன்”[b] என்று சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘என் சுகநிலையில்,’ ‘என் பாதுகாப்பான நிலையில்,’ அல்லது ‘என் செழிப்பில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பொருளாதாரச் செழிப்பை மட்டும் அல்லாமல், அமைதியும் பாதுகாப்புணர்வும் கொண்ட நல்வாழ்வைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: 'சொல்லுக்குச் சொல்: ‘நான் என்றென்றும் அசைய மாட்டேன்.’ ‘நான் ஒருபோதும் நிலைகுலைய மாட்டேன்’ என்பதும் பொருள்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: நானோ
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட சுட்டுப்பெயரின் வலியுறுத்தலையும், சூழலில் உள்ள தன்மீது திரும்பும் கவனத்தையும் இயல்பான தமிழில் காட்டுகிறது.
- source_word: אָמַרְתִּי
  choice: என்று சொன்னேன்
  rationale: இந்த நினைவுகூரும் சூழலில் எளிய இறந்தகாலம் எபிரெய வினைவடிவை இயல்பாகப் பிரதிபலிக்கிறது; ‘முன்பு சொல்லியிருந்தேன்’ என்று கால உறவைத் தேவையின்றி குறிப்பாக்கவில்லை.
- source_word: בְשַׁלְוִי
  choice: நான் நிம்மதியாக இருந்தபோது
  rationale: שַׁלְוָה குறிக்கும் அமைதி, சுகநிலை, பாதுகாப்புணர்வுடன் கூடிய நல்வாழ்வு ஆகியவற்றை வெளிப்படுத்துகிறது. பொருளாதாரச் செழிப்புக்கு மட்டும் பொருளைச் சுருக்காமல், தமிழில் இயல்பாக அமைக்கப்பட்டுள்ளது.
- source_word: בַּל ... לְעוֹלָם
  choice: என்றென்றும் ... மாட்டேன்
  rationale: கவிதைநடை எதிர்மறைச் சொல்லையும் ‘என்றென்றும்’ என்ற காலக் குறிப்பையும் தனித்தனியாக வைத்துப் பிரதிபலிக்கிறது; பேச்சாளரின் உறுதியான தன்னம்பிக்கையைப் பாதுகாக்கிறது.
- source_word: אֶמּוֹט
  choice: நிலைகுலைய
  rationale: மோட் என்ற வேரின் அசைதல், தடுமாறுதல், நிலையிழத்தல் ஆகிய உருவகப் பொருள்களை நவீன தமிழில் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: பேச்சாளரின் நல்வாழ்வை பொருளாதாரச் செழிப்பாக மட்டும் புரிந்துகொள்வதா
  choice: ‘நிம்மதியாக இருந்தபோது’ என்று பரந்த பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘என் செழிப்பில்’ அல்லது ‘நான் வளமாக இருந்தபோது’
  rationale: மூலச்சொல் அமைதியான சுகநிலையையும் பாதுகாப்புணர்வையும் குறிக்க முடியும்; பொருளாதார வளம் மட்டுமே என்று தீர்மானிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான, வாசிக்க எளிய நடை பயன்படுத்தப்பட்டுள்ளது. ‘நானோ’ என்பது தனிப்பட்ட வலியுறுத்தலைச் சுருக்கமாகக் காட்டுகிறது; ‘நிலைகுலைய’ என்பது சங்கீதத்தின் நிலையற்ற தன்மை குறித்த உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
