  text: To you, O LORD, I call, and to my Lord I plead for mercy.
translation:
  language: ta
  text: யெகோவாவே, உம்மை நோக்கிக் கூப்பிடுவேன்; என் ஆண்டவரே, உம்மிடம் தயவுக்காக மன்றாடுவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயரை, அடுத்துவரும் אֲדֹנָי என்பதிலிருந்து வேறுபடுத்திக் காட்டுகிறது; விளிப்புமுறையும் தமிழில் இயல்பாக உள்ளது.
- source_word: אֶקְרָא
  choice: கூப்பிடுகிறேன்
  rationale: קרא என்பதன் நேரடியான வேண்டுதல் சார்ந்த பொருளைத் தக்கவைத்து, தொடர்ச்சியான தற்போதைய விண்ணப்பமாக இயல்பாக வழங்குகிறது.
- source_word: אֲדֹנָי
  choice: என் ஆண்டவர்
  rationale: எபிரெயச் சொல்லின் முதலாம் நபர் உரிமை வடிவத்தைப் பிரதிபலித்து, 'என் ஆண்டவர்' என்ற பொருளை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: אֶתְחַנָּן
  choice: இரக்கம் காட்டும்படி மன்றாடுகிறேன்
  rationale: חנן வேரின் அருள் அல்லது தயவு கோரும் நுட்பத்தையும், தீவிர விண்ணப்பத்தையும் இயல்பான நவீனத் தமிழில் எடுத்துரைக்கிறது.
theological_decisions:
- issue: יְהוָה மற்றும் אֲדֹנָי ஆகிய இரு தெய்வீகக் குறிப்புகளின் வேறுபாடு
  choice: முறையே ‘யெகோவா’ மற்றும் ‘என் ஆண்டவர்’ என்று வேறுபடுத்தப்பட்டுள்ளது.
  alternative: இரண்டையும் ‘ஆண்டவர்’ என்று மொழிபெயர்த்தல்.
  rationale: மூல எபிரெய உரையில் உள்ள தனிப்பெயர்–பட்டப்பெயர் வேறுபாட்டையும், אֲדֹנָי-இல் உள்ள ‘என்’ என்ற வடிவத்தையும் மறைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நேரடி உரையாடல் நடை. ‘உம்மை’ என்பது மரியாதையையும் இறைநோக்கிய அழைப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
