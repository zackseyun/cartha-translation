    text: அல்லது, “என் மலைக்கு வலிமையை நிலைநாட்டினீர்.” எபிரெயச் சொற்றொடர் சுருக்கமானது; இது உறுதியான செழிப்பு அல்லது நிலைத்தன்மையையும் படிமமாகக் குறிக்கலாம்.
