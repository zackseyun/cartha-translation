  yaml_path: translation/ot/psalms/030/007.yaml
  text: O Yahweh[a], by your favor you made my mountain stand strong; when you hid your face, I was dismayed.
translation:
  language: ta
  text: யாவே, உமது தயவினால் என் மலையை வலிமையாக நிலைநிறுத்தினீர்[a]; உமது முகத்தை மறைத்தபோது நான் கலங்கிப்போனேன்.
  philosophy: optimal-equivalence
