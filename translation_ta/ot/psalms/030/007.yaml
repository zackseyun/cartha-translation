  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரைப் பிரதிபலிக்கும் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; நேரடி அழைப்பைத் தெரிவிக்க ‘யாவே’ என அழைப்புமுறையில் தரப்பட்டுள்ளது.
- source_word: בִּרְצוֹנְךָ
  choice: உமது தயவினால்
  rationale: רָצוֹן என்பது தயவு, நல்லெண்ணம், அங்கீகாரம் ஆகிய பொருள்களைத் தருகிறது; முன்னொட்டு ב இங்கு கருவிப்பொருளில் இருப்பதால் ‘தயவினால்’ இயல்பானது.
- source_word: הֶעֱמַדְתָּה
  choice: நிலைநிற்கச் செய்தீர்
  rationale: עמד என்பதன் ஹிஃபில் வடிவிலுள்ள காரணவினைப் பொருளான ‘நிற்கச் செய்தல்’ என்பதைக் காக்கிறது.
- source_word: לְהַרְרִי עֹז
  choice: என் மலையை வலிமையுடன்
  rationale: சுருக்கமும் இலக்கணச் சிக்கலும் கொண்ட எபிரெயச் சொற்றொடரில் ‘என் மலை’ என்ற கவித்துவப் படிமத்தையும் עֹז என்பதன் ‘வலிமை’ பொருளையும் விளக்கமாக மாற்றாமல் காக்கிறது.
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: உமது முகத்தை மறைத்தபோது
  rationale: தெய்வீகத் தயவு அல்லது பிரசன்னம் விலக்கப்படுவதைக் குறிக்கும் எபிரெய உருவகத்தை நேரடியாகவும் புரியத்தக்கவாறும் காக்கிறது.
- source_word: נִבְהָל
  choice: கலங்கிப்போனேன்
  rationale: בהל என்பதன் நிஃபால் வடிவம் திடீரெனக் கலங்குதல், திகைத்தல் அல்லது அச்சமடைதல் ஆகிய உணர்வுகளைத் தருகிறது; சூழலை மிகைப்படுத்தாமல் ‘கலங்கிப்போனேன்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
