  register: நவீன செந்தமிழும் பொதுவாகப் புரியும் நடையும் இணைந்த கண்ணியமான கவிதை மொழி பயன்படுத்தப்பட்டுள்ளது. மரியாதை ஒருமைக்காக ‘உமது/செய்தீர்’ வடிவங்கள் தொடர்ச்சியாகப் பேணப்பட்டுள்ளன; ‘மலை’ மற்றும் ‘முகத்தை மறைத்தல்’ என்ற சங்கீதப் படிமங்கள் விளக்கவுரையாக மாற்றப்படவில்லை.
