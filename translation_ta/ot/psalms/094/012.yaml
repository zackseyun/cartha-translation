theological_decisions:
- issue: יָּהּ என்ற இறைப்பெயரின் வடிவம்
  choice: யாஹ்
  alternative: ஆண்டவரே
  rationale: இங்கு முழு நான்கெழுத்து இறைப்பெயர் அல்லாமல் அதன் சுருக்கமான கவிதை வடிவம் உள்ளது; பொதுப்பட்ட பட்டப்பெயராக மாற்றாமல் மூல வேறுபாட்டைக் காக்கப்பட்டது.
- issue: הַגֶּבֶר என்பதன் பாலினமும் பிரதிநிதித்துவப் பொருளும்
  choice: அந்த மனிதன்
  alternative: அந்த நபர்
  rationale: மூலத்தின் ஆண்பால் ஒருமையைத் தக்கவைத்தபடியே, இச்சொல் பிரதிநிதித்துவமாகப் பயன்படக்கூடியதை அடிக்குறிப்பு விளக்குகிறது.
- issue: תּוֹרָה என்பதன் பொருள் வரம்பு
  choice: சட்டம்
  alternative: போதனை
  rationale: சங்கீதச் சூழலில் இறைவனுடைய சட்டம் என்ற அறியப்பட்ட பொருள் பொருத்தமானது; ஆனால் ‘போதனை/அறிவுரை’ என்ற உண்மையான விரிந்த பொருளும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழுக்கு நெருக்கமான, வழிபாட்டிற்கும் பொதுவாசிப்பிற்கும் ஏற்ற கண்ணியமான நடை. எபிரெயத்தின் ஒரே தொடர்புச் சொல்லின் கீழ் வரும் இரு வினைகளும் ‘எவனை... கற்பிக்கிறீரோ’ என்ற தமிழ் தொடர்பு அமைப்பில் இணைக்கப்பட்டுள்ளன. ‘பேறுபெற்றவன்’ என்பது உளநிலை மகிழ்ச்சியை மட்டும் அல்லாமல் இறையாசியும் நல்வாழ்வும் அடங்கிய வாழ்த்துரைப் பொருளைத் தருகிறது.
