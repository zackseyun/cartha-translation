translation:
  language: ta
  text: துன்ப நாட்களிலிருந்து[a] அவனுக்கு ஓய்வு அளிப்பதற்காக, தீயவனுக்காக ஒரு படுகுழி தோண்டப்படும் வரை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீமையான நாட்களிலிருந்து.’ எபிரெயச் சொற்றொடர் நேரடியாக ‘தீமையின் நாட்களிலிருந்து’ என உள்ளது; துன்பம் அல்லது பேரிடரால் குறிக்கப்படும் நாட்களை அது குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தீயவனுக்காக அழிவின் குழி தோண்டப்படும் வரை.’ இச்சொல் சாதாரணக் குழியைக் குறிப்பதோடு, அழிவு அல்லது கல்லறை போன்ற கருத்துநிழல்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁקִיט לוֹ
  choice: அவனுக்கு ஓய்வளிப்பதற்காக
  rationale: שׁקט என்பதன் ஹிஃபீல் வினையெச்ச வடிவம் ஒருவரை அமைதியாக அல்லது தொந்தரவின்றி இருக்கச் செய்வதைக் குறிக்கிறது; לוֹ பயனடைவோரைச் சுட்டுகிறது. முந்தைய வசனத்துடன் தொடரும் நோக்கத்தையும் தமிழ் சொற்றொடர் இயல்பாகக் காட்டுகிறது.
- source_word: מִימֵי רָע
  choice: தீமையான நாட்களிலிருந்து
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘தீமையின்/தீங்கின் நாட்களிலிருந்து.’ இது துன்பம் அல்லது பேரிடரால் குறிக்கப்படும் காலத்தையும் குறிக்கலாம்; மூலத்தின் பொருள் விரிவை முதன்மை உரை காக்கிறது.
- source_word: עַד
  choice: வரை
  rationale: ஓய்வின் கால எல்லையை அறிமுகப்படுத்தும் இயல்பான காலக் குறியீடு.
- source_word: יִכָּרֶה
  choice: தோண்டப்படும்
  rationale: כרה என்பதன் நிஃபால் முற்றுப்பெறாத வடிவம் இங்கு செயப்பாட்டு பொருளில் ஒரு குழி தோண்டப்படுவதைக் குறிக்கிறது.
- source_word: לָרָשָׁע
  choice: தீயவனுக்காக
  rationale: ஒருமை பெயரடையான רָשָׁע இங்கு பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்டு, தீய மனிதனை ஒரு வகைமாதிரியாகச் சுட்டுகிறது.
- source_word: שָׁחַת
  choice: ஒரு படுகுழி
  rationale: שָׁחַת என்பது குழியைக் குறித்தாலும், அழிவு அல்லது கல்லறை சார்ந்த ஆழ்ந்த அபாய உணர்வையும் அடிக்கடி தாங்குகிறது. ‘படுகுழி’ அந்த அடிப்படைப் படிமத்தையும் தீவிரத்தையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: நீதிமானாகிய துன்புறுபவருக்கு அளிக்கப்படும் ஓய்வின் இயல்பு
  choice: தீமையான அல்லது துன்பமிக்க நாட்களிலிருந்து கிடைக்கும் ஓய்வு; அது தீயவனுக்கான படுகுழி தோண்டப்படும் வரை நீடிக்கிறது
  alternative: துன்பத்தின் நடுவிலேயே கிடைக்கும் உள்ளார்ந்த அமைதி; அல்லது இறுதிக்கால ஓய்வு மட்டும்
  rationale: இவ்வசனத்தின் தொடரமைப்பு, முந்தைய வசனத்திலுள்ள போதித்தல் அல்லது கண்டித்தலோடு ஓய்வை இணைத்து, ‘வரை’ என்பதன் மூலம் தீயவனுக்கு வரும் நீதித்தீர்ப்பை அதன் எல்லையாகக் காட்டுகிறது. எனினும் ‘தீமையான நாட்களிலிருந்து’ என்பது துன்பத்திலிருந்து விடுதலையையோ துன்பநாட்களில் பாதுகாக்கப்படும் அமைதியையோ குறிக்கக்கூடிய நுண்ணிய பதற்றத்தை முற்றிலும் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் கண்ணியமான, வாசிக்க எளிய நடையைப் பயன்படுத்துகிறது. முந்தைய வசனத்திலிருந்து தொடரும் நோக்க வாக்கியத் தன்மையை ‘-ப்பதற்காக’ காக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
