  yaml_path: translation/ot/psalms/094/020.yaml
  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
translation:
  language: ta
  text: சட்டத்தின் மூலம் தீங்கை உருவாக்கும் அழிவின் அரியணை[a] உம்மோடு கூட்டணி கொள்ள முடியுமா?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கேடுகளின் அரியணை’ அல்லது ‘அழிவை ஏற்படுத்தும் அரியணை.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், ‘சட்டத்தின்மேல் தீங்கை உருவாக்கும்.’ இத்தொடர் சட்டத்தையோ ஆணையையோ தீங்கு விளைவிக்கும் கருவியாக அல்லது சாக்காகப் பயன்படுத்துவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְחָבְרְךָ
  choice: உம்மோடு கூட்டுச் சேர முடியுமா
  rationale: חבר என்பதன் தொடர்பு அல்லது கூட்டணி என்ற பொருளையும், கேள்வியிடைச்சொல் ה உருவாக்கும் மறுப்பை உணர்த்தும் வினாவையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כִּסֵּא
  choice: அரியணை
  rationale: ஆட்சி அதிகாரத்தை உருவகப்படுத்தும் ‘அரியணை’ என்ற அரசியல்-நீதித்துறைப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: הַוּוֹת
  choice: அழிவு
  rationale: இப்பன்மைச் சொல் அழிவுகள், கேடுகள், தீய சூழ்ச்சிகள் ஆகிய பொருட்களைத் தரக்கூடும். ஊழல்மிக்க ஆட்சியின் அழிவுண்டாக்கும் தன்மையை ‘அழிவு’ சுருக்கமாக வெளிப்படுத்துகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: יֹצֵר
  choice: உருவாக்குகிறதே
  rationale: יצר என்பதன் அடிப்படை ‘உருவாக்குதல்/வடிவமைத்தல்’ என்ற படிமத்தைத் தக்கவைத்து, தொடர்ந்து செயல்படும் ஆட்சியைப் பங்கேற்பெயர் வடிவத்துக்கு இணையான தமிழில் காட்டுகிறது.
- source_word: עָמָל
  choice: தீங்கு
  rationale: இச்சூழலில் ஆட்சி சட்டத்தின் வழியாக உண்டாக்கும் துன்பம், இடர், ஒடுக்குமுறை ஆகியவற்றை இயல்பாக உள்ளடக்குகிறது.
- source_word: עֲלֵי חֹק
  choice: சட்டத்தின் மூலம்
  rationale: சொல்லளவில் ‘சட்டத்தின்மேல்’ என இருந்தாலும், இங்கு சட்டம் அல்லது ஆணையைத் தீங்கு விளைவிக்கும் கருவியாகப் பயன்படுத்துவதை ‘மூலம்’ தெளிவாகவும் அளவுக்கு மீறிய விளக்கமின்றியும் தெரிவிக்கிறது.
theological_decisions:
- issue: அநீதியான ஆட்சிக்கும் கடவுளுக்கும் இடையிலான உறவைப் பற்றிய வினா
  choice: அழிவுண்டாக்கி சட்டத்தால் தீங்கு செய்யும் ஆட்சி கடவுளுடன் கூட்டுச் சேர இயலாது என்பதை மறுப்பை உணர்த்தும் வினாவாக வைத்தல்
  alternative: கடவுளுடன் நியாயத்தீர்ப்பில் அமரக்கூடிய அநீதியான நீதிபதியைப் பற்றிய பொதுவான வினாவாக எடுத்தல்
  rationale: ‘அரியணை’ என்ற ஆட்சி உருவகமும் கேள்வியிடைச்சொல்லும் ஊழல்மிக்க அதிகாரத்திற்கும் கடவுளுக்கும் உள்ள பொருந்தாமையைச் சுட்டுகின்றன. அதை வெளிப்படையான கோட்பாட்டுக் கூற்றாக மாற்றாமல் மூலத்தின் வினா வடிவமே பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கடவுளை நோக்கிய மரியாதை ஒருமையான ‘உம்மோடு’ பயன்படுத்தப்பட்டுள்ளது. அரசியல் படிமமும் சட்ட மொழிநடையும் தக்கவைக்கப்பட்டுள்ளன; மறுப்பை உணர்த்தும் மூல வினா நேரடி கோட்பாட்டுக் கூற்றாக மாற்றப்படவில்லை.
