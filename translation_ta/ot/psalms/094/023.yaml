base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/023.yaml
  text: He will bring back on them their iniquity[a], and in their evil he will wipe them out[c][b]; Yahweh our God will wipe them out.
translation:
  language: ta
  text: அவர்களுடைய அக்கிரமத்தை அவர்கள்மேல் திருப்புவார்[a]; அவர்களுடைய தீமையில் அவர்களை முற்றிலும் அழித்துவிடுவார்[b]. எங்கள் கடவுளாகிய யாவே[c] அவர்களை முற்றிலும் அழித்துவிடுவார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘அவர்களுடைய தீச்செயலை அவர்கள்மேல் திருப்பினார்’ அல்லது ‘திருப்பியுள்ளார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயக் கவிதையில் இவ்வினை வடிவம் இறந்தகால அல்லது எதிர்கால நுட்பத்தை ஏற்கலாம்; ‘அக்கிரமம்’ என்பதற்கான எபிரெயச் சொல் ‘தீச்செயல்’ அல்லது ‘தவறான செயல்’ என்றும் பொருள்படும்.
    reason: lexical_alternative
  - marker: b
    text: ‘அவர்களுடைய தீமையினால் அவர்களை முற்றிலும் அழித்துவிடுவார்’ அல்லது ‘அவர்களுடைய தீமைக்காக அவர்களை முற்றிலும் அழித்துவிடுவார்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய முன்னிடைச்சொல் கருவி, தொடர்பு, அல்லது அடிப்படை ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில் ‘YHWH’ (יהוה); இது கடவுளுடைய தனிப்பட்ட பெயர். இங்கு ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׁב עֲלֵיהֶם
  choice: அவர்கள்மேலேயே திருப்புவார்
  rationale: שׁוב என்பதன் காரணவினை உணர்வு, அவர்கள் செய்தது அவர்கள்மீதே திரும்பும் நியாயத்தீர்ப்புப் படிமத்தை அளிக்கிறது. சங்கீதச் சூழலில் இவ்வினை வடிவம் எதிர்கால நிச்சய அறிவிப்பாகப் புரிந்துகொள்ளப்படலாம்.
- source_word: אֶת אוֹנָם
  choice: அவர்களுடைய அக்கிரமத்தை
  rationale: אָוֶן என்பது துன்பம், தீச்செயல், அக்கிரமம் போன்ற பொருள்களை ஏற்கலாம். இங்கு அது குற்றவாளிகள்மீது திருப்பப்படும் ஒழுக்கக்கேடாக இருப்பதால் ‘அக்கிரமம்’ பொருத்தமானது.
- source_word: וּבְרָעָתָם
  choice: அவர்களுடைய தீமையிலேயே
  rationale: בְּ முன்னிடைச்சொல் சூழல், கருவி, அல்லது அடிப்படை ஆகிய நுட்பங்களைத் தரக்கூடும். ‘தீமையிலேயே’ என்பது எபிரெயச் சுருக்கத்தையும் அதன் திறந்த பொருள் நுட்பத்தையும் இயன்றவரை காக்கிறது.
- source_word: יַצְמִיתֵם
  choice: அவர்களை முற்றிலும் அழித்துவிடுவார்
  rationale: צמת என்பதன் காரணவினை வடிவம் முழுமையாக அழித்தல் அல்லது ஒழித்துக்கட்டுதல் என்ற வலிமையான பொருளைக் கொண்டது. எபிரெயத்தில் இருமுறை வருவது தமிழிலும் அதே சொற்றொடரை மீண்டும் கூறிப் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயர். தமிழில் அதன் பரவலான ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுள்
  rationale: முதல் நபர் பன்மை உரிமை விகுதியுடன் வரும் நேரடியான பொருள். ‘நம் கடவுளாகிய யாவே’ என்பது இயல்பான தமிழ் அமைப்பு.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது. பட்டப்பெயராக மாற்றாமல், அதன் பொதுவாக ஏற்கப்பட்ட ஒலிப்பைத் தமிழில் தருவது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: தொடக்க வினையின் காலம்
  choice: 'எதிர்கால நிச்சய அறிவிப்பு: ‘திருப்புவார்’'
  alternative: 'இறந்தகாலம்: ‘திருப்பினார்’ அல்லது நிறைவேற்றுக்காலம்: ‘திருப்பியுள்ளார்’'
  rationale: וַיָּשֶׁב வடிவம் பொதுவாக இறந்தகாலத் தொடரில் வரக்கூடியதாயினும், கவிதைச் சூழலில் வேறு கால/முறை வலிமையை ஏற்கலாம். தொடர்ந்து இருமுறை வரும் יַצְמִיתֵם எதிர்கால வடிவங்களோடு இணங்க, இங்கு உறுதியான வருங்கால நியாயத்தீர்ப்பு அறிவிப்பாக மொழிபெயர்க்கப்பட்டுள்ளது; மாற்று வாய்ப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- issue: בְרָעָתָם என்பதில் בְּ-இன் உறவு
  choice: ‘அவர்களுடைய தீமையிலேயே’ என்று திறந்த நுட்பத்துடன் மொழிபெயர்த்தல்
  alternative: ‘அவர்களுடைய தீமையினால்’ அல்லது ‘அவர்களுடைய தீமைக்காக’
  rationale: முன்னிடைச்சொல் கருவி, தொடர்பு, அல்லது அடிப்படை எனப் பலவாறு புரியக்கூடும். பிரதான உரை இதைத் தீர்மானமாக ஒரே பொருளில் முடக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கும் நடை. ‘அக்கிரமம்’ மற்றும் ‘முற்றிலும் அழித்துவிடுவார்’ ஆகியவை மூலத்தின் ஒழுக்க மற்றும் நியாயத்தீர்ப்பு வலிமையைத் தக்கவைக்கின்றன. எபிரெய மறுபதிப்பு தமிழிலும் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது.
