  text: בְּ/רֹ֣ב שַׂרְעַפַּ֣/י בְּ/קִרְבִּ֑/י תַּ֝נְחוּמֶ֗י/ךָ יְֽשַׁעַשְׁע֥וּ נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/019.yaml
  text: When my anxious thoughts are many within me[b][a], your consolations delight my soul.
translation:
  language: ta
  text: எனக்குள் கலக்கமூட்டும் எண்ணங்கள் மிகுந்தபோது[a], உமது ஆறுதல்கள் என் உள்ளத்தை மகிழ்விக்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்குள் மனக்கலக்கமூட்டும் எண்ணங்கள் திரளாக இருந்தபோது.” இதற்கான எபிரெயப் பெயர்ச்சொல் மனத்தைத் தொந்தரவு செய்யும், பிளவுபட்ட, அல்லது பல திசைகளில் ஓடும் எண்ணங்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது ஆறுதல்கள் என் உள்ளத்திற்கு இன்பமளிக்கின்றன.” ‘ஆறுதல்கள்’ என்பதற்கான எபிரெயச் சொல் பன்மையில் உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב
  choice: பெருகும்போது
  rationale: בְּ + רֹב என்பதன் அடிப்படைப் பொருள் ‘மிகுதியில்/திரளில்’ என்பதாகும். இங்கு சூழ்நிலையைக் குறிக்கும் அதன் பங்கை இயல்பான தமிழில் ‘பெருகும்போது’ என்று வழங்குவது பொருத்தமானது.
- source_word: שַׂרְעַפַּי
  choice: கலக்கமூட்டும் எண்ணங்கள்
  rationale: இந்தப் பெயர்ச்சொல் அமைதியைக் குலைக்கும், பிரிந்து கிளைக்கும் அல்லது அலைபாயும் எண்ணங்களைக் குறிக்கலாம். அதன் மனக்குழப்பப் பொருளைப் பாதுகாத்து, இன்றைய வாசகருக்கு இயல்பாகப் புரியுமாறு இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּקִרְבִּי
  choice: எனக்குள்
  rationale: இந்தச் சொற்றொடர் ஒருவரின் அகநிலையைக் குறிக்கிறது; ‘எனக்குள்’ என்பது சுருக்கமான, இயல்பான தமிழ் வடிவம்.
- source_word: תַּנְחוּמֶיךָ
  choice: உமது ஆறுதல்கள்
  rationale: எபிரெயச் சொல் பன்மையில் உள்ளது. பலவகையான அல்லது மீண்டும் மீண்டும் கிடைக்கும் ஆறுதலை உணர்த்தக்கூடிய அந்தப் பன்மை தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יְשַׁעַשְׁעוּ
  choice: மகிழ்விக்கின்றன
  rationale: இந்த வினைச்சொல் இன்பமளித்தல், மனத்தைத் தேற்றுதல், மகிழச்செய்தல் ஆகிய வலுவான நேர்மறைப் பொருள்களைத் தருகிறது. ‘மகிழ்விக்கின்றன’ என்பது கவிதைநயத்தையும் இயல்பான தமிழையும் இணைக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உள்ளத்தை
  rationale: נֶפֶשׁ என்பது சூழலுக்கேற்ப உயிர், தன்முழுமை, ஆன்மா அல்லது அகஉள்ளம் என்று பொருள்படலாம். இங்கு உள்ளார்ந்த மனநிலையே மையமாக இருப்பதால், குறிப்பிட்ட மானுடவியல் கோட்பாட்டைத் திணிக்காமல் ‘என் உள்ளத்தை’ என்று வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: נֶפֶשׁ என்பதை மானுடவியல் தொழில்நுட்பச் சொல்லாகப் புரிந்துகொள்ளும் வாய்ப்பு
  choice: என் உள்ளத்தை
  alternative: என் ஆன்மாவை
  rationale: இவ்வசனத்தில் அந்தச் சொல் மனிதரின் அகத்தன்மையையோ முழுத் தன்மையையோ குறிக்கிறது; உடலிலிருந்து தனித்த ஓர் அங்கம் என்ற குறிப்பிட்ட கோட்பாட்டை உரை வெளிப்படையாக வலியுறுத்தவில்லை. ஆகவே இயல்பான தமிழ் சூழலில் பொருளைத் திறந்தவாறே வைத்திருக்க ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியக்கூடியதாயும், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநயத்துடனும் வடிவமைக்கப்பட்டது. ‘உமது’ என்ற மரியாதை வடிவமும், எபிரெய மூலத்தின் ‘ஆறுதல்கள்’ என்ற பன்மையும் பாதுகாக்கப்பட்டுள்ளன.
