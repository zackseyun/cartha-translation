  text: כִּֽי עַד צֶ֭דֶק יָשׁ֣וּב מִשְׁפָּ֑ט וְ֝/אַחֲרָ֗י/ו כָּל יִשְׁרֵי לֵֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/015.yaml
  text: For judgment will return to righteousness[b][a], and all the upright in heart will follow after it.
translation:
  language: ta
  text: ஏனெனில், நியாயத்தீர்ப்பு நேர்மைக்குத் திரும்பும்[a]; உள்ளத்தில் நேர்மையுள்ள அனைவரும் அதைத் பின்பற்றுவார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீர்ப்பு நீதிக்குத் திரும்பும்.’ எபிரெய மִשְׁפָּט என்பது ‘நியாயத்தீர்ப்பு,’ ‘நீதி,’ அல்லது ‘தீர்ப்பு’ என்றும், צֶדֶק என்பது ‘நேர்மை,’ ‘நீதி,’ அல்லது ‘சரியானது’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்கு சொல், ‘அதன் பின்னால் உள்ளத்தில் நேர்மையுள்ள அனைவரும்.’ நேர்மையுள்ளவர்கள் அந்த நியாயத்தீர்ப்பைப் பின்பற்றுவார்கள் அல்லது அதனுடன் இணைந்து நிற்பார்கள் என்பதே கருத்து.
    reason: lexical_alternative
