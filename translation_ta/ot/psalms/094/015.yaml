theological_decisions:
- issue: מִשְׁפָּט மற்றும் צֶדֶק ஆகியவற்றின் உறவு
  choice: தற்போது சீர்குலைந்துள்ள நீதி மீண்டும் நியாயத்தோடு இசையும்.
  alternative: தீர்ப்பு நியாயம் வெல்லும்வரை தொடரும்.
  rationale: יָשׁוּב உடன் வரும் עַד צֶדֶק, காலநீட்சியைவிட திரும்புதல் அல்லது மீளிசைவை இயல்பாகக் குறிக்கிறது; அதேவேளை இரு சொற்களையும் ஒரே தமிழ்ச் சொல்லாகக் கலக்கவில்லை.
- issue: וְאַחֲרָיו-இல் உள்ள பின்னொட்டின் சுட்டுப்பொருள்
  choice: அது அருகிலுள்ள ஆண்பால் பெயர்ச்சொல்லான מִשְׁפָּט (‘நீதி’) என்பதைக் குறிக்கிறது.
  alternative: அது விரிவாக ‘நியாயம்’ என்பதையோ முன் கூறிய முழுக் கருத்தையோ குறிக்கலாம்.
  rationale: அருகிலுள்ள இலக்கண முன்னொட்டைக் கடைப்பிடித்து ‘அதை’ என மொழிபெயர்க்கப்படுகிறது; தெளிவுக்கு அப்பாற்பட்டு சுட்டுப்பொருளை மிகையாக வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘நீதி’ மற்றும் ‘நியாயம்’ என்பவை மூலத்திலுள்ள தொடர்புடைய இரு பெயர்ச்சொற்களின் வேறுபாட்டை இயன்றவரை பேணுகின்றன; அடிக்குறிப்புகள் உண்மையான சொல்லியல் மற்றும் தொடரியல் மாற்றுவாய்ப்புகளைத் தெரிவிக்கின்றன.
