  text: הִ֭נָּשֵׂא שֹׁפֵ֣ט הָ/אָ֑רֶץ הָשֵׁ֥ב גְּ֝מ֗וּל עַל גֵּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/002.yaml
  text: Rise up[a], Judge of the earth[b]; repay the proud what they deserve.
translation:
  language: ta
  text: பூமியின் நீதிபதியே, எழுந்தருளும்[a]; அகந்தையுள்ளவர்களுக்கு உரிய கைம்மாறைத் திருப்பிக் கொடும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உம்மை உயர்த்திக்கொள்ளும்” அல்லது “உயர்த்தப்படுவீராக.” எபிரெய வினைச்சொல், தேவன் தம்மை உயர்த்தி நீதிச் செயலில் இறங்குவதற்கான அழைப்பாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல் நெருக்கமாக, “அகந்தையுள்ளவர்கள்மேல் கைம்மாறைத் திரும்பச் செய்யும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּשֵׂא
  choice: எழுந்தருளும்
  rationale: தேவன் தம்மை உயர்த்தி செயல்படுமாறு அழைக்கும் கட்டளை வடிவம். நவீனத் தமிழில் இறைவரை நோக்கிய கண்ணியமான வேண்டுதலாகவும், நீதிச் செயலில் இறங்குவதற்கான அழைப்பாகவும் இயல்பாக ஒலிக்கிறது.
- source_word: שֹׁפֵט
  choice: நீதிபதியே
  rationale: இது தேவனுக்கான பெயர்ச்சொல் தன்மையுள்ள பட்டம். விளி வேற்றுமை, நேரடியான அழைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: הָאָרֶץ
  choice: பூமியின்
  rationale: இக்கவிதைச் சூழலில் தேவனுடைய நீதியதிகாரத்தின் உலகளாவிய பரப்பைத் தெரிவிக்கிறது; 'நாட்டின்' என்பது தேவையின்றி புவியியல் எல்லைக்குள் பொருளைக் குறுக்கலாம்.
- source_word: הָשֵׁב
  choice: திருப்பிக் கொடும்
  rationale: שוב என்பதன் ஹிஃபில் கட்டளை வடிவம், கைம்மாறு அவர்கள்மேல் திரும்பும்படி செய்வதைச் சித்தரிக்கிறது. 'கொடும்' என்பதைக் காட்டிலும் 'திருப்பிக் கொடும்' என்பது மூலத்தின் திரும்புதல் நிழற்பொருளையும் நீதிசார் பதிலளிப்பையும் காக்கிறது.
- source_word: גְּמוּל
  choice: அவர்கள் செய்ததற்கேற்ற கைம்மாறு
  rationale: גמול என்பது ஒருவரது செயலுக்குரிய பதிலையோ பிரதிபலனையோ குறிக்கிறது. இந்தத் தொடரில் நன்மைக்கான வெகுமதியல்ல, அகந்தையரின் செயல்களுக்கு ஏற்ற நீதிசார் கைம்மாறு என்பதைக் கூறுகிறது.
- source_word: עַל
  choice: பெருமையுள்ளவர்களுக்கு
  rationale: הָשֵׁב גְּמוּל עַל என்ற தொடரில் கைம்மாறு செலுத்தப்படும் இலக்கைச் சுட்டுகிறது. தமிழில் நான்காம் வேற்றுமை இயல்பாக இதை வெளிப்படுத்துகிறது; 'அவர்கள்மேல்' என்பதும் சாத்தியம்.
- source_word: גֵּאִים
  choice: பெருமையுள்ளவர்கள்
  rationale: இங்கு சமூக உயர்வை அல்ல, அறநெறி சார்ந்த அகந்தையைச் சுட்டுகிறது. 'பெருமையுள்ளவர்கள்' பொதுவாகப் புரியக்கூடியது; சூழலில் எதிர்மறைப் பொருள் தெளிவாகிறது.
theological_decisions:
- issue: தெய்வீக நீதிக்கான வேண்டுதலின் தன்மை
  choice: உலகின் நீதிபதியாகிய தேவன் எழுந்து, அகந்தையுள்ளவர்களின் செயல்களுக்கு ஏற்ற கைம்மாறை வழங்க வேண்டும் என்ற வேண்டுதல்
  alternative: தேவன் நீதித் தலையீடு செய்வதைவிட, முதன்மையாகத் தமது மகத்துவத்தை வெளிப்படுத்தி உயர்த்தப்பட வேண்டும் என்ற வேண்டுதல்
  rationale: இரு கட்டளைகளும், 'நீதிபதி' மற்றும் 'கைம்மாறு' என்ற நீதிசார் சொற்களும் செயலில் வெளிப்படும் தெய்வீக நீதியை மையப்படுத்துகின்றன. அதேவேளை הִנָּשֵׂא என்பதிலுள்ள 'உம்மை உயர்த்திக்கொள்ளும்/உயர்த்தப்படுவீராக' என்ற சாத்தியத்தை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவரை நோக்கிய மரியாதைமிக்க ஏவல் வடிவமாக 'எழுந்தருளும்', 'கொடும்' ஆகியவை அமைக்கப்பட்டுள்ளன. 'கைம்மாறு' மூலத்தின் நீதிசார் பிரதிபலன் கருத்தைக் காக்கிறது; அதன் பொருள் உடனே தெளிவாக 'அவர்கள் செய்ததற்கேற்ற' என விரிக்கப்பட்டுள்ளது.
