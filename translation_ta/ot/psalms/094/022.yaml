  text: But Yahweh has become my stronghold[a], and my God the rock of my refuge.
translation:
  language: ta
  text: ஆனால் யாவே எனக்கு அரணானார்[a]; என் கடவுள் என் அடைக்கலக் கற்பாறை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே எனக்கு அரணாகியிருக்கிறார்.” எபிரெய வினையை எளிய கடந்தகாலமாகவும் மொழிபெயர்க்கலாம்; “ஆகியிருக்கிறார்” என்பது அதன் விளைவு இன்றும் தொடர்வதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ஆனார்
  rationale: இவ்வினை வடிவம் கடந்தகாலத்தில் நிகழ்ந்ததைச் சுட்டுகிறது; சூழலில் அதன் தொடரும் விளைவு தெளிவாக இருப்பதால் இயல்பான தமிழில் ‘ஆனார்’ என மொழிபெயர்க்கப்பட்டது. ‘ஆகியிருக்கிறார்’ என்பதும் சாத்தியம், ஆனால் செய்யுள் நடையில் கனமாகும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநாமத்தின் நான்கு எபிரெய எழுத்துகளை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக ‘யாவே’ பயன்படுத்தப்பட்டது.
- source_word: לִי לְמִשְׂגָּב
  choice: எனக்கு அரணானார்
  rationale: לִי என்பதன் நலன்/உறவு சார்ந்த பொருளையும், מִשְׂגָּב குறிக்கும் உயர்ந்த பாதுகாப்பிடத்தின் உருவகத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: וֵאלֹהַי
  choice: என் கடவுள்
  rationale: இணைப்புச் சொல்லுடன் வரும் முதலாம் நபர் உரிமை விகுதியை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: לְצוּר מַחְסִי
  choice: நான் அடைக்கலம் புகும் கற்பாறையானார்
  rationale: צוּר என்பதன் உறுதியான பாதுகாப்புக் கற்பாறை உருவகத்தையும், מַחְסִי என்பதன் தனிப்பட்ட அடைக்கலப் பொருளையும் தெளிவான நவீன தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டம் அல்ல, இறைத் திருநாமமே நேரடியாக உள்ளது; ஆகவே அதை மறைக்காமல் ஒலிபெயர்க்கப்பட்டது.
- issue: וַיְהִי என்பதன் காலம் மற்றும் தொடரும் விளைவு
  choice: ஆனார்
  alternative: ஆகியிருக்கிறார்
  rationale: எபிரெய வினை கடந்த நிகழ்வை முன்வைக்கிறது; தற்போதும் தொடரும் நம்பிக்கையைச் சூழல் உணர்த்தினாலும், அதை வினை வடிவத்திலேயே கட்டாயமாகத் தீர்மானிக்காமல் அடிக்குறிப்பில் மாற்று வாசிப்பு தரப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, கண்ணியமான சங்கீத நடையைப் பேணுகிறது. ‘அரண்’, ‘அடைக்கலம்’, ‘கற்பாறை’ ஆகியவை பொதுவாகப் புரியும் சொற்களாக இருந்து மூலத்தின் பாதுகாப்பு உருவகங்களைத் தக்கவைக்கின்றன.
