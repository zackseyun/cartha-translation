revisions:
- from: விதவையையும் அந்நியக் குடியிருப்பாளரையும்[a] கொன்றுபோடுகிறார்கள்; தந்தையற்ற பிள்ளைகளைக்[b] கொலைசெய்கிறார்கள்.
  to: விதவையையும் அந்நியராகக் குடியிருப்பவரையும்[a] கொல்கிறார்கள்; தந்தையற்றவர்களைக்[b] கொலை செய்கிறார்கள்.
  rationale: The revision removes added force from the first verb, retains the deliberate kill/murder distinction, avoids adding ‘children’ to the fatherless, and uses a more natural Tamil expression for a foreign resident. Footnote anchors remain attached to the corresponding source terms.
