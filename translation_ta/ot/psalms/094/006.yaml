  yaml_path: translation/ot/psalms/094/006.yaml
  text: They kill the widow and the sojourner[b][a]; they murder the fatherless.
translation:
  language: ta
  text: விதவையையும் அந்நியராகக் குடியிருப்பவரையும்[a] கொல்கிறார்கள்; தந்தையற்றவர்களைக்[b] கொலை செய்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அந்நிய நாட்டவர்.’ எபிரெயச் சொல் மக்களிடையே வசிக்கும் அந்நிய நாட்டைச் சேர்ந்த ஒருவரைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அனாதைகளை.’ எபிரெயத்தில் இன்னும் சொற்படியாக, ‘தந்தையற்றவர்களை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: விதவை
  rationale: எபிரெய ஒருமை ஒரு பாதுகாப்பற்ற சமூகப் பிரிவின் பிரதிநிதியாகப் பொதுப்பொருளில் வருகிறது; தமிழிலும் ஒருமையைத் தக்கவைக்கிறது.
- source_word: גֵר
  choice: அந்நியக் குடியிருப்பாளர்
  rationale: இச்சொல் வழிப்போக்கரை அல்ல, மக்களிடையே வாழும் அந்நிய நாட்டைச் சேர்ந்த குடியிருப்பாளரைக் குறிக்கிறது; இந்தத் தமிழ் சொற்றொடர் அந்நிய நிலையையும் வசிப்பதையும் தெளிவாகக் காட்டுகிறது.
- source_word: יַהֲרֹגוּ
  choice: கொன்றுபோடுகிறார்கள்
  rationale: பொதுவாக உயிரைக் கொல்வதைக் குறிக்கும் வினை; அடுத்துள்ள רצח என்பதன் சட்ட-அறச் செறிவிலிருந்து வேறுபாட்டைத் தக்கவைக்கிறது.
- source_word: יְתוֹמִים
  choice: தந்தையற்ற பிள்ளைகள்
  rationale: எபிரெயச் சொல் குறிப்பாகத் தந்தையை இழந்தவர்களைக் குறிக்கிறது; இயல்பான தமிழுக்காக ‘பிள்ளைகள்’ சேர்க்கப்பட்டுள்ளது.
- source_word: יְרַצֵּחוּ
  choice: கொலைசெய்கிறார்கள்
  rationale: רצח அநியாயமான அல்லது சட்டவிரோதமான உயிர்க்கொலையின் வலுவான அற-சட்டப் பொருளைக் கொண்டது; முந்தைய பொதுவான ‘கொல்’ என்பதிலிருந்து வேறுபடுத்துகிறது.
