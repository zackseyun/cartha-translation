  text: אֵל נְקָמ֥וֹת יְהוָ֑ה אֵ֖ל נְקָמ֣וֹת הוֹפִֽיַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
translation:
  language: ta
  text: 'பழிவாங்கும் இறைவனே[a], யாவே,

    பழிவாங்கும் இறைவனே, ஒளிவீசித் தோன்றுவீராக![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் நேரடியாக, “பழிவாங்குதல்களின் இறைவனே … பழிவாங்குதல்களின் இறைவனே.” எபிரெய மொழியிலுள்ள பன்மை, தெய்வீகப் பழிவாங்குதலின் தீவிரத்தையோ அதன் பல செயல்களையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது “தோன்றுவீராக!” / “உம்மை வெளிப்படுத்துவீராக!” இந்த வினைச்சொல் கண்கூடாக நிகழும் தெய்வீக வெளிப்பாட்டைக் குறிக்கக்கூடும்; “ஒளிவீசித் தோன்றுவீராக” என்பது அந்த ஒளிமிக்க வெளிப்பாட்டுணர்வையும் தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: இறைவன்
  rationale: இங்கு אֵל என்பது பொதுவான ஒரு தெய்வத்தைக் குறிக்காமல், இஸ்ரவேலின் கடவுளை நேரடியாக அழைக்கும் தெய்வீகப் பெயராக வருகிறது. நவீனத் தமிழில் மரியாதையும் இயல்பும் கொண்ட ‘இறைவன்’ இதற்கு ஏற்றது.
- source_word: נְקָמוֹת
  choice: பழிவாங்கும்
  rationale: எபிரெயப் பன்மை வடிவம் தீவிரத்தையோ பல்வேறு பழிவாங்கும் செயல்களையோ உணர்த்தலாம். தமிழில் ‘பழிவாங்குதல்களின் இறைவன்’ என்பது செயற்கையாக ஒலிப்பதால், செயலை நிறைவேற்றுபவர் என்ற பொருளை இயல்பாகத் தரும் ‘பழிவாங்கும் இறைவன்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் பன்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயர். ஆகவே ‘ஆண்டவர்’ என்று மாற்றாமல், எபிரெயப் பெயரின் பரவலான தமிழ் ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: הוֹפִיעַ
  choice: ஒளிவீசித் தோன்றும்
  rationale: הופיע என்ற கட்டளை வடிவம் வெறுமனே ‘தோன்றுதல்’ மட்டுமல்லாமல், ஒளிமிக்க தெய்வீக வெளிப்பாட்டையும் குறிக்கக்கூடும். ‘ஒளிவீசித் தோன்றும்’ என்பது கட்டளைத் தொனியையும் அந்த வெளிப்பாட்டுணர்வையும் காக்கிறது.
theological_decisions:
- issue: தெய்வீகப் பழிவாங்குதலை மொழிபெயர்த்தல்
  choice: ‘பழிவாங்கும் இறைவன்’ என்ற நேரடியான கருத்தைப் பாதுகாத்தல்
  alternative: ‘நீதி வழங்கும் இறைவன்’
  rationale: மூலத்தில் பழிவாங்குதல் அல்லது தக்க பதிலடி என்ற கருத்தே வெளிப்படையாக உள்ளது. அதை ‘நீதி’ என்று மட்டும் மென்மைப்படுத்துவது மூலத்தின் இறையியல் பதற்றத்தைத் தீர்த்துவிடும்; எனவே கடவுளின் பழிவாங்கும் செயலை மொழிபெயர்ப்பு நேரடியாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான நேரடி அழைப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘பழிவாங்கும்’ என்ற கடினமான சொல்லை மென்மைப்படுத்தாமல் மூலத்தின் இறையியல் அழுத்தம் காக்கப்பட்டுள்ளது. ‘ஒளிவீசித் தோன்றும்’ என்பது இலக்கியத் தன்மை கொண்டிருந்தாலும் பொதுவாசகர்களுக்கு தெளிவாக உள்ளது.
