source:
  edition: WLC
  text: בִּ֭ינוּ בֹּעֲרִ֣ים בָּ/עָ֑ם וּ֝/כְסִילִ֗ים מָתַ֥י תַּשְׂכִּֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/008.yaml
  text: Understand, you brutish among the people; and you fools, when will you become wise?
translation:
  language: ta
  text: மக்களுக்குள் மதியீனர்களே, உணருங்கள்! மூடர்களே, நீங்கள் எப்போது புத்தியடைவீர்கள்?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּינוּ
  choice: உணர்ந்துகொள்ளுங்கள்
  rationale: இது பன்மை கட்டளை வடிவம்; வெறும் அறிவுசார் புரிதலைவிட உணர்ந்து தெளிதல் என்ற அழைப்பை இயல்பான தமிழில் தருகிறது.
- source_word: בֹּעֲרִים
  choice: மிருகத்தனமாக நடப்பவர்களே
  rationale: இந்தச் சொல் அறிவும் பகுத்தறிவும் இல்லாமல் மிருகம்போல் நடந்துகொள்வோரை இகழ்ந்து சுட்டுகிறது; தமிழில் பெயரடைப் பொருளை இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது.
- source_word: בָּעָם
  choice: மக்களிடையே
  rationale: בְּ + הָעָם என்பதன் நேரான இடைச்சொல் பொருளைத் தக்கவைக்கிறது.
- source_word: כְסִילִים
  choice: மூடர்களே
  rationale: ஞான இலக்கியத்தில் ஒழுக்க மற்றும் ஆன்மீக விவேகமின்மையையும் குறிக்கும் பொதுவான கடிந்துரைச் சொல்லுக்கு இயல்பான தமிழ் இணை.
- source_word: מָתַי תַּשְׂכִּילוּ
  choice: நீங்கள் எப்போது அறிவடைவீர்கள்?
  rationale: שׂכל என்பதன் அறிவு, விவேகம், புத்திசாலித்தனம் பெறுதல் ஆகிய பொருள் பரப்பைச் சுருக்கமாகத் தருகிறது; வினாவின் கடிந்துரைக்கும் வலிமையையும் காக்கிறது.
theological_decisions:
- issue: ‘மூடர்’ என்ற சொல்லின் பொருள்
  choice: ஒழுக்கமும் விவேகமும் அற்றவர்களைக் கடிந்துரைக்கும் ஞான இலக்கியச் சொல்லாக மொழிபெயர்க்கப்பட்டது.
  alternative: அறிவுத்திறன் குறைபாடு உள்ளவர்களைக் குறிக்கும் சொல்லாக எடுத்தல்.
  rationale: எபிரேய ஞான மரபில் כְּסִילִים என்பது பொதுவாக உடலியல் அல்லது அறிவாற்றல் குறைபாட்டை அல்ல, தேவனையும் நீதியையும் புறக்கணிக்கும் விவேகமின்மையைச் சுட்டுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், சங்கீதத்தின் நேரடியான கடிந்துரைக்கும் தொனியைப் பேணும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘மிருகத்தனமாக நடப்பவர்களே’ என்பது கடுமையான உருவகத்தைத் தக்கவைத்தாலும், இன்றைய வாசகருக்குப் பொருள் தெளிவாக இருக்கிறது.
