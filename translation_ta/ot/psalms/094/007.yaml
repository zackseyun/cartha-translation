base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/007.yaml
  text: And they say[a], “Yah does not see, and the God of Jacob does not understand.”
translation:
  language: ta
  text: அவர்கள், “யா[a] காண்பதில்லை; யாக்கோபின் தேவன் புரிந்துகொள்வதில்லை” என்று சொல்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘யா’; இது இறைவனுடைய பெயரின் குறுகிய கவிதை வடிவம். பொதுவாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படும் உடன்படிக்கைப் பெயரின் முழு வடிவத்துடன் ஒப்பிடுக.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: என்று சொல்கிறார்கள்
  rationale: இது வடிவில் இறந்தகால வினையாக இருந்தாலும், சங்கீதத்தின் கவிதைச் சூழலில் பொல்லாதவர்களின் வழக்கமான பேச்சை நிகழ்காலத்தில் எடுத்துரைக்கிறது. ஆகவே இயல்பான தமிழ் நிகழ்காலம் பயன்படுத்தப்பட்டது.
- source_word: לֹא יִרְאֶה
  choice: காண்பதில்லை
  rationale: ראה இங்கு பார்வையால் உணர்தல், அதாவது நடப்பதைக் கவனித்து அறிதல் என்ற உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יָּהּ
  choice: யா
  rationale: இது יהוה என்ற முழு இறைப் பெயரின் குறுகிய கவிதை வடிவம். அந்த வேறுபாட்டை மறைக்காமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: וְלֹא יָבִין
  choice: புரிந்துகொள்வதில்லை
  rationale: בין என்பதன் நேரடியான பொருளான புரிந்துகொள்ளுதல் அல்லது பகுத்துணர்தல் இங்கு கடவுளின் அறிவுணர்வை மறுக்கும் கூற்றாக வருகிறது.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: யாக்கோபின் தேவன்
  rationale: இது இஸ்ரவேலின் கடவுளைக் குறிக்கும் உடன்படிக்கை சார்ந்த பட்டத்தைத் தெளிவாகவும் இயல்பாகவும் வழங்குகிறது.
theological_decisions:
- issue: יָּהּ என்ற இறைப் பெயரின் குறுகிய கவிதை வடிவம்
  choice: யா
  alternative: கர்த்தர்
  rationale: மூலத்தில் יהוה என்ற முழு வடிவம் அல்லாமல் יָּהּ என்ற தனித்த குறுகிய வடிவம் உள்ளது. மூலமொழியின் இந்த வேறுபாட்டைப் பாதுகாக்க ‘யா’ என வழங்கப்பட்டது.
- issue: கடவுள் ‘புரிந்துகொள்வதில்லை’ என்ற பொல்லாதவர்களின் கூற்று
  choice: கூற்றை அதன் நேரடி பதற்றத்துடன் வைத்தல்
  alternative: கடவுள் கவனிப்பதில்லை
  rationale: בין என்பதைக் ‘கவனித்தல்’ என்று மென்மைப்படுத்தாமல், பொல்லாதவர்கள் கடவுளின் அறிவையே மறுக்கும் மூலத்தின் வலுவான கருத்து பாதுகாக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்கேற்ற சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. மேற்கோளின் குற்றஞ்சாட்டும் தன்மையும் ‘காண்பதில்லை / புரிந்துகொள்வதில்லை’ என்ற இணை அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
