  text: עַמְּ/ךָ֣ יְהוָ֣ה יְדַכְּא֑וּ וְֽ/נַחֲלָתְ/ךָ֥ יְעַנּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/005.yaml
  text: O Yahweh[b][a], they crush your people and afflict your inheritance.
translation:
  language: ta
  text: யாவே, அவர்கள் உமது மக்களை நசுக்குகிறார்கள்[a]; உமது சுதந்தரத்தைத் துன்புறுத்துகிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒடுக்குகிறார்கள்.” எபிரெய வினைச்சொல் நசுக்கும் வகையிலான கடுமையான ஒடுக்குதலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது உரிமைச் சொத்தை” அல்லது “உமது பாரம்பரிய உடைமையை.” எபிரெயச் சொல் சுதந்தரமாகக் கிடைத்த உடைமையையோ ஒதுக்கப்பட்ட பங்கையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמְּךָ
  choice: உமது மக்கள்
  rationale: עַם இங்கு யாவேக்குச் சொந்தமான மக்களைக் குறிக்கிறது; தமிழில் இயல்பாகவும் நேரடியாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: יהוה என்ற இறைபெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் அதன் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יְדַכְּאוּ
  choice: நசுக்குகிறார்கள்
  rationale: דכא என்பதன் பியேல் வடிவம் கடுமையாக நசுக்குதல் அல்லது ஒடுக்குதல் என்ற வலுவான படிமத்தைக் கொண்டுள்ளது; ‘நசுக்குகிறார்கள்’ அந்த வலிமையைத் தக்கவைக்கிறது.
- source_word: וְנַחֲלָתְךָ
  choice: உமது சுதந்தரத்தை
  rationale: נַחֲלָה என்பது சுதந்தரமாக அல்லது பங்காகக் கிடைத்த உடைமையைக் குறிக்கலாம்; இங்கு யாவேக்குச் சொந்தமான மக்களை இணைச்சொல்லாகக் குறிப்பிடுகிறது.
- source_word: יְעַנּוּ
  choice: துன்புறுத்துகிறார்கள்
  rationale: ענה என்பதன் பியேல் வடிவம் துன்பப்படுத்துதல், ஒடுக்குதல் என்ற பொருளைக் கொண்டது; முந்தைய ‘நசுக்குகிறார்கள்’ என்பதிலிருந்து வேறுபட்டும் அதன் கடுமையைப் பாதுகாத்தும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய உரை இங்கு יהוה என்ற தனிப்பட்ட இறைபெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: நַחֲלָה யாரைக் குறிக்கிறது
  choice: உமது சுதந்தரம்
  alternative: உமது உரிமைச் சொத்து
  rationale: இணைவாக்கிய அமைப்பில் இது ‘உமது மக்கள்’ என்பவர்களையே வேறொரு கோணத்தில் குறிப்பிடுகிறது. இருப்பினும், சுதந்தரம், ஒதுக்கப்பட்ட உடைமை, உரிமைச் சொத்து ஆகிய பொருள் நிழல்கள் திறந்தவையாக வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. இறைவனைச் சுட்டும் ‘உமது’ என்ற மரியாதை வடிவம் பயன்படுத்தப்பட்டது; இரண்டு எபிரெய வினைகளின் தனித்த வலிமையைப் பாதுகாக்க ‘நசுக்குகிறார்கள்’ மற்றும் ‘துன்புறுத்துகிறார்கள்’ என வேறுபடுத்தப்பட்டது.
