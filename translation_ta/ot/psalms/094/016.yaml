- source_word: יָקוּם
  choice: எழுந்து நிற்பவர்
  rationale: קום என்பதன் கால் முற்றுப்பெறா வடிவம் எதிர்ப்பதற்காக எழுதல் அல்லது முன்வந்து நிற்றல் என்ற உயிரோட்டமான படிமத்தைக் கொண்டுள்ளது; ‘எழுந்து நிற்பவர்’ அதை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לִי
  choice: எனக்காக
  rationale: ל இங்கு திசையை அல்ல, ஒருவரின் நலனுக்காக அல்லது சார்பாகச் செயல்படுவதைச் சுட்டுகிறது.
- source_word: עִם
  choice: எதிர்த்து
  rationale: עִם என்பதன் அடிப்படைப் பொருள் ‘உடன்’; ஆனால் தீமை செய்பவர்களோடு மோதும் இச்சூழலில் எதிர்நிற்றல் என்ற உறவைக் குறிக்கிறது. தமிழில் ‘எதிர்த்து’ அந்தச் சூழல்பொருளைத் தெளிவாகத் தருகிறது.
- source_word: מְרֵעִים
  choice: தீமை செய்கிறவர்கள்
  rationale: தீமை புரிபவர்களைக் குறிக்கும் பங்கேற்பு வடிவம்; ‘தீமை செய்கிறவர்கள்’ நவீன வாசகர்களுக்கு நேரடியாகவும் இயல்பாகவும் உள்ளது.
- source_word: יִתְיַצֵּב
  choice: நிலைத்து நிற்பவர்
  rationale: יצב என்பதன் ஹித்பயேல் வடிவம் உறுதியாகத் தன் நிலையை எடுத்துக்கொண்டு நிற்பதைக் குறிக்கிறது; முதல் அடியின் ‘எழுந்து நிற்பவர்’ என்பதுடன் இணைத்தன்மையையும் வேறுபட்ட நுணுக்கத்தையும் இது காக்கிறது.
- source_word: פֹּעֲלֵי אָוֶן
  choice: அக்கிரமம் செய்கிறவர்கள்
  rationale: தீய அல்லது அநீதியான செயலைத் தொடர்ந்து புரிபவர்களைக் குறிக்கும் எபிரெயச் சொற்றொடர்; ‘அக்கிரமம் செய்கிறவர்கள்’ அதன் ஒழுக்கப் பாரத்தையும் செயற்பாட்டு தன்மையையும் காக்கிறது.
- source_word: אָוֶן
  choice: அக்கிரமம்
  rationale: אָוֶן தீமை, அநீதி, கேடு அல்லது துன்பம் ஆகிய பொருட்களை ஏற்கலாம். இங்கு ‘செய்கிறவர்கள்’ என்பதோடு இணைவதால் ஒழுக்கரீதியான தீச்செயல் முன்னிலையாகிறது; ‘அக்கிரமம்’ அந்தப் பொருளைத் தருகிறது.
