  text: הֲ/נֹ֣טַֽע אֹ֭זֶן הֲ/לֹ֣א יִשְׁמָ֑ע אִֽם יֹ֥צֵֽר עַ֝֗יִן הֲ/לֹ֣א יַבִּֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/009.yaml
  text: He who planted the ear[a], does he not hear? He who formed the eye[b], does he not see?
translation:
  language: ta
  text: செவியை நட்டவர்[a] கேட்கமாட்டாரா? கண்ணை உருவாக்கியவர்[b] காணமாட்டாரா?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘செவியைப் பதித்தவர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘நட்டவர்’; இது படைப்பை உயிரோட்டமான உருவகத்தில் கூறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘கண்ணை வடிவமைத்தவர்’ என்றும் மொழிபெயர்க்கலாம். இறுதி வினைச்சொல் இன்னும் நேரடியாக ‘நோக்குதல்’ அல்லது ‘உற்றுப்பார்த்தல்’ எனப் பொருள்படலாம்; இங்கு அது பார்வையாற்றலைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטַע
  choice: நட்டவர்
  rationale: எபிரெயச் சொல் நேரடியாக ‘நடுதல்’ என்பதைக் குறிக்கிறது. படைப்பாளர் செவியை மனிதனில் பதித்தார் என்ற உயிரோட்டமுள்ள உருவகத்தைத் தட்டையாக்காமல் காக்க ‘உருவாக்கியவர்’ என்பதற்குப் பதிலாக ‘நட்டவர்’ பயன்படுத்தப்பட்டது.
- source_word: אֹזֶן
  choice: செவி
  rationale: உடல் உறுப்பான ‘ear’ என்பதே இங்குள்ள நேரடிப் பொருள். எபிரெய ஒருமையும் ‘கண்’ என்பதுடனான கவிதை இணையும் காக்கப்பட்டுள்ளன.
- source_word: יִשְׁמָע
  choice: கேட்கமாட்டாரா
  rationale: இங்கு கீழ்ப்படிதல் அல்லது கவனித்துக் கேட்டல் அல்ல, கேட்கும் ஆற்றலே கருத்து. எதிர்மறை வினாவுடன் இயல்பான தமிழில் உறுதியான ஆம் விடையை எதிர்பார்க்கும் வடிவம் பயன்படுத்தப்பட்டது.
- source_word: יֹצֵר
  choice: உருவாக்கியவர்
  rationale: இந்த வினை வடிவமைத்தல் அல்லது உருவாக்குதல் என்ற நோக்கமுள்ள படைப்புச் செயலைக் குறிக்கிறது. ‘உருவாக்கியவர்’ என்பது நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் அந்தக் கருத்தைத் தருகிறது.
- source_word: עַיִן
  choice: கண்
  rationale: உடல் உறுப்பான கண்ணே அடிப்படைப் பொருள். செவியுடனான கவிதைச் சமநிலைக்காக ஒருமை காக்கப்பட்டது.
- source_word: יַבִּיט
  choice: காணமாட்டாரா
  rationale: இந்த வினை ‘நோக்குதல்’, ‘உற்றுப்பார்த்தல்’ என நேரடியாகப் பொருள்படலாம். ஆனால் இங்கு உருவாக்கப்பட்ட கண்ணுக்கேற்ற பார்வையாற்றலே வாதத்தின் மையம்; எனவே ‘காணமாட்டாரா’ என்பது தமிழில் இயல்பான இணைப்பை உருவாக்குகிறது.
- source_word: הֲ...הֲלֹא
  choice: …மாட்டாரா?
  rationale: வினாத்துகளும் மறுப்பும் உறுதியான ஆம் விடையை எதிர்பார்க்கும் சொல்லாட்சியை உருவாக்குகின்றன. தமிழின் எதிர்மறை வினாவடிவம் அந்த வலிமையையும் வினாத்தன்மையையும் காக்கிறது.
- source_word: אִם
  choice: இரண்டாம் இணை வினாவாக அமைத்தல்
  rationale: இங்கு אִם நிபந்தனையை முதன்மையாகக் காட்டாமல், இணையான இரண்டாம் சொல்லடுக்கை அறிமுகப்படுத்துகிறது. தனியான ‘என்றால்’ என்பதைக் கூட்டாமல் இரு வினாக்களாக அமைப்பது எபிரெயக் கவிதை இணைப்பை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தேவனுடைய கேட்டல் மற்றும் காணுதலை மனித உறுப்புகளின் மொழியில் கூறுதல்
  choice: செவியையும் கண்ணையும் படைத்தவரைப் பற்றிய மூலத்தின் உருவக வினாக்களை அப்படியே காத்தல்
  alternative: ‘கேள்வியையும் பார்வையையும் அளித்தவர் நிச்சயமாக அனைத்தையும் உணர்கிறார்’ என்று கருத்தை விளக்கிப் பொழிப்புரை செய்தல்
  rationale: மனிதரின் உணர்வுறுப்புகளைப் படைத்தவர் கேட்கிறவரும் காண்கிறவருமாய் இருக்கிறார் என்பதே சங்கீதத்தின் வாதம். அதைச் சுருக்கி விளக்காமல், செவி மற்றும் கண் என்ற உருவகங்களும் அவற்றின் இறையியல் அழுத்தமும் நிலைத்திருக்க விடப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டது. ‘செவியை நட்டவர்’ என்ற வழக்கமல்லாத ஆனால் புரிந்துகொள்ளக்கூடிய உருவகம் மூலத்தின் கவித்துவப் படிமத்தைக் காக்கிறது; இணையான இரு எதிர்மறை வினாக்கள் எபிரெயச் சொல்லடுக்கின் வாத வலிமையைத் தக்கவைக்கின்றன.
