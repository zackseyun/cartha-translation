  yaml_path: translation/ot/psalms/094/017.yaml
  text: If Yahweh had not been my help[b][a], my soul would soon have dwelt in silence.
translation:
  language: ta
  text: 'யாவே எனக்குத் துணையாக இருந்திருக்காவிட்டால்,

    என் உயிர்[a] விரைவிலேயே மௌனத்தில்[b] குடியிருந்திருக்கும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் ஆத்துமா’ அல்லது ‘என் சுயம்.’ ‘உயிர்’ என மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ஒருவரின் உயிரையோ சுயத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘மௌனம்’ என்பது மரணத்தின் அல்லது பாதாளத்தின் மௌனத்தைக் குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵי
  choice: இருந்திருக்காவிட்டால்
  rationale: இறந்தகாலத்தில் நிகழாத ஒரு நிபந்தனையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயரால் மாற்றப்படாமல், எபிரெய இறைப்பெயரின் பொதுவான தமிழ் ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: עֶזְרָתָה לִּי
  choice: எனக்குத் துணையாக
  rationale: யாவே சங்கீதக்காரருக்கு உதவுகிறவர் என்ற உடைமை மற்றும் உறவுப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כמעט
  choice: விரைவிலேயே
  rationale: தொடர்ந்து வரும் நிறைவேற்ற வினையுடன், அந்த முடிவு உடனடியாக நேரிடவிருந்ததை இங்கு குறிக்கிறது; ‘கிட்டத்தட்ட’ என்பதும் சொற்பொருள் சார்ந்த சாத்தியமாகும்.
- source_word: שכנה
  choice: குடியிருந்திருக்கும்
  rationale: שׁכן என்பதிலுள்ள குடியிருத்தல் அல்லது தங்கியிருத்தல் என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: דומה
  choice: மௌனம்
  rationale: சொல்லின் நேரடிப் பொருளான ‘மௌனம்’ என்பதைக் காக்கிறது; மரணம் அல்லது பாதாளத்தின் மௌனம் என்ற உட்குறிப்பு அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: נפשי
  choice: என் ஆத்துமா
  rationale: எபிரெயக் கவிதையின் மனிதரைக் குறிக்கும் உருவகத்தைப் பாதுகாக்கிறது; ‘என் உயிர்’ என்ற பொருளும் சாத்தியமானதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: דומה என்பதில் மரணம் அல்லது பாதாளம் குறித்த உட்குறிப்பை வெளிப்படையாக்க வேண்டுமா
  choice: முதன்மை உரையில் ‘மௌனம்’ என்ற நேரடிப் பொருளை வைத்தல்
  alternative: மரணத்தின் மௌனம்; பாதாளம்; மரணம்
  rationale: இந்தச் சொல் மரணத்தைச் சுட்டக்கூடும்; ஆனால் எபிரெய உரை நேரடியாக ‘மௌனம்’ என்றே கூறுகிறது. ஆகவே குறிப்பிட்ட மறுமைநிலைக் கருத்தை உரைக்குள் சேர்க்காமல், உட்குறிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘குடியிருந்திருக்கும்’ என்பது மூலத்தின் இருப்பிடம் சார்ந்த உருவகத்தைக் காக்கிறது; அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்களுக்குப் பின்னர் வைக்கப்பட்டுள்ளன.
