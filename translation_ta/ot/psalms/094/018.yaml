source:
  edition: WLC
  text: אִם אָ֭מַרְתִּי מָ֣טָה רַגְלִ֑/י חַסְדְּ/ךָ֥ יְ֝הוָ֗ה יִסְעָדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/018.yaml
  text: When I said, “My foot is slipping,” your steadfast love, O LORD, upheld me.
translation:
  language: ta
  text: '“என் கால் சறுக்குகிறது” என்று நான் சொன்னபோது,

    ஆண்டவரே, உமது மாறாத அன்பு என்னைத் தாங்கியது.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: என்று நான் சொன்னபோது
  rationale: אִם என்பதன் அடிப்படைப் பொருள் ‘என்றால்’ என்றாலும், இங்கு அனுபவிக்கப்பட்ட ஒரு தருணத்தை அறிமுகப்படுத்துவதால் இயல்பான தமிழில் ‘சொன்னபோது’ என்று மொழிபெயர்க்கப்பட்டது; ஆங்கில ஆலோசனை உரையின் ‘When’ என்பதுடனும் இது ஒத்துள்ளது.
- source_word: מָטָה רַגְלִי
  choice: என் கால் சறுக்குகிறது
  rationale: מוט் என்பது நிலைதவறுதல், தடுமாறுதல் அல்லது சறுக்குதல் என்ற கருத்தைக் கொண்டது. சங்கீதத்தின் உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் காக்க ‘சறுக்குகிறது’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: חַסְדְּךָ
  choice: உமது மாறாத அன்பு
  rationale: חֶסֶד என்பது உடன்படிக்கைச் சூழலில் உண்மையுள்ள, நிலைத்த அன்பைச் சுட்டுகிறது. எந்த ஒரு குறிப்பிட்ட கோட்பாட்டு விளக்கத்தையும் திணிக்காமல் அதன் நிலைத்த தன்மையை ‘மாறாத அன்பு’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: ஆண்டவரே
  rationale: தெய்வீக நாமத்திற்கான மரியாதைமிக்க, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ் வடிவம்; அழைப்புவேற்றுமையை எபிரெயச் சொற்றொடரின் நேரடி அழைப்புக்கு ஏற்பக் காக்கிறது.
- source_word: יִסְעָדֵנִי
  choice: என்னைத் தாங்கியது
  rationale: סעד என்பது ஆதரித்தல் அல்லது தாங்குதல். கால் சறுக்கும் உருவகத்துடன் இயல்பாக இணைவதால் ‘தாங்கியது’ பயன்படுத்தப்பட்டது.
theological_decisions:
- issue: חֶסֶד என்பதன் இறையியல் நிறை
  choice: மாறாத அன்பு
  alternative: உடன்படிக்கை அன்பு / கிருபை
  rationale: ‘மாறாத அன்பு’ என்பது கடவுளின் உண்மையையும் நிலைத்த அன்பையும் தெரிவிக்கிறது; ‘உடன்படிக்கை’ என்ற சொல்லை மூலத்தில் வெளிப்படையாக இல்லாத இடத்தில் சேர்ப்பதையும், ‘கிருபை’ வழியாக பிற்கால கோட்பாட்டு அர்த்தத்தை மட்டும் முன்னிறுத்துவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமான இருவரி அமைப்பும் மரியாதை ஒருமை வடிவமும் பயன்படுத்தப்பட்டுள்ளன. மொழிநடை எளிமையானதாயும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் உள்ளது.
