  source_fidelity: மூல எபிரெயத்தின் இருமுறை வரும் עַד־מָתַי (‘எதுவரை?’), רְשָׁעִים (‘தீயவர்கள்’), யְהוָה (‘யாவே’), மற்றும் יַעֲלֹזוּ (‘களிகூருவார்கள்’) ஆகியவை துல்லியமாகப் பிரதிபலிக்கப்படுகின்றன. முதல் கூற்றின் நோக்கமுள்ள முழுமையற்ற முறையீடு தமிழிலும் பாதுகாக்கப்பட்டுள்ளது.
  naturalness: “யாவே, தீயவர்கள் எதுவரை?” என்பது வழக்கமான உரைநடை முழுவாக்கியம் அல்ல; ஆனால் சங்கீதப் புலம்பலின் அழுத்தமான, கவிதைநயமுள்ள முழுமையற்ற வினாவாக இயல்பாகச் செயல்படுகிறது. இரண்டாம் வினா தெளிவாகவும் நவீனத் தமிழில் வாசிக்கத்தக்கதாகவும் உள்ளது.
  terminology: ‘யாவே’ இறைப்பெயரை நேரடியாகத் தருகிறது; ‘தீயவர்கள்’ கூட்டுப் பொருளையும், ‘களிகூருவார்கள்’ எதிர்மறைச் சூழலில் உள்ள மிகுந்த/வெற்றிக்களிப்பின் நுணுக்கத்தையும் நன்றாகக் காக்கின்றன.
