lexical_decisions:
- source_word: עַד מָתַי
  choice: எதுவரை
  rationale: புலம்பலிலும் வேண்டுதலிலும் கால நீடிப்பைக் குறித்து எழுப்பப்படும் அவசரமான கேள்வியை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: தீமை செய்கிறவர்களைக் கூட்டாகக் குறிக்கும் பன்மை பெயரடைப் பயன்பாட்டை எளிமையாகவும் தெளிவாகவும் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: மூலத்தில் உள்ள இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துத் தருகிறது.
- source_word: יַעֲלֹזוּ
  choice: களிகூருவார்கள்
  rationale: சாதாரண மகிழ்ச்சியைவிட மிகுந்த, வெளிப்படையான வெற்றிக்களிப்பை உணர்த்தும் எபிரெய வினையின் வலிமையைத் தக்கவைக்கிறது.
- source_word: repetition of עַד מָתַי רְשָׁעִים
  choice: தீயவர்கள் எதுவரை? தீயவர்கள் எதுவரை
  rationale: மூலத்தின் வேண்டுமென்றே அமைக்கப்பட்ட மறுபடியுரைத்தலையும், சங்கீதக்காரரின் தீவிரமான முறையீட்டையும் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: வசனம் தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- issue: முதல் ‘எதுவரை?’ என்பதின் விடுபட்ட வாக்கிய அமைப்பு
  choice: தீயவர்கள் எதுவரை?
  alternative: தீயவர்கள் எதுவரை இப்படியே இருப்பார்கள்?
  rationale: மூல எபிரெயத்தில் முதல் கூற்று திட்டமிட்ட உணர்ச்சிமிக்க விடுபட்ட அமைப்பாக உள்ளது; அதை விளக்கச் சொற்கள் சேர்த்து மறைமுகமாகத் தீர்க்காமல் தமிழிலும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்குப் புரியும் சொற்களுடன் கவிதைநயமும் முறையீட்டின் தீவிரமும் காக்கப்பட்டுள்ளன. மூலத்தின் மறுபடியுரைத்தலும் முதல் கேள்வியின் விடுபட்ட அமைப்பும் திட்டமிட்டே தக்கவைக்கப்பட்டுள்ளன.
