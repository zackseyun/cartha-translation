  text: They band together against the life of the righteous[b][a], and they condemn innocent blood.
translation:
  language: ta
  text: நீதிமானின் உயிருக்கு எதிராக அவர்கள் கூட்டாகத் திரள்கிறார்கள்; குற்றமற்ற இரத்தத்தைக் குற்றவாளி என்று அறிவிக்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָגוֹדּוּ
  choice: கூட்டுச் சேர்கிறார்கள்
  rationale: גדד என்பதன் கால் வடிவம் ஒரு கூட்டமாகத் திரளுதல் அல்லது ஒருங்கிணைந்து தாக்குதல் என்ற பொருளைக் கொள்ளலாம். עַל உடன் வரும் பகைமைச் சூழலில், இராணுவப் படிமத்தை அளவுக்கு மீறி வலியுறுத்தாமல் hostile collective action-ஐ ‘கூட்டுச் சேர்கிறார்கள்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: எதிராக
  rationale: பகைமைச் செயலைக் குறிக்கும் வினையுடன் עַל எதிர்ப்பைச் சுட்டுவதால் ‘எதிராக’ என்பது பொருத்தமானது.
- source_word: נֶפֶשׁ
  choice: உயிர்
  rationale: இங்கு נֶפֶשׁ அச்சுறுத்தலுக்குள்ளான நீதிமானின் உயிரையோ நபரையோ குறிக்கிறது. அடுத்த அடியின் ‘குற்றமற்ற இரத்தம்’ என்பதுடன் ‘உயிர்’ இயல்பாக இணைந்து, வெறும் ஆன்மீகப் பொருளாக்கத்தைத் தவிர்க்கிறது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: ஒருமை பெயரடையான צַדִּיק இங்கு பெயர்ச்சொல்லாகப் பயன்பட்டு நீதியுள்ள ஒருவரைக் குறிக்கிறது. ‘நீதிமான்’ தமிழில் இயல்பான வேதாகம மரியாதைநடையைத் தக்கவைத்து எபிரெய ஒருமையையும் பிரதிபலிக்கிறது.
- source_word: דָם נָקִי
  choice: குற்றமற்ற இரத்தம்
  rationale: இந்தச் சொற்றொடர் சொற்சார்பாக ‘குற்றமற்ற இரத்தம்’ என்பதாகும். இது வன்முறை மற்றும் நீதித்துறை சார்ந்த உயிரோட்டமான படிமத்தைப் பாதுகாக்கிறது.
- source_word: יַרְשִׁיעוּ
  choice: குற்றவாளி என்று தீர்க்கிறார்கள்
  rationale: רשע என்பதன் ஹிஃபில் வடிவம் ஒருவரைக் குற்றவாளி என அறிவித்தல் அல்லது தண்டனைக்குரியவர் எனத் தீர்த்தல் என்று பொருள்படும். நேரடி பொருளாக ‘இரத்தம்’ வருவதால், ‘கண்டிக்கிறார்கள்’ என்பதைவிட ‘குற்றவாளி என்று தீர்க்கிறார்கள்’ நீதித்துறைப் பொருளையும் எபிரெயின் திட்டமிட்ட முரண்பாட்டையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: צַדִּיק என்பதிலுள்ள பிரதிநிதித்துவ ஒருமை
  choice: நீதிமான்
  alternative: நீதியுள்ள ஒருவர் / நீதிமான்கள்
  rationale: எபிரெயச் சொல் இலக்கண ரீதியாக ஒருமையில் இருந்தாலும் ஒரு வகுப்பின் பிரதிநிதியாகவும் அமையலாம். தமிழில் ‘நீதிமான்’ ஒருமையைப் பாதுகாக்கிறது; வசனத்தை ஒரு குறிப்பிட்ட வரலாற்று நபருக்கு மட்டும் கட்டுப்படுத்தவில்லை.
- issue: குற்றமற்ற இரத்தத்தை ‘குற்றவாளி’ எனத் தீர்ப்பதிலுள்ள நீதித்துறை முரண்
  choice: முரண்பாட்டை நேரடியாகப் பாதுகாத்தல்
  alternative: குற்றமற்றவர்களுக்கு மரணத் தீர்ப்பளிக்கிறார்கள்
  rationale: மாற்று வாசகம் உட்கருத்தை விளக்கினாலும், மூலத்தில் நேரடி பொருளாக வரும் ‘இரத்தம்’ என்ற படிமத்தையும் அதைக் ‘குற்றவாளி’ என அறிவிக்கும் கூர்மையான பதற்றத்தையும் குறைத்துவிடும். ஆகவே மூல உருவகமும் நீதித்துறை மொழியும் தக்கவைக்கப்பட்டன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘கூட்டுச் சேர்கிறார்கள்’ என்பது சதிச் சேர்க்கையையும் ஒருங்கிணைந்த பகைமையையும் வெளிப்படுத்துகிறது; ‘குற்றவாளி என்று தீர்க்கிறார்கள்’ என்பது மூலத்தின் நீதித்துறைத் தொனியையும் ‘குற்றமற்ற இரத்தம்’ உடனான திட்டமிட்ட முரண்பாட்டையும் காக்கிறது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
