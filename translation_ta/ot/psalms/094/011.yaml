  text: The LORD knows the thoughts of man, that they are vapor.
translation:
  language: ta
  text: மனிதரின் எண்ணங்களை ஆண்டவர் அறிவார்—அவை வெறும் நீராவியே.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: இறைவனின் தனிப்பெயரைக் குறிக்கும் எபிரெயச் சொல்லுக்கு, நவீனத் தமிழில் இயல்பாகவும் மரியாதையாகவும் புரியும் தலைப்புச் சொல் பயன்படுத்தப்பட்டது.
- source_word: מַחְשְׁבוֹת אָדָם
  choice: மனிதரின் எண்ணங்கள்
  rationale: מַחְשְׁבוֹת என்பது எண்ணங்கள் அல்லது சிந்தனைகள்; אָדָם இங்கு மனிதகுலத்தைப் பொதுவாகக் குறிக்கும் ஒருமை வடிவம். பொதுப்பொருளைத் தக்கவைக்கும் வகையில் ‘மனிதரின்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הֶבֶל
  choice: வெறும் நீராவி
  rationale: இச்சொல்லின் அடிப்படை உருவகம் நீராவி/மூச்சு போன்ற நிலையற்ற, பிடிக்க முடியாத ஒன்றாகும். ‘வீண்’ என்று மட்டும் கூறி உருவகத்தை மறைக்காமல், மூலத்தின் படிமமும் நிலையாமை குறித்த உட்பொருளும் தக்கவைக்கப்பட்டன.
- source_word: כִּי
  choice: —
  rationale: இங்கு כִּי, ஆண்டவர் அறிந்திருப்பதன் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் கோடு பயன்படுத்தி அடுத்த கூற்றை நேரடியாக இணைப்பது இயல்பாகவும், ‘என்று’ அல்லது ‘ஏனெனில்’ எனப் பொருளை மிகத் துல்லியமாக முடிவுசெய்யாமல் இருக்கவும் உதவுகிறது.
theological_decisions:
- issue: மனித எண்ணங்களைப் பற்றிய הֶבֶל உருவகத்தின் பொருள்
  choice: ‘நீராவி’ என்ற மூல உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘வீணானவை’, ‘மாயை’, அல்லது ‘பயனற்றவை’
  rationale: மூலச்சொல் நிலையாமை, கணநேரத் தன்மை, வெறுமை, பயனின்மை ஆகிய பல நிழற்பொருள்களைக் கொண்டது. ஒரே விளக்கப் பொருளாகச் சுருக்காமல் அதன் திறந்த உருவகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையான, கண்ணியமான சங்கீத நடையைப் பேணுகிறது. கோடு இரண்டாம் கூற்றை வலியுறுத்தி, எபிரெயத் தொடரின் சுருக்கத்தையும் காக்கிறது.
