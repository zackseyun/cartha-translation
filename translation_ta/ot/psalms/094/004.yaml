translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. முதல் வினையின் பொங்கி வெளிவரும் படிமம் ‘வார்த்தைகளைக் கொட்டுகிறார்கள்’ என்று இயல்பாக்கப்பட்டுள்ளது; மூன்று இணையான செயல்களையும் அரைப்புள்ளிகள் பிரிக்கின்றன.
