  text: יַבִּ֣יעוּ יְדַבְּר֣וּ עָתָ֑ק יִֽ֝תְאַמְּר֗וּ כָּל פֹּ֥עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/004.yaml
  text: They gush forth[a]; they speak arrogantly[b]; all the workers of wickedness boast.
translation:
  language: ta
  text: அவர்கள் வார்த்தைகளைப் பொழிகிறார்கள்[a]; இறுமாப்பாகப் பேசுகிறார்கள்[b]; தீமை செய்கிற அனைவரும் தற்பெருமை பேசுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் பொங்கிப் பேசுகிறார்கள்.’ எபிரெயத்தில் ‘வார்த்தைகள்’ என்று வெளிப்படையாக இல்லை; அடுத்துள்ள ‘பேசுகிறார்கள்’ என்பதன் சூழலிலிருந்து அது சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘இறுமாப்பானவற்றைப் பேசுகிறார்கள்.’
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: יַבִּיעוּ
  choice: வார்த்தைகளைக் கொட்டுகிறார்கள்
  rationale: நבע என்பதன் ஹிஃபில் வடிவம் ‘பொங்கச் செய்தல், பெருக்கெடுத்து வெளிப்படுத்துதல்’ என்ற படிமத்தைக் கொண்டது. அடுத்துள்ள ‘பேசுகிறார்கள்’ என்பதன் அடிப்படையில் மறைந்துள்ள பொருளாகிய ‘வார்த்தைகள்’ என்பதைத் தமிழில் வெளிப்படுத்துவது இயல்பாகவும் கவித்துவப் படிமத்தைப் பேணுவதாகவும் உள்ளது.
- source_word: יְדַבְּרוּ
  choice: பேசுகிறார்கள்
  rationale: דבר என்பதற்கான நேரான, இயல்பான தமிழ் இணை; முந்தைய வினையுடன் உள்ள கவிதை இணைநிலையையும் காக்கிறது.
- source_word: עָתָק
  choice: இறுமாப்புடன்
  rationale: இந்தச் சொல் ஆணவம், திமிர், அவமதிப்பான துணிச்சல் ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘பேசுகிறார்கள்’ என்பதுடன் வினையடை வடிவில் இணைப்பது நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יִתְאַמְּרוּ
  choice: தற்பெருமை பேசுகிறார்கள்
  rationale: ஹித்பாயேல் வடிவம் தங்களையே உயர்த்திக்கொள்ளும் பெருமிதத்தைச் சுட்டுகிறது. சூழலின் பேச்சு சார்ந்த இணைநிலைக்கேற்ப ‘தற்பெருமை பேசுகிறார்கள்’ என்பது தற்புகழ்ச்சியையும் ஆணவத்தையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: அனைவரும்
  rationale: எபிரெயச் சொல்லின் முழுமையான, விதிவிலக்கற்ற பரப்பை இயல்பான தமிழில் தருகிறது.
- source_word: פֹּעֲלֵי אָוֶן
  choice: தீமை செய்கிறவர்கள்
  rationale: ‘தீமை/அக்கிரமத்தைச் செய்பவர்கள்’ என்ற எபிரெயக் கட்டமைப்பைத் தெளிவாகவும் சாதாரண வாசகர்களுக்கு இயல்பாகவும் வழங்குகிறது.
