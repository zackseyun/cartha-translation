  yaml_path: translation/ot/psalms/094/014.yaml
  text: For Yahweh will not forsake his people[b][a]; he will not abandon his inheritance.
translation:
  language: ta
  text: ஏனெனில், யாவே தமது மக்களைக் கைவிடமாட்டார்[a]; தமது சுதந்தரத்தை[b] விட்டுவிடமாட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கைவிடமாட்டார்’ என்பதற்கு ‘ஒதுக்கிவிடமாட்டார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘சுதந்தரம்’ என்பதற்கு ‘பரம்பரைச் சொத்து’, ‘மரபுரிமை’, அல்லது ‘உரிமையான உடைமை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள கூற்றுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: יִטֹּשׁ
  choice: கைவிடமாட்டார்
  rationale: נטשׁ என்பதன் கைவிடுதல், தள்ளிவிடுதல், புறக்கணித்தல் ஆகிய பொருள் எல்லையை இங்கு இயல்பாகவும் வலிமையாகவும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் இறைப்பெயரை ஒரு பொதுப் பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: עַמּוֹ
  choice: தமது மக்கள்
  rationale: உடன்படிக்கை சார்ந்த உறவுணர்வுடன் ‘அவருடைய மக்கள்’ என்ற பொருளை மரியாதையான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: נַחֲלָתוֹ
  choice: தமது உரிமைச்சொத்து
  rationale: נַחֲלָה என்பதிலுள்ள பங்காகக் கிடைத்த சொத்து, உரிமையான உடைமை, சுதந்தரம் ஆகிய உருவகங்களை ‘உரிமைச்சொத்து’ தெளிவாகக் காக்கிறது.
- source_word: יַעֲזֹב
  choice: விட்டுவிடமாட்டார்
  rationale: עזב என்பதன் விட்டுச் செல்லுதல் அல்லது கைவிடுதல் என்ற பொருளைத் தருவதோடு, முதல் அரையடியின் வினைச்சொல்லை அப்படியே மீண்டும் கூறாமல் எபிரெய இணைநிலையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக இருப்பதால், அதைப் பொதுப் பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் உடன்படிக்கைச் சூழலைக் காக்கிறது.
- issue: נַחֲלָתוֹ என்பதன் உடன்படிக்கை சார்ந்த உருவகம்
  choice: தமது உரிமைச்சொத்து
  alternative: தமது சுதந்தரம்
  rationale: மக்கள் யாவேக்குரிய ஒதுக்கப்பட்ட உடைமை என்ற உருவகத்தைப் பாதுகாக்கிறது; அதேவேளை, தமிழில் ‘சுதந்தரம்’ என்பதனால் ஏற்படக்கூடிய ‘அவர் பெற்ற வாரிசுச் சொத்து’ என்ற தேவையற்ற எண்ணத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியக்கூடியதாயும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. இணையான இரு அரையடிகளிலும் உள்ள ‘கைவிடுதல்/விட்டுவிடுதல்’ வேறுபாடு காக்கப்பட்டுள்ளது.
