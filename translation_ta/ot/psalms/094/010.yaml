lexical_decisions:
- source_word: יֹסֵר
  choice: ஒழுக்கப்படுத்துகிறவர்
  rationale: יסר என்பது வெறும் தண்டனையை அல்ல, அதிகாரத்தோடு திருத்தி நல்வழிப்படுத்தும் ஒழுக்க நடவடிக்கையைக் குறிக்கிறது. ‘ஒழுக்கப்படுத்துகிறவர்’ அந்தத் திருத்தும் மற்றும் தண்டிக்கும் இரு நுணுக்கங்களையும் தக்கவைக்கிறது.
- source_word: גּוֹיִם
  choice: நாடுகளை
  rationale: இங்கு גּוֹיִם பொதுவாக நாடுகள் அல்லது மக்களினங்களைக் குறிக்கிறது; குறிப்பாக யூதரல்லாதவர்களை மட்டும் குறிக்கவில்லை. ‘நாடுகள்’ சங்கீதச் சூழலுக்கு இயல்பான தேர்வு.
- source_word: יוֹכִיחַ
  choice: கண்டிக்கமாட்டாரா
  rationale: Hiphil வடிவிலுள்ள יכח குற்றத்தை எடுத்துக்காட்டிக் கண்டித்தல் அல்லது திருத்துதல் என்ற பொருளைக் கொண்டது. எதிர்மறை வினாவுடன் ‘கண்டிக்கமாட்டாரா’ என்பது எதிர்பார்க்கப்படும் உறுதியான பதிலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַמְלַמֵּד
  choice: கற்பிக்கிறவர்
  rationale: இந்தப் பங்கேற்புவினை பெயர்ச்சொல்லாகச் செயல்பட்டு, கடவுளை அவர் செய்கிற செயலால் விவரிக்கிறது. ‘கற்பிக்கிறவர்’ எபிரெய இணை அமைப்பைப் பேணுகிறது.
- source_word: אָדָם
  choice: மனிதனுக்கு
  rationale: אָדָם இங்கு தனிப்பட்ட ஓர் ஆணை அல்ல, மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்தும் ஒருமைச் சொல்லாக வருகிறது. ‘மனிதனுக்கு’ எபிரெய ஒருமை வடிவையும் பொதுமனிதப் பொருளையும் தமிழில் தக்கவைக்கிறது.
- source_word: דָּעַת
  choice: அறிவை
  rationale: דָּעַת என்பதன் நேரடியான பொருள் அறிவு அல்லது அறிதல். ‘அறிவைக் கற்பிக்கிறவர்’ என்பது தமிழில் தெளிவானதும் மூலத்துக்கு நெருக்கமானதும் ஆகும்.
- source_word: הֲ...הֲלֹא
  choice: கண்டிக்கமாட்டாரா … ?
  rationale: இணைந்த வினாத் துகள்கள் உறுதியான ‘ஆம்’ என்ற பதிலை எதிர்பார்க்கும் வினாவை உருவாக்குகின்றன. தமிழ் எதிர்மறை வினை வடிவம் இந்த வலியுறுத்தலை இயல்பாக எடுத்துரைக்கிறது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுமனிதப் பயன்பாடு
  choice: மனிதனுக்கு
  alternative: மனிதகுலத்துக்கு
  rationale: வசனம் கடவுள் மனிதர்களுக்கு பொதுவாக அறிவைக் கற்பிப்பதைச் சொல்கிறது; ஆயினும் எபிரெயம் பிரதிநிதித்துவ ஒருமையைப் பயன்படுத்துகிறது. முதன்மை உரை அந்த ஒருமையைப் பேணுகிறது; அடிக்குறிப்பு அதன் கூட்டுப்பொருளைத் தெளிவுபடுத்துகிறது.
- issue: இறுதி அரையடியின் இலக்கணத் திறந்தநிலை
  choice: ‘மனிதனுக்கு அறிவைக் கற்பிக்கிறவர்?’ என்று தனி வினைச்சொல் சேர்க்காமல் விடுதல்
  alternative: ‘மனிதனுக்கு அறிவைக் கற்பிக்கிறவர் அறியமாட்டாரா?’
  rationale: எபிரெய மூலத்தில் இறுதி அரையடிக்கு ‘அறிவார்’ போன்ற தனி முற்றுவினை இல்லை. கோடு வழியாக முன் வினாவுடன் இணைப்பது கவிதைச் சுருக்கத்தையும் உண்மையான இலக்கணத் திறந்தநிலையையும் காக்கிறது; மூலத்தில் இல்லாத கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் சாதாரண வாசகருக்குப் புரியும் நடையிலும் அமைக்கப்பட்டுள்ளது. நீண்ட கோடு எபிரெயத்தின் இணை அமைப்பையும் இறுதி அரையடியின் முற்றுவினையற்ற சுருக்கத்தையும் வெளிப்படுத்துகிறது.
