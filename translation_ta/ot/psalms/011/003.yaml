source:
  edition: WLC
  text: כִּ֣י הַ֭/שָּׁתוֹת יֵֽהָרֵס֑וּ/ן צַ֝דִּ֗יק מַה פָּעָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/003.yaml
  text: If the foundations are destroyed[a], what can the righteous do?
translation:
  language: ta
  text: அஸ்திவாரங்கள் இடிக்கப்படுமானால்[a], நீதிமான் என்ன செய்ய முடியும்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏனெனில் அஸ்திவாரங்கள் இடிக்கப்படுகின்றன; நீதிமான் என்ன செய்திருக்கிறான்?” கடைசி எபிரெய வினைச்சொல்லை நிறைவுற்ற அல்லது இறந்தகாலப் பொருளில் மொழிபெயர்க்க முடியும்; ஆனால் சூழலில் அது பொதுவாக “நீதிமான் என்ன செய்ய முடியும்?” என்று புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: இடிக்கப்படுமானால்
  rationale: כִּי பொதுவாக ‘ஏனெனில்’ எனப் பொருள்படலாம்; ஆனால் இங்கு தொடர்ந்து வரும் வினாவுடன் இணைந்து நிபந்தனைப் பொருளை இயல்பாக அளிக்கிறது. தமிழில் ‘-மானால்’ அதனைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הַשָּׁתוֹת
  choice: அஸ்திவாரங்கள்
  rationale: சொல்லின் நேரடியான கட்டட உருவகத்தைப் பாதுகாக்கிறது; சமூக ஒழுங்கு, நீதி, அறநெறி போன்ற குறிப்பிட்ட விளக்கத்தை மொழிபெயர்ப்பில் திணிக்கவில்லை.
- source_word: יֵהָרֵסוּן
  choice: இடிக்கப்படுமானால்
  rationale: הרס என்பதன் நிஃபால் வடிவத்திலுள்ள செயப்பாட்டு உணர்வை ‘இடிக்கப்படு’ இயல்பாகத் தருகிறது; நிபந்தனைத் தொடருக்கு ஏற்றவாறு அமைக்கப்பட்டுள்ளது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: எபிரெய ஒருமைச் சொல்லின் பிரதிநிதித்துவப் பொதுப்பொருளைத் தக்கவைக்கும் மரியாதையான, தமிழில் நன்கு புரியும் சொல்.
- source_word: מַה
  choice: என்ன
  rationale: சொல்லின் நேரடியான வினாப் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: פָּעָל
  choice: செய்ய முடியும்
  rationale: வடிவில் இது நிறைவுற்ற செயலைக் குறிக்கும் qatal என்றாலும், சூழலில் எழும் நடைமுறை இயலாமையைச் சுட்டும் சொல்லாட்சியாக ‘செய்ய முடியும்’ இயல்பாக உள்ளது. முற்றிலும் இறந்தகால வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: ‘அஸ்திவாரங்கள்’ என்ற உருவகத்தின் வரம்பு
  choice: உருவகத்தை விளக்கித் தீர்மானிக்காமல் அப்படியே வைத்தல்
  alternative: சமூக அமைப்பு, நீதியின் அடித்தளம், அல்லது உடன்படிக்கை ஒழுங்கு என்று குறிப்பாக்குதல்
  rationale: எபிரெய உருவகம் பரந்த விளக்க இடத்தை அளிக்கிறது. ஒரு குறிப்பிட்ட சமூக அல்லது இறையியல் பொருளைத் திணிக்காமல் அதன் திறந்த தன்மையைப் பாதுகாக்கிறது.
- issue: פָּעָל என்பதன் காலமும் வினாவின் நோக்கமும்
  choice: ‘நீதிமான் என்ன செய்ய முடியும்?’ என்ற சூழல்சார் வாசிப்பு
  alternative: ‘நீதிமான் என்ன செய்திருக்கிறான்?’ என்ற நிறைவுற்றகால வாசிப்பு
  rationale: முந்திய நிபந்தனைக்குப் பின் வரும் சொல்லாட்சியாக இயலாமை குறித்த வினா சூழலோடு நன்றாகப் பொருந்துகிறது; இருப்பினும் எபிரெய வினைவடிவத்தின் இறந்த/நிறைவுற்றகால சாத்தியம் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான கவிதைநடையும் மரியாதையான வேதாகம நடையும் பேணப்பட்டுள்ளன. ‘அஸ்திவாரங்கள்’ என்ற பரவலாகப் புரியும் உருவகச் சொல் பயன்படுத்தப்பட்டுள்ளது; பாலினத்தைத் தனியே வலியுறுத்தாமல் பிரதிநிதித்துவ ஒருமையாக ‘நீதிமான்’ வைக்கப்பட்டுள்ளது.
