  yaml_path: translation/ot/psalms/011/006.yaml
  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: ta
  text: 'தீயவர்கள்மேல் அவர் கண்ணிகளை மழையாகப் பொழிவார்;

    நெருப்பும் கந்தகமும் கொளுத்தும் காற்றும்

    அவர்களுடைய கோப்பையின் பங்காக இருக்கும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּחִים
  choice: கண்ணிகள்
  rationale: இச்சொல்லின் வழக்கமான பொருள் பிடிப்பதற்கான கண்ணிகள்; 'கண்ணிகளை மழையாகப் பொழிவார்' என்ற மூல உருவகத்தையும் இயல்பான தமிழில் காக்கிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: ஒழுக்க ரீதியில் குற்றமுள்ளவர்களைக் குறிக்கும் எபிரெயச் சொல்லை நவீனத் தமிழில் தெளிவாகக் கொடுக்கிறது.
- source_word: גָפְרִית
  choice: கந்தகம்
  rationale: எரியும் தீர்ப்புக் காட்சியில் வரும் sulfur/brimstone என்பதற்கான நேரடியான, பொதுவாகப் புரியும் தமிழ் சொல்.
- source_word: רוּחַ זִלְעָפוֹת
  choice: கொளுத்தும் காற்று
  rationale: கடும் வெப்பத்தையும் அழிவுண்டாக்கும் தன்மையையும் தெரிவிக்கிறது; அரிதான எபிரெயச் சொல்லின் துல்லிய நிழல் குறித்து உள்ள ஐயத்தை மிகையாகத் தீர்மானிப்பதில்லை.
- source_word: מְנָת כּוֹסָם
  choice: அவர்களுடைய கோப்பையின் பங்கு
  rationale: ஒருவருக்குக் கோப்பையில் அளிக்கப்படும் விதிக்கப்பட்ட பங்கு என்ற எபிரெய உருவகத்தையும் அதன் தீர்ப்பு சார்ந்த இறையியல் அழுத்தத்தையும் காக்கிறது.
theological_decisions:
- issue: தெய்வீகத் தீர்ப்பின் நேரடி செயற்பாடு
  choice: “அவர் ... பொழிவார்” என நேரடியாக மொழிபெயர்க்கப்பட்டது.
  alternative: தீயவர்கள்மேல் இவை பெய்யும் என்று செயப்படுபொருள் வடிவில் மென்மைப்படுத்துதல்.
  rationale: மூலத்தில் இறைவனே வினையின் எழுவாய்; தீர்ப்பில் அவருடைய செயற்பாட்டை மறைக்காமல் காக்க வேண்டும்.
- issue: “கோப்பை” என்ற தீர்ப்பு உருவகம்
  choice: உருவகம் அப்படியே வைக்கப்பட்டது.
  alternative: “அவர்களுக்கு விதிக்கப்பட்ட தண்டனை” என விளக்கமாக மாற்றுதல்.
  rationale: கோப்பை உருவகம் வேதாகமப் பயன்பாட்டில் முக்கியமான இறையியல் பதற்றத்தைக் கொண்டது; அதை விளக்க மொழியாகக் கரைத்துவிடக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைநடையின் இணை அமைப்பை மூன்று அடிகளாகப் பேணியுள்ளோம். மொழிநடை கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதுமாக உள்ளது. “கொளுத்தும் காற்று” என்பது இயல்பான தமிழ்; “கோப்பையின் பங்கு” என்ற சற்றே அசாதாரணமான உருவகம் மூலத்தின் கவித்துவத்தையும் தீர்ப்புக் கருத்தையும் நோக்கமுடன் காக்கிறது.
