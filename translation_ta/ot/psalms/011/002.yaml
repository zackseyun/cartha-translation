revisions:
- from: ஏனெனில், இதோ, பொல்லாதவர்கள் வில்லை வளைக்கிறார்கள்; இருளில்[a] உள்ளத்தில் நேர்மையானவர்களை எய்வதற்காகத் தங்கள் அம்பை வில்நாணில் பொருத்தியிருக்கிறார்கள்.
