  yaml_path: translation/ot/psalms/011/002.yaml
  text: For look[a], the wicked bend the bow; they have fitted their arrow to the string to shoot in the darkness at the upright in heart.
translation:
  language: ta
  text: ஏனெனில், இதோ, பொல்லாதவர்கள் வில்லை வளைக்கிறார்கள்; நேர்மையான உள்ளம் உடையவர்கள்மேல் இருளில்[a] எய்வதற்காகத் தங்கள் அம்பை வில்நாணில் பொருத்தியிருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இருளிலிருந்து.’ தாக்குதல் இருண்ட சூழலில் நடப்பதையோ, மறைவிலிருந்து தொடுக்கப்படுவதையோ எபிரேயச் சொற்றொடர் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: உடனடியாக எதிர்நிற்கும் ஆபத்தின்மீது கவனத்தை ஈர்க்கும் எபிரேயச் சுட்டிடைச்சொல்லின் உயிரோட்டத்தை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: הָרְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: வெறுமனே சட்டப்படி குற்றவாளிகள் என்பதைக் காட்டிலும் ஒழுக்கக்கேடான எதிரிகளைக் குறிக்கும் சங்கீதப் பயன்பாட்டைப் பிரதிபலிக்கிறது.
- source_word: יִדְרְכוּן קֶשֶׁת
  choice: வில்லை வளைக்கிறார்கள்
  rationale: அம்பெய்ய வில்லை ஆயத்தப்படுத்தும் எபிரேய மரபுத்தொடரின் செயற்படிமத்தை இயல்பாகத் தெரிவிக்கிறது.
- source_word: כּוֹנְנוּ חִצָּם עַל יֶתֶר
  choice: தங்கள் அம்பை வில்நாணில் பொருத்தியிருக்கிறார்கள்
  rationale: ஒருமையில் உள்ள ‘அம்பு’ என்பதையும், அதை எய்வதற்காக நாணில் நிலைநிறுத்தும் திட்டமிட்ட ஆயத்தத்தையும் பாதுகாக்கிறது.
- source_word: לִירוֹת
  choice: எய்வதற்காக
  rationale: வில்வித்தைச் சூழலில் ירה என்பதன் நேரடியான பொருளையும் நோக்கத்தைக் குறிக்கும் infinitive அமைப்பையும் தருகிறது.
- source_word: בְּמוֹ אֹפֶל
  choice: இருளில்
  rationale: தாக்குதல் நடைபெறும் இருண்ட சூழலையோ மறைவையோ குறிக்கும் இயல்பான வாசிப்பை முதன்மைப்படுத்துகிறது; தொடக்கப்புள்ளியாக ‘இருளிலிருந்து’ என்றும் புரிந்துகொள்ளலாம் என்பதால் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לְיִשְׁרֵי לֵב
  choice: உள்ளத்தில் நேர்மையானவர்கள்
  rationale: உள்ளார்ந்த ஒழுக்க நேர்மையைச் சுட்டும் ‘இதயத்தில் செம்மையானவர்கள்’ என்ற எபிரேயக் கருத்தை சாதாரண நவீனத் தமிழில் தெளிவாகத் தருகிறது.
