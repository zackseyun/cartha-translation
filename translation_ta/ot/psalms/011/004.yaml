  source_fidelity: எபிரெய உரையின் இருமுறை வரும் யְהוָה, ஆலயம்–வானத்து அரியணை என்ற இணைநிலை, கண்கள்–இமைகள் என்ற மானுட உருவகம், மற்றும் בְּנֵי אָדָם-இன் கூட்டுப்பொருள் ஆகியவை வரைவு மொழிபெயர்ப்பில் பெரும்பாலும் நன்றாகக் காக்கப்பட்டுள்ளன. ஆனால் மூலத்திலும் ஆங்கில POB தீர்மானத்திலும் தனிப்பெயராகத் தேர்ந்தெடுக்கப்பட்டுள்ள ‘Yahweh’க்கு பதிலாக ‘யெகோவா’ (Jehovah) பயன்படுத்தப்பட்டுள்ளது; இது குறிப்பிடப்பட்ட பெயரியல் தீர்மானத்துடன் ஒத்துப்போகவில்லை.
  naturalness: நடை நவீனத் தரத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது. ‘அவருடைய இமைகள்’ என்பதற்குப் பதிலாக ‘அவருடைய கண் இமைகள்’ என்பது உடலுறுப்பின் குறிப்பு தெளிவாகவும் இயல்பாகவும் அமையும். ‘சோதித்தறிகின்றன’ என்பது இங்கு ஆராய்ந்து பரிசோதிக்கும் பொருளைச் சரியாகத் தருகிறது.
  terminology: யְהוָה-வை ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்திற்கும் POB ஆங்கில audit trail-இன் ‘Yahweh’ தீர்மானத்திற்கும் ஏற்புடையது. ‘பரிசுத்த ஆலயம்’, ‘அரியணை’, ‘வானம்’, ‘சோதித்தறிதல்’ ஆகியவை பொருத்தமானவை. ‘மனிதர்கள்’ என்பது בְּנֵי אָדָם-இன் கூட்டான, பொதுமனிதக் குறிப்பை இயல்பாக வெளிப்படுத்துகிறது.
