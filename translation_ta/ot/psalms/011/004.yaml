  yaml_path: translation/ot/psalms/011/004.yaml
  text: Yahweh is in his holy temple[a]; Yahweh—his throne is in heaven. His eyes see[d][c][b]; his eyelids examine the children of man.
translation:
  language: ta
  text: யாவே தமது பரிசுத்த ஆலயத்தில் இருக்கிறார்; யாவே—அவருடைய அரியணை வானத்தில் இருக்கிறது. அவருடைய கண்கள் காண்கின்றன; அவருடைய கண் இமைகள் மனிதர்களைச் சோதித்தறிகின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதர்கள்” என்பது சொல்லுக்கு நெருக்கமாக, “மனிதனின் பிள்ளைகள்” என்றும் மொழிபெயர்க்கப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தமிழில் பரவலாக அறியப்பட்ட வடிவில் இறைவனின் தனிப்பெயரைத் தலைப்பால் மாற்றாமல் வழங்குகிறது.
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: தமது பரிசுத்த ஆலயத்தில்
  rationale: הֵיכָל என்பதன் ‘அரண்மனை/ஆலயம்’ என்ற பொருள் அகலத்தில், பரிசுத்த வாசஸ்தலத்தையும் வானத்து அரியணையுடனான கவித்துவ இணைப்பையும் ‘ஆலயம்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּשָּׁמַיִם כִּסְאוֹ
  choice: அவருடைய அரியணை வானத்தில் இருக்கிறது
  rationale: இடப்பொருளையும் எபிரெய இணைப்பையும் தெளிவான நவீனத் தமிழில் காக்கிறது.
- source_word: עֵינָיו יֶחֱזוּ
  choice: அவருடைய கண்கள் காண்கின்றன
  rationale: חזה என்பதன் நேரடியான ‘காணுதல்/உற்றுநோக்குதல்’ பொருளை எளிமையாகத் தருகிறது.
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  choice: அவருடைய இமைகள் சோதித்தறிகின்றன
  rationale: கண்கள்–இமைகள் என்ற மானுட உருவகத்தைக் கலைக்காமல், בחן என்பதிலுள்ள ஆராய்ந்து சோதிக்கும் கருத்தையும் தருகிறது.
- source_word: בְּנֵי אָדָם
  choice: மனிதர்களை
  rationale: சொல்லுக்கு சொல் ‘ஆதாமின்/மனிதனின் மகன்கள்’ என்றாலும், இங்கு எல்லா மனிதர்களையும் குறிக்கும் கூட்டுப்பொருளை இயல்பான, பாலினப் பொதுமையான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: இறைவனின் வாசஸ்தல உருவகம்
  choice: யெகோவா பரிசுத்த ஆலயத்தில் இருப்பதும் அவரது அரியணை வானத்தில் இருப்பதும் இரு இணையான கூற்றுகளாக வைக்கப்பட்டுள்ளன.
  alternative: ‘பரிசுத்த ஆலயம்’ என்பதை பூமிக்குரிய ஆலயமாக மட்டும் அல்லது வானத்தின் மறுபெயராக மட்டும் விளக்குதல்.
  rationale: எபிரெய உரை இரு உருவகங்களையும் அருகருகே வைக்கிறது; அவற்றின் கவித்துவ இறுக்கத்தை மொழிபெயர்ப்பு தீர்த்துவிடவில்லை.
- issue: בְּנֵי אָדָם என்பதன் கூட்டுப்பொருள்
  choice: மனிதர்கள்
  alternative: மனிதனின் பிள்ளைகள் / மனிதகுலம்
  rationale: இப்பதம் மனிதரைப் பொதுவாகக் குறிக்கிறது. நவீனத் தமிழில் ‘மனிதர்கள்’ தெளிவாகவும் பாலினத்தைத் தேவையின்றிக் குறுக்காமலும் உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தில் இறைப்பெயர் மீண்டும் வருவதும், ‘கண்கள்—இமைகள்’ என்ற மானுட உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
