  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד בַּֽ/יהוָ֨ה חָסִ֗יתִי אֵ֭יךְ תֹּאמְר֣וּ לְ/נַפְשִׁ֑/י נודו הַרְ/כֶ֥ם צִפּֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/001.yaml
  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: ta
  text: 'இசைக்குழுத் தலைவருக்கு. தாவீதுக்குரியது.


    யெகோவாவில் நான் அடைக்கலம் புகுந்திருக்கிறேன்;

    அப்படியிருக்க, நீங்கள் என்னிடம்,

    “பறவையைப்போல் உங்கள் மலைக்குப் பறந்துபோங்கள்” என்று எப்படிச் சொல்கிறீர்கள்?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய உரையில் “பறந்துபோங்கள்” என்பதும் “உங்கள் மலை” என்பதும் பன்மை வடிவங்களில் உள்ளன. ஆனால் வாக்கியம் ஒருவரை நோக்கிப் பேசுவதுபோல் தொடங்குகிறது. சில பழைய மொழிபெயர்ப்புகளும் உரைத் திருத்த முன்மொழிவுகளும் இதை ஒருமையாகப் புரிந்து, “பறவையைப்போல் உன் மலைக்குத் தப்பியோடு” என்று தருகின்றன.
    reason: லְנַפְשִׁי (‘என்னிடம்’) என்ற ஒருமைச் சுட்டலுக்கும் நוּדוּ, הַרְכֶם என்ற பன்மை வடிவங்களுக்கும் இடையிலான மூல உரைச் சிக்கலை வெளிப்படையாகக் காக்கிறது.
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: பாடகர் தலைவருக்கு
  rationale: சங்கீதத் தலைப்பில் இசை நிகழ்த்துதலை மேற்பார்வையிடும் நபரைக் குறிக்கும் சொல்லாக இயல்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: לְדָוִד
  choice: தாவீதின் பாடல்
  rationale: எபிரெய முன்னிடைச்சொல் ஆசிரியர், தொடர்பு, அர்ப்பணம் ஆகிய நிழற்பொருள்களைத் தரக்கூடும்; சங்கீதத் தலைப்பில் இயல்பான தமிழுக்காக இவ்வாறு தரப்பட்டது.
- source_word: בַּיהוָה
  choice: யெகோவாவிடம்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட இறைப் பெயரை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, அடைக்கலம் புகுதலுடன் இயல்பாக இணையும் வேற்றுமை உருபு பயன்படுத்தப்பட்டது.
- source_word: חָסִיתִי
  choice: நான் அடைக்கலம் புகுந்திருக்கிறேன்
  rationale: நிறைவேறிய செயலும் அதன் தொடரும் நிலையும் வெளிப்படும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: לְנַפְשִׁי
  choice: என்னிடம்
  rationale: இங்கு נֶפֶשׁ முழு மனிதரையே குறிக்கும் இயல்பான எபிரெயப் பயன்பாடு; தமிழில் ‘என் ஆத்துமாவிடம்’ என்பது தேவையற்ற உடல்–ஆத்துமா பிரிவை உணர்த்தக்கூடும்.
- source_word: נודו
  choice: பறந்துபோங்கள்
  rationale: மசோரா உயிர்க்குறியீட்டின் படி இது பன்மை கட்டளை; பறவை உருவகத்தோடு ‘பறந்துபோங்கள்’ இயல்பாகப் பொருந்துகிறது.
- source_word: הַרְכֶם
  choice: உங்கள் மலைக்கு
  rationale: மசோரா உரையில் இரண்டாம் நபர் ஆண்பால் பன்மை உடைமை விகுதி உள்ளது; அதைத் தெளிவாகப் பாதுகாக்கிறது.
