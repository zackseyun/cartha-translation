source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד בַּֽ/יהוָ֨ה חָסִ֗יתִי אֵ֭יךְ תֹּאמְר֣וּ לְ/נַפְשִׁ֑/י נודו הַרְ/כֶ֥ם צִפּֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/000.yaml
  text: For the choirmaster[a]. Of David. In Yahweh I take refuge; how can you say to my soul, “Flee to your mountain[b], bird” ?
translation:
  language: ta
  text: 'இசைத்தலைவருக்கு. தாவீதுக்குரியது.


    யாவேயிடம் நான் அடைக்கலம் புகுந்திருக்கிறேன்;

    அப்படியிருக்க, என் உயிரை நோக்கி நீங்கள்,


    “பறவையே, உங்கள் மலைக்குத் தப்பியோடுங்கள்”[a]


    என்று எப்படிச் சொல்லலாம்?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வாசகம் கடினமானது. சொற்சொல்லாக, “பறவையே, உங்கள் மலைக்குத் தப்பியோடுங்கள்” என்று உள்ளது; இதில் “பறவை” ஒருமையிலும் கட்டளையும் “உங்கள்” என்பதும் பன்மையிலும் உள்ளன. “பறவையைப்போல் உங்கள் மலைக்குத் தப்பியோடுங்கள்” என்றும் புரிந்துகொள்ளலாம். சில வாசிப்பு மரபுகளில், “பறவையே, உன் மலைக்குத் தப்பியோடு” என்ற ஒருமை வாசிப்பும் உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத்தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை அல்லது வழிபாட்டு நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கும் சொல்லாக இயல்பாகவும் மரபுக்கு ஏற்றவாறும் உள்ளது.
- source_word: לְדָוִד
  choice: தாவீதின் பாடல்
  rationale: தாவீதுடன் சங்கீதத்திற்குள்ள தொடர்பைக் காட்டுகிறது; எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவம் மட்டுமல்லாமல் அர்ப்பணம் அல்லது தொடர்பையும் குறிக்கக்கூடும் என்பதால் அதைத் தீர்மானமாக வரையறுக்கவில்லை.
- source_word: בַיהוָה
  choice: யாவேயிடம்
  rationale: தேவனுடைய தனிப்பெயரான יהוה என்பதை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: חָסִיתִי
  choice: அடைக்கலம் புகுந்திருக்கிறேன்
  rationale: முடிவுற்ற வினை வடிவத்தையும் அதன் தொடரும் நிலைப் பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לְנַפְשִׁי
  choice: என் உயிரை நோக்கி
  rationale: נפשׁ என்பதன் ‘உயிர்/தன்னையே’ என்ற பொருளைத் தக்கவைத்து, இங்கு ‘என்னிடம்’ என்பதற்கு நெருக்கமான எபிரெய மொழிப்பாங்கை வெளிப்படுத்துகிறது.
- source_word: נוּדוּ / נודו
  choice: தப்பியோடு
  rationale: சூழலில் உயிரைக் காக்க ஓடிச் செல்லுமாறு கூறும் கட்டளையைத் தெரிவிக்கிறது; எண் மற்றும் வாசிப்பு சார்ந்த சிக்கல் அடிக்குறிப்பில் பதிவு செய்யப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற தேவனுடைய பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டம் அல்ல, தனிப்பெயர் இருப்பதால் அதனை ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: לְדָוִד என்பதன் தொடர்பு
  choice: தாவீதின் பாடல்
  alternative: தாவீதினால் எழுதப்பட்டது
  rationale: எபிரெய வடிவம் தாவீதுடனான தொடர்பைக் காட்டினாலும், ஆசிரியத்துவத்தை மட்டும் இலக்கண ரீதியாகக் கட்டாயப்படுத்துவதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்குரிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூல எபிரெயத்தின் இறுதிப் பகுதியிலுள்ள ஒருமை–பன்மை மற்றும் ‘பறவை/பறவையைப்போல்’ என்ற உண்மையான தெளிவின்மை பிரதான உரையிலும் அடிக்குறிப்பிலும் மறைக்கப்படாமல் கையாளப்பட்டுள்ளது.
