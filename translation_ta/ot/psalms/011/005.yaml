base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/005.yaml
  text: Yahweh tests the righteous[a], but his soul hates the wicked and the one who loves violence.
translation:
  language: ta
  text: யாவே நீதிமானைச் சோதித்தறிகிறார்; ஆனால் பொல்லாதவனையும் வன்முறையை விரும்புகிறவனையும் அவருடைய உள்ளம் வெறுக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொற்சொல்லாக, “அவருடைய உயிர் வெறுக்கிறது.” இது யாவேயின் ஆழ்ந்த தனிப்பட்ட அருவருப்பை வெளிப்படுத்தும் மரபுத்தொடர். இதை நெகிழ்வாக, “யாவே பொல்லாதவனையும் வன்முறையை விரும்புகிறவனையும் வெறுக்கிறார்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: பெயர்ச்சொல்லாகப் பயன்படும் ஒருமை வடிவத்தின் பொதுப்பிரதிநிதித்துவப் பொருளையும் ஒழுக்கநீதியின் கருத்தையும் காக்கிறது.
- source_word: יִבְחָן
  choice: சோதித்தறிகிறார்
  rationale: בחן என்பதிலுள்ள சோதித்தல், ஆராய்ந்து அறிதல் ஆகிய மதிப்பீட்டுக் கூறுகளை இயல்பான தமிழில் இணைத்துத் தருகிறது; தண்டனைக்குரிய சோதனை என்று மிகையாகக் குறுக்குவதில்லை.
- source_word: וְרָשָׁע
  choice: பொல்லாதவன்
  rationale: நீதிமானுக்கு இணையாக நிற்கும், ஒழுக்கரீதியாகத் தீய நபரைக் குறிக்கும் ஒருமைப் பொதுப்பயன்பாட்டைத் தக்கவைக்கிறது.
- source_word: וְאֹהֵב חָמָס
  choice: வன்முறையை விரும்புகிறவன்
  rationale: பங்கேற்பு வடிவம் சுட்டும் நிலையான மனப்பாங்கையும் நபரின் பண்பையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: חָמָס
  choice: வன்முறை
  rationale: இச்சூழலில் உடல் வன்முறையையும் வன்முறைசார்ந்த அநீதியையும் உள்ளடக்கக்கூடிய நேரடியான தமிழ் இணை.
- source_word: שָׂנְאָה נַפְשׁוֹ
  choice: அவருடைய உள்ளம் வெறுக்கிறது
  rationale: நֶפֶשׁ என்பதைக் கோட்பாட்டுச் சொல்லான ‘ஆத்துமா’ என மாற்றாமல், யாவேயின் ஆழ்ந்த தனிப்பட்ட வெறுப்பை வெளிப்படுத்தும் எபிரெய மரபுத்தொடரின் வலிமையை இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: இறுதிக் கூறிலுள்ள ‘அவருடைய உள்ளம்’ என்பதன் சுட்டுப்பொருளும் வலிமையும்
  choice: இது யாவேயையே சுட்டி, அவருடைய ஆழ்ந்த தனிப்பட்ட அருவருப்பை வெளிப்படுத்துகிறது
  alternative: ‘அவர் வெறுக்கிறார்’ என்று நெகிழ்வாக மொழிபெயர்த்து נֶפֶשׁ என்ற சொல்லை வெளிப்படுத்தாமல் விடுதல்
  rationale: எபிரெய உரை வெறுப்பை யாவேயின் נֶפֶשׁ என்பதோடு நேரடியாக இணைக்கிறது. ‘அவருடைய உள்ளம்’ என்பது அந்த வலிமையைப் பாதுகாக்கிறது; அதேவேளையில் இறைவனின் உணர்வுகளைக் குறித்து வசனம் கூறுவதற்கு அப்பால் கோட்பாட்டுத் தீர்மானம் எதையும் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘சோதித்தறிகிறார்’ என்பது ஆய்வு மற்றும் சோதனை ஆகிய இரு நுணுக்கங்களையும் தருகிறது. ‘உள்ளம் வெறுக்கிறது’ என்பது எபிரெய மொழியின் வலிமையைத் தக்கவைத்தபடியே தமிழில் தேவையற்ற ‘ஆத்துமா’ சார்ந்த கோட்பாட்டு ஒலிப்பைத் தவிர்க்கிறது.
