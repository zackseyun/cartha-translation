  text: כִּֽי צַדִּ֣יק יְ֭הוָה צְדָק֣וֹת אָהֵ֑ב יָ֝שָׁ֗ר יֶחֱז֥וּ פָנֵֽי/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/007.yaml
  text: For Yahweh is righteous[a]; he loves righteous deeds[b]; the upright will behold his face.
translation:
  language: ta
  text: 'ஏனெனில், யாவே நீதியுள்ளவர்;

    அவர் நீதியான செயல்களை நேசிக்கிறார்;

    நேர்மையானவர்கள் அவருடைய முகத்தைக்[b] காண்பார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சாத்தியம் குறைவான மற்றொரு மொழிபெயர்ப்பு: “அவருடைய முகம் நேர்மையானவனைக் காண்கிறது.” இறுதி வாக்கியத்தின் எபிரெயத் தொடரமைப்பு ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளப்பட்டுள்ளது.'
    reason: alternative_reading
  - marker: b
    text: சொல்லுக்குச் சொல், “அவருடைய முகம்.” இந்தச் சொற்றொடர் அவருடைய பிரசன்னத்தையோ தயவையையோ குறிக்கவும் கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றிற்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צַדִּיק
  choice: நீதியுள்ளவர்
  rationale: யாவேயின் ஒழுக்க இயல்பைக் குறிக்கிறது; அடுத்துள்ள צְדָקוֹת என்பதுடன் காணப்படும் ஒரே சொல்வேரின் தொடர்பையும் தமிழில் முடிந்தவரை காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல், எபிரெய மூலத்திற்கு நெருக்கமான பெயரெழுத்தாக்கமாக வழங்குகிறது.
- source_word: צְדָקוֹת
  choice: நீதியான செயல்கள்
  rationale: பன்மை வடிவம் இங்கு அருவமான ‘நீதி’ என்பதைவிட நடைமுறையில் செய்யப்படும் நீதியான செயல்களைக் குறிப்பதாக இயல்பாகப் புரிகிறது.
- source_word: אָהֵב
  choice: நேசிக்கிறார்
  rationale: யாவேயின் நிலையான விருப்பத்தையும் மனப்பாங்கையும் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יָשָׁר
  choice: நேர்மையானவர்கள்
  rationale: தொடர்ந்து வரும் பன்மை வினைச்சொல்லுக்கு ஏற்ப, ஒழுக்கத்தில் நேர்மையான மக்களைக் குறிக்கும் பெயர்ச்சொல் பயன்பாடாக மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: יֶחֱזוּ
  choice: காண்பார்கள்
  rationale: ‘பார்த்தல்/காணுதல்’ என்ற பொருளைத் தெளிவான நவீன தமிழில் தருகிறது; சங்கீதத்தின் உயர்ந்த நடைக்கும் ஏற்றது.
- source_word: פָנֵימוֹ
  choice: அவருடைய முகம்
  rationale: ‘அவருடைய முகம்’ என்ற மூலத்தின் உருவகத்தை முதன்மை உரையில் காக்கிறது; அது அவருடைய பிரசன்னம் அல்லது தயவையும் உணர்த்தக்கூடும் என்பதைக் குறிப்பில் தெரிவிக்கிறது.
theological_decisions:
- issue: இறுதி வாக்கியத்தின் எழுவாயும் தொடரமைப்பும்
  choice: நேர்மையானவர்கள் அவருடைய முகத்தைக் காண்பார்கள்
  alternative: 'சாத்தியம் குறைந்த மற்றொரு தொடரமைப்பு: ‘அவருடைய முகம் நேர்மையானவரைக் காண்கிறது.’'
  rationale: יֶחֱזוּ என்பது பன்மை வினை வடிவமாக இருப்பதாலும், கடவுளுடைய முகத்தைக் காண்பது அவருடைய தயவையும் உறவையும் குறிக்கும் பொதுவான வேதாகம உருவகமாக இருப்பதாலும், நேர்மையான மக்களை எழுவாயாகக் கொள்வது மிகவும் இயல்பானது. இருப்பினும், எபிரெயத் தொடரமைப்பை வேறுவிதமாகப் புரிந்துகொள்ளும் வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. மூலத்தின் மூன்று இணை வரிகளும் சொல்வேர்ச் சார்ந்த ‘நீதி/நீதியான’ தொடர்பும் முடிந்தவரை காக்கப்பட்டுள்ளன.
