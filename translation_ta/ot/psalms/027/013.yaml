lexical_decisions:
- source_word: לוּלֵא
  choice: நான் ... நம்பியிராவிட்டால்
  rationale: இந்தத் துகள் நிகழாத எதிர்நிலையைச் சுட்டும் நிபந்தனையை அறிமுகப்படுத்துகிறது. எபிரெய உரை அதன் விளைவைச் சொல்லாமல் விடுவதால், தமிழிலும் முற்றுப்பெறாத நிபந்தனையாகப் பாதுகாக்கப்படுகிறது.
- source_word: הֶאֱמַנְתִּי
  choice: நான் நம்பியிராவிட்டால்
  rationale: אמן என்பதன் ஹிஃபில் வடிவம் இங்கே ‘நம்புதல்’ என்ற பொருளில் வருகிறது; எதிர்நிலை நிபந்தனையை இயல்பான தமிழில் இவ்வடிவம் தெரிவிக்கிறது.
- source_word: לִרְאוֹת
  choice: எனக்குக் காண்பிப்பார் என்று
  rationale: மசோரா மரபில் உள்ள சிறப்புப் புள்ளியிடல், எழுத்து வடிவமான ‘காண’ என்பதற்குப் பதிலாக ‘காண்பிக்க’ என்று வாசிக்கப்படுவதைக் குறிக்கிறது. ஆகவே அந்த மரபுவழி வாசிப்பு முதன்மை உரையில் தரப்படுகிறது; ‘நான் காண்பேன்’ என்பது அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: בְּטוּב
  choice: தமது நன்மையை
  rationale: טוּב என்பது நன்மை, அருள் நலன் அல்லது வளமை ஆகிய பரப்பைக் கொண்டது. ‘நன்மை’ அதன் பரந்த, சுருக்கப்படாத பொருளைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீன தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּאֶרֶץ חַיִּים
  choice: உயிருள்ளோரின் நாட்டில்
  rationale: இது மரணம் அல்லது பாதாளத்துக்கு எதிராக, உயிரோடு இருப்போரின் உலகைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
- source_word: '[implicit apodosis after לוּלֵא]'
  choice: —
  rationale: எபிரெயம் நிபந்தனையின் விளைவுக் கூறை வெளிப்படையாகச் சொல்லவில்லை. ஊகிக்கப்பட்ட கருத்தை முதன்மை உரையில் சேர்க்காமல், நீண்ட கோடு மூலம் அந்தத் திட்டமிட்ட முற்றுப்பெறாமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பெயர் இருப்பதால், பட்டத்தைப் பதிலிடாமல் பெயரையே ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: விடுபட்டுள்ள நிபந்தனை விளைவுக் கூறு
  choice: முதன்மை உரையில் அதை நிரப்பாமல் விடுதல்
  alternative: ‘நான் மனந்தளர்ந்திருப்பேன்’ என்று வெளிப்படையாகச் சேர்த்தல்
  rationale: சூழல் அந்தப் பொருளை வலுவாகக் குறிப்பிட்டாலும், அது எபிரெய உரையில் எழுதப்படவில்லை. உண்மையான இலக்கண முற்றுப்பெறாமையையும் அதன் விளக்க வாய்ப்பையும் பாதுகாக்கிறது.
- issue: לראות என்பதன் மசோரா வாசிப்பு
  choice: ‘காண்பிக்க’ என்ற கெரே வாசிப்பைப் பின்பற்றுதல்
  alternative: மெய்யெழுத்து வடிவத்தின்படி ‘காண’ என்று வாசித்தல்
  rationale: WLC உரையின் சிறப்புப் புள்ளிகள் לְהַרְאוֹת (‘காண்பிக்க’) என்ற மசோரா வாசிப்பு மரபைக் குறிக்கின்றன; ஆனால் பரவலாக அறியப்பட்ட மெய்யெழுத்து வாசிப்பும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான பொதுத் தமிழ் பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் முற்றுப்பெறாத நிபந்தனை நீண்ட கோட்டால் வெளிப்படுத்தப்பட்டு, ஊகிக்கப்பட்ட விளைவு அடிக்குறிப்பில் விளக்கப்படுகிறது. ‘உயிருள்ளோரின் நாடு’ என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் ‘உயிருள்ளோரின் நாட்டில்’ என்று தக்கவைத்துள்ளோம்.
