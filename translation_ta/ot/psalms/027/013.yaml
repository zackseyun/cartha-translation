  text: Unless I had believed that I would see the goodness of Yahweh in the land of the living[a][b].
translation:
  language: ta
  text: உயிருள்ளோரின் நாட்டில் யாவேயின் நன்மையை நான் காண்பேன் என்று நான் நம்பியிராவிட்டால்—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய வாக்கியம் முற்றுப்பெறாமல் நிற்கிறது: “உயிருள்ளோரின் நாட்டில் யாவேயின் நன்மையை நான் காண்பேன் என்று நான் நம்பியிராவிட்டால்—”. விடுபட்ட விளைவுக் கூறு பொதுவாக “நான் மனந்தளர்ந்திருப்பேன்” அல்லது “நான் நம்பிக்கை இழந்திருப்பேன்” என்று புரிந்துகொள்ளப்படுகிறது.'
