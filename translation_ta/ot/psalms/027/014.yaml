  text: קַוֵּ֗ה אֶל יְה֫וָ֥ה חֲ֭זַק וְ/יַאֲמֵ֣ץ לִבֶּ֑/ךָ וְ֝/קַוֵּ֗ה אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
translation:
  language: ta
  text: யாவேக்காகக் காத்திரு[a]; உறுதியாயிரு, உன் இதயம் துணிவு கொள்ளட்டும்[b]; ஆம், யாவேக்காகக் காத்திரு.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “காத்திரு” என்பதை “நம்பிக்கையோடு எதிர்பார்த்திரு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர் உன் இதயத்தை உறுதிப்படுத்துவார்.” எபிரெய வினையைத் தொடர்ந்து வரும் அறிவுறுத்தலாகவோ, முன்னறிவிப்பாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: קַוֵּה / וְקַוֵּה
  choice: காத்திரு
  rationale: פיעל கட்டளை வடிவம் பொறுமையோடும் எதிர்பார்ப்போடும் காத்திருப்பதைக் குறிக்கிறது. இறுதியில் வரும் மறுபடியும் கூறுதல் கவிதையின் வலியுறுத்தலாகத் தக்கவைக்கப்பட்டுள்ளது; ‘நம்பிக்கையாயிரு’ என்ற பொருள் வாய்ப்பும் அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: אֶל
  choice: யாவேக்காக
  rationale: קוה என்பதுடன் வரும் אֶל, எதிர்பார்ப்புடன் காத்திருப்பவர் நோக்கிச் செல்லும் மனநிலையைச் சுட்டுகிறது. தமிழில் ‘யாவேக்காகக் காத்திரு’ என்பது இயல்பாகவும் திசைநோக்கிய எதிர்பார்ப்பை வெளிப்படுத்துவதாகவும் உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைபெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக ‘யாவே’ என்று தருகிறது.
- source_word: חֲזַק
  choice: உறுதியாயிரு
  rationale: இந்த நேரடிக் கட்டளை உள்ளார்ந்த வலிமையையும் நிலைத்த உறுதியையும் குறிக்க முடியும். ‘உறுதியாயிரு’ என்பது தமிழில் இயல்பாக இருந்து, பொருளை உடல் வலிமைக்கு மட்டும் சுருக்குவதில்லை.
- source_word: וְיַאֲמֵץ לִבֶּךָ
  choice: உன் இதயம் துணிவுகொள்ளட்டும்
  rationale: வினை வடிவம் இலக்கணப்படி மூன்றாம் நபர் ஆண்பால் ஒருமை என்றாலும், கட்டளைகளின் தொடரில் விருப்பவினை சார்ந்த அறிவுறுத்தலாகப் புரிந்துகொள்ளலாம். ‘இதயம்’ என்ற எபிரெய உருவகத்தையும் அறிவுறுத்தலின் வலிமையையும் மொழிபெயர்ப்பு காக்கிறது.
- source_word: וְקַוֵּה
  choice: ஆம், ... காத்திரு
  rationale: וְ இணைப்புடன் மீண்டும் வரும் கட்டளையை ‘ஆம்’ என்பது உச்சகட்ட உறுதிப்படுத்தலாக இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைபெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: וְיַאֲמֵץ என்பதன் தொடரியல் வலிமை
  choice: 'அறிவுறுத்தல்/விருப்பவினை: ‘உன் இதயம் துணிவுகொள்ளட்டும்’'
  alternative: 'முன்னறிவிப்பு/வாக்குறுதி: ‘அவர் உன் இதயத்தை உறுதிப்படுத்துவார்’'
  rationale: சுற்றியுள்ள நேரடிக் கட்டளைகளின் தொடரில் இதை தொடர்ந்து வரும் அறிவுறுத்தலாக வாசிப்பது இயல்பானது. எனினும், ‘அவர் உறுதிப்படுத்துவார்’ என்ற முன்னறிவிப்பு வாசிப்பும் இலக்கண ரீதியாகச் சாத்தியமானதால் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதயம்’ என்ற மூல உருவகமும், தொடக்கத்திலும் முடிவிலும் வரும் கட்டளையின் மறுபடியும் கூறுதலும் தக்கவைக்கப்பட்டுள்ளன.
