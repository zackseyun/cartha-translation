base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/000.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: ta
  text: 'தாவீதுக்கு உரியது.[a]


    யாவே என் ஒளியும் என் மீட்பும்;

    நான் யாருக்குப் பயப்படுவேன்?

    யாவே என் வாழ்வின் அரண்;

    நான் யாரைக் கண்டு அஞ்சுவேன்?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாவீதினால் இயற்றப்பட்டது” அல்லது “தாவீதுக்காக” என்றும் மொழிபெயர்க்கலாம்; எபிரெய לְדָוִד ஆசிரியத்துவத்தையோ தொடர்பையோ குறிக்கக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்கு உரியது
  rationale: לְ என்ற முன்னிடைச்சொல் ஆசிரியத்துவம், தொடர்பு, அர்ப்பணம் ஆகியவற்றைக் குறிக்கக்கூடும். தலைப்பாக இயல்பாக இருக்கவும் அதன் பரந்த தொடர்புப் பொருளைத் தக்கவைக்கவும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்று மாற்றாமல், தனிப்பெயராக ஒலிபெயர்க்கிறது.
- source_word: אוֹרִי
  choice: என் ஒளி
  rationale: எபிரெய உருவகத்தை நேரடியாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: יִשְׁעִי
  choice: என் மீட்பு
  rationale: יֶשַׁע என்பது விடுதலை, காப்பு, மீட்பு ஆகிய பொருள் வளையத்தைக் கொண்டது; இங்கு சுருக்கமான இணை உருவகமாக ‘மீட்பு’ பொருத்தமானது.
- source_word: מָעוֹז חַיַּי
  choice: என் வாழ்வின் அரண்
  rationale: מָעוֹז குறிக்கும் பாதுகாப்பான வலிமைமிக்க இடத்தை ‘அரண்’ இயல்பாக வெளிப்படுத்துகிறது; חַיַּי என்பதன் நேரடியான உறவை ‘என் வாழ்வின்’ எனப் பாதுகாக்கிறது.
- source_word: אִירָא / אֶפְחָד
  choice: பயப்படுவேன் / அஞ்சுவேன்
  rationale: இணையான இரு பயவினைகளின் கவிதை வேறுபாட்டைத் தமிழிலும் இரண்டு இயல்பான சொற்களால் தக்கவைக்கிறது.
theological_decisions:
- issue: இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப் பட்டமல்ல, יהוה என்ற தனிப்பெயர் உள்ளது; ஆகவே அதன் தனிப்பெயர்த் தன்மை வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
- issue: לְדָוִד தலைப்பின் உறவு
  choice: தாவீதுக்கு உரியது
  alternative: தாவீதினால் இயற்றப்பட்டது / தாவீதுக்காக
  rationale: எபிரெய முன்னிடைச்சொல் ஆசிரியத்துவத்தை மட்டும் கட்டாயப்படுத்தாததால், உண்மையான இலக்கணத் தெளிவின்மையை அடிக்குறிப்புடன் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணை அமைப்பும் இரண்டு சொல்லாட்சியிலான வினாக்களும் தக்கவைக்கப்பட்டுள்ளன; வாசிப்பின் ஓட்டத்திற்காக வரிகள் பிரிக்கப்பட்டுள்ளன.
