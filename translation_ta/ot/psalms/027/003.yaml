id: PSA.27.3
reference: Psalms 27:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אִם תַּחֲנֶ֬ה עָלַ֨/י מַחֲנֶה֮ לֹֽא יִירָ֪א לִ֫בִּ֥/י אִם תָּק֣וּם עָ֭לַ/י מִלְחָמָ֑ה בְּ֝/זֹ֗את אֲנִ֣י בוֹטֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
translation:
  language: ta
  text: 'ஒரு படை எனக்கு எதிராக முகாமிட்டாலும்[a], என் இதயம் அஞ்சாது;

    எனக்கு எதிராகப் போர் எழுந்தாலும், இதிலும்கூட நான் நம்பிக்கை வைக்கிறேன்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஒரு படை எனக்கு எதிராக முகாமிட்டால் ... எனக்கு எதிராகப் போர் எழுந்தால்.’ எபிரெய אִם என்பது ‘என்றால்’ என்ற நிபந்தனைப் பொருளிலோ, ‘-ஆலும்’ என்ற விட்டுக்கொடுப்புப் பொருளிலோ வரலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘இதிலும்கூட நான் உறுதியுடன் இருக்கிறேன்’ அல்லது ‘இந்நிலையிலும் நான் உறுதியுடன் இருக்கிறேன்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் நம்பிக்கை வைப்பதையோ உறுதியுடன் இருப்பதையோ குறிக்கக்கூடும்; நம்பிக்கையின் பொருள் இவ்வசனத்தில் வெளிப்படையாகக் கூறப்படவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: -ஆலும் (‘முகாமிட்டாலும்’, ‘எழுந்தாலும்’)
  rationale: இரு இணையான கவிதை வரிகளிலும் אִם நிபந்தனையாகவும் (‘என்றால்’) விட்டுக்கொடுப்பு பொருளிலும் (‘-ஆலும்’) அமையலாம். அச்சுறுத்தல் இருந்தபோதும் அஞ்சாத நிலையை இச்சூழல் வலியுறுத்துவதால் ‘-ஆலும்’ இயல்பாகப் பொருந்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תַּחֲנֶה ... מַחֲנֶה
  choice: ஒரு படை ... முகாமிட்டாலும்
  rationale: חנה என்பதன் ‘முகாமிடுதல்’ என்ற படைசார் படிமத்தைத் தக்கவைக்கிறது. מַחֲנֶה என்பதன் அடிப்படைப் பொருள் ‘முகாம்’ என்றாலும், போர்ச் சூழலிலும் ‘போர்’ என்பதுடனான இணைப்பிலும் அது முகாமிட்டிருக்கும் படையைக் குறிக்கிறது.
- source_word: לֹא יִירָא לִבִּי
  choice: என் இதயம் அஞ்சாது
  rationale: எபிரெய உரையில் ‘என் இதயம்’ எழுவாயாக வெளிப்படையாக இருப்பதால், அதை வெறும் ‘நான் அஞ்சமாட்டேன்’ என்று சுருக்காமல் கவிதைப் படிமத்துடன் தக்கவைக்கிறது.
- source_word: תָּקוּם ... מִלְחָמָה
  choice: போர் எழுந்தாலும்
  rationale: קום என்பதன் ‘எழுதல்’ என்ற உயிரோட்டமான படிமத்தையும் מִלְחָמָה என்பதன் நேரான ‘போர்’ என்ற பொருளையும் பாதுகாக்கிறது.
- source_word: בְּזֹאת
  choice: இதிலும்கூட
  rationale: ‘இதில்’ என்ற சுட்டுப் பொருளைத் தக்கவைத்து, முன் கூறப்பட்ட அச்சுறுத்தும் சூழ்நிலையிலும்கூட நம்பிக்கை நீடிப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲנִי בוֹטֵחַ
  choice: நான் நம்பிக்கையுடன் இருக்கிறேன்
  rationale: בטח என்பது நம்புதல் அல்லது உறுதியுடன் இருத்தல் ஆகிய இரு நெருங்கிய பொருள்களையும் தருகிறது. எபிரெயப் பங்கேற்பு வடிவத்தின் தொடர்நிலையையும், வெளிப்படையாகக் கூறப்படாத நம்பிக்கையின் பொருளையும் இச்சொற்றொடர் காக்கிறது.
theological_decisions:
- issue: בְּזֹאת என்பதன் சுட்டுப்பொருளும் אֲנִי בוֹטֵחַ என்பதன் நுண்பொருளும்
  choice: முன் விவரிக்கப்பட்ட பகைமைச் சூழலைச் சுட்டும் வகையில் ‘இதிலும்கூட நான் நம்பிக்கையுடன் இருக்கிறேன்’
  alternative: ‘இதில் நான் நம்பிக்கை வைக்கிறேன்’; அல்லது முந்தைய சூழலிலுள்ள ஆண்டவரை மறைமுகப் பொருளாகக் கொண்டு ‘இதில் [ஆண்டவரில்] நான் நம்பிக்கை வைக்கிறேன்’
  rationale: உடனடி கவிதைச் சூழல் சுட்டுப்பெயரை படையும் போரும் உருவாக்கும் அச்சுறுத்தலோடு இணைக்கிறது. அதேவேளை, எபிரெயம் நம்பிக்கையின் பொருளை இவ்வசனத்தில் வெளிப்படையாகக் குறிப்பிடவில்லை; ஆகவே ‘ஆண்டவரில்’ என்பதை மூலத்தில் இல்லாமல் சேர்க்காமல், அதன் இறையியல் திறந்தநிலையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதை நடையிலும் வடிவமைக்கப்பட்டுள்ளது. ‘என் இதயம்’ மற்றும் ‘போர் எழுதல்’ ஆகிய எபிரெயப் படிமங்கள் தக்கவைக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த விளக்கங்கள் சேர்க்கப்படவில்லை.
