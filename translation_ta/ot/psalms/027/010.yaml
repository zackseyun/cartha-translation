source:
  edition: WLC
  text: כִּי אָבִ֣/י וְ/אִמִּ֣/י עֲזָב֑וּ/נִי וַֽ/יהוָ֣ה יַֽאַסְפֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/010.yaml
  text: For my father and my mother have forsaken me[a], but Yahweh will take me in.
translation:
  language: ta
  text: என் தந்தையும் என் தாயும் என்னைக் கைவிட்டாலும்,[a] யாவே என்னை ஏற்றுக்கொள்வார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'மாற்று வாசிப்பு: “ஏனெனில் என் தந்தையும் என் தாயும் என்னைக் கைவிட்டார்கள்; ஆனால் யாவே என்னை ஏற்றுக்கொள்வார்.” எபிரெய இணைப்புச் சொல் காரணத்தையோ சலுகை/எதிர்நிலையையோ குறிக்கலாம்.'
    reason: source_ambiguity
  - marker: b
    text: எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் “சேகரித்துக்கொள்வார்.” இங்கு “என்னைத் தம்மிடம் சேர்த்துக்கொள்வார்” அல்லது “என்னை ஏற்றுக்கொள்வார்” என்ற பொருளில் வருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: —ஆலும்
  rationale: இச்சூழலில் כִּי பெற்றோரின் கைவிடுதலுக்கும் யாவேயின் அரவணைப்புக்கும் இடையிலான முரண்பாட்டை அறிமுகப்படுத்துகிறது. நவீனத் தமிழில் ‘கைவிட்டாலும்’ என்பது அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; எபிரெயச் சொல்லின் காரணவியல் வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אָבִי וְאִמִּי
  choice: என் தந்தையும் என் தாயும்
  rationale: இரு பெயர்ச்சொற்களிலும் உள்ள முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டை வெளிப்படையாகப் பாதுகாக்கும் நேரடியான மொழிபெயர்ப்பு.
- source_word: עֲזָבוּנִי
  choice: என்னைக் கைவிட்டாலும்
  rationale: עזב என்பதன் ‘கைவிடு, விட்டுச்செல்’ என்ற வலுவான பொருளை ‘கைவிடு’ இயல்பாகத் தருகிறது. சூழலோடு இணைந்த நிபந்தனைக்குரிய விட்டுக்கொடுப்பு அமைப்பு தமிழில் —ஆலும் என வழங்கப்பட்டுள்ளது.
- source_word: וַיהוָה
  choice: யாவே
  rationale: உடன்படிக்கைத் திருப்பெயரான יהוה ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்கப்படுகிறது. வாவ் இணைப்பின் முரண்பாட்டுப் பொருள் முந்தைய —ஆலும் அமைப்பிலேயே இயல்பாக வெளிப்படுகிறது.
- source_word: יַאַסְפֵנִי
  choice: என்னைச் சேர்த்துக்கொள்வார்
  rationale: אסף என்பதன் அடிப்படைப் பொருள் ‘சேகரி, ஒன்று சேர்.’ இங்கு ஒருவரைத் தம்மிடம் ஏற்று, பாதுகாப்பில் வைத்துக்கொள்ளும் பொருளில் வருவதால், ‘சேர்த்துக்கொள்வார்’ மூல உருவகத்தையும் இயல்பான தமிழையும் இணைக்கிறது.
theological_decisions:
- issue: 'כִּי மற்றும் வினைமுற்றின் தொடர்பு: நிகழ்ந்த கைவிடுதலா, விட்டுக்கொடுப்பு நிலைமையா'
  choice: என் தந்தையும் என் தாயும் என்னைக் கைவிட்டாலும்
  alternative: ஏனெனில் என் தந்தையும் என் தாயும் என்னைக் கைவிட்டார்கள்; ஆனால் யாவே…
  rationale: சங்கீதத்தின் நம்பிக்கை நிறைந்த சூழலும், மனிதர் கைவிடுதலைத் தெய்வீக ஏற்றுக்கொள்ளுதலுடன் எதிர்நிறுத்தும் கவிதை அமைப்பும் விட்டுக்கொடுப்பு வாசிப்பை ஆதரிக்கின்றன. எனினும் כִּי என்பதன் காரணவியல் சாத்தியத்தையும் எபிரெய நிறைவுவினையின் நேரடியான வாசிப்பையும் அடிக்குறிப்பு பதிவு செய்கிறது.
- issue: திருப்பெயர் יהוה
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் உள்ள தனிப்பட்ட உடன்படிக்கைத் திருப்பெயரை மறைக்காமல், நவீனத் தமிழில் அடையாளம் காணக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: יַאַסְפֵנִי குறிக்கும் தெய்வீகச் செயல்
  choice: என்னைச் சேர்த்துக்கொள்வார்
  alternative: என்னை ஏற்றுக்கொள்வார் / என்னைத் தம்மிடம் பாதுகாப்பார்
  rationale: ‘சேர்த்துக்கொள்வார்’ என்பது வரவேற்பையும் பாதுகாப்பையும் உணர்த்தினாலும், அவற்றில் ஒன்றாக மட்டும் பொருளைக் குறுக்காமல் אסף என்பதன் ‘சேர்/சேகரி’ உருவகத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிமையும் கவிதைச் செறிவும் உடைய மரியாதையான நடை பயன்படுத்தப்பட்டுள்ளது. ‘தந்தை/தாய்,’ ‘கைவிடு,’ ‘சேர்த்துக்கொள்’ ஆகியவை பொதுவாசகர்களுக்கு இயல்பானவை; தேவையற்ற சமயக்குழுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
