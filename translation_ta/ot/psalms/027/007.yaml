source:
  edition: WLC
  text: שְׁמַע יְהוָ֖ה קוֹלִ֥/י אֶקְרָ֗א וְ/חָנֵּ֥/נִי וַ/עֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/007.yaml
  text: Hear[a], O Yahweh, when I cry aloud[b]; be gracious to me and answer me.
translation:
  language: ta
  text: யாவே, நான் கூப்பிடும்போது என் குரலைக் கேளும்[a]; எனக்கு அருள்கூரும்[b], எனக்குப் பதிலளியும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் நேரடியாக: “யாவே, என் குரலைக் கேளும்; நான் கூப்பிடுகிறேன்.”'
    reason: மூலத்தின் சொல்வரிசையையும் ‘என் குரல்’ என்ற புலனுணரத்தக்க சொல்லாட்சியையும் காட்டுகிறது.
  - marker: b
    text: 'அல்லது: “எனக்குத் தயவுகாட்டும்”; மரபாக, “என்மேல் இரக்கமாயிரும்” என்றும் மொழிபெயர்க்கலாம்.'
    reason: חנן என்பதன் அருள், தயவு, இரக்கம் ஆகியவற்றைத் தொடும் பொருள் வரம்பைக் குறிப்பிடுகிறது.
lexical_decisions:
- source_word: שְׁמַע
  choice: கேளும்
  rationale: שׁמע என்பதன் இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை வடிவம். வேண்டுதலுடன் கூடிய கவனமான செவிகொடுத்தலைத் தமிழில் இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தில் நேரடியாக இடம்பெறும் இறைப்பெயரான יהוה-ஐப் பட்டப்பெயராக மாற்றாமல், தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: קוֹלִי
  choice: என் குரலை
  rationale: קוֹלִי என்பதன் நேரான பொருள் ‘என் குரல்.’ வெறுமனே ‘என்னை’ என்று மாற்றாமல், எபிரெயத்தின் புலனுணரத்தக்க சொல்லாட்சியைப் பாதுகாக்கிறது.
- source_word: אֶקְרָא
  choice: நான் கூப்பிடும்போது
  rationale: קרא என்பதன் Qal முற்றுப்பெறா வடிவம் இங்கு இறைவனை நோக்கி அழைப்பதைக் குறிக்கிறது. சூழலில் வேண்டுதல் நிகழும் நேரத்தைக் காட்டும் தமிழ்ச் சொற்றொடர் இயல்பானது; ‘கூக்குரலிடும்போது’ என்பதைவிட தேவையற்ற உணர்ச்சி மிகைப்பைத் தவிர்க்கிறது.
- source_word: וְחָנֵּנִי
  choice: எனக்கு அருள்கூரும்
  rationale: חנן என்பது கிருபையோடு சாதகமாக நடந்துகொள்ளும்படி வேண்டுவதைக் குறிக்கிறது. ‘என்மேல் இரக்கமாயிரும்’ என்பதும் சாத்தியம்; ஆனால் ‘அருள்கூரும்’ என்பது இவ்வினைச்சொல்லின் அருள் அல்லது தயவு காட்டுதல் என்ற நுணுக்கத்தை நெருக்கமாகப் பாதுகாக்கிறது.
- source_word: וַעֲנֵנִי
  choice: எனக்குப் பதிலளியும்
  rationale: ענה இங்கு ‘பதில் அளி’ என்ற பொருளில் வரும் கட்டளை வடிவம். ஜெப மொழியில் நேராகவும் இயல்பாகவும் உள்ளது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனத்தில் பொதுப் பட்டப்பெயர் அல்ல, יהוה என்ற தனிப்பட்ட இறைப்பெயரே உள்ளது. எனவே பெயரை மறைக்காமல் ஒலிபெயர்த்து, நேரடி அழைப்பின் தன்மையைப் பாதுகாக்கிறது.
- issue: חנן என்பதின் அருள்–இரக்கம் நுணுக்கம்
  choice: எனக்கு அருள்கூரும்
  alternative: என்மேல் இரக்கமாயிரும்
  rationale: இரு மொழிபெயர்ப்புகளும் பொருள் வரம்பிற்குள் இருக்கலாம். ஆயினும் חנן குறிப்பாக அருள் அல்லது தயவு காட்டுதலை முன்னிறுத்துவதால், ‘அருள்கூரும்’ தேர்ந்தெடுக்கப்பட்டது; இது எந்தக் குறிப்பிட்ட கோட்பாட்டு விளக்கத்தையும் வசனத்தில் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்கேற்ற கண்ணியமான ஒருமை மரியாதை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. ‘என் குரலை’ எனும் எபிரெயக் காட்சிப்படுத்தல் பாதுகாக்கப்பட்டாலும், தமிழில் இயல்பான ஓட்டத்திற்காக காலத் துணைவாக்கியம் முன்னிலைப்படுத்தப்பட்டுள்ளது.
