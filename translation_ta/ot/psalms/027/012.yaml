source:
  edition: WLC
  text: אַֽל תִּ֭תְּנֵ/נִי בְּ/נֶ֣פֶשׁ צָרָ֑/י כִּ֥י קָֽמוּ בִ֥/י עֵֽדֵי שֶׁ֝֗קֶר וִ/יפֵ֥חַ חָמָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
translation:
  language: ta
  text: என் எதிரிகளின் விருப்பத்திற்கு என்னை ஒப்புக்கொடுத்துவிடாதேயும்[a]; ஏனெனில் பொய்ச் சாட்சிகள் எனக்கு எதிராக எழும்பியிருக்கிறார்கள்; அவர்கள் வன்முறையை உமிழ்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் எதிரிகளின் சித்தத்திற்கு என்னை ஒப்புக்கொடுத்துவிடாதேயும்.” இங்குள்ள எபிரெயச் சொல் נֶפֶשׁ, குறுகிய பொருளில் ‘ஆத்துமா’ என்பதைக் காட்டிலும் ஆசை, விருப்பம் அல்லது சித்தம் என்பதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பொய்ச் சாட்சிகள் எனக்கு எதிராக எழும்பியிருக்கிறார்கள்; வன்முறையை உமிழுகிற ஒருவனும்.” இறுதிக் கூறின் எபிரெய வடிவம் ஒருமையில் இருப்பதால், அது ஒரு தனி நபரைக் குறிக்கலாம்; அல்லது பொய்ச் சாட்சிகளைத் தொகுப்பாக வருணிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנֵנִי
  choice: என்னை ஒப்புக்கொடுத்துவிடாதேயும்
  rationale: נתן என்பதன் இச்சூழல் பொருள் ஒருவரை மற்றவர்களின் அதிகாரத்திற்குள் ஒப்படைத்தல். வேண்டுதல் நடையின் மரியாதையையும் எதிர்மறைக் கட்டளையையும் இயல்பான தமிழில் தருகிறது.
- source_word: בְּנֶפֶשׁ
  choice: விருப்பத்திற்கு
  rationale: נֶפֶשׁ இங்கு குறுகிய பொருளில் ‘ஆத்துமா’ அல்ல; ஆசை, விருப்பம் அல்லது சித்தம் என்ற பொருளுடைய மொழிவழக்கின் பகுதி. ‘விருப்பம்’ மூலத்தின் பொருள் விரிவை இயல்பாகக் காக்கிறது.
- source_word: צָרָי
  choice: என் எதிரிகள்
  rationale: צר hostile opponents-ஐக் குறிக்கிறது. ‘எதிரிகள்’ நவீனத் தமிழில் தெளிவானதும் சட்ட மற்றும் ஒடுக்குதல் சார்ந்த சூழலுக்கும் பொருத்தமானதும் ஆகும்.
- source_word: קָמוּ בִי
  choice: எனக்கு எதிராக எழும்பியிருக்கிறார்கள்
  rationale: קום + בְּ என்ற அமைப்பு ஒருவருக்கு எதிராக எழுதல் அல்லது நிற்றலைக் குறிக்கிறது; நிறைவு பெற்ற செயல் தற்போதும் தொடர்புடையதாக இருப்பதை இவ்வடிவு வெளிப்படுத்துகிறது.
- source_word: עֵדֵי שֶׁקֶר
  choice: பொய்ச் சாட்சிகள்
  rationale: கட்டமைப்புத் தொடர் பொய்மையால் வகைப்படுத்தப்படும் சாட்சிகளைக் குறிக்கிறது. ‘பொய்ச் சாட்சிகள்’ இயல்பான சட்டவழக்குச் சமமான சொற்றொடர்.
- source_word: וִיפֵחַ חָמָס
  choice: அவர்கள் வன்முறையை மூச்சாக வெளிவிடுகிறார்கள்
  rationale: יפח மூச்சுவிடுதல் அல்லது மூச்சோடு வெளியிடுதல் என்ற உயிருள்ள உருவகத்தைக் கொண்டுள்ளது. எபிரெயச் சொல்லின் ஒருமை வடிவம் முன்னுள்ள பன்மைச் சாட்சிகளைத் தொகுப்பாக அல்லது பகிர்முறையாக வருணிக்கலாம்; தமிழில் ‘அவர்கள்’ இயல்பாக அந்தத் தொடர்பை வெளிப்படுத்துகிறது.
- source_word: חָמָס
  choice: வன்முறை
  rationale: חָמָס வன்முறை, கொடிய அநீதி, தீங்கு ஆகிய பொருட்களைக் கொள்ளலாம்; இங்கு ‘வன்முறை’ உருவகத்தின் வலிமையைத் தக்கவைக்கிறது.
theological_decisions:
- issue: וִיפֵחַ என்பதின் இலக்கண ஒருமைக்கும் עֵדֵי என்ற பன்மைக்கும் இடையிலான தொடர்பு
  choice: இறுதிக் கூறை பொய்ச் சாட்சிகளைத் தொகுப்பாகக் குறிக்கும் ‘அவர்கள்’ என மொழிபெயர்த்தல்
  alternative: ‘வன்முறையை மூச்சாக வெளிவிடுகிற ஒருவனும்’ எனத் தனி நபரைச் சுட்டுதல்
  rationale: மூலத்தின் ஒருமை வடிவம் தனி நபரையோ, பன்மைக் குழுவை பகிர்முறையாக வருணிப்பதையோ அனுமதிக்கிறது. முதன்மை உரையில் இயல்பான தொடர்பைத் தேர்ந்தெடுத்து, மாற்று வாய்ப்பை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘ஒப்புக்கொடுத்துவிடாதேயும்’ வேண்டுதலின் தீவிரத்தையும், ‘மூச்சாக வெளிவிடுகிறார்கள்’ மூல உருவகத்தையும் காக்கின்றன. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம் பெற்றுள்ளன.
