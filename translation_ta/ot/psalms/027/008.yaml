base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
translation:
  language: ta
  text: 'உமது சார்பாக என் இதயம் சொல்கிறது[a]: “என் முகத்தைத் தேடுங்கள்.” யாவே, உமது முகத்தை[b] நான் தேடுகிறேன்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத் தொடக்கம் பொருள் காணக் கடினமானது. இதை “உம்மிடம் என் இதயம் சொல்கிறது” என்றும், சொற்களின் தொடர்பைச் சற்றே வேறுவிதமாகப் புரிந்து “உம்மைக் குறித்து, ‘அவருடைய முகத்தைத் தேடுங்கள்’ என்று என் இதயம் சொல்கிறது” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது “உமது பிரசன்னத்தை.” எபிரேயத்தில் “முகம்” என்பது ஒருவரின் தனிப்பட்ட பிரசன்னத்தைக் குறிக்கவும் பயன்படுகிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது “நான் தேடுவேன்.” எபிரேய வினை நிகழ்காலத் தீர்மானத்தையோ எதிர்கால நோக்கத்தையோ வெளிப்படுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: உமது சார்பாக
  rationale: לְךָ אָמַר לִבִּי என்ற தொடர் இலக்கண ரீதியாகக் கடினமானது. இங்கு இறைவனிடமிருந்து வரும் அழைப்பை இதயம் அவருடைய சார்பாக எதிரொலிப்பதாகப் பொருள் கொண்டால், மசோரா உரையை மாற்றாமல் இந்தச் சொல்லாட்சியைத் தக்கவைக்க முடிகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אָמַר לִבִּי
  choice: என் இதயம் சொல்கிறது
  rationale: אָמַר என்பது நிறைவுற்ற வினைவடிவமாக இருந்தாலும், கவிதைச் சூழலில் நிகழ்கால உள்ளார்ந்த உரையை வெளிப்படுத்தலாம். இயல்பான நவீனத் தமிழில் உள்ளத்தின் தொடரும் பதிலை இது காட்டுகிறது.
- source_word: בַּקְּשׁוּ
  choice: தேடுங்கள்
  rationale: בקשׁ வேரின் பன்மை ஏவல் வடிவத்தைத் தெளிவாகவும் சுருக்கமாகவும் தக்கவைக்கிறது. பன்மைத் தன்மையை ஒருமையாக்காமல் பாதுகாக்கிறது.
- source_word: פָנָי
  choice: என் முகத்தை
  rationale: எபிரேயச் சொல்லின் நேரடிப் பொருளான ‘முகம்’ தக்கவைக்கப்படுகிறது. இது தனிப்பட்ட பிரசன்னத்தையும் குறிக்கலாம்; அடுத்த அரையடியில் அதே சொல் மீண்டும் வருவதால் சொல்லியல் இணைப்பு பாதுகாக்கப்படுகிறது.
- source_word: אֶת־פָּנֶיךָ
  choice: உமது முகத்தையே
  rationale: אֶת குறிக்கும் நேரடிச் செயப்படுபொருளையும், மீளவரும் ‘முகம்’ என்ற உருவகத்தையும் வலியுறுத்தும் ‘-ஏ’ இயல்பான தமிழில் பதிலின் மையத்தை வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் வழங்குகிறது.
- source_word: אֲבַקֵּשׁ
  choice: நான் தேடுகிறேன்
  rationale: முதல் நபர் ஒருமை நிறைவுறா வினை நிகழ்காலத் தீர்மானத்தையோ எதிர்கால நோக்கத்தையோ குறிக்கலாம். உடனடி பதிலை நிகழ்காலமாக முதன்மை உரை தருகிறது; எதிர்காலச் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட உடன்படிக்கைப் பெயர் நேரடியாக இடம்பெறுகிறது. அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
- issue: לְךָ אָמַר לִבִּי என்ற கடினமான தொடக்கத் தொடரின் பொருள்
  choice: “உமது சார்பாக என் இதயம் சொல்கிறது”
  alternative: “உம்மிடம் என் இதயம் சொல்கிறது” அல்லது “உம்மைக் குறித்து, ‘அவருடைய முகத்தைத் தேடுங்கள்’ என்று என் இதயம் சொல்கிறது”
  rationale: எபிரேயத் தொடர் சுருக்கமானதும் பலவாறு இணைத்துப் புரிந்துகொள்ளத்தக்கதுமாக உள்ளது. தேர்ந்த வாசிப்பு மசோரா உரையைத் திருத்தாமல், இறைவனின் அழைப்பை உள்ளம் எதிரொலிப்பதாகக் காட்டுகிறது; உண்மையான மாற்று வாசிப்புகள் அடிக்குறிப்பில் விடப்படுகின்றன.
- issue: אֲבַקֵּשׁ என்பதின் காலம் அல்லது நோக்கநிலை
  choice: நான் தேடுகிறேன்
  alternative: நான் தேடுவேன்
  rationale: நிறைவுறா வினை உடனடி நிகழ்காலத் தீர்மானத்தையும் எதிர்கால உறுதியையும் அனுமதிக்கிறது. முதன்மை உரை சூழலிலுள்ள உடனடி பதிலைத் தேர்ந்தெடுக்கிறது; மாற்றுச் சாத்தியத்தை மறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, மரியாதைமிக்க கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கும் ஒருமை மரியாதை வடிவங்களான “உமது” பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் “முகம்” என்ற மீளுரையும், பன்மை ஏவலும், தொடக்கச் சொற்றொடரின் தெளிவின்மையும் தேவையின்றி எளிமைப்படுத்தப்படவில்லை.
