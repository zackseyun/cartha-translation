  source_fidelity: 'The draft accurately preserves the sequence and force of the Hebrew petitions: hiding the face, turning the servant away in anger, prior help, casting off, forsaking, and the vocative ‘God of my salvation.’ A small adjustment removes an unnecessary emphatic ‘நீரே’ and makes the first line’s ‘from me’ relation more idiomatic and explicit in Tamil.'
