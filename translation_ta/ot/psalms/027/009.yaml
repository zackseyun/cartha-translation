  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ אַֽל תַּט בְּ/אַ֗ף עַ֫בְדֶּ֥/ךָ עֶזְרָתִ֥/י הָיִ֑יתָ אַֽל תִּטְּשֵׁ֥/נִי וְ/אַל תַּֽ֝עַזְבֵ֗/נִי אֱלֹהֵ֥י יִשְׁעִֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/009.yaml
  text: Do not hide your face from me[a]; do not turn your servant away in anger. You have been my help. Do not cast me off, and do not forsake me[c][b], O God of my salvation.
translation:
  language: ta
  text: 'என்னிடமிருந்து உமது முகத்தை மறைக்காதீர்;


    சினத்தில் உமது அடியவனை விலக்கிவிடாதீர்.[a]


    நீர் எனக்குத் துணையாயிருந்தீர்.


    என்னைத் தள்ளிவிடாதீர்; என்னைக் கைவிடாதீர்,


    என் மீட்பின் தேவனே![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சினத்தில் உமது அடியவனைத் திருப்பிவிடாதீர்.’
    reason: נטה என்ற வினைச்சொல் இச்சூழலில் ‘விலக்குதல்’ அல்லது ‘திருப்பிவிடுதல்’ என்ற நுணுக்கத்தைக் கொள்ளலாம்.
  - marker: b
    text: அல்லது, ‘என் விடுதலையின் தேவனே.’
    reason: יֵשַׁע என்ற சொல் ‘மீட்பு’ என்றும் ‘விடுதலை’ என்றும் மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: תַּסְתֵּר
  choice: மறைக்காதீர்
  rationale: סתר என்பதன் நேரடிப் பொருளான ‘மறைத்தல்’ என்பதை இயல்பான தமிழில் தருகிறது; தேவன் தமது முகத்தை மறைக்கும் உறவுசார் உருவகத்தையும் காக்கிறது.
- source_word: פָּנֶיךָ
  choice: உமது முகத்தை
  rationale: ‘முகம்’ என்ற எபிரேய உருவகத்தை ‘பிரசன்னம்’ என்று விளக்கிப் பெயர்க்காமல் அப்படியே காக்கிறது.
- source_word: תַּט בְּאַף
  choice: சினத்துடன் விலக்கிவிடாதீர்
  rationale: נטה என்பதிலுள்ள விலக்குதல் அல்லது திருப்பிவிடுதல் என்ற இயக்கத்தையும், בְּאַף என்பதிலுள்ள சினத்தையும் இயல்பான தமிழில் இணைக்கிறது.
- source_word: עַבְדֶּךָ
  choice: உமது அடியவனை
  rationale: தேவனிடம் தாழ்மையோடு தன்னைச் சுட்டும் சங்கீத மொழிநடைக்கு ‘அடியவன்’ பொருத்தமானது; இங்கு சட்டரீதியான அடிமை நிலை முதன்மையல்ல.
- source_word: עֶזְרָתִי הָיִיתָ
  choice: நீரே எனக்குத் துணையாயிருந்தீர்
  rationale: கடந்த காலத்தில் அனுபவிக்கப்பட்டு இப்போதும் பொருத்தமுள்ள உதவியை வெளிப்படுத்துகிறது; ‘நீரே’ வேண்டுதலின் வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: תִּטְּשֵׁנִי
  choice: என்னைத் தள்ளிவிடாதீர்
  rationale: נטש என்பதிலுள்ள நிராகரித்துத் துறக்கும் வலிமையான பொருளைக் காக்கிறது; அடுத்துள்ள עזב என்பதிலிருந்து வேறுபடுத்துகிறது.
- source_word: תַּעַזְבֵנִי
  choice: என்னைக் கைவிடாதீர்
  rationale: עזב என்பதன் ‘விட்டுவிடுதல், கைவிடுதல்’ என்ற உறவுசார் பொருளை தெளிவாகத் தருகிறது.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: என் மீட்பின் தேவனே
  rationale: எபிரேய இணைப்புத் தொடரின் அமைப்பையும் ישע என்பதன் மீட்பு/விடுதலைப் பரப்பையும் காக்கும் மரியாதையான விளிப்புமுறை.
theological_decisions:
- issue: தேவனைப் பற்றிய ‘உமது முகம்’ என்ற மனித உருவகம்
  choice: உமது முகத்தை
  alternative: உமது பிரசன்னத்தை
  rationale: மூலத்தில் ‘முகம்’ என்று வெளிப்படையாக உள்ளது. அதை ‘பிரசன்னம்’ என்று கருத்துரையாக மாற்றாமல் வைத்திருப்பது கவிதை உருவகத்தையும் தெய்வீக அருள் மற்றும் அருகாமை குறித்த உறவுசார் அழுத்தத்தையும் காக்கிறது.
- issue: עבד என்ற சொல்லால் சங்கீதக்காரன் தன்னை அழைப்பது
  choice: அடியவன்
  alternative: அடிமை
  rationale: இச்சூழலில் சட்டரீதியான அடிமைத்தனத்தைவிட, தேவனுக்கு முன் தாழ்மையான பணிவும் சார்ந்திருப்பதும் முன்னிலையில் உள்ளன.
- issue: יִשְׁעִי என்பதிலுள்ள மீட்பு மற்றும் விடுதலை நுணுக்கம்
  choice: என் மீட்பின் தேவனே
  alternative: என்னை விடுவிக்கும் தேவனே
  rationale: ‘மீட்பு’ மூலத்தின் பெயர்ச்சொல் அமைப்பையும் அதன் விரிவான இறையியல் எடையையும் காக்கிறது; குறிப்பிட்ட ஒரு வகை ஆபத்திலிருந்து விடுதலை என்று மட்டும் சுருக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வேண்டுதலுக்கேற்ற மரியாதை ஒருமை (‘உமது’, ‘நீர்’) பயன்படுத்தப்பட்டுள்ளது. கவிதை இணைநிலையும் மூன்று எதிர்மறை வேண்டுதல்களின் தீவிரமும் காக்கப்பட்டுள்ளன; அரிதான அல்லது பிரிவுசார் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
