  terminology: ‘முகம்,’ ‘அடியவன்,’ ‘துணை,’ ‘தள்ளிவிடுதல்,’ ‘கைவிடுதல்,’ and ‘மீட்பின் தேவன்’ are suitable and preserve the poetic and theological terminology without interpretive expansion.
