  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
translation:
  language: ta
  text: ஏனெனில், துன்ப நாளில்[b] அவர் என்னைத் தமது நிழற்குடிலில்[a] மறைத்து வைப்பார்; தமது கூடாரத்தின் மறைவிடத்தில் என்னை ஒளித்து வைப்பார்; கற்பாறையின் மேல் என்னை உயர்த்தி வைப்பார்.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘நிழற்குடிலில்’ என்பதற்கு ‘அடைக்கலத்தில்,’ ‘பந்தலில்,’ அல்லது ‘திருக்கூடாரத்தில்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் பாதுகாப்பளிக்கும் ஒரு குடிலைக் குறிக்கிறது; பரிசுத்த இடம் சார்ந்த நுண்ணுணர்வையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘துன்ப நாளில்’ என்பதற்கு ‘தீங்கு நேரும் நாளில்’ அல்லது ‘பேரிடர் நாளில்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: ‘என்னை ஒரு கற்பாறையின்மேல் உயர்ந்த இடத்தில் வைப்பார்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
