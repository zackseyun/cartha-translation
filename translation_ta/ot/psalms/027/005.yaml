theological_decisions:
- issue: סֻכּוֹ மற்றும் אָהֳלוֹ ஆகியவற்றில் இருக்கக்கூடிய பரிசுத்த இடம் சார்ந்த நுண்ணுணர்வு
  choice: பாதுகாப்பளிக்கும் நிழற்குடில் மற்றும் கூடாரம் என்ற konkretமான உருவகங்களாக மொழிபெயர்க்கப்பட்டது.
  alternative: இரண்டையும் ‘திருக்கூடாரம்’ போன்ற வழிபாட்டுத் தலச் சொற்களால் வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: இச்சொற்களுக்கு பரிசுத்த இடத்துடனான தொடர்பு இருக்கக்கூடும்; ஆனால் அவை பொதுவான குடில் மற்றும் கூடாரம் என்ற பொருளும் உடையவை. ஆகவே சாத்தியமான நுண்ணுணர்வை மறுக்காமலும், உரை கோராத சமயக் கட்டடப் பொருளுக்குள் வசனத்தைச் சுருக்காமலும் உருவகம் பேணப்பட்டுள்ளது.
- issue: בְּיוֹם רָעָה என்பதில் רָעָה-வின் பொருள்
  choice: அறநெறிசார் ‘தீமை’ என்பதற்குப் பதிலாக இடுக்கண் அல்லது பேரிடரைக் குறிக்கும் ‘துன்பம்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தீமையின் நாளில்’ அல்லது ‘பேரிடர் நாளில்’.
  rationale: சங்கீதக்காரர் பாதுகாப்பை நாடும் சூழலில் இந்தச் சொல் அவரை எதிர்கொள்ளும் துயரம் அல்லது ஆபத்தைக் குறிக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிநடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்/தமது’ என்ற மரியாதை வடிவங்கள் இயல்பாகக் கையாளப்பட்டுள்ளன. எபிரெய இணைவரிகளின் மறைத்துப் பாதுகாக்கும் இரட்டைப் படிமமும், நிழற்குடில்—கூடாரம்—கற்பாறை என்ற konkretமான காட்சித் தொடரும் பேணப்பட்டுள்ளன.
