  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
translation:
  language: ta
  text: 'யாவேவிடம்[a] நான் ஒன்றையே கேட்டிருக்கிறேன்; அதையே நாடுவேன்: என் வாழ்நாளெல்லாம் யாவேவின் இல்லத்தில் தங்கியிருக்கவும், யாவேவின் இனிமையைக்[b] காணவும், அவரது ஆலயத்தில் விசாரிக்கவும்[c].'
  philosophy: optimal-equivalence
