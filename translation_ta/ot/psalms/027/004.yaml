theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை பட்டத்தை அல்ல, தனிப்பட்ட தெய்வீகப் பெயரைப் பயன்படுத்துகிறது. ஆகவே பெயரைத் தமிழில் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது; பாரம்பரிய மாற்றீடு அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: נֹעַם יְהוָה என்பதன் பொருள் நிழல்
  choice: யாவேவின் இனிமை
  alternative: யாவேவின் அழகு; யாவேவின் தயவு
  rationale: சொல் அழகு, இனிமை, மகிழ்வூட்டும் தன்மை அல்லது தயவு எனப் பொருள்படக்கூடும். ‘இனிமை’ இந்த வழிபாட்டுச் சூழலில் இயல்பாக இருப்பதோடு, ஒரு குறிப்பிட்ட இறையியல் விளக்கத்துக்குள் பொருளைச் சுருக்காது.
- issue: וּלְבַקֵּר என்ற வினையின் ஆலயச் சூழலிலான பொருள்
  choice: ஆராய்ந்து தேடவும்
  alternative: விசாரிக்கவும்; தியானிக்கவும்
  rationale: வினையின் துல்லிய நிழல் உறுதியற்றது. விசாரணையும் கவனமான தேடலும் அடங்கும் வகையில் மொழிபெயர்த்து, தியானம் என்ற ஒரே விளக்கத்தைத் திணிக்காமல் மாற்றுகளை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதைமிக்க கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘குடியிருப்பேன்’ என்பதற்குப் பதில் ‘தங்கியிருந்து’ என்பது வாழ்நாள் முழுவதும் யாவேவின் சமூகத்தில் நிலைத்திருக்கும் ஏக்கத்தை இயல்பாகத் தருகிறது. மூலத்தின் ஒரே வேண்டுதல் என்ற அழுத்தமும், காணுதல் மற்றும் ஆலயத்தில் தேடுதல் என்ற இணை நோக்கங்களும் காக்கப்பட்டுள்ளன.
