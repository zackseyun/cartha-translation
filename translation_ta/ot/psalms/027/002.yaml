  text: בִּ/קְרֹ֤ב עָלַ֨/י מְרֵעִים֮ לֶ/אֱכֹ֪ל אֶת בְּשָׂ֫רִ֥/י צָרַ֣/י וְ/אֹיְבַ֣/י לִ֑/י הֵ֖מָּה כָשְׁל֣וּ וְ/נָפָֽלוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/002.yaml
  text: When evildoers came near me to devour my flesh[b][a], my adversaries and my enemies—they stumbled and fell.
translation:
  language: ta
  text: தீமை செய்வோர் என் சதையை விழுங்குவதற்காக[a] என்னை நெருங்கியபோது—என் பகைவர்களும் என் எதிரிகளுமான அவர்களே[b]—இடறி விழுந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் சதையைத் தின்பதற்காக.” இந்த எபிரெயச் சொற்றொடர் கொடூரமான தாக்குதலைச் சித்தரிக்கும் ஓர் உயிரோட்டமான உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “எனக்கு எதிரான என் பகைவர்களும் என் எதிரிகளும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: source_syntax
lexical_decisions:
- source_word: בִּקְרֹב עָלַי
  choice: என்னை நெருங்கியபோது
  rationale: ב prefixed infinitive construct supplies the temporal sense “when,” while קרב עלי is naturally expressed in Tamil as “when they came near me.” The hostile purpose is made clear by the following clause, so no extra verb such as “attack” is inserted.
- source_word: מְרֵעִים
  choice: தீமை செய்வோர்
  rationale: The participial form identifies people characterized by doing evil. This wording is natural, gender-neutral modern Tamil and preserves the active moral force.
- source_word: לֶאֱכֹל אֶת־בְּשָׂרִי
  choice: என் சதையை விழுங்குவதற்காக
  rationale: “விழுங்க” conveys the violent force of the image naturally in Tamil, while “சதை” retains the source text’s visceral reference to flesh rather than flattening it to “me” or “body.”
- source_word: צָרַי וְאֹיְבַי
  choice: என் பகைவர்களும் என் எதிரிகளும்
  rationale: The two coordinated hostile terms are both retained, preserving the Hebrew parallelism rather than collapsing them into a single designation.
- source_word: הֵמָּה
  choice: அவர்களே
  rationale: The emphatic independent pronoun is represented by the Tamil focus particle ஏ and, with dash punctuation, identifies the approaching evildoers with the psalmist’s adversaries and enemies.
- source_word: כָשְׁלוּ וְנָפָלוּ
  choice: இடறி விழுந்தார்கள்
  rationale: This concise verbal sequence naturally preserves both the stumbling and the subsequent fall without deciding whether the defeat is specifically physical, military, or figurative.
theological_decisions: []
translation_notes:
  register: நவீன தரநிலைத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. மூலத்தின் தீவிரமான “சதை” உருவகமும், இரு பகைமைச் சொற்களும், வலியுறுத்தப்பட்ட “அவர்களே” என்பதும் தக்கவைக்கப்பட்டுள்ளன.
