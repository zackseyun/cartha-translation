source:
  edition: WLC
  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: ta
  text: 'தாவீதுக்குரியது.[a]


    யாவே[b] என் ஒளியும் என் மீட்பும்;

    நான் யாருக்கு அஞ்சுவேன்?

    யாவே என் வாழ்வின் அரண்;

    நான் யாருக்கு பயப்படுவேன்?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாவீதினால்’ அல்லது ‘தாவீதுக்காக’ என்றும் மொழிபெயர்க்கலாம். தலைப்பிலுள்ள எபிரேய לְדָוִד என்பது ஆசிரியத்துவத்தையோ தாவீதுடனான தொடர்பையோ குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: எபிரேய மூலத்தில் தேவனுடைய தனிப்பெயரான יהוה (YHWH) உள்ளது; அது இங்கே ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது. சில மொழிபெயர்ப்புகள் இதை ‘கர்த்தர்’ என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்கு உரியது
  rationale: சங்கீதத் தலைப்பில் உள்ள לְ என்ற முன்னொட்டு படைப்புரிமை, தொடர்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதுக்கு உரியது’ என்பது இந்தத் தெளிவின்மையை ஓரளவு காத்து, ஆசிரியர் தாவீது என்று மட்டும் வரையறுக்காமல் விடுகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தேவனுடைய தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: אוֹרִי
  choice: என் ஒளி
  rationale: ‘ஒளி’ என்ற மூல உருவகத்தை விளக்கவுரையாக மாற்றாமல் அப்படியே காக்கிறது.
- source_word: וְיִשְׁעִי
  choice: என் மீட்பு
  rationale: יֵשַׁע குறிக்கும் விடுதலை, காப்பு, மீட்பு ஆகிய பரந்த பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִמִּי אִירָא
  choice: யாருக்கு நான் அஞ்சுவேன்?
  rationale: எபிரேயச் சொல்லமைப்பில் உள்ள ‘யாரிடமிருந்து’ என்ற கூறைச் சொற்சொல்லாகப் பின்பற்றாமல், தமிழில் அஞ்சுதலைக் குறிக்கும் இயல்பான வேற்றுமையுடன் நம்பிக்கை நிறைந்த வினாவாக வழங்குகிறது.
- source_word: מָעוֹז חַיַּי
  choice: என் வாழ்வின் அரண்
  rationale: מָעוֹז என்பதிலுள்ள வலிமைமிக்க பாதுகாப்பிடம் அல்லது கோட்டை என்ற உருவகத்தை ‘அரண்’ காக்கிறது; חַיַּי என்பதை ‘என் வாழ்வின்’ என இயல்பாக இணைக்கிறது.
- source_word: מִמִּי אֶפְחָד
  choice: யாருக்கு நான் பயப்படுவேன்?
  rationale: முதல் வினாவுக்கு இணையான அமைப்பைக் காத்து, פחד என்பதன் பயம் அல்லது திகில் சார்ந்த பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை ஒரு பட்டத்தால் மாற்றாமல் காக்கிறது.
- issue: יֵשַׁע என்பதன் பரந்த மீட்புப் பொருள்
  choice: மீட்பு
  alternative: இரட்சிப்பு
  rationale: இச்சூழலில் உடனடியான ஆபத்திலிருந்து காப்பையும் பரந்த இரட்சிப்பையும் சொல்லக்கூடிய மூலச்சொல்லை, குறிப்பிட்ட கோட்பாட்டுப் பொருளுக்கு மட்டும் சுருக்காமல் ‘மீட்பு’ என வழங்குகிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கவிதை இணைநிலையை காக்க ‘அஞ்சுவேன் / பயப்படுவேன்’ என்றும், பாதுகாப்பின் கோட்டை உருவகத்தை காக்க ‘அரண்’ என்றும் தேர்ந்தெடுக்கப்பட்டுள்ளது.
