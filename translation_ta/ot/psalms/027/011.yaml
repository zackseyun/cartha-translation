  edition: WLC
  text: ה֤וֹרֵ֥/נִי יְהוָ֗ה דַּ֫רְכֶּ֥/ךָ וּ֭/נְחֵ/נִי בְּ/אֹ֣רַח מִישׁ֑וֹר לְ֝מַ֗עַן שׁוֹרְרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/011.yaml
  text: Teach me your way[a], O Yahweh, and lead me on a level path because of my enemies.
translation:
  language: ta
  text: 'யாவே, உமது வழியை எனக்குப் போதித்தருளும்;

    என் பகைவர்களின் காரணமாகச் சமதளமான பாதையில் என்னை நடத்தும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: எனக்குக் கற்றுத்தாரும்
  rationale: ירה என்பதன் ஹிஃபில் வடிவம் ‘கற்பி/போதித்தரு’ என்ற பொருளைத் தருகிறது. வேண்டுதல் நடையில் இயல்பாகவும் கண்ணியமாகவும் இருப்பதற்காக ‘எனக்குக் கற்றுத்தாரும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் தெளிவாக ஒலிபெயர்க்கிறது.
- source_word: דַּרְכֶּךָ
  choice: உமது வழி
  rationale: דֶּרֶךְ என்பது நேரடியான பாதையையும் ஒருவரது நெறி அல்லது செயல்முறையையும் குறிக்கக்கூடும்; ‘உமது வழி’ இந்த இரு நுண்பொருள்களையும் தக்கவைக்கிறது.
- source_word: וּנְחֵנִי
  choice: என்னை நடத்தும்
  rationale: נחה என்பது வழிநடத்துதல் அல்லது முன்னின்று நடத்துதல். பாதை உருவகத்துடன் இயல்பாக இணைவதால் ‘என்னை நடத்தும்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בְּאֹרַח
  choice: பாதையில்
  rationale: אֹרַח என்பது பாதை அல்லது செல்லும் வழி. בְּ முன்னிடைச்சொல் தமிழில் இயல்பாக ‘பாதையில்’ என வழங்கப்பட்டுள்ளது.
- source_word: מִישׁוֹר
  choice: சமதளமான
  rationale: מִישׁוֹר அடிப்படையில் சமமான அல்லது மேடுபள்ளமற்ற நிலத்தைக் குறிக்கிறது; நீதி அல்லது நேர்மை என்ற விரிவான நுண்பொருளையும் அனுமதிக்கிறது. ‘சமதளமான’ அதன் முதன்மையான காட்சிப்படிமத்தைப் பாதுகாக்கிறது.
- source_word: לְמַעַן
  choice: காரணமாக
  rationale: இச்சூழலில் வேண்டுதலுக்கான காரணமாக எதிரிகளின் இருப்பைச் சுட்டுகிறது. ‘காரணமாக’ என்பது தமிழில் சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: שׁוֹרְרָי
  choice: என் பகைவர்கள்
  rationale: இந்தச் சொல் பகைமையுள்ள எதிரிகளைக் குறிக்கிறது; பதுங்கியிருந்து அல்லது வாய்ப்புக்காகக் கவனிக்கும் எதிரிகள் என்ற நுண்பொருளும் இருக்கலாம். முதன்மை உரையில் தெளிவான ‘என் பகைவர்கள்’ வைக்கப்பட்டு, குறிப்பான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா
  rationale: எபிரெய மூலத்தில் உள்ள இறைவனின் தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது; ‘யாவே’ என்பது மூல உச்சரிப்புக்கான பரவலாக ஏற்கப்பட்ட மறுவடிவை பிரதிபலிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், தனிப்பட்ட வேண்டுதலுக்கேற்ற கண்ணியமான இறைமுகப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘கற்றுத்தாரும்’, ‘நடத்தும்’ ஆகியவை பக்திநடையின் மரியாதையைத் தக்கவைக்கின்றன; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன. எபிரெயக் கவிதையின் இரு வேண்டுகோள் அமைப்பும் வரிப்பிரிப்பால் பாதுகாக்கப்பட்டுள்ளது.
