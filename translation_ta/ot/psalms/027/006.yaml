base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
translation:
  language: ta
  text: இப்போதோ என்னைச் சூழ்ந்திருக்கும் என் பகைவர்களுக்கு மேலாக என் தலை உயர்த்தப்படும். அவரது கூடாரத்தில் மகிழ்ச்சி ஆரவாரத்துடன் பலிகளைச் செலுத்துவேன்[a]; நான் பாடுவேன்; ஆம், யாவேக்கு இசை பாடுவேன்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “ஆரவாரத்தின் பலிகள்.” இச்சொற்றொடர் மகிழ்ச்சி ஆரவாரத்தால் சிறப்பிக்கப்படும் பலிகளையோ, ஆரவாரத்துடன் செலுத்தப்படும் பலிகளையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவரது கூடாரம்” என்பதில் உள்ள சுட்டுப்பெயர் சூழலின்படி பெரும்பாலும் யாவேவைக் குறிக்கிறது; அது சங்கீதக்காரரைக் குறிக்கலாம் என்றும் புரிந்துகொள்ளப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: இப்போது
  rationale: நிகழப்போகும் திருப்பத்தை இயல்பான நவீனத் தமிழில் குறிக்கிறது; வாவ் இணைப்பின் தொடர்ச்சி வசன ஓட்டத்தில் வெளிப்படுகிறது.
- source_word: יָרוּם רֹאשִׁי
  choice: என் தலை உயர்த்தப்படும்
  rationale: ‘தலை’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, மேன்மை, துணிவு, வெற்றி ஆகிய உட்பொருள்களைத் திறந்தவையாக வைத்திருக்கிறது.
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  choice: என்னைச் சூழ்ந்திருக்கும் என் பகைவர்களுக்கு மேலாக
  rationale: பகைவர்கள் சூழ்ந்திருப்பதையும் அவர்கள்மேல் உயர்த்தப்படுவதையும் தெளிவாகத் தருகிறது.
- source_word: וְאֶזְבְּחָה
  choice: பலிகளைச் செலுத்துவேன்
  rationale: கோஹோர்டேட்டிவின் உறுதியான நோக்கத்தை எதிர்கால வினையால் வெளிப்படுத்துகிறது; தமிழில் பலி செலுத்துதல் இயல்பான இணைச்சொல்.
- source_word: בְאָהֳלוֹ
  choice: அவருடைய கூடாரத்தில்
  rationale: ஆண்பால் ஒருமை சுட்டுப்பெயரைப் பாதுகாக்கிறது; சூழலில் அது யெகோவாவின் பரிசுத்த இடத்தைக் குறிக்கிறது.
- source_word: זִבְחֵי תְרוּעָה
  choice: மகிழ்ச்சி ஆரவாரத்துடன் பலிகளை
  rationale: תְרוּעָה என்பதின் உரத்த கொண்டாட்ட ஒலியைத் தருகிறது; அது பலிகளின் தன்மையையோ அவற்றுடன் நிகழும் ஆரவாரத்தையோ குறிக்கலாம் என்பதால் அடிக்குறிப்பு சேர்க்கப்பட்டுள்ளது.
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  choice: நான் பாடுவேன், ஆம், ... இசை பாடுவேன்
  rationale: இரு இணையான வழிபாட்டு வினைகளையும் அவற்றின் வலுப்படுத்தும் முன்னேற்றத்தையும் காக்கிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கு
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை பொதுவாக அறியப்படும் தமிழ் வடிவில் நேரடியாகக் குறிப்பிடுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் பொதுப்பட்டப்பெயர் அல்ல, நான்கு எழுத்து இறைப் பெயரே உள்ளது; அதனை பெயராகவே வெளிப்படுத்துகிறது. தமிழ் வாசகர்களிடையே பரவலாக அறியப்பட்ட வடிவம் ‘யெகோவா’.
- issue: בְאָהֳלוֹ என்பதிலுள்ள சுட்டுப்பெயரின் குறிப்பு
  choice: ‘அவருடைய கூடாரம்’ என்பது யெகோவாவின் கூடாரம்
  alternative: சங்கீதக்காரரின் கூடாரம்
  rationale: பலி மற்றும் யெகோவாவை நோக்கிய புகழ்ச்சி பற்றிய உடனடி சூழல், பரிசுத்த இடத்தைக் குறிக்கும் யெகோவாவின் கூடாரம் என்பதையே இயல்பான வாசிப்பாக்குகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘தலை உயர்த்தப்படும்’ என்ற எபிரெய உருவகம் அப்படியே காக்கப்பட்டுள்ளது; தேவையற்ற சமயப் பிரிவுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
