  text: ק֥וֹל יְהוָ֗ה עַל הַ֫/מָּ֥יִם אֵֽל הַ/כָּב֥וֹד הִרְעִ֑ים יְ֝הוָ֗ה עַל מַ֥יִם רַבִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/003.yaml
  text: The voice of Yahweh is over the waters[a]; the God of glory thunders[b], Yahweh is over many waters.
translation:
  language: ta
  text: 'நீர்ப்பரப்புகளின்மேல் யாவேயின் குரல் உள்ளது;


    மகிமையின் தேவன்[a] இடிமுழங்குகிறார்;


    பெரும் நீர்த்திரள்களின்மேல் யாவே இருக்கிறார்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மகிமையுள்ள தேவன்.’ எபிரெயச் சொற்றொடர் சொல்லுக்குச் சொல் ‘மகிமையின் தேவன்’ என உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில் இக்கூற்று வினையின்றி, சொல்லுக்குச் சொல் ‘பெரும் நீர்த்திரள்களின்மேல் யாவே’ என உள்ளது; தெளிவுக்காக ‘இருக்கிறார்’ சேர்க்கப்பட்டுள்ளது.
    reason: supplied_word
lexical_decisions:
- source_word: קוֹל
  choice: குரல்
  rationale: இச்சங்கீதத்தில் இது இடிமுழக்கத்தை யாவேயின் வல்லமையான உரையாகச் சித்தரிக்கிறது. ‘குரல்’ என்பது ஆள்தன்மையையும் கவித்துவ உருவகத்தையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: עַל הַמָּיִם
  choice: நீர்ப்பரப்புகளின்மேல்
  rationale: புயல் தோற்றத்தின் விரிவான நீர்ச் சூழலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; עַל என்பதன் ‘மேல்’ என்ற இடப்பொருளையும் காக்கிறது.
- source_word: אֵל הַכָּבוֹד
  choice: மகிமையின் தேவன்
  rationale: ‘மகிமையின் தேவன்’ என்ற எபிரெயக் கட்டமைப்பை நேரடியாகக் காக்கிறது; ‘மகிமையுள்ள தேவன்’ என்பதும் பொருளளவில் சாத்தியம்.
- source_word: הִרְעִים
  choice: இடிமுழங்குகிறார்
  rationale: רעם என்ற வினையின் குறிப்பான ‘இடிமுழங்கு’ பொருளையும், சங்கீதத்தின் நிகழ்கால உயிரோட்டத்தையும் வெளிப்படுத்துகிறது.
- source_word: מַיִם רַבִּים
  choice: பெரும் நீர்த்திரள்கள்
  rationale: பலவாகவும் பரந்ததாகவும் உள்ள நீரைக் குறிக்கும் எபிரெயக் கவித்துவச் சொல்லாட்சியை, ‘வெள்ளம்’ எனக் குறுக்காமல் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, இறைவனின் தனிப்பெயரே உள்ளது; அதனை ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: இடியை இறைவனின் குரலாகச் சித்தரிக்கும் கவித்துவ உருவகம்
  choice: ‘குரல்’ மற்றும் ‘இடிமுழங்குகிறார்’ ஆகிய இரண்டையும் தக்கவைத்தல்
  alternative: ‘யாவேயின் இடிமுழக்கம்’ என்று ஒரே வானிலைச் சொல்லாக்கமாக மாற்றுதல்
  rationale: மூலம் இடியையும் யாவேயின் குரலையும் கவித்துவமாக இணைக்கிறது. அவற்றை ஒன்றாகச் சுருக்காமல் வைப்பது உருவகத்தின் ஆள்தன்மையையும் இறையியல் வலிமையையும் காக்கிறது.
- issue: இறுதி வினையற்ற எபிரெயக் கூற்றைத் தமிழில் வெளிப்படுத்தல்
  choice: ‘இருக்கிறார்’ என்ற உள்ளுறை வினையைச் சேர்த்தல்
  alternative: ‘பெரும் நீர்த்திரள்களின்மேல் யாவே’
  rationale: எபிரெயில் வினை வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் முழுமையான மற்றும் தெளிவான இணைக் கூற்றை உருவாக்க ‘இருக்கிறார்’ சேர்க்கப்படுகிறது; அடிக்குறிப்பு மூலத்தின் சுருக்கமான வடிவத்தைப் பதிவு செய்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று இணைக் கூற்றுகளின் ஓசைநயமும் புயல்-இறைத்தோற்ற உருவகமும் காக்கப்பட்டுள்ளன.
