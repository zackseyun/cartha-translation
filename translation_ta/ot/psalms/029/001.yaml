  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד הָב֣וּ לַֽ֭/יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/001.yaml
  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
translation:
  language: ta
  text: 'தாவீதின் சங்கீதம்.


    வல்லவர்களின் புதல்வர்களே[a], யாவேக்குச் செலுத்துங்கள்;

    மகிமையையும் வல்லமையையும் யாவேக்குச் செலுத்துங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவனின் புதல்வர்களே,” “தெய்வங்களின் புதல்வர்களே,” அல்லது “வானுலக உயிர்களே.” இந்த எபிரெயச் சொற்றொடர் வானுலக மன்றத்தின் உறுப்பினர்களைக் குறிக்கக்கூடும்.
    reason: בְּנֵי אֵלִים என்பதிலுள்ள אֵלִים-இன் துல்லியமான பொருள் விவாதத்திற்குரியது; மாற்று வாசிப்புகளையும் சாத்தியமான குறிப்பையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: சங்கீத நூலின் தலைப்புகளில் வரும் இச்சொல்லுக்கான நிலைபெற்ற, இலக்கியச் சூழலுக்கு ஏற்ற தமிழ் இணைச்சொல்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: לְ என்னும் முன்னொட்டு ஆசிரியத்துவம், உடைமை, தொடர்பு, அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதின்’ என்பது ‘தாவீது இயற்றியது’ என்று முழுமையாகத் தீர்மானிக்காமல் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הָבוּ
  choice: செலுத்துங்கள்
  rationale: இங்கு பொருளை நேரடியாகக் ‘கொடுப்பது’ அல்ல, கடவுளுக்கு உரிய மகிமையையும் வல்லமையையும் அங்கீகரித்து அவருக்குச் செலுத்துவதே கருத்து. ‘செலுத்துங்கள்’ என்பது கட்டளை வடிவையும் வழிபாட்டுச் சூழலையும் இயல்பாகத் தருகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: எபிரெய மூலத்தில் உள்ள தனிப்பெயரான יהוה-ஐ பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்த்து, வேற்றுமை உருபுடன் இயல்பாக வழங்குகிறது.
- source_word: בְּנֵי אֵלִים
  choice: தேவனின் புதல்வர்களே
  rationale: ‘மகன்கள்/புதல்வர்கள்’ என்ற எபிரெய உருவகத்தைப் பாதுகாத்து, விளி வடிவில் தருகிறது. இச்சொற்றொடர் வானுலக மன்றத்தைச் சேர்ந்தவர்களைக் குறிக்கலாம்; ஆயினும் אֵלִים என்பதன் எண்ணும் நுட்பமும் விவாதத்திற்குரியதால் மாற்று வாசிப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: כָּבוֹד
  choice: மகிமை
  rationale: தெய்வீக மாட்சியையும் கனத்தையும் குறிக்கும் நிலைபெற்ற தமிழ் சொல்; சங்கீதக் கவிதையின் உயரிய நடைக்கும் ஏற்றது.
- source_word: וָעֹז
  choice: வல்லமை
  rationale: עֹז குறிக்கும் பலம் அல்லது ஆற்றலை உயரிய கவிதை நடையில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்னும் தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூல உரை உடன்படிக்கையின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை பொதுப் பட்டப்பெயராக மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- issue: בְּנֵי אֵלִים என்பவர்களின் அடையாளம்
  choice: தேவனின் புதல்வர்கள்
  alternative: வானுலக உயிர்கள் / தெய்வங்களின் புதல்வர்கள் / வல்லவர்களின் புதல்வர்கள்
  rationale: இவர்கள் வானுலக மன்றத்தின் உறுப்பினர்களாக இருக்க வாய்ப்புள்ளது. ஆனால் אֵלִים என்பதன் துல்லியமான பொருளை பிரதான உரை மிகையாகத் தீர்மானிக்காமல், மூலத்தின் உறவுமுறை உருவகத்தை வைத்திருக்கிறது; முக்கிய மாற்று விளக்கங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய வரியின் மீளுரைத்தல் பாதுகாக்கப்பட்டுள்ளது. ‘புதல்வர்கள்’ என்பது ‘மக்கள்’ என்ற சொல்லின் இருபொருள் குழப்பத்தைத் தவிர்த்து, בְּנֵי என்பதன் உறவுமுறை உருவகத்தைத் தெளிவாகத் தருகிறது.
