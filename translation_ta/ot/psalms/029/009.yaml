  edition: WLC
  text: ק֤וֹל יְהוָ֨ה יְחוֹלֵ֣ל אַיָּלוֹת֮ וַֽ/יֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת וּ/בְ/הֵיכָל֑/וֹ כֻּ֝לּ֗/וֹ אֹמֵ֥ר כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
translation:
  language: ta
  text: யாவேயின் குரல் பெண்மான்களைக் குட்டி ஈனச் செய்து[a], காடுகளை இலைகளற்றவையாக்குகிறது; அவருடைய ஆலயத்தில் உள்ள அனைவரும், “மகிமை!” என்று கூறுகின்றனர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பெண்மான்களைத் துடிக்கச் செய்கிறது,” அல்லது “பெண்மான்களைப் பேறுகால வேதனையில் துடிக்கச் செய்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  choice: யாவேயின் குரல்
  rationale: கட்டமைப்புத் தொடரை இயல்பான தமிழில் உரிமைத் தொடராக மொழிபெயர்த்து, יהוה என்ற தனிப்பெயரை ‘யாவே’ என ஒலிபெயர்த்துள்ளது.
- source_word: יְחוֹלֵ֣ל
  choice: ஈனச் செய்கிறது
  rationale: חול என்பது துடித்தல் அல்லது பேறுகால வேதனையில் உழலுதல் எனப் பொருள்படலாம்; பெண்மான்களுடன் வரும் இத்தொடரில் ‘ஈனச் செய்கிறது’ என்பது இயல்பான சூழற்பொருள். பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளன.
- source_word: אַיָּלוֹת֮
  choice: பெண்மான்களை
  rationale: எபிரெயச் சொல் பெண்பால் பன்மையாக இருப்பதால், விலங்கின் பாலினத்தைத் தமிழிலும் வெளிப்படையாகக் காக்கிறது.
- source_word: וַֽיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת
  choice: காடுகளை வெறுமையாக்குகிறது
  rationale: חשׂף என்பதன் உரித்தல், வெளிப்படுத்தல், வெறுமையாக்கல் ஆகிய வலுவான புயல் விளைவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּבְהֵיכָלוֹ
  choice: அவருடைய ஆலயத்தில்
  rationale: சங்கீதத்தின் வழிபாட்டுச் சூழலும் ‘மகிமை!’ என்ற வாழ்த்தொலியும் ‘ஆலயம்’ என்ற பொருளை ஆதரிக்கின்றன; ‘அரண்மனை’ என்ற பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: כֻּלּוֹ אֹמֵר
  choice: உள்ள அனைவரும் ... என்கிறார்கள்
  rationale: ஒருமை வடிவிலுள்ள எபிரெயப் பங்கேற்புச் சொல் கூட்டத்திலுள்ள ஒவ்வொருவரையும் பகிர்ந்துணர்த்தும் வகையில் வருகிறது; தமிழில் இயல்பான பன்மை வினையால் தரப்பட்டுள்ளது.
- source_word: כָּבֽוֹד
  choice: “மகிமை!”
  rationale: வழிபாட்டு வாழ்த்தொலியின் சுருக்கத்தையும் வலிமையையும் ஒருசொல் வியப்புரையாகக் காக்கிறது.
theological_decisions:
- issue: הֵיכָל என்பது யாவேயின் ஆலயத்தையா அரண்மனையையா குறிக்கிறது
  choice: ஆலயம்
  alternative: அரண்மனை
  rationale: வழிபாட்டுச் சூழல் ‘ஆலயம்’ என்பதற்கு முன்னுரிமை அளிக்கிறது. ஆயினும், யாவேயின் அரசாட்சியை வலியுறுத்தும் சங்கீதத்தில் ‘அரண்மனை’ என்பதும் உண்மையான சொற்பொருள் சாத்தியம் என்பதால் அதை அடிக்குறிப்பில் காத்துள்ளது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. புயலின் வன்மையையும் ஆலய வாழ்த்தொலியின் சுருக்கத்தையும் காக்கும் வகையில் வாக்கியம் அமைக்கப்பட்டுள்ளது; அரிதான அல்லது பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
