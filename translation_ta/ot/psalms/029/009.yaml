revisions:
- from: யாவேயின் குரல் பெண்மான்களை ஈனச் செய்கிறது[a]; காடுகளை வெறுமையாக்குகிறது. அவருடைய ஆலயத்தில்[b] உள்ள அனைவரும், “மகிமை!” என்கிறார்கள்.
  to: யாவேயின் குரல் பெண்மான்களைக் குட்டி ஈனச் செய்து[a], காடுகளை இலைகளற்றவையாக்குகிறது; அவருடைய ஆலயத்தில் உள்ள அனைவரும், “மகிமை!” என்று கூறுகின்றனர்.
  rationale: The revision corrects the forest clause so that it depicts stripping bare rather than emptying, clarifies the birth idiom, and slightly elevates the final reporting verb. The temple/palace ambiguity and the labor/writhing lexical ambiguity remain preserved in the footnotes. Footnote b is retained as supplied, although no marker is placed in the verse because the current project text treats “ஆலயம்” as the unmarked primary reading.
