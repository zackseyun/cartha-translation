  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
translation:
  language: ta
  text: யாவே தமது மக்களுக்கு வலிமை அளிக்கிறார்[a]; யாவே தமது மக்களை அமைதியால் ஆசீர்வதிக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே தமது மக்களுக்கு வலிமை அளிப்பார்; யாவே தமது மக்களை அமைதியால் ஆசீர்வதிப்பார்.” எபிரெய நிறைவுறா வினை வடிவங்களை எதிர்காலப் பொருளிலும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “அமைதி” என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் ஷாலோம்; அது முழுநலம், நல்வாழ்வு ஆகியவற்றையும் உள்ளடக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனின் தனிப்பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: עֹז
  choice: வலிமை
  rationale: இச்சொல் வலிமை, ஆற்றல் என்ற பொருள்களைக் கொண்டது; அளிக்கிறார் என்ற வினையுடன் ‘வலிமை’ இயல்பாக அமைந்து, சங்கீதத்தின் இறை வல்லமைச் சூழலையும் காக்கிறது.
- source_word: לְעַמּוֹ
  choice: தமது மக்களுக்கு
  rationale: לְ இங்கு கொடுப்பதன் மறைமுகச் செயப்படுபொருளைக் குறிக்கிறது; உடைமைப் பின்னொட்டு யாவேயுடைய மக்களைக் குறிக்கிறது.
- source_word: יִתֵּן
  choice: அளிக்கிறார்
  rationale: எபிரெய நிறைவுறா வினை வடிவத்தை, யாவே தமது மக்களுக்குச் செய்வதை உறுதியாக அறிவிக்கும் பொதுநிகழ்காலமாக எடுத்துரைக்கிறது.
- source_word: יְבָרֵךְ
  choice: ஆசீர்வதிக்கிறார்
  rationale: முதல் அரையடியுடன் இணையான உறுதியான அறிவிப்பாக வினையின் செயற்பாட்டுப் பொருளைக் காக்கிறது.
- source_word: אֶת עַמּוֹ
  choice: தமது மக்களை
  rationale: நேரடிச் செயப்படுபொருளையும் எபிரெயக் கவிதையின் மீளுரைப்பையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בַשָּׁלוֹם
  choice: அமைதியால்
  rationale: שָׁלוֹם என்பதன் மையப் பொருளான அமைதியை இயல்பான நவீன தமிழில் தருகிறது; அதன் விரிவான முழுநலம், நல்வாழ்வு ஆகிய பொருள்கள் அடிக்குறிப்பில் சுட்டப்படுகின்றன.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக வருவதால், அதை ஒரு பட்டமாக மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது உரையின் தன்மையைப் பாதுகாக்கிறது.
- issue: יִתֵּן / יְבָרֵךְ ஆகிய நிறைவுறா வினைகளின் காலமும் வினைநிலையும்
  choice: 'உறுதியான பொதுநிகழ்காலம்: ‘அளிக்கிறார் … ஆசீர்வதிக்கிறார்’'
  alternative: 'எதிர்காலம்: ‘அளிப்பார் … ஆசீர்வதிப்பார்’; விருப்பம்: ‘அளிப்பாராக … ஆசீர்வதிப்பாராக’'
  rationale: சங்கீதத்தின் முடிவில் இவை யாவே தமது மக்களுக்குச் செய்வதைப் பற்றிய நம்பிக்கையான அறிவிப்புகளாக வாசிக்கப்படலாம். இருப்பினும், எபிரெய வடிவங்களுக்கு எதிர்காலப் பொருளும் இருக்கக்கூடும் என்பதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது; விருப்பப் பொருள் இலக்கண ரீதியாகச் சாத்தியமாயினும் இச்சூழலில் குறைவாக ஏற்றது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய இணை அமைப்பைக் காக்க ‘தமது மக்களுக்கு/தமது மக்களை’ என்ற மீளுரை விடப்பட்டுள்ளது. ‘யாவே’ தனிப்பெயராகவும், ‘அமைதி’ ஷாலோமின் மையப் பொருளாகவும் வழங்கப்பட்டுள்ளன.
