source:
  edition: WLC
  text: ק֣וֹל יְ֭הוָה יָחִ֣יל מִדְבָּ֑ר יָחִ֥יל יְ֝הוָ֗ה מִדְבַּ֥ר קָדֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/008.yaml
  text: The voice of Yahweh shakes the wilderness[a]; Yahweh shakes the wilderness of Kadesh.
translation:
  language: ta
  text: யாவேயின் குரல் வனாந்தரத்தை நடுங்கச் செய்கிறது[a]; காதேசின் வனாந்தரத்தை யாவே நடுங்கச் செய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வனாந்தரத்தைத் துடிக்கச் செய்கிறது’ அல்லது ‘வனாந்தரத்தை அதிரச் செய்கிறது.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל
  choice: குரல்
  rationale: சங்கீதம் 29-ல் திரும்பத் திரும்ப வரும் கவிதைத் தொடரின் தனிப்பட்ட, ஆற்றல்மிக்க தன்மையைப் பாதுகாக்கிறது; ‘ஒலி’ என்பதைவிட இது பொருத்தமானது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: יָחִיל
  choice: நடுங்கச் செய்கிறது / நடுங்கச் செய்கிறார்
  rationale: חול என்பதன் ஹிஃபீல் வடிவம் ‘நடுங்கச் செய்தல்,’ ‘துடிக்கச் செய்தல்,’ அல்லது ‘அதிரச் செய்தல்’ எனப் பொருள்படலாம். படைப்புலகின்மீது யாவேயின் குரல் ஏற்படுத்தும் தாக்கத்தை இயல்பான நவீன தமிழில் ‘நடுங்கச் செய்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִדְבָּר
  choice: வனாந்தரம்
  rationale: பயிரிடப்படாத பரந்த பாழ்நிலத்தைக் குறிக்கும் எபிரெயச் சொல்லின் விரிவான பொருளை இது தக்கவைக்கிறது; ‘பாலைவனம்’ என்பது காலநிலை சார்ந்த குறுகிய பொருளைத் தரக்கூடும்.
- source_word: מִדְבַּר קָדֵשׁ
  choice: காதேசின் வனாந்தரம்
  rationale: எபிரெயக் கட்டமைப்பின் உடைமைத் தொடர்பையும் ‘காதேஸ்’ என்ற இடப்பெயரின் புவியியல் குறிப்பையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: வசனம் இறைவனின் தனிப்பட்ட பெயரான நான்கெழுத்துப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது மூலத்தின் தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கவிதைத் திருப்புரையான ‘யாவேயின் குரல்’ பாதுகாக்கப்பட்டுள்ளது; முதல் அடியில் ‘குரல்’ எழுவாயாக இருப்பதால் ‘செய்கிறது’ என்றும், இரண்டாம் அடியில் யாவே எழுவாயாக இருப்பதால் மரியாதை ஒருமையில் ‘செய்கிறார்’ என்றும் பயன்படுத்தப்பட்டுள்ளது.
