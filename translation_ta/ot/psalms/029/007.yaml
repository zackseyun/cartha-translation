  text: 'யாவேயின் குரல்

    நெருப்புச் சுடர்களைப் பிளக்கிறது[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீயின் பளிச்சிடல்கள்”; இச்சங்கீதத்தின் புயல்-இறைவெளிப்பாட்டுக் காட்சியில் இது மின்னலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: குரல்
  rationale: இச்சொல் ‘குரல்’ அல்லது ‘ஒலி’ எனப் பொருள்படும். சங்கீதம் 29-ல் திரும்பத் திரும்ப வரும் கவித்துவத் தொடரையும், இடிமுழக்கத்தின் வழியே யாவேயின் வல்லமையான உரை வெளிப்படுவதையும் ‘குரல்’ பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய தனிப்பெயரின் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பாக ‘யாவே’ வழங்கப்படுகிறது.
- source_word: חֹצֵב
  choice: பிளந்தெடுக்கிறது
  rationale: חצב என்பது கல் போன்றவற்றை வெட்டி அல்லது பிளந்து எடுப்பதைக் குறிக்கும். இங்கு யாவேயின் குரல் தீச்சுடர்களைப் பிளந்து வெளிக்கொணரும் உயிரோட்டமான உருவகத்தை ‘பிளந்தெடுக்கிறது’ இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לַהֲבוֹת
  choice: சுடர்கள்
  rationale: பன்மைச் சொல் தீச்சுடர்கள் அல்லது தீ நாக்குகளைக் குறிக்கிறது; புயல் சூழலில் மின்னல் ஒளிப்பிளப்புகளையும் சுட்டலாம். ‘சுடர்கள்’ அடிப்படை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: இது நேரடியாக ‘நெருப்பு’ என்று பொருள்படும். לַהֲבוֹת אֵשׁ என்ற எபிரேயச் சேர்க்கையின் வலியுறுத்தலை ‘நெருப்புச் சுடர்கள்’ தக்கவைக்கிறது.
theological_decisions:
- issue: புயல் காட்சியில் தெய்வீகச் செயலைப் பாதுகாத்துக்கொண்டே, அதை நவீன வானிலை விளக்கமாக மிகையாகப் பொருள்கொள்ளாமல் மொழிபெயர்த்தல்
  choice: ‘நெருப்புச் சுடர்களைப் பிளந்தெடுக்கிறது’ என்ற திடமான கவித்துவ உருவகம் முதன்மை உரையில் வைக்கப்பட்டுள்ளது.
  alternative: ‘மின்னல் ஒளிப்பிளப்புகளை வெளிப்படுத்துகிறது’
  rationale: எபிரேய உரை நெருப்புச் சுடர்கள் என்ற உருவகத்தையும் யாவேயின் குரலின் நேரடிச் செயலையும் முன்வைக்கிறது. சூழலில் மின்னல் குறிக்கப்பட்டிருக்க வாய்ப்பிருந்தாலும், அதை முதன்மை உரையிலேயே வெளிப்படையாகச் சொல்லுவது கவிதையின் உண்மையான உருவகத் திறப்பைக் குறைக்கும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சுருக்கமான கவிதை நடையும் எபிரேய மூலத்தின் திடமான உருவகமும் காக்கப்பட்டுள்ளன. ‘யாவே’ தனிப்பெயராகவும், ‘பிளந்தெடுக்கிறது’ חצב என்பதன் செறிவான செயற்பொருளுக்காகவும் பயன்படுத்தப்பட்டுள்ளது.
