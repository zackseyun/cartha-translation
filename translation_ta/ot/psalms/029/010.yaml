base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/010.yaml
  text: Yahweh sat enthroned over the flood[a]; Yahweh sits enthroned as King forever.
translation:
  language: ta
  text: யாவே பெருவெள்ளத்தின்மேல் வீற்றிருந்தார்[a]; யாவே என்றென்றும் அரசராக வீற்றிருக்கிறார்.
  philosophy: optimal-equivalence
