lexical_decisions:
- source_word: קוֹל יְהוָה
  choice: யாவேயின் குரல்
  rationale: קוֹל என்பதற்கு ‘குரல்’ அல்லது ‘ஒலி’ என்று பொருள் கொள்ளலாம். சங்கீதம் முழுவதும் திரும்பத் திரும்ப வரும் தனிப்பட்ட, இடிமுழக்கம் போன்ற இறை உரைத்தலைத் தக்கவைக்க ‘குரல்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருநான்கெழுத்துப் பெயரான יהוה ஒரு பட்டமாக மாற்றப்படாமல், தமிழில் தெய்வீகப் பெயரின் ஒலிபெயர்ப்பாக ‘யாவே’ என்று தரப்படுகிறது.
- source_word: שֹׁבֵר
  choice: முறிக்கிறது
  rationale: Qal வினையெச்சம் இங்கு உயிரோட்டமுள்ள நிகழ்காலச் செயலைக் காட்டுகிறது. ‘குரல்’ எழுவாயாக இருப்பதால் இயல்பான தமிழ் ஒருமை அஃறிணை வினை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: אֲרָזִים
  choice: கேதுரு மரங்கள்
  rationale: இது பொதுவாகக் கேதுரு மரங்களைக் குறிக்கும் பன்மைச் சொல். தமிழில் மரவகை தெளிவாகத் தெரிய ‘மரங்கள்’ சேர்க்கப்பட்டது.
- source_word: וַיְשַׁבֵּר
  choice: நொறுக்குகிறார்
  rationale: முதல் அரையடியிலுள்ள שבר என்ற அதே வேர்ச்சொல் இங்கும் வந்தாலும், Piel வடிவமும் இணைவரியின் தீவிரமும் முழுமையாக உடைக்கும் செயலை உணர்த்துகின்றன. ஆகவே இயல்பான தமிழில் ‘நொறுக்குகிறார்’ எனத் தீவிரப்படுத்தப்பட்டது; கவிதையில் உள்ள செயல் தொடர்ச்சியைப் பேண நிகழ்காலம் பயன்படுத்தப்பட்டது.
- source_word: אֶת אַרְזֵי הַלְּבָנוֹן
  choice: லெபனோனின் கேதுரு மரங்களை
  rationale: இந்த இணைப்புச் சொற்றொடர் லெபனோனோடு புகழ்பெற்று தொடர்புடைய கேதுரு மரங்களைக் குறிக்கிறது. உடைமை அமைப்பு தமிழில் சுருக்கமாகவும் இயல்பாகவும் தரப்பட்டது.
- source_word: הַלְּבָנוֹן
  choice: லெபனோன்
  rationale: இடப்பெயர் நவீனத் தமிழில் வழக்கமான வடிவில் ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரை இங்கு יהוה என்ற தனிப்பட்ட பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது உடன்படிக்கையின் பெயரைப் பேணுகிறது; ‘யெகோவா’ என்பது பிற்கால கலப்பு உச்சரிப்பைப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீனத் தரநிலைத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்குரிய கண்ணியமான கவித்துவ நடையுடனும் மொழிபெயர்க்கப்பட்டது. முதல் அரையடியில் ‘குரல்’ எழுவாயாக இருப்பதால் ‘முறிக்கிறது’ என்றும், இரண்டாவது அரையடியில் யாவே எழுவாயாக இருப்பதால் மரியாதை ஒருமையான ‘நொறுக்குகிறார்’ என்றும் அமைக்கப்பட்டது.
