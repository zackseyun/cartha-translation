  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
translation:
  language: ta
  text: யாவேயின் குரல்[a] கேதுரு மரங்களை முறிக்கிறது; யாவே லெபனோனின் கேதுரு மரங்களை நொறுக்குகிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் ஒலி.” எபிரெய மொழியின் קוֹל என்ற சொல் ‘குரல்’ என்றும் ‘ஒலி’ என்றும் பொருள்படும். இந்தச் சங்கீதத்தில் யாவே தனிப்பட்ட முறையில் இடிமுழக்கம் போல உரைப்பதாகத் தொடர்ந்து சித்தரிக்கப்படுவதால் இங்கு ‘குரல்’ என்று தரப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: இரு அரையடிகளிலும் எபிரெய உரை ‘முறி’ என்ற ஒரே வேர்ச்சொல்லையே பயன்படுத்துகிறது; இரண்டாம் அரையடியின் தீவிரத்தை இயல்பான தமிழில் வெளிப்படுத்த அது ‘நொறுக்குகிறார்’ என்று தரப்பட்டுள்ளது.
