base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/000.yaml
  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
translation:
  language: ta
  text: 'தாவீதின் சங்கீதம்.


    வானுலகத்தவர்களே[a], யாவேவுக்குச் செலுத்துங்கள்;

    மகிமையையும் வல்லமையையும் யாவேவுக்குச் செலுத்துங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் நேரடியாக, ‘தெய்வீக உயிரினங்களின் புதல்வர்களே’ அல்லது ‘தேவர்களின் புதல்வர்களே’ என்று பொருள்படலாம். இது பெரும்பாலும் வானுலக மன்றத்தைச் சேர்ந்தவர்களைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: தாவீதின் சங்கீதம்
  rationale: The superscription is rendered in the familiar, dignified Tamil form; the Hebrew construction can denote a psalm belonging to, by, or associated with David, and the concise Tamil genitive preserves that breadth.
- source_word: הָבוּ
  choice: செலுத்துங்கள்
  rationale: The repeated imperative calls the addressees to acknowledge or ascribe what belongs to Yahweh. ‘செலுத்துங்கள்’ is natural Tamil in combination with ‘மகிமை’ and ‘வல்லமை’ and preserves the repeated summons.
- source_word: בְּנֵי אֵלִים
  choice: வானுலகத்தவர்களே[a]
  rationale: The Hebrew literally has ‘sons of gods/divine ones’ and most likely addresses heavenly beings. This wording communicates that referent naturally without implying physical descent; the footnote preserves the literal alternatives and ambiguity.
- source_word: יְהוָה
  choice: யாவே
  rationale: The divine name is represented as a proper name rather than replaced by a title such as ‘ஆண்டவர்.’
- source_word: כָּבוֹד וָעֹז
  choice: மகிமையையும் வல்லமையையும்
  rationale: This directly represents the paired nouns ‘glory’ and ‘strength’ in clear, established modern Tamil.
theological_decisions:
- issue: Identity of בְּנֵי אֵלִים
  choice: The main text addresses heavenly beings while marking the phrase for a note.
  alternative: வல்லமையுள்ளவர்களின் மக்களே / தேவனுடைய மக்களே / தெய்வீகப் புதல்வர்களே
  rationale: The expression likely refers to members of the heavenly assembly, but its literal wording and exact nuance are debated. The translation gives the probable referent while the note preserves genuine lexical and theological ambiguity.
- issue: Rendering of the divine name יהוה
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: Using the personal name reflects the Hebrew source transparently and avoids silently converting it into a title.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. மூலத்தில் இருமுறை வரும் கட்டளை வடிவம் தமிழிலும் இருமுறை வைக்கப்பட்டுள்ளது. ‘வானுலகத்தவர்களே’ என்பது பொதுவாசகருக்குத் தெளிவான வடிவம்; மூலத்தின் நேரடி உருவகமும் மாற்று வாசிப்புகளும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
