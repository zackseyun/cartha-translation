  text: וַ/יַּרְקִידֵ֥/ם כְּמוֹ עֵ֑גֶל לְבָנ֥וֹן וְ֝/שִׂרְיֹ֗ן כְּמ֣וֹ בֶן רְאֵמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/006.yaml
  text: He makes Lebanon skip like a calf[c][b][a], and Sirion like a young wild ox.
translation:
  language: ta
  text: அவர் லெபனோனைக் கன்றைப்போல் துள்ளச் செய்கிறார்; சீரியோனை[a] இளம் காட்டெருதைப்போல் துள்ளச் செய்கிறார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சீரியோன் என்பது எர்மோன் மலைக்கு வழங்கப்பட்ட மற்றொரு பெயர்.
    reason: cross_reference
  - marker: b
    text: எபிரெயத்தில், “காட்டெருதுகளின் மகனைப்போல்” என்று சொல்லர்த்தமாக உள்ளது; இது ஓர் இளம் காட்டெருதைக் குறிக்கும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְקִידֵם
  choice: துள்ளச் செய்கிறார்
  rationale: רקד என்பதன் ஹிஃபில் வடிவம் ‘துள்ளச் செய்தல்’ என்ற காரணவினைப் பொருளைத் தருகிறது. கன்றும் இளம் காட்டெருதும் துள்ளும் உயிரோட்டமான காட்சிக்கு இது இயல்பாகப் பொருந்துகிறது. எபிரெயத்தில் உள்ள பன்மைச் சுட்டுப்பெயரின் குறிப்பை இணை அமைப்பில் லெபனோன், சீரியோன் என்று வெளிப்படுத்தியுள்ளோம்.
- source_word: כְּמוֹ עֵגֶל
  choice: கன்றைப்போல்
  rationale: עֵגֶל என்பது பொதுவாக இளம் மாட்டினமாகிய கன்றைக் குறிக்கிறது; உவமையின் இளமைத் துள்ளலை இது தெளிவாகக் காட்டுகிறது.
- source_word: לְבָנוֹן
  choice: லெபனோன்
  rationale: இடப்பெயரை நவீனத் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பில் தருகிறது.
- source_word: וְשִׂרְיֹן
  choice: சீரியோனை
  rationale: மூல எபிரெயம் எர்மோன் என்பதற்குப் பதிலாக சீரியோன் என்ற பெயரையே பயன்படுத்துவதால் அதைத் தக்கவைத்துள்ளோம்; அதன் அடையாளம் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: כְּמוֹ בֶן רְאֵמִים
  choice: இளம் காட்டெருதைப்போல்
  rationale: בֶן இங்கு ‘இளம் குட்டி/இளையது’ என்ற மரபுத்தொடர்ப் பொருளில் வருகிறது; רְאֵם தற்போதைய சொற்பொருள் ஆய்வின்படி காட்டெருது எனப் புரிந்துகொள்ளப்படுகிறது.
