  choice: வழிபடுங்கள்
  rationale: சொல்லின் அடிப்படைப் பொருள் பணிந்து விழுதல் அல்லது வணங்குதல் என்றாலும், இங்கு யாவேவை நோக்கிய வழிபாட்டுச் செயலை இயல்பான தமிழில் ‘வழிபடுங்கள்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: பரிசுத்தப் பேரழகில்
  rationale: הָדָר என்பதிலுள்ள அழகு, மேன்மை, அலங்காரம் ஆகிய பொருள் நிழல்களையும் קֹדֶשׁ என்பதிலுள்ள பரிசுத்தத்தையும் இச்சுருக்கமான கவித்துவ மொழிபெயர்ப்பு தக்கவைக்கிறது; பரிசுத்தத்தின் மேன்மையா, புனித உடையா என்பதை முதன்மை உரை மிகையாகத் தீர்மானிப்பதில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: எபிரெய உரை நான்கெழுத்து உடன்படிக்கைப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. அதை ஒரு பட்டமாக மாற்றாமல், வெளிப்படுத்தப்பட்ட தனிப்பெயராக ‘யாவே’ என்று வழங்குவது மூலத்தின் வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בְּהַדְרַת קֹדֶשׁ என்பதன் விளக்கம்
  choice: பரிசுத்தப் பேரழகில்
  alternative: பரிசுத்தத்தின் பேரழகில்; பரிசுத்த உடையணிந்து
  rationale: எபிரெயச் சொற்றொடர் பரிசுத்தத்தின் ஒளிமிகு மேன்மையையோ வழிபாட்டுக்குரிய புனித ஆடையையோ குறிக்கக்கூடும். முதன்மை மொழிபெயர்ப்பு கவித்துவத் தெளிவின்மையைப் பாதுகாக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்கேற்ற கண்ணியமான கவித்துவ நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘பரிசுத்தம்’, ‘மகிமை’, ‘வழிபடுங்கள்’ ஆகியவை பொதுவாகப் புரிந்துகொள்ளப்படும் வேதாகமச் சொற்களாகத் தக்கவைக்கப்பட்டுள்ளன; அரிதான பழந்தமிழ் அமைப்புகள் தவிர்க்கப்பட்டுள்ளன.
