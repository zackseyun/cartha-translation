source:
  edition: WLC
  text: קוֹל יְהוָ֥ה בַּ/כֹּ֑חַ ק֥וֹל יְ֝הוָ֗ה בֶּ/הָדָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/004.yaml
  text: The voice of Yahweh is powerful[b][a]; the voice of Yahweh is majestic.
translation:
  language: ta
  text: யாவேவின் குரல் வல்லமையானது[b][a]; யாவேவின் குரல் மாட்சிமைமிக்கது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேவின் குரல் வல்லமையுடன் உள்ளது; யாவேவின் குரல் மாட்சிமையுடன் உள்ளது.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘YHWH’; மரபாக ‘கர்த்தர்’ என்று மொழிபெயர்க்கப்படுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: குரல்
  rationale: இச்சங்கீதத்தில் மீண்டும் மீண்டும் வரும் சொற்றொடரில், தனிப்பட்டவராகச் செயல்படும் யெகோவாவின் இடிமுழக்கம் போன்ற உரைப்பை ‘குரல்’ இயல்பாக வெளிப்படுத்துகிறது; ‘ஒலி’ என்று மொழிபெயர்த்தால் அந்தத் தனிப்பட்ட செயற்பாடு மங்கக்கூடும்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் திருப்பெயரான יהוה என்பதை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என்ற பெயர்வடிவில் தருகிறது.
- source_word: בַּכֹּחַ
  choice: வல்லமையோடு
  rationale: בְּ முன்னொட்டுடன் வரும் כֹּחַ, ‘வல்லமையோடு’ அல்லது விளக்கநிலையில் ‘வல்லமையுள்ளது’ எனப் பொருள்படலாம். பெயர்ச்சொல் அமைப்பையும் கவிதை இணைநிலையையும் காக்க ‘வல்லமையோடு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָדָר
  choice: மாட்சிமை
  rationale: הָדָר என்பது கம்பீரம், சிறப்பு, அரச மாட்சி ஆகிய பொருள்களைக் கொண்டது. இச்சங்கீதத்தின் அரசருக்குரிய இறைத்தோற்றப் பின்னணிக்கு ‘மாட்சிமை’ பொருந்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, יהוה என்ற தனிப்பட்ட இறைப்பெயர் உள்ளது. தமிழில் அறியப்பட்ட பெயர்வடிவமான ‘யெகோவா’ அதை பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: בַּכֹּחַ மற்றும் בֶּהָדָר ஆகியவற்றின் இலக்கண உறவு
  choice: ‘வல்லமையோடு / மாட்சிமையோடு ஒலிக்கிறது’ என வினையடைத் தொடர்பாக மொழிபெயர்த்தல்
  alternative: ‘வல்லமையுள்ளது / மாட்சிமையுள்ளது’
  rationale: எபிரெயில் வெளிப்படையான இணைப்புவினை இல்லை; בְּ அமைப்பு நிலை, விதம், அல்லது உடனிருப்பைக் குறிக்கலாம். முதன்மை உரை எபிரெயப் பெயர்ச்சொல் இணைநிலையை இயல்பான தமிழில் காக்கிறது; மாற்று விளக்கம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்தையும் இரு அரையடிகளின் இணைநிலையையும் காக்கும் நடை. ‘ஒலிக்கிறது’ என்பது தமிழில் முழுமையான, இயல்பான வாக்கியத்தை உருவாக்கச் சேர்க்கப்பட்ட வினை; எபிரெயில் அது வெளிப்படையாக இல்லை.
