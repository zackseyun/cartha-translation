  yaml_path: translation/ot/psalms/104/002.yaml
  text: covering yourself with light as with a garment[a], stretching out the heavens like a curtain.
translation:
  language: ta
  text: ஒளியை ஆடையாகப் போர்த்திக்கொள்கிறீர்; வானங்களைத் திரைச்சீலையைப்போல் விரிக்கிறீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கூடாரத் திரையைப்போல்.” இங்குள்ள எபிரெயச் சொல் கூடாரத்திலோ திருக்கூடாரத்திலோ பயன்படுத்தப்படும் திரைத்துணியைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹטֶה
  choice: போர்த்திக்கொள்கிறீர்
  rationale: Qal வினையெச்சத்தின் தொடர்ச்சியான, உயிரோட்டமுள்ள சித்திரிப்பை இயல்பான தமிழில் தருகிறது; ஒளியைத் தம்மீது போர்த்தும் உருவகத்தையும் காக்கிறது.
- source_word: אוֹר
  choice: ஒளியை
  rationale: இங்கு சொல் நேரடியாக ஒளியைக் குறிக்கிறது; ‘மகிமை’ போன்ற விளக்கப் பொருளைச் சேர்க்கத் தேவையில்லை.
- source_word: כַשַּׂלְמָה
  choice: ஆடையைப்போல்
  rationale: שַׂלְמָה என்பது பொதுவாக ஆடை அல்லது மேலாடையைக் குறிக்கும்; குறிப்பிட்ட ஆடை வகையாகச் சுருக்காமல் உருவகத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: נוֹטֶה
  choice: விரிக்கிறீர்
  rationale: נטה என்பதன் விரித்தல் அல்லது பரப்புதல் என்ற செயலைத் தெளிவாகவும், வானங்களைத் திரைபோல் விரிக்கும் கவிதைப் படிமத்துக்கு ஏற்றவாறும் தருகிறது.
- source_word: שָׁמַיִם
  choice: வானங்களை
  rationale: எபிரெயப் பன்மை வடிவத்தையும் படைப்பைப் பற்றிய பரந்த விண்ணுலகப் படிமத்தையும் பாதுகாக்கிறது.
- source_word: כַיְרִיעָה
  choice: திரைச்சீலையைப்போல்
  rationale: יְרִיעָה என்பது திரைத்துணி, குறிப்பாகக் கூடாரம் அல்லது திருக்கூடாரத்தில் பயன்படும் திரைப் பலகையைக் குறிக்கலாம்; முதன்மை உரையில் இயல்பான பொதுப்பொருள் தேர்ந்தெடுக்கப்பட்டுள்ளது.
theological_decisions:
- issue: தேவன் ஒளியை ஆடையாகப் போர்த்திக்கொண்டு வானங்களை விரிப்பதாகக் கூறும் மானுட உருவகச் சித்திரிப்பு
  choice: கவிதை உருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘ஒளி உம்மைச் சூழ்ந்துள்ளது’ அல்லது ‘ஒளியை உமது மகிமையாக வெளிப்படுத்துகிறீர்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூல எபிரெய உரை தேவனுடைய மாட்சியையும் படைப்பாற்றலையும் தெளிவான கவிதை உருவகங்களால் சித்தரிக்கிறது; அவற்றை விளக்கவுரையாக மாற்றாமல் வைத்திருப்பது உரையின் இறையியல் நெருக்கத்தையும் படிமத்தையும் காக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் எளிமையும் கண்ணியமும் கொண்ட கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. சங்கீதத்தில் தேவனை நேரடியாக முன்னிலைப்படுத்தும் மரியாதைப் பன்மை வினைமுற்றுகள் காக்கப்பட்டுள்ளன; இரண்டு எபிரெய வினையெச்சங்களின் இணையான அமைப்பும் தமிழில் பேணப்பட்டுள்ளது.
