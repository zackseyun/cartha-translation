  text: הַֽ/מְשַׁלֵּ֣חַ מַ֭עְיָנִים בַּ/נְּחָלִ֑ים בֵּ֥ין הָ֝רִ֗ים יְהַלֵּכֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/010.yaml
  text: He sends springs into the valleys[a]; they flow between the mountains.
translation:
  language: ta
  text: 'அவர் பள்ளத்தாக்குகளில்[a] நீரூற்றுகளைப் பாயச் செய்கிறார்;

    அவை மலைகளுக்கு இடையே ஓடுகின்றன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஓடைப்படுகைகளில்” அல்லது “கணவாய்களில்”; எபிரெயச் சொல் பருவகால நீரோடைகளின் படுகைகளையோ, அவற்றுடன் தொடர்புடைய பள்ளத்தாக்குகளையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשַׁלֵּחַ
  choice: அவர் ... பாயச் செய்கிறார்
  rationale: שלח என்பதன் ஹிஃபில் வினையெச்ச வடிவம், படைப்பைப் பராமரிக்கும் கடவுளின் தொடர்ச்சியான செயலை இங்கு விவரிக்கிறது. இயல்பான நவீன தமிழுக்காக எழுவாயுடன் கூடிய முற்றுவினையாக மொழிபெயர்க்கப்பட்டது.
- source_word: מַעְיָנִים
  choice: நீரூற்றுகளை
  rationale: מַעְיָן என்பது இயற்கையாக ஊற்றெடுக்கும் நீரூற்று அல்லது நீரின் தோற்றுவாயைக் குறிக்கிறது; இச்சூழலில் ‘நீரூற்றுகள்’ தெளிவான இயல்பான தமிழ்ச் சொல்.
- source_word: בַּנְּחָלִים
  choice: பள்ளத்தாக்குகளில்
  rationale: נחל என்பது ஓடைப்படுகை, பருவகால நீரோடை, பள்ளத்தாக்கு அல்லது கணவாய் ஆகிய பொருள்களைக் கொள்ளலாம். மலைகளுக்கிடையே நீர் ஓடும் நிலக்காட்சியில், பொதுவாசகருக்குப் புரியும் பரந்த நிலவியல் சொல்லாக ‘பள்ளத்தாக்குகள்’ தேர்ந்தெடுக்கப்பட்டது; உள்ளார்ந்த பொருள் வேறுபாடு அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
- source_word: בֵּין הָרִים
  choice: மலைகளுக்கு இடையே
  rationale: בֵּין இடைப்பட்ட இடத்தைக் குறிக்கிறது; הָרִים என்பதற்கு இக்காட்சியில் ‘மலைகள்’ பொருத்தமானது.
- source_word: יְהַלֵּכוּן
  choice: ஓடுகின்றன
  rationale: הלך அடிப்படையில் ‘செல்’ எனினும், நீரை எழுவாயாகக் கொண்டபோது தமிழில் ‘ஓடு’ என்பது இயல்பான சூழல்சார் மொழிபெயர்ப்பு. இது நீரின் நகர்வைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: வினையெச்சத்தின் மறைமுக எழுவாய்
  choice: ‘அவர்’ என்பது கடவுளைக் குறிக்கிறது
  alternative: ‘அனுப்புகிறவர்’ என்ற பெயரெச்சத் தொடர்
  rationale: சங்கீதத்தின் தொடர்ச்சியான படைப்புப் புகழ்ச்சிச் சூழலில் இச்செயலின் எழுவாய் கடவுள். தமிழில் முழுமையான இயல்பான வாக்கியத்திற்காக ‘அவர்’ வெளிப்படையாகச் சேர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. முதல் அடியில் காரணவினை அமைப்பு, நீரூற்றுகளை அந்த நிலப்பரப்பில் பாயவிடும் செயலை இயல்பாக வெளிப்படுத்துகிறது; இரண்டாம் அடியில் நீரின் நகர்வுக்கு ‘ஓடுகின்றன’ பயன்படுத்தப்பட்டது.
