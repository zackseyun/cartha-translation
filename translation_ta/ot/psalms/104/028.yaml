lexical_decisions:
- source_word: תִּתֵּן לָהֶם
  choice: நீர் அவர்களுக்குக் கொடுக்கிறீர்
  rationale: נתן என்பதன் நேரடியான பொருளான ‘கொடு’ என்பதையும், לָהֶם குறிக்கும் மறைமுகச் செயப்படுபொருளான ‘அவர்களுக்கு’ என்பதையும் இயல்பான தமிழில் தக்கவைக்கிறது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவாக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: יִלְקֹטוּן
  choice: அவர்கள் அதைச் சேகரித்துக்கொள்கிறார்கள்
  rationale: לקט என்பதன் ‘சேகரி’ என்ற பொதுவான பொருளைத் தருகிறது. ‘அதை’ என்பது எபிரெயத்தில் வெளிப்படையாக இல்லாவிட்டாலும், கடவுள் கொடுப்பதையே உயிரினங்கள் சேகரிக்கின்றன என்பதைத் தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: תִּפְתַּח יָדְךָ
  choice: நீர் உமது கையைத் திறக்கிறீர்
  rationale: கடவுளின் பராமரிப்பைச் சித்தரிக்கும் ‘கையைத் திறத்தல்’ என்ற உருவகத்தை விளக்கவுரையாக மாற்றாமல் நேரடியாகத் தக்கவைக்கிறது. மூலத்தில் இல்லாத ‘அகலமாக’ போன்ற சொல்லைச் சேர்க்கவில்லை.
- source_word: יִשְׂבְּעוּן טוֹב
  choice: அவர்கள் நன்மையால் நிறைவடைகிறார்கள்
  rationale: שׂבע என்பதன் ‘நிறைவடைதல்/திருப்தியடைதல்’ என்ற பொருளையும், பெயர்ச்சொல் போல் வரும் טוֹב என்பதன் சுருக்கமான ‘நன்மை’ என்ற பொருளையும் பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுளின் பராமரிப்பைக் குறிக்கும் மனித உருவக மொழி
  choice: ‘நீர் உமது கையைத் திறக்கிறீர்’ என்று உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: ‘நீர் தாராளமாக வழங்குகிறீர்’ என்று பொருள் விளக்குதல்
  rationale: மூல எபிரெயம் கடவுளின் படைப்புப் பராமரிப்பை ஒரு தெளிவான கவிதை உருவகத்தின் மூலம் கூறுகிறது. அதை அப்படியே வைத்திருப்பது சங்கீதத்தின் காட்சித்தன்மையையும் இறையியல் அழுத்தத்தையும் பாதுகாக்கிறது.
- issue: יִשְׂבְּעוּן טוֹב என்பதிலுள்ள நிறைவு மற்றும் நன்மை
  choice: ‘நன்மையால் நிறைவடைகிறார்கள்’
  alternative: ‘நல்லவற்றால் திருப்தியடைகிறார்கள்’
  rationale: தேர்ந்தெடுத்த மொழிபெயர்ப்பு மூலத்தின் சுருக்கத்தையும் ‘நிறைவு’ என்ற வலுவான உணர்வையும் காக்கிறது; மாற்று வாசகம் பொருளை இயல்பாக விரித்துரைக்கிறது என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளக்கூடிய கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதை ஒருமைக்காக ‘நீர்/உமது’ வடிவங்கள் கையாளப்பட்டுள்ளன; இரண்டு இணை வாக்கியங்களின் எபிரெயக் கவிதை அமைப்பு அரைப்புள்ளிகளால் பாதுகாக்கப்பட்டுள்ளது.
