id: PSA.104.31
reference: Psalms 104:31
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יְהִ֤י כְב֣וֹד יְהוָ֣ה לְ/עוֹלָ֑ם יִשְׂמַ֖ח יְהוָ֣ה בְּ/מַעֲשָֽׂי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/031.yaml
  text: May the glory of Yahweh be forever[b][a]; may Yahweh rejoice in his works.
translation:
  language: ta
  text: யாவேயின் மகிமை என்றென்றும் நிலைத்திருப்பதாக[a]; யாவே தாம் உண்டாக்கியவற்றில்[b] மகிழ்வாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவேயின் மகிமை என்றென்றும் இருப்பதாக.”
    reason: alternative_reading
  - marker: b
    text: அல்லது, “தாம் உண்டாக்கியவற்றைக் குறித்து.” இங்குள்ள எபிரெய முன்னிடைச்சொல், மகிழ்ச்சிக்கான காரணத்தையோ தொடர்பையோ குறிக்கவும் முடியும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... לְעוֹלָם
  choice: என்றென்றும் நிலைத்திருப்பதாக
  rationale: יְהִי என்பது விருப்பத்தையோ வேண்டுதலையோ தெரிவிக்கும் வடிவம். לְעוֹלָם உடன் சேரும்போது, இயல்பான தமிழில் நீடித்திருக்கும் பொருளை ‘என்றென்றும் நிலைத்திருப்பதாக’ தெளிவாக வெளிப்படுத்துகிறது; ‘என்றென்றும் இருப்பதாக’ என்பதும் சாத்தியம்.
- source_word: כְבוֹד
  choice: மகிமை
  rationale: இச்சங்கீதத்தின் துதிசார்ந்த சூழலில் כָּבוֹד குறிக்கும் பெருமை, மேன்மை, ஒளிவிளக்கம் ஆகியவற்றை ‘மகிமை’ இயல்பாகவும் மரபாகவும் எடுத்துரைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் வரும் YHWH என்ற இறைப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீனத் தமிழில் அதன் ஒலிபெயர்ப்பாக ‘யாவே’ என்று வழங்குகிறது.
- source_word: יִשְׂמַח
  choice: மகிழ்வாராக
  rationale: முதல் அரையடியுடன் இணையான விருப்பம் அல்லது வேண்டுதலை இந்த வடிவம் தெரிவிக்கிறது. மரியாதையுடனும் கவிதைநயத்துடனும் தமிழில் ‘மகிழ்வாராக’ பொருந்துகிறது.
- source_word: בְּמַעֲשָׂיו
  choice: தாம் உண்டாக்கியவற்றில்
  rationale: சங்கீதம் 104-ன் படைப்புச் சூழலில் מַעֲשֶׂה என்பது தேவன் உண்டாக்கியவற்றைக் குறிக்கிறது. ‘தாம் உண்டாக்கியவற்றில்’ என்பது உடைமைப் பொருளையும் படைப்புச் சூழலையும் இயல்பான தமிழில் எடுத்துரைக்கிறது; בְּ என்பதன் தொடர்புப் பொருளில் சிறிய வேறுபாடு சாத்தியம் என்பதால் அடிக்குறிப்பு தரப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் YHWH என்ற தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துகிறது. அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் பெயர்சார் தன்மையைப் பாதுகாக்கிறது.
- issue: יְהִי ... לְעוֹלָם என்பதன் வேண்டுதல் சார்ந்த பொருள்
  choice: என்றென்றும் நிலைத்திருப்பதாக
  alternative: என்றென்றும் இருப்பதாக
  rationale: இரு வாசிப்புகளும் எபிரெயச் சொல்லமைப்புக்கு ஏற்றவை. முதன்மை வாசிப்பு நீடித்திருக்கும் கருத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மாற்று வாசிப்பு சொல்லமைப்பை இன்னும் நேரடியாகப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வேண்டுதல் நடையும் சங்கீதத்திற்கேற்ற கவிதைநயமும் பயன்படுத்தப்பட்டுள்ளன. ‘தாம்’ என்பது யாவேயைக் குறிக்கும் மரியாதைமிக்க தன்மறைச் சுட்டாக வருகிறது.
