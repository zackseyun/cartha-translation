  source_fidelity: மூல எபிரெயத்தின் இடப்பொருள் (‘அவற்றுக்கு மேலே’), வானத்துப் பறவைகள், வசித்தல்/குடியிருத்தல், கிளைகளுக்கு நடுவிலிருந்து குரல் எழுப்புதல் ஆகிய அனைத்தும் துல்லியமாகப் பாதுகாக்கப்பட்டுள்ளன. ‘பாடுகின்றன’ என்று தேவையற்ற வகையில் பொருளைக் குறுக்காமல், יִתְּנוּ קוֹל என்பதன் பொதுவான ஒலியெழுப்புதல் பொருளைச் சரியாகத் தருகிறது.
