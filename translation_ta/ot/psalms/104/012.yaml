  text: עֲ֭לֵי/הֶם עוֹף הַ/שָּׁמַ֣יִם יִשְׁכּ֑וֹן מִ/בֵּ֥ין עֳ֝פָאיִ֗ם יִתְּנוּ קֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/012.yaml
  text: Above them the birds of the heavens dwell[a]; from among the branches they give forth their voice.
translation:
  language: ta
  text: அவற்றுக்கு மேலே வானத்துப் பறவைகள் குடியிருக்கின்றன; கிளைகளின்[a] நடுவிலிருந்து அவை குரல் எழுப்புகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘இலைப்படர்ச்சியின்’ அல்லது ‘இலைகள் நிறைந்த கொப்புகளின்.’ இதற்கான எபிரெயப் பெயர்ச்சொல் அரிதானது; இலைகளுடன் கூடிய கிளைகளைப் பொதுவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵיהֶם
  choice: அவற்றுக்கு மேலே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நீரோடைகளைச் சுட்டும் பன்மைச் சுட்டுப்பெயருடன் வரும் עַל என்பதன் ‘அவற்றின் மேல்/மேலே’ என்ற இடப்பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: עוֹף הַשָּׁמַיִם
  choice: வானத்துப் பறவைகள்
  rationale: עוֹף என்ற கூட்டுப்பெயரை ‘பறவைகள்’ என்றும், הַשָּׁמַיִם என்ற தொடர்பை தமிழில் இயல்பான, கவிதைநயம் கொண்ட ‘வானத்து’ என்றும் வழங்குகிறது.
- source_word: יִשְׁכּוֹן
  choice: குடியிருக்கின்றன
  rationale: שׁכן என்பதன் தங்குதல் அல்லது வசித்தல் என்ற பொருளைப் பாதுகாக்கிறது; எபிரெயத்தில் வெளிப்படையாக இல்லாத ‘கூடுகட்டுதல்’ என்ற கருத்தைச் சேர்ப்பதில்லை.
- source_word: מִבֵּין
  choice: நடுவிலிருந்து
  rationale: பல கிளைகளுக்கு இடைப்பட்ட இடத்திலிருந்து குரல் வருவதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: עֳפָאיִם
  choice: கிளைகள்
  rationale: அரிதான இச்சொல் கிளைகள், இலைப்படர்ச்சி, அல்லது இலைகள் நிறைந்த கொப்புகளைக் குறிக்கலாம். சூழலில் ‘கிளைகள்’ தெளிவான முதன்மைத் தேர்வு; நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: יִתְּנוּ קוֹל
  choice: குரல் எழுப்புகின்றன
  rationale: சொல்லுக்கு நெருக்கமான ‘குரல் கொடுத்தல்’ என்ற மொழிப்படிமத்தை இயல்பான தமிழில் தருகிறது; ‘பாடுகின்றன’ என்று குறிப்பாக விளக்கி விடாமல் பறவைகளின் குரலொலியைப் பொதுவாக வைத்திருக்கிறது.
