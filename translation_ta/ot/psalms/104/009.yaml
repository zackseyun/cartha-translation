source:
  edition: WLC
  text: גְּֽבוּל שַׂ֭מְתָּ בַּל יַֽעֲבֹר֑וּ/ן בַּל יְ֝שׁוּב֗וּ/ן לְ/כַסּ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/009.yaml
  text: You set a boundary they may not cross[b][a]; they may not return to cover the earth.
translation:
  language: ta
  text: அவை கடக்காதபடி ஓர் எல்லையை[a] நீர் அமைத்தீர்; பூமியை மூடுவதற்கு அவை[b] திரும்பி வராது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வரம்பை.’
    reason: lexical_alternative
  - marker: b
    text: அதாவது, நீர்கள் மீண்டும் வந்து பூமியை மூடாது.
    reason: referent_clarification
lexical_decisions:
- source_word: גְּבוּל
  choice: எல்லை
  rationale: நீருக்கு நிர்ணயிக்கப்பட்ட வரம்பை இயல்பாகவும் தெளிவாகவும் குறிக்கிறது; ‘வரம்பு’ என்பதும் சாத்தியம்.
- source_word: שַׂמְתָּ
  choice: நீர் அமைத்தீர்
  rationale: שׂוּם என்பதன் ‘வைத்தல்/நிறுவுதல்’ என்ற பொருளை, ‘எல்லை’ என்பதுடன் இயல்பான நவீனத் தமிழில் வழங்குகிறது.
- source_word: בַּל יַעֲבֹרוּן
  choice: அவை கடக்காதபடி
  rationale: எல்லையை நீர்கள் மீறிச் செல்ல முடியாதபடி கடவுள் கட்டுப்படுத்தியிருப்பதைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַּל יְשׁוּבוּן
  choice: அவை திரும்பி வராது
  rationale: שׁוב என்பதன் நேரடியான ‘திரும்புதல்’ பொருளையும், நீர்கள் மீண்டும் வந்து பூமியை மூடாதிருக்கும் கருத்தையும் காக்கிறது.
- source_word: לְכַסּוֹת
  choice: மூடுவதற்கு
  rationale: כסה என்பதன் அடிப்படைப் பொருளான ‘மூடுதல்’ என்பதைக் காக்கிறது; ‘வெள்ளத்தில் மூழ்கடித்தல்’ என்று கருத்தை விரிவாக்கவில்லை.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: படைப்பைப் பற்றிய இந்தச் சங்கீதத்தின் பரந்த சூழலில், உள்ளூர் ‘நிலம்’ என்பதைவிட ‘பூமி’ பொருத்தமானது.
theological_decisions:
- issue: பன்மை வினைகளின் குறிப்பு
  choice: ‘அவை’ என்பது முந்தைய வசனங்களில் குறிப்பிடப்பட்ட நீர்களைக் குறிக்கிறது; இதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
  alternative: அவை குழப்பமான ஆதிநீர்களையோ கடல்நீரையோ பொதுவாகக் குறிக்கலாம்.
  rationale: உடனடியான சூழல் நீர்கள் விலகிச் சென்று அவற்றுக்கு எல்லை அமைக்கப்படுவதை விவரிக்கிறது. முதன்மை உரையில் ‘நீர்கள்’ என்று விளக்கிச் சேர்க்காமல், எபிரெயத்தின் பன்மைப் பெயர்ச்சுட்டை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமான ‘நீர்/அமைத்தீர்’ காக்கப்பட்டுள்ளது; நீர்களைக் குறிக்கும் ‘அவை’ என்ற பன்மைச் சுட்டு மூலத்தின் தெளிவின்மையை அளவோடு பாதுகாக்கிறது.
