lexical_decisions:
- source_word: תְּהוֹם
  choice: ஆழ்கடல்
  rationale: இச்சொல் ஆழமான பெருநீர்ப்பரப்பைக் குறிக்கிறது. ‘ஆழ்கடல்’ என்பது படைப்புச் சூழலின் பெருநீர் உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது; புராணவியல் பொருளைத் தேவையின்றி ஏற்றுவதில்லை.
- source_word: כַּלְּבוּשׁ
  choice: ஓர் ஆடையைப்போல்
  rationale: כ முன்னொட்டு ஒப்புமையையும் לְבוּשׁ ஆடையையும் குறிக்கின்றன. இந்தத் தெரிவு எபிரெய ஒப்புமையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִּסִּיתוֹ
  choice: அதற்குப் போர்த்தினீர்
  rationale: வினை இரண்டாம் நபர் ஆண்பால் ஒருமையிலும், பின்னொட்டு மூன்றாம் நபர் ஆண்பால் ஒருமையிலும் உள்ளது. சூழலில் இறைவன் நேரடியாக விளிக்கப்படுவதால் ‘போர்த்தினீர்’ என இரண்டாம் நபரைத் தக்கவைத்துள்ளது; ஆடை ஒப்புமையுடன் இயல்பாக இணைகிறது.
- source_word: עַל
  choice: மேலாக
  rationale: மலைகளைவிட உயர்ந்த நிலையில் நீர் இருந்ததை இங்கு குறிக்கிறது.
- source_word: הָרִים
  choice: மலைகள்
  rationale: அடிப்படைப் பொருளான ‘மலைகள்’ படைப்புக் காட்சியின் பிரம்மாண்டத்தைத் தக்கவைக்கிறது.
- source_word: יַעַמְדוּ
  choice: நின்றது
  rationale: עמד என்பதன் நேரடிப் பொருளான ‘நில்’ என்பதையும், நீர் மலைகளுக்கு மேல் நிலைகொண்டிருந்த உயிரோட்டமான கவித்துவக் காட்சியையும் தக்கவைக்கிறது.
- source_word: מָיִם
  choice: தண்ணீர்
  rationale: מָיִם இலக்கண வடிவில் பன்மைத் தோற்றமுடையதாக இருந்தாலும் தமிழில் இச்சூழலில் ‘தண்ணீர்’ என்பது இயல்பான திரள்பெயர். ஒருமை வினையுடன் அமைவது நவீனத் தமிழுக்கு ஏற்றது.
theological_decisions:
- issue: வினையின் நபரும் விளிக்கப்படுபவரும்
  choice: 'இறைவனை நேரடியாக விளித்தல்: ‘போர்த்தினீர்’'
  alternative: 'மூன்றாம் நபர் உரை: ‘அவர் போர்த்தினார்’'
  rationale: எபிரெய வினை இரண்டாம் நபர் ஆண்பால் ஒருமையில் உள்ளது; சுற்றியுள்ள வசனங்களிலும் ஆண்டவர் நேரடியாக விளிக்கப்படுகிறார். எனவே மூலத்தின் துதிப்பாங்கையும் நேரடி விளிப்பையும் தக்கவைத்துள்ளது.
- issue: כִּסִּיתוֹ என்பதிலுள்ள ஆண்பால் ஒருமைப் பின்னொட்டின் குறிப்பு
  choice: ‘அதற்கு’ என்று வெளிப்படையாகக் குறிப்பிட்டு, முன்வசனத்தில் உள்ள பூமியைக் குறிக்கவிடுதல்
  alternative: குறிப்பு தெளிவில்லாதவாறு ‘போர்த்தினீர்’ என்று மட்டும் மொழிபெயர்த்தல்
  rationale: எபிரெயத்தில் பின்னொட்டு வெளிப்படையாக உள்ளது; அதன் இயல்பான முன்குறிப்பு முன்வசனத்தின் ‘பூமி’ ஆகும். தமிழில் ‘அதற்கு’ என்பது பாலினமற்ற சுட்டுப்பெயராக இருப்பதால் தேவையற்ற விளக்கத்தைச் சேர்க்காமல் தொடர்பைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை விளிக்கும் மரியாதைப் பன்மை வினைமுற்று ‘போர்த்தினீர்’ பயன்படுத்தப்பட்டுள்ளது. ‘ஆழ்கடல்’, ‘ஆடை’, ‘மலைகள்’, ‘தண்ணீர்’ ஆகியவை பொதுவாகப் புரியும் சொற்கள்; எபிரெயத்தின் ஒப்புமையும் நீர் ‘நின்றது’ என்ற உயிரோட்டமான படிமமும் பாதுகாக்கப்பட்டுள்ளன.
