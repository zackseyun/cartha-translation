  yaml_path: translation/ot/psalms/104/003.yaml
  text: who lays the beams of his upper chambers on the waters[a], who makes the clouds his chariot, who walks on the wings of the wind.
translation:
  language: ta
  text: 'நீர்களின்மேல் தமது மேலறைகளின் விட்டங்களை அமைக்கிறவர்;


    மேகங்களைத் தமது தேராக்குகிறவர்;


    காற்றின்[a] சிறகுகளின்மேல் நடக்கிறவர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆவியின் சிறகுகளின்மேல் நடக்கிறவர்.” רוּחַ என்ற எபிரேயச் சொல் ‘காற்று’ அல்லது ‘ஆவி’ என்று பொருள்படலாம்; சுற்றியுள்ள வானிலைப் படிமங்களால் இங்கு ‘காற்று’ என்பது முன்னுரிமை பெறுகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְקָרֶה
  choice: விட்டங்களைப் பதிக்கிறவர்
  rationale: קרה என்பதன் கட்டடவியல் உருவகத்தையும், மேலறைகளுக்கான கூரை விட்டங்களை அமைக்கும் செயலையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בַמַּיִם
  choice: தண்ணீர்களின்மேல்
  rationale: ב என்பதற்கு ‘இல்’ என்றும் பொருள் கொள்ள முடியும்; இங்கு மேலறைகளின் விட்டங்கள் தண்ணீர்களின்மேல் பதிக்கப்படும் பிரபஞ்சக் கட்டட உருவகத்திற்கு ‘மேல்’ இயல்பாகப் பொருந்துகிறது.
- source_word: עֲלִיּוֹתָיו
  choice: தமது மேலறைகள்
  rationale: உயரத்தில் அமைந்த அறைகள் என்ற கட்டட உருவகத்தை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: הַשָּׂם
  choice: தேராக்குகிறவர்
  rationale: שׂים என்பதன் ‘அமைத்தல்/ஆக்குதல்’ பொருளை, மேகங்கள் அவருடைய தேராகின்றன என்ற பயனிலை அமைப்பில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עָבִים
  choice: மேகங்கள்
  rationale: சொல் மேகங்களையோ திரண்ட மேகங்களையோ குறிக்கலாம்; சூழலில் எளிய ‘மேகங்கள்’ போதுமானதும் இயல்பானதும் ஆகும்.
- source_word: רְכוּבוֹ
  choice: தமது தேர்
  rationale: தெய்வத் தோற்றக் கவிதைப் படிமத்தில் சவாரி வாகனத்தைத் தெளிவாகக் காட்டுகிறது.
- source_word: הַמְהַלֵּךְ
  choice: நடக்கிறவர்
  rationale: הלך என்பதன் உயிரோட்டமான மனித உருவக மொழியைத் தணிக்காமல் பாதுகாக்கிறது.
- source_word: כַּנְפֵי
  choice: சிறகுகளின்மேல்
  rationale: כנף என்பதன் ‘சிறகு’ பொருள் காற்றின் வேகத்தையும் இயக்கத்தையும் காட்டும் கவித்துவப் படிமத்துக்கு மிகவும் பொருந்துகிறது.
- source_word: רוּחַ
  choice: காற்று
  rationale: רוּחַ என்பதற்கு காற்று, மூச்சு, ஆவி ஆகிய பொருள்கள் உண்டு; மேகங்கள், தேர், சிறகுகள் ஆகிய வானிலைப் படிமங்களின் உடனடிச் சூழலில் ‘காற்று’ முன்னுரிமை பெறுகிறது.
theological_decisions:
- issue: இறுதி அடியில் רוּחַ என்பதன் பொருள்
  choice: காற்று
  alternative: ஆவி
  rationale: எபிரேயச் சொல் இரு பொருள்களையும் ஏற்கக்கூடியது. ஆனால் இவ்வசனத்தின் மேகம், தேர், சிறகு ஆகிய வானிலை சார்ந்த படிமங்கள் ‘காற்று’ என்பதை வலுவாக ஆதரிக்கின்றன; மாற்றுப் பொருளை அடிக்குறிப்பில் பாதுகாப்பது தேவையற்ற கோட்பாட்டுத் தீர்மானத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்தையும் மூன்று இணையான பங்கேற்பு வாக்கியங்களின் ஓசையையும் பாதுகாக்கும் நடை. ‘விட்டங்கள்’ என்ற கட்டடவியல் சொல் மூலத்தின் தெளிவான கூரை அமைக்கும் உருவகத்தைத் தக்கவைக்கிறது.
