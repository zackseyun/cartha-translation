source:
  edition: WLC
  text: תַּסְתִּ֥יר פָּנֶי/ךָ֮ יִֽבָּהֵ֫ל֥וּ/ן תֹּסֵ֣ף ר֭וּחָ/ם יִגְוָע֑וּ/ן וְֽ/אֶל עֲפָרָ֥/ם יְשׁוּבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/029.yaml
  text: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
translation:
  language: ta
  text: நீர் உமது முகத்தை மறைக்கிறீர்[a]; அவை கலங்குகின்றன. அவற்றின் மூச்சை[b] நீர் எடுத்துக்கொள்கிறீர்; அவை இறந்து தங்கள் புழுதிக்குத் திரும்புகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பிரசன்னத்தை.” “உமது முகம்” என்பது ஒருவரின் பிரசன்னத்தையோ தயவையோ குறிக்கும் பொதுவான எபிரெயச் சொல்வழக்கு.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவற்றின் ஆவியை.” எபிரெயச் சொல்லான רוּחַ என்பதற்கு “மூச்சு,” “காற்று,” அல்லது “ஆவி” என்று பொருள் வரலாம்; இறப்பதும் புழுதிக்குத் திரும்புவதும் பேசப்படும் இச்சூழல் “மூச்சு” என்பதற்கு ஆதரவளிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּיר
  choice: மறைத்தால்
  rationale: סתר என்பதன் ஹிஃபில் வடிவம் ‘மறைத்தல்’ அல்லது ‘ஒளித்தல்’ என்று பொருள்படும். தொடரும் வினைகளோடு உள்ள கருத்துச் சார்பை இயல்பான தமிழில் காட்ட நிபந்தனை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: פָּנֶיךָ
  choice: உமது முகத்தை
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘உமது முகம்.’ இது பிரசன்னத்தையோ தயவையோ குறிக்கும் உருவகமாக இருந்தாலும், கவித்துவமான உடல்சார் படிமம் முதன்மை உரையில் தக்கவைக்கப்பட்டது.
- source_word: יִבָּהֵלוּן
  choice: திகிலடைகின்றன
  rationale: בהל என்பதன் நிஃபால் வடிவம் கடும் கலக்கம், அச்சம் ஆகியவற்றைக் குறிக்கிறது. ‘திகிலடைகின்றன’ அதன் வலிமையை இயல்பான தமிழில் தருகிறது.
- source_word: תֹּסֵף
  choice: எடுத்துக்கொண்டால்
  rationale: אסף என்பதற்கு ‘சேர்த்துக்கொள்,’ ‘அகற்று,’ ‘திரும்ப எடுத்துக்கொள்’ என்ற பொருள்கள் உண்டு. உயிர்மூச்சு நீங்குவதைக் குறிக்கும் இச்சூழலில் ‘எடுத்துக்கொண்டால்’ பொருத்தமானது; தேவன் உயிரைத் தாங்குகிறவர் என்ற கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: רוּחָם
  choice: அவற்றின் மூச்சை
  rationale: רוּחַ என்பது ‘மூச்சு,’ ‘காற்று,’ அல்லது ‘ஆவி’ என்று பொருள்படலாம். இறப்பதும் புழுதிக்குத் திரும்புவதும் இணைந்துள்ளதால் முதன்மை உரையில் ‘மூச்சு’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: יִגְוָעוּן
  choice: அவை இறந்து
  rationale: גוע என்பது ‘உயிர்விடுதல்’ அல்லது ‘இறத்தல்.’ சாதாரண வாசகர்களுக்குத் தெளிவாகவும் கண்ணியமாகவும் ‘இறந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: עֲפָרָם
  choice: தங்கள் புழுதிக்கு
  rationale: எபிரெயத்தில் உடைமைப் பின்னொட்டு இருப்பதால் ‘தங்கள்’ தக்கவைக்கப்பட்டது. ‘புழுதி’ படைப்பும் மரணமும் சார்ந்த வேதாகமப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: יְשׁוּבוּן
  choice: திரும்புகின்றன
  rationale: שוב என்பதன் அடிப்படைப் பொருள் ‘திரும்புதல்.’ புழுதிக்குத் திரும்பும் மரபான படிமத்திற்கும் தமிழ் நடைக்கும் இது பொருந்துகிறது.
theological_decisions:
- issue: படைப்பு–மரணச் சூழலில் רוּחָם என்பதன் பொருள்
  choice: அவற்றின் மூச்சை
  alternative: அவற்றின் ஆவியை
  rationale: இவ்வசனம் உயிரினங்களின் உயிரூட்டும் மூச்சு நீங்குவதையும் அவை இறந்து புழுதிக்குத் திரும்புவதையும் விவரிக்கிறது. ‘மூச்சு’ என்பது இச்சூழலுக்கு ஏற்றது; அதேவேளையில் ‘ஆவி’ என்ற உண்மையான சொற்பொருள் வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: தேவனுடைய முகம் என்ற மனிதவுருவ மொழி
  choice: உமது முகத்தை
  alternative: உமது பிரசன்னத்தை
  rationale: மூலத்தின் தெளிவான கவித்துவப் படிமம் தக்கவைக்கப்படுகிறது. அதைப் ‘பிரசன்னம்’ என்ற கருத்தியல் சொல்லாக முதன்மை உரையிலேயே மாற்றாமல், அந்த உட்பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. படைப்புகளைச் சுட்டுவதால் ‘அவை/அவற்றின்’ என அஃறிணைப் பன்மை கையாளப்பட்டது. மரியாதை ஒருமைத் தெய்வக் குறிப்பாக ‘நீர்/உமது’ தக்கவைக்கப்பட்டது; எபிரெய வாக்கியங்களின் தொடர்ச்சியை தமிழில் தெளிவுபடுத்த நிபந்தனை அமைப்பு பயன்படுத்தப்பட்டது.
