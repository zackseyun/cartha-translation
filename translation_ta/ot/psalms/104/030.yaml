  text: When you send out your Spirit[a], they are created[b], and you renew the face of the ground.
translation:
  language: ta
  text: நீர் உமது ஆவியை[a] அனுப்பும்போது[b], அவை படைக்கப்படுகின்றன; நீர் நிலத்தின் முகத்தைப் புதுப்பிக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது மூச்சை” அல்லது “உமது காற்றை”; எபிரேயச் சொல் இம்மூன்று பொருள்களையும் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நீர் உமது ஆவியை அனுப்புகிறீர்; அவை படைக்கப்படுகின்றன.”
    reason: source_syntax
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: அனுப்பும்போது
  rationale: שׁלח என்பதன் பியேல் வடிவம் ‘அனுப்பு’ என்ற பொருளைத் தருகிறது. அடுத்த வினையுடன் உள்ள தொடர்பை இயல்பான தமிழில் காட்ட ‘அனுப்பும்போது’ என மொழிபெயர்க்கப்பட்டுள்ளது; எபிரேயத்தின் நேரடி இணைப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: רוּחֲךָ
  choice: உமது ஆவியை
  rationale: רוּחַ என்பதற்கு ‘ஆவி’, ‘மூச்சு’, ‘காற்று’ ஆகிய பொருள்கள் உண்டு. படைப்பையும் உயிரளிக்கும் இறைச் செயலையும் குறிக்கும் இச்சூழலில் ‘உமது ஆவி’ பொருத்தமானது; மற்ற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: יִבָּרֵאוּן
  choice: அவை படைக்கப்படுகின்றன
  rationale: ברא என்பதன் நிஃபால் வடிவம் ‘படைக்கப்படுதல்’ என்ற பொருளைக் கொண்டது. ‘புதிதாகப் படைக்கப்படுகின்றன’ என்று கூறுவது அடுத்த வரியிலுள்ள புதுப்பித்தலை இவ்வினைக்குள் தேவையின்றி சேர்த்துவிடும்.
- source_word: וּתְחַדֵּשׁ
  choice: நீர் ... புதுப்பிக்கிறீர்
  rationale: חדשׁ என்பதன் பியேல் வடிவம் ‘புதுப்பி’ அல்லது ‘புதியதாக்கு’ என்று பொருள்படும். ‘புதுப்பிக்கிறீர்’ என்பது மீளுயிர்ப்பித்தல் அல்லது புத்துணர்வளித்தல் என்ற கருத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: פְּנֵי
  choice: முகப்பை
  rationale: இச்சொல்லின் அடிப்படைப் பொருள் ‘முகம்’. ‘நிலத்தின் முகப்பு’ என்பது அந்தக் கவித்துவ உருவகத்தைத் தக்கவைத்தபடி தமிழில் அதன் மேற்பரப்பைக் குறிக்கிறது.
- source_word: אֲדָמָה
  choice: நிலத்தின்
  rationale: אֲדָמָה என்பது மண், நிலம், விளைநிலத் தரை ஆகியவற்றைக் குறிக்கலாம். இங்கு ‘நிலம்’ என்பது பூமியின் உயிர்ப்பெறும் தரைப்பரப்பைத் தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: படைப்புச் சூழலில் רוּחַ என்பதன் பொருள்
  choice: உமது ஆவி
  alternative: உமது மூச்சு; உமது காற்று
  rationale: இவ்வசனம் கடவுளின் உயிரளிக்கும் படைப்புச் செயலையும் புதுப்பிக்கும் செயலையும் பேசுவதால் ‘ஆவி’ என்பது பொருத்தமான தேர்வு. எனினும், எபிரேயச் சொல் ஆவி, மூச்சு, காற்று என்ற மூன்று நுண்பொருள்களையும் தாங்குவதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டு மொழியின் இறையியல் செறிவு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழில், கடவுளைக் குறிக்க மரியாதைப் பன்மையான ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளது. கவிதைத் தன்மையைத் தக்கவைக்க ‘நிலத்தின் முகப்பு’ வைக்கப்பட்டாலும், வாக்கிய ஓட்டம் சாதாரண வாசகருக்குப் புரியுமாறு அமைக்கப்பட்டுள்ளது.
