lexical_decisions:
- source_word: גַּעֲרָתְךָ
  choice: உமது கண்டிப்பு
  rationale: גְּעָרָה என்பது வல்லமையுடன் கூறப்படும் கண்டிப்பைக் குறிக்கிறது. படைப்பின்மேல் கடவுளுடைய கட்டளையிடும் பேச்சின் வலிமையை இயல்பான நவீன தமிழில் ‘கண்டிப்பு’ தக்கவைக்கிறது.
- source_word: יְנוּסוּן
  choice: அவை ஓடிப்போயின
  rationale: נוּס என்பதன் அடிப்படைப் பொருள் ‘தப்பி ஓடுதல்/ஓடிப்போதல்.’ இங்கு நீர் உடனடியாகப் பின்வாங்குவதை ‘ஓடிப்போயின’ தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: קוֹל
  choice: சத்தத்தைக் கேட்டு
  rationale: קוֹל என்பது ‘குரல்/ஒலி/சத்தம்’ எனப் பொருள்படும். இடியுடன் சேரும் இச்சூழலில் ‘சத்தம்’ இயல்பானது; מִן குறிக்கும் காரணத்தையும் உடனடி எதிர்வினையையும் தமிழில் ‘கேட்டு’ தெளிவாகக் காட்டுகிறது.
- source_word: רַעַמְךָ
  choice: உமது இடிமுழக்கம்
  rationale: רַעַם நேரடியாக இடியைக் குறிக்கிறது. ‘இடிமுழக்கம்’ செவிப்புலப் படிமத்தையும் தெய்வீக வல்லமையின் கவித்துவத் தாக்கத்தையும் தருகிறது.
- source_word: יֵחָפֵזוּן
  choice: அவை விரைந்தோடின
  rationale: חפז அவசரமான அல்லது துரிதமான நகர்வைக் குறிக்கிறது. ‘விரைந்தோடின’ அச்சம் அல்லது பீதியை உரையில் இல்லாத அளவுக்கு சேர்க்காமல் விரைவான விலகலைக் காட்டுகிறது.
- source_word: מִן ... מִן
  choice: -ஆல் ... -த்தைக் கேட்டு
  rationale: இரு מִן வடிவங்களும் இங்கு நிகழ்வைத் தூண்டும் காரணம் அல்லது சந்தர்ப்பத்தைக் குறிக்கின்றன. ஒரே தமிழ் வடிவைச் செயற்கையாகத் திரும்பக் கூறாமல், ‘கண்டிப்பால்’ மற்றும் ‘சத்தத்தைக் கேட்டு’ என்ற இயல்பான இணையான அமைப்பு காரணத்தையும் உடனடி எதிர்வினையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: ‘அவை ஓடிப்போயின / விரைந்தோடின’ என்பவற்றின் பன்மை எழுவாய்
  choice: எபிரெய உரையைப் போல எழுவாயை ‘அவை’ என்ற சுட்டுப்பெயராகவே வைத்து, முந்தைய சூழலில் சொல்லப்பட்ட நீரைக் குறிக்கச் செய்தல்.
  alternative: ‘நீர் ஓடிப்போயிற்று’ என்று எழுவாயை வெளிப்படையாகச் சேர்த்தல்.
  rationale: இந்த வசனத்தில் எபிரெயம் எழுவாயை மீண்டும் பெயரிட்டு கூறாமல் முந்தைய சூழலைச் சார்ந்துள்ளது. ‘அவை’ என்பது அந்தக் கவித்துவத் தொடர்ச்சியையும் மூலத்தின் மறைமுகத்தன்மையையும் காக்கிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான கவித்துவ நடை. கடவுளை நோக்கிய உரையில் ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. இணைவரிகளின் இயக்கமும் வலிமையும் காக்கப்பட்டுள்ளன; அடிக்குறிப்பு குறியீடு பிரதான உரையில் இடம்பெற்றுள்ளது.
