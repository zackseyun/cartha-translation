source:
  edition: WLC
  text: שָׁ֭ם אֳנִיּ֣וֹת יְהַלֵּכ֑וּ/ן לִ֝וְיָתָ֗ן זֶֽה יָצַ֥רְתָּ לְ/שַֽׂחֶק בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/026.yaml
  text: There the ships move about[a], and Leviathan, which you formed to play in it.
translation:
  language: ta
  text: 'அங்கே கப்பல்கள் பயணிக்கின்றன;


    நீர் உருவாக்கிய லிவியாதான் அதில் விளையாடுகிறது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீர் அதனுடன் விளையாடுவதற்காக உருவாக்கிய லிவியாதான்.” இறுதித் தொடரை, லிவியாதான் கடலில் விளையாடுவதாக அல்லாமல், கடவுள் லிவியாதானுடன் விளையாடுவதாகச் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: அங்கே
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட கடலைச் சுட்டும் இடவினையடை; நவீனத் தமிழில் இயல்பான, தெளிவான வடிவம்.
- source_word: אֳנִיּוֹת
  choice: கப்பல்கள்
  rationale: கடலில் பயணிக்கும் கலங்களைக் குறிக்கும் பொதுப்பெயர்; எளிதில் புரியும் வழக்கமான தமிழ்ச்சொல்.
- source_word: יְהַלֵּכוּן
  choice: சென்று வருகின்றன
  rationale: கடலில் தொடர்ந்து இயங்கும் கப்பல்களின் இயக்கத்தை, எபிரெய நிறைவுறா வினையின் தொடர்ச்சித் தன்மையுடன் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִוְיָתָן
  choice: லிவியாதான்
  rationale: வேதாகமக் கவிதையில் வரும் தனித்துவமான பெருங்கடல் உயிரினத்தின் பெயரை மொழிபெயர்க்காமல் ஒலிபெயர்ப்பது அதன் கவித்துவ மற்றும் வேதாகம இடையிணைப்பைத் தக்கவைக்கிறது.
- source_word: זֶה
  choice: —
  rationale: சொல்லுக்குச் சொல் ‘இந்த’ என்றாலும், தமிழில் ‘நீர் உருவாக்கிய லிவியாதான்’ என்ற இயல்பான தொடர்பெயரெச்சக் கட்டமைப்பில் அதன் சுட்டுப்பொருள் உள்ளடங்குகிறது.
- source_word: יָצַרְתָּ
  choice: நீர் உருவாக்கிய
  rationale: יצר என்பதிலுள்ள வடிவமைத்து உண்டாக்குதல் என்ற நுண்ணுணர்வை ‘உருவாக்கிய’ தக்கவைக்கிறது; கடவுளை நேரடியாக அழைக்கும் மரியாதை ஒருமைக்கு ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: לְשַׂחֶק
  choice: விளையாடுகிறது
  rationale: உயிரினத்தின் களிப்பான செயலைத் தெளிவாகவும் கவித்துவப் படிமத்தை மங்கச் செய்யாமலும் காட்டுகிறது.
- source_word: בּוֹ
  choice: அதில்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு சூழலில் முந்தைய வசனத்தின் கடலைச் சுட்டுவதாக இயல்பாகப் புரிகிறது; தமிழில் ‘அதில்’ இடப்பொருளைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: לְשַׂחֶק בּוֹ என்பதில் விளையாடுபவர் யார், בּוֹ எதைச் சுட்டுகிறது?
  choice: லிவியாதான் கடலில் விளையாடுகிறது
  alternative: கடவுள் லிவியாதானுடன் விளையாடுவதற்காக அதை உருவாக்கினார்
  rationale: 'உடனடிச் சூழலில் கடலே இடமாக உள்ளது: கப்பல்கள் அங்கே செல்கின்றன; லிவியாதானும் அதில் விளையாடுகிறது. ஆயினும் எபிரெயத் தொடரை கடவுள் லிவியாதானுடன் விளையாடுவதாகவும் புரிந்துகொள்ள முடிவதால், அந்த உண்மையான பொருள் மயக்கத்தை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.'
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதக் கவிதைக்கேற்ற கண்ணியத்துடனும் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதை ஒருமைக்கு ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது; வரியமைப்பு எபிரெயக் கவிதையின் இரு காட்சிகளையும் வெளிப்படுத்துகிறது.
