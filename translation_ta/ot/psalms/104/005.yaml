  text: He founded the earth on its foundations[a]; it will not be shaken forever and ever.
translation:
  language: ta
  text: அவர் பூமியை அதன் அஸ்திவாரங்களின் மேல் நிறுவினார்[a]; அது என்றென்றைக்கும் நிலைகுலையாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பூமியை அதன் ஆதாரங்களின் மேல் நிலைநிறுத்தினார்”; எபிரெய மொழி உலகின் உறுதித்தன்மையைச் சித்தரிக்கக் கட்டட உருவகத்தைப் பயன்படுத்துகிறது.
