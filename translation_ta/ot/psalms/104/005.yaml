lexical_decisions:
- source_word: יָסַד
  choice: நிறுவினார்
  rationale: அஸ்திவாரம் இடுதல் அல்லது உறுதியாக நிலைநிறுத்துதல் என்ற பொருளைத் தரும் வினை; கட்டட உருவகத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אֶרֶץ
  choice: பூமியை
  rationale: படைப்பைப் பாடும் இச்சூழலில், குறிப்பிட்ட ஒரு நிலப்பகுதியைவிட உலகளாவிய ‘பூமி’ என்ற பொருளே பொருத்தமானது.
- source_word: עַל
  choice: மேல்
  rationale: அமைவிடம் அல்லது தாங்கும் ஆதாரத்தைக் குறிக்கும் நேரடியான இடைச்சொல்.
- source_word: מְכוֹנֶיהָ
  choice: அதன் அஸ்திவாரங்களின்மேல்
  rationale: அடித்தளம், ஆதாரம் அல்லது நிலையான தாங்கிடம் என்ற கட்டட உருவகத்தைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בַּל תִּמּוֹט
  choice: அசைக்கப்படாது
  rationale: நிலைகுலையச் செய்யப்படுதல் அல்லது நகர்த்தப்படுதல் என்ற செயல்பாட்டு அர்த்தத்தை இயல்பான கவிதை நடையில் தருகிறது.
- source_word: עוֹלָם וָעֶד
  choice: என்றென்றும்
  rationale: முடிவில்லாத காலத்தை வலியுறுத்தும் இணைச் சொற்றொடரின் செறிவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: படைப்பைப் பற்றிய கவிதைமிகு பிரபஞ்ச மொழி
  choice: பூமியின் அஸ்திவாரங்களையும் அதன் அசைக்கமுடியாத நிலைத்தன்மையையும் குறிக்கும் கட்டட உருவகத்தைத் தக்கவைத்தல்
  alternative: பூமியை அசையாதபடி அவர் உறுதியாக வைத்தார்
  rationale: வசனம் நவீன அறிவியல் விளக்கத்தை வழங்காமல், பூமியின் உறுதித்தன்மையைப் பற்றிய கவிதைமிகு கட்டட உருவகத்தைப் பயன்படுத்துகிறது; அதை அறிவியல் உரையாக மாற்றாமலும் கோட்பாட்டு முடிவைத் திணிக்காமலும் மொழிபெயர்க்க வேண்டும்.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழில் கவிதைத் தன்மை பேணப்பட்டுள்ளது. ‘அஸ்திவாரம்’ பொதுவாகப் புரிந்துகொள்ளப்படும் கட்டடச் சொல்; ‘நிறுவினார்’ என்பது மூல வினையின் அஸ்திவாரம் இடுதல்/நிலைநிறுத்துதல் ஆகிய பொருள் பரப்பைச் சுருக்காமல் தருகிறது.
