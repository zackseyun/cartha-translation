revisions:
- from: நீர் இருளை ஏற்படுத்துகிறீர்; இரவு உண்டாகிறது. அதில் காட்டிலுள்ள விலங்குகள் அனைத்தும் நடமாடுகின்றன.[a]
  to: நீர் இருளை ஏற்படுத்துகிறீர்; இரவு உண்டாகிறது. அதில் காட்டின் எல்லா விலங்குகளும் இயங்கித் திரிகின்றன.[a]
  rationale: The revision replaces the overly broad ‘நடமாடுகின்றன’ with ‘இயங்கித் திரிகின்றன,’ which better conveys the Hebrew verb’s imagery of animals moving about while remaining idiomatic and not restricting the sense to crawling or predatory prowling. The footnote now supplies ‘ஊர்ந்து திரிகின்றன’ as the more concrete lexical alternative and specifies the nocturnal setting reflected by the verse.
