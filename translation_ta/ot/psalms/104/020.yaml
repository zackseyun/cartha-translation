source:
  edition: WLC
  text: תָּֽשֶׁת חֹ֭שֶׁךְ וִ֣/יהִי לָ֑יְלָה בּֽ/וֹ תִ֝רְמֹ֗שׂ כָּל חַיְת/וֹ יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/020.yaml
  text: You set darkness[a], and it becomes night; in it all the beasts of the forest creep about.
translation:
  language: ta
  text: நீர் இருளை ஏற்படுத்துகிறீர்; இரவு உண்டாகிறது. அதில் காட்டின் எல்லா விலங்குகளும் இயங்கித் திரிகின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஊர்ந்து திரிகின்றன.” எபிரேய வினைச்சொல் விலங்குகள் இரவில் அங்குமிங்கும் இயங்குவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֶׁת
  choice: ஏற்படுத்துகிறீர்
  rationale: שׁית என்பதன் அடிப்படைப் பொருள் ‘வைத்தல், ஏற்படுத்துதல்’. இங்கு கடவுள் இருளை உண்டாக்கும் நேரடியான செயற்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֹשֶׁךְ
  choice: இருளை
  rationale: படைப்பின் ஒழுங்கில் இருள் தோன்றுவதைக் குறிக்கும் நேரான, வழக்கமான தமிழ் சொல்.
- source_word: וִיהִי
  choice: உண்டாகிறது
  rationale: கடவுள் இருளை ஏற்படுத்துவதன் விளைவாக இரவு தோன்றும் நிலைமாற்றத்தை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לָיְלָה
  choice: இரவு
  rationale: இரவுப்பொழுதைக் குறிக்கும் நேரான தமிழ் இணைச்சொல்.
- source_word: בּוֹ
  choice: அதில்
  rationale: ஆண்பால் ஒருமை பின்னொட்டு முன்னுள்ள ‘இரவு’ என்பதையே சுட்டுகிறது; தமிழில் ‘அதில்’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: תִרְמֹשׂ
  choice: நடமாடுகின்றன
  rationale: רמשׂ விலங்குகள் ஊர்ந்து அல்லது அங்குமிங்கும் இயங்குவதைக் குறிக்கலாம். எல்லா வனவிலங்குகளையும் உள்ளடக்கும் சூழலில் ‘நடமாடுகின்றன’ மிகைப்படுத்தாமல் பரந்த பொருளைப் பாதுகாக்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָּל
  choice: அனைத்தும்
  rationale: தொடர்ந்து வரும் கூட்டுப்பெயருடன் முழுமையைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: חַיְתוֹ
  choice: விலங்குகள்
  rationale: חיה இங்கு காட்டில் வாழும் உயிரினங்கள் அல்லது விலங்குகளைக் குறிக்கிறது. நவீன தமிழில் ‘விலங்குகள்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יָעַר
  choice: காட்டிலுள்ள
  rationale: יער என்பதன் வழக்கமான பொருள் ‘காடு’; எபிரேய கட்டமைப்பை இயல்பான தமிழில் ‘காட்டிலுள்ள விலங்குகள்’ என வழங்குகிறது.
theological_decisions:
- issue: படைப்பின் ஒழுங்கில் கடவுளின் செயற்பாடு
  choice: கடவுள் இருளை நேரடியாக ஏற்படுத்துகிறார்; அதன் விளைவாக இரவு உண்டாகிறது.
  alternative: கடவுள் இருளும் இரவும் நிகழ அனுமதிக்கிறார்.
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை வினைச்சொல் செயலை நேரடியாகக் கடவுளுக்கே உரித்தாக்குகிறது. அதற்கு அப்பாற்பட்ட காரணவியல் விளக்கத்தைச் சேர்க்காமல் இந்தச் செயற்பாடு பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழ்; சங்கீதத்திற்கேற்ற கண்ணியமான, எளிதில் புரியும் நடை. கடவுளை மரியாதைப் பன்மையில் நேரடியாக அழைக்கும் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
