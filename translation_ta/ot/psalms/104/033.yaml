source:
  edition: WLC
  text: אָשִׁ֣ירָה לַ/יהוָ֣ה בְּ/חַיָּ֑/י אֲזַמְּרָ֖ה לֵ/אלֹהַ֣/י בְּ/עוֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/033.yaml
  text: I will sing to Yahweh as long as I live[b][a]; I will make music to my God while I still live.
translation:
  language: ta
  text: நான் உயிரோடிருக்கும் காலமெல்லாம் யாவேக்குப் பாடுவேன்; நான் வாழும்வரைக்கும் என் கடவுளுக்கு இசை பாடுவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָשִׁירָה
  choice: பாடுவேன்
  rationale: שׁיר என்பதன் Qal முதலாம் நபர் ஒருமை விருப்ப/தீர்மான வடிவம்; கவிதைச் சூழலில் உறுதியான எதிர்கால நோக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ புகழின் இலக்கைக் குறிக்கிறது; יהוה என்ற உடன்படிக்கைப் பெயர் மொழிபெயர்க்கப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்படுகிறது.
- source_word: בְּחַיָּי
  choice: நான் உயிரோடிருக்கும் காலமெல்லாம்
  rationale: சொல்லுக்கு சொல் ‘என் வாழ்வில்’; இங்கு வாழ்நாள் முழுவதையும் குறிக்கும் காலப்பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
- source_word: אֲזַמְּרָה
  choice: இசை பாடுவேன்
  rationale: זמר என்பதன் Piel விருப்ப/தீர்மான வடிவம் இசையுடன் பாடுதல் அல்லது இசைமூலம் புகழ்தலைக் குறிக்கிறது; முதல் வினையிலிருந்து அதன் இசை நுணுக்கத்தை வேறுபடுத்துகிறது.
- source_word: לֵאלֹהַי
  choice: என் கடவுளுக்கு
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் உறவுப் பொருளில் ‘என் கடவுள்’; לְ புகழின் இலக்கைக் குறிக்கிறது.
- source_word: בְּעוֹדִי
  choice: நான் வாழும்வரைக்கும்
  rationale: עוֹד தொடர்ந்திருத்தல் அல்லது இன்னும் நிலைத்திருத்தலைக் குறிக்கிறது. தமிழில் இயல்பான காலத் தொடர்ச்சியாகத் தரப்படுகிறது; முதல் அடியின் வாழ்நாள் கருத்துடன் கவிதை இணைநிலையைப் பேணுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: எபிரெய மூலத்தில் நான்கெழுத்து உடன்படிக்கைப் பெயர் நேரடியாக உள்ளது; பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்ப்பது மூல வேறுபாட்டைப் பாதுகாக்கிறது.
- issue: בְּעוֹדִי என்பதன் தொடர்ந்திருத்தல் சார்ந்த பொருள்
  choice: நான் வாழும்வரைக்கும்
  alternative: நான் இன்னும் இருக்கும்வரைக்கும்
  rationale: ‘இருத்தல்’ என்ற விரிவான நிழற்பொருள் சாத்தியமானாலும், இச்சூழலின் இணை அடியும் இயல்பான தமிழும் உயிர்வாழும் காலத்தைக் குறிக்கின்றன; இருப்பியல் தத்துவப் பொருளை தேவையின்றி இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. இரு இணை அடிகளின் தீர்மானத் தொனியும், שׁיר மற்றும் זמר இடையிலான பாடுதல்/இசைப்பாடுதல் வேறுபாடும் இயன்றவரை காக்கப்பட்டுள்ளன.
