  text: Man goes out to his work and to his labor until evening[a][b].
translation:
  language: ta
  text: மனிதன்[a] தன் வேலைக்கும் உழைப்புக்கும் மாலைவரை புறப்பட்டுச் செல்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மனிதர்கள்” என்றும் பொருள் கொள்ளலாம். எபிரெய மொழியில் אָדָם என்பது இங்கு மனிதகுலத்தைக் குறிக்கும் பொதுப்பொருள் ஒருமையாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצֵא
  choice: புறப்பட்டுச் சென்று
  rationale: יצא என்பதன் இயக்கப் பொருளையும், இச்சூழலில் வழக்கமாக நிகழும் பகல்நேரச் செயலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: இங்கு விலங்குகளின் இரவுநேரச் செயலுக்கு மாறாக மனிதகுலத்தின் வழக்கமான செயல்பாட்டைக் குறிக்கும் பொதுப்பொருள் ஒருமையாக வருகிறது. ‘மனிதன்’ மூலத்தின் ஒருமை வடிவத்தையும் பிரதிநிதித்துவப் பொருளையும் காக்கிறது.
- source_word: לְפָעֳלוֹ
  choice: தன் வேலையைச் செய்ய
  rationale: פֹּעַל என்பது வேலை, செயல் அல்லது பணி எனப் பொருள்படும். יצא என்பதுடன் வரும் לְ நோக்கத்தைக் குறிப்பதால், தமிழில் ‘தன் வேலையைச் செய்ய’ என்பது தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: וְלַעֲבֹדָתוֹ
  choice: உழைக்கிறான்
  rationale: עֲבֹדָה என்பது வேலை, பணி, உழைப்பு ஆகியவற்றைக் குறிக்கலாம். முந்தைய פֹּעַל உடன் உள்ள பொருள் இணைப்பைத் தமிழில் ‘வேலை’ மற்றும் ‘உழைக்கிறான்’ என வெளிப்படுத்துவது தேவையற்ற சொல் மீளுரைப்பைத் தவிர்த்து கவிதைச் சமநிலையைத் தக்கவைக்கிறது.
- source_word: עֲדֵי עָרֶב
  choice: மாலைவரை
  rationale: கவிதைநடையிலான עֲדֵי கால எல்லையைக் குறிக்கிறது; ‘மாலைவரை’ அதன் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: אָדָם என்பதை மனிதகுலத்தைக் குறிக்கும் பொதுப்பொருள் ஒருமையாக மொழிபெயர்த்தல்
  choice: மனிதன்
  alternative: மனிதர்கள்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமை வடிவில் இருந்தாலும், இச்சூழலில் மனிதர்களின் பொதுவான படைப்பியல் வாழ்க்கை முறையைப் பிரதிநிதித்துவமாகக் குறிக்கிறது. முதன்மை உரையில் ஒருமையைப் பேணி, அதன் பொதுப்பொருளை அடிக்குறிப்பில் தெளிவுபடுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைச்சொற்களான ‘வேலை/உழைப்பு’ பெயர்ச்சொல் மீளுரைப்பாக அல்லாமல், ‘வேலையைச் செய்ய… உழைக்கிறான்’ என்ற தமிழுக்கு இயல்பான அமைப்பில் தரப்பட்டுள்ளன.
