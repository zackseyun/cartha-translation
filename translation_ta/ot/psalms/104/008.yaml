  yaml_path: translation/ot/psalms/104/008.yaml
  text: The mountains rose[a], the valleys sank down, to the place that you established for them.
translation:
  language: ta
  text: மலைகள் உயர்ந்தன[a]; பள்ளத்தாக்குகள் தாழ்ந்தன—நீ அவற்றுக்காக நிறுவிய இடத்தை நோக்கி.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, எபிரெயக் கவிதையை வேறொரு சாத்தியமான முறையில் புரிந்துகொண்டால்: “அவை மலைகளின்மேல் ஏறின; பள்ளத்தாக்குகளுக்குள் இறங்கின; நீ அவற்றுக்காக நிறுவிய இடத்தை நோக்கிச் சென்றன.” இங்கே “அவை” என்பது மறைமுகமாகக் குறிப்பிடப்படும் நீர்களைக் குறிக்கும்.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲלוּ
  choice: உயர்ந்தன
  rationale: עלה என்பதன் Qal வடிவம் மேல்நோக்கிய இயக்கத்தைக் குறிக்கிறது. நில அமைப்பே எழுவதாகப் புரியும் முதன்மை வாசிப்பில், ‘உயர்ந்தன’ என்பது இயல்பாகவும் கவித்துவ இணைப்பைத் தக்கவைத்தும் உள்ளது.
- source_word: הָרִים
  choice: மலைகள்
  rationale: எபிரெயச் சொல்லின் பன்மைப் பொருளை நேரடியாகத் தருகிறது; தமிழில் தனி definite article இல்லாததால் சூழலே குறிப்புத்தன்மையை உணர்த்துகிறது.
- source_word: יֵרְדוּ
  choice: தாழ்ந்தன
  rationale: ירד கீழ்நோக்கிய இயக்கத்தைக் குறிக்கிறது. மலைகள் உயர்வதற்கு இணையாகப் பள்ளத்தாக்குகள் தாழ்வதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בְקָעוֹת
  choice: பள்ளத்தாக்குகள்
  rationale: தாழ்வான நிலப்பகுதிகள் அல்லது பள்ளங்களைக் குறிக்கும் சொல்லுக்கு, இந்நில அமைப்புச் சூழலில் ‘பள்ளத்தாக்குகள்’ தெளிவான நவீனத் தமிழ் இணையாகும்.
- source_word: אֶל מְקוֹם
  choice: இடத்திற்கு
  rationale: ஒரு இலக்கை நோக்கிய இயக்கத்தைக் குறிக்கும் אֶל என்பதையும், அதைத் தொடரும் குறிப்பிட்ட இடத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: זֶה
  choice: நிர்ணயித்த
  rationale: מְקוֹם זֶה יָסַדְתָּ என்ற தொடரைத் தமிழில் இயல்பான தொடர்பெயரெச்ச அமைப்பாக மாற்றும்போது, demonstrative-இன் குறிப்புத்தன்மை ‘நீ நிர்ணயித்த இடம்’ என்பதில் அடங்குகிறது.
- source_word: יָסַדְתָּ
  choice: நிர்ணயித்த
  rationale: יסד என்பதன் ‘நிறுவுதல்/நிலைநிறுத்துதல்’ பொருளை, படைப்பில் கடவுள் ஒதுக்கிய நிலையான இடம் என்ற சூழலில் ‘நிர்ணயித்த’ தெளிவாகத் தெரிவிக்கிறது.
- source_word: לָהֶם
  choice: அவற்றுக்காக
  rationale: ஆண்பால் பன்மை பின்னொட்டின் பன்மைச் சுட்டைத் தக்கவைக்கிறது; முதன்மை வாசிப்பில் முன் கூறப்பட்ட நில அமைப்புகளைக் கூட்டாகச் சுட்டுகிறது.
theological_decisions:
- issue: கவிதை வரியில் வினைகளின் எழுவாய்
  choice: 'மலைகளும் பள்ளத்தாக்குகளும் எழுவாய்கள்: ‘மலைகள் உயர்ந்தன; பள்ளத்தாக்குகள் தாழ்ந்தன.’'
  alternative: 'முந்தைய வசனத்தின் தண்ணீர்களே மறைமுக எழுவாய்: ‘அவை மலைகளின்மேல் ஏறி, பள்ளத்தாக்குகளுக்குள் இறங்கின.’'
  rationale: மசோரெத்திய உரையின் சொல் அமைப்பு மலைகளையும் பள்ளத்தாக்குகளையும் வினைகளின் எழுவாய்களாகப் புரிந்துகொள்ள இடமளிக்கிறது. ஆயினும் சுற்றியுள்ள சூழல் தண்ணீர்கள் விலகிச் செல்வதைப் பற்றியதால் மற்ற வாசிப்பும் உண்மையில் சாத்தியம்; எனவே அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கண்ணியமான எளிய கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உயர்ந்தன / தாழ்ந்தன’ என்ற இணை அமைப்பு எபிரெயக் கவிதையின் எதிரிணையைப் பேணுகிறது. முதன்மை உரையின் இறுதியில் தமிழில் தேவைப்படும் ‘சென்றன’ சேர்க்கப்பட்டு, இலக்கை நோக்கிய אֶל என்பதன் இயக்கப் பொருள் வெளிப்படுத்தப்பட்டுள்ளது.
