translation:
  language: ta
  text: 'அங்கே பறவைகள் தங்கள் கூடுகளைக் கட்டுகின்றன;

    நாரைக்குச் சைப்ரஸ் மரங்களில் தன் வீடு உள்ளது.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘ஃபர் மரங்கள்,’ ‘ஜூனிப்பர் மரங்கள்,’ அல்லது வேறொரு ஊசியிலை மரவகை; இதற்குரிய எபிரெயச் சொல் குறிக்கும் துல்லியமான மரவகை உறுதியாகத் தெரியவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר שָׁם
  choice: அங்கே
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட மரங்களை இடமாகச் சுட்டும் தொடர்புத்தொடர்; நவீன தமிழில் இயல்பாகவும் சுருக்கமாகவும் ‘அங்கே’ என வழங்கப்படுகிறது.
- source_word: צִפֳּרִים
  choice: பறவைகள்
  rationale: பறவைகளைப் பொதுவாகக் குறிக்கும் சொல்; தமிழில் தேவையற்ற சுட்டுப்பெயரின்றி பொதுப்பன்மை இயல்பாக உள்ளது.
- source_word: יְקַנֵּנוּ
  choice: தங்கள் கூடுகளைக் கட்டுகின்றன
  rationale: קנן என்பதன் ‘கூடுகட்டுதல்/கூடு அமைத்தல்’ என்ற செயற்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: חֲסִידָה
  choice: நாரை
  rationale: இச்சொல் வழக்கமாக stork இனப் பறவையைக் குறிக்கிறது; தமிழில் பொதுவாகப் புரியக்கூடிய இணைச்சொல் ‘நாரை’.
- source_word: בְּרוֹשִׁים
  choice: தேவதாரு மரங்கள்
  rationale: ஓர் ஊசியிலை மரவகையைக் குறிக்கும் எபிரெயச் சொல்லின் துல்லியமான தாவரவியல் அடையாளம் உறுதியில்லை. தமிழில் அறியப்பட்ட ‘தேவதாரு மரங்கள்’ முதன்மைப் பெயராகத் தேர்ந்தெடுக்கப்பட்டு, ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בֵּיתָהּ
  choice: வீடு இருக்கிறது
  rationale: சொல்லடியாக ‘அதன் வீடு’; பறவையின் வாழிடத்தைக் குறிக்கும் இயல்பான தமிழ் அமைப்பாக வழங்கப்பட்டுள்ளது.
