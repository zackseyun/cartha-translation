  text: הָרִ֣ים הַ֭/גְּבֹהִים לַ/יְּעֵלִ֑ים סְ֝לָעִ֗ים מַחְסֶ֥ה לַֽ/שְׁפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/018.yaml
  text: The high mountains are for the wild goats[b][a]; the rocks are a refuge for the rock badgers.
translation:
  language: ta
  text: உயர்ந்த மலைகள் காட்டாடுகளுக்கானவை[a]; பாறைகள் குழிமுயல்களுக்குப் புகலிடம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஐபெக்ஸ்களுக்கானவை”; இவை மலைப்பகுதிகளில் வாழும் ஒருவகைக் காட்டு ஆடுகள்.
    reason: lexical_alternative
  - marker: b
    text: அதாவது, “ஹைராக்ஸ்களுக்குப் புகலிடம்.” குழிமுயல் என்று அழைக்கப்படும் ஹைராக்ஸ் உண்மையில் முயல் அல்ல; பாறைகளில் வாழும் சிறிய விலங்கு.
    reason: lexical_clarification
lexical_decisions:
- source_word: הָרִים הַגְּבֹהִים
  choice: உயர்ந்த மலைகள்
  rationale: பெயர்ச்சொல்லையும் அதை விவரிக்கும் பெயரடையையும் இயல்பான நவீனத் தமிழில் நேரடியாகத் தருகிறது; உயரமான வாழிடப் படிமத்தையும் காக்கிறது.
- source_word: לַיְּעֵלִים
  choice: காட்டாடுகளுக்கானவை
  rationale: יָעֵל என்பது மலைப்பாங்கான இடங்களில் வாழும் காட்டு ஆடு அல்லது ஐபெக்ஸைக் குறிக்கிறது. ‘காட்டாடுகள்’ பொதுவாசகர்களுக்கு எளிதில் புரியும்; விலங்கியல் துல்லியமான மாற்றுப் பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: סְלָעִים
  choice: பாறைகள்
  rationale: பாறை அமைப்புகளைக் குறிக்கும் எபிரெயப் பன்மையைத் தெளிவான, இயல்பான தமிழில் தருகிறது.
- source_word: מַחְסֶה
  choice: புகலிடம்
  rationale: பாதுகாப்பும் ஒதுங்குமிடமும் அளிக்கும் இடம் என்ற பொருளைச் சுருக்கமாகவும் சங்கீதத்தின் கவிதை நடைக்கு ஏற்றவாறும் வெளிப்படுத்துகிறது.
- source_word: לַשְׁפַנִּים
  choice: குழிமுயல்களுக்குப்
  rationale: שָׁפָן என்பது பாறைகளில் வாழும் ஹைராக்ஸ் எனப்படும் சிறு விலங்கு. தமிழில் பரவலாகப் பயன்படுத்தப்படும் வேதாகம விலங்குப் பெயரான ‘குழிமுயல்’ வாசிப்புக்கு எளியது; அது உண்மையான முயல் அல்ல என்பதை அடிக்குறிப்பு தெளிவுபடுத்துகிறது.
