base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/025.yaml
  text: There is the sea[a], great and broad of hands; in it are swarming things without number[c][b], living creatures small along with great.
translation:
  language: ta
  text: இதோ, பெரியதும் பரந்த விரிவுடையதுமான கடல்[a]; அதில் எண்ணிலடங்காத அசையும் உயிரினங்கள் உள்ளன—சிறியவையும் பெரியவையும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் சொற்படி, “கைகளில் அகன்றது”; இது இருபுறமும் அகன்று பரந்த விரிவைக் குறிக்கும் மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: זֶה הַיָּם
  choice: இதோ கடல்
  rationale: זֶה இங்கு கடலை வியப்புடன் சுட்டிக்காட்டுகிறது. தமிழில் இயல்பான கவிதைநடையில் அந்தச் சுட்டுணர்வை ‘இதோ’ வெளிப்படுத்துகிறது.
- source_word: גָּדוֹל
  choice: பெரிதும்
  rationale: கடலின் அளவையும் சங்கீதத்தின் உயர்ந்த கவிதைத் தொனியையும் காக்கிறது.
- source_word: וּרְחַב יָדַיִם
  choice: அகன்று விரிந்ததுமாய்
  rationale: ‘கைகளில் அகன்றது’ என்ற எபிரெய உருவகத்தை அப்படியே மொழிபெயர்ப்பது தமிழில் தெளிவற்றதாக இருக்கும்; அதன் பொருளான இருபுறமும் பரந்த விரிவை இயல்பாகத் தருகிறது. மூல உருவகம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: שָׁם
  choice: அதில்
  rationale: இடத்தைக் குறிக்கும் இச்சொல் முன் குறிப்பிடப்பட்ட கடலைச் சுட்டுவதால், தமிழில் ‘அதில்’ என்பது தொடர்பைத் தெளிவாகவும் இயல்பாகவும் காட்டுகிறது.
- source_word: רֶמֶשׂ
  choice: அசைந்து திரிகின்ற உயிரினங்கள்
  rationale: இச்சூழலில் கடலில் நகர்ந்து திரியும் பலவகை உயிர்களைத் தொகுப்பாகக் குறிக்கிறது. ‘ஊர்வன’ என்பது நிலவாழ் உயிர்களாகப் பொருள் குறுகக்கூடும்.
- source_word: וְאֵין מִסְפָּר
  choice: எண்ணிலடங்காத
  rationale: ‘எண்ணிக்கை இல்லை’ என்ற எபிரெய மரபுத்தொடரின் பொருளைச் சுருக்கமாகவும் கவிதைநயத்துடனும் தருகிறது.
- source_word: חַיּוֹת קְטַנּוֹת עִם גְּדֹלוֹת
  choice: உயிரினங்கள்—சிறியவையும் பெரியவையும்
  rationale: חַיּוֹת என்பதை உயிருள்ள படைப்புகள் என்ற பரந்த பொருளில் வைத்துக் கொண்டு, עִם காட்டும் சிறியவை பெரியவைகளோடு சேர்ந்திருக்கும் உள்ளடக்கத்தையும் காக்கிறது.
