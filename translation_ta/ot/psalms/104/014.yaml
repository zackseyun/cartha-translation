source:
  edition: WLC
  text: מַצְמִ֤יחַ חָצִ֨יר לַ/בְּהֵמָ֗ה וְ֭/עֵשֶׂב לַ/עֲבֹדַ֣ת הָ/אָדָ֑ם לְ/ה֥וֹצִיא לֶ֝֗חֶם מִן הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/014.yaml
  text: He causes grass to grow for the cattle[a], and plants for the service of man, to bring forth bread from the earth,
translation:
  language: ta
  text: அவர் கால்நடைகளுக்காகப் புல்லையும், மனிதரின்[a] உழைப்புக்காகப் பயிர்களையும் முளைக்கச் செய்கிறார்; பூமியிலிருந்து அப்பம் விளையச் செய்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனிதகுலத்தின் உழைப்புக்காக.’ எபிரேயத்தில் ‘மனிதன்’ என்ற சொல் இங்கு மனித இனத்தைப் பொதுவாகக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצְמִיחַ
  choice: முளைக்கச் செய்கிறார்
  rationale: צמח என்பதன் ஹிஃபில் வினையெச்ச வடிவம் காரணவினைப் பொருளைத் தருகிறது; தாவர வளர்ச்சியைச் செய்பவர் கடவுள் என்பதை இச்சொற்றொடர் இயல்பான தமிழில் காக்கிறது.
- source_word: חָצִיר
  choice: புல்
  rationale: இச்சூழலில் விலங்குகளுக்கான தீவனத் தாவரங்களைக் குறிக்கிறது; ‘புல்’ என்பது இயல்பானதும் சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: לַבְּהֵמָה
  choice: கால்நடைகளுக்காக
  rationale: בְּהֵמָה இங்கு பொதுவாக வளர்ப்பு விலங்குகளைக் குறிக்கிறது; ‘கால்நடைகள்’ நவீனத் தமிழில் தெளிவான கூட்டுப்பெயர்.
- source_word: וְעֵשֶׂב
  choice: பயிர்கள்
  rationale: עֵשֶׂב சமையல் மூலிகைகளை மட்டும் அல்லாமல் மனிதருக்குப் பயன்படும் தாவரங்களையும் குறிக்கலாம்; உழைப்பு மற்றும் அப்பம் பற்றிய வேளாண்மைச் சூழலில் ‘பயிர்கள்’ இயல்பாகப் பொருந்துகிறது.
- source_word: לַעֲבֹדַת הָאָדָם
  choice: மனிதரின் உழைப்புக்காக
  rationale: עֲבֹדָה என்பதில் உழைப்பு, வேலை, பணி ஆகிய பொருள்கள் உள்ளன. ‘உழைப்புக்காக’ என்பது வேளாண்மைச் சூழலுக்கு ஏற்றபடியே அதன் விரிந்த தொடர்பையும் முற்றிலும் குறுக்காமல் காக்கிறது.
- source_word: הָאָדָם
  choice: மனிதர்
  rationale: אָדָם இங்கு ஒரு தனிப்பட்ட ஆணை அல்ல, மனித இனத்தைப் பொதுவாகக் குறிக்கிறது. மரியாதை ஒருமை/பொதுமைத் தன்மையுள்ள ‘மனிதர்’ நவீனத் தமிழில் இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְהוֹצִיא
  choice: பெறும்படி செய்கிறார்
  rationale: இந்த நோக்க/விளைவு வினையெச்சம் பூமியிலிருந்து அப்பம் வெளிவரச் செய்வதைச் சொல்கிறது. அப்பம் நேரடியாக மண்ணில் விளைவதில்லை என்பதால், தமிழில் பொருளை இயல்பாக வெளிப்படுத்த இந்த வடிவம் பயன்படுத்தப்படுகிறது; காரணவினைத் தொடர்பும் காக்கப்படுகிறது.
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: לֶחֶם சில இடங்களில் பொதுவாக உணவைக் குறிக்கலாம்; இங்கு அதன் நேரடியான பொருளான ‘அப்பம்’ வேளாண்மை உருவகத்தையும் மூலச்சொல்லையும் காக்கிறது.
- source_word: מִן הָאָרֶץ
  choice: பூமியிலிருந்து
  rationale: אֶרֶץ இங்கு விளைபொருளின் ஆதாரமான நிலம்/பூமியைக் குறிக்கிறது; சங்கீதத்தின் பரந்த படைப்புச் சூழலில் ‘பூமியிலிருந்து’ பொருத்தமானது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுமைப் பொருள்
  choice: மனிதர்
  alternative: மனித இனம்
  rationale: எபிரெயச் சொல் இலக்கணத்தில் ஒருமையாக இருந்தாலும் இங்கு மனிதகுலத்தைப் பிரதிநிதித்துவமாகக் குறிக்கிறது. ‘மனிதர்’ அந்த ஒருமை வடிவத்தையும் உள்ளடக்கமான பொதுமைப் பொருளையும் தமிழில் காக்கிறது.
- issue: לְהוֹצִיא என்ற நோக்க/விளைவு சொற்றொடரின் செய்பவர்
  choice: முந்தைய காரணவினையின் தொடர்ச்சியாக ‘பெறும்படி செய்கிறார்’
  alternative: மனிதர் பூமியிலிருந்து அப்பத்தைப் பெறும்படி
  rationale: எபிரெய infinitive வடிவம் நோக்கம் அல்லது விளைவைக் குறிக்கக்கூடும்; செய்பவர் வெளிப்படையாக மீண்டும் சொல்லப்படவில்லை. கடவுளின் வளரச்செய்யும் செயலையும் மனித உழைப்பின் வழியாகக் கிடைக்கும் அப்பத்தையும் இணைக்கும் வகையில் மொழிபெயர்க்கப்பட்டுள்ளது; மனித முயற்சி அல்லது தெய்வச் செயல் மட்டும் என்று பதற்றத்தை ஒருதலைப்பட்சமாகத் தீர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடன் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘முளைக்கச் செய்கிறார்’ என்ற காரணவினை மூலத்தின் செயற்பாட்டைத் தெளிவாகக் காக்கிறது; ‘அப்பம்’ என்ற நேரடிப் பொருள் பொதுவான ‘உணவு’ என்பதற்குப் பதிலாகப் பாதுகாக்கப்பட்டுள்ளது.
