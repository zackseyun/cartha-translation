base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/022.yaml
  text: The sun rises[b][a]; they gather themselves and lie down in their dens.
translation:
  language: ta
  text: சூரியன் உதிக்கிறது; அவை ஒதுங்கி[a], தங்கள் பதுங்கிடங்களில்[b] படுத்துக்கொள்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒன்றுகூடுகின்றன,” “சேர்க்கப்படுகின்றன,” அல்லது “பின்வாங்குகின்றன.” எபிரெய வினைச்சொல் செயப்பாட்டுப் பொருளிலோ (“சேர்க்கப்படுகின்றன”), தாமாக விலகுவதைக் குறிக்கும் பொருளிலோ புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “குகைகளில்,” “வாழிடங்களில்.” எபிரெயச் சொல் ஒரு இருப்பிடத்தைக் குறிக்கிறது; இங்கு விலங்குகளைப் பற்றிய சூழலில் “பதுங்கிடங்கள்” பொருத்தமானது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרַח
  choice: உதிக்கிறது
  rationale: זרח என்பதன் Qal வடிவம், சூரியனை எழுவாயாகக் கொண்டு, சூரியன் உதிப்பதைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பானதும் சூழலுக்குப் பொருத்தமானதும் ‘உதிக்கிறது’ ஆகும்.
- source_word: הַשֶּׁמֶשׁ
  choice: சூரியன்
  rationale: குறிப்பிட்ட பெயர்ச்சொல்லின் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: יֵאָסֵפוּן
  choice: அவை ஒதுங்குகின்றன
  rationale: אסף என்பதன் Niphal வடிவம் ‘ஒன்றுசேர்க்கப்படுதல்’ அல்லது தாமாக ‘விலகுதல்/ஒதுங்குதல்’ என்ற பொருள்களைத் தரலாம். முந்தைய வசனத்தின் இரவுநேர விலங்குகள் பகலில் இருப்பிடங்களுக்குத் திரும்பும் சூழலில், வெளிப்புறச் செய்பவரை முன்வைக்காமல் ‘ஒதுங்குகின்றன’ என்பது பொருளை இயல்பாகத் தருகிறது.
- source_word: וְאֶל
  choice: தங்கள் குகைகளில்
  rationale: எபிரெயச் சொற்கள் நேரடியாக ‘அவற்றின் இருப்பிடங்களை நோக்கி’ எனக் குறித்தாலும், அடுத்துள்ள ‘படுத்துக்கொள்கின்றன’ என்பதோடு தமிழில் இருப்பிட வேற்றுமையைப் பயன்படுத்துவது இயல்பாக உள்ளது.
- source_word: מְעוֹנֹתָם
  choice: தங்கள் குகைகளில்
  rationale: מָעוֹן என்பது வாழிடம் அல்லது தங்குமிடம். இங்கு விலங்குகளைப் பற்றிய சூழல் இருப்பதால் ‘குகைகள்’ தெளிவான, இயல்பான தெரிவாகும்.
- source_word: יִרְבָּצוּן
  choice: படுத்துக்கொள்கின்றன
  rationale: רבץ என்பது விலங்குகள் படுத்திருப்பதையோ பதுங்கியிருப்பதையோ குறிக்கும். பகலில் தங்கள் இருப்பிடங்களில் தங்கும் காட்சியை ‘படுத்துக்கொள்கின்றன’ தெளிவாக வெளிப்படுத்துகிறது.
