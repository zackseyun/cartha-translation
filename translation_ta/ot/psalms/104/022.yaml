- from: சூரியன் உதிக்கிறது; அவை ஒதுங்குகின்றன[a], தங்கள் குகைகளில்[b] படுத்துக்கொள்கின்றன.
  to: சூரியன் உதிக்கிறது; அவை ஒதுங்கி[a], தங்கள் பதுங்கிடங்களில்[b] படுத்துக்கொள்கின்றன.
