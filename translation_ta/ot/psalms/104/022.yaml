translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தையும் எளிய வாசிப்பையும் இணைக்கும் நடை. எபிரெய வாக்கியத்தின் தொடர்ச்சியான மூன்று செயல்களும் நிகழ்காலத்தில் தரப்பட்டுள்ளன; ‘அவை’ என்பது முந்தைய வசனத்தில் வரும் விலங்குகளைச் சுட்டுகிறது. மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
