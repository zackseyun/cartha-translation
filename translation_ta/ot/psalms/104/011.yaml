  text: All the beasts of the field drink from them[b][a]; the wild donkeys quench their thirst.
translation:
  language: ta
  text: காட்டுவெளி விலங்குகள் அனைத்தும் அவற்றிலிருந்து குடிக்கின்றன[a]; காட்டு கழுதைகள் தங்கள் தாகத்தைத் தணித்துக்கொள்கின்றன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவை அவற்றுக்கு நீர் அளிக்கின்றன’; எபிரெய வினைச்சொல் விலங்குகளுக்குக் குடிக்க நீர் கொடுப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
