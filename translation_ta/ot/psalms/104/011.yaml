lexical_decisions:
- source_word: יַשְׁקוּ
  choice: அவற்றிலிருந்து குடிக்கின்றன
  rationale: שׁקה என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘குடிக்கக் கொடு/நீரூட்டு’ எனப் பொருள்படும். இங்கு முந்தைய வசனத்திலுள்ள நீரோடைகள் கருத்திலுள்ள எழுவாயாக இருப்பதால், இயல்பான தமிழில் விலங்குகள் ‘அவற்றிலிருந்து குடிக்கின்றன’ என்று மொழிபெயர்க்கப்பட்டது; ‘அவற்றிலிருந்து’ என்பது சூழலிலிருந்து வழங்கப்படுகிறது.
- source_word: כָּל
  choice: அனைத்தும்
  rationale: விலங்குகளின் முழுத் தொகுதியையும் குறிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: חַיְתוֹ שָׂדָי
  choice: வயல்வெளியின் விலங்குகள்
  rationale: திறந்த வெளி அல்லது நாட்டுப்புறப் பகுதியில் வாழும் விலங்குகளைக் குறிக்கும் இணைப்புச் சொற்றொடர். ‘வயல்வெளியின் விலங்குகள்’ என்பது தெளிவான, கண்ணியமான நவீனத் தமிழ்.
- source_word: יִשְׁבְּרוּ
  choice: தீர்த்துக்கொள்கின்றன
  rationale: ‘தாகம்’ என்பதுடன் வரும் שׁבר, சொற்பொருளான ‘உடைத்தல்’ அல்ல; தாகத்தைத் தணித்தல் அல்லது தீர்த்தல் என்னும் மரபுத்தொடர்ப் பொருளைக் கொண்டது.
- source_word: פְרָאִים
  choice: காட்டுக் கழுதைகள்
  rationale: காட்டு கழுதைகள் அல்லது ஓனாகர்கள் எனப்படும் விலங்கைக் குறிக்கிறது. ‘காட்டுக் கழுதைகள்’ என்பது தொழில்நுட்பச் சொல்லின்றி சாதாரண வாசகர்களுக்குத் தெளிவாக உள்ளது.
- source_word: צְמָאָם
  choice: தங்கள் தாகத்தை
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை உரிமை விகுதி கொண்ட பெயர்ச்சொல்; தமிழில் எழுவாயோடு இயல்பாக இசைவதற்காக ‘தங்கள் தாகத்தை’ என வழங்கப்பட்டது.
