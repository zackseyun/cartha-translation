  text: All of them wait for you to give them their food in its time[a][b].
translation:
  language: ta
  text: அவை அனைத்தும் தங்கள் உணவை உரிய வேளையில் நீர் அளிப்பதற்காக உம்மை எதிர்பார்த்துக் காத்திருக்கின்றன[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உம்மை ஆவலுடன் நோக்குகின்றன’ அல்லது ‘உம்மில் நம்பிக்கை வைக்கின்றன.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தக்க காலத்தில்’ அல்லது ‘ஏற்ற வேளையில்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: அவை அனைத்தும்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட எல்லா உயிரினங்களையும் தொகுப்பாகவும் பகிர்ந்துணர்த்தும் வகையிலும் குறிக்கிறது.
- source_word: אֵלֶיךָ
  choice: உம்மை
  rationale: எதிர்பார்ப்புடன் காத்திருக்கும் செயல் சார்ந்திருக்கும் நபராகிய கடவுளை நோக்கியுள்ளது; தமிழில் ‘உம்மை ... எதிர்பார்த்துக் காத்திருக்கின்றன’ என்பது இயல்பாக உள்ளது.
- source_word: יְשַׂבֵּרוּן
  choice: எதிர்பார்த்துக் காத்திருக்கின்றன
  rationale: Piel வடிவம் வெறும் காலதாமதத்தைக் காட்டாமல் நம்பிக்கையுடனான எதிர்பார்ப்பையும் உணர்த்துகிறது; இருகூறு தமிழ் சொற்றொடர் அந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: לָתֵת
  choice: கொடுப்பீர் என்று
  rationale: முடிவிலி வடிவம் அவை எதை எதிர்பார்த்துக் காத்திருக்கின்றன என்பதைக் காட்டுகிறது; தமிழில் மேற்கோள் அமைப்பு இயல்பானது.
- source_word: אָכְלָם
  choice: தத்தம் உணவை
  rationale: ஒவ்வொரு உயிரினத்திற்குமான உணவைப் பகிர்ந்துணர்த்தும் உடைமைப் பின்னொட்டை ‘தத்தம்’ தெளிவாக வெளிப்படுத்துகிறது; இது இரை மட்டும் அல்ல, பொதுவான உணவைக் குறிக்கிறது.
- source_word: בְּעִתּוֹ
  choice: ஏற்ற வேளையில்
  rationale: அதற்குரிய அல்லது தகுந்த காலம் என்ற பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; நேரத்தை அளவுக்கு மீறி குறிப்பாக்கவில்லை.
theological_decisions:
- issue: படைப்புயிர்களுக்கு இறைவன் அளிக்கும் பராமரிப்பு
  choice: எல்லா உயிரினங்களும் உணவுக்காக இறைவனை எதிர்பார்த்துச் சார்ந்திருப்பதாக மொழிபெயர்க்கப்பட்டது.
  alternative: அவை இறைவனில் நம்பிக்கை வைக்கின்றன அல்லது வழிபாட்டுடன் அவரை நோக்குகின்றன என்று விரிவுபடுத்துதல்.
  rationale: எபிரேய உரை எதிர்பார்ப்புடனான சார்பை உணர்த்துகிறது; ஆனால் வெளிப்படையாக இல்லாத வழிபாட்டு அல்லது கோட்பாட்டு மொழியைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, கண்ணியமான மற்றும் பொதுவாசகர்களுக்குப் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்க மரியாதைப் பன்மையான ‘நீர்/உம்மை’ பயன்படுத்தப்பட்டுள்ளது; உயிரினங்களுக்கு அஃறிணைப் பன்மை அமைப்பு கையாளப்பட்டுள்ளது.
