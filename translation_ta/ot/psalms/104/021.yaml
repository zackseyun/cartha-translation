  variant: modern standard Tamil
source:
  edition: WLC
  text: הַ֭/כְּפִירִים שֹׁאֲגִ֣ים לַ/טָּ֑רֶף וּ/לְ/בַקֵּ֖שׁ מֵ/אֵ֣ל אָכְלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/021.yaml
  text: The young lions roar for prey, seeking their food from God.
translation:
  language: ta
  text: இளம் சிங்கங்கள் இரைக்காகக் கர்ஜிக்கின்றன; தங்கள் உணவை இறைவனிடமிருந்து தேடுகின்றன.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכְּפִירִים
  choice: இளம் சிங்கங்கள்
  rationale: כְּפִירִים என்பது முழுவளர்ச்சி அடையாத அல்லது இளமையான சிங்கங்களைக் குறிக்கிறது; நவீன தமிழில் இயல்பாகவும் தெளிவாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: שֹׁאֲגִים לַטָּרֶף
  choice: இரைக்காகக் கர்ஜிக்கின்றன
  rationale: שאג என்பதன் வலிமையான சிங்கக் குரலையும், לַטָּרֶף என்பதன் நோக்கத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וּלְבַקֵּשׁ מֵאֵל אָכְלָם
  choice: தங்கள் உணவை இறைவனிடமிருந்து தேடுகின்றன
  rationale: בקשׁ என்பதன் ‘தேடு/நாடு’ என்ற பொருளையும், מֵאֵל என்பதன் மூலாதார உறவையும் பாதுகாக்கிறது. இணை வினையெச்சமாக மாற்றாமல், எபிரெய இணைப்பின் இணைநிலையை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சிங்கங்கள் இறைவனிடமிருந்து உணவைத் தேடுதல்
  choice: தங்கள் உணவை இறைவனிடமிருந்து தேடுகின்றன
  alternative: இறைவனிடம் தங்கள் உணவைக் கேட்கின்றன
  rationale: בקשׁ இங்கு ‘தேடுதல்’ அல்லது ‘நாடுதல்’ என்ற பரந்த பொருளைக் கொண்டது. ‘கேட்கின்றன’ என்பது ஜெபம் அல்லது நேரடி வேண்டுதல் என்ற கருத்தை அதிகமாகச் சேர்க்கக்கூடும்; ஆகவே மூலத்தின் கவித்துவமான இறைச் சார்பையும் அதன் திறந்த தன்மையையும் காக்க ‘தேடுகின்றன’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைநயம் மற்றும் கண்ணியமான தொனி காக்கப்பட்டுள்ளன. ‘இறைவன்’ என்பது אֵל என்பதற்கான இயல்பான பொதுத் தமிழ் வடிவம். வசனத்தில் அடிக்குறிப்பு தேவையில்லை.
