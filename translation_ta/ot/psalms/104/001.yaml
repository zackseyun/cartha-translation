source:
  edition: WLC
  text: בָּרֲכִ֥י נַפְשִׁ֗/י אֶת יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַ/י גָּדַ֣לְתָּ מְּאֹ֑ד ה֭וֹד וְ/הָדָ֣ר לָבָֽשְׁתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/001.yaml
  text: Bless Yahweh[a], O my soul! Yahweh my God, you are very great; you have clothed yourself with splendor and majesty.
translation:
  language: ta
  text: 'என் உள்ளமே, யாவேவைப்[a] போற்று!


    யாவே, என் கடவுளே, நீர் மிகவும் மகத்தானவர்;


    மகிமையையும் மாட்சியையும் ஆடையாக அணிந்திருக்கிறீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரேய மொழியில்: ‘YHWH’ (பொதுவாக ‘யாவே’ அல்லது ‘யெகோவா’ என வழங்கப்படுகிறது).'
    reason: தெய்வீகப் பெயரின் மூல மெய்யெழுத்து வடிவத்தையும் மாற்று ஒலிபெயர்ப்புகளையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: בָּרֲכִי
  choice: போற்று
  rationale: தனது உள்ளத்திற்குக் கூறப்படும் பெண்பால் ஒருமை கட்டளை. இவ்வழிபாட்டுச் சூழலில் ‘ஆசீர்வதி’ என்பதைவிட, கடவுளைப் புகழ்ந்து உயர்த்தும் பொருளை இயல்பான நவீனத் தமிழில் ‘போற்று’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: נַפְשִׁי
  choice: என் உள்ளமே
  rationale: இங்கு சங்கீதக்காரர் தம்மையே நேரடியாக விளிக்கிறார். ‘ஆத்துமாவே’ என்ற சமயச் சிறப்புச் சொல்லால் தேவையற்ற உடல்–ஆத்துமா வேறுபாட்டை இறக்குமதி செய்யாமல், முழு உள்மனத் தன்மையைக் குறிக்கும் இயல்பான கவிதைநடைச் சொல்லாக ‘என் உள்ளமே’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பொதுப் பட்டமாக மாற்றாமல், உடன்படிக்கையின் தனிப்பெயராகத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: יְהוָה אֱלֹהַי
  choice: யாவே, என் கடவுளே
  rationale: தெய்வீகப் பெயரும் தனிப்பட்ட உடைமைப் பொருளும் நேரடி விளியாக உள்ளன; தமிழ் அழைப்புமுறைக்கு இயல்பாக இரண்டும் தனித்த விளிகளாக அமைக்கப்பட்டன.
- source_word: גָּדַלְתָּ מְּאֹד
  choice: நீர் மிகவும் பெரியவர்
  rationale: வினையின் நிறைவுற்ற வடிவம் இக்கவிதைப் புகழ்ச்சியில் தற்போதைய நிலையான மகத்துவத்தைச் சுட்டுகிறது. ‘மிகவும் பெரியவர்’ என்பது அந்த வலியுறுத்தலை எளிய, கண்ணியமான தமிழில் தருகிறது.
- source_word: הוֹד וְהָדָר
  choice: மகிமையையும் மாட்சியையும்
  rationale: இணையாக வரும் இரு சொற்களும் ஒளிவீசும் சிறப்பையும் அரசருக்குரிய மேன்மையையும் உணர்த்துகின்றன. ஆடை உருவகத்தோடு இயல்பாகப் பொருந்தும் இணைச்சொற்கள் தேர்ந்தெடுக்கப்பட்டன.
- source_word: לָבָשְׁתָּ
  choice: ஆடையாக அணிந்திருக்கிறீர்
  rationale: மூல வினை ‘அணிதல்/உடுத்தல்’ என்ற ஆடை உருவகத்தைக் கொண்டது. தமிழில் ‘ஆடையாக’ என்பது எதை அணிந்தார் என்ற உருவகத் தொடர்பைத் தெளிவாக்குகிறது; ‘அணிந்திருக்கிறீர்’ நிறைவுற்ற செயலில் விளைந்த தற்போதைய நிலையையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரை பொதுப் பட்டமல்லாமல் நான்கெழுத்துத் தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே பெயரின் தனித்தன்மையைப் பேண ‘யாவே’ பயன்படுத்தப்பட்டு, அதன் மூல வடிவம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- issue: נֶפֶשׁ என்பதன் மனித இயல்பியல் பொருள்
  choice: உள்ளம்
  alternative: ஆத்துமா; உயிர்
  rationale: இவ்விடத்தில் சொல் பிரிக்கத்தக்க ஒரு மனிதக் கூறைப் பற்றிய கோட்பாட்டை விளக்காமல், பாடகர் தம்மையே வழிபாட்டுக்குத் தூண்டும் கவிதை விளியாகச் செயல்படுகிறது. எனவே கோட்பாட்டு முடிவைத் திணிக்காத ‘உள்ளம்’ தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீர்/அணிந்திருக்கிறீர்’ என்ற மரியாதை ஒருமை தெய்வத்தை நேரடியாக விளிக்கும் நடையைப் பேணுகிறது; தேவையற்ற பழமொழி மற்றும் குறிப்பிட்ட திருச்சபை மரபுச் சொற்கள் தவிர்க்கப்பட்டுள்ளன.
