source:
  edition: WLC
  text: עָשָׂ֣ה יָ֭רֵחַ לְ/מוֹעֲדִ֑ים שֶׁ֝֗מֶשׁ יָדַ֥ע מְבוֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/019.yaml
  text: He made the moon for appointed times[a]; the sun knows its setting.
translation:
  language: ta
  text: 'நியமிக்கப்பட்ட காலங்களுக்காக அவர் நிலவை உண்டாக்கினார்[a];

    சூரியன் தன் மறைவை அறியும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பருவங்களுக்காக’ அல்லது ‘விழாக்காலங்களுக்காக’; எபிரெயச் சொல் நிர்ணயிக்கப்பட்ட அல்லது நியமிக்கப்பட்ட காலங்களைக் குறிக்கலாம்; விழாக்காலங்களும் இதில் அடங்கும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: உண்டாக்கினார்
  rationale: Qal வடிவில் இவ்வினை பொதுவாக ‘செய்/உண்டாக்கு’ என்று பொருள்படும். சூழலிலிருந்து கடவுளே எழுவாய் என்பது தெளிவு; ‘நியமித்தார்’ என்பது தொடரின் நோக்கப் பொருளை வினைக்குள் மிகையாகச் சேர்த்துவிடும்.
- source_word: יָרֵחַ
  choice: நிலவை
  rationale: வானிலுள்ள சந்திரனைக் குறிக்கும் நேரடியான, இயல்பான நவீனத் தமிழ் சொல்.
- source_word: לְמוֹעֲדִים
  choice: நியமிக்கப்பட்ட காலங்களுக்காக
  rationale: מוֹעֵד என்பது நிர்ணயிக்கப்பட்ட காலம், பருவம், அல்லது விழாக்காலம் ஆகியவற்றைக் குறிக்கலாம். இத்தேர்வு அதன் விரிவான பொருளைத் தக்கவைத்து, பருவங்கள் அல்லது சமய விழாக்கள் என்று மட்டும் குறுக்காமல் உள்ளது.
- source_word: שֶׁמֶשׁ
  choice: சூரியன்
  rationale: மூலச்சொல்லின் வழக்கமான நேரடி மொழிபெயர்ப்பு.
- source_word: יָדַע
  choice: அறியும்
  rationale: ‘அறிதல்’ என்ற நேரடிப் பொருளைத் தக்கவைத்து, சூரியனை ஆளுருவாக்கும் கவிதைநயத்தையும் பாதுகாக்கிறது.
- source_word: מְבוֹאוֹ
  choice: தான் மறையும் நேரத்தை
  rationale: מָבוֹא என்பதன் அடிப்படைப் பொருள் வருதல்/நுழைதல் என்றாலும், சூரியனைப் பற்றிய இச்சூழலில் அது மறைதலைக் குறிக்கிறது. ‘மறையும் நேரம்’ என்பது தமிழில் இயல்பாக இருந்து, கால ஒழுங்கை வலியுறுத்தும் இணைவரியுடனும் பொருந்துகிறது.
theological_decisions:
- issue: படைப்பின் சூழலில் מוֹעֲדִים என்பதன் பொருள்
  choice: குறுகிய பொருளில் ‘பருவங்கள்’ அல்லது ‘விழாக்கள்’ என்பதற்குப் பதிலாக விரிவாக ‘நியமிக்கப்பட்ட காலங்கள்’
  alternative: பருவங்கள்; விழாக்காலங்கள்
  rationale: இவ்வசனம் வான்பொருட்கள் மூலம் கடவுள் காலத்தை ஒழுங்குபடுத்துவதை விவரிக்கிறது. நிலவு குறிக்கும் நிர்ணயிக்கப்பட்ட காலங்களில் பருவங்களும் விழா நாட்களும் அடங்கலாம்; விரிவான மொழிபெயர்ப்பு மூலத்தின் பொருள் வரம்பையும் இறையியல் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்தின் கவிதைநயத்தையும் இணைவரிசை அமைப்பையும் காக்கும் கண்ணியமான, எளிதில் புரியும் நடை. ‘அறியும்’ என்பது மூலத்திலுள்ள ஆளுருவாக்கத்தைத் தக்கவைக்கிறது.
