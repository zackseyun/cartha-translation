id: PSA.104.32
reference: Psalms 104:32
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הַ/מַּבִּ֣יט לָ֭/אָרֶץ וַ/תִּרְעָ֑ד יִגַּ֖ע בֶּ/הָרִ֣ים וְֽ/יֶעֱשָֽׁנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/032.yaml
  text: He looks at the earth[a], and it trembles; he touches the mountains, and they smoke.
translation:
  language: ta
  text: அவர் பூமியை நோக்குகிறார்[a]; அது நடுங்குகிறது. அவர் மலைகளைத் தொடுகிறார்; அவை புகைகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொற்தொடருக்கு நெருக்கமாக: “பூமியை நோக்குகிறவர்; அது நடுங்குகிறது. அவர் மலைகளைத் தொடுகிறார்; அவை புகைகின்றன.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבִּיט
  choice: அவர் ... நோக்குகிறார்
  rationale: நבט என்பதன் ஹிப்இல் வினையெச்சம் இங்கு கடவுளைக் குறிக்கும் பெயர்ச்சொல் போன்ற விளக்கமாக, ‘நோக்குகிறவர்’ என்ற பொருளில் வருகிறது. தமிழில் தொடரின் இயல்பையும் நிகழ்காலக் காட்சியின் உயிரோட்டத்தையும் காக்க ‘அவர் ... நோக்குகிறார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: לָאָרֶץ
  choice: பூமியை
  rationale: אֶרֶץ என்பதற்கு ‘நாடு/நிலம்’ என்றும் ‘பூமி’ என்றும் பொருள் உண்டு. சங்கீதம் 104-ன் அகிலப் படைப்புச் சூழலில் ‘பூமி’ என்பதே பொருத்தமானது.
- source_word: וַתִּרְעָד
  choice: அது நடுங்குகிறது
  rationale: רעד என்பது நடுங்குதல் அல்லது அதிர்தலைக் குறிக்கிறது. ‘நடுங்குகிறது’ என்பது கவிதையின் உடனடி காட்சியையும் பூமியின் எதிர்வினையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יִגַּע
  choice: அவர் ... தொடுகிறார்
  rationale: נגע என்பதன் அடிப்படைப் பொருள் ‘தொடுதல்’ அல்லது ‘சென்று தொடுதல்.’ ‘தொடுகிறார்’ என்பது எளிய நேரடிப் பொருளைத் தருவதோடு, கடவுளின் சுலபமான வல்லமையையும் காட்டுகிறது.
- source_word: בֶּהָרִים
  choice: மலைகளை
  rationale: הָרִים பொதுவாக ‘மலைகள்’ என்று பொருள்படும்; இங்குள்ள வலிமையான இயற்கைக் காட்சியை இது துல்லியமாகக் காக்கிறது.
- source_word: וְיֶעֱשָׁנוּ
  choice: அவை புகைகின்றன
  rationale: עשׁן என்பது ‘புகைதல்’ என்று பொருள்படும். பன்மை வினை மலைகளோடு பொருந்துகிறது; ‘புகைகின்றன’ என்பது சுருக்கமாகவும் கவித்துவமாகவும் உள்ளது.
theological_decisions:
- issue: வினையெச்சத் தொடரில் மறைமுகமாக உள்ள இறைச் செய்பவர்
  choice: சுற்றியுள்ள சூழலில் கடவுளைக் குறிக்கும் வகையில் ‘அவர்’ என்று வெளிப்படையாக வழங்குதல்
  alternative: ‘பூமியை நோக்குகிறவர்; அது நடுங்குகிறது...’ என்று வடிவத்துக்கு இன்னும் நெருக்கமாக வழங்குதல்
  rationale: இந்தச் சங்கீதத்தின் சூழல் கர்த்தருடைய செயல்களையும் வல்லமையையும் பற்றியது. ‘அவர்’ என்பது உடனடி இலக்கியச் சூழலில் உள்ள குறிப்பை மட்டுமே வெளிப்படுத்துகிறது; கூடுதல் இறையியல் கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் கவிதைக்குரிய கண்ணியமும் சுருக்கமும் காக்கப்பட்டுள்ளன. ‘நோக்குகிறார்,’ ‘நடுங்குகிறது,’ ‘புகைகின்றன’ ஆகிய நிகழ்கால வடிவங்கள் எபிரெயக் கவிதையின் உயிரோட்டத்தைத் தக்கவைக்கின்றன.
