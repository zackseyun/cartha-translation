  source_fidelity: 'எபிரெய மூலத்தின் நிகழ்கால/விளக்கக் காட்சி நன்றாகக் காக்கப்பட்டுள்ளது: பூமியை நோக்குதல்—அது நடுங்குதல்; மலைகளைத் தொடுதல்—அவை புகைதல். אֶרֶץ இன் அண்டவியல் சூழலுக்கேற்ற பொருளாக ‘பூமி’ சரியாகத் தேர்ந்தெடுக்கப்பட்டுள்ளது. மறைமுகமான இறைச் செய்பவரைச் சூழல் அடிப்படையில் ‘அவர்’ எனக் கொடுத்திருப்பது பாதுகாப்பானது.'
