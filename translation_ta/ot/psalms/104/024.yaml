base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/024.yaml
  text: How many are your works[a], O Yahweh! In wisdom you have made them all; the earth is full of your creatures.
translation:
  language: ta
  text: யாவே, உமது படைப்புகள் எவ்வளவு ஏராளம்! அவை அனைத்தையும் ஞானத்தோடு படைத்தீர்; பூமி உமக்குரியவற்றால்[a] நிறைந்திருக்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது உடைமைகளால்” அல்லது “உமது படைப்புகளால்.” இங்கு வரும் எபிரெயச் சொல் ஒருவருக்குச் சொந்தமானவற்றையோ அவர் பெற்றுக்கொண்டவற்றையோ குறிக்கலாம்; இச்சூழலில் கடவுள் படைத்த அனைத்தையும் பரந்த வகையில் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רַבּוּ
  choice: எவ்வளவு ஏராளம்
  rationale: வியப்புடன் மிகுதியையும் பன்மையையும் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַעֲשֶׂיךָ
  choice: உமது செயல்கள்
  rationale: מַעֲשֶׂה என்பதன் அடிப்படைப் பொருளைத் தக்கவைத்து, இச்சூழலில் படைப்புச் செயல்களைக் குறிக்க அனுமதிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: כֻּלָּם בְּחָכְמָה עָשִׂיתָ
  choice: அவை அனைத்தையும் ஞானத்தோடு படைத்தீர்
  rationale: முழுமையைக் குறிக்கும் כֻּלָּם என்பதையும், படைப்பின் வழிமுறையாகிய ஞானத்தையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: מָלְאָה הָאָרֶץ
  choice: பூமி ... நிறைந்திருக்கிறது
  rationale: எபிரெய நிறைவுற்ற வினை வெளிப்படுத்தும் தற்போதைய விளைவு நிலையைக் இயல்பான தமிழில் தருகிறது.
- source_word: קִנְיָנֶךָ
  choice: உமக்குரிய படைப்புகள்
  rationale: உடைமை அல்லது பெற்றுக்கொண்டவை என்ற அடிப்படை உணர்வையும், படைப்புச் சூழலில் உருவாக்கப்பட்ட உயிர்கள்/பொருட்கள் என்ற பொருளையும் இணைக்கிறது; அடிப்படைச் சொல்லின் பரப்பை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / யெகோவா
  rationale: மூலத்தில் வரும் தனிப்பட்ட இறைப் பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: קִנְיָנֶךָ என்பதன் படைப்பியல் பொருள்
  choice: உமக்குரிய படைப்புகள்
  alternative: உமது உடைமைகள் / உமக்குரியவை
  rationale: சங்கீதத்தின் படைப்புச் சூழலில் இயல்பாகப் பொருந்தும் வாசிப்பை முதன்மை உரையில் தருகிறது; எனினும் உடைமை சார்ந்த பரந்த பொருளை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவித்துவமானதாயும் பொதுவாசகர்களுக்கு எளிதில் புரிவதாயும் அமைக்கப்பட்டுள்ளது. இறைவனை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் வியப்புத் தொனியும் இணைவாக்கிய அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
