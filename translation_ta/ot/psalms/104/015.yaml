source:
  edition: WLC
  text: וְ/יַ֤יִן יְשַׂמַּ֬ח לְֽבַב אֱנ֗וֹשׁ לְ/הַצְהִ֣יל פָּנִ֣ים מִ/שָּׁ֑מֶן וְ֝/לֶ֗חֶם לְֽבַב אֱנ֥וֹשׁ יִסְעָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/015.yaml
  text: and wine gladdens the heart of man[a], making the face shine more than oil[b], and bread sustains the heart of man.
translation:
  language: ta
  text: திராட்சரசம் மனிதனின் உள்ளத்தை மகிழ்விக்கிறது[a]; எண்ணெயைவிட முகத்தை ஒளிரச் செய்கிறது[b]; அப்பம் மனிதனின் உள்ளத்தைத் தாங்குகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மனிதரின் உள்ளத்தை’ / ‘ஒருவரின் உள்ளத்தை.’ இங்குள்ள எபிரெயச் சொல் மனிதகுலத்தைப் பொதுவாகக் குறிக்கும் பிரதிநிதித்துவ ஒருமை.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘எண்ணெயால் முகத்தை ஒளிரச் செய்கிறது.’ எபிரெய இடைச்சொல்லை ஒப்பீடாக (‘எண்ணெயைவிட’) அல்லது கருவி/மூலத்தைக் குறிப்பதாக (‘எண்ணெயால்/எண்ணெயிலிருந்து’) வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַיִן
  choice: திராட்சரசம்
  rationale: יַיִן என்பது திராட்சையிலிருந்து தயாரிக்கப்படும் மதுவைக் குறிக்கிறது; நவீனத் தமிழில் பொருளைத் தெளிவாகவும் கண்ணியமாகவும் தரும் சொல்.
- source_word: יְשַׂמַּח
  choice: மகிழ்விக்கிறது
  rationale: שׂמח என்பதன் பியேல் வடிவம் மகிழ்ச்சியை உண்டாக்கும் காரணப்பொருளை வெளிப்படுத்துகிறது.
- source_word: לְבַב אֱנוֹשׁ
  choice: மனிதனின் உள்ளத்தை
  rationale: לְבַב இங்கு அக வாழ்வு அல்லது மனத்தின் மையத்தைக் குறிக்கிறது; אֱנוֹשׁ மனிதகுலத்தைப் பிரதிநிதித்துவப்படுத்தும் ஒருமைச் சொல். தமிழில் ‘உள்ளம்’ இயல்பாக இப்பொருளைத் தருகிறது.
- source_word: לְהַצְהִיל פָּנִים
  choice: முகத்தை ஒளிரச் செய்கிறது
  rationale: வினையின் ஹிப்இல் வடிவம் முகத்தில் ஒளிவை அல்லது பொலிவை ஏற்படுத்துவதைச் சுட்டுகிறது.
- source_word: מִשָּׁמֶן
  choice: எண்ணெயைவிட
  rationale: מִן என்பதை ஒப்பீட்டுப் பொருளில் வாசித்து ‘எண்ணெயைவிட’ என மொழிபெயர்த்துள்ளது; மூலத்தில் கருவி அல்லது காரணத்தைக் குறிக்கும் வாசிப்பும் சாத்தியம்.
- source_word: וְלֶחֶם
  choice: அப்பம்
  rationale: לֶחֶם என்பதன் நேரடிப் பொருள் அப்பம்; கவிதையில் அது அடிப்படை உணவாக நிற்கிறது.
- source_word: יִסְעָד
  choice: தாங்குகிறது
  rationale: סעד என்பது தாங்குதல், ஆதரித்தல், வலுப்படுத்துதல் ஆகிய பொருள்களைக் கொண்டது; அப்பம் உள்ளத்தை நிலைநிறுத்துவதை ‘தாங்குகிறது’ சுருக்கமாகக் காக்கிறது.
theological_decisions:
- issue: אֱנוֹשׁ என்ற பிரதிநிதித்துவ ஒருமை
  choice: மனிதன்
  alternative: மனித உள்ளம் / ஒருவரின் உள்ளம்
  rationale: இச்சொல் குறிப்பிட்ட ஓர் ஆணை மட்டும் அல்லாமல் மனிதரைப் பொதுவாகக் குறிக்கிறது. தமிழில் ‘மனிதன்’ பிரதிநிதித்துவ ஒருமையைத் தக்கவைக்கிறது; அதன் உள்ளடக்கும் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: מִן என்ற முன்னிடைச்சொல்லின் பொருள்
  choice: எண்ணெயைவிட என்ற ஒப்பீட்டு வாசிப்பு
  alternative: எண்ணெயால் / எண்ணெயிலிருந்து
  rationale: எபிரெய முன்னிடைச்சொல் ஒப்பீட்டையும் கருவி அல்லது மூலத்தையும் குறிக்கக்கூடும். முதன்மை உரையில் இயல்பான ஒப்பீட்டு வாசிப்பு தரப்பட்டாலும் உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூன்று இணை உறுப்புகளின் ஓட்டத்தை அரைப்புள்ளிகள் காக்கின்றன; மூலத்தின் சொற்பொருளும் மִן குறித்த தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
