  text: The trees of Yahweh are satisfied[a], the cedars of Lebanon that he planted,
translation:
  language: ta
  text: யாவேயின் மரங்கள் நிறைவுபெறுகின்றன[a]—அவர் நட்ட லெபனோனின் கேதுரு மரங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திருப்தியடைகின்றன” அல்லது “முழுமையாகப் பெறுகின்றன.” எபிரெய வினை நிறைவாக வழங்கப்படுதல் அல்லது திருப்தியுறுதல் என்ற கருத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂבְּעוּ
  choice: நிறைவடைகின்றன
  rationale: שׂבע என்ற வினை முழுமையாகப் பெற்றிருத்தல் அல்லது திருப்தியடைவதைக் குறிக்கிறது. முந்தைய அடிகளில் வரும் நீர்ப்பாய்ச்சல் சூழலில் மரங்கள் தேவையான நீரை நிறைவாகப் பெறுகின்றன என்ற பொருளை இது இயல்பாகத் தருகிறது; அதேவேளையில் மூலத்தின் உருவகத்தை வெளிப்படையாகச் சுருக்கிவிடவில்லை.
- source_word: עֲצֵי יְהוָה
  choice: யாவேயின் மரங்கள்
  rationale: இணைப்புநிலைச் சொற்றொடரை நேரடியாகக் காத்து, יהוה என்ற தனிப்பெயரைத் தமிழில் ‘யாவே’ என ஒலிபெயர்த்துள்ளது.
- source_word: אַרְזֵי לְבָנוֹן
  choice: லெபனோனின் கேதுரு மரங்கள்
  rationale: אֶרֶז என்பதன் குறிப்பான மரப்பெயரையும், லெபனோனுடனான இணைப்புநிலை உறவையும் தெளிவாகக் காக்கிறது.
- source_word: אֲשֶׁר נָטָע
  choice: அவர் நட்ட
  rationale: נטע என்ற இறந்தகால வினையையும், சூழலால் புரிந்துகொள்ளப்படும் கடவுளைக் குறிக்கும் ஆண்பால் ஒருமை எழுவாயையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பட்டப்பெயர் அல்லாமல் நான்கெழுத்து இறைத்தனிப்பெயர் நேரடியாக உள்ளது; ஆகவே அதைத் தலைப்பாக மாற்றாமல் தமிழில் ஒலிபெயர்த்துள்ளது.
- issue: ‘யாவேயின் மரங்கள்’ என்பதன் பொருள்
  choice: இணைப்புநிலைச் சொற்றொடரை அப்படியே வைத்தல்
  alternative: மாபெரும் மரங்கள்
  rationale: இந்தச் சொற்றொடர் கடவுளுக்குரிய அல்லது அவர் பேணி வளர்க்கும் மரங்களைக் குறிக்கலாம்; வலிமையைச் சுட்டும் உயர்நிலைப் பயன்பாடாகவும் சிலர் புரிந்துகொள்ளலாம். மூலத்தின் தெளிவின்மையைத் தீர்மானிக்காமல் நேரடியாகக் காத்துள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் கண்ணியமும் காக்கப்பட்டுள்ளன. இரண்டாம் பகுதி முதல் பகுதியை விளக்கும் இணைநிலை அமைப்பாக இருப்பதால் நீண்ட கோடு பயன்படுத்தப்பட்டுள்ளது. ‘கேதுரு’ என்பது வேதாகமத் தமிழில் அறியப்பட்ட குறிப்பான மரப்பெயராகத் தக்கவைக்கப்பட்டுள்ளது.
