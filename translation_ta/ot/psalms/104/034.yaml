source:
  edition: WLC
  text: יֶעֱרַ֣ב עָלָ֣י/ו שִׂיחִ֑/י אָ֝נֹכִ֗י אֶשְׂמַ֥ח בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/034.yaml
  text: May my meditation be pleasing to him[a]; I will rejoice in Yahweh.
translation:
  language: ta
  text: என் தியானம் அவருக்குப் பிரியமாக இருப்பதாக[a]; நானோ யாவேயில் மகிழ்வேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தியானம் அவருக்கு இனிமையாய் இருப்பதாக” அல்லது “அவருக்கு ஏற்றதாக இருப்பதாக.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעֱרַב
  choice: இனிமையாய் இருப்பதாக
  rationale: Qal வடிவிலுள்ள ערב என்பதன் ‘இனிமையாக/மகிழ்ச்சியளிப்பதாக இருத்தல்’ என்ற உருவகச் செறிவைப் பேணுகிறது; இச்சூழலில் அது ஏற்றுக்கொள்ளத்தக்கதாக இருப்பதையும் குறிக்கலாம்.
- source_word: עָלָיו
  choice: அவருக்கு
  rationale: ערב உடன் வரும் על, யாருக்கு ஒன்று இனிமையாக அல்லது உகந்ததாக இருக்கிறதோ அவரைக் குறிக்கிறது; ஆண்பால் ஒருமை பின்னொட்டு சூழலில் தேவனைக் குறிக்கிறது.
- source_word: שִׂיחִי
  choice: என் தியானம்
  rationale: שׂיח என்பது சிந்தனை, தியானம், உள்ளார்ந்த உரையாடல் அல்லது பேச்சைக் குறிக்கலாம். சங்கீதத்தின் துதிச் சூழலில் ‘என் தியானம்’ இயல்பாகப் பொருந்துகிறது.
- source_word: אָנֹכִי
  choice: நானோ
  rationale: தனித்த சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் ‘நானோ’ இயல்பாக வெளிப்படுத்துகிறது; முந்தைய வேண்டுதலிலிருந்து சங்கீதக்காரரின் உறுதியை வேறுபடுத்தியும் காட்டுகிறது.
- source_word: אֶשְׂמַח
  choice: மகிழ்வேன்
  rationale: Imperfect வடிவம் தீர்மானத்தையோ தொடரும் மனநிலையையோ குறிக்கலாம்; ‘மகிழ்வேன்’ அந்த உறுதியைச் சுருக்கமாகப் பேணுகிறது.
- source_word: בַּיהוָה
  choice: யெகோவாவில்
  rationale: בְּ முன்னொட்டு மகிழ்ச்சியின் பொருள் அல்லது மையத்தைக் குறிக்கிறது. יהוה என்ற திருப்பெயர் தமிழில் பரவலாக அறியப்பட்ட ‘யெகோவா’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יהוה என்ற திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: எபிரெய மூலத்தில் திருப்பெயர் நேரடியாக இருப்பதால் பொதுப்பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதில் பெயராகவே வழங்கப்படுகிறது. ‘யெகோவா’ என்பது நவீன தமிழ் வேதாகமப் பயன்பாட்டில் பரவலாக அறியப்படும் வடிவம்; ‘யாவே’ என்பது மூல உச்சரிப்பை மீட்டமைக்க முயலும் மாற்று வடிவம்.
- issue: יֶעֱרַב என்பதிலுள்ள உருவகமும் ஏற்றுக்கொள்ளப்படுதல் என்ற பொருளும்
  choice: இனிமையாய் இருப்பதாக
  alternative: பிரியமாய் இருப்பதாக; ஏற்றதாக இருப்பதாக
  rationale: மூலச் சொல்லின் ‘இனிமை/மகிழ்ச்சி’ உருவகத்தை முதன்மைப்படுத்தி, அது தேவனால் சாதகமாக ஏற்கப்பட வேண்டும் என்ற வேண்டுதலையும் திறந்தவாறு வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் வழிபாட்டு கண்ணியமும் பேணப்பட்டுள்ளன. ‘நானோ’ மூலத்தின் வலியுறுத்தலை இயல்பாகக் காட்டுகிறது; அடிக்குறிப்பு குறியீடு உரையில் சேர்க்கப்பட்டுள்ளது.
