lexical_decisions:
- source_word: מַשְׁקֶה
  choice: நீர் பாய்ச்சுகிறார்
  rationale: שׁקה என்பதன் ஹிஃபில் வடிவம் ‘குடிக்கச் செய்கிறார்/நீர் அளிக்கிறார்’ என்ற காரணவினைப் பொருளைத் தருகிறது. மலைகளுக்குச் செய்யப்படும் செயலை நவீனத் தமிழில் இயல்பாகக் கூற ‘நீர் பாய்ச்சுகிறார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: הָרִים
  choice: மலைகளுக்கு
  rationale: הָרִים என்பதன் வழக்கமான பொருள் ‘மலைகள்.’ தமிழ் வினைத்தொடருக்கு ஏற்றவாறு நான்காம் வேற்றுமை பயன்படுத்தப்பட்டது.
- source_word: מֵעֲלִיּוֹתָיו
  choice: தமது மேலறைகளிலிருந்து
  rationale: עֲלִיּוֹת என்பது மேல்தள அறைகள் அல்லது மேலறைகளைக் குறிக்கிறது. சங்கீதத்தின் பிரபஞ்சத்தை ஒரு இல்லமாகச் சித்தரிக்கும் உருவகத்தை ‘மேலறைகள்’ காக்கிறது; தமது என்பது மூன்றாம் நபர் உடைமையைத் தெளிவாகக் காட்டுகிறது.
- source_word: מִפְּרִי
  choice: பலனால்
  rationale: פְּרִי என்பதன் அடிப்படைப் பொருள் ‘பழம்/விளைவு.’ இங்கு மִן காரணம், மூலம் அல்லது ஆதாரத்தைக் குறிக்கலாம்; ‘பலனால்’ என்பது தேவனுடைய செயல்கள் விளைவிக்கும் நிறைவைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: מַעֲשֶׂיךָ
  choice: உமது செயல்களின்
  rationale: מַעֲשֶׂיךָ என்பது இரண்டாம் நபர் ஒருமை உடைமையுடன் ‘உமது செயல்கள்’ எனப் பொருள்படும். எபிரெய மூலத்தில் காணப்படும் மூன்றாம் நபரிலிருந்து இரண்டாம் நபருக்கான நேரடி அழைப்பு அப்படியே காக்கப்பட்டது.
- source_word: תִּשְׂבַּע
  choice: நிறைவடைகிறது
  rationale: שׂבע என்பது திருப்தியடைதல், நிரம்புதல், போதுமான அளவு பெறுதல் ஆகிய உணர்வுகளைத் தருகிறது. படைப்பின் செழுமையை இயல்பான தமிழில் தெரிவிக்க ‘நிறைவடைகிறது’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: படைப்பைப் பற்றிய இந்தச் சங்கீதச் சூழலில் הָאָרֶץ என்பதை உள்ளூர் ‘நாடு’ என்பதற்குப் பதிலாக உலகளாவிய ‘பூமி’ எனக் கொள்வது பொருத்தமானது.
theological_decisions:
- issue: வெளிப்படையாகச் சொல்லப்படாத தெய்வீக எழுவாய்
  choice: அவர் ... நீர் பாய்ச்சுகிறார்
  alternative: மலைகளுக்கு நீர் பாய்ச்சியவாறு
  rationale: எபிரெயத்தில் participle-இன் எழுவாய் இவ்வசனத்தில் வெளிப்படையாக இல்லை; ஆனால் முன்சூழல் தேவனையே தெளிவாகக் குறிக்கிறது. ‘அவர்’ என்பது வாசிப்பை இயல்பாக்குகிறது; புதிய இறையியல் கூற்றைச் சேர்ப்பதில்லை.
- issue: மூன்றாம் நபரிலிருந்து இரண்டாம் நபருக்கான மாற்றம்
  choice: அவர் ... உமது செயல்களின்
  alternative: அவர் ... தமது செயல்களின்
  rationale: மூல எபிரெயம் முதலில் தேவனை மூன்றாம் நபரில் குறிப்பிட்டு, பின்னர் அவரை இரண்டாம் நபரில் நேரடியாக அழைக்கிறது. இந்தக் கவிதைநடை மாற்றம் முரண்பாடாகச் சீராக்கப்படாமல் காக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘மேலறைகள்’ என்ற சொல் மூலத்தின் கட்டட உருவகத்தையும், ‘நிறைவடைகிறது’ என்ற சொல் பூமி போதுமான வளம் பெறும் கருத்தையும் இயல்பாகக் காக்கின்றன.
