source:
  edition: WLC
  text: עֹשֶׂ֣ה מַלְאָכָ֣י/ו רוּח֑וֹת מְ֝שָׁרְתָ֗י/ו אֵ֣שׁ לֹהֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/004.yaml
  text: He makes his messengers winds[b][a], his ministers a flaming fire.
translation:
  language: ta
  text: 'அவர் தம் தூதர்களைக் காற்றுகளாக[a][b] ஆக்குகிறார்;

    தம் பணிவிடையாளர்களைக் கொழுந்துவிட்டெரியும் நெருப்பாக ஆக்குகிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர் தம் தேவதூதர்களை ஆவிகளாகவும், தம் பணிவிடையாளர்களை நெருப்புச் சுடராகவும் ஆக்குகிறார்.’ எபிரெயர் 1:7 இந்த மரபுவழி வாசிப்பைப் பின்பற்றுகிறது.
    reason: alternative_reading
  - marker: b
    text: ‘காற்றுகள்’ என்று மொழிபெயர்க்கப்பட்ட எபிரெயச் சொல் ‘ஆவிகள்’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: ஆக்குகிறார்
  rationale: இந்தப் பங்கேற்புவினைச் சொல், சூழலில் கடவுள் வழக்கமாகச் செய்கிற செயலை விவரிக்கிறது. ‘ஆக்குகிறார்’ என்பது அதன் செயப்பாட்டு வலிமையையும், ஒன்றை மற்றொன்றாக நியமிக்கும் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מַלְאָכָיו
  choice: தம் தூதர்களை
  rationale: מַלְאָךְ என்பது ‘செய்தியாளர்/தூதர்’ என்றும் ‘தேவதூதர்’ என்றும் பொருள்படலாம். ‘தூதர்கள்’ என்ற சொல் இந்த இருபொருள் வாய்ப்பை ஓரளவு காத்து, இவர்கள் வானுலக உயிர்களா அல்லது கடவுளின் கட்டளையை நிறைவேற்றும் இயற்கைச் சக்திகளா என்பதை முதன்மை உரையில் முன்கூட்டியே முடிவுசெய்யாமல் விடுகிறது.
- source_word: רוּחוֹת
  choice: காற்றுகளாக
  rationale: רוּחַ என்பதற்கு ‘காற்று’, ‘மூச்சு’, ‘ஆவி’ ஆகிய பொருள்கள் உண்டு. படைப்பைப் போற்றும் சங்கீதம் 104-ன் சூழலிலும், எரியும் நெருப்புடன் அமைந்த இணைப்பிலும் ‘காற்றுகள்’ இயற்கையான முதன்மை வாசிப்பாகும்; ‘ஆவிகள்’ என்பது அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: מְשָׁרְתָיו
  choice: தம் பணிவிடையாளர்களை
  rationale: இந்தச் சொல் ஒருவருக்குச் சேவைசெய்யும் உதவியாளர்கள் அல்லது பணியாளர்களைக் குறிக்கிறது. ‘பணிவிடையாளர்கள்’ என்பது சாதாரண ‘வேலையாட்கள்’ என்பதைவிட மூலத்தின் முறைசார்ந்த சேவை நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: אֵשׁ
  choice: நெருப்பு
  rationale: மூலச்சொல்லின் நேரடியான பொருளைத் தக்கவைத்து, சங்கீதத்தின் இயற்கைத் தனிமப் படிமத்தைக் காக்கிறது.
- source_word: לֹהֵט
  choice: கொழுந்துவிட்டெரியும்
  rationale: நெருப்பின் தீவிரமாக எரியும் தன்மையை உயிரோட்டமான, இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இந்த வசனம் தேவதூதர்கள்/ஆவிகளைப் பற்றிப் பேசுகிறதா, அல்லது காற்று/நெருப்பு ஆகிய இயற்கைச் சக்திகளைக் கடவுளின் தூதர்களாகச் சித்தரிக்கிறதா?
  choice: சங்கீதத்தின் படைப்புச் சூழலுக்கு ஏற்றபடி, ‘அவர் தம் தூதர்களைக் காற்றுகளாக ... ஆக்குகிறார்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர் தம் தேவதூதர்களை ஆவிகளாகவும், தம் பணிவிடையாளர்களை நெருப்புச் சுடராகவும் ஆக்குகிறார்’; அல்லது, ‘அவர் காற்றுகளைத் தம் தூதர்களாகவும், நெருப்புச் சுடர்களைத் தம் பணிவிடையாளர்களாகவும் ஆக்குகிறார்.’
  rationale: எபிரெயச் சொற்களும் வாக்கிய அமைப்பும் ஒன்றுக்கு மேற்பட்ட பொருளமைப்புகளை அனுமதிக்கின்றன. சங்கீதம் 104-ன் படைப்புச் சித்திரம் இயற்கைச் சக்திகளை முன்னிறுத்தினாலும், எபிரெயின் மெய்யான இருபொருள் வாய்ப்பையும் எபிரெயர் 1:7-ல் பிரதிபலிக்கும் மரபுவழி வாசிப்பையும் அடிக்குறிப்புகள் காக்கின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. முதல் அடியின் வாக்கிய அமைப்பு இரண்டாம் அடியிலும் தொடரப்படுவதால் எபிரெய இணைநிலை தெளிவாகிறது. ‘தம்’ என்பது ஒருமை மரியாதையையும் உடைமைத் தொடர்பையும் இயல்பாகக் காட்டுகிறது; ‘கொழுந்துவிட்டெரியும்’ மூலத்தின் தீவிரப் படிமத்தை உயிரோட்டமாகத் தருகிறது.
