  text: יִתַּ֤מּוּ חַטָּאִ֨ים מִן הָ/אָ֡רֶץ וּ/רְשָׁעִ֤ים ע֤וֹד אֵינָ֗/ם בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֗ה הַֽלְלוּ יָֽהּ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/035.yaml
  text: May sinners be finished from the earth[a], and may the wicked be no more. Bless Yahweh, O my soul[b]. Hallelujah!
translation:
  language: ta
  text: பாவிகள் பூமியிலிருந்து ஒழிந்துபோகட்டும்[a]; பொல்லாதவர்கள் இனி இல்லாமல் போகட்டும். என் ஆத்துமாவே, யாவேவை வாழ்த்து. அல்லேலூயா![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லடியாக: “பாவிகள் பூமியிலிருந்து முடிவுக்கு வரட்டும்.”'
    reason: lexical_alternative
  - marker: b
    text: 'எபிரெயத்தில்: “யாவைப் புகழுங்கள்!” ‘யா’ என்பது யாவே என்ற திருப்பெயரின் குறுகிய வடிவம். இந்தச் சொற்றொடர் மரபாக “அல்லேலூயா” என்று ஒலிபெயர்க்கப்படுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתַּמּוּ
  choice: ஒழிந்துபோகட்டும்
  rationale: תמם என்பதன் Qal imperfect வடிவம் ‘முடிவுக்கு வருதல், இல்லாமல் போதல்’ என்ற பொருளைத் தருகிறது. இங்கு வேண்டுதல்/விருப்பத்தின் வலிமையையும், பூமியிலிருந்து அகன்றுபோதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘அழிக்கப்படட்டும்’ என்று செயப்படுபொருள் கருத்தை மிகைப்படுத்தவில்லை.
- source_word: חַטָּאִים
  choice: பாவிகள்
  rationale: பாவத்தால் அடையாளப்படுத்தப்படும் மனிதர்களைக் குறிக்கும் பன்மைச் சொல்; தமிழில் நேரடியான, வழக்கமான இணை.
- source_word: מִן הָאָרֶץ
  choice: பூமியிலிருந்து
  rationale: சங்கீதம் 104-ன் படைப்பு சார்ந்த உலகளாவிய சூழலில் אֶרֶץ என்பதை உள்ளூர் ‘நாடு’ என்பதற்குப் பதில் ‘பூமி’ என மொழிபெயர்ப்பது பொருத்தமானது.
- source_word: וּרְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: ஒழுக்கரீதியாகத் தீயவர்களைக் குறிக்கும் பெயரடைப் பெயர்ச்சொல் பயன்பாட்டை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עוֹד אֵינָם
  choice: இனி இல்லாமல் போகட்டும்
  rationale: அவர்கள் இனிமேல் இருப்பதில்லை என்ற பொருளையும், இணையான வேண்டுதல் நடையையும் தெளிவாகத் தருகிறது.
- source_word: בָּרֲכִי נַפְשִׁי
  choice: என் ஆத்துமாவே, ... வாழ்த்து
  rationale: தனக்குத்தானே விடுக்கும் கவித்துவ அழைப்பைப் பாதுகாக்கிறது. தேவனைப் பொருளாகக் கொண்ட ברך என்பதற்கு ‘வாழ்த்து’ நேரடியானதும் கண்ணியமானதும் ஆகும்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெயத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவில் தருகிறது.
- source_word: הַלְלוּ יָהּ
  choice: அல்லேலூயா!
  rationale: நிலையான வழிபாட்டு முழக்கமாகத் தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பு; அதன் சொல்லடிப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: இந்த வசனம் பாவம் ஒழிவதையா அல்லது பாவிகள் ஒழிவதையா வேண்டுகிறது?
  choice: பாவிகளும் பொல்லாதவர்களும் பூமியிலிருந்து இல்லாமல் போவதை உரை வேண்டுகிறது.
  alternative: பாவங்கள் பூமியிலிருந்து ஒழியட்டும்.
  rationale: חַטָּאִים, רְשָׁעִים ஆகிய இரண்டும் இங்கு மனிதர்களைக் குறிக்கும் பன்மைப் பெயர்ச்சொல் பயன்பாடுகள். ஆகவே வேண்டுதலின் கடினமான இறையியல் அழுத்தத்தை ‘பாவம் மட்டும் ஒழியட்டும்’ என்று மென்மைப்படுத்தவில்லை; அதேவேளை ‘-ட்டும்’ வடிவம் இதை நேரடிக் கட்டளையாக அல்ல, விருப்பம்/வேண்டுதலாகக் காக்கிறது.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ்நடை. கவிதைத் தன்மையையும் தனக்குத்தானே விடுக்கும் அழைப்பையும் காக்க ‘என் ஆத்துமாவே’ பயன்படுத்தப்பட்டது. ‘ஒழிந்துபோகட்டும்’ என்பது மூலத்தின் வேண்டுதல் வலிமையையும் ‘முடிவுக்கு வருதல்’ என்ற பொருள் பரப்பையும் இயல்பாக இணைக்கிறது.
