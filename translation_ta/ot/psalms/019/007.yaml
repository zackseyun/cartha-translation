id: PSA.19.7
reference: Psalms 19:7
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
translation:
  language: ta
  text: யாவேயின் சட்டம் குறையற்றது; அது உயிரைப் புதுப்பிக்கிறது[a]. யாவேயின் சாட்சியம் நம்பத்தக்கது; அது அனுபவமற்றவரை ஞானியாக்குகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, உயிரை மீட்டெடுக்கிறது.
    reason: מְשִׁיבַת נָפֶשׁ என்பதில் திரும்ப நிலைநிறுத்துதல் அல்லது மீட்டமைத்தல் என்ற வேர்ச்சொல் நுணுக்கமும் வலுவாக உள்ளது.
lexical_decisions:
- source_word: תּוֹרַת
  choice: திருச்சட்டம்
  rationale: תּוֹרָה என்பது போதனை அல்லது அறிவுரை என்ற பரந்த பொருளைக் கொண்டிருந்தாலும், இச்சங்கீதத்தில் யாவேயின் உடன்படிக்கை சார்ந்த அதிகாரமிக்க வெளிப்பாட்டைக் குறிக்கிறது. ‘திருச்சட்டம்’ அந்த நிறையையும் தமிழில் இயல்பாகத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, எபிரெய வேதத்தில் நேரடியாக வரும் இறைப்பெயர். ‘யாவே’ என்பது அதன் வழக்கமான தமிழ் ஒலிபெயர்ப்பு.
- source_word: תְּמִימָה
  choice: குறையற்றது
  rationale: முழுமை, பழுதின்மை, நேர்த்தி ஆகிய கருத்துகளை இச்சூழலில் இயல்பாக வெளிப்படுத்துகிறது; ‘பூரணமானது’ என்பதைக் காட்டிலும் பொதுவாசகருக்கு நேரடியானது.
- source_word: מְשִׁיבַת
  choice: மீட்டெடுக்கிறது
  rationale: שׁוב என்ற வேர்ச்சொல்லின் திரும்பச் செய்தல் அல்லது மீட்டமைத்தல் என்ற அடிப்படை நுணுக்கத்தைத் தக்கவைக்கிறது. புத்துயிரளித்தல் என்பதும் சூழலுக்குப் பொருத்தமான மாற்று என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: נָפֶשׁ
  choice: உயிரை
  rationale: נֶפֶשׁ என்பது உயிர், தன்னிலை, முழு மனிதர் எனப் பரந்த பொருளுடையது. ‘உயிர்’ என்பது உடல்–ஆத்துமா பிரிவைத் தேவையின்றி புகுத்தாமல் தமிழில் சுருக்கமாக அமைகிறது.
- source_word: עֵדוּת
  choice: சாட்சியுரை
  rationale: யாவேயின் உறுதிப்படுத்தப்பட்ட சாட்சி அல்லது உடன்படிக்கை சார்ந்த சான்றுரையை இது குறிக்கிறது. ‘சாட்சியுரை’ என்பது வெறும் நிகழ்வுச் சாட்சியைக் காட்டிலும் வெளிப்படுத்தப்பட்ட உரை என்ற நுணுக்கத்தைத் தெளிவாக்குகிறது.
- source_word: נֶאֱמָנָה
  choice: நம்பத்தக்கது
  rationale: உறுதி மற்றும் நம்பகத்தன்மையை நவீனத் தமிழில் நேரடியாகக் கூறுகிறது.
- source_word: מַחְכִּימַת
  choice: ஞானியாக்குகிறது
  rationale: ஒருவரை ஞானமுள்ளவராகச் செய்கிறது என்ற காரணவினைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: פֶּתִי
  choice: அனுபவமற்றவரை
  rationale: இச்சொல் அவசியமாக ஒழுக்கக்கேடுள்ள மூடனை அல்ல, அறிவிலும் அனுபவத்திலும் முதிராததால் எளிதில் வழிதவறக்கூடியவரைக் குறிக்கிறது. ‘அனுபவமற்றவர்’ அந்த நுணுக்கத்தை இழிவுபடுத்தாமல் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் பொதுப்பட்டப்பெயர் அல்ல, நான்கெழுத்து இறைப்பெயரே உள்ளது. எனவே அதை பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: מְשִׁיבַת נָפֶשׁ என்பதன் பொருள் நுணுக்கம்
  choice: உயிரை மீட்டெடுக்கிறது
  alternative: உயிருக்குப் புத்துயிரளிக்கிறது
  rationale: இந்த எபிரெயத் தொடர் திரும்ப நிலைநிறுத்துதல் மற்றும் புத்துயிரளித்தல் ஆகிய இரு தொடர்புடைய பொருட்களுக்கும் இடமளிக்கிறது. முதன்மை உரை வேர்ச்சொல்லின் மீட்டெடுத்தல் நுணுக்கத்தைத் தக்கவைக்கிறது; வலுவான சூழல்சார் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகருக்குப் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைவடிவக் கவிதையின் இரண்டு சமமான கூறுகளும் காக்கப்பட்டுள்ளன; தேவையற்ற சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டுள்ளன.
