  text: יִֽהְי֥וּ לְ/רָצ֨וֹן אִמְרֵי פִ֡/י וְ/הֶגְי֣וֹן לִבִּ֣/י לְ/פָנֶ֑י/ךָ יְ֝הוָ֗ה צוּרִ֥/י וְ/גֹאֲלִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
translation:
  language: ta
  text: என் வாயின் சொற்களும் என் இதயத்தின் தியானமும் உமது சந்நிதியில் ஏற்றுக்கொள்ளத்தக்கவையாக இருக்கட்டும்[a], யாவே, என் கன்மலையே, என் மீட்பரே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பார்வையில்.” எபிரெயத்தில் சொல்லர்த்தமாக, “உமது முகத்திற்கு/சந்நிதிக்கு முன்பாக” என்று உள்ளது.
    reason: lexical_alternative
  - marker: b
    text: “மீட்பர்” என்பதற்கான எபிரெயச் சொல், ஒருவரை மீட்பவர் அல்லது இழந்த உரிமையை மீட்டுத் தருபவர் என்பதைக் குறிக்கிறது; இஸ்ரவேலின் சட்டத்தில் இது பெரும்பாலும் நெருங்கிய உறவினரின் கடமைகளோடு தொடர்புடையது.
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ
  choice: இருப்பனவாக
  rationale: வேண்டுதல் அல்லது விருப்பத்தை வெளிப்படுத்தும் இம்பெர்ஃபெக்ட் வடிவத்தின் பொருளைத் தமிழில் இயல்பான வாழ்த்துவினை அமைப்பால் தருகிறது.
- source_word: לְרָצוֹן
  choice: ஏற்றுக்கொள்ளத்தக்கவையாக
  rationale: இறைவனின் முன்னிலையில் ஏற்கத்தக்கது, உகந்தது என்ற பொருளைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אִמְרֵי פִי
  choice: என் வாயின் சொற்கள்
  rationale: மூலத்தின் நேரடியான உடல் உருவகத்தையும் பேசப்பட்ட சொற்கள் என்ற பொருளையும் தக்கவைக்கிறது.
- source_word: הֶגְיוֹן לִבִּי
  choice: என் இதயத்தின் தியானம்
  rationale: உள்ளார்ந்த சிந்தனை அல்லது மனதில் அசைபோடுதல் என்ற பொருளை வெளிப்படுத்தி, வாயின் சொற்களுக்கு இணையான அகநிலைச் செயலாக அமைகிறது.
- source_word: לְפָנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: ‘உமது முகம்/சந்நிதிக்கு முன்பாக’ என்ற எபிரெயச் சொற்றொடரின் உறவு மற்றும் மதிப்பீட்டுப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: צוּרִי
  choice: என் கன்மலை
  rationale: நிலைத்த பாதுகாப்பைக் குறிக்கும் பாறை உருவகத்தை விளக்கமாக மாற்றாமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְגֹאֲלִי
  choice: என் மீட்பர்
  rationale: גאל வேரின் மீட்பவர் அல்லது உரிமையை மீட்டுத் தருபவர் என்ற அடிப்படைப் பொருளைச் சுருக்கமாகக் கூறுகிறது; உறவினரின் சட்டக் கடமை என்ற பின்னணியை அடிக்குறிப்பு விளக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா / கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
- issue: צוּרִי என்ற உருவகப் பட்டம்
  choice: என் கன்மலை
  alternative: என் அடைக்கலம்
  rationale: மூலத்தின் பாறை உருவகத்தையும் அதன் கவித்துவ இறுக்கத்தையும் தக்கவைத்து, ‘அடைக்கலம்’ எனப் பொருள் விளக்கி வரையறுக்கவில்லை.
- issue: גֹאֲלִי என்பதன் சட்ட மற்றும் உறவுமுறை பின்னணி
  choice: என் மீட்பர்
  alternative: என் உறவின-மீட்பர் / என்னை விடுவிப்பவர்
  rationale: இவ்வசனத்தில் உறவினரைக் குறிக்கும் கூறு வெளிப்படையாக இல்லாததால் அதைப் பிரதான உரையில் மிகைப்படுத்தாமல், மூலச் சொல்லின் விரிந்த பின்னணியை அடிக்குறிப்பில் தருகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய மரியாதை ஒருமை வடிவங்கள் (‘உமக்கு’, ‘உமது’) இடம்பெறுகின்றன. ‘கன்மலை’ மற்றும் ‘இதயத்தின் தியானம்’ ஆகியவை சங்கீதத்தின் உருவக மற்றும் இணைநிலை அமைப்பைப் பாதுகாக்கின்றன.
