lexical_decisions:
- source_word: שְׁגִיאוֹת
  choice: தவறுகள்
  rationale: இந்தப் பெயர்ச்சொல் வழிதவறுதல்களையும் அறியாமல் செய்த பாவத் தவறுகளையும் குறிக்கலாம். ‘தவறுகள்’ என்பது சுருக்கமாகவும் இயல்பாகவும் இருந்து, மூலத்தில் வெளிப்படையாக இல்லாத ‘அறியாமல் செய்த’ என்ற பொருளைத் திணிக்காமல் அறநெறிசார் சூழலைக் காக்கிறது.
- source_word: מִי
  choice: யார்
  rationale: விடையை எதிர்பாராத வினாவின் இயல்பான தமிழ் வடிவம்.
- source_word: יָבִין
  choice: உணரக்கூடியவன்
  rationale: இந்த வினை புரிந்துகொள்ளுதல், பகுத்தறிதல், கண்டுணர்தல் ஆகிய பொருள்களைக் கொண்டது. தன் தவறுகளை முழுமையாகக் கண்டறிய மனிதனால் இயலாத நிலையை வினா வெளிப்படுத்துவதால் இவ்வடிவம் பொருந்துகிறது.
- source_word: מִנִּסְתָּרוֹת
  choice: மறைவான குற்றங்களிலிருந்து
  rationale: סתר வேரிலிருந்து வந்த இவ்வடிவம் ‘மறைக்கப்பட்டவை/மறைவானவை’ எனப் பொருள்படும். முதல் அடியின் ‘தவறுகள்’ என்பதுடன் உள்ள இணைநிலை காரணமாக அறநெறிசார் குற்றங்களே இங்கு முதன்மையாகக் குறிக்கப்படுகின்றன; அவை பேசுபவருக்கே மறைவானவையா அல்லது பிறரிடமிருந்து மறைக்கப்பட்டவையா என்பதை மொழிபெயர்ப்பு தீர்மானிப்பதில்லை.
- source_word: נַקֵּנִי
  choice: என்னைத் தூய்மைப்படுத்தும்
  rationale: נקה என்பதன் பியேல் கட்டளை வடிவம் குற்றமற்றவனாக்குதல், விடுவித்தல், தூய்மைப்படுத்துதல் ஆகிய தொடர்புடைய பொருள்களைத் தரலாம். ‘தூய்மைப்படுத்தும்’ என்பது தமிழில் இயல்பான வேண்டுதல் வடிவமாக இருந்து, குற்றத்திலிருந்து நீங்கும் கருத்தைத் தெளிவாக்குகிறது; சட்டரீதியான விடுதலை என்ற பொருளை மட்டும் திணிப்பதில்லை.
theological_decisions:
- issue: மறைவானவை என்பதன் தன்மை
  choice: ‘மறைவான குற்றங்கள்’ என்று அறநெறிசார் பொருளில் மொழிபெயர்க்கப்பட்டது; அவை யாருக்கு மறைவானவை என்பது திறந்துவைக்கப்பட்டுள்ளது.
  alternative: ‘இரகசியப் பாவங்கள்’ அல்லது பொதுவாக ‘மறைவானவை’.
  rationale: ‘தவறுகள்’ என்பதுடன் உள்ள எபிரெய இணைநிலை பாவம் அல்லது குற்றம் சார்ந்த பொருளை வலுவாக ஆதரிக்கிறது. அதேவேளையில், அவை சங்கீதக்காரருக்கே தெரியாதவையா, பிறரிடமிருந்து மறைக்கப்பட்டவையா, அல்லது பொதுவாக மறைவில் உள்ளவையா என்ற மூலத்தின் தெளிவின்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில், மரியாதைமிக்க ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடையில் அமைக்கப்பட்டது. ‘உணரக்கூடியவன் யார்?’ என்ற வினா மூலத்தின் சொல்லாட்சியையும் வினாவியல் வலிமையையும் காக்கிறது. இறுதி வேண்டுதலில் இலக்கியத் தமிழுக்குரிய ‘தூய்மைப்படுத்தும்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது.
