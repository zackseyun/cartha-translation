- from: தன் தவறுகளை உணரக்கூடியவன் யார்? மறைவான குற்றங்களிலிருந்து[a] என்னைத் தூய்மைப்படுத்தும்.
  to: தன் தவறுகளை உணரக்கூடியவன் யார்? மறைந்திருக்கும் தவறுகளிலிருந்து[a] என்னைத் தூய்மையாக்கும்.
