source:
  edition: WLC
  text: פִּקּ֘וּדֵ֤י יְהוָ֣ה יְ֭שָׁרִים מְשַׂמְּחֵי לֵ֑ב מִצְוַ֥ת יְהוָ֥ה בָּ֝רָ֗ה מְאִירַ֥ת עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/008.yaml
  text: The precepts of Yahweh are right[a], rejoicing the heart; the commandment of Yahweh is pure, enlightening the eyes.
translation:
  language: ta
  text: யாவேயின் விதிமுறைகள் நேர்மையானவை; அவை இதயத்தை மகிழ்விக்கின்றன. யாவேயின் கட்டளை தூய்மையானது[a]; அது கண்களுக்கு ஒளியூட்டுகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தெளிவானது.” எபிரெயப் பெயரடை முதன்மையாகத் தூய்மையைக் குறிக்கிறது; ஆனால், “கண்களுக்கு ஒளியூட்டுகிறது” என்ற இணைச் சொற்றொடருக்கு ஏற்ப, தெளிவு என்ற பொருளும் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
  choice: நெறிக்கட்டளைகள்
  rationale: இந்தச் சொல் நியமிக்கப்பட்ட வழிகாட்டும் ஆணைகளைக் குறிக்கிறது. அருகிலுள்ள מִצְוַת என்பதிலிருந்து வேறுபாட்டைக் காத்தபடி, அதன் வழிநடத்தும் மற்றும் கட்டளையிடும் இயல்பை ‘நெறிக்கட்டளைகள்’ வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பால் மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: יְשָׁרִים
  choice: செம்மையானவை
  rationale: இங்கு நேரானவை என்ற உருவகத்திலிருந்து வரும் சரியான, குறையற்ற தன்மையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: מְשַׂמְּחֵי לֵב
  choice: இதயத்தை மகிழ்விக்கின்றன
  rationale: காரணவினைப் பொருளையும் தொடரும் விளைவைக் காட்டும் எபிரெயப் பங்கேற்பு வடிவத்தையும் இயல்பான தமிழில் தருகிறது.
- source_word: לֵב
  choice: இதயம்
  rationale: சிந்தனை, விருப்பம், உணர்வு ஆகியவற்றை உள்ளடக்கக்கூடிய எபிரெயக் கவித்துவப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: מִצְוַת
  choice: கட்டளை
  rationale: ஒருமை வடிவத்தையும் உடன்படிக்கை சார்ந்த அதிகாரமுள்ள ஆணை என்ற பொருளையும் காக்கிறது; פִּקּוּדֵי என்பதற்கான மொழிபெயர்ப்பிலிருந்தும் வேறுபடுகிறது.
- source_word: בָּרָה
  choice: தூய்மையானது
  rationale: சொல்லின் அடிப்படைப் பொருளான தூய்மை அல்லது கலப்பின்மையை முன்னிறுத்துகிறது; பின்னுள்ள ஒளிப் படிமத்தால் சாத்தியமாகும் ‘தெளிவானது’ என்ற பொருளை அடிக்குறிப்பில் வைத்திருக்கிறது.
- source_word: מְאִירַת עֵינָיִם
  choice: கண்களுக்கு ஒளியூட்டுகிறது
  rationale: காரணவினைப் பொருளையும் கண்கள் என்ற திடமான கவித்துவப் படிமத்தையும் பாதுகாத்து, தமிழில் இயல்பாக அமைகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் அல்லது யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதற்குப் பதிலாக ஒரு பட்டப்பெயரை இடாமல், எபிரெய உச்சரிப்புக்கு நெருக்கமான தமிழ் ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- issue: בָּרָה என்பதன் பொருள்
  choice: தூய்மையானது
  alternative: தெளிவானது
  rationale: அடிப்படைச் சொற்பொருள் தூய்மையைச் சுட்டுகிறது. ஆயினும், ‘கண்களுக்கு ஒளியூட்டுகிறது’ என்ற இணை வரியால் தெளிவு என்ற நுண்பொருளும் சாத்தியமாகிறது; அந்தத் திறந்த தன்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், அதே நேரத்தில் சங்கீதத்துக்கேற்ற கண்ணியமான கவித்துவ நடையைப் பயன்படுத்துகிறது. இரு இணை வாக்கியங்களின் அமைப்பும் காரணவிளைவும் பாதுகாக்கப்பட்டுள்ளன.
