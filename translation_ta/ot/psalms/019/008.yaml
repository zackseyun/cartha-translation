  to: யாவேயின் விதிமுறைகள் நேர்மையானவை; அவை இதயத்தை மகிழ்விக்கின்றன. யாவேயின் கட்டளை தூய்மையானது[a]; அது கண்களுக்கு ஒளியூட்டுகிறது.
