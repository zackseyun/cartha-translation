  text: Their line has gone out through all the earth[a], and their words to the end of the world. In them he has set a tent for the sun[b],
translation:
  language: ta
  text: அவற்றின் அளவுக்கயிறு பூமியெங்கும் சென்றிருக்கிறது[a]; அவற்றின் சொற்கள் உலகத்தின் எல்லைவரை எட்டியிருக்கின்றன. அவற்றில் சூரியனுக்காக அவர் ஒரு கூடாரத்தை அமைத்திருக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் ஒலி/குரல் பூமியெங்கும் சென்றிருக்கிறது.” எபிரெய மெய்யெழுத்து உரை “அவற்றின் அளவுக்கயிறு” என்று வாசிக்கிறது; ஆனால் சில பழங்கால மொழிபெயர்ப்புகளும் பல விளக்கவுரையாளர்களும் இந்தக் கவிதைச் சூழலில் “ஒலி” அல்லது “குரல்” என்ற பொருளைப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: “அவற்றில்” என்பது முந்தைய வசனத்தில் குறிப்பிடப்பட்ட வானங்களைச் சுட்டுவதாக இருக்கலாம்.
    reason: cross_reference
lexical_decisions:
- source_word: קַוָּם
  choice: அவற்றின் அளவுநூல்
  rationale: மசோரா எபிரெய உரையின் ‘நூல்/அளவுநூல்’ என்ற வாசகத்தை முதன்மை உரையில் காக்கிறது. கவிதைச் சூழலில் அதன் பரவலையும் எட்டும் எல்லையையும் குறிக்கலாம்; ‘ஒலி/குரல்’ என்ற பழமையான மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יָצָא
  choice: சென்றிருக்கிறது
  rationale: முற்றுவினையின் நிறைவேறிய செயலும் தொடரும் விளைவும் இயல்பான நவீனத் தமிழில் வெளிப்படுகின்றன.
- source_word: מִלֵּיהֶם
  choice: அவற்றின் சொற்கள்
  rationale: சொற்கள் அல்லது பேச்சு என்பதே நேரடியான பொருள்; முந்தைய அடியில் வரும் உருவகத்துடன் கவிதை இணைப்பைத் தக்கவைக்கிறது.
- source_word: תֵבֵל
  choice: உலகம்
  rationale: குடியிருக்கும் உலகத்தைக் குறிக்கும் சொல்லுக்கு இயல்பான, சுருக்கமான தமிழாக்கம்.
- source_word: שָׂם
  choice: அமைத்திருக்கிறார்
  rationale: வைத்தல் அல்லது நிறுவுதல் என்ற செயலைத் தமிழில் இயல்பாகக் கூறுகிறது.
- source_word: אֹהֶל
  choice: கூடாரம்
  rationale: வழிபாட்டுக்குரிய சிறப்புப் பொருளைத் தேவையின்றி புகுத்தாமல், சொல்லின் சாதாரண பொருளைப் பாதுகாக்கிறது.
- source_word: בָּהֶם
  choice: அவற்றில்
  rationale: மூலத்தின் பன்மைப் பதிலிடுபெயரைப் பாதுகாக்கிறது; அது முந்தைய வசனத்தின் வானங்களைச் சுட்டுவதாக இருக்கலாம் என்பதை அடிக்குறிப்பு விளக்குகிறது.
- source_word: לַשֶּׁמֶשׁ
  choice: சூரியனுக்காக
  rationale: முன்னிடைச்சொல் தொடரின் நேரடியான, இயல்பான தமிழாக்கம்.
