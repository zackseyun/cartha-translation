  text: מִ/קְצֵ֤ה הַ/שָּׁמַ֨יִם מֽוֹצָא֗/וֹ וּ/תְקוּפָת֥/וֹ עַל קְצוֹתָ֑/ם וְ/אֵ֥ין נִ֝סְתָּ֗ר מֵֽ/חַמָּת/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
translation:
  language: ta
  text: 'வானங்களின் ஒரு முனையிலிருந்து அது உதிக்கிறது[a];

    அதன் சுற்றுப்பயணம் அவற்றின் எல்லைகள் வரை நீள்கிறது[b].

    அதன் வெப்பத்திலிருந்து மறைந்திருப்பது எதுவுமில்லை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உதிக்கிறது’ என்பதற்குப் பதிலாக ‘புறப்படுகிறது’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சூரியன் வெளிப்படுவதையோ அது புறப்படும் இடத்தையோ குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘சுற்றுப்பயணம்’ என்பதற்குப் பதிலாக ‘சுற்று’ அல்லது ‘சுற்றுப்பாதை’ என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் சூரியன் வானங்களைக் கடந்து சுற்றிச் செல்வதை வலியுறுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: வானங்களின் ஒரு முனையிலிருந்து
  rationale: קָצֶה என்பது ‘முனை, எல்லை’ என்பதைக் குறிக்கிறது. מִ முன்னொட்டுடன் வரும் ஒருமை வடிவம் இங்கு ‘ஒரு முனையிலிருந்து’ என்று இயல்பாகப் பொருள்படுகிறது; שָׁמַיִם என்பதன் பன்மை வடிவத்தையும் ‘வானங்கள்’ தக்கவைக்கிறது.
- source_word: מוֹצָאוֹ
  choice: அது உதிக்கிறது
  rationale: מוֹצָא என்பதன் அடிப்படைப் பொருள் ‘புறப்படுதல்/வெளிப்படுதல்.’ முந்தைய வசனத்திலுள்ள சூரியனைச் சுட்டும் இச்சூழலில், அதன் வெளிப்படுதலை இயல்பான நவீனத் தமிழில் ‘உதிக்கிறது’ என்று வழங்குவது கவிதைப் படிமத்தைத் தெளிவாகக் காக்கிறது.
- source_word: וּתְקוּפָתוֹ
  choice: அது சுற்றிவரும் பாதை
  rationale: תְּקוּפָה என்பது சுற்றுதல், சுற்றுப்பாதை, அல்லது ஒரு முழுச் சுற்றைக் குறிக்கலாம். ‘சுற்றிவரும் பாதை’ என்பது வானங்களைக் கடந்து செல்லும் சூரியனின் கவித்துவ இயக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַל קְצוֹתָם
  choice: அவற்றின் எல்லைகள் வரை நீள்கிறது
  rationale: பன்மை பின்னொட்டு ‘வானங்களை’ச் சுட்டுகிறது. இச்சூழலில் עַל என்பது சுற்றுப்பாதையின் பரப்பை அல்லது சென்றடையும் எல்லையை உணர்த்துவதால், ‘அவற்றின் எல்லைகள் வரை’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְאֵין נִסְתָּר
  choice: மறைந்திருப்பது எதுவுமில்லை
  rationale: אֵין உடன் வரும் நִסְתָּר என்னும் செயப்பாட்டு வினையெச்சம், எந்த ஒன்றும் மறைவாக இல்லை என்பதைச் சுருக்கமாகக் கூறுகிறது.
- source_word: מֵחַמָּתוֹ
  choice: அதன் வெப்பத்திலிருந்து
  rationale: חַמָּה இங்கு சூரியனின் தீவிரமான வெப்பத்தைக் குறிக்கிறது. ‘வெப்பம்’ என்பது ‘சூடு’ அல்லது ‘இதமான வெம்மை’ என்பவற்றைவிட இச்சூழலுக்கு ஏற்ற தெளிவான சொல்.
theological_decisions:
- issue: சூரியனுக்குக் கொடுக்கப்படும் ஆளுருவகத்தின் அளவு
  choice: தமிழில் இயல்பான அஃறிணைச் சுட்டுப்பெயரான ‘அது/அதன்’ பயன்படுத்தப்பட்டுள்ளது; சூரியனின் இயக்கத்தைச் சித்தரிக்கும் கவித்துவ மொழி காக்கப்பட்டுள்ளது.
  alternative: எபிரெய ஆண்பால் பின்னொட்டுகளை வலியுறுத்தும் வகையில் ஆண்பால் சுட்டுப்பெயர்களைப் பயன்படுத்துதல்.
  rationale: எபிரெயிலுள்ள ஆண்பால் பின்னொட்டுகள் ‘சூரியன்’ என்ற சொல்லின் இலக்கணப் பாலுடன் ஒத்தவை. தமிழில் சூரியனை ‘அது’ என்று குறிப்பிடுவது இயல்பானது; இதனால் படைப்பைத் தெய்வமாக்கும் தேவையற்ற தொனி புகுத்தப்படாமல், கவித்துவ ஆளுருவகம் மட்டும் நிலைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் கவிதைநயமும் கண்ணியமான நடையும் காக்கப்பட்டுள்ளன. மூன்று இணையான வரிகள் எபிரெயக் கவிதையின் இயக்கத்தையும் முடிவுக் கூற்றின் வலிமையையும் வெளிப்படுத்துகின்றன.
