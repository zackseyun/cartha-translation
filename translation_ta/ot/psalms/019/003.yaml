source:
  edition: WLC
  text: אֵֽין אֹ֭מֶר וְ/אֵ֣ין דְּבָרִ֑ים בְּ֝לִ֗י נִשְׁמָ֥ע קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/003.yaml
  text: There is no speech[a], and there are no words; their voice is not heard.
translation:
  language: ta
  text: பேச்சு இல்லை; வார்த்தைகளும் இல்லை; அவற்றின் குரல்[a] கேட்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றின் ஒலி கேட்பதில்லை.” எபிரெயச் சொல் קוֹל என்பதற்கு “குரல்” அல்லது “ஒலி” என்று பொருள் வரலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: இல்லை
  rationale: இருப்பை மறுக்கும் எபிரெயச் சொல்லைத் தமிழில் இயல்பான பெயரெச்சமற்ற மறுப்பு வடிவில் அளிக்கிறது.
- source_word: אֹמֶר
  choice: பேச்சு
  rationale: ஒரு குறிப்பிட்ட கூற்றை அல்லாமல், பொதுவான வாய்மொழி வெளிப்பாட்டைக் குறிக்கிறது; அடுத்துள்ள ‘வார்த்தைகள்’ என்பதோடு கவிதை இணை அமைப்பையும் காக்கிறது.
- source_word: דְּבָרִים
  choice: வார்த்தைகள்
  rationale: தொடர்பாடலும் கேட்டலும் பற்றிய இச்சூழலில், பன்மை வடிவத்தின் நேரடியான பொருள் இதுவே.
- source_word: בְּלִי
  choice: கேட்பதில்லை என்ற மறுப்பு அமைப்பு
  rationale: பின்வரும் ‘கேட்கப்படுதல்’ என்பதன் மறுக்கப்பட்ட சூழ்நிலையைத் தமிழில் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: נִשְׁמָע
  choice: கேட்பதில்லை
  rationale: שׁמע வேரின் கேட்கப்படுதல் என்ற பொருளை, தொடரும் நிலையை உணர்த்தும் இயல்பான தமிழ் வடிவில் தருகிறது.
- source_word: קוֹלָם
  choice: அவற்றின் குரல்
  rationale: ‘குரல்’ என்பது வானங்களின் மனிதப்பண்பேற்றப்பட்ட சாட்சியைத் தக்கவைக்கிறது; ‘ஒலி’ என்ற சாத்தியமான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: வானங்களின் சாட்சி சொற்களற்ற தொடர்பாடலா என்பது
  choice: சாதாரண பேச்சும் வார்த்தைகளும் இல்லை; அவற்றின் குரல் கேட்பதில்லை என்ற நேரடி மறுப்பு வாசிப்பு
  alternative: பேச்சோ வார்த்தைகளோ இல்லாமலேயே அவற்றின் குரல் வெளிப்படுகிறது, அல்லது அவற்றின் குரல் கேட்காத இடமில்லை என்ற வாசிப்பு
  rationale: எபிரெய உரையின் தொடர்ச்சியான மறுப்புகளை நேரடியாகக் காத்து, படைப்பு கடவுளின் மகிமையை அறிவிக்கிறது என்ற முந்தைய கூற்றுக்கும் அது மனித மொழியில் பேசுவதில்லை என்ற இவ்வரிக்கும் இடையிலான கவித்துவ மற்றும் இறையியல் இழுவிசையைத் தீர்த்துவிடாமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான கவிதை நடையைப் பயன்படுத்துகிறது. ‘கேட்பதில்லை’ என்பது கனமான செயப்பாட்டு வடிவத்தைத் தவிர்த்து, எபிரெய உரையின் தொடர்நிலை மறுப்பை இயல்பாக வெளிப்படுத்துகிறது.
