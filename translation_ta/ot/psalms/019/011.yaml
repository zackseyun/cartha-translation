id: PSA.19.11
reference: Psalms 19:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: גַּֽם עַ֭בְדְּ/ךָ נִזְהָ֣ר בָּ/הֶ֑ם בְּ֝/שָׁמְרָ֗/ם עֵ֣קֶב רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/011.yaml
  text: Also[a], your servant is warned by them[b]; in keeping them there is great reward.
translation:
  language: ta
  text: மேலும், உமது ஊழியன் அவற்றால் எச்சரிக்கப்படுகிறான்[a]; அவற்றைக் கடைப்பிடிப்பதில் மிகுந்த பலன் உண்டு[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவற்றிலிருந்து எச்சரிப்பைப் பெற்றுக்கொள்கிறான்”; எபிரெய வினைச்சொல் எச்சரிக்கப்படுதல் அல்லது எச்சரிப்பைக் கவனத்தில் கொள்ளுதல் ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “மிகுந்த கைம்மாறு உண்டு” அல்லது “மிகுந்த விளைவு உண்டு.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: மேலும்
  rationale: முந்தைய வசனங்களில் ஆண்டவருடைய வார்த்தைகளுக்குக் கூறப்பட்ட புகழோடு இக்கூற்றை இணைக்கும் சேர்க்கைப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַבְדְּךָ
  choice: உமது ஊழியன்
  rationale: சங்கீதக்காரர் கடவுளை நேரடியாக விளித்து, தம்மை அவருக்குச் சேவை செய்கிறவராகக் குறிப்பிடுகிறார்; இச்சூழலில் உறவு மற்றும் பக்தியைக் காட்டும் ‘ஊழியன்’ பொருத்தமானது.
- source_word: נִזְהָר
  choice: எச்சரிக்கப்படுகிறான்
  rationale: זהר என்பதன் நிஃபால் வடிவிலுள்ள எச்சரிக்கப்படுதல் அல்லது எச்சரிப்பை ஏற்றுக்கொள்ளுதல் என்ற பொருளை, அதன் செயப்பாட்டு நயத்துடன் காக்கிறது.
- source_word: בָּהֶם
  choice: அவற்றால்
  rationale: முந்தைய சூழலில் கூறப்பட்ட ஆண்டவருடைய விதிமுறைகளைச் சுட்டி, அவையே எச்சரிக்கும் கருவி என்பதைக் காட்டுகிறது.
- source_word: בְּשָׁמְרָם
  choice: அவற்றைக் கடைப்பிடிப்பதில்
  rationale: שמר என்பதன் காத்தல், பின்பற்றுதல் என்ற கருத்தையும், בְּ முன்னொட்டின் சூழ்நிலை அல்லது வழிமுறை சார்ந்த பொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֵקֶב
  choice: பலன்
  rationale: கடைப்பிடிப்பதிலிருந்து தொடரும் நன்மையான விளைவு அல்லது கைம்மாறு என்ற பரப்பைச் சுருக்கமாகக் காட்டுகிறது; ‘பலன்’ என்பது வெறும் தகுதி அடிப்படையிலான சம்பளத்தை அவசியமாகக் குறிக்காது.
- source_word: רָב
  choice: மிகுந்த
  rationale: பலனின் பெருக்கத்தையும் அளவையும் இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: கட்டளைகளைக் கடைப்பிடிப்பது கடவுளிடத்தில் தகுதி அடிப்படையில் கைம்மாற்றைச் சம்பாதிப்பதாக இவ்வசனம் வாக்குறுதி அளிக்கிறதா, அல்லது கீழ்ப்படிதலின் நன்மையான விளைவை மட்டும் கூறுகிறதா?
  choice: கடைப்பிடிப்பதில் மிகுந்த பலன் உண்டு என்று மொழிபெயர்த்து, கீழ்ப்படிதலுக்கும் பலனுக்கும் உள்ள தொடர்பைப் பேணுகிறது; மனிதத் தகுதியைப் பற்றிய ஒரு கோட்பாட்டைச் சேர்க்கவில்லை.
  alternative: கட்டளைகளைக் கடைப்பிடிப்பதால் கடவுளிடமிருந்து கைம்மாறு சம்பாதிக்கப்படுகிறது என்ற வலுவான தகுதி-மைய வாசிப்பு.
  rationale: בְּשָׁמְרָם עֵקֶב רָב என்பது கடைப்பிடித்தலோடு தொடர்புடைய பெரும் பலன் அல்லது விளைவை இயல்பாகக் கூறுகிறது; அந்தப் பலனின் துல்லியமான இறையியல் அடிப்படையை வசனம் வரையறுக்காததால், மொழிபெயர்ப்பும் அதைத் தீர்மானிக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரத்தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய மரியாதையும் கவித்துவச் செறிவும் கொண்ட நடை. கடவுளை நேரடியாக விளிக்கும் சூழலுக்கேற்ப ‘உமது’ பயன்படுத்தப்பட்டுள்ளது; ‘கடைப்பிடிப்பதில்’ என்பது கட்டளைகளை வெறுமனே பாதுகாப்பதைவிட அவற்றைப் பின்பற்றும் கருத்தைத் தெளிவாக்குகிறது.
