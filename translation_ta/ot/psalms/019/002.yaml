  text: 'நாளுக்கு நாள் பேச்சைப் பொழிகிறது[a];

    இரவுக்கு இரவு அறிவை வெளிப்படுத்துகிறது[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பேச்சைப் பொழிகிறது’ என்பதற்குப் பதிலாக ‘பேச்சை உரைக்கிறது’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினைச்சொல் வெறுமனே பேசுவதை மட்டுமல்ல, மிகுதியாகப் பெருக்கெடுத்து வெளிவருவதையும் சித்தரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘அறிவை வெளிப்படுத்துகிறது’ என்பதற்குப் பதிலாக ‘அறிவைத் தெரிவிக்கிறது’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֣וֹם לְיוֹם
  choice: நாளுக்கு நாள்
  rationale: மீண்டும் வரும் பெயர்ச்சொல்லும் ל முன்னொட்டும் ஒரு நாளிலிருந்து அடுத்த நாளுக்குச் செல்லும் தொடர்ச்சியை உணர்த்துகின்றன; இந்தத் தேர்வு எபிரெயக் கவிதையின் இணை அமைப்பையும் சுருக்கத்தையும் காக்கிறது.
- source_word: יַבִּיעַ
  choice: பொழிகிறது
  rationale: נבע என்பதன் ஹிஃபில் வடிவம் நிரம்பி வழிதல் அல்லது மிகுதியாக வெளிப்படுதல் என்ற உயிரோட்டமான உருவகத்தைக் கொண்டது; ‘பொழிகிறது’ என்பது வெறுமனே பேசுவதைவிட அந்த மிகுதியை இயல்பான தமிழில் காட்டுகிறது.
- source_word: אֹמֶר
  choice: செய்தியை
  rationale: இங்கு இச்சொல் சொல்லப்பட்ட உரை அல்லது வெளிப்படுத்தப்படும் செய்தியைக் குறிக்கிறது; ‘செய்தி’ என்பது படைப்பின் இடைவிடாத அறிவிப்பை நவீன தமிழில் தெளிவாக எடுத்துரைக்கிறது.
- source_word: וְלַיְלָה לְּלַיְלָה
  choice: இரவுக்கு இரவு
  rationale: முதல் அடியின் ‘நாளுக்கு நாள்’ என்ற அமைப்புக்கு இணையாக எபிரெயக் கவிதையின் சமச்சீர் வடிவத்தைப் பாதுகாக்கிறது.
- source_word: יְחַוֶּה
  choice: வெளிப்படுத்துகிறது
  rationale: חוה என்பதன் பியேல் வடிவம் தெரியப்படுத்துதல் அல்லது அறிவித்தல் என்று பொருள்படும்; ‘வெளிப்படுத்துகிறது’ என்பது மூலத்தின் பொருள் வரம்பை இயல்பாகக் காக்கிறது.
- source_word: דָּעַת
  choice: அறிவை
  rationale: இச்சொல்லின் நேரடியான பொருள் அறிவு அல்லது புரிதல்; ‘அறிவு’ என்பது முதல் அடியிலுள்ள செய்தியுடன் அமையும் கருத்து இணைப்பைக் காக்கிறது.
