base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/009.yaml
  text: The fear of Yahweh is pure[a], enduring forever; the judgments of Yahweh are true[d][c][b]; they are altogether righteous.
translation:
  language: ta
  text: யாவேக்குப் பயப்படுதல் தூயது[a]; அது என்றென்றும் நிலைத்திருக்கும்[b]. யாவேயின் தீர்ப்புகள்[c] உண்மையானவை; அவை அனைத்தும் முற்றிலும் நீதியானவை[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘சுத்தமானது.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லளவில், ‘என்றென்றும் நிற்கிறது.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘யாவேயின் நியமங்கள்.’
    reason: lexical_alternative
  - marker: d
    text: எபிரெயத்தில், ‘ஒட்டுமொத்தமாக நீதியானவை’; அதாவது, முழுத் தொகுதியாக முற்றிலும் நீதியானவை.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: யாவேக்குப் பயப்படுதல்
  rationale: எபிரெயக் கட்டமைப்பின் ‘யாவேக்கு உரிய/யாவே நோக்கிய பயபக்தி’ என்ற செறிவை விளக்கமாகச் சுருக்காமல் காக்கிறது. ‘பயப்படுதல்’ என்பது அச்சத்தை மட்டும் அல்லாமல் மரியாதையும் பயபக்தியும் உள்ளடக்கக்கூடிய வேதாகம வழக்காகும்.
- source_word: טְהוֹרָה
  choice: தூயது
  rationale: சடங்கு மற்றும் ஒழுக்கத் தூய்மை ஆகிய இரு சாத்தியங்களையும் தாங்கும் இயல்பான நவீனத் தமிழ் சொல்.
- source_word: עוֹמֶדֶת לָעַד
  choice: அது என்றென்றும் நிலைத்திருக்கும்
  rationale: சொல்லளவில் ‘என்றென்றும் நிற்கிறது’; தமிழில் நிலைபேற்றை இயல்பாகத் தெரிவிக்க ‘நிலைத்திருக்கும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: מִשְׁפְּטֵי יְהוָה
  choice: யாவேயின் தீர்ப்புகள்
  rationale: தெய்வீக நீதித் தீர்ப்புகள், சட்டத் தீர்மானங்கள் அல்லது நியமங்கள் என்ற பொருள் பரப்பில் நீதித்துறை நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: אֱמֶת
  choice: உண்மையானவை
  rationale: பெயர்ப் பயனான ‘உண்மை’ என்பதையும் நம்பகத்தன்மையையும் உள்ளடக்கிய, தமிழில் இயல்பான பயனிலை வடிவம்.
- source_word: צָדְקוּ יַחְדָּו
  choice: அவை அனைத்தும் முற்றிலும் நீதியானவை
  rationale: יַחְדָּו என்பதன் கூட்டுமொத்த வலியுறுத்தலையும், தீர்ப்புகள் ஒவ்வொன்றும் மற்றும் மொத்தமாகவும் நீதியானவை என்ற கருத்தையும் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பட்டத்தை மாற்றீடாக இடாமல், எபிரெயத் தெய்வீகப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: தேவ வெளிப்பாட்டை விவரிக்கும் தொடரில் ‘யாவேக்குப் பயப்படுதல்’ என்பதன் குறிப்பு
  choice: ‘யாவேக்குப் பயப்படுதல்’ என்ற எபிரெயச் சொல்லாட்சியைத் தக்கவைத்தல்
  alternative: யாவேயின் வழிபாடு; யாவேயின் சமயம்; யாவேமீதான பயபக்தி
  rationale: இங்கு அது வெளிப்படுத்தப்பட்ட பக்தி அல்லது வழிபாட்டை ஆகுபெயராகக் குறிக்கலாம்; ஆனால் அவ்வாறு விளக்கி மட்டும் மொழிபெயர்ப்பது அச்சம், மரியாதை, பக்தி ஆகியவற்றின் உண்மையான இறையியல் செறிவைக் குறைக்கும்.
- issue: צָדְקוּ יַחְדָּו என்பதன் பரப்பு
  choice: ‘அவை அனைத்தும் முற்றிலும் நீதியானவை’ என தனித்தனியான மற்றும் கூட்டுமொத்த நீதியை உணர்த்துதல்
  alternative: ‘அவை ஒன்றாக நீதியுள்ளவையாக இருக்கின்றன’
  rationale: יַחְדָּו கூட்டாக அல்லது ஒட்டுமொத்தமாக என்ற பொருளைத் தரலாம். தமிழ் வாசகம் முழுத் தொகுதியின் நீதியைத் தெளிவாகக் கூறுகிறது; எந்தத் தனிப்பட்ட கோட்பாட்டு விளக்கத்தையும் சேர்க்கவில்லை.
translation_notes:
  register: மொழிநடை நவீனத் தரத் தமிழிலும், சங்கீதத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டது. இறைபெயர் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டது. இணை அமைப்பைத் தெளிவாக்க அரைப்புள்ளியும் முற்றுப்புள்ளியும் பயன்படுத்தப்பட்டன; எபிரெயத்தின் சுருக்கமும் இறையியல் பதற்றமும் இயன்றவரை காக்கப்பட்டன.
