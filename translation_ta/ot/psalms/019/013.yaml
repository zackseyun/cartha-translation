revisions:
- from: துணிகரமான பாவங்களிலிருந்தும் உமது அடியேனைத் தடுத்து வையும்[a]; அவை என்னை ஆளவிடாதேயும். அப்போது நான் குற்றமற்றவனாய் இருப்பேன்[b]; பெரும் மீறுதலின் பழியிலிருந்து விடுபடுவேன்[c].
  to: துணிகரமான பாவங்களிலிருந்தும் உமது அடியேனைத் தடுத்தருளும்[a]; அவை என்னை ஆளவிடாதிருப்பீராக. அப்போது நான் களங்கமற்றவனாய் இருப்பேன்[b]; பெரும் மீறுதலின் பழியிலிருந்து விடுபடுவேன்[c].
