  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[d][c][b]. Then I will be blameless and be cleared from great transgression.
translation:
  language: ta
  text: துணிகரமான பாவங்களிலிருந்தும் உமது அடியேனைத் தடுத்தருளும்[a]; அவை என்னை ஆளவிடாதிருப்பீராக. அப்போது நான் களங்கமற்றவனாய் இருப்பேன்[b]; பெரும் மீறுதலின் பழியிலிருந்து விடுபடுவேன்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அகந்தையுள்ளவர்களிடமிருந்தும்” அல்லது “செருக்குடையவர்களிடமிருந்தும்.” எபிரெயச் சொல் அகந்தையுள்ள மனிதர்களையோ, அகந்தையோடு செய்யப்படும் துணிகரமான பாவங்களையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “முழுமையானவனாய் இருப்பேன்,” “நேர்மையுள்ளவனாய் இருப்பேன்.” எபிரெயச் சொல் முழுமை, நேர்மை, குற்றமற்ற நிலை ஆகிய பொருள்களைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “பெரும் கலகத்திலிருந்து குற்றமற்றவனாவேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: -இலிருந்தும்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட மறைவான தவறுகளுடன் இந்த வேண்டுதலை இணைக்கும் சேர்க்கைப் பொருளைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: מִזֵּדִים
  choice: துணிகரமான பாவங்களிலிருந்து
  rationale: இந்தச் சொல் அகந்தையுள்ள மனிதர்களையோ அகந்தை கலந்த துணிகரச் செயல்களையோ குறிக்கலாம். முந்தைய வசனத்தின் பாவச் சூழலும், அவை தன்னை ஆளாதிருக்க வேண்டும் என்ற தொடர்ச்சியும் இங்கு பாவங்களைக் குறிக்கும் வாசிப்பை ஆதரிக்கின்றன; ‘துணிகரமான’ என்பது பெருமிதம் மற்றும் வேண்டுமென்றே வரம்புமீறும் நுணுக்கத்தைக் காக்கிறது.
- source_word: חֲשֹׂךְ
  choice: தடுத்து வையும்
  rationale: அத்தகைய பாவங்களில் விழாதபடி இறைவன் அடியேனை அடக்கிக் காக்க வேண்டும் என்ற கட்டளை வடிவ வேண்டுதலை இயல்பான தமிழில் தருகிறது.
- source_word: עַבְדֶּךָ
  choice: உமது அடியேன்
  rationale: இறைவனை நோக்கிய மன்றாட்டில் கீழ்ப்படிதலையும் பணிவையும் வெளிப்படுத்தும் இயல்பான, மரியாதையான தமிழ் நடை.
- source_word: אַל יִמְשְׁלוּ בִי
  choice: அவை என்னை ஆளவிடாதேயும்
  rationale: מָשַׁל בְּ என்பதன் ஆதிக்கம் செலுத்துதல் என்ற உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: אָז
  choice: அப்போது
  rationale: இறைவன் தடுத்து காப்பதன் விளைவை அறிமுகப்படுத்தும் கால-விளைவு இணைப்பை நேரடியாகக் காட்டுகிறது.
- source_word: אֵיתָם
  choice: நான் குற்றமற்றவனாய் இருப்பேன்
  rationale: முழுமை அல்லது நேர்மை சார்ந்த ஒழுக்கநிலையைச் சொல்கிறது; முழுமையான பாவமின்மையை கட்டாயப்படுத்தாமல் சூழலுக்கேற்ற ‘குற்றமற்ற’ என்ற பொருளைத் தருகிறது.
- source_word: וְנִקֵּיתִי
  choice: பழியிலிருந்து விடுபடுவேன்
  rationale: נקה என்பதிலுள்ள குற்றப்பொறுப்பிலிருந்து விடுதலை பெறுதல் என்ற கருத்தைத் தமிழில் தெளிவுபடுத்துகிறது.
- source_word: מִפֶּשַׁע רָב
  choice: பெரும் மீறுதலின் பழியிலிருந்து
  rationale: פֶּשַׁע என்பதன் கடுமையான வரம்புமீறல் அல்லது கலக நுணுக்கத்தையும் רָב என்பதன் பெருமையையும் காக்கிறது.
theological_decisions:
- issue: מִזֵּדִים என்பதன் குறிப்பு
  choice: துணிகரமான பாவங்கள்
  alternative: அகந்தையுள்ளவர்கள் / செருக்குடையவர்கள்
  rationale: முந்தைய வசனத்தில் தவறுகள் பேசப்படுவதாலும், அடுத்ததாக அவை சங்கீதக்காரனை ஆளாதிருக்க வேண்டப்படுவதாலும் ஒழுக்கப் பாவங்களைக் குறிக்கும் வாசிப்பு சூழலுக்கு நன்கு பொருந்துகிறது. எனினும் எபிரெயச் சொல்லிலுள்ள நபர்களைக் குறிக்கும் உண்மையான சாத்தியம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- issue: אֵיתָם என்பதன் வலிமை
  choice: குற்றமற்றவனாய் இருப்பேன்
  alternative: முழுமையுள்ளவனாய் / நேர்மையுள்ளவனாய் / குற்றமில்லாதவனாய் இருப்பேன்
  rationale: இங்கு இறைவனுடைய தடுப்பின் விளைவாக ஒழுக்க நேர்மையும் குற்றமற்ற நிலையும் கூறப்படுகின்றன; முற்றிலும் பாவமற்ற பரிபூரண நிலை என்ற கோட்பாட்டை மொழிபெயர்ப்பு திணிக்கவில்லை.
- issue: וְנִקֵּיתִי மற்றும் אֵיתָם இடையிலான உறவு
  choice: இரு தொடர்புடைய விளைவுகளாக மொழிபெயர்த்தல்
  alternative: ஒரே கருத்தை வலுப்படுத்தும் இணையான சொற்றொடராக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை நேர்மையுள்ள நிலை மற்றும் பெரும் மீறுதலின் பழியிலிருந்து விடுதலை ஆகிய இரண்டையும் தொடர்ச்சியாகக் கூறுகிறது; தமிழில் இரண்டின் தனித்த நுணுக்கமும் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மன்றாட்டிற்குரிய கண்ணியமான பக்திநடை பயன்படுத்தப்பட்டுள்ளது. ‘உமது அடியேன்’, ‘வையும்’, ‘விடாதேயும்’ ஆகிய வடிவங்கள் மரியாதையையும் தனிப்பட்ட வேண்டுதலையும் காக்கின்றன. மூலத்தின் உண்மையான இருபொருள் தன்மை அடிக்குறிப்பில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
