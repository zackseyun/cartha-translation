language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: הַ/שָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד אֵ֑ל וּֽ/מַעֲשֵׂ֥ה יָ֝דָ֗י/ו מַגִּ֥יד הָ/רָקִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/001.yaml
  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
translation:
  language: ta
  text: 'வானங்கள் கடவுளின் மகிமையை எடுத்துரைக்கின்றன;

    அவருடைய கைகளின் செயலை வானவிரிவு[a] அறிவிக்கிறது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வானமண்டலம்.” எபிரெயச் சொல் விரிந்து பரந்த வானத்தையோ வானக் கவிகையையோ குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם
  choice: வானங்கள்
  rationale: பன்மை வடிவத்தையும், வானம் மட்டுமல்லாது பரந்த விண்ணுலகைக் குறிக்கும் கவித்துவச் சிறப்பையும் காக்கிறது.
- source_word: מְסַפְּרִים
  choice: எடுத்துரைக்கின்றன
  rationale: ספר என்பதன் எண்ணிச் சொல்லுதல் அல்லது விவரித்து அறிவித்தல் என்ற நுணுக்கத்தையும், தொடர்ச்சியான செயலைக் காட்டும் எபிரெயப் பெயரெச்ச வடிவத்தையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּבוֹד
  choice: மகிமை
  rationale: தேவனைச் சார்ந்த כבוד என்பதன் கனமும் மாண்பும் ஒளிச்சிறப்பும் உள்ளடங்கிய வழக்கமான வேதாகமத் தமிழ்ச் சொல்.
- source_word: אֵל
  choice: கடவுள்
  rationale: இவ்விடத்தில் אֵל படைப்பாளரைக் குறிக்கும் பொதுவான தெய்வீகப் பட்டமாக உள்ளது; தனிப்பெயராக ஒலிபெயர்ப்பதைவிட நவீனத் தமிழில் 'கடவுள்' பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: וּמַעֲשֵׂה יָדָיו
  choice: அவருடைய கைகளின் செயலை
  rationale: மூலத்தின் மனிதவுருவகக் காட்சியையும் ஒருமை 'செயல்' வடிவத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: מַגִּיד
  choice: அறிவிக்கிறது
  rationale: נגד என்பதன் தெரியப்படுத்துதல் அல்லது அறிவித்தல் என்ற பொருளைத் தருவதோடு, முதல் அடியின் வினையுடன் இயல்பான கவித்துவ இணைநிலையை உருவாக்குகிறது.
- source_word: הָרָקִיעַ
  choice: வானவிரிவு
  rationale: விரிக்கப்பட்ட வானப்பரப்பு என்ற רקיע சொல்லின் படிமத்தை 'வானம்' என்பதைக் காட்டிலும் தெளிவாகக் காக்கும் இயல்பான தமிழ்ச் சேர்க்கை.
theological_decisions:
- issue: אֵל என்பதன் மொழிபெயர்ப்பு
  choice: கடவுள்
  alternative: ஏல்
  rationale: சூழல் தனிப்பெயரை வலியுறுத்தாமல், படைப்பில் வெளிப்படும் கடவுளின் மகிமையைச் சொல்கிறது. ஆகவே பட்டத்தின் பொருளை மொழிபெயர்ப்பது இயல்பானதும் தேவையற்ற தனிப்பெயர் வலியுறுத்தலைத் தவிர்ப்பதும் ஆகும்.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான கவித்துவ நடையில் வடிவமைக்கப்பட்டது. இரு இணை அடிகளும் மூலத்தின் நிகழ்காலத் தொடர்ச்சியையும் படைப்பின் மனிதவுருவகச் சாட்சியையும் காக்கின்றன. அடிக்குறிப்பு குறியீடு உரையில் இடம்பெற்றுள்ளது.
