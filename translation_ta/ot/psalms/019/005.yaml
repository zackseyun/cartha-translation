source:
  edition: WLC
  text: וְ/ה֗וּא כְּ֭/חָתָן יֹצֵ֣א מֵ/חֻפָּת֑/וֹ יָשִׂ֥ישׂ כְּ֝/גִבּ֗וֹר לָ/ר֥וּץ אֹֽרַח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/005.yaml
  text: And it is like a bridegroom coming out from his wedding chamber[a]; it rejoices like a warrior to run a course.
translation:
  language: ta
  text: அது தன் திருமண அறையிலிருந்து புறப்படும் மணமகனைப் போன்றது[a]; ஒரு வீரன் பாதையில் ஓட மகிழ்வதைப்போல் அது மகிழ்கிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் மணவிதானத்திலிருந்து’ அல்லது ‘தன் மணவறையிலிருந்து.’ எபிரெயச் சொல் חֻפָּה திருமண விதானத்தையோ மண அறையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: அது
  rationale: முந்தைய வசனத்தில் குறிப்பிடப்பட்ட சூரியனையே ஒருமைச் சுட்டுப்பெயர் குறிக்கிறது. தமிழில் உயிரற்ற பொருளைக் குறிக்கும் இயல்பான வடிவம் ‘அது’; எபிரெய இணைப்புச்சொல் கவிதைத் தொடர்ச்சிக்குரியது என்பதால் தனியாக ‘மேலும்’ எனச் சேர்க்கப்படவில்லை.
- source_word: כְּחָתָן
  choice: மணமகனைப் போன்றது
  rationale: חָתָן என்பது திருமணச் சூழலில் மணமகனைக் குறிக்கிறது; உயர்ந்த கவிதைநடையையும் திருமணப் படிமத்தையும் இயல்பாகப் பேணுகிறது.
- source_word: יֹצֵא
  choice: புறப்படும்
  rationale: יצא என்பதன் நிகழ்வுறும் செயற்பாங்கு வெளியே வருதல் அல்லது புறப்படுதலைக் குறிக்கிறது; ‘புறப்படும்’ என்பது தமிழில் இப்பயணப் படிமத்துடன் இயல்பாக அமைகிறது.
- source_word: מֵחֻפָּתוֹ
  choice: தன் திருமண அறையிலிருந்து
  rationale: חֻפָּה திருமண விதானத்தையோ மண அறையையோ குறிக்கலாம். மணமகன் வெளியே புறப்படும் படிமத்துக்கு ‘திருமண அறை’ தெளிவாகவும் இயல்பாகவும் உள்ளது; மாற்றுப் பொருள் அடிக்குறிப்பில் பேணப்பட்டுள்ளது.
- source_word: יָשִׂישׂ
  choice: அது மகிழ்கிறது
  rationale: שׂושׂ மிகுந்த மகிழ்ச்சியை வெளிப்படுத்துகிறது. ‘மகிழ்கிறது’ நவீனத் தமிழில் இயல்பானதும் கொண்டாட்டத் தொனியைப் பேணுவதுமாகும்.
- source_word: כְּגִבּוֹר
  choice: ஒரு வீரனைப்போல்
  rationale: גִּבּוֹר வலிமைமிக்க வீரனைக் குறிக்கிறது. ‘வீரன்’ வலிமை மற்றும் துணிவின் படிமத்தைச் சுருக்கமாகக் கொண்டுவருகிறது.
- source_word: לָרוּץ
  choice: ஓடுவதற்கு
  rationale: רוץ என்பதன் நேரடிப் பொருள் ஓடுதல்; போட்டியைக் குறிக்கும் கூடுதல் கருத்து சேர்க்கப்படவில்லை.
- source_word: אֹרַח
  choice: பாதையில்
  rationale: אֹרַח என்பது பாதை அல்லது வழி. எபிரெயில் உடைமைச் சுட்டு இல்லாததால் ‘தன் பாதை’ எனச் சேர்க்காமல், ‘பாதையில் ஓட’ என இயல்பான தமிழில் மொழிபெயர்க்கப்பட்டுள்ளது.
