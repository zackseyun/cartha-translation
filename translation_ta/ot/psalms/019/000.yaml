lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசை இயக்குநருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடும் நபரை இச்சொல் குறிக்கிறது. எபிரெய முன்னொட்டு לַ־ இங்கு யாரிடம் அல்லது யாருக்காக இது ஒப்படைக்கப்படுகிறது என்பதைக் காட்டுவதால், ‘இசை இயக்குநருக்கு’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையோடு தொடர்புடைய குறிப்பிட்ட இலக்கிய வகையைச் சுட்டும் வழக்கமான சொல்லாக இருப்பதால் ‘சங்கீதம்’ பயன்படுத்தப்படுகிறது; பொதுவான ‘பாடல்’ என்பதைக் காட்டிலும் இது மூலத்தின் வகைப்பாட்டை நன்றாகப் பாதுகாக்கிறது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: இங்குள்ள לְ முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, உடைமை, அல்லது அர்ப்பணிப்பு ஆகிய உறவுகளில் ஒன்றைக் குறிக்கக்கூடும். ‘தாவீதின்’ என்பது ஆசிரியத்துவத்தை மட்டும் உறுதியாக நிர்ணயிக்காமல் மூலத்தின் திறந்த தன்மையை ஓரளவு பாதுகாக்கிறது; மீதமுள்ள பொருள் வாய்ப்புகள் அடிக்குறிப்பில் தரப்படுகின்றன.
theological_decisions:
- issue: தலைப்பிலுள்ள לְדָוִד என்பதன் பொருள்
  choice: தாவீதின்
  alternative: தாவீது இயற்றியது; தாவீதுக்காக
  rationale: எபிரெயச் சொற்றொடர் தாவீதுடனான உறவைத் தெரிவிக்கிறது; ஆனால் அது நேரடி ஆசிரியத்துவமா, தொடர்பா, அல்லது அர்ப்பணிப்பா என்பதைத் தனியாகத் தீர்மானிப்பதில்லை. ஆகவே பிரதான உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் குறிப்பிடப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான சங்கீதத் தலைப்பாக வடிவமைக்கப்பட்டது. ‘இசை இயக்குநர்’ என்பது சாதாரண வாசகருக்குப் புரியும் தற்போதைய சொல்; ‘சங்கீதம்’ மரியாதைமிக்க, நிலைபெற்ற இலக்கிய வகைப்பாட்டுச் சொல்லாக வைக்கப்பட்டது.
