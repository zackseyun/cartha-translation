translation:
  language: ta
  text: இசை இயக்குநருக்கு. தாவீதின் சங்கீதம்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தாவீது இயற்றியது’ அல்லது ‘தாவீதுக்காக’; எபிரெயச் சொற்றொடர் தாவீது ஆசிரியரானவர் என்பதையோ, அவருடனான தொடர்பையோ, அல்லது அவருக்கான அர்ப்பணிப்பையோ குறிக்கக்கூடும்.
