base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/010.yaml
  text: They are more desirable than gold[a], even than much fine gold, and sweeter than honey and drippings from the honeycomb.
translation:
  language: ta
  text: அவை பொன்னைவிடவும்[a], மிகுந்த தூய பொன்னைவிடவும் விரும்பத்தக்கவை; தேனையும் தேனடைகளிலிருந்து சொட்டும் தேனையும்விட இனிமையானவை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொன்னையும் மிகுந்த தூய பொன்னையும் விட விரும்பத்தக்கவை; தேனையும் தேனடைகளிலிருந்து சொட்டும் தேனையும்விட இனிமையானவை.” எபிரெயத்தில் வினைபெயரடை வடிவங்களும் ஒப்பீட்டுச் சொற்றொடர்களும் வருகின்றன; இறுதித் தொடரை இன்னும் சொற்சொல்லாக “தேனடைகளின் சொட்டும் தேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּחֱמָדִים
  choice: விரும்பத்தக்கவை
  rationale: חמד என்பதன் செயப்பாட்டு வினையெச்சம் முந்தைய வசனத்தில் கூறப்பட்ட ஆண்டவரின் நீதித் தீர்ப்புகளைக் குறிக்கும் பன்மை எழுவாய்க்குப் பயனிலையாக வருகிறது. அடுத்து வரும் מִן ஒப்பீட்டைக் குறிப்பதால், தமிழில் ‘விரும்பத்தக்கவை’ என்பதுடன் ‘விட’ சேர்த்துக் கூறுவது இயல்பானது.
- source_word: מִזָּהָב
  choice: பொன்னைவிடவும்
  rationale: מִן இங்கு ஒப்பீட்டைக் குறிக்கிறது. ‘பொன்னைவிடவும்’ என்பது அந்த ஒப்பீட்டைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וּמִפַּז רָב
  choice: மிகுதியான தூய பொன்னைவிடவும்
  rationale: פַּז என்பது சாதாரண זָהָב-ஐவிடக் குறிப்பாகத் தூய அல்லது உயர்தரப் பொன்னைக் குறிக்கிறது; רָב அதன் மிகுதியைக் குறிக்கிறது. இந்த மொழிபெயர்ப்பு இரு பொன் சொற்களுக்கிடையிலான வேறுபாட்டையும் படிப்படியான வலியுறுத்தலையும் காக்கிறது.
- source_word: וּמְתוּקִים
  choice: இனிமையானவை
  rationale: இது முதல் பயனிலைக்கு இணையான பன்மை பெயரடை. அடுத்து வரும் ஒப்பீட்டுச் சொற்றொடருடன் ‘தேனைவிட இனிமையானவை’ எனத் தமிழில் இயல்பாக அமைகிறது.
- source_word: מִדְּבַשׁ
  choice: தேனையும் ... விட
  rationale: מִן குறிக்கும் ஒப்பீடு தமிழில் ‘தேனையும் ... விட’ என்ற கட்டமைப்பால் வெளிப்படுகிறது.
- source_word: וְנֹפֶת צוּפִים
  choice: தேனடையிலிருந்து சொட்டும் தேனையும்
  rationale: נֹפֶת சொட்டும் அல்லது வழியும் தேனையும், צוּפִים தேனடைகளையும் குறிக்கலாம். ‘தேனடையிலிருந்து சொட்டும் தேன்’ என்ற உருவகம் மூலத்தின் உயிரோட்டத்தையும் சிறந்த தேன் என்ற உட்பொருளையும் காக்கிறது.
