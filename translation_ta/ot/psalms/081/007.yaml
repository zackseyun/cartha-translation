  text: בַּ/צָּרָ֥ה קָרָ֗אתָ וָ/אֲחַ֫לְּצֶ֥/ךָּ אֶ֭עֶנְ/ךָ בְּ/סֵ֣תֶר רַ֑עַם אֶבְחָֽנְ/ךָ֨ עַל מֵ֖י מְרִיבָ֣ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/007.yaml
  text: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters of Meribah[b]. Selah
translation:
  language: ta
  text: நெருக்கடியில் நீ கூப்பிட்டாய்; நான் உன்னை மீட்டேன். இடிமுழக்கத்தின் மறைவிடத்தில் உனக்குப் பதிலளித்தேன்[a]; மெரிபாவின் நீர்நிலைகளில் உன்னைச் சோதித்தேன்[b]. சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இடிமுழக்கத்தின் இரகசிய இடத்தில்’ அல்லது ‘இடிமுழக்கத்தின் மறைவிடத்திலிருந்து’ என்றும் மொழிபெயர்க்கலாம். புயலினுள் மறைந்திருக்கும் கடவுளின் இருப்பை இந்த எபிரெய உருவகம் நினைவூட்டக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: மெரிபா என்ற பெயர், வனாந்தரத்தில் தண்ணீரைக் குறித்து இஸ்ரவேலர் வாக்குவாதம் செய்ததும் கடவுள் அவர்களைச் சோதித்ததும் தொடர்புடைய நிகழ்வை நினைவூட்டுகிறது (யாத்திராகமம் 17:1–7; எண்ணாகமம் 20:1–13).
    reason: cross_reference
lexical_decisions:
- source_word: בַּצָּרָה
  choice: நெருக்கடியில்
  rationale: צָרָה என்பது துன்பம், இக்கட்டு, நெருக்கடி ஆகிய பொருள்களைக் குறிக்கிறது. சூழ்நிலையின் தீவிரத்தைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்க ‘நெருக்கடியில்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: קָרָאתָ
  choice: நீ கூப்பிட்டாய்
  rationale: இங்கு קרא உதவிக்காகக் கூப்பிடுவதைக் குறிக்கிறது. எவரைக் கூப்பிட்டார் என்பதை எபிரெயத்தைப் போலவே வெளிப்படையாகச் சேர்க்காமல் விடுகிறது.
- source_word: וָאֲחַלְּצֶךָּ
  choice: நான் உன்னை மீட்டேன்
  rationale: Hiphil வடிவிலுள்ள חלץ ஆபத்திலிருந்து விடுவித்தல் அல்லது மீட்டல் என்னும் பொருளுடையது. ‘மீட்டேன்’ என்பது இன்றைய தமிழில் இயல்பாகவும் யாத்திரை–வனாந்தரப் பின்னணிக்கு ஏற்றதாகவும் உள்ளது.
- source_word: אֶעֶנְךָ
  choice: உனக்குப் பதிலளித்தேன்
  rationale: ענה என்பதன் நேரடியான பொருள் பதிலளித்தல். தமிழில் இயல்பான வேற்றுமை அமைப்புடன் இது வழங்கப்பட்டுள்ளது.
- source_word: בְּסֵתֶר רַעַם
  choice: இடிமுழக்கத்தின் மறைவிடத்தில்
  rationale: סֵתֶר என்பது மறைவிடம் அல்லது இரகசிய இடம்; רַעַם என்பது இடி அல்லது இடிமுழக்கம். புயலில் மறைந்திருக்கும் இறைப் பிரசன்னத்தை உணர்த்தக்கூடிய உருவகத்தை விளக்கிக் கலைக்காமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
- source_word: אֶבְחָנְךָ
  choice: உன்னைச் சோதித்தேன்
  rationale: בחן என்பது ஒருவரைச் சோதித்தல் அல்லது ஆராய்தல். ‘சோதித்தேன்’ தெளிவானதும் இச்சூழலுக்குப் பொருத்தமானதும் ஆகும்.
- source_word: עַל מֵי מְרִיבָה
  choice: மெரிபாவின் நீரருகே
  rationale: עַל இங்கு இடத்தைக் குறிக்கிறது; מֵי என்பது ‘நீர்/நீர்நிலைகள்’ என்பதைக் குறிக்கிறது. மெரிபா இடப்பெயராக ஒலிபெயர்க்கப்பட்டு, தமிழில் இயல்பான இடவியல் தொடராக வழங்கப்பட்டுள்ளது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான வழிபாட்டு அல்லது இசைச் செயல்பாடு உறுதியற்றதால், ஊகமாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இறைவனின் நேரடிப் பேச்சும் வனாந்தர நிகழ்வுகளுக்கான சுட்டுகளும்
  choice: இஸ்ரவேலின் கூப்பிடுதல், இறைவனின் மீட்பு, இடிமுழக்கத்தின் மறைவிடத்திலிருந்து/மறைவிடத்தில் வந்த பதில், மெரிபாவில் நிகழ்ந்த சோதனை ஆகியவற்றை நினைவுகூரும் இறைவனின் நேரடிப் பேச்சாக வழங்கப்பட்டது.
  alternative: ‘இடிமுழக்கத்தின் மறைவிடம்’ என்பதை சீனாய் நிகழ்வை மட்டுமே குறிக்கும் வெளிப்படையான சொல்லாக்கமாக விரிவுபடுத்துதல்; அல்லது சோதனையை முற்றிலும் தண்டனைக்குரியதாக விளக்குதல்.
  rationale: முதலாம் நபர் இறைப் பேச்சு எபிரெயத்தில் தெளிவாக உள்ளது. ஆனால் ‘இடிமுழக்கத்தின் மறைவிடம்’ சீனாய், புயல்-இறைத்தோற்றம், அல்லது இறைவனின் மறைந்திருக்கும் பிரசன்னம் ஆகியவற்றில் எதைக் குறிப்பாகச் சுட்டுகிறது என்பது தெளிவாக இல்லை. ஆகவே அந்த இறையியல் பதற்றம் தீர்மானிக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான நடையில் வழங்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் சுருக்கமும் இணையான வாக்கிய அமைப்பும் இயன்றவரை காக்கப்பட்டுள்ளன; தெளிவற்ற புயல் உருவகம் விளக்கவுரையாக மாற்றப்படவில்லை.
