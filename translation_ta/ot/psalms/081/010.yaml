  text: אָנֹכִ֨י יְה֘וָ֤ה אֱלֹהֶ֗י/ךָ הַֽ֭/מַּעַלְ/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַרְחֶב פִּ֝֗י/ךָ וַ/אֲמַלְאֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/010.yaml
  text: I am Yahweh your God[a], who brought you up from the land of Egypt. Open your mouth wide[b], and I will fill it.
translation:
  language: ta
  text: எகிப்து நாட்டிலிருந்து உன்னை வெளியே கொண்டுவந்த உன் கடவுளாகிய யாவே நானே. உன் வாயை அகலமாகத் திற; நான் அதை நிரப்புவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் அதை நிரப்பும்படி உன் வாயை அகலமாகத் திற.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: நானே
  rationale: தனி ஆளிடப்பெயர் வலியுறுத்தலைக் கொண்டிருப்பதால், தமிழில் இயல்பாகவும் அழுத்தமாகவும் ‘நானே’ என்று மொழிபெயர்க்கப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது இறைவனின் தனிப்பட்ட உடன்படிக்கைப் பெயர்; ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கப்பட்டது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை உரிமை விகுதியுடன் உள்ள நேரடியான உடன்படிக்கை அடையாளம்.
- source_word: הַמַּעַלְךָ
  choice: உன்னை வெளியே கொண்டுவந்த
  rationale: עלה என்பதன் ஹிஃபில் வடிவம் எகிப்திலிருந்து கடவுள் இஸ்ரவேலைக் கொண்டுவந்த விடுதலைச் செயலைக் குறிக்கிறது. தமிழில் ‘வெளியே கொண்டுவந்த’ என்பது சூழலைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘மேலே கொண்டுவந்த’ என்ற சொற்சொல் வடிவம் இங்கு செயற்கையாக ஒலிக்கும்.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டிலிருந்து
  rationale: מִן முன்னிடைச்சொல்லின் பிரிவிடப் பொருளையும் வழக்கமான யாத்திராகமச் சொற்றொடரையும் நேரடியாகக் காட்டுகிறது.
- source_word: הַרְחֶב פִּיךָ
  choice: உன் வாயை அகலமாகத் திற
  rationale: רחב என்பதன் கட்டளை வடிவம் ‘வாயுடன்’ வரும்போது, தமிழில் ‘அகலமாகத் திற’ என்பதே இயல்பான படிமத்தைத் தருகிறது.
- source_word: וַאֲמַלְאֵהוּ
  choice: நான் அதை நிரப்புவேன்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு முன் கூறிய ‘வாயை’ச் சுட்டுகிறது. கட்டளையைத் தொடர்ந்து வரும் தெய்வீக வாக்குறுதி அல்லது விளைவாக தமிழில் இயல்பாக மொழிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் ஒரு பட்டப்பெயர் அல்ல, நான்கு எழுத்துகளைக் கொண்ட தனிப்பட்ட இறைப்பெயரே உள்ளது. ஆகவே பெயரின் தன்மையைப் பாதுகாக்க ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டது.
- issue: וַאֲמַלְאֵהוּ என்பதன் வாக்குறுதி அல்லது நோக்கப் பொருள்
  choice: நான் அதை நிரப்புவேன்
  alternative: நான் அதை நிரப்பும்படி
  rationale: கட்டளையைத் தொடர்ந்து வரும் இணைப்பு வாக்குறுதி அல்லது விளைவைக் குறிக்கலாம்; அதே நேரத்தில் நோக்கப் பொருளும் இலக்கணரீதியாக சாத்தியம். முதன்மை உரை இயல்பான வாக்குறுதிப் பொருளைக் கொள்கிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கவித்துவத் திண்மையும் காக்கப்பட்டுள்ளன. ஒருமை முகவரியான ‘உன்/உன்னை’ மூலத்தின் எண்ணைத் தக்கவைக்கிறது. எகிப்திலிருந்து விடுதலை செய்த செயலைத் தமிழில் தெளிவுபடுத்த ‘வெளியே கொண்டுவந்த’ பயன்படுத்தப்பட்டுள்ளது.
