lexical_decisions:
- source_word: הֲסִירוֹתִי
  choice: அகற்றினேன்
  rationale: הסיר என்பதன் ஹிஃபில் முற்றுவினை முதலாம் நபர் ஒருமை, ஒன்றை நீக்குதல் அல்லது அகற்றுதல் என்ற காரணவினைப் பொருளைத் தருகிறது; சங்கீதத்தின் சூழலில் பேசுபவர் கடவுள்.
- source_word: מִסֵּבֶל שִׁכְמוֹ
  choice: அவன் தோளிலிருந்து சுமையை
  rationale: סֵבֶל என்பது சுமை அல்லது பாரம்; שׁכם என்பது தோள். எபிரெயச் சொல்லமைப்பின் பொருளை இயல்பான தமிழில் தெரிவிக்க, ‘தோளிலிருந்து சுமையை’ என்று அமைக்கப்பட்டுள்ளது.
- source_word: כַּפָּיו
  choice: அவன் கைகள்
  rationale: כף என்பதற்கு உள்ளங்கை என்றும் பொருள் உண்டு; இங்கு கட்டாய உழைப்பைக் குறிக்கும் சூழலில் ‘கைகள்’ என்பது இயல்பானதும் பொருத்தமானதும்.
- source_word: מִדּוּד
  choice: கூடையிலிருந்து
  rationale: דּוּד அரிதான, இங்கு துல்லியமான பொருள் உறுதியில்லாத பெயர்ச்சொல். உழைப்புச் சுமையை எடுத்துரைக்கும் இணைவரி காரணமாக ‘கூடை’ முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது; ‘பானை’ போன்ற மாற்றுப் பொருள்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: תַּעֲבֹרְנָה
  choice: விலகின
  rationale: עבר என்பதன் அடிப்படைப் பொருள் கடந்து செல்லுதல் அல்லது விலகுதல். கைகள் அந்த உழைப்புப் பொருளோடு இனி ஈடுபடவில்லை என்ற கருத்தை, மிகையாக ‘விடுவிக்கப்பட்டன’ என்று விளக்காமல், இயல்பான தமிழில் ‘விலகின’ எனத் தருகிறது.
