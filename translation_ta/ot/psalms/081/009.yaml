  yaml_path: translation/ot/psalms/081/009.yaml
  text: You must have no foreign god among you, and you must not bow down to an alien god[a].
translation:
  language: ta
  text: 'உன் நடுவில் வேற்றுத் தெய்வம் இருக்கக் கூடாது;

    அந்நியத் தெய்வத்தை நீ பணிந்து வணங்கக் கூடாது[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில் இஸ்ரவேலின் வழிபாட்டுக்கு வெளியிலுள்ள தெய்வத்தைக் குறிக்க, பொருளில் நெருக்கமான இரண்டு சொற்கள் பயன்படுத்தப்பட்டுள்ளன: ‘வேற்று’ மற்றும் ‘அந்நிய’. இந்தச் சொற்களின் மாறுபாடு கவிதையின் இணை அமைப்பை பிரதிபலிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיֶה
  choice: இருக்கக் கூடாது
  rationale: எதிர்மறையுடன் வரும் இந்த வினைவடிவு முன்னறிவிப்பை அல்ல, உடன்படிக்கைச் சூழலிலான தடையை வெளிப்படுத்துகிறது.
- source_word: בְךָ
  choice: உன் நடுவில்
  rationale: இஸ்ரவேல் சமூகத்தை ஒருமையில் அழைக்கும் எபிரெய வடிவைத் தக்கவைத்து, சமூகத்தின் மத்தியில் வேற்று வழிபாடு இருக்கக் கூடாது என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֵל זָר
  choice: வேற்றுத் தெய்வம்
  rationale: இஸ்ரவேலின் அங்கீகரிக்கப்பட்ட வழிபாட்டுக்கு வெளியிலுள்ள தெய்வத்தைக் குறிக்கிறது; இரண்டாம் அடியின் நெருங்கிய பொருளுடைய சொல்லிலிருந்து கவிதை வேறுபாட்டையும் காக்கிறது.
- source_word: תִשְׁתַּחֲוֶה
  choice: பணிந்து வணங்கக் கூடாது
  rationale: உடலைத் தாழ்த்திப் பணிதலையும் அதன் வழிபாட்டு நோக்கத்தையும் சாதாரண வாசகருக்குத் தெளிவாகத் தெரிவிக்கிறது; எதிர்மறை வினைவடிவின் தடைப் பொருளையும் காக்கிறது.
- source_word: לְאֵל נֵכָר
  choice: அந்நியத் தெய்வத்தை
  rationale: לְ என்பதன் இலக்கைத் தமிழின் செயப்படுபொருள் அமைப்பில் இயல்பாகக் காட்டுகிறது; נֵכָר என்பதற்கு ‘அந்நிய’ என்று வழங்குவது முதல் அடியிலுள்ள זָר உடனான நெருங்கிய பொருள் ஒற்றுமையையும் சொல் மாறுபாட்டையும் தக்கவைக்கிறது.
theological_decisions:
- issue: ஒருமை இலக்கண வடிவில் சமூகமாகிய இஸ்ரவேலுக்கான அழைப்பு
  choice: ‘உன்’, ‘நீ’ என்ற ஒருமை வடிவுகளை வைத்து, ‘உன் நடுவில்’ என்பதன் மூலம் சமூகச் சூழலை வெளிப்படுத்துதல்
  alternative: ‘உங்களிடையே’ என்று முழுமையாகப் பன்மையில் மொழிபெயர்த்தல்
  rationale: எபிரெயம் இஸ்ரவேலை ஒரே உடன்படிக்கைச் சமூகமாக ஒருமையில் அழைக்கிறது. தமிழிலும் அந்த ஒருமையைத் தக்கவைக்கும்போது, ‘உன் நடுவில்’ என்பது இதைத் தனிநபரின் உள்ளத்திற்குள் மட்டுமே சுருக்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரண்டு இணை அடிகளும் ‘வேற்று/அந்நிய’ என்ற நெருங்கிய பொருளுடைய வேறுபட்ட சொற்களும் காக்கப்பட்டுள்ளன.
