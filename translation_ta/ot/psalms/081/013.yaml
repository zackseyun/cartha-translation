  text: Oh[a], that my people would listen to me, that Israel would walk in my ways!
translation:
  language: ta
  text: என் மக்கள் எனக்குச் செவிகொடுத்து, இஸ்ரவேல் என் வழிகளில் நடந்தால் எவ்வளவு நன்றாயிருக்கும்![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் மக்கள் எனக்குச் செவிகொடுத்தால், இஸ்ரவேல் என் வழிகளில் நடந்தால்!”
    reason: לוּ என்பதன் ஏக்கமிக்க விருப்பத்தை வெளிப்படையாகச் சொல்லாமல், நிபந்தனைச் சாயலுடன் தரும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: לוּ
  choice: ஆ, ... கொடுத்தால் ... நடந்தால்!
  rationale: לוּ இங்கு சாதாரண நிபந்தனையை மட்டும் அல்லாமல் ஏக்கமும் வருத்தமும் கலந்த விருப்பத்தை அறிமுகப்படுத்துகிறது. தமிழில் தொடக்கத்திலுள்ள ‘ஆ’ உணர்ச்சியை வெளிப்படுத்துகிறது; ‘-ஆல்’ வடிவங்கள் எபிரெயச் சொல்லின் விருப்பம்/நிபந்தனை ஆகிய இரு நுணுக்கங்களையும் ஓரளவு திறந்தவையாக வைத்திருக்கின்றன.
- source_word: עַמִּי
  choice: என் மக்கள்
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டை நேரடியாகக் காட்டி, தேவனுக்கும் மக்களுக்கும் உள்ள உறவைப் பாதுகாக்கிறது.
- source_word: שֹׁמֵעַ לִי
  choice: எனக்குச் செவிகொடுத்தால்
  rationale: שׁמע + ל என்பது வெறுமனே ஒலி கேட்பதைவிட கவனித்துக் கீழ்ப்படிவதைக் குறிக்கிறது. ‘செவிகொடு’ அந்தப் பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நன்கு அறியப்பட்ட பெயர்வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: בִּדְרָכַי
  choice: என் வழிகளில்
  rationale: בְּ முன்னொட்டையும் பன்மையான דְּרָכַי என்பதையும் நெருக்கமாகப் பிரதிபலித்து, நடத்தை அல்லது வாழ்க்கை முறையைக் குறிக்கும் உருவகத்தையும் காக்கிறது.
- source_word: יְהַלֵּכוּ
  choice: நடந்தால்
  rationale: வாழ்க்கை நடத்தையைச் சுட்டும் ‘நடத்தல்’ உருவகம் பாதுகாக்கப்படுகிறது. לוּ ஆளும் விருப்பமிக்க வாக்கியத்திற்கு ஏற்றவாறு தமிழில் நிபந்தனை வடிவம் இயல்பாக அமைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: விருப்ப ஏக்கமா அல்லது நிபந்தனையா
  choice: முதன்மை உரை ‘ஆ’ என்பதன் மூலம் தேவனுடைய ஏக்கமிக்க விருப்பத்தை முன்னிறுத்துகிறது; அதேவேளை ‘-ஆல்’ வடிவம் நிபந்தனை நுணுக்கத்தையும் அழிக்கவில்லை.
  alternative: “என் மக்கள் எனக்குச் செவிகொடுத்து, இஸ்ரவேல் என் வழிகளில் நடக்கக் கூடாதா!” அல்லது “என் மக்கள் எனக்குச் செவிகொடுத்திருந்தால்...”
  rationale: לוּ இச்சூழலில் வருந்தும் விருப்பமாகச் சிறப்பாகப் புரிகிறது; ஆனால் அதன் நிபந்தனைச் சாயலை முற்றிலும் நீக்காமல் இருப்பது மூலத்தின் உண்மையான பொருள் இழுப்பை காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை. ‘செவிகொடு’ என்பது ‘கேள்’ என்பதைக் காட்டிலும் கவனித்துக் கீழ்ப்படிதல் என்ற மூலப் பொருளைத் தெளிவாகக் கொண்டுள்ளது; ‘வழிகளில் நட’ என்ற வேதாகம உருவகம் அப்படியே பாதுகாக்கப்பட்டுள்ளது.
