source:
  edition: WLC
  text: כִּ֤י חֹ֣ק לְ/יִשְׂרָאֵ֣ל ה֑וּא מִ֝שְׁפָּ֗ט לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/004.yaml
  text: For it is a statute for Israel[a], an ordinance of the God of Jacob.
translation:
  language: ta
  text: 'ஏனெனில், அது இஸ்ரவேலுக்கான ஒரு நியமம்;

    யாக்கோபின் தேவனின்[a] ஆணை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாக்கோபின் தேவனுக்கான ஆணை.” எபிரெய மொழியிலுள்ள முன்னிடைச்சொல்லை இவ்வாறும் மொழிபெயர்க்கலாம்; முதன்மை உரை அதை உரிமை அல்லது அதிகாரமூலத் தொடர்பாகப் புரிந்துகொள்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கொடுக்கப்பட்ட கொண்டாட்ட அழைப்பிற்கான காரணத்தை அறிமுகப்படுத்துவதால், விளக்கக் காரணத்தைக் காட்டும் இயல்பான தமிழ் இணைப்புச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: חֹק
  choice: நியமம்
  rationale: அதிகாரத்தால் நிர்ணயிக்கப்பட்ட நிலையான விதி என்ற சட்ட-உடன்படிக்கை சார்ந்த பொருளை இயல்பான, கண்ணியமான தமிழில் தருகிறது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கான
  rationale: இந்தக் கடைப்பிடிப்பு இஸ்ரவேலுக்காக விதிக்கப்பட்டது என்ற தொடர்பையும் பொருந்துதலையும் ל என்னும் முன்னிடைச்சொல்லுக்கு ஏற்ப வெளிப்படுத்துகிறது.
- source_word: הוּא
  choice: அது
  rationale: சூழலில் முன்பு கட்டளையிடப்பட்ட கடைப்பிடிப்பையே சுட்டுகிறது; ஒருவரை அல்ல.
- source_word: מִשְׁפָּט
  choice: ஆணை
  rationale: இங்கு தண்டனைத் தீர்ப்பு அல்ல, அதிகாரபூர்வமாக நிறுவப்பட்ட கட்டளை அல்லது ஒழுங்கு என்பதே பொருள். חֹק என்பதிலிருந்து வேறுபட்ட சொல்லாகவும் கவிதை இணைநிலையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: யாக்கோபின் தேவனுடைய
  rationale: இங்குள்ள ל, இந்த ஆணையின் உரிமை அல்லது அதிகாரமூலத் தொடர்பைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது. தமிழில் ‘தேவனுடைய’ என்பது இதை இயல்பாகத் தெரிவிக்கிறது; ‘தேவனுக்கான’ என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தமிழ் வேதாகமப் பயன்பாட்டில் நிலைபெற்றுள்ள பெயர் வடிவம்; உருபேற்கும் போது ‘யாக்கோபின்’ என வருகிறது.
theological_decisions:
- issue: חֹק மற்றும் מִשְׁפָּט என்ற இரு சட்டச் சொற்களுக்கிடையிலான தொடர்பு
  choice: ‘நியமம்’ மற்றும் ‘ஆணை’ என்று தனித்தனியாக மொழிபெயர்த்தல்
  alternative: இரண்டையும் ஒரே பொதுச் சொல்லில் இணைத்தல் அல்லது ‘சட்டம்’, ‘கட்டளை’ போன்ற மிக நெருங்கிய சொற்களால் வழங்குதல்
  rationale: எபிரெயக் கவிதை இணைநிலையில் தொடர்புடையதாயினும் வேறுபட்ட இரு சொற்கள் உள்ளன. இரண்டையும் தனித்தனியாக வழங்குவது உடன்படிக்கை மற்றும் வழிபாட்டு வலிமையைப் பாதுகாக்கிறது; தேவையற்ற தொழில்நுட்ப வேறுபாட்டையும் திணிப்பதில்லை.
- issue: לֵאלֹהֵי יַעֲקֹב என்பதில் ל-இன் பொருள்
  choice: உரிமை அல்லது அதிகாரமூலத் தொடர்பாக ‘யாக்கோபின் தேவனுடைய’
  alternative: ‘யாக்கோபின் தேவனுக்கான’
  rationale: இரு வாசிப்புகளுக்கும் எபிரெய முன்னிடைச்சொல் இடமளிக்கிறது. சூழலில் ஆணை தேவனிடமிருந்து வரும் அல்லது அவருடைய அதிகாரத்திற்குரியது என்ற பொருள் அதிகம் இயல்பாக இருப்பதால் அது முதன்மை உரையில் தரப்பட்டுள்ளது; மாற்றுச் சாத்தியம் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைநிலையை வெளிப்படுத்த அரைப்புள்ளியும் வரிப் பிரிப்பும் வைக்கப்பட்டுள்ளன; சட்டச் சொற்களின் வேறுபாடும் மூலத்தின் உண்மையான முன்னிடைச்சொல் ஐயமும் பாதுகாக்கப்பட்டுள்ளன.
