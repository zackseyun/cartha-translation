  text: But my people did not listen to my voice[a], and Israel was not willing to obey me.
translation:
  language: ta
  text: 'ஆனால் என் மக்கள் என் குரலுக்குச் செவிகொடுக்கவில்லை;

    இஸ்ரவேல் எனக்கு இணங்க விரும்பவில்லை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இஸ்ரவேல் எனக்குக் கீழ்ப்படிய விரும்பவில்லை’ அல்லது ‘இஸ்ரவேல் என்னை மறுத்தது’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினை விருப்பம் அல்லது சம்மதத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: ஆனால் ... இல்லை
  rationale: முந்தைய வசனங்களில் வரும் இறை அழைப்புக்கும் வாக்குறுதிக்கும் எதிரான மக்களின் பதிலை இயல்பான தமிழில் காட்ட ‘ஆனால்’ பயன்படுத்தப்பட்டது; மறுப்பு தெளிவாகத் தக்கவைக்கப்பட்டது.
- source_word: שָׁמַע
  choice: செவிகொடு
  rationale: ‘கேள், கவனித்துக் கேள், கீழ்ப்படி’ என்ற பொருள் வரம்புடைய இச்சொல், לְקוֹלִי என்பதுடன் இங்கு ‘குரலுக்குச் செவிகொடு’ என்று மொழிபெயர்க்கப்பட்டது. இதனால் கேட்டுப் பின்பற்றும் நுண்பொருள் நிலைத்தாலும், ‘கீழ்ப்படி’ என்ற ஒரே விளக்கத்துக்குள் அது சுருக்கப்படவில்லை.
- source_word: עַמִּי
  choice: என் மக்கள்
  rationale: முதலாம் நபர் ஒருமை உரிமை விகுதியுடன் வரும் உடன்படிக்கைச் சார்ந்த அடையாளம் நேரடியாகப் பாதுகாக்கப்பட்டது.
- source_word: לְקוֹלִי
  choice: என் குரலுக்கு
  rationale: קוֹל என்பதன் நேரடிப் பொருளான ‘குரல்’ தக்கவைக்கப்பட்டதால், இறைவனுக்கும் மக்களுக்கும் இடையிலான தனிப்பட்ட உறவின் வலிமை பாதுகாக்கப்படுகிறது.
- source_word: וְיִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: ‘என் மக்கள்’ என்பதற்கு இணையான இரண்டாம் கவிதை அடியாக இஸ்ரவேல் என்ற பெயர் தனியே தக்கவைக்கப்பட்டது. தமிழ்ச் செய்யுள் இணைப்பில் அரைப்புள்ளிக்குப் பின் ‘மேலும்’ சேர்க்காமல் இருப்பது இயல்பாக உள்ளது.
- source_word: לֹא אָבָה
  choice: இணங்க விரும்பவில்லை
  rationale: אָבָה குறிக்கும் விருப்பம் அல்லது சம்மதம் என்ற மையப் பொருளை இது வெளிப்படுத்துகிறது. ‘மறுத்தது’ அல்லது ‘கீழ்ப்படியவில்லை’ என்பவற்றைவிட மூலத்தின் விருப்பமின்மையை வெளிப்படையாகத் தக்கவைக்கிறது.
- source_word: לִי
  choice: எனக்கு
  rationale: எபிரெயச் சொல்லமைப்பிலுள்ள சுருக்கமான உறவுநிலையை விரிவாக விளக்காமல், தமிழிலும் ‘எனக்கு இணங்க’ என்று இயல்பாகவும் நெருக்கமாகவும் வழங்குகிறது.
theological_decisions:
- issue: இஸ்ரவேலை இறைவனுடைய மக்களாக அடையாளப்படுத்தும் உடன்படிக்கை மொழி
  choice: ‘என் மக்கள்’ மற்றும் ‘இஸ்ரவேல்’ ஆகிய இரண்டையும் இணையான இரு அடிகளில் தனித்தனியே வைத்தல்
  alternative: ‘என் மக்களான இஸ்ரவேல்’ என்று ஒரே தொடராக இணைத்தல்
  rationale: மூல எபிரெயம் இரு இணை அடையாளங்களைப் பயன்படுத்துகிறது. அவற்றைத் தனித்தனியே வைத்திருப்பது கவிதை இணைநிலையையும் உடன்படிக்கை வலியுறுத்தலையும் கூடுதல் விளக்கமின்றிப் பாதுகாக்கிறது.
- issue: אָבָה לִי என்பதிலுள்ள விருப்பம், சம்மதம், கீழ்ப்படிதல் ஆகிய பொருள் நிழல்கள்
  choice: ‘எனக்கு இணங்க விரும்பவில்லை’
  alternative: ‘எனக்குக் கீழ்ப்படிய விரும்பவில்லை’ அல்லது ‘என்னை மறுத்தது’
  rationale: இச்சூழலில் கீழ்ப்படிதல் உட்பொருளாக இருந்தாலும், எபிரெய வினை முதன்மையாக விருப்பம் அல்லது சம்மதத்தைக் குறிக்கிறது. ஆகவே அந்தத் திறந்த பொருள் நிலையை முதன்மை உரை பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் சங்கீதத்திற்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘குரலுக்குச் செவிகொடு’ என்ற வழக்கமான வேதாகமத் தமிழ்த் தொடர் இயல்பாகத் தக்கவைக்கப்பட்டு, இரு இணை கவிதை அடிகளும் தனித்தனியே அமைக்கப்பட்டுள்ளன.
