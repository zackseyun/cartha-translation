  text: But he would feed him with the finest wheat[b][a], and with honey from the rock I would satisfy you.
translation:
  language: ta
  text: ஆனால் அவர் மிகச் சிறந்த கோதுமையால் அவனுக்கு உணவளித்திருப்பார்[b]; கன்மலையிலிருந்து கிடைக்கும் தேனால் நான் உன்னைத் திருப்திப்படுத்தியிருப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் இவ்வசனம், ‘அவர் அவனுக்கு உணவளித்திருப்பார் ... நான் உன்னைத் திருப்திப்படுத்தியிருப்பேன்’ என்று நபரை மாற்றுகிறது. ஒருமைப் பெயர்கள் இஸ்ரயேலை ஒரு மக்களினமாகக் குறிக்கக்கூடும்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘கோதுமையின் கொழுப்பு.’ இது மிக வளமான அல்லது மிகத் தேர்ந்த கோதுமையைக் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲכִילֵהוּ
  choice: அவர் அவனுக்கு ... உணவாகக் கொடுத்திருப்பார்
  rationale: אכל என்பதன் ஹிஃபில் வடிவம் ‘உண்ணச் செய்தல்/உணவளித்தல்’ என்று பொருள்படும். முந்தைய வசனத்தின் நிறைவேறாத நிபந்தனைச் சூழலில் இதன் நிபந்தனைத் தன்மையை ‘கொடுத்திருப்பார்’ எனக் காட்டி, மூன்றாம் நபர் ஒருமைச் செயப்படுபொருளை ‘அவனுக்கு’ எனத் தக்கவைத்துள்ளது.
- source_word: מֵחֵלֶב חִטָּה
  choice: மிகச் சிறந்த கோதுமையை
  rationale: חֵלֶב என்பதன் நேர்ப்பொருள் ‘கொழுப்பு’; ஆனால் விளைபொருளைக் குறிக்கும் இத்தகைய பயன்பாட்டில் அது மிக வளமான அல்லது தேர்ந்த பகுதியைக் குறிக்கும் மரபுத்தொடர். இயல்பான நவீன தமிழில் அதன் பொருளை இவ்வாறு தருகிறது.
- source_word: וּמִצּוּר
  choice: கன்மலையிலிருந்து வரும்
  rationale: צוּר என்பது உறுதியான பாறை அல்லது கன்மலை. தேனுடன் இணைத்து, வறண்ட இடத்திலிருந்தும் கிடைக்கும் எதிர்பாராத செழிப்பின் தெளிவான கவிப்படிமத்தைத் தக்கவைக்கிறது.
- source_word: דְּבַשׁ
  choice: தேன்
  rationale: இச்சூழலில் எபிரெயச் சொல்லின் நேரான, வழக்கமான பொருள்.
- source_word: אַשְׂבִּיעֶךָ
  choice: நான் உன்னைத் திருப்திப்படுத்தியிருப்பேன்
  rationale: שׂבע என்பதன் ஹிஃபில் வடிவம் நிறைவடையச் செய்தல் அல்லது திருப்திப்படுத்துதல் என்று பொருள்படும். முதல் நபர் எழுவாயையும் இரண்டாம் நபர் ஒருமை முன்னிலையையும் வெளிப்படையாகப் பாதுகாக்கிறது; சூழலுக்கேற்ற நிபந்தனைத் தன்மையும் காட்டப்படுகிறது.
theological_decisions:
- issue: வசனத்திற்குள் நபர் இடப்பெயர்ச்சி
  choice: ‘அவர் அவனுக்கு ... கொடுத்திருப்பார்’ என்பதிலிருந்து ‘நான் உன்னைத் திருப்திப்படுத்தியிருப்பேன்’ என்பதற்கு மாறும் எபிரெய வடிவத்தைப் பாதுகாத்தல்
  alternative: தமிழில் ஒரே சீராக ‘நான் உனக்கு ... கொடுத்து உன்னைத் திருப்திப்படுத்தியிருப்பேன்’ என மாற்றுதல்
  rationale: மசோரா உரையிலுள்ள கவிதைநடை நபர் மாற்றத்தைச் சீராக்காமல் பாதுகாப்பது மூல உரையின் உண்மையான பதற்றத்தையும் தெளிவின்மையையும் மதிக்கிறது. ஒருமைப் பெயர்கள் இஸ்ரயேல் மக்களைத் தொகுதியாகக் குறிக்கலாம்.
- issue: செழிப்பைக் குறிக்கும் கவிப்படிமங்கள்
  choice: ‘மிகச் சிறந்த கோதுமை’ மற்றும் ‘கன்மலையிலிருந்து வரும் தேன்’ என்ற தெளிவான படிமங்களைத் தக்கவைத்தல்
  alternative: கன்மலையை நேரடியாக இறைவனுக்கான உருவகமாக விளக்கி மொழிபெயர்த்தல்
  rationale: மூல உரை இறை வழங்கலைக் கவிப்படிமங்களால் சித்தரிக்கிறது; முதன்மை உரையில் அவற்றை ஒரு குறிப்பிட்ட இறையியல் விளக்கமாக மாற்றுவது தேவையற்ற பொருளேற்றமாகும்.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் வடிவமைக்கப்பட்டுள்ளது. கடவுளைக் குறிக்கும் மூன்றாம் நபருக்கு மரியாதை ஒருமையான ‘அவர்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் நபர் மாற்றம் சீராக்கப்படாமல், அடிக்குறிப்புடன் பாதுகாக்கப்பட்டுள்ளது.
