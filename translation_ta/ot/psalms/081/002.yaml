translation_notes:
  register: நவீன வாசகருக்குப் புரியும், வழிபாட்டுக்கேற்ற கண்ணியமான கவிதைநடை. எபிரெய மூலத்தின் மூன்று பன்மை ஏவல்களின் இயக்கம் தமிழிலும் காக்கப்பட்டுள்ளது. கடைசி தொடரில் மூலத்தில் வெளிப்படையாக இல்லாத வினை தமிழில் வாக்கியத்தை இயல்பாக்க ‘இசையுங்கள்’ என நிரப்பப்பட்டுள்ளது; அது முன் வரும் இசைக்கட்டளையிலிருந்து பெறப்படுகிறது. கருவிகளின் துல்லிய அடையாளம் உறுதியற்றதால் அடிக்குறிப்பில் அந்த ஐயம் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளது.
