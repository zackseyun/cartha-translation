    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல் תֹף, கையில் பிடித்து அடிக்கப்படும் சட்டகப் பறை வகைக் கருவியைக் குறிக்கிறது; மரபாக இது “திம்பிரல்” என்றும் மொழிபெயர்க்கப்படுகிறது.
