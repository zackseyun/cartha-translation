    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: எழுப்புங்கள்
  rationale: נשׂא என்பதன் பன்மை ஏவல்வடிவம்; இங்கு பாடலைத் தொடங்கி உயர்த்திப் பாடுதல் என்ற இசைச்சூழல் பொருளை இயல்பாகத் தருகிறது.
- source_word: זִמְרָה
  choice: பாடலை
  rationale: துதிப்பாடல் அல்லது இசை என்ற பரந்த பொருள் உடையது; இச்சூழலில் ‘பாடல்’ இயல்பானதும் மிகைப்படுத்தாததுமாகும்.
- source_word: וּתְנוּ
  choice: முழக்குங்கள்
  rationale: சொல்லுக்குச் சொல் ‘கொடுங்கள்’; תֹף உடன் வரும்போது கருவியின் ஒலியை எழுப்புங்கள் என்பதே பொருள். ‘முழக்குங்கள்’ தமிழில் இயல்பாக அந்தச் செயலைக் காட்டுகிறது.
- source_word: תֹף
  choice: தம்புரு
  rationale: கையில் பிடித்து அடிக்கும் சட்டகப் பறை வகைக் கருவி. பழந்தமிழ் வேதாகம மரபிலும் அறிமுகமான ‘தம்புரு’ என்பதைப் பயன்படுத்தி, அதன் தன்மையை அடிக்குறிப்பில் விளக்குகிறது.
- source_word: כִּנּוֹר
  choice: யாழ்
  rationale: பண்டைய நரம்பிசைக் கருவியைக் குறிக்கிறது; நவீன ‘ஹார்ப்’ எனத் துல்லியமின்றி அடையாளப்படுத்தாமல், தமிழில் இயல்பான பழமையான நரம்பிசைக் கருவிப் பெயரைத் தேர்ந்தெடுக்கிறது.
- source_word: נָעִים
  choice: இனிய
  rationale: இன்பமான, மனதுக்கு உகந்த, இனிமையாக ஒலிக்கும் என்ற பொருளைச் சுருக்கமாகவும் கவிதைநயத்துடனும் தருகிறது.
- source_word: עִם
  choice: -யும் … -யும்
  rationale: இரு கருவிகளும் இணைந்து இசைக்கப்படுவதை இயல்பான தமிழ் இணைப்புமுறையில் வெளிப்படுத்துகிறது.
- source_word: נָבֶל
  choice: வீணை
  rationale: כִּנּוֹר இலிருந்து வேறுபட்ட மற்றொரு பண்டைய நரம்பிசைக் கருவி. சரியான கருவி வகை உறுதியற்றதால் தமிழில் பரவலாகப் புரியும் வேறொரு நரம்பிசைக் கருவிப் பெயர் பயன்படுத்தப்படுகிறது; ஐயம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
