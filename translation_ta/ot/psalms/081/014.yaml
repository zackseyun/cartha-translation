  yaml_path: translation/ot/psalms/081/014.yaml
  text: In a little while I would subdue their enemies[b][a], and turn my hand against their adversaries.
translation:
  language: ta
  text: சிறிது நேரத்திலேயே[a] அவர்களுடைய பகைவர்களை நான் அடக்கியிருப்பேன்; அவர்களுடைய எதிரிகள்மேல் என் கையைத் திருப்பியிருப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘விரைவிலேயே.’ எபிரெயச் சொல் காலத்தில் நெருக்கத்தை (‘விரைவில்’) அல்லது—இங்கு அதைவிடக் குறைந்த சாத்தியத்தில்—‘கிட்டத்தட்ட’ என்ற பொருளைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எழுத்துப்படி, ‘அவர்களுடைய எதிரிகள்மேல் என் கையைத் திருப்பியிருப்பேன்.’ இது அவர்களுக்கு எதிராக நியாயத்தீர்ப்பில் தமது வல்லமையைச் செலுத்துவதைக் குறிக்கும் உருவகத் தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: சிறிது நேரத்திலேயே
  rationale: இங்கு இந்தச் சொல் அளவில் ‘கிட்டத்தட்ட’ என்பதைக் காட்டுவதற்குப் பதிலாக, காலத்தில் மிக விரைவாக நிகழ்வதைக் குறிக்கிறது. ‘சிறிது நேரத்திலேயே’ என்பது அந்தக் கால நெருக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אוֹיְבֵיהֶם
  choice: அவர்களுடைய பகைவர்கள்
  rationale: இராணுவ அல்லது பகைமைச் சூழலில் אוֹיֵב என்பதற்கான தெளிவான, பொதுவான தமிழ் இணைச்சொல்.
- source_word: אַכְנִיעַ
  choice: நான் அடக்கியிருப்பேன்
  rationale: כנע என்பதன் ஹிஃபில் வடிவம் ஒருவரைத் தாழ்த்துதல் அல்லது கீழ்ப்படுத்துதல் என்ற காரணவினைப் பொருளைக் கொண்டது. இங்கு ‘அடக்கு’ என்பது எதிரிகளை வென்று கீழ்ப்படுத்துவதை, முறையை மிகையாகக் குறிப்பாக்காமல் தெரிவிக்கிறது; ‘அடக்கியிருப்பேன்’ என்பது முந்தைய வசனத்தின் நிறைவேறாத நிபந்தனைச் சூழலை வெளிப்படுத்துகிறது.
- source_word: צָרֵיהֶם
  choice: அவர்களுடைய எதிரிகள்
  rationale: צָר என்பது பகைமையுடன் எதிர்த்து நிற்பவர்களைக் குறிக்கிறது. முந்தைய ‘பகைவர்கள்’ என்பதிலிருந்து சொல்வேறுபாட்டைக் காத்தபடியே பொருள் ஒற்றுமையையும் தக்கவைக்க ‘எதிரிகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אָשִׁיב יָדִי
  choice: என் கையைத் திருப்பியிருப்பேன்
  rationale: எழுத்துப்படி ‘என் கையைத் திருப்புவேன்/திரும்பச் செய்வேன்’ என்று வரும் உருவகத்தை இது காக்கிறது. சூழலில் அது எதிரிகளுக்கு எதிராகத் தமது வல்லமையைச் செயல்படுத்துவதைச் சுட்டுகிறது.
- source_word: וְעַל
  choice: அவர்களுக்கு விரோதமாக
  rationale: கையைத் திருப்புதல் என்ற சொல்லோவியத்துடன் עַל இங்கு எதிர்நோக்கிய பகைச் செயலைக் குறிக்கிறது; ‘விரோதமாக’ என்பது அதை இயல்பான தமிழில் தெளிவுபடுத்துகிறது.
theological_decisions:
- issue: தேவனுடைய செயலின் நிபந்தனைத் தன்மை
  choice: ‘அடக்கியிருப்பேன் / திருப்பியிருப்பேன்’ என்ற நிறைவேறாத நிபந்தனைப் பொருள்
  alternative: ‘அடக்குவேன் / திருப்புவேன்’ என்ற எளிய எதிர்காலம்
  rationale: எபிரெய வினைவடிவங்கள் எளிய எதிர்காலமாக மொழிபெயர்க்கப்படக்கூடியவை. எனினும், முந்தைய வசனத்தில் இஸ்ரவேல் தேவனுக்குச் செவிகொடுத்திருந்தால் அவர் செய்திருப்பதைப் பற்றிய நிபந்தனை உள்ளது. தமிழ் இறந்தகால நிபந்தனை வடிவம் அந்தச் சூழலைத் தெளிவாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டது. ‘என் கையைத் திருப்புதல்’ என்ற மூல மொழியின் உருவகம் தக்கவைக்கப்பட்டு, அதன் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது. இரு இணையான பகைவர் சொற்களுக்கிடையேயான சொல்வேறுபாடு ‘பகைவர்கள் / எதிரிகள்’ எனப் பாதுகாக்கப்பட்டது.
