lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைக் குழுத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கும். நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: עַל
  choice: முறைப்படி
  rationale: இங்கு இடப்பொருளைக் காட்டுவதைக் காட்டிலும் ஓர் இசைமுறை, இசைக்கருவி அல்லது மெட்டின் அடிப்படையில் பாடப்படுவதைக் குறிக்கலாம். அந்தத் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: הַגִּתִּית
  choice: கித்தீத்
  rationale: இச்சொல் ஓர் இசைக்கருவியையோ, இசைமுறையையோ, மெட்டின் பெயரையோ, காத் நகரத்துடன் தொடர்புடைய ஒன்றையோ குறிக்கலாம்; துல்லியமான பொருள் உறுதியற்றதால் விளக்கிப் பொருள் கட்டாயப்படுத்தாமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: לְאָסָף
  choice: ஆசாப்புக்கு உரியது
  rationale: தனிநபர் பெயருக்கு முன் வரும் ל ஆசிரியத்துவம், தொடர்பு, உடைமை அல்லது தொகுப்புச் சார்பைக் குறிக்கக்கூடும். «ஆசாப்புக்கு உரியது» இந்தத் தெளிவின்மையைப் பேணுகிறது.
