  text: 'For the choir director: according to the Gittith[a]. Of Asaph.'
translation:
  language: ta
  text: இசைக் குழுத் தலைவருக்கு; கித்தீத்[a] முறைப்படி. ஆசாப்புக்கு உரியது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் «கித்தீத்». இது ஓர் இசைமுறை, இசைக்கருவி அல்லது மெட்டின் பெயரைக் குறிக்கலாம்; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை. காத் நகரத்துடன் தொடர்புடைய ஓர் இசைக்கருவி அல்லது ஒரு குறிப்பிட்ட மெட்டு என்பதும் சாத்தியம்.
