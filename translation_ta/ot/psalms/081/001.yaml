  text: הַ֭רְנִינוּ לֵ/אלֹהִ֣ים עוּזֵּ֑/נוּ הָ֝רִ֗יעוּ לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/001.yaml
  text: Sing for joy to God[a], our strength; shout aloud to the God of Jacob.
translation:
  language: ta
  text: 'நம் வலிமையாகிய கடவுளை நோக்கி மகிழ்ந்து பாடுங்கள்;

    யாக்கோபின் கடவுளுக்கு ஆர்ப்பரியுங்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாக்கோபின் கடவுளுக்கு வெற்றிமுழக்கம் இடுங்கள்.” இவ்வினைச்சொல் உரத்த ஆரவாரத்தையோ எக்காள முழக்கம் போன்ற முழக்கத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: மகிழ்ந்து பாடுங்கள்
  rationale: רנן என்பதன் பன்மை ஏவல் வடிவம் மகிழ்ச்சி பொங்கும் குரல்வழிப் புகழ்ச்சியைக் குறிக்கிறது; தமிழில் இசையையும் களிப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֵאלֹהִים
  choice: கடவுளை
  rationale: ל இங்கு புகழ்ச்சியின் இலக்கைச் சுட்டுகிறது. சூழலில் אֱלֹהִים இஸ்ரவேலின் ஒரே கடவுளைக் குறிப்பதால் ஒருமைப் பொருள் தரப்பட்டுள்ளது.
- source_word: עוּזֵּנוּ
  choice: நம் வலிமையாகிய
  rationale: עוֹז என்பது வலிமை அல்லது ஆற்றலைக் குறிக்கிறது. 'நம் வலிமையாகிய கடவுள்' என்பது எபிரெய இணைப்பைப் பொருள்மாறாமல் இயல்பான தமிழில் தருகிறது.
- source_word: הָרִיעוּ
  choice: ஆர்ப்பரித்துப் போற்றுங்கள்
  rationale: רוע/ריע என்பதன் ஹிஃபில் பன்மை ஏவல் வடிவம் உரத்த வெற்றி முழக்கம் அல்லது கொண்டாட்ட ஆரவாரத்தைக் குறிக்கலாம்; இங்கு புகழ்ச்சிச் சூழலைத் தெளிவுபடுத்த 'போற்றுங்கள்' சேர்க்கப்பட்டுள்ளது.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: யாக்கோபின் கடவுளை
  rationale: எபிரெய கட்டமைப்பு 'யாக்கோபின் கடவுள்' என்று உறவைச் சுட்டுகிறது; prefixed ל புகழ்ச்சியின் இலக்கைத் தருவதால் தமிழில் வேற்றுமை உருபுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: இரு இணைவரிகளிலும் אֱלֹהִים என்பதன் எண்
  choice: கடவுள் / யாக்கோபின் கடவுள்
  alternative: தெய்வங்கள்
  rationale: வடிவத்தில் பன்மை தோற்றம் இருந்தாலும், உடன்படிக்கைச் சூழலும் 'யாக்கோபின் கடவுள்' என்ற இணைவரியும் ஒருமையான இஸ்ரவேலின் கடவுளையே சுட்டுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளக்கூடிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரு பன்மை ஏவல்களும் பாதுகாக்கப்பட்டுள்ளன; இரண்டாம் வினையின் ஒலி மற்றும் கொண்டாட்டத் தன்மை அடிக்குறிப்பில் விரிவுபடுத்தப்பட்டுள்ளது.
