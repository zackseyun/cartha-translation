  text: 'He made it a testimony in Joseph when he went out over the land of Egypt[c][b][a]. I heard a language I had not known:'
translation:
  language: ta
  text: 'அதை யோசேப்பினிடத்தில் ஒரு சாட்சியாக அவர் நிறுவினார்[a];


    அவர் எகிப்து நாட்டின்மேல் புறப்பட்டுச் சென்றபோது[b],


    “எனக்குத் தெரியாத ஒரு மொழியை நான் கேட்டேன்[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் எழுத்துப்படி ‘யோசேப்பில்.’ இங்கு ‘யோசேப்பு’ என்பது யாத்திராகமச் சூழலில் இஸ்ரயேல் மக்களைக் கூட்டாகக் குறிக்கலாம்; இருந்தாலும் மூலப் பெயர் தக்கவைக்கப்பட்டுள்ளது.
    reason: cross_reference
  - marker: b
    text: அல்லது, ‘எகிப்து நாட்டுக்கு எதிராக அவர் புறப்பட்டுச் சென்றபோது.’ இச்சூழலில் எபிரெய முன்னிடைச்சொல் ‘மேல்’ அல்லது ‘எதிராக’ என்ற இரு பொருள்களையும் தரக்கூடும்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘எனக்குத் தெரியாத ஒரு மொழியை நான் கேட்கிறேன்.’ கவிதைச் சூழலில் எபிரெய வினையை நிகழ்காலமாகவும் கடந்தகாலமாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵדוּת
  choice: சாட்சி
  rationale: இந்தப் பெயர்ச்சொல் சான்று அல்லது சாட்சியைக் குறிக்கிறது; வழிபாட்டு/சட்டச் சூழலில் நிறுவப்பட்ட நியமத்தையும் குறிக்கலாம். மூலச்சொல்லின் அடிப்படைப் பொருளையும் இச்சங்கீதத்தின் சூழலையும் காக்க ‘சாட்சி’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: בִּיהוֹסֵף
  choice: யோசேப்பின் நடுவே
  rationale: בְּ என்பதன் ‘இல்/உள்ளே’ என்ற பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘யோசேப்பு’ என்ற பெயர் மாற்றப்படாமல் வைக்கப்படுகிறது; இங்கு அது கூட்டாக மக்களைக் குறிக்கலாம்.
- source_word: שָׂמוֹ
  choice: அதை ... நிறுவினார்
  rationale: שׂים என்பது வைக்க, ஏற்படுத்த, நியமிக்க என்பதைக் குறிக்கும். சாட்சியுடன் இணையும் இச்சூழலில் ‘நிறுவினார்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது.
- source_word: בְּצֵאתוֹ
  choice: அவர் ... புறப்பட்டுச் சென்றபோது
  rationale: בְּ இணைந்த வினையெச்ச வடிவம் காலப்பொருளில் ‘புறப்பட்டபோது’ என வருகிறது. ஆண்பால் ஒருமைச் சுட்டின் குறிப்பிட்ட நபரை விளக்கிச் சேர்க்காமல் ‘அவர்’ என்று வைக்கப்பட்டுள்ளது.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: எகிப்து நாட்டின்மேல்
  rationale: עַל என்பதன் ‘மேல்/மீது’ என்ற விரிந்த பொருளை முதன்மை உரை காக்கிறது; யாத்திராகமத் தீர்ப்புச் சூழலில் ‘எதிராக’ என்பதும் சாத்தியமானதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שְׂפַת
  choice: ஒரு மொழி
  rationale: சொல்லுக்கு நேரடியாக ‘உதடு’ என்று பொருள் இருந்தாலும், இங்கு அது பேச்சு அல்லது மொழியைக் குறிக்கும் மரபுத்தொடராக உள்ளது.
- source_word: לֹא יָדַעְתִּי
  choice: எனக்குத் தெரியாத
  rationale: கடந்தகால அறியாமையை இயல்பான தமிழில் தெரிவிக்கிறது; ‘நான் அறிந்திராத’ என்பதும் சாத்தியம்.
- source_word: אֶשְׁמָע
  choice: நான் கேட்டேன்
  rationale: வடிவம் முற்றுப்பெறாத வினையாக இருந்தாலும், கவிதை நினைவுகூரும் சூழலில் கடந்தகாலமாகப் புரிந்துகொள்ளலாம். நிகழ்கால வாசிப்பும் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: ‘யோசேப்பு’ என்பதன் குறிப்பு
  choice: மூலத்தில் உள்ள ‘யோசேப்பு’ என்ற பெயரைத் தக்கவைத்து, கூட்டுப் பொருளை ‘நடுவே’ என்ற சொல்லால் இயல்பாக வெளிப்படுத்துதல்
  alternative: அதை நேரடியாக ‘இஸ்ரயேல்’ என்றோ, குறுகிய பொருளில் வடக்குக் கோத்திரங்கள்/எப்பிராயீம் என்றோ மொழிபெயர்த்தல்
  rationale: எபிரெய உரை யோசேப்பை வெளிப்படையாகப் பெயரிடுகிறது. அது யாத்திராகமச் சூழலில் உடன்படிக்கை மக்களைக் குறிக்கும் ஆகுபெயராக இருக்கலாம்; ஆனால் அந்த விளக்கத்தை முதன்மை உரையில் உறுதியாக்காமல் பெயர் காக்கப்படுகிறது.
- issue: בְּצֵאתוֹ என்பதிலுள்ள ‘அவர்’ யாரைக் குறிக்கிறது
  choice: ‘அவர்’ என்ற சுட்டை விளக்கமின்றித் தக்கவைத்தல்
  alternative: தேவன் அல்லது யோசேப்பு/இஸ்ரயேல் என்று வெளிப்படையாகப் பெயரிடுதல்
  rationale: எபிரெய ஆண்பால் ஒருமைச் சுட்டின் குறிப்பு விவாதத்திற்குரியது. கூடுதல் பெயரைச் சேர்க்காமல் மூலத்தின் தெளிவின்மை காக்கப்படுகிறது.
- issue: இரண்டாம் பகுதியின் முதல் நபர் பேச்சு
  choice: ‘எனக்குத் தெரியாத ஒரு மொழியை நான் கேட்டேன்’ என்று முதல் நபர் மாற்றத்தை அப்படியே வைத்தல்
  alternative: பேசுபவர் சங்கீதக்காரர் அல்லது தேவன் என்று உரையில் வெளிப்படையாகச் சேர்த்தல்
  rationale: சுற்றியுள்ள பாடல் தேவனுடைய முதல் நபர் பேச்சுக்குள் நகர்கிறது; எனினும் இவ்வரியே பேசுபவரைப் பெயரிடவில்லை. ஆகவே கவிதைத் திருப்பமும் இறையியல் நெருக்கடியும் விளக்கமின்றிக் காக்கப்படுகின்றன.
