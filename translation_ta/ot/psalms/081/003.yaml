  yaml_path: translation/ot/psalms/081/003.yaml
  text: Blow the trumpet at the new moon[a], at the full moon, on the day of our feast.
translation:
  language: ta
  text: 'அமாவாசையில் கொம்பை ஊதுங்கள்;

    எங்கள் பண்டிகை நாளான பௌர்ணமியில்[a] அதை ஊதுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிலவு மறைந்திருக்கும் வேளையில்” அல்லது “குறிக்கப்பட்ட காலத்தில்.” כֵּסֶה என்ற எபிரெயச் சொல்லின் பொருள் விவாதத்திற்குரியது. ‘அமாவாசை’ என்பதுடன் காணப்படும் கால அட்டவணை இணைநிலைக்கும் பண்டிகைச் சூழலுக்கும் பொருந்துவதால் இங்கே ‘பௌர்ணமி’ என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: ஊதுங்கள்
  rationale: תקע என்பதன் பன்மை ஏவல் வடிவம், שׁוֹפָר என்னும் கொம்பை ஒலிக்கச் செய்வதைக் குறிக்கிறது; தமிழில் ‘கொம்பை ஊதுங்கள்’ என்பது இயல்பாகவும் ஏவல் வலிமையைத் தக்கவைத்தும் உள்ளது.
- source_word: בַחֹדֶשׁ
  choice: அமாவாசையில்
  rationale: חֹדֶשׁ என்பதற்கு ‘மாதம்’ அல்லது ‘புதுநிலவு’ என்று பொருள் வரலாம். பண்டிகைக் கால அட்டவணைச் சூழலிலும் כֵּסֶה உடனான இணைப்பிலும், நிலவு தென்படாத புதுநிலவு நாளைக் குறிக்கும் ‘அமாவாசை’ இயல்பான நவீனத் தமிழ்ச் சொல்.
- source_word: שׁוֹפָר
  choice: கொம்பை
  rationale: שׁוֹפָר வழிபாட்டு மற்றும் அறிவிப்புப் பயன்பாட்டுக்கான விலங்குக் கொம்பைக் குறிக்கிறது. ‘கொம்பு’ மூலப் பொருளைத் தெளிவாகத் தருகிறது; ‘எக்காளம்’ உலோக இசைக்கருவி என்ற தவறான எண்ணத்தைத் தரக்கூடும்.
- source_word: בַכֵּסֶה
  choice: பௌர்ணமியில்
  rationale: כֵּסֶה விவாதத்திற்குரிய சொல். חֹדֶשׁ உடனான கால அட்டவணை இணைநிலையில் ‘முழுநிலவு’ என்பது பொருத்தமான வாசிப்பு; சாதாரண தமிழில் அதற்கான தெளிவான காலக் குறிப்பு ‘பௌர்ணமி’.
- source_word: לְיוֹם
  choice: நாளான
  rationale: לְיוֹם இங்கு பண்டிகை நாளுடனான காலத் தொடர்பைச் சுட்டுகிறது. ‘எங்கள் பண்டிகை நாளான பௌர்ணமியில்’ என்ற அமைப்பு தமிழில் அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: חַגֵּנוּ
  choice: எங்கள் பண்டிகை
  rationale: חַגֵּנוּ என்பது ‘எங்கள் விழா/பண்டிகை’ எனப் பொருள்படும். ‘பண்டிகை’ கொண்டாட்டத்தையும் சமய நாளையும் பொதுவாகப் புரியும் நவீனத் தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: பண்டிகைக் காலக் குறிப்பில் בַכֵּסֶה என்பதன் பொருள்
  choice: பௌர்ணமியில்
  alternative: ‘நிலவு மறைந்திருக்கும் வேளையில்’ அல்லது ‘குறிக்கப்பட்ட காலத்தில்’
  rationale: இது முதன்மையாகச் சொற்பொருள் மற்றும் சூழல் சார்ந்த முடிவு. ‘அமாவாசை’ என்பதுடன் அமைந்துள்ள கால அட்டவணை இணைநிலையும் பண்டிகைச் சூழலும் ‘பௌர்ணமி’ என்ற வாசிப்பை ஆதரிக்கின்றன. ஆயினும் எபிரெயச் சொல்லின் பொருள் உறுதியற்றதால் மற்ற வாசிப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் உடனே புரிந்துகொள்ளும் வகையில் ‘அமாவாசை’, ‘பௌர்ணமி’, ‘பண்டிகை’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயக் கவிதையின் இரண்டு காலக் குறிப்புகளும் இணையான வரிகளாக வைக்கப்பட்டுள்ளன; தமிழில் தெளிவுக்காக இரண்டாம் வரியில் ‘அதை ஊதுங்கள்’ சேர்க்கப்பட்டுள்ளது.
