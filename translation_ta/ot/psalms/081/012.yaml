  text: וָֽ֭/אֲשַׁלְּחֵ/הוּ בִּ/שְׁרִיר֣וּת לִבָּ֑/ם יֵ֝לְכ֗וּ בְּֽ/מוֹעֲצוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/012.yaml
  text: So I gave them over to the stubbornness of their heart[c][b][a]; they walked in their own counsels.
translation:
  language: ta
  text: ஆகவே, அவர்கள் தங்களுடைய சொந்தத் திட்டங்களின்படி நடக்கும்படி, அவர்களுடைய இதயப் பிடிவாதத்திற்கே அவர்களை விட்டுவிட்டேன்.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், ‘அவனை விட்டுவிட்டேன்’ என்று ஒருமைச் சுட்டுப்பெயர் உள்ளது; அது இஸ்ரவேல் மக்களை ஒரே கூட்டு மக்களாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுடைய இதயத்தின் கடினத்தன்மைக்கே’ அல்லது ‘அவர்களுடைய இதயத்தின் தன்னிச்சையான பிடிவாதத்திற்கே.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘அவர்கள் தங்களுடைய சொந்த ஆலோசனைகளின்படி நடந்தார்கள்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲשַׁלְּחֵהוּ
  choice: அவர்களை விட்டுவிட்டேன்
  rationale: שלח என்பதன் ஹிஃபில் வடிவம் இச்சூழலில் நேரடியாக ‘அனுப்பினேன்’ என்பதைக் காட்டிலும், தங்கள் பிடிவாதத்தின் விளைவுகளுக்கு அவர்களை ஒப்புவித்து விட்டுவிடுதல் என்ற நியாயத்தீர்ப்புச் சார்ந்த பொருளைத் தருகிறது. எபிரெயச் சொல்லிலுள்ள ஒருமைச் சுட்டுப்பெயர் கூட்டுமொத்தமான இஸ்ரவேலைக் குறிக்கிறது; இயல்பான தமிழுக்காக முதன்மை உரையில் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: בִּשְׁרִירוּת
  choice: பிடிவாதத்திற்கே
  rationale: שְׁרִירוּת என்பது உள்ளத்தின் கடினத்தன்மை, அடங்காமை, தன்னிச்சையான பிடிவாதம் ஆகியவற்றைக் குறிக்கிறது. ‘பிடிவாதம்’ நவீனத் தமிழில் தெளிவாகவும் இயல்பாகவும் அந்த ஒழுக்கப் பொருளை வெளிப்படுத்துகிறது; ‘-க்கே’ அவர்கள் விரும்பிய அதே மனப்போக்குக்கு விடப்பட்டதை வலியுறுத்துகிறது.
- source_word: לִבָּם
  choice: அவர்களுடைய இதயத்தின்
  rationale: எபிரெயத்தில் ‘இதயம்’ ஒருமையில் இருந்து, பன்மைக் குழுவின் கூட்டு உள்ளார்ந்த மனநிலையைக் குறிக்கிறது. தமிழிலும் இந்தக் கூட்டு ஒருமையை இயல்பாகத் தக்கவைக்க முடிகிறது.
- source_word: יֵלְכוּ
  choice: நடந்தார்கள்
  rationale: הלך என்பது நடத்தை அல்லது வாழ்வுப்போக்கைக் குறிக்கும் உருவகப் பயன்பாட்டில் ‘நடத்தல்’ என்று பொருள்படும். முந்தைய வினையுடன் தொடரும் விளைவை இயல்பான தமிழ் இறந்தகாலத்தில் இச்சொல் தருகிறது.
- source_word: בְּמוֹעֲצוֹתֵיהֶם
  choice: தங்களுடைய சொந்தத் திட்டங்களின்படி
  rationale: מוֹעֵצָה என்பது ஆலோசனை, திட்டம் அல்லது தீர்மானித்த நோக்கம் எனப் பொருள்படும். இங்கு கடவுளுடைய வழிக்கு மாறாக அவர்களே வகுத்துக்கொண்ட வழிமுறைகளை ‘சொந்தத் திட்டங்கள்’ தெளிவாகக் காட்டுகிறது.
theological_decisions:
- issue: முதல் உட்பிரிவிலுள்ள ஒருமைச் சுட்டுப்பெயருக்கும் பின்னுள்ள பன்மை வடிவங்களுக்கும் இடையிலான எண் மாற்றம்
  choice: முதன்மைத் தமிழ் உரையில் பன்மையாக இயல்பாக்கி, எபிரெய ஒருமையை அடிக்குறிப்பில் பதிவு செய்தல்
  alternative: ‘அவனை விட்டுவிட்டேன்; அவர்கள்...’ என்று எபிரெய எண்ணிக்கை மாற்றத்தை நேரடியாக வைத்தல்
  rationale: எபிரெய ஒருமை இஸ்ரவேலை ஒரே கூட்டு மக்களாகக் குறிக்கிறது; உடனடி சூழல் இல்லாத தனி வசனத்தில் ‘அவனை’ என்பது தமிழில் வேறொரு ஆண் நபரைக் குறிக்கும் தவறான எண்ணத்தை ஏற்படுத்தலாம். பன்மை பொருளைத் துல்லியமாகத் தருகிறது; அடிக்குறிப்பு மூலத்தின் உண்மையான வடிவத்தை மறைக்காமல் பாதுகாக்கிறது.
- issue: கடவுளின் செயலில் உள்ள நியாயத்தீர்ப்புச் சார்ந்த ஒப்புவித்தல்
  choice: ‘விட்டுவிட்டேன்’
  alternative: ‘அனுப்பிவிட்டேன்’ அல்லது ‘போக அனுமதித்தேன்’
  rationale: இச்சூழலில் கடவுள் கீழ்ப்படியாத மக்களை அவர்களுடைய உள்ளார்ந்த பிடிவாதத்திற்கே ஒப்புவிப்பதே கருத்து. ‘விட்டுவிட்டேன்’ அந்தக் கடுமையை வெளிப்படுத்துகிறது; ஆனால் பிற்கால இறையியல் சொற்களை வசனத்திற்குள் இறக்குமதி செய்யவில்லை.
- issue: יֵלְכוּ என்பதன் காலம் மற்றும் நுணுக்கம்
  choice: தொடர்ச்சியான விளைவாக ‘நடந்தார்கள்’
  alternative: ‘நடப்பார்கள்’ அல்லது ‘நடக்கும்படி விட்டார்’
  rationale: வடிவம் நிறைவுறாத செயலைக் குறிக்கக்கூடியது; எனினும் முந்தைய கதை வினைக்குப் பின், அவர்கள் தங்கள் திட்டங்களின்படி சென்ற விளைவை இறந்தகாலத் தமிழ் இயல்பாக வெளிப்படுத்துகிறது. மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தரத் தமிழ்; மரியாதைமிக்க வேதாகம நடையையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கிறது. ‘இதயம்’ என்ற கூட்டு ஒருமை மூல மொழியின் உருவகத்தைத் தக்கவைக்கிறது; ‘சொந்தத் திட்டங்கள்’ அரிதான அல்லது பழமையான சொல்லாட்சியைத் தவிர்க்கிறது.
