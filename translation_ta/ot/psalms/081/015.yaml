revisions:
- from: யெகோவாவை வெறுப்பவர்கள் அவர்முன் போலியாகப் பணிந்திருப்பார்கள்[a]; அவர்களுடைய காலம் என்றென்றும் நீடித்திருக்கும்[b].
  to: யாவேவை வெறுப்பவர்கள் அவருக்குப் பொய்யாகப் பணிவார்கள்[a]; அவர்களுடைய காலம் என்றென்றும் நீடிக்கும்[b].
  rationale: The revision aligns the divine name with the Yahweh-based audit trail, uses natural simple-future Tamil for the Hebrew imperfect sequence, and leaves the final clause lexically open. The alternatives for compelled, false, or cringing submission and for the meaning of 'their time' remain available in the footnotes.
