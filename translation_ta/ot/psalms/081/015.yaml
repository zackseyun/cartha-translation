source:
  edition: WLC
  text: מְשַׂנְאֵ֣י יְ֭הוָה יְכַֽחֲשׁוּ ל֑/וֹ וִ/יהִ֖י עִתָּ֣/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/015.yaml
  text: Those who hate Yahweh would cringe before him[b][a], and their time would be forever.
translation:
  language: ta
  text: யாவேவை வெறுப்பவர்கள் அவருக்குப் பொய்யாகப் பணிவார்கள்[a]; அவர்களுடைய காலம் என்றென்றும் நீடிக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருக்குப் பொய்யாகக் கீழ்ப்படிவார்கள்,” “அவருக்குக் கீழ்ப்படிவதுபோல் நடிப்பார்கள்,” அல்லது “அவர்முன் அஞ்சி ஒடுங்குவார்கள்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “அவர்களுடைய காலம் என்றென்றும்.” இது அவர்களுக்குக் குறிக்கப்பட்ட காலம், அவர்களுடைய விதி, அல்லது அவர்களுடைய தண்டனை முடிவின்றித் தொடரும் என்று பொருள்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׂנְאֵי
  choice: வெறுப்பவர்கள்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் எபிரெயப் பங்கேற்புவினையை இயல்பான நவீனத் தமிழில் தருகிறது; தொடர்ந்து வெறுக்கும் குழுவையும் குறிக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தேவனுடைய தனிப்பெயரைத் தமிழில் பரவலாக அறியப்பட்ட வடிவில் ஒலிபெயர்க்கிறது; பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றவில்லை.
- source_word: יְכַחֲשׁוּ לוֹ
  choice: அவர்முன் போலியாகப் பணிந்திருப்பார்கள்
  rationale: כחשׁ என்பதன் பியேல் வடிவம் ל உடன் வரும்போது பொய்யான அல்லது கட்டாயப்படுத்தப்பட்ட கீழ்ப்படிதலைக் குறிக்கலாம். ‘போலியாகப் பணிதல்’ உண்மையற்ற கீழ்ப்படிதலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ‘அஞ்சி ஒடுங்குதல்’ என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וִיהִי
  choice: நீடித்திருக்கும்
  rationale: கவிதைத் தொடரிலுள்ள வினைவடிவத்தை நிபந்தனைச் சூழலுக்கு ஏற்ற எதிர்காலத் தொடர்ச்சியாகத் தமிழில் இயல்பாக வழங்குகிறது.
- source_word: עִתָּם
  choice: அவர்களுடைய காலம்
  rationale: עת என்பதன் அடிப்படைப் பொருளான ‘காலம்/வேளை’ என்பதைக் காக்கிறது; விதி அல்லது தண்டனை என்று குறிப்பாக்காமல் மூலத்தின் சுருக்கமான தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: கவிதைச் சூழலில் காலவரையற்ற நீடிப்பைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: וִיהִי עִתָּם לְעוֹלָם என்ற இறுதிக் கூற்றின் பொருள்
  choice: அவர்களுடைய காலம் என்றென்றும் நீடித்திருக்கும்
  alternative: அவர்களுடைய தண்டனை என்றென்றும் நீடிக்கும்; அல்லது அவர்களுக்குக் குறிக்கப்பட்ட நிலை என்றென்றும் இருக்கும்
  rationale: சூழல் யெகோவாவின் பகைவர்களுக்கு எதிரான தீர்ப்பைச் சுட்டினாலும், எபிரெயச் சொல் நேரடியாக ‘காலம்’ என்றே கூறுகிறது. ஆகவே உரை கூறாத குறிப்பிட்ட தண்டனைக் கோட்பாட்டைச் சேர்க்காமல் அதன் இறையியல் பதற்றமும் பொருள் தெளிவின்மையும் காக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைக்குரிய கண்ணியமும் மூலத்தின் சுருக்கமும் காக்கப்பட்டுள்ளன. அரிதான சொற்கள் தவிர்க்கப்பட்டு, உண்மையற்ற பணிதல் மற்றும் இறுதிக் கூற்றின் தெளிவின்மை அடிக்குறிப்புகளால் விளக்கப்பட்டுள்ளன.
