  text: Hear[a], my people, and I will testify against you; O Israel[b], if you would listen to me!
translation:
  language: ta
  text: என் மக்களே, கேளுங்கள்[a]; நான் உங்களுக்கு எதிராகச் சாட்சியளிப்பேன், இஸ்ரவேலே—நீ எனக்குச் செவிகொடுத்தால் நலமாயிருக்கும்![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் உங்களை எச்சரிப்பேன்,” அல்லது “நான் உங்களுக்குச் சாட்சியளிப்பேன்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தை ஓர் ஏக்க விருப்பமாக இன்னும் வெளிப்படையாக, “ஆ, நீ எனக்குச் செவிகொடுத்தால்!” என்றும் மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: கேளுங்கள்
  rationale: இது எபிரெயத்தில் இரண்டாம் நபர் ஆண்பால் ஒருமை ஏவல் வடிவம். தமிழில் ஒரு மக்கள்கூட்டத்தை மரியாதையுடனும் இயல்பாகவும் நேரடியாக அழைக்கப் பன்மை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: עַמִּי
  choice: என் மக்களே
  rationale: உடன்படிக்கை உறவையும் நேரடி விளிப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאָעִידָה בָּךְ
  choice: நான் உங்களுக்கு எதிராகச் சாட்சி கூறுவேன்
  rationale: עוד என்பதன் ஹிஃபில் வடிவம் ‘சாட்சி கூறுதல்’ அல்லது ‘கடுமையாக எச்சரித்தல்’ எனப் பொருள்படலாம்; בְּ இங்கு எதிர்நிலை அல்லது நீதிமன்றச் சாயலைக் கொண்டிருக்கக்கூடும். முதன்மை உரை அந்தச் சாயலைப் பாதுகாக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேலே
  rationale: நேரடி விளிப்பைத் தமிழின் விளிவேற்றுமை வடிவில் இயல்பாகக் காட்டுகிறது.
- source_word: אִם תִּשְׁמַע לִי
  choice: நீ எனக்குச் செவிகொடுத்தால் நலமாயிருக்கும்
  rationale: אִם என்பதன் நிபந்தனை வடிவத்தையும் இச்சை அல்லது ஏக்கச் சாயலையும் ஒன்றாகத் தாங்கும் இயல்பான தமிழ் வடிவம். שׁמע + לְ வெறுமனே ஒலி கேட்பதைவிடக் கவனித்து ஏற்றுக்கொள்வதைக் குறிக்கிறது.
theological_decisions:
- issue: אִם תִּשְׁמַע לִי என்ற இறுதிக் கூற்றின் வலிமை
  choice: நிபந்தனை வடிவத்துடன் ஏக்கத்தை உணர்த்தும் ‘நீ எனக்குச் செவிகொடுத்தால் நலமாயிருக்கும்!’
  alternative: ‘ஆ, நீ எனக்குச் செவிகொடுத்தால்!’ அல்லது முறையாக ‘நீ எனக்குச் செவிகொடுத்தால்’
  rationale: אִם கவிதைச் சூழலில் விருப்பத்தையோ ஏக்கத்தையோ வெளிப்படுத்தலாம். தேர்ந்த வடிவம் அதை வெறும் நிபந்தனையாகச் சுருக்காமல், எபிரெயச் சொல்லமைப்புடனான தொடர்பையும் காக்கிறது.
- issue: וְאָעִידָה בָּךְ என்பதிலுள்ள சாட்சியின் நோக்கு
  choice: ‘உங்களுக்கு எதிராகச் சாட்சி கூறுவேன்’
  alternative: ‘உங்களை எச்சரிப்பேன்’ அல்லது ‘உங்களுக்குச் சாட்சி கூறுவேன்’
  rationale: வினைச்சொல்லும் בְּ முன்னிடைச்சொல்லும் இச்சூழலில் நீதிமன்ற அல்லது கண்டனச் சாயலை அனுமதிக்கின்றன; இருப்பினும் பிற பொருள் வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை. ‘கேளுங்கள்’ மற்றும் ‘செவிகொடுத்தால்’ மூலம் שׁמע வேரின் மீளுரையைச் சொற்சொல்லாக அல்லாமல், முதல் அழைப்புக்கும் பின்னைய கீழ்ப்படிதல் சார்ந்த வேண்டுகோளுக்கும் ஏற்றவாறு வேறுபடுத்திக் காட்டுகிறது.
