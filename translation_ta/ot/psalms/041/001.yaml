  text: אַ֭שְׁרֵי מַשְׂכִּ֣יל אֶל דָּ֑ל בְּ/י֥וֹם רָ֝עָ֗ה יְֽמַלְּטֵ֥/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[c][b][a]; in the day of trouble Yahweh will deliver him.
translation:
  language: ta
  text: நலிவுற்றவரைக்[b] கருத்தில் கொள்கிறவர்[a] பேறுபெற்றவர்; துன்ப நாளில்[c] யாவே அவரை விடுவிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நலிவுற்றவரிடம் ஞானத்துடன் நடந்துகொள்கிறவர்.” எபிரெய வினைச்சொல் சிந்தனையோடும் விவேகத்தோடும் கவனம் செலுத்துதல் அல்லது நடந்துகொள்ளுதல் என்ற பொருளைக் கொண்டிருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பலவீனமானவர்,” “ஏழை,” அல்லது “தேவையுள்ளவர்.”
    reason: lexical_alternative
  - marker: c
    text: சொல்லர்த்தமாக, “தீமையின் நாளில்.” இங்கு “தீமை” என்பது ஒழுக்கத் தீமையை அல்ல, துன்பம் அல்லது பேரிடரைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவர்
  rationale: எபிரெய மொழியின் வாழ்த்துரை வடிவத்தை இயல்பான, கண்ணியமான தமிழில் தெரிவிக்கிறது; வெறும் மனநிலையைக் குறிக்கும் “மகிழ்ச்சியானவர்” என்பதைவிட ஞானசங்கீதத்தின் தொனியை நன்றாகக் காக்கிறது.
- source_word: מַשְׂכִּיל אֶל
  choice: கருத்துடன் அக்கறை காட்டுகிறவர்
  rationale: שׂכל என்பதன் ஹிஃபில் வடிவம் அறிவோடும் விவேகத்தோடும் கவனம் செலுத்துதல் அல்லது நடந்துகொள்ளுதல் என்ற பொருளைக் கொண்டது. אֶל திசைநோக்கைக் காட்டுவதால், எளியவரின் நிலையைச் சிந்திப்பதோடு அவரிடம் அக்கறையுடன் நடந்துகொள்வதும் இச்சொற்றொடரில் அடங்குகிறது.
- source_word: דָּל
  choice: எளியவர்
  rationale: இச்சொல் ஏழை, பலவீனமானவர், ஆதரவற்றவர் அல்லது சமூகத்தில் தாழ்நிலையில் இருப்பவர் ஆகிய பொருள் பரப்பைக் கொண்டது. “எளியவர்” அந்தப் பரந்த பாதிப்புக்குள்ளாகும் நிலையைக் காக்கும் இயல்பான தமிழ்ச் சொல்.
- source_word: בְּיוֹם רָעָה
  choice: துன்ப நாளில்
  rationale: இங்கு רָעָה ஒழுக்கத் தீமையை அல்ல, கேடு, இடர் அல்லது பேரிடர் நேரும் காலத்தைக் குறிக்கிறது. “துன்ப நாள்” இந்தச் சூழ்நிலைப் பொருளைத் தெளிவாகத் தருகிறது.
- source_word: יְמַלְּטֵהוּ
  choice: அவரை விடுவிப்பார்
  rationale: מלט என்பதன் பியேல் வடிவம் ஆபத்திலிருந்து மீட்பதையோ தப்புவிப்பதையோ குறிக்கிறது. “விடுவிப்பார்” வாக்குறுதியின் வலிமையைக் காக்கும் இயல்பான தமிழ்.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
theological_decisions:
- issue: வாக்குறுதியில் வரும் ஒருமை ஆண்பால் குறிப்பு
  choice: பிரதிநிதித்துவ ஒருமையை “காட்டுகிறவர் … அவரை” என்று காத்தல்
  alternative: “காட்டுகிறவர்கள் … அவர்களை” என்று பன்மையாக்குதல் அல்லது “அவனை” என்று வெளிப்படையான ஆண்பால் வடிவம் பயன்படுத்துதல்
  rationale: எபிரெயம் ஒருமை நபரையும் ஆண்பால் ஒருமை பின்னொட்டையும் பயன்படுத்துகிறது. தமிழ் “அவர்/அவரை” ஒருமையை இயல்பாகக் காக்கிறது; அதேவேளை சூழலில் தேவையற்ற ஆண்-மட்டும் என்ற பொருளைச் சேர்ப்பதில்லை.
- issue: வாழ்த்துரையில் உள்ள விடுதலை வாக்குறுதியின் தன்மை
  choice: வாக்குறுதியை விரிவாக்காமலும் மெலிதாக்காமலும் நேரடியாகக் கூறுதல்
  alternative: இதைக் கட்டாயமான செழிப்பு உத்தரவாதமாக விளக்குதல் அல்லது வெறும் பொதுவான வாய்ப்பாக மெலிதாக்குதல்
  rationale: சங்கீதம் யாவேயின் விடுதலையை ஞானவாழ்த்துரை வடிவில் உறுதியாகச் சொல்கிறது. மொழிபெயர்ப்பு அதன் வலிமையையும் இலக்கியத் திரட்சியையும் அப்படியே விடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான சங்கீதத் தொனி காக்கப்பட்டுள்ளது. “பேறுபெற்றவர்” வாழ்த்துரையின் எடையைத் தருகிறது; “கருத்துடன் அக்கறை காட்டுதல்” அறிவார்ந்த கவனத்தையும் செயற்படும் பரிவையும் இணைக்கிறது. தெய்வீகப் பெயர் “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
