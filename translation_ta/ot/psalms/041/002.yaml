  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will keep him and preserve his life[a]; he will be blessed in the land[d][c][b], and may you not give him over to the desire of his enemies.
translation:
  language: ta
  text: யாவே அவரைக் காப்பார்; அவரை உயிரோடு வைத்திருப்பார்[a]. நாட்டில் அவர் பேறுபெற்றவர் என்று அழைக்கப்படுவார்[b]. அவருடைய பகைவர்களின் விருப்பத்திற்கு அவரை ஒப்புக்கொடுக்காதிருப்பீராக[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவருடைய உயிரைப் பாதுகாப்பார்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நாட்டில் அவர் பேறுபெறுவார்.” எபிரெய வினைச்சொல் ‘பேறுபெற்றவர் என்று அழைக்கப்படுதல்’ அல்லது பொதுவாக ‘பேறுபெறுதல்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
  - marker: c
    text: எபிரெயத்தில், “அவருடைய பகைவர்களின் விருப்பத்திற்கு”; இதை “அவருடைய பகைவர்களின் சித்தத்திற்கு” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: יִשְׁמְרֵהוּ
  choice: அவரைக் காத்து
  rationale: שׁמר என்பதன் காத்தல், பாதுகாத்தல் என்ற பொருளை அடுத்த வினையுடன் இயல்பாக இணைக்கிறது.
- source_word: וִיחַיֵּהוּ
  choice: அவரை உயிரோடு வைத்திருப்பார்
  rationale: חיה என்பதன் காரணவினைப் பொருளான ‘உயிருடன் காத்தல்’ என்பதை நேரடியாகத் தருகிறது; ‘உயிர்ப்பிப்பார்’ என்ற வேறுபட்ட கருத்தைத் தவிர்க்கிறது.
- source_word: יאשר
  choice: பேறுபெற்றவர் எனப் போற்றப்படுவார்
  rationale: אשר என்பதில் உள்ள ‘பேறுபெற்றவர் என அழைத்தல்/போற்றுதல்’ என்ற அறிவிப்பு நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: בָּאָרֶץ
  choice: நாட்டில்
  rationale: אֶרֶץ என்பதன் இச்சூழலுக்கேற்ற ‘நாடு/தேசம்’ என்ற பொருளைத் தருகிறது; ‘பூமியில்’ என்பதைக் காட்டிலும் இயல்பானது.
- source_word: וְאַל תִּתְּנֵהוּ
  choice: அவரை ஒப்புக்கொடுக்காதிருப்பீராக
  rationale: இரண்டாம் நபரில் யாவேக்கு நேரடியாகச் சொல்லப்படும் வேண்டுதலையும் எதிர்மறை விருப்புநிலையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: בְּנֶפֶשׁ אֹיְבָיו
  choice: அவருடைய பகைவர்களின் விருப்பத்திற்கு
  rationale: נֶפֶשׁ இங்கு ‘ஆத்துமா’ என்பதல்லாமல் ஆசை, விருப்பம் அல்லது சித்தம் எனும் மொழிமரபுப் பொருளில் வருகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் அறிவிப்பிலிருந்து இரண்டாம் நபர் வேண்டுதலுக்கு ஏற்படும் மாற்றம்
  choice: முதல் இரு கூறுகளை யாவேயைப் பற்றிய நம்பிக்கையான அறிவிப்பாகவும், இறுதிக் கூறை அவரை நோக்கிய நேரடி வேண்டுதலாகவும் மொழிபெயர்த்தல்.
  alternative: முழு வசனத்தையும் மூன்றாம் நபர் அறிவிப்பாகத் தொடர்ந்து, ‘அவர் ஒப்புக்கொடுக்கமாட்டார்’ என்று மொழிபெயர்த்தல்.
  rationale: תִּתְּנֵהוּ இரண்டாம் ஆண்பால் ஒருமை வடிவம். ஆகவே எபிரெய உரையின் நபர் மாற்றத்தைச் சீராக்காமல் அப்படியே பாதுகாப்பது பொருத்தம்.
- issue: יאשר என்பதன் செயப்படுபொருள் சார்ந்த நுணுக்கம்
  choice: ‘பேறுபெற்றவர் எனப் போற்றப்படுவார்’ என்று மொழிபெயர்த்தல்.
  alternative: ‘அவர் பேறுபெறுவார்’ என்று நிலையை மட்டும் கூறுதல்.
  rationale: இந்த வடிவம் ஒருவர் பேறுபெற்றவர் என்று பிறரால் அறிவிக்கப்படுதல் அல்லது போற்றப்படுதல் என்ற சாத்தியமான நுணுக்கத்தை வெளிப்படுத்துகிறது; அதேவேளையில் அவருடைய பேறுபெற்ற நிலையும் மறையாது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘அவர்’ என்ற மரியாதை ஒருமை பயனாளியைக் குறிக்கிறது; இறுதியில் ‘ஒப்புக்கொடுக்காதிருப்பீராக’ என்பது யாவேக்கு உரிய மரியாதை ஒருமையையும் வேண்டுதலின் வலிமையையும் காட்டுகிறது. எபிரெயத்தின் திடீர் நபர் மாற்றம் வாக்கியப் பிரிப்பின் மூலம் இயல்பாகவும் வெளிப்படையாகவும் வைக்கப்பட்டுள்ளது.
