  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘சாவான்’ என்பது பகைவர்களின் கடுமையான நேரடிப் பேச்சை மறைக்காமல் வழங்குகிறது. அடிக்குறிப்பு குறிகள் [a], [b] பிரதான உரையில் முறையாக இடம்பெற்றுள்ளன.
