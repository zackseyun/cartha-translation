  edition: WLC
  text: אוֹיְבַ֗/י יֹאמְר֣וּ רַ֣ע לִ֑/י מָתַ֥י יָ֝מ֗וּת וְ/אָבַ֥ד שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/005.yaml
  text: 'My enemies say evil against me: “When will he die and his name perish?”[a][b]'
translation:
  language: ta
  text: 'என் பகைவர்கள் எனக்குத் தீமை பேசுகிறார்கள்[a]:


    “அவன் எப்போது சாவான்,

    அவன் பெயர் அழிந்துபோகும்?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைப் பற்றித் தீங்கானவற்றைப் பேசுகிறார்கள்.” எபிரெயச் சொற்றொடர் சங்கீதக்காரனுக்கு எதிராக ‘தீமை’ பேசுவதைச் சொல்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “பெயர் அழிந்துபோகும்” என்பது அவனுடைய பெயர் உச்சரிக்கப்படாமல் போவதை மட்டும் அல்லாமல், அவனுடைய புகழோ நினைவோ மறைந்துபோவதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹיְבַי
  choice: என் பகைவர்கள்
  rationale: பலவினைப் பெயர்ச்சொல்லுடன் முதலாம் நபர் ஒருமை உரிமை விகுதி உள்ளது; நவீனத் தமிழில் இயல்பாகவும் பகைமைத் தீவிரத்தைத் தக்கவைத்தும் அமைகிறது.
- source_word: יֹאמְרוּ
  choice: பேசுகிறார்கள்
  rationale: கவிதைச் சூழலில் இந்த முற்றுப்பெறா வினை நிகழ்கால அல்லது வழக்கமான செயலைக் குறிக்கலாம்; தொடர்ச்சியான பகைமைப் பேச்சை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: רַע לִי
  choice: எனக்கு எதிராகத் தீமையானவற்றை
  rationale: רַע என்பதன் ‘தீமை/தீங்கானது’ என்ற பொருளையும், לִי காட்டும் சங்கீதக்காரனை நோக்கிய பகைத் திசையையும் தக்கவைக்கிறது; இது அவரைப் பற்றிய தீங்கான பேச்சையும் உள்ளடக்கலாம்.
- source_word: מָתַי יָמוּת
  choice: அவன் எப்போது சாவான்?
  rationale: מָתַי என்பதன் நேரடியான ‘எப்போது’ என்ற வினாவையும், யாத்திரையற்ற எதிர்காலக் கருத்தையும் காக்கிறது. பகைவர்களின் விருப்பம் சூழலால் புலப்படுகிறது; கட்டளை அல்லது வேண்டுதலாக மிகைப்படுத்தப்படவில்லை.
- source_word: וְאָבַד שְׁמוֹ
  choice: அவனுடைய பெயர் எப்போது அழிந்துபோகும்?
  rationale: ‘பெயர்’ என்ற எபிரெயச் சொல்லை பிரதான உரையில் தக்கவைத்து, אבד என்பதற்கு இயல்பான ‘அழிந்துபோகும்’ பயன்படுத்தப்பட்டுள்ளது. முதல் ‘எப்போது’ இரு இணைந்த நிகழ்வுகளுக்கும் பொருந்துவதைத் தமிழில் தெளிவுபடுத்த மீண்டும் இடப்பட்டுள்ளது.
