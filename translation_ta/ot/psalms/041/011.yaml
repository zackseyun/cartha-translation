  text: בְּ/זֹ֣את יָ֭דַעְתִּי כִּֽי חָפַ֣צְתָּ בִּ֑/י כִּ֤י לֹֽא יָרִ֖יעַ אֹיְבִ֣/י עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/011.yaml
  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
translation:
  language: ta
  text: 'இதனால், நீர் என்னில் மகிழ்ச்சி கொள்கிறீர்[a] என்பதை நான் அறிகிறேன்: என் பகைவன் என்மேல் வெற்றி முழக்கம் இடுவதில்லை[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நீர் என்னில் பிரியமாயிருக்கிறீர்’ அல்லது ‘நீர் எனக்குச் சாதகமாக இருக்கிறீர்.’ எபிரெய வினைச்சொல் மகிழ்ச்சி அல்லது விருப்பம் கொள்வதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இன்னும் நேரடியாக, ‘என் பகைவன் என்மேல் வெற்றி ஆரவாரம் செய்வதில்லை.’ எபிரெய வினைச்சொல் முழக்கம் எழுப்புவதைக் குறிக்கிறது; இங்கு அது வெற்றி முழக்கமாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: இதனால்
  rationale: בְּ உடன் வரும் זֹאת, சங்கீதக்காரன் எதன் அடிப்படையில் அறிகிறான் என்பதைக் குறிக்கிறது; ‘இதனால்’ அந்தச் சான்றுசார் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: יָדַעְתִּי
  choice: நான் அறிந்துகொள்கிறேன்
  rationale: எபிரெயத்தில் நிறைவுவினை வடிவம் இருந்தாலும், இங்கு தற்போதுள்ள சான்றின் அடிப்படையிலான தற்போதைய அறிவைத் தெரிவிக்கிறது.
- source_word: חָפַצְתָּ בִּי
  choice: நீர் என்னில் மகிழ்கிறீர்
  rationale: חפץ என்பது மகிழ்ச்சி அல்லது விருப்பம் கொள்வதைக் குறிக்கிறது. இத்தேர்வு இறைவனுடைய மனமகிழ்ச்சியைத் தெரிவிக்கிறது; அதற்கான காரணத்தைப் பற்றிய மேலதிக இறையியல் கருத்தைச் சேர்ப்பதில்லை.
- source_word: כִּי ... כִּי
  choice: 'என்பதை ... :'
  rationale: முதல் כִּי அறியப்படும் செய்தியை அறிமுகப்படுத்துகிறது; இரண்டாவது כִּי அதற்கான சான்றை அல்லது காரணத்தை அறிமுகப்படுத்துகிறது. தமிழில் முக்காற்புள்ளிக்குப் பின் வரும் கூற்று அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא יָרִיעַ
  choice: வெற்றி முழக்கமிடுவதில்லை
  rationale: רוע என்பதன் ஹிபீல் வடிவம் இங்கு வெற்றியால் எழுப்பப்படும் ஆரவாரத்தைக் குறிக்கிறது. வெறும் ‘வெற்றிபெறுவதில்லை’ என்பதைக் காட்டிலும் ஒலிசார் உருவகத்தை இது காக்கிறது.
- source_word: אֹיְבִי
  choice: என் பகைவன்
  rationale: மூலத்தில் உள்ள ஒருமையையும் முதல் நபர் உடைமைப் பின்னொட்டையும் நேரடியாகக் காக்கிறது.
- source_word: עָלָי
  choice: என்னை வென்றதாக
  rationale: வெற்றி முழக்கத்தின் சூழலில் עַל என்பது சங்கீதக்காரன்மேல் பகைவன் வெற்றிகொண்டதாகக் களிகூர்வதைக் குறிக்கிறது; தமிழில் இயல்பாக இருக்கும்படி உறவை வெளிப்படையாகத் தருகிறது.
theological_decisions:
- issue: பகைவன் வெற்றிகொள்ளாதிருப்பது இறைவனுடைய மகிழ்ச்சிக்கான சான்றாகக் கொள்ளப்படுகிறதா?
  choice: பகைவன் வெற்றி முழக்கமிடாததை, இறைவன் தன்னில் மகிழ்கிறார் என்பதற்கான சான்றாகச் சங்கீதக்காரன் எடுத்துக்கொள்கிறான் என்று மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இதை இறைவனுக்கு முன்பாகத் தன் நீதியையோ முழுமையான நியாயத்தீர்ப்பையோ அறிவிக்கும் வலுவான கூற்றாக விரிவுபடுத்தலாம்.
  rationale: எபிரெய உரை இறைவனுடைய மகிழ்ச்சியையும் பகைவனின் தோல்வியையும் இணைக்கிறது; ஆனால் அந்த மகிழ்ச்சிக்கான அடிப்படையை விளக்குவதில்லை. ஆகவே மேலதிக தகுதி, நீதி, அல்லது இரட்சிப்பு சார்ந்த கோட்பாடு சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், இறைவனை நோக்கிய மரியாதை ஒருமையான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. வாக்கியத்தின் கவித்துவக் கண்ணியமும் காரண-சான்றுத் தொடர்பும் காக்கப்பட்டுள்ளன; கடினமான சொற்சார்பு தவிர்க்கப்பட்டுள்ளது.
