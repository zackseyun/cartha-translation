- issue: ‘என் נפש-ஐக் குணமாக்கும்’ என்பதன் பொருள் பரப்பு
  choice: என் உயிரைக் குணமாக்கும்
  alternative: என்னைக் குணமாக்கும்; என் ஆத்துமாவைக் குணமாக்கும்
  rationale: எபிரெயச் சொல் உயிர், தன்முழுமை, நபர் ஆகியவற்றைக் குறிக்கக்கூடும். இது உடல் குணமா அல்லது ஆன்மீக குணமா என்று வசனம் தீர்மானிக்காத அகலத்தையும் பதற்றத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் மரியாதையான இறைவேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உமக்கு’ மற்றும் வேண்டுதல் வினைமுற்றுகள் கண்ணியத்தைத் தருகின்றன; தேவையற்ற பழந்தமிழ் வடிவங்கள் தவிர்க்கப்பட்டுள்ளன.
