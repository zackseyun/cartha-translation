base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/006.yaml
  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
translation:
  language: ta
  text: அவன் என்னைப் பார்க்க வந்தால்[a], அவன் பொய்யைப் பேசுகிறான்; அவனுடைய இதயம் தனக்குள் தீமையைச் சேர்த்துக்கொள்கிறது; அவன் வெளியே போய்[b], அதைப் பேசுகிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் நேரடியாக ‘பார்க்க’ என்றுள்ளது; ‘என்னை’ என்பது சூழலால் உணரப்பட்டு, இயல்பான தமிழுக்காகச் சேர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியில் ‘வெளியே’ என்றுள்ளது; இது வீட்டுக்கு வெளியே அல்லது பொதுவெளிக்குச் செல்வதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: வந்தாலும்
  rationale: இந்தச் சூழலில் எதிரியின் வருகை நிகழ்ந்தபோதும் அவன் வஞ்சகமாக நடப்பதைச் சுட்டும் நிபந்தனைத் தொடர்; தமிழ் நடையில் ‘வந்தாலும்’ இயல்பாக இணைக்கிறது.
- source_word: בָּא לִרְאוֹת
  choice: என்னைப் பார்க்க வந்தாலும்
  rationale: לראות என்பதன் நேர்ப்பொருள் ‘பார்க்க’; அதன் செயப்படுபொருளான ‘என்னை’ சூழலால் உணரப்படுவதால் தமிழில் இயல்புக்காக வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: שָׁוְא
  choice: பொய்யையே
  rationale: இந்தச் சொல் வெறுமை, வீண் தன்மை, பொய், வஞ்சகம் ஆகிய பொருட்களை ஏற்கலாம்; பகைமையுள்ள பேச்சின் சூழலில் ‘பொய்’ முதன்மையான கருத்தைத் தெளிவாகத் தருகிறது.
- source_word: יְדַבֵּר
  choice: பேசுகிறான் / சொல்லிவிடுகிறான்
  rationale: முதல் இடத்தில் பொதுவான ‘பேசுகிறான்’ பயன்படுத்தப்பட்டுள்ளது; இரண்டாம் இடத்தில் உள்ளத்தில் சேர்த்த தீமையை வெளியே பரப்பும் இயல்பான தமிழ் கருத்துக்காக ‘அதைச் சொல்லிவிடுகிறான்’ என வழங்கப்பட்டுள்ளது.
- source_word: לִבּוֹ
  choice: அவனுடைய இதயம்
  rationale: எபிரெய மொழியில் உள்ளார்ந்த சிந்தனை, நோக்கம் ஆகியவற்றையும் குறிக்கும் ‘இதயம்’ என்ற உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יִקְבָּץ אָוֶן לוֹ
  choice: தனக்குள் தீமையைச் சேர்த்துக்கொள்கிறது
  rationale: קבץ என்பதன் ‘சேகரி/சேர்’ என்ற படிமத்தையும், און என்பதன் இச்சூழலுக்குரிய ஒழுக்கத் தீமை மற்றும் தீங்கான நோக்கம் ஆகியவற்றையும் காக்கிறது; לוֹ உள்ளார்ந்த திரட்டலைக் குறிக்க ‘தனக்குள்’ என வழங்கப்பட்டுள்ளது.
- source_word: יֵצֵא לַחוּץ
  choice: வெளியே சென்றதும்
  rationale: לחוץ என்பதன் நேரான பொருள் ‘வெளியே’; ‘தெருவுக்கு’ எனக் குறிப்பாக்காமல் மூலத்தின் பரந்த வெளிப்பாட்டைத் தக்கவைக்கிறது. செயல் தொடர்ச்சியைத் தமிழில் இயல்பாகக் காட்ட ‘சென்றதும்’ பயன்படுத்தப்பட்டுள்ளது.
