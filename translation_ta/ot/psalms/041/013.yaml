    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: போற்றப்படுவாராக
  rationale: இது இறைவனை வாழ்த்தும் வழிபாட்டுச் சூழலிலான செயல்பாட்டு வாய்பாடு. சொற்சொல்லான ‘ஆசீர்வதிக்கப்படுவாராக’ என்பதைவிட, ‘போற்றப்படுவாராக’ என்பது இயல்பான நவீனத் தமிழில் அதன் துதிப்பொருளையும் விருப்பவினைத் தொனியையும் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் நேரடியாக இடம்பெறும் இறைப் பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: இஸ்ரவேலின் கடவுளாகிய
  rationale: இணைப்புநிலைத் தொடரான ‘இஸ்ரவேலின் கடவுள்’ என்ற பொருளைத் தெளிவாகவும், யாவேயை அடையாளப்படுத்தும் தமிழ்த் தொடராகவும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: தொன்றுதொட்டு என்றென்றைக்கும்
  rationale: கடந்த காலத்தின் எட்டாத தொடக்கத்திலிருந்து முடிவில்லாத தொடர்ச்சி வரை என்னும் காலமுழுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; மூலத்தின் ‘இருந்து—வரை’ அமைப்புக்கான நெருக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אָמֵן וְאָמֵן
  choice: ஆமென், ஆமென்
  rationale: வழிபாட்டு உறுதிப்பாட்டை ஒலிபெயர்ப்பாக வைத்ததோடு, வலியுறுத்தும் இரட்டிப்பையும் சுருக்காமல் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: யெகோவா; ஆண்டவர்
  rationale: மூல உரை தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது உரைக்கு நெருக்கமானது.
- issue: מֵהָעוֹלָם וְעַד הָעוֹלָם என்பதன் காலப் பரப்பு
  choice: தொன்றுதொட்டு என்றென்றைக்கும்
  alternative: நித்தியத்திலிருந்து நித்தியம் வரை; காலங்காலமாக
  rationale: இந்தத் துதித் தொடரில் சொற்றொடர் எல்லையற்ற காலநீட்சியைச் சுட்டுகிறது. இயல்பான தமிழை முதன்மை உரையில் கொண்டு, மூல அமைப்பை அடிக்குறிப்பில் காட்டுவது பொருள் செறிவையும் தெளிவையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத நிறைவுத் துதிக்கேற்ற கண்ணியமான வழிபாட்டு நடையில் வடிவமைக்கப்பட்டது. ‘ஆமென்’ இருமுறை அப்படியே வைக்கப்பட்டுள்ளது; வாக்கியத்தின் துதித் தன்மையை உணர்த்த வியப்புக்குறி பயன்படுத்தப்பட்டுள்ளது.
