  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Amen and Amen.
translation:
  language: ta
  text: இஸ்ரவேலின் கடவுளாகிய யாவே தொன்றுதொட்டு என்றென்றைக்கும்[a] போற்றப்படுவாராக! ஆமென், ஆமென்.
  philosophy: optimal-equivalence
