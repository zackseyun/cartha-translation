  text: Together all who hate me whisper against me[b][a]; against me they devise evil for me.
translation:
  language: ta
  text: என்னை வெறுக்கிறவர்கள் அனைவரும் ஒன்றுகூடி எனக்கு எதிராகக் கிசுகிசுக்கிறார்கள்[a]; எனக்கு எதிராக, எனக்குத் தீங்கு விளைவிக்கத் திட்டமிடுகிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னைப்பற்றி”; இதற்கான எபிரெய முன்னிடைச்சொல் பகைமைத் திசையையோ பேச்சின் பொருளையோ குறிக்கலாம். இச்சூழலில் “எனக்கு எதிராக” என்பது சிறப்பாகப் பொருந்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எனக்குத் தீமையைத் திட்டமிடுகிறார்கள்,” “எனக்கு எதிராகத் தீங்கு வகுக்கிறார்கள்.” எபிரெயம் சிந்தித்தல் அல்லது திட்டமிடுதல் என்ற வினையுடன் “தீமை/தீங்கு” என்ற சொல்லை இணைத்து பகைமை நோக்கத்தை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: ஒன்றுகூடி
  rationale: பகைவர்கள் தனித்தனியாக அல்லாமல் ஒருமித்து செயல்படுவதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: இச்சூழலில் பேச்சின் பொருளை மட்டும் அல்லாமல் பகைமை நோக்கிய திசையையும் குறிக்கிறது; இரு இடங்களிலும் இதே பொருள் பொருந்துகிறது.
- source_word: יִתְלַחֲשׁוּ
  choice: கிசுகிசுக்கிறார்கள்
  rationale: தங்களுக்குள் தாழ்ந்த குரலில் இரகசியமாகப் பேசும் படிமத்தைப் பாதுகாக்கிறது; முறையான சதியைக் குறிப்பதாக அளவுக்கு மீறி விளக்கவில்லை.
- source_word: כָּל שֹׂנְאַי
  choice: என்னை வெறுக்கிறவர்கள் எல்லாரும்
  rationale: எபிரெயப் பங்கேற்புவினையின் தொடர்ச்சியான வெறுப்பை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יַחְשְׁבוּ
  choice: திட்டமிடுகிறார்கள்
  rationale: חשב என்பதன் சிந்தித்தல்/திட்டமிடுதல் பொருள்களில், தொடர்ந்து வரும் רָעָה மற்றும் பகைமைச் சூழலுக்கு திட்டமிடுதல் ஏற்றது.
- source_word: רָעָה
  choice: தீங்கு
  rationale: இங்கு பகைவர்கள் சங்கீதக்காரருக்கு ஏற்படுத்த நினைக்கும் கேட்டை இயல்பாகக் குறிக்கிறது; ‘தீமை’ என்பதும் சாத்தியம்.
- source_word: לִי
  choice: செய்ய
  rationale: தமிழில் ‘எனக்குத் தீங்கு செய்ய’ என்று நோக்குப் பொருளை இயல்பாக வெளிப்படுத்துகிறது; முன்னுள்ள ‘எனக்கு எதிராக’ என்பதையும் தேவையின்றி இரட்டிப்பதில்லை.
