id: PSA.41.12
reference: Psalms 41:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ֭/תֻמִּ/י תָּמַ֣כְתָּ בִּ֑/י וַ/תַּצִּיבֵ֖/נִי לְ/פָנֶ֣י/ךָ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/012.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
translation:
  language: ta
  text: ஆனால் நானோ, என் நேர்மையில்[a] நீர் என்னைத் தாங்கினீர்; என்றென்றும் உமது முன்னிலையில்[b] என்னை நிறுத்திவைத்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் குற்றமற்ற நிலையில்.” எபிரெயத்தை “என் நேர்மையின் காரணமாக” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “உமது முகத்திற்கு முன்பாக”; அதாவது, “உமது முன்னிலையில்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட சுட்டுப்பெயர், முந்தைய சூழலிலிருந்து ஒரு முரண்பாட்டுத் திருப்பத்தைக் காட்டுகிறது; ‘ஆனால் நானோ’ அதை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּתֻמִּי
  choice: என் நேர்மையில்
  rationale: תֹּם/תֻּם என்பதன் முழுமை, உத்தமம், குற்றமற்ற நடத்தை ஆகிய பொருள் வரம்பை ‘நேர்மை’ இயல்பாகக் காட்டுகிறது. இது முழுமையான பாவமின்மையை வலியுறுத்தாமல், בְּ முன்னிடைச்சொல்லின் தெளிவின்மையையும் ஓரளவு தக்கவைக்கிறது.
- source_word: תָּמַכְתָּ בִּי
  choice: நீர் என்னைத் தாங்கினீர்
  rationale: תמך உடன் בְּ என்பது ஒருவரை ஆதரித்தல் அல்லது உறுதியாகப் பற்றித் தாங்குதல் என்ற பொருளைக் கொடுக்கிறது; ‘தாங்கினீர்’ உறவு சார்ந்த ஆதரவையும் நிலைப்படுத்துதலையும் சுருக்கமாகத் தெரிவிக்கிறது.
- source_word: וַתַּצִּיבֵנִי
  choice: என்னை நிறுத்திவைத்தீர்
  rationale: נצב என்பதன் ஹிஃபில் வடிவம் நிறுத்துதல், ஓரிடத்தில் வைக்குதல், நிலைபெறச் செய்தல் ஆகியவற்றைக் குறிக்கிறது. ‘நிறுத்திவைத்தீர்’ நேரடியான இடநிறுத்தும் உருவகத்தையும் தொடர்ச்சியையும் காக்கிறது.
- source_word: לְפָנֶיךָ
  choice: உமது முன்னிலையில்
  rationale: சொல்லுக்குச் சொல் ‘உமது முகத்திற்கு முன்பாக’ என்றாலும், இந்த எபிரெய மரபுத்தொடர் ஒருவரின் பிரசன்னத்தில் இருப்பதைக் குறிக்கிறது; ‘உமது முன்னிலையில்’ நவீனத் தமிழில் தெளிவாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: עוֹלָם இங்கு முடிவற்ற அல்லது நீடித்த காலத்தைக் குறிக்கிறது; சங்கீத நடைக்கு ஏற்ற இயல்பான தமிழ் இணை ‘என்றென்றும்’ ஆகும்.
theological_decisions:
- issue: சங்கீதக்காரர் தமது תֻּם குறித்து கூறுவதன் பொருள்
  choice: இது சங்கீதக்காரரின் நேர்மை அல்லது உத்தம நடத்தையைச் சொல்கிறது; முழுமையான பாவமின்மையையோ தகுதியால் பெறப்படும் இறைத் தயவையோ வெளிப்படையாகக் கூறவில்லை.
  alternative: இது முழுமையான குற்றமின்மையை வலியுறுத்துகிறது, அல்லது ஒழுக்கப் பரிபூரணத்தால் இறைத் தயவு ஈட்டப்படுகிறது என்று வாசித்தல்.
  rationale: எபிரெயச் சொல் முழுமை, நேர்மை, குற்றமற்ற நடத்தை ஆகியவற்றைக் குறிக்கலாம். ‘நேர்மை’ என்று மொழிபெயர்ப்பது உரையின் ஒழுக்கக் கூற்றைக் காக்கிறது; அதே நேரம் பாவமற்ற பரிபூரணம் அல்லது சம்பாதித்த தகுதி போன்ற கோட்பாட்டை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான சங்கீத நடையைப் பயன்படுத்துகிறது. இறைவனைச் சுட்டும் இடங்களில் மரியாதைப் பன்மை கையாளப்பட்டுள்ளது. எபிரெயச் சொற்றொடரின் உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டு, முதன்மை உரையில் தெளிவான தமிழ் வழங்கப்பட்டுள்ளது.
