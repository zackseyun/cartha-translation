  source_fidelity: The Tamil faithfully represents the contrastive וַאֲנִי, the deliberately noncommittal בְּתֻמִּי as “என் நேர்மையில்,” divine support in תָּמַכְתָּ בִּי, placement/establishment before God, and the enduring force of לְעוֹלָם. It does not turn the psalmist’s integrity into a claim of absolute sinlessness or earned favor.
