lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசை இயக்குநருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கும் சொல். ‘இசை இயக்குநர்’ என்பது பழமையான அல்லது குறுகிய குழுப்பாடல் சார்ந்த சொல்லாட்சியைத் தவிர்த்து, அதன் பணியை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையுடன் பாடப்படும் பாடலைக் குறிக்கும் வழக்கமான வகைப்பெயர்; சங்கீத நூலின் தலைப்புச் சூழலில் மரபாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரெய முன்னொட்டு לְ இங்கு ஆசிரியத்துவம், தொடர்பு, உரிமை அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். தமிழின் உடைமை வேற்றுமை இந்தப் பொருள் விரிவை ஓரளவு திறந்தவாறே வைக்கிறது.
theological_decisions:
- issue: தாவீதுடன் சங்கீதத் தலைப்புக்கு உள்ள தொடர்பு
  choice: தாவீதின்
  alternative: ‘தாவீது இயற்றிய’ அல்லது ‘தாவீதுக்கான’
  rationale: மூலத்தின் לְדָוִד என்பது தாவீது நேரடியாக இயற்றினார் என்று மட்டும் உறுதிப்படுத்துவதில்லை; தொடர்பு அல்லது அர்ப்பணிப்பையும் குறிக்கலாம். ஆகவே முதன்மை உரை அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு இலக்கியத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இசை இயக்குநர்’ செயல்பாட்டைத் தெளிவாகக் காட்டுகிறது; ‘தாவீதின்’ மூலத்திலுள்ள பொருள் நெகிழ்வைப் பாதுகாக்கிறது.
