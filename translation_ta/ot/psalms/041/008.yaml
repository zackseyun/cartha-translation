  text: דְּֽבַר בְּ֭לִיַּעַל יָצ֣וּק בּ֑/וֹ וַ/אֲשֶׁ֥ר שָׁ֝כַ֗ב לֹא יוֹסִ֥יף לָ/קֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/008.yaml
  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
translation:
  language: ta
  text: “தீங்கான ஒன்று அவன்மேல் ஊற்றப்பட்டுள்ளது; அவன் படுத்துவிட்டபின்[a], இனி எழுந்திருக்க மாட்டான்.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இழிவான ஒன்று அவன்மேல் பதிந்துள்ளது”; அல்லது, “ஒரு தீய குற்றச்சாட்டு அவன்மேல் சுமத்தப்பட்டுள்ளது.” எபிரெயச் சொற்றொடர் கடினமானது; அது கொடிய நோயையோ அழிவை உண்டாக்கும் குற்றச்சாட்டையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  choice: ஒரு தீய காரியம்
  rationale: இந்தச் சுருக்கமான எபிரெயச் சொற்றொடர் கொடிய நோயையோ தீங்கிழைக்கும் குற்றச்சாட்டையோ குறிக்கலாம். “தீய காரியம்” இரு சாத்தியங்களையும் தீர்மானிக்காமல் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: יָצוּק בּוֹ
  choice: அவன்மேல் ஊற்றப்பட்டுள்ளது
  rationale: יָצוּק என்பதன் வார்ப்பது/ஊற்றுவது என்ற உருவகத்தையும், בּוֹ என்பதன் ‘அவன்மேல்’ என்ற பொருளையும் இச்சொல்லாக்கம் பாதுகாக்கிறது; உறுதியாகப் பற்றிக்கொண்டது என்ற மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וַאֲשֶׁר שָׁכַב
  choice: அவன் படுத்துவிட்டதால்
  rationale: שָׁכַב என்பதன் நேரடியான ‘படுத்தல்’ உருவகத்தைப் பாதுகாத்து, நோயால் படுக்கையில் விழுந்தான் அல்லது வீழ்த்தப்பட்டான் என்று மிகையாக விளக்கவில்லை. சூழலில் தொடரும் நிலையை இயல்பாகக் காட்ட “படுத்துவிட்டதால்” பயன்படுத்தப்பட்டுள்ளது.
- source_word: לֹא יוֹסִיף לָקוּם
  choice: இனி எழுந்திருக்க மாட்டான்
  rationale: மீண்டும் எழுதல் அல்லது நலம்பெறுதல் இனி நிகழாது என்ற எபிரெய மரபுத்தொடரின் கடுமையான பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: வசனத்தின் உருவகத்தைப் புரிந்துகொள்ளுதல்
  choice: தீங்கான நோய் அல்லது நிலை மற்றும் அழிவை உண்டாக்கும் குற்றச்சாட்டு ஆகிய இரண்டுக்கும் இடமளிக்கும் வகையில் முதன்மை உரை அமைக்கப்பட்டுள்ளது.
  alternative: “கொடிய நோய் அவனைப் பற்றிக்கொண்டது” அல்லது “தீய குற்றச்சாட்டு அவன்மேல் சுமத்தப்பட்டுள்ளது.”
  rationale: எபிரெயச் சொற்றொடர் கடினமானதும் சுருக்கமானதும் ஆகும். அது நோயைத் தெளிவாகக் குறிப்பிடுகிறதா அல்லது பழிச்சொல்/குற்றச்சாட்டைக் குறிப்பிடுகிறதா என்பது உறுதியில்லை; ஆகவே மூலத்தில் உள்ள பதற்றம் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான தொனி பயன்படுத்தப்பட்டுள்ளது. “தீய காரியம்” என்பது திட்டமிட்ட பரந்த சொல்லாக்கம்; மூலத்தின் உண்மையான இருபொருள் சாத்தியத்தை அடிக்குறிப்புடன் பாதுகாக்கிறது.
