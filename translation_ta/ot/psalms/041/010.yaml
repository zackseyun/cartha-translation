  text: וְ/אַתָּ֤ה יְהוָ֗ה חָנֵּ֥/נִי וַ/הֲקִימֵ֑/נִי וַֽ/אֲשַׁלְּמָ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/010.yaml
  text: But you[a], O Yahweh, be gracious to me and raise me up, that I may repay them.
translation:
  language: ta
  text: ஆனால், யாவே, நீர் எனக்கு அருள்கூரும்; என்னை எழுப்பும்; நான் அவர்களுக்குக் கைம்மாறு செய்வேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை எழுப்பும்; நான் அவர்களுக்குக் கைம்மாறு செய்யும்படி.” எபிரெய வினைவடிவம் முந்தைய வேண்டுதல்களின் நோக்கம் அல்லது விளைவாகவும், அவற்றைத் தொடர்ந்து வரும் உறுதியாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: ஆனால் ... நீர்
  rationale: முந்தைய சூழலில் வரும் பகைவர்களுக்கும் துரோகம் செய்த நண்பனுக்கும் எதிர்மாறாக யாவேயை முன்னிறுத்தும் இணைப்பையும் தனிப்பெயர்ச்சொல்லையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனுடைய தனிப்பட்ட பெயராகிய நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: חָנֵּנִי
  choice: எனக்கு அருள்கூர்ந்து
  rationale: חנן என்பதிலுள்ள அருளையும் தயவையும் தக்கவைத்து, வெறும் இரக்க உணர்வாக அதன் பொருளைக் குறுக்காமல் வழங்குகிறது.
- source_word: וַהֲקִימֵנִי
  choice: என்னை எழுப்பிவிடும்
  rationale: קום என்பதன் ஹிபீல் வடிவிலுள்ள ‘எழும்பச் செய்’ என்ற உருவகத்தைத் தக்கவைக்கிறது; நோயிலிருந்து மீட்டெடுத்தல் என்ற சூழற்பொருளையும் உள்ளடக்க முடிகிறது.
- source_word: וַאֲשַׁלְּמָה
  choice: அப்போது நான் ... பதில்செய்வேன்
  rationale: שלם பியேல் வடிவின் திருப்பிச் செய்தல் அல்லது கைம்மாறு செய்தல் என்ற பொருளைத் தக்கவைக்கிறது. முன்னுள்ள வேண்டுதல்களின் விளைவைத் தொடர்ந்து வரும் உறுதியாகக் cohortative-ஐ மொழிபெயர்க்கிறது; நோக்கப் பொருளும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָהֶם
  choice: அவர்களுக்கு
  rationale: לָהֶם குறிக்கும் மறைமுகச் செயப்படுபொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சங்கீதக்காரர் அவர்களுக்குப் பதில்செய்ய விரும்புவதை மெல்லிய பொருளாக மாற்ற வேண்டுமா?
  choice: அவர்களுக்குப் பதில்செய்வேன்
  alternative: அவர்களுக்கு எதிராக எனக்கு நீதி வழங்குவேன் / அவர்களுக்குத் தகுந்தபடி நடத்துவேன்
  rationale: שלם நேரடியாகக் கைம்மாறு அல்லது பதில்செய்தலைக் குறிக்கிறது. அதை மென்மையாக்குவது வசனத்தின் நீதித்தீர்ப்பு சார்ந்த பதற்றத்தை மறைக்கும்; பதில்செய்யும் முறை இங்கு குறிப்பிடப்படவில்லை.
- issue: וַאֲשַׁלְּמָה-வின் cohortative வடிவை நோக்கமாகவா அல்லது வேண்டுதல்களைத் தொடரும் உறுதியாகவா புரிந்துகொள்வது?
  choice: அப்போது நான் அவர்களுக்குப் பதில்செய்வேன்
  alternative: நான் அவர்களுக்குப் பதில்செய்யும்படி
  rationale: எபிரெய வடிவம் வேண்டுதல்களின் நோக்கம்/விளைவு அல்லது அவற்றைத் தொடரும் தீர்மானம் ஆகிய இரண்டையும் அனுமதிக்கிறது. முதன்மை உரை இயல்பான தமிழ் உறுதியைப் பயன்படுத்துகிறது; மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
