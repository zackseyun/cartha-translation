  register: நவீன செந்தமிழ் நடையில், எளிதில் புரியும் அதேவேளையில் மன்றாட்டு மொழிக்குரிய கண்ணியத்துடன் வடிவமைக்கப்பட்டது. ‘நீர்’ மற்றும் ‘எழுப்பிவிடும்’ ஆகியவை சங்கீதத்தின் நேரடி இறைவேண்டுதல் தொனியைப் பேணுகின்றன.
