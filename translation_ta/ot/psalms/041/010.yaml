  source_fidelity: யாவே, அருள், எழுப்புதல், அவர்களுக்கான கைம்மாறு ஆகிய முதன்மைக் கூறுகள் எபிரெய மூலத்துடன் பொருந்துகின்றன. ஆனால் முதன்மை உரையில் «அப்போது» சேர்ப்பது வாவ்-கோஹோர்டேட்டிவின் நோக்கம்/விளைவு அல்லது தொடருறுதி என்ற திறந்த தொடர்பை காலவரிசையாகக் குறுக்குகிறது. மேலும் அடிக்குறிப்பு முதன்மை உரையில் உள்ள தொடருறுதி வாசிப்பை ‘அல்லது’ என்று தராமல், அதற்கான மாற்று நோக்கம்/விளைவு வாசிப்பைத் தெளிவாகக் காட்ட வேண்டும்.
  naturalness: «என்னை எழுப்பிவிடும்» நவீன தமிழில் இயல்பாக உள்ளது; ஆயினும் «அருள்கூரும்; என்னை எழுப்பும்» என்ற இணை வேண்டுதல் வடிவம் வசனத்தின் இரு எபிரெய வேண்டுதல்களையும் தெளிவாகப் பேணுகிறது. «பதில்செய்வேன்» புரியத்தக்கது, ஆனால் இச்சூழலில் «கைம்மாறு செய்வேன்» என்பது שלם-ன் திருப்பிச் செலுத்துதல்/கைம்மாறு செய்தல் என்ற பொருளை மிகவும் நேரடியாக வெளிப்படுத்துகிறது.
