theological_decisions:
- issue: யோவான் 13:18-இல் துரோக மொழி பயன்படுத்தப்படுவதால் ஏற்படும் மேசியா சார்ந்த அல்லது முன்மாதிரி ஒலிப்பு
  choice: வசனத்தை முதலில் சங்கீதக்காரனின் உடனடிச் சூழலில், நம்பிக்கைக்குரிய நண்பனால் துரோகம் செய்யப்பட்டதாக மொழிபெயர்த்தல்
  alternative: புதிய ஏற்பாட்டு மேற்கோள் மரபை இன்னும் நேரடியாகப் பிரதிபலிக்கும் சொற்களால் மொழிபெயர்த்தல்
  rationale: எபிரெய உரை முதன்மையாகச் சங்கீதக்காரனின் அனுபவத்தைப் பேசுகிறது. அதன் புதிய ஏற்பாட்டுப் பயன்பாடு முக்கியமானது; ஆனால் அந்த விளக்கத்தை முதன்மை உரைக்குள் முன்கூட்டியே புகுத்தாமல், தொடர்பு புலப்படும்படி மூலப் படிமங்கள் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘என் அப்பத்தை உண்ட’ மற்றும் ‘குதிகாலை உயர்த்தினான்’ ஆகிய மூலப் படிமங்கள் பாதுகாக்கப்பட்டு, அவற்றின் சொல்வழக்குப் பொருள் அடிக்குறிப்புகளில் விளக்கப்பட்டுள்ளது.
