  yaml_path: translation/ot/psalms/041/009.yaml
  text: Even my close friend[a], in whom I trusted, who ate my bread[d][c][b], has lifted up his heel against me.
translation:
  language: ta
  text: நான் நம்பிக்கை வைத்திருந்த என் நெருங்கிய நண்பனும்கூட[a], என் அப்பத்தை உண்டவனும்[b], எனக்கு எதிராகத் தன் குதிகாலை உயர்த்தினான்[c].[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச் சொல், ‘என் சமாதானத்தின் மனிதன்’; அதாவது, என்னோடு சமாதான உறவில் இருந்த நெருங்கிய நண்பன் அல்லது நம்பிக்கைக்குரிய கூட்டாளி.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்னோடு அப்பத்தைப் பகிர்ந்துகொண்டவன்.’ எபிரேயில் சொல்லுக்குச் சொல், ‘என் அப்பத்தை உண்டவன்’; இது மேசைத் தோழமையையும் நம்பிக்கையையும் நினைவூட்டுகிறது.
    reason: lexical_alternative
  - marker: c
    text: சொல்லுக்குச் சொல், ‘எனக்கு எதிராகக் குதிகாலைப் பெரிதாக்கினான்’; இது துரோகமான அல்லது பகைமையான செயலைக் குறிக்கும் எபிரேயச் சொல்வழக்கு.
    reason: lexical_alternative
  - marker: d
    text: இயேசுவுக்கு யூதாஸ் செய்த துரோகத்துடன் தொடர்புபடுத்தி யோவான் 13:18-இல் இவ்வசனம் மேற்கோள் காட்டப்படுகிறது.
    reason: cross_reference
