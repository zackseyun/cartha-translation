lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், அதன் பொதுவாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: יִסְעָדֶנּוּ
  choice: அவனைத் தாங்குவார்
  rationale: סעד என்பது பலவீனமான ஒருவரை ஆதரித்துத் தாங்குவதைக் குறிக்கிறது; நோயின் சூழலில் ‘தாங்குவார்’ இயல்பாகவும் சுருக்கமாகவும் உள்ளது.
- source_word: עַל עֶרֶשׂ דְּוָי
  choice: நோய்ப்படுக்கையில்
  rationale: ‘நோய்/பலவீனத்தின் படுக்கை’ என்ற எபிரெயச் சொற்றொடரைத் தெளிவான நவீனத் தமிழில் ஒரே சொல்லாகத் தருகிறது.
- source_word: כָּל מִשְׁכָּבוֹ
  choice: அவனுடைய படுக்கை முழுவதையும்
  rationale: כָּל என்பதன் முழுமையைக் காட்டி, முந்தைய அடியிலுள்ள படுக்கை உருவகத்துடனான இணைப்பையும் காக்கிறது.
- source_word: הָפַכְתָּ
  choice: சீராக்குகிறீர்
  rationale: הפך என்பதன் அடிப்படைப் பொருள் ‘திருப்பு/மாற்று’ என்பதாக இருந்தாலும், இங்கு நோயாளியின் படுக்கையைப் பராமரித்து ஒழுங்குபடுத்தும் நன்மையான செயலைக் குறிக்கும் வாய்ப்புள்ளது. ‘சீராக்குகிறீர்’ அந்தச் சூழற்பொருளை இயல்பான தமிழில் தருகிறது; நேரடிப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: בְחָלְיוֹ
  choice: அவன் நோயுற்றிருக்கையில்
  rationale: בְ இங்கு நிகழ்வின் சூழ்நிலையைக் குறிக்கிறது; பெயர்ச்சொல் வடிவத்தை இயல்பான தமிழ்ச் சார்பு வாக்கியமாகத் தருகிறது.
theological_decisions:
- issue: ஒரே வசனத்தில் இறைவனைப் பற்றிய மூன்றாம் நபர் குறிப்பிலிருந்து அவரை நேரடியாக அழைக்கும் இரண்டாம் நபருக்கு மாறுதல்
  choice: ‘யாவே … தாங்குவார்’ என்பதிலிருந்து ‘நீர் … சீராக்குகிறீர்’ எனும் மாற்றத்தை அப்படியே வைத்தல்
  alternative: வசனம் முழுவதையும் மூன்றாம் நபரில் ஒரே சீராக அமைத்தல்
  rationale: எபிரெயக் கவிதை இறைவனைப் பற்றிப் பேசுவதிலிருந்து அவரிடம் நேரடியாகப் பேசுவதற்கு மாறுகிறது. அந்த மாறுதல் சங்கீதத்தின் ஜெப-கவிதைத் தன்மையை வெளிப்படுத்துவதால் அதைச் சீராக்கி நீக்கவில்லை.
- issue: הָפַכְתָּ என்பதன் தெளிவற்ற படுக்கை உருவகம்
  choice: முதன்மை உரையில் நன்மையான பராமரிப்பைக் குறிக்கும் ‘சீராக்குகிறீர்’ என்றும், நேரடிப் பொருளை அடிக்குறிப்பிலும் தருதல்
  alternative: ‘அவனுடைய படுக்கை முழுவதையும் புரட்டுகிறீர்’ என்று மட்டும் நேரடியாக மொழிபெயர்த்தல்
  rationale: சூழல் இறைவனின் இரக்கமுள்ள ஆதரவைச் சுட்டுகிறது; அதேவேளையில் எபிரெய வினையின் ‘திருப்பு/மாற்று’ என்ற உருவகத் தன்மை உறுதியாகத் தீர்மானிக்க முடியாததால் மாற்று வாசிப்பு மறைக்கப்படவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில், மரியாதையும் கவிதைநயமும் உள்ள நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நேரடியாக அழைக்கும் இடத்தில் ‘நீர்’ என்ற மரியாதை ஒருமையும் அதற்கேற்ற வினைமுற்றும் பயன்படுத்தப்பட்டுள்ளன; எபிரெய மூன்றாம் நபர்–இரண்டாம் நபர் மாறுதல் காக்கப்பட்டுள்ளது.
