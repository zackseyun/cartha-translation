  language: ta
  text: யாவே அவனை நோய்ப்படுக்கையில் தாங்குவார்; அவன் நோயுற்றிருக்கையில், அவனுடைய படுக்கை முழுவதையும் நீர் சீராக்குகிறீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவன் நோயுற்றிருக்கையில், அவனுடைய படுக்கை முழுவதையும் நீர் திருப்புகிறீர்.” எபிரெய வினை நேரடியாக ‘திருப்பு/மாற்று’ என்று பொருள்படும்; இங்கு நோயாளியின் படுக்கையைப் பராமரித்துச் சீராக்குவதைக் குறிக்கலாம்.
