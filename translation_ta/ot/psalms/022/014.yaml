base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
translation:
  language: ta
  text: 'தண்ணீரைப்போல் நான் சிந்தப்பட்டேன்;


    என் எலும்புகளெல்லாம் ஒன்றைவிட்டு ஒன்று பிரிந்தன.


    என் இதயம் மெழுகைப்போல் ஆகி,


    என் உள்ளுறுப்புகளுக்குள் உருகிப்போயிற்று.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் சொல்லுக்குச் சொல்: “என் உள்ளுறுப்புகளின் நடுவில்.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמַּיִם
  choice: தண்ணீரைப்போல்
  rationale: כ முன்னொட்டு காட்டும் உவமையை இயல்பான நவீனத் தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: נִשְׁפַּכְתִּי
  choice: ஊற்றுண்டுபோனேன்
  rationale: שׁפך என்பதன் நிஃபால் வடிவம் பேச்சாளர் முற்றிலும் ஊற்றப்பட்ட நிலையைக் காட்டுகிறது; தமிழ் செயப்பாட்டு வடிவம் அந்தத் தீவிரமான கவித்துவப் படிமத்தைத் தக்கவைக்கிறது.
- source_word: וְהִתְפָּרְדוּ
  choice: ஒன்றைவிட்டு ஒன்று பிரிந்தன
  rationale: פרד என்பதன் ஹித்பயேல் வடிவத்தில் உள்ள பிரிதல் அல்லது தனித்தனியாகுதல் என்ற பொருளை, எலும்புகளைப் பற்றிய சூழலில் மூட்டுகள் என்ற சொல்லை மூலத்தில் இல்லாமல் சேர்க்காமல் வெளிப்படுத்துகிறது.
- source_word: כָּל עַצְמוֹתַי
  choice: என் எலும்புகளெல்லாம்
  rationale: כָּל காட்டும் முழுமையையும் உறுதியான உடல் படிமத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: הָיָה לִבִּי
  choice: என் இதயம் ... ஆகி
  rationale: இதயம் ஒரு புதிய நிலைக்கு வந்துள்ள மாற்றத்தை הָיָה வெளிப்படுத்துவதால், வெறும் நிலைமையை மட்டும் கூறாமல் அந்த மாற்றத்தையும் காட்டுகிறது.
- source_word: כַּדּוֹנָג
  choice: மெழுகைப்போல்
  rationale: דּוֹנָג என்பது மெழுகைக் குறிக்கிறது; மூல உவமை நேரடியாகத் தக்கவைக்கப்படுகிறது.
- source_word: נָמֵס
  choice: உருகிப்போனது
  rationale: מסס என்பதன் உருகுதல் அல்லது கரைதல் என்ற பொருளில், மெழுகு உவமைக்கு இயல்பாகப் பொருந்தும் சொல்லாட்சி இது.
- source_word: בְּתוֹךְ מֵעָי
  choice: என் உடலுக்குள்
  rationale: מֵעִים குறிக்கும் உடலின் உள்ளுறுப்புகள் என்ற உடல்சார் படிமத்தை இயல்பான தமிழில் தருகிறது; அதன் மேலும் சொல்லுக்குச் சொல் அமைந்த வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: உள்ளார்ந்த வேதனையை உடல்சார் மொழியில் வெளிப்படுத்துதல்
  choice: என் உடலுக்குள்
  alternative: என் உள்ளுறுப்புகளின் நடுவில்
  rationale: எபிரெயச் சொல் வெறும் அருவமான ஆன்மிக உள்ளத்தைக் குறிக்காமல் உள்ளுறுப்புகளைச் சுட்டும் வலுவான உடல்சார் மொழியைப் பயன்படுத்துகிறது. முதன்மை உரை இயல்பான தமிழில் அந்த உடல்சார் தன்மையைத் தக்கவைக்கிறது; மேலும் நேரடியான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்தின் இணைவரி அமைப்பும் தீவிரமான உடல் படிமங்களும் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளன. மொழிநடை கண்ணியமானதும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதுமாக உள்ளது.
