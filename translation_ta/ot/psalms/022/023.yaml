    இஸ்ரவேலின் சந்ததியார் அனைவரும், அவருக்கு அஞ்சி நடுங்குங்கள்[a]!


    [a] “அவருக்குப் பயப்படுங்கள்” அல்லது “அவரை பயபக்தியுடன் மதியுங்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினைச்சொல் பயம் கலந்த ஆழ்ந்த மரியாதையைக் குறிக்கிறது.'
