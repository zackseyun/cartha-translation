source:
  edition: WLC
  text: יִרְאֵ֤י יְהוָ֨ה הַֽלְל֗וּ/הוּ כָּל זֶ֣רַע יַעֲקֹ֣ב כַּבְּד֑וּ/הוּ וְ/ג֥וּרוּ מִ֝מֶּ֗/נּוּ כָּל זֶ֥רַע יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/023.yaml
  text: You who fear Yahweh[a], praise him! All offspring of Jacob, honor him! Stand in awe of him, all offspring of Israel!
translation:
  language: ta
  text: 'யாவேக்குப் பயப்படுகிறவர்களே, அவரைப் புகழுங்கள்!


    யாக்கோபின் சந்ததியினரே, அனைவரும் அவரை மதியுங்கள்!


    இஸ்ரவேலின் சந்ததியினரே, அனைவரும் அவருக்கு அஞ்சுங்கள்[a]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்முன் நடுங்குங்கள்.” எபிரெய வினைச்சொல் பயபக்தி கலந்த அச்சத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  choice: யாவேயுக்குப் பயப்படுகிறவர்களே
  rationale: இது யாவேயுக்குப் பயப்படுவதால் அடையாளப்படுத்தப்படுகிறவர்களைக் குறிக்கும் இணைப்புத் தொடர். தொடர்ந்து வரும் பன்மை ஏவல் வினைகள் நேரடி அழைப்பைத் தெளிவாக்குவதால், தமிழில் அழைப்புவேற்றுமை இயல்பாகப் பயன்படுத்தப்பட்டது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הַלְלוּהוּ
  choice: அவரைப் புகழுங்கள்
  rationale: பன்மை ஏவல் வினையுடன் மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு உள்ளது; அது யாவேயைக் குறிக்கிறது. வழிபாட்டுச் சூழலில் הלל என்பதன் பொதுவான பொருளை ‘புகழுங்கள்’ நேரடியாகத் தருகிறது.
- source_word: כָּל זֶרַע יַעֲקֹב
  choice: யாக்கோபின் சந்ததியார் அனைவரும்
  rationale: זֶרַע இங்கு ஒரு கூட்டுமுழுமையைக் குறிக்கிறது. ‘சந்ததியார்’ நவீன தமிழில் இயல்பாகவும், ‘அனைவரும்’ அழைப்பின் முழுமையையும் வெளிப்படுத்துகிறது.
- source_word: כַּבְּדֻהוּ
  choice: அவரை மகிமைப்படுத்துங்கள்
  rationale: כבד என்பதன் பியேல் ஏவல் வடிவம் ஒருவருக்குரிய கனத்தையும் மேன்மையையும் அளித்து மதிக்க அழைக்கிறது. தேவனை நோக்கிய வழிபாட்டுச் சூழலில் ‘மகிமைப்படுத்துங்கள்’ இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: וְגוּרוּ
  choice: அஞ்சி நடுங்குங்கள்
  rationale: גור இங்கு சாதாரண மரியாதையைவிட வலிமையான, பயபக்தி நிறைந்த அச்சத்தை வெளிப்படுத்துகிறது. ‘அஞ்சி நடுங்குங்கள்’ தொடக்கத்திலுள்ள ‘பயப்படுகிறவர்கள்’ என்பதோடு உள்ள சொற்பொருள் வேறுபாட்டையும் கவித்துவத் தீவிரத்தையும் காக்கிறது.
- source_word: מִמֶּנּוּ
  choice: அவருக்கு
  rationale: גור உடன் வரும் מִן அச்சத்திற்குரிய நபரைச் சுட்டுகிறது. தமிழில் ‘அவருக்கு அஞ்சி நடுங்குங்கள்’ என்பதே இயல்பான இணைப்பு.
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  choice: இஸ்ரவேலின் சந்ததியார் அனைவரும்
  rationale: முந்தைய ‘யாக்கோபின் சந்ததியார் அனைவரும்’ என்பதற்கு இணையாக அமைந்து, எபிரெயக் கவிதையின் சமச்சீரையும் זֶרַע என்பதன் கூட்டுப் பொருளையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை தனிப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துகிறது. ஒரு பொதுப் பட்டத்தால் அதை மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்ப்பது உடன்படிக்கையின் தனிப்பெயரை வெளிப்படையாகக் காக்கிறது.
- issue: וְגוּרוּ מִמֶּנּוּ என்பதில் உள்ள பயபக்தியின் தீவிரம்
  choice: அவருக்கு அஞ்சி நடுங்குங்கள்
  alternative: அவருக்குப் பயப்படுங்கள்; அவரை பயபக்தியுடன் மதியுங்கள்
  rationale: இந்த வினை பயமும் ஆழ்ந்த மரியாதையும் கலந்த பிரதிசெயலைக் குறிக்க முடியும். ‘அஞ்சி நடுங்குங்கள்’ அதன் வலிமையையும், புகழ்தல் மற்றும் மகிமைப்படுத்துதலோடு நிற்கும் இறைபயத்தின் பதற்றத்தையும் மழுங்கடிக்காமல் காக்கிறது; மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான, பொதுவாசகர்களுக்குப் புரியும் வழிபாட்டு நடையைக் கொண்டுள்ளது. மூன்று நேரடி அழைப்புகளின் கவித்துவ இணைமைவும் ஏவல் வினைகளின் உயர்வும் காக்கப்பட்டுள்ளன; பழமையான ‘கனம்பண்ணுங்கள்’ போன்ற வடிவங்கள் தவிர்க்கப்பட்டன.
