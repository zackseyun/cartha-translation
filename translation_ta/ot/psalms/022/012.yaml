  text: Many bulls surround me[a]; mighty bulls of Bashan encircle me.
translation:
  language: ta
  text: 'பல காளைகள் என்னைச் சூழ்ந்துள்ளன[a];

    பாசானின் வலிமைமிக்க காளைகள் என்னைச் சுற்றிவளைத்துள்ளன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாசான் யோர்தானுக்கு கிழக்கே இருந்த ஒரு பகுதி. செழிப்பான மேய்ச்சல் நிலங்களுக்கும் வலிமையான, நன்கு மேய்ந்த கால்நடைகளுக்கும் அது பெயர் பெற்றிருந்தது; இங்கு இச்சொற்றொடர் வலிமைமிக்க, அச்சுறுத்தும் எதிரிகளை மனக்கண்ணில் நிறுத்துகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: סְבָבוּנִי
  choice: என்னைச் சூழ்ந்துள்ளன
  rationale: סבב என்பதன் ‘சுற்றியிருத்தல், சூழ்தல்’ என்ற பொருளையும், நிறைவுற்ற செயல் இப்போது நீடிக்கும் நிலையையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פָּרִים
  choice: காளைகள்
  rationale: פַּר என்பதன் பன்மை; பகைவர்களை வலிமையும் அச்சுறுத்தலும் கொண்ட விலங்குகளாகச் சித்தரிக்கும் உருவகத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: רַבִּים
  choice: பல
  rationale: காளைகளின் பெரும் எண்ணிக்கையைத் தெளிவாகக் குறிக்கும் இயல்பான அளவைச் சொல்.
- source_word: אַבִּירֵי
  choice: வலிமைமிக்க காளைகள்
  rationale: אַבִּיר என்பது வலிமையானவர்களையோ வல்லவர்களையோ குறிக்கலாம்; முன்னுள்ள காளை உருவகத்துடன் இயைபாக இருப்பதால் பெயர்ச்சொல்லை வெளிப்படையாக மீண்டும் வழங்குவது தமிழில் தெளிவாக உள்ளது.
- source_word: בָשָׁן
  choice: பாசான்
  rationale: இது இடப்பெயர்; தமிழ் ஒலிபெயர்ப்பு மரபுக்கு ஏற்றவாறு தரப்பட்டுள்ளது.
- source_word: כִּתְּרוּנִי
  choice: என்னை வளைத்துக்கொண்டன
  rationale: כתר என்பதன் ‘சுற்றிவளைத்தல்’ என்ற பொருளைத் தருகிறது; முதல் அடியின் ‘சூழ்ந்துள்ளன’ என்பதோடு இணையான கருத்தைத் தக்கவைத்தபடியே சொல் மறுபடியையும் தவிர்க்கிறது.
theological_decisions:
- issue: பகைவர்களைக் குறிக்கும் காளை உருவகம்
  choice: மூலத்தின் ‘காளைகள்’ என்ற உருவகம் நேரடியாகத் தக்கவைக்கப்பட்டது.
  alternative: ‘பல பகைவர்கள் என்னைச் சூழ்ந்துள்ளனர்’ என்று விளக்கமாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை பகைவர்களை நேரடியாகப் பெயரிடாமல் வலிமையும் அச்சுறுத்தலும் கொண்ட காளைகளாகச் சித்தரிக்கிறது. அதை விளக்கவுரையாக மாற்றாமல் கவித்துவத் தீவிரத்தையும் பொருள் திறப்பையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியமும் இணைவரி அமைப்பும் பேணப்பட்டுள்ளன. ‘சூழ்ந்துள்ளன / வளைத்துக்கொண்டன’ என்பவை எபிரெய நிறைவுச் செயலின் நிகழ்நிலை விளைவையும் இரு வினைகளின் நுண்ணிய வேறுபாட்டையும் இயல்பாக வெளிப்படுத்துகின்றன.
