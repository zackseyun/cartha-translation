lexical_decisions:
- source_word: וְ/אָנֹכִי
  choice: ஆனால் நானோ
  rationale: முன்னுள்ள நம்பிக்கை மொழியோடு காணப்படும் கூர்மையான முரண்பாட்டை ‘ஆனால்’ வெளிப்படுத்துகிறது; ஆனֹכִי என்பதன் வலியுறுத்தலை ‘நானோ’ இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: תוֹלַעַת
  choice: ஒரு புழு
  rationale: மிகுந்த தாழ்வையும் அவமானத்தையும் குறிக்கும் உருவகத்தை, புழுவின் வகையைத் தேவையின்றி குறிப்பாக்காமல் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וְ/לֹא אִישׁ
  choice: மனிதன் அல்ல
  rationale: אִישׁ என்ற ஒருமையையும், மனித மாண்பே மறுக்கப்பட்டதுபோன்ற பேச்சாளரின் தீவிர அனுபவத்தையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: חֶרְפַּת אָדָם
  choice: மனிதர்களால் நிந்திக்கப்பட்டவன்
  rationale: சொல்லுக்குச் சொல் வடிவம் ‘மனிதகுலத்தின் நிந்தை’ என அமையலாம்; இங்கு பேச்சாளர் மனிதர்களின் நிந்தைக்கு ஆளானவர் என்ற பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: וּ/בְזוּי
  choice: இகழப்பட்டவன்
  rationale: இகழ்ச்சிக்கும் அவமதிப்புக்கும் ஆளாக்கப்பட்ட நிலையைக் குறிக்கும் செயப்பாட்டு எச்சத்தின் உணர்ச்சி வலிமையைப் பாதுகாக்கிறது.
- source_word: עָם
  choice: மக்கள்
  rationale: ஒரு கூட்டத்தைக் குறிக்கும் எபிரெயச் சொல்லை இயல்பாக வழங்கி, பொதுமக்களின் பரவலான இகழ்ச்சியை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கிறிஸ்தவ வாசிப்பில் மேசியாவைச் சுட்டும் அல்லது முன்மாதிரியாகக் கருதப்படும் பயன்பாடு
  choice: வசனத்தை எபிரெயக் கவிதையின் அவமானம் மற்றும் தாழ்வு சார்ந்த நேரடிப் பொருளின்படி மொழிபெயர்த்தல்
  alternative: கிறிஸ்துவில் நிறைவேறுவதை வெளிப்படையாக முன்னிறுத்தும் விளக்கம்சேர்ந்த மொழிபெயர்ப்பு
  rationale: சங்கீதம் 22 புதிய ஏற்பாட்டிலும் கிறிஸ்தவ மரபிலும் கிறிஸ்துவோடு முக்கியமாக இணைக்கப்பட்டாலும், இவ்வசனம் சங்கீதக்காரரின் குரலில் அவமானத்தை உருவகமாகச் சொல்கிறது. அந்தத் தொடர்பை மொழிபெயர்ப்புக்குள் சேர்க்காமல், வேதாகமச் சூழலிலிருந்து வாசகர் காணுமாறு விடுவது பொருத்தமானது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் சங்கீதத்தின் கண்ணியமும் கவிதைச் செறிவும் குன்றாத நடை. ‘நானோ’ வலியுறுத்தலைப் பாதுகாக்கிறது; இரண்டாம் பாதியின் இணை அமைப்புக்காக ‘நிந்திக்கப்பட்டவன் / இகழப்பட்டவன்’ பயன்படுத்தப்பட்டுள்ளன.
