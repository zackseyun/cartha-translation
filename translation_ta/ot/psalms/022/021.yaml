source:
  edition: WLC
  text: ה֭וֹשִׁיעֵ/נִי מִ/פִּ֣י אַרְיֵ֑ה וּ/מִ/קַּרְנֵ֖י רֵמִ֣ים עֲנִיתָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion[b][a], and from the horns of the wild oxen—you have answered me.
translation:
  language: ta
  text: 'சிங்கத்தின் வாயிலிருந்து என்னைக் காப்பாற்றும்;

    காட்டெருதுகளின்[a] கொம்புகளிலிருந்து—நீர் எனக்குப் பதிலளித்தீர்.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘காட்டுக் காளைகள்’ அல்லது ‘ஆரோக்ஸ்’ என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொல் வலிமைமிக்க ஒரு காட்டு மாட்டினத்தைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: இறுதிச் சொற்றொடரை, ஜெபத்துக்குப் பதில் கிடைத்ததைத் திடீரென அறிவிக்கும் “நீர் எனக்குப் பதிலளித்தீர்” என்று புரிந்துகொள்ளலாம்; இது வேண்டுதலிலிருந்து நம்பிக்கைக்கான திருப்பத்தைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றும்
  rationale: ישׁע என்பதன் ஹிஃபில் கட்டளை வடிவமும் முதலாம் நபர் ஒருமை பின்னொட்டும் நேரடியான மீட்பு வேண்டுதலைக் குறிக்கின்றன. ‘காப்பாற்றும்’ என்பது அவசரத்தையும் பரந்த மீட்புப் பொருளையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִפִּי
  choice: வாயிலிருந்து
  rationale: எபிரெயச் சொல் நேரடியாக ‘வாய்’ என்பதைக் குறிக்கிறது. ‘தாடைகளிலிருந்து’ என்று மொழிமாற்றாமல் மூலத்தின் தெளிவான கவித்துவப் படிமம் பாதுகாக்கப்படுகிறது.
- source_word: אַרְיֵה
  choice: சிங்கத்தின்
  rationale: எபிரெயில் பெயர்ச்சொல் ஒருமையில் உள்ளது. தமிழில் உரிமை வேற்றுமையுடன் ‘சிங்கத்தின் வாய்’ என்பது இயல்பாகவும் பொதுப்படையான அபாயப் படிமமாகவும் அமைகிறது.
- source_word: וּמִקַּרְנֵי
  choice: கொம்புகளிலிருந்து
  rationale: இணைப்புச் சொல்லும் முன்னிடைச் சொல்லும் இரண்டாவது அபாயத்தையும் வேண்டுதலோடு இணைக்கின்றன. உறுதியான கவித்துவப் படிமத்தைத் தக்கவைக்க ‘கொம்புகள்’ நேரடியாக மொழிபெயர்க்கப்படுகிறது.
- source_word: רֵמִים
  choice: காட்டெருதுகள்
  rationale: רְאֵם/רֵמִים என்பது வலிமைமிக்க காட்டு மாட்டினத்தைச் சுட்டுகிறது; பின்னாளைய ‘ஒற்றைக்கொம்புக் குதிரை’ மரபை அல்ல. ‘காட்டெருதுகள்’ என்பது நவீன தமிழ் வாசகருக்குத் தெளிவானதும் அணுகத்தக்கதும் ஆகும்.
- source_word: עֲנִיתָנִי
  choice: நீர் எனக்குப் பதிலளித்தீர்
  rationale: ענה என்பதன் கால் நிறைவுவினை, இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம், முதலாம் நபர் ஒருமை பின்னொட்டுடன், இயல்பாக ‘நீர் எனக்குப் பதிலளித்தீர்’ எனப் பொருள்படும். வேண்டுதலிலிருந்து நம்பிக்கைக்கு ஏற்படும் திடீர் திருப்பை இம்மொழிபெயர்ப்பு தக்கவைக்கிறது.
theological_decisions:
- issue: עֲנִיתָנִי என்பதைத் தொடரும் வேண்டுதலாகவா அல்லது ஜெபத்துக்குப் பதில் கிடைத்ததாக அறிவிப்பதாகவா புரிந்துகொள்வது
  choice: “நீர் எனக்குப் பதிலளித்தீர்” என்ற அறிவிப்பு
  alternative: ‘காட்டெருதுகளின் கொம்புகளிலிருந்து என்னைக் காப்பாற்றி எனக்குப் பதிலளியும்’ என்பது போன்ற தொடரும் வேண்டுதல்
  rationale: எபிரெய வடிவம் கட்டளை வினையல்ல, நிறைவுவினை. வேண்டுதலிலிருந்து உறுதியும் துதியும் நோக்கி சங்கீதம் திரும்பும் இலக்கியத் திருப்புமுனைக்கு இந்தத் திடீர் அறிவிப்பு பொருந்துகிறது. கோடு அந்தத் திடீர் மாற்றத்தை வெளிப்படுத்துகிறது; அடிக்குறிப்பு நிலவும் விளக்க வேறுபாட்டைத் தெரிவிக்கிறது.
translation_notes:
  register: மொழிநடை நவீன நிலையான தமிழில், பொதுவாசகருக்கு விளங்கும் வகையிலும் சங்கீதத்திற்குரிய கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. இறைவனை நோக்கும் ஒருமை மரியாதை வடிவங்களான ‘நீர்/பதிலளித்தீர்’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் இணைப்பட்ட அபாயப் படிமங்களும் இறுதியில் வரும் திடீர் தொனிமாற்றமும் வரிமுறிவு மற்றும் நீண்ட கோடு மூலம் பாதுகாக்கப்பட்டுள்ளன.
