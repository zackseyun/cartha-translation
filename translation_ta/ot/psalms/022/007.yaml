base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/007.yaml
  text: All who see me mock me[a]; they open wide the lip[b]; they shake the head.
translation:
  language: ta
  text: என்னைப் பார்க்கிற அனைவரும் என்னை ஏளனம் செய்கிறார்கள்; உதட்டைப் பிதுக்குகிறார்கள்[a]; தலையை ஆட்டுகிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உதட்டைத் திறக்கிறார்கள்.” இந்த எபிரெயச் சொற்றொடர் இகழ்ச்சியை வெளிப்படுத்தும் ஒரு முகச்சைகையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தலையை அசைக்கிறார்கள்.” இது இகழ்ச்சியை வெளிப்படுத்தும் ஒரு சைகை; நற்செய்தி நூல்களின் பாடுபாட்டு நிகழ்வுகளிலும் இதன் எதிரொலி காணப்படுகிறது.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל רֹאַי
  choice: என்னைப் பார்க்கிற அனைவரும்
  rationale: כָּל என்பதன் முழுமையையும், ‘என்னைப் பார்ப்பவர்கள்’ எனப் பெயர்ச்சொல் தன்மையில் வரும் רֹאַי என்பதையும் இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יַלְעִגוּ לִי
  choice: என்னை ஏளனம் செய்கிறார்கள்
  rationale: לעג இங்கு சங்கீதக்காரனை நோக்கிய இகழ்ச்சியையும் கேலியையும் குறிக்கிறது; ‘ஏளனம் செய்கிறார்கள்’ என்பது தெளிவான, கண்ணியமான நவீனத் தமிழ்.
- source_word: יַפְטִירוּ בְשָׂפָה
  choice: உதட்டைப் பிதுக்குகிறார்கள்
  rationale: சொற்றொடர் உதட்டால் செய்யப்படும் இகழ்ச்சியான முகச்சைகையைக் குறிக்கிறது. ‘உதட்டைப் பிதுக்குகிறார்கள்’ உடல் சார்ந்த படிமத்தையும் இகழ்ச்சித் தொனியையும் இயல்பான தமிழில் காக்கிறது.
- source_word: יָנִיעוּ רֹאשׁ
  choice: தலையை ஆட்டுகிறார்கள்
  rationale: தலையை அசைக்கும் அல்லது ஆட்டும் இகழ்ச்சிச் சைகையை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: பிற்காலக் கிறிஸ்தவ விளக்கத்தில் மேசியாவைப் பற்றிய பயன்பாடு
  choice: துன்புறும் சங்கீதக்காரனின் கூற்றாக எபிரெய உரையை அதன் சங்கீதச் சூழலில் மொழிபெயர்த்தல்
  alternative: நற்செய்தி நூல்களின் பாடுபாட்டு நிகழ்வுகளில் இதன் எதிரொலியை வாசகர் அடையாளம் காணலாம்
  rationale: இவ்வசனம் நற்செய்தி நூல்களில் எதிரொலித்தாலும், மொழிபெயர்ப்பு புதிய ஏற்பாட்டுக் கிறிஸ்துவியல் விளக்கத்தைச் சொற்களுக்குள் முன்கூட்டியே புகுத்தாமல் எபிரெய உரையையே முதன்மையாகப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீனச் செந்தமிழுக்கு நெருக்கமான, சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூன்று இணைச் செயல்களின் சுருக்கமான கவிதை ஓட்டமும் உடல் சைகைகளின் படிமமும் காக்கப்பட்டுள்ளன.
