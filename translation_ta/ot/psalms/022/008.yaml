  text: “Commit yourself to Yahweh; let him rescue him; let him deliver him[a], since he delights in him!”
translation:
  language: ta
  text: “யாவேயிடம் உன்னை ஒப்படை[a]; அவர் அவனை மீட்கட்டும்; அவனை விடுவிக்கட்டும்; ஏனெனில் அவர் அவன்மேல் பிரியமாயிருக்கிறாரே!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெய மொழியில் நேர்ப்பொருள்: “யாவேயிடம் உருட்டிவிடு.” இச்சொற்றொடர் தன்னையோ தன் காரியத்தையோ யாவேயிடம் நம்பி ஒப்படைப்பதைக் குறிக்கிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: ஒப்படை
  rationale: இந்தக் கட்டளை வினைச்சொல்லின் நேர்ப்பொருள் ‘உருட்டு’ என்பதாக இருந்தாலும், אֶל மற்றும் இறைபெயருடன் வரும் இச்சொற்றொடர் ஒருவரை அல்லது அவரது காரியத்தை இறைவனிடம் நம்பி ஒப்படைப்பதைக் குறிக்கிறது. ‘ஒப்படை’ என்பது தமிழில் இயல்பாகவும் இகழ்ச்சியான சவாலின் தொனியைத் தக்கவைத்தும் உள்ளது.
- source_word: אֶל
  choice: -யிடம்
  rationale: யாவேயை நோக்கிய திசையையும் அவரிடம் ஒப்படைப்பதையும் இயல்பான தமிழில் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய இறைபெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் தெளிவான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יְפַלְּטֵהוּ
  choice: அவர் அவனை மீட்கட்டும்
  rationale: פלט என்பதன் பியேல் வடிவம் ஆபத்திலிருந்து தப்புவித்தல் அல்லது மீட்டலைக் குறிக்கிறது. அடுத்த இணை வினையிலிருந்து ஓரளவு வேறுபாட்டையும் இது காக்கிறது.
- source_word: יַצִּילֵהוּ
  choice: அவனை விடுவிக்கட்டும்
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்து விடுவித்தல் அல்லது பறித்தெடுத்தல் என்ற கருத்தைக் கொண்டது. ‘விடுவிக்கட்டும்’ என்பது இணையான இரண்டாம் வேண்டுகோளைத் தெளிவாக வழங்குகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: பின்வரும் கூற்று முன் வந்த சவாலுக்கான காரணமாக அமைவதைத் தெளிவாகக் காட்டுகிறது.
- source_word: חָפֵץ בּוֹ
  choice: அவன்மேல் அவர் பிரியமாயிருக்கிறார்
  rationale: இந்தச் சொற்றொடர் ஒருவரில் மகிழ்தல் அல்லது அவர்மேல் பிரியம் கொள்ளுதல் என்பதைக் குறிக்கிறது. தமிழில் ‘அவன்மேல் பிரியமாயிருக்கிறார்’ என்பது உறவுசார் நுணுக்கத்தை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இகழ்ச்சிக் கூற்றில் இரண்டாம் நபரிலிருந்து மூன்றாம் நபருக்கு மாறுதல்
  choice: தொடக்கக் கட்டளையைத் துன்புறுபவனை நோக்கி ‘உன்னை ... ஒப்படை’ என்றும், தொடரும் வினைகளை ‘அவர் அவனை...’ என்றும் மொழிபெயர்த்தல்
  alternative: தொடக்கத்தையும் மூன்றாம் நபராக மாற்றி ‘அவனை யாவேயிடம் ஒப்படையுங்கள்’ என்று மொழிபெயர்த்தல்
  rationale: גֹּל என்பது இலக்கணப்படி இரண்டாம் நபர் ஒருமைக் கட்டளை; அடுத்த இரு வினைகளிலுள்ள பின்னொட்டுகள் மூன்றாம் நபர் ஒருமையைக் குறிக்கின்றன. இந்தத் திடீர் நபர்மாற்றம் மூலத்தின் இகழ்ச்சி நிறைந்த பேச்சில் உண்மையாகவே உள்ளது; அதைச் சீராக்காமல் தமிழிலும் காக்கப்பட்டுள்ளது.
- issue: חָפֵץ என்பதன் எழுவாய்
  choice: மீட்பவராகக் குறிப்பிடப்படும் யாவேயே ‘பிரியமாயிருக்கிறார்’ என்பதாகப் பொருள் கொள்ளுதல்
  alternative: எழுவாயை வெளிப்படுத்தாமல் ‘அவன்மேல் பிரியம் இருப்பதால்’ என மொழிபெயர்த்தல்
  rationale: முன் வரும் மூன்றாம் நபர் வினைகளின் இயல்பான எழுவாய் யாவே; அதே எழுவாய் இங்கும் தொடர்கிறது. ‘அவர்’ என்பது இதைத் தெளிவுபடுத்தினாலும், பிரியத்தின் தன்மை குறித்து மேலதிக இறையியல் விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதத்தின் உயரிய கவித்துவத் தொனியுடனும் அமைக்கப்பட்டுள்ளது. ‘மீட்கட்டும் / விடுவிக்கட்டும்’ என்ற இணைச்சொற்கள் எபிரெயக் கவிதையின் ஒத்திசைவையும் நுண்ணிய சொற்பொருள் வேறுபாட்டையும் காக்கின்றன. இறுதியிலுள்ள ‘-றாரே’ இகழ்ச்சியுடன் கூறப்படும் காரணவாதத்தின் வலியுறுத்தலை வெளிப்படுத்துகிறது.
