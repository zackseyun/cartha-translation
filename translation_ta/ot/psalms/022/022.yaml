  text: I will declare your name to my brothers[a]; in the midst of the assembly I will praise you.
translation:
  language: ta
  text: 'உமது பெயரை என் சகோதரர்களுக்கு[a] அறிவிப்பேன்;

    சபையின் நடுவில் உம்மைப் புகழ்வேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, இச்சூழலில் குடும்ப உறவுமுறை அழைப்பு அனைவரையும் உள்ளடக்குவதாகப் புரிந்துகொள்ளப்பட்டால், “என் சகோதர சகோதரிகளுக்கு.” எபிரெய மூலத்தில் சொல்லுக்குச் சொல் “என் சகோதரர்களுக்கு” என்றுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: அறிவிப்பேன்
  rationale: ספר என்பதன் பியேல் வடிவம் ‘எடுத்துரைத்தல்/அறிவித்தல்’ என்ற பொருளைத் தருகிறது. அடுத்த அடியிலுள்ள பொதுப் புகழ்ச்சியோடு இணையும் சாட்சியமளிக்கும் கருத்தை ‘அறிவிப்பேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שִׁמְךָ
  choice: உமது பெயரை
  rationale: எபிரெய மொழியின் ‘உமது பெயர்’ என்ற உருவக வழக்கைத் தக்கவைக்கிறது; இங்கு அது வெறும் அழைப்புப் பெயரை மட்டுமல்லாமல் கடவுள் வெளிப்படுத்தியுள்ள இயல்பையும் புகழையும் சுட்டலாம்.
- source_word: לְאֶחָי
  choice: என் சகோதரர்களுக்கு
  rationale: மூலத்தில் ஆண்பால் பன்மை பெயர்ச்சொல்லோடு முதலாம் நபர் உரிமை விகுதி உள்ளது. எனவே அதன் வெளிப்படையான வடிவம் முதன்மை உரையில் தக்கவைக்கப்படுகிறது; சூழலில் உள்ளடக்கிய பொருள் இருக்கக்கூடும் என்பது அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
- source_word: בְּתוֹךְ
  choice: நடுவில்
  rationale: கூடியிருக்கும் மக்களிடையே நிகழும் பொதுவான அறிவிப்பையும் புகழ்ச்சியையும் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: קָהָל
  choice: சபை
  rationale: קָהָל என்பது ஒன்றுகூடிய மக்களைக் குறிக்கிறது. ‘சபை’ நவீன தமிழில் புரிந்துகொள்ளக்கூடிய, கவிதைநடைக்கு ஏற்ற சொல்; இங்கு அது குறிப்பிட்ட பிற்கால நிறுவன அமைப்பை அவசியமாகக் குறிக்காது.
- source_word: אֲהַלְלֶךָּ
  choice: உம்மைப் புகழ்வேன்
  rationale: הלל என்பதன் பியேல் வடிவத்தின் நேரடியான பொருளான ‘புகழ்தல்’ என்பதையும், இரண்டாம் நபர் ஒருமை நேரடி செயப்படுபொருளையும் தக்கவைக்கிறது; மூலத்தில் இல்லாத பாடல் சார்ந்த கருத்து சேர்க்கப்படவில்லை.
theological_decisions:
- issue: பொது வழிபாட்டுச் சூழலில் வரும் பாலினம் குறிக்கப்பட்ட உறவுமுறைச் சொல்
  choice: என் சகோதரர்களுக்கு
  alternative: என் சகோதர சகோதரிகளுக்கு
  rationale: எபிரெயச் சொல் வெளிப்படையாக ஆண்பால் பன்மையில் இருப்பதால் முதன்மை உரை அதைப் பிரதிபலிக்கிறது. அது சமூகமுழுவதையும் உள்ளடக்கிப் பயன்படுத்தப்பட்டிருக்கலாம் என்ற சாத்தியம், மூலத்தில் வெளிப்படையாக இல்லாத சொற்களை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்கும் ஒருமை முன்னிலைக்கு தமிழில் வழக்கமான மரியாதை வடிவங்களான ‘உமது/உம்மை’ பயன்படுத்தப்பட்டுள்ளன. இரு இணையான அடிகளும் எதிர்கால வினைமுற்றுடன் அமைக்கப்பட்டு எபிரெயக் கவிதை இணைவு தக்கவைக்கப்பட்டுள்ளது.
