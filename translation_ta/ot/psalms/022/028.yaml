id: PSA.22.28
reference: Psalms 22:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֣י לַ֭/יהוָה הַ/מְּלוּכָ֑ה וּ֝/מֹשֵׁ֗ל בַּ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/028.yaml
  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
translation:
  language: ta
  text: ஏனெனில், அரசுரிமை யாவேக்கு உரியது[a]; அவர் நாடுகளை ஆளுகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ராஜ்யம் யாவேக்கு உரியது” அல்லது “ஆட்சி யாவேக்கு உரியது.” எபிரெயச் சொல் “ராஜ்யம்,” “அரசுரிமை,” அல்லது “ஆட்சி” எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கருத்துக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச்சொல்லின் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யெகோவாவுக்கே உரியது
  rationale: לְ குறிக்கும் உடைமை உறவைத் தமிழில் தெளிவாக வெளிப்படுத்துகிறது; יהוה என்ற தனிப்பெயர் தமிழில் வழக்கமான ‘யெகோவா’ என ஒலிபெயர்க்கப்படுகிறது. ‘-க்கே’ அரசாட்சி அவருக்கே உரியது என்ற வலியுறுத்தலை இயல்பாகத் தருகிறது.
- source_word: הַמְּלוּכָה
  choice: அரசாட்சி
  rationale: இச்சொல் அரசுரிமை, ஆட்சி அல்லது ராஜ்யம் ஆகிய பொருள்களைக் கொள்ளலாம். இங்கு ‘அரசாட்சி’ என்பது ஆளும் அதிகாரத்தையும் ஆட்சியையும் இயல்பாகக் குறிக்கிறது; பிற சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: וּמֹשֵׁל
  choice: அவரே ... ஆளுகிறார்
  rationale: Qal வினையெச்ச வடிவத்தின் தொடர்ந்த, பொதுவான ஆட்சிப் பொருளை நிகழ்காலத்தில் தருகிறது. எழுவாய் முந்தைய யெகோவாவையே குறிக்கிறது.
- source_word: בַּגּוֹיִם
  choice: தேசங்களை
  rationale: משׁל உடன் ב ஆட்சிக்குட்பட்டவர்களைக் குறிக்கிறது. גּוֹיִם என்பது இங்கு பொதுவாக உலகின் தேசங்களைக் குறிக்கிறது; பிற்கால மதப்பிரிவு சார்ந்த பொருள் சேர்க்கப்படவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் பொதுப்பட்டமல்ல, நான்கெழுத்து இறைப் பெயரே உள்ளது. அதனை மறைக்காமல் தமிழில் பரவலாக அறியப்பட்ட தனிப்பெயர் வடிவமான ‘யெகோவா’ என வழங்குகிறது.
- issue: מְלוּכָה என்பதன் பொருள் நுட்பம்
  choice: அரசாட்சி
  alternative: ராஜ்யம்; அரசுரிமை; ஆட்சி
  rationale: மூலச்சொல் ஆளுகையின் பரப்பு, அரசுரிமை, ஆட்சிச் செயல் ஆகியவற்றைக் குறிக்கக்கூடும். ‘அரசாட்சி’ முதன்மை உரையில் இயல்பாகவும் விரிவாகவும் அமைகிறது; உண்மையான சொற்பொருள் பல்வகைமையை அடிக்குறிப்பு குறிப்பிடுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற சுருக்கமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அவரே’ என்பது எபிரெய வாக்கியத்தின் எழுவாயையும் யெகோவாவின் ஆட்சியையும் இயல்பாகத் தெளிவுபடுத்துகிறது.
