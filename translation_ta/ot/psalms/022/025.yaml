  yaml_path: translation/ot/psalms/022/025.yaml
  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
translation:
  language: ta
  text: பெரிய சபையில் செலுத்தும் என் துதி உம்மிடமிருந்தே வருகிறது; அவருக்குப் பயப்படுகிறவர்கள் முன்னிலையில் என் நேர்த்திகளை நிறைவேற்றுவேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், முன்பு உம்மை நேரடியாகக் குறிப்பிட்ட பின், இங்கு ‘அவருக்குப் பயப்படுகிறவர்கள்’ என்று மூன்றாம் நபர் வடிவம் வருகிறது. சில மொழிபெயர்ப்புகள் ஒருமைப்பாட்டிற்காக ‘உமக்குப் பயப்படுகிறவர்கள்’ என்று தருகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאִתְּךָ
  choice: உம்மிடமிருந்தே வருகிறது
  rationale: מֵאֵתுடன் இரண்டாம் நபர் ஒருமை ஆண்பால் பின்னொட்டு, துதியின் மூலத்தைக் குறிக்கிறது. இயல்பான தமிழுக்காக ‘வருகிறது’ சேர்க்கப்பட்டு, வலியுறுத்தலைக் காட்ட ‘-ஏ’ பயன்படுத்தப்பட்டது.
- source_word: תְהִלָּתִי
  choice: நான் செலுத்தும் துதி
  rationale: சொல்லுக்கு நேரடியாக ‘என் துதி’ எனலாம்; ஆனால் தமிழில் அது துதிப்பவரையோ துதிக்கப்படுபவரையோ குறிக்கும் குழப்பம் தரலாம். இங்கு சங்கீதக்காரன் செலுத்தும் புகழ்ச்சியைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்க இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּקָהָל רָב
  choice: பெரிய சபையில்
  rationale: קָהָל கூடிய சமூகத்தையோ சபையையோ குறிக்கிறது; רָב அதன் பெருமையையோ எண்ணிக்கையையோ குறிக்கிறது. ‘பெரிய சபை’ சுருக்கமான, வழிபாட்டுச் சூழலுக்கு ஏற்ற நவீனத் தமிழ்.
- source_word: נְדָרַי
  choice: என் நேர்த்திக்கடன்களை
  rationale: இது கடவுளிடம் செய்த உறுதிமொழிகளைக் குறிக்கிறது. தமிழில் அவற்றை நிறைவேற்றும் வழிபாட்டுச் சூழலை ‘நேர்த்திக்கடன்’ இயல்பாக எடுத்துரைக்கிறது; பன்மை பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲשַׁלֵּם
  choice: நிறைவேற்றுவேன்
  rationale: פיעל வடிவில் வாக்குறுதி அல்லது நேர்த்திக்கடனைச் செலுத்துதல்/நிறைவேற்றுதல் என்ற பொருள். தமிழில் ‘நேர்த்திக்கடனை நிறைவேற்றுதல்’ தெளிவான வழக்குச் சொற்றொடர்.
- source_word: נֶגֶד
  choice: முன்பாக
  rationale: மற்றவர்களின் முன்னிலையிலும் பார்வையிலும் செய்வதைக் குறிக்கிறது; ‘முன்பாக’ சுருக்கமாக மூலத்தின் இடைச்சொல் பொருளைப் பாதுகாக்கிறது.
- source_word: יְרֵאָיו
  choice: அவருக்குப் பயப்படுகிறவர்கள்
  rationale: ஆண்பால் ஒருமை மூன்றாம் நபர் பின்னொட்டை ‘அவர்’ எனப் பாதுகாக்கிறது. ירא என்பதன் பயபக்தி சார்ந்த பரப்பை மென்மைப்படுத்தாமல் ‘பயப்படுகிறவர்கள்’ என வழங்குகிறது.
theological_decisions:
- issue: ‘உம்மிடமிருந்து’ என்ற இரண்டாம் நபரிலிருந்து ‘அவருக்குப் பயப்படுகிறவர்கள்’ என்ற மூன்றாம் நபருக்கு மாறுதல்
  choice: மசோரா உரையின் நபர் மாற்றத்தை அப்படியே வைத்தல்
  alternative: ஒருமைப்பாட்டிற்காக ‘உமக்குப் பயப்படுகிறவர்கள்’ என்று மாற்றுதல்
  rationale: எபிரேய உரை நேரடி அழைப்பிலிருந்து மூன்றாம் நபர் குறிப்புக்கு மாறுகிறது. அந்த இலக்கிய மற்றும் இறையியல் பதற்றத்தைச் சீராக்காமல் பாதுகாக்கப்பட்டது; சூழலில் இரண்டும் கடவுளையே குறிக்கின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய நேரடி உரையில் மரியாதைப் பன்மை ‘உம்’ வடிவமும், மூன்றாம் நபர் குறிப்பில் மரியாதையான ‘அவர்’ வடிவமும் பயன்படுத்தப்பட்டுள்ளன. மூலத்தில் உரைவேறுபாட்டு அடிக்குறிப்பு இல்லை; ஆங்கில ஆலோசனை அடுக்கின் [a] குறிப்பு உண்மையில் உரையில் உள்ள நபர் மாற்றத்தையே விளக்குவதால், மொழிபெயர்ப்பில் மாற்றம் தெளிவாகத் தக்கவைக்கப்பட்டு தனி அடிக்குறிப்பு சேர்க்கப்படவில்லை.
