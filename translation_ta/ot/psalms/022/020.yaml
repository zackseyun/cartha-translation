theological_decisions:
- issue: புலம்பல் சூழலில் נַפְשִׁי என்பதன் மனித இயல்பியல் பொருள்
  choice: ‘என் உயிரை’ என்று மொழிபெயர்த்தல்
  alternative: ‘என் ஆத்துமாவை’
  rationale: வாள் மற்றும் பகைவரிடமிருந்து மரண ஆபத்தில் காப்பாற்றும்படி வேண்டுவதால், இங்கு வாழும் நபரின் உயிரே இயல்பான பொருள்; உடல்–ஆத்துமா குறித்த பிற்காலத் தொழில்நுட்பப் பிரிவை உரைக்குள் புகுத்தாமல் இருக்கிறது.
- issue: יְחִידָתִי என்பதன் தெளிவற்ற குறிப்பீடு
  choice: நַפְשִׁי உடன் இணையாக ‘எனக்கிருக்கும் ஒரே உயிரை’
  alternative: ‘எனக்கிருக்கும் ஒரே ஒன்றை’ அல்லது ‘என் அருமையான உயிரை’
  rationale: பெண்பால் வடிவம் முந்தைய נַפְשִׁי உடன் கவிதை இணைப்பை அனுமதிக்கிறது. அதேவேளை அதன் சொற்பொருள் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், நேரடியான புலம்பல்-மன்றாட்டு நடையும் எபிரெயக் கவிதையின் இரு இணையான கூறுகளும் தக்கவைக்கப்பட்டுள்ளன. ‘நாய்’ என்ற ஒருமை உருவகம் விளக்கமாக ‘பகைவன்’ என்று மாற்றப்படவில்லை. வேண்டுகோளுக்கான மரியாதை வினைமுற்று ‘காப்பாற்றும்’ பயன்படுத்தப்பட்டுள்ளது.
