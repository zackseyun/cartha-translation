  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
translation:
  language: ta
  text: பூமியின் எல்லைகளிலுள்ள அனைவரும் நினைவுகூர்ந்து யாவேயிடம்[b] திரும்புவார்கள்; நாடுகளின் குடும்பங்கள் அனைத்தும் உமக்கு முன்பாகப் பணிந்துகொள்வார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமக்கு முன்பாக வழிபடுவார்கள்.” எபிரெய வினை சொல்லர்த்தமாக உடலைத் தாழ்த்திப் பணிவதைக் குறிக்கிறது; அது பெரும்பாலும் வழிபாட்டுச் செயலாக அமைகிறது.
    reason: lexical_alternative
  - marker: b
    text: “யாவே” என்பது எபிரெயத்தில் יהוה (YHWH) என்று எழுதப்படும் இறைப் பெயர்; சில மொழிபெயர்ப்புகள் இதை “கர்த்தர்” என்று வழங்குகின்றன.
    reason: alternative_reading
