- source_word: וְיִשְׁתַּחֲווּ
  choice: பணிந்துகொள்வார்கள்
  rationale: உடலைத் தாழ்த்திப் பணிதல் என்ற செயற்படிமத்தை வைத்துக்கொண்டு, சூழலில் உள்ள வழிபாட்டு அர்த்தத்தையும் திறந்தவாறு விடுகிறது.
- source_word: לְפָנֶיךָ
  choice: உமக்கு முன்பாக
  rationale: ‘உமது முகத்திற்கு முன்பாக’ என்ற எபிரெய மரபுத்தொடரின் இயல்பான தமிழ் வடிவம்; கடவுளை நோக்கிய ஒருமை மரியாதை விளியையும் காக்கிறது.
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  choice: நாடுகளின் குடும்பங்கள் அனைத்தும்
