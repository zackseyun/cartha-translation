translation:
  language: ta
  text: அவர்கள் என் ஆடைகளைத் தங்களுக்குள் பங்கிட்டுக்கொள்கிறார்கள்[a]; என் உடைக்காகச் சீட்டுப் போடுகிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இயேசு சிலுவையில் அறையப்பட்டதை விவரிக்கும் நற்செய்தி நூல்களில் இந்த வரி எதிரொலிக்கிறது; மத்தேயு 27:35; மாற்கு 15:24; லூக்கா 23:34; யோவான் 19:24 ஆகியவற்றைப் பார்க்கவும்.
    reason: cross_reference
lexical_decisions:
- source_word: יְחַלְּקוּ
  choice: பங்கிட்டுக்கொள்கிறார்கள்
  rationale: חלק என்பதன் பியேல் வடிவம் பலரிடையே பங்கிடுதலைக் குறிக்கிறது. சங்கீதத்தின் நிகழ்காட்சித் தன்மையைத் தக்கவைக்க நிகழ்காலம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: בְגָדַי
  choice: என் ஆடைகளை
  rationale: בגד என்பது ஆடைகள் அல்லது உடைகளைக் குறிக்கும் பொதுவான சொல். பன்மையைத் தக்கவைத்து, அடுத்த அரையடியில் வரும் ஒருமைச் சொல்லிலிருந்து வேறுபடுத்துகிறது.
- source_word: לָהֶם
  choice: தங்களுக்குள்
  rationale: சொல்லுக்கு நேராக ‘அவர்களுக்காக/அவர்களுக்கு’ என்று பொருள் இருந்தாலும், חלק உடன் இங்கு குழுவினர் தங்களிடையே பங்கிட்டுக்கொள்வதைக் குறிக்கிறது.
- source_word: לְבוּשִׁי
  choice: என் உடைக்காக
  rationale: לבוש உடை அல்லது ஆடை என்பதைக் குறிக்கிறது. எபிரெய ஒருமையைப் பாதுகாப்பதோடு, முதல் அரையடியின் பன்மையான ‘ஆடைகள்’ என்பதுடனான கவிதை இணைநிலையையும் வெளிப்படுத்துகிறது; ‘அங்கி’ போன்ற மிகக் குறிப்பிட்ட பொருள் சேர்க்கப்படவில்லை.
- source_word: יַפִּילוּ גוֹרָל
  choice: சீட்டுப் போடுகிறார்கள்
  rationale: נפל என்பதன் ஹிப்ஃபில் வடிவமும் גורל என்பதும் சேர்ந்து பங்கீடு அல்லது முடிவுக்காகச் சீட்டுப் போடும் வழக்குச் சொல்லாட்சியை உருவாக்குகின்றன. இயல்பான நவீனத் தமிழில் இந்த மரபுச் செயலைத் தெளிவாகக் கூறுகிறது.
theological_decisions:
- issue: மேசியாவைக் குறிக்கும் ஒலிப்பும் புதிய ஏற்பாட்டின் எதிரொலியும்
  choice: எபிரெய உரையை அதன் கவிதைச் சூழலின்படி நேரடியாக மொழிபெயர்த்து, சிலுவை மரணத்தைச் சுட்டும் வெளிப்படையான சொற்களை வசனத்துக்குள் சேர்க்கவில்லை.
  alternative: இயேசுவின் சிலுவை மரணத்தில் இது நிறைவேறியதை மொழிபெயர்ப்பிலேயே முன்னிறுத்துதல்.
  rationale: பாடுபாட்டு நிகழ்வுகளை விவரிக்கும் நற்செய்தி பகுதிகள் இந்த வரியை எதிரொலிக்கின்றன. எனினும், அந்தத் திருநூல் தொடர்பை அடிக்குறிப்பில் காட்டுவது பொருத்தமானது; மூல எபிரெய உரை கூறுவதற்கு மேலாக வசனத்தின் சொற்களை மாற்றக் கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. ‘ஆடைகள்’/‘உடை’ என்ற சொல் வேறுபாடு எபிரெய இணைநிலையின் பன்மை–ஒருமை நுட்பத்தைப் பாதுகாக்கிறது; நிகழ்கால வினைகள் கவிதையின் உயிரோட்டமான காட்சியைத் தக்கவைக்கின்றன.
