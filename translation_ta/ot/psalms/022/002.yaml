base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], I cry out by day, but you do not answer, and by night[b], but I have no rest.
translation:
  language: ta
  text: என் கடவுளே, பகலில் நான் கூக்குரலிடுகிறேன்; ஆனால் நீர் பதிலளிப்பதில்லை. இரவிலும் எனக்கு ஓய்வே இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொற்றொடரை இன்னும் நேரடியாக, “எனக்கு மௌனமே இல்லை” என்றும் மொழிபெயர்க்கலாம்; அதாவது, அவர் இரவிலும் மௌனமாயிராமல் தொடர்ந்து கூப்பிடுகிறார் என்று பொருள்கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: என் கடவுளே
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் வரும் நேரடி அழைப்பை இயல்பான தமிழ் விளிவேற்றுமையில் தருகிறது.
- source_word: אֶקְרָא
  choice: நான் கூக்குரலிடுகிறேன்
  rationale: புலம்பல் சூழலில் קרא என்பது சாதாரணமாக அழைப்பதைவிட, உதவி வேண்டி உரக்கக் கூப்பிடும் தீவிரத்தைக் குறிக்கிறது.
- source_word: יוֹמָם
  choice: பகலில்
  rationale: ‘பகல் வேளையில்’ என்ற வினையடைப் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது; அடுத்துள்ள ‘இரவிலும்’ என்பதோடு இணையான அமைப்பையும் காக்கிறது.
- source_word: וְלֹא תַעֲנֶה
  choice: ஆனால் நீர் பதிலளிப்பதில்லை
  rationale: எபிரெய இணைப்புச் சொல்லால் சூழலில் வெளிப்படும் எதிர்மறை முரணை ‘ஆனால்’ தெளிவாக்குகிறது; தேவனை நோக்கிய மரியாதையான ஒருமை ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְלַיְלָה
  choice: இரவிலும்
  rationale: பகல்–இரவு இணை அமைப்பைக் காத்து, செயல் இரவிலும் தொடர்வதை இயல்பான தமிழில் உணர்த்துகிறது.
- source_word: וְלֹא דֽוּמִיָּה לִי
  choice: எனக்கு ஓய்வே இல்லை
  rationale: דומיה என்பதன் ‘மௌனம், அமைதி, ஓய்வு’ என்ற பொருள் வரம்பில், தமிழ் வாசகருக்குப் புலம்புபவரின் இடையறாத கூக்குரலையும் ஓய்வின்மையையும் இயல்பாக எடுத்துரைக்கிறது; மூலத்தின் நேரடியான ‘மௌனம்’ உருவகம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: וְלֹא דֽוּמִיָּה לִי என்ற இறுதித் தொடரின் பொருள்
  choice: புலம்புபவருக்கு இரவிலும் ஓய்வு இல்லை
  alternative: எனக்கு மௌனமே இல்லை / நான் மௌனமாயிருப்பதில்லை
  rationale: דומיה என்பதற்கு மௌனம், அமைதி, ஓய்வு ஆகிய தொடர்புடைய பொருள்கள் உள்ளன. அதை ‘பதில் இல்லை’ என்று மாற்றுவது பகலில் கடவுள் பதிலளிக்காததை இரண்டாம் முறையாகக் கூறுவதாகக் கட்டுப்படுத்திவிடும். ‘ஓய்வே இல்லை’ என்பது இயல்பான தமிழில் துயரத்தின் தொடர்ச்சியைத் தருகிறது; ‘மௌனம்’ என்ற மூல உருவகமும் அதன் சாத்தியமான வாசிப்பும் அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்கு எளிதாகவும் சங்கீதப் புலம்பலுக்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘கூக்குரலிடுகிறேன்’ வேண்டுதலின் தீவிரத்தையும், ‘நீர்’ தேவனை நோக்கிய மரியாதையான நேரடி உரையையும் காக்கின்றன. எபிரெயக் கவிதையின் பகல்–இரவு இணை அமைப்பு இரண்டு வாக்கியங்களாகத் தெளிவுபடுத்தப்பட்டுள்ளது.
