  yaml_path: translation/ot/psalms/022/001.yaml
  text: My God[a], my God[c][b], why have you forsaken me? Far from my salvation are the words of my roaring.
translation:
  language: ta
  text: என் இறைவனே, என் இறைவனே, ஏன் என்னைக் கைவிட்டீர்? என் கர்ஜனையின் வார்த்தைகள் என் மீட்பிலிருந்து வெகு தொலைவில் உள்ளன.[a][b]
  philosophy: optimal-equivalence
  footnotes:
