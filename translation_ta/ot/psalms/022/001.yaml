    text: “என் மீட்பு” என்பதற்கு மாற்றாக “என் விடுவிப்பு,” “என் இரட்சிப்பு,” அல்லது “என் உதவி” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என் கர்ஜனை” என்பது கடும் வேதனையில் எழும் உரத்த கதறலைக் குறிக்கும் வலுவான உருவகம்; “என் கதறல்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלִי אֵלִי
  choice: என் இறைவனே, என் இறைவனே
  rationale: உடைமைப் பின்னொட்டையும் இருமுறை வரும் நேரடி அழைப்பையும் காக்கிறது; புலம்பலின் தீவிரத்தையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לָמָה
  choice: ஏன்
  rationale: காரணத்தை வினவும் எபிரெயச் சொல்லுக்கு இயல்பான, நேரடியான தமிழ் இணை.
- source_word: עֲזַבְתָּנִי
  choice: என்னைக் கைவிட்டீர்
  rationale: ‘விட்டுவிடுதல், கைவிடுதல்’ என்ற வினையின் தீவிரத்தைக் காக்கிறது; இறைவனை நேரடியாக அழைக்கும் தமிழுக்கேற்ற மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது.
- source_word: רָחוֹק
  choice: வெகுதொலைவில்
  rationale: தூரத்தையும் பிரிவின் தீவிரத்தையும் தெளிவாகக் காட்டுகிறது.
- source_word: מִישׁוּעָתִי
  choice: என் விடுவிப்பிலிருந்து
  rationale: இப்புலம்பலில் எதிர்பார்க்கப்படும் நடைமுறை மீட்பு அல்லது தப்புவிப்பைக் குறிக்கிறது; பின்னாளின் கோட்பாட்டுப் பொருளுக்கு மட்டும் சுருக்கவில்லை.
- source_word: דִּבְרֵי
  choice: வார்த்தைகள்
  rationale: எபிரெயக் கட்டுநிலைப் பன்மையை நேரடியாகக் காக்கிறது.
- source_word: שַׁאֲגָתִי
  choice: என் கர்ஜனையின்
  rationale: விலங்கின் கர்ஜனையையும் கடும் வேதனையால் எழும் உரத்த கதறலையும் குறிக்கக்கூடிய வலுவான எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: மெசியாவோடு தொடர்புபடுத்தப்படும் இச்சங்கீதத்தில் יְשׁוּעָה என்பதன் மொழிபெயர்ப்பு
  choice: என் விடுவிப்பு
  alternative: என் மீட்பு / எனக்குக் கிடைக்கும் உதவி
  rationale: உடனடி சூழலில் சங்கீதக்காரர் எதிர்பார்க்கும் தப்புவிப்பை முன்னிறுத்துகிறது; செல்லத்தக்க பிற பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- issue: இறுதி அரையடியின் சுருக்கமான தொடரியல்
  choice: என் விடுவிப்பிலிருந்து என் கர்ஜனையின் வார்த்தைகள் வெகுதொலைவில் இருக்கின்றன
  alternative: என்னை விடுவிப்பதிலிருந்தும் என் கதறலின் வார்த்தைகளிலிருந்தும் நீர் ஏன் தொலைவில் இருக்கிறீர்?
  rationale: எபிரெயத்தில் வெளிப்படையாக இல்லாத இரண்டாவது வினாவையும் எழுவாயையும் சேர்க்காமல், அதன் சுருக்கத்தையும் இயல்பான பொருள் இழுப்பையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான புலம்பல் நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை எபிரெய வடிவம் தமிழில் வழக்கமான மரியாதை வடிவமான “நீர்/கைவிட்டீர்” என வெளிப்படுத்தப்பட்டுள்ளது. இறுதி அரையடியின் அசாதாரண எபிரெய அமைப்பு மென்மையாக்கப்படாமல் முடிந்தவரை காக்கப்பட்டுள்ளது.
