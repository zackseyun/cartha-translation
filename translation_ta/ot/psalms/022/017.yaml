source:
  edition: WLC
  text: אֲסַפֵּ֥ר כָּל עַצְמוֹתָ֑/י הֵ֥מָּה יַ֝בִּ֗יטוּ יִרְאוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/017.yaml
  text: I can count all my bones[a]; they look[b], they stare at me.
translation:
  language: ta
  text: என் எலும்புகளையெல்லாம் என்னால் எண்ண முடிகிறது[a]; அவர்களோ என்னை நோக்குகிறார்கள்; உற்றுப் பார்க்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் எலும்புகளையெல்லாம் எண்ணுகிறேன்.’ எபிரெய வினைச்சொல்லுக்கு ‘எண்ணுதல்’ அல்லது ‘எண்ணிக்கையைச் சொல்லுதல்’ என்று பொருள் கொள்ளலாம்; ஆனால் ‘என் எலும்புகளையெல்லாம்’ என்ற செயப்படுபொருள், அவற்றை ஒவ்வொன்றாக எண்ணுவதையே இங்கு சுட்டுகிறது.
    reason: lexical_alternative
  - marker: b
    text: 'பார்ப்பதைக் குறிக்கும் இரண்டு எபிரெய வினைச்சொற்கள் வலியுறுத்தலுக்காக இணைக்கப்பட்டுள்ளன: ‘அவர்கள் நோக்குகிறார்கள், உற்றுப் பார்க்கிறார்கள்’ அல்லது ‘அவர்கள் நோக்குகிறார்கள், பார்க்கிறார்கள்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפֵּר
  choice: என்னால் எண்ண முடிகிறது
  rationale: פִּעֵל வடிவிலுள்ள ספר என்பதற்கு ‘எண்ணுதல்’ அல்லது ‘விவரித்துச் சொல்லுதல்’ என்ற பொருள்கள் உண்டு. ‘என் எலும்புகளையெல்லாம்’ என்பது அதன் நேரடிப் பொருளாக இருப்பதால், ஒவ்வொன்றாக எண்ணக்கூடிய அளவுக்கு அவை வெளிப்படுகின்றன என்ற சூழல்சார் பொருளை இந்த இயல்பான தமிழ் நடை வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: எல்லாம்
  rationale: எபிரெயச் சொல்லில் வலியுறுத்தப்படும் முழுமையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: עַצְמוֹתָי
  choice: என் எலும்புகள்
  rationale: பேசுபவரின் உடல் வேதனையையும் மெலிவையும் தெளிவாகவும் உருவக விரிவாக்கமின்றியும் காட்டும் நேரடி மொழிபெயர்ப்பு.
- source_word: הֵמָּה
  choice: அவர்களோ
  rationale: பகைமையுடன் பார்த்துக்கொண்டிருப்பவர்களைக் குறிக்கும் தனித்த வலியுறுத்தல் சுட்டுப்பெயரை ‘அவர்களோ’ என வழங்குவது தமிழ் வாக்கியத்தில் எதிர்நிலையையும் வலியுறுத்தலையும் காக்கிறது.
- source_word: יַבִּיטוּ
  choice: நோக்குகிறார்கள்
  rationale: கவனத்தைத் திருப்பிப் பார்ப்பதைக் குறிக்கும் முதல் வினையை நவீனத் தமிழில் இயல்பாக வழங்குகிறது; அடுத்த வினை அதன் தீவிரத்தை அதிகரிக்கிறது.
- source_word: יִרְאוּ
  choice: என்னையே உற்றுப் பார்க்கிறார்கள்
  rationale: ראה என்பதன் அடிப்படைப் பொருள் ‘பார்த்தல்’ என்றாலும், இணையாக வரும் இரு பார்வை வினைகளின் வலியுறுத்தலைத் தமிழில் வெளிப்படுத்த ‘உற்றுப் பார்க்கிறார்கள்’ என வழங்கப்பட்டுள்ளது. ‘என்னையே’ என்பது பார்வையின் இலக்கை இயல்பாக வலியுறுத்துகிறது.
- source_word: בִי
  choice: என்னை / என்னையே
  rationale: பார்வை வினைகளுடன் வரும் בִּי என்பதைக் தமிழ் வழக்கிற்கேற்ப ‘என்னை’ என்று வழங்கி, இரண்டாவது இணை வினையில் கவித்துவ வலியுறுத்தலுக்காக ‘என்னையே’ எனக் கூறுகிறது.
theological_decisions:
- issue: கிறிஸ்தவ மரபில் மேசியாவைப் பற்றிய பயன்பாடு
  choice: சிலுவை மரணத்தைச் சுட்டும் தனிப்பட்ட சொற்களைச் சேர்க்காமல், எபிரெயக் கவிதையின் உடல் வேதனையையும் பகைமையான பார்வையாளர்களையும் நேரடியாக மொழிபெயர்த்தல்
  alternative: கிறிஸ்துவைப் பற்றிய மரபுவழி வாசிப்பைத் தெளிவாக்கும் வகையில் சிலுவை மரணத் தொடர்பை மொழியில் அதிகமாக வெளிப்படுத்துதல்
  rationale: சங்கீதம் 22 கிறிஸ்தவ விளக்கத்தில் ஆழ்ந்த முக்கியத்துவம் உடையது. எனினும், இந்த வரியின் எபிரெய உரை கண்களுக்கு வெளிப்படும் உடல் வேதனையையும் பார்த்துக்கொண்டிருப்பவர்களையும் மட்டுமே கூறுகிறது. ஆகவே, கிறிஸ்துவியல் தொடர்புகள் சூழலிலிருந்தும் திருமுறை முழுமையிலிருந்தும் எழ அனுமதித்து, அவற்றை மொழிபெயர்ப்புக்குள் கூடுதலாகச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘என்னால் எண்ண முடிகிறது’ என்பது எபிரெயச் சொல்லின் சூழல்சார் இயல்பைத் தருகிறது; ‘நோக்குகிறார்கள், உற்றுப் பார்க்கிறார்கள்’ என்பது மூலத்தின் இணை பார்வை வினைகளையும் தீவிரத்தையும் பாதுகாக்கிறது.
