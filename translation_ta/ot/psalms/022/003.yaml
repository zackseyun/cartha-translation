  text: וְ/אַתָּ֥ה קָד֑וֹשׁ י֝וֹשֵׁ֗ב תְּהִלּ֥וֹת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/003.yaml
  text: Yet you are holy[a], enthroned on the praises of Israel.
translation:
  language: ta
  text: ஆனாலும், நீர் பரிசுத்தர்; இஸ்ரவேலின் துதிகளின்மேல் வீற்றிருக்கிறீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனாலும், நீர் பரிசுத்தர்; இஸ்ரவேலின் துதிகளில் குடியிருக்கிறீர்.” எபிரெயப் பங்கேற்புவினை “அமர்ந்திருக்கிறீர்” அல்லது “குடியிருக்கிறீர்” என்றும் புரிந்துகொள்ளப்படலாம்; கவிதைச் சூழலில் அரசருக்குரிய “வீற்றிருக்கிறீர்” என்ற பொருள் நன்கு பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: ஆனாலும், நீர்
  rationale: முந்தைய புலம்பலுக்கு எதிர்மாறான திருப்பத்தை இணைப்புச்சொல்லும் தனிப்பட்ட சுட்டுப்பெயரும் காட்டுகின்றன. மரியாதையான நேரடி அழைப்பையும் அந்த எதிர்மறைத் தொடர்பையும் இச்சொற்றொடர் இயல்பாகப் பாதுகாக்கிறது.
- source_word: קָדוֹשׁ
  choice: பரிசுத்தர்
  rationale: தேவனுடைய பரிசுத்தத் தன்மையை முழுமையாகக் குறிக்கும் வழக்கமான, கண்ணியமான தமிழ் சொல் இது; வெறுமனே ‘தனியே பிரிக்கப்பட்டவர்’ என்று சுருக்கவில்லை.
- source_word: יֹשֵׁב
  choice: அரியணையில் வீற்றிருக்கிறீர்
  rationale: எபிரெயப் பங்கேற்புவினை அடிப்படையில் ‘அமர்ந்திருத்தல்/குடியிருத்தல்’ என்று பொருள்படலாம்; தேவனைப் பற்றிய இக்கவிதைச் சூழலில் அரசருக்குரிய அரியணைக் காட்சி முதன்மையாகத் தெரிகிறது.
- source_word: תְּהִלּוֹת
  choice: துதிகள்
  rationale: பன்மை வடிவத்தையும் பல்வேறு துதிவெளிப்பாடுகள் என்ற பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: יִשְׂרָאֵל
  choice: இஸ்ரவேல்
  rationale: தமிழ் வேதாகம வழக்கில் பரவலாக அறியப்படும் பெயர் வடிவம் பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל என்ற சொற்றொடரின் பொருள்
  choice: தேவன் இஸ்ரவேலின் துதிகளின்மேல் அரியணையில் வீற்றிருப்பவராக அரசக் கவிதைப் படிமத்தில் சித்தரிக்கப்படுகிறார்.
  alternative: தேவன் இஸ்ரவேலின் துதிகளில் குடியிருக்கிறார்.
  rationale: יֹשֵׁב என்பதிலுள்ள அமர்தல் அல்லது குடியிருத்தல் என்ற உண்மையான பொருள் விரிவை அடிக்குறிப்பு பாதுகாக்கிறது. முதன்மை உரையில், தேவனை அரசராகச் சித்தரிக்கும் கவிதைப் பின்னணிக்கு ‘அரியணையில் வீற்றிருக்கிறீர்’ நன்கு பொருந்துகிறது; உருவகத்தை ஓர் அரூபக் கூற்றாக மாற்றவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான இறைமுகப்பு நடை பயன்படுத்தப்பட்டுள்ளது. கவிதைத் தன்மைக்காகச் சுருக்கமான இருபகுதி அமைப்பும் அரச உருவகமும் தக்கவைக்கப்பட்டுள்ளன; ‘நீர்/இருக்கிறீர்’ வடிவங்கள் மரியாதையையும் நேரடி அழைப்பையும் வெளிப்படுத்துகின்றன.
