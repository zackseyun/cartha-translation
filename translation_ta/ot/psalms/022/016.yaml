source:
  edition: WLC
  text: כִּ֥י סְבָב֗וּ/נִי כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּ/נִי כָּ֝/אֲרִ֗י יָדַ֥/י וְ/רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/016.yaml
  text: For dogs have surrounded me[a]; a company of evildoers has encircled me[b]; like a lion are my hands and my feet.
translation:
  language: ta
  text: ஏனெனில், நாய்கள் என்னைச் சூழ்ந்துகொண்டன; தீமை செய்கிறவர்களின் கூட்டம் என்னை வளைத்துக்கொண்டது; சிங்கத்தைப் போல என் கைகளும் என் கால்களும் இருக்கின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சவக்கடல் சுருள்கள், செப்துவஜிந்த் மற்றும் பல மொழிபெயர்ப்புகள், மசோரா உரையிலுள்ள கடினமான ‘சிங்கத்தைப் போல என் கைகளும் என் கால்களும் இருக்கின்றன’ என்பதற்குப் பதிலாக, ‘என் கைகளையும் என் கால்களையும் அவர்கள் துளைத்தார்கள்’ (அல்லது ‘தோண்டித் துளைத்தார்கள்’) என்று வாசிக்கின்றன.
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: புலம்பலுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் வலிமையைத் தக்கவைக்கிறது.
- source_word: סְבָבוּנִי
  choice: என்னைச் சூழ்ந்துகொண்டன
  rationale: סבב என்பதன் ‘சூழ்தல்’ என்ற பொருளையும், பகைவர்கள் முற்றுகையிட்ட நிலையின் தொடரும் விளைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּלָבִים
  choice: நாய்கள்
  rationale: பகைவர்களை இழிவான விலங்கு உருவகத்தால் சித்தரிக்கும் எபிரெயச் சொல்லை விளக்கமாக மாற்றாமல் நேரடியாகத் தக்கவைக்கிறது.
- source_word: עֲדַת מְרֵעִים
  choice: தீமை செய்கிறவர்களின் கூட்டம்
  rationale: עֲדָה என்பதன் கூடியுள்ள குழு என்ற பொருளையும் מְרֵעִים என்பதன் தீமை செய்பவர்கள் என்ற செயற்பொருளையும் தெளிவாகக் காட்டுகிறது.
- source_word: הִקִּיפוּנִי
  choice: என்னை வளைத்துக்கொண்டது
  rationale: சுற்றி அடைத்தல் என்ற பொருளைத் தருவதோடு, முதல் அடியின் ‘சூழ்ந்துகொண்டன’ என்பதிலிருந்து சிறு சொல்வேறுபாட்டையும் இணைவடிவையும் காக்கிறது.
- source_word: כָּאֲרִי
  choice: சிங்கத்தைப் போல
  rationale: மசோரா உரையின் நேரடி வாசிப்பை முதன்மை உரையில் வைத்திருக்கிறது; அதன் கடினமான வாக்கிய அமைப்பை விளக்கச் சொற்கள் சேர்த்து தீர்மானிக்கவில்லை.
- source_word: יָדַי וְרַגְלָי
  choice: என் கைகளும் என் கால்களும்
  rationale: உடல் உறுப்புகளைக் குறிக்கும் சொற்களை நேரடியாகவும் இயல்பான தமிழிலும் மொழிபெயர்க்கிறது.
theological_decisions:
- issue: כָּאֲרִי என்ற மசோரா வாசிப்புக்கும் ‘துளைத்தார்கள்/தோண்டித் துளைத்தார்கள்’ என்ற பண்டைய மாற்று வாசிப்புக்கும் இடையிலான உரை வேறுபாடு
  choice: முதன்மை உரையில் ‘சிங்கத்தைப் போல’
  alternative: ‘என் கைகளையும் என் கால்களையும் அவர்கள் துளைத்தார்கள்’ அல்லது ‘தோண்டித் துளைத்தார்கள்’
  rationale: வாக்கிய அமைப்பு கடினமாக இருந்தாலும், வழங்கப்பட்ட WLC மசோரா உரையை முதன்மைப்படுத்துகிறது. சவக்கடல் சுருள்களும் செப்துவஜிந்தும் ஆதரிக்கும் முக்கியமான மாற்று வாசிப்பை மறைக்காமல் அடிக்குறிப்பில் தருகிறது; கிறிஸ்தவ இறையியல் மரபினால் அதை முதன்மை உரைக்குள் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; கவிதைக்குரிய கண்ணியத்துடன் பொதுவாசகர்கள் புரிந்துகொள்ளும் நடை. மசோரா உரையின் இயல்பாகவே கடினமான இறுதிச் சொற்றொடர், தேவையற்ற செயப்படுபொருள் அல்லது தாக்குதல் விளக்கத்தைச் சேர்க்காமல் தக்கவைக்கப்பட்டுள்ளது.
