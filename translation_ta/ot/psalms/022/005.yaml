translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற மரியாதையும் சுருக்கமும் காக்கப்பட்டுள்ளன. தேவனைச் சுட்ட ‘உம்மை’ என்ற மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணையான எபிரெய வாக்கியங்களின் அமைப்பை அரைப்புள்ளிகள் வழியாகத் தெளிவாகப் பேணியுள்ளது.
