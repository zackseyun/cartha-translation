  terminology: The respectful singular “உம்மை” is consistent and appropriate for addressing God. “விடுவிக்கப்பட்டார்கள்” preserves the passive/rescue sense of נִמְלָטוּ without over-specifying the means, and “அவமானமடையவில்லை” suitably conveys the honor-and-shame outcome of ולא בשו. Both footnotes give legitimate alternatives and remain anchored to the relevant expressions.
