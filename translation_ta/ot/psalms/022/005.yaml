  source_fidelity: 'The rendering accurately follows the Hebrew parallelism: the ancestors cried to God, were delivered, trusted in him, and did not come to shame. “உம்மை நோக்கி” appropriately renders the directional force of אֵלֶיךָ, while “உம்மை நம்பினார்கள்” is idiomatic Tamil for בטחו ב.'
