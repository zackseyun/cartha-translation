reference: Psalms 22:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יֹאכְל֬וּ עֲנָוִ֨ים וְ/יִשְׂבָּ֗עוּ יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑י/ו יְחִ֖י לְבַבְ/כֶ֣ם לָ/עַֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/026.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
translation:
  language: ta
  text: துன்புற்றவர்கள்[a] உண்டு நிறைவடைவார்கள்[c]; அவரைத் தேடுகிறவர்கள் யாவேயைப் புகழ்வார்கள். உங்கள் உள்ளம்[b] என்றென்றும் வாழட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘தாழ்மையுள்ளவர்கள்,’ ‘ஏழைகள்,’ அல்லது ‘சாந்தமானவர்கள்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் ‘உள்ளம்’ என்பது ஒருமை; ‘உங்கள்’ என்பது பன்மை. இது இங்கு அழைக்கப்படும் சமூகத்தின் கூட்டு உள்ளார்ந்த வாழ்வைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: இந்தச் சங்கீதத்தின் சூழலில், உண்பது ஒரு பலி விருந்தையோ நேர்த்திக்கடன் விருந்தையோ சுட்டக்கூடும்; ஆனால் இவ்வசனம் அதை வெளிப்படையாகக் கூறவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: עֲנָוִים
  choice: துன்புற்றவர்கள்
  rationale: இச்சொல் தாழ்மையுள்ளவர்கள், ஏழைகள், துன்பத்தால் தாழ்த்தப்பட்டவர்கள் எனப் பலவாறு பொருள்படலாம். சங்கீதத்தின் துன்பத்திலிருந்து மீட்புக்கும் பொதுவழிபாட்டுக்கும் நகரும் சூழலில், ‘துன்புற்றவர்கள்’ என்பது அவர்களின் அனுபவ நிலையைக் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  choice: உண்டு நிறைவடைவார்கள்
  rationale: உண்பதையும் போதுமான அளவு பெற்று நிறைவடைவதையும் நேரடியாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יְהַלְלוּ
  choice: புகழ்வார்கள்
  rationale: பீயேல் வினையின் தீவிரமான வழிபாட்டுச் செயலைத் தெளிவாகக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: דֹּרְשָׁיו
  choice: அவரைத் தேடுகிறவர்கள்
  rationale: இறைவனைத் தொடர்ந்து நாடுகிறவர்களைக் குறிக்கும் பங்கேற்பு வடிவின் தொடர்ச்சியான நோக்கத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: יְחִי
  choice: வாழட்டும்
  rationale: இங்கு இது ஒரு வாழ்த்தாக அல்லது ஆசீர்வாதமாகச் செயல்படுவதால், தமிழ் வாழ்த்துவினை வடிவம் பொருத்தமானது.
- source_word: לְבַבְכֶם
  choice: உங்கள் உள்ளம்
  rationale: எபிரேயத்தில் ‘இதயம்’ ஒருமையாகவும் ‘உங்கள்’ என்பது பன்மையாகவும் உள்ளது. ‘உள்ளம்’ என்பது உணர்ச்சியை மட்டும் அல்லாமல் உள்ளார்ந்த வாழ்வையும் குறித்து, சமூகத்தை ஒருமொத்தமாகச் சுட்டும் ஒருமையைப் பாதுகாக்கிறது.
- source_word: לָעַד
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தைச் சுட்டும் இயல்பான, கண்ணியமான தமிழ் வடிவம்.
theological_decisions:
- issue: இறுதிக் கூறின் முகவரியும் ‘இதயம்’ என்பதன் எண்ணும்
  choice: ‘உங்கள் உள்ளம் என்றென்றும் வாழட்டும்’ என்று இரண்டாம் நபர் பன்மை முகவரியையும் கூட்டு ஒருமையையும் தக்கவைத்தல்
  alternative: ‘உங்கள் உள்ளங்கள் என்றென்றும் வாழட்டும்’ அல்லது ‘அவர்களுடைய உள்ளம் என்றென்றும் வாழும்’
  rationale: மூலத்தில் உடைமைப் பின்னொட்டு இரண்டாம் நபர் பன்மை; ஆனால் ‘இதயம்/உள்ளம்’ ஒருமை. நேரடி ஆசீர்வாதத்தையும் சமூகத்தின் கூட்டு உள்ளார்ந்த வாழ்வையும் தீர்த்துவிடாமல் இவ்வடிவம் காக்கிறது.
- issue: உண்ணுதலின் தன்மை
  choice: பலியுணவு என்று முதன்மை உரையில் குறிப்பிடாமல், ‘உண்டு நிறைவடைவார்கள்’ என்று நேரடியாக மொழிபெயர்த்தல்
  alternative: ‘பலியுணவை உண்டு நிறைவடைவார்கள்’
  rationale: சங்கீதத்தின் விரிந்த சூழல் நேர்த்திக்கடன் அல்லது பலி விருந்தைக் குறிப்பதாக இருக்கலாம்; ஆனால் இவ்வசனம் அதை வெளிப்படையாகச் சொல்லாததால் அந்த விளக்கம் முதன்மை உரையில் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. ‘யாவே’ என இறைப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; எபிரேயத்தின் கூட்டு ஒருமை ‘உங்கள் உள்ளம்’ என்பதில் திட்டமிட்டு பாதுகாக்கப்பட்டுள்ளது.
