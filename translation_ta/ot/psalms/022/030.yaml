  text: זֶ֥רַע יַֽעַבְדֶ֑/נּוּ יְסֻפַּ֖ר לַֽ/אדֹנָ֣/י לַ/דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/030.yaml
  text: A seed will serve him; it will be proclaimed about the Lord to the generation.
translation:
  language: ta
  text: ஒரு சந்ததி அவருக்குப் பணிசெய்யும்; ஆண்டவரைப் பற்றி வருங்காலத் தலைமுறைக்கு அறிவிக்கப்படும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶרַע
  choice: ஒரு சந்ததி
  rationale: எபிரெயச் சொல் அடிப்படையில் ‘விதை’ எனப் பொருள்பட்டாலும், மனித வழித்தோன்றல் அல்லது சந்ததியைக் குறிக்கும் இயல்பான தமிழ்ச் சொல் ‘சந்ததி’; ஒருமை வடிவத்தின் கூட்டு உணர்வையும் இது தக்கவைக்கிறது.
- source_word: יַעַבְדֶנּוּ
  choice: அவருக்குப் பணிசெய்யும்
  rationale: עבד வினையின் ‘சேவை செய்/பணிசெய்’ என்ற பொருளையும், ஆண்பால் ஒருமை பின்னொட்டின் ‘அவருக்கு’ என்ற குறிப்பையும் நேரடியாகத் தருகிறது.
- source_word: יְסֻפַּר
  choice: அறிவிக்கப்படும்
  rationale: Pual வினை வடிவத்தின் செயப்பாட்டு உணர்வைத் தக்கவைக்கிறது; சூழலில் ‘எடுத்துரைக்கப்படும்/சொல்லப்படும்’ என்ற பொது அறிவித்தலை இயல்பான தமிழில் வழங்குகிறது.
- source_word: לַאדֹנָי
  choice: ஆண்டவரைப் பற்றி
  rationale: இங்குள்ள ל முன்னொட்டை அறிக்கையின் பொருளைக் குறிக்கும் ‘பற்றி’ எனப் புரிந்துகொள்கிறது; אֲדֹנָי என்பதற்கு மரியாதையான வழக்குத் தமிழ் ‘ஆண்டவர்’ பயன்படுத்தப்படுகிறது.
- source_word: לַדּוֹר
  choice: வருங்காலத் தலைமுறைக்கு
  rationale: சொல்லுக்கு நேராக ‘அந்தத் தலைமுறைக்கு’ என்றாலும், சங்கீதத்தின் தொடர்ச்சியான காலநோக்கில் இன்னும் வரவிருக்கும் தலைமுறையைச் சுட்டுவதை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: זֶרַע என்பதன் தனிநபர் அல்லது கூட்டுச் சந்ததி குறிப்பு
  choice: ‘ஒரு சந்ததி’ என்று மொழிபெயர்த்து கூட்டு ஒருமையின் திறந்த தன்மையைப் பாதுகாத்தல்
  alternative: ‘வழித்தோன்றல்கள்’ அல்லது ‘ஒரு வித்து’
  rationale: மூலத்தின் ஒருமை இலக்கண வடிவத்தை அழிக்காமலும், அதைத் தனிப்பட்ட ஒருவராகவோ பல நபர்களாகவோ கோட்பாட்டரீதியாகத் தீர்மானிக்காமலும் விடுகிறது.
- issue: לַאדֹנָי என்பதன் தொடர்பு
  choice: ‘ஆண்டவரைப் பற்றி’
  alternative: ‘ஆண்டவருக்காக’ அல்லது ‘ஆண்டவரிடம்’
  rationale: ספר வினையுடன் ל அறிக்கையின் பொருளைக் குறிக்கக்கூடும்; வசனச் சூழலிலும் ஆண்டவரின் செயல் அடுத்த தலைமுறைக்கு எடுத்துரைக்கப்படுவது பொருந்துகிறது. இருப்பினும் முன்னொட்டின் சுருக்கமான அமைப்பில் சிறு தெளிவின்மை உள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான கவிதைநடை. ‘ஒரு சந்ததி’ என்பது மூல எபிரெயத்தின் கூட்டு ஒருமையையும் உண்மையான பொருள் விரிவையும் காக்கிறது; ‘வருங்காலத் தலைமுறை’ சூழல்சார் காலநோக்கைத் தெளிவாக்குகிறது.
