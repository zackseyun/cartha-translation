  source_fidelity: எபிரெய மூலத்தின் கூட்டொருமை זֶרַע (‘சந்ததி’), அவரைச் சுட்டும் பின்னொட்டு (‘அவருக்கு’), மற்றும் செயப்பாட்டு יְסֻפַּר (‘அறிவிக்கப்படும்’) ஆகியவை தக்கவைக்கப்பட்டுள்ளன. לַאדֹנָי-யின் சுருக்கமான தொடர்பை ‘ஆண்டவரைப் பற்றி’ என வழங்குவது சாத்தியமானதும் ஆங்கில POB audit உரையான “proclaimed about the Lord” என்பதுடனும் ஒத்ததும் ஆகும். ‘வருங்காலத் தலைமுறை’ என்பது உடனடியான சூழலின் எதிர்கால நோக்கத்தைக் காட்டுகிறது; மூலத்தின் பொருளுக்கு முரணில்லை.
