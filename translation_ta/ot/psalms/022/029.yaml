source:
  edition: WLC
  text: אָכְל֬וּ וַ/יִּֽשְׁתַּחֲוּ֨וּ כָּֽל דִּשְׁנֵי אֶ֗רֶץ לְ/פָנָ֣י/ו יִ֭כְרְעוּ כָּל יוֹרְדֵ֣י עָפָ֑ר וְ֝/נַפְשׁ֗/וֹ לֹ֣א חִיָּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
translation:
  language: ta
  text: பூமியின் செழிப்பானவர்கள் அனைவரும் உண்பார்கள், பணிந்து வணங்குவார்கள்[a]; மண்ணை நோக்கி இறங்கிச் செல்லும் அனைவரும் அவர் முன்னிலையில் மண்டியிடுவார்கள்[b]—தன் உயிரைக் காப்பாற்றிக்கொள்ள முடியாதவனும்கூட[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய மொழியில் சொல்லர்த்தமாக, ‘பூமியின் கொழுத்தவர்கள்’; இது செழிப்பானவர்களை அல்லது நன்கு உண்டு வாழ்பவர்களைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மண்ணை நோக்கி இறங்குகிற அனைவரும்.’ ‘மண்’ என்பது மரணத்தன்மையையும் மரணத்தையும் குறிக்கும் எபிரெய உருவகம்.
    reason: lexical_alternative
  - marker: c
    text: இறுதி எபிரெயக் கூறு பொருள் காணக் கடினமானது. நெருங்கிய சொல்லர்த்தமாக, ‘அவன் தன் உயிரை வாழவைக்கவில்லை.’ இது பொதுவாக, ‘தன் உயிரைக் காப்பாற்றிக்கொள்ள முடியாதவனும்கூட’ என்று புரிந்துகொள்ளப்படுகிறது; ‘அவனுடைய உயிர் காக்கப்படவில்லை’ என்றும் வாசிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: உண்டு
  rationale: இது நிறைவுற்ற வினை வடிவமாக இருந்தாலும், சங்கீதத்தின் எதிர்நோக்கும் கவிதைச் சூழலில் அடுத்து வரும் செயல்களோடு இணைந்து எதிர்காலப் பொருளைத் தருகிறது; தமிழில் அடுத்துள்ள ‘வணங்குவார்கள்’ என்பதுடன் இயல்பாக இணைகிறது.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: பணிந்து வணங்குவார்கள்
  rationale: மூல வினை உடலைத் தாழ்த்திப் பணிவதையும் வழிபாட்டுச் செயலையும் குறிக்கலாம். இரு நிழற்பொருள்களையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  choice: பூமியில் செழிப்புடன் வாழும் அனைவரும்
  rationale: சொல்லர்த்தம் ‘பூமியின் கொழுத்தவர்கள்’; இங்கு நன்கு உண்டு வளமாக வாழ்பவர்களைக் குறிக்கும் மரபுத்தொடராக இருப்பதால், சமூகப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לְפָנָיו
  choice: அவர் முன்னிலையில்
  rationale: மூலத்தின் இடவியல் மற்றும் மரியாதை சார்ந்த பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: יִכְרְעוּ
  choice: மண்டியிடுவார்கள்
  rationale: முழங்காலை மடக்குதல் அல்லது மண்டியிடுதல் என்ற தனித்த உடல் அசைவைப் பாதுகாக்கிறது.
- source_word: כָּל יוֹרְדֵי עָפָר
  choice: மண்ணுக்குள் இறங்குகிற அனைவரும்
  rationale: ‘தூசி/மண் நோக்கி இறங்குகிறவர்கள்’ என்ற மரணம் மற்றும் மரணத்தன்மை சார்ந்த எபிரெய உருவகத்தை ‘கல்லறை’ என்று நேரடியாக விளக்காமல் தக்கவைக்கிறது.
- source_word: וְנַפְשׁוֹ לֹא חִיָּה
  choice: தன் உயிரை உயிரோடு காத்துக்கொள்ள முடியாதவனும்கூட
  rationale: சுருக்கமானதும் இலக்கண ரீதியாகக் கடினமானதுமான இறுதிக் கூறை, தன் உயிரைப் பாதுகாக்க இயலாத ஒருவரைக் குறிக்கும் பொதுவான புரிதலின்படி மொழிபெயர்க்கிறது; ‘נפשׁ’ என்பதற்கு இங்கு ‘உயிர்’ பொருத்தமானது.
theological_decisions:
- issue: וְנַפְשׁוֹ לֹא חִיָּה என்ற இறுதிக் கூறின் பொருள்
  choice: தன் உயிரை உயிரோடு காத்துக்கொள்ள முடியாத ஒருவரைக் குறிக்கிறது.
  alternative: ‘அவனுடைய உயிர் காக்கப்படவில்லை’ என்று பொதுவாகவோ, தெளிவற்ற எழுவாயுடனோ வாசிக்கலாம்.
  rationale: செழிப்புடையவர்களுக்கும் மரணத்தை நோக்கிச் செல்பவர்களுக்கும் இடையிலான கவிதை எதிரிணையை இவ்வாசிப்பு வெளிப்படுத்துகிறது. அதேவேளை, மூலத்தின் இலக்கணச் சிக்கலை அடிக்குறிப்பில் தெரிவித்து, அதற்கு மேலான கோட்பாட்டுத் தீர்மானத்தைத் திணிக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளை சங்கீதத்திற்குரிய கண்ணியத்தையும் உடல் சார்ந்த கவித்துவப் படிமங்களையும் காக்கும் நடை. ‘பணிந்து வணங்குதல்,’ ‘மண்டியிடுதல்’ ஆகியவை இரு வேறு எபிரெய வினைகளின் வேறுபாட்டைப் பாதுகாக்கின்றன.
