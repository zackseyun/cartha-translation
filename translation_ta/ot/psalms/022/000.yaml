  text: לַ֭/מְנַצֵּחַ עַל אַיֶּ֥לֶת הַ/שַּׁ֗חַר מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/000.yaml
  text: 'For the choirmaster: according to The Doe of the Dawn[a]. A psalm of David[b].'
translation:
  language: ta
  text: 'இசைத்தலைவருக்கு: “விடியற்காலையின் பெண்மான்” என்பதன்படி[a]. தாவீதின் சங்கீதம்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விடியற்காலையின் பெண்மான்” என்பது ஒரு மெட்டு அல்லது இசையமைப்பின் பெயராக இருக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தாவீதின்” என்பது தாவீது எழுதியது, அவருடன் தொடர்புடையது, அவருக்காக அர்ப்பணிக்கப்பட்டது அல்லது அவருடைய தொகுப்பைச் சேர்ந்தது என்பவற்றுள் ஒன்றைக் குறிக்கலாம்; எபிரேயச் சொற்றொடர் இதை இன்னும் குறுகலாக வரையறுக்கவில்லை.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத்தலைவருக்கு
  rationale: சங்கீத முன்னுரைகளில் இசை நிகழ்த்துதலை வழிநடத்தும் தலைவரைக் குறிக்கும் மரபான சொல்லாகும்; எபிரேய முன்னிடைச்சொல்லின் நோக்கு/ஒப்படைப்பு நுணுக்கத்தையும் ‘-க்கு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: என்பதன்படி
  rationale: இங்கு அடுத்து வரும் சொற்றொடர் ஒரு மெட்டு அல்லது இசையமைப்பின் பெயராக இருப்பதற்கான வாய்ப்பு அதிகம். ‘என்பதன்படி’ அந்த இசைக் குறிப்பை இயல்பாகத் தருகிறது; அதேவேளை மொழிபெயர்ப்பில் ‘மெட்டு’ என்ற விளக்கத்தை நேரடியாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: אַיֶּלֶת הַשַּׁחַר
  choice: “விடியற்காலையின் பெண்மான்”
  rationale: אַיֶּלֶת என்பது பெண்பால் ஒருமையில் ஒரு பெண் மானைக் குறிக்கிறது; הַשַּׁחַר என்பது விடியல் அல்லது விடியற்காலையைக் குறிக்கிறது. மேற்கோள் குறிகள் இதை இசைத் தலைப்பாக வாசிக்க உதவுகின்றன.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையுடன் பாடப்படும் புனிதப் பாடலைக் குறிக்கும் இச்சொல்லுக்கு தமிழில் தெளிவாகவும் மரபாகவும் புரியும் இணை ‘சங்கீதம்’ ஆகும்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: சங்கீதத் தலைப்புகளில் לְ ஆசிரியத்துவம், தொடர்பு, அர்ப்பணம் அல்லது தொகுப்புச் சார்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதின்’ இந்த விரிவான தொடர்பை இயல்பான தமிழில் பாதுகாக்கிறது; ‘தாவீது எழுதியது’ என்று அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
theological_decisions:
- issue: אַיֶּלֶת הַשַּׁחַר என்ற சொற்றொடரின் பொருள்
  choice: சங்கீதத்தின் உட்பகுதியாக அல்லாமல் இசை அல்லது மெட்டுத் தலைப்பாக வடிவமைத்தல்
  alternative: சங்கீதத்தின் கருத்துடன் தொடர்புடைய குறியீட்டு அல்லது கருப்பொருள் தலைப்பாகக் கொள்ளுதல்
  rationale: עַל என்பதுடன் வரும் சங்கீத முன்னுரை அமைப்பில் இது நிகழ்த்துமுறை அல்லது மெட்டுக் குறிப்பாக இருப்பதே இயல்பான வாசிப்பு. எனினும் ‘மெட்டு’ என்பதை முதன்மை உரையில் சேர்க்காமல், சாத்தியமான தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
- issue: לְדָוִד என்பதிலுள்ள לְ-இன் பொருள்
  choice: ‘தாவீதின்’ என்று பரந்த தொடர்பைக் காட்டுதல்
  alternative: ‘தாவீது எழுதியது’ அல்லது ‘தாவீதுக்காக’ என்று குறிப்பாக்குதல்
  rationale: எபிரேய முன்னிடைச்சொல் ஆசிரியத்துவம் மட்டுமல்லாமல் தொடர்பு, அர்ப்பணம் அல்லது தொகுப்புச் சார்பையும் குறிக்கக்கூடும். ஆகவே மொழிபெயர்ப்பு அந்தத் தெளிவின்மையைத் தீர்மானித்து விடவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் வழிபாட்டு வாசிப்புக்கு ஏற்ற கண்ணியத்துடனும் அமைக்கப்பட்டுள்ளது. ‘பெண்மான்’ மூலத்தின் பெண்பால் ஒருமையைப் பாதுகாக்கிறது. அடிக்குறி [a] இசைத் தலைப்பு என்ற வாய்ப்பை விளக்குகிறது; [b] ‘தாவீதின்’ என்பதின் உண்மையான பொருள் விரிவைத் திறந்தவாறு வைக்கிறது.
