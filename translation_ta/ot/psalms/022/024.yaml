  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
translation:
  language: ta
  text: ஏனெனில், அவர் துன்புறுகிறவரின் துன்பத்தை இகழவுமில்லை, அருவருக்கவுமில்லை[a]; அவரிடமிருந்து தமது முகத்தை மறைக்கவுமில்லை; அந்தத் துன்புறுகிறவர் அவரை நோக்கிக் கூக்குரலிட்டபோது, அவர் கேட்டார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏழையின் துயரத்தை’ அல்லது ‘துன்புறுகிறவரின் தாழ்த்தப்பட்ட நிலையை.’
    reason: עֱנוּת עָנִי என்ற சொற்றொடரின் பொருள் வரம்பில் உள்ள துயரம், ஏழ்மை, தாழ்த்தப்பட்ட நிலை ஆகிய மாற்று நுணுக்கங்களைப் பாதுகாக்கிறது.
lexical_decisions:
- source_word: בָזָה
  choice: இகழ்
  rationale: அவமதிப்புடன் நடத்துவதைக் குறிக்கிறது; அடுத்துவரும் வலிமையான வினையிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: שִׁקַּץ
  choice: அருவரு
  rationale: ஒன்றை வெறுக்கத்தக்கதாகக் கருதும் தீவிரமான பொருளைக் கொண்டதால், முந்தைய வினையை விட வலிமையான சொல்லாக அமைகிறது.
- source_word: עֱנוּת
  choice: துன்பம்
  rationale: வேதனை அல்லது ஒடுக்குதலின் நிலையை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; அதை உளவியல் அல்லது சமூகப் பொருளுக்கு மட்டும் குறுக்கவில்லை.
- source_word: עָנִי
  choice: துன்பப்பட்டவர்
  rationale: பொருளாதார ஏழ்மையை மட்டும் குறிக்காமல், துன்புறுத்தப்பட்ட அல்லது ஒடுக்கப்பட்ட ஒருவரைக் குறிக்கும் விரிவான பொருளைச் சூழலுக்கேற்ப காக்கிறது.
- source_word: הִסְתִּיר פָּנָיו
  choice: தமது முகத்தை மறைத்தல்
  rationale: அன்பான கவனத்தையோ பிரசன்னத்தையோ விலக்கிக்கொள்ளும் எபிரெய உருவகத்தைப் புரியத்தக்க தமிழில் தக்கவைக்கிறது.
- source_word: מִמֶּנּוּ
  choice: அவரிடமிருந்து
  rationale: ஒருமை பின்னொட்டு முன் குறிப்பிடப்பட்ட துன்பப்பட்டவரையே இயல்பாகச் சுட்டுகிறது.
- source_word: בְשַׁוְּעוֹ
  choice: அவர் ... கூக்குரலிட்டபோது
  rationale: உதவிக்காக எழுப்பப்படும் அவசரமான அழுகுரலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: אֵלָיו
  choice: தம்மை நோக்கி
  rationale: சூழலில் கடவுளைக் குறிக்கும் மூன்றாம் நபர் சுட்டுப்பெயரைப் பாதுகாக்கிறது; மூலத்தில் இல்லாத இறைப் பட்டத்தைச் சேர்ப்பதில்லை.
- source_word: שָׁמֵעַ
  choice: அவர் கேட்டார்
  rationale: வினையின் அடிப்படைப் பொருளான ‘கேட்டல்’ என்பதைப் பாதுகாக்கிறது; ‘பதிலளித்தார்’ என்று மொழிபெயர்ப்பது மூலச்சொல்லைத் தாண்டிய விளக்கமாகிவிடும்.
theological_decisions:
- issue: துன்பப்பட்டவர் யாரைக் குறிக்கிறார்?
  choice: சங்கீதத்தின் முதலாம் நபர் சூழலுக்குப் பொருந்தும் அதேவேளையில், துன்பப்பட்ட ஒருவர்மீது கடவுள் காட்டும் அக்கறையைப் பொதுவாகவும் கூறும் ஒருமை வடிவம் பாதுகாக்கப்பட்டுள்ளது.
  alternative: துன்புறும் மேசியாவை மட்டும் குறிக்கும் வாசிப்பு; அல்லது எந்த ஏழையையும் குறிக்கும் முற்றிலும் பொதுவான வாசிப்பு.
  rationale: எபிரெய ஒருமை வடிவங்கள் சங்கீதக்காரரின் சொந்த அனுபவத்திற்கும் விரிவான கொள்கைக்கும் இடமளிக்கின்றன; மொழிபெயர்ப்பு இவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘தமது/தம்மை’ என்பது கடவுளைக் குறிக்கும் சுட்டுப்பெயரின் தொடர்பைத் தெளிவாக்குகிறது; ‘அவர்’ என்பது துன்பப்பட்டவரையும் கடவுளையும் மாறிமாறிக் குறிப்பதால், எபிரெய மூலத்தின் சுட்டுப்பெயர் அமைப்பையும் அதன் இயல்பான பதற்றத்தையும் பெருமளவு காக்கிறது.
