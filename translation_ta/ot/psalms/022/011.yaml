id: PSA.22.11
reference: Psalms 22:11
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אַל תִּרְחַ֣ק מִ֭מֶּ/נִּי כִּי צָרָ֣ה קְרוֹבָ֑ה כִּי אֵ֥ין עוֹזֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/011.yaml
  text: Do not be far from me[a], for trouble is near, for there is no helper.
translation:
  language: ta
  text: என்னைவிட்டு தூரமாய் இருக்காதீர்; ஏனெனில் துன்பம் அருகில் உள்ளது; ஏனெனில் உதவுபவர் ஒருவரும் இல்லை.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: என்னைவிட்டு தூரமாயிருக்காதீர்
  rationale: எதிர்மறை வேண்டுதலையும் רחק என்பதன் இடவெளி உருவகத்தையும் இயல்பான, மதிப்புமிக்க நவீன தமிழில் காக்கிறது; ‘கைவிடாதீர்’ என்று பொருளை வலுப்படுத்தவில்லை.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: צָרָה קְרוֹבָה
  choice: துன்பம் அருகில் உள்ளது
  rationale: צָרָה என்பதன் துன்பம்/நெருக்கடி என்ற பரந்த பொருளையும் קְרוֹבָה என்பதன் உடனடி அண்மையையும் காக்கிறது.
- source_word: כִּי אֵין עוֹזֵר
  choice: உதவுகிறவர் ஒருவரும் இல்லை
  rationale: עוֹזֵר என்பது பெயர்ச்சொல்லாகச் செயல்படும் நிகழ்காலப் பங்கேற்புவடிவம்; அரூபமான ‘உதவி’ என்பதற்குப் பதிலாக உதவும் நபரைக் குறிக்கும் தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: புலம்பலில் இறைவனின் தூரத்தைச் சுட்டும் மொழி
  choice: என்னைவிட்டு தூரமாயிருக்காதீர்
  alternative: என்னைக் கைவிடாதீர்
  rationale: எபிரெயம் இடவெளி சார்ந்த רחק + מן மொழியைப் பயன்படுத்துகிறது. ‘கைவிடாதீர்’ என்பது மூலத்தில் உள்ளதைவிட வலுவான இறையியல் கூற்றைச் சேர்க்கக்கூடும்; தேர்ந்த வடிவம் புலம்பலின் பதற்றத்தைத் தீர்த்துவிடாமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரண்டு காரணவாக்கியங்களின் ஓட்டம் தமிழில் இயல்பாக இருக்க, முதல் כִּי ‘ஏனெனில்’ என வெளிப்படுத்தப்பட்டு, இரண்டாவது காரணத் தொடர்பு அரைப்புள்ளிக்குப் பின் தொடர்ச்சியாக விடப்பட்டுள்ளது.
