review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the plea for divine nearness, the nearness of trouble, and the absence of any helper. A small revision restores the explicitly repeated causal connector in the final clause, corresponding to the second כִּי in the Hebrew.
  naturalness: The register is appropriately dignified and modern. Writing “தூரமாய் இருக்காதீர்” as separate words is more natural standard Tamil orthography, and “உதவுபவர்” is a smooth substantive equivalent for the Hebrew participle.
  terminology: “துன்பம்” suitably preserves the broad sense of צָרָה without over-specifying the nature of the distress. “உதவுபவர்” retains the personal sense of עוֹזֵר rather than changing it to abstract ‘help.’
  issues:
  - severity: low
    issue: The second causal conjunction is not expressed.
    rationale: The Hebrew repeats כִּי before “there is no helper.” Adding “ஏனெனில்” preserves the parallel explanatory structure and avoids leaving the final clause merely juxtaposed.
  - severity: low
    issue: Compound spelling in “தூரமாயிருக்காதீர்.”
    rationale: “தூரமாய் இருக்காதீர்” is the more standard and readable modern Tamil word division.
  revised_text: என்னைவிட்டு தூரமாய் இருக்காதீர்; ஏனெனில் துன்பம் அருகில் உள்ளது; ஏனெனில் உதவுபவர் ஒருவரும் இல்லை.
  revised_footnotes: []
  revision_rationale: 'The revision makes only formal and connective improvements: it retains the spatial metaphor of the plea, keeps “துன்பம்” broad, preserves the personal ‘helper,’ and represents both Hebrew causal clauses explicitly.'
