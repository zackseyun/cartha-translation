  text: They will come and declare his righteousness to a people yet to be born[c][b][a], that he has done it.
translation:
  language: ta
  text: 'அவர்கள் வந்து, இன்னும் பிறக்காத ஒரு மக்களினத்துக்கு அவரது நீதியை அறிவிப்பார்கள்: “அவர் அதைச் செய்தார்.”[c][b][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவரது நியாயம்.’ எபிரெயச் சொல் பரந்த பொருளில் நீதியையும், நியாயமான மற்றும் மீட்பளிக்கும் செயலையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘பிறக்கவிருக்கும் ஒரு மக்களினத்துக்கு.’
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘ஏனெனில் அவர் அதைச் செய்தார்.’ எபிரெய இறுதிக்கூறு சுருக்கமானது; அது அறிவிக்கப்படும் செய்தியாகவோ, அறிவிப்பதற்கான காரணமாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  choice: அவர்கள் வந்து
  rationale: בוא என்பதன் Qal முற்றுப்பெறா வடிவம் எதிர்காலச் செயலைக் குறிக்கிறது; அடுத்த வினையோடு இயல்பாக இணைவதற்காகத் தமிழில் வினையெச்சமாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְיַגִּידוּ
  choice: அறிவிப்பார்கள்
  rationale: נגד என்பதன் Hiphil வடிவம் ஒன்றைப் பிறருக்குத் தெரியப்படுத்துதல் அல்லது பிரகடனம் செய்தல் என்பதைக் குறிக்கிறது; சங்கீதத்தின் பொதுச் சாட்சித் தொனியை இது இயல்பான தமிழில் தருகிறது.
- source_word: צִדְקָתוֹ
  choice: அவருடைய நீதி
  rationale: צדקה என்பது நேர்மை, நியாயம், நீதியானதும் மீட்பளிப்பதுமான செயல் ஆகிய பரப்புகளைக் கொண்டது. ‘நீதி’ அதன் அகலமான பொருளைச் சுருக்காமல் காக்கிறது.
- source_word: לְעַם
  choice: மக்களுக்கு
  rationale: לְ இங்கு அறிவிப்பைப் பெறுவோரைக் குறிக்கிறது. עַם ஒரு கூட்டு மக்களைக் குறிக்கும்; தமிழில் ‘மக்களுக்கு’ இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: נוֹלָד
  choice: இனிப் பிறக்கவிருக்கும்
  rationale: ילד என்பதன் passive participle, எதிர்காலத்தில் உருவாகும் மக்களை இச்சூழலில் குறிக்கிறது; ‘இனிப் பிறக்கவிருக்கும்’ அதன் எதிர்நோக்கிய பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כִּי
  choice: என்று
  rationale: இங்கு כִּי அறிவிக்கப்படும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதாக எடுத்துக்கொள்ளப்பட்டது. காரணப் பொருளும் சாத்தியம் என்பதால் அது அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: עָשָׂה
  choice: அவர் அதைச் செய்தார்
  rationale: עשה என்பதன் Qal perfect வடிவம் ‘செய்தார்’ எனப் பொருள்படும். எபிரெயத்தில் செயப்படுபொருள் வெளிப்படையாக இல்லை; இயல்பான தமிழுக்காக ‘அதை’ சேர்க்கப்பட்டாலும் மூலத்தின் சுருக்கமான, உச்சக்கட்ட முடிவு காக்கப்படுகிறது.
theological_decisions:
- issue: צדקה என்பதன் பொருள்
  choice: முதன்மை உரையில் ‘அவருடைய நீதி’
  alternative: ‘அவருடைய நியாயம்’; மேலும், நீதியுள்ள மீட்புச் செயல் என்ற நுண்பொருளும் சாத்தியம்
  rationale: இச்சொல் ஒழுக்க நேர்மையையும் நியாயமான அல்லது மீட்பளிக்கும் செயலையும் உள்ளடக்கலாம். ‘நீதி’ இந்த இறையியல் பரப்பை ஒரு குறிப்பிட்ட விளக்கத்துக்குள் சுருக்காமல் காக்கிறது.
- issue: כִּי עָשָׂה என்ற இறுதி கூறின் தொடர்பு
  choice: அறிவிக்கப்படும் செய்தியின் உள்ளடக்கமாக, ‘“அவர் அதைச் செய்தார்” என்று’
  alternative: காரணமாக, ‘ஏனெனில் அவர் அதைச் செய்தார்’
  rationale: எபிரெயக் கூறு மிகச் சுருக்கமானது; כִּי உள்ளடக்கத்தையோ காரணத்தையோ அறிமுகப்படுத்தலாம். சூழல் உள்ளடக்க வாசிப்பைச் சற்றே ஆதரித்தாலும் உண்மையான இருபொருள் வாய்ப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
