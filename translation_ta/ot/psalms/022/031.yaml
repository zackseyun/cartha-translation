  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதத்துக்கேற்ற கண்ணியமான பொதுப் பிரகடனத் தொனியுடனும் வடிவமைக்கப்பட்டது. மூலத்தின் சுருக்கமான உச்சக்கட்ட முடிவும் அதன் உண்மையான இலக்கண இருபொருள் வாய்ப்பும் காக்கப்பட்டுள்ளன.
