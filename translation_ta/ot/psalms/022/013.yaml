  register: நவீன நிலையான தமிழில், கவித்துவ உயிரோட்டத்தையும் கண்ணியத்தையும் காக்கும் மொழிநடை. எபிரெயின் கூட்டு ஒருமையான ‘வாய்’ பாதுகாக்கப்பட்டுள்ளது; வெளிப்படையற்ற ஒப்புமை முதன்மை உரையில் இயல்பான தமிழுக்காகத் தெளிவாக்கப்பட்டு, மூலத்தின் சுருக்கமான அமைப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
