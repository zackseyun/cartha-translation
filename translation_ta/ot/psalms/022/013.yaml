translation:
  language: ta
  text: கிழிக்கும், கர்ஜிக்கும் சிங்கத்தைப்போல் அவர்கள் எனக்கு எதிராகத் தங்கள் வாயை அகலத் திறக்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் எனக்கு எதிராகத் தங்கள் வாயை அகலத் திறந்தார்கள்; கிழிக்கும், கர்ஜிக்கும் ஒரு சிங்கம்.” எபிரெயில் ‘போல்’ என்ற வெளிப்படையான ஒப்புமைச் சொல் இல்லாமல் சிங்க உருவகம் சுருக்கமாகக் கொடுக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצ֣וּ
  choice: அகலத் திறக்கிறார்கள்
  rationale: פצה என்பது ‘அகலத் திறத்தல்’ என்று பொருள்படும். எபிரெயக் கவிதையின் நிகழ்கால உயிரோட்டத்தைத் தமிழில் நிகழ்காலத்தால் வெளிப்படுத்துகிறது.
- source_word: עָלַי
  choice: எனக்கு எதிராக
  rationale: இங்கு עַל பகைமையோடு ஒருவரை நோக்கிய செயலைக் குறிக்கிறது; ‘எனக்கு எதிராக’ என்பது அந்த எதிர்ப்புணர்வை இயல்பாகத் தருகிறது.
- source_word: פִּיהֶם
  choice: தங்கள் வாயை
  rationale: எபிரெயில் பெயர்ச்சொல் ஒருமையிலும் உரிமைப்பின்னொட்டு பன்மையிலும் உள்ளது. ‘தங்கள் வாயை’ என்பது அந்தக் கூட்டு ஒருமையைத் தமிழில் இயல்பாகப் பாதுகாக்கிறது.
- source_word: אַרְיֵה
  choice: சிங்கத்தைப்போல்
  rationale: ஒப்புமை உருபு வெளிப்படையாக இல்லாவிட்டாலும், சிங்க உருவகம் செயல்பாட்டில் ஒப்புமையாக அமைகிறது. தமிழில் பொருள் தெளிவாக இருக்க ‘-த்தைப்போல்’ சேர்க்கப்பட்டது.
- source_word: טֹרֵף
  choice: கிழிக்கும்
  rationale: טרף என்பதன் வினையெச்சம் சிங்கத்தின் இரையைக் கிழிக்கும் வன்மையான செயலைக் குறிக்கிறது; ‘கிழிக்கும்’ என்பது நேரடியான, உயிரோட்டமுள்ள நவீனத் தமிழ்.
- source_word: וְשֹׁאֵג
  choice: கர்ஜிக்கும்
  rationale: שׁאג என்பது குறிப்பாகச் சிங்கம் முழங்குவதைக் குறிக்கும் வழக்கமான வினை; ‘கர்ஜிக்கும்’ அதற்கான துல்லியமான இயல்பான சொல்.
