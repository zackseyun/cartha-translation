  yaml_path: translation/ot/psalms/022/004.yaml
  text: In you our fathers trusted; they trusted[a], and you delivered them.
translation:
  language: ta
  text: உம்மை எங்கள் தந்தையர்[a] நம்பினார்கள்; அவர்கள் நம்பினார்கள், நீர் அவர்களை விடுவித்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் முன்னோர்கள்.” எபிரெய மொழியில் “எங்கள் தந்தையர்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: உம்மை
  rationale: בְּ முன்னொட்டு நம்பிக்கையின் தனிப்பட்ட இலக்காக இறைவனைக் குறிக்கிறது. தமிழில் ‘உம்மை நம்பினார்கள்’ என்பது இயல்பானதும், மூலத்தில் இல்லாத தனிப்பட்ட வலியுறுத்தலைச் சேர்க்காததும் ஆகும்.
- source_word: בָּטְחוּ
  choice: நம்பினார்கள்
  rationale: בטח என்பது நம்புதல் அல்லது சார்ந்திருத்தலைக் குறிக்கிறது. ஒரே வினைச்சொல் இருமுறை வருவதைத் தமிழிலும் காத்து, எபிரெய உரையின் வலியுறுத்தல் பாதுகாக்கப்பட்டுள்ளது.
- source_word: אֲבֹתֵינוּ
  choice: எங்கள் தந்தையர்
  rationale: எபிரெயச் சொல் நேரடியாக ‘எங்கள் தந்தையர்’ எனும் ஆண்பால் பன்மை உறவுமுறைச் சொல்லாக உள்ளது. வரலாற்று வம்சத்தைக் குறிக்கும் விரிவான பொருளான ‘எங்கள் முன்னோர்கள்’ அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: וַתְּפַלְּטֵמוֹ
  choice: நீர் அவர்களை விடுவித்தீர்
  rationale: פלט இங்கு ஆபத்திலிருந்து விடுவித்தல் அல்லது மீட்டல் என்ற பொருளைக் கொண்டது. ‘விடுவித்தீர்’ மீட்பின் விதத்தை அளவுக்கு மீறி குறிப்பாக்காமல், சங்கீதத்திற்கேற்ற கண்ணியமான நடையைத் தருகிறது.
theological_decisions:
- issue: אֲבֹתֵינוּ என்பதன் வரலாற்று/பிரதிநிதித்துவப் பொருள்
  choice: எங்கள் தந்தையர்
  alternative: எங்கள் முன்னோர்கள்
  rationale: மூலத்தின் வெளிப்படையான ஆண்பால் உறவுமுறைச் சொல்லை முதன்மை உரையில் வைத்திருக்கிறது; அது முழு முந்தைய தலைமுறையையும் குறிக்கக்கூடிய விரிவான பொருளை அடிக்குறிப்பு தெரிவிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. இறைவனை நோக்கிய உரையில் ‘உம்மை/நீர்’ என்ற மரியாதை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் வினைச்சொல் மறுபடியும் வருவது வலியுறுத்தலுக்காகப் பாதுகாக்கப்பட்டுள்ளது.
