base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
translation:
  language: ta
  text: 'என் வலிமை மண்பாண்ட ஓடுபோல் காய்ந்துபோயிற்று;


    என் நாவு என் தாடைகளோடு[a] ஒட்டிக்கொண்டது;


    நீர் என்னை மரணத்தின் புழுதியில் கிடத்துகிறீர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நாவு என் அண்ணத்தோடு ஒட்டிக்கொண்டது.” இங்கு வாயின் எந்தப் பகுதி குறிக்கப்படுகிறது என்பது எபிரெய மொழியில் உறுதியற்றது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: காய்ந்துபோயிற்று
  rationale: வறண்டு அல்லது உலர்ந்துபோன நிலையைக் குறிக்கும் வினை; உடல் வலிமை முற்றிலும் வற்றியுள்ள கவித்துவப் படிமத்தை இயல்பான தமிழில் தருகிறது.
- source_word: כַּחֶרֶשׂ
  choice: மண்பாண்ட ஓட்டைப்போல்
  rationale: חֶרֶשׂ என்பது மட்பாண்டத்தையோ அதன் உடைந்த ஓட்டையையோ குறிக்கலாம். வறண்டதும் எளிதில் நொறுங்கக்கூடியதுமான பொருளின் படிமத்தை ‘மண்பாண்ட ஓடு’ தெளிவாகக் காக்கிறது.
- source_word: כֹּחִי
  choice: என் வலிமை
  rationale: இங்கு அதிகாரத்தை அல்ல, உடல் வலிமையையும் உயிர்த்துடிப்பையும் குறிக்கிறது.
- source_word: וּלְשׁוֹנִי
  choice: என் நாவு
  rationale: நேரடியான உடற்கூறு குறிப்பு; உருவகத்தை விரித்துரைக்காமல் அப்படியே காக்கப்படுகிறது.
- source_word: מֻדְבָּק
  choice: ஒட்டிக்கொண்டது
  rationale: ஒட்டவைக்கப்பட்ட அல்லது ஒட்டியிருக்கும் நிலையைக் குறிக்கும் செயப்பாட்டு வடிவத்தின் உடல் சார்ந்த படிமத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מַלְקוֹחָי
  choice: என் தாடைகளோடு
  rationale: இச்சொல்லின் துல்லியமான உடற்கூறு பொருள் உறுதியற்றது. தாடைகள் அல்லது கன்னப்பகுதி என்ற சாத்தியத்தை முதன்மை உரை ஏற்கிறது; ‘அண்ணம்’ என்ற மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: וְלַעֲפַר
  choice: புழுதியில்
  rationale: ל முன்னிடைச்சொல் இங்கு ஒரு நிலைக்கு அல்லது இடத்திற்குக் கொண்டுசென்று வைப்பதைக் குறிக்கலாம்; தமிழில் ‘புழுதியில் கிடத்துதல்’ இயல்பாக உள்ளது.
- source_word: מָוֶת
  choice: மரணத்தின்
  rationale: ‘மரணத்தின் புழுதி’ என்ற மூலமொழியின் இணைப்பைத் தக்கவைத்து, அதை ‘கல்லறை’ என்று விளக்கமாக மாற்றுவதைத் தவிர்க்கிறது.
- source_word: תִּשְׁפְּתֵנִי
  choice: நீர் என்னை ... கிடத்துகிறீர்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை வினையும் முதலாம் நபர் ஒருமை செயப்படுபொருளும் நேரடியான அழைப்பைக் காட்டுகின்றன. ‘கிடத்துகிறீர்’ என்பது வைப்பதையோ படுக்கவைப்பதையோ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: இறுதி அடியில் செயற்படுபவர் யார்?
  choice: தேவனை நேரடியாக நோக்கி, ‘நீர் என்னை மரணத்தின் புழுதியில் கிடத்துகிறீர்’
  alternative: ‘நான் மரணத்தின் புழுதியில் கிடத்தப்பட்டேன்’ போன்ற செயற்படுபவரைக் குறிப்பிடாத வாசிப்பு
  rationale: எபிரெய வினை இரண்டாம் நபர் ஒருமையில் இருப்பதால், சங்கீதப் பாடகர் தேவனை நேரடியாக நோக்கிப் பேசுவதே இயல்பான வாசிப்பு. துன்புறுபவர் தமது மரண நெருக்கடியை தேவனுடைய செயலுடன் தொடர்புபடுத்தும் வேதாந்தப் பதற்றத்தை இந்த மொழிபெயர்ப்பு விளக்கித் தீர்க்காமல் அப்படியே காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்தின் கண்ணியமான கவித்துவ நடையைப் பேணியும் மொழிபெயர்க்கப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘நீர்/கிறீர்’ பயன்படுத்தப்பட்டுள்ளது; மூலத்தின் மூன்று இணையான துயரப் படிமங்களும் தனித்தனி அடிகளாக வைக்கப்பட்டுள்ளன.
