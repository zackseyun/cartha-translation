  yaml_path: translation/ot/psalms/022/019.yaml
  text: But you[a], O Yahweh, do not be far away; O my strength[b], hurry to help me.
translation:
  language: ta
  text: ஆனால் நீரோ, யாவே, தொலைவில் இருக்காதீர்[a]; என் வலிமையே[b], விரைந்து எனக்கு உதவுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தூரமாய் இருக்காதீர்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், ‘என் வலிமை.’ இச்சொல்லைச் சிலர் ‘என் உதவி’ என்றும், இங்கு பொருந்தும் வாய்ப்பு குறைவாக இருந்தாலும், பெண் மானைக் குறிக்கும் சொல்லுடன் தொடர்புபடுத்தியும் புரிந்துகொண்டுள்ளனர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: ஆனால் நீரோ
  rationale: இணைப்புச் சொல்லும் தனிப்பட்ட சுட்டுப்பெயரும் முந்தைய துயரநிலைக்கு எதிரான வலுவான திருப்பத்தைக் குறிக்கின்றன. ‘ஆனால் நீரோ’ என்பது அந்த எதிர்மறை மாறுபாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட இறைப்பெயரை ஒரு பட்டமாக மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ என்று வழங்குகிறது.
- source_word: אַל תִּרְחָק
  choice: தொலைவில் இருக்காதீர்
  rationale: רחק என்பதன் ‘தொலைவில் இருத்தல்’ என்ற அடிப்படைப் பொருளையும், எதிர்மறை வேண்டுகோளின் நேரடித்தன்மையையும் தெளிவான நவீன தமிழில் காக்கிறது.
- source_word: אֱיָלוּתִי
  choice: என் வலிமையே
  rationale: சூழலில் இது சங்கீதக்காரரின் வலிமையாகிய கடவுளை அழைக்கும் உருவகச் சொல்லாகப் புரிகிறது. எபிரெயச் சொல்லின் அரிதான தன்மையால் பிற புரிதல்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: לְעֶזְרָתִי
  choice: எனக்கு உதவ
  rationale: ‘என் உதவிக்காக/என் உதவிக்கு’ என்ற நோக்கு அல்லது திசைப் பொருளை இயல்பான தமிழில் வினைத் தொடராக வழங்குகிறது.
- source_word: חוּשָׁה
  choice: விரைந்து வாரும்
  rationale: கட்டளை வடிவிலுள்ள அவசர வேண்டுகோளைத் தெளிவாகக் காட்டுகிறது. ‘வாரும்’ என்பது உதவிக்காக அணுகும்படி வேண்டுகிற சூழ்நிலைப் பொருளை தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை இறைவனின் தனிப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்ப்பாக வழங்குகிறது.
- issue: אֱיָלוּתִי என்பதன் அரிதான பொருள்
  choice: என் வலிமையே
  alternative: என் உதவியே / என் மானே (பெண் மான்)
  rationale: உதவிக்கான வேண்டுகோளுடன் ‘என் வலிமையே’ என்பது சூழலுக்கு நன்கு பொருந்துகிறது; எனினும் சொல்லின் சொற்பிறப்பும் மாற்றுப் புரிதல்களும் உறுதியற்றிருப்பதால் அவை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், கடவுளை மரியாதைப் பன்மையால் நேரடியாக அழைக்கும் கண்ணியமான வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘விரைந்து வாரும்’ அவசரத்தை இயல்பாகக் காட்டுகிறது; அரிதான אֱיָלוּתִי சொல்லின் தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
