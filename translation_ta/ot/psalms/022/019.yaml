review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the contrastive address, the divine name, the negative plea not to be distant, and the vocative sense of “my strength.” The final wording “விரைந்து வாரும்” can imply ‘come quickly,’ whereas the Hebrew imperative more directly urges Yahweh to act quickly for the psalmist’s help. A revision can retain the urgency without adding motion.
  naturalness: The Tamil is generally natural and appropriately reverent in modern standard Tamil. However, “தொலைவில் இருக்காதீர்” uses an honorific imperative while “வாரும்” is less consistently formal in this context. “விரைந்து எனக்கு உதவுங்கள்” is idiomatic, maintains the honorific address, and directly expresses the Hebrew construction.
  terminology: “யாவே” appropriately renders the Tetragrammaton as a name rather than substituting a title. “என் வலிமையே” is a sound contextual rendering of the difficult אֱיָלוּתִי. The footnote suitably preserves the less likely hind/doe-related interpretation without presenting it as the main sense.
  issues:
  - severity: low
    issue: The phrase “விரைந்து வாரும்” adds an explicit notion of coming and is less consistent with the preceding honorific imperative.
    rationale: חוּשָׁה is an urgent imperative, ‘hurry/make haste’; together with לְעֶזְרָתִי it calls for prompt help. “விரைந்து எனக்கு உதவுங்கள்” expresses this directly and keeps the formal plural address consistent.
  revised_text: ஆனால் நீரோ, யாவே, தொலைவில் இருக்காதீர்[a]; என் வலிமையே[b], விரைந்து எனக்கு உதவுங்கள்.
