lexical_decisions:
- source_word: עָלֶיךָ
  choice: உம்மிடமே
  rationale: עַל இங்கு ஒருவர்மீது வைக்கப்படுதல் அல்லது அவருடைய பராமரிப்பைச் சார்ந்திருத்தல் என்ற உறவை உணர்த்துகிறது. இயல்பான தமிழில் ‘உம்மிடமே’ அந்தச் சார்பையும் திசையையும் வெளிப்படுத்துகிறது.
- source_word: הָשְׁלַכְתִּי
  choice: விடப்பட்டேன்
  rationale: இந்தச் செயப்பாட்டு வடிவம் ‘எறியப்பட்டேன்/வீசப்பட்டேன்’ என்ற வலுவான உருவகத்தைக் கொண்டது. தமிழில் ‘உம்மிடமே விடப்பட்டேன்’ என்பது பிறந்ததிலிருந்தே கடவுளுடைய பராமரிப்பில் வைக்கப்பட்ட நிலையை இயல்பாகச் சொல்கிறது; ‘ஒப்படைக்கப்பட்டேன்’ என்பதுபோல் நோக்கத்தை அதிகமாக விளக்கிச் சேர்ப்பதையும் தவிர்க்கிறது.
- source_word: מֵרָחֶם
  choice: கருப்பையிலிருந்தே
  rationale: רֶחֶם என்பதன் நேரடியான பொருள் ‘கருப்பை.’ ‘பிறப்பிலிருந்தே’ என்று பொதுமைப்படுத்தாமல் மூலத்தின் உடற்கூறு உருவகம் காக்கப்படுகிறது.
- source_word: מִבֶּטֶן אִמִּי
  choice: என் தாயின் வயிற்றிலிருந்தே
  rationale: בֶּטֶן என்பது ‘வயிறு’ என்றும் சூழலுக்கு ஏற்ப ‘கருப்பை’ என்றும் பொருள்படும். முன்வந்த רֶחֶם என்பதற்கு ‘கருப்பை’ பயன்படுத்தப்பட்டதால், எபிரெயச் சொல் வேறுபாட்டைத் தமிழிலும் காக்க ‘வயிறு’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: אֵלִי
  choice: என் இறைவன்
  rationale: אֵלִי என்பது தனிப்பட்ட உறவை வெளிப்படுத்தும் ‘என் கடவுள்/இறைவன்’ என்று பொருள்படும். சங்கீதக் கவிதையின் கண்ணியமான நடைக்கு ‘என் இறைவன்’ பொருந்துகிறது.
- source_word: אָתָּה
  choice: நீரே
  rationale: முன்னிலைப்படுத்தப்பட்ட ‘நீர்’ வலியுறுத்தலை ‘நீரே’ இயல்பாக வெளிப்படுத்துகிறது. தமிழின் வினையற்ற பெயர்ப் பயனிலை அமைப்பு, எபிரெய வாக்கியத்தின் காலத் தெளிவின்மையையும் காக்கிறது.
theological_decisions:
- issue: இறுதி வினையற்ற கூற்றின் காலம்
  choice: நீரே என் இறைவன்
  alternative: நீரே என் இறைவனாக இருந்துவருகிறீர்
  rationale: אֵלִי אָתָּה என்பதில் வெளிப்படையான வினைச்சொல்லோ காலக் குறிப்போ இல்லை. ‘நீரே என் இறைவன்’ என்ற தமிழ் அமைப்பு நிகழ்கால உறவையும் பிறப்பிலிருந்து தொடரும் உறவையும் அனுமதிப்பதால், மூலத்தின் உண்மையான காலத் தெளிவின்மை தீர்க்கப்படாமல் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், ஆனால் சங்கீதத்திற்குரிய கண்ணியமும் கவித்துவச் சுருக்கமும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பன்மை பேணப்பட்டுள்ளது; எபிரெய மூலத்தின் இணைவரிசையும் இறுதி வினையற்ற கூற்றின் திறந்த காலப் பொருளும் பாதுகாக்கப்பட்டுள்ளன.
