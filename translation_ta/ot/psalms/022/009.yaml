  text: For you are the one who brought me out from the womb[a], making me secure at my mother’s breasts.
translation:
  language: ta
  text: ஏனெனில், கருப்பையிலிருந்து என்னை வெளிக்கொண்டு வந்தவர் நீரே; என் தாயின் மார்பில் என்னைப் பாதுகாப்பாக வைத்தவர்[a] நீரே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் தாயின் மார்பில் என்னை நம்பிக்கை கொள்ளச் செய்தவர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதல் அல்லது புகழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்துகிறது; சங்கீதத்தின் வாத ஓட்டத்தை இயல்பாகத் தொடர்கிறது.
- source_word: אַתָּה
  choice: நீரே
  rationale: வெளிப்படையான இரண்டாம் நபர் சுட்டுப்பெயரின் வலியுறுத்தலைப் பேணுகிறது; தேவனே செய்பவர் என்பதை எடுத்துக்காட்டுகிறது.
- source_word: גֹחִי
  choice: என்னை வெளிக்கொண்டு வந்தவர்
  rationale: பிறப்புச் சூழலில் கருப்பையிலிருந்து வெளிவரச் செய்த செயலைக் குறிக்கிறது; உருவகத்தை விளக்கவுரையாக மாற்றாமல் நேரடியாகப் பேணுகிறது.
- source_word: מִבָּטֶן
  choice: கருப்பையிலிருந்து
  rationale: பிறப்பைக் குறிக்கும் எபிரெயச் சொல்லையும் முன்னொட்டையும் துல்லியமாகவும் இயல்பாகவும் தருகிறது.
- source_word: מַבְטִיחִי
  choice: என்னைப் பாதுகாப்பாக இருக்கச் செய்தவர்
  rationale: בטח என்பதன் ஹிஃபில் வடிவம் பாதுகாப்பு அல்லது நம்பிக்கையான நிலையை உண்டாக்குதல் எனப் பொருள்படலாம். பச்சிளங்குழந்தைச் சூழலில் வளர்ந்த அறிவுணர்வோடு கூடிய நம்பிக்கையைத் திணிக்காமல் பாதுகாப்புணர்வை வெளிப்படுத்துகிறது.
- source_word: עַל
  choice: மார்புகளில்
  rationale: தாயின் மார்பில் பாலருந்தும் சூழலைத் தமிழில் இயல்பாகக் காட்ட இடவேற்றுமையுடன் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: שְׁדֵי
  choice: மார்புகள்
  rationale: எபிரெயச் சொல் குறிப்பாக மார்புகளைக் குறிக்கிறது; மங்கலான அல்லது euphemistic சொல்லைத் தவிர்க்கிறது.
- source_word: אִמִּי
  choice: என் தாயின்
  rationale: முதல் நபர் உரிமை விகுதியைப் பேணி, இயல்பான தமிழ்ச் சொற்றொடராக வழங்குகிறது.
theological_decisions:
- issue: מַבְטִיחִי என்பது குழந்தையின் வெளிப்படையான ‘நம்பிக்கை’யையா அல்லது விரிவான ‘பாதுகாப்பு’ நிலையையா குறிக்கிறது
  choice: என்னைப் பாதுகாப்பாக இருக்கச் செய்தவர்
  alternative: என்னை நம்பிக்கை கொள்ளச் செய்தவர்
  rationale: வசனம் பிறப்பிலிருந்தும் தாயின் மார்புகளிடத்திலும் தேவன் அளித்த பராமரிப்பைப் பேசுகிறது. பச்சிளங்குழந்தைக்கு முதிர்ந்த உணர்வுள்ள விசுவாசத்தைத் திணிக்காமல், எபிரெயச் சொல்லின் பாதுகாப்பு/நம்பிக்கை சார்ந்த பொருளை முதன்மை உரை தருகிறது; சாத்தியமான பாரம்பரிய மாற்றுப் பொருள் அடிக்குறிப்பில் பேணப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்கேற்ற கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நீரே ... நீரே’ என்ற அமைப்பு எபிரெய மூலத்தின் வெளிப்படையான ‘நீர்’ வலியுறுத்தலையும் இரு தெய்வச் செயல்களின் இணைப்பையும் தெளிவாக்குகிறது.
