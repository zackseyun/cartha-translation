source:
  edition: WLC
  text: כִּ֤י לֹ֣א מִ֭/מּוֹצָא וּ/מִֽ/מַּעֲרָ֑ב וְ֝/לֹ֗א מִ/מִּדְבַּ֥ר הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/006.yaml
  text: For not from the east or from the west[c][b][a], and not from the wilderness comes lifting up.
translation:
  language: ta
  text: ஏனெனில், உயர்வு கிழக்கிலிருந்தோ மேற்கிலிருந்தோ வருவதில்லை; வனாந்தரத்திலிருந்தும் அல்ல.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உயர்வு’ என்பதை ‘உயர்த்தப்படுதல்’ அல்லது ‘மேன்மைப்படுத்தப்படுதல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெய வாக்கியம் சுருக்கமாகவும் பொருள் காண்பதற்குக் கடினமாகவும் உள்ளது; அடுத்த வசனத்தில் கடவுள் ஒருவரைத் தாழ்த்தி மற்றொருவரை உயர்த்துகிறார் என்பது இதன் பொருளைத் தெளிவாக்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: இறுதி எபிரெயச் சொல்லை ‘மலைகள்’ என்றும் புரிந்துகொள்ளலாம்; அப்போது இறுதிக் கூறு ‘மலைவனாந்தரத்திலிருந்தும் அல்ல’ என்பது போன்ற பொருளைத் தரும். ஆனால் அடுத்த வசனத்தின் சூழல் ‘உயர்வு’ என்ற பொருளை ஆதரிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான விளக்கத்தை அறிமுகப்படுத்துவதால் காரணத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִמּוֹצָא
  choice: கிழக்கிலிருந்து
  rationale: சொல்லின் அடிப்படைப் பொருள் ‘புறப்படுதல்/உதித்தல்’; சூரியன் உதிக்கும் திசையைக் குறிக்கும் வழக்கமான பொருளைத் தெளிவாகக் கொடுக்கிறது.
- source_word: וּמִמַּעֲרָב
  choice: மேற்கிலிருந்து
  rationale: சூரியன் மறையும் திசையைக் குறிக்கும் சொல்லை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: מִמִּדְבַּר
  choice: வனாந்தரத்திலிருந்து
  rationale: மִדְבָּר என்பதன் பாலைவனம்/மக்கள் குடியிராத வெளி என்ற பரந்த பொருளை வேதாகம நடையிலும் புரியக்கூடிய தமிழிலும் வழங்குகிறது.
- source_word: הָרִים
  choice: உயர்த்தப்படுதல்
  rationale: רום (‘உயர்த்து’) என்பதுடன் தொடர்புடைய வாசிப்பை ஏற்று, அடுத்த வசனத்தில் ஒருவர் தாழ்த்தப்பட்டு மற்றொருவர் உயர்த்தப்படுவதோடு உள்ள சொற்பொருள் தொடர்பைக் காக்கிறது; எபிரெயத்தின் விடுபட்ட வாக்கிய அமைப்பைத் தமிழில் நிறைவு செய்கிறது.
theological_decisions:
- issue: கடினமான, சுருக்கப்பட்ட இறுதிக் கூறிலுள்ள הָרִים என்பதன் விளக்கம்
  choice: உயர்த்தப்படுதல் எந்தப் பூமிக்குரிய திசையிலிருந்தும் வருவதில்லை
  alternative: הָרִים என்பதை ‘மலைகள்’ என்று வாசித்து, ‘மலைகளுள்ள வனாந்தரத்திலிருந்தும் அல்ல’ எனப் பொருள்கொள்ளுதல்
  rationale: அடுத்த வசனத்தில் கடவுளே ஒருவரைத் தாழ்த்தி மற்றொருவரை உயர்த்துகிறார் என்பதால், ‘உயர்த்தப்படுதல்’ என்ற வாசிப்பு உடனடிச் சூழலுடன் மிக நன்றாகப் பொருந்துகிறது. எனினும் மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடையைக் கையாளுகிறது. எபிரெயத்தின் திசைவரிசையும் மறுப்பின் வலியுறுத்தலும் காக்கப்பட்டுள்ளன; கடினமான இறுதிச் சொல்லின் உண்மையான மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
