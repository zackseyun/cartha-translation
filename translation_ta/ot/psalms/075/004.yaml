  text: אָמַ֣רְתִּי לַֽ֭/הוֹלְלִים אַל תָּהֹ֑לּוּ וְ֝/לָ/רְשָׁעִ֗ים אַל תָּרִ֥ימוּ קָֽרֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/004.yaml
  text: I said to the boastful[a], “Do not boast,” and to the wicked, “Do not lift up your horn.”
translation:
  language: ta
  text: பெருமை பேசுபவர்களிடம், “பெருமை பேசாதீர்கள்” என்றும், பொல்லாதவர்களிடம், “கொம்பை[a] உயர்த்தாதீர்கள்” என்றும் நான் சொன்னேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வலிமையைக் காட்டிக்கொள்ளாதீர்கள்” அல்லது “இறுமாப்புக் கொள்ளாதீர்கள்.” எபிரெயத்தில் ‘கொம்பு’ என்பது வலிமை, அதிகாரம், அல்லது தற்பெருமையைக் குறிக்கும் உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: நான் சொன்னேன்
  rationale: אמר என்பதன் Qal முற்றுவினை, தன்மை ஒருமை வடிவம்; கவிதைச் சூழலில் நிறைவுற்ற கூற்றை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: הוֹלְלִים
  choice: பெருமை பேசுகிறவர்கள்
  rationale: இங்கு הלל பெருமைபாராட்டுதல் அல்லது தற்பெருமை பேசுதல் என்ற பொருளில் வருகிறது; அடுத்து வரும் அதே வேர் சார்ந்த வினையோடும் உள்ள சொல்விளையாட்டை இது காக்கிறது.
- source_word: אַל תָּהֹלּוּ
  choice: பெருமை பேசாதீர்கள்
  rationale: אַל உடன் வரும் இரண்டாம் நபர் பன்மைத் தடை வடிவம். பெயர்ச்சொல்லுடன் உள்ள எபிரெயச் சொல் தொடர்பையும் தமிழில் இயன்றவரை காக்கிறது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: சங்கீதங்களில் இது ஒழுக்கரீதியாகத் தீமை செய்கிறவர்களைக் குறிக்கும் பொதுவான சொல்; தேவையற்ற சட்டரீதியான நுண்பொருளைச் சேர்க்காது.
- source_word: אַל תָּרִימוּ
  choice: உயர்த்தாதீர்கள்
  rationale: רום என்பதன் Hiphil இரண்டாம் நபர் பன்மைத் தடை வடிவத்தை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: קָרֶן
  choice: உங்கள் கொம்பை
  rationale: மூலத்தில் உடைமைச்சுட்டு வெளிப்படையாக இல்லாவிட்டாலும், நேரடியாக அழைக்கப்படுகிறவர்களுக்குரிய கொம்பு என்பது எபிரெய உருவகத்தில் உள்ளார்ந்தது. தமிழில் ‘உங்கள்’ என்பது பொருளை இயல்பாக்குகிறது; ‘கொம்பு’ என்ற மூல உருவகத்தைத் தக்கவைக்கிறது.
theological_decisions:
- issue: ‘கொம்பு’ என்ற உருவகத்தின் பொருள்
  choice: முதன்மை உரையில் ‘உங்கள் கொம்பை உயர்த்தாதீர்கள்’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘உங்கள் வலிமையை உயர்த்தாதீர்கள்’ அல்லது ‘இறுமாப்புக் கொள்ளாதீர்கள்’
  rationale: எபிரெய வேதாகமக் கவிதையில் ‘கொம்பு’ வலிமை, அதிகாரம், உயர்ந்த நிலை அல்லது தற்பெருமையைக் குறிக்கலாம். ஒரு பொருளை மட்டும் தேர்ந்தெடுத்து பதற்றத்தை நீக்காமல், கவித்துவ உருவகத்தை உரையில் வைத்து அடிக்குறிப்பில் அதன் பொருள் வரம்பை விளக்குவது ஏற்றது.
translation_notes:
  register: நவீன பொதுத்தமிழில் மரியாதைப் பன்மை கட்டளை வடிவம் பயன்படுத்தப்பட்டுள்ளது. கவிதையின் இணை அமைப்பும் הוֹלְלִים / תָּהֹלּוּ ஆகியவற்றின் சொல் தொடர்பும் ‘பெருமை பேசுகிறவர்கள் / பெருமை பேசாதீர்கள்’ என்பதன் மூலம் இயன்றவரை பாதுகாக்கப்பட்டுள்ளன.
