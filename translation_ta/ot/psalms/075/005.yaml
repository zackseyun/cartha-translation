    reason: lexical_alternative
  - marker: b
    text: மாற்றாக, ‘விறைப்பான கழுத்துடன் பேசாதீர்கள்’ அல்லது ‘அடங்காத பெருமிதத்துடன் பேசாதீர்கள்.’ எபிரெயம் பெருமிதமான எதிர்ப்பைக் குறிக்கும் உடல் சார்ந்த உருவகத்தைப் பாதுகாக்கிறது.
    reason: lexical_alternative
