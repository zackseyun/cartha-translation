  text: Do not lift up your horn on high[b][a]; do not speak with an arrogant neck.
translation:
  language: ta
  text: உங்கள் கொம்பை மேலே உயர்த்தாதீர்கள்[a]; இறுமாப்பான கழுத்துடன் பேசாதீர்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
