  rationale: ஒருமைச் சூழலும் தெய்வீகத் தீர்ப்பின் கருத்தும் இயல்பாக ‘கடவுள்’ என்ற மொழிபெயர்ப்பை வேண்டுகின்றன.
- source_word: שֹׁפֵט
  choice: நீதிபதி
  rationale: எபிரெயப் பங்கேற்புவினை இங்கு பெயர்ச்சொல் போன்ற பயனிலை வலிமையுடன் கடவுளின் நீதித்தீர்ப்பு வகிக்கும் நிலையைச் சுட்டலாம்.
- source_word: זֶה ... וְזֶה
  choice: ஒருவரை ... மற்றொருவரை
  rationale: ‘இவரை ... இவரை’ என்ற சொற்சொல் அமைப்பு பகிர்நிலைப் பொருளில் வருகிறது; நவீன தமிழில் ‘ஒருவரை ... மற்றொருவரை’ என்பது இயல்பாக அந்த வேறுபாட்டைத் தருகிறது.
- source_word: יַשְׁפִּיל
  choice: தாழ்த்துகிறார்
  rationale: שׁפל என்பதன் ஹிஃபில் வடிவம் ‘தாழ்வாக்குதல்’ என்ற காரணவினைப் பொருளைக் கொண்டது; ‘தாழ்த்துகிறார்’ அதைக் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: יָרִים
  choice: உயர்த்துகிறார்
  rationale: רוּם என்பதன் ஹிஃபில் வடிவம் உயர்த்துதல் அல்லது மேன்மைப்படுத்துதல் எனப் பொருள்படும்; இங்கு ‘தாழ்த்துகிறார்’ என்பதற்கு இணையான செங்குத்து உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
