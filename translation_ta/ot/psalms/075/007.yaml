  text: 'For God is the judge: he brings one down[b][a], and lifts up another.'
translation:
  language: ta
  text: ஏனெனில், கடவுள் நீதிபதி[a]; அவர் ஒருவரைத் தாழ்த்துகிறார்[b], மற்றொருவரை உயர்த்துகிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுள் தீர்ப்பளிக்கிறார்.” எபிரெய மொழியிலுள்ள பங்கேற்புவினையை வினையாகவோ, பெயர்நிலைப் பயனிலையாகவோ புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: சொற்சொல்லாக, “இவரை அவர் தாழ்த்துகிறார்; இவரை உயர்த்துகிறார்”; இது “ஒருவரை ... மற்றொருவரை” என்னும் பகிர்நிலைப் பொருளைத் தரும் அமைப்பு.
    reason: lexical_alternative
