  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c][b]. Selah
translation:
  language: ta
  text: பூமியும் அதில் குடியிருப்போர் அனைவரும் உருகிப்போகின்றனர்[a]; நானே அதன் தூண்களை உறுதியாக நிலைநிறுத்தியிருக்கிறேன்[b]. சேலா[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உருகிப்போகின்றனர்’ என்பதற்கு ‘நிலைகுலைகின்றனர்,’ ‘கரைந்துபோகின்றனர்’ அல்லது ‘அசைக்கப்படுகின்றனர்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயப் படிமம் உறுதியிழத்தல் அல்லது சரிதலைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அதன் தூண்களை நிறுவியிருக்கிறேன்.’
    reason: lexical_alternative
  - marker: c
    text: ‘சேலா’ என்பது மரபுப்படி ஒலிபெயர்க்கப்படும் சொல்; அதன் துல்லியமான பொருள் உறுதியாகத் தெரியவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: נְמֹגִים
  choice: உருகிப்போகின்றனர்
  rationale: மூக் (מוג) என்ற வேர்ச்சொல் உருகுதல், கரைதல், நிலைகுலைதல் அல்லது சரிதல் ஆகிய படிமங்களைத் தருகிறது. இங்கு பூமியும் அதன் குடியிருப்போரும் உறுதியிழப்பதை உயிர்ப்புள்ள கவிதைப் படிமமாகப் பாதுகாக்க ‘உருகிப்போகின்றனர்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אֶרֶץ
  choice: பூமி
  rationale: ‘அதில் குடியிருப்போர் அனைவரும்’ என்பதுடனும் பூமியின் ‘தூண்கள்’ என்ற அண்டவியல் படிமத்துடனும் வருவதால், ஒரு குறிப்பிட்ட நாட்டைவிட முழுப் பூமியைக் குறிக்கும் பொருள் இங்கு பொருத்தமானது.
- source_word: יֹשְׁבֶיהָ
  choice: அதில் குடியிருப்போர் அனைவரும்
  rationale: ישב என்ற வினையின் பங்கேற்பு வடிவம் குடியிருப்போரைச் சுட்டுகிறது. இந்தத் தேர்வு மூலத்தின் வினைத்தன்மையையும் இயல்பான நவீன தமிழையும் காக்கிறது.
- source_word: אָנֹכִי
  choice: நானே
  rationale: தனியாக இடப்பட்டுள்ள முதலாம் நபர் சுட்டுப்பெயரின் அழுத்தத்தை, தனிமைப்படுத்தும் பொருளை மிகைப்படுத்தாமல் ‘நானே’ வெளிப்படுத்துகிறது.
- source_word: תִכַּנְתִּי
  choice: உறுதியாக நிலைநிறுத்தியிருக்கிறேன்
  rationale: כון என்பதன் பியேல் வடிவம் நிறுவுதல், உறுதிப்படுத்துதல், நிலைப்படுத்துதல் ஆகிய பொருள்களைக் கொள்ளும். ‘தூண்கள்’ என்ற சூழலில் நிலைப்படுத்தும் செயலை இத்தொடர் தெளிவாகக் காட்டுகிறது.
- source_word: עַמּוּדֶיהָ
  choice: அதன் தூண்கள்
  rationale: עַמּוּד என்பது தூண் அல்லது கம்பம் எனப் பொருள்படும். மூலத்தின் கவிதைமிகு அண்டவியல் படிமத்தை ‘தூண்கள்’ நேரடியாகப் பாதுகாக்கிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான பொருளும் செயல்பாடும் உறுதியாகத் தெரியாததால், ஊகப் பொருள் கொடுக்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: பூமியின் தூண்கள் என்ற அண்டவியல் படிமம்
  choice: ‘அதன் தூண்கள்’ என்ற மூலப் படிமத்தை அப்படியே வைத்தல்
  alternative: ‘அதன் அஸ்திவாரங்கள்’ அல்லது ‘அதன் ஆதாரங்கள்’ என்று விளக்கிப் பெயர்த்தல்
  rationale: சங்கீதம் கடவுளின் நிலைப்படுத்தும் ஆட்சியை வெளிப்படுத்தப் பண்டைய கவிதைமிகு உலகப் படிமத்தைப் பயன்படுத்துகிறது. இதை அறிவியல் விளக்கமாக மாற்றாமலும் உருவகத்தைத் தட்டையாக்காமலும் பாதுகாப்பது மூலத்திற்கு உண்மையாக உள்ளது.
translation_notes:
  register: நவீன தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் பொதுவாசகர்களுக்குப் புரியும் நடையிலும் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெய மொழியின் அழுத்தத்தை ‘நானே’ என்பதும், நிலையின்மையைச் சித்தரிக்கும் உருவகத்தை ‘உருகிப்போகின்றனர்’ என்பதும் காக்கின்றன.
