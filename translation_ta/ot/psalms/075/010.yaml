lexical_decisions:
- source_word: וְ/כָל
  choice: அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையைக் ‘அனைத்தையும்’ நேரடியாகத் தருகிறது. எபிரெய வாவ் இணைப்பின் ஓட்டம் தமிழில் இரண்டாம் அரையடியிலுள்ள ‘-ஓ’ எதிர்நிலையாலும் வாக்கியத் தொடர்ச்சியாலும் இயல்பாக வெளிப்படுகிறது.
- source_word: קַרְנֵי / קַרְנוֹת
  choice: கொம்புகள்
  rationale: கֶרֶן என்பதன் நேரடியான உருவகத்தைத் தக்கவைக்கிறது; இங்கு அது வலிமை, அதிகாரம் அல்லது உயர்ந்த நிலையைச் சுட்டலாம்.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: தீமை செய்பவர்களை ஒரு வகுப்பாகக் குறிக்கும் பன்மைச் சொல்லை நவீனத் தமிழில் இயல்பாகத் தருகிறது.
- source_word: אֲגַדֵּעַ
  choice: நான் வெட்டி வீழ்த்துவேன்
  rationale: גדע என்பது வெட்டித் துண்டித்தல் அல்லது வெட்டி வீழ்த்துதல் எனப் பொருள்படும்; கொம்பு உருவகத்தோடு பொருந்துவதோடு வலிமையைத் தீர்மானமாக அகற்றுவதையும் உணர்த்துகிறது.
- source_word: תְּרוֹמַמְנָה
  choice: உயர்த்தப்படும்
  rationale: רום வேரின் உயர்த்துதல் அல்லது மேன்மைப்படுத்துதல் என்ற பொருளையும், இங்குள்ள பெண்பால் பன்மை வினைவடிவத்தின் விளைவுநிலையையும் தக்கவைக்கிறது.
- source_word: צַדִּיק
  choice: நீதிமான்
  rationale: மூலத்தில் ஒருமையாக உள்ள צַדִּיק-ஐ அப்படியே வைத்துள்ளது; இது ‘தீயவர்கள்’ என்பதற்கு எதிராக ஒரு வகுப்பை பிரதிநிதித்துவப்படுத்தும் பொதுப்பொருள் ஒருமையாகப் புரிந்துகொள்ளலாம்.
theological_decisions:
- issue: ‘கொம்புகள்’ என்ற வலிமை/மேன்மை உருவகம்
  choice: முதன்மை உரையில் ‘கொம்புகள்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘தீயவர்களின் வலிமை அனைத்தையும் நான் அழிப்பேன்; நீதிமானின் வலிமையோ உயர்த்தப்படும்.’
  rationale: வேதாகமக் கவிதையில் கொம்பு வலிமை, அதிகாரம், கண்ணியம் அல்லது உயர்ந்த நிலையைச் சுட்டும் நிறுவப்பட்ட உருவகம். அதை ஒரே கருத்தாகச் சுருக்காமல் கவித்துவத்தையும் பொருள் விரிவையும் காக்கிறது.
- issue: צַדִּיק என்பதன் இலக்கண ஒருமை மற்றும் பொதுப்பொருள்
  choice: ‘நீதிமான்’ என்று ஒருமையைத் தக்கவைத்தல்
  alternative: ‘நீதிமான்களின் கொம்புகள்’
  rationale: மூல எபிரெயத்தில் ‘நீதிமான்’ ஒருமையாக இருந்தாலும், கவிதை இணைப்பில் நீதியுள்ளோரின் வகுப்பை பிரதிநிதித்துவப்படுத்தலாம். ஒருமையைத் தக்கவைப்பது இந்த இலக்கணச் சிறப்பையும் அதன் சாத்தியமான பொதுப்பொருளையும் மறைக்காது.
