  text: וַ֭/אֲנִי אַגִּ֣יד לְ/עֹלָ֑ם אֲ֝זַמְּרָ֗ה לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/009.yaml
  text: But as for me[a], I will declare forever; I will sing praise to the God of Jacob.
translation:
  language: ta
  text: ஆனால் நானோ[a] என்றென்றும் அறிவிப்பேன்; யாக்கோபின் தேவனைப் புகழ்ந்து பாடுவேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் நான் என்றென்றும் அறிவிப்பேன்.” எபிரெய இணைப்புச் சொல்லை “மற்றும்” என்ற பொருளிலும் கொள்ளலாம்; சூழலில் அது முரண்பாட்டைக் காட்டுவதால் இங்கே “ஆனால்” என மொழிபெயர்க்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: இணைப்புச் சொல்லுடன் வரும் தனிப்பட்ட சுட்டுப்பெயர் சூழலில் வலியுறுத்தலையும் முரண்பாட்டையும் குறிக்கிறது. ‘ஆனால் நானோ’ என்பது இரண்டையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַגִּיד
  choice: அறிவிப்பேன்
  rationale: נגד என்பதன் ஹிஃபில் வடிவம் ஒன்றைத் தெரிவிப்பது அல்லது அறியச் செய்வது என்று பொருள்படும்; ‘அறிவிப்பேன்’ அதன் பொதுவான, முறையான பொருளைக் காக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தைச் சுட்டும் இச்சொல், சங்கீதக்காரரின் தொடர்ந்த அறிவிப்பையும் புகழையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲזַמְּרָה
  choice: புகழ்ந்து பாடுவேன்
  rationale: זמר என்பதன் பியேல் வடிவம் இசையுடன் புகழ்வதைக் குறிக்கிறது; ‘புகழ்ந்து பாடுவேன்’ இசை மற்றும் துதி ஆகிய இரு கூறுகளையும் தருகிறது.
- source_word: לֵאלֹהֵי
  choice: தேவனை
  rationale: לְ இங்கு புகழின் பெறுநரைக் குறிக்கிறது. தமிழில் ‘தேவனைப் புகழ்ந்து பாடுவேன்’ என்பதே இயல்பான வினைத் தொடர்பு.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: தனிப்பெயர் தமிழில் நிலைபெற்ற வேதாகம மரபுப்படி ஒலிபெயர்க்கப்படுகிறது; உரையில் வேற்றுமை உருபுடன் ‘யாக்கோபின்’ என வருகிறது.
theological_decisions:
- issue: சுற்றியுள்ள வசனங்களில் வரும் பொல்லாதவர்களோடு பேசுபவர் தம்மை வேறுபடுத்திக் காட்டுதல்
  choice: தொடக்கத்தை வலியுறுத்தப்பட்ட முரண்பாடாக ‘ஆனால் நானோ’ என்று மொழிபெயர்த்தல்
  alternative: ‘நானும்’ அல்லது ‘நான்’
  rationale: எபிரெய இணைப்புச் சொல் ‘மற்றும்’ என்றும் மொழிபெயர்க்கப்படலாம்; எனினும், சூழலில் பொல்லாதவர்களுக்கு நேரிடுவதற்கும் சங்கீதக்காரரின் நிலையான அறிவிப்புக்கும் புகழுக்கும் இடையே முரண்பாடு தெரிகிறது. தெளிவற்ற தன்மையை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பானதும் கண்ணியமானதும் ஆக வடிவமைக்கப்பட்டது. ‘தேவன்’ மற்றும் ‘யாக்கோபு’ ஆகியவை பொதுவாக அறியப்பட்ட வேதாகமச் சொல்லாட்சியைப் பின்பற்றுகின்றன; எபிரெய உரையின் இணை அமைப்பும் எதிர்மறை வலியுறுத்தலும் காக்கப்பட்டுள்ளன.
