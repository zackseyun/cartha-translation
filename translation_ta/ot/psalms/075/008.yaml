  to: ஏனெனில், யாவேயின்[a] கையில் ஒரு கிண்ணம் இருக்கிறது; அதில் திராட்சரசம் நுரைக்கிறது, நன்கு கலக்கப்பட்டிருக்கிறது[b]. அவர் அதிலிருந்து ஊற்றுகிறார். ஆனால் அதன் வண்டலை பூமியிலுள்ள கொடியவர்கள் அனைவரும் முற்றிலும் உறிஞ்சிக் குடிப்பார்கள்[c].
