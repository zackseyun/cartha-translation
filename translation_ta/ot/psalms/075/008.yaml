theological_decisions:
- issue: தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர் / கர்த்தர் / யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பெயரை பட்டப்பெயரால் மாற்றாமல் காக்கிறது; ஒரு குறிப்பிட்ட சமய மரபின் வழக்கை பிரதான உரையில் முன்னிறுத்துவதைத் தவிர்க்கிறது.
- issue: கிண்ண உருவகம்
  choice: தீர்ப்பு என்று விளக்கிச் சேர்க்காமல் கிண்ணம் மற்றும் பானம் என்ற உருவகத்தையே தக்கவைத்தல்
  alternative: ‘கோபத்தின் கிண்ணம்’ அல்லது ‘தீர்ப்பின் கிண்ணம்’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: சூழல் தெய்வீகத் தீர்ப்பைக் குறிப்பிட்டாலும், இந்த வசனம் ‘கோபம்’ அல்லது ‘தீர்ப்பு’ என்ற பெயர்ச்சொற்களை நேரடியாகப் பயன்படுத்தவில்லை; ஆகவே இறையியல் உட்பொருளை பிரதான உரையில் சேர்க்கவில்லை.
- issue: אַךְ என்பதன் வலிமை
  choice: வண்டலையோ
  alternative: நிச்சயமாக / ஆனால்
  rationale: இந்தத் துகள் வண்டலை வலியுறுத்தலாம் அல்லது கூற்றின் நிச்சயத்தன்மையைச் சுட்டலாம். தமிழ் வாக்கிய அமைப்பில் ‘-யோ’ வண்டலுக்கு இயல்பான வலியுறுத்தலைத் தருகிறது; மாற்றுப் பொருள் குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, வழிபாட்டுத் தன்மையுள்ளதாயினும் பொதுவாசகர்களுக்குப் புரியும் நடை. ‘திராட்சரசம்,’ ‘கிண்ணம்,’ ‘வண்டல்’ ஆகிய சொற்கள் கவிதைப் படிமத்தை காக்கின்றன. எபிரெய இணைப்புச் சொற்களை அப்படியே குவிக்காமல், அரைப்புள்ளி மற்றும் குறுகிய வாக்கியங்கள் மூலம் இயல்பான தமிழ் ஓட்டம் உருவாக்கப்பட்டுள்ளது.
