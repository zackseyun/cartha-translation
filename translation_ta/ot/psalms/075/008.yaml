- source_word: וַיַּגֵּר מִזֶּה
  choice: அவர் அதிலிருந்து ஊற்றுகிறார்
  rationale: வினையின் ஊற்றுதல் என்ற பொருளையும் מִזֶּה என்பதன் ‘அதிலிருந்து’ என்ற உறவையும் இயல்பான தமிழில் தருகிறது.
- source_word: אַךְ
  choice: -யோ
  rationale: வண்டல்மீது வலியுறுத்தலை இயல்பான தமிழ் எதிர்நிலைத் துகளால் வெளிப்படுத்துகிறது; ‘நிச்சயமாக’ என்பதும் சாத்தியம்.
- source_word: שְׁמָרֶיהָ
  choice: அதன் வண்டல்
  rationale: கிண்ணத்தின் அடியில் தங்கும் திராட்சரசப் படிவத்தைக் குறிக்கும் துல்லியமான தமிழ் சொல்.
- source_word: יִמְצוּ יִשְׁתּוּ
  choice: கடைசிவரை உறிஞ்சிக் குடிப்பார்கள்
