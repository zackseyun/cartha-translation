  text: כִּ֤י כ֪וֹס בְּֽ/יַד יְהוָ֡ה וְ/יַ֤יִן חָמַ֨ר מָ֥לֵא מֶסֶךְ֮ וַ/יַּגֵּ֪ר מִ֫/זֶּ֥ה אַךְ שְׁ֭מָרֶי/הָ יִמְצ֣וּ יִשְׁתּ֑וּ כֹּ֝֗ל רִשְׁעֵי אָֽרֶץ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/008.yaml
  text: For a cup is in the hand of Yahweh[a], and the wine foams, full of mixed spices; he pours from it[c][b], and surely all the wicked of the earth will drain its dregs and drink.
translation:
  language: ta
  text: ஏனெனில், யாவேயின்[a] கையில் ஒரு கிண்ணம் இருக்கிறது; அதில் திராட்சரசம் நுரைக்கிறது, நன்கு கலக்கப்பட்டிருக்கிறது[b]. அவர் அதிலிருந்து ஊற்றுகிறார். ஆனால் அதன் வண்டலை பூமியிலுள்ள கொடியவர்கள் அனைவரும் முற்றிலும் உறிஞ்சிக் குடிப்பார்கள்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘யாவே’ என்பது எபிரெய மூலத்தில் வரும் கடவுளின் தனிப்பெயர்; சில மொழிபெயர்ப்புகள் இதை ‘ஆண்டவர்’ அல்லது ‘கர்த்தர்’ என்று வழங்குகின்றன.
    reason: divine_name
  - marker: b
    text: 'வேறு மொழிபெயர்ப்பு: ‘கலவையால் நிறைந்திருக்கிறது.’ எதைக் கலந்து தயாரித்தார்கள் என்பதை எபிரெய உரை குறிப்பிடவில்லை; நறுமணப் பொருட்கள் கலந்திருக்கலாம்.'
    reason: lexical_alternative
  - marker: c
    text: ‘வண்டல்’ என்பது கிண்ணத்தின் அடியில் தங்கும் திராட்சரசப் படிவு. கொடியவர்கள் அதை ஒரு துளியும் விடாமல் குடிப்பார்கள் என்பதே இங்குள்ள படிமம். ‘ஆனால்’ என்பதற்குப் பதிலாக ‘நிச்சயமாக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: cultural_and_lexical_note
