  text: We give thanks to you[a], O God; we give thanks, for your name is near[c][b]; your wondrous deeds are recounted.
translation:
  language: ta
  text: கடவுளே, உமக்கு நன்றி செலுத்துகிறோம்; நன்றி செலுத்துகிறோம்; ஏனெனில் உமது பெயர் அருகில் இருக்கிறது.[a] உமது வியத்தகு செயல்களை எடுத்துரைக்கிறார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உமது பெயர் அருகில் இருக்கிறது’ என்பது கடவுளின் அருகாமை, வெளிப்படும் பிரசன்னம், வெளிப்பட்ட பண்பு அல்லது புகழ் ஆகியவற்றைக் குறிக்கலாம்; எபிரெய மொழிநடை விளக்கிப் பரப்பப்படாமல் காக்கப்பட்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: 'அல்லது: “அவர்கள் உமது வியத்தகு செயல்களை விவரிக்கிறார்கள்.” எபிரெயில் எழுவாய் வெளிப்படையாகக் குறிப்பிடப்படாத மூன்றாம் நபர் பன்மை வினை உள்ளது.'
    reason: lexical_alternative
