  rationale: இச்சங்கீதச் சூழலில் ידה என்பதன் ஹிஃபில் வடிவம் கடவுளை நோக்கிய நன்றியையும் புகழையும் குறிக்கிறது. தமிழில் ‘நன்றி செலுத்துகிறோம்’ என்பது இயல்பாகவும் துல்லியமாகவும் உள்ளது; எபிரெய மூலத்தின் இருமுறை கூறுதலும் காக்கப்பட்டுள்ளது.
- source_word: לְּךָ אֱלֹהִים
  choice: கடவுளே, உமக்கு
  rationale: לְךָ என்பதிலுள்ள ‘உமக்கு’ என்ற நேரடிப் பொருள் வெளிப்படையாக வைக்கப்பட்டுள்ளது; אֱלֹהִים நேரடி அழைப்பாக ‘கடவுளே’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְקָרוֹב
  choice: ஏனெனில் ... அருகில் இருக்கிறது
  rationale: וְ என்ற இணைப்புச்சொல் இங்கு நன்றி செலுத்துவதற்கான காரணத்தை அறிமுகப்படுத்துவதாகப் புரிந்துகொள்ளலாம். இயல்பான தமிழுக்காக ‘ஏனெனில்’ பயன்படுத்தப்பட்டுள்ளது; ‘மற்றும்’ என்ற நேரடியான வாய்ப்பு அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: שְׁמֶךָ
  choice: உமது பெயர்
  rationale: கடவுளின் பிரசன்னம், வெளிப்படுத்தப்பட்ட பண்பு அல்லது புகழ் என ஒன்றை மட்டும் தேர்ந்தெடுத்து விளக்காமல், எபிரெய இறையியல் மொழிநடையான ‘உமது பெயர்’ அப்படியே காக்கப்பட்டுள்ளது.
- source_word: סִפְּרוּ
  choice: எடுத்துரைக்கிறார்கள்
  rationale: இது வெளிப்படையான எழுவாய் இல்லாத மூன்றாம் நபர் பன்மை வினை. எழுவாயைச் சேர்க்காமலேயே இயல்பாக அமைக்க முடியும் தமிழின் தன்மையைப் பயன்படுத்தி, மூலத்திலுள்ள குறிப்பிடப்படாத எழுவாய் காக்கப்பட்டுள்ளது.
- source_word: נִפְלְאוֹתֶיךָ
  choice: உமது வியத்தகு செயல்கள்
  rationale: இந்தச் சொல் வியப்பை உண்டாக்கும் கடவுளின் அசாதாரண செயல்களைக் குறிக்கிறது. ‘வியத்தகு செயல்கள்’ என்பது அவை வெறும் அதிசயங்கள் அல்ல, கடவுள் செய்த செயல்கள் என்பதையும் தெளிவாக்குகிறது.
theological_decisions:
- issue: ‘உமது பெயர் அருகில் இருக்கிறது’ என்பதன் பொருள்
  choice: ‘பெயர்’ மற்றும் ‘அருகில்’ என்ற எபிரெய உருவக மொழியை விளக்கிப் பரப்பாமல் அப்படியே வைத்தல்
  alternative: ‘உமது பிரசன்னம் அருகில் இருக்கிறது’ அல்லது ‘உமது புகழ் எங்கும் பரவியுள்ளது’
  rationale: சங்கீதங்களில் கடவுளின் ‘பெயர்’ அவரது வெளிப்படுத்தப்பட்ட பண்பு, புகழ் அல்லது உடன்படிக்கைப் பிரசன்னத்தைக் குறிக்கலாம். இவற்றில் ஒன்றை மட்டும் மூலவசனம் கட்டாயப்படுத்தாததால், அதன் செறிவும் உண்மையான தெளிவின்மையும் காக்கப்பட்டுள்ளன.
