  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சங்கீத மொழிநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதை ஒருமைக்காக ‘உமக்கு/உமது’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் மீளுரைத்தலும் ‘பெயர் அருகில்’ என்ற செறிவான இறையியல் உருவகமும் காக்கப்பட்டுள்ளன.
