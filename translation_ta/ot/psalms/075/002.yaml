id: PSA.75.2
reference: Psalms 75:2
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּ֭י אֶקַּ֣ח מוֹעֵ֑ד אֲ֝נִ֗י מֵישָׁרִ֥ים אֶשְׁפֹּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/002.yaml
  text: For when I choose the appointed time[b][a], I myself will judge with uprightness.
translation:
  language: ta
  text: ஏனெனில், நான் குறித்த காலத்தைத் தேர்ந்தெடுக்கும்போது[a], நானே நேர்மையுடன் தீர்ப்பளிப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நியமிக்கப்பட்ட காலத்தை நான் எடுத்துக்கொள்ளும்போது, நானே சமநீதியுடன் தீர்ப்பளிப்பேன்.’ எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் ‘எடுத்துக்கொள்வேன்’; ‘சமநீதியுடன்’ என்பதும் מֵישָׁרִים என்பதற்குச் சாத்தியமான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இங்கு வருகிறது.
- source_word: אֶקַּח
  choice: நான் தேர்ந்தெடுக்கும்போது
  rationale: לקח என்பதன் நேரடிப் பொருள் ‘எடுத்துக்கொள்’; ஆனால் מוֹעֵד உடன் சேர்ந்த இச்சொற்றொடர் நியமிக்கப்பட்ட நேரத்தைத் தேர்ந்தெடுப்பதை அல்லது எடுத்துக்கொள்வதை உணர்த்துகிறது. காலநிலைச் சார்பை இயல்பான தமிழில் ‘-ம்போது’ காட்டுகிறது.
- source_word: מוֹעֵד
  choice: நியமிக்கப்பட்ட காலத்தை
  rationale: குறிக்கப்பட்ட அல்லது நிர்ணயிக்கப்பட்ட நேரம் என்ற பொருளைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: אֲנִי
  choice: நானே
  rationale: வினைச்சொல்லிலேயே முதலாம் நபர் குறிக்கப்பட்டிருந்தும் தனிப் பிரதிப்பெயர் பயன்படுத்தப்பட்டுள்ள வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: מֵישָׁרִים
  choice: நேர்மையுடன்
  rationale: நீதித்தீர்ப்பில் செம்மை, நேர்மை, சமநீதி ஆகிய பொருள் நிழல்களைக் கொண்ட பன்மை பெயர்ச்சொல்லை இயல்பான தமிழில் தருகிறது.
- source_word: אֶשְׁפֹּט
  choice: தீர்ப்பளிப்பேன்
  rationale: இச்சூழலில் שׁפט நீதித்துறைச் செயலைக் குறிக்கிறது; எதிர்கால அறிவிப்பின் தொனியையும் இத்தேர்வு காக்கிறது.
theological_decisions:
- issue: பேசுபவரும் நீதித்தீர்ப்பின் உரிமைக்கோரலும்
  choice: முதலாம் நபரில் பேசுபவர் தாம் நியமிக்கப்பட்ட காலத்தில் தீர்ப்பளிப்பதாகக் கூறும் அறிவிப்பாக மொழிபெயர்க்கப்பட்டது; சூழலில் இது இறைவனின் உரையாகப் புரிந்துகொள்ளப்படுகிறது.
  alternative: இவ்வசனத்தை மட்டும் தனியே நோக்கும்போது, பேசுபவரை வெளிப்படையாக இறைவன் என்று மொழிபெயர்ப்பில் அடையாளப்படுத்தாமல் பொதுவான முதலாம் நபர் உரையாக வைத்திருக்கலாம்.
  rationale: எபிரெய மூலத்தில் இறைவனைக் குறிக்கும் பெயர் இவ்வசனத்தில் வெளிப்படையாக இல்லை. ஆகவே ‘கடவுள்’ என்ற சொல்லைச் சேர்க்காமல், சங்கீதச் சூழல் தரும் தெய்வீக நீதித்தீர்ப்பின் தொனியைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டது. ‘நானே’ என்பது எபிரெய தனிப் பிரதிப்பெயரின் வலியுறுத்தலைக் காக்கிறது; ‘தீர்ப்பளிப்பேன்’ நீதித்துறைத் தொனியைத் தெளிவாக்குகிறது.
