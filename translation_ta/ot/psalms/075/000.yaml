  text: לַ/מְנַצֵּ֥חַ אַל תַּשְׁחֵ֑ת מִזְמ֖וֹר לְ/אָסָ֣ף שִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] A psalm of Asaph[b]. A song.'
translation:
  language: ta
  text: 'இசைத் தலைவருக்கு: “அழிக்காதே.”[a] ஆசாப்பின் சங்கீதம்.[b] ஒரு பாடல்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இது “அழிக்காதே” எனப்படும் ஒரு மெட்டையோ இசை நிகழ்த்தல் குறிப்பையோ குறிக்கக்கூடும்.
    reason: cultural_note
  - marker: b
    text: “ஆசாப்பின்” என்பது ஆசாப்பு இதை இயற்றினார் என்பதையோ, அவரோடு தொடர்புடையது என்பதையோ, ஆசாப்பியத் தொகுப்பைச் சேர்ந்தது என்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீத முன்னுரைகளில் இசை நிகழ்த்தலை மேற்பார்வையிடுபவரைக் குறிக்கும் வழக்குச் சொல்லாக இருப்பதால், அதன் இசை மற்றும் வழிபாட்டுப் பணியைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אַל תַּשְׁחֵת
  choice: “அழிக்காதே”
  rationale: இது சங்கீதத்தின் கருத்துரையின் ஒரு பகுதியாக அல்லாமல், இசை மெட்டு அல்லது இசைக் குறிப்பின் தலைப்பாக இருக்கக்கூடும்; மேற்கோள் குறிகள் அந்தப் பயன்பாட்டைக் காட்டுகின்றன.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: מִזְמוֹר என்பதற்கான நிலையான வகைப்பெயர்; தொடர்ந்து வரும் שִׁיר என்பதிலிருந்து இதைத் தனியாக வைத்திருக்கிறது.
- source_word: לְאָסָף
  choice: ஆசாப்பின்
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, அல்லது ஆசாப்பியத் தொகுப்பில் சேர்ந்திருத்தல் ஆகியவற்றைக் குறிக்கலாம்; ‘ஆசாப்பின்’ இவற்றில் ஒன்றை மட்டும் தீர்மானிக்காமல் இயல்பாக உள்ளது.
- source_word: שִׁיר
  choice: ஒரு பாடல்
  rationale: இரண்டாவது வகைப்பெயரைத் தனியே மொழிபெயர்த்து, எபிரெய உரையிலுள்ள இரட்டை அடையாளத்தைப் பாதுகாக்கிறது.
