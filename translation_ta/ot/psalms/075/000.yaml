translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீத முன்னுரைக்கேற்ற சுருக்கமான, கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் வரிசையும் இரட்டை வகைப்பெயர்களும் பாதுகாக்கப்பட்டுள்ளன; לְאָסָף என்பதிலுள்ள உண்மையான பொருள் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
