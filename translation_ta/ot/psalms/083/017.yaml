source:
  edition: WLC
  text: יֵבֹ֖שׁוּ וְ/יִבָּהֲל֥וּ עֲדֵי עַ֗ד וְֽ/יַחְפְּר֥וּ וְ/יֹאבֵֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/017.yaml
  text: Let them be put to shame and be terrified forever[a]; let them be disgraced and perish.
translation:
  language: ta
  text: அவர்கள் என்றென்றும் வெட்கமடைந்து திகிலடைவார்களாக[a]; அவமானமடைந்து அழிந்துபோவார்களாக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் வெட்கத்துக்குள்ளாகி ... இழிவடைவார்களாக.’ எபிரெயத்தில் வெட்கம் அல்லது அவமானத்தைக் குறிக்கும், பொருளில் நெருங்கிய ஆனால் நிழற்பொருளில் சற்றே வேறுபடும் இரண்டு சொற்கள் (בוש, חפר) பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: வெட்கமடைவார்களாக
  rationale: בוש என்பதன் Qal imperfect 3mp வடிவம் இச்சூழலில் வேண்டுதல்/சாபவாக்கிய வலிமையைக் கொண்டுள்ளது. ‘வெட்கமடைவார்களாக’ என்பது அதன் நிலை அல்லது விளைவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְיִבָּהֲלוּ
  choice: திகிலடைவார்களாக
  rationale: בהל என்பதன் Niphal வடிவம் கலக்கம், திகைப்பு, அச்சம் ஆகிய தீவிர உணர்வுகளைக் குறிக்கிறது. எதிரிகளுக்கு எதிரான நியாயத்தீர்ப்புச் சூழலில் ‘திகிலடைவார்களாக’ அதன் வலிமையைப் பாதுகாக்கிறது.
- source_word: עֲדֵי עַד
  choice: என்றென்றும்
  rationale: நீடித்த காலத்தை வலியுறுத்தும் எபிரெயச் சொற்றொடருக்கு ‘என்றென்றும்’ இயல்பான, செறிவான தமிழ் இணையாகும்.
- source_word: וְיַחְפְּרוּ
  choice: அவமானமடைவார்களாக
  rationale: חפר இங்கு வெட்கம் அல்லது இழிவை அடைவதைக் குறிக்கிறது. בוש உடன் உள்ள நெருங்கிய பொருள் உறவைப் பாதுகாத்தபடியே அதன் பொது இழிவு நிழற்பொருளை வேறுபடுத்த ‘அவமானமடைவார்களாக’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְיֹאבֵדוּ
  choice: அழிந்துபோவார்களாக
  rationale: אבד என்பதன் பொதுவான ‘அழிதல்/ஒழிதல்’ பொருளை, அழிவின் முறையைத் தேவையின்றி குறிப்பாக்காமல், இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: வேண்டுதல் அல்லது சாபவாக்கிய வினைவலிமை
  choice: வினைமுற்றுகளை ‘-வார்களாக’ என்ற வேண்டுதல் வடிவில் மொழிபெயர்த்தல்
  alternative: அவர்கள் என்றென்றும் வெட்கமடைந்து திகிலடைவார்கள்; அவமானமடைந்து அழிந்துபோவார்கள்
  rationale: சங்கீதத்தின் சூழலில் இவ்வினைகள் வெறும் எதிர்கால முன்னறிவிப்பாக அல்லாமல், எதிரிகளுக்கு எதிரான வேண்டுதல்களாகச் செயல்படுகின்றன. ‘-வார்களாக’ என்பது அந்த வலிமையை விளக்கவுரை சேர்க்காமல் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்குரிய கண்ணியத்தையும் இணை அமைப்பையும் காக்கும் வகையில் மொழிபெயர்க்கப்பட்டது. ‘வெட்கமடைந்து / அவமானமடைந்து’ என்ற இணைச் சொற்கள் மூலத்தின் மீள்வருகையையும் நுண் வேறுபாட்டையும் தக்கவைக்கின்றன.
