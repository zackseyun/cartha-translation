- source_word: לִבְנֵי לוֹט
  choice: லோத்தின் மக்களுக்கு
  rationale: ‘லோத்தின் மகன்கள்’ என்ற எபிரெய உறவுமுறைச் சொல்லாட்சியைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது; இது வழித்தோன்றிய மக்களினங்களைக் குறிக்கலாம் என்பதைக் குறிப்பில் விளக்குகிறது.
- source_word: סֶלָה
