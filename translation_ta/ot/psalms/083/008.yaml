  rationale: எபிரெய பன்மையைப் பாதுகாக்கிறது; ‘ஆனார்கள்’ என்று வளர்ச்சி அல்லது மாற்றத்தைத் தீர்மானமாகச் சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: זְרוֹעַ
