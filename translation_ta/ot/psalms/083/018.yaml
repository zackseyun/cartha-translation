translation:
  language: ta
  text: யாவே என்பது உமது பெயர் என்பதையும், நீர் ஒருவரே பூமி முழுவதின்மேலும் உன்னதமானவர் என்பதையும் அவர்கள் அறிந்துகொள்ளட்டும்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“யாவே” என்பது எபிரெய மொழியிலுள்ள יהוה (YHWH) என்ற தெய்வீகப் பெயரின் ஒலிபெயர்ப்பு; இது மரபாக “கர்த்தர்” என்றும், சில இடங்களில் “யெகோவா” என்றும் வழங்கப்படுகிறது. அல்லது: “யாவே என்னும் பெயருடைய நீர் ஒருவரே பூமி முழுவதின்மேலும் உன்னதமானவர் என்பதை அவர்கள் அறிந்துகொள்ளட்டும்.”'
    reason: தெய்வீகப் பெயரின் வடிவத்தையும், எபிரெயத் தொடரை உறவுச் சொற்றொடராக அமைக்கக்கூடிய மாற்றுச் சொல்லமைப்பையும் விளக்குகிறது.
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: அவர்கள் அறிந்துகொள்ளட்டும்
  rationale: முந்தைய வசனங்களின் வேண்டுதல் சூழலில், இணைப்புடன் வந்துள்ள எபிரெய இறந்தகாலமல்லாத வினையை விருப்பம் அல்லது வேண்டுதலாக இயல்பான தமிழில் தருகிறது.
- source_word: כִּי
  choice: என்றும் … என்றும்
  rationale: அவர்கள் அறியவேண்டிய கருத்தின் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது; தமிழில் இணையான இரண்டு கூறுகளை ‘என்றும்’ கொண்டு இணைப்பது தெளிவாக உள்ளது.
- source_word: שִׁמְךָ יְהוָה
  choice: உமது பெயர் யாவே
  rationale: எபிரெய மூலத்தின் நேரடியான அடையாளப்படுத்தலைத் தக்கவைத்து, தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: לְבַדֶּךָ
  choice: நீர் ஒருவரே
  rationale: முகவரியாகிய இறைவனுக்கு மட்டுமே இந்நிலை உரியது என்ற வலியுறுத்தலை இயல்பான, மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: மேலானதும் ஒப்பற்றதுமான தெய்வீக நிலையைத் தெரிவிக்கும் எபிரெயச் சொல்லுக்கு தற்போதைய பொதுத் தமிழில் புரியக்கூடிய கண்ணியமான இணை.
- source_word: עַל כָּל הָאָרֶץ
  choice: பூமி முழுவதற்கும்
  rationale: இங்கு עַל மேலாதிக்கத்தையும் הָאָרֶץ உலகளாவிய ‘பூமி’யையும் குறிக்கின்றன; ‘முழுவதற்கும்’ அந்த விரிவையும் ஆட்சிசார் உறவையும் இயல்பாகத் தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக உள்ளது. அதை ஒரு பட்டமாக மாற்றாமல், பொதுவாக ஏற்றுக்கொள்ளப்படும் ஒலிப்புக்கு நெருக்கமாக ‘யாவே’ என வழங்குவது மூல வடிவத்தை வெளிப்படையாகப் பாதுகாக்கிறது.
- issue: לְבַדֶּךָ என்பதன் இலக்கணத் தொடர்பு
  choice: உன்னதமானவர் நீர் ஒருவரே என்ற தனித்தன்மை
  alternative: யாவே என்ற பெயர் உமக்கு மட்டுமே உரியது
  rationale: எபிரெயச் சொல் வரிசை இருவிதத் தொடர்புக்கும் இடமளிக்கக்கூடும். பிரதான உரை, உலகமெங்கும் உன்னதமானவர் அவர் ஒருவரே என்ற இயல்பான வாசிப்பைத் தருகிறது; மாற்று இலக்கணத் தொடர்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை நோக்கும் மரியாதைப் பன்மையான ‘உமது/நீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. வசனம் பொதுவாசகர்களுக்குப் புரியும்படி இயல்பாக இருந்தாலும், ‘யாவே’ என்ற மூலப் பெயரும் לְבַדֶּךָ-வின் உண்மையான இலக்கணத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
