source:
  edition: WLC
  text: אֱלֹהִ֥ים אַל דֳּמִי לָ֑/ךְ אַל תֶּחֱרַ֖שׁ וְ/אַל תִּשְׁקֹ֣ט אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/001.yaml
  text: O God[a], do not be silent; do not be still[b], O God.
translation:
  language: ta
  text: கடவுளே[a], மௌனமாயிராதீர்; செவிகொடாதிராதீர்[b]; அமைதியாயிராதீர், வல்லவரே!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இவ்வசனத்தில் எபிரேயம் இரண்டு வேறுபட்ட இறைத் தலைப்புகளைப் பயன்படுத்துகிறது: אֱלֹהִים (‘கடவுள்’) மற்றும் אֵל (‘கடவுள்’; ‘வல்லவர்’ என்றும் பொருள்கொள்ளலாம்).'
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மௌனமாயிராதீர்.’ இந்த எபிரேய வினைச்சொல் ‘செவிடாயிருத்தல்’ அல்லது ‘மௌனமாயிருத்தல்’ என்னும் பொருள்களைக் கொண்டிருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: வேண்டுதலில் நேரடியாக அழைக்கும் விளிவடிவம்; நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் உள்ளது.
- source_word: אַל דֳּמִי לָךְ
  choice: மவுனமாயிராதீர்
  rationale: தேவன் பேசாமலும் தலையிடாமலும் இருப்பதை வேண்டாம் எனக் கோரும் எபிரேயச் சொற்றொடரின் மவுனம்/செயலின்மைச் சாயலைப் பாதுகாக்கிறது.
- source_word: אַל תֶּחֱרַשׁ
  choice: செவிகொடாதிராதீர்
  rationale: חרשׁ என்பதன் ‘கேளாமலிருத்தல்’ மற்றும் ‘மவுனமாயிருத்தல்’ ஆகிய பொருள் பரப்பில், முந்தைய வினையிலிருந்து வேறுபாட்டையும் பதிலளிக்காத நிலையின் தீவிரத்தையும் காக்கிறது.
- source_word: וְאַל תִּשְׁקֹט
  choice: செயலற்று அமைதியாயிராதீர்
  rationale: שׁקט குறிக்கும் அமைதி, ஓய்வு, அசைவின்மை ஆகியவற்றைச் சூழலில் செயலற்றிருத்தல் என இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵל
  choice: வல்லவரே
  rationale: முதல் இறைப்பட்டமான אֱלֹהִים என்பதிலிருந்து எபிரேயத்தில் உள்ள வேறுபாட்டைத் தமிழிலும் காட்டுகிறது; אֵל என்பதன் வல்லமைச் சாயலை அளவுக்கு மீறாமல் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: אֱלֹהִים மற்றும் אֵל என்னும் இரு இறைப்பட்டங்களின் வேறுபாடு
  choice: முறையே ‘கடவுளே’ மற்றும் ‘வல்லவரே’
  alternative: இரண்டையும் ‘கடவுளே’ என்று மொழிபெயர்த்தல்
  rationale: மூலத்தில் பயன்படுத்தப்பட்டுள்ள இரு தொடர்புடைய ஆனால் வேறுபட்ட பட்டங்களைத் தமிழில் இயல்பாக வேறுபடுத்துகிறது; தனிப்பட்ட கோட்பாட்டைச் சேர்க்காமல் אֵל என்பதிலுள்ள வல்லமைச் சாயலைக் காக்கிறது.
- issue: תֶּחֱרַשׁ என்பதன் பொருள்
  choice: செவிகொடாதிராதீர்
  alternative: மவுனமாயிராதீர் / பேசாமலிராதீர்
  rationale: இந்த வேர்ச்சொல் கேளாமை அல்லது மவுனம் ஆகிய இரண்டையும் குறிக்கலாம். முன்னரே மவுனம் குறிப்பிடப்படுவதால், கவிதையின் முன்னேற்றத்தையும் உண்மையான சொற்பொருள் தெளிவின்மையையும் அடிக்குறிப்புடன் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; இறைவனை நேரடியாக அழைக்கும் கண்ணியமான வேண்டுதல் நடை. மூன்று எதிர்மறை வேண்டுதல்களையும் மூலத்தின் கவிதைத் தீவிரத்தையும் பாதுகாக்கிறது.
