revisions:
- from: அவ்வாறே, உமது புயலால் அவர்களைத் துரத்தி, உமது பெருங்காற்றால் அவர்களைத் திகிலடையச் செய்யும்.[a]
  to: அவ்வாறே, உமது புயலால் அவர்களைத் துரத்துவீராக; உமது சூறாவளியால் அவர்களைப் பீதியடையச் செய்வீராக.[a]
  rationale: The revision makes the petitionary force explicit in idiomatic modern Tamil and strengthens the rendering of סוּפָה from a generic strong wind to a violent storm. It preserves direct address, the imprecatory poetic register, the instrumental sense of both בְּ phrases, and the lexical distinction between the paired weather terms.
  reviewer_model: gpt-5.6-terra
