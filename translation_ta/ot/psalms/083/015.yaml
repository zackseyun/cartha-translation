  yaml_path: translation/ot/psalms/083/015.yaml
  text: So pursue them with your storm[a], and terrify them with your tempest.
translation:
  language: ta
  text: அவ்வாறே, உமது புயலால் அவர்களைத் துரத்துவீராக; உமது சூறாவளியால் அவர்களைப் பீதியடையச் செய்வீராக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “இவ்விதமாக, உமது புயலால் அவர்களைத் துரத்துவீராக; உமது சுழற்காற்றால் அவர்களைப் பீதியடையச் செய்வீராக.”'
    reason: כֵּן என்பதற்கு «இவ்விதமாக» என்பதும், סוּפָה என்பதற்கு «சுழற்காற்று» என்பதும் சாத்தியமான மாற்று மொழிபெயர்ப்புகள்.
lexical_decisions:
- source_word: כֵּן
  choice: அவ்வாறே
  rationale: முந்தைய வசனத்தின் உருவகத்துடன் இவ்விணைப்புச் சொல் தொடர்பை ஏற்படுத்தி, வேண்டப்படும் செயல்முறையை இயல்பான தமிழில் காட்டுகிறது.
- source_word: תִּרְדְּפֵם
  choice: அவர்களைத் துரத்தி
  rationale: רדף என்பதன் துரத்துதல் அல்லது பின்தொடர்ந்து விரட்டுதல் என்ற பொருளை, போர்ச் சூழலும் கவிதை நடையும் பொருந்துமாறு தருகிறது.
- source_word: בְּסַעֲרֶךָ
  choice: உமது புயலால்
  rationale: בְ இங்கு கருவிப்பொருளில் வருவதையும், סער குறிக்கும் கடும் புயலையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וּבְסוּפָתְךָ
  choice: உமது பெருங்காற்றால்
  rationale: סופה குறிக்கும் வன்மையான சுழற்காற்று அல்லது பெரும்புயலை வெளிப்படுத்தி, முந்தைய סער என்பதிலிருந்து கவிதைநயமுள்ள வேறுபாட்டைப் பேணுகிறது.
- source_word: תְבַהֲלֵם
  choice: அவர்களைத் திகிலடையச் செய்யும்
  rationale: பியேல் வடிவின் காரணவினைப் பொருளான அச்சுறுத்தி நிலைகுலையச் செய்தலை இயல்பான, வலிமையான தமிழில் தருகிறது.
theological_decisions:
- issue: சாபவேண்டல் கவிதையில் இறைவனின் நேரடி செயல்
  choice: இறைவன் பகைவர்களைத் துரத்தித் திகிலடையச் செய்ய வேண்டும் என்ற நேரடி வேண்டுதலைப் பேணுதல்
  alternative: அவர்களை உமது புயலால் துரத்துவீராக; உமது பெருங்காற்றால் திகிலடையச் செய்வீராக
  rationale: எபிரெய வினை வடிவங்கள் இவ்வேண்டுதல் சூழலில் விருப்பம் அல்லது வேண்டுகோள் சார்ந்த ஆணைநிலையைத் தருகின்றன. தமிழ் வியங்கோள் வடிவமான “செய்யும்” பிரார்த்தனைத் தொனியைப் பேணுகிறது; இதை வெறும் எதிர்கால முன்னறிவிப்பாகவோ, மென்மைப்படுத்தப்பட்ட கூற்றாகவோ மாற்றவில்லை.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். இறைவனை நோக்கிய கவிதை வேண்டுதலுக்கேற்ற “உமது” மற்றும் வியங்கோள் “செய்யும்” பயன்படுத்தப்பட்டுள்ளன. סער/סופה என்ற இணைச் சொற்களின் வேறுபாட்டை “புயல்/பெருங்காற்று” எனப் பேணியுள்ளது.
