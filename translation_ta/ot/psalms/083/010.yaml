  text: They were destroyed at En-dor[b][a]; they became dung for the ground.
translation:
  language: ta
  text: அவர்கள் ஏன்-தோரில்[a] அழிக்கப்பட்டார்கள்; நிலத்துக்கு எருவானார்கள்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஏன்-தோருக்கு அருகில்.” எபிரெய முன்னொட்டு இடத்தைக் குறிக்கிறது; சூழலுக்கு ஏற்ப “இல்” அல்லது “அருகில்” என மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்கள் நிலத்தின்மேல் சாணமாகக் கிடந்தார்கள்.” எபிரெய உரை சொல்லுக்குச் சொல், “அவர்கள் நிலத்துக்கு எருவானார்கள்” என்று கூறுகிறது; சடலங்கள் நிலத்திற்கான எருவைப் போலானதை இந்த உருவகம் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְדוּ
  choice: அழிக்கப்பட்டார்கள்
  rationale: שׁמד என்பதன் நிஃபால் இறந்தகால மூன்றாம் நபர் பன்மை வடிவம், அவர்கள் அழிக்கப்பட்ட நிலையைச் சுட்டுகிறது. தமிழில் இயல்பான செயப்பாட்டு வடிவம் மூலத்தின் பொருளையும் விளைவையும் காக்கிறது.
- source_word: בְּעֵין דֹּאר
  choice: என்-தோரில்
  rationale: עֵין דֹּאר என்பது இடப்பெயர்; முன்னொட்டு בְּ இங்கு இடப்பொருள் தருகிறது. “என்-தோரில்” என்பது நேரடியான தமிழாக்கம்; அருகில்/பக்கத்தில் என்ற சாத்தியத்தையும் அடிக்குறிப்பு குறிப்பிடுகிறது.
- source_word: הָיוּ
  choice: ஆனார்கள்
  rationale: היה இங்கு பயனிலைப் பெயர்ச்சொல்லுடன் வந்து ஒரு நிலைக்கு மாறியதைக் குறிக்கலாம். “ஆனார்கள்” அந்த விளைவு அல்லது நிலைமாற்றத்தை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דֹּמֶן
  choice: எரு
  rationale: דֹּמֶן என்பது சாணம் அல்லது எருவைக் குறிக்கிறது. நிலத்துடன் வரும் உருவகத்தில் “எரு” நேரடியும் இயல்புமான தேர்வு; அது எதிரிகளின் முழுமையான இழிவையும் அழிவையும் வெளிப்படுத்துகிறது.
- source_word: לָאֲדָמָה
  choice: நிலத்துக்கு
  rationale: אֲדָמָה என்பது நிலம் அல்லது மண்; לְ உறவு அல்லது விளைவைக் குறிக்கிறது. “நிலத்துக்கு” என்பது மூலத்திலுள்ள ‘நிலத்துக்கு எரு’ என்ற உருவகத்தைச் சீராக்காமல் காக்கிறது.
