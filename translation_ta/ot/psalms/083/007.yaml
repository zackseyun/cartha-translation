translation_notes:
  register: நவீனத் தரத் தமிழில், பட்டியலின் சுருக்கமான கவிதை நடையைப் பேணும் கண்ணியமான மொழிநடை. வழங்கப்பட்ட ஆலோசனை அடுக்கில் அடிக்குறிப்புகளின் குறிப்பான்கள் இடமாறியிருந்ததால், பெலிஸ்தியா குறித்த மாற்று வாசகம் [a] எனச் சரியான சொல்லில் குறிக்கப்பட்டது. கேபால் குறித்த பண்பாட்டுக் குறிப்பு [b] உரையில் குறியிடப்பட வேண்டும் என்பதற்காக ‘கேபால்[b]’ என அமைக்க வேண்டியது அவசியம்.
