  text: Do to them as to Midian[a], as to Sisera, as to Jabin, at the Kishon Brook[b],
translation:
  language: ta
  text: மீதியானுக்குச் செய்ததுபோலவும், சிசெராவுக்கும் யாபீனுக்கும் கீசோன் ஆற்றருகே செய்ததுபோலவும், அவர்களுக்குச் செய்யும்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “அவர்களுக்குச் செய்யும்; மீதியானைப் போலவும், சிசெராவைப் போலவும், யாபீனைப் போலவும், கீசோன் ஆற்றருகே.” ஒப்பீட்டுத் தொடர்களில் மறைமுகமாக உள்ள செயலை இயல்பான தமிழுக்காக முதன்மை உரையில் “செய்ததுபோல” என்று வெளிப்படுத்தப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לָהֶם
  choice: அவர்களுக்கும் செய்யும்
  rationale: עשה என்ற வினையின் ஆண்பால் ஒருமை கட்டளை வடிவம் கடவுளை நோக்கிய நேரடி வேண்டுகோள். לָהֶם என்பதன் இயல்பான ‘அவர்களுக்கு’ என்ற பொருளைத் தமிழில் இணைப்புச் சூழலுக்கேற்ப ‘அவர்களுக்கும்’ என வழங்குகிறது; பகைமைச் செயல் என்பதைத் தனியே சேர்க்காமல் ஒப்பீடே உணர்த்துகிறது.
- source_word: כְּמִדְיָן
  choice: மீதியானுக்குச் செய்ததுபோல
  rationale: כְּ என்ற ஒப்பீட்டு முன்னொட்டு கடந்தகாலத் தண்டனையை மாதிரியாகக் காட்டுகிறது. எபிரெயில் மறைந்துள்ள வினைத் தொடர்பை இயல்பான தமிழுக்காக ‘செய்ததுபோல’ என வெளிப்படுத்தியுள்ளோம்.
- source_word: כְּסִיסְרָא כְיָבִין
  choice: சிசெராவுக்கும் யாபீனுக்கும் செய்ததுபோல
  rationale: இணையான இரண்டு ஒப்பீடுகளையும் இயல்பான தமிழில் ஒன்றிணைக்கிறது; சிசெரா, யாபீன் ஆகிய ஆள்பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன.
- source_word: בְּנַחַל קִישׁוֹן
  choice: கீசோன் ஆற்றருகே
  rationale: נחל என்பது ஓடை, பருவகால நீரோடை அல்லது ஆறு எனக் குறிக்கலாம். இங்கு பெயர்பெற்ற நீர்வழியைச் சுட்டுவதால் ‘ஆறு’ வாசிப்புக்கு இயல்பானது; בְּ-இன் இடப்பொருள் ‘அருகே’ என வழங்கப்பட்டுள்ளது.
