lexical_decisions:
- source_word: כְּ/אֵשׁ
  choice: நெருப்பு ... எரிப்பதுபோலவும்
  rationale: ஒப்புமையைக் குறிக்கும் כ முன்னொட்டை இயல்பான தமிழ்க் கவிதை நடையில் ‘போல’ என வழங்குகிறது.
- source_word: תִּבְעַר
  choice: எரிப்பது
  rationale: Qal வடிவிலுள்ள בער, காட்டின் மீது நெருப்பு செய்யும் செயலை நேரடியாகக் குறிக்கிறது; ‘எரிப்பது’ தெளிவான இயல்பான இணைச்சொல்.
- source_word: יָעַר
  choice: ஒரு காடு
  rationale: יער என்பது காடு அல்லது வனப்பகுதி; பொதுவான ஒப்புமையில் தமிழில் ‘ஒரு காடு’ இயல்பாக உள்ளது.
- source_word: וּכְ/לֶהָבָה
  choice: தீச்சுடர் ... போலவும்
  rationale: לֶהָבָה என்பதன் ‘சுடர்/தீச்சுடர்’ பொருளையும், இணைப்புச் சொல் மற்றும் இரண்டாம் ஒப்புமையையும் காக்கிறது.
- source_word: תְּלַהֵט
  choice: கொழுந்துவிட்டு எரியச் செய்வது
  rationale: להט என்பதன் Piel வடிவிலுள்ள தீவிரமான எரிதல் நுணுக்கத்தை ‘கொழுந்துவிட்டு எரியச் செய்வது’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: הָרִים
  choice: மலைகளை
  rationale: הָרִים என்பது குறிப்பிட்ட பன்மை வடிவில் ‘மலைகள்’; தமிழில் வேற்றுமை உருபுடன் ‘மலைகளை’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
