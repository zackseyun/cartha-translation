source:
  edition: WLC
  text: מַלֵּ֣א פְנֵי/הֶ֣ם קָל֑וֹן וִֽ/יבַקְשׁ֖וּ שִׁמְ/ךָ֣ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/016.yaml
  text: Fill their faces with shame[a], that they may seek your name, O Yahweh.
translation:
  language: ta
  text: யாவே, அவர்களுடைய முகங்களை அவமானத்தால் நிரப்பும்; அவர்கள் உமது பெயரைத் தேடும்படியாக.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவர்கள் உமது பெயரைத் தேடுவார்களாக.” எபிரேய வினைச்சொல் எளிய தொடர்ச்சியாகவும் கொள்ளப்படலாம்; இங்கு அது நோக்கம் அல்லது விளைவைக் குறிக்கக்கூடும்.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: நிரப்பும்
  rationale: מלא என்பதன் பியேல் கட்டளை வடிவம்; தேவனை நோக்கிய ஒருமை ஆண்பால் கட்டளை. ‘முகங்களை அவமானத்தால் நிரப்பும்’ என்பது எபிரேய உருவகத்தை நேரடியாகவும் தமிழில் புரியத்தக்கவாறும் காக்கிறது.
- source_word: פְנֵיהֶם
  choice: அவர்களுடைய முகங்களை
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் வரும் பன்மை வடிவம். வெளிப்படையான இழிவைச் சுட்டும் எபிரேயப் படிமத்தை ‘முகங்கள்’ காக்கிறது.
- source_word: קָלוֹן
  choice: அவமானம்
  rationale: קָלוֹן என்பது அவமானம், இழிவு, மதிப்புக்கேடு ஆகிய பொருள்களைக் கொண்டது. இங்கு ‘அவமானம்’ இயல்பாகவும் உட்புற வெட்கத்தையும் வெளிப்புற இழிவையும் அளவுக்கு மீறித் தீர்மானிக்காமலும் உள்ளது.
- source_word: וִיבַקְשׁוּ
  choice: அப்போது அவர்கள் … தேடுவார்களாக
  rationale: கட்டளையைத் தொடர்ந்து வாவுடன் வரும் மூன்றாம் நபர் பன்மை imperfect வடிவம் நோக்கம் அல்லது விளைவைக் குறிக்கக்கூடும்; அதேவேளை தொடர்ச்சி/வேண்டுதல் என்ற சாத்தியத்தையும் கொண்டுள்ளது. இந்தத் தமிழ் வடிவம் அந்த வேண்டுதல் நயத்தை இயல்பாகக் காக்கிறது; நோக்க வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שִׁמְךָ
  choice: உமது பெயரை
  rationale: ‘உமது பெயர்’ என்பது தேவனுடைய வெளிப்படுத்தப்பட்ட அடையாளம், புகழ், ஆளுமை ஆகிய வேதாகமச் செறிவை விளக்கிச் சுருக்காமல் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துத் தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பொதுவாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
theological_decisions:
- issue: தெய்வீகத் தீர்ப்பின் நோக்கம் அல்லது விளைவு
  choice: அவமானப்படுத்தும் வேண்டுதலைத் தொடர்ந்து, பகைவர்கள் யாவேயின் பெயரைத் தேட வேண்டும் என்ற வேண்டுதலாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர்கள் உமது பெயரைத் தேடும்படியாக’ என்று வெளிப்படையான நோக்கக் கூறாக மொழிபெயர்க்கலாம்.
  rationale: கட்டளைக்குப் பின் வாவுடன் வரும் imperfect நோக்கம்/விளைவைச் சுட்டலாம்; ஆனால் எளிய தொடர்ச்சி அல்லது மறைமுக வேண்டுதலும் இலக்கணரீதியாக சாத்தியம். ஆகவே முதன்மை உரை வேண்டுதல் நயத்தை காக்கிறது; நோக்க வாசிப்பை அடிக்குறிப்பு வெளிப்படுத்துகிறது. இதனால் தீர்ப்பு மனந்திரும்புதலுக்கோ அங்கீகாரத்துக்கோ வழிவகுக்கும் என்ற பதற்றம் உறுதியாகத் தீர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத வேண்டுதலுக்கேற்ற கண்ணியமான நடை. ‘உமது’, ‘நிரப்பும்’, ‘தேடுவார்களாக’ ஆகிய வடிவங்கள் உயர்நடையை அளித்தாலும் சாதாரண வாசகருக்குப் புரியத்தக்கவை. எபிரேய முகம்–அவமானம் உருவகம் பாதுகாக்கப்பட்டுள்ளது.
