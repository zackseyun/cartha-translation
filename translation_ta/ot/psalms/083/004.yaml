source:
  edition: WLC
  text: אָמְר֗וּ לְ֭כוּ וְ/נַכְחִידֵ֣/ם מִ/גּ֑וֹי וְ/לֹֽא יִזָּכֵ֖ר שֵֽׁם יִשְׂרָאֵ֣ל עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/004.yaml
  text: They say[a], “Come, let us wipe them out as a nation, so that the name of Israel will be remembered no more.”
translation:
  language: ta
  text: 'அவர்கள் சொல்கிறார்கள்: “வாருங்கள், அவர்கள் ஓர் இனமாக இல்லாதபடி அவர்களை அழித்தொழிப்போம்[a]; இஸ்ரயேலின் பெயர் இனி நினைவுகூரப்படாமல் போகட்டும்.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் ஓர் இனமாக இருப்பதிலிருந்து அவர்களை அழித்துவிடுவோம்.” இஸ்ரயேல் ஒரு தனித்த மக்களினமாக இனி நிலைத்திருக்கக் கூடாது என்பதே எபிரெயச் சொற்றொடரின் நோக்கம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְרוּ
  choice: அவர்கள் சொல்கிறார்கள்
  rationale: இது Qal முற்றுவினை என்றாலும், கவிதைச் சூழலில் எதிரிகளின் தொடரும் நோக்கத்தை உயிரோட்டமாகக் காட்ட நிகழ்காலம் இயல்பாக உள்ளது.
- source_word: לְכוּ
  choice: வாருங்கள்
  rationale: הלך என்பதன் பன்மை ஏவல்வினை இங்கு இடப்பெயர்ச்சியைக் குறிப்பதல்ல; கூட்டுச் செயலுக்கான தூண்டுதலாகப் பயன்படுகிறது.
- source_word: וְנַכְחִידֵם
  choice: அவர்களை அழித்தொழிப்போம்
  rationale: כחד என்பதன் Hiphil வடிவம் மறைந்துபோகச் செய்தல் அல்லது முற்றிலும் அழித்தல் என்ற வலுவான பொருளைத் தருகிறது; ‘அழித்தொழிப்போம்’ அதன் முழுமையான நோக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִגּוֹי
  choice: அவர்கள் ஓர் இனமாக இல்லாதபடி
  rationale: מן உடன் גוי இங்கு ஓர் இனமாக அல்லது மக்களாகத் தொடர்ந்து இருப்பதிலிருந்து நீக்குவதைச் சுட்டுகிறது; தனிநபர்களை மட்டும் அல்ல, அவர்களின் கூட்டு இன இருப்பையே முடிவுக்குக் கொண்டுவரும் நோக்கம் தெளிவாகிறது.
- source_word: וְלֹא יִזָּכֵר
  choice: இனி நினைவுகூரப்படாமல் போகட்டும்
  rationale: זכר என்பதன் Niphal வடிவத்திலுள்ள செயப்பாட்டு உணர்வை ‘நினைவுகூரப்படாமல்’ காக்கிறது; எதிரிகள் விரும்பும் விளைவையும் ‘போகட்டும்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: இஸ்ரயேலின் பெயர்
  rationale: எபிரெயக் கட்டமைப்பை நேர்த்தியாகப் பின்பற்றி, ‘பெயர்’ என்பதில் அடங்கிய அடையாளம் மற்றும் நினைவு ஆகிய கருத்துகளையும் காக்கிறது.
- source_word: עוֹד
  choice: இனி
  rationale: எதிர்மறைச் சூழலில் עוד என்பது ‘இனிமேல்’ அல்லது ‘இனி ஒருபோதும்’ என்ற தொடராமையைக் குறிக்கிறது; ‘இனி’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
