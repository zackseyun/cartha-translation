  source_fidelity: எபிரெய மூலத்தின் நேரடி வேண்டுகோள், இரு உவமைகள், மற்றும் காற்றால் சிதறடிக்கப்படும் படிமம் அனைத்தும் துல்லியமாகப் பேணப்பட்டுள்ளன. גַּלְגַּל சொல்லின் உறுதியற்ற/பலவகைச் சுட்டலை முதன்மை உரையில் கவித்துவமாகவும் அடிக்குறிப்பில் ‘சக்கரம்’ என்ற மாற்றுவழியுடனும் கையாளுவது ஏற்றது. קַשׁ என்பதற்கான ‘வைக்கோல் துரும்பு’ பொருள் மூலத்தின் வேளாண் படிமத்துடன் பொருந்துகிறது.
  naturalness: ‘என் கடவுளே’ மற்றும் ‘ஆக்குவீராக’ நவீனத் தரத் தமிழில் ஜெபத்திற்கேற்ற கண்ணியமான, இயல்பான நடையைத் தருகின்றன. ‘காற்றின் முன் பறக்கும் வைக்கோல் துரும்பு’ கவிதைநடையில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
  terminology: ‘கடவுளே’ என்பது אֱלֹהַי என்பதற்குப் பொருத்தமானது. ‘சுழன்றோடும் தூசி’ என்பது ஆங்கில POB-இன் தேர்வைப் பின்பற்றும் விளக்கமான கவித்துவ மொழிபெயர்ப்பு; அடிக்குறிப்பு எபிரெயச் சொல்லின் ‘சக்கரம்/உருளும் அல்லது சுழலும் ஒன்று’ என்ற மாற்றுப் பொருளைச் சரியாகப் பாதுகாக்கிறது. எந்தத் தத்துவச் சாய்வும் சேர்க்கப்படவில்லை.
