translation_notes:
  register: நவீனத் தரத் தமிழில், ஜெபத்திற்குரிய கண்ணியமான நேரடி அழைப்பும் கவிதைநடையும் பேணப்பட்டுள்ளன. ‘ஆக்குவீராக’ என்பது வேண்டுதலின் வலிமையைத் தருகிறது. எபிரெயச் சொல்லின் உண்மையான இருபொருள் தன்மையை முதன்மை உரை மற்றும் அடிக்குறிப்பு இணைந்து பாதுகாக்கின்றன.
