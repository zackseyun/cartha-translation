source:
  edition: WLC
  text: אֱֽלֹהַ֗/י שִׁיתֵ֥/מוֹ כַ/גַּלְגַּ֑ל כְּ֝/קַ֗שׁ לִ/פְנֵי רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/013.yaml
  text: My God[a], make them like whirling dust[b], like chaff before the wind.
translation:
  language: ta
  text: என் கடவுளே, அவர்களைச் சுழன்றோடும் தூசிபோலவும்[a], காற்றின் முன் பறக்கும் வைக்கோல் துரும்புபோலவும்[b] ஆக்குவீராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயச் சொல்லை ‘சக்கரம்போல’ என்றும் மொழிபெயர்க்கலாம்; גַּלְגַּל என்பது உருளும் அல்லது சுழலும் ஒன்றைக் குறிக்கக்கூடும். காற்றின் முன் பறக்கும் வைக்கோல் துரும்பு என்ற அடுத்த உருவகத்துடன் பொருந்துவதால் முதன்மை உரை ‘சுழன்றோடும் தூசி’ என்று தருகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய קַשׁ என்பது இன்னும் சொல்லளவில் ‘வைக்கோல்’ அல்லது ‘அறுவடைக்குப் பின் எஞ்சும் உலர்ந்த தாள்’ என்பதைக் குறிக்கிறது; காற்றால் அடித்துச் செல்லப்படும் இலேசான வேளாண் கழிவின் படிமத்தை இங்கு தருகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: என் கடவுளே
  rationale: முதலாம் நபர் ஒருமை உடைமை விகுதியையும் நேரடி அழைப்பையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׁיתֵמוֹ
  choice: அவர்களை … ஆக்குவீராக
  rationale: இங்கு வேண்டுதலாக வரும் கட்டளை வடிவத்தையும், தொடர்ந்து வரும் இரு உவமைகளுடன் இயல்பாக இணையும் காரணவினைப் பொருளையும் தருகிறது.
- source_word: כַגַּלְגַּל
  choice: சுழன்றோடும் தூசிபோலவும்
  rationale: גַּלְגַּל என்பது சக்கரத்தையோ உருண்டு அல்லது சுழன்று செல்லும் ஒன்றையோ குறிக்கலாம். காற்றால் அடித்துச் செல்லப்படும் வைக்கோல் துரும்பு என்ற இணை உருவகத்துக்கு ஏற்றவாறு, முதன்மை உரை சுழன்று செல்லும் இலேசான பொருள் என்ற கவித்துவப் படிமத்தைத் தெளிவாக்குகிறது; நேரடியான மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: כְּקַשׁ
  choice: வைக்கோல் துரும்புபோலவும்
  rationale: קַשׁ என்பதன் அடிப்படை வேளாண் படிமமான வைக்கோல் அல்லது அறுவடைக்குப் பின் எஞ்சும் உலர்ந்த தாளைத் தக்கவைக்கிறது; தமிழில் காற்றால் எளிதில் அடித்துச் செல்லப்படும் சிறு உலர்ந்த துண்டை இயல்பாகக் காட்டுகிறது.
- source_word: לִפְנֵי רוּחַ
  choice: காற்றின் முன் பறக்கும்
  rationale: சொல்லளவில் 'காற்றின் முன்' என்ற அமைப்பைப் பேணியபடி, அந்த எபிரெய மொழியமைப்பு குறிக்கும் காற்றால் அடித்துச் செல்லப்படுதலை தமிழில் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
