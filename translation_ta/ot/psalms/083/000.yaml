  - marker: a
    text: அல்லது, ‘ஆசாப்புக்கான சங்கீதம்.’ எபிரெய மொழியின் முன்னொட்டு, சங்கீதத் தலைப்புகளில் ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கலாம்.
