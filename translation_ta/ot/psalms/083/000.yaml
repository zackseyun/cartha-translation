lexical_decisions:
- source_word: שִׁיר
  choice: பாடல்
  rationale: பாடப்படுவதற்குரிய படைப்பைக் குறிக்கும் எபிரெயப் பெயர்ச்சொல்லுக்கு இயல்பான, நேரடியான நவீனத் தமிழ் இணை.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: சங்கீத நூலின் தலைப்புகளில் வரும் இசைசார் இலக்கிய வகையைக் குறிக்கும் மரபானதும் பொதுவாகப் புரிந்துகொள்ளப்படுவதுமான தமிழ் சொல்.
- source_word: לְאָסָף
  choice: ஆசாப்பின்
  rationale: לְ முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கலாம். ‘ஆசாப்பின்’ என்பது தலைப்பில் இயல்பாக இருந்து, அந்த உறவை அளவுக்கு மீறி வரையறுக்காமல் விடுகிறது.
