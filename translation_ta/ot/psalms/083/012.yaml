id: PSA.83.12
reference: Psalms 83:12
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אֲשֶׁ֣ר אָ֭מְרוּ נִ֣ירֲשָׁה לָּ֑/נוּ אֵ֝֗ת נְא֣וֹת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/012.yaml
  text: who said[a], “Let us take possession for ourselves of the pastures of God.”
translation:
  language: ta
  text: “தேவனுடைய மேய்ச்சல் நிலங்களை[a] நமக்குச் சொந்தமாக்கிக்கொள்வோம்” என்று சொன்னவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது “தேவனுடைய உறைவிடங்களை” அல்லது “தேவனுடைய வாழிடங்களை.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: என்று சொன்னவர்கள்
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட பகைவர்களைத் தொடர்புபடுத்தும் உறவுப்பெயரின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אָמְרוּ
  choice: சொன்னவர்கள்
  rationale: Qal perfect, மூன்றாம் நபர் பன்மை; கவிதைச் சூழலுக்கு ஏற்ற இறந்தகால உரை.
- source_word: נִירֲשָׁה
  choice: சொந்தமாக்கிக்கொள்வோம்
  rationale: ירשׁ என்பதன் ‘உடைமையாக்குதல்/கைப்பற்றுதல்’ என்ற பொருளை பகைமைச் சூழலில் தெரிவிக்கிறது; ‘சுதந்தரித்துக்கொள்வோம்’ என்பது இங்கு தேவையற்ற அளவு அமைதியான அல்லது உரிமைமிக்க நுணுக்கத்தைத் தரலாம்.
- source_word: לָּנוּ
  choice: நமக்குச்
  rationale: முதல் நபர் பன்மைச் சார்புப்பெயருடன் வரும் ל, அவர்களுக்கான உடைமை அல்லது பயனைச் சுட்டுகிறது; ‘நமக்குச் சொந்தமாக’ என்பது தமிழில் இயல்பாக அதைக் காட்டுகிறது.
- source_word: אֵת
  choice: —
  rationale: இது நேரடிச் செயப்படுபொருள் குறியீடு; தமிழில் தனிச் சொல்லாக மொழிபெயர்க்கப்படாமல், ‘மேய்ச்சல் நிலங்களை’ என்ற வேற்றுமை வடிவில் அதன் இலக்கணப் பணி வெளிப்படுகிறது.
- source_word: נְאוֹת
  choice: மேய்ச்சல் நிலங்கள்
  rationale: இந்தச் சொல் மேய்ச்சல் நிலங்களையும் உறைவிடங்களையும் குறிக்கக்கூடும். முதன்மை உரை எபிரெயக் காட்சிப்படிமத்தைத் தக்கவைக்கிறது; பிற பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: சங்கீதத்தின் சூழலில் இது இஸ்ரவேலின் தேவனைக் குறிக்கிறது; ஆகவே ஒருமை பொருள் ஏற்றது.
theological_decisions:
- issue: נְאוֹת אֱלֹהִים என்பதன் பொருள்
  choice: தேவனுடைய மேய்ச்சல் நிலங்கள்
  alternative: தேவனுடைய உறைவிடங்கள் அல்லது வாழிடங்கள்
  rationale: இந்தத் தொடர் தேவனுக்குரிய நிலப்பரப்பை மேய்ச்சல் நிலங்கள் என்ற உருவகத்துடன் குறிக்கலாம்; அதேவேளை உறைவிடங்கள் என்ற பொருளும் சாத்தியம். முதன்மை உரை concrete Hebrew image-ஐத் தக்கவைத்து, பொருளின் தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்துடனும் பொதுவாசகர்களுக்குப் புரியும் இயல்புடனும் அமைக்கப்பட்டது. மேற்கோளின் தன்னலமான கைப்பற்றும் நோக்கம் ‘நமக்குச் சொந்தமாக்கிக்கொள்வோம்’ என்பதால் தெளிவாகிறது.
