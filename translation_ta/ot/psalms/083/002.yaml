  yaml_path: translation/ot/psalms/083/002.yaml
  text: For look, your enemies are in an uproar, and those who hate you have lifted up their heads.
translation:
  language: ta
  text: ஏனெனில், இதோ, உமது பகைவர்கள் ஆரவாரம் செய்கிறார்கள்; உம்மை வெறுப்பவர்கள் தலையை உயர்த்தியிருக்கிறார்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: ஏனெனில், இதோ
  rationale: כִּי முந்தைய வேண்டுதலுக்கான காரணத்தைச் சுட்டுகிறது; הִנֵּה கவனத்தை ஈர்க்கும் ‘இதோ’ என நேரடியாகவும் இயல்பாகவும் தரப்பட்டது.
- source_word: יֶהֱמָיוּן
  choice: ஆரவாரம் செய்கிறார்கள்
  rationale: இந்த வினை உரத்த இரைச்சல், கொந்தளிப்பு அல்லது கலகக் கூச்சலைக் குறிக்கலாம்; சூழலுக்கேற்றவாறு பகைவர்களின் அச்சுறுத்தும் கூட்டு இரைச்சலை வெளிப்படுத்துகிறது.
- source_word: נָשְׂאוּ רֹאשׁ
  choice: தலையை உயர்த்தியிருக்கிறார்கள்
  rationale: எபிரேய உருவகத்தைப் பாதுகாக்கிறது; இது துணிவுடன் அல்லது எதிர்ப்புடன் எழுவதை உணர்த்தினாலும், அந்த விளக்கத்தை உரையிலேயே கட்டாயப்படுத்தவில்லை.
theological_decisions:
- issue: ‘உம்மை வெறுப்பவர்கள்’ என்பதன் குறிப்பு
  choice: தெய்வத்தை நேரடியாக நோக்கும் இரண்டாம் நபர் வடிவம் பாதுகாக்கப்பட்டது
  alternative: ‘இறைவனை வெறுப்பவர்கள்’ என்று விளக்கமாக மாற்றுதல்
  rationale: மூலத்தில் இரண்டாம் நபர் சொந்தவிகுதி உள்ளது; சங்கீதத்தின் நேரடி வேண்டுதல் தன்மையை மாற்றாமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீன தரநிலைத் தமிழில், இறைவனை நோக்கும் dignified மரியாதைப் பன்மை வடிவமான ‘உமது/உம்மை’ பயன்படுத்தப்பட்டது. எபிரேயச் சொற்றொடரின் கவித்துவ உருவகமும் காரண-கவன ஈர்ப்பு அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
