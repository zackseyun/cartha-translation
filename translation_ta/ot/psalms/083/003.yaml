  text: עַֽל עַ֭מְּ/ךָ יַעֲרִ֣ימוּ ס֑וֹד וְ֝/יִתְיָעֲצ֗וּ עַל צְפוּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/003.yaml
  text: They make crafty plans against your people[a], and they consult together against your treasured ones.
translation:
  language: ta
  text: 'உமது மக்களுக்கு எதிராகத் தந்திரமான திட்டங்களைத் தீட்டுகிறார்கள்;

    உம்மால் மறைத்து வைக்கப்பட்டவர்களுக்கு[a] எதிராக ஒன்றுகூடி ஆலோசிக்கிறார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: வேறு வகையில், “உமக்கு அருமையானவர்கள்” அல்லது “நீர் பாதுகாத்து வருபவர்கள்.” எபிரெயச் சொல் மறைத்து வைக்கப்பட்டவர்களையும், பாதுகாப்பாகக் காக்கப்படுபவர்களையும், நீட்டிப்பாகப் பொக்கிஷம்போல் மதிக்கப்படுபவர்களையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרִימוּ סוֹד
  choice: தந்திரமான திட்டங்களைத் தீட்டுகிறார்கள்
  rationale: יַעֲרִימוּ என்பது சூழ்ச்சியோடும் தந்திரமாகவும் செயல்படுவதைக் குறிக்கிறது; סוֹד இங்கு இரகசிய ஆலோசனை அல்லது திட்டத்தைக் குறிக்கிறது. இவ்விரண்டையும் இயல்பான தமிழில் பகைமையான சூழ்ச்சித் திட்டமிடலாக வெளிப்படுத்துகிறது.
- source_word: וְיִתְיָעֲצוּ
  choice: ஒன்றுகூடி ஆலோசிக்கிறார்கள்
  rationale: Hitpael வடிவம் பரஸ்பரமாக ஆலோசிப்பதைக் காட்டுகிறது. ‘சதி செய்கிறார்கள்’ என்பதைவிட இது மூலத்தின் சொல்லாட்சியை மிகைப்படுத்தாமல் காக்கிறது.
- source_word: צְפוּנֶיךָ
  choice: நீர் மறைத்து வைத்திருப்பவர்கள்
  rationale: צפן என்பதன் அடிப்படைப் பொருளான மறைத்து வைத்தல் அல்லது பாதுகாப்பாகச் சேமித்தல் என்பதைக் காக்கிறது; அவர்கள் தேவனுக்கு அருமையானவர்கள் அல்லது அவரால் பாதுகாக்கப்படுகிறவர்கள் என்ற சாத்தியமான உட்பொருளை அடிக்குறிப்பு விளக்குகிறது.
- source_word: עַל עַמְּךָ
  choice: உமது மக்களுக்கு எதிராக
  rationale: பகைமை நிறைந்த இச்சூழலில் עַל எதிர்ப்பைச் சுட்டுவதால் ‘எதிராக’ என்பது பொருத்தமானது.
theological_decisions:
- issue: צְפוּנֶיךָ என்பது தேவனுடைய மக்களை எவ்வாறு வருணிக்கிறது
  choice: நீர் மறைத்து வைத்திருப்பவர்கள்
  alternative: உமக்கு அருமையானவர்கள்; நீர் பாதுகாப்பவர்கள்
  rationale: எபிரெயச் சொல் மறைத்தல், பாதுகாப்பாக வைத்தல், பொக்கிஷமாகச் சேமித்தல் ஆகிய தொடர்புடைய கருத்துகளைத் தாங்குகிறது. முதன்மை உரை அதன் நேரடியான படிமத்தை வைத்துக்கொண்டு, அருமை மற்றும் பாதுகாப்பு ஆகிய உட்பொருள்களை அடிக்குறிப்பில் திறந்தவையாக வைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. கவிதை இணைப்பைத் தெளிவாகக் காட்ட இரண்டு அடிகளாக அமைக்கப்பட்டுள்ளது; ‘உமது/நீர்’ என்ற இறைமரியாதை நடை ஒருமையாகப் பேணப்பட்டுள்ளது.
