source:
  edition: WLC
  text: שִׁיתֵ֣/מוֹ נְ֭דִיבֵ/מוֹ כְּ/עֹרֵ֣ב וְ/כִ/זְאֵ֑ב וּֽ/כְ/זֶ֥בַח וּ֝/כְ/צַלְמֻנָּ֗ע כָּל נְסִיכֵֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/011.yaml
  text: Make their nobles like Oreb and Zeeb[a], and all their princes like Zebah and Zalmunna.
translation:
  language: ta
  text: 'அவர்களுடைய பிரபுக்களை ஓரேபையும் சேபையும் போலவும்,

    அவர்களுடைய எல்லா தலைவர்களையும் சேபாவையும் சல்முன்னாவையும் போலவும் ஆக்குவீராக.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתֵמוֹ
  choice: ஆக்குவீராக
  rationale: இது கடவுளை நோக்கிய வேண்டுதல் வடிவிலான கட்டளை. தொடர்ந்து வரும் ஒப்புமைகளுடன், ‘அவர்களை ... போல ஆக்குவீராக’ என்ற பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נְדִיבֵמוֹ
  choice: அவர்களுடைய மேன்மக்களை
  rationale: נָדִיב இங்கு சமூக அல்லது அரசியல் முக்கியத்துவமுள்ள உயர்நிலைத் தலைவர்களைக் குறிக்கிறது; இணைவரியில் வரும் נְסִיכֵמוֹ என்பதிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: כְּעֹרֵב וְכִזְאֵב
  choice: ஓரேபையும் சேபையும் போல
  rationale: நியாயாதிபதிகள் 7:25-இல் வரும் மீதியானியத் தலைவர்களின் பெயர்கள் தமிழில் ஒலிபெயர்க்கப்பட்டுள்ளன; ஒரே ‘போல’ இரு பெயர்களுக்கும் பொருந்துமாறு இயல்பான தமிழ் அமைப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּכְזֶבַח וּכְצַלְמֻנָּע
  choice: சேபாவையும் சல்முன்னாவையும் போல
  rationale: நியாயாதிபதிகள் 8-இல் வரும் மீதியானிய அரசர்களின் பெயர்கள் ஒலிபெயர்க்கப்பட்டுள்ளன; எபிரெய ஒப்புமை இரு பெயர்களுக்கும் தெளிவாகப் பொருந்துகிறது.
- source_word: כָּל
  choice: எல்லா
  rationale: எதிரிகளின் ஆட்சியாளர்கள் அனைவரையும் உள்ளடக்கும் மூலத்தின் முழுமைப் பொருளை வெளிப்படையாகக் காக்கிறது.
- source_word: נְסִיכֵמוֹ
  choice: அவர்களுடைய ... ஆட்சியாளர்களையும்
  rationale: נָסִיךְ என்பது அரசர்கள் என்று கட்டுப்படுத்தாமல் இளவரசர்கள், தலைவர்கள் அல்லது நியமிக்கப்பட்ட ஆட்சியாளர்களைக் குறிக்கலாம்; ‘ஆட்சியாளர்கள்’ இங்கு பொருள்வீச்சை இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: சாப வேண்டுதலில் உள்ள வரலாற்றுக் குறிப்பு
  choice: தற்போதைய எதிரிகள்மீது தீர்ப்பு வருவதற்கான முன்மாதிரியாக, மீதியானியத் தலைவர்கள் முன்பு அடைந்த தோல்வியை வசனம் எடுத்துரைக்கிறது.
  alternative: இந்தப் பெயர்களை தோற்கடிக்கப்பட்ட எதிரிகளுக்கான பொதுவான உதாரணங்களாக மட்டும் புரிந்துகொள்ளலாம்.
  rationale: ஓரேப், சேப், சேபா, சல்முன்னா ஆகியோர் நியாயாதிபதிகள் 7–8-இல் வரும் குறிப்பிட்ட வரலாற்று எதிரிகள். பெயர்களை அப்படியே வைத்திருப்பது, கூடுதல் விளக்கத்தை முதன்மை உரைக்குள் சேர்க்காமல், முந்தைய விடுதலைச் செயலுக்கு சங்கீதம் செய்யும் முறையீட்டைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கடவுளை நோக்கிய வேண்டுதலுக்கேற்ற கண்ணியமான ‘ஆக்குவீராக’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. இரு இணைவரிகளின் கவிதைச் சமநிலையும் பெயர்ப் பட்டியலின் வரலாற்றுத் தன்மையும் காக்கப்பட்டுள்ளன.
