lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: נוֹעֲצוּ
  choice: சதித்திட்டம் தீட்டியிருக்கிறார்கள்
  rationale: நிஃபால் வடிவம் பரஸ்பரம் ஆலோசித்துத் திட்டமிடுவதைக் குறிக்கிறது; பகைமை நிறைந்த சூழல் காரணமாக ‘சதித்திட்டம்’ பொருத்தமானது, அதேவேளை ‘ஆலோசித்திருக்கிறார்கள்’ என்ற நேரடியான வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: לֵב יַחְדָּו
  choice: ஒரே மனதுடன் சேர்ந்து
  rationale: ‘இதயம்’ என்பது நோக்கம் மற்றும் மனவுறுதியைக் குறிக்கும் எபிரெய உருவகம்; தமிழில் ‘ஒரே மனதுடன்’ அதன் ஒன்றுபட்ட நோக்கத்தை இயல்பாகத் தெரிவிக்கிறது. ‘சேர்ந்து’ יַחְדָּו என்பதன் கூட்டுச் செயலை வெளிப்படுத்துகிறது.
- source_word: עָלֶיךָ
  choice: உமக்கு எதிராக
  rationale: பகைமையான ஆலோசனையும் உடன்படிக்கையும் இடம்பெறும் சூழலில் עַל எதிர்ப்புப் பொருளைக் கொண்டுள்ளது; இறைவனை நேரடியாக அழைக்கும் மரியாதை ஒருமையை ‘உமக்கு’ காக்கிறது.
- source_word: בְּרִית
  choice: உடன்படிக்கை
  rationale: கட்டுப்படுத்தும் முறையான ஒப்பந்தம் என்ற சொல்லின் நிறையைப் பாதுகாக்கும் நிலையான, தெளிவான தமிழ்ச் சொல்.
- source_word: יִכְרֹתוּ
  choice: செய்கிறார்கள்
  rationale: כרת ברית என்பதன் சொற்படியான வடிவம் ‘உடன்படிக்கையை வெட்டுதல்’; அதன் பொருளை நவீன தமிழில் இயல்பாக ‘உடன்படிக்கை செய்கிறார்கள்’ என வழங்குகிறது.
theological_decisions:
- issue: இறைவனுக்கு எதிரான பகைமை உடன்படிக்கையின் மொழியாக்கம்
  choice: உமக்கு எதிராக உடன்படிக்கை செய்கிறார்கள்
  alternative: உமக்கு எதிராகக் கூட்டணி அமைக்கிறார்கள்
  rationale: ‘உடன்படிக்கை’ என்பது בְּרִית என்பதன் முறையான, பிணைக்கும் தன்மையைத் தக்கவைக்கிறது; ‘எதிராக’ என்பது சூழலில் உள்ள வெளிப்படையான இறைஎதிர்ப்பை மெலிதாக்காமல் காட்டுகிறது.
- issue: נוֹעֲצוּ என்பதில் ஆலோசனையா அல்லது சதியா
  choice: சதித்திட்டம் தீட்டியிருக்கிறார்கள்
  alternative: ஆலோசித்திருக்கிறார்கள்
  rationale: வினைச்சொல் தன்னளவில் ஒன்றுகூடி ஆலோசிப்பதைக் குறிக்கலாம்; ஆனால் சங்கீதத்தின் பகைமைச் சூழலும் அடுத்துள்ள உடன்படிக்கையும் சதித் திட்டமிடுதலை ஆதரிக்கின்றன. நேரடியான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைக்குரிய கண்ணியத்துடன் வடிவமைக்கப்பட்டது. இறைவனை நோக்கிய ஒருமை இரண்டாம் நபருக்கு மரியாதை வடிவமான ‘உமக்கு’ பயன்படுத்தப்பட்டுள்ளது; பகைமைச் சூழலைத் தெளிவாக்கினாலும் மூல வினையின் பரந்த பொருள் அடிக்குறிப்பில் காக்கப்பட்டுள்ளது.
