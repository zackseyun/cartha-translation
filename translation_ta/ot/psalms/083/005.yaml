- from: ஏனெனில், அவர்கள் ஒரே மனதுடன் சேர்ந்து சதித்திட்டம் தீட்டியிருக்கிறார்கள்[b]; உமக்கு எதிராக உடன்படிக்கை செய்கிறார்கள்[a].
