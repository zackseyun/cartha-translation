  text: the tents of Edom and the Ishmaelites[a], Moab and the Hagrites.
translation:
  language: ta
  text: 'ஏதோமின் கூடாரங்களும் இஸ்மவேலியர்களும்,

    மோவாபும் ஆகிரியர்களும்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகாரியர்கள்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלֵי
  choice: கூடாரங்கள்
  rationale: אֹהֶל என்பதன் பன்மை இணைப்புநிலை; மக்களையோ குலங்களையோ மறைமுகமாகக் குறிக்கக்கூடும் என்றாலும், எபிரெயக் கவிதையின் தெளிவான ‘கூடாரங்கள்’ என்ற உருவகத்தைப் பாதுகாக்கிறது.
- source_word: אֱדוֹם
  choice: ஏதோம்
  rationale: நாடு அல்லது நிலப்பகுதியின் இயற்பெயர்; ‘ஏதோமின் கூடாரங்கள்’ என்று இணைப்புநிலையை இயல்பான தமிழில் தருகிறது.
- source_word: יִשְׁמְעֵאלִים
  choice: இஸ்மவேலியர்கள்
  rationale: இஸ்மவேலிலிருந்து பெறப்பட்ட பன்மை இனக்குழுப் பெயர்; தமிழில் வழக்கமான மக்களினப் பெயராக மொழிபெயர்க்கப்பட்டது.
- source_word: מוֹאָב
  choice: மோவாப்
  rationale: எபிரெயத்தில் உள்ள நாடு அல்லது நிலப்பகுதியின் இயற்பெயரை, இனப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- source_word: הַגְרִים
  choice: ஆகிரியர்கள்
  rationale: הַגְרִים என்ற மக்களினப் பெயரின் எபிரெய மெய்யெழுத்து வடிவத்திற்கு நெருக்கமான பெயர்ப்பு; ஆகாருடன் தொடர்புபடுத்தும் மாற்றுப் பெயர்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
