  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וַ/תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֥וֹד אוֹדֶ֗/נּוּ יְשׁוּע֥וֹת פָּנָֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
translation:
  language: ta
  text: என் உள்ளமே, நீ ஏன் தாழ்ந்திருக்கிறாய்? எனக்குள் ஏன் கலங்குகிறாய்? தேவனை நம்பிக்கையோடு எதிர்நோக்கு; ஏனெனில், அவரது திருமுகம் தரும் மீட்புகளுக்காக நான் இன்னும் அவரைப் போற்றுவேன்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: தாழ்ந்து சோர்ந்திருக்கிறாய்
  rationale: வினைச்சொல்லின் ‘குனிந்து தாழ்ந்திருத்தல்’ என்ற உருவகத்தையும், புலம்பல் சூழலில் உள்ள மனச்சோர்வையும் இயல்பான நவீனத் தமிழில் இணைத்துக் காட்டுகிறது.
- source_word: נַפְשִׁי
  choice: என் உள்ளமே
  rationale: இங்கு பாடகர் தன்னுடைய அகநிலையோடு பேசுகிறார். ‘என் ஆத்துமாவே’ என்பதைவிட ‘என் உள்ளமே’ சாதாரண வாசகருக்கு இயல்பாகவும், கவித்துவமான தன்னுரையாடலைத் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: וַתֶּהֱמִי
  choice: கலங்குகிறாய்
  rationale: முழக்கம், கொந்தளிப்பு, அமைதியின்மை ஆகியவற்றைக் குறிக்கக்கூடிய சொல்லை, இங்கு அகக் கொந்தளிப்பைக் காட்டும் இயல்பான தமிழ்ச் சொல்லால் மொழிபெயர்க்கிறது.
- source_word: עָלַי
  choice: எனக்குள்
  rationale: சொல்லுக்கு நேரடியாக ‘என்மேல்’ என்று பொருள் வரலாம்; ஆனால் தன் உள்ளத்தோடு பேசும் இச்சூழலில், பேச்சாளரை ஆட்கொண்டுள்ள உள்ளக் கலக்கத்தைக் குறிக்க ‘எனக்குள்’ என்பது தெளிவான இணைமொழிபெயர்ப்பு.
- source_word: הוֹחִילִי
  choice: நம்பிக்கையோடு எதிர்நோக்கு
  rationale: இறைவனை நம்புவதோடு, அவர் செயல்படுவதற்காக எதிர்பார்த்துக் காத்திருக்கும் கருத்தையும் கட்டளை வடிவில் வெளிப்படுத்துகிறது.
- source_word: לֵאלֹהִים
  choice: தேவனை
  rationale: எதிர்நோக்குதலின் இலக்காக தேவனைக் காட்டும் இயல்பான தமிழ் வேற்றுமை அமைப்பு.
- source_word: עוֹד אוֹדֶנּוּ
  choice: நான் இன்னும் அவரைப் போற்றுவேன்
  rationale: தற்போதைய துயரத்தையும் மீறி, எதிர்காலத்தில் மீண்டும் அல்லது தொடர்ந்து தேவனைப் புகழ்வேன் என்ற உறுதியைக் காக்கிறது.
- source_word: יְשׁוּעוֹת פָּנָיו
  choice: அவரது திருமுகத்திலிருந்து வரும் மீட்புக்காக
  rationale: எபிரெயச் சொற்றொடர் நேரடியாக ‘அவரது முகத்தின் மீட்புகள்’ என உள்ளது. தமிழில் பொருள் தெளிவாக இருக்க, தேவனுடைய முகம் அல்லது பிரசன்னத்திலிருந்து கிடைக்கும் விடுதலை என மொழிபெயர்க்கப்பட்டுள்ளது; நேரடி வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: יְשׁוּעוֹת פָּנָיו என்ற இறுதிச் சொற்றொடரின் தொடர்பு
  choice: அவரது திருமுகத்திலிருந்து வரும் மீட்புக்காக
  alternative: அவரது முகத்தின் மீட்புகள் / அவரது பிரசன்னம் தரும் உதவி
  rationale: மசோரா உரையில் ‘அவரது முகம்’ என்ற வாசகமே உள்ளது; கொடுக்கப்பட்ட ஆங்கிலத்தின் ‘my countenance and my God’ என்பது இவ்வசனத்தின் எபிரெய உரையில் இல்லாத கூறுகளைச் சேர்க்கிறது. ‘திருமுகம்’ என்ற உருவகத்தை வைத்துக்கொண்டு, அது தேவனுடைய அருள்மிகு பிரசன்னத்திலிருந்து வரும் மீட்பைக் குறிக்கலாம் என்பதைக் காட்டுகிறது; சாத்தியமான நேரடி வாசிப்பும் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடை. ‘என் உள்ளமே’ என்பது தன்னுரையாடலை இயல்பாக வைத்திருக்கிறது; ‘திருமுகம்’ மூலமொழியின் முகம்/பிரசன்னம் உருவகத்தைப் பாதுகாக்கிறது.
