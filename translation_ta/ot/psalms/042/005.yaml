revisions:
- from: என் உள்ளமே, நீ ஏன் தாழ்ந்து சோர்ந்திருக்கிறாய்? எனக்குள் ஏன் கலங்குகிறாய்? தேவனை நம்பிக்கையோடு எதிர்நோக்கு; ஏனெனில், அவரது திருமுகத்திலிருந்து வரும் மீட்புக்காக[a] நான் இன்னும் அவரைப் போற்றுவேன்.
  to: என் உள்ளமே, நீ ஏன் தாழ்ந்திருக்கிறாய்? எனக்குள் ஏன் கலங்குகிறாய்? தேவனை நம்பிக்கையோடு எதிர்நோக்கு; ஏனெனில், அவரது திருமுகம் தரும் மீட்புகளுக்காக நான் இன்னும் அவரைப் போற்றுவேன்.
  rationale: The revision removes the added nuance ‘சோர்ந்து,’ retains the Hebrew plural in ‘மீட்புகள்,’ and expresses the difficult final genitive in idiomatic Tamil while preserving its literal form and the face/presence alternative in the footnote. It deliberately follows the WLC over the inconsistent English audit wording at the end of the verse.
