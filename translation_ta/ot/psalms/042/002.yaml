    text: சொல்லுக்குச்சொல், “கடவுளின் முகம்.”
    reason: lexical_alternative
  revision_rationale: The revision replaces a less transparent elevated idiom with a natural modern equivalent for appearing in God’s presence, and improves the literal-gloss phrasing in the footnote. It preserves the Hebrew metaphor, repetition, ambiguity, and the sense of appearing rather than seeing.
