review_pass:
  verdict: revise
  source_fidelity: The rendering retains the concrete thirst metaphor, the twofold reference to God and the living God, the future question, and the Niphal sense of appearing. ‘என் உள்ளம்’ is an acceptable idiomatic poetic rendering of נפשי here, without imposing a narrower doctrinal sense. Rendering פני אלהים as God’s presence correctly conveys the Hebrew idiom, while the footnote preserves its literal wording.
  naturalness: The verse is fluent and poetic in modern standard Tamil. However, ‘திருமுன்’ is elevated and somewhat less transparent in contemporary general Tamil than ‘முன்னிலையில்’; the latter communicates the idiom naturally without loss of reverence. ‘நேர்சொல்லாக’ in the footnote is also less idiomatic than ‘சொல்லுக்குச்சொல்’.
  terminology: ‘கடவுள்,’ ‘உயிருள்ள கடவுள்,’ and ‘உள்ளம்’ suit a dignified modern Tamil register. The revised idiomatic expression avoids implying literal physical sight while retaining the source wording in the note.
  issues:
  - severity: low
    issue: The expression ‘கடவுளின் திருமுன்’ is somewhat literary/less transparent for a modern general readership.
    rationale: ‘கடவுளின் முன்னிலையில்’ is clearer modern standard Tamil and faithfully conveys the Hebrew idiom of appearing before God.
  - severity: low
    issue: The footnote label ‘நேர்சொல்லாக’ is not the most natural Tamil phrasing for a literal gloss.
    rationale: ‘சொல்லுக்குச்சொல்’ is a clear, established way to introduce the literal expression.
  revised_text: என் உள்ளம் கடவுளுக்காக, உயிருள்ள கடவுளுக்காகத் தாகமாயிருக்கிறது. நான் எப்போது வந்து கடவுளின் முன்னிலையில்[a] தோன்றுவேன்?
  revised_footnotes:
