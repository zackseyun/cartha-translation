  text: צָמְאָ֬ה נַפְשִׁ֨/י לֵ/אלֹהִים֮ לְ/אֵ֪ל חָ֥י מָתַ֥י אָב֑וֹא וְ֝/אֵרָאֶ֗ה פְּנֵ֣י אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/002.yaml
  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
translation:
  language: ta
  text: என் உள்ளம் கடவுளுக்காக, உயிருள்ள கடவுளுக்காகத் தாகமாயிருக்கிறது. நான் எப்போது வந்து கடவுளின் முன்னிலையில்[a] தோன்றுவேன்?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்குச்சொல், “கடவுளின் முகம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְאָה
  choice: தாகமாயிருக்கிறது
  rationale: தாகம் என்ற உறுதியான கவிதை உருவகத்தைத் தக்கவைத்து, சூழலில் தொடரும் ஏக்கத்தை இயல்பான நிகழ்காலத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: נַפְשִׁי
  choice: என் உள்ளம்
  rationale: נפשׁ இங்கு முழு மனிதரையும் அவரது ஆழ்ந்த உள்ளார்ந்த ஏக்கத்தையும் குறிக்கிறது. ‘என் உள்ளம்’ என்பது நவீன தமிழில் இயல்பாகவும் கவிதைநயத்துடனும் இதை வெளிப்படுத்துகிறது; ‘என் ஆத்துமா’ என்பதில் ஏற்படக்கூடிய குறுகிய தத்துவப் பொருளைத் தவிர்க்கிறது.
- source_word: לֵאלֹהִים
  choice: கடவுளுக்காக
  rationale: தாகம் என்ற உருவகத்தோடு ל குறிக்கும் ஏக்கத்தின் இலக்கைத் தமிழில் இயல்பாகத் தெரிவிக்கிறது.
- source_word: לְאֵל חָי
  choice: உயிருள்ள கடவுளுக்காக
  rationale: אֵל חָי என்பதன் நேரான பொருளையும், உயிரற்ற தெய்வங்களிலிருந்து கடவுளை வேறுபடுத்தும் அழுத்தத்தையும் தக்கவைக்கிறது.
- source_word: מָתַי
  choice: எப்போது
  rationale: நிறைவேறும் காலத்தைப் பற்றிய நேரடியான வினாவை கூடுதல் விளக்கமின்றி வழங்குகிறது.
- source_word: אָבוֹא
  choice: நான் எப்போது வந்து
  rationale: எதிர்பார்க்கப்படும் வருகையை வினாவாக இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאֵרָאֶה
  choice: தோன்றுவேன்
  rationale: நிபால் வடிவின் ‘தோன்றுதல்/முன்னிலையில் ஆஜராதல்’ என்ற பொருளைப் பாதுகாக்கிறது; ‘காண்பேன்’ என்ற மாற்று வாசிப்பைத் திணிக்கவில்லை.
- source_word: פְּנֵי אֱלֹהִים
  choice: கடவுளின் திருமுன்
  rationale: நேர்சொல்லாக ‘கடவுளின் முகம்’ என்றாலும், வழிபாட்டுச் சூழலில் கடவுளின் முன்னிலையில் வருவதைக் குறிக்கும் எபிரெய மரபுத்தொடரை இயல்பான, கண்ணியமான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: פְּנֵי אֱלֹהִים என்ற மரபுத்தொடரின் மொழிபெயர்ப்பு
  choice: கடவுளின் திருமுன்
  alternative: கடவுளின் முகம் / கடவுளின் முகத்திற்கு முன்பாக
  rationale: வசனம் கடவுளின் முன்னிலையில், ஒருவேளை வழிபாட்டில், ஆஜராகும் ஏக்கத்தைச் சொல்கிறது. ‘திருமுன்’ என்பது கடவுளின் சாராம்சத்தை உடல்கண்களால் காண்பதாகத் தீர்மானிக்காமல் அந்தப் பொருளைத் தெரிவிக்கிறது; நேர்சொல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைநயமும் கண்ணியமும் தக்கவைக்கப்பட்டுள்ளன. ‘ஆத்துமா’ என்பதற்குப் பதில் பரந்த எபிரெயப் பொருளை இயல்பாக வெளிப்படுத்த ‘உள்ளம்’ பயன்படுத்தப்பட்டுள்ளது; ‘ஜீவனுள்ள’ என்ற பழைய வழக்கிற்குப் பதில் ‘உயிருள்ள’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
