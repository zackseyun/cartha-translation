- from: என் உள்ளம் கடவுளுக்காக, உயிருள்ள கடவுளுக்காகத் தாகமாயிருக்கிறது. நான் எப்போது வந்து கடவுளின் திருமுன்[a] தோன்றுவேன்?
  to: என் உள்ளம் கடவுளுக்காக, உயிருள்ள கடவுளுக்காகத் தாகமாயிருக்கிறது. நான் எப்போது வந்து கடவுளின் முன்னிலையில்[a] தோன்றுவேன்?
