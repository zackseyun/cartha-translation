  text: My God[a], my soul is cast down within me; therefore I remember you from the land of the Jordan and the Hermons[d][c][b], from Mount Mizar.
translation:
  language: ta
  text: என் தேவனே, என் உள்ளம் எனக்குள் தாழ்ந்து கிடக்கிறது; ஆகையால், யோர்தான் நாட்டிலிருந்தும் எர்மோன் மலைகளிலிருந்தும்[a], மிசார் மலையிலிருந்தும்[c] உம்மை நினைக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் ‘எர்மோன்கள்’ என்று பன்மையில் உள்ளது; இது எர்மோன் மலைத்தொடரையோ அதன் சிகரங்களையோ குறிக்கலாம்.
