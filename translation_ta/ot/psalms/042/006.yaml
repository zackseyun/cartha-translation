    text: ‘மிசார் மலை’ ஓர் இடப்பெயராக இருக்கலாம்; மாற்றாக, ‘சிறிய மலை’ அல்லது ‘மிசார் என்னும் குன்று’ என்றும் பொருள்படலாம்.
