- source_word: עַל־כֵּן
  choice: ஆகையால்
  rationale: மனத்தாழ்வுக்கும் தேவனை நினைப்பதற்கும் இடையிலான விளைவு சார்ந்த தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: אֶזְכָּרְךָ
  choice: உம்மை நினைக்கிறேன்
