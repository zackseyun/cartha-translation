- source_word: וְחֶרְמוֹנִים
  choice: எர்மோன் மலைத்தொடரிலிருந்து
  rationale: எபிரெயப் பன்மையை தனித்தனி ‘எர்மோன்கள்’ எனக் குழப்பமூட்டாமல், எர்மோன் மலைத்தொடர் அல்லது அதன் சிகரங்கள் என்ற சாத்தியமான புவியியல் பொருளில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מֵהַר מִצְעָר
  choice: மிசார் மலையிலிருந்து
  rationale: இணையான புவிப்பெயர்களின் சூழலில் מִצְעָר என்பதை இடப்பெயராகக் காக்கும் குறைந்த விளக்கவுரை கொண்ட தெரிவாகும்.
theological_decisions:
- issue: נפשׁ என்பதன் மனிதவியல் பொருள்
  choice: என் ஆத்துமா
  alternative: நானே / என் உள்ளம்
  rationale: சங்கீதக் கவிதையின் பாரம்பரியமான, அதேவேளை புரிந்துகொள்ளத்தக்க மொழியைப் பேணுகிறது; இதை உடலிலிருந்து பிரிந்த ஓர் அங்கம் என்று தேவையின்றி வரையறுக்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடையுடன் மொழிபெயர்க்கப்பட்டது. தேவனை நோக்கும் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; புவிப்பெயர்களும் மூலத்தின் தெளிவின்மைகளும் அடிக்குறிப்புகளுடன் காக்கப்பட்டுள்ளன.
