    text: அல்லது, ‘உம்மை நினைப்பேன்.’ இங்குள்ள எபிரேய வினைச்சொல் சூழலின்படி தற்போதைய உறுதியையோ எதிர்காலச் செயலையோ குறிக்கலாம்.
    reason: lexical_alternative
