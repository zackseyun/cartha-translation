translation_notes:
  register: நவீனத் தரமான, எளிதில் புரியும், ஆனால் சங்கீதக் கவித்துவத்திற்கேற்ற கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘ஆழம் ஆழத்தை’ என்ற மீளுரை மூலத்தின் செறிவையும் திட்டமிட்ட தெளிவின்மையையும் பாதுகாக்கிறது; ‘உமது’ என்பது தெய்வத்தைச் சுட்டினாலும் தனிப்பட்ட சமய மரபின் சிறப்புப் பயன்பாட்டை இறக்குமதி செய்யாது.
