base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/007.yaml
  text: Deep calls to deep at the sound of your waterfalls[b][a]; all your breakers and your waves have passed over me.
translation:
  language: ta
  text: உமது நீர்வீழ்ச்சிகளின் முழக்கத்தில் ஆழம் ஆழத்தை அழைக்கிறது[a]; உமது அலைமோதல்களும் அலைகளும் அனைத்தும் என்மேல் கடந்துபோயின[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது நீர்ப்பாய்ச்சல்களின் முழக்கத்தில்.’ எபிரெயச் சொல் நீர்ப்பாதைகளையோ வேகமாகப் பாயும் நீரையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உமது அலைமோதல்களும் பேரலைகளும் அனைத்தும் என்னை மூழ்கடித்துச் சென்றன.’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם ... תְּהוֹם
  choice: ஆழம் ... ஆழத்தை
  rationale: தண்ணீரின் ஆழத்தையோ பேராழத்தையோ குறிக்கும் எபிரெயச் சொல்லின் கவித்துவமான மீளுருவைத் தமிழிலும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: קוֹרֵא
  choice: அழைக்கிறது
  rationale: நிகழ்காலக் கவித்துவக் காட்சியை இயல்பாகவும் நேரடியாகவும் வெளிப்படுத்துகிறது.
- source_word: לְקוֹל
  choice: முழக்கத்தில்
  rationale: நீர்வீழ்ச்சிகளின் வலிமையான ஒலியைச் செவிப்புலக் காட்சியாக இயல்பான தமிழில் தருகிறது; எபிரெய முன்னிடைச்சொல் இங்கு நிகழும் சூழலைக் குறிக்கிறது.
- source_word: צִנּוֹרֶיךָ
  choice: உமது நீர்வீழ்ச்சிகள்
  rationale: இச்சொல் நீர்ப்பாதை, நீர்ப்பாய்ச்சல் அல்லது வேகமாக விழும் நீரைக் குறிக்கலாம். சுற்றியுள்ள பெருக்கெடுத்த நீரின் படிமத்திற்கும் ஒலிக்கும் ‘நீர்வீழ்ச்சிகள்’ தெளிவாகப் பொருந்துகிறது; இருப்பினும் சொற்பொருள் நிச்சயமின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: מִשְׁבָּרֶיךָ
  choice: உமது அலைமோதல்கள்
  rationale: உடைந்து மோதும் கடலலைகளின் செயலும் வலிமையும் இயல்பான நவீனத் தமிழில் வெளிப்படுகின்றன.
- source_word: וְגַלֶּיךָ
  choice: உமது அலைகளும்
  rationale: גַּל என்பதன் எளிய, நேரடியான பொருளைத் தருகிறது; முந்தைய இணைச்சொல்லுடனான வேறுபாட்டையும் காக்கிறது.
- source_word: עָלַי עָבָרוּ
  choice: என்மேல் கடந்துபோயின
  rationale: நீர் பேசுபவரை மூழ்கடித்தபடி மேலாகச் சென்ற அனுபவத்தை, மூலத்தின் நிறைவுற்ற வினைநிலையுடன் நெருக்கமாகப் பாதுகாக்கிறது.
