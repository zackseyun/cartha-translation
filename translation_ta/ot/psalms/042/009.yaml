base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/009.yaml
  text: I say to God[a], my rock, “Why have you forgotten me? Why do I go about mourning under the oppression of the enemy?”
translation:
  language: ta
  text: 'நான் என் கன்மலையாகிய கடவுளிடம் சொல்கிறேன்:


    “ஏன் என்னை மறந்துவிட்டீர்?


    பகைவனின் ஒடுக்குதலின் கீழ்


    நான் ஏன் துயரத்தோடு நடக்கிறேன்?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பகைவனின் ஒடுக்குதலின் கீழ் நான் ஏன் இருள்சூழ்ந்த நிலையில் நடக்கிறேன்?”
    reason: קֹדֵר என்பது துயரமுள்ள அல்லது இருண்ட/இருள்சூழ்ந்த நிலையைக் குறிக்கக்கூடியதால் இந்தச் சொற்பொருள் மாற்று தரப்படுகிறது.
lexical_decisions:
- source_word: אוֹמְרָה
  choice: நான் சொல்கிறேன்
  rationale: Qal cohortative வடிவம் தீர்மானத்தையோ உடனடி உரையையோ குறிக்கலாம். இங்கு கடவுளை நேரடியாக நோக்கிப் பேசுவதை அறிமுகப்படுத்துவதால் நிகழ்காலம் இயல்பாக உள்ளது; ‘நான் சொல்வேன்’ என்பதும் இலக்கண ரீதியில் சாத்தியம்.
- source_word: לְאֵל
  choice: கடவுளிடம்
  rationale: אֵל இச்சூழலில் தனிப்பெயராக அல்லாமல் கடவுளைக் குறிக்கும் பொதுப் பட்டமாக வருகிறது. தமிழில் உரையாடலின் இலக்கை இயல்பாகக் காட்ட ‘கடவுளிடம்’ பயன்படுத்தப்பட்டது.
- source_word: סַלְעִי
  choice: என் கன்மலையாகிய
  rationale: סֶלַע என்பது பாறை அல்லது கன்மலையைக் குறிக்கிறது. பாதுகாப்பும் உறுதியும் அளிக்கும் கடவுளைக் குறிக்கும் மூல உருவகத்தை விளக்கமாக மாற்றாமல் ‘கன்மலை’ எனப் பாதுகாக்கிறது.
- source_word: שְׁכַחְתָּנִי
  choice: என்னை மறந்துவிட்டீர்
  rationale: 2ஆம் நபர் ஆண்பால் ஒருமை perfect வடிவத்துடன் 1ஆம் நபர் ஒருமை செயப்படுபொருள் இணைந்துள்ளது. தற்போதும் நீடிக்கும் அனுபவக் குறையைத் தமிழில் ‘மறந்துவிட்டீர்’ இயல்பாக வெளிப்படுத்துகிறது; ‘கைவிட்டீர்’ என்பது மூல வினையின் பொருளை மிகைப்படுத்தும்.
- source_word: קֹדֵר
  choice: துக்கத்தோடு
  rationale: קדר என்பதன் participle வடிவம் இருண்ட அல்லது சோகமான நிலையைச் சுட்டலாம்; விரிவாகத் துக்கம் அனுசரிப்பதையும் குறிக்கலாம். புலம்பல் சூழலில் ‘துக்கத்தோடு’ இயல்பான முதன்மை வாசிப்பு; ‘இருள் சூழ்ந்தவனாய்’ என்ற மாற்று அடிக்குறிப்பில் வைக்கப்பட்டது.
- source_word: אֵלֵךְ
  choice: திரிகிறேன்
  rationale: הלך அடிப்படையில் செல்லுதல் அல்லது நடத்தல் எனப் பொருள்படும். இங்கு தொடரும் நிலையைத் தமிழில் ‘திரிகிறேன்’ இயல்பாகக் காட்டுகிறது; கட்டாயத்தை மூலத்தில் இல்லாமல் சேர்க்கவில்லை.
- source_word: בְּלַחַץ
  choice: ஒடுக்குதலின்கீழ்
  rationale: לַחַץ அழுத்தம் அல்லது ஒடுக்குதலைக் குறிக்கிறது. בְּ முன்னொட்டு சூழ்நிலையையோ காரணத்தையோ குறிக்கக்கூடியதால் ‘ஒடுக்குதலின்கீழ்’ சுமத்தப்பட்ட நிலையைக் காட்டுவதோடு அந்தத் திறந்த தன்மையையும் ஓரளவு காக்கிறது.
- source_word: אוֹיֵב
  choice: பகைவன்
  rationale: எபிரெயில் ஒருமை வடிவில் வரும் சொல்லைத் தமிழிலும் ‘பகைவன்’ என்று வைத்துள்ளோம். இது ஒரு குறிப்பிட்ட பகைவனையோ பொதுவாக விரோத சக்தியையோ குறிக்கக்கூடிய கவிதைநடைத் திறந்த தன்மையைப் பாதுகாக்கிறது.
theological_decisions:
- issue: סַלְעִי என்ற இறை உருவகம்
  choice: என் கன்மலையாகிய
  alternative: என் அடைக்கலமாகிய
  rationale: ‘அடைக்கலம்’ என்று பொருளை மட்டும் விளக்காமல், கடவுள் உறுதியும் பாதுகாப்பும் அளிக்கும் கன்மலை என்ற மூலக் கவிதை உருவகம் பாதுகாக்கப்பட்டது.
- issue: கடவுள் மறந்துவிட்டார் என்ற புலம்பல்
  choice: ஏன் என்னை மறந்துவிட்டீர்?
  alternative: ஏன் என்னைக் கைவிட்டீர்?
  rationale: சங்கீதக்காரரின் அனுபவக் குற்றச்சாட்டை கோட்பாட்டுக் காரணங்களுக்காக மென்மையாக்காமல் வைத்துள்ளோம். அதேவேளை, שׁכח என்பதைக் ‘கைவிடுதல்’ என்று தீவிரப்படுத்தாமல் ‘மறத்தல்’ என்ற மூலப் பொருளையே காத்துள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்கு விளங்கும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் இடத்தில் மரியாதை ஒருமையான ‘நீர்/வீர்’ நடை பின்பற்றப்பட்டுள்ளது. எபிரெயக் கவிதையின் குறும் வரிகளும் புலம்பலின் நேரடியான இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
