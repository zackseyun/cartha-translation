translation_notes:
  register: நவீன தரத் தமிழில், கவித்துவமும் மாண்பும் காக்கப்பட்டுள்ளன. ‘ஆத்துமா’ என்ற சமயச்சார்பு அதிகமுள்ள சொல்லுக்குப் பதிலாக, இச்சூழலில் נֶפֶשׁ குறிக்கும் அக உணர்வை இயல்பாகத் தெரிவிக்க ‘உள்ளம்’ பயன்படுத்தப்பட்டது. மூலத்தின் நீண்ட நினைவோட்டம் தமிழில் தெளிவாக வாசிக்கும்படி அமைக்கப்பட்டது; அரிய בַּסָּךְ மற்றும் אֶדַּדֵּם சொற்களின் மெய்யான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்பட்டது.
