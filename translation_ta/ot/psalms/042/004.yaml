base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/004.yaml
  text: 'These things I remember[a], and I pour out my soul within me: how I used to pass along with the throng, leading them to the house of God with the sound of joyful shouting and thanksgiving[b], a festal multitude.'
translation:
  language: ta
  text: 'இவற்றை நான் நினைவுகூர்கிறேன்; என் உள்ளத்தை எனக்குள்ளே ஊற்றிவிடுகிறேன்: விழா கொண்டாடும் பெருங்கூட்டத்தோடு[a] நான் சென்று, மகிழ்ச்சி முழக்கமும் நன்றியறிதலும் ஒலிக்க, அவர்களை இறைவனின் இல்லத்திற்கு வழிநடத்தியதையும்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “விழா கொண்டாடும் பெருங்கூட்டத்தோடு” என்பதற்குப் பதிலாக, “விழா ஊர்வலத்தில்” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொல் בַּסָּךְ அரிதானது; அது திரண்ட விழாக்கூட்டத்தையோ ஊர்வலக் குழுவையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “அவர்களை ... வழிநடத்தியதையும்” என்பதற்கு “அவர்களோடு சென்றதையும்” அல்லது “அவர்களை அழைத்துச் சென்றதையும்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வினை אֶדַּדֵּם அரிதானது; அதன் துல்லியமான நயம் உறுதியல்ல, ஆனால் இறைவனின் இல்லத்தை நோக்கிய கூட்டுப் பயணத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֶזְכְּרָה
  choice: இவற்றை நான் நினைவுகூர்கிறேன்
  rationale: பன்மைச் சுட்டுப்பெயரையும், இப்போது நினைவில் மீட்டுப் பார்க்கும் கவித்துவச் செயலையும் இயல்பான தமிழில் காக்கிறது.
- source_word: וְאֶשְׁפְּכָה עָלַי נַפְשִׁי
  choice: என் உள்ளத்தை எனக்குள் ஊற்றிவிடுகிறேன்
  rationale: சொல்லாட்சியின் ‘ஊற்றுதல்’ உருவகத்தைத் தக்கவைத்து, נֶפֶשׁ இங்கு குறிக்கும் ஆழ்ந்த அகநிலையை நவீன தமிழில் ‘உள்ளம்’ என வெளிப்படுத்துகிறது.
- source_word: כִּי אֶעֱבֹר בַּסָּךְ
  choice: மக்கள் திரளோடு நான் சென்றதையும்
  rationale: כִּי நினைவுகூரப்படும் உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. கடினமான בַּסָּךְ என்பதற்கு விழாப் பயணக் கூட்டம் என்ற சூழல்சார்ந்த பொருள் முதன்மை உரையில் கொள்ளப்படுகிறது.
- source_word: אֶדַּדֵּם עַד בֵּית אֱלֹהִים
  choice: இறைவனின் இல்லத்திற்கு வழிநடத்தியதையும்
  rationale: அரிய வினையின் துல்லிய நயம் உறுதியல்ல; ஆயினும் மூன்றாம் நபர் பன்மை பின்னொட்டையும் ஆலயத்தை நோக்கிய கூட்டுப் பயணத்தையும் ‘வழிநடத்துதல்’ தெளிவாகக் காட்டுகிறது.
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  choice: மகிழ்ச்சி முழக்கமும் நன்றியறிதலும் ஒலிக்க
  rationale: קוֹל என்பதன் கேட்கத்தக்க ஒலியையும், רִנָּה என்பதன் உரத்த மகிழ்ச்சி முழக்கத்தையும், תוֹדָה என்பதன் நன்றி/துதி நயத்தையும் இயல்பாக இணைக்கிறது.
- source_word: הָמוֹן חוֹגֵג
  choice: விழா கொண்டாடும் பெருங்கூட்டத்தை
  rationale: மக்கள் பெருந்திரளையும், பண்டிகையைக் கொண்டாடும் செயற்பாட்டையும் நேரடியாகக் காக்கிறது; இதனை அரிய வினையின் பொருளாகப் புரிந்துகொள்ளும் தொடரமைப்பை பிரதிபலிக்கிறது.
