  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down[a], my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: ta
  text: என் ஆன்மாவே, நீ ஏன் துவண்டு கிடக்கிறாய்? எனக்குள் ஏன் கலங்கித் தவிக்கிறாய்? கடவுளுக்காக நம்பிக்கையுடன் காத்திரு; ஏனெனில் நான் இன்னும் அவரைப் போற்றுவேன்—என் முகத்திற்கு மீட்பளிப்பவரும் என் கடவுளுமான அவரை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரேயத்தில் எழுத்துப்படி, “என் முகத்தின் மீட்புகள்.” இது துவண்ட முகத்தை உயர்த்தி மீட்கும் கடவுளைக் குறிக்கலாம்; “என் முகத்துக்கு உதவுகிறவரும்” என்றும் பொருள் கொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: துவண்டு கிடக்கிறாய்
  rationale: குனிந்து அல்லது தாழ்ந்து போதலைக் குறிக்கும் உருவகத்தையும் மனச்சோர்வின் சூழலையும் இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: נַפְשִׁי
  choice: என் ஆன்மாவே
  rationale: சங்கீதக்காரர் தமது உள்ளார்ந்த உயிரோடு பேசும் கவிதைநயமுள்ள தன்முக உரையாடலைப் பாதுகாக்கிறது.
- source_word: תֶּהֱמִי
  choice: கலங்கித் தவிக்கிறாய்
  rationale: ஆரவாரம், கொந்தளிப்பு, அமைதியின்மை ஆகிய பொருள் வளையத்தை உள்ளார்ந்த கடும் கலக்கமாக இயல்பாக எடுத்துரைக்கிறது.
- source_word: עָלַי
  choice: எனக்குள்
  rationale: எழுத்துப்படி ‘என்மேல்’ என்றாலும், இங்கு பேச்சாளரின் அகத்தில் நிலவும் கலக்கத்தைக் குறிக்கும் எபிரேய மரபுத்தொடரின் இயல்பான தமிழாக்கம்.
- source_word: הוֹחִילִי
  choice: நம்பிக்கையுடன் காத்திரு
  rationale: வெறும் நம்பிக்கை வைப்பதைவிட, எதிர்பார்ப்போடு காத்திருத்தல் என்ற வினையின் இரு கூறுகளையும் காக்கிறது.
- source_word: לֵאלֹהִים
  choice: கடவுளுக்காக
  rationale: நம்பிக்கையுடன் காத்திருப்பதன் இலக்காகக் கடவுளைச் சுட்டும் முன்னிடைச்சொல்லை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: עוֹד אוֹדֶנּוּ
  choice: நான் இன்னும் அவரைப் போற்றுவேன்
  rationale: தற்போதைய துயரத்துக்கு அப்பால் வரவிருக்கும் தொடர்ந்த அல்லது புதுப்பிக்கப்பட்ட துதியைத் தெரிவிக்கிறது.
- source_word: יְשׁוּעֹת פָּנַי
  choice: என் முகத்தின் மீட்பு
  rationale: எபிரேயத்தின் அடர்த்தியான, கவிதைநயமுள்ள சொல்லிணைப்பையும் ‘முகம்’ என்ற தெளிவான உருவகத்தையும் அளவுக்கு மீறி விளக்காமல் பாதுகாக்கிறது.
- source_word: וֵאלֹהָי
  choice: என் கடவுள்
  rationale: தனிப்பட்ட நம்பிக்கை அறிக்கையாக வரும் நிறைவுச் சொற்றொடரை நேரடியாகவும் கண்ணியமாகவும் வழங்குகிறது.
theological_decisions:
- issue: יְשׁוּעֹת פָּנַי என்ற சொல்லிணைப்பின் பொருள்
  choice: என் முகத்தின் மீட்பும் என் கடவுளுமான அவரை
  alternative: என் முகத்தை உயர்த்தி உதவுகிறவரும் என் கடவுளுமான அவரை
  rationale: முகம் தாழ்ந்த நிலையிலிருந்து மாற்றப்படுவதை இச்சொற்றொடர் குறிக்கலாம்; இருப்பினும் எபிரேயத்தில் உள்ள ‘மீட்புகள்/முகம்’ என்ற கவிதைச் செறிவை விளக்கவுரையாக முழுமையாகத் தீர்த்துவிடாமல் முதன்மை உரையில் பாதுகாக்கிறது. பன்மை வடிவமும் சாத்தியமான பொருளும் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், தன்முக உரையாடலின் சங்கீதக் கவிதைநயத்தையும் கண்ணியத்தையும் காக்கும் நடை. ‘ஆன்மா’, ‘போற்றுவேன்’, ‘மீட்பு’ ஆகிய சொற்கள் பொதுவாசகருக்குப் புரியத்தக்கவையாகவும் வழிபாட்டு மொழியின் உயர்வைத் தக்கவைத்தவையாகவும் தேர்ந்தெடுக்கப்பட்டன.
