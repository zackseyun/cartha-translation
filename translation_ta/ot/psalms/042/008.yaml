  text: יוֹמָ֤ם יְצַוֶּ֬ה יְהוָ֨ה חַסְדּ֗/וֹ וּ֭/בַ/לַּיְלָה שיר/ה עִמִּ֑/י תְּ֝פִלָּ֗ה לְ/אֵ֣ל חַיָּֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/008.yaml
  text: By day Yahweh commands his steadfast love[b][a], and at night his song is with me— a prayer to the God of my life.
translation:
  language: ta
  text: 'பகலில் யாவே தமது மாறாத அன்புக்குக் கட்டளையிடுகிறார்;

    இரவிலே அவரது பாடல் என்னோடு இருக்கிறது[b]—

    என் வாழ்வின் இறைவனை நோக்கிய ஒரு பிரார்த்தனை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எனக்கு வாழ்வளிக்கும் இறைவனை நோக்கிய ஒரு பிரார்த்தனை.” எபிரெயத்தில் சொற்சொல்லாக, “என் வாழ்வின் இறைவனை நோக்கிய ஒரு பிரார்த்தனை.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவருக்கான ஒரு பாடல் என்னோடு இருக்கிறது.” எபிரெய வடிவத்தை எவ்வாறு புரிந்துகொள்வது என்பதில் தெளிவின்மை உள்ளது; முதன்மை உரை அதை “அவரது பாடல்” எனக் கொள்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹמָם
  choice: பகலில்
  rationale: காலத்தைக் குறிக்கும் வினையடைப் பயன்பாடு; அடுத்துள்ள ‘இரவிலோ’ என்பதுடன் இயல்பான கவிதை இணையை உருவாக்குகிறது.
- source_word: יְצַוֶּה
  choice: கட்டளையிடுகிறார்
  rationale: צוה என்பதன் பியேல் வடிவத்தின் வலுவான, உயிரோட்டமுள்ள பொருளைப் பேணுகிறது; யாவே தமது அன்பைச் செயல்பட அனுப்புவது போன்ற கவித்துவப் படிமத்தையும் விடாமல் வைத்திருக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெயத் திருப்பெயரான יהוה-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் அதன் தனிப்பெயர் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: חַסְדּוֹ
  choice: தமது மாறாத அன்பை
  rationale: חסד என்பதில் உள்ள உறுதியான, பற்றுமாறாத அன்பு மற்றும் இரக்கத்தின் கருத்தை இயல்பான தமிழில் எடுத்துரைக்கிறது. மரியாதை ஒருமைக்கேற்ப ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וּבַלַּיְלָה
  choice: இரவிலோ
  rationale: பகல்–இரவு கால இணையைத் தெளிவாக்குகிறது; ‘-ஓ’ இங்கு கடுமையான எதிர்மறையை அல்ல, கவிதைநடைக் கால மாற்றத்தை உணர்த்துகிறது.
- source_word: שירה
  choice: அவரது பாடல்
  rationale: மசோரா உரையில் எழுதப்பட்ட שירה வடிவத்தின் இலக்கணப் பொருள் தெளிவற்றது. முதன்மை உரை சூழலுக்கும் ‘தமது மாறாத அன்பு’ என்ற இணைக்கும் ஏற்றவாறு ‘அவரது பாடல்’ எனக் கொள்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: עִמִּי
  choice: என்னோடு இருக்கிறது
  rationale: உடனிருத்தலைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான தமிழுக்காக வினைச்சொல்லுடன் வழங்குகிறது.
- source_word: תְּפִלָּה
  choice: மன்றாட்டு
  rationale: இறைவனை நோக்கிச் செய்யப்படும் வேண்டுதலைக் குறிக்கும் dignified, current Tamil term; முந்தைய ‘பாடல்’ எவ்வகையானது என்பதை விளக்கும் appositional தொடர்பைப் பேணுகிறது.
- source_word: לְאֵל
  choice: இறைவனை நோக்கிய
  rationale: 'לְ முன்னிடைச்சொல்லின் திசை/முகப்பு உணர்வை இயல்பான தமிழில் வெளிப்படுத்துகிறது: மன்றாட்டு இறைவனை நோக்கி உரைக்கப்படுகிறது.'
- source_word: חַיָּי
  choice: என் வாழ்வின்
  rationale: முதல் நபர் ஒருமை பின்னொட்டுடன் வரும் ‘என் வாழ்க்கை/வாழ்வு’ என்ற எபிரெயப் பிறப்புறவுத் தொடரை நேரடியாகப் பேணுகிறது; ‘உயிருள்ள’ என்ற பெயரடையாக மாற்றவில்லை.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூல உரையில் தனிப்பெயர் நேரடியாக இருப்பதால், அதை பொதுப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்க்கிறது.
- issue: לְאֵל חַיָּי என்பதன் பொருள்
  choice: என் வாழ்வின் இறைவனை நோக்கிய
  alternative: எனக்கு வாழ்வளிக்கும் இறைவனை நோக்கிய; உயிருள்ள இறைவனை நோக்கிய
  rationale: חַיָּי என்பது இங்கு முதல் நபர் பின்னொட்டுடைய ‘என் வாழ்வு’ என்பதே அன்றி ‘உயிருள்ள’ என்று இறைவனை விவரிக்கும் பெயரடை அல்ல. நேரடியான பிறப்புறவை முதன்மை உரை பேணுகிறது; காரணவிளக்கமான மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- issue: שירה என்ற வடிவத்தின் வாசிப்பு
  choice: அவரது பாடல்
  alternative: அவருக்கான ஒரு பாடல்
  rationale: எழுத்துருவில் உள்ள வடிவம் உண்மையான இலக்கணத் தெளிவின்மையை ஏற்படுத்துகிறது. சூழல் சார்ந்த ‘அவரது பாடல்’ முதன்மை உரையில் வைக்கப்பட்டாலும், இறைவனை நோக்கிய பாடல் என்ற வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை. ‘யாவே’ தனிப்பெயராகவும் ‘இறைவன்’ பொதுப்பெயராகவும் வேறுபடுத்தப்பட்டுள்ளன. பகல்–இரவு இணை மற்றும் மூன்று அடிக் கவிதை அமைப்பு பேணப்பட்டுள்ளன; மூலத்திலுள்ள தெளிவின்மைகள் அடிக்குறிப்புகளால் வெளிப்படையாக வைக்கப்பட்டுள்ளன.
