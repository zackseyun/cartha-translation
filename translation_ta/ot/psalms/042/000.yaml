  text: For the choirmaster[a]. A Maskil[b] of the sons of Korah[c].
translation:
  language: ta
  text: இசைத் தலைவருக்காக[a]. கோராவின் மகன்களின்[c] மஸ்கீல்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘இசைத் தலைவரிடம்’ என்றும் மொழிபெயர்க்கலாம். சங்கீதத் தலைப்புகளில் வரும் எபிரெய முன்னொட்டை இருவிதமாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘மஸ்கீல்’ என்பது சங்கீதத் தலைப்புகளில் வரும் ஒரு தொழில்நுட்பச் சொல். அதன் துல்லியப் பொருள் உறுதியில்லை; ‘தியானப் பாடல்’, ‘போதனைப் பாடல்’ போன்ற விளக்கங்கள் முன்வைக்கப்பட்டுள்ளன.
    reason: lexical_alternative
  - marker: c
    text: ‘கோராவின் மகன்களுக்காக’ என்றும் மொழிபெயர்க்கலாம். இத்தலைப்பு அவர்கள் இயற்றியதையோ, அவர்களுடனான தொடர்பையோ, அவர்கள் பாடுவதற்காக ஒதுக்கப்பட்டதையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைக்குழுத் தலைவருக்காக
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்வை வழிநடத்துபவரைக் குறிக்கும் மரபுச் சொல்லாகும். ל முன்னொட்டின் நோக்கம் அல்லது ஒப்படைப்பு சார்ந்த பொருளை ‘-க்காக’ இயல்பாக வெளிப்படுத்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: இது சங்கீதத் தலைப்புகளில் வரும் தொழில்நுட்ப வகைப்பாட்டுச் சொல்; அதன் துல்லியப் பொருள் உறுதியற்றதால், ‘தியானப் பாடல்’ அல்லது ‘போதனைப் பாடல்’ என்று தீர்மானிக்காமல் ஒலிபெயர்க்கப்படுகிறது.
- source_word: לִבְנֵי
  choice: மகன்களுடைய
  rationale: இங்குள்ள ל ஆசிரியத்துவம், தொடர்பு, அர்ப்பணிப்பு அல்லது பாடுவோருக்கான ஒதுக்கீடு ஆகியவற்றைக் குறிக்கலாம். ‘மகன்களுடைய’ என்பது தலைப்பின் பரந்த தொடர்பைத் தக்கவைக்கிறது; ‘மகன்களுக்காக’ என்ற மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: קֹרַח
  choice: கோராகு
  rationale: எபிரெய தனிப்பெயர் நவீனத் தமிழில் தெளிவாக ஒலிபெயர்க்கப்படுகிறது; வேற்றுமைத் தொடரில் ‘கோராகின்’ என வருகிறது.
