translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான சங்கீதத் தலைப்பாக அமைக்கப்பட்டது. பொருள் உறுதியற்ற מַשְׂכִּיל ஒலிபெயர்க்கப்பட்டு, விளக்கம் அடிக்குறிப்பில் தரப்பட்டது. எல்லா அடிக்குறிப்பு குறியீடுகளும் அவை விளக்கும் சொற்றொடர்களுக்கு உடனே பின்னால் வைக்கப்பட்டுள்ளன.
