  text: בְּ/רֶ֤צַח בְּֽ/עַצְמוֹתַ֗/י חֵרְפ֥וּ/נִי צוֹרְרָ֑/י בְּ/אָמְרָ֥/ם אֵלַ֥/י כָּל הַ֝/יּ֗וֹם אַיֵּ֥ה אֱלֹהֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/010.yaml
  text: As with a shattering in my bones[a], my adversaries taunt me, saying to me all day long, “Where is your God?”
translation:
  language: ta
  text: என் எலும்புகளுக்குள் நொறுக்கும் வேதனைபோல்[a], என் எதிரிகள் நாள் முழுவதும் என்னை ஏளனம் செய்கிறார்கள்; “உன் கடவுள் எங்கே?” என்று என்னிடம் சொல்லிக்கொண்டே இருக்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் எலும்புகளுக்குள் கொலை நடந்ததுபோல், என் எதிரிகள் என்னைப் பழிக்கிறார்கள்.” இங்குள்ள எபிரெயப் படிமம் கடினமானது; அது கொல்லும் காயத்தையோ, உள்ளாழத்தில் ஏற்படும் நொறுக்கும் வேதனையையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶצַח
  choice: நொறுக்கப்படுவது போல
  rationale: רֶצַח பொதுவாகக் கொலை அல்லது கொல்லுதலைக் குறித்தாலும், ‘என் எலும்புகளுக்குள்’ என்ற கவித்துவச் சேர்க்கையில் ஆழமாக ஊடுருவும் கொடிய, நொறுக்கும் வேதனையை உருவகமாகச் சுட்டுகிறது. தமிழில் இயல்பாகவும் வன்மையான படிமத்தைத் தக்கவைத்தும் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: בְּעַצְמוֹתַי
  choice: என் எலும்புகளுக்குள்
  rationale: வேதனை உடலின் மிக ஆழம் வரை ஊடுருவுவதை எபிரெயப் படிமத்தோடு தக்கவைக்கிறது.
- source_word: חֵרְפוּנִי
  choice: என்னை ஏளனம் செய்து
  rationale: חרף என்பது பழித்தல், இகழ்தல், நிந்தித்தல் ஆகிய பொருள்களைக் கொண்டது. தொடர்ந்து சொல்லப்படும் ‘உன் கடவுள் எங்கே?’ என்ற பகைமையான கேலிக்கு ‘ஏளனம் செய்து’ இயல்பாகப் பொருந்துகிறது.
- source_word: צוֹרְרָי
  choice: என் எதிரிகள்
  rationale: சங்கீதக்காரருக்கு விரோதமாகச் செயல்படுவோரைக் குறிக்கும் தெளிவான, நவீனத் தமிழ் சொல்.
- source_word: בְּאָמְרָם אֵלַי
  choice: என்று என்னிடம் கேட்கிறார்கள்
  rationale: சொல்லின் திசையான ‘என்னிடம்’ என்பதையும், மேற்கோள் கேள்வியாக இருப்பதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது. ‘சொல்கிறார்கள்’ என்பதும் சாத்தியம்; கேள்வி வடிவத்தால் ‘கேட்கிறார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: தொடர்ச்சியாக அல்லது மீண்டும் மீண்டும் நிகழும் பகைமையான பேச்சின் நீடிப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: உன் கடவுள் எங்கே?
  rationale: கடவுளின் உதவி அல்லது இருப்பையே சவாலிடும் பகைவர்களின் நேரடியான கேள்வியை எந்த விளக்கமும் சேர்க்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: கடவுளைப் பற்றிய எதிரிகளின் சவால்
  choice: “உன் கடவுள் எங்கே?”
  alternative: “அப்படியானால் உன் கடவுள் எங்கே?”
  rationale: மூலத்தில் இல்லாத விளக்கச் சொல்லைச் சேர்க்காமல், தெய்வீக மறைவையும் சங்கீதக்காரரின் புலம்பலையும் சார்ந்த பதற்றம் தீர்க்கப்படாமல் விடப்படுகிறது.
- issue: בְּרֶצַח בְּעַצְמוֹתַי என்ற கடினமான படிமம்
  choice: என் எலும்புகளுக்குள் நொறுக்கப்படுவது போல
  alternative: என் எலும்புகளில் கொலைவலி இருப்பதுபோல்
  rationale: மூலத்தின் கொடிய வன்முறைப் படிமத்தைத் தக்கவைத்தபடியே தமிழில் புரியும்படி தருகிறது; எனினும் ‘கொலை/கொல்லுதல்’ என்ற நேரடியான பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவித்துவ நடையைக் கடைப்பிடிக்கிறது. ‘எலும்புகளுக்குள்’ என்ற உட்புற வேதனைப் படிமமும், எதிரிகளின் நேரடியான ஏளனக் கேள்வியும் பாதுகாக்கப்பட்டுள்ளன.
