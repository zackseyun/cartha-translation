revisions:
- from: என் எலும்புகளுக்குள் நொறுக்கப்படுவது போல[a], என் எதிரிகள் நாள் முழுவதும் என்னை ஏளனம் செய்து, “உன் கடவுள் எங்கே?” என்று என்னிடம் கேட்கிறார்கள்.
  to: என் எலும்புகளுக்குள் நொறுக்கும் வேதனைபோல்[a], என் எதிரிகள் நாள் முழுவதும் என்னை ஏளனம் செய்கிறார்கள்; “உன் கடவுள் எங்கே?” என்று என்னிடம் சொல்லிக்கொண்டே இருக்கிறார்கள்.
  rationale: The revision makes the opening image idiomatic Tamil without falsely resolving the disputed sense of בְּרֶצַח; the footnote retains the more literal ‘murder/slaying’ alternative and explains the uncertainty. It also renders the enemies’ continuing utterance as ‘saying’ rather than merely ‘asking,’ preserving the force of the Hebrew participial/temporal construction.
