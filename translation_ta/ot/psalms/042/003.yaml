  yaml_path: translation/ot/psalms/042/003.yaml
  text: My tears have been my bread day and night[a], while they say to me all day long, “Where is your God?”
translation:
  language: ta
  text: என் கண்ணீர்[a] இரவும் பகலும் எனக்கு அப்பமாக இருந்தது; நாள் முழுவதும் அவர்கள் என்னிடம், “உன் கடவுள் எங்கே?” என்று சொல்லிக்கொண்டிருந்தார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயில் நேரடியாக ‘என் கண்ணீர்த்துளி’ என ஒருமையில் உள்ளது; அந்த ஒருமை இங்கு கூட்டுப்பொருளில் எல்லாக் கண்ணீரையும் குறிக்கிறது.
