lexical_decisions:
- source_word: הָיְתָה לִּי
  choice: எனக்கு … இருந்தது
  rationale: היה + לְ என்ற அமைப்பு, ஒன்று பேசுபவருக்கு எவ்வாறு அமைந்தது அல்லது செயல்பட்டது என்பதைக் காட்டுகிறது. தமிழில் இயல்பாகவும் நிலைத்த அனுபவத்தைக் காக்கும் வகையிலும் இவ்வாறு மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: דִמְעָתִי
  choice: என் கண்ணீர்
  rationale: எபிரெயில் வடிவம் ஒருமையாக இருந்தாலும், இங்கு அது கூட்டுப்பொருளில் கண்ணீரைக் குறிக்கிறது. தமிழ் ‘கண்ணீர்’ இயல்பாகவே அந்தக் கூட்டுப்பொருளைத் தருகிறது.
- source_word: לֶחֶם
  choice: அப்பம்
  rationale: ‘உணவு’ என்று பொதுமைப்படுத்தாமல், கண்ணீரே அப்பமாகிவிட்டது என்ற மூலத்தின் உயிருள்ள உருவகத்தைப் பாதுகாக்கிறது.
- source_word: יוֹמָם וָלָיְלָה
  choice: இரவும் பகலும்
  rationale: தொடர்ச்சியான காலத்தை உணர்த்தும் இணைச்சொல். தமிழில் இயல்பான சொல்வரிசையான ‘இரவும் பகலும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בֶּאֱמֹר
  choice: சொல்லிக்கொண்டிருந்தார்கள்
  rationale: בְּ + வினையெச்சப் பெயர், கண்ணீர் அப்பமாக இருந்த அதே காலத்தில் தொடர்ந்து நிகழ்ந்த ஏளனப் பேச்சைக் காட்டுகிறது. தொடர்நிலையைத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵלַי
  choice: என்னிடம்
  rationale: பேச்சு பேசுபவரை நோக்கி வந்ததை நேரடியாகக் குறிக்கிறது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: நாள் நெடுகவும் மீண்டும் மீண்டும் அல்லது தொடர்ந்து நிகழ்ந்த செயலை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אַיֵּה
  choice: எங்கே?
  rationale: கடவுளின் இருப்பையோ உதவியையோ கேள்விக்குள்ளாக்கும் நேரடியான ஏளன வினாவை விளக்கிச் சேர்க்காமல் அப்படியே காக்கிறது.
- source_word: אֱלֹהֶיךָ
  choice: உன் கடவுள்
  rationale: இரண்டாம் நபர் ஒருமை உடைமை வடிவைத் துல்லியமாகக் காட்டுகிறது; இங்கு சங்கீதக்காரரின் கடவுளையே குறிக்கிறது.
theological_decisions:
- issue: ஏளனம் செய்பவர்களின் கேள்வியின் தன்மை
  choice: “உன் கடவுள் எங்கே?” என்ற நேரடியான கேள்வியாக மொழிபெயர்த்தல்
  alternative: “உன் கடவுளுக்கு என்ன ஆனது?” என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: மூல எபிரெய் நேரடியாக ‘உன் கடவுள் எங்கே?’ என்றே கேட்கிறது. கடவுள் காணப்படாதவர் போலத் தோன்றும் இறையியல் பதற்றத்தைத் தீர்த்துவிடாமல் மொழிபெயர்ப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியக்கூடியதாயும் கண்ணியமானதாயும் அமைக்கப்பட்டுள்ளது. ‘அப்பம்’ என்ற சொல் மூல உருவகத்தைப் பாதுகாக்கிறது; ‘கடவுள் எங்கே?’ என்ற கேள்வி விளக்கிச் சீராக்கப்படாமல் அதன் ஏளனமும் இறையியல் பதற்றமும் நீடிக்கச் செய்யப்பட்டுள்ளது.
