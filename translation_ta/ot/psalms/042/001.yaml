  rationale: நீரை விரும்பி அதனை நோக்கும் ஏக்கத்தைத் தமிழில் இயல்பாகத் தெரிவிக்க עַל தனி இடைச்சொல்லாக அல்லாமல் ‘நாடி’ என்ற வினையெச்சத்தால் வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: אֲפִיקֵי מָיִם
  choice: நீரோடைகள்
  rationale: אֲפִיקִים என்பது நீர் பாயும் வாய்க்கால்கள், படுகைகள் அல்லது ஓடைகளைக் குறிக்கலாம். ‘நீரோடைகள்’ பன்மை உருவகத்தைத் தெளிவாகவும் இயல்பாகவும் காக்கிறது.
- source_word: כֵּן
  choice: அதுபோல ... உம்
