lexical_decisions:
- source_word: כְּ/אַיָּל
  choice: மான் ... போல
  rationale: אַיָּל என்பது மானை, சில சூழல்களில் குறிப்பாக ஆண் மானைக் குறிக்கலாம். பாலினத்தைத் தேவையின்றி வரையறுக்காமல், ஒப்புமையை இயல்பான நவீனத் தமிழில் எடுத்துரைக்க ‘மான் ... போல’ என மொழிபெயர்க்கப்பட்டது.
- source_word: תַּעֲרֹג
  choice: நாடி ஏங்கித் தவிக்கிறது
  rationale: ערג தீவிரமான ஏக்கத்தையும் தாகத்தால் தவிப்பதைப் போன்ற ஏக்கத்தையும் உணர்த்துகிறது. வெறும் ‘ஏங்குகிறது’ என்பதைவிட ‘நாடி ஏங்கித் தவிக்கிறது’ அந்தத் தீவிரத்தையும் இலக்கை நோக்கிய இயக்கத்தையும் இயல்பாக வெளிப்படுத்துகிறது; இரண்டு அரையடிகளிலும் ஒரே சொல்லமைப்பு பயன்படுத்தப்பட்டு எபிரெய இணைநிலை காக்கப்பட்டுள்ளது.
- source_word: עַל
