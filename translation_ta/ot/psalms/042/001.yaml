- source_word: אֱלֹהִים
  choice: இறைவனே
  rationale: இங்கு நேரடி அழைப்பு உள்ளது. ‘இறைவனே’ என்பது மரியாதையும் ஜெபக் கவிதைக்குரிய கண்ணியமும் கொண்ட இயல்பான தமிழ் விளிப்பு.
theological_decisions:
- issue: נַפְשִׁי என்பதன் மானுடவியல் நுண்பொருள்
  choice: என் உயிர்
  alternative: என் ஆத்துமா; என் உள்ளம்; நானே
  rationale: எபிரெயச் சொல் தனியே உடல்–ஆத்துமா இருமையை நிறுவுவதில்லை; அது உயிரையோ முழு தன்னையோ உள்ளார்ந்த இருப்பையோ குறிக்கக்கூடும். ஆகவே பரந்த பொருளைத் திறந்தவாறே வைத்திருக்க ‘என் உயிர்’ தேர்ந்தெடுக்கப்பட்டு, மாற்றுப் பொருட்கள் அடிக்குறிப்பில் தரப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘உம்மை’ என்ற மரியாதை ஒருமையும் ‘இறைவனே’ என்ற விளிப்பும் ஜெபத்தின் நேரடி உரையாடலைக் காக்கின்றன. மூலத்தில் மீண்டும் வரும் תַּעֲרֹג இரு பகுதிகளிலும் ஒரே தமிழ்ச் சொல்லமைப்பால் பிரதிபலிக்கப்பட்டுள்ளது.
