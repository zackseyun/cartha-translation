    text: எபிரெயத்தில் இங்கு தேவனுடைய தனிப்பட்ட பெயரான יהוה (YHWH) உள்ளது; அது ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: தேவப் பெயரின் மூல வடிவத்தையும் மொழிபெயர்ப்பு முறையையும் தெளிவுபடுத்துதல்.
lexical_decisions:
- source_word: לְסַפֵּר
  choice: அறிவிப்பதற்காக
  rationale: לְ முன்னொட்டுடன் வந்த பியேல் வினையெச்சம் இச்சூழலில் நோக்கம் அல்லது விளைவைக் குறிக்கிறது. ספּר என்பது சொல்லுதல் அல்லது விவரித்தல் என்றும் பொருள்படலாம்; ஆனால் தேவனுடைய பெயரும் புகழும் பொதுவாகப் பிரகடனப்படுத்தப்படுவதை இங்கு ‘அறிவிக்க’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּצִיּוֹן
  choice: சீயோனில்
  rationale: இடப்பெயருடன் வரும் בְּ இயல்பாக ‘-இல்’ என மொழிபெயர்க்கப்படுகிறது; צִיּוֹן என்பதன் வழக்கமான தமிழ் வடிவம் ‘சீயோன்’.
- source_word: שֵׁם
  choice: பெயர்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் ‘பெயர்’. இங்கு அது தேவனுடைய வெளிப்படுத்தப்பட்ட அடையாளத்தையும் நற்பெயரையும் உள்ளடக்கக்கூடும்; அந்தச் செறிவை ‘பெயர்’ தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட தேவப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், நவீனத் தமிழில் பரவலாக ஏற்றுக்கொள்ளப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என வழங்குகிறது.
- source_word: וּתְהִלָּתוֹ
  choice: அவருடைய புகழையும்
  rationale: תְּהִלָּה என்பது ‘புகழ்/துதி’; மூன்றாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதி ‘அவருடைய’ என வழங்கப்படுகிறது. இணையான இரு செயப்படுபொருட்களையும் இயல்பான தமிழில் இணைக்க ‘-ஐயும்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: בִּירוּשָׁלִָם
  choice: எருசலேமில்
  rationale: בִּ இடத்தைக் குறிக்கும் ‘-இல்’ என்றும், நகரப்பெயர் வழக்கமான தமிழ் வடிவமான ‘எருசலேம்’ என்றும் வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה என்ற தேவப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட தேவப் பெயரே உள்ளது. பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் அதை ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது; ‘யாவே’ என்பது தற்போதைய ஆய்வில் பொதுவாக ஏற்றுக்கொள்ளப்படும் உச்சரிப்பைத் தமிழில் பிரதிபலிக்கிறது.
- issue: תְהִלָּתוֹ என்பதிலுள்ள பொருள் நுணுக்கம்
  choice: அவருடைய புகழ்
  alternative: அவருக்குரிய துதி
  rationale: எபிரெய உரை ‘அவருடைய புகழ்’ என்றும் ‘அவருக்குச் செலுத்தப்படும் துதி’ என்றும் உணர்த்தக்கூடும். பிரதான உரையில் நேரடியான உரிமை அமைப்பை வைத்திருப்பதால் இந்த நுணுக்கத்தை ஒரே விதமாகத் தீர்மானிக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, பொதுத் தரத் தமிழில் மரியாதையும் கவிதைநடையின் சுருக்கமும் காக்கப்பட்டுள்ளன. இது முந்தைய வசனத்தைத் தொடரும் நோக்கக் கூற்று என்பதால் ‘அறிவிப்பதற்காக’ என்ற வினையெச்ச வடிவம் பயன்படுத்தப்பட்டுள்ளது; ஒரே எபிரெய வினை ‘பெயர்’ மற்றும் ‘புகழ்’ ஆகிய இரண்டையும் ஆளுவது தமிழிலும் ஒரே வினையால் பிரதிபலிக்கப்பட்டுள்ளது.
