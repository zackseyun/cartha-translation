  text: to declare the name of Yahweh in Zion[a], and his praise in Jerusalem,
translation:
  language: ta
  text: சீயோனில் யாவேயின் பெயரையும்[a] எருசலேமில் அவருடைய புகழையும் அறிவிப்பதற்காக.
  philosophy: optimal-equivalence
