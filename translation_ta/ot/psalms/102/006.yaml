  text: דָּ֭מִיתִי לִ/קְאַ֣ת מִדְבָּ֑ר הָ֝יִ֗יתִי כְּ/כ֣וֹס חֳרָבֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/006.yaml
  text: I am like a desert owl[b][a]; I have become like an owl among the ruins.
translation:
  language: ta
  text: நான் வனாந்தரத்துப் பறவையைப் போல இருக்கிறேன்[a]; பாழடைந்த இடங்களிலுள்ள கோட்டானைப் போல ஆகியிருக்கிறேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயப் பறவைப்பெயரான קָאַת எதைக் குறிக்கிறது என்பது உறுதியில்லை; இதை ‘வனாந்தரத்து ஆந்தை’ அல்லது ‘வனாந்தரத்துக் கூழைக்கடா’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: כּוֹס குறிக்கும் துல்லியமான பறவையினம் உறுதியில்லை; ‘பாழடைந்த இடங்களிலுள்ள சிறிய ஆந்தை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּמִיתִי
  choice: போல இருக்கிறேன்
  rationale: דמה என்பதன் கால் வடிவம் இங்கு ஒப்புமையைக் குறிக்கிறது. எபிரெய நிறைவுநிலையின் நிலைசார் நுணுக்கத்தை இயல்பான நிகழ்காலத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: לִקְאַת
  choice: வனாந்தரத்துப் பறவை
  rationale: קָאַת குறிக்கும் பறவையினம் உறுதியற்றது. ஆந்தை அல்லது கூழைக்கடா என்று குறிப்பிட்டு ambiguity-ஐத் தீர்த்துவிடாமல், பாழ்நிலத்தில் வாழும் பறவை என்ற சூழல்சார் பொதுப்பெயர் முதன்மை உரையில் வைக்கப்படுகிறது.
- source_word: מִדְבָּר
  choice: வனாந்தரம்
  rationale: מִדְבָּר என்பது பயிரிடப்படாத வறண்ட வெளிநிலத்தைக் குறிக்கிறது; ‘வனாந்தரம்’ கவிதைநயம் கொண்டதாயும் நவீன வாசகருக்குப் புரியத்தக்கதாயும் உள்ளது.
- source_word: הָיִיתִי
  choice: ஆகியிருக்கிறேன்
  rationale: היה என்பதன் நிறைவுநிலை இங்கு ஏற்பட்டுவிட்ட தற்போதைய நிலையைக் குறிக்கக்கூடும்; ‘ஆகியிருக்கிறேன்’ அந்த விளைவுநிலை நுணுக்கத்தைப் பாதுகாக்கிறது.
- source_word: כְּכוֹס
  choice: கோட்டானைப் போல
  rationale: כּוֹס என்பது இங்கு ‘கிண்ணம்’ அல்ல, உறுதியாக அடையாளம் காணப்படாத ஓர் ஆந்தைவகைப் பறவை. ‘கோட்டான்’ தனிமையும் இரவுப்பறவைப் படிமமும் இயல்பாகத் தருகிறது; இனத்தைக் குறித்த உறுதியின்மை அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: חֳרָבוֹת
  choice: பாழடைந்த இடங்களிலுள்ள
  rationale: இப்பன்மைச் சொல் இடிபாடுகள் அல்லது பாழான இடங்களைக் குறிக்கிறது. ‘பாழடைந்த இடங்கள்’ இரு சாத்தியங்களையும் இயல்பான தமிழில் உள்ளடக்குகிறது.
