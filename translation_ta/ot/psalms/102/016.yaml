id: PSA.102.16
reference: Psalms 102:16
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּֽי בָנָ֣ה יְהוָ֣ה צִיּ֑וֹן נִ֝רְאָ֗ה בִּ/כְבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/016.yaml
  text: For Yahweh has built Zion[a]; he has appeared in his glory.
translation:
  language: ta
  text: 'ஏனெனில் யாவே சீயோனைக் கட்டியிருக்கிறார்;

    அவர் தமது மகிமையில் தோன்றியிருக்கிறார்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் தமது மகிமையில் காணப்படுகிறார்,” அல்லது “அவர் தமது மகிமையில் காணப்பட்டிருக்கிறார்.” எபிரெய வினைச்சொல், அவர் தோன்றினார் என்றும் அவர் காணப்பட்டார் என்றும் பொருள்படக்கூடும்.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள கூற்றுகளுக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இருப்பதால், அதன் தொடர்பாற்றலை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: בָנָה
  choice: கட்டியிருக்கிறார்
  rationale: வினையின் qatal வடிவை நிறைவுற்ற செயலாகக் காட்டுகிறது. எபிரெயத்தில் மறுபடியும் கட்டுதல் வெளிப்படையாகக் கூறப்படாததால், ‘மீண்டும் கட்டியிருக்கிறார்’ என்று சேர்க்கப்படவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளப்படும் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: צִיּוֹן
  choice: சீயோன்
  rationale: எபிரெய மூலத்தில் உள்ள இடப்பெயரைப் பொதுமைப்படுத்தாமல் ஒலிபெயர்க்கிறது.
- source_word: נִרְאָה
  choice: தோன்றியிருக்கிறார்
  rationale: ראה என்பதன் Niphal வடிவம் ‘தோன்றுதல்’ அல்லது ‘காணப்படுதல்’ என்று பொருள்படலாம். முதன்மை உரையில் இறைவெளிப்பாட்டை இயல்பாக வெளிப்படுத்தும் ‘தோன்றியிருக்கிறார்’ தேர்ந்தெடுக்கப்பட்டு, மற்ற சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: בִּכְבוֹדוֹ
  choice: தமது மகிமையில்
  rationale: כָּבוֹד என்பதன் ‘மகிமை’ என்ற நேரடியான பொருளையும், யாவே தோன்றும் விதம் அல்லது சூழலைக் குறிக்கும் בְּ முன்னிடைச்சொல்லையும் இயல்பான தமிழில் தருகிறது. மரியாதை ஒருமைக்கேற்ப ‘தமது’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: נִרְאָה בִּכְבוֹדוֹ என்ற இறைவெளிப்பாட்டுக் கூற்றின் பொருள்
  choice: அவர் தமது மகிமையில் தோன்றியிருக்கிறார்
  alternative: அவர் தமது மகிமையில் காணப்படுகிறார் / காணப்பட்டிருக்கிறார்
  rationale: Niphal வடிவம் தாமாக வெளிப்படுதலையும் பிறரால் காணப்படுதலையும் அனுமதிக்கிறது. முதன்மை உரை ‘தோன்றுதல்’ என்ற இயல்பான வாசிப்பைத் தருகிறது; எபிரெயத்தின் உண்மையான இலக்கணப் பன்முகத்தன்மை அடிக்குறிப்பில் விடப்படுகிறது.
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் நேரடியாக உள்ள தனிப்பெயரைப் பட்டப்பெயராக மாற்றாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியமும் சாதாரண வாசகருக்கான தெளிவும் பேணப்பட்டுள்ளன. இரண்டு இணையான அடிகளாக அமைத்து, இறைத் திருப்பெயருக்கு ‘யாவே’ என்றும் சீயோனின் பெயருக்கு நேரடி ஒலிபெயர்ப்பும் பயன்படுத்தப்பட்டுள்ளன.
