review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the causal conjunction, God's servants, the feminine personification of Zion, and their affectionate regard for both her stones and dust. However, “அவளுடைய கற்கள்மேல் பிரியம் வைத்திருக்கிறார்கள்” is not the most idiomatic Tamil construction for רָצוּ אֶת (“take pleasure in/delight in [direct object]”); it can sound spatially oriented (“upon the stones”).
  naturalness: “அவளுடைய கற்களையே விரும்புகிறார்கள்” is natural modern Tamil and clearly marks the stones themselves as the object of affectionate delight. “அவளுடைய புழுதிக்குப் பரிவு காட்டுகிறார்கள்” remains natural and suitably poetic.
  terminology: “அடியார்கள்” is appropriate in psalmic address to God. “புழுதி” preserves the concrete image of עָפָר, and “அவளுடைய” appropriately retains the Hebrew feminine personification without forcing an unnatural grammatical gender elsewhere.
  issues:
  - severity: low
    issue: The phrase “கற்கள்மேல் பிரியம் வைத்திருக்கிறார்கள்” is awkward and may imply location rather than the object of delight.
    rationale: The Hebrew has a direct object, אֶת אֲבָנֶיהָ. Recasting it as “கற்களையே விரும்புகிறார்கள்” expresses the object relation directly and idiomatically in Tamil.
  revised_text: ஏனெனில், உமது அடியார்கள் அவளுடைய கற்களையே விரும்புகிறார்கள்; அவளுடைய புழுதிக்குப் பரிவு காட்டுகிறார்கள்.[a]
