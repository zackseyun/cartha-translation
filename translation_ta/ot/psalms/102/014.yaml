  text: For your servants delight in her stones and show favor to her dust[a].
translation:
  language: ta
  text: ஏனெனில், உமது அடியார்கள் அவளுடைய கற்களையே விரும்புகிறார்கள்; அவளுடைய புழுதிக்குப் பரிவு காட்டுகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவளுடைய கற்களில் மகிழ்கிறார்கள்; அவளுடைய புழுதிக்கு இரங்குகிறார்கள்.”'
    reason: ரָצָה மற்றும் חָנַן ஆகிய வினைச்சொற்களின் முறையே மகிழ்ச்சி/விருப்பம் மற்றும் இரக்கம்/அருள் சார்ந்த மாற்றுப் பொருள் நிழல்களைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்திலுள்ள வேண்டுகோளுக்கும் நம்பிக்கைக்கும் காரணத்தை அறிமுகப்படுத்தும் காரண இணைப்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: רָצוּ
  choice: பிரியம் வைத்திருக்கிறார்கள்
  rationale: ציון மீது அவளுடைய மக்களுக்கு உள்ள ஆழ்ந்த பற்றையும், அவளுடைய கற்களைக்கூட அவர்கள் விரும்புவதையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘ஆதரிக்கிறார்கள்’ என்ற பொருளைவிட இங்கு உணர்வுப்பூர்வமான விருப்பமே முன்னிலையில் உள்ளது.
- source_word: עֲבָדֶיךָ
  choice: உமது அடியார்கள்
  rationale: கடவுளுக்குச் சேவை செய்து அவருக்குரியவர்களாக இருப்பவர்களைச் சங்கீத நடைக்கு ஏற்ற, இயல்பான மற்றும் கண்ணியமான தமிழில் குறிக்கிறது.
- source_word: אֶת אֲבָנֶיהָ
  choice: அவளுடைய கற்கள்மேல்
  rationale: எபிரேயப் பெண்பால் பின்னொட்டு சீயோனைப் பெண்ணாக உருவகப்படுத்துவதால், ‘அதன்’ என்று உயிரற்றதாக்காமல் ‘அவளுடைய’ என்று அந்தக் கவிதை உருவகத்தைப் பேணுகிறது.
- source_word: וְאֶת עֲפָרָהּ
  choice: அவளுடைய புழுதிக்கு
  rationale: עָפָר என்பதன் நேரடிப் படிமமான ‘புழுதி’யைப் பேணுகிறது; சூழலில் அது பாழடைந்த நகரின் தூசி அல்லது இடிபாட்டுத் துகள்களைக் குறிக்கலாம்.
- source_word: יְחֹנֵנוּ
  choice: பரிவு காட்டுகிறார்கள்
  rationale: חנן இங்கு அருள், இரக்கம், கனிவான ஆதரவு ஆகிய பொருள் நிழல்களைக் கொண்டுள்ளது. உயிரற்ற ‘புழுதி’யுடனும் தமிழில் இயல்பாக அமைந்து, சீயோனின் எஞ்சியவற்றின்மீதான அன்பை வெளிப்படுத்துவதால் ‘பரிவு காட்டுகிறார்கள்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: சீயோன்/எருசலேமின் பெண்பால் உருவகப்படுத்தல்
  choice: ‘அவளுடைய’ என்று பெண்பால் குறிப்பைப் பேணுதல்
  alternative: ‘அதனுடைய’ என்று உயிரற்ற ஒன்றாகக் குறிப்பிடுதல்
  rationale: மூல எபிரேயத்தில் நகரைக் குறிக்கும் பெண்பால் பின்னொட்டுகள் உள்ளன. அவற்றைப் பேணுவது சங்கீதத்தின் கவிதை உருவகத்தையும் சீயோனுடனான உறவுப் பிணைப்பையும் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்துக்குரிய கண்ணியமான கவிதை நடையுடன் மொழிபெயர்க்கப்பட்டது. ‘அடியார்கள்’ வழிபாட்டு சூழலுக்கு இயல்பானது; ‘புழுதி’ மூலப் படிமத்தைப் பேணுகிறது. பெண்பால் உருவகம் திட்டமிட்டே தக்கவைக்கப்பட்டுள்ளது.
