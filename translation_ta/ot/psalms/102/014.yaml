- from: ஏனெனில், உமது அடியார்கள் அவளுடைய கற்கள்மேல் பிரியம் வைத்திருக்கிறார்கள்; அவளுடைய புழுதிக்குப் பரிவு காட்டுகிறார்கள்.[a]
  to: ஏனெனில், உமது அடியார்கள் அவளுடைய கற்களையே விரும்புகிறார்கள்; அவளுடைய புழுதிக்குப் பரிவு காட்டுகிறார்கள்.[a]
