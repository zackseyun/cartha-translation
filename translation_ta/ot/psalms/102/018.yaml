source:
  edition: WLC
  text: תִּכָּ֣תֶב זֹ֭את לְ/ד֣וֹר אַחֲר֑וֹן וְ/עַ֥ם נִ֝בְרָ֗א יְהַלֶּל יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/018.yaml
  text: This will be written for a generation to come[a], and a people yet to be created will praise Yah.
translation:
  language: ta
  text: இது வருங்காலத் தலைமுறைக்காக எழுதப்படும்; இன்னும் படைக்கப்படவிருக்கும் மக்கள் யாவைப்[a] புகழ்வார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யா” என்பது தெய்வீகப் பெயரின் குறுகிய கவிதை வடிவம்; பல மொழிபெயர்ப்புகள் இதை “ஆண்டவர்” என்று வழங்குகின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכָּתֶב
  choice: எழுதப்படும்
  rationale: כתב என்பதன் நிஃபால் நிறைவுறா வடிவம்; சூழலில் வருங்காலத்திற்காகப் பதிவு செய்யப்படுவதைச் சுட்டுவதால் இயல்பான எதிர்காலச் செயலப்பாட்டு வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: זֹאת
  choice: இது
  rationale: முன்னுள்ள சாட்சி அல்லது விண்ணப்பத்தை மொத்தமாகச் சுட்டுகிறது; விளக்கப் பெயர்ச்சொல் ஒன்றைச் சேர்க்காமல் எபிரெயச் சுட்டுப்பெயரின் திறந்த தன்மையைப் பேணுகிறது.
- source_word: לְדוֹר אַחֲרוֹן
  choice: வருங்காலத் தலைமுறைக்காக
  rationale: דור என்பது ‘தலைமுறை’; אחרון இங்கு இறுதிக்காலத் தலைமுறை என்று கட்டாயப்படுத்தாமல், பின்னர் வரவிருக்கும் தலைமுறை என்ற காலப்பொருளில் உள்ளது.
- source_word: וְעַם נִבְרָא
  choice: இன்னும் படைக்கப்படவிருக்கும் மக்கள்
  rationale: עם என்பதற்கு ‘மக்கள்’; ברא என்பதன் செயலப்பாட்டு எச்சவடிவம், இணையான வருங்காலச் சூழலில் இன்னும் உருவாகாத மக்களைச் சுட்டுகிறது.
- source_word: יְהַלֶּל
  choice: புகழ்வார்கள்
  rationale: הלל என்பதன் பியேல் நிறைவுறா வடிவம்; வருங்கால நோக்குடைய இரண்டாம் கூறுடன் பொருந்தும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: יָהּ
  choice: யா
  rationale: இது יהוה என்ற முழு வடிவமல்ல, தெய்வீகப் பெயரின் குறுகிய கவிதை வடிவம்; அந்தச் சொல்வேறுபாட்டைப் பேண ‘யா’ என ஒலிபெயர்க்கப்பட்டது.
theological_decisions:
- issue: יָהּ என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யா
  alternative: ஆண்டவர்
  rationale: மூலத்தில் יהוה அல்ல, அதன் குறுகிய கவிதை வடிவமான יָהּ வருகிறது. ‘ஆண்டவர்’ எனச் சீராக்குவது இந்த உண்மையான சொல்வேறுபாட்டை மறைக்கும்; ஆகவே முதன்மை உரையில் ‘யா’ பேணப்படுகிறது.
- issue: אַחֲרוֹן என்பதன் காலப்பொருள்
  choice: வருங்கால
  alternative: கடைசித் தலைமுறை
  rationale: இச்சூழலில் அச்சொல் பின்னர் வரும் தலைமுறையைக் குறிக்க இயலும்; குறிப்பிட்ட இறுதிக்கால விளக்கத்தை உரைக்குள் இறக்காமல் பொதுவான காலநோக்கை வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ். ‘இது’ என்ற சுட்டுப்பெயர் மூலத்தின் விளக்கமிடப்படாத தன்மையைப் பேணுகிறது. ஒருமையான עם என்பதற்குத் தமிழில் இயல்பான கூட்டுப்பெயரான ‘மக்கள்’ பயன்படுத்தப்பட்டதால் வினை பன்மையில் அமைந்துள்ளது.
