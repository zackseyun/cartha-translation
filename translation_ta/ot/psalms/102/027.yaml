revisions:
- from: ஆனால் நீரோ என்றும் ஒரேவராய் இருக்கிறீர்[a]; உமது ஆண்டுகள் முடிவடையாது.
  to: ஆனால் நீரோ மாறாதவராய் இருக்கிறீர்[a]; உமது ஆண்டுகள் முடிவடையாது.
  rationale: The revision preserves the Hebrew idiom’s meaning of enduring, unchanged identity while avoiding the possible Tamil ambiguity of ‘ஒரேவராய்.’ The contrast and the poetic assertion of unending years remain intact.
