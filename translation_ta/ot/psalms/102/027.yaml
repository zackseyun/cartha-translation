    text: எபிரெயத்தில் சொல்லுக்கு நெருக்கமாக, ‘நீர் அவரே.’ இது ‘நீர் அதே நிலையில் இருக்கிறீர்’ அல்லது ‘நீர் மாறாமல் நிலைத்திருக்கிறீர்’ என்ற பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew idiom’s meaning of enduring, unchanged identity while avoiding the possible Tamil ambiguity of ‘ஒரேவராய்.’ The contrast and the poetic assertion of unending years remain intact.
