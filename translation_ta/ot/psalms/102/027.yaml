source:
  edition: WLC
  text: וְ/אַתָּה ה֑וּא וּ֝/שְׁנוֹתֶ֗י/ךָ לֹ֣א יִתָּֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/027.yaml
  text: But you are the same[a], and your years will not come to an end.
translation:
  language: ta
  text: ஆனால் நீரோ மாறாதவராய் இருக்கிறீர்[a]; உமது ஆண்டுகள் முடிவடையாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் சொல்லுக்கு நெருக்கமாக, ‘நீர் அவரே.’ இது ‘நீர் அதே நிலையில் இருக்கிறீர்’ அல்லது ‘நீர் மாறாமல் நிலைத்திருக்கிறீர்’ என்ற பொருளுடைய மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: ஆனால் நீரோ
  rationale: முந்தைய வசனத்தில் படைப்புகள் அழிந்து மாறுவதற்கும் கடவுள் நிலைத்திருப்பதற்கும் இடையிலான வேறுபாட்டை இணைப்புச் சொல்லும் தனிப்பட்ட சுட்டுப்பெயரும் வலியுறுத்துகின்றன; ‘ஆனால் நீரோ’ என்பது அந்த எதிர்மறை வேறுபாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הוּא
  choice: என்றும் ஒரேவராய் இருக்கிறீர்
  rationale: சொல்லுக்கு நெருக்கமாக ‘நீர் அவரே’ என வரும் எபிரெயச் சொற்றொடர், மாறாமல் அதே அடையாளத்துடன் நிலைத்திருப்பதை இச்சூழலில் குறிக்கிறது. ‘என்றும் ஒரேவராய் இருக்கிறீர்’ என்பது அந்தப் பொருளை இயல்பான தமிழில் தருகிறது; ‘என்றும்’ என்பது சூழலிலுள்ள தொடர்ந்த நிலைப்பாட்டை வெளிப்படுத்துகிறது.
- source_word: וּ/שְׁנוֹתֶיךָ
  choice: உமது ஆண்டுகள்
  rationale: שָׁנָה என்பதன் பன்மையும் இரண்டாம் நபர் ஆண்பால் ஒருமை உரிமை விகுதியும் நேரடியாக ‘உமது ஆண்டுகள்’ எனப் பொருள்படுகின்றன.
- source_word: לֹא
  choice: —ஆது
  rationale: பின்வரும் நிறைவுறாத வினையை மறுத்து, இங்கு எதிர்காலத்திலும் முடிவு ஏற்படாது என்பதைத் தமிழில் இயல்பாகக் காட்டுகிறது.
- source_word: יִתָּמּוּ
  choice: முடிவடையாது
  rationale: תמם என்பதன் இவ்வடிவம் ‘முடிவுக்கு வருதல், நிறைவுறுதல்’ என்று பொருள்படும். ‘முடிவடையாது’ என்பது முடிவற்ற காலநீடிப்பைத் தெளிவாகவும் சுருக்கமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: ‘நீர் அவரே’ என்ற எபிரெய மரபுத்தொடரும் கடவுளின் மாறாத நிலையும்
  choice: என்றும் ஒரேவராய் இருக்கிறீர்
  alternative: நீர் அவரே; நீர் மாறாமல் இருக்கிறீர்
  rationale: இம்மரபுத்தொடர் மாறிக்கொண்டிருக்கும் படைப்புக்கு எதிராகக் கடவுளின் தொடரும் அதே அடையாளத்தை வலியுறுத்துகிறது. தேர்ந்த மொழிபெயர்ப்பு அந்தத் தெய்வவியல் உட்பொருளைத் தெரிவிக்கிறது; அதேவேளையில் உரையில் இல்லாத தத்துவச் சொற்களைச் சேர்க்கவில்லை. சொல்லுக்கு நெருக்கமான வடிவம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனச் செந்தமிழ் நடையில், கடவுளை மரியாதைப் பன்மையில் குறிக்கும் ‘நீர்/உமது/இருக்கிறீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. கவிதைநயத்தையும் சாதாரண வாசகருக்கான தெளிவையும் இணைக்கும் சுருக்கமான வாக்கியம்.
