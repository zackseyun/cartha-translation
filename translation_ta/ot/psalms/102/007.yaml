  yaml_path: translation/ot/psalms/102/007.yaml
  text: I lie awake and am like a solitary bird on a rooftop[a].
translation:
  language: ta
  text: 'நான் தூக்கமின்றி விழித்திருக்கிறேன்;

    கூரைமேல் தனித்திருக்கும் ஒரு பறவையைப்போல் இருக்கிறேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘கூரைமேல் தனித்திருக்கும் ஒரு சிட்டுக்குருவியைப்போல்.’ எபிரெயச் சொல் பொதுவாகப் ‘பறவை’ எனப் பொருள்படும்; ‘சிட்டுக்குருவி’ என்பது மரபுவழியாக வழங்கப்படும் இன்னும் குறிப்பான மொழிபெயர்ப்பு.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקַדְתִּי
  choice: நான் தூக்கமின்றி விழித்திருக்கிறேன்
  rationale: இந்தப் புலம்பல் சூழலில் வினைச்சொல் காவல் காப்பதைவிட உறக்கமின்றி விழித்திருப்பதைக் குறிக்கிறது. இயல்பான தமிழில் அந்த அனுபவத்தைத் தெளிவாக வெளிப்படுத்த இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: וָאֶהְיֶה
  choice: இருக்கிறேன்
  rationale: முந்தைய கூற்றைத் தொடர்ந்து சங்கீதக்காரரின் தற்போதைய கவிதைநிலையை விவரிப்பதால் நிகழ்கால வடிவம் இயல்பாக உள்ளது.
- source_word: כְּצִפּוֹר
  choice: ஒரு பறவையைப்போல்
  rationale: צִפּוֹר என்பது பொதுவாகப் பறவையைக் குறிக்கும் சொல்; கட்டாயமாகச் சிட்டுக்குருவியையே குறிக்காது. ஆகவே மூலச்சொல்லின் பொருள் அகலம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- source_word: בּוֹדֵד
  choice: தனித்திருக்கும்
  rationale: இந்தச் சொல் தனியாக அல்லது பிரிந்திருக்கும் நிலையைக் குறிக்கிறது. ‘தனித்திருக்கும்’ என்பது ‘தனிமையில் வாடும்’ போன்ற உணர்ச்சியை மூலத்தில் இருப்பதைவிட அதிகமாகச் சேர்க்காமல் கவித்துவப் படிமத்தை வழங்குகிறது.
- source_word: עַל גָּג
  choice: கூரைமேல்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் படிமம் ‘கூரையின்மேல்’ என்பதாகும். ‘கூரைமேல்’ என்பது சுருக்கமான, இயல்பான நவீனத் தமிழ் வடிவம்.
