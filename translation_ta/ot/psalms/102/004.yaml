  text: My heart is struck like grass and withered[c][b][a], for I forget to eat my bread.
translation:
  language: ta
  text: என் இதயம் அடிபட்டுப் புல்லைப்போல் வாடிவிட்டது[c]; ஏனெனில் என் அப்பத்தை[b] உண்ண மறந்துவிட்டேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உண்ண மறந்துவிடுகிறேன்.’ எபிரேய நிறைவுற்ற வினைவடிவத்தை, தொடர்ந்து நிலவும் துயரத்தை விவரிக்கும் நிகழ்காலமாகவோ, நிகழ்ந்து முடிந்து தற்போதும் விளைவுள்ள செயலாகவோ மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘என் அப்பம்’ என்பது பொதுவாக ‘என் உணவு’ என்றும் பொருள்படலாம்.
    reason: lexical_alternative
