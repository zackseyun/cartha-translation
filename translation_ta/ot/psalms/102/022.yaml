  text: when peoples gather together[a], and kingdoms[c][b], to serve Yahweh—
translation:
  language: ta
  text: யாவேக்குப் பணிசெய்வதற்காக[b] மக்களினங்களும் அரசுகளும் ஒன்றுகூடும்போது[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஒன்றுகூட்டப்படும்போது” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வடிவம் ஒன்றுகூடுதல் நிகழ்வைச் சுட்டுகிறது, அதைச் செயப்பாட்டு வடிவிலும் கூறலாம்.
    reason: lexical_alternative
  - marker: b
    text: கடவுளைப் பொருளாகக் கொண்டு வரும் “பணிசெய்” என்பது “வழிபடு” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הִקָּבֵץ
  choice: ஒன்றுகூடும்போது
  rationale: ב plus Niphal infinitive construct expresses the time of gathering. The Tamil temporal form is natural and conveys the event without forcing an explicit agent; the possible passive nuance is noted.
- source_word: עַמִּים
  choice: மக்களினங்கள்
  rationale: The plural denotes distinct peoples or ethnic collectivities; ‘மக்களினங்கள்’ preserves that corporate plurality without reducing it to modern nation-states.
- source_word: יַחְדָּו
  choice: ஒன்று- (ஒன்றுகூடு)
  rationale: The idea ‘together’ is naturally carried by the Tamil compound verb ‘ஒன்றுகூடு’, avoiding a redundant separate adverb.
- source_word: וּ/מַמְלָכוֹת
  choice: அரசுகளும்
  rationale: This preserves the coordinated plural ‘and kingdoms’ and joins it naturally with ‘மக்களினங்களும்’ as the gathering parties.
- source_word: לַ/עֲבֹד
  choice: பணிசெய்வதற்காக
  rationale: The infinitive expresses the purpose of the gathering. ‘பணிசெய்’ retains the broad sense of serving, while its worship sense with God as object is retained in a footnote.
- source_word: אֶת יְהוָה
  choice: யாவேக்கு
  rationale: The divine name is transliterated as ‘யாவே’; Tamil dative marking naturally identifies the one served.
theological_decisions:
- issue: Rendering the divine name יְהוָה
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: The source directly uses the covenant name, so transliteration preserves it rather than replacing it with a title.
- issue: Whether עבד should be narrowed to worship
  choice: பணிசெய்
  alternative: வழிபடு
  rationale: The Hebrew verb has the broader sense ‘serve,’ though service to God can include worship. The main text keeps the breadth and the footnote records the contextual alternative.
- issue: Voice of the gathering verb
  choice: ஒன்றுகூடும்போது
  alternative: ஒன்றுகூட்டப்படும்போது
  rationale: The Niphal can be represented with passive force, but idiomatic Tamil permits an intransitive event expression without specifying agency. The alternative is noted rather than used to resolve the ambiguity.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டது. தொடர்ச்சியான சங்கீத வாக்கியத்தின் பகுதி என்பதைக் காட்ட இறுதியில் நீள்கோடு வைக்கப்பட்டுள்ளது. ‘மக்களினங்களும் அரசுகளும்’ என்பது இரண்டையும் ஒன்றுகூடும் கூட்டுப் பொருளாகத் தெளிவுபடுத்துகிறது.
