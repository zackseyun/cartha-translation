source:
  edition: WLC
  text: הֵ֤מָּה יֹאבֵדוּ֮ וְ/אַתָּ֪ה תַ֫עֲמֹ֥ד וְ֭/כֻלָּ/ם כַּ/בֶּ֣גֶד יִבְל֑וּ כַּ/לְּב֖וּשׁ תַּחֲלִיפֵ֣/ם וְֽ/יַחֲלֹֽפוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/026.yaml
  text: They will perish[a], but you will remain; all of them will wear out like a garment. Like clothing you will change them[b], and they will pass away.
translation:
  language: ta
  text: அவை அழிந்துபோகும்; நீரோ நிலைத்திருப்பீர்[a]. அவையெல்லாம் ஓர் ஆடையைப்போல் தேய்ந்துபோகும். உடையைப்போல் அவற்றை மாற்றுவீர்[b]; அவை கடந்துபோகும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லடிப்படையில், ‘நிற்பீர்.’ இங்கு இந்த எபிரேய வினைச்சொல், படைப்பு அழிந்தாலும் கடவுள் தொடர்ந்து நிலைத்திருப்பதை உணர்த்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவற்றைப் பதிலிடுவீர்.’ எபிரேயச் சொல் மாற்றுதல் அல்லது பதிலிடுதல் ஆகிய இரண்டையும் குறிக்கக்கூடும்; ஆடை உருவகம் தொடர்கிறது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘ஒழிந்துபோகும்.’ ‘மாற்றுவீர்’ என்றும் ‘கடந்துபோகும்’ என்றும் மொழிபெயர்க்கப்பட்ட சொற்கள் எபிரேயத்தில் ஒரே வேரிலிருந்து வருகின்றன.
    reason: wordplay_and_lexical_ambiguity
lexical_decisions:
- source_word: הֵמָּה
  choice: அவை
  rationale: முந்தைய சூழலில் குறிப்பிடப்பட்ட வானங்களையும் பூமியையும் குறிக்கும் ஆண்பால் பன்மைச் சுட்டுப்பெயர். உயிரற்ற படைப்புகளைக் குறிக்க நவீனத் தமிழில் ‘அவை’ இயல்பானது.
- source_word: יֹאבֵדוּ
  choice: அழிந்துபோகும்
  rationale: אבד என்பதன் Qal முற்றா வடிவம் வரவிருக்கும் அழிவை அல்லது ஒழிவைக் குறிக்கிறது; முழுமையான இல்லாமையைத் தேவையின்றி வலியுறுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: וְאַתָּה תַעֲמֹד
  choice: நீரோ நிலைத்திருப்பீர்
  rationale: இணைப்புச்சொல் இங்கு படைப்பின் அழிவுக்கும் கடவுளின் தொடர்ந்திருப்புக்கும் இடையிலான வலுவான முரணைக் காட்டுகிறது. עמד என்பதன் அடிப்படைப் பொருள் ‘நிற்றல்’; இச்சூழலில் நிலையான தொடர்ந்திருப்பை ‘நிலைத்திருப்பீர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְכֻלָּם
  choice: அவையெல்லாம்
  rationale: முன்னர் கூறப்பட்ட படைப்புகள் அனைத்தையும் உள்ளடக்கும் பன்மைத் தொகுப்புப் பொருளைச் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: כַּבֶּגֶד יִבְלוּ
  choice: ஓர் ஆடையைப்போல் பழுதாய்ப்போகும்
  rationale: בלה குறிப்பாக ஆடை பயன்பாட்டால் தேய்ந்து பயனற்றதாகப் போவதைக் குறிக்கலாம். ‘பழுதாய்ப்போகும்’ என்பது ஆடை உருவகத்தையும் படைப்பின் நிலையாமையையும் இயல்பான தமிழில் தருகிறது.
- source_word: כַּלְּבוּשׁ תַּחֲלִיפֵם
  choice: உடையைப்போல் அவற்றை மாற்றுவீர்
  rationale: חלף என்பதன் Hiphil வடிவம் மாற்றுதல் அல்லது பதிலாக வேறொன்றை இடுதல் எனப் பொருள்படலாம். ‘மாற்றுவீர்’ ஆடை மாற்றும் உருவகத்தைத் தெளிவாக வைத்தபடியே இரு சாத்தியங்களுக்கும் இடமளிக்கிறது.
- source_word: וְיַחֲלֹפוּ
  choice: அவையும் மாறிப்போகும்
  rationale: இது அதே חלף வேரின் Qal வடிவம்; மாறுதல், கடந்துபோதல் அல்லது ஒழிந்துபோதல் ஆகிய நுணுக்கங்கள் உள்ளன. ‘மாறிப்போகும்’ முந்தைய ‘மாற்றுவீர்’ என்பதுடனான எபிரேயச் சொல்விளையாட்டைக் காத்து, நிலையாமையையும் உணர்த்துகிறது.
theological_decisions:
- issue: படைப்பின் நிலையாமைக்கும் கடவுளின் நிலைத்திருப்புக்கும் உள்ள முரண்
  choice: படைப்புகள் அழிந்துபோகும், ஆனால் கடவுள் நிலைத்திருப்பார் என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘நீர் நிற்பீர்’ என்று עמד என்பதைக் கூடுதல் சொல்லடிப்படையுடன் மொழிபெயர்த்தல்.
  rationale: வசனம் கடவுளின் தொடர்ந்திருப்பை படைப்பின் தேய்வுக்கும் மாற்றத்துக்கும் எதிராக நிறுத்துகிறது. ‘நிலைத்திருப்பீர்’ அந்தக் கருத்தைத் தெளிவாக்குகிறது; ஆனால் வசனத்தில் வெளிப்படையாக இல்லாத பிற்கால இறையியல் சொற்களைச் சேர்ப்பதில்லை.
- issue: தெய்வீகச் செயலால் படைப்புகள் மாற்றப்படுதல் அல்லது பதிலிடப்படுதல்
  choice: ‘அவற்றை மாற்றுவீர்’ என்று உருவகத்தையும் சொற்பொருள் நெகிழ்வையும் பாதுகாத்தல்.
  alternative: ‘அவற்றுக்குப் பதிலாக வேறொன்றை வைப்பீர்’ என்று மாற்றீட்டைப் பிரதானப்படுத்தல்.
  rationale: துணியை மாற்றும் உருவகம் செயலில் மாற்றத்தையும் பதிலீட்டையும் சுட்டக்கூடும். மூலமொழி தீர்மானிக்காத விதத்தை மொழிபெயர்ப்பு ஒருதலைப்பட்சமாக முடிவுசெய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், கவிதைநயம் கொண்ட மரியாதை நடை பயன்படுத்தப்பட்டது. கடவுளைக் குறிக்கும் இரண்டாம் நபருக்கு ‘நீர்’ வடிவம் பயன்படுத்தப்பட்டுள்ளது. ‘ஆடை/உடை’ என்ற இயல்பான இணைச்சொற்கள் எபிரேயக் கவிதையின் இணைவரிசையையும் ஆடை உருவகத்தையும் காக்கின்றன.
