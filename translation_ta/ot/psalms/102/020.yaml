  text: to hear the groaning of the prisoner[a], to release the sons of death,
translation:
  language: ta
  text: 'சிறைக்கைதியின் முனகலைக் கேட்கவும்,


    மரணத்துக்கெனக் குறிக்கப்பட்டவர்களை விடுவிக்கவும்,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: கேட்கவும்
  rationale: שׁמע என்ற வினையின் infinitive construct வடிவம் ל முன்னொட்டுடன் வந்து, விரிந்த வாக்கியத்தில் நோக்கம் அல்லது விளைவைத் தெரிவிக்கிறது. இணையான இரண்டாம் infinitive உடன் அமைப்பைப் பேண ‘கேட்கவும்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: אֶנְקַת
  choice: முனகலை
  rationale: אנקה துயரத்தில் எழும் முனகல் அல்லது பெருமூச்சைக் குறிக்கிறது. வேதனையின் கனத்தை இயல்பான நவீனத் தமிழில் ‘முனகல்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אָסִיר
  choice: சிறைப்பட்டவனின்
  rationale: אָסִיר கட்டப்பட்ட அல்லது சிறையில் வைக்கப்பட்ட ஒருவனைக் குறிக்கிறது. ‘சிறைப்பட்டவன்’ என்பது நிலையையும் மூலத்தின் ஒருமையையும் நேரடியாகப் பேணுகிறது.
- source_word: לְפַתֵּחַ
  choice: விடுவிக்கவும்
  rationale: פתח என்பதன் அடிப்படைப் பொருள் ‘திறத்தல்.’ இங்கு சிறையிலோ மரண ஆபத்திலோ உள்ள மனிதர்களைப் பற்றிய சூழலில், அவர்களுக்கு வெளியேறும் வழியைத் திறப்பது என்ற வழக்குப் பொருளை ‘விடுவிக்க’ இயல்பாகத் தருகிறது.
- source_word: בְּנֵי
  choice: மகன்களை
  rationale: எபிரெயக் கூட்டுச்சொல் சொற்படி ‘மகன்கள்’ என்கிறது. மூல உருவகத்தைப் பேண ‘மகன்கள்’ முதன்மை உரையில் வைக்கப்பட்டு, அதன் வழக்குப் பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: תְמוּתָה
  choice: மரணத்தின்
  rationale: תְמוּתָה மரணத்தைக் குறிக்கிறது. ‘மரணத்தின் மகன்கள்’ என்பது மரிக்க நியமிக்கப்பட்டவர்களையோ மரணத் தீர்ப்புக்குள்ளானவர்களையோ குறிக்கும் உருவகம்; அதைத் தீர்த்துரைக்காமல் முதன்மை உரையில் பேணப்பட்டுள்ளது.
theological_decisions:
- issue: ‘மரணத்தின் மகன்கள்’ என்ற உருவகத்தின் பொருள்
  choice: மூல எபிரெய உருவகத்தை முதன்மை உரையில் பேணுதல்
  alternative: ‘சாக நியமிக்கப்பட்டவர்களை’ அல்லது ‘மரணத் தீர்ப்புக்குள்ளானவர்களை’ என்று நேரடியாக்குதல்
  rationale: இந்தச் சொற்றொடர் மரணத்துக்குத் தீர்ப்பிடப்பட்ட நிலை, மரிக்க வேண்டிய நியதி, அல்லது மரணத்தின் பிடி ஆகிய நிழற்பொருட்களைத் தாங்கக்கூடும். ஒன்றை மட்டும் முதன்மைப்படுத்தாமல் உருவகத்தைப் பேணி, சாத்தியமான வழக்குப் பொருள்களை அடிக்குறிப்பில் தருவது உண்மையான பொருள் விரிவை காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. இணையான இரண்டு நோக்கவினைகளும் ‘கேட்கவும் … விடுவிக்கவும்’ என அமைக்கப்பட்டுள்ளன. வசனம் அடுத்த பகுதியுடன் தொடர்வதால் இறுதியில் காற்புள்ளி வைக்கப்பட்டுள்ளது.
