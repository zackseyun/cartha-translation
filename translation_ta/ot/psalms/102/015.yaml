  yaml_path: translation/ot/psalms/102/015.yaml
  text: Then the nations will fear the name of Yahweh[b][a], and all the kings of the earth your glory.
translation:
  language: ta
  text: அப்போது[a] தேசங்கள் யாவேயின் பெயருக்கு அஞ்சும்[b]; பூமியின் அரசர்கள் அனைவரும் உமது மகிமையை அஞ்சுவார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மேலும் தேசங்கள் யாவேயின் பெயருக்கு அஞ்சும்.” எபிரெய இணைப்புச்சொல் பொதுவாக “மேலும்/மற்றும்” என்றும் வாசிக்கப்படலாம்; இங்கு “அப்போது” என்பது முந்தைய வசனத்துடன் உள்ள விளைவு உறவை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “பயபக்தி கொள்ளும்.” எபிரெய வினை பயபக்தியுடன் கூடிய அச்சத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: அப்போது … அஞ்சும்
  rationale: יִירְאוּ என்பது ירא வினையின் Qal முற்றா வடிவம்; அஞ்சுதல் அல்லது பயபக்தியுடன் மதித்தல் என்ற பொருள்களைத் தரலாம். முந்தைய வசனத்தின் நிகழ்வுகளின் விளைவைக் காட்டுவதால் וְ என்பதைக் கருத்துச் சார்ந்து ‘அப்போது’ என மொழிபெயர்த்துள்ளோம்; சாதாரண இணைப்பாகவும் வாசிக்க இயலும்.
- source_word: גּוֹיִם
  choice: தேசங்கள்
  rationale: இச்சங்கீதச் சூழலில் பல்வேறு மக்கள் இனங்களையும் அரசியல் தேசங்களையும் பொதுவாகக் குறிக்கிறது; பிற்கால சமய வேறுபாட்டை உணர்த்தக்கூடிய சொல்லைத் தவிர்க்கிறது.
- source_word: אֶת שֵׁם יְהוָה
  choice: யாவேயின் பெயருக்கு
  rationale: ‘பெயர்’ என்பதைக் கருத்துரையாக விரிக்காமல் அப்படியே காக்கிறது; தமிழ் வழக்கில் ‘பெயருக்கு அஞ்சுதல்’ இயல்பாக உள்ளது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான יהוה என்பதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: וְכָל מַלְכֵי הָאָרֶץ
  choice: பூமியின் அரசர்கள் அனைவரும்
  rationale: כָל உடன் வரும் பன்மைத் தொகுப்பை இயல்பான தமிழில் முழுமையாக வெளிப்படுத்துகிறது.
- source_word: אֶת כְּבוֹדֶךָ
  choice: உமது மகிமைக்கு
  rationale: כָּבוֹד என்பதன் மகிமை, கனம், மாட்சி ஆகிய பொருள் வளத்தை ‘மகிமை’ காக்கிறது. இரண்டாம் நபர் ஆண்பால் ஒருமை விகுதி தேவனை நேரடியாக நோக்கிப் பேசுவதை ‘உமது’ எனத் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலத்தில் ஒரு தனிப்பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: ירא வினையின் உணர்வு
  choice: அஞ்சும்
  alternative: பயபக்தி கொள்ளும் / போற்றும்
  rationale: மூல வினையில் உண்மையான அச்சமும் பயபக்தியும் இரண்டும் சாத்தியம். ‘அஞ்சும்’ இந்தத் தீவிரத்தைக் காக்கிறது; பயபக்தி சார்ந்த நுட்பத்தை அடிக்குறிப்பு தெரிவிக்கிறது.
- issue: இரண்டாம் அரையடியில் விடுபட்ட வினை
  choice: ‘அஞ்சுவார்கள்’ என்பதைத் தமிழில் மீண்டும் வெளிப்படுத்துதல்
  alternative: ‘பூமியின் அரசர்கள் அனைவரும் உமது மகிமையை’ என்று வினையின்றி விடுதல்
  rationale: எபிரெயக் கவிதையில் முதல் அரையடியின் וְיִירְאוּ இரண்டாம் அரையடிக்கும் இயல்பாகப் பொருந்துகிறது. தமிழில் தெளிவுக்கும் இயல்புக்கும் வினையை மீண்டும் கூறுவது அவசியம்; புதிய பொருள் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் சங்கீதத்திற்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. தேவனை நோக்கும் இரண்டாம் நபருக்கு ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. தேசங்களுக்கு தமிழ் இலக்கண வழக்கின்படி அஃறிணைப் பன்மை வினை ‘அஞ்சும்’ என்றும், மனிதர்களான அரசர்களுக்கு ‘அஞ்சுவார்கள்’ என்றும் அமைக்கப்பட்டுள்ளது.
