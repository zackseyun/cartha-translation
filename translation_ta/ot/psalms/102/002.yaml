  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ בְּ/י֪וֹם צַ֫ר לִ֥/י הַטֵּֽה אֵלַ֥/י אָזְנֶ֑/ךָ בְּ/י֥וֹם אֶ֝קְרָ֗א מַהֵ֥ר עֲנֵֽ/נִי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/002.yaml
  text: Do not hide your face from me in the day of my distress[a]; incline your ear to me. In the day I call[c][b], answer me quickly.
translation:
  language: ta
  text: என் நெருக்கடியின் நாளில் உமது முகத்தை[a] என்னிடமிருந்து மறைக்காதீர்; என்னிடம் உமது செவியைச் சாய்த்தருளும். நான் கூப்பிடும் நாளில்[b], விரைந்து எனக்குப் பதிலளியும்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது பிரசன்னத்தை.’ ‘முகம்’ என்ற எபிரெய மரபுத்தொடர் தேவனுடைய அருளான பிரசன்னத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் இருமுறை வரும் ‘நாளில்’ என்ற சொல்லமைப்பு இங்கே பாதுகாக்கப்பட்டுள்ளது; இதை இயல்பாக, ‘நான் கூப்பிடும்போது’ என்றும் சொல்லலாம்.
    reason: literary_structure
  - marker: c
    text: அல்லது, ‘எனக்குப் பதிலளிக்க விரையும்.’ מַהֵר என்ற சொல்லை வினையடையாகவோ, அவசரப்படுத்தும் வினையாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּסְתֵּר
  choice: மறைக்காதீர்
  rationale: தடை அல்லது அவசர மன்றாட்டை வெளிப்படுத்தும் எபிரெய எதிர்மறைத் தொடரையும் ‘மறைத்தல்’ என்ற வினையின் அடிப்படைப் பொருளையும் இயல்பான மரியாதை நடையில் தருகிறது.
- source_word: פָּנֶיךָ
