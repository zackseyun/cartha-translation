  rationale: ‘முகம்’ என்ற நேரடியான உருவகத்தைப் பாதுகாக்கிறது; இச்சொல் தேவனுடைய சாதகமான பிரசன்னத்தையும் குறிப்பால் உணர்த்தக்கூடும்.
- source_word: צַר לִי
  choice: என் நெருக்கடியின்
  rationale: சொல்லுக்கு சொல் வடிவம் ‘எனக்கு நெருக்கடி உள்ள’ என்பதாக இருந்தாலும், தனிப்பட்ட துன்பத்தைத் தெளிவாகவும் தமிழில் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: הַטֵּה אֵלַי אָזְנֶךָ
  choice: உமது செவியை என்னிடமாய்ச் சாய்த்தருளும்
  rationale: கவனித்துக் கேட்பதைக் குறிக்கும் உடலுறுப்பு சார்ந்த எபிரெய வேண்டுதல் உருவகத்தைப் பாதுகாத்து, தமிழில் இயல்பான ஜெப நடையைப் பயன்படுத்துகிறது.
- source_word: אֶקְרָא
  choice: நான் கூப்பிடும்
  rationale: புலம்பல் ஜெபச் சூழலில் קרא என்பது உதவிக்காகக் கூப்பிடுதலைக் குறிக்கிறது; ‘கூப்பிடும்’ என்பது அதன் வேண்டுதல் வலிமையை இயல்பாகத் தருகிறது.
