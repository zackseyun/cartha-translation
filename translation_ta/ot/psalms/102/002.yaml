  choice: விரைந்து எனக்குப் பதிலளியும்
  rationale: מַהֵר என்பதன் அவசரத்தையும் ענה என்பதன் ‘பதிலளித்தல்’ பொருளையும் தெளிவாகக் காக்கிறது; இதை ‘எனக்குப் பதிலளிக்க விரையும்’ என்றும் இலக்கண ரீதியாகப் புரிந்துகொள்ளலாம்.
theological_decisions:
- issue: தேவனைப் பற்றிய மனித உடலுறுப்பு உருவகம் (‘முகம்’, ‘செவி’)
  choice: மூலத்தின் நேரடியான உருவகங்களை முதன்மை உரையில் பாதுகாத்தல்
  alternative: ‘உமது பிரசன்னம்’ என்றும் ‘என் வேண்டுதலைக் கேளும்’ என்றும் பொருள் விளக்கி மொழிபெயர்த்தல்
  rationale: எபிரெயக் கவிதை தேவனுடைய சாதகமான பிரசன்னத்தையும் கவனத்தையும் உடலுறுப்பு உருவகங்களால் வெளிப்படுத்துகிறது. அவற்றைப் பாதுகாப்பது கவித்துவ வலிமையைக் காக்கிறது; தேவனுக்கு மனித உடல் உண்டு என்ற கோட்பாட்டை அது கட்டாயப்படுத்தாது.
- issue: மீண்டும் வரும் בְּיוֹם (‘நாளில்’) கால அமைப்பு
  choice: இரு இடங்களிலும் ‘நாளில்’ என்ற அமைப்பைப் பாதுகாத்தல்
  alternative: ‘நான் நெருக்கடியில் இருக்கும்போது... நான் கூப்பிடும்போது’ என்று சுருக்குதல்
  rationale: இருமுறை வரும் காலச்சொல் வசனத்தின் கவித்துவ இணைப்பையும் மன்றாட்டின் அவசரத்தையும் வலுப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான ஜெபநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய மரியாதைப் பன்மை வினைமுற்றுகளும் ‘உமது’ என்ற வடிவமும் ஒரே சீராக வைக்கப்பட்டுள்ளன. மூலத்தின் ‘முகம்/செவி’ உருவகங்களும் இருமுறை வரும் ‘நாளில்’ அமைப்பும் பாதுகாக்கப்பட்டுள்ளன.
