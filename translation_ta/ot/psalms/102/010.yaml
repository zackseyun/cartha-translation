  revision_rationale: The revision removes the unsupported “இவ்வாறு நேர்ந்தது” and expresses the Hebrew causal/explanatory force in a concise, natural Tamil sentence. It retains both divine-anger terms, the honorific address, and the image of being lifted and then thrown away. The footnote is retained but moved to its proper lexical anchor.
