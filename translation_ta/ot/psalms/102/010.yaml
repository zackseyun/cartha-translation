source:
  edition: WLC
  text: מִ/פְּנֵֽי זַֽעַמְ/ךָ֥ וְ/קִצְפֶּ֑/ךָ כִּ֥י נְ֝שָׂאתַ֗/נִי וַ/תַּשְׁלִיכֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/010.yaml
  text: because of your indignation and your wrath[a], for you have lifted me up and cast me away.
translation:
  language: ta
  text: உமது கடுஞ்சினத்தினாலும் உமது சீற்றத்தினாலும், நீர் என்னைத் தூக்கி எறிந்துவிட்டீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்னைத் தூக்கி வீசினீர்.’
    reason: שלך என்பதற்கு ‘எறிதல்’ என்பதுடன் ‘வீசுதல்’ என்பதும் நெருங்கிய சொற்பொருள் மாற்றாகும்.
lexical_decisions:
- source_word: מִפְּנֵי
  choice: இவ்வாறு நேர்ந்தது
  rationale: מִפְּנֵי இங்கு இடத்தைக் குறிக்காமல் காரணத்தைக் குறிக்கிறது. தமிழ் செய்யுள் ஓட்டத்தில் முன்வரும் இரண்டு கோபச் சொற்களையும் காரணமாகத் தெளிவாக இணைக்க ‘இவ்வாறு நேர்ந்தது’ சேர்க்கப்பட்டது.
- source_word: זַעַמְךָ
  choice: உமது கடுஞ்சினம்
  rationale: זַעַם தீவிரமான கோபத்தைக் குறிக்கிறது. அடுத்துள்ள קֶצֶף என்பதிலிருந்து ஓரளவு வேறுபடுத்தவும் செய்யுளின் வலிமையைப் பேணவும் ‘கடுஞ்சினம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְקִצְפֶּךָ
  choice: உமது சீற்றம்
  rationale: קֶצֶף கடுமையான சினம் அல்லது உக்கிரத்தைக் குறிக்கிறது. ‘சீற்றம்’ என்பது முந்தைய ‘கடுஞ்சினம்’ என்பதோடு இணையாக இருந்தாலும் இரண்டையும் ஒரே சொல்லாகச் சுருக்காமல் காக்கிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: כִּי சங்கீதக்காரரின் நிலைக்கான விளக்கக் காரணத்தை அறிமுகப்படுத்துகிறது; நவீனத் தமிழில் ‘ஏனெனில்’ அந்தத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: נְשָׂאתַנִי
  choice: என்னைத் தூக்கி
  rationale: נשא என்பதற்கு தூக்குதல், சுமத்தல், உயர்த்துதல் ஆகிய பொருள்கள் உண்டு. தொடர்ந்து வரும் ‘எறிதல்’ என்ற செயலோடு இணைந்துள்ள உயிரோட்டமான படிமத்தை ‘தூக்கி’ இயல்பாகப் பேணுகிறது.
- source_word: וַתַּשְׁלִיכֵנִי
  choice: எறிந்துவிட்டீர்
  rationale: שלך என்பது எறிதல் அல்லது வீசுதல் என்று பொருள்படும். ‘எறிந்துவிட்டீர்’ செயல் வலிமையையும் புறக்கணிக்கப்பட்ட உணர்வையும் இயல்பான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: இறைவனுடைய கோபத்தின் சித்தரிப்பு
  choice: இறைவனுடைய கோபத்தைக் குறிக்கும் இரண்டு சொற்களும் ‘கடுஞ்சினம்’, ‘சீற்றம்’ எனத் தனித்தனியாகவும் வலிமை குறையாமலும் வைக்கப்பட்டன.
  alternative: இரண்டையும் ‘கோபம்’ என்ற ஒரே சொல்லில் சுருக்குதல் அல்லது அவற்றின் தீவிரத்தை மென்மையாக்குதல்.
  rationale: எபிரெய உரை பொருள் நெருக்கமுள்ள இரு வேறு சொற்களைப் பயன்படுத்துகிறது. அவற்றை வேறுபடுத்திப் பேணுவது செய்யுள் இணைத்தன்மையையும் இறையியல் பதற்றத்தையும் காக்கிறது; வசனம் கூறாத கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், இறைவனை மரியாதையாகக் குறிக்கும் ‘உமது/நீர்’ வடிவங்களுடன் dignified poetic register பேணப்பட்டுள்ளது. எபிரெய வாக்கியத்தின் காரணத் தொடர்பும் இரண்டு கோபச் சொற்களின் இணைநிலையும் தெளிவாக வைக்கப்பட்டுள்ளன.
