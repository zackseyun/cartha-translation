source:
  edition: WLC
  text: עִנָּ֖ה בַ/דֶּ֥רֶךְ כח/ו קִצַּ֥ר יָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/023.yaml
  text: He afflicted my strength on the way[b][a]; he shortened my days.
translation:
  language: ta
  text: 'வழியில்[a] அவனுடைய வலிமையைக்[b] குன்றச் செய்தார்;

    என் நாட்களைக் குறைத்தார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘வாழ்க்கைப் பயணத்தில்’; சொல்லுக்கு சொல், ‘வழியில்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரேய வாசகம் ‘அவனுடைய வலிமை’ என்று உள்ளது; சுற்றியுள்ள பகுதி முதலாம் நபரில் இருப்பதைக் கருத்தில் கொண்டு, பலர் இதை ‘என் வலிமை’ என்று புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
lexical_decisions:
- source_word: עִנָּה
  choice: தாழ்த்தினார்
  rationale: பியேல் வடிவில் இச்சொல் துன்புறுத்துதல், தாழ்த்துதல் அல்லது வலிமை குன்றச் செய்தல் ஆகிய பொருள்களைத் தரலாம். வலிமை பொருளாக வருவதால், எபிரேயக் கவிதையின் சற்றே கடினமான சொல்லாட்சியையும் வினையின் தாக்கத்தையும் காக்கும் வகையில் ‘தாழ்த்தினார்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: בַדֶּרֶךְ
  choice: வழியில்
  rationale: இதன் நேர்ப்பொருள் ‘வழியில்’ என்பதாகும். வாழ்வின் பயணத்தை உருவகமாகக் குறிக்கக்கூடும்; ஆனால் மூலத்தின் உருவகம் முதன்மை உரையில் பாதுகாக்கப்படுகிறது.
- source_word: כחו
  choice: அவனுடைய வலிமையை
  rationale: கொடுக்கப்பட்ட மெய்யெழுத்து வாசகத்தில் மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி உள்ளது. ஆகவே ‘அவனுடைய வலிமையை’ என்று மொழிபெயர்த்து, சூழலுக்கு இயல்பான ‘என் வலிமையை’ என்ற வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: קִצַּר
  choice: குறைத்தார்
  rationale: קצר என்பதற்கு ‘குறைத்தல்’ அல்லது ‘குறுகச் செய்தல்’ என்று பொருள். ஆயுட்காலத்தைக் குறிக்கும் ‘நாட்கள்’ என்பதுடன் நவீன தமிழில் ‘குறைத்தார்’ தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: יָמָי
  choice: என் நாட்களை
  rationale: இது முதலாம் நபர் ஒருமை உடைமை விகுதியுடன் அமைந்த தெளிவான வடிவம்; சங்கீதக்காரரின் வாழ்நாட்களைக் குறிக்கிறது.
theological_decisions:
- issue: ‘அவனுடைய வலிமை’ என்பதிலிருந்து ‘என் நாட்கள்’ என்பதற்கு ஏற்படும் நபர் மாற்றம்
  choice: முதல் அடியில் மூன்றாம் நபரையும் இரண்டாம் அடியில் முதலாம் நபரையும் மூலத்தில் உள்ளபடியே வைத்தல்
  alternative: இரு அடிகளையும் முதலாம் நபரில் புரிந்து, ‘வழியில் என் வலிமையை அவர் தாழ்த்தினார்; என் நாட்களைக் குறைத்தார்’ என்று மொழிபெயர்த்தல்
  rationale: கொடுக்கப்பட்ட எபிரேய வாசகத்தில் ‘வலிமை’ என்பதற்கு மூன்றாம் நபர் உடைமை விகுதியும், ‘நாட்கள்’ என்பதற்கு முதலாம் நபர் உடைமை விகுதியும் உள்ளன. இந்த உண்மையான உரைநடைத் திடீர்மாற்றத்தை முதன்மை உரையில் ஒத்திசைத்து மறைக்காமல் பாதுகாத்து, சூழலுக்கு ஏற்ற மாற்று வாசிப்பை அடிக்குறிப்பில் தருகிறோம்.
translation_notes:
  register: நவீன செந்தமிழ் சார்ந்த, பொதுவாசகர்களுக்குப் புரியக்கூடிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. எபிரேயக் கவிதையின் இரு அடிகளும் நபர் மாற்றமும் பாதுகாக்கப்பட்டுள்ளன; ‘வழியில்’ என்ற உருவகம் விளக்கவுரையாக மாற்றப்படவில்லை.
