  yaml_path: translation/ot/psalms/102/003.yaml
  text: For my days vanish like smoke[a], and my bones burn like a hearth.
translation:
  language: ta
  text: 'ஏனெனில், என் நாட்கள் புகையைப்போல் மறைந்துபோகின்றன;

    என் எலும்புகள் அடுப்பைப்போல்[a] எரிகின்றன.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தீக்கொள்ளியைப்போல்,’ ‘சூளையைப்போல்,’ அல்லது ‘கனல் அடுப்பைப்போல்.’ எரியும் பொருளையோ இடத்தையோ குறிக்கும் எபிரெயச் சொல் அரிதானது; ஆகவே துல்லியமான படிமம் உறுதியில்லை. எனினும், கடும் வெப்பம் என்பதே தெளிவான கருத்து.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: புலம்பலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָלוּ בְעָשָׁן
  choice: புகையைப்போல் மறைந்துபோகின்றன
  rationale: வினைச்சொல்லின் ‘முடிவுறுதல்/ஒழிந்துபோதல்’ என்ற பொருளையும், புகை கலைந்து மறையும் உவமையையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: יָמַי
  choice: என் நாட்கள்
  rationale: முதலாம் நபர் உரிமை விகுதியுடன் உள்ள தனிப்பட்ட புலம்பலை நேரடியாக வழங்குகிறது.
- source_word: וְעַצְמוֹתַי
  choice: என் எலும்புகள்
  rationale: ஆழமான உடல் வேதனையைச் சித்தரிக்கும் எபிரெய உடல்சார் உருவகத்தைப் பாதுகாக்கிறது.
- source_word: קֵד
  choice: அடுப்பு
  rationale: இது அரிதான சொல்லாக இருந்தாலும், எரியும் இடம் அல்லது பொருள் என்ற பொதுவான படிமத்தை ‘அடுப்பு’ இயல்பாகக் காட்டுகிறது; உறுதியற்ற துல்லியமான குறிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נִחָרוּ
  choice: வெந்து கருகுகின்றன
  rationale: கடும் வெப்பத்தால் சுடப்படுதல் அல்லது கருகுதல் என்ற வினையின் தீவிரத்தை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions: []
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயத்தின் காரணத் தொடர்பும் இணையான இரு உருவகங்களும் பாதுகாக்கப்பட்டுள்ளன; அரிதான קֵד என்பதின் நிச்சயமின்மை அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
