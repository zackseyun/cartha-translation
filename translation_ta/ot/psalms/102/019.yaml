  source_fidelity: 'மூல எபிரெயத்தின் இரு இணை வாக்கியங்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன: הִשְׁקִיף என்பதன் உயரத்திலிருந்து கீழ்நோக்கும் கருத்து, מְרוֹם קָדְשׁוֹ என்பதன் சுருக்கமான இடக்குறிப்பு, மற்றும் வானத்திலிருந்து பூமியை நோக்கிய பார்வை அனைத்தும் பிரதிபலிக்கின்றன. இரண்டாம் பகுதியில் יהוה என்ற பெயர் வெளிப்படையாகவே தரப்பட்டுள்ளது. ஆங்கில POB-யின் “looked down / gazed” இணைநிலைக்கும் இது பொருந்துகிறது.'
  naturalness: “கீழ்நோக்கிப் பார்த்தார்; யெகோவா வானத்திலிருந்து பூமியை உற்றுநோக்கினார்” என்பது நவீனத் தரத் தமிழில் இயல்பாகவும் சங்கீதக் கவிதை நடைக்கு ஏற்ற கண்ணியத்துடனும் உள்ளது. “பரிசுத்த உயரம்” கவிதைமயமான, சுருக்கமான சொல்லாட்சியாக இருப்பதால் மூலத்தின் இடப்பொருள் தெளிவின்மையைத் தேவையின்றி விரிவுபடுத்தவில்லை.
  terminology: “யெகோவா” יהוה-ஐப் பெயராகக் காக்கிறது; அதை வெறும் பட்டமாக மாற்றவில்லை. “பரிசுத்த,” “வானம்,” “பூமி” ஆகியவை நிலையான, புரிந்துகொள்ளக்கூடிய வேதாகமத் தமிழ்ச் சொற்கள். சிறப்புக் குறிப்பு தேவைப்படும் உரைச் சிக்கல் அல்லது பெயரியல் தெளிவின்மை இவ்வசனத்தில் இல்லை.
