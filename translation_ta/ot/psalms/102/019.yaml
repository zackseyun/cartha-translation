translation:
  language: ta
  text: ஏனெனில், அவர் தமது பரிசுத்த உயரத்திலிருந்து கீழ்நோக்கிப் பார்த்தார்; யெகோவா வானத்திலிருந்து பூமியை உற்றுநோக்கினார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁקִיף
  choice: கீழ்நோக்கிப் பார்த்தார்
  rationale: உயர்ந்த இடத்திலிருந்து கீழே பார்ப்பதைச் சுட்டும் எபிரெய வினையின் திசைசார் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מְרוֹם קָדְשׁוֹ
  choice: தமது பரிசுத்த உயரம்
  rationale: ‘அவருடைய பரிசுத்தத்தின் உயரம்’ அல்லது ‘அவருடைய பரிசுத்த உயர்ந்த வாசஸ்தலம்’ எனப் புரிந்துகொள்ளக்கூடிய சொற்றொடரை, இடத்தைக் குறிக்கும் அதன் கவிதைநயமான தெளிவின்மையை மிகையாக விரிக்காமல் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை பொதுப்பட்டமான ‘ஆண்டவர்’ என்பதால் மாற்றாமல் பெயராகப் பாதுகாக்கிறது.
- source_word: הִבִּיט
  choice: உற்றுநோக்கினார்
  rationale: முந்தைய ‘பார்த்தார்’ என்பதுடன் கவிதை இணைநிலையைப் பேணிக்கொண்டே, கவனமாக நோக்குதல் என்ற வினையின் நுண்ணுணர்வைத் தருகிறது.
- source_word: מִשָּׁמַיִם אֶל אֶרֶץ
  choice: வானத்திலிருந்து பூமியை
  rationale: מִן ... אֶל என்ற மூலத்தின் ‘வானத்திலிருந்து பூமியை நோக்கி’ என்ற இயக்கத்தையும் பார்வையின் இலக்கையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: தெய்வீகப் பெயர் יהוה-ஐ மொழிபெயர்த்தல்
  choice: யெகோவா
  alternative: ஆண்டவர்
  rationale: இங்கு மூல எபிரெய உரை தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் வெளிப்படையாகக் கொடுத்தது; குறிப்பிட்ட பிரிவுசார் விளக்கத்தைச் சேர்க்கவில்லை.
- issue: ‘பரிசுத்த உயரம்’ என்பது பண்பா, இடமா
  choice: இடத்தைக் குறிக்கும் கவிதைச் சொல்லாட்சியாக வைத்தல்
  alternative: அவருடைய பரிசுத்த வாசஸ்தலத்தின் உயரத்திலிருந்து
  rationale: ‘வாசஸ்தலம்’ என்பது சூழலுக்கு ஏற்ற விளக்கமாக இருந்தாலும் மூலத்தில் வெளிப்படையாக இல்லை; ஆகவே மூலத்தின் சுருக்கத்தையும் நுட்பமான தெளிவின்மையையும் காத்தது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணையான எபிரெய வினைகளுக்கும் ‘கீழ்நோக்கிப் பார்த்தார் / உற்றுநோக்கினார்’ என வேறுபட்டும் தொடர்புடையதுமான சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன.
