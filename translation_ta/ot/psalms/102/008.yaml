translation:
  language: ta
  text: நாள் முழுவதும் என் பகைவர்கள் என்னை நிந்திக்கிறார்கள்; என்னை ஏளனம் செய்கிறவர்கள் என்னை வைத்து சத்தியம் செய்கிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என்னை ஏளனம் செய்கிறவர்கள் எனக்கு எதிராகச் சத்தியம் செய்கிறார்கள்”; அல்லது, “சத்தியமிடும்போது என்னைச் சாபமாகப் பயன்படுத்துகிறார்கள்.” எபிரெயத் தொடர் கடினமானது. சங்கீதக்காரரின் பெயரோ நிலையோ பகைமையான சத்திய அல்லது சாப மொழியில் ஓர் எடுத்துக்காட்டாகப் பயன்படுத்தப்படுகிறது என்பதே இதன் சாத்தியமான பொருள்.
    reason: alternative_reading
