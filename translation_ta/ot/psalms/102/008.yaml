- source_word: חֵרְפוּנִי
  choice: என்னை நிந்திக்கிறார்கள்
  rationale: חרף என்பதிலுள்ள இகழ்ச்சி, பழிப்பு, அவமதிப்பு ஆகிய பரந்த பொருள் வீச்சை dignified Tamil-இல் காக்கிறது.
- source_word: אֹיְבַי
  choice: என் பகைவர்கள்
  rationale: உடைமைத் தொடர்புள்ள பெயர்ச்சொல்லை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: מְהוֹלָלַי
  choice: என்னை ஏளனம் செய்கிறவர்கள்
  rationale: வடிவமும் துல்லிய நுண்பொருளும் சிக்கலானவை; சூழலில் சங்கீதக்காரரைப் பரிகசிக்கும் பகைவர்களைக் குறிப்பதாகத் தோன்றும் பொருளை தெளிவாகத் தருகிறது.
- source_word: בִּי נִשְׁבָּעוּ
  choice: என் பெயரைச் சொல்லிச் சத்தியம் செய்கிறார்கள்
  rationale: נשבע உடன் வரும் בִּי என்பதன் அடிப்படை ‘என்னை வைத்து/என் பேரில் சத்தியம் செய்தல்’ என்ற அமைப்பை இயல்பான தமிழில் தருகிறது; பகைமைச் சூழலில் இது சாபச் சூத்திரமாக இருக்கக்கூடிய நுண்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
