- from: நீர் எழுந்து சீயோன்மேல் இரக்கம் காட்டுவீர்; ஏனெனில், அவளுக்கு அருள்காட்ட வேண்டிய நேரம் வந்துவிட்டது—ஆம், குறிக்கப்பட்ட காலம் வந்துவிட்டது.
  to: நீர் எழுந்து சீயோன்மேல் இரக்கம் காட்டுவீர்; ஏனெனில், அவளுக்கு அருள் காட்டுவதற்கான நேரம் வந்துவிட்டது—ஆம், நியமிக்கப்பட்ட காலம் வந்துவிட்டது.
