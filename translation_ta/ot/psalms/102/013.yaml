source:
  edition: WLC
  text: אַתָּ֣ה תָ֭קוּם תְּרַחֵ֣ם צִיּ֑וֹן כִּי עֵ֥ת לְ֝/חֶֽנְנָ֗/הּ כִּי בָ֥א מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/013.yaml
  text: You will arise and have compassion on Zion[a], for it is time to show her favor[b], for the appointed time has come.
translation:
  language: ta
  text: நீர் எழுந்து சீயோன்மேல் இரக்கம் காட்டுவீர்; ஏனெனில், அவளுக்கு அருள் காட்டுவதற்கான நேரம் வந்துவிட்டது—ஆம், நியமிக்கப்பட்ட காலம் வந்துவிட்டது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָקוּם
  choice: நீர் எழுந்து
  rationale: קום என்பதன் Qal முற்றுப்பெறா வடிவம், கடவுளை நோக்கிய எதிர்காலச் செயலைக் குறிக்கிறது. எபிரெய மொழியின் உயிரோட்டமுள்ள மனிதவுருவகச் சொல்லாட்சியைத் தக்கவைக்க ‘எழுந்து’ என மொழிபெயர்க்கப்பட்டது.
- source_word: תְּרַחֵם
  choice: இரக்கம் காட்டுவீர்
  rationale: רחם என்பதன் Piel வடிவம் ஆழ்ந்த இரக்கம் அல்லது பரிவு காட்டுவதைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் கண்ணியமாகவும் இருப்பதால் இச்சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது.
- source_word: צִיּוֹן
  choice: சீயோன்
  rationale: இது இடப்பெயர் என்பதால் விளக்கமாக ‘எருசலேம்’ அல்லது ‘கடவுளின் மக்கள்’ என்று மாற்றாமல் ஒலிபெயர்க்கப்பட்டது.
- source_word: כִּי
  choice: ஏனெனில் / ஆம்
  rationale: முதல் כִּי முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்துகிறது. இரண்டாவது כִּי வந்தடைந்த நிர்ணயிக்கப்பட்ட காலத்தை வலியுறுத்துகிறது; தமிழில் இயல்பாக அந்த வலியுறுத்தலை வெளிப்படுத்த ‘ஆம்’ பயன்படுத்தப்பட்டது.
- source_word: עֵת
  choice: நேரம்
  rationale: עֵת பொதுவாக ‘நேரம், காலம்’ எனப் பொருள்படும். இங்கு சீயோனுக்கு அருள்காட்டுவதற்கான தீர்மானமான தருணத்தைக் குறிக்கிறது.
- source_word: לְחֶנְנָהּ
  choice: அவளுக்கு அருள்காட்ட வேண்டிய
  rationale: חנן என்பதன் infinitive construct, மூன்றாம் நபர் பெண்பால் ஒருமை பின்னொட்டுடன் வந்து சீயோனைக் குறிக்கிறது. ‘அருள்காட்ட’ என்பது தயவு அல்லது நன்முகம் காட்டுதல் என்ற பொருளைப் பாதுகாக்கிறது.
- source_word: בָא
  choice: வந்துவிட்டது
  rationale: בוא என்பதன் perfect வடிவம் குறிக்கப்பட்ட காலம் ஏற்கெனவே வந்து தற்போது பொருத்தமுடையதாக இருப்பதைக் காட்டுகிறது.
- source_word: מוֹעֵד
  choice: குறிக்கப்பட்ட காலம்
  rationale: מוֹעֵד என்பது நியமிக்கப்பட்ட அல்லது நிர்ணயிக்கப்பட்ட காலத்தைக் குறிக்கிறது. ‘குறிக்கப்பட்ட காலம்’ அந்தத் தீர்மானிக்கப்பட்ட தன்மையைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: சீயோன் என்பதை நேரடியாகவா அல்லது விளக்கமாகவா மொழிபெயர்ப்பது
  choice: எபிரெய மூலத்தில் உள்ள பெயரையே ‘சீயோன்’ எனத் தக்கவைத்தல்.
  alternative: ‘எருசலேம்’ அல்லது ‘கடவுளின் மக்கள்’ என்று விளக்கிப் பெயர்த்தல்.
  rationale: மூலவசனம் சீயோனை நேரடியாகப் பெயரிடுகிறது. அது நகரத்தையும் மக்களையும் விரிவாகச் சுட்டக்கூடியதாக இருந்தாலும், அந்தத் தொடர்புகளை வாசகர் சூழலிலிருந்து அறியும்படி பெயரை மாற்றாமல் வைத்திருப்பது உரைக்கு உண்மையானது.
- issue: இரண்டு כִּי சொற்களின் தொடர்பு
  choice: முதலாவதை காரணமாகவும் இரண்டாவதை வலியுறுத்தலாகவும் வெளிப்படுத்துதல்.
  alternative: இரண்டையும் ‘ஏனெனில்’ என்று ஒரே விதமாக மொழிபெயர்த்தல்.
  rationale: இரண்டாவது உட்பிரிவு ‘குறிக்கப்பட்ட காலம் வந்துவிட்டது’ என்ற முந்தைய கருத்தை உறுதிப்படுத்துகிறது. இருப்பினும் காரணத் தொடர்பும் சாத்தியமானதால், உரையின் பொருளை மிகையாகத் தீர்மானிக்காமல் ‘ஆம்’ என்ற மிதமான வலியுறுத்தல் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், கடவுளை நோக்கிய கண்ணியமான ‘நீர்/காட்டுவீர்’ வடிவம் பயன்படுத்தப்பட்டது. கவிதைநடையின் இணை அமைப்பைத் தக்கவைக்க அரைப்புள்ளியும் நீண்ட கோடும் பயன்படுத்தப்பட்டுள்ளன; அரிதான அல்லது சமயப்பிரிவு சார்ந்த சொற்கள் தவிர்க்கப்பட்டன.
