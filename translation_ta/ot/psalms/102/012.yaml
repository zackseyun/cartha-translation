source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה לְ/עוֹלָ֣ם תֵּשֵׁ֑ב וְ֝/זִכְרְ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/012.yaml
  text: But you[a], O Yahweh, sit enthroned forever[b], and your remembrance is from generation to generation.
translation:
  language: ta
  text: ஆனால், யாவே, நீரோ என்றென்றும் வீற்றிருக்கிறீர்[a]; உமது நினைவு தலைமுறைதோறும் உள்ளது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அமர்ந்திருக்கிறீர்” அல்லது “நிலைத்திருக்கிறீர்.” எபிரெய வினைச்சொல்லின் நேரடிப் பொருள் “அமர்ந்திரு”; அரசரைக் குறிக்கும் சூழலில் அது அரியணையில் வீற்றிருப்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “நினைவு” என்பதற்கான எபிரெயச் சொல் “நினைவுச் சின்னம்,” “நினைவுகூர்தல்,” அல்லது “புகழ்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: ஆனால் ... நீரோ
  rationale: முந்தைய சூழலில் காணப்படும் மனித வாழ்வின் நிலையாமைக்கு எதிராக, இணைப்புச்சொல்லும் தனிப்பட்ட சுட்டுப்பெயரும் வலியுறுத்தும் முரண்பாட்டை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய வேதாகமத்தின் நான்கெழுத்து இறைப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: இங்கு குறிக்கப்படும் முடிவில்லாத காலநிலையைத் தெளிவாகவும் கவிதைநயத்துடனும் தெரிவிக்கிறது.
- source_word: תֵּשֵׁב
  choice: வீற்றிருக்கிறீர்
  rationale: ישׁב என்பதன் அடிப்படைப் பொருள் ‘அமர்ந்திரு’; கடவுளைக் குறிக்கும் இந்தக் கவிதைச் சூழலில் அரசருக்குரிய அரியணை அமர்வையும் நிலைத்திருப்பையும் ‘வீற்றிருக்கிறீர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וְזִכְרְךָ
  choice: உமது நினைவு
  rationale: זֵכֶר குறிக்கக்கூடிய நினைவு, நினைவுச்சின்னம் அல்லது புகழ் ஆகிய பொருள்களில் ஒன்றை மிகுதியாகத் தீர்மானிக்காமல், மூலச்சொல்லின் நினைவுகூர்தல் சார்ந்த பரப்பைத் தக்கவைக்கிறது.
- source_word: לְדֹר וָדֹר
  choice: தலைமுறை தலைமுறைக்கும்
  rationale: தொடர்ந்து வரும் ஒவ்வொரு தலைமுறையிலும் நிலவும் தொடர்ச்சியை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: תֵּשֵׁב என்பதில் உள்ள தெய்வீக நிலைத்தன்மையும் அரசாட்சிச் சாயலும்
  choice: வீற்றிருக்கிறீர்
  alternative: அமர்ந்திருக்கிறீர் / நிலைத்திருக்கிறீர்
  rationale: ‘வீற்றிருக்கிறீர்’ என்பது அரசருக்குரிய அமர்வை உணர்த்தினாலும், ‘ஆட்சி செய்கிறீர்’ என்று மூலத்தில் இல்லாத செயலை நேரடியாகச் சேர்க்காது; அடிப்படைப் பொருளையும் அரசாட்சிச் சாயலையும் இணைத்துத் தக்கவைக்கிறது.
- issue: זִכְרְךָ என்பதன் பொருள் வரம்பு
  choice: உமது நினைவு
  alternative: உமது நினைவுப்பெயர் / உமது புகழ்
  rationale: கடவுளின் புகழ் மட்டுமே இங்கு குறிக்கப்படுகிறது என்று முடிவுசெய்யாமல், நினைவு, நினைவுகூர்தல், நிலைத்த புகழ் ஆகிய சாத்தியங்களைத் திறந்தவாறே வைக்கிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழில் கவிதைநயத்தைத் தக்கவைத்துள்ளது. ‘நீரோ’ முந்தைய வசனங்களோடு உள்ள முரண்பாட்டை வலியுறுத்துகிறது. ‘வீற்றிருக்கிறீர்’ அரசாட்சிச் சாயலை வெளிப்படுத்தினாலும், அதன் நேரடிப் பொருள் குறித்த மாற்று அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
