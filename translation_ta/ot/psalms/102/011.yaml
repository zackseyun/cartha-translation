lexical_decisions:
- source_word: יָמַי
  choice: என் நாட்கள்
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் வந்துள்ள பன்மையை நேரடியாகப் பாதுகாக்கிறது; வாழ்நாளைக் குறிக்கும் எபிரெயக் கவித்துவப் படிமத்தையும் தக்கவைக்கிறது.
- source_word: כְּצֵל
  choice: நிழலைப்போல்
  rationale: כְּ ஒப்புமையையும் צֵל என்பதன் இயல்பான பொருளான ‘நிழல்’ என்பதையும் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: נָטוּי
  choice: நீண்டுபோகும்
  rationale: נטה என்பதன் ‘நீட்டப்பட்ட, விரிந்த’ என்ற அடிப்படைக் கருத்தை, நிழல் குறித்த சூழலில் இயல்பான தமிழில் தருகிறது; மாலை நிழல் நீள்வதையும் வாழ்வின் நிலையாமையையும் உணர்த்துகிறது.
- source_word: וַאֲנִי
  choice: நானோ
  rationale: எளிய இணைப்பையும் வலியுறுத்தப்பட்ட ‘நான்’ என்பதையும் தமிழ்க் கவிதை நடையில் இயல்பாகக் காட்டுகிறது; தேவையற்ற தீவிர எதிர்மறையைச் சேர்ப்பதில்லை.
- source_word: כָּעֵשֶׂב
  choice: புல்லைப்போல்
  rationale: עֵשֶׂב என்பதற்கு இச்சூழலில் இயல்பான ‘புல்’ என்பதைப் பயன்படுத்தி, நிலையாமை பற்றிய பொதுவான வேதாகமப் படிமத்தைப் பாதுகாக்கிறது.
- source_word: אִיבָשׁ
  choice: வாடிப்போகிறேன்
  rationale: יבשׁ என்பதன் ‘உலர்தல், வாடுதல்’ என்ற பொருளை முதல் நபர் வினையாகவும், புல்லுடன் இயல்பாக இணையும் தமிழ்ச் சொல்லாக்கமாகவும் தருகிறது.
