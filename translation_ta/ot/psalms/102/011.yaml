  text: என் நாட்கள் நீளும் நிழலைப்போல் உள்ளன[a]; நானோ புல்லைப்போல் வாடிப்போகிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நீட்டப்பட்ட நிழலைப்போல்.” இங்கு நீளும் மாலைநிழல் குறிக்கப்பட்டிருக்கலாம்; அது வாழ்வின் தேய்வையும் நிலையாமையையும் உணர்த்துகிறது.
