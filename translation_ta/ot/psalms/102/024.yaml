source:
  edition: WLC
  text: אֹמַ֗ר אֵלִ֗/י אַֽל תַּ֭עֲלֵ/נִי בַּ/חֲצִ֣י יָמָ֑/י בְּ/ד֖וֹר דּוֹרִ֣ים שְׁנוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: I say[a], “My God, do not take me away in the middle of my days[b]; your years are through all generations.”
translation:
  language: ta
  text: 'நான் சொல்கிறேன்: “என் இறைவனே, என் வாழ்நாளின் பாதியிலேயே என்னை எடுத்துக்கொள்ளாதீர்[a]; உமது ஆண்டுகள் தலைமுறை தலைமுறையாக நீடிக்கின்றன[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொற்பட, “என்னை மேலே கொண்டுபோகாதீர்.” இங்கு வரும் எபிரெய வினை “மேலே கொண்டுபோ” என்று பொருள்படலாம்; ஆனால் இந்தச் சூழலில் அகாலமாக உயிரிலிருந்து எடுத்துக்கொள்ளப்படுவதைக் குறிப்பதாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “தலைமுறைகள் தோறும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: நான் சொல்கிறேன்
  rationale: Qal முற்றுப்பெறா வினை வடிவம் கவிதையில் நிகழ்கால வேண்டுதலை உயிரோட்டமாக அறிமுகப்படுத்துகிறது; காலத்தின் சிறிய தெளிவின்மையை இயல்பான தமிழ் நிகழ்காலம் வெளிப்படுத்துகிறது.
- source_word: אֵלִי
  choice: என் இறைவனே
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டுடன் ‘என் இறைவன்’ என்று பொருள்; அழைப்புமுறை தமிழில் ‘-ஏ’ மூலம் இயல்பாகக் காட்டப்படுகிறது.
- source_word: אַל תַּעֲלֵנִי
  choice: என்னை எடுத்துக்கொள்ளாதீர்
  rationale: עלה என்பதன் Hiphil வடிவம் சொற்பட ‘என்னை மேலே கொண்டுபோகாதீர்’ எனலாம்; ஆனால் வாழ்நாளின் பாதி என்ற சூழலில் அகாலமாக உயிரிலிருந்து அகற்றப்படுவதைச் சுட்டுகிறது. மரியாதை ஒருமை வேண்டுதலாக மொழிபெயர்க்கப்பட்டது.
- source_word: בַּחֲצִי יָמָי
  choice: என் வாழ்நாளின் பாதியிலேயே
  rationale: சொற்பொருளான ‘என் நாட்களின் பாதியில்’ என்பதன் வாழ்வுக்கால உருவகத்தைத் தெளிவான, இயல்பான தமிழில் காக்கிறது; ‘-ஏ’ அகால முடிவின் வலியுறுத்தலை வெளிப்படுத்துகிறது.
- source_word: בְּדוֹר דּוֹרִים
  choice: தலைமுறை தலைமுறையாக
  rationale: தொடர்ந்து வரும் தலைமுறைகள் அனைத்தையும் குறிக்கும் எபிரெய மொழிவழக்கிற்கு நேர்த்தியான தமிழ் இணை; கால எல்லையற்ற தொடர்ச்சியை உணர்த்துகிறது.
- source_word: שְׁנוֹתֶיךָ
  choice: உமது ஆண்டுகள்
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமைப் பின்னொட்டுடன் உள்ள பன்மைப் பெயர்ச்சொல்லை நேரடியாக மொழிபெயர்க்கிறது; சங்கீதக்காரரின் குறுகிய வாழ்வுக்கும் இறைவனின் நீடித்த இருப்புக்கும் உள்ள மாறுபாட்டைக் காக்கிறது.
theological_decisions:
- issue: மரணத்தைக் குறிக்கும் உருவக/மொழிவழக்குச் சொல்
  choice: என்னை எடுத்துக்கொள்ளாதீர்
  alternative: என்னை மேலே கொண்டுபோகாதீர்; என்னை அகற்றாதீர்
  rationale: உடனடிச் சூழல் மனித வாழ்வின் குறுகிய தன்மையை இறைவனின் தலைமுறை கடந்த ஆண்டுகளோடு வேறுபடுத்துகிறது. ‘மேலே கொண்டுபோகாதீர்’ என்பது மூல வினையின் வடிவத்தை நெருக்கமாகப் பின்பற்றினாலும் தமிழில் தவறான கருத்தைத் தரலாம்; தேர்ந்த மொழிபெயர்ப்பு அகால மரணத்தின் சாத்தியமான பொருளை வெளிப்படுத்துகிறது, அதை சமயக் கோட்பாடாக விரிவுபடுத்தவில்லை.
- issue: இறைவனின் ஆண்டுகளின் தொடர்ச்சி
  choice: உமது ஆண்டுகள் தலைமுறை தலைமுறையாக நீடிக்கின்றன
  alternative: உமது ஆண்டுகள் தலைமுறை தலைமுறையாக இருக்கின்றன
  rationale: மூலத்தில் வெளிப்படையான வினை இல்லை; தமிழில் முழுமையான இயல்பான வாக்கியத்திற்காக ‘நீடிக்கின்றன’ சேர்க்கப்பட்டது. இது சூழலில் உள்ள நிலையான தொடர்ச்சியை வெளிப்படுத்துகிறது; தனியாக ‘நித்தியம்’ என்ற வலுவான சொற்றொடரைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வேண்டுதலுக்குரிய கண்ணியமான மரியாதை ஒருமை நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கவிதைச் சுருக்கமும், மனித வாழ்வின் பாதிக்கும் இறைவனின் தலைமுறை கடந்த ஆண்டுகளுக்கும் இடையிலான மாறுபாடும் காக்கப்பட்டுள்ளன.
