  source_fidelity: மூல எபிரெயத்தின் வேண்டுதல், “என் நாட்களின் பாதியில்” என்ற வாழ்நாள் உருவகம், மற்றும் மனித வாழ்வின் நிலையாமைக்கு எதிரான இறைவனின் தலைமுறைகள் கடந்த ஆண்டுகள் ஆகிய மாறுபாடுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன. תעלני என்பதற்கான சூழல்சார் பொருளான அகாலமாக எடுத்துக்கொள்ளப்படுதல் இயல்பாக வெளிப்படுகிறது; அடிக்குறிப்பு அதன் சொற்படியான மாற்றையும் தருகிறது.
  naturalness: நவீன நிலையான தமிழில் நடை இயல்பாகவும் கவிதைத் தொனியுடனும் உள்ளது. “என் இறைவனே” என்ற அழைப்புமுறையும் “எடுத்துக்கொள்ளாதீர்” என்ற கண்ணியமான வேண்டுதல் வடிவமும் பொருத்தமானவை. “தலைமுறை தலைமுறையாக நீடிக்கின்றன” என்பது மூலத்தின் தொடர்ச்சிக் கருத்தைத் தெளிவாகத் தருகிறது.
