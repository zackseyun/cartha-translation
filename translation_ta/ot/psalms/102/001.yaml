  text: O Yahweh[a], hear my prayer, and let my cry come to you.
translation:
  language: ta
  text: யாவே[a], என் ஜெபத்தைக் கேளும்; என் கூக்குரல் உம்மிடம் வரட்டும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயம்: “YHWH”; இங்கு “யாவே” என்று ஒலிபெயர்க்கப்பட்டுள்ளது. மரபாக “கர்த்தர்” என்று வழங்கப்படுகிறது; “யெகோவா” என்பதும் ஒரு மாற்று வடிவம்.'
    reason: இறைத்தனிப்பெயரின் ஒலிபெயர்ப்பு, மரபுவழி வழங்கல், மற்றும் மாற்று வடிவத்தைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரயேலின் தேவனுடைய தனிப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பாக ஒலிபெயர்க்கிறது.
- source_word: שִׁמְעָה
  choice: கேளும்
  rationale: שׁמע என்பதன் ஆண்பால் ஒருமை கட்டளை வடிவத்தின் நேரடியான வேண்டுகோள் வலிமையை, மரியாதையான தமிழ் ஏவல் வடிவில் காக்கிறது.
- source_word: תְפִלָּתִי
  choice: என் விண்ணப்பம்
  rationale: תְּפִלָּה என்பதன் ‘ஜெபம்/வேண்டுதல்’ பொருளைத் தருவதோடு, துயருற்றவரின் நேரடி மன்றாட்டுக்கு இயல்பான சங்கீத நடையை வழங்குகிறது.
- source_word: וְשַׁוְעָתִי
  choice: என் உதவிக்குரல்
  rationale: שַׁוְעָה என்பது பொதுவாக உதவி நாடும் கூக்குரலைக் குறிக்கிறது; ‘உதவிக்குரல்’ அதன் உணர்ச்சியையும் நோக்கத்தையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: אֵלֶיךָ
  choice: உம்மிடம்
  rationale: אֶל என்ற திசை காட்டும் முன்னிடைச்சொல்லையும் இரண்டாம் நபர் ஒருமை பின்னொட்டையும், ‘வந்து சேருதல்’ என்பதோடு இயல்பாக இணைக்கிறது.
- source_word: תָבֹוא
  choice: வந்து சேரட்டும்
  rationale: בוא என்பதன் இயக்கப் பொருளையும், சூழலில் உள்ள விருப்ப/வேண்டுகோள் வலிமையையும் காக்கிறது; தமிழில் ‘உம்மிடம் வரட்டும்’ என்பதைவிட ‘வந்து சேரட்டும்’ இயல்பாக உள்ளது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை ஒரு பட்டத்தை அல்ல, YHWH என்ற தனிப்பெயரைப் பயன்படுத்துகிறது. ‘யாவே’ என்பது பொதுவாக ஏற்கப்படும் உச்சரிப்பைத் தமிழில் ஒலிபெயர்த்து, பெயருக்கும் பட்டத்துக்கும் உள்ள வேறுபாட்டைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் சங்கீதத்திற்குரிய மன்றாட்டு நடையும் காக்கப்பட்டுள்ளன. ‘கேளும்’, ‘உம்மிடம்’ ஆகிய வடிவங்கள் தெய்வத்தை நோக்கிய கண்ணியமான ஒருமை அழைப்பைத் தருகின்றன; மிகப் பழமையான அல்லது கடினமான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
