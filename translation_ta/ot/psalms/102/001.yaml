  rationale: 'திருத்தம் மூல எபிரெயத்தின் இணைநடை மற்றும் சொற்பொருளை நெருக்கமாகக் காக்கிறது: תְּפִלָּהக்கு “ஜெபம்,” שַׁוְעָהக்கு விளக்கச் சேர்க்கையற்ற “கூக்குரல்,” மற்றும் תָבֹואக்கு எளிய விருப்ப வடிவமான “வரட்டும்” பயன்படுத்தப்பட்டுள்ளன. தெய்வீகப் பெயரான யְהוָה “யாவே” என்றே காக்கப்பட்டுள்ளது.'
