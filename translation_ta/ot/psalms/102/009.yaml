  register: நவீனத் தரமான, கண்ணியமான புலம்பல் நடை. எபிரெயக் கவிதையின் இரு இணை வரிகளும் உவமையும் பாதுகாக்கப்பட்டுள்ளன; இயல்பான தமிழுக்காக ‘அழுகையோடு’ என்பதற்குப் பதிலாக ‘கண்ணீரோடு’ முதன்மை உரையில் பயன்படுத்தப்பட்டு, நேரடி வடிவம் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
