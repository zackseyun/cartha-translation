  text: כִּי אֵ֭פֶר כַּ/לֶּ֣חֶם אָכָ֑לְתִּי וְ֝/שִׁקֻּוַ֗/י בִּ/בְכִ֥י מָסָֽכְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/009.yaml
  text: For I have eaten ashes like bread[a], and mixed my drink with weeping.
translation:
  language: ta
  text: 'ஏனெனில், நான் அப்பத்தைப் போலச் சாம்பலைத் தின்றேன்;

    என் பானத்தைக் கண்ணீரோடு கலந்தேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'சொல்லுக்கு சொல்: “என் பானத்தை அழுகையோடு கலந்தேன்.” இங்கு “அழுகை” என்பது இன்னும் நேரடியாக “கண்ணீர்” என மொழிபெயர்க்கப்பட்டுள்ளது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள புலம்பலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் காரணப் பொருளை இயல்பாகக் காட்டுகிறது.
- source_word: אֵפֶר
  choice: சாம்பல்
  rationale: துக்கம், தாழ்வு ஆகிய சூழலில் אֵפֶר என்பதற்குரிய நேரடியான பொருளைத் தருகிறது; தமிழில் ஒருமை வடிவம் பொதுப்பொருளில் இயல்பானது.
- source_word: כַּלֶּחֶם
  choice: அப்பத்தைப் போல
  rationale: כְּ ஒப்புமையைக் குறிக்கிறது; மூலத்தின் உவமையைத் தெளிவாகப் பாதுகாக்கிறது.
- source_word: אָכָלְתִּי
  choice: தின்றேன்
  rationale: முதலாம் நபர் ஒருமை நிறைவுச்செயலைச் சுருக்கமாகவும் புலம்பல் நடைக்கு ஏற்றவாறும் தெரிவிக்கிறது.
- source_word: שִׁקֻּוַי
  choice: என் பானம்
  rationale: இங்கு சாதாரணமாக அருந்தும் பானத்தைக் குறிக்கிறது; பலியிடும் பானம் என்ற வழிபாட்டுப் பொருளைத் தேவையின்றி சேர்ப்பதைத் தவிர்க்கிறது.
- source_word: בִּבְכִי
  choice: கண்ணீரோடு
  rationale: சொற்பொருள் ‘அழுகையோடு’ என்றாலும், பானத்துடன் கலத்தல் என்ற உருவகத்தில் கண்ணீர் என்பது தமிழில் இயல்பான, உறுதியான பொருளாக்கம்; அடிப்படைச் சொற்பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: מָסָכְתִּי
  choice: கலந்தேன்
  rationale: திரவங்களை ஒன்றோடொன்று கலத்தல் என்ற வினையின் பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது.
