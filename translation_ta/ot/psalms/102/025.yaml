  text: முற்காலத்தில் நீர் பூமிக்கு அடித்தளமிட்டீர்[a]; வானங்கள் உமது கைகளின் வேலை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பண்டைக்காலத்தில் நீர் பூமியின் அடித்தளத்தை இட்டீர்.”
    reason: לְפָנִים என்பதற்கான “பண்டைக்காலத்தில்” மற்றும் יָסַדְתָּ என்பதற்கான “அடித்தளத்தை இட்டீர்” ஆகிய இயல்பான மாற்று மொழிபெயர்ப்புகளைப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: לְפָנִים
  choice: நெடுங்காலத்துக்கு முன்பே
  rationale: ‘முன்னாளில்/பண்டைக்காலத்தில்’ என்ற காலப்பொருளை இயல்பான நவீன தமிழில் தெரிவிக்கிறது; ‘முன்பே’ என்பது தொன்மையையும் வலியுறுத்துகிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: இணைவரியில் வரும் ‘வானங்கள்’ என்பதுடன் சேர்ந்து அண்டம்சார்ந்த பொருளைத் தருவதால் ‘நாடு’ என்பதற்குப் பதில் ‘பூமி’ பொருத்தமானது.
- source_word: יָסַדְתָּ
  choice: அடித்தளம் அமைத்தீர்
  rationale: יסד என்ற வினையின் அடித்தளமிடுதல்/நிறுவுதல் என்ற உருவகத்தைத் தெளிவாகக் காக்கிறது; தமிழிலும் படைப்பின் உறுதிப்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּמַעֲשֵׂה
  choice: படைப்பு
  rationale: ‘செயல்/கைவேலை’ என்ற பொருளில், வானங்கள் தேவனுடைய கைகளால் உண்டாக்கப்பட்டவை என்பதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: יָדֶיךָ
  choice: உமது கைகளின்
  rationale: எபிரெய மொழியின் பன்மை வடிவத்தையும் தெய்வீகக் கைவினையைச் சித்தரிக்கும் மனிதவுருவப் படிமத்தையும் காக்கிறது.
- source_word: שָׁמָיִם
  choice: வானங்கள்
  rationale: எபிரெயச் சொல்லின் வடிவத்தையும் ‘பூமி’ என்பதுடனான அண்டம்சார்ந்த கவிதை இணைநிலையையும் காக்கிறது.
theological_decisions:
- issue: படைப்புச் செயல் நேரடியாக தேவனுக்குரியதாகக் கூறப்படுதல்
  choice: இரண்டாம் நபர் மரியாதை வடிவில், பூமிக்கு அடித்தளம் அமைத்தவரும் வானங்களைத் தமது கைகளால் படைத்தவரும் தேவனே என்று நேரடியாகக் கூறுதல்.
  alternative: மனிதவுருவக் கூறான ‘கைகள்’ என்பதைத் தணித்து, ‘நீர் வானங்களைப் படைத்தீர்’ என்று மட்டும் மொழிபெயர்த்தல்.
  rationale: மூலவசனம் படைப்பை நேரடியாக தேவனுக்குக் கூறுவதோடு ‘உமது கைகளின் படைப்பு’ என்ற கவித்துவப் படிமத்தையும் வைத்திருக்கிறது. அதைத் தணிக்காமலும் மேலதிக கோட்பாட்டு விளக்கம் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் dignified prayer register பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘நீர்/உமது’ கையாளப்பட்டுள்ளன. கவித்துவ இணைநிலையும் ‘கைகளின்’ மனிதவுருவப் படிமமும் காக்கப்பட்டுள்ளன.
