  naturalness: “நெடுங்காலத்துக்கு முன்பே” is understandable but more expansive and less idiomatic in this elevated poetic line than “முற்காலத்தில்.” “பூமிக்கு அடித்தளம் அமைத்தீர்” is intelligible; “அடித்தளமிட்டீர்” is more concise and natural in modern standard Tamil.
  terminology: “பூமி,” “வானங்கள்,” “நீர்,” and “உமது கைகள்” are suitable for the cosmic scope, dignified prayer register, and retained anthropomorphic image. “உமது கைகளின் வேலை” represents the Hebrew construct phrase without adding theological interpretation.
