  text: From the sound of my groaning[b][a], my bones cling to my flesh.
translation:
  language: ta
  text: என் முனகலின் சத்தத்தினால்[a], என் எலும்புகள் என் சதையோடு[b] ஒட்டிக்கொண்டிருக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் முனகலின் சத்தத்தினின்று.” எபிரேய முன்னிடைச்சொல் காரணத்தையும் மூலத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் தோலோடு.” கடுமையான மெலிவைக் குறிக்கும் இச்சூழலில் எபிரேயச் சொல் இவ்வாறு புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: என் முனகலின் சத்தத்தால்
  rationale: מִן + קוֹל இங்கு முனகலால் ஏற்பட்ட விளைவைச் சுட்டும் காரணப் பொருளில் இயல்பாகப் புரிந்துகொள்ளப்படுகிறது. அதே நேரத்தில், எபிரெய முன்னிடைச்சொல் மூலத்தையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: אַנְחָתִי
  choice: என் முனகல்
  rationale: துன்பத்திலிருந்து எழும் ஆழ்ந்த பெருமூச்சையோ முனகலையோ குறிக்கும் சொல். புலம்பலின் தீவிரத்தையும் கேட்கக்கூடிய வெளிப்பாட்டையும் ‘முனகல்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: דָּבְקָה
  choice: ஒட்டிக்கொண்டன
  rationale: דבק என்பதன் அடிப்படைப் பொருள் உறுதியாக ஒட்டுதல் அல்லது பற்றிக்கொள்ளுதல். உடல் மெலிந்த நிலையைச் சித்தரிக்கும் காட்சியை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: עַצְמִי
  choice: என் எலும்புகள்
  rationale: வடிவில் ஒருமையாக இருந்தாலும் இங்கு கூட்டுப்பொருளில் உடலின் எலும்புக்கூட்டைச் சுட்டுகிறது; தமிழில் பன்மை இயல்பானது.
- source_word: לִבְשָׂרִי
  choice: என் சதையோடு
  rationale: בָּשָׂר என்பதன் நேரடியான பொருள் ‘சதை’. கடுமையான மெலிவின் சூழலில் ‘தோல்’ என்றும் புரிந்துகொள்ள வாய்ப்புள்ளதால் அது அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
