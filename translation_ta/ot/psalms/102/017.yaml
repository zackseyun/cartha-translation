  yaml_path: translation/ot/psalms/102/017.yaml
  text: He turned to the prayer of the destitute and did not despise their prayer[a].
translation:
  language: ta
  text: 'ஆதரவற்றோரின் மன்றாட்டை அவர் நோக்கினார்;

    அவர்களுடைய மன்றாட்டை அவர் இகழவில்லை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வறியோர்’ அல்லது ‘உதவியற்றோர்’ என்றும் மொழிபெயர்க்கலாம். இந்த எபிரெயச் சொல் வேறு சூழல்களில் பாலைவனப் புதரையும் குறிக்கலாம்; இங்கு அது நிராதரவான அல்லது தனிமையானவரைச் சுட்டும் உருவகப் பின்னணியாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנָה
  choice: கவனித்தார்
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘திரும்புதல்/நோக்கித் திரும்புதல்’. மன்றாட்டை நோக்கிய செயலைத் தமிழில் இயல்பாகவும், செவிகொடுத்து ஏற்றுக்கொள்ளும் நுண்பொருளுடனும் ‘கவனித்தார்’ தெரிவிக்கிறது.
- source_word: תְּפִלַּת / תְּפִלָּתָם
  choice: மன்றாட்டை / மன்றாட்டை
  rationale: இரண்டு இடங்களிலும் ஒரே எபிரெயப் பெயர்ச்சொல் வருவதால் அதன் மீளுரைப்பைப் பாதுகாக்கிறது. இச்சூழலில் ‘மன்றாட்டு’ என்பது துன்பத்திலுள்ளவர்களின் இறைவேண்டுதலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הָעַרְעָר
  choice: ஆதரவற்றோர்
  rationale: இங்கு பிரார்த்தனை செய்பவர்களைக் குறிக்கும் மனிதப் பயன்பாடு தேவைப்படுகிறது. இச்சொல் வறுமையுற்ற, அனைத்தும் பறிக்கப்பட்ட அல்லது தனிமைப்படுத்தப்பட்ட நிலையை உணர்த்தக்கூடும்; ‘ஆதரவற்றோர்’ அந்தப் பரந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: בָזָה
  choice: இகழவில்லை
  rationale: בזה என்பதன் அவமதித்தல், அற்பமாக எண்ணுதல் என்ற மதிப்பீட்டு வலிமையை ‘இகழவில்லை’ தெளிவாகப் பாதுகாக்கிறது.
theological_decisions:
- issue: עַרְעָר என்பதன் மனிதவியல் பொருள்
  choice: ஆதரவற்ற மனிதர்கள்
  alternative: தனித்திருப்பவர்; வறியவர்; பாலைவனப் புதரைப் போன்றவர்
  rationale: ‘அவர்களுடைய மன்றாட்டு’ என்ற அடுத்த தொடர் மனிதர்களைக் குறிக்கிறது. ஆகவே முதன்மை உரை மனித நிலையைக் குறிப்பிடுகிறது; சொல்லின் அரிதான உருவக அல்லது தாவரப் பின்னணி அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை. எபிரெய உரையிலுள்ள ‘மன்றாட்டு’ என்ற சொல்லின் மீளுரை பாதுகாக்கப்பட்டுள்ளது; ஒருமை வடிவிலுள்ள கூட்டுப்பொருள் தமிழில் இயல்பாகப் பன்மை மனிதக் குறிப்புடன் வழங்கப்பட்டுள்ளது.
