  yaml_path: translation/ot/psalms/102/000.yaml
  text: A prayer of the afflicted one when he grows faint and pours out his complaint before Yahweh[a][b].
translation:
  language: ta
  text: 'துன்புறுகிறவனின் ஜெபம்: அவன் சோர்ந்துபோகும்போது, யாவேவின் முன்பாகத் தன் புலம்பலை ஊற்றுகிறான்[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “சோர்ந்துபோகும்போது” என்பதற்கு “துயரத்தால் ஆட்கொள்ளப்படும்போது” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: “தன் புலம்பலை” என்பதற்கு “தன் முறையீட்டை” அல்லது “தன் தியானத்தை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: மன்றாட்டு
  rationale: சங்கீதத் தலைப்புக்கு ஏற்ற, இயல்பானதும் கண்ணியமானதும் ஆன தமிழ்ச்சொல்; துயரத்தில் ஏறெடுக்கப்படும் வேண்டுதலைக் குறிக்கிறது.
- source_word: לְעָנִי
  choice: துன்புற்றவன்
  rationale: לְ தலைப்பில் தொடர்பைச் சுட்டுகிறது; עָנִי என்பது பொருளாதார ஏழ்மையை மட்டும் அல்லாமல் ஒடுக்கப்பட்ட அல்லது துன்புற்ற நிலையையும் குறிக்கலாம். எபிரெய ஆண்பால் ஒருமையைத் தமிழ் இயல்பில் காக்கிறது.
- source_word: כִּי
  choice: -போது
  rationale: இங்கு மன்றாட்டு ஏறெடுக்கப்படும் சூழ்நிலையை அறிமுகப்படுத்தும் காலப்பொருள் இயல்பானது.
- source_word: יַעֲטֹף
  choice: சோர்ந்துபோகும்
  rationale: வலுவிழத்தல் அல்லது தாங்கமுடியாமல் ஆட்கொள்ளப்படுதல் என்ற பொருள் வரம்பில், முதன்மை உரையில் தெளிவான நவீனத் தமிழை வழங்குகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: וְלִפְנֵי יְהוָה
  choice: யாவேக்கு முன்பாக
  rationale: לִפְנֵי என்பதன் முன்னிலையில் என்ற உறவுப்பொருளைக் காக்கிறது; יהוה என்ற திருப்பெயர் ஒலிபெயர்ப்பாக யாவே என்று வழங்கப்படுகிறது.
- source_word: יִשְׁפֹּךְ
  choice: ஊற்றும்
  rationale: உள்ளத்தின் துயரை தேவனுக்கு முன் ஊற்றுதல் என்ற எபிரெய உருவகத்தைத் தமிழிலும் நேரடியாகவும் இயல்பாகவும் காக்கிறது.
- source_word: שִׂיחוֹ
  choice: தன் முறையீட்டை
  rationale: இச்சூழலில் துயரமிக்க புகார் அல்லது புலம்பல் சார்ந்த பேச்சைச் சுட்டுகிறது. சொல்லின் தியானம்/புலம்பல் என்ற பொருள் அகலம் அடிக்குறிப்பில் காக்கப்படுகிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை நான்கெழுத்துத் திருப்பெயரை நேரடியாகப் பயன்படுத்துவதால், பொதுவான தமிழ் ஒலிப்புக்கு ஏற்ற வகையில் உடன்படிக்கைப் பெயரை யாவே என்று ஒலிபெயர்க்கிறது.
- issue: לְעָנִי என்பதில் தலைப்பின் தொடர்பும் பாலினமும்
  choice: துன்புற்றவன்
  alternative: துன்புற்றவரின்; துன்புற்ற ஒருவரின்
  rationale: எபிரெயச் சொல் ஆண்பால் ஒருமையில் உள்ளது. ஆனால் இது குறிப்பிட்ட ஆசிரியத்துவத்தைத் தீர்மானிப்பதில்லை; துன்புற்ற ஆண் ஒருவருடன் தொடர்புடைய மன்றாட்டு என்ற தலைப்பின் திறந்த தன்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத் தலைப்புக்குரிய சுருக்கமான கண்ணிய நடையில் அமைக்கப்பட்டது. எபிரெய உருவகமும் சொற்பொருள் ஐயங்களும் அடிக்குறிப்புகளுடன் காக்கப்பட்டுள்ளன; வசன எண் 0 என்பது தலைப்பைக் குறிக்கிறது.
