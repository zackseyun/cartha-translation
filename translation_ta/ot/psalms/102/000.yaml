revisions:
- from: துன்புற்றவன் சோர்ந்துபோகும்போது, யாவேக்கு முன்பாகத் தன் முறையீட்டை ஊற்றும் மன்றாட்டு[a][b].
  to: 'துன்புறுகிறவனின் ஜெபம்: அவன் சோர்ந்துபோகும்போது, யாவேவின் முன்பாகத் தன் புலம்பலை ஊற்றுகிறான்[a][b].'
  rationale: The revision supplies the Tamil genitive required by the superscription, makes the two actions syntactically explicit, and uses idiomatic wording for being before Yahweh. It retains the source’s singular masculine reference without identifying the afflicted person, preserves the Hebrew pouring-out metaphor, and keeps the semantic alternatives for יַעֲטֹף and שִׂיחוֹ in anchored footnotes.
