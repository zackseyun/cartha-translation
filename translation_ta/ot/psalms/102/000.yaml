review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the superscription’s main elements: prayer, afflicted person, faintness, pouring out, and Yahweh. However, its Tamil syntax leaves the opening relationship unclear: “துன்புற்றவன் … ஊற்றும் மன்றாட்டு” can read as an awkward relative construction rather than the heading “A prayer of/for an afflicted person.”'
  naturalness: A genitive heading followed by a finite verbal clause is clearer and more natural in modern standard Tamil. “யாவேவின் முன்பாக” is also more idiomatic than “யாவேக்கு முன்பாக” in this context.
  terminology: “ஜெபம்” is the most broadly natural modern Tamil equivalent for תְּפִלָּה in a psalm superscription. “புலம்பல்” naturally conveys the lament/complaint sense of שִׂיחוֹ while the lexical range is retained in the note. “யாவே” correctly reflects יהוה.
  issues:
  - severity: medium
    issue: The heading construction lacks the required genitive relationship.
    rationale: The Hebrew לְעָנִי functions in the superscription as “of/for an afflicted person.” The draft’s nominative “துன்புற்றவன்” followed by “ஊற்றும் மன்றாட்டு” is grammatically and stylistically awkward and does not clearly mark that relation.
  - severity: low
    issue: “யாவேக்கு முன்பாக” is less idiomatic Tamil.
    rationale: For presence before a person, “யாவேவின் முன்பாக” is the more natural Tamil expression and retains לִפְנֵי יהוה.
  - severity: low
    issue: The verbal relationship of the two Hebrew imperfects is obscured.
    rationale: Using “அவன் சோர்ந்துபோகும்போது … ஊற்றுகிறான்” clearly conveys the stated circumstance and action.
  revised_text: 'துன்புறுகிறவனின் ஜெபம்: அவன் சோர்ந்துபோகும்போது, யாவேவின் முன்பாகத் தன் புலம்பலை ஊற்றுகிறான்[a][b].'
