id: PSA.102.28
reference: Psalms 102:28
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בְּנֵֽי עֲבָדֶ֥י/ךָ יִשְׁכּ֑וֹנוּ וְ֝/זַרְעָ֗/ם לְ/פָנֶ֥י/ךָ יִכּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/028.yaml
  text: The children of your servants will dwell[a], and their offspring will be established before you.
translation:
  language: ta
  text: உமது ஊழியர்களின் பிள்ளைகள் குடியிருப்பார்கள்; அவர்களுடைய சந்ததி உமது முன்னிலையில் நிலைநிறுத்தப்படும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: பிள்ளைகள்
  rationale: בֵּן என்பதன் பன்மை இணைப்புவடிவம். இங்கு ஊழியர்களின் வழிவந்தோரைக் குறிக்கும் இயல்பான, பாலினத்தால் தேவையின்றிக் கட்டுப்படுத்தாத தமிழ்ச் சொல்.
- source_word: עֲבָדֶיךָ
  choice: உமது ஊழியர்களின்
  rationale: கடவுளை நோக்கிய சங்கீதச் சூழலில் עֶבֶד என்பதற்கு ‘ஊழியர்’ என்பது இயல்பாகவும் மரியாதையுடனும் பொருந்துகிறது; ‘அடிமை’ என்ற சமூகநிலை நுணுக்கம் இங்கு முன்னிலைப்படுத்தப்படவில்லை.
- source_word: יִשְׁכּוֹנוּ
  choice: குடியிருப்பார்கள்
  rationale: שׁכן என்பது குடியிருத்தல், தங்கியிருத்தல், வசித்தல் என்று பொருள்படும். மூலத்தில் வெளிப்படையாக இல்லாத ‘பாதுகாப்பாக’ என்ற கருத்தைச் சேர்க்காமல், நிலையான வசிப்பைக் காட்டுகிறது.
- source_word: וְזַרְעָם
  choice: அவர்களுடைய சந்ததி
  rationale: זֶרַע இங்கு கூட்டுப்பொருளில் வழிவந்தோரைச் சுட்டுகிறது. ‘சந்ததி’ அதன் தலைமுறைத் தொடர்ச்சியையும் கூட்டுப்பொருளையும் சுருக்கமாகப் பாதுகாக்கிறது.
- source_word: לְפָנֶיךָ
  choice: உமது முன்னிலையில்
  rationale: சொற்றொடர் நேரடியாக ‘உமது முகத்திற்கு முன்பாக’ என்பதைக் குறிக்கிறது; தமிழில் ‘உமது முன்னிலையில்’ என்பது கடவுளின் சந்நிதி என்ற பொருளையும் இயல்பாகத் தருகிறது.
- source_word: יִכּוֹן
  choice: நிலைநிறுத்தப்படும்
  rationale: כון என்பதன் நிஃபால் வடிவம் நிறுவப்படுதல் அல்லது உறுதியாக நிலைநிறுத்தப்படுதல் என்ற செயப்பாட்டு/விளைவுப் பொருளைக் கொண்டுள்ளது.
theological_decisions:
- issue: வாக்குறுதியை வெளிப்படையாக உடன்படிக்கை சார்ந்ததாகவோ இறுதிக்காலம் சார்ந்ததாகவோ ஆக்குவதா
  choice: கடவுளின் முன்னிலையில் அவருடைய ஊழியர்களின் சந்ததி தொடர்ந்து குடியிருந்து நிலைநிறுத்தப்படும் என்ற அளவிலேயே மொழிபெயர்த்தல்
  alternative: இஸ்ரவேலின் வம்சத்துக்கான வெளிப்படையான உடன்படிக்கை வாக்குறுதியாகவோ இறுதி இரட்சிப்புக்கான வெளிப்படையான வாக்குறுதியாகவோ விரித்துரைத்தல்
  rationale: எபிரெய உரை குடியிருத்தலையும் கடவுளின் முன்னிலையில் நிலைநிறுத்தப்படுதலையும் கூறுகிறது; அதன் குறிப்பிட்ட கோட்பாட்டு நடைமுறையையோ கால எல்லையையோ வரையறுக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதத்திற்கேற்ற கண்ணியமான நடை. தெய்வத்தை நோக்கும் இரண்டாம் நபருக்கு ‘உமது’ பயன்படுத்தப்பட்டது. மூலத்தில் இல்லாத பாதுகாப்பு நுணுக்கம் சேர்க்கப்படவில்லை.
