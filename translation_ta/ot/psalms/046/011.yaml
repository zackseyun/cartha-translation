  rationale: எபிரெய இணைப்புத் தொடரையும் உடன்படிக்கை சார்ந்த அடையாளத்தையும் இயல்பான தமிழில் பேணுகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான வழிபாட்டு அல்லது இசைப் பணி உறுதியற்றதால் பொருள் தீர்மானிக்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה צְבָאוֹת என்ற இறைப்பெயரும் பட்டமும்
  choice: படைகளின் யாவே
  alternative: சேனைகளின் ஆண்டவர்
  rationale: יְהוָה என்பதை ஒரு பட்டத்தால் மாற்றாமல் தனிப்பெயராகப் பேணுகிறது; צְבָאוֹת என்பதன் படைசார் பொருளையும் வெளிப்படையாக வைத்திருக்கிறது.
- issue: מִשְׂגָּב என்பதன் உருவகம்
  choice: உயர்கோட்டை
  alternative: அடைக்கலம்
  rationale: பொதுவான பாதுகாப்பு என்ற பொருளை மட்டும் தராமல், உயர்ந்த அரணிடத்தின் உருவகத்தையும் பேணுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் அதேவேளையில் சங்கீதத்துக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. யாவே என்ற இறைப்பெயர் ஒலிபெயர்க்கப்பட்டுள்ளது; உயர்ந்த அரணிடத்தின் மூல உருவகம் ‘உயர்கோட்டை’ எனப் பேணப்பட்டுள்ளது. அடிக்குறிப்புக் குறிகள் உரையில் பொருத்தமான சொற்களுக்குப் பின்பு வரிசையாக இடப்பட்டுள்ளன.
