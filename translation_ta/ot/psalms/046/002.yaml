  terminology: “ஆகையால்,” “பூமி,” “மலைகள்,” and “அஞ்சமாட்டோம்” are appropriate standard Tamil choices. The revised verb better preserves the lexical force of מוֹט without importing an unnecessarily specific mechanism of collapse.
