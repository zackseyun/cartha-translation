  yaml_path: translation/ot/psalms/046/002.yaml
  text: Therefore we will not fear though the earth changes[b][a], though the mountains slip into the heart of the seas.
translation:
  language: ta
  text: 'ஆகையால், பூமி நிலைமாறினாலும்[a],

    மலைகள் கடல்களின் நடுவே தள்ளாடினாலும்[b],

    நாங்கள் அஞ்சமாட்டோம்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமி மாறினாலும்’ / ‘பூமி மாற்றப்பட்டாலும்.’ எபிரெய வினை மாறுதல் அல்லது மாற்றப்படுதல் என்பதைக் குறிக்கலாம்; இச்சூழலில் பூமியின் நிலைத்தன்மை குலைவதை விவரிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘மலைகள் கடல்களின் நடுவே நிலைகுலைந்தாலும்’ / ‘சரிந்தாலும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: ஆகையால்
  rationale: முந்தைய வசனத்தில் தேவன் அடைக்கலமும் வல்லமையுமாக இருப்பதாகக் கூறப்பட்டதிலிருந்து வரும் முடிவை இயல்பாகக் குறிக்கிறது.
- source_word: לֹא נִירָא
  choice: நாங்கள் அஞ்சமாட்டோம்
  rationale: முதல் நபர் பன்மை முற்றுப்பெறாத வினை இச்சூழலில் உறுதியையும் நம்பிக்கையையும் வெளிப்படுத்துகிறது; எதிர்மறை எதிர்கால வடிவம் தமிழில் இதைத் தெளிவாகக் காட்டுகிறது.
- source_word: בְּהָמִיר אָרֶץ
  choice: பூமி நிலைமாறினாலும்
  rationale: מוּר என்பது மாறுதல் அல்லது மாற்றப்படுதல் எனப் பொருள்படலாம். பேரழிவுச் சூழலில் பூமியின் நிலைத்தன்மை குலைவதை ‘நிலைமாறுதல்’ இயல்பாக வெளிப்படுத்துகிறது; அதேவேளை வினையின் அடிப்படை ‘மாறுதல்’ பொருளையும் காக்கிறது.
- source_word: וּבְמוֹט הָרִים
  choice: மலைகள் ... நிலைகுலைந்தாலும்
  rationale: מוֹט என்பது அசைதல், தள்ளாடுதல், நிலைதவறுதல் ஆகிய பொருள்களைக் கொண்டது. ‘நிலைகுலைதல்’ மலைகளின் உறுதி சிதையும் கவித்துவப் படிமத்தைத் தெளிவாகக் கொடுக்கிறது.
- source_word: בְּלֵב יַמִּים
  choice: கடல்களின் நடுவே
  rationale: לֵב என்பதன் நேர்ப்பொருள் ‘இதயம்’; இடத்தைக் குறிக்கும் மரபுத்தொடரில் அது ‘மையம்/நடுவிடம்’ எனப் பொருள்படும். ‘நடுவே’ என்பது இயல்பான தமிழில் அந்த இடப்பொருளைக் காக்கிறது; יַמִּים என்ற பன்மையும் ‘கடல்கள்’ எனத் தக்கவைக்கப்படுகிறது.
