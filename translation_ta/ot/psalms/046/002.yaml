translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்தின் கண்ணியமான கவித்துவ நடையைத் தக்கவைக்கும் வகையில் அமைக்கப்பட்டது. இயல்பான தமிழ் வாக்கிய ஓட்டத்திற்காக ‘நாங்கள் அஞ்சமாட்டோம்’ இறுதியில் வைக்கப்பட்டுள்ளது; எபிரெய இணை அமைப்பும் இரு ‘-ஆலும்’ தொடர்களால் பாதுகாக்கப்பட்டுள்ளது.
