  yaml_path: translation/ot/psalms/046/007.yaml
  text: Yahweh of Armies is with us; the God of Jacob is a stronghold for us[a]. Selah
translation:
  language: ta
  text: 'படைகளின் யாவே[a] நம்மோடு இருக்கிறார்;

    யாக்கோபின் இறைவன் நமக்கு உயர்ந்த அரணாக இருக்கிறார்.

    சேலா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: பாரம்பரியமாக, “சேனைகளின் ஆண்டவர் நம்மோடு இருக்கிறார்” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: இறைப் பெயரையும் צְבָאוֹת என்ற சொல்லையும் வழங்கும் பாரம்பரிய மொழிபெயர்ப்பு முறையைச் சுட்டுகிறது.
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய உச்சரிப்புக்கு நெருக்கமான தமிழெழுத்துப் பெயர்ப்பாக வழங்குகிறது.
- source_word: צְבָאוֹת
  choice: படைகளின்
  rationale: இச்சொல் படைத்திரள்களைக் குறிக்கிறது; பழைய வழக்கான ‘சேனைகள்’ என்பதைவிட ‘படைகள்’ இன்றைய வாசகருக்கு நேரடியாகப் புரியும், மேலும் அதன் போர் மற்றும் விண்ணுலகப் படைத்திரள் சார்ந்த வலிமையையும் தக்கவைக்கிறது.
- source_word: עִמָּנוּ
  choice: நம்மோடு இருக்கிறார்
  rationale: உடனிருப்பு, துணைநிற்றல், பாதுகாப்பு ஆகிய கருத்துகளை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: מִשְׂגָּב
  choice: உயர்ந்த அரண்
  rationale: எட்ட முடியாத உயரத்தில் உள்ள பாதுகாப்பான அடைக்கலம் அல்லது அரண் என்ற சொல்லின் பொருளைத் தக்கவைக்கிறது; வெறும் ‘அடைக்கலம்’ என்பதைக் காட்டிலும் அதன் உயர்ந்த, வலுவான பாதுகாப்புத் தன்மையை வெளிப்படுத்துகிறது.
- source_word: לָנוּ
  choice: நமக்கு
  rationale: இங்கு உள்ள לְ முன்னொட்டு உறவு அல்லது பயனைச் சுட்டுகிறது; ‘நமக்கு’ என்பது இதைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: யாக்கோபின் இறைவன்
  rationale: எபிரெய இணைப்புத் தொடரை நேரடியாக வழங்கி, இஸ்ரவேலின் முற்பிதாவான யாக்கோபுடனான உடன்படிக்கைத் தொடர்பைப் பாதுகாக்கிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான பொருளும் இசைச்செயல்பாடும் உறுதியாகத் தெரியாததால், விளக்கமாக மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: יְהוָה צְבָאוֹת என்ற இறைப் பட்டத்தை மொழிபெயர்த்தல்
  choice: படைகளின் யாவே
  alternative: சேனைகளின் ஆண்டவர்
  rationale: மூலத்தில் இறைவனின் தனிப்பெயரான יְהוָה நேரடியாக உள்ளது. ஆகவே அதை ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றாமல் ‘யாவே’ என்று வழங்கி, צְבָאוֹת என்பதன் படைத்திரள் சார்ந்த பொருளையும் வெளிப்படையாகத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், கவிதைநடையின் இணை அமைப்பைத் தக்கவைத்து மொழிபெயர்க்கப்பட்டுள்ளது. ‘இருக்கிறார்’ இரு அடிகளிலும் வெளிப்படையாகச் சேர்க்கப்பட்டதால், எபிரெய மொழியின் வினையற்ற வாக்கியங்கள் தமிழில் இயல்பாகவும் மரியாதையுடனும் ஒலிக்கின்றன.
