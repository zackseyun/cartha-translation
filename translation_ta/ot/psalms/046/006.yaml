lexical_decisions:
- source_word: הָמוּ
  choice: கொந்தளித்தன
  rationale: இந்த வினைச்சொல் பேரொலியையும் கலகத்துடன் கூடிய குழப்பத்தையும் குறிக்கிறது. ‘கொந்தளித்தன’ என்பது ஒலி, அமைதியின்மை, எதிர்ப்புணர்வு ஆகியவற்றை இயல்பான தமிழில் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: גּוֹיִם
  choice: நாடுகள்
  rationale: இங்கு அரசியல் மக்களினங்களையும் தேசங்களையும் பொதுவாகக் குறிக்கிறது; அடுத்துள்ள ‘அரசுகள்’ என்பதோடு கவிதை இணைப்பையும் பேணுகிறது.
- source_word: מָטוּ
  choice: தள்ளாடின
  rationale: நிலைகுலைதல், சாய்தல், வீழும் நிலையில் இருத்தல் ஆகிய உருவகத்தை இது பேணுகிறது; முழுமையாக ‘வீழ்ந்தன’ என்று பொருளை மிகைப்படுத்தவில்லை.
- source_word: מַמְלָכוֹת
  choice: அரசுகள்
  rationale: அரசியல் ஆட்சியமைப்புகள் அல்லது ராஜ்யங்களைக் குறிக்கும் இயல்பான நவீனத் தமிழ் சொல். ‘ராஜ்யங்கள்’ என்பதைக் காட்டிலும் பொதுவாசகர்களுக்கு நேரடியானது.
- source_word: נָתַן בְּקוֹלוֹ
  choice: அவர் குரலெழுப்பினார்
  rationale: எபிரேய மொழியின் நேரடிப் பொருள் ‘தமது குரலைக் கொடுத்தார்.’ ‘குரலெழுப்பினார்’ என்பது அந்த வலிமையான குரல் வெளிப்பாட்டை இயல்பான, சுருக்கமான தமிழில் தருகிறது; வெறும் சத்தத்தின் அளவை மட்டும் குறிக்கவில்லை.
- source_word: תָּמוּג
  choice: உருகியது
  rationale: உருகுதல், கரைதல், உறுதிநிலை இழத்தல் ஆகிய கவித்துவப் படிமத்தை நேரடியாகப் பேணுகிறது.
- source_word: אָרֶץ
  choice: பூமி
  rationale: சங்கீதத்தின் உலகளாவிய சூழலும் நாடுகள் மற்றும் அரசுகளின் இணைப்பும் கருதி, குறிப்பிட்ட ஒரு ‘நிலம்’ என்பதற்குப் பதிலாக முழுப் பூமியைக் குறிக்கிறது.
theological_decisions:
- issue: נָתַן என்ற வினையின் வெளிப்படையாகக் குறிப்பிடப்படாத எழுவாய்
  choice: ‘அவர்’ என்பது கடவுளைக் குறிக்கிறது
  alternative: சுற்றியுள்ள சூழலை வெளிப்படையாக்கி ‘ஆண்டவர்’ என்று மொழிபெயர்த்தல்
  rationale: எபிரேயத்தில் ஆண்பால் ஒருமை எழுவாய் வினையிலேயே மறைந்துள்ளது. ‘அவர்’ என்பது வசனத்தின் சுருக்கத்தைப் பேணி, அந்த எழுவாய் கடவுள் என்பதைச் சுற்றியுள்ள சூழல் அடையாளப்படுத்த அனுமதிக்கிறது; மூல வசனத்தில் இல்லாத தெய்வப் பெயரைச் சேர்க்கவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவித்துவமானதாயும் சாதாரண வாசகர்களுக்குப் புரியத்தக்கதாயும் அமைக்கப்பட்டுள்ளது. இணைவரி அமைப்பும் வசனத்தின் வேகமான தெய்வீகத் தலையீடும் பேணப்பட்டுள்ளன.
