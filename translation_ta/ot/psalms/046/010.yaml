translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. ‘நானே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது. ‘உயர்ந்தவராக விளங்குவேன்’ என்பது தேவையற்ற செயப்பாட்டு இலக்கணத்தைச் சேர்க்காமல் கடவுளின் மேன்மை வெளிப்படுவதை இயல்பாகச் சொல்கிறது. அனைத்து அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
