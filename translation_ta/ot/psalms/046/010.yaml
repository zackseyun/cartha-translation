lexical_decisions:
- source_word: הַרְפּוּ
  choice: ஓய்ந்திருங்கள்
  rationale: רפה என்ற வினையின் கட்டளை வடிவம் பிடியைத் தளர்த்துதல், விட்டுவிடுதல், முயற்சியை நிறுத்துதல், ஓய்தல் ஆகிய பொருள்களைத் தரக்கூடும். சங்கீதத்தின் போர் மற்றும் நாடுகள் சார்ந்த சூழலில், வெறும் உள்ளார்ந்த அமைதியை மட்டும் குறிக்காமல் மனிதப் போராட்டத்தை நிறுத்தும் அழைப்பையும் உள்ளடக்குவதால் ‘ஓய்ந்திருங்கள்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וּדְעוּ
  choice: அறிந்துகொள்ளுங்கள்
  rationale: ידע என்பதன் நேரடிப் பொருளான ‘அறிதல்’ என்பதையும், கடவுள் யார் என்பதை உணர்ந்து ஏற்றுக்கொள்ளும் நுணுக்கத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: כִּי
  choice: என்பதை
  rationale: இங்கு כִּי, அறிந்துகொள்ள வேண்டிய உள்ளடக்கத்தை அறிமுகப்படுத்துகிறது. தமிழில் ‘நானே கடவுள் என்பதை’ என்பது இயல்பான நிரப்புவாக்கிய அமைப்பு.
- source_word: אָנֹכִי אֱלֹהִים
  choice: நானே கடவுள்
  rationale: אָנֹכִי என்ற வெளிப்படையான தனிப்பெயரின் வலியுறுத்தலை ‘நானே’ தக்கவைக்கிறது; אֱלֹהִים இங்கு ஒருமை வினைப்பொருளுடன் இஸ்ரவேலின் கடவுளைக் குறிக்கிறது.
- source_word: אָרוּם
  choice: நான் உயர்ந்தவராக விளங்குவேன்
  rationale: רום வேரின் Qal முற்றுப்பெறா வடிவம் உயர்ந்த நிலையில் இருப்பதையும் சூழலில் உறுதியாக வெளிப்படவிருக்கும் மேன்மையையும் குறிக்கிறது. ‘உயர்த்தப்படுவேன்’ என்று செயப்பாட்டு வடிவத்தைத் தேவையின்றி சேர்க்காமல், இயல்பான தமிழில் நிலை மற்றும் எதிர்கால உறுதியை வெளிப்படுத்துகிறது.
- source_word: בַּגּוֹיִם
  choice: நாடுகளிடையே
  rationale: גּוֹיִם இங்கு பல தேசிய மக்களினங்களையோ அரசியல் நாடுகளையோ குறிக்கிறது. ‘நாடுகளிடையே’ என்பது உலகளாவிய சூழலையும் எபிரெய முன்னிடைச்சொல்லின் பொருளையும் இயல்பாகத் தருகிறது.
- source_word: בָּאָרֶץ
  choice: பூமியில்
  rationale: אֶרֶץ என்பதற்கு ‘நிலம்’ அல்லது ‘பூமி’ என்று பொருள் கொள்ளலாம். ‘நாடுகளிடையே’ என்ற இணை வரியும் சங்கீதத்தின் பரந்த நோக்கும் உலகளாவிய ‘பூமி’ என்ற பொருளுக்கு ஆதரவளிக்கின்றன.
