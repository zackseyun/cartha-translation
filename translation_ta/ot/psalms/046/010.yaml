  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
translation:
  language: ta
  text: “நிறுத்துங்கள்[a]; நானே கடவுள் என்பதை அறிந்துகொள்ளுங்கள். நாடுகளிடையே நான் மேன்மைப்படுவேன்[b]; பூமியில்[c] நான் மேன்மைப்படுவேன்.”
