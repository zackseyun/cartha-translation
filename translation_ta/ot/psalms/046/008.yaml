id: PSA.46.8
reference: Psalms 46:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לְֽכוּ חֲ֭זוּ מִפְעֲל֣וֹת יְהוָ֑ה אֲשֶׁר שָׂ֖ם שַׁמּ֣וֹת בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/008.yaml
  text: Come, see the works of the LORD, who has set desolations in the earth.
translation:
  language: ta
  text: வாருங்கள், யெகோவாவின் செயல்களைப் பாருங்கள்; அவர் பூமியில் பாழாக்குதல்களை ஏற்படுத்தியிருக்கிறார்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ
  choice: வாருங்கள்
  rationale: பலரிடம் விடுக்கப்படும் அழைப்பை இயல்பான, மரியாதைமிக்க நவீன தமிழில் தெரிவிக்கிறது.
- source_word: חֲזוּ
  choice: பாருங்கள்
  rationale: வெறுமனே கண்ணால் காண்பதோடு கவனித்து உணர்வதையும் சூழல் உணர்த்துகிறது; தமிழில் இயல்பாக ‘பாருங்கள்’ என மொழிபெயர்க்கப்படுகிறது.
- source_word: מִפְעֲלוֹת
  choice: செயல்களை
  rationale: யெகோவா செய்துள்ள வல்லமையான காரியங்களைக் குறிக்கும் பொதுவான சொல்லாகும்; மூலத்தின் பரப்பைச் சுருக்கவில்லை.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை பொதுப்பட்டமான ‘கர்த்தர்’ என்று மாற்றாமல் பெயராகவே வழங்குகிறது.
- source_word: שָׂם
  choice: ஏற்படுத்தியிருக்கிறார்
  rationale: அடிப்படைப் பொருள் ‘வைத்தார்/அமைத்தார்’; இங்கு பாழாக்குதல்களை பூமியில் நிகழச் செய்தார் என்ற தொடர்பை இயல்பான தமிழில் தருகிறது.
- source_word: שַׁמּוֹת
  choice: பாழாக்குதல்களை
  rationale: அழிவுக்குள்ளான நிலை அல்லது அழிவை ஏற்படுத்தும் செயல்கள் என்ற மூலச் சொல்லின் கடுமையைப் பாதுகாக்கிறது.
- source_word: בָּאָרֶץ
  choice: பூமியில்
  rationale: ‘நாட்டில்’ என்றும் கொள்ளக்கூடிய אֶרֶץ என்பதன் பரந்த பொருளை இச்சங்கீதத்தின் உலகளாவிய சூழலுக்கு ஏற்ப வழங்குகிறது.
theological_decisions:
- issue: அழிவுக்கும் தேவனுடைய செயலுக்கும் உள்ள நேரடித் தொடர்பு
  choice: ‘அவர் ... பாழாக்குதல்களை ஏற்படுத்தியிருக்கிறார்’ என்று நேரடியாக வைத்தல்
  alternative: ‘அவர் போர்களை முடிவுக்குக் கொண்டுவந்து பாழ்நிலைகளை நீக்குகிறார்’ என்று மென்மைப்படுத்துதல்
  rationale: אֲשֶׁר שָׂם שַׁמּוֹת என்ற எபிரெய உரை பாழாக்குதல்களை யெகோவா ஏற்படுத்தியதாக நேரடியாகச் சொல்கிறது. அதன் இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மறைக்கக் கூடாது.
- issue: יְהוָה என்ற பெயரின் வெளிப்பாடு
  choice: ‘யெகோவா’ எனத் தனிப்பெயராக வழங்குதல்
  alternative: ‘கர்த்தர்’ எனப் பட்டப்பெயராக வழங்குதல்
  rationale: மூல எபிரெய உரையின் தனிப்பட்ட பெயரைத் தெளிவாகக் காக்கிறது; குறிப்பிட்ட சமய விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுமக்கள் புரிந்துகொள்ளும் கண்ணியமான அழைப்பு நடையில் அமைக்கப்பட்டது. மூலத்தின் கட்டளைத் தொனியும், தேவன் ஏற்படுத்திய பாழாக்குதல்கள் என்ற அசௌகரியமான இறையியல் பதற்றமும் பாதுகாக்கப்பட்டுள்ளன.
