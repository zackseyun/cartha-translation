  text: נָהָ֗ר פְּלָגָ֗י/ו יְשַׂמְּח֥וּ עִיר אֱלֹהִ֑ים קְ֝דֹ֗שׁ מִשְׁכְּנֵ֥י עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/004.yaml
  text: A river—its streams make glad the city of God[b][a], the holy dwelling place of the Most High.
translation:
  language: ta
  text: ஒரு நதி[a]—அதன் நீரோடைகள் கடவுளின் நகரத்தை, உன்னதமானவரின் பரிசுத்தமான வாசஸ்தலங்களை[b], மகிழ்விக்கின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு நதி உண்டு; அதன் நீரோடைகள் கடவுளின் நகரத்தை மகிழ்விக்கின்றன.” எபிரெயக் கவிதை வினையில்லாமல் “ஒரு நதி” என்று தொடங்குகிறது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் “வாசஸ்தலங்கள்” என்பது பன்மை. இதைச் சில மொழிபெயர்ப்புகள் பொருளுக்கேற்ப “வாசஸ்தலம்” அல்லது “திருத்தலம்” என்று ஒருமையில் வழங்குகின்றன.
    reason: alternative_reading
lexical_decisions:
- source_word: נָהָר
  choice: ஒரு நதி
  rationale: எபிரெயச் சொல் குறிப்புச் சுட்டு இல்லாமல் வருவதால், ‘ஒரு நதி’ என்பது அதன் வடிவை இயல்பாகப் பிரதிபலிக்கிறது; கவிதைத் தொடக்கத்தின் வினையற்ற அமைப்பை நீண்ட விளக்கமின்றி காக்கிறது.
- source_word: פְּלָגָיו
  choice: அதன் நீரோடைகள்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு ‘நதி’யைக் குறிக்கிறது. கிளையாகப் பாயும் நீரை நவீனத் தமிழில் ‘நீரோடைகள்’ தெளிவாகவும் கவிதைநயத்துடனும் தெரிவிக்கிறது.
- source_word: יְשַׂמְּחוּ
  choice: மகிழ்விக்கின்றன
  rationale: பியேல் வினைவடிவத்தின் பிறவினைப் பொருளை, அதாவது நீரோடைகள் நகரத்திற்கு மகிழ்ச்சி உண்டாக்குகின்றன என்ற கருத்தை, நேரடியாகக் காக்கிறது.
- source_word: עִיר אֱלֹהִים
  choice: கடவுளின் நகரம்
  rationale: எபிரெய இணைப்புத் தொடரை இயல்பான நவீனத் தமிழில் சுருக்கமாகவும் தெளிவாகவும் தருகிறது.
- source_word: קְדֹשׁ
  choice: பரிசுத்த இடம்
  rationale: இங்கு பெயர்ச்சொல் சார்ந்த ‘புனித இடம்/திருத்தலம்’ என்ற பொருளை ஏற்று, அடுத்துவரும் வாசஸ்தலங்களுடன் உள்ள உறவைத் திறந்தவாறே வைத்திருக்கிறது.
- source_word: מִשְׁכְּנֵי
  choice: வாசஸ்தலங்களின்
  rationale: மூலத்தில் உள்ள பன்மை இணைப்புவடிவத்தை வெளிப்படையாகக் காக்கிறது; அதை ஒருமையான ‘வாசஸ்தலம்’ அல்லது விளக்கமான ‘ஆலயம்’ என்று மாற்றவில்லை.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: கடவுளுக்கான இத்தெய்வீகப் பட்டத்தின் உயர்வுப் பொருளை நவீனத் தமிழில் இயல்பாகவும் மரியாதையுடனும் தெரிவிக்கிறது.
theological_decisions:
- issue: מִשְׁכְּנֵי என்ற பன்மையை ஒருமையாகச் சீராக்குவதா
  choice: ‘வாசஸ்தலங்கள்’ என்ற பன்மையைத் தக்கவைத்தல்
  alternative: ‘வாசஸ்தலம்’ அல்லது ‘திருத்தலம்’ என்று ஒருமையில் வழங்குதல்
  rationale: மூல எபிரெயம் பன்மையில் உள்ளது. அது பரிசுத்த வளாகங்களையோ வலியுறுத்தும் கவிதைப் பன்மையையோ குறிக்கக்கூடும்; ஒருமையாக்குவது அந்தத் திறந்த பொருளை முன்கூட்டியே தீர்மானித்துவிடும்.
- issue: קְדֹשׁ מִשְׁכְּנֵי עֶלְיוֹן தொடரின் இலக்கண உறவு
  choice: ‘உன்னதமானவருடைய வாசஸ்தலங்களின் பரிசுத்த இடம்’
  alternative: ‘உன்னதமானவருடைய பரிசுத்த வாசஸ்தலங்கள்’
  rationale: קְדֹשׁ ஒருமை வடிவில் இருப்பதால் அதை ‘பரிசுத்த இடம்’ எனப் பெயர்ச்சொல் சார்ந்து மொழிபெயர்ப்பது வடிவத்துக்கு நெருக்கமானது; அதேவேளை இந்தத் தொடர் கடவுளின் நகரத்திற்கு விளக்கப்பெயராக நிற்பதைத் தமிழ் வாக்கியம் வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகருக்குப் புரியும் மரியாதையான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘நீரோடைகள்’, ‘மகிழ்விக்கின்றன’, ‘உன்னதமானவர்’ ஆகியவை உயர்ந்த சங்கீத நடையைத் தக்கவைத்தாலும் பழமையான அல்லது குறிப்பிட்ட திருச்சபை மரபுக்குரிய சொற்களைத் தவிர்க்கின்றன.
