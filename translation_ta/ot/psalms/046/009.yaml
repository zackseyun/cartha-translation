source:
  edition: WLC
  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/009.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
translation:
  language: ta
  text: அவர் பூமியின் கடை எல்லைவரை போர்களை ஒழியச் செய்கிறார்; வில்லை முறிக்கிறார், ஈட்டியை வெட்டித் துண்டாக்குகிறார்[a]; வண்டிகளைத் தீயால் எரிக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஈட்டியை வெட்டித் தள்ளுகிறார்.’
    reason: மூல வினைச்சொல்லின் மாற்று, மேலும் நேரடியான மொழிபெயர்ப்பு.
  - marker: b
    text: அல்லது, ‘போர் ரதங்களை.’ இங்குள்ள எபிரெயச் சொல் இன்னும் நேரடியாக ‘வண்டிகள்’ அல்லது ‘சரக்கு வண்டிகள்’ என்று பொருள்படும்; ஆனால் போர் சூழலின் காரணமாகச் சில மொழிபெயர்ப்புகள் இதை ‘ரதங்கள்’ என்று வழங்குகின்றன.
    reason: போர் சூழலில் சாத்தியமான பாரம்பரியச் சொற்பொருள் மாற்றைத் தெரிவிக்கிறது.
lexical_decisions:
- source_word: מַשְׁבִּית
  choice: ஒழியச் செய்கிறார்
  rationale: שׁבת என்பதன் ஹிஃபில் வடிவம், போர்களை அவர் முடிவுக்குக் கொண்டுவருகிறார் என்ற காரணவினைப் பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: מִלְחָמוֹת
  choice: போர்கள்
  rationale: பன்மையில் வரும் இச்சொல் போர்களையும் ஆயுத மோதல்களையும் பொதுவாகக் குறிக்கிறது; ‘போர்கள்’ என்பது நேரடியான நவீனத் தமிழ் இணைச்சொல்.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: பூமியின் கடை எல்லைவரை
  rationale: எபிரெய உரையின் ‘பூமியின் எல்லை/கடைமுனை வரை’ என்ற ஒருமை அமைப்பையும், அதன் பரந்த உலகளாவிய வீச்சையும் இயல்பான தமிழில் காக்கிறது.
- source_word: קֶשֶׁת יְשַׁבֵּר
  choice: வில்லை முறிக்கிறார்
  rationale: ஒருமையில் வரும் ‘வில்’ ஓர் ஆயுத வகையைப் பொதுவாகக் குறிக்கிறது; பியெல் வினையின் அழித்தல் சார்ந்த வலிமையை ‘முறிக்கிறார்’ இயல்பாகத் தருகிறது.
- source_word: וְקִצֵּץ חֲנִית
  choice: ஈட்டியை வெட்டித் துண்டாக்குகிறார்
  rationale: קצץ என்பது வெட்டுதல் அல்லது வெட்டித் துண்டாக்குதல் எனப் பொருள்படும். ஈட்டியைப் போருக்குப் பயன்படாதபடி அழிக்கும் காட்சியை இச்சொற்றொடர் தெளிவாக்குகிறது; ‘வெட்டித் தள்ளுகிறார்’ என்ற நேரடி மாற்றும் சாத்தியம்.
- source_word: עֲגָלוֹת
  choice: வண்டிகளை
  rationale: இது பொதுவாக வண்டிகள் அல்லது சரக்கு வண்டிகள் என்பதைக் குறிக்கும் சொல்; ‘போர் ரதங்கள்’ என்பதற்கான வழக்கமான எபிரெயச் சொல் அல்ல. போர் சூழலால் ‘ரதங்கள்’ என்ற புரிதல் சாத்தியமுள்ளதால் அது அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: தீயால் எரிக்கிறார்
  rationale: எபிரெயின் ‘நெருப்பில்/நெருப்பால் எரித்தல்’ என்ற உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: போர் சூழலில் עֲגָלוֹת என்பதன் மொழிபெயர்ப்பு
  choice: வண்டிகள்
  alternative: போர் ரதங்கள்
  rationale: இங்கு எந்தக் கோட்பாட்டு முடிவும் சம்பந்தப்படவில்லை. மூல எபிரெயச் சொல்லின் வழக்கமான பொருளுக்கு முன்னுரிமை கொடுத்து ‘வண்டிகள்’ முதன்மை உரையில் வைக்கப்படுகிறது; போர் சூழலும் பாரம்பரிய மொழிபெயர்ப்பு வழக்கமும் காரணமாக ‘போர் ரதங்கள்’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் அதேவேளையில் சங்கீதத்திற்குரிய கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. தொடர்ச்சியான நிகழ்கால வினைகள் எபிரெயப் பாடலின் இணை அமைப்பைக் காக்கின்றன; ஆயுதங்களை அழிப்பதன் மூலம் போர்களை முடிவுக்குக் கொண்டுவரும் மையப் படிமம் தெளிவாக வைக்கப்பட்டுள்ளது.
