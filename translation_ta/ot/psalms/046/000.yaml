translation_notes:
  register: நவீனத் தரத்தமிழில், சங்கீதத் தலைப்புக்கேற்ற சுருக்கமானதும் கண்ணியமானதும் ஆன நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் துண்டுத் துண்டான தலைப்பு அமைப்பு காக்கப்பட்டுள்ளது; உறுதியற்ற இசைக் கலைச்சொல் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
