  text: For the choir director. Of the sons of Korah. According to Alamoth[a]. A song.
translation:
  language: ta
  text: இசைக்குழுத் தலைவருக்கு. கோரகின் மகன்களுடையது. அலாமோத்[a] முறைப்படி. ஒரு பாடல்.
  philosophy: optimal-equivalence
  footnotes:
