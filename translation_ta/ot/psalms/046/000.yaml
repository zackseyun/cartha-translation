revisions:
- from: பாடகர் குழுத் தலைவருக்கு. கோராகின் மக்களுடையது. அலாமோத்[a] முறைப்படி. ஒரு பாடல்.
  to: இசைக்குழுத் தலைவருக்கு. கோரகின் மகன்களுடையது. அலாமோத்[a] முறைப்படி. ஒரு பாடல்.
  rationale: The revision corrects the erroneous ‘people’ rendering to ‘sons’ for בני קרח while retaining the superscriptional ambiguity of the prefixed ל. It also uses a natural modern Tamil expression for the music director and refines the footnote so that the debated musical sense of Alamoth is presented as a possibility rather than a resolved meaning.
