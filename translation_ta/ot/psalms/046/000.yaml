lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: பாடகர் குழுத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்த்தலை மேற்பார்வையிடுபவரைக் குறிப்பதாக வழக்கமாகப் புரிந்துகொள்ளப்படுகிறது; இந்தத் தமிழ் நடை நவீன வாசகருக்குத் தெளிவாக இசைச்சூழலை வெளிப்படுத்துகிறது.
- source_word: לִבְנֵי קֹרַח
  choice: கோராகின் மக்களுடையது
  rationale: לְ முன்னொட்டு படைப்புரிமை, தொடர்பு அல்லது நிகழ்த்துவதற்கான ஒதுக்கீடு ஆகியவற்றைக் குறிக்கக்கூடும்; ‘மக்களுடையது’ என்பது அவற்றில் ஒன்றை மட்டும் முடிவாக நிர்ணயிக்காமல் தொடர்பைச் சுருக்கமாகக் காக்கிறது.
- source_word: עַל
  choice: முறைப்படி
  rationale: இசைத் தலைப்புகளில் இச்சொல் ஓர் இசைமெட்டு, பாணி அல்லது நிகழ்த்தல் வழிமுறையை அறிமுகப்படுத்தக்கூடும்; ‘முறைப்படி’ அந்தச் செயல்பாட்டை இயல்பான தமிழில் தருகிறது.
- source_word: עֲלָמוֹת
  choice: அலாமோத்
  rationale: இது இளம்பெண்கள், உயர்ந்த குரல்கள், இசைமுறை அல்லது மெட்டின் பெயர் ஆகியவற்றில் எதைக் குறிக்கிறது என்பது உறுதியில்லை; ஒலிபெயர்ப்பு அந்தத் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: שִׁיר
  choice: ஒரு பாடல்
  rationale: இது படைப்பின் வகையைக் குறிக்கும் பெயர்ச்சொல்; ‘ஒரு பாடல்’ என்பது இயல்பான, நேரடியான தமிழ் வடிவம்.
