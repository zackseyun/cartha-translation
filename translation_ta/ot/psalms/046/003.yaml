  text: Its waters roar and foam; the mountains quake at its swelling[a]. Selah
translation:
  language: ta
  text: 'அதன் நீர்கள் முழங்கி நுரைத்தாலும்,

    அதன் பெருக்கில்[a] மலைகள் அதிர்ந்தாலும். சேலா.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அதன் செருக்கில்”; அல்லது, “அதன் கொந்தளிப்பில்.” இதற்கான எபிரெயப் பெயர்ச்சொல் உயர்வு, செருக்கு, அல்லது நீரின் பெருக்கு ஆகிய பொருள்களைக் குறிக்கலாம். இங்கு எழும் நீரின் இயற்படிமத்துக்கு முன்னுரிமை அளிக்கப்பட்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהֱמוּ
  choice: இரைந்து
  rationale: המה என்பது பேரொலியுடன் கொந்தளிப்பதைக் குறிக்கிறது. நீரின் வலிமையான ஓசையை இயல்பாகவும் கவித்துவமாகவும் வெளிப்படுத்த “இரைந்து” தேர்ந்தெடுக்கப்பட்டது.
- source_word: יֶחְמְרוּ
  choice: நுரைத்தாலும்
  rationale: இங்கு חמר கலங்கிக் கொந்தளிக்கும் அல்லது நுரைக்கும் நீரைச் சித்தரிக்கிறது. “நுரைத்தாலும்” என்பது நீரின் காட்சியையும் சுற்றியுள்ள நிபந்தனைத் தொடரையும் இயல்பாகத் தருகிறது.
- source_word: מֵימָיו
  choice: அதன் நீர்கள்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை உடைமை விகுதி, முந்தைய கடல் சார்ந்த உருவகத்தைச் சுட்டுவதால் தமிழில் இயல்பாக “அதன்” எனத் தரப்பட்டது.
- source_word: יִרְעֲשׁוּ
  choice: அதிர்ந்தாலும்
  rationale: רעשׁ கடுமையாகக் குலுங்குதல் அல்லது நிலநடுக்கம் போல அதிர்தலைக் குறிக்கிறது. மலைகளை எழுவாயாகக் கொண்ட இக்காட்சிக்கு “அதிர்” பொருத்தமானது.
- source_word: הָרִים
  choice: மலைகள்
  rationale: எபிரெய உரையின் வரையறுக்கப்பட்ட பன்மை, தமிழில் மலைகளை ஒரு வகுப்பாகச் சுட்டும் இயல்பான “மலைகள்” என்பதால் போதுமானதாக வெளிப்படுகிறது.
- source_word: בְּגַאֲוָתוֹ
  choice: அதன் பெருக்கினால்
  rationale: גאוה உயர்வு, செருக்கு, அல்லது நீரின் எழுச்சி/பெருக்கு ஆகிய பொருள்களைக் கொள்ளலாம். கொந்தளிக்கும் நீரின் உடனடிச் சூழலில் உடல்சார் படிமத்தைத் தெளிவாகத் தர “பெருக்கு” தேர்ந்தெடுக்கப்பட்டது; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான வழிபாட்டு அல்லது இசைச் செயல்பாடு உறுதியற்றதால் பொருள் ஊகித்து மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டது.
