  register: நவீனத் தரமான, கண்ணியமான தமிழில் சங்கீதத்தின் இணைவாக்கிய அமைப்பும் தீவிரமான நீர்ப்படிமமும் காக்கப்பட்டுள்ளன. முந்தைய வசனத்தில் தொடங்கும் ‘ஆனாலும்’ நிபந்தனைத் தொடருடன் இணைவதற்காக இரண்டு வினைகளும் “-ஆலும்” வடிவில் தரப்பட்டுள்ளன.
