source:
  edition: WLC
  text: אֱלֹהִ֣ים לָ֭/נוּ מַחֲסֶ֣ה וָ/עֹ֑ז עֶזְרָ֥ה בְ֝/צָר֗וֹת נִמְצָ֥א מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/001.yaml
  text: God is our refuge and strength[b][a], a very present help in troubles.
translation:
  language: ta
  text: கடவுள் நமக்கு அடைக்கலமும் வலிமையும்; நெருக்கடிகளில் மிகுதியாகக் கிடைக்கும் துணையும் ஆவார்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “நெருக்கடிகளில் மிகுதியாகக் காணப்படும் துணை.” எபிரெயத்தில், கடவுள் நெருக்கடிகளின் வேளைகளில் மிகுதியாகக் கிடைப்பவராக, அதாவது உண்மையில் துணையாகக் கண்டறியப்படுபவராகக் கூறப்படுகிறார்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: வடிவத்தில் பன்மையாக இருந்தாலும், இங்கு ஒருமைப் பொருளில் இஸ்ரவேலின் கடவுளைக் குறிக்கிறது; நவீன பொதுத்தமிழில் ‘கடவுள்’ இயல்பானதும் தெளிவானதும் ஆகும்.
- source_word: לָנוּ
  choice: நமக்கு
  rationale: ‘எங்களுக்காக/எங்களுக்கு’ என்ற அடிப்படைப் பொருளைச் சூழலுக்கேற்ற உள்ளடக்கப் பன்மையில் ‘நமக்கு’ என வழங்குகிறது.
- source_word: מַחֲסֶה
  choice: அடைக்கலம்
  rationale: பாதுகாப்பிற்காகச் சரணடையும் இடம் என்ற உருவகத்தையும் சங்கீதத்தின் கவித்துவ மொழியையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וָעֹז
  choice: வலிமை
  rationale: עֹז என்பதன் வலிமை அல்லது ஆற்றல் என்ற பொருளைப் பெயர்ச்சொல் வடிவிலேயே இயல்பாகத் தருகிறது.
- source_word: עֶזְרָה
  choice: துணை
  rationale: உதவி அல்லது ஆதரவு என்ற பொருளை, கடவுளை நபர்சார் ஆதரவாகச் சித்தரிக்கும் இயல்பான தமிழ்ச் சொல்லால் வழங்குகிறது.
- source_word: בְּצָרוֹת
  choice: நெருக்கடிகளில்
  rationale: பன்மையில் வரும் துன்பம், இடுக்கண், நெருக்கடி ஆகிய சூழல்களைச் சுருக்கமாகவும் நவீனமாகவும் குறிக்கிறது.
- source_word: נִמְצָא
  choice: காணப்படுகிறார்
  rationale: நிபால் வடிவின் ‘காணப்படுதல்/கிடைத்தல்’ என்ற அடிப்படைப் பொருளைப் பாதுகாக்கிறது; மரியாதை ஒருமை கடவுளைக் குறிக்கும் தமிழ்ச் சொல்லாட்சிக்கு ஏற்றது.
- source_word: מְאֹד
  choice: பெரிதும்
  rationale: வினைப்பொருளை வலுப்படுத்தும் ‘மிகவும்/மிகுதியாக’ என்ற தீவிரத்தைக் கவித்துவமும் இயல்பும் உள்ள தமிழில் தருகிறது.
theological_decisions:
- issue: இறுதிக் கூறின் சுருக்கமான எபிரெய அமைப்பு
  choice: ‘நெருக்கடிகளில் பெரிதும் துணையாகக் காணப்படுகிறார்’
  alternative: ‘நெருக்கடிகளில் எப்போதும் உடனிருக்கும் துணை’
  rationale: மாற்று வாசகம் கருத்தை இயல்பாக விளக்கினாலும், נִמְצָא என்பதிலுள்ள ‘காணப்படுதல்’ என்ற சொற்பொருளையும் מְאֹד என்பதன் தீவிரத்தையும் விளக்கவுரையாக மாற்றிவிடும். முதன்மை வாசகம் கடவுள் நெருக்கடியில் உண்மையாகத் துணையாகக் கண்டறியப்படுகிறார் என்ற பொருளையும் மூலத்தின் சுருக்கத்தையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையான, கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. ‘அடைக்கலம்’, ‘வலிமை’, ‘துணை’ என்ற இணைச் சொற்கள் எபிரெயப் பெயர்ச்சொல் அமைப்பைப் பாதுகாக்கின்றன; இறுதிக் கூறு மிகையாக விளக்கப்படாமல் இயல்பான தமிழாக்கமாக வடிவமைக்கப்பட்டுள்ளது.
