theological_decisions:
- issue: சரணாலய மொழி
  choice: உமது பிரகாரங்கள் / என் இறைவனின் இல்லம்
  alternative: உமது முற்றங்கள் / என் இறைவனின் ஆலயம்
  rationale: இறைவனின் சரணாலயத்திற்கு அருகில் இருப்பதையும் பொல்லாப்பிடையே குடியிருப்பதையும் வசனம் எதிரெதிராக வைக்கிறது. ‘ஆலயம்’ என்று மூலத்தின் ‘இல்லம்’ என்பதை மிகத் தெளிவுபடுத்தாமல், அதன் தெளிவான இட உருவகம் பாதுகாக்கப்படுகிறது.
- issue: வாசற்படி நிலையின் பொருள்
  choice: வாசற்படியில் நிற்பது
  alternative: வாயிற்காப்போனாக இருப்பது
  rationale: அருகிலுள்ள தாழ்மையான இடத்தை மொழிபெயர்ப்பு காட்டுகிறது; குறிப்பிட்ட ஆலயப் பதவியை மூலவினை உறுதியாகக் கூறாததால் அதை முதன்மை உரையில் சேர்க்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைக்கும் வகையில் ‘உமது’, ‘இறைவன்’, ‘பிரகாரங்கள்’ ஆகிய சொற்கள் பயன்படுத்தப்பட்டுள்ளன. கவிதை ஒப்பீடு தெளிவாகவும் சாதாரண வாசகருக்குப் புரியுமாறும் அமைக்கப்பட்டுள்ளது; மூலத்தில் வெளிப்படாத ‘வேறிடத்தில்’ தவிர்க்கப்பட்டுள்ளது.
