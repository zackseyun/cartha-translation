  text: For a day in your courts is better than a thousand[b][a]; I would rather stand at the threshold in the house of my God than dwell in the tents of wickedness.
translation:
  language: ta
  text: ஏனெனில், உமது பிரகாரங்களில் இருக்கும் ஒரு நாள் ஆயிரத்தைவிட மேலானது; தீமையின் கூடாரங்களில் குடியிருப்பதைவிட, என் இறைவனின் இல்லத்தின் வாசற்படியில் நிற்பதையே நான் விரும்புகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இறைவனின் இல்லத்தின் வாசற்படியில் இருக்கத் தேர்ந்துகொண்டேன்”; மரபாக, “என் இறைவனின் இல்லத்தில் வாசற்காவலனாக இருப்பதை.” எபிரெயில் “ஆயிரத்தைவிட” என்று மட்டும் உள்ளது; சில மொழிபெயர்ப்புகள் “வேறிடத்தில்” என்று சேர்க்கின்றன, ஆனால் அந்தச் சொல் மூலத்தில் இல்லை.
    reason: lexical_alternative; alternative_reading
