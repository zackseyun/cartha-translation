  text: מַה יְּדִיד֥וֹת מִשְׁכְּנוֹתֶ֗י/ךָ יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/001.yaml
  text: How lovely are your dwelling places[a], O Yahweh of hosts!
translation:
  language: ta
  text: 'சேனைகளின் யாவேயே,

    உமது உறைவிடங்கள் எவ்வளவு இனிமையானவை![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது உறைவிடங்கள் எவ்வளவு அன்புக்குரியவை!” அல்லது “உமது உறைவிடங்கள் எவ்வளவு அழகானவை!”
    reason: יְדִידוֹת என்பது ‘இனிமையான,’ ‘அன்புக்குரிய,’ ‘அழகான’ என்ற நெருங்கிய பொருள்களை ஏற்கக்கூடியது.
lexical_decisions:
- source_word: מַה
  choice: எவ்வளவு
  rationale: இங்கு מַה கேள்வியை அல்ல, வியப்பை அறிமுகப்படுத்துகிறது. ‘எவ்வளவு’ என்பது அதன் கவிதைநயமுள்ள வியப்புத் தொனியை இயல்பான தமிழில் தருகிறது.
- source_word: יְּדִידוֹת
  choice: இனிமையானவை
  rationale: இச்சொல் அன்புக்குரிய, மனதுக்கு இனிய, அழகிய என்ற பொருள் பரப்பைக் கொண்டது. இடங்களைக் குறிக்கும் இச்சூழலில் ‘இனிமையானவை’ இயல்பாகவும் சங்கீதத்தின் ஏக்கமும் நேசமும் கலந்த தொனிக்கு ஏற்றவாறும் உள்ளது.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: உமது உறைவிடங்கள்
  rationale: பன்மையையும் ‘தங்குதல்/வசித்தல்’ என்ற வேர்ப்பொருளையும் காக்கிறது. ‘கூடாரங்கள்’ என்பது மோசேயின் திருக்கூடாரத்தை மட்டும் குறிப்பதுபோல் தவறாகச் சுருக்கக்கூடும்.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரெய மெய்யெழுத்துப் பெயரின் வழக்கமான ஒலிபெயர்ப்பாகத் தருகிறது.
- source_word: צְבָאוֹת
  choice: சேனைகளின்
  rationale: யְהוָה צְבָאוֹת என்ற இறைப் பட்டத்தில் வானுலகப் படைகள் உட்பட விரிந்த பொருளைத் தக்கவைக்கும் மரியாதைமிக்க தமிழ் வடிவம்.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவேவே
  alternative: கர்த்தாவே / யெகோவாவே
  rationale: மூலத்தில் தனிப்பட்ட இறைத் திருப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்த்து, அழைப்புவேற்றுமைக்கு ‘வே’ சேர்க்கப்பட்டுள்ளது.
- issue: יְהוָה צְבָאוֹת என்ற பட்டப்பெயரின் அமைப்பு
  choice: சேனைகளின் யாவேவே
  alternative: படைகளின் யாவேவே
  rationale: ‘சேனைகள்’ என்பது צְבָאוֹת என்பதன் பரந்த, கம்பீரமான பொருளைத் தக்கவைக்கிறது; ‘படைகள்’ என்பதைவிட வானுலகச் சேனைகளையும் உள்ளடக்கும் பட்டப்பெயரின் கவிதை-வழிபாட்டு தொனியைச் சிறப்பாக ஏந்துகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதைமிக்க கவிதை மற்றும் வழிபாட்டு நடையைப் பேணுகிறது. எபிரெய வாக்கியத்தின் வியப்புத் தொனியும் பன்மையான ‘உறைவிடங்கள்’ என்பதும் காக்கப்பட்டுள்ளன; தமிழில் இயல்பான அழைப்புமுறைக்காக இறைப் பட்டம் முன்னிலைப்படுத்தப்பட்டுள்ளது.
