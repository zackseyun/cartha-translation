  text: אַשְׁרֵ֣י אָ֭דָם עֽוֹז ל֥/וֹ בָ֑/ךְ מְ֝סִלּ֗וֹת בִּ/לְבָבָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/005.yaml
  text: Blessed is the man whose strength is in you[b][a], in whose heart are the highways.
translation:
  language: ta
  text: உம்மில் தன் வலிமையைக் கொண்டிருக்கும் மனிதன் பேறுபெற்றவன்; அவனுடைய இதயத்தில்[a] பெருவழிகள் உள்ளன.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்களுடைய இதயத்தில் பெருவழிகள் உள்ளன.” எபிரெய உரை ஒருமையான “மனிதன்” என்பதிலிருந்து “இதயம்” என்பதோடு இணைந்த பன்மை உடைமைப் பின்னொட்டுக்கு மாறுகிறது.
    reason: lexical_alternative
  - marker: b
    text: இந்த “பெருவழிகள்” கடவுளின் வாசஸ்தலத்தை நோக்கிய யாத்திரை வழிகளைக் குறிக்கலாம்; ஆனால் “சீயோனுக்கு” என்று இவ்வசனம் வெளிப்படையாகக் கூறவில்லை.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவன்
  rationale: எபிரெய மொழியின் வாழ்த்துப்பேறு நடையை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது; வெறும் மனநிலையைக் குறிக்கும் ‘மகிழ்ச்சியானவன்’ என்பதைக் காட்டிலும் விரிவான பொருளைத் தருகிறது.
- source_word: אָדָם
  choice: மனிதன்
  rationale: இது ஒருமையில் வரும் பொதுப்பொருளுடைய மனிதனைக் குறிக்கிறது. தமிழ் ‘மனிதன்’ மூலத்தின் ஒருமை வடிவத்தையும் பிரதிநிதித்துவப் பொருளையும் காக்கிறது.
- source_word: עֹז
  choice: வலிமை
  rationale: இச்சூழலில் கடவுளில் காணப்படும் ஆற்றலைக் குறிக்கிறது; ‘கோட்டை’ என்ற பொருள் இங்கு முதன்மையானதல்ல.
- source_word: לוֹ
  choice: தன் ... கொண்டிருக்கிற
  rationale: ‘அவனுக்கு’ என்ற சொல்லுக்குச் சொல் அமைப்பைத் தமிழில் இயல்பான உடைமைத் தொடர்பாக வெளிப்படுத்துகிறது.
- source_word: בָךְ
  choice: உம்மிடத்தில்
  rationale: வலிமை கடவுளில் இருப்பதைச் சுட்டும் உருவக இடத்தொடர்பைக் காக்கிறது; கடவுளை நோக்கிய கண்ணியமான இரண்டாம் நபர் ஒருமை வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: מְסִלּוֹת
  choice: நெடுஞ்சாலைகள்
  rationale: உயர்த்தி அமைக்கப்பட்ட பிரதான வழிகள் அல்லது நெடுஞ்சாலைகள் என்ற அடிப்படைப் பொருளைக் காக்கிறது. ‘சீயோனுக்குச் செல்லும்’ என்பது இவ்வசனத்தில் வெளிப்படையாக இல்லாததால் சேர்க்கப்படவில்லை.
- source_word: בִּלְבָבָם
  choice: அவனுடைய இதயத்தில்
  rationale: வசனத்தின் தொடக்கத்திலுள்ள ஒருமை மனிதனோடு தமிழில் இயல்பாக இணைக்கிறது; எனினும் எபிரெயச் சொல்லின் பின்னொட்டு பன்மையாக இருப்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
theological_decisions:
- issue: אָדָם என்பதன் பொதுப்பொருளுடைய ஆண்பால் ஒருமை
  choice: மனிதன்
  alternative: மனிதர் / ஒருவர்
  rationale: மூலத்தில் ஆண்பால் ஒருமை இருந்தாலும் அது பிரதிநிதித்துவமாக எந்த மனிதரையும் குறிக்கிறது. ‘மனிதன்’ வடிவமும் பொதுப்பொருளும் இரண்டையும் காக்கிறது.
- issue: מְסִלּוֹת என்பதன் மறைமுக யாத்திரைப் பின்னணி
  choice: நெடுஞ்சாலைகள்
  alternative: சீயோனுக்குச் செல்லும் நெடுஞ்சாலைகள் / யாத்திரை வழிகள்
  rationale: சங்கீதத்தின் சூழல் கடவுளின் வாசஸ்தலத்தை நோக்கிய யாத்திரையைச் சுட்டினாலும், இவ்வசனம் இலக்கை வெளிப்படையாகக் கூறவில்லை. ஆகவே அதை முதன்மை உரையில் சேர்க்காமல் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- issue: ஒருமை אָדָם இலிருந்து பன்மை பின்னொட்டு בִּלְבָבָם நோக்கிய மாற்றம்
  choice: அவனுடைய இதயத்தில்
  alternative: அவர்களுடைய இதயத்தில் / அவர்களுடைய இதயங்களில்
  rationale: தமிழ் முதன்மை உரையில் வாழ்த்துப்பேற்றின் ஒருமை அமைப்பை இயல்பாகத் தொடர்கிறது; மூலத்தின் பன்மை மாற்றம் மறைக்கப்படாமல் அடிக்குறிப்பில் பதிவு செய்யப்படுகிறது.
