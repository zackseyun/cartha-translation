  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய ‘உம்மிடத்தில்’ என்ற மரியாதை வடிவம் பக்திப் பாடல் நடைக்கு ஏற்றது. ‘நெடுஞ்சாலைகள்’ என்ற உருவகம் விளக்கவுரையால் மாற்றப்படாமல் பாதுகாக்கப்பட்டுள்ளது.
