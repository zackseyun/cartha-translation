  register: நவீன, கண்ணியமான கவிதைநடை. ‘உமது’, ‘அரசரே’ போன்ற வடிவங்கள் சங்கீதத்தின் நேரடி இறைமுகப்பை மரியாதையோடு காக்கின்றன; அரிதான பழம்பெயர்ச்சொற்கள் பெரும்பாலும் தவிர்க்கப்பட்டுள்ளன.
