  to: சிட்டுக்குருவிக்குக்கூட ஒரு வீடு கிடைத்துள்ளது; தகைவிலானுக்குத் தன் குஞ்சுகளை வைக்க[a] தனக்கென ஒரு கூடு கிடைத்துள்ளது—உமது பலிபீடங்களருகே[b], படைகளின் யாவே[c], என் அரசரே, என் கடவுளே.
