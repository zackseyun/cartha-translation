base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/003.yaml
  text: Even the sparrow has found a home[a], and the swallow a nest for herself, where she may lay her young—at your altars, O Yahweh of Armies[c][b], my King and my God.
translation:
  language: ta
  text: சிட்டுக்குருவிக்குக்கூட ஒரு வீடு கிடைத்துள்ளது; தகைவிலானுக்குத் தன் குஞ்சுகளை வைக்க[a] தனக்கென ஒரு கூடு கிடைத்துள்ளது—உமது பலிபீடங்களருகே[b], படைகளின் யாவே[c], என் அரசரே, என் கடவுளே.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தன் குஞ்சுகளை வைத்துள்ள.” எபிரெய வினை நிறைவுற்ற செயலாகவும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “உமது பலிபீடங்களில்.” எபிரெயத் தொடர் சுருக்கமாக இருப்பதால், பலிபீடங்களின் அருகாமையையோ அவற்றோடு தொடர்புடைய இடத்தையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: மரபுவழியாக, “சேனைகளின் கர்த்தர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: சிட்டுக்குருவியும்
  rationale: இணைப்போடு வலியுறுத்தும் גַּם என்பதன் பொருளை தமிழ் ‘-உம்’ இயல்பாகத் தருகிறது; சிறிய பறவைக்குக்கூட இடம் கிடைத்திருப்பது சூழலில் வெளிப்படுகிறது.
- source_word: צִפּוֹר
  choice: சிட்டுக்குருவி
  rationale: இச்சொல் பொதுவாகச் சிறுபறவையைக் குறிக்கக்கூடும்; கவிதைச் சூழலிலும் மரபான அடையாளத்திலும் ‘சிட்டுக்குருவி’ பொருத்தமானது.
- source_word: מָצְאָה בַיִת
  choice: ஒரு வீட்டைக் கண்டடைந்தது
  rationale: எபிரெய நிறைவுற்ற வினையின் விளைவுநிலையையும், தங்குவதற்கான இடம் கிடைத்ததையும் ‘கண்டடைந்தது’ உணர்த்துகிறது.
- source_word: דְּרוֹר
  choice: தகைவிலான் குருவி
  rationale: இப்பறவைப் பெயருக்கு பொதுவாக ஏற்கப்படும் தமிழ்ப் பெயர்; ‘swallow’ என அடையாளப்படுத்தும் மரபைத் தொடர்கிறது.
- source_word: קֵן לָהּ
  choice: தனக்கென ஒரு கூடு
  rationale: לָהּ குறிக்கும் பெண்பால் ஒருமை நன்மை/உடைமைப் பொருளை ‘தனக்கென’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: אֲשֶׁר שָׁתָה אֶפְרֹחֶיהָ
  choice: தன் குஞ்சுகளை வைப்பதற்கு
  rationale: שָׁתָה என்பதன் அடிப்படை ‘வைத்தல்/அமைத்தல்’; கூடு எதற்கானது என்ற வாசிப்பை முதன்மைப்படுத்துகிறது. நிறைவுற்ற செயல் என்ற மாற்று வாசிப்பு அடிக்குறிப்பில் தரப்படலாம்.
- source_word: אֶת מִזְבְּחוֹתֶיךָ
  choice: உமது பலிபீடங்களருகே
  rationale: சுருக்கமான எபிரெய அமைப்பு பறவைகள் பலிபீடங்கள்மேல் நேரடியாகக் கூடுகட்டின என்ற கட்டாயப் பொருளைக் கொடுக்காமல், பரிசுத்த இடத்தின் அருகாமையைச் சுட்டலாம்.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: திருநான்கெழுத்துத் தெய்வீகப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல், தமிழில் பரவலாக அறியப்படும் பெயர்வடிவில் வழங்குகிறது.
- source_word: צְבָאוֹת
  choice: படைகளின்
  rationale: ‘சேனைகள்’ என்ற பழைய நடையைவிட இன்றைய வாசகருக்குத் தெளிவாக இருந்து, தெய்வீகப் பட்டத்தின் இராணுவ மற்றும் அரசாட்சிச் சாயலைக் காக்கிறது.
- source_word: מַלְכִּי וֵאלֹהָי
  choice: என் அரசரே, என் கடவுளே
  rationale: நேரடி விளியின் தனிப்பட்ட அறிக்கையையும் இணையான இரு பட்டங்களையும் இயல்பான மரியாதைத் தமிழில் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யெகோவா
  alternative: யாவே; கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் இருப்பதால் பட்டமான ‘கர்த்தர்’ என்பதற்குப் பதிலாகப் பெயரையே காட்டுவது மூலவடிவைத் தெளிவாகக் காக்கிறது; தமிழில் ‘யெகோவா’ பரவலாக அறியப்படுகிறது.
- issue: צְבָאוֹת என்னும் தெய்வீகப் பட்டம்
  choice: படைகளின்
  alternative: சேனைகளின்
  rationale: மூலச்சொல்லின் படைகள்/அணிவகுப்புகள் என்ற நேரடிப் பொருளையும் இறையாட்சியின் வலிமையையும் நவீனத் தமிழில் தெளிவாகத் தருகிறது.
- issue: பலிபீடங்களுடனான இடவுறவு
  choice: உமது பலிபீடங்களருகே
  alternative: உமது பலிபீடங்களில்
  rationale: אֶת உடனான இக்கவிதை அமைப்பு மிகச் சுருக்கமானது. பறவை பலிபீடங்கள்மேல் நேரடியாகக் கூடு வைத்தது என்று தீர்மானிக்காமல், சரணாலயத்திற்கு அருகிலான இடம் என்ற சாத்தியத்தை முதன்மைப்படுத்துகிறது.
