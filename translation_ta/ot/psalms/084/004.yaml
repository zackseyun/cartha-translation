  text: אַ֭שְׁרֵי יוֹשְׁבֵ֣י בֵיתֶ֑/ךָ ע֝֗וֹד יְֽהַלְל֥וּ/ךָ סֶּֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/004.yaml
  text: Blessed are those who dwell in your house[a]; they will still praise you[c][b]. Selah
translation:
  language: ta
  text: உமது இல்லத்தில் குடியிருக்கிறவர்கள் பேறுபெற்றவர்கள்[a][b]; அவர்கள் இன்னும் உம்மைப் புகழ்வார்கள். சேலா[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது இல்லத்தில் குடியிருக்கிறவர்கள் எவ்வளவு பேறுபெற்றவர்கள்!’
    reason: lexical_alternative
  - marker: b
    text: ‘உமது இல்லம்’ என்பது தேவனுடைய பரிசுத்த இடத்தையோ ஆலயத்தையோ குறிக்கலாம்.
    reason: cultural_note
  - marker: c
    text: ‘சேலா’ என்பது பொருள் உறுதியாகத் தெரியாத ஓர் எபிரெய வழிபாட்டு அல்லது இசைக் குறிப்பு; மரபாக இது மொழிபெயர்க்கப்படாமல் ஒலிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றவர்கள்
  rationale: இது வாழ்த்துப்பேறு கூறும் பன்மை வடிவம். ‘மகிழ்ச்சியானவர்கள்’ என்பதைவிட ‘பேறுபெற்றவர்கள்’ என்பது சங்கீதத்தின் உயர்ந்த வழிபாட்டு நடையையும் இறைவனால் கிடைக்கும் நல்வாழ்வையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יוֹשְׁבֵי
  choice: குடியிருக்கிறவர்கள்
  rationale: இங்கு ישׁב என்பது வெறுமனே உட்கார்வதைக் குறிக்காமல், ஓரிடத்தில் தங்கி வாழ்வதையோ தொடர்ந்து இருப்பதையோ குறிக்கிறது. நிகழ்காலப் பங்கேற்பு வடிவத்தின் தொடர்ச்சியான தன்மையையும் இச்சொல் காக்கிறது.
- source_word: בֵיתֶךָ
  choice: உமது இல்லத்தில்
  rationale: எபிரெய மூலத்தின் ‘உமது வீடு/இல்லம்’ என்ற உருவகத்தைப் பாதுகாக்கிறது. சூழலில் இது தேவனுடைய பரிசுத்த இடத்தைக் குறிக்க வாய்ப்பிருந்தாலும், முதன்மை உரையில் ‘ஆலயம்’ என்று பொருளைச் சுருக்கவில்லை.
- source_word: עוֹד
  choice: இன்னும்
  rationale: தொடர்ச்சி, இனிமேலும், அல்லது மறுபடியும் என்ற நிழற்பொருள்களை உடைய இந்த வினையடையின் சுருக்கத்தையும் ஓரளவு தெளிவின்மையையும் ‘இன்னும்’ காக்கிறது.
- source_word: יְהַלְלוּךָ
  choice: அவர்கள் ... உம்மைப் புகழ்வார்கள்
  rationale: எபிரெய நிறைவுறா வினைவடிவம் எதிர்காலத்தையோ வழக்கமான தொடர்ச்சியான செயலையோ குறிக்கலாம். ‘புகழ்வார்கள்’ எதிர்காலச் சாயலைக் காக்கிறது; ‘இன்னும்’ தொடர்ச்சியையும் உணர்த்துகிறது.
- source_word: סֶּלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருள் உறுதியாகத் தெரியாததால், ‘இடைவேளை’ போன்ற விளக்கத்தை உரைக்குள் திணிக்காமல் எபிரெய வழிபாட்டு/இசைக் குறிப்பை ஒலிபெயர்த்துள்ளது.
theological_decisions:
- issue: ‘உமது இல்லம்’ என்பதன் குறிப்பு
  choice: முதன்மை உரையில் ‘உமது இல்லம்’ என்ற மூல உருவகம் காக்கப்பட்டது.
  alternative: உமது ஆலயம்
  rationale: இது தேவனுடைய பரிசுத்த இடம் அல்லது ஆலயத்தைக் குறிக்கக்கூடும். ஆயினும் ‘ஆலயம்’ என்று நேரடியாக மொழிபெயர்ப்பது எபிரெயச் சொல்லைவிட குறிப்பான விளக்கமாகிவிடும்; ஆகவே சாத்தியமான குறிப்புப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும் அதேவேளையில் சங்கீதத்துக்குரிய கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உமது’, ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளன. மூலத்தின் கவித்துவச் சுருக்கமும் ‘இன்னும்’ என்பதில் உள்ள காலநிலைத் தெளிவின்மையும் பாதுகாக்கப்பட்டுள்ளன.
