source:
  edition: WLC
  text: נִכְסְפָ֬ה וְ/גַם כָּלְתָ֨ה נַפְשִׁ/י֮ לְ/חַצְר֪וֹת יְה֫וָ֥ה לִבִּ֥/י וּ/בְשָׂרִ֑/י יְ֝רַנְּנ֗וּ אֶ֣ל אֵֽל חָֽי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/002.yaml
  text: My soul longs—indeed[a], it even faints—for the courts of Yahweh; my heart and my flesh cry out to the living God.
translation:
  language: ta
  text: யாவேயின் ஆலய முற்றங்களுக்காக என் உயிர் ஏங்குகிறது; ஆம், ஏக்கத்தால் சோர்ந்துபோகிறது. என் இதயமும் என் உடலும் உயிருள்ள கடவுளை நோக்கி உரக்கக் கூவுகின்றன.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மகிழ்ச்சியால் ஆர்ப்பரிக்கின்றன” அல்லது “மகிழ்ந்து பாடுகின்றன.” எபிரெய வினைச்சொல் ஒலித்தெழும் மகிழ்ச்சிக் குரலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְסְפָה
  choice: ஏங்குகிறது
  rationale: வலுவான விருப்பத்தையும் ஆழ்ந்த ஏக்கத்தையும் இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: וְגַם
  choice: ஆம்
  rationale: இரண்டாவது வினைச்சொல்லை வெறுமனே இணைக்காமல், அதன் உச்சப்படுத்தும் வலிமையைத் தமிழில் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: כָּלְתָה
  choice: ஏக்கத்தால் சோர்ந்துபோகிறது
  rationale: முடிவுறுதல் அல்லது ஆற்றல் தீர்தல் என்ற அடிப்படை உணர்வை, இச்சூழலில் ஏக்கத்தால் வாடிச் சோர்வதாக இயல்பாக எடுத்துரைக்கிறது.
- source_word: נַפְשִׁי
  choice: என் உயிர்
  rationale: இங்கு நபரின் உயிருள்ள முழுத் தன்மையைக் குறிக்கும் נֶפֶשׁ என்பதற்கு, உடலிலிருந்து பிரிந்த தனி அங்கம் என்ற கருத்தைத் தேவையின்றி புகுத்தாமல் இயல்பான தமிழை வழங்குகிறது.
- source_word: לְחַצְרוֹת
  choice: ஆலய முற்றங்களுக்காக
  rationale: முற்றங்கள் என்பது நேரடி பொருள்; சூழலில் அவை வழிபாட்டுத் தலத்தின் முற்றங்கள் என்பதால் ‘ஆலய’ என்பது தமிழ் வாசகருக்கான மிதமான தெளிவாக்கம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: தலைப்பாக மாற்றாமல், எபிரெயத் தெய்வீகப் பெயரின் பரவலாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பைப் பாதுகாக்கிறது.
- source_word: לִבִּי וּבְשָׂרִי
  choice: என் இதயமும் என் உடலும்
  rationale: உள்ளார்ந்த மனிதனையும் உடல்சார்ந்த மனிதனையும் இணைக்கும் எபிரெயச் சொல்லிணையை நவீனத் தமிழில் இயல்பாகப் பாதுகாக்கிறது; ‘மாம்சம்’ இங்கு தேவையற்ற வேறுபொருள்களைத் தூண்டக்கூடும்.
- source_word: יְרַנְּנוּ
  choice: உரக்கக் கூவுகின்றன
  rationale: ஒலித்தெழும் வலுவான கூக்குரலைக் குறிக்கிறது; வினைச்சொல்லில் இருக்கக்கூடிய மகிழ்ச்சிக் குரல் என்ற நிழற்பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אֶל
  choice: நோக்கி
  rationale: கூக்குரலின் திசை அல்லது இலக்கைச் சுட்டும் எபிரெய முன்னிடைச்சொல்லைத் துல்லியமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: אֵל חָי
  choice: உயிருள்ள கடவுள்
  rationale: இஸ்ரவேலின் கடவுளைக் குறிக்கும் இந்த வேதாகமச் சிறப்புப்பெயரின் திட்டவட்டமான பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் தமிழ் ஒலிபெயர்ப்பில் வழங்குகிறது.
- issue: נֶפֶשׁ என்பதன் மனித இயல்பு சார்ந்த பொருள்
  choice: என் உயிர்
  alternative: என் ஆத்துமா
  rationale: இங்கு ஆழமாக ஏங்கும் உயிருள்ள நபரையே சொல் குறிக்க முடியும்; ‘ஆத்துமா’ என்பது உடலிலிருந்து பிரிந்த கூறு என்ற ஒரு குறிப்பிட்ட மனிதவியல் வாசிப்பைத் தேவையின்றி முன்னிறுத்தலாம்.
- issue: יְרַנְּנוּ என்பதில் கூக்குரலா அல்லது மகிழ்ச்சிக் குரலா
  choice: உரக்கக் கூவுகின்றன
  alternative: மகிழ்ச்சியால் ஆர்ப்பரிக்கின்றன
  rationale: முந்தைய வரியின் தீவிர ஏக்கத்துடன் ‘உரக்கக் கூவுகின்றன’ நன்றாக இணைகிறது; எனினும் வினைச்சொல் மகிழ்ச்சியோடு ஒலிக்கும் குரலையும் குறிக்கக்கூடியதால் அந்த உண்மையான ambiguity அடிக்குறிப்பில் வைக்கப்படுகிறது.
translation_notes:
  register: நவீன, மரியாதைமிக்க பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘பிராகாரங்கள்’, ‘மாம்சம்’, ‘ஆத்துமா’ போன்ற அதிகமாகச் சமய அல்லது பழைய நடையைக் கொண்ட சொற்களுக்கு மாற்றாக ‘ஆலய முற்றங்கள்’, ‘உடல்’, ‘உயிர்’ தேர்ந்தெடுக்கப்பட்டுள்ளன. கவிதைத் தீவிரமும் இதயம்–உடல் இணையும் அமைப்பும் காக்கப்பட்டுள்ளன.
