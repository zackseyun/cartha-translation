  text: מָ֭גִנֵּ/נוּ רְאֵ֣ה אֱלֹהִ֑ים וְ֝/הַבֵּ֗ט פְּנֵ֣י מְשִׁיחֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/009.yaml
  text: Look on our shield[a], O God[b], and look on the face of your anointed.
translation:
  language: ta
  text: எங்கள் கேடயத்தை[a] நோக்கிப் பாரும், கடவுளே; உமது அபிஷேகம் செய்யப்பட்டவரின்[b] முகத்தை உற்றுப் பாரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எங்கள் பாதுகாவலர்.’ எபிரெயில் நேரடியாக ‘எங்கள் கேடயம்’ என்று உள்ளது. இந்தக் கவிதை உருவகம் பாதுகாப்பவராகிய கடவுளையோ அரசனையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயில், ‘உமது அபிஷேகம் செய்யப்பட்டவர்’ அல்லது நேரடியாக, ‘உமது அபிஷிக்தர்.’ ‘மேசியா’ என்ற சொல்லுக்கு அடிப்படையான அதே எபிரெயச் சொல் இங்கும் வருகிறது. இச்சூழலில் இது முதலில் தாவீதின் வம்சத்தைச் சேர்ந்த அரசனைக் குறிப்பதாகத் தெரிகிறது; அதேவேளை விரிவான மேசிய நயமும் இருக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנֵּנוּ
  choice: எங்கள் கேடயம்
  rationale: மָגֵן என்பதன் நேர்ப்பொருள் ‘கேடயம்.’ இது பாதுகாப்பவரைக் குறிக்கும் கவிதை உருவகமாக இருக்கலாம்; ஆனால் அது கடவுளைக் குறிக்கிறதா அரசனைக் குறிக்கிறதா என்பதைத் தீர்மானிக்காமல் எபிரெய உருவகம் தக்கவைக்கப்படுகிறது.
- source_word: רְאֵה
  choice: நோக்கிப் பாரும்
  rationale: இங்கு இது வெறுமனே காண்பதற்கான கட்டளை அல்ல; சாதகமான கவனத்தை வேண்டுகிற விண்ணப்பம். ‘நோக்கிப் பாரும்’ என்பது அந்தப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இது ஜெபத்தில் நேரடி விளி; ‘கடவுளே’ என்ற விளிவடிவம் தமிழில் அதனை இயல்பாகக் காட்டுகிறது.
- source_word: וְהַבֵּט
  choice: உற்றுப் பாரும்
  rationale: נבט கவனத்தை ஒருமுகப்படுத்திப் பார்ப்பதைக் குறிக்க முடியும். முதல் வினையோடு உள்ள கவிதை இணைப்பைத் தக்கவைத்தபடியே அதன் நுண்ணிய வேறுபாட்டை ‘உற்றுப் பாரும்’ காட்டுகிறது.
- source_word: פְּנֵי
  choice: முகத்தை
  rationale: פָּנִים என்பதன் நேர்ப்பொருளான ‘முகம்’ எபிரெயப் படிமத்தையும் உறவுசார் உட்பொருளையும் தக்கவைக்கிறது.
- source_word: מְשִׁיחֶךָ
  choice: நீர் அபிஷேகம் செய்தவர்
  rationale: מָשִׁיחַ என்பது அபிஷேகம் செய்யப்பட்டவரைக் குறிக்கிறது. இச்சங்கீதத்தின் உடனடிச் சூழலில் தாவீதிய அரசனைக் குறிப்பது இயல்பானது; ஆகவே ‘மேசியா’ என்ற நிலையான பட்டத்தை முதன்மை உரையில் இடாமல் செயற்பாட்டு வடிவில் மொழிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ‘எங்கள் கேடயம்’ யாரைக் குறிக்கிறது?
  choice: ‘எங்கள் கேடயம்’ என்ற உருவகம் விளக்கித் தீர்மானிக்கப்படாமல் தக்கவைக்கப்பட்டது.
  alternative: அது பாதுகாப்பவராகிய கடவுளையோ தாவீதிய அரசனையோ குறிப்பதாக வெளிப்படையாக மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை இரு சாத்தியங்களுக்கும் இடமளிக்கிறது; அடுத்துள்ள ‘நீர் அபிஷேகம் செய்தவர்’ என்ற தொடருடன் இது நோக்கமுள்ள கவிதை மற்றும் இறையியல் பதற்றத்தை உருவாக்கக்கூடும்.
- issue: ‘நீர் அபிஷேகம் செய்தவர்’ என்பவரின் அடையாளம்
  choice: பெரிய எழுத்து அல்லது ‘மேசியா’ என்ற சிறப்புப் பட்டம் இன்றி மொழிபெயர்க்கப்பட்டது.
  alternative: ‘உமது மேசியா’ என்று மொழிபெயர்த்தல்.
  rationale: உடனடிச் சூழல் அபிஷேகம் செய்யப்பட்ட தாவீதிய அரசனை முதலில் சுட்டுகிறது. இருப்பினும் இச்சொல்லே ‘மேசியா’ என்பதன் எபிரெய மூலச்சொல் என்பதால் அந்தத் தொடர்பு அடிக்குறிப்பில் குறிப்பிடப்படுகிறது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பான, மதிப்புமிக்க ஜெபநடை பயன்படுத்தப்பட்டுள்ளது. ‘பாரும்’ என்ற மரியாதைமிக்க ஏவல் வடிவமும் ‘கடவுளே’ என்ற விளிவடிவமும் கவிதைத் தன்மையைத் தக்கவைக்கின்றன. ‘அபிஷேகம்’ பொதுவாக அறியப்படும் சமயச் சொல் என்பதால் பயன்படுத்தப்பட்டாலும், பழமையான ‘பண்ணப்பட்டவர்’ என்பதற்குப் பதிலாக இயல்பான செயற்பாட்டு அமைப்பு தேர்ந்தெடுக்கப்பட்டுள்ளது.
