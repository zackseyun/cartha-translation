  terminology: “கேடயம்,” “கடவுளே,” and “அபிஷேகம்” are apt and readily understandable in modern standard Tamil. The uncapitalized descriptive rendering for מְשִׁיחֶךָ avoids prematurely making it a fixed messianic title.
