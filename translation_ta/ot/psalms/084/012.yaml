    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: தேவனுடைய தனிப்பட்ட பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், நவீன தமிழில் ஒலிபெயர்த்துள்ளது.
- source_word: צְבָאוֹת
  choice: படைகளின்
  rationale: வானுலக அல்லது பூவுலக அணிவகுத்த படைகளைக் குறிக்கக்கூடிய எபிரெய உருவகத்தைப் பாதுகாக்கிறது; விளக்கவுரையான ‘சர்வவல்லவர்’ என்பதைத் தவிர்க்கிறது.
- source_word: אַשְׁרֵי
  choice: எவ்வளவு பேறுபெற்றவர்
  rationale: இது வெறும் உள்ளுணர்வு மகிழ்ச்சியைக் கூறாமல், ஞான இலக்கியத்திற்குரிய வியப்பும் வாழ்த்தும் நிறைந்த பேரின்ப நிலையை வெளிப்படுத்தும் அழுத்தமான சொல்லமைப்பு.
- source_word: אָדָם
  choice: மனிதர்
  rationale: எபிரெய ஒருமைச் சொல் இங்கு எந்த மனிதரையும் பொதுவாகக் குறிக்கிறது. தமிழில் ‘மனிதர்’ இயல்பாகவும் மரியாதையுடனும் அந்தப் பொதுமைப் பொருளைத் தருகிறது.
- source_word: בֹּטֵחַ
  choice: நம்புகிற
  rationale: பங்கேற்புவினை வழக்கமான அல்லது குணவியல்பான செயலைக் குறிக்கிறது; ‘நம்புகிற’ என்பது அதன் நேரடியான, இயல்பான தமிழ் இணை.
- source_word: בָּךְ
  choice: உம்மை
  rationale: இரண்டாம் நபர் ஒருமையில் தேவனை நேரடியாக விளிக்கும் பொருளை நவீன, கண்ணியமான தமிழ் வழக்கில் தருகிறது.
theological_decisions:
- issue: יְהוָה צְבָאוֹת என்ற தெய்வீகப் பெயரும் பட்டமும்
  choice: படைகளின் யாவே
  alternative: சேனைகளின் யாவே / சர்வவல்லமையுள்ள ஆண்டவர்
  rationale: தனிப்பட்ட பெயரையும் צְבָאוֹת என்பதன் படை உருவகத்தையும் பாதுகாக்கிறது; ‘சர்வவல்லமையுள்ளவர்’ எனப் பொருளை விரிவாக்குவதையோ, பெயரை ‘ஆண்டவர்’ என்ற பட்டத்தால் மாற்றுவதையோ தவிர்க்கிறது.
- issue: אָדָם என்பதன் பொதுமைப் பொருள்
  choice: மனிதர்
  alternative: மனிதன்
  rationale: மூலத்தின் ஒருமையைத் தக்கவைத்தபடியே, இவ்வாக்குறுதி ஆண்களுக்கு மட்டும் உரியது என்ற தவறான எண்ணத்தைத் தவிர்த்து, எந்த மனிதரையும் பிரதிநிதித்துவமாகக் குறிக்கும் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமும் வியப்பு நிறைந்த வாழ்த்துத் தொனியும் பேணப்பட்டுள்ளன. ‘உம்மை’ என்பது தேவனை நேரடியாக விளிக்கும் மரியாதையான ஒருமை வடிவம்; ‘எவ்வளவு’ என்பது אַשְׁרֵי என்பதன் வியப்புத் தொனியை இயல்பாக வெளிப்படுத்துகிறது.
