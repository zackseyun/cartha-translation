- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கிறது. நவீனத் தமிழில் தெளிவாகவும் வழிபாட்டு இசைச் சூழலுக்கு ஏற்றவாறும் உள்ளது.
- source_word: עַל הַגִּתִּית
  choice: கித்தீத்தின்படி
  rationale: עַל என்பது இங்கு ஓர் இசைமுறை, மெட்டு அல்லது இசைக்கருவி குறித்த குறிப்பை அறிமுகப்படுத்தலாம். பொருள் உறுதியாகத் தெரியாத הַגִּתִּית என்பதை விளக்கிப் பொருள் திணிக்காமல் ஒலிபெயர்த்து, ‘இன்படி’ மூலம் மூலத்தின் தொடர்பை இயல்பான தமிழில் காட்டுகிறது.
- source_word: לִבְנֵי קֹרַח
  choice: கோராகின் மகன்களுடைய
  rationale: לְ என்னும் முன்னிடைச்சொல் படைப்புரிமை, தொடர்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றில் ஒன்றைக் குறிக்கலாம். ‘மகன்களுடைய’ என்பது தலைப்புக்குரிய சுருக்கமான இயல்பான வடிவம்; உறவின் துல்லியத் தன்மையின்மையை அடிக்குறிப்பு வெளிப்படுத்துகிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையுடன் பாடப்படும் இவ்வகைப் பாடலுக்கான நிலைபெற்ற, பொதுவாகப் புரிந்துகொள்ளப்படும் தமிழ்ச் சொல்.
