- issue: בְּתָמִים என்பதன் ஒழுக்கப் பொருள்
  choice: உத்தமமாய்
  alternative: குற்றமற்றவர்களாய் / நேர்மையுடன்
  rationale: இச்சொல் முழுமையான நேர்மையையும் செம்மையான வாழ்க்கைநடத்தையையும் குறிக்கிறது; பாவமே இல்லாத பரிபூரண நிலை என்று பொருள் நிர்ணயிப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘சூரியன்—கேடயம்’ மற்றும் ‘நடத்தல்’ உருவகங்கள் காக்கப்பட்டுள்ளன; இறைப்பெயர் ‘யாவே’ என வழங்கப்பட்டுள்ளது.
