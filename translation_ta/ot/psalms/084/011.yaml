base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/011.yaml
  text: For Yahweh God is a sun and shield[a]; Yahweh gives favor and honor[b]. He does not withhold good from those who walk blamelessly.
translation:
  language: ta
  text: ஏனெனில், யாவே தேவன் சூரியனும் கேடயமுமாய் இருக்கிறார்; யாவே தயவையும் கண்ணியத்தையும்[a] அளிக்கிறார். நேர்மையோடு நடக்கிறவர்களுக்கு[b] அவர் நன்மையைத் தடுத்து வைப்பதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அருளையும் மகிமையையும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்கு “நேர்மையோடு” என்பது ஒருமைப்பாட்டோடும் செம்மையோடும் வாழ்வதைக் குறிக்கிறது; பாவமே இல்லாத பரிபூரண நிலையைக் குறிக்கவில்லை.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இயல்பாக அமைகிறது.
- source_word: שֶׁמֶשׁ וּמָגֵן
  choice: சூரியனாகவும் கேடயமாகவும்
  rationale: ஒளி மற்றும் பாதுகாப்பைக் குறிக்கும் மூலமொழியின் இணை உருவகங்களை விளக்கமாக மாற்றாமல் அப்படியே காக்கிறது.
- source_word: יְהוָה אֱלֹהִים
  choice: யாவே தேவன்
  rationale: יְהוָה என்ற உடன்படிக்கைப் பெயரை ‘யாவே’ என்று ஒலிபெயர்த்து, אֱלֹהִים என்பதை அதன் இணைப்பெயராக ‘தேவன்’ என்று தருகிறது.
- source_word: חֵן
  choice: தயவு
  rationale: இச்சூழலில் வழங்கப்படும் நன்மனப்பான்மை அல்லது ஆதரவைக் குறிக்கிறது; ‘அருள்’ என்பதும் சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְכָבוֹד
  choice: மேன்மையையும்
  rationale: பெறுபவருக்கு அளிக்கப்படும் கண்ணியத்தையும் உயர்வையும் இயல்பான தமிழில் தெரிவிக்கிறது; ‘மகிமை’ என்ற பொருளையும் அடிக்குறிப்பு காக்கிறது.
- source_word: יִתֵּן
  choice: அளிக்கிறார்
  rationale: கவிதையில் வழக்கமான அல்லது நிலையான தெய்வீகச் செயலைக் குறிக்கும் எபிரெய imperfect வடிவத்தைத் தமிழ் நிகழ்காலத்தில் இயல்பாகத் தருகிறது.
- source_word: לֹא יִמְנַע טוֹב
  choice: எந்த நன்மையையும் அவர் மறுப்பதில்லை
  rationale: நன்மையானதைத் தடுத்து வைக்கமாட்டார் என்ற பொருளைத் தெளிவான, இயல்பான தமிழில் தெரிவிக்கிறது; ‘எந்த’ என்பது எதிர்மறை வாக்கியத்தில் எபிரெய பொதுப்பொருளை வெளிப்படுத்துகிறது.
- source_word: לַהֹלְכִים בְּתָמִים
  choice: உத்தமமாய் நடக்கிறவர்களுக்கு
  rationale: הלך என்பதன் வாழ்க்கைநடத்தை உருவகத்தை ‘நடக்கிறவர்கள்’ என்று காத்து, תָמִים குறிக்கும் முழுமையான நேர்மையை ‘உத்தமமாய்’ என்று தருகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
