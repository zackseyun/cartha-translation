source:
  edition: WLC
  text: עֹבְרֵ֤י בְּ/עֵ֣מֶק הַ֭/בָּכָא מַעְיָ֣ן יְשִׁית֑וּ/הוּ גַּם בְּ֝רָכ֗וֹת יַעְטֶ֥ה מוֹרֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/006.yaml
  text: As they pass through the Valley of Baca[a], they make it a spring[b]; even the early rain covers it with blessings.
translation:
  language: ta
  text: அவர்கள் பாக்கா பள்ளத்தாக்கின் வழியாகக் கடந்து செல்லும்போது,[a] அதை ஒரு நீரூற்றாக மாற்றுகிறார்கள்; பருவத்தின் முதல் மழையும் அதை ஆசீர்வாதங்களால் மூடுகிறது.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “பாக்கா” என்பது “அழுகை” என்பதற்கான எபிரெயச் சொல்லை நினைவூட்டலாம்; எனவே இதை “அழுகையின் பள்ளத்தாக்கு” என்றும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
  - marker: b
    text: “பருவத்தின் முதல் மழை” என்பது மழைக்காலம் தொடங்கும்போது பெய்யும் மழை. இதற்கான எபிரெயச் சொல் “போதகர்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבְרֵי
  choice: அவர்கள் ... கடந்து செல்லும்போது
  rationale: עבר என்பதன் பன்மை வினையெச்ச வடிவம் சூழலில் பயணிகளைக் குறிக்கிறது; காலநிலைத் துணைவாக்கியம் அதன் தொடர்ச்சியான இயக்கத்தை இயல்பான தமிழில் தருகிறது.
- source_word: בְּ/עֵמֶק
  choice: பள்ளத்தாக்கின் வழியாக
  rationale: עבר உடன் வரும் முன்னிடைச்சொல் ஓர் இடத்தினூடாகச் செல்லும் இயக்கத்தைக் குறிக்கிறது.
- source_word: הַ/בָּכָא
  choice: பாக்கா
  rationale: இது இடப்பெயராகவும் ‘அழுகை’ என்பதை நினைவூட்டும் சொல்லாகவும் இருக்கலாம்; ஒலிபெயர்ப்பு மூலத்தின் தெளிவின்மையைப் பாதுகாக்கிறது.
- source_word: מַעְיָן
  choice: ஒரு நீரூற்று
  rationale: இச்சொல் இயற்கையாகப் பொங்கும் நீரூற்றை அல்லது ஊற்றுக்கண்ணைக் குறிக்கிறது; ‘நீரூற்று’ தெளிவான நவீனத் தமிழ்.
- source_word: יְשִׁיתוּהוּ
  choice: அதை ... மாற்றுகிறார்கள்
  rationale: שׁית என்பதற்கு வைக்குதல் அல்லது ஆக்குதல் என்ற பொருள் உண்டு; ஆண்பால் ஒருமை பின்னொட்டு பள்ளத்தாக்கைக் குறிப்பதாக எடுத்துக்கொள்ளப்பட்டு, அதை நீரூற்றாக ஆக்குதல் என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: גַּם
  choice: -உம்
  rationale: கூடுதல் மற்றும் உச்சநிலை கருத்தை இயல்பான தமிழில் இணைப்பும்மை வெளிப்படுத்துகிறது.
- source_word: בְּרָכוֹת
  choice: ஆசீர்வாதங்களால்
  rationale: மெய்யெழுத்து வடிவம் இயல்பாக ‘ஆசீர்வாதங்கள்’ எனப் பொருள்படும்; உயிரளிக்கும் நீரின் கவித்துவ ஒலிப்பையும் இது தக்கவைக்கிறது.
- source_word: יַעְטֶה
  choice: மூடுகிறது
  rationale: עטה மூடுதல், போர்த்துதல் என்ற உருவகத்தைத் தருகிறது; ‘மூடுகிறது’ இயல்பாகவும் நேரடியாகவும் உள்ளது.
- source_word: מוֹרֶה
  choice: பருவத்தின் முதல் மழை
  rationale: இச்சொல் ‘போதகர்’ என்றும் பொருள்படலாம்; ஆனால் நீர் மற்றும் வளமை சார்ந்த உடனடிச் சூழலில் மழைக்காலத்தின் தொடக்க மழை என்பதே பொருத்தமானது. ‘பருவத்தின் முதல் மழை’ நவீன வாசகருக்கு ‘முன்மழை’ என்பதைக் காட்டிலும் தெளிவாக உள்ளது.
theological_decisions:
- issue: הַבָּכָא என்பதை விளக்கிப் பெயர்ப்பதா அல்லது ஒலிபெயர்ப்பதா
  choice: முதன்மை உரையில் ‘பாக்கா’ என்ற இடப்பெயராக ஒலிபெயர்த்தல்
  alternative: ‘அழுகையின் பள்ளத்தாக்கு’
  rationale: இச்சொல் இடப்பெயராகச் செயல்படுவதோடு அழுகையையும் நினைவூட்டக்கூடும். ஒலிபெயர்ப்பு கவித்துவ மற்றும் விளக்கத் தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
- issue: מוֹרֶה என்பதன் பொருள்
  choice: ‘பருவத்தின் முதல் மழை’
  alternative: ‘போதகர்’
  rationale: நீரூற்று, மழை, ஆசீர்வாதம் ஆகிய உருவகங்கள் நிறைந்த உடனடிச் சூழலில் பருவ மழை என்ற வாசிப்பு சிறப்பாகப் பொருந்துகிறது; இருப்பினும் மூலச்சொல்லின் வேறு சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பாக்கா’ ஒலிபெயர்க்கப்பட்டு மூலத்தின் இடப்பெயர்/அழுகை இரட்டை ஒலிப்பு அடிக்குறிப்பில் தக்கவைக்கப்பட்டுள்ளது. மழையின் வகை சாதாரண வாசகருக்குத் தெளிவாக ‘பருவத்தின் முதல் மழை’ என வழங்கப்பட்டுள்ளது.
