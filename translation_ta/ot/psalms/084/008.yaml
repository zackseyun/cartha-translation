id: PSA.84.8
reference: Psalms 84:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְ֭בָאוֹת שִׁמְעָ֣/ה תְפִלָּתִ֑/י הַאֲזִ֨ינָ/ה אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/008.yaml
  text: O Yahweh God of hosts[a], hear my prayer; give ear, O God of Jacob[b]. Selah
translation:
  language: ta
  text: படைகளின் கடவுளாகிய யாவே[a], என் மன்றாட்டைக் கேளும்; யாக்கோபின் கடவுளே, செவிகொடும். சேலா[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “யாவே” என்பது எபிரேய மொழியிலுள்ள கடவுளின் தனிப்பட்ட பெயரான יהוה என்பதன் ஒலிபெயர்ப்பு; தமிழ் வேதாகம மரபில் இது பொதுவாக “கர்த்தர்” என்றும் வழங்கப்படுகிறது.
    reason: alternative_reading
  - marker: b
    text: “சேலா” என்பது பொருள் உறுதியாகத் தெரியாத எபிரேய வழிபாட்டு அல்லது இசைக் குறிப்பு; “இடைநிறுத்தம்” அல்லது “இசை இடைவேளை” என்பது முன்மொழியப்பட்ட பொருள்களில் சில.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இஸ்ரவேலுக்கு வெளிப்படுத்தப்பட்ட இறைப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், எபிரேய நான்கெழுத்துப் பெயரின் பரவலான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: படைகளின் கடவுள்
  rationale: צְבָאוֹת என்பதன் அடிப்படைப் பன்மைப் பொருளைத் தெளிவாகக் காட்டுகிறது; அவை விண்ணுலகப் படைகளா அல்லது பிற சக்திகளா என்பதை உரை இங்கு குறிப்பாக வரையறுக்காததால் அதனை மிகைப்படுத்தவில்லை.
- source_word: שִׁמְעָה תְפִלָּתִי
  choice: என் மன்றாட்டைக் கேளும்
  rationale: கட்டளை வடிவிலுள்ள வேண்டுகோளையும், தன் வேண்டுதலைக் கடவுள் கேட்க வேண்டும் என்ற நேரடியான பொருளையும் இயல்பான தமிழ் இறைவேண்டல் நடையில் தருகிறது.
- source_word: הַאֲזִינָה
  choice: செவிகொடும்
  rationale: முந்தைய ‘கேளும்’ என்பதுடன் உள்ள கவிதை இணைப்பைத் தக்கவைத்து, கவனித்துக் கேட்குமாறு வலியுறுத்தும் தனித்த வினைச்சொல்லாக அமைகிறது.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: யாக்கோபின் கடவுள்
  rationale: இணைப்புநிலைத் தொடரை நேரடியாகத் தருவதோடு, யாக்கோபுடன் தொடர்புடைய கடவுள் என்ற உடன்படிக்கைச் சார்பையும் மாற்றமின்றிக் காக்கிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் இசை அல்லது வழிபாட்டுச் செயல்பாடு உறுதியாகத் தெரியாததால், ஊகமான பொருளைத் திணிக்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் தனிப்பட்ட இறைப்பெயர் நேரடியாக உள்ளது. அதை பொதுப் பட்டமாக மாற்றாமல், நவீன ஆய்வில் பரவலாக ஏற்கப்படும் ஒலிப்பைத் தமிழில் தருகிறது.
- issue: סֶלָה என்பதன் பொருள்
  choice: சேலா என ஒலிபெயர்த்தல்
  alternative: இடைநிறுத்தம்; இசை இடைவேளை
  rationale: துல்லியமான பொருளும் வழிபாட்டு அல்லது இசைச் செயல்பாடும் விவாதத்திற்குரியவை; எனவே உரையின் தெளிவின்மையைப் பாதுகாக்க ஒலிபெயர்ப்பு பயன்படுத்தப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சங்கீத வேண்டுதலுக்கேற்ற மரியாதை வினைமுற்றுகளான ‘கேளும்’, ‘செவிகொடும்’ ஆகியவை கவிதை இணைப்பைத் தக்கவைக்கின்றன. ‘படைகளின் கடவுளாகிய’ என்பது வாசிப்பில் இயல்பாக இருக்கும்படியும் எபிரேய இறைப் பட்டத்தின் பரந்த பொருளைச் சுருக்காமல் இருக்கும்படியும் தேர்ந்தெடுக்கப்பட்டது.
