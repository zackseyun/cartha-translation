base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/007.yaml
  text: They go from strength to strength[b][a]; each one appears before God in Zion.
translation:
  language: ta
  text: அவர்கள் பலத்திலிருந்து பலத்திற்குச் செல்கிறார்கள்[a]; ஒவ்வொருவரும் சீயோனில் கடவுள்முன் தோன்றுகிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஒரு குழுவிலிருந்து இன்னொரு குழுவுக்கு,” அல்லது “ஒரு வெற்றியிலிருந்து இன்னொரு வெற்றிக்கு.” “பலம்” என்பதற்கான எபிரெயச் சொல் வலிமை, வீரியம் அல்லது படை என்பதையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “கடவுளிடம் தோன்றுகிறார்.” இச்சூழலில் இது வழிபாட்டிற்காகக் கடவுள்முன் வந்து நிற்பதைக் குறிக்கலாம்; “கடவுளால் காணப்படுகிறார்” என்றும் வாசிக்க வாய்ப்புள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: செல்கிறார்கள்
  rationale: הלך என்பதன் Qal முற்றுப்பெறா வினை, தொடர்ந்த அல்லது முன்னேறும் பயணத்தைச் சுட்டுகிறது. யாத்திரைச் சூழலில் முறையை மிகையாகக் குறிப்பிடாமல் இயல்பாகப் பொருளளிக்கிறது.
- source_word: מֵחַיִל אֶל חָיִל
  choice: பலத்திலிருந்து பலத்திற்கு
  rationale: חַיִל என்பது பலம், வீரியம், படை, செல்வம் போன்ற பரந்த பொருள் கொண்டது. இங்கே வழிபாட்டுப் பயணிகள் முன்னேறும்போது புதுப்பிக்கப்படும் அல்லது பெருகும் பலமே சூழலுக்கு மிகவும் இயல்பான பொருள்; பிற சாத்தியங்கள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: יֵרָאֶה
  choice: தோன்றுகிறார்கள்
  rationale: ראה என்பதன் Niphal முற்றுப்பெறா ஒருமை வடிவம். வழிபாடு அல்லது யாத்திரைச் சூழலில் கடவுள்முன் வந்து நிற்பது என்ற இடைச்செயற்பாட்டுப் பொருளைக் கொள்ளலாம். தமிழில் பகிர்ந்தெடுக்கப்பட்ட ஒருமைச் சுட்டை ‘ஒவ்வொருவரும்’ என்பதால் தெளிவாக்குவதால், வினை இயல்பான மரியாதைப் பன்மையில் வருகிறது.
- source_word: אֶל אֱלֹהִים
  choice: கடவுள்முன்
  rationale: אֶל என்பதன் நேரடிப் பொருள் ‘நோக்கி/இடம்’ என்றாலும், வழிபாட்டில் தோன்றுதல் என்ற சொல்லிணைப்பில் ‘கடவுள்முன்’ என்பது இயல்பான தமிழ்.
- source_word: בְצִיּוֹן
  choice: சீயோனில்
  rationale: இடப்பெயர் தமிழின் நிலையான ஒலிபெயர்ப்பில் தரப்படுகிறது; בְ முன்னிடைச்சொல்லின் இடப்பொருளை ‘-இல்’ தெளிவாகக் காட்டுகிறது.
- source_word: יֵרָאֶה (singular with plural context)
  choice: ஒவ்வொருவரும் ... தோன்றுகிறார்கள்
  rationale: சுற்றியுள்ள தொடர் பன்மையாக இருந்தாலும் எபிரெய வினை ஒருமையில் உள்ளது. ‘ஒவ்வொருவரும்’ என்பது அதன் பகிர்ந்தெடுக்கப்பட்ட ஒருமைப் பொருளைப் பாதுகாக்கிறது.
theological_decisions:
- issue: கடவுள்முன் தோன்றுதல் என்ற வழிபாட்டு மரபுத்தொடர்
  choice: வழிபாட்டாளர்கள் சீயோனில் கடவுள்முன் வந்து நிற்பதாக மொழிபெயர்த்தல்
  alternative: ‘சீயோனில் கடவுளால் காணப்படுகிறார்’ என்ற செயல்பாட்டு எதிர்மறை வாசிப்பு
  rationale: யாத்திரை மற்றும் வழிபாட்டுச் சூழலில் ראה என்பதன் Niphal வடிவம் தம்மைக் கடவுள்முன் நிறுத்துதல் அல்லது தோன்றுதல் என்ற பொருளில் பொதுவாக வருகிறது. இருப்பினும் எபிரெய வடிவத்தின் நேரடி தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியும் ஆனால் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. ‘பலத்திலிருந்து பலத்திற்கு’ என்ற சுருக்கமான இணை அமைப்பு எபிரெய வரியின் ஓசையையும் உண்மையான சொற்பொருள் விரிவையும் பாதுகாக்கிறது. ‘ஒவ்வொருவரும்’ என்பது எபிரெய ஒருமை வினையின் பகிர்ந்தெடுக்கப்பட்ட பொருளைத் தெளிவாக்குகிறது.
