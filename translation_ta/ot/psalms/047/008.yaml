source:
  edition: WLC
  text: מָלַ֣ךְ אֱ֭לֹהִים עַל גּוֹיִ֑ם אֱ֝לֹהִ֗ים יָשַׁ֤ב עַל כִּסֵּ֬א קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/008.yaml
  text: God reigns over the nations[a]; God sits on his holy throne.
translation:
  language: ta
  text: தேவன் தேசங்களின்மேல் அரசாளுகிறார்[a]; தேவன் தமது பரிசுத்த அரியணையில் வீற்றிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தேவன் தேசங்களின்மேல் அரசரானார்; தேவன் தமது பரிசுத்த அரியணையில் அமர்ந்துகொண்டார்.” எபிரெய நிறைவுவினைகள் அவரது அரசாட்சி நிறுவப்பட்டதை வலியுறுத்துவதாகவும் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: அரசாளுகிறார்
  rationale: எபிரெயக் கவிதையில் இந்நிறைவுவினை தற்போதைய நிலை அல்லது அதன் விளைவை அறிவிக்கக்கூடும். சங்கீதத்தின் அரசராட்சிப் புகழ்ச்சிக்கேற்ப, இயல்பான தமிழில் தொடரும் ஆட்சியை இது வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: இங்கு பன்மை வடிவம் இஸ்ரவேலின் ஒரே தேவனைக் குறிக்கிறது. இரு கவியடிகளிலும் வரும் மீளுரைப்பை வலியுறுத்தலுக்காகத் தக்கவைத்துள்ளோம்.
- source_word: עַל
  choice: -இன்மேல்
  rationale: தேசங்கள்மீதான அரசாட்சியையும் அதிகாரத்தையும் குறிக்கிறது; வெறும் இடநிலையைக் குறிக்கவில்லை.
- source_word: גּוֹיִם
  choice: தேசங்கள்
  rationale: இஸ்ரவேலுக்கு அப்பாற்பட்ட மக்கள் கூட்டங்களை ஒட்டுமொத்தமாகக் குறிக்கும் இயல்பான தமிழ் சொல்; பிற்கால உடன்படிக்கை சார்ந்த பொருளைத் தேவையின்றி புகுத்துவதில்லை.
- source_word: יָשַׁב
  choice: வீற்றிருக்கிறார்
  rationale: அடிப்படைப் பொருள் ‘அமர்ந்திருக்கிறார்’ என்றாலும், அரியணைச் சூழலில் தமிழில் இயல்பாக அரசருக்குரிய அமர்வையும் ஆட்சிநிலையையும் வெளிப்படுத்துகிறது.
- source_word: כִּסֵּא
  choice: அரியணை
  rationale: அரச மற்றும் தெய்வீகச் சூழலில் பொதுவான ‘இருக்கை’ என்பதைவிட ‘அரியணை’ துல்லியமானது.
- source_word: קָדְשׁוֹ
  choice: தமது பரிசுத்த
  rationale: சொல்லுக்குச் சொல் ‘அவருடைய பரிசுத்தத்தின் அரியணை.’ இயல்பான தமிழில் உடைமைப் பொருளையும் பரிசுத்தத் தன்மையையும் ‘தமது பரிசுத்த அரியணை’ காக்கிறது.
theological_decisions:
- issue: எபிரெயக் கவிதையில் நிறைவுவினைகளால் வெளிப்படும் தெய்வீக அரசாட்சி
  choice: 'தற்போதைய அறிவிப்பு: ‘தேவன் ... அரசாளுகிறார்; தேவன் ... வீற்றிருக்கிறார்.’'
  alternative: 'தொடக்க/நிறைவு நிகழ்வு: ‘தேவன் தேசங்களின்மேல் அரசரானார்; தேவன் தமது பரிசுத்த அரியணையில் அமர்ந்துகொண்டார்.’'
  rationale: இந்தச் சங்கீதம் தேவனுடைய தற்போதைய உலகளாவிய அரசாட்சியை வழிபாட்டுக் கவிநடையில் கொண்டாடுகிறது. நிகழ்காலத் தமிழ் அந்தத் தொடரும் உண்மையை இயல்பாகத் தெரிவிக்கிறது; அதேவேளையில், எபிரெய நிறைவுவினைகளில் அரசாட்சி நிறுவப்பட்டதைக் குறிக்கும் சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. ‘வீற்றிருக்கிறார்’ என்பது அரியணைச் சூழலில் இயல்பான அரசராட்சி மொழி; தேவனை நோக்கிய மரியாதைக்காக ‘தமது’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இரட்டை ‘தேவன்’ மீளுரை தக்கவைக்கப்பட்டுள்ளது.
