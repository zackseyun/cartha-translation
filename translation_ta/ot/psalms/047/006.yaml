source:
  edition: WLC
  text: זַמְּר֣וּ אֱלֹהִ֣ים זַמֵּ֑רוּ זַמְּר֖וּ לְ/מַלְכֵּ֣/נוּ זַמֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/006.yaml
  text: Sing praises to God[a], sing praises; sing praises to our King, sing praises.
translation:
  language: ta
  text: 'கடவுளைப் புகழ்ந்து பாடுங்கள்[a], பாடுங்கள்;

    நம் அரசரைப் புகழ்ந்து பாடுங்கள், பாடுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கடவுளுக்கு இசை எழுப்புங்கள் ... நம் அரசருக்கு இசை எழுப்புங்கள்.” எபிரெய வினைச்சொல் பாடுவதை மட்டுமல்லாமல், இசையின் மூலம் செலுத்தப்படும் புகழ்ச்சியையும் விரிவாகக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ / זַמֵּרוּ
  choice: புகழ்ந்து பாடுங்கள்
  rationale: זמר என்ற பன்மை ஏவல் வடிவம் வழிபாட்டுச் சூழலில் இசையுடன் கூடிய புகழ்பாடுதலைக் குறிக்கிறது. ‘புகழ்ந்து பாடுங்கள்’ என்பது அதன் இசை மற்றும் புகழ்ச்சி ஆகிய இரு கூறுகளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெய உரையின் நான்கு முறை மீளுரைத்தலையும் தமிழில் காக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு אֱלֹהִים இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பொருளில் உள்ளது; நவீன பொதுத்தமிழில் ‘கடவுள்’ இயல்பான மொழிபெயர்ப்பு.
- source_word: לְמַלְכֵּנוּ
  choice: நம் அரசரை
  rationale: לְ இங்கு புகழ்பாடல் யாரை நோக்கியது என்பதைக் காட்டுகிறது. ‘நம் அரசரைப் புகழ்ந்து பாடுங்கள்’ என்பது தமிழில் இயல்பாக அந்த இலக்கை வெளிப்படுத்துகிறது; மַלְכֵּנוּ என்பதன் முதல் நபர் பன்மை உடைமைப் பொருளை ‘நம்’ காக்கிறது.
theological_decisions:
- issue: கடவுளின் அரசாட்சி பட்டம்
  choice: நம் அரசர்
  alternative: நம் ராஜா
  rationale: சுற்றியுள்ள சங்கீதச் சூழலில் அரசர் என்பது கடவுளைக் குறிக்கிறது. ‘அரசர்’ மரியாதையுடனும் நவீன பொதுத்தமிழுக்கு ஏற்றவாறும் உள்ளது; மூலத்தில் இல்லாத கூடுதல் கோட்பாட்டைச் சேர்க்காது.
translation_notes:
  register: நவீன, கண்ணியமான, வழிபாட்டுக்கு ஏற்ற பொதுத்தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயில் வரும் நான்கு முறை வினைச்சொல் மீளுரைத்தல் சுருக்கப்படாமல் காக்கப்பட்டுள்ளது. ‘புகழ்ந்து பாடுங்கள்’ என்பது வெறும் ‘பாடுங்கள்’ என்பதைக் காட்டிலும் זמר என்பதன் வழிபாட்டு மற்றும் இசை நுணுக்கத்தைத் தெளிவாக வெளிப்படுத்துகிறது.
