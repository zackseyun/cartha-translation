base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/007.yaml
  text: For God is the King of all the earth[a]; sing a psalm with understanding.
translation:
  language: ta
  text: ஏனெனில், கடவுள் பூமி முழுவதற்கும் அரசர்; புரிந்துணர்வுடன் புகழ்ந்து பாடுங்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “திறமையாகப் பாடுங்கள்”; அல்லது “மஸ்கீல் ஒன்றைப் பாடுங்கள்.” “மஸ்கீல்” என்பது ஓர் இசை அல்லது இலக்கிய வகையைக் குறிக்கும் சொல்லாக இருக்கலாம்.
    reason: מַשְׂכִּיל என்பதற்கு புரிந்துணர்வோடு, திறமையாக, அல்லது ஒரு குறிப்பிட்ட பாடல் வகை என்ற பல சாத்தியமான பொருள்கள் உள்ளன.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய புகழ்ச்சி அழைப்புக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் விளக்க/காரணப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: מֶלֶךְ כָּל־הָאָרֶץ
  choice: பூமி முழுவதற்கும் அரசர்
  rationale: கடவுளின் அரசாட்சி பூமி முழுவதையும் உள்ளடக்குகிறது என்பதைத் தெளிவாகவும் இயல்பாகவும் தெரிவிக்கிறது; ‘அரசர்’ என்பது מֶלֶךְ என்பதன் நேரடியான இணைச்சொல்.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இங்கு ஒருமைப் பொருளில் இஸ்ரவேலின் கடவுளைக் குறிக்கிறது. ‘ஏ’ வலியுறுத்தல் எபிரெய வாக்கியத்தில் இறுதியில் நிற்கும் אֱלֹהִים மீது விழும் இயல்பான அழுத்தத்தைத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: זַמְּרוּ
  choice: புகழ்ந்து பாடுங்கள்
  rationale: זמר என்பது இசையோடு பாடிப் புகழ்வதற்கான பன்மை ஏவல். ‘புகழ்ந்து பாடுங்கள்’ என்பது சங்கீதச் சூழலை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַשְׂכִּיל
  choice: புரிந்துணர்வுடன்
  rationale: இச்சூழலில் அறிவு அல்லது புரிதலோடு பாடுதல் என்ற வினையடைப் பொருளை முதன்மையாகக் கொள்கிறது. ஆயினும் இது திறமையாகப் பாடுதல் அல்லது ‘மஸ்கீல்’ என்ற இலக்கிய/இசை வகையைக் குறிக்கவும் கூடும் என்பதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
theological_decisions:
- issue: கடவுளின் அரசாட்சியின் பரப்பு
  choice: கடவுள் பூமி முழுவதற்கும் அரசர்
  alternative: ‘நிலம் முழுவதற்கும் அரசர்’ என்று குறுகிய நிலப்பரப்பைக் குறிப்பதாக வாசித்தல்
  rationale: כָּל־הָאָרֶץ என்ற சொற்றொடர் இச்சங்கீதச் சூழலில் உலகளாவிய பரப்பை இயல்பாகக் குறிக்கிறது; அதை ஒரு குறிப்பிட்ட நாட்டுக்கோ நிலப்பரப்புக்கோ சுருக்கவில்லை.
- issue: מַשְׂכִּיל என்பதன் தெளிவற்ற பொருள்
  choice: புரிந்துணர்வுடன் பாடுதல்
  alternative: திறமையாகப் பாடுதல் அல்லது ‘மஸ்கீல்’ என்ற பாடலைப் பாடுதல்
  rationale: முதன்மை உரையில் இயல்பான வினையடைப் பொருள் தரப்பட்டுள்ளது; விவாதத்திற்குரிய இசை/இலக்கியப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது, எனவே உரையின் உண்மையான தெளிவின்மை ஒற்றை விளக்கமாகச் சுருக்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் அதேவேளையில் சங்கீதத்திற்கேற்ற கண்ணியமான நடையைக் கொண்டுள்ளது. ‘கடவுளே’ என்ற சொல் வாக்கியத்தின் எபிரெய வலியுறுத்தலைத் தமிழில் இயல்பாகக் காக்கிறது; கடினமான மַשְׂכִּיל என்பதன் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் வழங்கப்பட்டுள்ளன.
