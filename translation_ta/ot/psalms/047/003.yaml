source:
  edition: WLC
  text: יַדְבֵּ֣ר עַמִּ֣ים תַּחְתֵּ֑י/נוּ וּ֝/לְאֻמִּ֗ים תַּ֣חַת רַגְלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/003.yaml
  text: He subdues peoples under us[a], and nations under our feet.
translation:
  language: ta
  text: 'அவர் மக்களை நமக்குக் கீழ்ப்படுத்துகிறார்[a];

    நாடுகளை நம் காலடியில் வைக்கிறார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் மக்களை நமக்கு அடிபணியச் செய்கிறார்.” இங்குள்ள எபிரெய வினைச்சொல் ‘பேசுதல்’ என்றல்ல, கீழ்ப்படுத்துதல் அல்லது அடிபணியச் செய்தல் என்ற பொருளைக் கொண்டுள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְבֵּר
  choice: கீழ்ப்படுத்துகிறார்
  rationale: இங்கு דבר என்பதன் ஹிஃபில் வடிவம், ‘பேசுகிறார்’ என்று அல்லாமல், இணைவரியான ‘நம் காலடியில்’ என்பதற்கு ஏற்றபடி ‘கீழ்ப்படுத்துகிறார்’ என்ற பொருளைத் தருகிறது.
- source_word: עַמִּים
  choice: மக்களை
  rationale: עם என்பதன் பன்மை பல மக்கள் குழுக்களைக் குறிக்கிறது; அடுத்த வரியிலுள்ள לְאֻמִּים என்பதிலிருந்து சொல்லாட்சியளவில் வேறுபடுத்தவும் இது உதவுகிறது.
- source_word: תַּחְתֵּינוּ
  choice: நமக்குக் கீழ்
  rationale: תחת உடன் முதல் நபர் பன்மை விகுதி இங்கு உருவகமாக அதிகாரத்திற்குக் கீழான நிலையைக் குறிக்கிறது; இயல்பான தமிழில் ‘நமக்குக் கீழ்’ அதைத் தெளிவாகத் தருகிறது.
- source_word: וּלְאֻמִּים
  choice: நாடுகளை
  rationale: לְאֻמִּים மக்கள் இனங்கள் அல்லது நாடுகளைக் குறிக்கலாம். முதல் வரியின் ‘மக்கள்’ என்பதிலிருந்து எபிரெயக் கவிதையின் சொல் வேறுபாட்டைக் காக்க ‘நாடுகள்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: תַּחַת רַגְלֵינוּ
  choice: நம் காலடியில்
  rationale: இது வெற்றி மற்றும் அடக்கத்திற்கு உட்பட்ட நிலையைக் குறிக்கும் உருவகம். ‘நம் காலடியில்’ என்பது அதன் நேரடிப் படிமத்தையும் அரசருக்குரிய தொனியையும் காக்கிறது.
theological_decisions:
- issue: வெற்றிச் சொல்லாட்சியில் கூட்டுக் குரலும் செயலாற்றுபவரும்
  choice: கடவுளே செயலாற்றி, மக்களை ‘நமக்குக் கீழ்’ மற்றும் நாடுகளை ‘நம் காலடியில்’ வைக்கிறார்.
  alternative: இஸ்ரவேலின் இராணுவ வெற்றியைப் பற்றிய பொதுவான அரசவைக் கூற்றாக இதைக் கொள்ளுதல்.
  rationale: உடனடி சூழல் அரசாட்சியையும் வெற்றியையும் கடவுளுக்கே உரியதாக்குகிறது. மொழிபெயர்ப்பு முதல் நபர் பன்மையையும் அடக்குதலின் படிமத்தையும் மென்மையாக்காமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. இரண்டு இணைவரிகளின் வேறுபாடு ‘மக்கள்/நாடுகள்’ மற்றும் ‘நமக்குக் கீழ்/நம் காலடியில்’ என்று காக்கப்பட்டுள்ளது.
