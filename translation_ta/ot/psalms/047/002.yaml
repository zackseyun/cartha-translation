lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள புகழ்ச்சிக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் காரணப் பொருளைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் நேரடியாக ஒலிபெயர்க்கிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதரான
  rationale: கடவுளின் உயரிய நிலையைச் சுட்டும் பட்டப்பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: נוֹרָא
  choice: அஞ்சத்தக்கவர்
  rationale: வெறும் பயங்கரத்தை மட்டும் குறிக்காமல், பயபக்தியையும் பிரமிப்பையும் எழுப்புகிறவர் என்ற எபிரெயச் சொல்லின் பொருள் பரப்பைப் பாதுகாக்கிறது.
- source_word: מֶלֶךְ גָּדוֹל
  choice: மகத்தான அரசர்
  rationale: அரசாட்சிப் படிமத்தையும் அவரது உயர்ந்த மாட்சியையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: עַל כָּל הָאָרֶץ
  choice: பூமி முழுவதற்கும்
  rationale: இங்கு אֶרֶץ என்பது ஓர் உள்ளூர் நாட்டை அல்ல, உலகளாவிய ஆட்சிப் பரப்பைக் குறிக்கிறது; தமிழில் அரசரின் ஆட்சித் தொடர்பை இயல்பாகக் காட்டுகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூலவசனம் தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பொதுப் பட்டமாக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: נוֹרָא என்பதன் இறையியல் நுணுக்கம்
  choice: அஞ்சத்தக்கவர்
  alternative: பிரமிப்பூட்டுகிறவர் / அச்சமூட்டுகிறவர்
  rationale: வழிபாட்டுச் சூழலில் பயபக்தி, அச்சம், பிரமிப்பு ஆகியவை இணைந்துள்ள பதற்றத்தை ஒரே பொருளாகச் சுருக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைநயமும் வழிபாட்டுக்குரிய கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அஞ்சத்தக்கவர்’ என்பது பொதுவாசகர்களுக்குப் புரியும் வகையில் அமைந்தாலும், அதன் பரந்த எபிரெயப் பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்பட்டுள்ளது.
