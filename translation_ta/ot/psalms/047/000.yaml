lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத்தலைவருக்காக
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்த்துதலை வழிநடத்தும் தலைவரைச் சுட்டுகிறது. ל முன்னொட்டின் நோக்கம் அல்லது ஒப்படைப்பு சார்ந்த பொருளை ‘-க்காக’ இயல்பாக வெளிப்படுத்துகிறது; ‘இசைத்தலைவருக்கு’ என்பதும் சாத்தியம்.
- source_word: לִבְנֵי
  choice: மகன்களுக்குரியது
  rationale: இங்குள்ள ל முன்னொட்டு தொடர்பு, உடைமை, அர்ப்பணம் அல்லது ஆசிரியத்துவத்தைக் குறிக்கலாம். ‘-க்குரியது’ தொடர்பைப் பேணுவதுடன் ‘இயற்றியது’ என்ற ஆசிரியத்துவத்தையோ ‘-க்காக’ என்ற அர்ப்பணிப்பையோ கட்டாயப்படுத்துவதில்லை.
- source_word: קֹרַח
  choice: கோராகு
  rationale: எபிரெய தனிப்பெயர் நவீனத் தமிழில் தெளிவாக ஒலிபெயர்க்கப்பட்டுள்ளது; வேற்றுமை உருபு சேரும்போது ‘கோராகின்’ என வருகிறது.
- source_word: מִזְמוֹר
  choice: ஒரு சங்கீதம்
  rationale: מִזְמוֹר என்பது இவ்வகைப் புனிதப் பாடலுக்கான வழக்கமான வகைப்பெயர். தமிழில் பரவலாக அறியப்படும் ‘சங்கீதம்’ இதைச் சுருக்கமாகவும் கண்ணியமாகவும் தெரிவிக்கிறது.
