translation_notes:
  register: நவீன நிலையான தமிழில், சுருக்கமான சங்கீதத் தலைப்பு நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘இசைத்தலைவர்’ பொதுவாசகருக்குப் புரியும் liturgical சொல்லாகவும், ‘மகன்களுக்குரியது’ மூலத்தின் உறவுத் தெளிவின்மையைப் பேணும் வடிவமாகவும் தேர்ந்தெடுக்கப்பட்டுள்ளன.
