  language: ta
  text: எல்லா மக்களினங்களே[a], கைகொட்டுங்கள்; மகிழ்ச்சி முழக்கத்துடன்[b] கடவுளை நோக்கி ஆர்ப்பரியுங்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எல்லாத் தேசங்களே.’ எபிரெய עַמִּים என்பது இன அல்லது சமூக அடையாளமுள்ள மக்களினங்களையும், விரிவாகத் தேசங்களையும் குறிக்கலாம்.
    reason: lexical_alternative
