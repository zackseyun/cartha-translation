lexical_decisions:
- source_word: כָּל הָעַמִּים
  choice: மக்களினங்களே, நீங்கள் அனைவரும்
  rationale: כָּל என்பதன் முழுமையையும், עַמִּים என்பதன் பன்மை இன-சமூகப் பொருளையும் இயல்பான தமிழ் விளிப்புத் தொடரில் வெளிப்படுத்துகிறது.
- source_word: תִּקְעוּ כָף
  choice: கைகொட்டுங்கள்
  rationale: உள்ளங்கைகளை ஒன்றோடொன்று அடித்தல் என்ற எபிரெய மரபுத்தொடரின் கொண்டாட்டச் செயலைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: הָרִיעוּ
  choice: ஆர்ப்பரியுங்கள்
  rationale: רוע என்பதன் Hiphil கட்டளை வடிவம் குறிக்கும் உரத்த மகிழ்ச்சி அல்லது வெற்றி முழக்கத்தைச் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: לֵאלֹהִים
  choice: கடவுளை நோக்கி
  rationale: לְ முன்னிடைச்சொல் இங்கு முழக்கத்தின் திசை அல்லது பெறுநரைக் குறிக்கிறது; ‘நோக்கி’ என்பது தமிழில் இதைத் தெளிவாக்குகிறது.
- source_word: בְּקוֹל רִנָּה
  choice: மகிழ்ச்சி முழக்கத்துடன்
  rationale: קוֹל என்பதன் ஒலி/குரல் கருத்தையும் רִנָּה என்பதன் களிப்பான, ஒலித்தெழும் மகிழ்ச்சியையும் இயல்பான தமிழில் இணைக்கிறது.
theological_decisions:
- issue: அழைப்பு யாரை உள்ளடக்குகிறது
  choice: எல்லா மக்களினங்களுக்கும் பொதுவான அழைப்பு
  alternative: இஸ்ரவேலைச் சூழ்ந்திருந்த மக்களுக்கான அணிநய அழைப்பு மட்டும்
  rationale: எபிரெய உரை வெளிப்படையாக ‘எல்லா மக்களினங்கள்’ என்று கூறுகிறது. ஆகவே அதன் உலகளாவிய பரப்பை மொழிபெயர்ப்பு கட்டுப்படுத்தவில்லை.
translation_notes:
  register: நவீன செந்தமிழ் நடையில், பொதுவாசகர்களுக்கு எளிதில் புரியும் வகையில் நேரடி கட்டளை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. ‘ஆர்ப்பரியுங்கள்’ என்பது பாடலின் கொண்டாட்டத் தொனியையும் உரத்த முழக்கத்தையும் காக்கிறது; மூலத்தில் இல்லாத ‘போற்றுங்கள்’ போன்ற விளக்கச் சொல் சேர்க்கப்படவில்லை.
