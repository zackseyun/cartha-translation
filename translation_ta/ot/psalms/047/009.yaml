source:
  edition: WLC
  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
translation:
  language: ta
  text: மக்களினங்களின் மேன்மக்கள் ஆபிரகாமின் கடவுளுடைய மக்களாக ஒன்றுகூடியுள்ளனர்[a]; ஏனெனில், பூமியின் கேடயங்கள் கடவுளுக்குரியவை[b]; அவர் மிகவும் உயர்ந்தவர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஆபிரகாமின் கடவுளுடைய மக்களுடன் ஒன்றுகூடியுள்ளனர்.’ எபிரெயச் சொற்றொடர் நெருங்கிய உடன்சேர்க்கையையோ அவர்களோடு ஒரே மக்களாக அடையாளப்படுத்தப்படுவதையோ குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘பூமியின் கேடயங்கள்’ என்பது சொல்லுக்குச் சொல் மொழிபெயர்ப்பு; இது ‘பூமியின் ஆட்சியாளர்கள்’ அல்லது ‘பாதுகாவலர்கள்’ என்பதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדִיבֵי
  choice: மேன்மக்கள்
  rationale: இந்தச் சொல் உயர்நிலை அல்லது செல்வாக்குடைய பிரபுக்கள், தலைவர்கள் என்பதைக் குறிக்கிறது. ‘மேன்மக்கள்’ மூலத்தின் சமூகத் தரநிலைக் கருத்தைப் பாதுகாக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: עַמִּים
  choice: மக்களினங்கள்
  rationale: பல இன, சமூக அல்லது அரசியல் மக்கள் குழுக்களைக் குறிக்கும் பன்மையைப் பாதுகாக்கிறது; ‘நாடுகள்’ என்பதைவிட மனிதக் குழுக்கள்மீதான கவனத்தைத் தெளிவாக வைத்திருக்கிறது.
- source_word: נֶאֱסָפוּ
  choice: ஒன்றுகூடியுள்ளனர்
  rationale: நிஃபால் வடிவத்தின் தாமாக அல்லது ஒன்றாகக் கூடுதல் என்ற பொருளை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  choice: ஆபிரகாமின் கடவுளுடைய மக்களாக
  rationale: எபிரெயச் சொற்றொடரின் நெருக்கமான இணைப்பை, கூடியவர்கள் ஆபிரகாமின் கடவுளுக்குரிய மக்களாக அடையாளப்படுத்தப்படுகிறார்கள் என்ற வாசிப்பில் தருகிறது; மாற்று உடன்சேர்க்கை வாசிப்பு அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணம் அல்லது அடிப்படையை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לֵאלֹהִים
  choice: கடவுளுக்குரியவை
  rationale: לְ முன்னொட்டு இங்கு உடைமை அல்லது உரிமையைக் குறிப்பதால், அந்த உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: מָגִנֵּי אֶרֶץ
  choice: பூமியின் கேடயங்கள்
  rationale: ஆட்சியாளர்கள் அல்லது பாதுகாவலர்களைக் குறிக்கக்கூடிய மூல உருவகத்தை முதன்மை உரையில் அப்படியே பாதுகாக்கிறது.
- source_word: מְאֹד נַעֲלָה
  choice: அவர் மிகவும் உயர்ந்தவர்
  rationale: ஆண்பால் ஒருமை வடிவத்தின் மறைமுக எழுவாயாக உடனடிச் சூழலிலுள்ள கடவுளை எடுத்துக்கொண்டு, சங்கீதத்தின் மேன்மைப்படுத்தும் மொழியை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: கூடிய மக்களினங்களின் மேன்மக்களுக்கும் ஆபிரகாமின் கடவுளுடைய மக்களுக்கும் உள்ள உறவு
  choice: அவர்கள் ஆபிரகாமின் கடவுளுடைய மக்களாக ஒன்றுகூடுகிறார்கள்.
  alternative: அவர்கள் ஆபிரகாமின் கடவுளுடைய மக்களுடன் ஒன்றுகூடுகிறார்கள்; அல்லது இச்சொற்றொடர் வெளிப்படையான தொடர்புச் சொல்லில்லாத இணைப்பாக இருக்கலாம்.
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமானதும் இலக்கண ரீதியாக ஒன்றுக்கு மேற்பட்ட தொடர்புகளை அனுமதிப்பதும் ஆகும். சங்கீதத்தின் உலகளாவிய அரசாட்சிச் சூழல் அடையாளப்படுத்தும் வாசிப்பை ஆதரித்தாலும், மாற்று உடன்சேர்க்கை வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- issue: ‘பூமியின் கேடயங்கள்’ என்ற உருவகத்தின் அடையாளம்
  choice: உருவகத்தை முதன்மை உரையில் ‘பூமியின் கேடயங்கள்’ எனப் பாதுகாத்தல்.
  alternative: ‘பூமியின் ஆட்சியாளர்கள்’ அல்லது ‘பூமியின் பாதுகாவலர்கள்’.
  rationale: இது அதிகாரிகளையோ பாதுகாவலர்களையோ குறிக்கலாம்; ஆனால் மூலத்தின் வலுவான கவித்துவப் படிமத்தை நேரடியாக நீக்காமல், அதன் பொருள் வாய்ப்பை அடிக்குறிப்பில் தருவது ambiguity-ஐ பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான சங்கீத நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கவித்துவ உருவகமான ‘கேடயங்கள்’ பாதுகாக்கப்பட்டுள்ளது; சுருக்கமான இலக்கணத் தெளிவின்மை அடிக்குறிப்பில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளது.
