  source_fidelity: 'மூல எபிரெயத்தின் முக்கிய கூறுகள் துல்லியமாகக் காக்கப்பட்டுள்ளன: נְדִיבֵי עַמִּים என்பதன் உயர்நிலைத் தலைவர்கள்/பிரபுக்கள் என்ற கருத்து, நிஃபால் வினையின் ‘ஒன்றுகூடுதல்,’ சுருக்கமான עַם אֱלֹהֵי אַבְרָהָם இணைப்பு, லamed-இன் உடைமைப் பொருள், மற்றும் ‘பூமியின் கேடயங்கள்’ என்ற உருவகம் அனைத்தும் பொருத்தமாகத் தரப்பட்டுள்ளன. ‘மக்களாக’ என்பது ஆங்கில audit trail தேர்ந்தெடுத்த inclusion/identification வாசிப்பை வெளிப்படுத்துகிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.'
