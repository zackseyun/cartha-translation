  text: עָלָ֣ה אֱ֭לֹהִים בִּ/תְרוּעָ֑ה יְ֝הֹוָ֗ה בְּ/ק֣וֹל שׁוֹפָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/005.yaml
  text: God has gone up with a shout[a]; Yahweh[b], with the sound of a trumpet.
translation:
  language: ta
  text: ஆர்ப்பரிப்போடு கடவுள் மேலே சென்றார்[a]; எக்காளத்தின்[b] ஒலியோடு யாவே மேலே சென்றார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏறிச் சென்றார்.’
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ஷோஃபார்; ஊதப்படும் கொம்பு எக்காளம்; மரபாக ஆட்டுக்கடாவின் கொம்பால் செய்யப்பட்டது.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: மேலே சென்றார்
  rationale: இந்த வினை ‘மேலே போதல்/ஏறுதல்’ என்பதைக் குறிக்கிறது. சங்கீதத்தின் அரசராட்சி சார்ந்த கவித்துவப் படிமத்தைப் பாதுகாக்கிறது; பிற்கால இறையியல் பொருளைத் தேவையின்றித் திணிக்கவில்லை.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு יְהוָה என்பவருக்கு இணையாக இஸ்ரவேலின் கடவுளையே ஒருமையில் குறிக்கிறது.
- source_word: בִּתְרוּעָה
  choice: ஆர்ப்பரிப்போடு
  rationale: תְּרוּעָה என்பது ஆரவாரமான முழக்கம், வெற்றி ஆர்ப்பரிப்பு அல்லது வழிபாட்டு ஆரவாரம் ஆகியவற்றைக் குறிக்கலாம். ‘ஆர்ப்பரிப்பு’ அதன் பரந்த பொருளைப் பாதுகாக்கிறது; ‘மகிழ்ச்சி’ அல்லது ‘போர்முழக்கம்’ என்று குறுக்கவில்லை.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய தனிப்பெயரான நான்கு எழுத்துத் திருப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரிந்துகொள்ளக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּקוֹל
  choice: ஒலியோடு
  rationale: שׁוֹפָרுடன் வரும் קוֹל என்பதற்கு இயல்பான தமிழ்ச் சொல் ‘ஒலி’; இங்கு கருவியின் ஓசையைச் சுட்டுகிறது.
- source_word: שׁוֹפָר
  choice: கொம்பு எக்காளம்
  rationale: שׁוֹפָר என்பது ஊதிச் சமிக்ஞை கொடுக்கவும் வழிபாட்டிலும் பயன்படுத்தப்பட்ட கொம்புக் கருவி. ‘கொம்பு எக்காளம்’ அதன் வடிவத்தையும் பயன்பாட்டையும் சுருக்கமாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைபெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. ஆகவே அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்து, உடன்படிக்கையின் இறைபெயர் என்ற தன்மையைப் பாதுகாக்கிறது.
- issue: பிற்கால கிறிஸ்தவ வாசிப்பை நினைவூட்டக்கூடிய மேலே செல்லும் மொழி
  choice: மேலே சென்றார்
  alternative: பரமேறினார்
  rationale: சங்கீதத்தில் கடவுளின் அரசராட்சியையும் வெற்றிப் பவனியையும் நினைவூட்டும் படிமம் உள்ளது. ‘மேலே சென்றார்’ எபிரெய வினையின் பரந்த பொருளைப் பாதுகாத்து, குறிப்பிட்ட பிற்கால இறையியல் நிகழ்வை உரைக்குள் திணிப்பதைத் தவிர்க்கிறது.
- issue: இரண்டாம் அடியில் விடுபட்டுள்ள வினை
  choice: ‘மேலே சென்றார்’ என்பதைத் தமிழில் மீண்டும் வெளிப்படையாகக் கூறுதல்
  alternative: ‘கொம்பு எக்காளத்தின் ஒலியோடு யாவே’ என்று கவித்துவ விடுபாட்டை அப்படியே வைத்தல்
  rationale: எபிரெயக் கவிதையில் முதல் அடியின் வினை இரண்டாம் அடியிலும் பொருளால் தொடர்கிறது. தமிழில் அதை மீண்டும் கூறுவது இயல்பான வாசிப்பைத் தருகிறது; புதிய கருத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கவித்துவ நடை பயன்படுத்தப்பட்டுள்ளது. இணை அடிகளின் அமைப்பு காக்கப்பட்டாலும், தமிழில் பொருள் தெளிவாக இருக்க இரண்டாம் அடியில் வினை மீண்டும் கூறப்பட்டுள்ளது.
