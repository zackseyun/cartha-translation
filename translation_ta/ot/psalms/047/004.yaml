  text: He chooses for us our inheritance[a], the pride of Jacob, whom he loves[c][b]. Selah
translation:
  language: ta
  text: அவர் நமக்காக நமது சுதந்தரத்தைத் தேர்ந்தெடுக்கிறார்[a]—அவர் நேசிக்கும் யாக்கோபின் மேன்மையை[b]. சேலா[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் நமக்காக நமது சுதந்தரத்தைத் தேர்ந்தெடுப்பார்—அவர் நேசிக்கும் யாக்கோபின் மகிமையை.”
    reason: lexical_alternative
  - marker: b
    text: '“அவர் நேசிக்கும்” என்பது யாக்கோபைக் குறிப்பதாகப் புரிந்துகொள்ளப்படுகிறது. அது சுதந்தரத்தையோ நிலத்தையோ குறிப்பதாகவும் புரிந்துகொள்ளலாம்: “அவர் நேசிக்கும் யாக்கோபின் மேன்மையாகிய நமது சுதந்தரம்.”'
    reason: alternative_reading
  - marker: c
    text: “சேலா” என்பது பொருள் உறுதியாகத் தெரியாத ஓர் எபிரெய வழிபாட்டு அல்லது இசைக் குறியீடு; மரபுப்படி இது மொழிபெயர்க்கப்படாமல் விடப்படுகிறது.
    reason: cultural_note
lexical_decisions:
- source_word: יִבְחַר
  choice: தேர்ந்தெடுக்கிறார்
  rationale: Qal imperfect வடிவம் நிகழ்காலத் தொடர்ச்சி அல்லது எதிர்காலத்தை உணர்த்தலாம். சங்கீதத்தின் சூழலில் கடவுளின் தொடர்ந்த செயலைக் காட்ட நிகழ்காலம் இயல்பாக உள்ளது; எதிர்கால வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָנוּ
  choice: நமக்காக
  rationale: לְ முன்னொட்டுடன் முதல் நபர் பன்மை பின்னொட்டு சேர்ந்து நன்மை அல்லது சார்பைக் குறிக்கிறது; இயல்பான நவீனத் தமிழில் ‘நமக்காக’ என வழங்கப்படுகிறது.
- source_word: נַחֲלָתֵנוּ
  choice: நமது உரிமைச் சொத்து
  rationale: נחלה என்பது பரம்பரை உரிமையாக அல்லது பங்கீட்டால் கிடைக்கும் நிலம்/உடைமையைக் குறிக்கும். ‘உரிமைச் சொத்து’ அதன் உடைமை மற்றும் உடன்படிக்கை சார்ந்த கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: אֶת ... אֶת
  choice: தனியே மொழிபெயர்க்கப்படவில்லை
  rationale: இரண்டு אֶת வடிவங்களும் நேரடிச் செயப்படுபொருளைக் குறிக்கின்றன. இரண்டாவது, ‘நமது உரிமைச் சொத்து’ என்பதை ‘யாக்கோபின் பெருமை’ என்று மேலும் விளக்குகிறது; தமிழில் வேறு சொல் தேவையில்லை.
- source_word: גְּאוֹן
  choice: பெருமை
  rationale: இந்தச் சொல் பெருமை, மேன்மை, மகிமை, மாட்சிமை ஆகிய நேர்மறை அர்த்தங்களைக் கொள்ளலாம். இங்கு யாக்கோபுக்குரிய சிறப்பான உரிமைச் சொத்தைச் சுட்டுவதால் ‘பெருமை’ பொருத்தமானது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: எபிரெய உரையில் உள்ள தனிப்பட்டதும் மக்களினத்தைக் குறிப்பதுமான பெயர் அப்படியே ஒலிபெயர்க்கப்படுகிறது; விளக்கமாக ‘இஸ்ரவேல்’ என்று மாற்றப்படவில்லை.
- source_word: אֲשֶׁר אָהֵב
  choice: அவர் நேசிக்கும்
  rationale: אָהֵב perfect வடிவில் இருந்தாலும் தொடரும் நிலையான அன்பை உணர்த்தக்கூடும். நவீனத் தமிழில் ‘நேசிக்கும்’ என்பது அந்தத் தொடரும் உறவை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இதன் துல்லியமான பொருளும் வழிபாட்டு அல்லது இசைப் பணியும் உறுதியாகத் தெரியாததால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: ‘அவர் நேசிக்கும்’ என்ற சார்பு வாக்கியத்தின் தொடர்பு
  choice: அது ‘யாக்கோபு’ என்பதைக் குறிப்பதாக முதன்மை உரையில் வழங்கப்பட்டுள்ளது.
  alternative: 'அது உரிமைச் சொத்து அல்லது நிலத்தைக் குறிப்பதாகவும் புரிந்துகொள்ளலாம்: ‘அவர் நேசிக்கும் யாக்கோபின் பெருமையாகிய உரிமைச் சொத்து.’'
  rationale: அருகிலுள்ள தனிப்பட்ட குறிப்பு ‘யாக்கோபு’ என்பதால் கடவுள் யாக்கோபை நேசிக்கிறார் என்ற வாசிப்பு இயல்பானது. எனினும் எபிரெயத் தொடரமைப்பு உரிமைச் சொத்து/நிலம் என்ற தொடர்பையும் அனுமதிப்பதால் அந்த உண்மையான தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உரிமைச் சொத்து’ பொதுவாசகர்களுக்குப் புரியும் வகையில் பரம்பரை/பங்கீட்டு உடைமை உணர்வைக் காக்கிறது. கவிதைத் தொடரில் இரண்டாம் செயப்படுபொருள் முதலாவதை விளக்கும் விதத்தை நீள்கோடு வெளிப்படுத்துகிறது.
