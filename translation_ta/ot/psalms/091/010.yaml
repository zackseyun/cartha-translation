  text: எந்தத் தீங்கும் உனக்கு நேரிடாது[a]; எந்த வாதையும் உன் கூடாரத்தை[b] நெருங்காது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்தத் தீமையும் உன்னை வந்தடையாது.”
