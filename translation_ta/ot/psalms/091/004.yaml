  naturalness: ‘சிறகுகளின்கீழ்’ என்பதற்குப் பதில் ‘சிறகுகளின் கீழ்’ என்பது நவீனத் தரமான தமிழில் இயல்பான இடைவெளியமைப்பு. ‘சிறகிறகுகளால்’ என்ற அடிக்குறிப்பு மாற்று தமிழ் வழக்கில் இயல்பற்றதும் தேவையற்ற மறுகூற்றுமானது; ‘இறகுகளால்’ என்பதே தெளிவான மாற்று. ‘உண்மைத்தன்மை’ இங்கு இயல்பாக உள்ளது.
