source:
  edition: WLC
  text: בְּ/אֶבְרָת֨/וֹ יָ֣סֶךְ לָ֭/ךְ וְ/תַֽחַת כְּנָפָ֣י/ו תֶּחְסֶ֑ה צִנָּ֖ה וְֽ/סֹחֵרָ֣ה אֲמִתּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/004.yaml
  text: With his pinions he will cover you[a], and under his wings you will find refuge[b]; his faithfulness is a shield and a bulwark.
translation:
  language: ta
  text: 'தமது இறகுகளால் அவர் உன்னை மூடுவார்[a];

    அவருடைய சிறகுகளின் கீழ் நீ அடைக்கலம் புகுவாய்.

    அவருடைய உண்மைத்தன்மையே பெருங்கேடயமும் காப்புக் கேடயமும்[b] ஆகும்[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தமது இறகமைப்பால் அவர் உன்னை மூடுவார்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயச் சொல்லின் துல்லியமான பொருள் உறுதியற்றது; “சிறுகேடயம்” அல்லது “சுற்றிலும் காக்கும் பாதுகாப்பு” என்றும் பொருள்படலாம்.
    reason: textual_or_lexical_ambiguity
  - marker: c
    text: அல்லது, “அவருடைய உண்மை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  choice: தமது இறகுகளால்
  rationale: אֶבְרָה என்பது பறவையின் இறகுகள், சிறகிறகுகள் அல்லது இறகமைப்பைக் குறிக்கலாம். தமிழில் இயல்பாகவும் பறவை உருவகத்தைத் தெளிவாகவும் தருவதற்காக ‘இறகுகளால்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: יָסֶךְ
  choice: அவர் உன்னை மூடுவார்
  rationale: סכך என்பதன் இவ்வடிவம் மூடிக் காப்பதைக் குறிக்கிறது. ‘மூடுவார்’ என்பது மூல உருவகத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: לָךְ
  choice: உன்னை
  rationale: எபிரெய வடிவம் ஒருமை இரண்டாம் நபர் பெண்பாலாக இருந்தாலும், சங்கீதம் பொதுவாக வழிபடுபவரை நோக்கிப் பேசுகிறது. தமிழில் பாலினம் குறிக்காத ஒருமை வடிவம் பயன்படுத்தப்பட்டது.
- source_word: וְתַחַת כְּנָפָיו
  choice: அவருடைய சிறகுகளின்கீழ்
  rationale: பறவை தன் குஞ்சுகளைச் சிறகுகளின்கீழ் காக்கும் பாதுகாப்பு உருவகத்தை நேரடியாகத் தொடர்கிறது.
- source_word: תֶּחְסֶה
  choice: நீ அடைக்கலம் புகுவாய்
  rationale: חסה என்பது அடைக்கலம் தேடுதல் அல்லது புகுதல் என்று பொருள்படும். ‘அடைக்கலம் புகுவாய்’ என்பது செயற்பாட்டையும் பாதுகாப்பையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: צִנָּה
  choice: பெருங்கேடயம்
  rationale: צִנָּה பொதுவாக உடலின் பெரும்பகுதியை மறைக்கும் பெரிய கேடயத்தைக் குறிக்கிறது; அளவு நுட்பத்தைத் தக்கவைக்க ‘பெருங்கேடயம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וְסֹחֵרָה
  choice: காப்பரண்
  rationale: இந்த அரிய சொல்லின் துல்லியமான பொருள் உறுதியற்றது; கேடயம், சிறுகேடயம் அல்லது சுற்றிக் காக்கும் பாதுகாப்பு எனப் புரிந்துகொள்ளப்படுகிறது. ‘காப்பரண்’ சுற்றிலும் பாதுகாக்கும் வலிமையை இயல்பான தமிழில் தருகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אֲמִתּוֹ
  choice: அவருடைய உண்மைத்தன்மை
  rationale: אֱמֶת என்பது உண்மை, உண்மைத்தன்மை, நம்பகத்தன்மை ஆகிய பொருள்களைக் கொண்டது. பாதுகாப்பின் ஆதாரமாகக் கடவுளின் நம்பத்தகுந்த இயல்பை இச்சூழலில் ‘உண்மைத்தன்மை’ தெளிவாக வெளிப்படுத்துகிறது; ‘உண்மை’ என்ற சாத்தியமும் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: אֲמִתּוֹ என்பதிலுள்ள ‘உண்மை’ மற்றும் ‘உண்மைத்தன்மை’ என்னும் பொருள் நுட்பங்கள்
  choice: அவருடைய உண்மைத்தன்மை
  alternative: அவருடைய உண்மை
  rationale: இரண்டும் எபிரெயச் சொல்லின் உண்மையான பொருட்கள். இவ்வசனத்தின் பாதுகாப்பு உருவகத்தில் கடவுளின் நம்பகத்தன்மை வலியுறுத்தப்படுவதால் ‘உண்மைத்தன்மை’ முதன்மை உரையில் உள்ளது; பொருள் இருமை அடிக்குறிப்பால் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. பறவை உருவகத்திலிருந்து போர்க் காப்பு உருவகத்துக்குச் செல்லும் மூலக் கவிதை இயக்கம் தக்கவைக்கப்பட்டுள்ளது. ‘பெருங்கேடயம்’ மூலச்சொல்லின் அளவு நுட்பத்தை வெளிப்படுத்துகிறது; அரிய சொல்லின் உறுதியின்மையும் אֱמֶת என்பதன் பொருள் விரிவும் அடிக்குறிப்புகளில் வெளிப்படையாகப் பாதுகாக்கப்பட்டுள்ளன.
