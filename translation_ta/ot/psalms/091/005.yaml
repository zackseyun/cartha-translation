lexical_decisions:
- source_word: תִירָא
  choice: நீ அஞ்சமாட்டாய்
  rationale: לֹא உடன் வரும் Qal imperfect இரண்டாம் நபர் ஒருமை வடிவம், இச்சூழலில் கட்டளையாக அல்லாமல் உறுதியளிக்கும் எதிர்காலக் கூற்றாக இயல்பாகப் புரிகிறது.
- source_word: פַּחַד
  choice: பயங்கரம்
  rationale: இச்சொல் வெறும் அச்ச உணர்வை மட்டுமல்ல, அச்சுறுத்தும் பயங்கரத்தையும் திகிலையும் குறிக்கிறது; கவிதை இணைப்பில் ‘பயங்கரம்’ அதைப் பொருத்தமாக வெளிப்படுத்துகிறது.
- source_word: לָיְלָה
  choice: இரவின்
  rationale: ‘இரவின் பயங்கரம்’ என்ற தொடர்பைச் சுருக்கமாகவும் இயல்பாகவும் காட்டி, ‘பகலில்’ என்பதோடு உள்ள கவிதை முரணைத் தக்கவைக்கிறது.
- source_word: חֵץ
  choice: அம்பு
  rationale: முதன்மையான நேரடிப் பொருள் ‘அம்பு’; அது ஆபத்துக்கான உருவகமாக இருக்கக்கூடிய நிலையிலும் மூலத்தின் கண்முன் நிற்கும் படிமம் பாதுகாக்கப்படுகிறது.
- source_word: יָעוּף
  choice: பறக்கும்
  rationale: עוּף என்பதன் Qal imperfect வடிவத்தின் இயல்பான பொருள் ‘பறத்தல்’; இங்கு அது ‘அம்பு’ என்பதை விவரிக்கும் பெயரெச்சத் தொடராக வழங்கப்படுகிறது.
- source_word: יוֹמָם
  choice: பகலில்
  rationale: இந்த வினையடை தமிழில் ‘பகலில்’ என்று இயல்பாக அமைகிறது; ‘இரவின்’ என்பதோடு உள்ள கால முரணையும் தெளிவாக்குகிறது.
- source_word: מִן ... מִן
  choice: …க்கும் …க்கும்
  rationale: அஞ்ச வேண்டியதாகக் கருதப்படும் இரு ஆபத்துகளையும் தமிழின் இணை எண்ணும்மை அமைப்பால் இயல்பாகத் தொடர்புபடுத்துகிறது; எபிரெயச் சொல்லமைப்பை மரத்தனமாகப் பின்பற்றாமல் அதன் பொருள் உறவைப் பாதுகாக்கிறது.
theological_decisions:
- issue: வசனத்தை கட்டளையாக வழங்குவதா, வாக்குறுதி/உறுதிப்பாடாக வழங்குவதா
  choice: 'உறுதிப்பாடு: ‘நீ அஞ்சமாட்டாய்’'
  alternative: 'கட்டளை: ‘அஞ்சாதே’ அல்லது பொருள் விளக்கமாக ‘நீ அஞ்சத் தேவையில்லை’'
  rationale: எபிரெயத்தில் לֹא உடன் imperfect வடிவம் பயன்படுத்தப்பட்டுள்ளது. இக்கவிதைச் சூழலில் இது நேரடித் தடைக் கட்டளையைவிட, பாதுகாக்கப்படுகிறவரைக் குறித்த உறுதியளிக்கும் கூற்றாக இயல்பாக அமைகிறது; இருப்பினும் அதன் உறுதியளிக்கும் பொருள் அடிக்குறிப்பில் மாற்றாகக் காட்டப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘இரவின் … பகலில்’ என்ற முரணும், ‘பயங்கரம் … அம்பு’ என்ற தெளிவான படிமங்களும் பாதுகாக்கப்பட்டுள்ளன.
