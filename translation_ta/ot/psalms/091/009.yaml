base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/009.yaml
  text: Because you[a], O Yahweh, are my refuge, you have made the Most High your dwelling place.
translation:
  language: ta
  text: ஏனெனில், யாவே, நீரே என் புகலிடம்[a]; உன்னதமானவரை உமது உறைவிடமாக வைத்தீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'கடினமான எபிரெயத் தொடரை வழக்கமாகப் புரிந்துகொள்ளும் மற்றொரு முறை: நீர், “யாவே என் புகலிடம்” என்று சொல்லி, உன்னதமானவரை உமது உறைவிடமாக வைத்ததால்.'
