lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள பாதுகாப்பு வாக்குறுதிக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் காரணப்பொருளை இயல்பான நவீன தமிழில் காக்கிறது.
- source_word: אַתָּה
  choice: நீரே
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமைச் சுட்டுப்பெயரின் வலியுறுத்தலைத் தமிழில் மரியாதை ஒருமையுடன் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைப் பயன்படுத்துகிறது.
- source_word: מַחְסִי
  choice: என் புகலிடம்
  rationale: מַחְסֶה என்பதன் பாதுகாப்புக்காக அடைக்கலம் புகும் இடம் என்ற பொருளை சங்கீத மொழிநடைக்கு ஏற்ற தெளிவான தமிழில் தருகிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: தேவனைக் குறிக்கும் ‘மிக உயர்ந்தவர்’ என்ற இறைப் பட்டத்தை இயல்பான, கண்ணியமான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שַׂמְתָּ
  choice: உமது உறைவிடமாக்கிக்கொண்டீர்
  rationale: שׂים என்பதன் ‘ஒன்றைத் தனக்குரிய ஒன்றாக அமைத்தல்/ஏற்படுத்தல்’ என்ற பொருளை, உறைவிடத்தைத் தேர்ந்தெடுத்துக்கொள்ளும் சூழலில் இயல்பாகத் தருகிறது.
- source_word: מְעוֹנֶךָ
  choice: உமது உறைவிடம்
  rationale: מָעוֹן என்பதன் வசிப்பிடம் என்ற பொருளைக் காக்கிறது; முன்னுள்ள ‘புகலிடம்’ என்பதிலிருந்து சொற்பொருள் வேறுபாட்டையும் பேணுகிறது.
theological_decisions:
- issue: சங்கீதம் 91:9-இல் பேசுபவர் மற்றும் அழைக்கப்படுபவர் தொடர்பான கடினமான தொடரியல்
  choice: மசோரெத் உரையில் உள்ள சொற்களைச் சேர்த்துப் பூர்த்தி செய்யாமல், ‘யாவே, நீரே என் புகலிடம்’ என்ற நேரடி அழைப்பைத் தொடர்ந்து ‘உன்னதமானவரை உமது உறைவிடமாக்கிக்கொண்டீர்’ என மொழிபெயர்க்கப்பட்டது.
  alternative: ‘“யாவே என் புகலிடம்” என்று நீ சொன்னதாலும், உன்னதமானவரை உன் உறைவிடமாக்கிக்கொண்டதாலும்’ என்று மறைந்துள்ள ‘சொன்னாய்’ என்ற வினையை நிரப்பிப் புரிந்துகொள்ளலாம்.
  rationale: எபிரெய உரையில் ‘சொன்னாய்’ என்பதற்கான வெளிப்படையான வினை இல்லை; ‘என் புகலிடம்’ என்பதிலிருந்து ‘உமது உறைவிடம்’ என நபர் மாறுவதால் தொடரியல் கடினமாகிறது. முதன்மை உரை மசோரெத் சொற்களை மிகக் குறைந்த நிறைவுடன் காக்கிறது; பரவலாகக் காணப்படும் மாற்றுப் புரிதல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதத்துக்கேற்ற கண்ணியமான ஆனால் பொதுவாசகருக்குப் புரியும் நடை. தேவனை நோக்கிய ஒருமை மரியாதைக்காக ‘நீர்/உமது’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் நபர் மாற்றமும் தொடரியல் இழுப்பும் முற்றிலும் சமப்படுத்தப்படாமல் காக்கப்பட்டுள்ளன.
