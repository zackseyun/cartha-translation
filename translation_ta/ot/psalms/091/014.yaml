  text: Because he clings to me[a], I will rescue him; I will set him securely on high[b], because he knows my name.
translation:
  language: ta
  text: அவன் என்னைப் பற்றிக்கொண்டதால்[a], நான் அவனை விடுவிப்பேன்; அவனை உயரத்தில் பாதுகாப்பாக வைப்பேன்[b], ஏனெனில் அவன் என் பெயரை அறிந்திருக்கிறான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவன் என்னை நேசிப்பதால்’ அல்லது ‘அவன் தன் அன்பை என்மேல் வைத்ததால்.’ எபிரேய வினைச்சொல் ஆழ்ந்த பற்றையும் விடாத இணைப்பையும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவனை உயரத்தில் வைப்பேன்’ அல்லது ‘அவனைப் பாதுகாப்பேன்.’ எபிரேய வினைச்சொல் ஒருவரை எட்ட முடியாத பாதுகாப்பான உயரத்தில் வைப்பதைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: என்பதால் / காரணத்தால்
  rationale: இரு இடங்களிலும் இறைவனுடைய செயலுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெயக் காரணப் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בִי חָשַׁק
  choice: என்னைப் பற்றிக்கொண்டதால்
  rationale: חָשַׁק என்பதிலுள்ள ஆழ்ந்த பற்று, அன்பு, விடாத இணைப்பு ஆகிய பொருள் பரப்பை ‘பற்றிக்கொண்டான்’ இயல்பாகக் காக்கிறது; வெறும் உணர்ச்சியாக மட்டும் சுருக்கவில்லை.
- source_word: וַאֲפַלְּטֵהוּ
  choice: நான் அவனைத் தப்புவிப்பேன்
  rationale: ஆபத்திலிருந்து விடுவிக்கும் இறை வாக்குறுதியைத் தெளிவான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: אֲשַׂגְּבֵהוּ
  choice: அவனைப் பாதுகாப்பான உயரத்தில் வைப்பேன்
  rationale: எட்ட முடியாத உயரத்தில் வைத்து பாதுகாப்பது என்ற உயர்வு உருவகத்தையும் அதன் பாதுகாப்புப் பொருளையும் ஒருங்கே காக்கிறது.
- source_word: יָדַע שְׁמִי
  choice: என் பெயரை அறிந்திருக்கிறான்
  rationale: இறைவனுடைய பெயரை உறவுசார் விதத்தில் அறிதல் என்ற பொருளை மிகைப்படுத்தாமல், மூலத்தின் ‘பெயர்’ என்ற சொல்லாட்சியையே தக்கவைக்கிறது.
theological_decisions:
- issue: இறைவனிடத்திலான ஆழ்ந்த பற்றைக் குறிக்கும் חָשַׁק
  choice: அவன் என்னைப் பற்றிக்கொண்டதால்
  alternative: அவன் என்னை நேசிப்பதால் / அவன் தன் அன்பை என்மேல் வைத்ததால்
  rationale: உணர்ச்சிப்பூர்வமான அன்பையும் உறுதியான இணைப்பையும் உள்ளடக்கும் மூலமொழியின் நெகிழ்வை இது காக்கிறது; ஒரு குறுகிய பக்திசார் விளக்கத்தைத் திணிக்கவில்லை.
- issue: אֲשַׂגְּבֵהוּ என்பதிலுள்ள பாதுகாப்பு-உயர்வு உருவகம்
  choice: அவனைப் பாதுகாப்பான உயரத்தில் வைப்பேன்
  alternative: அவனைப் பாதுகாப்பேன் / அவனை உயர்த்துவேன்
  rationale: பாதுகாப்பை மட்டும் கருத்தாக்கமாகச் சொல்லாமல், அணுக முடியாத உயரத்தில் வைக்கும் கவித்துவ உருவகத்தையும் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்தின் கவித்துவமும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘தப்புவிப்பேன்’ என்பது தெளிவான மீட்பு மொழியாகவும், ‘பாதுகாப்பான உயரம்’ என்பது மூல உருவகத்தை விளங்கத்தக்க முறையில் காக்கவும் தேர்ந்தெடுக்கப்பட்டது.
