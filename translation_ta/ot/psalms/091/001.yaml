source:
  edition: WLC
  text: יֹ֭שֵׁב בְּ/סֵ֣תֶר עֶלְי֑וֹן בְּ/צֵ֥ל שַׁ֝דַּ֗י יִתְלוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/001.yaml
  text: He who dwells in the shelter of the Most High will lodge in the shadow of the Almighty[a][b][c].
translation:
  language: ta
  text: உன்னதமானவரின் மறைவிடத்தில் குடியிருப்பவன்[a][b], எல்லாம் வல்லவரின் நிழலில் இரவைக் கழிப்பான்[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘குடியிருப்பவர்’ அல்லது ‘குடியிருப்போர் எவரும்.’ எபிரெயச் சொல் இலக்கணப்படி ஆண்பால் ஒருமையில் உள்ளது; ஆனால் ஒருவரை பிரதிநிதியாகக் கொண்டு பொதுவாகவும் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘உன்னதமானவரின் அடைக்கலத்தில்.’ எபிரெயச் சொல் மறைக்கப்பட்ட இடத்தையும் பாதுகாப்பான புகலிடத்தையும் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, ‘தங்கியிருப்பான்’ அல்லது ‘இரவில் தங்குவான்.’ எபிரெய வினை இரவுத் தங்குதலைக் குறிப்பாகவும், விரிவான பொருளில் தொடர்ந்து நிலைத்திருத்தலையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: குடியிருப்பவன்
  rationale: இந்த எபிரெயப் பங்கேற்புவினை பெயர்ச்சொல்லாகச் செயல்பட்டு, தொடர்ந்து ஒரு இடத்தில் வாழும் தன்மையுடைய ஒருவரைக் குறிக்கிறது. ‘அமர்ந்திருப்பவன்’ என்பதைக் காட்டிலும் ‘குடியிருப்பவன்’ நிலையான வாசத்தை இயல்பாக வெளிப்படுத்துகிறது; ஆண்பால் ஒருமையையும் காக்கிறது.
- source_word: בְּסֵתֶר
  choice: மறைவிடத்தில்
  rationale: סֵתֶר என்பது மறைக்கப்பட்ட, பாதுகாப்பளிக்கும் இடத்தைக் குறிக்கலாம். ‘மறைவிடம்’ மறைந்திருத்தல் என்ற மூலப்படிமத்தைத் தெளிவாகக் காக்கிறது; பாதுகாப்பு என்ற உட்பொருளையும் சூழல் உணர்த்துகிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவர்
  rationale: இது கடவுளை ‘மிக உயர்ந்தவர்’ என்று குறிப்பிடும் தெய்வீகப் பட்டம். ‘உன்னதமானவர்’ என்பது உயர்வையும் மகத்துவத்தையும் கண்ணியமான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּצֵל
  choice: நிழலில்
  rationale: எபிரெய முன்னொட்டும் பெயர்ச்சொல்லும் நேரடியாக ‘நிழலில்’ எனப் பொருள்படும். இந்த உருவகம் அருகாமையையும் பாதுகாப்பையும் சுருக்கமாகக் காக்கிறது.
- source_word: שַׁדַּי
  choice: எல்லாம் வல்லவர்
  rationale: தெய்வீகப் பட்டத்தை ஒலிபெயர்க்காமல் அதன் வழக்கமான பொருளைத் தமிழில் தெரிவிக்கிறது. ‘எல்லாம் வல்லவர்’ தெளிவான, இயல்பான தமிழில் தெய்வீக வல்லமையை உணர்த்துகிறது.
- source_word: יִתְלוֹנָן
  choice: இரவைக் கழிப்பான்
  rationale: לון என்ற வேரிலிருந்து வந்த இவ்வினை இரவில் தங்குதல் அல்லது இரவைக் கழித்தல் என்ற குறிப்பான பொருளையும், விரிவாக நிலைத்திருத்தல் என்ற பொருளையும் கொண்டது. ‘இரவைக் கழிப்பான்’ மூலத்தின் இரவுத் தங்கும் உருவகத்தைப் பாதுகாக்கிறது.
theological_decisions:
- issue: ஆண்பால் ஒருமையில் உள்ள பங்கேற்பாளரைப் பொதுவான பிரதிநிதியாக மொழிபெயர்த்தல்
  choice: குடியிருப்பவன்
  alternative: குடியிருப்பவர்; குடியிருப்போர் எவரும்
  rationale: எபிரெயம் இலக்கணப்படி ஆண்பால் ஒருமையைப் பயன்படுத்தினாலும், அது பிரதிநிதித்துவமான பொதுப் பொருளைக் கொள்ளக்கூடும். முதன்மை உரை மூல வடிவத்தைப் பாதுகாக்கிறது; பொதுவான பொருள் அடிக்குறிப்பில் தெளிவுபடுத்தப்படுகிறது.
- issue: שַׁדַּי என்ற தெய்வீகப் பட்டத்தை வழங்குதல்
  choice: எல்லாம் வல்லவர்
  alternative: ஷத்தாய்
  rationale: இங்கு சொல்லை பெயராக ஒலிபெயர்ப்பதற்குப் பதிலாக, அதன் பட்டப் பொருளை மொழிபெயர்ப்பது நவீன வாசகருக்குத் தெளிவாக உள்ளது; எந்தக் குறிப்பிட்ட சமய மரபின் தனிப்பட்ட விளக்கத்தையும் சேர்ப்பதில்லை.
- issue: יִתְלוֹנָן என்பதிலுள்ள இரவுத் தங்குதல் மற்றும் நிலைத்திருத்தல் ஆகிய பொருள் நெருக்கத்தைப் பாதுகாத்தல்
  choice: இரவைக் கழிப்பான்
  alternative: தங்கியிருப்பான்; நிலைத்திருப்பான்
  rationale: முதன்மை உரை வினையின் குறிப்பான இரவுத் தங்கும் படிமத்தை வைத்திருக்கிறது; நீடித்திருத்தல் என்ற விரிவான பொருள் அடிக்குறிப்பில் விடப்படுகிறது. இதனால் கவிதையின் பொருள் நெருக்கம் முன்கூட்டியே தீர்க்கப்படுவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘உன்னதமானவர்’ மற்றும் ‘எல்லாம் வல்லவர்’ ஆகியவை தெய்வீகப் பட்டங்களாக மொழிபெயர்க்கப்பட்டுள்ளன. முதன்மை உரையில் எபிரெயத்தின் ஆண்பால் ஒருமையும் இரவுத் தங்கும் உருவகமும் காக்கப்பட்டு, மாற்றுப் பொருள்கள் அடிக்குறிப்புகளில் தரப்பட்டுள்ளன.
