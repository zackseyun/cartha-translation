  text: He will call on me[a], and I will answer him; I am with him in trouble[b]; I will rescue him and honor him.
translation:
  language: ta
  text: அவன் என்னை நோக்கிக் கூப்பிடுவான்; நான் அவனுக்குப் பதிலளிப்பேன். துன்பத்தில் நான் அவனோடு இருப்பேன்; அவனைக் காப்பாற்றுவேன்[a], அவனைக் கௌரவிப்பேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவனை விடுவிப்பேன்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவனை மகிமைப்படுத்துவேன்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָאֵנִי
  choice: அவன் என்னை நோக்கிக் கூப்பிடுவான்
  rationale: קרא என்பது இங்கு இறைவனை உதவிக்காக அழைப்பதைக் குறிக்கிறது. ‘என்னை நோக்கிக் கூப்பிடுவான்’ என்பது வேண்டுதல் சார்ந்த பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: וְאֶעֱנֵהוּ
  choice: நான் அவனுக்குப் பதிலளிப்பேன்
  rationale: ענה என்பதன் நேரடியான ‘பதிலளித்தல்’ என்ற பொருளைத் தெளிவாகப் பாதுகாக்கிறது; அழைத்தல்–பதிலளித்தல் என்ற இணைப்பும் நிலைக்கிறது.
- source_word: עִמּוֹ אָנֹכִי
  choice: நான் அவனோடு இருப்பேன்
  rationale: எபிரெயத்தில் முன்னிலைப்படுத்தப்பட்டுள்ள ‘அவனோடு’ என்ற கூறின் வலியுறுத்தலை இயல்பான தமிழ்ச் சொல்வரிசையில் ‘துன்பத்தில் நான் அவனோடு’ எனப் பாதுகாக்கிறது.
- source_word: בְצָרָה
  choice: துன்பத்தில்
  rationale: צָרָה குறிக்கும் நெருக்கடி, இடுக்கண், துயரம் ஆகிய பரப்பை சாதாரண வாசகர்களுக்குப் புரியும் சுருக்கமான சொல்லால் தெரிவிக்கிறது.
- source_word: אֲחַלְּצֵהוּ
  choice: அவனைக் காப்பாற்றுவேன்
  rationale: חלץ என்பதன் ஆபத்திலிருந்து மீட்கும் செயற்பாட்டு உணர்வை ‘காப்பாற்றுவேன்’ தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: וַאֲכַבְּדֵהוּ
  choice: அவனைக் கௌரவிப்பேன்
  rationale: כבד என்பதன் இங்குள்ள ‘மதிப்பளித்தல்/கனம் அளித்தல்’ என்ற பொருளை நவீன தமிழில் இயல்பாகத் தருகிறது; ‘மகிமைப்படுத்துவேன்’ என்ற சாத்தியமான உயர்நடைப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: இறைவனுடைய வாக்குறுதிகளுக்கு மூலவசனத்தில் இல்லாத நிபந்தனைகளைச் சேர்க்காமல் மொழிபெயர்த்தல்
  choice: அழைப்பு, பதில், உடனிருப்பு, காப்பாற்றுதல், கௌரவித்தல் ஆகிய இறைச் செயல்களை வசனம் கூறும் வரிசையிலேயே நேரடியாக வழங்குதல்
  alternative: முன்னிருந்த விசுவாசம் அல்லது உண்மைத்தன்மையை வெளிப்படையான நிபந்தனையாகச் சேர்த்துரைத்தல்
  rationale: இந்த வசனத்தின் எபிரெய உரை இறைவனை அழைப்பவனுக்கான பதிலை நேரடியாகக் கூறுகிறது; விளக்கமான கோட்பாட்டு நிபந்தனைகளைச் சேர்ப்பதில்லை. ஆகவே உரையிலுள்ள வாக்குறுதியும் அதன் இறையியல் பதற்றமும் அப்படியே விடப்பட்டுள்ளன.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. இறைவனின் நேரடிப் பேச்சுக்கேற்ற உறுதியான எதிர்கால வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. ஆலோசனை ஆங்கில உரையில் அடிக்குறிப்பு குறிகள் பொருந்தாத இடங்களில் இருந்ததால், மூலச்சொற்களின் உண்மையான மாற்றுப் பொருள்களுக்கு ஏற்ப [a] ‘காப்பாற்றுவேன்’ என்பதற்குப் பின்னும் [b] ‘கௌரவிப்பேன்’ என்பதற்குப் பின்னும் வைக்கப்பட்டுள்ளன.
