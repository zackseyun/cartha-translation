  source_fidelity: 'மூல எபிரெயத்தின் வினைவரிசையும் பொருளும் துல்லியமாகக் காக்கப்பட்டுள்ளன: அவன் அழைப்பான், நான் பதிலளிப்பேன், துன்பத்தில் உடனிருப்பேன், மீட்பேன், கௌரவிப்பேன். עִמּוֹ אָנֹכִי என்பதன் உடனிருப்பு வலியுறுத்தலும், בְּצָרָה என்பதன் துன்ப/நெருக்கடி சூழலும் இயல்பாக வெளிப்படுகின்றன.'
