source:
  edition: WLC
  text: אֹמַ֗ר לַֽ֭/יהוָה מַחְסִ֣/י וּ/מְצוּדָתִ֑/י אֱ֝לֹהַ֗/י אֶבְטַח בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/002.yaml
  text: I say to Yahweh[a], “My refuge and my fortress, my God, in whom I trust.”
translation:
  language: ta
  text: 'நான் யாவேயிடம் சொல்கிறேன்: “என் புகலிடமே, என் கோட்டையே, நான் நம்பிக்கை வைக்கும் என் கடவுளே!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹמַר
  choice: நான் சொல்கிறேன்
  rationale: Qal imperfect first-person singular here can express an ongoing or characteristic declaration. The Tamil present form naturally conveys the psalmist’s confession without imposing unnecessary futurity.
- source_word: לַיהוָה
  choice: யாவேவிடம்
  rationale: The preposition ל most naturally marks the addressee of the declaration. Tamil -இடம் clearly expresses saying something to Yahweh.
- source_word: יהוה
  choice: யாவே
  rationale: This transliterates the divine covenant name YHWH rather than replacing it with a title, while the footnote preserves the traditional alternative.
- source_word: מַחְסִי
  choice: என் புகலிடமே
  rationale: புகலிடம் is a natural modern Tamil equivalent for a place of refuge and preserves the protective image.
- source_word: וּמְצוּדָתִי
  choice: என் கோட்டையே
  rationale: கோட்டை preserves the concrete defensive and military imagery of מְצוּדָה and pairs naturally with புகலிடம்.
- source_word: אֱלֹהַי
  choice: என் கடவுளே
  rationale: The first-person singular suffix is retained explicitly, while the vocative form fits the direct-address reading established by לַיהוָה.
- source_word: אֶבְטַח
  choice: நான் நம்புகிற
  rationale: The imperfect can denote settled, ongoing trust in this confessional context. The Tamil relative construction links the clause naturally to ‘my God.’
- source_word: בּוֹ
  choice: நான் நம்புகிற
  rationale: The Hebrew literally indicates trust ‘in him.’ Tamil idiom normally expresses this with the object of நம்பு rather than a separate locative marker; the referent remains ‘my God.’
theological_decisions:
- issue: Rendering the divine name יהוה
  choice: யாவே
  alternative: கர்த்தர்
  rationale: The Hebrew text directly uses the Tetragrammaton. Transliteration preserves the personal covenant name, while the traditional title is documented in the footnote.
- issue: Syntactic relation of ‘my refuge … my God’
  choice: Direct address to Yahweh
  alternative: 'Predication: ‘He is my refuge …’'
  rationale: 'Taking לַיהוָה as marking the addressee yields a coherent direct confession: ‘I say to Yahweh.’ The following first-person-suffix nouns are therefore rendered as vocatives, without adding an unstated copula.'
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. நேரடி அழைப்பைத் தெளிவாகவும் இயல்பாகவும் காட்ட ‘புகலிடமே … கோட்டையே … கடவுளே’ என்ற விளிவடிவங்கள் பயன்படுத்தப்பட்டுள்ளன; கவிதையின் பாதுகாப்புப் படிமமும் நம்பிக்கை அறிக்கையும் காக்கப்பட்டுள்ளன.
