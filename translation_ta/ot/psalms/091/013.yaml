source:
  edition: WLC
  text: עַל שַׁ֣חַל וָ/פֶ֣תֶן תִּדְרֹ֑ךְ תִּרְמֹ֖ס כְּפִ֣יר וְ/תַנִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/013.yaml
  text: You will tread on the lion and the cobra[b][a]; you will trample the young lion and the serpent.
translation:
  language: ta
  text: 'சிங்கத்தின்மேலும் நாகப்பாம்பின்மேலும்[a] நீ மிதிப்பாய்;

    இளஞ்சிங்கத்தையும் பெரும்பாம்பையும்[b] நீ மிதித்து அடக்குவாய்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: மரபாக, “ஆஸ்ப்” என்றும் மொழிபெயர்க்கப்படுகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “டிராகன்”; வேறு சூழல்களில் இந்த எபிரெயச் சொல் பெரிய ஊர்வனையையோ கடல்வாழ் உயிரினத்தையோ குறிக்கலாம். இங்கே நிலவாழ் ஆபத்தான உயிரினங்களின் பட்டியலில் “பெரும்பாம்பு” பொருத்தமாக உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: עַל
  choice: மேலும்
  rationale: மிதிக்கப்படும் உயிரினங்களைச் சுட்டும் இடப்பொருள் முன்னிடைச்சொல்; ‘-ன்மேல்’ என்பது தமிழில் இயல்பான இணைப்பு.
- source_word: שַׁחַל
  choice: சிங்கம்
  rationale: சிங்கத்தைக் குறிக்கும் கவிதைச் சொல்; சூழலில் அதன் கொடுமையைத் தனியே சேர்க்காமல் எளிய, துல்லியமான பெயர் பயன்படுத்தப்பட்டது.
- source_word: פֶתֶן
  choice: நாகப்பாம்பு
  rationale: நஞ்சுள்ள பாம்பைக் குறிக்கிறது; மரபான ‘விரியன்’ போன்ற தெளிவற்ற இன அடையாளத்தைவிட, நவீன வாசகருக்கு மரண ஆபத்துள்ள பாம்பின் உருவகத்தைத் தெளிவாகத் தருகிறது.
- source_word: תִּדְרֹךְ
  choice: நீ நடப்பாய்
  rationale: דרך என்பதன் இங்கு உள்ள பொருள் ‘மேல் நட/மிதி’; முதல் அடியில் இயல்பான தமிழையும் அடுத்த வினையின் வலிமை அதிகரிப்பையும் காக்க ‘நடப்பாய்’ எனப்பட்டது.
- source_word: תִּרְמֹס
  choice: நீ மிதித்துப்போடுவாய்
  rationale: רמס என்பது முந்தைய வினையைவிட வலிமையாக மிதித்து அடக்குவதைச் சொல்கிறது; ‘மிதித்துப்போடுவாய்’ அந்த தீவிரத்தை இயல்பான தமிழில் காக்கிறது.
- source_word: כְּפִיר
  choice: இளஞ்சிங்கம்
  rationale: சிறு குட்டியைவிட இளமையும் வலிமையும் கொண்ட சிங்கத்தைக் குறிக்கிறது.
- source_word: תַנִּין
  choice: பெரும்பாம்பு
  rationale: இச்சூழலில் நிலத்தில் வாழும் ஆபத்தான உயிரினங்களின் பட்டியலோடு இணைவதால் பெரிய பாம்பு என்ற வாசிப்பு பொருத்தமானது; ‘வலுசர்ப்பம்/கடல்விலங்கு’ போன்ற பிற சாத்தியங்கள் அடிக்குறிப்பில் காக்கப்படுகின்றன.
theological_decisions:
- issue: תַנִּין என்பதை புராணத் தோற்றமுள்ள உயிரினமாகவா அல்லது பெரிய பாம்பாகவா மொழிபெயர்ப்பது
  choice: பெரும்பாம்பு
  alternative: வலுசர்ப்பம் அல்லது கடல்விலங்கு
  rationale: சிங்கம், நஞ்சுப்பாம்பு, இளஞ்சிங்கம் ஆகிய நிலவாழ் ஆபத்தான உயிரினங்களின் இணைப்பில் ‘பெரும்பாம்பு’ உடனடிச் சூழலுக்கு நன்கு பொருந்துகிறது. ஆயினும் எபிரெயச் சொல்லின் விரிந்த பொருள் மறைக்கப்படாமல் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்குப் புரியும் வகையிலும் சங்கீதத்தின் கண்ணியமான கவிதை நடையைத் தக்கவைத்தும் மொழிபெயர்க்கப்பட்டது. இரு இணை அடிகளிலும் ‘நடப்பாய்’ என்பதிலிருந்து ‘மிதித்துப்போடுவாய்’ என வினை வலுப்படுவது பாதுகாக்கப்பட்டுள்ளது; ஒருமை இரண்டாம் நபர் ஆண்பால் வடிவம் தமிழில் பால்வேறுபாடற்ற ‘நீ’ என இயல்பாக வழங்கப்பட்டது.
