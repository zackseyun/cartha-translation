  language: ta
  text: இருளில் நடமாடும் கொள்ளைநோய்க்கும்[a], நண்பகலில் பாழாக்கும் பேரழிவுக்கும் அஞ்சமாட்டாய்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கொள்ளைநோய்’ என்பதற்கு ‘கொடிய தொற்றுநோய்’ என்றும், ‘பேரழிவு’ என்பதற்கு ‘கொடிய வாதை’ என்றும் மொழிபெயர்க்கலாம்; எபிரெய மூலத்தில் அழிவை உண்டாக்கும் அச்சுறுத்தல்களைக் குறிக்கும் இணையான கவித்துவச் சொற்கள் பயன்படுத்தப்பட்டுள்ளன.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּבֶר
  choice: கொள்ளைநோய்
  rationale: இந்த எபிரெயச் சொல் பரவலாக உயிர்களைப் பறிக்கும் கொள்ளைநோய் அல்லது தொற்றுநோயைக் குறிக்கிறது; ‘கொள்ளைநோய்’ கவித்துவ வலிமையையும் தெளிவையும் காக்கிறது.
- source_word: בָּאֹפֶל
  choice: இருளில்
  rationale: ஆழ்ந்த இருள் அல்லது காரிருள் என்ற படிமத்தை இயல்பான தமிழில் நேரடியாகக் காக்கிறது.
- source_word: יַהֲלֹךְ
  choice: நடமாடும்
  rationale: ‘நடத்தல்/செல்லுதல்’ என்ற அடிப்படைப் பொருளையும் கொள்ளைநோயை ஆளுருவாக்கும் கவித்துவத்தையும் காக்கிறது.
- source_word: קֶּטֶב
  choice: பேரழிவு
  rationale: அழிவு, கொடிய வாதை என்ற பொருள் வரம்பை நோயாக மட்டும் சுருக்காமல் வெளிப்படுத்துகிறது.
- source_word: יָשׁוּד
  choice: பாழாக்கும்
  rationale: வன்மையாக அழித்து நாசப்படுத்தும் செயலை இயல்பான, செறிவான தமிழில் தெரிவிக்கிறது.
- source_word: צָהֳרָיִם
  choice: நண்பகலில்
  rationale: ‘நண்பகல்’ என்ற நேரத்தைக் குறிப்பதோடு, முந்தைய அடியில் உள்ள ‘இருளில்’ என்பதற்கான கவித்துவ எதிர்மறையையும் காக்கிறது.
- source_word: מִן
  choice: -க்கும் … -க்கும்
  rationale: சொல்லளவில் ‘இருந்து’ என்று பொருள்பட்டாலும், சங்கீதம் 91:5–6 இன் தொடரமைப்பில் அஞ்சாத ஆபத்துகளின் பட்டியலைத் தமிழில் இயல்பாக இணைக்கிறது.
