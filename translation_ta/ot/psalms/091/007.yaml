  yaml_path: translation/ot/psalms/091/007.yaml
  text: A thousand may fall at your side[a], and ten thousand at your right hand[b], but it will not come near you.
translation:
  language: ta
  text: உன் பக்கத்தில் ஆயிரம் விழக்கூடும்; உன் வலப்புறத்தில் பதினாயிரம் விழக்கூடும்[a]; ஆனாலும் அது உன்னை நெருங்காது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் பக்கத்தில் ஆயிரம் விழுவார்கள்; உன் வலப்புறத்தில் பதினாயிரம் விழுவார்கள்.” இங்குள்ள எபிரெய வினைவடிவங்களை எதிர்காலமாகவோ சாத்தியத்தைக் குறிப்பதாகவோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொற்படியாக, “அது உன்னை அணுகாது.” எபிரெயில் எழுவாய் கூறப்படவில்லை; சங்கீதத்தின் சூழல் அச்சுறுத்தும் பேரிடரைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפֹּל
  choice: விழக்கூடும்
  rationale: נפל என்பதன் Qal imperfect வடிவம் இக்கவிதைச் சூழலில் எதிர்காலத்தையோ சாத்தியத்தையோ குறிக்கலாம். ‘விழக்கூடும்’ என்பது அந்த modal நுட்பத்தைப் பாதுகாக்கிறது.
- source_word: מִצִּדְּךָ
  choice: உன் பக்கத்தில்
  rationale: מִן முன்னிடைச்சொல் சொற்படியாக ‘இருந்து’ எனினும், விழுதல் என்ற வினையுடன் இங்கு ஒருவரைச் சார்ந்த இடத்தைக் குறிக்கிறது. ‘உன் பக்கத்தில்’ இயல்பான தமிழாகவும் இடவியல் படிமத்தைத் தக்கவைத்தும் உள்ளது.
- source_word: אֶלֶף
  choice: ஆயிரம் பேர்
  rationale: எண்ணிக்கை நேரடியாகப் பாதுகாக்கப்படுகிறது; ‘பேர்’ என்பது விழுகிறவர்கள் மனிதர்கள் என்பதைக் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: וּרְבָבָה
  choice: பதினாயிரம் பேர்
  rationale: רְבָבָה பொதுவாகப் பதினாயிரத்தைக் குறிக்கிறது; ஆயிரத்திலிருந்து பதினாயிரமாக உயரும் கவிதை இணைநிலையும் தீவிரமும் பாதுகாக்கப்படுகின்றன.
- source_word: מִימִינֶךָ
  choice: உன் வலப்புறத்தில்
  rationale: சூழலில் இது வலது பக்கத்திலுள்ள இடத்தைக் குறிக்கிறது. ‘வலப்புறத்தில்’ என்பது நவீன தமிழில் இயல்பாக இருந்து எபிரெய இடவியல் படிமத்தைத் தக்கவைக்கிறது.
- source_word: אֵלֶיךָ
  choice: உன்னை
  rationale: נגשׁ உடன் אֶל என்பது ஒருவரை நோக்கி நெருங்குவதைக் குறிக்கிறது; தமிழில் ‘உன்னை நெருங்காது’ என்பது இயல்பான இணைவு.
- source_word: לֹא יִגָּשׁ
  choice: அது உன்னை நெருங்காது
  rationale: எபிரெயில் வினையின் எழுவாய் வெளிப்படையாகக் கூறப்படவில்லை. தமிழில் இயல்புக்காக ‘அது’ சேர்க்கப்பட்டாலும், குறிப்பிட்ட பேரிடர் அல்லது கொள்ளைநோய் என்று வரையறுக்காமல் சூழலிலுள்ள ஆபத்தையே பொதுவாகச் சுட்டுகிறது.
theological_decisions:
- issue: இறுதி வாக்கியத்தின் வெளிப்படாத எழுவாய்
  choice: ‘அது’ என்று பொதுநிலைச் சுட்டுப்பெயரால் மொழிபெயர்த்தல்
  alternative: ‘பேரிடர்’ அல்லது ‘கொள்ளைநோய்’ என்று குறிப்பாக்குதல்; அல்லது எழுவாயை முற்றிலும் விடுதல்
  rationale: எபிரெயக் கவிதையில் எழுவாய் கூறப்படாமல் இருக்க முடியும். தமிழில் வாக்கியம் இயல்பாக இருக்க ‘அது’ பயன்படுத்தப்படுகிறது. இதனால் சுற்றியுள்ள ஆபத்து சுட்டப்பட்டாலும், வசனம் கூறாத அளவுக்கு அதன் பொருள் குறுக்கப்படவில்லை.
- issue: יִפֹּל என்பதன் எதிர்கால அல்லது சாத்திய நுட்பம்
  choice: ‘விழக்கூடும்’ என்று modal வாய்ப்பாக மொழிபெயர்த்தல்
  alternative: ‘விழுவார்கள்’ என்று உறுதியான எதிர்காலமாக மொழிபெயர்த்தல்
  rationale: எபிரெய imperfect இக்கவிதைச் சூழலில் இரு நுட்பங்களையும் ஏற்கக்கூடியது. முதன்மை உரையில் சாத்திய நுட்பம் வைக்கப்பட்டு, உறுதியான எதிர்கால வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பக்கம் / வலப்புறம்’ என்ற இணை அமைப்பும் ஆயிரம் / பதினாயிரம் என்ற உயர்வும் பாதுகாக்கப்பட்டுள்ளன. அடிக்குறி [a] இரு இணை வாக்கியங்களுக்கும் பொருந்துமாறு அவற்றுக்குப் பின் வைக்கப்பட்டுள்ளது; [b] இறுதி மறைஎழுவாய் மற்றும் ‘நெருங்குதல்’ பற்றிய விளக்கத்தைக் குறிக்கிறது.
