    issue: The classifier ‘பேர்’ is added after both numbers.
    rationale: It makes explicit that those falling are people, whereas the Hebrew text simply has ‘a thousand’ and ‘ten thousand.’ Omitting it better preserves the source’s concise poetic ambiguity while remaining fully intelligible in Tamil.
