source:
  edition: WLC
  text: כִּ֤י ה֣וּא יַ֭צִּֽילְ/ךָ מִ/פַּ֥ח יָק֗וּשׁ מִ/דֶּ֥בֶר הַוּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/003.yaml
  text: For he will deliver you from the snare of the fowler[b][a], from the deadly pestilence.
translation:
  language: ta
  text: ஏனெனில், அவரே உன்னைப் பறவை பிடிப்பவனின் கண்ணியிலிருந்தும்[a], அழிவை உண்டாக்கும் கொள்ளைநோயிலிருந்தும்[b] விடுவிப்பார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பறவை பிடிப்பவனின் பொறியிலிருந்தும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அழிவின் கொள்ளைநோயிலிருந்தும்” அல்லது “அழிவை உண்டாக்கும் பெருந்தொற்றிலிருந்தும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய உறுதிமொழிக்கான காரணத்தை அல்லது விளக்கத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இங்கு வருகிறது.
- source_word: הוּא
  choice: அவரே
  rationale: தனித்த சுட்டுப்பெயர் தரும் வலியுறுத்தலை இயல்பான தமிழில் ‘அவரே’ வெளிப்படுத்துகிறது; சங்கீதச் சூழலில் கடவுளைக் குறிக்கும் மரியாதை ஒருமை பயன்படுத்தப்பட்டுள்ளது.
- source_word: יַצִּילְךָ
  choice: உன்னை ... விடுவிப்பார்
  rationale: נצל என்பதன் ஹிஃபில் வடிவம் ஆபத்திலிருந்து விடுவித்தல் அல்லது மீட்டல் என்று பொருள்படும்; இங்கு ‘விடுவிப்பார்’ இயல்பாகவும் பொருத்தமான வலிமையுடனும் உள்ளது.
- source_word: מִפַּח
  choice: கண்ணியிலிருந்து
  rationale: פַּח என்பது பிடிப்பதற்காக வைக்கப்படும் கண்ணி அல்லது பொறி; பறவை பிடிப்பவனின் சூழலில் ‘கண்ணி’ தெளிவானதும் இயல்பானதும் ஆகும்.
- source_word: יָקוּשׁ
  choice: பறவை பிடிப்பவனின்
  rationale: இந்தச் சொல் கண்ணி வைப்பவனை, குறிப்பாகப் பறவைகளைப் பிடிப்பவனை, குறிக்கிறது; தமிழில் பொருளைத் தெளிவாக வெளிப்படுத்த விரித்துக் கூறப்பட்டுள்ளது.
- source_word: מִדֶּבֶר
  choice: கொள்ளைநோயிலிருந்து
  rationale: דֶּבֶר பரவலாக மரணத்தை விளைவிக்கும் கொள்ளைநோய் அல்லது பெருந்தொற்றைக் குறிக்கும்; ‘கொள்ளைநோய்’ அதன் கடுமையையும் உயர்ந்த கவிதை நடையையும் காக்கிறது.
- source_word: הַוּוֹת
  choice: அழிவை உண்டாக்கும்
  rationale: இந்தப் பன்மைச் சொல் அழிவுகள், கேடுகள் அல்லது பேரழிவைக் குறிக்கலாம். דֶּבֶר என்பதைக் குறிப்பதாய் எடுத்துக்கொண்டு இயல்பான தமிழில் விளைவைக் காட்டும் அடைமொழித் தொடராக மொழிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: குறிப்பிடப்படும் ஆபத்துகளின் இயல்பு
  choice: கண்ணியும் கொள்ளைநோயும் உண்மையான ஆபத்துகளைக் குறிக்கும் உருவகங்களாக அப்படியே வைக்கப்பட்டுள்ளன; அவற்றின் பயன்பாட்டை உடல்சார்ந்ததாக மட்டுமோ ஆன்மிகமானதாக மட்டுமோ கட்டுப்படுத்தவில்லை.
  alternative: இவை உடல்சார்ந்த ஆபத்துகள் மட்டுமே; அல்லது முற்றிலும் ஆன்மிக ஆபத்துகளுக்கான உருவகங்கள் மட்டுமே.
  rationale: எபிரெய உரை தெளிவான, கண்கூடான ஆபத்துகளைப் பெயரிட்டாலும், சங்கீதக் கவிதையில் அவை கடவுளின் பாதுகாப்புக்குட்படும் ஆபத்துகளை விரிவாகப் பிரதிநிதித்துவப்படுத்தலாம். மொழிபெயர்ப்பு அந்த விளக்கத் திறப்பைத் தீர்மானித்து மூடவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்திற்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. ‘அவரே’ மூலத்தின் வலியுறுத்தலைக் காக்கிறது; ‘பறவை பிடிப்பவன்’ அரிதான தொழிற்பெயரைத் தவிர்த்து நேரடியாகப் பொருளைத் தருகிறது.
