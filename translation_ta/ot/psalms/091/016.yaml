  text: I will satisfy him with length of days[a], and I will show him my salvation.
translation:
  language: ta
  text: 'நீண்ட ஆயுளால் அவனைத் திருப்திப்படுத்துவேன்;


    என் மீட்பை[a] அவனுக்குக் காண்பிப்பேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் இரட்சிப்பை” அல்லது “என் விடுதலையை.” எபிரெயச் சொல் ஆபத்திலிருந்து மீட்பதையும் விரிவான பொருளில் இரட்சிப்பையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: நீண்ட ஆயுள்
  rationale: எபிரெயச் சொற்றொடரின் நேரடிப் பொருள் ‘நாட்களின் நீளம்.’ நவீனத் தமிழில் ‘நீண்ட ஆயுள்’ இயல்பாகவும் அதே பொருளைத் தெளிவாகவும் தருகிறது.
- source_word: אַשְׂבִּיעֵהוּ
  choice: அவனைத் திருப்தியாக்குவேன்
  rationale: שׂבע என்பதன் ஹிஃபில் வடிவம் ஒருவரை நிறைவடையச் செய்தல் அல்லது திருப்திப்படுத்துதல் என்று பொருள்படும். வினையின் நேரடி பொருள் நபராக இருப்பதையும் இந்த மொழிபெயர்ப்பு காக்கிறது.
- source_word: וְאַרְאֵהוּ
  choice: அவனுக்குக் காண்பிப்பேன்
  rationale: ראה என்பதன் ஹிஃபில் வடிவம் ‘காணச் செய்தல், காண்பித்தல்’ எனப் பொருள்படும்; இறைச் செயற்பாட்டை இச்சொல் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: בִּישׁוּעָתִי
  choice: என் மீட்பை
  rationale: יְשׁוּעָה ஆபத்திலிருந்து விடுவித்தலையும் விரிவான இரட்சிப்பையும் குறிக்கலாம். தமிழில் ‘மீட்பு’ இரு பரிமாணங்களையும் இயல்பாகத் தாங்கி, இச்சங்கீதத்தின் பாதுகாப்புச் சூழலையும் காக்கிறது.
theological_decisions:
- issue: பாதுகாப்பை வாக்களிக்கும் இச்சங்கீதத்தில் יְשׁוּעָה என்பதன் பொருள் வரம்பு
  choice: மீட்பு
  alternative: இரட்சிப்பு; விடுதலை
  rationale: இச்சொல் உடனடியான ஆபத்திலிருந்து விடுவிப்பதைக் குறிக்கக்கூடும்; அதேவேளை விரிவான இறையியல் பொருளையும் கொண்டிருக்கிறது. ‘மீட்பு’ என்பதைத் தேர்ந்தெடுத்து, இரண்டில் ஒன்றாகப் பொருளைச் சுருக்காமல் அந்தப் பொருள் விரிவைத் தக்கவைத்துள்ளோம்.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் வடிவமைக்கப்பட்டது. ‘நீண்ட ஆயுளால்’ என்பது எபிரெய உருவகத்தை இயல்பான தமிழில் வழங்குகிறது; இரு இணை வாக்கியங்களும் முதல் நபர் இறை வாக்குறுதியையும் ஆண்பால் ஒருமைச் சுட்டையும் காக்கின்றன.
