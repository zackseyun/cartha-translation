source:
  edition: WLC
  text: כִּ֣י מַ֭לְאָכָי/ו יְצַוֶּה לָּ֑/ךְ לִ֝/שְׁמָרְ/ךָ֗ בְּ/כָל דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/011.yaml
  text: For he will command his angels concerning you[b][a], to guard you in all your ways.
translation:
  language: ta
  text: ஏனெனில், உன்னைக் குறித்து[a] தமது தூதர்களுக்குக் கட்டளையிட்டு, உன் வழிகளிலெல்லாம் உன்னைக் காக்கச் செய்வார்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உனக்காக’ என்றும் மொழிபெயர்க்கலாம். எபிரேயச் சொற்றொடர் ஒருவரைக் குறித்த கட்டளையையும் அவரது நன்மைக்கான கட்டளையையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: ‘உன்னைப் பாதுகாக்க’ அல்லது ‘உன்னைக் கண்காணித்துப் பேண’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய உறுதிமொழிக்கான காரணத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பாகவும் விளக்கத் தொடர்பைத் தெளிவாகவும் காட்டுகிறது.
- source_word: מַלְאָכָיו
  choice: தமது தூதர்கள்
  rationale: சங்கீதத்தின் சூழலில் இவர்கள் இறைவனுடைய வானதூதர்கள். மரியாதை ஒருமைச் சுட்டைத் தெளிவாக வைத்திருக்க ‘தமது’ பயன்படுத்தப்பட்டது.
- source_word: יְצַוֶּה
  choice: கட்டளையிட்டு … செய்வார்
  rationale: பியேல் வினையின் கட்டளையிடும் வலிமையைப் பாதுகாக்கிறது; எபிரேய வாக்கிய உறவைத் தமிழில் இயல்பான வினையெச்ச அமைப்பால் தருகிறது.
- source_word: לָּךְ
  choice: உன்னைக் குறித்து
  rationale: கட்டளை யாரைப் பற்றியது என்பதைக் காட்டும் பொருளை நேரடியாக வழங்குகிறது; ‘உனக்காக’ என்ற நன்மைப் பொருளும் இலக்கண ரீதியாகச் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לִשְׁמָרְךָ
  choice: உன்னைக் காக்க
  rationale: שׁמר என்பதன் பாதுகாத்தல், காவல் செய்தல் என்ற பொருளை இச்சூழலில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: בְּכָל דְּרָכֶיךָ
  choice: உன் வழிகளிலெல்லாம்
  rationale: ‘வழிகள்’ என்ற எபிரேய உருவகத்தைப் பாதுகாத்து, ஒருவரின் பயணங்களையும் வாழ்க்கை நடத்தையையும் உள்ளடக்கக்கூடிய விரிந்த பொருளை வழங்குகிறது.
theological_decisions:
- issue: மூன்றாம் நபர் ஆண்பால் ஒருமை வினையின் மறைமுக எழுவாய்
  choice: இறைவனே தமது தூதர்களுக்குக் கட்டளையிடுகிறவர்
  alternative: முந்தைய சூழலிலிருந்து குறிப்பிடப்படாத வேறொரு ஆண்பால் ஒருமை எழுவாய்
  rationale: சங்கீதத்தின் தொடர்ச்சியில் பாதுகாப்பை அளிப்பவர் ஆண்டவர்; ஒருமை வினையும் ‘தமது தூதர்கள்’ என்பதும் இயல்பாக அவரையே சுட்டுகின்றன. தமிழில் மரியாதை வினைமுற்றான ‘செய்வார்’ பயன்படுத்தப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பான, கண்ணியமான கவிதைநடை. ஒருமை முன்னிலையான ‘உன்/உன்னை’ மூலத்தின் நேரடி அழைப்பைப் பேணுகிறது. ‘தூதர்கள்’ என்பது சூழலுக்கு ஏற்ற வானதூதர்களைக் குறிக்கிறது. எல்லா அடிக்குறிப்பு அடையாளங்களும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
