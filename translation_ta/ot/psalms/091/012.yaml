    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כַּפַּיִם
  choice: தங்கள் உள்ளங்கைகளில்
  rationale: עַל என்பது ‘மேல்/இல்’ என்ற உறவையும், כַּפַּיִם என்பது இருமை வடிவில் ‘உள்ளங்கைகள்’ என்பதையும் குறிக்கிறது. தமிழில் இந்தக் காட்சியை இயல்பாகவும் தெளிவாகவும் காக்கிறது.
- source_word: יִשָּׂאוּנְךָ
  choice: உன்னைத் தாங்குவார்கள்
  rationale: נשׂא என்பதன் ‘தூக்குதல், சுமத்தல், தாங்குதல்’ என்ற பொருள் வரம்பில், பாதுகாப்பாகக் கைகளில் ஏந்திச் செல்வதை ‘தாங்குவார்கள்’ இயல்பாக வெளிப்படுத்துகிறது; ‘தூக்குவார்கள்’ என்பதும் சாத்தியம்.
- source_word: פֶּן
  choice: மோதாதபடி
  rationale: פֶּן அறிமுகப்படுத்தும் எதிர்மறை நோக்கம் அல்லது தவிர்க்கப்படும் விளைவைத் தமிழில் ‘-ஆதபடி’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: תִּגֹּף
  choice: மோது
  rationale: נגף இங்கு கால் கல்லுடன் தாக்கிக்கொள்வதைக் குறிக்கிறது. ‘மோது’ நேரடியான தொடர்பைக் காக்கிறது; முழுமையாக இடறி விழுதல் என்ற கூடுதல் பொருளைச் சேர்ப்பதில்லை.
- source_word: בָּאֶבֶן
  choice: ஒரு கல்லில்
  rationale: ב முன்னிடைச்சொல் இச்சூழலில் மோதும் பொருளைக் குறிக்கிறது; אֶבֶן குறிப்பிட்ட கல் என்று அவசியப்படுத்தாததால் ‘ஒரு கல்’ பொருத்தமானது.
- source_word: רַגְלֶךָ
  choice: உன் கால்
  rationale: எபிரேயத்தில் பெயர்ச்சொல் ஒருமையிலும் இரண்டாம் ஆண்பால் ஒருமை பின்னொட்டுடனும் உள்ளது; தமிழ் சொற்றொடரிலும் ஒருமை இயல்பானது.
theological_decisions:
- issue: பாரம்பரிய நடைக்கும் மூலமொழிக் காட்சிக்கும் இடையிலான சமநிலை
  choice: அவர்கள் தங்கள் உள்ளங்கைகளில் உன்னைத் தாங்குவார்கள்
  alternative: அவர்கள் தங்கள் கைகளில் உன்னை ஏந்துவார்கள்
  rationale: ‘உள்ளங்கைகள்’ என்பது כַּפַּיִם என்ற மூலச்சொல்லின் குறிப்பான காட்சியைக் காக்கிறது; ‘தாங்குவார்கள்’ பாதுகாப்பின் கருத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது. புதிய ஏற்பாட்டு மேற்கோள் மரபின் சொற்றொடரை கட்டாயமாக இறக்குமதி செய்யவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியக்கூடிய, கண்ணியமான கவிதைநடை. மூலத்தின் உள்ளங்கைப் படிமமும் எதிர்மறை நோக்க வாக்கியமும் காக்கப்பட்டுள்ளன.
