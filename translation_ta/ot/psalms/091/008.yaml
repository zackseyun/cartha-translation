  text: You will only look with your eyes and see the repayment of the wicked[a].
translation:
  language: ta
  text: நீ மட்டுமே உன் கண்களால் நோக்கி, பொல்லாதவர்கள் பெறும் கைம்மாறைக் காண்பாய்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பொல்லாதவர்கள் பெறும் பிரதிபலன்” அல்லது “பொல்லாதவர்களின் தண்டனை.”
    reason: שִׁלֻּמַת என்பது செயலுக்குரிய கைம்மாறு அல்லது பிரதிபலன் என்பதைக் குறிக்கிறது; இச்சூழலில் தண்டனை என்ற பொருளும் சாத்தியம், ஆனால் மூலச்சொல் அதையே மட்டும் கட்டாயப்படுத்தவில்லை.
lexical_decisions:
- source_word: רַק
  choice: மட்டுமே
  rationale: 'இது வரம்பை வலியுறுத்துகிறது: உரையாடப்படுபவர் அந்தத் தீங்கை அனுபவிக்காமல், அதைப் பார்ப்பவராக மட்டுமே இருப்பார்.'
- source_word: בְּעֵינֶיךָ
  choice: உன் கண்களால்
  rationale: எபிரெய உருவகத்தை இயல்பான தமிழில் நேரடியாகப் பாதுகாக்கிறது.
- source_word: תַבִּיט
  choice: நீ நோக்கி
  rationale: נבט என்பதன் ஹிஃபீல் வடிவம் ‘நோக்கு’ என்ற பொருளைக் கொண்டது; அடுத்து வரும் ‘காண்பாய்’ என்பதிலிருந்து சொல் வேறுபாட்டையும் இது பாதுகாக்கிறது.
- source_word: וְשִׁלֻּמַת
  choice: கைம்மாறை
  rationale: செலுத்தப்படும் பதில் அல்லது ஒருவரது செயலுக்குக் கிடைக்கும் பிரதிபலன் என்ற பரந்த பொருளைத் தக்கவைக்கிறது; ‘தண்டனை’ என்று மிகக் குறிப்பாக வரையறுக்கவில்லை.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்களின்
  rationale: சங்கீதங்களில் வரும் இந்த ஒழுக்க வகைப்பாட்டை நவீன, தெளிவான தமிழில் தெரிவிக்கிறது.
- source_word: תִּרְאֶה
  choice: காண்பாய்
  rationale: ראה என்பதன் எளிய பொருளான ‘காணுதல்’ என்பதைக் கண்ணியமான, இயல்பான தமிழில் வழங்குகிறது.
theological_decisions:
- issue: பொல்லாதவர்களுக்கு நேரிடுவதன் தன்மை
  choice: பொல்லாதவர்களின் கைம்மாறு
  alternative: பொல்லாதவர்களின் தண்டனை; பொல்லாதவர்களுக்குக் கிடைக்கும் பிரதிபலன்
  rationale: שִׁלֻּמָה என்பது செயலுக்குரிய பதில் அல்லது கூலி என்ற நீதிசார் கருத்தைக் கொண்டிருந்தாலும், தண்டனையின் குறிப்பிட்ட வடிவத்தைச் சொல்லவில்லை. ‘கைம்மாறு’ அந்தப் பரப்பையும் மூலத்தின் சுருக்கமான உடைமைத் தொடரையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘நோக்கி/காண்பாய்’ என்ற இணைப்பு மூலத்திலுள்ள இரு பார்வை வினைச்சொற்களையும் பாதுகாக்கிறது; [a] குறிப்பு மூலவாக்கியத்தின் பொருள் பரப்பை வெளிப்படுத்துகிறது.
