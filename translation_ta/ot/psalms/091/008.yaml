review_pass:
  verdict: revise
  source_fidelity: The draft retains the two coordinated sight verbs and correctly understands רַק as limiting the addressee to witnessing rather than undergoing the judgment. However, the placement of மட்டுமே immediately after கண்களால் can be read as limiting the instrument ('with eyes only') rather than the person's role ('you will only look').
  naturalness: கண்களால் மட்டுமே நீ நோக்கி is somewhat strained in modern Tamil and creates an avoidable scope ambiguity. Moving மட்டுமே to modify the subject/action makes the line more idiomatic while retaining the concise poetic register.
  terminology: பொல்லாதவர்கள் is a suitable modern rendering of רְשָׁעִים. கைம்மாறு can convey due repayment, but the genitive phrase பொல்லாதவர்களின் கைம்மாறு may be momentarily read as repayment performed by the wicked. பொல்லாதவர்கள் பெறும் கைம்மாறு clearly expresses the source sense without narrowing it to punishment.
  issues:
  - severity: medium
    issue: Scope of மட்டுமே is unclear in the Tamil word order.
    rationale: 'In உன் கண்களால் மட்டுமே நீ நோக்கி, மட்டுமே most directly attaches to கண்களால். The Hebrew רַק limits the addressee''s experience/action: they only look and see. Repositioning it after நீ makes this clear.'
  - severity: low
    issue: The possessive phrase பொல்லாதவர்களின் கைம்மாறு is potentially agentive in Tamil.
    rationale: Although context favors recompense received by the wicked, பொல்லாதவர்கள் பெறும் கைம்மாறு is clearer and preserves the broad sense of שִׁלֻּמַת without specifying 'punishment.'
  revised_text: நீ மட்டுமே உன் கண்களால் நோக்கி, பொல்லாதவர்கள் பெறும் கைம்மாறைக் காண்பாய்[a].
