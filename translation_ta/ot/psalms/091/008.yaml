revisions:
- from: உன் கண்களால் மட்டுமே நீ நோக்கி, பொல்லாதவர்களின் கைம்மாறைக் காண்பாய்[a].
  to: நீ மட்டுமே உன் கண்களால் நோக்கி, பொல்லாதவர்கள் பெறும் கைம்மாறைக் காண்பாய்[a].
  rationale: திருத்தம் மட்டுமே என்பதன் வரம்பைத் தெளிவாக நீ-க்கு இணைக்கிறது; இதனால் வசனத்தின் கருத்தான ‘நீ அனுபவிப்பதில்லை, பார்த்துக் காண்பாய்’ என்பது இயல்பாகத் தெரிகிறது. பொல்லாதவர்கள் பெறும் கைம்மாறு என்பது எபிரெய உடைமைத் தொடரின் பொருளைத் தெளிவாகக் காட்டி, கைம்மாறு என்ற பரந்த சொற்பொருளைத் தக்கவைக்கிறது. இரண்டு பார்வை வினைகளான ‘நோக்கி/காண்பாய்’ பாதுகாக்கப்பட்டுள்ளன.
