  source_fidelity: மூல எபிரெயத்தின் இரண்டு கட்டளை வேண்டுதல்களும் துல்லியமாகக் காக்கப்பட்டுள்ளன. “எங்களைத் திரும்பக் கொண்டுவாரும்” என்பது שׁוּבֵנוּ என்ற ஹிஃபில் கட்டளையின் ‘எங்களைத் திரும்பச் செய்/திரும்பக் கொண்டுவா’ என்னும் பொருளை இயல்பாக வெளிப்படுத்துகிறது. “எங்களிடமிருந்து அகற்றும்” என்பது இச்சூழலில் עִמָּנוּ என்பதன் பொருத்தமான தமிழாக்கம்; மூலத்தில் இல்லாத “எங்களுக்கு எதிராக” என்ற வெளிப்படையான விளக்கத்தை அது சேர்ப்பதில்லை.
