source:
  edition: WLC
  text: שׁ֭וּבֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ וְ/הָפֵ֖ר כַּֽעַסְ/ךָ֣ עִמָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/004.yaml
  text: Restore us[a], God of our salvation, and put away your anger from us.
translation:
  language: ta
  text: 'எங்கள் இரட்சிப்பின் கடவுளே,

    எங்களைத் திரும்பக் கொண்டுவாரும்[a];

    உமது கோபத்தை எங்களிடமிருந்து அகற்றும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களை மீண்டும் நிலைநிறுத்தும்.” எபிரெய வினை இன்னும் சொற்சார்பாக “எங்களைத் திரும்பச் செய்யும்” எனப் பொருள்படும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבֵנוּ
  choice: எங்களைத் திரும்பக் கொண்டுவாரும்
  rationale: שׁוב என்பதன் ஹிஃபில் கட்டளை வடிவம் ‘எங்களைத் திரும்பச் செய்/திரும்பக் கொண்டுவா’ என்று பொருள்படும். இந்தத் தேர்வு தேவனுடைய முன்முயற்சியையும், மக்கள் முந்தைய நல்வாழ்வுக்குத் திரும்ப வேண்டும் என்ற வேண்டுதலையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: எங்கள் இரட்சிப்பின் கடவுளே
  rationale: எபிரெயக் கட்டமைப்பை நெருக்கமாகப் பின்பற்றி, இரட்சிப்பு கடவுளுக்குரியது மற்றும் அவரிடமிருந்து வருகிறது என்ற வலியுறுத்தலைக் காக்கிறது.
- source_word: וְהָפֵר
  choice: அகற்றும்
  rationale: פרר என்பதன் ஹிஃபில் கட்டளை வடிவம் முறியச் செய்தல், செல்லாததாக்குதல் அல்லது ஒழியச் செய்தல் எனப் பொருள்படலாம். ‘கோபம்’ என்பதோடு ‘அகற்றும்’ என்பது இயல்பான தமிழில் அதன் விளைவைத் தெளிவாகத் தருகிறது.
- source_word: כַּעַסְךָ
  choice: உமது கோபத்தை
  rationale: כעס இங்கு கடவுளுடைய கோபத்தைக் குறிக்கிறது. ‘கோபம்’ என்பது தெளிவான, இயல்பான, தேவையற்ற விளக்கத்தைச் சேர்க்காத தமிழ் இணைச்சொல்.
- source_word: עִמָּנוּ
  choice: எங்களிடமிருந்து
  rationale: עם பொதுவாக ‘உடன்’ என்று பொருள்பட்டாலும், கோபத்தை அகற்றும்படி வேண்டுகிற இச்சொற்றொடரில் தமிழில் ‘எங்களிடமிருந்து’ என்பதே நோக்கப்பட்ட உறவை இயல்பாக வெளிப்படுத்துகிறது; ‘எங்களுக்கு எதிரான’ என்று மொழிபெயர்ப்பது மூலத்தில் மறைமுகமாக உள்ள பகைநிலையை அதிகமாக வெளிப்படுத்திவிடும்.
theological_decisions:
- issue: தொடக்க வேண்டுதல் மனமாற்றத்தையா அல்லது தேவன் மக்களை மீண்டும் நல்வாழ்வுக்குக் கொண்டுவருவதையா முதன்மையாகக் குறிக்கிறது?
  choice: எங்களைத் திரும்பக் கொண்டுவாரும்
  alternative: எங்களை மீண்டும் நிலைநிறுத்தும்
  rationale: எபிரெய வினை ‘திரும்பச் செய்தல்’ என்பதை நேரடியாகக் குறிக்கிறது; சங்கீதத்தின் சூழலில் மீட்பும் புதுப்பிக்கப்பட்ட தயவும் உட்படலாம். ‘திரும்பக் கொண்டுவாரும்’ என்பது தேவனுடைய முன்முயற்சியைப் பாதுகாத்தபடியே, வேண்டுதலை அகமன மனமாற்றம் அல்லது வெளிப்புற மறுசீரமைப்பு என்ற ஒன்றுக்குள் மட்டும் சுருக்காமல் விடுகிறது.
translation_notes:
  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நேரடியாக அழைக்கும் முறையில் ‘உமது’ மற்றும் மரியாதைக் கட்டளை விகுதிகள் இடம்பெறுகின்றன. கவிதை வரியமைப்பு மூல வசனத்தின் இரண்டு வேண்டுதல்களைத் தெளிவாகப் பிரிக்கிறது.
