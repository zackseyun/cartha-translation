source:
  edition: WLC
  text: נָ֭שָׂאתָ עֲוֺ֣ן עַמֶּ֑/ךָ כִּסִּ֖יתָ כָל חַטָּאתָ֣/ם סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/002.yaml
  text: You forgave the iniquity of your people[a]; you covered all their sin[b]. Selah
translation:
  language: ta
  text: உமது மக்களின் அக்கிரமத்தை மன்னித்தீர்[a]; அவர்களுடைய எல்லாப் பாவங்களையும் மூடினீர்[b]. சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொல்லுக்குச் சொல்லாக, “உமது மக்களின் அக்கிரமத்தைச் சுமந்தீர்” அல்லது “சுமந்து அகற்றினீர்.” குற்றத்தைத் தூக்குதல் அல்லது சுமந்து அகற்றுதல் என்ற உருவகத்தின் மூலம் எபிரெய மரபுத்தொடர் மன்னிப்பை வெளிப்படுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களுடைய பாவம் முழுவதையும்.” எபிரெயில் பன்மை உடைமைப் பின்னொட்டுடன் ஒருமைப் பெயர்ச்சொல் வருகிறது; இதைத் தொகுப்பாக “பாவம்” என்றோ, தனித்தனியாக “பாவங்கள்” என்றோ மொழிபெயர்க்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: נָשָׂאתָ
  choice: மன்னித்தீர்
  rationale: נשׂא என்பதன் அடிப்படைப் பொருள் ‘தூக்குதல், சுமத்தல்/சுமத்திச் செல்லுதல்’ என்பதாகும். ஆனால் עָוֹן என்பதைக் கருமமாகக் கொள்ளும் இவ்விடத்து, குற்றத்தை அகற்றுவதன் வழியாக மன்னிப்பதைச் சுட்டும் எபிரெய மரபுத்தொடராக வருகிறது. நவீன தமிழில் பொருளைத் தெளிவாகக் கூற ‘மன்னித்தீர்’ தேர்ந்தெடுக்கப்பட்டது; அடிப்படை உருவகம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: עֲוֺן
  choice: அக்கிரமம்
  rationale: עָוֹן என்பது சூழலுக்கேற்ப அக்கிரமம், குற்றப்பழி, அல்லது அக்கிரமத்தின் விளைவு ஆகியவற்றைக் குறிக்கலாம். இங்கு மன்னிப்பு மரபுத்தொடருக்குள் இருப்பதாலும், அடுத்துவரும் חַטָּאתָם என்பதிலிருந்து சொல்வேறுபாட்டைப் பேணுவதாலும் ‘அக்கிரமம்’ பொருத்தமானது.
- source_word: עַמֶּךָ
  choice: உமது மக்கள்
  rationale: עַם என்பது இங்கு தேவனோடு உறவுடைய கூட்டுமக்களைக் குறிக்கிறது. ‘உமது மக்கள்’ அந்த உறவையும் இரண்டாம் நபர் ஒருமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כִּסִּיתָ
  choice: மூடினீர்
  rationale: כסה என்பதன் நேரடிப் பொருள் ‘மூடுதல்.’ பாவமன்னிப்புச் சூழலில் உள்ள உருவகத்தையும் சங்கீதங்களின் தொடர்புடைய மொழிநடையையும் காக்க ‘மூடினீர்’ பயன்படுத்தப்பட்டது.
- source_word: כָל
  choice: அனைத்தையும்
  rationale: כָל என்பது ‘எல்லாம்/அனைத்தும்’ என்று பொருள்படும். கூட்டொருமையாக வரும் ‘பாவம்’ என்பதோடு ‘பாவம் அனைத்தையும்’ என்பது பொருளை இயல்பாக எடுத்துரைக்கிறது.
- source_word: חַטָּאתָם
  choice: அவர்களுடைய பாவம்
  rationale: חַטָּאת இங்கு இணைவாக்கியத்தாலும் மன்னிப்புச் சூழலாலும் ‘பாவம்’ என்பதையே குறிக்கிறது; ‘பாவபலியை’ அல்ல. எபிரெயில் ஒருமைப் பெயர்ச்சொல்லோடு பன்மை உடைமைப் பின்னொட்டு இருப்பதால், அதன் கூட்டொருமை வடிவம் தமிழிலும் பேணப்பட்டது.
- source_word: סֶלָה
  choice: சேலா
  rationale: סֶלָה என்பதன் துல்லியமான பொருள் உறுதியற்றது. ‘இடைநிறுத்தம்’ போன்ற விளக்கத்தை உரைக்குள் திணிக்காமல் ஒலிபெயர்ப்பாக ‘சேலா’ வைக்கப்பட்டது.
theological_decisions:
- issue: נשׂא עון என்ற மன்னிப்பு மரபுத்தொடரை மொழிபெயர்த்தல்
  choice: உமது மக்களின் அக்கிரமத்தை மன்னித்தீர்
  alternative: உமது மக்களின் அக்கிரமத்தைச் சுமந்தீர் / சுமந்து அகற்றினீர்
  rationale: இம்மரபுத்தொடர் குற்றத்தைத் தூக்கி அகற்றுதல் என்ற உருவகத்தின் வழியாக மன்னிப்பைக் குறிக்கிறது. முதன்மை உரை நவீன வாசகருக்குப் பொருளை நேரடியாகத் தருகிறது; எபிரெயின் உருவகம் அடிக்குறிப்பில் மாற்று மொழிபெயர்ப்பாகக் காக்கப்படுகிறது.
- issue: חַטָּאתָם என்பதை ஒருமையாகவா பன்மையாகவா கொடுப்பது
  choice: அவர்களுடைய பாவம் அனைத்தையும்
  alternative: அவர்களுடைய பாவங்கள் அனைத்தையும்
  rationale: எபிரெயச் சொல் ஒருமையில் இருந்து பன்மை உடைமைப் பின்னொட்டைப் பெற்றுள்ளது; அது கூட்டொருமையாகச் செயல்படலாம். ஆகவே மூலத்தின் வடிவத்தையும் கவிதை இணைநிலையையும் பேண ஒருமை தேர்ந்தெடுக்கப்பட்டது; பகிர்ந்துரைக்கும் பன்மையும் செல்லத்தக்கது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டது. தேவனை நோக்கிய மரியாதை ஒருமைக்கு ‘உமது/மன்னித்தீர்/மூடினீர்’ வடிவங்கள் தேர்ந்தெடுக்கப்பட்டன. இணையான இரு வாக்கியங்களின் அமைப்பும் ‘மன்னித்தீர்—மூடினீர்’ என்ற இறந்தகால வினை ஒற்றுமையும் பேணப்பட்டுள்ளன.
