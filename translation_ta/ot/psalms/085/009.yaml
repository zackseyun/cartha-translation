source:
  edition: WLC
  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/009.yaml
  text: Surely his salvation is near to those who fear him[b][a], so that glory may dwell in our land.
translation:
  language: ta
  text: மகிமை[a] நமது நாட்டில் தங்கும்படியாக, அவருக்கு அஞ்சுகிறவர்களுக்கு அவரது மீட்பு நிச்சயமாக அருகில் உள்ளது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘மகிமை’ என்பது இறைவனின் வெளிப்படும் பிரசன்னத்தையோ, நாட்டிற்கு மீண்டும் கிடைக்கும் மதிப்பையோ மேன்மையையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: உண்மையாகவே
  rationale: இங்கு இது கட்டுப்படுத்தும் ‘மட்டுமே’ என்ற பொருளைவிட வலியுறுத்தி உறுதிப்படுத்தும் இடைச்சொல்லாக வருகிறது.
- source_word: קָרוֹב
  choice: அருகில் இருக்கிறது
  rationale: நெருக்கம் அல்லது அண்மையை இயல்பான தமிழில் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: לִירֵאָיו
  choice: அவருக்கு அஞ்சுகிறவர்களுக்கு
  rationale: இறைவனைப் பற்றிய பயபக்தியை உள்ளடக்கிய ‘அஞ்சுதல்’ என்ற மூலப்படிமத்தை மென்மையாக்காமல் காக்கிறது.
- source_word: יִשְׁעוֹ
  choice: அவரது மீட்பு
  rationale: ישׁע என்பதன் விடுவித்தல் மற்றும் இரட்சித்தல் சார்ந்த பரப்பை ‘மீட்பு’ இயல்பாகக் கொண்டுள்ளது; உடைமைத் தொடர்பும் காக்கப்படுகிறது.
- source_word: לִשְׁכֹּן
  choice: தங்குவதற்காக
  rationale: ל உடன் வரும் வினையெச்சத்தின் நோக்கம் அல்லது விளைவு சார்ந்த உறவைச் சுருக்கமாகக் காட்டுகிறது.
- source_word: כָּבוֹד
  choice: மகிமை
  rationale: இறைவனின் வெளிப்படும் பிரசன்னம், கனமிக்க மேன்மை, அல்லது நாட்டிற்கு மீளும் மதிப்பு ஆகியவற்றில் ஒன்றை மட்டும் நிர்ணயிக்காமல் மூலத்தின் கவித்துவத் திறப்பைக் காக்கிறது.
- source_word: בְּאַרְצֵנוּ
  choice: நமது நாட்டில்
  rationale: இச்சூழலில் אֶרֶץ முழு பூமியைவிட மக்களின் சொந்த நாட்டைக் குறிக்கிறது.
theological_decisions:
- issue: כָּבוֹד (‘மகிமை’) என்பதன் குறிப்பிடம்
  choice: யாருடைய அல்லது எத்தகைய மகிமை என்று விளக்கிச் சேர்க்காமல் ‘மகிமை’ எனப் பொதுவாக வைக்கப்பட்டது.
  alternative: இறைவனின் மகிமையான பிரசன்னம் நாட்டில் தங்குவது; அல்லது நாட்டிற்கு மதிப்பும் மேன்மையும் மீளுவது.
  rationale: எபிரெய உரை குறிப்பிடத்தைத் தெளிவாக நிர்ணயிக்கவில்லை. ஆகவே அதன் உண்மையான இறையியல் மற்றும் கவித்துவப் பன்முகத்தன்மை பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், எளிதில் புரியும் அதேவேளையில் சங்கீதத்திற்குரிய கண்ணியமும் கவித்துவமும் கொண்ட நடை. ‘அஞ்சுகிறவர்கள்’ என்பது வெறும் பயத்தை மட்டுமல்ல, இறைவனை நோக்கிய பயபக்தியையும் தக்கவைக்கிறது.
