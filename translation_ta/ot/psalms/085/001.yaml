source:
  edition: WLC
  text: רָצִ֣יתָ יְהוָ֣ה אַרְצֶ֑/ךָ שַׁ֝֗בְתָּ שבות יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/001.yaml
  text: You have shown favor to your land[a], O Yahweh; you restored the fortunes of Jacob.
translation:
  language: ta
  text: யெகோவாவே, உமது நாட்டின்மேல் தயவு காட்டினீர்; யாக்கோபின் நல்வாழ்வை மீட்டளித்தீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாக்கோபின் சிறையிருப்பைத் திரும்பக் கொண்டுவந்தீர்”; அல்லது, “யாக்கோபின் சிறைப்பட்டவர்களைத் திரும்பக் கொண்டுவந்தீர்.” இந்த எபிரெய மொழிவழக்கு நாடுகடத்தலிலிருந்து மீட்டலையோ, பொதுவாக நல்வாழ்வை மீட்டளித்தலையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: רָצִיתָ
  choice: தயவு காட்டினீர்
  rationale: Qal வடிவிலுள்ள רצה இங்கு ஒருவர்மேல் பிரியமாயிருத்தல் அல்லது தயவு காட்டுதல் என்ற பொருளைத் தருகிறது. கடவுள் தமது நாட்டுக்கு நன்மை செய்தார் என்ற கருத்தை இயல்பான நவீனத் தமிழில் இது வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யெகோவாவே
  rationale: இது பட்டம் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயரான நான்கு எழுத்துப் பெயர். தமிழில் பரவலாக அறியப்படும் பெயரொலிப்பு வடிவமும் விளிவேற்றுமையும் பயன்படுத்தப்பட்டுள்ளன.
- source_word: אַרְצֶךָ
  choice: உமது நாடு
  rationale: אֶרֶץ இங்கு கடவுளுக்குரிய நிலப்பரப்பை, பெரும்பாலும் இஸ்ரவேல் நாட்டை, குறிக்கிறது. ‘நாடு’ என்பது நவீனத் தமிழில் இயல்பாகவும் தேவையற்ற அரசியல் நுட்பத்தைச் சேர்க்காமலும் உள்ளது.
- source_word: שַׁבְתָּ
  choice: மீண்டும் சீராக்கினீர்
  rationale: שוב என்பதும் அதைத் தொடரும் שבות என்பதும் சேர்ந்து பழைய நல்ல நிலைக்குக் கொண்டுவருதல் அல்லது சூழ்நிலையைத் திருப்புதல் என்ற மொழிவழக்குப் பொருளைத் தருகின்றன.
- source_word: שבות
  choice: நிலைமை
  rationale: שוב שבות என்ற எபிரெய மொழிவழக்கு பொதுவான நல்வாழ்வு மீட்பையோ சிறையிருப்பிலிருந்து திரும்புதலையோ குறிக்கலாம். ‘நிலைமையை மீண்டும் சீராக்கினீர்’ என்பது பரந்த பொருளைப் பாதுகாக்கிறது; சிறையிருப்பு சார்ந்த வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: மூலத்தில் உள்ள கவிதைநயமான உடன்படிக்கைப் பெயரே வைக்கப்பட்டுள்ளது; இங்கு அது யாக்கோபின் சந்ததியாரான இஸ்ரவேல் மக்களை ஒட்டுமொத்தமாகக் குறிக்கிறது.
theological_decisions:
- issue: שׁוּב שְׁבוּת יַעֲקֹב என்ற மொழிவழக்கின் பொருள்
  choice: யாக்கோபின் நிலைமையை மீண்டும் சீராக்கினீர்
  alternative: யாக்கோபின் சிறையிருப்பை முடிவுக்குக் கொண்டுவந்தீர் / சிறைப்பட்ட யாக்கோபின் மக்களைத் திரும்பக் கொண்டுவந்தீர்
  rationale: இந்த எபிரெய மொழிவழக்கு சூழ்நிலையின் பொதுவான நல்ல மாற்றத்தையோ நாடுகடத்தல் அல்லது சிறையிருப்பிலிருந்து மீட்பையோ குறிக்கக்கூடும். முதன்மை உரை அதன் பரந்த பொருளை வைத்திருக்கிறது; வரலாற்றுச் சிறையிருப்பு சார்ந்த சாத்தியம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன, கண்ணியமான, பொதுமக்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கடவுளை நோக்கிய உரையில் மரியாதைப் பன்மை உள்ளது. எபிரெயக் கவிதையின் இரு இணையான கூற்றுகளும் சுருக்கமாகப் பாதுகாக்கப்பட்டுள்ளன.
