source:
  edition: WLC
  text: אָסַ֥פְתָּ כָל עֶבְרָתֶ֑/ךָ הֱ֝שִׁיב֗וֹתָ מֵ/חֲר֥וֹן אַפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/003.yaml
  text: You withdrew all your wrath[a]; you turned back from the burning of your anger.
translation:
  language: ta
  text: உமது கடுங்கோபம் முழுவதையும் நீர் அகற்றினீர்; உமது சினத்தின் கொதிப்பிலிருந்து திரும்பினீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “உமது கடுங்கோபம் முழுவதையும் நீர் அகற்றினீர்; உமது கொதிக்கும் சினத்தைவிட்டு விலகினீர்.”'
    reason: הֱשִׁיבוֹתָ מֵ־ என்ற வினைச்சொல்-முன்னிடைச் சொற்றொடர், ‘அதிலிருந்து திரும்புதல்’ அல்லது ‘அதைவிட்டு விலகுதல்’ என மொழிபெயர்க்கப்படலாம்.
lexical_decisions:
- source_word: אָסַפְתָּ
  choice: விலக்கிக்கொண்டீர்
  rationale: אָסַף என்பதன் அடிப்படைப் பொருள் ‘சேர்த்தல், திரட்டுதல்’; கோபத்தைச் சார்ந்த இச்சூழலில் அது கோபத்தைத் திரும்பப் பெற்றல் அல்லது அகற்றுதல் என்னும் உருவகப் பொருளைத் தருகிறது. ‘விலக்கிக்கொண்டீர்’ என்பது இதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כָל
  choice: அனைத்தையும்
  rationale: முழுமையைக் குறிக்கும் כָל என்பதன் வலியுறுத்தலைப் பாதுகாக்கிறது.
- source_word: עֶבְרָתֶךָ
  choice: உமது கடுங்கோபம்
  rationale: עֶבְרָה என்பது பொங்கியெழும் தீவிரமான கோபத்தைச் சுட்டுகிறது. ‘கடுங்கோபம்’ சங்கீதத்தின் கண்ணியமான நடைக்கும் தீவிரத்திற்கும் ஏற்றது.
- source_word: הֱשִׁיבוֹתָ
  choice: திரும்பினீர்
  rationale: שׁוב என்பதன் ஹிஃபில் வடிவம் பொதுவாக ‘திருப்புதல்’ அல்லது ‘திரும்பச்செய்தல்’ என்று பொருள்படும்; מן உடன் இங்கு ‘அதிலிருந்து திரும்புதல்’ என்ற கருத்தை அளிக்கிறது.
- source_word: מֵחֲרוֹן
  choice: கொதிப்பிலிருந்து
  rationale: חָרוֹן கோபத்தின் எரியும் வெப்பத்தை உருவகமாகக் காட்டுகிறது. ‘கொதிப்பு’ அந்த வெப்ப உருவகத்தையும் தீவிரத்தையும் இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אַפֶּךָ
  choice: உமது சினத்தின்
  rationale: אַף என்பதன் சொற்பொருள் ‘மூக்கு’; ஆனால் இச்சொற்றொடரில் அது கோபத்தைக் குறிக்கிறது. ‘சினம்’ என்பது சூழலுக்கேற்ற தெளிவான உருவகப் பொருள்.
theological_decisions:
- issue: இறைவனுடைய கோபத்தை மனிதப் பண்பில் சித்தரிக்கும் மொழி
  choice: ‘சினத்தின் கொதிப்பு’ என்று வெப்ப உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘கடுமையான சினம்’ என்று உருவகத்தைப் பொதுமைப்படுத்துதல்
  rationale: எபிரெய உரை கோபத்தை எரியும் வெப்பமாகச் சித்தரிக்கிறது. அதைத் தக்கவைப்பது தெய்வீக நியாயத்தீர்ப்பின் தீவிரத்தை மழுங்கடிக்காமலும், உடலுறுப்பு குறித்த சொற்படியான மொழிபெயர்ப்பால் தமிழில் குழப்பம் ஏற்படுத்தாமலும் இருக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான சங்கீத நடையைப் பேண ‘உமது/நீர்’ வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. இணைவாக்கிய அமைப்பும் கோபத்தின் வெப்ப உருவகமும் பாதுகாக்கப்பட்டுள்ளன.
