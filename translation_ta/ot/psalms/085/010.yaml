  text: חֶֽסֶד וֶ/אֱמֶ֥ת נִפְגָּ֑שׁוּ צֶ֖דֶק וְ/שָׁל֣וֹם נָשָֽׁקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/010.yaml
  text: Steadfast love and truth have met[b][a]; righteousness and peace have kissed.
translation:
  language: ta
  text: மாறாத அன்பும் உண்மையும் ஒன்றையொன்று சந்தித்தன[a]; நீதியும் சமாதானமும் ஒன்றையொன்று முத்தமிட்டன[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உண்மை’ (אֱמֶת) என்பதற்கு மாற்றாக ‘நம்பகத்தன்மை’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: ‘நீதி’ (צֶדֶק) என்பதற்கு மாற்றாக ‘நியாயம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: חֶסֶד என்பது வெறும் பாசத்தைவிட நிலைத்த, உறவுசார் விசுவாசமான அன்பைக் குறிக்கிறது. ‘மாறாத அன்பு’ அதன் நீடித்த தன்மையை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱמֶת
  choice: உண்மை
  rationale: אֱמֶת என்பதற்கு ‘உண்மை’, ‘உண்மைத்தன்மை’, ‘நம்பகத்தன்மை’ ஆகிய பொருள்கள் உண்டு. இக்கவிதை இணைப்பில் ‘உண்மை’ இயல்பாக உள்ளது; ‘உண்மைத்தன்மை’ என்ற சாத்தியமும் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: נִפְגָּשׁוּ
  choice: ஒன்றையொன்று சந்தித்தன
  rationale: נפגשׁ என்பதன் நிபால் வடிவம் சந்தித்தல் அல்லது ஒன்றுகூடுதல் என்ற பொருளைத் தருகிறது. இரு பண்புகளும் உயிரூட்டிப் பேசப்படுவதால், பரஸ்பர சந்திப்பைத் தமிழில் தெளிவுபடுத்த ‘ஒன்றையொன்று’ சேர்க்கப்பட்டுள்ளது.
- source_word: צֶדֶק
  choice: நீதி
  rationale: צֶדֶק நீதியான நிலை அல்லது நியாயத்தைக் குறிக்கலாம். இங்கு ‘நீதி’ நவீன தமிழில் இரு பரிமாணங்களையும் தாங்கும் சுருக்கமான, இயல்பான தேர்வு; ‘நியாயம்’ மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: שָׁלוֹם என்பது சமாதானம், முழுமை, நல்வாழ்வு எனப் பரந்த பொருளுடையது. இக்கவிதைச் சூழலில் ‘சமாதானம்’ அறிமுகமானதும் இயல்பானதும் ஆகும்.
- source_word: נָשָׁקוּ
  choice: ஒன்றையொன்று முத்தமிட்டன
  rationale: נשׁק என்பதன் நேரடியான கவித்துவப் படிமம் ‘முத்தமிடுதல்’. அதை ‘இணைந்தன’ போன்ற விளக்கவுரையாக மெலிதாக்காமல், உயிரூட்டலை அப்படியே தக்கவைக்கிறது.
theological_decisions:
- issue: உடன்படிக்கை மற்றும் ஒழுக்கப் பண்புகளை உயிரூட்டிப் பேசுதல்
  choice: ‘சந்தித்தன’, ‘முத்தமிட்டன’ என்ற கவித்துவ உயிரூட்டலை நேரடியாகத் தக்கவைத்தல்
  alternative: ‘இசைவாக ஒன்றிணைந்தன’ அல்லது ‘ஒப்புரவாயின’ என விளக்கிப் பொழிப்புரை செய்தல்
  rationale: எபிரெய உரை இப்பண்புகளைச் செயல்படும் நபர்களைப்போல் சித்தரிக்கிறது. இந்தப் படிமத்தைப் பாதுகாப்பது, உரையே வெளிப்படையாகக் கூறாத கோட்பாட்டு ஒருங்கிணைப்பைச் சேர்க்காமல் அதன் கவித்துவ மற்றும் இறையியல் நெருக்கத்தைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்கேற்ற கண்ணியமான கவித்துவ நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. அசல் எபிரெயத்தின் இணை அமைப்பும் உயிரூட்டலும் காக்கப்பட்டுள்ளன; பரஸ்பரச் செயலைத் தமிழில் இயல்பாகத் தெரிவிக்க ‘ஒன்றையொன்று’ பயன்படுத்தப்பட்டுள்ளது.
