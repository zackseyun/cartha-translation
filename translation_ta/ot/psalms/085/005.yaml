  text: Will you be angry with us forever? Will you prolong your anger from generation to generation?[a][b]
translation:
  language: ta
  text: என்றென்றும் எங்கள்மேல் கோபமாயிருப்பீரோ? தலைமுறை தலைமுறையாக உமது கோபத்தை நீட்டிப்பீரோ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நேர்ச்சொல்லாக, “உமது கோபத்தை இழுப்பீரோ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָם
  choice: என்றென்றும்
  rationale: வினாவிடைத் துகளுடன் வரும் לְעוֹלָם, இங்கு காலவரையற்ற நீடிப்பைக் குறிக்கும் வினாவாக உள்ளது; ‘என்றென்றும்’ இயல்பான, சுருக்கமான தமிழ் இணை.
- source_word: תֶּאֱנַף
  choice: கோபமாயிருப்பீரோ
  rationale: אנף என்பதன் நேரடிப் பொருள் ‘கோபமாயிருத்தல்’; புலம்பலின் வினாத்தொனியையும் தொடரும் நிலையையும் இத்தேர்வு இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בָּנוּ
  choice: எங்கள்மேல்
  rationale: אנף உடன் வரும் בְּ கோபத்தின் இலக்கைச் சுட்டுகிறது; தமிழில் ‘எங்கள்மேல் கோபம்’ என்பது இயல்பானதும், ‘எங்களுக்கு எதிராக’ என்பதைக் காட்டிலும் மூலத்தின் உறவுசார் மொழியை நன்கு காக்கிறதும் ஆகும்.
- source_word: תִּמְשֹׁךְ
  choice: நீடிக்கச் செய்வீரோ
  rationale: משך என்பதன் அடிப்படை உருவகம் ‘இழுத்தல்/நீட்டுதல்’; கோபத்துடன் இங்கு அதன் காலநீடிப்பே கருத்தாக இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்படுகிறது. நேரடி உருவகம் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: אַפְּךָ
  choice: உமது கோபத்தை
  rationale: אַף என்பதன் சொற்பொருள் ‘மூக்கு’ என்றாலும், இங்கு நிறுவப்பட்ட உருவகப் பொருள் ‘கோபம்’; தேவகோபத்தை மென்மைப்படுத்தாமல் நேரடியாகத் தருகிறது.
- source_word: לְדֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: அடுத்தடுத்த தலைமுறைகள் முழுவதும் தொடர்வதைக் குறிக்கும் எபிரேய மரபுத்தொடருக்கு இயல்பான நவீனத் தமிழ் இணை.
theological_decisions:
- issue: தேவனுடைய கோபத்தை மனித உணர்வுச் சொல்லால் விவரித்தல்
  choice: ‘கோபம்’ என்ற மொழியை மென்மைப்படுத்தாமல் தக்கவைத்தல்
  alternative: ‘மனவருத்தம்’ அல்லது ‘அதிருப்தி’ என்று மொழிபெயர்த்தல்
  rationale: மூலம் தேவனுடைய கோபத்தையும் அதன் நீடிப்பையும் வெளிப்படையாகக் கூறுகிறது. அதைத் தக்கவைப்பது சங்கீதத்தின் புலம்பலையும் இறையியல் பதற்றத்தையும் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான புலம்பல் நடையில் அமைக்கப்பட்டது. இறைவனை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; இரண்டு இணையான வினாக்கள் மூலத்தின் கவிதை அமைப்பைப் பேணுகின்றன.
