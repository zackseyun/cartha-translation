  text: גַּם יְ֭הוָה יִתֵּ֣ן הַ/טּ֑וֹב וְ֝/אַרְצֵ֗/נוּ תִּתֵּ֥ן יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/012.yaml
  text: Indeed[a], Yahweh will give what is good, and our land will yield its produce.
translation:
  language: ta
  text: ஆம், யாவே[a] நல்லதைத் தருவார்; நமது நிலமும் தன் விளைச்சலைத் தரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நன்மையை” அல்லது “நல்லவற்றை” என்றும் மொழிபெயர்க்கலாம். இதற்கான எபிரெயச் சொற்றொடர் பரந்த பொருளுடையது; சூழலில் அறநன்மையையும் பொருள்சார் நன்மையையும் உள்ளடக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: ஆம்
  rationale: இங்கு גַּם வெறும் சேர்க்கைப் பொருளைவிட, முந்தைய வாக்குறுதிகளை உறுதிப்படுத்தும் வலியுறுத்தலாக வருகிறது; நவீன தமிழில் “ஆம்” இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள இறைவனின் தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: יִתֵּן
  choice: தருவார்
  rationale: சூழலில் எதிர்கால நம்பிக்கையையும் தெய்வீக ஆசீர்வாதத்தையும் குறிக்கும் imperfect வினையை இயல்பான தமிழ் எதிர்கால வடிவில் தருகிறது.
- source_word: הַטּוֹב
  choice: நன்மையானதை
  rationale: இச்சொற்றொடர் பொருள்சார் நன்மையை மட்டும் குறுக்காமல், நல்லது அல்லது நன்மையானவற்றை விரிவாகக் குறிக்கலாம்; “நன்மையானதை” அந்தப் பரப்பைத் தக்கவைக்கிறது.
- source_word: וְאַרְצֵנוּ
  choice: நமது நிலமும்
  rationale: வேளாண்மைச் சூழலில் אֶרֶץ மக்களின் நிலத்தைக் குறிக்கிறது. எபிரெய இணைப்பை தமிழில் இயல்பாக “-உம்” கொண்டு வெளிப்படுத்துகிறது.
- source_word: תִּתֵּן
  choice: தரும்
  rationale: மூலத்தில் “கொடுக்கும்” என்ற வினையே மீண்டும் வந்தாலும், தமிழில் நிலம் விளைச்சலைத் “தரும்” என்பது இயல்பாகவும் மூலத்தின் மறுபயன்பாட்டையும் நெருக்கமாகவும் பிரதிபலிக்கிறது.
- source_word: יְבוּלָהּ
  choice: தன் விளைச்சலை
  rationale: יְבוּל என்பது நிலத்தின் உற்பத்தி அல்லது விளைச்சலைக் குறிக்கிறது; “தன்” என்பது நிலத்தையே சுட்டும் எபிரெய உரிமைப்பின்னொட்டைத் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல வசனம் நான்கு எழுத்துகளாலான தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. தனிப்பெயரைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வடிவத்தையும் உடன்படிக்கைச் சூழலையும் காக்கிறது; “யாவே” என்பது ஏற்றுக்கொள்ளப்பட்ட தமிழ் ஒலிவடிவம்.
- issue: הַטּוֹב என்பதன் பொருள் பரப்பு
  choice: நன்மையானதை
  alternative: நன்மையை / நல்லவற்றை
  rationale: இது அறநன்மையையோ பொருள்சார் நன்மைகளையோ, அல்லது இரண்டையும் குறிக்கக்கூடிய பரந்த சொற்றொடர். வசனத்தின் வேளாண்மைச் சூழலை மட்டும் கொண்டு பொருளைச் சுருக்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் பொதுவாசகர்களுக்கு எளிதில் புரியும் நடை. வாக்கியத்தின் இரு பகுதிகளிலும் வரும் נתן (“தருதல்”) என்ற வினையின் கவித்துவ ஒற்றுமை முடிந்தவரை காக்கப்பட்டுள்ளது.
