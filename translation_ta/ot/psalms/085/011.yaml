  text: Truth will spring up from the earth[b][a], and righteousness will look down from heaven.
translation:
  language: ta
  text: உண்மை பூமியிலிருந்து முளைத்தெழும்[a]; நீதி வானத்திலிருந்து கீழே நோக்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உண்மைத்தன்மை பூமியிலிருந்து முளைத்தெழும்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நியாயம் வானத்திலிருந்து கீழே நோக்கும்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: உண்மை
  rationale: இந்த எபிரேயச் சொல் உண்மை, உண்மைத்தன்மை, நம்பகத்தன்மை ஆகிய பொருள்களைக் கொண்டது. צֶדֶק என்பதுடன் இணையாக வரும் இக்கவிதைச் சூழலில், பண்பை இயல்பாகவும் தெளிவாகவும் குறிப்பிடுவதற்கு ‘உண்மை’ பொருத்தமானது; ‘உண்மைத்தன்மை’ அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מֵאֶרֶץ
  choice: பூமியிலிருந்து
  rationale: אֶרֶץ என்பது ‘பூமி’ அல்லது ‘நாடு’ எனப் பொருள்படலாம். இங்கு ‘வானத்திலிருந்து’ என்பதற்கு எதிரான கீழ்–மேல் அமைப்பு இருப்பதால் ‘பூமியிலிருந்து’ கவிதைச் சமச்சீரைப் பாதுகாக்கிறது.
- source_word: תִּצְמָח
  choice: முளைத்தெழும்
  rationale: צמח தாவரம் முளைப்பதையோ வளர்ந்து வெளிவருவதையோ குறிக்கிறது. ‘முளைத்தெழும்’ அந்த உயிருள்ள வேளாண் உருவகத்தையும் எதிர்காலச் செயலையும் இயல்பான தமிழில் தருகிறது.
- source_word: צֶדֶק
  choice: நீதி
  rationale: צֶדֶק அறச்சீர்மை மற்றும் நியாயம் ஆகிய இரு நெருங்கிய பொருள்களையும் தாங்குகிறது. ‘நீதி’ தமிழில் இந்தப் பரந்த அறவியல் கருத்தைச் சுருக்கமாகக் காக்கிறது; குறிப்பாக நீதித்தீர்ப்பு சார்ந்த ‘நியாயம்’ மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: מִשָּׁמַיִם
  choice: வானத்திலிருந்து
  rationale: שָׁמַיִם வானம், வானங்கள், ஆகாயம் என மொழிபெயர்க்கப்படலாம். ‘வானத்திலிருந்து’ என்பது ‘பூமியிலிருந்து’ என்பதுடனான கவிதை எதிரிணையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: נִשְׁקָף
  choice: கீழே நோக்கும்
  rationale: שׁקף என்பதன் நிப்அல் வடிவம் உயரத்திலிருந்து வெளியே அல்லது கீழே பார்ப்பதைக் குறிக்கிறது. ‘கீழே நோக்கும்’ திசையையும் நீதியை ஆளுருவாக்கும் கவிதைப் படிமத்தையும் காக்கிறது.
theological_decisions:
- issue: צֶדֶק என்ற சொல்லின் அறச்சீர்மை–நியாயம் பொருள் பரப்பு
  choice: நீதி
  alternative: நியாயம்
  rationale: இவ்வசனத்தில் אֱמֶת என்பதுடன் இணையாக நிற்கும் ஆளுருவாக்கப்பட்ட அறப்பண்பாக צֶדֶק வருகிறது. ‘நீதி’ அதன் பரந்த அறச்சீர்மை சார்ந்த பொருளைத் தக்கவைக்கிறது; சட்ட அல்லது தீர்ப்பு சார்ந்த ‘நியாயம்’ என்ற சாத்தியத்தையும் அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் பூமி–வானம் எதிரிணை, தாவர உருவகம், நீதியின் ஆளுருவாக்கம் ஆகியவை பாதுகாக்கப்பட்டுள்ளன.
