  text: Show us your steadfast love[a], O Yahweh, and grant us your salvation.
translation:
  language: ta
  text: யாவே, உமது மாறாத அன்பை எங்களுக்குக் காட்டும்[a]; உமது மீட்பை எங்களுக்குத் தாரும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “யாவே, எங்களை உமது மாறாத அன்பைக் காணச் செய்யும்; உமது மீட்பை எங்களுக்குத் தாரும்.”
    reason: הַרְאֵנוּ என்பதன் சொல்லுக்குச் சொல் பொருளான ‘எங்களை காணச் செய்யும்’ என்ற காரணவினை நுணுக்கத்தைப் பதிவு செய்யும் மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: הַרְאֵנוּ
  choice: எங்களுக்குக் காட்டும்
  rationale: ראה என்பதன் ஹிஃபில் கட்டளை வடிவம் சொல்லுக்குச் சொல் ‘எங்களை காணச் செய்யும்’ எனப் பொருள்படும். வேண்டுதல் நடையில் ‘எங்களுக்குக் காட்டும்’ என்பது அதன் செயப்பாட்டு வலிமையை இயல்பான தமிழில் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரேய இறைப்பெயரான יהוה ஒரு பட்டப்பெயரால் மாற்றப்படாமல், நவீன தமிழில் அறியப்பட்ட ஒலிபெயர்ப்பான ‘யாவே’ என வழங்கப்பட்டுள்ளது.
- source_word: חַסְדֶּךָ
  choice: உமது மாறாத அன்பை
  rationale: חסד என்பது பற்றுறுதியும் நிலைத்தன்மையும் கொண்ட அன்பையும் இரக்கமிக்க நன்மையையும் குறிக்கிறது. ‘மாறாத அன்பு’ அதன் உணர்வையும் நீடித்த விசுவாசத்தையும் தெளிவாக வெளிப்படுத்துகிறது; ‘உடன்படிக்கை அன்பு’ என்று பொருளை மிகக் குறுகச் செய்யவில்லை.
- source_word: וְיֶשְׁעֲךָ
  choice: உமது மீட்பை
  rationale: ישע இங்கு தேவன் அளிக்கும் காப்பையும் விடுதலையையும் குறிக்கிறது. ‘மீட்பு’ என்பது சங்கீதத்தின் வேண்டுதல் சூழலில் இயல்பாக இருந்து, உடனடியான விடுதலையையும் விரிவான இறைக் காப்பையும் உள்ளடக்குகிறது.
- source_word: תִּתֶּן לָנוּ
  choice: எங்களுக்குத் தாரும்
  rationale: נתן உடன் வரும் לָנוּ என்பதன் நேர்பொருள் ‘எங்களுக்குக் கொடும்’ என்பதாகும். இறைவனிடம் செய்யும் மரியாதையான வேண்டுதலில் ‘எங்களுக்குத் தாரும்’ என்பது கட்டளை வடிவ வேண்டுதலை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலவசனம் יהוה என்ற தனிப்பட்ட இறைப்பெயரையே பயன்படுத்துகிறது. அதை ஒரு பட்டப்பெயராக மாற்றாமல் ‘யாவே’ என ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன, மரியாதையான சங்கீத வேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை வினைகள் ‘காட்டும்’, ‘தாரும்’ என்றும், இரண்டாம் நபர் உரிமை ‘உமது’ என்றும் வழங்கப்பட்டுள்ளன; இவை இயல்பான தமிழில் கண்ணியத்தைத் தக்கவைக்கின்றன.
