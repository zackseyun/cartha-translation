  rationale: சூழலில் தேவன் தமது மக்களிடம் மீண்டும் தயவுடன் திரும்புவது பொருத்தமான புரிதல். ஆனால் ‘எங்களிடம்’ அல்லது ‘தயவுடன்’ என்பது எபிரெய உரையில் வெளிப்படையாக இல்லை; ஆகவே விளக்கத்தை உரைக்குள் சேர்க்காமல் அடிக்குறிப்பில் குறிப்பிடப்பட்டது.
- issue: ‘உயிர்ப்பித்தல்’ என்பது ஆன்மிகப் புதுப்பிப்பை மட்டும் குறிக்கிறதா
  choice: ‘உயிர்ப்பிக்க’ என்ற பரந்த சொல் பயன்படுத்தப்பட்டது.
