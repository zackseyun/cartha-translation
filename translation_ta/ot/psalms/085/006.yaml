  rationale: சங்கீதத்தின் சூழல் தண்டனைக்குப் பிந்தைய சமூக மீட்பை உள்ளடக்கினாலும், எபிரெய சொல் பொருளை ஆன்மிகம் அல்லது அரசியல்-சமூக மீட்பு என ஒன்றில் மட்டும் கட்டுப்படுத்தவில்லை.
