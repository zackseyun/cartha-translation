lexical_decisions:
- source_word: הֲלֹא
  choice: …மாட்டீரா?
  rationale: நேர்மறையான பதிலை எதிர்பார்க்கும் எபிரெய எதிர்மறை வினாவை, இயல்பான தமிழ் மரியாதை ஒருமை வினைமுற்றால் வெளிப்படுத்துகிறது.
- source_word: תָּשׁוּב
  choice: திரும்பி
  rationale: שוב என்பதன் அடிப்படைப் பொருளான ‘திரும்புதல்’ என்பதைப் பாதுகாக்கிறது; தேவன் தமது மக்களிடம் மீண்டும் தயவுடன் திரும்புவதைக் குறிப்பதாகச் சூழல் உணர்த்தினாலும், அதை மூலவசனம் வெளிப்படையாகச் சொல்லவில்லை.
- source_word: תְּחַיֵּנוּ
  choice: எங்களை உயிர்ப்பிக்க
  rationale: חיה என்பதன் பியேல் வடிவம் ‘வாழச் செய்தல், உயிரை மீட்டளித்தல்’ என்ற பரந்த பொருளைக் கொண்டது. ‘உயிர்ப்பிக்க’ என்பது உடல்சார் உயிர், ஆன்மிகப் புதுப்பிப்பு, சமூக மீட்பு ஆகியவற்றில் ஒன்றாக மட்டும் பொருளைக் குறுக்காமல் வைத்திருக்கிறது.
- source_word: וְעַמְּךָ
  choice: அப்போது உமது மக்கள்
  rationale: எபிரெய இணைப்புச்சொல் இங்கு வேண்டுதலின் விளைவை அறிமுகப்படுத்துகிறது. தமிழில் ‘அப்போது’ அந்தத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது; ‘உமது மக்கள்’ உடன்படிக்கைச் சார்ந்த உறவுமொழியைப் பாதுகாக்கிறது.
- source_word: יִשְׂמְחוּ
  choice: மகிழ்வார்கள்
  rationale: இங்கு குறை வினை வேண்டுதலின் எதிர்பார்க்கப்படும் விளைவைக் காட்டுகிறது. ‘மகிழ்வார்கள்’ என்பது தமிழில் அந்த நம்பிக்கையான விளைவை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בָךְ
  choice: உம்மில்
  rationale: மகிழ்ச்சியின் பொருள் அல்லது மையத்தைச் சுட்டும் ב முன்னிடைச்சொல்லை நேரடியாகப் பாதுகாத்து, மக்களின் மகிழ்ச்சி தேவனை மையமாகக் கொண்டது என்பதைத் தெரிவிக்கிறது.
