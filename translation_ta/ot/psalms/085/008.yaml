  text: אֶשְׁמְעָ֗ה מַה יְדַבֵּר֮ הָ/אֵ֪ל יְה֫וָ֥ה כִּ֤י יְדַבֵּ֬ר שָׁל֗וֹם אֶל עַמּ֥/וֹ וְ/אֶל חֲסִידָ֑י/ו וְֽ/אַל יָשׁ֥וּבוּ לְ/כִסְלָֽה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/008.yaml
  text: I will hear what God Yahweh will speak[a], for he will speak peace to his people and to his faithful ones[b]; but let them not turn back to folly.
translation:
  language: ta
  text: கடவுளாகிய யாவே என்ன பேசுவார் என்பதை நான் கேட்பேன்[a]; ஏனெனில் அவர் தமது மக்களுக்கும் தமக்கு உண்மையுள்ளவர்களுக்கும் சமாதானம் பேசுவார். ஆனால் அவர்கள் மீண்டும் மதிகேட்டுக்குத் திரும்பாதிருக்கட்டும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு விதமாக: “கடவுளாகிய யாவே என்ன சொல்கிறார் என்பதை நான் கேட்பேன்.”'
    reason: காலம் மற்றும் வினைநுட்பத்தின் மாற்று மொழியாக்கம்.
  - marker: b
    text: '“மதிகேடு” என்பதற்கு “மூடத்தனம்” என்றும் மொழிபெயர்க்கலாம்; அரிதான மாற்றுப் புரிதல்: “தன்னம்பிக்கை.”'
    reason: כִּסְלָה என்ற சொல்லுக்கான சொற்பொருள் மாற்றுகள்.
lexical_decisions:
- source_word: אֶשְׁמְעָה
  choice: நான் கேட்பேன்
  rationale: க cohortative வடிவம் பேசுபவரின் உறுதியையோ நோக்கத்தையோ வெளிப்படுத்துகிறது; தமிழில் “நான் கேட்பேன்” என்பது அந்தத் தீர்மானத்தை இயல்பாகக் காக்கிறது.
- source_word: הָאֵל יְהוָה
  choice: கடவுளாகிய யாவே
  rationale: אֵל என்ற பொதுப்பெயரையும் יהוה என்ற தனிப்பட்ட இறைப்பெயரையும் இரண்டையும் காக்கும் இயல்பான தமிழாக்கம்.
- source_word: שָׁלוֹם
  choice: சமாதானம்
  rationale: அமைதி, நல்வாழ்வு, முழுமை ஆகிய பரந்த எபிரெயக் கருத்தைச் சுருக்காமல் தாங்கும் பரவலாக அறியப்பட்ட வேதாகமத் தமிழ் சொல்.
- source_word: חֲסִידָיו
  choice: தமது உண்மையுள்ளவர்கள்
  rationale: உடன்படிக்கை சார்ந்த பற்றுறுதியையும் இறைப்பற்றையும் குறிக்கிறது; “பரிசுத்தவான்கள்” எனும் பிற்காலத் தொழில்நுட்பப் பொருளைத் தேவையின்றி இறக்குமதி செய்யாது.
- source_word: וְאַל יָשׁוּבוּ
  choice: ஆனால் அவர்கள் மீண்டும் ... திரும்பாதிருக்கட்டும்
  rationale: אַל உடன் வரும் imperfect தடை அல்லது வேண்டுகோள் சார்ந்த வலிமையைக் கொண்டது; சாதாரண எதிர்காலக் கூற்றாக மாற்றப்படவில்லை.
- source_word: לְכִסְלָה
  choice: மதிகேட்டுக்கு
  rationale: כִּסְלָה என்பதன் வழக்கமான “மூடத்தனம்/மதிகேடு” என்ற பொருளையும் தவறான நடத்தைக்குத் திரும்பும் எச்சரிக்கையையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா / கர்த்தர்
  rationale: மூலத்தில் உள்ள உடன்படிக்கைப் பெயரை ஒரு பொதுப்பட்டமாக மாற்றாமல் ஒலிபெயர்த்துக் காக்கிறது.
- issue: חֲסִידָיו என்பவர்களின் அடையாளம்
  choice: தமது உண்மையுள்ளவர்கள்
  alternative: தமது பரிசுத்தவான்கள் / இறைப்பற்றுள்ளவர்கள்
  rationale: உடன்படிக்கைப் பற்றுறுதியை முன்னிறுத்தி, குறிப்பிட்ட திருச்சபை மரபின் தொழில்நுட்பப் பொருளைச் சுமத்தாமல் உள்ளது.
- issue: இறுதிக் கூற்றின் வலிமை
  choice: 'தடை/வேண்டுகோள்: “திரும்பாதிருக்கட்டும்”'
  alternative: 'முன்னறிவிப்பு: “திரும்பமாட்டார்கள்”'
  rationale: אַל + imperfect அமைப்பு தடைசார்ந்த jussive பொருளை வலுவாக ஆதரிக்கிறது; சமாதான வாக்குக்கும் மீண்டும் வழுவாதிருக்க வேண்டிய பொறுப்புக்கும் இடையிலான பதற்றம் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமும் வாசிப்புத் தெளிவும் காக்கப்பட்டுள்ளன. “தமது” என்பது இறைவனைக் குறிக்கும் உடைமையைத் தெளிவாக்குகிறது. இறுதி எச்சரிக்கையின் தடைநிலை மென்மையாக்கப்படாமல் வைக்கப்பட்டுள்ளது; அனைத்து அடிக்குறி குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
