  rationale: 'Two small revisions improve source precision and modern Tamil idiom: ''சமாதானம் பேசுவார்'' follows the Hebrew ''speak peace'' without specifying an announcement, and ''தமக்கு உண்மையுள்ளவர்களுக்கு'' naturally expresses the God-directed loyalty implied by חֲסִידָיו. The cohortative, divine name, and prohibitive final clause are retained.'
