lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்காக
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை அல்லது வழிநடத்துதலைப் பொறுப்பேற்றவரைக் குறிக்கும் மரபுச் சொல். முன்னொட்டு לַ־ இங்கு நோக்கம் அல்லது ஒப்படைப்பு என்ற பொருளில் ‘-க்காக’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לִבְנֵי
  choice: மகன்களுடையது
  rationale: לְ முன்னொட்டு உரிமை, தொடர்பு அல்லது அர்ப்பணிப்பைக் குறிக்கலாம். ‘மகன்களுடையது’ என்பது கோராகின் மகன்களோடு உள்ள தொடர்பை இயல்பாகக் காட்டுகிறது; அதன் துல்லியமான தன்மையை அடிக்குறிப்பு திறந்த நிலையில் வைக்கிறது.
- source_word: קֹרַח
  choice: கோராகு
  rationale: எபிரெயத் தனிப்பெயரின் வழக்கமான தமிழ் ஒலிபெயர்ப்பு; உரையில் வேற்றுமை உருபுடன் ‘கோராகின்’ என வருகிறது.
- source_word: מִזְמוֹר
  choice: ஒரு சங்கீதம்
  rationale: இசையோடு தொடர்புடைய பாடல்வகையைச் சுட்டும் நிலையான தலைப்புச் சொல்; நவீன தமிழ் வேதாகம நடையில் தெளிவான ‘சங்கீதம்’ பயன்படுத்தப்பட்டுள்ளது.
