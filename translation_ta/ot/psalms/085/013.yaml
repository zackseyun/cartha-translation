id: PSA.85.13
reference: Psalms 85:13
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: צֶ֭דֶק לְ/פָנָ֣י/ו יְהַלֵּ֑ךְ וְ/יָשֵׂ֖ם לְ/דֶ֣רֶךְ פְּעָמָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/013.yaml
  text: Righteousness will go before him and will make a path for his steps.
translation:
  language: ta
  text: 'நீதி அவருக்கு முன்பாகச் செல்லும்;

    அது அவருடைய அடிகளுக்குப் பாதை அமைக்கும்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶדֶק
  choice: நீதி
  rationale: இச்சூழலில் ஆளுருவாக்கப்பட்ட ‘நீதி’ என்பதைக் குறிக்கும் இயல்பான, நேரடியான தமிழ் சொல்.
- source_word: לְפָנָיו יְהַלֵּךְ
  choice: அவருக்கு முன்பாகச் செல்லும்
  rationale: எபிரெய உரையின் இடத்தொடர்பையும் எதிர்காலச் செயற்பாட்டையும் தெளிவாகப் பாதுகாக்கிறது.
- source_word: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו
  choice: அது அவருடைய அடிகளுக்குப் பாதை அமைக்கும்
  rationale: יָשֵׂם என்பதன் ‘அமைத்தல்/உருவாக்குதல்’ பொருளையும், פְּעָמָיו என்பதன் ‘அவருடைய அடிகள்’ என்ற பொருளையும் காக்கிறது; ‘அவருடைய அடிகளை ஒரு வழியாக்கும்’ என்ற மாற்று இலக்கணப் புரிதலைவிட இங்கு சூழலுக்கு இயல்பான வாசிப்பைத் தருகிறது.
theological_decisions:
- issue: ‘நீதி’ ஆளுருவாக்கப்பட்ட செயற்பாட்டாளராக வருவது
  choice: இரண்டாம் அடியில் ‘அது’ என்று ‘நீதி’யையே எழுவாயாகத் தொடருதல்
  alternative: மறைமுகமாக இறைவனை எழுவாயாகக் கொள்ளுதல்
  rationale: எபிரெய உரையில் வெளிப்படையான புதிய எழுவாய் இல்லை; முதல் அடியின் ‘நீதி’ இயல்பாகத் தொடர்கிறது. இதனால் கவிதையின் ஆளுருவாக்கமும் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைத்தன்மையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘அடிகள்’ என்பது காலடிச்சுவடுகள் அல்ல, நடையின் படிகள் என்ற பொருளில் பயன்படுத்தப்பட்டுள்ளது.
