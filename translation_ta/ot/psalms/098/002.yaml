  text: הוֹדִ֣יעַ יְ֭הוָה יְשׁוּעָת֑/וֹ לְ/עֵינֵ֥י הַ֝/גּוֹיִ֗ם גִּלָּ֥ה צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/002.yaml
  text: Yahweh has made his salvation known[b][a]; before the eyes of the nations he has revealed his righteousness.
translation:
  language: ta
  text: யாவே தமது மீட்பைத் தெரியப்படுத்தியிருக்கிறார்; நாடுகளின் கண்களுக்கு முன்பாக[a] தமது நீதியை[b] வெளிப்படுத்தியிருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘நாடுகளின் பார்வையில்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘தமது நியாயத்தை.’ எபிரெயச் சொல் சூழலுக்கேற்ப நீதி, நியாயம், அல்லது ஒருவரின் நேர்மையை மெய்ப்பித்தல் ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய வடிவத்தின் ஏற்ற தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הוֹדִיעַ
  choice: தெரியப்படுத்தியிருக்கிறார்
  rationale: ידע என்பதன் ஹிஃபில் வடிவிலுள்ள ‘அறியச் செய்தல்’ என்ற காரணவினைப் பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְשׁוּעָתוֹ
  choice: தமது மீட்பை
  rationale: יְשׁוּעָה என்பது மீட்பு, விடுதலை, வெற்றி ஆகிய பொருட்களைத் தரக்கூடும்; இச்சங்கீதத்தின் சூழலில் இறைவனுடைய காப்புச் செயலை இயல்பாகவும் விரிவாகவும் ‘மீட்பு’ தெரிவிக்கிறது.
- source_word: לְעֵינֵי
  choice: கண்களுக்கு முன்பாக
  rationale: ‘கண்களுக்கு முன்/பார்வையில்’ என்ற எபிரெய மரபுத்தொடரின் காட்சித் தன்மையைத் தக்கவைக்கிறது.
- source_word: הַגּוֹיִם
  choice: நாடுகள்
  rationale: இங்கு இஸ்ரவேலுக்கு அப்பாலுள்ள மக்களினங்களையும் நாடுகளையும் பொதுவாகக் குறிக்கிறது; ‘புறவினத்தார்’ என்பதைவிட ‘நாடுகள்’ சூழலுக்கு இயல்பானது.
- source_word: גִּלָּה
  choice: வெளிப்படுத்தியிருக்கிறார்
  rationale: பியேல் வடிவின் ‘மறைந்திருந்ததை வெளிப்படுத்துதல்’ என்ற பொருளைத் தருவதோடு, முதல் அடியிலுள்ள ‘தெரியப்படுத்தினார்’ என்பதுடன் இணைநிலையையும் பேணுகிறது.
- source_word: צִדְקָתוֹ
  choice: தமது நீதியை
  rationale: צְדָקָה என்பதிலுள்ள நேர்மை, நீதிநிலை, நியாயம் ஆகிய பரப்பை ‘நீதி’ சுருக்கமாகத் தாங்குகிறது; ‘நியாயம்’ என்ற சூழல்சார் மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: மீட்புச் சூழலில் இறைவனுடைய צִדְקָה என்பதன் மொழிபெயர்ப்பு
  choice: தமது நீதி
  alternative: தமது நியாயம்
  rationale: இறைவனுடைய மீட்புச் செயலுடன் அவருடைய சரியானதும் உண்மையானதுமான செயற்பாட்டை வசனம் இணைக்கிறது. ‘நீதி’ அதன் அறநெறி, உடன்படிக்கை உண்மை, நியாயம் ஆகிய பரந்த பதற்றத்தைச் சுருக்காமல் பேணுகிறது; ‘நியாயம்’ சாத்தியமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. இறைவனைக் குறிக்கும் இடங்களில் மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது; எபிரெய இணைநிலையும் ‘கண்களுக்கு முன்பாக’ என்ற காட்சிமிக்க மரபுத்தொடரும் பேணப்பட்டுள்ளன. அடிக்குறிப்பு குறிகள் அவை விளக்கும் சொற்றொடர்களுக்குப் பின் வைக்கப்பட்டுள்ளன.
