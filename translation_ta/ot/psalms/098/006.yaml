id: PSA.98.6
reference: Psalms 98:6
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: בַּ֭/חֲצֹ֣צְרוֹת וְ/ק֣וֹל שׁוֹפָ֑ר הָ֝רִ֗יעוּ לִ/פְנֵ֤י הַ/מֶּ֬לֶךְ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/006.yaml
  text: With trumpets and the sound of the horn[a], raise a shout before the King, Yahweh.
translation:
  language: ta
  text: 'எக்காளங்களோடும் கொம்பின் ஒலியோடும்[a]

    அரசரான யாவேக்கு முன்பாக ஆர்ப்பரியுங்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “செம்மறியாட்டுக் கடாவின் கொம்பின் ஒலியோடும்.” எபிரெயச் சொல் שׁוֹפָר பல இடங்களில் செம்மறியாட்டுக் கடாவின் கொம்பைத் தனிப்படக் குறிக்கிறது; இது இவ்வசனத்தின் தொடக்கத்தில் கூறப்படும் எக்காளங்களிலிருந்து வேறுபட்டது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲצֹצְרוֹת
  choice: எக்காளங்களோடும்
  rationale: חֲצֹצְרוֹת என்பது שׁוֹפָר என்பதிலிருந்து வேறுபட்ட, பொதுவாக நேரான உலோக ஊதுகருவிகளைக் குறிக்கிறது. ב கருவியைக் குறிக்கும் பொருளில் ‘-ஓடும்’ என மொழிபெயர்க்கப்பட்டது; மூலத்தில் இல்லாத ‘வெள்ளி’ சேர்க்கப்படவில்லை.
- source_word: וְקוֹל שׁוֹפָר
  choice: கொம்பின் முழக்கத்தோடும்
  rationale: קוֹל என்பது ஒலி அல்லது முழக்கம்; שׁוֹפָר என்பது பொதுவாக விலங்கின் கொம்பால் செய்யப்பட்ட ஊதுகருவி, பல இடங்களில் ஆட்டுக்கடாவின் கொம்பு. ‘கொம்பு’ என்பது முன் வரும் உலோக எக்காளங்களுடனான சொல்வேறுபாட்டைக் காக்கிறது.
- source_word: הָרִיעוּ
  choice: ஆர்ப்பரியுங்கள்
  rationale: רוע என்பதன் ஹிஃபில் பன்மை ஏவல்வடிவம் உரத்த வெற்றிமுழக்கம் அல்லது கொண்டாட்ட ஆரவாரத்தை எழுப்பும்படி அழைக்கிறது. ‘ஆர்ப்பரியுங்கள்’ என்பது மகிழ்ச்சியை மூலத்தில் இல்லாதவாறு வெளிப்படையாகச் சேர்க்காமல் இப்பொருளை இயல்பாகத் தருகிறது.
- source_word: לִפְנֵי
  choice: முன்பாக
  rationale: இச்சொல் ‘முன்னிலையில்’ அல்லது ‘முன்பாக’ என்னும் இட-உறவுப் பொருளைக் கொண்டது; இங்கு ‘முன்பாக’ சுருக்கமாகவும் இயல்பாகவும் உள்ளது.
- source_word: הַמֶּלֶךְ
  choice: அரசராகிய
  rationale: திட்டவட்டமான ‘அரசர்’ என்ற பட்டம் உடனே யாவேயை அடையாளப்படுத்துகிறது. ‘அரசராகிய யாவே’ என்பது எபிரெயச் சொல்வரிசையின் உடன்பெயர்ச்சித் தொடர்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கெழுத்துத் திருப்பெயர் பட்டப்பெயரால் மாற்றப்படாமல், தமிழில் பரவலாகப் புரியக்கூடிய ஒலிபெயர்ப்பாக ‘யாவே’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: யெகோவா; கர்த்தர்
  rationale: மூலம் தனிப்பட்ட இறைப்பெயரை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டப்பெயரால் மாற்றாமல் ஒலிபெயர்த்தோம்.
- issue: ‘அரசர்’ என்பதற்கும் யாவே என்பதற்கும் உள்ள தொடர்பு
  choice: அரசராகிய யாவே
  alternative: அரசரான யாவே; அரசர், யாவே; யாவே என்னும் அரசர்
  rationale: הַמֶּלֶךְ יְהוָה என்பது இயல்பாக உடன்பெயர்ச்சியாக இருந்து யாவேயை அரசர் என்று அடையாளப்படுத்துகிறது. தேர்ந்த வடிவம் அதைப் பொருள் தெளிவுடன் இயல்பான தமிழில் தருகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்குரிய கண்ணியமும் ஓசைநயமும் காக்கப்பட்டுள்ளன. ‘எக்காளம்’ மற்றும் ‘கொம்பு’ என்ற இரு வேறு ஊதுகருவிப் பெயர்கள் மூலத்தின் சொல்வேறுபாட்டைத் தக்கவைக்கின்றன; வரிப்பிரிப்பு கவிதை வடிவை ஆதரிக்கிறது.
