  choice: ஆறுகள்
  rationale: பன்மைச் சொல் நேரடியாக ஆறுகளைக் குறிக்கிறது; படைப்பனைத்தும் துதிக்கும் கவித்துவக் காட்சிக்கு இது இயல்பாகப் பொருந்துகிறது.
- source_word: יִמְחֲאוּ כָף
  choice: கைகொட்டட்டும்
  rationale: מחא כף என்பது கைகளைத் தட்டுதல் என்ற மரபுத்தொடர்; தமிழில் ‘கைகொட்டுதல்’ அதன் பொருளையும் படைப்பின் ஆளுருவகத்தையும் இயல்பாகத் தருகிறது.
- source_word: יַחַד
  choice: ஒன்றாக
  rationale: மலைகள் ஒருமித்த மகிழ்ச்சியுடன் பாடும் காட்சியை ‘ஒன்றாக’ தெளிவாகப் பாதுகாக்கிறது.
- source_word: הָרִים
  choice: மலைகள்
  rationale: சொல்லின் நேரடிப் பொருள் ‘மலைகள்’; ‘குன்றுகள்’ என மொழிபெயர்ப்பது காட்சியின் பிரமாண்டத்தைக் குறைக்கலாம்.
- source_word: יְרַנֵּנוּ
  choice: மகிழ்ந்து பாடட்டும்
  rationale: Piel வடிவிலுள்ள רנן மகிழ்ச்சிப் பாடலையோ களிப்பாரவாரத்தையோ குறிக்கலாம்; முதன்மை உரையில் ‘மகிழ்ந்து பாடட்டும்’ என்பது கொண்டாட்ட உணர்வையும் கவிதை இணைப்பையும் இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: படைப்பு துதிப்பதில் இடம்பெறும் கவித்துவ ஆளுருவகம்
  choice: ‘ஆறுகள் கைகொட்டட்டும்; மலைகள் ... பாடட்டும்’ என்ற ஆளுருவகத்தை நேரடியாகத் தக்கவைத்தல்
  alternative: இயற்கை மனிதர்களைத் துதிக்கத் தூண்டுகிறது என்ற அருவமான உருவகமாக விளக்குதல்
  rationale: எபிரெய உரை ஆறுகளையும் மலைகளையும் துதியில் பங்கேற்பவையாக நேரடியாகச் சித்தரிக்கிறது; அதைத் தக்கவைப்பது மேலதிக இறையியல் கருத்துகளைப் புகுத்தாமல் கவித்துவ வலிமையைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிதில் புரியும், கவித்துவமும் கண்ணியமும் கொண்ட நடை. எபிரெய இணை அமைப்பையும் அறிவுறுத்தல்/விருப்ப வினை உணர்வையும் ‘-ட்டும்’ வடிவங்கள் காக்கின்றன. יְרַנֵּנוּ என்பதிலுள்ள ‘பாடுதல்/களிப்பாரவாரம் செய்தல்’ என்ற உண்மையான பொருள் விரிவை முதன்மை உரை ‘மகிழ்ந்து பாடட்டும்’ என்ற வடிவில் போதுமான அளவு தக்கவைக்கிறது; ஆகவே தவறாக இணைக்கப்பட்ட ஆங்கில அடிக்குறிப்பைச் சேர்க்கவில்லை.
