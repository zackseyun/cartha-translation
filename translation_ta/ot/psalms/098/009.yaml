  text: before Yahweh[a], for he comes to judge the earth; he will judge the world with righteousness[e][d][c][b], and the peoples with equity.
translation:
  language: ta
  text: 'யாவேவின்[a] முன்னிலையில்;


    ஏனெனில், பூமியை நியாயந்தீர்க்க அவர் வருகிறார்[b].


    அவர் உலகத்தை நீதியோடு,


    மக்களினங்களைச் சமநீதியோடு நியாயந்தீர்ப்பார்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘YHWH’ என்ற இறைப்பெயர்; ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: alternative_reading
  - marker: b
    text: அல்லது, ‘பூமியை நியாயந்தீர்க்க அவர் வரவிருக்கிறார்.’ கவிதைச் சூழலில் இவ்வெபிரெய வினைவடிவம் நெருங்கிய அல்லது உறுதியான செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: முன்னிலையில்
  rationale: ‘முன்பாக’ அல்லது ‘சந்நிதியில்’ என்ற இடம்–உறவு சார்ந்த பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: எபிரெய தனிப்பெயரான நான்கெழுத்துத் திருப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בָא
  choice: வருகிறார்
  rationale: கவிதைச் சூழலில் உறுதியான அல்லது நெருங்கிய செயலைக் குறிக்கக்கூடிய வடிவத்தின் உயிரோட்டத்தைப் பாதுகாக்கிறது; காலநிலையை அளவுக்கு மீறித் தீர்மானிக்கவில்லை.
- source_word: לִשְׁפֹּט / יִשְׁפֹּט
  choice: நியாயந்தீர்க்க / நியாயந்தீர்ப்பார்
  rationale: ஆளுதல், நீதி நிலைநாட்டுதல் ஆகிய பரந்த நிழற்பொருள்களை முற்றிலும் நீக்காமல், இச்சூழலின் நீதித்துறை சார்ந்த மையப்பொருளை நேரடியாகத் தருகிறது.
- source_word: הָאָרֶץ
  choice: பூமி
  rationale: ‘உலகம்’ மற்றும் ‘மக்களினங்கள்’ என்பவற்றோடு இணையாக வருவதால், உள்ளூர் ‘நாடு’ என்பதற்குப் பதிலாக உலகளாவிய பரப்பைக் காட்டுகிறது.
- source_word: תֵּבֵל
  choice: உலகம்
  rationale: குடியிருக்கும் உலகம் என்ற அடிப்படை நுண்பொருளை இயல்பான, சுருக்கமான தமிழில் தருகிறது.
- source_word: בְּצֶדֶק
  choice: நீதியோடு
  rationale: அவரது தீர்ப்பின் ஒழுக்க மற்றும் நீதிசார் தன்மையை முறையைக் குறிக்கும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: עַמִּים
  choice: மக்களினங்கள்
  rationale: தனித்தனி மனிதக் குழுக்களைக் குறிக்கும் எபிரெயப் பன்மையைப் பாதுகாக்கிறது; அரசியல் நாடுகள் என்று மட்டும் குறுக்கவில்லை.
- source_word: בְּמֵישָׁרִים
  choice: நேர்மையோடு
  rationale: செம்மை, பாரபட்சமின்மை, சமநீதி ஆகிய நீதித்துறை நுண்பொருள்களை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யெகோவா
  alternative: கர்த்தர்; யாவே
  rationale: மூலத்தில் பட்டப்பெயர் அல்ல, தனிப்பெயர் உள்ளது. ஆகவே அதை மறைக்காமல் தமிழில் பரவலாக அறியப்பட்ட ஒலிபெயர்ப்பில் தரப்பட்டுள்ளது; [a] மாற்று ஒலிபெயர்ப்பைக் குறிப்பிடுகிறது.
- issue: שׁפט என்பதிலுள்ள இறைத்தீர்ப்பின் நுண்பொருள்
  choice: நியாயந்தீர்
  alternative: ஆளு; நீதி நிலைநாட்டு
  rationale: கண்டனம் மட்டுமோ நிர்வாகம் மட்டுமோ எனப் பொருளைக் குறுக்காமல், பொறுப்புக்கூறலும் சரியான ஒழுங்கை நிலைநாட்டுதலும் அடங்கிய நீதித்தீர்ப்பின் பதற்றத்தைப் பாதுகாக்கிறது.
- issue: בָא என்பதன் காலநிலை
  choice: வருகிறார்
  alternative: வரவிருக்கிறார்; வந்துள்ளார்
  rationale: எபிரெய நிறைவுவடிவம் கவிதையில் நெருங்கிய அல்லது உறுதியான நிகழ்வைக் குறிக்கலாம். நிகழ்கால வடிவம் அந்த உயிரோட்டத்தைத் தக்கவைத்து, கடந்த அல்லது எதிர்காலம் என்று மிகையாக முடிவுசெய்வதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதக் கவிதையின் இணை அமைப்பை வரி முறிப்புகள் மூலம் காக்கிறது. மரியாதை ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன. ‘நியாயந்தீர்’ என்பது வேதாகமத் தமிழ் மரபுடன் தொடர்புடையதாக இருந்தாலும் இன்றைய வாசகருக்கும் புரியும் வகையில் உள்ளது; ‘மக்களினங்கள்’ என்பது עַמִּים என்ற பன்மையைத் தெளிவாகக் காக்கிறது.
