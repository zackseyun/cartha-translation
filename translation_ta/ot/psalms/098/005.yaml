lexical_decisions:
- source_word: זַמְּרוּ
  choice: புகழ் பாடுங்கள்
  rationale: זמר என்பதன் பியெல் கட்டளை வடிவம் இசையோடு புகழ்ந்து பாடும்படி அழைக்கிறது. ‘புகழ் பாடுங்கள்’ என்பது பாடுதல், இசை, புகழ்ச்சி ஆகிய கூறுகளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ முன்னொட்டு பாடலின் நோக்குநரைச் சுட்டுகிறது; יהוה என்ற இறைப் பெயர் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
- source_word: בְּכִנּוֹר
  choice: யாழுடன்
  rationale: בְ இங்கு கருவியைக் குறிக்கும் ‘உடன்’ என்ற பொருளில் வருகிறது. כִּנּוֹר பழங்கால நரம்பிசைக் கருவி; தமிழில் எளிதில் புரியும் அண்மையான சொல்லாக ‘யாழ்’ பயன்படுத்தப்பட்டு, துல்லிய வரலாற்றுத் தன்மை அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: בְּכִנּוֹר
  choice: யாழுடனும்
  rationale: எபிரேயக் கவிதையின் ஒலிநயத்தையும் வலியுறுத்தலையும் காக்க, கருவியின் பெயர் இரண்டாம் முறையும் விடாமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וְקוֹל זִמְרָה
  choice: பாடலின் ஓசையுடனும்
  rationale: קוֹל என்பது ‘குரல்/ஓசை’ என்றும் זִמְרָה என்பது ‘பாடல்/இன்னிசை’ என்றும் பொருள்படும். ‘பாடலின் ஓசை’ என்பது அந்த இணைப்பையும் கேட்கும் அனுபவத்தையும் இயல்பான தமிழில் காக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரையில் நான்கெழுத்து இறைப் பெயர் நேரடியாக உள்ளது. பொதுப்பட்டப் பெயராக மாற்றாமல் உடன்படிக்கையின் தனிப்பெயரைத் தக்கவைக்க ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்குரிய கண்ணியமும் கவிதைச் சுருக்கமும் காக்கப்பட்டுள்ளன. மூலத்தில் இரண்டாம் பாதியில் வினைச்சொல் மறைந்திருந்தாலும், தமிழில் வரி தனியே இயல்பாக நிறைவடைய ‘பாடுங்கள்’ மீண்டும் இடப்பட்டுள்ளது; கருவியின் மறுபதிப்பு அப்படியே தக்கவைக்கப்பட்டுள்ளது.
