  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/000.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have brought him salvation.
translation:
  language: ta
  text: 'ஒரு சங்கீதம்.


    யாவேக்குப் புதிய பாடலைப் பாடுங்கள்;

    ஏனெனில் அவர் வியத்தகு செயல்களைச் செய்திருக்கிறார்.

    அவருடைய வலக்கரமும் அவருடைய பரிசுத்த புயமும்

    அவருக்காக மீட்பைச் சாதித்தன.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவரைக் காப்பாற்றின” அல்லது “அவருக்கு வெற்றியைப் பெற்றுத் தந்தன.” எபிரெயச் சொற்றொடர், யாவேயின் சொந்த வல்லமையே மீட்பை அல்லது வெற்றியை நிகழ்த்தியது என்பதைக் கூறுகிறது.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: ஒரு சங்கீதம்
  rationale: இது பாடலின் தலைப்பாக நிற்கும் எபிரெயச் சொல்லை, தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் அறியப்பட்ட முறையில் தருகிறது.
- source_word: יהוה
  choice: யாவே
  rationale: மூலத்தில் உள்ள இறைநாமத்தைப் பொதுப்பெயரான ‘கர்த்தர்’ என்று மாற்றாமல், அதன் வழக்கமான அறிஞர்சார் ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: שִׁיר חָדָשׁ
  choice: புதிய பாடல்
  rationale: ‘புதிய’ என்பதையும் ‘பாடல்’ என்பதையும் நேரடியாகவும் இயல்பாகவும் பிரதிபலிக்கிறது.
- source_word: נִפְלָאוֹת
  choice: வியத்தகு செயல்கள்
  rationale: அற்புதமான, வியப்பூட்டும் செயல்கள் என்ற பொருளை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: יְמִינוֹ וּזְרוֹעַ קָדְשׁוֹ
  choice: அவருடைய வலக்கரமும் அவருடைய பரிசுத்த புயமும்
  rationale: இறைவனுடைய வல்லமையையும் செயற்பாட்டையும் உருவகப்படுத்தும் இரண்டு உடல்-உருவகங்களையும் சுருக்காமல் காக்கிறது.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: அவருக்காக மீட்பைச் சாதித்தன
  rationale: வினையின் மீட்பு/வெற்றி சார்ந்த பொருளையும் לּוֹ-வின் ‘அவருக்காக/அவருக்கு’ என்ற கூறையும் காக்கும் அதேவேளையில், தமிழில் செயற்பாட்டின் விளைவைத் தெளிவாகச் சொல்கிறது.
theological_decisions:
- issue: הוֹשִׁיעָה לּוֹ என்பதன் மீட்பு அல்லது வெற்றி நயம்
  choice: அவருக்காக மீட்பைச் சாதித்தன
  alternative: அவருக்கு வெற்றியைப் பெற்றுத் தந்தன / அவரைக் காப்பாற்றின
  rationale: எபிரெயச் சொற்றொடர் மீட்பையும் வெற்றியையும் குறிக்கக்கூடும். முதன்மை உரை ‘மீட்பு’ என்ற அடிப்படை இறையியல் நயத்தை வைத்திருக்கிறது; அடிக்குறிப்பு உண்மையான மாற்று வாசிப்புகளைக் காட்டுகிறது. ‘அவரைக் காப்பாற்றின’ என்பது לּוֹ-வை நேரடி செயப்படுபொருளாகத் தெளிவுபடுத்திவிடக்கூடும் என்பதால் முதன்மை உரையில் தவிர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இணை அமைப்பைத் தெளிவாகக் காட்ட வரிப் பிரிப்பு செய்யப்பட்டுள்ளது. இறைநாமம் பொதுப்பெயராக மாற்றப்படாமல் ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
