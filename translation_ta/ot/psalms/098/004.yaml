  yaml_path: translation/ot/psalms/098/004.yaml
  text: Shout joyfully to Yahweh[a], all the earth[b]; break forth and sing for joy and make music.
translation:
  language: ta
  text: முழுப் பூமியே, யாவேக்கு மகிழ்ச்சியுடன் ஆர்ப்பரியுங்கள்; வெடித்தெழுந்து, மகிழ்ச்சியுடன் பாடி, இசை எழுப்புங்கள்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִיעוּ
  choice: மகிழ்ச்சியுடன் ஆர்ப்பரியுங்கள்
  rationale: ரוע என்பதன் ஹிஃபில் கட்டளைவடிவம் இங்கு துதியில் எழுப்பப்படும் களிப்பாரவாரத்தைக் குறிக்கிறது. இந்தத் தமிழ் வடிவம் கட்டளையின் வலிமையையும் மகிழ்ச்சியின் தன்மையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: לְ முன்னொட்டு ஆர்ப்பரிப்பு யாரை நோக்கி எழுப்பப்படுகிறதோ அதைக் குறிக்கிறது; יהוה என்ற தனிப்பெயர் ஒலிபெயர்ப்பாக வழங்கப்படுகிறது.
- source_word: כָּל הָאָרֶץ
  choice: பூமியெங்கும் உள்ளவர்களே
  rationale: சங்கீதத்தின் உலகளாவிய அழைப்பில் אֶרֶץ என்பது உள்ளூர் நாட்டை அல்ல, முழுப் பூமியையும் குறிக்கிறது. எபிரெயச் சொற்றொடரின் விளிப்புப் பயன்பாட்டைத் தமிழில் இயல்பாகத் தெளிவுபடுத்துகிறது.
- source_word: פִּצְחוּ
  choice: களிப்பொலி எழுப்பி
  rationale: פצח திடீரெனக் குரலெழுப்பி களிப்பை வெளிப்படுத்தும் படிமத்தைக் கொண்டது. அடுத்துவரும் பாடல் மற்றும் இசை வினைகளோடு இயல்பாக இணைய இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְרַנְּנוּ
  choice: மகிழ்ந்து பாடி
  rationale: רן என்பதன் பியேல் வடிவம் களிப்பான முழக்கத்தையோ மகிழ்ச்சிப் பாடலையோ குறிக்கலாம்; கவிதைத் தொடரில் முதற்கட்ட ஆர்ப்பரிப்பிலிருந்து வேறுபடுத்தி பாடலின் கருத்தை வெளிப்படுத்துகிறது.
- source_word: וְזַמֵּרוּ
  choice: இசை முழக்குங்கள்
  rationale: זמר துதிப்பாடலையும் இசையோடு பாடுவதையும் குறிக்கக்கூடும். 'இசை முழக்குங்கள்' என்பது அதன் இசைசார் பரப்பையும் இறுதிக் கட்டளையின் உயர்வையும் தக்கவைக்கிறது.
theological_decisions:
- issue: יהוה என்ற இறைநாமத்தை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலவசனம் நான்கு எழுத்துகளைக் கொண்ட இறைநாமத்தை நேரடியாகப் பயன்படுத்துவதால், பொதுப்பட்டமாக மாற்றாமல் தனிப்பெயராக ஒலிபெயர்க்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகருக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய மொழியின் தொடர்ச்சியான பன்மைக் கட்டளைகள் தமிழில் ஓசைமிக்க ஒரே அழைப்பாக அமைக்கப்பட்டுள்ளன.
