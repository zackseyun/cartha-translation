base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/003.yaml
  text: He has remembered his steadfast love and his faithfulness to the house of Israel[a]; all the ends of the earth have seen the salvation of our God.
translation:
  language: ta
  text: அவர் இஸ்ரவேல் வீட்டாருக்கான தமது மாறாத அன்பையும் நம்பகத்தன்மையையும் நினைவுகூர்ந்தார்; பூமியின் எல்லைகள் அனைத்தும் நம் கடவுளின் மீட்பை[a] கண்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நம் கடவுளின் இரட்சிப்பை”; சங்கீதச் சூழலில், எபிரெயச் சொல் வெற்றிகரமான காப்பாற்றும் செயலையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַר
  choice: நினைவுகூர்ந்தார்
  rationale: Qal perfect 3ms. இறைவன் தமது உடன்படிக்கை சார்ந்த அன்பையும் உண்மைத்தன்மையையும் செயலில் நினைவுகூர்ந்தார் என்ற எபிரெய வினையின் நேரடியான பொருளைப் பாதுகாக்கிறது.
- source_word: חַסְדּוֹ
  choice: தமது மாறாத அன்பை
  rationale: חֶסֶד என்பதிலுள்ள நிலையான, உறவுசார், உடன்படிக்கை உணர்வை இயல்பான நவீன தமிழில் தருகிறது; அதை வெறும் இரக்கமாகக் குறுக்கவில்லை.
- source_word: וֶאֱמוּנָתוֹ
  choice: உண்மைத்தன்மையையும்
  rationale: இங்கு אֱמוּנָה என்பது חֶסֶד என்பதற்கு இணையாக நம்பகத்தன்மையையும் உறுதியான விசுவாசத்தையும் குறிக்கிறது; ‘உண்மை’ என்ற கருத்தியல் பொருளைவிட ‘உண்மைத்தன்மை’ உறவுசார் நுட்பத்தைச் சிறப்பாகக் காக்கிறது.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: இஸ்ரவேல் வீட்டாருக்கான
  rationale: לְ என்னும் முன்னிடைச்சொல்லின் தொடர்பு அல்லது நோக்கு உணர்வைப் பாதுகாத்து, ‘இஸ்ரவேலின் வீடு’ என்ற மரபுவழி சொல்லாக்கத்தை நவீன தமிழில் மக்களைக் குறிக்கும் ‘இஸ்ரவேல் வீட்டார்’ என இயல்பாக வழங்குகிறது.
- source_word: רָאוּ
  choice: கண்டன
  rationale: Qal perfect 3cp. நிறைவேறிய மீட்புச் செயலை உலகின் எல்லைகள் சாட்சியாகக் கண்டன என்ற சங்கீதப் புகழ்ச்சியின் காட்சியை நேரடியாகத் தருகிறது.
- source_word: כָל אַפְסֵי אָרֶץ
  choice: பூமியின் கடையெல்லைகளும்
  rationale: உலகின் மிகவும் தொலைவான பகுதிகள் அனைத்தையும் குறிக்கும் எபிரெய மரபுத்தொடரைச் சுருக்கமாகவும் சங்கீதத்திற்கேற்ற கண்ணியமான தமிழிலும் தருகிறது.
- source_word: אֵת
  choice: '[நேரடி செயப்படுபொருள் குறியீடு; தனியாக மொழிபெயர்க்கப்படவில்லை]'
  rationale: தமிழில் தனிச் சொல்லுக்கு நிகரில்லாத எபிரெய வேற்றுமைக் குறியீடு; ‘மீட்பை’ என்பதிலுள்ள ‘ஐ’ உருபால் அதன் இலக்கணப் பணி வெளிப்படுகிறது.
- source_word: יְשׁוּעַת
  choice: மீட்பை
  rationale: יְשׁוּעָה என்பதன் காப்பாற்றுதல் அல்லது விடுவித்தல் என்ற பரந்த பொருளை நவீன வாசகருக்குத் தெளிவாகத் தருகிறது; சங்கீதச் சூழலில் உள்ள வெற்றிகரமான காப்பாற்றும் செயல் என்ற நுட்பத்தையும் விலக்கவில்லை.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுளின்
  rationale: יְשׁוּעַת אֱלֹהֵינוּ என்ற இணைப்பை ‘நம் கடவுளின் மீட்பு’ எனப் பாதுகாக்கிறது; அந்த மீட்பு அவருக்குரியதும் அவர் நிகழ்த்தியதுமாக இருக்கலாம் என்ற மூலமொழியின் உறவை தேவையின்றி மிகத் துல்லியப்படுத்தவில்லை.
theological_decisions:
- issue: חֶסֶד மற்றும் אֱמוּנָה ஆகியவற்றின் உடன்படிக்கை சார்ந்த நுட்பம்
  choice: ‘மாறாத அன்பு’ மற்றும் ‘உண்மைத்தன்மை’
  alternative: ‘இரக்கம்’ மற்றும் ‘உண்மை’
  rationale: தமது மக்களிடம் கடவுள் காட்டும் நிலையான அன்பையும் நம்பகத்தன்மையையும் இந்த இணைச்சொற்கள் வெளிப்படுத்துகின்றன. அவற்றை வெறும் உணர்ச்சியாகவோ கருத்தியல் உண்மையாகவோ குறுக்காமல், மூலத்தின் உறவுசார் இறையியல் அழுத்தத்தைப் பாதுகாக்கின்றன.
- issue: יְשׁוּעַת אֱלֹהֵינוּ என்பதன் பொருள் வரம்பு
  choice: ‘நம் கடவுளின் மீட்பு’
  alternative: ‘நம் கடவுளின் இரட்சிப்பு’ அல்லது ‘நம் கடவுளின் வெற்றி’
  rationale: எபிரெயச் சொல் காப்பாற்றுதல், விடுவித்தல், வெற்றிகரமான மீட்பு ஆகிய நுட்பங்களைத் தாங்கக்கூடும். ‘மீட்பு’ அதன் பரந்த பொருளைப் பாதுகாக்கிறது; அதை இராணுவ வெற்றியாக மட்டும் குறுக்கவில்லை. மாற்று நுட்பம் அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘இஸ்ரவேல் வீட்டார்’ என்பது மரபுவழி உருவகத்தைத் தக்கவைத்தபடி மக்களைக் குறிக்கும் இயல்பான வடிவம். அடிக்குறி அது விளக்கும் ‘மீட்பு’ என்ற சொல்லுக்குப் பின்னரே வைக்கப்பட்டுள்ளது.
