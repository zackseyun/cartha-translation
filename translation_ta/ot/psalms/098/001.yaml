  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/001.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have worked salvation for him.
translation:
  language: ta
  text: 'ஒரு சங்கீதம்.


    யாவேக்குப் புதிய பாடலைப் பாடுங்கள்;

    ஏனெனில் அவர் அதிசயமான செயல்களைச் செய்திருக்கிறார்.

    அவருடைய வலக்கரமும் பரிசுத்த புயமும்

    அவருக்கு வெற்றியைப் பெற்றுத்தந்தன.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது: “அவரை மீட்டன,” அல்லது “அவருக்காக மீட்பைச் சாதித்தன.” எபிரெயச் சொற்றொடர் இன்னும் சொல்லுக்கு நெருக்கமாக இவ்வாறு மொழிபெயர்க்கப்படலாம்; இங்கு யாவேயின் சொந்த வல்லமையே விடுதலையையும் வெற்றியையும் நிகழ்த்தியது என்பது பொருள்.'
    reason: הוֹשִׁיעָה לּוֹ என்ற எபிரெயச் சொற்றொடரின் உண்மையான சொற்பொருள் மாற்றுகளையும், இச்சூழலில் அதன் வெற்றி/விடுதலை சார்ந்த பொருளையும் பாதுகாக்கிறது.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: ஒரு சங்கீதம்
  rationale: இது பாடலின் வகையைக் குறிக்கும் தலைப்பு. ‘சங்கீதம்’ என்பது தமிழில் பரவலாக அறியப்பட்ட, தெளிவான இணைச்சொல்.
- source_word: שִׁירוּ
  choice: பாடுங்கள்
  rationale: பன்மை முன்னிலை ஏவலை நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; ‘துதித்துப் பாடுங்கள்’ போன்ற விளக்கச் சேர்க்கையைத் தவிர்க்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: தெய்வீகப் பெயரான יהוה-ஐ பெயராகவே ஒலிபெயர்த்து, ל முன்னொட்டு காட்டும் பாடலின் நோக்குநரைத் தமிழின் நான்காம் வேற்றுமையால் குறிக்கிறது.
- source_word: שִׁיר חָדָשׁ
  choice: புதிய பாடல்
  rationale: எபிரெயக் கவிதைத் தொடரைத் தெளிவாகவும் இயல்பாகவும் தக்கவைக்கிறது.
- source_word: נִפְלָאוֹת עָשָׂה
  choice: அதிசயமான செயல்களைச் செய்திருக்கிறார்
  rationale: נפלאות என்பது வியப்பூட்டும் செயல்களைக் குறிக்கிறது. நிறைவுற்ற செயல்களின் தற்போதைய முக்கியத்துவத்தை ‘செய்திருக்கிறார்’ வெளிப்படுத்துகிறது.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: அவருக்கு வெற்றியைப் பெற்றுத்தந்தன
  rationale: சொல்லுக்கு நெருக்கமாக ‘அவருக்காக மீட்பைச் சாதித்தன’ என மொழிபெயர்க்கலாம்; இச்சூழலில் யாவேயின் சொந்த வல்லமை விடுதலை அல்லது வெற்றியை நிகழ்த்தியதை இயல்பான தமிழில் இத்தொடர் தெரிவிக்கிறது. மூலத்தின் மாற்று வாய்ப்புகள் அடிக்குறிப்பில் பாதுகாக்கப்படுகின்றன.
- source_word: יְמִינוֹ
  choice: அவருடைய வலக்கரம்
  rationale: வல்லமையையும் செயலாற்றலையும் குறிக்கும் மனித உருவகத்தை நேரடியாகத் தக்கவைக்கிறது.
- source_word: וּזְרֹעַ קָדְשׁוֹ
  choice: பரிசுத்த புயம்
  rationale: ‘வலக்கரம்’ என்பதற்கு இணையான கவித்துவ உருவகத்தைப் பாதுகாக்கிறது; קָדְשׁוֹ-வின் இயல்பான தமிழ் வடிவம்.
theological_decisions:
- issue: יהוה என்ற தெய்வீகப் பெயரின் மொழியாக்கம்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் உள்ள தனிப்பட்ட தெய்வீகப் பெயரை பொதுப்பட்டமாக மாற்றாமல், தமிழில் உச்சரிக்க ஏற்றவாறு ஒலிபெயர்க்கிறது.
- issue: הוֹשִׁיעָה לּוֹ என்பதன் பொருள்
  choice: அவருக்கு வெற்றியைப் பெற்றுத்தந்தன
  alternative: அவரை மீட்டன; அவருக்காக மீட்பைச் சாதித்தன
  rationale: இறைவனுக்கு வேறொருவர் மீட்பு அளித்தார் என்ற தவறான எண்ணத்தைத் தவிர்த்து, அவருடைய சொந்த வலக்கரமும் பரிசுத்த புயமும் விடுதலை அல்லது வெற்றியை நிகழ்த்தின என்ற கவித்துவப் பொருளைத் தெரிவிக்கிறது; அதேவேளை மூலத்தின் சொற்பொருள் சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. எபிரெய இணைவடிவைப் பாதுகாக்க வரிகள் பிரிக்கப்பட்டுள்ளன. ‘புயம்’ கவிதைநடைக்கு ஏற்றதாகவும் தமிழில் அறியப்பட்டதாகவும் இருப்பதால் தக்கவைக்கப்பட்டுள்ளது; மிகப் பழமையான வாக்கிய அமைப்புகள் தவிர்க்கப்பட்டுள்ளன.
