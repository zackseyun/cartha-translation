translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பாகவும் கண்ணியமான கவிதைநடையிலும் வடிவமைக்கப்பட்டது. எபிரெயக் கவிதையின் இணை அமைப்பைத் தெளிவாக்க இரண்டாம் வரியிலும் ‘முழங்கட்டும்’ சேர்க்கப்பட்டுள்ளது; எந்தக் கோட்பாட்டுச் சிறப்புரையும் இறக்குமதி செய்யப்படவில்லை.
