  text: יִרְעַ֣ם הַ֭/יָּם וּ/מְלֹא֑/וֹ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/007.yaml
  text: Let the sea roar[a], and all that fills it[b], the world and those who dwell in it.
translation:
  language: ta
  text: கடலும் அதில் நிறைந்துள்ள அனைத்தும், உலகமும் அதில் குடியிருப்போரும் முழங்கட்டும்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְעַם
  choice: முழங்கட்டும்
  rationale: רעם என்பது உரத்த முழக்கத்தை அல்லது இடிமுழக்கம் போன்ற ஓசையை எழுப்புவதைக் குறிக்கிறது. துதிப் பாடலின் சூழலில் இந்த முற்றுப்பெறா வினையின் விருப்பவுணர்வைத் தமிழில் இயல்பாகக் காட்ட ‘முழங்கட்டும்’ என மொழிபெயர்க்கப்பட்டது. எபிரெயில் வினை ஒருமையில் இருந்தாலும், தொடர்ச்சியாக வரும் இரு இணை எழுவாய்களுக்கும் கவிதைநடையில் பொருந்தும் வகையில் தமிழில் வினை மீண்டும் சேர்க்கப்பட்டது.
- source_word: הַיָּם
  choice: கடல்
  rationale: יָם என்பதற்கான நேரான, வழக்கமான தமிழ் இணை ‘கடல்’; கவிதைச் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: וּמְלֹאוֹ
  choice: அதில் நிறைந்துள்ள அனைத்தும்
  rationale: מְלֹא மற்றும் மூன்றாம் ஆண்பால் ஒருமை பின்னொட்டு சொற்பட ‘அதன் நிறைவு’ எனப் பொருள்படும்; இங்கு கடலில் உள்ள அல்லது அதை நிரப்பியுள்ள அனைத்தையும் குறிக்கிறது. ‘அதில் நிறைந்துள்ள அனைத்தும்’ என்பது அந்தப் பொருளை இயல்பான தமிழில் காக்கிறது.
- source_word: תֵּבֵל
  choice: உலகம்
  rationale: תֵּבֵל குடியிருக்கும் ஒழுங்கமைந்த உலகைக் குறிக்கிறது. அடுத்துள்ள ‘அதில் குடியிருப்போர்’ என்ற சொற்றொடர் குடியிருக்கும் உலகம் என்ற நுண்ணுணர்வை வெளிப்படுத்துவதால் ‘உலகம்’ என்பது சுருக்கமான, இயல்பான தெரிவாகும்.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: அதில் குடியிருப்போர்
  rationale: இந்தப் பங்கேற்பு வடிவம் சொற்பட ‘அதில் குடியிருப்பவர்கள்’ என்று பொருள்படும். ‘அதில் குடியிருப்போர்’ என்பது அதன் வினைசார் நுண்ணுணர்வையும் உயர்ந்த கவிதைநடையையும் காக்கிறது.
