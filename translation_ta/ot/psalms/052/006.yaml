translation:
  language: ta
  text: ஆனால் கடவுள் உன்னை என்றென்றும் இடித்துத் தள்ளுவார்; அவர் உன்னைப் பற்றியெடுத்து, உன் கூடாரத்திலிருந்து அகற்றுவார்; வாழ்வோரின் நாட்டிலிருந்து உன் வேரைப் பிடுங்குவார். சேலா.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “சேலா” என்பதன் துல்லியமான பொருளும் இசை அல்லது வழிபாட்டில் அதன் செயல்பாடும் உறுதியாகத் தெரியவில்லை.
    reason: textual_or_literary_clarification
lexical_decisions:
- source_word: גַּם
  choice: ஆனால் ...
  rationale: இது அடிப்படையில் ‘மேலும்/உண்மையாகவே’ என்ற பொருள் தருகிறது; முந்தைய வசனத்தின் தீயவனுடைய பெருமைக்கு எதிரான திருப்பத்தைத் தமிழில் ‘ஆனால்’ இயல்பாக வெளிப்படுத்துகிறது. தொடர்ந்து வரும் தீர்ப்புச் செயல்களின் கூடுதல் வலிமை வாக்கிய அமைப்பில் புலப்படுகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கே இஸ்ரவேலின் கடவுளைக் குறிக்கும் பொதுவான ஒருமை இறைப்பெயர்; நவீன பொதுத் தமிழில் இயல்பான தேர்வு.
- source_word: יִתָּצְךָ
  choice: உன்னை ... இடித்துத் தள்ளுவார்
  rationale: נתץ என்பது கட்டிடத்தை இடிப்பதுபோன்ற ‘இடித்தல்/தகர்த்தல்’ படிமத்தைக் கொண்டது. ஒருவர்மீது பயன்படுத்தப்பட்டுள்ள வன்மையான அழிவுப் படிமத்தை இத்தேர்வு காக்கிறது.
- source_word: לָנֶצַח
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவான தன்மையே இங்கு முதன்மையான பொருள்; வெறும் ‘முற்றிலும்’ என்ற தீவிரப் பொருளாக மட்டுப்படுத்தப்படவில்லை.
- source_word: יַחְתְּךָ
  choice: உன்னைப் பிடுங்கி
  rationale: அரிதான חתה வினை இங்கு வலுக்கட்டாயமாகப் பற்றியெடுத்து அகற்றுவதைக் குறிக்கிறது. ‘பிடுங்கி’ என்பது அதன் திடீர் வன்மையையும் அடுத்த வினையுடனான தொடர்பையும் இயல்பாகத் தருகிறது.
- source_word: וְיִסָּחֲךָ
  choice: இழுத்தெறிவார்
  rationale: נסח என்பது இழுத்து அகற்றுதல் அல்லது பிடுங்குதல். கூடாரத்திலிருந்து வலுக்கட்டாயமாக வெளியேற்றும் செயலை ‘இழுத்தெறிவார்’ தெளிவாகக் காட்டுகிறது.
- source_word: מֵאֹהֶל
  choice: உன் கூடாரத்திலிருந்து
  rationale: אהל என்பதன் நேரடிப் பொருளான ‘கூடாரம்’ பாதுகாக்கப்படுகிறது; அது குடியிருப்பைக் குறிக்கும் உருவகப் பயன்பாடாகவும் இருக்கலாம்.
- source_word: וְשֵׁרֶשְׁךָ
  choice: உன் வேரைப் பிடுங்கிப்போடுவார்
  rationale: எபிரெயத்தில் இது சொல்லளவில் ‘உன் வேர்’ என்ற பெயர்ச்சொல் அமைப்பு; முன் வினைகளின் தொடர்ச்சியால் அகற்றும் செயல் மறைந்துள்ளது. தமிழில் வேர்ப்படிமத்தையும் பொருளையும் தெளிவாகக் காக்கிறது.
- source_word: מֵאֶרֶץ חַיִּים
  choice: வாழ்வோரின் நாட்டிலிருந்து
  rationale: இது மரணத்திற்கு மாறாக உயிரோடு இருப்போரின் உலகத்தைக் குறிக்கும் எபிரெய மரபுத்தொடர். ‘வாழ்வோரின் நாடு’ அதன் கவிதைத் தன்மையைத் தக்கவைக்கிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான செயல்பாடு உறுதியற்றதால் பொருள் ஊகிக்காமல் ஒலிபெயர்க்கப்படுகிறது.
