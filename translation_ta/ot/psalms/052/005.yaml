  text: வஞ்சக நாவே, விழுங்கும் சொற்கள் அனைத்தையும் நீ விரும்பினாய்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வஞ்சக நாவே, அழிவை உண்டாக்கும் சொற்கள் அனைத்தையும் நீ விரும்பினாய்.”
    reason: בָלַע என்பதன் ‘விழுங்குதல்’ என்ற உருவகத்திற்குப் பதிலாக அதன் அழிவுப் பொருளை வெளிப்படையாகத் தரும் மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: நீ விரும்பினாய்
  rationale: Qal perfect, இரண்டாம் நபர் ஆண்பால் ஒருமை. கவிதைநடைக் குற்றச்சாட்டில் எபிரெய நிறைநிலையை இயல்பான தமிழ் இறந்தகாலமாகத் தருகிறது; ‘விரும்பு’ என்பது அன்புகொள்/நேசி என்பதைக் காட்டிலும் தீய பேச்சின்மீதான நாட்டத்தை இங்கு இயல்பாகக் குறிக்கிறது.
- source_word: כָל דִּבְרֵי
  choice: சொற்கள் அனைத்தையும்
  rationale: כָל மற்றும் דִּבְרֵי ஆகியவை சேர்ந்து முழுமையைக் குறிக்கின்றன. ‘எல்லா சொற்களையும்’ என்பதும் சாத்தியம்; ‘சொற்கள் அனைத்தையும்’ என்பது தமிழில் கவிதைத் தொனியுடன் இயல்பாக உள்ளது.
- source_word: בָלַע
  choice: விழுங்கும்
  rationale: ‘விழுங்குதல்/விழுங்கிவிடுதல்’ என்ற மூல உருவகத்தைப் பாதுகாக்கிறது. வெறுமனே ‘அழிவை உண்டாக்கும்’ என்று மொழிபெயர்ப்பது அதன் தெளிவான அழிவுப் பொருளைக் காட்டினாலும், எபிரெயச் சொல்லின் உயிருள்ள உருவகத்தை மங்கச் செய்யும்.
- source_word: לְשׁוֹן מִרְמָה
  choice: வஞ்சக நாவே
  rationale: ‘வஞ்சகத்தின் நாவு’ என்ற சொற்சொற் கட்டமைப்பை இயல்பான தமிழ் விளிப்பாகத் தருகிறது. ‘நாவு’ என்ற உடல் உறுப்பின் உருவகம் பேச்சைக் குறிக்கும் கவிதை வலிமையைப் பாதுகாக்கிறது.
