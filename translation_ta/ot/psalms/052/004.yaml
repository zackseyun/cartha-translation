id: PSA.52.4
reference: Psalms 52:4
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: אָהַ֣בְתָּ רָּ֣ע מִ/טּ֑וֹב שֶׁ֓קֶר מִ/דַּבֵּ֖ר צֶ֣דֶק סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/004.yaml
  text: You have loved evil more than good[a], falsehood more than speaking righteousness. Selah
translation:
  language: ta
  text: நன்மையைவிடத் தீமையையும், நேர்மையாகப் பேசுவதைவிடப் பொய்மையையும் நீ நேசித்தாய்.[a] சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “சரியானதைப் பேசுவதைவிடப் பொய்யை.”
    reason: שֶׁקֶר என்பதை ‘பொய்’ என்றும், דַּבֵּר צֶדֶק என்பதை ‘சரியானதைப் பேசுதல்’ என்றும் நேரடியான மாற்றாக மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: நீ நேசித்தாய்
  rationale: אהב என்பதன் Qal perfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம்; தீயவனை நேரடியாகக் குற்றஞ்சாட்டும் இறந்தகால வினையாகத் தமிழில் இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: רָּע
  choice: தீமை
  rationale: טוֹב (‘நன்மை’) என்பதற்கு எதிராக வருவதால், ஒழுக்கநெறி சார்ந்த ‘தீமை’ என்ற பொருள் சூழலுக்கு மிகவும் பொருந்துகிறது.
- source_word: מִטּוֹב
  choice: நன்மையைவிட
  rationale: விருப்பம் அல்லது ஒப்பீட்டைக் குறிக்கும் מן முன்னிடைச்சொல்லின் வலிமையை ‘-விட’ என்ற ஒப்பீட்டு அமைப்பு நேரடியாகத் தருகிறது.
- source_word: שֶׁקֶר
  choice: பொய்மை
  rationale: தனி ஒரு பொய்யை மட்டும் அல்லாமல் பொய்யான பேச்சின் தன்மையையும் குறிக்கும் அருவப்பொருள் பெயராக இருப்பதால் ‘பொய்மை’ தேர்ந்தெடுக்கப்பட்டுள்ளது.
- source_word: מִדַּבֵּר
  choice: பேசுவதைவிட
  rationale: இரண்டாவது מן ஒப்பீட்டையும் விருப்பத்தையும் குறிக்கிறது; எபிரெய வினை வடிவம் தமிழில் தொழிற்பெயர் அமைப்பாக இயல்பாக வழங்கப்பட்டுள்ளது.
- source_word: צֶדֶק
  choice: நீதியானதை
  rationale: பொய்மைக்கு எதிரான நேர்மையான, சரியான பேச்சைக் குறிக்கிறது; ‘நீதி’ என்ற முக்கிய சொல்லின் ஒழுக்கவியல் நிறையைத் தக்கவைத்தபடி தமிழில் பேசப்படக்கூடிய பொருளாக இயல்பாக்கப்பட்டுள்ளது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இசை அல்லது வழிபாட்டு பயன்பாட்டைக் கொண்டிருக்கக்கூடிய இச்சொல்லின் துல்லியமான பொருள் உறுதியற்றதால் மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: צֶדֶק என்பதன் மொழிபெயர்ப்பு
  choice: நீதியானதை
  alternative: சரியானதை / நேர்மையானதை
  rationale: இங்கு பொய்மையோடு உள்ள எதிரிணை காரணமாக நேர்மையான அல்லது சரியான பேச்சே முதன்மை; அதேவேளை צֶדֶק சொல்லின் ஒழுக்கவியல் மற்றும் இறையியல் நிறையை முற்றிலும் குறைக்காமல் ‘நீதியானதை’ என வழங்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கவிதைநயமும் காக்கப்பட்டுள்ளன. எபிரெய மூலத்தின் இரண்டு இணையான ஒப்பீடுகளும் ‘-விட’ அமைப்பால் தெளிவாக வைக்கப்பட்டுள்ளன; ‘சேலா’ பொருள் உறுதியற்ற வழிபாட்டு/இசைக் குறியீடாக ஒலிபெயர்க்கப்பட்டுள்ளது.
