  text: אוֹדְ/ךָ֣ לְ֭/עוֹלָם כִּ֣י עָשִׂ֑יתָ וַ/אֲקַוֶּ֖ה שִׁמְ/ךָ֥ כִֽי ט֝֗וֹב נֶ֣גֶד חֲסִידֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/010.yaml
  text: I will give thanks to you forever[a], because you have done it; I will wait for your name, for it is good[c][b], in the presence of your faithful ones.
translation:
  language: ta
  text: நீர் இதைச் செய்ததால், நான் உமக்கு என்றென்றும் நன்றி செலுத்துவேன்; உமது பெயருக்காக நம்பிக்கையோடு காத்திருப்பேன்[a], ஏனெனில் உமக்கு உண்மையுள்ளவர்களின் முன்னிலையில் அது நல்லது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது பெயரில் நம்பிக்கை வைப்பேன்.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘ஏனெனில் உமது பெயர் நல்லது.’
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹדְךָ
  choice: நான் உமக்கு நன்றி செலுத்துவேன்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் நன்றி செலுத்துதல் அல்லது புகழ்தல் எனப் பொருள்படும். இங்கு கடவுளின் செயலுக்கான பதிலாக நன்றியுணர்வு முன்னிலைப்படுவதால் இத்தேர்வு பொருத்தமானது; புகழ்தலின் நிழற்பொருளும் முற்றிலும் நீங்கவில்லை.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவற்ற காலத்தை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: כִּי עָשִׂיתָ
  choice: நீர் இதைச் செய்ததால்
  rationale: முதல் כִּי காரணத்தை அறிமுகப்படுத்துகிறது. עשה பொதுவாக ‘செய்’ எனப் பொருள்படும்; தமிழில் இயல்பாக அமைய, சங்கீதத்தின் முந்தைய சூழலில் கூறப்பட்ட கடவுளின் தீர்மானமான செயலைச் சுட்டும் ‘இதை’ வெளிப்படையாகச் சேர்க்கப்பட்டுள்ளது.
- source_word: וַאֲקַוֶּה
  choice: நம்பிக்கையோடு காத்திருப்பேன்
  rationale: קוה என்பதில் ‘காத்திருத்தல்’ மற்றும் ‘நம்பிக்கை கொள்ளுதல்’ ஆகிய இரு கூறுகளும் உள்ளன. இரண்டையும் இணைப்பது எதிர்நோக்கும் நம்பிக்கையைத் தெளிவாகவும் இயல்பாகவும் தருகிறது.
- source_word: שִׁמְךָ
  choice: உமது பெயருக்காக
  rationale: ‘பெயர்’ என்பது கடவுளின் வெளிப்பட்ட இயல்பையும் புகழையும் குறிக்கும் எபிரெய வேதாகம வழக்கைத் தக்கவைக்கிறது. நேரடி பொருளின் அசாதாரணத் தன்மையை முற்றிலும் அழிக்காமல் தமிழில் எதிர்நோக்குதலைக் குறிக்க ‘-க்காக’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כִּי טוֹב
  choice: ஏனெனில் அது நல்லது
  rationale: எபிரெயச் சொற்றொடர் சுருக்கமாகவும் குறிப்புப் பொருள் ஓரளவு மறைமுகமாகவும் உள்ளது. ‘அது’ என்ற பதிலிப்பெயர் அந்தச் சுருக்கத்தையும், ‘நல்லது’ எதைச் சுட்டுகிறது என்ற இயல்பான இணைப்பையும் தக்கவைக்கிறது.
- source_word: נֶגֶד
  choice: முன்னிலையில்
  rationale: மற்றவர்களின் பார்வையிலும் சமூகச் சூழலிலும் நிகழ்வதைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ் வடிவம்.
- source_word: חֲסִידֶיךָ
  choice: உமக்கு உண்மையுள்ளவர்கள்
  rationale: חסיד என்பது உடன்படிக்கைச் சார்ந்த பற்றுறுதியும் பக்தியும் கொண்டவர்களைக் குறிக்கிறது. பிற்கால சமயத் தொழில்நுட்பப் பொருளைத் திணிக்காமல், அந்த உண்மைத்தன்மையை அணுகத்தக்க தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: חֲסִידֶיךָ என்ற உடன்படிக்கைச் சமூகச் சொல்லின் மொழிபெயர்ப்பு
  choice: உமக்கு உண்மையுள்ளவர்கள்
  alternative: உமது பக்தர்கள்; உமது பரிசுத்தவான்கள்
  rationale: இச்சொல் கடவுளிடம் பற்றுறுதியுள்ள மக்களைச் சுட்டுகிறது. ‘பரிசுத்தவான்கள்’ என்பது பிற்காலத் தொழில்நுட்ப சமயப் பொருளைத் தூண்டக்கூடும்; ‘பக்தர்கள்’ என்பது உடன்படிக்கை உண்மைத்தன்மையின் கூறை மங்கச் செய்யக்கூடும்.
- issue: טוֹב என்பதன் மறைமுக எழுவாய்
  choice: அது நல்லது
  alternative: உமது பெயர் நல்லது
  rationale: எபிரெயம் எழுவாயை வெளிப்படையாக மீண்டும் கூறவில்லை. முதன்மை உரை அந்தச் சுருக்கத்தையும் சிறிய தெளிவின்மையையும் காக்கிறது; அடிக்குறிப்பு அதிகம் வெளிப்படுத்தப்பட்ட வாசிப்பை வழங்குகிறது.
- issue: קוה மற்றும் ‘பெயர்’ இடையிலான அசாதாரண இணைப்பு
  choice: உமது பெயருக்காக நம்பிக்கையோடு காத்திருப்பேன்
  alternative: உமது பெயரில் நம்பிக்கை வைப்பேன்
  rationale: முதன்மை உரை ‘காத்திருத்தல்’ என்ற மூல வினையின் உருவகத்தைத் தக்கவைத்தபடியே அதன் நம்பிக்கை சார்ந்த பொருளைத் தெளிவாக்குகிறது. மாற்று வாசிப்பு இயல்பானதாக இருந்தாலும் காத்திருக்கும் கூறைச் சுருக்குகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான வழிபாட்டு நடை பயன்படுத்தப்பட்டுள்ளது. கடவுளைக் குறிக்க ‘நீர்/உமது’ என்ற மரியாதை ஒருமை வடிவங்கள் தரப்பட்டுள்ளன. எபிரெயத்தின் சுருக்கமும் இறையியல் நிறையும் காக்கப்பட்டுள்ளன; ஆனால் ‘காத்திருத்தல்/நம்பிக்கை’ என்ற இரட்டை நிழற்பொருள் சாதாரண வாசகருக்குத் தெளிவாகச் சொல்லப்பட்டுள்ளது.
