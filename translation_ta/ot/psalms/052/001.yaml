  yaml_path: translation/ot/psalms/052/001.yaml
  text: when Doeg the Edomite came and told Saul[a], saying to him, “David has come to the house of Ahimelech.”
translation:
  language: ta
  text: ஏதோமியனான தோவேக் வந்து, “தாவீது அகிமெலேக்கின் வீட்டிற்கு வந்திருக்கிறான்[a]” என்று சவுலிடம் தெரிவித்தபோது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தாவீது அகிமெலேக்கின் வீட்டிற்கு வந்தான்.” பிறர் கூறிய செய்திக்குள் வரும் எபிரேய வினைமுற்றை எளிய இறந்தகாலமாகவோ, அப்போதும் தொடர்புடையதாகவோ மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹוא
  choice: வந்து ... தெரிவித்தபோது
  rationale: בְּ + வினையெச்சப் பெயர் இங்கு காலத்தைக் குறிக்கும் துணைவாக்கியத்தை அறிமுகப்படுத்துகிறது; தமிழில் இயல்பான ‘வந்து ... தெரிவித்தபோது’ என்ற அமைப்பு அந்தப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: דּוֹאֵג הָאֲדֹמִי
  choice: ஏதோமியனான தோவேகு
  rationale: இன அல்லது பூர்விக அடையாளத்தைக் குறிக்கும் הָאֲדֹמִי என்பதையும், தனிப்பெயரையும் நவீனத் தமிழில் இயல்பாகப் பதிக்கிறது.
- source_word: וַיַּגֵּד לְשָׁאוּל וַיֹּאמֶר לוֹ
  choice: சவுலிடம் ... என்று அவனிடம் தெரிவித்தபோது
  rationale: נגד என்பதன் Hiphil வடிவம் ‘தெரிவித்தல்/அறிவித்தல்’ எனப் பொருள்படும். וַיֹּאמֶר לוֹ அறிக்கையின் நேரடிக் கூற்றை அறிமுகப்படுத்துவதால், தமிழில் ‘என்று அவனிடம் தெரிவித்தான்’ என்ற ஒருங்கிணைந்த அமைப்பு மறுபடியும் சொல்லப்படுவதைத் தவிர்த்து மூலப் பொருளைப் பாதுகாக்கிறது.
- source_word: בָּא
  choice: வந்திருக்கிறான்
  rationale: அறிக்கைக்குள் வரும் Qal perfect நிறைவுற்ற செயலின் அப்போதைய தொடர்பை உணர்த்தலாம்; ‘வந்திருக்கிறான்’ அந்த நுணுக்கத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֶל בֵּית אֲחִימֶלֶךְ
  choice: அகிமெலேக்கின் வீட்டிற்கு
  rationale: אֶל இயக்கத்தின் இலக்கையும் בֵּית இச்சூழலில் அகிமெலேக்கின் வீட்டையும் குறிக்கின்றன; இடத்தைக் குறிக்கும் வாசிப்பே கதைச் சூழலுக்கு ஏற்றது.
