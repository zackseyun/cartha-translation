lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத்தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்த்துதலை வழிநடத்தும் தலைவருக்கான அறிவுறுத்தலைக் குறிக்கிறது. ‘இசைத்தலைவருக்கு’ என்பது அதன் இசைசார் பணியையும் எபிரெய முன்னிடைச்சொல்லின் திசை/ஒதுக்கீட்டுப் பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: சங்கீதத் தலைப்புகளில் இது ஒரு இலக்கிய அல்லது இசை வகைப்பெயராகத் தோன்றினாலும், அதன் துல்லியமான பொருள் உறுதியில்லை. ஆகவே ‘போதனைச் சங்கீதம்’ போன்ற விளக்கப் பொருளை மூலவாசகத்துக்குள் திணிக்காமல் எபிரெயச் சொல்லை ஒலிபெயர்த்துள்ளோம்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: இங்குள்ள לְ என்னும் முன்னிடைச்சொல் ஆசிரியத்துவம், அர்ப்பணம், உடைமை அல்லது தொடர்பைக் குறிக்கலாம். ‘தாவீதின்’ என்பது இவற்றுள் ஒன்றை மட்டும் தீர்மானிக்காமல் சுருக்கமாக அமைந்துள்ளது.
theological_decisions:
- issue: לְדָוִד என்பதில் குறிக்கப்படும் ஆசிரியத்துவம் அல்லது தொடர்பு
  choice: ‘தாவீதின்’ என்று நடுநிலையாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தாவீது இயற்றியது’ அல்லது ‘தாவீதுக்காக’
  rationale: எபிரெயத் தலைப்பு தாவீதே இதை இயற்றினார் என்று சந்தேகமின்றி கூறுவதில்லை. எனவே ஆசிரியத்துவத்தை உறுதிப்படுத்தவோ அர்ப்பணிப்பாக மட்டும் வரையறுக்கவோ செய்யாமல் மூலத்தின் தெளிவின்மை காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான சங்கீதத் தலைப்பாக வடிவமைக்கப்பட்டுள்ளது. அறியப்படாத தொழில்நுட்பச் சொல் தமிழெழுத்தில் ஒலிபெயர்க்கப்பட்டு அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது; ‘தாவீதின்’ என்ற வடிவம் மூலத்தின் பலவாய்ப்பைத் திறந்தே வைக்கிறது.
