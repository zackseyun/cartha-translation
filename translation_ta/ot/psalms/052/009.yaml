base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
translation:
  language: ta
  text: நானோ, கடவுளின் இல்லத்தில் செழித்து வளரும் ஒலிவ மரத்தைப்போல்[a] இருக்கிறேன்; கடவுளின் மாறாத அன்பில்[b] என்றென்றைக்கும் நம்பிக்கை வைத்திருக்கிறேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘பசுமையான ஒலிவ மரத்தைப்போல்’ அல்லது ‘தழைத்த ஒலிவ மரத்தைப்போல்’ என்றும் மொழிபெயர்க்கலாம். எபிரெயப் பெயரடை பசுமையான உயிர்த்துடிப்பையும் செழிப்பையும் வலியுறுத்துகிறது.
    reason: lexical_alternative
  - marker: b
    text: இங்கு ‘மாறாத அன்பு’ என்று மொழிபெயர்க்கப்பட்டுள்ள எபிரெயச் சொல் חֶסֶד (ஹெசெத்). இது கடவுளுடைய விசுவாசமான, நிலைத்த அன்பை அடிக்கடி குறிக்கிறது; ‘உடன்படிக்கை அன்பு,’ ‘இரக்கம்,’ அல்லது ‘அருளன்பு’ என்பன வேறு மொழிபெயர்ப்புகள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: நானோ
  rationale: தனிப்பட்ட சுட்டுப்பெயருடன் இணைந்துள்ள வாவ், முந்தைய சூழலில் வரும் தீயவனுக்கு எதிரான வேறுபாட்டை வலியுறுத்துகிறது. தமிழில் ‘நானோ’ அந்த முரண்பாட்டை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כְזַיִת רַעֲנָן
  choice: பசுமை செழிக்கும் ஒலிவ மரத்தைப்போல்
  rationale: כְ ஒப்புமையைக் குறிக்கிறது; זַיִת இங்கு மரத்தைக் குறிக்கிறது. רַעֲנָן வெறும் நிறத்தை அல்ல, பசுமையான உயிர்த்துடிப்பையும் செழிப்பையும் உணர்த்துவதால் இரு கூறுகளையும் இயல்பான தமிழில் இணைத்துள்ளோம்.
- source_word: בְּבֵית אֱלֹהִים
  choice: கடவுளின் இல்லத்தில்
  rationale: இது தேவாலயம் அல்லது பரிசுத்த இடம் சார்ந்த ‘கடவுளின் வீடு’ என்ற உருவகத்தைத் தக்கவைக்கிறது; ‘இல்லம்’ தற்காலத் தமிழில் கண்ணியமாகவும் இயல்பாகவும் உள்ளது.
- source_word: בָּטַחְתִּי
  choice: நம்பிக்கை வைத்திருக்கிறேன்
  rationale: எபிரெய நிறைநிலை வினை இங்கு கடந்த காலத்தில் தொடங்கி தற்போதும் நிலைத்திருக்கும் உறுதியான நம்பிக்கையை வெளிப்படுத்துகிறது.
- source_word: בְחֶסֶד
  choice: மாறாத பேரன்பில்
  rationale: חֶסֶד என்பது இரக்கம் மட்டுமல்லாமல், விசுவாசமானதும் நிலைத்திருப்பதுமான உறவுப்பூர்வ அன்பையும் குறிக்கிறது. ‘மாறாத பேரன்பு’ அந்த விரிவை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עוֹלָם וָעֶד
  choice: என்றென்றைக்கும்
  rationale: இரட்டைப் பதம் முடிவற்ற காலத்தை வலியுறுத்துகிறது; ‘என்றென்றைக்கும்’ தமிழில் அதன் தீவிரத்தையும் இயல்பையும் காக்கிறது.
theological_decisions:
- issue: חֶסֶד என்ற சொல்லின் உடன்படிக்கை சார்ந்த பொருள்
  choice: மாறாத பேரன்பு
  alternative: உடன்படிக்கை அன்பு; இரக்கம்; கிருபை
  rationale: சங்கீதக்காரரின் நம்பிக்கை கடவுளுடைய விசுவாசமான, நீடித்த அன்பில் வேரூன்றியிருப்பதை இத்தேர்வு காட்டுகிறது. அதேவேளையில், ஒரு குறிப்பிட்ட கோட்பாட்டு மரபின் சொல்லாட்சிக்குள் பொருளைச் சுருக்குவதையும் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, பொதுவாசகர்களுக்கு எளிதில் புரியும் தமிழ் பயன்படுத்தப்பட்டுள்ளது. கவிதை உருவகமும், முந்தைய வசனத்துடனான எதிர்மறை ஒப்புமையும், חֶסֶד சொல்லின் பொருள் செறிவும் தக்கவைக்கப்பட்டுள்ளன.
