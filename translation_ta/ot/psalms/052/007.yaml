source:
  edition: WLC
  text: וְ/יִרְא֖וּ צַדִּיקִ֥ים וְ/יִירָ֗אוּ וְ/עָלָ֥י/ו יִשְׂחָֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/007.yaml
  text: 'The righteous will see and fear[b][a], and they will laugh at him:'
translation:
  language: ta
  text: 'நீதிமான்கள் கண்டு அஞ்சுவார்கள்[a]; அவனை நோக்கிச் சிரிப்பார்கள்[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பயப்படுவார்கள்’; எபிரெயச் சொல் திகிலைக் குறிக்கலாம்; இச்சூழலில் கடவுளுடைய தீர்ப்பின் முன் ஏற்படும் பயபக்தியையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவனை ஏளனம் செய்வார்கள்’ அல்லது ‘அவனைப் பற்றி நகைப்பார்கள்.’ எபிரெய வினைச்சொல்லின் அடிப்படைப் பொருள் ‘சிரித்தல்’; இச்சூழல் ஏளனப் பொருளை உணர்த்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוּ
  choice: அதைக் கண்டு
  rationale: ראה என்பதன் நேரடியான காட்சிப் பொருளைத் தக்கவைக்கிறது. தமிழில் செயப்படுபொருள் வெளிப்படையாக இல்லாவிட்டாலும், முந்தைய சூழலில் கூறப்பட்ட தீர்ப்பைச் சுட்டுவதற்காக ‘அதை’ சேர்க்கப்பட்டுள்ளது.
- source_word: צַדִּיקִים
  choice: நீதிமான்கள்
  rationale: பெயர்ச்சொல்லாகப் பயன்படுத்தப்பட்ட பன்மை அடைமொழியின் அறநெறிசார் வகைப்பாட்டை இயல்பான, மரியாதையான தமிழில் தெரிவிக்கிறது.
- source_word: וְיִירָאוּ
  choice: அஞ்சுவார்கள்
  rationale: ירא என்பதில் உள்ள பயம், திகில், இறைத் தீர்ப்பின் முன் எழும் பயபக்தி ஆகிய சாத்தியங்களை முழுமையாக ஒரு பக்கமாகத் தீர்மானிக்காமல் தக்கவைக்கிறது.
- source_word: וְעָלָיו
  choice: அவனைப் பார்த்து
  rationale: שׂחק உடன் வரும் על, ஒருவரை நோக்கிச் சிரித்தல் அல்லது ஏளனம் செய்தல் என்னும் பொருளைக் கொண்டுள்ளது; ‘அவனைப் பார்த்து’ என்பது தமிழில் இயல்பாக இருந்து அடிப்படை உருவகத்தையும் காக்கிறது.
- source_word: יִשְׂחָקוּ
  choice: சிரிப்பார்கள்
  rationale: שׂחק என்பதன் அடிப்படைப் பொருளான ‘சிரி’ என்பதைத் தக்கவைக்கிறது; ஏளனத் தொனி சூழலால் உணரப்படுகிறது, ஆனால் முதன்மை உரையில் ‘கேலி செய்வார்கள்’ என்று மிகத் தெளிவாகத் தீர்மானிக்கப்படவில்லை.
theological_decisions:
- issue: தீர்ப்பைக் காணும் நீதிமான்களின் ‘அச்சம்’
  choice: அஞ்சுவார்கள்
  alternative: பயப்படுவார்கள்; பயபக்தி கொள்வார்கள்
  rationale: இங்கு நீதிமான்கள் இறைத் தீர்ப்பைக் காண்கிறார்கள். எபிரெயச் சொல் வெறும் திகிலையோ அல்லது வழிபாட்டுக்குரிய பயபக்தியையோ மட்டும் குறிக்கிறது என்று தீர்மானிக்காமல், இரண்டிற்குமிடையிலான இறையியல் அழுத்தத்தை ‘அஞ்சுவார்கள்’ தக்கவைக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்குரிய சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய இணைப்புச் சொற்களின் தொடரை இயல்பான தமிழ் அரைப்புள்ளியால் அமைத்து, எதிர்வினைகளின் வரிசை தெளிவாக்கப்பட்டுள்ளது.
