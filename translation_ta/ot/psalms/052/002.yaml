  terminology: “வலிமைமிக்கவனே” suitably conveys הַגִּבּוֹר, and “கடவுளின் மாறாத அன்பு” is an appropriate non-sectarian rendering of חֶסֶד אֵל. “நிலைத்திருக்கிறது” clearly expresses the implied predicate without overinterpreting it.
