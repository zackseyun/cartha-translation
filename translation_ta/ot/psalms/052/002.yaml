source:
  edition: WLC
  text: מַה תִּתְהַלֵּ֣ל בְּ֭/רָעָה הַ/גִּבּ֑וֹר חֶ֥סֶד אֵ֝֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/002.yaml
  text: Why do you boast in evil, mighty man? The steadfast love of God endures all day long.
translation:
  language: ta
  text: வலிமைமிக்கவனே, தீமையில் ஏன் பெருமை பாராட்டுகிறாய்? கடவுளின் மாறாத அன்பு நாள் முழுவதும் நிலைத்திருக்கிறது.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְהַלֵּל בְּרָעָה
  choice: தீமையைக் குறித்து பெருமைபாராட்டுகிறாய்
  rationale: התהלל என்பது தன்னைப் பெருமைப்படுத்துதல் அல்லது பெருமைபாராட்டுதல்; בְּרָעָה என்பது அந்தப் பெருமையின் பொருளைச் சுட்டுவதால், இயல்பான நவீன தமிழில் இவ்வாறு தரப்பட்டது.
- source_word: הַגִּבּוֹר
  choice: வலிமைமிக்கவனே
  rationale: גבור என்பதன் அடிப்படைப் பொருள் வலிமைமிக்கவன் அல்லது வீரன். இங்கு கேலியும் கண்டனமும் கலந்த நேரடி அழைப்பாக இருப்பதால் ‘வலிமைமிக்கவனே’ என மொழிபெயர்க்கப்பட்டது.
- source_word: חֶסֶד אֵל
  choice: கடவுளின் மாறாத அன்பு
  rationale: חסד என்பது சூழலின்படி உறுதியான, பற்றுமாறாத அன்பையும் அருளையும் குறிக்கும்; ‘மாறாத அன்பு’ அதன் உறவுசார் நிலைத்தன்மையை வெளிப்படுத்துகிறது.
- source_word: כָּל־הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: எபிரெயச் சொற்றொடரின் நேரடியான காலப்பொருளை இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: חֶסֶד אֵל כָּל־הַיּוֹם என்ற பெயர்ச்சொல் வாக்கியத்தின் பொருள்
  choice: கடவுளின் மாறாத அன்பு நாள் முழுவதும் நிலைத்திருக்கிறது
  alternative: கடவுளின் மாறாத அன்பு நாள் முழுவதும் இருக்கிறது
  rationale: மூலத்தில் வெளிப்படையான வினைச்சொல் இல்லை. தமிழில் முழுமையான வாக்கியத்திற்காக ‘நிலைத்திருக்கிறது’ சேர்க்கப்பட்டது; இது חסד என்பதிலுள்ள தொடர்ச்சியையும் ஆங்கில ஆலோசனை உரையின் பொருளையும் வெளிப்படுத்துகிறது, ஆனால் தனிப்பட்ட கோட்பாட்டைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்குரிய கண்ணியத்தையும் கூர்மையான கண்டனத் தொனியையும் பேணும் வகையில் அமைக்கப்பட்டது. வாசிப்புத் தெளிவுக்காக இயல்பான சொற்றொடர் பயன்படுத்தப்பட்டுள்ளது.
