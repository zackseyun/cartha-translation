theological_decisions:
- issue: הַגֶּבֶר என்ற ஆண்பால் ஒருமைச் சொல்லின் மொழிபெயர்ப்பு
  choice: மனிதன்
  alternative: நபர் / ஒருவன்
  rationale: மூலத்தில் ஆண்பால் ஒருமையில் சுட்டப்படும் பிரதிநிதித்துவ மனிதனை பாலினமற்ற சொல்லாக மாற்றாமல் பாதுகாக்கிறது.
- issue: הַוָּה என்பதன் பொருள்
  choice: அழிவு
  alternative: கேடு / தீய ஆசை / அழிவுத் திட்டங்கள்
  rationale: தவறான நம்பிக்கையின் அழிவுக்குரிய விளைவை இப்பொருள் நன்றாக வெளிப்படுத்தினாலும், எபிரெயச் சொல்லின் பொருள் விரிவு உறுதியற்றதால் மாற்றுப் பொருள்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: 'நவீனத் தரத் தமிழில், கவிதைக்குரிய கண்ணியத்தையும் சுட்டிக்காட்டும் கண்டனத் தொனியையும் காக்கும் நடை. வழங்கப்பட்ட WLC எபிரெய உரையே மொழிபெயர்ப்பின் முதன்மை ஆதாரமாகக் கொள்ளப்பட்டது. குறிப்பு: வழங்கப்பட்ட எபிரெய உரை பொதுவான ஆங்கில வசன எண்ணிக்கையில் சங்கீதம் 52:7 என்றும், தலைப்பையும் வசனங்களாக எண்ணும் எபிரெய மரபில் 52:9 என்றும் வழக்கமாகக் குறிக்கப்படுகிறது; பயனர் வழங்கிய PSA.52.8 என்ற அடையாளத்துடன் வசன எண்ணிக்கை ஒத்துப்போகவில்லை.'
