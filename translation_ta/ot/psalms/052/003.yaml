- source_word: עֹשֵׂה רְמִיָּה
  choice: வஞ்சகம் செய்கிறது
  rationale: வஞ்சகத்தைச் செயல்படுத்தும் தொடர்ச்சியான செயற்பாட்டைச் சுருக்கமாகக் காட்டுகிறது; இதன் இலக்கணத் தொடர்பிலுள்ள தெளிவின்மை அடிக்குறிப்பில் காக்கப்படுகிறது.
