translation:
  language: ta
  text: அழிவை நீ திட்டமிடுகிறாய்[a]; உன் நாவு கூராக்கப்பட்ட சவரக் கத்தியைப் போன்றது—வஞ்சகம் செய்கிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “அழிவை” என்பதற்கான எபிரேயச் சொல் பன்மையில், சொல்லுக்கு சொல் “அழிவுகள்” என்று உள்ளது; அழிவை உண்டாக்கும் தீங்கை அது தொகுப்பாகக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: “வஞ்சகம் செய்கிறது” என்பது நாவைக் குறிக்கலாம்; அல்லது பேசப்படுகிற மனிதனை, “வஞ்சகம் செய்பவனே” என்று குறிக்கலாம்.
    reason: lexical_alternative
