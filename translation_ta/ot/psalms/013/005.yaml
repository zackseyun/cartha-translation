  text: וַ/אֲנִ֤י בְּ/חַסְדְּ/ךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗/י בִּֽ/ישׁוּעָ֫תֶ֥/ךָ אָשִׁ֥ירָה לַ/יהוָ֑ה כִּ֖י גָמַ֣ל עָלָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
translation:
  language: ta
  text: ஆனால் நானோ, உமது மாறாத அன்பில் நம்பிக்கை வைத்திருக்கிறேன்; உமது மீட்பில்[a] என் உள்ளம் மகிழும். யாவேக்குப் பாடுவேன்; ஏனெனில் அவர் எனக்கு நன்மை செய்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “மீட்பு” என்பதற்கு “இரட்சிப்பு” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் தற்போதைய நெருக்கடியிலிருந்து விடுவிக்கப்படுவதையும், விரிவான பொருளில் இரட்சிப்பையும் குறிக்கக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: முந்தைய புலம்பலுடன் உள்ள முரண்பாட்டையும் வலியுறுத்தப்பட்ட தனிப்பெயர்ச்சொல்லையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בְּחַסְדְּךָ
  choice: உமது மாறாத அன்பில்
  rationale: חֶסֶד என்பதிலுள்ள கிருபைமிக்க, உறுதியான, பற்றுமாறாத அன்பின் கருத்தை எளிதாகவும் கண்ணியமாகவும் தருகிறது.
- source_word: בָטַחְתִּי
  choice: நம்பிக்கை வைத்திருக்கிறேன்
  rationale: எபிரெய நிறைவுவினை காட்டும் நிலைபெற்ற நம்பிக்கையையும் அதன் தற்போதைய தொடர்ச்சியையும் வெளிப்படுத்துகிறது.
- source_word: יָגֵל לִבִּי
  choice: என் உள்ளம் மகிழும்
  rationale: எதிர்பார்க்கப்படும் மீட்புக்கான வருங்கால மகிழ்ச்சியை இயல்பான தமிழில் கூறுகிறது; לֵב குறிக்கும் அகநிலையை ‘உள்ளம்’ நன்கு வெளிப்படுத்துகிறது.
- source_word: בִּישׁוּעָתֶךָ
  choice: உமது மீட்பில்
  rationale: உடனடியான நெருக்கடியிலிருந்து விடுவிக்கப்படுதல் என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது; விரிவான ‘இரட்சிப்பு’ பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אָשִׁירָה
  choice: பாடுவேன்
  rationale: விருப்பத்தையும் உறுதியான தீர்மானத்தையும் காட்டும் cohortative வடிவைச் சுருக்கமாகவும் இயல்பாகவும் வழங்குகிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற உடன்படிக்கைப் பெயரை பொதுப்பட்டமாக மாற்றாமல் பெயராகவே ஒலிபெயர்க்கிறது; தமிழின் நான்காம் வேற்றுமைக்கு ஏற்ப அமைக்கப்பட்டுள்ளது.
- source_word: כִּי גָמַל עָלָי
  choice: ஏனெனில் அவர் எனக்கு நன்மை செய்திருக்கிறார்
  rationale: பாடுவதற்கான காரணத்தையும், தேவன் ஒருவருக்கு நன்மையாகவும் நிறைவாகவும் நடந்துகொண்டார் என்ற எபிரெய மரபுத்தொடரின் பொருளையும் தெளிவான நவீன தமிழில் தருகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் வரும் தனிப்பட்ட உடன்படிக்கைப் பெயரைப் பொதுப்பட்டமாக மாற்றாமல் பாதுகாக்கிறது.
- issue: יְשׁוּעָה என்பதன் பொருள் வரம்பு
  choice: மீட்பு
  alternative: இரட்சிப்பு
  rationale: சங்கீதத்தின் உடனடி நெருக்கடியிலிருந்து காப்பாற்றப்படுதல் என்ற பொருளுக்கு ‘மீட்பு’ இயல்பாகப் பொருந்துகிறது; பரந்த இறையியல் பொருளை மறைக்காமல் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- issue: גָמַל עָלַי என்பதன் நன்மை சார்ந்த பொருள்
  choice: அவர் எனக்கு நன்மை செய்திருக்கிறார்
  alternative: அவர் எனக்கு நிறைவாக நன்மை செய்திருக்கிறார்
  rationale: செயலின் பயனுள்ள, அருள்மிக்க தன்மையைத் தெரிவிக்கிறது; ‘கைம்மாறு செய்தார்’ போன்ற பரிமாற்றம் அல்லது தகுதிக்கேற்ற பலன் என்ற எண்ணத்தைத் தவிர்க்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டுள்ளது. ‘உமது’ என்ற வடிவம் மரியாதையையும் கவிதைநடையையும் காக்கிறது; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
