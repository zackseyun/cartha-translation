  - marker: b
    text: அல்லது, “நான் தடுமாறுவதால்” அல்லது “நான் தள்ளாடுவதால்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: சொல்லாதபடிக்கும் … களிகூராதபடிக்கும்
  rationale: தடுக்கப்பட வேண்டிய எதிர்மறை விளைவை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் நோக்கத்தை இயல்பான தமிழில் இரு இணை வினைமுற்றுகளோடு வெளிப்படுத்துகிறது.
- source_word: אֹיְבִי
  choice: என் பகைவன்
  rationale: முதலாம் நபர் ஒருமை உரிமை விகுதியுடன் உள்ள ஒருமைச் சொல்லை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: יְכָלְתִּיו
  choice: நான் அவனை வென்றுவிட்டேன்
  rationale: יכל என்பதன் ‘மேற்கொள்ளுதல்/மேலோங்குதல்/வெல்லுதல்’ என்ற பொருளையும், முதலாம் நபர் எழுவாய் மற்றும் மூன்றாம் நபர் ஆண்பால் ஒருமை செயப்படுபொருளையும் தெளிவாகக் காக்கிறது.
- source_word: צָרַי
  choice: என் எதிரிகள்
  rationale: பன்மை வடிவத்தைப் பாதுகாப்பதோடு, முந்தைய ஒருமையான ‘பகைவன்’ என்பதிலிருந்து சொல் வேறுபாட்டையும் காட்டுகிறது.
- source_word: יָגִילוּ
  choice: களிகூர
  rationale: சாதாரண மகிழ்ச்சியை விட எதிரியின் வீழ்ச்சியில் வெளிப்படும் மிகுந்த உவகையை dignified, இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: כִּי
  choice: நிலைகுலைவதால்
  rationale: எதிரிகள் களிகூருவதற்கான காரணத்தை அறிமுகப்படுத்தும் காரணப் பொருளை ‘-ஆல்’ அமைப்பால் தருகிறது.
- source_word: אֶמּוֹט
  choice: நான் நிலைகுலைவதால்
  rationale: מוט என்பதன் நிபால் வடிவத்திலுள்ள அசைதல், தடுமாறுதல், உறுதிநிலை இழத்தல் ஆகிய பரப்பை, கட்டாயமாக உடல் சார்ந்த விழுதலாகக் குறுக்காமல் வெளிப்படுத்துகிறது.
