base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/002.yaml
  text: How long must I take counsel in my soul[b][a], with sorrow in my heart all day? How long will my enemy be exalted over me?
translation:
  language: ta
  text: எவ்வளவு காலம்தான் நான் எனக்குள் திட்டங்களை வகுத்து[a], நாள் முழுவதும் என் இதயத்தில் துயரத்தைக் கொண்டிருப்பேன்? எவ்வளவு காலம்தான் என் பகைவன் எனக்கு மேலாக உயர்ந்திருப்பான்?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எவ்வளவு காலம்தான் நான் எனக்குள் ஆலோசனைகளை அமைத்து, நாள் முழுவதும் என் இதயத்தில் துயரத்தைக் கொண்டிருப்பேன்?”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “எவ்வளவு காலம்தான் என் பகைவன் என்னை வெல்வான்?” எபிரெய மொழியில் நேரடியாக, “எனக்கு மேலாக உயர்ந்திருப்பான்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: எவ்வளவு காலம்தான்
  rationale: மீண்டும் மீண்டும் வரும் புலம்பல் வினாவை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது; ‘தான்’ அதன் வலியுறுத்தலைக் காட்டுகிறது.
- source_word: אָשִׁית עֵצוֹת
  choice: திட்டங்களை வகுத்துக்கொண்டு
  rationale: ‘வைத்தல்/அமைத்தல்’ என்ற வினையையும் ‘ஆலோசனைகள்/திட்டங்கள்’ என்ற பன்மை பெயர்ச்சொல்லையும், தனக்குள் தொடர்ந்து வழிகளை ஆராயும் பொருளில் இயல்பாக வழங்குகிறது.
- source_word: בְּנַפְשִׁי
  choice: எனக்குள்
  rationale: இங்கு נֶפֶשׁ முழு அகநிலையையோ உள்ளான சுயத்தையோ குறிக்கிறது; ‘எனக்குள்’ என்பது தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: יָגוֹן בִּלְבָבִי יוֹמָם
  choice: நாள் முழுவதும் என் இதயத்தில் துயரத்துடன்
  rationale: துயரம், இதயம், பகலின் தொடர்ந்த நீடிப்பு ஆகிய எபிரெயக் கூறுகளைப் பாதுகாக்கிறது; தமிழில் வாக்கியத்தை நிறைவு செய்ய ‘இருப்பேன்’ சேர்க்கப்பட்டுள்ளது.
- source_word: יָרוּם ... עָלָי
  choice: எனக்கு மேலாக உயர்ந்திருப்பான்
  rationale: பகைவன் மேலோங்கிய நிலையில் இருப்பதைச் சித்தரிக்கும் எபிரெய மொழியின் உயர்வு உருவகத்தைத் தீர்க்காமல் பாதுகாக்கிறது.
- source_word: אֹיְבִי
  choice: என் பகைவன்
  rationale: ஒருமை பெயர்ச்சொல்லையும் முதலாம் நபர் உடைமை விகுதியையும் நேராகவும் இயல்பாகவும் வழங்குகிறது.
