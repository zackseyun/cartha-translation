lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கிறது. முன்னொட்டு לַ இயல்பாக ‘-க்கு’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இது இசையுடன் பாடப்படும் பாடலைக் குறிக்கும் வழக்கமான வகைப்பெயர்; சங்கீத நூலின் சூழலில் ‘சங்கீதம்’ தெளிவாகவும் மரபுடன் இசைந்தும் உள்ளது.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: சங்கீதத் தலைப்புகளில் לְ என்பது படைப்புரிமை, தொடர்பு, அர்ப்பணம் அல்லது தொகுப்பைச் சுட்டக்கூடும். ‘தாவீதின்’ என்பது குறிப்பிட்ட ஒரே பொருளைத் திணிக்காமல் அந்த உறவின் விரிவை ஓரளவு காக்கிறது.
theological_decisions:
- issue: தலைப்பிலுள்ள לְדָוִד என்பதன் பொருள்
  choice: தாவீதின்
  alternative: தாவீதால் இயற்றப்பட்ட / தாவீதுக்காக
  rationale: எபிரெயத் தலைப்பு தாவீது ஆசிரியர் என்பதைக் குறிக்கக்கூடும்; ஆனால் தொடர்பையோ அர்ப்பணிப்பையோ குறிக்கும் வாய்ப்பையும் இலக்கண ரீதியாக அனுமதிக்கிறது. எனவே மூலத்தில் உள்ள தெளிவின்மையை முதன்மை உரையில் காக்கும் வாசகம் தேர்ந்தெடுக்கப்பட்டது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான சங்கீதத் தலைப்பாக வடிவமைக்கப்பட்டது. ‘இசைத் தலைவர்’ என்பது பொதுவாசகருக்குத் தெளிவாக இருக்கிறது; ‘தாவீதின்’ என்பது மூலமொழியின் உறவுச் சார்ந்த தெளிவின்மையைத் தேவையின்றித் தீர்மானிக்காமல் காக்கிறது.
