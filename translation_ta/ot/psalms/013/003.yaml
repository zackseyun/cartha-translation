theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் நேரடியாக இருப்பதால், அதை ஒரு பட்டத்தால் மாற்றாமல் ஒலிபெயர்த்துள்ளது.
- issue: ‘என் கண்களுக்கு ஒளியூட்டும்’ என்ற உருவகம்
  choice: உருவகத்தை அப்படியே தக்கவைத்தல்
  alternative: எனக்குப் புத்துயிர் அளியும் / எனக்குத் தெளிவு அளியும்
  rationale: இந்த உருவகம் புத்துணர்வு, தெளிவு அல்லது நம்பிக்கை எனப் பலவாறு உணரப்படலாம்; மொழிபெயர்ப்பு அவற்றில் ஒன்றை மட்டும் தீர்மானிக்கவில்லை.
- issue: மரணத்தை உறக்கமாகக் கூறும் இறுதித் தொடர்
  choice: மரணத்தில் உறங்கிவிடுவேன்
  alternative: மரண உறக்கத்தில் ஆழ்ந்துவிடுவேன்
  rationale: மூலத்தின் செறிவான, ஓரளவு அசாதாரணமான சொல்லமைப்பையும் மரணம்–உறக்கம் உருவகத்தையும் கூடுதல் பெயர்ச்சொல் சேர்க்காமல் பேணுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், மன்றாட்டுக்குரிய கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘பதிலளியும்’, ‘ஒளியூட்டும்’ ஆகிய மரியாதை ஏவல் வடிவங்கள் கடவுளை நோக்கிய நேரடியான வேண்டுதலைத் தக்கவைக்கின்றன; உருவகங்கள் விளக்கவுரையாக மாற்றப்படவில்லை.
