  rationale: அஞ்சப்படும் விளைவை நவீன தமிழில் இயல்பாக அறிமுகப்படுத்துகிறது.
- source_word: אִישַׁן הַמָּוֶת
  choice: நான் மரணத்தில் உறங்கிவிடுவேன்
