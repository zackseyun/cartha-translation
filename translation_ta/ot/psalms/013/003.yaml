  yaml_path: translation/ot/psalms/013/003.yaml
  text: Look and answer me[a], O Yahweh my God; give light to my eyes[b], lest I sleep the sleep of death.
translation:
  language: ta
  text: என்னைக் கவனித்து, எனக்குப் பதிலளியும், யாவே, என் கடவுளே! என் கண்களுக்கு ஒளியூட்டும்[a]; இல்லையெனில் நான் மரணத்தில் உறங்கிவிடுவேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கண்களை ஒளிரச் செய்யும்” அல்லது “என் கண்களுக்கு ஒளி அளியும்.” இந்த எபிரெய உருவகம் புதுப்பிக்கப்பட்ட உயிராற்றல், தெளிவு அல்லது நம்பிக்கையைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, “நான் மரணத்தை உறங்குவேன்”; “நான் மரணத்தில் உறங்குவேன்” என்றும் பொருள் கொள்ளலாம். மரபாக, “நான் மரண உறக்கத்தில் ஆழ்ந்துவிடுவேன்.”
    reason: lexical_alternative
