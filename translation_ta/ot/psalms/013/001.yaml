    text: சொல்லுக்கு சொல், ‘உமது முகத்தை.’ எபிரெயில் முகத்தை மறைத்தல், பிரசன்னம் அல்லது தயவு விலக்கப்படுவதைக் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: எவ்வளவு காலம்
  rationale: புலம்பல் கவிதையில் காலநீட்டத்தை வினவும் இயல்பான தொடர். எபிரெய உரையில் வரும் இருமுறையான கூக்குரலைத் தமிழிலும் அப்படியே காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது ஒரு பட்டப்பெயர் அல்ல, தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எபிரெய மெய்யெழுத்துகளின் தமிழ் ஒலிபெயர்ப்பு.
- source_word: תִּשְׁכָּחֵנִי
  choice: என்னை மறந்தே இருப்பீர்
  rationale: שׁכח என்பதன் நேரடியான பொருளான ‘மறத்தல்’ காக்கப்படுகிறது; முற்றுப்பெறாமல் நீடிப்பதாகப் புலம்புபவருக்குத் தோன்றும் நிலையை ‘மறந்தே இருப்பீர்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נֶצַח
  choice: என்றென்றுமா
  rationale: தனித்து வலியுறுத்தப்படும் இந்தச் சொல், புலம்பலின் அதிர்ச்சியும் வேதனையும் நிறைந்த ‘என்றென்றுமா?’ என்ற கேள்வியாகக் கொடுக்கப்பட்டுள்ளது.
- source_word: תַּסְתִּיר
  choice: மறைத்துக்கொள்வீர்
  rationale: סתר என்பதன் causative வடிவத்தையும் ‘உமது முகம்’ என்ற நேரடி செயப்படுபொருளையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: פָּנֶיךָ
  choice: உமது முகத்தை
  rationale: எபிரெயின் உருவகமிக்க நேரடிச் சொல்லான ‘முகம்’ முதன்மை உரையில் காக்கப்பட்டுள்ளது; அது பிரசன்னத்தையும் தயவையும் குறிக்கக்கூடும் என்பது அடிக்குறிப்பில் தெரிவிக்கப்படுகிறது.
- source_word: מִמֶּנִּי
  choice: என்னிடமிருந்து
  rationale: பிரிவைக் குறிக்கும் எபிரெய முன்னொட்டின் இயல்பான தமிழ் இணை.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை ஒரு பொதுப் பட்டத்தை அல்ல, இறைவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது. ஆகவே அதை ஒரு பட்டத்தால் மாற்றாமல் தமிழ் ஒலிபெயர்ப்பாகத் தருகிறது.
- issue: ‘உமது முகம்’ என்பதை விளக்கமாக ‘உமது பிரசன்னம்’ என்று மாற்றுவதா
  choice: முதன்மை உரையில் ‘உமது முகம்’ என்பதைத் தக்கவைத்தல்
  alternative: உமது பிரசன்னத்தை; உமது தயவை
  rationale: இந்த எபிரெய மரபுத்தொடர் பிரசன்னம் அல்லது தயவு விலக்கப்படுவதைக் குறிக்கலாம். இருப்பினும் கவித்துவமான உறுதியான உருவகத்தையும் அதன் பொருள் பரப்பையும் காக்க நேரடி சொற்றொடர் முதன்மை உரையில் வைக்கப்படுகிறது.
- issue: נֶצַח சொல்லை முந்தைய கேள்வியோடு எவ்வாறு இணைப்பது
  choice: தனி வலியுறுத்தல் கேள்வியாக ‘என்றென்றுமா?’
  alternative: என்றென்றும் என்னை மறந்தே இருப்பீரா?
  rationale: எபிரெய தொடரமைப்பு ‘எவ்வளவு காலம்’ என்பதையும் ‘என்றென்றும்’ என்பதையும் பதற்றத்தோடு அருகருகே வைக்கிறது. கோடு மற்றும் தனிக் கேள்வி அந்தப் புலம்பலின் திட்டமிட்ட முரணைத் தமிழில் காக்கின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், சாதாரண வாசகருக்கு விளங்கும் அதேவேளையில் புலம்பல் சங்கீதத்திற்கேற்ற கண்ணியமும் கவித்துவத் தீவிரமும் கொண்ட நடை. இறைவனை நோக்கிய உரையில் மரியாதைப் பன்மையான ‘இருப்பீர்/உமது’ பயன்படுத்தப்பட்டுள்ளது.
