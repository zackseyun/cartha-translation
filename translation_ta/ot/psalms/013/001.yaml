base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/001.yaml
  text: How long[a], O Yahweh, will you forget me forever? How long will you hide your face from me?
translation:
  language: ta
  text: யாவே, எவ்வளவு காலம் என்னை மறந்தே இருப்பீர்—என்றென்றுமா? எவ்வளவு காலம் உமது முகத்தை என்னிடமிருந்து மறைப்பீர்?[a]
  philosophy: optimal-equivalence
  footnotes:
