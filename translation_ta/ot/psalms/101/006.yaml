base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
translation:
  language: ta
  text: அவர்கள் என்னோடு குடியிருக்கும்படி, நாட்டிலுள்ள நம்பிக்கைக்குரியவர்கள்மேல் என் பார்வை இருக்கிறது.[a] பழியற்ற வழியில் நடப்பவனே[b] எனக்குப் பணிசெய்வான்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் என்னோடு அமரும்படி.” எபிரெய வினைச்சொல் “அமர்தல்” அல்லது “குடியிருத்தல்” என்று பொருள்படலாம்; இங்கு அரசனின் முன்னிலையில் தொடர்ந்த உடனிருப்பைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “நேர்மையின் வழியில்.” இங்குள்ள “பழியற்ற” என்பது முற்றிலும் பாவமற்ற நிலையைக் குறிக்காமல், நேர்மையான, பழியற்ற வாழ்க்கையைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: என் கண்கள் இருக்கும்
  rationale: எபிரெய மொழியின் கண்கள் ஒருவர்மேல் இருப்பது என்ற உருவகத்தைத் தக்கவைத்து, கவனத்தையும் ஆதரவான நோக்கையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּנֶאֶמְנֵי אֶרֶץ
  choice: நாட்டிலுள்ள உண்மையுள்ளவர்கள்
  rationale: נֶאֱמָן என்பதன் உண்மைத்தன்மை, நம்பகத்தன்மை ஆகிய பொருள்களை ‘உண்மையுள்ளவர்கள்’ வெளிப்படுத்துகிறது; אֶרֶץ இங்கு அரசனின் நாடு அல்லது ஆட்சிப்பரப்பைக் குறிக்கிறது.
- source_word: לָשֶׁבֶת עִמָּדִי
  choice: என்னோடு குடியிருக்கும்படி
  rationale: יָשַׁב என்பது ‘அமர்தல்’ என்றும் ‘குடியிருத்தல்’ என்றும் பொருள்படும். இச்சூழலில் தொடர்ந்த உடனிருப்பை ‘குடியிருக்க’ இயல்பாகக் காட்டுகிறது; לָ முன்னொட்டு நோக்கத்தைத் தெரிவிக்கிறது.
- source_word: הֹלֵךְ
  choice: நடப்பவன்
  rationale: பெயர்ச்சொல் தன்மையில் வரும் பங்கேற்புவினை, ஒருவரின் தொடர்ச்சியான வாழ்க்கை நடத்தையைக் குறிக்கிறது; ‘நடப்பவன்’ மூல உருவகத்தையும் ஒருமையையும் காக்கிறது.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: குற்றமற்ற வழியில்
  rationale: דֶּרֶךְ வாழ்க்கை நடத்தைக்கான உருவகம்; תָּמִים இங்கு முழுமையான பாவமின்மையைக் காட்டாமல் நேர்மை, பழியற்ற தன்மை ஆகியவற்றைக் குறிக்கிறது.
- source_word: הוּא
  choice: அவனே
  rationale: הוּא தரும் வலியுறுத்தலைத் தமிழ் ஏகாரத்தால் வெளிப்படுத்தி, தகுதியுள்ள அந்த நபரே பணிசெய்வார் என்பதைத் தெளிவாக்குகிறது.
- source_word: יְשָׁרְתֵנִי
  choice: எனக்குப் பணிசெய்வான்
  rationale: שׁרת தனிப்பட்ட அல்லது அரசவைச் சேவையைக் குறிக்கலாம். ‘பணிசெய்வான்’ என்பது சமயப் பணிக்குள் பொருளைக் குறுக்காமல் பரந்த அரசவைக் சூழலுக்கும் பொருந்துகிறது.
theological_decisions:
- issue: அரசனோடு இருப்பவர்களின் அறத் தகுதி
  choice: நாட்டிலுள்ள உண்மையுள்ளவர்களுக்கு சங்கீதக்காரன் காட்டும் ஆதரவையும், குற்றமற்ற வாழ்க்கை நடத்தையுள்ளவன் அவனுக்குப் பணிசெய்யத் தகுதியுள்ளவன் என்பதையும் வசனம் கூறுகிறது.
  alternative: இதைப் பொதுவான உடனுறவைக் காட்டிலும் அரசவை அதிகாரிகளை நியமிப்பதை மட்டும் குறிக்கும் வசனமாக வாசிக்கலாம்.
  rationale: ‘என்னோடு குடியிருக்க’ என்பது நெருங்கிய, தொடர்ந்த உடனிருப்பையும், ‘எனக்குப் பணிசெய்வான்’ என்பது அலுவல்சார்ந்த சேவையையும் ஆதரிக்கின்றன. மொழிபெயர்ப்பு இரண்டில் ஒன்றுக்கு மட்டும் பொருளைக் குறுக்காமல் இரு பரிமாணங்களையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. ‘என் கண்கள் இருக்கும்,’ ‘வழியில் நடப்பவன்’ ஆகிய எபிரெய உருவகங்கள் தமிழிலும் புரியக்கூடியதால் தக்கவைக்கப்பட்டுள்ளன. அரசவைச் சூழலை மிகைப்படுத்தாமலும் சமயத் தொழில்நுட்பச் சொற்களைச் சேர்க்காமலும் மொழிபெயர்க்கப்பட்டுள்ளது.
