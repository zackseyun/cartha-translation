id: PSA.101.1
reference: Psalms 101:1
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/001.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, O Yahweh[b], I will sing praise.
translation:
  language: ta
  text: 'தாவீதுக்குரியது[a]. ஒரு சங்கீதம்.


    உறுதியான அன்பையும் நீதியையும் குறித்துப் பாடுவேன்;

    யாவே[b], உமக்குத் துதிப்பாடுவேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத் தலைப்பிலுள்ள ‘தாவீதுக்கு/தாவீதுக்குரியது’ என்பது தாவீதின் ஆசிரியத்துவம், அவருக்கான அர்ப்பணிப்பு அல்லது அவருடனான தொடர்பைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: எபிரெயத்தில் יהוה (YHWH), இங்கு ‘யாவே’ என ஒலிபெயர்க்கப்பட்டுள்ளது.
    reason: divine_name
lexical_decisions:
- source_word: לְדָוִד
  choice: தாவீதுக்குரியது
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், அர்ப்பணிப்பு அல்லது தொடர்பைக் குறிக்கலாம். ‘தாவீதுக்குரியது’ என்பது இவற்றில் ஒன்றை மட்டும் முடிவாக நிர்ணயிக்காமல் தலைப்பின் இயல்பான பொருள் நெகிழ்வைப் பேணுகிறது.
- source_word: מִזְמוֹר
  choice: ஒரு சங்கீதம்
  rationale: இசையோடு பாடப்படும் சங்கீதத்தைக் குறிக்கும் வழக்கமான தலைப்புச் சொல்; தமிழில் தெளிவானதும் நிறுவப்பட்டதுமான இணைச்சொல்.
- source_word: חֶסֶד
  choice: உறுதியான அன்பு
  rationale: חֶסֶד என்பதில் அன்பு, இரக்கம், விசுவாசமான பற்றுறுதி ஆகிய கருத்துகள் அடங்குகின்றன. ‘உறுதியான அன்பு’ அதன் நீடித்த, உறவுசார் பரப்பை இயல்பான தமிழில் எடுத்துரைக்கிறது.
- source_word: וּמִשְׁפָּט
  choice: நீதி
  rationale: מִשְׁפָּט என்பது தீர்ப்பு, நியாயத்தீர்ப்பு அல்லது நீதி எனப் பொருள்படலாம். חסד உடன் இணைந்த இச்சூழலில் ‘நீதி’ பரந்த ஒழுக்க மற்றும் ஆட்சிசார் பொருளைத் தருகிறது.
- source_word: אָשִׁירָה
  choice: பாடுவேன்
  rationale: இங்குள்ள cohortative வடிவம் உறுதி அல்லது நோக்கத்தை வெளிப்படுத்துகிறது; ‘பாடுவேன்’ அதைச் சுருக்கமாகவும் கவிதைநயத்துடனும் தருகிறது.
- source_word: לְךָ
  choice: உமக்கு
  rationale: பாடலின் முகவரியைச் சுட்டுகிறது. தெய்வத்தை நேரடியாக மரியாதையுடன் விளிக்கும் இயல்பான தமிழ் வடிவம்.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட தெய்வீகப் பெயரை ஒரு பொதுப் பட்டத்தால் மாற்றாமல், தமிழில் வழக்கமான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: אֲזַמֵּרָה
  choice: துதிப்பாடுவேன்
  rationale: זמר என்பது இசையுடன் பாடுதல் அல்லது புகழ்ந்து பாடுதல் என்ற பொருளுடையது. ‘துதிப்பாடுவேன்’ முதல் வினையிலிருந்து சிறிய வேறுபாட்டைப் பேணி, இங்கு தேவனை நோக்கிய புகழ்ச்சியைத் தெளிவாக்குகிறது.
theological_decisions:
- issue: יְהוָה என்ற தெய்வீகப் பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: மூல உரை தனிப்பட்ட தெய்வீகப் பெயரை நேரடியாகப் பயன்படுத்துகிறது. ‘யாவே’ என்பது அதை பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து வழங்குகிறது.
- issue: חֶסֶד וּמִשְׁפָּט என்ற சொல்லிணை
  choice: உறுதியான அன்பும் நீதியும்
  alternative: இரக்கமும் நியாயத்தீர்ப்பும்
  rationale: இரண்டு சொற்களுக்கும் குறுகிய மாற்றுப் பொருள்கள் இருந்தாலும், இச்சங்கீதத்தின் உடன்படிக்கைசார் மற்றும் ஒழுக்கசார் பரப்பை ‘உறுதியான அன்பு’ மற்றும் ‘நீதி’ இயல்பாகப் பேணுகின்றன.
translation_notes:
  register: நவீனத் தரத் தமிழில், மரியாதையும் கவிதைநயமும் கொண்ட எளிய நடை பயன்படுத்தப்பட்டுள்ளது. தலைப்பின் தெளிவின்மையும் חסד மற்றும் משפט ஆகியவற்றின் பரந்த பொருள் வீச்சும் பாதுகாக்கப்பட்டுள்ளன.
