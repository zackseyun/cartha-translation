source:
  edition: WLC
  text: מלושני בַ/סֵּ֨תֶר רֵעֵ/הוּ֮ אוֹת֪/וֹ אַ֫צְמִ֥ית גְּֽבַהּ עֵ֭ינַיִם וּ/רְחַ֣ב לֵבָ֑ב אֹ֝ת֗/וֹ לֹ֣א אוּכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/005.yaml
  text: Whoever secretly slanders his neighbor[a], him I will destroy; one with haughty eyes and a proud heart[b], him I cannot endure.
translation:
  language: ta
  text: 'தன் அயலானைப் பற்றி மறைவாக அவதூறு பேசுகிறவனை[a] நான் அழித்துவிடுவேன்;

    செருக்கான பார்வையும் அகந்தையான உள்ளமும் கொண்டவனை[b] என்னால் சகித்துக்கொள்ள முடியாது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தன் அயலானைப் பற்றி மறைவாக அவதூறு பேசுகிறவனை நான் முற்றிலும் அகற்றிவிடுவேன்.’
    reason: lexical_alternative
  - marker: b
    text: சொல்லர்த்தமாக, ‘கண்களில் உயர்வும் இருதயத்தில் விரிவும் உள்ளவன்.’ இது செருக்கான தோற்றத்தையும் அகந்தையான மனப்பான்மையையும் குறிக்கும் எபிரெய மரபுத்தொடர்.
    reason: cultural_note
lexical_decisions:
- source_word: מלושני
  choice: அவதூறு பேசுகிறவனை
  rationale: לשׁן என்ற வேரிலிருந்து வந்த இவ்வடிவம், பிறருக்குத் தீங்கு விளைவிக்கும் வகையில் அவரைப் பற்றிப் பழித்துப் பேசுகிற ஒருவரைக் குறிக்கிறது. நவீனத் தமிழில் ‘அவதூறு பேசுகிறவன்’ என்பது அதன் தீய நோக்கையும் பேச்சின் கடுமையையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַסֵּתֶר
  choice: மறைவாக
  rationale: சொல்லர்த்தமாக ‘மறைவிடத்தில்’ அல்லது ‘இரகசியத்தில்’ என்பதாகும். செயல் பிறருக்குத் தெரியாமல் செய்யப்படுவதை ‘மறைவாக’ தெளிவாகக் காட்டுகிறது.
- source_word: רֵעֵהוּ
  choice: தன் அயலானைப் பற்றி
  rationale: רֵעַ என்பது நெருங்கிய நண்பரை மட்டும் அல்லாமல், சமூக உறவில் அருகிலுள்ள சக மனிதரையும் குறிக்கலாம். ‘அயலான்’ இந்த விரிவான பொருளைப் பேணுகிறது; ‘பற்றி’ என்பது தமிழில் அவதூறு பேசுதலின் இலக்கை இயல்பாகக் குறிக்கிறது.
- source_word: אַצְמִית
  choice: நான் அழித்துவிடுவேன்
  rationale: צמת என்பதன் ஹிஃபில் வடிவம் அழியச் செய்தல் அல்லது முற்றிலும் அகற்றுதல் என்ற வலுவான பொருளைக் கொண்டது. ‘அழித்துவிடுவேன்’ அதன் கடுமையைப் பேணுகிறது; ஆனால் நடைமுறையின் குறிப்பிட்ட வடிவத்தைச் சேர்ப்பதில்லை.
- source_word: גְּבַהּ עֵינַיִם
  choice: செருக்கான பார்வை
  rationale: சொல்லர்த்தமாக ‘உயர்ந்த கண்கள்’ என்ற இந்த எபிரெய மரபுத்தொடர், பார்வையிலும் நடத்தையிலும் வெளிப்படும் மேட்டிமையைக் குறிக்கிறது. ‘செருக்கான பார்வை’ உருவகத்தையும் ஒழுக்கப் பொருளையும் பேணுகிறது.
- source_word: וּרְחַב לֵבָב
  choice: அகந்தையான உள்ளம்
  rationale: சொல்லர்த்தமாக ‘விரிந்த இருதயம்’ என்றாலும், இச்சூழலில் அது பெருந்தன்மையை அல்ல, தன்னை உயர்த்திக்கொள்ளும் அகந்தையைச் சுட்டுகிறது. தவறாகப் புரிந்துகொள்ளப்படாமல் இருக்க ‘அகந்தையான உள்ளம்’ என வழங்கப்பட்டுள்ளது.
- source_word: לֹא אוּכָל
  choice: என்னால் சகித்துக்கொள்ள முடியாது
  rationale: சொல்லர்த்தமாக ‘என்னால் முடியாது’ என்பதாகும்; இங்கு அத்தகைய நபரைத் தாங்குதல் அல்லது பொறுத்துக்கொள்ளுதல் என்பது உட்கிடையாக உள்ளது. ‘சகித்துக்கொள்ள முடியாது’ என்பது இயலாமையையும் உறுதியான ஒழுக்க மறுப்பையும் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: அரசரின் ஒழுக்கத் தீர்மானத்தில் தீர்ப்பின் எல்லை
  choice: பேச்சாளர், அவதூறு பேசுகிறவர்களையும் அகந்தையுள்ளவர்களையும் தன் முன்னிலையிலிருந்தோ ஆட்சிப் பரப்பிலிருந்தோ கடுமையாக அகற்றி, அவர்களைப் பொறுத்துக்கொள்ள மாட்டேன் என்று அறிவிக்கிறார்; அது எவ்வாறு நிறைவேற்றப்படும் என்பதை மொழிபெயர்ப்பு குறிப்பாக வரையறுக்கவில்லை.
  alternative: இது அத்தகையவர்களுக்கு நேரடியான மரணதண்டனை வழங்கும் உறுதிமொழி எனக் கொள்ளலாம்; அல்லது அவர்களோடு தொடர்பு கொள்ள மறுப்பதை வலுப்படுத்திக் கூறும் மிகைப்படுத்தல் எனக் கொள்ளலாம்.
  rationale: אַצְמִית என்பது கடுமையான அழிவைக் குறிக்கிறது; לֹא אוּכָל என்பது அத்தகையவரைச் சகிக்க மறுப்பதைக் காட்டுகிறது. ஆகவே தீர்ப்பின் வலிமை பேணப்படுகிறது; ஆனால் எபிரெய உரை குறிப்பிடாத தண்டனை முறையை மொழிபெயர்ப்பு சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரு இணையான தீர்ப்பு வாக்கியங்களும் அரைப்புள்ளி மற்றும் வரிப்பிரிப்பால் தெளிவுபடுத்தப்பட்டுள்ளன. ‘அழித்துவிடுவேன்’ என்ற கடுமையான மொழி மெலிவாக்கப்படவில்லை; அதேவேளை குறிப்பிட்ட தண்டனை முறை உரைக்குள் சேர்க்கப்படவில்லை.
