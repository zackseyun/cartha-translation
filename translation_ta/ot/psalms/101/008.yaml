source:
  edition: WLC
  text: לַ/בְּקָרִ֗ים אַצְמִ֥ית כָּל רִשְׁעֵי אָ֑רֶץ לְ/הַכְרִ֥ית מֵֽ/עִיר יְ֝הוָ֗ה כָּל פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/008.yaml
  text: Morning by morning I will destroy all the wicked of the land[b][a], cutting off from the city of Yahweh all workers of iniquity.
translation:
  language: ta
  text: 'காலைதோறும் நாட்டிலுள்ள பொல்லாதவர்கள் அனைவரையும் அழிப்பேன்[a];

    யாவேயின் நகரத்திலிருந்து அக்கிரமம் செய்பவர்கள் அனைவரையும் அடியோடு அகற்றுவதற்காக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘பூமியிலுள்ள பொல்லாதவர்கள் அனைவரையும்.’ எபிரெயச் சொல் ‘நாடு’ அல்லது ‘பூமி’ என்று பொருள்படலாம்; இச்சங்கீதத்தின் அரசாட்சி சார்ந்த சூழலுக்கு ‘நாடு’ பொருத்தமாக உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַבְּקָרִים
  choice: காலைதோறும்
  rationale: பன்மை வடிவத்துடன் வந்துள்ள முன்னொட்டு, ஒவ்வொரு காலையிலும் தொடர்ச்சியாக நடைபெறும் செயலைக் குறிக்கிறது; ‘காலைதோறும்’ இதை இயல்பான தமிழில் தருகிறது.
- source_word: אַצְמִית
  choice: அழிப்பேன்
  rationale: צמת என்பதன் ஹிஃபில் வடிவம் அழித்தல் அல்லது முடிவுக்குக் கொண்டுவருதல் என்ற வலுவான பொருளைக் கொண்டுள்ளது; அரசரின் நீதித் தீர்ப்புச் சூழலில் ‘அழிப்பேன்’ நேரடியான மொழிபெயர்ப்பு.
- source_word: כָּל רִשְׁעֵי אָרֶץ
  choice: நாட்டிலுள்ள பொல்லாதவர்கள் அனைவரையும்
  rationale: רִשְׁעֵי என்பது ‘பொல்லாதவர்கள்’ என்று பெயர்ச்சொல் மதிப்பில் வருகிறது. אָרֶץ என்பதற்கு ‘நாடு’ அல்லது ‘பூமி’ என இரு பொருள்கள் இருக்கலாம்; அரசாட்சி மற்றும் யாவேயின் நகரம் பற்றிய இச்சூழலில் ‘நாடு’ பொருத்தமானது.
- source_word: לְהַכְרִית
  choice: அடியோடு அகற்றுவேன்
  rationale: כרת என்பதன் ஹிஃபில் வடிவம் துண்டித்தல், ஒழித்தல், ஒரு இடத்திலிருந்து முற்றிலும் நீக்குதல் ஆகிய வலுவான பொருள்களைக் கொண்டது. இயல்பான தமிழில் அந்தத் தீவிரத்தை ‘அடியோடு அகற்றுவேன்’ வெளிப்படுத்துகிறது.
- source_word: מֵעִיר יְהוָה
  choice: யாவேயின் நகரத்திலிருந்து
  rationale: எபிரெயச் சொற்றொடர் அந்த நகரம் யாவேக்கு உரியது என்பதைக் குறிக்கிறது; உடைமைத் தொடர்பைத் தமிழ் இயல்புக்கு ஏற்ப ‘யாவேயின் நகரம்’ எனத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது தேவனுடைய தனிப்பெயரைக் குறிக்கும் நான்கு எபிரெய் எழுத்துகளாலான பெயர். ஒரு பொதுப் பட்டத்தால் மாற்றாமல், அதன் பரவலான ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: அக்கிரமம் செய்கிற அனைவரையும்
  rationale: இச்சொற்றொடர் சொற்பட ‘அக்கிரமத்தைச் செய்பவர்கள் அனைவரும்’ என்று பொருள்படுகிறது. ‘அக்கிரமம் செய்கிற அனைவரையும்’ என்பது செயற்பாட்டுத் தன்மையையும் ஒழுக்கக் குற்றத்தின் வலிமையையும் தெளிவாகக் காக்கிறது.
theological_decisions:
- issue: אָרֶץ என்பதன் பரப்பு
  choice: நாடு
  alternative: பூமி
  rationale: சங்கீதத்தின் அரசாட்சி சார்ந்த சூழலும் ‘யாவேயின் நகரம்’ என்ற குறிப்பும் அரசனின் ஆட்சிக்குட்பட்ட நாட்டைக் குறிக்கின்றன. எனினும், ‘பூமி’ என்பதும் எபிரெயில் சாத்தியமான பொருள் என்பதால் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் பொதுப் பட்டம் அல்ல, தேவனுடைய தனிப்பெயரே உள்ளது. அதை மறைக்காமல் ஒலிபெயர்த்து வழங்குவது மூலவடிவின் தன்மையைப் பாதுகாக்கிறது.
- issue: לְהַכְרִית என்பதன் நோக்கம்/விளைவு தொடர்பு
  choice: இரண்டாம் அடியில் இணையான தொடர்ச்சிச் செயலாக வழங்கப்பட்டது
  alternative: ‘அகற்றுவதற்காக’ என்று வெளிப்படையான நோக்கவாக்கியமாக வழங்குதல்
  rationale: எபிரெய் வினையெச்சம் நோக்கத்தையோ விளைவையோ குறிக்கக்கூடும். தமிழில் வெளிப்படையாக ஒன்றை மட்டும் தீர்மானிக்காமல், அரைப்புள்ளியால் இணைத்து அந்தத் தொடர்பின் நெகிழ்வைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும், ஆனால் சங்கீதத்திற்குரிய கண்ணியமும் நீதித்தீர்ப்பின் வலிமையும் கொண்ட நடை பயன்படுத்தப்பட்டுள்ளது. ‘காலைதோறும்’ மறுமுறை நிகழ்வையும், ‘அடியோடு அகற்றுவேன்’ כרת என்பதன் தீவிரத்தையும் இயல்பாக வெளிப்படுத்துகின்றன.
