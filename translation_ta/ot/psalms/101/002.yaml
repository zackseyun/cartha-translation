source:
  edition: WLC
  text: אַשְׂכִּ֤ילָה בְּ/דֶ֬רֶךְ תָּמִ֗ים מָ֭תַי תָּב֣וֹא אֵלָ֑/י אֶתְהַלֵּ֥ךְ בְּ/תָם לְ֝בָבִ֗/י בְּ/קֶ֣רֶב בֵּיתִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/002.yaml
  text: I will give attention to the blameless way—when will you come to me? I will walk with integrity of heart within my house[a][b].
translation:
  language: ta
  text: குற்றமற்ற வழிக்குக் கவனம் செலுத்துவேன்[b]—நீர் எப்போது என்னிடம் வருவீர்?[a] என் வீட்டிற்குள்ளே நேர்மையான இதயத்தோடு நடப்பேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில், “நீர் எப்போது என்னிடம் வருவீர்?” என்றே உள்ளது. குறிக்கப்படும் நபர் வெளிப்படையாகப் பெயரிடப்படவில்லை; பலர் இதை தேவனை நோக்கிய அழைப்பாகப் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: அல்லது, “நேர்மையின் வழியைச் சிந்தித்துப் பார்ப்பேன்” அல்லது “குற்றமற்ற வழியில் விவேகமாக நடப்பேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂכִּילָה
  choice: கவனம் செலுத்துவேன்
  rationale: שׂכל என்பதன் ஹிஃபில் வடிவம் விவேகமாகச் செயல்படுவதையோ கூர்ந்து கவனிப்பதையோ குறிக்கலாம். இங்கு குற்றமற்ற வாழ்க்கை வழியை நோக்கமுடன் கவனிப்பது என்ற பொருளை இயல்பான தமிழில் தருகிறது; வேறு சாத்தியங்களை அடிக்குறிப்பு பாதுகாக்கிறது.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: குற்றமற்ற வழிக்கு
  rationale: דֶּרֶךְ அறநெறி சார்ந்த வாழ்க்கைப் பாதையைக் குறிக்கிறது; תָּמִים பாவமற்ற முழுநிறைவைக் காட்டிலும் பழியற்ற தன்மையையும் முழுமையான நேர்மையையும் இங்கு குறிக்கிறது.
- source_word: מָתַי תָּבוֹא אֵלַי
  choice: நீர் எப்போது என்னிடம் வருவீர்?
  rationale: வினைச்சொல் இரண்டாம் நபர் ஆண்பால் ஒருமையில் உள்ளது. யாரை நோக்கிப் பேசுகிறார் என்பது வெளிப்படையாகக் கூறப்படாததால், ‘நீர்’ என்ற நேரடி அழைப்பை வைத்தே அந்த மறைபொருளைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: אֶתְהַלֵּךְ
  choice: நடப்பேன்
  rationale: הלך என்பதன் ஹித்பயேல் வடிவம் ஒருவரின் வாழ்க்கை நடத்தையைக் குறிக்கக்கூடும். ‘நடப்பேன்’ மூலத்தின் அறநெறிப் பாதை உருவகத்தைப் பாதுகாக்கிறது.
- source_word: בְּתָם לְבָבִי
  choice: நேர்மையான இதயத்தோடு
  rationale: תֹּם முழுமை, கபடமின்மை, நேர்மை ஆகிய பொருள்களைத் தருகிறது. இதயத்துடன் சேரும்போது உள்ளார்ந்த ஒழுக்க நேர்மையை இயல்பான தமிழில் இச்சொற்றொடர் வெளிப்படுத்துகிறது.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: என் வீட்டிற்குள்
  rationale: בְּקֶרֶב என்பதன் அடிப்படைப் பொருள் ‘நடுவில்/உள்ளே’ என்பதாகும். இங்கு ஒருவரின் வீட்டுச் சூழலுக்குள் என்பதைக் ‘என் வீட்டிற்குள்’ தெளிவாகவும் இயல்பாகவும் தருகிறது.
theological_decisions:
- issue: ‘நீர் எப்போது என்னிடம் வருவீர்?’ என்பதில் மறைந்துள்ள எழுவாய்/குறிக்கப்படும் நபர்
  choice: முதன்மை உரையில் இரண்டாம் நபர் நேரடி அழைப்பை வைத்திருந்து, குறிக்கப்படும் நபர் யார் என்பதை வெளிப்படையாகச் சேர்க்கவில்லை.
  alternative: இது தேவனை நோக்கிய அழைப்பு என்று வெளிப்படையாக மொழிபெயர்ப்பது; அல்லது குற்றமற்ற வழி தன்னிடம் வருவதைப் பற்றிய ஆளற்ற கூற்றாகப் புரிந்துகொள்வது.
  rationale: எபிரெய வினை இரண்டாம் நபர் ஆண்பால் ஒருமையைத் தெளிவாகக் காட்டினாலும், அந்த ‘நீர்’ யார் என்று பெயரிடவில்லை. சங்கீதத்தின் பக்திசார் சூழலில் பலர் இதை தேவனை நோக்கியதாகப் புரிந்துகொள்கிறார்கள்; எனினும் மூல உரை வெளிப்படையாகச் சொல்லாததை முதன்மை உரை நிரப்பவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதத்திற்கேற்ற கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘வழி’ மற்றும் ‘நடப்பேன்’ ஆகிய இணைந்த உருவகங்கள் மூலத்தின் அறநெறி சார்ந்த மொழியைப் பாதுகாக்கின்றன. தேவனை நேரடியாகப் பெயரிடாமல், மரியாதை ஒருமையான ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது.
