  text: לֵבָ֣ב עִ֭קֵּשׁ יָס֣וּר מִמֶּ֑/נִּי רָ֝֗ע לֹ֣א אֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/004.yaml
  text: A crooked heart will depart from me[a]; I will not know evil.
translation:
  language: ta
  text: 'வக்கிரமான உள்ளம் என்னைவிட்டு விலகும்;

    தீமையை நான் அறியமாட்டேன்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமையுடன் எனக்கு எந்தத் தொடர்பும் இருக்காது.” எபிரெயத்தில் நேரடியாக, “தீமையை நான் அறியமாட்டேன்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵבָב
  choice: உள்ளம்
  rationale: எபிரெய மானிடவியலில் இச்சொல் சிந்தனை, மனவுறுதி, ஒழுக்க இயல்பு ஆகியவற்றை உள்ளடக்கிய அக மனிதனைக் குறிக்கிறது. நவீனத் தமிழில் ‘உள்ளம்’ இந்த விரிவான பொருளை இயல்பாகத் தருகிறது.
- source_word: עִקֵּשׁ
  choice: வக்கிரமான
  rationale: நேர்மையிலிருந்து விலகிய ஒழுக்கச் சீர்கேட்டை இச்சொல் குறிக்கிறது. ‘வக்கிரமான’ என்பது மூலத்திலுள்ள கோணல் உருவகத்தையும் அறநெறிப் பொருளையும் தக்கவைக்கிறது.
- source_word: יָסוּר
  choice: அகன்றுபோகும்
  rationale: סור என்பது விலகுதல் அல்லது அகன்றுபோதலைக் குறிக்கிறது. מן முன்னொட்டுடன் இங்கு பேச்சாளரிடமிருந்து பிரிந்து செல்வது என்ற பொருள் தெளிவாகிறது.
- source_word: מִמֶּנִּי
  choice: என்னைவிட்டு
  rationale: מן என்பதும் முதலாம் நபர் ஒருமை பின்னொட்டும் சேர்ந்து, சங்கீதக்காரரிடமிருந்து விலகுதலைக் குறிக்கின்றன.
- source_word: רָע
  choice: தீமை
  rationale: இங்கு இச்சொல் பொதுவான அறநெறித் தீமையைக் குறிக்கிறது. ‘தீமை’ என்பது அதன் பரந்த பொருளைக் குறிப்பிட்ட ஒரு தீச்செயலாகச் சுருக்காமல் காக்கிறது.
- source_word: לֹא אֵדָע
  choice: நான் அறியமாட்டேன்
  rationale: ידע என்பதன் நேரடிப் பொருள் ‘அறிதல்’. சூழலில் அது தொடர்பு, அங்கீகாரம் அல்லது அனுபவப் பங்கேற்பையும் குறிக்கலாம். மூலமொழியின் திட்டமிட்ட சுருக்கத்தையும் பொருள் இறுக்கத்தையும் முதன்மை உரை தக்கவைக்கிறது; நடைமுறைப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: தீமையை ‘அறிதல்’ என்பதன் பொருள்
  choice: ‘அறியமாட்டேன்’ என்ற எபிரெயச் சொல்லாட்சியை முதன்மை உரையில் தக்கவைத்து, தீமையுடன் தொடர்புகொள்ள மறுப்பது என்ற சாத்தியப் பொருளை அடிக்குறிப்பில் தருதல்
  alternative: ‘தீமையோடு எனக்கு எந்தத் தொடர்பும் இருக்காது’ என்று முதன்மை உரையிலேயே பொருளை விரித்துரைத்தல்
  rationale: ידע இங்கு வெறும் தகவல் அறிதலைவிட உறவு அல்லது பங்கேற்பு சார்ந்த பொருளைக் கொண்டிருக்கலாம். இருப்பினும் அந்த விரிவான பொருளை உரைக்குள் உறுதியாக்காமல், மூலத்தின் உண்மையான பொருள் இறுக்கத்தையும் இறையியல் அழுத்தத்தையும் காப்பது ஏற்றது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வக்கிரமான உள்ளம்’ ஒழுக்கக் கோணலைத் தெளிவாகக் காட்டுகிறது; ‘அறியமாட்டேன்’ மூல எபிரெயத்தின் சுருக்கத்தையும் இரட்டைப் பொருள் வாய்ப்பையும் தக்கவைக்கிறது.
