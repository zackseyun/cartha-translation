  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, Yahweh[b], I will sing praise.
translation:
  language: ta
  text: 'தாவீதின்[a]. ஒரு சங்கீதம்.


    மாறாத அன்பையும் நீதியையும் குறித்துப் பாடுவேன்[b];

    யெகோவாவே, உமக்குப் புகழ் பாடுவேன்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத் தலைப்பில் உள்ள ‘தாவீதின்’ என்பது தாவீது இயற்றியது, அவருக்குரியது, அவருக்கு அர்ப்பணிக்கப்பட்டது, அல்லது அவருடன் தொடர்புடையது என்பவற்றில் ஏதாவதொன்றைக் குறிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: ‘மாறாத அன்பும் நீதியும்’ என்பதற்கு ‘இரக்கமும் தீர்ப்பும்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: இச்சொல் வெறும் இரக்கம் என்பதைக் காட்டிலும் நிலைத்த பற்றுறுதியையும் உடன்படிக்கைச் சார்ந்த அன்பையும் குறிக்கக்கூடும்; ‘மாறாத அன்பு’ அதன் பரந்த பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: מִשְׁפָּט
  choice: நீதி
  rationale: இங்கு தீர்ப்பு என்ற தனிப்பட்ட செயலை மட்டும் அல்லாமல் நீதியான ஆட்சி மற்றும் நியாயம் என்ற பரந்த ஒழுக்கப் பொருளையும் இச்சொல் தாங்குகிறது.
- source_word: אֲזַמֵּרָה
  choice: புகழ் பாடுவேன்
  rationale: இசையுடன் பாடுதல் அல்லது துதித்துப் பாடுதல் என்ற வினையின் பொருளை, யெகோவாவை நோக்கிய சங்கீதச் சூழலில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְדָוִד
  choice: தாவீதுடன் தொடர்புடையது
  rationale: לְ என்ற முன்னொட்டு ஆசிரியத்துவம், அர்ப்பணம் அல்லது தொடர்பு ஆகியவற்றைக் குறிக்கக்கூடியதால், ஆசிரியத்துவத்தை மட்டும் உறுதிப்படுத்தாமல் மூலத்தின் நெகிழ்வைப் பாதுகாக்கிறது.
- source_word: יְהוָה
  choice: யெகோவா
  rationale: தெய்வீகப் பெயரை பொதுப் பட்டப்பெயராக மாற்றாமல், தமிழில் பரவலாக அறியப்பட்ட பெயர்வடிவத்தில் வழங்குகிறது.
theological_decisions:
- issue: சங்கீதத் தலைப்பிலுள்ள தாவீதின் தொடர்பு
  choice: ‘தாவீதுடன் தொடர்புடையது’ என்று திறந்த பொருளில் மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தாவீதின் சங்கீதம்’ அல்லது ‘தாவீதால் இயற்றப்பட்டது.’
  rationale: எபிரெய לְדָוִד ஆசிரியத்துவம், அர்ப்பணம், உடைமை அல்லது தொடர்பு ஆகிய பல உறவுகளைச் சுட்டலாம்; ஒரு விளக்கத்தை மட்டும் இறுதியானதாக ஆக்கவில்லை.
- issue: חֶסֶד וּמִשְׁפָּט என்பதன் பொருள் வரம்பு
  choice: ‘மாறாத அன்பும் நீதியும்’
  alternative: ‘இரக்கமும் தீர்ப்பும்’
  rationale: மூலச் சொற்களின் உடன்படிக்கைச் சார்ந்த மற்றும் ஒழுக்கநெறி சார்ந்த பரந்த பொருளை முதன்மை உரை வெளிப்படுத்துகிறது; குறுகிய மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் இருவரி அமைப்பும் நேரடி அழைப்பும் பேணப்பட்டுள்ளன; தலைப்பின் பொருள் தேவையின்றி ஆசிரியத்துவமாகச் சுருக்கப்படவில்லை.
