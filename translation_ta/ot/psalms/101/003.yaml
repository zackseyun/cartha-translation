source:
  edition: WLC
  text: לֹֽא אָשִׁ֨ית לְ/נֶ֥גֶד עֵינַ֗/י דְּֽבַר בְּלִ֫יָּ֥עַל עֲשֹֽׂה סֵטִ֥ים שָׂנֵ֑אתִי לֹ֖א יִדְבַּ֣ק בִּֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/003.yaml
  text: I will not set any worthless thing before my eyes[a]; I hate the work of those who turn aside[b]; it will not cling to me.
translation:
  language: ta
  text: நான் என் கண்முன் எந்தக் கேடான காரியத்தையும் வைக்கமாட்டேன்[a]; வழிவிலகுகிறவர்களின் செயலை வெறுக்கிறேன்[b]; அது என்னைப் பற்றிக்கொள்ளாது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘கேடான காரியம்’ என்பதற்கு ‘பயனற்ற காரியம்,’ ‘தகாத காரியம்,’ அல்லது ‘பெலியாலின் காரியம்’ என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெயச் சொல் ஒரு தனிப்பெயரைவிடப் பயனின்மை அல்லது கேடான தன்மையையே பெரும்பாலும் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: ‘வழிவிலகுகிறவர்களின் செயல்’ என்பதற்கு ‘நெறிபிறழ்ந்தவர்களின் செயல்’ அல்லது ‘விலகிச் செல்கிறவர்களின் செயல்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁית
  choice: வைக்கமாட்டேன்
  rationale: שׂים என்பதன் Qal முற்றுப்பெறா வினை முதல் நபர் ஒருமை வடிவம் ‘வை/அமை’ என்று பொருள்படும். எதிர்மறையுடன், பேச்சாளரின் உறுதியான தீர்மானத்தை ‘வைக்கமாட்டேன்’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לְנֶגֶד עֵינַי
  choice: என் கண்களுக்கு முன்பாக
  rationale: கண்ணெதிரே ஒன்றை நோக்கத்துடன் வைக்கும் மூலமொழியின் தெளிவான காட்சியையும் அறநெறி சார்ந்த தீர்மானத்தையும் இச்சொற்றொடர் காக்கிறது.
- source_word: דְּבַר בְּלִיָּעַל
  choice: பயனற்ற காரியம் எதையும்
  rationale: דבר என்பது இங்கு ‘காரியம்/விஷயம்’; בליעל என்பது பெரும்பாலும் பயனின்மை, தகாமை அல்லது கேடான தன்மையைக் குறிக்கிறது. ‘பயனற்ற காரியம்’ மூலத்தின் அடிப்படைச் சொல்லுணர்வைக் காக்கிறது; ‘எதையும்’ எதிர்மறை வாக்கியத்தின் முழுமையான மறுப்பை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: עֲשֹׂה סֵטִים
  choice: வழிவிலகுகிறவர்களின் செயல்
  rationale: עֲשֹׂה என்பது ‘செய்தல்/செயல்’; סֵטִים என்பது வழியிலிருந்து விலகுகிறவர்களைக் குறிக்கிறது. இத்தேர்வு செயல் என்ற பெயர்ச்சொல் அமைப்பையும் வழிவிலகுதல் என்ற உருவகத்தையும் காக்கிறது.
- source_word: שָׂנֵאתִי
  choice: வெறுக்கிறேன்
  rationale: எபிரெயத்தில் நிறைவுற்ற வடிவமாக இருந்தாலும், இச்சூழலில் சங்கீதக்காரரின் நிலையான மனப்பாங்கைச் சுட்டுகிறது; நிகழ்காலத் தமிழ் அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: לֹא יִדְבַּק בִּי
  choice: அது என்னைப் பற்றிக்கொள்ளாது
  rationale: דבק என்பது ஒட்டுதல், பற்றிக்கொள்ளுதல் என்று பொருள்படும். ‘பற்றிக்கொள்ளாது’ தீய செயல் பேச்சாளருடன் இணைந்துவிடாது என்ற உருவகத்தை இயல்பாகக் காக்கிறது.
theological_decisions:
- issue: בליעל என்பதன் பொருள்
  choice: ‘பயனற்ற/தகாத’ என்ற பொதுப்பெயர் சார்ந்த பண்புப் பொருள்
  alternative: ‘பெலியாலுக்குரிய காரியம்’ என்ற தனிப்பெயர் சார்ந்த பொருள்
  rationale: சங்கீதம் 101:3-இல் דְּבַר בְּלִיָּעַל என்பது இயல்பாகப் பயனற்ற அல்லது கேடான காரியத்தையே குறிக்கிறது; பிற்காலத்தில் உருவான ஆளுருவாக்கப்பட்ட ‘பெலியால்’ என்ற கருத்தை இங்கு சேர்க்க மூலவாக்கியம் கட்டாயப்படுத்தவில்லை.
- issue: לֹא יִדְבַּק בִּי என்பதில் ‘அது’ குறிக்கும் முன்சொல்
  choice: முந்தைய வழிவிலகிய செயல் அல்லது கேடான காரியத்தைத் தெளிவுபடுத்தாமல் ‘அது’ எனவே வைத்தல்
  alternative: ‘அவர்களின் செயல் என்னைப் பற்றிக்கொள்ளாது’ என்று குறிப்பாகத் தெளிவுபடுத்துதல்
  rationale: எபிரெய ஆண்பால் ஒருமை வினை வடிவம் முந்தைய ‘காரியம்’ அல்லது ‘செய்தல்/செயல்’ ஆகியவற்றுடன் தொடர்புபடுத்தப்படலாம். ‘அது’ என்று மொழிபெயர்ப்பது மூலத்தின் சுட்டுப்பொருள் நெகிழ்வைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் அதேவேளையில் சங்கீதத்துக்குரிய கண்ணியமான தீர்மானத் தொனி காக்கப்பட்டுள்ளது. ‘கண்களுக்கு முன்பாக’ மற்றும் ‘பற்றிக்கொள்ளாது’ ஆகியவை மூலத்தின் காட்சியுருவங்களைப் பாதுகாக்கின்றன.
