  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
translation:
  language: ta
  text: வஞ்சகம் செய்கிறவன்[a] என் வீட்டுக்குள் குடியிருக்கமாட்டான்; பொய்களைப் பேசுகிறவன் என் கண்முன் நிலைபெறமாட்டான்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘ஏமாற்றுச் செயலில் ஈடுபடுகிறவன்.’ எபிரெய மொழியில் சொல்லுக்கு நெருக்கமாக ‘வஞ்சகம் செய்கிறவன்’ என்று உள்ளது; இது வழக்கமான வஞ்சக நடத்தையைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என் கண்முன் நிற்கமாட்டான்.’ எபிரெய வினைச்சொல் ‘நிலைபெறு,’ ‘நிலைநிறுத்தப்படு,’ அல்லது ‘உறுதியாக நில்’ என்று பொருள்படலாம்; இங்கு அத்தகையவன் பேச்சாளரின் முன்னிலையில் தொடர்ந்து இருக்க அனுமதிக்கப்படமாட்டான் என்ற பொருள் இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: குடியிருக்கமாட்டான்
  rationale: ישׁב என்பதற்கு ‘உட்கார், குடியிரு, தங்கியிரு’ என்ற பொருள்கள் உண்டு. ‘என் வீட்டுக்குள்’ என்ற சூழலில், ஒருவன் அந்த வீட்டாரிடையே தொடர்ந்து வசிக்கவோ ஏற்றுக்கொள்ளப்பட்டவனாகத் தங்கவோ மாட்டான் என்பதை ‘குடியிருக்கமாட்டான்’ இயல்பாகத் தெரிவிக்கிறது.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: என் வீட்டுக்குள்
  rationale: בקרב என்பது ‘நடுவில், உள்ளே’ என்று பொருள்படும். ‘என் வீட்டுக்குள்’ என்பது எபிரெயச் சொல்லின் உட்புற வட்டாரக் கருத்தை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: עֹשֵׂה רְמִיָּה
  choice: வஞ்சகம் செய்கிறவன்
  rationale: செயற்பெயரெச்சமான עֹשֵׂה, வழக்கமாக அல்லது தன்மையாகச் செய்யும் செயலைக் குறிக்கிறது; רְמִיָּה என்பது வஞ்சகம் அல்லது ஏமாற்று நடத்தை. ‘வஞ்சகம் செய்கிறவன்’ மூலத்தின் வினை வடிவையும் தொடர்ச்சியான நடத்தையையும் காக்கிறது.
- source_word: דֹּבֵר שְׁקָרִים
  choice: பொய்களைப் பேசுகிறவன்
  rationale: דֹּבֵר என்பது தன்மையாகத் தொடர்ந்து பேசுவதைச் சுட்டும் செயற்பெயரெச்சம்; שְׁקָרִים பன்மையில் இருப்பதால் ‘பொய்களை’ என்று நேரடியாக மொழிபெயர்க்கப்பட்டுள்ளது. இது முதல் அரையடியின் இணை அமைப்பையும் காக்கிறது.
- source_word: יִכּוֹן
  choice: நிலைபெறமாட்டான்
  rationale: Niphal வடிவிலுள்ள כון, ‘நிலைநிறுத்தப்படு, நிலைபெறு, உறுதியாக நில்’ என்று பொருள்படலாம். ‘என் கண்முன்’ என்பதோடு ‘நிலைபெறமாட்டான்’ என்பது அந்த நபர் பேச்சாளரின் முன்னிலையில் தொடர்ந்து இடம் பெறமாட்டான் என்ற கருத்தையும் வினையின் பரந்த பொருளையும் காக்கிறது.
- source_word: לְנֶגֶד עֵינַי
  choice: என் கண்முன்
  rationale: இந்தச் சொற்றொடர் சொல்லுக்கு நெருக்கமாக ‘என் கண்களுக்கு முன்பாக’ என்று பொருள்படும். ‘என் கண்முன்’ எபிரெய உருவகத்தையும் தனிப்பட்ட கண்காணிப்பு அல்லது மதிப்பீட்டின் நுண்ணுணர்வையும் இயல்பான தமிழில் தக்கவைக்கிறது.
theological_decisions:
- issue: வஞ்சகர்களை விலக்கும் பேச்சாளரின் உறுதிமொழியின் வரம்பு
  choice: சங்கீதப் பேச்சாளராகிய அரசன் தன் வீட்டிலும் தன் முன்னிலையிலும் யார் தொடர்ந்து இருக்கலாம் என்பதைக் குறித்த தனிப்பட்ட மற்றும் அரசருக்குரிய உறுதிமொழியாகவே மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: இதை நேரடியாகக் கடவுளுடைய வீட்டைப் பற்றிய பொதுக் கூற்றாகவோ, உள்ளார்ந்த ஒழுக்கத் தூய்மையை மட்டும் குறிக்கும் உருவகமாகவோ விரிவுபடுத்துதல்.
  rationale: சங்கீதம் 101 நீதியான ஆட்சியையும் வீட்டின் ஒழுங்கையும் பற்றிய அரசனின் தீர்மானமாக அமைந்துள்ளது. ‘என் வீடு,’ ‘என் கண்கள்’ என்ற முதலாம் நபர் உடைமைச் சொற்கள் ஆன்மிகமயமாக்கப்படாமலும் பொதுமைப்படுத்தப்படாமலும் பாதுகாக்கப்பட்டுள்ளன.
translation_notes:
  register: நவீன நிலையான தமிழில், சாதாரண வாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதத்துக்கேற்ற கண்ணியமான நடையிலும் வடிவமைக்கப்பட்டது. இரு செயற்பெயரெச்சங்களின் இணை அமைப்பு ‘செய்கிறவன் / பேசுகிறவன்’ என்று காக்கப்பட்டுள்ளது; יִכּוֹן என்பதிலுள்ள ‘நிற்றல்/நிலைபெறுதல்’ சார்ந்த உண்மையான பொருள் விரிவு அடிக்குறிப்பில் வெளிப்படுத்தப்பட்டுள்ளது.
