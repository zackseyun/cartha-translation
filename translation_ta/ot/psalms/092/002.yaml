lexical_decisions:
- source_word: לְהַגִּיד
  choice: அறிவிப்பது
  rationale: לְ உடனான வினையெச்ச வடிவம் முந்தைய வசனத்தின் ‘நல்லது’ என்ற கருத்தைத் தொடர்ந்து நோக்கம் அல்லது செயலைக் குறிக்கிறது. ‘அறிவிப்பது’ என்பது பொதுவாக எடுத்துரைக்கும் பொருளையும் தமிழ் வாக்கியத் தொடர்ச்சியையும் காக்கிறது.
- source_word: בַּבֹּקֶר
  choice: காலையில்
  rationale: குறிப்பிட்ட காலப்பொழுதைக் குறிக்கும் எபிரெய முன்னிடைச்சொல் அமைப்புக்கு இயல்பான நவீனத் தமிழ் இணை; இரவுகளுடனான கவிதைமிகு கால எதிரிணையையும் காக்கிறது.
- source_word: חַסְדֶּךָ
  choice: உமது மாறாத அன்பு
  rationale: חֶסֶד என்பதில் அன்பு, உறுதியான பற்றுறுதி, நிலைத்த நன்மை ஆகிய நுணுக்கங்கள் உள்ளன. ‘மாறாத அன்பு’ அவற்றை எளிய, இயல்பான தமிழில் வெளிப்படுத்துகிறது; ‘உடன்படிக்கை அன்பு’ என்று பொருளை அளவுக்கு மீறிக் குறிப்பாக்கவில்லை.
- source_word: וֶאֱמוּנָתְךָ
  choice: உமது உண்மைத்தன்மை
  rationale: இங்கு אֱמוּנָה என்பது நம்பத்தகுந்த நிலைத்தன்மையையும் உண்மையாய் இருப்பதையும் குறிக்கிறது. ‘உண்மைத்தன்மை’ தெய்வீக நம்பகத்தன்மையை இயல்பாக எடுத்துரைக்கிறது.
- source_word: בַּלֵּילוֹת
  choice: இரவுகளில்
  rationale: எபிரெயச் சொல் பன்மையில் உள்ளது. ‘இரவுகளில்’ அந்த எண்ணிக்கையையும் ‘காலையில்’ என்பதுடனான கவிதை இணைப்பையும் நேரடியாகக் காக்கிறது.
