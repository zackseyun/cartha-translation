translation_notes:
  register: நவீன நிலையான தமிழில் இயல்பாகவும் கண்ணியமாகவும் அமைக்கப்பட்டுள்ளது. கடவுளை நோக்கிய உரைக்கு மரியாதை தரும் ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. வசனம் முந்தைய வசனத்தின் இலக்கணத் தொடர்ச்சி என்பதால் ‘அறிவிப்பது’ என்ற வடிவம் வைக்கப்பட்டுள்ளது.
