lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசைத் தொடர்புடைய சங்கீதத் தலைப்புச் சொல்லுக்கான மரபான, இயல்பான தமிழ் இணை; שִׁיר என்பதிலிருந்து வேறுபடுத்தியும் வைக்கிறது.
- source_word: שִׁיר
  choice: பாடல்
  rationale: பொதுவாக ‘பாடல்’ என்று பொருள்படும் எபிரெயச் சொல்; இணையாக வரும் இரு பெயர்ச்சொற்களையும் ஒன்றாகச் சுருக்காமல் காக்கிறது.
- source_word: לְיוֹם
  choice: நாளுக்கான
  rationale: לְ முன்னிடைச்சொல் இங்கு நோக்கம் அல்லது தொடர்பைக் குறிக்கிறது; தலைப்பில் இயல்பான தமிழுக்காக அடுத்த சொல்லோடு இணைத்து வழங்கப்படுகிறது.
- source_word: הַשַּׁבָּת
  choice: ஓய்வுநாள்
  rationale: குறிப்பிட்ட சபாத் நாளைக் குறிக்கிறது; நவீன தமிழில் தெளிவாகவும் மரியாதையான நடையிலும் ‘ஓய்வுநாள்’ என வழங்கப்படுகிறது.
theological_decisions:
- issue: இவ்வசனம் கவிதை வரியா அல்லது தலைப்பா
  choice: வினைச்சொல் சேர்க்காமல், ‘சங்கீதம்; ஓய்வுநாளுக்கான பாடல்’ என்ற தலைப்பாக வழங்குதல்
  alternative: தலைப்புக் குறியீடின்றி முதல் கவிதை வரியாக வழங்குதல்
  rationale: எபிரெய உரையில் வினைமுற்று இல்லாமல் பெயர்ச்சொல் கூறுகள் மட்டுமே உள்ளன; சங்கீத நூலில் இதன் இலக்கியப் பணியைத் தலைப்பு நடை சிறப்பாகப் பிரதிபலிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான சங்கீதத் தலைப்பாக அமைக்கப்பட்டுள்ளது. ‘சங்கீதம்’ மற்றும் ‘பாடல்’ என்ற இரு சொற்களும் தனித்தனியாகப் பாதுகாக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத வினைச்சொல் சேர்க்கப்படவில்லை.
