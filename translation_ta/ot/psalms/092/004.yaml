base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/004.yaml
  text: For you have made me glad[a], O Yahweh, by your work[b]; at the works of your hands I sing for joy.
translation:
  language: ta
  text: ஏனெனில், யாவே, உமது செயலால் என்னை மகிழச் செய்தீர்; உமது கைகளின் செயல்களைக் குறித்து நான் மகிழ்ச்சியுடன் பாடுகிறேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் மகிழ்ச்சியுடன் ஆர்ப்பரிக்கிறேன்.” எபிரெய வினைச்சொல் மகிழ்ச்சிப் பாடலையோ உரத்த மகிழ்ச்சிக் குரலையோ குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள துதியின் காரணத்தை அறிமுகப்படுத்தும் எபிரெய causal இணைப்பை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: שִׂמַּחְתַּנִי
  choice: என்னை மகிழச் செய்தீர்
  rationale: שׂמח என்பதன் பியேல் நிறைவுவினையும் முதலாம் நபர் ஒருமை பின்னொட்டும் கொண்டுள்ள ‘என்னை மகிழ்ச்சியடையச் செய்தீர்’ என்ற காரணவினைப் பொருளைத் தெளிவாகக் காக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைத் திருப்பெயரான நான்கெழுத்துப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் எளிதாக வாசிக்கக்கூடிய ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּפָעֳלֶךָ
  choice: உமது செயலால்
  rationale: בְּ என்ற முன்னொட்டை இங்கு காரண அல்லது கருவிப் பொருளில் கொண்டு, சங்கீதக்காரரை மகிழ்வித்தது யாவேயின் செயல் என்பதை வெளிப்படுத்துகிறது; פֹּעַל என்பதன் ஒருமையையும் காக்கிறது.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: உமது கைகளின் செயல்களைக் குறித்து
  rationale: ‘கைகளின் செயல்கள்’ என்ற எபிரெய மொழிப்படிமத்தைத் தக்கவைத்து, அவையே மகிழ்ச்சிப் பாடலுக்கான பொருள் அல்லது தூண்டுதல் என்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: אֲרַנֵּן
  choice: நான் மகிழ்ச்சியுடன் பாடுகிறேன்
  rationale: רנן என்பதன் பியேல் வடிவம் மகிழ்ச்சிப் பாடலையோ உரத்த மகிழ்ச்சிக் குரலையோ குறிக்கலாம். சங்கீதத் துதிச் சூழலில் ‘மகிழ்ச்சியுடன் பாடுகிறேன்’ இயல்பாக உள்ளது; நிகழ்கால வடிவம் சூழலின் விளைவுநிலையை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைத் திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல எபிரெய உரை இறைவனின் தனிப்பட்ட திருப்பெயரையே பயன்படுத்துகிறது. அதைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் வேறுபாட்டைக் காக்கிறது; ‘யாவே’ என்பது தற்போதைய ஆய்வுகளுக்கு ஏற்ற, தமிழில் இயல்பாக வாசிக்கக்கூடிய வடிவம்.
translation_notes:
  register: நவீன நிலையான தமிழில், மரியாதையும் கவித்துவமும் கொண்ட எளிய நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனைச் சுட்டும் இரண்டாம் நபர் வடிவங்கள் ‘உமது/செய்தீர்’ என மரியாதைப் பன்மையில் அமைந்துள்ளன; ‘கைகளின் செயல்கள்’ என்ற மூல உருவகம் அப்படியே காக்கப்பட்டுள்ளது.
