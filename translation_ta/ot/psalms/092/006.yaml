lexical_decisions:
- source_word: אִישׁ בַּעַר
  choice: விலங்குபோன்ற அறிவற்ற மனிதன்
  rationale: בַּעַר என்பது வெறுமனே தகவலறியாதவனை அல்ல, புரிந்துணர்வில் விலங்கைப்போல் மந்தமானவனைச் சித்தரிக்கிறது. தமிழில் ‘மிருகத்தனமானவன்’ என்பது கொடூரமானவன் என்ற தவறான பொருளைத் தரக்கூடும்; ஆகவே மூல உருவகத்தையும் கருத்தையும் தெளிவாகக் காக்க இந்தச் சொற்றொடர் தேர்ந்தெடுக்கப்பட்டது. אִישׁ என்பதன் ஒருமை ஆண்பால் வடிவமும் ‘மனிதன்’ என்று பாதுகாக்கப்பட்டுள்ளது.
- source_word: יֵדָע
  choice: அறியமாட்டான்
  rationale: ידע என்பதன் நேரடியான ‘அறிதல்’ என்ற பொருளை இயல்பான தமிழில் தருகிறது; அடுத்த அடியின் ‘புரிந்துகொள்ளுதல்’ என்பதிலிருந்து உள்ள நுண்ணிய வேறுபாட்டையும் காக்கிறது.
- source_word: כְסִיל
  choice: மூடன்
  rationale: இது ஞான இலக்கியத்தில் அறிவிலும் ஒழுக்கத் தீர்மானத்திலும் மூடத்தனம் கொண்டவரைக் குறிக்கும் வழக்கமான சொல். ‘மூடன்’ அந்த இலக்கியத் தொனியைச் சுருக்கமாகக் காக்கிறது.
- source_word: יָבִין
  choice: புரிந்துகொள்ளமாட்டான்
  rationale: בין குறிக்கும் பகுத்துணர்ந்து புரிந்துகொள்ளும் கருத்தை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது; முதல் அடியிலுள்ள ‘அறியமாட்டான்’ என்பதுடன் கவிதை இணைநிலையையும் பேணுகிறது.
- source_word: אֶת זֹאת
  choice: இதை
  rationale: சுட்டுப்பெயர் சூழலில் கூறப்படும் இந்தக் காரியத்தைச் சுட்டுகிறது. தமிழில் ‘இதை’ என்பது நேரடியும் இயல்பானதுமான மொழிபெயர்ப்பு; இறுதியிலுள்ள முக்காற்புள்ளி அடுத்து வரும் விளக்கத்தை எதிர்நோக்கச் செய்கிறது.
