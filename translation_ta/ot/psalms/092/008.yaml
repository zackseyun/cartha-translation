reference: Psalms 92:8
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: וְ/אַתָּ֥ה מָר֗וֹם לְ/עֹלָ֥ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/008.yaml
  text: But you are on high forever[a], O Yahweh.
translation:
  language: ta
  text: ஆனால் யாவே, நீரோ என்றென்றும் உயரத்தில் இருக்கிறீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: ஆனால் ... நீரோ
  rationale: முந்தைய வசனத்தில் அழிந்துபோகும் தீயவர்களுக்கு மாறாக யாவேயின் நிலையை இது எடுத்துக்காட்டுகிறது. தனிப்பெயர்ச்சொல்லின் வலியுறுத்தலை ‘நீரோ’ இயல்பாக வெளிப்படுத்துகிறது; எபிரெய வினையற்ற வாக்கியத்துக்குத் தமிழில் ‘இருக்கிறீர்’ சேர்க்கப்பட்டுள்ளது.
- source_word: מָרוֹם
  choice: உயரத்தில்
  rationale: இச்சொல் உயர்ந்த இடம் அல்லது மேன்மையான நிலை என்ற இரண்டையும் உணர்த்தக்கூடும். ‘உயரத்தில்’ என்பது இடஞ்சார்ந்த உருவகத்தைப் பாதுகாத்து, அதை ‘உன்னதமானவர்’ என்ற பட்டமாக மாற்றுவதைத் தவிர்க்கிறது.
- source_word: לְ/עֹלָם
  choice: என்றென்றும்
  rationale: முடிவில்லாத நிலைத்த தொடர்ச்சியை இயல்பான, சங்கீதத்திற்கேற்ற நவீன தமிழில் தெரிவிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பொதுப் பட்டத்தால் மாற்றாமல், பரவலாக ஏற்கப்படும் ‘யாவே’ என்ற ஒலிபெயர்ப்பால் தனிப்பட்ட இறைப்பெயராகக் காட்டுகிறது.
theological_decisions:
- issue: நேரடி விளியில் வரும் יהוה என்ற இறைப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்; யெகோவா
  rationale: மூலத்தில் தனிப்பட்ட இறைப்பெயர் நேரடியாக வருகிறது. ‘யாவே’ என்பது பெயரின் தன்மையைப் பாதுகாக்கிறது; ‘ஆண்டவர்’ என்ற பட்டமாக மாற்றுவதையும், பிற்கால வடிவமான ‘யெகோவா’வைப் பயன்படுத்துவதையும் தவிர்க்கிறது.
- issue: מָרוֹם என்பதை பட்டமாகவா, நிலையைச் சுட்டுவதாகவா வாசிப்பது
  choice: உயரத்தில் இருக்கிறீர்
  alternative: உன்னதமானவர்
  rationale: மூலச்சொல் உயரம் அல்லது உயர்ந்த நிலையைச் சுட்டும் பெயர்ச்சொல். அதை இறைப்பட்டமாக மட்டும் உறுதிப்படுத்தாமல், மூலத்தின் இடஞ்சார்ந்த-மேன்மைசார்ந்த உருவகத் திறப்பைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; சங்கீதத்திற்குரிய கண்ணியமான ஓசையுடன், பொதுவாசகர்களுக்குப் புரியும் சொற்கள் பயன்படுத்தப்பட்டுள்ளன. ‘நீர்/இருக்கிறீர்’ என்ற மரியாதை ஒருமை நேரடி விளியை இயல்பாக்குகிறது.
