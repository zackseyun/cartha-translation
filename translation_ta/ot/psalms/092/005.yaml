lexical_decisions:
- source_word: מַה גָּדְלוּ
  choice: எவ்வளவு மகத்தானவை
  rationale: מַה இங்கு வினாவாக அல்லாமல் வியப்பை வெளிப்படுத்துகிறது; גָּדְלוּ நிலைத்தன்மைப் பொருளில் ‘மகத்தானவை’ என இயல்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: מַעֲשֶׂיךָ
  choice: உமது செயல்கள்
  rationale: מַעֲשֶׂה என்பது செயல்கள் அல்லது படைப்புகள் எனப் பொருள்படலாம். படைப்பு மற்றும் பராமரிப்பு உட்பட இறைவனின் செயல்களின் பரந்த பொருளை ‘செயல்கள்’ தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைப் பெயரான நான்கு எழுத்துப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: מְאֹד
  choice: மிகவும்
  rationale: பின்வரும் பண்பை வலுப்படுத்தும் சொல்லை நவீனத் தமிழில் நேரடியாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: עָמְקוּ
  choice: ஆழமானவை
  rationale: இது இங்கு நிலைத்தன்மைப் பொருளில் வருகிறது; ‘ஆழமானவை’ என்பது உருவகத்தையும் கவிதைத் தன்மையையும் காக்கிறது.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: உமது எண்ணங்கள்
  rationale: מַחְשָׁבָה என்பதன் அடிப்படைப் பொருளான எண்ணங்களைத் தெளிவாக வழங்குவதுடன், திட்டங்கள் அல்லது நோக்கங்கள் என்ற சாத்தியமான பொருளையும் அடிக்குறிப்பில் பாதுகாக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூல உரை தனிப்பட்ட இறைப் பெயரையே பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ஒலிபெயர்த்துள்ளோம்.
- issue: מַחְשְׁבֹתֶיךָ என்பதன் பொருள் வரம்பு
  choice: உமது எண்ணங்கள்
  alternative: உமது திட்டங்கள்; உமது நோக்கங்கள்
  rationale: ‘எண்ணங்கள்’ என்பது மூலச்சொல்லின் பரந்த கவிதைப் பொருளைத் தக்கவைத்து, இறை ஞானம் மற்றும் இறை நோக்கம் ஆகிய இரண்டையும் முன்கூட்டியே ஒன்றாகச் சுருக்கிவிடாமல் விடுகிறது.
translation_notes:
  register: நவீன, தரமான, கண்ணியமான தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய ஒருமை இரண்டாம் நபர் வடிவத்துக்கு மரியாதைத் தொனியுடன் ‘உமது’ தேர்ந்தெடுக்கப்பட்டது. எபிரெயக் கவிதையின் இரு இணை வியப்புக் கூறுகள் இயல்பான தமிழ் நிறுத்தக்குறிகளுடன் பாதுகாக்கப்பட்டுள்ளன.
