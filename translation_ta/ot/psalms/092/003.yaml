  text: On the ten-stringed instrument and on the harp[b][a], with melody on the lyre.
translation:
  language: ta
  text: பத்துநரம்பு இசைக்கருவியிலும், நெபேல் இசைக்கருவியிலும்,[a] கின்னோர் இசைக்கருவியில் ஒலிக்கும் இசைநாதத்தோடும்.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: நெபேல், கின்னோர் என்னும் எபிரெய நரம்பிசைக் கருவிகள் துல்லியமாக எவ்வகையைச் சேர்ந்தவை என்பது உறுதியாகத் தெரியவில்லை. நெபேல் ‘யாழ்’, ‘வீணை’ அல்லது ‘லூட்’ என்றும், கின்னோர் சில மொழிபெயர்ப்புகளில் ‘யாழ்’ என்றும் வழங்கப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கின்னோர் இசைக்கருவியில் தியானத்தோடும்.” הִגָּיוֹן என்ற எபிரெயச் சொல் தியானம், முணுமுணுப்பு, அல்லது எதிரொலிக்கும் இசைநாதம் ஆகியவற்றைக் குறிக்கலாம்; இங்கு இசை சார்ந்த பொருள் சூழலுக்கு மிகவும் பொருந்துகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵי
  choice: இசைக்கருவியிலும்
  rationale: இசைச் சூழலில் עַל கருவியை வாசித்தல் அல்லது கருவியின் துணையைக் குறிக்கிறது. தமிழில் கருவிப் பெயருடன் ‘-இல்/இலும்’ என்பது இயல்பான வடிவம்; எபிரெயப் பட்டியலின் அமைப்பும் இதனால் ஓரளவு தக்கவைக்கப்படுகிறது.
- source_word: עָשׂוֹר
  choice: பத்துநரம்பு இசைக்கருவி
  rationale: இங்கு இது ‘பத்து’ என்ற எண்ணை மட்டும் அல்ல, பத்து நரம்புகளைக் கொண்ட ஓர் இசைக்கருவியைக் குறிக்கிறது. கருவியின் துல்லிய வகையை ஆதாரமின்றி நிர்ணயிக்காமல் பொருளைத் தெளிவாக்குகிறது.
- source_word: וַעֲלֵי
  choice: …இலும்
  rationale: וַ־ இணைப்பையும் மீண்டும் வரும் עֲלֵי அமைப்பையும் தமிழ் இணைநிலைப் பட்டியலாகப் பிரதிபலிக்கிறது.
- source_word: נָבֶל
  choice: நெபேல் இசைக்கருவி
  rationale: இந்தப் பழங்கால நரம்பிசைக் கருவியை ‘யாழ்’, ‘வீணை’ போன்ற குறிப்பிட்ட தமிழ்க் கருவியுடன் தவறாக ஒப்பிடாமல், எபிரெயப் பெயரை ஒலிபெயர்த்து அதன் நிச்சயமின்மையைப் பாதுகாக்கிறது.
- source_word: הִגָּיוֹן
  choice: இன்னிசை
  rationale: சொல் தியானம், முணுமுணுப்பு, ஒலித்தல் அல்லது இசைநாதம் ஆகிய பொருட்களைக் கொள்ளலாம். சுற்றியுள்ள இசைக்கருவிகளின் சூழலில் இசைநாதப் பொருள் மிகவும் இயல்பாக இருப்பதால் ‘இன்னிசை’ தேர்ந்தெடுக்கப்பட்டது; மாற்றுப் பொருள் அடிக்குறிப்பில் வைக்கப்படுகிறது.
- source_word: בְּכִנּוֹר
  choice: கின்னோர் இசைக்கருவியில்
  rationale: בְּ கருவியைக் கொண்டு வாசிப்பதைச் சுட்டுகிறது. כִּנּוֹר என்பதையும் ஓர் அறியப்பட்ட நவீன தமிழ்க் கருவிப் பெயரால் மிகையாகக் குறிப்பாக்காமல் ஒலிபெயர்த்துள்ளது.
