translation_notes:
  register: நவீனத் தரத் தமிழில், கவிதைக்கேற்ற சுருக்கமும் கண்ணியமும் பேணப்பட்டுள்ளன. பழங்காலக் கருவிகளைத் துல்லியமற்ற நவீன அல்லது தமிழ்ப் பாரம்பரியக் கருவிப் பெயர்களுடன் ஒப்பிடாமல் நெபேல், கின்னோர் என்று ஒலிபெயர்க்கப்பட்டுள்ளது. அடிக்குறிப்பு குறிகள் இரண்டும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
