  yaml_path: translation/ot/psalms/092/011.yaml
  text: My eye has looked on my foes[b][a]; my ears hear of the evildoers who rise against me.
translation:
  language: ta
  text: என்னைப் பகையுடன் கண்காணிப்பவர்களை என் கண் நோக்கியது[a]; எனக்கு எதிராக எழும்புகிற தீமை செய்வோரை என் காதுகள் கேட்கும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் பகைவர்களை என் கண் நோக்கியது.” எபிரெயச் சொல் இன்னும் சொல்லுக்குச் சொல் முறையில், பகைமையுடன் கவனிப்பவர்களையோ கண்காணிப்பவர்களையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “என் காதுகள் கேட்கின்றன” அல்லது “என் காதுகள் கேட்டன.” எபிரெய வினைவடிவத்தின் காலநோக்கை இங்கு ஒன்றுக்கு மேற்பட்ட விதங்களில் புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט עֵינִי
  choice: என் கண் கண்டது
  rationale: வினைச்சொல்லின் ‘நோக்குதல்/காணுதல்’ என்ற நேரடியான பொருளையும், எபிரெயில் உள்ள ஒருமை ‘என் கண்’ என்ற கவித்துவ வடிவையும் காக்கிறது.
- source_word: בְּשׁוּרָי
  choice: என்னைப் பகையுடன் கண்காணிப்பவர்கள்
  rationale: שׁוּר என்பதிலிருந்து வந்த இச்சொல் ‘கவனிப்பவர்கள்’ அல்லது சூழலில் ‘பகைவர்கள்’ எனப் பொருள்படலாம். பகைமைச் சூழலையும் ‘கண்காணித்தல்’ என்ற சொற்பொருளையும் ஒருங்கே வெளிப்படுத்துகிறது.
- source_word: בַּקָּמִים עָלַי
  choice: எனக்கு எதிராக எழும்புகிறவர்கள்
  rationale: קום + עלי என்பதிலுள்ள எதிர்த்து எழும் உருவகத்தையும் பகைமையான எதிர்ப்பையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מְרֵעִים
  choice: தீமைசெய்வோர்
  rationale: רעע என்பதன் Hiphil பங்கேற்பு வடிவம் தீமை செய்கிறவர்களையோ தீங்கு விளைவிக்கிறவர்களையோ குறிக்கிறது; ‘தீமைசெய்வோர்’ அதன் ஒழுக்கநெறிசார் வலிமையைத் தக்கவைக்கிறது.
- source_word: תִּשְׁמַעְנָה אָזְנָי
  choice: என் காதுகள் கேட்கும்
  rationale: ‘காதுகள்’ என்பதோடு இயையும் வினை வடிவத்தை எதிர்கால/முற்றுப்பெறாத நோக்கில் மொழிபெயர்த்து, மூலத்தின் கவித்துவமான உடலுறுப்பு உருவகத்தைக் காக்கிறது.
