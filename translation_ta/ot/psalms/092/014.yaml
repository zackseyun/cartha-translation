id: PSA.92.14
reference: Psalms 92:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: ע֭וֹד יְנוּב֣וּ/ן בְּ/שֵׂיבָ֑ה דְּשֵׁנִ֖ים וְ/רַֽעֲנַנִּ֣ים יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/014.yaml
  text: They still bear fruit in old age[c][b][a]; they are full of sap and green.
translation:
  language: ta
  text: முதுமையிலும் தொடர்ந்து கனிதருவார்கள்[a]; செழிப்பாகவும் பசுமையாகவும் இருப்பார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “முதுமையிலும் தொடர்ந்து கனிதருகிறார்கள்; செழிப்பாகவும் பசுமையாகவும் இருக்கிறார்கள்” என்றும் மொழிபெயர்க்கலாம். எபிரெய நிறைவுறா வினைகள் இங்கு பொதுவான நிகழ்நிலையாகவோ வருங்காலமாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: עוֹד
  choice: தொடர்ந்து
  rationale: முந்தைய வசனங்களின் மர உருவகத்தில் காணப்படும் உயிர்த்துடிப்பும் கனிதருதலும் முதுமையிலும் நீடிப்பதை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: יְנוּבוּן
  choice: கனிதருவார்கள்
  rationale: இந்த வினை தாவரம் விளைச்சல் தருவதைக் குறிக்கிறது; சுற்றுப்பகுதியிலுள்ள மர உருவகத்துக்கு ‘கனிதருவார்கள்’ துல்லியமாகப் பொருந்துகிறது.
- source_word: בְּשֵׂיבָה
  choice: முதுமையிலும்
  rationale: சொல் நரைமுடியைக் குறித்தாலும், இங்கு முதுமைப் பருவம் என்ற காலப்பொருளில் வருகிறது. עוֹד என்பதன் தொடர்ச்சிப் பொருளையும் ‘-இலும்’ இயல்பாக வலுப்படுத்துகிறது.
- source_word: דְּשֵׁנִים
  choice: செழுமை நிறைந்தவர்களாக
  rationale: சொல்லர்த்தமாக ‘கொழுத்த’ அல்லது ‘வளமிக்க’ என்று பொருள்படலாம். மர உருவகத்தில் நன்கு ஊட்டம்பெற்ற, உயிர்ச்சாறுள்ள செழிப்பை ‘செழுமை நிறைந்த’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: רַעֲנַנִּים
  choice: பசுமை நிறைந்தவர்களாக
  rationale: புதிய, செழிப்பான தாவரப் பசுமையைக் குறிக்கிறது; மர உருவகத்தைத் தெளிவாகத் தக்கவைக்கிறது.
- source_word: יִהְיוּ
  choice: இருப்பார்கள்
  rationale: தமிழின் எதிர்கால வடிவம் பொதுவான நிலையான உண்மையையும் எதிர்காலத் தொடர்ச்சியையும் இயல்பாகக் குறிக்க முடிவதால் எபிரெய வினையின் கால/நிலை நெகிழ்வைத் தக்கவைக்கிறது.
theological_decisions:
- issue: கவிதை மொழியிலுள்ள எபிரெய நிறைவுறா வினைகளின் காலம்/நிலை
  choice: ‘கனிதருவார்கள்; ... இருப்பார்கள்’ என்ற தமிழ் எதிர்கால வடிவம்
  alternative: ‘கனிதருகிறார்கள்; ... இருக்கிறார்கள்’ என்ற நிகழ்காலப் பொதுமை வடிவம்
  rationale: இவ்வசனம் நீதிமான்களைப் பற்றிய பொதுவான உண்மையாகவும் தொடரும் அல்லது வருங்கால நிலையாகவும் வாசிக்கப்படலாம். தமிழ் எதிர்கால வடிவம் இந்த இரு நிழற்பொருள்களையும் இயல்பாக ஏந்துகிறது; அடிக்குறிப்பு நிகழ்கால வாசிப்பையும் வெளிப்படையாகப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. ‘கொழுத்தவர்கள்’ என்ற நேரடிச் சொல்லாக்கம் தாவர உருவகத்தைத் தமிழில் தவறாகப் புரியவைக்கக்கூடும் என்பதால் ‘செழுமை நிறைந்தவர்கள்’ பயன்படுத்தப்பட்டது. மர உருவகம் ‘கனிதருதல்’ மற்றும் ‘பசுமை’ வழியாகத் தெளிவாகத் தக்கவைக்கப்பட்டுள்ளது.
