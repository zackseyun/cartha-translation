revisions:
- from: முதுமையிலும் அவர்கள் தொடர்ந்து கனிதருவார்கள்[a]; செழுமையும் பசுமையும் நிறைந்தவர்களாக இருப்பார்கள்.
  to: முதுமையிலும் தொடர்ந்து கனிதருவார்கள்[a]; செழிப்பாகவும் பசுமையாகவும் இருப்பார்கள்.
  rationale: The revision retains the draft’s sound treatment of the Hebrew imperfects and of the tree/plant imagery, while making the final pair of descriptors direct Tamil predicates. This more closely reflects the Hebrew parallelism and improves modern Tamil flow. The footnote continues to preserve the viable present/generic reading without treating it as the only possible interpretation.
