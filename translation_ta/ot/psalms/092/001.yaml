source:
  edition: WLC
  text: ט֗וֹב לְ/הֹד֥וֹת לַ/יהוָ֑ה וּ/לְ/זַמֵּ֖ר לְ/שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/001.yaml
  text: It is good to give thanks to Yahweh[a], and to sing praise to your name, O Most High,
translation:
  language: ta
  text: 'யாவேக்கு[a] நன்றி செலுத்துவதும்,

    உன்னதமானவரே, உமது பெயரைப் புகழ்ந்து பாடுவதும் நல்லது.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: “யாவே”—தேவனுடைய தனிப்பெயர்.'
    reason: divine_name
lexical_decisions:
- source_word: טוֹב
  choice: நல்லது
  rationale: இரண்டு வினைச்சொல் தொடர்களையும் மதிப்பிடும் பயனிலைப் பெயரடையாக இருப்பதால், வசனத்தின் முடிவில் ‘நல்லது’ என்று அமைப்பது இயல்பான தமிழிலும் எபிரெயக் கருத்திலும் பொருந்துகிறது.
- source_word: לְהוֹדוֹת
  choice: நன்றி செலுத்துவதும்
  rationale: சங்கீத வழிபாட்டுச் சூழலில் ידה என்பதன் முதன்மைக் கருத்தான நன்றி செலுத்துதலைத் தெளிவாகக் காட்டுகிறது; அடுத்த அரையடியில் வரும் இசைசார் புகழ்ச்சியிலிருந்து வேறுபாட்டையும் காக்கிறது.
- source_word: לַיהוָה
  choice: யாவேக்கு
  rationale: יהוה என்ற இறைத் தனிப்பெயரை பொதுப்பட்டமாக மாற்றாமல், ‘யாவே’ என்று ஒலிபெயர்த்து வழங்குகிறது.
- source_word: וּלְזַמֵּר
  choice: புகழ்ந்து பாடுவதும்
  rationale: זמר என்பதிலுள்ள இசையுடன் கூடிய புகழ்ச்சியை இயல்பான நவீன தமிழில் எடுத்துரைக்கிறது; இசைக்கருவி பயன்படுத்தப்பட்டதாகத் தேவையின்றி குறிப்பதில்லை.
- source_word: לְשִׁמְךָ
  choice: உமது பெயரை
  rationale: ‘பெயர்’ என்பதிலுள்ள அடையாளம், புகழ், உறவுசார் முக்கியத்துவம் ஆகியவற்றைச் சுருக்காமல் எபிரெய உருவகத்தைப் பாதுகாக்கிறது.
- source_word: עֶלְיוֹן
  choice: உன்னதமானவரே
  rationale: இது தேவனை நேரடியாக அழைக்கும் உயர்தன்மைப் பட்டம்; தமிழ் விளி வேற்றுமை அந்த அழைப்பை இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைத் திருப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல வசனம் இறைத் தனிப்பெயரையே நேரடியாகப் பயன்படுத்துகிறது. அதனைப் பொதுவான பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்தின் தனித்தன்மையைப் பாதுகாக்கிறது.
- issue: עֶלְיוֹן என்பதன் இலக்கணப் பங்கு
  choice: நேரடி அழைப்பாக ‘உன்னதமானவரே’
  alternative: பெயரடைப் பட்டமாக ‘உன்னதமானவர்’
  rationale: ‘உமது பெயர்’ என்ற இரண்டாம் நபர் முன்னிலையால், இங்கு தேவனை நேரடியாக அழைக்கும் விளி உணர்வு இயல்பாகத் தெரிகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்கேற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. எபிரெய இணை அமைப்பைத் தமிழில் இயல்பாக வைத்திருக்க இரண்டு தொழிற்பெயர் தொடர்களும் ‘நல்லது’ என்ற ஒரே பயனிலையுடன் இணைக்கப்பட்டுள்ளன.
