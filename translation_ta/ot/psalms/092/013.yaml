base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/013.yaml
  text: Planted in the house of Yahweh[b][a], they will flourish in the courts of our God.
translation:
  language: ta
  text: 'யாவேயின்[a] இல்லத்தில் நடப்பட்டவர்கள்,

    நம் கடவுளின் முற்றங்களில்[b] செழித்து வளர்வார்கள்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'எபிரெயத்தில்: YHWH.'
    reason: alternative_reading
  - marker: b
    text: 'அல்லது: ‘வெளிமுற்றங்களில்.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתוּלִים
  choice: நடப்பட்டவர்கள்
  rationale: செயப்பாட்டு வினையெச்சத்தின் பன்மைப் பொருளையும் செடி நடும் உருவகத்தையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: בְּבֵית
  choice: இல்லத்தில்
  rationale: בַּיִת என்பதன் அடிப்படைப் பொருளான ‘வீடு/இல்லம்’ என்பதைக் காக்கிறது; இச்சூழலில் அது யாவேயின் ஆலயத்தைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மெய்யெழுத்துப் பெயரான YHWH-ஐ ஒரு பட்டப்பெயரால் மாற்றாமல், தமிழில் இயல்பான ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: בְּחַצְרוֹת
  choice: முற்றங்களில்
  rationale: ஆலயத்தைச் சேர்ந்த திறந்த முற்றங்களைச் சுட்டும் חָצֵר என்பதன் பன்மைப் பொருளைத் தெளிவாக வழங்குகிறது.
- source_word: אֱלֹהֵינוּ
  choice: நம் கடவுளின்
  rationale: முதல் நபர் பன்மை உடைமைப் பின்னொட்டைக் கொண்ட எபிரெய வடிவை இயல்பான தமிழில் வழங்குகிறது.
- source_word: יַפְרִיחוּ
  choice: செழித்து வளர்வார்கள்
  rationale: முளைத்தல், பூத்தல், செழித்தல் ஆகிய நிழற்பொருள்களைக் கொண்ட வினையை, தாவர உருவகத்தைத் தக்கவைத்து இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יהוה என்ற இறைப் பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: ஆண்டவர்
  rationale: மூலத்தில் தனிப்பட்ட இறைப் பெயர் நேரடியாக உள்ளது; ஆகவே அதைப் பட்டப்பெயராக மாற்றாமல் ஒலிபெயர்த்து, குறிப்பில் மூல வடிவைத் தெரிவிக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்தோடும் பொதுவாசகர்களுக்குப் புரியும் இயல்போடும் வடிவமைக்கப்பட்டது. ‘இல்லம்’ எபிரெய உருவகத்தைப் பாதுகாக்கிறது; ‘செழித்து வளர்வார்கள்’ தாவர உருவகத்தின் உயிர்ப்பை இயல்பாக எடுத்துரைக்கிறது.
