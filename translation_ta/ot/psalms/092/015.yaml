reference: Psalms 92:15
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: לְ֭/הַגִּיד כִּֽי יָשָׁ֣ר יְהוָ֑ה צ֝וּרִ֗/י וְֽ/לֹא עלת/ה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/015.yaml
  text: to declare that Yahweh is upright; he is my rock[a], and there is no unrighteousness in him.
translation:
  language: ta
  text: யாவே நேர்மையானவர் என்றும், அவர் என் கன்மலை என்றும், அவரிடம் அநீதி எதுவுமில்லை என்றும் அறிவிக்கும்படி.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַגִּיד
  choice: அறிவிப்பதற்காக
  rationale: முந்தைய வசனங்களுடன் தொடரும் நோக்கத்தைக் குறிக்கும் எபிரெய முடிவிலியைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: כִּי
  choice: என்று
  rationale: இங்கு அறிவிக்கப்படும் செய்தியின் உள்ளடக்கத்தை அறிமுகப்படுத்துவதால், தமிழில் மேற்கோள் உள்ளடக்கத்தைக் குறிக்கும் ‘என்று’ இயல்பானது.
- source_word: יָשָׁר
  choice: நேர்மையானவர்
  rationale: தேவனுடைய ஒழுக்கச் செம்மையைச் சுட்டும் சொல்லின் பரந்த பொருளை நவீன தமிழில் தெளிவாகத் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: எபிரெய மூலத்தில் உள்ள தேவனுடைய தனிப்பெயரை ஒரு பட்டத்தால் மாற்றாமல் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: צוּרִי
  choice: என் கன்மலை
  rationale: சங்கீதங்களில் தேவனை உறுதியும் பாதுகாப்பும் அளிக்கும் பாறையாகக் காட்டும் மூல உருவகத்தை அப்படியே காக்கிறது.
- source_word: וְלֹא עַוְלָתָה בּוֹ
  choice: அவரிடம் அநீதி எதுவுமில்லை
  rationale: வினைச்சொல் இல்லாத எபிரெய மறுப்புக் கூற்றை இயல்பான தமிழில் வழங்கி, தேவனில் அநீதி இல்லை என்ற பொருளைக் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூல உரை தேவனுடைய தனிப்பெயரை நேரடியாகப் பயன்படுத்துகிறது; ஆகவே அதைப் பட்டமாக மாற்றாமல் ஒலிபெயர்ப்பது மூலத்துக்கு நெருக்கமானது.
- issue: צוּרִי என்ற உருவகம்
  choice: என் கன்மலை
  alternative: என் அடைக்கலம்
  rationale: ‘அடைக்கலம்’ உருவகத்தின் ஒரு விளைவை மட்டும் விளக்குகிறது; ‘கன்மலை’ மூலத்தின் கண்கூடான உருவகத்தையும் அதன் பரந்த சங்கீதப் பின்னணியையும் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் பேணப்பட்டுள்ளன. எபிரெய வசனத்தின் சுருக்கமான மூன்று கூற்றுகள் அரைப்புள்ளிகளால் பிரிக்கப்பட்டு, இறுதியில் நோக்கத்தைக் குறிக்கும் ‘அறிவிப்பதற்காக’ என்பதுடன் இணைக்கப்பட்டுள்ளன.
