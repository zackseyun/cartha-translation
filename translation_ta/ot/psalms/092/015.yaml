- from: யாவே நேர்மையானவர்; அவர் என் கன்மலை; அவரிடம் அநீதி[a] எதுவுமில்லை என்று அறிவிப்பதற்காக.
  to: யாவே நேர்மையானவர் என்றும், அவர் என் கன்மலை என்றும், அவரிடம் அநீதி எதுவுமில்லை என்றும் அறிவிக்கும்படி.
  rationale: The revision improves Tamil clause order by placing the purpose expression before the reported content in a natural finite construction. Repeated என்றும் makes all three Hebrew assertions clearly coordinate content of the declaration. The footnote anchor remains on அநீதி and preserves the English audit trail's lexical alternative.
  reviewer_model: gpt-5.6-terra
