  text: כִּ֤י הִנֵּ֪ה אֹיְבֶ֡י/ךָ יְֽהוָ֗ה כִּֽי הִנֵּ֣ה אֹיְבֶ֣י/ךָ יֹאבֵ֑דוּ יִ֝תְפָּרְד֗וּ כָּל פֹּ֥עֲלֵי אָֽוֶן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/009.yaml
  text: For behold[a], your enemies, O Yahweh— for behold, your enemies will perish; all workers of wickedness will be scattered.
translation:
  language: ta
  text: 'ஏனெனில், இதோ, யாவே, உமது பகைவர்கள்—

    ஏனெனில், இதோ, உமது பகைவர்கள் அழிந்துபோவார்கள்;

    தீமை செய்பவர்கள் அனைவரும் சிதறிப்போவார்கள்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “தீமை செய்பவர்கள் அனைவரும் பிரிந்துபோவார்கள்.” எபிரெயச் சொற்றொடரின் சொற்பொருள், “அக்கிரமத்தின் செய்பவர்கள் அனைவரும்.”
    reason: יִתְפָּרְדוּ என்பதன் ‘பிரிந்துபோதல்’ என்ற மாற்று நுணுக்கத்தையும், פֹּעֲלֵי אָוֶן என்பதன் நேரடியான கட்டமைப்பையும், தேவையற்ற காரணவினைப் பொருளின்றிப் பதிவு செய்கிறது.
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்துடன் உள்ள விளக்கத் தொடர்பைக் காக்கிறது; கவிதையில் இது வலியுறுத்தலையும் தருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்க்கும் எபிரெயச் சொல்லின் சுட்டிக்காட்டும், வலியுறுத்தும் தன்மையை இயல்பான உயர்நடைத் தமிழில் காக்கிறது.
- source_word: אֹיְבֶיךָ
  choice: உமது பகைவர்கள்
  rationale: யாவேயை நேரடியாக முன்னிலை ஒருமையில் விளிக்கும் எபிரெய வடிவத்தை மரியாதையான தமிழில் தருகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: திருப்பெயரைப் பொதுப்பட்டமாக மாற்றாமல், எபிரெய நான்கெழுத்துத் தெய்வீகப் பெயரைத் தமிழில் ஒலிபெயர்க்கிறது.
- source_word: כִּי הִנֵּה ... כִּי הִנֵּה
  choice: ஏனெனில், இதோ ... ஏனெனில், இதோ
  rationale: உறுதியையும் தீவிரத்தையும் உயர்த்தும் மூலமொழியின் திட்டமிட்ட மறுபடியுரைத்தலைச் சுருக்காமல் காக்கிறது.
- source_word: יֹאבֵדוּ
  choice: அழிந்துபோவார்கள்
  rationale: אבד என்பதன் அழிவு அல்லது ஒழிந்துபோதல் என்ற பொருளை, அழிவின் முறையைத் தேவையின்றி குறிப்பாக்காமல் தெரிவிக்கிறது.
- source_word: יִתְפָּרְדוּ
  choice: சிதறிப்போவார்கள்
  rationale: பிரிந்து பரவிப்போதலைக் குறிக்கும் התפעל வடிவத்தையும், தீயோரின் கூட்டுச் சிதைவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: அனைவரும்
  rationale: தீர்ப்பின் முழுமையான விரிவைத் தெளிவாகக் காக்கிறது.
- source_word: פֹּעֲלֵי אָוֶן
  choice: தீமை செய்பவர்கள்
  rationale: சொற்றொடரின் செயற்பாட்டு கருத்தை இயல்பான தமிழில் காக்கிறது; வெறும் ‘தீயவர்கள்’ என்பதைவிட மூலத்தின் ‘செய்பவர்கள்’ என்ற கூறை வெளிப்படுத்துகிறது.
theological_decisions:
- issue: יְהוָה என்ற திருப்பெயரை மொழிபெயர்த்தல்
  choice: யாவே
  alternative: கர்த்தர் / யெகோவா
  rationale: இவ்வசனம் திருப்பெயரான יהוה என்பதை நேரடியாகப் பயன்படுத்துவதால், அதை ஒரு பட்டமாக மாற்றாமல் ‘யாவே’ என்று ஒலிபெயர்க்கப்பட்டுள்ளது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான உயர்நடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தில் இருமுறை வரும் ‘ஏனெனில், இதோ’ அப்படியே காக்கப்பட்டு, கவிதை வரிகளாக அமைக்கப்பட்டுள்ளது. ‘உமது’ என்பது யாவேயை நோக்கிய நேரடி, மரியாதையான ஒருமை விளிப்பைத் தெளிவாக்குகிறது.
