  text: בִּ/פְרֹ֤חַ רְשָׁעִ֨ים כְּמ֥וֹ עֵ֗שֶׂב וַ֭/יָּצִיצוּ כָּל פֹּ֣עֲלֵי אָ֑וֶן לְ/הִשָּֽׁמְדָ֥/ם עֲדֵי עַֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/007.yaml
  text: When the wicked sprout like grass and all workers of wickedness flourish[b][a], it is so that they may be destroyed forever.
translation:
  language: ta
  text: தீயவர்கள் புல்லைப்போல் துளிர்ப்பதும், அக்கிரமம் செய்கிற அனைவரும் செழித்தோங்குவதும்[a], அவர்கள் என்றென்றும் அழிக்கப்படுவதற்காகவே[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: சொல்லுக்கு நெருக்கமாக, “அக்கிரமத்தைச் செய்கிற அனைவரும் பூத்துச் செழிப்பதும்.”
    reason: lexical_alternative
  - marker: b
    text: “அவர்கள் என்றென்றும் அழிக்கப்படுவதற்கே” அல்லது “அவர்களின் என்றென்றுமான அழிவுக்காக” என்றும் மொழிபெயர்க்கலாம்; எபிரெயச் சொற்றொடர் நோக்கத்தையோ விளைவையோ குறிக்கலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּפְרֹחַ
  choice: துளிர்க்கும்போது
  rationale: בְּ + வினையெச்சப் பெயரெச்ச வடிவம் காலச் சூழலைக் குறிக்கிறது. தொடர்ந்து வரும் புல் உருவகத்துக்கு இயல்பாக அமைய ‘துளிர்க்கும்போது’ என மொழிபெயர்க்கப்பட்டது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: தீய பண்புடைய மனிதர்களை ஒரு வகுப்பாகக் குறிக்கும் பன்மைச் சொல்; நவீன தமிழில் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: כְּמוֹ עֵשֶׂב
  choice: புல்லைப்போல்
  rationale: வேகமாக வளர்ந்தாலும் விரைவில் வாடும் தாவர உருவகத்தை எளிய, நேரடியான தமிழில் காக்கிறது.
- source_word: וַיָּצִיצוּ
  choice: செழித்தோங்கும்போதும்
  rationale: צוץ என்பதன் துளிர்த்தல் அல்லது பூத்தல் என்ற தாவரப் படிமத்தையும், வெளிப்படையான வளமையையும் ‘செழித்தோங்கு’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: அக்கிரமம் செய்கிற அனைவரும்
  rationale: ‘அக்கிரமத்தைச் செய்பவர்கள் அனைவரும்’ என்ற எபிரெயக் கட்டமைப்பையும் அறநெறிச் சுமையையும் தெளிவான நடப்புத் தமிழில் தருகிறது.
- source_word: לְהִשָּׁמְדָם
  choice: அவர்கள் ... அழிக்கப்படுவதற்காகவே
  rationale: நிஃபால் வினையெச்சப் பெயரின் செயப்பாட்டு உணர்வையும், לְ குறிக்கும் நோக்கம் அல்லது விளைவு சார்ந்த தொடர்பையும் காக்கிறது; ‘வே’ இறுதித் தீர்ப்பை நோக்கிய வலியுறுத்தலைத் தருகிறது.
- source_word: עֲדֵי עַד
  choice: என்றென்றும்
  rationale: முடிவில்லாத நிலைத்த காலத்தைச் சுட்டும் எபிரெய மரபுத்தொடருக்கு இயல்பான தமிழ் இணை.
theological_decisions:
- issue: தீயவர்களின் செழிப்பு வெறும் தற்காலிகக் காட்சியா, அல்லது அவர்களின் இறுதி அழிவுடன் நோக்கம்/விளைவு சார்ந்து இணைக்கப்பட்டுள்ளதா?
  choice: ‘அவர்கள் என்றென்றும் அழிக்கப்படுவதற்காகவே அது நிகழ்கிறது’ என்று நோக்கம்/விளைவு உறவைத் தெளிவாக வைத்தல்
  alternative: ‘அவர்களின் என்றென்றுமான அழிவுக்காக’ அல்லது ‘என்றென்றும் அழிக்கப்படுவதற்கே’
  rationale: לְהִשָּׁמְדָם தீயவர்களின் செழிப்பை அவர்களுடைய இறுதி அழிவுடன் இணைக்கிறது. மொழிபெயர்ப்பு அந்த இறையியல் பதற்றத்தைக் காக்கிறது; அதேவேளை எபிரெயத்தில் வெளிப்படையாக இல்லாத தெய்வீகச் செய்பவரைச் சேர்ப்பதில்லை. நோக்கமா விளைவா என்ற நுண்ணிய தெளிவின்மை அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்கு எளிதில் புரியும் கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘துளிர்’ மற்றும் ‘செழித்தோங்கு’ மூலம் தாவர உருவகம் காக்கப்பட்டுள்ளது. ‘அக்கிரமம்’ என்பது அறநெறிச் சுமையைக் காக்கும் பரவலாகப் புரியக்கூடிய சொல்.
