source:
  edition: WLC
  text: וַ/תָּ֣רֶם כִּ/רְאֵ֣ים קַרְנִ֑/י בַּ֝לֹּתִ֗י בְּ/שֶׁ֣מֶן רַעֲנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/010.yaml
  text: But you have exalted my horn like that of a wild ox[b][a]; I have been anointed with fresh oil.
translation:
  language: ta
  text: 'ஆனால், காட்டெருதின்[b] கொம்பைப்போல் என் கொம்பை உயர்த்தினீர்;

    புதிய எண்ணெயால் நான் நனைக்கப்பட்டேன்[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இதனை இன்னும் சொல்லுக்குச் சொல்லாக, “புதிய எண்ணெயால் நான் ஈரமாக்கப்பட்டேன்” அல்லது “புதிய எண்ணெயுடன் நான் கலக்கப்பட்டேன்” என்றும் மொழிபெயர்க்கலாம். இங்குள்ள எபிரெய வினை அரிதானது; அதன் துல்லியமான பொருள் விவாதத்திற்குரியது.
    reason: lexical_alternative
  - marker: b
    text: எபிரெய மொழியிலுள்ள ரெஏம் என்பது வலிமைமிக்க ஒரு காட்டு மாட்டினத்தைக் குறிக்கிறது; வழக்கமாக “காட்டெருது” என மொழிபெயர்க்கப்படுகிறது. சில பழைய மொழிபெயர்ப்புகள் இதனை “ஒற்றைக்கொம்பு விலங்கு” என்று வழங்கின.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּרֶם
  choice: உயர்த்தினீர்
  rationale: רום என்ற வேர்ச்சொல் ‘உயர்த்துதல்’ அல்லது ‘மேலோங்கச் செய்தல்’ என்பதைக் குறிக்கிறது. சூழலில் இது கடவுளை நேரடியாக முன்னிலைப்படுத்தும் இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம்; மரியாதைத் தமிழில் ‘உயர்த்தினீர்’ இயல்பாக உள்ளது.
- source_word: כִּרְאֵים
  choice: காட்டெருதின் கொம்பைப்போல்
  rationale: רְאֵם என்பது வலிமைமிக்க ஒரு காட்டு மாட்டினத்தைக் குறிக்கிறது; பழைய மொழிபெயர்ப்புகளிலுள்ள ‘ஒற்றைக்கொம்புக் குதிரை’ என்ற பொருள் தவறாக வழிநடத்தும். ஒப்பீடு ‘என் கொம்பு’ என்பதுடன் தொடர்புடையதால் தமிழில் ‘காட்டெருதின் கொம்பைப்போல்’ எனத் தெளிவாக்கப்பட்டுள்ளது.
- source_word: קַרְנִי
  choice: என் கொம்பை
  rationale: קֶרֶן என்பதன் நேர்ப்பொருள் ‘கொம்பு’; கவிதையில் அது வலிமை, மாண்பு அல்லது அதிகாரத்தைக் குறிக்கும் உருவகம். உருவகத்தை ‘என் வலிமை’ என்று விளக்கிவிடாமல் அப்படியே பாதுகாக்கிறது.
- source_word: בַּלֹּתִי
  choice: நான் நனைக்கப்பட்டேன்
  rationale: בלל என்ற அரிதான வினையின் இவ்விடத்திலுள்ள துல்லியமான நுட்பம் விவாதத்திற்குரியது; எண்ணெயால் நனைத்தல், கலத்தல் அல்லது பூசுதல் என்ற பொருள்கள் முன்வைக்கப்படுகின்றன. ‘நனைக்கப்பட்டேன்’ என்பது மூல உருவகத்தையும் அதன் தெளிவின்மையையும் ஓரளவு காக்கிறது; ‘அபிஷேகம் செய்யப்பட்டேன்’ என்று இறையியல் பொருளைத் தீர்மானித்துவிடுவதைத் தவிர்க்கிறது.
- source_word: בְּשֶׁמֶן
  choice: எண்ணெயால்
  rationale: שֶׁמֶן என்பதற்கு நேரடியாக ‘எண்ணெய்’ என்று பொருள்; இங்குள்ள בְּ கருவிப் பொருளில் இருப்பதால் ‘எண்ணெயால்’ இயல்பான தமிழ் வடிவம்.
- source_word: רַעֲנָן
  choice: புதிய
  rationale: רַעֲנָן புத்துணர்ச்சி, பசுமை, செழுமை ஆகிய நுட்பங்களை உடையது. எண்ணெயுடன் ‘புதிய’ என்பது தற்போதைய தமிழில் இயல்பாக இருந்து அதன் புத்துணர்வு சார்ந்த படிமத்தைக் காக்கிறது.
theological_decisions:
- issue: ‘கொம்பு’ என்ற உருவகம்
  choice: வலிமை மற்றும் மாண்பைக் குறிக்கும் ‘கொம்பு’ என்ற உருவகத்தை அப்படியே வைத்தல்
  alternative: என் வலிமை / என் அதிகாரம்
  rationale: எபிரெயக் கவிதையின் இலக்கிய மற்றும் இறையியல் படிமத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது. காட்டெருதுடனான ஒப்பீடு வாசகருக்கு உருவகத்தைப் புரிந்துகொள்ள உதவுகிறது.
- issue: בַּלֹּתִי மற்றும் எண்ணெய்க்கு இடையிலான தொடர்பு
  choice: ‘நான் நனைக்கப்பட்டேன்’ என்று மொழிபெயர்த்தல்
  alternative: நான் அபிஷேகம் செய்யப்பட்டேன் / நான் எண்ணெயுடன் கலக்கப்பட்டேன்
  rationale: வினை அரிதானதும் அதன் பொருள் விவாதத்திற்குரியதும் என்பதால், ‘அபிஷேகம்’ என்ற குறிப்பிட்ட சடங்கு அல்லது இறையியல் பொருளை உறுதியாக்காமல் மூலத்தின் நனைத்தல் சார்ந்த படிமத்தைத் தக்கவைக்கிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்தின் கவிதைநயத்தையும் மரியாதை ஒருமையையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘என் கொம்பு’ என்ற மூல உருவகம் பாதுகாக்கப்பட்டுள்ளது. அரிதான בַּלֹּתִי வினையின் தெளிவின்மை முதன்மை உரையிலும் அடிக்குறிப்பிலும் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
