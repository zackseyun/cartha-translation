theological_decisions:
- issue: ஆண்பால் ஒருமையின் பிரதிநிதித்துவப் பயன்பாடு
  choice: மூலத்தின் ஒருமையைப் பாதுகாத்து “நீதிமான்” என்று மொழிபெயர்க்கப்பட்டது.
  alternative: “நீதியுள்ளவர்கள்” என்று பன்மையில் மொழிபெயர்த்தல்.
  rationale: எபிரெய உரை ஆண்பால் ஒருமையைப் பயன்படுத்துகிறது; அது நீதியுள்ள ஒருவரைக் குறிப்பதோடு, நீதியுள்ள அனைவரையும் பிரதிநிதித்துவமாகவும் குறிக்கலாம். இந்த இரு சாத்தியங்களையும் அடிக்குறிப்பு வெளிப்படுத்துகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதை நடையில் அமைக்கப்பட்டது. எபிரெய இணைவடிவின் இரு மர ஒப்புமைகளும் இணைவரிகளாகப் பாதுகாக்கப்பட்டுள்ளன; மூலத்தில் இல்லாத இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
