  terminology: “இதயம்,” “அருள்வாராக,” and “நிறைவேற்றுவாராக” are suitable and do not impose a theological interpretation. Revising the counsel/plan wording also brings the Tamil main text and footnote orientation into line with the English POB audit trail while preserving the Hebrew semantic range.
