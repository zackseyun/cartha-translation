  text: יִֽתֶּן לְ/ךָ֥ כִ/לְבָבֶ֑/ךָ וְֽ/כָל עֲצָתְ/ךָ֥ יְמַלֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/004.yaml
  text: May he grant you according to your heart[a], and fulfill all your counsel.
translation:
  language: ta
  text: 'உன் இதயத்தின்படி அவர் உனக்கு அருள்வாராக;


    உன் யோசனையையெல்லாம்[a] நிறைவேற்றுவாராக.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உன் திட்டங்களையெல்லாம்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: அவர் அருள்வாராக
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு.’ ஆனால் இங்கு ஆசீர்வாத வேண்டுதலின் சூழலில் ‘அருள்வாராக’ என்பது விரும்பிக் கேட்கப்படும் கொடையை இயல்பாக வெளிப்படுத்துகிறது; yiqtol வடிவின் வேண்டுதல் நுணுக்கத்தையும் காக்கிறது.
- source_word: לְךָ
  choice: உனக்கு
  rationale: எபிரெயச் சொல்லின் இரண்டாம் நபர் ஒருமை மறைமுகச் செயப்படுபொருளை நேரடியாகவும் இயல்பாகவும் தருகிறது.
- source_word: כִלְבָבֶךָ
  choice: உன் இதயத்தின்படி
  rationale: כ முன்னொட்டின் ‘படி’ என்ற பொருளையும், விருப்பம், நோக்கம், மனவுறுதி ஆகியவற்றை உள்ளடக்கக்கூடிய לֵבָב ‘இதயம்’ என்ற எபிரெய உருவகத்தையும் தக்கவைக்கிறது.
- source_word: וְכָל
  choice: உன் ... எல்லாம்
  rationale: וְכָל என்பதன் இணைப்பு மற்றும் முழுமை இரண்டும் தமிழில் இயல்பாக வெளிப்படும்படி ‘உன் திட்டங்களையெல்லாம்’ என்ற தொடருக்குள் வழங்கப்பட்டுள்ளன.
- source_word: עֲצָתְךָ
  choice: உன் திட்டங்கள்
  rationale: עֵצָה என்பதற்கு ‘ஆலோசனை,’ ‘திட்டம்,’ ‘நோக்கம்’ என்று பொருள் வரலாம். இச்சங்கீதத்தின் அரச அல்லது போர்சார் வேண்டுதல் சூழலில் ‘திட்டங்கள்’ என்பது தெளிவான, இயல்பான தமிழ்; ‘ஆலோசனை’ என்ற நெருக்கமான சொற்பொருள் அடிக்குறிப்பில் காக்கப்படுகிறது.
- source_word: יְמַלֵּא
  choice: நிறைவேற்றுவாராக
  rationale: מלא என்பதன் Piel வடிவம் இங்கு ஒன்றை முழு நிறைவுக்குக் கொண்டுவருவதைக் குறிக்கிறது. ‘நிறைவேற்றுவாராக’ என்பது வேண்டுதல் வலிமையையும் சூழலுக்குரிய பொருளையும் துல்லியமாக அளிக்கிறது.
theological_decisions:
- issue: ஆசீர்வாதம் அல்லது வேண்டுதல் சூழலில் வினைவடிவங்களின் வலிமை
  choice: இரு வினைகளையும் வேண்டுதல்களாக—‘அருள்வாராக ... நிறைவேற்றுவாராக’—மொழிபெயர்த்தல்
  alternative: எளிய எதிர்காலக் கூற்றாக—‘அருள்வார் ... நிறைவேற்றுவார்’—மொழிபெயர்த்தல்
  rationale: இரு வடிவங்களும் yiqtol என்றாலும், சங்கீதம் 20-இன் தொடர்ச்சியான மன்றாட்டுச் சூழலில் வாழ்த்து அல்லது வேண்டுதல் வலிமை இயல்பாக உள்ளது. இவ்வாறு மொழிபெயர்ப்பது வசனத்தை வெறும் முன்னறிவிப்பாக மாற்றாமல் அதன் வழிபாட்டு நயத்தைக் காக்கிறது.
- issue: ‘இதயம்’ என்பதன் பொருள்
  choice: விருப்பம், நோக்கம், மனவுறுதி ஆகியவற்றின் மையமாக ‘இதயம்’ என்ற உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘விருப்பம்,’ ‘மனம்,’ அல்லது ‘சித்தம்’ என்று வெளிப்படையாகப் பொருளுரைத்தல்
  rationale: மூலத்தில் ‘இதயம்’ என்ற பரந்த வேதாகம மனிதவியல் சொல் உள்ளது. அதைத் தக்கவைப்பது பொருளை உணர்ச்சி அல்லது அறிவு என்ற ஒரே தளத்துக்குச் சுருக்காமல் மூலத்தின் நுணுக்கத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதில் புரியும் வகையிலும், சங்கீத வேண்டுதலுக்குரிய கண்ணியமான நடையிலும் அமைக்கப்பட்டுள்ளது. இரண்டாம் நபர் ஒருமையை மூலத்துக்கு ஏற்ப ‘உன்/உனக்கு’ எனக் காத்துள்ளது; கவிதை இணைநிலையை வெளிப்படுத்த இரண்டு வரிகளாக வழங்கப்பட்டுள்ளது.
