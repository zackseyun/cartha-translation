  terminology: Use ‘காணிக்கைகள்’ for the broad plural מִנְחֹתֶךָ, with a note that it may specifically mean grain offerings. Use ‘எரிபலி’ for עֹלָה. Retain ‘சேலா’ as an untranslated transliteration because its precise function remains uncertain.
