lexical_decisions:
- source_word: יִזְכֹּר
  choice: அவர் நினைவுகூர்ந்து ... ஏற்றுக்கொள்வாராக
  rationale: இது இறைவனை நோக்கிய ஆசீர்வாத வேண்டுதலின் சூழலில் வரும் Qal imperfect 3ms வடிவம். தமிழில் இரு வினைகளையும் இணைத்து இறுதியில் ‘-வாராக’ எனக் கொடுப்பது வேண்டுதல் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּל
  choice: அனைத்தையும்
  rationale: எபிரேய அளவுச்சொல்லின் முழுமையான பொருளை நேரடியாகத் தக்கவைக்கிறது.
- source_word: מִנְחֹתֶךָ
  choice: உமது காணிக்கைகள்
  rationale: מִנְחָה என்பது பொதுவாகக் காணிக்கை அல்லது பரிசு என்றும், குறிப்பாகத் தானியக் காணிக்கை என்றும் குறிக்கலாம். மூலத்தின் பரந்த பொருளைத் தக்கவைக்க பிரதான உரையில் ‘காணிக்கைகள்’ பயன்படுத்தப்பட்டுள்ளது.
- source_word: וְעוֹלָתְךָ
  choice: உமது தகனபலி
  rationale: עוֹלָה என்பது முழுவதும் எரித்துச் செலுத்தப்படும் பலிக்கான வழக்கமான வழிபாட்டுச் சொல்; நவீனத் தமிழில் ‘தகனபலி’ சுருக்கமாகவும் துல்லியமாகவும் உள்ளது.
- source_word: יְדַשְּׁנֶה
  choice: ஏற்றுக்கொள்வாராக
  rationale: Piel வடிவத்தின் சொற்பொருள் ‘கொழுமையாக்குதல்/செழுமையானதாகக் கருதுதல்’; பலிச் சூழலில் அது பலியை உவப்புடன் ஏற்றுக்கொள்வதைக் குறிக்கும் மரபுத்தொடர். இயல்பான தமிழில் அதன் சூழற்பொருள் தரப்பட்டுள்ளது; சொற்படிமம் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இச்சொல்லின் துல்லியமான செயல்பாடு உறுதியற்றதால் விளக்கமாக மொழிபெயர்க்காமல் ஒலிபெயர்ப்பு தக்கவைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: மூன்றாம் ஆண்பால் ஒருமை வினைகளின் எழுவாய்
  choice: சூழலில் இறைவனைக் குறிக்கும் ‘அவர்’ வெளிப்படையாக வழங்கப்பட்டுள்ளது.
  alternative: எபிரேயத்தைப் போல எழுவாயை முற்றிலும் மறைமுகமாக விடுதல்.
  rationale: சங்கீதம் 20-ன் சூழலில் மக்கள் அரசனுக்காக இறைவனுடைய அருளை வேண்டுகின்றனர். எபிரேயத்தில் எழுவாய் வெளிப்படையாக இல்லாவிட்டாலும், தமிழில் ‘அவர்’ சேர்ப்பது வேண்டுதலைத் தெளிவாக்குகிறது; இறைவனின் பெயரை இவ்வசனத்துக்குள் புதிதாகச் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: மொழிநடை நவீன நிலையான தமிழில், வழிபாட்டு மரியாதையைத் தக்கவைக்கும் வகையில் அமைக்கப்பட்டுள்ளது. ‘உமது’ மற்றும் ‘-வாராக’ ஆகியவை சங்கீத வேண்டுதலுக்குரிய கண்ணியமான நடையை வழங்குகின்றன. மִנְחָה என்பதன் ‘தானியக் காணிக்கை’ என்ற குறுகிய வாய்ப்பை மட்டும் முன்னிறுத்தாமல் மூலத்தின் பொருள் விரிவை ‘காணிக்கைகள்’ தக்கவைக்கிறது.
