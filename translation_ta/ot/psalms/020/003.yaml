  source_fidelity: The draft correctly conveys the prayer/wish force of the two Hebrew imperfects, the comprehensive force of 'all,' and the sacrificial sense of עֹלָה. However, ‘தகனபலி’ is less established and can be less immediately clear than the standard biblical Tamil term ‘எரிபலி.’ The lexical ambiguity of מִנְחָה, documented in the audit trail, should also be retained in a footnote.
