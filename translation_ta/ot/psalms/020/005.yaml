  register: நவீன தரத் தமிழில், வழிபாட்டிற்கேற்ற கண்ணியமும் பொதுவாசகர்களுக்கான தெளிவும் பேணப்பட்டுள்ளன. அரசனை நோக்கும் இரண்டாம் நபர் ஒருமைக்காக மரியாதை வடிவமான ‘உமது’ பயன்படுத்தப்பட்டுள்ளது. கவிதையின் கூட்டு மகிழ்ச்சி, கொடி உருவகம், இறுதி ஜெப விருப்பம் ஆகியவை இயல்பான தமிழ் வாக்கிய ஓட்டத்தில் பாதுகாக்கப்பட்டுள்ளன.
