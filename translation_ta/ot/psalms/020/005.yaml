base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/005.yaml
  text: We will shout for joy in your salvation[a], and in the name of our God we will raise our banners[c][b]. May Yahweh fulfill all your requests.
translation:
  language: ta
  text: உமது மீட்பில் நாங்கள் மகிழ்ந்து ஆரவாரம் செய்வோம்[a]; எங்கள் கடவுளின் பெயரில் எங்கள் கொடிகளை உயர்த்துவோம்[b]. யாவே உமது வேண்டுகோள்கள் அனைத்தையும் நிறைவேற்றுவாராக[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது ‘உமது வெற்றியில்’ அல்லது ‘உமது விடுதலையில்.’ இங்குள்ள எபிரெயச் சொல் மீட்பு, ஆபத்திலிருந்து விடுதலை, போரில் வெற்றி ஆகியவற்றைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது ‘எங்கள் கொடியை நாட்டுவோம்.’ எபிரெய வினை கொண்டாட்டத்தில் கொடியை உயர்த்துவதையோ காட்சிப்படுத்துவதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: அல்லது ‘யாவே உமது வேண்டுகோள்கள் அனைத்தையும் நிறைவேற்றுவார்.’ எபிரெய வடிவத்தை ஒரு வேண்டுதலாகவும் எதிர்காலக் கூற்றாகவும் வாசிக்கலாம்; இச்சூழலுக்கு வேண்டுதல் பொருள் நன்கு பொருந்துகிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: נְרַנְּנָה
  choice: நாங்கள் மகிழ்ச்சி ஆரவாரம் செய்வோம்
  rationale: רנן என்ற வினையின் 1ஆம் நபர் பன்மை வடிவம் உரத்த மகிழ்ச்சியையும் கொண்டாட்டத்தையும் வெளிப்படுத்துகிறது. அது குறிப்பாகப் பாடுவதைக் கட்டாயப்படுத்தாததால், ‘மகிழ்ச்சி ஆரவாரம் செய்வோம்’ என்பது அதன் குரலெழுப்பும் கொண்டாட்டத் தன்மையை இயல்பான தமிழில் தருகிறது.
- source_word: בִּישׁוּעָתֶךָ
  choice: உமது மீட்பில்
  rationale: יְשׁוּעָה என்பது மீட்பு, விடுதலை, வெற்றி ஆகிய பொருள்களை ஏற்கக்கூடும். அரசனையும் போர்ச் சூழலையும் குறிக்கும் இச்சங்கீதத்தில் ‘வெற்றி’ பொருத்தமானாலும், ‘மீட்பு’ அதன் விரிவான பொருள் வரம்பைப் பாதுகாக்கிறது.
- source_word: וּבְשֵׁם אֱלֹהֵינוּ
  choice: எங்கள் கடவுளின் பெயரில்
  rationale: בְּ இங்கு கடவுளின் பெயருடன் இணைந்து, அவரது அதிகாரம், அடையாளம், ஆதரவு ஆகியவற்றின் கீழ் செயல்படுவதைக் குறிக்கிறது. ‘பெயரில்’ என்பது அந்த எபிரெய மொழிநடையை இயல்பாகப் பாதுகாக்கிறது.
- source_word: נִדְגֹּל
  choice: எங்கள் கொடிகளை உயர்த்துவோம்
  rationale: דגל என்ற வினை கொடியை உயர்த்துதல் அல்லது காட்சிப்படுத்துதல் என்ற உருவகத்தைத் தருகிறது. தெய்வீக மீட்பைக் கொண்டாடும் சூழலில், ‘கொடிகளை உயர்த்துவோம்’ என்பது தெளிவான, காட்சியளிக்கும் தமிழாக்கம்.
- source_word: יְמַלֵּא
  choice: நிறைவேற்றுவாராக
  rationale: இது வடிவத்தில் imperfect என்றாலும், இச்சூழலில் வேண்டுதல் அல்லது ஆசீர்வாத விருப்பத்தை வெளிப்படுத்தும் jussive பொருளில் இயங்குகிறது. ‘நிறைவேற்றுவாராக’ என்பது அந்த ஜெபத் தொனியைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: நான்கு எழுத்துகளைக் கொண்ட தெய்வீகப் பெயரை ஒரு பட்டத்தால் மாற்றாமல், தமிழில் பரவலாக அறியப்படும் ஒலிபெயர்ப்பாக ‘யாவே’ வழங்கப்படுகிறது.
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  choice: உமது வேண்டுகோள்கள் அனைத்தையும்
  rationale: מִשְׁאֲלוֹת என்பது கேட்கப்பட்டவற்றை அல்லது விண்ணப்பங்களைச் சுட்டுகிறது. ‘வேண்டுகோள்கள்’ என்பது தெளிவான நவீனத் தமிழ்; ‘விருப்பங்கள்’ என்பதைவிட ஜெபச் சூழலுடன் நேரடியாக இணைகிறது.
