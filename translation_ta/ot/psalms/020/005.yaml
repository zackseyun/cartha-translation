  rationale: சங்கீதத்தின் ஜெப மற்றும் ஆசீர்வாதச் சூழலில் இது வெறும் முன்னறிவிப்பைவிட ஒரு சமூக வேண்டுதலாக இயல்பாகப் புரிகிறது; எனினும் எபிரெய வடிவம் எதிர்காலக் கூற்றாகவும் வாசிக்கப்படலாம்.
