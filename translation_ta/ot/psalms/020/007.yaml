  edition: WLC
  text: אֵ֣לֶּה בָ֭/רֶכֶב וְ/אֵ֣לֶּה בַ/סּוּסִ֑ים וַ/אֲנַ֓חְנוּ בְּ/שֵׁם יְהוָ֖ה אֱלֹהֵ֣י/נוּ נַזְכִּֽיר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/007.yaml
  text: These trust in chariots and those in horses, but we call on the name of the LORD our God.
translation:
  language: ta
  text: சிலர் தேர்களையும், சிலர் குதிரைகளையும் நம்புகிறார்கள்; நாங்களோ எங்கள் கடவுளாகிய ஆண்டவரின் பெயரை நினைவுகூருகிறோம்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “நினைவுகூருகிறோம்” என்பதற்கு “பெயரைச் சொல்லி அழைக்கிறோம்” அல்லது இச்சூழலில் “அவரில் நம்பிக்கை கொள்கிறோம்” என்றும் பொருள் கொள்ளலாம்.
    reason: எபிரெய நַזְכִּיר என்ற வினையின் அடிப்படைப் பொருளையும், இவ்வசனத்தில் சாத்தியமான வேண்டுதல் மற்றும் நம்பிக்கை நிழற்பொருள்களையும் தெரிவிக்கிறது.
lexical_decisions:
- source_word: אֵלֶּה בָרֶכֶב וְאֵלֶּה בַסּוּסִים
  choice: சிலர் தேர்களையும், சிலர் குதிரைகளையும் நம்புகிறார்கள்
  rationale: 'எபிரெயத்தில் முதல் இரு கூறுகளிலும் வினைச்சொல் வெளிப்படையாக இல்லை: ‘இவர்கள் தேர்களில்; அவர்கள் குதிரைகளில்’ என உள்ளது. எதிர்மறை இணைப்பும் சூழலும் காட்டும் சார்பை இயல்பான தமிழில் வெளிப்படுத்த ‘நம்புகிறார்கள்’ சேர்க்கப்பட்டது.'
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵינוּ
  choice: எங்கள் கடவுளாகிய ஆண்டவரின் பெயரை
  rationale: בְּשֵׁם என்பது இங்கு தெய்வீகப் பெயரைச் சார்ந்த செயலைக் குறிக்கிறது. יהוה என்ற உடன்படிக்கைப் பெயர் தமிழில் வழக்கமான மரியாதைத் தலைப்பான ‘ஆண்டவர்’ என்று வழங்கப்பட்டது.
- source_word: נַזְכִּיר
  choice: நினைவுகூருகிறோம்
  rationale: זכר என்பதன் ஹிஃபீல் வடிவம் அடிப்படையில் ‘நினைவுபடுத்து/குறிப்பிடு’ எனப் பொருள்படும்; இச்சூழலில் தேவனுடைய பெயரை நினைவுகூர்ந்து அழைப்பதையும் அதில் நம்பிக்கை வைப்பதையும் உட்கொண்டுள்ளது. மூலத்தின் சொற்பொருளையும் அதன் திறந்த பொருள் பரப்பையும் காக்க ‘நினைவுகூருகிறோம்’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: נַזְכִּיר என்பதைக் ‘அழைக்கிறோம்’, ‘மேன்மை பாராட்டுகிறோம்’, அல்லது ‘நினைவுகூருகிறோம்’ என்று வழங்குதல்
  choice: நினைவுகூருகிறோம்
  alternative: அழைக்கிறோம் / பெருமை கொள்கிறோம்
  rationale: மூல வினை நேரடியாக ‘நினைவுகூருதல்/குறிப்பிடுதல்’ சார்ந்தது. சங்கீதத்தின் இணை அமைப்பில் ஆண்டவர்மீது நம்பிக்கை வைப்பது உட்பொருளாக இருந்தாலும், ஒரே விளக்கத்தை மட்டும் உரையில் திணிக்காமல் மூலத்தின் கருத்துச் செறிவைத் தக்கவைக்கப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையில் கண்ணியமான நடையில் அமைக்கப்பட்டது. எபிரெயத்தின் சுருக்கமான இணை அமைப்பு தமிழில் தெளிவாக இருக்க ‘நம்புகிறார்கள்’ நிரப்பப்பட்டது; ‘நாங்களோ’ என்ற எதிர்மறை வலியுறுத்தல் காக்கப்பட்டது.
