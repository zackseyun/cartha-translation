lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்வை மேற்பார்வையிடுபவருக்கான வழிகாட்டுதலைக் குறிக்கிறது. ‘இசைத் தலைவர்’ என்பது அதன் இசைசார் பணியையும் தலைமைப் பொறுப்பையும் இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: இசையுடன் பாடப்படும் புனிதப் பாடலைக் குறிக்கும் இச்சொல்லுக்கு, சங்கீத நூலின் இலக்கியச் சூழலில் ‘சங்கீதம்’ துல்லியமானதும் வழக்கமானதுமான சொல்.
- source_word: לְדָוִד
  choice: தாவீதின்
  rationale: எபிரெய முன்னொட்டு ஆசிரியத்துவம், தொடர்பு, உரிமை அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும். ‘தாவீதின்’ என்பது இவற்றில் ஒன்றை மட்டும் கட்டாயப்படுத்தாமல் மூலத்தின் விரிவான பொருளை ஓரளவு காக்கிறது.
- source_word: לְ
  choice: -க்கு
  rationale: לַמְנַצֵּחַ என்பதில் உள்ள முன்னொட்டு இசை வழிகாட்டுதல் யாருக்குரியது என்பதை அறிமுகப்படுத்துகிறது; தமிழில் நான்காம் வேற்றுமை உருபான ‘-க்கு’ இதை இயல்பாகத் தெரிவிக்கிறது.
theological_decisions:
- issue: தாவீது தொடர்பான தலைப்பின் பொருள்
  choice: தாவீதின்
  alternative: ‘தாவீது இயற்றிய’ அல்லது ‘தாவீதுக்கான’
  rationale: לְדָוִד என்ற எபிரெய அமைப்பு தாவீது ஆசிரியர் என்பதையோ, அவருக்கான அர்ப்பணிப்பு என்பதையோ தனியாகத் தீர்மானிப்பதில்லை. எனவே முதன்மை உரை பொதுவான தொடர்பை வைத்திருக்கிறது; மாற்றுச் சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில் சுருக்கமான, கண்ணியமான சங்கீதத் தலைப்பு. ‘இசைத் தலைவர்’ பொதுவாசகர்களுக்குப் புரியும் வகையில் மூலத்தின் இசை மேற்பார்வைப் பணியைத் தெரிவிக்கிறது; ‘தாவீதின்’ மூலத்திலுள்ள பொருள் தெளிவின்மையைப் பாதுகாக்கிறது.
