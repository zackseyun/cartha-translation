  text: יְהוָ֥ה הוֹשִׁ֑יעָ/ה הַ֝/מֶּ֗לֶךְ יַעֲנֵ֥/נוּ בְ/יוֹם קָרְאֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/009.yaml
  text: O Yahweh[a], save! May the King answer us in the day we call.
translation:
  language: ta
  text: யாவே[a], காப்பாற்றும்! நாங்கள் அழைக்கும் நாளில் அரசர் எங்களுக்குப் பதிலளிப்பாராக.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இவ்வரியை, “யாவே, அரசரைக் காப்பாற்றும்; நாங்கள் அழைக்கும் நாளில் எங்களுக்குப் பதிலளியும்” என்றும், அல்லது “யாவே, காப்பாற்றும்! நாங்கள் அழைக்கும் நாளில் அரசர் எங்களுக்குப் பதிலளிப்பார்” என்றும் மொழிபெயர்க்கலாம். எபிரெயத் தொடரியல் செறிவாக இருப்பதால், ‘அரசர்’ என்பது முன்னுள்ள வேண்டுதலின் செயப்படுபொருளாகவோ பின்வரும் வினையின் எழுவாயாகவோ புரிந்துகொள்ளப்படலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: யாவே
  rationale: இறைவனுடைய தனிப்பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெயப் பெயரின் பரவலாக ஏற்கப்பட்ட தமிழ் ஒலிபெயர்ப்பாக வழங்குகிறது.
- source_word: הוֹשִׁיעָה
  choice: காப்பாற்றும்!
  rationale: இது நேரடி வேண்டுதலிலுள்ள கட்டளை வடிவம். விடுதலையையும் வெற்றியையும் உள்ளடக்கக்கூடிய பரந்த பொருளை இயல்பான தமிழ் வேண்டுதல் நடையில் தருகிறது.
- source_word: הַמֶּלֶךְ
  choice: அரசர்
  rationale: குறிப்பிட்ட பொதுப்பெயரான ‘அரசன்’ என்பதை மரியாதையும் கவிதை நடையும் காக்கும் வகையில் ‘அரசர்’ என வழங்குகிறது; அது மனித அரசரையா இறைவனையா குறிக்கிறது என்ற தெளிவின்மையை அடிக்குறிப்பு காக்கிறது.
- source_word: יַעֲנֵנוּ
  choice: எங்களுக்குப் பதிலளிப்பாராக
  rationale: இச்சூழலில் வினைமுற்று வேண்டுதல் அல்லது விருப்பப் பொருளைத் தரக்கூடும்; ‘பதிலளிப்பாராக’ அந்த வேண்டுதல் தன்மையைத் தெளிவாகக் காக்கிறது.
- source_word: בְיוֹם
  choice: நாளில்
  rationale: காலத்தைக் குறிக்கும் எபிரெய மரபுத்தொடரைச் சுருக்கமான கவிதைத் தமிழில் நெருக்கமாகப் பிரதிபலிக்கிறது.
- source_word: קָרְאֵנוּ
  choice: நாங்கள் கூப்பிடும்
  rationale: קרא என்பதன் அடிப்படைப் பொருளான ‘கூப்பிடுதல்/அழைத்தல்’ என்பதைத் தக்கவைத்து, மூலத்தில் வெளிப்படையாக இல்லாத கூடுதல் உணர்ச்சித் தீவிரத்தைச் சேர்க்கவில்லை.
theological_decisions:
- issue: இவ்வசனத்தில் ‘அரசர்’ என்பதன் சுட்டுப்பொருளும் தொடரியல் தொடர்பும்
  choice: முக்கிய உரையில், அரசரை ‘பதிலளிப்பார்’ என்ற வினையின் எழுவாயாக வைத்து, அரச சங்கீதச் சூழலில் மனித அரசரை முதன்மையான சுட்டுப்பொருளாகக் கொள்ளுதல்
  alternative: “யாவே, அரசரைக் காப்பாற்றும்; நாங்கள் கூப்பிடும் நாளில் எங்களுக்குப் பதிலளியும்” அல்லது “யாவே, காப்பாற்றும்! நாங்கள் கூப்பிடும் நாளில் அரசர் எங்களுக்குப் பதிலளிப்பார்”
  rationale: எபிரெயத் தொடரியல் மிகவும் செறிவானது; ‘அரசர்’ முன்னுள்ள வேண்டுதலின் செயப்படுபொருளாகவோ, பின்வரும் வினையின் எழுவாயாகவோ புரிந்துகொள்ளப்படலாம். அரசருக்காக வேண்டுகின்ற சங்கீதச் சூழல் மனித அரசரைச் சுட்டும் வாசிப்பை ஆதரித்தாலும், இறைவனை ‘அரசர்’ எனப் புரியும் வாசிப்பும் சாத்தியம். எனவே முக்கிய உரை ஓர் இயல்பான வாசிப்பைத் தேர்ந்தெடுத்து, உண்மையான தெளிவின்மையை அடிக்குறிப்பில் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டுக்கேற்ற கண்ணியமான கவிதை நடை பயன்படுத்தப்பட்டுள்ளது. ‘காப்பாற்றும்’ என்பது தமிழ் வேண்டுதல் நடையில் இயல்பான மரியாதைக் கட்டளை; ‘பதிலளிப்பாராக’ என்பது எபிரெய வினையின் வேண்டுதல் நுணுக்கத்தைத் தக்கவைக்கிறது.
