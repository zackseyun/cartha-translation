  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/001.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
translation:
  language: ta
  text: நெருக்கடியின் நாளில் யாவே உனக்குப் பதிலளிப்பாராக; யாக்கோபின் கடவுளின் பெயர் உன்னை எவரும் எட்ட முடியாத உயரத்தில் வைப்பதாக[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உன்னைப் பாதுகாப்பாராக.’ எபிரேய வினை, ஆபத்து எட்ட முடியாத பாதுகாப்பான உயரத்தில் ஒருவரை வைப்பதைச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  choice: உனக்குப் பதிலளிப்பாராக
  rationale: ענה என்பதன் ‘பதிலளி’ என்ற பொருளையும், இச்சூழலிலுள்ள வேண்டுதல் அல்லது வாழ்த்தின் வலிமையையும் ‘-ஆராக’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: இது பட்டப்பெயர் அல்ல, இஸ்ரவேலின் கடவுளுடைய தனிப்பெயர்; ஆகவே தமிழில் வழக்கமான ஒலிபெயர்ப்பான ‘யாவே’ பயன்படுத்தப்படுகிறது.
- source_word: בְּיוֹם צָרָה
  choice: நெருக்கத்தின் நாளில்
  rationale: צָרָה குறிக்கும் துன்பம், இடுக்கண், நெருக்கடி ஆகிய பரந்த பொருளையும், எபிரேய ‘நாள்’ உருவகத்தையும் தக்கவைக்கிறது.
- source_word: יְשַׂגֶּבְךָ
  choice: உன்னை எட்ட முடியாத உயரத்தில் பாதுகாப்பாக வைப்பதாக
  rationale: שׂגב என்ற வினையின் பியேல் வடிவம் ஆபத்து எட்டாத உயரத்தில் ஒருவரை வைப்பதன் மூலம் பாதுகாப்பதைச் சித்தரிக்கிறது; வெறும் ‘பாதுகாப்பதாக’ என்பதைவிட மூல உருவகத்தை இது காக்கிறது.
- source_word: שֵׁם
  choice: பெயர்
  rationale: இங்கு பெயர் என்பது புகழ், அதிகாரம், அழைக்கப்படும் பிரசன்னம் ஆகியவற்றைக் குறிப்புணர்த்தலாம்; ஆனால் கவிதை மற்றும் இறையியல் முக்கியத்துவமுள்ள நேரடிச் சொல்லான ‘பெயர்’ தக்கவைக்கப்படுகிறது.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: யாக்கோபின் கடவுள்
  rationale: எபிரேய இணைப்புத் தொடரின் இயல்பான தமிழ் வடிவம்; உடன்படிக்கை மற்றும் வரலாற்றுச் சுட்டையும் காக்கிறது.
theological_decisions:
- issue: יְהוָה என்ற இறைப்பெயரின் மொழிபெயர்ப்பு
  choice: யாவே
  alternative: கர்த்தர்; யெகோவா
  rationale: மூலத்தில் தனிப்பெயர் நேரடியாக உள்ளது. அதைப் பட்டப்பெயரால் மாற்றாமல் தமிழில் ஒலிபெயர்ப்பது மூல வேறுபாட்டைக் காக்கிறது.
- issue: வினை வடிவங்களின் உரைநடை வலிமை
  choice: 'வாழ்த்து/வேண்டுதல்: ‘பதிலளிப்பாராக … வைப்பதாக’'
  alternative: 'எளிய எதிர்காலம்: ‘பதிலளிப்பார் … பாதுகாப்பார்’'
  rationale: சங்கீதத்தின் வழிபாட்டு வாழ்த்துச் சூழலில் இவ்வினைகள் உறுதியான முன்னறிவிப்பைவிட வேண்டுதல் அல்லது ஆசீர்வாதத்தின் வலிமையைக் கொண்டுள்ளன.
- issue: ‘பெயர்’ செயல்படும் பொருளாக வருதல்
  choice: ‘யாக்கோபின் கடவுளுடைய பெயர்’ என்பதையே எழுவாயாகத் தக்கவைத்தல்
  alternative: ‘யாக்கோபின் கடவுள் உன்னைப் பாதுகாப்பாராக’
  rationale: மூலத்தின் கவிதை மற்றும் இறையியல் மொழியை விளக்கமாக மாற்றாமல், கடவுளுடைய பெயரே செயற்படும் விதத்தைக் காக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் dignified வழிபாட்டு நடையைப் பேணுகிறது. ஒருமை இரண்டாம் நபரான ‘உனக்கு/உன்னை’ மூலத்துக்கு ஏற்ப தக்கவைக்கப்பட்டுள்ளது. அடிக்குறிப்பு குறி [a] தொடர்புடைய இரண்டாம் அரையடியின் முடிவில் வைக்கப்பட்டுள்ளது.
