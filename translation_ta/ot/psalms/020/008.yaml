lexical_decisions:
- source_word: הֵמָּה
  choice: அவர்கள்
  rationale: தனித்து நிற்கும் மூன்றாம் நபர் பன்மைப் பெயர்ச்சொல் ‘நாங்கள்’ என்பதுடன் வலுவான முரண்பாட்டை உருவாக்குகிறது; தமிழில் ‘அவர்கள்’ இதை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: כָּרְעוּ
  choice: மண்டியிட்டு
  rationale: முழங்காலை மடக்குதல் அல்லது கீழே சரிதல் என்ற உடல் சார்ந்த படிமத்தைத் தருகிறது; அடுத்து வரும் ‘விழுந்தார்கள்’ என்பதோடு கவிதைநயமான தொடர்ச்சியையும் பேணுகிறது.
- source_word: וְנָפָלוּ
  choice: விழுந்தார்கள்
  rationale: எளிய இணைப்பையும் வீழ்ச்சியின் நேரடியான படிமத்தையும் காக்கும் இயல்பான தமிழ் மொழிபெயர்ப்பு.
- source_word: וַאֲנַחְנוּ
  choice: நாங்களோ
  rationale: எபிரெய இணைப்புச்சொல் அடிப்படையில் ‘மற்றும்’ என்றாலும், இங்கு ‘அவர்கள்’—‘நாங்கள்’ என்ற தெளிவான எதிர்மறை ஒப்புமை உள்ளது; ‘நாங்களோ’ அதை இயல்பாகக் காட்டுகிறது.
- source_word: קַּמְנוּ
  choice: எழுந்து
  rationale: קום என்பதன் எழுதல்/எழுந்து நிற்றல் என்ற பொருளைத் தருவதோடு, முன் வரும் விழுதலுக்கு நேரான எதிர்ப்படிமமாக அமைகிறது.
- source_word: וַנִּתְעוֹדָד
  choice: உறுதியாக நிற்கிறோம்
  rationale: அரிதான இந்தத் தன்னிலை வடிவம் மீண்டு நிமிர்தல், தன்னை வலுப்படுத்திக்கொள்ளுதல், நிலைபெறுதல் ஆகிய நுணுக்கங்களைக் கொண்டது. ‘உறுதியாக நிற்கிறோம்’ என்பது எழுந்தபின் நிலைத்து நிற்கும் படிமத்தை இயல்பான தமிழில் தருகிறது; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
