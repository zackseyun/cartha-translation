  source_fidelity: திருத்தம் தேவை. இறுதி வினைச்சொல் וַנִּתְעוֹדָד மீண்டு நிமிர்தல்/நிலைபெறுதல் என்ற படிமத்தைக் கொண்டது. வரைவிலுள்ள ‘உறுதியாக நிற்கிறோம்’ ஏற்கத்தக்க பொருளளித்தாலும், உடல்-படிமத்தை வெளிப்படையாகக் காட்டும் சொற்றொடர் மூலத்தின் இணைநிலையைச் சிறப்பாகப் பாதுகாக்கிறது. அடிக்குறிப்பில் உள்ள ‘பலப்படுத்தப்பட்டிருக்கிறோம்’ என்பது தன்னிலை/மீட்பு நுணுக்கத்தைச் செயலற்ற வகையில் காட்டுவதால் மாற்றப்படுகிறது.
  naturalness: ‘அவர்கள் மண்டியிட்டு விழுந்தார்கள்; நாங்களோ எழுந்து நிமிர்ந்து நிற்கிறோம்’ என்பது நவீன பொதுத்தமிழில் இயல்பாகவும் சங்கீதக் கவிதைக்கேற்ற கண்ணியத்துடனும் உள்ளது. ‘நாங்களோ’ இரு தரப்பினருக்கிடையிலான வலுவான முரண்பாட்டைத் தெளிவாக்குகிறது.
  terminology: ‘மண்டியிட்டு,’ ‘விழுந்தார்கள்,’ ‘எழுந்து,’ ‘நிமிர்ந்து நிற்கிறோம்’ ஆகியவை சிறப்புச் சமயச் சொற்களைத் திணிக்காமல் மூலத்தின் உடல்சார் தோல்வி–மீட்பு படிமத்தைத் தருகின்றன. அடிக்குறிப்பில் ‘பலமடைந்திருக்கிறோம்’ என்பது ‘பலப்படுத்தப்பட்டிருக்கிறோம்’ என்பதைக் காட்டிலும் இயல்பாகவும் வடிவத்திற்குச் சீரானதாகவும் உள்ளது.
