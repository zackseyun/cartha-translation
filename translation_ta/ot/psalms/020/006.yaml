source:
  edition: WLC
  text: עַתָּ֤ה יָדַ֗עְתִּי כִּ֤י הוֹשִׁ֥יעַ יְהוָ֗ה מְשִׁ֫יח֥/וֹ יַ֭עֲנֵ/הוּ מִ/שְּׁמֵ֣י קָדְשׁ֑/וֹ בִּ֝/גְבֻר֗וֹת יֵ֣שַׁע יְמִינֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/006.yaml
  text: I know that the LORD saves his anointed; he answers him from his holy heaven with the mighty saving deeds of his right hand.
translation:
  language: ta
  text: 'இப்போது நான் அறிந்திருக்கிறேன்: ஆண்டவர் தாம் அபிஷேகம் செய்தவரைக் காப்பாற்றுகிறார்; தமது பரிசுத்த வானத்திலிருந்து, தமது வலக்கரத்தின் மீட்பளிக்கும் வல்ல செயல்களால் அவருக்குப் பதிலளிக்கிறார்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: இப்போது
  rationale: இது காலத்தைக் குறிக்கும் வெளிப்படையான எபிரெயச் சொல்; சங்கீதக்காரரின் தற்போதைய உறுதியைத் தக்கவைக்கிறது.
- source_word: יְהוָה
  choice: ஆண்டவர்
  rationale: தேவனுடைய உடன்படிக்கைப் பெயரை நவீனத் தமிழில் மரியாதையுடனும் பொதுவாகப் புரியுமாறும் வழங்குகிறது.
- source_word: מְשִׁיחוֹ
  choice: தாம் அபிஷேகம் செய்தவர்
  rationale: சொல்லின் அடிப்படைப் பொருளான ‘அபிஷேகம் செய்யப்பட்டவர்’ என்பதையும், பின்னொட்டிலுள்ள ‘அவருடைய’ உறவையும் இயல்பான தமிழில் வெளிப்படுத்துகிறது; குறிப்பிட்ட பிற்கால இறையியல் அடையாளத்தை வசனத்துக்குள் முன்கூட்டியே திணிக்கவில்லை.
- source_word: הוֹשִׁיעַ
  choice: காப்பாற்றுகிறார்
  rationale: இவ்வடிவம் சூழலில் ஆண்டவர் தமது அபிஷேகம் செய்யப்பட்டவருக்கு வெற்றியும் விடுதலையும் அளிப்பதைச் சுட்டுகிறது; தமிழ் வாசகருக்கு இயல்பான விரிவுள்ள சொல்.
- source_word: מִשְּׁמֵי קָדְשׁוֹ
  choice: தமது பரிசுத்த வானத்திலிருந்து
  rationale: எபிரெயத்தில் ‘வானங்கள்’ என்ற வடிவம் இருந்தாலும், தேவனுடைய பரிசுத்த வாசஸ்தலத்தைக் குறிக்கும் இச்சொற்றொடருக்கு ஒருமைத் தமிழ் இயல்பானது.
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  choice: தமது வலக்கரத்தின் மீட்பளிக்கும் வல்ல செயல்களால்
  rationale: ‘வல்லமைகள்/வல்ல செயல்கள்’, ‘மீட்பு’, ‘வலக்கரம்’ ஆகிய மூன்று கூறுகளையும் காத்து, அவை பதிலளிக்கும் விதத்தைச் சொல்வதாக இயல்பான தமிழில் அமைக்கிறது.
theological_decisions:
- issue: מְשִׁיחוֹ என்பதன் அடையாளம்
  choice: தாம் அபிஷேகம் செய்தவர்
  alternative: அவருடைய மேசியா / அவரது அபிஷேகம் பெற்ற அரசன்
  rationale: மூலச்சொல்லின் அரச மற்றும் இறையியல் சாத்தியங்களைத் திறந்தவையாக வைத்திருக்கிறது; அதை ஒரு தனிப்பட்ட பிற்கால நிறைவேற்றத்திற்கோ, அரசனுக்கு மட்டுமோ வசனத்திலேயே கட்டுப்படுத்தவில்லை.
- issue: மீட்பும் போர்வெற்றியும் உள்ள உறவு
  choice: காப்பாற்றுகிறார் … மீட்பளிக்கும் வல்ல செயல்கள்
  alternative: வெற்றி அளிக்கிறார் … வெற்றியளிக்கும் வல்லமை
  rationale: ישע என்ற சொல்லின் மீட்பு/காப்பு அகலத்தைப் பாதுகாக்கிறது; சங்கீதத்தின் போர்ச் சூழலில் வெற்றியின் நிழற்பொருளையும் மறுப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; மரியாதைமிக்க, பொதுவாசகர்களுக்குப் புரியும் நடை. எபிரெய மூலத்தில் உள்ள ‘இப்போது’ தக்கவைக்கப்பட்டது. இரண்டாம் அரைவசனத்தில் ‘பதிலளிக்கிறார்’ மீண்டும் கூறப்பட்டுள்ளது; இதனால் கடைசி கருவியுருபுச் சொற்றொடர் எதனுடன் இணைகிறது என்பது தமிழில் தெளிவாகிறது, அதேவேளையில் மூலத்தின் கருத்து மாறாது.
