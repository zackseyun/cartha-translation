  text: יִשְׁלַֽח עֶזְרְ/ךָ֥ מִ/קֹּ֑דֶשׁ וּ֝/מִ/צִּיּ֗וֹן יִסְעָדֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/002.yaml
  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
translation:
  language: ta
  text: 'பரிசுத்த இடத்திலிருந்து[b] அவர் உனக்கு உதவி அனுப்புவாராக;

    சீயோனிலிருந்து உன்னைத் தாங்குவாராக.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘உன்னை ஆதரிப்பாராக’ அல்லது ‘உன்னை நிலைநிறுத்துவாராக’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் ‘பரிசுத்தத்திலிருந்து’ அல்லது ‘பரிசுத்த இடத்திலிருந்து’; இங்கு தேவனுடைய திருத்தலத்தைக் குறிப்பதாக இருக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: அனுப்புவாராக
  rationale: שׁלח என்பதன் Qal imperfect 3ms வடிவம். சங்கீதத்தின் ஆசீர்வாத வேண்டுதல் சூழலில், சாதாரண எதிர்காலமாக அல்லாமல் விருப்பம் அல்லது வேண்டுதலைக் குறிக்கும் வகையில் மொழிபெயர்க்கப்பட்டது.
- source_word: עֶזְרְךָ
  choice: உனக்கு உதவி
  rationale: עֵזֶר உடன் இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு, ‘உனக்கான உதவி’ அல்லது சொற்சொல்லாக ‘உன் உதவி’ எனப் பொருள்படும். இயல்பான நவீன தமிழில் ‘உனக்கு உதவி அனுப்புவாராக’ என்று வழங்கப்பட்டது.
- source_word: מִקֹּדֶשׁ
  choice: பரிசுத்த இடத்திலிருந்து
  rationale: קֹדֶשׁ என்பது ‘பரிசுத்தம்’ என்ற பண்பையும் ‘பரிசுத்த இடம்’ என்ற இடப்பொருளையும் குறிக்கலாம். ‘சீயோனிலிருந்து’ என்பதற்கு இணையான அமைப்பில் வருவதால், இங்கு தேவனுடைய பரிசுத்த வாசஸ்தலத்தைக் குறிக்கும் இடப்பொருள் இயல்பானது; மூலத்தின் சொல்லியல் அகலத்தை ஓரளவு காக்க ‘பரிசுத்த இடம்’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: וּמִצִּיּוֹן
  choice: சீயோனிலிருந்து
  rationale: צִיּוֹן என்ற இடப்பெயர் தமிழில் வழக்கிலுள்ள ‘சீயோன்’ என ஒலிபெயர்க்கப்பட்டது. וּ இணைப்புச் சொல், இரண்டாம் அடியை முதல் அடியுடன் இணையான வேண்டுதலாக இணைக்கிறது.
- source_word: יִסְעָדֶךָּ
  choice: உன்னைத் தாங்குவாராக
  rationale: סעד என்பதன் Qal imperfect 3ms வடிவத்துடன் இரண்டாம் நபர் ஆண்பால் ஒருமை பொருள் பின்னொட்டு உள்ளது. இச்சொல் ‘தாங்கு, ஆதரி, நிலைநிறுத்து’ என்ற பொருள் வரம்பைக் கொண்டது. கவிதைநயமும் இக்கட்டில் அளிக்கப்படும் வலிமையான ஆதரவும் வெளிப்பட ‘தாங்குவாராக’ தேர்ந்தெடுக்கப்பட்டது.
theological_decisions:
- issue: வினைகளின் மறைமுக எழுவாய் யார் என்பது
  choice: சுற்றியுள்ள சூழலில் கர்த்தரைக் குறிக்கும் ‘அவர்’ என வழங்கப்பட்டது.
  alternative: இந்த வசனத்திலேயே ‘கர்த்தர்’ என்று பெயரை வெளிப்படையாகச் சேர்த்தல்.
  rationale: எபிரெய உரையில் இந்த அடியில் எழுவாய் பெயராக வரவில்லை; வினைகள் மூன்றாம் நபர் ஆண்பால் ஒருமையில் உள்ளன, அவற்றின் எழுவாய் முந்தைய சூழலிலிருந்து புரிகிறது. மூலத்தில் இல்லாத தெய்வீகப் பெயரைச் சேர்க்காமல், தமிழில் வேண்டுதலைத் தெளிவாக்க ‘அவர்’ பயன்படுத்தப்பட்டது.
translation_notes:
  register: நவீன நிலையான தமிழில், ஒருமை இரண்டாம் நபரைத் தக்கவைத்து, சங்கீதத்திற்குரிய கண்ணியமான வேண்டுதல் நடையில் மொழிபெயர்க்கப்பட்டது. இணையான இரு கவிதை அடிகளும் பாதுகாக்கப்பட்டுள்ளன; ‘அனுப்புவாராக / தாங்குவாராக’ என்ற வடிவங்கள் ஆசீர்வாத வேண்டுதலின் தொனியை வெளிப்படுத்துகின்றன.
