  text: מִי לִ֥/י בַ/שָּׁמָ֑יִם וְ֝/עִמְּ/ךָ֗ לֹא חָפַ֥צְתִּי בָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/025.yaml
  text: Whom have I in heaven but you? And besides you[a], I desire nothing on earth.
translation:
  language: ta
  text: 'பரலோகத்தில் உம்மையன்றி எனக்கு யார் இருக்கிறார்?


    பூமியில் உம்மையன்றி வேறெதையும் நான் விரும்பவில்லை.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'இன்னும் நேரடியாக: ‘உம்மோடு, பூமியில் நான் எதையும் விரும்பவில்லை.’ எபிரெய வாசகம் நீள்வட்டமான கவிதைநடையில் உள்ளது; ஆகவே, ‘பூமியில் உம்மையன்றி வேறெதையும் நான் விரும்பவில்லை’ என்றும் பொருள் கொள்ளலாம்.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לִי
  choice: எனக்கு யார் இருக்கிறார்?
  rationale: מִי என்ற வினாப்பெயரும் לִי என்ற ‘எனக்கு’ என்னும் உறவுச் சொல்லும் சேர்ந்து உடைமை அல்லது சார்புறவை வெளிப்படுத்துகின்றன. தமிழில் ‘எனக்கு யார் இருக்கிறார்?’ என்பது இயல்பாகவும் மூலத்தின் வினா வடிவுக்கு நெருக்கமாகவும் உள்ளது.
- source_word: בַשָּׁמָיִם
  choice: பரலோகத்தில்
  rationale: இங்கு பன்மை வடிவிலுள்ள ‘வானங்கள்’ என்பது பரலோக மண்டலத்தைக் குறிக்கிறது. பூமியுடனான கவிதைநய எதிரிணையைத் தக்கவைக்க ‘பரலோகத்தில்’ என மொழிபெயர்க்கப்பட்டது.
- source_word: וְעִמְּךָ
  choice: உம்மோடு இருக்கையில்
  rationale: இதன் நேரடிப் பொருள் ‘உம்மோடு’ என்பதாகும். எபிரெயச் சொற்றொடரின் தெளிவின்மையை முற்றிலும் ‘உம்மையன்றி’ என்று விளக்கிவிடாமல், தேவனோடு இருப்பதையும் அவரைத் தவிர வேறொன்றை விரும்பாத தன்மையையும் தமிழில் இயல்பாக இணைக்கிறது.
- source_word: לֹא חָפַצְתִּי
  choice: நான் எதையும் விரும்பவில்லை
  rationale: חפץ என்பது விரும்புதல், மகிழ்தல் அல்லது இன்பம் காணுதல் எனப் பொருள்படலாம். இங்கு தேவனை நோக்கிய தனிப்பட்ட விருப்பம் வலியுறுத்தப்படுவதால் ‘விரும்பவில்லை’ பொருத்தமானது; எபிரெய நிறைவு வடிவம் நிலையான தற்போதைய மனநிலையைச் சுட்டுவதால் தமிழில் இறந்தகாலமாகக் கட்டுப்படுத்தப்படவில்லை.
- source_word: בָאָרֶץ
  choice: பூமியில்
  rationale: ‘பரலோகத்தில்’ என்பதற்கு இணையான எதிரிணையாக இது பூமிக்குரிய மண்டலத்தைக் குறிக்கிறது. ‘பூமியில்’ என்பது தெளிவான, இயல்பான தமிழ்.
theological_decisions:
- issue: இரண்டாம் அடியின் பொருள்
  choice: தேவனோடு இருக்கையில் பூமியில் வேறெதையும் விரும்பாததாக மொழிபெயர்த்தல்
  alternative: ‘பூமியில் உம்மையன்றி வேறெதையும் நான் விரும்பவில்லை’ அல்லது ‘உம்மோடு, பூமியில் நான் எதையும் விரும்பவில்லை’
  rationale: எபிரெய வாசகம் சொல் விடுபட்ட கவிதைநடையில் உள்ளது. முதன்மை உரை ‘உம்மோடு’ என்ற நேரடிக் கூறைத் தக்கவைத்து, சூழலில் உள்ள தேவனுக்கான தனிப்பட்ட விருப்பத்தையும் வெளிப்படுத்துகிறது; அடிக்குறிப்பு நேரடியான அமைப்பையும் மாற்று பொருளையும் காட்டுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதப் பாடலுக்கேற்ற கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. தேவனை நோக்கிய ஒருமை மரியாதை வடிவங்களான ‘உம்மை/உம்மோடு’ பயன்படுத்தப்பட்டுள்ளன; மிகப் பழமையான வினைமுற்றுகள் தவிர்க்கப்பட்டுள்ளன.
