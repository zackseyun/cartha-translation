  text: יָ֭צָא מֵ/חֵ֣לֶב עֵינֵ֑/מוֹ עָ֝בְר֗וּ מַשְׂכִּיּ֥וֹת לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/007.yaml
  text: Their eyes bulge out from fatness[a]; the imaginations of their heart overflow.
translation:
  language: ta
  text: கொழுப்பால் அவர்களுடைய கண்கள் பிதுங்குகின்றன[a]; அவர்களுடைய இதயத்தின் கற்பனைகள் எல்லை மீறுகின்றன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “கொழுப்பிலிருந்து அவர்களுடைய கண்கள் வெளியே வருகின்றன; அவர்களுடைய இதயத்தின் எண்ணங்கள் எல்லை மீறுகின்றன.”
    reason: 'சொற்பொருள் மாற்று: יָצָא என்பதன் நேரடியான ‘வெளியே வருதல்’ மற்றும் מַשְׂכִּיּוֹת என்பதற்கான ‘எண்ணங்கள்’ என்ற மாற்றுப்பொருள்.'
lexical_decisions:
- source_word: יָצָא
  choice: பிதுங்குகின்றன
  rationale: வினைச்சொல்லின் அடிப்படைப் பொருள் ‘வெளியே வருதல்.’ கண்கள் மற்றும் கொழுப்பு என்ற சூழலில், கண்கள் வெளியே புடைத்துத் தோன்றும் தெளிவான உடல்சார் படிமத்தை ‘பிதுங்குகின்றன’ இயல்பாகக் காட்டுகிறது.
- source_word: מֵחֵלֶב
  choice: கொழுப்பினால்
  rationale: חֵלֶב என்பதன் நேரடிப் பொருளான ‘கொழுப்பு’ என்பதைக் காத்து, செழிப்பை மட்டும் விளக்கமாகச் சேர்க்காமல் உடல்சார்-உருவகப் படிமத்தை நிலைநிறுத்துகிறது.
- source_word: עֵינֵמוֹ
  choice: அவர்களுடைய கண்கள்
  rationale: மூன்றாம் நபர் ஆண்பால் பன்மை பின்னொட்டுடன் உள்ள ‘கண்கள்’ என்பதன் நேரடியான, இயல்பான தமிழ் வடிவம்.
- source_word: עָבְרוּ
  choice: அளவுகடந்து பெருகுகின்றன
  rationale: ‘கடந்து செல்லுதல்/எல்லை மீறுதல்’ என்ற அடிப்படை உணர்வைப் பாதுகாத்து, எண்ணங்கள் உரிய எல்லையை மீறிப் பெருகுவதைக் கவித்துவமாகவும் தெளிவாகவும் தெரிவிக்கிறது.
- source_word: מַשְׂכִּיּוֹת
  choice: கற்பனைகள்
  rationale: இந்தப் பன்மைப் பெயர்ச்சொல் உருவங்கள், மனக்காட்சிகள், எண்ணங்கள் அல்லது திட்டங்களைக் குறிக்கலாம். ‘கற்பனைகள்’ என்பது இதயத்துடன் இணையும் மனச்சார் பொருளைக் காத்து, தீய திட்டங்கள் என்று தேவையின்றிக் குறுக்குவதில்லை.
- source_word: לֵבָב
  choice: அவர்களுடைய இதயம்
  rationale: எபிரெயத்தில் ஒருமையாக உள்ள ‘இதயம்’ என்பதைக் காத்து, சூழலில் பேசப்படும் மனிதர்களுக்குரியது என்பதைத் தமிழில் இயல்பாக வெளிப்படுத்த உடைமைப்பெயர் சேர்க்கப்பட்டுள்ளது.
