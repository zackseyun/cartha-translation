lexical_decisions:
- source_word: אֵיךְ
  choice: எப்படி
  rationale: இது தகவல் கேட்கும் வினா அல்ல; வியப்பையும் அதிர்ச்சியையும் வெளிப்படுத்தும் சொல்லாக இருப்பதால், தமிழில் இயல்பான வியப்புத் தொடராக மொழிபெயர்க்கப்பட்டது.
- source_word: הָיוּ לְשַׁמָּה
  choice: பாழாய்ப் போனார்கள்
  rationale: הָיוּ இங்கு ஒரு நிலைக்கு மாறியதைக் குறிக்கிறது; לְשַׁמָּה அழிவு அல்லது பாழ்நிலையையும், அதைக் கண்டு ஏற்படும் திகைப்பையும் குறிக்கக்கூடும். ‘பாழாய்ப் போனார்கள்’ அந்த மாற்றத்தை இயல்பான தமிழில் தருகிறது.
- source_word: כְרָגַע
  choice: ஒரே கணத்தில்
  rationale: மிகக் குறுகிய காலத்தில் திடீரென நிகழ்ந்ததைக் குறிக்கும் எபிரேய மரபுத்தொடரின் வலிமையை இது வெளிப்படுத்துகிறது.
- source_word: סָפוּ
  choice: ஒழிந்து
  rationale: முடிவுக்கு வருதல், இல்லாமற்போதல் என்ற பொருளைச் சுருக்கமாகத் தருகிறது; அழிவின் குறிப்பிட்ட முறையைத் தேவையின்றி நிர்ணயிக்கவில்லை.
- source_word: תַמּוּ
  choice: முற்றிலும் அழிந்துபோனார்கள்
  rationale: முந்தைய வினையை இணைநிலையாக வலுப்படுத்தி, முடிவின் முழுமையையும் இறுதியையும் வெளிப்படுத்துகிறது.
- source_word: מִן בַּלָּהוֹת
  choice: திடீர்த் திகில்களால்
  rationale: מִן இங்கு காரணம் அல்லது செயலாற்றும் வழியைக் குறிக்கலாம்; בַּלָּהוֹת கடும், திடீர் பயங்கரங்களைச் சுட்டுகிறது. ‘திகில்களால்’ காரணப்பொருளை இயல்பாகத் தருகிறது.
