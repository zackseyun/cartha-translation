  text: ஒரே கணத்தில் அவர்கள் எப்படிப் பாழாய்ப் போனார்கள்![a] பேரச்சங்களால் அவர்கள் ஒழிந்து, முற்றிலும் அழிந்துபோனார்கள்.
  philosophy: optimal-equivalence
