  yaml_path: translation/ot/psalms/073/004.yaml
  text: For they have no pains until death, and their body is fat.
translation:
  language: ta
  text: ஏனெனில், அவர்கள் இறக்கும்போது அவர்களுக்கு வேதனைகள் இல்லை[a]; அவர்களுடைய உடல் நன்கு ஊட்டமுற்றுள்ளது.
  philosophy: optimal-equivalence
  footnotes:
