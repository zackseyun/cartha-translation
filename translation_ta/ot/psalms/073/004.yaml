lexical_decisions:
- source_word: חַרְצֻבּוֹת
  choice: வேதனைகள்
  rationale: அரிதான இச்சொல்லுக்கு ‘வேதனைகள்/வலிகள்’ என்பது இச்சூழலில் பொருத்தமான பொருள்; தீவிரத்தைச் செயற்கையாக அதிகரிக்காமல் பொதுவான சொல்லாக மொழிபெயர்க்கப்பட்டது.
- source_word: לְמוֹתָם
  choice: அவர்கள் மரணமடையும்வரை
  rationale: மசோரெட்டிக் உரையின் இயல்பான பிரிப்பின்படி לְמוֹתָם என்பதை ‘அவர்களின் மரணத்துக்கு/அவர்கள் மரணமடையும்வரை’ எனப் புரிந்து, கால எல்லையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּבָרִיא
  choice: கொழுத்திருக்கிறது
  rationale: בָּרִיא என்பதன் அடிப்படை உணர்வு ‘கொழுத்த, நன்கு ஊட்டமுற்ற’; சங்கீதத்தின் சூழலில் செழுமையான உடல்நிலையைச் சுட்டுகிறது.
- source_word: אוּלָם
  choice: உடல்
  rationale: இவ்வரியில் அரிதாக வரும் சொல்லைச் சூழலுக்கும் பழமையான மொழிபெயர்ப்பு மரபுக்கும் ஏற்ப ‘உடல்’ என்று எடுத்துள்ளது; சொல்லின் பொருள் உறுதியற்றது.
theological_decisions:
