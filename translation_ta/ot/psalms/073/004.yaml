  choice: ‘மரணமடையும்வரை அவர்களுக்கு வேதனைகள் இல்லை’ என்று வெளிப்படையாகப் பாதுகாக்கப்பட்டது.
  alternative: ‘அவர்களின் மரணத்தில் வேதனைகள் இல்லை’ அல்லது ‘அவர்களுக்கு மரண வேதனைகள் இல்லை’
  rationale: לְמוֹתָם கால எல்லையையோ மரணத்தோடு தொடர்பையோ குறிக்கக்கூடும். சூழலில் கவிஞரின் பார்வையில் அவர்கள் வாழ்நாள் முழுவதும் துன்பமின்றி இருப்பது போலத் தோன்றும் பதற்றத்தைத் தீர்க்காமல் வைத்திருக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான, எளிதில் புரியும் தமிழ். எபிரெய இணைப்பமைப்பைத் தக்கவைத்தபோதும் தமிழில் இயல்பாக ஒலிக்கச் செய்யப்பட்டுள்ளது; உரையில் இல்லாத விளக்கங்கள் சேர்க்கப்படவில்லை.
