    text: அல்லது, “அவர்கள் மரணமடையும்வரை அவர்களுக்கு வேதனைகள் இல்லை.” எபிரெயச் சொற்றொடர் அவர்களின் மரணத்தோடு தொடர்புடையதாகவும் கால எல்லையைக் குறிப்பதாகவும் புரிந்துகொள்ளப்படலாம்.
