translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்கள் எளிதில் புரிந்துகொள்ளும் வகையில் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘என் பார்வையில்’ என்பது மூல உருவகத்தைத் தக்கவைத்துக்கொண்டே தமிழில் இயல்பாக ஒலிக்கிறது; அடிக்குறிப்பு சொல்லுக்குச் சொல் நெருக்கமான மாற்றைக் காட்டுகிறது.
