  yaml_path: translation/ot/psalms/073/016.yaml
  text: But when I thought to understand this[a], it was trouble in my eyes.
translation:
  language: ta
  text: ஆனால், இதைப் புரிந்துகொள்ள நான் எண்ணியபோது[a], அது என் பார்வையில் சிரமமாக இருந்தது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆனால், இதை அறிய நான் சிந்தித்தபோது, அது என் கண்களில் கடினமான உழைப்பாக இருந்தது.”
    reason: חשב, ידע, עמל, בְּעֵינַי ஆகியவற்றுக்குச் சொல்லுக்குச் சொல் நெருக்கமான மாற்று மொழிபெயர்ப்பு.
lexical_decisions:
- source_word: וָאֲחַשְּׁבָה
  choice: நான் எண்ணியபோது
  rationale: חשב என்பது சிந்தித்தல், எண்ணுதல், திட்டமிடுதல் ஆகிய பொருள்களைக் கொண்டது. לדעת என்பதுடன் இங்கு ஒரு விஷயத்தை அறிவால் பற்றிக்கொள்ள முயலும் எண்ணத்தைச் சுட்டுவதால், இயல்பான தமிழில் ‘எண்ணியபோது’ என்று தரப்பட்டுள்ளது. சூழலுக்கு ஏற்ப முன்னொட்டு ו எதிர்மறைத் திருப்பைக் காட்டும் ‘ஆனால்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: לָדַעַת
  choice: புரிந்துகொள்ள
  rationale: ידע என்பதன் அடிப்படைப் பொருள் ‘அறிதல்.’ ஆனால் இங்கு முந்தைய வசனங்களில் எழுந்த சிக்கலை அறிவால் விளங்கிக்கொள்ளுதல் குறிக்கப்படுவதால், ‘புரிந்துகொள்ள’ என்பது இயல்பாகவும் பொருத்தமாகவும் உள்ளது.
- source_word: זֹאת
  choice: இதை
  rationale: இந்தச் சுட்டுப்பெயர் முந்தைய சூழலில் கூறப்பட்ட சிக்கலைக் குறிக்கிறது. எபிரெயத்தைப் போலவே அதன் குறிப்பு வெளிப்படையாக விளக்கப்படாமல் ‘இதை’ என்று வைக்கப்பட்டுள்ளது.
- source_word: עָמָל
  choice: பெரும் சிரமம்
  rationale: עמל என்பது கடின உழைப்பு, தொல்லை, வருத்தம் அல்லது சோர்வூட்டும் பாடு எனப் பொருள்படும். இங்கு மனத்தால் புரிந்துகொள்ள முடியாத வேதனையான கடினத்தைக் குறிப்பதால் ‘பெரும் சிரமம்’ என்று தரப்பட்டுள்ளது.
- source_word: הִיא
  choice: அது ... இருந்தது
  rationale: பெண்பால் சுட்டுப்பெயரான זאת-ஐ மீண்டும் சுட்டும் பயனிலை அமைப்பு, தமிழில் இயல்பாக ‘அது ... இருந்தது’ என்று வழங்கப்பட்டுள்ளது.
- source_word: בְעֵינָי
  choice: என் பார்வையில்
  rationale: சொல்லுக்குச் சொல் ‘என் கண்களில்’ என்றாலும், இச்சொற்றொடர் ‘எனது மதிப்பீட்டில்’ அல்லது ‘எனக்கு’ என்ற தனிப்பட்ட அனுபவத்தைக் குறிக்கிறது. மூலத்தின் பார்வை உருவகத்தைப் பேண ‘என் பார்வையில்’ என்று மொழிபெயர்க்கப்பட்டுள்ளது.
