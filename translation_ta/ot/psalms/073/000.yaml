  yaml_path: translation/ot/psalms/073/000.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to the pure of heart.
translation:
  language: ta
  text: 'ஆசாப்பின் சங்கீதம்.[a]


    மெய்யாகவே, இஸ்ரவேலுக்கு, உள்ளத்தில் தூயவர்களுக்கு, கடவுள் நல்லவர்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ஆசாப்புக்குரிய சங்கீதம்” அல்லது “ஆசாப்புக்காக ஒரு சங்கீதம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: எபிரெய לְ முன்னொட்டு ஆசிரியர் உரிமை, தொடர்பு அல்லது அர்ப்பணம் ஆகிய பல உறவுகளைக் குறிக்கக்கூடும்.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: பாடுவதற்குரிய புனிதப் பாடலைக் குறிக்கும் எபிரெயச் சொல்லுக்கு, தமிழ் வேதாகம மரபிலும் பொதுப் பயன்பாட்டிலும் நன்கு அறியப்பட்ட சொல்.
- source_word: לְאָסָף
  choice: ஆசாப்பின்
  rationale: לְ என்ற முன்னொட்டு ஆசிரியர், தொடர்பு அல்லது அர்ப்பணம் ஆகியவற்றைக் குறிக்கக்கூடும்; தலைப்பில் இயல்பான தமிழுக்காக உடைமை வடிவம் பயன்படுத்தப்பட்டு, மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: אַךְ
  choice: மெய்யாகவே
  rationale: இங்கு உறுதியான வலியுறுத்தலை வெளிப்படுத்துகிறது; சங்கீதத்தின் தொடக்க அறிக்கையின் அழுத்தத்தைத் தக்கவைக்கிறது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு
  rationale: பெயரையும் ‘க்கு’ என்ற பயனிலைத் தொடர்பையும் நேரடியாகப் பேணுகிறது.
- source_word: לְבָרֵי לֵבָב
  choice: உள்ளத்தில் தூயவர்களுக்கு
  rationale: בַּר என்பது ‘தூய’ என்றும் לֵבָב என்பது மனிதனின் உள்ளார்ந்த மனம்/இருதயம் என்றும் பொருள்படும்; நவீன தமிழில் இயல்பாகவும் கருத்துக்கு நெருக்கமாகவும் மொழிபெயர்க்கப்பட்டது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கும் ஒருமைப் பயனுடைய பொதுவான, இயல்பான நவீன தமிழ் வடிவம்.
- source_word: טוֹב
  choice: நல்லவர்
  rationale: கடவுளைப் பற்றிய பண்புப்பெயராக இருப்பதால், தமிழில் மரியாதை ஒருமையுடன் இயல்பாக வழங்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘இஸ்ரவேலுக்கு’ மற்றும் ‘உள்ளத்தில் தூயவர்களுக்கு’ ஆகிய சொற்றொடர்களின் உறவு
  choice: இரண்டாவது சொற்றொடரை முதலாவதை விளக்கும் இணைச்சொற்றொடராக கோடுகளுக்குள் வைத்தல்
  alternative: இரண்டு தனித்தனி பயனாளிக் குழுக்களாக வாசித்தல்
  rationale: எபிரெயத்தில் இரு לְ-சொற்றொடர்களும் அடுத்தடுத்து வருகின்றன; ‘உள்ளத்தில் தூயவர்கள்’ என்பது ‘இஸ்ரவேல்’ என்பதைக் குறிப்பாக விளக்கலாம். கோடுகள் இந்த நெருங்கிய தொடர்பைக் காட்டுகின்றன; அதே நேரத்தில் வாக்கியத்தின் சுருக்கமான அமைப்பை அளவுக்கு மீறி விளக்குவதில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில், வழிபாட்டு மரியாதையையும் சாதாரண வாசகர்களுக்கான தெளிவையும் இணைக்கும் நடை. மூலத்தின் சுருக்கமும் வலியுறுத்தலும் பேணப்பட்டுள்ளன; தலைப்புக்கும் வசனத்திற்கும் இடையில் பத்தி இடைவெளி வைக்கப்பட்டுள்ளது.
