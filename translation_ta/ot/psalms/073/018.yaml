  text: אַ֣ךְ בַּ֭/חֲלָקוֹת תָּשִׁ֣ית לָ֑/מוֹ הִ֝פַּלְתָּ֗/ם לְ/מַשּׁוּאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/018.yaml
  text: Surely you set them in slippery places[b][a]; you cast them down to ruin.
translation:
  language: ta
  text: நிச்சயமாக, அவர்களை வழுக்கும் இடங்களில் வைக்கிறீர்[a]; அவர்களை அழிவுக்குள் விழச்செய்கிறீர்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “வழுக்கும் தரையில்”; சொல்லாட்சிப்படி, “மென்மையான இடங்களில்.”
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “அவர்களைப் பாழ்நிலைகளுக்குள் விழச்செய்கிறீர்”; மூலச்சொல் “பாழ்நிலைகள்” அல்லது “அழிவுகள்” என்றும் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: நிச்சயமாக
  rationale: இங்கு இச்சொல் கட்டுப்பாட்டைக் காட்டாமல், சங்கீதக்காரரின் உறுதியான உணர்வை வலியுறுத்துகிறது.
- source_word: בַּחֲלָקוֹת
  choice: வழுக்கும் இடங்களில்
  rationale: சொல்லாட்சிப்படி ‘மென்மையான இடங்களில்’ என்றாலும், சூழலில் நிலையற்ற, விழச்செய்யக்கூடிய தரையைக் குறிக்கிறது.
- source_word: תָּשִׁית לָמוֹ
  choice: அவர்களை ... நிறுத்துகிறீர்
  rationale: שׁית என்பதன் ‘வை/நிறுத்து’ என்ற பொருளையும், கடவுளை நோக்கிய இரண்டாம் நபர் ஒருமை வினையையும் இயல்பான தமிழில் காக்கிறது.
- source_word: הִפַּלְתָּם
  choice: அவர்களை ... விழச்செய்கிறீர்
  rationale: נפל என்பதன் ஹிப்ஃபில் வடிவிலுள்ள காரணவினைப் பொருளை நேரடியாகக் காக்கிறது.
- source_word: לְמַשּׁוּאוֹת
  choice: பாழில்
  rationale: இச்சொல் பாழ்வு, அழிவு அல்லது சிதைவுநிலையைக் குறிக்கிறது; ‘பாழில்’ என்பது விழுதலின் முடிவைச் சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: தீயோரின் வீழ்ச்சியில் கடவுளின் நேரடி செயற்பாடு
  choice: “நிறுத்துகிறீர் ... விழச்செய்கிறீர்” என்று கடவுளின் நேரடி செயல் காக்கப்பட்டுள்ளது.
  alternative: சூழ்நிலையால் அவர்கள் விழுவதாக மறைமுகமாக மொழிபெயர்த்தல்.
  rationale: எபிரெய வினைகள் கடவுளை நோக்கிய இரண்டாம் நபர் ஒருமையில் இருந்து, அவர்களுடைய நிலைநிறுத்தலையும் வீழ்ச்சியையும் அவருடைய செயலாக நேரடியாகக் கூறுகின்றன; இந்த இறையியல் பதற்றம் மென்மையாக்கப்படவில்லை.
translation_notes:
  register: நவீன செந்தமிழுக்கு ஏற்ற, மரியாதையும் கவித்துவச் சுருக்கமும் கொண்ட நடை. கடவுளை நோக்கிய ஒருமை மரியாதை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; எபிரெயக் காட்சிப்படிமமும் காரணவினையும் பாதுகாக்கப்பட்டுள்ளன.
