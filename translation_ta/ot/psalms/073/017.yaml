translation:
  language: ta
  text: தேவனுடைய பரிசுத்த இடங்களுக்குள் நான் செல்லும்வரை[a]; அப்போது அவர்களுடைய முடிவை[b] உணர்ந்துகொண்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘தேவனுடைய பரிசுத்த இடத்திற்குள்.’ எபிரெய மொழியில் ‘பரிசுத்த இடங்கள்’ என்ற பன்மை வடிவம் உள்ளது; அது தேவனுக்குரிய பரிசுத்த வளாகங்களைத் தொகுப்பாகக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘அவர்களுடைய இறுதி நிலை’ அல்லது ‘அவர்களுடைய இறுதி விளைவு.’ எபிரெயச் சொல் அவர்களுடைய இறுதிக் கதியையோ கடைசி விளைவையோ சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: செல்லும்வரை
  rationale: சங்கீதக்காரரின் குழப்பம் நீங்கி புரிதல் பிறந்த திருப்புமுனை வரை இருந்த கால எல்லையை இது வெளிப்படுத்துகிறது.
- source_word: אָבוֹא
  choice: நான் செல்லும்
  rationale: עַד என்பதுடன் இணைந்துள்ள இவ்வினை, தேவனுடைய பரிசுத்த இடத்திற்குள் சென்ற தீர்மானமான தருணத்தைச் சுட்டுகிறது; தமிழில் ‘செல்லும்வரை’ என்பது இயல்பாக அந்த நகர்வைத் தெரிவிக்கிறது.
- source_word: מִקְדְּשֵׁי אֵל
  choice: தேவனுடைய பரிசுத்த இடங்கள்
  rationale: எபிரெயச் சொல் பன்மை வடிவில் இருப்பதால் அதைத் தெளிவாகப் பன்மையிலேயே வைத்திருக்கிறது. இது தேவனுக்குரிய பரிசுத்த வளாகங்களைத் தொகுப்பாகவும் குறிக்கலாம்.
- source_word: אֵל
  choice: தேவன்
  rationale: இங்கு אֵל என்பது தெய்வீகப் பெயராகப் பயன்படுவதால், நவீனத் தமிழில் தெளிவான ‘தேவன்’ என மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: אָבִינָה
  choice: அப்போது ... உணர்ந்துகொண்டேன்
  rationale: בין வேர்ச்சொல் ஆழ்ந்து புரிந்துகொள்வதையோ பகுத்துணர்வதையோ குறிக்கிறது. வாக்கியங்களின் தொடர்ச்சியில் உள்ள காலமுறைத் திருப்பத்தை ‘அப்போது’ வெளிப்படுத்துகிறது.
- source_word: לְאַחֲרִיתָם
  choice: அவர்களுடைய முடிவு
  rationale: אַחֲרִית இங்கு அவர்களுடைய இறுதி நிலை அல்லது இறுதியான விளைவைக் குறிக்கிறது. ‘முடிவு’ சுருக்கமாகவும் வலிமையாகவும் உள்ளது.
theological_decisions:
- issue: מִקְדְּשֵׁי என்பதை மரபான ஒருமையில் தருவதா, எபிரெயப் பன்மையைப் பேணுவதா
  choice: தேவனுடைய பரிசுத்த இடங்கள்
  alternative: தேவனுடைய பரிசுத்த இடம்
  rationale: மூலமொழிக்கு முன்னுரிமை அளித்து, எபிரெயப் பன்மை முதன்மை உரையில் பேணப்பட்டுள்ளது. இது தனியான கோட்பாட்டு முடிவைத் திணிக்காமல், தேவனுக்குரிய பரிசுத்த வளாகங்களைத் தொகுப்பாகக் குறிக்கும் வாய்ப்பைத் திறந்துவைக்கிறது.
- issue: לְאַחֲרִיתָם என்பது வெறும் முடிவையா அல்லது இறுதி கதியையா குறிக்கிறது
  choice: அவர்களுடைய முடிவு
  alternative: அவர்களுடைய இறுதி விளைவு
  rationale: ‘முடிவு’ என்ற சொல் இறுதி நிலை, கதி, விளைவு ஆகிய பொருள் நிழல்களைத் திறந்துவைத்து, ஒரு குறிப்பிட்ட இறையியல் விளக்கத்தை உரைக்குள் சேர்ப்பதைத் தவிர்க்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடிய அதேவேளையில் கண்ணியமான நடையில் வடிவமைக்கப்பட்டது. மூலத்தின் பன்மையும் ‘முடிவு’ என்பதிலுள்ள இறுதிக் கதி/விளைவு சார்ந்த பொருள் விரிவும் பேணப்பட்டுள்ளன.
