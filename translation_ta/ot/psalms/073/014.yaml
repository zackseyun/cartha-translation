  text: וָ/אֱהִ֣י נָ֭גוּעַ כָּל הַ/יּ֑וֹם וְ֝/תוֹכַחְתִּ֗/י לַ/בְּקָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/014.yaml
  text: For I was afflicted all day long[b][a], and chastened every morning.
translation:
  language: ta
  text: ஏனெனில், நாள் முழுவதும் நான் துன்புறுத்தப்பட்டேன்[a]; ஒவ்வொரு காலையிலும் திருத்தப்பட்டேன்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “தாக்கப்பட்டேன்,” “வாதிக்கப்பட்டேன்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “என் திருத்துதல்/கண்டிப்பு காலைகளில் இருந்தது.” ஒவ்வொரு காலையிலும் மீண்டும் மீண்டும் நிகழ்ந்த கண்டிப்பு அல்லது ஒழுக்கப்படுத்துதலே பொருள்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: நான் … வாதிக்கப்பட்டேன்
  rationale: வாவ் இணைப்புடன் வரும் היה வடிவம் முந்தைய வசனத்தின் எண்ணத்தைத் தொடர்கிறது. தமிழில் தனியே காரணச்சொல் சேர்க்காமல் தொடர்ச்சியை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: נָגוּעַ
  choice: வாதிக்கப்பட்டேன்
  rationale: ‘தாக்கப்பட்டவன்/துன்புறுத்தப்பட்டவன்’ என்ற பரந்த செயல்பாட்டு நிலையை இது குறிக்கிறது. நோய் அல்லது கொள்ளைநோய் எனக் குறுக்காமல், அனுபவித்த துன்பத்தை நவீன கண்ணியமான தமிழில் தெரிவிக்கிறது.
- source_word: כָּל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: முழு நாளையும் உள்ளடக்கும் காலநீட்சியை இயல்பான தமிழில் துல்லியமாகக் காட்டுகிறது.
- source_word: וְתוֹכַחְתִּי
  choice: எனக்குக் கண்டிப்பு வந்தது
  rationale: முதல் நபர் பின்னொட்டுடன் உள்ள ‘என் கண்டிப்பு/திருத்துதல்’ என்ற பெயர்ச்சொல் அமைப்பைப் பெயர்ச்சொல் தன்மை கெடாமல் இயல்பான தமிழில் தருகிறது; இது வெறும் வாய்மொழிக் கடிந்துகொள்ளுதலா அல்லது ஒழுக்கப்படுத்துதலா என்பதைத் தீர்மானிக்கவில்லை.
- source_word: לַבְּקָרִים
  choice: ஒவ்வொரு காலையிலும்
  rationale: ‘காலைகளில்’ என்ற எபிரெயப் பன்மையின் பகிர்வு மற்றும் மீள்நிகழ்வு பொருளைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: துன்பத்தின் இயல்பு
  choice: நோய் அல்லது தண்டனைக்குரிய கோபம் என்று குறிப்பாக்காத பொதுவான வாதிப்பு மற்றும் கண்டிப்பு மொழி
  alternative: உடல் சார்ந்த கொள்ளைநோய் போன்ற தாக்குதல்; அல்லது முதன்மையாக வாய்மொழிக் கடிந்துகொள்ளுதல்
  rationale: எபிரெயச் சொற்கள் தாக்கப்படுதல்/வாதிக்கப்படுதல் மற்றும் கண்டிப்பு/திருத்துதல் ஆகிய பரந்த கருத்துகளைத் தருகின்றன. ஆகவே உள்ள தெளிவின்மையும் இறையியல் பதற்றமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டது. ‘வாதிக்கப்பட்டேன்’ துன்பத்தின் காரணத்தையோ வடிவத்தையோ மிகைப்படுத்தாமல் காக்கிறது; ‘கண்டிப்பு வந்தது’ மூலத்தின் பெயர்ச்சொல் அமைப்பையும் அதன் பரந்த பொருளையும் பேணுகிறது.
