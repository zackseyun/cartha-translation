    reason: lexical_alternative
  revision_rationale: The revision restores the explanatory force of כִּי with ‘ஏனெனில்,’ retains the heart and kidneys as the parallel inner organs, and renders the piercing image in clear modern Tamil. The footnote preserves the Hebrew idiom’s possible emotional sense while retaining the literal organ in the main text.
