revisions:
- from: என் இதயம் கசந்திருந்தபோதும், என் சிறுநீரகங்களில்[a] நான் குத்தப்பட்டபோதும்,
  to: ஏனெனில், என் இதயம் கசந்திருந்தது; என் சிறுநீரகங்கள்[a] குத்தப்பட்டன.
  rationale: The revision restores the explanatory force of כִּי with ‘ஏனெனில்,’ retains the heart and kidneys as the parallel inner organs, and renders the piercing image in clear modern Tamil. The footnote preserves the Hebrew idiom’s possible emotional sense while retaining the literal organ in the main text.
