source:
  edition: WLC
  text: כִּ֭י יִתְחַמֵּ֣ץ לְבָבִ֑/י וְ֝/כִלְיוֹתַ֗/י אֶשְׁתּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/021.yaml
  text: For my heart was embittered[a], and my kidneys were pierced.
translation:
  language: ta
  text: ஏனெனில், என் இதயம் கசந்திருந்தது; என் சிறுநீரகங்கள்[a] குத்தப்பட்டன.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘சிறுநீரகங்கள்’ என்பது ஆழ்ந்த உள்ளுணர்வுகளைக் குறிக்கவும் பயன்படும் எபிரெய மொழி உருவகம்; ‘என் உள்ளத்தின் ஆழம்’ என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: —போதும்
  rationale: இங்கு כִּי அடுத்த வசனத்துடன் இணைந்து, சங்கீதக்காரனின் முந்தைய மனநிலையைச் சுட்டும் காலவியல் பொருளில் ‘அப்போது/போது’ எனப் புரிந்துகொள்ளப்படுகிறது. தமிழ் வாக்கியத்தில் இரு வினைகளோடும் ‘போதும்’ இணைக்கப்பட்டுள்ளது.
- source_word: יִתְחַמֵּץ
  choice: கசந்திருந்தது
  rationale: חמץ என்பதன் ‘புளித்தல்/கசத்தல்’ என்ற உருவகத்தைத் தக்கவைத்து, உள்ளம் வேதனையாலும் கசப்பாலும் நிறைந்திருந்த நிலையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: לְבָבִי
  choice: என் இதயம்
  rationale: எபிரெய மொழியில் சிந்தனை, விருப்பம், உணர்ச்சி ஆகியவற்றின் உள்மையத்தைக் குறிக்கும் ‘இதயம்’ என்ற உருவகத்தைப் பராமரிக்கிறது.
- source_word: וְכִלְיוֹתַי
  choice: என் சிறுநீரகங்களில்
  rationale: כִּלְיָה என்பதன் நேரடியான உடலுறுப்பு உருவகத்தை முதன்மை உரையில் தக்கவைக்கிறது; அதன் ஆழ்ந்த உளவுணர்வு சார்ந்த பொருள் அடிக்குறிப்பில் விளக்கப்படுகிறது.
- source_word: אֶשְׁתּוֹנָן
  choice: நான் குத்தப்பட்டேன்
  rationale: அரிய எபிரெய வினையின் கூர்மையாகக் குத்தப்பட்ட அல்லது துளைக்கப்பட்ட உணர்வை உடல்சார் உருவகத்துடன் பாதுகாக்கிறது.
theological_decisions:
- issue: உடலுறுப்பான ‘சிறுநீரகங்கள்’ என்பதன் உருவகப் பொருள்
  choice: நேரடியான உடலுறுப்பை முதன்மை உரையில் வைத்தல்
  alternative: ‘என் உள்ளத்தின் ஆழத்தில்’ என்று விளக்கிப் பெயர்த்தல்
  rationale: எபிரெய மனிதவியல் உருவகத்தை மறைக்காமல் பாதுகாத்து, நவீன வாசகருக்குத் தேவையான விளக்கத்தை அடிக்குறிப்பில் வழங்குகிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெய மூலத்தின் ‘இதயம் கசத்தல்’, ‘சிறுநீரகங்களில் குத்தப்படுதல்’ ஆகிய வலுவான உடல்சார் உருவகங்கள் பாதுகாக்கப்பட்டுள்ளன. வசனம் அடுத்த வசனத்துடன் தொடரும் அமைப்பில் இருப்பதால் இறுதியில் காற்புள்ளி இடப்பட்டுள்ளது.
