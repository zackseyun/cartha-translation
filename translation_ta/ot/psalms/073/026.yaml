reference: Psalms 73:26
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כָּלָ֥ה שְׁאֵרִ֗/י וּ/לְבָ֫בִ֥/י צוּר לְבָבִ֥/י וְ/חֶלְקִ֗/י אֱלֹהִ֥ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/026.yaml
  text: My flesh and my heart may fail[b][a], but God is the rock of my heart and my portion forever.
translation:
  language: ta
  text: என் உடலும் என் இதயமும் அழிந்துபோகலாம்[a]; ஆனால் கடவுள் என் இதயத்தின் கன்மலையும் என்றென்றும் என் பங்குமாய் இருக்கிறார்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் உடலும் என் இதயமும் அழிந்துபோகின்றன.” எபிரெய வினை நிகழ்காலமாகவோ பொதுவான கூற்றாகவோ புரிந்துகொள்ளப்படலாம்; அது தேய்ந்து போதல், முடிவுக்கு வருதல், செயலிழத்தல் ஆகிய நுணுக்கங்களையும் கொண்டுள்ளது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கடவுள் என் இதயத்தின் வலிமை.” எபிரெயம் இன்னும் நேரடியாக, “கடவுள் என் இதயத்தின் கன்மலை” என்று கூறுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: அழிந்துபோகலாம்
  rationale: இந்த வினை முடிவுக்கு வருதல், தேய்ந்து ஒழிதல், செயலிழத்தல் ஆகிய பொருள்களைத் தருகிறது. சூழலில் மனிதனின் உடல் மற்றும் உள்ளார்ந்த வாழ்வின் நிலையாமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது; எபிரெய வினையின் கால/நிலைத் தெளிவின்மையை அடிக்குறிப்பில் காக்கிறது.
- source_word: שְׁאֵרִי
  choice: என் உடல்
  rationale: இங்கு ‘என் இதயம்’ என்பதோடு இணைந்து வருவதால், உடல்சார்ந்த இருப்பைக் குறிக்கிறது. ‘என் மாம்சம்’ என்பதைக் காட்டிலும் ‘என் உடல்’ சாதாரண நவீனத் தமிழில் இயல்பாகவும் தெளிவாகவும் உள்ளது.
- source_word: לְבָבִי
  choice: என் இதயம்
  rationale: இந்தச் சொல் சிந்தனை, விருப்பம், உள்ளார்ந்த மனிதன் ஆகியவற்றை உள்ளடக்கலாம். இங்கு கவிதை உருவகத்தையும் இருமுறை வரும் வலியுறுத்தலையும் காக்க ‘இதயம்’ பயன்படுத்தப்படுகிறது.
- source_word: צוּר
  choice: கன்மலை
  rationale: சொல்லின் நேரடியான பாறை உருவகத்தைப் பாதுகாக்கிறது. நிலைத்தன்மை, பாதுகாப்பு, நம்பகத்தன்மை ஆகியவற்றை உருவகம் உணர்த்துகிறது; அதை வெறும் ‘வலிமை’ என்று விளக்கிச் சுருக்கவில்லை.
- source_word: חֶלְקִי
  choice: என் பங்கு
  rationale: கடவுளே ஒருவருக்குரிய நிலையான பங்கு அல்லது உரிமைப் பேறு என்ற உருவகத்தைத் தெளிவாகவும் சுருக்கமாகவும் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு இஸ்ரவேலின் கடவுளைக் குறிக்கும் நேரடியான அறிக்கையாக இருப்பதால், நவீன நிலையான தமிழில் ‘கடவுள்’ இயல்பான தேர்வு.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவில்லாத நிலைப்பாட்டை கவிதைநயமுள்ள இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தொடக்கக் கூறிலுள்ள மனித இயல்பு சார்ந்த மொழி
  choice: என் உடலும் என் இதயமும் அழிந்துபோகலாம்
  alternative: என் மாம்சமும் என் இதயமும் அழிந்துபோகின்றன
  rationale: உடல்சார்ந்த பலவீனத்தையும் உள்ளார்ந்த மனிதனின் நிலையாமையையும் கடவுளின் நிலையான போதுமான தன்மையோடு எதிரெதிராக நிறுத்துகிறது. ‘உடல்’ என்பது இச்சூழலில் שְׁאֵר என்பதன் பொருளை இயல்பான நவீனத் தமிழில் தருகிறது; வினையின் சாத்திய அல்லது பொதுவான அனுபவ நுணுக்கம் பிரதான உரையில் காக்கப்படுகிறது.
- issue: צוּר என்பதில் கடவுளுக்கான உருவகம்
  choice: கடவுளே என் இதயத்தின் கன்மலை
  alternative: கடவுளே என் இதயத்தின் வலிமை
  rationale: மூல எபிரெயம் பயன்படுத்தும் தெளிவான பாறை உருவகத்தை மொழிபெயர்ப்பு பாதுகாக்கிறது. ‘வலிமை’ என்பது சாத்தியமான விளக்கப் பொருள் என்றாலும், அது நிலைத்தன்மை, பாதுகாப்பு, நம்பகத்தன்மை ஆகிய விரிந்த உருவகச் செறிவை ஒரே கருத்தாகக் குறைத்துவிடும்.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் வகையில் dignified கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘இதயம்’ என்ற மறுபடியான சொல் எபிரெயக் கவிதையின் வலியுறுத்தலுக்காகக் காக்கப்பட்டுள்ளது; ‘கன்மலை’ என்ற சற்றே செறிவான வேதாகம உருவகம் விளக்கமாக மாற்றப்படவில்லை.
