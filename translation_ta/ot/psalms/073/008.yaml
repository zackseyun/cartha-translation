source:
  edition: WLC
  text: יָמִ֤יקוּ וִ/ידַבְּר֣וּ בְ/רָ֣ע עֹ֑שֶׁק מִ/מָּר֥וֹם יְדַבֵּֽרוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/008.yaml
  text: They scoff and speak with malice[a]; from on high they speak oppression.
translation:
  language: ta
  text: அவர்கள் ஏளனம் செய்து, தீய எண்ணத்தோடு பேசுகிறார்கள்; உயரத்திலிருந்து அவர்கள் ஒடுக்குமுறையைப் பேசுகிறார்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அவர்கள் கேலி செய்து தீயவற்றைப் பேசுகிறார்கள்; அகந்தையுடன் ஒடுக்குமுறையைப் பேசுகிறார்கள்.’ தொடக்க எபிரேய வினைச்சொல்லின் பொருள் கடினமானது; ‘உயரத்திலிருந்து’ என்பது ஓர் இடத்தைக் குறிப்பதற்குப் பதிலாக, அகந்தையான பேச்சு முறையையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִיקוּ
  choice: ஏளனம் செய்து
  rationale: இந்த வினையின் பொருள் கடினமானது. சூழலில் வரும் அகந்தையான பேச்சோடு இணைத்துப் பார்க்கும்போது, இகழ்ச்சியுடன் கேலி செய்வதைக் குறிக்கும் இந்தத் தேர்வு பொருத்தமாகிறது; ‘சீர்கெட்டிருக்கிறார்கள்’ போன்ற அதிக ஊகத்தன்மையுள்ள பொருளை இது திணிப்பதில்லை.
- source_word: וִידַבְּרוּ
  choice: பேசுகிறார்கள்
  rationale: இணைப்புச் சொல்லுடன் வரும் வினை, பொல்லாதவர்களின் நடத்தையைத் தொடர்ந்து விவரிக்கிறது; தமிழில் இயல்பான வாக்கிய அமைப்புக்காகப் பெயரெச்ச வினையுடன் இணைக்கப்பட்டுள்ளது.
- source_word: בְרָע
  choice: தீய நோக்கத்துடன்
  rationale: בְ என்ற முன்னொட்டுடன் வரும் רָע, அவர்களுடைய பேச்சின் தன்மையையோ நோக்கத்தையோ விவரிக்கிறது. இந்தத் தேர்வு ஒழுக்கத் தீமையையும் பகைமைத் தன்மையையும் இயல்பான நவீன தமிழில் தருகிறது.
- source_word: עֹשֶׁק
  choice: அடக்குமுறை
  rationale: இந்தப் பெயர்ச்சொல் பொதுவாக ஒடுக்குதல் அல்லது சுரண்டலைக் குறிக்கிறது. ‘அடக்குமுறை’ அதன் சமூக-அறநெறி வலிமையைத் தக்கவைத்து, பணம் சார்ந்த மிரட்டிப் பறித்தலாக மட்டும் பொருளைக் குறுக்குவதில்லை.
- source_word: מִמָּרוֹם
  choice: உயரத்திலிருந்து
  rationale: சொற்பொருளாக ‘உயரத்திலிருந்து’ அல்லது ‘உன்னத இடத்திலிருந்து’ என்பதாகும். இங்கு அது இடத்தையோ அகந்தையான முறையையோ குறிக்கக்கூடிய உருவகத் தெளிவின்மையைத் தக்கவைக்கிறது.
- source_word: יְדַבֵּרוּ
  choice: பேசுகிறார்கள்
  rationale: எபிரெய உரையில் வினை மீண்டும் வருவதால் ஏற்படும் வலியுறுத்தலையும் இணை அமைப்பையும் காக்க, தமிழிலும் ‘பேசுகிறார்கள்’ மீண்டும் இடம்பெறுகிறது.
