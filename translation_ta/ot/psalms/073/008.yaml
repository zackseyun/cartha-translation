  register: நவீன நிலையான தமிழில், பொதுவாசகர்கள் புரிந்துகொள்ளும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டது. எபிரெய இணை அமைப்பும் இரண்டாவது ‘பேசுகிறார்கள்’ என்ற வினைமீளலும் காக்கப்பட்டுள்ளன; தொடக்க வினை மற்றும் מִמָּרוֹם ஆகியவற்றின் உண்மையான தெளிவின்மை அடிக்குறிப்பில் தரப்பட்டுள்ளது.
