  yaml_path: translation/ot/psalms/073/015.yaml
  text: If I had said[a], “I will speak thus,” behold, I would have betrayed the generation of your children.
translation:
  language: ta
  text: “நான் இவ்வாறு பேசுவேன்” என்று சொல்லியிருந்தால், இதோ, உமது பிள்ளைகளின் தலைமுறைக்குத் துரோகம் செய்திருப்பேன்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது மகன்களின் தலைமுறையிடம் நம்பிக்கையின்றி நடந்துகொண்டிருப்பேன்.”
    reason: בָגַד என்பதற்கு ‘துரோகம் செய்தல்’ என்பதோடு ‘நம்பிக்கையின்றி நடத்தல்’ என்ற நுட்பமும் உண்டு; בָּנֶיךָ என்பதன் வடிவரீதியான மொழிபெயர்ப்பு ‘உமது மகன்கள்’ ஆகும்.
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: சொல்லியிருந்தால்
  rationale: אִם அறிமுகப்படுத்தும் நிபந்தனையையும், இச்சூழலில் אָמַרְתִּי தரும் நிகழாத அல்லது எண்ணிப்பார்க்கப்பட்ட கடந்தகாலச் செயலையும் இயல்பான தமிழில் ஒருங்கிணைக்கிறது.
- source_word: אֲסַפְּרָה כְמוֹ
  choice: நான் இவ்வாறு பேசுவேன்
  rationale: ספר என்பதன் அடிப்படைப் பொருள் ‘சொல்லுதல்/விவரித்தல்’; כְמוֹ உடன் இங்கு முன் கூறிய மனப்பாங்கை வெளிப்படையாகப் பேசுவதைக் குறிக்கிறது. ‘இவ்வாறு பேசுவேன்’ என்பது அதன் சுட்டும் தன்மையைக் காக்கிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: திடீர் உணர்வையும் வலியுறுத்தலையும் வெளிப்படுத்தும் எபிரெயச் சொல்லின் சொல்லாட்சிச் செறிவைத் தமிழில் காக்கிறது.
- source_word: דּוֹר בָּנֶיךָ
  choice: உமது பிள்ளைகளின் தலைமுறை
  rationale: דּוֹר என்பதற்கு ‘தலைமுறை’ என்ற நேரடிப் பொருளையும், בָּנֶיךָ என்பதன் சூழல்சார் கூட்டுப்பொருளை ‘உமது பிள்ளைகள்’ என்றும் வழங்குகிறது; இங்கு ஆண்களை மட்டும் குறிக்கும் தேவையில்லை.
- source_word: בָגָדְתִּי
  choice: துரோகம் செய்திருப்பேன்
  rationale: בגד குறிக்கும் உறவுசார் நம்பிக்கையின்மை அல்லது வஞ்சகச் செயலைத் தெளிவாகத் தெரிவிக்கிறது; நிபந்தனை அமைப்புக்கேற்ப ‘செய்திருப்பேன்’ பயன்படுத்தப்பட்டுள்ளது.
theological_decisions:
- issue: ‘உமது பிள்ளைகள்’ என்பதன் குறிப்பு
  choice: கடவுளை நோக்கிப் பேசப்பட்டதாகவும், அவரது மக்களாகிய சமூகத்தைக் கூட்டாகக் குறிப்பதாகவும் மொழிபெயர்க்கப்பட்டது.
  alternative: ஆண்பால் வடிவத்தை முறையாகப் பின்பற்றி ‘உமது மகன்கள்’ என்று மொழிபெயர்த்தல்.
  rationale: இரண்டாம் நபர் ஆண்பால் ஒருமை பின்னொட்டு கடவுளை நோக்குகிறது; பன்மை ‘மகன்கள்’ இச்சூழலில் அவருக்குரிய மக்களைக் கூட்டாகக் குறிக்கக்கூடும். ஆகவே தமிழ் வாசகனுக்கு இயல்பாகவும் உள்ளடக்கமான பொருளுக்கு உண்மையாகவும் ‘பிள்ளைகள்’ தேர்ந்தெடுக்கப்பட்டது.
- issue: சங்கீதக்காரன் செய்யத் தவிர்த்த துரோகம்
  choice: தன் சந்தேக மனப்பாங்கை வெளிப்படையாகப் பேசுவது கடவுளுடைய மக்களுக்குச் செய்யும் துரோகமாக இருந்திருக்கும் என்ற நிபந்தனைப் பொருள் காக்கப்பட்டது.
  alternative: இதை ஏற்கெனவே நடந்த உண்மையான துரோகமாகப் புரிந்துகொள்ளுதல்.
  rationale: אִם உடனான வினை அமைப்பும் சூழலும் நிகழாத, எண்ணிப்பார்க்கப்பட்ட செயலைக் குறிக்கின்றன; எனவே இறையியல் முடிவை அதிகப்படுத்தாமல் ‘செய்திருப்பேன்’ என வழங்கப்பட்டது.
translation_notes:
  register: நவீன தரத் தமிழில் இயல்பாகவும் மரியாதைமிக்கதாகவும் அமைக்கப்பட்டுள்ளது. கடவுளை நோக்கும் உரைக்கு ‘உமது’ பயன்படுத்தப்பட்டது. ‘இதோ’ என்ற சொல் எபிரெய உரையின் திடீர் வலியுறுத்தலைக் காக்கிறது; மூலத்தின் நிபந்தனைத் தன்மையும் உறவுசார் பதற்றமும் தீர்த்துவைக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
