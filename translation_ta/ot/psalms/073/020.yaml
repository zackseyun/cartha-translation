source:
  edition: WLC
  text: כַּ/חֲל֥וֹם מֵ/הָקִ֑יץ אֲ֝דֹנָ/י בָּ/עִ֤יר צַלְמָ֬/ם תִּבְזֶֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/020.yaml
  text: Like a dream when one awakes[a], Lord, when you rouse yourself, you will despise their image.
translation:
  language: ta
  text: விழித்தெழும்போது கனவைப்போல, ஆண்டவரே, நீர் எழும்போது[a] அவர்களுடைய உருவத்தை இகழ்வீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'அல்லது, சாத்தியம் குறைந்த வாசிப்பு: “ஆண்டவரே, நகரத்தில் அவர்களுடைய உருவத்தை இகழ்வீர்.” எபிரெய மெய்யெழுத்துகளை இவ்வாறும் வாசிக்கலாம்; ஆனால் சூழல் “நீர் எழும்போது” என்ற பொருளையே வலுவாக ஆதரிக்கிறது.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: கனவைப்போல
  rationale: כ முன்னொட்டு உவமையைக் குறிக்கிறது; חֲלוֹם என்பதன் பொருள் ‘கனவு’. தமிழில் ‘கனவைப்போல’ இயல்பாக உவமையைத் தக்கவைக்கிறது.
- source_word: מֵהָקִיץ
  choice: விழித்தெழும்போது மறையும்
  rationale: קיץ/יקץ என்பது ‘விழித்தல்’ எனப் பொருள்படும்; מֵ இங்கு காலச்சூழலைக் குறிக்கலாம். தமிழில் கனவின் நிலையாமையைத் தெளிவாகக் காட்ட ‘விழித்தெழும்போது மறையும்’ என மொழிபெயர்க்கப்பட்டுள்ளது; ‘மறையும்’ என்பது உவமையில் உள்ள மறைபொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: இது இறைவனை நேரடியாக அழைக்கும் பட்டப்பெயர். அழைப்புவேற்றுமையுடன் ‘ஆண்டவரே’ என்பது நவீனத் தமிழில் இயல்பும் கண்ணியமும் உடையது.
- source_word: בָּעִיר
  choice: நீர் விழித்தெழும்போது
  rationale: மெய்யெழுத்துகளை ‘நகரத்தில்’ என்றும் வாசிக்க இயன்றாலும், עור என்ற ‘விழித்தெழு/எழுந்து செயல்படு’ என்னும் வினைப்பொருள் முன்வரும் கனவு–விழிப்பு உவமைக்கும் கவிதை இணைப்புக்கும் மிகச் சிறப்பாகப் பொருந்துகிறது.
- source_word: צַלְמָם
  choice: அவர்களுடைய உருவத்தை
  rationale: צֶלֶם என்பது ‘உருவம், படிமம், தோற்றம்’ எனப் பொருள்படும். ‘உருவம்’ மூலச்சொல்லின் பரப்பைத் தக்கவைத்து, இங்கு தீயோரின் நிலையற்ற வெளித்தோற்றத்தையும் சுட்டக்கூடியதாக உள்ளது.
- source_word: תִּבְזֶה
  choice: இகழ்வீர்
  rationale: בזה என்பது ‘இகழ்தல், மதிப்பற்றதாகக் கருதுதல்’. சூழலில் இறைச் செயலை எதிர்நோக்கும் imperfect வடிவைத் தமிழின் மரியாதைமிக்க எதிர்கால வினையாக ‘இகழ்வீர்’ என வழங்குகிறது.
theological_decisions:
- issue: בָּעִיר என்பதன் பொருளாக்கம்
  choice: 'வினை வாசிப்பு: ‘நீர் விழித்தெழும்போது’'
  alternative: 'இடப்பொருள் பெயர்ச்சொல் வாசிப்பு: ‘நகரத்தில்’'
  rationale: கனவிலிருந்து ஒருவர் விழிப்பதைக் கூறும் உடனடி உவமை, ஆண்டவர் எழுந்து செயல்படுவதைக் குறிக்கும் வினை வாசிப்பை வலுப்படுத்துகிறது. மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது; தேவையற்ற இறையியல் விளக்கம் சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதக் கவிதைக்கேற்ற கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘விழித்தெழு’ என்ற மீளுரைத்தல் எபிரெய மூலத்தின் கனவு–விழிப்பு இணைப்பைப் பாதுகாக்கிறது; அடிக்குறிப்பு குறியீடு தொடர்புடைய சர்ச்சைக்குரிய வாசிப்பிடத்தில் வைக்கப்பட்டுள்ளது.
