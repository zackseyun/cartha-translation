  yaml_path: translation/ot/psalms/073/006.yaml
  text: Therefore pride is their necklace[a]; violence covers them like a garment.
translation:
  language: ta
  text: ஆகவே, பெருமை அவர்களுடைய கழுத்தணியாக இருக்கிறது[a]; வன்முறை அவர்களை ஆடைபோல் போர்த்துகிறது.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகவே, பெருமை அவர்களைக் கழுத்தணி போல அலங்கரிக்கிறது; வன்முறை அவர்களை ஆடை போலப் போர்த்துகிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகவே
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட பொல்லாதவர்களின் நிலையின் விளைவைச் சுட்டும் காரணவிளைவு இணைப்பை இயல்பாகக் காக்கிறது.
- source_word: עֲנָקַתְמוֹ
  choice: அவர்களுடைய கழுத்தணியாக இருக்கிறது
  rationale: ענק என்பதன் கழுத்தில் அணியும் அணி என்ற உருவகத்தைச் சுருக்கமாகவும் தெளிவாகவும் வெளிப்படுத்துகிறது.
- source_word: גַאֲוָה
  choice: பெருமை
  rationale: இச்சூழலில் கண்டிக்கப்படும் தன்னுயர்வு அல்லது அகந்தையைச் சுட்டுகிறது; நவீனத் தமிழில் இயல்பான முதன்மை இணைச்சொல்.
- source_word: יַעֲטָף
  choice: மூடிக்கொள்கிறது
  rationale: சுற்றிப் போர்த்துதல் அல்லது மூடுதல் என்ற வினையின் பொருளையும், ஆடை உருவகத்தையும் காக்கிறது.
- source_word: שִׁית
  choice: ஆடைபோல்
  rationale: அரிதான எபிரெயச் சொல்லை ஆடை அல்லது உடுப்பு எனப் புரிந்துகொண்டு, தமிழில் உருவக ஒப்புமையைத் தெளிவாக்குகிறது.
- source_word: חָמָס
  choice: வன்முறை
  rationale: கொடுமையான அநீதி உட்பட வன்முறையைக் குறிக்கும் சொல்லின் நேரடியான, சூழலுக்கேற்ற மொழிபெயர்ப்பு.
- source_word: לָמוֹ
  choice: அவர்களை
  rationale: இவ்வினைக் கட்டமைப்பில் உருவகமாக மூடப்படுகிற நபர்களைக் குறிக்கும் இயல்பான தமிழ் வடிவம்.
