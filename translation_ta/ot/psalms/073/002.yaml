source:
  edition: WLC
  text: וַ/אֲנִ֗י כִּ֭/מְעַט נטוי רַגְלָ֑/י כְּ֝/אַ֗יִן שפכה אֲשֻׁרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/002.yaml
  text: But as for me[a], my feet had almost stumbled; my steps had nearly slipped.
translation:
  language: ta
  text: ஆனால் நானோ, என் கால்கள் கிட்டத்தட்ட இடறின; என் அடிகள் ஏறக்குறைய நழுவின.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் கால்கள் கிட்டத்தட்ட வழுக்கின; என் அடிகள் ஏறக்குறைய நிலைதவறின.” எபிரெயக் கவிதையின் இணைவரிகள், நிலைத்தன்மையை இழக்கும் ஒன்றோடொன்று ஒத்த படிமங்களைச் சற்றே வேறுபட்ட சொற்களில் மொழிபெயர்க்க இடமளிக்கின்றன.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: இணைப்புச்சொல் முந்தைய கருத்துடன் உள்ள வேறுபாட்டையும், தனிப்பெயர்ச்சொல் பேசுபவருக்குக் கொடுக்கப்படும் அழுத்தத்தையும் காட்டுகிறது.
- source_word: כִּמְעַט
  choice: கிட்டத்தட்ட
  rationale: நடக்கவிருந்த ஒன்று மிக நெருக்கத்தில் தவிர்க்கப்பட்டது என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
- source_word: נטוי
  choice: இடறியிருந்தன
  rationale: சூழலில் கால்கள் நிலைதடுமாறும் படிமத்தைத் தருகிறது. ‘விலகியிருந்தன’ என்பதும் சாத்தியம்; ஆனால் இங்கு உடல் நிலைத்தன்மையைச் சுட்டும் ‘இடறியிருந்தன’ இயல்பாக உள்ளது.
- source_word: רַגְלָי
  choice: என் கால்கள்
  rationale: வாழ்க்கைப் போக்கையோ நிலைத்தன்மையையோ குறிக்கக்கூடிய மூலமொழியின் உடல் சார்ந்த படிமத்தை நேரடியாகப் பாதுகாக்கிறது.
- source_word: כְּאַיִן
  choice: ஏறக்குறைய
  rationale: ‘கிட்டத்தட்ட ஒன்றுமில்லாத அளவுக்கு’ என்ற எபிரெயச் சொல்லாட்சியின் சூழல்சார் வலிமையை இயல்பான தமிழில் தெரிவிக்கிறது.
- source_word: שָׁפְכָה
  choice: வழுக்கியிருந்தன
  rationale: அடிப்படைப் பொருள் ‘ஊற்றப்படுதல்/சிந்தப்படுதல்’ என்றாலும், ‘அடிகள்’ என்பதுடன் இது காலூன்றலை இழந்து வழுகும் கவித்துவப் படிமமாக அமைகிறது.
- source_word: אֲשֻׁרָי
  choice: என் அடிகள்
  rationale: நடையையோ வாழ்க்கைப் போக்கையோ சித்தரிக்கும் மூலமொழிப் படிமத்தைச் சுருக்கமாகவும் இயல்பாகவும் காக்கிறது.
theological_decisions:
- issue: நிலைதடுமாற்றத்தைக் குறிக்கும் உருவகம்
  choice: ‘கால்கள்,’ ‘அடிகள்,’ ‘இடறுதல்,’ ‘வழுக்குதல்’ என்ற உடல்/பாதைப் படிமங்களையே தக்கவைத்தல்
  alternative: ‘என் விசுவாசத்தை ஏறக்குறைய இழந்தேன்’ அல்லது ‘ஒழுக்கத்தில் ஏறக்குறைய விழுந்தேன்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இந்த வசனம் அந்தத் தடுமாற்றத்தின் துல்லியமான ஆன்மிக அல்லது ஒழுக்க இயல்பை வெளிப்படையாகக் கூறவில்லை. ஆகவே உருவகத்தைத் தக்கவைப்பது அதன் உண்மையான இறையியல் பதற்றத்தையும் பொருள் விரிவையும் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், எளிதில் புரியக்கூடியதாயும் கவிதைக்குரிய கண்ணியத்துடனும் வடிவமைக்கப்பட்டது. ‘நானோ’ என்பது பேசுபவர்மீதான வலியுறுத்தலையும் முந்தைய சூழலுடனான முரண்பாட்டையும் இயல்பாகக் காட்டுகிறது.
