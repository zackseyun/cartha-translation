  yaml_path: translation/ot/psalms/073/013.yaml
  text: Surely in vain I have kept my heart pure[b][a], and washed my hands in innocence.
translation:
  language: ta
  text: நிச்சயமாக, வீணாகவே என் இதயத்தைத் தூய்மையாகக் காத்தேன்; என் கைகளைக் குற்றமின்மையோடு கழுவினேன்[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எந்தப் பயனுமின்றி.”
    reason: lexical_alternative
  - marker: b
    text: கைகளைத் தூய்மையோடு அல்லது குற்றமின்மையோடு கழுவுதல் என்பது வெறும் உடல் கழுவுதலை அல்ல; அறநெறிசார் குற்றமின்மையைச் சித்தரிக்கும் உருவகம்.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: உண்மையாகவே
  rationale: இங்கு இந்தச் சொல் கட்டுப்படுத்தும் ‘மட்டும்’ என்ற பொருளில் அல்லாமல், சங்கீதக்காரரின் வேதனைமிக்க முடிவை வலியுறுத்தும் உரையாடல் துகளாக உள்ளது.
- source_word: רִיק
  choice: வீண்தான்
  rationale: முயற்சிக்குப் பயனோ பலனோ இல்லை என்ற உணர்வை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: זִכִּיתִי
  choice: நான் ... தூய்மைப்படுத்தியதும்
  rationale: வினைச்சொல்லின் தூய்மையாக்குதல் அல்லது தூய்மையாக வைத்திருத்தல் என்ற பொருளை நேரடியாகக் காட்டுகிறது; இதயத்துடன் சேர்ந்து அறநெறிசார் தூய்மையை உணர்த்துகிறது.
- source_word: לְבָבִי
  choice: என் இதயத்தை
  rationale: உள்ளார்ந்த சிந்தனை, விருப்பம், அறநெறி ஆகியவற்றின் மையத்தைச் சுட்டும் மூலமொழி உருவகத்தைப் பாதுகாக்கிறது.
- source_word: וָאֶרְחַץ
  choice: கழுவியதும்
  rationale: இரண்டாவது இணையான செயலைத் தமிழில் இயல்பாகத் தொடர்கிறது.
- source_word: בְּנִקָּיוֹן
  choice: குற்றமற்ற நிலையில்
  rationale: வெறும் உடல் சுத்தத்தைவிட அறநெறிசார் தூய்மை அல்லது குற்றமின்மையை வெளிப்படுத்துகிறது; அதேவேளையில் கழுவுதல் என்ற உருவகத்தையும் தக்கவைக்கிறது.
- source_word: כַּפָּי
  choice: என் கைகளை
  rationale: சொல்லுக்கு நேரடியாக ‘உள்ளங்கைகள்’ என்ற பொருள் இருந்தாலும், இந்த உருவகத்தில் இயல்பான தமிழ்ச் சொல் ‘கைகள்’ ஆகும்.
theological_decisions:
- issue: அறநெறிசார் தூய்மையா அல்லது சடங்குசார் தூய்மையா
  choice: கழுவுதல் என்ற உருவகத்தைப் பாதுகாத்து, ‘குற்றமற்ற நிலையில்’ என்று அறநெறிசார் பொருளை வெளிப்படுத்துதல்
  alternative: இதை முதன்மையாகச் சடங்குசார் தூய்மை மொழியாக மொழிபெயர்த்தல்
  rationale: ‘இதயம்’ மற்றும் ‘கைகள்’ என்ற இணைவும் சங்கீதத்தின் புலம்பல் சூழலும் உள்ளார்ந்த தூய்மை மற்றும் செயல்சார் குற்றமின்மையைச் சுட்டுகின்றன; இருப்பினும் மொழிபெயர்ப்பு சடங்குசார் கழுவுதல் உருவகத்தை நீக்கவில்லை.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும் மரியாதைமிக்க கவிதைநடையிலும் வடிவமைக்கப்பட்டது. ‘இதயம்—கைகள்’ என்ற மூலமொழியின் இணை உருவகம் பாதுகாக்கப்பட்டுள்ளது.
