source:
  edition: WLC
  text: בַּ/עֲמַ֣ל אֱנ֣וֹשׁ אֵינֵ֑/מוֹ וְ/עִם אָ֝דָ֗ם לֹ֣א יְנֻגָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/005.yaml
  text: They are not in the trouble of mortal man[a], and they are not plagued with mankind.
translation:
  language: ta
  text: மரணத்துக்குட்பட்ட மனிதர்களின் துன்பம் அவர்களுக்கு இல்லை[a]; மற்ற மனிதர்களுக்கு நேரும் துன்பங்களால் அவர்கள் பாதிக்கப்படுவதில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரணத்துக்குட்பட்ட மனிதர்களின் கடும் உழைப்பு அவர்களுக்கு இல்லை; மற்ற மனிதர்களுக்கு நேரும் துன்பங்களால் அவர்கள் தாக்கப்படுவதில்லை.”
    reason: עָמָל என்பதற்கு ‘துன்பம்’ என்பதோடு ‘கடும் உழைப்பு’ என்றும், נגע என்பதற்கு ‘பாதிக்கப்படுதல்’ என்பதோடு ‘தாக்கப்படுதல்’ என்றும் பொருள் கொள்ள முடியும் என்பதைக் காட்டும் சொற்பொருள் மாற்று.
lexical_decisions:
- source_word: בַּעֲמַל
  choice: அனுபவிக்கும் துன்பம்
  rationale: עָמָל என்பது துன்பம், வருத்தம், கடும் உழைப்பு ஆகிய பொருள்களைக் கொண்டது. பொல்லாதவர்களுக்கு வாழ்க்கையின் பொதுவான பாரங்கள் இல்லாததுபோல் தோன்றுவதைச் சங்கீதக்காரர் கூறும் சூழலில் ‘துன்பம்’ இயல்பாகவும் பரந்த பொருளுடனும் அமைகிறது; ‘அனுபவிக்கும்’ என்பது எபிரெய முன்னிடைச்சொல் அமைப்பைத் தமிழில் தெளிவாக்குகிறது.
- source_word: אֱנוֹשׁ
  choice: சாவுக்குரிய மனிதர்கள்
  rationale: אֱנוֹשׁ மனிதரின் நிலையாமையையும் இறப்புக்குரிய தன்மையையும் உணர்த்தக்கூடும். ‘சாவுக்குரிய’ என்பது அந்த நுண்ணிய பொருளைப் பாதுகாக்கிறது.
- source_word: אֵינֵמוֹ
  choice: அவர்களுக்கு இல்லை
  rationale: மூன்றாம் நபர் பன்மை பின்னொட்டுடன் வரும் எதிர்மறை இருப்புச் சொல், இத்துன்பம் அவர்களுக்கில்லை என்பதைக் குறிக்கிறது. தமிழில் ‘அவர்களுக்கு இல்லை’ என்பது இயல்பான வடிவம்.
- source_word: וְעִם
  choice: மற்ற மனிதர்களோடு சேர்ந்து
  rationale: עִם உடனிருத்தல் அல்லது இணைப்பைக் குறிக்கிறது. சூழலில் பொதுவாக மனிதர்கள் அனுபவிப்பதோடு இவர்கள் பங்குபெறவில்லை என்ற ஒப்பீட்டை ‘சேர்ந்து’ தெளிவாக வெளிப்படுத்துகிறது; ‘மற்ற’ என்பது தமிழில் அந்த ஒப்பீட்டை இயல்பாக்குகிறது.
- source_word: אָדָם
  choice: மற்ற மனிதர்கள்
  rationale: இங்கு אָדָם தனி ஆணைக் குறிக்காமல் மனிதர்களைப் பொதுவாகக் குறிக்கிறது. முதல் அடியின் אֱנוֹשׁ என்பதிலிருந்து வேறுபாட்டை முற்றிலும் அழிக்காமல், தமிழில் இயல்பாகப் பொதுமனிதர்களைக் குறிக்க இவ்வடிவம் தேர்ந்தெடுக்கப்பட்டது.
- source_word: יְנֻגָּעוּ
  choice: வாதிக்கப்படுவதும் இல்லை
  rationale: נגע என்பதன் இப்பெயர்ச்செயப்படுவினை வடிவம் தாக்கப்படுதல் அல்லது துன்புறுத்தப்படுதலைக் குறிக்கிறது. ‘வாதிக்கப்படுதல்’ என்பது நோய் என்ற ஒரே பொருளுக்குள் சுருக்காமல், கடுமையாகப் பாதிக்கப்படுதல் என்ற கவித்துவப் பொருளைப் பாதுகாக்கிறது.
