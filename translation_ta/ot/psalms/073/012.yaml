translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான ஆனால் எளிதில் புரியும் நடை பயன்படுத்தப்பட்டது. ‘இதோ’ என்ற தொடக்கம் மூலத்தின் சுட்டிக்காட்டும் அழுத்தத்தைத் தக்கவைக்கிறது. இரு மெய்ப்பொருள் ஐயங்களும் உரையில் ஓரளவு இயல்பாக்கப்பட்டு, அடிக்குறிப்புகளில் மாற்று வாசிப்புகளாகப் பாதுகாக்கப்பட்டுள்ளன.
