  text: הִנֵּה אֵ֥לֶּה רְשָׁעִ֑ים וְ/שַׁלְוֵ֥י ע֝וֹלָ֗ם הִשְׂגּוּ חָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/012.yaml
  text: Behold[a], these are the wicked, always at ease[b]; they increase in wealth.
translation:
  language: ta
  text: இதோ, இவர்கள் பொல்லாதவர்கள்; என்றும் நிம்மதியாக இருக்கிறார்கள்[a]; செல்வத்தைப் பெருக்கியிருக்கிறார்கள்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என்றும் பாதுகாப்பாக இருக்கிறார்கள்’ / ‘என்றும் சுகமாக இருக்கிறார்கள்.’ எபிரேயச் சொற்றொடர் நீடித்த நிம்மதி, சுகவாழ்வு அல்லது பாதுகாப்பைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘செல்வத்தைப் பெற்றிருக்கிறார்கள்’ / ‘செல்வம் சேர்த்திருக்கிறார்கள்.’ எபிரேய வினை செல்வத்தை அடைந்ததையோ அது பெருகியதையோ வலியுறுத்தலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: இதோ
  rationale: கவனத்தை ஈர்த்து, அடுத்து சொல்லப்படுவதற்கு அழுத்தம் தரும் எபிரெயச் சொல்லை இயல்பான நவீனத் தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֵלֶּה
  choice: இவர்கள்
  rationale: முந்தைய சூழலில் விவரிக்கப்பட்ட மனிதர்களைக் குறிக்கும் அண்மைச் சுட்டுப்பெயர்; மனிதர்களைக் குறிப்பதால் ‘இவர்கள்’ இயல்பானது.
- source_word: רְשָׁעִים
  choice: பொல்லாதவர்கள்
  rationale: சங்கீதச் சூழலில் உள்ள ஒழுக்க வகைப்பாட்டைத் தெளிவாகவும் பொதுமக்களுக்குப் புரியும் விதத்திலும் தருகிறது.
- source_word: וְשַׁלְוֵי עוֹלָם
  choice: என்றும் நிம்மதியாக இருக்கிறார்கள்
  rationale: ‘நிம்மதியாக/பாதுகாப்பாக இருப்போர்’ என்பதையும் நீடித்த காலத்தைக் குறிக்கும் עוֹלָם என்பதையும் இயல்பான தமிழில் இணைக்கிறது; முடிவில்லாத தத்துவார்த்த நித்தியத்தை அவசியமின்றி வலியுறுத்துவதில்லை.
- source_word: הִשְׂגּוּ
  choice: பெருக்கியிருக்கிறார்கள்
  rationale: இந்த வினை அடைதல், பெற்றுக்கொள்ளுதல் அல்லது பெருக்குதல் எனப் பொருள்படலாம். செல்வச் செழிப்பைப் பற்றிய இச்சூழலில் வளம் திரண்டிருப்பதை ‘பெருக்கியிருக்கிறார்கள்’ இயல்பாக வெளிப்படுத்துகிறது; மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: חָיִל
  choice: செல்வம்
  rationale: இச்சொல்லுக்கு வலிமை, படை, ஆற்றல் போன்ற பொருள்களும் இருந்தாலும், பொல்லாதவர்களின் செழிப்பைப் பற்றிய சூழலில் பொருளாதார வளமே முதன்மையான பொருள்.
