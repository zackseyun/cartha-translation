lexical_decisions:
- source_word: וְאָמְרוּ
  choice: அவர்கள் சொல்கிறார்கள்
  rationale: எபிரெய நிறைவுவினை கவிதைச் சூழலில் தொடர்ந்து நிகழும் அல்லது வழக்கமான பேச்சை நிகழ்காலம் போலக் குறிக்கலாம். சங்கீதத்தில் பொல்லாதவர்களின் தொடர்ந்த மனப்பான்மையை இங்கு நிகழ்காலம் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: אֵיכָה
  choice: எப்படி
  rationale: ‘எப்படி?’ என்ற நேரடியான வினாப்பொருளைத் தக்கவைத்து, மூலத்தில் வெளிப்படையாக இல்லாத ‘எப்படி முடியும்?’ என்ற சாத்தியப்பாட்டு நிழலைச் சேர்க்கவில்லை.
- source_word: יָדַע
  choice: அறிவார்
  rationale: ‘அறிதல்’ என்ற வினைப் பொருளை மரியாதை ஒருமையுடன் இயல்பான தமிழ் வினாவாக வழங்குகிறது.
- source_word: אֵל
  choice: கடவுள்
  rationale: இங்கு இது தனிப்பட்ட பெயராக அல்லாமல் கடவுளைக் குறிக்கும் பொதுப்பெயர் அல்லது பட்டமாக வருகிறது.
- source_word: וְיֵשׁ
  choice: உண்டா
  rationale: இருப்பு குறிக்கும் எபிரெயச் சொல்லை வினாவுக்கேற்ற இயல்பான தமிழில் வழங்குகிறது.
- source_word: דֵּעָה
  choice: அறிவு
  rationale: முந்தைய ‘அறிவார்’ என்பதுடனான சொற்பொருள் தொடர்பையும் கேலியான இணை அமைப்பையும் தக்கவைக்கிறது.
- source_word: בְעֶלְיוֹן
  choice: உன்னதமானவரிடம்
  rationale: בְ என்ற முன்னிடைச்சொல் இங்கு உடைமைப் பொருளுடைய வினாவில் வருகிறது; தமிழில் ‘-இடம்’ என்பது அறிவு அவரிடம் இருக்கிறதா என்ற கருத்தை இயல்பாகத் தெரிவிக்கிறது. சொற்சொல்லான வடிவம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: עֶלְיוֹן என்ற இறைப் பட்டத்தின் மொழிபெயர்ப்பு
  choice: உன்னதமானவர்
  alternative: மிக உயர்ந்தவர்
  rationale: இது கடவுளின் மேலான நிலையைக் குறிக்கும் நிலையான இறைப் பட்டம். ‘உன்னதமானவர்’ என்பது சுருக்கமாகவும் கண்ணியமாகவும் இருந்து, கூடுதல் விளக்கத்தைத் திணிக்காமல் அதன் இறையியல் வலிமையைத் தக்கவைக்கிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பான, கண்ணியமான நடையைப் பயன்படுத்துகிறது. பொல்லாதவர்களின் ஏளனத்தையும் இரண்டு இணையான வினாக்களின் கூர்மையையும் தக்கவைக்க, வாக்கியங்கள் சுருக்கமாக அமைக்கப்பட்டுள்ளன.
