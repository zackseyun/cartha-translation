source:
  edition: WLC
  text: וַ/אֲנִי בַ֭עַר וְ/לֹ֣א אֵדָ֑ע בְּ֝הֵמ֗וֹת הָיִ֥יתִי עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/022.yaml
  text: Then I was senseless and did not know[a]; I was like a beast before you.
translation:
  language: ta
  text: அப்போது நான் அறிவற்றவனாய், அறியாதவனாய் இருந்தேன்; உம்மோடு மிருகத்தைப்போல்[a] இருந்தேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெயத்தில் ‘மிருகங்கள்’ என்று பன்மையில் உள்ளது; இது தீவிரப்படுத்தும் அல்லது தொகுப்புப் பயன்பாடாக இருந்து, ‘மிருகத்தைப்போல்’ அல்லது ‘மிருகத்தன்மையுடன்’ என்று பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: அப்போது நான்
  rationale: இணைப்புச் சொல் முந்தைய உணர்தலுடன் இந்த ஒப்புக்கொள்ளுதலைத் தொடர்புபடுத்துகிறது; சூழலில் அதன் பின்னோக்கிய சிந்தனைத் தொடர்பை ‘அப்போது’ இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בַעַר
  choice: அறிவற்றவனாய்
  rationale: இச்சொல் வெறும் தகவல் அறியாமையை அல்ல, உணர்வும் புரிதலும் மழுங்கிய நிலையைக் குறிக்கிறது. ‘அறிவற்றவன்’ அதன் கடுமையை இழக்காமல் நவீன தமிழில் இயல்பாக உள்ளது.
- source_word: וְלֹא אֵדָע
  choice: அறியாதவனாய் இருந்தேன்
  rationale: ידע என்பதன் அடிப்படைப் பொருளான ‘அறிதல்’ என்பதைக் காத்து, முந்தைய சொல்லுடன் இணையும் இயல்பான தமிழ்ச் சொற்றொடராக வழங்கப்பட்டுள்ளது.
- source_word: בְּהֵמוֹת
  choice: மிருகத்தைப்போல்
  rationale: எபிரெயத்தில் வடிவம் பன்மையாக இருந்தாலும், இங்கு அது தீவிரப்படுத்தும் அல்லது தொகுப்புப் பயன்பாடாக இருந்து மிருகத்தன்மையான அறிவின்மையை ஒப்புமையாகக் குறிக்கலாம். ஒருமை ஒப்புமை தமிழில் இயல்பாகப் பொருளைத் தருகிறது.
- source_word: הָיִיתִי
  choice: இருந்தேன்
  rationale: இது மாறி ஆன செயலைவிட, சங்கீதக்காரனின் அப்போதைய நிலையைச் சுட்டுகிறது.
- source_word: עִמָּךְ
  choice: உம்மோடு
  rationale: עם என்பதன் நேரடிப் பொருள் ‘உடன்’. ‘உம்மோடு’ என்பது தேவனுடைய முன்னிலையில் என்ற சாத்தியமான சூழற்பொருளைத் தடைசெய்யாமல், மூலத்தின் உறவுசார் பதற்றத்தையும் நேரடியான வடிவத்தையும் காக்கிறது.
theological_decisions:
- issue: தேவனிடம் சங்கீதக்காரன் கூறும் மிருக ஒப்புமையின் வலிமை
  choice: அறிவற்ற நிலையை ஒப்புக்கொள்ளும் உவமையாக ‘உம்மோடு மிருகத்தைப்போல் இருந்தேன்’
  alternative: ‘உமது முன்னிலையில் பகுத்தறிவில்லாத மிருகத்தைப்போல் இருந்தேன்’ என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இது மனித இயல்பைப் பற்றிய கோட்பாட்டு வரையறை அல்ல; சங்கீதக்காரனின் புரிதலின்மையைத் தாழ்மையுடன் ஒப்புக்கொள்ளும் கூற்று. தேர்ந்த சொற்கள் உருவகத்தின் கூர்மையைக் காத்து, மூலத்தில் இல்லாத கோட்பாட்டு விளக்கத்தைச் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான, மரியாதைமிக்க தமிழ்நடை பயன்படுத்தப்பட்டுள்ளது. தேவனைச் சுட்டும் இரண்டாம் நபர் ஒருமைக்கு ‘உம்மோடு’ என மரியாதை வடிவம் தரப்பட்டுள்ளது. கவிதைநடையின் இணை அமைப்பையும் மூலத்தின் சுருக்கத்தையும் காக்கப்பட்டுள்ளது.
