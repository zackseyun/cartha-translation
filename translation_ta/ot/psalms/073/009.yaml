base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/009.yaml
  text: They set their mouth against the heavens[b][a], and their tongue struts through the earth.
translation:
  language: ta
  text: அவர்கள் வானத்திற்கு எதிராகத் தங்கள் வாயைத் திறக்கிறார்கள்[a]; அவர்களுடைய நாவு பூமியெங்கும் ஆணவமாக உலவுகிறது[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர்கள் தங்கள் வாயை வானத்தில் வைக்கிறார்கள்.” எபிரேய முன்னொட்டின் நேர்ப்பொருள் “இல்”; ஆனால் இங்கு வானத்தை எதிர்த்து ஆணவமாகப் பேசுவது பொருளாகத் தெரிகிறது.
    reason: lexical_alternative
  - marker: b
    text: நேரடியாக, “அவர்களுடைய நாவு பூமியில் நடக்கிறது.” இங்கு அது எங்கும் பரவும் அவர்களுடைய ஆணவப் பேச்சைச் சித்தரிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתּוּ
  choice: வாய்திறக்கிறார்கள்
  rationale: வாயை ‘வைப்பது’ என்ற எபிரெய உருவகம் தமிழில் இயல்பாகப் புரியாது. சூழலில் இது எதிர்த்துப் பேச வாய்திறப்பதைக் குறிக்கிறது; எனவே செயற்பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בַשָּׁמַיִם
  choice: வானத்தை எதிர்த்து
  rationale: בְּ என்பதன் நேர்ப்பொருள் ‘இல்’ என்றாலும், இங்கு ஆணவமான பேச்சு வானத்தை நோக்கி அல்லது வானத்திற்கு எதிராக எழுப்பப்படுவதைச் சூழல் காட்டுகிறது. எபிரெய பன்மை வடிவம் தமிழில் இயல்பான ஒருமையான ‘வானம்’ என வழங்கப்படுகிறது.
- source_word: פִּיהֶם
  choice: வாய்திறக்கிறார்கள்
  rationale: ‘அவர்களுடைய வாய்’ என்ற பிரதிநிதித்துவ ஒருமையின் கருத்து தமிழ் வினைத்தொடரான ‘வாய்திறக்கிறார்கள்’ என்பதில் இயல்பாகப் பாதுகாக்கப்படுகிறது.
- source_word: וּלְשׁוֹנָם
  choice: அவர்களுடைய நாவு
  rationale: எபிரெயக் கவிதையின் பிரதிநிதித்துவ ஒருமையையும், ‘வாய்—நாவு’ என்ற இணை அமைப்பையும் தக்கவைக்கிறது.
- source_word: תִּהֲלַךְ
  choice: ஆணவமாக உலவுகிறது
  rationale: வினையின் அடிப்படைப் பொருள் ‘நடக்கிறது/செல்கிறது.’ தீயோரின் கட்டுப்பாடற்ற செருக்கான பேச்சைச் சூழல் சித்தரிப்பதால், ‘உலவுகிறது’ இயக்கத்தையும் ‘ஆணவமாக’ அதன் தொனியையும் இயல்பான தமிழில் தெரிவிக்கின்றன.
- source_word: בָּאָרֶץ
  choice: பூமியெங்கும்
  rationale: இயக்கத்தைக் குறிக்கும் வினையோடு பரவலான எல்லையை இயல்பாகக் காட்டுகிறது. வானம்—பூமி என்ற கவிதை எதிரிணையையும் ‘பூமி’ பாதுகாக்கிறது.
