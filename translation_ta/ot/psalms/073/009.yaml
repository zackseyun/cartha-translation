translation_notes:
  register: நவீன செந்தமிழுக்கும் பொதுவழக்குக்கும் இடைப்பட்ட, வாசிக்க எளிதான கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. ‘வாய்திறக்கிறார்கள்’ மற்றும் ‘ஆணவமாக உலவுகிறது’ ஆகியவை மூல உருவகத்தின் நோக்கத்தையும் கவிதைத் தொனியையும் இயல்பான தமிழில் தருகின்றன; நேர்ப்பொருள் மாற்றுகள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
