id: PSA.73.3
reference: Psalms 73:3
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: כִּֽי קִ֭נֵּאתִי בַּֽ/הוֹלְלִ֑ים שְׁל֖וֹם רְשָׁעִ֣ים אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/003.yaml
  text: For I was envious of the arrogant when I saw the peace of the wicked[a].
translation:
  language: ta
  text: ஏனெனில், தீயவர்களின் நல்வாழ்வை[a] நான் கண்டபோது, இறுமாப்புள்ளவர்கள்மேல் பொறாமை கொண்டேன்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'வேறு: ‘அமைதி.’ இங்குள்ள எபிரெயச் சொல் (שָׁלוֹם) அமைதி, நலம், செழிப்பு ஆகிய பொருள்களைக் குறிக்கலாம்; இச்சூழலில் தீயவர்களின் வெளிப்படையான நலமும் சிரமமற்ற வாழ்வும் வலியுறுத்தப்படுகின்றன.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் எபிரெய இணைப்புச் சொல்லின் விளக்கவியல் ஓட்டத்தை இயல்பாகப் பாதுகாக்கிறது.
- source_word: קִנֵּאתִי
  choice: பொறாமை கொண்டேன்
  rationale: இங்கு קנא என்பது பிறருக்குள்ள நன்மையைக் கண்டு ஏங்கும் பொறாமையைக் குறிக்கிறது; தமிழில் உள்ளார்ந்த மனநிலையை இயல்பாகத் தெரிவிக்கிறது.
- source_word: בַּהוֹלְלִים
  choice: இறுமாப்புள்ளவர்கள்மேல்
  rationale: הוֹלְלִים என்பதன் சூழல்சார் பொருள் வெறும் அறிவின்மையல்ல; பெருமைபாராட்டும் அகந்தையான மனப்பாங்கு. ‘இறுமாப்புள்ளவர்கள்’ அதைத் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: שְׁלוֹם
  choice: நல்வாழ்வு
  rationale: שָׁלוֹם என்பது அமைதி, முழுமை, நலம் ஆகிய பரந்த பொருள்களைக் கொண்டது. இச்சூழலில் தீயவர்களின் வெளிப்படையான செழிப்பும் சிரமமற்ற வாழ்வும் முன்னிலையாக இருப்பதால் ‘நல்வாழ்வு’ இயல்பான பொருத்தம்; ‘அமைதி’ அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: רְשָׁעִים
  choice: தீயவர்கள்
  rationale: சங்கீதம் மற்றும் ஞான இலக்கியச் சூழல்களில் உள்ள ஒழுக்க வகைப்பாட்டைத் தெளிவாகவும் நவீன தமிழில் இயல்பாகவும் தருகிறது.
- source_word: אֶרְאֶה
  choice: நான் கண்டபோது
  rationale: வடிவில் முற்றுப்பெறா வினையாக இருந்தாலும், முந்தைய வினையுடன் சேர்ந்து பொறாமை எழுந்த சந்தர்ப்பத்தைச் சுட்டுகிறது; காலத் தொடர்பை இயல்பாக வெளிப்படுத்துகிறது.
