translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைத் தன்மையும் கண்ணியமும் காக்கப்பட்டுள்ளன. ‘இறுமாப்புள்ளவர்கள்’ என்பது அகந்தையும் தற்பெருமையும் கொண்டவர்களைச் சுட்டுகிறது; ‘நல்வாழ்வு’ என்பதன் பரந்த எபிரெயப் பொருள் அடிக்குறிப்பில் விளக்கப்பட்டுள்ளது.
