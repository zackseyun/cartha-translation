  yaml_path: translation/ot/psalms/073/024.yaml
  text: With your counsel you guide me[a], and afterward you will receive me to glory.
translation:
  language: ta
  text: உமது ஆலோசனையால் என்னை வழிநடத்துகிறீர்; பின்பு மகிமைக்குள் என்னை ஏற்றுக்கொள்வீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “பின்பு மரியாதையுடன் என்னை ஏற்றுக்கொள்வீர்.”
    reason: כָּבוֹד என்பதற்கு ‘மகிமை’ மட்டுமல்ல, ‘மரியாதை/கனம்’ என்றும் பொருள் வரலாம்; எபிரெயச் சொற்றொடரின் இலக்கணச் சுருக்கம் இந்த மாற்று வாசிப்புக்கு இடமளிக்கிறது.
lexical_decisions:
- source_word: בַּעֲצָתְךָ
  choice: உமது ஆலோசனையால்
  rationale: עֵצָה என்பது ஆலோசனை, அறிவுரை அல்லது திட்டம் என்பதைக் குறிக்கும். முன்னொட்டு ב இங்கு வழிநடத்துதலின் கருவியைச் சுட்டுவதால், ‘ஆலோசனையால்’ என்பது பொருளையும் இயல்பான தமிழையும் காக்கிறது.
- source_word: תַנְחֵנִי
  choice: என்னை வழிநடத்துகிறீர்
  rationale: נחה என்பதன் ஹிஃபில் வடிவம் ‘வழிநடத்து’ அல்லது ‘நடத்திச் செல்’ என்று பொருள்படும். இறைவனுடைய ஆலோசனையின் வழியாகக் கிடைக்கும் தொடர்ச்சியான வழிகாட்டுதலை ‘வழிநடத்துகிறீர்’ தெளிவாக வெளிப்படுத்துகிறது.
- source_word: וְאַחַר
  choice: பின்பு
  rationale: אַחַר இங்கு கால வரிசையைக் குறிக்கும் வினையடைபோல் செயல்படுகிறது. நிகழ்கால வழிநடத்துதலுக்குப் பிறகு நடப்பதை ‘பின்பு’ சுருக்கமாகவும் இயல்பாகவும் தெரிவிக்கிறது.
- source_word: כָּבוֹד
  choice: மகிமை
  rationale: כָּבוֹד என்பதற்கு ‘மகிமை’ அல்லது ‘கனம்/மரியாதை’ என்று பொருள் வரலாம். இந்தச் சூழலில் ‘மகிமை’ உயர்ந்த பொருளையும் இறைவனுடைய அருகாமையை நோக்கிய சங்கீதத்தின் நகர்வையும் காக்கிறது; ‘மரியாதை’ என்ற சாத்தியம் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תִּקָּחֵנִי
  choice: என்னை ஏற்றுக்கொள்வீர்
  rationale: לקח என்பது ‘எடுத்துக்கொள்’ அல்லது ‘ஏற்றுக்கொள்’ எனப் பொருள்படும். இச்சூழலில் ‘ஏற்றுக்கொள்வீர்’ என்பது ஒருவரைத் தம்மிடம் சேர்த்துக்கொள்ளும் நுண்பொருளை இயல்பான தமிழில் தருகிறது; வினையின் இறுதியான செயல்பாட்டை அளவுக்கு மீறி விளக்கவில்லை.
theological_decisions:
- issue: אַחַר כָּבוֹד תִּקָּחֵנִי என்ற சுருக்கமான சொற்றொடரின் பொருள்
  choice: ‘பின்பு மகிமைக்குள் என்னை ஏற்றுக்கொள்வீர்’ என்று, முடிவுக்கால நிறைவைச் சுட்டக்கூடியதாயினும் அதை முழுமையாக வரையறுக்காத மொழிபெயர்ப்பு
  alternative: ‘பின்பு மரியாதையுடன் என்னை ஏற்றுக்கொள்வீர்’
  rationale: எபிரெயச் சொற்றொடர் மகிமைக்குள் ஏற்றுக்கொள்ளப்படுதல், மரியாதையுடன் ஏற்றுக்கொள்ளப்படுதல், அல்லது பின்னர் மகிமையான நிலைக்கு எடுத்துக்கொள்ளப்படுதல் ஆகிய நுண்பொருட்களுக்கு இடமளிக்கிறது. முதன்மை உரை ‘மகிமை’ என்ற உயர்ந்த பொருளைக் காக்கிறது; ‘மரியாதையுடன்’ என்ற உண்மையான மாற்று வாய்ப்பு அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில் எளிதாகப் புரியும், அதேவேளை சங்கீதத்திற்குரிய கண்ணியமான நடை பயன்படுத்தப்பட்டுள்ளது. இறைவனை நோக்கிய மரியாதைப் பன்மை வினைமுற்றுகளும் ‘உமது’ என்ற மரியாதை வடிவமும் கடைப்பிடிக்கப்பட்டுள்ளன.
