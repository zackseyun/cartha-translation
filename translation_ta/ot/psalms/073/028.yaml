  text: But as for me[a], the nearness of God is good for me; I have made the Lord GOD my refuge, so that I may tell of all your works.
translation:
  language: ta
  text: ஆனால், எனக்கோ கடவுளின் அருகாமையே நன்மை; ஆண்டவராகிய யாவேயை என் அடைக்கலமாக வைத்திருக்கிறேன், உமது செயல்கள் அனைத்தையும் எடுத்துரைப்பதற்காக.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் எனக்கோ
  rationale: முந்தைய வசனங்களில் கூறப்பட்ட தீயோரின் நிலைக்கு மாறாகச் சங்கீதக்காரரின் நிலையை வலியுறுத்தும் இணைப்புச்சொல் மற்றும் தனிப்பெயரின் எதிர்மறை ஒப்பீட்டு வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: קִרֲבַת אֱלֹהִים
  choice: கடவுளின் அருகாமை
  rationale: எபிரெய பெயர்ச்சொல் வடிவத்தைத் தக்கவைத்து, கடவுள் அருகில் இருப்பது அல்லது ஒருவர் கடவுளிடம் அருகில் இருப்பது என்ற உறவுசார் இரு நுண்ணுணர்வுகளையும் முடிந்தவரை திறந்துவைக்கிறது.
- source_word: לִי טוֹב
  choice: எனக்கு நன்மை
  rationale: இந்தப் பயன் குறிக்கும் கூறைச் சுருக்கமான, இயல்பான தமிழில் தருகிறது; 'எனக்கோ' என்பதுடன் சேரும்போது தனிப்பட்ட நன்மை தெளிவாகிறது.
- source_word: שַׁתִּי
  choice: வைத்திருக்கிறேன்
  rationale: அடைக்கலத்தைத் தெரிந்தெடுத்து அதில் நம்பிக்கை வைப்பதைக் குறிக்கும் நிறைவு பெற்ற தனிப்பட்ட செயலை வெளிப்படுத்துகிறது.
- source_word: בַּאדֹנָי יְהוִה
  choice: ஆண்டவராகிய யாவே
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற தனிப்பெயரையும் வேறுபடுத்தி வெளிப்படுத்துகிறது; தமிழில் இரட்டிப்பு ஏற்படாமல் இயல்பாக உள்ளது.
- source_word: מַחְסִי
  choice: என் அடைக்கலம்
  rationale: மַחְסֶה என்பதன் பாதுகாப்பு மற்றும் புகலிடம் சார்ந்த பொருளைச் சங்கீத நடைக்கு ஏற்ற நிலையான தமிழ்ச்சொல்லால் தருகிறது.
- source_word: לְסַפֵּר
  choice: எடுத்துரைப்பதற்காக
  rationale: לְ இணைந்த வினையெச்சத்தின் நோக்கத்தையும், கடவுளின் செயல்களை விவரித்துச் சொல்லும் סָפַר என்பதன் பொருளையும் வெளிப்படுத்துகிறது.
- source_word: כָּל מַלְאֲכוֹתֶיךָ
  choice: உமது செயல்கள் அனைத்தையும்
  rationale: כָּל என்பதன் முழுமையையும், מְלָאכָה என்பதன் பரந்த 'செயல்கள்/வேலைகள்' பொருளையும் இயல்பான தமிழில் பாதுகாக்கிறது.
theological_decisions:
- issue: கִרֲבַת אֱלֹהִים என்பதன் தொடர்பு மற்றும் திசை
  choice: கடவுளின் அருகாமையே நன்மை
  alternative: கடவுளிடம் நெருங்கிச் செல்வதே எனக்கு நன்மை
  rationale: மூலத்தில் வினைச்சொல் அல்ல, பெயர்ச்சொல் உள்ளது. முதன்மை மொழிபெயர்ப்பு கடவுளின் அருகாமை மற்றும் கடவுளிடம் மனிதரின் அருகாமை ஆகியவற்றுக்கிடையிலான உண்மையான பொருள் நுணுக்கத்தை முழுமையாகத் தீர்மானிக்காமல் பாதுகாக்கிறது; இயக்கம்சார் வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: אֲדֹנָי יְהוִה என்ற இணைப்பில் தெய்வீகப் பெயர்
  choice: ஆண்டவராகிய யாவே
  alternative: ஆண்டவராகிய கர்த்தர்
  rationale: אֲדֹנָי என்ற பட்டத்தையும் יהוה என்ற உடன்படிக்கைப் பெயரையும் தனித்தனியாகத் தெரியச்செய்கிறது; பெயரை பொதுப் பட்டமாக மாற்றாமல் மூலத்தின் வடிவத்தைப் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. சங்கீதத்தின் கவித்துவத் தன்மைக்காக ‘அருகாமை’, ‘அடைக்கலம்’, ‘எடுத்துரைப்பது’ போன்ற எளிதில் புரியும் உயர்நடைச் சொற்கள் தேர்ந்தெடுக்கப்பட்டுள்ளன. ‘உமது’ என்பது கடவுளை நேரடியாக விளிக்கும் ஒருமை மரியாதை வடிவம்.
