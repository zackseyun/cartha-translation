source:
  edition: WLC
  text: לָ/כֵ֤ן ישיב עַמּ֣/וֹ הֲלֹ֑ם וּ/מֵ֥י מָ֝לֵ֗א יִמָּ֥צוּ לָֽ/מוֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/010.yaml
  text: Therefore his people turn back here[c][b][a], and waters of fullness are drained by them.
translation:
  language: ta
  text: ஆகையால், அவனுடைய மக்கள் இங்கே திரும்பி வருகிறார்கள்[a]; நிறைவான நீர் அவர்களால் பிழிந்தெடுக்கப்படுகிறது[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆகையால், அவன் தன் மக்களை இங்கே திருப்பிக் கொண்டுவருகிறான்.” வினைச்சொல்லை மக்கள் தாமே ‘திரும்பி வருகிறார்கள்’ என்றோ, அவன் அவர்களைத் ‘திருப்பிக் கொண்டுவருகிறான்’ என்றோ புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில், “நிறைவின் நீர்/நீர்கள்”; இச்சொற்றொடர் மிகுதியான நீரையோ முழு அளவு நீரையோ குறிக்கலாம்; படிமம் தெளிவற்றது.
    reason: lexical_alternative
  - marker: c
    text: அல்லது, “முழு அளவு நீர் அவர்களுக்காகப் பிழிந்தெடுக்கப்படுகிறது.” வினைச்சொல்லும் இறுதிப் பெயர்ச்சுட்டும் கடினமானவை; மிகுதியான ஒரு பங்கு அவர்களுக்கு வழங்கப்படுவதாகவும் இவ்வடியைப் புரிந்துகொள்ளலாம்.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: ஆகையால்
  rationale: முந்தைய வருணனையின் விளைவைக் குறிக்கும் காரண–விளைவு இணைப்பைத் தெளிவாகப் பேணுகிறது.
- source_word: ישיב
  choice: திரும்புகிறார்கள்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் ‘திருப்பிக் கொண்டுவருகிறார்கள்’ என்ற செயப்படுபொருள் குன்றா பொருளையோ, இச்சூழலில் ‘திரும்புகிறார்கள்’ என்ற பொருளையோ தரக்கூடும். சொல்லப்படாத செயப்படுபொருளைச் சேர்க்காமல் வாசிக்கத்தக்க வகையில் இரண்டாவது பொருள் முதன்மை உரையில் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עַמּוֹ
  choice: அவனுடைய மக்கள்
  rationale: மூன்றாம் நபர் ஆண்பால் ஒருமை பின்னொட்டை நேரடியாகப் பிரதிபலிக்கிறது; ‘அவன்’ யாரைக் குறிக்கிறது என்பதை உரை தீர்மானிக்காததால் மொழிபெயர்ப்பும் தீர்மானிக்கவில்லை.
- source_word: הֲלֹם
  choice: இங்கே
  rationale: ‘இங்கே/இவ்விடத்துக்கு’ என்ற இடப்பொருளை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: וּמֵי מָלֵא
  choice: நிறைவின் நீர்கள்
  rationale: எபிரெயச் சொற்றொடரின் ‘நிறைவு/முழுமையின் நீர்கள்’ என்ற கடினமான கவிதைப் படிமத்தை விளக்கமாக மாற்றாமல் பேணுகிறது.
- source_word: יִמָּצוּ
  choice: உறிஞ்சி எடுக்கப்படுகின்றன
  rationale: מצה என்பதன் நிஃபால் வடிவிலுள்ள ‘பிழிந்தெடுக்கப்படுதல், உறிஞ்சி எடுக்கப்படுதல், வடித்தெடுக்கப்படுதல்’ என்ற செயப்பாட்டு உணர்வைப் பேணுகிறது.
- source_word: לָמוֹ
  choice: அவர்களால்
  rationale: செயப்பாட்டு வினையுடன் கருவி/செய்வோர் பொருளாக வாசித்து ‘அவர்களால்’ எனத் தரப்பட்டுள்ளது; ‘அவர்களுக்காக’ என்பதும் சாத்தியமாதலால் அடிக்குறிப்பில் வைக்கப்பட்டுள்ளது.
theological_decisions:
- issue: ‘அவனுடைய மக்கள்’ என்பதில் ‘அவன்’ யாரைக் குறிக்கிறது?
  choice: முதன்மை உரையில் குறிப்பு தெளிவுபடுத்தப்படாமல் விடப்பட்டது.
  alternative: இது பொல்லாதவனுடைய மக்களையோ கடவுளுடைய மக்களையோ குறிக்கலாம்.
  rationale: எபிரெயப் பின்னொட்டு அதன் முன்னிலையை வெளிப்படையாக அடையாளப்படுத்தவில்லை; ஆகவே உரை நிர்ணயிக்காத இறையியல் அல்லது விளக்கவியல் முடிவை மொழிபெயர்ப்பு திணிக்கவில்லை.
- issue: நிறைவின் நீர் யாருக்காக அல்லது யாரால் எடுக்கப்படுகிறது?
  choice: முதன்மை உரையில் ‘அவர்களால்’ எனக் கொடுக்கப்பட்டது.
  alternative: ‘அவர்களுக்காக’ அல்லது ‘அவர்களுக்கு முழு அளவாக’ என்றும் புரிந்துகொள்ளலாம்.
  rationale: לָמוֹ என்ற வடிவமும் முழு இரண்டாம் அடியும் கடினமானவை. ஒரு சாத்திய வாசிப்பு முதன்மை உரையில் தரப்பட்டாலும், அருளப்பட்ட மிகுதியான பங்கு என்ற வேறு இறையியல் நுண்சாயலை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் கடினமான ‘நிறைவின் நீர்கள்’ என்ற படிமம் எளிமைப்படுத்தப்படாமல் வைக்கப்பட்டுள்ளது; வினை மற்றும் பெயர்ச்சுட்டின் மாற்று வாசிப்புகள் அடிக்குறிப்புகளில் வெளிப்படையாகக் கொடுக்கப்பட்டுள்ளன.
