source:
  edition: WLC
  text: כִּֽי הִנֵּ֣ה רְחֵקֶ֣י/ךָ יֹאבֵ֑דוּ הִ֝צְמַ֗תָּה כָּל זוֹנֶ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/027.yaml
  text: For behold[a], those far from you will perish; you destroy all who are unfaithful to you.
translation:
  language: ta
  text: ஏனெனில், இதோ, உம்மைவிட்டு வெகுதொலைவில் இருப்பவர்கள் அழிந்துபோவார்கள்; உமக்கு உண்மையற்றுப் போகிற அனைவரையும்[a] நீர் அழிக்கிறீர்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: இன்னும் சொற்படையாக, “உம்மைவிட்டு விலகி வேசித்தனம் செய்கிற அனைவரையும்.” இது கடவுளுக்கு உண்மையற்றுப் போவதைக் குறிக்கும் எபிரெய உருவகம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லாக இங்கு வருகிறது.
- source_word: הִנֵּה
  choice: இதோ
  rationale: வரவிருக்கும் கூற்றின்மீது கவனத்தை ஈர்க்கும் எபிரெய வலியுறுத்தலை இயல்பான, மாண்புள்ள தமிழில் தக்கவைக்கிறது.
- source_word: רְחֵקֶיךָ
  choice: உம்மைவிட்டு வெகுதொலைவில் இருப்பவர்கள்
  rationale: இது வெறும் இடவியல் தூரத்தைவிடக் கடவுளிடமிருந்து ஏற்பட்ட உறவுசார் விலகலைக் குறிக்கிறது; அதேவேளை மூலத்தின் ‘தொலைவு’ உருவகத்தைத் தக்கவைக்கிறது.
- source_word: יֹאבֵדוּ
  choice: அழிந்துபோவார்கள்
  rationale: אבד என்பதன் அழிவு அல்லது நாசமடைதல் என்ற பொருளையும் எதிர்கால வடிவத்தையும் நேரடியாக வெளிப்படுத்துகிறது.
- source_word: הִצְמַתָּה
  choice: நீர் அழிக்கிறீர்
  rationale: צמת என்பதன் ஹிஃபீல் வடிவம் ஒருவரை முற்றிலும் அழிப்பதையோ முடிவுக்குக் கொண்டுவருவதையோ குறிக்கிறது. எபிரெய நிறைவுற்ற வடிவம் உறுதியான அல்லது பொதுவான உண்மையாக அமையக்கூடும்; கவிதை இணைநிலைக்கு நிகழ்காலத் தமிழ் பொருந்துகிறது.
- source_word: כָּל
  choice: அனைவரையும்
  rationale: மூலத்தில் உள்ள முழுமையான வரம்பைத் தக்கவைக்கிறது.
- source_word: זוֹנֶה מִמֶּךָּ
  choice: உமக்கு உண்மையற்றுப் போகிற
  rationale: זנה என்பதன் சொற்படையான பாலியல் உருவகம் இங்கு கடவுளைவிட்டு விலகும் ஆன்மீக அல்லது உடன்படிக்கைத் துரோகத்தைக் குறிக்கிறது. தெளிவான நவீன தமிழில் அதன் சூழல்சார் பொருளை முதன்மை உரை வழங்குகிறது; சொற்படையான உருவகம் அடிக்குறிப்பில் தரப்படுகிறது.
theological_decisions:
- issue: கடவுளைச் சார்ந்த זוֹנֶה என்ற சொல்லின் உருவகப் பொருள்
  choice: ஆன்மீக அல்லது உடன்படிக்கை உண்மையின்மையாக மொழிபெயர்த்தல்
  alternative: ‘உம்மைவிட்டு விலகி வேசித்தனம் செய்கிற அனைவரையும்’ என்று உருவகத்தைச் சொற்படையாக மொழிபெயர்த்தல்
  rationale: சங்கீதங்களிலும் எபிரெய வேதாகமத்தின் பிற பகுதிகளிலும் זנה கடவுளைவிட்டு விலகுவதையும் உடன்படிக்கைத் துரோகத்தையும் உருவகமாகக் குறிக்கலாம். இச்சூழல் கடவுளுக்கு அருகிலும் தொலைவிலும் இருப்பதைப் பற்றியது. ஆகவே உருவகத்தின் நோக்கத்தை முதன்மை உரை தெளிவாக்குகிறது; அதன் வலிமையான மூல உருவகத்தை அடிக்குறிப்பு மறைக்காமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் மாண்பும் கவிதைத் தன்மையும் பேணப்பட்டுள்ளன. கடவுளைக் குறிக்க மரியாதைப் பன்மையான ‘உம்மை/நீர்’ பயன்படுத்தப்பட்டுள்ளது. ‘இதோ’ என்ற சொல் மூலத்தின் கவன ஈர்ப்பு வலிமையைத் தக்கவைக்கிறது; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன.
