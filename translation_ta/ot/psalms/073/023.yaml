  yaml_path: translation/ot/psalms/073/023.yaml
  text: Yet I am continually with you[a]; you have held my right hand.
translation:
  language: ta
  text: ஆனாலும் நான் எப்போதும் உம்மோடு இருக்கிறேன்; என் வலது கையை நீர் பற்றிக்கொண்டீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் வலது கையை நீர் பற்றினீர்.” எபிரெய வினை பற்றும் செயலையும், அதன் விளைவாகத் தொடரும் ஆதரவையும் வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனாலும் நான்
  rationale: முந்தைய வசனங்களில் வரும் சங்கீதக்காரரின் குழப்பத்திற்கும் இங்கு கூறப்படும் இறைநெருக்கத்திற்கும் இடையிலான மாறுபாட்டை இணைப்புச்சொல்லுடன் கூடிய சுட்டுப்பெயர் உணர்த்துகிறது.
- source_word: תָמִיד
  choice: எப்போதும்
  rationale: தொடர்ந்து நிலவும் உறவை இயல்பான நவீன தமிழில் வெளிப்படுத்துகிறது.
- source_word: עִמָּךְ
  choice: உம்மோடு
  rationale: உடனிருத்தல் அல்லது நெருக்கம் என்ற எளிய பொருளை நேரடியாகத் தருகிறது; கடவுளை நோக்கிய கண்ணியமான ஒருமை வடிவம் பயன்படுத்தப்படுகிறது.
- source_word: אָחַזְתָּ
  choice: பற்றிக்கொண்டீர்
  rationale: אחז வினை பற்றுதல், பிடித்துக்கொள்ளுதல் ஆகியவற்றைக் குறிக்கிறது. இத்தேர்வு பற்றும் செயலையும் அதன் தொடரும் ஆதரவையும் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּיַד יְמִינִי
  choice: என் வலது கையை
  rationale: வினையுடன் சேர்ந்த בְ இங்கு பற்றப்படும் உறுப்பைக் குறிக்கிறது; தமிழில் செயப்படுபொருள் வேற்றுமையுடன் கூறுவது இயல்பானது. יְמִינִי என்பதன் குறிப்பான 'என் வலது கை' படிமம் பாதுகாக்கப்படுகிறது.
theological_decisions:
- issue: நிறைவேற்ற வினையின் காலமும் இறை ஆதரவின் நுணுக்கமும்
  choice: பற்றிக்கொண்டீர்
  alternative: பற்றினீர் / பற்றியிருக்கிறீர்
  rationale: எபிரெய நிறைவேற்ற வடிவம் நிகழ்ந்த செயலைக் குறித்தாலும் அதன் விளைவு தொடர்வதையும் சூழலில் உணர்த்தலாம். 'பற்றிக்கொண்டீர்' என்பது ஒருமுறை பற்றிய செயலையும் தொடர்ந்து விடாமல் தாங்கும் நுணுக்கத்தையும், அதை முழுக்க கடந்தகாலமாகவோ நிகழ்காலமாகவோ கட்டுப்படுத்தாமல், பாதுகாக்கிறது.
translation_notes:
  register: இயல்பான, கண்ணியமான நவீனத் தமிழ். சங்கீதத்தில் கடவுளை நேரடியாக நோக்கிப் பேசுவதால் ‘உம்மோடு’, ‘நீர்’ என்ற மரியாதை ஒருமை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. எபிரெயக் கவிதையின் சுருக்கமும் வலது கை என்ற தெளிவான படிமமும் பாதுகாக்கப்பட்டுள்ளன.
