  yaml_path: translation/ot/psalms/073/001.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to those pure in heart.
translation:
  language: ta
  text: ஆசாப்பின் சங்கீதம். உண்மையாகவே, கடவுள் இஸ்ரவேலுக்கு நல்லவர், தூய உள்ளமுள்ளவர்களுக்கு.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר
  choice: சங்கீதம்
  rationale: சங்கீதத் தலைப்புகளில் வரும் நிலையான இலக்கியச் சொல்; பாடல் என்ற பொருளையும் வழிபாட்டுப் பாடல் என்ற சூழலையும் இயல்பாகக் காட்டுகிறது.
- source_word: לְאָסָף
  choice: ஆசாப்பின்
  rationale: இங்குள்ள לְ உரிமை, ஆசிரியத் தொடர்பு, அர்ப்பணிப்பு ஆகியவற்றில் ஒன்றைக் குறிக்கலாம். தமிழ் தலைப்பு மரபில் ‘ஆசாப்பின்’ இயல்பாக இருப்பதோடு, தொடர்பின் துல்லிய வகையைத் தீர்மானிக்காமல் விடுகிறது.
- source_word: אַךְ
  choice: உண்மையாகவே
  rationale: சங்கீதத்தின் தொடக்கக் கூற்றை உறுதிப்படுத்தும் வலியுறுத்தலாக எடுத்துக்கொள்ளப்பட்டுள்ளது; ‘நிச்சயமாக’ என்பதும் சாத்தியம்.
- source_word: טוֹב
  choice: நல்லவர்
  rationale: கடவுளின் நற்குணத்தையும் நன்மை செய்கிற தன்மையையும் குறுகச் செய்யாமல் காக்கிறது.
- source_word: לְיִשְׂרָאֵל
  choice: இஸ்ரவேலுக்கு
  rationale: לְ குறிக்கும் தொடர்பு அல்லது நன்மை பெறும் பொருளை நேரடியாகக் காட்டுகிறது.
- source_word: אֱלֹהִים
  choice: கடவுள்
  rationale: இங்கு ஒருமைப் பொருளில் இஸ்ரவேலின் கடவுளைக் குறிக்கிறது; நவீன பொதுத் தமிழில் இயல்பான இணைச்சொல்.
- source_word: לְבָרֵי לֵבָב
  choice: தூய உள்ளமுள்ளவர்களுக்கு
  rationale: בָרֵי என்பதன் தூய்மை/மாசின்மை உணர்வையும், לֵבָב என்பதன் உள் மனிதன்—சிந்தை, நோக்கம், மனநிலை—என்ற பரப்பையும் இயல்பான தமிழில் தருகிறது.
theological_decisions:
- issue: ‘இஸ்ரவேல்’ என்பதற்கும் ‘தூய உள்ளமுள்ளவர்கள்’ என்பதற்கும் உள்ள உறவு
  choice: இரண்டாவது சொற்றொடர் முதல்வதை மறுபடியும் குறிப்பிட்டு விளக்கும் வகையில், இடைக்கோட்டால் இணைக்கப்பட்டுள்ளது.
  alternative: இஸ்ரவேலும் தூய உள்ளமுள்ளவர்களும் இரண்டு தனித்தனி, இணையான குழுக்கள் என வாசித்தல்.
  rationale: இரண்டு לְ சொற்றொடர்களும் எபிரெயக் கவிதையில் மறுவிளக்கம் அல்லது குறிப்பாக்கமாக இயல்பாக வாசிக்கப்படலாம். இடைக்கோடு அந்த உறவை உணர்த்துகிறது; ஆனால் ‘தூய உள்ளமுள்ளவர்கள் மட்டுமே உண்மையான இஸ்ரவேல்’ என்ற வலுவான கோட்பாட்டு முடிவை உரைக்குள் சேர்ப்பதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிமையானதாயும் கண்ணியமான சங்கீத நடையுடனும் அமைக்கப்பட்டது. ‘உள்ளம்’ என்பது வெறும் உணர்ச்சியை மட்டும் அல்லாமல் உள்ளார்ந்த மனநிலை மற்றும் நோக்கத்தையும் குறிக்கும் இயல்பான தமிழ்ச் சொல்லாகப் பயன்படுத்தப்பட்டுள்ளது.
