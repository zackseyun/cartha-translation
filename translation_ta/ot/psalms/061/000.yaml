lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இசை நிகழ்த்துதலை மேற்பார்வையிடுபவரைக் குறிக்கும் மரபான சொல்; இன்றைய வாசகர்களுக்குத் தெளிவாகவும் இசைச் சூழலுக்கு ஏற்றதாகவும் உள்ளது.
- source_word: עַל
  choice: உடன்
  rationale: இங்கு இசைக்கருவி சார்ந்த துணையிசையை அறிமுகப்படுத்துகிறது; தமிழில் ‘உடன்’ என்பது அந்தச் செயல்பாட்டை இயல்பாகத் தெரிவிக்கிறது.
- source_word: נְגִינַת
  choice: நரம்பிசைக் கருவிகள்
  rationale: நரம்புக் கருவிகளால் உருவாக்கப்படும் இசையையோ அவற்றின் துணையிசையையோ குறிக்கிறது; கருவிசார் பொருளை எளிதில் புரியுமாறு வழங்குகிறது.
- source_word: לְדָוִד
  choice: தாவீதுக்குரியது
  rationale: எபிரெய முன்னிடைச்சொல் படைப்புரிமை, தொடர்பு அல்லது அர்ப்பணிப்பு ஆகியவற்றைக் குறிக்கக்கூடும்; ‘தாவீதுக்குரியது’ அவற்றுள் ஒன்றை மட்டும் உறுதிப்படுத்தாமல் விரிவைத் தக்கவைக்கிறது.
theological_decisions:
- issue: தாவீதின் பெயருக்கு முன் வரும் לְ முன்னிடைச்சொல்
  choice: தாவீதுக்குரியது
  alternative: தாவீதால் இயற்றப்பட்டது / தாவீதுக்காக
  rationale: இந்த அமைப்பு தாவீதே நேரடியாக எழுதியவர் என்று கட்டாயமாகக் கூறுவதில்லை. மூலத்தின் வரலாற்று மற்றும் இலக்கணத் தெளிவின்மையைத் தீர்த்துவிடாமல் பாதுகாக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் சுருக்கமான, கண்ணியமான சங்கீதத் தலைப்பாக வடிவமைக்கப்பட்டது. ‘இசைத் தலைவர்’ பொதுவாசகருக்குத் தெளிவானது; ‘தாவீதுக்குரியது’ மூலத்தின் பொருள் விரிவை இயல்பான தமிழில் காக்கிறது.
