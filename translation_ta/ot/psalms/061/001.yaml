  yaml_path: translation/ot/psalms/061/001.yaml
  text: Hear my cry[a], O God; listen to my prayer.
translation:
  language: ta
  text: இறைவனே, என் கூக்குரலைக் கேளும்[a]; என் மன்றாட்டுக்குச் செவிகொடும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் உரத்த முழக்கத்தைக் கேளும்’ அல்லது ‘என் வேண்டுதலைக் கேளும்.’ எபிரெயச் சொல் உரத்த கூக்குரலையும், சில சூழல்களில் களிப்பொலி அல்லது பாடலையும் குறிக்கலாம்; இங்கு மன்றாட்டின் சூழல் அவசரமான வேண்டுதலைச் சுட்டுகிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: கேளும்
  rationale: שׁמע என்பதன் கால் கட்டளை வடிவம். இறைவனை நோக்கிய வேண்டுதலில் நேரடியான செவிமடுத்தலை இயல்பான, மரியாதையான தமிழில் வெளிப்படுத்துகிறது.
- source_word: אֱלֹהִים
  choice: இறைவனே
  rationale: இங்கு நேரடி விளியாக வருகிறது. நவீனத் தரமான தமிழில் இயல்பும் கண்ணியமும் கொண்ட இறை அழைப்பாகத் தேர்ந்தெடுக்கப்பட்டது.
- source_word: רִנָּתִי
  choice: என் கூக்குரலை
  rationale: רִנָּה என்பது உரத்த முழக்கம், கூக்குரல், சில சூழல்களில் களிப்பொலி அல்லது பாடல் ஆகியவற்றைக் குறிக்கலாம். மன்றாட்டோடு இணையும் இச்சூழலில் அவசரமான வேண்டுதலின் உரத்த குரல் பொருத்தமானது.
- source_word: הַקְשִׁיבָה
  choice: செவிகொடும்
  rationale: קשׁב என்பதன் ஹிஃபில் கட்டளை வடிவம்; கவனத்துடன் கேட்குமாறு வேண்டுகிறது. முதல் அடியின் ‘கேளும்’ என்பதைக் காட்டிலும் கவனமான செவிமடுத்தலைத் தெரிவித்து எபிரெய இணைப்பாட்டைத் தக்கவைக்கிறது.
- source_word: תְּפִלָּתִי
  choice: என் மன்றாட்டுக்கு
  rationale: תְּפִלָּה என்பதன் அடிப்படைப் பொருள் ஜெபம் அல்லது வேண்டுதல். இங்கு இறைவனிடம் உதவி கோரும் சூழலை இயல்பான தமிழில் ‘மன்றாட்டு’ வெளிப்படுத்துகிறது; ‘கூக்குரல்’ என்பதிலிருந்து இணைச்சொல் வேறுபாடும் காக்கப்படுகிறது.
