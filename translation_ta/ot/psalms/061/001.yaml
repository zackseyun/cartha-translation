translation_notes:
  register: நவீனத் தரமான, கண்ணியமான வேண்டுதல் மொழிநடை பயன்படுத்தப்பட்டுள்ளது. ‘கேளும் / செவிகொடும்’ என்ற இணை அமைப்பு மூலத்தின் இரு கேட்புக் கட்டளைகளையும் அவற்றுக்கிடையிலான நுண்ணிய வலியுறுத்தல் வேறுபாட்டையும் காக்கிறது.
