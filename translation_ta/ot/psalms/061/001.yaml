  terminology: “இறைவனே” is an acceptable nonsectarian rendering of the vocative אֱלֹהִים. “கூக்குரல்” and “மன்றாட்டு” distinguish the urgent cry from the prayer/petition well. The footnote responsibly preserves the lexical range of רִנָּה and explains why an urgent plea is preferred here.
