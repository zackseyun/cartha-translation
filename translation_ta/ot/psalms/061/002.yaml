  text: From the end of the earth I call to you when my heart grows faint[b][a]; lead me to a rock higher than I.
translation:
  language: ta
  text: 'பூமியின் கடைக்கோடியிலிருந்து உம்மை நோக்கிக் கூப்பிடுகிறேன்;

    என் இதயம் சோர்ந்துபோகும்போது[a],

    என்னைவிட உயரமான கற்பாறைக்கு என்னை வழிநடத்தும்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘என் இதயம் நிலைகுலையும்போது.’
    reason: lexical_alternative
  - marker: b
    text: அல்லது, ‘என்னால் எட்ட முடியாத உயரத்திலுள்ள கற்பாறைக்கு என்னை வழிநடத்தும்.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  choice: பூமியின் கடைக்கோடியிலிருந்து
  rationale: קָצֶה என்பது எல்லை அல்லது கடைக்கோடியைக் குறிக்கிறது. இக்கவிதைச் சூழலில் הָאָרֶץ என்பதை ‘பூமி’ என்று மொழிபெயர்ப்பது, சங்கீதக்காரரின் தொலைவு மற்றும் நெருக்கடியின் உணர்வைப் பாதுகாக்கிறது.
- source_word: אֵלֶיךָ אֶקְרָא
  choice: உம்மை நோக்கிக் கூப்பிடுகிறேன்
  rationale: קרא என்பது அழைத்தல் அல்லது கூப்பிடுதல் எனப் பொருள்படும். ‘கூப்பிடுகிறேன்’ என்பது வேண்டுதலின் அவசரத்தையும் இயல்பான நவீன தமிழையும் தக்கவைக்கிறது.
- source_word: בַּעֲטֹף לִבִּי
  choice: என் இதயம் சோர்ந்துபோகும்போது
  rationale: עטף இங்கு உள்ளார்ந்த வலிமை குன்றுதல், துவளுதல் அல்லது நிலைகுலைதல் ஆகிய நுண்ணுணர்வுகளைக் கொண்டுள்ளது. ‘சோர்ந்துபோகும்போது’ என்பது பொருளை மிகையாக விளக்காமல் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: בְּצוּר
  choice: கற்பாறைக்கு
  rationale: צוּר என்பது உறுதியான பாறையைக் குறிக்கிறது; பாதுகாப்பு அல்லது அடைக்கலம் என்ற உருவகத் தொனியையும் கொண்டிருக்கலாம். மூலத்தின் தெளிவான கவித்துவ உருவகத்தை ‘கற்பாறை’ பாதுகாக்கிறது.
- source_word: יָרוּם מִמֶּנִּי
  choice: என்னைவிட உயரமான
  rationale: רוּם என்பது உயர்ந்திருத்தலைக் குறிக்கிறது; מִמֶּנִּי ஒப்பீட்டை வெளிப்படுத்துகிறது. ஆகவே ‘என்னைவிட உயரமான’ என்பது இயல்பான ஒப்பீட்டு வாசிப்பைத் தக்கவைக்கிறது; ‘என்னால் எட்ட முடியாத’ என்ற சாத்தியமான வாசிப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: תַנְחֵנִי
  choice: என்னை வழிநடத்தும்
  rationale: נחה என்பதன் ஹிஃபில் வடிவம் வழிநடத்துதல் அல்லது அழைத்துச் செல்லுதல் எனப் பொருள்படும். வேண்டுதலின் சார்ந்திருக்கும் தன்மையை ‘வழிநடத்தும்’ இயல்பாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘கற்பாறை’ என்பதன் உருவகப் பொருள்
  choice: பாதுகாப்பான அடைக்கலத்தைக் குறிக்கக்கூடிய ‘கற்பாறை’ என்ற மூல உருவகத்தை விளக்கவுரை இன்றி தக்கவைத்தல்
  alternative: ‘பாதுகாப்பான இடத்திற்கு’ அல்லது ‘அடைக்கலத்திற்கு’ என்று வெளிப்படையாக மொழிபெயர்த்தல்
  rationale: எபிரெய உரை צוּר என்ற தெளிவான உருவகத்தைப் பயன்படுத்துகிறது. அதைத் தக்கவைப்பது கவித்துவத்தையும், தேவன் பாதுகாப்பளிப்பவர் என்ற இறையியல் ஒலிப்பையும் பாதுகாக்கிறது; அதேவேளையில் உருவகத்தை ஒரே விளக்கமாகச் சுருக்குவதில்லை.
translation_notes:
  register: நவீன தரமான, கண்ணியமான தமிழ் பயன்படுத்தப்பட்டுள்ளது. தேவனை நேரடியாக அழைக்கும் இடத்தில் மரியாதைப் பன்மையான ‘உம்மை’ பயன்படுத்தப்பட்டுள்ளது. கவிதையின் மூன்று அடிகளும் தொலைவு, உள்ளத் தளர்ச்சி, உயர்ந்த பாதுகாப்புக்கான வேண்டுதல் என்ற முன்னேற்றத்தைத் தெளிவாக வைத்திருக்கின்றன.
