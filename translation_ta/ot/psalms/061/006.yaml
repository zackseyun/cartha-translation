  text: יָמִ֣ים עַל יְמֵי מֶ֣לֶךְ תּוֹסִ֑יף שְׁ֝נוֹתָ֗י/ו כְּמוֹ דֹ֥ר וָ/דֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/006.yaml
  text: May you add days to the days of the king[b][a]; may his years be like generation after generation.
translation:
  language: ta
  text: 'அரசனின் நாட்களுக்கு மேலும் நாட்களைச் சேர்ப்பீராக[a];

    அவனுடைய ஆண்டுகள் தலைமுறைதோறும் நீடிப்பதாக[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அரசனின் நாட்களுக்கு மேலும் நாட்களை நீர் சேர்ப்பீர்; அவனுடைய ஆண்டுகள் தலைமுறைதோறும் நீடிக்கும்.” எபிரெய வினை வடிவத்தை வேண்டுதலாக மட்டுமல்லாமல் எதிர்காலக் கூற்றாகவும் வாசிக்கலாம்.
    reason: alternative_reading
  - marker: b
    text: நேர்மொழியாக, “தலைமுறையும் தலைமுறையும்”; அடுத்தடுத்து வரும் தலைமுறைகளைக் குறிக்கும் எபிரெயச் சொல்லாட்சி.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל יְמֵי מֶלֶךְ
  choice: அரசனுடைய நாட்களோடு நாட்களைக்
  rationale: எபிரெய மொழியின் ‘நாட்களோடு நாட்கள்’ என்ற சேர்க்கைச் சொல்லாட்சியைத் தமிழில் இயல்பாகவும், நீண்ட ஆயுளைக் குறிக்கும் அதன் உருவகத்தைக் காக்கும் வகையிலும் மொழிபெயர்க்கிறது.
- source_word: תּוֹסִיף
  choice: கூட்டுவீராக
  rationale: இது הוסיף என்பதன் ஹிபீல் முற்றுப்பெறா வடிவம்; சங்கீதத்தின் வேண்டுதல் சூழலில் கடவுளை நோக்கிய மரியாதையான விண்ணப்பமாக எடுத்துக்கொள்ளப்பட்டது.
- source_word: שְׁנוֹתָיו
  choice: அவனுடைய ஆண்டுகள்
  rationale: மசோரா வாசிப்பு மூன்றாம் நபர் ஆண்பால் ஒருமை உருபைக் காட்டுகிறது; அது அரசனைக் குறிக்கிறது.
- source_word: כְּמוֹ דֹר וָדֹר
  choice: தலைமுறை தலைமுறையாக
  rationale: ‘தலைமுறையும் தலைமுறையும்’ என்ற எபிரெயத் தொடரின் அடுத்தடுத்த தலைமுறைகள் என்ற பொருளை இயல்பான நவீனத் தமிழில் தருகிறது.
theological_decisions:
- issue: இந்த வசனம் அரசனின் நீண்ட ஆயுளுக்கான வேண்டுதலா அல்லது எதிர்காலத்தை அறிவிக்கும் கூற்றா?
  choice: 'வேண்டுதலாக: ‘கூட்டுவீராக ... நீடிப்பதாக’'
  alternative: 'எதிர்காலக் கூற்றாக: ‘நீர் கூட்டுவீர் ... நீடிக்கும்’'
  rationale: תּוֹסִיף இலக்கணப்படி எதிர்காலக் கூற்றாகவும் வாசிக்கப்படலாம். எனினும் சங்கீதத்தின் ஜெபச் சூழல் வேண்டுதல் வாசிப்பை ஆதரிக்கிறது; மாற்று வாசிப்பு அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளது.
- issue: அரசனின் ஆண்டுகள் தலைமுறைகள் அளவுக்கு இருப்பதன் பொருள்
  choice: சொல்லாட்சியின் நீடித்த காலப் பொருளைத் தீர்மானிக்காமல் ‘தலைமுறை தலைமுறையாக நீடிப்பதாக’ என வைத்தல்
  alternative: ஒரு குறிப்பிட்ட அரசனின் நேரடி உயிரியல் ஆயுள் அல்லது அவரது வம்சத்தின் தொடர்ச்சி எனத் தெளிவுபடுத்துதல்
  rationale: மூல உரை மிக நீண்ட ஆயுளை வேண்டுகிறது; அது தனிநபரின் ஆயுளையா, அரச வம்சத் தொடர்ச்சியையா, வேறு அரசியல்-இறையியல் நம்பிக்கையையா குறிக்கிறது என்பதை மொழிபெயர்ப்பு தனியாகத் தீர்மானிக்கக் கூடாது.
translation_notes:
  register: நவீன செந்தமிழ் கலந்த பொதுநடை; கடவுளை நோக்கிய மரியாதைப் பன்மை பயன்படுத்தப்பட்டுள்ளது. ‘நாட்களோடு நாட்களைக் கூட்டுதல்’ என்ற மூல உருவகம் காக்கப்பட்டு, இரண்டாம் அடியில் ‘நீடிப்பதாக’ சேர்ப்பதன் மூலம் தமிழில் வேண்டுதலின் பொருள் தெளிவாக்கப்பட்டுள்ளது. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
