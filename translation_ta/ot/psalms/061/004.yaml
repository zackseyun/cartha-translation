source:
  edition: WLC
  text: אָג֣וּרָה בְ֭/אָהָלְ/ךָ עוֹלָמִ֑ים אֶֽחֱסֶ֨ה בְ/סֵ֖תֶר כְּנָפֶ֣י/ךָ סֶּֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/004.yaml
  text: Let me dwell in your tent forever[a]; let me take refuge in the shelter of your wings[b]. Selah
translation:
  language: ta
  text: உமது கூடாரத்தில்[a] என்றென்றும் நான் தங்கியிருப்பேனாக[b]; உமது சிறகுகளின் மறைவில் அடைக்கலம் புகுவேனாக. சேலா.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கூடாரம்” என்பது தேவனுடைய வாசஸ்தலத்தையோ பரிசுத்த இடத்தையோ நினைவூட்டலாம்; மூல எபிரெயச் சொல் நேரடியாக “கூடாரம்” என்றே பொருள்படும்.
    reason: cultural_note
  - marker: b
    text: “நான் தங்கியிருப்பேன்” என்றும் மொழிபெயர்க்கலாம். எபிரெய வடிவம் வலுவான விருப்பத்தையோ உறுதியான தீர்மானத்தையோ வெளிப்படுத்துகிறது; அடுத்துள்ள “அடைக்கலம் புகுவேனாக” என்பதையும் “அடைக்கலம் புகுவேன்” என்று புரிந்துகொள்ளலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָגוּרָה
  choice: நான் தங்கியிருப்பேனாக
  rationale: גור என்பதன் முதலாம் நபர் ஒருமை cohortative வடிவம் விருப்பத்தையோ உறுதியான தீர்மானத்தையோ வெளிப்படுத்துகிறது. வேண்டுதல் நிறைந்த சூழலில் “தங்கியிருப்பேனாக” என்பது அந்த நுணுக்கத்தை இயல்பாகக் காக்கிறது.
- source_word: בְאָהָלְךָ
  choice: உமது கூடாரத்தில்
  rationale: אָהֶל என்பதன் நேரடிப் பொருள் “கூடாரம்.” இது தேவனுடைய வாசஸ்தலத்தையோ பரிசுத்த இடத்தையோ நினைவூட்டக்கூடும்; ஆயினும் மூல உருவகத்தை விளக்கமாக மாற்றாமல் காக்க “கூடாரம்” தேர்ந்தெடுக்கப்பட்டது.
- source_word: עוֹלָמִים
  choice: என்றென்றும்
  rationale: עוֹלָם என்பதன் பன்மை வடிவம் நீடித்த காலத்தை வலியுறுத்தும் எபிரெய மொழிவழக்கு. “என்றென்றும்” என்பது நவீனத் தமிழில் இயல்பாகவும் கவித்துவமாகவும் உள்ளது.
- source_word: אֶחֱסֶה
  choice: அடைக்கலம் புகுவேனாக
  rationale: חסה என்பது பாதுகாப்புக்காக அடைக்கலம் புகுவதைக் குறிக்கிறது. முந்தைய cohortative உடன் இணைந்த வேண்டுதல் சார்ந்த இணைநிலையை இந்த வடிவம் காக்கிறது.
- source_word: בְסֵתֶר
  choice: மறைவில்
  rationale: סֵתֶר மறைக்கப்பட்ட, பாதுகாப்பான இடத்தைக் குறிக்கிறது. “மறைவு” என்பது ஒளிவையும் பாதுகாப்பையும் சுருக்கமாக வெளிப்படுத்துகிறது.
- source_word: כְּנָפֶיךָ
  choice: உமது சிறகுகளின்
  rationale: எபிரெயச் சொல்லின் நேரடிப் பொருள் “உமது சிறகுகள்.” “சிறகுகளின் மறைவில்” என்பது மூல மொழியின் உறவமைப்பையும் பாதுகாப்பு உருவகத்தையும் காக்கிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இந்த வழிபாட்டு அல்லது இசைக் குறியின் துல்லியமான பொருள் உறுதியாகத் தெரியாததால், ஊகித்து மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்பட்டுள்ளது.
theological_decisions:
- issue: “உமது கூடாரம்” என்பதிலுள்ள பரிசுத்த இட உருவகம்
  choice: “கூடாரம்” என்ற மூல உருவகத்தை அப்படியே வைத்தல்
  alternative: “உமது பரிசுத்த இடம்” அல்லது “உமது ஆலயம்” என்று விளக்கமாக மொழிபெயர்த்தல்
  rationale: இச்சொல் தேவனுடைய சந்நிதியையும் வழிபாட்டு இடத்தையும் நினைவூட்டலாம்; ஆனால் மூலவாசகம் குறிப்பாக “கூடாரம்” என்றே கூறுகிறது. அதை “ஆலயம்” என மாற்றுவது உரை கூறுவதைவிடக் குறிப்பான வரலாற்று அல்லது சமயப் பொருளைச் சேர்க்கக்கூடும்.
- issue: வினை வடிவங்களின் விருப்பம் அல்லது தீர்மானம் சார்ந்த நுணுக்கம்
  choice: “தங்கியிருப்பேனாக… அடைக்கலம் புகுவேனாக” என்று வேண்டுதல் நுணுக்கத்துடன் மொழிபெயர்த்தல்
  alternative: “தங்கியிருப்பேன்… அடைக்கலம் புகுவேன்” என்று உறுதியான எதிர்காலத் தீர்மானமாக மொழிபெயர்த்தல்
  rationale: முதல் வினை cohortative வடிவில் இருப்பதால் வலுவான விருப்பமும் தீர்மானமும் இரண்டுமே சாத்தியம். சங்கீதத்தின் வேண்டுதல் சூழலில் விருப்ப நுணுக்கம் முதன்மைப்படுத்தப்பட்டாலும், மாற்று வாசிப்பு அடிக்குறிப்பில் வெளிப்படையாக வைக்கப்பட்டுள்ளது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்குரிய கண்ணியமும் கவித்துவமும் காக்கப்பட்டுள்ளன. “உமது,” “தங்கியிருப்பேனாக,” “புகுவேனாக” ஆகிய வடிவங்கள் வழிபாட்டு மொழியின் உயர்வைத் தருகின்றன; அதேவேளையில் சாதாரண வாசகருக்கும் புரியும் வகையில் உள்ளன. மூலத்தின் இரு இணையான வேண்டுதல்களும் அரைப்புள்ளியால் இணைக்கப்பட்டுள்ளன.
