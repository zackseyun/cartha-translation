source:
  edition: WLC
  text: יֵשֵׁ֣ב ע֭וֹלָם לִ/פְנֵ֣י אֱלֹהִ֑ים חֶ֥סֶד וֶ֝/אֱמֶ֗ת מַ֣ן יִנְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/007.yaml
  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
translation:
  language: ta
  text: அவர் என்றென்றும் கடவுளின் முன்னிலையில் அரியணையில் அமர்ந்திருப்பாராக[a]; மாறாத அன்பையும் உண்மையையும்[b] அவரைக் காக்கும்படி நியமித்தருளும்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “அவர் என்றென்றும் கடவுளின் முன்னிலையில் தங்கியிருப்பாராக.” இங்குள்ள எபிரெய வினைச்சொல் ‘அமர்தல்’, ‘நிலைத்திருத்தல்’, அல்லது ‘தங்கியிருத்தல்’ என்று பொருள்படலாம்; அரசனைப் பற்றிய இச்சூழலில் அரியணையில் அமர்ந்து ஆள்வதையும் அது சுட்டக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “உண்மை” என்பதை இங்கே “உண்மைத்தன்மை” அல்லது “நம்பகத்தன்மை” என்றும் மொழிபெயர்க்கலாம். “மாறாத அன்பும் உண்மையும்/உண்மைத்தன்மையும்” என்ற எபிரெயச் சொல் இணை, கடவுளின் உறுதியான அன்பையும் நம்பகமான பற்றுறுதியையும் அடிக்கடி குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: அரியணையில் அமர்ந்திருப்பாராக
  rationale: ישב என்பதற்கு ‘அமர்தல்’, ‘தங்கியிருத்தல்’, ‘குடியிருத்தல்’ ஆகிய பொருள்கள் உண்டு. இது அரசனைப் பற்றிய சங்கீதமாகவும், அடுத்த அரையடியில் கடவுளை நோக்கிய வேண்டுதல் வருவதாலும், இங்கே நீடித்த அரசாட்சிக்கான வேண்டுதலை வெளிப்படுத்தும் ‘அரியணையில் அமர்ந்திருப்பாராக’ என்பது பொருத்தமானது. ‘தங்கியிருப்பாராக’ என்ற உண்மையான மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டுள்ளது.
- source_word: עוֹלָם
  choice: என்றென்றும்
  rationale: முடிவில்லாமல் நீடிக்கும் காலத்தை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לִפְנֵי אֱלֹהִים
  choice: கடவுளின் முன்னிலையில்
  rationale: கடவுளின் சந்நிதியிலும் அவரது பார்வைக்குட்பட்டும் இருப்பது என்ற உறவுசார் பொருளை இயல்பாகப் பாதுகாக்கிறது.
- source_word: חֶסֶד
  choice: மாறாத அன்பு
  rationale: חסד என்பதில் அன்போடு உறுதியான பற்றும் விசுவாசமான நிலைத்தன்மையும் அடங்குகின்றன. ‘மாறாத அன்பு’ என்பது இவற்றை சாதாரண வாசகருக்குத் தெளிவாக எடுத்துரைக்கிறது.
- source_word: אֱמֶת
  choice: உண்மை
  rationale: אמת என்பதன் நேரடியான பொருளைத் தக்கவைக்கிறது; இவ்விணைப்பில் ‘உண்மைத்தன்மை/நம்பகத்தன்மை’ என்ற சூழல்சார் பொருளும் இருப்பதால் அது அடிக்குறிப்பில் குறிப்பிடப்பட்டுள்ளது.
- source_word: מַן
  choice: நியமித்தருளும்
  rationale: מנה என்பதிலிருந்து வந்த கட்டளை வடிவமாகப் புரிந்துகொள்ளப்பட்டு, கடவுளிடம் மாறாத அன்பையும் உண்மையையும் காவலர்களாக ஏற்படுத்துமாறு வேண்டுகிறது. ‘அருளும்’ மரியாதையையும் வேண்டுதல் தொனியையும் இயல்பாகக் காட்டுகிறது.
- source_word: יִנְצְרֻהוּ
  choice: அவரைக் காக்கும்படி
  rationale: נצר என்பது காத்தல், பாதுகாத்தல், பேணுதல் என்று பொருள்படும். எபிரெயப் பன்மை வினை, மாறாத அன்பும் உண்மையும் மனிதர்போல் அரசனைக் காக்கும் இரு செயலாளர்களாகச் சித்தரிக்கப்படுவதைப் பாதுகாக்கிறது.
theological_decisions:
- issue: அரசனைப் பற்றிய முற்றுப்பெறா வினையின் வேண்டுதல் அல்லது எதிர்காலப் பொருள்
  choice: ‘அமர்ந்திருப்பாராக’ என்று வேண்டுதலாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘அவர் அரியணையில் அமர்ந்திருப்பார்’ என்ற எளிய எதிர்காலக் கூற்று.
  rationale: சுற்றியுள்ள பகுதி வேண்டுதல் தொனியுடையது; இரண்டாம் அரையடியும் கடவுளை நோக்கிய கட்டளையுடனான வேண்டுதல். ஆகவே முதல் அரையடியையும் வாழ்த்து வேண்டுதலாகப் புரிந்துகொள்வது செய்யுளின் ஒருமைப்பாட்டுக்கு ஏற்றது; இருப்பினும் எபிரெய வடிவத்தில் எதிர்கால வாசிப்பிற்கான இடமும் உள்ளது.
- issue: חֶסֶד וֶאֱמֶת என்ற இணைச்சொல்லின் பொருள்
  choice: ‘மாறாத அன்பும் உண்மையும்’ என, கடவுளின் பண்புகள் மனிதர்போல் காவலர்களாகச் சித்தரிக்கப்படுகின்றன.
  alternative: ‘மாறாத அன்பும் உண்மைத்தன்மையும்’ அல்லது ‘இரக்கமும் உண்மையும்’.
  rationale: இந்த எபிரெய இணை கடவுளின் உடன்படிக்கைச் சார்ந்த பற்றுறுதியையும் நம்பகத்தன்மையையும் அடிக்கடி குறிக்கிறது. முதன்மை உரை אמת என்பதன் ‘உண்மை’ என்ற வெளிப்படையான பொருளைத் தக்கவைக்கிறது; ‘உண்மைத்தன்மை’ என்ற வலுவான சூழல்சார் மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்துக்குரிய கண்ணியத்தையும் வேண்டுதல் தொனியையும் காக்கும் நடை பயன்படுத்தப்பட்டுள்ளது. ‘நியமித்தருளும்’ என்பது கடவுளை நோக்கிய மரியாதையான நேரடி வேண்டுதல்; ‘அரியணையில் அமர்ந்திருப்பாராக’ என்பது அரசச் சூழலை வெளிப்படுத்துகிறது. மூலத்தின் பொருள்மயக்கங்கள் அடிக்குறிப்புகளில் பாதுகாக்கப்பட்டுள்ளன.
