source:
  edition: WLC
  text: כֵּ֤ן אֲזַמְּרָ֣ה שִׁמְ/ךָ֣ לָ/עַ֑ד לְֽ/שַׁלְּמִ֥/י נְדָרַ֗/י י֣וֹם יֽוֹם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/008.yaml
  text: So I will sing praise to your name forever[a], to fulfill my vows day by day.
translation:
  language: ta
  text: ஆகையால், உமது பெயரை என்றென்றும் புகழ்ந்து பாடுவேன்; என் நேர்த்திக்கடன்களை நாள்தோறும் செலுத்துவேன்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் நேர்ச்சிகளை நாள்தோறும் நிறைவேற்றுவேன்.” நேர்ச்சிகளைப் பற்றிப் பயன்படுத்தப்பட்ட இங்குள்ள எபிரெய வினைச்சொல், அவற்றை ‘செலுத்துதல்’ அல்லது விரிவான பொருளில் ‘நிறைவேற்றுதல்’ எனப் பொருள்படலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: இவ்வாறு
  rationale: முந்தைய வேண்டுதலையும் நம்பிக்கையையும் தொடர்ந்து வரும் முடிவுறுதியைக் காட்டுகிறது; ‘இவ்வாறு’ என்பது அதன் தொடர்பையும் விளைவுணர்வையும் இயல்பாகத் தருகிறது.
- source_word: אֲזַמְּרָה
  choice: புகழ்ந்து பாடுவேன்
  rationale: זמר என்பதன் பியேல் வடிவம் இசையோடு புகழ்பாடுவதைக் குறிக்கிறது; ‘புகழ்ந்து பாடுவேன்’ வழிபாட்டுச் சூழலைத் தெளிவாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: שִׁמְךָ
  choice: உமது பெயரை
  rationale: எபிரெய வெளிப்பாட்டை நேரடியாகப் பேணுகிறது; ‘பெயர்’ என்பது அந்த நபரின் வெளிப்படுத்தப்பட்ட தன்மையையும் புகழையும் உள்ளடக்கக்கூடும் என்றாலும், அதை விளக்கமாக மாற்றாமல் மூல உருவகம் தக்கவைக்கப்படுகிறது.
- source_word: לָעַד
  choice: என்றென்றும்
  rationale: நீடித்த, முடிவில்லாத காலத்தைக் குறிக்கிறது; சங்கீதத்தின் தொடர்ந்த புகழ்ச்சியுறுதியை இயல்பான நவீன தமிழில் தருகிறது.
- source_word: לְשַׁלְּמִי
  choice: செலுத்துவேன்
  rationale: שלם என்பதன் பியேல் வடிவம் நேர்த்திக்கடன்களைச் செலுத்துதல் அல்லது நேர்ச்சிகளை நிறைவேற்றுதல் எனப் பொருள்படும்; ‘செலுத்துவேன்’ என்பது நேர்த்திக்கடன் என்ற சொல்லுடன் இயல்பாக இணைந்து மூலத்தின் கடன்பொறுப்பு உணர்வைப் பேணுகிறது.
- source_word: נְדָרַי
  choice: என் நேர்த்திக்கடன்களை
  rationale: கடவுளிடம் செய்த உறுதிமொழிகளையும் அவற்றால் ஏற்படும் கடமையையும் தமிழில் வழக்கமான, புரியத்தக்க முறையில் குறிக்கிறது.
- source_word: יוֹם יוֹם
  choice: நாள்தோறும்
  rationale: சொல் இரட்டிப்பு தொடர்ச்சியான ஒழுங்கை வலியுறுத்துகிறது; ‘நாள்தோறும்’ அந்த மீள்நிகழும் பொருளைச் சுருக்கமாகவும் இயல்பாகவும் தருகிறது.
