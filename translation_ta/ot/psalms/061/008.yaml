translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான வழிபாட்டு நடையைப் பயன்படுத்துகிறது. இறைவனை நோக்கிய ஒருமை மரியாதை வடிவமாக ‘உமது’ தேர்ந்தெடுக்கப்பட்டுள்ளது; எபிரெயத்தின் புகழ்ச்சி, நேர்த்திக்கடன், தொடர்ச்சி ஆகிய கூறுகள் சுருக்கமாகப் பேணப்பட்டுள்ளன.
