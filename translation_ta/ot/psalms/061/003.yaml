lexical_decisions:
- source_word: מַחְסֶה
  choice: அடைக்கலம்
  rationale: பாதுகாப்பிற்காக ஒருவர் புகும் இடம் என்ற எபிரெயச் சொல்லின் பொருளை இயல்பாகவும் நேரடியாகவும் தெரிவிக்கிறது.
- source_word: מִגְדַּל עֹז
  choice: வலிமையான கோபுரம்
  rationale: ‘வலிமையின் கோபுரம்’ என்ற சொல்லமைப்பின் பொருளை நவீனத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מִפְּנֵי אוֹיֵב
  choice: எதிரியிடமிருந்து காக்கும்
  rationale: எதிரியின் முன்னிலையிலிருந்து அல்லது அச்சுறுத்தலிலிருந்து பாதுகாப்பு என்ற சூழல்சார் பொருளைத் தெளிவாகக் காட்டுகிறது; ‘காக்கும்’ என்பது கோபுர உருவகத்தில் உள்ள பாதுகாப்புச் செயல்பாட்டை வெளிப்படுத்துகிறது.
