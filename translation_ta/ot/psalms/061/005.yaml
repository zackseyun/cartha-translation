source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֱ֭לֹהִים שָׁמַ֣עְתָּ לִ/נְדָרָ֑/י נָתַ֥תָּ יְ֝רֻשַּׁ֗ת יִרְאֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you[a], O God, have heard my vows[b]; you have given me the inheritance of those who fear your name.
translation:
  language: ta
  text: 'ஏனெனில், கடவுளே, நீர் என் நேர்த்திகளைக் கேட்டீர்;

    உமது பெயருக்கு அஞ்சுகிறவர்களின்[b] மரபுரிமையைத் தந்தீர்.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது பெயருக்கு அஞ்சுகிறவர்களின் மரபுரிமையை எனக்குத் தந்தீர்.” எபிரெய உரையில் “எனக்கு” என்பது வெளிப்படையாக இல்லை; சூழலிலிருந்து அதைச் சிலர் புரிந்துகொள்கிறார்கள்.
    reason: alternative_reading
  - marker: b
    text: “உமது பெயருக்கு அஞ்சுகிறவர்கள்” என்பது கடவுளிடம் பயபக்தியுடன் வாழ்கிறவர்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்புச் சொல்லின் பொருளை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இரண்டாம் நபர் வினை வடிவங்களால் தெளிவாகும் நேரடி அழைப்பைத் தமிழ் விளிவேற்றுமை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁמַעְתָּ
  choice: நீர் ... கேட்டீர்
  rationale: முடிவுற்ற செயலை மரியாதையான நேரடி உரையாடல் நடையில் தருகிறது; இங்கு ‘கேட்டல்’ என்பது கவனித்துக் கேட்டதையும் உள்ளடக்குகிறது.
- source_word: לִנְדָרָי
  choice: என் நேர்த்திகள்
  rationale: נדר என்பதன் அடிப்படைப் பொருளான கடவுளிடம் செய்யப்படும் உறுதிமொழிகளைத் தருகிறது; அவற்றோடு தொடர்புடைய காணிக்கைகளை மட்டும் குறுக்கிப் பொருள் கொள்ளவில்லை.
- source_word: נָתַתָּ
  choice: தந்தீர்
  rationale: எபிரெய நிறைவுற்ற வினையை இயல்பான, மரியாதையான தமிழ் இறந்தகால வடிவத்தில் தருகிறது.
- source_word: יְרֻשַּׁת
  choice: உரிமைப்பங்கு
  rationale: வழிவழியாகவோ வழங்கப்பட்டதாகவோ பெறப்படும் சொத்து அல்லது பங்கு என்ற கருத்தை நவீன வாசகருக்குத் தெளிவாகத் தருகிறது.
- source_word: יִרְאֵי שְׁמֶךָ
  choice: உமது பெயருக்கு அஞ்சுகிறவர்கள்
  rationale: ‘அஞ்சுதல்’ என்ற மூல உருவகத்தையும், கடவுள்மீதான பயபக்தியைக் குறிக்கும் அதன் வேதவியல் நிறையையும் பாதுகாக்கிறது.
theological_decisions:
- issue: נָתַתָּ יְרֻשַּׁת יִרְאֵי שְׁמֶךָ என்ற இறுதிக் கூறில் பெறுபவர் வெளிப்படையாக உள்ளாரா?
  choice: உமது பெயருக்கு அஞ்சுகிறவர்களின் உரிமைப்பங்கைத் தந்தீர்
  alternative: உமது பெயருக்கு அஞ்சுகிறவர்களின் உரிமைப்பங்கை எனக்குத் தந்தீர்
  rationale: எபிரெய உரையில் ‘எனக்கு’ என்ற மறைமுகச் செயப்படுபொருள் இல்லை. ஆகவே முதன்மை உரை அதைச் சேர்க்காமல் மூலத்தின் இலக்கணத் திறந்தநிலையைப் பாதுகாக்கிறது; சூழலிலிருந்து ‘எனக்கு’ என்று புரிந்துகொள்ளும் வாய்ப்பு அடிக்குறிப்பில் தரப்படுகிறது.
- issue: ‘உமது பெயருக்கு அஞ்சுகிறவர்கள்’ என்பதன் பொருள்
  choice: மூலத்தின் ‘அஞ்சுதல்’ மொழியை முதன்மை உரையில் வைத்தல்
  alternative: உமது பெயரைப் பயபக்தியுடன் போற்றுகிறவர்கள்
  rationale: மென்மைப்படுத்தப்பட்ட சொல்லால் வேதவியல் நிறையை நீக்காமல், இது வெறும் பீதியைக் குறிக்காது என்பதை அடிக்குறிப்பு விளக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீத ஜெபத்திற்கேற்ற கண்ணியமான நடையும் கடவுளை நோக்கிய மரியாதைப் பன்மை வடிவங்களும் பயன்படுத்தப்பட்டுள்ளன. முதன்மை உரை எபிரெயத்தில் இல்லாத ‘எனக்கு’ என்பதைச் சேர்க்காமல் உண்மையான இலக்கணத் தெளிவின்மையைப் பாதுகாக்கிறது.
