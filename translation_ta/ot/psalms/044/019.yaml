  text: כִּ֣י דִ֭כִּיתָ/נוּ בִּ/מְק֣וֹם תַּנִּ֑ים וַ/תְּכַ֖ס עָלֵ֣י/נוּ בְ/צַלְמָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/019.yaml
  text: For you crushed us in a place of jackals and covered us with deep darkness[a][b].
translation:
  language: ta
  text: ஏனெனில், குள்ளநரிகள் வாழும் இடத்தில் எங்களை நொறுக்கினீர்; காரிருளால் எங்களை மூடினீர்[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மரண நிழலால் எங்களை மூடினீர்.”
    reason: lexical_alternative
  - marker: b
    text: பாழடைந்த இடத்தைச் சித்தரிக்கும் இவ்வுருவகத்தில் “குள்ளநரிகள்” என்பதே பெரும்பாலும் கருதப்படும் பொருள்; பழைய மொழிபெயர்ப்புகள் சிலவற்றில் “வலுசர்ப்பங்கள்” என்று உள்ளது.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய கூற்றுக்கான காரணத்தையோ விளக்கத்தையோ அறிமுகப்படுத்தும் இணைப்பாக எடுத்துக்கொள்ளப்பட்டுள்ளது.
- source_word: דִכִּיתָנוּ
  choice: எங்களை நொறுக்கினீர்
  rationale: דכה என்பதிலுள்ள நசுக்குதல், முறித்துப்போடுதல் ஆகிய வலுவான துன்புறுத்தல் கருத்தை இயல்பான தமிழில் தக்கவைக்கிறது.
- source_word: בִּמְקוֹם תַּנִּים
  choice: குள்ளநரிகள் வாழும் இடத்தில்
  rationale: பாழடைந்த நிலப்பகுதியைக் குறிக்கும் கவிதைப் படிமத்தில் תַּנִּים என்பது பெரும்பாலும் குள்ளநரிகளைக் குறிக்கிறது; ‘வாழும்’ என்பது எபிரெயக் கட்டிணைப்பின் பொருளை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וַתְּכַס עָלֵינוּ
  choice: எங்களை மூடினீர்
  rationale: தேவனை நேரடியாக விளிக்கும் தொடரைத் தக்கவைத்து, ‘மூடுதல்’ என்ற உருவகத்தை விளக்கவுரையாக மாற்றாமல் பாதுகாக்கிறது.
- source_word: בְצַלְמָוֶת
  choice: காரிருளால்
  rationale: צַלְמָוֶת என்பதன் சூழ்ந்துகொள்ளும் அடர்ந்த இருள் அல்லது ஆழ்ந்த இருள் என்ற மொழிவழக்குப் பொருளைச் சுருக்கமாகவும் கவித்துவமாகவும் தெரிவிக்கிறது.
theological_decisions:
- issue: בְצַלְמָוֶת என்பதன் பொருள்
  choice: காரிருள்
  alternative: மரண நிழல்
  rationale: இச்சொல் நேரடியாக மரணத்தைக் குறிப்பதாகவும், மொழிவழக்காக ஆழ்ந்த இருளைக் குறிப்பதாகவும் புரிந்துகொள்ளப்படலாம். முதன்மை உரை சூழலுக்கு ஏற்ற ‘காரிருள்’ என்பதைப் பயன்படுத்துகிறது; மரபான மாற்றுப் பொருள் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன பொதுத்தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவித்துவ நடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. மரியாதை ஒருமை வினைமுற்றுகள் பயன்படுத்தப்பட்டுள்ளன; மூலத்தின் இருள் உருவகமும் வலுவான துன்புறுத்தல் மொழியும் தக்கவைக்கப்பட்டுள்ளன.
