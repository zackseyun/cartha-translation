  text: You have made us a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: ta
  text: எங்கள் அயலாருக்கு எங்களை நிந்தையாகவும், எங்களைச் சுற்றியிருப்போருக்கு ஏளனமாகவும் பரிகாசமாகவும் ஆக்கினீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “கேலிக்குரியவர்களாகவும் வசைச்சொல்லுக்கு இலக்கானவர்களாகவும்” என்றும் மொழிபெயர்க்கலாம். இணையாக வரும் இரு எபிரெயச் சொற்களும் சுற்றியுள்ள மக்களின் வெளிப்படையான இகழ்ச்சியை வலியுறுத்துகின்றன.
