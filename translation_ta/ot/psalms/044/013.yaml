lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: எங்களை … ஆக்கினீர்
  rationale: שׂים என்பதன் ‘வைத்தல், ஆக்குதல்’ என்ற விளைவுசார் பொருளைத் தருகிறது; புலம்பலில் இறைவனை நேரடியாக விளிக்கும் மரியாதை ஒருமை வடிவமும் காக்கப்படுகிறது.
- source_word: חֶרְפָּה
  choice: நிந்தையாக
  rationale: பிறரால் இகழப்பட்டு அவமானத்திற்கு உள்ளாகும் நிலையை இயல்பான நவீனத் தமிழில் தெரிவிக்கிறது.
- source_word: לִשְׁכֵנֵינוּ
  choice: எங்கள் அயலாருக்கு
  rationale: ל குறிக்கும் தொடர்பை நெருக்கமாகப் பேணுகிறது; அண்டை மக்களைக் குறிக்கும் சொல்லாகவும் இயல்பாக உள்ளது.
- source_word: לַעַג
  choice: ஏளனமாக
  rationale: இகழ்ச்சியுடன் சிரித்தல் அல்லது கேலி செய்தல் என்ற பொருளைத் தருகிறது.
- source_word: קֶלֶס
  choice: பரிகாசமாக
  rationale: לַעַג உடன் இணையும் இரண்டாவது இகழ்ச்சிச் சொல்லின் தனித்த நுணுக்கத்தை ஓரளவு காத்து, பொதுமக்களுக்கு விளங்கும் தமிழை வழங்குகிறது.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: எங்களைச் சுற்றியிருப்போருக்கு
  rationale: சொல்லின் ‘எங்களைச் சுற்றியுள்ளவர்கள்’ என்ற பரந்த குறிப்பைத் தக்கவைத்து, அதைச் சுற்றியுள்ள மக்களென்று இயல்பாக வெளிப்படுத்துகிறது.
