  text: because of the voice of one who reproaches and blasphemes[b][a], because of the enemy and the avenger.
translation:
  language: ta
  text: நிந்தித்துத் தேவதூஷணம் செய்கிறவனின் குரலால்[a], பகைவனாலும் பழிவாங்குகிறவனாலும்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நிந்தித்து வசைபாடுகிறவனின் சத்தத்தால்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரெயத்தில் சொல்லுக்குச் சொல், “பகைவன் மற்றும் பழிவாங்குகிறவனின் முகத்திலிருந்து”; இது “அவர்களால்” அல்லது “அவர்களின் நிமித்தம்” என்று பொருள்படும் மரபுத்தொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: குரலால்
  rationale: מִן உடன் வரும் קוֹל இங்கு காரணத்தைக் குறிக்கிறது; ‘குரலால்’ என்பது காரணப் பொருளையும் எபிரெய மொழியின் குரல் என்ற உருவகத்தையும் சுருக்கமாகத் தக்கவைக்கிறது.
- source_word: מְחָרֵף
  choice: நிந்தித்து ... பேசுகிறவன்
  rationale: חרף இன் நிகழ்காலப் பங்கேற்புவினை வடிவம் தொடர்ந்து நிந்திக்கிற நபரைக் குறிக்கிறது; தமிழில் இயல்பான நபர்சுட்டு வினைத்தொடராக வழங்கப்பட்டுள்ளது.
- source_word: וּמְגַדֵּף
  choice: தேவதூஷணம் பேசுகிற
  rationale: גדף இழிவாகப் பேசுதல் என்ற பொதுப்பொருளுடன் கடவுளுக்கு எதிரான தூஷணத்தின் வலிமையான நுண்பொருளையும் கொண்டிருக்கலாம்; இந்தத் தெரிவு அந்தச் சமயப் பரிமாணத்தைத் தக்கவைக்கிறது.
- source_word: מִפְּנֵי
  choice: '...ஆலும்'
  rationale: சொல்லுக்குச் சொல் ‘முகத்திலிருந்து/முன்னிலையிலிருந்து’ என்றாலும், இங்கு காரணம் அல்லது நிமித்தத்தைக் குறிக்கும் மரபுத்தொடர்; தமிழ் காரண வேற்றுமை இயல்பாக அமைகிறது.
- source_word: אֹיֵב
  choice: பகைவன்
  rationale: எபிரெய ஒருமையையும் தனிநபர் அல்லது பிரதிநிதித்துவப் பொருளையும் தக்கவைக்கும் இயல்பான தமிழ் சொல்.
- source_word: וּמִתְנַקֵּם
  choice: பழிவாங்குகிறவன்
  rationale: נקם இன் ஹித்பயேல் பங்கேற்புவினை பழிவாங்கும் செயலில் ஈடுபடுகிற நபரைக் குறிக்கிறது; ‘பழிவாங்குகிறவன்’ செயற்பொருளைத் தெளிவாகத் தக்கவைக்கிறது.
theological_decisions:
- issue: גדף குறிக்கும் பகைமையான பேச்சில், பொதுவான வசையுடன் கடவுளுக்கு எதிரான தூஷணமும் சாத்தியமா என்பது
  choice: தேவதூஷணம் பேசுகிற
  alternative: வசைபாடுகிற / இழிவாகப் பேசுகிற
  rationale: வேதாகமப் பயன்பாட்டில் גדף பல இடங்களில் வெறும் மனித அவமதிப்பை விட வலிமையான, கடவுளை அவமதிக்கும் நுண்பொருளைக் கொண்டுள்ளது. ‘தேவதூஷணம்’ அந்தத் theological வலிமையைத் தக்கவைக்கிறது; மாற்றுப் பொதுப்பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைநயமும் மரியாதையான நடையும் தக்கவைக்கப்பட்டுள்ளன. முந்தைய வசனத்தோடு இணையும் காரணத் துணைவாக்கிய அமைப்பு வேண்டுமென்றே முழு வாக்கியமாக மாற்றப்படவில்லை. எல்லா அடிக்குறிப்பு குறிகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
