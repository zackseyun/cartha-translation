  yaml_path: translation/ot/psalms/044/022.yaml
  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
translation:
  language: ta
  text: ஏனெனில், உமக்காக[a] நாள் முழுவதும் நாங்கள் கொல்லப்படுகிறோம்; கொல்லப்படுவதற்கான ஆடுகளைப் போல நாங்கள் கருதப்படுகிறோம்[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “உம்முடைய காரணமாக” அல்லது “உம்மை முன்னிட்டு” என்றும் மொழிபெயர்க்கலாம். எபிரெயச் சொற்றொடர் கடவுளுடனான உறவின் காரணமாக அனுபவிக்கப்படும் துன்பத்தைக் குறிக்கக்கூடும்.
    reason: lexical_alternative
  - marker: b
    text: “கொல்லப்படுவதற்கான ஆடுகளாக நாங்கள் எண்ணப்படுகிறோம்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய முறையீட்டுக்கான காரணத்தை அறிமுகப்படுத்தும் இணைப்பாக இங்கு வருகிறது; எனவே காரணத் தொடர்பைத் தெளிவாகக் காட்டும் இயல்பான தமிழ்ச் சொல் தேர்ந்தெடுக்கப்பட்டது.
- source_word: עָלֶיךָ
  choice: உமக்காக
  rationale: துன்பம் கடவுளுடன் கொண்ட உறவு அல்லது அவருக்கான பற்றுறுதியின் காரணமாக அனுபவிக்கப்படுவதை இயல்பாக வெளிப்படுத்துகிறது; கடவுளையே கொலையின் நேரடி காரணியாகக் குறிப்பதில்லை.
- source_word: הֹרַגְנוּ
  choice: நாங்கள் கொல்லப்படுகிறோம்
  rationale: வடிவில் நிறைவுற்ற வினையாக இருந்தாலும், புலம்பல் கவிதையில் தொடர்ச்சியாக அல்லது மீண்டும் மீண்டும் நிகழும் அனுபவத்தைக் குறிக்கிறது; நிகழ்காலச் செயப்பாட்டு வடிவம் அதைப் பாதுகாக்கிறது.
- source_word: כָל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: தொடர்ந்த கால அளவைச் சொல்லும் இயல்பான நவீனத் தமிழ் வழக்கு.
- source_word: נֶחְשַׁבְנוּ
  choice: நாங்கள் கருதப்படுகிறோம்
  rationale: ஒருவரை ஒரு குறிப்பிட்ட நிலையில் மதிப்பிடுதல் அல்லது வகைப்படுத்துதல் என்ற செயப்பாட்டு பொருளைத் தெளிவாகத் தருகிறது.
- source_word: כְּצֹאן
  choice: ஆடுகளைப் போல
  rationale: ஒப்புமைக் கூறை இயல்பான தமிழில் வெளிப்படுத்துகிறது; צֹאן இச்சூழலில் கொல்லப்படுவதற்குரிய ஆடுகளைக் குறிக்கிறது.
- source_word: טִבְחָה
  choice: வெட்டப்படவிருக்கும்
  rationale: கால்நடைகள் கொல்லப்படுவதற்காக ஒதுக்கப்பட்டிருப்பதை இயல்பாகவும் கண்ணியமாகவும் காட்டுகிறது; பலியிடுதல் என்ற தேவையற்ற சமயப் பொருளைச் சேர்ப்பதில்லை.
theological_decisions:
- issue: இந்த வசனம் கடவுளால் உண்டாகும் துன்பத்தையா, கடவுளுடனான உறவின் காரணமாக அனுபவிக்கப்படும் துன்பத்தையா குறிக்கிறது?
  choice: உமக்காக
  alternative: உம்முடைய காரணமாக; உம்மை முன்னிட்டு
  rationale: עָלֶיךָ பல நெருங்கிய காரண அல்லது தொடர்புப் பொருள்களைத் தரக்கூடும். முதன்மை மொழிபெயர்ப்பு துன்பம் கடவுளுடன் கொண்ட உறவினால் அனுபவிக்கப்படுவதைத் தெரிவிக்கிறது; ஆனால் கடவுள்மீது நேரடியான பழியைச் சுமத்தி மூலத்தின் இறையியல் பதற்றத்தைத் தீர்த்துவிடவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், புலம்பலுக்கேற்ற கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நேரடியாக விளிக்கும் ஒருமைச் சுட்டுப்பெயருக்கு மரியாதை வடிவமான “உமக்கு” பயன்படுத்தப்பட்டுள்ளது. கவிதை இணைநிலையைப் பாதுகாக்க இரு அரையடிகளிலும் “நாங்கள்” இடம்பெறுகிறது.
