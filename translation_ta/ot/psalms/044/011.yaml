  text: You give us over like sheep for food[b][a], and among the nations you have scattered us.
translation:
  language: ta
  text: உணவுக்கான ஆடுகளைப்போல் எங்களை ஒப்புக்கொடுக்கிறீர்[a]; நாடுகளிடையே[b] எங்களைச் சிதறடித்தீர்.
  philosophy: optimal-equivalence
