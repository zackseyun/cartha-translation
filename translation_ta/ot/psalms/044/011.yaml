    text: அல்லது, “உணவுக்கான ஆடுகளைப்போல் எங்களைக் கையளிக்கிறீர்.”
    reason: lexical_alternative
  - marker: b
    text: எபிரேயத்தில் “நாடுகள்” என்று உள்ளது; இச்சூழலில் இஸ்ரவேலர் சிதறடிக்கப்பட்ட பிறநாட்டு மக்களைக் குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  choice: எங்களை ஒப்புக்கொடுக்கிறீர்
  rationale: נתן என்பதன் அடிப்படைப் பொருள் ‘கொடு’ என்பதாக இருந்தாலும், இப்புலம்பலின் சூழலில் பகைவர்களின் கையில் விட்டுக்கொடுக்கும் கருத்து உள்ளது. ‘ஒப்புக்கொடுக்கிறீர்’ என்பது அந்தச் சூழல்சார் வலிமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: כְּצֹאן
  choice: ஆடுகளைப்போல்
  rationale: כ என்ற ஒப்புமை உருபையும் צאן என்ற மந்தை விலங்குகளைக் குறிக்கும் சொல்லையும் தெளிவான, இயல்பான தமிழ்ச் சொற்றொடராக வழங்குகிறது.
- source_word: מַאֲכָל
  choice: உணவாகும்
  rationale: இச்சொல் ‘உணவு/உண்ணப்படுவது’ என்று பொருள்படும்; குறிப்பாக ‘பலி’ அல்லது ‘கொலை’ என்று கூறுவதில்லை. எனவே எபிரேய உருவகத்தின் கடுமையைத் தக்கவைத்தபடியே அதற்கு மேற்பட்ட குறிப்பைச் சேர்க்காமல் மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: וּבַגּוֹיִם
  choice: நாடுகளிடையே
  rationale: גּוֹיִם என்பது பன்மையில் நாடுகள் அல்லது பிற மக்கள் கூட்டங்களைக் குறிக்கிறது. சங்கீதத்தின் இச்சூழலில் ‘நாடுகளிடையே’ என்பது நேரடியும் இயல்புமான தமிழாக்கம்.
- source_word: זֵרִיתָנוּ
  choice: எங்களைச் சிதறடித்தீர்
  rationale: זרה என்பதற்கு ‘சிதறு/தூற்று’ என்ற பொருள் உண்டு. நாடுகளிடையே பரப்பப்பட்ட நிலையைக் குறிக்கும் இச்சூழலில் ‘சிதறடித்தீர்’ தெளிவாகவும், வினையின் தீவிரத்தையும் தேவனுடைய நேரடிச் செயலையும் தக்கவைத்தும் உள்ளது.
theological_decisions:
- issue: மக்கள் உணவாகும் ஆடுகளுக்கு ஒப்பிடப்படுதல்
  choice: ‘உணவாகும் ஆடுகளைப்போல்’ என்ற கடுமையான உருவகம் தக்கவைக்கப்பட்டது.
  alternative: ‘கொல்லப்பட வேண்டிய ஆடுகளைப்போல்’
  rationale: מַאֲכָל என்பது உணவை அல்லது உண்ணப்படுவதைச் சொல்கிறது; ‘கொல்லப்படுதல்’ என்ற குறிப்பிட்ட கருத்தை நேரடியாகச் சொல்லவில்லை. ஆகவே புலம்பலின் தீவிரம் மென்மையாக்கப்படாமலும், மூலத்தில் இல்லாத குறிப்பும் சேர்க்கப்படாமலும் உள்ளது.
- issue: துன்பத்திலும் சிதறடிப்பிலும் தேவனுடைய செயற்பாடு
  choice: ‘ஒப்புக்கொடுக்கிறீர்’ என்றும் ‘சிதறடித்தீர்’ என்றும் இரண்டாம் நபர் வினைகள் நேரடியாகத் தக்கவைக்கப்பட்டன.
  alternative: ‘ஒப்புக்கொடுக்கப்பட்டோம்; சிதறடிக்கப்பட்டோம்’ என மறைமுகச் செயப்பாட்டில் கூறுதல்
  rationale: எபிரேய உரை தேவனையே நேரடியாகச் செயலாற்றுபவராகக் குறிப்பிடுகிறது. இந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மென்மையாக்கவோ மறைக்கவோ கூடாது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் வகையிலும் சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான நடையிலும் அமைக்கப்பட்டது. ‘ஒப்புக்கொடுக்கிறீர்’ என்ற நிகழ்கால வடிவமும் ‘சிதறடித்தீர்’ என்ற நிறைவுற்ற கால வடிவமும் எபிரேய வினைகளின் வேறுபாட்டை தமிழில் இயன்றவரை பிரதிபலிக்கின்றன. எல்லா அடிக்குறிப்பு குறியீடுகளும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
