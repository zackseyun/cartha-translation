source:
  edition: WLC
  text: כָּל זֹ֣את בָּ֭אַתְ/נוּ וְ/לֹ֣א שְׁכַחֲנ֑וּ/ךָ וְ/לֹֽא שִׁ֝קַּ֗רְנוּ בִּ/בְרִיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/017.yaml
  text: All this has come upon us[a], yet we have not forgotten you, and we have not been false to your covenant.
translation:
  language: ta
  text: இவை அனைத்தும் எங்களுக்கு நேரிட்டன; ஆனாலும் நாங்கள் உம்மை மறக்கவில்லை; உமது உடன்படிக்கைக்கு உண்மையற்றவர்களாக நடந்துகொள்ளவும் இல்லை.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “உமது உடன்படிக்கையில் வஞ்சகமாக நடந்துகொள்ளவும் இல்லை.”
    reason: שִׁקַּרְנוּ בִּבְרִיתֶךָ என்ற சொற்றொடரை ‘உடன்படிக்கைக்கு உண்மையற்றவர்களாக நடந்துகொள்ளுதல்’ என்றும் ‘உடன்படிக்கையில் வஞ்சகமாக நடந்துகொள்ளுதல்’ என்றும் இயல்பாகப் பொருள்படுத்தலாம்.
lexical_decisions:
- source_word: כָּל זֹאת
  choice: இவை அனைத்தும்
  rationale: முன்னர் விவரிக்கப்பட்ட துன்பங்கள் அனைத்தையும் தொகுத்துச் சுட்டும் எபிரேயச் சொற்றொடரின் முழுமையை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: בָּאַתְנוּ
  choice: எங்களுக்கு நேரிட்டன
  rationale: בוא என்பதன் அடிப்படைப் பொருள் ‘வருதல்’; துன்பங்கள் ஒருவர்மேல் வருவதைத் தமிழில் இயல்பாகச் சொல்லும் வகையில் ‘நேரிட்டன’ என வழங்கப்பட்டுள்ளது.
- source_word: וְלֹא
  choice: ஆனாலும் ... இல்லை
  rationale: நேரிட்ட துன்பங்களுக்கும் தொடர்ந்து காத்த உண்மைத்தன்மைக்கும் இடையிலான சூழல்சார் முரண்பாட்டை இயல்பான தமிழில் காட்டுகிறது.
- source_word: שְׁכַחֲנוּךָ
  choice: நாங்கள் உம்மை மறக்கவில்லை
  rationale: இரண்டாம் நபர் ஒருமை நேரடிப் பொருளையும் ‘மறத்தல்’ என்ற நேரான பொருளையும் காக்கிறது; கடவுளை நோக்கிய கண்ணியமான தமிழ் வழக்கு பயன்படுத்தப்பட்டுள்ளது.
- source_word: שִׁקַּרְנוּ
  choice: உண்மையற்றவர்களாக நடந்துகொள்ளவும் இல்லை
  rationale: שקר இங்கு வெறுமனே பொய் சொல்வதைவிட வஞ்சகமாக அல்லது உண்மையின்றி நடப்பதைக் குறிக்கிறது; உடன்படிக்கைச் சூழலில் இந்தத் தமிழ் தெரிவு அந்தச் செயற்பாட்டு உணர்வைத் தருகிறது.
- source_word: בִּבְרִיתֶךָ
  choice: உமது உடன்படிக்கைக்கு
  rationale: ב என்பது இங்கு பொய்மையாக நடந்துகொள்ளும் உறவு அல்லது பொருளைக் குறிக்கிறது; ‘உமது உடன்படிக்கைக்கு உண்மையற்றவர்களாக’ என்பது தமிழில் இயல்பாக இருந்து இரண்டாம் நபர் ஒருமை உடைமைப் பின்னொட்டையும் காக்கிறது.
theological_decisions:
- issue: துன்பத்தின் நடுவில் இஸ்ரவேல் முன்வைக்கும் குற்றமின்மைக் கூற்றின் வரம்பு
  choice: கடவுளை மறக்கவில்லை என்றும் அவரது உடன்படிக்கைக்கு உண்மையற்றவர்களாக நடக்கவில்லை என்றும் கூறும் குறிப்பிட்ட உடன்படிக்கை விசுவாசக் கூற்றாக மொழிபெயர்க்கப்பட்டுள்ளது.
  alternative: கடவுளுக்கு முன் முற்றிலும் பாவமற்றவர்கள் என்ற விரிவான கூற்றாகப் புரிந்துகொள்ளுதல்.
  rationale: எபிரேய உரை மறத்தலையும் உடன்படிக்கையில் பொய்மையாக நடப்பதையும் மட்டுமே மறுக்கிறது. ஆகவே அதன் இறையியல் பதற்றத்தைக் காத்து, முழுமையான பாவமின்மை என்ற கூடுதல் கருத்து சேர்க்கப்படவில்லை.
translation_notes:
  register: நவீனத் தரத் தமிழில் எளிமையும் கண்ணியமும் காக்கப்பட்டுள்ளன. கடவுளை நேரடியாக அழைக்கும் இடத்தில் ‘உம்மை/உமது’ பயன்படுத்தப்பட்டுள்ளது. அரைப்புள்ளிகள் எபிரேய வரியின் இணைநிலை அமைப்பையும் கருத்து நகர்வையும் தெளிவாக்குகின்றன.
