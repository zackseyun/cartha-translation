lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: இசைத் தலைவருக்கு
  rationale: சங்கீதத் தலைப்புகளில் இச்சொல் இசை நிகழ்த்தலை வழிநடத்தும் தலைவருடனான தொடர்பைக் குறிக்கிறது. ‘இசைத் தலைவர்’ என்பது இயல்பான நவீனத் தமிழில் அதன் வழிபாட்டு இசைச் செயல்பாட்டைத் தேவையின்றி குறுக்காமல் தெரிவிக்கிறது; ל முன்னிடைச்சொல்லின் நோக்கு அல்லது ஒப்படைப்பு நுணுக்கத்தை ‘-க்கு’ காக்கிறது.
- source_word: לִבְנֵי
  choice: மகன்களுக்குரியது
  rationale: சங்கீதத் தலைப்புகளில் ל என்பது உரிமை, தொடர்பு, ஒப்படைப்பு அல்லது இயற்றியவர் என்பதைக் குறிக்கக்கூடும். ‘மகன்களுக்குரியது’ என்பது இவர்களே இயற்றினார்கள் அல்லது இவர்களுக்காகவே இயற்றப்பட்டது என்று முடிவுகட்டாமல் தொடர்பைத் தக்கவைக்கிறது.
- source_word: קֹרַח
  choice: கோராகு
  rationale: எபிரெயத் தனிப்பெயர் நவீனத் தமிழின் நிலையான வேதாகமப் பெயர்வடிவத்துக்கு ஏற்றபடி ஒலிபெயர்க்கப்பட்டுள்ளது; வேற்றுமை உருபுடன் ‘கோராகின்’ என வருகிறது.
- source_word: מַשְׂכִּיל
  choice: மஸ்கீல்
  rationale: இது சங்கீதத் தலைப்புகளில் வரும், துல்லியமான பொருள் உறுதியாகத் தெரியாத இலக்கிய அல்லது இசைவகைக் குறிப்பு. ‘போதனைச் சங்கீதம்’ அல்லது ‘தியானப் பாடல்’ என்று பொருளைத் தீர்மானிக்காமல் எபிரெயச் சொல்லை ஒலிபெயர்ப்பது அதன் தெளிவின்மையைப் பாதுகாக்கிறது.
