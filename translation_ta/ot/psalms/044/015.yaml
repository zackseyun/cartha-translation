  yaml_path: translation/ot/psalms/044/015.yaml
  text: All day long my disgrace is before me[a], and the shame of my face has covered me.
translation:
  language: ta
  text: நாளெல்லாம் என் அவமானம் என் கண்முன் இருக்கிறது; என் முகத்தின் வெட்கம் என்னை மூடியிருக்கிறது.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “என் முகத்திலுள்ள வெட்கம் என்னை மூடியிருக்கிறது.” எபிரெய மொழியில் சொல்லுக்குச் சொல், “என் முகத்தின் வெட்கம் என்னை மூடியிருக்கிறது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: நாளெல்லாம்
  rationale: நாள் முழுவதும் தொடரும் நிலையைக் குறிக்கும் எபிரெயச் சொற்றொடரை இயல்பான நவீனத் தமிழில் durative force உடன் வழங்குகிறது.
- source_word: כְּלִמָּתִי
  choice: என் அவமானம்
  rationale: பொதுவெளியில் ஏற்படும் இழிவையும் மதிப்பிழப்பையும் குறிக்கிறது; அடுத்துள்ள בֹשֶׁת என்பதற்கான ‘வெட்கம்’ என்பதிலிருந்து சொற்பொருள் வேறுபாட்டையும் காக்கிறது.
- source_word: נֶגְדִּי
  choice: என் கண்முன் இருக்கிறது
  rationale: பேசுகிறவரின் முன்னிலையில் அல்லது பார்வைக்கு முன்பாக இருப்பது என்ற உருவகத்தை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
- source_word: וּבֹשֶׁת
  choice: வெட்கம்
  rationale: இணையான இரண்டாம் கூறில் உள்ள உள்ளார்ந்த நாணம் அல்லது வெட்க உணர்வை நேரடியாக வழங்குகிறது.
- source_word: פָּנַי
  choice: என் முகத்தின்
  rationale: ‘என் முகத்தின் வெட்கம்’ என்ற எபிரெய மூலத்தின் உரிமைத் தொடர்பையும் அதன் சற்றே திறந்த உருவகத்தையும் காக்கிறது.
- source_word: כִּסָּתְנִי
  choice: என்னை மூடியிருக்கிறது
  rationale: כסה என்பதன் அடிப்படை ‘மூடு’ என்ற உருவகத்தைத் தக்கவைத்து, முடிந்த செயலில் இருந்து தொடரும் தற்போதைய நிலையைத் தமிழில் இயல்பாகக் காட்டுகிறது.
