  text: אַתָּ֤ה יָדְ/ךָ֡ גּוֹיִ֣ם ה֭וֹרַשְׁתָּ וַ/תִּטָּעֵ֑/ם תָּרַ֥ע לְ֝אֻמִּ֗ים וַֽ/תְּשַׁלְּחֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/002.yaml
  text: You[a], by your hand, drove out nations and planted them; you afflicted peoples and sent them out.
translation:
  language: ta
  text: நீரே உமது கையால் பிற இனத்தாரைத் துரத்திவிட்டு, இவர்களை நாட்டினீர்; மக்களினங்களுக்குத் தீங்கு செய்து, அவர்களை வெளியேற்றினீர்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “மக்களினங்களுக்குத் தீங்கு செய்து, இவர்களைப் பரவச் செய்தீர்.” இவ்வாசிப்பில் இறுதிப் பன்மைச் சுட்டு மக்களினங்களைக் குறிக்காமல் இஸ்ரவேலின் முன்னோர்களைக் குறிக்கிறது.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדְךָ
  choice: உமது கையால்
  rationale: இங்கு ‘கை’ என்பது தேவனுடைய வல்லமையையும் செயலாற்றலையும் கருவிப் பொருளில் குறிக்கிறது; மூலத்தின் உருவகத்தையும் தமிழின் இயல்பான சொல்லாட்சியையும் காக்கிறது.
- source_word: גּוֹיִם
  choice: பிற இனத்தார்
  rationale: நிலத்தில் வாழ்ந்த இஸ்ரவேல் அல்லாத தேசிய இனக்குழுக்களை இச்சூழலில் குறிக்கிறது; பிற்கால சமயப் பொருளுள்ள சொற்களைத் தவிர்க்கிறது.
- source_word: הוֹרַשְׁתָּ
  choice: துரத்திவிட்டு
  rationale: ஹிஃபில் வடிவம் உடைமையை இழக்கச் செய்து வெளியேற்றுவதைக் குறிக்கிறது; வெற்றிகொள்ளும் சூழலில் இயல்பான தமிழாக்கம்.
- source_word: וַתִּטָּעֵם
  choice: இவர்களை நாட்டினீர்
  rationale: ‘நடுதல்’ என்ற வேளாண்மை உருவகத்தை ‘நாட்டுதல்’ காக்கிறது. ‘இவர்கள்’ என்பது சூழலில் புரிந்துகொள்ளப்படும் இஸ்ரவேலின் முன்னோர்களைச் சுட்டுகிறது; மூலத்தில் வெளிப்படையாக இல்லாத பெயரை உரைக்குள் சேர்க்கவில்லை.
- source_word: תָּרַע
  choice: தீங்கு செய்து
  rationale: רעע என்பதன் ஹிஃபில் வடிவம் தீமை அல்லது கேடு விளைவித்தலைக் குறிக்கலாம்; துன்பத்தின் முறையைத் தேவையின்றி குறிப்பாக்காமல் பொருளைத் தருகிறது.
- source_word: לְאֻמִּים
  choice: மக்களினங்கள்
  rationale: גּוֹיִם என்பதோடு பொருள் ஒத்திருந்தாலும் எபிரெயக் கவிதையின் சொல் வேறுபாட்டைத் தமிழிலும் ஓரளவு காக்கிறது.
- source_word: וַתְּשַׁלְּחֵם
  choice: அவர்களை வெளியேற்றினீர்
  rationale: שלח என்பதன் அடிப்படை ‘அனுப்புதல்’; இச்சூழலில் மக்களை நாட்டிலிருந்து அனுப்பிவிடும் கருத்தை இயல்பாகவும், தேவையற்ற ‘சிதறடித்தல்’ என்ற விரிவாக்கமின்றியும் தருகிறது.
theological_decisions:
- issue: ‘நாட்டினீர்’ மற்றும் ‘வெளியேற்றினீர்’ என்பவற்றிலுள்ள பன்மைச் சுட்டுகளின் குறிப்பு
  choice: முதல் சுட்டு இஸ்ரவேலின் முன்னோர்களையும், இறுதிச் சுட்டு அந்நிய மக்களினங்களையும் குறிக்கிறது.
  alternative: இறுதிச் சுட்டும் இஸ்ரவேலின் முன்னோர்களைக் குறிக்கலாம்; அப்போது தேவன் அவர்களைப் பரவச் செய்தார் என்பது பொருள்.
  rationale: சுற்றியுள்ள பாடல் சூழல் தேவன் பிற இனத்தாரைத் துரத்தி இஸ்ரவேலை நாட்டியதைப் போற்றுகிறது. இரண்டாம் அரையடியில் மக்களினங்களுக்குச் செய்யப்பட்ட தீங்கைத் தொடர்ந்து அவர்கள் வெளியேற்றப்பட்டதாக வாசிப்பது இணைப்புக்கு ஏற்றது. எனினும் எபிரெயப் பன்மை விகுதியின் குறிப்பு இலக்கணரீதியாகத் தெளிவாக நிர்ணயிக்கப்படாததால் மாற்று வாசிப்பு அடிக்குறிப்பில் காக்கப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் கண்ணியமான இறைமுகப்பு நடை பயன்படுத்தப்பட்டுள்ளது. ‘அவர்களைத் துரத்திவிட்டு, இவர்களை நாட்டினீர்’ என்ற சுட்டுப்பெயர் மாற்றம் இரு மக்கள் குழுக்களுக்கிடையிலான கவிதை எதிர்மறையைத் தெளிவாக்குகிறது; அதேவேளை மூலத்தில் சொல்லப்படாத ‘எங்கள் முன்னோர்’ என்பதை உரைக்குள் வெளிப்படையாகச் சேர்ப்பதைத் தவிர்க்கிறது.
