  yaml_path: translation/ot/psalms/044/003.yaml
  text: For they did not possess the land by their sword[a], and their arm did not save them; but your right hand, your arm, and the light of your face did[b], because you delighted in them.
translation:
  language: ta
  text: 'ஏனெனில், அவர்கள் தங்கள் வாளால் அந்த நாட்டைக் கைப்பற்றவில்லை;

    அவர்களுடைய புயம் அவர்களைக் காப்பாற்றவில்லை.

    மாறாக,

    அந்த நாட்டை அவர்களுக்குக் கிடைக்கச் செய்ததும்,

    அவர்களைக் காப்பாற்றியதும்,

    உமது வலக்கரமும் உமது புயமும்

    உமது முகத்தின் ஒளியுமே ஆகும்;

    ஏனெனில், நீர் அவர்கள்மேல் பிரியமாயிருந்தீர்.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: கைப்பற்றவில்லை
  rationale: இங்கு வாக்களிக்கப்பட்ட நாட்டை அடைந்து உடைமையாக்கிக்கொள்ளும் வரலாற்றுச் சூழல் உள்ளது. ‘கைப்பற்றுதல்’ என்பது வெறும் வாரிசுரிமையைக் காட்டாமல், நாட்டைத் தமதாக்கிக்கொண்ட செயலை இயல்பான தமிழில் தருகிறது.
- source_word: אָרֶץ
  choice: அந்த நாடு
  rationale: இது பொதுவாகப் பூமியைக் குறிக்காமல், முந்தைய சூழலில் குறிப்பிடப்படும் குறிப்பிட்ட நாட்டைக் குறிக்கிறது.
- source_word: זְרוֹעָם / זְרוֹעֲךָ
  choice: அவர்களுடைய புயம் / உமது புயம்
  rationale: மனித வலிமையையும் இறைவனின் வல்லமையுள்ள செயலையும் எதிரெதிராக நிறுத்தும் உடல் உறுப்புச் சித்திரத்தைத் தக்கவைக்க ‘புயம்’ பயன்படுத்தப்பட்டது.
- source_word: הוֹשִׁיעָה לָּמוֹ
  choice: அவர்களைக் காப்பாற்றவில்லை
  rationale: ישׁע என்பதன் அடிப்படை ‘காப்பாற்று/விடுவி’ என்ற பொருளைத் தக்கவைத்து, போர்ச் சூழலுக்கும் பொருந்துமாறு மொழிபெயர்க்கப்பட்டது.
- source_word: יְמִינְךָ
  choice: உமது வலக்கரம்
  rationale: இறைவனின் வல்லமையுள்ள செயலைக் குறிக்கும் எபிரெய உருவகமும் வேதாகமச் சொல்லாட்சியும் பாதுகாக்கப்படுகின்றன.
- source_word: אוֹר פָּנֶיךָ
  choice: உமது முகத்தின் ஒளி
  rationale: இறை அருளையும் பிரசன்னத்தையும் உணர்த்தும் செறிவான மூல உருவகம் விளக்கமாக மாற்றப்படாமல் நேரடியாகத் தக்கவைக்கப்பட்டது.
- source_word: רְצִיתָם
  choice: நீர் அவர்களில் பிரியம் கொண்டீர்
  rationale: இந்தச் சொல் வெளிப்படுத்தும் இறை விருப்பம், மனமகிழ்ச்சி, சாதகமான அருள் ஆகியவற்றை தனிப்பட்ட உறவுச் சொல்லாட்சியில் தருகிறது.
- source_word: כִּי ... כִּי
  choice: ஏனெனில் ... ஏனெனில்
  rationale: முதல் இணைப்புச் சொல் முந்தைய கூற்றுக்கான விளக்கத்தையும், கடைசியது இறைச் செயலுக்கான காரணத்தையும் அறிமுகப்படுத்துகிறது; தமிழில் மீளுரைத்தல் கவிதை ஓட்டத்துடன் இயல்பாக உள்ளது.
theological_decisions:
- issue: இறைச் செயலுக்கும் மனிதப் படை வலிமைக்கும் இடையிலான எதிர்மறை ஒப்புமை
  choice: நாட்டைக் கைப்பற்றியதும் காப்பாற்றப்பட்டதும் அவர்களுடைய வாளாலோ புயத்தாலோ அல்ல, இறைவனின் வலக்கரம், புயம், முகத்தின் ஒளி ஆகியவற்றாலே நிகழ்ந்தது எனத் தெளிவாகக் காட்டப்பட்டது.
  alternative: இறைவனைச் சார்ந்திருப்பதைக் குறித்த பொதுவான கூற்றாக விரிவாக்குதல்.
  rationale: மூல எபிரெயம் ‘அவர்களுடைய வாள்/புயம்’ என்பவற்றை ‘உமது வலக்கரம்/புயம்/முகத்தின் ஒளி’ என்பவற்றோடு நேரடியாக எதிர்நிறுத்துகிறது; அதற்கு அப்பாற்பட்ட கோட்பாட்டு விரிவாக்கம் சேர்க்கப்படவில்லை.
- issue: אוֹר פָּנֶיךָ என்பதில் அருள் மற்றும் பிரசன்னத்தின் உருவகம்
  choice: முதன்மை உரையில் ‘உமது முகத்தின் ஒளி’ என உருவகம் பாதுகாக்கப்பட்டது.
  alternative: ‘உமது பிரசன்னத்தின் ஒளி’ அல்லது ‘உமது அருள்’.
  rationale: இச்சொற்றொடர் இறை அருளை உணர்த்தினாலும், மூலத்தின் முகம்-ஒளி உருவகம் பலவகை நுண்பொருளைக் கொண்டுள்ளது; ஆகவே அதை ஒரே விளக்கப் பொருளாகச் சுருக்கவில்லை.
- issue: வினைச்சொல் விடுபட்ட நேர்மறைக் கூறு
  choice: முந்தைய இரண்டு செயல்களையும் சுட்டும் வகையில் ‘அவற்றைச் செய்தன’ என்று மறைந்துள்ள வினை வெளிப்படுத்தப்பட்டது.
  alternative: ‘உமது வலக்கரமும்... முகத்தின் ஒளியுமே’ என்று வினையின்றி விடுதல் அல்லது முழு வாக்கியத்தை மறுசீரமைத்தல்.
  rationale: எபிரெயக் கவிதையின் சுருக்கத்தைப் பேணியபடியே, நவீன தமிழில் வாக்கியத் தொடர்பைத் தெளிவாக்குகிறது; ‘அவற்றை’ என்பது நாட்டைக் கைப்பற்றுதலையும் காப்பாற்றுதலையும் ஒருங்கே பின்னோக்கிச் சுட்டுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், சங்கீதக் கவிதைக்கு ஏற்ற கண்ணியமான நடையைப் பயன்படுத்துகிறது. இறைவனை நோக்கிய உரையில் ‘உமது/நீர்’ என்ற மரியாதை வடிவங்களும், கவித்துவ உருவகத்தைப் பேண ‘புயம்’, ‘முகத்தின் ஒளி’ என்பவையும் பயன்படுத்தப்பட்டுள்ளன. தேவையற்ற சமயப்பிரிவுச் சொல்லாட்சி தவிர்க்கப்பட்டுள்ளது.
