source:
  edition: WLC
  text: הֲ/לֹ֣א אֱ֭לֹהִים יַֽחֲקָר זֹ֑את כִּֽי ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/021.yaml
  text: Would not God search this out? For he knows the hidden things of the heart[a].
translation:
  language: ta
  text: தேவன் இதை ஆராயாமல் இருப்பாரா? ஏனெனில், இதயத்தின் மறைவான காரியங்களை[a] அவர் அறிந்திருக்கிறார்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “இதயத்தின் இரகசியங்களை.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: ஆராயாமல் இருப்பாரா?
  rationale: ஆம் என்ற பதிலை எதிர்பார்க்கும் எபிரெய மறுப்புக் கேள்வியின் வலிமையை இயல்பான நவீனத் தமிழில் தக்கவைக்கிறது.
- source_word: אֱלֹהִים
  choice: தேவன்
  rationale: இங்கு இஸ்ரவேலின் ஒரே தேவனைக் குறிக்கும் ஒருமைப் பயன்பாடு; தமிழில் இயல்பான வேதாகமப் பெயர்ப்பு.
- source_word: יַחֲקָר
  choice: ஆராய
  rationale: முழுமையாகத் தேடி விசாரித்தல் அல்லது சோதித்தறிதல் என்ற பொருளைச் சுருக்கமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது.
- source_word: זֹאת
  choice: இதை
  rationale: முந்தைய சூழலில் கூறப்பட்ட காரியத்தைச் சுட்டும் எபிரெய demonstrative-இன் சுருக்கத்தைப் பேணுகிறது.
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய மறுப்புக் கேள்விக்கான காரணத்தை அறிமுகப்படுத்தும் விளக்கத் தொடர்பைத் தெளிவாகக் காட்டுகிறது.
- source_word: יֹדֵעַ
  choice: அறிந்திருக்கிறார்
  rationale: தேவனின் நிலையான அறிவை இயல்பான தமிழில் காட்டுகிறது; சூழலில் வெறும் தகவலறிவை விட உள்ளார்ந்த அறிதலையும் ஏற்கிறது.
- source_word: תַּעֲלֻמוֹת
  choice: மறைவானவற்றை
  rationale: மறைக்கப்பட்டவை அல்லது இரகசியங்கள் என்ற பன்மைப் பொருளை மூலத்திற்கு நெருக்கமாகப் பேணுகிறது.
- source_word: לֵב
  choice: இதயத்தின்
  rationale: சிந்தனை, நோக்கம், விருப்பம், உணர்வு ஆகியவற்றை உள்ளடக்கும் எபிரெய மனிதவியல் உருவகத்தைச் சுருக்காமல் தக்கவைக்கிறது.
theological_decisions:
- issue: לֵב என்ற மனிதவியல் சொல்
  choice: இதயம்
  alternative: மனம் / உள்ளம்
  rationale: மூலச்சொல் அறிவு, சித்தம், உணர்வு ஆகிய அனைத்தையும் உள்ளடக்குகிறது. 'இதயம்' என்ற வேதாகம உருவகம் அந்தப் பரப்பைத் திறந்தவாறு வைத்திருக்கிறது; 'மனம்' என்று மொழிபெயர்ப்பது அறிவுசார் அம்சத்துக்குள் பொருளைக் குறுக்கக்கூடும்.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், ஆனால் கண்ணியமான நடை. மறுப்புக் கேள்வியின் சொல்லாற்றலும் 'இதயம்' என்ற வேதாகம உருவகமும் பேணப்பட்டுள்ளன.
