    issue: The verb “மிதித்துப்போடுவோம்” is stronger and more specific than the source.
    rationale: The Hebrew נָבוּס means “we trample/tread down.” The added “-ப்போடுவோம்” can imply casting away or disposing of someone, an element not expressed in the Hebrew.
