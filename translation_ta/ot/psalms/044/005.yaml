source:
  edition: WLC
  text: בְּ֭/ךָ צָרֵ֣י/נוּ נְנַגֵּ֑חַ בְּ֝/שִׁמְ/ךָ֗ נָב֥וּס קָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/005.yaml
  text: Through you we push back our foes[b][a]; through your name we trample those who rise against us.
translation:
  language: ta
  text: உம்மால் எங்கள் பகைவர்களைப் பின்னுக்குத் தள்ளுவோம்[a]; உமது பெயரால்[b] எங்களுக்கு எதிராக எழுகிறவர்களை மிதிப்போம்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: எபிரெய வினைச்சொல்லின் நேர்ப்பொருள் ‘கொம்பால் முட்டுவோம்/குத்துவோம்’ என்பதாகும்; இங்கு பகைவர்களை வலிமையாகப் பின்னுக்குத் தள்ளுவதற்கான உருவகம்.
    reason: lexical_alternative
  - marker: b
    text: ‘உமது பெயரில்’ என்றும் மொழிபெயர்க்கலாம். இங்கு ‘பெயர்’ என்பது கடவுளின் வெளிப்படுத்தப்பட்ட தன்மை, அதிகாரம், வல்லமை ஆகியவற்றைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: உம்மால்
  rationale: இங்குள்ள בְּ கருவி அல்லது செயலாற்றும் வழியைக் குறிக்கிறது. வெற்றி கடவுளால் கிடைக்கிறது என்பதை இயல்பான தமிழில் இது தெளிவாகக் காட்டுகிறது.
- source_word: צָרֵינוּ
  choice: எங்கள் பகைவர்களை
  rationale: צָרֵינוּ என்பது தீவிரமாக எதிர்க்கும் விரோதிகளைக் குறிக்கிறது; ‘பகைவர்கள்’ என்பது நவீனத் தமிழில் நேரடியும் இயல்புமான சொல்.
- source_word: נְנַגֵּחַ
  choice: பின்னுக்குத் தள்ளுவோம்
  rationale: נגח என்பதன் நேர்ப்பொருள் கொம்பால் முட்டுதல் அல்லது குத்துதல்; இங்கு பகைவர்களை வலிமையாக விரட்டியடிக்கும் போர் உருவகமாக வருகிறது. ‘பின்னுக்குத் தள்ளுவோம்’ அந்த இயக்கத்தையும் வலிமையையும் வாசிக்க எளிதாக வெளிப்படுத்துகிறது.
- source_word: בְּשִׁמְךָ
  choice: உமது பெயரால்
  rationale: இங்குள்ள ‘பெயர்’ கடவுளின் வெளிப்படுத்தப்பட்ட தன்மை, அதிகாரம், வல்லமை ஆகியவற்றைக் குறிக்கிறது. ‘பெயரால்’ என்பது எபிரெய இணைப்பையும் முதல் அடியின் கருவிப்பொருளையும் காக்கிறது.
- source_word: נָבוּס
  choice: மிதித்துப்போடுவோம்
  rationale: בוס என்பது காலால் மிதித்தல் அல்லது மிதித்து அடக்குதல். ‘மிதித்துப்போடுவோம்’ போர் உருவகத்தின் தீவிரத்தைக் காக்கும் இயல்பான தமிழ் நடை.
- source_word: קָמֵינוּ
  choice: எங்களுக்கு எதிராக எழுகிறவர்களை
  rationale: קום வேரிலிருந்து வந்த இச்சொல், எதிர்த்து எழுபவர்களைக் குறிக்கிறது. பெயர்ச்சொல்லாகப் பொதுமைப்படுத்தாமல் அதன் செயற்பாட்டு நிழலை இந்தத் தொடர் காக்கிறது.
theological_decisions:
- issue: போரில் கிடைக்கும் வெற்றியின் செயலாற்றும் மூலம்
  choice: இஸ்ரவேலர் செயல்படுவதாகக் கூறப்பட்டாலும், ‘உம்மால் ... உமது பெயரால்’ என்ற இணைத் தொடர்கள் கடவுளையே வெற்றியின் தீர்மானகரமான மூலமாகக் காட்டுகின்றன.
  alternative: மனிதப் படைச்செயலை முன்னிறுத்துவது, அல்லது ‘பெயர்’ என்பதை மந்திரவாதச் சூத்திரமாகப் புரிந்துகொள்வது.
  rationale: மூலத்தின் இணையான முன்னிடைச்சொல் தொடர்கள் தெய்வீகச் செயலாற்றலையும் மனிதப் பங்கேற்பையும் ஒன்றை மற்றொன்றில் கரைக்காமல் இணைத்துக் காட்டுகின்றன.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்கேற்ற கண்ணியமான கவிநடையுடன் மொழிபெயர்க்கப்பட்டுள்ளது. கடவுளை நோக்கும் மரியாதைப் பன்மை (‘உம்மால்’, ‘உமது’) பயன்படுத்தப்பட்டுள்ளது; போர் உருவகத்தின் வலிமையும் எபிரெய இணை அமைப்பும் காக்கப்பட்டுள்ளன.
