  - marker: b
    text: அல்லது, “புழுதிவரை குனிந்துவிட்டது.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சூழலில் அடுத்த வேண்டுதலுக்கான காரணத்தை அறிமுகப்படுத்துவதால், காரணப் பொருளை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: שָׁחָה
  choice: தாழ்ந்துவிட்டது
  rationale: குனிதல் அல்லது மிகவும் கீழிறங்குதல் என்ற பொருள் இரண்டையும் ஏற்கும் சொல்லாக இது உள்ளது; புழுதிவரை என்ற உருவகத்துடன் இயல்பாக அமைகிறது.
- source_word: לֶעָפָר
  choice: புழுதிவரை
  rationale: עָפָר என்பதன் புழுதி என்ற அடிப்படைப் படிமத்தையும், மிகத் தாழ்ந்த நிலைக்குச் சென்ற இயக்கத்தையும் காக்கிறது.
- source_word: נַפְשֵׁנוּ
  choice: எங்கள் உயிர்
  rationale: נֶפֶשׁ இங்கு உயிர், ஆத்துமா, நாமே என்ற பொருள் வரம்பைக் கொண்டது. நவீன தமிழில் மனிதரின் உயிர்நிலையையும் முழு சுயத்தையும் சுட்டக்கூடிய ‘உயிர்’ இயல்பானது; மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: דָּבְקָה
  choice: ஒட்டிக்கிடக்கிறது
  rationale: நிலத்தோடு நெருக்கமாக ஒட்டியிருக்கும் தீவிரமான உடல் படிமத்தை நவீன தமிழில் தெளிவாக வெளிப்படுத்துகிறது.
- source_word: לָאָרֶץ
  choice: தரையோடு
  rationale: புழுதிக்கு இணையான கவிதைச் சூழலில் אֶרֶץ என்பது இங்கு உடல் படிந்திருக்கும் தரையைக் குறிக்கிறது.
- source_word: בִּטְנֵנוּ
  choice: எங்கள் வயிறு
  rationale: בֶּטֶן என்பதன் நேரடியான உடற்கூறு படிமத்தைப் பாதுகாக்கிறது; ‘உடல்’ என்று மென்மையாக்குவதைத் தவிர்க்கிறது.
theological_decisions:
- issue: נַפְשֵׁנוּ என்பதன் மனித இயல்பியல் பொருள்
  choice: எங்கள் உயிர்
  alternative: எங்கள் ஆத்துமா; நாங்களே
  rationale: எபிரெயச் சொல் உயிர், ஆத்துமா, சுயம் ஆகிய பொருள்களை ஏற்கக்கூடும். ‘உயிர்’ என்பது தமிழில் இயல்பாகவும் கவிதைநயத்துடனும் இருந்து, இங்கு உடலிலிருந்து பிரிந்த ஓர் அம்சத்தை மட்டும் கட்டாயப்படுத்தாது; உண்மையான பொருள் விரிவை அடிக்குறிப்பு காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், புலம்பல் சங்கீதத்துக்குரிய கண்ணியமான கவிதை நடையைப் பேணுகிறது. ‘புழுதி,’ ‘வயிறு,’ ‘தரை’ என்ற எபிரெய உடல் சார்ந்த உருவகங்கள் மென்மையாக்கப்படாமல் பாதுகாக்கப்பட்டுள்ளன.
