  text: For our soul has sunk down to the dust[b][a]; our belly clings to the earth.
translation:
  language: ta
  text: ஏனெனில், எங்கள் உயிர்[a] புழுதிவரைத் தாழ்ந்துவிட்டது[b]; எங்கள் வயிறு தரையோடு ஒட்டிக்கிடக்கிறது.
  philosophy: optimal-equivalence
