lexical_decisions:
- source_word: תְּשִׁיבֵנוּ
  choice: எங்களைப் பின்வாங்கச் செய்கிறீர்
  rationale: שוב என்பதன் ஹிஃபில் வடிவம் காரணவினைப் பொருளில் ‘திரும்பச் செய்தல்’ என வருகிறது; போர்ச் சூழலில் இயல்பான தமிழாக ‘பின்வாங்கச் செய்கிறீர்’ என்பது கட்டாயத் தோல்வியோட்டத்தை உணர்த்துகிறது.
- source_word: אָחוֹר
  choice: பின்வாங்க
  rationale: ‘பின்னால்/பின்புறமாக’ என்ற வினையடைப் பொருள், தமிழ் போர்ச் சூழலில் ‘பின்வாங்க’ என்ற வினைத் தொகுப்பில் இயல்பாக வெளிப்படுகிறது.
- source_word: מִנִּי צָר
  choice: எதிரியின் முன்பிருந்து
  rationale: מן என்பது எதிரியிடமிருந்து விலகுதலைக் குறிக்கலாம்; அதேவேளை ‘எதிரியின் முன்னிலையில்/முன்பிருந்து’ என்ற போர்க்களப் படிமத்தையும் எபிரெயம் அனுமதிக்கிறது. பிரதான உரை இந்த நுணுக்கத்தைத் தக்கவைக்கிறது.
- source_word: מְשַׂנְאֵינוּ
  choice: எங்களை வெறுப்பவர்கள்
  rationale: பங்கேற்புவினை வடிவத்தின் செயற்பாட்டு விரோதத்தைப் பாதுகாக்கிறது; இதை வெறுமனே ‘எங்கள் எதிரிகள்’ என்று மாற்றவில்லை.
- source_word: שָׁסוּ
  choice: கொள்ளையிடுகிறார்கள்
  rationale: இந்த வினை போரில் கொள்ளைப் பொருளைப் பறித்தலைக் குறிக்கிறது. புலம்பலின் உயிரோட்டமான சித்தரிப்பை நிகழ்காலத் தமிழ் வழங்குகிறது; நிறைவுற்ற செயலைக் குறிக்கும் மாற்று அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָמוֹ
  choice: தங்களுக்காக
  rationale: இங்கு தங்களுடைய பயனுக்காகக் கொள்ளையிடுகிறார்கள் என்ற நன்மைப் பொருள் கொண்ட வேற்றுமை உறவை இயல்பான தமிழில் வெளிப்படுத்துகிறது.
theological_decisions:
- issue: தோல்விக்குக் கடவுளே காரணராகச் சித்தரிக்கப்படுதல்
  choice: ‘பின்வாங்கச் செய்கிறீர்’ என்ற நேரடி காரணவினைத் தொடரைத் தக்கவைத்தல்
  alternative: ‘நாங்கள் பின்வாங்கும்படி விடுகிறீர்’ என்று காரணத் தொடர்பை மென்மைப்படுத்துதல்
  rationale: எபிரெய ஹிஃபில் வடிவம் கடவுளின் காரணச் செயலை நேரடியாகக் கூறுகிறது. சங்கீதத்தின் குற்றம்சாட்டும் புலம்பல் சார்ந்த இறையியல் பதற்றத்தை மொழிபெயர்ப்பு மென்மைப்படுத்தக் கூடாது.
translation_notes:
  register: நவீன, கண்ணியமான சங்கீத நடையில் மரியாதைப் பன்மை வினைமுற்று பயன்படுத்தப்பட்டுள்ளது. ‘எதிரியின் முன்பிருந்து’ போர்க்களப் படிமத்தையும், ‘பின்வாங்கச் செய்கிறீர்’ எபிரெய காரணவினையின் வலிமையையும் காக்கின்றன. எல்லா அடிக்குறிப்பு குறிகளும் பிரதான உரையில் இடம்பெற்றுள்ளன.
