  language: ta
  text: எதிரியிடமிருந்து எங்களைப் பின்வாங்கச் செய்கிறீர்[a]; எங்களை வெறுப்பவர்கள் தங்களுக்காகக் கொள்ளையடிக்கிறார்கள்[b].
  philosophy: optimal-equivalence
