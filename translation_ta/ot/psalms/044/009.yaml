    reason: எபிரெய் בְּצִבְאוֹתֵינוּ என்பதில் உள்ள முன்னிடைச்சொல்லை ‘எங்கள் படைகளில்’ என அதிகச் சொற்பொருள் சார்ந்து மொழிபெயர்க்கலாம்; முதன்மை உரையில் இயல்பான உடனிணைவுப் பொருளான ‘எங்கள் படைகளோடு’ பயன்படுத்தப்பட்டுள்ளது.
lexical_decisions:
