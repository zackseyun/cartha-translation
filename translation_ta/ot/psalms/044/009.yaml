  rationale: יצא என்பதன் அடிப்படைப் பொருளான வெளியே செல்லுதல் என்பதையும், படைச் சூழலில் போருக்குப் புறப்படுதல் என்ற நுணுக்கத்தையும் இயல்பாகக் கொண்டுள்ளது.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: எங்கள் படைகளோடு
  rationale: צָבָא இங்கு இராணுவப் படைகளைக் குறிக்கிறது; בְּ என்பதை உடன்செல்லும் பொருளில் ‘-ஓடு’ என மொழிபெயர்ப்பது சூழலுக்கேற்ற தெளிவான தமிழாகும்.
theological_decisions:
- issue: போரில் கடவுள் உடன்செல்லாமல் விலகியிருப்பதாகச் சித்தரித்தல்
  choice: கடவுள் இஸ்ரவேலின் படைகளோடு போருக்குப் புறப்படுவதில்லை என்று புலம்பல் கூறுவதாக மொழிபெயர்க்கப்பட்டது.
  alternative: ‘எங்கள் படைகளில் நீர் புறப்படுவதில்லை’ என்ற அதிகச் சொற்பொருள் சார்ந்த வாசிப்பு.
  rationale: வசனம், கடவுளின் இராணுவ ஆதரவு விலகியதாகப் பாடகர் அனுபவிக்கும் உடன்படிக்கைசார் புலம்பலை வெளிப்படுத்துகிறது. அதன் காரணத்தையோ விரிவான கோட்பாட்டையோ மொழிபெயர்ப்பு சேர்க்கவில்லை; தெய்வீக விலகலின் இறையியல் பதற்றம் அப்படியே பேணப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதப் புலம்பலுக்கேற்ற கண்ணியமான நடையில் அமைக்கப்பட்டுள்ளது. கடவுளை நோக்கிய மரியாதைப் பன்மை ஒருமையாக ‘நீர்/நீர்…ினீர்’ பயன்படுத்தப்பட்டுள்ளது. ‘படைகளோடு’ என்பது இயல்பான தமிழ் மற்றும் எபிரெய் בְּ-யின் இச்சூழலிலான உடனிணைவு பொருளைத் தருகிறது.
