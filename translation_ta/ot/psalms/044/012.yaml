  alternative: தோல்விக்கு ஒப்புக்கொடுத்தீர் என்று மென்மைப்படுத்தல்
  rationale: எபிரெய மூலத்தின் குற்றம்சாட்டும் உருவகத்தையும் அதன் இறையியல் பதற்றத்தையும் விளக்கி மென்மைப்படுத்தாமல் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், கடவுளை நோக்கிய மரியாதைப் பன்மை வடிவங்கள் பயன்படுத்தப்பட்டுள்ளன. கவிதைப் புலம்பலின் நேரடித் தன்மையும் ‘விற்றல்/விலை/பெருக்குதல்’ என்ற வாணிக உருவகத் தொடரும் இயன்றவரை காக்கப்பட்டுள்ளன.
