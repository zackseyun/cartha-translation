translation:
  language: ta
  text: ஆதாயம் ஏதுமின்றி உமது மக்களை விற்கிறீர்[a]; அவர்களை விற்ற விலையால் உமக்கு ஆதாயம் பெருகவில்லை.
  philosophy: optimal-equivalence
