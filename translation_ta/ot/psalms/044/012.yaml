    text: அல்லது, “உமது மக்களை ஒன்றுமின்றி விற்றீர்; அவர்களை விற்ற விலையால் ஆதாயமடையவில்லை.”
    reason: תִּמְכֹּר என்பதற்கு சூழலின்படி இறந்தகாலமான ‘விற்றீர்’ என்பதும் சாத்தியம். בְלֹא הוֹן-ஐ ‘ஒன்றுமின்றி’ என்றும், רִבִּיתָ-ஐ ‘ஆதாயமடையவில்லை’ என்றும் பொருள்சார் வகையில் மொழிபெயர்க்கலாம்.
lexical_decisions:
- source_word: תִּמְכֹּר
  choice: விற்கிறீர்
  rationale: מכר என்பதன் Qal imperfect இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம்; கடவுளை நேரடியாக விளிக்கும் புலம்பலின் உடனடித் தன்மையை நிகழ்காலம் காக்கிறது. சூழலின்படி இறந்தகாலமும் சாத்தியம்.
- source_word: עַמְּךָ
  choice: உமது மக்களை
  rationale: עַם என்பது இங்கு கடவுளுடன் உறவுடைய உடன்படிக்கை மக்களைக் குறிக்கிறது; ‘மக்கள்’ அந்த உறவுச் சாயலை இயல்பாகக் காக்கிறது.
- source_word: בְלֹא הוֹן
  choice: ஆதாயம் ஏதுமின்றி
  rationale: הוֹן என்பதன் அடிப்படைப் பொருள் செல்வம் அல்லது உடைமை; விற்பனையால் மதிப்புள்ள வரவு எதுவும் கிடைக்கவில்லை என்பதே சூழலின் கருத்து. தமிழில் ‘ஆதாயம் ஏதுமின்றி’ இயல்பாகவும் துல்லியமாகவும் இதை வெளிப்படுத்துகிறது.
- source_word: וְלֹא רִבִּיתָ
  choice: உமது செல்வத்தைப் பெருக்கிக்கொள்ளவில்லை
  rationale: רבה என்பதன் Piel வடிவம் ‘பெருக்குதல்’ எனும் உருவகத்தை வைத்திருக்கிறது; இங்கு விடுபட்டுள்ள செல்வம்/ஆதாயம் என்னும் பொருளை தமிழில் தெளிவுக்காக வெளிப்படுத்தப்பட்டுள்ளது.
- source_word: בִּמְחִירֵיהֶם
  choice: அவர்களுக்குக் கிடைத்த விலையால்
  rationale: מְחִיר என்பது விலை அல்லது விற்பனை விலை. בְּ காரணம்/வழி என்ற உறவைச் சுட்டுவதால், ‘விலையால்’ நெருக்கமானதும் இயல்பானதும் ஆகும்.
theological_decisions:
- issue: கடவுள் தமது மக்களை ‘விற்பதாக’க் கூறும் துணிச்சலான புலம்பல் மொழி
