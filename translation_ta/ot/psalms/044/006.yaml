source:
  edition: WLC
  text: כִּ֤י לֹ֣א בְ/קַשְׁתִּ֣/י אֶבְטָ֑ח וְ֝/חַרְבִּ֗/י לֹ֣א תוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/006.yaml
  text: For I do not trust in my bow[b][a], and my sword does not save me.
translation:
  language: ta
  text: ஏனெனில், நான் என் வில்லில் நம்பிக்கை வைப்பதில்லை[a]; என் வாளும் என்னைக் காப்பாற்றுவதில்லை[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நான் என் வில்லில் நம்பிக்கை வைக்கமாட்டேன்.” எபிரெய முற்றுறா வினை எதிர்கால நுணுக்கத்துடனும் புரிந்துகொள்ளப்படலாம்.
    reason: lexical_alternative
  - marker: b
    text: “என்னைக் காப்பாற்றும்” என்பதை இந்தப் போர்ச் சூழலில் “எனக்கு வெற்றி அளிக்கும்” அல்லது “என்னை விடுவிக்கும்” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: சுற்றியுள்ள கூற்றிற்கான காரணத்தை அறிமுகப்படுத்துகிறது; கவிதையின் விளக்கத் தொடர்பை இயல்பான தமிழில் காக்கிறது.
- source_word: בְקַשְׁתִּי
  choice: என் வில்லில்
  rationale: קֶשֶׁת என்பது போர்க்கருவியான ‘வில்’; ב முன்னொட்டு בטח வினையுடன் சேர்ந்து ‘வில்லில் நம்பிக்கை வை’ என்ற பொருளைத் தருகிறது.
- source_word: אֶבְטָח
  choice: நான் ... நம்பிக்கை வைப்பதில்லை
  rationale: בטח என்பதன் அடிப்படைப் பொருள் ‘நம்பு, சார்ந்திரு’. இங்கு எபிரெய நிறைவுறா வினை பொதுவான நிகழ்கால மனப்பாங்கைக் குறிக்கலாம்; எதிர்கால நுணுக்கமும் சாத்தியம் என்பதால் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: וְחַרְבִּי
  choice: என் வாள்
  rationale: חֶרֶב மற்றும் முதலாம் நபர் ஒருமை உடைமை விகுதியின் நேரான மொழிபெயர்ப்பு; இணை அமைப்பு தமிழில் அரைப்புள்ளியால் இயல்பாகத் தொடர்கிறது.
- source_word: תוֹשִׁיעֵנִי
  choice: என்னைக் காப்பாற்றுவதுமில்லை
  rationale: ישׁע என்பதன் ஹிஃபில் வடிவம் ‘காப்பாற்று, விடுவி, வெற்றி அளி’ எனப் பொருள்படும். ‘காப்பாற்று’ அதன் விரிந்த பொருளையும் இறையியல் எதிரொலியையும் காக்கிறது.
theological_decisions:
- issue: போர்ச் சூழலில் விடுதலை மொழியின் பொருள்
  choice: ‘என்னைக் காப்பாற்றுவதுமில்லை’
  alternative: ‘எனக்கு வெற்றி அளிப்பதுமில்லை’ அல்லது ‘என்னை விடுவிப்பதுமில்லை’
  rationale: போர்ச் சூழலில் ‘வெற்றி அளி’ பொருத்தமானதாயினும், ‘காப்பாற்று’ எபிரெய வேர்ச்சொல்லின் விரிந்த பொருளைத் தக்கவைத்து, கருத்தை போர்க்கள வெற்றிக்கு மட்டும் குறுக்காமல் கடவுளைச் சார்ந்திருக்கும் கருப்பொருளைக் காக்கிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில் இயல்பான, கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘வில்—வாள்’ என்ற எபிரெய இணை அமைப்பும், மனிதப் போர்க்கருவிகளில் நம்பிக்கை வைக்காத கருத்தும் தெளிவாகப் பாதுகாக்கப்பட்டுள்ளன.
