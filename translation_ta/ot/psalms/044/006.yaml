  source_fidelity: The draft accurately conveys the causal כִּי, the first-person possessives, the paired bow and sword imagery, and the negated imperfects. “காப்பாற்று” appropriately preserves the broad sense of תוֹשִׁיעֵנִי while allowing the military-contextual nuance in a note.
