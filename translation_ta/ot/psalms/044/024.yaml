base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/024.yaml
  text: Why do you hide your face and forget our affliction and our oppression?[a]
translation:
  language: ta
  text: ஏன் உமது முகத்தை மறைத்துக்கொள்கிறீர்? எங்கள் துன்பத்தையும் எங்களுக்கு நேரும் ஒடுக்குதலையும் ஏன் மறந்துவிடுகிறீர்?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘உமது பிரசன்னத்தை.’ எபிரெயில் சொல்லுக்குச் சொல் ‘உமது முகத்தை’ என்று உள்ளது; இது சாதகமான கவனம் அல்லது அண்மையைக் குறிக்கும் பொதுவான சொற்றொடர்.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: ஏன்
  rationale: காரணத்தை வினவும் எபிரெயச் சொல்லின் இயல்பான நவீனத் தமிழ் இணை; புலம்பலின் நேரடியான தொனியைப் பேணுகிறது.
- source_word: פָנֶיךָ
  choice: உமது முகத்தை
  rationale: ‘உமது முகம்’ என்ற எபிரெய உருவகத்தை நேரடியாகப் பேணி, கடவுளின் சாதகமான கவனம் அல்லது அண்மையைக் குறிக்கும் கவித்துவ மொழியைத் தக்கவைக்கிறது.
- source_word: תַסְתִּיר
  choice: மறைத்துக்கொள்கிறீர்
  rationale: סתר என்பதன் இவ்விடத்திற்குரிய ‘மறை’ என்ற பொருளைத் தருகிறது; ‘முகத்தை மறைத்துக்கொள்’ என்பது தமிழிலும் புரிந்துகொள்ளத்தக்க உறவுசார் உருவகம்.
- source_word: תִּשְׁכַּח
  choice: மறந்துவிடுகிறீர்
  rationale: שׁכח என்பதன் நேரடிப் பொருளான ‘மற’ என்பதைப் பேணி, புறக்கணிப்பதாகக் குற்றஞ்சாட்டும் புலம்பலின் துணிச்சலை மெலிதாக்காமல் தருகிறது.
- source_word: עָנְיֵנוּ
  choice: எங்கள் துன்பத்தை
  rationale: துயரம், சிறுமை, வேதனை ஆகியவற்றை உள்ளடக்கும் சொல்லுக்கு இயல்பானதும் பரந்த பொருளுடையதுமான நவீனத் தமிழ் தெரிவு.
- source_word: וְלַחֲצֵנוּ
  choice: எங்கள் ஒடுக்குதலையும்
  rationale: לַחַץ குறிக்கும் வெளிப்புற அழுத்தம் அல்லது பகைவரால் உண்டாகும் ஒடுக்குதலைத் தெளிவாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: கடவுளைக் குறித்து ‘உமது முகம்’ எனும் மனித உருவக மொழி
  choice: ‘உமது முகத்தை’ என்ற உருவகத்தை முதன்மை உரையில் தக்கவைத்தல்
  alternative: ‘உமது பிரசன்னத்தை’ அல்லது ‘உமது கவனத்தை’
  rationale: மூல எபிரெயின் உடல்சார் உறவு உருவகத்தையும், கடவுளின் அண்மையும் சாதகமான கவனமும் மறைந்திருப்பதாகப் புலம்பும் இறையியல் பதற்றத்தையும் விளக்கிப் போக்காமல் பேணுகிறது.
- issue: ஒரே לָמָּה இரு இணை வினைகளுக்கும் பொருந்துதல்
  choice: இயல்பான தமிழுக்காக இரண்டாவது வாக்கியத்திலும் ‘ஏன்’ என்பதை வெளிப்படையாக மீண்டும் வழங்குதல்
  alternative: ‘ஏன் உமது முகத்தை மறைத்துக்கொண்டு, எங்கள் துன்பத்தையும் ஒடுக்குதலையும் மறந்துவிடுகிறீர்?’
  rationale: எபிரெயில் ஒருமுறை வரும் வினாச்சொல் இரு வினைகளையும் ஆளுகிறது; தமிழில் அதை மீண்டும் கூறுவது பொருளை மாற்றாமல் இணையான புலம்பல் அமைப்பைத் தெளிவாக்குகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான புலம்பல் நடையைப் பயன்படுத்துகிறது. கடவுளை நோக்கிய ஒருமை மரியாதை வடிவமான ‘உமது/மறைக்கிறீர்’ பேணப்பட்டுள்ளது; ‘முகம்’ என்ற மூல உருவகம் அடிக்குறிப்புடன் தக்கவைக்கப்பட்டுள்ளது.
