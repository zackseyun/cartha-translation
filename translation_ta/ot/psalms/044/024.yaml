  verdict: revise
  source_fidelity: 'The draft accurately represents the Hebrew lament: the interrogative governs both verbs, ‘your face’ is retained, and the paired nouns convey communal affliction and hostile pressure. Repeating ‘ஏன்’ is permissible in Tamil. However, ‘எங்கள் ஒடுக்குதல்’ can read as oppression exercised by us rather than oppression suffered by us; the revision makes the affected sense explicit.'
  naturalness: The address and lament register are natural modern standard Tamil. ‘மறைத்துக்கொள்கிறீர்’ is an idiomatic rendering of hiding one’s face. Clarifying the second noun phrase improves precision and readability without adding interpretive detail.
  terminology: ‘உமது முகம்,’ ‘துன்பம்,’ and ‘மறந்துவிடுகிறீர்’ preserve the Hebrew’s anthropomorphic and bold lament language. ‘எங்களுக்கு நேரும் ஒடுக்குதல்’ appropriately expresses לַחֲצֵנוּ as oppression/distress directed against the community.
  issues:
  - severity: medium
    issue: ‘எங்கள் ஒடுக்குதலையும்’ is syntactically and semantically ambiguous in Tamil.
    rationale: It may suggest ‘the oppression done by us’ rather than the oppression/pressure experienced by us. The Hebrew possessive denotes the community’s affliction under hostile pressure.
