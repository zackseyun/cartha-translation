  text: 'நாம் நம் கடவுளின் பெயரை மறந்து,

    அந்நிய தெய்வத்தை நோக்கி நம் கைகளை விரித்திருந்தால்—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘வேறான தெய்வத்தை நோக்கி’ என்றும் மொழிபெயர்க்கலாம். எபிரேயப் பெயரடை ‘அந்நியமான,’ ‘வேறான,’ அல்லது ‘அயலான’ என்ற பொருள்களைக் கொள்ளலாம்; இங்கு அது இஸ்ரவேலின் உடன்படிக்கை வழிபாட்டைச் சாராத ஒரு தெய்வத்தைக் குறிக்கிறது.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: -இருந்தால்
  rationale: நிபந்தனைப் பொருளைத் தமிழில் இயல்பாகத் தெரிவிக்க வினைமுற்றுடன் இணைக்கப்பட்டது.
- source_word: שָׁכַחְנוּ
  choice: நாம் ... மறந்து
  rationale: கடந்தகாலக் கற்பனை நிபந்தனையின் முதல் செயலைத் தமிழில் தொடரெச்சமாக வழங்குவது இயல்பானது; இறுதி வினைமுற்று நிபந்தனையை நிறைவு செய்கிறது.
- source_word: שֵׁם אֱלֹהֵינוּ
  choice: நம் கடவுளின் பெயரை
  rationale: எபிரேய உடைமைத் தொடரையும் ‘பெயர்’ என்ற முக்கியமான வேதாகமச் சொல்லையும் நேரடியாகப் பாதுகாக்கிறது.
- source_word: וַנִּפְרֹשׂ כַּפֵּינוּ
  choice: நம் கைகளை விரித்திருந்தால்
  rationale: மன்றாட்டு அல்லது வழிபாட்டில் கைகளை நீட்டி விரிக்கும் உருவகச் செயலை ‘வழிபட்டிருந்தால்’ என்று விளக்கிவிடாமல் அப்படியே தக்கவைக்கிறது.
- source_word: לְאֵל זָר
  choice: வேறொரு தெய்வத்தை நோக்கி
  rationale: לְ என்பதன் திசைநோக்குப் பொருளை ‘நோக்கி’ தெரிவிக்கிறது; זָר என்பதை உடன்படிக்கை வழிபாட்டுக்கு அயலான வேறொரு தெய்வம் என்ற சூழற்பொருளில் இயல்பான தமிழில் வழங்குகிறது.
