  yaml_path: translation/ot/psalms/044/007.yaml
  text: For you have saved us from our adversaries[a], and you have put those who hate us to shame.
translation:
  language: ta
  text: ஏனெனில், நீர் எங்கள் எதிரிகளிடமிருந்து எங்களை மீட்டீர்; எங்களை வெறுப்பவர்களை வெட்கமடையச் செய்தீர்.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ஏனெனில்
  rationale: முந்தைய வசனத்தில் கூறப்பட்ட நம்பிக்கைக்கும் பெருமிதத்திற்கும் காரணத்தை அறிமுகப்படுத்தும் எபிரெயச் சொல்லின் விளக்க-காரணப் பொருளை இயல்பான தமிழில் தருகிறது.
- source_word: הוֹשַׁעְתָּנוּ
  choice: நீரே ... எங்களை மீட்டீர்
  rationale: יָשַׁע என்பதன் ஹிஃபில் வடிவம் ‘மீட்பது, விடுவிப்பது’ என்று பொருள்படும். வினையில் உள்ள இரண்டாம் நபர் ஒருமைச் சுட்டுதலை ‘நீரே’ வலியுறுத்துகிறது; நிறைவுற்ற தெய்வீகச் செயலை ‘மீட்டீர்’ இயல்பாகத் தருகிறது.
- source_word: מִצָּרֵינוּ
  choice: எங்கள் எதிரிகளிடமிருந்து
  rationale: צַר என்பது பகைமையுடன் எதிர்த்து நெருக்குகிறவர்களைக் குறிக்கலாம். ‘எதிரிகள்’ என்பது ‘பகைவர்கள்’ என்பதைவிட சற்றுப் பரந்ததாக இருந்து, இங்கு உள்ள எதிர்ப்பின் கருத்தைத் தெளிவாகக் காக்கிறது.
- source_word: וּמְשַׂנְאֵינוּ
  choice: எங்களை வெறுப்பவர்களை
  rationale: שָׂנֵא என்பதன் பங்கேற்பு வடிவம் சொற்பட ‘எங்களை வெறுக்கிறவர்கள்’ எனப் பொருள்படும். ‘எங்களை வெறுப்பவர்கள்’ என்பது அந்தத் தொடர்ச்சியான தனிப்பட்ட பகைமையை இயல்பான தமிழில் நேரடியாகக் காக்கிறது.
- source_word: הֱבִישׁוֹתָ
  choice: வெட்கமடையச் செய்தீர்
  rationale: בּוֹשׁ என்பதன் ஹிஃபில் வடிவத்திலுள்ள காரணவினைப் பொருளை ‘வெட்கமடையச் செய்தீர்’ நேரடியாக வெளிப்படுத்துகிறது; தோல்வியால் நேரும் அவமானத்தையும் தேவையின்றி மிகைப்படுத்தாமல் சுட்டுகிறது.
