source:
  edition: WLC
  text: אֱלֹהִ֤ים בְּ/אָזְנֵ֬י/נוּ שָׁמַ֗עְנוּ אֲבוֹתֵ֥י/נוּ סִפְּרוּ לָ֑/נוּ פֹּ֥עַל פָּעַ֥לְתָּ בִֽ֝/ימֵי/הֶ֗ם בִּ֣/ימֵי קֶֽדֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/001.yaml
  text: God[a], we have heard with our ears; our fathers have told us the deed you did in their days[c][b], in days of old.
translation:
  language: ta
  text: 'தேவனே, எங்கள் காதுகளால் நாங்கள் கேட்டிருக்கிறோம்;

    எங்கள் தந்தையர்[a] எங்களுக்குச் சொல்லியிருக்கிறார்கள்—

    அவர்களுடைய நாட்களில், பண்டைய நாட்களில்,

    நீர் செய்த செயலை.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்கள் முன்னோர்.” எபிரெயத்தில் “எங்கள் தந்தையர்.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: தேவனே
  rationale: வசனத்தின் தொடக்கத்தில் இது நேரடி அழைப்பாக இருப்பதால், தமிழில் இயல்பாக விளிக்கும் ‘-ஏ’ உருபுடன் மொழிபெயர்க்கப்பட்டது.
- source_word: בְּאָזְנֵינוּ שָׁמַעְנוּ
  choice: எங்கள் காதுகளால் நாங்கள் கேட்டிருக்கிறோம்
  rationale: நேரடியாகக் கேட்டதை வலியுறுத்தும் எபிரெயச் சொற்றொடரின் உடல்சார் உருவகத்தைத் தக்கவைக்கிறது; தமிழிலும் தெளிவாகவும் இயல்பாகவும் உள்ளது.
- source_word: אֲבוֹתֵינוּ
  choice: எங்கள் தந்தையர்
  rationale: மூலத்தின் ஆண்பால் குடும்பச் சொல்லை முறையாகத் தக்கவைக்கிறது; இச்சூழலில் முன்னோர்களையும் குறிக்கக்கூடும் என்பதால் மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்பட்டது.
- source_word: סִפְּרוּ לָנוּ
  choice: எங்களுக்குச் சொல்லியிருக்கிறார்கள்
  rationale: தலைமுறையாக நிகழ்வை விவரித்துக் கடத்துவதை வெளிப்படுத்துகிறது; அதன் விளைவு நிகழ்காலத்திலும் தொடர்வதை நிறைவுநிலை வடிவம் உணர்த்துகிறது.
- source_word: פֹּעַל פָּעַלְתָּ
  choice: நீர் செய்த செயலை
  rationale: பெயர்ச்சொல்–வினைச்சொல் தொடர்பை இயன்றவரைத் தக்கவைத்து, தமிழில் இயல்பான சொற்றொடராக வழங்குகிறது.
- source_word: בִּימֵיהֶם
  choice: அவர்களுடைய நாட்களில்
  rationale: தந்தையரின் காலத்தைக் குறிக்கும் மூலத்தின் காலச் சொற்றொடரை நேரடியாகப் பிரதிபலிக்கிறது.
- source_word: בִּימֵי קֶדֶם
  choice: பண்டைய நாட்களில்
  rationale: தொலைந்த பழங்காலத்தைக் குறிக்கும் கவித்துவமான, ஆனால் இன்றைய வாசகருக்குத் தெளிவான தமிழாக்கம்.
theological_decisions:
- issue: தெய்வத்திடம் நேரடியாகப் பேசும் தொடக்கத்தின் வடிவம்
  choice: தேவனே
  alternative: தேவன், எங்கள் காதுகளால்...
  rationale: எபிரெயத்தில் தனி விளிப்பிடைச்சொல் இல்லாவிட்டாலும், பெயர்ச்சொல் நேரடி அழைப்பாக நிற்கிறது. தமிழில் ‘தேவனே’ என்பது எந்தக் கூடுதல் இறையியல் பொருளையும் புகுத்தாமல் அந்த இலக்கணப் பணியை இயல்பாக வெளிப்படுத்துகிறது.
- issue: אֲבוֹתֵינוּ என்பதன் பரப்பு
  choice: எங்கள் தந்தையர்
  alternative: எங்கள் முன்னோர்
  rationale: மூலத்தின் பாலினத்தைக் கொண்ட சொல்லை முதன்மை உரையில் தக்கவைத்தாலும், வரலாற்றைத் தலைமுறையாகக் கடத்திய முன்னோர்களை விரிவாகக் குறிக்கும் வாய்ப்பை அடிக்குறிப்பு பாதுகாக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழ்; எளிதில் புரியும், கண்ணியமான கவிதைநடை. இறைவனை நோக்கிய மரியாதை ஒருமையை வெளிப்படுத்த ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. எபிரெயச் செய்யுளின் இணை அமைப்பையும் கால அடுக்கையும் காட்ட வரிப்பிரிப்பு கையாளப்பட்டுள்ளது.
