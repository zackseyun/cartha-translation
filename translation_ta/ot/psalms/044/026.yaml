  text: ק֭וּמָֽ/ה עֶזְרָ֣תָ/ה לָּ֑/נוּ וּ֝/פְדֵ֗/נוּ לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/026.yaml
  text: Rise up as our help[c][b][a], and redeem us for the sake of your steadfast love.
translation:
  language: ta
  text: எங்களுக்கு உதவியாக எழுந்தருளும்[a]; உமது மாறாத அன்பின் பொருட்டு எங்களை மீட்டருளும்[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களுக்கு உதவ எழுந்தருளும்.” எபிரெயில் சொற்சொல்லாக, “எழும், எங்களுக்கு உதவி” என்று ‘உதவி’ பெயர்ச்சொல்லாக வருகிறது.
    reason: lexical_alternative
  - marker: b
    text: “மீட்டருளும்” என்பதற்கு “விடுவித்தருளும்” அல்லது “காப்பாற்றும்” என்றும் மொழிபெயர்க்கலாம்; எபிரெய வினை விலை கொடுத்து விடுவிப்பதையோ, தீர்மானமாகத் தலையிட்டு மீட்பதையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: c
    text: “மாறாத அன்பு” என்பது எபிரெய חסד (ஹெசெத்) என்பதற்கான மொழிபெயர்ப்பு; இது தேவனுடைய உறவிலும் உடன்படிக்கையிலும் வெளிப்படும் உண்மையுள்ள, பற்றுறுதியான அன்பை அடிக்கடி குறிக்கிறது.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: எழுந்தருளும்
  rationale: קום என்பதன் ஆண்பால் ஒருமை ஏவல் வடிவம், தேவன் செயல்பட வேண்டும் என்ற அவசர வேண்டுதலை வெளிப்படுத்துகிறது. தமிழில் கடவுளை நோக்கிய கண்ணியமான, இயல்பான வேண்டுகோளாக ‘எழுந்தருளும்’ அந்த வலிமையைப் பேணுகிறது.
- source_word: עֶזְרָתָה לָנוּ
  choice: எங்களுக்கு உதவியாக வாரும்
  rationale: עֶזְרָה என்பது வினை அல்ல, ‘உதவி’ என்ற பெயர்ச்சொல். ‘எங்களுக்கு உதவியாக வாரும்’ என்பது தமிழில் இயல்பாக இருக்கும்போதே, எபிரெய உரையின் பெயர்ச்சொல் அமைப்பையும் ‘எங்கள் சார்பான உதவி’ என்ற உறவுப் பொருளையும் இயன்றவரை காக்கிறது.
- source_word: וּפְדֵנוּ
  choice: எங்களை மீட்டருளும்
  rationale: פדה விலை கொடுத்து விடுவித்தல் அல்லது வல்லமையாகத் தலையிட்டு விடுவித்தல் ஆகிய பொருள் நிழல்களைக் கொண்டது. ‘மீட்டருளும்’ என்பது உடனடி விடுதலையையும் இறையியல் ஆழத்தையும் காக்கிறது; ஆனால் பின்னாளைய குறிப்பிட்ட கோட்பாடுகளை வசனத்திற்குள் திணிப்பதில்லை.
- source_word: לְמַעַן
  choice: பொருட்டு
  rationale: வேண்டுகோளுக்கான அடிப்படை அல்லது நோக்கத்தைச் சுட்டுகிறது. ‘பொருட்டு’ என்பது வெறும் காரணத்தைவிட, தேவனுடைய அன்பை முன்னிட்டு செய்யப்படும் விண்ணப்பத்தைச் சுருக்கமாகவும் துல்லியமாகவும் தெரிவிக்கிறது.
- source_word: חַסְדֶּךָ
  choice: உமது மாறாத அன்பு
  rationale: חסד அன்பு, விசுவாசம், உறுதியான பற்றுறுதி ஆகியவற்றை ஒருங்கே சுமக்கிறது. ‘மாறாத அன்பு’ சாதாரண வாசகருக்கு தெளிவாகவும் இயல்பாகவும் இருந்து, நிலைத்த உண்மையுள்ள அன்பின் கருத்தைப் பேணுகிறது.
theological_decisions:
- issue: פדה என்பதை குறிப்பிட்ட இறையியல் சொல்லாக மொழிபெயர்ப்பதா
  choice: எங்களை மீட்டருளும்
  alternative: எங்களை விடுவித்தருளும் / எங்களைக் காப்பாற்றும்
  rationale: சங்கீதத்தின் சூழலில் தேவனுடைய தீர்மானமான விடுதலையை ‘மீட்பு’ நன்றாகக் காக்கிறது. அதேவேளையில், செலுத்தப்பட்ட விலை அல்லது பிற்கால மீட்புக் கோட்பாடு இவ்வசனத்தில் வெளிப்படையாகக் கூறப்பட்டதாகச் சேர்க்கவில்லை.
- issue: חסד என்பதிலுள்ள உடன்படிக்கை சார்ந்த உண்மையையும் அன்பையும் எவ்வாறு காப்பது
  choice: உமது மாறாத அன்பு
  alternative: உமது உண்மையுள்ள அன்பு / உமது இரக்கம் / உமது உடன்படிக்கை அன்பு
  rationale: ‘மாறாத அன்பு’ உணர்ச்சிப்பூர்வமான அன்பையும் நிலைத்த விசுவாசத்தையும் இணைக்கிறது. ‘உடன்படிக்கை அன்பு’ பொருளை மிக வெளிப்படையாகத் தீர்மானிக்கக்கூடும்; ‘இரக்கம்’ மட்டும் விசுவாசமான பற்றுறுதியின் பரப்பைக் குறுக்கும்.
translation_notes:
  register: நவீன பொதுத் தமிழில் கண்ணியமான இறைவேண்டுதல் நடை பயன்படுத்தப்பட்டுள்ளது. ‘எழுந்தருளும்’, ‘வாரும்’, ‘மீட்டருளும்’ ஆகியவை மரியாதையைக் காக்கின்றன; அளவுக்கு மீறிய பழந்தமிழ் நடையைத் தவிர்க்கின்றன. எபிரெயின் பெயர்ச்சொல் அமைப்பு தமிழில் முற்றிலும் சொல்லுக்கு சொல் அமைந்தால் இயல்பிழக்கும் என்பதால், ‘உதவியாக வாரும்’ என உகந்த சமநிலைப் பெயர்ப்பு செய்யப்பட்டுள்ளது.
