base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: Awake! Why do you sleep[a], Lord? Rouse yourself; do not reject us forever.
translation:
  language: ta
  text: விழித்தெழுங்கள்! ஆண்டவரே, ஏன் தூங்குகிறீர்கள்? எழுந்திருங்கள்; எங்களை என்றென்றும் கைவிடாதீர்கள்.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “எங்களை என்றென்றும் தள்ளிவிடாதீர்கள்.”
    reason: זנח என்பதற்கு ‘தள்ளிவிடுதல், நிராகரித்தல்’ என்ற செல்லத்தக்க சொற்பொருள் மாற்று உள்ளது.
lexical_decisions:
- source_word: ע֤וּרָה
  choice: விழித்தெழுங்கள்!
  rationale: עוּר என்பதன் கட்டளை வடிவம். கடவுளை நோக்கிய துணிவான நேரடி அழைப்பையும் விழிப்பு உருவகத்தையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: לָמָּה
  choice: ஏன்
  rationale: புலம்பலின் காரணத்தை வினவும் வழக்கமான வினாவடை.
- source_word: תִישַׁן
  choice: தூங்குகிறீர்கள்
  rationale: ישׁן என்பதன் வினை வடிவம் இங்கு வினாவாக வருகிறது. கடவுள் தூங்குவதாகச் சொல்லும் மூல உருவகத்தை மென்மைப்படுத்தாமல் காக்கிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவரே
  rationale: கடவுளை நேரடியாக அழைக்கும் ஆண்டமைப் பட்டம்; விளிவேற்றுமை வடிவம் தமிழில் இயல்பான நேரடி அழைப்பைத் தருகிறது.
- source_word: הָקִיצָה
  choice: எழுந்திருங்கள்
  rationale: விழிப்பதற்கான இரண்டாவது கட்டளை. முதல் வினையிலிருந்து சொல்வேறுபாட்டைக் காத்து, எபிரெய இணை அமைப்பின் தீவிரப்படுத்தலை வெளிப்படுத்துகிறது.
- source_word: אַל
  choice: -ஆதீர்கள்
  rationale: அடுத்த வினையை மறுக்கும் தடைப் பொருளை மரியாதைப் பன்மை எதிர்மறைக் கட்டளையாகத் தமிழில் இயல்பாக வெளிப்படுத்துகிறது.
- source_word: תִּזְנַח
  choice: புறக்கணித்துவிடாதீர்கள்
  rationale: זנח என்பதன் நிராகரி, ஒதுக்கிவிடு என்ற பொருளை தெளிவான நவீனத் தமிழில் தருகிறது; ‘தள்ளிவிடாதீர்கள்’ என்பது சாத்தியமான மாற்றாக அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: לָנֶצַח
  choice: என்றென்றும்
  rationale: நிரந்தரமாக அல்லது முடிவில்லாமல் என்ற காலப் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது.
theological_decisions:
- issue: கடவுள் தூங்குவதும் விழித்தெழுவதுமான மனித உருவகம்
  choice: சங்கீதத்தின் நேரடியான தூக்கம்–விழிப்பு உருவகத்தை மொழிபெயர்ப்பில் அப்படியே வைத்தல்
  alternative: ‘ஆண்டவரே, ஏன் செயல்படாமல் இருப்பதுபோல் தோன்றுகிறீர்கள்?’ என்று உருவகத்தை விளக்கிப் பொருளாக்குதல்
  rationale: எபிரெயப் புலம்பல் கடவுளைத் துணிவுடன் நேரடியாக அழைக்கிறது. இது கடவுள் சொல்லர்த்தமாகத் தூங்குகிறார் என்ற கோட்பாட்டுக் கூற்று அல்ல; துன்பத்தின் நடுவிலுள்ள அனுபவத்தையும் வேண்டுதலின் இறையியல் பதற்றத்தையும் வெளிப்படுத்தும் உருவகம். ஆகவே அதை மென்மைப்படுத்தவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், வழிபாட்டுக்குரிய கண்ணியத்துடனும் சாதாரண வாசகர்களுக்குப் புரியும் நேரடித்தன்மையுடனும் மொழிபெயர்க்கப்பட்டது. கடவுளை நோக்கிய மரியாதையைத் தமிழின் மரியாதைப் பன்மை வினை வடிவங்கள் காட்டுகின்றன; மூலத்தின் துணிவான புலம்பலும் இணையான இரு விழிப்பு கட்டளைகளும் காக்கப்பட்டுள்ளன.
