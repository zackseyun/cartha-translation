lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: கடவுளில்
  rationale: בְּ இங்கு பெருமிதத்தின் அடிப்படையையும் பொருளையும் குறிக்கிறது; ‘கடவுளில்’ என்பது அந்த எபிரெயச் சொற்றொடரின் அமைப்பையும் இறைவனை மையமாகக் கொண்ட பொருளையும் காக்கிறது.
- source_word: הִלַּלְנוּ
  choice: பெருமிதம் கொள்கிறோம்
  rationale: הלל என்பதன் பியேல் வடிவம் ‘புகழ்தல்’ என்றும், בֵּאלֹהִים உடன் வரும்போது ‘கடவுளில் பெருமிதம்/மேன்மை பாராட்டுதல்’ என்றும் பொருள்படலாம். இச்சூழலில் ‘பெருமிதம் கொள்கிறோம்’ இயல்பாக உள்ளது; அகந்தையைக் குறிப்பதாகத் தவறாகப் புரிந்துகொள்ளாதபடி மாற்றுப் பொருள் அடிக்குறிப்பில் தரப்படுகிறது.
- source_word: כָל הַיּוֹם
  choice: நாள் முழுவதும்
  rationale: நாளெங்கும் தொடரும் கால அளவை இயல்பான நவீனத் தமிழில் நேரடியாகக் காட்டுகிறது.
- source_word: וְשִׁמְךָ
  choice: உமது பெயருக்கு
  rationale: எபிரெய மூலத்தில் ‘உமது பெயர்’ நன்றி செலுத்துதலின் நோக்காக வருகிறது. ‘உமது பெயருக்கு’ என்பது அந்தத் தொடர்பைத் தெளிவாகக் காக்கிறது.
- source_word: לְעוֹלָם
  choice: என்றென்றும்
  rationale: முடிவில்லாத அல்லது நிலைத்த காலத்தைக் குறிக்கும் இயல்பான, கண்ணியமான தமிழ்ச் சொல்.
- source_word: נוֹדֶה
  choice: நன்றி செலுத்துவோம்
  rationale: ידה என்பதன் ஹிஃபில் வடிவம் நன்றியுடன் ஏற்றுக்கூறுதல் அல்லது புகழ்தலைக் குறிக்கும். முதல் அடியின் சொல்லை மீண்டும் பயன்படுத்தாமல் அதன் நன்றியுணர்வு நுட்பத்தைப் பாதுகாக்கிறது; imperfect வடிவம் உறுதியான தொடரும் அறிவிப்பாக மொழிபெயர்க்கப்படுகிறது.
- source_word: סֶלָה
  choice: சேலா
  rationale: இவ்வழிபாட்டு அல்லது இசைக் குறியின் துல்லியமான பொருள் உறுதியற்றதால் ஊகித்து மொழிபெயர்க்காமல் ஒலிபெயர்க்கப்படுகிறது.
theological_decisions:
- issue: கடவுளில் ‘பெருமிதம் கொள்வது’ அகந்தையா அல்லது புகழ்ச்சியா
  choice: ‘கடவுளில் பெருமிதம் கொள்கிறோம்’ என வைத்து, புகழ்தல் என்ற பொருள் வாய்ப்பை அடிக்குறிப்பில் பாதுகாத்தல்
  alternative: ‘கடவுளைப் புகழ்கிறோம்’
  rationale: எபிரெய הלל மற்றும் בֵּאלֹהִים இணைப்பு புகழ்ச்சி மற்றும் களிப்பான பெருமிதம் ஆகிய இரு நுட்பங்களையும் தாங்கக்கூடும். மொழிபெயர்ப்பு பெருமிதத்தின் மையம் கடவுள் என்பதைக் காட்டி, உண்மையான சொற்பொருள் தெளிவின்மையை மறைக்கவில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், சங்கீதத்திற்குரிய கண்ணியமான தொனியுடன் வடிவமைக்கப்பட்டது. ‘உமது’ வழிபாட்டு மொழிக்குரிய மரியாதையைக் காக்கிறது; அரிதான அல்லது மிகப் பழமையான சொற்கள் தவிர்க்கப்பட்டுள்ளன. எல்லா அடிக்குறிப்பு குறிப்பான்களும் முதன்மை உரையில் சேர்க்கப்பட்டுள்ளன.
