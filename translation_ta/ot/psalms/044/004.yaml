source:
  edition: WLC
  text: אַתָּה ה֣וּא מַלְכִּ֣/י אֱלֹהִ֑ים צַ֝וֵּ֗ה יְשׁוּע֥וֹת יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/004.yaml
  text: You are my King[a], O God; command victories for Jacob.
translation:
  language: ta
  text: 'நீரே என் அரசர், கடவுளே;

    யாக்கோபுக்கு வெற்றிகளைக்[a] கட்டளையிடும்.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “வெற்றிகளைக்” என்பதற்கு “விடுதலைகளை” அல்லது “மீட்புகளை” என்றும் மொழிபெயர்க்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: நீரே
  rationale: இரு தனிப்பெயர்களும் சேர்ந்து தரும் வலியுறுத்தலை, இயல்பான தமிழில் ஏகாரத்துடன் கூடிய மரியாதை ஒருமையான ‘நீரே’ வெளிப்படுத்துகிறது.
- source_word: מַלְכִּי
  choice: என் அரசர்
  rationale: முதல் நபர் ஒருமை உடைமைப் பின்னொட்டைக் காத்து, கடவுளை நேரடியாக அழைக்கும் சூழலுக்கு ஏற்ற மரியாதை வடிவம் பயன்படுத்தப்பட்டுள்ளது.
- source_word: אֱלֹהִים
  choice: கடவுளே
  rationale: இங்கு இச்சொல் விளியாக வருவதால், தமிழ் விளிவேற்றுமையின் ‘ஏ’ இணைக்கப்பட்டுள்ளது.
- source_word: צַוֵּה
  choice: கட்டளையிடும்
  rationale: பியேல் கட்டளை வினையின் நேரடியான பொருளைக் காக்கும், கவிதைநடைக்கேற்ற மரியாதை ஒருமைக் கட்டளை வடிவம் இது; ‘நியமித்தருளும்’ போன்ற கூடுதல் கருத்து சேர்க்கப்படவில்லை.
- source_word: יְשׁוּעוֹת
  choice: வெற்றிகள்
  rationale: எதிரிகளையும் போரையும் பேசும் சங்கீதச் சூழலில், பன்மையான காப்பாற்றும் செயல்களைத் தெளிவாகக் குறிக்கும் சொல். ‘விடுதலைகள்’, ‘மீட்புகள்’ என்ற அடிப்படைப் பொருட்கள் அடிக்குறிப்பில் பாதுகாக்கப்பட்டுள்ளன.
- source_word: יַעֲקֹב
  choice: யாக்கோபு
  rationale: மூலத்தில் உள்ள மக்களைக் குறிக்கும் கவிதைப் பெயர் அப்படியே வைக்கப்பட்டுள்ளது; விளக்கமாக ‘இஸ்ரவேல்’ என்று மாற்றப்படவில்லை. நான்காம் வேற்றுமையில் ‘யாக்கோபுக்கு’ என வருகிறது.
theological_decisions:
- issue: போர்ச் சூழலில் יְשׁוּעוֹת என்பதன் பொருள்
  choice: வெற்றிகள்
  alternative: விடுதலைகள்; மீட்புகள்
  rationale: சுற்றியுள்ள வசனங்களின் தேசிய மற்றும் போர்ச் சூழல் ‘வெற்றிகள்’ என்பதை ஆதரிக்கிறது. இருப்பினும், எபிரெயச் சொல்லின் பரந்த இரட்சிப்பு/விடுதலைப் பொருள் அடிக்குறிப்பில் விடப்பட்டுள்ளது.
- issue: אֱלֹהִים என்பதன் இலக்கணப் பங்கு
  choice: ‘கடவுளே’ என்ற நேரடி அழைப்பு
  alternative: ‘என் அரசராகிய கடவுள்’ என்ற ஒட்டுப்பெயராக்கம்; ‘என் அரசர் கடவுள்’ என்ற கூற்று
  rationale: வாக்கிய அமைப்பும் ஜெபச் சூழலும் இதை நேரடி அழைப்பாகப் புரிந்துகொள்ளச் செய்கின்றன; தமிழ் விளிவடிவம் அந்தக் கவிதைத் தன்மையை இயல்பாகக் காக்கிறது.
translation_notes:
  register: நவீன வாசகருக்குப் புரியும் செம்மையான கவிதைநடை. கடவுளைச் சுட்டும் மரியாதை ஒருமையாக ‘நீர்’ பயன்படுத்தப்பட்டுள்ளது. மூலத்தின் சுருக்கம், வலியுறுத்தல், நேரடிக் கட்டளை ஆகியவை இயன்றவரை காக்கப்பட்டுள்ளன.
