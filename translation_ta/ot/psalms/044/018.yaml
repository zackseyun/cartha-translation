  yaml_path: translation/ot/psalms/044/018.yaml
  text: Our heart has not turned back[a], nor have our steps turned aside from your path.
translation:
  language: ta
  text: எங்கள் இதயம் பின்வாங்கவில்லை[a]; எங்கள் அடிகளும் உமது பாதையிலிருந்து விலகவில்லை.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘எங்கள் இதயம் பின்னோக்கிச் செல்லவில்லை; எங்கள் காலடிகள் உமது வழியைவிட்டு பிறழவுமில்லை.’
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסוֹג אָחוֹר
  choice: பின்வாங்கவில்லை
  rationale: סוג என்பதன் பின்வாங்குதல் அல்லது திரும்பிச் செல்லுதல் என்ற பொருளையும், אָחוֹר வலுப்படுத்தும் பின்னோக்கிய இயக்கத்தையும் இயல்பான தமிழில் ஒரே வினையாக வெளிப்படுத்துகிறது.
- source_word: לִבֵּנוּ
  choice: எங்கள் இதயம்
  rationale: எபிரேய மொழியில் இது மனம், சித்தம், உள்ளார்ந்த பற்றுறுதி ஆகியவற்றை உள்ளடக்கும் உள்ளான மனிதனைச் சுட்டுகிறது; ‘இதயம்’ என்ற உருவகத்தை அப்படியே காக்கிறது.
- source_word: וַתֵּט
  choice: விலகவுமில்லை
  rationale: נטה என்பதன் சாய்தல் அல்லது வழியைவிட்டு விலகுதல் என்ற கருத்தை, பாதை உருவகத்துக்கு ஏற்ற இயல்பான தமிழில் தருகிறது.
- source_word: אֲשֻׁרֵינוּ
  choice: எங்கள் அடிகள்
  rationale: உடல் உறுப்பான கால்களைவிட நடைகள் அல்லது அடிகள் என்பதே மூலச்சொல்லின் இயக்கத்தையும் பாதை உருவகத்தையும் துல்லியமாகக் காக்கிறது.
- source_word: מִנִּי אָרְחֶךָ
  choice: உமது பாதையிலிருந்து
  rationale: מִנִּי குறிக்கும் பிரிவையும், אֹרַח குறிக்கும் பாதை அல்லது வாழ்க்கை வழி உருவகத்தையும் நேரடியாக வெளிப்படுத்துகிறது.
theological_decisions:
- issue: ‘இதயம்’ என்ற மனித இயல்பு சார்ந்த உருவகம்
  choice: ‘எங்கள் இதயம்’ என்று உருவகத்தைத் தக்கவைத்தல்
  alternative: ‘எங்கள் மனம்’ அல்லது ‘எங்கள் பற்றுறுதி’
  rationale: ‘மனம்’ என்பது அறிவுசார் பொருளாகவும் ‘பற்றுறுதி’ என்பது விளக்கவுரையாகவும் பொருளைக் குறுக்கக்கூடும். ‘இதயம்’ என்பது சித்தம், எண்ணம், பற்றுறுதி ஆகியவற்றை உள்ளடக்கும் மூலத்தின் பரந்த பொருளையும் கவித்துவத் தொடர்ச்சியையும் காக்கிறது.
translation_notes:
  register: நவீன நிலையான தமிழில் எளிதில் புரியும், கவித்துவமும் கண்ணியமும் கொண்ட நடை. இறைவனை நோக்கிய இரண்டாம் நபர் மரியாதை வடிவமாக ‘உமது’ பயன்படுத்தப்பட்டுள்ளது; இணையான எதிர்மறை வாக்கிய அமைப்பு பாதுகாக்கப்பட்டுள்ளது.
