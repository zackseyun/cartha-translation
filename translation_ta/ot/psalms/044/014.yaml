  register: நவீனத் தரமான, மரியாதைமிக்க தமிழ் பயன்படுத்தப்பட்டுள்ளது. எபிரெயக் கவிதையின் இரு இணைவரிகளும் ‘நாடுகள்/மக்களினங்கள்’ மற்றும் ‘பழமொழி/தலையசைப்பு’ என்ற வேறுபாடுகளுடன் பாதுகாக்கப்பட்டுள்ளன.
