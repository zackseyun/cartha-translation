id: PSA.44.14
reference: Psalms 44:14
language:
  code: ta
  name: Tamil
  native_name: தமிழ்
  variant: modern standard Tamil
source:
  edition: WLC
  text: תְּשִׂימֵ֣/נוּ מָ֭שָׁל בַּ/גּוֹיִ֑ם מְנֽוֹד רֹ֝֗אשׁ בַּל אֻמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/014.yaml
  text: You make us a proverb among the nations[b][a], a shaking of the head among the peoples.
translation:
  language: ta
  text: 'நாடுகளிடையே எங்களை ஒரு பழமொழியாக்குகிறீர்[a];

    மக்களினங்களிடையே எங்களைத் தலையசைப்புக்கு ஆளாக்குகிறீர்[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “நாடுகளிடையே இகழ்ச்சிப் பேச்சாக.” எபிரெயச் சொல் பழமொழியையோ, இகழ்ச்சியாக வழங்கும் வழக்குச் சொல்லையோ குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: சொல்லுக்குச் சொல், “தலையசைப்பு.” இது ஏளனம் அல்லது இகழ்ச்சியைக் காட்டும் ஒரு சைகை.
    reason: cultural_note
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: எங்களை ... ஆக்குகிறீர்
  rationale: שׂים என்பதன் ‘வை, ஏற்படுத்து, ஆக்கு’ என்ற விளைவுசார் பொருளை இயல்பான தமிழில் தெரிவிக்கிறது; இரண்டாம் நபர் ஆண்பால் ஒருமை வடிவம் கடவுளை நேரடியாக விளிப்பதை மரியாதைப் பன்மையால் காட்டுகிறது.
- source_word: מָשָׁל
  choice: ஒரு பழமொழி
  rationale: இச்சொல் பழமொழி, வழக்குச் சொல், அல்லது இகழ்ச்சிக்குரிய எடுத்துக்காட்டு என்பதைக் குறிக்கலாம். ‘பழமொழி’ அதன் அடிப்படை உருவகத்தைத் தக்கவைக்கிறது; இகழ்ச்சியின் நிழற்பொருள் இணைவரியாலும் அடிக்குறிப்பாலும் தெளிவாகிறது.
- source_word: בַּגּוֹיִם
  choice: நாடுகளிடையே
  rationale: גּוֹיִם இங்கு பொதுவாக அயல் நாடுகள் அல்லது பிற தேச மக்களைக் குறிக்கிறது; பிற்காலத் தொழில்நுட்பப் பொருளைச் சேர்க்காமல் கவிதையின் பரப்பைத் தக்கவைக்கிறது.
- source_word: מְנוֹד רֹאשׁ
  choice: தலையசைப்புக்கு ஆளாக்குகிறீர்
  rationale: இகழ்ச்சி அல்லது ஏளனத்தை வெளிப்படுத்தும் தலையசைவு என்ற எபிரெய உருவகத்தை இயல்பான தமிழில் பாதுகாக்கிறது.
- source_word: בַּל אֻמִּים
  choice: மக்களினங்களிடையே
  rationale: முந்தைய ‘நாடுகளிடையே’ என்பதுடன் உள்ள கவிதை இணைநிலையைப் பாதுகாத்தபடி, אֻמִּים என்பதன் ‘மக்கள் கூட்டங்கள்/மக்களினங்கள்’ என்ற பொருளை வேறுபடுத்திக் காட்டுகிறது.
