  text: יִ֥תְיַצְּב֨וּ מַלְכֵי אֶ֗רֶץ וְ/רוֹזְנִ֥ים נֽוֹסְדוּ יָ֑חַד עַל יְ֝הוָה וְ/עַל מְשִׁיחֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
translation:
  language: ta
  text: பூமியின் அரசர்கள் அணிவகுத்து நிற்கிறார்கள்; ஆட்சியாளர்கள் ஒன்றுகூடி[a], யாவேக்கும்[b] அவரால் அபிஷேகம் செய்யப்பட்டவருக்கும் எதிராக நிற்கிறார்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, “ஆட்சியாளர்கள் ஒன்றாகத் தங்களை அணிதிரட்டுகிறார்கள்,” அல்லது “ஒன்றாக ஆலோசனை செய்கிறார்கள்.” எபிரேயச் சொற்றொடர் எதிர்ப்பில் ஒருங்கிணைந்து செயல்படுவதைக் குறிக்கிறது.
    reason: lexical_alternative
  - marker: b
    text: அல்லது, “கர்த்தருக்கும்.” இங்கு மூல எபிரெயத்தில் யாவே என்ற தெய்வீகப் பெயர் உள்ளது.
    reason: alternative_reading
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: அணிவகுத்து நிற்கிறார்கள்
  rationale: ஹித்பயேல் வடிவம் தாமாகவே திட்டமிட்டு ஒரு நிலைப்பாட்டை எடுப்பதைக் குறிக்கிறது. தமிழில் ‘அணிவகுத்து நிற்கிறார்கள்’ என்பது ஒருங்கிணைந்த எதிர்ப்பு நிலையை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: מַלְכֵי אֶרֶץ
  choice: பூமியின் அரசர்கள்
  rationale: இணைப்புத் தொடர் நேரடியாக ‘பூமியின் அரசர்கள்’ எனப் பொருள்படும்; சங்கீதத்தின் உலகளாவிய அரசியல் சூழலுக்கும் இது பொருந்துகிறது.
- source_word: רוֹזְנִים
  choice: ஆட்சியாளர்கள்
  rationale: உயர் அதிகாரிகளையும் அரசியல் தலைவர்களையும் குறிக்கும் சொல்லுக்கு, பழமையான நடையின்றி பரந்த பொருளைத் தரும் நவீன தமிழ்ச் சொல்.
- source_word: נוֹסְדוּ יָחַד
  choice: ஒன்றுகூடி
  rationale: எதிர்ப்பில் இணைந்து ஒருங்கிணைந்த நடவடிக்கை எடுப்பதே இங்கு மையம். ‘சதிசெய்து’ என்று வலுப்படுத்தாமல் எபிரெயச் சொல்லின் பொருள் விரிவை இது காக்கிறது.
- source_word: עַל
  choice: எதிராக
  rationale: இச்சூழலில் இந்த முன்னிடைச்சொல் பகைமை மற்றும் எதிர்ப்பைக் குறிக்கிறது.
- source_word: יְהוָה
  choice: யாவே
  rationale: தெய்வீகப் பெயரை ஒரு பட்டப்பெயரால் மாற்றாமல், எபிரெய நான்கெழுத்துப் பெயரின் பரவலாக ஏற்கப்பட்ட ஒலிபெயர்ப்பைத் தமிழில் தருகிறது.
- source_word: מְשִׁיחוֹ
  choice: அவரால் அபிஷேகம் செய்யப்பட்டவர்
  rationale: எபிரெயச் சொல் அடிப்படையாக ‘அவருடைய அபிஷேகம் பெற்றவர்’ என்பதைக் குறிக்கிறது. உடனடி அரசச் சூழலையும் விரிந்த மேசிய எதிரொலியையும் முன்கூட்டியே ஒன்றாகத் தீர்மானிக்காமல், நேரடிப் பொருளை முதன்மை உரையில் காக்கிறது.
theological_decisions:
- issue: מְשִׁיחוֹ என்பதன் உடனடி அரசப் பொருளும் விரிந்த மேசியப் பொருளும்
  choice: அவரால் அபிஷேகம் செய்யப்பட்டவர்
  alternative: அவருடைய மேசியா
  rationale: இங்கு எபிரெயம் முதலில் யாவே அபிஷேகம் செய்த அரசரைக் குறிக்கக்கூடும்; வேதாகமத்தின் விரிந்த வாசிப்பில் மேசியப் பொருளும் உள்ளது. ‘அபிஷேகம் செய்யப்பட்டவர்’ இரு அடுக்குகளையும் காக்கிறது; ‘மேசியா’ என்ற விளக்கமான தலைப்பை மட்டும் திணிப்பதில்லை.
- issue: יְהוָה என்ற தெய்வீகப் பெயரை வழங்குதல்
  choice: யாவே
  alternative: கர்த்தர்
  rationale: மூலத்தில் தனிப்பட்ட தெய்வீகப் பெயர் இருப்பதால் அதை ஒலிபெயர்ப்பது உரைக்கு நெருக்கமானது; வழக்கமான பட்டப்பெயர் அடிக்குறிப்பில் தரப்படுகிறது.
translation_notes:
  register: நவீனத் தரத் தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான கவிதைநடை பயன்படுத்தப்பட்டுள்ளது. ‘அணிவகுத்து நிற்கிறார்கள்’ மற்றும் இறுதியில் வரும் ‘எதிராக நிற்கிறார்கள்’ என்ற அமைப்பு எபிரெயக் கவிதையின் எதிர்ப்பு இயக்கத்தைத் தெளிவாக்குகிறது; அடிக்குறி குறியீடுகள் அனைத்தும் முதன்மை உரையில் இடம்பெற்றுள்ளன.
