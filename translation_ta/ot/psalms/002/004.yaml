lexical_decisions:
- source_word: יוֹשֵׁב
  choice: அரியணையில் அமர்ந்திருப்பவர்
  rationale: இந்த எபிரெயப் பங்கேற்புவினை அடிப்படையில் ‘அமர்ந்திருப்பவர்’ என்று பொருள்படும். கலகம் செய்யும் அரசர்களைப் பற்றிய சங்கீதச் சூழலில், கடவுளின் அரசாட்சியையும் இறையாண்மையையும் வெளிப்படுத்தும் வகையில் ‘அரியணையில்’ என்பது இயல்பாகச் சேர்க்கப்பட்டுள்ளது; அடிக்குறிப்பில் நேரடியான மாற்று தரப்பட்டுள்ளது.
- source_word: בַּשָּׁמַיִם
  choice: வானங்களில்
  rationale: שָׁמַיִם என்பதன் பன்மை வடிவத்தையும் உயர்ந்த கவிதை நடையையும் ‘வானங்களில்’ தக்கவைக்கிறது.
- source_word: יִשְׂחָק
  choice: சிரிக்கிறார்
  rationale: யிக்தோல் வடிவம் இங்கு உயிரோட்டமான நிகழ்காலமாகப் புரிந்துகொள்ளப்படுகிறது. ஏளனத் தொனி அடுத்த வினையாலும் சூழலாலும் தெளிவாகிறது; எனவே அடிப்படைப் பொருளான ‘சிரிக்கிறார்’ பாதுகாக்கப்படுகிறது.
- source_word: אֲדֹנָי
  choice: ஆண்டவர்
  rationale: இது יהוה என்ற திருப்பெயர் அல்ல, אֲדֹנָי என்ற தெய்வீகப் பட்டம். நவீன தரமான தமிழ் வேதாகம நடையில் ‘ஆண்டவர்’ இயல்பானதும் கண்ணியமானதும் ஆகும்.
- source_word: יִלְעַג
  choice: ஏளனம் செய்கிறார்
  rationale: לעג என்பது கேலி அல்லது இகழ்ச்சியுடன் ஏளனம் செய்வதைக் குறிக்கிறது. ‘ஏளனம் செய்கிறார்’ தெளிவான நவீன தமிழில் அதன் வலிமையை வெளிப்படுத்துகிறது.
- source_word: לָמוֹ
  choice: அவர்களை
  rationale: முந்தைய வசனங்களில் வரும் கலகக்கார நாடுகளையும் அரசர்களையும் இந்தப் பிரதிப்பெயர் குறிக்கிறது. தமிழில் ‘அவர்களை ஏளனம் செய்கிறார்’ இயல்பான கட்டமைப்பு.
theological_decisions:
- issue: கடவுளை அரசராகவும் மனிதச் செயல்களுடன் உருவகப்படுத்தியும் காட்டுதல்
  choice: ‘அரியணையில் அமர்ந்திருப்பவர்’ என்ற அரசாட்சித் தொனியை வெளிப்படுத்தி, ‘சிரிக்கிறார்’, ‘ஏளனம் செய்கிறார்’ என்ற உயிரோட்டமான உருவக மொழியை அப்படியே பாதுகாத்தல்
  alternative: ‘வானங்களில் அமர்ந்திருப்பவர் சிரிக்கிறார்; ஆண்டவர் அவர்களைப் பார்த்து நகைக்கிறார்’
  rationale: கலகம் செய்யும் ஆட்சியாளர்களுக்கு மேலான கடவுளின் இறையாண்மையையும் அவர்கள்மீதான இகழ்ச்சியையும் வசனம் சித்தரிக்கிறது. இந்த உருவகத்தை மழுங்கடிக்காமலும் அதன் இறையியல் பதற்றத்தை விளக்கவுரையாக மாற்றாமலும் மொழிபெயர்ப்பு பாதுகாக்கிறது.
