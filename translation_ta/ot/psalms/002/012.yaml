source:
  edition: WLC
  text: נַשְּׁקוּ בַ֡ר פֶּן יֶאֱנַ֤ף וְ/תֹ֬אבְדוּ דֶ֗רֶךְ כִּֽי יִבְעַ֣ר כִּ/מְעַ֣ט אַפּ֑/וֹ אַ֝שְׁרֵ֗י כָּל ח֥וֹסֵי בֽ/וֹ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
translation:
  language: ta
  text: மகனை முத்தமிடுங்கள்[a][b]; இல்லையெனில் அவர் கோபம் கொள்வார், நீங்கள் வழியில் அழிந்துபோவீர்கள். ஏனெனில் அவரது கோபம் விரைவில் பற்றியெரியும்[c]. அவரிடம் அடைக்கலம் புகுகிற அனைவரும் பேறுபெற்றவர்கள்.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘மகனுக்கு மரியாதை செலுத்துங்கள்.’ ‘முத்தமிடுங்கள்’ என்ற வினை, அரசச் சூழலில் கீழ்ப்படிதலையும் மரியாதையையும் வெளிப்படுத்தும் செயலைக் குறிக்கலாம்.
    reason: lexical_alternative
  - marker: b
    text: இங்குள்ள எபிரேயச் சொல் பார் (bar) வழக்கத்திற்கு மாறானது. சங்கீதம் 2:7-க்கு ஏற்றபடி இது பொதுவாக ‘மகன்’ என்று கொள்ளப்படுகிறது; ஆனால் ‘தூய்மை’ அல்லது ‘தூய்மையாக’ போன்ற வேறு விளக்கங்களும் முன்வைக்கப்பட்டுள்ளன.
    reason: alternative_reading
  - marker: c
    text: அல்லது, ‘அவரது கோபம் சிறிதளவு மட்டுமே பற்றியெரியும்’ / ‘அவரது கோபம் சிறிது நேரத்தில் பற்றியெரியும்.’ எபிரேயச் சொற்றொடர் திடீர்த் தன்மையையோ குறுகிய காலத்தையோ சிறிய அளவையோ வலியுறுத்தக்கூடும்.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְּׁקוּ
  choice: முத்தமிடுங்கள்
  rationale: נשׁק என்பதன் அடிப்படைப் பொருள் ‘முத்தமிடுதல்’. அரசச் சூழலில் இது கீழ்ப்படிதல் அல்லது மரியாதை செலுத்தும் செயலாக அமையலாம்; எனினும் எபிரேய உருவகத்தைப் பாதுகாக்க நேரடிப் பொருள் முதன்மை உரையில் வைக்கப்படுகிறது.
- source_word: בַר
  choice: மகனை
  rationale: இவ்விடத்தில் בר வழக்கத்திற்கு மாறானதும் விவாதத்திற்குரியதும் ஆகும். சங்கீதம் 2:7-இன் ‘மகன்’ மொழியும் அரசச் சூழலும் ‘மகன்’ என்ற பொருளை வலுப்படுத்துகின்றன; பிற சாத்தியங்கள் அடிக்குறிப்பில் தரப்படுகின்றன.
- source_word: פֶּן יֶאֱנַף
  choice: இல்லையெனில் அவர் கோபங்கொள்வார்
  rationale: פֶּן எச்சரிக்கையான எதிர்மறை விளைவைச் சுட்டுகிறது; אנף கோபங்கொள்வதைக் குறிக்கிறது. நவீன தமிழில் இயல்பான எச்சரிக்கை அமைப்பாக மொழிபெயர்க்கப்பட்டது.
- source_word: וְתֹאבְדוּ דֶרֶךְ
  choice: நீங்கள் வழியிலேயே அழிந்துபோவீர்கள்
  rationale: אבד அழிதல் அல்லது மாண்டுபோதலைக் குறிக்கிறது. דֶרֶךְ முன்சொல் இன்றிச் சுருக்கமாக இருப்பதால், ஒருவர் செல்லும் பாதையிலேயே அழிவதை உணர்த்தும் ‘வழியிலேயே’ தேர்ந்தெடுக்கப்பட்டது.
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  choice: ஏனெனில் அவரது கோபம் விரைவில் பற்றியெரியும்
  rationale: יבער பற்றுதல் அல்லது எரிதல் என்ற நெருப்பு உருவகத்தைக் கொண்டது; כמעט ‘சிறிது’ அல்லது ‘விரைவில்’ என்ற கால/அளவு நுட்பத்தைத் தரலாம். உடனடித் தன்மையைத் தெளிவாகச் சொல்லும் வாசகம் முதன்மை உரையில் வைக்கப்பட்டு, மாற்று நுட்பம் அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
- source_word: אַשְׁרֵי
  choice: பேறுபெற்றோர்
  rationale: சங்கீதங்களின் வாழ்த்துரை வடிவத்தைத் தமிழில் கண்ணியமாகவும் இயல்பாகவும் வெளிப்படுத்துகிறது; வெறும் மனநிலையான ‘மகிழ்ச்சி’ என்பதைக் காட்டிலும் நல்வாழ்வு மற்றும் இறை அருள் சார்ந்த விரிவான பொருளைப் பேணுகிறது.
- source_word: כָּל חוֹסֵי בוֹ
  choice: அவரிடம் அடைக்கலம் புகுகிற அனைவரும்
  rationale: חסה பாதுகாப்புக்காகத் தஞ்சம் அல்லது அடைக்கலம் புகுவதைக் குறிக்கிறது. ‘அடைக்கலம் புகுதல்’ என்ற சொற்றொடர் பாதுகாப்பு உருவகத்தை நேரடியாகப் பேணுகிறது.
theological_decisions:
- issue: சங்கீதம் 2:12-இல் בַר என்பவரின் அடையாளம்
  choice: சங்கீதம் 2:7-இன் அரச மகன் மொழியுடன் தொடர்ச்சியாக ‘மகன்’ என்று மொழிபெயர்க்கப்பட்டது.
  alternative: ‘தூய்மை’ என்ற பெயர்ச்சொல்லாகவோ ‘தூய்மையாக’ என்ற வினையடையாகவோ கொள்ளுதல்; அல்லது தீர்மானிக்க இயலாத மொழியியல் சிக்கலாகக் கருதுதல்.
  rationale: உடனடி இலக்கியச் சூழல் அரச/மகன் குறியீட்டை வலுவாக ஆதரிக்கிறது. ஆயினும் இச்சொல் எபிரேயத்தில் வழக்கத்திற்கு மாறானதால், மாற்றுக் கருத்துகள் நீக்கப்படாமல் அடிக்குறிப்பில் பதிவு செய்யப்படுகின்றன; பின்னாளைய கோட்பாட்டு முடிவுகள் வசனத்தில் புகுத்தப்படவில்லை.
- issue: כמעט என்பதன் கால அல்லது அளவு நுட்பம்
  choice: கோபம் விரைவில் பற்றியெரியும் என்று, திடீர் மற்றும் நெருங்கிய வெடிப்பை முதன்மைப்படுத்தியது.
  alternative: ‘அவரது கோபம் சிறிதளவே பற்றியெரிந்தாலும்’ அல்லது ‘சிறிது நேரத்தில் பற்றியெரியும்’.
  rationale: எபிரேயச் சொற்றொடர் சுருக்கமானதும் இருபொருள் நுட்பமுடையதும் ஆகும். முதன்மை உரை இயல்பான தமிழில் உடனடித் தன்மையைத் தருகிறது; அளவு/கால மாற்று அடிக்குறிப்பில் பாதுகாக்கப்படுகிறது.
translation_notes:
  register: நவீன நிலையான தமிழில், கவிதைக்குரிய கண்ணியத்துடன் மொழிபெயர்க்கப்பட்டது. ‘முத்தமிடுங்கள்’, ‘பற்றியெரியும்’, ‘அடைக்கலம் புகுகிற’ ஆகியவை மூலத்தின் தெளிவான உருவகங்களைப் பேணுகின்றன. அனைத்து அடிக்குறிப்பு குறிகளும் தொடர்புடைய சொற்றொடர்களுக்குப் பின் முதன்மை உரையில் இடம்பெற்றுள்ளன.
