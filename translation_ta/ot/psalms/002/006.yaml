lexical_decisions:
- source_word: וַאֲנִי
  choice: ஆனால் நானோ
  rationale: இணைப்புச்சொல்லுடன் வரும் தனிப்பட்ட சுட்டுப்பெயர், கலகம் செய்யும் நாடுகளுக்கும் ஆட்சியாளர்களுக்கும் எதிராக ஆண்டவரின் செயலை வலியுறுத்துகிறது. ‘ஆனால் நானோ’ என்பது எதிர்மறை ஒப்பீட்டையும் வலியுறுத்தலையும் இயல்பான நவீனத் தமிழில் காக்கிறது.
- source_word: נָסַכְתִּי
  choice: நிறுவியிருக்கிறேன்
  rationale: இங்கு அரசனை அரச பதவியில் அமர்த்துதல் அல்லது நிலைநிறுத்துதல் என்ற பொருள் பொருத்தமானது. ‘நிறுவியிருக்கிறேன்’ என்பது அரச நியமனத்தின் வலிமையைத் தெரிவிக்கிறது; அதே நேரத்தில் அபிஷேகச் சடங்கை மட்டும் கட்டாயமாகக் குறிக்கவில்லை.
- source_word: מַלְכִּי
  choice: என் அரசனை
  rationale: முதலாம் நபர் ஒருமை உடைமைப் பின்னொட்டை நேரடியாகக் காட்டுகிறது. தேவையற்ற விளக்கவுரை அல்லது தனிப்பட்ட இறையியல் பொருளைச் சேர்க்காமல் பொதுப்பெயராகவே மொழிபெயர்க்கப்பட்டுள்ளது.
- source_word: עַל
  choice: சீயோனில்
  rationale: இடப்பெயருடன் வரும் עַל இங்கு அரசன் நிறுவப்பட்ட இடத்தைக் குறிக்கிறது. தமிழில் ‘சீயோனில்’ என்பது இயல்பாகவும் தெளிவாகவும் உள்ளது; ஆட்சிப் பரப்பைக் குறிக்கும் ‘சீயோன்மேல்’ என்ற தவறான எண்ணத்தையும் தவிர்க்கிறது.
- source_word: צִיּוֹן
  choice: சீயோன்
  rationale: இடப்பெயரின் தமிழில் நிலைபெற்ற ஒலிபெயர்ப்பு பயன்படுத்தப்பட்டுள்ளது.
- source_word: הַר קָדְשִׁי
  choice: என் பரிசுத்த மலையாகிய
  rationale: ‘என் பரிசுத்த மலை’ என்ற எபிரெயக் கட்டமைப்பை இயல்பான தமிழில் வழங்குகிறது; ‘மலையாகிய’ என்பது சீயோனையும் மலையையும் தெளிவாக இணைக்கிறது.
theological_decisions:
- issue: נָסַכְתִּי என்பது அபிஷேகச் சடங்கையா அல்லது அரச பதவியில் நிறுவுதலையா குறிக்கிறது?
  choice: அரச பதவியில் நிறுவுதல் — ‘நிறுவியிருக்கிறேன்’
  alternative: ‘ஏற்படுத்தியிருக்கிறேன்’ அல்லது ‘அபிஷேகம் செய்திருக்கிறேன்’
  rationale: உடனடிச் சூழலில், கலகம் செய்யும் அரசர்களுக்கு மறுமொழியாகத் தாம் தேர்ந்தெடுத்த அரசனைச் சீயோனில் நிலைநிறுத்தியதாக ஆண்டவர் அறிவிக்கிறார். ‘நிறுவியிருக்கிறேன்’ என்பது அரியணையில் அமர்த்தும் கருத்தைப் பாதுகாக்கிறது; அபிஷேகத்திற்கு வழக்கமாகப் பயன்படும் வேறு எபிரெய வினையுடன் இதைக் கலக்கவில்லை. இதனால் மேசியாவைப் பற்றிய விரிந்த வேதவாசிப்புக்கு இடமிருக்கிறது; ஆனால் அந்த வாசிப்பை மொழிபெயர்ப்பிலேயே கட்டாயப்படுத்துவதில்லை.
translation_notes:
  register: நவீன நிலையான தமிழில், பொதுவாசகர்களுக்குப் புரியும் கண்ணியமான நடையில் மொழிபெயர்க்கப்பட்டுள்ளது. ‘ஆனால் நானோ’ என்ற வடிவம் எதிர்மறை ஒப்பீட்டையும் தெய்வீக அறிவிப்பின் வலியுறுத்தலையும் காக்கிறது. வாக்கிய அமைப்பு தமிழில் இயல்பாக இருக்க இடப்பகுதி வினைக்கு முன் வைக்கப்பட்டுள்ளது.
