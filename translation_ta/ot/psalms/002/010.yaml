source:
  edition: WLC
  text: וְ֭/עַתָּה מְלָכִ֣ים הַשְׂכִּ֑ילוּ הִ֝וָּסְר֗וּ שֹׁ֣פְטֵי אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/010.yaml
  text: So now[a], O kings, be wise; be warned, O judges of the earth.
translation:
  language: ta
  text: ஆகவே இப்போது, அரசர்களே, ஞானமாக நடந்துகொள்ளுங்கள்; பூமியின் நீதிபதிகளே, எச்சரிக்கையை ஏற்றுக்கொள்ளுங்கள்[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: அல்லது, ‘அறிவுரையை ஏற்றுக்கொள்ளுங்கள்’ அல்லது ‘திருத்தத்தை ஏற்றுக்கொள்ளுங்கள்.’ எபிரெய வினைச்சொல் எச்சரிக்கையை மட்டுமல்ல, ஒழுக்கப் பயிற்சி, அறிவுரை அல்லது கண்டித்துத் திருத்துதல் ஆகியவற்றைப் பெற்றுக்கொள்வதையும் குறிக்கலாம்.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: ஆகவே இப்போது
  rationale: முந்தைய அறிவிப்பிலிருந்து இந்த அறிவுரைக்கு வரும் முடிவுசார் தொடர்பையும் ‘இப்போது’ என்ற காலப்பொருளையும் இயல்பான தமிழில் காக்கிறது.
- source_word: מְלָכִים
  choice: அரசர்களே
  rationale: எபிரெய உரையில் தனி விளிப்பிடைச்சொல் இல்லாவிட்டாலும், இது நேரடி அழைப்பு; ‘-ஏ’ விகுதி அதனை இயல்பாக வெளிப்படுத்துகிறது.
- source_word: הַשְׂכִּילוּ
  choice: ஞானமாக நடந்துகொள்ளுங்கள்
  rationale: שכל என்பதன் ஹிஃபில் கட்டளை வடிவம் நடைமுறையில் வெளிப்படும் விவேகமான புரிதலைக் கோருகிறது. வெறும் அறிவைப் பெறுதல் என்பதைக் காட்டிலும் செயல்வழி ஞானத்தை இத்தேர்வு தெளிவாகக் காட்டுகிறது.
- source_word: הִוָּסְרוּ
  choice: எச்சரிக்கையை ஏற்றுக்கொள்ளுங்கள்
  rationale: יסר என்பதன் நிஃபால் கட்டளை வடிவம் அறிவுரை, கண்டிப்பு அல்லது திருத்தத்தைப் பெற்றுக்கொள்வதைக் குறிக்கலாம். இச்சங்கீதத்தின் அரசர்களுக்கான கடுமையான அறிவுறுத்தல் சூழலில் ‘எச்சரிக்கையை ஏற்றுக்கொள்ளுங்கள்’ இயல்பாகவும் அவசரத் தொனியுடனும் உள்ளது.
- source_word: שֹׁפְטֵי אָרֶץ
  choice: பூமியின் நீதிபதிகளே
  rationale: שֹׁפְטֵי என்பதன் நீதிவழங்கும் அதிகாரிகள் என்ற குறிப்பான பொருளைக் காக்கிறது; சங்கீதம் 2-ன் உலகளாவிய சூழலால் אָרֶץ என்பதற்கு ‘பூமி’ பொருத்தமானது.
