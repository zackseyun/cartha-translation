  yaml_path: translation/ot/psalms/002/008.yaml
  text: Ask of me[a], and I will give the nations as your inheritance, and the ends of the earth as your possession.
translation:
  language: ta
  text: என்னிடம் கேள்; நாடுகளை உன் மரபுரிமையாகவும், பூமியின் கடைக்கோடுகளை[a] உன் உடைமையாகவும் தருவேன்.
  philosophy: optimal-equivalence
  footnotes:
