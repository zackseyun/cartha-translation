lexical_decisions:
- source_word: שְׁאַל מִמֶּנִּי
  choice: என்னிடம் கேள்
  rationale: שְׁאַל என்பது இரண்டாம் நபர் ஆண்பால் ஒருமை கட்டளை; מִמֶּנִּי கேட்கப்படுபவரைக் குறிக்கிறது. நவீனத் தமிழில் இயல்பாகவும் நேரடியாகவும் இருப்பதால் இவ்வாறு மொழிபெயர்க்கப்பட்டது.
- source_word: וְאֶתְּנָה
  choice: தருவேன்
  rationale: கட்டளையைத் தொடர்ந்து வரும் נתן வினையின் விருப்ப/உறுதியளிப்பு வடிவம் இங்கு வாக்குறுதியான பதிலைத் தருகிறது. தமிழ் வாக்கிய அமைப்பில் இணைப்பை இரட்டிக்காமல் இறுதியில் ‘தருவேன்’ என அமைப்பது இயல்பானது.
- source_word: גּוֹיִם
  choice: நாடுகளை
  rationale: இச்சொல் மக்கள் இனங்களையோ நாடுகளையோ குறிக்கலாம். சங்கீதத்தின் அரசாட்சி மற்றும் உலகளாவிய சூழலில் ‘நாடுகள்’ பொருத்தமானது; பிற்கால யூதர்–புறவினர் வேறுபாட்டைச் சேர்ப்பதில்லை.
- source_word: נַחֲלָתֶךָ
  choice: உன் பரம்பரைச் சொத்தாக
  rationale: נַחֲלָה மரபுரிமையாக அல்லது பங்காகக் கிடைக்கும் உடைமையைக் குறிக்கிறது. ‘பரம்பரைச் சொத்து’ என்பது அத்தகைய உரிமையையும் அடுத்துள்ள ‘உடைமை’ என்பதிலிருந்து உள்ள வேறுபாட்டையும் தெளிவாகக் காட்டுகிறது.
- source_word: וַאֲחֻזָּתְךָ
  choice: உன் உடைமையாக
  rationale: אֲחֻזָּה கைப்பற்றிய அல்லது உரிமையுள்ள உடைமையைக் குறிக்கிறது. இணைவாக்கியத்தில் ‘பரம்பரைச் சொத்து’ என்பதுடன் இயல்பான ஒத்திசைவைப் பேணுகிறது.
- source_word: אַפְסֵי אָרֶץ
  choice: பூமியின் கடைக்கோடுகளை
  rationale: இந்த எபிரெய மரபுத்தொடர் பூமியின் எல்லைகள் அல்லது மிகத் தொலைவான பகுதிகளைக் குறிக்கிறது. ‘கடைக்கோடுகள்’ கவித்துவமான, புரிந்துகொள்ளத்தக்க சுருக்கமான மொழிபெயர்ப்பு.
theological_decisions:
- issue: வாக்குறுதியின் அரச/மேசியானிய பரப்பு
  choice: உரையாடப்படுகிற மகன்/அரசனுக்கு அளிக்கப்படும் உலகளாவிய ஆட்சிவாக்குறுதியாக வசனத்தை நேரடியாக மொழிபெயர்த்தல்
  alternative: மேசியாவை வெளிப்படையாகப் பெயரிட்டுப் பொருள் விரித்தல்
  rationale: எபிரெய மூலவசனம் நாடுகளையும் பூமியின் கடைக்கோடுகளையும் மகன்/அரசனுக்கு அளிப்பதாகக் கூறுகிறது; கிறிஸ்தவத் திருமுறை வாசிப்பில் உள்ள மேசியானிய நிறைவேற்றத்தை மொழிபெயர்ப்புக்குள் வெளிப்படையாகச் சேர்க்காமல், உரையின் திறந்த தன்மையும் இறையியல் அழுத்தமும் பாதுகாக்கப்படுகின்றன.
translation_notes:
  register: நவீன பொதுத்தமிழில் இயல்பாகவும், சங்கீதத்தின் உயர்ந்த அரசக் கவிதை நடையைப் பேணும் வகையிலும் வடிவமைக்கப்பட்டது. ஒருமை ஆண்பால் உரையாடலைத் தமிழின் இயல்பான ‘உன்’ வடிவம் பிரதிபலிக்கிறது. அடிக்குறிப்பு குறியீடு மாற்றுச் சொல்லாக்கம் பொருந்தும் சொற்றொடருக்குப் பின்னர் வைக்கப்பட்டுள்ளது.
